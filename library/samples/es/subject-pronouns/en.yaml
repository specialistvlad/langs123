# Los pronombres personales de sujeto in English: translations keyed by the ids of source.yaml, and a fact for English readers.
language: en
nativeReview: false
text:
  title: Subject pronouns
  def: Subject pronouns, such as {term yo} and {term tú}, name who does the action, and Spanish often leaves them out.

  ess.yo: the person speaking
  ess.tu: the person listening, informally
  ess.usted: the person listening, politely
  ess.el: another man
  ess.ella: another woman
  ess.nosotros: me and other people
  ess.nosotras: me and other women
  ess.vosotros: you and other people
  ess.vosotras: you and other women
  ess.ustedes: "{variant es-419 the people listening} {variant es-ES the people listening, politely}"
  ess.ellos: other men, or a group of men and women
  ess.ellas: other women
  ess.hablo.ex: I speak Spanish.
  ess.contraste.ex: I work and you study.
  ess.llueve.ex: It's raining.

  personas.title: "Grammatical person"
  personas.fact.1: "Subject pronouns change with the person: the one speaking, the one listening, or someone else."
  personas.fact.2: "They change with the number too: one person or several."
  personas.col.persona: Person
  personas.col.singular: Singular
  personas.col.plural: Plural
  personas.primera.name: first person
  personas.segunda.name: second person
  personas.usted.name: second person, polite
  personas.tercera.name: third person
  personas.ana: I'm Ana, and he's Pedro.
  personas.medica: She's a doctor, and he's a teacher.
  personas.chile:
    - "We're from Chile."
    - "And you?"

  genero.title: Masculine and feminine
  genero.fact.1: "In the plural, {term nosotras} and {term ellas} name a group of women only."
  genero.fact.2: "A group with at least one man takes the masculine form: {term nosotros}, {term ellos}."
  genero.nosotras: "{term Nosotras}: me and other women, when a woman speaks."
  genero.nosotras.ex: "We're making dinner, and they're laying the table."
  genero.nosotros: "{term Nosotros}: me and other people, with at least one man among them."
  genero.nosotros.ex: We're walking, and they're taking a taxi.
  genero.ellas: "{term Ellas}: other women."
  genero.ellas.ex: "The men arrive today, and the women tomorrow."
  genero.ellos: "{term Ellos}: other men, or a group of men and women."
  genero.ellos.ex: They work and we rest.

  tu-usted.title: "{term Tú} and {term usted}"
  tu-usted.fact.1: "{term Tú} is used between people who are close: with friends, family and children."
  tu-usted.fact.2: "{term Usted} shows respect: with older people, with strangers and with a boss or a client."
  tu-usted.fact.3: "{term Usted} takes the verb of {term él} and {term ella}."
  tu-usted.senora: How are you, Mrs García?
  tu-usted.gracias:
    - "Fine, thanks, Ana."
    - "And you?"
  tu-usted.profesor: Are you the English teacher?
  tu-usted.why.1: "{term Usted} comes from {l1 es vuestra merced}, an old form of respect."
  tu-usted.why.2: "So it takes the verb of {term él} and {term ella}."
  tu-usted.vos.1: "In Argentina, Uruguay, Paraguay and much of Central America, {term vos} takes the place of {term tú}."
  tu-usted.vos.sos: Are you from here?

  ustedes-vosotros.title: "{term Ustedes} and {term vosotros}"
  ustedes-vosotros.america.1: "In Latin America, {term ustedes} is the plural of both {term tú} and {term usted}."
  ustedes-vosotros.espana.1: "In Spain, {term vosotros} and {term vosotras} are the plural of {term tú}, and {term ustedes} is the plural of {term usted}."
  ustedes-vosotros.fact.1: "{term Ustedes} takes the verb of {term ellos} and {term ellas}."
  ustedes-vosotros.aqui: Are you from here?
  ustedes-vosotros.sois: Are you from here?

  sin-pronombre.title: The verb without a pronoun
  sin-pronombre.fact.1: The ending of the verb already says who does the action.
  sin-pronombre.fact.2: So the pronoun usually goes unsaid.
  sin-pronombre.o: "{term -o} is {term yo}."
  sin-pronombre.o.ex: I speak Spanish.
  sin-pronombre.as: "{term -as} is {term tú}."
  sin-pronombre.as.ex: "Do you speak Spanish?"
  sin-pronombre.mos: "{term -mos} is {term nosotros} or {term nosotras}."
  sin-pronombre.mos.ex: We have lunch at two.

  con-pronombre.title: When the pronoun is said
  con-pronombre.fact.1: The pronoun is said when the verb alone is not enough.
  con-pronombre.contraste: "To compare two people."
  con-pronombre.contraste.ex: I work and you study.
  con-pronombre.aclarar: "To tell whether it is {term usted}, {term él} or {term ella}."
  con-pronombre.aclarar.ex: Do you speak English?
  con-pronombre.solo: Without a verb, in a short answer.
  con-pronombre.solo.ex: Who wants coffee? Me.

  cosas.title: Things, weather and time
  cosas.fact.1: For things, the weather and the time, the verb goes without a subject pronoun.
  cosas.llueve: It's raining.
  cosas.tarde: It's late.
  cosas.mesa: Where's the book? On the table.

  err.ello.right: It's late.
  err.ello.rule: For the weather and the time, the verb stands alone, with no pronoun.
  err.ello.en: "English puts {l1 en it} as the subject: {l1 en it's late}."
  err.ello.fr: "French puts {l1 fr il} as the subject: {l1 fr il est tard}."
  err.ello.de: "German puts {l1 de es} as the subject: {l1 de es ist spät}."
  err.usted-tu.right: Do you have children?
  err.usted-tu.rule: "{term Usted} takes the verb of {term él} and {term ella}."
  err.usted-tu.en: "English has one word, {l1 en you}, for both {term tú} and {term usted}."

  ess.vos: "the person listening, informally"
  sin-pronombre.es: "{term -es} is {term tú}."
  sin-pronombre.es.ex: "Do you live here?"
blocks:
  - id: en.tu-usted.you
    in: tu-usted
    after: tu-usted.example
    type: fact
    text:
      - { id: en.tu-usted.you.1, text: "English has one word, you, for {term tú}, {term usted} and {term ustedes}." }
  - id: en.tu-usted.you-example
    in: tu-usted
    after: tu-usted.example
    type: example
    items:
      - { id: en.tu-usted.profesor, text: "¿{target Usted} es el profesor de inglés?", tr: "Are you the English teacher?" }
  - id: en.tu-usted.vosotros
    in: tu-usted
    after: tu-usted.example
    type: fact
    variety: es-ES
    text:
      - { id: en.tu-usted.vosotros.1, text: "English also says you for {term vosotros}." }
