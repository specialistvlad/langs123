# Los pronombres personales de sujeto in Ukrainian: translations keyed by the ids of source.yaml, and a fact for Ukrainian readers.
language: uk
nativeReview: false
text:
  title: Особові займенники в ролі підмета
  def: "Займенники в ролі підмета, як-от {term yo} і {term tú}, називають того, хто виконує дію, і часто їх не вимовляють."

  ess.yo: той, хто говорить
  ess.tu: той, до кого звертаються на «ти»
  ess.usted: той, до кого звертаються на «ви» з повагою
  ess.el: інший чоловік
  ess.ella: інша жінка
  ess.nosotros: я та інші люди
  ess.nosotras: я та інші жінки
  ess.vosotros: ти та інші люди
  ess.vosotras: ти та інші жінки
  ess.ustedes: "{variant es-419 ті, до кого звертаються} {variant es-ES ті, до кого звертаються з повагою}"
  ess.ellos: інші чоловіки або група чоловіків і жінок
  ess.ellas: інші жінки
  ess.hablo.ex: Я розмовляю іспанською.
  ess.contraste.ex: Я працюю, а ти навчаєшся.
  ess.llueve.ex: Іде дощ.

  personas.title: Особи
  personas.fact.1: Займенники-підмети змінюються за особою, тобто це той, хто говорить, той, хто слухає, чи інша особа.
  personas.fact.2: "Вони змінюються і за числом: одна особа чи кілька."
  personas.col.persona: Особа
  personas.col.singular: Однина
  personas.col.plural: Множина
  personas.primera.name: перша особа
  personas.segunda.name: друга особа
  personas.usted.name: друга особа, з повагою
  personas.tercera.name: третя особа
  personas.ana: Я Ана, а він Педро.
  personas.medica: Вона лікарка, а він учитель.
  personas.chile: Ми з Чилі, а ви?

  genero.title: Чоловічий і жіночий рід
  genero.fact.1: "У множині {term nosotras} і {term ellas} називають групу, де лише жінки."
  genero.fact.2: "Група, де є хоча б один чоловік, бере чоловічу форму: {term nosotros}, {term ellos}."
  genero.nosotras: "{term Nosotras}: я та інші жінки, коли говорить жінка."
  genero.nosotras.ex: "Ми готуємо вечерю, а вони накривають на стіл."
  genero.nosotros: "{term Nosotros}: я та інші люди, серед яких є хоча б один чоловік."
  genero.nosotros.ex: Ми йдемо пішки, а вони їдуть на таксі.
  genero.ellas: "{term Ellas}: інші жінки."
  genero.ellas.ex: "Чоловіки приїжджають сьогодні, а жінки — завтра."
  genero.ellos: "{term Ellos}: інші чоловіки або група чоловіків і жінок."
  genero.ellos.ex: Вони працюють, а ми відпочиваємо.

  tu-usted.title: Tú і usted
  tu-usted.fact.1: "{term Tú} вживають у неформальному спілкуванні: з друзями, з родиною і з дітьми."
  tu-usted.fact.2: "{term Usted} вживають із повагою: зі старшими, з незнайомими людьми і з керівником чи клієнтом."
  tu-usted.fact.3: "{term Usted} вживається з тим самим дієсловом, що й {term él} та {term ella}."
  tu-usted.senora: Як ваші справи, пані Гарсіє?
  tu-usted.gracias: "Добре, дякую, Ано, а ти?"
  tu-usted.profesor: Ви викладач англійської?
  tu-usted.why.1: "{term Usted} походить від {term vuestra merced}, давньої шанобливої форми звертання."
  tu-usted.why.2: "Тому воно вживається з тим самим дієсловом, що й {term él} та {term ella}."
  tu-usted.vos.1: "В Аргентині, Уругваї, Парагваї та значній частині Центральної Америки замість {term tú} кажуть {term vos}."
  tu-usted.vos.sos: Ти звідси?

  ustedes-vosotros.title: Ustedes і vosotros
  ustedes-vosotros.america.1: "У Латинській Америці {term ustedes} — це множина і від {term tú}, і від {term usted}."
  ustedes-vosotros.espana.1: "В Іспанії {term vosotros} і {term vosotras} — множина від {term tú}, а {term ustedes} — множина від {term usted}."
  ustedes-vosotros.fact.1: "{term Ustedes} вживається з тим самим дієсловом, що й {term ellos} та {term ellas}."
  ustedes-vosotros.aqui: Ви звідси?
  ustedes-vosotros.sois: Ви звідси?

  sin-pronombre.title: Дієслово без займенника
  sin-pronombre.fact.1: Закінчення дієслова вже каже, хто виконує дію.
  sin-pronombre.fact.2: Тому займенник зазвичай не вимовляють.
  sin-pronombre.o: "{term -o} — це {term yo}."
  sin-pronombre.o.ex: Я розмовляю іспанською.
  sin-pronombre.as: "{term -as} — це {term tú}."
  sin-pronombre.as.ex: "Ти розмовляєш іспанською?"
  sin-pronombre.mos: "{term -mos} — це {term nosotros} або {term nosotras}."
  sin-pronombre.mos.ex: Ми обідаємо о другій.

  con-pronombre.title: Коли займенник вимовляють
  con-pronombre.fact.1: Займенник вимовляють, коли самого дієслова не досить.
  con-pronombre.contraste: "Щоб порівняти двох людей."
  con-pronombre.contraste.ex: Я працюю, а ти навчаєшся.
  con-pronombre.aclarar: "Щоб зрозуміти, чи це {term usted}, {term él} чи {term ella}."
  con-pronombre.aclarar.ex: Ви розмовляєте англійською?
  con-pronombre.solo: Без дієслова, у короткій відповіді.
  con-pronombre.solo.ex: — Хто хоче кави? — Я.

  cosas.title: Речі, погода і час
  cosas.fact.1: Коли йдеться про речі, погоду і час, дієслово вживають без займенника-підмета.
  cosas.llueve: Іде дощ.
  cosas.tarde: Уже пізно.
  cosas.mesa: — Де книжка? — На столі.

  err.ello.right: Уже пізно.
  err.ello.rule: Коли йдеться про погоду і час, дієслово стоїть саме, без займенника.
  err.ello.en: "Англійська ставить it як підмет: it's late."
  err.ello.fr: "Французька ставить il як підмет: il est tard."
  err.ello.de: "Німецька ставить es як підмет: es ist spät."
  err.usted-tu.right: У вас є діти?
  err.usted-tu.rule: "{term Usted} вживається з тим самим дієсловом, що й {term él} та {term ella}."
  err.usted-tu.en: Англійська має одне слово, you, і для tú, і для usted.

  ess.vos: "той, до кого звертаються на «ти»"
  sin-pronombre.es: "{term -es} — це {term tú}."
  sin-pronombre.es.ex: "Ти тут живеш?"
blocks:
  - id: uk.tu-usted.usted
    in: tu-usted
    after: tu-usted.example
    type: fact
    text:
      - { id: uk.tu-usted.usted.1, text: "Українське «ви» одній людині з повагою — це {term usted}." }
  - id: uk.tu-usted.usted-example
    in: tu-usted
    after: tu-usted.example
    type: example
    items:
      - { id: uk.tu-usted.profesor, text: "¿{target Usted} es el profesor de inglés?", tr: "Ви викладач англійської?" }
  - id: uk.tu-usted.ustedes
    in: tu-usted
    after: tu-usted.example
    type: fact
    variety: es-419
    text:
      - { id: uk.tu-usted.ustedes.1, text: "Українське «ви» кільком людям — це {term ustedes}." }
  - id: uk.tu-usted.ustedes-example
    in: tu-usted
    after: tu-usted.example
    type: example
    variety: es-419
    items:
      - { id: uk.tu-usted.aqui, text: "¿{target Ustedes} son de aquí?", tr: "Ви звідси?" }
  - id: uk.tu-usted.vosotros
    in: tu-usted
    after: tu-usted.example
    type: fact
    variety: es-ES
    text:
      - { id: uk.tu-usted.vosotros.1, text: "Українське «ви» кільком близьким людям — це {term vosotros}, а з повагою — {term ustedes}." }
  - id: uk.tu-usted.vosotros-example
    in: tu-usted
    after: tu-usted.example
    type: example
    variety: es-ES
    items:
      - { id: uk.tu-usted.sois, text: "¿{target Vosotros} sois de aquí?", tr: "Ви звідси?" }
