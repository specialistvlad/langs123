# Words of place in Japanese: translations keyed by the ids of source.yaml, and a note for Japanese readers.
language: ja
nativeReview: false
text:
  title: 場所を表す前置詞
  def: "場所を表す前置詞は、{term in}や{term under}のような短い語で、ものがどこにあるかを表します。"

  ess.in.ex: ボールは箱の中にあります。
  ess.on.ex: ボールは箱の上にあります。
  ess.under.ex: ボールは箱の下にあります。
  ess.front.ex: ボールは箱の前にあります。
  ess.behind.ex: ボールは箱の後ろにあります。
  ess.next.ex: ボールは箱の隣にあります。
  ess.near.ex: ボールは箱の近くにあります。
  ess.between.ex: ボールは箱と箱の間にあります。
  ess.above.ex: ボールは箱の上の方にあります。
  ess.below.ex: ボールは箱より下にあります。
  ess.opposite.ex: ボールは箱の向かいにあります。
  ess.inside.ex: ボールは箱の内側にあります。
  ess.outside.ex: ボールは箱の外にあります。
  ess.underneath.ex: ボールは箱の下にあります。
  ess.beneath.ex: ボールは箱の下にあります。

  in-on-under.title: "In、on、under"
  in-on-under.fact.1: "この3つの語は、ものが別のものの中にあるか、上にあるか、それより下にあるかを表します。"
  in: "{term In}は、周りを囲まれた空間の中を表します：箱、かばん、部屋、町。"
  in.ex: 鍵はかばんの中にあります。
  on: "{term On}は、別のものにくっついている位置を表します：テーブル、壁、床。"
  on.ex: スマホはテーブルの上にありますよ。
  under: "{term Under}は、別のものより下で、多くはそれに覆われている位置を表します。"
  under.ex: 猫はベッドの下にいます。

  front-behind.title: "In front of、behind"
  front-behind.fact.1: "{term In front of}と{term behind}は、ものが別のものの前にあるか、後ろにあるかを表します。"
  front-behind.fact.2: "{term In front of}は3語で1つの前置詞として働きます。"
  front: "{term In front of}は、別のものの正面側を表します。"
  front.ex: バス停は学校の前にあります。
  behind: "{term Behind}は、別のものの後ろ側を表します。"
  behind.ex: 庭は家の裏にあります。

  next-near.title: "Next to、near"
  next-near.fact.1: "{term Next to}と{term near}は、ものが別のものにどのくらい近いかを表します。"
  next-near.fact.2: "どちらも名詞のすぐ前に置きます：{term next to the door}、{term near the station}。"
  next: "{term Next to}は、別のもののすぐ横の、とても近い位置を表します。"
  next.ex: 私の隣に座ってください。
  near: "{term Near}は、少し離れた近くの位置を表します。"
  near.ex: 駅の近くに住んでいます。

  between.title: "Between"
  between.fact.1: "{term Between}は、両側に1つずつものがある、その間の位置を表します。"
  between-item: "{term Between}は、2つのものを{term and}でつなぎます。"
  between.ex: 銀行はカフェと店の間にあります。

  above-below.title: "Above、below"
  above-below.fact.1: "{term Above}と{term below}は、ものが別のものより高い所か低い所にあり、間に空間があることを表します。"
  above: "{term Above}は、別のものより高い位置を表します。"
  above.ex: テーブルの上にランプが下がっています。
  below: "{term Below}は、別のものより低い位置を表します。"
  below.ex: 台所は私の部屋の下にあります。
  above-below.why.1: "{term On}と{term under}は接していてもよく、{term above}と{term below}は間に空間を残します。"

  opposite.title: "Opposite"
  opposite.fact.1: "{term Opposite}は、通りやテーブル、部屋をはさんで、別のものと向かい合う位置を表します。"
  opposite-item: "{term Opposite}は名詞のすぐ前に置き、アメリカでは{term across from}がふつうです。"
  opposite.ex: 銀行はホテルの向かいにあります。

  inside-outside.title: "Inside、outside"
  inside-outside.fact.1: "{term Inside}と{term outside}は、ものが場所の壁や囲いの内側にあるか、外側にあるかを表します。"
  inside: "{term Inside}は、壁や囲いが周りをすべて囲んでいることを{term in}よりはっきり表します。"
  inside.ex: 家の中は暖かいです。
  outside: "{term Outside}は、場所の壁のすぐ外を表します。"
  outside.ex: "ホテルの外にタクシーが止まっています。"

  underneath.title: "Underneath"
  underneath.fact.1:
    - "{term Underneath}は{term under}と同じ意味です。"
    - "上のものが下のものを覆ったり隠したりしていることを表します。"
  underneath-item: "{term Underneath}は、見つけたものや隠れたものによく使います。"
  underneath.ex: "鍵は新聞の下で見つかりました。"

  beneath.title: "Beneath"
  beneath.fact.1: "{term Beneath}は{term under}と同じ意味で、書き言葉や改まった話し言葉で使います。"
  beneath-item: "{term Beneath}は、地面、川、海のような大きなものによく使います。"
  beneath.ex: トンネルは川の下を通っています。

  err.near-of.right: 駅の近くに住んでいます。
  err.near-of.rule: "{term Near}は名詞のすぐ前に置き、{term of}は付けません。"
  err.behind-of.right: 庭は家の裏にあります。
  err.behind-of.rule: "{term Behind}は名詞のすぐ前に置き、{term of}は付けません。"
  err.in-front-opposite.right: 銀行はホテルの向かいにあります。
  err.in-front-opposite.rule:
    - "通りをはさんで向かい合う位置は{term {variant en-GB opposite} {variant en-US across from}}です。"
    - "{term In front of}は同じ側です。"
  err.in-table.right: 本はテーブルの上にあります。
  err.in-table.rule:
    - "表面の上にあるときは、英語では{term on}と言います。"
    - "{term In}は囲まれた空間の中です。"
  err.on-photo.right: 写真に写っているのは誰ですか。
  err.on-photo.rule: "写真や絵に写っているものは、英語では{term in}で表します。"

  above-below.why.2: "そのため、ランプはテーブルの上の方に下がり、カップはテーブルの上に置かれます。"
  err.near-of.es: "スペイン語ではcerca deと、deを付けて言います。"
  err.near-of.pt: "ポルトガル語ではperto deと、deを付けて言います。"
  err.near-of.fr: "フランス語ではprès deと、deを付けて言います。"
  err.behind-of.es: "スペイン語ではdetrás deと、deを付けて言います。"
  err.behind-of.pt: "ポルトガル語ではatrás deと、deを付けて言います。"
  err.in-front-opposite.es: "スペイン語のenfrente deは「向かい」の意味で、in front ofに似ています。"
  err.in-front-opposite.pt: "ポルトガル語のem frente deは「向かい」と「前」の両方の意味です。"
  err.in-front-opposite.fr: "フランス語のen face deは「向かい」の意味で、in front ofに似ています。"
  err.in-front-opposite.it: "イタリア語のdi fronte aは「向かい」の意味で、in front ofに似ています。"
  err.in-table.es: "スペイン語のenは、inとonの両方を表します。"
  err.in-table.pt: "ポルトガル語のemは、inとonの両方を表します。"
  err.in-table.tr: "トルコ語は、inとonの両方を1つの語尾-daか-deで表します。"
  err.in-table.id: "インドネシア語のdiは、inとonの両方を表します。"
  err.in-table.ja: "日本語の「に」は、inかonかを言わずに場所を表します。"
  err.on-photo.uk: "ウクライナ語では「на фото」と、onに当たるнаを使います。"
  err.on-photo.pl: "ポーランド語ではna zdjęciuと、onに当たるnaを使います。"
  err.on-photo.de: "ドイツ語ではauf dem Fotoと、onに当たるaufを使います。"
  err.on-photo.fr: "フランス語ではsur la photoと、onに当たるsurを使います。"

blocks:
  - id: ja.in-on-under.fact
    in: in-on-under
    after: in-on-under.list
    type: fact
    text:
      - { id: ja.in-on-under.fact.1, text: "日本語では、場所を表す語は名詞の後ろに来ます：「箱の中に」「箱の上に」。" }
      - { id: ja.in-on-under.fact.2, text: "英語では、前置詞が名詞の前に来ます：{term in the box}、{term on the box}。" }
