# Words of place in Ukrainian: translations keyed by the ids of source.yaml, and a note for Ukrainian readers.
language: uk
nativeReview: false
text:
  title: Прийменники місця
  def: "Прийменники місця — це короткі слова, як-от {term in} і {term under}, що вказують, де щось розташоване."

  ess.in.ex: М’яч у коробці.
  ess.on.ex: М’яч на коробці.
  ess.under.ex: М’яч під коробкою.
  ess.front.ex: М’яч перед коробкою.
  ess.behind.ex: М’яч за коробкою.
  ess.next.ex: М’яч поруч із коробкою.
  ess.near.ex: М’яч недалеко від коробки.
  ess.between.ex: М’яч між коробками.
  ess.above.ex: М’яч над коробкою.
  ess.below.ex: М’яч нижче від коробки.
  ess.opposite.ex: М’яч навпроти коробки.
  ess.inside.ex: "М’яч усередині будинку."
  ess.outside.ex: М’яч поза коробкою.
  ess.underneath.ex: "М’яч під тканиною."
  ess.beneath.ex: М’яч під коробкою.

  in-on-under.title: "In, on, under"
  in-on-under.fact.1: "Ці три слова вказують, чи щось в іншій речі, на ній чи нижче від неї."
  in: "{term In} вказує, що щось у просторі, оточеному стінками: у коробці, у сумці, у кімнаті, у місті."
  in.ex: Мої ключі в сумці.
  on: "{term On} вказує, що щось на іншій речі і між ними немає простору: на столі, на стіні, на підлозі."
  on.ex: Твій телефон на столі.
  under: "{term Under} вказує, що щось нижче від іншої речі, часто так, що та річ його накриває."
  under.ex: Кіт під ліжком.

  front-behind.title: "In front of, behind"
  front-behind.fact.1: "{term In front of} і {term behind} вказують, чи щось спереду, чи позаду іншої речі."
  front-behind.fact.2: "{term In front of} — це три слова, що діють як одне."
  front: "{term In front of} вказує, що щось з переднього боку іншої речі."
  front.ex: Автобусна зупинка перед школою.
  behind: "{term Behind} вказує, що щось позаду іншої речі."
  behind.ex: Сад за будинком.

  next-near.title: "Next to, near"
  next-near.fact.1: "{term Next to} і {term near} вказують, наскільки щось близько до іншої речі."
  next-near.fact.2: "Обидва стоять просто перед іменником: {term next to the door}, {term near the station}."
  next: "{term Next to} вказує, що щось просто збоку від іншої речі, зовсім близько."
  next.ex: Сідай поруч зі мною.
  near: "{term Near} вказує, що щось неподалік."
  near.ex: Я живу біля вокзалу.

  between.title: "Between"
  between.fact.1: "{term Between} вказує, що щось у просторі, де з кожного боку по одній речі."
  between-item: "{term Between} поєднує дві речі словом {term and}."
  between.ex: Банк між кав’ярнею і магазином.

  above-below.title: "Above, below"
  above-below.fact.1: "{term Above} і {term below} вказують, що щось вище або нижче від іншої речі і між ними є простір."
  above: "{term Above} вказує, що щось вище від іншої речі."
  above.ex: Над столом висить лампа.
  below: "{term Below} вказує, що щось нижче від іншої речі."
  below.ex: Кухня під моєю кімнатою.
  above-below.why.1: "{term On} і {term under} можуть торкатися того, що називають, а {term above} і {term below} залишають простір."

  opposite.title: "Opposite"
  opposite.fact.1: "{term Opposite} вказує, що щось через простір від іншої речі, обличчям до неї: через вулицю, стіл чи кімнату."
  opposite-item: "{term Opposite} стоїть просто перед іменником, а в США звичне слово — {term across from}."
  opposite.ex: Банк навпроти готелю.

  inside-outside.title: "Inside, outside"
  inside-outside.fact.1: "{term Inside} і {term outside} вказують, чи щось у межах стін або стінок місця, чи поза ними."
  inside: "{term Inside} вказує, що стіни чи стінки оточують щось з усіх боків, виразніше, ніж {term in}."
  inside.ex: У будинку тепло.
  outside: "{term Outside} вказує, що щось одразу за стінами місця."
  outside.ex: Біля готелю стоїть таксі.

  underneath.title: "Underneath"
  underneath.fact.1: "{term Underneath} означає {term under} і вказує, що річ зверху накриває або ховає те, що під нею."
  underneath-item: "{term Underneath} часто називає щось знайдене або сховане."
  underneath.ex: "Я знайшов свої ключі під газетою."

  beneath.title: "Beneath"
  beneath.fact.1: "{term Beneath} означає {term under} у писемній і офіційній мові."
  beneath-item: "{term Beneath} часто називає щось велике: землю, річку, море."
  beneath.ex: Тунель проходить під річкою.

  err.near-of.right: Я живу біля вокзалу.
  err.near-of.rule: "{term Near} стоїть просто перед іменником, без {term of}."
  err.behind-of.right: Сад за будинком.
  err.behind-of.rule: "{term Behind} стоїть просто перед іменником, без {term of}."
  err.in-front-opposite.right: Банк навпроти готелю.
  err.in-front-opposite.rule: "Через вулицю, обличчям одне до одного, — це {term {variant en-GB opposite} {variant en-US across from}}; {term in front of} — на тому самому боці."
  err.in-table.right: Книжка на столі.
  err.in-table.rule: "На поверхні англійською кажуть {term on}; {term in} — усередині простору зі стінками."
  err.on-photo.right: Хто на фото?
  err.on-photo.rule: "Про те, що зображено на фото чи картині, англійською кажуть {term in}."

  above-below.why.2: "Тому лампа висить над столом, а чашка стоїть на ньому."
  err.near-of.es: "Іспанською кажуть {l1 es cerca de}, з {l1 es de}."
  err.near-of.pt: "Португальською кажуть {l1 pt perto de}, з {l1 pt de}."
  err.near-of.fr: "Французькою кажуть {l1 fr près de}, з {l1 fr de}."
  err.behind-of.es: "Іспанською кажуть {l1 es detrás de}, з {l1 es de}."
  err.behind-of.pt: "Португальською кажуть {l1 pt atrás de}, з {l1 pt de}."
  err.in-front-opposite.es: "Іспанське {l1 es enfrente de} означає {l1 uk навпроти} і схоже на {term in front of}."
  err.in-front-opposite.pt: "Португальське {l1 pt em frente de} означає і {l1 uk навпроти}, і {l1 uk перед}."
  err.in-front-opposite.fr: "Французьке {l1 fr en face de} означає {l1 uk навпроти} і схоже на {term in front of}."
  err.in-front-opposite.it: "Італійське {l1 it di fronte a} означає {l1 uk навпроти} і схоже на {term in front of}."
  err.in-table.es: "Іспанське {l1 es en} означає і {l1 uk в}, і {l1 uk на}."
  err.in-table.pt: "Португальське {l1 pt em} означає і {l1 uk в}, і {l1 uk на}."
  err.in-table.tr: "У турецькій і {l1 uk в}, і {l1 uk на} передає одне закінчення, {l1 tr -da} або {l1 tr -de}."
  err.in-table.id: "Індонезійське {l1 id di} означає і {l1 uk в}, і {l1 uk на}."
  err.in-table.ja: "У японській {l1 ja に} позначає місце, не кажучи, {l1 uk в} чи {l1 uk на}."
  err.on-photo.uk: "Українською кажуть {l1 uk на фото}, з {l1 uk на}, що означає {term on}."
  err.on-photo.pl: "Польською кажуть {l1 pl na zdjęciu}, з {l1 pl na}, що означає {term on}."
  err.on-photo.de: "Німецькою кажуть {l1 de auf dem Foto}, з {l1 de auf}, що означає {term on}."
  err.on-photo.fr: "Французькою кажуть {l1 fr sur la photo}, з {l1 fr sur}, що означає {term on}."

blocks:
  - id: uk.above-below.fact
    in: above-below
    after: above-below.list
    type: fact
    text:
      - { id: uk.above-below.fact.1, text: "Українське «над» — це {term above}." }
      - { id: uk.above-below.fact.2, text: "Українське «під» — це і {term under}, і {term below}: {term below}, коли між речами є простір." }
  - id: uk.above-below.example
    in: above-below
    after: above-below.list
    type: example
    items:
      - { id: uk.above-below.kitchen, text: "The kitchen is {target below} my room.", tr: "Кухня під моєю кімнатою." }
