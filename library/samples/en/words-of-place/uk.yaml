# Words of place in Ukrainian: translations keyed by the ids of source.yaml, and a note for Ukrainian readers.
language: uk
nativeReview: false
text:
  title: Прийменники місця
  def: Прийменники місця — це слова, як-от {term in} і {term under}, що стоять перед іменником і кажуть, де щось розташоване.

  ess.in.ex: М’яч у коробці.
  ess.on.ex: М’яч на коробці.
  ess.under.ex: М’яч під коробкою.
  ess.front.ex: М’яч перед коробкою.
  ess.behind.ex: М’яч за коробкою.
  ess.next.ex: М’яч поруч із коробкою.
  ess.near.ex: М’яч недалеко від коробки.
  ess.between.ex: М’яч між коробками.
  ess.above.ex: М’яч над коробкою.
  ess.below.ex: М’яч нижче від коробки.
  ess.opposite.ex: М’яч навпроти коробки.
  ess.inside.ex: М’яч усередині коробки.
  ess.outside.ex: М’яч поза коробкою.
  ess.underneath.ex: М’яч під коробкою.
  ess.beneath.ex: М’яч під коробкою.

  in-on-under.title: "In, on, under"
  in-on-under.fact.1: Ці три слова кажуть, чи щось усередині іншої речі, на її поверхні чи нижче від неї.
  in: "{term In} ставить щось усередину простору, оточеного стінками: коробки, сумки, кімнати, міста."
  in.ex: Мої ключі в сумці.
  on: "{term On} ставить щось на поверхню, так що воно її торкається: на стіл, на стіну, на підлогу."
  on.ex: Твій телефон на столі.
  under: "{term Under} ставить щось нижче від іншої речі, часто так, що та річ його накриває."
  under.ex: Кіт під ліжком.

  front-behind.title: "In front of, behind"
  front-behind.fact.1: "{term In front of} і {term behind} кажуть, де щось розташоване відносно передньої частини іншої речі."
  front-behind.fact.2: "{term In front of} — це три слова, що діють як одне."
  front: "{term In front of} ставить щось перед передньою частиною іншої речі."
  front.ex: Автобусна зупинка перед школою.
  behind: "{term Behind} ставить щось позаду іншої речі."
  behind.ex: Сад за будинком.

  next-near.title: "Next to, near"
  next-near.fact.1: "{term Next to} і {term near} кажуть, наскільки щось близько до іншої речі."
  next-near.fact.2: "Обидва стоять просто перед іменником: {term next to the door}, {term near the station}."
  next: "{term Next to} ставить щось просто збоку від іншої речі, і між ними нічого немає."
  next.ex: Сідай поруч зі мною.
  near: "{term Near} ставить щось неподалік."
  near.ex: Я живу біля вокзалу.

  between.title: "Between"
  between.fact.1: "{term Between} ставить щось у простір, де з кожного боку є інша річ."
  between-item: "{term Between} поєднує дві речі словом {term and}."
  between.ex: Банк між кав’ярнею і магазином.

  above-below.title: "Above, below"
  above-below.fact.1: "{term Above} і {term below} кажуть, що щось вище або нижче від іншої речі і між ними є простір."
  above: "{term Above} ставить щось вище від іншої речі."
  above.ex: Над столом висить лампа.
  below: "{term Below} ставить щось нижче від іншої речі."
  below.ex: Кухня під моєю кімнатою.
  above-below.why.1: "{term On} і {term under} можуть торкатися того, що називають, а {term above} і {term below} залишають простір."

  opposite.title: "Opposite"
  opposite.fact.1: "{term Opposite} ставить щось через простір від іншої речі, обличчям до неї: через вулицю, стіл чи кімнату."
  opposite-item: "{term Opposite} стоїть просто перед іменником, а в США звичне слово — {term across from}."
  opposite.ex: Банк навпроти готелю.

  inside-outside.title: "Inside, outside"
  inside-outside.fact.1: "{term Inside} і {term outside} кажуть, чи щось у межах стін або стінок місця, чи поза ними."
  inside: "{term Inside} каже, що стіни чи стінки оточують щось з усіх боків, виразніше, ніж {term in}."
  inside.ex: У будинку тепло.
  outside: "{term Outside} ставить щось одразу за стінами місця."
  outside.ex: Біля готелю стоїть таксі.

  underneath.title: "Underneath"
  underneath.fact.1: "{term Underneath} означає {term under} і каже, що річ зверху накриває або ховає те, що під нею."
  underneath-item: "{term Underneath} часто називає щось знайдене або сховане."
  underneath.ex: Я знайшов ключі під газетою.

  beneath.title: "Beneath"
  beneath.fact.1: "{term Beneath} означає {term under} у писемній і офіційній мові."
  beneath-item: "{term Beneath} часто називає щось велике: землю, річку, море."
  beneath.ex: Тунель проходить під річкою.

  err.near-of.right: Я живу біля вокзалу.
  err.near-of.rule: "{term Near} стоїть просто перед іменником, без {term of}."
  err.behind-of.right: Сад за будинком.
  err.behind-of.rule: "{term Behind} стоїть просто перед іменником, без {term of}."
  err.in-front-opposite.right: Банк навпроти готелю.
  err.in-front-opposite.rule: "Через вулицю чи кімнату, обличчям одне до одного, — це {term opposite}; {term in front of} — на тому самому боці."
  err.in-table.right: Книжка на столі.
  err.in-table.rule: "На поверхні англійською кажуть {term on}; {term in} — усередині простору зі стінками."
  err.on-photo.right: Хто на фото?
  err.on-photo.rule: "Про те, що зображено на фото чи картині, англійською кажуть {term in}."

  above-below.why.2: "Тому лампа висить над столом, а чашка стоїть на ньому."
  err.near-of.es: "Іспанською кажуть cerca de, з de."
  err.near-of.pt: "Португальською кажуть perto de, з de."
  err.near-of.fr: "Французькою кажуть près de, з de."
  err.behind-of.es: "Іспанською кажуть detrás de, з de."
  err.behind-of.pt: "Португальською кажуть atrás de, з de."
  err.in-front-opposite.es: "Іспанське enfrente de означає «навпроти» і схоже на in front of."
  err.in-front-opposite.pt: "Португальське em frente de означає і «навпроти», і «перед»."
  err.in-front-opposite.fr: "Французьке en face de означає «навпроти» і схоже на in front of."
  err.in-front-opposite.it: "Італійське di fronte a означає «навпроти» і схоже на in front of."
  err.in-table.es: "Іспанське en означає і «в», і «на»."
  err.in-table.pt: "Португальське em означає і «в», і «на»."
  err.in-table.tr: "Турецька каже і «в», і «на» одним закінченням, -da або -de."
  err.in-table.id: "Індонезійське di означає і «в», і «на»."
  err.in-table.ja: "Японська позначає місце часткою に, не кажучи, «в» чи «на»."
  err.on-photo.uk: "Українською кажуть «на фото», з «на», що означає on."
  err.on-photo.pl: "Польською кажуть na zdjęciu, з na, що означає on."
  err.on-photo.de: "Німецькою кажуть auf dem Foto, з auf, що означає on."
  err.on-photo.fr: "Французькою кажуть sur la photo, з sur, що означає on."

blocks:
  - id: uk.above-below.fact
    in: above-below
    after: above-below.list
    type: fact
    text:
      - id: uk.above-below.fact.1
        text: "Українське «над» — це {term above}, а «під» без дотику — {term below}: «лампа над столом» — {term a lamp above the table}."
