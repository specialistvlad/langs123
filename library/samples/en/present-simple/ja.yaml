# Present simple in Japanese: translations keyed by the ids of source.yaml, and a note for Japanese readers.
language: ja
nativeReview: false
text:
  title: 現在形
  def: "現在形は習慣や事実を表す時制で、動詞の原形を使い、{term he}、{term she}、{term it}の後では{term -s}を付けます。"

  ess.work.ex: 私は働いています。
  ess.works.ex: 彼女は働いています。
  ess.watches.ex: 彼女はテレビを見ます。
  ess.lives.ex: 彼はここに住んでいます。
  ess.dont.ex: 私は働いていません。
  ess.doesnt.ex: 彼女は働いていません。
  ess.does.ex: 彼女は働いていますか。
  ess.where.ex: どこに住んでいますか。
  ess.who.ex: ここに住んでいるのは誰ですか。
  ess.habit.ex: 私は毎日7時に起きます。
  ess.fact.ex: 水は100度で沸騰します。
  ess.always.ex: 彼女はいつも歩いて仕事に行きます。
  ess.know.ex: 私は彼女の名前を知っています。
  ess.starts.ex: 映画は8時に始まります。

  forms.title: 形
  forms.fact.1: "{term I}、{term you}、{term we}、{term they}のとき、現在形は動詞の原形、つまり辞書に載っている形です。"
  forms.fact.2: "{term he}、{term she}、{term it}のときは、動詞に{term -s}が付きます。"
  forms.col.person: 人称
  forms.col.statement: 肯定文
  forms.col.negative: 否定文
  forms.col.question: 疑問文
  forms.col.yes: 短い答え：はい
  forms.col.no: 短い答え：いいえ
  forms.why.1: "英語の動詞には昔、人称ごとに語尾がありました。"

  spelling.title: つづり：-sと-es
  spelling.fact.1: "ほとんどの動詞は原形に{term -s}を付けます：{term work}、{term works}。"
  spelling.fact.2: 4つのグループの動詞は、語尾のつづりが違います。
  spelling.es: "{term s}、{term ss}、{term sh}、{term ch}、{term x}、{term z}で終わる動詞には{term -es}を付けます。"
  spelling.es.ex: 彼女は毎晩テレビを見ます。
  spelling.o: "{term Go}と{term do}には{term -es}を付けます：{term goes}、{term does}。"
  spelling.o.ex: 彼はバスで学校に行きます。
  spelling.y: "子音字の後の{term y}は{term ies}になります：{term study}、{term studies}。"
  spelling.y.ex: 彼女はフランス語を勉強しています。
  spelling.have: "{term Have}は{term has}になります。"
  spelling.have.ex: 彼女には兄弟が2人います。

  sound.title: -sの発音
  sound.fact.1: "{term -s}には3つの音があり、動詞の最後の音によって決まります。"
  sound.s: "{ipa p}、{ipa t}、{ipa k}、{ipa f}、{ipa θ}の音の後では{ipa s}です。"
  sound.s.ex: 彼女は店で働いています。
  sound.z: "母音と、{ipa b}、{ipa d}、{ipa ɡ}、{ipa v}、{ipa l}、{ipa m}、{ipa n}、{ipa ŋ}の音の後では{ipa z}です。"
  sound.z.ex: 彼はサッカーをします。
  sound.iz: "{ipa s}、{ipa z}、{ipa ʃ}、{ipa tʃ}、{ipa dʒ}の音の後では{ipa ɪz}です。"
  sound.iz.ex: 彼女はテレビを見ます。
  sound.says: "{term Says}と{term does}は母音が変わります：{ipa sez}、{ipa dʌz}。"
  sound.says.ex: 彼女は誰にでもあいさつします。
  sound.why.1: "こすれる音は、1つの音節の中で2つ続けて言えません。"

  do-does.title: Doとdoes
  do-does.fact.1: "否定文と疑問文では{term do}か{term does}が人称を表し、主な動詞は原形のままです。"
  do-does.dont: "{term Don't}は{term do not}の短い形で、{term I}、{term you}、{term we}、{term they}と使います。"
  do-does.dont.ex: 私はコーヒーが好きではありません。
  do-does.doesnt: "{term Doesn't}は{term does not}の短い形で、{term he}、{term she}、{term it}と使います。"
  do-does.doesnt.ex: 彼は肉を食べません。
  do-does.do: "{term I}、{term you}、{term we}、{term they}の疑問文は{term Do}で始めます。"
  do-does.do.ex: 英語を話しますか。
  do-does.does: "{term he}、{term she}、{term it}の疑問文は{term Does}で始めます。"
  do-does.does.ex: お姉さんはここで働いていますか。
  do-does.why.1:
    - "{term Does}がすでに{term -s}を持っているので、後の動詞には付けません。"
    - "{term she doesn't work}、{term does she work}のようになります。"

  wh.title: 疑問詞で始まる疑問文
  wh.fact.1: "疑問詞を最初に置き、次に{term do}か{term does}、主語、動詞の原形を続けます。"
  wh.where: どこに住んでいますか。
  wh.what: 彼女の仕事は何ですか。
  wh.when: 店は何時に開きますか。

  subject-questions.title: 主語になるwhoとwhat
  subject-questions.fact.1: "{term who}や{term what}が主語のときは、肯定文と同じ語順のままで、{term do}を使いません。"
  subject-questions.who: ここに住んでいるのは誰ですか。
  subject-questions.what: 次に何が起こりますか。

  habits.title: 習慣
  habits.fact.1: 現在形は、人がふだん繰り返していることを表します。
  habits.up: 私は毎日7時に起きます。
  habits.gym: 私たちは毎週月曜日にジムに行きます。
  habits.tea: 彼女は朝、紅茶を飲みます。

  facts.title: 事実
  facts.fact.1: 現在形は、いつも、または一般に本当であることを表します。
  facts.water: 水は100度で沸騰します。
  facts.sun: 太陽は東から昇ります。
  facts.lions: ライオンはアフリカに住んでいます。

  frequency.title: always、usually、neverと一緒に
  frequency.fact.1:
    - "頻度を表す語は、主な動詞の前に置きます。"
    - "{term always}、{term usually}、{term sometimes}、{term never}などです。"
  frequency.always: 彼女はいつも歩いて仕事に行きます。
  frequency.usually: 私はたいてい家で朝ごはんを食べます。
  frequency.never: 私たちはテレビを全然見ません。

  states.title: 状態
  states.fact.1:
    - "状態を表す動詞は、今のことでも現在形を使います。"
    - "{term like}、{term want}、{term need}、{term know}、{term understand}などです。"
  states.know: 私は彼女の名前を知っています。
  states.understand: わかりますか。
  states.want: 彼女は新しいスマホを欲しがっています。
  states.why.1: "状態は時間とともに段階を追って進むものではないので、現在形を使います。"

  timetables.title: 時刻表と予定
  timetables.fact.1: 現在形は、時刻表や予定で決まっていることがいつ起こるかを、未来のことでも表します。
  timetables.film: 映画は8時に始まります。
  timetables.train: 私たちの電車は明日6時15分に出ます。
  timetables.shop: 店は日曜日は9時に開きます。

  err.no-s.right: 彼女は銀行で働いています。
  err.no-s.rule: "{term he}、{term she}、{term it}の後では、動詞に{term -s}を付けます。"
  err.does-s.right: 彼女はここで働いていますか。
  err.does-s.rule: "{term does}と{term doesn't}の後では、動詞は原形のままです。"
  err.no-do.right: コーヒーは好きですか。
  err.no-do.rule: "疑問詞のない疑問文は{term do}か{term does}で始めます。"
  err.verb-first.right: コーヒーは好きですか。
  err.verb-first.rule: "疑問文では{term do}か{term does}を主語の前に置き、主な動詞は主語の後に置きます。"

  forms.office: "私は会社で働いています。"
  forms.hospital: "姉は病院で働いています。"
  forms.sundays: "彼らは日曜日は働きません。"
  forms.here: "彼はここで働いていますか。"
  forms.why.2: "{term he}、{term she}、{term it}の{term -s}は、今も残っている唯一の語尾です。"
  sound.why.2: "そのため、{term watches}では間に母音が入り、{term watch}より音節が1つ多くなります。"
  err.no-s.ja: "日本語の動詞は、どの人称でも同じ形です。"
  err.no-s.id: "インドネシア語の動詞は、どの人称でも同じ形です。"
  err.no-s.vi: "ベトナム語の動詞は、どの人称でも同じ形です。"
  err.does-s.uk: "ウクライナ語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.es: "スペイン語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.pt: "ポルトガル語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.fr: "フランス語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.de: "ドイツ語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.it: "イタリア語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.pl: "ポーランド語は、疑問文でも主な動詞で人称を表します。"
  err.does-s.tr: "トルコ語は、疑問文でも主な動詞で人称を表します。"
  err.no-do.uk: "ウクライナ語は、肯定文と同じ語で、上がり調子で尋ねます。"
  err.no-do.es: "スペイン語は、肯定文と同じ語で、doのような語を使わずに尋ねます。"
  err.no-do.pt: "ポルトガル語は、肯定文と同じ語で、上がり調子で尋ねます。"
  err.no-do.fr: "話し言葉のフランス語は、肯定文と同じ語で、上がり調子で尋ねます。"
  err.no-do.it: "イタリア語は、肯定文と同じ語で、上がり調子で尋ねます。"
  err.no-do.pl: "ポーランド語は、肯定文と同じ語か、前にczyを置いて尋ねます。"
  err.no-do.tr: "トルコ語は、動詞の後にmiを置き、doのような語を使わずに尋ねます。"
  err.no-do.id: "インドネシア語は、肯定文と同じ語か、前にapakahを置いて尋ねます。"
  err.no-do.vi: "ベトナム語は、文末にkhôngを置き、doのような語を使わずに尋ねます。"
  err.no-do.ja: "日本語は、文末に「か」を付け、doのような語を使わずに尋ねます。"
  err.verb-first.de: "ドイツ語は、主な動詞を主語の前に置いて尋ねます。"
  err.verb-first.fr: "フランス語は、主な動詞を主語の前に置いて尋ねることができます。"

blocks:
  - id: ja.forms.fact
    in: forms
    after: forms.example
    type: fact
    text:
      - id: ja.forms.fact.1
        text: "日本語の動詞は主語によって形が変わりませんが、英語の現在形は{term he}、{term she}、{term it}のときだけ{term -s}が付きます。"
