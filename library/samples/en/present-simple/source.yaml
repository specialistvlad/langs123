# Present simple: a sample topic of the new library, written in English first (samples/README.md).
id: en.present-simple
status: draft
nativeReview: false
title: { id: title, text: Present simple }
definition:
  id: def
  text: The present simple, for habits and facts, is the verb's dictionary form, with {term -s} after {term he}, {term she} and {term it}.
essence:
  - { id: ess.work, to: forms, ex: { id: ess.work.ex, text: "I {target work}." } }
  - { id: ess.works, to: forms, ex: { id: ess.works.ex, text: "She {target works}." } }
  - { id: ess.watches, to: spelling, ex: { id: ess.watches.ex, text: "She {target watches} TV." } }
  - { id: ess.lives, to: sound, ex: { id: ess.lives.ex, text: "He {target lives} {ipa lɪvz} here." } }
  - { id: ess.dont, to: do-does, ex: { id: ess.dont.ex, text: "I {target don't work}." } }
  - { id: ess.doesnt, to: do-does, ex: { id: ess.doesnt.ex, text: "She {target doesn't work}." } }
  - { id: ess.does, to: do-does, ex: { id: ess.does.ex, text: "{target Does} she {target work}?" } }
  - { id: ess.where, to: wh, ex: { id: ess.where.ex, text: "Where {target do} you {target live}?" } }
  - { id: ess.who, to: subject-questions, ex: { id: ess.who.ex, text: "Who {target lives} here?" } }
  - { id: ess.habit, to: habits, ex: { id: ess.habit.ex, text: "I {target get up} at seven every day." } }
  - { id: ess.fact, to: facts, ex: { id: ess.fact.ex, text: "Water {target boils} at a hundred degrees." } }
  - { id: ess.always, to: frequency, ex: { id: ess.always.ex, text: "She always {target walks} to work." } }
  - { id: ess.know, to: states, ex: { id: ess.know.ex, text: "I {target know} her name." } }
  - { id: ess.starts, to: timetables, ex: { id: ess.starts.ex, text: "The film {target starts} at eight." } }
subtopics:
  - id: forms
    level: A1
    title: { id: forms.title, text: The forms }
    blocks:
      - id: forms.fact
        type: fact
        text:
          - id: forms.fact.1
            text: "With every subject but {term he}, {term she} and {term it}, the present simple is the base verb, as a dictionary gives it."
          - { id: forms.fact.2, text: "With {term he}, {term she} and {term it}, the verb adds {term -s}." }
      - id: forms.table
        type: table
        axes: { rows: person, columns: number }
        columns:
          - { id: forms.col.person, key: person, text: Person }
          - { id: forms.col.singular, key: sg, text: Singular }
          - { id: forms.col.plural, key: pl, text: Plural }
        rows:
          - id: forms.first
            features: { person: 1 }
            cells: { person: { id: forms.first.name, text: first person }, sg: ["I {target work}."], pl: ["We {target work}."] }
          - id: forms.second
            features: { person: 2 }
            cells: { person: { id: forms.second.name, text: second person }, sg: ["You {target work}."], pl: ["You {target work}."] }
          - id: forms.third
            features: { person: 3 }
            cells:
              person: { id: forms.third.name, text: third person }
              sg: ["He {target works}.", "She {target works}.", "It {target works}."]
              pl: ["They {target work}."]
      - id: forms.example
        type: example
        items:
          - { id: forms.office, text: "I {target work} in an office." }
          - { id: forms.hospital, text: "My sister {target works} in a hospital." }
          - { id: forms.sundays, text: "They {target work} on Sundays." }
          - { id: forms.here, text: "My brother {target works} here." }
      - id: forms.why
        type: why
        text:
          - { id: forms.why.1, text: "The {term -s} of {term he}, {term she} and {term it} is the last of the verb's old endings for each person." }
  - id: spelling
    level: A1
    title: { id: spelling.title, text: "Spelling: -s and -es" }
    blocks:
      - id: spelling.fact
        type: fact
        text:
          - { id: spelling.fact.2, text: "Some verbs spell the {term -s} ending in another way." }
      - id: spelling.list
        type: list
        items:
          - id: spelling.es
            text: After {term s}, {term ss}, {term sh}, {term ch}, {term x} and {term z}, the verb adds {term -es}.
            ex: { id: spelling.es.ex, text: "She {target watches} TV every evening." }
          - id: spelling.o
            text: "{term Go} adds {term -es}: {term goes}."
            ex: { id: spelling.o.ex, text: "He {target goes} to school by bus." }
          - id: spelling.do
            text: "{term Do} adds {term -es}: {term does}."
            ex: { id: spelling.do.ex, text: "She {target does} her homework in the evening." }
          - id: spelling.y
            text: "After a consonant, {term y} becomes {term ies}: {term study}, {term studies}."
            ex: { id: spelling.y.ex, text: "She {target studies} French." }
          - id: spelling.have
            text: "{term Have} becomes {term has}."
            ex: { id: spelling.have.ex, text: "She {target has} two brothers." }
  - id: sound
    level: A2
    title: { id: sound.title, text: Saying the -s }
    blocks:
      - id: sound.fact
        type: fact
        text:
          - { id: sound.fact.1, text: "The {term -s} has three sounds, and the last sound of the verb chooses one." }
      - id: sound.list
        type: list
        items:
          - id: sound.s
            text: "{ipa s} after the sounds {ipa p}, {ipa t}, {ipa k}, {ipa f} and {ipa θ}."
            ex: { id: sound.s.ex, text: "She {target works} {ipa {variant en-GB wɜːks} {variant en-US wɜːrks}} in a shop." }
          - id: sound.z
            text: "{ipa z} after a vowel and after the sounds {ipa b}, {ipa d}, {ipa ɡ}, {ipa v}, {ipa l}, {ipa m}, {ipa n} and {ipa ŋ}."
            ex: { id: sound.z.ex, text: "He {target plays} {ipa pleɪz} tennis." }
          - id: sound.iz
            text: "{ipa ɪz} after the sounds {ipa s}, {ipa z}, {ipa ʃ}, {ipa tʃ} and {ipa dʒ}."
            ex: { id: sound.iz.ex, text: "She {target watches} {ipa {variant en-GB ˈwɒtʃɪz} {variant en-US ˈwɑːtʃɪz}} TV." }
          - id: sound.says
            text: "{term Says} {ipa sez} changes its vowel."
            ex: { id: sound.says.ex, text: "She {target says} {ipa sez} hello to everyone." }
          - id: sound.does
            text: "{term Does} {ipa dʌz} changes its vowel."
            ex: { id: sound.does.ex, text: "He {target does} {ipa dʌz} his homework after dinner." }
      - id: sound.why
        type: why
        text:
          - { id: sound.why.1, text: "Two sounds like {term s} and {term sh} can't stand next to each other in one syllable." }
          - { id: sound.why.2, text: "So {term watches} has a vowel between them, and one syllable more than {term watch}." }
  - id: do-does
    level: A1
    title: { id: do-does.title, text: Do and does }
    blocks:
      - id: do-does.fact
        type: fact
        text:
          - id: do-does.fact.1
            text: In negatives and questions, {term do} or {term does} changes with the subject, and the main verb keeps its dictionary form.
      - id: do-does.table
        type: table
        axes: { rows: person, columns: sentence }
        columns:
          - { id: do-does.col.person, key: person, text: Person }
          - { id: do-does.col.negative, key: negative, text: Negative }
          - { id: do-does.col.question, key: question, text: Question }
          - { id: do-does.col.yes, key: "yes", text: "Short answer: yes" }
          - { id: do-does.col.no, key: "no", text: "Short answer: no" }
        rows:
          - id: do-does.i
            features: { person: 1, number: sg }
            cells:
              person: I
              negative: I {target don't work}.
              question: "{target Do} I {target work}?"
              "yes": Yes, I {target do}.
              "no": No, I {target don't}.
          - id: do-does.you
            features: { person: 2 }
            cells:
              person: you
              negative: You {target don't work}.
              question: "{target Do} you {target work}?"
              "yes": Yes, you {target do}.
              "no": No, you {target don't}.
          - id: do-does.he
            features: { person: 3, number: sg, gender: masc }
            cells:
              person: he
              negative: He {target doesn't work}.
              question: "{target Does} he {target work}?"
              "yes": Yes, he {target does}.
              "no": No, he {target doesn't}.
          - id: do-does.she
            features: { person: 3, number: sg, gender: fem }
            cells:
              person: she
              negative: She {target doesn't work}.
              question: "{target Does} she {target work}?"
              "yes": Yes, she {target does}.
              "no": No, she {target doesn't}.
          - id: do-does.it
            features: { person: 3, number: sg, gender: neut }
            cells:
              person: it
              negative: It {target doesn't work}.
              question: "{target Does} it {target work}?"
              "yes": Yes, it {target does}.
              "no": No, it {target doesn't}.
          - id: do-does.we
            features: { person: 1, number: pl }
            cells:
              person: we
              negative: We {target don't work}.
              question: "{target Do} we {target work}?"
              "yes": Yes, we {target do}.
              "no": No, we {target don't}.
          - id: do-does.they
            features: { person: 3, number: pl }
            cells:
              person: they
              negative: They {target don't work}.
              question: "{target Do} they {target work}?"
              "yes": Yes, they {target do}.
              "no": No, they {target don't}.
      - id: do-does.list
        type: list
        items:
          - id: do-does.dont
            text: "{term Don't} is the short form of {term do not}."
            ex: { id: do-does.dont.ex, text: "I {target don't like} coffee." }
          - id: do-does.doesnt
            text: "{term Doesn't} is the short form of {term does not}."
            ex: { id: do-does.doesnt.ex, text: "He {target doesn't eat} meat." }
          - id: do-does.do
            text: "{term Do} starts a question."
            ex: { id: do-does.do.ex, text: "{target Do} you {target speak} English?" }
          - id: do-does.does
            text: "{term Does} starts a question."
            ex: { id: do-does.does.ex, text: "{target Does} your sister {target work} here?" }
          - id: do-does.short
            text: A short answer repeats {term do} or {term does}.
            ex: { id: do-does.short.ex, text: "Yes, I {target do}." }
      - id: do-does.why
        type: why
        text:
          - id: do-does.why.1
            text: "{term Does} already carries the {term -s}, so the verb after it needs none: {term she doesn't work}, {term does she work}."
  - id: wh
    level: A1
    title: { id: wh.title, text: Questions with a question word }
    blocks:
      - id: wh.fact
        type: fact
        text:
          - { id: wh.fact.1, text: "A question word goes first, then {term do} or {term does}, the subject and the base verb." }
      - id: wh.example
        type: example
        items:
          - { id: wh.where, text: "Where {target do} you {target live}?" }
          - { id: wh.what, text: "What {target does} she {target do}?" }
          - { id: wh.when, text: "When {target does} the shop {target open}?" }
  - id: subject-questions
    level: A2
    title: { id: subject-questions.title, text: Who and what as the subject }
    blocks:
      - id: subject-questions.fact
        type: fact
        text:
          - id: subject-questions.fact.1
            text: When {term who} or {term what} is the subject, the question keeps the order of a statement and takes no {term do}.
      - id: subject-questions.example
        type: example
        items:
          - { id: subject-questions.who, text: "Who {target lives} here?" }
          - { id: subject-questions.what, text: "What {target happens} next?" }
  - id: habits
    level: A1
    title: { id: habits.title, text: Habits and routines }
    blocks:
      - id: habits.fact
        type: fact
        text:
          - { id: habits.fact.1, text: The present simple says what someone does regularly. }
      - id: habits.example
        type: example
        items:
          - { id: habits.up, text: "I {target get up} at seven every day." }
          - { id: habits.gym, text: "We {target go} to the gym on Mondays." }
          - { id: habits.tea, text: "She {target drinks} tea in the morning." }
  - id: facts
    level: A1
    title: { id: facts.title, text: Facts }
    blocks:
      - id: facts.fact
        type: fact
        text:
          - { id: facts.fact.1, text: The present simple says what is always or generally true. }
      - id: facts.example
        type: example
        items:
          - { id: facts.water, text: "Water {target boils} at a hundred degrees." }
          - { id: facts.sun, text: "The sun {target rises} in the east." }
          - { id: facts.lions, text: "Lions {target live} in Africa." }
  - id: frequency
    level: A1
    title: { id: frequency.title, text: "With always, usually, never" }
    blocks:
      - id: frequency.fact
        type: fact
        text:
          - id: frequency.fact.1
            text: "Words of how often, such as {term always}, go before the main verb."
      - id: frequency.example
        type: example
        items:
          - { id: frequency.always, text: "She always {target walks} to work." }
          - { id: frequency.usually, text: "I usually {target have} breakfast at home." }
          - { id: frequency.never, text: "We never {target watch} TV." }
  - id: states
    level: A2
    title: { id: states.title, text: States }
    blocks:
      - id: states.fact
        type: fact
        text:
          - id: states.fact.1
            text: "Verbs of states, such as {term know}, take the present simple for what is true now."
      - id: states.example
        type: example
        items:
          - { id: states.know, text: "I {target know} her name." }
          - { id: states.understand, text: "{target Do} you {target understand}?" }
          - { id: states.want, text: "She {target wants} a new phone." }
      - id: states.why
        type: why
        text:
          - { id: states.why.1, text: "The {term -ing} form shows an action step by step; a state has no steps, so it stays simple." }
  - id: timetables
    level: A2
    title: { id: timetables.title, text: Timetables and programmes }
    blocks:
      - id: timetables.fact
        type: fact
        text:
          - id: timetables.fact.1
            text: The present simple says when something happens by a timetable or a programme, in the future too.
      - id: timetables.example
        type: example
        items:
          - { id: timetables.film, text: "The film {target starts} at eight." }
          - { id: timetables.train, text: "Our train {target leaves} at a quarter past six tomorrow." }
          - { id: timetables.shop, text: "The shop {target opens} at nine on Sundays." }
errors:
  - id: err.no-s
    in: forms
    wrong: She work in a bank.
    right: { id: err.no-s.right, text: "She {target works} in a bank." }
    rule: { id: err.no-s.rule, text: "After {term he}, {term she} and {term it}, the verb adds {term -s}." }
    speakers:
      ja: { id: err.no-s.ja, text: Japanese verbs have one form for every person. }
      id: { id: err.no-s.id, text: Indonesian verbs have one form for every person. }
      vi: { id: err.no-s.vi, text: Vietnamese verbs have one form for every person. }
  - id: err.does-s
    in: do-does
    wrong: Does she works here?
    right: { id: err.does-s.right, text: "{target Does} she {target work} here?" }
    rule: { id: err.does-s.rule, text: "After {term does} and {term doesn't}, the verb stays in its base form." }
    speakers:
      uk: { id: err.does-s.uk, text: Ukrainian marks the person on the main verb in a question too. }
      es: { id: err.does-s.es, text: Spanish marks the person on the main verb in a question too. }
      pt: { id: err.does-s.pt, text: Portuguese marks the person on the main verb in a question too. }
      fr: { id: err.does-s.fr, text: French marks the person on the main verb in a question too. }
      de: { id: err.does-s.de, text: German marks the person on the main verb in a question too. }
      it: { id: err.does-s.it, text: Italian marks the person on the main verb in a question too. }
      pl: { id: err.does-s.pl, text: Polish marks the person on the main verb in a question too. }
  - id: err.no-do
    in: wh
    wrong: Where you live?
    right: { id: err.no-do.right, text: "Where {target do} you {target live}?" }
    rule: { id: err.no-do.rule, text: "After a question word, {term do} or {term does} comes before the subject." }
    speakers:
      uk: { id: err.no-do.uk, text: "Ukrainian asks with a question word and the words of a statement: {l1 uk Де ти живеш?}" }
      es: { id: err.no-do.es, text: "Spanish asks with a question word and the verb, with no helper verb: {l1 es ¿Dónde vives?}" }
      pt: { id: err.no-do.pt, text: "Portuguese asks with a question word and the words of a statement: {l1 pt Onde você mora?}" }
      fr: { id: err.no-do.fr, text: "Spoken French asks with a question word and the words of a statement: {l1 fr Où tu habites ?}" }
      it: { id: err.no-do.it, text: "Italian asks with a question word and the verb, with no helper verb: {l1 it Dove abiti?}" }
      pl: { id: err.no-do.pl, text: "Polish asks with a question word and the verb, with no helper verb: {l1 pl Gdzie mieszkasz?}" }
      tr: { id: err.no-do.tr, text: "Turkish puts the question word before the verb, with no helper verb: {l1 tr Nerede oturuyorsun?}" }
      id: { id: err.no-do.id, text: "Indonesian asks with a question word and the words of a statement: {l1 id Di mana kamu tinggal?}" }
      vi: { id: err.no-do.vi, text: "Vietnamese puts the question word where the answer goes, with no helper verb: {l1 vi Bạn sống ở đâu?}" }
      ja: { id: err.no-do.ja, text: "Japanese asks with a question word and {l1 ja か}, with no helper verb: {l1 ja どこに住んでいますか。}" }
  - id: err.verb-first
    in: do-does
    wrong: Like you coffee?
    right: { id: err.verb-first.right, text: "{target Do} you {target like} coffee?" }
    rule: { id: err.verb-first.rule, text: "A question puts {term do} or {term does} before the subject, and the main verb after it." }
    speakers:
      de: { id: err.verb-first.de, text: German asks by putting the main verb before the subject. }
      fr: { id: err.verb-first.fr, text: French can ask by putting the main verb before the subject. }
