# Present simple in Ukrainian: translations keyed by the ids of source.yaml, and a note for Ukrainian readers.
language: uk
nativeReview: false
text:
  title: Present Simple
  def: "Present Simple — час звичок і фактів: словникова форма дієслова, з {term -s} після {term he}, {term she} і {term it}."

  ess.work.ex: Я працюю.
  ess.works.ex: Вона працює.
  ess.watches.ex: Вона дивиться телевізор.
  ess.lives.ex: Він живе тут.
  ess.dont.ex: Я не працюю.
  ess.doesnt.ex: Вона не працює.
  ess.does.ex: Вона працює?
  ess.where.ex: Де ти живеш?
  ess.who.ex: Хто тут живе?
  ess.habit.ex: Я встаю о сьомій щодня.
  ess.fact.ex: "Вода кипить за температури сто градусів."
  ess.always.ex: Вона завжди ходить на роботу пішки.
  ess.know.ex: Я знаю її ім’я.
  ess.starts.ex: Фільм починається о восьмій.

  forms.title: Форми
  forms.fact.1: "З {term I}, {term you}, {term we} і {term they} Present Simple — це початкова форма дієслова, така, як її подає словник."
  forms.fact.2: "З {term he}, {term she} і {term it} дієслово додає {term -s}."
  forms.col.person: Особа
  forms.why.1: "Давньоанглійська мова має закінчення дієслова для кожної особи."

  spelling.title: "Правопис: -s і -es"
  spelling.fact.2: "Деякі дієслова пишуть закінчення {term -s} інакше."
  spelling.es: "Після {term s}, {term ss}, {term sh}, {term ch}, {term x} і {term z} дієслово додає {term -es}."
  spelling.es.ex: Щовечора вона дивиться телевізор.
  spelling.o: "{term Go} додає {term -es}: {term goes}."
  spelling.o.ex: Він їздить до школи автобусом.
  spelling.y: "Після приголосного {term y} стає {term ies}: {term study}, {term studies}."
  spelling.y.ex: Вона вивчає французьку.
  spelling.have: "{term Have} стає {term has}."
  spelling.have.ex: У неї двоє братів.

  sound.title: Як вимовляти -s
  sound.fact.1: "{term -s} має три звуки, і останній звук дієслова вибирає один із них."
  sound.s: "{ipa s} після звуків {ipa p}, {ipa t}, {ipa k}, {ipa f} і {ipa θ}."
  sound.s.ex: Вона працює в магазині.
  sound.z: "{ipa z} після голосного і після звуків {ipa b}, {ipa d}, {ipa ɡ}, {ipa v}, {ipa l}, {ipa m}, {ipa n} і {ipa ŋ}."
  sound.z.ex: Він грає у футбол.
  sound.iz: "{ipa ɪz} після звуків {ipa s}, {ipa z}, {ipa ʃ}, {ipa tʃ} і {ipa dʒ}."
  sound.iz.ex: Вона дивиться телевізор.
  sound.says: "{term Says} {ipa sez} і {term does} {ipa dʌz} змінюють голосний."
  sound.says.ex: Вона з усіма вітається.
  sound.why.1: "Два звуки, як-от {term s} і {term sh}, не можуть стояти поруч в одному складі."

  do-does.title: "Do і does"
  do-does.fact.1: "У запереченнях і питаннях {term do} або {term does} змінюється з підметом, а головне дієслово зберігає словникову форму."
  do-does.dont: "{term Don't} — коротка форма від {term do not}."
  do-does.dont.ex: Я не люблю каву.
  do-does.doesnt: "{term Doesn't} — коротка форма від {term does not}."
  do-does.doesnt.ex: Він не їсть м’яса.
  do-does.do: "{term Do} починає питання."
  do-does.do.ex: Ви розмовляєте англійською?
  do-does.does: "{term Does} починає питання."
  do-does.does.ex: Твоя сестра тут працює?
  do-does.why.1: "{term Does} уже має закінчення {term -s}, тому дієслову після нього воно не потрібне: {term she doesn't work}, {term does she work}."

  wh.title: Питання з питальним словом
  wh.fact.1: "Питальне слово стоїть першим, далі {term do} або {term does}, підмет і початкова форма дієслова."
  wh.where: Де ти живеш?
  wh.what: Чим вона займається?
  wh.when: Коли відкривається магазин?

  subject-questions.title: "Who і what як підмет"
  subject-questions.fact.1: "Коли {term who} або {term what} — підмет, питання зберігає порядок слів ствердження і не бере {term do}."
  subject-questions.who: Хто тут живе?
  subject-questions.what: "Що відбувається далі?"

  habits.title: Звички й розпорядок
  habits.fact.1: Present Simple каже, що хтось робить регулярно.
  habits.up: Я встаю о сьомій щодня.
  habits.gym: Ми ходимо в спортзал по понеділках.
  habits.tea: Уранці вона п’є чай.

  facts.title: Факти
  facts.fact.1: "Present Simple виражає те, що завжди або загалом правдиве."
  facts.water: "Вода кипить за температури сто градусів."
  facts.sun: Сонце сходить на сході.
  facts.lions: Леви живуть в Африці.

  frequency.title: "З always, usually, never"
  frequency.fact.1: "Слова частоти, як-от {term always}, {term usually}, {term sometimes} і {term never}, стоять перед головним дієсловом."
  frequency.always: Вона завжди ходить на роботу пішки.
  frequency.usually: Зазвичай я снідаю вдома.
  frequency.never: Ми ніколи не дивимося телевізор.

  states.title: Стани
  states.fact.1: "Дієслова стану, як-от {term like}, {term want}, {term need}, {term know} і {term understand}, беруть Present Simple для того, що правдиве зараз."
  states.know: Я знаю її ім’я.
  states.understand: Ти розумієш?
  states.want: Вона хоче новий телефон.
  states.why.1: "Стан не змінюється крок за кроком, тому бере просту форму."

  timetables.title: Розклади і програми
  timetables.fact.1: Present Simple каже, коли щось відбувається за розкладом чи програмою, і в майбутньому теж.
  timetables.film: Фільм починається о восьмій.
  timetables.train: Наш потяг вирушає завтра о шостій п’ятнадцять.
  timetables.shop: У неділю магазин відкривається о дев’ятій.

  err.no-s.right: Вона працює в банку.
  err.no-s.rule: "Після {term he}, {term she} і {term it} дієслово додає {term -s}."
  err.does-s.right: Вона тут працює?
  err.does-s.rule: "Після {term does} і {term doesn't} дієслово лишається в початковій формі."
  err.no-do.right: "Де ти живеш?"
  err.no-do.rule: "Після питального слова {term do} або {term does} стоїть перед підметом."
  err.verb-first.right: Ти любиш каву?
  err.verb-first.rule: "Питання ставить {term do} або {term does} перед підметом, а головне дієслово — після нього."

  forms.office: "Я працюю в офісі."
  forms.hospital: "Моя сестра працює в лікарні."
  forms.sundays: "Вони працюють у неділю."
  forms.here: "Мій брат тут працює."
  forms.why.2: "{term -s} після {term he}, {term she} і {term it} — єдине, що від них залишається."
  sound.why.2: "Тому в {term watches} між ними є голосний і на один склад більше, ніж у {term watch}."
  err.no-s.ja: "У японській дієслово має одну форму для всіх осіб."
  err.no-s.id: "В індонезійській дієслово має одну форму для всіх осіб."
  err.no-s.vi: "У в’єтнамській дієслово має одну форму для всіх осіб."
  err.does-s.uk: "Українська позначає особу на головному дієслові і в питанні."
  err.does-s.es: "Іспанська позначає особу на головному дієслові і в питанні."
  err.does-s.pt: "Португальська позначає особу на головному дієслові і в питанні."
  err.does-s.fr: "Французька позначає особу на головному дієслові і в питанні."
  err.does-s.de: "Німецька позначає особу на головному дієслові і в питанні."
  err.does-s.it: "Італійська позначає особу на головному дієслові і в питанні."
  err.does-s.pl: "Польська позначає особу на головному дієслові і в питанні."
  err.no-do.uk: "Українська питає питальним словом і словами ствердження: Де ти живеш?"
  err.no-do.es: "Іспанська питає питальним словом і дієсловом, без допоміжного дієслова: ¿Dónde vives?"
  err.no-do.pt: "Португальська питає питальним словом і словами ствердження: Onde você mora?"
  err.no-do.fr: "Розмовна французька питає питальним словом і словами ствердження: Où tu habites ?"
  err.no-do.it: "Італійська питає питальним словом і дієсловом, без допоміжного дієслова: Dove abiti?"
  err.no-do.pl: "Польська питає питальним словом і дієсловом, без допоміжного дієслова: Gdzie mieszkasz?"
  err.no-do.tr: "Турецька ставить питальне слово перед дієсловом, без допоміжного дієслова: Nerede oturuyorsun?"
  err.no-do.id: "Індонезійська питає питальним словом і словами ствердження: Di mana kamu tinggal?"
  err.no-do.vi: "В’єтнамська ставить питальне слово на місце відповіді, без допоміжного дієслова: Bạn sống ở đâu?"
  err.no-do.ja: "Японська питає питальним словом і часткою か, без допоміжного дієслова: どこに住んでいますか。"
  err.verb-first.de: "Німецька питає, ставлячи головне дієслово перед підметом."
  err.verb-first.fr: "Французька може питати, ставлячи головне дієслово перед підметом."

  forms.col.singular: "Однина"
  forms.col.plural: "Множина"
  forms.first.name: "перша особа"
  forms.second.name: "друга особа"
  forms.third.name: "третя особа"
  spelling.do: "{term Do} додає {term -es}: {term does}."
  spelling.do.ex: "Вона робить домашнє завдання ввечері."
  do-does.col.person: "Особа"
  do-does.col.negative: "Заперечення"
  do-does.col.question: "Питання"
  do-does.col.yes: "Коротка відповідь: так"
  do-does.col.no: "Коротка відповідь: ні"
  do-does.short: "Коротка відповідь повторює {term do} або {term does}."
  do-does.short.ex: "Так."
blocks:
  - id: uk.habits.fact
    in: habits
    after: habits.example
    type: fact
    text:
      - { id: uk.habits.fact.1, text: "Українське «я працюю» передає і {term I work}, і {term I am working}." }
      - { id: uk.habits.fact.2, text: "Англійська розрізняє їх: {term I work} — регулярно, {term I am working} — зараз." }
