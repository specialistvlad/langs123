  ex.tea: чай
  ex.violin: скрипка
  ex.fish: риба
  ex.lemon: лимон
  ex.milk: молоко
  ex.name: ім’я
  ex.sun: сонце
  ex.box: коробка
  ex.zoo: зоопарк
  ex.ice: лід
  ex.yes: так
  ex.orange: апельсин
  ex.red: червоний
  ex.queen: королева
  ex.umbrella: парасолька
  ex.water: вода

