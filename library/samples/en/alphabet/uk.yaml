# The English alphabet in Ukrainian: translations keyed by the ids of source.yaml.
language: uk
nativeReview: false
text:
  title: Англійський алфавіт
  def: Англійський алфавіт — це 26 латинських літер, і кожна має велику форму, малу форму і власну назву.

  names-ei.title: "Назви зі звуком {ipa eɪ}"
  names-ei.fact.1: "Чотири літери мають у назві голосний {ipa eɪ}, як у слові {term day}."

  names-ee.title: "Назви, що закінчуються на {ipa iː}"
  names-ee.fact.1: "Вісім літер мають назви, що закінчуються голосним {ipa iː}, як у слові {term see}."
  names-ee.why.1: "{term B}, {term D}, {term P} і {term T} позначають звуки, що обриваються одразу."
  names-ee.why.2: "Тому в їхніх назвах голосний стоїть після них: {ipa biː}, {ipa diː}, {ipa piː}, {ipa tiː}."

  names-e.title: "Назви зі звуком {ipa e}"
  names-e.fact.1: "Сім літер мають у назві короткий голосний {ipa e}, як у слові {term ten}."
  names-e.why.1: "{term F}, {term L}, {term M}, {term N} і {term S} позначають звуки, які можна тягнути, як {term fff}."
  names-e.why.2: "Тому в їхніх назвах голосний стоїть перед ними: {ipa ef}, {ipa el}, {ipa em}, {ipa en}, {ipa es}."

  names-ai.title: "Назви зі звуком {ipa aɪ}"
  names-ai.fact.1: "Дві літери мають у назві голосний {ipa aɪ}, як у слові {term my}."

  names-o-r.title: O і R
  names-o-r.fact.1: "{term O} має в назві голосний слова {term no}, а {term R} — голосний слова {term car}."

  names-u.title: "Назви, що закінчуються на {ipa juː}"
  names-u.fact.1: "Три літери мають назви, що закінчуються на {ipa juː}, як слово {term you}."
  names-u.why.1: "Колись {term W} писали як дві літери {term u} поруч, тому її назва — {term double u}, «подвійне u»."

  err.a.rule: "Назва літери {term A} — {ipa eɪ}, як у слові {term day}."
  err.e.rule: "Назва літери {term E} — {ipa iː}, як у слові {term see}; {ipa eɪ} — це назва літери {term A}."
  err.i.rule: "Назва літери {term I} — {ipa aɪ}, як у слові {term my}; {ipa iː} — це назва літери {term E}."
  err.g.rule: "Назва літери {term G} — {ipa dʒiː}; {ipa dʒeɪ} — це назва літери {term J}."
  err.v.rule: "Назва літери {term V} — {ipa viː}, верхні зуби на нижній губі; {ipa biː} — це {term B}."
  err.w.rule: "Назва літери {term W} — {term double u}, {ipa ˈdʌbəljuː}."

  ex.apple: яблуко
  ex.house: будинок
  ex.juice: сік
  ex.key: ключ
  ex.book: книжка
  ex.cat: кіт
  ex.dog: собака
  ex.egg: яйце
  ex.girl: дівчинка
