  err.g.fr: "フランス語では{term G}を{ipa ʒe}と言い、英語の{term J}の名前に近く聞こえます。"
  err.g.pt: "ポルトガル語では{term G}を{ipa ʒe}と言い、英語の{term J}の名前に近く聞こえます。"
  err.v.es: "スペイン語では{term b}と{term v}を同じ音{ipa b}で発音します。"
  err.v.ja: "日本語には{ipa v}の音がなく、{term V}の名前をブイと書きます。"
  err.w.fr: "フランス語では{term W}をdouble véと言います。"
  err.w.es: "スペインでは{term W}をuve doble、中南米の多くの国ではdoble veと言います。"
  err.w.it: "イタリア語では{term W}をdoppia vuと言います。"
  err.w.uk: "ウクライナの学校では、数学で使うラテン文字の{term W}を「дубль-ве」と言います。"
