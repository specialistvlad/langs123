  ex.fish: 魚
  ex.lemon: レモン
  ex.milk: 牛乳
  ex.name: 名前
  ex.sun: 太陽
  ex.box: 箱
  ex.zoo: 動物園
  ex.ice: 氷
  ex.yes: はい
  ex.orange: オレンジ
  ex.red: 赤
  ex.queen: 女王
  ex.umbrella: 傘
  ex.water: 水

