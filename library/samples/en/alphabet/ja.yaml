# The English alphabet in Japanese: translations keyed by the ids of source.yaml.
language: ja
nativeReview: false
text:
  title: 英語のアルファベット
  def: 英語のアルファベットは26文字のラテン文字で、どれにも大文字、小文字、固有の名前があります。

  ess.a.ex: りんご
  ess.b.ex: 本
  ess.c.ex: 猫
  ess.d.ex: 犬
  ess.e.ex: 卵
  ess.f.ex: 魚
  ess.g.ex: 女の子
  ess.h.ex: 家
  ess.i.ex: 氷
  ess.j.ex: ジュース
  ess.k.ex: 鍵
  ess.l.ex: レモン
  ess.m.ex: 牛乳
  ess.n.ex: 名前
  ess.o.ex: オレンジ
  ess.p.ex: ペン
  ess.q.ex: 女王
  ess.r.ex: 赤
  ess.s.ex: 太陽
  ess.t.ex: "紅茶"
  ess.u.ex: 傘
  ess.v.ex: バイオリン
  ess.w.ex: 水
  ess.x.ex: 箱
  ess.y.ex: はい
  ess.z.ex: 動物園

  names-ei.title: "{ipa eɪ}を含む名前"
  names-ei.fact.1: "4つの文字は、{term day}と同じ母音{ipa eɪ}を名前に含みます。"

  names-ee.title: "{ipa iː}で終わる名前"
  names-ee.fact.1: "8つの文字は、{term see}と同じ母音{ipa iː}で名前が終わります。"
  names-ee.why.1: "{term B}、{term D}、{term P}、{term T}は、すぐに止まる音を表します。"
  names-ee.why.2:
    - "名前では、その音の後に母音が来ます。"
    - "{term B} {ipa biː}、{term D} {ipa diː}、{term P} {ipa piː}、{term T} {ipa tiː}です。"

  names-e.title: "{ipa e}を含む名前"
  names-e.fact.1: "6つの文字は、{term ten}と同じ短い母音{ipa e}を名前に含みます。"
  names-e.why.1: "{term F}、{term L}、{term M}、{term N}、{term S}は、{term fff}のように伸ばせる音を表します。"
  names-e.why.2:
    - "名前では、その音の前に母音が来ます。"
    - "{term F} {ipa ef}、{term L} {ipa el}、{term M} {ipa em}、{term N} {ipa en}、{term S} {ipa es}です。"

  names-ai.title: "{ipa aɪ}を含む名前"
  names-ai.fact.1: "2つの文字は、{term my}と同じ母音{ipa aɪ}を名前に含みます。"

  names-o-r.title: "O、R、Z"
  names-o-r.fact.1: "3つの文字は、イギリス英語とアメリカ英語で名前が違います。"

  names-u.title: "{ipa juː}で終わる名前"
  names-u.fact.1: "3つの文字は、{term you}と同じ{ipa juː}で名前が終わります。"
  names-u.why.1: "{term W}は2つの{term u}を並べてつないだ形なので、名前が{term double u}です。"

  err.a.rule: "{term A}の名前は、{term day}と同じ母音の{ipa eɪ}です。"
  err.e.rule:
    - "{term E}の名前は、{term see}と同じ{ipa iː}です。"
    - "{ipa eɪ}は{term A}の名前です。"
  err.i.rule:
    - "{term I}の名前は、{term my}と同じ{ipa aɪ}です。"
    - "{ipa iː}は{term E}の名前です。"
  err.g.rule:
    - "{term G}の名前は{ipa dʒiː}です。"
    - "{ipa dʒeɪ}は{term J}の名前です。"
  err.v.rule:
    - "{term V}の名前は{ipa viː}で、上の歯を下の唇に当てて言います。"
    - "{ipa biː}は{term B}です。"
  err.w.rule: "{term W}の名前は{term double u}、{ipa ˈdʌbəljuː}です。"

  ex.apple: りんご
  ex.house: 家
  ex.juice: ジュース
  ex.key: 鍵
  ex.book: 本
  ex.cat: 猫
  ex.dog: 犬
  ex.egg: 卵
  ex.girl: 女の子
  ex.pen: ペン
  ex.tea: "紅茶"
  ex.violin: バイオリン
  ex.fish: 魚
  ex.lemon: レモン
  ex.milk: 牛乳
  ex.name: 名前
  ex.sun: 太陽
  ex.box: 箱
  ex.zoo: 動物園
  ex.ice: 氷
  ex.yes: はい
  ex.orange: オレンジ
  ex.red: 赤
  ex.queen: 女王
  ex.umbrella: 傘
  ex.water: 水

  err.a.uk: "ウクライナの学校では、数学で使うラテン文字をウクライナ語の母音で読み、{term A}を{ipa a}と言います。"
  err.a.es: "スペイン語では{term A}を{ipa a}と言います。"
  err.a.pt: "ポルトガル語では{term A}を{ipa a}と言います。"
  err.a.fr: "フランス語では{term A}を{ipa a}と言います。"
  err.a.de: "ドイツ語では{term A}を{ipa aː}と言います。"
  err.a.it: "イタリア語では{term A}を{ipa a}と言います。"
  err.a.pl: "ポーランド語では{term A}を{ipa a}と言います。"
  err.a.tr: "トルコ語では{term A}を{ipa a}と言います。"
  err.a.id: "インドネシア語では{term A}を{ipa a}と言います。"
  err.a.vi: "ベトナム語では{term A}を{ipa a}と言います。"
  err.e.uk: "ウクライナの学校では、数学で使うラテン文字をウクライナ語の母音で読み、{term E}を{ipa e}と言います。"
  err.e.es: "スペイン語では{term E}を{ipa e}と言います。"
  err.e.pt: "ポルトガル語では{term E}を{ipa ɛ}と言います。"
  err.e.de: "ドイツ語では{term E}を{ipa eː}と言います。"
  err.e.it: "イタリア語では{term E}を{ipa e}と言います。"
  err.e.pl: "ポーランド語では{term E}を{ipa ɛ}と言います。"
  err.e.tr: "トルコ語では{term E}を{ipa e}と言います。"
  err.e.id: "インドネシア語では{term E}を{ipa e}と言います。"
  err.e.vi: "ベトナム語では{term E}を{ipa ɛ}と言います。"
  err.i.uk: "ウクライナの学校では、数学で使うラテン文字をウクライナ語の母音で読み、{term I}を{ipa i}と言います。"
  err.i.es: "スペイン語では{term I}を{ipa i}と言います。"
  err.i.pt: "ポルトガル語では{term I}を{ipa i}と言います。"
  err.i.fr: "フランス語では{term I}を{ipa i}と言います。"
  err.i.de: "ドイツ語では{term I}を{ipa iː}と言います。"
  err.i.it: "イタリア語では{term I}を{ipa i}と言います。"
  err.i.pl: "ポーランド語では{term I}を{ipa i}と言います。"
  err.i.id: "インドネシア語では{term I}を{ipa i}と言います。"
  err.i.vi: "ベトナム語では{term I}を{ipa i}と言います。"
  err.g.fr: "フランス語では{term G}を{ipa ʒe}と言い、英語の{term J}の名前に近く聞こえます。"
  err.g.pt: "ポルトガル語では{term G}を{ipa ʒe}と言い、英語の{term J}の名前に近く聞こえます。"
  err.v.es: "スペイン語では{term b}と{term v}を同じ音{ipa b}で発音します。"
  err.v.ja: "日本語には{ipa v}の音がなく、{term V}の名前を{l1 ja ブイ}と書きます。"
  err.w.fr: "フランス語では{term W}を{l1 fr double vé}と言います。"
  err.w.es: "スペインでは{term W}を{l1 es uve doble}、中南米の多くの国では{l1 es doble ve}と言います。"
  err.w.it: "イタリア語では{term W}を{l1 it doppia vu}と言います。"
  err.w.uk: "ウクライナの学校では、数学で使うラテン文字の{term W}を{l1 uk дубль-ве}と言います。"
  err.w.tr: "トルコ語では{term W}を{l1 tr çift ve}、つまり2つの{term v}と言います。"
  err.w.vi: "ベトナム語では{term W}を{l1 vi vê kép}、つまり2つの{term v}と言います。"
