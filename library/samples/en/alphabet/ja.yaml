# The English alphabet in Japanese: translations keyed by the ids of source.yaml.
language: ja
nativeReview: false
text:
  title: 英語のアルファベット
  def: 英語のアルファベットは26文字のラテン文字で、どの文字にも大文字と小文字、そして固有の名前があります。

  names-ei.title: "{ipa eɪ}を含む名前"
  names-ei.fact.1: "4つの文字は、{term day}と同じ母音{ipa eɪ}を名前に含みます。"

  names-ee.title: "{ipa iː}で終わる名前"
  names-ee.fact.1: "8つの文字は、{term see}と同じ母音{ipa iː}で名前が終わります。"
  names-ee.why.1: "{term B}、{term D}、{term P}、{term T}は、すぐに止まる音を表します。"
  names-ee.why.2: "そのため、名前では母音が後に来ます：{ipa biː}、{ipa diː}、{ipa piː}、{ipa tiː}。"

  names-e.title: "{ipa e}を含む名前"
  names-e.fact.1: "7つの文字は、{term ten}と同じ短い母音{ipa e}を名前に含みます。"
  names-e.why.1: "{term F}、{term L}、{term M}、{term N}、{term S}は、{term fff}のように伸ばせる音を表します。"
  names-e.why.2: "そのため、名前では母音が前に来ます：{ipa ef}、{ipa el}、{ipa em}、{ipa en}、{ipa es}。"

  names-ai.title: "{ipa aɪ}を含む名前"
  names-ai.fact.1: "2つの文字は、{term my}と同じ母音{ipa aɪ}を名前に含みます。"

  names-o-r.title: OとR
  names-o-r.fact.1: "{term O}の名前には{term no}の母音が、{term R}の名前には{term car}の母音があります。"

  names-u.title: "{ipa juː}で終わる名前"
  names-u.fact.1: "3つの文字は、{term you}と同じ{ipa juː}で名前が終わります。"
  names-u.why.1: "{term W}は昔、2つの{term u}を並べて書いたので、名前が{term double u}（2つのu）です。"

  err.a.rule: "{term A}の名前は、{term day}と同じ母音の{ipa eɪ}です。"
  err.e.rule:
    - "{term E}の名前は、{term see}と同じ{ipa iː}です。"
    - "{ipa eɪ}は{term A}の名前です。"
  err.i.rule:
    - "{term I}の名前は、{term my}と同じ{ipa aɪ}です。"
    - "{ipa iː}は{term E}の名前です。"
  err.g.rule:
    - "{term G}の名前は{ipa dʒiː}です。"
    - "{ipa dʒeɪ}は{term J}の名前です。"
  err.v.rule:
    - "{term V}の名前は{ipa viː}で、上の歯を下の唇に当てて言います。"
    - "{ipa biː}は{term B}です。"
  err.w.rule: "{term W}の名前は{term double u}、{ipa ˈdʌbəljuː}です。"

  ex.apple: りんご
  ex.house: 家
  ex.juice: ジュース
  ex.key: 鍵
  ex.book: 本
  ex.cat: 猫
