    rule: { id: err.e.rule, text: "The name of {term E} is {ipa iː}, as in {term see}; {ipa eɪ} is the name of {term A}." }
    speakers:
      uk: { id: err.e.uk, text: "Ukrainian schools name the Latin letters of mathematics with Ukrainian vowels, {term E} as {ipa e}." }
      es: { id: err.e.es, text: "Spanish names {term E} {ipa e}." }
      pt: { id: err.e.pt, text: "Portuguese names {term E} {ipa ɛ}." }
      de: { id: err.e.de, text: "German names {term E} {ipa eː}." }
      it: { id: err.e.it, text: "Italian names {term E} {ipa e}." }
      pl: { id: err.e.pl, text: "Polish names {term E} {ipa ɛ}." }
      tr: { id: err.e.tr, text: "Turkish names {term E} {ipa e}." }
      id: { id: err.e.id, text: "Indonesian names {term E} {ipa e}." }
      vi: { id: err.e.vi, text: "Vietnamese names {term E} {ipa ɛ}." }
  - id: err.i
    in: names-ai
    wrong: I {ipa iː}
    right: I {ipa aɪ}
    rule: { id: err.i.rule, text: "The name of {term I} is {ipa aɪ}, as in {term my}; {ipa iː} is the name of {term E}." }
    speakers:
      uk: { id: err.i.uk, text: "Ukrainian schools name the Latin letters of mathematics with Ukrainian vowels, {term I} as {ipa i}." }
      es: { id: err.i.es, text: "Spanish names {term I} {ipa i}." }
      pt: { id: err.i.pt, text: "Portuguese names {term I} {ipa i}." }
      fr: { id: err.i.fr, text: "French names {term I} {ipa i}." }
      de: { id: err.i.de, text: "German names {term I} {ipa iː}." }
      it: { id: err.i.it, text: "Italian names {term I} {ipa i}." }
      pl: { id: err.i.pl, text: "Polish names {term I} {ipa i}." }
      id: { id: err.i.id, text: "Indonesian names {term I} {ipa i}." }
      vi: { id: err.i.vi, text: "Vietnamese names {term I} {ipa i}." }
  - id: err.g
    in: names-ee
    wrong: G {ipa dʒeɪ}
    right: G {ipa dʒiː}
