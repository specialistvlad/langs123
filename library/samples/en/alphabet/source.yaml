# The English alphabet: a sample topic of the new library, written in English first (samples/README.md).
id: en.alphabet
status: draft
nativeReview: false
title: { id: title, text: The English alphabet }
definition: { id: def, text: "The English alphabet is 26 Latin letters, each with a capital form, a small form and its own name." }
essence:
  - { id: ess.a, to: names-ei, form: [A, a], ipa: eɪ, ex: { id: ess.a.ex, text: "{target a}pple" } }
  - { id: ess.b, to: names-ee, form: [B, b], ipa: biː, ex: { id: ess.b.ex, text: "{target b}ook" } }
  - { id: ess.c, to: names-ee, form: [C, c], ipa: siː, ex: { id: ess.c.ex, text: "{target c}at" } }
  - { id: ess.d, to: names-ee, form: [D, d], ipa: diː, ex: { id: ess.d.ex, text: "{target d}og" } }
  - { id: ess.e, to: names-ee, form: [E, e], ipa: iː, ex: { id: ess.e.ex, text: "{target e}gg" } }
  - { id: ess.f, to: names-e, form: [F, f], ipa: ef, ex: { id: ess.f.ex, text: "{target f}ish" } }
  - { id: ess.g, to: names-ee, form: [G, g], ipa: dʒiː, ex: { id: ess.g.ex, text: "{target g}irl" } }
  - { id: ess.h, to: names-ei, form: [H, h], ipa: eɪtʃ, ex: { id: ess.h.ex, text: "{target h}ouse" } }
  - { id: ess.i, to: names-ai, form: [I, i], ipa: aɪ, ex: { id: ess.i.ex, text: "{target i}ce" } }
  - { id: ess.j, to: names-ei, form: [J, j], ipa: dʒeɪ, ex: { id: ess.j.ex, text: "{target j}uice" } }
  - { id: ess.k, to: names-ei, form: [K, k], ipa: keɪ, ex: { id: ess.k.ex, text: "{target k}ey" } }
  - { id: ess.l, to: names-e, form: [L, l], ipa: el, ex: { id: ess.l.ex, text: "{target l}emon" } }
  - { id: ess.m, to: names-e, form: [M, m], ipa: em, ex: { id: ess.m.ex, text: "{target m}ilk" } }
  - { id: ess.n, to: names-e, form: [N, n], ipa: en, ex: { id: ess.n.ex, text: "{target n}ame" } }
  - { id: ess.o, to: names-o-r, form: [O, o], ipa: "{variant en-GB əʊ} {variant en-US oʊ}", ex: { id: ess.o.ex, text: "{target o}range" } }
  - { id: ess.p, to: names-ee, form: [P, p], ipa: piː, ex: { id: ess.p.ex, text: "{target p}en" } }
  - { id: ess.q, to: names-u, form: [Q, q], ipa: kjuː, ex: { id: ess.q.ex, text: "{target q}ueen" } }
  - { id: ess.r, to: names-o-r, form: [R, r], ipa: "{variant en-GB ɑː} {variant en-US ɑːr}", ex: { id: ess.r.ex, text: "{target r}ed" } }
  - { id: ess.s, to: names-e, form: [S, s], ipa: es, ex: { id: ess.s.ex, text: "{target s}un" } }
  - { id: ess.t, to: names-ee, form: [T, t], ipa: tiː, ex: { id: ess.t.ex, text: "{target t}ea" } }
  - { id: ess.u, to: names-u, form: [U, u], ipa: juː, ex: { id: ess.u.ex, text: "{target u}mbrella" } }
  - { id: ess.v, to: names-ee, form: [V, v], ipa: viː, ex: { id: ess.v.ex, text: "{target v}iolin" } }
  - { id: ess.w, to: names-u, form: [W, w], ipa: ˈdʌbəljuː, ex: { id: ess.w.ex, text: "{target w}ater" } }
  - { id: ess.x, to: names-e, form: [X, x], ipa: eks, ex: { id: ess.x.ex, text: "bo{target x}" } }
  - { id: ess.y, to: names-ai, form: [Y, y], ipa: waɪ, ex: { id: ess.y.ex, text: "{target y}es" } }
  - { id: ess.z, to: names-o-r, form: [Z, z], ipa: "{variant en-GB zed} {variant en-US ziː}", ex: { id: ess.z.ex, text: "{target z}oo" } }
subtopics:
  - id: names-ei
    level: A0
    title: { id: names-ei.title, text: "Names with {ipa eɪ}" }
    blocks:
      - id: names-ei.fact
        type: fact
        text:
          - { id: names-ei.fact.1, text: "Four letters have names with the vowel {ipa eɪ}, as in {term day}." }
      - id: names-ei.list
        type: list
        items:
          - { id: names-ei.a, form: A, ipa: eɪ, ex: { id: ex.apple, text: "{target a}pple" } }
          - { id: names-ei.h, form: H, ipa: eɪtʃ, ex: { id: ex.house, text: "{target h}ouse" } }
          - { id: names-ei.j, form: J, ipa: dʒeɪ, ex: { id: ex.juice, text: "{target j}uice" } }
          - { id: names-ei.k, form: K, ipa: keɪ, ex: { id: ex.key, text: "{target k}ey" } }
  - id: names-ee
    level: A0
    title: { id: names-ee.title, text: "Names that end in {ipa iː}" }
    blocks:
      - id: names-ee.fact
        type: fact
        text:
          - { id: names-ee.fact.1, text: "Eight letters have names that end in the vowel {ipa iː}, as in {term see}." }
      - id: names-ee.list
        type: list
        items:
          - { id: names-ee.b, form: B, ipa: biː, ex: { id: ex.book, text: "{target b}ook" } }
          - { id: names-ee.c, form: C, ipa: siː, ex: { id: ex.cat, text: "{target c}at" } }
          - { id: names-ee.d, form: D, ipa: diː, ex: { id: ex.dog, text: "{target d}og" } }
          - { id: names-ee.e, form: E, ipa: iː, ex: { id: ex.egg, text: "{target e}gg" } }
          - { id: names-ee.g, form: G, ipa: dʒiː, ex: { id: ex.girl, text: "{target g}irl" } }
          - { id: names-ee.p, form: P, ipa: piː, ex: { id: ex.pen, text: "{target p}en" } }
          - { id: names-ee.t, form: T, ipa: tiː, ex: { id: ex.tea, text: "{target t}ea" } }
          - { id: names-ee.v, form: V, ipa: viː, ex: { id: ex.violin, text: "{target v}iolin" } }
      - id: names-ee.why
        type: why
        text:
          - { id: names-ee.why.1, text: "{term B}, {term D}, {term P} and {term T} stand for sounds that stop at once." }
          - id: names-ee.why.2
            text: "Their names put the vowel after them: {term B} {ipa biː}, {term D} {ipa diː}, {term P} {ipa piː}, {term T} {ipa tiː}."
  - id: names-e
    level: A0
    title: { id: names-e.title, text: "Names with {ipa e}" }
    blocks:
      - id: names-e.fact
        type: fact
        text:
          - { id: names-e.fact.1, text: "Six letters have names with the short vowel {ipa e}, as in {term ten}." }
      - id: names-e.list
        type: list
        items:
          - { id: names-e.f, form: F, ipa: ef, ex: { id: ex.fish, text: "{target f}ish" } }
          - { id: names-e.l, form: L, ipa: el, ex: { id: ex.lemon, text: "{target l}emon" } }
          - { id: names-e.m, form: M, ipa: em, ex: { id: ex.milk, text: "{target m}ilk" } }
          - { id: names-e.n, form: N, ipa: en, ex: { id: ex.name, text: "{target n}ame" } }
          - { id: names-e.s, form: S, ipa: es, ex: { id: ex.sun, text: "{target s}un" } }
          - { id: names-e.x, form: X, ipa: eks, ex: { id: ex.box, text: "bo{target x}" } }
      - id: names-e.why
        type: why
        text:
          - id: names-e.why.1
            text: "{term F}, {term L}, {term M}, {term N} and {term S} stand for sounds that can be held, as in {term fff}."
          - id: names-e.why.2
            text: "Their names put the vowel before them: {term F} {ipa ef}, {term L} {ipa el}, {term M} {ipa em}, {term N} {ipa en}, {term S} {ipa es}."
  - id: names-ai
    level: A0
    title: { id: names-ai.title, text: "Names with {ipa aɪ}" }
    blocks:
      - id: names-ai.fact
        type: fact
        text:
          - { id: names-ai.fact.1, text: "Two letters have names with the vowel {ipa aɪ}, as in {term my}." }
      - id: names-ai.list
        type: list
        items:
          - { id: names-ai.i, form: I, ipa: aɪ, ex: { id: ex.ice, text: "{target i}ce" } }
          - { id: names-ai.y, form: Y, ipa: waɪ, ex: { id: ex.yes, text: "{target y}es" } }
  - id: names-o-r
    level: A0
    title: { id: names-o-r.title, text: "O, R and Z" }
    blocks:
      - id: names-o-r.fact
        type: fact
        text:
          - id: names-o-r.fact.1
            text: "Three letters have names that differ between British and American English."
      - id: names-o-r.list
        type: list
        items:
          - { id: names-o-r.o, form: O, ipa: "{variant en-GB əʊ} {variant en-US oʊ}", ex: { id: ex.orange, text: "{target o}range" } }
          - { id: names-o-r.r, form: R, ipa: "{variant en-GB ɑː} {variant en-US ɑːr}", ex: { id: ex.red, text: "{target r}ed" } }
          - { id: names-o-r.z, form: Z, ipa: "{variant en-GB zed} {variant en-US ziː}", ex: { id: ex.zoo, text: "{target z}oo" } }
  - id: names-u
    level: A0
    title: { id: names-u.title, text: "Names that end in {ipa juː}" }
    blocks:
      - id: names-u.fact
        type: fact
        text:
          - { id: names-u.fact.1, text: "Three letters have names that end in {ipa juː}, as in {term you}." }
      - id: names-u.list
        type: list
        items:
          - { id: names-u.q, form: Q, ipa: kjuː, ex: { id: ex.queen, text: "{target q}ueen" } }
          - { id: names-u.u, form: U, ipa: juː, ex: { id: ex.umbrella, text: "{target u}mbrella" } }
          - { id: names-u.w, form: W, ipa: ˈdʌbəljuː, ex: { id: ex.water, text: "{target w}ater" } }
      - id: names-u.why
        type: why
        text:
          - { id: names-u.why.1, text: "{term W} is two {term u}'s joined side by side, so its name is {term double u}." }
