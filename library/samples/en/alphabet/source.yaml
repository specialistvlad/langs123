# The English alphabet: a sample topic of the new library, written in English first (samples/README.md).
id: en.alphabet
course: en
source: en
status: draft
nativeReview: false
title: { id: title, text: The English alphabet }
definition: { id: def, text: "The English alphabet is 26 Latin letters, each with a capital form, a small form and its own name." }

essence:
  - { id: ess.a, to: names-ei, letter: A, small: a, name: eɪ }
  - { id: ess.b, to: names-ee, letter: B, small: b, name: biː }
  - { id: ess.c, to: names-ee, letter: C, small: c, name: siː }
  - { id: ess.d, to: names-ee, letter: D, small: d, name: diː }
  - { id: ess.e, to: names-ee, letter: E, small: e, name: iː }
  - { id: ess.f, to: names-e, letter: F, small: f, name: ef }
  - { id: ess.g, to: names-ee, letter: G, small: g, name: dʒiː }
  - { id: ess.h, to: names-ei, letter: H, small: h, name: eɪtʃ }
  - { id: ess.i, to: names-ai, letter: I, small: i, name: aɪ }
  - { id: ess.j, to: names-ei, letter: J, small: j, name: dʒeɪ }
  - { id: ess.k, to: names-ei, letter: K, small: k, name: keɪ }
  - { id: ess.l, to: names-e, letter: L, small: l, name: el }
  - { id: ess.m, to: names-e, letter: M, small: m, name: em }
  - { id: ess.n, to: names-e, letter: N, small: n, name: en }
  - { id: ess.o, to: names-o-r, letter: O, small: o, name: "{variant en-GB əʊ} {variant en-US oʊ}" }
  - { id: ess.p, to: names-ee, letter: P, small: p, name: piː }
  - { id: ess.q, to: names-u, letter: Q, small: q, name: kjuː }
  - { id: ess.r, to: names-o-r, letter: R, small: r, name: "{variant en-GB ɑː} {variant en-US ɑːr}" }
  - { id: ess.s, to: names-e, letter: S, small: s, name: es }
  - { id: ess.t, to: names-ee, letter: T, small: t, name: tiː }
  - { id: ess.u, to: names-u, letter: U, small: u, name: juː }
  - { id: ess.v, to: names-ee, letter: V, small: v, name: viː }
  - { id: ess.w, to: names-u, letter: W, small: w, name: ˈdʌbəljuː }
  - { id: ess.x, to: names-e, letter: X, small: x, name: eks }
  - { id: ess.y, to: names-ai, letter: Y, small: y, name: waɪ }
  - { id: ess.z, to: names-o-r, letter: Z, small: z, name: "{variant en-GB zed} {variant en-US ziː}" }

subtopics:
  - id: names-ei
    level: A0
    title: { id: names-ei.title, text: "Names with {ipa eɪ}" }
    blocks:
      - id: names-ei.fact
        type: fact
        text:
          - { id: names-ei.fact.1, text: "Four letters have names with the vowel {ipa eɪ}, as in {term day}." }
      - id: names-ei.list
        type: list
        items:
          - { id: names-ei.a, letter: A, name: eɪ, ex: { id: ex.apple, text: "{target a}pple" } }
          - { id: names-ei.h, letter: H, name: eɪtʃ, ex: { id: ex.house, text: "{target h}ouse" } }
          - { id: names-ei.j, letter: J, name: dʒeɪ, ex: { id: ex.juice, text: "{target j}uice" } }
          - { id: names-ei.k, letter: K, name: keɪ, ex: { id: ex.key, text: "{target k}ey" } }

  - id: names-ee
    level: A0
    title: { id: names-ee.title, text: "Names that end in {ipa iː}" }
    blocks:
      - id: names-ee.fact
        type: fact
        text:
          - { id: names-ee.fact.1, text: "Eight letters have names that end in the vowel {ipa iː}, as in {term see}." }
      - id: names-ee.list
        type: list
        items:
          - { id: names-ee.b, letter: B, name: biː, ex: { id: ex.book, text: "{target b}ook" } }
          - { id: names-ee.c, letter: C, name: siː, ex: { id: ex.cat, text: "{target c}at" } }
          - { id: names-ee.d, letter: D, name: diː, ex: { id: ex.dog, text: "{target d}og" } }
          - { id: names-ee.e, letter: E, name: iː, ex: { id: ex.egg, text: "{target e}gg" } }
          - { id: names-ee.g, letter: G, name: dʒiː, ex: { id: ex.girl, text: "{target g}irl" } }
          - { id: names-ee.p, letter: P, name: piː, ex: { id: ex.pen, text: "{target p}en" } }
          - { id: names-ee.t, letter: T, name: tiː, ex: { id: ex.tea, text: "{target t}ea" } }
          - { id: names-ee.v, letter: V, name: viː, ex: { id: ex.violin, text: "{target v}iolin" } }
      - id: names-ee.why
        type: why
        text:
          - { id: names-ee.why.1, text: "{term B}, {term D}, {term P} and {term T} stand for sounds that stop at once." }
          - { id: names-ee.why.2, text: "Their names put the vowel after them: {term B} {ipa biː}, {term D} {ipa diː}, {term P} {ipa piː}, {term T} {ipa tiː}." }

  - id: names-e
    level: A0
    title: { id: names-e.title, text: "Names with {ipa e}" }
    blocks:
      - id: names-e.fact
        type: fact
        text:
          - { id: names-e.fact.1, text: "Six letters have names with the short vowel {ipa e}, as in {term ten}." }
      - id: names-e.list
        type: list
        items:
          - { id: names-e.f, letter: F, name: ef, ex: { id: ex.fish, text: "{target f}ish" } }
          - { id: names-e.l, letter: L, name: el, ex: { id: ex.lemon, text: "{target l}emon" } }
          - { id: names-e.m, letter: M, name: em, ex: { id: ex.milk, text: "{target m}ilk" } }
          - { id: names-e.n, letter: N, name: en, ex: { id: ex.name, text: "{target n}ame" } }
          - { id: names-e.s, letter: S, name: es, ex: { id: ex.sun, text: "{target s}un" } }
          - { id: names-e.x, letter: X, name: eks, ex: { id: ex.box, text: "bo{target x}" } }
      - id: names-e.why
        type: why
        text:
          - { id: names-e.why.1, text: "{term F}, {term L}, {term M}, {term N} and {term S} stand for sounds that can be held, as in {term fff}." }
          - { id: names-e.why.2, text: "Their names put the vowel before them: {term F} {ipa ef}, {term L} {ipa el}, {term M} {ipa em}, {term N} {ipa en}, {term S} {ipa es}." }

  - id: names-ai
    level: A0
    title: { id: names-ai.title, text: "Names with {ipa aɪ}" }
    blocks:
      - id: names-ai.fact
        type: fact
        text:
          - { id: names-ai.fact.1, text: "Two letters have names with the vowel {ipa aɪ}, as in {term my}." }
      - id: names-ai.list
        type: list
        items:
          - { id: names-ai.i, letter: I, name: aɪ, ex: { id: ex.ice, text: "{target i}ce" } }
          - { id: names-ai.y, letter: Y, name: waɪ, ex: { id: ex.yes, text: "{target y}es" } }

  - id: names-o-r
    level: A0
    title: { id: names-o-r.title, text: "O, R and Z" }
    blocks:
      - id: names-o-r.fact
        type: fact
        text:
          - { id: names-o-r.fact.1, text: "Three letters have names that differ between British and American English: {term O}, {term R} and {term Z}." }
      - id: names-o-r.list
        type: list
        items:
          - { id: names-o-r.o, letter: O, name: "{variant en-GB əʊ} {variant en-US oʊ}", ex: { id: ex.orange, text: "{target o}range" } }
          - { id: names-o-r.r, letter: R, name: "{variant en-GB ɑː} {variant en-US ɑːr}", ex: { id: ex.red, text: "{target r}ed" } }
          - { id: names-o-r.z, letter: Z, name: "{variant en-GB zed} {variant en-US ziː}", ex: { id: ex.zoo, text: "{target z}oo" } }

  - id: names-u
    level: A0
    title: { id: names-u.title, text: "Names that end in {ipa juː}" }
    blocks:
      - id: names-u.fact
        type: fact
        text:
          - { id: names-u.fact.1, text: "Three letters have names that end in {ipa juː}, as in {term you}." }
      - id: names-u.list
        type: list
        items:
          - { id: names-u.q, letter: Q, name: kjuː, ex: { id: ex.queen, text: "{target q}ueen" } }
          - { id: names-u.u, letter: U, name: juː, ex: { id: ex.umbrella, text: "{target u}mbrella" } }
          - { id: names-u.w, letter: W, name: ˈdʌbəljuː, ex: { id: ex.water, text: "{target w}ater" } }
      - id: names-u.why
        type: why
        text:
          - { id: names-u.why.1, text: "{term W} is two {term u}'s joined side by side, so its name is {term double u}." }

errors:
  - id: err.a
    in: names-ei
    wrong: "A {ipa a}"
    right: "A {ipa eɪ}"
    rule: { id: err.a.rule, text: "The name of {term A} is {ipa eɪ}, as in {term day}." }
    speakers:
      uk: { id: err.a.uk, text: "Ukrainian schools name the Latin letters of mathematics with Ukrainian vowels, {term A} as {ipa a}." }
      es: { id: err.a.es, text: "Spanish names {term A} {ipa a}." }
      pt: { id: err.a.pt, text: "Portuguese names {term A} {ipa a}." }
      fr: { id: err.a.fr, text: "French names {term A} {ipa a}." }
      de: { id: err.a.de, text: "German names {term A} {ipa aː}." }
      it: { id: err.a.it, text: "Italian names {term A} {ipa a}." }
      pl: { id: err.a.pl, text: "Polish names {term A} {ipa a}." }
      tr: { id: err.a.tr, text: "Turkish names {term A} {ipa a}." }
      id: { id: err.a.id, text: "Indonesian names {term A} {ipa a}." }
      vi: { id: err.a.vi, text: "Vietnamese names {term A} {ipa a}." }

  - id: err.e
    in: names-ee
    wrong: "E {ipa e}"
    right: "E {ipa iː}"
    rule: { id: err.e.rule, text: "The name of {term E} is {ipa iː}, as in {term see}; {ipa eɪ} is the name of {term A}." }
    speakers:
      uk: { id: err.e.uk, text: "Ukrainian schools name the Latin letters of mathematics with Ukrainian vowels, {term E} as {ipa e}." }
      es: { id: err.e.es, text: "Spanish names {term E} {ipa e}." }
      pt: { id: err.e.pt, text: "Portuguese names {term E} {ipa ɛ}." }
      de: { id: err.e.de, text: "German names {term E} {ipa eː}." }
      it: { id: err.e.it, text: "Italian names {term E} {ipa e}." }
      pl: { id: err.e.pl, text: "Polish names {term E} {ipa ɛ}." }
      tr: { id: err.e.tr, text: "Turkish names {term E} {ipa e}." }
      id: { id: err.e.id, text: "Indonesian names {term E} {ipa e}." }
      vi: { id: err.e.vi, text: "Vietnamese names {term E} {ipa ɛ}." }

  - id: err.i
    in: names-ai
    wrong: "I {ipa iː}"
    right: "I {ipa aɪ}"
    rule: { id: err.i.rule, text: "The name of {term I} is {ipa aɪ}, as in {term my}; {ipa iː} is the name of {term E}." }
    speakers:
      uk: { id: err.i.uk, text: "Ukrainian schools name the Latin letters of mathematics with Ukrainian vowels, {term I} as {ipa i}." }
      es: { id: err.i.es, text: "Spanish names {term I} {ipa i}." }
      pt: { id: err.i.pt, text: "Portuguese names {term I} {ipa i}." }
      fr: { id: err.i.fr, text: "French names {term I} {ipa i}." }
      de: { id: err.i.de, text: "German names {term I} {ipa iː}." }
      it: { id: err.i.it, text: "Italian names {term I} {ipa i}." }
      pl: { id: err.i.pl, text: "Polish names {term I} {ipa i}." }
      id: { id: err.i.id, text: "Indonesian names {term I} {ipa i}." }
      vi: { id: err.i.vi, text: "Vietnamese names {term I} {ipa i}." }

  - id: err.g
    in: names-ee
    wrong: "G {ipa dʒeɪ}"
    right: "G {ipa dʒiː}"
    rule: { id: err.g.rule, text: "The name of {term G} is {ipa dʒiː}; {ipa dʒeɪ} is the name of {term J}." }
    speakers:
      fr: { id: err.g.fr, text: "French names {term G} {ipa ʒe}, close to the English name of {term J}." }
      pt: { id: err.g.pt, text: "Portuguese names {term G} {ipa ʒe}, close to the English name of {term J}." }

  - id: err.v
    in: names-ee
    wrong: "V {ipa biː}"
    right: "V {ipa viː}"
    rule: { id: err.v.rule, text: "The name of {term V} is {ipa viː}, with the top teeth on the lower lip; {ipa biː} is {term B}." }
    speakers:
      es: { id: err.v.es, text: "Spanish says {term b} and {term v} with one sound, {ipa b}." }
      ja: { id: err.v.ja, text: "Japanese has no {ipa v} and writes the name of {term V} as ブイ." }

  - id: err.w
    in: names-u
    wrong: "W {term double v}"
    right: "W {ipa ˈdʌbəljuː}"
    rule: { id: err.w.rule, text: "The name of {term W} is {term double u}, {ipa ˈdʌbəljuː}." }
    speakers:
      fr: { id: err.w.fr, text: "French names {term W} double vé." }
      es: { id: err.w.es, text: "Spain names {term W} uve doble, and much of Latin America doble ve." }
      it: { id: err.w.it, text: "Italian names {term W} doppia vu." }
      uk: { id: err.w.uk, text: "Ukrainian schools name the Latin {term W} of mathematics дубль-ве." }
      tr: { id: err.w.tr, text: "Turkish names {term W} çift ve, double v." }
      vi: { id: err.w.vi, text: "Vietnamese names {term W} vê kép, double v." }
