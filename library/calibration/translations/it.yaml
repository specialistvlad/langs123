# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their Italian translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "Non usare l’articolo davanti al nome della maggior parte dei paesi: di’ I live in Italy, non I live in the Italy."
  faithful: true
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "In spagnolo di solito si dice il pronome soggetto, perché la desinenza del verbo indica già la persona: hablo, hablas, habla."
  faithful: false
  mistake: "flipped negation: 'do not usually say' became 'usually say'"
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "In vietnamita il verbo cambia forma secondo il tempo; una parola a parte, come đã, indica che l’azione è finita: Tôi đã ăn."
  faithful: false
  mistake: "flipped negation: 'does not change' became 'changes'"
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Gli aggettivi inglesi non cambiano al plurale: a red car, two red cars."
  faithful: true
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "Il polacco ha sette casi. L’accusativo indica il complemento oggetto: Widzę kota."
  faithful: true
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "Il past simple dei verbi regolari inglesi termina in -ed: walk diventa walked. I verbi irregolari hanno forme proprie: go diventa went."
  faithful: true
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "Il verbo spagnolo hablar ha cinque forme del presente, una per ogni persona: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: false
  mistake: "wrong number: six forms became five"
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Usa il past perfect per un’azione iniziata nel passato che continua adesso: I have lived here for five years."
  faithful: false
  mistake: "wrong tense: present perfect became past perfect"
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "I sostantivi spagnoli che finiscono in -o sono di solito maschili, e quelli che finiscono in -a sono di solito femminili: el libro, la casa."
  faithful: true
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Usa much con i nomi numerabili e many con i nomi non numerabili: much water, many books."
  faithful: false
  mistake: "wrong grammatical term: countable and uncountable swapped"
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "Il turco forma il plurale di un nome con il suffisso -ler o -lar: kitap diventa kitaplar, ev diventa evler."
  faithful: true
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Un aggettivo di frequenza come sometimes va prima del verbo principale, ma dopo il verbo to be: She sometimes drinks tea. She is sometimes late."
  faithful: false
  mistake: "wrong grammatical term: adverb became adjective"
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "In inglese il verbo prende la -s dopo he, she o it al present simple, e resta invariato dopo I, you, we e they: she works, they work."
  faithful: true
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Gli aggettivi francesi di solito vanno dopo il nome: une voiture rouge."
  faithful: false
  mistake: "dropped clause: the sentence on grand and petit left out"
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "Il francese usa tu con amici e familiari e vous con gli sconosciuti."
  faithful: false
  mistake: "dropped clause: 'vous is also used when speaking to more than one person' left out"
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Una domanda in inglese richiede l’ausiliare do quando la frase non ha un altro ausiliare; con be o can, è il verbo stesso a spostarsi all’inizio: Do you speak French? Can you swim?"
  faithful: true
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Usa a davanti a un suono consonantico e an davanti a un suono vocalico: a book, an apple."
  faithful: true
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "L’italiano forma il plurale della maggior parte dei nomi femminili in -a con -e: una casa diventa due case."
  faithful: true
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "Il giapponese indica il tema della frase con la particella は, che si legge wa: 私が学生です。"
  faithful: false
  mistake: "changed example: 私は学生です became 私が学生です"
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "In tedesco il verbo occupa la seconda posizione nella frase principale: Heute ich lerne Deutsch."
  faithful: false
  mistake: "changed example: 'Heute lerne ich Deutsch' became 'Heute ich lerne Deutsch'"
