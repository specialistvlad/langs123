# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their Vietnamese translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "Đừng dùng mạo từ trước tên của hầu hết các quốc gia: hãy nói I live in Italy, chứ không nói I live in the Italy."
  faithful: true
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "Trong tiếng Tây Ban Nha, người ta thường nói đại từ chủ ngữ, vì đuôi động từ đã cho biết ngôi: hablo, hablas, habla."
  faithful: false
  mistake: "flipped negation: 'do not usually say' became 'usually say'"
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "Trong tiếng Việt, động từ không biến đổi theo thì; một từ riêng như đã cho biết hành động đã hoàn thành: Tôi đã ăn."
  faithful: true
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Tính từ tiếng Anh biến đổi theo số: a red car, two red cars."
  faithful: false
  mistake: "flipped negation: 'do not change' became 'change'"
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "Tiếng Ba Lan có bảy cách. Đối cách đánh dấu tân ngữ trực tiếp: Widzę kota."
  faithful: true
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "Thì hiện tại đơn của động từ có quy tắc trong tiếng Anh kết thúc bằng -ed: walk thành walked. Động từ bất quy tắc có dạng riêng: go thành went."
  faithful: false
  mistake: "wrong tense: past simple became present simple"
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "Động từ hablar của tiếng Tây Ban Nha có năm dạng ở thì hiện tại, mỗi ngôi một dạng: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: false
  mistake: "wrong number: six forms became five"
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Dùng present perfect cho hành động bắt đầu trong quá khứ và còn tiếp diễn đến bây giờ: I have lived here for five years."
  faithful: true
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "Danh từ tiếng Tây Ban Nha tận cùng bằng -o thường là giống đực, còn danh từ tận cùng bằng -a thường là giống cái: el libro, la casa."
  faithful: true
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Dùng much với danh từ không đếm được và many với danh từ đếm được: much water, many books."
  faithful: true
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "Tiếng Thổ Nhĩ Kỳ tạo số nhiều của danh từ bằng tiền tố -ler hoặc -lar: kitap thành kitaplar, ev thành evler."
  faithful: false
  mistake: "wrong grammatical term: suffix became prefix"
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Tính từ chỉ tần suất như sometimes đứng trước động từ chính nhưng đứng sau động từ to be: She sometimes drinks tea. She is sometimes late."
  faithful: false
  mistake: "wrong grammatical term: adverb became adjective"
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "Trong tiếng Anh, động từ thêm -s sau he, she hoặc it ở present simple, và giữ nguyên sau I, you, we và they: she works, they work."
  faithful: true
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Tính từ tiếng Pháp thường đứng sau danh từ: une voiture rouge."
  faithful: false
  mistake: "dropped clause: the sentence on grand and petit left out"
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "Tiếng Pháp dùng tu với bạn bè và gia đình, còn vous với người lạ; vous cũng được dùng khi nói với nhiều người."
  faithful: true
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Câu hỏi trong tiếng Anh cần trợ động từ do khi câu không có trợ động từ nào khác: Do you speak French? Can you swim?"
  faithful: false
  mistake: "dropped clause: 'with be or can, the verb itself moves to the front' left out"
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Dùng a trước âm phụ âm và an trước âm nguyên âm: a book, an apple."
  faithful: true
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "Tiếng Ý tạo số nhiều của hầu hết danh từ giống cái tận cùng bằng -a bằng -e: una casa thành due casi."
  faithful: false
  mistake: "changed example: 'due case' became 'due casi'"
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "Tiếng Nhật đánh dấu chủ đề của câu bằng trợ từ は, đọc là wa: 私が学生です。"
  faithful: false
  mistake: "changed example: 私は学生です became 私が学生です"
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "Trong tiếng Đức, động từ đứng ở vị trí thứ hai của mệnh đề chính: Heute lerne ich Deutsch."
  faithful: true
