# Planted pairs for calibrating RV-11 (M4 gate 4b): Spanish sources and their English translations. Ten faithful, ten with one planted mistake.
- source: "No uses el artículo delante del nombre de la mayoría de los países: di I live in Italy, no I live in the Italy."
  translation: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  faithful: true
- source: "En español, normalmente no se dice el pronombre de sujeto, porque la terminación del verbo ya indica la persona: hablo, hablas, habla."
  translation: "In Spanish, you usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  faithful: false
  mistake: "flipped negation: 'no se dice' became 'you usually say'"
- source: "En vietnamita, el verbo no cambia de forma según el tiempo; una palabra aparte, como đã, indica que la acción ha terminado: Tôi đã ăn."
  translation: "In Vietnamese, the verb changes its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  faithful: false
  mistake: "flipped negation: 'no cambia' became 'changes'"
- source: "Los adjetivos del inglés no cambian en plural: a red car, two red cars."
  translation: "English adjectives do not change in the plural: a red car, two red cars."
  faithful: true
- source: "El polaco tiene siete casos. El acusativo marca el complemento directo: Widzę kota."
  translation: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  faithful: true
- source: "El pasado simple de los verbos regulares del inglés termina en -ed: walk pasa a walked. Los verbos irregulares tienen formas propias: go pasa a went."
  translation: "The simple past of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  faithful: true
- source: "El verbo español hablar tiene seis formas de presente, una para cada persona: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "The Spanish verb hablar has five present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: false
  mistake: "wrong number: seis became five"
- source: "Usa el present perfect para una acción que empezó en el pasado y continúa ahora: I have lived here for five years."
  translation: "Use the past perfect for an action that began in the past and continues now: I have lived here for five years."
  faithful: false
  mistake: "wrong tense: present perfect became past perfect"
- source: "Los sustantivos españoles que terminan en -o suelen ser masculinos, y los que terminan en -a suelen ser femeninos: el libro, la casa."
  translation: "Spanish nouns that end in -o are usually masculine, and those that end in -a are usually feminine: el libro, la casa."
  faithful: true
- source: "Usa much con sustantivos incontables y many con sustantivos contables: much water, many books."
  translation: "Use much with countable nouns and many with uncountable nouns: much water, many books."
  faithful: false
  mistake: "wrong grammatical term: countable and uncountable swapped"
- source: "El turco forma el plural de un sustantivo con el sufijo -ler o -lar: kitap pasa a kitaplar, ev pasa a evler."
  translation: "Turkish forms the plural of a noun with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  faithful: true
- source: "Un adverbio de frecuencia como sometimes va antes del verbo principal, pero después del verbo to be: She sometimes drinks tea. She is sometimes late."
  translation: "An adjective of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  faithful: false
  mistake: "wrong grammatical term: adverbio became adjective"
- source: "En inglés, el verbo lleva -s después de he, she o it en presente simple, y no cambia después de I, you, we y they: she works, they work."
  translation: "In English, the verb takes -s after he, she or it in the present simple, and does not change after I, you, we and they: she works, they work."
  faithful: true
- source: "Los adjetivos franceses suelen ir después del sustantivo: une voiture rouge. Unos pocos adjetivos comunes, como grand y petit, van antes."
  translation: "French adjectives usually come after the noun: une voiture rouge."
  faithful: false
  mistake: "dropped clause: the sentence on grand and petit left out"
- source: "El francés usa tu con amigos y familiares y vous con desconocidos; vous también se usa para hablar con más de una persona."
  translation: "French uses tu with friends and family and vous with strangers."
  faithful: false
  mistake: "dropped clause: 'vous also used for more than one person' left out"
- source: "Una pregunta en inglés necesita el auxiliar do cuando la oración no tiene otro auxiliar; con be o can, el propio verbo pasa al principio: Do you speak French? Can you swim?"
  translation: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself goes to the front: Do you speak French? Can you swim?"
  faithful: true
- source: "Usa a delante de un sonido consonántico y an delante de un sonido vocálico: a book, an apple."
  translation: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  faithful: true
- source: "El italiano forma el plural de la mayoría de los sustantivos femeninos acabados en -a con -e: una casa pasa a due case."
  translation: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  faithful: true
- source: "El japonés marca el tema de la oración con la partícula は, que se lee wa: 私は学生です。"
  translation: "Japanese marks the topic of a sentence with the particle は, which is read wa: 私が学生です。"
  faithful: false
  mistake: "changed example: 私は学生です became 私が学生です"
- source: "En alemán, el verbo ocupa la segunda posición de una oración principal: Heute lerne ich Deutsch."
  translation: "In German, the verb occupies the second position of a main clause: Heute ich lerne Deutsch."
  faithful: false
  mistake: "changed example: 'Heute lerne ich Deutsch' became 'Heute ich lerne Deutsch'"
