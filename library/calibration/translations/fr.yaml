# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their French translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "N’utilisez pas l’article devant le nom de la plupart des pays : dites I live in Italy, et non I live in the Italy."
  faithful: true
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "En espagnol, on dit généralement le pronom sujet, car la terminaison du verbe indique déjà la personne : hablo, hablas, habla."
  faithful: false
  mistake: "flipped negation: 'do not usually say' became 'usually say'"
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "En vietnamien, le verbe ne change pas de forme selon le temps ; un mot distinct, comme đã, indique que l’action est terminée : Tôi đã ăn."
  faithful: true
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Les adjectifs anglais changent au pluriel : a red car, two red cars."
  faithful: false
  mistake: "flipped negation: 'do not change' became 'change'"
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "Le polonais a sept cas. L’accusatif marque le complément d’objet direct : Widzę kota."
  faithful: true
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "Le présent simple des verbes réguliers anglais se termine par -ed : walk devient walked. Les verbes irréguliers ont leurs propres formes : go devient went."
  faithful: false
  mistake: "wrong tense: past simple became present simple"
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "Le verbe espagnol hablar a cinq formes au présent, une pour chaque personne : hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: false
  mistake: "wrong number: six forms became five"
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Utilisez le present perfect pour une action qui a commencé dans le passé et qui continue maintenant : I have lived here for five years."
  faithful: true
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "En espagnol, les noms qui se terminent par -o sont généralement masculins, et ceux qui se terminent par -a sont généralement féminins : el libro, la casa."
  faithful: true
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Utilisez much avec les noms indénombrables et many avec les noms dénombrables : much water, many books."
  faithful: true
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "Le turc forme le pluriel d’un nom avec le préfixe -ler ou -lar : kitap devient kitaplar, ev devient evler."
  faithful: false
  mistake: "wrong grammatical term: suffix became prefix"
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Un adjectif de fréquence comme sometimes se place avant le verbe principal, mais après le verbe to be : She sometimes drinks tea. She is sometimes late."
  faithful: false
  mistake: "wrong grammatical term: adverb became adjective"
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "En anglais, le verbe prend un -s après he, she ou it au present simple, et reste inchangé après I, you, we et they : she works, they work."
  faithful: true
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Les adjectifs français se placent généralement après le nom : une voiture rouge."
  faithful: false
  mistake: "dropped clause: the sentence on grand and petit left out"
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "Le français emploie tu avec les amis et la famille, et vous avec les inconnus ; vous s’emploie aussi pour s’adresser à plusieurs personnes."
  faithful: true
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Une question en anglais a besoin de l’auxiliaire do quand la phrase n’a pas d’autre auxiliaire : Do you speak French? Can you swim?"
  faithful: false
  mistake: "dropped clause: 'with be or can, the verb itself moves to the front' left out"
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Utilisez a devant un son consonantique et an devant un son vocalique : a book, an apple."
  faithful: true
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "L’italien forme le pluriel de la plupart des noms féminins en -a avec -e : una casa devient due casi."
  faithful: false
  mistake: "changed example: 'due case' became 'due casi'"
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "Le japonais marque le thème de la phrase avec la particule は, qui se lit wa : 私が学生です。"
  faithful: false
  mistake: "changed example: 私は学生です became 私が学生です"
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "En allemand, le verbe occupe la deuxième place dans une proposition principale : Heute lerne ich Deutsch."
  faithful: true
