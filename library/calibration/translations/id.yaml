# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their Indonesian translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "Gunakan artikel di depan nama sebagian besar negara: katakan I live in Italy, bukan I live in the Italy."
  faithful: false
  mistake: "flipped negation: 'Do not use' became 'Use'"
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "Dalam bahasa Spanyol, kata ganti subjek biasanya tidak diucapkan, karena akhiran kata kerja sudah menunjukkan persona: hablo, hablas, habla."
  faithful: true
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "Dalam bahasa Vietnam, kata kerja berubah bentuk menurut kala; kata terpisah seperti đã menunjukkan bahwa tindakan itu sudah selesai: Tôi đã ăn."
  faithful: false
  mistake: "flipped negation: 'does not change' became 'changes'"
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Kata sifat bahasa Inggris tidak berubah menurut jumlah: a red car, two red cars."
  faithful: true
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "Bahasa Polandia memiliki enam kasus. Akusatif menandai objek langsung: Widzę kota."
  faithful: false
  mistake: "wrong number: seven cases became six"
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "Past simple kata kerja beraturan bahasa Inggris berakhiran -ed: walk menjadi walked. Kata kerja tak beraturan punya bentuk sendiri: go menjadi went."
  faithful: true
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "Kata kerja bahasa Spanyol hablar memiliki enam bentuk kala sekarang, satu untuk setiap persona: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: true
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Gunakan past perfect untuk tindakan yang dimulai di masa lalu dan berlanjut sekarang: I have lived here for five years."
  faithful: false
  mistake: "wrong tense: present perfect became past perfect"
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "Kata benda bahasa Spanyol yang berakhiran -o biasanya feminin, dan yang berakhiran -a biasanya maskulin: el libro, la casa."
  faithful: false
  mistake: "wrong grammatical term: masculine and feminine swapped"
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Gunakan much dengan kata benda yang dapat dihitung dan many dengan kata benda yang tidak dapat dihitung: much water, many books."
  faithful: false
  mistake: "wrong grammatical term: countable and uncountable swapped"
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "Bahasa Turki membentuk jamak kata benda dengan akhiran -ler atau -lar: kitap menjadi kitaplar, ev menjadi evler."
  faithful: true
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Kata keterangan frekuensi seperti sometimes diletakkan sebelum kata kerja utama, tetapi sesudah kata kerja to be: She sometimes drinks tea. She is sometimes late."
  faithful: true
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "Dalam bahasa Inggris, kata kerja mendapat -s setelah he, she, atau it pada present simple: she works, they work."
  faithful: false
  mistake: "dropped clause: 'stays unchanged after I, you, we and they' left out"
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Kata sifat bahasa Prancis biasanya diletakkan setelah kata benda: une voiture rouge. Beberapa kata sifat umum, seperti grand dan petit, diletakkan sebelumnya."
  faithful: true
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "Bahasa Prancis menggunakan tu untuk teman dan keluarga serta vous untuk orang asing."
  faithful: false
  mistake: "dropped clause: 'vous is also used when speaking to more than one person' left out"
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Kalimat tanya dalam bahasa Inggris memerlukan kata kerja bantu do jika kalimat tidak memiliki kata kerja bantu lain; dengan be atau can, kata kerjanya sendiri pindah ke depan: Do you speak French? Can you swim?"
  faithful: true
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Gunakan a sebelum bunyi konsonan dan an sebelum bunyi vokal: a book, a apple."
  faithful: false
  mistake: "changed example: 'an apple' became 'a apple'"
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "Bahasa Italia membentuk jamak sebagian besar kata benda feminin berakhiran -a dengan -e: una casa menjadi due case."
  faithful: true
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "Bahasa Jepang menandai topik kalimat dengan partikel は, yang dibaca wa: 私は学生です。"
  faithful: true
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "Dalam bahasa Jerman, kata kerja berada di posisi kedua dalam klausa utama: Heute ich lerne Deutsch."
  faithful: false
  mistake: "changed example: 'Heute lerne ich Deutsch' became 'Heute ich lerne Deutsch'"
