# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their Spanish translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "No uses el artículo delante del nombre de la mayoría de los países: di I live in Italy, no I live in the Italy."
  faithful: true
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "En español normalmente no se dice el pronombre de sujeto, porque la terminación del verbo ya indica la persona: hablo, hablas, habla."
  faithful: true
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "En vietnamita, el verbo cambia de forma según el tiempo; una palabra aparte, como đã, indica que la acción ha terminado: Tôi đã ăn."
  faithful: false
  mistake: "flipped negation: 'does not change' became 'changes'"
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Los adjetivos del inglés cambian en plural: a red car, two red cars."
  faithful: false
  mistake: "flipped negation: 'do not change' became 'change'"
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "El polaco tiene siete casos. El acusativo marca el complemento directo: Widzę kota."
  faithful: true
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "El presente simple de los verbos regulares ingleses termina en -ed: walk pasa a walked. Los verbos irregulares tienen formas propias: go pasa a went."
  faithful: false
  mistake: "wrong tense: past simple became present simple"
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "El verbo español hablar tiene seis formas en presente, una para cada persona: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: true
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Usa el past perfect para una acción que empezó en el pasado y continúa ahora: I have lived here for five years."
  faithful: false
  mistake: "wrong tense: present perfect became past perfect"
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "Los sustantivos españoles que terminan en -o suelen ser masculinos, y los que terminan en -a suelen ser femeninos: el libro, la casa."
  faithful: true
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Usa much con sustantivos contables y many con sustantivos incontables: much water, many books."
  faithful: false
  mistake: "wrong grammatical term: countable and uncountable swapped"
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "El turco forma el plural de un sustantivo con el prefijo -ler o -lar: kitap pasa a kitaplar, ev pasa a evler."
  faithful: false
  mistake: "wrong grammatical term: suffix became prefix"
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Un adverbio de frecuencia como sometimes va antes del verbo principal, pero después del verbo to be: She sometimes drinks tea. She is sometimes late."
  faithful: true
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "En inglés, el verbo lleva -s después de he, she o it en el presente simple, y no cambia después de I, you, we y they: she works, they work."
  faithful: true
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Los adjetivos franceses suelen ir después del sustantivo: une voiture rouge. Unos pocos adjetivos comunes, como grand y petit, van antes."
  faithful: true
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "El francés usa tu con amigos y familiares y vous con desconocidos."
  faithful: false
  mistake: "dropped clause: 'vous is also used when speaking to more than one person' left out"
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Una pregunta en inglés necesita el auxiliar do cuando la oración no tiene otro auxiliar: Do you speak French? Can you swim?"
  faithful: false
  mistake: "dropped clause: 'with be or can, the verb itself moves to the front' left out"
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Usa a delante de un sonido consonántico y an delante de un sonido vocálico: a book, an apple."
  faithful: true
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "El italiano forma el plural de la mayoría de los sustantivos femeninos acabados en -a con -e: una casa pasa a due casi."
  faithful: false
  mistake: "changed example: 'due case' became 'due casi'"
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "El japonés marca el tema de la oración con la partícula は, que se lee wa: 私は学生です。"
  faithful: true
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "En alemán, el verbo ocupa la segunda posición de una oración principal: Heute ich lerne Deutsch."
  faithful: false
  mistake: "changed example: 'Heute lerne ich Deutsch' became 'Heute ich lerne Deutsch'"
