# Planted pairs for calibrating RV-11 (M4 gate 4b): English sources and their Polish translations. Ten faithful, ten with one planted mistake.
- source: "Do not use the article before the names of most countries: say I live in Italy, not I live in the Italy."
  translation: "Używaj rodzajnika przed nazwami większości krajów: mów I live in Italy, a nie I live in the Italy."
  faithful: false
  mistake: "flipped negation: 'Do not use' became 'Use'"
- source: "In Spanish, you do not usually say the subject pronoun, because the verb ending already shows the person: hablo, hablas, habla."
  translation: "W hiszpańskim zwykle mówi się zaimek osobowy w funkcji podmiotu, ponieważ końcówka czasownika już wskazuje osobę: hablo, hablas, habla."
  faithful: false
  mistake: "flipped negation: 'do not usually say' became 'usually say'"
- source: "In Vietnamese, the verb does not change its form for tense; a separate word such as đã shows that the action is finished: Tôi đã ăn."
  translation: "W wietnamskim czasownik nie zmienia formy w zależności od czasu; osobne słowo, takie jak đã, pokazuje, że czynność jest zakończona: Tôi đã ăn."
  faithful: true
- source: "English adjectives do not change for number: a red car, two red cars."
  translation: "Angielskie przymiotniki nie zmieniają się w liczbie mnogiej: a red car, two red cars."
  faithful: true
- source: "Polish has seven cases. The accusative marks the direct object: Widzę kota."
  translation: "Polski ma sześć przypadków. Biernik oznacza dopełnienie bliższe: Widzę kota."
  faithful: false
  mistake: "wrong number: seven cases became six"
- source: "The past simple of regular English verbs ends in -ed: walk becomes walked. Irregular verbs have their own forms: go becomes went."
  translation: "Past simple regularnych czasowników angielskich kończy się na -ed: walk zmienia się w walked. Czasowniki nieregularne mają własne formy: go zmienia się w went."
  faithful: true
- source: "The Spanish verb hablar has six present-tense forms, one for each person: hablo, hablas, habla, hablamos, habláis, hablan."
  translation: "Hiszpański czasownik hablar ma pięć form czasu teraźniejszego, po jednej dla każdej osoby: hablo, hablas, habla, hablamos, habláis, hablan."
  faithful: false
  mistake: "wrong number: six forms became five"
- source: "Use the present perfect for an action that began in the past and continues now: I have lived here for five years."
  translation: "Używaj present perfect do czynności, która zaczęła się w przeszłości i trwa do teraz: I have lived here for five years."
  faithful: true
- source: "Spanish nouns that end in -o are usually masculine, and nouns that end in -a are usually feminine: el libro, la casa."
  translation: "Hiszpańskie rzeczowniki zakończone na -o są zwykle rodzaju żeńskiego, a zakończone na -a zwykle rodzaju męskiego: el libro, la casa."
  faithful: false
  mistake: "wrong grammatical term: masculine and feminine swapped"
- source: "Use much with uncountable nouns and many with countable nouns: much water, many books."
  translation: "Używaj much z rzeczownikami niepoliczalnymi, a many z policzalnymi: much water, many books."
  faithful: true
- source: "Turkish makes a noun plural with the suffix -ler or -lar: kitap becomes kitaplar, ev becomes evler."
  translation: "Turecki tworzy liczbę mnogą rzeczownika za pomocą przyrostka -ler lub -lar: kitap zmienia się w kitaplar, ev zmienia się w evler."
  faithful: true
- source: "An adverb of frequency such as sometimes goes before the main verb but after the verb to be: She sometimes drinks tea. She is sometimes late."
  translation: "Przymiotnik częstotliwości, taki jak sometimes, stoi przed czasownikiem głównym, ale po czasowniku to be: She sometimes drinks tea. She is sometimes late."
  faithful: false
  mistake: "wrong grammatical term: adverb became adjective"
- source: "In English, the verb takes -s after he, she or it in the present simple, and it stays unchanged after I, you, we and they: she works, they work."
  translation: "W angielskim czasownik dostaje końcówkę -s po he, she lub it w present simple: she works, they work."
  faithful: false
  mistake: "dropped clause: 'stays unchanged after I, you, we and they' left out"
- source: "French adjectives usually come after the noun: une voiture rouge. A few common adjectives, such as grand and petit, come before it."
  translation: "Francuskie przymiotniki zwykle stoją po rzeczowniku: une voiture rouge."
  faithful: false
  mistake: "dropped clause: the sentence on grand and petit left out"
- source: "French uses tu with friends and family and vous with strangers; vous is also used when speaking to more than one person."
  translation: "We francuskim tu używa się wobec przyjaciół i rodziny, a vous wobec nieznajomych; vous używa się też, gdy zwracasz się do kilku osób."
  faithful: true
- source: "A question in English needs the auxiliary do when the sentence has no other auxiliary; with be or can, the verb itself moves to the front: Do you speak French? Can you swim?"
  translation: "Pytanie w angielskim wymaga czasownika posiłkowego do, gdy zdanie nie ma innego czasownika posiłkowego; przy be lub can sam czasownik przechodzi na początek: Do you speak French? Can you swim?"
  faithful: true
- source: "Use a before a consonant sound and an before a vowel sound: a book, an apple."
  translation: "Używaj a przed głoską spółgłoskową, a an przed głoską samogłoskową: a book, a apple."
  faithful: false
  mistake: "changed example: 'an apple' became 'a apple'"
- source: "Italian forms the plural of most feminine nouns ending in -a with -e: una casa becomes due case."
  translation: "Włoski tworzy liczbę mnogą większości rzeczowników rodzaju żeńskiego zakończonych na -a za pomocą końcówki -e: una casa zmienia się w due case."
  faithful: true
- source: "Japanese marks the topic of a sentence with the particle は, read as wa: 私は学生です。"
  translation: "Japoński oznacza temat zdania partykułą は, czytaną jako wa: 私が学生です。"
  faithful: false
  mistake: "changed example: 私は学生です became 私が学生です"
- source: "In German, the verb stands in the second position of a main clause: Heute lerne ich Deutsch."
  translation: "W niemieckim czasownik stoi na drugim miejscu w zdaniu głównym: Heute lerne ich Deutsch."
  faithful: true
