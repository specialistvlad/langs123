# Planted cases for calibrating the review's questions (M4 gate 4b): each question rule's written case (library/RULES.md,
# Not this) put into a copy of a sample, where its question must find it at `at`; the rest of the sample stays as it is.
# `set` names the element whose text the case replaces, or, with `field`, an error's form; `file` is the sample's
# source or one of its language files, which the case adds where the sample has none. The rules whose course or
# language no sample holds (NO-12, NO-13, NO-14, NO-18, NO-32, NO-49) and the index's are planted when M6 brings them.
