# The words Japanese examples write in kanji at A1 and A2 (NO-26): an A1 example writes in kanji the kanji of the
# A1 words, an A2 example those of the A1 and A2 words, and every other word in kana (NO-25 keeps A0 in kana).
# 146 A1 words hold 96 kanji; 144 A2 words add 136.
source:
  name: The Japanese course's own A1 and A2 vocabulary, written by the library's content writer from its own knowledge of the words a beginner reads in kanji at each level (requirement 3.2, IX-09)
  licence: CC BY 4.0, as the library's content
  url: https://github.com/specialistvlad/langs123/blob/main/library/ja/kanji.yaml
