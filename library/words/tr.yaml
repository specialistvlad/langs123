# The words the linter reads for Turkish (library/RULES.md names each rule).
language: tr
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [sayfa, sayfada, sayfası, sayfayı, sayfanın, sayfaya, sayfadan, sayfadaki, sayfalar, sayfaları, sayfalarda]
  topic: [konu, konuda, konusu, konuyu, konunun, konuya, konudan, konudaki, konuyla, konular, konuları, konularda]
  guide: [rehber, rehberi, rehberde, rehberin, rehbere, kılavuz, kılavuzu, kılavuzda, kılavuzun]
  course: [kurs, kursu, kursta, kursun, kursa, kurslar]
topic: # NO-45; bölüm is the interface's word for a section
  word: konu
  synonyms: [ders, dersi, derste, dersin, dersler]
address: [sen, seni, sana, senin, sende, senden, seninle, sence] # NO-42
