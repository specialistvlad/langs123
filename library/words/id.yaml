# The words the linter reads for Indonesian (library/RULES.md names each rule).
language: id
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [halaman ini, satu halaman, di halaman ini] # phrases, since halaman is also a yard
  topic: [topik]
  guide: [panduan]
  course: [kursus]
topic: # NO-45; bagian is the interface's word for a section
  word: topik
  synonyms: [pelajaran, bab]
address: [kamu, kau, engkau, dikau] # NO-43
