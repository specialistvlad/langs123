# The words the linter reads for Spanish (library/RULES.md names each rule).
language: es
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [página, páginas]
  topic: [tema, temas]
  guide: [guía, guías]
  course: [este curso, un curso, el curso, del curso, cursos] # phrases, since "en curso" says an action is under way
topic: # NO-45
  word: tema
  synonyms: [lección, lecciones]
address: [usted, ustedes] # NO-36
vosotros: # NO-29: the forms an element carries es-ES for; the -ir present forms vos shares (vivís, venís, decís) stand in neither list
