# The words the linter reads for Italian (library/RULES.md names each rule).
language: it
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [pagina, pagine]
  topic: [argomento, argomenti]
  guide: [guida, guide]
  course: [questo corso, un corso, il corso, del corso, corsi] # phrases, since "in corso" says an action is under way
topic: # NO-45; tema is also a verb's stem, and sezione the interface's word for a section
  word: argomento
  synonyms: [lezione, lezioni, capitolo, capitoli]
address: [Lei, Suo, Sua, Suoi] # NO-40: the capitalised formal forms; Sue is also an English name
spellings: # NO-53: the accent on a final stressed vowel
  - { wrong: citta, right: città }
  - { wrong: perche, right: perché }
  - { wrong: pero, right: però }
  - { wrong: piu, right: più }
  - { wrong: puo, right: può }
  - { wrong: gia, right: già }
  - { wrong: giu, right: giù }
  - { wrong: cosi, right: così }
  - { wrong: cioe, right: cioè }
  - { wrong: poiche, right: poiché }
  - { wrong: benche, right: benché }
  - { wrong: affinche, right: affinché }
  - { wrong: finche, right: finché }
  - { wrong: nonche, right: nonché }
  - { wrong: caffe, right: caffè }
  - { wrong: lunedi, right: lunedì }
  - { wrong: martedi, right: martedì }
  - { wrong: mercoledi, right: mercoledì }
  - { wrong: giovedi, right: giovedì }
  - { wrong: venerdi, right: venerdì }
  - { wrong: eta, right: età }
  - { wrong: verita, right: verità }
  - { wrong: universita, right: università }
  - { wrong: societa, right: società }
  - { wrong: attivita, right: attività }
  - { wrong: possibilita, right: possibilità }
  - { wrong: qualita, right: qualità }
  - { wrong: quantita, right: quantità }
  - { wrong: novita, right: novità }
  - { wrong: liberta, right: libertà }
  - { wrong: realta, right: realtà }
  - { wrong: virtu, right: virtù }
  - { wrong: ventitre, right: ventitré }
