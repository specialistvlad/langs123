# The words the linter reads for English (library/RULES.md names each rule).
language: en
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [page, pages]
  topic: [topic, topics]
  guide: [guide, guides]
  course: [this course, a course, the course, courses] # phrases, since "of course" is a polite phrase the essence may hold
topic: # NO-45
  word: topic
  synonyms: [lesson, lessons, chapter, chapters]
spellings: # NO-01: each US spelling with its British form; the US spelling may stand inside an en-US variant
