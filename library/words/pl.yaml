# The words the linter reads for Polish (library/RULES.md names each rule).
language: pl
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [na stronie, na tej stronie, na jednej stronie, ta strona] # phrases, since strona is also a side, as in po prawej stronie
  topic: [temat, tematu, temacie, tematem, tematy, tematów, tematach, tematami, tematom]
  guide: [przewodnik, przewodnika, przewodniku, przewodnikiem, poradnik, poradnika, poradniku]
  course: [kurs, kursu, kursie, kursem, kursy, kursów]
topic: # NO-45; dział is the interface's word for a section
  word: temat
  synonyms: [lekcja, lekcji, lekcję, lekcje, lekcją, lekcjach, rozdział, rozdziału, rozdziale]
address: # NO-41: Pan and Pani, and the capitalised twój mid-sentence
  - Pan
  - Pani
  - Pana
  - Panu
  - Panem
  - Panią
  - Państwo
  - Twój
  - Twoja
  - Twoje
  - Twoi
  - Twojego
  - Twojej
  - Twojemu
  - Twoim
  - Twoją
  - Twoich
  - Twoimi
  - Ciebie
  - Tobie
  - Tobą
  - Cię
