# The words the linter reads for Ukrainian (library/RULES.md names each rule).
language: uk
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [сторінка, сторінки, сторінці, сторінку, сторінкою, сторінок, сторінках, сторінкам, сторінками]
  topic: [тема, теми, темі, тему, темою, тем, темах, темам, темами]
  guide: [посібник, посібника, посібнику, посібником, посібники, посібників, путівник, путівника, путівнику, довідник, довідника, довіднику]
  course: [курс, курсу, курсі, курсом, курси, курсів]
topic: # NO-45; розділ is the interface's word for a section
  word: тема
  synonyms: [урок, уроку, уроці, уроком, уроки, уроків, уроках]
address: [ти, тебе, тобі, тобою, твій, твоя, твоє, твої, твого, твоєї, твоєму, твоїй, твоїм, твою, твоїх, твоїми] # NO-35
