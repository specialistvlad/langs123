# The words the linter reads for Japanese (library/RULES.md names each rule).
language: ja
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [ページ]
  topic: [トピック]
  guide: [ガイド, 手引き]
  course: [コース]
topic: # NO-45; セクション is the interface's word for a section
  word: トピック
  synonyms: [レッスン, 単元]
address: [あなた, 貴方, 君, お前, おまえ] # NO-58
