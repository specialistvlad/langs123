# The words the linter reads for Vietnamese (library/RULES.md names each rule).
language: vi
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [trang này, một trang, các trang, trang sau, trang web] # phrases, since trang is a syllable of trang phục and trang trí
  topic: [chủ đề]
  guide: [hướng dẫn, cẩm nang]
  course: [khóa học, khoá học]
topic: # NO-45; phần is the interface's word for a section
  word: chủ đề
  synonyms: [bài học, đề tài]
spellings: # NO-56: words with their tone marks and diacritics dropped; each wrong form here is no Vietnamese word
  - { wrong: tieng, right: tiếng }
  - { wrong: Viet, right: Việt }
  - { wrong: nguoi, right: người }
  - { wrong: khong, right: không }
  - { wrong: duoc, right: được }
  - { wrong: mot, right: một }
  - { wrong: cac, right: các }
  - { wrong: nhieu, right: nhiều }
  - { wrong: hoc, right: học }
  - { wrong: nghia, right: nghĩa }
  - { wrong: tren, right: trên }
  - { wrong: duoi, right: dưới }
  - { wrong: giua, right: giữa }
  - { wrong: truoc, right: trước }
  - { wrong: thuong, right: thường }
  - { wrong: hon, right: hơn }
  - { wrong: vi du, right: ví dụ }
  - { wrong: ngu phap, right: ngữ pháp }
  - { wrong: danh tu, right: danh từ }
  - { wrong: dong tu, right: động từ }
