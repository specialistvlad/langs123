# The words the linter reads for French (library/RULES.md names each rule).
language: fr
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [page, pages]
  topic: [thème, thèmes]
  guide: [guide, guides]
  course: [ce cours, ces cours, un cours, le cours, du cours, les cours] # phrases, since "en cours" says an action is under way and "au cours de" means during
topic: # NO-45; sujet is the grammatical subject
  word: thème
  synonyms: [leçon, leçons, chapitre, chapitres]
address: [tu, te, toi, ta, tes] # NO-38; ton is also the noun tone
