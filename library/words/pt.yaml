# The words the linter reads for Portuguese (library/RULES.md names each rule).
language: pt
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [página, páginas]
  topic: [tópico, tópicos]
  guide: [guia, guias]
  course: [este curso, um curso, o curso, do curso, cursos] # phrases, since "em curso" says an action is under way
topic: # NO-45
  word: tópico
  synonyms: [tema, temas, lição, lições]
address: [tu, te, ti, contigo, teu, tua, teus, tuas, vós, vosso, vossa, vossos, vossas] # NO-37
