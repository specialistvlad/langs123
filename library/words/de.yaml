# The words the linter reads for German (library/RULES.md names each rule).
language: de
tour: # SH-08 reads all four lists, in the title, definition and essence; VO-04 reads page, topic and guide, in every sentence
  page: [auf dieser Seite, auf einer Seite, diese Seite, dieser Seite] # phrases, since Seite is also a side, as in auf der linken Seite
  topic: [Thema, Themen, Themas]
  guide: [Leitfaden, Leitfadens, Leitfäden, Ratgeber, Ratgebers, Anleitung, Anleitungen]
  course: [Kurs, Kurses, Kurse, Kursen]
topic: # NO-45; Abschnitt is the interface's word for a section
  word: Thema
  synonyms: [Lektion, Lektionen, Kapitel]
spellings: # NO-52: the spellings that keep ß
  - { wrong: Strasse, right: Straße }
  - { wrong: Strassen, right: Straßen }
  - { wrong: gross, right: groß }
  - { wrong: grosse, right: große }
  - { wrong: grossen, right: großen }
  - { wrong: grosser, right: großer }
  - { wrong: grosses, right: großes }
  - { wrong: grösser, right: größer }
  - { wrong: Grösse, right: Größe }
  - { wrong: heissen, right: heißen }
  - { wrong: heisse, right: heiße }
  - { wrong: heisst, right: heißt }
  - { wrong: heiss, right: heiß }
  - { wrong: weiss, right: weiß }
  - { wrong: Fuss, right: Fuß }
  - { wrong: Fussball, right: Fußball }
  - { wrong: Gruss, right: Gruß }
  - { wrong: Grüsse, right: Grüße }
  - { wrong: süss, right: süß }
