          - { level: A2, wrong: Я бу́ду прочита́ти кни́жку., right: ["Я ", { target: прочита́ю }, " кни́жку."], rule: { uk: ["доконаний вид має просте майбутнє: ", { term: прочита́ю }], en: ["the perfective has a simple future: ", { term: прочита́ю }], es: ["el perfectivo tiene un futuro simple: ", { term: прочита́ю }], pt: ["o perfectivo tem um futuro simples: ", { term: прочита́ю }], fr: ["le perfectif a un futur simple : ", { term: прочита́ю }], de: ["das Perfektiv hat ein einfaches Futur: ", { term: прочита́ю }], it: ["il perfettivo ha un futuro semplice: ", { term: прочита́ю }], pl: ["aspekt dokonany ma prostą formę przyszłą: ", { term: прочита́ю }], tr: ["tamamlanmış görünüşün basit bir gelecek zamanı vardır: ", { term: прочита́ю }], id: ["aspek perfektif punya kala mendatang sederhana: ", { term: прочита́ю }], vi: ["thể hoàn thành có thì tương lai đơn: ", { term: прочита́ю }] } }
          - { level: A2, speakers: [es], wrong: Учо́ра я прочита́в дві годи́ни., right: ["Учо́ра я ", { target: чита́в }, " дві годи́ни."], rule: { es: "la duración lleva el imperfectivo, aunque en español se diga «leí dos horas»: el indefinido no equivale siempre al perfectivo" } }
          - { level: A2, speakers: [en], wrong: Я ча́сто написа́в ма́мі., right: ["Я ча́сто ", { target: писа́в }, " ма́мі."], rule: { en: "a repeated action takes the imperfective, even where English uses the simple past" } }
