          - { level: A2, features: { tense: prs, person: 1, number: sg }, tense: { uk: "Теперішній", en: "Present", es: "Presente", pt: "Presente", fr: "Présent", de: "Gegenwart", it: "Presente", pl: "Czas teraźniejszy", tr: "Şimdiki zaman", id: "Kala kini", vi: "Hiện tại" }, ipfv: "я пишу́" }
          - { level: A2, features: { tense: fut, person: 1, number: sg }, tense: { uk: "Майбутній", en: "Future", es: "Futuro", pt: "Futuro", fr: "Futur", de: "Zukunft", it: "Futuro", pl: "Czas przyszły", tr: "Gelecek zaman", id: "Kala mendatang", vi: "Tương lai" }, ipfv: "я бу́ду писа́ти", pfv: "я напишу́" }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Доконані форми ", { term: напишу́ }, ", ", { term: прочита́ю }, ", ", { term: зроблю́ }, " означають майбутнє, хоч мають закінчення теперішнього часу."]
              en: ["The perfective forms ", { term: напишу́ }, ", ", { term: прочита́ю }, " and ", { term: зроблю́ }, " mean the future, although they carry present endings."]
              es: ["Las formas perfectivas ", { term: напишу́ }, ", ", { term: прочита́ю }, " y ", { term: зроблю́ }, " expresan futuro, aunque llevan terminaciones de presente."]
              pt: ["As formas perfectivas ", { term: напишу́ }, ", ", { term: прочита́ю }, " e ", { term: зроблю́ }, " indicam futuro, embora tenham terminações de presente."]
              fr: ["Les formes perfectives ", { term: напишу́ }, ", ", { term: прочита́ю }, " et ", { term: зроблю́ }, " expriment le futur, bien qu’elles portent des terminaisons du présent."]
