          - type: note
            level: B1
            text:
              uk: ["Обидва види мають минулий час з усіма формами роду й числа: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Див. ", { link: Минулий час, to: uk.past-aspect.past-tense }, "."]
              en: ["Both aspects have a past tense with every gender and number form: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". See ", { link: Past Tense, to: uk.past-aspect.past-tense }, "."]
              es: ["Los dos aspectos tienen pasado con todas las formas de género y número: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Ver ", { link: El pasado, to: uk.past-aspect.past-tense }, "."]
              pt: ["Os dois aspectos têm passado, com todas as formas de gênero e número: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Veja ", { link: "O passado", to: uk.past-aspect.past-tense }, "."]
              fr: ["Les deux aspects ont un passé avec toutes les formes de genre et de nombre : ", { term: хоті́в }, ", ", { term: хоті́ла }, " ; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Voir ", { link: "Le passé", to: uk.past-aspect.past-tense }, "."]
