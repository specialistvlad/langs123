              it: ["Le forme perfettive ", { term: напишу́ }, ", ", { term: прочита́ю }, " e ", { term: зроблю́ }, " indicano il futuro, anche se hanno le desinenze del presente."]
              pl: ["Formy dokonane ", { term: напишу́ }, ", ", { term: прочита́ю }, " i ", { term: зроблю́ }, " oznaczają przyszłość, choć mają końcówki czasu teraźniejszego."]
              tr: [{ term: напишу́ }, ", ", { term: прочита́ю }, " ve ", { term: зроблю́ }, " gibi tamamlanmış görünüş biçimleri, şimdiki zaman ekleri taşısa da geleceği bildirir."]
              id: ["Bentuk perfektif ", { term: напишу́ }, ", ", { term: прочита́ю }, ", dan ", { term: зроблю́ }, " bermakna masa depan, meskipun memakai akhiran kala kini."]
              vi: ["Các dạng thể hoàn thành ", { term: напишу́ }, ", ", { term: прочита́ю }, " và ", { term: зроблю́ }, " chỉ tương lai, dù mang đuôi của thì hiện tại."]
            ex: ["Я ", { target: прочита́ю }, " цю кни́жку за́втра."]
