          tr: { en: "I forgot my keys.", es: "Olvidé las llaves.", pt: "Esqueci as chaves.", fr: "J’ai oublié mes clés.", de: "Ich habe meine Schlüssel vergessen.", it: "Ho dimenticato le chiavi.", pl: "Zapomniałam kluczy.", tr: "Anahtarlarımı unuttum.", id: "Saya lupa membawa kunci.", vi: "Tôi đã quên chìa khóa." }
        - level: A2
          point: { uk: "Недоконаний вид", en: Imperfective, es: Imperfectivo, pt: "Aspecto imperfectivo", fr: "Aspect imperfectif", de: "Imperfektiver Aspekt", it: "Aspetto imperfettivo", pl: "Aspekt niedokonany", tr: "Tamamlanmamış görünüş", id: "Aspek imperfektif", vi: "Thể chưa hoàn thành" }
          rule: { uk: "процес, повторення, загальний факт", en: "a process, a repeated action, a general fact", es: "un proceso, una repetición, un hecho general", pt: "um processo, uma repetição, um fato geral", fr: "un processus, une répétition, un fait général", de: "ein Vorgang, eine Wiederholung, eine allgemeine Tatsache", it: "un processo, una ripetizione, un fatto generale", pl: "proces, powtarzanie, fakt ogólny", tr: "bir süreç, bir tekrar, genel bir olgu", id: "proses, pengulangan, fakta umum", vi: "một quá trình, sự lặp lại, một sự thật chung" }
          ex: ["Я ча́сто ", { target: пишу́ }, " листи́."]
          tr: { en: "I often write letters.", es: "Escribo cartas a menudo.", pt: "Eu escrevo cartas com frequência.", fr: "J’écris souvent des lettres.", de: "Ich schreibe oft Briefe.", it: "Scrivo spesso lettere.", pl: "Często piszę listy.", tr: "Sık sık mektup yazarım.", id: "Saya sering menulis surat.", vi: "Tôi thường viết thư." }
        - level: A2
          point: { uk: "Доконаний вид", en: Perfective, es: Perfectivo, pt: "Aspecto perfectivo", fr: "Aspect perfectif", de: "Perfektiver Aspekt", it: "Aspetto perfettivo", pl: "Aspekt dokonany", tr: "Tamamlanmış görünüş", id: "Aspek perfektif", vi: "Thể hoàn thành" }
          rule: { uk: "один завершений результат", en: "one finished result", es: "un resultado terminado", pt: "um único resultado concluído", fr: "un seul résultat achevé", de: "ein einziges abgeschlossenes Ergebnis", it: "un solo risultato compiuto", pl: "jeden zakończony wynik", tr: "tek bir bitmiş sonuç", id: "satu hasil yang selesai", vi: "một kết quả đã hoàn tất" }
          ex: ["Я ", { target: написа́в }, " лист."]
          tr: { en: "I've written the letter.", es: "Escribí la carta.", pt: "Escrevi a carta.", fr: "J’ai écrit la lettre.", de: "Ich habe den Brief geschrieben.", it: "Ho scritto la lettera.", pl: "Napisałem list.", tr: "Mektubu yazdım.", id: "Saya sudah menulis surat itu.", vi: "Tôi đã viết xong lá thư." }
        - level: A2
          point: { uk: "Майбутній час", en: Future, es: Futuro, pt: "Futuro", fr: "Futur", de: "Zukunft", it: "Futuro", pl: "Czas przyszły", tr: "Gelecek zaman", id: "Kala mendatang", vi: "Tương lai" }
          rule: { uk: ["недоконаний: ", { term: бу́ду писа́ти }, "; доконаний: ", { term: напишу́ }], en: ["imperfective: ", { term: бу́ду писа́ти }, "; perfective: ", { term: напишу́ }], es: ["imperfectivo: ", { term: бу́ду писа́ти }, "; perfectivo: ", { term: напишу́ }], pt: ["imperfectivo: ", { term: бу́ду писа́ти }, "; perfectivo: ", { term: напишу́ }], fr: ["imperfectif : ", { term: бу́ду писа́ти }, " ; perfectif : ", { term: напишу́ }], de: ["imperfektiv: ", { term: бу́ду писа́ти }, "; perfektiv: ", { term: напишу́ }], it: ["imperfettivo: ", { term: бу́ду писа́ти }, "; perfettivo: ", { term: напишу́ }], pl: ["niedokonany: ", { term: бу́ду писа́ти }, "; dokonany: ", { term: напишу́ }], tr: ["tamamlanmamış: ", { term: бу́ду писа́ти }, "; tamamlanmış: ", { term: напишу́ }], id: ["imperfektif: ", { term: бу́ду писа́ти }, "; perfektif: ", { term: напишу́ }], vi: ["chưa hoàn thành: ", { term: бу́ду писа́ти }, "; hoàn thành: ", { term: напишу́ }] }
          ex: ["За́втра я ", { target: напишу́ }, " лист."]
          tr: { en: "I'll write the letter tomorrow.", es: "Mañana escribiré la carta.", pt: "Amanhã vou escrever a carta.", fr: "Demain, j’écrirai la lettre.", de: "Morgen schreibe ich den Brief.", it: "Domani scriverò la lettera.", pl: "Jutro napiszę list.", tr: "Yarın mektubu yazacağım.", id: "Besok saya akan menulis surat itu.", vi: "Ngày mai tôi sẽ viết thư." }
        - level: B1
          point: { uk: "Інший корінь", en: "Another root", es: "Otra raíz", pt: "Outra raiz", fr: "Autre radical", de: "Anderer Wortstamm", it: "Altra radice", pl: "Inny rdzeń", tr: "Başka kök", id: "Akar kata lain", vi: "Căn tố khác" }
          rule: { uk: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], en: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], es: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], pt: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], fr: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], de: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], it: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], pl: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], tr: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], id: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }], vi: [{ mapping: [{ term: бра́ти }, { term: взя́ти }] }, ", ", { mapping: [{ term: говори́ти }, { term: сказа́ти }] }] }
          ex: ["Він ", { target: сказа́в }, " пра́вду."]
          tr: { en: "He told the truth.", es: "Dijo la verdad.", pt: "Ele disse a verdade.", fr: "Il a dit la vérité.", de: "Er hat die Wahrheit gesagt.", it: "Ha detto la verità.", pl: "Powiedział prawdę.", tr: "Gerçeği söyledi.", id: "Dia mengatakan yang sebenarnya.", vi: "Anh ấy đã nói sự thật." }
        - level: B2
