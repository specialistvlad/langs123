          - { level: A2, how: { uk: "префікс", en: "a prefix", es: "un prefijo", pt: "um prefixo", fr: "un préfixe", de: "ein Präfix", it: "un prefisso", pl: "przedrostek", tr: "bir önek", id: "awalan", vi: "một tiền tố" }, ipfv: { alternatives: [діли́ти, ба́чити, диви́тися] }, pfv: { alternatives: [поділи́ти, поба́чити, подиви́тися] } }
          - { level: A2, how: { uk: "суфікс", en: "a suffix", es: "un sufijo", pt: "um sufixo", fr: "un suffixe", de: "ein Suffix", it: "un suffisso", pl: "przyrostek", tr: "bir sonek", id: "akhiran", vi: "một hậu tố" }, ipfv: { alternatives: [забува́ти, вихо́дити, відпочива́ти] }, pfv: { alternatives: [забу́ти, ви́йти, відпочи́ти] } }
          - { level: A2, how: { uk: "суфікс", en: "a suffix", es: "un sufijo", pt: "um sufixo", fr: "un suffixe", de: "ein Suffix", it: "un suffisso", pl: "przyrostek", tr: "bir sonek", id: "akhiran", vi: "một hậu tố" }, ipfv: { alternatives: [купува́ти, дава́ти, вивча́ти] }, pfv: { alternatives: [купи́ти, да́ти, ви́вчити] } }
          - { level: B1, how: { uk: "префікс", en: "a prefix", es: "un prefijo", pt: "um prefixo", fr: "un préfixe", de: "ein Präfix", it: "un prefisso", pl: "przedrostek", tr: "bir önek", id: "awalan", vi: "một tiền tố" }, ipfv: кла́сти, pfv: покла́сти }
          - { level: B1, how: { uk: "інший корінь", en: "another root", es: "otra raíz", pt: "outra raiz", fr: "un autre radical", de: "ein anderer Wortstamm", it: "un'altra radice", pl: "inny rdzeń", tr: "başka bir kök", id: "akar kata lain", vi: "căn tố khác" }, ipfv: { alternatives: [бра́ти, говори́ти] }, pfv: { alternatives: [взя́ти, сказа́ти] } }
