  - title: { uk: "Слова-сигнали", en: "Signal words", es: "Palabras clave", pt: "Palavras indicadoras", fr: "Mots-clés", de: "Signalwörter", it: "Parole spia", pl: "Słowa sygnalne", tr: "Anahtar sözcükler", id: "Kata penanda", vi: "Dấu hiệu nhận biết" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: word, label: { uk: Слово, en: Word, es: Palabra, pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: aspect, label: { uk: Вид, en: Aspect, es: Aspecto, pt: "Aspecto", fr: "Aspect", de: "Aspekt", it: "Aspetto", pl: "Aspekt", tr: "Görünüş", id: "Aspek", vi: "Thể" } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A2
            word: { alternatives: [ча́сто, щодня́, за́вжди, до́вго] }
            aspect: { uk: недоконаний, en: imperfective, es: imperfectivo, pt: "imperfectivo", fr: "imperfectif", de: "imperfektiv", it: "imperfettivo", pl: "niedokonany", tr: "tamamlanmamış", id: "imperfektif", vi: "chưa hoàn thành" }
            ex: [{ signal: Щодня́ }, " я ", { target: готу́ю }, " сніда́нок."]
            tr: { en: "I make breakfast every day.", es: "Preparo el desayuno todos los días.", pt: "Todos os dias eu preparo o café da manhã.", fr: "Tous les jours, je prépare le petit-déjeuner.", de: "Jeden Tag mache ich das Frühstück.", it: "Ogni giorno preparo la colazione.", pl: "Codziennie przygotowuję śniadanie.", tr: "Her gün kahvaltı hazırlarım.", id: "Setiap hari saya menyiapkan sarapan.", vi: "Hằng ngày tôi chuẩn bị bữa sáng." }
          - level: A2
            word: { alternatives: [наре́шті, одра́зу] }
            aspect: { uk: доконаний, en: perfective, es: perfectivo, pt: "perfectivo", fr: "perfectif", de: "perfektiv", it: "perfettivo", pl: "dokonany", tr: "tamamlanmış", id: "perfektif", vi: "hoàn thành" }
            ex: ["Я ", { signal: наре́шті }, " ", { target: знайшла́ }, " ключі́."]
            tr: { en: "I've finally found my keys.", es: "Por fin encontré las llaves.", pt: "Finalmente encontrei as chaves.", fr: "J’ai enfin retrouvé mes clés.", de: "Ich habe endlich meine Schlüssel gefunden.", it: "Ho finalmente trovato le chiavi.", pl: "W końcu znalazłam klucze.", tr: "Sonunda anahtarlarımı buldum.", id: "Akhirnya saya menemukan kunci saya.", vi: "Cuối cùng tôi đã tìm thấy chìa khóa." }
      - type: list
        items:
          - type: note
            level: A2
            text:
              uk: [{ term: уже́ }, " буває з обома видами; у питанні, чи щось уже сталося, — часто з недоконаним:"]
              en: [{ term: уже́ }, " goes with either aspect; asking whether something has happened yet, it often takes the imperfective:"]
              es: [{ term: уже́ }, " va con los dos aspectos; al preguntar si algo ya ha pasado, suele llevar el imperfectivo:"]
              pt: [{ term: уже́ }, " aparece com os dois aspectos; ao perguntar se algo já aconteceu, costuma levar o imperfectivo:"]
              fr: [{ term: уже́ }, " s’emploie avec les deux aspects ; quand on demande si quelque chose s’est déjà produit, il prend souvent l’imperfectif :"]
              de: [{ term: уже́ }, " steht mit beiden Aspekten; in der Frage, ob etwas schon geschehen ist, steht oft das Imperfektiv:"]
              it: [{ term: уже́ }, " si usa con entrambi gli aspetti; quando si chiede se qualcosa è già successo, spesso richiede l'imperfettivo:"]
              pl: [{ term: уже́ }, " występuje z oboma aspektami; w pytaniu, czy coś już się stało, często towarzyszy mu aspekt niedokonany:"]
              tr: [{ term: уже́ }, " her iki görünüşle de kullanılır; bir şeyin olup olmadığı sorulurken çoğunlukla tamamlanmamış görünüş gelir:"]
              id: [{ term: уже́ }, " dipakai dengan kedua aspek; saat menanyakan apakah sesuatu sudah terjadi, biasanya dipakai aspek imperfektif:"]
              vi: [{ term: уже́ }, " đi với cả hai thể; khi hỏi một việc đã xảy ra chưa, thường dùng thể chưa hoàn thành:"]
            ex: ["Ти ", { signal: уже́ }, " ", { target: обі́дав }, "?"]
            tr: { en: "Have you had lunch yet?", es: "¿Ya almorzaste?", pt: "Você já almoçou?", fr: "Tu as déjà déjeuné ?", de: "Hast du schon zu Mittag gegessen?", it: "Hai già pranzato?", pl: "Już jadłeś obiad?", tr: "Öğle yemeği yedin mi?", id: "Kamu sudah makan siang?", vi: "Bạn đã ăn trưa chưa?" }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos, pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
