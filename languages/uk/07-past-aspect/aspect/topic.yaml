          rule:
            uk: { mapping: [{ term: темні́ти }, { term: потемні́ти }] }
          ex: ["Надво́рі шви́дко ", { target: потемні́ло }, "."]
        - level: B2
          point: { uk: "Чергування приголосного" }
          rule:
            uk: [{ mapping: [{ term: захисти́ти }, { term: захища́ти }] }, ": ", { mapping: [{ letter: ст }, { letter: щ }] }]
          ex: ["Ми ", { target: захища́ємо }, " свої́ права́."]
        - level: C1
          point: { uk: "Вторинний недоконаний" }
          rule:
            uk: { mapping: [{ term: заши́ти }, { term: зашива́ти }] }
          ex: ["Ба́бця ча́сто ", { target: зашива́є }, " ді́рки."]
        - level: C1
          point: { uk: Наголос }
          rule:
            uk: { contrast: [{ term: ви́кликати }, { term: виклика́ти }] }
          ex: { examples: [["Ми ", { target: ви́кликали }, " лі́каря."], ["Його́ ча́сто ", { target: виклика́ли }, " до дире́ктора."]] }
        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: "дія зараз — лише недоконаний вид", en: "an action going on now takes the imperfective", es: "una acción en curso solo admite el imperfectivo", pt: "uma ação em curso agora leva o imperfectivo", fr: "une action en cours prend l’imperfectif", de: "eine Handlung, die gerade läuft, steht im Imperfektiv", it: "un'azione in corso richiede l'imperfettivo", pl: "czynność trwająca teraz wymaga aspektu niedokonanego", tr: "şu an süren bir eylem tamamlanmamış görünüş alır", id: "tindakan yang sedang berlangsung memakai aspek imperfektif", vi: "hành động đang diễn ra dùng thể chưa hoàn thành" }
          ex: ["За́раз я ", { target: чита́ю }, " кни́жку."]
          tr: { en: "I'm reading a book right now.", es: "Ahora estoy leyendo un libro.", pt: "Agora estou lendo um livro.", fr: "En ce moment, je lis un livre.", de: "Gerade lese ich ein Buch.", it: "Adesso sto leggendo un libro.", pl: "Teraz czytam książkę.", tr: "Şu an bir kitap okuyorum.", id: "Sekarang saya sedang membaca buku.", vi: "Bây giờ tôi đang đọc sách." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Недоконаний вид називає дію як процес, як повторення або просто як факт."
              en: "The imperfective presents an action as a process, as something repeated, or simply as a fact."
              es: "El imperfectivo presenta la acción como un proceso, como algo que se repite o simplemente como un hecho."
              pt: "O imperfectivo apresenta a ação como um processo, como algo repetido ou simplesmente como um fato."
              fr: "L’imperfectif présente l’action comme un processus, comme une répétition ou simplement comme un fait."
              de: "Das Imperfektiv stellt eine Handlung als Vorgang, als Wiederholung oder einfach als Tatsache dar."
              it: "L'imperfettivo presenta l'azione come un processo, come qualcosa di ripetuto o semplicemente come un fatto."
              pl: "Aspekt niedokonany przedstawia czynność jako proces, jako powtarzanie albo po prostu jako fakt."
              tr: "Tamamlanmamış görünüş eylemi bir süreç, bir tekrar ya da yalnızca bir olgu olarak gösterir."
              id: "Aspek imperfektif menyajikan tindakan sebagai proses, sebagai sesuatu yang berulang, atau sekadar sebagai fakta."
              vi: "Thể chưa hoàn thành trình bày hành động như một quá trình, một việc lặp lại, hoặc đơn giản là một sự việc."
            ex: ["Уве́чері я ", { target: диви́вся }, " фільм."]
            tr: { en: "In the evening I watched a film.", es: "Por la tarde vi una película.", pt: "À noite, assisti a um filme.", fr: "Le soir, j’ai regardé un film.", de: "Am Abend habe ich einen Film angesehen.", it: "La sera ho guardato un film.", pl: "Wieczorem oglądałem film.", tr: "Akşam bir film izledim.", id: "Malam hari saya menonton film.", vi: "Buổi tối tôi xem phim." }
          - type: rule
            level: A2
            text:
              uk: "Доконаний вид називає одну дію, доведену до результату."
              en: "The perfective presents one action carried through to its result."
              es: "El perfectivo presenta una sola acción llevada hasta su resultado."
              pt: "O perfectivo apresenta uma só ação levada até o resultado."
              fr: "Le perfectif présente une seule action menée jusqu’à son résultat."
              de: "Das Perfektiv stellt eine einzelne Handlung dar, die bis zum Ergebnis geführt wird."
              it: "Il perfettivo presenta una sola azione portata fino al risultato."
              pl: "Aspekt dokonany przedstawia jedną czynność doprowadzoną do wyniku."
              tr: "Tamamlanmış görünüş, sonuca ulaşan tek bir eylemi gösterir."
              id: "Aspek perfektif menyajikan satu tindakan yang dibawa sampai hasilnya."
              vi: "Thể hoàn thành trình bày một hành động được làm đến kết quả."
            ex: ["Я ", { target: подиви́вся }, " фільм і пішо́в спа́ти."]
            tr: { en: "I watched the film and went to bed.", es: "Vi la película y me fui a dormir.", pt: "Assisti ao filme e fui dormir.", fr: "J’ai regardé le film et je suis allé me coucher.", de: "Ich habe den Film angesehen und bin schlafen gegangen.", it: "Ho guardato il film e sono andato a dormire.", pl: "Obejrzałem film i poszedłem spać.", tr: "Filmi izledim ve yatmaya gittim.", id: "Saya menonton filmnya lalu pergi tidur.", vi: "Tôi xem xong phim rồi đi ngủ." }
          - type: rule
            level: A2
            text:
              uk: "Недоконаний вид має три часи, доконаний — два: минулий і майбутній."
              en: "The imperfective has three tenses; the perfective has two, the past and the future."
              es: "El imperfectivo tiene tres tiempos; el perfectivo, dos: el pasado y el futuro."
              pt: "O imperfectivo tem três tempos; o perfectivo tem dois: o passado e o futuro."
              fr: "L’imperfectif a trois temps ; le perfectif en a deux, le passé et le futur."
              de: "Das Imperfektiv hat drei Zeitformen, das Perfektiv zwei: Vergangenheit und Zukunft."
              it: "L'imperfettivo ha tre tempi; il perfettivo ne ha due, il passato e il futuro."
              pl: "Aspekt niedokonany ma trzy czasy, a dokonany dwa: przeszły i przyszły."
              tr: "Tamamlanmamış görünüşün üç zamanı vardır; tamamlanmış görünüşün iki zamanı vardır: geçmiş ve gelecek."
              id: "Aspek imperfektif punya tiga kala; aspek perfektif punya dua, yaitu kala lampau dan kala mendatang."
              vi: "Thể chưa hoàn thành có ba thì; thể hoàn thành có hai thì: quá khứ và tương lai."
          - type: note
            level: A2
            text:
              uk: ["Словник подає дієслова парами: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Вивчайте дієслово разом із його парою."]
              en: ["Dictionaries list verbs in pairs: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Learn each verb with its pair."]
              es: ["Los diccionarios dan los verbos en parejas: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Aprenda cada verbo con su pareja."]
              pt: ["Os dicionários dão os verbos em pares: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Cada verbo se aprende junto com o seu par."]
              fr: ["Les dictionnaires donnent les verbes par paires : ", { term: роби́ти }, " — ", { term: зроби́ти }, ". On apprend chaque verbe avec son pendant."]
              de: ["Wörterbücher führen Verben paarweise auf: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Man lernt jedes Verb zusammen mit seinem Partner."]
              it: ["I dizionari riportano i verbi in coppie: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Si impara ogni verbo insieme alla sua coppia."]
              pl: ["Słowniki podają czasowniki parami: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Każdego czasownika uczy się razem z jego parą."]
              tr: ["Sözlükler fiilleri çiftler hâlinde verir: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Her fiil çiftiyle birlikte öğrenilir."]
              id: ["Kamus menuliskan kata kerja berpasangan: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Setiap kata kerja dipelajari bersama pasangannya."]
              vi: ["Từ điển ghi các động từ theo cặp: ", { term: роби́ти }, " — ", { term: зроби́ти }, ". Mỗi động từ nên học cùng với cặp của nó."]

  - title: { uk: "Форма: видові пари", en: "Form: aspect pairs", es: "Forma: parejas de aspecto", pt: "Forma: pares de aspecto", fr: "Forme : paires aspectuelles", de: "Form: Aspektpaare", it: "Forma: coppie aspettuali", pl: "Forma: pary aspektowe", tr: "Biçim: görünüş çiftleri", id: "Bentuk: pasangan aspek", vi: "Dạng: các cặp thể" }
