              pl: ["Oba aspekty mają czas przeszły ze wszystkimi formami rodzaju i liczby: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Zobacz ", { link: "Czas przeszły", to: uk.past-aspect.past-tense }, "."]
              tr: ["İki görünüşün de geçmiş zamanı vardır ve tüm cins ve sayı biçimlerini taşır: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Bkz. ", { link: "Geçmiş zaman", to: uk.past-aspect.past-tense }, "."]
              id: ["Kedua aspek punya kala lampau dengan semua bentuk gender dan jumlah: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Lihat ", { link: "Kala lampau", to: uk.past-aspect.past-tense }, "."]
              vi: ["Cả hai thể đều có thì quá khứ với đủ các dạng giống và số: ", { term: хоті́в }, ", ", { term: хоті́ла }, "; ", { term: поба́чив }, ", ", { term: поба́чила }, ". Xem ", { link: "Thì quá khứ", to: uk.past-aspect.past-tense }, "."]

