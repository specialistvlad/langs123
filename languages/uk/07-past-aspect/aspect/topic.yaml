          rule: { uk: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, en: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, es: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, pt: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, fr: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, de: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, it: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, pl: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, tr: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, id: { mapping: [{ term: забува́ти }, { term: забу́ти }] }, vi: { mapping: [{ term: забува́ти }, { term: забу́ти }] } }
