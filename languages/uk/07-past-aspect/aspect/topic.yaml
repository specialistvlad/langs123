          point: { uk: Префікс, en: Prefix, es: Prefijo, pt: "Prefixo", fr: "Préfixe", de: "Präfix", it: "Prefisso", pl: "Przedrostek", tr: "Önek", id: "Awalan", vi: "Tiền tố" }
          rule: { uk: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, en: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, es: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, pt: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, fr: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, de: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, it: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, pl: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, tr: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, id: { mapping: [{ term: роби́ти }, { term: зроби́ти }] }, vi: { mapping: [{ term: роби́ти }, { term: зроби́ти }] } }
          ex: ["Я вже ", { target: зроби́в }, " завда́ння."]
          tr: { en: "I've already done the task.", es: "Ya hice la tarea.", pt: "Eu já fiz a tarefa.", fr: "J’ai déjà fait l’exercice.", de: "Ich habe die Aufgabe schon gemacht.", it: "Ho già fatto il compito.", pl: "Już zrobiłem zadanie.", tr: "Ödevi çoktan yaptım.", id: "Saya sudah mengerjakan tugas itu.", vi: "Tôi đã làm xong bài tập rồi." }
        - level: A2
