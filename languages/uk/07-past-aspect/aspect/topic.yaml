          - { level: C1, how: { uk: "префікс без значення" }, ipfv: { alternatives: [хвали́ти, ши́ти] }, pfv: { alternatives: [похвали́ти, поши́ти] } }
          - { level: C1, how: { uk: "вторинний недоконаний" }, ipfv: { alternatives: [зашива́ти, перепи́сувати] }, pfv: { alternatives: [заши́ти, переписа́ти] } }
          - { level: C1, how: { uk: "інший корінь" }, ipfv: лови́ти, pfv: спійма́ти }
          - { level: C1, how: { uk: "наголос" }, ipfv: виклика́ти, pfv: ви́кликати }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Префікс робить дієслово доконаним і зазвичай не змінює його значення."
              en: "A prefix makes the verb perfective and usually keeps its meaning."
              es: "Un prefijo vuelve perfectivo el verbo y, por lo general, conserva su significado."
              pt: "Um prefixo torna o verbo perfectivo e, em geral, mantém o seu significado."
              fr: "Un préfixe rend le verbe perfectif et garde en général son sens."
              de: "Ein Präfix macht das Verb perfektiv und lässt die Bedeutung meist unverändert."
              it: "Un prefisso rende il verbo perfettivo e di solito ne conserva il significato."
              pl: "Przedrostek czyni czasownik dokonanym i zwykle zachowuje jego znaczenie."
              tr: "Önek fiili tamamlanmış yapar ve genellikle anlamını korur."
              id: "Awalan membuat kata kerja menjadi perfektif dan biasanya mempertahankan maknanya."
              vi: "Tiền tố làm động từ chuyển sang thể hoàn thành và thường giữ nguyên nghĩa."
            ex: { mapping: [писа́ти, { target: написа́ти }] }
          - type: rule
            level: A2
            text:
              uk: ["У парах із суфіксом довшу форму має недоконаний вид: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              en: ["In pairs built with a suffix, the imperfective is the longer form: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              es: ["En las parejas con sufijo, el imperfectivo es la forma más larga: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              pt: ["Nos pares formados com sufixo, o imperfectivo é a forma mais longa: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              fr: ["Dans les paires formées avec un suffixe, l’imperfectif est la forme la plus longue : ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              de: ["Bei Paaren mit Suffix ist das Imperfektiv die längere Form: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              it: ["Nelle coppie formate con un suffisso, l'imperfettivo è la forma più lunga: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              pl: ["W parach tworzonych przyrostkiem dłuższą formą jest aspekt niedokonany: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              tr: ["Sonekle kurulan çiftlerde uzun biçim tamamlanmamış görünüştedir: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              id: ["Pada pasangan yang dibentuk dengan akhiran, aspek imperfektif adalah bentuk yang lebih panjang: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
              vi: ["Ở các cặp tạo bằng hậu tố, thể chưa hoàn thành là dạng dài hơn: ", { term: відпочива́ти }, " — ", { term: відпочи́ти }, "."]
            ex: ["Влі́тку ми ", { target: відпочива́ли }, " на мо́рі."]
            tr: { en: "In the summer we had a holiday by the sea.", es: "En verano descansamos en el mar.", pt: "No verão, descansamos à beira-mar.", fr: "L’été, nous nous reposions au bord de la mer.", de: "Im Sommer haben wir uns am Meer erholt.", it: "In estate ci riposavamo al mare.", pl: "Latem odpoczywaliśmy nad morzem.", tr: "Yazın denizde dinlendik.", id: "Pada musim panas kami beristirahat di tepi laut.", vi: "Mùa hè chúng tôi nghỉ ngơi ở bên biển." }
          - type: rule
            level: B2
            text:
              uk: ["Дієслова на ", { term: -іти }, " зі значенням «стати якимось» утворюють доконаний вид префіксом ", { term: по- }, ": ", { mapping: [{ term: темні́ти }, { term: потемні́ти }] }, "."]
            ex: ["Надво́рі шви́дко ", { target: потемні́ло }, "."]
          - type: rule
            level: B2
            text:
              uk: ["Перед суфіксом ", { term: -а- }, " приголосний основи чергується: ", { mapping: [{ letter: ст }, { letter: щ }] }, ", ", { mapping: [{ letter: т }, { letter: ч }] }, ":"]
            ex: { examples: [["Ми ", { target: захища́ємо }, " свої́ права́."], ["Вона́ ", { target: зустріча́є }, " дру́зів."]] }
          - type: rule
            level: C1
            text:
              uk: ["Префікс ", { term: по- }, " лише робить дієслово доконаним: ", { mapping: [{ term: хвали́ти }, { term: похвали́ти }] }, ", ", { mapping: [{ term: ши́ти }, { term: поши́ти }] }, "."]
            ex: ["Ма́ма ", { target: похва́лить }, " тебе́."]
          - type: rule
            level: C1
            text:
              uk: ["Префікс, що додає значення, дає нове дієслово; недоконану пару для нього творить суфікс: ", { mapping: [{ term: заши́ти }, { term: зашива́ти }] }, "."]
            ex: ["Ба́бця ча́сто ", { target: зашива́є }, " ді́рки."]
          - type: rule
            level: C1
            text:
              uk: ["У дієсловах з префіксом ", { term: ви- }, " наголос різнить вид: доконаний — на префіксі, недоконаний — на суфіксі:"]
            ex: { examples: [["Ми ", { target: ви́кликали }, " лі́каря."], ["Його́ ча́сто ", { target: виклика́ли }, " до дире́ктора."]] }

  - title: { uk: "Форма: часи обох видів", en: "Form: the tenses of each aspect", es: "Forma: los tiempos de cada aspecto", pt: "Forma: os tempos de cada aspecto", fr: "Forme : les temps de chaque aspect", de: "Form: die Zeitformen beider Aspekte", it: "Forma: i tempi di ciascun aspetto", pl: "Forma: czasy każdego aspektu", tr: "Biçim: her görünüşün zamanları", id: "Bentuk: kala setiap aspek", vi: "Dạng: các thì của mỗi thể" }
