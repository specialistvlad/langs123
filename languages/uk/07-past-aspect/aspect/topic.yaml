title: { uk: "Вид дієслова: доконаний і недоконаний", en: "Aspect: Perfective and Imperfective", es: "El aspecto: perfectivo e imperfectivo", pt: "Aspecto: perfectivo e imperfectivo", fr: "L’aspect : perfectif et imperfectif", de: "Aspekt: perfektiv und imperfektiv", it: "Aspetto: perfettivo e imperfettivo", pl: "Aspekt: dokonany i niedokonany", tr: "Görünüş: tamamlanmış ve tamamlanmamış", id: "Aspek: perfektif dan imperfektif", vi: "Thể của động từ: hoàn thành và chưa hoàn thành" }
summary:
  lead:
    uk: ["Більшість дієслів має пару: недоконаний вид називає процес чи повторення (", { term: писа́ти }, "), доконаний — один завершений результат (", { term: написа́ти }, ")."]
    en: ["Most verbs come in pairs: the imperfective names a process or a repeated action (", { term: писа́ти }, "), the perfective a single finished result (", { term: написа́ти }, ")."]
    es: ["Casi todos los verbos forman pareja: el imperfectivo nombra un proceso o una repetición (", { term: писа́ти }, "); el perfectivo, un resultado terminado (", { term: написа́ти }, ")."]
    pt: ["A maioria dos verbos forma pares: o imperfectivo nomeia um processo ou uma repetição (", { term: писа́ти }, "); o perfectivo, um único resultado concluído (", { term: написа́ти }, ")."]
    fr: ["La plupart des verbes vont par paires : l’imperfectif désigne un processus ou une répétition (", { term: писа́ти }, ") ; le perfectif, un résultat achevé et unique (", { term: написа́ти }, ")."]
    de: ["Die meisten Verben bilden Paare: Das Imperfektiv nennt einen Vorgang oder eine Wiederholung (", { term: писа́ти }, "), das Perfektiv ein abgeschlossenes Ergebnis (", { term: написа́ти }, ")."]
    it: ["La maggior parte dei verbi forma coppie: l'imperfettivo indica un processo o una ripetizione (", { term: писа́ти }, "), il perfettivo un unico risultato compiuto (", { term: написа́ти }, ")."]
    pl: ["Większość czasowników tworzy pary: aspekt niedokonany nazywa proces lub powtarzanie (", { term: писа́ти }, "), a dokonany — jeden zakończony wynik (", { term: написа́ти }, ")."]
    tr: ["Çoğu fiil çift oluşturur: tamamlanmamış görünüş bir süreci ya da tekrarı (", { term: писа́ти }, "), tamamlanmış görünüş ise tek bir bitmiş sonucu (", { term: написа́ти }, ") bildirir."]
    id: ["Kebanyakan kata kerja berpasangan: aspek imperfektif menyatakan proses atau pengulangan (", { term: писа́ти }, "), aspek perfektif satu hasil yang selesai (", { term: написа́ти }, ")."]
    vi: ["Đa số động từ đi thành cặp: thể chưa hoàn thành nêu quá trình hoặc sự lặp lại (", { term: писа́ти }, "), thể hoàn thành nêu kết quả trọn vẹn (", { term: написа́ти }, ")."]
  rule:
    uk: "Доконаний вид не має теперішнього часу: його форми з особовими закінченнями означають майбутнє:"
    en: "The perfective has no present tense: its forms with person endings mean the future:"
    es: "El perfectivo no tiene presente: sus formas con terminación de persona expresan futuro:"
    pt: "O perfectivo não tem presente: suas formas com terminações de pessoa indicam o futuro:"
    fr: "Le perfectif n’a pas de présent : ses formes avec des terminaisons de personne expriment le futur :"
    de: "Das Perfektiv hat kein Präsens: Seine Formen mit Personalendungen bedeuten die Zukunft:"
    it: "Il perfettivo non ha il presente: le sue forme con le desinenze di persona indicano il futuro:"
    pl: "Aspekt dokonany nie ma czasu teraźniejszego: jego formy z końcówkami osobowymi oznaczają przyszłość:"
    tr: "Tamamlanmış görünüşte şimdiki zaman yoktur: kişi ekli biçimleri gelecek anlamı taşır:"
    id: "Aspek perfektif tidak punya kala kini: bentuknya dengan akhiran persona bermakna masa depan:"
    vi: "Thể hoàn thành không có hiện tại: dạng có đuôi chia ngôi chỉ tương lai:"
  ex: { examples: [["Я ", { target: пишу́ }, " лист."], ["Я ", { target: напишу́ }, " лист."]] }

