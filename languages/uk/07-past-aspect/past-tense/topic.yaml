              id: ["Bentuk ini berasal dari infinitif: ", { term: -ти }, " menjadi ", { term: -в }, ", ", { term: -ла }, ", ", { term: -ло }, ", atau ", { term: -ли }, "."]
              vi: ["Dạng này lấy từ động từ nguyên mẫu: ", { term: -ти }, " đổi thành ", { term: -в }, ", ", { term: -ла }, ", ", { term: -ло }, " hoặc ", { term: -ли }, "."]
