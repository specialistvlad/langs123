            tr: { en: "Oksana, have you had lunch?", es: "Oksana, ¿ya almorzaste?", pt: "Oksana, você já almoçou?", fr: "Oksana, tu as déjeuné ?", de: "Oksana, hast du schon zu Mittag gegessen?", it: "Oksana, hai pranzato?", pl: "Oksano, jadłaś obiad?", tr: "Oksana, öğle yemeği yedin mi?", id: "Oksana, apakah kamu sudah makan siang?", vi: "Oksana, bạn đã ăn trưa chưa?" }

