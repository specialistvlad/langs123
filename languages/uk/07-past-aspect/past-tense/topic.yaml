sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Минулий час не має закінчень особи: форму вибирають за родом і числом того, хто діє."
              en: "The past tense has no person endings: the form follows the gender and number of the doer."
              es: "El pasado no tiene terminaciones de persona: la forma depende del género y el número de quien actúa."
              pt: "O passado não tem terminações de pessoa: a forma segue o gênero e o número de quem age."
              fr: "Le passé n’a pas de terminaisons de personne : la forme suit le genre et le nombre de celui qui agit."
              de: "Die Vergangenheit hat keine Personalendungen: Die Form richtet sich nach Genus und Numerus des Handelnden."
              it: "Il passato non ha desinenze di persona: la forma segue il genere e il numero di chi agisce."
              pl: "Czas przeszły nie ma końcówek osobowych: forma zależy od rodzaju i liczby wykonawcy czynności."
              tr: "Geçmiş zamanda kişi eki yoktur: biçim, eylemi yapanın cinsine ve sayısına göre belirlenir."
              id: "Kala lampau tidak punya akhiran persona: bentuknya mengikuti gender dan jumlah pelakunya."
              vi: "Thì quá khứ không có đuôi chia ngôi: dạng của động từ theo giống và số của người thực hiện."
            ex: { examples: [["Він ", { target: чита́в }, "."], ["Вона́ ", { target: чита́ла }, "."], ["Вони́ ", { target: чита́ли }, "."]] }
