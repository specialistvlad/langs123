title: { uk: Минулий час, en: Past Tense, es: El pasado, pt: "O passado", fr: "Le passé", de: "Die Vergangenheit", it: "Il passato", pl: "Czas przeszły", tr: "Geçmiş zaman", id: "Kala lampau", vi: "Thì quá khứ" }
summary:
  lead:
    uk: ["Минулий час змінюється не за особами, а за родом і числом: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    en: ["The past tense changes by gender and number, not by person: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    es: ["El pasado cambia según el género y el número, no según la persona: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    pt: ["O passado muda conforme o gênero e o número, não a pessoa: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    fr: ["Le passé varie selon le genre et le nombre, et non selon la personne : ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    de: ["Die Vergangenheit ändert sich nach Genus und Numerus, nicht nach der Person: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    it: ["Il passato cambia secondo il genere e il numero, non secondo la persona: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    pl: ["Czas przeszły zmienia się według rodzaju i liczby, a nie według osoby: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    tr: ["Geçmiş zaman kişiye göre değil, cins ve sayıya göre değişir: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    id: ["Kala lampau berubah menurut gender dan jumlah, bukan menurut persona: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
    vi: ["Thì quá khứ biến đổi theo giống và số, không theo ngôi: ", { term: чита́в }, ", ", { term: чита́ла }, ", ", { term: чита́ло }, ", ", { term: чита́ли }, "."]
  rule:
    uk: ["Дієслово узгоджується з родом того, хто діє, навіть після ", { term: я }, " і ", { term: ти }, ":"]
    en: ["The verb agrees with the gender of the doer, even after ", { term: я }, " (I) and ", { term: ти }, " (you):"]
    es: ["El verbo concuerda con el género de quien actúa, también después de ", { term: я }, " (yo) y ", { term: ти }, " (tú):"]
    pt: ["O verbo concorda com o gênero de quem age, também depois de ", { term: я }, " (eu) e ", { term: ти }, " (você):"]
    fr: ["Le verbe s’accorde avec le genre de celui qui agit, même après ", { term: я }, " (je) et ", { term: ти }, " (tu) :"]
    de: ["Das Verb richtet sich nach dem Genus des Handelnden, auch nach ", { term: я }, " (ich) und ", { term: ти }, " (du):"]
    it: ["Il verbo concorda con il genere di chi agisce, anche dopo ", { term: я }, " (io) e ", { term: ти }, " (tu):"]
    pl: ["Czasownik zgadza się z rodzajem wykonawcy czynności, także po ", { term: я }, " (ja) i ", { term: ти }, " (ty):"]
    tr: ["Fiil, eylemi yapanın cinsine uyar; bu ", { term: я }, " (ben) ve ", { term: ти }, " (sen) için de geçerlidir:"]
    id: ["Kata kerja sesuai dengan gender pelaku, termasuk setelah ", { term: я }, " (saya) dan ", { term: ти }, " (kamu):"]
    vi: ["Động từ hợp với giống của người thực hiện, kể cả sau ", { term: я }, " (tôi) và ", { term: ти }, " (bạn):"]
  ex: { examples: [["Тара́с: «Я ", { target: чита́в }, "»."], ["Оле́на: «Я ", { target: чита́ла }, "»."]] }

