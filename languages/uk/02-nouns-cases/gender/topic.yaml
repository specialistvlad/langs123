              en: [{ term: він }, ", ", { term: вона́ }, " or ", { term: воно́ }, " replaces a noun of its gender, a thing included:"]
              es: [{ term: він }, ", ", { term: вона́ }, " o ", { term: воно́ }, " sustituye a un sustantivo de su género, también a una cosa:"]
              pt: ["O pronome ", { term: він }, ", ", { term: вона́ }, " ou ", { term: воно́ }, " substitui um substantivo do seu gênero, também o nome de uma coisa:"]
              fr: ["Le pronom ", { term: він }, ", ", { term: вона́ }, " ou ", { term: воно́ }, " remplace un nom de son genre, y compris le nom d’une chose :"]
              de: ["Das Pronomen ", { term: він }, ", ", { term: вона́ }, " oder ", { term: воно́ }, " ersetzt ein Substantiv seines Genus, auch den Namen einer Sache:"]
              it: ["Il pronome ", { term: він }, ", ", { term: вона́ }, " o ", { term: воно́ }, " sostituisce un sostantivo del suo genere, anche il nome di una cosa:"]
              pl: ["Zaimek ", { term: він }, ", ", { term: вона́ }, " lub ", { term: воно́ }, " zastępuje rzeczownik swojego rodzaju, także nazwę rzeczy:"]
              tr: [{ term: він }, ", ", { term: вона́ }, " ya da ", { term: воно́ }, " zamiri, kendi cinsiyetindeki bir ismin yerine geçer, eşya adları da buna dahildir:"]
              id: ["Kata ganti ", { term: він }, ", ", { term: вона́ }, " atau ", { term: воно́ }, " menggantikan kata benda yang segender, termasuk nama benda:"]
              vi: ["Đại từ ", { term: він }, ", ", { term: вона́ }, " hoặc ", { term: воно́ }, " thay cho danh từ cùng giống, kể cả tên đồ vật:"]
            ex: { exchange: ["Де стіл?", [{ target: Він }, " на ку́хні."]] }
            tr: { en: { exchange: ["Where's the table?", "It's in the kitchen."] }, es: { exchange: ["¿Dónde está la mesa?", "Está en la cocina."] }, pt: { exchange: ["Onde está a mesa?", "Está na cozinha."] }, fr: { exchange: ["Où est la table ?", "Dans la cuisine."] }, de: { exchange: ["Wo ist der Tisch?", "Er steht in der Küche."] }, it: { exchange: ["Dov'è il tavolo?", "È in cucina."] }, pl: { exchange: ["Gdzie jest stół?", "Jest w kuchni."] }, tr: { exchange: ["Masa nerede?", "Mutfakta."] }, id: { exchange: ["Di mana mejanya?", "Ada di dapur."] }, vi: { exchange: ["Cái bàn ở đâu?", "Nó ở trong bếp."] } }
          - type: note
            level: A1
            text:
              uk: ["Іменники на ", { term: -ь }, " бувають чоловічого й жіночого роду, а деякі іменники на приголосний — жіночого (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): рід подає словник."]
              en: ["Nouns in ", { term: -ь }, " are masculine or feminine, and a few nouns in a consonant are feminine (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): the dictionary gives the gender."]
              es: ["Los sustantivos en ", { term: -ь }, " son masculinos o femeninos, y algunos en consonante son femeninos (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): el diccionario da el género."]
              pt: ["Os substantivos em ", { term: -ь }, " são masculinos ou femininos, e alguns em consoante são femininos (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): o dicionário informa o gênero."]
              fr: ["Les noms en ", { term: -ь }, " sont masculins ou féminins, et quelques noms en consonne sont féminins (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, ") : le dictionnaire donne le genre."]
              de: ["Substantive auf ", { term: -ь }, " sind maskulin oder feminin, und einige auf Konsonant sind feminin (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): Das Wörterbuch gibt das Genus an."]
              it: ["I sostantivi in ", { term: -ь }, " sono maschili o femminili, e alcuni in consonante sono femminili (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): il dizionario indica il genere."]
              pl: ["Rzeczowniki na ", { term: -ь }, " są rodzaju męskiego lub żeńskiego, a niektóre na spółgłoskę są żeńskie (", { term: ніч }, ", ", { term: річ }, ", ", { term: любо́в }, "): rodzaj podaje słownik."]
