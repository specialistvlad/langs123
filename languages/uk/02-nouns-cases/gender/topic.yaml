title: { uk: Рід іменника, en: Noun Gender, es: El género del sustantivo, pt: "O gênero do substantivo", fr: "Le genre du nom", de: "Das Genus des Substantivs", it: "Il genere del sostantivo", pl: "Rodzaj rzeczownika", tr: "İsimlerde cinsiyet", id: "Gender kata benda", vi: "Giống của danh từ" }
summary:
  lead:
    uk: "Іменник буває чоловічого, жіночого чи середнього роду, і від роду залежить форма слів, що з ним узгоджуються."
    en: "A noun is masculine, feminine or neuter, and its gender sets the form of the words that agree with it."
    es: "Un sustantivo es masculino, femenino o neutro, y su género decide la forma de las palabras que concuerdan con él."
    pt: "O substantivo é masculino, feminino ou neutro, e o gênero determina a forma das palavras que concordam com ele."
    fr: "Un nom est masculin, féminin ou neutre, et son genre détermine la forme des mots qui s’accordent avec lui."
    de: "Ein Substantiv ist Maskulinum, Femininum oder Neutrum, und sein Genus bestimmt die Form der Wörter, die sich ihm angleichen."
    it: "Un sostantivo è maschile, femminile o neutro, e il suo genere determina la forma delle parole che concordano con esso."
    pl: "Rzeczownik jest rodzaju męskiego, żeńskiego lub nijakiego, a jego rodzaj decyduje o formie wyrazów, które się z nim zgadzają."
    tr: "Bir isim eril, dişil ya da nötr olur ve cinsiyeti, onunla uyum sağlayan sözcüklerin biçimini belirler."
    id: "Kata benda bersifat maskulin, feminin, atau netral, dan gendernya menentukan bentuk kata-kata yang menyesuaikan dengannya."
    vi: "Danh từ có giống đực, giống cái hoặc giống trung, và giống quyết định dạng của từ đi kèm."
  rule:
    uk: ["Рід зазвичай видно із закінчення: приголосний — чоловічий, ", { term: -а }, " чи ", { term: -я }, " — жіночий, ", { term: -о }, " чи ", { term: -е }, " — середній:"]
    en: ["The ending usually shows the gender: a consonant for masculine, ", { term: -а }, " or ", { term: -я }, " for feminine, ", { term: -о }, " or ", { term: -е }, " for neuter:"]
    es: ["La terminación suele mostrar el género: consonante en masculino, ", { term: -а }, " o ", { term: -я }, " en femenino, ", { term: -о }, " o ", { term: -е }, " en neutro:"]
    pt: ["O gênero costuma aparecer na terminação: consoante no masculino, ", { term: -а }, " ou ", { term: -я }, " no feminino, ", { term: -о }, " ou ", { term: -е }, " no neutro:"]
    fr: ["La terminaison indique en général le genre : consonne au masculin, ", { term: -а }, " ou ", { term: -я }, " au féminin, ", { term: -о }, " ou ", { term: -е }, " au neutre :"]
    de: ["Die Endung zeigt meist das Genus: Konsonant beim Maskulinum, ", { term: -а }, " oder ", { term: -я }, " beim Femininum, ", { term: -о }, " oder ", { term: -е }, " beim Neutrum:"]
    it: ["La desinenza mostra di solito il genere: consonante maschile, ", { term: -а }, " o ", { term: -я }, " femminile, ", { term: -о }, " o ", { term: -е }, " neutro:"]
    pl: ["Rodzaj zwykle widać po końcówce: spółgłoska to rodzaj męski, ", { term: -а }, " lub ", { term: -я }, " to żeński, ", { term: -о }, " lub ", { term: -е }, " to nijaki:"]
    tr: ["Cinsiyet çoğunlukla sondan anlaşılır: ünsüz erildir, ", { term: -а }, " ya da ", { term: -я }, " dişildir, ", { term: -о }, " ya da ", { term: -е }, " nötrdür:"]
    id: ["Akhiran biasanya menunjukkan gender: konsonan untuk maskulin, ", { term: -а }, " atau ", { term: -я }, " untuk feminin, ", { term: -о }, " atau ", { term: -е }, " untuk netral:"]
    vi: ["Đuôi thường cho biết giống: phụ âm là giống đực, ", { term: -а }, " hoặc ", { term: -я }, " giống cái, ", { term: -о }, " hoặc ", { term: -е }, " giống trung:"]
