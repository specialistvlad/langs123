sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Кожен іменник має рід: чоловічий, жіночий або середній."
              en: "Every noun has a gender: masculine, feminine or neuter."
              es: "Cada sustantivo tiene género: masculino, femenino o neutro."
              pt: "Todo substantivo tem um gênero: masculino, feminino ou neutro."
              fr: "Chaque nom a un genre : masculin, féminin ou neutre."
              de: "Jedes Substantiv hat ein Genus: Maskulinum, Femininum oder Neutrum."
              it: "Ogni sostantivo ha un genere: maschile, femminile o neutro."
              pl: "Każdy rzeczownik ma rodzaj: męski, żeński lub nijaki."
              tr: "Her isim eril, dişil ya da nötr bir cinsiyete sahiptir."
              id: "Setiap kata benda punya gender: maskulin, feminin, atau netral."
              vi: "Mỗi danh từ có một giống: giống đực, giống cái hoặc giống trung."
            ex: { examples: [стіл, кни́жка, мі́сто] }
            tr: { en: { examples: [table, book, city] }, es: { examples: [mesa, libro, ciudad] }, pt: { examples: ["mesa", "livro", "cidade"] }, fr: { examples: ["table", "livre", "ville"] }, de: { examples: ["Tisch", "Buch", "Stadt"] }, it: { examples: ["tavolo", "libro", "città"] }, pl: { examples: ["stół", "książka", "miasto"] }, tr: { examples: ["masa", "kitap", "şehir"] }, id: { examples: ["meja", "buku", "kota"] }, vi: { examples: ["bàn", "sách", "thành phố"] } }
          - type: rule
            level: A1
            text:
              uk: "Рід слова не залежить від його перекладу: треба дивитися на українське закінчення."
              en: "A noun's gender does not follow its translation: look at the Ukrainian ending."
              es: "El género no sigue la traducción: hay que mirar la terminación ucraniana."
              pt: "O gênero da palavra não segue a tradução: é preciso olhar a terminação ucraniana."
              fr: "Le genre d’un nom ne suit pas sa traduction : il faut regarder la terminaison ukrainienne."
              de: "Das Genus eines Substantivs richtet sich nicht nach der Übersetzung: Man muss auf die ukrainische Endung achten."
              it: "Il genere di un sostantivo non segue la traduzione: bisogna guardare la desinenza ucraina."
              pl: "Rodzaj rzeczownika nie zależy od jego tłumaczenia: trzeba patrzeć na ukraińską końcówkę."
              tr: "İsmin cinsiyeti çevirisine bağlı değildir: Ukraynaca sona bakmak gerekir."
              id: "Gender kata benda tidak mengikuti terjemahannya: lihatlah akhiran bahasa Ukraina."
              vi: "Giống của danh từ không theo bản dịch: hãy nhìn đuôi từ tiếng Ukraina."
            ex: ["Мі́сто ", { target: вели́ке }, "."]
            tr: { en: "The city is big.", es: "La ciudad es grande.", pt: "A cidade é grande.", fr: "La ville est grande.", de: "Die Stadt ist groß.", it: "La città è grande.", pl: "Miasto jest duże.", tr: "Şehir büyüktür.", id: "Kotanya besar.", vi: "Thành phố này lớn." }
          - type: rule
            level: A1
            text:
              uk: "Від роду залежать прикметник, присвійний займенник і дієслово в минулому часі:"
              en: "The adjective, the possessive and the past tense of the verb all follow the gender:"
              es: "El adjetivo, el posesivo y el verbo en pasado siguen el género:"
              pt: "O adjetivo, o possessivo e o verbo no passado seguem o gênero:"
              fr: "L’adjectif, le possessif et le verbe au passé suivent le genre :"
              de: "Adjektiv, Possessivpronomen und Verb in der Vergangenheit richten sich nach dem Genus:"
              it: "L'aggettivo, il possessivo e il verbo al passato seguono il genere:"
              pl: "Przymiotnik, zaimek dzierżawczy i czasownik w czasie przeszłym zależą od rodzaju:"
              tr: "Sıfat, iyelik zamiri ve geçmiş zamandaki fiil cinsiyete göre değişir:"
              id: "Kata sifat, kata ganti kepemilikan, dan kata kerja lampau mengikuti gender:"
              vi: "Tính từ, đại từ sở hữu và động từ ở thì quá khứ đều theo giống:"
            ex: { examples: [[{ target: нови́й }, " стіл"], [{ target: нова́ }, " кни́жка"], [{ target: нове́ }, " мі́сто"]] }
            tr: { en: { examples: ["a new table", "a new book", "a new city"] }, es: { examples: ["una mesa nueva", "un libro nuevo", "una ciudad nueva"] }, pt: { examples: ["uma mesa nova", "um livro novo", "uma cidade nova"] }, fr: { examples: ["une nouvelle table", "un nouveau livre", "une nouvelle ville"] }, de: { examples: ["ein neuer Tisch", "ein neues Buch", "eine neue Stadt"] }, it: { examples: ["un tavolo nuovo", "un libro nuovo", "una città nuova"] }, pl: { examples: ["nowy stół", "nowa książka", "nowe miasto"] }, tr: { examples: ["yeni bir masa", "yeni bir kitap", "yeni bir şehir"] }, id: { examples: ["meja baru", "buku baru", "kota baru"] }, vi: { examples: ["một cái bàn mới", "một quyển sách mới", "một thành phố mới"] } }
          - type: note
            level: A1
            text:
              uk: ["Форми прикметників за родом: ", { link: Узгодження прикметників, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              en: ["The forms of adjectives by gender: ", { link: Adjective Agreement, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              es: ["Las formas del adjetivo según el género: ", { link: La concordancia del adjetivo, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              pt: ["As formas do adjetivo segundo o gênero: ", { link: A concordância do adjetivo, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              fr: ["Les formes de l’adjectif selon le genre : ", { link: L’accord de l’adjectif, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              de: ["Die Adjektivformen nach Genus: ", { link: Die Übereinstimmung des Adjektivs, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              it: ["Le forme dell'aggettivo secondo il genere: ", { link: "La concordanza dell'aggettivo", to: uk.adjectives-adverbs.adjective-agreement }, "."]
              pl: ["Formy przymiotnika według rodzaju: ", { link: Uzgodnienie przymiotnika, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              tr: ["Sıfatların cinsiyete göre biçimleri: ", { link: Sıfat uyumu, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              id: ["Bentuk kata sifat menurut gender: ", { link: Kesesuaian kata sifat, to: uk.adjectives-adverbs.adjective-agreement }, "."]
              vi: ["Các dạng của tính từ theo giống: ", { link: Sự hòa hợp của tính từ, to: uk.adjectives-adverbs.adjective-agreement }, "."]

