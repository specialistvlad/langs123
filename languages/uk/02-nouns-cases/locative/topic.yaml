summary:
  lead:
    uk: ["Місцевий відмінок відповідає на питання ", { term: де? }, " і називає місце чи час, завжди з прийменником ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " чи ", { term: о }, "."]
    en: ["The locative answers ", { term: де? }, " (where?) and names a place or a time, always after a preposition: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " or ", { term: о }, "."]
    es: ["El locativo responde a ", { term: де? }, " (¿dónde?) y nombra un lugar o un momento, siempre con preposición: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " u ", { term: о }, "."]
    pt: ["O locativo responde a ", { term: де? }, " (onde?) e nomeia um lugar ou um momento, sempre com preposição: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " ou ", { term: о }, "."]
    fr: ["Le locatif répond à ", { term: де? }, " (où ?) et nomme un lieu ou un moment, toujours après une préposition : ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " ou ", { term: о }, "."]
    de: ["Der Lokativ antwortet auf ", { term: де? }, " (wo?) und nennt einen Ort oder eine Zeit, immer nach einer Präposition: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " oder ", { term: о }, "."]
    it: ["Il locativo risponde a ", { term: де? }, " (dove?) e indica un luogo o un momento, sempre dopo una preposizione: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " o ", { term: о }, "."]
    pl: ["Miejscownik odpowiada na pytanie ", { term: де? }, " (gdzie?) i nazywa miejsce lub czas, zawsze po przyimku: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " lub ", { term: о }, "."]
    tr: ["Bulunma hâli ", { term: де? }, " (nerede?) sorusuna karşılık verir ve bir yeri ya da zamanı bildirir; her zaman bir edatla kullanılır: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " veya ", { term: о }, "."]
    id: ["Lokatif menjawab ", { term: де? }, " (di mana?) dan menyebut tempat atau waktu, selalu setelah kata depan: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " atau ", { term: о }, "."]
    vi: ["Vị trí cách trả lời cho ", { term: де? }, " (ở đâu?) và chỉ nơi chốn hoặc thời gian, luôn đi sau giới từ: ", { term: у }, ", ", { term: в }, ", ", { term: на }, ", ", { term: по }, " hoặc ", { term: о }, "."]
  rule:
    uk: ["Більшість іменників у місцевому має закінчення ", { term: -і }, ":"]
    en: ["Most nouns end in ", { term: -і }, " in the locative:"]
    es: ["La mayoría de los sustantivos terminan en ", { term: -і }, " en locativo:"]
    pt: ["A maioria dos substantivos termina em ", { term: -і }, " no locativo:"]
    fr: ["La plupart des noms se terminent en ", { term: -і }, " au locatif :"]
    de: ["Die meisten Nomen enden im Lokativ auf ", { term: -і }, ":"]
    it: ["La maggior parte dei sostantivi finisce in ", { term: -і }, " al locativo:"]
    pl: ["Większość rzeczowników ma w miejscowniku końcówkę ", { term: -і }, ":"]
    tr: ["İsimlerin çoğu bulunma hâlinde ", { term: -і }, " ile biter:"]
    id: ["Sebagian besar nomina berakhiran ", { term: -і }, " dalam lokatif:"]
    vi: ["Hầu hết danh từ ở vị trí cách có đuôi ", { term: -і }, ":"]
