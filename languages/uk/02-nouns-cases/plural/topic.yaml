  - title: { uk: "Тільки множина", en: "Plural only", es: "Solo plural", pt: "Só no plural", fr: "Seulement au pluriel", de: "Nur im Plural", it: "Solo al plurale", pl: "Tylko liczba mnoga", tr: "Yalnızca çoğul", id: "Hanya jamak", vi: "Chỉ có số nhiều" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Деякі іменники мають тільки множину; слова при них теж стоять у множині:"
              en: "Some nouns exist only in the plural, and the words with them are plural too:"
              es: "Algunos sustantivos solo tienen plural, y las palabras que los acompañan también van en plural:"
              pt: "Alguns substantivos só existem no plural, e as palavras que os acompanham também ficam no plural:"
              fr: "Certains noms n’existent qu’au pluriel, et les mots qui les accompagnent sont eux aussi au pluriel :"
              de: "Manche Nomen gibt es nur im Plural, und die zugehörigen Wörter stehen ebenfalls im Plural:"
              it: "Alcuni sostantivi esistono solo al plurale, e anche le parole che li accompagnano stanno al plurale:"
              pl: "Niektóre rzeczowniki występują tylko w liczbie mnogiej, a związane z nimi wyrazy też stoją w liczbie mnogiej:"
              tr: "Bazı isimler yalnızca çoğul olarak bulunur; onlarla kullanılan sözcükler de çoğuldur:"
              id: "Beberapa nomina hanya ada dalam bentuk jamak, dan kata yang menyertainya juga berbentuk jamak:"
              vi: "Một số danh từ chỉ có số nhiều, và các từ đi kèm cũng ở số nhiều:"
            ex: [{ target: Ці }, " две́рі ", { target: зачи́нені }, "."]
            tr: { en: "This door is closed.", es: "Esta puerta está cerrada.", pt: "Esta porta está fechada.", fr: "Cette porte est fermée.", de: "Diese Tür ist geschlossen.", it: "Questa porta è chiusa.", pl: "Te drzwi są zamknięte.", tr: "Bu kapı kapalı.", id: "Pintu ini tertutup.", vi: "Cánh cửa này đóng." }
          - type: example
            level: B1
            text:
              uk: "Інші іменники тільки з множиною:"
              en: "Other plural-only nouns:"
              es: "Otros sustantivos que solo tienen plural:"
              pt: "Outros substantivos só no plural:"
              fr: "Autres noms seulement au pluriel :"
              de: "Weitere Nomen nur im Plural:"
              it: "Altri sostantivi solo al plurale:"
              pl: "Inne rzeczowniki tylko w liczbie mnogiej:"
              tr: "Yalnızca çoğul olan diğer isimler:"
              id: "Nomina lain yang hanya berbentuk jamak:"
              vi: "Các danh từ khác chỉ có số nhiều:"
