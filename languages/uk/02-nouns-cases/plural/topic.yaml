          - type: note
            level: A2
            text:
              uk: "Наголос розрізняє називний множини й родовий однини:"
              en: "The stress tells the nominative plural from the genitive singular:"
              es: "El acento distingue el nominativo plural del genitivo singular:"
              pt: "O acento tônico distingue o nominativo plural do genitivo singular:"
              fr: "L’accent distingue le nominatif pluriel du génitif singulier :"
              de: "Die Betonung unterscheidet den Nominativ Plural vom Genitiv Singular:"
              it: "L'accento distingue il nominativo plurale dal genitivo singolare:"
              pl: "Akcent odróżnia mianownik liczby mnogiej od dopełniacza liczby pojedynczej:"
              tr: "Vurgu, çoğul yalın hâli tekil tamlayan hâlinden ayırır:"
              id: "Tekanan membedakan nominatif jamak dari genitif tunggal:"
              vi: "Trọng âm phân biệt danh cách số nhiều với sinh cách số ít:"
