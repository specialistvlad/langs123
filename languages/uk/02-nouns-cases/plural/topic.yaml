            level: A1
            text:
              uk: "У множині наголос часто переходить на закінчення:"
              en: "In the plural the stress often moves to the ending:"
              es: "En plural el acento pasa a menudo a la terminación:"
              pt: "No plural, o acento tônico muitas vezes passa para a terminação:"
              fr: "Au pluriel, l’accent passe souvent sur la terminaison :"
              de: "Im Plural wandert die Betonung oft auf die Endung:"
              it: "Al plurale l'accento passa spesso sulla desinenza:"
              pl: "W liczbie mnogiej akcent często przechodzi na końcówkę:"
              tr: "Çoğulda vurgu çoğu zaman ekin üzerine kayar:"
              id: "Dalam bentuk jamak, tekanan sering pindah ke akhiran:"
              vi: "Ở số nhiều, trọng âm thường chuyển sang đuôi:"
