            tr: { en: "We have a new table and a big window.", es: "Tenemos una mesa nueva y una ventana grande.", pt: "Temos uma mesa nova e uma janela grande.", fr: "Nous avons une table neuve et une grande fenêtre.", de: "Wir haben einen neuen Tisch und ein großes Fenster.", it: "Abbiamo un tavolo nuovo e una grande finestra.", pl: "Mamy nowy stół i duże okno.", tr: "Yeni bir masamız ve büyük bir pencerimiz var.", id: "Kami punya meja baru dan jendela besar.", vi: "Chúng tôi có một cái bàn mới và một cửa sổ lớn." }
