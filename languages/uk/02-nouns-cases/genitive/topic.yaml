    it: ["Il genitivo risponde a ", { term: кого́? }, " (di chi?) e ", { term: чого́? }, " (di che cosa?): indica quantità, date e assenza, e segue ", { term: з }, ", ", { term: до }, " e ", { term: для }, "."]
    pl: ["Dopełniacz odpowiada na pytania ", { term: кого́? }, " (kogo?) i ", { term: чого́? }, " (czego?): wyraża ilość, daty i brak oraz stoi po ", { term: з }, ", ", { term: до }, " i ", { term: для }, "."]
    tr: ["Tamlayan hâli ", { term: кого́? }, " (kimin?) ve ", { term: чого́? }, " (neyin?) sorularını yanıtlar, miktarı, tarihi ve yokluğu bildirir, ", { term: з }, ", ", { term: до }, " ve ", { term: для }, " sözcüklerinden sonra gelir."]
