concepts: [cases, possession]
related: [uk.nouns-cases.cases-overview, uk.nouns-cases.declension-alternations, uk.numerals.numbers-with-nouns, uk.foundations.days-months-dates, uk.sentence.u-mene-ye, uk.prepositions.other-prepositions]
