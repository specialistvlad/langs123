    fr: ["Le génitif répond à ", { term: кого́? }, " et ", { term: чого́? }, " (de qui, de quoi) : il indique la quantité, les dates, l’absence, et suit ", { term: з }, ", ", { term: до }, " et ", { term: для }, "."]
