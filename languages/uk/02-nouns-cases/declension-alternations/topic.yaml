title: { uk: Групи відмінювання й чергування, en: Declension Groups and Alternations, es: Grupos de declinación y alternancias, pt: "Grupos de declinação e alternâncias", fr: "Groupes de déclinaison et alternances", de: "Deklinationsgruppen und Lautwechsel", it: "Gruppi di declinazione e alternanze", pl: "Grupy deklinacyjne i oboczności", tr: "Çekim grupları ve ses değişimleri", id: "Kelompok deklinasi dan alternasi", vi: "Nhóm biến cách và sự luân phiên âm" }
summary:
  lead:
    uk: "Іменники відмінюються за трьома групами — твердою, м’якою й мішаною, — а в деяких формах змінюються голосні й приголосні основи."
    en: "Nouns decline in three groups, hard, soft and mixed, and some forms change a vowel or a consonant of the stem."
    es: "Los sustantivos se declinan en tres grupos, duro, blando y mixto, y algunas formas cambian una vocal o una consonante de la raíz."
    pt: "Os substantivos se declinam em três grupos, duro, brando e misto, e algumas formas mudam uma vogal ou uma consoante do radical."
    fr: "Les noms se déclinent en trois groupes, dur, mou et mixte, et certaines formes changent une voyelle ou une consonne du radical."
    de: "Die Substantive werden in drei Gruppen dekliniert, hart, weich und gemischt, und in manchen Formen wechselt ein Vokal oder ein Konsonant des Stammes."
    it: "I sostantivi si declinano in tre gruppi, duro, molle e misto, e in alcune forme cambia una vocale o una consonante del tema."
    pl: "Rzeczowniki odmieniają się w trzech grupach, twardej, miękkiej i mieszanej, a w niektórych formach zmienia się samogłoska lub spółgłoska tematu."
    tr: "İsimler sert, yumuşak ve karışık olmak üzere üç grupta çekimlenir ve bazı biçimlerde gövdenin bir ünlüsü ya da ünsüzü değişir."
    id: "Kata benda dideklinasikan dalam tiga kelompok, keras, lunak, dan campuran, dan pada beberapa bentuk ada vokal atau konsonan batang kata yang berubah."
    vi: "Danh từ biến cách theo ba nhóm là cứng, mềm và hỗn hợp, và ở một số dạng thì một nguyên âm hoặc phụ âm của thân từ thay đổi."
