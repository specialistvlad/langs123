      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Мішана група в одних формах схожа на тверду, в інших — на м’яку:"
              en: "The mixed group follows the hard group in some forms and the soft group in others:"
              es: "El grupo mixto sigue al duro en unas formas y al blando en otras:"
              pt: "O grupo misto segue o duro em algumas formas e o brando em outras:"
              fr: "Le groupe mixte suit le groupe dur à certaines formes et le groupe mou à d’autres :"
              de: "Die gemischte Gruppe folgt in manchen Formen der harten und in anderen der weichen Gruppe:"
              it: "Il gruppo misto segue il duro in alcune forme e il molle in altre:"
              pl: "Grupa mieszana w jednych formach przypomina twardą, w innych miękką:"
              tr: "Karışık grup, bazı biçimlerde sert gruba, bazılarında yumuşak gruba benzer:"
              id: "Kelompok campuran mengikuti kelompok keras pada beberapa bentuk dan kelompok lunak pada bentuk lainnya:"
              vi: "Nhóm hỗn hợp giống nhóm cứng ở một số dạng và giống nhóm mềm ở các dạng khác:"
            ex: { examples: [["чека́ю ", { target: това́риша }], ["гуля́ю з ", { target: това́ришем }]] }
            tr: { en: { examples: ["I'm waiting for my friend", "I'm out walking with my friend"] }, es: { examples: ["espero a mi compañero", "paseo con mi compañero"] }, pt: { examples: ["espero meu amigo", "passeio com meu amigo"] }, fr: { examples: ["j’attends mon camarade", "je me promène avec mon camarade"] }, de: { examples: ["ich warte auf meinen Freund", "ich gehe mit meinem Freund spazieren"] }, it: { examples: ["aspetto il mio amico", "passeggio con il mio amico"] }, pl: { examples: ["czekam na kolegę", "spaceruję z kolegą"] }, tr: { examples: ["arkadaşımı bekliyorum", "arkadaşımla yürüyüş yapıyorum"] }, id: { examples: ["saya menunggu teman saya", "saya jalan-jalan dengan teman saya"] }, vi: { examples: ["tôi đang đợi bạn tôi", "tôi đang đi dạo với bạn tôi"] } }
          - type: note
            level: B1
            text:
              uk: "Шкільна граматика ділить іменники на чотири відміни. I — жіночий і чоловічий рід на -а, -я; II — чоловічий рід на приголосний чи -о і середній рід на -о, -е, -я; III — жіночий рід на приголосний і слово мати; IV — середній рід на -а, -я, що в непрямих відмінках додає суфікс -ат-, -ят- чи -ен-:"
              en: "School grammar sorts nouns into four declensions. I: feminine and masculine nouns in -а, -я; II: masculine nouns in a consonant or -о, and neuter nouns in -о, -е, -я; III: feminine nouns in a consonant, and мати (mother); IV: neuter nouns in -а, -я that add the suffix -ат-, -ят- or -ен- in the other cases:"
              es: "La gramática escolar reparte los sustantivos en cuatro declinaciones. I: femeninos y masculinos en -а, -я; II: masculinos en consonante o en -о, y neutros en -о, -е, -я; III: femeninos en consonante, y мати (madre); IV: neutros en -а, -я que añaden el sufijo -ат-, -ят- o -ен- en los demás casos:"
              pt: "A gramática escolar divide os substantivos em quatro declinações. I: femininos e masculinos em -а, -я; II: masculinos em consoante ou em -о, e neutros em -о, -е, -я; III: femininos em consoante, e мати (mãe); IV: neutros em -а, -я que acrescentam o sufixo -ат-, -ят- ou -ен- nos outros casos:"
              fr: "La grammaire scolaire range les noms en quatre déclinaisons. I : féminins et masculins en -а, -я ; II : masculins en consonne ou en -о, et neutres en -о, -е, -я ; III : féminins en consonne, et мати (mère) ; IV : neutres en -а, -я qui ajoutent le suffixe -ат-, -ят- ou -ен- aux autres cas :"
              de: "Die Schulgrammatik teilt die Substantive in vier Deklinationen ein. I: Feminina und Maskulina auf -а, -я; II: Maskulina auf Konsonant oder -о und Neutra auf -о, -е, -я; III: Feminina auf Konsonant und das Wort мати (Mutter); IV: Neutra auf -а, -я, die in den anderen Kasus das Suffix -ат-, -ят- oder -ен- erhalten:"
              it: "La grammatica scolastica divide i sostantivi in quattro declinazioni. I: femminili e maschili in -а, -я; II: maschili in consonante o in -о e neutri in -о, -е, -я; III: femminili in consonante e мати (madre); IV: neutri in -а, -я che negli altri casi aggiungono il suffisso -ат-, -ят- o -ен-:"
              pl: "Gramatyka szkolna dzieli rzeczowniki na cztery deklinacje. I: rodzaj żeński i męski na -а, -я; II: rodzaj męski na spółgłoskę lub -о oraz nijaki na -о, -е, -я; III: rodzaj żeński na spółgłoskę i wyraz мати (matka); IV: rodzaj nijaki na -а, -я, który w pozostałych przypadkach przyjmuje przyrostek -ат-, -ят- lub -ен-:"
              tr: "Okul dilbilgisi isimleri dört çekim sınıfına ayırır. I: -а, -я ile biten dişil ve eril isimler; II: ünsüzle ya da -о ile biten eril isimler ve -о, -е, -я ile biten nötr isimler; III: ünsüzle biten dişil isimler ve мати (anne) sözcüğü; IV: diğer hâllerde -ат-, -ят- ya da -ен- soneki alan, -а, -я ile biten nötr isimler:"
              id: "Tata bahasa sekolah membagi kata benda menjadi empat deklinasi. I: feminin dan maskulin berakhiran -а, -я; II: maskulin berakhiran konsonan atau -о dan netral berakhiran -о, -е, -я; III: feminin berakhiran konsonan dan kata мати (ibu); IV: netral berakhiran -а, -я yang menambah sufiks -ат-, -ят-, atau -ен- pada kasus lain:"
              vi: "Ngữ pháp nhà trường chia danh từ thành bốn kiểu biến cách. I: giống cái và giống đực có đuôi -а, -я; II: giống đực có đuôi phụ âm hoặc -о, và giống trung có đuôi -о, -е, -я; III: giống cái có đuôi phụ âm, và từ мати (mẹ); IV: giống trung có đuôi -а, -я, thêm hậu tố -ат-, -ят- hoặc -ен- ở các cách còn lại:"
            ex: { examples: [ма́ма, ба́тько, ніч, ім’я́] }
            tr: { en: { examples: [mum, father, night, name] }, es: { examples: [mamá, padre, noche, nombre] }, pt: { examples: ["mamãe", "pai", "noite", "nome"] }, fr: { examples: ["maman", "père", "nuit", "nom"] }, de: { examples: ["Mama", "Vater", "Nacht", "Name"] }, it: { examples: ["mamma", "padre", "notte", "nome"] }, pl: { examples: ["mama", "ojciec", "noc", "imię"] }, tr: { examples: ["anne", "baba", "gece", "ad"] }, id: { examples: ["ibu", "ayah", "malam", "nama"] }, vi: { examples: ["mẹ", "bố", "đêm", "tên"] } }

