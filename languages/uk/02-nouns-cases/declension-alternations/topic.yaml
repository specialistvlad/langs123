id: uk.nouns-cases.declension-alternations
lang: uk
kind: grammar
tags: [cases, declension, nouns, alternations, spelling]
concepts: [declension, cases]
related: [uk.nouns-cases.cases-overview, uk.nouns-cases.genitive, uk.nouns-cases.dative, uk.nouns-cases.instrumental, uk.nouns-cases.locative, uk.nouns-cases.vocative]
