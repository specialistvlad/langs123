          tr: { en: "We'll meet in the square.", es: "Nos vemos en la plaza.", pt: "Vamos nos encontrar na praça.", fr: "On se retrouve sur la place.", de: "Wir treffen uns auf dem Platz.", it: "Ci incontriamo in piazza.", pl: "Spotkamy się na placu.", tr: "Meydanda buluşacağız.", id: "Kita akan bertemu di alun-alun.", vi: "Chúng ta sẽ gặp nhau ở quảng trường." }
        - level: B2
          point: { uk: Чоловічі на -а }
          rule:
            uk: ["відмінюються як жіночі: ", { term: -и }, ", ", { term: -ою }]
          ex: ["Я розмовля́ю з ", { target: Мико́лою }, "."]
        - level: C1
          point: { uk: Шиплячий на кінці }
          rule:
            uk: ["жіночий рід: ", { term: -і }, ", орудний з подвоєнням"]
          ex: ["Пе́ред ", { target: по́дорожжю }, " ми відпочива́ємо."]
        - level: C2
          point: { uk: М’яка група }
          rule:
            uk: [{ mapping: [{ letter: і }, { alternatives: [{ letter: о }, { letter: е }] }] }, " у чоловічому роді"]
          ex: ["Я чека́ю ", { target: го́стя }, "."]
        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: ["після шиплячого — ", { term: -ем }, ", не ", { term: -ом }]
            en: ["after ж, ч, ш, щ: ", { term: -ем }, ", never ", { term: -ом }]
            es: ["tras ж, ч, ш, щ: ", { term: -ем }, ", nunca ", { term: -ом }]
            pt: ["depois de ж, ч, ш, щ: ", { term: -ем }, ", nunca ", { term: -ом }]
            fr: ["après ж, ч, ш, щ : ", { term: -ем }, ", jamais ", { term: -ом }]
            de: ["nach ж, ч, ш, щ: ", { term: -ем }, ", nie ", { term: -ом }]
            it: ["dopo ж, ч, ш, щ: ", { term: -ем }, ", mai ", { term: -ом }]
            pl: ["po ж, ч, ш, щ: ", { term: -ем }, ", nigdy ", { term: -ом }]
            tr: ["ж, ч, ш, щ harflerinden sonra: ", { term: -ем }, ", asla ", { term: -ом }]
            id: ["setelah ж, ч, ш, щ: ", { term: -ем }, ", bukan ", { term: -ом }]
            vi: ["sau ж, ч, ш, щ: ", { term: -ем }, ", không bao giờ ", { term: -ом }]
          ex: ["Я говори́в з ", { target: викладаче́м }, "."]
          tr: { en: "I spoke to the lecturer.", es: "Hablé con el profesor.", pt: "Eu falei com o professor.", fr: "J’ai parlé avec le professeur.", de: "Ich habe mit dem Dozenten gesprochen.", it: "Ho parlato con il docente.", pl: "Rozmawiałem z wykładowcą.", tr: "Öğretim görevlisiyle konuştum.", id: "Saya berbicara dengan dosen.", vi: "Tôi đã nói chuyện với giảng viên." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "За останнім приголосним основи іменники належать до твердої, м’якої чи мішаної групи:"
              en: "The last consonant of the stem puts a noun in the hard, the soft or the mixed group:"
              es: "La última consonante de la raíz pone el sustantivo en el grupo duro, blando o mixto:"
              pt: "A última consoante do radical coloca o substantivo no grupo duro, brando ou misto:"
              fr: "La dernière consonne du radical place le nom dans le groupe dur, mou ou mixte :"
              de: "Der letzte Konsonant des Stammes bestimmt, ob ein Substantiv zur harten, weichen oder gemischten Gruppe gehört:"
              it: "L'ultima consonante del tema colloca il sostantivo nel gruppo duro, molle o misto:"
              pl: "Ostatnia spółgłoska tematu przypisuje rzeczownik do grupy twardej, miękkiej lub mieszanej:"
              tr: "Gövdenin son ünsüzü, ismi sert, yumuşak ya da karışık gruba yerleştirir:"
              id: "Konsonan terakhir pada batang kata menentukan apakah kata benda masuk kelompok keras, lunak, atau campuran:"
              vi: "Phụ âm cuối của thân từ xếp danh từ vào nhóm cứng, mềm hoặc hỗn hợp:"
            ex: { examples: [{ target: брат }, { target: учи́тель }, { target: това́риш }] }
            tr: { en: { examples: [brother, teacher, friend] }, es: { examples: [hermano, profesor, compañero] }, pt: { examples: ["irmão", "professor", "amigo"] }, fr: { examples: ["frère", "enseignant", "camarade"] }, de: { examples: ["Bruder", "Lehrer", "Freund"] }, it: { examples: ["fratello", "insegnante", "amico"] }, pl: { examples: ["brat", "nauczyciel", "kolega"] }, tr: { examples: ["erkek kardeş", "öğretmen", "arkadaş"] }, id: { examples: ["saudara laki-laki", "guru", "teman"] }, vi: { examples: ["anh trai", "thầy giáo", "bạn"] } }

  - title: { uk: "Групи відмінювання", en: "Declension groups", es: "Grupos de declinación", pt: "Grupos de declinação", fr: "Groupes de déclinaison", de: "Deklinationsgruppen", it: "Gruppi di declinazione", pl: "Grupy deklinacyjne", tr: "Çekim grupları", id: "Kelompok deklinasi", vi: "Nhóm biến cách" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: group, label: { uk: Група, en: Group, es: Grupo, pt: "Grupo", fr: "Groupe", de: "Gruppe", it: "Gruppo", pl: "Grupa", tr: "Grup", id: "Kelompok", vi: "Nhóm" } }
          - { key: nom, label: { uk: Називний, en: Nominative, es: Nominativo, pt: "Nominativo", fr: "Nominatif", de: "Nominativ", it: "Nominativo", pl: "Mianownik", tr: "Yalın hâl", id: "Nominatif", vi: "Danh cách" }, features: { case: nom } }
          - { key: gen, label: { uk: Родовий, en: Genitive, es: Genitivo, pt: "Genitivo", fr: "Génitif", de: "Genitiv", it: "Genitivo", pl: "Dopełniacz", tr: "Tamlayan hâli", id: "Genitif", vi: "Sinh cách" }, features: { case: gen } }
          - { key: ins, label: { uk: Орудний, en: Instrumental, es: Instrumental, pt: "Instrumental", fr: "Instrumental", de: "Instrumental", it: "Strumentale", pl: "Narzędnik", tr: "Araç hâli", id: "Instrumental", vi: "Công cụ cách" }, features: { case: ins } }
        rows:
          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, тверда", en: "Masculine, hard", es: "Masculino, duro", pt: "Masculino, duro", fr: "Masculin, dur", de: "Maskulinum, hart", it: "Maschile, duro", pl: "Rodzaj męski, twarda", tr: "Eril, sert", id: "Maskulin, keras", vi: "Giống đực, cứng" }, nom: брат, gen: ["бра́т", { ending: а }], ins: ["бра́т", { ending: ом }] }
          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, м’яка", en: "Masculine, soft", es: "Masculino, blando", pt: "Masculino, brando", fr: "Masculin, mou", de: "Maskulinum, weich", it: "Maschile, molle", pl: "Rodzaj męski, miękka", tr: "Eril, yumuşak", id: "Maskulin, lunak", vi: "Giống đực, mềm" }, nom: учи́тель, gen: ["учи́тел", { ending: я }], ins: ["учи́тел", { ending: ем }] }
          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, мішана", en: "Masculine, mixed", es: "Masculino, mixto", pt: "Masculino, misto", fr: "Masculin, mixte", de: "Maskulinum, gemischt", it: "Maschile, misto", pl: "Rodzaj męski, mieszana", tr: "Eril, karışık", id: "Maskulin, campuran", vi: "Giống đực, hỗn hợp" }, nom: това́риш, gen: ["това́риш", { ending: а }], ins: ["това́риш", { ending: ем }] }
          - { level: A2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід, тверда", en: "Feminine, hard", es: "Femenino, duro", pt: "Feminino, duro", fr: "Féminin, dur", de: "Femininum, hart", it: "Femminile, duro", pl: "Rodzaj żeński, twarda", tr: "Dişil, sert", id: "Feminin, keras", vi: "Giống cái, cứng" }, nom: ма́ма, gen: ["ма́м", { ending: и }], ins: ["ма́м", { ending: ою }] }
          - { level: A2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід, м’яка", en: "Feminine, soft", es: "Femenino, blando", pt: "Feminino, brando", fr: "Féminin, mou", de: "Femininum, weich", it: "Femminile, molle", pl: "Rodzaj żeński, miękka", tr: "Dişil, yumuşak", id: "Feminin, lunak", vi: "Giống cái, mềm" }, nom: бабу́ся, gen: ["бабу́с", { ending: і }], ins: ["бабу́с", { ending: ею }] }
          - { level: B1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід, мішана", en: "Feminine, mixed", es: "Femenino, mixto", pt: "Feminino, misto", fr: "Féminin, mixte", de: "Femininum, gemischt", it: "Femminile, misto", pl: "Rodzaj żeński, mieszana", tr: "Dişil, karışık", id: "Feminin, campuran", vi: "Giống cái, hỗn hợp" }, nom: пло́ща, gen: ["пло́щ", { ending: і }], ins: ["пло́щ", { ending: ею }] }
          - { level: A2, features: { gender: neut, number: sg }, group: { uk: "Середній рід, тверда", en: "Neuter, hard", es: "Neutro, duro", pt: "Neutro, duro", fr: "Neutre, dur", de: "Neutrum, hart", it: "Neutro, duro", pl: "Rodzaj nijaki, twarda", tr: "Nötr, sert", id: "Netral, keras", vi: "Giống trung, cứng" }, nom: мі́сто, gen: ["мі́ст", { ending: а }], ins: ["мі́ст", { ending: ом }] }
          - { level: A2, features: { gender: neut, number: sg }, group: { uk: "Середній рід, м’яка", en: "Neuter, soft", es: "Neutro, blando", pt: "Neutro, brando", fr: "Neutre, mou", de: "Neutrum, weich", it: "Neutro, molle", pl: "Rodzaj nijaki, miękka", tr: "Nötr, yumuşak", id: "Netral, lunak", vi: "Giống trung, mềm" }, nom: мо́ре, gen: ["мо́р", { ending: я }], ins: ["мо́р", { ending: ем }] }
          - { level: B1, features: { gender: neut, number: sg }, group: { uk: "Середній рід, мішана", en: "Neuter, mixed", es: "Neutro, mixto", pt: "Neutro, misto", fr: "Neutre, mixte", de: "Neutrum, gemischt", it: "Neutro, misto", pl: "Rodzaj nijaki, mieszana", tr: "Nötr, karışık", id: "Netral, campuran", vi: "Giống trung, hỗn hợp" }, nom: прі́звище, gen: ["прі́звищ", { ending: а }], ins: ["прі́звищ", { ending: ем }] }
          - { level: B1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -о", en: "Masculine in -о", es: "Masculino en -о", pt: "Masculino em -о", fr: "Masculin en -о", de: "Maskulinum auf -о", it: "Maschile in -о", pl: "Rodzaj męski na -о", tr: "Eril, -о ile biten", id: "Maskulin berakhiran -о", vi: "Giống đực đuôi -о" }, nom: ба́тько, gen: ["ба́тьк", { ending: а }], ins: ["ба́тьк", { ending: ом }] }
          - { level: B1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -ин", en: "Masculine in -ин", es: "Masculino en -ин", pt: "Masculino em -ин", fr: "Masculin en -ин", de: "Maskulinum auf -ин", it: "Maschile in -ин", pl: "Rodzaj męski na -ин", tr: "Eril, -ин ile biten", id: "Maskulin berakhiran -ин", vi: "Giống đực đuôi -ин" }, nom: кия́нин, gen: ["кия́нин", { ending: а }], ins: ["кия́нин", { ending: ом }] }
          - { level: B1, features: { gender: neut, number: sg }, group: { uk: "Середній рід із суфіксом -ен-", en: "Neuter with the suffix -ен-", es: "Neutro con el sufijo -ен-", pt: "Neutro com o sufixo -ен-", fr: "Neutre avec le suffixe -ен-", de: "Neutrum mit dem Suffix -ен-", it: "Neutro con il suffisso -ен-", pl: "Rodzaj nijaki z przyrostkiem -ен-", tr: "Nötr, -ен- soneki ile", id: "Netral dengan sufiks -ен-", vi: "Giống trung có hậu tố -ен-" }, nom: ім’я́, gen: ["і́мен", { ending: і }], ins: ["і́мен", { ending: ем }] }
          - { level: B2, features: { gender: neut, number: sg }, group: { uk: "Середній рід із суфіксом -ат-, -ят-" }, nom: { alternatives: [курча́, немовля́] }, gen: { alternatives: [["курча́т", { ending: и }], ["немовля́т", { ending: и }]] }, ins: { alternatives: [["курча́", { ending: м }], ["немовля́", { ending: м }]] } }
          - { level: B2, features: { gender: neut, number: sg }, group: { uk: "Середній рід із суфіксом -ен-, наголос на корені" }, nom: { alternatives: [пле́м’я, ви́м’я] }, gen: { alternatives: [["пле́мен", { ending: і }], ["ви́мен", { ending: і }]] }, ins: { alternatives: [["пле́мен", { ending: ем }], ["ви́мен", { ending: ем }]] } }
          - { level: B2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід, м’яка група без закінчення" }, nom: { alternatives: [сіль, мазь, При́п’ять] }, gen: { alternatives: [["со́л", { ending: і }], ["ма́з", { ending: і }], ["При́п’ят", { ending: і }]] }, ins: { alternatives: [["сі́л", { ending: лю }], ["ма́з", { ending: зю }], ["При́п’ят", { ending: тю }]] } }
          - { level: B2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід: мати" }, nom: { alternatives: [ма́ти, ма́тір] }, gen: ["ма́тер", { ending: і }], ins: ["ма́тір’", { ending: ю }] }
          - { level: C1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на шиплячий без закінчення" }, nom: { alternatives: [ві́дсіч, по́дорож, Січ] }, gen: { alternatives: [["ві́дсіч", { ending: і }], ["по́дорож", { ending: і }], ["Сі́ч", { ending: і }]] }, ins: { alternatives: [["ві́дсіч", { ending: чю }], ["по́дорож", { ending: жю }], ["Сі́ч", { ending: чю }]] } }
          - { level: C1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід: любов" }, nom: любо́в, gen: ["любо́в", { ending: і }], ins: ["любо́в’", { ending: ю }] }
          - { level: C1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -ь, голосний і змінюється на е" }, nom: ко́рінь, gen: ["ко́р", { letter: е }, "н", { ending: я }], ins: ["ко́р", { letter: е }, "н", { ending: ем }] }
          - { level: C1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -ь, -й: речі й міста" }, nom: { alternatives: [туне́ль, урожа́й, шампу́нь, Ко́вель] }, gen: { alternatives: [["туне́л", { ending: ю }], ["урожа́", { ending: ю }], ["шампу́н", { ending: ю }], ["Ко́вел", { ending: я }]] }, ins: { alternatives: [["туне́л", { ending: ем }], ["урожа́", { ending: єм }], ["шампу́н", { ending: ем }], ["Ко́вел", { ending: ем }]] } }
          - { level: C2, features: { gender: neut, number: sg }, group: { uk: "Середній рід, малята тварин" }, nom: { alternatives: [гусеня́, собача́] }, gen: { alternatives: [["гусеня́т", { ending: и }], ["собача́т", { ending: и }]] }, ins: { alternatives: [["гусеня́", { ending: м }], ["собача́", { ending: м }]] } }
          - { level: C2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -ь, голосний і змінюється на о, е" }, nom: { alternatives: [гість, сту́пінь] }, gen: { alternatives: [["г", { letter: о́ }, "ст", { ending: я }], ["сту́п", { letter: е }, "н", { ending: я }]] }, ins: { alternatives: [["г", { letter: о́ }, "ст", { ending: ем }], ["сту́п", { letter: е }, "н", { ending: ем }]] } }
          - { level: C2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -й, родовий на -я" }, nom: { alternatives: [ковбо́й, кий] }, gen: { alternatives: [["ковбо́", { ending: я }], ["ки́", { ending: я }]] }, ins: { alternatives: [["ковбо́", { ending: єм }], ["ки́", { ending: єм }]] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Мішана група в одних формах схожа на тверду, в інших — на м’яку:"
              en: "The mixed group follows the hard group in some forms and the soft group in others:"
              es: "El grupo mixto sigue al duro en unas formas y al blando en otras:"
              pt: "O grupo misto segue o duro em algumas formas e o brando em outras:"
              fr: "Le groupe mixte suit le groupe dur à certaines formes et le groupe mou à d’autres :"
              de: "Die gemischte Gruppe folgt in manchen Formen der harten und in anderen der weichen Gruppe:"
              it: "Il gruppo misto segue il duro in alcune forme e il molle in altre:"
              pl: "Grupa mieszana w jednych formach przypomina twardą, w innych miękką:"
              tr: "Karışık grup, bazı biçimlerde sert gruba, bazılarında yumuşak gruba benzer:"
              id: "Kelompok campuran mengikuti kelompok keras pada beberapa bentuk dan kelompok lunak pada bentuk lainnya:"
              vi: "Nhóm hỗn hợp giống nhóm cứng ở một số dạng và giống nhóm mềm ở các dạng khác:"
            ex: { examples: [["чека́ю ", { target: това́риша }], ["гуля́ю з ", { target: това́ришем }]] }
            tr: { en: { examples: ["I'm waiting for my friend", "I'm out walking with my friend"] }, es: { examples: ["espero a mi compañero", "paseo con mi compañero"] }, pt: { examples: ["espero meu amigo", "passeio com meu amigo"] }, fr: { examples: ["j’attends mon camarade", "je me promène avec mon camarade"] }, de: { examples: ["ich warte auf meinen Freund", "ich gehe mit meinem Freund spazieren"] }, it: { examples: ["aspetto il mio amico", "passeggio con il mio amico"] }, pl: { examples: ["czekam na kolegę", "spaceruję z kolegą"] }, tr: { examples: ["arkadaşımı bekliyorum", "arkadaşımla yürüyüş yapıyorum"] }, id: { examples: ["saya menunggu teman saya", "saya jalan-jalan dengan teman saya"] }, vi: { examples: ["tôi đang đợi bạn tôi", "tôi đang đi dạo với bạn tôi"] } }
          - type: note
            level: B1
            text:
              uk: "Шкільна граматика ділить іменники на чотири відміни. I — жіночий і чоловічий рід на -а, -я; II — чоловічий рід на приголосний чи -о і середній рід на -о, -е, -я; III — жіночий рід на приголосний і слово мати; IV — середній рід на -а, -я, що в непрямих відмінках додає суфікс -ат-, -ят- чи -ен-:"
              en: "School grammar sorts nouns into four declensions. I: feminine and masculine nouns in -а, -я; II: masculine nouns in a consonant or -о, and neuter nouns in -о, -е, -я; III: feminine nouns in a consonant, and мати (mother); IV: neuter nouns in -а, -я that add the suffix -ат-, -ят- or -ен- in the other cases:"
              es: "La gramática escolar reparte los sustantivos en cuatro declinaciones. I: femeninos y masculinos en -а, -я; II: masculinos en consonante o en -о, y neutros en -о, -е, -я; III: femeninos en consonante, y мати (madre); IV: neutros en -а, -я que añaden el sufijo -ат-, -ят- o -ен- en los demás casos:"
              pt: "A gramática escolar divide os substantivos em quatro declinações. I: femininos e masculinos em -а, -я; II: masculinos em consoante ou em -о, e neutros em -о, -е, -я; III: femininos em consoante, e мати (mãe); IV: neutros em -а, -я que acrescentam o sufixo -ат-, -ят- ou -ен- nos outros casos:"
              fr: "La grammaire scolaire range les noms en quatre déclinaisons. I : féminins et masculins en -а, -я ; II : masculins en consonne ou en -о, et neutres en -о, -е, -я ; III : féminins en consonne, et мати (mère) ; IV : neutres en -а, -я qui ajoutent le suffixe -ат-, -ят- ou -ен- aux autres cas :"
              de: "Die Schulgrammatik teilt die Substantive in vier Deklinationen ein. I: Feminina und Maskulina auf -а, -я; II: Maskulina auf Konsonant oder -о und Neutra auf -о, -е, -я; III: Feminina auf Konsonant und das Wort мати (Mutter); IV: Neutra auf -а, -я, die in den anderen Kasus das Suffix -ат-, -ят- oder -ен- erhalten:"
              it: "La grammatica scolastica divide i sostantivi in quattro declinazioni. I: femminili e maschili in -а, -я; II: maschili in consonante o in -о e neutri in -о, -е, -я; III: femminili in consonante e мати (madre); IV: neutri in -а, -я che negli altri casi aggiungono il suffisso -ат-, -ят- o -ен-:"
              pl: "Gramatyka szkolna dzieli rzeczowniki na cztery deklinacje. I: rodzaj żeński i męski na -а, -я; II: rodzaj męski na spółgłoskę lub -о oraz nijaki na -о, -е, -я; III: rodzaj żeński na spółgłoskę i wyraz мати (matka); IV: rodzaj nijaki na -а, -я, który w pozostałych przypadkach przyjmuje przyrostek -ат-, -ят- lub -ен-:"
              tr: "Okul dilbilgisi isimleri dört çekim sınıfına ayırır. I: -а, -я ile biten dişil ve eril isimler; II: ünsüzle ya da -о ile biten eril isimler ve -о, -е, -я ile biten nötr isimler; III: ünsüzle biten dişil isimler ve мати (anne) sözcüğü; IV: diğer hâllerde -ат-, -ят- ya da -ен- soneki alan, -а, -я ile biten nötr isimler:"
              id: "Tata bahasa sekolah membagi kata benda menjadi empat deklinasi. I: feminin dan maskulin berakhiran -а, -я; II: maskulin berakhiran konsonan atau -о dan netral berakhiran -о, -е, -я; III: feminin berakhiran konsonan dan kata мати (ibu); IV: netral berakhiran -а, -я yang menambah sufiks -ат-, -ят-, atau -ен- pada kasus lain:"
              vi: "Ngữ pháp nhà trường chia danh từ thành bốn kiểu biến cách. I: giống cái và giống đực có đuôi -а, -я; II: giống đực có đuôi phụ âm hoặc -о, và giống trung có đuôi -о, -е, -я; III: giống cái có đuôi phụ âm, và từ мати (mẹ); IV: giống trung có đuôi -а, -я, thêm hậu tố -ат-, -ят- hoặc -ен- ở các cách còn lại:"
            ex: { examples: [ма́ма, ба́тько, ніч, ім’я́] }
            tr: { en: { examples: [mum, father, night, name] }, es: { examples: [mamá, padre, noche, nombre] }, pt: { examples: ["mamãe", "pai", "noite", "nome"] }, fr: { examples: ["maman", "père", "nuit", "nom"] }, de: { examples: ["Mama", "Vater", "Nacht", "Name"] }, it: { examples: ["mamma", "padre", "notte", "nome"] }, pl: { examples: ["mama", "ojciec", "noc", "imię"] }, tr: { examples: ["anne", "baba", "gece", "ad"] }, id: { examples: ["ibu", "ayah", "malam", "nama"] }, vi: { examples: ["mẹ", "bố", "đêm", "tên"] } }

  - title: { uk: "Особливі типи іменників" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: group, label: { uk: Тип } }
          - { key: nom, label: { uk: Називний }, features: { case: nom } }
          - { key: gen, label: { uk: Родовий }, features: { case: gen } }
          - { key: ins, label: { uk: Орудний }, features: { case: ins } }
        rows:
          - { level: B2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -а, -я" }, nom: { alternatives: [воєво́да, Мико́ла] }, gen: { alternatives: [["воєво́д", { ending: и }], ["Мико́л", { ending: и }]] }, ins: { alternatives: [["воєво́д", { ending: ою }], ["Мико́л", { ending: ою }]] } }
          - { level: B2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -о, м’яка основа" }, nom: { alternatives: [діду́ньо, тату́ньо] }, gen: { alternatives: [["діду́н", { ending: я }], ["тату́н", { ending: я }]] }, ins: { alternatives: [["діду́н", { ending: ем }], ["тату́н", { ending: ем }]] } }
          - { level: B2, features: { gender: masc, number: sg }, group: { uk: "Чоловічі прізвища на -о" }, nom: { alternatives: [Франко́, Петре́нко] }, gen: { alternatives: [["Франк", { ending: а́ }], ["Петре́нк", { ending: а }]] }, ins: { alternatives: [["Франк", { ending: о́м }], ["Петре́нк", { ending: ом }]] } }
          - { level: B2, features: { gender: fem, number: sg }, group: { uk: "Жіночі прізвища на -о" }, nom: Петре́нко, gen: { target: Петре́нко }, ins: { target: Петре́нко } }
          - { level: B2, features: { gender: masc, animacy: inan, number: sg }, group: { uk: "Назва ріки на -о" }, nom: Дніпро́, gen: ["Дніпр", { ending: а́ }], ins: ["Дніпр", { ending: о́м }] }
          - { level: B2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід із прикметника" }, nom: { alternatives: [на́бережна, нарече́на, Занькове́цька] }, gen: { alternatives: [["на́бережн", { ending: ої }], ["нарече́н", { ending: ої }], ["Занькове́цьк", { ending: ої }]] }, ins: { alternatives: [["на́бережн", { ending: ою }], ["нарече́н", { ending: ою }], ["Занькове́цьк", { ending: ою }]] } }
          - { level: B2, features: { gender: neut, number: sg }, group: { uk: "Середній рід із прикметника" }, nom: { alternatives: [мину́ле, майбу́тнє, Рі́вне] }, gen: { alternatives: [["мину́л", { ending: ого }], ["майбу́тн", { ending: ього }], ["Рі́вн", { ending: ого }]] }, ins: { alternatives: [["мину́л", { ending: им }], ["майбу́тн", { ending: ім }], ["Рі́вн", { ending: им }]] } }
          - { level: C1, features: { gender: [fem, masc], number: sg }, group: { uk: "Ім’я та по батькові" }, nom: { alternatives: [Катери́на Петрі́вна, Іва́н Петро́вич] }, gen: { alternatives: [["Катери́н", { ending: и }, " Петрі́вн", { ending: и }], ["Іва́н", { ending: а }, " Петро́вич", { ending: а }]] }, ins: { alternatives: [["Катери́н", { ending: ою }, " Петрі́вн", { ending: ою }], ["Іва́н", { ending: ом }, " Петро́вич", { ending: ем }]] } }
          - { level: C2, features: { gender: neut, number: sg }, group: { uk: "Середній рід на -’я, -лля" }, nom: { alternatives: [ве́рб’я, Причорномо́р’я, Опі́лля] }, gen: { target: { alternatives: [ве́рб’я, Причорномо́р’я, Опі́лля] } }, ins: { alternatives: [["ве́рб’", { ending: ям }], ["Причорномо́р’", { ending: ям }], ["Опі́лл", { ending: ям }]] } }
          - { level: C2, features: { gender: fem, number: sg }, group: { uk: "Пестливі жіночі імена й слова" }, nom: { alternatives: [О́ля, Дану́ся, бабу́ня] }, gen: { alternatives: [["О́л", { ending: і }], ["Дану́с", { ending: і }], ["бабу́н", { ending: і }]] }, ins: { alternatives: [["О́л", { ending: ею }], ["Дану́с", { ending: ею }], ["бабу́н", { ending: ею }]] } }
          - { level: C2, features: { gender: masc, number: sg }, group: { uk: "Пестливі чоловічі імена" }, nom: Миха́сь, gen: ["Миха́с", { ending: я }], ins: ["Миха́с", { ending: ем }] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              uk: ["Чоловічі іменники на ", { term: -а }, ", ", { term: -я }, " відмінюються як жіночі, а означення при них має чоловічий рід:"]
            ex: { examples: [["з мої́м ", { target: Мико́лою }], ["моє́му ", { target: Мико́лі }], ["мого́ ", { target: Мико́лу }]] }
          - type: rule
            level: B2
            text:
              uk: ["Чоловічі прізвища на ", { term: -о }, " відмінюються, жіночі залишаються без змін:"]
            ex: { examples: [["кни́жка ", { target: Франка́ }], ["Ми дзвони́ли ", { target: Іри́ні Петре́нко }, "."]] }
          - type: rule
            level: B2
            text:
              uk: ["Назва ", { term: Дніпро́ }, " змінює закінчення, як іменники чоловічого роду на приголосний:"]
            ex: ["Ми купа́лися у ", { target: Дніпрі́ }, "."]
          - type: rule
            level: B2
            text:
              uk: "Іменники, утворені від прикметників, відмінюються як прикметники:"
            ex: { examples: [["на ", { target: на́бережній }], ["з ", { target: нарече́ною }], ["про ", { target: мину́ле }]] }
          - type: rule
            level: C1
            text:
              uk: "У повному імені відмінюються обидва слова:"
            ex: { examples: [["Я дзвоню́ ", { target: Катери́ні Петрі́вні }, "."], ["Це кабіне́т ", { target: Іва́на Петро́вича }, "."]] }
          - type: note
            level: C2
            text:
              uk: ["Кличний пестливих імен: ", { link: Кличний відмінок, to: uk.nouns-cases.vocative }, "."]

