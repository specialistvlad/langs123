sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "За останнім приголосним основи іменники належать до твердої, м’якої чи мішаної групи:"
              en: "The last consonant of the stem puts a noun in the hard, the soft or the mixed group:"
              es: "La última consonante de la raíz pone el sustantivo en el grupo duro, blando o mixto:"
              pt: "A última consoante do radical coloca o substantivo no grupo duro, brando ou misto:"
              fr: "La dernière consonne du radical place le nom dans le groupe dur, mou ou mixte :"
              de: "Der letzte Konsonant des Stammes bestimmt, ob ein Substantiv zur harten, weichen oder gemischten Gruppe gehört:"
              it: "L'ultima consonante del tema colloca il sostantivo nel gruppo duro, molle o misto:"
              pl: "Ostatnia spółgłoska tematu przypisuje rzeczownik do grupy twardej, miękkiej lub mieszanej:"
              tr: "Gövdenin son ünsüzü, ismi sert, yumuşak ya da karışık gruba yerleştirir:"
              id: "Konsonan terakhir pada batang kata menentukan apakah kata benda masuk kelompok keras, lunak, atau campuran:"
              vi: "Phụ âm cuối của thân từ xếp danh từ vào nhóm cứng, mềm hoặc hỗn hợp:"
            ex: { examples: [{ target: брат }, { target: учи́тель }, { target: това́риш }] }
            tr: { en: { examples: [brother, teacher, friend] }, es: { examples: [hermano, profesor, compañero] }, pt: { examples: ["irmão", "professor", "amigo"] }, fr: { examples: ["frère", "enseignant", "camarade"] }, de: { examples: ["Bruder", "Lehrer", "Freund"] }, it: { examples: ["fratello", "insegnante", "amico"] }, pl: { examples: ["brat", "nauczyciel", "kolega"] }, tr: { examples: ["erkek kardeş", "öğretmen", "arkadaş"] }, id: { examples: ["saudara laki-laki", "guru", "teman"] }, vi: { examples: ["anh trai", "thầy giáo", "bạn"] } }

