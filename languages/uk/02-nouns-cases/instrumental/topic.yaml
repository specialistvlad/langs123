    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A2
            use: { uk: "професія, статус", en: "a job, a status", es: "una profesión, un estado" }
            ex: ["Він працюва́в ", { target: ме́неджером }, "."]
            tr: { en: "He worked as a manager.", es: "Trabajó de gerente." }
          - level: A2
            use: { uk: "знаряддя: чим?", en: "a tool: with what?", es: "un instrumento: ¿con qué?" }
            ex: ["Студе́нт пи́ше ", { target: ново́ю ру́чкою }, "."]
            tr: { en: "The student writes with a new pen.", es: "El estudiante escribe con un bolígrafo nuevo." }
          - level: A2
            use: { uk: ["після ", { alternatives: [{ term: керува́ти }, { term: ціка́витися }, { term: захо́плюватися }] }], en: ["after ", { alternatives: [{ term: керува́ти }, { term: ціка́витися }, { term: захо́плюватися }] }], es: ["después de ", { alternatives: [{ term: керува́ти }, { term: ціка́витися }, { term: захо́плюватися }] }] }
            ex: ["Ми захо́плюємося ", { target: суча́сною му́зикою }, "."]
            tr: { en: "We're keen on modern music.", es: "Nos apasiona la música actual." }
          - level: A2
            use: { uk: "мова: якою мовою?", en: "a language: in what language?", es: "un idioma: ¿en qué idioma?" }
            ex: ["Ми вчимо́ся розмовля́ти ", { target: украї́нською мо́вою }, "."]
            tr: { en: "We're learning to speak Ukrainian.", es: "Aprendemos a hablar ucraniano." }
          - level: A2
            use: { uk: [{ term: з }, ": з ким? з чим?"], en: [{ term: з }, ": with whom? with what?"], es: [{ term: з }, ": ¿con quién?, ¿con qué?"] }
            ex: ["Дмитро́ розмовля́є ", { target: з Оле́ною }, "."]
            tr: { en: "Dmytro is talking to Olena.", es: "Dmytro habla con Olena." }
          - level: A2
            use: { uk: [{ alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }, ": місце"], en: [{ alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }, ": the place"], es: [{ alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }, ": el lugar"] }
            ex: [{ target: Між го́рами }, " тече́ рі́чка."]
            tr: { en: "A river flows between the mountains.", es: "Entre las montañas corre un río." }
          - level: A2
            use: { uk: [{ term: пе́ред }, ": перед чим? (час)"], en: [{ term: пе́ред }, ": before (time)"], es: [{ term: пе́ред }, ": antes de (tiempo)"] }
            ex: [{ target: Пе́ред обі́дом }, " тре́ба ми́ти ру́ки."]
            tr: { en: "You should wash your hands before lunch.", es: "Hay que lavarse las manos antes de comer." }
          - level: B1
            use: { uk: "шлях: де? якою дорогою?", en: "the way: along where?", es: "el camino: ¿por dónde?" }
            ex: ["Ми лю́бимо гуля́ти ", { target: ву́лицями Льво́ва }, "."]
            tr: { en: "We like walking around the streets of Lviv.", es: "Nos gusta pasear por las calles de Lviv." }
          - level: B1
            use: { uk: "транспорт: чим?", en: "transport: by what?", es: "transporte: ¿en qué?" }
            ex: ["Щодня́ ми ї́здимо ", { target: трамва́єм }, "."]
            tr: { en: "We go by tram every day.", es: "Vamos en tranvía todos los días." }
          - level: B1
            use: { uk: [{ term: з }, ": як?"], en: [{ term: з }, ": how?"], es: [{ term: з }, ": ¿cómo?"] }
            ex: ["Ді́ти їдя́ть ", { target: з апети́том }, "."]
            tr: { en: "The children are eating with appetite.", es: "Los niños comen con apetito." }
          - level: B1
            use: { uk: [{ term: між }, ": стосунки"], en: [{ term: між }, ": relations between people"], es: [{ term: між }, ": relaciones entre personas"] }
            ex: [{ target: Між дру́зями }, " нема́є таємни́ць."]
            tr: { en: "There are no secrets between friends.", es: "Entre amigos no hay secretos." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Ми розмовля́ємо на украї́нській мо́ві., right: ["Ми розмовля́ємо ", { target: украї́нською мо́вою }, "."], rule: { uk: ["якою мовою? — орудний; ", { term: на украї́нській мо́ві }, " — з російської"], en: ["in what language? takes the instrumental; ", { term: на украї́нській мо́ві }, " comes from Russian"], es: ["«en qué idioma» lleva instrumental; ", { term: на украї́нській мо́ві }, " viene del ruso"] } }
          - { level: A2, wrong: Я пишу́ ру́чка., right: ["Я пишу́ ", { target: ру́чкою }, "."], rule: { uk: [{ term: чим? }, " — орудний"], en: ["the tool, ", { term: чим? }, ", takes the instrumental"], es: ["el instrumento, ", { term: чим? }, ", va en instrumental"] } }
          - { level: B1, wrong: Ми милу́ємося о́сінью., right: ["Ми милу́ємося ", { target: о́сінню }, "."], rule: { uk: ["між голосним і ", { term: -ю }, " приголосний подвоюється"], en: ["between a vowel and ", { term: -ю }, " the consonant doubles"], es: ["entre vocal y ", { term: -ю }, " la consonante se duplica"] } }
          - { level: A2, speakers: [en, es], wrong: Я працю́ю як виклада́ч., right: ["Я працю́ю ", { target: викладаче́м }, "."], rule: { en: ["a job after ", { term: працюва́ти }, " is instrumental, without “as”"], es: ["la profesión tras ", { term: працюва́ти }, " va en instrumental, sin «como»"] } }
          - { level: A2, speakers: [es], wrong: Я п’ю чай з лимо́н., right: ["Я п’ю чай ", { target: із лимо́ном }, "."], rule: { es: [{ term: з }, " con el sentido de «con» pide instrumental"] } }
