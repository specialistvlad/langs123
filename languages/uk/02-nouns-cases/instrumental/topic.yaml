            text:
              uk: ["Орудний відповідає на питання ", { term: ким? }, " ", { term: чим? }, " і називає знаряддя, професію чи того, з ким щось роблять:"]
              en: ["The instrumental answers ", { term: ким? }, " and ", { term: чим? }, " and names a tool, a job or the person you do something with:"]
              es: ["El instrumental responde a ", { term: ким? }, " y ", { term: чим? }, " y nombra un instrumento, una profesión o con quién se hace algo:"]
            ex: { examples: [["писа́ти ", { target: ру́чкою }], ["працюва́ти ", { target: лі́карем }], ["гуля́ти ", { target: з дру́гом }]] }
            tr: { en: { examples: ["to write with a pen", "to work as a doctor", "to go for a walk with a friend"] }, es: { examples: ["escribir con bolígrafo", "trabajar de médico", "pasear con un amigo"] } }

  - title: { uk: "Форма: іменники", en: "Form: nouns", es: "Forma: sustantivos" }
