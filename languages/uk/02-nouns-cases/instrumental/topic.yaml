title: { uk: Орудний відмінок, en: Instrumental Case, es: El caso instrumental }
summary:
  lead:
    uk: ["Орудний відмінок відповідає на питання ", { term: ким? }, " ", { term: чим? }, ": він називає знаряддя, професію й того, з ким щось роблять."]
    en: ["The instrumental answers ", { term: ким? }, " (by whom?) and ", { term: чим? }, " (with what?): it names a tool, a job and the person you do something with."]
    es: ["El instrumental responde a ", { term: ким? }, " y ", { term: чим? }, " (¿con quién?, ¿con qué?): nombra un instrumento, una profesión y la compañía."]
  rule:
    uk: ["Чоловічий і середній рід мають ", { term: -ом }, " (", { term: -ем }, "), жіночий — ", { term: -ою }, " (", { term: -ею }, "):"]
    en: ["Masculine and neuter nouns take ", { term: -ом }, " (", { term: -ем }, "), feminine nouns ", { term: -ою }, " (", { term: -ею }, "):"]
    es: ["Los masculinos y neutros toman ", { term: -ом }, " (", { term: -ем }, "); los femeninos, ", { term: -ою }, " (", { term: -ею }, "):"]
  ex: { examples: [["Я пишу́ ", { target: ру́чкою }, "."], ["Він працю́є ", { target: лі́карем }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { uk: Чоловічий рід, en: Masculine, es: Masculino }
          rule:
            uk: [{ term: -ом }, "; після м’якого чи шиплячого ", { term: -ем }]
            en: [{ term: -ом }, "; after a soft consonant or ж, ч, ш, щ ", { term: -ем }]
            es: [{ term: -ом }, "; tras consonante blanda o ж, ч, ш, щ, ", { term: -ем }]
          ex: ["Він працю́є ", { target: лі́карем }, "."]
          tr: { en: "He works as a doctor.", es: "Trabaja de médico." }
        - level: A2
          point: { uk: Жіночий рід, en: Feminine, es: Femenino }
          rule:
            uk: [{ mapping: [{ term: -а }, { term: -ою }] }, ", ", { mapping: [{ term: -я }, { term: -ею }] }]
            en: [{ mapping: [{ term: -а }, { term: -ою }] }, ", ", { mapping: [{ term: -я }, { term: -ею }] }]
            es: [{ mapping: [{ term: -а }, { term: -ою }] }, ", ", { mapping: [{ term: -я }, { term: -ею }] }]
          ex: ["Я пишу́ ", { target: ру́чкою }, "."]
          tr: { en: "I write with a pen.", es: "Escribo con bolígrafo." }
        - level: A2
          point: { uk: Середній рід, en: Neuter, es: Neutro }
          rule:
            uk: [{ term: -ом }, ", ", { term: -ем }, ", ", { term: -ям }]
            en: [{ term: -ом }, ", ", { term: -ем }, ", ", { term: -ям }]
            es: [{ term: -ом }, ", ", { term: -ем }, ", ", { term: -ям }]
          ex: ["Я ціка́влюся ", { target: мисте́цтвом }, "."]
          tr: { en: "I'm interested in art.", es: "Me interesa el arte." }
        - level: A2
          point: { uk: Множина, en: Plural, es: Plural }
          rule:
            uk: { alternatives: [{ term: -ами }, { term: -ями }] }
            en: { alternatives: [{ term: -ами }, { term: -ями }] }
            es: { alternatives: [{ term: -ами }, { term: -ями }] }
          ex: ["Ді́ти малю́ють ", { target: олівця́ми }, "."]
          tr: { en: "The children draw with pencils.", es: "Los niños dibujan con lápices." }
        - level: A2
          point: { uk: Займенники, en: Pronouns, es: Pronombres }
          rule:
            uk: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: ним }, { term: не́ю }, { term: на́ми }, { term: ва́ми }, { term: ни́ми }] }
            en: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: ним }, { term: не́ю }, { term: на́ми }, { term: ва́ми }, { term: ни́ми }] }
            es: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: ним }, { term: не́ю }, { term: на́ми }, { term: ва́ми }, { term: ни́ми }] }
          ex: ["Ході́ ", { target: зі мно́ю }, "!"]
          tr: { en: "Come with me!", es: "¡Ven conmigo!" }
        - level: A2
          point: { uk: Професія, en: Job, es: Profesión }
          rule:
            uk: [{ alternatives: [{ term: працюва́ти }, { term: ста́ти }] }, " ким?"]
            en: [{ alternatives: [{ term: працюва́ти }, { term: ста́ти }] }, " as whom?"]
            es: [{ alternatives: [{ term: працюва́ти }, { term: ста́ти }] }, " ¿de qué?"]
          ex: ["Мико́ла хо́че ста́ти ", { target: викладаче́м }, "."]
          tr: { en: "Mykola wants to become a lecturer.", es: "Mykola quiere ser profesor." }
        - level: A2
          point: { uk: З, en: З, es: З }
          rule:
            uk: [{ term: з }, " ким? з чим?"]
            en: [{ term: з }, ": with whom? with what?"]
            es: [{ term: з }, ": ¿con quién?, ¿con qué?"]
          ex: ["Я п’ю чай ", { target: із лимо́ном }, "."]
          tr: { en: "I drink tea with lemon.", es: "Tomo té con limón." }
        - level: A2
          point: { uk: Місце, en: Place, es: Lugar }
          rule:
            uk: { alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }
            en: { alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }
            es: { alternatives: [{ term: над }, { term: під }, { term: пе́ред }, { term: за }, { term: між }] }
          ex: ["Ла́мпа ", { target: над столо́м }, "."]
          tr: { en: "The lamp is above the table.", es: "La lámpara está encima de la mesa." }
        - level: B1
          point: { uk: Шлях і транспорт, en: Route and transport, es: Camino y transporte }
          rule:
            uk: "чим? — дорогою, транспортом"
            en: "by what way or what transport?"
            es: "¿por dónde?, ¿en qué transporte?"
          ex: ["Ми ї́здимо ", { target: трамва́єм }, "."]
          tr: { en: "We go by tram.", es: "Vamos en tranvía." }
        - level: B1
          point: { uk: Спосіб, en: Manner, es: Modo }
          rule:
            uk: [{ term: з }, ": як?"]
            en: [{ term: з }, ": how?"]
            es: [{ term: з }, ": ¿cómo?"]
          ex: ["Він розмовля́є ", { target: з акце́нтом }, "."]
          tr: { en: "He speaks with an accent.", es: "Habla con acento." }
        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["мова: ", { term: украї́нською мо́вою }]
            en: ["a language: ", { term: украї́нською мо́вою }]
            es: ["un idioma: ", { term: украї́нською мо́вою }]
          ex: ["Ми розмовля́ємо ", { target: украї́нською мо́вою }, "."]
          tr: { en: "We speak Ukrainian.", es: "Hablamos ucraniano." }

