          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, м’яка основа", en: "Masculine, soft stem", es: "Masculino, raíz blanda" }, nom: { alternatives: [учи́тель, музе́й] }, ins: { alternatives: [["учи́тел", { ending: ем }], ["музе́", { ending: єм }]] } }
          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на ж, ч, ш, щ", en: "Masculine in ж, ч, ш, щ", es: "Masculino en ж, ч, ш, щ" }, nom: { alternatives: [виклада́ч, това́риш] }, ins: { alternatives: [["викладач", { ending: е́м }], ["това́риш", { ending: ем }]] } }
          - { level: A2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на -а", en: "Feminine in -а", es: "Femenino en -а" }, nom: { alternatives: [ма́ма, ру́чка] }, ins: { alternatives: [["ма́м", { ending: ою }], ["ру́чк", { ending: ою }]] } }
          - { level: A2, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на -я, -ія", en: "Feminine in -я, -ія", es: "Femenino en -я, -ія" }, nom: { alternatives: [бабу́ся, Марі́я] }, ins: { alternatives: [["бабу́с", { ending: ею }], ["Марі́", { ending: єю }]] } }
          - { level: A2, features: { gender: neut, number: sg }, group: { uk: "Середній рід", en: "Neuter", es: "Neutro" }, nom: { alternatives: [мі́сто, мо́ре, життя́] }, ins: { alternatives: [["мі́ст", { ending: ом }], ["мо́р", { ending: ем }], ["житт", { ending: я́м }]] } }
          - { level: A2, features: { number: pl }, group: { uk: "Множина", en: "Plural", es: "Plural" }, nom: { alternatives: [дру́зі, книжки́] }, ins: { alternatives: [["дру́з", { ending: ями }], ["книжк", { ending: а́ми }]] } }
          - { level: B1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід без закінчення", en: "Feminine with no ending", es: "Femenino sin terminación" }, nom: { alternatives: [о́сінь, ніч, ра́дість] }, ins: { alternatives: [["о́сін", { ending: ню }], ["ні́ч", { ending: чю }], ["ра́діст", { ending: ю }]] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Між голосним і ", { term: -ю }, " один приголосний подвоюється:"]
              en: ["Between a vowel and ", { term: -ю }, ", a single consonant doubles:"]
              es: ["Entre una vocal y ", { term: -ю }, ", una consonante sola se duplica:"]
            ex: ["Ми милу́ємося ", { target: о́сінню }, "."]
            tr: { en: "We admire the autumn.", es: "Admiramos el otoño." }

  - title: { uk: "Форма: займенники", en: "Form: pronouns", es: "Forma: pronombres" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: nom, label: { uk: Називний, en: Nominative, es: Nominativo }, features: { case: nom } }
          - { key: ins, label: { uk: Орудний, en: Instrumental, es: Instrumental }, features: { case: ins } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, nom: я, ins: мно́ю }
          - { level: A2, features: { person: 2, number: sg }, nom: ти, ins: тобо́ю }
          - { level: A2, features: { person: 3, number: sg, gender: [masc, neut] }, nom: { alternatives: [він, воно́] }, ins: ним }
