          - { level: A2, features: { person: 2, number: pl }, nom: ви, ins: ва́ми }
          - { level: A2, features: { person: 3, number: pl }, nom: вони́, ins: ни́ми }

  - title: { uk: Вживання, en: Use, es: Uso }
