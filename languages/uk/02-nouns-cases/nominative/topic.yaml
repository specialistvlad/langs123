summary:
  lead:
    uk: ["Називний відмінок — словникова форма іменника: він відповідає на питання ", { term: хто? }, " і ", { term: що? }, " та називає підмет."]
    en: ["The nominative is the dictionary form of a noun: it names the subject and answers ", { term: хто? }, " (who?) and ", { term: що? }, " (what?)."]
    es: ["El nominativo es la forma del diccionario: nombra el sujeto y responde a ", { term: хто? }, " (¿quién?) y ", { term: що? }, " (¿qué?)."]
    pt: ["O nominativo é a forma de dicionário do substantivo: nomeia o sujeito e responde a ", { term: хто? }, " (quem?) e ", { term: що? }, " (o quê?)."]
    fr: ["Le nominatif est la forme du dictionnaire d’un nom : il désigne le sujet et répond à ", { term: хто? }, " (qui ?) et ", { term: що? }, " (quoi ?)."]
    de: ["Der Nominativ ist die Wörterbuchform eines Nomens: Er nennt das Subjekt und antwortet auf ", { term: хто? }, " (wer?) und ", { term: що? }, " (was?)."]
    it: ["Il nominativo è la forma del dizionario del sostantivo: indica il soggetto e risponde a ", { term: хто? }, " (chi?) e ", { term: що? }, " (che cosa?)."]
    pl: ["Mianownik to słownikowa forma rzeczownika: nazywa podmiot i odpowiada na pytania ", { term: хто? }, " (kto?) i ", { term: що? }, " (co?)."]
    tr: ["Yalın hâl, ismin sözlük biçimidir: özneyi bildirir ve ", { term: хто? }, " (kim?) ile ", { term: що? }, " (ne?) sorularına karşılık verir."]
    id: ["Nominatif adalah bentuk kamus dari nomina: kasus ini menyebut subjek dan menjawab ", { term: хто? }, " (siapa?) dan ", { term: що? }, " (apa?)."]
    vi: ["Danh cách là dạng từ điển của danh từ: nó chỉ chủ ngữ và trả lời cho ", { term: хто? }, " (ai?) và ", { term: що? }, " (cái gì?)."]
  rule:
    uk: ["Після ", { term: це }, " і ", { term: мене́ зва́ти }, " іменник стоїть у називному:"]
    en: ["After ", { term: це }, " (this is) and ", { term: мене́ зва́ти }, " (my name is), the noun is nominative:"]
    es: ["Después de ", { term: це }, " (esto es) y ", { term: мене́ зва́ти }, " (me llamo), el sustantivo va en nominativo:"]
    pt: ["Depois de ", { term: це }, " (isto é) e ", { term: мене́ зва́ти }, " (meu nome é), o substantivo fica no nominativo:"]
    fr: ["Après ", { term: це }, " (c’est) et ", { term: мене́ зва́ти }, " (je m’appelle), le nom est au nominatif :"]
    de: ["Nach ", { term: це }, " (das ist) und ", { term: мене́ зва́ти }, " (ich heiße) steht das Nomen im Nominativ:"]
    it: ["Dopo ", { term: це }, " (questo è) e ", { term: мене́ зва́ти }, " (mi chiamo) il sostantivo sta al nominativo:"]
    pl: ["Po ", { term: це }, " (to jest) i ", { term: мене́ зва́ти }, " (mam na imię) rzeczownik stoi w mianowniku:"]
