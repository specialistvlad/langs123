            vi: [{ term: з }, ": từ đâu? dùng sinh cách; với ai? dùng công cụ cách"]
          ex: { contrast: [["Я ", { target: з Ки́єва }], ["Я ", { target: з бра́том }]] }
          tr: { en: { contrast: ["I'm from Kyiv", "I'm with my brother"] }, es: { contrast: ["Soy de Kyiv", "Estoy con mi hermano"] }, pt: { contrast: ["Sou de Kyiv", "Estou com meu irmão"] }, fr: { contrast: ["Je suis de Kyiv", "Je suis avec mon frère"] }, de: { contrast: ["Ich komme aus Kyiv", "Ich bin mit meinem Bruder da"] }, it: { contrast: ["Sono di Kyiv", "Sono con mio fratello"] }, pl: { contrast: ["Jestem z Kijowa", "Jestem z bratem"] }, tr: { contrast: ["Kyiv’denim", "Kardeşimle birlikteyim"] }, id: { contrast: ["Saya dari Kyiv", "Saya bersama saudara laki-laki saya"] }, vi: { contrast: ["Tôi đến từ Kyiv", "Tôi đi cùng anh trai"] } }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Іменник змінює закінчення за відмінками: кожен відмінок — своя роль у реченні."
              en: "A noun changes its ending by case: each case is a role in the sentence."
              es: "El sustantivo cambia la terminación según el caso: cada caso es una función en la oración."
              pt: "O substantivo muda de terminação conforme o caso: cada caso é uma função na frase."
              fr: "Le nom change de terminaison selon le cas : chaque cas est une fonction dans la phrase."
              de: "Das Substantiv ändert seine Endung nach dem Fall: Jeder Fall ist eine Rolle im Satz."
              it: "Il nome cambia desinenza secondo il caso: ogni caso è una funzione nella frase."
              pl: "Rzeczownik zmienia końcówkę w zależności od przypadku: każdy przypadek to inna rola w zdaniu."
              tr: "İsim, hâle göre ek değiştirir: her hâl cümlede ayrı bir işlev taşır."
              id: "Nomina berubah akhirannya menurut kasus: setiap kasus adalah satu peran dalam kalimat."
              vi: "Danh từ đổi đuôi theo cách: mỗi cách là một vai trò trong câu."
            ex: { examples: [[{ target: Ма́ма }, " тут."], ["Я ба́чу ", { target: ма́му }, "."], [{ target: Ма́мо }, ", ході́ сюди́!"]] }
            tr: { en: { examples: ["Mum is here.", "I can see Mum.", "Mum, come here!"] }, es: { examples: ["Mamá está aquí.", "Veo a mamá.", "¡Mamá, ven aquí!"] }, pt: { examples: ["A mamãe está aqui.", "Vejo a mamãe.", "Mamãe, venha aqui!"] }, fr: { examples: ["Maman est là.", "Je vois maman.", "Maman, viens ici !"] }, de: { examples: ["Mama ist hier.", "Ich sehe Mama.", "Mama, komm her!"] }, it: { examples: ["La mamma è qui.", "Vedo la mamma.", "Mamma, vieni qui!"] }, pl: { examples: ["Mama jest tutaj.", "Widzę mamę.", "Mamo, chodź tutaj!"] }, tr: { examples: ["Annem burada.", "Annemi görüyorum.", "Anne, buraya gel!"] }, id: { examples: ["Ibu ada di sini.", "Saya melihat Ibu.", "Ibu, kemari!"] }, vi: { examples: ["Mẹ ở đây.", "Tôi thấy mẹ.", "Mẹ ơi, lại đây!"] } }
          - type: rule
            level: A1
            text:
              uk: "Прийменник вимагає певного відмінка, а питання підказує, якого:"
              en: "A preposition calls for a set case, and the question tells you which:"
              es: "Una preposición pide un caso fijo, y la pregunta indica cuál:"
              pt: "Uma preposição pede um caso fixo, e a pergunta indica qual:"
              fr: "Une préposition appelle un cas précis, et la question indique lequel :"
              de: "Eine Präposition verlangt einen bestimmten Fall, und die Frage zeigt, welchen:"
              it: "Una preposizione richiede un caso fisso, e la domanda indica quale:"
              pl: "Przyimek wymaga określonego przypadku, a pytanie podpowiada, którego:"
              tr: "Bir edat belli bir hâl ister, hangisi olduğunu da soru gösterir:"
              id: "Kata depan menuntut kasus tertentu, dan pertanyaannya menunjukkan kasus yang mana:"
              vi: "Giới từ đòi một cách nhất định, và câu hỏi cho biết cách nào:"
            ex: { examples: [["Ми ", { target: в па́рку }, "."], ["Ми йдемо́ ", { target: в парк }, "."]] }
            tr: { en: { examples: ["We're in the park.", "We're going to the park."] }, es: { examples: ["Estamos en el parque.", "Vamos al parque."] }, pt: { examples: ["Estamos no parque.", "Vamos ao parque."] }, fr: { examples: ["Nous sommes dans le parc.", "Nous allons au parc."] }, de: { examples: ["Wir sind im Park.", "Wir gehen in den Park."] }, it: { examples: ["Siamo nel parco.", "Andiamo al parco."] }, pl: { examples: ["Jesteśmy w parku.", "Idziemy do parku."] }, tr: { examples: ["Parktayız.", "Parka gidiyoruz."] }, id: { examples: ["Kami ada di taman.", "Kami pergi ke taman."] }, vi: { examples: ["Chúng tôi ở trong công viên.", "Chúng tôi đi đến công viên."] } }
          - type: rule
            level: A1
            text:
              uk: "Порядок слів вільніший, ніж в англійській чи іспанській: роль слова показує закінчення."
              en: "Word order is freer than in English: the ending shows each word's role."
              es: "El orden de las palabras es más libre que en español: la terminación muestra la función."
              pt: "A ordem das palavras é mais livre que em português: a terminação mostra a função de cada palavra."
              fr: "L’ordre des mots est plus libre qu’en français : la terminaison montre la fonction de chaque mot."
              de: "Die Wortstellung ist freier als im Deutschen: Die Endung zeigt die Rolle jedes Wortes."
              it: "L’ordine delle parole è più libero che in italiano: la desinenza mostra la funzione di ogni parola."
              pl: "Szyk wyrazów jest swobodny: rolę każdego słowa pokazuje końcówka."
              tr: "Sözcük sırası serbesttir: her sözcüğün işlevini ek gösterir."
              id: "Urutan kata lebih bebas daripada dalam bahasa Indonesia: akhiran menunjukkan peran tiap kata."
              vi: "Trật tự từ tự do hơn trong tiếng Việt: đuôi từ cho biết vai trò của mỗi từ."
            ex: { equivalence: [[{ target: Ма́ма }, " ба́чить ", { target: та́та }, "."], [{ target: Та́та }, " ба́чить ", { target: ма́ма }, "."]] }
            tr: { en: { equivalence: ["Mum sees Dad.", "Mum sees Dad."] }, es: { equivalence: ["Mamá ve a papá.", "Mamá ve a papá."] }, pt: { equivalence: ["A mamãe vê o papai.", "A mamãe vê o papai."] }, fr: { equivalence: ["Maman voit papa.", "Maman voit papa."] }, de: { equivalence: ["Mama sieht Papa.", "Mama sieht Papa."] }, it: { equivalence: ["La mamma vede il papà.", "La mamma vede il papà."] }, pl: { equivalence: ["Mama widzi tatę.", "Mama widzi tatę."] }, tr: { equivalence: ["Annem babamı görüyor.", "Annem babamı görüyor."] }, id: { equivalence: ["Ibu melihat Ayah.", "Ibu melihat Ayah."] }, vi: { equivalence: ["Mẹ thấy bố.", "Mẹ thấy bố."] } }

