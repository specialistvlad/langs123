title: { uk: Сім відмінків, en: The Seven Cases, es: Los siete casos, pt: "Os sete casos", fr: "Les sept cas", de: "Die sieben Fälle", it: "I sette casi", pl: "Siedem przypadków", tr: "Yedi hâl", id: "Tujuh kasus", vi: "Bảy cách" }
summary:
  lead:
    uk: "Українська мова має сім відмінків: закінчення іменника показує його роль у реченні, а прийменник вимагає свого відмінка."
    en: "Ukrainian has seven cases: a noun's ending shows its role in the sentence, and each preposition calls for its own case."
    es: "El ucraniano tiene siete casos: la terminación del sustantivo muestra su función en la oración, y cada preposición pide su caso."
    pt: "O ucraniano tem sete casos: a terminação do substantivo mostra sua função na frase, e cada preposição pede o seu caso."
    fr: "L’ukrainien a sept cas : la terminaison du nom montre sa fonction dans la phrase, et chaque préposition appelle son propre cas."
    de: "Das Ukrainische hat sieben Fälle: Die Endung des Substantivs zeigt seine Rolle im Satz, und jede Präposition verlangt ihren eigenen Fall."
    it: "L’ucraino ha sette casi: la desinenza del nome mostra la sua funzione nella frase, e ogni preposizione richiede il suo caso."
    pl: "Ukraiński ma siedem przypadków: końcówka rzeczownika pokazuje jego rolę w zdaniu, a każdy przyimek wymaga swojego przypadku."
    tr: "Ukraynacada yedi hâl vardır: ismin eki cümledeki işlevini gösterir, her edat da kendi hâlini ister."
    id: "Bahasa Ukraina punya tujuh kasus: akhiran nomina menunjukkan perannya dalam kalimat, dan setiap kata depan menuntut kasusnya sendiri."
    vi: "Tiếng Ukraina có bảy cách: đuôi danh từ chỉ vai trò trong câu, và mỗi giới từ đòi một cách riêng."
  rule:
    uk: ["Кожен відмінок відповідає на свої питання, як-от ", { term: де? }, " і ", { term: куди́? }, ":"]
    en: ["Each case answers its own questions, such as ", { term: де? }, " (where?) and ", { term: куди́? }, " (where to?):"]
    es: ["Cada caso responde a sus preguntas, como ", { term: де? }, " (¿dónde?) y ", { term: куди́? }, " (¿adónde?):"]
    pt: ["Cada caso responde às suas próprias perguntas, como ", { term: де? }, " (onde?) e ", { term: куди́? }, " (para onde?):"]
    fr: ["Chaque cas répond à ses propres questions, comme ", { term: де? }, " (où ?) et ", { term: куди́? }, " (vers où ?) :"]
    de: ["Jeder Fall antwortet auf eigene Fragen, etwa ", { term: де? }, " (wo?) und ", { term: куди́? }, " (wohin?):"]
    it: ["Ogni caso risponde alle sue domande, come ", { term: де? }, " (dove?) e ", { term: куди́? }, " (verso dove?):"]
    pl: ["Każdy przypadek odpowiada na własne pytania, takie jak ", { term: де? }, " (gdzie?) i ", { term: куди́? }, " (dokąd?):"]
    tr: ["Her hâl kendi sorularını yanıtlar, örneğin ", { term: де? }, " (nerede?) ve ", { term: куди́? }, " (nereye?):"]
    id: ["Setiap kasus menjawab pertanyaannya sendiri, seperti ", { term: де? }, " (di mana?) dan ", { term: куди́? }, " (ke mana?):"]
    vi: ["Mỗi cách trả lời câu hỏi riêng, như ", { term: де? }, " (ở đâu?) và ", { term: куди́? }, " (đi đâu?):"]
  ex: { examples: [["Я ", { target: в Ки́єві }, "."], ["Я ї́ду ", { target: в Ки́їв }, "."]] }

