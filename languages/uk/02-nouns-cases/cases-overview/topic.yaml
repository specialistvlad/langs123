        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: [{ term: з }, ": звідки? — родовий; з ким? — орудний"]
            en: [{ term: з }, ": from where takes the genitive, with whom the instrumental"]
            es: [{ term: з }, ": «de dónde» lleva genitivo; «con quién», instrumental"]
            pt: [{ term: з }, ": de onde? pede o genitivo; com quem?, o instrumental"]
            fr: [{ term: з }, " : d’où ? demande le génitif ; avec qui ?, l’instrumental"]
