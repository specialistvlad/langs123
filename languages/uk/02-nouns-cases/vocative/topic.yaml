          ex: [{ target: Паціє́нте }, ", не хвилю́йтеся."]
          tr: { en: "Patient, don't worry.", es: "Paciente, no se preocupe.", pt: "Paciente, não se preocupe.", fr: "Patient, ne vous inquiétez pas.", de: "Patient, machen Sie sich keine Sorgen.", it: "Paziente, non si preoccupi.", pl: "Pacjencie, proszę się nie martwić.", tr: "Hasta, endişelenmeyin.", id: "Pasien, jangan khawatir.", vi: "Bệnh nhân, xin đừng lo lắng." }
