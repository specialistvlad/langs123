          - type: rule
            level: A1
            text:
              uk: "Звертання виділяють комами:"
              en: "Commas set off the person addressed:"
              es: "Las comas separan a la persona a quien se habla:"
              pt: "Vírgulas separam a pessoa a quem nos dirigimos:"
              fr: "Des virgules isolent la personne à qui l’on s’adresse :"
              de: "Kommas grenzen die angesprochene Person ab:"
              it: "Le virgole isolano la persona a cui ci si rivolge:"
              pl: "Zwrot do osoby oddziela się przecinkami:"
              tr: "Seslenilen kişi virgüllerle ayrılır:"
              id: "Orang yang disapa dipisahkan dengan koma:"
              vi: "Người được gọi được tách bằng dấu phẩy:"
