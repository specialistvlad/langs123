title: { uk: Кличний відмінок, en: Vocative Case, es: El caso vocativo, pt: "O caso vocativo", fr: "Le cas vocatif", de: "Der Vokativ", it: "Il caso vocativo", pl: "Wołacz", tr: "Seslenme hâli", id: "Kasus vokatif", vi: "Hô cách" }
summary:
  lead:
    uk: "Кличний відмінок — форма звертання: ним кличуть людину на ім’я, звертаються до рідних, друзів і незнайомих."
    en: "The vocative is the form for addressing someone: it calls a person by name and speaks to family, friends and strangers."
    es: "El vocativo es la forma para dirigirse a alguien: llama a una persona por su nombre y habla a familiares, amigos y desconocidos."
    pt: "O vocativo é a forma para se dirigir a alguém: chama a pessoa pelo nome e fala com familiares, amigos e desconhecidos."
    fr: "Le vocatif est la forme d’adresse : il appelle une personne par son prénom et sert à parler à la famille, aux amis et aux inconnus."
    de: "Der Vokativ ist die Anredeform: Mit ihm ruft man eine Person beim Namen und spricht Familie, Freunde und Fremde an."
    it: "Il vocativo è la forma per rivolgersi a qualcuno: chiama una persona per nome e serve a parlare a familiari, amici e sconosciuti."
    pl: "Wołacz to forma zwracania się do kogoś: nim woła się osobę po imieniu i mówi do rodziny, przyjaciół i nieznajomych."
    tr: "Seslenme hâli, birine hitap etme biçimidir: kişiye adıyla seslenilir, aileye, arkadaşlara ve yabancılara böyle hitap edilir."
    id: "Vokatif adalah bentuk untuk menyapa seseorang: dipakai untuk memanggil orang dengan namanya dan berbicara kepada keluarga, teman, dan orang asing."
    vi: "Hô cách là dạng để gọi ai đó: gọi người bằng tên, nói với người thân, bạn bè và người lạ."
  rule:
    uk: ["Імена на ", { term: -а }, " мають ", { term: -о }, ", на приголосний — ", { term: -е }, " чи ", { term: -ю }, ":"]
