          tr: { en: "Dear community, may I have your attention, please.", es: "Estimada comunidad, les pido su atención.", pt: "Prezada comunidade, peço a atenção de todos.", fr: "Chère communauté, je vous demande votre attention.", de: "Liebe Gemeinde, ich bitte um Ihre Aufmerksamkeit.", it: "Cara comunità, chiedo la vostra attenzione.", pl: "Szanowna społeczności, proszę o uwagę.", tr: "Değerli topluluk, dikkatinizi rica ederim.", id: "Komunitas yang terhormat, mohon perhatiannya.", vi: "Kính thưa cộng đồng, xin quý vị chú ý." }
