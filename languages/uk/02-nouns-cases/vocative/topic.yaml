  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Кличний відмінок — форма, якою звертаються до людини:"
              en: "The vocative is the form used to speak to someone:"
              es: "El vocativo es la forma con la que se habla a alguien:"
              pt: "O vocativo é a forma usada para falar com alguém:"
              fr: "Le vocatif est la forme employée pour s’adresser à quelqu’un :"
              de: "Der Vokativ ist die Form, mit der man jemanden anspricht:"
              it: "Il vocativo è la forma con cui ci si rivolge a qualcuno:"
              pl: "Wołacz to forma, której używa się, zwracając się do kogoś:"
              tr: "Seslenme hâli, birine hitap ederken kullanılan biçimdir:"
              id: "Vokatif adalah bentuk yang dipakai untuk menyapa seseorang:"
              vi: "Hô cách là dạng dùng để gọi hoặc nói với ai đó:"
            ex: [{ target: Ма́мо }, ", ході́ сюди́!"]
            tr: { en: "Mum, come here!", es: "¡Mamá, ven aquí!", pt: "Mamãe, venha aqui!", fr: "Maman, viens ici !", de: "Mama, komm her!", it: "Mamma, vieni qui!", pl: "Mamo, chodź tutaj!", tr: "Anne, buraya gel!", id: "Ibu, kemari!", vi: "Mẹ ơi, lại đây!" }
          - type: rule
            level: A1
            text:
              uk: "Звертання виділяють комами:"
              en: "Commas set off the person addressed:"
              es: "Las comas separan a la persona a quien se habla:"
              pt: "Vírgulas separam a pessoa a quem nos dirigimos:"
              fr: "Des virgules isolent la personne à qui l’on s’adresse :"
              de: "Kommas grenzen die angesprochene Person ab:"
              it: "Le virgole isolano la persona a cui ci si rivolge:"
              pl: "Zwrot do osoby oddziela się przecinkami:"
              tr: "Seslenilen kişi virgüllerle ayrılır:"
              id: "Orang yang disapa dipisahkan dengan koma:"
              vi: "Người được gọi được tách bằng dấu phẩy:"
            ex: ["Дя́кую, ", { target: Іва́не }, "!"]
            tr: { en: "Thank you, Ivan!", es: "¡Gracias, Ivan!", pt: "Obrigado, Ivan!", fr: "Merci, Ivan !", de: "Danke, Ivan!", it: "Grazie, Ivan!", pl: "Dziękuję, Ivan!", tr: "Teşekkürler, Ivan!", id: "Terima kasih, Ivan!", vi: "Cảm ơn, Ivan!" }

  - title: { uk: Форма, en: Form, es: Forma, pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: group, label: { uk: Група, en: Group, es: Grupo, pt: "Grupo", fr: "Groupe", de: "Gruppe", it: "Gruppo", pl: "Grupa", tr: "Grup", id: "Kelompok", vi: "Nhóm" } }
          - { key: nom, label: { uk: Називний, en: Nominative, es: Nominativo, pt: "Nominativo", fr: "Nominatif", de: "Nominativ", it: "Nominativo", pl: "Mianownik", tr: "Yalın hâl", id: "Nominatif", vi: "Danh cách" }, features: { case: nom } }
          - { key: voc, label: { uk: Кличний, en: Vocative, es: Vocativo, pt: "Vocativo", fr: "Vocatif", de: "Vokativ", it: "Vocativo", pl: "Wołacz", tr: "Seslenme hâli", id: "Vokatif", vi: "Hô cách" }, features: { case: voc } }
        rows:
          - { level: A1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, тверда основа", en: "Masculine, hard stem", es: "Masculino, raíz dura", pt: "Masculino, radical duro", fr: "Masculin, radical dur", de: "Maskulin, harter Stamm", it: "Maschile, tema duro", pl: "Rodzaj męski, temat twardy", tr: "Eril, sert gövde", id: "Maskulin, batang keras", vi: "Giống đực, thân từ cứng" }, nom: { alternatives: [Оста́п, брат, пан] }, voc: { alternatives: [["Оста́п", { ending: е }], ["бра́т", { ending: е }], ["па́н", { ending: е }]] } }
          - { level: A1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід, м’яка основа", en: "Masculine, soft stem", es: "Masculino, raíz blanda", pt: "Masculino, radical mole", fr: "Masculin, radical mou", de: "Maskulin, weicher Stamm", it: "Maschile, tema molle", pl: "Rodzaj męski, temat miękki", tr: "Eril, yumuşak gövde", id: "Maskulin, batang lunak", vi: "Giống đực, thân từ mềm" }, nom: { alternatives: [Ю́рій, Васи́ль, учи́тель] }, voc: { alternatives: [["Ю́рі", { ending: ю }], ["Васи́л", { ending: ю }], ["учи́тел", { ending: ю }]] } }
          - { level: A1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на -а", en: "Feminine in -а", es: "Femenino en -а", pt: "Feminino em -а", fr: "Féminin en -а", de: "Feminin auf -а", it: "Femminile in -а", pl: "Rodzaj żeński na -а", tr: "-а ile biten dişil", id: "Feminin berakhiran -а", vi: "Giống cái tận cùng -а" }, nom: { alternatives: [Оле́на, ма́ма, ді́вчина] }, voc: { alternatives: [["Оле́н", { ending: о }], ["ма́м", { ending: о }], ["ді́вчин", { ending: о }]] } }
          - { level: A1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на -я", en: "Feminine in -я", es: "Femenino en -я", pt: "Feminino em -я", fr: "Féminin en -я", de: "Feminin auf -я", it: "Femminile in -я", pl: "Rodzaj żeński na -я", tr: "-я ile biten dişil", id: "Feminin berakhiran -я", vi: "Giống cái tận cùng -я" }, nom: { alternatives: [Га́ля, бабу́ся] }, voc: { alternatives: [["Га́л", { ending: ю }], ["бабу́с", { ending: ю }]] } }
          - { level: A1, features: { gender: fem, number: sg }, group: { uk: "Жіночий рід на -ія", en: "Feminine in -ія", es: "Femenino en -ія", pt: "Feminino em -ія", fr: "Féminin en -ія", de: "Feminin auf -ія", it: "Femminile in -ія", pl: "Rodzaj żeński na -ія", tr: "-ія ile biten dişil", id: "Feminin berakhiran -ія", vi: "Giống cái tận cùng -ія" }, nom: { alternatives: [Наді́я, Марі́я] }, voc: { alternatives: [["Наді́", { ending: є }], ["Марі́", { ending: є }]] } }
          - { level: A2, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -у", en: "Masculine in -у", es: "Masculino en -у", pt: "Masculino em -у", fr: "Masculin en -у", de: "Maskulin auf -у", it: "Maschile in -у", pl: "Rodzaj męski na -у", tr: "-у ile biten eril", id: "Maskulin berakhiran -у", vi: "Giống đực tận cùng -у" }, nom: { alternatives: [син, ба́тько] }, voc: { alternatives: [["си́н", { ending: у }], ["ба́тьк", { ending: у }]] } }
          - { level: A2, features: { gender: fem, number: sg }, group: { uk: "Пестливі імена на -ка", en: "Pet names in -ка", es: "Diminutivos en -ка", pt: "Diminutivos em -ка", fr: "Diminutifs en -ка", de: "Koseformen auf -ка", it: "Diminutivi in -ка", pl: "Zdrobnienia na -ка", tr: "-ка ile biten küçültme adları", id: "Nama panggilan sayang berakhiran -ка", vi: "Tên gọi thân mật tận cùng -ка" }, nom: { alternatives: [Оле́нка, Ната́лка] }, voc: { alternatives: [["Оле́нк", { ending: о }], ["Ната́лк", { ending: о }]] } }
          - { level: B1, features: { gender: masc, number: sg }, group: { uk: "Чергування г, к", en: "г, к alternate", es: "Alternancia de г, к", pt: "Alternância de г, к", fr: "Alternance de г, к", de: "Wechsel von г, к", it: "Alternanza di г, к", pl: "Oboczność г, к", tr: "г, к değişimi", id: "Alternasi г, к", vi: "Biến đổi г, к" }, nom: { alternatives: [друг, коза́к] }, voc: { alternatives: [["дру́", { letter: ж }, { ending: е }], ["коза́", { letter: ч }, { ending: е }]] } }
          - { level: B1, features: { gender: masc, number: sg }, group: { uk: "Чоловічий рід на -ар", en: "Masculine in -ар", es: "Masculino en -ар", pt: "Masculino em -ар", fr: "Masculin en -ар", de: "Maskulin auf -ар", it: "Maschile in -ар", pl: "Rodzaj męski na -ар", tr: "-ар ile biten eril", id: "Maskulin berakhiran -ар", vi: "Giống đực tận cùng -ар" }, nom: { alternatives: [ку́хар, лі́кар] }, voc: { alternatives: [["ку́хар", { ending: ю }], ["лі́кар", { ending: ю }]] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["З титулом ", { term: пан }, " обидва слова стоять у кличному; ", { term: па́ні }, " не змінюється:"]
              en: ["With the title ", { term: пан }, ", both words are vocative; ", { term: па́ні }, " never changes:"]
              es: ["Con el título ", { term: пан }, ", las dos palabras van en vocativo; ", { term: па́ні }, " no cambia:"]
              pt: ["Com o título ", { term: пан }, ", as duas palavras ficam no vocativo; ", { term: па́ні }, " não muda:"]
              fr: ["Avec le titre ", { term: пан }, ", les deux mots sont au vocatif ; ", { term: па́ні }, " ne change pas :"]
              de: ["Mit dem Titel ", { term: пан }, " stehen beide Wörter im Vokativ; ", { term: па́ні }, " bleibt unverändert:"]
              it: ["Con il titolo ", { term: пан }, ", le due parole vanno al vocativo; ", { term: па́ні }, " non cambia:"]
              pl: ["Z tytułem ", { term: пан }, " oba wyrazy stoją w wołaczu; ", { term: па́ні }, " nie zmienia się:"]
              tr: ["Unvan ", { term: пан }, " ile iki sözcük de seslenme hâlinde olur; ", { term: па́ні }, " değişmez:"]
              id: ["Dengan gelar ", { term: пан }, ", kedua kata memakai vokatif; ", { term: па́ні }, " tidak berubah:"]
              vi: ["Với danh xưng ", { term: пан }, ", cả hai từ đều ở hô cách; ", { term: па́ні }, " không đổi:"]
            ex: { examples: [{ target: Па́не Іва́не }, ["па́ні ", { target: Оле́но }]] }
            tr: { en: { examples: ["Mr Ivan", "Ms Olena"] }, es: { examples: ["señor Ivan", "señora Olena"] }, pt: { examples: ["senhor Ivan", "senhora Olena"] }, fr: { examples: ["monsieur Ivan", "madame Olena"] }, de: { examples: ["Herr Ivan", "Frau Olena"] }, it: { examples: ["signor Ivan", "signora Olena"] }, pl: { examples: ["pan Ivan", "pani Olena"] }, tr: { examples: ["Ivan Bey", "Olena Hanım"] }, id: { examples: ["Pak Ivan", "Bu Olena"] }, vi: { examples: ["ông Ivan", "bà Olena"] } }
          - type: note
            level: B1
            text:
              uk: "У множині звертаються формою називного:"
              en: "In the plural, the nominative form addresses people:"
              es: "En plural se usa la forma del nominativo:"
              pt: "No plural, usa-se a forma do nominativo para se dirigir às pessoas:"
              fr: "Au pluriel, on s’adresse aux gens avec la forme du nominatif :"
              de: "Im Plural spricht man Personen mit der Form des Nominativs an:"
              it: "Al plurale ci si rivolge alle persone con la forma del nominativo:"
              pl: "W liczbie mnogiej zwraca się do ludzi formą mianownika:"
              tr: "Çoğulda kişilere yalın hâl biçimiyle seslenilir:"
              id: "Dalam jamak, orang disapa dengan bentuk nominatif:"
              vi: "Ở số nhiều, người ta gọi bằng dạng danh cách:"
            ex: [{ target: Дру́зі }, ", дя́кую вам!"]
            tr: { en: "Thank you, friends!", es: "¡Gracias, amigos!", pt: "Obrigado, amigos!", fr: "Merci, mes amis !", de: "Danke, Freunde!", it: "Grazie, amici!", pl: "Dziękuję wam, przyjaciele!", tr: "Teşekkürler, arkadaşlar!", id: "Terima kasih, teman-teman!", vi: "Cảm ơn các bạn!" }

  - title: { uk: Вживання, en: Use, es: Uso, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A1
            use: { uk: "прохання до незнайомої людини", en: "asking a stranger", es: "pedir algo a un desconocido", pt: "pedir algo a um desconhecido", fr: "demander quelque chose à un inconnu", de: "einen Fremden um etwas bitten", it: "chiedere qualcosa a uno sconosciuto", pl: "prośba do nieznajomego", tr: "bir yabancıdan bir şey rica etmek", id: "meminta sesuatu kepada orang asing", vi: "nhờ người lạ" }
            ex: [{ target: Ді́вчино }, ", напиші́ть тут адре́су, будь ла́ска."]
            tr: { en: "Miss, please write your address here.", es: "Señorita, escriba aquí su dirección, por favor.", pt: "Senhorita, escreva seu endereço aqui, por favor.", fr: "Mademoiselle, écrivez votre adresse ici, s’il vous plaît.", de: "Verzeihung, schreiben Sie hier bitte Ihre Adresse auf.", it: "Signorina, scriva qui il suo indirizzo, per favore.", pl: "Przepraszam panią, proszę tu napisać adres.", tr: "Hanımefendi, lütfen adresinizi buraya yazın.", id: "Mbak, tolong tulis alamat Anda di sini.", vi: "Cô ơi, xin hãy viết địa chỉ ở đây." }
          - level: A1
            use: { uk: "ввічливе звертання", en: "a polite address", es: "un trato cortés", pt: "um tratamento cortês", fr: "une formule de politesse", de: "eine höfliche Anrede", it: "un appellativo cortese", pl: "grzeczna forma zwracania się", tr: "nazik hitap", id: "sapaan sopan", vi: "cách gọi lịch sự" }
            ex: [{ target: Па́ні }, ", скажі́ть, будь ла́ска, де вокза́л?"]
            tr: { en: "Excuse me, madam, where's the station?", es: "Perdone, señora, ¿dónde está la estación?", pt: "Com licença, senhora, onde fica a estação?", fr: "Excusez-moi, madame, où est la gare ?", de: "Entschuldigen Sie, meine Dame, wo ist der Bahnhof?", it: "Scusi, signora, dov’è la stazione?", pl: "Przepraszam panią, gdzie jest dworzec?", tr: "Affedersiniz hanımefendi, istasyon nerede?", id: "Permisi, Bu, stasiun di mana?", vi: "Xin lỗi bà, ga ở đâu ạ?" }
          - level: A2
            use: { uk: "звертання до рідних", en: "speaking to family", es: "hablar con la familia", pt: "falar com a família", fr: "parler à la famille", de: "mit der Familie sprechen", it: "parlare ai familiari", pl: "mówienie do rodziny", tr: "aileyle konuşmak", id: "berbicara dengan keluarga", vi: "nói với người thân" }
            ex: [{ target: Бабу́сю }, ", сіда́йте, будь ла́ска."]
            tr: { en: "Grandma, please sit down.", es: "Abuela, siéntese, por favor.", pt: "Vovó, sente-se, por favor.", fr: "Mamie, assieds-toi, s’il te plaît.", de: "Oma, setz dich bitte.", it: "Nonna, siediti, per favore.", pl: "Babciu, proszę usiąść.", tr: "Babaanne, lütfen otur.", id: "Nenek, silakan duduk.", vi: "Bà ơi, mời bà ngồi ạ." }
          - level: A2
            use: { uk: "побажання", en: "a wish", es: "un deseo", pt: "um desejo", fr: "un souhait", de: "ein Wunsch", it: "un augurio", pl: "życzenie", tr: "dilek", id: "harapan", vi: "lời chúc" }
            ex: [{ target: Оле́нко }, ", будь щасли́вою!"]
            tr: { en: "Olenka, be happy!", es: "¡Olenka, sé feliz!", pt: "Olenka, seja feliz!", fr: "Olenka, sois heureuse !", de: "Olenka, sei glücklich!", it: "Olenka, sii felice!", pl: "Olenka, bądź szczęśliwa!", tr: "Olenka, mutlu ol!", id: "Olenka, berbahagialah!", vi: "Olenka ơi, hãy hạnh phúc nhé!" }
          - level: B1
            use: { uk: "звертання до групи людей", en: "speaking to a group", es: "hablar a un grupo", pt: "falar com um grupo", fr: "s’adresser à un groupe", de: "eine Gruppe ansprechen", it: "rivolgersi a un gruppo", pl: "zwracanie się do grupy", tr: "bir gruba seslenmek", id: "menyapa sekelompok orang", vi: "nói với một nhóm người" }
            ex: [{ target: Шано́вні пасажи́ри }, ", зберіга́йте спо́кій."]
            tr: { en: "Dear passengers, please stay calm.", es: "Estimados pasajeros, mantengan la calma.", pt: "Prezados passageiros, mantenham a calma.", fr: "Chers passagers, restez calmes, s’il vous plaît.", de: "Liebe Fahrgäste, bitte bewahren Sie Ruhe.", it: "Cari passeggeri, mantenete la calma.", pl: "Szanowni pasażerowie, prosimy zachować spokój.", tr: "Sayın yolcularımız, lütfen sakin olun.", id: "Para penumpang yang terhormat, harap tetap tenang.", vi: "Kính thưa quý hành khách, xin hãy giữ bình tĩnh." }
          - level: B1
            use: { uk: "звертання за професією", en: "addressing someone by their job", es: "dirigirse a alguien por su profesión", pt: "chamar alguém pela profissão", fr: "s’adresser à quelqu’un par son métier", de: "jemanden mit seinem Beruf ansprechen", it: "rivolgersi a qualcuno con la sua professione", pl: "zwracanie się do kogoś według zawodu", tr: "birine mesleğiyle seslenmek", id: "menyapa seseorang dengan profesinya", vi: "gọi ai đó theo nghề nghiệp" }
            ex: [{ target: Па́не ку́харю }, ", яки́й смачни́й пирі́г!"]
            tr: { en: "Chef, what a tasty pie!", es: "¡Señor cocinero, qué pastel tan rico!", pt: "Senhor cozinheiro, que torta saborosa!", fr: "Monsieur le cuisinier, quelle bonne tourte !", de: "Herr Koch, was für ein leckerer Kuchen!", it: "Signor cuoco, che buona torta!", pl: "Panie kucharzu, jakie pyszne ciasto!", tr: "Aşçıbaşı, ne lezzetli bir turta!", id: "Pak Koki, pai ini enak sekali!", vi: "Bác đầu bếp ơi, cái bánh này ngon quá!" }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos, pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
