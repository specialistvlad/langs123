  - title: { uk: М’який знак, en: The soft sign, es: El signo blando, pt: "O sinal suave", fr: "Le signe mou", de: "Das Weichheitszeichen", it: "Il segno molle", pl: "Znak miękki", tr: "Yumuşatma işareti", id: "Tanda lunak", vi: "Dấu mềm" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: [{ letter: ь }, " не має звука: він показує, що приголосна перед ним м’яка."]
              en: [{ letter: ь }, " has no sound: it shows that the consonant before it is soft."]
              es: [{ letter: ь }, " no tiene sonido: indica que la consonante anterior es blanda."]
              pt: [{ letter: ь }, " não tem som: mostra que a consoante anterior é suave."]
              fr: [{ letter: ь }, " n’a pas de son : il indique que la consonne qui précède est molle."]
              de: [{ letter: ь }, " hat keinen Laut: Es zeigt, dass der Konsonant davor weich ist."]
              it: [{ letter: ь }, " non ha suono: indica che la consonante precedente è molle."]
              pl: [{ letter: ь }, " nie ma dźwięku: pokazuje, że poprzedzająca spółgłoska jest miękka."]
              tr: [{ letter: ь }, " işaretinin sesi yoktur: önündeki ünsüzün yumuşak olduğunu gösterir."]
              id: [{ letter: ь }, " tidak berbunyi: tanda ini menunjukkan bahwa konsonan di depannya lunak."]
              vi: [{ letter: ь }, " không có âm: nó cho biết phụ âm đứng trước là phụ âm mềm."]
