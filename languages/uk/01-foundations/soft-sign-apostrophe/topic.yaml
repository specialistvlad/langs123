  - title: { uk: Апостроф, en: The apostrophe, es: El apóstrofo, pt: "O apóstrofo", fr: "L’apostrophe", de: "Der Apostroph", it: "L'apostrofo", pl: "Apostrof", tr: "Kesme işareti", id: "Apostrof", vi: "Dấu lược" }
