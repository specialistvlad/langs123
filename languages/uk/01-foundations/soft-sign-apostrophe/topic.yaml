            tr: { en: { examples: [today, only] }, es: { examples: [hoy, solo] }, pt: { examples: ["hoje", "só"] }, fr: { examples: ["aujourd’hui", "seulement"] }, de: { examples: ["heute", "nur"] }, it: { examples: ["oggi", "solo"] }, pl: { examples: ["dzisiaj", "tylko"] }, tr: { examples: ["bugün", "sadece"] }, id: { examples: ["hari ini", "hanya"] }, vi: { examples: ["hôm nay", "chỉ"] } }
          - type: rule
            level: A1
            text:
              uk: ["Після ", { letter: "ж, ч, ш, щ" }, ", після ", { letter: "б, п, в, м, ф" }, " і після ", { letter: р }, " у кінці слова ", { letter: ь }, " не пишуть:"]
              en: ["After ", { letter: "ж, ч, ш, щ" }, ", after ", { letter: "б, п, в, м, ф" }, ", and after ", { letter: р }, " at the end of a word, there is no ", { letter: ь }, ":"]
              es: ["Tras ", { letter: "ж, ч, ш, щ" }, ", tras ", { letter: "б, п, в, м, ф" }, " y tras ", { letter: р }, " a final de palabra no se escribe ", { letter: ь }, ":"]
              pt: ["Depois de ", { letter: "ж, ч, ш, щ" }, ", de ", { letter: "б, п, в, м, ф" }, " e de ", { letter: р }, " no fim da palavra, não se escreve ", { letter: ь }, ":"]
              fr: ["Après ", { letter: "ж, ч, ш, щ" }, ", après ", { letter: "б, п, в, м, ф" }, " et après ", { letter: р }, " en fin de mot, on n’écrit pas ", { letter: ь }, " :"]
              de: ["Nach ", { letter: "ж, ч, ш, щ" }, ", nach ", { letter: "б, п, в, м, ф" }, " und nach ", { letter: р }, " am Wortende steht kein ", { letter: ь }, ":"]
