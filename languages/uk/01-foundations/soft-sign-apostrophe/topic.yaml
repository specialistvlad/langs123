title: { uk: М’який знак і апостроф, en: Soft Sign and Apostrophe, es: El signo blando y el apóstrofo, pt: "Sinal suave e apóstrofo", fr: "Le signe mou et l’apostrophe", de: "Weichheitszeichen und Apostroph", it: "Segno molle e apostrofo", pl: "Znak miękki i apostrof", tr: "Yumuşatma işareti ve kesme işareti", id: "Tanda lunak dan apostrof", vi: "Dấu mềm và dấu lược" }
summary:
  lead:
    uk: "М’який знак пом’якшує приголосну перед собою, а апостроф показує, що я, ю, є, ї після приголосної звучать із й."
    en: "The soft sign softens the consonant before it; the apostrophe shows that я, ю, є, ї after a consonant are said with a й sound."
    es: "El signo blando ablanda la consonante anterior; el apóstrofo indica que я, ю, є, ї tras consonante se dicen con el sonido de й."
    pt: "O sinal suave suaviza a consoante anterior; o apóstrofo mostra que я, ю, є, ї depois de consoante se pronunciam com o som de й."
    fr: "Le signe mou rend molle la consonne qui précède ; l’apostrophe indique que я, ю, є, ї après une consonne se prononcent avec le son й."
    de: "Das Weichheitszeichen macht den Konsonanten davor weich; der Apostroph zeigt, dass я, ю, є, ї nach Konsonant mit dem Laut й gesprochen werden."
    it: "Il segno molle ammorbidisce la consonante che precede; l'apostrofo indica che я, ю, є, ї dopo una consonante si pronunciano con il suono й."
    pl: "Znak miękki zmiękcza poprzedzającą spółgłoskę, a apostrof pokazuje, że я, ю, є, ї po spółgłosce wymawia się z dźwiękiem й."
    tr: "Yumuşatma işareti önündeki ünsüzü yumuşatır; kesme işareti, ünsüzden sonra gelen я, ю, є, ї harflerinin й sesiyle okunduğunu gösterir."
    id: "Tanda lunak melunakkan konsonan di depannya; apostrof menunjukkan bahwa я, ю, є, ї setelah konsonan diucapkan dengan bunyi й."
    vi: "Dấu mềm làm mềm phụ âm đứng trước nó; dấu lược cho biết я, ю, є, ї sau phụ âm được đọc với âm й."
  rule:
    uk: ["Після ", { letter: "б, п, в, м, ф" }, " перед ", { letter: "я, ю, є, ї" }, " пишуть апостроф:"]
    en: ["After ", { letter: "б, п, в, м, ф" }, " and before ", { letter: "я, ю, є, ї" }, ", write an apostrophe:"]
    es: ["Tras ", { letter: "б, п, в, м, ф" }, " y ante ", { letter: "я, ю, є, ї" }, " se escribe apóstrofo:"]
    pt: ["Depois de ", { letter: "б, п, в, м, ф" }, " e antes de ", { letter: "я, ю, є, ї" }, ", escreve-se apóstrofo:"]
    fr: ["Après ", { letter: "б, п, в, м, ф" }, " et devant ", { letter: "я, ю, є, ї" }, ", on écrit une apostrophe :"]
    de: ["Nach ", { letter: "б, п, в, м, ф" }, " und vor ", { letter: "я, ю, є, ї" }, " schreibt man einen Apostroph:"]
    it: ["Dopo ", { letter: "б, п, в, м, ф" }, " e prima di ", { letter: "я, ю, є, ї" }, " si scrive l'apostrofo:"]
    pl: ["Po ", { letter: "б, п, в, м, ф" }, " i przed ", { letter: "я, ю, є, ї" }, " pisze się apostrof:"]
    tr: ["Kesme işareti, ", { letter: "б, п, в, м, ф" }, " harflerinden sonra ve ", { letter: "я, ю, є, ї" }, " harflerinden önce yazılır:"]
    id: ["Setelah ", { letter: "б, п, в, м, ф" }, " dan sebelum ", { letter: "я, ю, є, ї" }, ", tulis apostrof:"]
    vi: ["Sau ", { letter: "б, п, в, м, ф" }, " và trước ", { letter: "я, ю, є, ї" }, ", viết dấu lược:"]
  ex: { examples: [["п", { target: ’ }, "ять"], ["м", { target: ’ }, "яч"]] }

