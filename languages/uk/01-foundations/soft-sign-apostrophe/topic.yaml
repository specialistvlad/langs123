id: uk.foundations.soft-sign-apostrophe
lang: uk
kind: foundations
tags: [soft sign, apostrophe, spelling, pronunciation]
concepts: [pronunciation]
related: [uk.foundations.alphabet-handwriting, uk.foundations.vowels-consonants, uk.foundations.numbers]
status: { uk: draft, en: draft, es: draft }
translated: { en: "448484 0fdcc7 cd3952 c544bc de2dd6", es: "448484 0fdcc7 cd3952 c544bc de2dd6" }

title: { uk: М’який знак і апостроф, en: Soft Sign and Apostrophe, es: El signo blando y el apóstrofo }
summary:
  lead:
    uk: "М’який знак пом’якшує приголосну перед собою, а апостроф показує, що я, ю, є, ї після приголосної звучать із й."
    en: "The soft sign softens the consonant before it; the apostrophe shows that я, ю, є, ї after a consonant are said with a й sound."
    es: "El signo blando ablanda la consonante anterior; el apóstrofo indica que я, ю, є, ї tras consonante se dicen con el sonido de й."
  rule:
    uk: ["Після ", { letter: "б, п, в, м, ф" }, " перед ", { letter: "я, ю, є, ї" }, " пишуть апостроф:"]
    en: ["After ", { letter: "б, п, в, м, ф" }, " and before ", { letter: "я, ю, є, ї" }, ", write an apostrophe:"]
    es: ["Tras ", { letter: "б, п, в, м, ф" }, " y ante ", { letter: "я, ю, є, ї" }, " se escribe apóstrofo:"]
  ex: { examples: [["п", { target: ’ }, "ять"], ["м", { target: ’ }, "яч"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { uk: Ь, en: Ь, es: Ь }
          rule:
            uk: "звука не має: робить приголосну перед собою м’якою"
            en: "has no sound: it makes the consonant before it soft"
            es: "no tiene sonido: vuelve blanda la consonante anterior"
          ex: { examples: [["сіл", { target: ь }], ["ден", { target: ь }]] }
          tr: { en: { examples: [salt, day] }, es: { examples: [sal, día] } }
        - level: A0
          point: { uk: Апостроф, en: Apostrophe, es: Apóstrofo }
          rule:
            uk: [{ letter: я }, " після апострофа звучить як ", { ipa: ja }]
            en: [{ letter: я }, " after an apostrophe sounds ", { ipa: ja }]
            es: [{ letter: я }, " tras apóstrofo suena ", { ipa: ja }]
          ex: ["м", { target: ’ }, "яч"]
          tr: { en: ball, es: pelota }
        - level: A1
          point: { uk: Ь у кінці слова, en: Ь at the end of a word, es: Ь a final de palabra }
          rule:
            uk: ["після м’яких ", { letter: "д, т, з, с, ц, л, н" }]
            en: ["after soft ", { letter: "д, т, з, с, ц, л, н" }]
            es: ["tras ", { letter: "д, т, з, с, ц, л, н" }, " blandas"]
          ex: { examples: [["ти́жден", { target: ь }], ["па́лец", { target: ь }]] }
          tr: { en: { examples: [week, finger] }, es: { examples: [semana, dedo] } }
        - level: A1
          point: { uk: Ь у середині слова, en: Ь inside a word, es: Ь dentro de la palabra }
          rule:
            uk: ["перед приголосною і перед ", { letter: о }]
            en: ["before a consonant and before ", { letter: о }]
            es: ["ante consonante y ante ", { letter: о }]
          ex: { examples: [["Л", { target: ь }, "вів"], ["с", { target: ь }, "ого́дні"]] }
          tr: { en: { examples: [Lviv, today] }, es: { examples: [Lviv, hoy] } }
        - level: A1
          point: { uk: Апостроф після губних, en: Apostrophe after lip sounds, es: Apóstrofo tras labiales }
          rule:
            uk: [{ letter: "б, п, в, м, ф" }, " перед ", { letter: "я, ю, є, ї" }]
            en: [{ letter: "б, п, в, м, ф" }, " before ", { letter: "я, ю, є, ї" }]
            es: [{ letter: "б, п, в, м, ф" }, " ante ", { letter: "я, ю, є, ї" }]
          ex: { examples: [["сім", { target: ’ }, "я́"], ["де́в", { target: ’ }, "ять"]] }
          tr: { en: { examples: [family, nine] }, es: { examples: [familia, nueve] } }
        - level: A1
          point: { uk: Апостроф після р, en: Apostrophe after р, es: Apóstrofo tras р }
          rule:
            uk: [{ letter: р }, " у кінці складу перед ", { letter: "я, ю, є, ї" }]
            en: [{ letter: р }, " at the end of a syllable, before ", { letter: "я, ю, є, ї" }]
            es: [{ letter: р }, " a final de sílaba, ante ", { letter: "я, ю, є, ї" }]
          ex: ["подві́р", { target: ’ }, "я"]
          tr: { en: courtyard, es: patio }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["після ", { letter: "ж, ч, ш, щ" }, " ", { letter: ь }, " не пишуть"]
            en: ["no ", { letter: ь }, " after ", { letter: "ж, ч, ш, щ" }]
            es: ["tras ", { letter: "ж, ч, ш, щ" }, " no se escribe ", { letter: ь }]
          ex: { examples: [{ target: ніч }, { target: річ }] }
          tr: { en: { examples: [night, thing] }, es: { examples: [noche, cosa] } }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["після ", { letter: р }, " у кінці слова ", { letter: ь }, " не пишуть"]
            en: ["no ", { letter: ь }, " after ", { letter: р }, " at the end of a word"]
            es: ["tras ", { letter: р }, " a final de palabra no se escribe ", { letter: ь }]
          ex: { examples: [{ target: лі́кар }, { target: секрета́р }] }
          tr: { en: { examples: [doctor, secretary] }, es: { examples: [médico, secretario] } }
        - level: B1
          point: { uk: Апостроф після префікса, en: Apostrophe after a prefix, es: Apóstrofo tras un prefijo }
          rule:
            uk: ["префікс на приголосну перед ", { letter: "я, ю, є, ї" }]
            en: ["a prefix ending in a consonant, before ", { letter: "я, ю, є, ї" }]
            es: ["prefijo acabado en consonante, ante ", { letter: "я, ю, є, ї" }]
          ex: { examples: [["з", { target: ’ }, "ї́сти"], ["під", { target: ’ }, "ї́зд"]] }
          tr: { en: { examples: [eat up, entrance] }, es: { examples: [comerse, portal] } }

sections:
  - title: { uk: М’який знак, en: The soft sign, es: El signo blando }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: [{ letter: ь }, " не має звука: він показує, що приголосна перед ним м’яка."]
              en: [{ letter: ь }, " has no sound: it shows that the consonant before it is soft."]
              es: [{ letter: ь }, " no tiene sonido: indica que la consonante anterior es blanda."]
      - type: usage
        columns:
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
          - { key: said, label: { uk: Вимова, en: Pronunciation, es: Pronunciación } }
        rows:
          - { level: A0, word: { target: сіль }, said: [{ ipa: sʲilʲ }, " ", { sound: sil }], tr: { en: salt, es: sal } }
          - { level: A0, word: { target: день }, said: [{ ipa: dɛnʲ }, " ", { sound: den }], tr: { en: day, es: día } }
          - { level: A0, word: { target: Львів }, said: [{ ipa: lʲʋiu̯ }, " ", { sound: Lviv }], tr: { en: Lviv, es: Lviv } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["У кінці слова ", { letter: ь }, " пишуть після м’яких ", { letter: "д, т, з, с, ц, л, н" }, ":"]
              en: ["At the end of a word, ", { letter: ь }, " follows soft ", { letter: "д, т, з, с, ц, л, н" }, ":"]
              es: ["A final de palabra, ", { letter: ь }, " va tras ", { letter: "д, т, з, с, ц, л, н" }, " blandas:"]
            ex: { examples: [["ти́жден", { target: ь }], ["па́лец", { target: ь }], ["сіл", { target: ь }]] }
            tr: { en: { examples: [week, finger, salt] }, es: { examples: [semana, dedo, sal] } }
          - type: rule
            level: A1
            text:
              uk: ["У середині слова ", { letter: ь }, " пишуть перед ", { letter: о }, " і між м’якою та іншою приголосною:"]
              en: ["Inside a word, ", { letter: ь }, " goes before ", { letter: о }, " and between a soft consonant and another consonant:"]
              es: ["Dentro de la palabra, ", { letter: ь }, " va ante ", { letter: о }, " y entre una consonante blanda y otra consonante:"]
            ex: { examples: [["с", { target: ь }, "ого́дні"], ["ті́л", { target: ь }, "ки"]] }
            tr: { en: { examples: [today, only] }, es: { examples: [hoy, solo] } }
          - type: rule
            level: A1
            text:
              uk: ["Після ", { letter: "ж, ч, ш, щ" }, ", після ", { letter: "б, п, в, м, ф" }, " і після ", { letter: р }, " у кінці слова ", { letter: ь }, " не пишуть:"]
              en: ["After ", { letter: "ж, ч, ш, щ" }, ", after ", { letter: "б, п, в, м, ф" }, ", and after ", { letter: р }, " at the end of a word, there is no ", { letter: ь }, ":"]
              es: ["Tras ", { letter: "ж, ч, ш, щ" }, ", tras ", { letter: "б, п, в, м, ф" }, " y tras ", { letter: р }, " a final de palabra no se escribe ", { letter: ь }, ":"]
            ex: { examples: [{ target: ніч }, { target: голу́б }, { target: лі́кар }] }
            tr: { en: { examples: [night, dove, doctor] }, es: { examples: [noche, paloma, médico] } }

  - title: { uk: Апостроф, en: The apostrophe, es: El apóstrofo }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: ["Апостроф ", { letter: ’ }, " — не літера, а знак. Після нього ", { letter: "я, ю, є, ї" }, " звучать із ", { ipa: j }, ", а приголосна перед ним тверда."]
              en: ["The apostrophe ", { letter: ’ }, " is a sign, not a letter. After it, ", { letter: "я, ю, є, ї" }, " are said with ", { ipa: j }, ", and the consonant before it stays hard."]
              es: ["El apóstrofo ", { letter: ’ }, " es un signo, no una letra. Tras él, ", { letter: "я, ю, є, ї" }, " se dicen con ", { ipa: j }, ", y la consonante anterior sigue dura."]
      - type: usage
        columns:
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
          - { key: said, label: { uk: Вимова, en: Pronunciation, es: Pronunciación } }
        rows:
          - { level: A0, word: ["м", { target: ’ }, "яч"], said: [{ ipa: mjat͡ʃ }, " ", { sound: miach }], tr: { en: ball, es: pelota } }
          - { level: A0, word: ["п", { target: ’ }, "ять"], said: [{ ipa: pjatʲ }, " ", { sound: piat }], tr: { en: five, es: cinco } }
          - { level: A0, word: ["сім", { target: ’ }, "я́"], said: [{ ipa: sʲimˈja }, " ", { sound: simia }], tr: { en: family, es: familia } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Апостроф пишуть після ", { letter: "б, п, в, м, ф" }, " перед ", { letter: "я, ю, є, ї" }, ":"]
              en: ["Write an apostrophe after ", { letter: "б, п, в, м, ф" }, " before ", { letter: "я, ю, є, ї" }, ":"]
              es: ["Se escribe apóstrofo tras ", { letter: "б, п, в, м, ф" }, " ante ", { letter: "я, ю, є, ї" }, ":"]
            ex: { examples: [["де́в", { target: ’ }, "ять"], ["м", { target: ’ }, "я́со"], ["ім", { target: ’ }, "я́"]] }
            tr: { en: { examples: [nine, meat, name] }, es: { examples: [nueve, carne, nombre] } }
          - type: rule
            level: A1
            text:
              uk: ["Апостроф пишуть після ", { letter: р }, " у кінці складу перед ", { letter: "я, ю, є, ї" }, ":"]
              en: ["Write an apostrophe after ", { letter: р }, " at the end of a syllable, before ", { letter: "я, ю, є, ї" }, ":"]
              es: ["Se escribe apóstrofo tras ", { letter: р }, " a final de sílaba, ante ", { letter: "я, ю, є, ї" }, ":"]
            ex: { examples: [["подві́р", { target: ’ }, "я"], ["пі́р", { target: ’ }, "я"]] }
            tr: { en: { examples: [courtyard, feathers] }, es: { examples: [patio, plumas] } }
          - type: rule
            level: A1
            text:
              uk: "Без апострофа пишуть, коли перед губною стоїть інша приголосна того самого кореня:"
              en: "There is no apostrophe when another consonant of the same root comes before the lip sound:"
              es: "No hay apóstrofo cuando otra consonante de la misma raíz va delante de la labial:"
            ex: { examples: [{ target: свя́то }, { target: цвях }] }
            tr: { en: { examples: [holiday, nail] }, es: { examples: [fiesta, clavo] } }
          - type: rule
            level: B1
            text:
              uk: ["Апостроф пишуть і після префікса на приголосну перед ", { letter: "я, ю, є, ї" }, ":"]
              en: ["An apostrophe also follows a prefix that ends in a consonant, before ", { letter: "я, ю, є, ї" }, ":"]
              es: ["También se escribe apóstrofo tras un prefijo acabado en consonante, ante ", { letter: "я, ю, є, ї" }, ":"]
            ex: { examples: [["з", { target: ’ }, "ї́сти"], ["від", { target: ’ }, "ї́хати"], ["під", { target: ’ }, "ї́зд"], ["з", { target: ’ }, "яви́тися"]] }
            tr: { en: { examples: [eat up, drive away, entrance, appear] }, es: { examples: [comerse, alejarse, portal, aparecer] } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: пять, right: ["п", { target: ’ }, "ять"], rule: { uk: ["після ", { letter: п }, " перед ", { letter: я }, " пишуть апостроф"], en: ["after ", { letter: п }, " before ", { letter: я }, ", write an apostrophe"], es: ["tras ", { letter: п }, " ante ", { letter: я }, " va apóstrofo"] } }
          - { level: A1, wrong: сімья́, right: ["сім", { target: ’ }, "я́"], rule: { uk: ["після ", { letter: м }, " пишуть апостроф, не ", { letter: ь }], en: ["after ", { letter: м }, ", write an apostrophe, not ", { letter: ь }], es: ["tras ", { letter: м }, " va apóstrofo, no ", { letter: ь }] } }
          - { level: A1, wrong: нічь, right: { target: ніч }, rule: { uk: ["після ", { letter: ч }, " ", { letter: ь }, " не пишуть; ", { term: нічь }, " — під впливом російської"], en: ["no ", { letter: ь }, " after ", { letter: ч }, "; the ", { letter: ь }, " comes from Russian"], es: ["tras ", { letter: ч }, " no va ", { letter: ь }, "; la ", { letter: ь }, " viene del ruso"] } }
          - { level: A1, wrong: лі́карь, right: { target: лі́кар }, rule: { uk: ["після ", { letter: р }, " у кінці слова ", { letter: ь }, " не пишуть"], en: ["no ", { letter: ь }, " after ", { letter: р }, " at the end of a word"], es: ["tras ", { letter: р }, " a final de palabra no va ", { letter: ь }] } }
          - { level: A0, wrong: Львов, right: { target: Львів }, rule: { uk: [{ term: Львів }, " — українська назва міста"], en: [{ term: Львів }, " is the Ukrainian name of the city"], es: [{ term: Львів }, " es el nombre ucraniano de la ciudad"] } }
