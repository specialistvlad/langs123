              tr: [{ letter: "ж, ч, ш, щ" }, " ve ", { letter: "б, п, в, м, ф" }, " harflerinden sonra, bir de sözcük sonundaki ", { letter: р }, " harfinden sonra ", { letter: ь }, " yazılmaz:"]
              id: ["Setelah ", { letter: "ж, ч, ш, щ" }, ", setelah ", { letter: "б, п, в, м, ф" }, ", dan setelah ", { letter: р }, " di akhir kata, ", { letter: ь }, " tidak ditulis:"]
              vi: ["Sau ", { letter: "ж, ч, ш, щ" }, ", sau ", { letter: "б, п, в, м, ф" }, " và sau ", { letter: р }, " ở cuối từ, không viết ", { letter: ь }, ":"]
