            tr: { en: { examples: [courtyard, feathers] }, es: { examples: [patio, plumas] }, pt: { examples: ["pátio", "plumas"] }, fr: { examples: ["cour", "plumes"] }, de: { examples: ["Hof", "Federn"] }, it: { examples: ["cortile", "piume"] }, pl: { examples: ["podwórko", "pióra"] }, tr: { examples: ["avlu", "tüyler"] }, id: { examples: ["halaman", "bulu"] }, vi: { examples: ["sân", "lông vũ"] } }
