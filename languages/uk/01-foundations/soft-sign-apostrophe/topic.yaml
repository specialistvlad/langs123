            text:
              uk: ["Апостроф ", { letter: ’ }, " — не літера, а знак. Після нього ", { letter: "я, ю, є, ї" }, " звучать із ", { ipa: j }, ", а приголосна перед ним тверда."]
              en: ["The apostrophe ", { letter: ’ }, " is a sign, not a letter. After it, ", { letter: "я, ю, є, ї" }, " are said with ", { ipa: j }, ", and the consonant before it stays hard."]
              es: ["El apóstrofo ", { letter: ’ }, " es un signo, no una letra. Tras él, ", { letter: "я, ю, є, ї" }, " se dicen con ", { ipa: j }, ", y la consonante anterior sigue dura."]
              pt: ["O apóstrofo ", { letter: ’ }, " é um sinal, não uma letra. Depois dele, ", { letter: "я, ю, є, ї" }, " se pronunciam com ", { ipa: j }, ", e a consoante anterior continua dura."]
              fr: ["L’apostrophe ", { letter: ’ }, " est un signe, pas une lettre. Après elle, ", { letter: "я, ю, є, ї" }, " se prononcent avec ", { ipa: j }, ", et la consonne qui précède reste dure."]
              de: ["Der Apostroph ", { letter: ’ }, " ist ein Zeichen, kein Buchstabe. Danach werden ", { letter: "я, ю, є, ї" }, " mit ", { ipa: j }, " gesprochen, und der Konsonant davor bleibt hart."]
              it: ["L'apostrofo ", { letter: ’ }, " è un segno, non una lettera. Dopo di esso ", { letter: "я, ю, є, ї" }, " si pronunciano con ", { ipa: j }, ", e la consonante precedente resta dura."]
              pl: ["Apostrof ", { letter: ’ }, " to znak, nie litera. Po nim ", { letter: "я, ю, є, ї" }, " wymawia się z ", { ipa: j }, ", a poprzedzająca spółgłoska pozostaje twarda."]
              tr: ["Kesme işareti ", { letter: ’ }, " harf değil, işarettir. Ondan sonra ", { letter: "я, ю, є, ї" }, " harfleri ", { ipa: j }, " ile okunur ve önceki ünsüz sert kalır."]
              id: ["Apostrof ", { letter: ’ }, " adalah tanda, bukan huruf. Setelahnya, ", { letter: "я, ю, є, ї" }, " diucapkan dengan ", { ipa: j }, ", dan konsonan di depannya tetap keras."]
              vi: ["Dấu lược ", { letter: ’ }, " là một dấu, không phải chữ cái. Sau nó, ", { letter: "я, ю, є, ї" }, " được đọc với ", { ipa: j }, ", và phụ âm đứng trước vẫn cứng."]
