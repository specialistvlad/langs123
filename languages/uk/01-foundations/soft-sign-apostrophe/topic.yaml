          - { level: A0, word: ["сім", { target: ’ }, "я́"], said: [{ ipa: sʲimˈja }, " ", { sound: simia }], tr: { en: family, es: familia, pt: "família", fr: "famille", de: "Familie", it: "famiglia", pl: "rodzina", tr: "aile", id: "keluarga", vi: "gia đình" } }
