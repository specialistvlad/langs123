title: { uk: Котра година, en: Telling the Time, es: La hora, pt: "As horas", fr: "L’heure", de: "Die Uhrzeit", it: "Dire l'ora", pl: "Podawanie godziny", tr: "Saati söyleme", id: "Menyebutkan jam", vi: "Nói giờ" }
summary:
  lead:
    uk: "Котра година: години називають порядковими числами жіночого роду, хвилини — кількісними числівниками, а з о кажуть, коли щось відбувається."
    en: "Telling the time: hours are feminine ordinal numbers, minutes are cardinal numbers, and о says when something happens."
    es: "La hora: las horas son ordinales femeninos, los minutos son números cardinales, y о indica cuándo pasa algo."
    pt: "Dizer as horas: a hora é um numeral ordinal feminino, os minutos são numerais cardinais, e о indica quando algo acontece."
    fr: "Dire l’heure : l’heure est un ordinal féminin, les minutes sont des nombres cardinaux, et о indique quand quelque chose a lieu."
    de: "Die Uhrzeit: Die Stunde ist eine feminine Ordinalzahl, die Minuten sind Kardinalzahlen, und о sagt, wann etwas geschieht."
    it: "Dire l'ora: l'ora è un numero ordinale femminile, i minuti sono numeri cardinali e о dice quando succede qualcosa."
    pl: "Podawanie godziny: godzinę wyraża liczebnik porządkowy rodzaju żeńskiego, minuty — liczebniki główne, a о mówi, kiedy coś się dzieje."
    tr: "Saati söyleme: saat dişil sıra sayısıyla, dakika asıl sayıyla söylenir; о ise bir şeyin ne zaman olduğunu bildirir."
    id: "Menyebutkan jam: jam memakai bilangan tingkat feminin, menit memakai bilangan pokok, dan о menyatakan kapan sesuatu terjadi."
    vi: "Nói giờ: giờ dùng số thứ tự giống cái, phút dùng số đếm, và о cho biết khi nào một việc xảy ra."
  rule:
    uk: "Годину називають порядковим числом жіночого роду:"
    en: "The hour is a feminine ordinal number:"
    es: "La hora se dice con un ordinal femenino:"
    pt: "A hora se diz com um numeral ordinal feminino:"
    fr: "L’heure se dit avec un ordinal féminin :"
    de: "Die Stunde wird mit einer femininen Ordinalzahl genannt:"
    it: "L'ora si dice con un numero ordinale femminile:"
    pl: "Godzinę podaje się liczebnikiem porządkowym rodzaju żeńskiego:"
    tr: "Saat, dişil bir sıra sayısıyla söylenir:"
    id: "Jam disebut dengan bilangan tingkat feminin:"
    vi: "Giờ được nói bằng số thứ tự giống cái:"
  ex: { exchange: ["Котра́ годи́на?", { target: { time: Пе́рша, value: "01:00" } }] }

