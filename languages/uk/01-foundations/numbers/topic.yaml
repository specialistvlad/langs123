summary:
  lead:
    uk: "Числа від нуля до мільйона: прості слова до десяти, -надцять від 11 до 19, десятки, сотні й тисячі."
    en: "The numbers from zero to a million: single words up to ten, -надцять for 11 to 19, then tens, hundreds and thousands."
    es: "Los números del cero al millón: palabras simples hasta diez, -надцять del 11 al 19, y después decenas, centenas y miles."
    pt: "Os números de zero a um milhão: palavras simples até dez, -надцять de 11 a 19 e depois dezenas, centenas e milhares."
    fr: "Les nombres de zéro à un million : des mots simples jusqu’à dix, -надцять de 11 à 19, puis les dizaines, les centaines et les milliers."
    de: "Die Zahlen von null bis eine Million: einfache Wörter bis zehn, -надцять von 11 bis 19, danach Zehner, Hunderter und Tausender."
    it: "I numeri da zero a un milione: parole semplici fino a dieci, -надцять da 11 a 19, poi decine, centinaia e migliaia."
    pl: "Liczebniki od zera do miliona: osobne słowa do dziesięciu, -надцять od 11 do 19, potem dziesiątki, setki i tysiące."
    tr: "Sıfırdan bir milyona kadar sayılar: ona kadar tek sözcükler, 11’den 19’a -надцять, sonra onlar, yüzler ve binler."
    id: "Angka dari nol sampai satu juta: kata tunggal sampai sepuluh, -надцять untuk 11 sampai 19, lalu puluhan, ratusan, dan ribuan."
    vi: "Các số từ không đến một triệu: từ đơn đến mười, -надцять cho 11 đến 19, rồi hàng chục, hàng trăm và hàng nghìn."
  rule:
    uk: ["Від 11 до 19 числа закінчуються на ", { term: -на́дцять }, ":"]
    en: ["From 11 to 19, numbers end in ", { term: -на́дцять }, ":"]
    es: ["Del 11 al 19, los números terminan en ", { term: -на́дцять }, ":"]
    pt: ["De 11 a 19, os números terminam em ", { term: -на́дцять }, ":"]
