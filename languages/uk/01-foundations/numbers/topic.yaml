    de: ["Von 11 bis 19 enden die Zahlen auf ", { term: -на́дцять }, ":"]
    it: ["Da 11 a 19, i numeri finiscono in ", { term: -на́дцять }, ":"]
    pl: ["Od 11 do 19 liczebniki kończą się na ", { term: -на́дцять }, ":"]
    tr: ["Sayılar 11’den 19’a kadar ", { term: -на́дцять }, " ile biter:"]
    id: ["Dari 11 sampai 19, angka berakhir dengan ", { term: -на́дцять }, ":"]
