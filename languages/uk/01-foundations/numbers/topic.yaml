status: { uk: draft, en: draft, es: draft }
translated: { en: "858824 7b9f18 c19cbc 11c246 8076c5 290118 75efbb 5f3ff5", es: "858824 7b9f18 c19cbc 11c246 8076c5 290118 75efbb 5f3ff5" }

title: { uk: Числа, en: Numbers, es: Los números }
summary:
  lead:
    uk: "Числа від нуля до мільйона: прості слова до десяти, -надцять від 11 до 19, десятки, сотні й тисячі."
    en: "The numbers from zero to a million: single words up to ten, -надцять for 11 to 19, then tens, hundreds and thousands."
    es: "Los números del cero al millón: palabras simples hasta diez, -надцять del 11 al 19, y después decenas, centenas y miles."
  rule:
    uk: ["Від 11 до 19 числа закінчуються на ", { term: -на́дцять }, ":"]
    en: ["From 11 to 19, numbers end in ", { term: -на́дцять }, ":"]
    es: ["Del 11 al 19, los números terminan en ", { term: -на́дцять }, ":"]
  ex: { examples: [{ numeral: [оди, { target: на́дцять }], value: 11 }, { numeral: [дев’ят, { target: на́дцять }], value: 19 }] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { uk: "0–10", en: "0–10", es: "0–10" }
          rule:
            uk: "окремі слова"
            en: "words of their own"
            es: "palabras propias"
          ex: { examples: [{ numeral: оди́н, value: 1 }, { numeral: чоти́ри, value: 4 }, { numeral: де́сять, value: 10 }] }
          tr: { en: { examples: [one, four, ten] }, es: { examples: [uno, cuatro, diez] } }
        - level: A0
          point: { uk: "11–19", en: "11–19", es: "11–19" }
          rule:
            uk: ["число та ", { term: -на́дцять }]
            en: ["the number plus ", { term: -на́дцять }]
            es: ["el número más ", { term: -на́дцять }]
          ex: { examples: [{ numeral: [два, { target: на́дцять }], value: 12 }, { numeral: [п’ят, { target: на́дцять }], value: 15 }] }
          tr: { en: { examples: [twelve, fifteen] }, es: { examples: [doce, quince] } }
        - level: A0
          point: { uk: Десятки, en: Tens, es: Decenas }
          rule:
            uk: [{ term: -дцять }, " у 20 і 30, ", { term: -деся́т }, " у 50–80; ", { term: со́рок }, " і ", { term: дев’яно́сто }, " — окремо"]
            en: [{ term: -дцять }, " in 20 and 30, ", { term: -деся́т }, " in 50–80; ", { term: со́рок }, " and ", { term: дев’яно́сто }, " stand apart"]
            es: [{ term: -дцять }, " en 20 y 30, ", { term: -деся́т }, " en 50–80; ", { term: со́рок }, " y ", { term: дев’яно́сто }, " son aparte"]
          ex: { examples: [{ numeral: два́дцять, value: 20 }, { numeral: со́рок, value: 40 }, { numeral: п’ятдеся́т, value: 50 }] }
          tr: { en: { examples: [twenty, forty, fifty] }, es: { examples: [veinte, cuarenta, cincuenta] } }
        - level: A0
          point: { uk: Складені числа, en: Compound numbers, es: Números compuestos }
          rule:
            uk: "окремі слова, від більшого до меншого"
            en: "separate words, largest first"
            es: "palabras separadas, de la mayor a la menor"
          ex: { numeral: два́дцять оди́н, value: 21 }
          tr: { en: twenty-one, es: veintiuno }
        - level: A0
          point: { uk: Сотні, en: Hundreds, es: Centenas }
          rule:
            uk: [{ term: сто }, ", ", { term: дві́сті }, ", ", { term: три́ста }, ", ", { term: чоти́риста }, ", далі ", { term: -со́т }]
            en: [{ term: сто }, ", ", { term: дві́сті }, ", ", { term: три́ста }, ", ", { term: чоти́риста }, ", then ", { term: -со́т }]
            es: [{ term: сто }, ", ", { term: дві́сті }, ", ", { term: три́ста }, ", ", { term: чоти́риста }, " y después ", { term: -со́т }]
          ex: { examples: [{ numeral: дві́сті, value: 200 }, { numeral: п’ятсо́т, value: 500 }] }
          tr: { en: { examples: [two hundred, five hundred] }, es: { examples: [doscientos, quinientos] } }
        - level: A0
          point: { uk: Тисяча й мільйон, en: Thousand and million, es: Mil y millón }
          rule:
            uk: [{ term: ти́сяча }, ", ", { term: мільйо́н }]
            en: [{ term: ти́сяча }, ", ", { term: мільйо́н }]
            es: [{ term: ти́сяча }, ", ", { term: мільйо́н }]
          ex: { examples: [{ numeral: ти́сяча, value: 1000 }, { numeral: мільйо́н, value: 1000000 }] }
          tr: { en: { examples: [one thousand, one million] }, es: { examples: [mil, un millón] } }
        - level: A1
          point: { uk: Тисячі, en: Thousands, es: Miles }
          rule:
            uk: [{ term: дві ти́сячі }, ", але ", { term: п’ять ти́сяч }]
            en: [{ term: дві ти́сячі }, ", but ", { term: п’ять ти́сяч }]
            es: [{ term: дві ти́сячі }, ", pero ", { term: п’ять ти́сяч }]
          ex: { numeral: дві ти́сячі два́дцять шість, value: 2026 }
          tr: { en: two thousand and twenty-six, es: dos mil veintiséis }
        - level: A1
          point: { uk: Один, en: One, es: Uno }
          rule:
            uk: [{ term: оди́н }, ", ", { term: одна́ }, ", ", { term: одне́ }, " — за родом іменника"]
            en: [{ term: оди́н }, ", ", { term: одна́ }, ", ", { term: одне́ }, " follow the gender of the noun"]
            es: [{ term: оди́н }, ", ", { term: одна́ }, ", ", { term: одне́ }, " siguen el género del sustantivo"]
          ex: { examples: [[{ target: оди́н }, " стіл"], [{ target: одна́ }, " кни́жка"], [{ target: одне́ }, " вікно́"]] }
          tr: { en: { examples: [one table, one book, one window] }, es: { examples: [una mesa, un libro, una ventana] } }
        - level: A0
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["у числах 11–19 і 20, 30 пишуть ", { term: -дцять }, " з ", { letter: я }]
            en: ["11–19, 20 and 30 are written with ", { term: -дцять }, ", with ", { letter: я }]
            es: ["del 11 al 19, el 20 y el 30 se escriben con ", { term: -дцять }, ", con ", { letter: я }]
          ex: { numeral: сімна́дцять, value: 17 }
          tr: { en: seventeen, es: diecisiete }
        - level: A0
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["у сотнях і десятках ", { letter: ь }, " не пишуть"]
            en: ["no ", { letter: ь }, " inside the hundreds and tens"]
            es: ["dentro de las centenas y decenas no va ", { letter: ь }]
          ex: { examples: [{ numeral: п’ятсо́т, value: 500 }, { numeral: шістдеся́т, value: 60 }] }
          tr: { en: { examples: [five hundred, sixty] }, es: { examples: [quinientos, sesenta] } }

sections:
  - title: { uk: "Від 0 до 10", en: "0 to 10", es: "Del 0 al 10" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { uk: Число, en: Number, es: Número } }
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 0, number: "0", word: нуль, tr: { en: zero, es: cero } }
          - { level: A0, value: 1, number: "1", word: оди́н, tr: { en: one, es: uno } }
          - { level: A0, value: 2, number: "2", word: два, tr: { en: two, es: dos } }
          - { level: A0, value: 3, number: "3", word: три, tr: { en: three, es: tres } }
          - { level: A0, value: 4, number: "4", word: чоти́ри, tr: { en: four, es: cuatro } }
          - { level: A0, value: 5, number: "5", word: п’ять, tr: { en: five, es: cinco } }
          - { level: A0, value: 6, number: "6", word: шість, tr: { en: six, es: seis } }
          - { level: A0, value: 7, number: "7", word: сім, tr: { en: seven, es: siete } }
          - { level: A0, value: 8, number: "8", word: ві́сім, tr: { en: eight, es: ocho } }
          - { level: A0, value: 9, number: "9", word: де́в’ять, tr: { en: nine, es: nueve } }
          - { level: A0, value: 10, number: "10", word: де́сять, tr: { en: ten, es: diez } }

  - title: { uk: "Від 11 до 19", en: "11 to 19", es: "Del 11 al 19" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { uk: Число, en: Number, es: Número } }
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 11, number: "11", word: [оди, { ending: на́дцять }], tr: { en: eleven, es: once } }
          - { level: A0, value: 12, number: "12", word: [два, { ending: на́дцять }], tr: { en: twelve, es: doce } }
          - { level: A0, value: 13, number: "13", word: [три, { ending: на́дцять }], tr: { en: thirteen, es: trece } }
          - { level: A0, value: 14, number: "14", word: [чотир, { ending: на́дцять }], tr: { en: fourteen, es: catorce } }
          - { level: A0, value: 15, number: "15", word: [п’ят, { ending: на́дцять }], tr: { en: fifteen, es: quince } }
          - { level: A0, value: 16, number: "16", word: [шіст, { ending: на́дцять }], tr: { en: sixteen, es: dieciséis } }
          - { level: A0, value: 17, number: "17", word: [сім, { ending: на́дцять }], tr: { en: seventeen, es: diecisiete } }
          - { level: A0, value: 18, number: "18", word: [вісім, { ending: на́дцять }], tr: { en: eighteen, es: dieciocho } }
          - { level: A0, value: 19, number: "19", word: [дев’ят, { ending: на́дцять }], tr: { en: nineteen, es: diecinueve } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: ["Наголос у цих числах завжди на ", { term: -на́- }, "."]
              en: ["The stress of these numbers is always on ", { term: -на́- }, "."]
              es: ["El acento de estos números siempre va en ", { term: -на́- }, "."]
          - type: note
            level: A0
            text:
              uk: ["У 14 основа коротша: ", { term: чотир- }, "; у 15, 16 і 19 немає ", { letter: ь }, ": ", { term: п’ят- }, ", ", { term: шіст- }, ", ", { term: дев’ят- }, "."]
              en: ["In 14 the stem is shorter: ", { term: чотир- }, "; 15, 16 and 19 drop the ", { letter: ь }, ": ", { term: п’ят- }, ", ", { term: шіст- }, ", ", { term: дев’ят- }, "."]
              es: ["En el 14 la raíz es más corta: ", { term: чотир- }, "; el 15, el 16 y el 19 pierden la ", { letter: ь }, ": ", { term: п’ят- }, ", ", { term: шіст- }, ", ", { term: дев’ят- }, "."]

  - title: { uk: Десятки, en: Tens, es: Las decenas }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { uk: Число, en: Number, es: Número } }
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 20, number: "20", word: два́дцять, tr: { en: twenty, es: veinte } }
          - { level: A0, value: 30, number: "30", word: три́дцять, tr: { en: thirty, es: treinta } }
          - { level: A0, value: 40, number: "40", word: со́рок, tr: { en: forty, es: cuarenta } }
          - { level: A0, value: 50, number: "50", word: п’ятдеся́т, tr: { en: fifty, es: cincuenta } }
          - { level: A0, value: 60, number: "60", word: шістдеся́т, tr: { en: sixty, es: sesenta } }
          - { level: A0, value: 70, number: "70", word: сімдеся́т, tr: { en: seventy, es: setenta } }
          - { level: A0, value: 80, number: "80", word: вісімдеся́т, tr: { en: eighty, es: ochenta } }
          - { level: A0, value: 90, number: "90", word: дев’яно́сто, tr: { en: ninety, es: noventa } }
          - { level: A0, value: 21, number: "21", word: два́дцять оди́н, tr: { en: twenty-one, es: veintiuno } }
          - { level: A0, value: 35, number: "35", word: три́дцять п’ять, tr: { en: thirty-five, es: treinta y cinco } }
          - { level: A0, value: 99, number: "99", word: дев’яно́сто де́в’ять, tr: { en: ninety-nine, es: noventa y nueve } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Складене число — це окремі слова, від більшого до меншого, без сполучника."
              en: "A compound number is separate words, largest first, with no “and”."
              es: "Un número compuesto son palabras separadas, de la mayor a la menor, sin “y”."
            ex: { numeral: со́рок ві́сім, value: 48 }
            tr: { en: forty-eight, es: cuarenta y ocho }

  - title: { uk: "Сотні, тисячі, мільйони", en: "Hundreds, thousands, millions", es: "Centenas, miles y millones" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { uk: Число, en: Number, es: Número } }
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 100, number: "100", word: сто, tr: { en: one hundred, es: cien } }
          - { level: A0, value: 200, number: "200", word: дві́сті, tr: { en: two hundred, es: doscientos } }
          - { level: A0, value: 300, number: "300", word: три́ста, tr: { en: three hundred, es: trescientos } }
          - { level: A0, value: 400, number: "400", word: чоти́риста, tr: { en: four hundred, es: cuatrocientos } }
          - { level: A0, value: 500, number: "500", word: п’ятсо́т, tr: { en: five hundred, es: quinientos } }
          - { level: A0, value: 600, number: "600", word: шістсо́т, tr: { en: six hundred, es: seiscientos } }
          - { level: A0, value: 700, number: "700", word: сімсо́т, tr: { en: seven hundred, es: setecientos } }
          - { level: A0, value: 800, number: "800", word: вісімсо́т, tr: { en: eight hundred, es: ochocientos } }
          - { level: A0, value: 900, number: "900", word: дев’ятсо́т, tr: { en: nine hundred, es: novecientos } }
          - { level: A0, value: 1000, number: "1000", word: ти́сяча, tr: { en: one thousand, es: mil } }
          - { level: A0, value: 1000000, number: "1 000 000", word: мільйо́н, tr: { en: one million, es: un millón } }
          - { level: A1, value: 2000, number: "2000", word: дві ти́сячі, tr: { en: two thousand, es: dos mil } }
          - { level: A1, value: 5000, number: "5000", word: п’ять ти́сяч, tr: { en: five thousand, es: cinco mil } }
          - { level: A1, value: 1991, number: "1991", word: ти́сяча дев’ятсо́т дев’яно́сто оди́н, tr: { en: one thousand nine hundred and ninety-one, es: mil novecientos noventa y uno } }
          - { level: A1, value: 2026, number: "2026", word: дві ти́сячі два́дцять шість, tr: { en: two thousand and twenty-six, es: dos mil veintiséis } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Після ", { term: два }, ", ", { term: три }, ", ", { term: чоти́ри }, " — ", { term: ти́сячі }, ", після п’яти й більше — ", { term: ти́сяч }, "."]
              en: ["After ", { term: два }, ", ", { term: три }, " and ", { term: чоти́ри }, ", say ", { term: ти́сячі }, "; after five and more, ", { term: ти́сяч }, "."]
              es: ["Tras ", { term: два }, ", ", { term: три }, " y ", { term: чоти́ри }, " se dice ", { term: ти́сячі }, "; desde cinco, ", { term: ти́сяч }, "."]
          - type: note
            level: A1
            text:
              uk: "Розряди великих чисел відділяють пробілом, а дробову частину — комою: 10 000, 2,5."
              en: "Large numbers group their digits with a space, and decimals take a comma: 10 000, 2,5."
              es: "Los números grandes separan las cifras con un espacio, y los decimales llevan coma: 10 000, 2,5."

  - title: { uk: "Один, одна, одне", en: "Один, одна, одне", es: "Один, одна, одне" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: gender, label: { uk: Рід, en: Gender, es: Género } }
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
        rows:
          - { level: A1, features: { gender: masc }, gender: { uk: Чоловічий, en: Masculine, es: Masculino }, form: [{ target: оди́н }, " стіл"] }
          - { level: A1, features: { gender: fem }, gender: { uk: Жіночий, en: Feminine, es: Femenino }, form: [{ target: одна́ }, " кни́жка"] }
          - { level: A1, features: { gender: neut }, gender: { uk: Середній, en: Neuter, es: Neutro }, form: [{ target: одне́ }, " вікно́"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Число ", { term: оди́н }, " має рід, як прикметник, і стоїть у формі роду іменника:"]
              en: ["The number ", { term: оди́н }, " has gender, like an adjective, and takes the gender of its noun:"]
              es: ["El número ", { term: оди́н }, " tiene género, como un adjetivo, y toma el del sustantivo:"]
            ex: ["У ме́не ", { target: одна́ }, " сестра́."]
            tr: { en: I have one sister., es: Tengo una hermana. }
          - type: note
            level: A1
            text:
              uk: ["Іменники після 2, 5 та інших чисел: ", { link: Числівник та іменник, to: uk.numerals.numbers-with-nouns }, ". Перший, другий, третій: ", { link: Порядкові числівники, to: uk.numerals.ordinals }, "."]
              en: ["Nouns after 2, 5 and other numbers: ", { link: Numbers with Nouns, to: uk.numerals.numbers-with-nouns }, ". First, second, third: ", { link: Ordinal Numbers, to: uk.numerals.ordinals }, "."]
              es: ["Los sustantivos tras 2, 5 y otros números: ", { link: Los números con sustantivos, to: uk.numerals.numbers-with-nouns }, ". Primero, segundo, tercero: ", { link: Los ordinales, to: uk.numerals.ordinals }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: сімна́дцать, right: ["сімна́д", { target: цять }], rule: { uk: ["пишуть ", { term: -дцять }, "; ", { term: -дцать }, " — російське написання"], en: ["write ", { term: -дцять }, "; ", { term: -дцать }, " is the Russian spelling"], es: ["se escribe ", { term: -дцять }, "; ", { term: -дцать }, " es la grafía rusa"] } }
          - { level: A0, wrong: п’ятьсо́т, right: ["п’ят", { target: со́т }], rule: { uk: ["у сотнях ", { letter: ь }, " не пишуть"], en: ["the hundreds take no ", { letter: ь }], es: ["las centenas no llevan ", { letter: ь }] } }
          - { level: A0, wrong: шістьдеся́т, right: ["шіст", { target: деся́т }], rule: { uk: ["у десятках ", { letter: ь }, " не пишуть"], en: ["the tens take no ", { letter: ь }], es: ["las decenas no llevan ", { letter: ь }] } }
          - { level: A1, wrong: оди́н кни́жка, right: [{ target: одна́ }, " кни́жка"], rule: { uk: [{ term: кни́жка }, " жіночого роду: ", { term: одна́ }], en: [{ term: кни́жка }, " is feminine: ", { term: одна́ }], es: [{ term: кни́жка }, " es femenino: ", { term: одна́ }] } }
          - { level: A1, speakers: [en, es], wrong: дві ти́сяча, right: ["дві ", { target: ти́сячі }], rule: { en: ["after 2, 3, 4, ", { term: ти́сяча }, " becomes ", { term: ти́сячі }], es: ["tras 2, 3 y 4, ", { term: ти́сяча }, " pasa a ", { term: ти́сячі }] } }
