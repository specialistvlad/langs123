              en: "Large numbers group their digits with a space, and decimals take a comma: 10 000, 2,5."
              es: "Los números grandes separan las cifras con un espacio, y los decimales llevan coma: 10 000, 2,5."
              pt: "Os números grandes separam os grupos de algarismos com um espaço, e os decimais levam vírgula: 10 000, 2,5."
