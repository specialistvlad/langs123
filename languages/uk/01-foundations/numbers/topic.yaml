              id: "Angka besar dipisahkan dengan spasi tiap kelompok digit, dan desimal memakai koma: 10 000, 2,5."
              vi: "Số lớn tách các nhóm chữ số bằng dấu cách, và phần thập phân dùng dấu phẩy: 10 000, 2,5."

