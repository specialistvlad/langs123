              de: "Große Zahlen gliedert man mit einem Leerzeichen, und Dezimalstellen folgen auf ein Komma: 10 000, 2,5."
              it: "I numeri grandi separano i gruppi di cifre con uno spazio, e i decimali vogliono la virgola: 10 000, 2,5."
