              id: ["Apostrof ", { letter: ’ }, " adalah tanda, bukan huruf: ", { link: "Tanda lunak dan apostrof", to: uk.foundations.soft-sign-apostrophe }, "."]
              vi: ["Dấu lược ", { letter: ’ }, " là một dấu, không phải chữ cái: ", { link: "Dấu mềm và dấu lược", to: uk.foundations.soft-sign-apostrophe }, "."]

  - title: { uk: Друковані й рукописні літери, en: Printed and handwritten letters, es: Letras impresas y manuscritas, pt: "Letras impressas e manuscritas", fr: "Lettres imprimées et manuscrites", de: "Druckbuchstaben und Handschrift", it: "Lettere stampate e manoscritte", pl: "Litery drukowane i pisane", tr: "Basılı ve el yazısı harfler", id: "Huruf cetak dan tulisan tangan", vi: "Chữ in và chữ viết tay" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Від руки пишуть рукописні літери: вони з’єднуються в слові, і кілька з них не схожі на друковані."
              en: "Handwriting uses joined-up letters, and a few of them look unlike their printed forms."
              es: "A mano se escriben letras manuscritas, unidas en la palabra; algunas no se parecen a las impresas."
              pt: "A escrita à mão usa letras ligadas, e algumas não se parecem com as impressas."
              fr: "L’écriture à la main relie les lettres, et quelques-unes ne ressemblent pas à leur forme imprimée."
              de: "Die Handschrift verbindet die Buchstaben, und einige sehen anders aus als die gedruckten."
              it: "A mano si scrivono lettere legate, e alcune non somigliano a quelle stampate."
              pl: "Pismo odręczne łączy litery, a kilka z nich wygląda inaczej niż litery drukowane."
              tr: "El yazısında harfler birbirine bağlanır ve birkaçı basılı biçimine benzemez."
              id: "Tulisan tangan memakai huruf bersambung, dan beberapa di antaranya tidak mirip huruf cetaknya."
              vi: "Chữ viết tay nối các chữ cái với nhau, và một vài chữ không giống chữ in."
          - type: note
            level: A0
            text:
              uk: ["Рукописне ", { letter: т }, " схоже на латинське m, рукописне ", { letter: п }, " — на n."]
              en: ["Handwritten ", { letter: т }, " looks like Latin m, and handwritten ", { letter: п }, " like n."]
              es: [{ letter: т }, " manuscrita parece una m latina, y ", { letter: п }, " manuscrita, una n."]
              pt: [{ letter: т }, " manuscrito parece um m latino, e ", { letter: п }, " manuscrito, um n."]
              fr: ["Le ", { letter: т }, " manuscrit ressemble à un m latin, et le ", { letter: п }, " manuscrit à un n."]
              de: ["Handschriftliches ", { letter: т }, " sieht aus wie ein lateinisches m, handschriftliches ", { letter: п }, " wie ein n."]
              it: [{ letter: т }, " a mano assomiglia a una m latina, e ", { letter: п }, " a mano a una n."]
              pl: ["Pisane ", { letter: т }, " wygląda jak łacińskie m, a pisane ", { letter: п }, " jak n."]
              tr: ["El yazısındaki ", { letter: т }, " Latin m harfine, ", { letter: п }, " ise n harfine benzer."]
              id: [{ letter: т }, " tulisan tangan mirip huruf m Latin, dan ", { letter: п }, " tulisan tangan mirip n."]
              vi: ["Chữ ", { letter: т }, " viết tay giống chữ m Latinh, còn chữ ", { letter: п }, " viết tay giống chữ n."]
          - type: note
            level: A0
            text:
              uk: ["Рукописне ", { letter: и }, " схоже на латинське u, а ", { letter: д }, " пишуть із петлею вниз, як g."]
              en: ["Handwritten ", { letter: и }, " looks like Latin u, and ", { letter: д }, " has a loop below, like g."]
              es: [{ letter: и }, " manuscrita parece una u latina, y la ", { letter: д }, " lleva un rizo abajo, como la g."]
              pt: [{ letter: и }, " manuscrito parece um u latino, e ", { letter: д }, " tem uma laçada embaixo, como o g."]
              fr: ["Le ", { letter: и }, " manuscrit ressemble à un u latin, et le ", { letter: д }, " a une boucle en bas, comme le g."]
              de: ["Handschriftliches ", { letter: и }, " sieht aus wie ein lateinisches u, und ", { letter: д }, " hat unten eine Schleife wie das g."]
              it: [{ letter: и }, " a mano assomiglia a una u latina, e ", { letter: д }, " ha un'asola in basso, come la g."]
              pl: ["Pisane ", { letter: и }, " wygląda jak łacińskie u, a ", { letter: д }, " ma na dole pętlę jak g."]
              tr: ["El yazısındaki ", { letter: и }, " Latin u harfine benzer, ", { letter: д }, " ise g gibi aşağıda bir ilmeğe sahiptir."]
              id: [{ letter: и }, " tulisan tangan mirip huruf u Latin, dan ", { letter: д }, " punya ikal di bawah, seperti g."]
              vi: ["Chữ ", { letter: и }, " viết tay giống chữ u Latinh, còn chữ ", { letter: д }, " có một vòng ở dưới, như chữ g."]
          - type: note
            level: A0
            text:
              uk: "Друковані й рукописні великі літери зазвичай схожі на малі, тільки більші."
              en: "Capital letters, printed or handwritten, mostly look like the small ones, only bigger."
              es: "Las mayúsculas, impresas o manuscritas, se parecen casi siempre a las minúsculas, solo que más grandes."
              pt: "As maiúsculas, impressas ou manuscritas, quase sempre se parecem com as minúsculas, só que maiores."
              fr: "Les majuscules, imprimées ou manuscrites, ressemblent presque toujours aux minuscules, en plus grand."
              de: "Große Buchstaben, gedruckt oder handschriftlich, sehen meist aus wie die kleinen, nur größer."
              it: "Le maiuscole, stampate o manoscritte, somigliano quasi sempre alle minuscole, ma più grandi."
              pl: "Wielkie litery, drukowane lub pisane, zwykle wyglądają jak małe, tylko są większe."
              tr: "Büyük harfler, basılı ya da el yazısı olsun, çoğunlukla küçüklerine benzer; yalnızca daha büyüktür."
              id: "Huruf kapital, cetak maupun tulisan tangan, umumnya mirip huruf kecil, hanya lebih besar."
              vi: "Chữ hoa, dù chữ in hay chữ viết tay, thường giống chữ thường, chỉ lớn hơn."

