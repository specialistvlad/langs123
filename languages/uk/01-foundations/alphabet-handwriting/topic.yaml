sections:
  - title: { uk: Літери, en: The letters, es: Las letras, pt: "As letras", fr: "Les lettres", de: "Die Buchstaben", it: "Le lettere", pl: "Litery", tr: "Harfler", id: "Huruf", vi: "Các chữ cái" }
    role: own
    content:
      - type: prose
        level: A0
        text:
          uk: ["33 літери: 10 голосних, 22 приголосні та ", { letter: ь }, ", який звука не має. Кожна літера має назву: її вимовляють, коли називають слово по літерах."]
          en: ["33 letters: 10 vowels, 22 consonants and ", { letter: ь }, ", which has no sound. Each letter has a name, used to spell a word aloud."]
          es: ["33 letras: 10 vocales, 22 consonantes y la ", { letter: ь }, ", que no tiene sonido. Cada letra tiene un nombre, que se usa para deletrear."]
          pt: ["33 letras: 10 vogais, 22 consoantes e o ", { letter: ь }, ", que não tem som. Cada letra tem um nome, usado para soletrar uma palavra em voz alta."]
          fr: ["33 lettres : 10 voyelles, 22 consonnes et le ", { letter: ь }, ", qui n’a pas de son. Chaque lettre a un nom, qui sert à épeler un mot à voix haute."]
          de: ["33 Buchstaben: 10 Vokale, 22 Konsonanten und das ", { letter: ь }, ", das keinen Laut hat. Jeder Buchstabe hat einen Namen, mit dem man ein Wort laut buchstabiert."]
          it: ["33 lettere: 10 vocali, 22 consonanti e la ", { letter: ь }, ", che non ha suono. Ogni lettera ha un nome, usato per dire una parola lettera per lettera."]
          pl: ["33 litery: 10 samogłosek, 22 spółgłoski i ", { letter: ь }, ", który nie ma dźwięku. Każda litera ma nazwę, której używa się do literowania słowa na głos."]
          tr: ["33 harf: 10 ünlü, 22 ünsüz ve sesi olmayan ", { letter: ь }, ". Her harfin bir adı vardır; bir sözcüğü harf harf söylerken bu ad kullanılır."]
          id: ["33 huruf: 10 vokal, 22 konsonan, dan ", { letter: ь }, " yang tidak punya bunyi. Setiap huruf punya nama, yang dipakai untuk mengeja kata secara lisan."]
          vi: ["33 chữ cái: 10 nguyên âm, 22 phụ âm và ", { letter: ь }, ", chữ không có âm. Mỗi chữ cái có một tên, dùng để đánh vần từ thành tiếng."]
