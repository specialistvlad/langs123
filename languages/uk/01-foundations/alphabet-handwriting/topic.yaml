title: { uk: Абетка, en: The Cyrillic Alphabet, es: El alfabeto cirílico, pt: "O alfabeto cirílico", fr: "L’alphabet cyrillique", de: "Das kyrillische Alphabet", it: "L'alfabeto cirillico", pl: "Alfabet cyrylicki", tr: "Kiril alfabesi", id: "Alfabet Sirilik", vi: "Bảng chữ cái Kirin" }
summary:
  lead:
    uk: "Українська абетка має 33 літери кирилицею, друковані й рукописні, великі й малі, і кожна літера має свою назву."
    en: "The Ukrainian alphabet has 33 Cyrillic letters, printed and handwritten, capital and small, and each letter has a name."
    es: "El alfabeto ucraniano tiene 33 letras cirílicas, impresas y manuscritas, mayúsculas y minúsculas, y cada letra tiene su nombre."
    pt: "O alfabeto ucraniano tem 33 letras cirílicas, impressas e manuscritas, maiúsculas e minúsculas, e cada letra tem um nome."
    fr: "L’alphabet ukrainien compte 33 lettres cyrilliques, imprimées et manuscrites, majuscules et minuscules, et chaque lettre porte un nom."
    de: "Das ukrainische Alphabet hat 33 kyrillische Buchstaben, gedruckt und handschriftlich, groß und klein, und jeder Buchstabe hat einen Namen."
    it: "L'alfabeto ucraino ha 33 lettere cirilliche, stampate e manoscritte, maiuscole e minuscole, e ogni lettera ha un nome."
    pl: "Alfabet ukraiński ma 33 litery cyrylicy, drukowane i pisane, wielkie i małe, a każda litera ma swoją nazwę."
    tr: "Ukrayna alfabesinde Kiril yazısıyla 33 harf vardır; basılı ve el yazısı, büyük ve küçük biçimleri bulunur ve her harfin bir adı vardır."
    id: "Alfabet bahasa Ukraina memiliki 33 huruf Sirilik, cetak dan tulisan tangan, huruf besar dan huruf kecil, dan setiap huruf punya nama."
    vi: "Bảng chữ cái tiếng Ukraina có 33 chữ cái Kirin, chữ in và chữ viết tay, chữ hoa và chữ thường, và mỗi chữ cái có một tên riêng."
  rule:
    uk: ["Літери ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, ", ", { letter: ї }, " на початку слова позначають два звуки, з ", { ipa: j }, " попереду:"]
    en: ["At the start of a word, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " and ", { letter: ї }, " stand for two sounds, a ", { ipa: j }, " first:"]
    es: ["Al principio de palabra, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " y ", { letter: ї }, " representan dos sonidos, con una ", { ipa: j }, " delante:"]
    pt: ["No início de uma palavra, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " e ", { letter: ї }, " representam dois sons, com um ", { ipa: j }, " na frente:"]
    fr: ["Au début d’un mot, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " et ", { letter: ї }, " représentent deux sons, avec un ", { ipa: j }, " devant :"]
    de: ["Am Wortanfang stehen ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " und ", { letter: ї }, " für zwei Laute, zuerst ein ", { ipa: j }, ":"]
    it: ["All'inizio di una parola, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " e ", { letter: ї }, " rappresentano due suoni, con un ", { ipa: j }, " davanti:"]
    pl: ["Na początku wyrazu ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " i ", { letter: ї }, " oznaczają dwa dźwięki, najpierw ", { ipa: j }, ":"]
    tr: ["Sözcük başında ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " ve ", { letter: ї }, " harfleri iki sesi gösterir; önce bir ", { ipa: j }, " gelir:"]
    id: ["Di awal kata, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " dan ", { letter: ї }, " melambangkan dua bunyi, diawali ", { ipa: j }, ":"]
    vi: ["Ở đầu từ, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " và ", { letter: ї }, " biểu thị hai âm, có ", { ipa: j }, " đứng trước:"]
