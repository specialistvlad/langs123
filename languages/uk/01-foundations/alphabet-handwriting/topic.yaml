# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.foundations.alphabet-handwriting
lang: uk
kind: foundations
tags: [alphabet, letters, handwriting, capitals]
concepts: [alphabet]
related: [uk.foundations.vowels-consonants, uk.foundations.soft-sign-apostrophe, uk.foundations.stress]
status: { uk: draft, en: draft, es: draft }
translated: { en: "9b0789 1a18cd bf9325 37520b 0009d8 bffb6c", es: "9b0789 1a18cd bf9325 37520b 0009d8 bffb6c" }

title: { uk: Абетка, en: The Cyrillic Alphabet, es: El alfabeto cirílico }
summary:
  lead:
    uk: "Українська абетка має 33 літери кирилицею, друковані й рукописні, великі й малі, і кожна літера має свою назву."
    en: "The Ukrainian alphabet has 33 Cyrillic letters, printed and handwritten, capital and small, and each letter has a name."
    es: "El alfabeto ucraniano tiene 33 letras cirílicas, impresas y manuscritas, mayúsculas y minúsculas, y cada letra tiene su nombre."
  rule:
    uk: ["Літери ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, ", ", { letter: ї }, " на початку слова позначають два звуки, з ", { ipa: j }, " попереду:"]
    en: ["At the start of a word, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " and ", { letter: ї }, " stand for two sounds, a ", { ipa: j }, " first:"]
    es: ["Al principio de palabra, ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " y ", { letter: ї }, " representan dos sonidos, con una ", { ipa: j }, " delante:"]
  ex: { examples: [[{ target: { letter: Я́ } }, "блуко"], [{ target: { letter: Ї́ } }, "жа"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { uk: 33 літери, en: 33 letters, es: 33 letras }
          rule:
            uk: ["10 голосних літер: ", { letter: "а, е, є, и, і, ї, о, у, ю, я" }]
            en: ["10 vowel letters: ", { letter: "а, е, є, и, і, ї, о, у, ю, я" }]
            es: ["10 letras vocales: ", { letter: "а, е, є, и, і, ї, о, у, ю, я" }]
          ex: { examples: [[{ target: { letter: о́ } }, "з", { target: { letter: е } }, "р", { target: { letter: о } }], ["м", { target: { letter: о́ } }, "р", { target: { letter: е } }]] }
          tr: { en: { examples: [lake, sea] }, es: { examples: [lago, mar] } }
        - level: A0
          point: { uk: "Я, ю, є, ї", en: "Я, ю, є, ї", es: "Я, ю, є, ї" }
          rule:
            uk: ["на початку слова — два звуки: ", { alternatives: [{ ipa: ja }, { ipa: ju }, { ipa: jɛ }, { ipa: ji }] }]
            en: ["two sounds at the start of a word: ", { alternatives: [{ ipa: ja }, { ipa: ju }, { ipa: jɛ }, { ipa: ji }] }]
            es: ["dos sonidos al principio de palabra: ", { alternatives: [{ ipa: ja }, { ipa: ju }, { ipa: jɛ }, { ipa: ji }] }]
          ex: { examples: [[{ target: { letter: я́ } }, "блуко"], [{ target: { letter: ї́ } }, "жа"]] }
          tr: { en: { examples: [apple, food] }, es: { examples: [manzana, comida] } }
        - level: A0
          point: { uk: Щ, en: Щ, es: Щ }
          rule:
            uk: ["одна літера, два звуки: ", { ipa: ʃt͡ʃ }]
            en: ["one letter, two sounds: ", { ipa: ʃt͡ʃ }]
            es: ["una letra, dos sonidos: ", { ipa: ʃt͡ʃ }]
          ex: [{ target: { letter: щ } }, "а́стя"]
          tr: { en: happiness, es: felicidad }
        - level: A0
          point: { uk: Ь, en: Ь, es: Ь }
          rule:
            uk: "звука не має: пом’якшує приголосну перед собою"
            en: "has no sound: it softens the consonant before it"
            es: "no tiene sonido: ablanda la consonante anterior"
          ex: { examples: [["сіл", { target: { letter: ь } }], ["ден", { target: { letter: ь } }]] }
          tr: { en: { examples: [salt, day] }, es: { examples: [sal, día] } }
        - level: A0
          point: { uk: "Г і ґ", en: "Г and ґ", es: "Г y ґ" }
          rule:
            uk: [{ letter: г }, " — ", { ipa: ɦ }, ", ", { letter: ґ }, " — ", { ipa: ɡ }]
            en: [{ letter: г }, " is ", { ipa: ɦ }, ", ", { letter: ґ }, " is ", { ipa: ɡ }]
            es: [{ letter: г }, " es ", { ipa: ɦ }, "; ", { letter: ґ }, ", ", { ipa: ɡ }]
          ex: { examples: [[{ target: { letter: г } }, "ора́"], [{ target: { letter: ґ } }, "у́дзик"]] }
          tr: { en: { examples: [mountain, button] }, es: { examples: [montaña, botón] } }
        - level: A0
          point: { uk: "И і і", en: "И and і", es: "И y і" }
          rule:
            uk: [{ letter: и }, " — ", { ipa: ɪ }, ", ", { letter: і }, " — ", { ipa: i }, ": це різні звуки"]
            en: [{ letter: и }, " is ", { ipa: ɪ }, ", ", { letter: і }, " is ", { ipa: i }, ": two different sounds"]
            es: [{ letter: и }, " es ", { ipa: ɪ }, "; ", { letter: і }, ", ", { ipa: i }, ": son sonidos distintos"]
          ex: { examples: [["р", { target: { letter: и́ } }, "ба"], ["л", { target: { letter: і́ } }, "то"]] }
          tr: { en: { examples: [fish, summer] }, es: { examples: [pez, verano] } }
        - level: A0
          point: { uk: Велика літера, en: Capital letter, es: Mayúscula }
          rule:
            uk: "імена, міста, країни й початок речення"
            en: "names, cities, countries and the start of a sentence"
            es: "nombres, ciudades, países y el principio de la oración"
          ex: [{ target: Оле́на }, " живе́ в ", { target: Ки́єві }, "."]
          tr: { en: Olena lives in Kyiv., es: Olena vive en Kiev. }
        - level: A0
          point: { uk: Мала літера, en: Small letter, es: Minúscula }
          rule:
            uk: "мови й національності"
            en: "languages and nationalities"
            es: "idiomas y nacionalidades"
          ex: ["Я ", { target: украї́нець }, ", я говорю́ ", { target: украї́нською }, "."]
          tr: { en: "I'm Ukrainian, I speak Ukrainian.", es: "Soy ucraniano, hablo ucraniano." }
        - level: A0
          point: { uk: Рукопис, en: Handwriting, es: Letra manuscrita }
          rule:
            uk: [{ letter: т }, " пишуть як латинське m, ", { letter: д }, " — з петлею вниз"]
            en: ["handwritten ", { letter: т }, " looks like Latin m; ", { letter: д }, " has a loop below"]
            es: [{ letter: т }, " manuscrita parece una m latina; ", { letter: д }, " lleva un rizo abajo"]
        - level: A0
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["в українській абетці немає ", { letter: ы }, ", ", { letter: э }, ", ", { letter: ъ }, ", ", { letter: ё }]
            en: ["the Ukrainian alphabet has no ", { letter: ы }, ", ", { letter: э }, ", ", { letter: ъ }, " or ", { letter: ё }]
            es: ["el alfabeto ucraniano no tiene ", { letter: ы }, ", ", { letter: э }, ", ", { letter: ъ }, " ni ", { letter: ё }]
          ex: { examples: [["м", { target: { letter: и } }], [{ target: { letter: йо́ } }, "гурт"]] }
          tr: { en: { examples: [we, yogurt] }, es: { examples: [nosotros, yogur] } }

sections:
  - title: { uk: Літери, en: The letters, es: Las letras }
    role: own
    content:
      - type: prose
        level: A0
        text:
          uk: ["33 літери: 10 голосних, 22 приголосні та ", { letter: ь }, ", який звука не має. Кожна літера має назву: її вимовляють, коли називають слово по літерах."]
          en: ["33 letters: 10 vowels, 22 consonants and ", { letter: ь }, ", which has no sound. Each letter has a name, used to spell a word aloud."]
          es: ["33 letras: 10 vocales, 22 consonantes y la ", { letter: ь }, ", que no tiene sonido. Cada letra tiene un nombre, que se usa para deletrear."]
      - type: inventory
        set: letters
        columns:
          - { key: letter, label: { uk: Літера, en: Letter, es: Letra } }
          - { key: name, label: { uk: Назва, en: Name, es: Nombre } }
          - { key: sound, label: { uk: Звук, en: Sound, es: Sonido } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - { level: A0, value: а, letter: А а, name: а, sound: [{ ipa: a }, " ", { sound: a }], ex: { ex: [{ letter: а }, "вто́бус"], tr: { en: bus, es: autobús } } }
          - { level: A0, value: б, letter: Б б, name: бе, sound: [{ ipa: b }, " ", { sound: b }], ex: { ex: [{ letter: б }, "анк"], tr: { en: bank, es: banco } } }
          - { level: A0, value: в, letter: В в, name: ве, sound: [{ ipa: ʋ }, " ", { sound: v }], ex: { ex: [{ letter: в }, "ода́"], tr: { en: water, es: agua } } }
          - { level: A0, value: г, letter: Г г, name: ге, sound: [{ ipa: ɦ }, " ", { sound: h }], ex: { ex: [{ letter: г }, "ора́"], tr: { en: mountain, es: montaña } } }
          - { level: A0, value: ґ, letter: Ґ ґ, name: ґе, sound: [{ ipa: ɡ }, " ", { sound: g }], ex: { ex: [{ letter: ґ }, "у́дзик"], tr: { en: button, es: botón } } }
          - { level: A0, value: д, letter: Д д, name: де, sound: [{ ipa: d }, " ", { sound: d }], ex: { ex: [{ letter: д }, "ім"], tr: { en: home, es: casa } } }
          - { level: A0, value: е, letter: Е е, name: е, sound: [{ ipa: ɛ }, " ", { sound: e }], ex: { ex: ["н", { letter: е́ }, "бо"], tr: { en: sky, es: cielo } } }
          - { level: A0, value: є, letter: Є є, name: є, sound: [{ ipa: jɛ }, " ", { alternatives: [{ sound: ye }, { sound: ie }] }], ex: { ex: [{ letter: Є }, "вро́па"], tr: { en: Europe, es: Europa } } }
          - { level: A0, value: ж, letter: Ж ж, name: же, sound: [{ ipa: ʒ }, " ", { sound: zh }], ex: { ex: [{ letter: ж }, "і́нка"], tr: { en: woman, es: mujer } } }
          - { level: A0, value: з, letter: З з, name: зе, sound: [{ ipa: z }, " ", { sound: z }], ex: { ex: [{ letter: з }, "има́"], tr: { en: winter, es: invierno } } }
          - { level: A0, value: и, letter: И и, name: и, sound: [{ ipa: ɪ }, " ", { sound: y }], ex: { ex: ["р", { letter: и́ }, "ба"], tr: { en: fish, es: pez } } }
          - { level: A0, value: і, letter: І і, name: і, sound: [{ ipa: i }, " ", { sound: i }], ex: { ex: [{ letter: і }, "м’я́"], tr: { en: name, es: nombre } } }
          - { level: A0, value: ї, letter: Ї ї, name: ї, sound: [{ ipa: ji }, " ", { alternatives: [{ sound: yi }, { sound: i }] }], ex: { ex: [{ letter: ї́ }, "жа"], tr: { en: food, es: comida } } }
          - { level: A0, value: й, letter: Й й, name: йот, sound: [{ ipa: j }, " ", { alternatives: [{ sound: y }, { sound: i }] }], ex: { ex: [{ letter: й }, "о́гурт"], tr: { en: yogurt, es: yogur } } }
          - { level: A0, value: к, letter: К к, name: ка, sound: [{ ipa: k }, " ", { sound: k }], ex: { ex: [{ letter: к }, "іт"], tr: { en: cat, es: gato } } }
          - { level: A0, value: л, letter: Л л, name: ел, sound: [{ ipa: l }, " ", { sound: l }], ex: { ex: [{ letter: л }, "а́мпа"], tr: { en: lamp, es: lámpara } } }
          - { level: A0, value: м, letter: М м, name: ем, sound: [{ ipa: m }, " ", { sound: m }], ex: { ex: [{ letter: м }, "о́ре"], tr: { en: sea, es: mar } } }
          - { level: A0, value: н, letter: Н н, name: ен, sound: [{ ipa: n }, " ", { sound: n }], ex: { ex: [{ letter: н }, "іч"], tr: { en: night, es: noche } } }
          - { level: A0, value: о, letter: О о, name: о, sound: [{ ipa: ɔ }, " ", { sound: o }], ex: { ex: [{ letter: о́ }, "зеро"], tr: { en: lake, es: lago } } }
          - { level: A0, value: п, letter: П п, name: пе, sound: [{ ipa: p }, " ", { sound: p }], ex: { ex: [{ letter: п }, "арк"], tr: { en: park, es: parque } } }
          - { level: A0, value: р, letter: Р р, name: ер, sound: [{ ipa: r }, " ", { sound: r }], ex: { ex: [{ letter: р }, "ука́"], tr: { en: hand, es: mano } } }
          - { level: A0, value: с, letter: С с, name: ес, sound: [{ ipa: s }, " ", { sound: s }], ex: { ex: [{ letter: с }, "ир"], tr: { en: cheese, es: queso } } }
          - { level: A0, value: т, letter: Т т, name: те, sound: [{ ipa: t }, " ", { sound: t }], ex: { ex: [{ letter: т }, "елефо́н"], tr: { en: phone, es: teléfono } } }
          - { level: A0, value: у, letter: У у, name: у, sound: [{ ipa: u }, " ", { sound: u }], ex: { ex: [{ letter: у́ }, "хо"], tr: { en: ear, es: oreja } } }
          - { level: A0, value: ф, letter: Ф ф, name: еф, sound: [{ ipa: f }, " ", { sound: f }], ex: { ex: [{ letter: ф }, "о́то"], tr: { en: photo, es: foto } } }
          - { level: A0, value: х, letter: Х х, name: ха, sound: [{ ipa: x }, " ", { sound: kh }], ex: { ex: [{ letter: х }, "ліб"], tr: { en: bread, es: pan } } }
          - { level: A0, value: ц, letter: Ц ц, name: це, sound: [{ ipa: t͡s }, " ", { sound: ts }], ex: { ex: [{ letter: ц }, "у́кор"], tr: { en: sugar, es: azúcar } } }
          - { level: A0, value: ч, letter: Ч ч, name: че, sound: [{ ipa: t͡ʃ }, " ", { sound: ch }], ex: { ex: [{ letter: ч }, "ай"], tr: { en: tea, es: té } } }
          - { level: A0, value: ш, letter: Ш ш, name: ша, sound: [{ ipa: ʃ }, " ", { sound: sh }], ex: { ex: [{ letter: ш }, "ко́ла"], tr: { en: school, es: escuela } } }
          - { level: A0, value: щ, letter: Щ щ, name: ща, sound: [{ ipa: ʃt͡ʃ }, " ", { sound: shch }], ex: { ex: [{ letter: щ }, "а́стя"], tr: { en: happiness, es: felicidad } } }
          - { level: A0, value: ь, letter: Ь ь, name: м’яки́й знак, sound: { ipa: ʲ }, ex: { ex: ["сіл", { letter: ь }], tr: { en: salt, es: sal } } }
          - { level: A0, value: ю, letter: Ю ю, name: ю, sound: [{ ipa: ju }, " ", { alternatives: [{ sound: yu }, { sound: iu }] }], ex: { ex: ["л", { letter: ю }, "ди́на"], tr: { en: person, es: persona } } }
          - { level: A0, value: я, letter: Я я, name: я, sound: [{ ipa: ja }, " ", { alternatives: [{ sound: ya }, { sound: ia }] }], ex: { ex: [{ letter: я́ }, "блуко"], tr: { en: apple, es: manzana } } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: ["Після приголосної ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " пом’якшують її і дають один голосний звук:"]
              en: ["After a consonant, ", { letter: я }, ", ", { letter: ю }, " and ", { letter: є }, " soften it and give one vowel sound:"]
              es: ["Después de una consonante, ", { letter: я }, ", ", { letter: ю }, " y ", { letter: є }, " la ablandan y dan un solo sonido vocálico:"]
            ex: { examples: [["л", { target: { letter: ю } }, "ди́на"], ["ди́н", { target: { letter: я } }]] }
            tr: { en: { examples: [person, melon] }, es: { examples: [persona, melón] } }
          - type: rule
            level: A0
            text:
              uk: [{ letter: ї }, " завжди позначає два звуки, ", { ipa: ji }, ":"]
              en: [{ letter: ї }, " always stands for two sounds, ", { ipa: ji }, ":"]
              es: [{ letter: ї }, " siempre representa dos sonidos, ", { ipa: ji }, ":"]
            ex: Украї́на
            tr: { en: Ukraine, es: Ucrania }
          - type: note
            level: A0
            text:
              uk: "Латиницею літери подано за національною системою транслітерації 2010 року: перший варіант пишуть на початку слова, другий — в інших позиціях."
              en: "The Latin forms follow the national transliteration of 2010: the first form starts a word, the second goes elsewhere."
              es: "Las formas latinas siguen la transliteración nacional de 2010: la primera va al principio de palabra; la segunda, en los demás casos."
          - type: note
            level: A0
            text:
              uk: ["Апостроф ", { letter: ’ }, " — не літера, а знак: ", { link: М’який знак і апостроф, to: uk.foundations.soft-sign-apostrophe }, "."]
              en: ["The apostrophe ", { letter: ’ }, " is a sign, not a letter: ", { link: Soft Sign and Apostrophe, to: uk.foundations.soft-sign-apostrophe }, "."]
              es: ["El apóstrofo ", { letter: ’ }, " es un signo, no una letra: ", { link: El signo blando y el apóstrofo, to: uk.foundations.soft-sign-apostrophe }, "."]

  - title: { uk: Друковані й рукописні літери, en: Printed and handwritten letters, es: Letras impresas y manuscritas }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Від руки пишуть рукописні літери: вони з’єднуються в слові, і кілька з них не схожі на друковані."
              en: "Handwriting uses joined-up letters, and a few of them look unlike their printed forms."
              es: "A mano se escriben letras manuscritas, unidas en la palabra; algunas no se parecen a las impresas."
          - type: note
            level: A0
            text:
              uk: ["Рукописне ", { letter: т }, " схоже на латинське m, рукописне ", { letter: п }, " — на n."]
              en: ["Handwritten ", { letter: т }, " looks like Latin m, and handwritten ", { letter: п }, " like n."]
              es: [{ letter: т }, " manuscrita parece una m latina, y ", { letter: п }, " manuscrita, una n."]
          - type: note
            level: A0
            text:
              uk: ["Рукописне ", { letter: и }, " схоже на латинське u, а ", { letter: д }, " пишуть із петлею вниз, як g."]
              en: ["Handwritten ", { letter: и }, " looks like Latin u, and ", { letter: д }, " has a loop below, like g."]
              es: [{ letter: и }, " manuscrita parece una u latina, y la ", { letter: д }, " lleva un rizo abajo, como la g."]
          - type: note
            level: A0
            text:
              uk: "Друковані й рукописні великі літери зазвичай схожі на малі, тільки більші."
              en: "Capital letters, printed or handwritten, mostly look like the small ones, only bigger."
              es: "Las mayúsculas, impresas o manuscritas, se parecen casi siempre a las minúsculas, solo que más grandes."

  - title: { uk: Великі й малі літери, en: Capital and small letters, es: Mayúsculas y minúsculas }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A0
            rule: { uk: "велика: імена й прізвища", en: "capital: first names and surnames", es: "mayúscula: nombres y apellidos" }
            ex: ["Це ", { target: Ната́лка Петре́нко }, "."]
            tr: { en: This is Natalka Petrenko., es: Esta es Natalka Petrenko. }
          - level: A0
            rule: { uk: "велика: міста й країни", en: "capital: cities and countries", es: "mayúscula: ciudades y países" }
            ex: ["Ми з ", { target: Украї́ни }, ", з ", { target: Ки́єва }, "."]
            tr: { en: "We're from Ukraine, from Kyiv.", es: "Somos de Ucrania, de Kiev." }
          - level: A0
            rule: { uk: "велика: перше слово речення", en: "capital: the first word of a sentence", es: "mayúscula: la primera palabra de la oración" }
            ex: [{ target: Сього́дні }, " те́пло."]
            tr: { en: It's warm today., es: Hoy está templado. }
          - level: A0
            rule: { uk: "мала: мови й національності", en: "small: languages and nationalities", es: "minúscula: idiomas y nacionalidades" }
            ex: ["Вона́ ", { target: украї́нка }, ", вона́ вивча́є ", { target: англі́йську }, "."]
            tr: { en: "She's Ukrainian, she's learning English.", es: "Es ucraniana, aprende inglés." }
          - level: A0
            rule: { uk: "мала: прикметники від назв міст", en: "small: adjectives from city names", es: "minúscula: adjetivos de nombres de ciudades" }
            ex: ["Це ", { target: ки́ївський }, " авто́бус."]
            tr: { en: This is a Kyiv bus., es: Este es un autobús de Kiev. }
      - type: list
        items:
          - type: note
            level: A0
            text:
              uk: ["Дні тижня й місяці пишуть із малої літери: ", { link: "Дні, місяці, дати", to: uk.foundations.days-months-dates }, "."]
              en: ["Days and months take a small letter: ", { link: "Days, Months and Dates", to: uk.foundations.days-months-dates }, "."]
              es: ["Los días y los meses van con minúscula: ", { link: "Días, meses y fechas", to: uk.foundations.days-months-dates }, "."]

