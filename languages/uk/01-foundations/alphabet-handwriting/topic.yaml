            text:
              uk: ["Після приголосної ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " пом’якшують її і дають один голосний звук:"]
              en: ["After a consonant, ", { letter: я }, ", ", { letter: ю }, " and ", { letter: є }, " soften it and give one vowel sound:"]
              es: ["Después de una consonante, ", { letter: я }, ", ", { letter: ю }, " y ", { letter: є }, " la ablandan y dan un solo sonido vocálico:"]
              pt: ["Depois de uma consoante, ", { letter: я }, ", ", { letter: ю }, " e ", { letter: є }, " a suavizam e dão um único som vocálico:"]
              fr: ["Après une consonne, ", { letter: я }, ", ", { letter: ю }, " et ", { letter: є }, " l’adoucissent et donnent un seul son vocalique :"]
              de: ["Nach einem Konsonanten machen ", { letter: я }, ", ", { letter: ю }, " und ", { letter: є }, " ihn weich und ergeben einen einzigen Vokallaut:"]
              it: ["Dopo una consonante, ", { letter: я }, ", ", { letter: ю }, " e ", { letter: є }, " la ammorbidiscono e danno un solo suono vocalico:"]
              pl: ["Po spółgłosce ", { letter: я }, ", ", { letter: ю }, " i ", { letter: є }, " zmiękczają ją i oznaczają jeden dźwięk samogłoskowy:"]
              tr: ["Bir ünsüzden sonra ", { letter: я }, ", ", { letter: ю }, " ve ", { letter: є }, " o ünsüzü yumuşatır ve tek bir ünlü sesi verir:"]
              id: ["Setelah konsonan, ", { letter: я }, ", ", { letter: ю }, " dan ", { letter: є }, " melunakkan konsonan itu dan melambangkan satu bunyi vokal:"]
              vi: ["Sau một phụ âm, ", { letter: я }, ", ", { letter: ю }, " và ", { letter: є }, " làm mềm phụ âm đó và chỉ cho một âm nguyên âm:"]
            ex: { examples: [["л", { target: { letter: ю } }, "ди́на"], ["ди́н", { target: { letter: я } }]] }
            tr: { en: { examples: [person, melon] }, es: { examples: [persona, melón] }, pt: { examples: ["pessoa", "melão"] }, fr: { examples: ["personne", "melon"] }, de: { examples: ["Person", "Melone"] }, it: { examples: ["persona", "melone"] }, pl: { examples: ["człowiek", "melon"] }, tr: { examples: ["insan", "kavun"] }, id: { examples: ["orang", "melon"] }, vi: { examples: ["người", "dưa"] } }
          - type: rule
            level: A0
            text:
              uk: [{ letter: ї }, " завжди позначає два звуки, ", { ipa: ji }, ":"]
              en: [{ letter: ї }, " always stands for two sounds, ", { ipa: ji }, ":"]
              es: [{ letter: ї }, " siempre representa dos sonidos, ", { ipa: ji }, ":"]
              pt: [{ letter: ї }, " sempre representa dois sons, ", { ipa: ji }, ":"]
              fr: [{ letter: ї }, " représente toujours deux sons, ", { ipa: ji }, " :"]
              de: [{ letter: ї }, " steht immer für zwei Laute, ", { ipa: ji }, ":"]
              it: [{ letter: ї }, " rappresenta sempre due suoni, ", { ipa: ji }, ":"]
              pl: [{ letter: ї }, " zawsze oznacza dwa dźwięki, ", { ipa: ji }, ":"]
              tr: [{ letter: ї }, " harfi her zaman iki sesi gösterir, ", { ipa: ji }, ":"]
              id: [{ letter: ї }, " selalu melambangkan dua bunyi, ", { ipa: ji }, ":"]
              vi: [{ letter: ї }, " luôn biểu thị hai âm, ", { ipa: ji }, ":"]
            ex: Украї́на
            tr: { en: Ukraine, es: Ucrania, pt: "Ucrânia", fr: "Ukraine", de: "Ukraine", it: "Ucraina", pl: "Ukraina", tr: "Ukrayna", id: "Ukraina", vi: "Ukraina" }
          - type: note
            level: A0
            text:
              uk: "Латиницею літери подано за національною системою транслітерації 2010 року: перший варіант пишуть на початку слова, другий — в інших позиціях."
              en: "The Latin forms follow the national transliteration of 2010: the first form starts a word, the second goes elsewhere."
              es: "Las formas latinas siguen la transliteración nacional de 2010: la primera va al principio de palabra; la segunda, en los demás casos."
              pt: "As formas latinas seguem a transliteração nacional de 2010: a primeira forma vai no início da palavra; a segunda, nas demais posições."
              fr: "Les formes latines suivent la translittération nationale de 2010 : la première s’emploie en début de mot, la seconde ailleurs."
              de: "Die lateinischen Formen folgen der nationalen Transliteration von 2010: Die erste Form steht am Wortanfang, die zweite an anderen Stellen."
              it: "Le forme latine seguono la traslitterazione nazionale del 2010: la prima forma sta all'inizio di parola, la seconda negli altri casi."
              pl: "Formy łacińskie podano według krajowej transliteracji z 2010 roku: pierwsza forma stoi na początku wyrazu, druga w pozostałych miejscach."
              tr: "Latin harfli karşılıklar 2010 tarihli ulusal çeviri yazı sistemine uyar: ilk biçim sözcük başında, ikincisi diğer konumlarda kullanılır."
              id: "Bentuk Latin mengikuti transliterasi nasional tahun 2010: bentuk pertama dipakai di awal kata, bentuk kedua di posisi lain."
              vi: "Dạng Latinh theo hệ thống chuyển tự quốc gia năm 2010: dạng thứ nhất dùng ở đầu từ, dạng thứ hai dùng ở các vị trí khác."
          - type: note
            level: A0
            text:
              uk: ["Апостроф ", { letter: ’ }, " — не літера, а знак: ", { link: М’який знак і апостроф, to: uk.foundations.soft-sign-apostrophe }, "."]
