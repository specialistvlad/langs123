          - { level: A0, value: ь, letter: Ь ь, name: м’яки́й знак, sound: { ipa: ʲ }, ex: { ex: ["сіл", { letter: ь }], tr: { en: salt, es: sal, pt: "sal", fr: "sel", de: "Salz", it: "sale", pl: "sól", tr: "tuz", id: "garam", vi: "muối" } } }
          - { level: A0, value: ю, letter: Ю ю, name: ю, sound: [{ ipa: ju }, " ", { alternatives: [{ sound: yu }, { sound: iu }] }], ex: { ex: ["л", { letter: ю }, "ди́на"], tr: { en: person, es: persona, pt: "pessoa", fr: "personne", de: "Person", it: "persona", pl: "człowiek", tr: "insan", id: "orang", vi: "người" } } }
