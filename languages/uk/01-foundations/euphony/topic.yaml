          - { level: A1, wrong: Оле́на і А́нна, right: ["Оле́на ", { target: й }, " А́нна"], rule: { uk: ["між голосними — ", { term: й }], en: ["between vowels, use ", { term: й }], es: ["entre vocales va ", { term: й }] } }
          - { level: A1, wrong: з шко́ли, right: [{ target: зі }, " шко́ли"], rule: { uk: ["перед ", { letter: шк }, " — ", { term: зі }], en: ["before ", { letter: шк }, ", use ", { term: зі }], es: ["ante ", { letter: шк }, " va ", { term: зі }] } }
          - { level: A1, wrong: Він з Си́рії., right: ["Він ", { target: із }, " Си́рії."], rule: { uk: ["між приголосними перед ", { letter: с }, " — ", { term: із }], en: ["between consonants, before ", { letter: с }, ", use ", { term: із }], es: ["entre consonantes, ante ", { letter: с }, ", va ", { term: із }] } }
