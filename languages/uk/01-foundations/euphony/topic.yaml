              en: ["Between consonants, ", { term: із }, " goes before a single consonant and ", { term: зі }, " before a cluster."]
              es: ["Entre consonantes, ", { term: із }, " va ante una sola consonante y ", { term: зі }, ", ante un grupo de consonantes."]

