title: { uk: "Милозвучність: у/в, і/й, з/із/зі", en: "Euphony: у/в, і/й, з/із/зі", es: "La eufonía: у/в, і/й, з/із/зі", pt: "Eufonia: у/в, і/й, з/із/зі", fr: "L’euphonie : у/в, і/й, з/із/зі", de: "Euphonie: у/в, і/й, з/із/зі", it: "L'eufonia: у/в, і/й, з/із/зі", pl: "Eufonia: у/в, і/й, з/із/зі", tr: "Ses ahengi: у/в, і/й, з/із/зі", id: "Eufoni: у/в, і/й, з/із/зі", vi: "Tính êm tai: у/в, і/й, з/із/зі" }
summary:
  lead:
    uk: "Прийменник у чи в, сполучник і чи й, прийменник з, із чи зі обирають за звуками довкола, щоб уникнути збігу голосних чи приголосних."
    en: "The preposition у or в, the conjunction і or й and the preposition з, із or зі change with the sounds around them, so vowels and consonants alternate."
    es: "La preposición у o в, la conjunción і o й y la preposición з, із o зі cambian según los sonidos de alrededor, para alternar vocales y consonantes."
    pt: "A preposição у ou в, a conjunção і ou й e a preposição з, із ou зі mudam conforme os sons ao redor, para alternar vogais e consoantes."
    fr: "La préposition у ou в, la conjonction і ou й et la préposition з, із ou зі varient selon les sons voisins, afin d’alterner voyelles et consonnes."
    de: "Die Präposition у/в, die Konjunktion і/й und die Präposition з/із/зі richten sich nach den Nachbarlauten, damit sich Vokale und Konsonanten abwechseln."
    it: "La preposizione у o в, la congiunzione і o й e la preposizione з, із o зі cambiano secondo i suoni intorno, per alternare vocali e consonanti."
    pl: "Przyimek у lub в, spójnik і lub й oraz przyimek з, із lub зі zmieniają się zależnie od sąsiednich głosek, aby samogłoski i spółgłoski się przeplatały."
    tr: "Edat у veya в, bağlaç і veya й ve edat з, із veya зі çevredeki seslere göre seçilir; böylece ünlüler ve ünsüzler art arda sıralanır."
    id: "Preposisi у atau в, konjungsi і atau й, dan preposisi з, із atau зі berubah menurut bunyi di sekitarnya agar vokal dan konsonan berselang-seling."
    vi: "Giới từ у/в, liên từ і/й và giới từ з/із/зі đổi theo âm xung quanh để nguyên âm và phụ âm xen kẽ nhau."
  rule:
    uk: ["Між приголосними пишуть ", { term: у }, ", між голосними — ", { term: в }, ":"]
    en: ["Between consonants, write ", { term: у }, "; between vowels, ", { term: в }, ":"]
    es: ["Entre consonantes se escribe ", { term: у }, "; entre vocales, ", { term: в }, ":"]
    pt: ["Entre consoantes, escreve-se ", { term: у }, "; entre vogais, ", { term: в }, ":"]
    fr: ["Entre deux consonnes, on écrit ", { term: у }, " ; entre deux voyelles, ", { term: в }, " :"]
    de: ["Zwischen Konsonanten schreibt man ", { term: у }, ", zwischen Vokalen ", { term: в }, ":"]
    it: ["Tra consonanti si scrive ", { term: у }, "; tra vocali, ", { term: в }, ":"]
    pl: ["Między spółgłoskami piszemy ", { term: у }, ", między samogłoskami ", { term: в }, ":"]
    tr: ["Ünsüzler arasında ", { term: у }, ", ünlüler arasında ", { term: в }, " yazılır:"]
    id: ["Di antara konsonan ditulis ", { term: у }, "; di antara vokal ditulis ", { term: в }, ":"]
    vi: ["Giữa các phụ âm viết ", { term: у }, ", giữa các nguyên âm viết ", { term: в }, ":"]
  ex: { examples: [["Брат ", { target: у }, " шко́лі."], ["Вона́ була́ ", { target: в }, " Оде́сі."]] }

