            ex: ["Брат ", { target: в }, " Оде́сі."]
            tr: { en: My brother is in Odesa., es: Mi hermano está en Odesa. }
          - level: A2
            rule: { uk: [{ term: у }, " перед ", { letter: "в, ф, льв, св, тв, хв" }], en: [{ term: у }, " before ", { letter: "в, ф, льв, св, тв, хв" }], es: [{ term: у }, " ante ", { letter: "в, ф, льв, св, тв, хв" }] }
            ex: { examples: [["Вона́ ", { target: у }, " Ві́нниці."], ["Ми ", { target: у }, " Фра́нції."]] }
