          - level: A2
            rule: { uk: [{ term: в }, " на початку речення перед голосною"], en: [{ term: в }, " at the start of a sentence, before a vowel"], es: [{ term: в }, " al principio de la oración, ante vocal"] }
            ex: [{ target: В }, " Оде́сі мо́ре."]
