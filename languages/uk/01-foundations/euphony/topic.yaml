id: uk.foundations.euphony
lang: uk
kind: foundations
tags: [euphony, prepositions, conjunctions, pronunciation]
concepts: [euphony]
related: [uk.foundations.vowels-consonants, uk.prepositions.where-whereto-wherefrom, uk.sentence.conjunctions]
status: { uk: draft, en: draft, es: draft }
translated: { en: "beaac7 a359eb f5207b c7dbcc 863d19 0699a3", es: "beaac7 a359eb f5207b c7dbcc 863d19 0699a3" }

title: { uk: "Милозвучність: у/в, і/й, з/із/зі", en: "Euphony: у/в, і/й, з/із/зі", es: "La eufonía: у/в, і/й, з/із/зі" }
summary:
  lead:
    uk: "Прийменник у чи в, сполучник і чи й, прийменник з, із чи зі обирають за звуками довкола, щоб уникнути збігу голосних чи приголосних."
    en: "The preposition у or в, the conjunction і or й and the preposition з, із or зі change with the sounds around them, so vowels and consonants alternate."
    es: "La preposición у o в, la conjunción і o й y la preposición з, із o зі cambian según los sonidos de alrededor, para alternar vocales y consonantes."
  rule:
    uk: ["Між приголосними пишуть ", { term: у }, ", між голосними — ", { term: в }, ":"]
    en: ["Between consonants, write ", { term: у }, "; between vowels, ", { term: в }, ":"]
    es: ["Entre consonantes se escribe ", { term: у }, "; entre vocales, ", { term: в }, ":"]
  ex: { examples: [["Брат ", { target: у }, " шко́лі."], ["Вона́ була́ ", { target: в }, " Оде́сі."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: В, en: В, es: В }
          rule:
            uk: "після голосної перед голосною чи приголосною"
            en: "after a vowel, before a vowel or a consonant"
            es: "tras vocal, ante vocal o consonante"
          ex: { examples: [["Вона́ була́ ", { target: в }, " Оде́сі."], ["Вона́ жила́ ", { target: в }, " Ки́єві."]] }
          tr: { en: { examples: [She was in Odesa., She lived in Kyiv.] }, es: { examples: [Estuvo en Odesa., Vivía en Kiev.] } }
        - level: A2
          point: { uk: В, en: В, es: В }
          rule:
            uk: "перед голосною на початку речення чи після приголосної"
            en: "before a vowel at the start of a sentence or after a consonant"
            es: "ante vocal al principio de la oración o tras consonante"
          ex: { examples: [[{ target: В }, " Оде́сі те́пло."], ["Брат ", { target: в }, " Оде́сі."]] }
          tr: { en: { examples: ["It's warm in Odesa.", My brother is in Odesa.] }, es: { examples: [En Odesa hace un tiempo templado., Mi hermano está en Odesa.] } }
        - level: A1
          point: { uk: У, en: У, es: У }
          rule:
            uk: "між приголосними"
            en: "between consonants"
            es: "entre consonantes"
          ex: ["Брат ", { target: у }, " шко́лі."]
          tr: { en: My brother is at school., es: Mi hermano está en la escuela. }
        - level: A2
          point: { uk: У, en: У, es: У }
          rule:
            uk: ["перед приголосною на початку речення й перед ", { letter: "в, ф, льв, св, тв" }]
            en: ["before a consonant at the start of a sentence, and before ", { letter: "в, ф, льв, св, тв" }]
            es: ["ante consonante al principio de la oración, y ante ", { letter: "в, ф, льв, св, тв" }]
          ex: ["Вона́ ", { target: у }, " Ві́нниці."]
          tr: { en: She's in Vinnytsia., es: Está en Vinnytsia. }
        - level: A1
          point: { uk: Й, en: Й, es: Й }
          rule:
            uk: "між голосними й після голосної перед приголосною"
            en: "between vowels, and after a vowel before a consonant"
            es: "entre vocales, y tras vocal ante consonante"
          ex: ["Полта́ва ", { target: й }, " Оде́са"]
          tr: { en: Poltava and Odesa, es: Poltava y Odesa }
        - level: A1
          point: { uk: І, en: І, es: І }
          rule:
            uk: "між приголосними й на початку речення"
            en: "between consonants, and at the start of a sentence"
            es: "entre consonantes, y al principio de la oración"
          ex: ["буди́нок ", { target: і }, " кімна́та"]
          tr: { en: a building and a room, es: un edificio y una habitación }
        - level: A2
          point: { uk: І, en: І, es: І }
          rule:
            uk: ["перед ", { letter: "й, я, ю, є, ї" }, ", навіть після голосної"]
            en: ["before ", { letter: "й, я, ю, є, ї" }, ", even after a vowel"]
            es: ["ante ", { letter: "й, я, ю, є, ї" }, ", incluso tras vocal"]
          ex: ["ма́ма ", { target: і }, " я"]
          tr: { en: Mum and I, es: mamá y yo }
        - level: A1
          point: { uk: З, en: З, es: З }
          rule:
            uk: "перед голосною; перед приголосною — після голосної"
            en: "before a vowel; before a consonant, after a vowel"
            es: "ante vocal; ante consonante, tras vocal"
          ex: { examples: [["Вона́ ", { target: з }, " Алжи́ру."], ["Ми ", { target: з }, " Ки́єва."]] }
          tr: { en: { examples: ["She's from Algeria.", "We're from Kyiv."] }, es: { examples: [Es de Argelia., Somos de Kiev.] } }
        - level: A1
          point: { uk: Зі, en: Зі, es: Зі }
          rule:
            uk: ["перед збігом приголосних, найчастіше з ", { letter: "з, с, ш, щ" }, " на початку"]
            en: ["before a consonant cluster, most often one starting with ", { letter: "з, с, ш, щ" }]
            es: ["ante un grupo de consonantes, sobre todo si empieza por ", { letter: "з, с, ш, щ" }]
          ex: { examples: [[{ target: зі }, " шко́ли"], [{ target: зі }, " мно́ю"], [{ target: зі }, " Льво́ва"]] }
          tr: { en: { examples: [from school, with me, from Lviv] }, es: { examples: [de la escuela, conmigo, de Lviv] } }
        - level: A1
          point: { uk: Із, en: Із, es: Із }
          rule:
            uk: ["між приголосними, особливо перед однією ", { letter: "з, с, ц, ч, ш" }]
            en: ["between consonants, above all before a single ", { letter: "з, с, ц, ч, ш" }]
            es: ["entre consonantes, sobre todo ante una sola ", { letter: "з, с, ц, ч, ш" }]
          ex: ["Він ", { target: із }, " Си́рії."]
          tr: { en: He's from Syria., es: Es de Siria. }

