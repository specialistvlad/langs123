              en: "Stress can move in another form of the same word, so learn each new form with its stress."
              es: "El acento puede cambiar en otra forma de la misma palabra; por eso conviene aprender cada forma nueva con su acento."
              pt: "O acento tônico pode mudar em outra forma da mesma palavra; por isso, é bom aprender cada forma nova com o seu acento."
              fr: "L’accent peut se déplacer dans une autre forme du même mot ; il faut donc apprendre chaque forme nouvelle avec son accent."
              de: "Die Betonung kann in einer anderen Form desselben Wortes wandern; deshalb lernt man jede neue Form mit ihrer Betonung."
              it: "L'accento può spostarsi in un'altra forma della stessa parola; perciò ogni forma nuova si impara con il suo accento."
