# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.foundations.stress
lang: uk
kind: foundations
tags: [stress, pronunciation]
concepts: [pronunciation]
related: [uk.foundations.vowels-consonants, uk.foundations.numbers, uk.nouns-cases.plural]
status: { uk: draft, en: draft, es: draft }
translated: { en: "36dd78 97ddd4 d21cdd aabad4 17246c d226f3 51b0c1 3389a9", es: "36dd78 97ddd4 d21cdd aabad4 17246c d226f3 51b0c1 3389a9" }

title: { uk: Наголос, en: Stress, es: El acento }
summary:
  lead:
    uk: "Наголос в українському слові вільний і рухомий: він падає на будь-який склад, переходить у формах слова й розрізняє слова."
    en: "Ukrainian stress is free and mobile: it can fall on any syllable, move between the forms of a word and tell words apart."
    es: "El acento ucraniano es libre y móvil: cae en cualquier sílaba, cambia entre las formas de una palabra y distingue palabras."
  rule:
    uk: "Наголос розрізняє слова:"
    en: "Stress tells words apart:"
    es: "El acento distingue palabras:"
  ex: { contrast: [{ target: за́мок }, { target: замо́к }] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { uk: Один наголос, en: One stress, es: Un acento }
          rule:
            uk: "у кожному слові один наголошений склад"
            en: "each word has one stressed syllable"
            es: "cada palabra tiene una sílaba tónica"
          ex: { examples: [{ target: ма́ма }, { target: вода́ }] }
          tr: { en: { examples: [mum, water] }, es: { examples: [mamá, agua] } }
        - level: A0
          point: { uk: Вільний наголос, en: Free stress, es: Acento libre }
          rule:
            uk: "може падати на будь-який склад"
            en: "it can fall on any syllable"
            es: "puede caer en cualquier sílaba"
          ex: { examples: [{ target: мо́ре }, { target: доро́га }, { target: молоко́ }] }
          tr: { en: { examples: [sea, road, milk] }, es: { examples: [mar, camino, leche] } }
        - level: A0
          point: { uk: Знак наголосу, en: Stress mark, es: Tilde de acento }
          rule:
            uk: "його ставлять у навчальних текстах і словниках, у звичайних текстах — ні"
            en: "learning texts and dictionaries mark it; ordinary texts do not"
            es: "lo marcan los textos de estudio y los diccionarios; los textos corrientes, no"
          ex: { target: кни́жка }
          tr: { en: book, es: libro }
        - level: A1
          point: { uk: Рухомий наголос, en: Mobile stress, es: Acento móvil }
          rule:
            uk: "переходить у формах того самого слова"
            en: "it moves between the forms of one word"
            es: "cambia de sílaba entre las formas de una palabra"
          ex: { mapping: [{ target: рука́ }, { target: ру́ку }] }
          tr: { en: { mapping: [hand, hand] }, es: { mapping: [mano, mano] } }
        - level: A1
          point: { uk: Множина, en: Plural, es: Plural }
          rule:
            uk: "у множині наголос часто переходить на інший склад"
            en: "in the plural, the stress often moves"
            es: "en plural, el acento suele cambiar de sílaba"
          ex: { mapping: [{ target: сестра́ }, { target: се́стри }] }
          tr: { en: { mapping: [sister, sisters] }, es: { mapping: [hermana, hermanas] } }
        - level: A2
          point: { uk: Різні слова, en: Different words, es: Palabras distintas }
          rule:
            uk: "наголос розрізняє слова з однаковим написанням"
            en: "stress tells apart words spelt the same"
            es: "el acento distingue palabras que se escriben igual"
          ex: { contrast: [{ target: за́мок }, { target: замо́к }] }
          tr: { en: { contrast: [castle, lock] }, es: { contrast: [castillo, cerradura] } }
        - level: A2
          point: { uk: Різні форми, en: Different forms, es: Formas distintas }
          rule:
            uk: "наголос розрізняє форми одного слова"
            en: "stress tells apart forms of one word"
            es: "el acento distingue formas de una misma palabra"
          ex: { contrast: [["мої́ ", { target: ру́ки }], ["моє́ї ", { target: руки́ }]] }
          tr: { en: { contrast: [my hands, of my hand] }, es: { contrast: [mis manos, de mi mano] } }
        - level: A2
          point: { uk: Два варіанти, en: Two options, es: Dos variantes }
          rule:
            uk: "у деяких словах правильні обидва наголоси"
            en: "some words take either stress"
            es: "algunas palabras admiten los dos acentos"
          ex: { equivalence: [{ target: по́милка }, { target: поми́лка }] }
          tr: { en: { equivalence: [mistake, mistake] }, es: { equivalence: [error, error] } }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["у числах 11–19 наголос на ", { term: -на́- }]
            en: ["in the numbers 11–19, the stress falls on ", { term: -на́- }]
            es: ["en los números del 11 al 19, el acento cae en ", { term: -на́- }]
          ex: { examples: [{ target: одина́дцять }, { target: чотирна́дцять }] }
          tr: { en: { examples: [eleven, fourteen] }, es: { examples: [once, catorce] } }

sections:
  - title: { uk: Наголос у слові, en: Stress in a word, es: El acento en la palabra }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Слово має один наголошений склад: його голосний звучить трохи довше й чіткіше."
              en: "A word has one stressed syllable: its vowel sounds a little longer and clearer."
              es: "Una palabra tiene una sílaba tónica: su vocal suena un poco más larga y más clara."
            ex: { examples: [{ target: ма́ма }, { target: вода́ }] }
            tr: { en: { examples: [mum, water] }, es: { examples: [mamá, agua] } }
          - type: rule
            level: A0
            text:
              uk: "Наголос вільний: він може падати на перший, другий, третій чи інший склад."
              en: "Stress is free: it can fall on the first, second, third or any other syllable."
              es: "El acento es libre: puede caer en la primera, la segunda, la tercera o cualquier otra sílaba."
            ex: { examples: [{ target: мо́ре }, { target: доро́га }, { target: молоко́ }] }
            tr: { en: { examples: [sea, road, milk] }, es: { examples: [mar, camino, leche] } }
          - type: rule
            level: A0
            text:
              uk: "У навчальних текстах і словниках наголос позначають знаком над голосною; у звичайних текстах його не пишуть."
              en: "Learning texts and dictionaries mark stress over the vowel; ordinary texts do not write it."
              es: "Los textos de estudio y los diccionarios marcan el acento sobre la vocal; los textos corrientes no lo escriben."
            ex: { target: кни́жка }
            tr: { en: book, es: libro }
          - type: note
            level: A0
            text:
              uk: "Слова з одного складу знака наголосу не мають."
              en: "Words of one syllable carry no stress mark."
              es: "Las palabras de una sílaba no llevan tilde de acento."
            ex: { examples: [ліс, дім, хліб] }
            tr: { en: { examples: [forest, home, bread] }, es: { examples: [bosque, casa, pan] } }

  - title: { uk: Рухомий наголос, en: Mobile stress, es: El acento móvil }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            form: { uk: { mapping: [називний, знахідний] }, en: { mapping: [nominative, accusative] }, es: { mapping: [nominativo, acusativo] } }
            ex: { examples: [{ mapping: [рука́, ру́ку] }, { mapping: [вода́, во́ду] }, { mapping: [голова́, го́лову] }] }
            tr: { en: { examples: [{ mapping: [hand, hand] }, { mapping: [water, water] }, { mapping: [head, head] }] }, es: { examples: [{ mapping: [mano, mano] }, { mapping: [agua, agua] }, { mapping: [cabeza, cabeza] }] } }
          - level: A1
            form: { uk: { mapping: [однина, множина] }, en: { mapping: [singular, plural] }, es: { mapping: [singular, plural] } }
            ex: { examples: [{ mapping: [сестра́, се́стри] }, { mapping: [село́, се́ла] }, { mapping: [вікно́, ві́кна] }] }
            tr: { en: { examples: [{ mapping: [sister, sisters] }, { mapping: [village, villages] }, { mapping: [window, windows] }] }, es: { examples: [{ mapping: [hermana, hermanas] }, { mapping: [pueblo, pueblos] }, { mapping: [ventana, ventanas] }] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Наголос може переходити в іншій формі того самого слова, тому кожну нову форму варто вивчати з наголосом."
              en: "Stress can move in another form of the same word, so learn each new form with its stress."
              es: "El acento puede cambiar en otra forma de la misma palabra; por eso conviene aprender cada forma nueva con su acento."
            ex: ["Я ба́чу ", { target: го́ру }, "."]
            tr: { en: I can see the mountain., es: Veo la montaña. }

  - title: { uk: Наголос розрізняє слова й форми, en: Stress that tells words and forms apart, es: El acento que distingue palabras y formas }
    role: own
    content:
      - type: usage
        columns:
          - { key: pair, label: { uk: Пара, en: Pair, es: Par } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A2
            pair: { contrast: [{ target: за́мок }, { target: замо́к }] }
            ex: { examples: [["Ми ї́демо до ", { target: за́мку }, "."], ["Не мо́жу відімкну́ти ", { target: замо́к }, "."]] }
            tr: { en: { examples: ["We're going to the castle.", "I can't open the lock."] }, es: { examples: [Vamos al castillo., No puedo abrir la cerradura.] } }
          - level: A2
            pair: { contrast: [{ target: доро́га }, { target: дорога́ }] }
            ex: { examples: [["Це ", { target: доро́га }, " до Льво́ва."], ["Ти мені́ ", { target: дорога́ }, "."]] }
            tr: { en: { examples: [This is the road to Lviv., You're dear to me.] }, es: { examples: [Este es el camino a Lviv., Me eres querida.] } }
          - level: A2
            pair: { contrast: [{ target: ру́ки }, { target: руки́ }] }
            ex: { examples: [["мої́ ", { target: ру́ки }], ["без моє́ї ", { target: руки́ }]] }
            tr: { en: { examples: [my hands, without my hand] }, es: { examples: [mis manos, sin mi mano] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "У деяких словах правильні обидва наголоси:"
              en: "Some words take either stress:"
              es: "Algunas palabras admiten los dos acentos:"
            ex: { examples: [{ equivalence: [по́милка, поми́лка] }, { equivalence: [за́вжди, завжди́] }] }
            tr: { en: { examples: [{ equivalence: [mistake, mistake] }, { equivalence: [always, always] }] }, es: { examples: [{ equivalence: [error, error] }, { equivalence: [siempre, siempre] }] } }

  - title: { uk: Склад і перенос, en: Syllables and line breaks, es: Las sílabas y la división de palabras }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "У слові стільки складів, скільки в ньому голосних:"
              en: "A word has as many syllables as it has vowels:"
              es: "Una palabra tiene tantas sílabas como vocales:"
            ex: { examples: [мо-ло-ко́, шко́-ла, ліс] }
            tr: { en: { examples: [milk, school, forest] }, es: { examples: [leche, escuela, bosque] } }
          - type: rule
            level: A1
            text:
              uk: "Слово переносять на інший рядок за складами, а одну літеру не залишають у рядку й не переносять:"
              en: "A word is split at the end of a line by syllables, and a single letter is never left on the line or carried over:"
              es: "Al final de la línea, la palabra se divide por sílabas, y nunca se deja ni se pasa una sola letra:"
            ex: { examples: [ву́-ли-ця, кни́ж-ка, кни́-жка] }
            tr: { en: { examples: [street, book, book] }, es: { examples: [calle, libro, libro] } }
          - type: rule
            level: A1
            text:
              uk: ["Літери ", { letter: ь }, " і ", { letter: й }, " не відокремлюють від попередньої літери:"]
              en: ["The letters ", { letter: ь }, " and ", { letter: й }, " stay with the letter before them:"]
              es: ["Las letras ", { letter: ь }, " y ", { letter: й }, " no se separan de la letra anterior:"]
            ex: { examples: [си́ль-ний, бі́й-ка] }
            tr: { en: { examples: [strong, fight] }, es: { examples: [fuerte, pelea] } }

  - title: { uk: Інтонація, en: Intonation, es: La entonación }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: sentence, label: { uk: Речення, en: Sentence, es: Oración } }
          - { key: tune, label: { uk: Інтонація, en: Voice, es: Entonación } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - { level: A1, sentence: { uk: "розповідне", en: "statement", es: "enunciativa" }, tune: { uk: "знижується в кінці", en: "falls at the end", es: "baja al final" }, ex: ["Це мій брат. ", { intonation: fall }], tr: { en: "This is my brother.", es: "Este es mi hermano." } }
          - { level: A1, sentence: { uk: "питальне без питального слова", en: "question without a question word", es: "pregunta sin palabra interrogativa" }, tune: { uk: "підвищується на слові, про яке питають", en: "rises on the word the question is about", es: "sube en la palabra por la que se pregunta" }, ex: ["Це твій брат? ", { intonation: rise }], tr: { en: "Is this your brother?", es: "¿Este es tu hermano?" } }
          - { level: A1, sentence: { uk: "питальне з питальним словом", en: "question with a question word", es: "pregunta con palabra interrogativa" }, tune: { uk: "знижується в кінці", en: "falls at the end", es: "baja al final" }, ex: ["Де ти живе́ш? ", { intonation: fall }], tr: { en: "Where do you live?", es: "¿Dónde vives?" } }
          - { level: A1, sentence: { uk: "окличне", en: "exclamation", es: "exclamativa" }, tune: { uk: "голос підвищується й сильнішає на головному слові", en: "the voice rises and grows stronger on the key word", es: "la voz sube y se refuerza en la palabra clave" }, ex: "Яки́й га́рний день!", tr: { en: "What a lovely day!", es: "¡Qué día tan bonito!" } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: оди́надцять, right: { target: одина́дцять }, rule: { uk: ["у числах 11–19 наголос на ", { term: -на́- }, "; інший наголос — під впливом російської"], en: ["11–19 are stressed on ", { term: -на́- }, "; the other stress comes from Russian"], es: ["del 11 al 19 el acento va en ", { term: -на́- }, "; el otro acento viene del ruso"] } }
          - { level: A1, wrong: чоти́рнадцять, right: { target: чотирна́дцять }, rule: { uk: ["наголос на ", { term: -на́- }], en: ["the stress falls on ", { term: -на́- }], es: ["el acento va en ", { term: -на́- }] } }
          - { level: A1, wrong: до́чка, right: { target: дочка́ }, rule: { uk: ["в однині ", { term: дочка́ }, " має наголос на закінченні"], en: ["in the singular, ", { term: дочка́ }, " is stressed on the ending"], es: ["en singular, ", { term: дочка́ }, " lleva el acento en la terminación"] } }
          - { level: A2, wrong: кіло́метр, right: { target: кіломе́тр }, rule: { uk: ["наголос на ", { term: -ме́тр }], en: ["the stress falls on ", { term: -ме́тр }], es: ["el acento va en ", { term: -ме́тр }] } }
          - { level: A2, wrong: випа́док, right: { target: ви́падок }, rule: { uk: ["наголос на першому складі: ", { term: ви́падок }], en: ["the stress falls on the first syllable: ", { term: ви́падок }], es: ["el acento va en la primera sílaba: ", { term: ви́падок }] } }
