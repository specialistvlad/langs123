title: { uk: Наголос, en: Stress, es: El acento, pt: "O acento tônico", fr: "L’accent tonique", de: "Die Betonung", it: "L'accento", pl: "Akcent", tr: "Vurgu", id: "Tekanan", vi: "Trọng âm" }
summary:
  lead:
    uk: "Наголос в українському слові вільний і рухомий: він падає на будь-який склад, переходить у формах слова й розрізняє слова."
    en: "Ukrainian stress is free and mobile: it can fall on any syllable, move between the forms of a word and tell words apart."
    es: "El acento ucraniano es libre y móvil: cae en cualquier sílaba, cambia entre las formas de una palabra y distingue palabras."
    pt: "O acento tônico ucraniano é livre e móvel: cai em qualquer sílaba, muda de lugar entre as formas de uma palavra e distingue palavras."
    fr: "L’accent ukrainien est libre et mobile : il tombe sur n’importe quelle syllabe, se déplace entre les formes d’un mot et distingue des mots."
    de: "Die ukrainische Betonung ist frei und beweglich: Sie liegt auf jeder Silbe, wandert zwischen den Formen eines Wortes und unterscheidet Wörter."
    it: "L'accento ucraino è libero e mobile: cade su qualsiasi sillaba, si sposta tra le forme di una parola e distingue le parole."
    pl: "Akcent ukraiński jest swobodny i ruchomy: pada na dowolną sylabę, przesuwa się między formami wyrazu i odróżnia wyrazy."
    tr: "Ukraynacada vurgu serbest ve hareketlidir: her heceye düşebilir, sözcüğün biçimleri arasında kayar ve sözcükleri ayırt eder."
    id: "Tekanan dalam bahasa Ukraina bebas dan berpindah: jatuh pada suku kata mana saja, bergeser antarbentuk kata, dan membedakan kata."
    vi: "Trọng âm tiếng Ukraina tự do và di động: rơi vào bất kỳ âm tiết nào, chuyển chỗ giữa các dạng của một từ và phân biệt các từ."
  rule:
    uk: "Наголос розрізняє слова:"
    en: "Stress tells words apart:"
    es: "El acento distingue palabras:"
    pt: "O acento tônico distingue palavras:"
    fr: "L’accent distingue des mots :"
    de: "Die Betonung unterscheidet Wörter:"
    it: "L'accento distingue le parole:"
    pl: "Akcent odróżnia wyrazy:"
    tr: "Vurgu sözcükleri ayırt eder:"
    id: "Tekanan membedakan kata:"
    vi: "Trọng âm phân biệt các từ:"
  ex: { contrast: [{ target: за́мок }, { target: замо́к }] }

