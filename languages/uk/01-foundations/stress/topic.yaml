  - title: { uk: Склад і перенос, en: Syllables and line breaks, es: Las sílabas y la división de palabras, pt: "Sílabas e divisão de palavras", fr: "Les syllabes et la coupure des mots", de: "Silben und Worttrennung", it: "Le sillabe e la divisione in fine riga", pl: "Sylaby i przenoszenie wyrazów", tr: "Heceler ve satır sonunda bölme", id: "Suku kata dan pemenggalan kata", vi: "Âm tiết và ngắt dòng" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "У слові стільки складів, скільки в ньому голосних:"
              en: "A word has as many syllables as it has vowels:"
              es: "Una palabra tiene tantas sílabas como vocales:"
              pt: "Uma palavra tem tantas sílabas quantas são as suas vogais:"
              fr: "Un mot a autant de syllabes que de voyelles :"
              de: "Ein Wort hat so viele Silben, wie es Vokale hat:"
              it: "Una parola ha tante sillabe quante sono le sue vocali:"
              pl: "Wyraz ma tyle sylab, ile ma samogłosek:"
              tr: "Bir sözcükte kaç ünlü varsa o kadar hece vardır:"
              id: "Sebuah kata memiliki suku kata sebanyak vokalnya:"
              vi: "Một từ có bao nhiêu nguyên âm thì có bấy nhiêu âm tiết:"
            ex: { examples: [мо-ло-ко́, шко́-ла, ліс] }
            tr: { en: { examples: [milk, school, forest] }, es: { examples: [leche, escuela, bosque] }, pt: { examples: ["leite", "escola", "floresta"] }, fr: { examples: ["lait", "école", "forêt"] }, de: { examples: ["Milch", "Schule", "Wald"] }, it: { examples: ["latte", "scuola", "bosco"] }, pl: { examples: ["mleko", "szkoła", "las"] }, tr: { examples: ["süt", "okul", "orman"] }, id: { examples: ["susu", "sekolah", "hutan"] }, vi: { examples: ["sữa", "trường học", "rừng"] } }
          - type: rule
            level: A1
            text:
              uk: "Слово переносять на інший рядок за складами, а одну літеру не залишають у рядку й не переносять:"
              en: "A word is split at the end of a line by syllables, and a single letter is never left on the line or carried over:"
              es: "Al final de la línea, la palabra se divide por sílabas, y nunca se deja ni se pasa una sola letra:"
              pt: "No fim da linha, a palavra se divide por sílabas, e nunca se deixa nem se passa adiante uma letra sozinha:"
              fr: "En fin de ligne, on coupe le mot par syllabes, et l’on ne laisse ni ne reporte jamais une lettre seule :"
              de: "Am Zeilenende trennt man ein Wort nach Silben; ein einzelner Buchstabe bleibt nie allein stehen und wird nie allein übertragen:"
              it: "A fine riga la parola si divide per sillabe, e una lettera sola non si lascia né si porta a capo:"
              pl: "Na końcu wiersza wyraz dzieli się na sylaby, a pojedynczej litery nie zostawia się w wierszu ani nie przenosi:"
              tr: "Satır sonunda sözcük hecelerine göre bölünür; tek bir harf ne satırda bırakılır ne de alt satıra taşınır:"
              id: "Di akhir baris, kata dipenggal menurut suku katanya; satu huruf saja tidak ditinggalkan di baris itu dan tidak dipindahkan:"
              vi: "Cuối dòng, từ được ngắt theo âm tiết; một chữ cái đơn lẻ không được để lại ở dòng cũ và không được chuyển xuống dòng mới:"
