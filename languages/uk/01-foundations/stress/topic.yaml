sections:
  - title: { uk: Наголос у слові, en: Stress in a word, es: El acento en la palabra, pt: "O acento tônico na palavra", fr: "L’accent dans le mot", de: "Die Betonung im Wort", it: "L'accento nella parola", pl: "Akcent w wyrazie", tr: "Sözcükte vurgu", id: "Tekanan dalam kata", vi: "Trọng âm trong từ" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Слово має один наголошений склад: його голосний звучить трохи довше й чіткіше."
              en: "A word has one stressed syllable: its vowel sounds a little longer and clearer."
              es: "Una palabra tiene una sílaba tónica: su vocal suena un poco más larga y más clara."
              pt: "Uma palavra tem uma sílaba tônica: sua vogal soa um pouco mais longa e mais clara."
              fr: "Un mot a une syllabe accentuée : sa voyelle sonne un peu plus longue et plus nette."
              de: "Ein Wort hat eine betonte Silbe: Ihr Vokal klingt etwas länger und deutlicher."
              it: "Una parola ha una sillaba accentata: la sua vocale suona un po' più lunga e più chiara."
              pl: "Wyraz ma jedną sylabę akcentowaną: jej samogłoska brzmi nieco dłużej i wyraźniej."
              tr: "Her sözcükte vurgulu bir hece vardır: bu hecenin ünlüsü biraz daha uzun ve açık çıkar."
              id: "Satu kata punya satu suku kata bertekanan: vokalnya terdengar sedikit lebih panjang dan jelas."
              vi: "Một từ có một âm tiết mang trọng âm: nguyên âm của nó nghe dài và rõ hơn một chút."
            ex: { examples: [{ target: ма́ма }, { target: вода́ }] }
            tr: { en: { examples: [mum, water] }, es: { examples: [mamá, agua] }, pt: { examples: ["mamãe", "água"] }, fr: { examples: ["maman", "eau"] }, de: { examples: ["Mama", "Wasser"] }, it: { examples: ["mamma", "acqua"] }, pl: { examples: ["mama", "woda"] }, tr: { examples: ["anne", "su"] }, id: { examples: ["ibu", "air"] }, vi: { examples: ["mẹ", "nước"] } }
          - type: rule
            level: A0
            text:
              uk: "Наголос вільний: він може падати на перший, другий, третій чи інший склад."
              en: "Stress is free: it can fall on the first, second, third or any other syllable."
              es: "El acento es libre: puede caer en la primera, la segunda, la tercera o cualquier otra sílaba."
              pt: "O acento tônico é livre: pode cair na primeira, na segunda, na terceira ou em qualquer outra sílaba."
              fr: "L’accent est libre : il peut tomber sur la première, la deuxième, la troisième ou n’importe quelle autre syllabe."
              de: "Die Betonung ist frei: Sie kann auf der ersten, zweiten, dritten oder jeder anderen Silbe liegen."
              it: "L'accento è libero: può cadere sulla prima, sulla seconda, sulla terza o su qualsiasi altra sillaba."
              pl: "Akcent jest swobodny: może paść na pierwszą, drugą, trzecią lub inną sylabę."
              tr: "Vurgu serbesttir: birinci, ikinci, üçüncü ya da başka herhangi bir heceye düşebilir."
              id: "Tekanan bebas: dapat jatuh pada suku kata pertama, kedua, ketiga, atau suku kata mana pun."
