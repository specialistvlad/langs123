summary:
  lead:
    uk: "Шість голосних звуків, тверді й м’які, дзвінкі й глухі приголосні та звуки дж і дз."
    en: "The six vowel sounds, hard and soft, voiced and voiceless consonants, and the sounds дж and дз."
    es: "Los seis sonidos vocálicos, las consonantes duras y blandas, sonoras y sordas, y los sonidos дж y дз."
    pt: "Os seis sons vocálicos, as consoantes duras e suaves, sonoras e surdas, e os sons дж e дз."
    fr: "Les six sons vocaliques, les consonnes dures et molles, voisées et sourdes, et les sons дж et дз."
    de: "Die sechs Vokallaute, harte und weiche, stimmhafte und stimmlose Konsonanten sowie die Laute дж und дз."
    it: "I sei suoni vocalici, le consonanti dure e molli, sonore e sorde, e i suoni дж e дз."
    pl: "Sześć dźwięków samogłoskowych, spółgłoski twarde i miękkie, dźwięczne i bezdźwięczne oraz dźwięki дж i дз."
    tr: "Altı ünlü ses, sert ve yumuşak, ötümlü ve ötümsüz ünsüzler ile дж ve дз sesleri."
    id: "Enam bunyi vokal, konsonan keras dan lunak, bersuara dan tak bersuara, serta bunyi дж dan дз."
    vi: "Sáu nguyên âm, phụ âm cứng và mềm, hữu thanh và vô thanh, cùng các âm дж và дз."
  rule:
    uk: "Дзвінкі приголосні в кінці слова звучать дзвінко:"
    en: "Voiced consonants stay voiced at the end of a word:"
    es: "Las consonantes sonoras siguen sonoras al final de la palabra:"
    pt: "As consoantes sonoras continuam sonoras no fim da palavra:"
    fr: "Les consonnes voisées restent voisées en fin de mot :"
    de: "Stimmhafte Konsonanten bleiben am Wortende stimmhaft:"
    it: "Le consonanti sonore restano sonore a fine parola:"
    pl: "Spółgłoski dźwięczne na końcu wyrazu pozostają dźwięczne:"
    tr: "Ötümlü ünsüzler sözcük sonunda ötümlü kalır:"
    id: "Konsonan bersuara tetap bersuara di akhir kata:"
    vi: "Phụ âm hữu thanh vẫn hữu thanh ở cuối từ:"
  ex: { examples: [["ду", { target: { letter: б } }], ["ні", { target: { letter: ж } }]] }

