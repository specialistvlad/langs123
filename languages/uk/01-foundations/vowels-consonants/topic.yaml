          de: ["Es gibt sechs Vokallaute. Die Buchstaben ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " und ", { letter: ї }, " haben keinen eigenen Laut: Sie schreiben ", { ipa: j }, " und einen Vokal oder einen weichen Konsonanten vor einem Vokal."]
          it: ["Ci sono sei suoni vocalici. Le lettere ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " e ", { letter: ї }, " non hanno un suono proprio: scrivono ", { ipa: j }, " e una vocale, oppure una consonante molle prima di una vocale."]
          pl: ["Jest sześć dźwięków samogłoskowych. Litery ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " i ", { letter: ї }, " nie mają własnych dźwięków: zapisują ", { ipa: j }, " i samogłoskę albo miękką spółgłoskę przed samogłoską."]
          tr: ["Altı ünlü ses vardır. ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " ve ", { letter: ї }, " harflerinin kendilerine ait sesleri yoktur: bunlar ", { ipa: j }, " ile bir ünlüyü ya da ünlüden önceki yumuşak ünsüzü gösterir."]
          id: ["Ada enam bunyi vokal. Huruf ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " dan ", { letter: ї }, " tidak punya bunyi sendiri: huruf-huruf itu menuliskan ", { ipa: j }, " dan sebuah vokal, atau konsonan lunak sebelum vokal."]
          vi: ["Có sáu nguyên âm. Các chữ cái ", { letter: я }, ", ", { letter: ю }, ", ", { letter: є }, " và ", { letter: ї }, " không có âm riêng: chúng ghi ", { ipa: j }, " cùng một nguyên âm, hoặc ghi phụ âm mềm đứng trước nguyên âm."]
