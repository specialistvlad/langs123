sections:
  - title: { uk: Дні тижня, en: Days of the week, es: Los días de la semana, pt: "Dias da semana", fr: "Jours de la semaine", de: "Wochentage", it: "Giorni della settimana", pl: "Dni tygodnia", tr: "Haftanın günleri", id: "Hari dalam seminggu", vi: "Các thứ trong tuần" }
    role: own
    content:
      - type: inventory
        set: days
        columns:
          - { key: day, label: { uk: День, en: Day, es: Día, pt: "Dia", fr: "Jour", de: "Tag", it: "Giorno", pl: "Dzień", tr: "Gün", id: "Hari", vi: "Thứ" } }
