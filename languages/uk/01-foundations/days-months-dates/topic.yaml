        rows:
          - { level: A0, value: 1, day: понеді́лок, short: пн, tr: { en: Monday, es: lunes, pt: "segunda-feira", fr: "lundi", de: "Montag", it: "lunedì", pl: "poniedziałek", tr: "pazartesi", id: "Senin", vi: "thứ hai" } }
