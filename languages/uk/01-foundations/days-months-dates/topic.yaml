          - type: note
            level: A1
            text:
              uk: [{ term: понеді́лок }, ", ", { term: вівто́рок }, ", ", { term: четве́р }, " не змінюються; ", { term: середа́ }, " змінює наголос: ", { term: у се́реду }, "."]
              en: [{ term: понеді́лок }, ", ", { term: вівто́рок }, " and ", { term: четве́р }, " do not change; ", { term: середа́ }, " moves its stress: ", { term: у се́реду }, "."]
              es: [{ term: понеді́лок }, ", ", { term: вівто́рок }, " y ", { term: четве́р }, " no cambian; ", { term: середа́ }, " cambia el acento: ", { term: у се́реду }, "."]
