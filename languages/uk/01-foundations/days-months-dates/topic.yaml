# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.foundations.days-months-dates
lang: uk
kind: foundations
tags: [days, months, seasons, dates]
concepts: [dates]
related: [uk.foundations.numbers, uk.foundations.telling-time, uk.prepositions.prepositions-time, uk.numerals.ordinals]
status: { uk: draft, en: draft, es: draft }
translated: { en: "66d3de 930fbd 216ff0 268ff5 e7d3b2 30dea7", es: "66d3de 930fbd 216ff0 268ff5 e7d3b2 30dea7" }

title: { uk: "Дні, місяці, дати", en: "Days, Months and Dates", es: "Días, meses y fechas" }
summary:
  lead:
    uk: "Дні тижня, місяці й пори року, як сказати, коли щось відбувається, і як назвати дату."
    en: "The days of the week, the months and the seasons, how to say when something happens, and how to give a date."
    es: "Los días de la semana, los meses y las estaciones, cómo decir cuándo pasa algo y cómo dar una fecha."
  rule:
    uk: ["Коли? День стоїть у знахідному відмінку, місяць — у місцевому: ", { target: у се́реду }, ", ", { target: у тра́вні }, "."]
    en: ["When? puts the day in the accusative and the month in the locative: ", { target: у се́реду }, " (on Wednesday), ", { target: у тра́вні }, " (in May)."]
    es: ["Para decir cuándo, el día va en acusativo y el mes en locativo: ", { target: у се́реду }, " (el miércoles), ", { target: у тра́вні }, " (en mayo)."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { uk: Дні тижня, en: Days of the week, es: Días de la semana }
          rule:
            uk: "сім днів, з малої літери"
            en: "seven days, with a small letter"
            es: "siete días, con minúscula"
          ex: { examples: [{ weekday: понеді́лок, value: 1 }, { weekday: субо́та, value: 6 }] }
          tr: { en: { examples: [Monday, Saturday] }, es: { examples: [lunes, sábado] } }
        - level: A0
          point: { uk: Який день?, en: Which day?, es: ¿Qué día? }
          rule:
            uk: [{ term: Яки́й сього́дні день? }, " — назва дня"]
            en: [{ term: Яки́й сього́дні день? }, " is answered with the day"]
            es: [{ term: Яки́й сього́дні день? }, " se responde con el día"]
          ex: ["Сього́дні ", { target: { weekday: п’я́тниця, value: 5 } }, "."]
          tr: { en: "It's Friday today.", es: Hoy es viernes. }
        - level: A0
          point: { uk: Місяці, en: Months, es: Meses }
          rule:
            uk: "дванадцять місяців, з малої літери"
            en: "twelve months, with a small letter"
            es: "doce meses, con minúscula"
          ex: { examples: [{ date: сі́чень, value: "--01" }, { date: тра́вень, value: "--05" }] }
          tr: { en: { examples: [January, May] }, es: { examples: [enero, mayo] } }
        - level: A0
          point: { uk: Пори року, en: Seasons, es: Estaciones }
          rule:
            uk: "чотири пори року"
            en: "four seasons"
            es: "cuatro estaciones"
          ex: { examples: [весна́, лі́то, о́сінь, зима́] }
          tr: { en: { examples: [spring, summer, autumn, winter] }, es: { examples: [primavera, verano, otoño, invierno] } }
        - level: A1
          point: { uk: Коли? День, en: When? Day, es: ¿Cuándo? Día }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, " і знахідний відмінок"]
            en: [{ alternatives: [{ term: у }, { term: в }] }, " with the accusative"]
            es: [{ alternatives: [{ term: у }, { term: в }] }, " con el acusativo"]
          ex: ["До зу́стрічі ", { target: ["в ", { weekday: понеді́лок, value: 1 }] }, "!"]
          tr: { en: See you on Monday!, es: ¡Hasta el lunes! }
        - level: A1
          point: { uk: Коли? Місяць, en: When? Month, es: ¿Cuándo? Mes }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, " і місцевий відмінок"]
            en: [{ alternatives: [{ term: у }, { term: в }] }, " with the locative"]
            es: [{ alternatives: [{ term: у }, { term: в }] }, " con el locativo"]
          ex: ["Марі́я народи́лася ", { target: ["в ", { date: тра́вні, value: "--05" }] }, "."]
          tr: { en: Mariia was born in May., es: Mariia nació en mayo. }
        - level: A1
          point: { uk: Коли? Пора року, en: When? Season, es: ¿Cuándo? Estación }
          rule:
            uk: "прислівник без прийменника"
            en: "an adverb, with no preposition"
            es: "un adverbio, sin preposición"
          ex: { examples: [{ target: навесні́ }, { target: влі́тку }, { target: восени́ }, { target: взи́мку }] }
          tr: { en: { examples: [in spring, in summer, in autumn, in winter] }, es: { examples: [en primavera, en verano, en otoño, en invierno] } }
        - level: A2
          point: { uk: Дата, en: Date, es: Fecha }
          rule:
            uk: "коли? — порядкове число й місяць у родовому відмінку"
            en: "when? takes the ordinal and the month in the genitive"
            es: "¿cuándo? lleva el ordinal y el mes en genitivo"
          ex: ["Я народи́вся ", { target: { date: деся́того бе́резня, value: "--03-10" } }, "."]
          tr: { en: I was born on the tenth of March., es: Nací el diez de marzo. }
        - level: A2
          point: { uk: Рік, en: Year, es: Año }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, ", порядкове число й ", { term: ро́ці }]
            en: [{ alternatives: [{ term: у }, { term: в }] }, ", the ordinal and ", { term: ро́ці }]
            es: [{ alternatives: [{ term: у }, { term: в }] }, ", el ordinal y ", { term: ро́ці }]
          ex: ["Ми познайо́милися ", { target: ["в ", { date: дві ти́сячі чотирна́дцятому ро́ці, value: "2014" }] }, "."]
          tr: { en: We met in 2014., es: Nos conocimos en 2014. }
        - level: A2
          point: { uk: Наступний і минулий, en: Next and last, es: Próximo y pasado }
          rule:
            uk: "родовий відмінок без прийменника"
            en: "the genitive, with no preposition"
            es: "el genitivo, sin preposición"
          ex: [{ target: Насту́пної середи́ }, " бу́де екску́рсія."]
          tr: { en: "There's a tour next Wednesday.", es: El próximo miércoles hay una excursión. }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: [{ term: середа́ }, ", але ", { term: у се́реду }]
            en: [{ term: середа́ }, ", but ", { term: у се́реду }]
            es: [{ term: середа́ }, ", pero ", { term: у се́реду }]
          ex: ["Ми ба́чимося ", { target: ["в ", { weekday: се́реду, value: 3 }] }, "."]
          tr: { en: "We're meeting on Wednesday.", es: Nos vemos el miércoles. }

sections:
  - title: { uk: Дні тижня, en: Days of the week, es: Los días de la semana }
    role: own
    content:
      - type: inventory
        set: days
        columns:
          - { key: day, label: { uk: День, en: Day, es: Día } }
          - { key: short, label: { uk: Скорочення, en: Short form, es: Abreviatura } }
        rows:
          - { level: A0, value: 1, day: понеді́лок, short: пн, tr: { en: Monday, es: lunes } }
          - { level: A0, value: 2, day: вівто́рок, short: вт, tr: { en: Tuesday, es: martes } }
          - { level: A0, value: 3, day: середа́, short: ср, tr: { en: Wednesday, es: miércoles } }
          - { level: A0, value: 4, day: четве́р, short: чт, tr: { en: Thursday, es: jueves } }
          - { level: A0, value: 5, day: п’я́тниця, short: пт, tr: { en: Friday, es: viernes } }
          - { level: A0, value: 6, day: субо́та, short: сб, tr: { en: Saturday, es: sábado } }
          - { level: A0, value: 7, day: неді́ля, short: нд, tr: { en: Sunday, es: domingo } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Тиждень починається з понеділка. Назви днів пишуть із малої літери."
              en: "The week starts on Monday. Days take a small letter."
              es: "La semana empieza el lunes. Los días van con minúscula."
          - type: example
            level: A0
            ex: { exchange: ["Яки́й сього́дні день?", ["Сього́дні ", { target: { weekday: середа́, value: 3 } }, "."]] }
            tr: { en: { exchange: [What day is it today?, "It's Wednesday today."] }, es: { exchange: [¿Qué día es hoy?, Hoy es miércoles.] } }
          - type: rule
            level: A1
            text:
              uk: ["Коли? — ", { alternatives: [{ term: у }, { term: в }] }, " і знахідний відмінок: ", { term: -а }, " змінюється на ", { term: -у }, ", ", { term: -я }, " на ", { term: -ю }, ":"]
              en: ["When? takes ", { alternatives: [{ term: у }, { term: в }] }, " and the accusative: ", { term: -а }, " becomes ", { term: -у }, ", and ", { term: -я }, " becomes ", { term: -ю }, ":"]
              es: ["¿Cuándo? lleva ", { alternatives: [{ term: у }, { term: в }] }, " y el acusativo: ", { term: -а }, " pasa a ", { term: -у }, ", y ", { term: -я }, " a ", { term: -ю }, ":"]
            ex: { examples: [["у ", { target: { weekday: п’я́тницю, value: 5 } }], ["у ", { target: { weekday: субо́ту, value: 6 } }], ["у ", { target: { weekday: неді́лю, value: 7 } }]] }
            tr: { en: { examples: [on Friday, on Saturday, on Sunday] }, es: { examples: [el viernes, el sábado, el domingo] } }
          - type: note
            level: A1
            text:
              uk: [{ term: понеді́лок }, ", ", { term: вівто́рок }, ", ", { term: четве́р }, " не змінюються; ", { term: середа́ }, " змінює наголос: ", { term: у се́реду }, "."]
              en: [{ term: понеді́лок }, ", ", { term: вівто́рок }, " and ", { term: четве́р }, " do not change; ", { term: середа́ }, " moves its stress: ", { term: у се́реду }, "."]
              es: [{ term: понеді́лок }, ", ", { term: вівто́рок }, " y ", { term: четве́р }, " no cambian; ", { term: середа́ }, " cambia el acento: ", { term: у се́реду }, "."]

  - title: { uk: Місяці й пори року, en: Months and seasons, es: Los meses y las estaciones }
    role: own
    content:
      - type: inventory
        set: months
        columns:
          - { key: month, label: { uk: Місяць, en: Month, es: Mes } }
          - { key: when, label: { uk: Коли?, en: When?, es: ¿Cuándo? } }
        rows:
          - { level: A1, value: "--01", month: сі́чень, when: ["у ", { target: сі́чні }], tr: { en: January, es: enero } }
          - { level: A1, value: "--02", month: лю́тий, when: ["у ", { target: лю́тому }], tr: { en: February, es: febrero } }
          - { level: A1, value: "--03", month: бе́резень, when: ["у ", { target: бе́резні }], tr: { en: March, es: marzo } }
          - { level: A1, value: "--04", month: кві́тень, when: ["у ", { target: кві́тні }], tr: { en: April, es: abril } }
          - { level: A1, value: "--05", month: тра́вень, when: ["у ", { target: тра́вні }], tr: { en: May, es: mayo } }
          - { level: A1, value: "--06", month: че́рвень, when: ["у ", { target: че́рвні }], tr: { en: June, es: junio } }
          - { level: A1, value: "--07", month: ли́пень, when: ["у ", { target: ли́пні }], tr: { en: July, es: julio } }
          - { level: A1, value: "--08", month: се́рпень, when: ["у ", { target: се́рпні }], tr: { en: August, es: agosto } }
          - { level: A1, value: "--09", month: ве́ресень, when: ["у ", { target: ве́ресні }], tr: { en: September, es: septiembre } }
          - { level: A1, value: "--10", month: жо́втень, when: ["у ", { target: жо́втні }], tr: { en: October, es: octubre } }
          - { level: A1, value: "--11", month: листопа́д, when: ["у ", { target: листопа́ді }], tr: { en: November, es: noviembre } }
          - { level: A1, value: "--12", month: гру́день, when: ["у ", { target: гру́дні }], tr: { en: December, es: diciembre } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Назви місяців пишуть із малої літери. Більшість із них закінчується на -ень."
              en: "Months take a small letter. Most of them end in -ень."
              es: "Los meses van con minúscula. La mayoría termina en -ень."
            ex: { examples: [{ date: сі́чень, value: "--01" }, { date: лю́тий, value: "--02" }, { date: листопа́д, value: "--11" }] }
            tr: { en: { examples: [January, February, November] }, es: { examples: [enero, febrero, noviembre] } }
          - type: rule
            level: A1
            text:
              uk: ["Коли? — ", { alternatives: [{ term: у }, { term: в }] }, " і місцевий відмінок: ", { term: -ень }, " стає ", { term: -ні }, "."]
              en: ["When? takes ", { alternatives: [{ term: у }, { term: в }] }, " and the locative: ", { term: -ень }, " becomes ", { term: -ні }, "."]
              es: ["¿Cuándo? lleva ", { alternatives: [{ term: у }, { term: в }] }, " y el locativo: ", { term: -ень }, " pasa a ", { term: -ні }, "."]
            ex: ["Заня́ття почина́ються ", { target: ["у ", { date: ве́ресні, value: "--09" }] }, "."]
            tr: { en: Classes start in September., es: Las clases empiezan en septiembre. }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Є чотири пори року:"
              en: "There are four seasons:"
              es: "Hay cuatro estaciones:"
            ex: { examples: [весна́, лі́то, о́сінь, зима́] }
            tr: { en: { examples: [spring, summer, autumn, winter] }, es: { examples: [primavera, verano, otoño, invierno] } }
      - type: usage
        columns:
          - { key: season, label: { uk: Пора року, en: Season, es: Estación } }
          - { key: when, label: { uk: Коли?, en: When?, es: ¿Cuándo? } }
        rows:
          - { level: A1, season: весна́, when: { target: навесні́ }, tr: { en: in spring, es: en primavera } }
          - { level: A1, season: лі́то, when: { target: влі́тку }, tr: { en: in summer, es: en verano } }
          - { level: A1, season: о́сінь, when: { target: восени́ }, tr: { en: in autumn, es: en otoño } }
          - { level: A1, season: зима́, when: { target: взи́мку }, tr: { en: in winter, es: en invierno } }

  - title: { uk: Дати, en: Dates, es: Las fechas }
    role: own
    content:
      - type: inventory
        set: dates
        columns:
          - { key: date, label: { uk: Дата, en: Date, es: Fecha } }
          - { key: when, label: { uk: Коли?, en: When?, es: ¿Cuándo? } }
        rows:
          - { level: A2, value: "--09-01", date: "1.09", when: { target: { date: пе́ршого ве́ресня, value: "--09-01" } }, tr: { en: on the first of September, es: el uno de septiembre } }
          - { level: A2, value: "--03-10", date: "10.03", when: { target: { date: деся́того бе́резня, value: "--03-10" } }, tr: { en: on the tenth of March, es: el diez de marzo } }
          - { level: A2, value: "--10-18", date: "18.10", when: { target: { date: вісімна́дцятого жо́втня, value: "--10-18" } }, tr: { en: on the eighteenth of October, es: el dieciocho de octubre } }
          - { level: A2, value: "--08-24", date: "24.08", when: { target: { date: два́дцять четве́ртого се́рпня, value: "--08-24" } }, tr: { en: on the twenty-fourth of August, es: el veinticuatro de agosto } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Коли? — порядкове число й назва місяця в родовому відмінку, без прийменника."
              en: "When? takes the ordinal number and the month in the genitive, with no preposition."
              es: "¿Cuándo? lleva el número ordinal y el mes en genitivo, sin preposición."
            ex: ["Екску́рсія бу́де ", { target: { date: вісімна́дцятого жо́втня, value: "--10-18" } }, "."]
            tr: { en: The tour is on the eighteenth of October., es: La excursión es el dieciocho de octubre. }
          - type: rule
            level: A2
            text:
              uk: "Яке сьогодні число? — порядкове число середнього роду в називному відмінку й місяць у родовому."
              en: "What's the date today? takes a neuter ordinal number in the nominative and the month in the genitive."
              es: "¿Qué fecha es hoy? lleva un ordinal neutro en nominativo y el mes en genitivo."
            ex: { exchange: ["Яке́ сього́дні число́?", ["Сього́дні ", { target: { date: деся́те бе́резня, value: "--03-10" } }, "."]] }
            tr: { en: { exchange: ["What's the date today?", "Today is the tenth of March."] }, es: { exchange: ["¿Qué fecha es hoy?", "Hoy es diez de marzo."] } }
          - type: rule
            level: A2
            text:
              uk: ["Рік: ", { alternatives: [{ term: у }, { term: в }] }, ", порядкове число в місцевому відмінку й ", { term: ро́ці }, "."]
              en: ["The year takes ", { alternatives: [{ term: у }, { term: в }] }, ", the ordinal in the locative and ", { term: ро́ці }, "."]
              es: ["El año lleva ", { alternatives: [{ term: у }, { term: в }] }, ", el ordinal en locativo y ", { term: ро́ці }, "."]
            ex: ["Ми познайо́милися ", { target: ["в ", { date: дві ти́сячі чотирна́дцятому ро́ці, value: "2014" }] }, "."]
            tr: { en: We met in 2014., es: Nos conocimos en 2014. }
          - type: rule
            level: A2
            text:
              uk: ["Зі словами ", { term: насту́пний }, " і ", { term: мину́лий }, " — родовий відмінок без прийменника:"]
              en: ["With ", { term: насту́пний }, " (next) and ", { term: мину́лий }, " (last), use the genitive with no preposition:"]
              es: ["Con ", { term: насту́пний }, " (próximo) y ", { term: мину́лий }, " (pasado) va el genitivo sin preposición:"]
            ex: [{ target: Насту́пної середи́ }, " бу́де ціка́ва екску́рсія."]
            tr: { en: "There's an interesting tour next Wednesday.", es: El próximo miércoles hay una excursión interesante. }
          - type: note
            level: A2
            text:
              uk: "Дату пишуть так: число, місяць, рік — 10.03.2026 або 10 березня 2026 р."
              en: "A written date runs day, month, year: 10.03.2026 or 10 березня 2026 р."
              es: "Una fecha escrita va en orden día, mes, año: 10.03.2026 o 10 березня 2026 р."
          - type: note
            level: A2
            text:
              uk: ["Порядкові числа: ", { link: Порядкові числівники, to: uk.numerals.ordinals }, "."]
              en: ["Ordinal numbers: ", { link: Ordinal Numbers, to: uk.numerals.ordinals }, "."]
              es: ["Los números ordinales: ", { link: Los ordinales, to: uk.numerals.ordinals }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Сього́дні Понеді́лок., right: ["Сього́дні ", { target: понеді́лок }, "."], rule: { uk: "назви днів пишуть із малої літери", en: "days take a small letter", es: "los días van con minúscula" } }
