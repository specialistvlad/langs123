      - type: list
        items:
          - type: rule
            level: A0
            text:
              uk: "Тиждень починається з понеділка. Назви днів пишуть із малої літери."
              en: "The week starts on Monday. Days take a small letter."
              es: "La semana empieza el lunes. Los días van con minúscula."
              pt: "A semana começa na segunda-feira. Os dias levam letra minúscula."
              fr: "La semaine commence le lundi. Les jours prennent une minuscule."
              de: "Die Woche beginnt am Montag. Die Wochentage werden kleingeschrieben."
              it: "La settimana inizia il lunedì. I giorni vogliono la lettera minuscola."
              pl: "Tydzień zaczyna się w poniedziałek. Nazwy dni piszemy małą literą."
              tr: "Hafta pazartesi günü başlar. Gün adları küçük harfle yazılır."
              id: "Satu minggu dimulai pada hari Senin. Nama hari ditulis dengan huruf kecil."
              vi: "Tuần bắt đầu từ thứ hai. Tên các thứ viết bằng chữ thường."
          - type: example
            level: A0
            ex: { exchange: ["Яки́й сього́дні день?", ["Сього́дні ", { target: { weekday: середа́, value: 3 } }, "."]] }
            tr: { en: { exchange: [What day is it today?, "It's Wednesday today."] }, es: { exchange: [¿Qué día es hoy?, Hoy es miércoles.] }, pt: { exchange: ["Que dia é hoje?", "Hoje é quarta-feira."] }, fr: { exchange: ["Quel jour sommes-nous aujourd’hui ?", "Aujourd’hui, c’est mercredi."] }, de: { exchange: ["Welcher Tag ist heute?", "Heute ist Mittwoch."] }, it: { exchange: ["Che giorno è oggi?", "Oggi è mercoledì."] }, pl: { exchange: ["Jaki jest dzisiaj dzień?", "Dzisiaj jest środa."] }, tr: { exchange: ["Bugün günlerden ne?", "Bugün çarşamba."] }, id: { exchange: ["Hari ini hari apa?", "Hari ini hari Rabu."] }, vi: { exchange: ["Hôm nay là thứ mấy?", "Hôm nay là thứ tư."] } }
          - type: rule
            level: A1
            text:
              uk: ["Коли? — ", { alternatives: [{ term: у }, { term: в }] }, " і знахідний відмінок: ", { term: -а }, " змінюється на ", { term: -у }, ", ", { term: -я }, " на ", { term: -ю }, ":"]
              en: ["When? takes ", { alternatives: [{ term: у }, { term: в }] }, " and the accusative: ", { term: -а }, " becomes ", { term: -у }, ", and ", { term: -я }, " becomes ", { term: -ю }, ":"]
              es: ["¿Cuándo? lleva ", { alternatives: [{ term: у }, { term: в }] }, " y el acusativo: ", { term: -а }, " pasa a ", { term: -у }, ", y ", { term: -я }, " a ", { term: -ю }, ":"]
              pt: ["Quando? ", { alternatives: [{ term: у }, { term: в }] }, " com o acusativo: ", { term: -а }, " passa a ", { term: -у }, ", e ", { term: -я }, " passa a ", { term: -ю }, ":"]
              fr: ["Quand ? On emploie ", { alternatives: [{ term: у }, { term: в }] }, " et l’accusatif : ", { term: -а }, " devient ", { term: -у }, ", et ", { term: -я }, " devient ", { term: -ю }, " :"]
              de: ["Wann? Es steht ", { alternatives: [{ term: у }, { term: в }] }, " mit dem Akkusativ: ", { term: -а }, " wird zu ", { term: -у }, " und ", { term: -я }, " wird zu ", { term: -ю }, ":"]
              it: ["Quando? Si usa ", { alternatives: [{ term: у }, { term: в }] }, " con l'accusativo: ", { term: -а }, " diventa ", { term: -у }, " e ", { term: -я }, " diventa ", { term: -ю }, ":"]
              pl: ["Kiedy? ", { alternatives: [{ term: у }, { term: в }] }, " i biernik: ", { term: -а }, " zmienia się w ", { term: -у }, ", a ", { term: -я }, " w ", { term: -ю }, ":"]
