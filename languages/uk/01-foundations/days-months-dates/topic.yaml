title: { uk: "Дні, місяці, дати", en: "Days, Months and Dates", es: "Días, meses y fechas", pt: "Dias, meses e datas", fr: "Jours, mois et dates", de: "Tage, Monate und Datumsangaben", it: "Giorni, mesi e date", pl: "Dni, miesiące i daty", tr: "Günler, aylar ve tarihler", id: "Hari, bulan, dan tanggal", vi: "Thứ, tháng và ngày" }
summary:
  lead:
    uk: "Дні тижня, місяці й пори року, як сказати, коли щось відбувається, і як назвати дату."
    en: "The days of the week, the months and the seasons, how to say when something happens, and how to give a date."
    es: "Los días de la semana, los meses y las estaciones, cómo decir cuándo pasa algo y cómo dar una fecha."
    pt: "Os dias da semana, os meses e as estações do ano, como dizer quando algo acontece e como dar uma data."
    fr: "Les jours de la semaine, les mois et les saisons, comment dire quand quelque chose a lieu et comment donner une date."
    de: "Die Wochentage, die Monate und die Jahreszeiten, wie man sagt, wann etwas geschieht, und wie man ein Datum nennt."
    it: "I giorni della settimana, i mesi e le stagioni, come dire quando succede qualcosa e come dare una data."
    pl: "Dni tygodnia, miesiące i pory roku, jak powiedzieć, kiedy coś się dzieje, i jak podać datę."
    tr: "Haftanın günleri, aylar ve mevsimler; bir şeyin ne zaman olduğunu söyleme ve tarih verme."
    id: "Nama hari, bulan, dan musim, cara menyatakan kapan sesuatu terjadi, dan cara menyebutkan tanggal."
    vi: "Các thứ trong tuần, các tháng và các mùa, cách nói một việc xảy ra khi nào và cách nói ngày tháng."
  rule:
    uk: ["Коли? День стоїть у знахідному відмінку, місяць — у місцевому: ", { target: у се́реду }, ", ", { target: у тра́вні }, "."]
    en: ["When? puts the day in the accusative and the month in the locative: ", { target: у се́реду }, " (on Wednesday), ", { target: у тра́вні }, " (in May)."]
    es: ["Para decir cuándo, el día va en acusativo y el mes en locativo: ", { target: у се́реду }, " (el miércoles), ", { target: у тра́вні }, " (en mayo)."]
    pt: ["Para dizer quando, o dia vai no acusativo e o mês no locativo: ", { target: у се́реду }, " (na quarta-feira), ", { target: у тра́вні }, " (em maio)."]
    fr: ["Pour dire quand, le jour se met à l’accusatif et le mois au locatif : ", { target: у се́реду }, " (mercredi), ", { target: у тра́вні }, " (en mai)."]
    de: ["Auf die Frage „wann?“ steht der Tag im Akkusativ und der Monat im Lokativ: ", { target: у се́реду }, " (am Mittwoch), ", { target: у тра́вні }, " (im Mai)."]
    it: ["Per dire quando, il giorno va all'accusativo e il mese al locativo: ", { target: у се́реду }, " (mercoledì), ", { target: у тра́вні }, " (a maggio)."]
    pl: ["Na pytanie „kiedy?” dzień stoi w bierniku, a miesiąc w miejscowniku: ", { target: у се́реду }, " (w środę), ", { target: у тра́вні }, " (w maju)."]
    tr: ["Ne zaman? sorusunda gün belirtme hâlinde, ay bulunma hâlinde durur: ", { target: у се́реду }, " (çarşamba günü), ", { target: у тра́вні }, " (mayıs ayında)."]
    id: ["Untuk menyatakan kapan, hari memakai kasus akusatif dan bulan memakai kasus lokatif: ", { target: у се́реду }, " (pada hari Rabu), ", { target: у тра́вні }, " (pada bulan Mei)."]
    vi: ["Để nói khi nào, ngày dùng đối cách còn tháng dùng vị trí cách: ", { target: у се́реду }, " (vào thứ tư), ", { target: у тра́вні }, " (vào tháng năm)."]

