            tr: { en: The tour is on the eighteenth of October., es: La excursión es el dieciocho de octubre., pt: "A excursão é no dia dezoito de outubro.", fr: "L’excursion a lieu le dix-huit octobre.", de: "Der Ausflug ist am achtzehnten Oktober.", it: "L'escursione è il diciotto ottobre.", pl: "Wycieczka jest osiemnastego października.", tr: "Gezi 18 Ekim'de.", id: "Tur itu pada tanggal delapan belas Oktober.", vi: "Chuyến tham quan diễn ra vào ngày mười tám tháng mười." }
          - type: rule
            level: A2
            text:
              uk: "Яке сьогодні число? — порядкове число середнього роду в називному відмінку й місяць у родовому."
