            level: B2
            text:
              uk: "У складеному порядковому числі змінюється тільки останнє слово, а перші слова лишаються кількісними числівниками."
              en: "In a compound ordinal, only the last word changes; the first words stay cardinal numerals."
              es: "En un ordinal compuesto solo cambia la última palabra; las primeras siguen siendo numerales cardinales."
              pt: "Em um ordinal composto, só muda a última palavra; as primeiras continuam numerais cardinais."
              fr: "Dans un ordinal composé, seul le dernier mot change ; les premiers restent des numéraux cardinaux."
              de: "In einer zusammengesetzten Ordnungszahl ändert sich nur das letzte Wort; die ersten Wörter bleiben Grundzahlen."
              it: "In un ordinale composto cambia solo l'ultima parola; le prime restano numerali cardinali."
              pl: "W złożonym liczebniku porządkowym zmienia się tylko ostatni wyraz; pierwsze wyrazy pozostają liczebnikami głównymi."
              tr: "Birleşik sıra sayısında yalnızca son sözcük değişir; ilk sözcükler asıl sayı olarak kalır."
              id: "Dalam angka ordinal majemuk, hanya kata terakhir yang berubah; kata-kata pertama tetap angka kardinal."
              vi: "Trong số thứ tự ghép, chỉ từ cuối cùng thay đổi; các từ đầu vẫn là số đếm."

