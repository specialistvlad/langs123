          - { level: A0, value: 5, day: п’я́тниця, short: пт, tr: { en: Friday, es: viernes, pt: "sexta-feira", fr: "vendredi", de: "Freitag", it: "venerdì", pl: "piątek", tr: "cuma", id: "Jumat", vi: "thứ sáu" } }
          - { level: A0, value: 6, day: субо́та, short: сб, tr: { en: Saturday, es: sábado, pt: "sábado", fr: "samedi", de: "Samstag", it: "sabato", pl: "sobota", tr: "cumartesi", id: "Sabtu", vi: "thứ bảy" } }
