title: { uk: Ступені порівняння, en: Comparatives and Superlatives, es: Comparativos y superlativos }
summary:
  lead:
    uk: ["Вищий ступінь має суфікс ", { term: -іш- }, " чи ", { term: -ш- }, " (", { term: ціка́віший }, "), найвищий додає ", { term: най- }, " (", { term: найцікаві́ший }, ")."]
    en: ["The comparative takes the suffix ", { term: -іш- }, " or ", { term: -ш- }, " (", { term: ціка́віший }, "), and the superlative adds ", { term: най- }, " (", { term: найцікаві́ший }, ")."]
    es: ["El comparativo lleva el sufijo ", { term: -іш- }, " o ", { term: -ш- }, " (", { term: ціка́віший }, "), y el superlativo añade ", { term: най- }, " (", { term: найцікаві́ший }, ")."]
  rule:
    uk: ["Найвищий ступінь додає префікс ", { term: най- }, " до вищого ступеня:"]
    en: ["The superlative adds the prefix ", { term: най- }, " to the comparative:"]
    es: ["El superlativo añade el prefijo ", { term: най- }, " al comparativo:"]
  ex: ["Це ", { target: найкра́щий }, " день."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { uk: Вищий ступінь, en: Comparative, es: Comparativo }
          rule: { uk: { alternatives: [{ term: -іш- }, { term: -ш- }] }, en: { alternatives: [{ term: -іш- }, { term: -ш- }] }, es: { alternatives: [{ term: -іш- }, { term: -ш- }] } }
          ex: ["Ця кни́жка ", { target: ціка́віша }, "."]
          tr: { en: "This book is more interesting.", es: "Este libro es más interesante." }
        - level: A2
          point: { uk: Найвищий ступінь, en: Superlative, es: Superlativo }
          rule: { uk: [{ term: най- }, " + вищий ступінь"], en: [{ term: най- }, " + the comparative"], es: [{ term: най- }, " + el comparativo"] }
          ex: ["Це ", { target: найсмачні́ший }, " торт."]
          tr: { en: "This is the most delicious cake.", es: "Es la tarta más rica." }
        - level: A2
          point: { uk: Складена форма, en: Compound form, es: Forma compuesta }
          rule: { uk: { alternatives: [{ term: більш }, { term: менш }] }, en: { alternatives: [{ term: більш }, { term: менш }] }, es: { alternatives: [{ term: більш }, { term: менш }] } }
          ex: ["Цей сік ", { target: менш ки́слий }, "."]
          tr: { en: "This juice is less sour.", es: "Este jugo es menos ácido." }
        - level: A2
          point: { uk: Особливі форми, en: Special forms, es: Formas especiales }
          rule: { uk: { mapping: [{ term: вели́кий }, { term: бі́льший }] }, en: { mapping: [{ term: вели́кий }, { term: бі́льший }] }, es: { mapping: [{ term: вели́кий }, { term: бі́льший }] } }
          ex: ["Цей буди́нок ", { target: бі́льший }, "."]
          tr: { en: "This building is bigger.", es: "Este edificio es más grande." }
        - level: B1
          point: { uk: Особливі форми, en: Special forms, es: Formas especiales }
          rule: { uk: { mapping: [{ term: га́рний }, { term: кра́щий }] }, en: { mapping: [{ term: га́рний }, { term: кра́щий }] }, es: { mapping: [{ term: га́рний }, { term: кра́щий }] } }
          ex: ["Ця ка́ва ", { target: кра́ща }, "."]
          tr: { en: "This coffee is better.", es: "Este café es mejor." }
        - level: B1
          point: { uk: Чергування, en: Sound changes, es: Alternancias }
          rule: { uk: { mapping: [{ term: дороги́й }, { term: доро́жчий }] }, en: { mapping: [{ term: дороги́й }, { term: доро́жчий }] }, es: { mapping: [{ term: дороги́й }, { term: доро́жчий }] } }
          ex: ["Цей квито́к ", { target: доро́жчий }, "."]
          tr: { en: "This ticket is more expensive.", es: "Este boleto es más caro." }
        - level: B1
          point: { uk: "Ніж", en: "Than", es: "Que" }
          rule: { uk: [{ term: ніж }, " + називний"], en: [{ term: ніж }, " + the nominative"], es: [{ term: ніж }, " + el nominativo"] }
          ex: ["Оле́на моло́дша, ", { target: ніж }, " я."]
          tr: { en: "Olena is younger than me.", es: "Olena es más joven que yo." }
        - level: B1
          point: { uk: "За", en: "Than", es: "Que" }
          rule: { uk: [{ term: за }, " + знахідний"], en: [{ term: за }, " + the accusative"], es: [{ term: за }, " + el acusativo"] }
          ex: ["Брат ста́рший ", { target: за мене́ }, "."]
          tr: { en: "My brother is older than me.", es: "Mi hermano es mayor que yo." }
        - level: B1
          point: { uk: Прислівники, en: Adverbs, es: Adverbios }
          rule: { uk: { mapping: [{ term: шви́дко }, { term: шви́дше }] }, en: { mapping: [{ term: шви́дко }, { term: шви́дше }] }, es: { mapping: [{ term: шви́дко }, { term: шви́дше }] } }
          ex: ["Говорі́ть ", { target: пові́льніше }, ", будь ла́ска."]
          tr: { en: "Please speak more slowly.", es: "Hable más despacio, por favor." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Вищий ступінь має просту форму з ", { term: -іш- }, " чи ", { term: -ш- }, " і складену з ", { term: більш }, " чи ", { term: менш }, ":"]
              en: ["The comparative has a simple form with ", { term: -іш- }, " or ", { term: -ш- }, " and a compound form with ", { term: більш }, " or ", { term: менш }, ":"]
              es: ["El comparativo tiene una forma simple con ", { term: -іш- }, " o ", { term: -ш- }, " y una compuesta con ", { term: більш }, " o ", { term: менш }, ":"]
            ex: { examples: [["Ця те́ма ", { target: важливі́ша }, "."], ["Ця те́ма ", { target: більш важли́ва }, "."]] }
            tr: { en: { examples: ["This topic is more important.", "This topic is more important."] }, es: { examples: ["Este tema es más importante.", "Este tema es más importante."] } }
          - type: rule
            level: A2
            text:
              uk: ["Найвищий ступінь додає до простої форми ", { term: най- }, ", до складеної — ", { term: найбі́льш }, " чи ", { term: найме́нш }, ":"]
              en: ["The superlative adds ", { term: най- }, " to the simple form and uses ", { term: найбі́льш }, " or ", { term: найме́нш }, " with the compound one:"]
              es: ["El superlativo añade ", { term: най- }, " a la forma simple y usa ", { term: найбі́льш }, " o ", { term: найме́нш }, " con la compuesta:"]
            ex: ["Це ", { target: найважливі́ше }, " пита́ння."]
            tr: { en: "This is the most important question.", es: "Es la pregunta más importante." }
          - type: rule
            level: A2
            text:
              uk: "Форма вищого й найвищого ступеня узгоджується з іменником, як і будь-який прикметник:"
              en: "The comparative and the superlative agree with the noun like any other adjective:"
              es: "El comparativo y el superlativo concuerdan con el sustantivo como cualquier adjetivo:"
            ex: ["Ми живемо́ в ", { target: найбі́льшому }, " мі́сті краї́ни."]
            tr: { en: "We live in the biggest city in the country.", es: "Vivimos en la ciudad más grande del país." }

  - title: { uk: "Форма: проста", en: "Form: the simple comparative", es: "Forma: el comparativo simple" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: base, label: { uk: Звичайна форма, en: Base form, es: Forma base }, features: { degree: pos } }
          - { key: cmpr, label: { uk: Вищий ступінь, en: Comparative, es: Comparativo }, features: { degree: cmpr } }
          - { key: sprl, label: { uk: Найвищий ступінь, en: Superlative, es: Superlativo }, features: { degree: sprl } }
        rows:
          - { level: A2, base: ціка́вий, cmpr: ["ціка́", { ending: віший }], sprl: ["най", "ціка", { ending: ві́ший }] }
          - { level: A2, base: те́плий, cmpr: ["тепл", { ending: і́ший }], sprl: ["най", "тепл", { ending: і́ший }] }
          - { level: A2, base: соло́дкий, cmpr: ["соло́д", { ending: ший }], sprl: ["най", "соло́д", { ending: ший }] }
          - { level: A2, base: молоди́й, cmpr: ["моло́д", { ending: ший }], sprl: ["най", "моло́д", { ending: ший }] }
          - { level: B1, base: дороги́й, cmpr: ["доро́ж", { ending: чий }], sprl: ["най", "доро́ж", { ending: чий }] }
          - { level: B1, base: висо́кий, cmpr: ["ви́", { ending: щий }], sprl: ["най", "ви́", { ending: щий }] }
          - { level: B1, base: легки́й, cmpr: ["ле́г", { ending: ший }], sprl: ["най", "ле́г", { ending: ший }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Більшість прикметників має ", { term: -іш- }, ":"]
              en: ["Most adjectives take ", { term: -іш- }, ":"]
              es: ["La mayoría de los adjetivos toma ", { term: -іш- }, ":"]
            ex: ["Ця ву́лиця ", { target: тихі́ша }, "."]
            tr: { en: "This street is quieter.", es: "Esta calle es más tranquila." }
          - type: rule
            level: A2
            text:
              uk: ["Прикметники на ", { term: -кий }, " втрачають ", { term: -к- }, " і мають ", { term: -ш- }, ":"]
              en: ["Adjectives in ", { term: -кий }, " drop the ", { term: -к- }, " and take ", { term: -ш- }, ":"]
              es: ["Los adjetivos en ", { term: -кий }, " pierden la ", { term: -к- }, " y toman ", { term: -ш- }, ":"]
            ex: ["Цей чай ", { target: соло́дший }, "."]
            tr: { en: "This tea is sweeter.", es: "Este té es más dulce." }
          - type: rule
            level: B1
            text:
              uk: ["Перед ", { term: -ш- }, " приголосні змінюються: ", { mapping: [{ term: г }, { term: жч }] }, ", ", { mapping: [{ term: с }, { term: щ }] }, ", ", { mapping: [{ term: з }, { term: жч }] }, ":"]
              en: ["Before ", { term: -ш- }, " some consonants change: ", { mapping: [{ term: г }, { term: жч }] }, ", ", { mapping: [{ term: с }, { term: щ }] }, ", ", { mapping: [{ term: з }, { term: жч }] }, ":"]
              es: ["Delante de ", { term: -ш- }, " algunas consonantes cambian: ", { mapping: [{ term: г }, { term: жч }] }, ", ", { mapping: [{ term: с }, { term: щ }] }, ", ", { mapping: [{ term: з }, { term: жч }] }, ":"]
            ex: { examples: [["Цей костю́м ", { target: доро́жчий }, "."], ["Ця гора́ ", { target: ви́ща }, "."]] }
            tr: { en: { examples: ["This suit is more expensive.", "This mountain is higher."] }, es: { examples: ["Este traje es más caro.", "Esta montaña es más alta."] } }

  - title: { uk: "Форма: складена й особлива", en: "Form: compound and special forms", es: "Forma: compuesta y especial" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: base, label: { uk: Звичайна форма, en: Base form, es: Forma base }, features: { degree: pos } }
          - { key: cmpr, label: { uk: Вищий ступінь, en: Comparative, es: Comparativo }, features: { degree: cmpr } }
          - { key: sprl, label: { uk: Найвищий ступінь, en: Superlative, es: Superlativo }, features: { degree: sprl } }
        rows:
          - { level: A2, base: важли́вий, cmpr: "більш важли́вий", sprl: "найбі́льш важли́вий" }
          - { level: A2, base: ки́слий, cmpr: "менш ки́слий", sprl: "найме́нш ки́слий" }
          - { level: A2, base: вели́кий, cmpr: бі́льший, sprl: найбі́льший }
          - { level: A2, base: мали́й, cmpr: ме́нший, sprl: найме́нший }
          - { level: B1, base: { alternatives: [га́рний, до́брий] }, cmpr: кра́щий, sprl: найкра́щий }
          - { level: B1, base: пога́ний, cmpr: гі́рший, sprl: найгі́рший }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: [{ term: більш }, " і ", { term: менш }, " стоять перед звичайною формою прикметника:"]
              en: [{ term: більш }, " (more) and ", { term: менш }, " (less) go before the base form of the adjective:"]
              es: [{ term: більш }, " (más) y ", { term: менш }, " (menos) van delante de la forma base del adjetivo:"]
            ex: ["Цей фільм ", { target: менш ціка́вий }, "."]
            tr: { en: "This film is less interesting.", es: "Esta película es menos interesante." }
          - type: rule
            level: A2
            text:
              uk: [{ term: вели́кий }, " і ", { term: мали́й }, " мають особливі форми:"]
              en: [{ term: вели́кий }, " (big) and ", { term: мали́й }, " (small) have forms of their own:"]
              es: [{ term: вели́кий }, " (grande) y ", { term: мали́й }, " (pequeño) tienen formas propias:"]
            ex: ["Моя́ кімна́та ", { target: ме́нша }, "."]
            tr: { en: "My room is smaller.", es: "Mi habitación es más pequeña." }
          - type: rule
            level: B1
            text:
              uk: [{ term: га́рний }, " і ", { term: до́брий }, " мають ", { term: кра́щий }, ", ", { term: пога́ний }, " — ", { term: гі́рший }, ":"]
              en: [{ term: га́рний }, " and ", { term: до́брий }, " (good) have ", { term: кра́щий }, ", and ", { term: пога́ний }, " (bad) has ", { term: гі́рший }, ":"]
              es: [{ term: га́рний }, " y ", { term: до́брий }, " (bueno) tienen ", { term: кра́щий }, ", y ", { term: пога́ний }, " (malo), ", { term: гі́рший }, ":"]
            ex: ["Сього́дні пого́да ", { target: гі́рша }, "."]
            tr: { en: "The weather is worse today.", es: "Hoy hace peor tiempo." }

  - title: { uk: Порівняння, en: Comparing, es: Comparar }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Конструкція, en: Pattern, es: Estructura } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            use: { uk: [{ term: ніж }, " + називний"], en: [{ term: ніж }, " + the nominative"], es: [{ term: ніж }, " + el nominativo"] }
            ex: ["Ки́їв бі́льший, ", { target: ніж Львів }, "."]
            tr: { en: "Kyiv is bigger than Lviv.", es: "Kiev es más grande que Lviv." }
          - level: B1
            use: { uk: [{ term: за }, " + знахідний"], en: [{ term: за }, " + the accusative"], es: [{ term: за }, " + el acusativo"] }
            ex: ["Брат ста́рший ", { target: за сестру́ }, "."]
            tr: { en: "My brother is older than my sister.", es: "Mi hermano es mayor que mi hermana." }
          - level: B1
            use: { uk: [{ alternatives: [{ term: з }, { term: із }] }, " + родовий після найвищого ступеня"], en: [{ alternatives: [{ term: з }, { term: із }] }, " + the genitive after a superlative"], es: [{ alternatives: [{ term: з }, { term: із }] }, " + el genitivo tras un superlativo"] }
            ex: ["Це найкра́щий ", { target: із рестора́нів }, " мі́ста."]
            tr: { en: "This is the best of the city's restaurants.", es: "Es el mejor de los restaurantes de la ciudad." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Перед ", { term: ніж }, " стоїть кома:"]
              en: ["A comma goes before ", { term: ніж }, ":"]
              es: ["Delante de ", { term: ніж }, " va una coma:"]
            ex: ["Я ста́рший", { target: ", ніж" }, " ти."]
            tr: { en: "I'm older than you.", es: "Soy mayor que tú." }

  - title: { uk: Прислівники, en: Adverbs, es: Adverbios }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { uk: Звичайна форма, en: Base form, es: Forma base }, features: { degree: pos } }
          - { key: cmpr, label: { uk: Вищий ступінь, en: Comparative, es: Comparativo }, features: { degree: cmpr } }
          - { key: sprl, label: { uk: Найвищий ступінь, en: Superlative, es: Superlativo }, features: { degree: sprl } }
        rows:
          - { level: B1, base: шви́дко, cmpr: шви́дше, sprl: найшви́дше }
          - { level: B1, base: ва́жко, cmpr: ва́жче, sprl: найва́жче }
          - { level: B1, base: суча́сно, cmpr: "більш суча́сно", sprl: "найбі́льш суча́сно" }
          - { level: B1, base: { alternatives: [га́рно, до́бре] }, cmpr: кра́ще, sprl: найкра́ще }
          - { level: B1, base: пога́но, cmpr: гі́рше, sprl: найгі́рше }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Прислівник має ті самі форми, що й прикметник, але на ", { term: -е }, ":"]
              en: ["An adverb has the same forms as its adjective, ending in ", { term: -е }, ":"]
              es: ["El adverbio tiene las mismas formas que su adjetivo, terminadas en ", { term: -е }, ":"]
            ex: ["Він гово́рить украї́нською ", { target: кра́ще }, ", ніж я."]
            tr: { en: "He speaks Ukrainian better than I do.", es: "Habla ucraniano mejor que yo." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Це са́мий кра́щий день., right: ["Це ", { target: найкра́щий }, " день."], rule: { uk: ["найвищий ступінь — з ", { term: най- }, "; ", { term: са́мий }, " у цьому значенні — калька з російської"], en: ["the superlative takes ", { term: най- }, "; ", { term: са́мий }, " in this sense is a calque from Russian"], es: ["el superlativo lleva ", { term: най- }, "; ", { term: са́мий }, " con este sentido es un calco del ruso"] } }
          - { level: B1, wrong: "Ки́їв бі́льший, чим Львів.", right: ["Ки́їв бі́льший, ", { target: ніж }, " Львів."], rule: { uk: ["у порівнянні — ", { term: ніж }, "; ", { term: чим }, " тут — калька з російської"], en: ["comparisons take ", { term: ніж }, "; ", { term: чим }, " here is a calque from Russian"], es: ["la comparación lleva ", { term: ніж }, "; ", { term: чим }, " aquí es un calco del ruso"] } }
          - { level: A2, wrong: Ця кни́жка більш ціка́віша., right: ["Ця кни́жка ", { target: ціка́віша }, "."], rule: { uk: ["або ", { term: ціка́віша }, ", або ", { term: більш ціка́ва }], en: ["either ", { term: ціка́віша }, " or ", { term: більш ціка́ва }, ", never both"], es: ["o ", { term: ціка́віша }, " o ", { term: більш ціка́ва }, ", nunca las dos cosas"] } }
          - { level: B1, wrong: Ця ка́ва більш до́бра., right: ["Ця ка́ва ", { target: кра́ща }, "."], rule: { uk: [{ term: до́брий }, " має особливу форму ", { term: кра́щий }], en: [{ term: до́брий }, " has its own form, ", { term: кра́щий }], es: [{ term: до́брий }, " tiene forma propia: ", { term: кра́щий }] } }
          - { level: B1, speakers: [en, es], wrong: Я ста́рший ніж ти., right: ["Я ста́рший", { target: ", ніж" }, " ти."], rule: { en: ["Ukrainian puts a comma before ", { term: ніж }], es: ["el ucraniano pone una coma delante de ", { term: ніж }] } }
