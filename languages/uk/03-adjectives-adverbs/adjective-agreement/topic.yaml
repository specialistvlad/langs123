    vi: ["Tính từ mang giống, số và cách của danh từ mà nó bổ nghĩa: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
  rule:
    uk: ["Закінчення прикметника залежить від роду іменника, а в множині для всіх родів одне — ", { term: -і }, ":"]
    en: ["The adjective's ending follows the noun's gender, and the plural has one ending for every gender, ", { term: -і }, ":"]
    es: ["La terminación del adjetivo sigue el género del sustantivo, y el plural tiene una sola para todos los géneros, ", { term: -і }, ":"]
    pt: ["A terminação do adjetivo segue o gênero do substantivo, e o plural tem uma só para todos os gêneros, ", { term: -і }, ":"]
    fr: ["La terminaison de l’adjectif suit le genre du nom, et le pluriel a une seule terminaison pour tous les genres, ", { term: -і }, " :"]
    de: ["Die Endung des Adjektivs richtet sich nach dem Genus des Substantivs; der Plural hat für alle Genera nur eine Endung, ", { term: -і }, ":"]
    it: ["La desinenza dell'aggettivo segue il genere del sostantivo, e il plurale ha una sola desinenza per tutti i generi, ", { term: -і }, ":"]
    pl: ["Końcówka przymiotnika zależy od rodzaju rzeczownika, a liczba mnoga ma jedną końcówkę dla wszystkich rodzajów, ", { term: -і }, ":"]
    tr: ["Sıfatın sonu ismin cinsine göre değişir; çoğulda bütün cinsler için tek bir sonek vardır, ", { term: -і }, ":"]
    id: ["Akhiran kata sifat mengikuti gender kata benda, dan bentuk jamak punya satu akhiran untuk semua gender, yaitu ", { term: -і }, ":"]
    vi: ["Đuôi của tính từ theo giống của danh từ, còn số nhiều chỉ có một đuôi cho mọi giống, là ", { term: -і }, ":"]
  ex: { examples: [["Це ", { target: нова́ }, " кварти́ра."], ["Це ", { target: нові́ }, " кварти́ри."]] }

