summary:
  lead:
    uk: ["Прикметник має рід, число й відмінок свого іменника: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
    en: ["An adjective takes the gender, number and case of its noun: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
    es: ["El adjetivo toma el género, el número y el caso de su sustantivo: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
