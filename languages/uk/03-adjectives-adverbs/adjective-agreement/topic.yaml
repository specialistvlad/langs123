    fr: ["L’adjectif prend le genre, le nombre et le cas de son nom : ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
    de: ["Das Adjektiv übernimmt Genus, Numerus und Kasus seines Substantivs: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
    it: ["L'aggettivo prende il genere, il numero e il caso del suo sostantivo: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
    pl: ["Przymiotnik przyjmuje rodzaj, liczbę i przypadek swojego rzeczownika: ", { term: нови́й стіл }, ", ", { term: нова́ кни́жка }, ", ", { term: нове́ вікно́ }, ", ", { term: нові́ книжки́ }, "."]
