title: { uk: Відмінювання прикметників, en: Adjectives in All Cases, es: La declinación del adjetivo, pt: "A declinação do adjetivo", fr: "La déclinaison de l’adjectif", de: "Die Deklination des Adjektivs", it: "La declinazione dell'aggettivo", pl: "Odmiana przymiotnika", tr: "Sıfatların çekimi", id: "Deklinasi kata sifat", vi: "Biến cách của tính từ" }
summary:
  lead:
    uk: ["Прикметник змінюється за відмінками разом з іменником: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    en: ["An adjective changes for case together with its noun: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    es: ["El adjetivo cambia de caso junto con su sustantivo: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    pt: ["O adjetivo muda de caso junto com o seu substantivo: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    fr: ["L’adjectif change de cas avec son nom : ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    de: ["Das Adjektiv wechselt den Kasus zusammen mit seinem Substantiv: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    it: ["L'aggettivo cambia caso insieme al suo sostantivo: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    pl: ["Przymiotnik zmienia przypadek razem z rzeczownikiem: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    tr: ["Sıfat, ismiyle birlikte hâl değiştirir: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    id: ["Kata sifat berubah kasus bersama kata bendanya: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
    vi: ["Tính từ đổi cách cùng với danh từ của nó: ", { term: ново́го дру́га }, ", ", { term: ново́му дру́гові }, ", ", { term: з нови́м дру́гом }, "."]
  rule:
    uk: ["Чоловічий і середній рід мають спільні закінчення від родового до місцевого — ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    en: ["The masculine and the neuter share their endings from the genitive to the locative, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    es: ["El masculino y el neutro comparten las terminaciones del genitivo al locativo, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    pt: ["O masculino e o neutro compartilham as terminações do genitivo ao locativo, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    fr: ["Le masculin et le neutre partagent leurs terminaisons du génitif au locatif, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, " :"]
    de: ["Maskulinum und Neutrum haben vom Genitiv bis zum Lokativ dieselben Endungen, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    it: ["Il maschile e il neutro condividono le desinenze dal genitivo al locativo, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    pl: ["Rodzaj męski i nijaki mają wspólne końcówki od dopełniacza do miejscownika, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    tr: ["Eril ve nötr, tamlayan hâlinden bulunma hâline kadar aynı sonekleri paylaşır, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    id: ["Maskulin dan netral memakai akhiran yang sama dari genitif sampai lokatif, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
    vi: ["Giống đực và giống trung dùng chung đuôi từ sinh cách đến vị trí cách, ", { term: -ого }, ", ", { term: -ому }, ", ", { term: -им }, ":"]
  ex: { examples: [["Я живу́ в ", { target: ново́му }, " буди́нку."], ["Я живу́ в ", { target: ново́му }, " мі́сті."]] }

