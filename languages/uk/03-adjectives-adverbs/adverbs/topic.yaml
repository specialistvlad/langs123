title: { uk: Прислівники, en: Adverbs, es: Los adverbios }
summary:
  lead:
    uk: ["Прислівник не змінюється за родом, числом і відмінком і називає місце, час, спосіб чи міру: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    en: ["An adverb does not change for gender, number or case, and tells where, when, how or how much: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    es: ["El adverbio no cambia de género, número ni caso, e indica dónde, cuándo, cómo o cuánto: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
  rule:
    uk: ["Місце має три прислівники: де? ", { term: тут }, ", куди? ", { term: сюди́ }, ", звідки? ", { term: зві́дси }, ":"]
    en: ["Place has three adverbs: where? ", { term: тут }, ", where to? ", { term: сюди́ }, ", where from? ", { term: зві́дси }, ":"]
    es: ["El lugar tiene tres adverbios: ¿dónde? ", { term: тут }, ", ¿adónde? ", { term: сюди́ }, ", ¿de dónde? ", { term: зві́дси }, ":"]
  ex: { examples: [["Я ", { target: тут }, "."], ["Ході́ть ", { target: сюди́ }, "!"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Місце, en: Place, es: Lugar }
          rule: { uk: { alternatives: [{ term: тут }, { term: там }, { term: вдо́ма }] }, en: { alternatives: [{ term: тут }, { term: там }, { term: вдо́ма }] }, es: { alternatives: [{ term: тут }, { term: там }, { term: вдо́ма }] } }
          ex: ["Ма́ма ", { target: вдо́ма }, "."]
          tr: { en: "Mum is at home.", es: "Mamá está en casa." }
        - level: A1
          point: { uk: Час, en: Time, es: Tiempo }
          rule: { uk: { alternatives: [{ term: сього́дні }, { term: за́втра }, { term: учо́ра }, { term: за́раз }] }, en: { alternatives: [{ term: сього́дні }, { term: за́втра }, { term: учо́ра }, { term: за́раз }] }, es: { alternatives: [{ term: сього́дні }, { term: за́втра }, { term: учо́ра }, { term: за́раз }] } }
          ex: [{ target: За́втра }, " я працю́ю."]
          tr: { en: "I'm working tomorrow.", es: "Mañana trabajo." }
        - level: A1
          point: { uk: Спосіб, en: Manner, es: Modo }
          rule: { uk: { alternatives: [{ term: до́бре }, { term: пога́но }, { term: шви́дко }] }, en: { alternatives: [{ term: до́бре }, { term: пога́но }, { term: шви́дко }] }, es: { alternatives: [{ term: до́бре }, { term: пога́но }, { term: шви́дко }] } }
          ex: ["Він ", { target: до́бре }, " гра́є у футбо́л."]
          tr: { en: "He plays football well.", es: "Juega bien al fútbol." }
        - level: A1
          point: { uk: Міра, en: Degree, es: Grado }
          rule: { uk: [{ term: ду́же }, " перед прикметником, прислівником, дієсловом"], en: [{ term: ду́же }, " before an adjective, an adverb or a verb"], es: [{ term: ду́же }, " delante de un adjetivo, un adverbio o un verbo"] }
          ex: ["Я ", { target: ду́же }, " люблю́ Ки́їв."]
          tr: { en: "I love Kyiv very much.", es: "Me encanta Kiev." }
        - level: A2
          point: { uk: Куди?, en: Where to?, es: ¿Adónde? }
          rule: { uk: { alternatives: [{ term: сюди́ }, { term: туди́ }, { term: додо́му }] }, en: { alternatives: [{ term: сюди́ }, { term: туди́ }, { term: додо́му }] }, es: { alternatives: [{ term: сюди́ }, { term: туди́ }, { term: додо́му }] } }
          ex: ["Ми йдемо́ ", { target: додо́му }, "."]
          tr: { en: "We're going home.", es: "Nos vamos a casa." }
        - level: A2
          point: { uk: Звідки?, en: Where from?, es: ¿De dónde? }
          rule: { uk: { alternatives: [{ term: зві́дси }, { term: зві́дти }] }, en: { alternatives: [{ term: зві́дси }, { term: зві́дти }] }, es: { alternatives: [{ term: зві́дси }, { term: зві́дти }] } }
          ex: ["Ми ї́демо ", { target: зві́дси }, " за́втра."]
          tr: { en: "We're leaving here tomorrow.", es: "Nos vamos de aquí mañana." }
        - level: A2
          point: { uk: Як часто?, en: How often?, es: ¿Con qué frecuencia? }
          rule: { uk: { alternatives: [{ term: за́вжди }, { term: ча́сто }, { term: рі́дко }] }, en: { alternatives: [{ term: за́вжди }, { term: ча́сто }, { term: рі́дко }] }, es: { alternatives: [{ term: за́вжди }, { term: ча́сто }, { term: рі́дко }] } }
          ex: ["Я ", { target: ча́сто }, " ї́жджу до Льво́ва."]
          tr: { en: "I often go to Lviv.", es: "Voy a menudo a Lviv." }
        - level: B1
          point: { uk: Утворення, en: Formation, es: Formación }
          rule: { uk: { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] }, en: { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] }, es: { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] } }
          ex: ["Ді́ти бі́гають ", { target: шви́дко }, "."]
          tr: { en: "The children run fast.", es: "Los niños corren rápido." }
        - level: B1
          point: { uk: Мова, en: Language, es: Idioma }
          rule: { uk: [{ term: по- }, " + ", { term: -ськи }], en: [{ term: по- }, " + ", { term: -ськи }], es: [{ term: по- }, " + ", { term: -ськи }] }
          ex: ["Ви гово́рите ", { target: по-украї́нськи }, "?"]
          tr: { en: "Do you speak Ukrainian?", es: "¿Habla ucraniano?" }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Прислівник не змінюється за родом, числом і відмінком: він стоїть біля дієслова, прикметника чи іншого прислівника."
              en: "An adverb does not change for gender, number or case: it goes with a verb, an adjective or another adverb."
              es: "El adverbio no cambia de género, número ni caso: acompaña a un verbo, a un adjetivo o a otro adverbio."
          - type: rule
            level: A1
            text:
              uk: "Прислівник способу зазвичай стоїть перед дієсловом:"
              en: "An adverb of manner usually goes before the verb:"
              es: "El adverbio de modo suele ir delante del verbo:"
            ex: ["Ти ", { target: шви́дко }, " чита́єш."]
            tr: { en: "You read fast.", es: "Lees rápido." }
          - type: note
            level: A2
            text:
              uk: ["Деякі прислівники мають два наголоси: ", { alternatives: [{ term: за́вжди }, { term: завжди́ }] }, "."]
              en: ["A few adverbs take two stresses: ", { alternatives: [{ term: за́вжди }, { term: завжди́ }] }, "."]
              es: ["Algunos adverbios admiten dos acentos: ", { alternatives: [{ term: за́вжди }, { term: завжди́ }] }, "."]

  - title: { uk: "Місце: де, куди, звідки", en: "Place: where, where to, where from", es: "Lugar: dónde, adónde, de dónde" }
    role: own
    content:
      - type: usage
        columns:
          - { key: q, label: { uk: Питання, en: Question, es: Pregunta } }
          - { key: here, label: { uk: Близько, en: Near, es: Cerca } }
          - { key: there, label: { uk: Далеко, en: Far, es: Lejos } }
          - { key: home, label: { uk: Дім, en: Home, es: Casa } }
        rows:
          - { level: A1, q: Де?, here: { term: тут }, there: { term: там }, home: { term: вдо́ма } }
          - { level: A2, q: Куди́?, here: { term: сюди́ }, there: { term: туди́ }, home: { term: додо́му } }
          - { level: A2, q: Зві́дки?, here: { term: зві́дси }, there: { term: зві́дти }, home: { term: з до́му } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["З дієсловами руху вживаємо ", { term: сюди́ }, ", ", { term: туди́ }, ", ", { term: додо́му }, ":"]
              en: ["Verbs of motion take ", { term: сюди́ }, ", ", { term: туди́ }, " and ", { term: додо́му }, ":"]
              es: ["Los verbos de movimiento llevan ", { term: сюди́ }, ", ", { term: туди́ }, " y ", { term: додо́му }, ":"]
            ex: ["Іди́ ", { target: туди́ }, "."]
            tr: { en: "Go there.", es: "Ve allí." }

  - title: { uk: "Час і частота", en: "Time and frequency", es: "Tiempo y frecuencia" }
    role: own
    content:
      - type: usage
        columns:
          - { key: adv, label: { uk: Прислівник, en: Adverb, es: Adverbio } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            adv: { alternatives: [{ term: учо́ра }, { term: сього́дні }, { term: за́втра }] }
            ex: [{ target: Учо́ра }, " я був у Ки́єві."]
            tr: { en: "Yesterday I was in Kyiv.", es: "Ayer estuve en Kiev." }
          - level: A1
            adv: { alternatives: [{ term: за́раз }, { term: по́тім }] }
            ex: [{ target: За́раз }, " я чита́ю, ", { target: по́тім }, " гуля́ю."]
            tr: { en: "I'm reading now; later I'll go for a walk.", es: "Ahora leo; luego salgo a pasear." }
          - level: A2
            adv: { alternatives: [{ term: вра́нці }, { term: вдень }, { term: уве́чері }, { term: вночі́ }] }
            ex: ["Я п’ю ка́ву ", { target: вра́нці }, "."]
            tr: { en: "I drink coffee in the morning.", es: "Tomo café por la mañana." }
          - level: A2
            adv: { alternatives: [{ term: за́вжди }, { term: зазвича́й }, { term: ча́сто }, { term: і́ноді }, { term: рі́дко }] }
            ex: ["Ми ", { target: зазвича́й }, " обі́даємо вдо́ма."]
            tr: { en: "We usually have lunch at home.", es: "Solemos comer en casa." }
          - level: B1
            adv: { term: ніко́ли }
            ex: ["Я ", { target: ніко́ли }, " не був у Пари́жі."]
            tr: { en: "I've never been to Paris.", es: "Nunca he estado en París." }
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: [{ term: ніко́ли }, " потребує ", { term: не }, " перед дієсловом: ", { link: "Заперечні займенники: ніхто, ніщо", to: uk.pronouns.negative-pronouns }, "."]
              en: [{ term: ніко́ли }, " needs ", { term: не }, " before the verb: ", { link: "Nobody, Nothing: ніхто, ніщо", to: uk.pronouns.negative-pronouns }, "."]
              es: [{ term: ніко́ли }, " necesita ", { term: не }, " delante del verbo: ", { link: "Nadie, nada: ніхто, ніщо", to: uk.pronouns.negative-pronouns }, "."]

  - title: { uk: "Спосіб і міра", en: "Manner and degree", es: "Modo y grado" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: [{ term: ду́же }, " підсилює прикметник, прислівник чи дієслово:"]
              en: [{ term: ду́же }, " strengthens an adjective, an adverb or a verb:"]
              es: [{ term: ду́же }, " refuerza un adjetivo, un adverbio o un verbo:"]
            ex: ["Ти гово́риш ", { target: ду́же до́бре }, "."]
            tr: { en: "You speak very well.", es: "Hablas muy bien." }
          - type: rule
            level: B1
            text:
              uk: ["Прислівник способу утворюємо від прикметника: ", { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] }, ":"]
              en: ["An adverb of manner comes from an adjective: ", { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] }, ":"]
              es: ["El adverbio de modo sale de un adjetivo: ", { mapping: [{ term: -ий }, { alternatives: [{ term: -о }, { term: -е }] }] }, ":"]
            ex: { examples: [["Він ", { target: ве́село }, " сміє́ться."], ["Ти ", { target: до́бре }, " вигляда́єш."]] }
            tr: { en: { examples: ["He laughs cheerfully.", "You look well."] }, es: { examples: ["Se ríe alegremente.", "Tienes buen aspecto."] } }
          - type: note
            level: B1
            text:
              uk: ["Вищий ступінь прислівників: ", { link: Ступені порівняння, to: uk.adjectives-adverbs.comparison }, "."]
              en: ["The comparative of adverbs: ", { link: Comparatives and Superlatives, to: uk.adjectives-adverbs.comparison }, "."]
              es: ["El comparativo de los adverbios: ", { link: Comparativos y superlativos, to: uk.adjectives-adverbs.comparison }, "."]

  - title: { uk: "Мови: по-українськи", en: "Languages: по-українськи", es: "Idiomas: по-українськи" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Прислівник мови має ", { term: по- }, ", дефіс і ", { term: -ськи }, " чи ", { term: -ському }, ":"]
              en: ["The adverb of a language takes ", { term: по- }, ", a hyphen and ", { term: -ськи }, " or ", { term: -ському }, ":"]
              es: ["El adverbio de un idioma lleva ", { term: по- }, ", un guion y ", { term: -ськи }, " o ", { term: -ському }, ":"]
            ex: ["Вона́ гово́рить ", { target: по-англі́йськи }, "."]
            tr: { en: "She speaks English.", es: "Habla inglés." }
          - type: note
            level: B1
            text:
              uk: ["Так само часто кажуть ", { term: украї́нською }, ", тобто «українською мовою»:"]
              en: ["Just as often people say ", { term: украї́нською }, ", short for “in the Ukrainian language”:"]
              es: ["Igual de a menudo se dice ", { term: украї́нською }, ", es decir, «en lengua ucraniana»:"]
            ex: ["Напиші́ть, будь ла́ска, ", { target: украї́нською }, "."]
            tr: { en: "Please write in Ukrainian.", es: "Escríbalo en ucraniano, por favor." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Я то́же студе́нт., right: ["Я ", { target: теж }, " студе́нт."], rule: { uk: [{ term: теж }, " чи ", { term: тако́ж }, "; ", { term: то́же }, " — русизм"], en: [{ term: теж }, " or ", { term: тако́ж }, " (also); ", { term: то́же }, " is Russian"], es: [{ term: теж }, " o ", { term: тако́ж }, " (también); ", { term: то́же }, " es ruso"] } }
          - { level: A2, wrong: Ми йдемо́ вдо́ма., right: ["Ми йдемо́ ", { target: додо́му }, "."], rule: { uk: ["куди? — ", { term: додо́му }, "; де? — ", { term: вдо́ма }], en: ["where to? takes ", { term: додо́му }, "; where? takes ", { term: вдо́ма }], es: ["¿adónde? lleva ", { term: додо́му }, "; ¿dónde?, ", { term: вдо́ма }] } }
          - { level: A2, speakers: [en, es], wrong: Ході́ть тут!, right: ["Ході́ть ", { target: сюди́ }, "!"], rule: { en: ["“here” is ", { term: тут }, " for where, ", { term: сюди́ }, " for where to"], es: ["«aquí» es ", { term: тут }, " para ¿dónde? y ", { term: сюди́ }, " para ¿adónde?"] } }
          - { level: B1, wrong: Я говорю́ по украї́нськи., right: ["Я говорю́ ", { target: по-украї́нськи }, "."], rule: { uk: [{ term: по-украї́нськи }, " пишемо з дефісом"], en: [{ term: по-украї́нськи }, " is written with a hyphen"], es: [{ term: по-украї́нськи }, " se escribe con guion"] } }
