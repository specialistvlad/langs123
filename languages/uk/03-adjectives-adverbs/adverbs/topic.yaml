title: { uk: Прислівники, en: Adverbs, es: Los adverbios, pt: "Os advérbios", fr: "Les adverbes", de: "Die Adverbien", it: "Gli avverbi", pl: "Przysłówki", tr: "Zarflar", id: "Kata keterangan", vi: "Trạng từ" }
summary:
  lead:
    uk: ["Прислівник не змінюється за родом, числом і відмінком і називає місце, час, спосіб чи міру: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    en: ["An adverb does not change for gender, number or case, and tells where, when, how or how much: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    es: ["El adverbio no cambia de género, número ni caso, e indica dónde, cuándo, cómo o cuánto: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    pt: ["O advérbio não muda de gênero, número nem caso, e indica lugar, tempo, modo ou grau: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    fr: ["L’adverbe ne change ni de genre, ni de nombre, ni de cas, et indique le lieu, le temps, la manière ou le degré : ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    de: ["Das Adverb verändert sich nicht nach Genus, Numerus oder Kasus und nennt Ort, Zeit, Art und Weise oder Grad: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    it: ["L'avverbio non cambia per genere, numero o caso e indica il luogo, il tempo, il modo o il grado: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    pl: ["Przysłówek nie zmienia się według rodzaju, liczby i przypadka i wskazuje miejsce, czas, sposób lub stopień: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    tr: ["Zarf cinse, sayıya ve hâle göre değişmez; yeri, zamanı, durumu ya da derecesi bildirir: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    id: ["Kata keterangan tidak berubah menurut gender, jumlah, atau kasus, dan menyatakan tempat, waktu, cara, atau tingkat: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
    vi: ["Trạng từ không đổi theo giống, số hay cách, và chỉ nơi chốn, thời gian, cách thức hoặc mức độ: ", { term: тут }, ", ", { term: за́втра }, ", ", { term: до́бре }, ", ", { term: ду́же }, "."]
  rule:
    uk: ["Місце має три прислівники: де? ", { term: тут }, ", куди? ", { term: сюди́ }, ", звідки? ", { term: зві́дси }, ":"]
    en: ["Place has three adverbs: where? ", { term: тут }, ", where to? ", { term: сюди́ }, ", where from? ", { term: зві́дси }, ":"]
    es: ["El lugar tiene tres adverbios: ¿dónde? ", { term: тут }, ", ¿adónde? ", { term: сюди́ }, ", ¿de dónde? ", { term: зві́дси }, ":"]
    pt: ["O lugar tem três advérbios: onde? ", { term: тут }, ", para onde? ", { term: сюди́ }, ", de onde? ", { term: зві́дси }, ":"]
    fr: ["Le lieu a trois adverbes : où ? ", { term: тут }, ", vers où ? ", { term: сюди́ }, ", d’où ? ", { term: зві́дси }, " :"]
    de: ["Der Ort hat drei Adverbien: wo? ", { term: тут }, ", wohin? ", { term: сюди́ }, ", woher? ", { term: зві́дси }, ":"]
    it: ["Il luogo ha tre avverbi: dove? ", { term: тут }, ", verso dove? ", { term: сюди́ }, ", da dove? ", { term: зві́дси }, ":"]
    pl: ["Miejsce ma trzy przysłówki: gdzie? ", { term: тут }, ", dokąd? ", { term: сюди́ }, ", skąd? ", { term: зві́дси }, ":"]
    tr: ["Yerin üç zarfı vardır: nerede? ", { term: тут }, ", nereye? ", { term: сюди́ }, ", nereden? ", { term: зві́дси }, ":"]
    id: ["Tempat punya tiga kata keterangan: di mana? ", { term: тут }, ", ke mana? ", { term: сюди́ }, ", dari mana? ", { term: зві́дси }, ":"]
    vi: ["Nơi chốn có ba trạng từ: ở đâu? ", { term: тут }, ", đến đâu? ", { term: сюди́ }, ", từ đâu? ", { term: зві́дси }, ":"]
  ex: { examples: [["Я ", { target: тут }, "."], ["Ході́ть ", { target: сюди́ }, "!"]] }

