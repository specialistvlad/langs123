title: { uk: "Теперішній час: I і II дієвідміни", en: "Present Tense: Conjugations I and II", es: "El presente: conjugaciones I y II" }
summary:
  lead:
    uk: ["Теперішній час має шість особових форм: дієслова I дієвідміни закінчуються на ", { term: -еш }, " і ", { term: -уть }, ", II дієвідміни — на ", { term: -иш }, " і ", { term: -ать }, "."]
    en: ["The present has six personal forms: conjugation I verbs end in ", { term: -еш }, " and ", { term: -уть }, ", conjugation II verbs in ", { term: -иш }, " and ", { term: -ать }, "."]
    es: ["El presente tiene seis formas personales: los verbos de la conjugación I terminan en ", { term: -еш }, " y ", { term: -уть }, "; los de la II, en ", { term: -иш }, " y ", { term: -ать }, "."]
  rule:
    uk: ["Дієвідміну показують форми ", { term: ти }, " і ", { term: вони́ }, ":"]
    en: ["The forms for ", { term: ти }, " and ", { term: вони́ }, " show the conjugation:"]
    es: ["Las formas de ", { term: ти }, " y ", { term: вони́ }, " muestran la conjugación:"]
  ex: { examples: [["Ти ", { target: чита́єш }, "."], ["Вони́ ", { target: сидя́ть }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: I дієвідміна, en: Conjugation I, es: Conjugación I }
          rule:
            uk: [{ term: чита́ти }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }]
            en: [{ term: чита́ти }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }]
            es: [{ term: чита́ти }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }]
          ex: ["Я ", { target: чита́ю }, " текст."]
          tr: { en: "I'm reading a text.", es: "Leo un texto." }
        - level: A1
          point: { uk: "I дієвідміна, -ува-, -юва-", en: "Conjugation I, -ува-, -юва-", es: "Conjugación I, -ува-, -юва-" }
          rule:
            uk: { mapping: [{ term: працюва́ти }, { term: працю́ю }] }
            en: { mapping: [{ term: працюва́ти }, { term: працю́ю }] }
            es: { mapping: [{ term: працюва́ти }, { term: працю́ю }] }
          ex: ["Ми ", { target: працю́ємо }, " в о́фісі."]
          tr: { en: "We work in an office.", es: "Trabajamos en una oficina." }
        - level: A1
          point: { uk: II дієвідміна, en: Conjugation II, es: Conjugación II }
          rule:
            uk: [{ term: сиді́ти }, ": ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидя́ть }] }]
            en: [{ term: сиді́ти }, ": ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидя́ть }] }]
            es: [{ term: сиді́ти }, ": ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидя́ть }] }]
          ex: ["Студе́нти ", { target: сидя́ть }, " у кла́сі."]
          tr: { en: "The students are sitting in the classroom.", es: "Los estudiantes están sentados en el aula." }
        - level: A1
          point: { uk: Закінчення, en: Endings, es: Terminaciones }
          rule:
            uk: ["I: ", { alternatives: [{ term: -еш }, { term: -уть }] }, "; II: ", { alternatives: [{ term: -иш }, { term: -ать }] }]
            en: ["I: ", { alternatives: [{ term: -еш }, { term: -уть }] }, "; II: ", { alternatives: [{ term: -иш }, { term: -ать }] }]
            es: ["I: ", { alternatives: [{ term: -еш }, { term: -уть }] }, "; II: ", { alternatives: [{ term: -иш }, { term: -ать }] }]
          ex: { examples: [["ти ", { target: чита́єш }], ["ти ", { target: сиди́ш }]] }
          tr: { en: { examples: ["you read", "you sit"] }, es: { examples: ["tú lees", "tú estás sentado"] } }
        - level: A2
          point: { uk: Чергування, en: Stem change, es: Cambio en la raíz }
          rule:
            uk: [{ term: каза́ти }, ": ", { alternatives: [{ term: кажу́ }, { term: ка́жеш }, { term: ка́жуть }] }]
            en: [{ term: каза́ти }, ": ", { alternatives: [{ term: кажу́ }, { term: ка́жеш }, { term: ка́жуть }] }]
            es: [{ term: каза́ти }, ": ", { alternatives: [{ term: кажу́ }, { term: ка́жеш }, { term: ка́жуть }] }]
          ex: ["Що ти ", { target: ка́жеш }, "?"]
          tr: { en: "What are you saying?", es: "¿Qué dices?" }
        - level: A2
          point: { uk: Чергування у формі я, en: Change in the я form, es: Cambio en la forma я }
          rule:
            uk: [{ term: ходи́ти }, ": ", { alternatives: [{ term: ходжу́ }, { term: хо́диш }] }]
            en: [{ term: ходи́ти }, ": ", { alternatives: [{ term: ходжу́ }, { term: хо́диш }] }]
            es: [{ term: ходи́ти }, ": ", { alternatives: [{ term: ходжу́ }, { term: хо́диш }] }]
          ex: ["Я ", { target: ходжу́ }, " на робо́ту пі́шки."]
          tr: { en: "I walk to work.", es: "Voy a pie al trabajo." }
        - level: A2
          point: { uk: Апостроф, en: Apostrophe, es: Apóstrofo }
          rule:
            uk: [{ term: пи́ти }, ": ", { alternatives: [{ term: п’ю }, { term: п’єш }, { term: п’ють }] }]
            en: [{ term: пи́ти }, ": ", { alternatives: [{ term: п’ю }, { term: п’єш }, { term: п’ють }] }]
            es: [{ term: пи́ти }, ": ", { alternatives: [{ term: п’ю }, { term: п’єш }, { term: п’ють }] }]
          ex: ["Ти ", { target: п’єш }, " чай?"]
          tr: { en: "Do you drink tea?", es: "¿Bebes té?" }
        - level: B1
          point: { uk: Вставне л, en: Added л, es: л añadida }
          rule:
            uk: ["після ", { alternatives: [{ letter: б }, { letter: в }, { letter: м }, { letter: п }, { letter: ф }] }, ": ", { alternatives: [{ term: люблю́ }, { term: лю́блять }] }]
            en: ["after ", { alternatives: [{ letter: б }, { letter: в }, { letter: м }, { letter: п }, { letter: ф }] }, ": ", { alternatives: [{ term: люблю́ }, { term: лю́блять }] }]
            es: ["después de ", { alternatives: [{ letter: б }, { letter: в }, { letter: м }, { letter: п }, { letter: ф }] }, ": ", { alternatives: [{ term: люблю́ }, { term: лю́блять }] }]
          ex: ["Ді́ти ", { target: лю́блять }, " мо́ре."]
          tr: { en: "Children love the sea.", es: "A los niños les encanta el mar." }
        - level: B1
          point: { uk: Голосний в основі, en: Vowel in the stem, es: Vocal en la raíz }
          rule:
            uk: [{ term: бра́ти }, ": ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беру́ть }] }]
            en: [{ term: бра́ти }, ": ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беру́ть }] }]
            es: [{ term: бра́ти }, ": ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беру́ть }] }]
          ex: ["Я ", { target: беру́ }, " таксі́."]
          tr: { en: "I'm taking a taxi.", es: "Tomo un taxi." }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: [{ term: хоті́ти }, " — I дієвідміна: ", { term: хо́чеш }]
            en: [{ term: хоті́ти }, " is conjugation I: ", { term: хо́чеш }]
            es: [{ term: хоті́ти }, " es de la conjugación I: ", { term: хо́чеш }]
          ex: ["Ти ", { target: хо́чеш }, " чай?"]
          tr: { en: "Do you want tea?", es: "¿Quieres té?" }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "У теперішньому часі дієслово має шість форм: за особою (я, ти, він) і числом:"
              en: "In the present, a verb has six forms, by person (я, ти, він) and number:"
              es: "En presente, el verbo tiene seis formas, según la persona (я, ти, він) y el número:"
            ex: ["Я ", { target: чита́ю }, ", а ти ", { target: пи́шеш }, "."]
            tr: { en: "I'm reading and you're writing.", es: "Yo leo y tú escribes." }
          - type: rule
            level: A1
            text:
              uk: "Закінчення показує особу, тому займенник часто опускають:"
              en: "The ending shows the person, so the pronoun is often left out:"
              es: "La terminación indica la persona, por eso el pronombre suele omitirse:"
            ex: [{ target: Чита́ю }, " кни́жку."]
            tr: { en: "I'm reading a book.", es: "Leo un libro." }
          - type: rule
            level: A1
            text:
              uk: ["Дієслова бувають I і II дієвідміни; дієвідміну показують форми ", { term: ти }, " і ", { term: вони́ }, "."]
              en: ["Verbs belong to conjugation I or II; the forms for ", { term: ти }, " and ", { term: вони́ }, " show which."]
              es: ["Los verbos son de la conjugación I o de la II; las formas de ", { term: ти }, " y ", { term: вони́ }, " lo indican."]
          - type: note
            level: A1
            text:
              uk: ["Дієслово ", { term: бу́ти }, " у теперішньому часі має одну форму, ", { term: є }, ". Див. ", { link: "Особливі дієслова: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              en: ["The verb ", { term: бу́ти }, " has one present form, ", { term: є }, ". See ", { link: "Irregular Verbs: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              es: ["El verbo ", { term: бу́ти }, " tiene una sola forma de presente, ", { term: є }, ". Ver ", { link: "Verbos irregulares: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]

  - title: { uk: "Форма: I дієвідміна", en: "Form: conjugation I", es: "Forma: conjugación I" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { uk: Особа, en: Person, es: Persona } }
          - { key: chytaty, label: чита́ти }
          - { key: pratsiuvaty, label: працюва́ти }
          - { key: zhyty, label: жи́ти }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: я, chytaty: ["чита́", { ending: ю }], pratsiuvaty: ["працю́", { ending: ю }], zhyty: ["жив", { ending: у́ }] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: ти, chytaty: ["чита́", { ending: єш }], pratsiuvaty: ["працю́", { ending: єш }], zhyty: ["жив", { ending: е́ш }] }
          - { level: A1, features: { person: 3, number: sg }, person: { alternatives: [він, вона́, воно́] }, chytaty: ["чита́", { ending: є }], pratsiuvaty: ["працю́", { ending: є }], zhyty: ["жив", { ending: е́ }] }
          - { level: A1, features: { person: 1, number: pl }, person: ми, chytaty: ["чита́", { ending: ємо }], pratsiuvaty: ["працю́", { ending: ємо }], zhyty: ["жив", { ending: емо́ }] }
          - { level: A1, features: [{ person: 2, number: pl }, { person: 2, number: sg, politeness: form }], person: ви, chytaty: ["чита́", { ending: єте }], pratsiuvaty: ["працю́", { ending: єте }], zhyty: ["жив", { ending: ете́ }] }
          - { level: A1, features: { person: 3, number: pl }, person: вони́, chytaty: ["чита́", { ending: ють }], pratsiuvaty: ["працю́", { ending: ють }], zhyty: ["жив", { ending: у́ть }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Після голосного основи закінчення пишемо з ", { letter: ю }, " і ", { letter: є }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }] }, "."]
              en: ["After a vowel in the stem, the endings are written with ", { letter: ю }, " and ", { letter: є }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }] }, "."]
              es: ["Después de una vocal de la raíz, las terminaciones se escriben con ", { letter: ю }, " y ", { letter: є }, ": ", { alternatives: [{ term: чита́ю }, { term: чита́єш }] }, "."]
          - type: rule
            level: A1
            text:
              uk: ["Дієслова на ", { term: -ува́ти }, " замінюють ", { term: -ува- }, " на ", { term: -у- }, ", а дієслова на ", { term: -юва́ти }, " — ", { term: -юва- }, " на ", { term: -ю- }, ":"]
              en: ["Verbs in ", { term: -ува́ти }, " change ", { term: -ува- }, " to ", { term: -у- }, ", and verbs in ", { term: -юва́ти }, " change ", { term: -юва- }, " to ", { term: -ю- }, ":"]
              es: ["Los verbos en ", { term: -ува́ти }, " cambian ", { term: -ува- }, " por ", { term: -у- }, ", y los verbos en ", { term: -юва́ти }, ", ", { term: -юва- }, " por ", { term: -ю- }, ":"]
            ex: ["Де ви ", { target: працю́єте }, "?"]
            tr: { en: "Where do you work?", es: "¿Dónde trabaja usted?" }
          - type: rule
            level: A1
            text:
              uk: ["Звертаючись на ", { term: Ви }, " до однієї особи, уживаємо форму множини:"]
              en: ["Addressing one person as ", { term: Ви }, " takes the plural form:"]
              es: ["Al tratar a una persona de ", { term: Ви }, " se usa la forma del plural:"]
            ex: ["Ви ", { target: чита́єте }, " украї́нською?"]
            tr: { en: "Do you read Ukrainian?", es: "¿Lee usted ucraniano?" }
          - type: rule
            level: A1
            text:
              uk: ["Після приголосного основи закінчення пишемо з ", { letter: у }, " і ", { letter: е }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
              en: ["After a consonant in the stem, the endings are written with ", { letter: у }, " and ", { letter: е }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
              es: ["Después de una consonante de la raíz, las terminaciones se escriben con ", { letter: у }, " y ", { letter: е }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
            ex: ["Де ти ", { target: живе́ш }, "?"]
            tr: { en: "Where do you live?", es: "¿Dónde vives?" }

  - title: { uk: "Форма: II дієвідміна", en: "Form: conjugation II", es: "Forma: conjugación II" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { uk: Особа, en: Person, es: Persona } }
          - { key: hovoryty, label: говори́ти }
          - { key: sydity, label: сиді́ти }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: я, hovoryty: ["говор", { ending: ю́ }], sydity: ["сидж", { ending: у́ }] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: ти, hovoryty: ["гово́р", { ending: иш }], sydity: ["сид", { ending: и́ш }] }
          - { level: A1, features: { person: 3, number: sg }, person: { alternatives: [він, вона́, воно́] }, hovoryty: ["гово́р", { ending: ить }], sydity: ["сид", { ending: и́ть }] }
          - { level: A1, features: { person: 1, number: pl }, person: ми, hovoryty: ["гово́р", { ending: имо }], sydity: ["сид", { ending: имо́ }] }
          - { level: A1, features: [{ person: 2, number: pl }, { person: 2, number: sg, politeness: form }], person: ви, hovoryty: ["гово́р", { ending: ите }], sydity: ["сид", { ending: ите́ }] }
          - { level: A1, features: { person: 3, number: pl }, person: вони́, hovoryty: ["гово́р", { ending: ять }], sydity: ["сид", { ending: я́ть }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["II дієвідміна має ", { letter: и }, " у закінченнях і ", { alternatives: [{ term: -ать }, { term: -ять }] }, " у формі ", { term: вони́ }, ":"]
              en: ["Conjugation II has ", { letter: и }, " in its endings and ", { alternatives: [{ term: -ать }, { term: -ять }] }, " in the form for ", { term: вони́ }, ":"]
              es: ["La conjugación II tiene ", { letter: и }, " en las terminaciones y ", { alternatives: [{ term: -ать }, { term: -ять }] }, " en la forma de ", { term: вони́ }, ":"]
            ex: ["Вони́ ", { target: гово́рять }, " украї́нською."]
            tr: { en: "They speak Ukrainian.", es: "Hablan ucraniano." }
          - type: rule
            level: A1
            text:
              uk: ["У формі ", { term: я }, " дієслова на ", { term: -ді́ти }, " мають ", { letter: дж }, ":"]
              en: ["In the form for ", { term: я }, ", verbs in ", { term: -ді́ти }, " take ", { letter: дж }, ":"]
              es: ["En la forma de ", { term: я }, ", los verbos en ", { term: -ді́ти }, " llevan ", { letter: дж }, ":"]
            ex: ["Я ", { target: сиджу́ }, " вдо́ма."]
            tr: { en: "I'm at home.", es: "Estoy en casa." }
          - type: rule
            level: A2
            text:
              uk: ["Після ", { alternatives: [{ letter: ж }, { letter: ч }, { letter: ш }] }, " форма ", { term: вони́ }, " закінчується на ", { term: -ать }, ": ", { alternatives: [{ term: кричу́ }, { term: кричи́ш }, { term: крича́ть }] }, "."]
              en: ["After ", { alternatives: [{ letter: ж }, { letter: ч }, { letter: ш }] }, ", the form for ", { term: вони́ }, " ends in ", { term: -ать }, ": ", { alternatives: [{ term: кричу́ }, { term: кричи́ш }, { term: крича́ть }] }, "."]
              es: ["Tras ", { alternatives: [{ letter: ж }, { letter: ч }, { letter: ш }] }, ", la forma de ", { term: вони́ }, " termina en ", { term: -ать }, ": ", { alternatives: [{ term: кричу́ }, { term: кричи́ш }, { term: крича́ть }] }, "."]
            ex: ["Ді́ти ", { target: крича́ть }, " у дворі́."]
            tr: { en: "The children are shouting in the yard.", es: "Los niños gritan en el patio." }

  - title: { uk: Чергування в основі, en: Stem changes, es: Cambios en la raíz }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A2
            form:
              uk: [{ mapping: [{ term: каза́ти }, { alternatives: [{ term: кажу́ }, { term: ка́жеш }] }] }, ": ", { letter: ж }, " у всіх формах"]
              en: [{ mapping: [{ term: каза́ти }, { alternatives: [{ term: кажу́ }, { term: ка́жеш }] }] }, ": ", { letter: ж }, " in every form"]
              es: [{ mapping: [{ term: каза́ти }, { alternatives: [{ term: кажу́ }, { term: ка́жеш }] }] }, ": ", { letter: ж }, " en todas las formas"]
            ex: ["Що ви ", { target: ка́жете }, "?"]
            tr: { en: "What are you saying?", es: "¿Qué dicen ustedes?" }
          - level: A2
            form:
              uk: [{ mapping: [{ term: писа́ти }, { alternatives: [{ term: пишу́ }, { term: пи́шеш }] }] }, ": ", { letter: ш }, " у всіх формах"]
              en: [{ mapping: [{ term: писа́ти }, { alternatives: [{ term: пишу́ }, { term: пи́шеш }] }] }, ": ", { letter: ш }, " in every form"]
              es: [{ mapping: [{ term: писа́ти }, { alternatives: [{ term: пишу́ }, { term: пи́шеш }] }] }, ": ", { letter: ш }, " en todas las formas"]
            ex: ["Вона́ ", { target: пи́ше }, " лист."]
            tr: { en: "She's writing a letter.", es: "Escribe una carta." }
          - level: A2
            form:
              uk: [{ mapping: [{ term: ходи́ти }, { alternatives: [{ term: ходжу́ }, { term: хо́диш }] }] }, ": ", { letter: дж }, " лише у формі я"]
              en: [{ mapping: [{ term: ходи́ти }, { alternatives: [{ term: ходжу́ }, { term: хо́диш }] }] }, ": ", { letter: дж }, " in the я form only"]
