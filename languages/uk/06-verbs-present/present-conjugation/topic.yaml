sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "У теперішньому часі дієслово має шість форм: за особою (я, ти, він) і числом:"
              en: "In the present, a verb has six forms, by person (я, ти, він) and number:"
              es: "En presente, el verbo tiene seis formas, según la persona (я, ти, він) y el número:"
              pt: "No presente, o verbo tem seis formas, segundo a pessoa (я, ти, він) e o número:"
              fr: "Au présent, le verbe a six formes, selon la personne (я, ти, він) et le nombre :"
              de: "Im Präsens hat ein Verb sechs Formen, nach Person (я, ти, він) und Numerus:"
              it: "Al presente il verbo ha sei forme, secondo la persona (я, ти, він) e il numero:"
              pl: "W czasie teraźniejszym czasownik ma sześć form, zależnie od osoby (я, ти, він) i liczby:"
              tr: "Şimdiki zamanda fiilin altı biçimi vardır; kişiye (я, ти, він) ve sayıya göre değişir:"
              id: "Pada masa kini, kata kerja punya enam bentuk menurut persona (я, ти, він) dan jumlah:"
              vi: "Ở thì hiện tại, động từ có sáu dạng, theo ngôi (я, ти, він) và số:"
            ex: ["Я ", { target: чита́ю }, ", а ти ", { target: пи́шеш }, "."]
            tr: { en: "I'm reading and you're writing.", es: "Yo leo y tú escribes.", pt: "Eu estou lendo e você está escrevendo.", fr: "Je lis et tu écris.", de: "Ich lese und du schreibst.", it: "Io leggo e tu scrivi.", pl: "Ja czytam, a ty piszesz.", tr: "Ben okuyorum, sen yazıyorsun.", id: "Saya membaca dan kamu menulis.", vi: "Tôi đọc còn bạn viết." }
          - type: rule
            level: A1
            text:
              uk: "Закінчення показує особу, тому займенник часто опускають:"
              en: "The ending shows the person, so the pronoun is often left out:"
              es: "La terminación indica la persona, por eso el pronombre suele omitirse:"
              pt: "A terminação indica a pessoa, por isso o pronome costuma ser omitido:"
              fr: "La terminaison indique la personne, donc le pronom est souvent omis :"
              de: "Die Endung zeigt die Person, deshalb lässt man das Pronomen oft weg:"
              it: "La desinenza indica la persona, perciò il pronome spesso si omette:"
              pl: "Końcówka pokazuje osobę, więc zaimek często się pomija:"
              tr: "Ek kişiyi gösterdiği için zamir çoğu zaman düşer:"
              id: "Akhiran menunjukkan persona, sehingga pronomina sering dilesapkan:"
              vi: "Đuôi động từ cho biết ngôi, nên đại từ thường được lược bỏ:"
            ex: [{ target: Чита́ю }, " кни́жку."]
            tr: { en: "I'm reading a book.", es: "Leo un libro.", pt: "Estou lendo um livro.", fr: "Je lis un livre.", de: "Ich lese ein Buch.", it: "Leggo un libro.", pl: "Czytam książkę.", tr: "Kitap okuyorum.", id: "Saya membaca buku.", vi: "Tôi đang đọc sách." }
          - type: rule
            level: A1
            text:
              uk: ["Дієслова бувають I і II дієвідміни; дієвідміну показують форми ", { term: ти }, " і ", { term: вони́ }, "."]
              en: ["Verbs belong to conjugation I or II; the forms for ", { term: ти }, " and ", { term: вони́ }, " show which."]
              es: ["Los verbos son de la conjugación I o de la II; las formas de ", { term: ти }, " y ", { term: вони́ }, " lo indican."]
              pt: ["Os verbos são da conjugação I ou da II; as formas de ", { term: ти }, " e ", { term: вони́ }, " mostram qual."]
              fr: ["Les verbes sont de la conjugaison I ou II ; les formes de ", { term: ти }, " et ", { term: вони́ }, " indiquent laquelle."]
              de: ["Verben gehören zur Konjugation I oder II; die Formen für ", { term: ти }, " und ", { term: вони́ }, " zeigen, zu welcher."]
              it: ["I verbi sono della coniugazione I o della II; le forme di ", { term: ти }, " e ", { term: вони́ }, " indicano quale."]
              pl: ["Czasowniki należą do koniugacji I lub II; którą, pokazują formy ", { term: ти }, " i ", { term: вони́ }, "."]
              tr: ["Fiiller I. ya da II. çekimdendir; hangisi olduğunu ", { term: ти }, " ve ", { term: вони́ }, " biçimleri gösterir."]
              id: ["Kata kerja termasuk konjugasi I atau II; bentuk ", { term: ти }, " dan ", { term: вони́ }, " menunjukkan yang mana."]
              vi: ["Động từ thuộc kiểu chia I hoặc II; dạng của ", { term: ти }, " và ", { term: вони́ }, " cho biết kiểu nào."]
          - type: note
            level: A1
            text:
              uk: ["Дієслово ", { term: бу́ти }, " у теперішньому часі має одну форму, ", { term: є }, ". Див. ", { link: "Особливі дієслова: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              en: ["The verb ", { term: бу́ти }, " has one present form, ", { term: є }, ". See ", { link: "Irregular Verbs: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              es: ["El verbo ", { term: бу́ти }, " tiene una sola forma de presente, ", { term: є }, ". Ver ", { link: "Verbos irregulares: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              pt: ["O verbo ", { term: бу́ти }, " tem uma única forma no presente, ", { term: є }, ". Veja ", { link: "Verbos irregulares: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              fr: ["Le verbe ", { term: бу́ти }, " n’a qu’une forme au présent, ", { term: є }, ". Voir ", { link: "Verbes irréguliers : бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              de: ["Das Verb ", { term: бу́ти }, " hat im Präsens nur eine Form, ", { term: є }, ". Siehe ", { link: "Unregelmäßige Verben: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              it: ["Il verbo ", { term: бу́ти }, " ha una sola forma al presente, ", { term: є }, ". Vedi ", { link: "Verbi irregolari: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              pl: ["Czasownik ", { term: бу́ти }, " ma w czasie teraźniejszym jedną formę, ", { term: є }, ". Zobacz ", { link: "Czasowniki nieregularne: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              tr: ["Şimdiki zamanda ", { term: бу́ти }, " fiilinin tek bir biçimi vardır: ", { term: є }, ". Bkz. ", { link: "Düzensiz fiiller: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              id: ["Kata kerja ", { term: бу́ти }, " hanya punya satu bentuk pada masa kini, ", { term: є }, ". Lihat ", { link: "Kata kerja tidak beraturan: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]
              vi: ["Động từ ", { term: бу́ти }, " chỉ có một dạng ở thì hiện tại, là ", { term: є }, ". Xem ", { link: "Động từ bất quy tắc: бути, могти, дати, їсти", to: uk.verbs-present.irregular-verbs }, "."]

  - title: { uk: "Форма: I дієвідміна", en: "Form: conjugation I", es: "Forma: conjugación I", pt: "Forma: conjugação I", fr: "Forme : conjugaison I", de: "Form: Konjugation I", it: "Forma: coniugazione I", pl: "Forma: koniugacja I", tr: "Biçim: I. çekim", id: "Bentuk: konjugasi I", vi: "Dạng: kiểu chia I" }
