  - title: { uk: Наголос, en: Stress, es: El acento }
    role: pronunciation
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["У багатьох дієсловах наголос не рухається: ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }, "."]
              en: ["In many verbs the stress stays put: ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }, "."]
              es: ["En muchos verbos el acento no se mueve: ", { alternatives: [{ term: чита́ю }, { term: чита́єш }, { term: чита́ють }] }, "."]
          - type: rule
            level: A1
            text:
              uk: ["В інших наголос завжди падає на закінчення: ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидимо́ }, { term: сидя́ть }] }, "."]
              en: ["In others, the ending always takes the stress: ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидимо́ }, { term: сидя́ть }] }, "."]
              es: ["En otros, la terminación siempre lleva el acento: ", { alternatives: [{ term: сиджу́ }, { term: сиди́ш }, { term: сидимо́ }, { term: сидя́ть }] }, "."]
          - type: rule
            level: A2
            text:
              uk: "У третіх наголос у формі я падає на закінчення, а в інших формах — на основу:"
              en: "In a third group, the я form stresses the ending and the other forms the stem:"
              es: "En un tercer grupo, la forma я lleva el acento en la terminación y las demás en la raíz:"
            ex: { examples: [{ alternatives: [{ target: кажу́ }, { target: ка́жеш }] }, { alternatives: [{ target: ходжу́ }, { target: хо́диш }] }] }
            tr: { en: { examples: [{ alternatives: ["I say", "you say"] }, { alternatives: ["I walk", "you walk"] }] }, es: { examples: [{ alternatives: [digo, dices] }, { alternatives: [camino, caminas] }] } }
          - type: note
            level: B1
            text:
              uk: [{ term: бра́ти }, " теж має наголос на закінченні в усіх формах: ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беремо́ }, { term: беру́ть }] }, "."]
              en: [{ term: бра́ти }, " also stresses the ending in every form: ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беремо́ }, { term: беру́ть }] }, "."]
              es: [{ term: бра́ти }, " también acentúa la terminación en todas las formas: ", { alternatives: [{ term: беру́ }, { term: бере́ш }, { term: беремо́ }, { term: беру́ть }] }, "."]

