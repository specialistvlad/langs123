title: { uk: "Особливі дієслова: бути, могти, дати, їсти", en: "Irregular Verbs: бути, могти, дати, їсти", es: "Verbos irregulares: бути, могти, дати, їсти", pt: "Verbos irregulares: бути, могти, дати, їсти", fr: "Verbes irréguliers : бути, могти, дати, їсти", de: "Unregelmäßige Verben: бути, могти, дати, їсти", it: "Verbi irregolari: бути, могти, дати, їсти", pl: "Czasowniki nieregularne: бути, могти, дати, їсти", tr: "Düzensiz fiiller: бути, могти, дати, їсти", id: "Kata kerja tidak beraturan: бути, могти, дати, їсти", vi: "Động từ bất quy tắc: бути, могти, дати, їсти" }
summary:
  lead:
    uk: ["Кілька частих дієслів змінюються не за зразком: ", { term: бу́ти }, " має в теперішньому часі одну форму ", { term: є }, ", а ", { term: да́ти }, " і ", { term: ї́сти }, " — власні закінчення."]
    en: ["A few common verbs break the pattern: ", { term: бу́ти }, " has one present form, ", { term: є }, ", and ", { term: да́ти }, " and ", { term: ї́сти }, " take endings of their own."]
    es: ["Unos pocos verbos frecuentes se salen del modelo: ", { term: бу́ти }, " tiene una sola forma de presente, ", { term: є }, ", y ", { term: да́ти }, " e ", { term: ї́сти }, " tienen terminaciones propias."]
    pt: ["Alguns verbos frequentes fogem ao modelo: ", { term: бу́ти }, " tem uma única forma no presente, ", { term: є }, ", e ", { term: да́ти }, " e ", { term: ї́сти }, " têm terminações próprias."]
    fr: ["Quelques verbes fréquents sortent du modèle : ", { term: бу́ти }, " n’a qu’une forme au présent, ", { term: є }, ", et ", { term: да́ти }, " et ", { term: ї́сти }, " ont des terminaisons propres."]
    de: ["Einige häufige Verben folgen keinem Muster: ", { term: бу́ти }, " hat im Präsens nur eine Form, ", { term: є }, ", und ", { term: да́ти }, " und ", { term: ї́сти }, " haben eigene Endungen."]
    it: ["Alcuni verbi frequenti escono dal modello: ", { term: бу́ти }, " ha una sola forma al presente, ", { term: є }, ", mentre ", { term: да́ти }, " e ", { term: ї́сти }, " hanno desinenze proprie."]
    pl: ["Kilka częstych czasowników odbiega od wzoru: ", { term: бу́ти }, " ma w czasie teraźniejszym jedną formę, ", { term: є }, ", a ", { term: да́ти }, " i ", { term: ї́сти }, " mają własne końcówki."]
    tr: ["Birkaç sık fiil kalıba uymaz: ", { term: бу́ти }, " şimdiki zamanda tek bir biçim alır, ", { term: є }, "; ", { term: да́ти }, " ile ", { term: ї́сти }, " ise kendi eklerini alır."]
    id: ["Beberapa kata kerja yang sering dipakai tidak mengikuti pola: ", { term: бу́ти }, " hanya punya satu bentuk pada masa kini, ", { term: є }, ", sedangkan ", { term: да́ти }, " dan ", { term: ї́сти }, " punya akhiran sendiri."]
    vi: ["Một vài động từ thông dụng không theo quy tắc: ", { term: бу́ти }, " chỉ có một dạng ở thì hiện tại là ", { term: є }, ", còn ", { term: да́ти }, " và ", { term: ї́сти }, " có đuôi riêng."]
  rule:
    uk: ["Дієслово ", { term: бу́ти }, " у теперішньому часі має одну форму для всіх осіб:"]
    en: ["The verb ", { term: бу́ти }, " has one present form for every person:"]
    es: ["El verbo ", { term: бу́ти }, " tiene una sola forma de presente para todas las personas:"]
    pt: ["O verbo ", { term: бу́ти }, " tem uma única forma no presente para todas as pessoas:"]
    fr: ["Le verbe ", { term: бу́ти }, " a une seule forme au présent pour toutes les personnes :"]
    de: ["Das Verb ", { term: бу́ти }, " hat im Präsens für alle Personen nur eine Form:"]
    it: ["Il verbo ", { term: бу́ти }, " ha una sola forma al presente per tutte le persone:"]
    pl: ["Czasownik ", { term: бу́ти }, " ma w czasie teraźniejszym jedną formę dla wszystkich osób:"]
    tr: ["Şimdiki zamanda ", { term: бу́ти }, " fiili tüm kişiler için tek bir biçim alır:"]
    id: ["Kata kerja ", { term: бу́ти }, " punya satu bentuk masa kini untuk semua persona:"]
    vi: ["Động từ ", { term: бу́ти }, " chỉ có một dạng ở thì hiện tại cho mọi ngôi:"]
  ex: { examples: [["У ме́не ", { target: є }, " брат."], ["Тут ", { target: є }, " кафе́?"]] }

