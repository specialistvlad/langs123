title: { uk: "Особливі дієслова: бути, могти, дати, їсти", en: "Irregular Verbs: бути, могти, дати, їсти", es: "Verbos irregulares: бути, могти, дати, їсти" }
summary:
  lead:
    uk: ["Кілька частих дієслів змінюються не за зразком: ", { term: бу́ти }, " має в теперішньому часі одну форму ", { term: є }, ", а ", { term: да́ти }, " і ", { term: ї́сти }, " — власні закінчення."]
    en: ["A few common verbs break the pattern: ", { term: бу́ти }, " has one present form, ", { term: є }, ", and ", { term: да́ти }, " and ", { term: ї́сти }, " take endings of their own."]
    es: ["Unos pocos verbos frecuentes se salen del modelo: ", { term: бу́ти }, " tiene una sola forma de presente, ", { term: є }, ", y ", { term: да́ти }, " e ", { term: ї́сти }, " tienen terminaciones propias."]
  rule:
    uk: ["Дієслово ", { term: бу́ти }, " у теперішньому часі має одну форму для всіх осіб:"]
    en: ["The verb ", { term: бу́ти }, " has one present form for every person:"]
    es: ["El verbo ", { term: бу́ти }, " tiene una sola forma de presente para todas las personas:"]
  ex: { examples: [["У ме́не ", { target: є }, " брат."], ["Тут ", { target: є }, " кафе́?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: "бути: теперішній час", en: "бути: present", es: "бути: presente" }
          rule:
            uk: [{ term: є }, " для всіх осіб"]
            en: [{ term: є }, " for every person"]
            es: [{ term: є }, " para todas las personas"]
          ex: ["У ме́не ", { target: є }, " брат."]
          tr: { en: "I have a brother.", es: "Tengo un hermano." }
        - level: A1
          point: { uk: "бути: майбутній час", en: "бути: future", es: "бути: futuro" }
          rule:
            uk: { alternatives: [{ term: бу́ду }, { term: бу́деш }, { term: бу́дуть }] }
            en: { alternatives: [{ term: бу́ду }, { term: бу́деш }, { term: бу́дуть }] }
            es: { alternatives: [{ term: бу́ду }, { term: бу́деш }, { term: бу́дуть }] }
          ex: ["За́втра я ", { target: бу́ду }, " вдо́ма."]
          tr: { en: "I'll be at home tomorrow.", es: "Mañana estaré en casa." }
        - level: A1
          point: { uk: могти, en: могти, es: могти }
          rule:
            uk: { alternatives: [{ term: мо́жу }, { term: мо́жеш }, { term: мо́жуть }] }
            en: { alternatives: [{ term: мо́жу }, { term: мо́жеш }, { term: мо́жуть }] }
            es: { alternatives: [{ term: мо́жу }, { term: мо́жеш }, { term: мо́жуть }] }
          ex: ["Я не ", { target: мо́жу }, " сього́дні."]
          tr: { en: "I can't today.", es: "Hoy no puedo." }
        - level: A1
          point: { uk: іти, en: іти, es: іти }
          rule:
            uk: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іду́ть }] }
            en: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іду́ть }] }
            es: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іду́ть }] }
          ex: ["Куди́ ти ", { target: йдеш }, "?"]
          tr: { en: "Where are you going?", es: "¿Adónde vas?" }
        - level: A1
          point: { uk: їхати, en: їхати, es: їхати }
          rule:
            uk: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́дуть }] }
            en: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́дуть }] }
            es: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́дуть }] }
          ex: ["Ми ", { target: ї́демо }, " додо́му."]
          tr: { en: "We're going home.", es: "Nos vamos a casa." }
        - level: A1
          point: { uk: хотіти, en: хотіти, es: хотіти }
          rule:
            uk: { alternatives: [{ term: хо́чу }, { term: хо́чеш }, { term: хо́чуть }] }
            en: { alternatives: [{ term: хо́чу }, { term: хо́чеш }, { term: хо́чуть }] }
            es: { alternatives: [{ term: хо́чу }, { term: хо́чеш }, { term: хо́чуть }] }
          ex: ["Я ", { target: хо́чу }, " ї́сти."]
          tr: { en: "I'm hungry.", es: "Tengo hambre." }
        - level: A1
          point: { uk: жити, en: жити, es: жити }
          rule:
            uk: { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }
            en: { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }
            es: { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }
          ex: ["Де ти ", { target: живе́ш }, "?"]
          tr: { en: "Where do you live?", es: "¿Dónde vives?" }
        - level: B1
          point: { uk: дати, en: дати, es: дати }
          rule:
            uk: { alternatives: [{ term: дам }, { term: даси́ }, { term: даду́ть }] }
            en: { alternatives: [{ term: дам }, { term: даси́ }, { term: даду́ть }] }
            es: { alternatives: [{ term: дам }, { term: даси́ }, { term: даду́ть }] }
          ex: ["Я ", { target: дам }, " тобі́ ключ."]
          tr: { en: "I'll give you the key.", es: "Te daré la llave." }
        - level: B1
          point: { uk: їсти, en: їсти, es: їсти }
          rule:
            uk: { alternatives: [{ term: їм }, { term: їси́ }, { term: їдя́ть }] }
            en: { alternatives: [{ term: їм }, { term: їси́ }, { term: їдя́ть }] }
            es: { alternatives: [{ term: їм }, { term: їси́ }, { term: їдя́ть }] }
          ex: ["Що ти ", { target: їси́ }, "?"]
          tr: { en: "What are you eating?", es: "¿Qué comes?" }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["«хто є хто» — без ", { term: є }]
            en: ["saying who someone is takes no ", { term: є }]
            es: ["al decir quién es alguien, sin ", { term: є }]
          ex: "Я студе́нт."
          tr: { en: "I'm a student.", es: "Soy estudiante." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Більшість дієслів змінюється за зразком I чи II дієвідміни. Див. ", { link: "Теперішній час: I і II дієвідміни", to: uk.verbs-present.present-conjugation }, "."]
              en: ["Most verbs follow conjugation I or II. See ", { link: "Present Tense: Conjugations I and II", to: uk.verbs-present.present-conjugation }, "."]
              es: ["La mayoría de los verbos sigue la conjugación I o la II. Ver ", { link: "El presente: conjugaciones I y II", to: uk.verbs-present.present-conjugation }, "."]
          - type: rule
            level: A1
            text:
              uk: "Кілька частих дієслів мають особливі форми; їх варто запам’ятати цілими."
              en: "A few common verbs have forms of their own; learn them whole."
              es: "Unos pocos verbos frecuentes tienen formas propias; conviene aprenderlas enteras."

  - title: { uk: "Бути", en: "Бути", es: "Бути" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            use: { uk: ["хто є хто, що є що: без ", { term: є }], en: ["who or what someone is: no ", { term: є }], es: ["quién o qué es alguien: sin ", { term: є }] }
            ex: "Він лі́кар."
            tr: { en: "He's a doctor.", es: "Es médico." }
          - level: A1
            use: { uk: ["наявність: ", { term: є }], en: ["having or there being: ", { term: є }], es: ["tener o haber: ", { term: є }] }
            ex: ["Тут ", { target: є }, " кафе́?"]
            tr: { en: "Is there a café here?", es: "¿Hay una cafetería aquí?" }
          - level: A1
            use: { uk: "майбутній час", en: "the future", es: "el futuro" }
            ex: ["Уве́чері ми ", { target: бу́демо }, " вдо́ма."]
            tr: { en: "We'll be at home this evening.", es: "Esta noche estaremos en casa." }
      - type: list
        items:
          - type: note
            level: A1
            text:
              uk: ["Між двома іменниками на місці пропущеного ", { term: є }, " пишемо тире."]
              en: ["Between two nouns, a dash stands where ", { term: є }, " is left out."]
              es: ["Entre dos sustantivos, una raya ocupa el lugar de ", { term: є }, "."]
            ex: "Ма́ма — лі́кар."
            tr: { en: "Mum is a doctor.", es: "Mamá es médica." }
          - type: note
            level: A1
            text:
              uk: ["Наявність: ", { link: "У мене є", to: uk.sentence.u-mene-ye }, "."]
              en: ["Having something: ", { link: "У мене є", to: uk.sentence.u-mene-ye }, "."]
              es: ["Tener algo: ", { link: "Tener: У мене є", to: uk.sentence.u-mene-ye }, "."]

  - title: { uk: "Форма: могти, іти, їхати", en: "Form: могти, іти, їхати", es: "Forma: могти, іти, їхати" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { uk: Особа, en: Person, es: Persona } }
          - { key: mohty, label: могти́, features: { tense: prs } }
          - { key: ity, label: іти́, features: { tense: prs } }
          - { key: yikhaty, label: ї́хати, features: { tense: prs } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: я, mohty: мо́жу, ity: іду́, yikhaty: ї́ду }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: ти, mohty: мо́жеш, ity: іде́ш, yikhaty: ї́деш }
          - { level: A1, features: { person: 3, number: sg }, person: { alternatives: [він, вона́, воно́] }, mohty: мо́же, ity: іде́, yikhaty: ї́де }
          - { level: A1, features: { person: 1, number: pl }, person: ми, mohty: мо́жемо, ity: ідемо́, yikhaty: ї́демо }
          - { level: A1, features: [{ person: 2, number: pl }, { person: 2, number: sg, politeness: form }], person: ви, mohty: мо́жете, ity: ідете́, yikhaty: ї́дете }
          - { level: A1, features: { person: 3, number: pl }, person: вони́, mohty: мо́жуть, ity: іду́ть, yikhaty: ї́дуть }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: [{ term: хоті́ти }, " відмінюється за I дієвідміною, з ", { letter: ч }, ":"]
              en: [{ term: хоті́ти }, " follows conjugation I, with ", { letter: ч }, ":"]
              es: [{ term: хоті́ти }, " sigue la conjugación I, con ", { letter: ч }, ":"]
            ex: ["Ми ", { target: хо́чемо }, " ка́ву."]
            tr: { en: "We'd like coffee.", es: "Queremos café." }
          - type: rule
            level: A1
            text:
              uk: ["Основа змінюється: ", { mapping: [{ term: могти́ }, { term: мо́жу }] }, ", ", { mapping: [{ term: ї́хати }, { term: ї́ду }] }, ", ", { mapping: [{ term: хоті́ти }, { term: хо́чу }] }, "."]
              en: ["The stem changes: ", { mapping: [{ term: могти́ }, { term: мо́жу }] }, ", ", { mapping: [{ term: ї́хати }, { term: ї́ду }] }, ", ", { mapping: [{ term: хоті́ти }, { term: хо́чу }] }, "."]
              es: ["La raíz cambia: ", { mapping: [{ term: могти́ }, { term: мо́жу }] }, ", ", { mapping: [{ term: ї́хати }, { term: ї́ду }] }, ", ", { mapping: [{ term: хоті́ти }, { term: хо́чу }] }, "."]
          - type: rule
            level: A1
            text:
              uk: ["Після голосного пишемо ", { term: йти }, ", ", { term: йду }, ":"]
              en: ["After a vowel, write ", { term: йти }, " and ", { term: йду }, ":"]
              es: ["Después de vocal se escribe ", { term: йти }, ", ", { term: йду }, ":"]
            ex: ["Ти ", { target: йдеш }, " додо́му?"]
            tr: { en: "Are you going home?", es: "¿Vas a casa?" }
          - type: note
            level: A1
            text:
              uk: [{ term: іти́ }, " — пішки, ", { term: ї́хати }, " — транспортом. Див. ", { link: "Іти й їхати", to: uk.motion.go-ride }, "."]
              en: [{ term: іти́ }, " is on foot, ", { term: ї́хати }, " by vehicle. See ", { link: "Іти and їхати", to: uk.motion.go-ride }, "."]
              es: [{ term: іти́ }, " es a pie; ", { term: ї́хати }, ", en un vehículo. Ver ", { link: "Ir a pie y en vehículo", to: uk.motion.go-ride }, "."]
          - type: rule
            level: A1
            text:
              uk: ["У ", { term: жи́ти }, " з’являється ", { letter: в }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
              en: [{ term: жи́ти }, " adds ", { letter: в }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
              es: [{ term: жи́ти }, " añade ", { letter: в }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }, { term: живу́ть }] }, "."]
            ex: ["Мої́ батьки́ ", { target: живу́ть }, " у Льво́ві."]
            tr: { en: "My parents live in Lviv.", es: "Mis padres viven en Leópolis." }

  - title: { uk: "Форма: дати, їсти", en: "Form: дати, їсти", es: "Forma: дати, їсти" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { uk: Особа, en: Person, es: Persona } }
          - { key: daty, label: да́ти, features: { tense: fut } }
          - { key: yisty, label: ї́сти, features: { tense: prs } }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: я, daty: дам, yisty: їм }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: ти, daty: даси́, yisty: їси́ }
          - { level: B1, features: { person: 3, number: sg }, person: { alternatives: [він, вона́, воно́] }, daty: дасть, yisty: їсть }
          - { level: B1, features: { person: 1, number: pl }, person: ми, daty: дамо́, yisty: їмо́ }
          - { level: B1, features: [{ person: 2, number: pl }, { person: 2, number: sg, politeness: form }], person: ви, daty: дасте́, yisty: їсте́ }
          - { level: B1, features: { person: 3, number: pl }, person: вони́, daty: даду́ть, yisty: їдя́ть }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: да́ти }, " — доконаний вид, тому ці форми означають майбутнє; теперішній час — ", { mapping: [{ term: дава́ти }, { term: даю́ }] }, "."]
              en: [{ term: да́ти }, " is perfective, so these forms mean the future; the present is ", { mapping: [{ term: дава́ти }, { term: даю́ }] }, "."]
              es: [{ term: да́ти }, " es perfectivo, así que estas formas expresan el futuro; el presente es ", { mapping: [{ term: дава́ти }, { term: даю́ }] }, "."]
            ex: ["Я ", { target: дам }, " тобі́ ключ."]
            tr: { en: "I'll give you the key.", es: "Te daré la llave." }
          - type: rule
            level: B1
            text:
              uk: ["Так само змінюються дієслова на ", { term: -ві́сти }, ": ", { mapping: [{ term: розпові́сти }, { term: розпові́м }] }, ", ", { mapping: [{ term: відпові́сти }, { term: відпові́м }] }, ":"]
              en: ["Verbs in ", { term: -ві́сти }, " follow the same pattern: ", { mapping: [{ term: розпові́сти }, { term: розпові́м }] }, ", ", { mapping: [{ term: відпові́сти }, { term: відпові́м }] }, ":"]
              es: ["Los verbos en ", { term: -ві́сти }, " siguen el mismo modelo: ", { mapping: [{ term: розпові́сти }, { term: розпові́м }] }, ", ", { mapping: [{ term: відпові́сти }, { term: відпові́м }] }, ":"]
            ex: ["Я тобі́ все ", { target: розпові́м }, "."]
            tr: { en: "I'll tell you everything.", es: "Te lo contaré todo." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, speakers: [en, es], wrong: Я є студе́нт., right: Я студе́нт., rule: { en: ["saying who someone is takes no ", { term: є }, "; between two nouns, a dash"], es: ["al decir quién es alguien no se usa ", { term: є }, "; entre dos sustantivos, un guion"] } }
          - { level: A1, wrong: Я не могу́ сього́дні., right: ["Я не ", { target: мо́жу }, " сього́дні."], rule: { uk: [{ mapping: [{ term: могти́ }, { term: мо́жу }] }, "; форма ", { term: могу́ }, " узята з російської"], en: [{ mapping: [{ term: могти́ }, { term: мо́жу }] }, "; the form ", { term: могу́ }, " comes from Russian"], es: [{ mapping: [{ term: могти́ }, { term: мо́жу }] }, "; la forma ", { term: могу́ }, " viene del ruso"] } }
          - { level: A1, wrong: Я бу́ду чита́ю., right: ["Я бу́ду ", { target: чита́ти }, "."], rule: { uk: ["після ", { term: бу́ду }, " — інфінітив"], en: ["after ", { term: бу́ду }, ", the infinitive"], es: ["después de ", { term: бу́ду }, ", el infinitivo"] } }
          - { level: A1, wrong: Де ти живи́ш?, right: ["Де ти ", { target: живе́ш }, "?"], rule: { uk: [{ term: жи́ти }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }] }], en: [{ term: жи́ти }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }] }], es: [{ term: жи́ти }, ": ", { alternatives: [{ term: живу́ }, { term: живе́ш }] }] } }
          - { level: B1, wrong: Ді́ти їсть суп., right: ["Ді́ти ", { target: їдя́ть }, " суп."], rule: { uk: ["вони: ", { term: їдя́ть }], en: ["the вони form is ", { term: їдя́ть }], es: ["la forma de вони es ", { term: їдя́ть }] } }
