            ex: ["Їй ", { target: подо́бається }, " Ки́їв."]
            tr: { en: "She likes Kyiv.", es: "A ella le gusta Kiev." }
          - level: A2
            form: { uk: { alternatives: [{ term: нам }, { term: вам }, { term: їм }] }, en: { alternatives: [{ term: нам }, { term: вам }, { term: їм }] }, es: { alternatives: [{ term: нам }, { term: вам }, { term: їм }] } }
            ex: ["Вам ", { target: подо́бається }, " украї́нська ку́хня?"]
            tr: { en: "Do you like Ukrainian food?", es: "¿Le gusta la cocina ucraniana?" }
          - level: A2
            form: { uk: "іменник у давальному", en: "a noun in the dative", es: "un sustantivo en dativo" }
            ex: ["Бра́тові ", { target: подо́бається }, " футбо́л."]
            tr: { en: "My brother likes football.", es: "A mi hermano le gusta el fútbol." }

