translated: { en: "81ecf1 7832c3 e0f9fb f71e82 4ae8d6 c4a9fb 2ab550", es: "81ecf1 7832c3 e0f9fb f71e82 4ae8d6 c4a9fb 2ab550" }

title: { uk: "Мені подобається", en: "Liking: мені подобається", es: "Gustar: мені подобається" }
summary:
  lead:
    uk: ["Уподобання передаємо через ", { term: подо́батися }, ": той, кому подобається, стоїть у давальному, а те, що подобається, — у називному."]
    en: ["Ukrainian says what you like with ", { term: подо́батися }, ": the person who likes takes the dative, and the thing liked is the subject."]
    es: ["El ucraniano expresa los gustos con ", { term: подо́батися }, ": quien siente el gusto va en dativo, y lo que gusta es el sujeto."]
  rule:
    uk: "Дієслово узгоджується з тим, що подобається:"
    en: "The verb agrees with the thing liked:"
    es: "El verbo concuerda con lo que gusta:"
  ex: { examples: [["Мені́ ", { target: подо́бається }, " ка́ва."], ["Мені́ ", { target: подо́баються }, " ці кві́ти."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Фраза, en: Set phrase, es: Frase hecha }
          rule:
            uk: "так кажемо, що щось до вподоби"
            en: "saying you like something"
            es: "decir que algo gusta"
          ex: ["Мені́ ", { target: подо́бається }, "."]
          tr: { en: "I like it.", es: "Me gusta." }
        - level: A1
          point: { uk: Заперечення, en: Negative, es: Negación }
          rule:
            uk: [{ term: не }, " перед дієсловом"]
            en: [{ term: не }, " before the verb"]
            es: [{ term: не }, " delante del verbo"]
          ex: ["Мені́ ", { target: не подо́бається }, "."]
          tr: { en: "I don't like it.", es: "No me gusta." }
        - level: A2
          point: { uk: Будова, en: Pattern, es: Estructura }
          rule:
            uk: { pattern: [{ slot: { uk: давальний, en: dative, es: dativo } }, { term: подо́бається }, { slot: { uk: називний, en: nominative, es: nominativo } }] }
            en: { pattern: [{ slot: { uk: давальний, en: dative, es: dativo } }, { term: подо́бається }, { slot: { uk: називний, en: nominative, es: nominativo } }] }
            es: { pattern: [{ slot: { uk: давальний, en: dative, es: dativo } }, { term: подо́бається }, { slot: { uk: називний, en: nominative, es: nominativo } }] }
          ex: ["Йому́ ", { target: подо́бається }, " Ки́їв."]
          tr: { en: "He likes Kyiv.", es: "Le gusta Kiev." }
        - level: A2
          point: { uk: Множина, en: Plural, es: Plural }
          rule:
            uk: [{ term: подо́баються }, " з множиною"]
            en: [{ term: подо́баються }, " with a plural"]
            es: [{ term: подо́баються }, " con un plural"]
          ex: ["Нам ", { target: подо́баються }, " ці пісні́."]
          tr: { en: "We like these songs.", es: "Nos gustan estas canciones." }
        - level: A2
          point: { uk: Інфінітив, en: Infinitive, es: Infinitivo }
          rule:
            uk: [{ term: подо́бається }, " з інфінітивом"]
            en: [{ term: подо́бається }, " with an infinitive"]
            es: [{ term: подо́бається }, " con un infinitivo"]
          ex: ["Їй ", { target: подо́бається }, " гуля́ти."]
          tr: { en: "She likes going for walks.", es: "Le gusta pasear." }
        - level: A2
          point: { uk: Минулий час, en: Past, es: Pasado }
          rule:
            uk: { alternatives: [{ term: сподо́бався }, { term: сподо́балася }, { term: сподо́балося }, { term: сподо́балися }] }
            en: { alternatives: [{ term: сподо́бався }, { term: сподо́балася }, { term: сподо́балося }, { term: сподо́балися }] }
            es: { alternatives: [{ term: сподо́бався }, { term: сподо́балася }, { term: сподо́балося }, { term: сподо́балися }] }
          ex: ["Студе́нтам ", { target: сподо́балася }, " екску́рсія."]
          tr: { en: "The students liked the tour.", es: "A los estudiantes les gustó la excursión." }
        - level: A1
          point: { uk: Любити, en: Любити, es: Любити }
          rule:
            uk: "стала, сильна прихильність"
            en: "a lasting, strong liking"
            es: "un gusto firme y duradero"
          ex: ["Я ", { target: люблю́ }, " кіно́."]
          tr: { en: "I love cinema.", es: "Me encanta el cine." }
        - level: B1
          point: { uk: Перше враження, en: First impression, es: Primera impresión }
          rule:
            uk: [{ term: сподо́батися }, ": почало подобатися"]
            en: [{ term: сподо́батися }, ": came to like"]
            es: [{ term: сподо́батися }, ": empezó a gustar"]
          ex: ["Вам ", { target: сподо́бався }, " фільм?"]
          tr: { en: "Did you like the film?", es: "¿Le gustó la película?" }
        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["те, що подобається, — у називному: ", { term: му́зика }]
            en: ["the thing liked is in the nominative: ", { term: му́зика }]
            es: ["lo que gusta va en nominativo: ", { term: му́зика }]
          ex: ["Тобі́ подо́бається ", { target: му́зика }, "?"]
          tr: { en: "Do you like music?", es: "¿Te gusta la música?" }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Фраза ", { term: Мені́ подо́бається }, " означає, що щось нам до вподоби:"]
              en: ["The phrase ", { term: Мені́ подо́бається }, " says you like something:"]
              es: ["La frase ", { term: Мені́ подо́бається }, " dice que algo te gusta:"]
            ex: { exchange: ["Тобі́ подо́бається Львів?", ["Так, мені́ ", { target: подо́бається }, "."]] }
            tr: { en: { exchange: ["Do you like Lviv?", "Yes, I do."] }, es: { exchange: ["¿Te gusta Leópolis?", "Sí, me gusta."] } }
          - type: rule
            level: A2
            text:
              uk: "Той, кому подобається, стоїть у давальному; те, що подобається, — у називному, і дієслово узгоджується з ним:"
              en: "The person who likes takes the dative; the thing liked takes the nominative, and the verb agrees with it:"
              es: "Quien siente el gusto va en dativo; lo que gusta va en nominativo, y el verbo concuerda con ello:"
            ex: ["Ма́мі ", { target: подо́бається }, " теа́тр."]
            tr: { en: "Mum likes the theatre.", es: "A mamá le gusta el teatro." }
          - type: note
            level: A2
            readers: [es]
            text:
              es: ["Funciona como gustar: «me gusta el café» = ", { term: мені́ подо́бається ка́ва }, "."]
          - type: note
            level: A2
            text:
              uk: ["Форми давального: ", { link: Давальний відмінок, to: uk.nouns-cases.dative }, "."]
              en: ["The dative forms: ", { link: Dative Case, to: uk.nouns-cases.dative }, "."]
              es: ["Las formas del dativo: ", { link: El caso dativo, to: uk.nouns-cases.dative }, "."]

  - title: { uk: Хто відчуває, en: Who likes it, es: A quién le gusta }
    role: form
    content:
