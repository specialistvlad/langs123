    uk: ["Уподобання передаємо через ", { term: подо́батися }, ": той, кому подобається, стоїть у давальному, а те, що подобається, — у називному."]
    en: ["Ukrainian says what you like with ", { term: подо́батися }, ": the person who likes takes the dative, and the thing liked is the subject."]
    es: ["El ucraniano expresa los gustos con ", { term: подо́батися }, ": quien siente el gusto va en dativo, y lo que gusta es el sujeto."]
    pt: ["Em ucraniano, o gosto se expressa com ", { term: подо́батися }, ": quem gosta fica no dativo, e o que agrada fica no nominativo."]
    fr: ["En ukrainien, on dit ce qu’on aime avec ", { term: подо́батися }, " : celui qui aime se met au datif, et ce qui plaît est au nominatif."]
    de: ["Gefallen drückt das Ukrainische mit ", { term: подо́батися }, " aus: Wem etwas gefällt, steht im Dativ, und was gefällt, steht im Nominativ."]
    it: ["In ucraino il piacere si esprime con ", { term: подо́батися }, ": chi apprezza sta al dativo, e ciò che piace sta al nominativo."]
    pl: ["W ukraińskim to, co się komuś podoba, wyraża czasownik ", { term: подо́батися }, ": osoba stoi w celowniku, a to, co się podoba, w mianowniku."]
    tr: ["Ukraynacada beğeni ", { term: подо́батися }, " ile anlatılır: beğenen kişi yönelme hâlinde, beğenilen şey ise yalın hâlde durur."]
    id: ["Dalam bahasa Ukraina, rasa suka dinyatakan dengan ", { term: подо́батися }, ": orang yang menyukai berada dalam datif, dan hal yang disukai dalam nominatif."]
    vi: ["Tiếng Ukraina diễn đạt sự yêu thích bằng ", { term: подо́батися }, ": người thích đứng ở tặng cách, còn thứ được thích đứng ở danh cách."]
  rule:
    uk: "Дієслово узгоджується з тим, що подобається:"
    en: "The verb agrees with the thing liked:"
    es: "El verbo concuerda con lo que gusta:"
    pt: "O verbo concorda com o que agrada:"
    fr: "Le verbe s’accorde avec ce qui plaît :"
    de: "Das Verb richtet sich nach dem, was gefällt:"
    it: "Il verbo concorda con ciò che piace:"
    pl: "Czasownik zgadza się z tym, co się podoba:"
    tr: "Fiil, beğenilen şeye uyar:"
    id: "Kata kerja menyesuaikan diri dengan hal yang disukai:"
