            form: { uk: { alternatives: [{ term: мені́ }, { term: тобі́ }] }, en: { alternatives: [{ term: мені́ }, { term: тобі́ }] }, es: { alternatives: [{ term: мені́ }, { term: тобі́ }] } }
            ex: ["Тобі́ ", { target: подо́бається }, " цей фільм?"]
