        rows:
          - { level: C2, change: { uk: "терміни пояснюють", en: "terms are explained", es: "los términos se explican", pt: "os termos são explicados", fr: "les termes sont expliqués", de: "Fachbegriffe werden erklärt", it: "i termini vengono spiegati", pl: "terminy się wyjaśnia", tr: "terimler açıklanır", id: "istilah dijelaskan", vi: "thuật ngữ được giải thích" }, was: { ex: "Хлоропла́сти поглина́ють сві́тло.", tr: { en: "Chloroplasts absorb light.", es: "Los cloroplastos absorben la luz.", pt: "Os cloroplastos absorvem a luz.", fr: "Les chloroplastes absorbent la lumière.", de: "Chloroplasten absorbieren Licht.", it: "I cloroplasti assorbono la luce.", pl: "Chloroplasty pochłaniają światło.", tr: "Kloroplastlar ışığı soğurur.", id: "Kloroplas menyerap cahaya.", vi: "Lục lạp hấp thụ ánh sáng." } }, now: { ex: ["Хлоропла́сти — ", { target: "зеле́ні части́нки кліти́ни" }, " — поглина́ють сві́тло."], tr: { en: "Chloroplasts, the green parts of the cell, absorb light.", es: "Los cloroplastos, las partes verdes de la célula, absorben la luz.", pt: "Os cloroplastos, as partes verdes da célula, absorvem a luz.", fr: "Les chloroplastes, les parties vertes de la cellule, absorbent la lumière.", de: "Chloroplasten, die grünen Teile der Zelle, absorbieren Licht.", it: "I cloroplasti, le parti verdi della cellula, assorbono la luce.", pl: "Chloroplasty, zielone części komórki, pochłaniają światło.", tr: "Hücrenin yeşil parçaları olan kloroplastlar ışığı soğurur.", id: "Kloroplas, bagian hijau sel, menyerap cahaya.", vi: "Lục lạp, những phần màu xanh của tế bào, hấp thụ ánh sáng." } } }
          - { level: C2, change: { uk: "іменники стають дієсловами", en: "nouns become verbs", es: "los sustantivos pasan a verbos", pt: "os substantivos viram verbos", fr: "les noms deviennent des verbes", de: "Substantive werden zu Verben", it: "i sostantivi diventano verbi", pl: "rzeczowniki zmieniają się w czasowniki", tr: "isimler fiile dönüşür", id: "kata benda menjadi kata kerja", vi: "danh từ thành động từ" }, was: { ex: "Пі́сля закі́нчення навча́ння студе́нт отри́мує дипло́м.", tr: { en: "After the completion of studies, the student receives a diploma.", es: "Tras la finalización de los estudios, el estudiante recibe un diploma.", pt: "Após a conclusão dos estudos, o estudante recebe um diploma.", fr: "Après l’achèvement des études, l’étudiant reçoit un diplôme.", de: "Nach Abschluss des Studiums erhält der Student ein Diplom.", it: "Dopo il completamento degli studi, lo studente riceve un diploma.", pl: "Po ukończeniu nauki student otrzymuje dyplom.", tr: "Öğrenimin tamamlanmasından sonra öğrenci diploma alır.", id: "Setelah penyelesaian studi, mahasiswa menerima ijazah.", vi: "Sau khi hoàn thành chương trình học, sinh viên nhận bằng tốt nghiệp." } }, now: { ex: [{ target: "Коли́ студе́нт закі́нчує навча́ння" }, ", він отри́мує дипло́м."], tr: { en: "When the student finishes studying, he receives a diploma.", es: "Cuando el estudiante termina los estudios, recibe un diploma.", pt: "Quando o estudante termina os estudos, ele recebe um diploma.", fr: "Quand l’étudiant termine ses études, il reçoit un diplôme.", de: "Wenn der Student sein Studium abschließt, erhält er ein Diplom.", it: "Quando lo studente finisce gli studi, riceve un diploma.", pl: "Gdy student kończy naukę, otrzymuje dyplom.", tr: "Öğrenci öğrenimini bitirdiğinde diploma alır.", id: "Ketika mahasiswa menyelesaikan studi, ia menerima ijazah.", vi: "Khi sinh viên hoàn thành chương trình học, anh ấy nhận bằng tốt nghiệp." } } }
          - { level: C2, change: { uk: "пасив стає активом", en: "the passive becomes active", es: "la pasiva pasa a activa", pt: "a passiva vira ativa", fr: "le passif devient actif", de: "das Passiv wird zum Aktiv", it: "il passivo diventa attivo", pl: "strona bierna zmienia się w czynną", tr: "edilgen çatı etkene dönüşür", id: "pasif menjadi aktif", vi: "câu bị động thành chủ động" }, was: { ex: "Розчи́н було́ нагрі́то до со́рока гра́дусів.", tr: { en: "The solution was heated to forty degrees.", es: "La solución fue calentada hasta cuarenta grados.", pt: "A solução foi aquecida até quarenta graus.", fr: "La solution a été chauffée à quarante degrés.", de: "Die Lösung wurde auf vierzig Grad erhitzt.", it: "La soluzione è stata riscaldata fino a quaranta gradi.", pl: "Roztwór ogrzano do czterdziestu stopni.", tr: "Çözelti kırk dereceye kadar ısıtıldı.", id: "Larutan dipanaskan sampai empat puluh derajat.", vi: "Dung dịch được đun nóng đến bốn mươi độ." } }, now: { ex: [{ target: "Ми нагрі́ли розчи́н" }, " до со́рока гра́дусів."], tr: { en: "We heated the solution to forty degrees.", es: "Calentamos la solución hasta cuarenta grados.", pt: "Aquecemos a solução até quarenta graus.", fr: "Nous avons chauffé la solution à quarante degrés.", de: "Wir haben die Lösung auf vierzig Grad erhitzt.", it: "Abbiamo riscaldato la soluzione fino a quaranta gradi.", pl: "Ogrzaliśmy roztwór do czterdziestu stopni.", tr: "Çözeltiyi kırk dereceye kadar ısıttık.", id: "Kami memanaskan larutan sampai empat puluh derajat.", vi: "Chúng tôi đun nóng dung dịch đến bốn mươi độ." } } }
          - { level: C2, change: { uk: "формули зникають", en: "formulas disappear", es: "las fórmulas desaparecen", pt: "as fórmulas desaparecem", fr: "les formules disparaissent", de: "Formeln entfallen", it: "le formule scompaiono", pl: "formuły znikają", tr: "kalıplar kaybolur", id: "formula menghilang", vi: "công thức biến mất" }, was: { ex: "Згі́дно з нака́зом студе́нти ма́ють прийти́ о дев’я́тій.", tr: { en: "According to the order, the students must come at nine.", es: "Conforme a la orden, los estudiantes deben venir a las nueve.", pt: "Conforme a ordem, os estudantes devem vir às nove.", fr: "Conformément à l’ordre, les étudiants doivent venir à neuf heures.", de: "Gemäß der Anordnung müssen die Studenten um neun Uhr kommen.", it: "Secondo l’ordine, gli studenti devono venire alle nove.", pl: "Zgodnie z zarządzeniem studenci mają przyjść o dziewiątej.", tr: "Emir gereğince öğrenciler saat dokuzda gelmeli.", id: "Menurut perintah itu, para mahasiswa harus datang pukul sembilan.", vi: "Theo quyết định, sinh viên phải đến lúc chín giờ." } }, now: { ex: "Студе́нти ма́ють прийти́ о дев’я́тій.", tr: { en: "The students must come at nine.", es: "Los estudiantes deben venir a las nueve.", pt: "Os estudantes devem vir às nove.", fr: "Les étudiants doivent venir à neuf heures.", de: "Die Studenten müssen um neun Uhr kommen.", it: "Gli studenti devono venire alle nove.", pl: "Studenci mają przyjść o dziewiątej.", tr: "Öğrenciler saat dokuzda gelmeli.", id: "Para mahasiswa harus datang pukul sembilan.", vi: "Sinh viên phải đến lúc chín giờ." } } }

