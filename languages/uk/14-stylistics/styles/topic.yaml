            ex: { ex: [{ target: "У статті́ йде́ться про" }, " вплив му́зики на на́стрій. ", { target: "А́втор дово́дить, що" }, " му́зика допомага́є працюва́ти."], tr: { en: "The article is about the influence of music on mood. The author argues that music helps people work.", es: "El artículo trata de la influencia de la música en el estado de ánimo. El autor sostiene que la música ayuda a trabajar.", pt: "O artigo trata da influência da música no humor. O autor argumenta que a música ajuda a trabalhar.", fr: "L’article traite de l’influence de la musique sur l’humeur. L’auteur soutient que la musique aide à travailler.", de: "Der Artikel behandelt den Einfluss der Musik auf die Stimmung. Der Autor weist nach, dass Musik beim Arbeiten hilft.", it: "L’articolo parla dell’influenza della musica sull’umore. L’autore sostiene che la musica aiuta a lavorare.", pl: "Artykuł dotyczy wpływu muzyki na nastrój. Autor dowodzi, że muzyka pomaga w pracy.", tr: "Makale, müziğin ruh hâli üzerindeki etkisini ele alıyor. Yazar, müziğin çalışmaya yardımcı olduğunu savunuyor.", id: "Artikel ini membahas pengaruh musik terhadap suasana hati. Penulis berpendapat bahwa musik membantu orang bekerja.", vi: "Bài báo nói về ảnh hưởng của âm nhạc đối với tâm trạng. Tác giả chứng minh rằng âm nhạc giúp làm việc." } }
