      rows:
        - level: C1
          point: { uk: Розмовний, en: "Conversational", es: "Coloquial", pt: "Coloquial", fr: "Conversationnel", de: "Alltagsstil", it: "Colloquiale", pl: "Potoczny", tr: "Konuşma üslubu", id: "Ragam percakapan", vi: "Khẩu ngữ" }
          rule: { uk: "зменшені форми, еліпсис", en: "diminutive forms, ellipsis", es: "formas diminutivas, elipsis", pt: "formas diminutivas, elipse", fr: "formes diminutives, ellipse", de: "Verkleinerungsformen, Ellipse", it: "forme diminutive, ellissi", pl: "zdrobnienia, elipsa", tr: "küçültme sözcükleri, eksilti", id: "bentuk diminutif, elipsis", vi: "từ chỉ sự nhỏ bé, tỉnh lược" }
