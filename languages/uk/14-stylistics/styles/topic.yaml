            structure: { uk: "тема, факти, висновок", en: "topic, facts, conclusion", es: "tema, hechos, conclusión", pt: "tema, fatos, conclusão", fr: "sujet, faits, conclusion", de: "Thema, Fakten, Schluss", it: "tema, fatti, conclusione", pl: "temat, fakty, wniosek", tr: "konu, olgular, sonuç", id: "topik, fakta, kesimpulan", vi: "chủ đề, sự kiện, kết luận" }
            ex: { ex: [{ target: "Хо́чу розпові́сти про" }, " істо́рію на́шого мі́ста."], tr: { en: "I want to tell you about the history of our city.", es: "Quiero contarles la historia de nuestra ciudad.", pt: "Quero contar a história da nossa cidade.", fr: "Je veux vous raconter l’histoire de notre ville.", de: "Ich möchte über die Geschichte unserer Stadt berichten.", it: "Voglio raccontare la storia della nostra città.", pl: "Chcę opowiedzieć o historii naszego miasta.", tr: "Şehrimizin tarihini anlatmak istiyorum.", id: "Saya ingin bercerita tentang sejarah kota kami.", vi: "Tôi muốn kể về lịch sử thành phố của chúng ta." } }
