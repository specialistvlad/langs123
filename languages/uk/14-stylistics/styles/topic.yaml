          tr: { en: "Grandma, give me a little water!", es: "¡Abuelita, dame un poquito de agua!", pt: "Vovó, me dá um pouquinho de água!", fr: "Mamie, donne-moi un peu d’eau !", de: "Oma, gib mir ein Schlückchen Wasser!", it: "Nonnina, dammi un po’ d’acqua!", pl: "Babciu, daj mi troszkę wody!", tr: "Anneanne, bana azıcık su ver!", id: "Nenek, minta air sedikit, ya!", vi: "Bà ơi, cho cháu xin chút nước nhé!" }
        - level: C1
          point: { uk: Офіційно-діловий, en: "Official", es: "Administrativo", pt: "Administrativo", fr: "Administratif", de: "Amtsstil", it: "Amministrativo", pl: "Urzędowy", tr: "Resmî üslup", id: "Ragam resmi-administratif", vi: "Hành chính – công vụ" }
          rule: { uk: "формули, іменники, інфінітив у наказі", en: "formulas, nouns, infinitive as a command", es: "fórmulas, sustantivos, infinitivo como orden", pt: "fórmulas, substantivos, infinitivo como ordem", fr: "formules, noms, infinitif à valeur d’ordre", de: "Formeln, Substantive, Infinitiv als Befehl", it: "formule, sostantivi, infinito come ordine", pl: "formuły, rzeczowniki, bezokolicznik w funkcji rozkazu", tr: "kalıplar, isimler, emir yerine mastar", id: "formula, kata benda, infinitif sebagai perintah", vi: "công thức, danh từ, động từ nguyên mẫu làm mệnh lệnh" }
          ex: [{ target: "Пода́ти" }, " докуме́нти до пе́ршого ве́ресня."]
          tr: { en: "Submit the documents by 1 September.", es: "Presentar los documentos hasta el 1 de septiembre.", pt: "Entregar os documentos até 1º de setembro.", fr: "Remettre les documents avant le 1er septembre.", de: "Die Unterlagen bis zum 1. September einreichen.", it: "Presentare i documenti entro il 1° settembre.", pl: "Złożyć dokumenty do 1 września.", tr: "Belgeler 1 Eylül’e kadar teslim edilmelidir.", id: "Dokumen diserahkan paling lambat 1 September.", vi: "Nộp hồ sơ trước ngày 1 tháng 9." }
        - level: C1
          point: { uk: Науковий, en: "Scientific", es: "Científico", pt: "Científico", fr: "Scientifique", de: "Wissenschaftsstil", it: "Scientifico", pl: "Naukowy", tr: "Bilimsel üslup", id: "Ragam ilmiah", vi: "Khoa học" }
          rule: { uk: "терміни й пасивні дієприкметники", en: "terms and passive participles", es: "términos y participios pasivos", pt: "termos e particípios passivos", fr: "termes et participes passifs", de: "Fachbegriffe und Partizipien Passiv", it: "termini e participi passivi", pl: "terminy i imiesłowy bierne", tr: "terimler ve edilgen sıfat-fiiller", id: "istilah dan partisipel pasif", vi: "thuật ngữ và phân từ bị động" }
          ex: [{ target: "Отри́маний" }, " розчи́н нагрі́ли до со́рока гра́дусів."]
          tr: { en: "The solution obtained was heated to forty degrees.", es: "La solución obtenida se calentó hasta cuarenta grados.", pt: "A solução obtida foi aquecida até quarenta graus.", fr: "La solution obtenue a été chauffée à quarante degrés.", de: "Die erhaltene Lösung wurde auf vierzig Grad erhitzt.", it: "La soluzione ottenuta è stata riscaldata fino a quaranta gradi.", pl: "Otrzymany roztwór ogrzano do czterdziestu stopni.", tr: "Elde edilen çözelti kırk dereceye kadar ısıtıldı.", id: "Larutan yang diperoleh dipanaskan sampai empat puluh derajat.", vi: "Dung dịch thu được được đun nóng đến bốn mươi độ." }
        - level: C1
          point: { uk: Публіцистичний, en: "Journalistic", es: "Periodístico", pt: "Jornalístico", fr: "Journalistique", de: "Publizistischer Stil", it: "Giornalistico", pl: "Publicystyczny", tr: "Gazetecilik üslubu", id: "Ragam jurnalistik", vi: "Chính luận" }
          rule: { uk: "риторичні питання, оцінні епітети", en: "rhetorical questions, evaluative epithets", es: "preguntas retóricas, epítetos valorativos", pt: "perguntas retóricas, epítetos valorativos", fr: "questions rhétoriques, épithètes évaluatives", de: "rhetorische Fragen, wertende Epitheta", it: "domande retoriche, epiteti valutativi", pl: "pytania retoryczne, epitety oceniające", tr: "retorik sorular, değerlendirici sıfatlar", id: "pertanyaan retoris, epitet penilaian", vi: "câu hỏi tu từ, tính từ mang ý đánh giá" }
          ex: [{ target: "Чому́ мі́сто так до́вго мовчи́ть" }, " про цю пробле́му?"]
          tr: { en: "Why has the city been silent about this problem for so long?", es: "¿Por qué la ciudad lleva tanto tiempo callando sobre este problema?", pt: "Por que a cidade está calada há tanto tempo sobre esse problema?", fr: "Pourquoi la ville se tait-elle depuis si longtemps sur ce problème ?", de: "Warum schweigt die Stadt schon so lange zu diesem Problem?", it: "Perché la città tace da così tanto tempo su questo problema?", pl: "Dlaczego miasto tak długo milczy o tym problemie?", tr: "Şehir bu sorun hakkında neden bu kadar uzun süredir susuyor?", id: "Mengapa kota ini begitu lama diam tentang masalah ini?", vi: "Tại sao thành phố im lặng về vấn đề này lâu đến vậy?" }
        - level: C1
          point: { uk: Художній, en: "Literary", es: "Literario", pt: "Literário", fr: "Littéraire", de: "Literarischer Stil", it: "Letterario", pl: "Artystyczny", tr: "Edebî üslup", id: "Ragam sastra", vi: "Nghệ thuật" }
          rule: { uk: "тропи й інверсія", en: "tropes and inversion", es: "tropos e inversión", pt: "tropos e inversão", fr: "tropes et inversion", de: "Tropen und Inversion", it: "tropi e inversione", pl: "tropy i inwersja", tr: "söz sanatları ve devrik cümle", id: "majas dan inversi", vi: "phép tu từ và đảo ngữ" }
          ex: ["Реве́ та стогне́ ", { target: "Дніпр широ́кий" }, "."]
          tr: { en: "The broad Dnipro roars and groans.", es: "Ruge y gime el ancho Dnipro.", pt: "Ruge e geme o largo Dnipro.", fr: "Le vaste Dnipro mugit et gémit.", de: "Der breite Dnipro braust und stöhnt.", it: "Mugghia e geme il largo Dnipro.", pl: "Huczy i jęczy szeroki Dniepr.", tr: "Geniş Dnipro gürler ve inler.", id: "Sungai Dnipro yang lebar menderu dan mengerang.", vi: "Dòng sông Dnipro rộng lớn gầm vang và rên rỉ." }
        - level: C1
          point: { uk: Конфесійний, en: "Religious", es: "Religioso", pt: "Religioso", fr: "Religieux", de: "Religiöser Stil", it: "Religioso", pl: "Religijny", tr: "Dinî üslup", id: "Ragam keagamaan", vi: "Tôn giáo" }
          rule: { uk: "кличний відмінок і давні форми", en: "vocative and old forms", es: "vocativo y formas antiguas", pt: "vocativo e formas antigas", fr: "vocatif et formes anciennes", de: "Vokativ und alte Formen", it: "vocativo e forme antiche", pl: "wołacz i dawne formy", tr: "seslenme hâli ve eski biçimler", id: "vokatif dan bentuk lama", vi: "hô cách và các dạng cổ" }
          ex: ["Благослови́, ", { target: "Го́споди" }, ", на́шу зе́млю."]
          tr: { en: "Bless our land, O Lord.", es: "Bendice, Señor, nuestra tierra.", pt: "Abençoa, Senhor, a nossa terra.", fr: "Bénis, Seigneur, notre terre.", de: "Segne, Herr, unser Land.", it: "Benedici, Signore, la nostra terra.", pl: "Błogosław, Panie, naszą ziemię.", tr: "Ey Rab, ülkemizi kutsa.", id: "Berkatilah tanah kami, ya Tuhan.", vi: "Lạy Chúa, xin ban phúc cho đất nước chúng con." }
        - level: C1
          point: { uk: Епістолярний, en: "Epistolary", es: "Epistolar", pt: "Epistolar", fr: "Épistolaire", de: "Briefstil", it: "Epistolare", pl: "Epistolarny", tr: "Mektup üslubu", id: "Ragam surat-menyurat", vi: "Thư tín" }
          rule: { uk: [{ term: Ви }, " з великої, формули привітання й прощання"], en: [{ term: Ви }, " capitalised, greeting and closing formulas"], es: [{ term: Ви }, " con mayúscula, fórmulas de saludo y despedida"], pt: [{ term: Ви }, " com maiúscula, fórmulas de saudação e despedida"], fr: [{ term: Ви }, " avec une majuscule, formules d’ouverture et de clôture"], de: [{ term: Ви }, " mit großem Anfangsbuchstaben, Anrede- und Grußformeln"], it: [{ term: Ви }, " con la maiuscola, formule di saluto e di congedo"], pl: [{ term: Ви }, " wielką literą, formuły powitania i pożegnania"], tr: [{ term: Ви }, " büyük harfle, hitap ve veda kalıpları"], id: [{ term: Ви }, " dengan huruf kapital, formula salam pembuka dan penutup"], vi: [{ term: Ви }, " viết hoa, công thức chào đầu và chào cuối thư"] }
          ex: ["Сподіва́юся на ", { target: "Ва́шу" }, " ві́дповідь."]
          tr: { en: "I look forward to your reply.", es: "Espero su respuesta.", pt: "Aguardo a sua resposta.", fr: "J’espère recevoir votre réponse.", de: "Ich hoffe auf Ihre Antwort.", it: "Spero in una Sua risposta.", pl: "Z nadzieją czekam na odpowiedź.", tr: "Yanıtınızı umutla bekliyorum.", id: "Saya mengharapkan balasan Anda.", vi: "Tôi mong nhận được hồi âm của Quý vị." }
        - level: C1
          point: { uk: План тексту, en: "Text plan", es: "El plan del texto", pt: "O plano do texto", fr: "Le plan du texte", de: "Gliederung des Textes", it: "Il piano del testo", pl: "Plan tekstu", tr: "Metin planı", id: "Rencana teks", vi: "Dàn ý của văn bản" }
          rule: { uk: "вступ, основна частина, висновок", en: "introduction, main part, conclusion", es: "introducción, parte principal, conclusión", pt: "introdução, parte principal, conclusão", fr: "introduction, développement, conclusion", de: "Einleitung, Hauptteil, Schluss", it: "introduzione, parte centrale, conclusione", pl: "wstęp, rozwinięcie, zakończenie", tr: "giriş, gelişme, sonuç", id: "pendahuluan, isi, kesimpulan", vi: "mở đầu, nội dung chính, kết luận" }
          ex: { target: "Чи гото́ве мі́сто до зими́?" }
          tr: { en: "Is the city ready for winter?", es: "¿Está la ciudad preparada para el invierno?", pt: "A cidade está pronta para o inverno?", fr: "La ville est-elle prête pour l’hiver ?", de: "Ist die Stadt auf den Winter vorbereitet?", it: "La città è pronta per l’inverno?", pl: "Czy miasto jest gotowe na zimę?", tr: "Şehir kışa hazır mı?", id: "Apakah kota ini siap menghadapi musim dingin?", vi: "Thành phố đã sẵn sàng cho mùa đông chưa?" }
        - level: C2
          point: { uk: Забарвлена лексика, en: "Stylistically coloured vocabulary", es: "Léxico marcado", pt: "Léxico marcado", fr: "Le lexique marqué", de: "Stilistisch gefärbter Wortschatz", it: "Lessico connotato", pl: "Słownictwo nacechowane", tr: "Üslup değeri taşıyan sözcükler", id: "Kosakata bernuansa", vi: "Từ vựng mang sắc thái" }
          rule: { uk: "нейтральні, застарілі, діалектні, фахові слова", en: "neutral, obsolete, dialect and occupational words", es: "palabras neutras, anticuadas, dialectales y profesionales", pt: "palavras neutras, antiquadas, dialetais e profissionais", fr: "mots neutres, vieillis, dialectaux et professionnels", de: "neutrale, veraltete, mundartliche und fachsprachliche Wörter", it: "parole neutre, antiquate, dialettali e professionali", pl: "wyrazy neutralne, przestarzałe, gwarowe i fachowe", tr: "yansız, eskimiş, ağıza özgü ve mesleki sözcükler", id: "kata netral, usang, dialek, dan profesi", vi: "từ trung tính, từ cũ, từ địa phương và từ nghề nghiệp" }
          ex: { contrast: [{ target: "говори́ти" }, { target: "просторі́кувати" }] }
          tr: { en: { contrast: ["to speak", "to hold forth"] }, es: { contrast: ["hablar", "perorar"] }, pt: { contrast: ["falar", "palavrear"] }, fr: { contrast: ["parler", "pérorer"] }, de: { contrast: ["sprechen", "schwadronieren"] }, it: { contrast: ["parlare", "sproloquiare"] }, pl: { contrast: ["mówić", "perorować"] }, tr: { contrast: ["konuşmak", "nutuk atmak"] }, id: { contrast: ["berbicara", "bertele-tele"] }, vi: { contrast: ["nói", "nói dài dòng"] } }
        - level: C2
          point: { uk: Зміна стилю, en: "Changing the style", es: "Cambio de estilo", pt: "Mudança de estilo", fr: "Changement de style", de: "Stilwechsel", it: "Cambio di stile", pl: "Zmiana stylu", tr: "Üslup değiştirme", id: "Pergantian ragam", vi: "Chuyển đổi phong cách" }
          rule: { uk: "пасив стає активом, формули зникають", en: "the passive becomes active, formulas disappear", es: "la pasiva pasa a activa, las fórmulas desaparecen", pt: "a passiva vira ativa, as fórmulas desaparecem", fr: "le passif devient actif, les formules disparaissent", de: "das Passiv wird zum Aktiv, die Formeln entfallen", it: "il passivo diventa attivo, le formule scompaiono", pl: "strona bierna zmienia się w czynną, formuły znikają", tr: "edilgen çatı etkene dönüşür, kalıplar kaybolur", id: "pasif menjadi aktif, formula menghilang", vi: "câu bị động thành chủ động, công thức biến mất" }
