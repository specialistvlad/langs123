            ex: { ex: ["Цю до́відку ви́дано Окса́ні Ковале́нко ", { target: "в то́му, що" }, " вона́ навча́ється в університе́ті."], tr: { en: "This certificate is issued to Oksana Kovalenko to confirm that she studies at the university.", es: "Se expide este certificado a Oksana Kovalenko para hacer constar que estudia en la universidad.", pt: "Esta declaração é emitida para Oksana Kovalenko para atestar que ela estuda na universidade.", fr: "La présente attestation est délivrée à Oksana Kovalenko pour certifier qu’elle étudie à l’université.", de: "Diese Bescheinigung wird Oksana Kovalenko darüber ausgestellt, dass sie an der Universität studiert.", it: "Il presente certificato è rilasciato a Oksana Kovalenko per attestare che studia all’università.", pl: "Niniejsze zaświadczenie wydano Oksanie Kovalenko na potwierdzenie, że studiuje na uniwersytecie.", tr: "Bu belge, Oksana Kovalenko’nun üniversitede öğrenim gördüğünü belgelemek üzere düzenlenmiştir.", id: "Surat keterangan ini diberikan kepada Oksana Kovalenko untuk menerangkan bahwa ia kuliah di universitas.", vi: "Giấy xác nhận này cấp cho Oksana Kovalenko để xác nhận rằng cô ấy đang học tại trường đại học." } }
