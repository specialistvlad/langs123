        - level: C2
          point: { uk: Реферат, en: "Abstract", es: "Resumen", pt: "Resumo", fr: "Résumé", de: "Referat", it: "Riassunto", pl: "Referat", tr: "Özet", id: "Ringkasan", vi: "Bản tóm tắt" }
          rule: { uk: "стійкі звороти про зміст і думку автора", en: "set phrases about the content and the author's view", es: "fórmulas fijas sobre el contenido y la opinión del autor", pt: "fórmulas fixas sobre o conteúdo e a opinião do autor", fr: "tournures figées sur le contenu et l’avis de l’auteur", de: "feste Wendungen zu Inhalt und Meinung des Autors", it: "formule fisse sul contenuto e sull’opinione dell’autore", pl: "stałe zwroty o treści i poglądzie autora", tr: "içerik ve yazarın görüşü için kalıp ifadeler", id: "ungkapan tetap tentang isi dan pendapat penulis", vi: "cụm cố định về nội dung và quan điểm của tác giả" }
          ex: [{ target: "У статті́ йде́ться про" }, " вплив му́зики на на́стрій."]
          tr: { en: "The article is about the influence of music on mood.", es: "El artículo trata de la influencia de la música en el estado de ánimo.", pt: "O artigo trata da influência da música no humor.", fr: "L’article traite de l’influence de la musique sur l’humeur.", de: "Der Artikel behandelt den Einfluss der Musik auf die Stimmung.", it: "L’articolo parla dell’influenza della musica sull’umore.", pl: "Artykuł dotyczy wpływu muzyki na nastrój.", tr: "Makale, müziğin ruh hâli üzerindeki etkisini ele alıyor.", id: "Artikel ini membahas pengaruh musik terhadap suasana hati.", vi: "Bài báo nói về ảnh hưởng của âm nhạc đối với tâm trạng." }
        - level: C2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: [{ term: згі́дно з }, " вимагає орудного відмінка"], en: [{ term: згі́дно з }, " takes the instrumental"], es: [{ term: згі́дно з }, " pide el instrumental"], pt: [{ term: згі́дно з }, " pede o instrumental"], fr: [{ term: згі́дно з }, " demande l’instrumental"], de: [{ term: згі́дно з }, " steht mit dem Instrumental"], it: [{ term: згі́дно з }, " vuole lo strumentale"], pl: [{ term: згі́дно з }, " łączy się z narzędnikiem"], tr: [{ term: згі́дно з }, " araç hâliyle kullanılır"], id: [{ term: згі́дно з }, " memakai instrumental"], vi: [{ term: згі́дно з }, " đi với công cụ cách"] }
          ex: [{ target: "Згі́дно з нака́зом" }, " відпу́стка почина́ється в ли́пні."]
          tr: { en: "According to the order, the leave begins in July.", es: "Conforme a la orden, las vacaciones empiezan en julio.", pt: "Conforme a ordem, as férias começam em julho.", fr: "Conformément à l’ordre, les congés commencent en juillet.", de: "Gemäß der Anordnung beginnt der Urlaub im Juli.", it: "Secondo l’ordine, le ferie iniziano a luglio.", pl: "Zgodnie z zarządzeniem urlop zaczyna się w lipcu.", tr: "Emir gereğince izin temmuzda başlıyor.", id: "Menurut perintah itu, cuti dimulai pada bulan Juli.", vi: "Theo quyết định, kỳ nghỉ phép bắt đầu vào tháng Bảy." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { uk: "Одну думку в різних стилях висловлюють різними формами:", en: "The same thought takes different forms in different styles:", es: "La misma idea se expresa con formas distintas en cada estilo:", pt: "A mesma ideia se expressa com formas diferentes em cada estilo:", fr: "Une même idée s’exprime sous des formes différentes selon le style :", de: "Ein und derselbe Gedanke erhält in jedem Stil andere Formen:", it: "Lo stesso pensiero si esprime con forme diverse in ogni stile:", pl: "Tę samą myśl wyraża się w różnych stylach różnymi formami:", tr: "Aynı düşünce her üslupta farklı biçimlerle söylenir:", id: "Satu gagasan diungkapkan dengan bentuk yang berbeda dalam setiap ragam:", vi: "Cùng một ý được diễn đạt bằng những hình thức khác nhau trong từng phong cách:" }
            ex: { contrast: ["Ну й спе́ка!", "Температу́ра пові́тря переви́щила три́дцять гра́дусів."] }
            tr: { en: { contrast: ["What a scorcher!", "The air temperature exceeded thirty degrees."] }, es: { contrast: ["¡Qué calor!", "La temperatura del aire superó los treinta grados."] }, pt: { contrast: ["Nossa, que calor!", "A temperatura do ar ultrapassou trinta graus."] }, fr: { contrast: ["Quelle chaleur !", "La température de l’air a dépassé trente degrés."] }, de: { contrast: ["Mensch, ist das heiß!", "Die Lufttemperatur hat dreißig Grad überschritten."] }, it: { contrast: ["Che caldo!", "La temperatura dell’aria ha superato i trenta gradi."] }, pl: { contrast: ["Ale upał!", "Temperatura powietrza przekroczyła trzydzieści stopni."] }, tr: { contrast: ["Ne sıcak!", "Hava sıcaklığı otuz dereceyi aştı."] }, id: { contrast: ["Panas banget!", "Suhu udara melampaui tiga puluh derajat."] }, vi: { contrast: ["Nóng gì mà nóng thế!", "Nhiệt độ không khí đã vượt quá ba mươi độ."] } }
          - type: note
            level: C1
            text: { uk: ["Звертання у різних стилях: ", { link: Ти і Ви, to: uk.pronouns.ty-vy }, "."], en: ["Forms of address in the different styles: ", { link: "Ти and Ви", to: uk.pronouns.ty-vy }, "."], es: ["El trato en los distintos estilos: ", { link: "Ти y Ви", to: uk.pronouns.ty-vy }, "."], pt: ["O tratamento nos diferentes estilos: ", { link: "Ти e Ви", to: uk.pronouns.ty-vy }, "."], fr: ["Les formes d’adresse dans les différents styles : ", { link: "Ти et Ви", to: uk.pronouns.ty-vy }, "."], de: ["Die Anrede in den verschiedenen Stilen: ", { link: "Ти und Ви", to: uk.pronouns.ty-vy }, "."], it: ["Il modo di rivolgersi nei diversi stili: ", { link: "Ти e Ви", to: uk.pronouns.ty-vy }, "."], pl: ["Zwracanie się w różnych stylach: ", { link: "Ти i Ви", to: uk.pronouns.ty-vy }, "."], tr: ["Farklı üsluplarda hitap: ", { link: "Ти ve Ви", to: uk.pronouns.ty-vy }, "."], id: ["Sapaan dalam ragam yang berbeda: ", { link: "Ти dan Ви", to: uk.pronouns.ty-vy }, "."], vi: ["Cách xưng hô trong các phong cách khác nhau: ", { link: "Ти và Ви", to: uk.pronouns.ty-vy }, "."] }

  - title: { uk: Сім стилів, en: "Seven styles", es: "Siete estilos", pt: "Sete estilos", fr: "Sept styles", de: "Sieben Stile", it: "Sette stili", pl: "Siedem stylów", tr: "Yedi üslup", id: "Tujuh ragam", vi: "Bảy phong cách" }
    role: own
    content:
      - type: usage
        columns:
          - { key: style, label: { uk: Стиль, en: "Style", es: "Estilo", pt: "Estilo", fr: "Style", de: "Stil", it: "Stile", pl: "Styl", tr: "Üslup", id: "Ragam", vi: "Phong cách" } }
          - { key: aim, label: { uk: Мета, en: "Purpose", es: "Finalidad", pt: "Finalidade", fr: "But", de: "Zweck", it: "Scopo", pl: "Cel", tr: "Amaç", id: "Tujuan", vi: "Mục đích" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, style: { uk: розмовний, en: "conversational", es: "coloquial", pt: "coloquial", fr: "conversationnel", de: "Alltagsstil", it: "colloquiale", pl: "potoczny", tr: "konuşma üslubu", id: "ragam percakapan", vi: "khẩu ngữ" }, aim: { uk: "щоденне спілкування", en: "daily communication", es: "comunicación cotidiana", pt: "comunicação cotidiana", fr: "communication quotidienne", de: "Alltagskommunikation", it: "comunicazione quotidiana", pl: "codzienna komunikacja", tr: "günlük iletişim", id: "komunikasi sehari-hari", vi: "giao tiếp hằng ngày" }, ex: { ex: "Приві́т! Ти вже сні́дав?", tr: { en: "Hi! Have you had breakfast yet?", es: "¡Hola! ¿Ya desayunaste?", pt: "Oi! Você já tomou café da manhã?", fr: "Salut ! Tu as déjà pris ton petit-déjeuner ?", de: "Hallo! Hast du schon gefrühstückt?", it: "Ciao! Hai già fatto colazione?", pl: "Cześć! Jadłeś już śniadanie?", tr: "Merhaba! Kahvaltı ettin mi?", id: "Hai! Kamu sudah sarapan?", vi: "Chào! Bạn ăn sáng chưa?" } } }
          - { level: C1, style: { uk: офіційно-діловий, en: "official", es: "administrativo", pt: "administrativo", fr: "administratif", de: "Amtsstil", it: "amministrativo", pl: "urzędowy", tr: "resmî üslup", id: "ragam resmi-administratif", vi: "hành chính – công vụ" }, aim: { uk: "документи й розпорядження", en: "documents and orders", es: "documentos y disposiciones", pt: "documentos e ordens", fr: "documents et directives", de: "Dokumente und Anordnungen", it: "documenti e disposizioni", pl: "dokumenty i zarządzenia", tr: "belgeler ve talimatlar", id: "dokumen dan instruksi", vi: "văn bản và chỉ thị" }, ex: { ex: "Прошу́ нада́ти мені́ відпу́стку.", tr: { en: "I request that I be granted leave.", es: "Solicito que se me concedan vacaciones.", pt: "Solicito que me sejam concedidas férias.", fr: "Je demande qu’un congé me soit accordé.", de: "Ich bitte darum, mir Urlaub zu gewähren.", it: "Chiedo che mi vengano concesse le ferie.", pl: "Proszę o udzielenie mi urlopu.", tr: "Bana izin verilmesini rica ederim.", id: "Saya mengajukan permohonan cuti.", vi: "Tôi đề nghị cho tôi được nghỉ phép." } } }
          - { level: C1, style: { uk: науковий, en: "scientific", es: "científico", pt: "científico", fr: "scientifique", de: "Wissenschaftsstil", it: "scientifico", pl: "naukowy", tr: "bilimsel üslup", id: "ragam ilmiah", vi: "khoa học" }, aim: { uk: "пояснення й докази", en: "explanation and proof", es: "explicación y pruebas", pt: "explicação e provas", fr: "explication et preuves", de: "Erklärung und Beweis", it: "spiegazione e prove", pl: "wyjaśnianie i dowodzenie", tr: "açıklama ve kanıt", id: "penjelasan dan bukti", vi: "giải thích và chứng minh" }, ex: { ex: "Вода́ кипи́ть за температу́ри сто гра́дусів.", tr: { en: "Water boils at a temperature of one hundred degrees.", es: "El agua hierve a una temperatura de cien grados.", pt: "A água ferve à temperatura de cem graus.", fr: "L’eau bout à une température de cent degrés.", de: "Wasser siedet bei einer Temperatur von hundert Grad.", it: "L’acqua bolle alla temperatura di cento gradi.", pl: "Woda wrze w temperaturze stu stopni.", tr: "Su, yüz derece sıcaklıkta kaynar.", id: "Air mendidih pada suhu seratus derajat.", vi: "Nước sôi ở nhiệt độ một trăm độ." } } }
          - { level: C1, style: { uk: публіцистичний, en: "journalistic", es: "periodístico", pt: "jornalístico", fr: "journalistique", de: "publizistischer Stil", it: "giornalistico", pl: "publicystyczny", tr: "gazetecilik üslubu", id: "ragam jurnalistik", vi: "chính luận" }, aim: { uk: "вплив на думку читачів", en: "influence on readers' opinion", es: "influir en la opinión de los lectores", pt: "influenciar a opinião dos leitores", fr: "influencer l’opinion des lecteurs", de: "Einfluss auf die Meinung der Leser", it: "influenzare l’opinione dei lettori", pl: "wpływ na opinię czytelników", tr: "okurların görüşünü etkileme", id: "memengaruhi pendapat pembaca", vi: "tác động đến quan điểm của người đọc" }, ex: { ex: "Чи гото́ве мі́сто до зими́?", tr: { en: "Is the city ready for winter?", es: "¿Está la ciudad preparada para el invierno?", pt: "A cidade está pronta para o inverno?", fr: "La ville est-elle prête pour l’hiver ?", de: "Ist die Stadt auf den Winter vorbereitet?", it: "La città è pronta per l’inverno?", pl: "Czy miasto jest gotowe na zimę?", tr: "Şehir kışa hazır mı?", id: "Apakah kota ini siap menghadapi musim dingin?", vi: "Thành phố đã sẵn sàng cho mùa đông chưa?" } } }
          - { level: C1, style: { uk: художній, en: "literary", es: "literario", pt: "literário", fr: "littéraire", de: "literarischer Stil", it: "letterario", pl: "artystyczny", tr: "edebî üslup", id: "ragam sastra", vi: "nghệ thuật" }, aim: { uk: "образ і почуття", en: "image and feeling", es: "imagen y sentimiento", pt: "imagem e sentimento", fr: "image et sentiment", de: "Bild und Gefühl", it: "immagine e sentimento", pl: "obraz i uczucie", tr: "imge ve duygu", id: "citra dan perasaan", vi: "hình tượng và cảm xúc" }, ex: { ex: "Над рі́чкою стоя́ла ти́ха ніч.", tr: { en: "A quiet night stood over the river.", es: "Sobre el río reposaba una noche tranquila.", pt: "Sobre o rio pairava uma noite tranquila.", fr: "Une nuit tranquille régnait sur la rivière.", de: "Über dem Fluss lag eine stille Nacht.", it: "Sul fiume si stendeva una notte tranquilla.", pl: "Nad rzeką stała cicha noc.", tr: "Nehrin üzerinde sessiz bir gece duruyordu.", id: "Malam yang sunyi berdiri di atas sungai.", vi: "Trên dòng sông, một đêm yên tĩnh trải dài." } } }
          - { level: C1, style: { uk: конфесійний, en: "religious", es: "religioso", pt: "religioso", fr: "religieux", de: "religiöser Stil", it: "religioso", pl: "religijny", tr: "dinî üslup", id: "ragam keagamaan", vi: "tôn giáo" }, aim: { uk: "молитва й проповідь", en: "prayer and sermon", es: "oración y sermón", pt: "oração e sermão", fr: "prière et sermon", de: "Gebet und Predigt", it: "preghiera e predica", pl: "modlitwa i kazanie", tr: "dua ve vaaz", id: "doa dan khotbah", vi: "lời cầu nguyện và bài giảng" }, ex: { ex: "О́тче наш, що єси́ на небеса́х.", tr: { en: "Our Father, who art in heaven.", es: "Padre nuestro, que estás en el cielo.", pt: "Pai nosso, que estais no céu.", fr: "Notre Père, qui es aux cieux.", de: "Vater unser im Himmel.", it: "Padre nostro, che sei nei cieli.", pl: "Ojcze nasz, któryś jest w niebie.", tr: "Göklerdeki Babamız.", id: "Bapa kami yang di surga.", vi: "Lạy Cha chúng con ở trên trời." } } }
          - { level: C1, style: { uk: епістолярний, en: "epistolary", es: "epistolar", pt: "epistolar", fr: "épistolaire", de: "Briefstil", it: "epistolare", pl: "epistolarny", tr: "mektup üslubu", id: "ragam surat-menyurat", vi: "thư tín" }, aim: { uk: "особисте й ділове листування", en: "personal and business letters", es: "correspondencia personal y profesional", pt: "correspondência pessoal e profissional", fr: "correspondance personnelle et professionnelle", de: "private und geschäftliche Korrespondenz", it: "corrispondenza personale e di lavoro", pl: "korespondencja prywatna i służbowa", tr: "kişisel ve iş yazışmaları", id: "surat-menyurat pribadi dan dinas", vi: "thư từ cá nhân và công việc" }, ex: { ex: "Шано́вна па́ні Окса́но! Дя́кую Вам за лист.", tr: { en: "Dear Ms Oksana! Thank you for your letter.", es: "¡Estimada señora Oksana! Le agradezco su carta.", pt: "Prezada senhora Oksana! Agradeço a sua carta.", fr: "Chère Madame Oksana ! Je vous remercie de votre lettre.", de: "Sehr geehrte Frau Oksana! Ich danke Ihnen für Ihren Brief.", it: "Gentile signora Oksana! La ringrazio per la Sua lettera.", pl: "Szanowna Pani Oksano! Dziękuję za list.", tr: "Sayın Oksana Hanım! Mektubunuz için teşekkür ederim.", id: "Yang terhormat Ibu Oksana! Terima kasih atas surat Ibu.", vi: "Kính gửi bà Oksana! Xin cảm ơn bà về bức thư." } } }

  - title: { uk: Ознаки стилів, en: "Features of the styles", es: "Rasgos de los estilos", pt: "Traços dos estilos", fr: "Traits des styles", de: "Merkmale der Stile", it: "Tratti degli stili", pl: "Cechy stylów", tr: "Üslupların özellikleri", id: "Ciri-ciri ragam", vi: "Đặc điểm của các phong cách" }
