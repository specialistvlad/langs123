# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.stylistics.styles
lang: uk
kind: grammar
tags: [stylistics, register, style, official, scientific, journalistic, artistic, letters]
concepts: [register]
related: [uk.pronouns.ty-vy, uk.foundations.euphony, uk.word-formation.word-formation, uk.sentence.participle-phrases, uk.sentence.word-order]
status: { uk: draft }

title: { uk: Стилі мови, en: Styles of Language }
summary:
  lead:
    uk: "Українська мова має сім стилів: розмовний, офіційно-діловий, науковий, публіцистичний, художній, конфесійний і епістолярний, кожен зі своїми формами."
  rule:
    uk: "Те саме прохання в розмові й в офіційному тексті має різні форми:"
  ex: { contrast: ["Мо́жна, я за́втра не прийду́?", "Прошу́ нада́ти мені́ вихідни́й день."] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт } }
        - { key: rule, label: { uk: Правило } }
        - { key: ex, label: { uk: Приклад } }
      rows:
        - level: C1
          point: { uk: Розмовний }
          rule: { uk: "зменшені форми, еліпсис" }
          ex: ["Дай, бабу́сю, ", { target: "води́чки" }, "!"]
        - level: C1
          point: { uk: Офіційно-діловий }
          rule: { uk: "формули, іменники, інфінітив у наказі" }
          ex: [{ target: "Пода́ти" }, " докуме́нти до пе́ршого ве́ресня."]
        - level: C1
          point: { uk: Науковий }
          rule: { uk: "терміни й пасивні дієприкметники" }
          ex: [{ target: "Отри́маний" }, " розчи́н нагрі́ли до со́рока гра́дусів."]
        - level: C1
          point: { uk: Публіцистичний }
          rule: { uk: "риторичні питання, оцінні епітети" }
          ex: [{ target: "Чому́ мі́сто так до́вго мовчи́ть" }, " про цю пробле́му?"]
        - level: C1
          point: { uk: Художній }
          rule: { uk: "тропи й інверсія" }
          ex: ["Реве́ та стогне́ ", { target: "Дніпр широ́кий" }, "."]
        - level: C1
          point: { uk: Конфесійний }
          rule: { uk: "кличний відмінок і давні форми" }
          ex: ["Благослови́, ", { target: "Го́споди" }, ", на́шу зе́млю."]
        - level: C1
          point: { uk: Епістолярний }
          rule: { uk: [{ term: Ви }, " з великої, формули привітання й прощання"] }
          ex: ["Сподіва́юся на ", { target: "Ва́шу" }, " ві́дповідь."]
        - level: C1
          point: { uk: План тексту }
          rule: { uk: "вступ, основна частина, висновок" }
          ex: { target: "Чи гото́ве мі́сто до зими́?" }
        - level: C2
          point: { uk: Забарвлена лексика }
          rule: { uk: "нейтральні, застарілі, діалектні, фахові слова" }
          ex: { contrast: [{ target: "говори́ти" }, { target: "просторі́кувати" }] }
        - level: C2
          point: { uk: Зміна стилю }
          rule: { uk: "пасив стає активом, формули зникають" }
          ex: ["Ми ", { target: "нагрі́ли розчи́н" }, " до со́рока гра́дусів."]
        - level: C2
          point: { uk: Реферат }
          rule: { uk: "стійкі звороти про зміст і думку автора" }
          ex: [{ target: "У статті́ йде́ться про" }, " вплив му́зики на на́стрій."]
        - level: C2
          point: { uk: Пастка }
          rule: { uk: [{ term: згі́дно з }, " вимагає орудного відмінка"] }
          ex: [{ target: "Згі́дно з нака́зом" }, " відпу́стка почина́ється в ли́пні."]

sections:
  - title: { uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { uk: "Одну думку в різних стилях висловлюють різними формами:" }
            ex: { contrast: ["Ну й спе́ка!", "Температу́ра пові́тря переви́щила три́дцять гра́дусів."] }
          - type: note
            level: C1
            text: { uk: ["Звертання у різних стилях: ", { link: Ти і Ви, to: uk.pronouns.ty-vy }, "."] }

  - title: { uk: Сім стилів }
    role: own
    content:
      - type: usage
        columns:
          - { key: style, label: { uk: Стиль } }
          - { key: aim, label: { uk: Мета } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C1, style: { uk: розмовний }, aim: { uk: "щоденне спілкування" }, ex: "Приві́т! Ти вже сні́дав?" }
          - { level: C1, style: { uk: офіційно-діловий }, aim: { uk: "документи й розпорядження" }, ex: "Прошу́ нада́ти мені́ відпу́стку." }
          - { level: C1, style: { uk: науковий }, aim: { uk: "пояснення й докази" }, ex: "Вода́ кипи́ть за температу́ри сто гра́дусів." }
          - { level: C1, style: { uk: публіцистичний }, aim: { uk: "вплив на думку читачів" }, ex: "Чи гото́ве мі́сто до зими́?" }
          - { level: C1, style: { uk: художній }, aim: { uk: "образ і почуття" }, ex: "Над рі́чкою стоя́ла ти́ха ніч." }
          - { level: C1, style: { uk: конфесійний }, aim: { uk: "молитва й проповідь" }, ex: "О́тче наш, що єси́ на небеса́х." }
          - { level: C1, style: { uk: епістолярний }, aim: { uk: "особисте й ділове листування" }, ex: "Шано́вна па́ні Окса́но! Дя́кую Вам за лист." }

  - title: { uk: Ознаки стилів }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { uk: Ознака } }
          - { key: style, label: { uk: Стиль } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C1, sign: { uk: "зменшені форми" }, style: { uk: розмовний }, ex: ["Дай, бабу́сю, ", { target: "води́чки" }, "!"] }
          - { level: C1, sign: { uk: "скорочені форми імен" }, style: { uk: розмовний }, ex: ["Ході́мо на ка́ву, ", { target: "Са́ню" }, "?"] }
          - { level: C1, sign: { uk: еліпсис }, style: { uk: розмовний }, ex: { exchange: ["Ти в кіно́?", { target: "Ага́, з Оле́ною." }] } }
          - { level: C1, sign: { uk: "канцелярські формули" }, style: { uk: офіційно-діловий }, ex: [{ target: "Прошу́ розгля́нути" }, " мою́ зая́ву."] }
          - { level: C1, sign: { uk: "іменникові звороти" }, style: { uk: офіційно-діловий }, ex: [{ target: "Прове́дення переві́рки" }, " відбу́деться в п’я́тницю."] }
          - { level: C1, sign: { uk: "інфінітив у наказі" }, style: { uk: офіційно-діловий }, ex: [{ target: "Пода́ти" }, " докуме́нти до пе́ршого ве́ресня."] }
          - { level: C1, sign: { uk: терміни }, style: { uk: науковий }, ex: ["У ", { target: "хлоропла́стах" }, " відбува́ється ", { target: "фотоси́нтез" }, "."] }
          - { level: C1, sign: { uk: "пасивні дієприкметники" }, style: { uk: науковий }, ex: [{ target: "Отри́маний" }, " розчи́н нагрі́ли до со́рока гра́дусів."] }
          - { level: C1, sign: { uk: "риторичні питання" }, style: { uk: публіцистичний }, ex: [{ target: "Чому́ мі́сто так до́вго мовчи́ть" }, " про цю пробле́му?"] }
          - { level: C1, sign: { uk: "оцінні епітети" }, style: { uk: публіцистичний }, ex: ["Це ", { target: "гане́бне" }, " рі́шення вла́ди."] }
          - { level: C1, sign: { uk: тропи }, style: { uk: художній }, ex: [{ target: "Ніч накри́ла село́ чо́рною ху́сткою" }, "."] }
          - { level: C1, sign: { uk: інверсія }, style: { uk: художній }, ex: ["Реве́ та стогне́ ", { target: "Дніпр широ́кий" }, "."] }
          - { level: C1, sign: { uk: "високі форми" }, style: { uk: конфесійний }, ex: ["Благослови́, ", { target: "Го́споди" }, ", на́шу зе́млю."] }
          - { level: C1, sign: { uk: [{ term: Ви }, " з великої літери"] }, style: { uk: епістолярний }, ex: ["Сподіва́юся на ", { target: "Ва́шу" }, " ві́дповідь."] }
          - { level: C1, sign: { uk: "привітання й прощання" }, style: { uk: епістолярний }, ex: { examples: [{ target: "Дороги́й Андрі́ю!" }, [{ target: "З пова́гою" }, ", Оле́на."]] } }
      - type: list
        items:
          - type: note
            level: C1
            text: { uk: ["Зменшені форми: ", { link: Словотвір, to: uk.word-formation.word-formation }, ". Дієприкметники: ", { link: Дієприкметникові й дієприслівникові звороти, to: uk.sentence.participle-phrases }, ". Інверсія: ", { link: Порядок слів, to: uk.sentence.word-order }, "."] }

  - title: { uk: План тексту }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { uk: "План публіцистичного тексту має три частини, і в кожній працюють свої засоби:" }
      - type: usage
        columns:
          - { key: part, label: { uk: Частина } }
          - { key: task, label: { uk: Завдання } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C1, part: { uk: вступ }, task: { uk: "питання чи звертання привертає увагу" }, ex: "Чи гото́ве мі́сто до зими́?" }
          - { level: C1, part: { uk: "основна частина" }, task: { uk: "факти; повтор підкреслює головне" }, ex: "У мі́сті не вистача́є лопа́т. У мі́сті не вистача́є лю́дей." }
          - { level: C1, part: { uk: висновок }, task: { uk: "заклик або питання без відповіді" }, ex: "Чи не час готува́тися вже за́раз?" }
      - type: list
        items:
          - type: note
            level: C1
            text: { uk: ["Питання, повтор і звертання в тексті: ", { link: Синтаксичні засоби виразності, to: uk.stylistics.syntactic-devices }, "."] }

  - title: { uk: Забарвлена лексика }
    role: own
    content:
      - type: usage
        columns:
          - { key: kind, label: { uk: Різновид } }
          - { key: sign, label: { uk: Ознака } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C2, kind: { uk: "нейтральні й забарвлені" }, sign: { uk: "слово без оцінки й слово з оцінкою" }, ex: { contrast: ["говори́ти", "просторі́кувати"] } }
          - { level: C2, kind: { uk: "архаїзми й історизми" }, sign: { uk: "слова минулих епох" }, ex: { alternatives: ["боя́рин", "клейно́д"] } }
          - { level: C2, kind: { uk: "авторські новотвори" }, sign: { uk: "слова, створені письменником" }, ex: "злотоці́нно" }
          - { level: C2, kind: { uk: діалектизми }, sign: { uk: "слова місцевих говірок" }, ex: { alternatives: ["ва́тра", "коли́ба"] } }
          - { level: C2, kind: { uk: професіоналізми }, sign: { uk: "слова певного фаху" }, ex: { alternatives: ["контро́льна", "кані́кули"] } }
          - { level: C2, kind: { uk: канцеляризми }, sign: { uk: "слова офіційних текстів" }, ex: { alternatives: ["згі́дно з", "відпові́дно до", "у зв’я́зку з"] } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { uk: [{ term: згі́дно з }, " і ", { term: у зв’я́зку з }, " вимагають орудного відмінка, ", { term: відпові́дно до }, " — родового:"] }
            ex: { examples: [[{ target: "Згі́дно з нака́зом" }, " відпу́стка почина́ється в ли́пні."], [{ target: "Відпові́дно до зако́ну" }, " ми ма́ємо пра́во на відпу́стку."]] }
          - type: note
            level: C2
            text: { uk: ["Прийменники офіційних текстів: ", { link: Складні прийменники, to: uk.prepositions.complex-prepositions }, "."] }

  - title: { uk: Зміна стилю }
    role: own
    content:
      - type: usage
        columns:
          - { key: change, label: { uk: Що змінюється } }
          - { key: was, label: { uk: Було } }
          - { key: now, label: { uk: Стало } }
        rows:
          - { level: C2, change: { uk: "терміни пояснюють" }, was: "Хлоропла́сти поглина́ють сві́тло.", now: ["Хлоропла́сти — ", { target: "зеле́ні части́нки кліти́ни" }, " — поглина́ють сві́тло."] }
          - { level: C2, change: { uk: "іменники стають дієсловами" }, was: "Пі́сля закі́нчення навча́ння студе́нт отри́мує дипло́м.", now: [{ target: "Коли́ студе́нт закі́нчує навча́ння" }, ", він отри́мує дипло́м."] }
          - { level: C2, change: { uk: "пасив стає активом" }, was: "Розчи́н було́ нагрі́то до со́рока гра́дусів.", now: [{ target: "Ми нагрі́ли розчи́н" }, " до со́рока гра́дусів."] }
          - { level: C2, change: { uk: "формули зникають" }, was: "Згі́дно з нака́зом студе́нти ма́ють прийти́ о дев’я́тій.", now: "Студе́нти ма́ють прийти́ о дев’я́тій." }

  - title: { uk: Вторинні тексти }
    role: own
    content:
      - type: usage
        columns:
          - { key: kind, label: { uk: Текст } }
          - { key: structure, label: { uk: Будова } }
          - { key: ex, label: { uk: Типовий зворот } }
        rows:
          - level: C2
            kind: { uk: реферат }
            structure: { uk: "тема, головні думки автора, висновок" }
            ex: [{ target: "У статті́ йде́ться про" }, " вплив му́зики на на́стрій. ", { target: "А́втор дово́дить, що" }, " му́зика допомага́є працюва́ти."]
          - level: C2
            kind: { uk: повідомлення }
            structure: { uk: "тема, факти, висновок" }
            ex: [{ target: "Хо́чу розпові́сти про" }, " істо́рію на́шого мі́ста."]
          - level: C2
            kind: { uk: довідка }
            structure: { uk: "назва, факт, підстава" }
            ex: ["Цю до́відку ви́дано Окса́ні Ковале́нко ", { target: "в то́му, що" }, " вона́ навча́ється в університе́ті."]
      - type: list
        items:
          - type: note
            level: C2
            text: { uk: ["Початкове ", { term: У }, " перед приголосним: ", { link: Милозвучність, to: uk.foundations.euphony }, "."] }

  - title: { uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: C1, wrong: "Прошу́ да́ти мені́ відпу́сточку.", right: ["Прошу́ ", { target: "нада́ти" }, " мені́ ", { target: "відпу́стку" }, "."], rule: { uk: "в офіційному тексті немає зменшених форм і розмовних слів" } }
          - { level: C2, wrong: "Згі́дно нака́зу відпу́стка почина́ється в ли́пні.", right: [{ target: "Згі́дно з нака́зом" }, " відпу́стка почина́ється в ли́пні."], rule: { uk: [{ term: згі́дно з }, " вимагає орудного відмінка"] } }
          - { level: C2, wrong: "В статті́ йде́ться про вплив му́зики.", right: [{ target: У }, " статті́ йде́ться про вплив му́зики."], rule: { uk: ["на початку речення перед приголосним стоїть ", { term: У }] } }
