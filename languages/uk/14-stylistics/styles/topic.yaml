Imiesłowy: ", { link: "Wyrażenia imiesłowowe", to: uk.sentence.participle-phrases }, ". Inwersja: ", { link: "Szyk wyrazów", to: uk.sentence.word-order }, "."], tr: ["Küçültme sözcükleri: ", { link: "Sözcük türetme", to: uk.word-formation.word-formation }, ". Sıfat-fiiller: ", { link: "Sıfat-fiil ve zarf-fiil öbekleri", to: uk.sentence.participle-phrases }, ". Devrik cümle: ", { link: "Sözcük sırası", to: uk.sentence.word-order }, "."], id: ["Diminutif: ", { link: "Pembentukan kata", to: uk.word-formation.word-formation }, ". Partisipel: ", { link: "Frasa partisipel", to: uk.sentence.participle-phrases }, ". Inversi: ", { link: "Urutan kata", to: uk.sentence.word-order }, "."], vi: ["Từ chỉ sự nhỏ bé: ", { link: "Cấu tạo từ", to: uk.word-formation.word-formation }, ". Phân từ: ", { link: "Cụm phân từ", to: uk.sentence.participle-phrases }, ". Đảo ngữ: ", { link: "Trật tự từ", to: uk.sentence.word-order }, "."] }

  - title: { uk: План тексту, en: "Text plan", es: "El plan del texto", pt: "O plano do texto", fr: "Le plan du texte", de: "Gliederung des Textes", it: "Il piano del testo", pl: "Plan tekstu", tr: "Metin planı", id: "Rencana teks", vi: "Dàn ý của văn bản" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { uk: "План публіцистичного тексту має три частини, і в кожній працюють свої засоби:", en: "A journalistic text has a plan of three parts, and each part uses its own devices:", es: "El plan de un texto periodístico tiene tres partes, y cada una usa sus propios recursos:", pt: "O plano de um texto jornalístico tem três partes, e cada uma usa seus próprios recursos:", fr: "Le plan d’un texte journalistique a trois parties, et chacune emploie ses propres procédés :", de: "Ein publizistischer Text gliedert sich in drei Teile, und jeder Teil nutzt eigene Mittel:", it: "Il piano di un testo giornalistico ha tre parti, e ognuna usa i propri mezzi:", pl: "Plan tekstu publicystycznego ma trzy części, a w każdej działają własne środki:", tr: "Gazetecilik metninin planı üç bölümlüdür ve her bölümde kendi araçları işler:", id: "Rencana teks jurnalistik terdiri atas tiga bagian, dan setiap bagian memakai sarananya sendiri:", vi: "Bố cục của văn bản chính luận gồm ba phần, và mỗi phần dùng những phương tiện riêng:" }
      - type: usage
        columns:
          - { key: part, label: { uk: Частина, en: "Part", es: "Parte", pt: "Parte", fr: "Partie", de: "Teil", it: "Parte", pl: "Część", tr: "Bölüm", id: "Bagian", vi: "Phần" } }
          - { key: task, label: { uk: Завдання, en: "Task", es: "Función", pt: "Função", fr: "Fonction", de: "Aufgabe", it: "Funzione", pl: "Zadanie", tr: "Görev", id: "Tugas", vi: "Nhiệm vụ" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, part: { uk: вступ, en: "introduction", es: "introducción", pt: "introdução", fr: "introduction", de: "Einleitung", it: "introduzione", pl: "wstęp", tr: "giriş", id: "pendahuluan", vi: "mở đầu" }, task: { uk: "питання чи звертання привертає увагу", en: "a question or an address catches attention", es: "una pregunta o un vocativo capta la atención", pt: "uma pergunta ou um vocativo prende a atenção", fr: "une question ou une interpellation attire l’attention", de: "eine Frage oder Anrede weckt die Aufmerksamkeit", it: "una domanda o un vocativo attira l’attenzione", pl: "pytanie lub zwrot do adresata przyciąga uwagę", tr: "bir soru ya da hitap dikkati çeker", id: "pertanyaan atau sapaan menarik perhatian", vi: "một câu hỏi hoặc lời hô gọi thu hút sự chú ý" }, ex: { ex: "Чи гото́ве мі́сто до зими́?", tr: { en: "Is the city ready for winter?", es: "¿Está la ciudad preparada para el invierno?", pt: "A cidade está pronta para o inverno?", fr: "La ville est-elle prête pour l’hiver ?", de: "Ist die Stadt auf den Winter vorbereitet?", it: "La città è pronta per l’inverno?", pl: "Czy miasto jest gotowe na zimę?", tr: "Şehir kışa hazır mı?", id: "Apakah kota ini siap menghadapi musim dingin?", vi: "Thành phố đã sẵn sàng cho mùa đông chưa?" } } }
          - { level: C1, part: { uk: "основна частина", en: "main part", es: "parte principal", pt: "parte principal", fr: "développement", de: "Hauptteil", it: "parte centrale", pl: "rozwinięcie", tr: "gelişme", id: "isi", vi: "nội dung chính" }, task: { uk: "факти; повтор підкреслює головне", en: "facts; repetition stresses the main point", es: "hechos; la repetición subraya lo principal", pt: "fatos; a repetição destaca o principal", fr: "des faits ; la répétition souligne l’essentiel", de: "Fakten; die Wiederholung hebt das Wichtigste hervor", it: "fatti; la ripetizione sottolinea l’essenziale", pl: "fakty; powtórzenie podkreśla rzecz główną", tr: "olgular; yineleme asıl noktayı vurgular", id: "fakta; pengulangan menegaskan hal utama", vi: "sự kiện; lặp lại nhấn mạnh điều chính" }, ex: { ex: "У мі́сті не вистача́є лопа́т. У мі́сті не вистача́є лю́дей.", tr: { en: "The city is short of shovels. The city is short of people.", es: "En la ciudad faltan palas. En la ciudad faltan personas.", pt: "Na cidade faltam pás. Na cidade faltam pessoas.", fr: "Dans la ville, il manque des pelles. Dans la ville, il manque du monde.", de: "In der Stadt fehlen Schaufeln. In der Stadt fehlen Menschen.", it: "In città mancano le pale. In città mancano le persone.", pl: "W mieście brakuje łopat. W mieście brakuje ludzi.", tr: "Şehirde kürek yetmiyor. Şehirde insan yetmiyor.", id: "Di kota ini sekop kurang. Di kota ini orang kurang.", vi: "Thành phố thiếu xẻng. Thành phố thiếu người." } } }
          - { level: C1, part: { uk: висновок, en: "conclusion", es: "conclusión", pt: "conclusão", fr: "conclusion", de: "Schluss", it: "conclusione", pl: "zakończenie", tr: "sonuç", id: "kesimpulan", vi: "kết luận" }, task: { uk: "заклик або питання без відповіді", en: "a call to action or an unanswered question", es: "un llamamiento o una pregunta sin respuesta", pt: "um apelo ou uma pergunta sem resposta", fr: "un appel ou une question sans réponse", de: "ein Aufruf oder eine Frage ohne Antwort", it: "un appello o una domanda senza risposta", pl: "apel lub pytanie bez odpowiedzi", tr: "bir çağrı ya da yanıtsız bir soru", id: "seruan atau pertanyaan tanpa jawaban", vi: "lời kêu gọi hoặc câu hỏi không có đáp án" }, ex: { ex: "Чи не час готува́тися вже за́раз?", tr: { en: "Isn't it time to start preparing right now?", es: "¿No es hora de empezar a prepararse ya?", pt: "Não é hora de começar a se preparar agora mesmo?", fr: "N’est-il pas temps de se préparer dès maintenant ?", de: "Ist es nicht Zeit, sich schon jetzt vorzubereiten?", it: "Non è ora di prepararsi già adesso?", pl: "Czy to nie czas przygotowywać się już teraz?", tr: "Hazırlanmanın tam zamanı değil mi?", id: "Bukankah sudah waktunya bersiap sekarang juga?", vi: "Chẳng phải đã đến lúc chuẩn bị ngay từ bây giờ sao?" } } }
      - type: list
        items:
          - type: note
            level: C1
            text: { uk: ["Питання, повтор і звертання в тексті: ", { link: Синтаксичні засоби виразності, to: uk.stylistics.syntactic-devices }, "."], en: ["Questions, repetition and address in a text: ", { link: "Syntactic Devices", to: uk.stylistics.syntactic-devices }, "."], es: ["Preguntas, repetición y vocativo en un texto: ", { link: "Recursos sintácticos expresivos", to: uk.stylistics.syntactic-devices }, "."], pt: ["Perguntas, repetição e vocativo no texto: ", { link: "Recursos sintáticos expressivos", to: uk.stylistics.syntactic-devices }, "."], fr: ["Questions, répétition et apostrophe dans un texte : ", { link: "Procédés syntaxiques expressifs", to: uk.stylistics.syntactic-devices }, "."], de: ["Frage, Wiederholung und Anrede im Text: ", { link: "Syntaktische Stilmittel", to: uk.stylistics.syntactic-devices }, "."], it: ["Domande, ripetizione e vocativo nel testo: ", { link: "Figure sintattiche", to: uk.stylistics.syntactic-devices }, "."], pl: ["Pytania, powtórzenia i zwroty do adresata w tekście: ", { link: "Środki składniowe", to: uk.stylistics.syntactic-devices }, "."], tr: ["Metinde soru, yineleme ve hitap: ", { link: "Söz dizimi anlatım araçları", to: uk.stylistics.syntactic-devices }, "."], id: ["Pertanyaan, pengulangan, dan sapaan dalam teks: ", { link: "Sarana sintaksis ekspresif", to: uk.stylistics.syntactic-devices }, "."], vi: ["Câu hỏi, sự lặp lại và lời hô gọi trong văn bản: ", { link: "Biện pháp tu từ cú pháp", to: uk.stylistics.syntactic-devices }, "."] }

