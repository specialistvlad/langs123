title: { uk: Стилі мови, en: Styles of Language, es: "Los estilos de la lengua", pt: "Os estilos da língua", fr: "Les styles de la langue", de: "Stile der Sprache", it: "Gli stili della lingua", pl: "Style języka", tr: "Dilin üslupları", id: "Ragam bahasa", vi: "Các phong cách ngôn ngữ" }
summary:
  lead:
    uk: "Українська мова має сім стилів: розмовний, офіційно-діловий, науковий, публіцистичний, художній, конфесійний і епістолярний, кожен зі своїми формами."
    en: "Ukrainian has seven styles: conversational, official, scientific, journalistic, literary, religious and epistolary, each with its own forms."
    es: "El ucraniano tiene siete estilos: coloquial, administrativo, científico, periodístico, literario, religioso y epistolar, cada uno con sus formas."
    pt: "O ucraniano tem sete estilos: coloquial, administrativo, científico, jornalístico, literário, religioso e epistolar, cada um com suas formas."
    fr: "L’ukrainien a sept styles : conversationnel, administratif, scientifique, journalistique, littéraire, religieux et épistolaire, chacun avec ses formes."
    de: "Das Ukrainische hat sieben Stile mit eigenen Formen: Alltags-, Amts- und Wissenschaftsstil, publizistischer, literarischer und religiöser Stil sowie Briefstil."
    it: "L’ucraino ha sette stili: colloquiale, amministrativo, scientifico, giornalistico, letterario, religioso ed epistolare, ciascuno con le sue forme."
    pl: "Język ukraiński ma siedem stylów: potoczny, urzędowy, naukowy, publicystyczny, artystyczny, religijny i epistolarny, każdy z własnymi formami."
    tr: "Ukraynacada yedi üslup vardır: konuşma, resmî, bilimsel, gazetecilik, edebî, dinî ve mektup üslubu; her birinin kendi biçimleri vardır."
    id: "Bahasa Ukraina punya tujuh ragam: percakapan, resmi, ilmiah, jurnalistik, sastra, keagamaan, dan surat-menyurat, masing-masing dengan bentuknya."
    vi: "Tiếng Ukraina có bảy phong cách với hình thức riêng: khẩu ngữ, hành chính, khoa học, chính luận, nghệ thuật, tôn giáo, thư tín."
  rule:
    uk: "Те саме прохання в розмові й в офіційному тексті має різні форми:"
    en: "The same request takes different forms in conversation and in an official text:"
    es: "La misma petición tiene formas distintas en una conversación y en un texto oficial:"
    pt: "O mesmo pedido tem formas diferentes na conversa e em um texto oficial:"
    fr: "La même demande prend des formes différentes à l’oral et dans un texte officiel :"
    de: "Dieselbe Bitte hat im Gespräch und im amtlichen Text verschiedene Formen:"
    it: "La stessa richiesta ha forme diverse nella conversazione e in un testo ufficiale:"
    pl: "Ta sama prośba ma w rozmowie i w tekście urzędowym różne formy:"
    tr: "Aynı rica, konuşmada ve resmî bir metinde farklı biçimlerde söylenir:"
    id: "Permintaan yang sama memakai bentuk berbeda dalam percakapan dan dalam teks resmi:"
    vi: "Một lời đề nghị đổi hình thức giữa hội thoại và văn bản hành chính:"
  ex: { contrast: ["Мо́жна, я за́втра не прийду́?", "Прошу́ нада́ти мені́ вихідни́й день."] }

