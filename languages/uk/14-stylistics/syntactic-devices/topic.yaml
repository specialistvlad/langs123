summary:
  lead:
    uk: "Звертання, еліпсис, повтор, порівняння, уточнення й риторичне питання підсилюють думку; кожен засіб має свою побудову й розділові знаки."
    en: "Address, ellipsis, repetition, comparison, clarification and the rhetorical question give a thought force; each has its own construction and punctuation."
    es: "Vocativo, elipsis, repetición, comparación, aclaración y pregunta retórica dan fuerza a la idea; cada recurso tiene su construcción y su puntuación."
    pt: "Vocativo, elipse, repetição, comparação, esclarecimento e pergunta retórica dão força à ideia; cada recurso tem sua construção e sua pontuação."
    fr: "Apostrophe, ellipse, répétition, comparaison, précision et question rhétorique renforcent l’idée ; chaque procédé a sa construction et sa ponctuation."
    de: "Anrede, Ellipse, Wiederholung, Vergleich, Präzisierung und rhetorische Frage verstärken den Gedanken; jedes Mittel hat eigenen Bau und eigene Satzzeichen."
    it: "Vocativo, ellissi, ripetizione, paragone, precisazione e domanda retorica rafforzano il pensiero; ogni figura ha la sua costruzione e punteggiatura."
    pl: "Zwrot do adresata, elipsa, powtórzenie, porównanie, dopowiedzenie i pytanie retoryczne wzmacniają myśl; każdy środek ma swoją budowę i interpunkcję."
    tr: "Hitap, eksilti, tekrar, karşılaştırma, açıklama ve retorik soru düşünceyi güçlendirir; her aracın kendi yapısı ve noktalaması vardır."
    id: "Sapaan, elipsis, pengulangan, perbandingan, penjelasan, dan pertanyaan retoris memperkuat gagasan; tiap sarana punya susunan dan tanda baca sendiri."
    vi: "Lời hô gọi, tỉnh lược, lặp lại, so sánh, chú thích và câu hỏi tu từ làm câu văn mạnh hơn."
  rule:
    uk: ["Вищий ступінь порівнюють трьома способами: ", { term: ніж }, " + називний, ", { term: за }, " + знахідний, ", { term: від }, " + родовий:"]
    en: ["The comparative takes three constructions: ", { term: ніж }, " + nominative, ", { term: за }, " + accusative, ", { term: від }, " + genitive:"]
    es: ["El comparativo admite tres construcciones: ", { term: ніж }, " + nominativo, ", { term: за }, " + acusativo, ", { term: від }, " + genitivo:"]
    pt: ["O comparativo admite três construções: ", { term: ніж }, " + nominativo, ", { term: за }, " + acusativo, ", { term: від }, " + genitivo:"]
    fr: ["Le comparatif admet trois constructions : ", { term: ніж }, " + nominatif, ", { term: за }, " + accusatif, ", { term: від }, " + génitif :"]
    de: ["Der Komparativ hat drei Konstruktionen: ", { term: ніж }, " + Nominativ, ", { term: за }, " + Akkusativ, ", { term: від }, " + Genitiv:"]
    it: ["Il comparativo ha tre costruzioni: ", { term: ніж }, " + nominativo, ", { term: за }, " + accusativo, ", { term: від }, " + genitivo:"]
    pl: ["Po stopniu wyższym stosuje się trzy konstrukcje: ", { term: ніж }, " + mianownik, ", { term: за }, " + biernik, ", { term: від }, " + dopełniacz:"]
    tr: ["Karşılaştırma derecesi üç yapıyla kullanılır: ", { term: ніж }, " + yalın hâl, ", { term: за }, " + belirtme hâli, ", { term: від }, " + tamlayan hâli:"]
    id: ["Komparatif memiliki tiga konstruksi: ", { term: ніж }, " + nominatif, ", { term: за }, " + akusatif, ", { term: від }, " + genitif:"]
    vi: ["So sánh hơn đi với: ", { term: ніж }, " + danh cách, ", { term: за }, " + đối cách, ", { term: від }, " + sinh cách:"]
  ex: { examples: [["Він ви́щий, ", { target: "ніж я" }, "."], ["Він ви́щий ", { target: "за мене́" }, "."], ["Він ви́щий ", { target: "від мене́" }, "."]] }

