          rule: { uk: "подвоєне питальне слово перепитує", en: "a doubled question word asks again", es: "una palabra interrogativa duplicada pide repetir", pt: "a palavra interrogativa duplicada pergunta de novo", fr: "le mot interrogatif redoublé fait redire", de: "das verdoppelte Fragewort fragt nach", it: "la parola interrogativa raddoppiata chiede di ripetere", pl: "podwojony zaimek pytajny dopytuje", tr: "ikiye katlanan soru sözcüğü yeniden sorar", id: "kata tanya yang digandakan menanyakan ulang", vi: "từ để hỏi lặp đôi dùng để hỏi lại" }
          ex: { exchange: ["Окса́на ви́грала олімпіа́ду!", { target: "Хто-хто?" }] }
          tr: { en: { exchange: ["Oksana won the olympiad!", "Who did you say?"] }, es: { exchange: ["¡Oksana ganó la olimpiada!", "¿Quién has dicho?"] }, pt: { exchange: ["A Oksana ganhou a olimpíada!", "Quem você disse?"] }, fr: { exchange: ["Oksana a gagné l’olympiade !", "Qui ça ?"] }, de: { exchange: ["Oksana hat die Olympiade gewonnen!", "Wer bitte?"] }, it: { exchange: ["Oksana ha vinto l’olimpiade!", "Chi hai detto?"] }, pl: { exchange: ["Oksana wygrała olimpiadę!", "Kto, kto?"] }, tr: { exchange: ["Oksana olimpiyatı kazandı!", "Kim dedin?"] }, id: { exchange: ["Oksana memenangkan olimpiade!", "Siapa tadi?"] }, vi: { exchange: ["Oksana đã thắng cuộc thi Olympic!", "Ai cơ?"] } }
        - level: B2
          point: { uk: Вищий ступінь, en: "Comparative", es: "Comparativo", pt: "Comparativo", fr: "Comparatif", de: "Komparativ", it: "Comparativo", pl: "Stopień wyższy", tr: "Karşılaştırma derecesi", id: "Komparatif", vi: "So sánh hơn" }
          rule: { uk: [{ term: ніж }, ", ", { term: за }, " або ", { term: від }], en: [{ term: ніж }, ", ", { term: за }, " or ", { term: від }], es: [{ term: ніж }, ", ", { term: за }, " o ", { term: від }], pt: [{ term: ніж }, ", ", { term: за }, " ou ", { term: від }], fr: [{ term: ніж }, ", ", { term: за }, " ou ", { term: від }], de: [{ term: ніж }, ", ", { term: за }, " oder ", { term: від }], it: [{ term: ніж }, ", ", { term: за }, " o ", { term: від }], pl: [{ term: ніж }, ", ", { term: за }, " lub ", { term: від }], tr: [{ term: ніж }, ", ", { term: за }, " veya ", { term: від }], id: [{ term: ніж }, ", ", { term: за }, " atau ", { term: від }], vi: [{ term: ніж }, ", ", { term: за }, " hoặc ", { term: від }] }
          ex: { examples: [["Окса́на моло́дша", { target: ", ніж я" }, "."], ["Окса́на моло́дша ", { target: "за мене́" }, "."], ["Окса́на моло́дша ", { target: "від мене́" }, "."]] }
          tr: { en: { examples: ["Oksana is younger than I am.", "Oksana is younger than me.", "Oksana is younger than me."] }, es: { examples: ["Oksana es más joven que yo.", "Oksana es más joven que yo.", "Oksana es más joven que yo."] }, pt: { examples: ["A Oksana é mais nova do que eu.", "A Oksana é mais nova do que eu.", "A Oksana é mais nova do que eu."] }, fr: { examples: ["Oksana est plus jeune que moi.", "Oksana est plus jeune que moi.", "Oksana est plus jeune que moi."] }, de: { examples: ["Oksana ist jünger als ich.", "Oksana ist jünger als ich.", "Oksana ist jünger als ich."] }, it: { examples: ["Oksana è più giovane di me.", "Oksana è più giovane di me.", "Oksana è più giovane di me."] }, pl: { examples: ["Oksana jest młodsza niż ja.", "Oksana jest młodsza ode mnie.", "Oksana jest młodsza ode mnie."] }, tr: { examples: ["Oksana benden daha genç.", "Oksana benden daha genç.", "Oksana benden daha genç."] }, id: { examples: ["Oksana lebih muda daripada saya.", "Oksana lebih muda daripada saya.", "Oksana lebih muda daripada saya."] }, vi: { examples: ["Oksana trẻ hơn tôi.", "Oksana trẻ hơn tôi.", "Oksana trẻ hơn tôi."] } }
        - level: B2
          point: { uk: Образне порівняння, en: "Figurative comparison", es: "Comparación figurada", pt: "Comparação figurada", fr: "Comparaison imagée", de: "Bildhafter Vergleich", it: "Paragone figurato", pl: "Porównanie obrazowe", tr: "Benzetme", id: "Perumpamaan", vi: "So sánh tu từ" }
          rule: { uk: [{ term: як }, " або ", { term: мов }, " і образ"], en: [{ term: як }, " or ", { term: мов }, " and an image"], es: [{ term: як }, " o ", { term: мов }, " y una imagen"], pt: [{ term: як }, " ou ", { term: мов }, " e uma imagem"], fr: [{ term: як }, " ou ", { term: мов }, " et une image"], de: [{ term: як }, " oder ", { term: мов }, " und ein Bild"], it: [{ term: як }, " o ", { term: мов }, " e un’immagine"], pl: [{ term: як }, " lub ", { term: мов }, " i obraz"], tr: [{ term: як }, " ya da ", { term: мов }, " ve bir imge"], id: [{ term: як }, " atau ", { term: мов }, " dan sebuah citra"], vi: [{ term: як }, " hoặc ", { term: мов }, " và một hình ảnh"] }
          ex: ["Вода́ чи́ста", { target: ", як сльоза́" }, "."]
          tr: { en: "The water is clear as a tear.", es: "El agua es limpia como una lágrima.", pt: "A água é limpa como uma lágrima.", fr: "L’eau est pure comme une larme.", de: "Das Wasser ist klar wie eine Träne.", it: "L’acqua è limpida come una lacrima.", pl: "Woda jest czysta jak łza.", tr: "Su, gözyaşı gibi duru.", id: "Airnya jernih seperti air mata.", vi: "Nước trong như giọt nước mắt." }
        - level: B2
          point: { uk: Уточнення, en: "Clarifying element", es: "Elemento aclaratorio", pt: "Esclarecimento", fr: "Précision", de: "Präzisierung", it: "Precisazione", pl: "Dopowiedzenie", tr: "Açıklayıcı öğe", id: "Unsur penjelas", vi: "Thành phần chú thích" }
          rule: { uk: "прикладка в тому самому відмінку", en: "an apposition stands in the same case", es: "la aposición va en el mismo caso", pt: "o aposto fica no mesmo caso", fr: "l’apposition se met au même cas", de: "die Apposition steht im selben Kasus", it: "l’apposizione sta nello stesso caso", pl: "apozycja stoi w tym samym przypadku", tr: "apozisyon aynı hâlde durur", id: "aposisi berada dalam kasus yang sama", vi: "đồng vị ngữ đứng cùng cách" }
          ex: ["Мій брат", { target: ", лі́кар," }, " живе́ в Оде́сі."]
          tr: { en: "My brother, a doctor, lives in Odesa.", es: "Mi hermano, médico, vive en Odesa.", pt: "Meu irmão, médico, mora em Odesa.", fr: "Mon frère, médecin, habite à Odesa.", de: "Mein Bruder, Arzt, wohnt in Odesa.", it: "Mio fratello, medico, vive a Odesa.", pl: "Mój brat, lekarz, mieszka w Odessie.", tr: "Erkek kardeşim, doktor, Odesa’da yaşıyor.", id: "Saudara laki-laki saya, seorang dokter, tinggal di Odesa.", vi: "Anh trai tôi, một bác sĩ, sống ở Odesa." }
        - level: C1
          point: { uk: Риторичне питання, en: "Rhetorical question", es: "Pregunta retórica", pt: "Pergunta retórica", fr: "Question rhétorique", de: "Rhetorische Frage", it: "Domanda retorica", pl: "Pytanie retoryczne", tr: "Retorik soru", id: "Pertanyaan retoris", vi: "Câu hỏi tu từ" }
          rule: { uk: "відповідь очевидна, її не чекають", en: "the answer is obvious, and nobody waits for it", es: "la respuesta es evidente y no se espera", pt: "a resposta é óbvia e ninguém a espera", fr: "la réponse est évidente, on ne l’attend pas", de: "die Antwort ist offensichtlich, man erwartet sie nicht", it: "la risposta è ovvia e non si aspetta", pl: "odpowiedź jest oczywista i nikt jej nie oczekuje", tr: "cevap açıktır, beklenmez", id: "jawabannya jelas dan tidak ditunggu", vi: "câu trả lời đã rõ, không ai chờ đợi" }
          ex: [{ target: "Хто ж не лю́бить" }, " рі́дне мі́сто?"]
          tr: { en: "Who doesn't love their hometown?", es: "¿Quién no quiere a su ciudad natal?", pt: "Quem não ama a sua cidade natal?", fr: "Qui n’aime pas sa ville natale ?", de: "Wer liebt seine Heimatstadt nicht?", it: "Chi non ama la propria città natale?", pl: "Któż nie kocha rodzinnego miasta?", tr: "Memleketini kim sevmez ki?", id: "Siapa yang tidak mencintai kota kelahirannya?", vi: "Ai mà chẳng yêu thành phố quê hương mình?" }
        - level: C1
          point: { uk: Текст, en: "Text", es: "Texto", pt: "Texto", fr: "Texte", de: "Text", it: "Testo", pl: "Tekst", tr: "Metin", id: "Teks", vi: "Văn bản" }
          rule: { uk: "питання відкриває, повтор підкреслює", en: "a question opens, repetition stresses", es: "la pregunta abre, la repetición subraya", pt: "a pergunta abre, a repetição destaca", fr: "la question ouvre, la répétition souligne", de: "die Frage eröffnet, die Wiederholung betont", it: "la domanda apre, la ripetizione sottolinea", pl: "pytanie otwiera, powtórzenie podkreśla", tr: "soru açar, tekrar vurgular", id: "pertanyaan membuka, pengulangan menekankan", vi: "câu hỏi mở đầu, lặp lại nhấn mạnh" }
          ex: [{ target: "Що ми зна́ємо" }, " про рі́дне мі́сто?"]
          tr: { en: "What do we know about our hometown?", es: "¿Qué sabemos de nuestra ciudad natal?", pt: "O que sabemos sobre a nossa cidade natal?", fr: "Que savons-nous de notre ville natale ?", de: "Was wissen wir über unsere Heimatstadt?", it: "Che cosa sappiamo della nostra città natale?", pl: "Co wiemy o naszym rodzinnym mieście?", tr: "Memleketimiz hakkında ne biliyoruz?", id: "Apa yang kita ketahui tentang kota kelahiran kita?", vi: "Chúng ta biết gì về thành phố quê hương mình?" }
        - level: C2
          point: { uk: Звертання, en: "Address", es: "Vocativo", pt: "Vocativo", fr: "Apostrophe", de: "Anrede", it: "Vocativo", pl: "Zwrot do adresata", tr: "Hitap", id: "Sapaan", vi: "Lời hô gọi" }
          rule: { uk: "прикметник у називному, іменник у кличному", en: "the adjective is in the nominative, the noun in the vocative", es: "el adjetivo va en nominativo y el sustantivo en vocativo", pt: "o adjetivo fica no nominativo e o substantivo no vocativo", fr: "l’adjectif est au nominatif, le nom au vocatif", de: "das Adjektiv steht im Nominativ, das Nomen im Vokativ", it: "l’aggettivo è al nominativo, il nome al vocativo", pl: "przymiotnik stoi w mianowniku, rzeczownik w wołaczu", tr: "sıfat yalın hâlde, isim seslenme hâlinde", id: "kata sifat berada dalam nominatif, nomina dalam vokatif", vi: "tính từ ở danh cách, danh từ ở hô cách" }
          ex: [{ target: "Шано́вний па́не го́лово" }, "!"]
          tr: { en: "Dear Mr Chairman!", es: "¡Estimado señor presidente!", pt: "Prezado senhor presidente!", fr: "Monsieur le président !", de: "Sehr geehrter Herr Vorsitzender!", it: "Egregio signor presidente!", pl: "Szanowny Panie Przewodniczący!", tr: "Sayın Başkan!", id: "Yang terhormat Bapak Ketua!", vi: "Kính thưa ông Chủ tịch!" }
        - level: C2
          point: { uk: Питання-підтвердження, en: "Confirmation question", es: "Pregunta de confirmación", pt: "Pergunta de confirmação", fr: "Question de confirmation", de: "Bestätigungsfrage", it: "Domanda di conferma", pl: "Pytanie potwierdzające", tr: "Onay sorusu", id: "Pertanyaan konfirmasi", vi: "Câu hỏi xác nhận" }
          rule: { uk: [{ term: "чи не так" }, " після твердження"], en: [{ term: "чи не так" }, " after a statement"], es: [{ term: "чи не так" }, " después de una afirmación"], pt: [{ term: "чи не так" }, " depois de uma afirmação"], fr: [{ term: "чи не так" }, " après une affirmation"], de: [{ term: "чи не так" }, " nach einer Aussage"], it: [{ term: "чи не так" }, " dopo un’affermazione"], pl: [{ term: "чи не так" }, " po twierdzeniu"], tr: [{ term: "чи не так" }, " bir ifadenin ardından"], id: [{ term: "чи не так" }, " setelah pernyataan"], vi: [{ term: "чи не так" }, " sau một câu khẳng định"] }
          ex: ["Ми всі хо́чемо ми́ру, ", { target: "чи не так" }, "?.."]
          tr: { en: "We all want peace, don't we?..", es: "Todos queremos la paz, ¿verdad?..", pt: "Todos queremos a paz, não é verdade?..", fr: "Nous voulons tous la paix, n’est-ce pas ?..", de: "Wir alle wollen Frieden, nicht wahr?..", it: "Tutti vogliamo la pace, non è vero?..", pl: "Wszyscy pragniemy pokoju, prawda?..", tr: "Hepimiz barış istiyoruz, değil mi?..", id: "Kita semua menginginkan perdamaian, bukan?..", vi: "Tất cả chúng ta đều muốn hòa bình, đúng không?.." }
        - level: B2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: [{ term: від }, " вимагає родового відмінка"], en: [{ term: від }, " takes the genitive"], es: [{ term: від }, " exige el genitivo"], pt: [{ term: від }, " exige o genitivo"], fr: [{ term: від }, " veut le génitif"], de: [{ term: від }, " verlangt den Genitiv"], it: [{ term: від }, " richiede il genitivo"], pl: [{ term: від }, " wymaga dopełniacza"], tr: [{ term: від }, " tamlayan hâli ister"], id: [{ term: від }, " menuntut genitif"], vi: [{ term: від }, " đòi hỏi sinh cách"] }
          ex: ["Окса́на моло́дша ", { target: "від мене́" }, "."]
          tr: { en: "Oksana is younger than me.", es: "Oksana es más joven que yo.", pt: "A Oksana é mais nova do que eu.", fr: "Oksana est plus jeune que moi.", de: "Oksana ist jünger als ich.", it: "Oksana è più giovane di me.", pl: "Oksana jest młodsza ode mnie.", tr: "Oksana benden daha genç.", id: "Oksana lebih muda daripada saya.", vi: "Oksana trẻ hơn tôi." }
        - level: C2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: "на місці пропущеного дієслова стоїть тире", en: "a dash stands in place of the omitted verb", es: "en lugar del verbo omitido va un guion largo", pt: "no lugar do verbo omitido vai um travessão", fr: "à la place du verbe omis, on met un tiret", de: "an der Stelle des ausgelassenen Verbs steht ein Gedankenstrich", it: "al posto del verbo omesso va un trattino", pl: "w miejscu pominiętego czasownika stawia się myślnik", tr: "düşen fiilin yerine uzun çizgi konur", id: "tanda pisah ditulis sebagai ganti kata kerja yang dihilangkan", vi: "dấu gạch ngang thế chỗ động từ bị lược" }
          ex: ["Я люблю́ я́блука, а Макси́м ", { target: "— гру́ші" }, "."]
          tr: { en: "I like apples, and Maksym, pears.", es: "A mí me gustan las manzanas y a Maksym, las peras.", pt: "Eu gosto de maçãs, e o Maksym, de peras.", fr: "J’aime les pommes, et Maksym, les poires.", de: "Ich mag Äpfel, und Maksym Birnen.", it: "A me piacciono le mele, a Maksym le pere.", pl: "Ja lubię jabłka, a Maksym — gruszki.", tr: "Ben elmayı severim, Maksym ise armudu.", id: "Saya suka apel, sedangkan Maksym pir.", vi: "Tôi thích táo, còn Maksym thì thích lê." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "Звертання, прикладку й порівняльний зворот у середині речення виділяють комами з обох боків:", en: "An address, an apposition and a comparative phrase in the middle of a sentence are set off by commas on both sides:", es: "El vocativo, la aposición y la construcción comparativa en medio de la oración se aíslan con comas a ambos lados:", pt: "O vocativo, o aposto e a expressão comparativa no meio da frase são isolados por vírgulas dos dois lados:", fr: "L’apostrophe, l’apposition et la tournure comparative au milieu de la phrase se séparent par une virgule de chaque côté :", de: "Anrede, Apposition und Vergleichswendung stehen in der Satzmitte zwischen zwei Kommas:", it: "Il vocativo, l’apposizione e l’espressione comparativa in mezzo alla frase si isolano con una virgola da entrambi i lati:", pl: "Zwrot do adresata, apozycję i wyrażenie porównawcze w środku zdania wydziela się przecinkami z obu stron:", tr: "Cümlenin ortasındaki hitap, apozisyon ve karşılaştırma öbeği iki yanından virgülle ayrılır:", id: "Sapaan, aposisi, dan frasa perbandingan di tengah kalimat diapit koma di kedua sisi:", vi: "Lời hô gọi, đồng vị ngữ và cụm so sánh ở giữa câu được tách bằng dấu phẩy ở cả hai phía:" }
            ex: { examples: [["Дя́кую", { target: ", Окса́но," }, " за допомо́гу."], ["Андрі́й", { target: ", мій сусі́д," }, " ча́сто гуля́є тут."], ["Дити́на", { target: ", мов а́нгел," }, " спить."]] }
            tr: { en: { examples: ["Thank you, Oksana, for your help.", "Andrii, my neighbour, often walks here.", "The child, like an angel, is asleep."] }, es: { examples: ["Gracias, Oksana, por tu ayuda.", "Andrii, mi vecino, pasea a menudo por aquí.", "El niño, como un ángel, duerme."] }, pt: { examples: ["Obrigado, Oksana, pela ajuda.", "Andrii, meu vizinho, costuma passear por aqui.", "A criança, como um anjo, dorme."] }, fr: { examples: ["Merci, Oksana, pour ton aide.", "Andrii, mon voisin, se promène souvent ici.", "L’enfant, comme un ange, dort."] }, de: { examples: ["Danke, Oksana, für deine Hilfe.", "Andrii, mein Nachbar, geht hier oft spazieren.", "Das Kind, wie ein Engel, schläft."] }, it: { examples: ["Grazie, Oksana, per l’aiuto.", "Andrii, il mio vicino, passeggia spesso qui.", "Il bambino, come un angelo, dorme."] }, pl: { examples: ["Dziękuję, Oksano, za pomoc.", "Andrii, mój sąsiad, często tu spaceruje.", "Dziecko, jak anioł, śpi."] }, tr: { examples: ["Teşekkürler, Oksana, yardımın için.", "Andrii, komşum, sık sık burada yürür.", "Çocuk, bir melek gibi, uyuyor."] }, id: { examples: ["Terima kasih, Oksana, atas bantuanmu.", "Andrii, tetangga saya, sering berjalan-jalan di sini.", "Anak itu, bagaikan malaikat, tidur."] }, vi: { examples: ["Cảm ơn, Oksana, vì sự giúp đỡ.", "Andrii, hàng xóm của tôi, hay đi dạo ở đây.", "Đứa trẻ, như một thiên thần, đang ngủ."] } }

  - title: { uk: Звертання, en: "Address", es: "El vocativo", pt: "O vocativo", fr: "L’apostrophe (le mot d’adresse)", de: "Die Anrede", it: "Il vocativo", pl: "Zwrot do adresata", tr: "Hitap", id: "Sapaan", vi: "Lời hô gọi" }
    role: own
