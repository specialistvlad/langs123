          rule: { uk: "будь-де в реченні, між комами", en: "anywhere in the sentence, between commas", es: "en cualquier lugar de la oración, entre comas", pt: "em qualquer lugar da frase, entre vírgulas", fr: "n’importe où dans la phrase, entre virgules", de: "an beliebiger Stelle im Satz, zwischen Kommas", it: "in qualsiasi punto della frase, tra virgole", pl: "w dowolnym miejscu zdania, między przecinkami", tr: "cümlenin herhangi bir yerinde, virgüllerin arasında", id: "di mana saja dalam kalimat, di antara koma", vi: "ở bất kỳ chỗ nào trong câu, giữa hai dấu phẩy" }
          ex: ["Прочита́йте, ", { target: "Ві́кторе" }, ", цю кни́жку."]
          tr: { en: "Please, Viktor, read this book.", es: "Lea, Viktor, este libro.", pt: "Leia, Viktor, este livro.", fr: "Lisez, Viktor, ce livre.", de: "Lesen Sie, Viktor, dieses Buch.", it: "Legga, Viktor, questo libro.", pl: "Proszę, Viktorze, przeczytać tę książkę.", tr: "Bu kitabı, Viktor, okuyun.", id: "Tolong, Viktor, baca buku ini.", vi: "Hãy đọc, Viktor, cuốn sách này." }
        - level: B2
