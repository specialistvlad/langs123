          rule: { uk: "у відповіді лише нове", en: "an answer keeps only what is new", es: "la respuesta conserva solo lo nuevo", pt: "a resposta mantém só o que é novo", fr: "la réponse ne garde que ce qui est nouveau", de: "die Antwort enthält nur das Neue", it: "la risposta tiene solo ciò che è nuovo", pl: "w odpowiedzi zostaje tylko to, co nowe", tr: "cevapta yalnızca yeni olan kalır", id: "jawaban hanya memuat hal yang baru", vi: "câu trả lời chỉ giữ phần mới" }
          ex: { exchange: ["Щасли́вої доро́ги!", { target: "Дя́кую, і вам." }] }
          tr: { en: { exchange: ["Have a good trip!", "Thank you, you too."] }, es: { exchange: ["¡Buen viaje!", "Gracias, igualmente."] }, pt: { exchange: ["Boa viagem!", "Obrigado, igualmente."] }, fr: { exchange: ["Bon voyage !", "Merci, à vous aussi."] }, de: { exchange: ["Gute Reise!", "Danke, gleichfalls."] }, it: { exchange: ["Buon viaggio!", "Grazie, altrettanto."] }, pl: { exchange: ["Szczęśliwej drogi!", "Dziękuję, wzajemnie."] }, tr: { exchange: ["İyi yolculuklar!", "Teşekkürler, size de."] }, id: { exchange: ["Selamat jalan!", "Terima kasih, Anda juga."] }, vi: { exchange: ["Chúc đi đường bình an!", "Cảm ơn, bạn cũng vậy."] } }
        - level: B2
