      - type: usage
        columns:
          - { key: place, label: { uk: Місце, en: "Place", es: "Lugar", pt: "Lugar", fr: "Place", de: "Stelle", it: "Posizione", pl: "Miejsce", tr: "Yer", id: "Posisi", vi: "Vị trí" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, place: { uk: "на початку речення", en: "at the start of the sentence", es: "al principio de la oración", pt: "no início da frase", fr: "au début de la phrase", de: "am Satzanfang", it: "all’inizio della frase", pl: "na początku zdania", tr: "cümlenin başında", id: "di awal kalimat", vi: "ở đầu câu" }, ex: [{ target: "Ві́кторе" }, ", прочита́йте цю кни́жку."], tr: { en: "Viktor, please read this book.", es: "Viktor, lea este libro.", pt: "Viktor, leia este livro.", fr: "Viktor, lisez ce livre.", de: "Viktor, lesen Sie dieses Buch.", it: "Viktor, legga questo libro.", pl: "Viktorze, proszę przeczytać tę książkę.", tr: "Viktor, bu kitabı okuyun.", id: "Viktor, tolong baca buku ini.", vi: "Viktor, hãy đọc cuốn sách này." } }
          - { level: B2, place: { uk: "усередині речення", en: "in the middle of the sentence", es: "en medio de la oración", pt: "no meio da frase", fr: "au milieu de la phrase", de: "in der Satzmitte", it: "in mezzo alla frase", pl: "w środku zdania", tr: "cümlenin ortasında", id: "di tengah kalimat", vi: "ở giữa câu" }, ex: ["Прочита́йте, ", { target: "Ві́кторе" }, ", цю кни́жку."], tr: { en: "Please, Viktor, read this book.", es: "Lea, Viktor, este libro.", pt: "Leia, Viktor, este livro.", fr: "Lisez, Viktor, ce livre.", de: "Lesen Sie, Viktor, dieses Buch.", it: "Legga, Viktor, questo libro.", pl: "Proszę, Viktorze, przeczytać tę książkę.", tr: "Bu kitabı, Viktor, okuyun.", id: "Tolong, Viktor, baca buku ini.", vi: "Hãy đọc, Viktor, cuốn sách này." } }
          - { level: B2, place: { uk: "у кінці речення", en: "at the end of the sentence", es: "al final de la oración", pt: "no fim da frase", fr: "à la fin de la phrase", de: "am Satzende", it: "alla fine della frase", pl: "na końcu zdania", tr: "cümlenin sonunda", id: "di akhir kalimat", vi: "ở cuối câu" }, ex: ["Прочита́йте цю кни́жку, ", { target: "Ві́кторе" }, "."], tr: { en: "Please read this book, Viktor.", es: "Lea este libro, Viktor.", pt: "Leia este livro, Viktor.", fr: "Lisez ce livre, Viktor.", de: "Lesen Sie dieses Buch, Viktor.", it: "Legga questo libro, Viktor.", pl: "Proszę przeczytać tę książkę, Viktorze.", tr: "Bu kitabı okuyun, Viktor.", id: "Tolong baca buku ini, Viktor.", vi: "Hãy đọc cuốn sách này, Viktor." } }
      - type: list
        items:
          - type: note
            level: B2
            text: { uk: ["Форми звертання: ", { link: Кличний відмінок, to: uk.nouns-cases.vocative }, "."], en: ["Forms of address: ", { link: "Vocative Case", to: uk.nouns-cases.vocative }, "."], es: ["Las formas del vocativo: ", { link: "El caso vocativo", to: uk.nouns-cases.vocative }, "."], pt: ["Formas do vocativo: ", { link: "O caso vocativo", to: uk.nouns-cases.vocative }, "."], fr: ["Formes de l’apostrophe : ", { link: "Le cas vocatif", to: uk.nouns-cases.vocative }, "."], de: ["Formen der Anrede: ", { link: "Der Vokativ", to: uk.nouns-cases.vocative }, "."], it: ["Le forme del vocativo: ", { link: "Il caso vocativo", to: uk.nouns-cases.vocative }, "."], pl: ["Formy zwrotu do adresata: ", { link: "Wołacz", to: uk.nouns-cases.vocative }, "."], tr: ["Hitap biçimleri: ", { link: "Seslenme hâli", to: uk.nouns-cases.vocative }, "."], id: ["Bentuk sapaan: ", { link: "Kasus vokatif", to: uk.nouns-cases.vocative }, "."], vi: ["Các dạng hô gọi: ", { link: "Hô cách", to: uk.nouns-cases.vocative }, "."] }
      - type: usage
        columns:
          - { key: whom, label: { uk: Кому, en: "To whom", es: "A quién", pt: "A quem", fr: "À qui", de: "An wen", it: "A chi", pl: "Do kogo", tr: "Kime", id: "Kepada siapa", vi: "Nói với ai" } }
          - { key: ex, label: { uk: Формула, en: "Formula", es: "Fórmula", pt: "Fórmula", fr: "Formule", de: "Formel", it: "Formula", pl: "Formuła", tr: "Kalıp ifade", id: "Ungkapan", vi: "Cách gọi" } }
        rows:
          - { level: C2, whom: { uk: "слухачам у залі", en: "to listeners in a hall", es: "al público de una sala", pt: "aos ouvintes numa sala", fr: "à l’auditoire d’une salle", de: "an die Zuhörer im Saal", it: "agli ascoltatori in sala", pl: "do słuchaczy na sali", tr: "salondaki dinleyicilere", id: "kepada hadirin di ruangan", vi: "với thính giả trong hội trường" }, ex: [{ target: "Па́ні і пано́ве" }, "!"], tr: { en: "Ladies and gentlemen!", es: "¡Señoras y señores!", pt: "Senhoras e senhores!", fr: "Mesdames et Messieurs !", de: "Meine Damen und Herren!", it: "Signore e signori!", pl: "Panie i Panowie!", tr: "Bayanlar ve baylar!", id: "Bapak dan Ibu sekalian!", vi: "Thưa quý bà và quý ông!" } }
          - { level: C2, whom: { uk: "голові зібрання", en: "to the chair of a meeting", es: "al presidente de la reunión", pt: "ao presidente da reunião", fr: "au président de l’assemblée", de: "an den Vorsitzenden der Versammlung", it: "al presidente dell’assemblea", pl: "do przewodniczącego zebrania", tr: "toplantı başkanına", id: "kepada ketua rapat", vi: "với chủ tọa cuộc họp" }, ex: [{ target: "Шано́вний па́не го́лово" }, "!"], tr: { en: "Dear Mr Chairman!", es: "¡Estimado señor presidente!", pt: "Prezado senhor presidente!", fr: "Monsieur le président !", de: "Sehr geehrter Herr Vorsitzender!", it: "Egregio signor presidente!", pl: "Szanowny Panie Przewodniczący!", tr: "Sayın Başkan!", id: "Yang terhormat Bapak Ketua!", vi: "Kính thưa ông Chủ tịch!" } }
          - { level: C2, whom: { uk: "другові", en: "to a friend", es: "a un amigo", pt: "a um amigo", fr: "à un ami", de: "an einen Freund", it: "a un amico", pl: "do przyjaciela", tr: "bir arkadaşa", id: "kepada seorang teman", vi: "với một người bạn" }, ex: [{ target: "Дороги́й дру́же" }, "!"], tr: { en: "Dear friend!", es: "¡Querido amigo!", pt: "Querido amigo!", fr: "Cher ami !", de: "Lieber Freund!", it: "Caro amico!", pl: "Drogi przyjacielu!", tr: "Sevgili dostum!", id: "Sahabatku yang terkasih!", vi: "Bạn thân mến!" } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { uk: "Прикметник при звертанні має форму називного, іменник — кличного:", en: "An adjective in an address stands in the nominative, the noun in the vocative:", es: "El adjetivo del vocativo va en nominativo y el sustantivo, en vocativo:", pt: "O adjetivo do vocativo fica no nominativo e o substantivo, no vocativo:", fr: "L’adjectif d’une apostrophe est au nominatif, le nom au vocatif :", de: "Das Adjektiv einer Anrede steht im Nominativ, das Nomen im Vokativ:", it: "L’aggettivo del vocativo sta al nominativo, il nome al vocativo:", pl: "Przymiotnik w zwrocie do adresata ma formę mianownika, rzeczownik — wołacza:", tr: "Hitaptaki sıfat yalın hâlde, isim seslenme hâlinde durur:", id: "Kata sifat dalam sapaan berbentuk nominatif, nomina berbentuk vokatif:", vi: "Tính từ trong lời hô gọi ở danh cách, danh từ ở hô cách:" }
            ex: [{ target: "Шано́вна па́ні Окса́но" }, "!"]
            tr: { en: "Dear Ms Oksana!", es: "¡Estimada señora Oksana!", pt: "Prezada senhora Oksana!", fr: "Chère madame Oksana !", de: "Sehr geehrte Frau Oksana!", it: "Gentile signora Oksana!", pl: "Szanowna Pani Oksano!", tr: "Sayın Oksana Hanım!", id: "Yang terhormat Ibu Oksana!", vi: "Kính thưa bà Oksana!" }

  - title: { uk: Еліпсис, en: "Ellipsis", es: "La elipsis", pt: "A elipse", fr: "L’ellipse", de: "Die Ellipse", it: "L’ellissi", pl: "Elipsa", tr: "Eksilti", id: "Elipsis", vi: "Tỉnh lược" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Пропуск, en: "Omission", es: "Omisión", pt: "Omissão", fr: "Omission", de: "Auslassung", it: "Omissione", pl: "Pominięcie", tr: "Eksilme", id: "Penghilangan", vi: "Phần lược bỏ" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { uk: "у відповіді немає слів побажання", en: "the answer leaves out the words of the wish", es: "la respuesta omite las palabras del deseo", pt: "a resposta omite as palavras do desejo", fr: "la réponse omet les mots du souhait", de: "die Antwort lässt die Wörter des Wunsches aus", it: "la risposta omette le parole dell’augurio", pl: "w odpowiedzi brakuje słów życzenia", tr: "cevapta dilek sözcükleri yoktur", id: "jawaban tidak memuat kata-kata harapan", vi: "câu trả lời lược các từ chúc" }
            ex: { exchange: ["Щасли́вої доро́ги!", "Дя́кую, і вам."] }
            tr: { en: { exchange: ["Have a good trip!", "Thank you, you too."] }, es: { exchange: ["¡Buen viaje!", "Gracias, igualmente."] }, pt: { exchange: ["Boa viagem!", "Obrigado, igualmente."] }, fr: { exchange: ["Bon voyage !", "Merci, à vous aussi."] }, de: { exchange: ["Gute Reise!", "Danke, gleichfalls."] }, it: { exchange: ["Buon viaggio!", "Grazie, altrettanto."] }, pl: { exchange: ["Szczęśliwej drogi!", "Dziękuję, wzajemnie."] }, tr: { exchange: ["İyi yolculuklar!", "Teşekkürler, size de."] }, id: { exchange: ["Selamat jalan!", "Terima kasih, Anda juga."] }, vi: { exchange: ["Chúc đi đường bình an!", "Cảm ơn, bạn cũng vậy."] } }
          - level: B2
            use: { uk: "у другій частині немає того, що вже сказано", en: "the second part leaves out what is already said", es: "la segunda parte omite lo ya dicho", pt: "a segunda parte omite o que já foi dito", fr: "la seconde partie omet ce qui est déjà dit", de: "der zweite Teil lässt weg, was schon gesagt ist", it: "la seconda parte omette ciò che è già detto", pl: "w drugiej części brakuje tego, co już powiedziano", tr: "ikinci bölümde söylenmiş olan düşer", id: "bagian kedua menghilangkan yang sudah disebut", vi: "vế thứ hai lược phần đã nói" }
            ex: ["І́гор іде́ на ле́кцію, ", { target: "і О́ля тако́ж збира́ється" }, "."]
            tr: { en: "Ihor is going to the lecture, and Olia is also planning to.", es: "Ihor va a la clase, y Olia también piensa ir.", pt: "Ihor vai à aula, e a Olia também pretende ir.", fr: "Ihor va au cours, et Olia compte y aller aussi.", de: "Ihor geht zur Vorlesung, und Olia hat das auch vor.", it: "Ihor va a lezione, e anche Olia ha intenzione di andarci.", pl: "Ihor idzie na wykład, a Olia też się wybiera.", tr: "Ihor derse gidiyor, Olia da gitmeyi planlıyor.", id: "Ihor pergi ke kuliah, dan Olia juga berencana pergi.", vi: "Ihor đi nghe bài giảng, và Olia cũng định đi." }
          - level: C1
