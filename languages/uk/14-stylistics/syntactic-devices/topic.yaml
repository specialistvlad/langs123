# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.stylistics.syntactic-devices
lang: uk
kind: grammar
tags: [stylistics, syntax, address, ellipsis, repetition, comparison, apposition, rhetorical-question]
concepts: [rhetorical-devices]
related: [uk.nouns-cases.vocative, uk.sentence.word-order, uk.adjectives-adverbs.comparison, uk.sentence.questions-negation, uk.sentence.conjunctions]
status: { uk: draft }

title: { uk: Синтаксичні засоби виразності, en: Syntactic Devices }
summary:
  lead:
    uk: "Звертання, еліпсис, повтор, порівняння, уточнення й риторичне питання підсилюють думку; кожен засіб має свою побудову й розділові знаки."
  rule:
    uk: ["Вищий ступінь порівнюють трьома способами: ", { term: ніж }, " + називний, ", { term: за }, " + знахідний, ", { term: від }, " + родовий:"]
  ex: { examples: [["Він ви́щий, ", { target: "ніж я" }, "."], ["Він ви́щий ", { target: "за мене́" }, "."], ["Він ви́щий ", { target: "від мене́" }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт } }
        - { key: rule, label: { uk: Правило } }
        - { key: ex, label: { uk: Приклад } }
      rows:
        - level: B2
          point: { uk: Звертання }
          rule: { uk: "будь-де в реченні, між комами" }
          ex: ["Прочита́йте, ", { target: "Ві́кторе" }, ", цю кни́жку."]
        - level: B2
          point: { uk: Еліпсис }
          rule: { uk: "у відповіді лише нове" }
          ex: { exchange: ["Щасли́вої доро́ги!", { target: "Дя́кую, і вам." }] }
        - level: B2
          point: { uk: Повтор }
          rule: { uk: "подвоєне питальне слово перепитує" }
          ex: { exchange: ["Окса́на ви́грала олімпіа́ду!", { target: "Хто-хто?" }] }
        - level: B2
          point: { uk: Вищий ступінь }
          rule: { uk: [{ term: ніж }, ", ", { term: за }, " або ", { term: від }] }
          ex: { examples: [["Окса́на моло́дша", { target: ", ніж я" }, "."], ["Окса́на моло́дша ", { target: "за мене́" }, "."], ["Окса́на моло́дша ", { target: "від мене́" }, "."]] }
        - level: B2
          point: { uk: Образне порівняння }
          rule: { uk: [{ term: як }, " або ", { term: мов }, " і образ"] }
          ex: ["Вода́ чи́ста", { target: ", як сльоза́" }, "."]
        - level: B2
          point: { uk: Уточнення }
          rule: { uk: "прикладка в тому самому відмінку" }
          ex: ["Мій брат", { target: ", лі́кар," }, " живе́ в Оде́сі."]
        - level: C1
          point: { uk: Риторичне питання }
          rule: { uk: "відповідь очевидна, її не чекають" }
          ex: [{ target: "Хто ж не лю́бить" }, " рі́дне мі́сто?"]
        - level: C1
          point: { uk: Текст }
          rule: { uk: "питання відкриває, повтор підкреслює" }
          ex: [{ target: "Що ми зна́ємо" }, " про рі́дне мі́сто?"]
        - level: C2
          point: { uk: Звертання }
          rule: { uk: "прикметник у називному, іменник у кличному" }
          ex: [{ target: "Шано́вний па́не го́лово" }, "!"]
        - level: C2
          point: { uk: Питання-підтвердження }
          rule: { uk: [{ term: "чи не так" }, " після твердження"] }
          ex: ["Ми всі хо́чемо ми́ру, ", { target: "чи не так" }, "?.."]
        - level: B2
          point: { uk: Пастка }
          rule: { uk: [{ term: від }, " вимагає родового відмінка"] }
          ex: ["Окса́на моло́дша ", { target: "від мене́" }, "."]
        - level: C2
          point: { uk: Пастка }
          rule: { uk: "на місці пропущеного дієслова стоїть тире" }
          ex: ["Я люблю́ я́блука, а Макси́м ", { target: "— гру́ші" }, "."]

sections:
  - title: { uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "Звертання, прикладку й порівняльний зворот у середині речення виділяють комами з обох боків:" }
            ex: { examples: [["Дя́кую", { target: ", Окса́но," }, " за допомо́гу."], ["Андрі́й", { target: ", мій сусі́д," }, " ча́сто гуля́є тут."], ["Дити́на", { target: ", мов а́нгел," }, " спить."]] }

  - title: { uk: Звертання }
    role: own
    content:
      - type: usage
        columns:
          - { key: place, label: { uk: Місце } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: B2, place: { uk: "на початку речення" }, ex: [{ target: "Ві́кторе" }, ", прочита́йте цю кни́жку."] }
          - { level: B2, place: { uk: "усередині речення" }, ex: ["Прочита́йте, ", { target: "Ві́кторе" }, ", цю кни́жку."] }
          - { level: B2, place: { uk: "у кінці речення" }, ex: ["Прочита́йте цю кни́жку, ", { target: "Ві́кторе" }, "."] }
      - type: list
        items:
          - type: note
            level: B2
            text: { uk: ["Форми звертання: ", { link: Кличний відмінок, to: uk.nouns-cases.vocative }, "."] }
      - type: usage
        columns:
          - { key: whom, label: { uk: Кому } }
          - { key: ex, label: { uk: Формула } }
        rows:
          - { level: C2, whom: { uk: "слухачам у залі" }, ex: [{ target: "Па́ні і пано́ве" }, "!"] }
          - { level: C2, whom: { uk: "голові зібрання" }, ex: [{ target: "Шано́вний па́не го́лово" }, "!"] }
          - { level: C2, whom: { uk: "другові" }, ex: [{ target: "Дороги́й дру́же" }, "!"] }
      - type: list
        items:
          - type: rule
            level: C2
            text: { uk: "Прикметник при звертанні має форму називного, іменник — кличного:" }
            ex: [{ target: "Шано́вна па́ні Окса́но" }, "!"]

  - title: { uk: Еліпсис }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Пропуск } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: B2
            use: { uk: "у відповіді немає слів побажання" }
            ex: { exchange: ["Щасли́вої доро́ги!", "Дя́кую, і вам."] }
          - level: B2
            use: { uk: "у другій частині немає того, що вже сказано" }
            ex: ["І́гор іде́ на ле́кцію, ", { target: "і О́ля тако́ж збира́ється" }, "."]
          - level: C1
            use: { uk: "у ланцюжку реплік лишається нове" }
            ex: { exchange: ["О́ля вже поверну́лася з Ха́ркова?", "Так.", "А коли́?", "У субо́ту."] }
          - level: C1
            use: { uk: "змінюється обставина, дієслово спільне" }
            ex: ["Ми вже були́ в музе́ї, ", { target: "і в теа́трі тако́ж" }, "."]
          - level: C2
            use: { uk: "дієслово пропущене, на його місці тире" }
            ex: ["Я люблю́ я́блука, а Макси́м ", { target: "— гру́ші" }, "."]
          - level: C2
            use: { uk: "пропущений увесь присудок, змінюється підмет" }
            ex: ["Я вже прочита́в цю кни́жку, ", { target: "і Ві́ктор тако́ж" }, "."]
      - type: list
        items:
          - type: note
            level: B2
            text: { uk: ["Сполучники ", { term: а }, " та ", { term: і }, ": ", { link: Сполучники, to: uk.sentence.conjunctions }, "."] }

  - title: { uk: Повтор }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма } }
          - { key: meaning, label: { uk: Значення } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: B2
            form: { uk: [{ term: хто-хто }, ", ", { term: що-що }] }
            meaning: { uk: "перепитує з подивом" }
            ex: { exchange: ["Окса́на ви́грала олімпіа́ду!", { target: "Хто-хто?" }] }
          - level: C1
            form: { uk: [{ term: де-де }, ", ", { term: коли́-коли́ }] }
            meaning: { uk: "перепитує місце чи час" }
            ex: { exchange: ["Зустрі́немося бі́ля фонта́на.", { target: "Де-де?" }] }
          - level: C2
            form: { uk: [{ term: куди́-куди́ }, ", а…"] }
            meaning: { uk: "назване — певне, решта — під питанням" }
            ex: [{ target: "Куди́-куди́" }, ", а до Льво́ва я пої́ду обов’язко́во."]

  - title: { uk: Порівняння }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Вищий ступінь } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: B2, form: { uk: [{ term: ніж }, " + називний"] }, ex: ["Окса́на моло́дша", { target: ", ніж я" }, "."] }
          - { level: B2, form: { uk: [{ term: за }, " + знахідний"] }, ex: ["Окса́на моло́дша ", { target: "за мене́" }, "."] }
          - { level: B2, form: { uk: [{ term: від }, " + родовий"] }, ex: ["Окса́на моло́дша ", { target: "від мене́" }, "."] }
          - level: C2
            form: { uk: "прислівник у тих самих конструкціях" }
            ex: { examples: [["Вона́ бі́гає шви́дше", { target: ", ніж я" }, "."], ["Вона́ бі́гає шви́дше ", { target: "за мене́" }, "."], ["Вона́ бі́гає шви́дше ", { target: "від мене́" }, "."]] }
      - type: list
        items:
          - type: note
            level: B2
            text: { uk: ["Форми вищого ступеня: ", { link: Ступені порівняння, to: uk.adjectives-adverbs.comparison }, "."] }
      - type: usage
        columns:
          - { key: head, label: { uk: Образне порівняння } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: B2, head: { uk: [{ term: як }, " після прикметника"] }, ex: ["Вода́ в о́зері чи́ста", { target: ", як сльоза́" }, "."] }
          - { level: B2, head: { uk: [{ term: мов }, " після прикметника"] }, ex: ["Ліс стої́ть ти́хо", { target: ", мов зачаро́ваний" }, "."] }
          - { level: C1, head: { uk: [{ term: як }, " після дієслова"] }, ex: ["Маши́на працю́є", { target: ", як годи́нник" }, "."] }
          - { level: C1, head: { uk: [{ term: мов }, " після дієслова"] }, ex: ["Хло́пчик стриба́є", { target: ", мов м’яч" }, "."] }
          - level: C2
            head: { uk: "образ — іменник, часом із поширенням" }
            ex: { examples: [["Вона́ висо́ка", { target: ", як топо́ля" }, "."], ["Її́ го́лос затремті́в", { target: ", мов лист на вітрі́" }, "."]] }

  - title: { uk: Уточнення }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Засіб } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: B2, use: { uk: [{ term: "там, де" }, " і підрядна частина"] }, ex: ["Ми зустрі́лися", { target: " там, де коли́сь стоя́в стари́й млин" }, "."] }
          - { level: B2, use: { uk: "прикладка після іменника" }, ex: ["Мій брат", { target: ", лі́кар," }, " живе́ в Оде́сі."] }
          - { level: C1, use: { uk: "слово місця і група слів, що його уточнює" }, ex: ["Ми зупини́лися там", { target: ", бі́ля старо́го мо́сту," }, " і чека́ли дру́зів."] }
          - { level: C1, use: { uk: "прикладка з поширенням" }, ex: ["Іва́н Франко́", { target: ", відо́мий письме́нник і вче́ний," }, " жив у Льво́ві."] }
          - { level: C2, use: { uk: ["прикладка після ", { term: я }, " в офіційному тексті"] }, ex: ["Я", { target: ", Окса́на Ковале́нко, студе́нтка дру́гого ку́рсу," }, " прошу́ нада́ти мені́ гурто́житок."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "Прикладка стоїть у тому самому відмінку, що й слово, яке вона уточнює:" }
            ex: ["Я розмовля́в із Андрі́єм", { target: ", на́шим сусі́дом" }, "."]

  - title: { uk: Риторичне питання }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C1, form: { uk: [{ term: "хто ж" }, ": відповідь очевидна"] }, ex: [{ target: "Хто ж не лю́бить" }, " рі́дне мі́сто?"] }
          - { level: C1, form: { uk: [{ term: "хто б" }, " і умовний спосіб: подив"] }, ex: ["І ", { target: "хто б міг" }, " це передба́чити?"] }
          - { level: C2, form: { uk: [{ term: "чи не так" }, " після твердження"] }, ex: ["Ми всі хо́чемо ми́ру, ", { target: "чи не так" }, "?.."] }
          - { level: C2, form: { uk: [{ term: "Як Ви вважа́єте" }, ": ввічливе питання співрозмовнику"] }, ex: ["Чи справедли́ве це рі́шення? ", { target: "Як Ви вважа́єте" }, "?"] }
      - type: list
        items:
          - type: note
            level: C1
            text: { uk: ["Питання й заперечення: ", { link: Питання й заперечення, to: uk.sentence.questions-negation }, "."] }

  - title: { uk: Засоби в тексті }
    role: own
    content:
      - type: usage
        columns:
          - { key: place, label: { uk: Засіб } }
          - { key: role, label: { uk: Що робить } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - { level: C1, place: { uk: "питання на початку" }, role: { uk: "відкриває тему" }, ex: [{ target: "Що ми зна́ємо" }, " про рі́дне мі́сто?"] }
          - { level: C1, place: { uk: "питання в середині" }, role: { uk: "веде до нової думки" }, ex: [{ target: "Що ж ста́лося" }, " да́лі?"] }
          - { level: C1, place: { uk: "питання в кінці" }, role: { uk: "залишає читача з думкою" }, ex: [{ target: "Чи не час нам заду́матися" }, "?"] }
          - { level: C1, place: { uk: повтор }, role: { uk: "підкреслює головне" }, ex: [{ target: "Ми ві́рили" }, ". ", { target: "Ми ві́рили" }, " в перемо́гу. ", { target: "Ми ві́рили" }, ", коли́ всі мовча́ли."] }

  - title: { uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "Окса́на моло́дша від я.", right: ["Окса́на моло́дша ", { target: "від мене́" }, "."], rule: { uk: [{ term: від }, " вимагає родового відмінка"] } }
          - { level: B2, wrong: "Окса́на моло́дша за я.", right: ["Окса́на моло́дша ", { target: "за мене́" }, "."], rule: { uk: [{ term: за }, " вимагає знахідного відмінка"] } }
          - { level: B2, wrong: "Вода́ чи́ста, ніж сльоза́.", right: ["Вода́ чи́ста", { target: ", як сльоза́" }, "."], rule: { uk: [{ term: ніж }, " стоїть після вищого ступеня; образ вводять словами ", { term: як }, " чи ", { term: мов }] } }
          - { level: C2, wrong: "Я люблю́ я́блука, а Макси́м гру́ші.", right: ["Я люблю́ я́блука, а Макси́м ", { target: "— гру́ші" }, "."], rule: { uk: "на місці пропущеного дієслова стоїть тире" } }
          - { level: C2, wrong: "Шано́вний па́не голова́!", right: ["Шано́вний па́не ", { target: "го́лово" }, "!"], rule: { uk: "іменник у звертанні має форму кличного відмінка" } }
