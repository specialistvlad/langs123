title: { uk: Ти і Ви, en: Ти and Ви, es: Ти y Ви, pt: "Ти e Ви", fr: "Ти et Ви", de: "Ти und Ви", it: "Ти e Ви", pl: "Ти i Ви", tr: "Ти ve Ви", id: "Ти dan Ви", vi: "Ти và Ви" }
summary:
  lead:
    uk: [{ term: Ти }, " — до близької людини, ", { term: Ви }, " — до незнайомої чи старшої; ", { term: Ви }, " має дієслово в множині: ", { term: Ви зна́єте }, "."]
    en: [{ term: Ти }, " is for someone close, ", { term: Ви }, " for a stranger or an older person; ", { term: Ви }, " takes a plural verb: ", { term: Ви зна́єте }, "."]
    es: [{ term: Ти }, " es para alguien cercano y ", { term: Ви }, " para un desconocido o una persona mayor; ", { term: Ви }, " lleva el verbo en plural: ", { term: Ви зна́єте }, "."]
    pt: [{ term: "Ти" }, " é para alguém próximo, ", { term: "Ви" }, " para um desconhecido ou uma pessoa mais velha; ", { term: "Ви" }, " leva o verbo no plural: ", { term: "Ви зна́єте" }, "."]
    fr: [{ term: "Ти" }, " s’emploie avec un proche, ", { term: "Ви" }, " avec un inconnu ou une personne plus âgée ; ", { term: "Ви" }, " prend le verbe au pluriel : ", { term: "Ви зна́єте" }, "."]
    de: [{ term: "Ти" }, " gilt für Vertraute, ", { term: "Ви" }, " für Fremde und Ältere; ", { term: "Ви" }, " verlangt das Verb im Plural: ", { term: "Ви зна́єте" }, "."]
    it: [{ term: "Ти" }, " si usa con una persona vicina, ", { term: "Ви" }, " con uno sconosciuto o una persona più anziana; ", { term: "Ви" }, " vuole il verbo al plurale: ", { term: "Ви зна́єте" }, "."]
    pl: [{ term: "Ти" }, " mówimy do osoby bliskiej, ", { term: "Ви" }, " — do nieznajomej lub starszej; ", { term: "Ви" }, " łączy się z czasownikiem w liczbie mnogiej: ", { term: "Ви зна́єте" }, "."]
    tr: [{ term: "Ти" }, " yakın biri için, ", { term: "Ви" }, " tanımadığımız ya da yaşça büyük biri için kullanılır; ", { term: "Ви" }, " çoğul fiil alır: ", { term: "Ви зна́єте" }, "."]
    id: [{ term: "Ти" }, " untuk orang yang akrab, ", { term: "Ви" }, " untuk orang asing atau orang yang lebih tua; ", { term: "Ви" }, " dipakai dengan kata kerja bentuk jamak: ", { term: "Ви зна́єте" }, "."]
    vi: [{ term: "Ти" }, " dùng với người thân thiết, ", { term: "Ви" }, " với người lạ hoặc người lớn tuổi hơn; ", { term: "Ви" }, " đi với động từ ở số nhiều: ", { term: "Ви зна́єте" }, "."]
  rule:
    uk: ["Навіть до однієї людини ", { term: Ви }, " має форму другої особи множини:"]
    en: ["Even with one person, ", { term: Ви }, " takes the second-person plural form:"]
    es: ["Incluso con una sola persona, ", { term: Ви }, " lleva la segunda persona del plural:"]
    pt: ["Mesmo com uma só pessoa, ", { term: "Ви" }, " leva a forma da segunda pessoa do plural:"]
    fr: ["Même avec une seule personne, ", { term: "Ви" }, " prend la forme de la deuxième personne du pluriel :"]
    de: ["Auch bei einer einzelnen Person steht ", { term: "Ви" }, " mit der Form der 2. Person Plural:"]
    it: ["Anche con una sola persona, ", { term: "Ви" }, " prende la forma della seconda persona plurale:"]
    pl: ["Nawet do jednej osoby ", { term: "Ви" }, " łączy się z formą drugiej osoby liczby mnogiej:"]
    tr: ["Tek bir kişiye bile ", { term: "Ви" }, " ikinci çoğul kişi biçimini alır:"]
    id: ["Bahkan untuk satu orang, ", { term: "Ви" }, " memakai bentuk orang kedua jamak:"]
    vi: ["Ngay cả với một người, ", { term: "Ви" }, " vẫn dùng dạng ngôi thứ hai số nhiều:"]
  ex: { examples: [["Ти ", { target: зна́єш }, "?"], ["Ви ", { target: зна́єте }, "?"]] }

