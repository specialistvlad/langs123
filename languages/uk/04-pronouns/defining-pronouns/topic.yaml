summary:
  lead:
    uk: [{ term: Весь }, " називає ціле, ", { term: ко́жен }, " — кожну окрему особу чи річ, ", { term: сам }, " — виконавця без помічників, ", { term: і́нший }, " — не цього."]
    en: [{ term: "Весь" }, " names the whole, ", { term: "ко́жен" }, " each single person or thing, ", { term: "сам" }, " the doer with no helpers, ", { term: "і́нший" }, " not this one."]
    es: [{ term: "Весь" }, " nombra el conjunto, ", { term: "ко́жен" }, " cada persona o cosa por separado, ", { term: "сам" }, " a quien actúa sin ayuda e ", { term: "і́нший" }, " lo que no es este."]
    pt: [{ term: "Весь" }, " nomeia o todo, ", { term: "ко́жен" }, " cada pessoa ou coisa em separado, ", { term: "сам" }, " quem age sem ajuda e ", { term: "і́нший" }, " o que não é este."]
    fr: [{ term: "Весь" }, " désigne le tout, ", { term: "ко́жен" }, " chaque personne ou chose prise à part, ", { term: "сам" }, " celui qui agit sans aide et ", { term: "і́нший" }, " ce qui n’est pas celui-ci."]
    de: [{ term: "Весь" }, " nennt das Ganze, ", { term: "ко́жен" }, " jede einzelne Person oder Sache, ", { term: "сам" }, " den Handelnden ohne Helfer und ", { term: "і́нший" }, " das, was nicht dieses ist."]
    it: [{ term: "Весь" }, " indica il tutto, ", { term: "ко́жен" }, " ogni singola persona o cosa, ", { term: "сам" }, " chi agisce senza aiuto e ", { term: "і́нший" }, " ciò che non è questo."]
    pl: [{ term: "Весь" }, " nazywa całość, ", { term: "ко́жен" }, " każdą osobę lub rzecz z osobna, ", { term: "сам" }, " wykonawcę bez pomocników, a ", { term: "і́нший" }, " to, co nie jest tym."]
    tr: [{ term: "Весь" }, " bütünü, ", { term: "ко́жен" }, " tek tek her kişiyi ya da şeyi, ", { term: "сам" }, " yardımcısız yapan kişiyi, ", { term: "і́нший" }, " ise bu olmayanı gösterir."]
    id: [{ term: "Весь" }, " menyebut keseluruhan, ", { term: "ко́жен" }, " setiap orang atau benda satu per satu, ", { term: "сам" }, " pelaku tanpa pembantu, dan ", { term: "і́нший" }, " yang bukan ini."]
    vi: [{ term: "Весь" }, " chỉ toàn thể, ", { term: "ко́жен" }, " chỉ từng người hay từng vật riêng lẻ, ", { term: "сам" }, " chỉ người tự làm không ai giúp, còn ", { term: "і́нший" }, " chỉ cái không phải cái này."]
  rule:
    uk: "Означальні займенники узгоджуються з іменником у роді, числі й відмінку:"
    en: "Defining pronouns agree with the noun in gender, number and case:"
    es: "Los pronombres determinativos concuerdan con el sustantivo en género, número y caso:"
    pt: "Os pronomes determinativos concordam com o substantivo em gênero, número e caso:"
    fr: "Les pronoms déterminatifs s’accordent avec le nom en genre, en nombre et en cas :"
    de: "Bestimmende Pronomen richten sich nach dem Nomen in Genus, Numerus und Kasus:"
    it: "I pronomi determinativi concordano con il sostantivo in genere, numero e caso:"
    pl: "Zaimki określające zgadzają się z rzeczownikiem w rodzaju, liczbie i przypadku:"
    tr: "Belirleyici zamirler isimle gramer cinsiyetinde, sayıda ve hâlde uyum sağlar:"
    id: "Kata ganti penentu menyesuaikan diri dengan kata benda dalam gender, jumlah, dan kasus:"
    vi: "Đại từ xác định hợp với danh từ về giống, số và cách:"
