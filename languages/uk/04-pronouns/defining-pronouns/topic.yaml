              tr: [{ term: "все" }, " “her şey”, ", { term: "всі" }, " ise “bütün insanlar” demektir:"]
              id: [{ term: "все" }, " berarti “semuanya”, dan ", { term: "всі" }, " berarti “semua orang”:"]
