summary:
  lead:
    uk: [{ term: Хтось }, " називає певну, але невідому особу, ", { term: хто-не́будь }, " — будь-кого з можливих, ", { term: будь-хто́ }, " — будь-кого взагалі."]
    en: [{ term: "Хтось" }, " names a particular but unknown person, ", { term: "хто-не́будь" }, " any one of the possible people and ", { term: "будь-хто́" }, " anyone at all."]
    es: [{ term: "Хтось" }, " nombra a una persona concreta pero desconocida, ", { term: "хто-не́будь" }, " a cualquiera de las posibles y ", { term: "будь-хто́" }, " a cualquiera en general."]
    pt: [{ term: "Хтось" }, " designa uma pessoa determinada, mas desconhecida, ", { term: "хто-не́будь" }, " qualquer uma entre as possíveis e ", { term: "будь-хто́" }, " qualquer pessoa em geral."]
    fr: [{ term: "Хтось" }, " désigne une personne précise mais inconnue, ", { term: "хто-не́будь" }, " n’importe laquelle parmi les possibles et ", { term: "будь-хто́" }, " n’importe qui en général."]
    de: [{ term: "Хтось" }, " nennt eine bestimmte, aber unbekannte Person, ", { term: "хто-не́будь" }, " irgendeine der möglichen und ", { term: "будь-хто́" }, " jeden beliebigen."]
    it: [{ term: "Хтось" }, " indica una persona precisa ma sconosciuta, ", { term: "хто-не́будь" }, " una qualsiasi tra quelle possibili e ", { term: "будь-хто́" }, " chiunque in generale."]
    pl: [{ term: "Хтось" }, " oznacza konkretną, ale nieznaną osobę, ", { term: "хто-не́будь" }, " dowolną osobę spośród możliwych, a ", { term: "будь-хто́" }, " dowolną osobę w ogóle."]
    tr: [{ term: "Хтось" }, " belli ama bilinmeyen bir kişiyi, ", { term: "хто-не́будь" }, " olası kişilerden herhangi birini, ", { term: "будь-хто́" }, " ise kim olursa olsun herhangi birini bildirir."]
    id: [{ term: "Хтось" }, " menyebut orang tertentu yang tidak diketahui, ", { term: "хто-не́будь" }, " siapa saja di antara yang mungkin, dan ", { term: "будь-хто́" }, " siapa pun secara umum."]
    vi: [{ term: "Хтось" }, " chỉ người xác định nhưng chưa biết, ", { term: "хто-не́будь" }, " chỉ một người bất kỳ, ", { term: "будь-хто́" }, " chỉ bất kỳ ai."]
  rule:
    uk: ["Частка ", { term: "-сь" }, " стоїть у розповіді про факт, ", { term: "-не́будь" }, " — у питанні, проханні, умові й майбутньому:"]
    en: ["The particle ", { term: "-сь" }, " is for a fact, ", { term: "-не́будь" }, " for a question, a request, a condition and the future:"]
    es: ["La partícula ", { term: "-сь" }, " se usa para un hecho y ", { term: "-не́будь" }, " en la pregunta, el pedido, la condición y el futuro:"]
    pt: ["A partícula ", { term: "-сь" }, " vale para um fato e ", { term: "-не́будь" }, " para a pergunta, o pedido, a condição e o futuro:"]
    fr: ["La particule ", { term: "-сь" }, " sert pour un fait, ", { term: "-не́будь" }, " pour la question, la demande, la condition et le futur :"]
    de: ["Die Partikel ", { term: "-сь" }, " steht bei einer Tatsache, ", { term: "-не́будь" }, " in Frage, Bitte, Bedingung und Zukunft:"]
    it: ["La particella ", { term: "-сь" }, " si usa per un fatto, ", { term: "-не́будь" }, " nella domanda, nella richiesta, nella condizione e nel futuro:"]
    pl: ["Partykuła ", { term: "-сь" }, " stoi przy fakcie, a ", { term: "-не́будь" }, " w pytaniu, prośbie, warunku i czasie przyszłym:"]
    tr: ["Bir olgu için ", { term: "-сь" }, " parçacığı, soru, rica, koşul ve gelecek için ", { term: "-не́будь" }, " kullanılır:"]
    id: ["Partikel ", { term: "-сь" }, " dipakai untuk fakta, sedangkan ", { term: "-не́будь" }, " untuk pertanyaan, permintaan, syarat, dan masa depan:"]
    vi: ["Tiểu từ ", { term: "-сь" }, " dùng cho sự việc có thật, ", { term: "-не́будь" }, " dùng trong câu hỏi, lời nhờ, điều kiện, tương lai:"]
  ex: { examples: [[{ target: Хтось }, " подзвони́в."], ["Якщо́ ", { target: хто-не́будь }, " подзвони́ть, скажи́, що я ви́йшов."]] }

