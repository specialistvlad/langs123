              en: [{ term: Це }, " introduces a person or a thing and never changes for gender or number:"]
              es: [{ term: Це }, " presenta a una persona o una cosa y no cambia de género ni de número:"]
              pt: [{ term: "Це" }, " apresenta uma pessoa ou uma coisa e não muda de gênero nem de número:"]
              fr: [{ term: "Це" }, " présente une personne ou une chose et ne change ni de genre ni de nombre :"]
              de: [{ term: "Це" }, " stellt eine Person oder eine Sache vor und ändert sich nicht nach Genus und Numerus:"]
              it: [{ term: "Це" }, " presenta una persona o una cosa e non cambia né di genere né di numero:"]
              pl: [{ term: "Це" }, " przedstawia osobę lub rzecz i nie zmienia się w zależności od rodzaju ani liczby:"]
