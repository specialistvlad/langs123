              id: [{ term: "Це" }, " memperkenalkan orang atau benda dan tidak berubah menurut gender maupun jumlah:"]
              vi: [{ term: "Це" }, " giới thiệu một người hay một vật và không đổi theo giống hay số:"]
            ex: { examples: [[{ target: Це }, " Іри́на."], [{ target: Це }, " на́ші квитки́."]] }
            tr: { en: { examples: ["This is Iryna.", "These are our tickets."] }, es: { examples: ["Esta es Iryna.", "Estos son nuestros billetes."] }, pt: { examples: ["Esta é a Iryna.", "Estas são as nossas passagens."] }, fr: { examples: ["C’est Iryna.", "Ce sont nos billets."] }, de: { examples: ["Das ist Iryna.", "Das sind unsere Tickets."] }, it: { examples: ["Questa è Iryna.", "Questi sono i nostri biglietti."] }, pl: { examples: ["To jest Iryna.", "To są nasze bilety."] }, tr: { examples: ["Bu Iryna.", "Bunlar bizim biletlerimiz."] }, id: { examples: ["Ini Iryna.", "Ini tiket kami."] }, vi: { examples: ["Đây là Iryna.", "Đây là vé của chúng tôi."] } }
          - type: rule
