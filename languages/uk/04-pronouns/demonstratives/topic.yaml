            tr: { en: "These apples are tasty.", es: "Estas manzanas están ricas.", pt: "Estas maçãs são gostosas.", fr: "Ces pommes sont bonnes.", de: "Diese Äpfel sind lecker.", it: "Queste mele sono buone.", pl: "Te jabłka są smaczne.", tr: "Bu elmalar lezzetli.", id: "Apel-apel ini enak.", vi: "Những quả táo này ngon." }

  - title: { uk: "Це: «це є»", en: "Це: “this is”", es: "Це: «esto es»", pt: "Це: “isto é”", fr: "Це : « c’est »", de: "Це: „das ist“", it: "Це: «questo è»", pl: "Це: „to jest”", tr: "Це: “bu …dir”", id: "Це: “ini adalah”", vi: "Це: “đây là”" }
