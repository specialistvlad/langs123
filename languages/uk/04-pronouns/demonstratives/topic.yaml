              de: [{ term: "таки́й" }, " leitet einen Vergleich mit ", { term: "як" }, " und eine Folge mit ", { term: "що" }, " ein:"]
              it: [{ term: "таки́й" }, " introduce un confronto con ", { term: "як" }, " e una conseguenza con ", { term: "що" }, ":"]
              pl: [{ term: "таки́й" }, " otwiera porównanie ze słowem ", { term: "як" }, " i skutek ze słowem ", { term: "що" }, ":"]
              tr: [{ term: "таки́й" }, " sözcüğü ", { term: "як" }, " ile bir karşılaştırma, ", { term: "що" }, " ile bir sonuç başlatır:"]
              id: [{ term: "таки́й" }, " membuka perbandingan dengan ", { term: "як" }, " dan akibat dengan ", { term: "що" }, ":"]
              vi: [{ term: "таки́й" }, " mở đầu phép so sánh với ", { term: "як" }, " và kết quả với ", { term: "що" }, ":"]
            ex: { examples: [["Я хо́чу ", { target: таки́й }, " телефо́н, ", { target: як }, " у тебе́."], ["Вона́ ", { target: така́ }, " голо́дна, ", { target: що }, " з’ї́ла б усе́."]] }
            tr: { en: { examples: ["I want a phone like yours.", "She is so hungry that she would eat everything."] }, es: { examples: ["Quiero un teléfono como el tuyo.", "Tiene tanta hambre que se comería todo."] }, pt: { examples: ["Quero um telefone igual ao seu.", "Ela está com tanta fome que comeria tudo."] }, fr: { examples: ["Je veux un téléphone comme le tien.", "Elle a tellement faim qu’elle mangerait tout."] }, de: { examples: ["Ich will so ein Handy wie deins.", "Sie hat so einen Hunger, dass sie alles essen würde."] }, it: { examples: ["Voglio un telefono come il tuo.", "Ha una tale fame che mangerebbe tutto."] }, pl: { examples: ["Chcę taki telefon jak twój.", "Jest tak głodna, że zjadłaby wszystko."] }, tr: { examples: ["Seninki gibi bir telefon istiyorum.", "O kadar aç ki her şeyi yerdi."] }, id: { examples: ["Saya mau ponsel seperti punyamu.", "Dia begitu lapar sampai bisa menghabiskan semuanya."] }, vi: { examples: ["Tôi muốn một chiếc điện thoại giống của bạn.", "Cô ấy đói đến mức ăn hết mọi thứ."] } }

