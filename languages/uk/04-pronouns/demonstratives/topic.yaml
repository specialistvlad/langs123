id: uk.pronouns.demonstratives
lang: uk
kind: grammar
tags: [pronouns, demonstratives, це]
concepts: [demonstratives]
related: [uk.pronouns.possessives, uk.adjectives-adverbs.adjective-declension, uk.nouns-cases.nominative]
status: { uk: draft, en: draft, es: draft }
translated: { en: "bcb747 6c6a39 e9d04c 1bef95 d32182 888044 f062d0", es: "bcb747 6c6a39 e9d04c 1bef95 d32182 888044 f062d0" }

title: { uk: "Вказівні займенники: цей, той", en: "This and That: цей, той", es: "Los demostrativos: цей, той" }
summary:
  lead:
    uk: [{ term: Цей }, " вказує на близьке, ", { term: той }, " — на далеке; обидва узгоджуються з іменником: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
    en: [{ term: Цей }, " points to something near and ", { term: той }, " to something far; both agree with the noun: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
    es: [{ term: Цей }, " señala lo cercano y ", { term: той }, ", lo lejano; los dos concuerdan con el sustantivo: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
  rule:
    uk: [{ term: Це }, " у значенні «це є» не змінюється, а ", { term: цей }, " перед іменником змінюється:"]
    en: [{ term: Це }, " meaning “this is” never changes, while ", { term: цей }, " before a noun does:"]
    es: [{ term: Це }, " con el sentido de «esto es» no cambia; ", { term: цей }, " delante de un sustantivo, sí:"]
  ex: { examples: [[{ target: Це }, " моя́ сестра́."], [{ target: Ця }, " кни́жка нова́."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Близько, en: Near, es: Cerca }
          rule: { uk: { alternatives: [{ term: цей }, { term: ця }, { term: це }, { term: ці }] }, en: { alternatives: [{ term: цей }, { term: ця }, { term: це }, { term: ці }] }, es: { alternatives: [{ term: цей }, { term: ця }, { term: це }, { term: ці }] } }
          ex: [{ target: Ця }, " су́мка нова́."]
          tr: { en: "This bag is new.", es: "Esta bolsa es nueva." }
        - level: A1
          point: { uk: Далеко, en: Far, es: Lejos }
          rule: { uk: { alternatives: [{ term: той }, { term: та }, { term: те }, { term: ті }] }, en: { alternatives: [{ term: той }, { term: та }, { term: те }, { term: ті }] }, es: { alternatives: [{ term: той }, { term: та }, { term: те }, { term: ті }] } }
          ex: [{ target: Той }, " буди́нок вели́кий."]
          tr: { en: "That building is big.", es: "Aquel edificio es grande." }
        - level: A1
          point: { term: Це }
          rule: { uk: "«це є» — не змінюється", en: "“this is”, never changes", es: "«esto es», no cambia" }
          ex: { examples: [[{ target: Це }, " мій брат."], [{ target: Це }, " мої́ дру́зі."]] }
          tr: { en: { examples: ["This is my brother.", "These are my friends."] }, es: { examples: ["Este es mi hermano.", "Estos son mis amigos."] } }
        - level: B1
          point: { uk: Відмінки, en: Cases, es: Casos }
          rule: { uk: { alternatives: [{ term: цього́ }, { term: ціє́ї }, { term: цих }] }, en: { alternatives: [{ term: цього́ }, { term: ціє́ї }, { term: цих }] }, es: { alternatives: [{ term: цього́ }, { term: ціє́ї }, { term: цих }] } }
          ex: ["Я живу́ в ", { target: цьому́ }, " буди́нку."]
          tr: { en: "I live in this building.", es: "Vivo en este edificio." }
        - level: B1
          point: { uk: Час, en: Time, es: Tiempo }
          rule: { uk: "родовий без прийменника", en: "the genitive with no preposition", es: "el genitivo sin preposición" }
          ex: [{ target: Цього́ }, " ро́ку я ї́ду до Ки́єва."]
          tr: { en: "This year I'm going to Kyiv.", es: "Este año voy a Kiev." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: paradigm
        columns:
          - { key: masc, label: { uk: Чоловічий рід, en: Masculine, es: Masculino }, features: { gender: masc, number: sg } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino }, features: { gender: fem, number: sg } }
          - { key: neut, label: { uk: Середній рід, en: Neuter, es: Neutro }, features: { gender: neut, number: sg } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural }, features: { number: pl } }
        rows:
          - { level: A1, features: { deixis: prox }, masc: цей, fem: ця, neut: це, pl: ці }
          - { level: A1, features: { deixis: dist }, masc: той, fem: та, neut: те, pl: ті }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Українська має дві відстані: ", { term: цей }, " — тут, ", { term: той }, " — там:"]
              en: ["Ukrainian has two distances: ", { term: цей }, " for here and ", { term: той }, " for there:"]
              es: ["El ucraniano tiene dos distancias: ", { term: цей }, " para aquí y ", { term: той }, " para allí:"]
            ex: { contrast: [[{ target: цей }, " стіл"], [{ target: той }, " стіл"]] }
            tr: { en: { contrast: ["this table", "that table"] }, es: { contrast: ["esta mesa", "aquella mesa"] } }
          - type: rule
            level: A1
            text:
              uk: "Вказівний займенник стоїть перед іменником і має його рід і число:"
              en: "A demonstrative goes before its noun and takes the noun's gender and number:"
              es: "El demostrativo va delante del sustantivo y toma su género y su número:"
            ex: [{ target: Ці }, " я́блука смачні́."]
            tr: { en: "These apples are tasty.", es: "Estas manzanas están ricas." }

  - title: { uk: "Це: «це є»", en: "Це: “this is”", es: "Це: «esto es»" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: [{ term: Це }, " представляє людину чи річ і не змінюється за родом і числом:"]
              en: [{ term: Це }, " introduces a person or a thing and never changes for gender or number:"]
              es: [{ term: Це }, " presenta a una persona o una cosa y no cambia de género ni de número:"]
            ex: { examples: [[{ target: Це }, " Іри́на."], [{ target: Це }, " на́ші квитки́."]] }
            tr: { en: { examples: ["This is Iryna.", "These are our tickets."] }, es: { examples: ["Esta es Iryna.", "Estos son nuestros billetes."] } }
          - type: rule
            level: A1
            text:
              uk: ["У реченні з ", { term: це }, " слово «є» зазвичай пропускаємо:"]
              en: ["In a sentence with ", { term: це }, ", the verb “is” is usually left out:"]
              es: ["En una frase con ", { term: це }, ", el verbo «es» suele omitirse:"]
            ex: [{ target: Це }, " ду́же га́рне мі́сто."]
            tr: { en: "This is a very beautiful city.", es: "Es una ciudad muy bonita." }

  - title: { uk: "Форма: відмінки цей", en: "Form: the cases of цей", es: "Forma: los casos de цей" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: mn, label: { uk: "Чоловічий і середній рід", en: "Masculine and neuter", es: "Masculino y neutro" } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural } }
        rows:
          - { level: B1, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, mn: цього́, fem: ціє́ї, pl: цих }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, mn: цьому́, fem: цій, pl: цим }
          - { level: B1, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, mn: { alternatives: [цей, цього́, це] }, fem: цю, pl: { alternatives: [ці, цих] } }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, mn: цим, fem: ціє́ю, pl: ци́ми }
          - { level: B1, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, mn: у цьому́, fem: у цій, pl: у цих }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Займенник стоїть у тому самому відмінку, що й іменник:"
              en: "The demonstrative takes the case of its noun:"
              es: "El demostrativo toma el caso de su sustantivo:"
            ex: ["Бі́ля ", { target: ціє́ї }, " кав’я́рні є парк."]
            tr: { en: "There's a park near this café.", es: "Hay un parque cerca de esta cafetería." }

  - title: { uk: "Форма: відмінки той", en: "Form: the cases of той", es: "Forma: los casos de той" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: mn, label: { uk: "Чоловічий і середній рід", en: "Masculine and neuter", es: "Masculino y neutro" } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural } }
        rows:
          - { level: B1, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, mn: того́, fem: { alternatives: [тіє́ї, то́ї] }, pl: тих }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, mn: тому́, fem: тій, pl: тим }
          - { level: B1, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, mn: { alternatives: [той, того́, те] }, fem: ту, pl: { alternatives: [ті, тих] } }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, mn: тим, fem: { alternatives: [тіє́ю, то́ю] }, pl: ти́ми }
          - { level: B1, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, mn: { alternatives: [на тому́, на то́му] }, fem: на тій, pl: на тих }
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: ["Про час частіше кажуть без прийменника, у родовому: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " теж правильно."]
              en: ["For time, Ukrainian more often uses the genitive with no preposition: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " is also correct."]
              es: ["Para el tiempo, el ucraniano suele usar el genitivo sin preposición: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " también es correcto."]
            ex: [{ target: Цього́ ро́ку }, " я ї́ду до Ки́єва."]
            tr: { en: "This year I'm going to Kyiv.", es: "Este año voy a Kiev." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Цей кни́жка ціка́ва., right: [{ target: Ця }, " кни́жка ціка́ва."], rule: { uk: [{ term: кни́жка }, " — жіночий рід: ", { term: ця }], en: [{ term: кни́жка }, " is feminine: ", { term: ця }], es: [{ term: кни́жка }, " es femenino: ", { term: ця }] } }
          - { level: A1, speakers: [en, es], wrong: Цей мій брат., right: [{ target: Це }, " мій брат."], rule: { en: ["“this is” is ", { term: Це }, ", which never changes"], es: ["«este es» se dice ", { term: Це }, ", que no cambia"] } }
          - { level: B1, wrong: Я живу́ в цей мі́сто., right: ["Я живу́ в ", { target: цьому́ мі́сті }, "."], rule: { uk: ["де? — місцевий: ", { term: у цьому́ }], en: ["where? takes the locative: ", { term: у цьому́ }], es: ["¿dónde? lleva el locativo: ", { term: у цьому́ }] } }
