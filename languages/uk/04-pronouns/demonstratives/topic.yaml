            ex: ["Ми поздоро́валися зі ", { target: стількома́ }, " людьми́."]
            tr: { en: "We greeted so many people.", es: "Saludamos a tanta gente.", pt: "Cumprimentamos tanta gente.", fr: "Nous avons salué tant de monde.", de: "Wir haben so viele Leute begrüßt.", it: "Abbiamo salutato così tante persone.", pl: "Przywitaliśmy się z tyloma ludźmi.", tr: "O kadar çok insanı selamladık.", id: "Kami menyapa begitu banyak orang.", vi: "Chúng tôi đã chào hỏi ngần ấy người." }

