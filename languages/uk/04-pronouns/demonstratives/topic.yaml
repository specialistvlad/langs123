              fr: "Le démonstratif se place devant le nom et prend son genre et son nombre :"
              de: "Das Demonstrativpronomen steht vor dem Nomen und übernimmt dessen Genus und Numerus:"
              it: "Il dimostrativo sta davanti al sostantivo e ne prende il genere e il numero:"
