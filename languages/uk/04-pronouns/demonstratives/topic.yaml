title: { uk: "Вказівні займенники: цей, той", en: "This and That: цей, той", es: "Los demostrativos: цей, той", pt: "Os demonstrativos: цей, той", fr: "Les démonstratifs : цей, той", de: "Demonstrativpronomen: цей, той", it: "I dimostrativi: цей, той", pl: "Zaimki wskazujące: цей, той", tr: "İşaret zamirleri: цей, той", id: "Kata tunjuk: цей, той", vi: "Đại từ chỉ định: цей, той" }
summary:
  lead:
    uk: [{ term: Цей }, " вказує на близьке, ", { term: той }, " — на далеке; обидва узгоджуються з іменником: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
    en: [{ term: Цей }, " points to something near and ", { term: той }, " to something far; both agree with the noun: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
    es: [{ term: Цей }, " señala lo cercano y ", { term: той }, ", lo lejano; los dos concuerdan con el sustantivo: ", { term: ця кни́жка }, ", ", { term: ті книжки́ }, "."]
    pt: [{ term: "Цей" }, " indica o que está perto e ", { term: "той" }, ", o que está longe; os dois concordam com o substantivo: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    fr: [{ term: "Цей" }, " désigne ce qui est proche et ", { term: "той" }, ", ce qui est éloigné ; les deux s’accordent avec le nom : ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    de: [{ term: "Цей" }, " zeigt auf etwas Nahes, ", { term: "той" }, " auf etwas Fernes; beide richten sich nach dem Nomen: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    it: [{ term: "Цей" }, " indica ciò che è vicino e ", { term: "той" }, " ciò che è lontano; entrambi concordano con il sostantivo: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    pl: [{ term: "Цей" }, " wskazuje to, co bliskie, a ", { term: "той" }, " to, co dalekie; oba zgadzają się z rzeczownikiem: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    tr: [{ term: "Цей" }, " yakındakini, ", { term: "той" }, " uzaktakini gösterir; ikisi de isimle uyum sağlar: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    id: [{ term: "Цей" }, " menunjuk yang dekat, ", { term: "той" }, " menunjuk yang jauh; keduanya menyesuaikan diri dengan kata benda: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
    vi: [{ term: "Цей" }, " chỉ vật ở gần, ", { term: "той" }, " chỉ vật ở xa; cả hai đều hợp với danh từ: ", { term: "ця кни́жка" }, ", ", { term: "ті книжки́" }, "."]
  rule:
    uk: [{ term: Це }, " у значенні «це є» не змінюється, а ", { term: цей }, " перед іменником змінюється:"]
    en: [{ term: Це }, " meaning “this is” never changes, while ", { term: цей }, " before a noun does:"]
    es: [{ term: Це }, " con el sentido de «esto es» no cambia; ", { term: цей }, " delante de un sustantivo, sí:"]
    pt: [{ term: "Це" }, " no sentido de “isto é” não muda, mas ", { term: "цей" }, " diante de um substantivo muda:"]
    fr: [{ term: "Це" }, " au sens de « c’est » ne change pas, alors que ", { term: "цей" }, " devant un nom change :"]
    de: [{ term: "Це" }, " in der Bedeutung „das ist“ ändert sich nie, ", { term: "цей" }, " vor einem Nomen dagegen schon:"]
    it: [{ term: "Це" }, " nel senso di «questo è» non cambia, mentre ", { term: "цей" }, " davanti a un sostantivo cambia:"]
    pl: [{ term: "Це" }, " w znaczeniu „to jest” się nie zmienia, a ", { term: "цей" }, " przed rzeczownikiem się zmienia:"]
    tr: [{ term: "Це" }, " “bu …dir” anlamında değişmez, isimden önce gelen ", { term: "цей" }, " ise değişir:"]
    id: [{ term: "Це" }, " dalam arti “ini adalah” tidak berubah, sedangkan ", { term: "цей" }, " di depan kata benda berubah:"]
    vi: [{ term: "Це" }, " với nghĩa “đây là” không đổi, còn ", { term: "цей" }, " đứng trước danh từ thì đổi:"]
  ex: { examples: [[{ target: Це }, " моя́ сестра́."], [{ target: Ця }, " кни́жка нова́."]] }

