              uk: ["Про час частіше кажуть без прийменника, у родовому: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " теж правильно."]
              en: ["For time, Ukrainian more often uses the genitive with no preposition: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " is also correct."]
              es: ["Para el tiempo, el ucraniano suele usar el genitivo sin preposición: ", { term: цього́ ро́ку }, ", ", { term: цього́ ти́жня }, "; ", { term: у цьому́ ро́ці }, " también es correcto."]
              pt: ["Para o tempo, o ucraniano usa com mais frequência o genitivo sem preposição: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " também está correto."]
              fr: ["Pour le temps, l’ukrainien emploie plus souvent le génitif sans préposition : ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, " ; ", { term: "у цьому́ ро́ці" }, " est aussi correct."]
              de: ["Zeitangaben stehen meist im Genitiv ohne Präposition: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " ist aber auch richtig."]
              it: ["Per il tempo l'ucraino usa più spesso il genitivo senza preposizione: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " va bene anche."]
              pl: ["Czas wyraża się częściej dopełniaczem bez przyimka: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " też jest poprawne."]
              tr: ["Zaman için çoğunlukla edatsız tamlayan hâli kullanılır: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " da doğrudur."]
              id: ["Untuk waktu, bahasa Ukraina lebih sering memakai genitif tanpa preposisi: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " juga benar."]
              vi: ["Với thời gian, người ta thường dùng sinh cách không có giới từ: ", { term: "цього́ ро́ку" }, ", ", { term: "цього́ ти́жня" }, "; ", { term: "у цьому́ ро́ці" }, " cũng đúng."]
            ex: [{ target: Цього́ ро́ку }, " я ї́ду до Ки́єва."]
            tr: { en: "This year I'm going to Kyiv.", es: "Este año voy a Kiev.", pt: "Este ano vou para Kyiv.", fr: "Cette année, je vais à Kyiv.", de: "Dieses Jahr fahre ich nach Kyjiw.", it: "Quest'anno vado a Kyiv.", pl: "W tym roku jadę do Kijowa.", tr: "Bu yıl Kyiv’e gidiyorum.", id: "Tahun ini saya pergi ke Kyiv.", vi: "Năm nay tôi đi Kyiv." }

