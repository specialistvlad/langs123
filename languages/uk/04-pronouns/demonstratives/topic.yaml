            tr: { en: { contrast: ["this table", "that table"] }, es: { contrast: ["esta mesa", "aquella mesa"] }, pt: { contrast: ["esta mesa", "aquela mesa"] }, fr: { contrast: ["cette table", "cette table-là"] }, de: { contrast: ["dieser Tisch", "jener Tisch"] }, it: { contrast: ["questo tavolo", "quel tavolo"] }, pl: { contrast: ["ten stół", "tamten stół"] }, tr: { contrast: ["bu masa", "o masa"] }, id: { contrast: ["meja ini", "meja itu"] }, vi: { contrast: ["cái bàn này", "cái bàn kia"] } }
          - type: rule
            level: A1
            text:
              uk: "Вказівний займенник стоїть перед іменником і має його рід і число:"
              en: "A demonstrative goes before its noun and takes the noun's gender and number:"
              es: "El demostrativo va delante del sustantivo y toma su género y su número:"
