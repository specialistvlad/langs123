            level: C1
            text:
              uk: "Орудний має форму без прийменника й форму з прийменником між ні та займенником:"
              en: "The instrumental has a form with no preposition and a form with the preposition between ні and the pronoun:"
              es: "El instrumental tiene una forma sin preposición y otra con la preposición entre ні y el pronombre:"
              pt: "O instrumental tem uma forma sem preposição e outra com a preposição entre ні e o pronome:"
              fr: "L’instrumental a une forme sans préposition et une forme avec la préposition entre ні et le pronom :"
              de: "Der Instrumental hat eine Form ohne Präposition und eine Form mit der Präposition zwischen ні und dem Pronomen:"
              it: "Lo strumentale ha una forma senza preposizione e una con la preposizione tra ні e il pronome:"
              pl: "Narzędnik ma formę bez przyimka i formę z przyimkiem między ні a zaimkiem:"
              tr: "Araç hâlinin edatsız bir biçimi ve edatın ні ile zamirin arasına girdiği bir biçimi vardır:"
              id: "Instrumental punya bentuk tanpa preposisi dan bentuk dengan preposisi di antara ні dan pronomina:"
              vi: "Công cụ cách có một dạng không có giới từ và một dạng có giới từ đứng giữa ні và đại từ:"
            ex: { examples: [["Вона́ ", { target: ніки́м }, " не захо́плюється."], ["Вона́ ", { target: ні з ким }, " не посвари́лася."]] }
            tr: { en: { examples: ["She doesn't admire anybody.", "She didn't quarrel with anybody."] }, es: { examples: ["No admira a nadie.", "No se peleó con nadie."] }, pt: { examples: ["Ela não admira ninguém.", "Ela não brigou com ninguém."] }, fr: { examples: ["Elle n’admire personne.", "Elle ne s’est disputée avec personne."] }, de: { examples: ["Sie bewundert niemanden.", "Sie hat sich mit niemandem gestritten."] }, it: { examples: ["Non ammira nessuno.", "Non ha litigato con nessuno."] }, pl: { examples: ["Nikim się nie zachwyca.", "Z nikim się nie pokłóciła."] }, tr: { examples: ["Hiç kimseye hayran değil.", "Kimseyle kavga etmedi."] }, id: { examples: ["Dia tidak mengagumi siapa pun.", "Dia tidak bertengkar dengan siapa pun."] }, vi: { examples: ["Cô ấy không ngưỡng mộ ai cả.", "Cô ấy không cãi nhau với ai cả."] } }
          - type: rule
            level: C1
            text:
              uk: "Місцевий має паралельні форми: прийменник стоїть перед займенником або всередині:"
              en: "The locative has parallel forms: the preposition stands before the pronoun or inside it:"
              es: "El locativo tiene formas paralelas: la preposición va delante del pronombre o dentro de él:"
              pt: "O locativo tem formas paralelas: a preposição fica antes do pronome ou dentro dele:"
              fr: "Le locatif a des formes parallèles : la préposition se place devant le pronom ou à l’intérieur :"
              de: "Der Lokativ hat Parallelformen: Die Präposition steht vor dem Pronomen oder in seiner Mitte:"
              it: "Il locativo ha forme parallele: la preposizione sta prima del pronome o al suo interno:"
              pl: "Miejscownik ma formy równoległe: przyimek stoi przed zaimkiem albo w jego wnętrzu:"
              tr: "Bulunma hâlinin paralel biçimleri vardır: edat zamirin önüne ya da içine girer:"
              id: "Lokatif punya bentuk paralel: preposisi berada sebelum pronomina atau di dalamnya:"
              vi: "Vị trí cách có các dạng song song: giới từ đứng trước đại từ hoặc ở bên trong nó:"
            ex: ["Він ", { target: ні на чо́му }, " не наполяга́є."]
            tr: { en: "He doesn't insist on anything.", es: "No insiste en nada.", pt: "Ele não insiste em nada.", fr: "Il n’insiste sur rien.", de: "Er besteht auf nichts.", it: "Non insiste su niente.", pl: "Na niczym nie nalega.", tr: "Hiçbir şeyde ısrar etmiyor.", id: "Dia tidak ngotot soal apa pun.", vi: "Anh ấy không khăng khăng về điều gì cả." }
          - type: rule
            level: C1
            text:
              uk: [{ term: нія́кий }, " з прийменником розпадається, як ", { term: ніхто́ }, ":"]
              en: [{ term: "нія́кий" }, " splits with a preposition, like ", { term: "ніхто́" }, ":"]
              es: [{ term: "нія́кий" }, " con preposición se separa, como ", { term: "ніхто́" }, ":"]
              pt: [{ term: "нія́кий" }, " com preposição se separa, como ", { term: "ніхто́" }, ":"]
              fr: [{ term: "нія́кий" }, " se sépare avec une préposition, comme ", { term: "ніхто́" }, " :"]
              de: [{ term: "нія́кий" }, " zerfällt mit Präposition wie ", { term: "ніхто́" }, ":"]
              it: [{ term: "нія́кий" }, " con una preposizione si divide, come ", { term: "ніхто́" }, ":"]
              pl: [{ term: "нія́кий" }, " z przyimkiem rozpada się tak jak ", { term: "ніхто́" }, ":"]
              tr: [{ term: "нія́кий" }, " de edatla birlikte ", { term: "ніхто́" }, " gibi ikiye ayrılır:"]
              id: [{ term: "нія́кий" }, " dengan preposisi terpecah, seperti ", { term: "ніхто́" }, ":"]
              vi: [{ term: "нія́кий" }, " khi có giới từ thì tách đôi, như ", { term: "ніхто́" }, ":"]
            ex: [{ target: Ні в яко́му }, " ра́зі я не згоджу́ся."]
            tr: { en: "I won't agree under any circumstances.", es: "No estaré de acuerdo bajo ningún concepto.", pt: "De modo algum vou concordar.", fr: "Je n’accepterai en aucun cas.", de: "Auf keinen Fall werde ich zustimmen.", it: "In nessun caso accetterò.", pl: "W żadnym wypadku się nie zgodzę.", tr: "Hiçbir koşulda kabul etmeyeceğim.", id: "Dalam keadaan apa pun saya tidak akan setuju.", vi: "Trong bất cứ trường hợp nào tôi cũng không đồng ý." }

