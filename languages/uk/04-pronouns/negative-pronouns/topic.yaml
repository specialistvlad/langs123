        rows:
          - level: B1
            word: { term: ніде́ }
            ex: ["Я ", { target: ніде́ }, " не мо́жу знайти́ ключі́."]
            tr: { en: "I can't find my keys anywhere.", es: "No encuentro las llaves por ningún lado." }
          - level: B1
            word: { term: ніку́ди }
            ex: ["Сього́дні ми ", { target: ніку́ди }, " не йдемо́."]
            tr: { en: "We're not going anywhere today.", es: "Hoy no vamos a ningún sitio." }
          - level: B1
            word: { term: нія́кий }
            ex: ["У ме́не нема́є ", { target: нія́кої }, " іде́ї."]
            tr: { en: "I have no idea at all.", es: "No tengo ni idea." }
          - level: B1
            word: { term: нічи́й }
            ex: ["Цей стіл ", { target: нічи́й }, "."]
            tr: { en: "This table is nobody's.", es: "Esta mesa no es de nadie." }

  - title: { uk: З прийменником, en: With a preposition, es: Con una preposición }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Прийменник стоїть між ", { term: ні }, " і займенником, і всі три слова пишемо окремо:"]
              en: ["The preposition goes between ", { term: ні }, " and the pronoun, and the three words are written apart:"]
