            tr: { en: { examples: ["I didn't talk to anybody.", "We're not thinking about anything."] }, es: { examples: ["No hablé con nadie.", "No pensamos en nada."] } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
