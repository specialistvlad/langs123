sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Слово з ", { term: ні- }, " не скасовує ", { term: не }, ": дієслово завжди має ", { term: не }, ":"]
              en: ["A ", { term: ні- }, " word never replaces ", { term: не }, ": the verb always keeps ", { term: не }, ":"]
              es: ["Una palabra en ", { term: ні- }, " nunca sustituye a ", { term: не }, ": el verbo siempre conserva ", { term: не }, ":"]
            ex: ["Ти ", { target: нічи́м }, " не ціка́вишся."]
            tr: { en: "You're not interested in anything.", es: "No te interesa nada." }
          - type: rule
            level: B1
            text:
              uk: "В одному реченні може бути кілька слів із ні-, а не — одне:"
              en: "One sentence can hold several ні- words and still a single не:"
              es: "Una frase puede tener varias palabras en ні- y un solo не:"
            ex: [{ target: Ніхто́ ніко́ли }, " не ба́чив тако́го."]
            tr: { en: "Nobody has ever seen anything like it.", es: "Nadie ha visto nunca nada igual." }

