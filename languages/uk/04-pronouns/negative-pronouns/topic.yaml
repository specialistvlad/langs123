          - { level: B1, wrong: Я з ніки́м не говори́в., right: ["Я ", { target: ні з ким }, " не говори́в."], rule: { uk: ["прийменник — між ", { term: ні }, " і займенником"], en: ["the preposition goes between ", { term: ні }, " and the pronoun"], es: ["la preposición va entre ", { term: ні }, " y el pronombre"] } }
          - { level: B1, speakers: [en, es], wrong: Ніхто́ прийшо́в., right: [{ target: Ніхто́ не }, " прийшо́в."], rule: { en: ["a ", { term: ні- }, " word still needs ", { term: не }, ": “nobody came” is ", { term: ніхто́ не прийшо́в }], es: ["aunque ", { term: ніхто́ }, " vaya delante, el verbo lleva ", { term: не }, ", no como «nadie vino»"] } }
          - { level: B1, speakers: [en], wrong: Я нічо́го зна́ю., right: ["Я ", { target: нічо́го не }, " зна́ю."], rule: { en: ["“I know nothing” keeps ", { term: не }, " before the verb"] } }
