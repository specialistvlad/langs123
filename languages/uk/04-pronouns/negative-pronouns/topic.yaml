      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: who, label: { term: ніхто́ }, features: { polarity: neg } }
          - { key: what, label: { term: ніщо́ }, features: { polarity: neg } }
        rows:
          - { level: B1, features: { case: nom }, case: { uk: Називний, en: Nominative, es: Nominativo }, who: ніхто́, what: ніщо́ }
          - { level: B1, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, who: нікого́, what: нічо́го }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, who: нікому́, what: нічо́му }
          - { level: B1, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, who: нікого́, what: ніщо́ }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, who: ніки́м, what: нічи́м }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Додаток при дієслові з ", { term: не }, " стоїть у родовому: ", { term: нічо́го }, ":"]
              en: ["The object of a verb with ", { term: не }, " is in the genitive: ", { term: нічо́го }, ":"]
              es: ["El complemento de un verbo con ", { term: не }, " va en genitivo: ", { term: нічо́го }, ":"]
            ex: ["Я ", { target: нічо́го }, " не їв."]
            tr: { en: "I haven't eaten anything.", es: "No he comido nada." }
          - type: rule
            level: B1
            text:
              uk: ["З прийменником ", { term: ніхто́ }, " і ", { term: ніщо́ }, " розпадаються, і прийменник стає між частинами:"]
              en: ["With a preposition, ", { term: ніхто́ }, " and ", { term: ніщо́ }, " split, and the preposition goes between the parts:"]
              es: ["Con preposición, ", { term: ніхто́ }, " y ", { term: ніщо́ }, " se separan, y la preposición va entre las partes:"]
            ex: { examples: [["Він ", { target: ні на що }, " не ска́ржиться."], ["Я ", { target: ні з ким }, " не говори́в."]] }
            tr: { en: { examples: ["He doesn't complain about anything.", "I didn't talk to anyone."] }, es: { examples: ["No se queja de nada.", "No hablé con nadie."] } }
          - type: rule
            level: B1
            text:
              uk: [{ term: ніщо́ }, " буває підметом:"]
              en: [{ term: ніщо́ }, " can be the subject:"]
              es: [{ term: ніщо́ }, " puede ser sujeto:"]
            ex: [{ target: Ніщо́ }, " не зміни́лося."]
            tr: { en: "Nothing has changed.", es: "No ha cambiado nada." }

  - title: { uk: "Інші слова з ні-", en: "Other ні- words", es: "Otras palabras en ні-" }
    role: own
    content:
      - type: usage
        columns:
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
