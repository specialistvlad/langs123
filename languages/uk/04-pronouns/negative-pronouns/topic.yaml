          rule: { uk: { alternatives: [{ term: ніхто́ }, { term: нікого́ }, { term: нікому́ }] }, en: { alternatives: [{ term: ніхто́ }, { term: нікого́ }, { term: нікому́ }] }, es: { alternatives: [{ term: ніхто́ }, { term: нікого́ }, { term: нікому́ }] } }
          ex: ["Я ", { target: нікого́ }, " тут не зна́ю."]
          tr: { en: "I don't know anybody here.", es: "Aquí no conozco a nadie." }
        - level: B1
          point: { uk: Річ, en: Thing, es: Cosa }
          rule: { uk: { alternatives: [{ term: ніщо́ }, { term: нічо́го }, { term: нічи́м }] }, en: { alternatives: [{ term: ніщо́ }, { term: нічо́го }, { term: нічи́м }] }, es: { alternatives: [{ term: ніщо́ }, { term: нічо́го }, { term: нічи́м }] } }
          ex: ["Вона́ ", { target: нічо́го }, " не зрозумі́ла."]
          tr: { en: "She didn't understand anything.", es: "No entendió nada." }
        - level: B1
          point: { uk: "Місце, час", en: "Place, time", es: "Lugar, tiempo" }
          rule: { uk: { alternatives: [{ term: ніде́ }, { term: ніку́ди }, { term: ніко́ли }] }, en: { alternatives: [{ term: ніде́ }, { term: ніку́ди }, { term: ніко́ли }] }, es: { alternatives: [{ term: ніде́ }, { term: ніку́ди }, { term: ніко́ли }] } }
          ex: ["Ми ", { target: ніко́ли }, " не були́ в Ри́мі."]
          tr: { en: "We've never been to Rome.", es: "Nunca hemos estado en Roma." }
        - level: B1
          point: { uk: З прийменником, en: With a preposition, es: Con preposición }
          rule: { uk: [{ term: ні з ким }, ": три слова окремо"], en: [{ term: ні з ким }, ": three separate words"], es: [{ term: ні з ким }, ": tres palabras separadas"] }
          ex: ["Він ", { target: ні з ким }, " не гово́рить."]
