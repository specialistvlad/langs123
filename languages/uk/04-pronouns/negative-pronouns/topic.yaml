    es: ["Las palabras con ", { term: ні- }, ", como ", { term: ніхто́ }, ", ", { term: нічо́го }, ", ", { term: ніде́ }, " y ", { term: ніко́ли }, ", siempre llevan ", { term: не }, " delante del verbo."]
  rule:
    uk: ["Речення з ", { term: ні- }, " має два заперечення:"]
    en: ["A sentence with a ", { term: ні- }, " word has two negatives:"]
    es: ["Una frase con una palabra en ", { term: ні- }, " tiene dos negaciones:"]
  ex: { examples: [[{ target: Ніхто́ не }, " прийшо́в."], ["Я ", { target: нічо́го не }, " ба́чу."]] }

cheatsheet:
