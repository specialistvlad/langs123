summary:
  lead:
    uk: ["Присвійні займенники ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, ", ", { term: ї́хній }, " узгоджуються з іменником, а ", { term: його́ }, " і ", { term: її́ }, " не змінюються."]
    en: ["The possessives ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, " and ", { term: ї́хній }, " agree with the noun, while ", { term: його́ }, " and ", { term: її́ }, " never change."]
    es: ["Los posesivos ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, " y ", { term: ї́хній }, " concuerdan con el sustantivo, mientras que ", { term: його́ }, " y ", { term: її́ }, " no cambian."]
    pt: ["Os possessivos ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " e ", { term: "ї́хній" }, " concordam com o substantivo, enquanto ", { term: "його́" }, " e ", { term: "її́" }, " não mudam."]
    fr: ["Les possessifs ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " et ", { term: "ї́хній" }, " s’accordent avec le nom, alors que ", { term: "його́" }, " et ", { term: "її́" }, " ne changent pas."]
    de: ["Die Possessivpronomen ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " und ", { term: "ї́хній" }, " richten sich nach dem Nomen, ", { term: "його́" }, " und ", { term: "її́" }, " dagegen ändern sich nie."]
    it: ["I possessivi ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " e ", { term: "ї́хній" }, " concordano con il sostantivo, mentre ", { term: "його́" }, " e ", { term: "її́" }, " non cambiano."]
    pl: ["Zaimki dzierżawcze ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " i ", { term: "ї́хній" }, " zgadzają się z rzeczownikiem, a ", { term: "його́" }, " i ", { term: "її́" }, " się nie zmieniają."]
    tr: ["İyelik zamirleri ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " ve ", { term: "ї́хній" }, " isimle uyum sağlar; ", { term: "його́" }, " ve ", { term: "її́" }, " ise değişmez."]
    id: ["Kata ganti kepemilikan ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " dan ", { term: "ї́хній" }, " menyesuaikan diri dengan kata benda, sedangkan ", { term: "його́" }, " dan ", { term: "її́" }, " tidak berubah."]
    vi: ["Các đại từ sở hữu ", { term: "мій" }, ", ", { term: "твій" }, ", ", { term: "наш" }, ", ", { term: "ваш" }, " và ", { term: "ї́хній" }, " hợp với danh từ, còn ", { term: "його́" }, " và ", { term: "її́" }, " không đổi."]
  rule:
    uk: "Присвійний займенник має рід, число й відмінок того, що належить, а не власника:"
    en: "A possessive takes the gender, number and case of the thing owned, not of the owner:"
    es: "El posesivo toma el género, el número y el caso de lo poseído, no del poseedor:"
    pt: "O possessivo toma o gênero, o número e o caso da coisa possuída, não os do possuidor:"
    fr: "Le possessif prend le genre, le nombre et le cas de la chose possédée, et non ceux du possesseur :"
    de: "Das Possessivpronomen übernimmt Genus, Numerus und Kasus des Besitzgegenstands, nicht des Besitzers:"
    it: "Il possessivo prende genere, numero e caso della cosa posseduta, non del possessore:"
    pl: "Zaimek dzierżawczy przyjmuje rodzaj, liczbę i przypadek rzeczy posiadanej, a nie właściciela:"
    tr: "İyelik zamiri, sahibin değil, sahip olunan şeyin cinsini, sayısını ve hâlini alır:"
    id: "Kata ganti kepemilikan mengikuti gender, jumlah, dan kasus benda yang dimiliki, bukan pemiliknya:"
    vi: "Đại từ sở hữu theo giống, số và cách của vật được sở hữu, không theo người sở hữu:"
  ex: { examples: [["Це ", { target: моя́ }, " сестра́."], ["Це ", { target: мій }, " брат."]] }

