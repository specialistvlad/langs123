id: uk.pronouns.possessives
lang: uk
kind: grammar
tags: [pronouns, possessives, reflexive, свій, себе]
concepts: [possession]
related: [uk.pronouns.personal-pronouns, uk.adjectives-adverbs.adjective-declension, uk.pronouns.ty-vy]
status: { uk: draft, en: draft, es: draft }
translated: { en: "13204d 31ba9a 51c2b1 df94ea 42cf6c d76111 d7af14", es: "13204d 31ba9a 51c2b1 df94ea 42cf6c d76111 d7af14" }

title: { uk: "Присвійні займенники, свій і себе", en: "Possessives, свій and себе", es: "Los posesivos, свій y себе" }
summary:
  lead:
    uk: ["Присвійні займенники ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, ", ", { term: ї́хній }, " узгоджуються з іменником, а ", { term: його́ }, " і ", { term: її́ }, " не змінюються."]
    en: ["The possessives ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, " and ", { term: ї́хній }, " agree with the noun, while ", { term: його́ }, " and ", { term: її́ }, " never change."]
    es: ["Los posesivos ", { term: мій }, ", ", { term: твій }, ", ", { term: наш }, ", ", { term: ваш }, " y ", { term: ї́хній }, " concuerdan con el sustantivo, mientras que ", { term: його́ }, " y ", { term: її́ }, " no cambian."]
  rule:
    uk: "Присвійний займенник має рід, число й відмінок того, що належить, а не власника:"
    en: "A possessive takes the gender, number and case of the thing owned, not of the owner:"
    es: "El posesivo toma el género, el número y el caso de lo poseído, no del poseedor:"
  ex: { examples: [["Це ", { target: моя́ }, " сестра́."], ["Це ", { target: мій }, " брат."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Мій, en: My, es: Mi }
          rule: { uk: { alternatives: [{ term: мій }, { term: моя́ }, { term: моє́ }, { term: мої́ }] }, en: { alternatives: [{ term: мій }, { term: моя́ }, { term: моє́ }, { term: мої́ }] }, es: { alternatives: [{ term: мій }, { term: моя́ }, { term: моє́ }, { term: мої́ }] } }
          ex: ["Це ", { target: моя́ }, " кімна́та."]
          tr: { en: "This is my room.", es: "Es mi habitación." }
        - level: A1
          point: { uk: Наш, en: Our, es: Nuestro }
          rule: { uk: { alternatives: [{ term: наш }, { term: на́ша }, { term: на́ше }, { term: на́ші }] }, en: { alternatives: [{ term: наш }, { term: на́ша }, { term: на́ше }, { term: на́ші }] }, es: { alternatives: [{ term: наш }, { term: на́ша }, { term: на́ше }, { term: на́ші }] } }
          ex: ["Це ", { target: на́ше }, " мі́сто."]
          tr: { en: "This is our town.", es: "Es nuestra ciudad." }
        - level: A1
          point: { uk: "Його, її", en: "His, her", es: "Su (de él, de ella)" }
          rule: { uk: "не змінюються", en: "never change", es: "no cambian" }
          ex: ["Це ", { target: її́ }, " брат і ", { target: її́ }, " сестра́."]
          tr: { en: "This is her brother and her sister.", es: "Son su hermano y su hermana." }
        - level: A1
          point: { uk: Їхній, en: Their, es: Su (de ellos) }
          rule: { uk: { alternatives: [{ term: ї́хній }, { term: ї́хня }, { term: ї́хнє }, { term: ї́хні }] }, en: { alternatives: [{ term: ї́хній }, { term: ї́хня }, { term: ї́хнє }, { term: ї́хні }] }, es: { alternatives: [{ term: ї́хній }, { term: ї́хня }, { term: ї́хнє }, { term: ї́хні }] } }
          ex: ["Це ", { target: ї́хня }, " кварти́ра."]
          tr: { en: "This is their flat.", es: "Es su apartamento." }
        - level: A2
          point: { uk: Відмінки, en: Cases, es: Casos }
          rule: { uk: "як у прикметника", en: "like an adjective", es: "como un adjetivo" }
          ex: ["Я гуля́ю з ", { target: мої́м }, " соба́кою."]
          tr: { en: "I'm walking my dog.", es: "Paseo a mi perro." }
        - level: B1
          point: { term: свій }
          rule: { uk: "власник — підмет речення", en: "the owner is the subject", es: "el poseedor es el sujeto" }
          ex: ["Він ба́чить ", { target: свого́ }, " бра́та."]
          tr: { en: "He can see his (own) brother.", es: "Ve a su (propio) hermano." }
        - level: B1
          point: { term: себе́ }
          rule: { uk: { alternatives: [{ term: себе́ }, { term: собі́ }, { term: собо́ю }] }, en: { alternatives: [{ term: себе́ }, { term: собі́ }, { term: собо́ю }] }, es: { alternatives: [{ term: себе́ }, { term: собі́ }, { term: собо́ю }] } }
          ex: ["Розкажі́ть про ", { target: се́бе }, "."]
          tr: { en: "Tell us about yourself.", es: "Háblenos de usted." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: paradigm
        columns:
          - { key: masc, label: { uk: Чоловічий рід, en: Masculine, es: Masculino }, features: { gender: masc, number: sg } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino }, features: { gender: fem, number: sg } }
          - { key: neut, label: { uk: Середній рід, en: Neuter, es: Neutro }, features: { gender: neut, number: sg } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural }, features: { number: pl } }
        rows:
          - { level: A1, masc: мій, fem: моя́, neut: моє́, pl: мої́ }
          - { level: A1, masc: твій, fem: твоя́, neut: твоє́, pl: твої́ }
          - { level: A1, masc: наш, fem: на́ша, neut: на́ше, pl: на́ші }
          - { level: A1, masc: ваш, fem: ва́ша, neut: ва́ше, pl: ва́ші }
          - { level: A1, masc: ї́хній, fem: ї́хня, neut: ї́хнє, pl: ї́хні }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Займенник узгоджується з тим, що належить:"
              en: "The possessive agrees with the thing owned:"
              es: "El posesivo concuerda con lo poseído:"
            ex: { examples: [["Де ", { target: твій }, " телефо́н?"], ["Де ", { target: твої́ }, " ключі́?"]] }
            tr: { en: { examples: ["Where's your phone?", "Where are your keys?"] }, es: { examples: ["¿Dónde está tu teléfono?", "¿Dónde están tus llaves?"] } }
          - type: rule
            level: A1
            text:
              uk: [{ term: його́ }, " і ", { term: її́ }, " не змінюються: рід бере власник, а не річ:"]
              en: [{ term: його́ }, " (his) and ", { term: її́ }, " (her) never change: the owner chooses, not the thing:"]
              es: [{ term: його́ }, " (de él) y ", { term: її́ }, " (de ella) no cambian: cuenta el poseedor, no la cosa:"]
            ex: ["Це ", { target: його́ }, " ма́ма і ", { target: його́ }, " та́то."]
            tr: { en: "These are his mum and dad.", es: "Son su madre y su padre." }
          - type: note
            level: A1
            text:
              uk: ["До однієї людини на «Ви» кажемо ", { term: Ваш }, ": ", { link: Ти і Ви, to: uk.pronouns.ty-vy }, "."]
              en: ["Speaking to one person as «Ви», the possessive is ", { term: Ваш }, ": ", { link: Ти and Ви, to: uk.pronouns.ty-vy }, "."]
              es: ["Al hablar de «Ви» a una persona, el posesivo es ", { term: Ваш }, ": ", { link: Ти y Ви, to: uk.pronouns.ty-vy }, "."]

  - title: { uk: "Форма: відмінки", en: "Form: the cases", es: "Forma: los casos" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: mn, label: { uk: "Чоловічий і середній рід", en: "Masculine and neuter", es: "Masculino y neutro" } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural } }
        rows:
          - { level: A2, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, mn: мого́, fem: моє́ї, pl: мої́х }
          - { level: A2, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, mn: моє́му, fem: мої́й, pl: мої́м }
          - { level: A2, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, mn: { alternatives: [мій, мого́, моє́] }, fem: мою́, pl: { alternatives: [мої́, мої́х] } }
          - { level: A2, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, mn: мої́м, fem: моє́ю, pl: мої́ми }
          - { level: A2, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, mn: на моє́му, fem: на мої́й, pl: на мої́х }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: [{ term: твій }, " відмінюється як ", { term: мій }, "; ", { term: наш }, " і ", { term: ваш }, " — як ", { term: нови́й }, ", ", { term: ї́хній }, " — як ", { term: си́ній }, ":"]
              en: [{ term: твій }, " declines like ", { term: мій }, "; ", { term: наш }, " and ", { term: ваш }, " like ", { term: нови́й }, ", and ", { term: ї́хній }, " like ", { term: си́ній }, ":"]
              es: [{ term: твій }, " se declina como ", { term: мій }, "; ", { term: наш }, " y ", { term: ваш }, ", como ", { term: нови́й }, ", y ", { term: ї́хній }, ", como ", { term: си́ній }, ":"]
            ex: { examples: [["Ми живемо́ в ", { target: на́шому }, " буди́нку."], ["Я зна́ю ", { target: ї́хнього }, " си́на."]] }
            tr: { en: { examples: ["We live in our house.", "I know their son."] }, es: { examples: ["Vivimos en nuestra casa.", "Conozco a su hijo."] } }

  - title: { uk: "Свій", en: "Свій: one's own", es: "Свій: lo propio" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: свій }, " означає річ, що належить підметові речення:"]
              en: [{ term: свій }, " marks something that belongs to the subject of the sentence:"]
              es: [{ term: свій }, " indica algo que pertenece al sujeto de la oración:"]
            ex: ["Оле́на лю́бить ", { target: свою́ }, " робо́ту."]
            tr: { en: "Olena loves her job.", es: "A Olena le gusta su trabajo." }
          - type: rule
            level: B1
            text:
              uk: ["У третій особі ", { term: свій }, " і ", { term: його́ }, " розрізняють власника:"]
              en: ["In the third person ", { term: свій }, " and ", { term: його́ }, " tell the owners apart:"]
              es: ["En tercera persona, ", { term: свій }, " y ", { term: його́ }, " distinguen al poseedor:"]
            ex: { contrast: [["Андрі́й чита́є ", { target: свою́ }, " кни́жку"], ["Андрі́й чита́є ", { target: його́ }, " кни́жку"]] }
            tr: { en: { contrast: ["Andrii is reading his own book", "Andrii is reading his (another man's) book"] }, es: { contrast: ["Andrii lee su propio libro", "Andrii lee el libro de él (de otro)"] } }
          - type: rule
            level: B1
            text:
              uk: ["З ", { term: я }, ", ", { term: ти }, ", ", { term: ми }, ", ", { term: ви }, " можна сказати і ", { term: свій }, ", і ", { term: мій }, ":"]
              en: ["With ", { term: я }, ", ", { term: ти }, ", ", { term: ми }, " and ", { term: ви }, ", both ", { term: свій }, " and ", { term: мій }, " are possible:"]
              es: ["Con ", { term: я }, ", ", { term: ти }, ", ", { term: ми }, " y ", { term: ви }, " valen tanto ", { term: свій }, " como ", { term: мій }, ":"]
            ex: { examples: [["Я забу́в ", { target: свій }, " телефо́н."], ["Я забу́в ", { target: мій }, " телефо́н."]] }
            tr: { en: { examples: ["I forgot my phone.", "I forgot my phone."] }, es: { examples: ["Olvidé mi teléfono.", "Olvidé mi teléfono."] } }

  - title: { uk: "Себе", en: "Себе: oneself", es: "Себе: uno mismo" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
        rows:
          - { level: B1, features: { case: acc }, case: { uk: "Родовий і знахідний", en: "Genitive and accusative", es: "Genitivo y acusativo" }, form: себе́ }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, form: собі́ }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, form: собо́ю }
          - { level: B1, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, form: на собі́ }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: себе́ }, " називає самого підмета й не має називного відмінка:"]
              en: [{ term: себе́ }, " refers back to the subject and has no nominative:"]
              es: [{ term: себе́ }, " remite al sujeto y no tiene nominativo:"]
            ex: { examples: [["Він купи́в ", { target: собі́ }, " маши́ну."], ["Візьми́ з ", { target: собо́ю }, " парасо́льку."]] }
            tr: { en: { examples: ["He bought himself a car.", "Take an umbrella with you."] }, es: { examples: ["Se compró un auto.", "Llévate un paraguas."] } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Це моя́ брат., right: ["Це ", { target: мій }, " брат."], rule: { uk: ["рід бере річ чи особа, що належить: ", { term: брат }, " — чоловічий рід"], en: ["the gender comes from what is owned: ", { term: брат }, " is masculine"], es: ["el género viene de lo poseído: ", { term: брат }, " es masculino"] } }
          - { level: A1, wrong: Це на́ша вікно́., right: ["Це ", { target: на́ше }, " вікно́."], rule: { uk: [{ term: вікно́ }, " — середній рід: ", { term: на́ше }], en: [{ term: вікно́ }, " is neuter: ", { term: на́ше }], es: [{ term: вікно́ }, " es neutro: ", { term: на́ше }] } }
          - { level: A2, wrong: Я говорю́ з моя́ ма́мою., right: ["Я говорю́ з ", { target: моє́ю }, " ма́мою."], rule: { uk: ["займенник у тому ж відмінку, що й іменник: ", { term: моє́ю }], en: ["the possessive takes the noun's case: ", { term: моє́ю }], es: ["el posesivo va en el caso del sustantivo: ", { term: моє́ю }] } }
          - { level: B1, wrong: Він лю́бить його́ ма́му., right: ["Він лю́бить ", { target: свою́ }, " ма́му."], rule: { uk: ["власник — підмет: ", { term: свій }], en: ["the owner is the subject: ", { term: свій }], es: ["el poseedor es el sujeto: ", { term: свій }] } }
          - { level: A1, speakers: [es], wrong: "Па́не, це його́ па́спорт?", right: ["Па́не, це ", { target: Ваш }, " па́спорт?"], rule: { es: ["«su» de usted es ", { term: Ваш }, "; ", { term: його́ }, " es solo «de él»"] } }
