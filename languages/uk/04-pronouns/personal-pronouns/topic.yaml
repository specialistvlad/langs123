            text:
              uk: "Родовий і знахідний відмінки особових займенників мають ту саму форму:"
              en: "Personal pronouns have one form for the genitive and the accusative:"
              es: "Los pronombres personales tienen una sola forma para el genitivo y el acusativo:"
              pt: "Os pronomes pessoais têm uma só forma para o genitivo e o acusativo:"
              fr: "Les pronoms personnels ont une seule forme pour le génitif et l’accusatif :"
              de: "Die Personalpronomen haben für Genitiv und Akkusativ nur eine Form:"
              it: "I pronomi personali hanno una sola forma per il genitivo e l'accusativo:"
              pl: "Zaimki osobowe mają jedną formę dla dopełniacza i biernika:"
              tr: "Kişi zamirlerinde tamlayan ve belirtme hâli aynı biçimdedir:"
              id: "Kata ganti orang memiliki satu bentuk untuk genitif dan akusatif:"
              vi: "Đại từ nhân xưng có một dạng chung cho sinh cách và đối cách:"
            ex: { examples: [["Ти ", { target: мене́ }, " чу́єш?"], ["У ", { target: ме́не }, " є брат."]] }
            tr: { en: { examples: ["Can you hear me?", "I have a brother."] }, es: { examples: ["¿Me oyes?", "Tengo un hermano."] }, pt: { examples: ["Você me ouve?", "Eu tenho um irmão."] }, fr: { examples: ["Tu m’entends ?", "J’ai un frère."] }, de: { examples: ["Hörst du mich?", "Ich habe einen Bruder."] }, it: { examples: ["Mi senti?", "Ho un fratello."] }, pl: { examples: ["Słyszysz mnie?", "Mam brata."] }, tr: { examples: ["Beni duyuyor musun?", "Bir erkek kardeşim var."] }, id: { examples: ["Kamu dengar saya?", "Saya punya saudara laki-laki."] }, vi: { examples: ["Bạn có nghe thấy tôi không?", "Tôi có một anh trai."] } }
          - type: note
            level: A1
            text:
              uk: ["Після прийменника наголос переходить на перший склад: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
              en: ["After a preposition the stress moves to the first syllable: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
              es: ["Tras una preposición, el acento pasa a la primera sílaba: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
              pt: ["Depois de uma preposição, o acento passa para a primeira sílaba: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              fr: ["Après une préposition, l’accent passe sur la première syllabe : ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              de: ["Nach einer Präposition rückt die Betonung auf die erste Silbe: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              it: ["Dopo una preposizione l'accento passa alla prima sillaba: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              pl: ["Po przyimku akcent przesuwa się na pierwszą sylabę: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              tr: ["Edattan sonra vurgu ilk heceye kayar: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              id: ["Setelah preposisi, tekanan berpindah ke suku kata pertama: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
              vi: ["Sau giới từ, trọng âm chuyển sang âm tiết đầu: ", { mapping: [{ term: "мене́" }, { term: "у ме́не" }] }, ", ", { mapping: [{ term: "тебе́" }, { term: "до те́бе" }] }, "."]
          - type: rule
            level: A2
            text:
              uk: "Давальний називає того, кому щось дають чи кажуть:"
              en: "The dative names the person something is given or said to:"
              es: "El dativo nombra a la persona a quien se da o se dice algo:"
              pt: "O dativo nomeia a pessoa a quem se dá ou se diz algo:"
              fr: "Le datif désigne la personne à qui l’on donne ou dit quelque chose :"
              de: "Der Dativ nennt die Person, der man etwas gibt oder sagt:"
              it: "Il dativo indica la persona a cui si dà o si dice qualcosa:"
              pl: "Celownik wskazuje osobę, której coś się daje lub mówi:"
              tr: "Yönelme hâli, kendisine bir şey verilen ya da söylenen kişiyi gösterir:"
              id: "Datif menyebut orang yang diberi sesuatu atau yang diberi tahu:"
              vi: "Tặng cách chỉ người được cho hay được nói điều gì:"
            ex: ["Я ", { target: йому́ }, " подзвоню́ за́втра."]
            tr: { en: "I'll ring him tomorrow.", es: "Lo llamo mañana.", pt: "Vou ligar para ele amanhã.", fr: "Je l’appelle demain.", de: "Ich rufe ihn morgen an.", it: "Lo chiamo domani.", pl: "Zadzwonię do niego jutro.", tr: "Yarın ona telefon edeceğim.", id: "Besok saya akan meneleponnya.", vi: "Ngày mai tôi sẽ gọi cho anh ấy." }

