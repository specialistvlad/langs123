title: { uk: Особові займенники, en: Personal Pronouns, es: Los pronombres personales }
summary:
  lead:
    uk: ["Особові займенники ", { term: я }, ", ", { term: ти }, ", ", { term: він }, ", ", { term: вона́ }, ", ", { term: воно́ }, ", ", { term: ми }, ", ", { term: ви }, ", ", { term: вони́ }, " змінюються за відмінками: ", { term: мене́ }, ", ", { term: мені́ }, ", ", { term: мно́ю }, "."]
    en: ["The personal pronouns ", { term: я }, ", ", { term: ти }, ", ", { term: він }, ", ", { term: вона́ }, ", ", { term: воно́ }, ", ", { term: ми }, ", ", { term: ви }, ", ", { term: вони́ }, " change for case: ", { term: мене́ }, ", ", { term: мені́ }, ", ", { term: мно́ю }, "."]
    es: ["Los pronombres personales ", { term: я }, ", ", { term: ти }, ", ", { term: він }, ", ", { term: вона́ }, ", ", { term: воно́ }, ", ", { term: ми }, ", ", { term: ви }, ", ", { term: вони́ }, " cambian de caso: ", { term: мене́ }, ", ", { term: мені́ }, ", ", { term: мно́ю }, "."]
  rule:
    uk: ["Після прийменника займенники третьої особи мають ", { term: н- }, ":"]
    en: ["After a preposition the third-person pronouns take ", { term: н- }, ":"]
    es: ["Tras una preposición, los pronombres de tercera persona llevan ", { term: н- }, ":"]
  ex: { examples: [["Я ", { target: його́ }, " зна́ю."], ["Я ї́ду ", { target: до ньо́го }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Підмет, en: Subject, es: Sujeto }
          rule: { uk: { alternatives: [{ term: я }, { term: ти }, { term: він }, { term: вона́ }, { term: воно́ }] }, en: { alternatives: [{ term: я }, { term: ти }, { term: він }, { term: вона́ }, { term: воно́ }] }, es: { alternatives: [{ term: я }, { term: ти }, { term: він }, { term: вона́ }, { term: воно́ }] } }
          ex: [{ target: Вона́ }, " студе́нтка."]
          tr: { en: "She's a student.", es: "Es estudiante." }
        - level: A1
          point: { uk: Знахідний, en: Accusative, es: Acusativo }
          rule: { uk: { alternatives: [{ term: мене́ }, { term: тебе́ }, { term: нас }, { term: вас }] }, en: { alternatives: [{ term: мене́ }, { term: тебе́ }, { term: нас }, { term: вас }] }, es: { alternatives: [{ term: мене́ }, { term: тебе́ }, { term: нас }, { term: вас }] } }
          ex: [{ target: Мене́ }, " зва́ти Оле́г."]
          tr: { en: "My name is Oleh.", es: "Me llamo Oleh." }
        - level: A1
          point: { uk: Давальний, en: Dative, es: Dativo }
          rule: { uk: { alternatives: [{ term: мені́ }, { term: тобі́ }, { term: нам }, { term: вам }] }, en: { alternatives: [{ term: мені́ }, { term: тобі́ }, { term: нам }, { term: вам }] }, es: { alternatives: [{ term: мені́ }, { term: тобі́ }, { term: нам }, { term: вам }] } }
          ex: ["Да́йте ", { target: мені́ }, ", будь ла́ска, ка́ву."]
          tr: { en: "A coffee for me, please.", es: "Un café para mí, por favor." }
        - level: A2
          point: { uk: Третя особа, en: Third person, es: Tercera persona }
          rule: { uk: { alternatives: [{ term: його́ }, { term: її́ }, { term: їх }] }, en: { alternatives: [{ term: його́ }, { term: її́ }, { term: їх }] }, es: { alternatives: [{ term: його́ }, { term: її́ }, { term: їх }] } }
          ex: ["Я ", { target: її́ }, " ча́сто ба́чу."]
          tr: { en: "I often see her.", es: "La veo a menudo." }
        - level: A2
          point: { uk: Орудний, en: Instrumental, es: Instrumental }
          rule: { uk: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: на́ми }, { term: ва́ми }] }, en: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: на́ми }, { term: ва́ми }] }, es: { alternatives: [{ term: мно́ю }, { term: тобо́ю }, { term: на́ми }, { term: ва́ми }] } }
          ex: ["Ході́ ", { target: з на́ми }, "!"]
          tr: { en: "Come with us!", es: "¡Ven con nosotros!" }
        - level: A2
          point: { uk: Після прийменника, en: After a preposition, es: Tras preposición }
          rule: { uk: { alternatives: [{ term: до ньо́го }, { term: з не́ю }, { term: у них }] }, en: { alternatives: [{ term: до ньо́го }, { term: з не́ю }, { term: у них }] }, es: { alternatives: [{ term: до ньо́го }, { term: з не́ю }, { term: у них }] } }
          ex: ["Я говорю́ ", { target: з не́ю }, "."]
          tr: { en: "I'm talking to her.", es: "Hablo con ella." }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule: { uk: [{ term: він }, ", ", { term: вона́ }, ", ", { term: воно́ }, " — за родом іменника, і для речей теж"], en: [{ term: він }, ", ", { term: вона́ }, " and ", { term: воно́ }, " follow the noun's gender, for things too"], es: [{ term: він }, ", ", { term: вона́ }, " y ", { term: воно́ }, " siguen el género del sustantivo, también con cosas"] }
          ex: { exchange: ["Де мій стіл?", [{ target: Він }, " тут."]] }
          tr: { en: { exchange: ["Where's my table?", "It's here."] }, es: { exchange: ["¿Dónde está mi mesa?", "Está aquí."] } }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: paradigm
        columns:
          - { key: person, label: { uk: Особа, en: Person, es: Persona } }
          - { key: sg, label: { uk: Однина, en: Singular, es: Singular }, features: { number: sg } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural }, features: { number: pl } }
        rows:
          - { level: A1, features: { person: 1 }, person: { uk: "1-ша", en: "1st", es: "1.ª" }, sg: я, pl: ми }
          - { level: A1, features: { person: 2 }, person: { uk: "2-га", en: "2nd", es: "2.ª" }, sg: ти, pl: ви }
          - { level: A1, features: { person: 3 }, person: { uk: "3-тя", en: "3rd", es: "3.ª" }, sg: { alternatives: [він, вона́, воно́] }, pl: вони́ }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Для речей теж кажемо ", { term: він }, ", ", { term: вона́ }, " чи ", { term: воно́ }, " — за родом іменника:"]
              en: ["Things are also ", { term: він }, ", ", { term: вона́ }, " or ", { term: воно́ }, ", after the gender of the noun:"]
              es: ["Las cosas también son ", { term: він }, ", ", { term: вона́ }, " o ", { term: воно́ }, ", según el género del sustantivo:"]
            ex: ["Це моя́ кни́жка. ", { target: Вона́ }, " ціка́ва."]
            tr: { en: "This is my book. It's interesting.", es: "Es mi libro. Es interesante." }
          - type: rule
            level: A1
            text:
              uk: "Займенник-підмет можна опустити, бо закінчення дієслова вже називає особу; його вживають, щоб виділити особу, і в нейтральних реченнях:"
              en: "The subject pronoun can be left out, because the verb ending already shows the person; it is used to stress the person and in neutral sentences:"
              es: "El pronombre sujeto puede omitirse, porque la terminación del verbo ya indica la persona; se usa para destacar la persona y en frases neutras:"
            ex: { examples: [[{ target: Ми }, " живемо́ у Льво́ві."], "Живемо́ у Льво́ві."] }
            tr: { en: { examples: ["We live in Lviv.", "We live in Lviv."] }, es: { examples: ["Nosotros vivimos en Lviv.", "Vivimos en Lviv."] } }

  - title: { uk: "Форма: родовий, знахідний, давальний", en: "Form: genitive, accusative, dative", es: "Forma: genitivo, acusativo, dativo" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: nom, label: { uk: Називний, en: Nominative, es: Nominativo }, features: { case: nom } }
          - { key: acc, label: { uk: "Родовий і знахідний", en: "Genitive and accusative", es: "Genitivo y acusativo" }, features: { case: acc } }
          - { key: dat, label: { uk: Давальний, en: Dative, es: Dativo }, features: { case: dat } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, nom: я, acc: мене́, dat: мені́ }
          - { level: A1, features: { person: 2, number: sg }, nom: ти, acc: тебе́, dat: тобі́ }
          - { level: A2, features: { person: 3, number: sg, gender: masc }, nom: { alternatives: [він, воно́] }, acc: його́, dat: йому́ }
          - { level: A2, features: { person: 3, number: sg, gender: fem }, nom: вона́, acc: її́, dat: їй }
          - { level: A1, features: { person: 1, number: pl }, nom: ми, acc: нас, dat: нам }
          - { level: A1, features: { person: 2, number: pl }, nom: ви, acc: вас, dat: вам }
          - { level: A2, features: { person: 3, number: pl }, nom: вони́, acc: їх, dat: їм }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Родовий і знахідний відмінки особових займенників мають ту саму форму:"
              en: "Personal pronouns have one form for the genitive and the accusative:"
              es: "Los pronombres personales tienen una sola forma para el genitivo y el acusativo:"
            ex: { examples: [["Ти ", { target: мене́ }, " чу́єш?"], ["У ", { target: ме́не }, " є брат."]] }
            tr: { en: { examples: ["Can you hear me?", "I have a brother."] }, es: { examples: ["¿Me oyes?", "Tengo un hermano."] } }
          - type: note
            level: A1
            text:
              uk: ["Після прийменника наголос переходить на перший склад: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
              en: ["After a preposition the stress moves to the first syllable: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
              es: ["Tras una preposición, el acento pasa a la primera sílaba: ", { mapping: [{ term: мене́ }, { term: у ме́не }] }, ", ", { mapping: [{ term: тебе́ }, { term: до те́бе }] }, "."]
          - type: rule
            level: A2
            text:
              uk: "Давальний називає того, кому щось дають чи кажуть:"
              en: "The dative names the person something is given or said to:"
              es: "El dativo nombra a la persona a quien se da o se dice algo:"
            ex: ["Я ", { target: йому́ }, " подзвоню́ за́втра."]
            tr: { en: "I'll ring him tomorrow.", es: "Lo llamo mañana." }

  - title: { uk: "Форма: орудний і місцевий", en: "Form: instrumental and locative", es: "Forma: instrumental y locativo" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: nom, label: { uk: Називний, en: Nominative, es: Nominativo }, features: { case: nom } }
          - { key: ins, label: { uk: Орудний, en: Instrumental, es: Instrumental }, features: { case: ins } }
          - { key: loc, label: { uk: Місцевий, en: Locative, es: Locativo }, features: { case: loc } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, nom: я, ins: мно́ю, loc: на мені́ }
          - { level: A2, features: { person: 2, number: sg }, nom: ти, ins: тобо́ю, loc: на тобі́ }
          - { level: A2, features: { person: 3, number: sg, gender: masc }, nom: { alternatives: [він, воно́] }, ins: ним, loc: на ньо́му }
          - { level: A2, features: { person: 3, number: sg, gender: fem }, nom: вона́, ins: не́ю, loc: на ній }
          - { level: A2, features: { person: 1, number: pl }, nom: ми, ins: на́ми, loc: на нас }
          - { level: A2, features: { person: 2, number: pl }, nom: ви, ins: ва́ми, loc: на вас }
          - { level: A2, features: { person: 3, number: pl }, nom: вони́, ins: ни́ми, loc: на них }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Місцевий відмінок завжди має прийменник: ", { term: на }, ", ", { term: у }, ", ", { term: при }, ":"]
              en: ["The locative always comes with a preposition: ", { term: на }, ", ", { term: у }, ", ", { term: при }, ":"]
              es: ["El locativo siempre lleva preposición: ", { term: на }, ", ", { term: у }, ", ", { term: при }, ":"]
            ex: [{ target: На ньо́му }, " нова́ ку́ртка."]
            tr: { en: "He's wearing a new jacket.", es: "Lleva una chaqueta nueva." }

  - title: { uk: "Після прийменника", en: "After a preposition", es: "Tras una preposición" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Після прийменника форми третьої особи мають ", { term: н- }, ": ", { mapping: [{ term: його́ }, { term: ньо́го }] }, ", ", { mapping: [{ term: йому́ }, { term: ньо́му }] }, ", ", { mapping: [{ term: її́ }, { term: не́ї }] }, ", ", { mapping: [{ term: їй }, { term: ній }] }, ", ", { mapping: [{ term: їх }, { term: них }] }, ", ", { mapping: [{ term: їм }, { term: ним }] }, ":"]
              en: ["After a preposition, the third-person forms take ", { term: н- }, ": ", { mapping: [{ term: його́ }, { term: ньо́го }] }, ", ", { mapping: [{ term: йому́ }, { term: ньо́му }] }, ", ", { mapping: [{ term: її́ }, { term: не́ї }] }, ", ", { mapping: [{ term: їй }, { term: ній }] }, ", ", { mapping: [{ term: їх }, { term: них }] }, ", ", { mapping: [{ term: їм }, { term: ним }] }, ":"]
              es: ["Tras una preposición, las formas de tercera persona llevan ", { term: н- }, ": ", { mapping: [{ term: його́ }, { term: ньо́го }] }, ", ", { mapping: [{ term: йому́ }, { term: ньо́му }] }, ", ", { mapping: [{ term: її́ }, { term: не́ї }] }, ", ", { mapping: [{ term: їй }, { term: ній }] }, ", ", { mapping: [{ term: їх }, { term: них }] }, ", ", { mapping: [{ term: їм }, { term: ним }] }, ":"]
            ex: { examples: [["Ми ду́маємо ", { target: про ньо́го }, "."], ["Я ї́ду ", { target: до не́ї }, "."], [{ target: У них }, " є маши́на."]] }
            tr: { en: { examples: ["We're thinking about him.", "I'm going to see her.", "They have a car."] }, es: { examples: ["Pensamos en él.", "Voy a verla.", "Ellos tienen auto."] } }
          - type: note
            level: A2
            text:
              uk: ["Власність: ", { term: у ньо́го є }, ". Див. ", { link: "У мене є", to: uk.sentence.u-mene-ye }, "."]
              en: ["Having: ", { term: у ньо́го є }, " (he has). See ", { link: "Having: у мене є", to: uk.sentence.u-mene-ye }, "."]
              es: ["Tener: ", { term: у ньо́го є }, " (él tiene). Ver ", { link: "Tener: у мене є", to: uk.sentence.u-mene-ye }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Мені́ зва́ти Оле́г., right: [{ target: Мене́ }, " зва́ти Оле́г."], rule: { uk: [{ term: зва́ти }, " — зі знахідним: ", { term: мене́ }], en: [{ term: зва́ти }, " takes the accusative: ", { term: мене́ }], es: [{ term: зва́ти }, " lleva acusativo: ", { term: мене́ }] } }
          - { level: A1, wrong: Дя́кую вас., right: ["Дя́кую ", { target: вам }, "."], rule: { uk: [{ term: дя́кувати }, " кому? — давальний; «дякую вас» — калька з російської"], en: [{ term: дя́кувати }, " takes the dative; «дякую вас» is a calque from Russian"], es: [{ term: дя́кувати }, " lleva dativo; «дякую вас» es un calco del ruso"] } }
          - { level: A2, wrong: Я ї́ду до його́., right: ["Я ї́ду ", { target: до ньо́го }, "."], rule: { uk: ["після прийменника — ", { term: ньо́го }], en: ["after a preposition: ", { term: ньо́го }], es: ["tras preposición: ", { term: ньо́го }] } }
          - { level: A2, wrong: Я говорю́ з вона́., right: ["Я говорю́ ", { target: з не́ю }, "."], rule: { uk: [{ term: з }, " + орудний: ", { term: не́ю }], en: [{ term: з }, " takes the instrumental: ", { term: не́ю }], es: [{ term: з }, " lleva instrumental: ", { term: не́ю }] } }
          - { level: A1, speakers: [en, es], wrong: Да́йте до мене́ ка́ву., right: ["Да́йте ", { target: мені́ }, " ка́ву."], rule: { en: ["“to me” is the dative ", { term: мені́ }, ", with no preposition"], es: ["«a mí» es el dativo ", { term: мені́ }, ", sin preposición"] } }
