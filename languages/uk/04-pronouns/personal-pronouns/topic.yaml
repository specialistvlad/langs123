      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Для речей теж кажемо ", { term: він }, ", ", { term: вона́ }, " чи ", { term: воно́ }, " — за родом іменника:"]
              en: ["Things are also ", { term: він }, ", ", { term: вона́ }, " or ", { term: воно́ }, ", after the gender of the noun:"]
              es: ["Las cosas también son ", { term: він }, ", ", { term: вона́ }, " o ", { term: воно́ }, ", según el género del sustantivo:"]
              pt: ["Para as coisas também se diz ", { term: "він" }, ", ", { term: "вона́" }, " ou ", { term: "воно́" }, ", segundo o gênero do substantivo:"]
              fr: ["Pour les choses aussi, on dit ", { term: "він" }, ", ", { term: "вона́" }, " ou ", { term: "воно́" }, ", d’après le genre du nom :"]
              de: ["Auch bei Dingen sagt man ", { term: "він" }, ", ", { term: "вона́" }, " oder ", { term: "воно́" }, " — je nach Genus des Nomens:"]
              it: ["Anche per le cose si dice ", { term: "він" }, ", ", { term: "вона́" }, " o ", { term: "воно́" }, ", secondo il genere del sostantivo:"]
              pl: ["Także o rzeczach mówimy ", { term: "він" }, ", ", { term: "вона́" }, " lub ", { term: "воно́" }, ", zależnie od rodzaju rzeczownika:"]
              tr: ["Eşyalar için de ", { term: "він" }, ", ", { term: "вона́" }, " ya da ", { term: "воно́" }, " denir; seçim ismin gramer cinsiyetine bağlıdır:"]
              id: ["Untuk benda juga dipakai ", { term: "він" }, ", ", { term: "вона́" }, " atau ", { term: "воно́" }, ", menurut gender kata bendanya:"]
              vi: ["Với đồ vật cũng dùng ", { term: "він" }, ", ", { term: "вона́" }, " hay ", { term: "воно́" }, ", theo giống của danh từ:"]
            ex: ["Це моя́ кни́жка. ", { target: Вона́ }, " ціка́ва."]
            tr: { en: "This is my book. It's interesting.", es: "Es mi libro. Es interesante.", pt: "Este é o meu livro. É interessante.", fr: "C’est mon livre. Il est intéressant.", de: "Das ist mein Buch. Es ist interessant.", it: "Questo è il mio libro. È interessante.", pl: "To moja książka. Jest ciekawa.", tr: "Bu benim kitabım. İlginç.", id: "Ini buku saya. Buku ini menarik.", vi: "Đây là cuốn sách của tôi. Nó rất thú vị." }
          - type: rule
            level: A1
            text:
              uk: "Займенник-підмет можна опустити, бо закінчення дієслова вже називає особу; його вживають, щоб виділити особу, і в нейтральних реченнях:"
              en: "The subject pronoun can be left out, because the verb ending already shows the person; it is used to stress the person and in neutral sentences:"
              es: "El pronombre sujeto puede omitirse, porque la terminación del verbo ya indica la persona; se usa para destacar la persona y en frases neutras:"
              pt: "O pronome sujeito pode ser omitido, porque a terminação do verbo já indica a pessoa; ele é usado para destacar a pessoa e em frases neutras:"
              fr: "Le pronom sujet peut être omis, car la terminaison du verbe indique déjà la personne ; on l’emploie pour mettre la personne en relief et dans les phrases neutres :"
              de: "Das Subjektpronomen kann entfallen, weil die Verbendung die Person schon anzeigt; man setzt es, um die Person zu betonen, und in neutralen Sätzen:"
              it: "Il pronome soggetto si può omettere, perché la desinenza del verbo indica già la persona; si usa per dare rilievo alla persona e nelle frasi neutre:"
              pl: "Zaimek osobowy w roli podmiotu można pominąć, bo końcówka czasownika już wskazuje osobę; używa się go, by podkreślić osobę, oraz w zdaniach neutralnych:"
              tr: "Özne zamiri düşebilir, çünkü fiilin eki kişiyi zaten gösterir; kişiyi vurgulamak için ve yansız cümlelerde kullanılır:"
              id: "Kata ganti subjek boleh dihilangkan, karena akhiran kata kerja sudah menunjukkan orangnya; kata ganti dipakai untuk menekankan orang dan dalam kalimat netral:"
              vi: "Đại từ chủ ngữ có thể bỏ, vì đuôi động từ đã cho biết ngôi; người ta dùng nó để nhấn mạnh ngôi và trong câu trung tính:"
            ex: { examples: [[{ target: Ми }, " живемо́ у Льво́ві."], "Живемо́ у Льво́ві."] }
            tr: { en: { examples: ["We live in Lviv.", "We live in Lviv."] }, es: { examples: ["Nosotros vivimos en Lviv.", "Vivimos en Lviv."] }, pt: { examples: ["Nós moramos em Lviv.", "Moramos em Lviv."] }, fr: { examples: ["Nous, nous habitons à Lviv.", "Nous habitons à Lviv."] }, de: { examples: ["Wir wohnen in Lwiw.", "Wir wohnen in Lwiw."] }, it: { examples: ["Noi abitiamo a Leopoli.", "Abitiamo a Leopoli."] }, pl: { examples: ["My mieszkamy we Lwowie.", "Mieszkamy we Lwowie."] }, tr: { examples: ["Biz Lviv’de yaşıyoruz.", "Lviv’de yaşıyoruz."] }, id: { examples: ["Kami tinggal di Lviv.", "Kami tinggal di Lviv."] }, vi: { examples: ["Chúng tôi sống ở Lviv.", "Chúng tôi sống ở Lviv."] } }

  - title: { uk: "Форма: родовий, знахідний, давальний", en: "Form: genitive, accusative, dative", es: "Forma: genitivo, acusativo, dativo", pt: "Forma: genitivo, acusativo, dativo", fr: "Forme : génitif, accusatif, datif", de: "Form: Genitiv, Akkusativ, Dativ", it: "Forma: genitivo, accusativo, dativo", pl: "Forma: dopełniacz, biernik, celownik", tr: "Biçim: tamlayan, belirtme ve yönelme hâlleri", id: "Bentuk: genitif, akusatif, datif", vi: "Dạng: sinh cách, đối cách, tặng cách" }
