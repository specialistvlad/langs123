          - { level: A1, features: { person: 2 }, person: { uk: "2-га", en: "2nd", es: "2.ª", pt: "2ª", fr: "2e", de: "2.", it: "2ª", pl: "2.", tr: "2.", id: "ke-2", vi: "Thứ hai" }, sg: ти, pl: ви }
