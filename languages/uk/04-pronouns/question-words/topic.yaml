id: uk.pronouns.question-words
lang: uk
kind: grammar
tags: [pronouns, questions, question words, чи]
concepts: [questions-negatives]
related: [uk.sentence.questions-negation, uk.pronouns.negative-pronouns, uk.prepositions.where-whereto-wherefrom, uk.adjectives-adverbs.adverbs]
status: { uk: draft, en: draft, es: draft }
translated: { en: "d5f124 edf1cb b4402a 01cbaf 873699 1294ee fb1303", es: "d5f124 edf1cb b4402a 01cbaf 873699 1294ee fb1303" }

title: { uk: Питальні слова, en: Question Words, es: Los interrogativos }
summary:
  lead:
    uk: ["Питальне слово стоїть на початку: ", { term: хто }, ", ", { term: що }, ", ", { term: де }, ", ", { term: куди́ }, ", ", { term: коли́ }, ", ", { term: чому́ }, "; без нього питання починає ", { term: чи }, "."]
    en: ["The question word goes first: ", { term: хто }, ", ", { term: що }, ", ", { term: де }, ", ", { term: куди́ }, ", ", { term: коли́ }, ", ", { term: чому́ }, "; without one, ", { term: чи }, " opens the question."]
    es: ["El interrogativo va al principio: ", { term: хто }, ", ", { term: що }, ", ", { term: де }, ", ", { term: куди́ }, ", ", { term: коли́ }, ", ", { term: чому́ }, "; sin él, la pregunta empieza por ", { term: чи }, "."]
  rule:
    uk: ["Займенники ", { term: хто }, " і ", { term: що }, " змінюються за відмінками:"]
    en: ["The pronouns ", { term: хто }, " (who) and ", { term: що }, " (what) change for case:"]
    es: ["Los pronombres ", { term: хто }, " (quién) y ", { term: що }, " (qué) cambian de caso:"]
  ex: { examples: [[{ target: Кого́ }, " ти чека́єш?"], ["З ", { target: ким }, " ти гово́риш?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Хто? Що?, en: Who? What?, es: ¿Quién? ¿Qué? }
          rule: { uk: { alternatives: [{ term: хто }, { term: що }] }, en: { alternatives: [{ term: хто }, { term: що }] }, es: { alternatives: [{ term: хто }, { term: що }] } }
          ex: { examples: [[{ target: Хто }, " це?"], [{ target: Що }, " це?"]] }
          tr: { en: { examples: ["Who's this?", "What's this?"] }, es: { examples: ["¿Quién es?", "¿Qué es esto?"] } }
        - level: A1
          point: { uk: Місце, en: Place, es: Lugar }
          rule: { uk: { alternatives: [{ term: де }, { term: куди́ }, { term: зві́дки }] }, en: { alternatives: [{ term: де }, { term: куди́ }, { term: зві́дки }] }, es: { alternatives: [{ term: де }, { term: куди́ }, { term: зві́дки }] } }
          ex: [{ target: Куди́ }, " ви ї́дете?"]
          tr: { en: "Where are you going?", es: "¿Adónde van?" }
        - level: A1
          point: { uk: "Час, причина, спосіб", en: "Time, reason, manner", es: "Tiempo, causa, modo" }
          rule: { uk: { alternatives: [{ term: коли́ }, { term: чому́ }, { term: як }, { term: скі́льки }] }, en: { alternatives: [{ term: коли́ }, { term: чому́ }, { term: як }, { term: скі́льки }] }, es: { alternatives: [{ term: коли́ }, { term: чому́ }, { term: як }, { term: скі́льки }] } }
          ex: [{ target: Скі́льки }, " це ко́штує?"]
          tr: { en: "How much is this?", es: "¿Cuánto cuesta?" }
        - level: A1
          point: { uk: Так чи ні, en: Yes or no, es: Sí o no }
          rule: { uk: [{ term: чи }, " на початку"], en: [{ term: чи }, " at the start"], es: [{ term: чи }, " al principio"] }
          ex: [{ target: Чи }, " ти вдо́ма?"]
          tr: { en: "Are you at home?", es: "¿Estás en casa?" }
        - level: A2
          point: { uk: Відмінки, en: Cases, es: Casos }
          rule: { uk: { alternatives: [{ term: кого́ }, { term: кому́ }, { term: з ким }, { term: про що }] }, en: { alternatives: [{ term: кого́ }, { term: кому́ }, { term: з ким }, { term: про що }] }, es: { alternatives: [{ term: кого́ }, { term: кому́ }, { term: з ким }, { term: про що }] } }
          ex: [{ target: Кому́ }, " ти телефону́єш?"]
          tr: { en: "Who are you phoning?", es: "¿A quién llamas?" }
        - level: B1
          point: { uk: Який? Чий?, en: Which? Whose?, es: ¿Cuál? ¿De quién? }
          rule: { uk: "узгоджуються, як прикметник", en: "agree like an adjective", es: "concuerdan como un adjetivo" }
          ex: [{ target: Чия́ }, " це су́мка?"]
          tr: { en: "Whose bag is this?", es: "¿De quién es esta bolsa?" }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule: { uk: "про час питаємо в жіночому роді", en: "the time is asked in the feminine", es: "la hora se pregunta en femenino" }
          ex: [{ target: Котра́ }, " годи́на?"]
          tr: { en: "What time is it?", es: "¿Qué hora es?" }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Питальне слово стоїть на початку, далі порядок слів той самий, що й у відповіді:"
              en: "The question word comes first; the rest keeps the order of the answer:"
              es: "El interrogativo va primero; el resto mantiene el orden de la respuesta:"
            ex: { exchange: [[{ target: Де }, " ти живе́ш?"], "Я живу́ у Льво́ві."] }
            tr: { en: { exchange: ["Where do you live?", "I live in Lviv."] }, es: { exchange: ["¿Dónde vives?", "Vivo en Lviv."] } }
          - type: rule
            level: A1
            text:
              uk: ["Питання «так чи ні» починає ", { term: чи }, " або лише інтонація:"]
              en: ["A yes-or-no question opens with ", { term: чи }, " or uses intonation alone:"]
              es: ["Una pregunta de sí o no empieza por ", { term: чи }, " o se marca solo con la entonación:"]
            ex: { examples: [[{ target: Чи }, " ти зна́єш Ма́рту?"], "Ти зна́єш Ма́рту?"] }
            tr: { en: { examples: ["Do you know Marta?", "Do you know Marta?"] }, es: { examples: ["¿Conoces a Marta?", "¿Conoces a Marta?"] } }

  - title: { uk: Питальні слова, en: The question words, es: Los interrogativos }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { uk: Слово, en: Word, es: Palabra } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            word: { term: де }
            ex: [{ target: Де }, " ти живе́ш?"]
            tr: { en: "Where do you live?", es: "¿Dónde vives?" }
          - level: A1
            word: { term: зві́дки }
            ex: [{ target: Зві́дки }, " ти?"]
            tr: { en: "Where are you from?", es: "¿De dónde eres?" }
          - level: A1
            word: { term: коли́ }
            ex: [{ target: Коли́ }, " ти працю́єш?"]
            tr: { en: "When do you work?", es: "¿Cuándo trabajas?" }
          - level: A1
            word: { term: чому́ }
            ex: [{ target: Чому́ }, " ти не спиш?"]
            tr: { en: "Why aren't you asleep?", es: "¿Por qué no duermes?" }
          - level: A1
            word: { term: як }
            ex: [{ target: Як }, " тебе́ зва́ти?"]
            tr: { en: "What's your name?", es: "¿Cómo te llamas?" }
          - level: A1
            word: { term: яка́ }
            ex: [{ target: Яка́ }, " твоя́ рі́дна мо́ва?"]
            tr: { en: "What's your native language?", es: "¿Cuál es tu lengua materna?" }
          - level: A2
            word: { term: про що }
            ex: [{ target: Про що }, " ви ду́маєте?"]
            tr: { en: "What are you thinking about?", es: "¿En qué piensan?" }
      - type: list
        items:
          - type: note
            level: A1
            text:
              uk: ["Підручники й стандарт мають ", { term: Як тебе́ зва́ти? }, "; у розмові чути й ", { term: Як тебе́ звуть? }, "."]
              en: ["Textbooks and the standard use ", { term: Як тебе́ зва́ти? }, "; in conversation you also hear ", { term: Як тебе́ звуть? }, "."]
              es: ["Los manuales y el estándar usan ", { term: Як тебе́ зва́ти? }, "; en la conversación también se oye ", { term: Як тебе́ звуть? }, "."]

  - title: { uk: "Форма: хто і що", en: "Form: хто and що", es: "Forma: хто y що" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: who, label: { term: хто } }
          - { key: what, label: { term: що } }
        rows:
          - { level: A1, features: { case: nom }, case: { uk: Називний, en: Nominative, es: Nominativo }, who: хто, what: що }
          - { level: A2, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, who: кого́, what: чого́ }
          - { level: A2, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, who: кому́, what: чому́ }
          - { level: A2, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, who: кого́, what: що }
          - { level: A2, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, who: ким, what: чим }
          - { level: A2, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, who: на ко́му, what: на чо́му }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Прийменник стоїть перед питальним словом:"
              en: "A preposition goes before the question word:"
              es: "La preposición va delante del interrogativo:"
            ex: { examples: [["З ", { target: ким }, " ти гово́риш?"], ["Про ", { target: кого́ }, " ця кни́жка?"]] }
            tr: { en: { examples: ["Who are you talking to?", "Who is this book about?"] }, es: { examples: ["¿Con quién hablas?", "¿De quién trata este libro?"] } }

  - title: { uk: "Який, чий, котрий", en: "Який, чий, котрий", es: "Який, чий, котрий" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: masc, label: { uk: Чоловічий рід, en: Masculine, es: Masculino }, features: { gender: masc, number: sg } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino }, features: { gender: fem, number: sg } }
          - { key: neut, label: { uk: Середній рід, en: Neuter, es: Neutro }, features: { gender: neut, number: sg } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural }, features: { number: pl } }
        rows:
          - { level: B1, masc: яки́й, fem: яка́, neut: яке́, pl: які́ }
          - { level: B1, masc: чий, fem: чия́, neut: чиє́, pl: чиї́ }
          - { level: B1, masc: котри́й, fem: котра́, neut: котре́, pl: котрі́ }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: яки́й }, " питає про ознаку і змінюється, як прикметник:"]
              en: [{ term: яки́й }, " asks what something is like and changes like an adjective:"]
              es: [{ term: яки́й }, " pregunta cómo es algo y cambia como un adjetivo:"]
            ex: [{ target: Яка́ }, " твоя́ улю́блена стра́ва?"]
            tr: { en: "What's your favourite dish?", es: "¿Cuál es tu plato favorito?" }
          - type: rule
            level: B1
            text:
              uk: [{ term: чий }, " питає про власника:"]
              en: [{ term: чий }, " asks who the owner is:"]
              es: [{ term: чий }, " pregunta por el dueño:"]
            ex: [{ target: Чиї́ }, " це ключі́?"]
            tr: { en: "Whose keys are these?", es: "¿De quién son estas llaves?" }
          - type: rule
            level: B1
            text:
              uk: [{ term: котри́й }, " питає про один із кількох:"]
              en: [{ term: котри́й }, " asks which one of several:"]
              es: [{ term: котри́й }, " pregunta cuál de varios:"]
            ex: [{ target: Котри́й }, " авто́бус іде́ до це́нтру?"]
            tr: { en: "Which bus goes to the centre?", es: "¿Qué autobús va al centro?" }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Котри́й час?, right: [{ target: Котра́ годи́на }, "?"], rule: { uk: [{ term: Котра́ годи́на? }, "; «котрий час» — калька з російської"], en: [{ term: Котра́ годи́на? }, "; «котрий час» is a calque from Russian"], es: [{ term: Котра́ годи́на? }, "; «котрий час» es un calco del ruso"] } }
          - { level: A1, wrong: Де ти йдеш?, right: [{ target: Куди́ }, " ти йдеш?"], rule: { uk: ["з дієсловом руху — ", { term: куди́ }], en: ["a verb of motion takes ", { term: куди́ }], es: ["un verbo de movimiento lleva ", { term: куди́ }] } }
          - { level: A2, wrong: З хто ти гово́риш?, right: ["З ", { target: ким }, " ти гово́риш?"], rule: { uk: [{ term: з }, " + орудний: ", { term: ким }], en: [{ term: з }, " takes the instrumental: ", { term: ким }], es: [{ term: з }, " lleva instrumental: ", { term: ким }] } }
          - { level: A1, speakers: [en, es], wrong: Що це є?, right: [{ target: Що це }, "?"], rule: { en: ["Ukrainian usually leaves out “is”: ", { term: Що це? }], es: ["en ucraniano normalmente no se dice «es»: ", { term: Що це? }] } }
