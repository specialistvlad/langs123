          - { level: B1, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, two: двох, three: трьох, four: чотирьо́х }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, two: двом, three: трьом, four: чотирьо́м }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, two: двома́, three: трьома́, four: чотирма́ }
