          - level: B1
            form: { uk: [{ term: бага́то }, " відмінюється: ", { alternatives: [{ term: багатьо́х }, { term: багатьо́м }, { term: багатьма́ }] }], en: [{ term: бага́то }, " changes for case: ", { alternatives: [{ term: багатьо́х }, { term: багатьо́м }, { term: багатьма́ }] }], es: [{ term: бага́то }, " se declina: ", { alternatives: [{ term: багатьо́х }, { term: багатьо́м }, { term: багатьма́ }] }] }
            ex: ["Він знайо́мий ", { target: із багатьма́ акто́рами }, "."]
