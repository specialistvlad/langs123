          - { level: A2, speakers: [en, es], wrong: п’ять студе́нти, right: { target: п’ять студе́нтів }, rule: { en: ["from ", { term: п’ять }, " on, the noun takes the genitive plural, not the ordinary plural"], es: ["desde ", { term: п’ять }, ", el sustantivo va en genitivo plural, no en el plural corriente"] } }
