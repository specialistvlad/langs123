title: { uk: "Числівник та іменник", en: "Numbers with Nouns", es: "Los números con sustantivos" }
summary:
  lead:
    uk: ["Після ", { term: оди́н }, " іменник стоїть в однині, після ", { alternatives: [{ term: два }, { term: три }, { term: чоти́ри }] }, " — у називному множини, після ", { term: п’ять }, " і більше — у родовому множини."]
    en: ["After ", { term: оди́н }, " the noun is singular, after ", { alternatives: [{ term: два }, { term: три }, { term: чоти́ри }] }, " nominative plural, and after ", { term: п’ять }, " and up genitive plural."]
    es: ["Tras ", { term: оди́н }, " el sustantivo va en singular; tras ", { alternatives: [{ term: два }, { term: три }, { term: чоти́ри }] }, ", en nominativo plural, y desde ", { term: п’ять }, ", en genitivo plural."]
  rule:
    uk: "Форму іменника визначає останнє слово числівника:"
    en: "The last word of the number sets the form of the noun:"
    es: "La última palabra del número decide la forma del sustantivo:"
  ex: { examples: [["два́дцять ", { target: два студе́нти }], ["два́дцять ", { target: п’ять студе́нтів }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { uk: Один, en: One, es: Uno }
          rule:
            uk: [{ alternatives: [{ term: оди́н }, { term: одна́ }, { term: одне́ }] }, " — за родом, іменник в однині"]
            en: [{ alternatives: [{ term: оди́н }, { term: одна́ }, { term: одне́ }] }, " by gender, the noun singular"]
            es: [{ alternatives: [{ term: оди́н }, { term: одна́ }, { term: одне́ }] }, " según el género; el sustantivo, en singular"]
          ex: ["У ме́не ", { target: одна́ сестра́ }, "."]
          tr: { en: "I have one sister.", es: "Tengo una hermana." }
        - level: A2
          point: { uk: "Два, три, чотири", en: "Two, three, four", es: "Dos, tres, cuatro" }
          rule:
            uk: "називний множини"
            en: "the nominative plural"
            es: "el nominativo plural"
          ex: [{ target: Два квитки́ }, ", будь ла́ска."]
          tr: { en: "Two tickets, please.", es: "Dos boletos, por favor." }
        - level: A2
          point: { uk: Два і дві, en: Два and дві, es: Два y дві }
          rule:
            uk: [{ term: дві }, " з жіночим родом"]
            en: [{ term: дві }, " with a feminine noun"]
            es: [{ term: дві }, " con un femenino"]
          ex: ["Ка́ва ко́штує ", { target: дві гри́вні }, "."]
          tr: { en: "The coffee costs two hryvnias.", es: "El café cuesta dos grivnas." }
        - level: A2
          point: { uk: П’ять і більше, en: Five and up, es: Cinco o más }
          rule:
            uk: "родовий множини"
            en: "the genitive plural"
            es: "el genitivo plural"
          ex: ["Квито́к ко́штує ", { target: п’ятдеся́т гри́вень }, "."]
          tr: { en: "The ticket costs fifty hryvnias.", es: "El boleto cuesta cincuenta grivnas." }
        - level: A2
          point: { uk: Складені, en: Compound numbers, es: Números compuestos }
          rule:
            uk: "за останнім словом"
            en: "the last word decides"
            es: "decide la última palabra"
          ex: ["У гру́пі ", { target: два́дцять два студе́нти }, "."]
          tr: { en: "There are twenty-two students in the group.", es: "En el grupo hay veintidós estudiantes." }
        - level: A2
          point: { uk: Багато і кілька, en: Many and several, es: Mucho y varios }
          rule:
            uk: [{ alternatives: [{ term: бага́то }, { term: кі́лька }] }, " з родовим"]
            en: [{ alternatives: [{ term: бага́то }, { term: кі́лька }] }, " with the genitive"]
            es: [{ alternatives: [{ term: бага́то }, { term: кі́лька }] }, " con genitivo"]
          ex: ["Тре́ба ї́сти ", { target: бага́то фру́ктів }, "."]
          tr: { en: "You should eat plenty of fruit.", es: "Hay que comer mucha fruta." }
        - level: B1
          point: { uk: Відмінки, en: Cases, es: Casos }
          rule:
            uk: { alternatives: [{ term: двох }, { term: двом }, { term: двома́ }] }
            en: { alternatives: [{ term: двох }, { term: двом }, { term: двома́ }] }
            es: { alternatives: [{ term: двох }, { term: двом }, { term: двома́ }] }
          ex: ["Ми ї́хали ", { target: з двома́ дру́зями }, "."]
          tr: { en: "We travelled with two friends.", es: "Viajamos con dos amigos." }
        - level: B1
          point: { uk: Люди, en: People, es: Personas }
          rule:
            uk: ["знахідний = родовий: ", { term: двох }]
            en: ["accusative = genitive: ", { term: двох }]
            es: ["acusativo = genitivo: ", { term: двох }]
          ex: ["Я ба́чу ", { target: двох студе́нтів }, "."]
          tr: { en: "I can see two students.", es: "Veo a dos estudiantes." }
        - level: A2
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["гроші після ", { term: п’ять }, " — теж родовий множини: ", { term: п’ять гри́вень }]
            en: ["money after ", { term: п’ять }, " takes the genitive plural too: ", { term: п’ять гри́вень }]
            es: ["el dinero tras ", { term: п’ять }, " también va en genitivo plural: ", { term: п’ять гри́вень }]
          ex: ["Хліб ко́штує ", { target: п’ять гри́вень }, "."]
          tr: { en: "Bread costs five hryvnias.", es: "El pan cuesta cinco grivnas." }

