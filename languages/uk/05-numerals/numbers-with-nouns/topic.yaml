            form: { uk: [{ alternatives: [{ term: бага́то }, { term: ма́ло }, { term: кі́лька }] }, " з родовим множини"], en: [{ alternatives: [{ term: бага́то }, { term: ма́ло }, { term: кі́лька }] }, " with the genitive plural"], es: [{ alternatives: [{ term: бага́то }, { term: ма́ло }, { term: кі́лька }] }, " con genitivo plural"] }
