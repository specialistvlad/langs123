title: { uk: "Порядкові числівники", en: "Ordinal Numbers", es: "Los ordinales" }
summary:
  lead:
    uk: ["Порядкові числівники відповідають на питання ", { term: котри́й? }, " і змінюються, як прикметники: ", { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }, "."]
    en: ["Ordinal numbers answer ", { term: котри́й? }, " (which one?) and change like adjectives: ", { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }, "."]
    es: ["Los ordinales responden a ", { term: котри́й? }, " (¿cuál, en qué orden?) y cambian como adjetivos: ", { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }, "."]
  rule:
    uk: "Порядковий числівник узгоджується з іменником у роді, числі й відмінку:"
    en: "An ordinal agrees with its noun in gender, number and case:"
    es: "El ordinal concuerda con su sustantivo en género, número y caso:"
  ex: { examples: [["Це мій ", { target: пе́рший }, " уро́к."], ["Я живу́ на ", { target: тре́тьому }, " по́версі."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Рід, en: Gender, es: Género }
          rule:
            uk: { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }
            en: { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }
            es: { alternatives: [{ term: пе́рший }, { term: пе́рша }, { term: пе́рше }] }
          ex: ["Це мій ", { target: пе́рший }, " уро́к."]
          tr: { en: "This is my first lesson.", es: "Es mi primera clase." }
        - level: A1
          point: { uk: М’яка основа, en: Soft stem, es: Raíz blanda }
          rule:
            uk: { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }
            en: { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }
            es: { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }
          ex: [{ target: Тре́тя }, " ву́лиця право́руч."]
          tr: { en: "The third street on the right.", es: "La tercera calle a la derecha." }
        - level: A2
          point: { uk: Родовий, en: Genitive, es: Genitivo }
          rule:
            uk: { alternatives: [{ term: деся́того }, { term: деся́тої }] }
            en: { alternatives: [{ term: деся́того }, { term: деся́тої }] }
            es: { alternatives: [{ term: деся́того }, { term: деся́тої }] }
          ex: ["Я народи́вся ", { target: деся́того }, " бе́резня."]
          tr: { en: "I was born on the tenth of March.", es: "Nací el diez de marzo." }
        - level: A2
          point: { uk: Місцевий, en: Locative, es: Locativo }
          rule:
            uk: { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }
            en: { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }
            es: { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }
          ex: ["Я живу́ ", { target: на тре́тьому }, " по́версі."]
          tr: { en: "I live on the third floor.", es: "Vivo en el tercer piso." }
        - level: A2
          point: { uk: Від 11, en: From 11th, es: Desde el 11.º }
          rule:
            uk: { alternatives: [{ term: одина́дцятий }, { term: двадця́тий }] }
            en: { alternatives: [{ term: одина́дцятий }, { term: двадця́тий }] }
            es: { alternatives: [{ term: одина́дцятий }, { term: двадця́тий }] }
          ex: ["Сього́дні ", { target: двадця́те }, " тра́вня."]
          tr: { en: "Today is the twentieth of May.", es: "Hoy es veinte de mayo." }
        - level: B1
          point: { uk: Складені, en: Compound ordinals, es: Ordinales compuestos }
          rule:
            uk: "порядкове лише останнє слово"
            en: "only the last word is an ordinal"
            es: "solo la última palabra es ordinal"
          ex: ["Це ", { target: сто тре́тя }, " кімна́та."]
          tr: { en: "This is room one hundred and three.", es: "Es la habitación ciento tres." }
        - level: B1
          point: { uk: Скорочення, en: Abbreviations, es: Abreviaturas }
          rule:
            uk: ["після цифри — кінець слова: ", { alternatives: [{ term: 1-й }, { term: 3-тя }, { term: 5-му }] }]
            en: ["after the figure, the end of the word: ", { alternatives: [{ term: 1-й }, { term: 3-тя }, { term: 5-му }] }]
            es: ["tras la cifra, el final de la palabra: ", { alternatives: [{ term: 1-й }, { term: 3-тя }, { term: 5-му }] }]
          ex: ["Він навча́ється в ", { target: 5-му }, " кла́сі."]
          tr: { en: "He's in year five.", es: "Está en quinto curso." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Порядковий числівник називає місце в ряду й відповідає на питання ", { term: котри́й? }, ":"]
              en: ["An ordinal names a place in a series and answers ", { term: котри́й? }, ":"]
              es: ["El ordinal indica un lugar en una serie y responde a ", { term: котри́й? }, ":"]
            ex: { exchange: ["Котри́й ти в че́рзі?", ["Я ", { target: дру́гий }, "."]] }
            tr: { en: { exchange: ["Where are you in the queue?", "I'm second."] }, es: { exchange: ["¿Qué número eres en la cola?", "Soy el segundo."] } }
          - type: rule
            level: A1
            text:
              uk: "Він змінюється за родом, як прикметник:"
              en: "It changes for gender, like an adjective:"
              es: "Cambia según el género, como un adjetivo:"
            ex: { examples: [[{ target: пе́рший }, " день"], [{ target: пе́рша }, " годи́на"], [{ target: пе́рше }, " мі́сце"]] }
            tr: { en: { examples: ["the first day", "the first hour", "first place"] }, es: { examples: ["el primer día", "la primera hora", "el primer puesto"] } }
          - type: rule
            level: A1
            text:
              uk: [{ term: тре́тій }, " має м’яку основу: ", { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }, "."]
              en: [{ term: тре́тій }, " has a soft stem: ", { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }, "."]
              es: [{ term: тре́тій }, " tiene raíz blanda: ", { alternatives: [{ term: тре́тій }, { term: тре́тя }, { term: тре́тє }] }, "."]

