  - title: { uk: "Складені й скорочені", en: "Compound and abbreviated ordinals", es: "Ordinales compuestos y abreviados", pt: "Ordinais compostos e abreviados", fr: "Ordinaux composés et abrégés", de: "Zusammengesetzte und abgekürzte Ordinalzahlen", it: "Ordinali composti e abbreviati", pl: "Liczebniki porządkowe złożone i skrócone", tr: "Bileşik ve kısaltılmış sıra sayıları", id: "Bilangan tingkat majemuk dan singkatannya", vi: "Số thứ tự ghép và viết tắt" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "У складеному числівнику порядкове лише останнє слово, і лише воно змінюється:"
              en: "In a compound ordinal, only the last word is an ordinal, and only it changes:"
              es: "En un ordinal compuesto, solo la última palabra es ordinal, y solo ella cambia:"
              pt: "Num ordinal composto, só a última palavra é ordinal, e só ela muda:"
              fr: "Dans un ordinal composé, seul le dernier mot est un ordinal, et seul lui varie :"
              de: "In einer zusammengesetzten Ordinalzahl ist nur das letzte Wort eine Ordinalzahl, und nur es verändert sich:"
              it: "In un ordinale composto solo l'ultima parola è ordinale, e solo quella cambia:"
              pl: "W złożonym liczebniku porządkowym porządkowy jest tylko ostatni wyraz i tylko on się zmienia:"
              tr: "Bileşik sıra sayısında yalnızca son sözcük sıra sayısıdır ve yalnızca o değişir:"
              id: "Dalam bilangan tingkat majemuk, hanya kata terakhir yang berupa bilangan tingkat, dan hanya kata itu yang berubah:"
              vi: "Trong số thứ tự ghép, chỉ từ cuối cùng là số thứ tự, và chỉ từ đó biến đổi:"
            ex: ["Він народи́вся у дві ти́сячі ", { target: деся́тому }, " ро́ці."]
            tr: { en: "He was born in two thousand and ten.", es: "Nació en dos mil diez.", pt: "Ele nasceu em dois mil e dez.", fr: "Il est né en deux mille dix.", de: "Er wurde im Jahr zweitausendzehn geboren.", it: "È nato nel duemiladieci.", pl: "Urodził się w dwa tysiące dziesiątym roku.", tr: "İki bin on yılında doğdu.", id: "Dia lahir pada tahun dua ribu sepuluh.", vi: "Anh ấy sinh năm hai nghìn không trăm mười." }
          - type: rule
            level: B1
            text:
              uk: "Після цифри пишемо через дефіс кінець слова:"
              en: "After the figure, a hyphen and the end of the word:"
              es: "Tras la cifra se escribe con guion el final de la palabra:"
              pt: "Depois do algarismo, escreve-se um hífen e o final da palavra:"
              fr: "Après le chiffre, on écrit un trait d’union et la fin du mot :"
              de: "Nach der Ziffer folgen ein Bindestrich und das Wortende:"
              it: "Dopo la cifra si scrivono un trattino e la fine della parola:"
              pl: "Po cyfrze pisze się łącznik i końcówkę wyrazu:"
