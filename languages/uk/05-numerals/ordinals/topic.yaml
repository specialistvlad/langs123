  - title: { uk: Відмінки, en: Cases, es: Casos }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A2
            features: { case: gen }
            form: { uk: ["родовий: ", { alternatives: [{ term: деся́того }, { term: тре́тього }] }], en: ["genitive: ", { alternatives: [{ term: деся́того }, { term: тре́тього }] }], es: ["genitivo: ", { alternatives: [{ term: деся́того }, { term: тре́тього }] }] }
            ex: ["Екску́рсія бу́де ", { target: тре́тього }, " че́рвня."]
            tr: { en: "The tour will be on the third of June.", es: "La excursión será el tres de junio." }
          - level: A2
            features: { case: gen, gender: fem }
            form: { uk: ["родовий, жіночий рід: ", { alternatives: [{ term: деся́тої }, { term: тре́тьої }] }], en: ["genitive, feminine: ", { alternatives: [{ term: деся́тої }, { term: тре́тьої }] }], es: ["genitivo, femenino: ", { alternatives: [{ term: деся́тої }, { term: тре́тьої }] }] }
            ex: ["Ми працю́ємо до ", { target: деся́тої }, " годи́ни."]
            tr: { en: "We work until ten o'clock.", es: "Trabajamos hasta las diez." }
          - level: A2
            features: { case: loc }
            form: { uk: ["місцевий: ", { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }], en: ["locative: ", { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }], es: ["locativo: ", { alternatives: [{ term: на тре́тьому }, { term: на тре́тій }] }] }
            ex: ["Кабіне́т ", { target: на дру́гому }, " по́версі."]
            tr: { en: "The office is on the second floor.", es: "La oficina está en el segundo piso." }
      - type: list
        items:
          - type: note
            level: A2
            text:
              uk: ["Дати й час: ", { link: "Дні, місяці, дати", to: uk.foundations.days-months-dates }, ", ", { link: "Котра година?", to: uk.foundations.telling-time }, "."]
              en: ["Dates and time: ", { link: "Days, Months, Dates", to: uk.foundations.days-months-dates }, ", ", { link: "Telling the Time", to: uk.foundations.telling-time }, "."]
              es: ["Fechas y horas: ", { link: "Días, meses, fechas", to: uk.foundations.days-months-dates }, ", ", { link: "La hora", to: uk.foundations.telling-time }, "."]

  - title: { uk: "Складені й скорочені", en: "Compound and abbreviated ordinals", es: "Ordinales compuestos y abreviados" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "У складеному числівнику порядкове лише останнє слово, і лише воно змінюється:"
              en: "In a compound ordinal, only the last word is an ordinal, and only it changes:"
              es: "En un ordinal compuesto, solo la última palabra es ordinal, y solo ella cambia:"
            ex: ["Він народи́вся у дві ти́сячі ", { target: деся́тому }, " ро́ці."]
            tr: { en: "He was born in two thousand and ten.", es: "Nació en dos mil diez." }
          - type: rule
            level: B1
            text:
              uk: "Після цифри пишемо через дефіс кінець слова:"
              en: "After the figure, a hyphen and the end of the word:"
              es: "Tras la cifra se escribe con guion el final de la palabra:"
            ex: { examples: [{ target: 1-й }, { target: 3-тя }, { target: 10-го }] }
            tr: { en: { examples: ["1st", "3rd", "of the 10th"] }, es: { examples: ["1.º", "3.ª", "del 10"] } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: тре́тий уро́к, right: [{ target: тре́тій }, " уро́к"], rule: { uk: [{ term: тре́тій }, " має м’яку основу; ", { term: тре́тий }, " — з російської"], en: [{ term: тре́тій }, " has a soft stem; ", { term: тре́тий }, " comes from Russian"], es: [{ term: тре́тій }, " tiene raíz blanda; ", { term: тре́тий }, " viene del ruso"] } }
          - { level: A1, wrong: пе́рший кни́жка, right: [{ target: пе́рша }, " кни́жка"], rule: { uk: "числівник узгоджується з іменником у роді", en: "the ordinal agrees with the noun in gender", es: "el ordinal concuerda en género con el sustantivo" } }
          - { level: A2, wrong: Я живу́ на тре́тій по́версі., right: ["Я живу́ ", { target: на тре́тьому }, " по́версі."], rule: { uk: ["з ", { term: по́верх }, " чоловічого роду — ", { term: на тре́тьому }], en: [{ term: по́верх }, " is masculine: ", { term: на тре́тьому }], es: [{ term: по́верх }, " es masculino: ", { term: на тре́тьому }] } }
          - { level: B1, wrong: 3-ій, right: { target: 3-й }, rule: { uk: "після цифри — лише останні літери", en: "after the figure, only the last letters", es: "tras la cifra, solo las últimas letras" } }
          - { level: A2, speakers: [en], wrong: у дві ти́сячі деся́тий рік, right: ["у дві ти́сячі ", { target: деся́тому ро́ці }], rule: { en: ["a year after ", { term: у }, " takes the locative, and only the last word changes"] } }
