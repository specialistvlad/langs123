title: { uk: "Дієслова руху з префіксами: прийти, вийти, доїхати", en: "Prefixed Verbs of Motion: прийти, вийти, доїхати", es: "Verbos de movimiento con prefijo: прийти, вийти, доїхати", pt: "Verbos de movimento com prefixo: прийти, вийти, доїхати", fr: "Verbes de mouvement préfixés : прийти, вийти, доїхати", de: "Präfigierte Bewegungsverben: прийти, вийти, доїхати", it: "Verbi di moto con prefisso: прийти, вийти, доїхати", pl: "Czasowniki ruchu z przedrostkami: прийти, вийти, доїхати", tr: "Önekli hareket fiilleri: прийти, вийти, доїхати", id: "Kata kerja gerak berprefiks: прийти, вийти, доїхати", vi: "Động từ chuyển động có tiền tố: прийти, вийти, доїхати" }
summary:
  lead:
    uk: ["Префікс уточнює напрямок руху: ", { term: прийти́ }, " — прибути, ", { term: ви́йти }, " — вийти назовні, ", { term: перейти́ }, " — перетнути."]
    en: ["A prefix gives the direction of the movement: ", { term: прийти́ }, " to arrive, ", { term: ви́йти }, " to go out, ", { term: перейти́ }, " to cross."]
    es: ["El prefijo indica la dirección del movimiento: ", { term: прийти́ }, ", llegar; ", { term: ви́йти }, ", salir; ", { term: перейти́ }, ", cruzar."]
    pt: ["O prefixo precisa a direção do movimento: ", { term: прийти́ }, ", chegar; ", { term: ви́йти }, ", sair; ", { term: перейти́ }, ", atravessar."]
    fr: ["Le préfixe précise la direction du mouvement : ", { term: прийти́ }, ", arriver ; ", { term: ви́йти }, ", sortir ; ", { term: перейти́ }, ", traverser."]
    de: ["Das Präfix gibt die Richtung der Bewegung an: ", { term: прийти́ }, " — ankommen, ", { term: ви́йти }, " — hinausgehen, ", { term: перейти́ }, " — überqueren."]
    it: ["Il prefisso precisa la direzione del movimento: ", { term: прийти́ }, " — arrivare, ", { term: ви́йти }, " — uscire, ", { term: перейти́ }, " — attraversare."]
    pl: ["Przedrostek określa kierunek ruchu: ", { term: прийти́ }, " — przybyć, ", { term: ви́йти }, " — wyjść na zewnątrz, ", { term: перейти́ }, " — przejść na drugą stronę."]
    tr: ["Önek hareketin yönünü belirtir: ", { term: прийти́ }, " gelmek, ", { term: ви́йти }, " dışarı çıkmak, ", { term: перейти́ }, " karşıya geçmek demektir."]
    id: ["Prefiks menentukan arah gerakan: ", { term: прийти́ }, " berarti tiba, ", { term: ви́йти }, " keluar, ", { term: перейти́ }, " menyeberang."]
    vi: ["Tiền tố chỉ hướng chuyển động: ", { term: прийти́ }, " — đến, ", { term: ви́йти }, " — đi ra, ", { term: перейти́ }, " — băng qua."]
  rule:
    uk: ["Дієслова з префіксом від ", { term: іти́ }, " і ", { term: ї́хати }, " доконаного виду, а їхні пари недоконаного виду утворено від ", { term: ходи́ти }, " і ", { term: -їжджа́ти }, ":"]
    en: ["Prefixed verbs from ", { term: іти́ }, " and ", { term: ї́хати }, " are perfective, and their imperfective partners come from ", { term: ходи́ти }, " and ", { term: -їжджа́ти }, ":"]
    es: ["Los verbos con prefijo de ", { term: іти́ }, " y ", { term: ї́хати }, " son perfectivos, y sus parejas imperfectivas salen de ", { term: ходи́ти }, " y ", { term: -їжджа́ти }, ":"]
    pt: ["Os verbos com prefixo formados de ", { term: іти́ }, " e ", { term: ї́хати }, " são perfectivos; seus pares imperfectivos vêm de ", { term: ходи́ти }, " e ", { term: -їжджа́ти }, ":"]
    fr: ["Les verbes préfixés formés sur ", { term: іти́ }, " et ", { term: ї́хати }, " sont perfectifs ; leurs équivalents imperfectifs viennent de ", { term: ходи́ти }, " et ", { term: -їжджа́ти }, " :"]
    de: ["Präfigierte Verben von ", { term: іти́ }, " und ", { term: ї́хати }, " sind perfektiv; ihre imperfektiven Partner kommen von ", { term: ходи́ти }, " und ", { term: -їжджа́ти }, ":"]
    it: ["I verbi con prefisso derivati da ", { term: іти́ }, " e ", { term: ї́хати }, " sono perfettivi; i loro corrispondenti imperfettivi vengono da ", { term: ходи́ти }, " e ", { term: -їжджа́ти }, ":"]
    pl: ["Czasowniki z przedrostkiem od ", { term: іти́ }, " i ", { term: ї́хати }, " są dokonane, a ich niedokonane pary tworzy się od ", { term: ходи́ти }, " i ", { term: -їжджа́ти }, ":"]
    tr: ["Önekli fiiller ", { term: іти́ }, " ve ", { term: ї́хати }, " fiillerinden türediğinde tamamlanmış görünüştedir; tamamlanmamış görünüşteki karşılıkları ", { term: ходи́ти }, " ve ", { term: -їжджа́ти }, " fiillerinden gelir:"]
    id: ["Kata kerja berprefiks dari ", { term: іти́ }, " dan ", { term: ї́хати }, " berbentuk perfektif; pasangan imperfektifnya berasal dari ", { term: ходи́ти }, " dan ", { term: -їжджа́ти }, ":"]
    vi: ["Động từ có tiền tố từ ", { term: іти́ }, " và ", { term: ї́хати }, " thuộc thể hoàn thành; cặp chưa hoàn thành lấy từ ", { term: ходи́ти }, " và ", { term: -їжджа́ти }, ":"]
  ex: { examples: [["Вона́ ", { target: прийшла́ }, " о шо́стій."], ["Вона́ за́вжди ", { target: прихо́дить }, " о шо́стій."]] }

