sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Префікс додає до дієслова руху напрямок: ", { term: іти́ }, " — просто рух, ", { term: прийти́ }, " — прибути."]
              en: ["A prefix adds a direction to a verb of motion: ", { term: іти́ }, " is just walking, ", { term: прийти́ }, " is arriving."]
              es: ["El prefijo añade una dirección al verbo de movimiento: ", { term: іти́ }, " es solo andar; ", { term: прийти́ }, ", llegar."]
              pt: ["O prefixo acrescenta uma direção ao verbo de movimento: ", { term: іти́ }, " é só andar, ", { term: прийти́ }, " é chegar."]
              fr: ["Le préfixe ajoute une direction au verbe de mouvement : ", { term: іти́ }, " signifie simplement aller à pied, ", { term: прийти́ }, " signifie arriver."]
              de: ["Das Präfix fügt dem Bewegungsverb eine Richtung hinzu: ", { term: іти́ }, " heißt nur gehen, ", { term: прийти́ }, " heißt ankommen."]
              it: ["Il prefisso aggiunge una direzione al verbo di moto: ", { term: іти́ }, " è solo camminare, ", { term: прийти́ }, " è arrivare."]
              pl: ["Przedrostek dodaje do czasownika ruchu kierunek: ", { term: іти́ }, " to po prostu iść, ", { term: прийти́ }, " to przyjść."]
              tr: ["Önek, hareket fiiline bir yön ekler: ", { term: іти́ }, " yalnızca yürümek, ", { term: прийти́ }, " ise gelmek demektir."]
              id: ["Prefiks menambahkan arah pada kata kerja gerak: ", { term: іти́ }, " hanya berarti berjalan, ", { term: прийти́ }, " berarti tiba."]
              vi: ["Tiền tố thêm hướng cho động từ chuyển động: ", { term: іти́ }, " chỉ là đi bộ, ", { term: прийти́ }, " là đến nơi."]
            ex: { contrast: [["Я ", { target: йду }, " додо́му"], ["Я ", { target: прийшо́в }, " додо́му"]] }
            tr: { en: { contrast: ["I'm walking home", "I've got home"] }, es: { contrast: ["Voy a casa", "Llegué a casa"] }, pt: { contrast: ["Estou indo para casa", "Cheguei em casa"] }, fr: { contrast: ["Je rentre chez moi", "Je suis arrivé chez moi"] }, de: { contrast: ["Ich gehe nach Hause", "Ich bin zu Hause angekommen"] }, it: { contrast: ["Vado a casa", "Sono arrivato a casa"] }, pl: { contrast: ["Idę do domu", "Przyszedłem do domu"] }, tr: { contrast: ["Eve gidiyorum", "Eve geldim"] }, id: { contrast: ["Saya berjalan pulang", "Saya sudah tiba di rumah"] }, vi: { contrast: ["Tôi đang đi bộ về nhà", "Tôi đã về đến nhà"] } }
          - type: rule
            level: B1
            text:
