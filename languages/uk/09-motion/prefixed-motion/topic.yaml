          rule: { uk: "рух геть, на невелику відстань", en: "moving away", es: "alejarse", pt: "afastar-se", fr: "s’éloigner", de: "sich entfernen", it: "allontanarsi", pl: "oddalić się", tr: "uzaklaşma", id: "menjauh", vi: "rời xa" }
