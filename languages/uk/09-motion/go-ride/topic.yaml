          - level: A1
            use: { uk: ["дощ і сніг: ", { term: іде́ дощ }], en: ["rain and snow: ", { term: іде́ дощ }, " (it's raining)"], es: ["la lluvia y la nieve: ", { term: іде́ дощ }, " (llueve)"], pt: ["chuva e neve: ", { term: іде́ дощ }, " (está chovendo)"], fr: ["la pluie et la neige : ", { term: іде́ дощ }, " (il pleut)"], de: ["Regen und Schnee: ", { term: іде́ дощ }, " (es regnet)"], it: ["pioggia e neve: ", { term: іде́ дощ }, " (piove)"], pl: ["deszcz i śnieg: ", { term: іде́ дощ }, " (pada deszcz)"], tr: ["yağmur ve kar: ", { term: іде́ дощ }, " (yağmur yağıyor)"], id: ["hujan dan salju: ", { term: іде́ дощ }, " (hujan turun)"], vi: ["mưa và tuyết: ", { term: іде́ дощ }, " (trời mưa)"] }
            ex: ["На ву́лиці ", { target: йде }, " сніг."]
            tr: { en: "It's snowing outside.", es: "Afuera nieva.", pt: "Está nevando lá fora.", fr: "Il neige dehors.", de: "Draußen schneit es.", it: "Fuori nevica.", pl: "Na dworze pada śnieg.", tr: "Dışarıda kar yağıyor.", id: "Di luar sedang turun salju.", vi: "Ngoài trời đang có tuyết rơi." }

