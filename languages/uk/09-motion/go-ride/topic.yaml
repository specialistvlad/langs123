            ex: ["Ми ", { target: ї́демо }, " додо́му по́їздом."]
            tr: { en: "We're going home by train.", es: "Volvemos a casa en tren.", pt: "Estamos voltando para casa de trem.", fr: "Nous rentrons en train.", de: "Wir fahren mit dem Zug nach Hause.", it: "Torniamo a casa in treno.", pl: "Jedziemy do domu pociągiem.", tr: "Eve trenle gidiyoruz.", id: "Kami pulang naik kereta.", vi: "Chúng tôi về nhà bằng tàu hỏa." }
          - level: A1
