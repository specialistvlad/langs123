              de: ["Das Ukrainische unterscheidet zwischen Gehen zu Fuß (", { term: іти́ }, ") und Fahren mit einem Fahrzeug (", { term: ї́хати }, ")."]
              it: ["L'ucraino distingue lo spostamento a piedi (", { term: іти́ }, ") da quello con un mezzo (", { term: ї́хати }, ")."]
              pl: ["Ukraiński odróżnia ruch pieszo (", { term: іти́ }, ") od ruchu pojazdem (", { term: ї́хати }, ")."]
              tr: ["Ukraynaca, yürüyerek gitmeyi (", { term: іти́ }, ") araçla gitmekten (", { term: ї́хати }, ") ayırır."]
              id: ["Bahasa Ukraina membedakan bergerak dengan berjalan kaki (", { term: іти́ }, ") dan dengan kendaraan (", { term: ї́хати }, ")."]
              vi: ["Tiếng Ukraina phân biệt đi bộ (", { term: іти́ }, ") với đi bằng phương tiện (", { term: ї́хати }, ")."]
            ex: { contrast: [["Я ", { target: йду }, " в шко́лу"], ["Я ", { target: ї́ду }, " в аеропо́рт"]] }
            tr: { en: { contrast: ["I'm walking to school", "I'm going to the airport"] }, es: { contrast: ["Voy a pie a la escuela", "Voy al aeropuerto"] }, pt: { contrast: ["Vou à escola a pé", "Vou para o aeroporto"] }, fr: { contrast: ["Je vais à l’école à pied", "Je vais à l’aéroport"] }, de: { contrast: ["Ich gehe zur Schule", "Ich fahre zum Flughafen"] }, it: { contrast: ["Vado a scuola a piedi", "Vado all'aeroporto"] }, pl: { contrast: ["Idę do szkoły", "Jadę na lotnisko"] }, tr: { contrast: ["Okula yürüyorum", "Havalimanına gidiyorum"] }, id: { contrast: ["Saya berjalan kaki ke sekolah", "Saya pergi ke bandara"] }, vi: { contrast: ["Tôi đi bộ đến trường", "Tôi đi ra sân bay"] } }
          - type: rule
            level: A1
            text:
              uk: "Ці дієслова описують рух в одному напрямку: зараз або в найближчих планах."
              en: "These verbs describe movement in one direction: right now or in a plan."
              es: "Estos verbos describen un movimiento en una dirección: ahora mismo o en un plan."
              pt: "Esses verbos descrevem um movimento em uma direção: agora ou em um plano próximo."
              fr: "Ces verbes décrivent un déplacement dans une seule direction : maintenant ou dans un projet proche."
              de: "Diese Verben beschreiben eine Bewegung in eine Richtung: jetzt oder in einem nahen Plan."
              it: "Questi verbi descrivono un movimento in una direzione: adesso o in un programma vicino."
              pl: "Te czasowniki opisują ruch w jednym kierunku: teraz lub w najbliższych planach."
              tr: "Bu fiiller tek yöne doğru hareketi anlatır; hareket şu an olur ya da yakın bir planda yer alır."
              id: "Kata kerja ini menggambarkan gerakan ke satu arah: sekarang atau dalam rencana dekat."
              vi: "Các động từ này diễn tả chuyển động theo một hướng: ngay lúc này hoặc trong kế hoạch sắp tới."
            ex: ["За́втра ми ", { target: ї́демо }, " на мо́ре."]
            tr: { en: "We're going to the seaside tomorrow.", es: "Mañana vamos al mar.", pt: "Amanhã vamos para a praia.", fr: "Demain, nous allons à la mer.", de: "Morgen fahren wir ans Meer.", it: "Domani andiamo al mare.", pl: "Jutro jedziemy nad morze.", tr: "Yarın denize gidiyoruz.", id: "Besok kami pergi ke pantai.", vi: "Ngày mai chúng tôi đi biển." }
          - type: note
            level: A1
            text:
              uk: ["Регулярний рух має інші дієслова: ", { link: "Іти чи ходити, їхати чи їздити", to: uk.motion.one-way-round-trip }, "."]
              en: ["Regular trips take other verbs: ", { link: "One Way or Round Trip: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              es: ["Los desplazamientos habituales llevan otros verbos: ", { link: "Ida o ida y vuelta: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              pt: ["Os trajetos habituais usam outros verbos: ", { link: "Ida ou ida e volta: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              fr: ["Les trajets habituels demandent d’autres verbes : ", { link: "Aller simple ou aller-retour : іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              de: ["Regelmäßige Wege verlangen andere Verben: ", { link: "Eine Richtung oder hin und zurück: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              it: ["Gli spostamenti abituali vogliono altri verbi: ", { link: "Andata o andata e ritorno: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              pl: ["Ruch regularny wymaga innych czasowników: ", { link: "W jedną stronę czy tam i z powrotem: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              tr: ["Düzenli hareketlerde başka fiiller kullanılır: ", { link: "Tek yön mü, gidiş dönüş mü: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              id: ["Gerakan rutin memakai kata kerja lain: ", { link: "Satu arah atau pulang-pergi: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              vi: ["Việc đi lại thường xuyên dùng các động từ khác: ", { link: "Một chiều hay khứ hồi: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]

  - title: { uk: Форма, en: Form, es: Forma, pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }
