            ex: ["Ді́ти ", { target: йдуть }, " у шко́лу."]
            tr: { en: "The children are walking to school.", es: "Los niños van a la escuela.", pt: "As crianças vão a pé para a escola.", fr: "Les enfants vont à l’école à pied.", de: "Die Kinder gehen zur Schule.", it: "I bambini vanno a scuola a piedi.", pl: "Dzieci idą do szkoły.", tr: "Çocuklar okula yürüyerek gidiyor.", id: "Anak-anak berjalan kaki ke sekolah.", vi: "Bọn trẻ đi bộ đến trường." }
          - level: A1
