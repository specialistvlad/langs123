title: { uk: "Іти і їхати", en: "On Foot or by Transport: іти, їхати", es: "A pie o en vehículo: іти, їхати" }
summary:
  lead:
    uk: ["Дієслово ", { term: іти́ }, " означає рух пішки, ", { term: ї́хати }, " — рух транспортом."]
    en: ["The verb ", { term: іти́ }, " means going on foot, ", { term: ї́хати }, " going by transport."]
    es: ["El verbo ", { term: іти́ }, " significa ir a pie; ", { term: ї́хати }, ", ir en un vehículo."]
  rule:
    uk: ["Поїздка автобусом, поїздом чи машиною — завжди ", { term: ї́хати }, ":"]
    en: ["A trip by bus, train or car always takes ", { term: ї́хати }, ":"]
    es: ["Un viaje en autobús, tren o auto siempre lleva ", { term: ї́хати }, ":"]
  ex: { examples: [["Я ", { target: йду }, " в магази́н."], ["Я ", { target: ї́ду }, " в Ки́їв."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: іти́, en: іти́, es: іти́ }
          rule: { uk: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іде́ }, { term: ідемо́ }, { term: ідете́ }, { term: іду́ть }] }, en: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іде́ }, { term: ідемо́ }, { term: ідете́ }, { term: іду́ть }] }, es: { alternatives: [{ term: іду́ }, { term: іде́ш }, { term: іде́ }, { term: ідемо́ }, { term: ідете́ }, { term: іду́ть }] } }
          ex: ["Він ", { target: іде́ }, " на робо́ту."]
          tr: { en: "He's walking to work.", es: "Va a pie al trabajo." }
        - level: A1
          point: { uk: ї́хати, en: ї́хати, es: ї́хати }
          rule: { uk: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́де }, { term: ї́демо }, { term: ї́дете }, { term: ї́дуть }] }, en: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́де }, { term: ї́демо }, { term: ї́дете }, { term: ї́дуть }] }, es: { alternatives: [{ term: ї́ду }, { term: ї́деш }, { term: ї́де }, { term: ї́демо }, { term: ї́дете }, { term: ї́дуть }] } }
          ex: ["Ми ", { target: ї́демо }, " в Оде́су."]
          tr: { en: "We're going to Odesa.", es: "Vamos a Odesa." }
        - level: A1
          point: { uk: "Пішки чи транспортом", en: "On foot or by transport", es: "A pie o en vehículo" }
          rule: { uk: { contrast: [{ term: іти́ }, { term: ї́хати }] }, en: { contrast: [{ term: іти́ }, { term: ї́хати }] }, es: { contrast: [{ term: іти́ }, { term: ї́хати }] } }
          ex: { contrast: [["Я ", { target: йду }, " додо́му"], ["Я ", { target: ї́ду }, " додо́му"]] }
          tr: { en: { contrast: ["I'm walking home", "I'm going home (by bus, car…)"] }, es: { contrast: ["Voy a casa a pie", "Voy a casa (en autobús, en auto…)"] } }
        - level: A1
          point: { uk: Куди?, en: Where to?, es: ¿Adónde? }
          rule: { uk: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " і знахідний"], en: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " with the accusative"], es: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " con el acusativo"] }
          ex: ["Куди́ ти ", { target: йдеш }, "?"]
          tr: { en: "Where are you going?", es: "¿Adónde vas?" }
        - level: A1
          point: { uk: Транспорт, en: Transport, es: Transporte }
          rule: { uk: { alternatives: [{ term: авто́бусом }, { term: по́їздом }, { term: метро́ }] }, en: { alternatives: [{ term: авто́бусом }, { term: по́їздом }, { term: метро́ }] }, es: { alternatives: [{ term: авто́бусом }, { term: по́їздом }, { term: метро́ }] } }
          ex: ["Окса́на ", { target: ї́де }, " на робо́ту авто́бусом."]
          tr: { en: "Oksana goes to work by bus.", es: "Oksana va al trabajo en autobús." }
        - level: A1
          point: { uk: "Й чи і", en: "Й or і", es: "Й o і" }
          rule: { uk: ["після голосного — ", { term: йду }, ", після приголосного — ", { term: іду́ }], en: [{ term: йду }, " after a vowel, ", { term: іду́ }, " after a consonant"], es: [{ term: йду }, " tras vocal; ", { term: іду́ }, ", tras consonante"] }
          ex: { examples: [["Ми ", { target: йдемо́ }, " в парк."], ["Він ", { target: іде́ }, " в парк."]] }
          tr: { en: { examples: ["We're walking to the park.", "He's walking to the park."] }, es: { examples: ["Vamos al parque.", "Él va al parque."] } }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule: { uk: ["місто, країна, поїздка — ", { term: ї́хати }], en: ["another city, another country, any trip: ", { term: ї́хати }], es: ["otra ciudad, otro país, cualquier viaje: ", { term: ї́хати }] }
          ex: ["За́втра я ", { target: ї́ду }, " у Львів."]
          tr: { en: "I'm going to Lviv tomorrow.", es: "Mañana voy a Leópolis." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Українська розрізняє рух пішки (", { term: іти́ }, ") і рух транспортом (", { term: ї́хати }, ")."]
              en: ["Ukrainian tells going on foot (", { term: іти́ }, ") from going by transport (", { term: ї́хати }, ")."]
              es: ["El ucraniano distingue entre ir a pie (", { term: іти́ }, ") e ir en un vehículo (", { term: ї́хати }, ")."]
            ex: { contrast: [["Я ", { target: йду }, " в шко́лу"], ["Я ", { target: ї́ду }, " в аеропо́рт"]] }
            tr: { en: { contrast: ["I'm walking to school", "I'm going to the airport"] }, es: { contrast: ["Voy a pie a la escuela", "Voy al aeropuerto"] } }
          - type: rule
            level: A1
            text:
              uk: "Ці дієслова описують рух в одному напрямку: зараз або в найближчих планах."
              en: "These verbs describe movement in one direction: right now or in a plan."
              es: "Estos verbos describen un movimiento en una dirección: ahora mismo o en un plan."
            ex: ["За́втра ми ", { target: ї́демо }, " на мо́ре."]
            tr: { en: "We're going to the seaside tomorrow.", es: "Mañana vamos al mar." }
          - type: note
            level: A1
            text:
              uk: ["Регулярний рух має інші дієслова: ", { link: "Іти чи ходити, їхати чи їздити", to: uk.motion.one-way-round-trip }, "."]
              en: ["Regular trips take other verbs: ", { link: "One Way or Round Trip: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]
              es: ["Los desplazamientos habituales llevan otros verbos: ", { link: "Ida o ida y vuelta: іти/ходити, їхати/їздити", to: uk.motion.one-way-round-trip }, "."]

  - title: { uk: Форма, en: Form, es: Forma }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: who, label: { uk: Хто, en: Who, es: Quién } }
          - { key: go, label: іти́, features: { tense: prs } }
          - { key: ride, label: ї́хати, features: { tense: prs } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, who: я, go: { alternatives: [іду́, йду] }, ride: [ї́д, { ending: у }] }
          - { level: A1, features: { person: 2, number: sg }, who: ти, go: { alternatives: [іде́ш, йдеш] }, ride: [ї́д, { ending: еш }] }
          - { level: A1, features: { person: 3, number: sg }, who: { alternatives: [він, вона́, воно́] }, go: { alternatives: [іде́, йде] }, ride: [ї́д, { ending: е }] }
          - { level: A1, features: { person: 1, number: pl }, who: ми, go: { alternatives: [ідемо́, йдемо́] }, ride: [ї́д, { ending: емо }] }
          - { level: A1, features: { person: 2, number: pl }, who: { alternatives: [ви, Ви] }, go: { alternatives: [ідете́, йдете́] }, ride: [ї́д, { ending: ете }] }
          - { level: A1, features: { person: 3, number: pl }, who: вони́, go: { alternatives: [іду́ть, йдуть] }, ride: [ї́д, { ending: уть }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Форми з ", { term: й- }, " стоять після голосного, форми з ", { term: і- }, " — після приголосного."]
              en: ["The forms with ", { term: й- }, " follow a vowel, the forms with ", { term: і- }, " a consonant."]
              es: ["Las formas con ", { term: й- }, " van tras vocal; las formas con ", { term: і- }, ", tras consonante."]
            ex: { examples: [["Вона́ ", { target: йде }, " додо́му."], ["Брат ", { target: іде́ }, " додо́му."]] }
            tr: { en: { examples: ["She's walking home.", "My brother is walking home."] }, es: { examples: ["Ella va a casa a pie.", "Mi hermano va a casa a pie."] } }

  - title: { uk: Вживання, en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            use: { uk: "рух пішки зараз", en: "walking somewhere now", es: "ir a pie ahora" }
            ex: ["Ді́ти ", { target: йдуть }, " у шко́лу."]
            tr: { en: "The children are walking to school.", es: "Los niños van a la escuela." }
          - level: A1
            use: { uk: "поїздка транспортом", en: "a trip by transport", es: "un viaje en vehículo" }
            ex: ["Ми ", { target: ї́демо }, " додо́му по́їздом."]
            tr: { en: "We're going home by train.", es: "Volvemos a casa en tren." }
          - level: A1
            use: { uk: "план на найближчий час", en: "a plan for the near future", es: "un plan para los próximos días" }
            ex: ["У субо́ту я ", { target: йду }, " в теа́тр."]
            tr: { en: "I'm going to the theatre on Saturday.", es: "El sábado voy al teatro." }
          - level: A1
            use: { uk: ["дощ і сніг: ", { term: іде́ дощ }], en: ["rain and snow: ", { term: іде́ дощ }, " (it's raining)"], es: ["la lluvia y la nieve: ", { term: іде́ дощ }, " (llueve)"] }
            ex: ["На ву́лиці ", { target: йде }, " сніг."]
            tr: { en: "It's snowing outside.", es: "Afuera nieva." }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, speakers: [en, es], wrong: Я йду в Ки́їв авто́бусом., right: ["Я ", { target: ї́ду }, " в Ки́їв авто́бусом."], rule: { en: ["by bus, train or car: ", { term: ї́хати }, ", not ", { term: іти́ }], es: ["en autobús, tren o auto: ", { term: ї́хати }, ", no ", { term: іти́ }] } }
          - { level: A1, wrong: Я йду в шко́лі., right: ["Я йду ", { target: в шко́лу }, "."], rule: { uk: "куди? — знахідний відмінок", en: "where to? takes the accusative", es: "¿adónde? lleva el acusativo" } }
