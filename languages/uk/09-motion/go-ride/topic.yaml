            text:
              uk: ["Форми з ", { term: й- }, " стоять після голосного, форми з ", { term: і- }, " — після приголосного."]
              en: ["The forms with ", { term: й- }, " follow a vowel, the forms with ", { term: і- }, " a consonant."]
              es: ["Las formas con ", { term: й- }, " van tras vocal; las formas con ", { term: і- }, ", tras consonante."]
              pt: ["As formas com ", { term: й- }, " vêm depois de vogal; as formas com ", { term: і- }, ", depois de consoante."]
              fr: ["Les formes en ", { term: й- }, " viennent après une voyelle, celles en ", { term: і- }, " après une consonne."]
              de: ["Die Formen mit ", { term: й- }, " stehen nach einem Vokal, die Formen mit ", { term: і- }, " nach einem Konsonanten."]
              it: ["Le forme con ", { term: й- }, " stanno dopo una vocale, quelle con ", { term: і- }, " dopo una consonante."]
              pl: ["Formy z ", { term: й- }, " występują po samogłosce, formy z ", { term: і- }, " — po spółgłosce."]
              tr: [{ term: й- }, " ile başlayan biçimler ünlüden sonra, ", { term: і- }, " ile başlayanlar ünsüzden sonra gelir."]
              id: ["Bentuk dengan ", { term: й- }, " muncul setelah vokal, bentuk dengan ", { term: і- }, " setelah konsonan."]
              vi: ["Dạng có ", { term: й- }, " đứng sau nguyên âm, dạng có ", { term: і- }, " đứng sau phụ âm."]
            ex: { examples: [["Вона́ ", { target: йде }, " додо́му."], ["Брат ", { target: іде́ }, " додо́му."]] }
            tr: { en: { examples: ["She's walking home.", "My brother is walking home."] }, es: { examples: ["Ella va a casa a pie.", "Mi hermano va a casa a pie."] }, pt: { examples: ["Ela vai a pé para casa.", "Meu irmão vai a pé para casa."] }, fr: { examples: ["Elle rentre à pied.", "Mon frère rentre à pied."] }, de: { examples: ["Sie geht nach Hause.", "Mein Bruder geht nach Hause."] }, it: { examples: ["Lei va a casa a piedi.", "Mio fratello va a casa a piedi."] }, pl: { examples: ["Ona idzie do domu.", "Brat idzie do domu."] }, tr: { examples: ["O eve yürüyerek gidiyor.", "Erkek kardeşim eve yürüyerek gidiyor."] }, id: { examples: ["Dia berjalan kaki pulang.", "Saudara laki-laki saya berjalan kaki pulang."] }, vi: { examples: ["Cô ấy đi bộ về nhà.", "Anh trai tôi đi bộ về nhà."] } }

