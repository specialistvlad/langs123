sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: ["Кожне дієслово руху має пару: ", { term: іти́ }, ", ", { term: ї́хати }, " і ", { term: леті́ти }, " називають рух в одному напрямку."]
              en: ["Each verb of motion has a pair: ", { term: іти́ }, ", ", { term: ї́хати }, " and ", { term: леті́ти }, " move in one direction."]
              es: ["Cada verbo de movimiento tiene su pareja: ", { term: іти́ }, ", ", { term: ї́хати }, " y ", { term: леті́ти }, " van en una dirección."]
              pt: ["Cada verbo de movimento tem um par: ", { term: іти́ }, ", ", { term: ї́хати }, " e ", { term: леті́ти }, " indicam movimento em uma direção."]
              fr: ["Chaque verbe de mouvement forme une paire : ", { term: іти́ }, ", ", { term: ї́хати }, " et ", { term: леті́ти }, " désignent un déplacement dans une seule direction."]
              de: ["Jedes Bewegungsverb hat ein Gegenstück: ", { term: іти́ }, ", ", { term: ї́хати }, " und ", { term: леті́ти }, " bezeichnen eine Bewegung in eine Richtung."]
              it: ["Ogni verbo di moto ha una coppia: ", { term: іти́ }, ", ", { term: ї́хати }, " e ", { term: леті́ти }, " indicano un movimento in una direzione."]
              pl: ["Każdy czasownik ruchu ma parę: ", { term: іти́ }, ", ", { term: ї́хати }, " i ", { term: леті́ти }, " oznaczają ruch w jednym kierunku."]
              tr: ["Her hareket fiilinin bir çifti vardır: ", { term: іти́ }, ", ", { term: ї́хати }, " ve ", { term: леті́ти }, " tek yöne doğru hareketi anlatır."]
              id: ["Setiap kata kerja gerak punya pasangan: ", { term: іти́ }, ", ", { term: ї́хати }, " dan ", { term: леті́ти }, " menyatakan gerakan ke satu arah."]
              vi: ["Mỗi động từ chuyển động có một cặp: ", { term: іти́ }, ", ", { term: ї́хати }, " và ", { term: леті́ти }, " chỉ chuyển động theo một hướng."]
          - type: rule
            level: A2
            text:
              uk: ["Дієслова ", { term: ходи́ти }, ", ", { term: ї́здити }, ", ", { term: літа́ти }, " називають регулярний рух, поїздку туди й назад або рух без напрямку."]
              en: ["The verbs ", { term: ходи́ти }, ", ", { term: ї́здити }, " and ", { term: літа́ти }, " name regular trips, a trip there and back, or movement with no direction."]
              es: ["Los verbos ", { term: ходи́ти }, ", ", { term: ї́здити }, " y ", { term: літа́ти }, " nombran trayectos habituales, una ida y vuelta o un movimiento sin dirección."]
              pt: ["Os verbos ", { term: ходи́ти }, ", ", { term: ї́здити }, " e ", { term: літа́ти }, " indicam trajetos habituais, uma ida e volta ou um movimento sem direção."]
              fr: ["Les verbes ", { term: ходи́ти }, ", ", { term: ї́здити }, " et ", { term: літа́ти }, " désignent des trajets habituels, un aller-retour ou un mouvement sans direction."]
              de: ["Die Verben ", { term: ходи́ти }, ", ", { term: ї́здити }, " und ", { term: літа́ти }, " bezeichnen regelmäßige Wege, einen Hin- und Rückweg oder eine Bewegung ohne Richtung."]
              it: ["I verbi ", { term: ходи́ти }, ", ", { term: ї́здити }, " e ", { term: літа́ти }, " indicano spostamenti abituali, un'andata e ritorno o un movimento senza direzione."]
              pl: ["Czasowniki ", { term: ходи́ти }, ", ", { term: ї́здити }, " i ", { term: літа́ти }, " oznaczają ruch regularny, podróż tam i z powrotem lub ruch bez kierunku."]
              tr: ["Düzenli hareketi, gidiş dönüşü ya da yönsüz hareketi ", { term: ходи́ти }, ", ", { term: ї́здити }, " ve ", { term: літа́ти }, " fiilleri anlatır."]
              id: ["Kata kerja ", { term: ходи́ти }, ", ", { term: ї́здити }, ", dan ", { term: літа́ти }, " menyatakan perjalanan rutin, perjalanan pulang-pergi, atau gerakan tanpa arah."]
              vi: ["Các động từ ", { term: ходи́ти }, ", ", { term: ї́здити }, " và ", { term: літа́ти }, " chỉ việc đi lại thường xuyên, đi rồi quay về hoặc chuyển động không có hướng."]
            ex: ["Ми до́вго ", { target: ходи́ли }, " по мі́сту."]
            tr: { en: "We walked around the town for a long time.", es: "Paseamos mucho rato por la ciudad.", pt: "Caminhamos muito tempo pela cidade.", fr: "Nous avons longtemps marché dans la ville.", de: "Wir sind lange durch die Stadt gelaufen.", it: "Abbiamo camminato a lungo per la città.", pl: "Długo chodziliśmy po mieście.", tr: "Şehirde uzun süre dolaştık.", id: "Kami berjalan-jalan lama di kota.", vi: "Chúng tôi đi dạo trong thành phố rất lâu." }

