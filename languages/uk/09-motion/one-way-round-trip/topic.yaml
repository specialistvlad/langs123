              vi: ["Dạng của я (tôi) đổi phụ âm: ", { mapping: [{ term: д }, { term: дж }] }, ", ", { mapping: [{ term: зд }, { term: ждж }] }, "."]
            ex: { examples: [["Я ", { target: ходжу́ }, " пі́шки."], ["Я ", { target: ї́жджу }, " авто́бусом."]] }
            tr: { en: { examples: ["I walk.", "I go by bus."] }, es: { examples: ["Voy a pie.", "Voy en autobús."] }, pt: { examples: ["Eu vou a pé.", "Eu vou de ônibus."] }, fr: { examples: ["Je vais à pied.", "Je vais en bus."] }, de: { examples: ["Ich gehe zu Fuß.", "Ich fahre mit dem Bus."] }, it: { examples: ["Vado a piedi.", "Vado in autobus."] }, pl: { examples: ["Chodzę pieszo.", "Jeżdżę autobusem."] }, tr: { examples: ["Yürüyerek giderim.", "Otobüsle giderim."] }, id: { examples: ["Saya berjalan kaki.", "Saya naik bus."] }, vi: { examples: ["Tôi đi bộ.", "Tôi đi bằng xe buýt."] } }
          - type: rule
