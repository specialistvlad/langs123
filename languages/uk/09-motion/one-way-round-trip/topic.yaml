            level: B2
            text:
              uk: "Додаток стоїть у знахідному відмінку: кого? що?"
              en: "The object stands in the accusative case: whom? what?"
              es: "El objeto va en acusativo: ¿a quién? ¿qué?"
              pt: "O objeto fica no acusativo: quem? o quê?"
              fr: "Le complément d’objet se met à l’accusatif : qui ? quoi ?"
              de: "Das Objekt steht im Akkusativ: wen? was?"
              it: "Il complemento oggetto è all'accusativo: chi? che cosa?"
              pl: "Dopełnienie stoi w bierniku: kogo? co?"
              tr: "Nesne belirtme hâlinde durur: kimi? neyi?"
              id: "Objek berada dalam kasus akusatif: siapa? apa?"
              vi: "Tân ngữ đứng ở đối cách: ai? cái gì?"
            ex: ["Ма́ма веде́ ", { target: дити́ну }, " в садо́к."]
            tr: { en: "Mum is taking the child to nursery.", es: "La mamá lleva al niño al jardín de infancia.", pt: "A mamãe leva a criança para a creche.", fr: "Maman emmène l’enfant à la maternelle.", de: "Die Mama bringt das Kind in den Kindergarten.", it: "La mamma accompagna il bambino all'asilo.", pl: "Mama prowadzi dziecko do przedszkola.", tr: "Anne çocuğu anaokuluna götürüyor.", id: "Ibu mengantar anak ke taman kanak-kanak.", vi: "Mẹ dắt con đến trường mẫu giáo." }
          - type: rule
