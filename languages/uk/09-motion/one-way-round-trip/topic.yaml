              fr: ["La forme de я (je) change ses consonnes : ", { mapping: [{ term: д }, { term: дж }] }, ", ", { mapping: [{ term: зд }, { term: ждж }] }, "."]
              de: ["Die Form für я (ich) verändert ihre Konsonanten: ", { mapping: [{ term: д }, { term: дж }] }, ", ", { mapping: [{ term: зд }, { term: ждж }] }, "."]
