translated: { en: "a23561 5a7943 c56d8c cfec93 0b667d 102409 fb9f68 02b133", es: "a23561 5a7943 c56d8c cfec93 0b667d 102409 fb9f68 02b133" }

title: { uk: "Де, куди, звідки", en: "Where, Where To, Where From: де, куди, звідки", es: "Dónde, adónde, de dónde: де, куди, звідки" }
summary:
  lead:
    uk: "Де? — у, на з місцевим відмінком; куди? — у, на зі знахідним; звідки? — з, від із родовим."
    en: "Where? takes у or на with the locative, where to? the accusative, and where from? з or від with the genitive."
    es: "Para el lugar, у o на van con locativo; para la dirección, con acusativo; para el origen, з o від van con genitivo."
  rule:
    uk: "Те саме у чи на дає два відмінки: місце — місцевий, напрямок — знахідний:"
    en: "The same у or на takes two cases: the locative for a place, the accusative for a direction:"
    es: "El mismo у o на lleva dos casos: el locativo para el lugar y el acusativo para la dirección:"
  ex: { contrast: [["Я ", { target: в Ки́єві }, "."], ["Я ї́ду ", { target: в Ки́їв }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Де?, en: Where?, es: ¿Dónde? }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " і місцевий відмінок"]
            en: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " with the locative"]
            es: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " con el locativo"]
          ex: ["Ма́ма ", { target: на робо́ті }, "."]
          tr: { en: Mum is at work., es: Mamá está en el trabajo. }
        - level: A1
          point: { uk: Куди?, en: Where to?, es: ¿Adónde? }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " і знахідний відмінок"]
            en: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " with the accusative"]
            es: [{ alternatives: [{ term: у }, { term: в }, { term: на }] }, " con el acusativo"]
          ex: ["Ма́ма йде ", { target: на робо́ту }, "."]
          tr: { en: "Mum is going to work.", es: Mamá va al trabajo. }
        - level: A1
          point: { uk: Звідки?, en: Where from?, es: ¿De dónde? }
          rule:
            uk: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " і родовий відмінок"]
            en: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " with the genitive"]
            es: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " con el genitivo"]
          ex: { exchange: ["Зві́дки ви?", ["Я ", { target: з Украї́ни }, "."]] }
          tr: { en: { exchange: [Where are you from?, "I'm from Ukraine."] }, es: { exchange: [¿De dónde es usted?, Soy de Ucrania.] } }
        - level: A1
          point: { uk: Дім, en: Home, es: Casa }
          rule:
            uk: { alternatives: [{ term: вдо́ма }, { term: додо́му }, { term: з до́му }] }
            en: [{ alternatives: [{ term: вдо́ма }, { term: додо́му }, { term: з до́му }] }, ": at, to, from home"]
            es: [{ alternatives: [{ term: вдо́ма }, { term: додо́му }, { term: з до́му }] }, ": en, a, de casa"]
          ex: ["Ді́ти ", { target: вдо́ма }, ", а та́то йде ", { target: додо́му }, "."]
          tr: { en: "The children are at home, and Dad is going home.", es: "Los niños están en casa y papá va a casa." }
        - level: A1
          point: { uk: У чи на, en: У or на, es: У o на }
          rule:
            uk: [{ term: на }, ": ", { term: робо́та }, ", ", { term: по́шта }, ", ", { term: вокза́л }, ", ", { term: ри́нок }, ", ", { term: конце́рт }, ", ", { term: уро́к }]
            en: [{ term: на }, ": work, post office, station, market, concert, lesson"]
            es: [{ term: на }, ": trabajo, correos, estación, mercado, concierto, clase"]
          ex: ["Ми ", { target: на вокза́лі }, "."]
          tr: { en: "We're at the station.", es: Estamos en la estación. }
        - level: A2
          point: { uk: До, en: До, es: До }
          rule:
            uk: [{ term: до }, " і родовий: до кого? до чого?"]
            en: [{ term: до }, " with the genitive: to a person or up to a place"]
            es: [{ term: до }, " con el genitivo: a casa de alguien o hasta un lugar"]
          ex: ["Я йду ", { target: до бабу́сі }, "."]
          tr: { en: "I'm going to Grandma's.", es: Voy a casa de la abuela. }
        - level: A2
          point: { uk: "Біля, навпроти", en: "Біля, навпроти", es: "Біля, навпроти" }
          rule:
            uk: "з родовим відмінком: де саме?"
            en: "with the genitive: where exactly?"
            es: "con el genitivo: ¿dónde exactamente?"
          ex: ["Авто́бус зупиня́ється ", { target: бі́ля теа́тру }, "."]
          tr: { en: The bus stops near the theatre., es: El autobús para cerca del teatro. }
        - level: A2
          point: { uk: "Над, під, перед, за, між", en: "Над, під, перед, за, між", es: "Над, під, перед, за, між" }
          rule:
            uk: "з орудним відмінком: де?"
            en: "with the instrumental: where?"
            es: "con el instrumental: ¿dónde?"
          ex: [{ target: Над столо́м }, " виси́ть ла́мпа."]
          tr: { en: A lamp hangs above the table., es: Sobre la mesa cuelga una lámpara. }
        - level: B1
          point: { uk: "Серед, посеред, недалеко від", en: "Серед, посеред, недалеко від", es: "Серед, посеред, недалеко від" }
          rule:
            uk: "з родовим відмінком: серед чого? де саме?"
            en: "with the genitive: among, in the middle of, not far from"
            es: "con el genitivo: entre, en medio de, no lejos de"
          ex: ["Ми живемо́ ", { target: недале́ко від вокза́лу }, "."]
          tr: { en: We live not far from the station., es: Vivimos cerca de la estación. }
        - level: B1
          point: { uk: Від, en: Від, es: Від }
          rule:
            uk: [{ term: від }, " і родовий: від кого? звідки?"]
            en: [{ term: від }, " with the genitive: from a person, away from"]
            es: [{ term: від }, " con el genitivo: de parte de alguien, lejos de"]
          ex: ["Він поверну́вся ", { target: від лі́каря }, "."]
          tr: { en: He came back from the doctor's., es: Volvió del médico. }
        - level: B1
          point: { uk: Шлях і транспорт, en: Route and transport, es: Camino y transporte }
          rule:
            uk: "орудний відмінок без прийменника"
            en: "the instrumental, with no preposition"
            es: "el instrumental, sin preposición"
          ex: ["Щодня́ ми ї́здимо ", { target: трамва́єм }, "."]
          tr: { en: We go by tram every day., es: Vamos en tranvía todos los días. }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: [{ term: в Украї́ні }, ", ", { term: в Украї́ну }]
            en: [{ term: в Украї́ні }, ", ", { term: в Украї́ну }, ", with у/в"]
            es: [{ term: в Украї́ні }, ", ", { term: в Украї́ну }, ", con у/в"]
          ex: ["Я живу́ ", { target: в Украї́ні }, "."]
          tr: { en: I live in Ukraine., es: Vivo en Ucrania. }

