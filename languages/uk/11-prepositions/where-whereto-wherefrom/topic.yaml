title: { uk: "Де, куди, звідки", en: "Where, Where To, Where From: де, куди, звідки", es: "Dónde, adónde, de dónde: де, куди, звідки", pt: "Onde, para onde, de onde: де, куди, звідки", fr: "Où, vers où, d’où : де, куди, звідки", de: "Wo, wohin, woher: де, куди, звідки", it: "Dove, verso dove, da dove: де, куди, звідки", pl: "Gdzie, dokąd, skąd: де, куди, звідки", tr: "Nerede, nereye, nereden: де, куди, звідки", id: "Di mana, ke mana, dari mana: де, куди, звідки", vi: "Ở đâu, đi đâu, từ đâu: де, куди, звідки" }
summary:
  lead:
    uk: "Де? — у, на з місцевим відмінком; куди? — у, на зі знахідним; звідки? — з, від із родовим."
    en: "Where? takes у or на with the locative, where to? the accusative, and where from? з or від with the genitive."
    es: "Para el lugar, у o на van con locativo; para la dirección, con acusativo; para el origen, з o від van con genitivo."
    pt: "Onde? pede у ou на com o locativo; para onde?, o acusativo; de onde?, з ou від com o genitivo."
    fr: "Où ? prend у ou на avec le locatif, vers où ? l’accusatif, et d’où ? з ou від avec le génitif."
    de: "Wo? steht mit у oder на und dem Lokativ, wohin? mit dem Akkusativ und woher? mit з oder від und dem Genitiv."
    it: "Dove? vuole у o на con il locativo, verso dove? l’accusativo, e da dove? з o від con il genitivo."
    pl: "Gdzie? — у lub на z miejscownikiem, dokąd? — z biernikiem, skąd? — з lub від z dopełniaczem."
    tr: "Nerede? için у veya на ile bulunma hâli, nereye? için belirtme hâli, nereden? için з veya від ile tamlayan hâli gerekir."
    id: "Di mana? memakai у atau на dengan lokatif, ke mana? memakai akusatif, dan dari mana? memakai з atau від dengan genitif."
    vi: "Ở đâu? у, на với vị trí cách; đi đâu? у, на với đối cách; từ đâu? з, від với sinh cách."
  rule:
    uk: "Те саме у чи на дає два відмінки: місце — місцевий, напрямок — знахідний:"
    en: "The same у or на takes two cases: the locative for a place, the accusative for a direction:"
    es: "El mismo у o на lleva dos casos: el locativo para el lugar y el acusativo para la dirección:"
    pt: "O mesmo у ou на leva dois casos: o locativo para o lugar e o acusativo para a direção:"
    fr: "Le même у ou на prend deux cas : le locatif pour un lieu, l’accusatif pour une direction :"
    de: "Dasselbe у oder на steht mit zwei Kasus: dem Lokativ für den Ort und dem Akkusativ für die Richtung:"
    it: "Lo stesso у o на prende due casi: il locativo per il luogo, l’accusativo per la direzione:"
    pl: "To samo у lub на łączy się z dwoma przypadkami: miejscownikiem dla miejsca, biernikiem dla kierunku:"
    tr: "Aynı у veya на iki hâlle kullanılır: yer için bulunma hâli, yön için belirtme hâli:"
    id: "Kata depan у atau на yang sama memakai dua kasus: lokatif untuk tempat, akusatif untuk arah:"
    vi: "Một у hay на đi với hai cách: vị trí cách chỉ nơi chốn, đối cách chỉ hướng:"
  ex: { contrast: [["Я ", { target: в Ки́єві }, "."], ["Я ї́ду ", { target: в Ки́їв }, "."]] }

