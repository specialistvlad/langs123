# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.prepositions.complex-prepositions
lang: uk
kind: grammar
tags: [prepositions, cases]
concepts: [complex-prepositions]
related: [uk.prepositions.other-prepositions, uk.nouns-cases.accusative, uk.nouns-cases.genitive, uk.nouns-cases.instrumental, uk.nouns-cases.dative, uk.sentence.conjunctions]
status: { uk: draft }

title: { uk: "Складні прийменники: незважаючи на, у зв’язку з", en: "Compound Prepositions: незважаючи на, у зв’язку з" }
summary:
  lead:
    uk: ["Складні прийменники ", { term: у зв’язку́ з }, ", ", { term: внаслі́док }, ", ", { term: незважа́ючи на }, " і ", { term: згі́дно з }, " називають причину, поступку й джерело."]
  rule:
    uk: "Складний прийменник вимагає одного відмінка, тому його вивчають разом із відмінком:"
  ex: { examples: [["у зв’язку́ з ", { target: хворо́бою }], ["незважа́ючи на ", { target: спе́ку }], ["згі́дно з ", { target: нака́зом }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт } }
        - { key: rule, label: { uk: Правило } }
        - { key: ex, label: { uk: Приклад } }
      rows:
        - level: B2
          point: { uk: "У зв’язку з" }
          rule: { uk: [{ term: у зв’язку́ з }, " і орудний: причина"] }
          ex: [{ target: У зв’язку́ з хворо́бою }, " Окса́на не прийшла́ на робо́ту."]
        - level: B2
          point: { uk: "Внаслідок, завдяки" }
          rule: { uk: [{ term: внаслі́док }, " і родовий; ", { term: завдяки́ }, " і давальний"] }
          ex: { examples: [[{ target: Внаслі́док дощу́ }, " доро́гу закри́ли."], [{ target: Завдяки́ допомо́зі }, " дру́зів ми зда́ли іспи́т."]] }
        - level: B2
          point: { uk: "Зважаючи на, щодо" }
          rule: { uk: [{ term: зважа́ючи на }, " і знахідний; ", { term: щодо́ }, " і родовий"] }
          ex: { examples: [[{ target: Зважа́ючи на Ва́ші слова́ }, ", мо́жна зроби́ти ви́сновок."], [{ target: Щодо́ ціни́ }, " ми домо́вимося за́втра."]] }
        - level: C1
          point: { uk: "Незважаючи на, попри" }
          rule: { uk: [{ alternatives: [{ term: незважа́ючи на }, { term: по́при }] }, " і знахідний: поступка"] }
          ex: [{ target: Незважа́ючи на спе́ку }, ", ми пішли́ на прогу́лянку."]
        - level: C1
          point: { uk: Всупереч }
          rule: { uk: [{ term: всупере́ч }, " і давальний: проти очікувань"] }
          ex: [{ target: Всупере́ч прогно́зам }, ", ве́чір був те́плий."]
        - level: C2
          point: { uk: "Згідно з, відповідно до" }
          rule: { uk: [{ term: згі́дно з }, " і орудний; ", { term: відпові́дно до }, " і родовий"] }
          ex: { examples: [[{ target: Згі́дно з нака́зом }, " збо́ри відбуду́ться за́втра."], [{ target: Відпові́дно до пра́вил }, " парк зачиня́ється о дев’я́тій."]] }
        - level: C2
          point: { uk: "На підставі, з метою" }
          rule: { uk: [{ term: на підста́ві }, " і ", { term: з ме́тою }, " з родовим"] }
          ex: { examples: [[{ target: На підста́ві докуме́нтів }, " він студе́нт."], [{ target: З ме́тою еконо́мії }, " ми вимика́ємо сві́тло."]] }
        - level: C2
          point: { uk: "Звичайний стиль" }
          rule: { uk: [{ mapping: [{ term: згі́дно з }, { term: за }] }, ", ", { mapping: [{ term: з ме́тою }, { term: для }] }, ", ", { mapping: [{ term: у зв’язку́ з }, { term: че́рез }] }] }
          ex: { equivalence: [[{ target: З ме́тою еконо́мії }, " ми вимика́ємо сві́тло"], [{ target: Для еконо́мії }, " ми вимика́ємо сві́тло"]] }
        - level: B2
          point: { uk: Пастка }
          rule: { uk: [{ term: зважа́ючи на }, " з прийменником ", { term: на }] }
          ex: ["Зважа́ючи ", { target: на ва́ші слова́ }, ", мо́жна зроби́ти ви́сновок."]
        - level: C2
          point: { uk: Пастка }
          rule: { uk: [{ term: згі́дно з }, " з прийменником ", { term: з }] }
          ex: [{ target: Згі́дно з нака́зом }, " збо́ри відбуду́ться за́втра."]

sections:
  - title: { uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              uk: ["Складний прийменник — це кілька слів, як ", { term: у зв’язку́ з }, ", або слово від іншої частини мови, як ", { term: завдяки́ }, "."]
          - type: rule
            level: B2
            text:
              uk: "Після складного прийменника іменник стоїть в одному відмінку: його вивчають разом із прийменником."
            ex: { examples: [["у зв’язку́ з ", { target: хворо́бою }], ["завдяки́ ", { target: допомо́зі }], ["щодо́ ", { target: ціни́ }]] }
          - type: note
            level: B2
            text:
              uk: ["Відмінки після цих прийменників: ", { link: Родовий відмінок, to: uk.nouns-cases.genitive }, ", ", { link: Давальний відмінок, to: uk.nouns-cases.dative }, ", ", { link: Знахідний відмінок, to: uk.nouns-cases.accusative }, ", ", { link: Орудний відмінок, to: uk.nouns-cases.instrumental }, "."]
          - type: note
            level: B2
            text:
              uk: ["Прості прийменники: ", { link: "Інші прийменники: для, про, без, від", to: uk.prepositions.other-prepositions }, "."]

  - title: { uk: "Причина й наслідок: у зв’язку з, внаслідок, завдяки" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { uk: Прийменник } }
          - { key: case, label: { uk: Відмінок } }
          - { key: meaning, label: { uk: Значення } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: B2
            features: { case: ins }
            prep: { term: у зв’язку́ з }
            case: { uk: орудний }
            meaning: { uk: причина події }
            ex: [{ target: У зв’язку́ з хворо́бою }, " Окса́на не прийшла́ на робо́ту."]
          - level: B2
            features: { case: gen }
            prep: { term: внаслі́док }
            case: { uk: родовий }
            meaning: { uk: "причина, що дала наслідок" }
            ex: [{ target: Внаслі́док дощу́ }, " доро́гу закри́ли."]
          - level: B2
            features: { case: dat }
            prep: { term: завдяки́ }
            case: { uk: давальний }
            meaning: { uk: "добра причина, корисний наслідок" }
            ex: [{ target: Завдяки́ допомо́зі }, " дру́зів ми зда́ли іспи́т."]

  - title: { uk: "Посилання: зважаючи на, щодо" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { uk: Прийменник } }
          - { key: case, label: { uk: Відмінок } }
          - { key: meaning, label: { uk: Значення } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: B2
            features: { case: acc }
            prep: { term: зважа́ючи на }
            case: { uk: знахідний }
            meaning: { uk: з огляду на слова чи обставини }
            ex: [{ target: Зважа́ючи на Ва́ші слова́ }, ", мо́жна зроби́ти ви́сновок."]
          - level: B2
            features: { case: gen }
            prep: { term: щодо́ }
            case: { uk: родовий }
            meaning: { uk: "про що йдеться: тема" }
            ex: [{ target: Щодо́ ціни́ }, " ми домо́вимося за́втра."]

  - title: { uk: "Поступка: незважаючи на, попри, всупереч" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { uk: Прийменник } }
          - { key: case, label: { uk: Відмінок } }
          - { key: meaning, label: { uk: Значення } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            features: { case: acc }
            prep: { term: незважа́ючи на }
            case: { uk: знахідний }
            meaning: { uk: "поступка: перешкода не зупиняє дію" }
            ex: [{ target: Незважа́ючи на спе́ку }, ", ми пішли́ на прогу́лянку."]
          - level: C1
            features: { case: acc }
            prep: { term: по́при }
            case: { uk: знахідний }
            meaning: { uk: "те саме значення, що в незважаючи на" }
            ex: [{ target: По́при хворо́бу }, " він пішо́в на робо́ту."]
          - level: C1
            features: { case: dat }
            prep: { term: всупере́ч }
            case: { uk: давальний }
            meaning: { uk: "проти волі, очікувань чи правил" }
            ex: [{ target: Всупере́ч прогно́зам }, ", ве́чір був те́плий."]
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: ["Прийменник ", { term: незважа́ючи на }, " вимагає іменника, сполучник ", { term: незважа́ючи на те що }, " — речення:"]
            ex: { contrast: [[{ target: Незважа́ючи на дощ }, ", ми пішли́ гуля́ти"], [{ target: Незважа́ючи на те що }, " йшов дощ, ми пішли́ гуля́ти"]] }
          - type: note
            level: C1
            text:
              uk: ["Сполучники: ", { link: Сполучники, to: uk.sentence.conjunctions }, "."]

  - title: { uk: "Офіційний і звичайний стиль: згідно з, відповідно до, на підставі, з метою" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: official, label: { uk: Офіційно } }
          - { key: case, label: { uk: Відмінок } }
          - { key: plain, label: { uk: Звичайно } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            features: { case: ins }
            official: { term: згі́дно з }
            case: { uk: орудний }
            plain: { term: за }
            ex: { equivalence: [[{ target: Згі́дно з нака́зом }, " збо́ри відбуду́ться за́втра"], [{ target: За нака́зом }, " збо́ри відбуду́ться за́втра"]] }
          - level: C2
            features: { case: gen }
            official: { term: відпові́дно до }
            case: { uk: родовий }
            plain: { term: за }
            ex: { equivalence: [[{ target: Відпові́дно до пра́вил }, " парк зачиня́ється о дев’я́тій"], [{ target: За пра́вилами }, " парк зачиня́ється о дев’я́тій"]] }
          - level: C2
            features: { case: gen }
            official: { term: на підста́ві }
            case: { uk: родовий }
            plain: { term: за }
            ex: { equivalence: [[{ target: На підста́ві докуме́нтів }, " він студе́нт"], [{ target: За докуме́нтами }, " він студе́нт"]] }
          - level: C2
            features: { case: gen }
            official: { term: з ме́тою }
            case: { uk: родовий }
            plain: { term: для }
            ex: { equivalence: [[{ target: З ме́тою еконо́мії }, " ми вимика́ємо сві́тло"], [{ target: Для еконо́мії }, " ми вимика́ємо сві́тло"]] }
          - level: C2
            features: { case: ins }
            official: { term: у зв’язку́ з }
            case: { uk: орудний }
            plain: { term: че́рез }
            ex: { equivalence: [[{ target: У зв’язку́ з до́щем }, " матч скасува́ли"], [{ target: Че́рез дощ }, " матч скасува́ли"]] }
          - level: C2
            features: { case: ins }
            official: { term: у зв’язку́ з }
            case: { uk: орудний }
            plain: { term: бо }
            ex: { equivalence: [[{ target: У зв’язку́ з хворо́бою }, " Окса́на не прийшла́"], ["Окса́на не прийшла́", { target: ", бо" }, " хворі́є"]] }
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: ["Складні прийменники ", { term: згі́дно з }, ", ", { term: відпові́дно до }, ", ", { term: на підста́ві }, ", ", { term: з ме́тою }, " належать до офіційного стилю: розмова віддає перевагу простим."]

  - title: { uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: У зв’язку́ з хворо́би Окса́на не прийшла́., right: ["У зв’язку́ з ", { target: хворо́бою }, " Окса́на не прийшла́."], rule: { uk: [{ term: у зв’язку́ з }, " стоїть з орудним відмінком"] } }
          - { level: B2, wrong: Завдяки́ допомо́гою ми зда́ли іспи́т., right: ["Завдяки́ ", { target: допомо́зі }, " ми зда́ли іспи́т."], rule: { uk: [{ term: завдяки́ }, " стоїть з давальним відмінком"] } }
          - { level: B2, wrong: "Зважа́ючи ва́ші слова́, мо́жна зроби́ти ви́сновок.", right: ["Зважа́ючи ", { target: на ва́ші слова́ }, ", мо́жна зроби́ти ви́сновок."], rule: { uk: [{ term: зважа́ючи на }, " вимагає прийменника ", { term: на }, " і знахідного відмінка"] } }
          - { level: C1, wrong: "Не зважа́ючи на спе́ку, ми пішли́ на прогу́лянку.", right: [{ target: Незважа́ючи на спе́ку }, ", ми пішли́ на прогу́лянку."], rule: { uk: [{ term: незважа́ючи на }, " пишуть разом"] } }
          - { level: C1, wrong: "Всупере́ч прогно́зів, ве́чір був те́плий.", right: [{ target: Всупере́ч прогно́зам }, ", ве́чір був те́плий."], rule: { uk: [{ term: всупере́ч }, " стоїть з давальним відмінком"] } }
          - { level: C2, wrong: Згі́дно нака́зу збо́ри відбуду́ться за́втра., right: [{ target: Згі́дно з нака́зом }, " збо́ри відбуду́ться за́втра."], rule: { uk: [{ term: згі́дно з }, " і орудний; ", { term: згі́дно нака́зу }, " — з російської"] } }
          - { level: C2, wrong: Відпові́дно пра́вилам парк зачиня́ється о дев’я́тій., right: [{ target: Відпові́дно до пра́вил }, " парк зачиня́ється о дев’я́тій."], rule: { uk: [{ term: відпові́дно до }, " і родовий; ", { term: відпові́дно пра́вилам }, " — з російської"] } }
