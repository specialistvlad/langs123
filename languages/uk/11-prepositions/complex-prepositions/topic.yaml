sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              uk: ["Складний прийменник — це кілька слів, як ", { term: у зв’язку́ з }, ", або слово від іншої частини мови, як ", { term: завдяки́ }, "."]
              en: ["A compound preposition is several words, like ", { term: у зв’язку́ з }, ", or another part of speech, like ", { term: завдяки́ }, "."]
              es: ["Una preposición compuesta es un grupo de palabras, como ", { term: у зв’язку́ з }, ", o una palabra de otra clase, como ", { term: завдяки́ }, "."]
              pt: ["Uma preposição composta é um grupo de palavras, como ", { term: у зв’язку́ з }, ", ou outra classe de palavras, como ", { term: завдяки́ }, "."]
              fr: ["Une préposition composée est un groupe de mots, comme ", { term: у зв’язку́ з }, ", ou un mot d’une autre catégorie, comme ", { term: завдяки́ }, "."]
              de: ["Eine zusammengesetzte Präposition besteht aus mehreren Wörtern, wie ", { term: у зв’язку́ з }, ", oder ist ein Wort einer anderen Wortart, wie ", { term: завдяки́ }, "."]
              it: ["Una preposizione composta è un gruppo di parole, come ", { term: у зв’язку́ з }, ", oppure una parola di un’altra categoria, come ", { term: завдяки́ }, "."]
              pl: ["Przyimek złożony to kilka wyrazów, jak ", { term: у зв’язку́ з }, ", albo wyraz z innej części mowy, jak ", { term: завдяки́ }, "."]
              tr: ["Birleşik edat, ", { term: у зв’язку́ з }, " gibi birkaç sözcükten ya da ", { term: завдяки́ }, " gibi başka bir sözcük türünden oluşur."]
              id: ["Kata depan majemuk terdiri atas beberapa kata, seperti ", { term: у зв’язку́ з }, ", atau kata dari kelas kata lain, seperti ", { term: завдяки́ }, "."]
              vi: ["Giới từ phức là một cụm từ, như ", { term: у зв’язку́ з }, ", hoặc một từ thuộc từ loại khác, như ", { term: завдяки́ }, "."]
          - type: rule
            level: B2
            text:
              uk: "Після складного прийменника іменник стоїть в одному відмінку: його вивчають разом із прийменником."
              en: "After a compound preposition the noun stands in one case: learn the case together with the preposition."
              es: "Tras una preposición compuesta, el sustantivo va en un solo caso: se aprende junto con la preposición."
              pt: "Depois de uma preposição composta, o substantivo fica em um só caso: aprenda-o junto com a preposição."
              fr: "Après une préposition composée, le nom se met à un seul cas : apprenez-le avec la préposition."
              de: "Nach einer zusammengesetzten Präposition steht das Substantiv in einem Kasus: Lernen Sie ihn zusammen mit der Präposition."
              it: "Dopo una preposizione composta il sostantivo sta in un solo caso: lo si impara insieme alla preposizione."
              pl: "Po przyimku złożonym rzeczownik stoi w jednym przypadku: uczy się go razem z przyimkiem."
              tr: "Birleşik edattan sonra isim tek bir hâlde durur: hâli edatla birlikte öğrenin."
              id: "Setelah kata depan majemuk, kata benda memakai satu kasus: pelajari kasus itu bersama kata depannya."
              vi: "Sau giới từ phức, danh từ đứng ở một cách: hãy học cách đó cùng với giới từ."
            ex: { examples: [["у зв’язку́ з ", { target: хворо́бою }], ["завдяки́ ", { target: допомо́зі }], ["щодо́ ", { target: ціни́ }]] }
            tr: { en: { examples: ["because of an illness", "thanks to the help", "regarding the price"] }, es: { examples: ["debido a una enfermedad", "gracias a la ayuda", "en cuanto al precio"] }, pt: { examples: ["por causa de uma doença", "graças à ajuda", "quanto ao preço"] }, fr: { examples: ["en raison d’une maladie", "grâce à l’aide", "au sujet du prix"] }, de: { examples: ["wegen einer Krankheit", "dank der Hilfe", "bezüglich des Preises"] }, it: { examples: ["a causa di una malattia", "grazie all’aiuto", "riguardo al prezzo"] }, pl: { examples: ["w związku z chorobą", "dzięki pomocy", "co do ceny"] }, tr: { examples: ["hastalık nedeniyle", "yardım sayesinde", "fiyata gelince"] }, id: { examples: ["karena sakit", "berkat bantuan", "mengenai harga"] }, vi: { examples: ["vì bị bệnh", "nhờ sự giúp đỡ", "về giá cả"] } }
          - type: note
            level: B2
            text:
              uk: ["Відмінки після цих прийменників: ", { link: Родовий відмінок, to: uk.nouns-cases.genitive }, ", ", { link: Давальний відмінок, to: uk.nouns-cases.dative }, ", ", { link: Знахідний відмінок, to: uk.nouns-cases.accusative }, ", ", { link: Орудний відмінок, to: uk.nouns-cases.instrumental }, "."]
              en: ["Cases after these prepositions: ", { link: "Genitive Case", to: uk.nouns-cases.genitive }, ", ", { link: "Dative Case", to: uk.nouns-cases.dative }, ", ", { link: "Accusative Case", to: uk.nouns-cases.accusative }, ", ", { link: "Instrumental Case", to: uk.nouns-cases.instrumental }, "."]
              es: ["Los casos tras estas preposiciones: ", { link: "El caso genitivo", to: uk.nouns-cases.genitive }, ", ", { link: "El caso dativo", to: uk.nouns-cases.dative }, ", ", { link: "El caso acusativo", to: uk.nouns-cases.accusative }, ", ", { link: "El caso instrumental", to: uk.nouns-cases.instrumental }, "."]
              pt: ["Os casos depois destas preposições: ", { link: "O caso genitivo", to: uk.nouns-cases.genitive }, ", ", { link: "O caso dativo", to: uk.nouns-cases.dative }, ", ", { link: "O caso acusativo", to: uk.nouns-cases.accusative }, ", ", { link: "O caso instrumental", to: uk.nouns-cases.instrumental }, "."]
              fr: ["Les cas après ces prépositions : ", { link: "Le cas génitif", to: uk.nouns-cases.genitive }, ", ", { link: "Le cas datif", to: uk.nouns-cases.dative }, ", ", { link: "Le cas accusatif", to: uk.nouns-cases.accusative }, ", ", { link: "Le cas instrumental", to: uk.nouns-cases.instrumental }, "."]
              de: ["Die Kasus nach diesen Präpositionen: ", { link: "Der Genitiv", to: uk.nouns-cases.genitive }, ", ", { link: "Der Dativ", to: uk.nouns-cases.dative }, ", ", { link: "Der Akkusativ", to: uk.nouns-cases.accusative }, ", ", { link: "Der Instrumental", to: uk.nouns-cases.instrumental }, "."]
              it: ["I casi dopo queste preposizioni: ", { link: "Il caso genitivo", to: uk.nouns-cases.genitive }, ", ", { link: "Il caso dativo", to: uk.nouns-cases.dative }, ", ", { link: "Il caso accusativo", to: uk.nouns-cases.accusative }, ", ", { link: "Il caso strumentale", to: uk.nouns-cases.instrumental }, "."]
              pl: ["Przypadki po tych przyimkach: ", { link: "Dopełniacz", to: uk.nouns-cases.genitive }, ", ", { link: "Celownik", to: uk.nouns-cases.dative }, ", ", { link: "Biernik", to: uk.nouns-cases.accusative }, ", ", { link: "Narzędnik", to: uk.nouns-cases.instrumental }, "."]
