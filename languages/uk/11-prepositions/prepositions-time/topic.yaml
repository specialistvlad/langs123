            ex: ["Оле́г підписа́в контра́кт ", { target: на рік }, "."]
            tr: { en: Oleh signed a contract for a year., es: Oleh firmó un contrato por un año. }
          - level: B1
            use: { uk: [{ term: тому́ }, " після проміжку часу: скільки минуло?"], en: [{ term: тому́ }, " after the length of time: how long ago?"], es: [{ term: тому́ }, " tras el tiempo transcurrido: ¿hace cuánto?"] }
