title: { uk: Прийменники часу, en: Prepositions of Time, es: Preposiciones de tiempo }
summary:
  lead:
    uk: "Коли, з якого часу, до якого і як довго: у, з, до, перед, через, за, на, о й тому з потрібними відмінками."
    en: "When, from when, until when and for how long: у, з, до, перед, через, за, на, о and тому with their cases."
    es: "Cuándo, desde cuándo, hasta cuándo y cuánto tiempo: у, з, до, перед, через, за, на, о y тому con sus casos."
  rule:
    uk: "День тижня стоїть у знахідному відмінку, місяць — у місцевому:"
    en: "A day of the week takes the accusative, a month the locative:"
    es: "El día de la semana va en acusativo; el mes, en locativo:"
  ex: { examples: [["у ", { target: { weekday: п’я́тницю, value: 5 } }], ["у ", { target: { date: бе́резні, value: "--03" } }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: День, en: Day, es: Día }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, " і знахідний"]
            en: [{ alternatives: [{ term: у }, { term: в }] }, " with the accusative"]
            es: [{ alternatives: [{ term: у }, { term: в }] }, " con el acusativo"]
          ex: ["До зу́стрічі ", { target: ["в ", { weekday: понеді́лок, value: 1 }] }, "!"]
          tr: { en: See you on Monday!, es: ¡Hasta el lunes! }
        - level: A1
          point: { uk: Місяць, en: Month, es: Mes }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, " і місцевий"]
            en: [{ alternatives: [{ term: у }, { term: в }] }, " with the locative"]
            es: [{ alternatives: [{ term: у }, { term: в }] }, " con el locativo"]
          ex: ["Ми ї́демо ", { target: ["в ", { date: се́рпні, value: "--08" }] }, "."]
          tr: { en: "We're going in August.", es: Nos vamos en agosto. }
        - level: A2
          point: { uk: Рік, en: Year, es: Año }
          rule:
            uk: [{ alternatives: [{ term: у }, { term: в }] }, " і місцевий: ", { term: ["у ", { gap: true }, " ро́ці"] }]
            en: [{ alternatives: [{ term: у }, { term: в }] }, " with the locative: ", { term: ["у ", { gap: true }, " ро́ці"] }]
            es: [{ alternatives: [{ term: у }, { term: в }] }, " con el locativo: ", { term: ["у ", { gap: true }, " ро́ці"] }]
          ex: ["Ми познайо́милися ", { target: ["у ", { date: дві ти́сячі чотирна́дцятому ро́ці, value: "2014" }] }, "."]
          tr: { en: We met in 2014., es: Nos conocimos en 2014. }
        - level: A2
          point: { uk: "З … до …", en: "From … until …", es: "De … a …" }
          rule:
            uk: [{ term: з }, " і ", { term: до }, " з родовим"]
            en: [{ term: з }, " and ", { term: до }, " with the genitive"]
            es: [{ term: з }, " y ", { term: до }, " con el genitivo"]
          ex: ["Я працю́ю ", { target: ["з ", { weekday: понеді́лка, value: 1 }, " до ", { weekday: п’я́тниці, value: 5 }] }, "."]
          tr: { en: I work from Monday to Friday., es: Trabajo de lunes a viernes. }
        - level: A2
          point: { uk: "Перед, після", en: "Перед, після", es: "Перед, після" }
          rule:
            uk: [{ term: пе́ред }, " з орудним: раніше за подію; ", { term: пі́сля }, " з родовим: пізніше"]
            en: [{ term: пе́ред }, " with the instrumental: before an event; ", { term: пі́сля }, " with the genitive: after it"]
            es: [{ term: пе́ред }, " con el instrumental: antes de algo; ", { term: пі́сля }, " con el genitivo: después"]
          ex: { examples: [[{ target: Пе́ред обі́дом }, " тре́ба ми́ти ру́ки."], [{ target: Пі́сля обі́ду }, " ми гуля́ємо в па́рку."]] }
          tr: { en: { examples: [You should wash your hands before lunch., After lunch we walk in the park.] }, es: { examples: [Hay que lavarse las manos antes de comer., Después del almuerzo paseamos por el parque.] } }
        - level: B1
          point: { uk: Через, en: Через, es: Через }
          rule:
            uk: [{ term: че́рез }, " зі знахідним: через скільки часу?"]
            en: [{ term: че́рез }, " with the accusative: in how long from now"]
            es: [{ term: че́рез }, " con el acusativo: dentro de cuánto tiempo"]
          ex: ["Оле́на поверне́ться ", { target: че́рез ти́ждень }, "."]
          tr: { en: Olena will be back in a week., es: Olena volverá dentro de una semana. }
        - level: B1
          point: { uk: За, en: За, es: За }
          rule:
            uk: [{ term: за }, " зі знахідним: за скільки часу дію завершено?"]
            en: [{ term: за }, " with the accusative: how long it takes to finish"]
            es: [{ term: за }, " con el acusativo: cuánto se tarda en terminar"]
          ex: ["Ви́вчити нові́ слова́ ", { target: за мі́сяць }, "."]
          tr: { en: Learn the new words in a month., es: Aprender las palabras nuevas en un mes. }
        - level: B1
          point: { uk: На, en: На, es: На }
          rule:
            uk: [{ term: на }, " зі знахідним: на який час?"]
            en: [{ term: на }, " with the accusative: for how long it is planned"]
            es: [{ term: на }, " con el acusativo: para cuánto tiempo"]
          ex: ["Оле́г підписа́в контра́кт ", { target: на рік }, "."]
          tr: { en: Oleh signed a contract for a year., es: Oleh firmó un contrato por un año. }
        - level: B1
          point: { uk: Тому, en: Тому, es: Тому }
          rule:
            uk: [{ term: тому́ }, " після проміжку часу: скільки часу минуло?"]
            en: [{ term: тому́ }, " after the length of time: how long ago"]
            es: [{ term: тому́ }, " tras el tiempo transcurrido: hace cuánto"]
          ex: ["Вона́ приї́хала ", { target: три дні тому́ }, "."]
          tr: { en: She arrived three days ago., es: Llegó hace tres días. }
        - level: B1
          point: { uk: О, en: О, es: О }
          rule:
            uk: [{ term: о }, " з місцевим: о котрій годині?"]
            en: [{ term: о }, " with the locative: at what time?"]
            es: [{ term: о }, " con el locativo: ¿a qué hora?"]
          ex: ["Заня́ття почина́ються ", { target: ["о ", { time: дев’я́тій, value: "09:00" }] }, " годи́ні."]
          tr: { en: Classes start at nine o'clock., es: Las clases empiezan a las nueve. }

