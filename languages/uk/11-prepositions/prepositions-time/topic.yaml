summary:
  lead:
    uk: "Коли, з якого часу, до якого і як довго: у, з, до, перед, через, за, на, о й тому з потрібними відмінками."
    en: "When, from when, until when and for how long: у, з, до, перед, через, за, на, о and тому with their cases."
    es: "Cuándo, desde cuándo, hasta cuándo y cuánto tiempo: у, з, до, перед, через, за, на, о y тому con sus casos."
    pt: "Quando, desde quando, até quando e por quanto tempo: у, з, до, перед, через, за, на, о e тому com os seus casos."
    fr: "Quand, depuis quand, jusqu’à quand et pendant combien de temps : у, з, до, перед, через, за, на, о et тому avec leurs cas."
    de: "Wann, seit wann, bis wann und wie lange: у, з, до, перед, через, за, на, о und тому mit ihren Kasus."
    it: "Quando, da quando, fino a quando e per quanto tempo: у, з, до, перед, через, за, на, о e тому con i loro casi."
    pl: "Kiedy, od kiedy, do kiedy i jak długo: у, з, до, перед, через, за, на, о i тому z odpowiednimi przypadkami."
    tr: "Ne zaman, ne zamandan beri, ne zamana kadar ve ne kadar süreyle: у, з, до, перед, через, за, на, о ve тому, kendi hâlleriyle."
    id: "Kapan, sejak kapan, sampai kapan, dan berapa lama: у, з, до, перед, через, за, на, о, dan тому beserta kasusnya."
    vi: "Khi nào, từ khi nào, đến khi nào và trong bao lâu: у, з, до, перед, через, за, на, о và тому cùng các cách đi kèm."
  rule:
    uk: "День тижня стоїть у знахідному відмінку, місяць — у місцевому:"
    en: "A day of the week takes the accusative, a month the locative:"
    es: "El día de la semana va en acusativo; el mes, en locativo:"
    pt: "O dia da semana vai no acusativo; o mês, no locativo:"
    fr: "Un jour de la semaine se met à l’accusatif, un mois au locatif :"
    de: "Der Wochentag steht im Akkusativ, der Monat im Lokativ:"
    it: "Il giorno della settimana va all’accusativo, il mese al locativo:"
    pl: "Dzień tygodnia stoi w bierniku, miesiąc — w miejscowniku:"
    tr: "Haftanın günü belirtme hâlinde, ay bulunma hâlinde kullanılır:"
    id: "Hari dalam seminggu memakai akusatif, bulan memakai lokatif:"
    vi: "Thứ trong tuần đứng ở đối cách, tháng đứng ở vị trí cách:"
  ex: { examples: [["у ", { target: { weekday: п’я́тницю, value: 5 } }], ["у ", { target: { date: бе́резні, value: "--03" } }]] }

