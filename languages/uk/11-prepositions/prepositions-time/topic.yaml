          - level: B1
            use: { uk: [{ alternatives: [{ term: о }, { term: об }] }, " і місцевий: о котрій?"], en: [{ alternatives: [{ term: о }, { term: об }] }, " with the locative: at what time?"], es: [{ alternatives: [{ term: о }, { term: об }] }, " con el locativo: ¿a qué hora?"] }
            ex: ["Заня́ття почина́ються ", { target: ["о ", { time: дев’я́тій, value: "09:00" }] }, " годи́ні."]
            tr: { en: Classes start at nine o'clock., es: Las clases empiezan a las nueve. }
