summary:
  lead:
    uk: "Прийменники про, з, для, без, від, до, крім, замість, за, на, через: що кожен означає і з яким відмінком стоїть."
    en: "The prepositions про, з, для, без, від, до, крім, замість, за, на and через: what each one means and which case it takes."
    es: "Las preposiciones про, з, для, без, від, до, крім, замість, за, на y через: qué significa cada una y qué caso pide."
    pt: "As preposições про, з, для, без, від, до, крім, замість, за, на e через: o que cada uma significa e com que caso se usa."
    fr: "Les prépositions про, з, для, без, від, до, крім, замість, за, на et через : ce que chacune signifie et quel cas elle demande."
    de: "Die Präpositionen про, з, для, без, від, до, крім, замість, за, на und через: was jede bedeutet und mit welchem Kasus sie steht."
    it: "Le preposizioni про, з, для, без, від, до, крім, замість, за, на e через: che cosa significa ciascuna e con quale caso si usa."
    pl: "Przyimki про, з, для, без, від, до, крім, замість, за, на i через: co oznacza każdy z nich i z jakim przypadkiem się łączy."
    tr: "Edatlar про, з, для, без, від, до, крім, замість, за, на ve через: her birinin anlamı ve hangi hâlle kullanıldığı."
    id: "Kata depan про, з, для, без, від, до, крім, замість, за, на, dan через: makna masing-masing dan kasus yang menyertainya."
    vi: "Các giới từ про, з, для, без, від, до, крім, замість, за, на và через: mỗi giới từ mang nghĩa gì và đi với cách nào."
  rule:
    uk: "Кожен прийменник стоїть зі своїм відмінком, тому його вивчають разом із відмінком:"
    en: "Each preposition takes its own case, so learn it together with the case:"
    es: "Cada preposición pide su caso; por eso se aprende junto con él:"
    pt: "Cada preposição pede o seu caso; por isso, aprenda-a junto com ele:"
    fr: "Chaque préposition demande son cas, donc apprenez-la avec lui :"
    de: "Jede Präposition verlangt ihren eigenen Kasus, also lernen Sie sie zusammen mit ihm:"
    it: "Ogni preposizione vuole il suo caso, quindi si impara insieme a esso:"
    pl: "Każdy przyimek wymaga swojego przypadku, więc uczy się go razem z nim:"
    tr: "Her edat kendi hâliyle kullanılır, bu yüzden edatı hâliyle birlikte öğrenin:"
    id: "Setiap kata depan memakai kasusnya sendiri, jadi pelajari keduanya bersama:"
    vi: "Mỗi giới từ đi với một cách riêng, nên hãy học giới từ cùng với cách của nó:"
