title: { uk: "Інші прийменники: для, про, без, від", en: "Other Prepositions: для, про, без, від", es: "Otras preposiciones: для, про, без, від" }
summary:
  lead:
    uk: "Прийменники про, з, для, без, від, до, крім, замість, за, на, через: що кожен означає і з яким відмінком стоїть."
    en: "The prepositions про, з, для, без, від, до, крім, замість, за, на and через: what each one means and which case it takes."
    es: "Las preposiciones про, з, для, без, від, до, крім, замість, за, на y через: qué significa cada una y qué caso pide."
  rule:
    uk: "Кожен прийменник стоїть зі своїм відмінком, тому його вивчають разом із відмінком:"
    en: "Each preposition takes its own case, so learn it together with the case:"
    es: "Cada preposición pide su caso; por eso se aprende junto con él:"
  ex: { examples: [["з ", { target: Оле́ною }], ["для ", { target: дру́га }], ["про ", { target: тебе́ }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { uk: Про, en: Про, es: Про }
          rule:
            uk: [{ term: про }, " і знахідний: про кого? про що?"]
            en: [{ term: про }, " (about) with the accusative"]
            es: [{ term: про }, " (sobre) con el acusativo"]
          ex: ["Я ду́маю ", { target: про відпочи́нок }, "."]
          tr: { en: "I'm thinking about a holiday.", es: Pienso en las vacaciones. }
        - level: A2
          point: { uk: "З: разом", en: "З: together", es: "З: con alguien" }
          rule:
            uk: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " і орудний: з ким?"]
            en: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " with the instrumental: with whom?"]
            es: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " con el instrumental: ¿con quién?"]
          ex: ["Дмитро́ розмовля́є ", { target: з Оле́ною }, "."]
          tr: { en: Dmytro is talking to Olena., es: Dmytro habla con Olena. }
        - level: A2
          point: { uk: "З: ознака", en: "З: feature", es: "З: rasgo" }
          rule:
            uk: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " і орудний: з чим?"]
            en: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " with the instrumental: with what?"]
            es: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " con el instrumental: ¿con qué?"]
          ex: ["Я люблю́ чай ", { target: із лимо́ном }, "."]
          tr: { en: I like tea with lemon., es: Me gusta el té con limón. }
        - level: A2
          point: { uk: Для, en: Для, es: Для }
          rule:
            uk: [{ term: для }, " і родовий: для кого? для чого?"]
            en: [{ term: для }, " (for) with the genitive"]
            es: [{ term: для }, " (para) con el genitivo"]
          ex: ["Спорт кори́сний ", { target: для здоро́в’я }, "."]
          tr: { en: Sport is good for your health., es: El deporte es bueno para la salud. }
        - level: A2
          point: { uk: "З: матеріал", en: "З: material", es: "З: material" }
          rule:
            uk: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " і родовий: з чого?"]
            en: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " with the genitive: made of what?"]
            es: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " con el genitivo: ¿de qué está hecho?"]
          ex: ["компо́т ", { target: зі сві́жих фру́ктів }]
          tr: { en: fresh fruit compote, es: compota de fruta fresca }
        - level: B1
          point: { uk: Без, en: Без, es: Без }
          rule:
            uk: [{ term: без }, " і родовий: без кого? без чого?"]
            en: [{ term: без }, " (without) with the genitive"]
            es: [{ term: без }, " (sin) con el genitivo"]
          ex: ["Я п’ю ка́ву ", { target: без цу́кру }, "."]
          tr: { en: I drink coffee without sugar., es: Tomo el café sin azúcar. }
        - level: B1
          point: { uk: Від, en: Від, es: Від }
          rule:
            uk: [{ term: від }, " і родовий: причина, порівняння"]
            en: [{ term: від }, " with the genitive: a cause, a comparison"]
            es: [{ term: від }, " con el genitivo: una causa, una comparación"]
          ex: ["Брат ви́щий ", { target: від ме́не }, "."]
          tr: { en: My brother is taller than me., es: Mi hermano es más alto que yo. }
        - level: B1
          point: { uk: "З: галузь", en: "З: subject", es: "З: materia" }
          rule:
            uk: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " і родовий: з якого предмета?"]
            en: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " with the genitive: in which subject?"]
            es: [{ alternatives: [{ term: з }, { term: із }, { term: зі }] }, " con el genitivo: ¿de qué materia?"]
          ex: ["Це підру́чник ", { target: із фі́зики }, "."]
          tr: { en: This is a physics textbook., es: Es un libro de física. }
        - level: B1
          point: { uk: До, en: До, es: До }
          rule:
            uk: [{ term: до }, " і родовий: до чого належить?"]
            en: [{ term: до }, " with the genitive: what it belongs to"]
            es: [{ term: до }, " con el genitivo: a qué pertenece"]
          ex: ["Шука́ємо дета́лі ", { target: до автомобі́ля }, "."]
          tr: { en: "We're looking for car parts.", es: Buscamos piezas para el auto. }
        - level: B1
          point: { uk: "За, через", en: "За, через", es: "За, через" }
          rule:
            uk: [{ term: за }, " і знахідний — заради чого; ", { term: че́рез }, " і знахідний — причина"]
            en: [{ term: за }, " with the accusative: for a cause; ", { term: че́рез }, " with the accusative: because of"]
            es: [{ term: за }, " con acusativo: por una causa; ", { term: че́рез }, " con acusativo: a causa de"]
          ex: { examples: [["Вони́ боро́лися ", { target: за свобо́ду }, "."], ["Ми не ви́йшли ", { target: че́рез дощ }, "."]] }
          tr: { en: { examples: [They fought for freedom., "We didn't go out because of the rain."] }, es: { examples: [Lucharon por la libertad., No salimos por la lluvia.] } }
        - level: B1
          point: { uk: На, en: На, es: На }
          rule:
            uk: [{ term: на }, " і знахідний: ", { alternatives: [{ term: схо́жий на }, { term: хворі́ти на }] }]
            en: [{ term: на }, " with the accusative: ", { alternatives: [{ term: схо́жий на }, { term: хворі́ти на }] }, " (look like, be ill with)"]
            es: [{ term: на }, " con el acusativo: ", { alternatives: [{ term: схо́жий на }, { term: хворі́ти на }] }, " (parecerse a, estar enfermo de)"]
          ex: ["Син схо́жий ", { target: на ба́тька }, "."]
          tr: { en: The son looks like his father., es: El hijo se parece a su padre. }
        - level: B1
          point: { uk: "Крім, замість", en: "Крім, замість", es: "Крім, замість" }
          rule:
            uk: [{ term: крім }, " і ", { term: замі́сть }, " з родовим: хто чи що поза групою, що замість чого"]
            en: [{ term: крім }, " (except) and ", { term: замі́сть }, " (instead of) with the genitive"]
            es: [{ term: крім }, " (excepto) y ", { term: замі́сть }, " (en lugar de) con el genitivo"]
          ex: ["Я п’ю чай ", { target: замі́сть ка́ви }, "."]
          tr: { en: I drink tea instead of coffee., es: Tomo té en lugar de café. }

