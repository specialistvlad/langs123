  - title: { uk: "Короткі частини й пропущені дієслова", en: "Short clauses and omitted verbs", es: "Oraciones cortas y verbos omitidos", pt: "Orações curtas e verbos omitidos", fr: "Propositions courtes et verbes omis", de: "Kurze Teilsätze und ausgelassene Verben", it: "Proposizioni brevi e verbi omessi", pl: "Krótkie części i pominięte czasowniki", tr: "Kısa cümleler ve düşen fiiller", id: "Klausa pendek dan verba yang dilesapkan", vi: "Mệnh đề ngắn và động từ bị lược bỏ" }
