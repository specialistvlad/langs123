            use: { uk: "закрита структура з паралельними частинами: на місці пропущеного дієслова в другій частині стоїть тире", en: "closed structure with parallel clauses: a dash stands where the verb of the second clause is omitted", es: "estructura cerrada con oraciones paralelas: una raya ocupa el lugar del verbo omitido en la segunda", pt: "estrutura fechada com orações paralelas: um travessão ocupa o lugar do verbo omitido na segunda", fr: "structure fermée à propositions parallèles : un tiret tient la place du verbe omis dans la seconde", de: "geschlossene Struktur mit parallelen Teilsätzen: Wo im zweiten das Verb fehlt, steht ein Gedankenstrich", it: "struttura chiusa con proposizioni parallele: un trattino prende il posto del verbo omesso nella seconda", pl: "struktura zamknięta z częściami równoległymi: w drugiej części myślnik zastępuje pominięty czasownik", tr: "paralel cümleli kapalı yapı: ikinci cümlede düşen fiilin yerine tire konur", id: "struktur tertutup dengan klausa paralel: tanda pisah menggantikan verba yang dilesapkan pada klausa kedua", vi: "cấu trúc đóng với các mệnh đề song song: dấu gạch ngang thay cho động từ bị lược bỏ ở mệnh đề thứ hai" }
            ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
            tr: { en: "In the forest there are mushrooms, in the meadow flowers.", es: "En el bosque hay hongos; en el prado, flores.", pt: "Na floresta há cogumelos; no prado, flores.", fr: "Dans la forêt, des champignons ; dans la prairie, des fleurs.", de: "Im Wald wachsen Pilze, auf der Wiese Blumen.", it: "Nel bosco ci sono i funghi, nel prato i fiori.", pl: "W lesie rosną grzyby, na łące kwiaty.", tr: "Ormanda mantarlar, çayırda çiçekler var.", id: "Di hutan ada jamur, di padang rumput ada bunga.", vi: "Trong rừng có nấm, ngoài đồng cỏ có hoa." }
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: "Пропущене дієслово легко відновити з першої частини, тому тире замінює його."
              en: "The omitted verb is easy to restore from the first clause, so a dash replaces it."
              es: "El verbo omitido se recupera fácilmente de la primera oración, y por eso la raya lo sustituye."
              pt: "O verbo omitido é fácil de recuperar a partir da primeira oração, por isso o travessão o substitui."
              fr: "On retrouve facilement le verbe omis grâce à la première proposition, donc un tiret le remplace."
              de: "Das ausgelassene Verb lässt sich leicht aus dem ersten Teilsatz ergänzen, darum ersetzt es ein Gedankenstrich."
              it: "Il verbo omesso si recupera facilmente dalla prima proposizione, perciò un trattino lo sostituisce."
              pl: "Pominięty czasownik łatwo odtworzyć z pierwszej części, dlatego zastępuje go myślnik."
              tr: "Düşen fiil ilk cümleden kolayca anlaşılır, bu yüzden yerine tire konur."
              id: "Verba yang dilesapkan mudah dipulihkan dari klausa pertama, sehingga tanda pisah menggantikannya."
              vi: "Động từ bị lược bỏ dễ suy ra từ mệnh đề thứ nhất, nên dấu gạch ngang thay cho nó."

