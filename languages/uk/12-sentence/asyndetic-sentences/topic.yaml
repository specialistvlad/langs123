# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.sentence.asyndetic-sentences
lang: uk
kind: grammar
tags: [asyndetic-sentences, compound-sentences, punctuation, dash, colon]
concepts: [asyndetic-sentences]
related: [uk.sentence.conjunctions, uk.sentence.when-if, uk.sentence.word-order]
status: { uk: draft }

title: { uk: "Безсполучникові складні речення" }
summary:
  lead:
    uk: "Частини безсполучникового речення поєднує інтонація: кома чи крапка з комою позначають перелік, тире — наслідок, умову й протиставлення, двокрапка — пояснення."
  rule:
    uk: "Знак між частинами показує, як вони пов’язані:"
  ex: { examples: [["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."], ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт } }
        - { key: rule, label: { uk: Правило } }
        - { key: ex, label: { uk: Приклад } }
      rows:
        - level: C1
          point: { uk: Відкрита структура }
          rule:
            uk: "рівноправні частини — ряд подій чи станів; можна додати ще одну"
          ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці", { target: "," }, " задзвені́ли струмки́."]
        - level: C1
          point: { uk: Закрита структура }
          rule:
            uk: "дві частини залежать одна від одної: умова, протиставлення, час"
          ex: ["Він мовча́в", { target: " —" }, " вона́ говори́ла за двох."]
        - level: C1
          point: { uk: "Кома, крапка з комою" }
          rule:
            uk: "послідовність чи одночасність; крапка з комою — коли частини вже мають коми"
          ex: ["Со́нце сі́ло, не́бо поги́сло", { target: ";" }, " у селі́ засвіти́лися ві́кна."]
        - level: C1
          point: { uk: Тире }
          rule:
            uk: "наслідок, умова, протиставлення, час"
          ex: ["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."]
        - level: C1
          point: { uk: Двокрапка }
          rule:
            uk: "друга частина пояснює першу або називає причину"
          ex: ["Усе́ було́ я́сно", { target: ":" }, " вони́ програ́ли."]
        - level: C2
          point: { uk: Короткі частини }
          rule:
            uk: [{ term: по́тім }, " і ", { term: тоді́ }, " показують послідовність, а знак лишається комою"]
          ex: ["Споча́тку впа́ли сніги́", { target: "," }, " по́тім вда́рили моро́зи."]
        - level: C2
          point: { uk: Пропущене дієслово }
          rule:
            uk: "у другій частині на його місці стоїть тире"
          ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
        - level: C2
          point: { uk: Вибір знака }
          rule:
            uk: [{ term: і }, " — кома; ", { term: то }, ", ", { term: але́ }, " — тире; ", { term: тому́ що }, " — двокрапка"]
          ex: ["Ля́жеш пі́зно", { target: " —" }, " вра́нці не вста́неш."]
        - level: C1
          point: { uk: Пастка }
          rule:
            uk: "причина — двокрапка, а не кома"
          ex: ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]
        - level: C2
          point: { uk: Пастка }
          rule:
            uk: "без дієслова в другій частині не забуваємо тире"
          ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]

sections:
  - title: { uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: "У безсполучниковому реченні сполучника немає: частини поєднує інтонація, а на письмі — розділовий знак."
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці."]
          - type: note
            level: C1
            text:
              uk: ["Ті самі зв’язки зі сполучниками: ", { link: Сполучники, to: uk.sentence.conjunctions }, ", ", { link: "Коли, якщо, якби", to: uk.sentence.when-if }, "."]

  - title: { uk: "Структура: відкрита й закрита" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Структура } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: "відкрита: частини рівноправні, це ряд подій чи станів, і можна додати ще одну частину" }
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці", { target: "," }, " задзвені́ли струмки́."]
          - level: C1
            use: { uk: "закрита: дві частини залежать одна від одної, друга виражає умову, протиставлення чи час" }
            ex: ["Не бу́де дощу́", { target: " —" }, " не бу́де врожа́ю."]

  - title: { uk: "Відношення між частинами й знаки" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Відношення } }
          - { key: sign, label: { uk: Знак } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: "послідовність, одночасність" }
            sign: { uk: кома }
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці."]
          - level: C1
            use: { uk: "те саме, коли частини вже мають коми" }
            sign: { uk: крапка з комою }
            ex: ["Со́нце сі́ло, не́бо поги́сло", { target: ";" }, " у селі́ засвіти́лися ві́кна."]
          - level: C1
            use: { uk: наслідок }
            sign: { uk: тире }
            ex: ["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."]
          - level: C1
            use: { uk: умова }
            sign: { uk: тире }
            ex: ["Не бу́де дощу́", { target: " —" }, " не бу́де врожа́ю."]
          - level: C1
            use: { uk: протиставлення }
            sign: { uk: тире }
            ex: ["Він мовча́в", { target: " —" }, " вона́ говори́ла за двох."]
          - level: C1
            use: { uk: час }
            sign: { uk: тире }
            ex: ["Мине́ зима́", { target: " —" }, " прийде́ весна́."]
          - level: C1
            use: { uk: "пояснення, причина" }
            sign: { uk: двокрапка }
            ex: ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]

  - title: { uk: "Короткі частини й пропущені дієслова" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Правило } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            use: { uk: ["відкрита структура з короткими частинами: слова ", { term: по́тім }, ", ", { term: тоді́ }, " показують послідовність, знак — кома"] }
            ex: ["Споча́тку впа́ли сніги́", { target: "," }, " по́тім вда́рили моро́зи."]
          - level: C2
            use: { uk: "закрита структура з паралельними частинами: на місці пропущеного дієслова в другій частині стоїть тире" }
            ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: "Пропущене дієслово легко відновити з першої частини, тому тире замінює його."

  - title: { uk: "Вибір знака" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { uk: Знак } }
          - { key: test, label: { uk: "Можна вставити" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            sign: { uk: кома }
            test: { uk: { term: і } }
            ex: ["Ві́тер ущу́х", { target: "," }, " хма́ри розійшли́ся."]
          - level: C2
            sign: { uk: тире }
            test: { uk: [{ term: то }, " (умова), ", { term: але́ }, " (протиставлення), ", { term: тому́ }, " (наслідок), ", { term: коли́ }, " (час)"] }
            ex: ["Ля́жеш пі́зно", { target: " —" }, " вра́нці не вста́неш."]
          - level: C2
            sign: { uk: двокрапка }
            test: { uk: [{ term: а са́ме }, ", ", { term: тому́ що }] }
            ex: ["Усе́ було́ я́сно", { target: ":" }, " вони́ програ́ли."]
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: "Сполучник, який підходить за змістом, підказує знак; у реченні його не пишемо."

  - title: { uk: "Прислів’я як зразки" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Відношення } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            use: { uk: "умова: тире" }
            ex: ["Тихі́ше ї́деш", { target: " —" }, " да́лі бу́деш."]
          - level: C2
            use: { uk: "умова: тире" }
            ex: ["Лю́биш ката́тися", { target: " —" }, " лю́би й са́ночки вози́ти."]
          - level: C2
            use: { uk: "пояснення: двокрапка, а в другій частині умова: тире" }
            ex: ["Сло́во не горобе́ць", { target: ":" }, " ви́летить", { target: " —" }, " не пійма́єш."]

  - title: { uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - level: C1
            wrong: "Не бу́де дощу́, не бу́де врожа́ю."
            right: ["Не бу́де дощу́", { target: " —" }, " не бу́де врожа́ю."]
            rule: { uk: "між частинами з умовою ставимо тире, а не кому" }
          - level: C1
            wrong: "Ми не пішли́ гуля́ти, надво́рі було́ сли́зько."
            right: ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]
            rule: { uk: "друга частина називає причину: ставимо двокрапку, а не кому" }
          - level: C2
            wrong: "У лі́сі гриби́, на лу́зі кві́ти."
            right: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
            rule: { uk: "на місці пропущеного дієслова ставимо тире" }
