              en: "The conjunction that fits the meaning tells you the mark; you do not write it in the sentence."
              es: "El conector que encaja por el sentido indica el signo; en la frase no se escribe."
              pt: "A conjunção que combina com o sentido indica o sinal; na frase ela não é escrita."
              fr: "La conjonction qui convient au sens indique le signe ; on ne l’écrit pas dans la phrase."
              de: "Die Konjunktion, die dem Sinn entspricht, zeigt das Zeichen an; im Satz schreibt man sie nicht."
              it: "La congiunzione adatta al senso indica il segno; nella frase non si scrive."
              pl: "Spójnik pasujący znaczeniem podpowiada znak; w zdaniu go nie piszemy."
              tr: "Anlama uyan bağlaç işareti gösterir; cümlede yazılmaz."
              id: "Konjungsi yang cocok dengan maknanya menunjukkan tandanya; dalam kalimat konjungsi itu tidak ditulis."
              vi: "Liên từ phù hợp về nghĩa cho biết dấu cần dùng; trong câu thì không viết liên từ đó."

