            ex: ["Споча́тку впа́ли сніги́", { target: "," }, " по́тім вда́рили моро́зи."]
            tr: { en: "First the snow fell, then the frosts set in.", es: "Primero cayeron las nevadas, luego llegaron las heladas.", pt: "Primeiro caiu a neve, depois vieram as geadas.", fr: "D’abord la neige est tombée, puis les gelées sont arrivées.", de: "Zuerst fiel Schnee, dann kam der Frost.", it: "Prima è caduta la neve, poi sono arrivate le gelate.", pl: "Najpierw spadły śniegi, potem uderzyły mrozy.", tr: "Önce kar yağdı, sonra ayaz bastırdı.", id: "Mula-mula salju turun, lalu udara dingin yang menggigit datang.", vi: "Đầu tiên tuyết rơi, sau đó giá rét ập đến." }
