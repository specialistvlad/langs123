title: { uk: "Безсполучникові складні речення", en: "Sentences Without a Conjunction", es: "Oraciones sin conjunción", pt: "Frases sem conjunção", fr: "Les phrases sans conjonction", de: "Sätze ohne Konjunktion", it: "Le frasi senza congiunzione", pl: "Zdania złożone bezspójnikowe", tr: "Bağlaçsız birleşik cümleler", id: "Kalimat majemuk tanpa konjungsi", vi: "Câu ghép không có liên từ" }
summary:
  lead:
    uk: "Частини безсполучникового речення поєднує інтонація: кома чи крапка з комою позначають перелік, тире — наслідок, умову й протиставлення, двокрапка — пояснення."
    en: "Intonation joins the clauses: a comma or semicolon marks a series, a dash a result, condition or contrast, and a colon an explanation."
    es: "La entonación une las oraciones: coma o punto y coma marcan una serie, la raya una consecuencia, condición u oposición, y los dos puntos una explicación."
    pt: "A entonação une as orações: vírgula ou ponto e vírgula marcam uma série, o travessão uma consequência, condição ou oposição, e os dois-pontos uma explicação."
    fr: "L’intonation relie les propositions : virgule et point-virgule marquent une suite, tiret un résultat, une condition, un contraste, deux-points une explication."
    de: "Die Intonation verbindet die Teilsätze: Komma oder Semikolon zeigen eine Reihe, der Gedankenstrich Folge, Bedingung, Gegensatz, der Doppelpunkt eine Erklärung."
    it: "L’intonazione lega le proposizioni: virgola o punto e virgola indicano una serie, il trattino conseguenza, condizione o contrasto, i due punti una spiegazione."
    pl: "Części łączy intonacja: przecinek lub średnik wskazują wyliczenie, myślnik — skutek, warunek i przeciwstawienie, dwukropek — wyjaśnienie."
    tr: "Cümleleri tonlama bağlar: virgül ya da noktalı virgül sıralamayı, tire sonucu, koşulu ve karşıtlığı, iki nokta açıklamayı gösterir."
    id: "Intonasi menghubungkan klausa: koma atau titik koma menandai rangkaian, tanda pisah akibat, syarat, dan pertentangan, titik dua penjelasan."
    vi: "Ngữ điệu nối các mệnh đề: dấu phẩy chỉ chuỗi, dấu gạch ngang chỉ kết quả, điều kiện, đối lập, dấu hai chấm chỉ giải thích."
  rule:
    uk: "Знак між частинами показує, як вони пов’язані:"
    en: "The mark between the clauses shows how they relate:"
    es: "El signo entre las oraciones muestra cómo se relacionan:"
    pt: "O sinal entre as orações mostra como elas se relacionam:"
    fr: "Le signe entre les propositions montre comment elles sont liées :"
    de: "Das Zeichen zwischen den Teilsätzen zeigt, wie sie zusammenhängen:"
    it: "Il segno tra le proposizioni mostra come sono collegate:"
    pl: "Znak między częściami zdania pokazuje, jak są ze sobą powiązane:"
    tr: "Cümleler arasındaki işaret, bunların nasıl ilişkili olduğunu gösterir:"
    id: "Tanda di antara klausa menunjukkan bagaimana klausa-klausa itu berhubungan:"
    vi: "Dấu giữa các mệnh đề cho thấy quan hệ của chúng:"
  ex: { examples: [["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."], ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: "Point", es: "Punto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { uk: Правило, en: "Rule", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: C1
          point: { uk: Відкрита структура, en: "Open structure", es: "Estructura abierta", pt: "Estrutura aberta", fr: "Structure ouverte", de: "Offene Struktur", it: "Struttura aperta", pl: "Struktura otwarta", tr: "Açık yapı", id: "Struktur terbuka", vi: "Cấu trúc mở" }
          rule:
            uk: "рівноправні частини — ряд подій чи станів; можна додати ще одну"
            en: "equal clauses: a series of events or states; you can add another"
            es: "oraciones de igual rango: una serie de hechos o estados; se puede añadir otra"
            pt: "orações de mesmo peso: uma série de fatos ou estados; dá para acrescentar mais uma"
            fr: "propositions de même rang : une suite d’événements ou d’états ; on peut en ajouter une autre"
            de: "gleichrangige Teilsätze: eine Reihe von Ereignissen oder Zuständen; ein weiterer kann folgen"
            it: "proposizioni di pari rango: una serie di eventi o di stati; se ne può aggiungere un’altra"
            pl: "równorzędne części: szereg zdarzeń lub stanów; można dodać jeszcze jedną"
            tr: "eşit değerde cümleler: bir olaylar ya da durumlar dizisi; bir tane daha eklenebilir"
            id: "klausa setara: rangkaian peristiwa atau keadaan; klausa lain bisa ditambahkan"
            vi: "các mệnh đề ngang hàng: một chuỗi sự việc hoặc trạng thái; có thể thêm một mệnh đề nữa"
          ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці", { target: "," }, " задзвені́ли струмки́."]
          tr: { en: "The forest began to rustle, the birds began to sing, the brooks began to babble.", es: "El bosque empezó a susurrar, los pájaros empezaron a cantar, los arroyos empezaron a murmurar.", pt: "A floresta começou a sussurrar, os pássaros começaram a cantar, os riachos começaram a murmurar.", fr: "La forêt s’est mise à bruire, les oiseaux se sont mis à chanter, les ruisseaux se sont mis à murmurer.", de: "Der Wald begann zu rauschen, die Vögel begannen zu singen, die Bäche begannen zu plätschern.", it: "Il bosco ha cominciato a stormire, gli uccelli hanno cominciato a cantare, i ruscelli hanno cominciato a mormorare.", pl: "Zaszumiał las, zaśpiewały ptaki, zadźwięczały strumienie.", tr: "Orman hışırdamaya başladı, kuşlar ötmeye başladı, dereler çağlamaya başladı.", id: "Hutan mulai berdesir, burung-burung mulai berkicau, sungai-sungai kecil mulai bergemericik.", vi: "Rừng bắt đầu xào xạc, chim bắt đầu hót, những dòng suối bắt đầu róc rách." }
        - level: C1
          point: { uk: Закрита структура, en: "Closed structure", es: "Estructura cerrada", pt: "Estrutura fechada", fr: "Structure fermée", de: "Geschlossene Struktur", it: "Struttura chiusa", pl: "Struktura zamknięta", tr: "Kapalı yapı", id: "Struktur tertutup", vi: "Cấu trúc đóng" }
          rule:
            uk: "дві частини залежать одна від одної: умова, протиставлення, час"
            en: "two clauses depend on each other: condition, contrast, time"
            es: "dos oraciones dependen una de otra: condición, oposición, tiempo"
            pt: "duas orações dependem uma da outra: condição, oposição, tempo"
            fr: "deux propositions dépendent l’une de l’autre : condition, opposition, temps"
            de: "zwei Teilsätze hängen voneinander ab: Bedingung, Gegensatz, Zeit"
            it: "due proposizioni dipendono l’una dall’altra: condizione, contrasto, tempo"
            pl: "dwie części zależą od siebie: warunek, przeciwstawienie, czas"
            tr: "iki cümle birbirine bağlıdır: koşul, karşıtlık, zaman"
            id: "dua klausa saling bergantung: syarat, pertentangan, waktu"
            vi: "hai mệnh đề phụ thuộc vào nhau: điều kiện, đối lập, thời gian"
          ex: ["Він мовча́в", { target: " —" }, " вона́ говори́ла за двох."]
          tr: { en: "He was silent, and she spoke for both.", es: "Él callaba y ella hablaba por los dos.", pt: "Ele ficou calado, e ela falou pelos dois.", fr: "Lui se taisait, et elle parlait pour deux.", de: "Er schwieg, und sie redete für zwei.", it: "Lui taceva, e lei parlava per due.", pl: "On milczał, a ona mówiła za dwoje.", tr: "Adam sessiz kaldı, kadın ise ikisi yerine konuştu.", id: "Pria itu diam, sedangkan wanita itu berbicara untuk mereka berdua.", vi: "Anh ấy im lặng, còn cô ấy nói thay cho cả hai người." }
        - level: C1
          point: { uk: "Кома, крапка з комою", en: "Comma, semicolon", es: "Coma, punto y coma", pt: "Vírgula, ponto e vírgula", fr: "Virgule, point-virgule", de: "Komma, Semikolon", it: "Virgola, punto e virgola", pl: "Przecinek, średnik", tr: "Virgül, noktalı virgül", id: "Koma, titik koma", vi: "Dấu phẩy, dấu chấm phẩy" }
          rule:
            uk: "послідовність чи одночасність; крапка з комою — коли частини вже мають коми"
            en: "sequence or simultaneity; a semicolon when the clauses already contain commas"
            es: "sucesión o simultaneidad; punto y coma cuando las oraciones ya llevan comas"
            pt: "sucessão ou simultaneidade; ponto e vírgula quando as orações já têm vírgulas"
            fr: "succession ou simultanéité ; point-virgule quand les propositions contiennent déjà des virgules"
            de: "Abfolge oder Gleichzeitigkeit; Semikolon, wenn die Teilsätze schon Kommas enthalten"
            it: "successione o simultaneità; punto e virgola quando le proposizioni contengono già virgole"
            pl: "kolejność lub równoczesność; średnik, gdy części mają już przecinki"
            tr: "ardışıklık ya da eşzamanlılık; cümlelerde zaten virgül varsa noktalı virgül"
            id: "urutan atau kejadian bersamaan; titik koma jika klausa sudah memuat koma"
            vi: "nối tiếp hoặc đồng thời; dấu chấm phẩy khi các mệnh đề đã có dấu phẩy"
          ex: ["Со́нце сі́ло, не́бо поги́сло", { target: ";" }, " у селі́ засвіти́лися ві́кна."]
          tr: { en: "The sun set, the sky went dark; in the village, windows lit up.", es: "El sol se puso, el cielo se apagó; en el pueblo se encendieron las ventanas.", pt: "O sol se pôs, o céu escureceu; na aldeia, as janelas se acenderam.", fr: "Le soleil s’est couché, le ciel s’est éteint ; au village, des fenêtres se sont allumées.", de: "Die Sonne ging unter, der Himmel erlosch; im Dorf leuchteten Fenster auf.", it: "Il sole è tramontato, il cielo si è spento; nel villaggio si sono accese le finestre.", pl: "Słońce zaszło, niebo zgasło; we wsi zapaliły się okna.", tr: "Güneş battı, gökyüzü karardı; köyde pencereler aydınlandı.", id: "Matahari terbenam, langit meredup; di desa, jendela-jendela mulai menyala.", vi: "Mặt trời lặn, bầu trời tắt nắng; trong làng, những ô cửa sổ sáng đèn." }
        - level: C1
          point: { uk: Тире, en: "Dash", es: "Raya", pt: "Travessão", fr: "Tiret", de: "Gedankenstrich", it: "Trattino", pl: "Myślnik", tr: "Tire", id: "Tanda pisah", vi: "Dấu gạch ngang" }
          rule:
            uk: "наслідок, умова, протиставлення, час"
            en: "result, condition, contrast, time"
            es: "consecuencia, condición, oposición, tiempo"
            pt: "consequência, condição, oposição, tempo"
            fr: "conséquence, condition, opposition, temps"
            de: "Folge, Bedingung, Gegensatz, Zeit"
            it: "conseguenza, condizione, contrasto, tempo"
            pl: "skutek, warunek, przeciwstawienie, czas"
            tr: "sonuç, koşul, karşıtlık, zaman"
            id: "akibat, syarat, pertentangan, waktu"
            vi: "kết quả, điều kiện, đối lập, thời gian"
          ex: ["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."]
          tr: { en: "A wind blew up, and the leaves came falling down.", es: "Se levantó viento y empezaron a caer las hojas.", pt: "Soprou o vento e as folhas começaram a cair.", fr: "Le vent s’est levé, et les feuilles se sont mises à tomber.", de: "Wind kam auf, und die Blätter fielen herab.", it: "Si è alzato il vento e le foglie hanno cominciato a cadere.", pl: "Powiał wiatr i posypały się liście.", tr: "Rüzgâr esti, yapraklar dökülmeye başladı.", id: "Angin bertiup, lalu daun-daun berguguran.", vi: "Gió thổi, và lá bắt đầu rơi lả tả." }
        - level: C1
          point: { uk: Двокрапка, en: "Colon", es: "Dos puntos", pt: "Dois-pontos", fr: "Deux-points", de: "Doppelpunkt", it: "Due punti", pl: "Dwukropek", tr: "İki nokta", id: "Titik dua", vi: "Dấu hai chấm" }
          rule:
            uk: "друга частина пояснює першу або називає причину"
            en: "the second clause explains the first or gives the reason"
            es: "la segunda oración explica la primera o da la causa"
            pt: "a segunda oração explica a primeira ou dá a causa"
            fr: "la seconde proposition explique la première ou en donne la cause"
            de: "der zweite Teilsatz erklärt den ersten oder nennt den Grund"
            it: "la seconda proposizione spiega la prima o ne indica la causa"
            pl: "druga część wyjaśnia pierwszą albo podaje przyczynę"
            tr: "ikinci cümle birincisini açıklar ya da nedenini söyler"
            id: "klausa kedua menjelaskan klausa pertama atau menyebutkan sebabnya"
            vi: "mệnh đề thứ hai giải thích mệnh đề thứ nhất hoặc nêu nguyên nhân"
          ex: ["Усе́ було́ я́сно", { target: ":" }, " вони́ програ́ли."]
          tr: { en: "It was all clear: they had lost.", es: "Todo estaba claro: habían perdido.", pt: "Estava tudo claro: eles tinham perdido.", fr: "Tout était clair : ils avaient perdu.", de: "Alles war klar: Sie hatten verloren.", it: "Era tutto chiaro: avevano perso.", pl: "Wszystko było jasne: przegrali.", tr: "Her şey açıktı: yenilmişlerdi.", id: "Semuanya sudah jelas: mereka kalah.", vi: "Mọi chuyện đã rõ: họ đã thua." }
        - level: C2
          point: { uk: Короткі частини, en: "Short clauses", es: "Oraciones cortas", pt: "Orações curtas", fr: "Propositions courtes", de: "Kurze Teilsätze", it: "Proposizioni brevi", pl: "Krótkie części", tr: "Kısa cümleler", id: "Klausa pendek", vi: "Mệnh đề ngắn" }
          rule:
            uk: [{ term: по́тім }, " і ", { term: тоді́ }, " показують послідовність, а знак лишається комою"]
            en: [{ term: по́тім }, " and ", { term: тоді́ }, " show the sequence, and the mark stays a comma"]
            es: [{ term: по́тім }, " y ", { term: тоді́ }, " muestran la sucesión, y el signo sigue siendo la coma"]
            pt: [{ term: по́тім }, " e ", { term: тоді́ }, " mostram a sequência, e o sinal continua sendo a vírgula"]
            fr: [{ term: по́тім }, " et ", { term: тоді́ }, " montrent la succession, et le signe reste la virgule"]
            de: [{ term: по́тім }, " und ", { term: тоді́ }, " zeigen die Abfolge an, und das Zeichen bleibt das Komma"]
            it: [{ term: по́тім }, " e ", { term: тоді́ }, " indicano la successione, e il segno resta la virgola"]
            pl: [{ term: по́тім }, " i ", { term: тоді́ }, " pokazują kolejność, a znakiem pozostaje przecinek"]
            tr: [{ term: по́тім }, " ve ", { term: тоді́ }, " ardışıklığı gösterir, işaret virgül olarak kalır"]
            id: [{ term: по́тім }, " dan ", { term: тоді́ }, " menunjukkan urutan, dan tandanya tetap koma"]
            vi: [{ term: по́тім }, " và ", { term: тоді́ }, " chỉ thứ tự, còn dấu vẫn là dấu phẩy"]
          ex: ["Споча́тку впа́ли сніги́", { target: "," }, " по́тім вда́рили моро́зи."]
          tr: { en: "First the snow fell, then the frosts set in.", es: "Primero cayeron las nevadas, luego llegaron las heladas.", pt: "Primeiro caiu a neve, depois vieram as geadas.", fr: "D’abord la neige est tombée, puis les gelées sont arrivées.", de: "Zuerst fiel Schnee, dann kam der Frost.", it: "Prima è caduta la neve, poi sono arrivate le gelate.", pl: "Najpierw spadły śniegi, potem uderzyły mrozy.", tr: "Önce kar yağdı, sonra ayaz bastırdı.", id: "Mula-mula salju turun, lalu udara dingin yang menggigit datang.", vi: "Đầu tiên tuyết rơi, sau đó giá rét ập đến." }
        - level: C2
          point: { uk: Пропущене дієслово, en: "Omitted verb", es: "Verbo omitido", pt: "Verbo omitido", fr: "Verbe omis", de: "Ausgelassenes Verb", it: "Verbo omesso", pl: "Pominięty czasownik", tr: "Düşen fiil", id: "Verba yang dilesapkan", vi: "Động từ bị lược bỏ" }
          rule:
            uk: "у другій частині на його місці стоїть тире"
            en: "in the second clause a dash stands in its place"
            es: "en la segunda oración, una raya ocupa su lugar"
            pt: "na segunda oração, um travessão ocupa o seu lugar"
            fr: "dans la seconde proposition, un tiret tient sa place"
            de: "im zweiten Teilsatz steht an seiner Stelle ein Gedankenstrich"
            it: "nella seconda proposizione un trattino prende il suo posto"
            pl: "w drugiej części na jego miejscu stawiamy myślnik"
            tr: "ikinci cümlede onun yerine tire konur"
            id: "pada klausa kedua, tanda pisah menggantikannya"
            vi: "ở mệnh đề thứ hai, dấu gạch ngang thay cho nó"
          ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
          tr: { en: "In the forest there are mushrooms, in the meadow flowers.", es: "En el bosque hay hongos; en el prado, flores.", pt: "Na floresta há cogumelos; no prado, flores.", fr: "Dans la forêt, des champignons ; dans la prairie, des fleurs.", de: "Im Wald wachsen Pilze, auf der Wiese Blumen.", it: "Nel bosco ci sono i funghi, nel prato i fiori.", pl: "W lesie rosną grzyby, na łące kwiaty.", tr: "Ormanda mantarlar, çayırda çiçekler var.", id: "Di hutan ada jamur, di padang rumput ada bunga.", vi: "Trong rừng có nấm, ngoài đồng cỏ có hoa." }
        - level: C2
          point: { uk: Вибір знака, en: "Choosing the mark", es: "Elegir el signo", pt: "Escolher o sinal", fr: "Choisir le signe", de: "Das Zeichen wählen", it: "Scegliere il segno", pl: "Wybór znaku", tr: "İşaret seçimi", id: "Memilih tanda", vi: "Chọn dấu" }
          rule:
            uk: [{ term: і }, " — кома; ", { term: то }, ", ", { term: але́ }, " — тире; ", { term: тому́ що }, " — двокрапка"]
            en: [{ term: і }, " (and): comma; ", { term: то }, " (then), ", { term: але́ }, " (but): dash; ", { term: тому́ що }, " (because): colon"]
            es: [{ term: і }, " (y): coma; ", { term: то }, " (entonces), ", { term: але́ }, " (pero): raya; ", { term: тому́ що }, " (porque): dos puntos"]
            pt: [{ term: і }, " (e): vírgula; ", { term: то }, " (então), ", { term: але́ }, " (mas): travessão; ", { term: тому́ що }, " (porque): dois-pontos"]
            fr: [{ term: і }, " (et) : virgule ; ", { term: то }, " (alors), ", { term: але́ }, " (mais) : tiret ; ", { term: тому́ що }, " (parce que) : deux-points"]
            de: [{ term: і }, " (und): Komma; ", { term: то }, " (dann), ", { term: але́ }, " (aber): Gedankenstrich; ", { term: тому́ що }, " (weil): Doppelpunkt"]
            it: [{ term: і }, " (e): virgola; ", { term: то }, " (allora), ", { term: але́ }, " (ma): trattino; ", { term: тому́ що }, " (perché): due punti"]
            pl: [{ term: і }, " (i): przecinek; ", { term: то }, " (to), ", { term: але́ }, " (ale): myślnik; ", { term: тому́ що }, " (ponieważ): dwukropek"]
            tr: [{ term: і }, " (ve): virgül; ", { term: то }, " (o zaman), ", { term: але́ }, " (ama): tire; ", { term: тому́ що }, " (çünkü): iki nokta"]
            id: [{ term: і }, " (dan): koma; ", { term: то }, " (maka), ", { term: але́ }, " (tetapi): tanda pisah; ", { term: тому́ що }, " (karena): titik dua"]
            vi: [{ term: і }, " (và): dấu phẩy; ", { term: то }, " (thì), ", { term: але́ }, " (nhưng): dấu gạch ngang; ", { term: тому́ що }, " (vì): dấu hai chấm"]
          ex: ["Ля́жеш пі́зно", { target: " —" }, " вра́нці не вста́неш."]
          tr: { en: "Go to bed late, and you won't get up in the morning.", es: "Si te acuestas tarde, no te levantas por la mañana.", pt: "Se você se deitar tarde, de manhã não vai conseguir levantar.", fr: "Si tu te couches tard, tu ne te lèveras pas le matin.", de: "Wenn du spät ins Bett gehst, stehst du morgens nicht auf.", it: "Se vai a letto tardi, la mattina non ti alzi.", pl: "Jeśli położysz się późno, rano nie wstaniesz.", tr: "Geç yatarsan sabah kalkamazsın.", id: "Kalau kamu tidur larut, besok pagi kamu tidak akan bisa bangun.", vi: "Nếu đi ngủ muộn thì sáng sẽ không dậy nổi." }
        - level: C1
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: "причина — двокрапка, а не кома"
            en: "a reason takes a colon, not a comma"
            es: "la causa lleva dos puntos, no coma"
            pt: "a causa leva dois-pontos, não vírgula"
            fr: "la cause prend deux-points, pas une virgule"
            de: "ein Grund steht mit Doppelpunkt, nicht mit Komma"
            it: "la causa vuole i due punti, non la virgola"
            pl: "przyczynę wprowadza dwukropek, a nie przecinek"
            tr: "neden iki nokta ile gelir, virgülle değil"
            id: "sebab memakai titik dua, bukan koma"
            vi: "nguyên nhân dùng dấu hai chấm, không dùng dấu phẩy"
          ex: ["Ми не пішли́ гуля́ти", { target: ":" }, " надво́рі було́ сли́зько."]
          tr: { en: "We didn't go for a walk: it was slippery outside.", es: "No salimos a pasear: el suelo estaba resbaladizo.", pt: "Nós não fomos passear: lá fora estava escorregadio.", fr: "Nous ne sommes pas allés nous promener : dehors, ça glissait.", de: "Wir sind nicht spazieren gegangen: Draußen war es glatt.", it: "Non siamo andati a fare una passeggiata: fuori era scivoloso.", pl: "Nie poszliśmy na spacer: na dworze było ślisko.", tr: "Yürüyüşe çıkmadık: dışarısı kaygandı.", id: "Kami tidak jadi jalan-jalan: di luar licin.", vi: "Chúng tôi không đi dạo: bên ngoài trơn trượt." }
        - level: C2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: "без дієслова в другій частині не забуваємо тире"
            en: "when the second clause has no verb, do not forget the dash"
            es: "si la segunda oración no tiene verbo, no olvides la raya"
            pt: "se a segunda oração não tem verbo, não esqueça o travessão"
            fr: "si la seconde proposition n’a pas de verbe, n’oublie pas le tiret"
            de: "hat der zweite Teilsatz kein Verb, vergiss den Gedankenstrich nicht"
            it: "se la seconda proposizione non ha il verbo, non dimenticare il trattino"
            pl: "gdy druga część nie ma czasownika, nie zapominamy o myślniku"
            tr: "ikinci cümlede fiil yoksa tireyi unutma"
            id: "jika klausa kedua tidak punya verba, jangan lupa tanda pisah"
            vi: "khi mệnh đề thứ hai không có động từ, đừng quên dấu gạch ngang"
          ex: ["У лі́сі гриби́, на лу́зі", { target: " —" }, " кві́ти."]
          tr: { en: "In the forest there are mushrooms, in the meadow flowers.", es: "En el bosque hay hongos; en el prado, flores.", pt: "Na floresta há cogumelos; no prado, flores.", fr: "Dans la forêt, des champignons ; dans la prairie, des fleurs.", de: "Im Wald wachsen Pilze, auf der Wiese Blumen.", it: "Nel bosco ci sono i funghi, nel prato i fiori.", pl: "W lesie rosną grzyby, na łące kwiaty.", tr: "Ormanda mantarlar, çayırda çiçekler var.", id: "Di hutan ada jamur, di padang rumput ada bunga.", vi: "Trong rừng có nấm, ngoài đồng cỏ có hoa." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: "У безсполучниковому реченні сполучника немає: частини поєднує інтонація, а на письмі — розділовий знак."
              en: "Without a conjunction, intonation joins the clauses, and in writing a punctuation mark does."
              es: "Sin conector, la entonación une las oraciones, y por escrito las une un signo de puntuación."
              pt: "Sem conjunção, a entonação une as orações, e na escrita quem as une é um sinal de pontuação."
              fr: "Sans conjonction, l’intonation relie les propositions, et à l’écrit un signe de ponctuation les relie."
              de: "Ohne Konjunktion verbindet die Intonation die Teilsätze, in der Schrift ein Satzzeichen."
              it: "Senza congiunzione, le proposizioni sono unite dall’intonazione e, nella scrittura, da un segno di punteggiatura."
              pl: "Bez spójnika części łączy intonacja, a w piśmie znak interpunkcyjny."
              tr: "Bağlaç olmadığında cümleleri tonlama, yazıda ise bir noktalama işareti birbirine bağlar."
              id: "Tanpa konjungsi, intonasi menghubungkan klausa, dan dalam tulisan tanda baca yang menghubungkannya."
              vi: "Khi không có liên từ, ngữ điệu nối các mệnh đề, còn trong văn viết thì dùng dấu câu."
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці."]
            tr: { en: "The forest began to rustle, the birds began to sing.", es: "El bosque empezó a susurrar, los pájaros empezaron a cantar.", pt: "A floresta começou a sussurrar, os pássaros começaram a cantar.", fr: "La forêt s’est mise à bruire, les oiseaux se sont mis à chanter.", de: "Der Wald begann zu rauschen, die Vögel begannen zu singen.", it: "Il bosco ha cominciato a stormire, gli uccelli hanno cominciato a cantare.", pl: "Zaszumiał las, zaśpiewały ptaki.", tr: "Orman hışırdamaya başladı, kuşlar ötmeye başladı.", id: "Hutan mulai berdesir, burung-burung mulai berkicau.", vi: "Rừng bắt đầu xào xạc, chim bắt đầu hót." }
          - type: note
            level: C1
            text:
              uk: ["Ті самі зв’язки зі сполучниками: ", { link: Сполучники, to: uk.sentence.conjunctions }, ", ", { link: "Коли, якщо, якби", to: uk.sentence.when-if }, "."]
              en: ["The same relations with conjunctions: ", { link: "Conjunctions", to: uk.sentence.conjunctions }, ", ", { link: "When and If: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              es: ["Las mismas relaciones con conectores: ", { link: "Los conectores", to: uk.sentence.conjunctions }, ", ", { link: "Cuándo y si: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              pt: ["As mesmas relações com conjunções: ", { link: "Conjunções", to: uk.sentence.conjunctions }, ", ", { link: "Quando e se: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              fr: ["Les mêmes rapports avec des conjonctions : ", { link: "Les conjonctions", to: uk.sentence.conjunctions }, ", ", { link: "Quand et si : коли, якщо, якби", to: uk.sentence.when-if }, "."]
              de: ["Dieselben Beziehungen mit Konjunktionen: ", { link: "Konjunktionen", to: uk.sentence.conjunctions }, ", ", { link: "Wann und wenn: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              it: ["Gli stessi rapporti con le congiunzioni: ", { link: "Le congiunzioni", to: uk.sentence.conjunctions }, ", ", { link: "Quando e se: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              pl: ["Te same związki ze spójnikami: ", { link: "Spójniki", to: uk.sentence.conjunctions }, ", ", { link: "Kiedy i jeśli: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              tr: ["Aynı ilişkilerin bağlaçlı hâli: ", { link: "Bağlaçlar", to: uk.sentence.conjunctions }, ", ", { link: "Zaman ve şart: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              id: ["Hubungan yang sama dengan konjungsi: ", { link: "Konjungsi", to: uk.sentence.conjunctions }, ", ", { link: "Ketika dan jika: коли, якщо, якби", to: uk.sentence.when-if }, "."]
              vi: ["Những quan hệ tương tự khi có liên từ: ", { link: "Liên từ", to: uk.sentence.conjunctions }, ", ", { link: "Khi và nếu: коли, якщо, якби", to: uk.sentence.when-if }, "."]

  - title: { uk: "Структура: відкрита й закрита", en: "Structure: open and closed", es: "Estructura: abierta y cerrada", pt: "Estrutura: aberta e fechada", fr: "Structure : ouverte et fermée", de: "Struktur: offen und geschlossen", it: "Struttura: aperta e chiusa", pl: "Struktura: otwarta i zamknięta", tr: "Yapı: açık ve kapalı", id: "Struktur: terbuka dan tertutup", vi: "Cấu trúc: mở và đóng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Структура, en: "Structure", es: "Estructura", pt: "Estrutura", fr: "Structure", de: "Struktur", it: "Struttura", pl: "Struktura", tr: "Yapı", id: "Struktur", vi: "Cấu trúc" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            use: { uk: "відкрита: частини рівноправні, це ряд подій чи станів, і можна додати ще одну частину", en: "open: the clauses are equal, a series of events or states, and you can add another", es: "abierta: las oraciones son iguales, una serie de hechos o estados, y se puede añadir otra", pt: "aberta: as orações têm o mesmo peso, são uma série de fatos ou estados, e dá para acrescentar outra", fr: "ouverte : les propositions sont égales, une suite d’événements ou d’états, et on peut en ajouter une autre", de: "offen: gleichrangige Teilsätze, eine Reihe von Ereignissen oder Zuständen; ein weiterer kann folgen", it: "aperta: le proposizioni sono di pari rango, una serie di eventi o di stati, e se ne può aggiungere un’altra", pl: "otwarta: części są równorzędne, to szereg zdarzeń lub stanów, i można dodać jeszcze jedną", tr: "açık: cümleler eşit değerdedir, bir olaylar ya da durumlar dizisidir ve bir tane daha eklenebilir", id: "terbuka: klausanya setara, berupa rangkaian peristiwa atau keadaan, dan klausa lain bisa ditambahkan", vi: "mở: các mệnh đề ngang hàng, là một chuỗi sự việc hoặc trạng thái, và có thể thêm một mệnh đề nữa" }
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці", { target: "," }, " задзвені́ли струмки́."]
            tr: { en: "The forest began to rustle, the birds began to sing, the brooks began to babble.", es: "El bosque empezó a susurrar, los pájaros empezaron a cantar, los arroyos empezaron a murmurar.", pt: "A floresta começou a sussurrar, os pássaros começaram a cantar, os riachos começaram a murmurar.", fr: "La forêt s’est mise à bruire, les oiseaux se sont mis à chanter, les ruisseaux se sont mis à murmurer.", de: "Der Wald begann zu rauschen, die Vögel begannen zu singen, die Bäche begannen zu plätschern.", it: "Il bosco ha cominciato a stormire, gli uccelli hanno cominciato a cantare, i ruscelli hanno cominciato a mormorare.", pl: "Zaszumiał las, zaśpiewały ptaki, zadźwięczały strumienie.", tr: "Orman hışırdamaya başladı, kuşlar ötmeye başladı, dereler çağlamaya başladı.", id: "Hutan mulai berdesir, burung-burung mulai berkicau, sungai-sungai kecil mulai bergemericik.", vi: "Rừng bắt đầu xào xạc, chim bắt đầu hót, những dòng suối bắt đầu róc rách." }
          - level: C1
            use: { uk: "закрита: дві частини залежать одна від одної, друга виражає умову, протиставлення чи час", en: "closed: two clauses depend on each other, and the second states a condition, contrast or time", es: "cerrada: dos oraciones dependen una de otra, y la segunda expresa condición, oposición o tiempo", pt: "fechada: duas orações dependem uma da outra, e a segunda expressa condição, oposição ou tempo", fr: "fermée : deux propositions dépendent l’une de l’autre, et la seconde exprime la condition, l’opposition ou le temps", de: "geschlossen: zwei Teilsätze hängen voneinander ab, und der zweite drückt Bedingung, Gegensatz oder Zeit aus", it: "chiusa: due proposizioni dipendono l’una dall’altra, e la seconda esprime condizione, contrasto o tempo", pl: "zamknięta: dwie części zależą od siebie, a druga wyraża warunek, przeciwstawienie lub czas", tr: "kapalı: iki cümle birbirine bağlıdır, ikincisi koşul, karşıtlık ya da zaman bildirir", id: "tertutup: dua klausa saling bergantung, dan klausa kedua menyatakan syarat, pertentangan, atau waktu", vi: "đóng: hai mệnh đề phụ thuộc vào nhau, mệnh đề thứ hai nêu điều kiện, đối lập hoặc thời gian" }
            ex: ["Не бу́де дощу́", { target: " —" }, " не бу́де врожа́ю."]
            tr: { en: "If there is no rain, there will be no harvest.", es: "Si no llueve, no habrá cosecha.", pt: "Se não chover, não haverá colheita.", fr: "S’il ne pleut pas, il n’y aura pas de récolte.", de: "Wenn es nicht regnet, gibt es keine Ernte.", it: "Se non piove, non ci sarà raccolto.", pl: "Jeśli nie będzie deszczu, nie będzie plonów.", tr: "Yağmur yağmazsa ürün olmaz.", id: "Kalau tidak turun hujan, tidak akan ada panen.", vi: "Nếu không có mưa thì sẽ không được mùa." }

  - title: { uk: "Відношення між частинами й знаки", en: "Relations between clauses and marks", es: "Relaciones entre oraciones y signos", pt: "Relações entre orações e sinais", fr: "Rapports entre propositions et signes", de: "Beziehungen zwischen Teilsätzen und Zeichen", it: "Rapporti tra proposizioni e segni", pl: "Zależności między częściami zdania i znaki", tr: "Cümleler arasındaki ilişkiler ve işaretler", id: "Hubungan antarklausa dan tandanya", vi: "Quan hệ giữa các mệnh đề và dấu câu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Відношення, en: "Relation", es: "Relación", pt: "Relação", fr: "Rapport", de: "Beziehung", it: "Rapporto", pl: "Zależność", tr: "İlişki", id: "Hubungan", vi: "Quan hệ" } }
          - { key: sign, label: { uk: Знак, en: "Mark", es: "Signo", pt: "Sinal", fr: "Signe", de: "Zeichen", it: "Segno", pl: "Znak", tr: "İşaret", id: "Tanda", vi: "Dấu" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            use: { uk: "послідовність, одночасність", en: "sequence, simultaneity", es: "sucesión, simultaneidad", pt: "sucessão, simultaneidade", fr: "succession, simultanéité", de: "Abfolge, Gleichzeitigkeit", it: "successione, simultaneità", pl: "kolejność, równoczesność", tr: "ardışıklık, eşzamanlılık", id: "urutan, kejadian bersamaan", vi: "nối tiếp, đồng thời" }
            sign: { uk: кома, en: "comma", es: "coma", pt: "vírgula", fr: "virgule", de: "Komma", it: "virgola", pl: "przecinek", tr: "virgül", id: "koma", vi: "dấu phẩy" }
            ex: ["Зашумі́в ліс", { target: "," }, " заспіва́ли пти́ці."]
            tr: { en: "The forest began to rustle, the birds began to sing.", es: "El bosque empezó a susurrar, los pájaros empezaron a cantar.", pt: "A floresta começou a sussurrar, os pássaros começaram a cantar.", fr: "La forêt s’est mise à bruire, les oiseaux se sont mis à chanter.", de: "Der Wald begann zu rauschen, die Vögel begannen zu singen.", it: "Il bosco ha cominciato a stormire, gli uccelli hanno cominciato a cantare.", pl: "Zaszumiał las, zaśpiewały ptaki.", tr: "Orman hışırdamaya başladı, kuşlar ötmeye başladı.", id: "Hutan mulai berdesir, burung-burung mulai berkicau.", vi: "Rừng bắt đầu xào xạc, chim bắt đầu hót." }
          - level: C1
            use: { uk: "те саме, коли частини вже мають коми", en: "the same, when the clauses already contain commas", es: "lo mismo, cuando las oraciones ya llevan comas", pt: "o mesmo, quando as orações já têm vírgulas", fr: "la même chose, quand les propositions contiennent déjà des virgules", de: "dasselbe, wenn die Teilsätze schon Kommas enthalten", it: "lo stesso, quando le proposizioni contengono già virgole", pl: "to samo, gdy części mają już przecinki", tr: "aynı, cümlelerde zaten virgül varsa", id: "sama, jika klausa sudah memuat koma", vi: "như trên, khi các mệnh đề đã có dấu phẩy" }
            sign: { uk: крапка з комою, en: "semicolon", es: "punto y coma", pt: "ponto e vírgula", fr: "point-virgule", de: "Semikolon", it: "punto e virgola", pl: "średnik", tr: "noktalı virgül", id: "titik koma", vi: "dấu chấm phẩy" }
            ex: ["Со́нце сі́ло, не́бо поги́сло", { target: ";" }, " у селі́ засвіти́лися ві́кна."]
            tr: { en: "The sun set, the sky went dark; in the village, windows lit up.", es: "El sol se puso, el cielo se apagó; en el pueblo se encendieron las ventanas.", pt: "O sol se pôs, o céu escureceu; na aldeia, as janelas se acenderam.", fr: "Le soleil s’est couché, le ciel s’est éteint ; au village, des fenêtres se sont allumées.", de: "Die Sonne ging unter, der Himmel erlosch; im Dorf leuchteten Fenster auf.", it: "Il sole è tramontato, il cielo si è spento; nel villaggio si sono accese le finestre.", pl: "Słońce zaszło, niebo zgasło; we wsi zapaliły się okna.", tr: "Güneş battı, gökyüzü karardı; köyde pencereler aydınlandı.", id: "Matahari terbenam, langit meredup; di desa, jendela-jendela mulai menyala.", vi: "Mặt trời lặn, bầu trời tắt nắng; trong làng, những ô cửa sổ sáng đèn." }
          - level: C1
            use: { uk: наслідок, en: "result", es: "consecuencia", pt: "consequência", fr: "conséquence", de: "Folge", it: "conseguenza", pl: "skutek", tr: "sonuç", id: "akibat", vi: "kết quả" }
            sign: { uk: тире, en: "dash", es: "raya", pt: "travessão", fr: "tiret", de: "Gedankenstrich", it: "trattino", pl: "myślnik", tr: "tire", id: "tanda pisah", vi: "dấu gạch ngang" }
            ex: ["Пові́яв ві́тер", { target: " —" }, " посипа́лося ли́стя."]
