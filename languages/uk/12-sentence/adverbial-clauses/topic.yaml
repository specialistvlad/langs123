            tr: { en: "The meeting was postponed because there was no quorum.", es: "La asamblea se aplazó porque no había quórum.", pt: "A assembleia foi adiada porque não havia quórum.", fr: "L’assemblée a été reportée parce qu’il n’y avait pas de quorum.", de: "Die Versammlung wurde verschoben, weil das Quorum fehlte.", it: "L’assemblea è stata rinviata perché mancava il quorum.", pl: "Zebranie przełożono, ponieważ zabrakło kworum.", tr: "Toplantı, nisap sağlanamadığı için ertelendi.", id: "Rapat ditunda karena tidak ada kuorum.", vi: "Cuộc họp bị hoãn vì không đủ túc số." }
          - level: C2
