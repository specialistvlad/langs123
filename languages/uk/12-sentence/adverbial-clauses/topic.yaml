            de: [{ term: тоді́ }, " hebt einen Zeitpunkt hervor, ", { term: коли́ }, " bestimmt ihn näher"]
            it: [{ term: тоді́ }, " mette in rilievo un momento, ", { term: коли́ }, " lo precisa"]
            pl: [{ term: тоді́ }, " wyróżnia moment, a ", { term: коли́ }, " go precyzuje"]
            tr: [{ term: тоді́ }, " bir anı öne çıkarır, ", { term: коли́ }, " onu belirler"]
            id: [{ term: тоді́ }, " menonjolkan suatu saat, ", { term: коли́ }, " memerincinya"]
            vi: [{ term: тоді́ }, " làm nổi bật một thời điểm, ", { term: коли́ }, " xác định rõ thời điểm ấy"]
          ex: ["Вона́ усміха́ється ", { target: тоді́ }, ", ", { target: коли́ }, " ду́має, що ніхто́ не ба́чить."]
          tr: { en: "She smiles just when she thinks no one is watching.", es: "Sonríe justo cuando cree que nadie la ve.", pt: "Ela sorri justamente quando pensa que ninguém está vendo.", fr: "Elle sourit juste au moment où elle croit que personne ne la voit.", de: "Sie lächelt genau dann, wenn sie denkt, dass niemand es sieht.", it: "Sorride proprio quando pensa che nessuno la veda.", pl: "Uśmiecha się właśnie wtedy, gdy myśli, że nikt nie widzi.", tr: "Kimsenin görmediğini düşündüğü anda gülümsüyor.", id: "Dia tersenyum justru ketika mengira tidak ada yang melihat.", vi: "Cô ấy mỉm cười đúng lúc nghĩ rằng không ai nhìn thấy." }
        - level: C2
          point: { uk: Однаковий спосіб, en: "Same manner", es: "Mismo modo", pt: "Mesmo modo", fr: "Même manière", de: "Gleiche Art und Weise", it: "Stesso modo", pl: "Taki sam sposób", tr: "Aynı tarz", id: "Cara yang sama", vi: "Cách thức giống nhau" }
          rule:
