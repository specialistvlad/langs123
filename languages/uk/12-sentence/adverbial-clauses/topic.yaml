summary:
  lead:
    uk: "Підрядні частини місця, способу, ступеня, часу, причини й допусту приєднуються сполучниками, а в головній частині їм відповідають співвідносні слова."
    en: "Subordinate clauses of place, manner, degree, time, cause and concession take conjunctions; the main clause has matching correlative words."
    es: "Las subordinadas de lugar, modo, grado, tiempo, causa y concesión llevan conectores; la principal tiene palabras correlativas que les corresponden."
    pt: "As subordinadas de lugar, modo, grau, tempo, causa e concessão levam conjunções; a principal tem palavras correlativas que lhes correspondem."
    fr: "Les subordonnées de lieu, manière, degré, temps, cause et concession s’ouvrent par une conjonction ; la principale y répond par un mot corrélatif."
    de: "Konjunktionen leiten Nebensätze des Ortes, der Art und Weise, des Grades, der Zeit, des Grundes und der Einräumung ein; im Hauptsatz steht ein Korrelat."
    it: "Le subordinate di luogo, modo, grado, tempo, causa e concessione si uniscono con congiunzioni, e nella principale ad esse corrispondono parole correlative."
    pl: "Zdania podrzędne miejsca, sposobu, stopnia, czasu, przyczyny i ustępstwa łączą się spójnikami, a w zdaniu głównym odpowiadają im wyrazy wskazujące."
    tr: "Yer, tarz, derece, zaman, neden ve ödün bildiren yan cümleler bağlaçlarla bağlanır; ana cümlede de onlara karşılık gelen sözcükler bulunur."
    id: "Anak kalimat tempat, cara, tingkat, waktu, sebab, dan konsesi dihubungkan dengan konjungsi, dan di induk kalimat ada kata korelatif yang menjadi pasangannya."
    vi: "Mệnh đề phụ chỉ nơi chốn, cách thức, mức độ, thời gian, nguyên nhân, nhượng bộ được nối bằng liên từ; mệnh đề chính có từ tương ứng."
  rule:
    uk: "Співвідносне слово головної частини й сполучне слово підрядної вказують на те саме:"
    en: "The main clause's correlative word and the subordinate clause's connecting word point to the same thing:"
    es: "La palabra correlativa de la principal y la palabra de enlace de la subordinada señalan lo mismo:"
    pt: "A palavra correlativa da principal e a palavra de ligação da subordinada indicam a mesma coisa:"
    fr: "Le mot corrélatif et le mot de liaison désignent la même chose :"
    de: "Das Korrelat im Hauptsatz und das einleitende Wort im Nebensatz weisen auf dasselbe hin:"
    it: "La parola correlativa della principale e la parola di collegamento della subordinata indicano la stessa cosa:"
    pl: "Wyraz wskazujący w zdaniu głównym i wyraz łączący w zdaniu podrzędnym oznaczają to samo:"
    tr: "Ana cümledeki karşılık sözcük ile yan cümledeki bağlayıcı sözcük aynı şeyi gösterir:"
    id: "Kata korelatif di induk kalimat dan kata penghubung di anak kalimat menunjuk hal yang sama:"
    vi: "Từ tương ứng và từ nối cùng chỉ một điều:"
  ex: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]

