            en: [{ term: "так, як" }, ": the manner is the same as the model's"]
            es: [{ term: "так, як" }, ": el modo es el mismo que el del modelo"]
            pt: [{ term: "так, як" }, ": o modo é o mesmo do modelo"]
            fr: [{ term: "так, як" }, " : la manière est la même que celle du modèle"]
            de: [{ term: "так, як" }, ": die Art und Weise ist dieselbe wie beim Vorbild"]
            it: [{ term: "так, як" }, ": il modo è lo stesso del modello"]
            pl: [{ term: "так, як" }, ": sposób jest taki sam jak we wzorze"]
            tr: [{ term: "так, як" }, ": tarz, örnekle aynıdır"]
            id: [{ term: "так, як" }, ": caranya sama seperti pada contoh acuan"]
            vi: [{ term: "так, як" }, ": cách thức giống như ở mẫu"]
          ex: ["Ми святку́ємо ", { target: так }, ", ", { target: як }, " святкува́ли на́ші діди́."]
          tr: { en: "We celebrate the way our forefathers celebrated.", es: "Celebramos como celebraban nuestros abuelos.", pt: "Celebramos do mesmo jeito que nossos avós celebravam.", fr: "Nous fêtons comme fêtaient nos aïeux.", de: "Wir feiern so, wie unsere Vorfahren gefeiert haben.", it: "Festeggiamo come festeggiavano i nostri avi.", pl: "Świętujemy tak, jak świętowali nasi dziadowie.", tr: "Atalarımızın kutladığı gibi kutluyoruz.", id: "Kami merayakannya seperti leluhur kami merayakannya dulu.", vi: "Chúng tôi ăn mừng như ông cha chúng tôi từng ăn mừng." }
        - level: C2
          point: { uk: Причина, en: "Cause", es: "Causa", pt: "Causa", fr: "Cause", de: "Grund", it: "Causa", pl: "Przyczyna", tr: "Neden", id: "Sebab", vi: "Nguyên nhân" }
          rule:
            uk: [{ term: тому́ що }, " — нейтральна причина, ", { term: оскі́льки }, " — відома підстава, ", { term: адже́ }, " — очевидна"]
            en: [{ term: тому́ що }, " — a neutral cause, ", { term: оскі́льки }, " — a known ground, ", { term: адже́ }, " — an obvious one"]
            es: [{ term: тому́ що }, " — causa neutra, ", { term: оскі́льки }, " — motivo conocido, ", { term: адже́ }, " — motivo evidente"]
            pt: [{ term: тому́ що }, " — causa neutra, ", { term: оскі́льки }, " — motivo conhecido, ", { term: адже́ }, " — motivo evidente"]
            fr: [{ term: тому́ що }, " — cause neutre, ", { term: оскі́льки }, " — motif connu, ", { term: адже́ }, " — motif évident"]
            de: [{ term: тому́ що }, " — neutraler Grund, ", { term: оскі́льки }, " — bekannte Grundlage, ", { term: адже́ }, " — offensichtlicher Grund"]
            it: [{ term: тому́ що }, " — causa neutra, ", { term: оскі́льки }, " — motivo noto, ", { term: адже́ }, " — motivo evidente"]
            pl: [{ term: тому́ що }, " — przyczyna neutralna, ", { term: оскі́льки }, " — znana podstawa, ", { term: адже́ }, " — oczywista"]
            tr: [{ term: тому́ що }, " nötr bir nedeni, ", { term: оскі́льки }, " bilinen bir gerekçeyi, ", { term: адже́ }, " açık bir nedeni bildirir"]
            id: [{ term: тому́ що }, " — sebab netral, ", { term: оскі́льки }, " — dasar yang sudah diketahui, ", { term: адже́ }, " — sebab yang jelas"]
            vi: [{ term: тому́ що }, " — nguyên nhân trung tính, ", { term: оскі́льки }, " — cơ sở đã biết, ", { term: адже́ }, " — cơ sở hiển nhiên"]
          ex: [{ target: Оскі́льки }, " за́л зама́лий, ми перено́симо за́хід до університе́ту."]
          tr: { en: "Since the hall is too small, we are moving the event to the university.", es: "Como la sala es demasiado pequeña, trasladamos el evento a la universidad.", pt: "Como a sala é pequena demais, transferimos o evento para a universidade.", fr: "Comme la salle est trop petite, nous déplaçons l’événement à l’université.", de: "Da der Saal zu klein ist, verlegen wir die Veranstaltung an die Universität.", it: "Poiché la sala è troppo piccola, spostiamo l’evento all’università.", pl: "Ponieważ sala jest za mała, przenosimy wydarzenie na uniwersytet.", tr: "Salon çok küçük olduğu için etkinliği üniversiteye taşıyoruz.", id: "Karena aulanya terlalu kecil, kami memindahkan acara itu ke universitas.", vi: "Vì hội trường quá nhỏ, chúng tôi chuyển sự kiện sang trường đại học." }
        - level: C2
          point: { uk: Допуст, en: "Concession", es: "Concesión", pt: "Concessão", fr: "Concession", de: "Einräumung", it: "Concessione", pl: "Ustępstwo", tr: "Ödün", id: "Konsesi", vi: "Nhượng bộ" }
          rule:
            uk: [{ term: хоч }, ": у головній частині є протилежна дія, часто з ", { term: проте́ }]
            en: [{ term: хоч }, ": the main clause holds the opposite action, often with ", { term: проте́ }]
            es: [{ term: хоч }, ": la oración principal contiene la acción opuesta, a menudo con ", { term: проте́ }]
            pt: [{ term: хоч }, ": a oração principal traz a ação oposta, muitas vezes com ", { term: проте́ }]
            fr: [{ term: хоч }, " : la principale contient l’action opposée, souvent avec ", { term: проте́ }]
            de: [{ term: хоч }, ": im Hauptsatz steht die gegenteilige Handlung, oft mit ", { term: проте́ }]
            it: [{ term: хоч }, ": nella principale c’è l’azione opposta, spesso con ", { term: проте́ }]
            pl: [{ term: хоч }, ": w zdaniu głównym jest czynność przeciwna, często z ", { term: проте́ }]
            tr: [{ term: хоч }, ": ana cümlede karşıt bir eylem bulunur, çoğu zaman ", { term: проте́ }, " ile birlikte"]
            id: [{ term: хоч }, ": di induk kalimat ada tindakan yang berlawanan, sering bersama ", { term: проте́ }]
            vi: [{ term: хоч }, ": mệnh đề chính có hành động đối lập, thường đi với ", { term: проте́ }]
          ex: ["Надво́рі ще лежа́в сніг, ", { target: хоч }, " за календаре́м уже́ була́ весна́."]
          tr: { en: "Snow still lay outside, although by the calendar it was already spring.", es: "Afuera aún había nieve, aunque según el calendario ya era primavera.", pt: "Lá fora ainda havia neve, embora pelo calendário já fosse primavera.", fr: "Dehors, il y avait encore de la neige, même si, selon le calendrier, c’était déjà le printemps.", de: "Draußen lag noch Schnee, obwohl nach dem Kalender schon Frühling war.", it: "Fuori c’era ancora la neve, benché secondo il calendario fosse già primavera.", pl: "Na dworze leżał jeszcze śnieg, chociaż według kalendarza była już wiosna.", tr: "Dışarıda hâlâ kar vardı, takvime göre bahar çoktan gelmiş olsa da.", id: "Di luar masih ada salju, meskipun menurut kalender sudah musim semi.", vi: "Ngoài trời vẫn còn tuyết, mặc dù theo lịch thì đã là mùa xuân." }
        - level: C2
          point: { uk: Кома, en: "Comma", es: "Coma", pt: "Vírgula", fr: "Virgule", de: "Komma", it: "Virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
          rule:
            uk: "кома перед сполучником; навколо вставленої частини — дві коми"
            en: "a comma before the conjunction; two commas around an inserted clause"
            es: "coma delante del conector; dos comas alrededor de una oración intercalada"
            pt: "vírgula antes da conjunção; duas vírgulas ao redor de uma oração intercalada"
            fr: "virgule devant la conjonction ; deux virgules autour d’une proposition insérée"
            de: "Komma vor der Konjunktion; zwei Kommas um einen eingeschobenen Teilsatz"
            it: "virgola prima della congiunzione; due virgole attorno a una proposizione inserita"
            pl: "przecinek przed spójnikiem; dwa przecinki wokół wtrąconego zdania"
            tr: "bağlaçtan önce virgül; araya giren cümlenin iki yanında iki virgül"
            id: "koma sebelum konjungsi; dua koma mengapit klausa yang disisipkan"
            vi: "dấu phẩy đứng trước liên từ; hai dấu phẩy đứng quanh mệnh đề được chèn vào"
          ex: { examples: [["Ми живемо́ там", { target: ", де" }, " ті́хо."], ["За́хід", { target: ", оскі́льки за́л зама́лий," }, " перенесли́."]] }
          tr: { en: { examples: ["We live there, where it is quiet.", "The event, since the hall is too small, was moved."] }, es: { examples: ["Vivimos allí donde hay tranquilidad.", "El evento, puesto que la sala es demasiado pequeña, se trasladó."] }, pt: { examples: ["Moramos lá, onde é tranquilo.", "O evento, visto que a sala é pequena demais, foi transferido."] }, fr: { examples: ["Nous habitons là où il fait calme.", "L’événement, puisque la salle est trop petite, a été déplacé."] }, de: { examples: ["Wir wohnen dort, wo es ruhig ist.", "Die Veranstaltung wurde, da der Saal zu klein ist, verlegt."] }, it: { examples: ["Abitiamo là dove è tranquillo.", "L’evento, poiché la sala è troppo piccola, è stato spostato."] }, pl: { examples: ["Mieszkamy tam, gdzie jest cicho.", "Wydarzenie, ponieważ sala jest za mała, przeniesiono."] }, tr: { examples: ["Sessiz olan yerde yaşıyoruz.", "Etkinlik, salon çok küçük olduğu için, taşındı."] }, id: { examples: ["Kami tinggal di sana, di tempat yang tenang.", "Acara itu, karena aulanya terlalu kecil, dipindahkan."] }, vi: { examples: ["Chúng tôi sống ở đó, nơi yên tĩnh.", "Sự kiện, vì hội trường quá nhỏ, đã được chuyển đi."] } }
        - level: C1
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: "сполучне слово повторює напрямок співвідносного"
            en: "the connecting word repeats the direction of the correlative word"
            es: "la palabra de enlace repite la dirección de la palabra correlativa"
            pt: "a palavra de ligação repete a direção da palavra correlativa"
            fr: "le mot de liaison reprend la direction du mot corrélatif"
            de: "das einleitende Wort wiederholt die Richtung des Korrelats"
            it: "la parola di collegamento ripete la direzione della parola correlativa"
            pl: "wyraz łączący powtarza kierunek wyrazu wskazującego"
            tr: "bağlayıcı sözcük, karşılık sözcüğün yönünü yineler"
            id: "kata penghubung mengulang arah kata korelatif"
            vi: "từ nối lặp lại hướng của từ tương ứng"
          ex: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]
          tr: { en: "We will go there, where this road leads.", es: "Iremos allí adonde lleva este camino.", pt: "Iremos para lá, aonde esta estrada leva.", fr: "Nous irons là où mène cette route.", de: "Wir fahren dorthin, wohin diese Straße führt.", it: "Andremo là dove porta questa strada.", pl: "Pojedziemy tam, dokąd prowadzi ta droga.", tr: "Bu yolun götürdüğü yere gideceğiz.", id: "Kami akan pergi ke tempat yang dituju jalan ini.", vi: "Chúng tôi sẽ đi đến nơi con đường này dẫn tới." }
        - level: C2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: [{ term: так як }, " у значенні причини — росіянізм"]
            en: [{ term: так як }, " meaning “because” is a Russianism"]
            es: [{ term: так як }, " con el sentido de «porque» es un rusismo"]
            pt: [{ term: так як }, " com o sentido de “porque” é um russismo"]
            fr: [{ term: так як }, " au sens de « parce que » est un russisme"]
            de: [{ term: так як }, " in der Bedeutung „weil“ ist ein Russizismus"]
            it: [{ term: так як }, " con il senso di «perché» è un russismo"]
            pl: [{ term: так як }, " w znaczeniu „ponieważ” to rusycyzm"]
            tr: [{ term: так як }, " “çünkü” anlamında Rusça etkisidir"]
            id: [{ term: так як }, " dengan arti “karena” adalah rusisme"]
            vi: [{ term: так як }, " với nghĩa “vì” là từ chịu ảnh hưởng tiếng Nga"]
          ex: ["Ми сиді́ли вдо́ма", { target: ", тому́ що" }, " ішо́в дощ."]
          tr: { en: "We stayed at home because it was raining.", es: "Nos quedamos en casa porque llovía.", pt: "Ficamos em casa porque estava chovendo.", fr: "Nous sommes restés à la maison parce qu’il pleuvait.", de: "Wir blieben zu Hause, weil es regnete.", it: "Siamo rimasti a casa perché pioveva.", pl: "Siedzieliśmy w domu, ponieważ padał deszcz.", tr: "Yağmur yağdığı için evde kaldık.", id: "Kami tinggal di rumah karena hujan turun.", vi: "Chúng tôi ở nhà vì trời mưa." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: "Обставинна підрядна частина називає місце, спосіб, ступінь, час, причину чи допуст дії головної частини."
              en: "An adverbial clause names the place, manner, degree, time, cause or concession of the action in the main clause."
              es: "La subordinada adverbial indica lugar, modo, grado, tiempo, causa o concesión de la acción principal."
              pt: "A oração subordinada adverbial indica lugar, modo, grau, tempo, causa ou concessão da ação principal."
              fr: "Une subordonnée circonstancielle précise la circonstance de l’action principale : lieu, manière, degré, temps, cause ou concession."
              de: "Ein Adverbialsatz nennt Ort, Art und Weise, Grad, Zeit, Grund oder Einräumung der Handlung im Hauptsatz."
              it: "La subordinata circostanziale indica luogo, modo, grado, tempo, causa o concessione dell’azione della principale."
              pl: "Zdanie okolicznikowe podaje miejsce, sposób, stopień, czas, przyczynę lub ustępstwo czynności ze zdania głównego."
              tr: "Zarf cümleciği, ana cümledeki eylemin yerini, tarzını, derecesini, zamanını, nedenini veya ödününü bildirir."
              id: "Klausa keterangan menyatakan tempat, cara, tingkat, waktu, sebab, atau konsesi dari tindakan di induk kalimat."
              vi: "Mệnh đề trạng ngữ nêu nơi chốn, cách thức, mức độ, thời gian, lý do, nhượng bộ của hành động."
            ex: ["Ми живемо́ ", { target: там }, ", ", { target: де }, " ті́хо."]
            tr: { en: "We live there, where it is quiet.", es: "Vivimos allí donde hay tranquilidad.", pt: "Moramos lá, onde é tranquilo.", fr: "Nous habitons là où il fait calme.", de: "Wir wohnen dort, wo es ruhig ist.", it: "Abitiamo là dove è tranquillo.", pl: "Mieszkamy tam, gdzie jest cicho.", tr: "Sessiz olan yerde yaşıyoruz.", id: "Kami tinggal di sana, di tempat yang tenang.", vi: "Chúng tôi sống ở đó, nơi yên tĩnh." }
          - type: rule
            level: C1
            text:
              uk: "Сполучник чи сполучне слово підрядної частини має в головній частині співвідносне слово, яке на нього вказує."
              en: "The conjunction or connecting word of a subordinate clause is answered by a correlative word in the main clause."
              es: "El conector o la palabra de enlace de la subordinada tiene en la principal una palabra correlativa que lo señala."
              pt: "A conjunção ou a palavra de ligação da subordinada tem, na principal, uma palavra correlativa que a indica."
              fr: "Dans la principale, un mot corrélatif annonce la conjonction ou le mot de liaison de la subordonnée."
              de: "Im Hauptsatz verweist ein Korrelat auf die Konjunktion oder das einleitende Wort des Nebensatzes."
              it: "Nella principale, una parola correlativa rimanda alla congiunzione o alla parola di collegamento della subordinata."
              pl: "Spójnik lub wyraz łączący zdania podrzędnego ma w zdaniu głównym wyraz wskazujący, który na niego odsyła."
              tr: "Yan cümlenin bağlacına veya bağlayıcı sözcüğüne, ana cümlede onu gösteren bir karşılık sözcük denk gelir."
              id: "Konjungsi atau kata penghubung di anak kalimat punya kata korelatif di induk kalimat yang menunjuk padanya."
              vi: "Liên từ hoặc từ nối của mệnh đề phụ có từ tương ứng ở mệnh đề chính chỉ về nó."
            ex: ["Вона́ ", { target: так }, " втоми́лася, ", { target: що }, " не могла́ говори́ти."]
            tr: { en: "She got so tired that she could not speak.", es: "Se cansó tanto que no podía hablar.", pt: "Ela se cansou tanto que não conseguia falar.", fr: "Elle s’est tellement fatiguée qu’elle ne pouvait plus parler.", de: "Sie war so müde, dass sie nicht sprechen konnte.", it: "Si è stancata tanto che non riusciva a parlare.", pl: "Tak się zmęczyła, że nie mogła mówić.", tr: "O kadar yoruldu ki konuşamadı.", id: "Dia begitu lelah sehingga tidak bisa berbicara.", vi: "Cô ấy mệt đến nỗi không nói được." }

  - title: { uk: "Місце: де, куди, звідки", en: "Place: де, куди, звідки", es: "Lugar: де, куди, звідки", pt: "Lugar: де, куди, звідки", fr: "Lieu : де, куди, звідки", de: "Ort: де, куди, звідки", it: "Luogo: де, куди, звідки", pl: "Miejsce: де, куди, звідки", tr: "Yer: де, куди, звідки", id: "Tempat: де, куди, звідки", vi: "Nơi chốn: де, куди, звідки" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина", en: "Subordinate clause", es: "Oración subordinada", pt: "Oração subordinada", fr: "Subordonnée", de: "Nebensatz", it: "Subordinata", pl: "Zdanie podrzędne", tr: "Yan cümle", id: "Anak kalimat", vi: "Mệnh đề phụ" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
