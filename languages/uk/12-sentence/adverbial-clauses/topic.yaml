# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.sentence.adverbial-clauses
lang: uk
kind: grammar
tags: [adverbial-clauses, subordinate-clauses, place, manner, result, concession, cause]
concepts: [linkers, adverbial-clauses]
related: [uk.sentence.when-if, uk.sentence.shcho-shchob, uk.sentence.conjunctions, uk.sentence.relative-yakyi]
status: { uk: draft }

title: { uk: "Обставинні підрядні речення" }
summary:
  lead:
    uk: "Підрядні частини місця, способу, ступеня, часу, причини й допусту приєднуються сполучниками, а в головній частині їм відповідають співвідносні слова."
  rule:
    uk: "Співвідносне слово головної частини й сполучне слово підрядної вказують на те саме:"
  ex: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт } }
        - { key: rule, label: { uk: Правило } }
        - { key: ex, label: { uk: Приклад } }
      rows:
        - level: C1
          point: { uk: ["Місце: ", { term: де }, ", ", { term: куди́ }, ", ", { term: зві́дки }] }
          rule:
            uk: [{ term: там }, ", ", { term: туди́ }, ", ", { term: зві́дти }, " у головній частині; ", { term: де }, ", ", { term: куди́ }, ", ", { term: зві́дки }, " у підрядній"]
          ex: ["Бібліоте́ка стої́ть ", { target: там }, ", ", { target: де }, " закі́нчується парк."]
        - level: C1
          point: { uk: Порівняння }
          rule:
            uk: [{ alternatives: [{ term: як }, { term: на́че }, { term: мов }, { term: ні́би }] }, ": подібність до образу"]
          ex: ["Рі́чка лежа́ла нерухо́мо, ", { target: на́че }, " хтось розли́в срібло́."]
        - level: C1
          point: { uk: Ступінь }
          rule:
            uk: [{ term: ["таки́й ", { gap: true }, " що"] }, " при іменнику, ", { term: ["так ", { gap: true }, " що"] }, " при дієслові"]
          ex: ["Вона́ ма́є ", { target: таки́й }, " го́лос, ", { target: що }, " всі замовка́ють."]
        - level: C1
          point: { uk: Наслідок }
          rule:
            uk: [{ term: так що }, ": наслідок усього, про що йдеться в головній частині"]
          ex: ["Дощ ішо́в усю́ ніч, ", { target: так що }, " вра́нці рі́чка ви́йшла з берегі́в."]
        - level: C1
          point: { uk: Допуст }
          rule:
            uk: [{ term: ["скі́льки ", { gap: true }, " не"] }, ": дія повторюється, а наслідок той самий"]
          ex: [{ target: Скі́льки }, " ми ", { target: не }, " проси́ли, він не відчини́в две́рі."]
        - level: C1
          point: { uk: ["Час: ", { term: тоді́ }, ", ", { term: коли́ }] }
          rule:
            uk: [{ term: тоді́ }, " виділяє момент, ", { term: коли́ }, " його уточнює"]
          ex: ["Вона́ усміха́ється ", { target: тоді́ }, ", ", { target: коли́ }, " ду́має, що ніхто́ не ба́чить."]
        - level: C2
          point: { uk: Однаковий спосіб }
          rule:
            uk: [{ term: "так, як" }, ": спосіб такий самий, як у зразка"]
          ex: ["Ми святку́ємо ", { target: так }, ", ", { target: як }, " святкува́ли на́ші діди́."]
        - level: C2
          point: { uk: Причина }
          rule:
            uk: [{ term: тому́ що }, " — нейтральна причина, ", { term: оскі́льки }, " — відома підстава, ", { term: адже́ }, " — очевидна"]
          ex: [{ target: Оскі́льки }, " за́л зама́лий, ми перено́симо за́хід до університе́ту."]
        - level: C2
          point: { uk: Допуст }
          rule:
            uk: [{ term: хоч }, ": у головній частині є протилежна дія, часто з ", { term: проте́ }]
          ex: ["Надво́рі ще лежа́в сніг, ", { target: хоч }, " за календаре́м уже́ була́ весна́."]
        - level: C2
          point: { uk: Кома }
          rule:
            uk: "кома перед сполучником; навколо вставленої частини — дві коми"
          ex: { examples: [["Ми живемо́ там", { target: ", де" }, " ті́хо."], ["За́хід", { target: ", оскі́льки за́л зама́лий," }, " перенесли́."]] }
        - level: C1
          point: { uk: Пастка }
          rule:
            uk: "сполучне слово повторює напрямок співвідносного"
          ex: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]
        - level: C2
          point: { uk: Пастка }
          rule:
            uk: [{ term: так як }, " у значенні причини — росіянізм"]
          ex: ["Ми сиді́ли вдо́ма", { target: ", тому́ що" }, " ішо́в дощ."]

sections:
  - title: { uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: "Обставинна підрядна частина називає місце, спосіб, ступінь, час, причину чи допуст дії головної частини."
            ex: ["Ми живемо́ ", { target: там }, ", ", { target: де }, " ті́хо."]
          - type: rule
            level: C1
            text:
              uk: "Сполучник чи сполучне слово підрядної частини має в головній частині співвідносне слово, яке на нього вказує."
            ex: ["Вона́ ", { target: так }, " втоми́лася, ", { target: що }, " не могла́ говори́ти."]

  - title: { uk: "Місце: де, куди, звідки" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: [{ term: де }, ": місце дії; в головній частині — ", { term: там }] }
            ex: ["Бібліоте́ка стої́ть ", { target: там }, ", ", { target: де }, " закі́нчується парк."]
          - level: C1
            use: { uk: [{ term: куди́ }, ": напрямок руху; в головній частині — ", { term: туди́ }] }
            ex: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]
          - level: C1
            use: { uk: [{ term: зві́дки }, ": початок руху; в головній частині — ", { term: зві́дти }] }
            ex: ["Він прині́с во́ду ", { target: зві́дти }, ", ", { target: зві́дки }, " її́ бра́ли діди́."]

  - title: { uk: "Спосіб і порівняння: як, наче, мов, ніби" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: [{ term: як }, ": спосіб, подібний до відомого зразка"] }
            ex: ["Вона́ співа́є, ", { target: як }, " співа́ла її́ ма́ти."]
          - level: C1
            use: { uk: [{ term: на́че }, ": подібність до уявного образу"] }
            ex: ["Рі́чка лежа́ла нерухо́мо, ", { target: на́че }, " хтось розли́в срібло́."]
          - level: C1
            use: { uk: [{ term: мов }, ": те саме, у книжній і поетичній мові"] }
            ex: ["Дощ шумі́в, ", { target: мов }, " хтось сипа́в горо́х."]
          - level: C1
            use: { uk: [{ term: ні́би }, ": як нібито, що лише здається"] }
            ex: ["Він мовча́в, ", { target: ні́би }, " нічо́го не чув."]
          - level: C2
            use: { uk: [{ term: "так, як" }, ": спосіб такий самий, як у зразка"] }
            ex: ["Ми святку́ємо ", { target: так }, ", ", { target: як }, " святкува́ли на́ші діди́."]
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: ["Перед ", { term: на́че }, ", ", { term: мов }, " і ", { term: ні́би }, " стоїть кома; вони замінюють одне одного."]

  - title: { uk: "Ступінь і наслідок: такий… що, так що" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: [{ term: ["таки́й ", { gap: true }, " що"] }, ": ступінь ознаки предмета"] }
            ex: ["Вона́ ма́є ", { target: таки́й }, " го́лос, ", { target: що }, " всі замовка́ють."]
          - level: C1
            use: { uk: [{ term: ["так ", { gap: true }, " що"] }, ": ступінь дії"] }
            ex: ["Він ", { target: так }, " втоми́вся, ", { target: що }, " не міг говори́ти."]
          - level: C1
            use: { uk: [{ term: так що }, ": наслідок усього, про що йдеться в головній частині"] }
            ex: ["Дощ ішо́в усю́ ніч, ", { target: так що }, " вра́нці рі́чка ви́йшла з берегі́в."]
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: [{ term: Таки́й }, " змінюється за родом, числом і відмінком, а ", { term: так }, " не змінюється."]
            ex: { examples: [[{ target: таки́й }, " го́лос"], [{ target: така́ }, " ти́ша"], [{ target: таке́ }, " мо́ре"], [{ target: такі́ }, " ді́ти"]] }
          - type: rule
            level: C1
            text:
              uk: ["Кома стоїть перед ", { term: що }, " у парі ", { term: ["таки́й ", { gap: true }, " що"] }, " і перед ", { term: так }, " у сполучнику ", { term: так що }, "."]

  - title: { uk: "Допуст: скільки… не, хоч" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: [{ term: ["скі́льки ", { gap: true }, " не"] }, ": дія повторюється, а наслідок той самий"] }
            ex: [{ target: Скі́льки }, " ми ", { target: не }, " проси́ли, він не відчини́в две́рі."]
          - level: C1
            use: { uk: [{ term: ["куди́ ", { gap: true }, " не"] }, ", ", { term: ["як ", { gap: true }, " не"] }, ": те саме з іншим питальним словом"] }
            ex: { examples: [[{ target: Куди́ }, " ти ", { target: не }, " гля́нь, усю́ди го́ри."], [{ target: Як }, " ти ", { target: не }, " стара́йся, усі́х не поті́шиш."]] }
          - level: C2
            use: { uk: [{ term: хоч }, ": у головній частині стоїть протилежна дія"] }
            ex: ["Надво́рі ще лежа́в сніг, ", { target: хоч }, " за календаре́м уже́ була́ весна́."]
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: ["Частка ", { term: не }, " у таких конструкціях не заперечує дію: вона справді відбувалася."]
          - type: rule
            level: C2
            text:
              uk: [{ term: Проте́ }, ", ", { term: одна́к }, " і ", { term: все ж }, " у головній частині підсилюють протилежність."]
            ex: ["Хоч ді́ти втоми́лися, ", { target: проте́ }, " йти додо́му не хоті́ли."]

  - title: { uk: "Час: тоді, коли" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C1
            use: { uk: [{ term: ["тоді́ ", { gap: true }, " коли́"] }, ": виділений момент"] }
            ex: ["Вона́ усміха́ється ", { target: тоді́ }, ", ", { target: коли́ }, " ду́має, що ніхто́ не ба́чить."]
      - type: list
        items:
          - type: note
            level: C1
            text:
              uk: ["Без ", { term: тоді́ }, " підрядна частина лише називає час: ", { link: "Коли, якщо, якби", to: uk.sentence.when-if }, "."]

  - title: { uk: "Причина: тому що, оскільки, адже" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: "Підрядна частина" } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            use: { uk: [{ term: тому́ що }, ": нейтральна причина"] }
            ex: ["Збо́ри перенесли́, ", { target: тому́ що }, " не було́ кво́руму."]
          - level: C2
            use: { uk: [{ term: оскі́льки }, ": причина як відома підстава; підрядна частина зазвичай йде першою"] }
            ex: [{ target: Оскі́льки }, " за́л зама́лий, ми перено́симо за́хід до університе́ту."]
          - level: C2
            use: { uk: [{ term: адже́ }, ": причина, яку співрозмовник знає й мусить визнати; підрядна частина зазвичай йде другою"] }
            ex: ["Не хвилю́йся, ", { target: адже́ }, " усе́ вже підгото́влено."]
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: ["У діловому й науковому мовленні переважають ", { term: тому́ що }, " й ", { term: оскі́льки }, "; ", { term: бо }, " звучить розмовніше."]
          - type: note
            level: C2
            text:
              uk: ["Причина в простих реченнях: ", { link: Сполучники, to: uk.sentence.conjunctions }, "."]

  - title: { uk: "Положення підрядної частини й кома" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Правило } }
          - { key: ex, label: { uk: Приклад } }
        rows:
          - level: C2
            use: { uk: "підрядна частина після головної: кома перед сполучником" }
            ex: ["Ми пої́демо туди́", { target: ", куди́" }, " веде́ ця доро́га."]
          - level: C2
            use: { uk: "підрядна частина перед головною: кома після неї" }
            ex: [{ target: Оскі́льки }, " пого́да по́гана", { target: "," }, " ми залиша́ємося вдо́ма."]
          - level: C2
            use: { uk: "підрядна частина всередині головної: дві коми" }
            ex: ["За́хід", { target: ", оскі́льки за́л зама́лий," }, " перенесли́ до університе́ту."]
          - level: C2
            use: { uk: "співвідносне слово можна пропустити: кома лишається перед сполучним словом" }
            ex: ["Ми піде́мо", { target: ", куди́" }, " веде́ стежка́."]

  - title: { uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - level: C1
            wrong: "Ми пої́демо туди́, де веде́ ця доро́га."
            right: ["Ми пої́демо ", { target: туди́ }, ", ", { target: куди́ }, " веде́ ця доро́га."]
            rule: { uk: ["сполучне слово повторює напрямок співвідносного: ", { term: туди́ }, " — ", { term: куди́ }] }
          - level: C1
            wrong: "Вона́ ма́є таки́й го́лос що всі замовка́ють."
            right: ["Вона́ ма́є таки́й го́лос", { target: ", що" }, " всі замовка́ють."]
            rule: { uk: ["кома стоїть перед ", { term: що }, " в парі ", { term: ["таки́й ", { gap: true }, " що"] }] }
          - level: C2
            wrong: "Ми сиді́ли вдо́ма, так як ішо́в дощ."
            right: ["Ми сиді́ли вдо́ма, ", { target: тому́ що }, " ішо́в дощ."]
            rule: { uk: [{ term: так як }, " — калька з російського «так как»; причину виражають ", { term: тому́ що }, ", ", { term: оскі́льки }, ", ", { term: адже́ }] }
