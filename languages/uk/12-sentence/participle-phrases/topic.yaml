          - level: B1
            form: { uk: ["дієприслівник на ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": недоконаний вид"], en: ["an adverbial participle in ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfective"], es: ["gerundio en ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfectivo"], pt: ["gerúndio em ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfectivo"], fr: ["gérondif en ", { alternatives: [{ term: -ючи }, { term: -учи }] }, " : imperfectif"], de: ["Adverbialpartizip auf ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfektiv"], it: ["gerundio in ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfettivo"], pl: ["imiesłów przysłówkowy na ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": niedokonany"], tr: [{ alternatives: [{ term: -ючи }, { term: -учи }] }, " ile biten zarf-fiil: tamamlanmamış görünüş"], id: ["partisipel adverbial berakhiran ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfektif"], vi: ["phân từ trạng ngữ tận cùng ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": thể chưa hoàn thành"] }
