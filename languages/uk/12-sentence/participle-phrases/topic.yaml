        rows:
          - level: B1
            use: { ex: ["Лист, ", { target: напи́саний олівце́м }, ", лежи́ть на столі́."], tr: { en: "The letter written in pencil is on the table.", es: "La carta escrita a lápiz está sobre la mesa.", pt: "A carta escrita a lápis está sobre a mesa.", fr: "La lettre écrite au crayon est sur la table.", de: "Der mit Bleistift geschriebene Brief liegt auf dem Tisch.", it: "La lettera scritta a matita è sul tavolo.", pl: "List napisany ołówkiem leży na stole.", tr: "Kurşun kalemle yazılmış mektup masanın üstünde.", id: "Surat tertulis dengan pensil ada di atas meja.", vi: "Lá thư viết bằng bút chì nằm trên bàn." } }
            ex: ["Лист, ", { target: яки́й написа́ли олівце́м }, ", лежи́ть на столі́."]
            tr: { en: "The letter that was written in pencil is on the table.", es: "La carta que se escribió a lápiz está sobre la mesa.", pt: "A carta que foi escrita a lápis está sobre a mesa.", fr: "La lettre qui a été écrite au crayon est sur la table.", de: "Der Brief, der mit Bleistift geschrieben wurde, liegt auf dem Tisch.", it: "La lettera che è stata scritta a matita è sul tavolo.", pl: "List, który został napisany ołówkiem, leży na stole.", tr: "Kurşun kalemle yazılan mektup masanın üstünde.", id: "Surat yang ditulis dengan pensil ada di atas meja.", vi: "Lá thư mà người ta đã viết bằng bút chì nằm trên bàn." }
          - level: B1
            use: { ex: [{ target: Чита́ючи текст }, ", вона́ випи́сувала нові́ слова́."], tr: { en: "Reading the text, she wrote out the new words.", es: "Leyendo el texto, anotaba las palabras nuevas.", pt: "Lendo o texto, ela anotava as palavras novas.", fr: "En lisant le texte, elle notait les mots nouveaux.", de: "Beim Lesen des Textes schrieb sie die neuen Wörter heraus.", it: "Leggendo il testo, annotava le parole nuove.", pl: "Czytając tekst, wypisywała nowe słowa.", tr: "Metni okurken yeni sözcükleri not alıyordu.", id: "Sambil membaca teks, dia mencatat kata-kata baru.", vi: "Vừa đọc văn bản, cô ấy vừa chép lại các từ mới." } }
            ex: [{ target: Коли́ вона́ чита́ла текст }, ", вона́ випи́сувала нові́ слова́."]
            tr: { en: "While she was reading the text, she wrote out the new words.", es: "Mientras leía el texto, anotaba las palabras nuevas.", pt: "Enquanto lia o texto, ela anotava as palavras novas.", fr: "Pendant qu’elle lisait le texte, elle notait les mots nouveaux.", de: "Während sie den Text las, schrieb sie die neuen Wörter heraus.", it: "Mentre leggeva il testo, annotava le parole nuove.", pl: "Kiedy czytała tekst, wypisywała nowe słowa.", tr: "Metni okuduğu sırada yeni sözcükleri not alıyordu.", id: "Sementara dia membaca teks, dia mencatat kata-kata baru.", vi: "Khi cô ấy đọc văn bản, cô ấy chép lại các từ mới." }
          - level: B1
            use: { ex: [{ target: Поверну́вшись додо́му }, ", ми повече́ряли."], tr: { en: "Having come home, we had dinner.", es: "Al volver a casa, cenamos.", pt: "Ao voltar para casa, jantamos.", fr: "Une fois rentrés à la maison, nous avons dîné.", de: "Nach Hause zurückgekehrt, aßen wir zu Abend.", it: "Tornati a casa, abbiamo cenato.", pl: "Wróciwszy do domu, zjedliśmy kolację.", tr: "Eve dönünce akşam yemeği yedik.", id: "Setelah pulang ke rumah, kami makan malam.", vi: "Về đến nhà, chúng tôi ăn tối." } }
            ex: [{ target: Коли́ ми поверну́лися додо́му }, ", ми повече́ряли."]
            tr: { en: "When we came home, we had dinner.", es: "Cuando volvimos a casa, cenamos.", pt: "Quando voltamos para casa, jantamos.", fr: "Quand nous sommes rentrés à la maison, nous avons dîné.", de: "Als wir nach Hause zurückgekehrt waren, aßen wir zu Abend.", it: "Quando siamo tornati a casa, abbiamo cenato.", pl: "Kiedy wróciliśmy do domu, zjedliśmy kolację.", tr: "Eve döndüğümüzde akşam yemeği yedik.", id: "Ketika kami pulang ke rumah, kami makan malam.", vi: "Khi chúng tôi về đến nhà, chúng tôi ăn tối." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Коли говоримо про людину, що діє, українська вживає речення з ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
