id: uk.sentence.participle-phrases
lang: uk
kind: grammar
tags: [participles, participle-phrases, punctuation, reading]
concepts: [participles]
related: [uk.sentence.relative-yakyi, uk.sentence.when-if, uk.past-aspect.aspect, uk.word-formation.word-formation]
status: { uk: draft, en: draft, es: draft }
translated: { en: "3869b0 a0de2a 46395f baffb8 f14725 934fce", es: "3869b0 a0de2a 46395f baffb8 f14725 934fce" }

title: { uk: Дієприкметникові й дієприслівникові звороти, en: Participle Phrases, es: Construcciones de participio }
summary:
  lead:
    uk: ["Дієприкметниковий зворот описує іменник: ", { term: "лист, напи́саний олівце́м" }, "; дієприслівниковий називає ще одну дію підмета: ", { term: поверну́вшись додо́му }, "."]
    en: ["A participle phrase describes a noun, ", { term: "лист, напи́саний олівце́м" }, "; an adverbial participle names another action of the subject, ", { term: поверну́вшись додо́му }, "."]
    es: ["El participio describe un sustantivo, ", { term: "лист, напи́саний олівце́м" }, "; el gerundio ucraniano nombra otra acción del sujeto, ", { term: поверну́вшись додо́му }, "."]
  rule:
    uk: "Зворот відокремлюємо комою, а всередині речення — двома комами; дію дієприслівника виконує підмет речення:"
    en: "A comma sets off the phrase, two commas inside the sentence; the subject of the sentence does the action of the adverbial participle:"
    es: "Una coma separa la construcción, dos comas si va en medio de la oración; el sujeto de la oración hace la acción del gerundio:"
  ex: [{ target: Поверну́вшись з екску́рсії }, ", ми пообі́дали в рестора́ні."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { alternatives: [-ний, -тий] }
          rule:
            uk: "дієприкметник: який? змінюється, як прикметник"
            en: "a participle: which? changes like an adjective"
            es: "un participio: ¿cuál? cambia como un adjetivo"
          ex: ["Лист, ", { target: напи́саний }, " олівце́м, лежи́ть на столі́."]
          tr: { en: "The letter, written in pencil, is lying on the table.", es: "La carta, escrita a lápiz, está sobre la mesa." }
        - level: B1
          point: { alternatives: [-ючи, -учи] }
          rule:
            uk: "дієприслівник: дія одночасна"
            en: "an adverbial participle: at the same time"
            es: "un gerundio: al mismo tiempo"
          ex: [{ target: Чита́ючи }, " текст, вона́ випи́сувала нові́ слова́."]
          tr: { en: "Reading the text, she wrote out the new words.", es: "Leyendo el texto, anotaba las palabras nuevas." }
        - level: B1
          point: { alternatives: [-вши, -ши] }
          rule:
            uk: "дієприслівник: дія раніша"
            en: "an adverbial participle: done before"
            es: "un gerundio: acción anterior"
          ex: [{ target: Прочита́вши }, " лист, ма́ма всміхну́лася."]
          tr: { en: "Having read the letter, Mum smiled.", es: "Después de leer la carta, mamá sonrió." }
        - level: B1
          point: { uk: Значення, en: Meaning, es: Significado }
          rule:
            uk: ["зворот = підрядне речення з ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            en: ["the phrase = a clause with ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            es: ["la construcción = una oración con ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
          ex: { equivalence: [["лист, ", { target: напи́саний }, " олівце́м"], ["лист, ", { target: яки́й написа́ли }, " олівце́м"]] }
          tr: { en: { equivalence: ["the letter written in pencil", "the letter that was written in pencil"] }, es: { equivalence: ["la carta escrita a lápiz", "la carta que se escribió a lápiz"] } }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: "дію дієприслівника виконує підмет"
            en: "the subject does the action of the adverbial participle"
            es: "el sujeto hace la acción del gerundio"
          ex: [{ target: Поверну́вшись }, " додо́му, ", { target: ми }, " повече́ряли."]
          tr: { en: "Having come home, we had dinner.", es: "Al volver a casa, cenamos." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["про людину, що діє, — підрядне речення з ", { term: яки́й }]
            en: ["for someone doing something, a clause with ", { term: яки́й }]
            es: ["para quien hace algo, una oración con ", { term: яки́й }]
          ex: ["Я ба́чу студе́нта, ", { target: яки́й чита́є }, " кни́жку."]
          tr: { en: "I can see a student reading a book.", es: "Veo a un estudiante que lee un libro." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Звороти трапляються переважно в письмових текстах; на цьому рівні їх треба розпізнавати й розуміти."
              en: "These phrases appear mostly in written texts; at this level you recognise and understand them."
              es: "Estas construcciones aparecen sobre todo en textos escritos; en este nivel se trata de reconocerlas y entenderlas."
          - type: rule
            level: B1
            text:
              uk: "Дієприкметниковий зворот стоїть після іменника, який описує; у кінці речення його відокремлює одна кома, усередині — дві."
              en: "A participle phrase follows the noun it describes; at the end of the sentence one comma sets it off, inside the sentence two."
              es: "La construcción de participio va detrás del sustantivo que describe; al final de la oración la separa una coma, en medio, dos."
            ex: ["Ми поверну́лися з екску́рсії, ", { target: організо́ваної для уча́сників }, " конфере́нції."]
            tr: { en: "We came back from the trip organised for the conference participants.", es: "Volvimos de la excursión organizada para los participantes del congreso." }
          - type: rule
            level: B1
            text:
              uk: "Дієприслівниковий зворот називає ще одну дію підмета; його так само відокремлюємо комою, а всередині речення — двома."
              en: "An adverbial participle phrase names another action of the subject; it too takes one comma, or two inside the sentence."
              es: "La construcción de gerundio nombra otra acción del sujeto; también lleva una coma, o dos en medio de la oración."
            ex: [{ target: Поверну́вшись з екску́рсії }, ", ми сма́чно пообі́дали в рестора́ні."]
            tr: { en: "Having come back from the trip, we had a good lunch in a restaurant.", es: "Al volver de la excursión, comimos muy bien en un restaurante." }

  - title: { uk: "Форма: як їх упізнати", en: "Form: how to recognise them", es: "Forma: cómo reconocerlas" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            form: { uk: ["дієприкметник на ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": як прикметник"], en: ["a participle in ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": like an adjective"], es: ["participio en ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": como un adjetivo"] }
            ex: { examples: [{ mapping: [написа́ти, { target: напи́саний }] }, { mapping: [відкри́ти, { target: відкри́тий }] }] }
          - level: B1
            form: { uk: ["дієприслівник на ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": недоконаний вид"], en: ["an adverbial participle in ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfective"], es: ["gerundio en ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfectivo"] }
            ex: { examples: [{ mapping: [чита́ти, { target: чита́ючи }] }, { mapping: [іти́, { target: ідучи́ }] }] }
          - level: B1
            form: { uk: ["дієприслівник на ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": доконаний вид"], en: ["an adverbial participle in ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfective"], es: ["gerundio en ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfectivo"] }
            ex: { examples: [{ mapping: [прочита́ти, { target: прочита́вши }] }, { mapping: [поверну́тися, { target: поверну́вшись }] }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Дієприкметник узгоджується з іменником у роді, числі й відмінку, як прикметник."
              en: "A participle agrees with its noun in gender, number and case, like an adjective."
              es: "El participio concuerda con su sustantivo en género, número y caso, como un adjetivo."
            ex: { examples: [["вікно́, ", { target: відкри́те }, " вра́нці"], ["две́рі, ", { target: відкри́ті }, " на ніч"]] }
            tr: { en: { examples: ["the window opened in the morning", "the door left open for the night"] }, es: { examples: ["la ventana abierta por la mañana", "la puerta abierta por la noche"] } }
          - type: rule
            level: B1
            text:
              uk: "Дієприслівник не змінюється; недоконаний вид означає одночасну дію, доконаний — дію, що відбулася раніше."
              en: "An adverbial participle never changes; the imperfective means at the same time, the perfective means done before."
              es: "El gerundio no cambia; el imperfectivo indica una acción simultánea, el perfectivo una acción anterior."

  - title: { uk: "Значення: зворот і підрядне речення", en: "Meaning: the phrase as a clause", es: "Significado: la construcción como oración" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Зворот, en: Phrase, es: Construcción } }
          - { key: ex, label: { uk: Те саме підрядним реченням, en: The same as a clause, es: Lo mismo con una oración } }
        rows:
          - level: B1
            use: { ex: ["Лист, ", { target: напи́саний олівце́м }, ", лежи́ть на столі́."], tr: { en: "The letter written in pencil is on the table.", es: "La carta escrita a lápiz está sobre la mesa." } }
            ex: ["Лист, ", { target: яки́й написа́ли олівце́м }, ", лежи́ть на столі́."]
            tr: { en: "The letter that was written in pencil is on the table.", es: "La carta que se escribió a lápiz está sobre la mesa." }
          - level: B1
            use: { ex: [{ target: Чита́ючи текст }, ", вона́ випи́сувала нові́ слова́."], tr: { en: "Reading the text, she wrote out the new words.", es: "Leyendo el texto, anotaba las palabras nuevas." } }
            ex: [{ target: Коли́ вона́ чита́ла текст }, ", вона́ випи́сувала нові́ слова́."]
            tr: { en: "While she was reading the text, she wrote out the new words.", es: "Mientras leía el texto, anotaba las palabras nuevas." }
          - level: B1
            use: { ex: [{ target: Поверну́вшись додо́му }, ", ми повече́ряли."], tr: { en: "Having come home, we had dinner.", es: "Al volver a casa, cenamos." } }
            ex: [{ target: Коли́ ми поверну́лися додо́му }, ", ми повече́ряли."]
            tr: { en: "When we came home, we had dinner.", es: "Cuando volvimos a casa, cenamos." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Коли говоримо про людину, що діє, українська вживає речення з ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              en: ["For a person doing something, Ukrainian uses a clause with ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              es: ["Para una persona que hace algo, el ucraniano usa una oración con ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Я ба́чу студе́нта, чита́ючого кни́жку.", right: ["Я ба́чу студе́нта, ", { target: яки́й чита́є }, " кни́жку."], rule: { uk: ["дієприкметники на ", { term: -ючий }, " — калька з російської; уживаємо ", { term: яки́й }], en: ["participles in ", { term: -ючий }, " are a calque from Russian; use ", { term: яки́й }], es: ["los participios en ", { term: -ючий }, " son un calco del ruso; se usa ", { term: яки́й }] } }
          - { level: B1, wrong: "Поверну́вшись додо́му, поча́вся дощ.", right: [{ target: Коли́ ми поверну́лися }, " додо́му, поча́вся дощ."], rule: { uk: "дію дієприслівника виконує підмет; дощ не повертався додому", en: "the subject does the participle's action, and the rain did not come home", es: "el sujeto hace la acción del gerundio, y la lluvia no volvió a casa" } }
          - { level: B1, speakers: [en, es], wrong: "Поверну́вшись з екску́рсії ми пообі́дали.", right: [{ target: "Поверну́вшись з екску́рсії," }, " ми пообі́дали."], rule: { en: "a phrase at the start of the sentence ends with a comma", es: "la construcción al principio de la oración termina en coma" } }
