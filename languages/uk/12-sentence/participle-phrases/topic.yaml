        rows:
          - level: B2
            use: { uk: "дієприкметниковий зворот: виконавець дії в орудному відмінку" , en: "participle phrase: the doer of the action in the instrumental case", es: "construcción de participio: el agente de la acción en instrumental", pt: "construção com particípio: o agente da ação no instrumental", fr: "groupe participial : l’agent de l’action à l’instrumental", de: "Partizipialkonstruktion: der Urheber der Handlung im Instrumental", it: "costrutto participiale: l'agente dell'azione allo strumentale", pl: "wyrażenie imiesłowowe: wykonawca czynności w narzędniku", tr: "sıfat-fiil öbeği: eylemi yapan araç hâlinde", id: "frasa partisipel: pelaku tindakan dalam kasus instrumental", vi: "cụm phân từ: người thực hiện hành động ở công cụ cách"}
            ex: ["Буди́нок", { target: ", побудо́ваний на́шим дідо́м," }, " стої́ть бі́ля рі́чки."]
            tr: { en: "The house built by our grandfather stands by the river.", es: "La casa construida por nuestro abuelo está junto al río.", pt: "A casa construída pelo nosso avô fica perto do rio.", fr: "La maison construite par notre grand-père se trouve près de la rivière.", de: "Das von unserem Großvater gebaute Haus steht am Fluss.", it: "La casa costruita da nostro nonno si trova vicino al fiume.", pl: "Dom zbudowany przez naszego dziadka stoi nad rzeką.", tr: "Dedemizin yaptığı ev nehrin yanında duruyor.", id: "Rumah yang dibangun oleh kakek kami berdiri di dekat sungai.", vi: "Ngôi nhà do ông chúng tôi xây đứng bên bờ sông." }
          - level: B2
            use: { uk: "дієприкметниковий зворот: залежні слова з часом, місцем, способом" , en: "participle phrase: dependent words of time, place, manner", es: "construcción de participio: palabras dependientes de tiempo, lugar, modo", pt: "construção com particípio: palavras dependentes de tempo, lugar, modo", fr: "groupe participial : mots dépendants de temps, de lieu, de manière", de: "Partizipialkonstruktion: abhängige Wörter für Zeit, Ort, Art und Weise", it: "costrutto participiale: parole dipendenti di tempo, luogo, modo", pl: "wyrażenie imiesłowowe: wyrazy zależne określające czas, miejsce, sposób", tr: "sıfat-fiil öbeği: zaman, yer, biçim bildiren bağlı sözcükler", id: "frasa partisipel: kata bawahan yang menyatakan waktu, tempat, cara", vi: "cụm phân từ: các từ phụ thuộc chỉ thời gian, nơi chốn, cách thức"}
            ex: ["Лист", { target: ", отри́маний мину́лого ти́жня," }, " ще лежи́ть у су́мці."]
            tr: { en: "The letter received last week is still lying in the bag.", es: "La carta recibida la semana pasada todavía está en el bolso.", pt: "A carta recebida na semana passada ainda está na bolsa.", fr: "La lettre reçue la semaine dernière est encore dans le sac.", de: "Der letzte Woche erhaltene Brief liegt noch in der Tasche.", it: "La lettera ricevuta la settimana scorsa è ancora nella borsa.", pl: "List otrzymany w zeszłym tygodniu wciąż leży w torbie.", tr: "Geçen hafta alınan mektup hâlâ çantada duruyor.", id: "Surat yang diterima minggu lalu masih ada di dalam tas.", vi: "Lá thư nhận được tuần trước vẫn nằm trong túi." }
          - level: C1
            use: { uk: "дієприслівниковий зворот: посередині речення" , en: "adverbial participle phrase: in the middle of the sentence", es: "construcción de gerundio: en medio de la oración", pt: "construção com gerúndio: no meio da frase", fr: "groupe au gérondif : au milieu de la phrase", de: "Adverbialpartizipialkonstruktion: mitten im Satz", it: "costrutto con il gerundio: in mezzo alla frase", pl: "wyrażenie z imiesłowem przysłówkowym: w środku zdania", tr: "zarf-fiil öbeği: cümlenin ortasında", id: "frasa partisipel adverbial: di tengah kalimat", vi: "cụm phân từ trạng ngữ: ở giữa câu"}
            ex: ["Хло́пець", { target: ", підійшо́вши до вікна́," }, " відчини́в його́."]
            tr: { en: "The boy, having gone up to the window, opened it.", es: "El chico, tras acercarse a la ventana, la abrió.", pt: "O menino, depois de se aproximar da janela, abriu-a.", fr: "Le garçon, s’étant approché de la fenêtre, l’a ouverte.", de: "Der Junge, ans Fenster getreten, öffnete es.", it: "Il ragazzo, avvicinatosi alla finestra, l'aprì.", pl: "Chłopiec, podszedłszy do okna, otworzył je.", tr: "Çocuk pencereye yaklaşıp onu açtı.", id: "Anak laki-laki itu, setelah menghampiri jendela, membukanya.", vi: "Cậu bé đi đến bên cửa sổ rồi mở nó ra." }
          - level: C1
            use: { uk: "дієприслівниковий зворот: у кінці речення" , en: "adverbial participle phrase: at the end of the sentence", es: "construcción de gerundio: al final de la oración", pt: "construção com gerúndio: no fim da frase", fr: "groupe au gérondif : à la fin de la phrase", de: "Adverbialpartizipialkonstruktion: am Satzende", it: "costrutto con il gerundio: alla fine della frase", pl: "wyrażenie z imiesłowem przysłówkowym: na końcu zdania", tr: "zarf-fiil öbeği: cümlenin sonunda", id: "frasa partisipel adverbial: di akhir kalimat", vi: "cụm phân từ trạng ngữ: ở cuối câu"}
            ex: ["Він сиді́в", { target: ", схили́вши го́лову на ру́ки" }, "."]
            tr: { en: "He sat with his head bowed onto his hands.", es: "Estaba sentado con la cabeza apoyada en las manos.", pt: "Ele estava sentado com a cabeça apoiada nas mãos.", fr: "Il était assis, la tête appuyée sur ses mains.", de: "Er saß da, den Kopf in die Hände gestützt.", it: "Sedeva con la testa appoggiata sulle mani.", pl: "Siedział, opuściwszy głowę na ręce.", tr: "Başını ellerine yaslayıp oturuyordu.", id: "Dia duduk sambil menyandarkan kepalanya pada kedua tangannya.", vi: "Anh ngồi, gục đầu vào hai bàn tay." }
          - level: C1
            use: { uk: "група означень після іменника: відокремлена комами" , en: "a group of modifiers after the noun: set off by commas", es: "grupo de atributos tras el sustantivo: separado por comas", pt: "grupo de atributos depois do substantivo: separado por vírgulas", fr: "groupe d’épithètes après le nom : isolé par des virgules", de: "Gruppe von Attributen nach dem Nomen: durch Kommas abgetrennt", it: "gruppo di attributi dopo il sostantivo: isolato da virgole", pl: "grupa określeń po rzeczowniku: oddzielona przecinkami", tr: "isimden sonra gelen niteleyiciler grubu: virgüllerle ayrılır", id: "kelompok atribut setelah nomina: dipisahkan dengan koma", vi: "nhóm từ bổ nghĩa sau danh từ: ngăn bằng dấu phẩy"}
            ex: { examples: [["Ми до́вго диви́лися на мо́ре", { target: ", спокі́йне, си́нє, безме́жне" }, "."], ["Вона́ усміхну́лася ті́льки очи́ма", { target: ", стомле́ними, але́ щасли́вими" }, "."]] }
            tr: { en: { examples: ["We looked at the sea for a long time, calm, blue, boundless.", "She smiled only with her eyes, tired but happy."] }, es: { examples: ["Miramos mucho tiempo el mar, tranquilo, azul, inmenso.", "Sonrió solo con los ojos, cansados pero felices."] }, pt: { examples: ["Olhamos por muito tempo para o mar, calmo, azul, sem limites.", "Ela sorriu só com os olhos, cansados, mas felizes."] }, fr: { examples: ["Nous avons longtemps regardé la mer, calme, bleue, infinie.", "Elle n’a souri que des yeux, fatigués mais heureux."] }, de: { examples: ["Wir sahen lange auf das Meer, ruhig, blau, grenzenlos.", "Sie lächelte nur mit den Augen, müden, aber glücklichen."] }, it: { examples: ["Abbiamo guardato a lungo il mare, calmo, azzurro, sconfinato.", "Ha sorriso solo con gli occhi, stanchi ma felici."] }, pl: { examples: ["Długo patrzyliśmy na morze, spokojne, niebieskie, bezkresne.", "Uśmiechnęła się tylko oczami, zmęczonymi, ale szczęśliwymi."] }, tr: { examples: ["Uzun süre denize baktık; sakin, mavi, uçsuz bucaksız.", "Yalnızca gözleriyle gülümsedi; yorgun ama mutlu gözleriyle."] }, id: { examples: ["Kami lama memandang laut, tenang, biru, tak bertepi.", "Dia tersenyum hanya dengan matanya, yang lelah tetapi bahagia."] }, vi: { examples: ["Chúng tôi nhìn biển rất lâu, biển lặng, xanh, mênh mông.", "Cô ấy chỉ mỉm cười bằng đôi mắt, đôi mắt mệt mỏi nhưng hạnh phúc."] } }

  - title: { uk: "Значення: зворот і підрядне речення", en: "Meaning: the phrase as a clause", es: "Significado: la construcción como oración", pt: "Significado: a construção como oração", fr: "Sens : le groupe comme proposition", de: "Bedeutung: die Konstruktion als Nebensatz", it: "Significato: il costrutto come proposizione", pl: "Znaczenie: wyrażenie jako zdanie podrzędne", tr: "Anlam: öbek ve yan cümle", id: "Arti: frasa sebagai klausa", vi: "Nghĩa: cụm từ như một mệnh đề" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Зворот, en: Phrase, es: Construcción, pt: "Construção", fr: "Groupe", de: "Konstruktion", it: "Costrutto", pl: "Wyrażenie", tr: "Öbek", id: "Frasa", vi: "Cụm từ" } }
          - { key: ex, label: { uk: Те саме підрядним реченням, en: The same as a clause, es: Lo mismo con una oración, pt: "O mesmo com uma oração", fr: "La même chose avec une proposition", de: "Dasselbe als Nebensatz", it: "Lo stesso con una proposizione", pl: "To samo zdaniem podrzędnym", tr: "Aynısı yan cümleyle", id: "Hal yang sama dengan klausa", vi: "Cùng ý bằng mệnh đề" } }
        rows:
          - level: B1
            use: { ex: ["Лист, ", { target: напи́саний олівце́м }, ", лежи́ть на столі́."], tr: { en: "The letter written in pencil is on the table.", es: "La carta escrita a lápiz está sobre la mesa.", pt: "A carta escrita a lápis está sobre a mesa.", fr: "La lettre écrite au crayon est sur la table.", de: "Der mit Bleistift geschriebene Brief liegt auf dem Tisch.", it: "La lettera scritta a matita è sul tavolo.", pl: "List napisany ołówkiem leży na stole.", tr: "Kurşun kalemle yazılmış mektup masanın üstünde.", id: "Surat tertulis dengan pensil ada di atas meja.", vi: "Lá thư viết bằng bút chì nằm trên bàn." } }
            ex: ["Лист, ", { target: яки́й написа́ли олівце́м }, ", лежи́ть на столі́."]
            tr: { en: "The letter that was written in pencil is on the table.", es: "La carta que se escribió a lápiz está sobre la mesa.", pt: "A carta que foi escrita a lápis está sobre a mesa.", fr: "La lettre qui a été écrite au crayon est sur la table.", de: "Der Brief, der mit Bleistift geschrieben wurde, liegt auf dem Tisch.", it: "La lettera che è stata scritta a matita è sul tavolo.", pl: "List, który został napisany ołówkiem, leży na stole.", tr: "Kurşun kalemle yazılan mektup masanın üstünde.", id: "Surat yang ditulis dengan pensil ada di atas meja.", vi: "Lá thư mà người ta đã viết bằng bút chì nằm trên bàn." }
          - level: B1
            use: { ex: [{ target: Чита́ючи текст }, ", вона́ випи́сувала нові́ слова́."], tr: { en: "Reading the text, she wrote out the new words.", es: "Leyendo el texto, anotaba las palabras nuevas.", pt: "Lendo o texto, ela anotava as palavras novas.", fr: "En lisant le texte, elle notait les mots nouveaux.", de: "Beim Lesen des Textes schrieb sie die neuen Wörter heraus.", it: "Leggendo il testo, annotava le parole nuove.", pl: "Czytając tekst, wypisywała nowe słowa.", tr: "Metni okurken yeni sözcükleri not alıyordu.", id: "Sambil membaca teks, dia mencatat kata-kata baru.", vi: "Vừa đọc văn bản, cô ấy vừa chép lại các từ mới." } }
            ex: [{ target: Коли́ вона́ чита́ла текст }, ", вона́ випи́сувала нові́ слова́."]
            tr: { en: "While she was reading the text, she wrote out the new words.", es: "Mientras leía el texto, anotaba las palabras nuevas.", pt: "Enquanto lia o texto, ela anotava as palavras novas.", fr: "Pendant qu’elle lisait le texte, elle notait les mots nouveaux.", de: "Während sie den Text las, schrieb sie die neuen Wörter heraus.", it: "Mentre leggeva il testo, annotava le parole nuove.", pl: "Kiedy czytała tekst, wypisywała nowe słowa.", tr: "Metni okuduğu sırada yeni sözcükleri not alıyordu.", id: "Sementara dia membaca teks, dia mencatat kata-kata baru.", vi: "Khi cô ấy đọc văn bản, cô ấy chép lại các từ mới." }
          - level: B1
            use: { ex: [{ target: Поверну́вшись додо́му }, ", ми повече́ряли."], tr: { en: "Having come home, we had dinner.", es: "Al volver a casa, cenamos.", pt: "Ao voltar para casa, jantamos.", fr: "Une fois rentrés à la maison, nous avons dîné.", de: "Nach Hause zurückgekehrt, aßen wir zu Abend.", it: "Tornati a casa, abbiamo cenato.", pl: "Wróciwszy do domu, zjedliśmy kolację.", tr: "Eve dönünce akşam yemeği yedik.", id: "Setelah pulang ke rumah, kami makan malam.", vi: "Về đến nhà, chúng tôi ăn tối." } }
            ex: [{ target: Коли́ ми поверну́лися додо́му }, ", ми повече́ряли."]
            tr: { en: "When we came home, we had dinner.", es: "Cuando volvimos a casa, cenamos.", pt: "Quando voltamos para casa, jantamos.", fr: "Quand nous sommes rentrés à la maison, nous avons dîné.", de: "Als wir nach Hause zurückgekehrt waren, aßen wir zu Abend.", it: "Quando siamo tornati a casa, abbiamo cenato.", pl: "Kiedy wróciliśmy do domu, zjedliśmy kolację.", tr: "Eve döndüğümüzde akşam yemeği yedik.", id: "Ketika kami pulang ke rumah, kami makan malam.", vi: "Khi chúng tôi về đến nhà, chúng tôi ăn tối." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Коли говоримо про людину, що діє, українська вживає речення з ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              en: ["For a person doing something, Ukrainian uses a clause with ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              es: ["Para una persona que hace algo, el ucraniano usa una oración con ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              pt: ["Para uma pessoa que faz algo, o ucraniano usa uma oração com ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              fr: ["Pour une personne qui fait quelque chose, l’ukrainien emploie une proposition avec ", { term: яки́й }, " : ", { term: "студе́нт, яки́й чита́є" }, "."]
              de: ["Für eine Person, die etwas tut, verwendet das Ukrainische einen Nebensatz mit ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              it: ["Per una persona che fa qualcosa, l'ucraino usa una proposizione con ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              pl: ["O osobie, która coś robi, po ukraińsku używamy zdania podrzędnego z ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              tr: ["Bir şey yapan kişi için Ukraynacada ", { term: яки́й }, " ile kurulan bir yan cümle kullanılır: ", { term: "студе́нт, яки́й чита́є" }, "."]
              id: ["Untuk orang yang sedang melakukan sesuatu, bahasa Ukraina memakai klausa dengan ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              vi: ["Khi nói về một người đang làm gì đó, tiếng Ukraina dùng mệnh đề với ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
      - type: usage
        columns:
          - { key: use, label: { uk: Значення , en: "Meaning", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa"} }
          - { key: ex, label: { uk: Зворот , en: "Phrase", es: "Construcción", pt: "Construção", fr: "Groupe", de: "Konstruktion", it: "Costrutto", pl: "Wyrażenie", tr: "Öbek", id: "Frasa", vi: "Cụm từ"} }
          - { key: clause, label: { uk: Підрядне речення , en: "Subordinate clause", es: "Oración subordinada", pt: "Oração subordinada", fr: "Subordonnée", de: "Nebensatz", it: "Subordinata", pl: "Zdanie podrzędne", tr: "Yan cümle", id: "Anak kalimat", vi: "Mệnh đề phụ"} }
        rows:
          - level: C2
            use: { uk: "час: коли?" , en: "time: when?", es: "tiempo: ¿cuándo?", pt: "tempo: quando?", fr: "temps : quand ?", de: "Zeit: wann?", it: "tempo: quando?", pl: "czas: kiedy?", tr: "zaman: ne zaman?", id: "waktu: kapan?", vi: "thời gian: khi nào?"}
            ex: { ex: [{ target: Закі́нчивши робо́ту }, ", ми пішли́ додо́му."], tr: { en: "Having finished work, we went home.", es: "Al terminar el trabajo, nos fuimos a casa.", pt: "Ao terminar o trabalho, fomos para casa.", fr: "Le travail terminé, nous sommes rentrés à la maison.", de: "Mit der Arbeit fertig, gingen wir nach Hause.", it: "Finito il lavoro, siamo andati a casa.", pl: "Skończywszy pracę, poszliśmy do domu.", tr: "İşi bitirince eve gittik.", id: "Setelah menyelesaikan pekerjaan, kami pulang.", vi: "Làm xong việc, chúng tôi về nhà." } }
            clause: { ex: [{ target: Коли́ ми закі́нчили робо́ту }, ", ми пішли́ додо́му."], tr: { en: "When we finished work, we went home.", es: "Cuando terminamos el trabajo, nos fuimos a casa.", pt: "Quando terminamos o trabalho, fomos para casa.", fr: "Quand nous avons fini le travail, nous sommes rentrés à la maison.", de: "Als wir die Arbeit beendet hatten, gingen wir nach Hause.", it: "Quando abbiamo finito il lavoro, siamo andati a casa.", pl: "Kiedy skończyliśmy pracę, poszliśmy do domu.", tr: "İşi bitirdiğimizde eve gittik.", id: "Ketika kami menyelesaikan pekerjaan, kami pulang.", vi: "Khi chúng tôi làm xong việc, chúng tôi về nhà." } }
          - level: C2
            use: { uk: "спосіб: як?" , en: "manner: how?", es: "modo: ¿cómo?", pt: "modo: como?", fr: "manière : comment ?", de: "Art und Weise: wie?", it: "modo: come?", pl: "sposób: jak?", tr: "biçim: nasıl?", id: "cara: bagaimana?", vi: "cách thức: như thế nào?"}
            ex: { ex: ["Вона́ йшла́ ву́лицею", { target: ", співа́ючи пі́сеньку" }, "."], tr: { en: "She walked along the street, singing a little song.", es: "Iba por la calle cantando una cancioncita.", pt: "Ela andava pela rua cantando uma musiquinha.", fr: "Elle marchait dans la rue en chantant une petite chanson.", de: "Sie ging die Straße entlang, ein Liedchen singend.", it: "Camminava per la strada cantando una canzoncina.", pl: "Szła ulicą, śpiewając piosenkę.", tr: "Bir şarkı mırıldanarak sokaktan yürüyordu.", id: "Dia berjalan di jalan sambil menyanyikan sebuah lagu kecil.", vi: "Cô ấy đi trên phố, vừa đi vừa hát một bài hát nhỏ." } }
            clause: { ex: ["Вона́ йшла́ ву́лицею", { target: " і співа́ла пі́сеньку" }, "."], tr: { en: "She walked along the street and sang a little song.", es: "Iba por la calle y cantaba una cancioncita.", pt: "Ela andava pela rua e cantava uma musiquinha.", fr: "Elle marchait dans la rue et chantait une petite chanson.", de: "Sie ging die Straße entlang und sang ein Liedchen.", it: "Camminava per la strada e cantava una canzoncina.", pl: "Szła ulicą i śpiewała piosenkę.", tr: "Sokaktan yürüyordu ve bir şarkı mırıldanıyordu.", id: "Dia berjalan di jalan dan menyanyikan sebuah lagu kecil.", vi: "Cô ấy đi trên phố và hát một bài hát nhỏ." } }
          - level: C2
            use: { uk: "причина: чому?" , en: "reason: why?", es: "causa: ¿por qué?", pt: "causa: por quê?", fr: "cause : pourquoi ?", de: "Grund: warum?", it: "causa: perché?", pl: "przyczyna: dlaczego?", tr: "neden: niçin?", id: "sebab: mengapa?", vi: "nguyên nhân: tại sao?"}
            ex: { ex: [{ target: Збенте́жений слова́ми сестри́ }, ", Оле́г до́вго мовча́в."], tr: { en: "Embarrassed by his sister's words, Oleh was silent for a long time.", es: "Desconcertado por las palabras de su hermana, Oleh guardó silencio durante mucho tiempo.", pt: "Desconcertado com as palavras da irmã, Oleh ficou calado por muito tempo.", fr: "Troublé par les paroles de sa sœur, Oleh est resté longtemps silencieux.", de: "Von den Worten seiner Schwester verwirrt, schwieg Oleh lange.", it: "Turbato dalle parole della sorella, Oleh rimase a lungo in silenzio.", pl: "Zmieszany słowami siostry, Oleh długo milczał.", tr: "Kız kardeşinin sözlerinden şaşkına dönen Oleh uzun süre sustu.", id: "Bingung oleh kata-kata saudara perempuannya, Oleh lama terdiam.", vi: "Bối rối vì lời của chị gái, Oleh im lặng rất lâu." } }
            clause: { ex: ["Оле́г до́вго мовча́в, ", { target: бо слова́ сестри́ його́ збенте́жили }, "."], tr: { en: "Oleh was silent for a long time because his sister's words had embarrassed him.", es: "Oleh guardó silencio mucho tiempo porque las palabras de su hermana lo desconcertaron.", pt: "Oleh ficou calado por muito tempo porque as palavras da irmã o desconcertaram.", fr: "Oleh est resté longtemps silencieux parce que les paroles de sa sœur l’avaient troublé.", de: "Oleh schwieg lange, weil ihn die Worte seiner Schwester verwirrt hatten.", it: "Oleh rimase a lungo in silenzio perché le parole della sorella lo avevano turbato.", pl: "Oleh długo milczał, bo słowa siostry go zmieszały.", tr: "Oleh uzun süre sustu, çünkü kız kardeşinin sözleri onu şaşırtmıştı.", id: "Oleh lama terdiam karena kata-kata saudara perempuannya membuatnya bingung.", vi: "Oleh im lặng rất lâu vì lời của chị gái làm anh bối rối." } }
      - type: list
        items:
          - type: rule
            level: C2
            text:
              uk: "Коли дію виконує не підмет, замість звороту ставимо підрядне речення, а сполучник вибираємо за значенням."
              en: "If the subject is not the doer, put a clause in place of the phrase and choose the conjunction by meaning."
              es: "Si el sujeto no hace la acción, usamos una oración en vez de la construcción; la conjunción depende del sentido."
              pt: "Se o sujeito não faz a ação, usamos uma oração no lugar da construção; a conjunção depende do sentido."
              fr: "Si le sujet ne fait pas l’action, on met une proposition au lieu du groupe ; la conjonction suit le sens."
              de: "Führt nicht das Subjekt die Handlung aus, steht statt der Konstruktion ein Nebensatz; die Konjunktion richtet sich nach der Bedeutung."
              it: "Se l'azione non è del soggetto, si usa una proposizione al posto del costrutto; la congiunzione dipende dal significato."
              pl: "Gdy czynności nie wykonuje podmiot, zamiast wyrażenia stawiamy zdanie podrzędne, a spójnik wybieramy według znaczenia."
              tr: "Eylemi özne yapmıyorsa öbek yerine yan cümle kurarız; bağlacı anlama göre seçeriz."
              id: "Jika subjek bukan pelaku tindakan, pakai klausa sebagai ganti frasa, dan pilih konjungsi menurut maknanya."
              vi: "Khi chủ ngữ không làm hành động, ta dùng mệnh đề thay cho cụm từ và chọn liên từ theo nghĩa."
            ex: { examples: [[{ target: Коли́ стемні́ло }, ", ми поверну́лися додо́му."], ["Ми залиши́лися вдо́ма, ", { target: бо йшо́в дощ }, "."]] }
            tr: { en: { examples: ["When it got dark, we went back home.", "We stayed at home because it was raining."] }, es: { examples: ["Cuando oscureció, volvimos a casa.", "Nos quedamos en casa porque llovía."] }, pt: { examples: ["Quando escureceu, voltamos para casa.", "Ficamos em casa porque estava chovendo."] }, fr: { examples: ["Quand la nuit est tombée, nous sommes rentrés à la maison.", "Nous sommes restés à la maison parce qu’il pleuvait."] }, de: { examples: ["Als es dunkel wurde, gingen wir nach Hause zurück.", "Wir blieben zu Hause, weil es regnete."] }, it: { examples: ["Quando si è fatto buio, siamo tornati a casa.", "Siamo rimasti a casa perché pioveva."] }, pl: { examples: ["Kiedy się ściemniło, wróciliśmy do domu.", "Zostaliśmy w domu, bo padał deszcz."] }, tr: { examples: ["Hava kararınca eve döndük.", "Yağmur yağdığı için evde kaldık."] }, id: { examples: ["Ketika hari gelap, kami pulang ke rumah.", "Kami tinggal di rumah karena hujan turun."] }, vi: { examples: ["Khi trời tối, chúng tôi về nhà.", "Chúng tôi ở nhà vì trời mưa."] } }

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos, pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Я ба́чу студе́нта, чита́ючого кни́жку.", right: ["Я ба́чу студе́нта, ", { target: яки́й чита́є }, " кни́жку."], rule: { uk: ["дієприкметники на ", { term: -ючий }, " — калька з російської; уживаємо ", { term: яки́й }], en: ["participles in ", { term: -ючий }, " are a calque from Russian; use ", { term: яки́й }], es: ["los participios en ", { term: -ючий }, " son un calco del ruso; se usa ", { term: яки́й }], pt: ["os particípios em ", { term: -ючий }, " são um decalque do russo; usa-se ", { term: яки́й }], fr: ["les participes en ", { term: -ючий }, " sont un calque du russe ; on emploie ", { term: яки́й }], de: ["Partizipien auf ", { term: -ючий }, " sind eine Lehnübersetzung aus dem Russischen; man verwendet ", { term: яки́й }], it: ["i participi in ", { term: -ючий }, " sono un calco dal russo; si usa ", { term: яки́й }], pl: ["imiesłowy na ", { term: -ючий }, " to kalka z rosyjskiego; używamy ", { term: яки́й }], tr: [{ term: -ючий }, " ile biten sıfat-fiiller Rusçadan birebir çeviridir; ", { term: яки́й }, " kullanılır"], id: ["partisipel berakhiran ", { term: -ючий }, " adalah terjemahan harfiah dari bahasa Rusia; gunakan ", { term: яки́й }], vi: ["phân từ tận cùng ", { term: -ючий }, " là bản dịch sát từ tiếng Nga; hãy dùng ", { term: яки́й }] } }
          - { level: B1, wrong: "Поверну́вшись додо́му, поча́вся дощ.", right: [{ target: Коли́ ми поверну́лися }, " додо́му, поча́вся дощ."], rule: { uk: "дію дієприслівника виконує підмет; дощ не повертався додому", en: "the subject does the participle's action, and the rain did not come home", es: "el sujeto hace la acción del gerundio, y la lluvia no volvió a casa", pt: "o sujeito faz a ação do gerúndio, e a chuva não voltou para casa", fr: "le sujet fait l’action du gérondif, et la pluie n’est pas rentrée à la maison", de: "das Subjekt führt die Handlung des Adverbialpartizips aus, und der Regen ist nicht nach Hause zurückgekehrt", it: "il soggetto compie l'azione del gerundio, e la pioggia non è tornata a casa", pl: "czynność imiesłowu wykonuje podmiot, a deszcz nie wracał do domu", tr: "zarf-fiilin eylemini özne yapar; yağmur eve dönmedi", id: "subjek melakukan tindakan partisipel adverbial, dan hujan tidak pulang ke rumah", vi: "chủ ngữ thực hiện hành động của phân từ trạng ngữ, mà mưa thì không về nhà" } }
          - { level: B1, speakers: [en, es], wrong: "Поверну́вшись з екску́рсії ми пообі́дали.", right: [{ target: "Поверну́вшись з екску́рсії," }, " ми пообі́дали."], rule: { en: "a phrase at the start of the sentence ends with a comma", es: "la construcción al principio de la oración termina en coma" } }
          - { level: B2, wrong: "Прочита́ючи лист, ма́ма всміхну́лася.", right: [{ target: Прочита́вши }, " лист, ма́ма всміхну́лася."], rule: { uk: ["від доконаного виду утворюємо дієприслівник на ", { term: -вши }, ", а не на ", { term: -ючи }] , en: ["from a perfective verb we form the adverbial participle in ", { term: -вши }, ", not in ", { term: -ючи }], es: ["del verbo perfectivo se forma el gerundio en ", { term: -вши }, ", no en ", { term: -ючи }], pt: ["do verbo perfectivo forma-se o gerúndio em ", { term: -вши }, ", e não em ", { term: -ючи }], fr: ["d’un verbe perfectif, on forme le gérondif en ", { term: -вши }, " et non en ", { term: -ючи }], de: ["vom perfektiven Verb bildet man das Adverbialpartizip auf ", { term: -вши }, ", nicht auf ", { term: -ючи }], it: ["dal verbo perfettivo si forma il gerundio in ", { term: -вши }, ", non in ", { term: -ючи }], pl: ["od czasownika dokonanego tworzymy imiesłów przysłówkowy na ", { term: -вши }, ", a nie na ", { term: -ючи }], tr: ["tamamlanmış görünüşlü fiilden ", { term: -вши }, " ile biten zarf-fiil yapılır, ", { term: -ючи }, " ile biten değil"], id: ["dari verba perfektif dibentuk partisipel adverbial berakhiran ", { term: -вши }, ", bukan ", { term: -ючи }], vi: ["từ động từ thể hoàn thành, ta tạo phân từ trạng ngữ tận cùng ", { term: -вши }, ", không phải ", { term: -ючи }]} }
          - { level: C1, wrong: "Хло́пець підійшо́вши до вікна́ відчини́в його́.", right: ["Хло́пець", { target: ", підійшо́вши до вікна́," }, " відчини́в його́."], rule: { uk: "дієприслівниковий зворот посередині речення стоїть між двома комами" , en: "an adverbial participle phrase in the middle of the sentence stands between two commas", es: "la construcción de gerundio en medio de la oración va entre dos comas", pt: "a construção com gerúndio no meio da frase fica entre duas vírgulas", fr: "le groupe au gérondif au milieu de la phrase se met entre deux virgules", de: "eine Adverbialpartizipialkonstruktion mitten im Satz steht zwischen zwei Kommas", it: "il costrutto con il gerundio in mezzo alla frase sta tra due virgole", pl: "wyrażenie z imiesłowem przysłówkowym w środku zdania stoi między dwoma przecinkami", tr: "cümlenin ortasındaki zarf-fiil öbeği iki virgül arasında yer alır", id: "frasa partisipel adverbial di tengah kalimat berada di antara dua koma", vi: "cụm phân từ trạng ngữ ở giữa câu nằm giữa hai dấu phẩy"} }
