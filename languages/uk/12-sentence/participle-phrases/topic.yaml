              es: ["Para una persona que hace algo, el ucraniano usa una oración con ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              pt: ["Para uma pessoa que faz algo, o ucraniano usa uma oração com ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
