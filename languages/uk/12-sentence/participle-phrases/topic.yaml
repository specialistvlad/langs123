title: { uk: Дієприкметникові й дієприслівникові звороти, en: Participle Phrases, es: Construcciones de participio, pt: "Construções de particípio", fr: "Constructions participiales", de: "Partizipialkonstruktionen", it: "Costrutti participiali", pl: "Wyrażenia imiesłowowe", tr: "Sıfat-fiil ve zarf-fiil öbekleri", id: "Frasa partisipel", vi: "Cụm phân từ" }
summary:
  lead:
    uk: ["Дієприкметниковий зворот описує іменник: ", { term: "лист, напи́саний олівце́м" }, "; дієприслівниковий називає ще одну дію підмета: ", { term: поверну́вшись додо́му }, "."]
    en: ["A participle phrase describes a noun, ", { term: "лист, напи́саний олівце́м" }, "; an adverbial participle names another action of the subject, ", { term: поверну́вшись додо́му }, "."]
    es: ["El participio describe un sustantivo, ", { term: "лист, напи́саний олівце́м" }, "; el gerundio ucraniano nombra otra acción del sujeto, ", { term: поверну́вшись додо́му }, "."]
    pt: ["A construção com particípio descreve um substantivo, ", { term: "лист, напи́саний олівце́м" }, "; o gerúndio ucraniano nomeia outra ação do sujeito, ", { term: поверну́вшись додо́му }, "."]
    fr: ["Le participe décrit un nom : ", { term: "лист, напи́саний олівце́м" }, " ; le gérondif ajoute une action du sujet : ", { term: поверну́вшись додо́му }, "."]
    de: ["Das Partizip beschreibt ein Nomen: ", { term: "лист, напи́саний олівце́м" }, "; das Adverbialpartizip nennt eine weitere Handlung des Subjekts: ", { term: поверну́вшись додо́му }, "."]
    it: ["Il costrutto participiale descrive un sostantivo: ", { term: "лист, напи́саний олівце́м" }, "; il gerundio ucraino indica un'altra azione del soggetto: ", { term: поверну́вшись додо́му }, "."]
    pl: ["Imiesłów przymiotnikowy opisuje rzeczownik: ", { term: "лист, напи́саний олівце́м" }, "; przysłówkowy nazywa kolejną czynność podmiotu: ", { term: поверну́вшись додо́му }, "."]
    tr: ["Sıfat-fiil öbeği bir ismi niteler: ", { term: "лист, напи́саний олівце́м" }, "; zarf-fiil öznenin başka bir eylemini bildirir: ", { term: поверну́вшись додо́му }, "."]
    id: ["Frasa partisipel menjelaskan nomina: ", { term: "лист, напи́саний олівце́м" }, "; partisipel adverbial menyebutkan tindakan lain dari subjek: ", { term: поверну́вшись додо́му }, "."]
    vi: ["Phân từ mô tả danh từ: ", { term: "лист, напи́саний олівце́м" }, "; phân từ trạng ngữ nêu thêm hành động của chủ ngữ: ", { term: поверну́вшись додо́му }, "."]
  rule:
    uk: "Зворот відокремлюємо комою, а всередині речення — двома комами; дію дієприслівника виконує підмет речення:"
    en: "A comma sets off the phrase, two commas inside the sentence; the subject of the sentence does the action of the adverbial participle:"
    es: "Una coma separa la construcción, dos comas si va en medio de la oración; el sujeto de la oración hace la acción del gerundio:"
    pt: "Uma vírgula isola a construção, e duas, se ela está no meio da frase; o sujeito da oração faz a ação do gerúndio:"
    fr: "Une virgule isole le groupe, deux au milieu de la phrase ; le sujet fait l’action du gérondif :"
    de: "Ein Komma trennt die Konstruktion ab, mitten im Satz zwei Kommas; das Subjekt des Satzes führt die Handlung des Adverbialpartizips aus:"
    it: "Una virgola isola il costrutto, due se sta in mezzo alla frase; il soggetto della frase compie l'azione del gerundio:"
    pl: "Wyrażenie oddzielamy przecinkiem, a w środku zdania — dwoma przecinkami; czynność imiesłowu przysłówkowego wykonuje podmiot zdania:"
    tr: "Öbek bir virgülle, cümlenin ortasındaysa iki virgülle ayrılır; zarf-fiilin eylemini cümlenin öznesi yapar:"
    id: "Frasa dipisahkan dengan satu koma, atau dua koma di tengah kalimat; subjek kalimat melakukan tindakan partisipel adverbial:"
    vi: "Một dấu phẩy ngăn cụm (hai dấu nếu ở giữa câu); chủ ngữ làm hành động của phân từ trạng ngữ:"
  ex: [{ target: Поверну́вшись з екску́рсії }, ", ми пообі́дали в рестора́ні."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto, pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla, pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B1
          point: { alternatives: [-ний, -тий] }
          rule:
            uk: "дієприкметник: який? змінюється, як прикметник"
            en: "a participle: which? changes like an adjective"
            es: "un participio: ¿cuál? cambia como un adjetivo"
            pt: "particípio: qual? muda como um adjetivo"
            fr: "participe : lequel ? il varie comme un adjectif"
            de: "Partizip: welcher? verändert sich wie ein Adjektiv"
            it: "participio: quale? cambia come un aggettivo"
            pl: "imiesłów przymiotnikowy: jaki? odmienia się jak przymiotnik"
            tr: "sıfat-fiil: hangi? sıfat gibi değişir"
            id: "partisipel: yang mana? berubah seperti adjektiva"
            vi: "phân từ: như thế nào? biến đổi như tính từ"
          ex: ["Лист, ", { target: напи́саний }, " олівце́м, лежи́ть на столі́."]
          tr: { en: "The letter, written in pencil, is lying on the table.", es: "La carta, escrita a lápiz, está sobre la mesa.", pt: "A carta, escrita a lápis, está sobre a mesa.", fr: "La lettre, écrite au crayon, est sur la table.", de: "Der Brief, mit Bleistift geschrieben, liegt auf dem Tisch.", it: "La lettera, scritta a matita, è sul tavolo.", pl: "List, napisany ołówkiem, leży na stole.", tr: "Kurşun kalemle yazılmış mektup masanın üstünde duruyor.", id: "Surat, yang ditulis dengan pensil, ada di atas meja.", vi: "Lá thư viết bằng bút chì đang nằm trên bàn." }
        - level: B1
          point: { alternatives: [-ючи, -учи] }
          rule:
            uk: "дієприслівник: дія одночасна"
            en: "an adverbial participle: at the same time"
            es: "un gerundio: al mismo tiempo"
            pt: "gerúndio: ação simultânea"
            fr: "gérondif : action simultanée"
            de: "Adverbialpartizip: gleichzeitige Handlung"
            it: "gerundio: azione contemporanea"
            pl: "imiesłów przysłówkowy: czynność jednoczesna"
            tr: "zarf-fiil: eş zamanlı eylem"
            id: "partisipel adverbial: tindakan bersamaan"
            vi: "phân từ trạng ngữ: hành động xảy ra đồng thời"
          ex: [{ target: Чита́ючи }, " текст, вона́ випи́сувала нові́ слова́."]
          tr: { en: "Reading the text, she wrote out the new words.", es: "Leyendo el texto, anotaba las palabras nuevas.", pt: "Lendo o texto, ela anotava as palavras novas.", fr: "En lisant le texte, elle notait les mots nouveaux.", de: "Beim Lesen des Textes schrieb sie die neuen Wörter heraus.", it: "Leggendo il testo, annotava le parole nuove.", pl: "Czytając tekst, wypisywała nowe słowa.", tr: "Metni okurken yeni sözcükleri not alıyordu.", id: "Sambil membaca teks, dia mencatat kata-kata baru.", vi: "Vừa đọc văn bản, cô ấy vừa chép lại các từ mới." }
        - level: B1
          point: { alternatives: [-вши, -ши] }
          rule:
            uk: "дієприслівник: дія раніша"
            en: "an adverbial participle: done before"
            es: "un gerundio: acción anterior"
            pt: "gerúndio: ação anterior"
            fr: "gérondif : action antérieure"
            de: "Adverbialpartizip: vorzeitige Handlung"
            it: "gerundio: azione anteriore"
            pl: "imiesłów przysłówkowy: czynność wcześniejsza"
            tr: "zarf-fiil: daha önce olmuş eylem"
            id: "partisipel adverbial: tindakan yang lebih dahulu"
            vi: "phân từ trạng ngữ: hành động xảy ra trước"
          ex: [{ target: Прочита́вши }, " лист, ма́ма всміхну́лася."]
          tr: { en: "Having read the letter, Mum smiled.", es: "Después de leer la carta, mamá sonrió.", pt: "Depois de ler a carta, a mamãe sorriu.", fr: "Après avoir lu la lettre, maman a souri.", de: "Nachdem sie den Brief gelesen hatte, lächelte Mama.", it: "Dopo aver letto la lettera, la mamma sorrise.", pl: "Przeczytawszy list, mama się uśmiechnęła.", tr: "Mektubu okuyunca annem gülümsedi.", id: "Setelah membaca surat itu, ibu tersenyum.", vi: "Đọc xong lá thư, mẹ mỉm cười." }
        - level: B1
          point: { uk: Значення, en: Meaning, es: Significado, pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" }
          rule:
            uk: ["зворот = підрядне речення з ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            en: ["the phrase = a clause with ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            es: ["la construcción = una oración con ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            pt: ["a construção = uma oração com ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            fr: ["le groupe = une proposition avec ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            de: ["die Konstruktion = ein Nebensatz mit ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            it: ["il costrutto = una proposizione con ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            pl: ["wyrażenie = zdanie podrzędne z ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            tr: ["öbek = ", { alternatives: [{ term: яки́й }, { term: коли́ }] }, " ile kurulan yan cümle"]
            id: ["frasa = klausa dengan ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
            vi: ["cụm từ = mệnh đề với ", { alternatives: [{ term: яки́й }, { term: коли́ }] }]
          ex: { equivalence: [["лист, ", { target: напи́саний }, " олівце́м"], ["лист, ", { target: яки́й написа́ли }, " олівце́м"]] }
          tr: { en: { equivalence: ["the letter written in pencil", "the letter that was written in pencil"] }, es: { equivalence: ["la carta escrita a lápiz", "la carta que se escribió a lápiz"] }, pt: { equivalence: ["a carta escrita a lápis", "a carta que foi escrita a lápis"] }, fr: { equivalence: ["la lettre écrite au crayon", "la lettre qui a été écrite au crayon"] }, de: { equivalence: ["der mit Bleistift geschriebene Brief", "der Brief, der mit Bleistift geschrieben wurde"] }, it: { equivalence: ["la lettera scritta a matita", "la lettera che è stata scritta a matita"] }, pl: { equivalence: ["list napisany ołówkiem", "list, który został napisany ołówkiem"] }, tr: { equivalence: ["kurşun kalemle yazılmış mektup", "kurşun kalemle yazılan mektup"] }, id: { equivalence: ["surat tertulis dengan pensil", "surat yang ditulis dengan pensil"] }, vi: { equivalence: ["lá thư viết bằng bút chì", "lá thư mà người ta đã viết bằng bút chì"] } }
        - level: B2
          point: { alternatives: [-аний, -ений, -ований] }
          rule:
            uk: "дієприкметник від перехідних дієслів доконаного виду"
            en: "a participle from transitive perfective verbs"
            es: "participio de verbos transitivos perfectivos"
            pt: "particípio de verbos transitivos perfectivos"
            fr: "participe de verbes transitifs perfectifs"
            de: "Partizip von transitiven perfektiven Verben"
            it: "participio da verbi transitivi perfettivi"
            pl: "imiesłów przymiotnikowy od czasowników przechodnich dokonanych"
            tr: "geçişli ve tamamlanmış görünüşlü fiillerden sıfat-fiil"
            id: "partisipel dari verba transitif perfektif"
            vi: "phân từ từ động từ chuyển tiếp thể hoàn thành"
          ex: { examples: [{ mapping: [зроби́ти, { target: зро́блений }] }, { mapping: [побудува́ти, { target: побудо́ваний }] }] }
          tr: { en: { examples: [{ mapping: ["to make", "made"] }, { mapping: ["to build", "built"] }] }, es: { examples: [{ mapping: ["hacer", "hecho"] }, { mapping: ["construir", "construido"] }] }, pt: { examples: [{ mapping: ["fazer", "feito"] }, { mapping: ["construir", "construído"] }] }, fr: { examples: [{ mapping: ["faire", "fait"] }, { mapping: ["construire", "construit"] }] }, de: { examples: [{ mapping: ["machen", "gemacht"] }, { mapping: ["bauen", "gebaut"] }] }, it: { examples: [{ mapping: ["fare", "fatto"] }, { mapping: ["costruire", "costruito"] }] }, pl: { examples: [{ mapping: ["zrobić", "zrobiony"] }, { mapping: ["zbudować", "zbudowany"] }] }, tr: { examples: [{ mapping: ["yapmak", "yapılmış"] }, { mapping: ["inşa etmek", "inşa edilmiş"] }] }, id: { examples: [{ mapping: ["membuat", "dibuat"] }, { mapping: ["membangun", "dibangun"] }] }, vi: { examples: [{ mapping: ["làm", "được làm"] }, { mapping: ["xây", "được xây"] }] } }
        - level: B2
          point: { alternatives: [-ючись, -вшись] }
          rule:
            uk: "зворотні дієслова: частка -ся стає -сь"
            en: "reflexive verbs: the particle -ся becomes -сь"
            es: "verbos reflexivos: la partícula -ся pasa a -сь"
            pt: "verbos reflexivos: a partícula -ся passa a -сь"
            fr: "verbes pronominaux : la particule -ся devient -сь"
            de: "reflexive Verben: die Partikel -ся wird zu -сь"
            it: "verbi riflessivi: la particella -ся diventa -сь"
            pl: "czasowniki zwrotne: cząstka -ся zmienia się w -сь"
            tr: "dönüşlü fiiller: -ся eki -сь olur"
            id: "verba refleksif: partikel -ся menjadi -сь"
            vi: "động từ phản thân: tiểu từ -ся thành -сь"
          ex: { examples: [{ mapping: [усміха́тися, { target: усміха́ючись }] }, { mapping: [усміхну́тися, { target: усміхну́вшись }] }] }
          tr: { en: { examples: [{ mapping: ["to smile", "smiling"] }, { mapping: ["to smile", "having smiled"] }] }, es: { examples: [{ mapping: ["sonreír", "sonriendo"] }, { mapping: ["sonreír", "habiendo sonreído"] }] }, pt: { examples: [{ mapping: ["sorrir", "sorrindo"] }, { mapping: ["sorrir", "tendo sorrido"] }] }, fr: { examples: [{ mapping: ["sourire", "en souriant"] }, { mapping: ["sourire", "ayant souri"] }] }, de: { examples: [{ mapping: ["lächeln", "lächelnd"] }, { mapping: ["lächeln", "gelächelt habend"] }] }, it: { examples: [{ mapping: ["sorridere", "sorridendo"] }, { mapping: ["sorridere", "avendo sorriso"] }] }, pl: { examples: [{ mapping: ["uśmiechać się", "uśmiechając się"] }, { mapping: ["uśmiechnąć się", "uśmiechnąwszy się"] }] }, tr: { examples: [{ mapping: ["gülümsemek", "gülümseyerek"] }, { mapping: ["gülümsemek", "gülümseyip"] }] }, id: { examples: [{ mapping: ["tersenyum", "sambil tersenyum"] }, { mapping: ["tersenyum", "setelah tersenyum"] }] }, vi: { examples: [{ mapping: ["mỉm cười", "trong khi mỉm cười"] }, { mapping: ["mỉm cười", "sau khi mỉm cười"] }] } }
        - level: B2
          point: { uk: Виконавець , en: "Doer", es: "Agente", pt: "Agente", fr: "Agent", de: "Urheber", it: "Agente", pl: "Wykonawca", tr: "Eylemi yapan", id: "Pelaku", vi: "Tác nhân"}
          rule:
            uk: "виконавець дії стоїть в орудному відмінку"
            en: "the doer of the action stands in the instrumental case"
            es: "el agente de la acción va en instrumental"
            pt: "o agente da ação fica no instrumental"
            fr: "l’agent de l’action est à l’instrumental"
            de: "der Urheber der Handlung steht im Instrumental"
            it: "l'agente dell'azione sta allo strumentale"
            pl: "wykonawca czynności stoi w narzędniku"
            tr: "eylemi yapan araç hâlinde durur"
            id: "pelaku tindakan berada dalam kasus instrumental"
            vi: "người thực hiện hành động đứng ở công cụ cách"
          ex: ["Буди́нок", { target: ", побудо́ваний на́шим дідо́м," }, " стої́ть бі́ля рі́чки."]
          tr: { en: "The house built by our grandfather stands by the river.", es: "La casa construida por nuestro abuelo está junto al río.", pt: "A casa construída pelo nosso avô fica perto do rio.", fr: "La maison construite par notre grand-père se trouve près de la rivière.", de: "Das von unserem Großvater gebaute Haus steht am Fluss.", it: "La casa costruita da nostro nonno si trova vicino al fiume.", pl: "Dom zbudowany przez naszego dziadka stoi nad rzeką.", tr: "Dedemizin yaptığı ev nehrin yanında duruyor.", id: "Rumah yang dibangun oleh kakek kami berdiri di dekat sungai.", vi: "Ngôi nhà do ông chúng tôi xây đứng bên bờ sông." }
        - level: C1
          point: { uk: Місце , en: "Position", es: "Posición", pt: "Posição", fr: "Place", de: "Stellung", it: "Posizione", pl: "Miejsce", tr: "Yer", id: "Posisi", vi: "Vị trí"}
          rule:
            uk: "дієприслівниковий зворот посередині й у кінці речення"
            en: "an adverbial participle phrase in the middle and at the end of the sentence"
            es: "la construcción de gerundio en medio y al final de la oración"
            pt: "a construção com gerúndio no meio e no fim da frase"
            fr: "le groupe au gérondif au milieu et à la fin de la phrase"
            de: "die Adverbialpartizipialkonstruktion mitten im Satz und am Satzende"
            it: "il costrutto con il gerundio in mezzo e alla fine della frase"
            pl: "wyrażenie z imiesłowem przysłówkowym w środku i na końcu zdania"
            tr: "zarf-fiil öbeği cümlenin ortasında ve sonunda"
            id: "frasa partisipel adverbial di tengah dan di akhir kalimat"
            vi: "cụm phân từ trạng ngữ ở giữa và ở cuối câu"
          ex: ["Хло́пець", { target: ", підійшо́вши до вікна́," }, " відчини́в його́."]
          tr: { en: "The boy, having gone up to the window, opened it.", es: "El chico, tras acercarse a la ventana, la abrió.", pt: "O menino, depois de se aproximar da janela, abriu-a.", fr: "Le garçon, s’étant approché de la fenêtre, l’a ouverte.", de: "Der Junge, ans Fenster getreten, öffnete es.", it: "Il ragazzo, avvicinatosi alla finestra, l'aprì.", pl: "Chłopiec, podszedłszy do okna, otworzył je.", tr: "Çocuk pencereye yaklaşıp onu açtı.", id: "Anak laki-laki itu, setelah menghampiri jendela, membukanya.", vi: "Cậu bé đi đến bên cửa sổ rồi mở nó ra." }
        - level: C1
          point: { uk: Означення , en: "Modifiers", es: "Atributos", pt: "Atributos", fr: "Épithètes", de: "Attribute", it: "Attributi", pl: "Określenia", tr: "Niteleyiciler", id: "Atribut", vi: "Từ bổ nghĩa"}
          rule:
            uk: "група означень після іменника: коми"
            en: "a group of modifiers after the noun: commas"
            es: "grupo de atributos tras el sustantivo: comas"
            pt: "grupo de atributos depois do substantivo: vírgulas"
            fr: "groupe d’épithètes après le nom : virgules"
            de: "Gruppe von Attributen nach dem Nomen: Kommas"
            it: "gruppo di attributi dopo il sostantivo: virgole"
            pl: "grupa określeń po rzeczowniku: przecinki"
            tr: "isimden sonra gelen niteleyiciler grubu: virgüller"
            id: "kelompok atribut setelah nomina: koma"
            vi: "nhóm từ bổ nghĩa sau danh từ: dấu phẩy"
          ex: ["Ми до́вго диви́лися на мо́ре", { target: ", спокі́йне, си́нє, безме́жне" }, "."]
          tr: { en: "We looked at the sea for a long time, calm, blue, boundless.", es: "Miramos mucho tiempo el mar, tranquilo, azul, inmenso.", pt: "Olhamos por muito tempo para o mar, calmo, azul, sem limites.", fr: "Nous avons longtemps regardé la mer, calme, bleue, infinie.", de: "Wir sahen lange auf das Meer, ruhig, blau, grenzenlos.", it: "Abbiamo guardato a lungo il mare, calmo, azzurro, sconfinato.", pl: "Długo patrzyliśmy na morze, spokojne, niebieskie, bezkresne.", tr: "Uzun süre denize baktık; sakin, mavi, uçsuz bucaksız.", id: "Kami lama memandang laut, tenang, biru, tak bertepi.", vi: "Chúng tôi nhìn biển rất lâu, biển lặng, xanh, mênh mông." }
        - level: C2
          point: { uk: "Час, спосіб, причина" , en: "Time, manner, reason", es: "Tiempo, modo, causa", pt: "Tempo, modo, causa", fr: "Temps, manière, cause", de: "Zeit, Art und Weise, Grund", it: "Tempo, modo, causa", pl: "Czas, sposób, przyczyna", tr: "Zaman, biçim, neden", id: "Waktu, cara, sebab", vi: "Thời gian, cách thức, nguyên nhân"}
          rule:
            uk: "значення звороту видно із змісту речення"
            en: "the sentence's content shows what the phrase means"
            es: "el significado de la construcción se deduce del contenido de la oración"
            pt: "o significado da construção se deduz do conteúdo da frase"
            fr: "le sens du groupe se déduit du contenu de la phrase"
            de: "die Bedeutung der Konstruktion ergibt sich aus dem Inhalt des Satzes"
            it: "il significato del costrutto si ricava dal contenuto della frase"
            pl: "znaczenie wyrażenia wynika z treści zdania"
            tr: "öbeğin anlamı cümlenin içeriğinden anlaşılır"
            id: "makna frasa terlihat dari isi kalimat"
            vi: "nghĩa của cụm từ thể hiện qua nội dung câu"
          ex: [{ target: Збенте́жений слова́ми сестри́ }, ", Оле́г до́вго мовча́в."]
          tr: { en: "Embarrassed by his sister's words, Oleh was silent for a long time.", es: "Desconcertado por las palabras de su hermana, Oleh guardó silencio durante mucho tiempo.", pt: "Desconcertado com as palavras da irmã, Oleh ficou calado por muito tempo.", fr: "Troublé par les paroles de sa sœur, Oleh est resté longtemps silencieux.", de: "Von den Worten seiner Schwester verwirrt, schwieg Oleh lange.", it: "Turbato dalle parole della sorella, Oleh rimase a lungo in silenzio.", pl: "Zmieszany słowami siostry, Oleh długo milczał.", tr: "Kız kardeşinin sözlerinden şaşkına dönen Oleh uzun süre sustu.", id: "Bingung oleh kata-kata saudara perempuannya, Oleh lama terdiam.", vi: "Bối rối vì lời của chị gái, Oleh im lặng rất lâu." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: "дію дієприслівника виконує підмет"
            en: "the subject does the action of the adverbial participle"
            es: "el sujeto hace la acción del gerundio"
            pt: "o sujeito faz a ação do gerúndio"
            fr: "le sujet fait l’action du gérondif"
            de: "das Subjekt führt die Handlung des Adverbialpartizips aus"
            it: "il soggetto compie l'azione del gerundio"
            pl: "czynność imiesłowu przysłówkowego wykonuje podmiot"
            tr: "zarf-fiilin eylemini özne yapar"
            id: "subjek melakukan tindakan partisipel adverbial"
            vi: "chủ ngữ thực hiện hành động của phân từ trạng ngữ"
          ex: [{ target: Поверну́вшись }, " додо́му, ", { target: ми }, " повече́ряли."]
          tr: { en: "Having come home, we had dinner.", es: "Al volver a casa, cenamos.", pt: "Ao voltar para casa, jantamos.", fr: "Une fois rentrés à la maison, nous avons dîné.", de: "Nach Hause zurückgekehrt, aßen wir zu Abend.", it: "Tornati a casa, abbiamo cenato.", pl: "Wróciwszy do domu, zjedliśmy kolację.", tr: "Eve dönünce akşam yemeği yedik.", id: "Setelah pulang ke rumah, kami makan malam.", vi: "Về đến nhà, chúng tôi ăn tối." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: ["про людину, що діє, — підрядне речення з ", { term: яки́й }]
            en: ["for someone doing something, a clause with ", { term: яки́й }]
            es: ["para quien hace algo, una oración con ", { term: яки́й }]
            pt: ["para quem faz algo, uma oração com ", { term: яки́й }]
            fr: ["pour quelqu’un qui fait quelque chose, une proposition avec ", { term: яки́й }]
            de: ["für jemanden, der etwas tut, ein Nebensatz mit ", { term: яки́й }]
            it: ["per chi fa qualcosa, una proposizione con ", { term: яки́й }]
            pl: ["o osobie, która coś robi, zdanie podrzędne z ", { term: яки́й }]
            tr: ["bir şey yapan kişi için ", { term: яки́й }, " ile kurulan yan cümle"]
            id: ["untuk orang yang sedang melakukan sesuatu, klausa dengan ", { term: яки́й }]
            vi: ["khi nói về người đang làm gì đó, dùng mệnh đề với ", { term: яки́й }]
          ex: ["Я ба́чу студе́нта, ", { target: яки́й чита́є }, " кни́жку."]
          tr: { en: "I can see a student reading a book.", es: "Veo a un estudiante que lee un libro.", pt: "Vejo um estudante que lê um livro.", fr: "Je vois un étudiant qui lit un livre.", de: "Ich sehe einen Studenten, der ein Buch liest.", it: "Vedo uno studente che legge un libro.", pl: "Widzę studenta, który czyta książkę.", tr: "Kitap okuyan bir öğrenci görüyorum.", id: "Saya melihat seorang mahasiswa yang sedang membaca buku.", vi: "Tôi thấy một sinh viên đang đọc sách." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Звороти трапляються переважно в письмових текстах; на цьому рівні їх треба розпізнавати й розуміти."
              en: "These phrases appear mostly in written texts; at this level you recognise and understand them."
              es: "Estas construcciones aparecen sobre todo en textos escritos; en este nivel se trata de reconocerlas y entenderlas."
              pt: "Essas construções aparecem sobretudo em textos escritos; neste nível, o objetivo é reconhecê-las e entendê-las."
              fr: "Ces constructions apparaissent surtout dans les textes écrits ; à ce niveau, on les reconnaît et on les comprend."
              de: "Diese Konstruktionen kommen vor allem in geschriebenen Texten vor; auf dieser Stufe erkennt und versteht man sie."
              it: "Questi costrutti compaiono soprattutto nei testi scritti; a questo livello si tratta di riconoscerli e capirli."
              pl: "Te wyrażenia występują głównie w tekstach pisanych; na tym poziomie trzeba je rozpoznawać i rozumieć."
              tr: "Bu öbekler çoğunlukla yazılı metinlerde görülür; bu düzeyde onları tanımak ve anlamak yeterlidir."
              id: "Frasa ini muncul terutama dalam teks tertulis; pada tingkat ini kita cukup mengenali dan memahaminya."
              vi: "Các cụm này chủ yếu xuất hiện trong văn bản viết; ở trình độ này, bạn cần nhận ra và hiểu chúng."
          - type: rule
            level: B1
            text:
              uk: "Дієприкметниковий зворот стоїть після іменника, який описує; у кінці речення його відокремлює одна кома, усередині — дві."
              en: "A participle phrase follows the noun it describes; at the end of the sentence one comma sets it off, inside the sentence two."
              es: "La construcción de participio va detrás del sustantivo que describe; al final de la oración la separa una coma, en medio, dos."
              pt: "A construção com particípio vem depois do substantivo que descreve; no fim da frase, uma vírgula a isola; no meio, duas."
              fr: "Le groupe participial suit le nom qu’il décrit ; en fin de phrase, une virgule l’isole, au milieu de la phrase, deux."
              de: "Eine Partizipialkonstruktion steht nach dem Nomen, das sie beschreibt; am Satzende trennt sie ein Komma ab, mitten im Satz zwei."
              it: "Il costrutto participiale segue il sostantivo che descrive; a fine frase lo isola una virgola, in mezzo alla frase due."
              pl: "Wyrażenie imiesłowowe stoi po rzeczowniku, który opisuje; na końcu zdania oddziela je jeden przecinek, w środku — dwa."
              tr: "Sıfat-fiil öbeği, nitelediği isimden sonra gelir; cümlenin sonunda bir virgülle, ortasında iki virgülle ayrılır."
              id: "Frasa partisipel berada setelah nomina yang dijelaskannya; di akhir kalimat dipisahkan satu koma, di tengah kalimat dua koma."
              vi: "Cụm phân từ đứng sau danh từ mà nó miêu tả; ở cuối câu, một dấu phẩy ngăn nó ra, còn ở giữa câu là hai dấu phẩy."
            ex: ["Ми поверну́лися з екску́рсії, ", { target: організо́ваної для уча́сників }, " конфере́нції."]
            tr: { en: "We came back from the trip organised for the conference participants.", es: "Volvimos de la excursión organizada para los participantes del congreso.", pt: "Voltamos da excursão organizada para os participantes da conferência.", fr: "Nous sommes rentrés de l’excursion organisée pour les participants de la conférence.", de: "Wir sind von dem Ausflug zurückgekehrt, der für die Konferenzteilnehmer organisiert wurde.", it: "Siamo tornati dall'escursione organizzata per i partecipanti alla conferenza.", pl: "Wróciliśmy z wycieczki zorganizowanej dla uczestników konferencji.", tr: "Konferans katılımcıları için düzenlenen geziden döndük.", id: "Kami kembali dari tur yang diselenggarakan untuk peserta konferensi.", vi: "Chúng tôi trở về từ chuyến tham quan được tổ chức cho những người dự hội nghị." }
          - type: rule
            level: B1
            text:
              uk: "Дієприслівниковий зворот називає ще одну дію підмета; його так само відокремлюємо комою, а всередині речення — двома."
              en: "An adverbial participle phrase names another action of the subject; it too takes one comma, or two inside the sentence."
              es: "La construcción de gerundio nombra otra acción del sujeto; también lleva una coma, o dos en medio de la oración."
              pt: "A construção com gerúndio nomeia outra ação do sujeito; também leva uma vírgula, ou duas no meio da frase."
              fr: "Le groupe au gérondif exprime une autre action du sujet ; il prend lui aussi une virgule, ou deux au milieu de la phrase."
              de: "Eine Adverbialpartizipialkonstruktion nennt eine weitere Handlung des Subjekts; auch sie wird durch ein Komma abgetrennt, mitten im Satz durch zwei."
              it: "Il costrutto con il gerundio indica un'altra azione del soggetto; anch'esso prende una virgola, o due in mezzo alla frase."
              pl: "Wyrażenie z imiesłowem przysłówkowym nazywa jeszcze jedną czynność podmiotu; też oddzielamy je przecinkiem, a w środku zdania — dwoma."
              tr: "Zarf-fiil öbeği, öznenin başka bir eylemini bildirir; o da bir virgülle, cümlenin ortasındaysa iki virgülle ayrılır."
              id: "Frasa partisipel adverbial menyebutkan tindakan lain dari subjek; frasa ini juga dipisahkan satu koma, atau dua koma di tengah kalimat."
              vi: "Cụm phân từ trạng ngữ nêu một hành động khác của chủ ngữ; nó cũng được ngăn bằng một dấu phẩy, hoặc hai dấu phẩy khi ở giữa câu."
            ex: [{ target: Поверну́вшись з екску́рсії }, ", ми сма́чно пообі́дали в рестора́ні."]
            tr: { en: "Having come back from the trip, we had a good lunch in a restaurant.", es: "Al volver de la excursión, comimos muy bien en un restaurante.", pt: "Ao voltar da excursão, almoçamos muito bem em um restaurante.", fr: "De retour de l’excursion, nous avons très bien déjeuné dans un restaurant.", de: "Von dem Ausflug zurückgekehrt, aßen wir in einem Restaurant gut zu Mittag.", it: "Tornati dall'escursione, abbiamo pranzato molto bene in un ristorante.", pl: "Wróciwszy z wycieczki, smacznie zjedliśmy obiad w restauracji.", tr: "Geziden dönünce bir restoranda güzel bir öğle yemeği yedik.", id: "Setelah kembali dari tur, kami makan siang dengan nikmat di sebuah restoran.", vi: "Trở về từ chuyến tham quan, chúng tôi ăn trưa rất ngon ở một nhà hàng." }

  - title: { uk: "Форма: як їх упізнати", en: "Form: how to recognise them", es: "Forma: cómo reconocerlas", pt: "Forma: como reconhecê-las", fr: "Forme : comment les reconnaître", de: "Form: woran man sie erkennt", it: "Forma: come riconoscerli", pl: "Forma: jak je rozpoznać", tr: "Biçim: nasıl tanınır", id: "Bentuk: cara mengenalinya", vi: "Dạng: cách nhận biết" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma, pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B1
            form: { uk: ["дієприкметник на ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": як прикметник"], en: ["a participle in ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": like an adjective"], es: ["participio en ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": como un adjetivo"], pt: ["particípio em ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": como um adjetivo"], fr: ["participe en ", { alternatives: [{ term: -ний }, { term: -тий }] }, " : comme un adjectif"], de: ["Partizip auf ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": wie ein Adjektiv"], it: ["participio in ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": come un aggettivo"], pl: ["imiesłów na ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": jak przymiotnik"], tr: [{ alternatives: [{ term: -ний }, { term: -тий }] }, " ile biten sıfat-fiil: sıfat gibi davranır"], id: ["partisipel berakhiran ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": seperti adjektiva"], vi: ["phân từ tận cùng ", { alternatives: [{ term: -ний }, { term: -тий }] }, ": như tính từ"] }
            ex: { examples: [{ mapping: [написа́ти, { target: напи́саний }] }, { mapping: [відкри́ти, { target: відкри́тий }] }] }
          - level: B1
            form: { uk: ["дієприслівник на ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": недоконаний вид"], en: ["an adverbial participle in ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfective"], es: ["gerundio en ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfectivo"], pt: ["gerúndio em ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfectivo"], fr: ["gérondif en ", { alternatives: [{ term: -ючи }, { term: -учи }] }, " : imperfectif"], de: ["Adverbialpartizip auf ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfektiv"], it: ["gerundio in ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfettivo"], pl: ["imiesłów przysłówkowy na ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": niedokonany"], tr: [{ alternatives: [{ term: -ючи }, { term: -учи }] }, " ile biten zarf-fiil: tamamlanmamış görünüş"], id: ["partisipel adverbial berakhiran ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": imperfektif"], vi: ["phân từ trạng ngữ tận cùng ", { alternatives: [{ term: -ючи }, { term: -учи }] }, ": thể chưa hoàn thành"] }
            ex: { examples: [{ mapping: [чита́ти, { target: чита́ючи }] }, { mapping: [іти́, { target: ідучи́ }] }] }
          - level: B1
            form: { uk: ["дієприслівник на ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": доконаний вид"], en: ["an adverbial participle in ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfective"], es: ["gerundio en ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfectivo"], pt: ["gerúndio em ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfectivo"], fr: ["gérondif en ", { alternatives: [{ term: -вши }, { term: -ши }] }, " : perfectif"], de: ["Adverbialpartizip auf ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfektiv"], it: ["gerundio in ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfettivo"], pl: ["imiesłów przysłówkowy na ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": dokonany"], tr: [{ alternatives: [{ term: -вши }, { term: -ши }] }, " ile biten zarf-fiil: tamamlanmış görünüş"], id: ["partisipel adverbial berakhiran ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": perfektif"], vi: ["phân từ trạng ngữ tận cùng ", { alternatives: [{ term: -вши }, { term: -ши }] }, ": thể hoàn thành"] }
            ex: { examples: [{ mapping: [прочита́ти, { target: прочита́вши }] }, { mapping: [поверну́тися, { target: поверну́вшись }] }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Дієприкметник узгоджується з іменником у роді, числі й відмінку, як прикметник."
              en: "A participle agrees with its noun in gender, number and case, like an adjective."
              es: "El participio concuerda con su sustantivo en género, número y caso, como un adjetivo."
              pt: "O particípio concorda com o substantivo em gênero, número e caso, como um adjetivo."
              fr: "Le participe s’accorde avec son nom en genre, en nombre et en cas, comme un adjectif."
              de: "Das Partizip stimmt mit seinem Nomen in Genus, Numerus und Kasus überein, wie ein Adjektiv."
              it: "Il participio concorda con il suo sostantivo in genere, numero e caso, come un aggettivo."
              pl: "Imiesłów zgadza się z rzeczownikiem w rodzaju, liczbie i przypadku, jak przymiotnik."
              tr: "Sıfat-fiil, bir sıfat gibi, isimle cinsiyet, sayı ve hâl bakımından uyuşur."
              id: "Partisipel selaras dengan nomina dalam gender, jumlah, dan kasus, seperti adjektiva."
              vi: "Phân từ hòa hợp với danh từ về giống, số và cách, giống như tính từ."
            ex: { examples: [["вікно́, ", { target: відкри́те }, " вра́нці"], ["две́рі, ", { target: відкри́ті }, " на ніч"]] }
            tr: { en: { examples: ["the window opened in the morning", "the door left open for the night"] }, es: { examples: ["la ventana abierta por la mañana", "la puerta abierta por la noche"] }, pt: { examples: ["a janela aberta de manhã", "a porta deixada aberta para a noite"] }, fr: { examples: ["la fenêtre ouverte le matin", "la porte laissée ouverte pour la nuit"] }, de: { examples: ["das am Morgen geöffnete Fenster", "die für die Nacht offen gelassene Tür"] }, it: { examples: ["la finestra aperta la mattina", "la porta lasciata aperta per la notte"] }, pl: { examples: ["okno otwarte rano", "drzwi otwarte na noc"] }, tr: { examples: ["sabah açılan pencere", "geceye açık bırakılan kapı"] }, id: { examples: ["jendela yang dibuka pada pagi hari", "pintu yang dibiarkan terbuka sepanjang malam"] }, vi: { examples: ["cửa sổ được mở vào buổi sáng", "cánh cửa được để mở suốt đêm"] } }
          - type: rule
            level: B1
            text:
              uk: "Дієприслівник не змінюється; недоконаний вид означає одночасну дію, доконаний — дію, що відбулася раніше."
              en: "An adverbial participle never changes; the imperfective means at the same time, the perfective means done before."
              es: "El gerundio no cambia; el imperfectivo indica una acción simultánea, el perfectivo una acción anterior."
              pt: "O gerúndio não muda; o imperfectivo indica uma ação simultânea, o perfectivo, uma ação anterior."
              fr: "Le gérondif est invariable ; l’imperfectif indique une action simultanée, le perfectif une action antérieure."
              de: "Das Adverbialpartizip verändert sich nie; der imperfektive Aspekt bedeutet eine gleichzeitige, der perfektive eine vorzeitige Handlung."
              it: "Il gerundio non cambia; l'imperfettivo indica un'azione contemporanea, il perfettivo un'azione anteriore."
              pl: "Imiesłów przysłówkowy się nie zmienia; niedokonany oznacza czynność jednoczesną, dokonany — czynność wcześniejszą."
              tr: "Zarf-fiil değişmez; tamamlanmamış görünüş eş zamanlı, tamamlanmış görünüş daha önce olmuş bir eylemi bildirir."
              id: "Partisipel adverbial tidak berubah; aspek imperfektif menyatakan tindakan bersamaan, aspek perfektif menyatakan tindakan yang lebih dahulu."
              vi: "Phân từ trạng ngữ không biến đổi; thể chưa hoàn thành chỉ hành động đồng thời, thể hoàn thành chỉ hành động xảy ra trước."

