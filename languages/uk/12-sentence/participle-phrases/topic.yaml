              de: ["Für eine Person, die etwas tut, verwendet das Ukrainische einen Nebensatz mit ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              it: ["Per una persona che fa qualcosa, l'ucraino usa una proposizione con ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              pl: ["O osobie, która coś robi, po ukraińsku używamy zdania podrzędnego z ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              tr: ["Bir şey yapan kişi için Ukraynacada ", { term: яки́й }, " ile kurulan bir yan cümle kullanılır: ", { term: "студе́нт, яки́й чита́є" }, "."]
              id: ["Untuk orang yang sedang melakukan sesuatu, bahasa Ukraina memakai klausa dengan ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]
              vi: ["Khi nói về một người đang làm gì đó, tiếng Ukraina dùng mệnh đề với ", { term: яки́й }, ": ", { term: "студе́нт, яки́й чита́є" }, "."]

