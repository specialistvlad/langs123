        columns:
          - { key: use, label: { uk: Місце і склад звороту , en: "Position and make-up of the phrase", es: "Lugar y composición de la construcción", pt: "Lugar e composição da construção", fr: "Place et composition du groupe", de: "Stellung und Aufbau der Konstruktion", it: "Posizione e composizione del costrutto", pl: "Miejsce i skład wyrażenia", tr: "Öbeğin yeri ve yapısı", id: "Posisi dan susunan frasa", vi: "Vị trí và thành phần của cụm từ"} }
