  - title: { uk: Зворот у реченні , en: "The phrase in the sentence", es: "La construcción en la oración", pt: "A construção na frase", fr: "Le groupe dans la phrase", de: "Die Konstruktion im Satz", it: "Il costrutto nella frase", pl: "Wyrażenie w zdaniu", tr: "Öbek cümlede", id: "Frasa dalam kalimat", vi: "Cụm từ trong câu"}
    role: own
