id: uk.sentence.relative-yakyi
lang: uk
kind: grammar
tags: [relative-clauses, yakyi, cases, agreement]
concepts: [relative-clauses]
related: [uk.sentence.shcho-shchob, uk.pronouns.question-words, uk.adjectives-adverbs.adjective-declension, uk.nouns-cases.cases-overview]
status: { uk: draft, en: draft, es: draft }
translated: { en: "5f7b9b ad8676 5b2477 87051f 52e3d2 0e5a9d", es: "5f7b9b ad8676 5b2477 87051f 52e3d2 0e5a9d" }

title: { uk: Означальні речення з який, en: Relative Clauses with який, es: Oraciones de relativo con який }
summary:
  lead:
    uk: [{ term: Яки́й }, " приєднує частину, що описує іменник: рід і число бере від іменника, а відмінок — від своєї ролі в цій частині."]
    en: [{ term: Яки́й }, " joins a clause that describes a noun: it takes its gender and number from the noun, and its case from its own role in the clause."]
    es: [{ term: Яки́й }, " une una oración que describe un sustantivo: toma el género y el número del sustantivo, y el caso de su función en la oración."]
  rule:
    uk: ["Відмінок слова ", { term: яки́й }, " залежить від його ролі в підрядній частині:"]
    en: ["The case of ", { term: яки́й }, " depends on its role in its own clause:"]
    es: ["El caso de ", { term: яки́й }, " depende de su función en su propia oración:"]
  ex: { examples: [["Це па́ні, ", { target: яка́ }, " живе́ по́руч."], ["Це па́ні, ", { target: яку́ }, " ми зустрі́ли."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { uk: Рід і число, en: Gender and number, es: Género y número }
          rule:
            uk: "як в іменника, який описує"
            en: "those of the noun it describes"
            es: "los del sustantivo que describe"
          ex: ["Це студе́нтка, ", { target: яка́ }, " вивча́є украї́нську."]
          tr: { en: "This is the student who is learning Ukrainian.", es: "Esta es la estudiante que aprende ucraniano." }
        - level: B1
          point: { uk: Підмет, en: Subject, es: Sujeto }
          rule:
            uk: "називний відмінок"
            en: "the nominative"
            es: "el nominativo"
          ex: ["Це студе́нт, ", { target: яки́й }, " живе́ по́руч."]
          tr: { en: "This is the student who lives nearby.", es: "Este es el estudiante que vive cerca." }
        - level: B1
          point: { uk: Додаток, en: Object, es: Objeto }
          rule:
            uk: "знахідний відмінок"
            en: "the accusative"
            es: "el acusativo"
          ex: ["Кни́жка, ", { target: яку́ }, " я чита́ю, ціка́ва."]
          tr: { en: "The book I'm reading is interesting.", es: "El libro que estoy leyendo es interesante." }
        - level: B1
          point: { uk: Прийменник, en: Preposition, es: Preposición }
          rule:
            uk: ["прийменник стоїть перед ", { term: яки́й }]
            en: ["the preposition goes before ", { term: яки́й }]
            es: ["la preposición va delante de ", { term: яки́й }]
          ex: ["Це друг, ", { target: з яки́м }, " я працю́ю."]
          tr: { en: "This is the friend I work with.", es: "Este es el amigo con quien trabajo." }
        - level: B1
          point: { uk: Кома, en: Commas, es: Comas }
          rule:
            uk: "дві коми, коли частина всередині речення; одна, коли в кінці"
            en: "two commas when the clause is inside the sentence; one when it ends it"
            es: "dos comas si la oración va en medio; una si va al final"
          ex: ["Мі́сто", { target: ", в яко́му я живу́," }, " ду́же га́рне."]
          tr: { en: "The city I live in is very beautiful.", es: "La ciudad en la que vivo es muy bonita." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["слово ", { term: яки́й }, " ніколи не пропускаємо"]
            en: [{ term: яки́й }, " never drops"]
            es: [{ term: яки́й }, " nunca se omite"]
          ex: ["Фільм, ", { target: яки́й }, " ми диви́лися, був сумни́й."]
          tr: { en: "The film we watched was sad.", es: "La película que vimos era triste." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Підрядна частина з ", { term: яки́й }, " описує іменник і стоїть одразу після нього."]
              en: ["A clause with ", { term: яки́й }, " describes a noun and comes right after it."]
              es: ["Una oración con ", { term: яки́й }, " describe un sustantivo y va justo después de él."]
            ex: ["Па́ні, ", { target: яку́ }, " ми сього́дні зустрі́ли, живе́ в сусі́дній кварти́рі."]
            tr: { en: "The lady we met today lives in the next flat.", es: "La señora que encontramos hoy vive en el apartamento de al lado." }
          - type: rule
            level: B1
            text:
              uk: [{ term: Яки́й }, " бере рід і число від іменника, а відмінок — від своєї ролі в підрядній частині."]
              en: [{ term: Яки́й }, " takes its gender and number from the noun, and its case from its role in the clause."]
              es: [{ term: Яки́й }, " toma el género y el número del sustantivo, y el caso de su función en la oración."]
          - type: rule
            level: B1
            text:
              uk: "Підрядну частину всередині речення виділяємо двома комами, а в кінці речення — однією:"
              en: "Two commas set off a clause inside the sentence, and one comma a clause at the end:"
              es: "Dos comas delimitan la oración en medio de la frase, y una coma la que va al final:"
            ex: { contrast: [["Мі́сто", { target: ", в яко́му я живу́," }, " ду́же га́рне."], ["Це друг", { target: ", з яки́м" }, " я працю́ю."]] }
            tr: { en: { contrast: ["The city I live in is very beautiful.", "This is the friend I work with."] }, es: { contrast: ["La ciudad en la que vivo es muy bonita.", "Este es el amigo con quien trabajo."] } }

  - title: { uk: "Форма: який у відмінках", en: "Form: який in the cases", es: "Forma: який en los casos" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: case, label: { uk: Відмінок, en: Case, es: Caso } }
          - { key: masc, label: { uk: Чоловічий рід, en: Masculine, es: Masculino }, features: { gender: masc, number: sg } }
          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino }, features: { gender: fem, number: sg } }
          - { key: pl, label: { uk: Множина, en: Plural, es: Plural }, features: { number: pl } }
        rows:
          - { level: B1, features: { case: nom }, case: { uk: Називний, en: Nominative, es: Nominativo }, masc: яки́й, fem: яка́, pl: які́ }
          - { level: B1, features: { case: gen }, case: { uk: Родовий, en: Genitive, es: Genitivo }, masc: яко́го, fem: яко́ї, pl: яки́х }
          - { level: B1, features: { case: dat }, case: { uk: Давальний, en: Dative, es: Dativo }, masc: яко́му, fem: які́й, pl: яки́м }
          - { level: B1, features: { case: acc }, case: { uk: Знахідний, en: Accusative, es: Acusativo }, masc: { alternatives: [яки́й, яко́го] }, fem: яку́, pl: { alternatives: [які́, яки́х] } }
          - { level: B1, features: { case: ins }, case: { uk: Орудний, en: Instrumental, es: Instrumental }, masc: яки́м, fem: яко́ю, pl: яки́ми }
          - { level: B1, features: { case: loc }, case: { uk: Місцевий, en: Locative, es: Locativo }, masc: яко́му, fem: які́й, pl: яки́х }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Середній рід має ", { term: яке́ }, " у називному й знахідному, а в інших відмінках — ті самі форми, що й чоловічий."]
              en: ["The neuter is ", { term: яке́ }, " in the nominative and accusative, and like the masculine in the other cases."]
              es: ["El neutro es ", { term: яке́ }, " en nominativo y acusativo, y como el masculino en los demás casos."]
            ex: ["Мі́сто, ", { target: яке́ }, " ми ба́чили, старе́."]
            tr: { en: "The town we saw is old.", es: "La ciudad que vimos es antigua." }
          - type: rule
            level: B1
            text:
              uk: ["У знахідному відмінку для людей і тварин: ", { term: яко́го }, ", ", { term: яки́х }, "; для речей: ", { term: яки́й }, ", ", { term: які́ }, "."]
              en: ["In the accusative, people and animals take ", { term: яко́го }, " and ", { term: яки́х }, "; things take ", { term: яки́й }, " and ", { term: які́ }, "."]
              es: ["En acusativo, las personas y los animales llevan ", { term: яко́го }, " y ", { term: яки́х }, "; las cosas, ", { term: яки́й }, " y ", { term: які́ }, "."]
            ex: { examples: [["Хло́пець, ", { target: яко́го }, " я чека́ю, ще не прийшо́в."], ["Буди́нок, ", { target: яки́й }, " ми купи́ли, вели́кий."]] }
            tr: { en: { examples: ["The boy I'm waiting for hasn't come yet.", "The house we bought is big."] }, es: { examples: ["El chico al que espero todavía no ha llegado.", "La casa que compramos es grande."] } }

  - title: { uk: Вживання, en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Роль слова який, en: The role of який, es: La función de який } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            use: { uk: "підмет: називний", en: "subject: the nominative", es: "sujeto: el nominativo" }
            ex: ["Буди́нки, ", { target: які́ }, " стоя́ть на пло́щі Ри́нок, ду́же старі́."]
            tr: { en: "The buildings that stand on Market Square are very old.", es: "Los edificios que están en la plaza del Mercado son muy antiguos." }
          - level: B1
            use: { uk: "додаток: знахідний", en: "object: the accusative", es: "objeto: el acusativo" }
            ex: ["Подару́нок, ", { target: яки́й }, " ти купи́в, мені́ ду́же подо́бається."]
            tr: { en: "I really like the present you bought.", es: "Me gusta mucho el regalo que compraste." }
          - level: B1
            use: { uk: "кому?: давальний", en: "to whom: the dative", es: "a quién: el dativo" }
            ex: ["Друг, ", { target: яко́му }, " я дзвоню́, живе́ в Ки́єві."]
            tr: { en: "The friend I'm calling lives in Kyiv.", es: "El amigo al que llamo vive en Kiev." }
          - level: B1
            use: { uk: "з ким?: орудний", en: "with whom: the instrumental", es: "con quién: el instrumental" }
            ex: ["Це друг, ", { target: з яки́м }, " я працю́ю."]
            tr: { en: "This is the friend I work with.", es: "Este es el amigo con quien trabajo." }
          - level: B1
            use: { uk: "де?: місцевий", en: "where: the locative", es: "dónde: el locativo" }
            ex: ["Мі́сто, ", { target: в яко́му }, " я живу́, ду́же га́рне."]
            tr: { en: "The city I live in is very beautiful.", es: "La ciudad en la que vivo es muy bonita." }
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: ["У називному й знахідному замість ", { term: яки́й }, " іноді вживаємо ", { term: що }, ", який не змінюється: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              en: ["In the nominative and accusative, ", { term: що }, " sometimes replaces ", { term: яки́й }, " and never changes: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              es: ["En nominativo y acusativo, ", { term: що }, " a veces sustituye a ", { term: яки́й }, " y no cambia: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
          - type: note
            level: B1
            text:
              uk: ["Так само змінюється ", { term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, "), але в означальних реченнях його вживаємо рідше, ніж ", { term: яки́й }, "."]
              en: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") changes in the same way, but relative clauses use it less often than ", { term: яки́й }, "."]
              es: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") cambia igual, pero en las oraciones de relativo se usa menos que ", { term: яки́й }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Хло́пець, кото́рий живе́ по́руч, мій брат.", right: ["Хло́пець, ", { target: яки́й }, " живе́ по́руч, мій брат."], rule: { uk: ["форма ", { term: кото́рий }, " — російська; українське ", { term: котри́й }, " рідше, звичайно ", { term: яки́й }], en: ["the form ", { term: кото́рий }, " is Russian; Ukrainian ", { term: котри́й }, " is rarer, and ", { term: яки́й }, " is the usual word"], es: ["la forma ", { term: кото́рий }, " es rusa; el ucraniano ", { term: котри́й }, " es menos frecuente, y lo habitual es ", { term: яки́й }] } }
          - { level: B1, speakers: [en, es], wrong: "Па́ні, яка́ ми зустрі́ли, живе́ по́руч.", right: ["Па́ні, ", { target: яку́ }, " ми зустрі́ли, живе́ по́руч."], rule: { en: [{ term: яки́й }, " takes its case from its role in the clause: here the object, so the accusative"], es: [{ term: яки́й }, " toma el caso de su función en la oración: aquí es objeto, así que va en acusativo"] } }
          - { level: B1, speakers: [en], wrong: Кни́жка я чита́ю ціка́ва., right: ["Кни́жка", { target: ", яку́ я чита́ю," }, " ціка́ва."], rule: { en: [{ term: яки́й }, " never drops the way “that” can, and commas set off the clause"] } }
