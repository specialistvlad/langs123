          - { key: fem, label: { uk: Жіночий рід, en: Feminine, es: Femenino, pt: "Feminino", fr: "Féminin", de: "Femininum", it: "Femminile", pl: "Rodzaj żeński", tr: "Dişil", id: "Feminin", vi: "Giống cái" }, features: { gender: fem, number: sg } }
