        rows:
          - { level: B1, features: { case: nom }, case: { uk: Називний, en: Nominative, es: Nominativo, pt: "Nominativo", fr: "Nominatif", de: "Nominativ", it: "Nominativo", pl: "Mianownik", tr: "Yalın hâl", id: "Nominatif", vi: "Danh cách" }, masc: яки́й, fem: яка́, pl: які́ }
