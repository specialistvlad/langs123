title: { uk: Означальні речення з який, en: Relative Clauses with який, es: Oraciones de relativo con який, pt: "Orações relativas com який", fr: "Les propositions relatives avec який", de: "Relativsätze mit який", it: "Le proposizioni relative con який", pl: "Zdania względne z який", tr: "який ile kurulan ilgi cümleleri", id: "Klausa relatif dengan який", vi: "Mệnh đề quan hệ với який" }
summary:
  lead:
    uk: [{ term: Яки́й }, " приєднує частину, що описує іменник: рід і число бере від іменника, а відмінок — від своєї ролі в цій частині."]
    en: [{ term: Яки́й }, " joins a clause that describes a noun: it takes its gender and number from the noun, and its case from its own role in the clause."]
    es: [{ term: Яки́й }, " une una oración que describe un sustantivo: toma el género y el número del sustantivo, y el caso de su función en la oración."]
    pt: [{ term: Яки́й }, " introduz uma oração que descreve um substantivo: toma o gênero e o número do substantivo e o caso da sua função na oração."]
    fr: [{ term: Яки́й }, " introduit une proposition qui décrit un nom : il prend le genre et le nombre du nom, et le cas de sa fonction dans la proposition."]
    de: [{ term: Яки́й }, " leitet einen Nebensatz ein, der ein Nomen beschreibt: Genus und Numerus stammen vom Nomen, der Kasus von der Rolle im Nebensatz."]
    it: [{ term: Яки́й }, " introduce una proposizione che descrive un sostantivo: prende genere e numero dal sostantivo e il caso dal suo ruolo."]
    pl: [{ term: Яки́й }, " wprowadza zdanie opisujące rzeczownik: rodzaj i liczbę bierze od rzeczownika, a przypadek — ze swojej roli w tym zdaniu."]
    tr: ["Bir ismi niteleyen yan cümleyi ", { term: яки́й }, " bağlar; cinsiyeti ve sayıyı isimden, hâli ise yan cümledeki görevinden alır."]
    id: [{ term: Яки́й }, " menghubungkan klausa yang menjelaskan nomina: gender dan jumlah diambil dari nomina, kasus dari fungsinya dalam klausa."]
    vi: [{ term: Яки́й }, " nối mệnh đề mô tả danh từ: giống và số theo danh từ, còn cách theo vai trò của nó trong mệnh đề."]
  rule:
    uk: ["Відмінок слова ", { term: яки́й }, " залежить від його ролі в підрядній частині:"]
    en: ["The case of ", { term: яки́й }, " depends on its role in its own clause:"]
    es: ["El caso de ", { term: яки́й }, " depende de su función en su propia oración:"]
    pt: ["O caso de ", { term: яки́й }, " depende da sua função na própria oração:"]
    fr: ["Le cas de ", { term: яки́й }, " dépend de sa fonction dans sa propre proposition :"]
    de: ["Der Kasus von ", { term: яки́й }, " hängt von seiner Rolle im eigenen Nebensatz ab:"]
    it: ["Il caso di ", { term: яки́й }, " dipende dal suo ruolo nella propria proposizione:"]
    pl: ["Przypadek słowa ", { term: яки́й }, " zależy od jego roli w zdaniu podrzędnym:"]
    tr: ["Yan cümledeki göreve göre ", { term: яки́й }, " sözcüğünün hâli değişir:"]
    id: ["Kasus ", { term: яки́й }, " bergantung pada fungsinya dalam klausanya sendiri:"]
    vi: ["Cách của ", { term: яки́й }, " tùy vai trò của nó trong mệnh đề:"]
  ex: { examples: [["Це па́ні, ", { target: яка́ }, " живе́ по́руч."], ["Це па́ні, ", { target: яку́ }, " ми зустрі́ли."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Пункт, en: Point, es: Punto, pt: "Ponto", fr: "Point", de: "Punkt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla, pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B1
          point: { uk: Рід і число, en: Gender and number, es: Género y número, pt: "Gênero e número", fr: "Genre et nombre", de: "Genus und Numerus", it: "Genere e numero", pl: "Rodzaj i liczba", tr: "Cinsiyet ve sayı", id: "Gender dan jumlah", vi: "Giống và số" }
          rule:
            uk: "як в іменника, який описує"
            en: "those of the noun it describes"
            es: "los del sustantivo que describe"
            pt: "os do substantivo que descreve"
            fr: "ceux du nom qu’il décrit"
            de: "wie beim Nomen, das er beschreibt"
            it: "quelli del sostantivo che descrive"
            pl: "takie jak rzeczownik, który opisuje"
            tr: "nitelediği isimle aynı"
            id: "sama dengan nomina yang dijelaskan"
            vi: "giống danh từ mà nó mô tả"
          ex: ["Це студе́нтка, ", { target: яка́ }, " вивча́є украї́нську."]
          tr: { en: "This is the student who is learning Ukrainian.", es: "Esta es la estudiante que aprende ucraniano.", pt: "Esta é a estudante que está aprendendo ucraniano.", fr: "Voici l’étudiante qui apprend l’ukrainien.", de: "Das ist die Studentin, die Ukrainisch lernt.", it: "Questa è la studentessa che studia ucraino.", pl: "To jest studentka, która uczy się ukraińskiego.", tr: "Bu, Ukraynaca öğrenen öğrenci.", id: "Ini mahasiswi yang sedang belajar bahasa Ukraina.", vi: "Đây là nữ sinh viên đang học tiếng Ukraina." }
        - level: B1
          point: { uk: Підмет, en: Subject, es: Sujeto, pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }
          rule:
            uk: "називний відмінок"
            en: "the nominative"
            es: "el nominativo"
            pt: "o nominativo"
            fr: "le nominatif"
            de: "der Nominativ"
            it: "il nominativo"
            pl: "mianownik"
            tr: "yalın hâl"
            id: "nominatif"
            vi: "danh cách"
          ex: ["Це студе́нт, ", { target: яки́й }, " живе́ по́руч."]
          tr: { en: "This is the student who lives nearby.", es: "Este es el estudiante que vive cerca.", pt: "Este é o estudante que mora aqui perto.", fr: "Voici l’étudiant qui habite près d’ici.", de: "Das ist der Student, der in der Nähe wohnt.", it: "Questo è lo studente che abita qui vicino.", pl: "To jest student, który mieszka obok.", tr: "Bu, yakınlarda oturan öğrenci.", id: "Ini mahasiswa yang tinggal di dekat sini.", vi: "Đây là sinh viên sống gần đây." }
        - level: B1
          point: { uk: Додаток, en: Object, es: Objeto, pt: "Objeto", fr: "Complément d’objet", de: "Objekt", it: "Complemento oggetto", pl: "Dopełnienie", tr: "Nesne", id: "Objek", vi: "Tân ngữ" }
          rule:
            uk: "знахідний відмінок"
            en: "the accusative"
            es: "el acusativo"
            pt: "o acusativo"
            fr: "l’accusatif"
            de: "der Akkusativ"
            it: "l'accusativo"
            pl: "biernik"
            tr: "belirtme hâli"
            id: "akusatif"
            vi: "đối cách"
          ex: ["Кни́жка, ", { target: яку́ }, " я чита́ю, ціка́ва."]
          tr: { en: "The book I'm reading is interesting.", es: "El libro que estoy leyendo es interesante.", pt: "O livro que estou lendo é interessante.", fr: "Le livre que je lis est intéressant.", de: "Das Buch, das ich lese, ist interessant.", it: "Il libro che sto leggendo è interessante.", pl: "Książka, którą czytam, jest ciekawa.", tr: "Okuduğum kitap ilginç.", id: "Buku yang sedang saya baca itu menarik.", vi: "Cuốn sách tôi đang đọc rất hay." }
        - level: B1
          point: { uk: Прийменник, en: Preposition, es: Preposición, pt: "Preposição", fr: "Préposition", de: "Präposition", it: "Preposizione", pl: "Przyimek", tr: "Edat", id: "Preposisi", vi: "Giới từ" }
          rule:
            uk: ["прийменник стоїть перед ", { term: яки́й }]
            en: ["the preposition goes before ", { term: яки́й }]
            es: ["la preposición va delante de ", { term: яки́й }]
            pt: ["a preposição vem antes de ", { term: яки́й }]
            fr: ["la préposition se place devant ", { term: яки́й }]
            de: ["die Präposition steht vor ", { term: яки́й }]
            it: ["la preposizione va davanti a ", { term: яки́й }]
            pl: ["przyimek stoi przed ", { term: яки́й }]
            tr: ["edat ", { term: яки́й }, " sözcüğünün önüne gelir"]
            id: ["preposisi berada di depan ", { term: яки́й }]
            vi: ["giới từ đứng trước ", { term: яки́й }]
          ex: ["Це друг, ", { target: з яки́м }, " я працю́ю."]
          tr: { en: "This is the friend I work with.", es: "Este es el amigo con quien trabajo.", pt: "Este é o amigo com quem trabalho.", fr: "Voici l’ami avec qui je travaille.", de: "Das ist der Freund, mit dem ich arbeite.", it: "Questo è l'amico con cui lavoro.", pl: "To jest przyjaciel, z którym pracuję.", tr: "Bu, birlikte çalıştığım arkadaş.", id: "Ini teman yang bekerja bersama saya.", vi: "Đây là người bạn mà tôi làm việc cùng." }
        - level: B1
          point: { uk: Кома, en: Commas, es: Comas, pt: "Vírgulas", fr: "Virgules", de: "Kommas", it: "Virgole", pl: "Przecinki", tr: "Virgüller", id: "Koma", vi: "Dấu phẩy" }
          rule:
            uk: "дві коми, коли частина всередині речення; одна, коли в кінці"
            en: "two commas when the clause is inside the sentence; one when it ends it"
            es: "dos comas si la oración va en medio; una si va al final"
            pt: "duas vírgulas se a oração está no meio da frase; uma se está no fim"
            fr: "deux virgules si la proposition est au milieu de la phrase, une si elle la termine"
            de: "zwei Kommas, wenn der Nebensatz mitten im Satz steht; eins, wenn er am Ende steht"
            it: "due virgole se la proposizione è in mezzo alla frase; una se è alla fine"
            pl: "dwa przecinki, gdy zdanie stoi w środku wypowiedzenia; jeden, gdy na końcu"
            tr: "yan cümle cümlenin ortasındaysa iki virgül, sonundaysa bir virgül"
            id: "dua koma jika klausa berada di tengah kalimat; satu jika berada di akhir"
            vi: "hai dấu phẩy khi mệnh đề ở giữa câu; một dấu phẩy khi ở cuối câu"
          ex: ["Мі́сто", { target: ", в яко́му я живу́," }, " ду́же га́рне."]
          tr: { en: "The city I live in is very beautiful.", es: "La ciudad en la que vivo es muy bonita.", pt: "A cidade em que moro é muito bonita.", fr: "La ville où j’habite est très belle.", de: "Die Stadt, in der ich wohne, ist sehr schön.", it: "La città in cui vivo è molto bella.", pl: "Miasto, w którym mieszkam, jest bardzo ładne.", tr: "Yaşadığım şehir çok güzel.", id: "Kota tempat saya tinggal sangat indah.", vi: "Thành phố nơi tôi sống rất đẹp." }
        - level: B2
          point: що
          rule:
            uk: "називний або знахідний; форма не змінюється"
          ex: ["Ті лю́ди, ", { target: що }, " стоя́ть бі́ля вхо́ду, чека́ють на екску́рсію."]
        - level: B2
          point: котри́й
          rule:
            uk: "як який, у всіх відмінках; рід указує на потрібний іменник"
          ex: ["У ли́сті від подру́ги, ", { target: котра́ }, " живе́ в Німе́ччині, були́ фотогра́фії."]
        - level: C2
          point: { uk: "Чий?" }
          rule:
            uk: "родовий відмінок слова який: власник у підрядній частині"
          ex: ["Бі́ля шко́ли росте́ дуб, вік ", { target: яко́го }, " по́над три́ста ро́ків."]
        - level: C2
          point: що
          rule:
            uk: "після іменника в множині форма та сама; присудок у множині"
          ex: ["Украї́нською розмовля́ють мільйо́ни люде́й, ", { target: що }, " прожива́ють у рі́зних краї́нах."]
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: ["слово ", { term: яки́й }, " ніколи не пропускаємо"]
            en: [{ term: яки́й }, " never drops"]
            es: [{ term: яки́й }, " nunca se omite"]
            pt: [{ term: яки́й }, " nunca se omite"]
            fr: [{ term: яки́й }, " ne s’omet jamais"]
            de: [{ term: яки́й }, " fällt nie weg"]
            it: [{ term: яки́й }, " non si omette mai"]
            pl: [{ term: яки́й }, " nigdy się nie pomija"]
            tr: [{ term: яки́й }, " asla düşmez"]
            id: [{ term: яки́й }, " tidak pernah dihilangkan"]
            vi: [{ term: яки́й }, " không bao giờ được bỏ"]
          ex: ["Фільм, ", { target: яки́й }, " ми диви́лися, був сумни́й."]
          tr: { en: "The film we watched was sad.", es: "La película que vimos era triste.", pt: "O filme que vimos era triste.", fr: "Le film que nous avons regardé était triste.", de: "Der Film, den wir gesehen haben, war traurig.", it: "Il film che abbiamo guardato era triste.", pl: "Film, który oglądaliśmy, był smutny.", tr: "İzlediğimiz film hüzünlüydü.", id: "Film yang kami tonton itu sedih.", vi: "Bộ phim chúng tôi đã xem rất buồn." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Підрядна частина з ", { term: яки́й }, " описує іменник і стоїть одразу після нього."]
              en: ["A clause with ", { term: яки́й }, " describes a noun and comes right after it."]
              es: ["Una oración con ", { term: яки́й }, " describe un sustantivo y va justo después de él."]
              pt: ["Uma oração com ", { term: яки́й }, " descreve um substantivo e vem logo depois dele."]
              fr: ["Une proposition avec ", { term: яки́й }, " décrit un nom et vient juste après lui."]
              de: ["Ein Nebensatz mit ", { term: яки́й }, " beschreibt ein Nomen und steht direkt dahinter."]
              it: ["Una proposizione con ", { term: яки́й }, " descrive un sostantivo e viene subito dopo di esso."]
              pl: ["Zdanie z ", { term: яки́й }, " opisuje rzeczownik i stoi zaraz po nim."]
              tr: [{ term: яки́й }, " ile kurulan yan cümle bir ismi niteler ve onun hemen ardından gelir."]
              id: ["Klausa dengan ", { term: яки́й }, " menjelaskan nomina dan berada tepat setelahnya."]
              vi: ["Mệnh đề với ", { term: яки́й }, " mô tả danh từ và đứng ngay sau danh từ đó."]
            ex: ["Па́ні, ", { target: яку́ }, " ми сього́дні зустрі́ли, живе́ в сусі́дній кварти́рі."]
            tr: { en: "The lady we met today lives in the next flat.", es: "La señora que encontramos hoy vive en el apartamento de al lado.", pt: "A senhora que encontramos hoje mora no apartamento ao lado.", fr: "La dame que nous avons rencontrée aujourd’hui habite dans l’appartement voisin.", de: "Die Dame, die wir heute getroffen haben, wohnt in der Nachbarwohnung.", it: "La signora che abbiamo incontrato oggi abita nell'appartamento accanto.", pl: "Pani, którą dziś spotkaliśmy, mieszka w sąsiednim mieszkaniu.", tr: "Bugün tanıştığımız hanım yan dairede oturuyor.", id: "Ibu yang kami temui hari ini tinggal di apartemen sebelah.", vi: "Người phụ nữ chúng tôi gặp hôm nay sống ở căn hộ bên cạnh." }
          - type: rule
            level: B1
            text:
              uk: [{ term: Яки́й }, " бере рід і число від іменника, а відмінок — від своєї ролі в підрядній частині."]
              en: [{ term: Яки́й }, " takes its gender and number from the noun, and its case from its role in the clause."]
              es: [{ term: Яки́й }, " toma el género y el número del sustantivo, y el caso de su función en la oración."]
              pt: [{ term: Яки́й }, " toma o gênero e o número do substantivo e o caso da sua função na oração."]
              fr: [{ term: Яки́й }, " prend le genre et le nombre du nom, et le cas de sa fonction dans la proposition."]
              de: [{ term: Яки́й }, " übernimmt Genus und Numerus vom Nomen und den Kasus aus seiner Rolle im Nebensatz."]
              it: [{ term: Яки́й }, " prende genere e numero dal sostantivo e il caso dal suo ruolo nella proposizione."]
              pl: [{ term: Яки́й }, " bierze rodzaj i liczbę od rzeczownika, a przypadek — ze swojej roli w zdaniu podrzędnym."]
              tr: [{ term: Яки́й }, " cinsiyeti ve sayıyı isimden, hâli ise yan cümledeki görevinden alır."]
              id: [{ term: Яки́й }, " mengambil gender dan jumlah dari nomina, dan kasus dari fungsinya dalam klausa."]
              vi: [{ term: Яки́й }, " lấy giống và số từ danh từ, còn cách từ vai trò của nó trong mệnh đề."]
          - type: rule
            level: B1
            text:
              uk: "Підрядну частину всередині речення виділяємо двома комами, а в кінці речення — однією:"
              en: "Two commas set off a clause inside the sentence, and one comma a clause at the end:"
              es: "Dos comas delimitan la oración en medio de la frase, y una coma la que va al final:"
              pt: "Duas vírgulas isolam a oração no meio da frase, e uma vírgula a oração no fim:"
              fr: "Deux virgules isolent la proposition au milieu de la phrase, une seule celle qui est à la fin :"
              de: "Zwei Kommas schließen einen Nebensatz mitten im Satz ein, ein Komma einen Nebensatz am Ende:"
              it: "Due virgole isolano la proposizione in mezzo alla frase, una virgola quella alla fine:"
              pl: "Zdanie w środku wypowiedzenia oddzielamy dwoma przecinkami, a to na końcu — jednym:"
              tr: "Cümlenin ortasındaki yan cümle iki virgülle, sondaki yan cümle ise bir virgülle ayrılır:"
              id: "Klausa di tengah kalimat diapit dua koma, dan klausa di akhir kalimat didahului satu koma:"
              vi: "Mệnh đề ở giữa câu nằm giữa hai dấu phẩy, còn mệnh đề ở cuối câu chỉ có một dấu phẩy:"
            ex: { contrast: [["Мі́сто", { target: ", в яко́му я живу́," }, " ду́же га́рне."], ["Це друг", { target: ", з яки́м" }, " я працю́ю."]] }
            tr: { en: { contrast: ["The city I live in is very beautiful.", "This is the friend I work with."] }, es: { contrast: ["La ciudad en la que vivo es muy bonita.", "Este es el amigo con quien trabajo."] }, pt: { contrast: ["A cidade em que moro é muito bonita.", "Este é o amigo com quem trabalho."] }, fr: { contrast: ["La ville où j’habite est très belle.", "Voici l’ami avec qui je travaille."] }, de: { contrast: ["Die Stadt, in der ich wohne, ist sehr schön.", "Das ist der Freund, mit dem ich arbeite."] }, it: { contrast: ["La città in cui vivo è molto bella.", "Questo è l'amico con cui lavoro."] }, pl: { contrast: ["Miasto, w którym mieszkam, jest bardzo ładne.", "To jest przyjaciel, z którym pracuję."] }, tr: { contrast: ["Yaşadığım şehir çok güzel.", "Bu, birlikte çalıştığım arkadaş."] }, id: { contrast: ["Kota tempat saya tinggal sangat indah.", "Ini teman yang bekerja bersama saya."] }, vi: { contrast: ["Thành phố nơi tôi sống rất đẹp.", "Đây là người bạn mà tôi làm việc cùng."] } }

  - title: { uk: "Форма: який у відмінках", en: "Form: який in the cases", es: "Forma: який en los casos", pt: "Forma: який nos casos", fr: "Forme : який aux différents cas", de: "Form: який in den Kasus", it: "Forma: який nei casi", pl: "Forma: який w przypadkach", tr: "Biçim: який sözcüğünün hâlleri", id: "Bentuk: який dalam kasus-kasus", vi: "Dạng: các cách của який" }
