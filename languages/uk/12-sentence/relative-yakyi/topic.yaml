      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Середній рід має ", { term: яке́ }, " у називному й знахідному, а в інших відмінках — ті самі форми, що й чоловічий."]
              en: ["The neuter is ", { term: яке́ }, " in the nominative and accusative, and like the masculine in the other cases."]
              es: ["El neutro es ", { term: яке́ }, " en nominativo y acusativo, y como el masculino en los demás casos."]
              pt: ["O neutro é ", { term: яке́ }, " no nominativo e no acusativo, e igual ao masculino nos outros casos."]
              fr: ["Le neutre est ", { term: яке́ }, " au nominatif et à l’accusatif, et comme le masculin aux autres cas."]
              de: ["Das Neutrum lautet im Nominativ und Akkusativ ", { term: яке́ }, ", in den anderen Kasus wie das Maskulinum."]
              it: ["Il neutro è ", { term: яке́ }, " al nominativo e all'accusativo, e come il maschile negli altri casi."]
              pl: ["Rodzaj nijaki ma ", { term: яке́ }, " w mianowniku i bierniku, a w pozostałych przypadkach formy jak rodzaj męski."]
              tr: ["Nötr biçim yalın ve belirtme hâlinde ", { term: яке́ }, " olur; diğer hâllerde eril biçimle aynıdır."]
              id: ["Bentuk netral adalah ", { term: яке́ }, " dalam nominatif dan akusatif, dan sama dengan maskulin pada kasus lain."]
              vi: ["Giống trung là ", { term: яке́ }, " ở danh cách và đối cách, còn các cách khác giống với giống đực."]
            ex: ["Мі́сто, ", { target: яке́ }, " ми ба́чили, старе́."]
            tr: { en: "The town we saw is old.", es: "La ciudad que vimos es antigua.", pt: "A cidade que vimos é antiga.", fr: "La ville que nous avons vue est ancienne.", de: "Die Stadt, die wir gesehen haben, ist alt.", it: "La città che abbiamo visto è antica.", pl: "Miasto, które widzieliśmy, jest stare.", tr: "Gördüğümüz şehir eski.", id: "Kota yang kami lihat itu kuno.", vi: "Thị trấn chúng tôi đã thấy rất cổ kính." }
          - type: rule
            level: B1
            text:
              uk: ["У знахідному відмінку для людей і тварин: ", { term: яко́го }, ", ", { term: яки́х }, "; для речей: ", { term: яки́й }, ", ", { term: які́ }, "."]
              en: ["In the accusative, people and animals take ", { term: яко́го }, " and ", { term: яки́х }, "; things take ", { term: яки́й }, " and ", { term: які́ }, "."]
              es: ["En acusativo, las personas y los animales llevan ", { term: яко́го }, " y ", { term: яки́х }, "; las cosas, ", { term: яки́й }, " y ", { term: які́ }, "."]
              pt: ["No acusativo, pessoas e animais levam ", { term: яко́го }, " e ", { term: яки́х }, "; coisas levam ", { term: яки́й }, " e ", { term: які́ }, "."]
              fr: ["À l’accusatif, les personnes et les animaux prennent ", { term: яко́го }, " et ", { term: яки́х }, " ; les choses prennent ", { term: яки́й }, " et ", { term: які́ }, "."]
              de: ["Im Akkusativ stehen bei Personen und Tieren ", { term: яко́го }, " und ", { term: яки́х }, "; bei Sachen ", { term: яки́й }, " und ", { term: які́ }, "."]
              it: ["All'accusativo, persone e animali hanno ", { term: яко́го }, " e ", { term: яки́х }, "; le cose hanno ", { term: яки́й }, " e ", { term: які́ }, "."]
              pl: ["W bierniku osoby i zwierzęta mają ", { term: яко́го }, " i ", { term: яки́х }, "; rzeczy — ", { term: яки́й }, " i ", { term: які́ }, "."]
              tr: ["Belirtme hâlinde insanlar ve hayvanlar için ", { term: яко́го }, " ve ", { term: яки́х }, "; nesneler için ", { term: яки́й }, " ve ", { term: які́ }, " kullanılır."]
              id: ["Dalam akusatif, orang dan hewan memakai ", { term: яко́го }, " dan ", { term: яки́х }, "; benda memakai ", { term: яки́й }, " dan ", { term: які́ }, "."]
              vi: ["Ở đối cách, người và động vật dùng ", { term: яко́го }, " và ", { term: яки́х }, "; đồ vật dùng ", { term: яки́й }, " và ", { term: які́ }, "."]
            ex: { examples: [["Хло́пець, ", { target: яко́го }, " я чека́ю, ще не прийшо́в."], ["Буди́нок, ", { target: яки́й }, " ми купи́ли, вели́кий."]] }
            tr: { en: { examples: ["The boy I'm waiting for hasn't come yet.", "The house we bought is big."] }, es: { examples: ["El chico al que espero todavía no ha llegado.", "La casa que compramos es grande."] }, pt: { examples: ["O rapaz que estou esperando ainda não chegou.", "A casa que compramos é grande."] }, fr: { examples: ["Le garçon que j’attends n’est pas encore arrivé.", "La maison que nous avons achetée est grande."] }, de: { examples: ["Der Junge, auf den ich warte, ist noch nicht gekommen.", "Das Haus, das wir gekauft haben, ist groß."] }, it: { examples: ["Il ragazzo che aspetto non è ancora arrivato.", "La casa che abbiamo comprato è grande."] }, pl: { examples: ["Chłopiec, na którego czekam, jeszcze nie przyszedł.", "Dom, który kupiliśmy, jest duży."] }, tr: { examples: ["Beklediğim çocuk henüz gelmedi.", "Aldığımız ev büyük."] }, id: { examples: ["Anak laki-laki yang saya tunggu belum datang.", "Rumah yang kami beli itu besar."] }, vi: { examples: ["Cậu bé tôi đang đợi vẫn chưa đến.", "Ngôi nhà chúng tôi đã mua rất lớn."] } }

