            ex: ["Буди́нки, ", { target: які́ }, " стоя́ть на пло́щі Ри́нок, ду́же старі́."]
            tr: { en: "The buildings that stand on Market Square are very old.", es: "Los edificios que están en la plaza del Mercado son muy antiguos.", pt: "Os prédios que ficam na Praça do Mercado são muito antigos.", fr: "Les bâtiments qui se trouvent sur la place du Marché sont très anciens.", de: "Die Gebäude, die am Marktplatz stehen, sind sehr alt.", it: "Gli edifici che si trovano in Piazza del Mercato sono molto antichi.", pl: "Budynki, które stoją na Rynku, są bardzo stare.", tr: "Pazar Meydanı’nda duran binalar çok eski.", id: "Bangunan-bangunan yang berdiri di Alun-Alun Pasar itu sangat tua.", vi: "Những tòa nhà đứng trên quảng trường Chợ rất cổ." }
          - level: B1
            use: { uk: "додаток: знахідний", en: "object: the accusative", es: "objeto: el acusativo", pt: "objeto: o acusativo", fr: "complément d’objet : l’accusatif", de: "Objekt: der Akkusativ", it: "complemento oggetto: l'accusativo", pl: "dopełnienie: biernik", tr: "nesne: belirtme hâli", id: "objek: akusatif", vi: "tân ngữ: đối cách" }
            ex: ["Подару́нок, ", { target: яки́й }, " ти купи́в, мені́ ду́же подо́бається."]
            tr: { en: "I really like the present you bought.", es: "Me gusta mucho el regalo que compraste.", pt: "Eu gosto muito do presente que você comprou.", fr: "J’aime beaucoup le cadeau que tu as acheté.", de: "Das Geschenk, das du gekauft hast, gefällt mir sehr.", it: "Mi piace molto il regalo che hai comprato.", pl: "Bardzo podoba mi się prezent, który kupiłeś.", tr: "Aldığın hediye çok hoşuma gidiyor.", id: "Saya sangat suka hadiah yang kamu beli.", vi: "Tôi rất thích món quà bạn đã mua." }
          - level: B1
            use: { uk: "кому?: давальний", en: "to whom: the dative", es: "a quién: el dativo", pt: "a quem?: o dativo", fr: "à qui ?: le datif", de: "wem?: der Dativ", it: "a chi?: il dativo", pl: "komu?: celownik", tr: "kime?: yönelme hâli", id: "kepada siapa?: datif", vi: "cho ai?: tặng cách" }
            ex: ["Друг, ", { target: яко́му }, " я дзвоню́, живе́ в Ки́єві."]
            tr: { en: "The friend I'm calling lives in Kyiv.", es: "El amigo al que llamo vive en Kiev.", pt: "O amigo para quem estou ligando mora em Kyiv.", fr: "L’ami à qui je téléphone habite à Kyiv.", de: "Der Freund, den ich anrufe, wohnt in Kyjiw.", it: "L'amico a cui telefono vive a Kyiv.", pl: "Przyjaciel, do którego dzwonię, mieszka w Kijowie.", tr: "Aradığım arkadaş Kyiv’de yaşıyor.", id: "Teman yang saya telepon tinggal di Kyiv.", vi: "Người bạn mà tôi đang gọi điện sống ở Kyiv." }
          - level: B1
            use: { uk: "з ким?: орудний", en: "with whom: the instrumental", es: "con quién: el instrumental", pt: "com quem?: o instrumental", fr: "avec qui ?: l’instrumental", de: "mit wem?: der Instrumental", it: "con chi?: lo strumentale", pl: "z kim?: narzędnik", tr: "kiminle?: araç hâli", id: "dengan siapa?: instrumental", vi: "với ai?: công cụ cách" }
            ex: ["Це друг, ", { target: з яки́м }, " я працю́ю."]
            tr: { en: "This is the friend I work with.", es: "Este es el amigo con quien trabajo.", pt: "Este é o amigo com quem trabalho.", fr: "Voici l’ami avec qui je travaille.", de: "Das ist der Freund, mit dem ich arbeite.", it: "Questo è l'amico con cui lavoro.", pl: "To jest przyjaciel, z którym pracuję.", tr: "Bu, birlikte çalıştığım arkadaş.", id: "Ini teman yang bekerja bersama saya.", vi: "Đây là người bạn mà tôi làm việc cùng." }
          - level: B1
            use: { uk: "де?: місцевий", en: "where: the locative", es: "dónde: el locativo", pt: "onde?: o locativo", fr: "où ?: le locatif", de: "wo?: der Lokativ", it: "dove?: il locativo", pl: "gdzie?: miejscownik", tr: "nerede?: bulunma hâli", id: "di mana?: lokatif", vi: "ở đâu?: vị trí cách" }
            ex: ["Мі́сто, ", { target: в яко́му }, " я живу́, ду́же га́рне."]
            tr: { en: "The city I live in is very beautiful.", es: "La ciudad en la que vivo es muy bonita.", pt: "A cidade em que moro é muito bonita.", fr: "La ville où j’habite est très belle.", de: "Die Stadt, in der ich wohne, ist sehr schön.", it: "La città in cui vivo è molto bella.", pl: "Miasto, w którym mieszkam, jest bardzo ładne.", tr: "Yaşadığım şehir çok güzel.", id: "Kota tempat saya tinggal sangat indah.", vi: "Thành phố nơi tôi sống rất đẹp." }
          - level: C2
