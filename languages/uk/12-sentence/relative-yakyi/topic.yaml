            ex: ["Бі́ля шко́ли росте́ дуб, вік ", { target: яко́го }, " по́над три́ста ро́ків."]
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: ["У називному й знахідному замість ", { term: яки́й }, " іноді вживаємо ", { term: що }, ", який не змінюється: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              en: ["In the nominative and accusative, ", { term: що }, " sometimes replaces ", { term: яки́й }, " and never changes: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              es: ["En nominativo y acusativo, ", { term: що }, " a veces sustituye a ", { term: яки́й }, " y no cambia: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              pt: ["No nominativo e no acusativo, ", { term: що }, " às vezes substitui ", { term: яки́й }, " e não muda: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              fr: ["Au nominatif et à l’accusatif, ", { term: що }, " remplace parfois ", { term: яки́й }, " et ne change pas : ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              de: ["Im Nominativ und Akkusativ ersetzt ", { term: що }, " manchmal ", { term: яки́й }, " und bleibt unverändert: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              it: ["Al nominativo e all'accusativo, ", { term: що }, " a volte sostituisce ", { term: яки́й }, " e non cambia: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              pl: ["W mianowniku i bierniku ", { term: що }, " czasem zastępuje ", { term: яки́й }, " i się nie zmienia: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              tr: ["Yalın ve belirtme hâlinde ", { term: що }, " bazen ", { term: яки́й }, " yerine geçer ve hiç değişmez: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              id: ["Dalam nominatif dan akusatif, ", { term: що }, " kadang menggantikan ", { term: яки́й }, " dan tidak pernah berubah: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
              vi: ["Ở danh cách và đối cách, ", { term: що }, " đôi khi thay cho ", { term: яки́й }, " và không bao giờ biến đổi: ", { term: "Кни́жка, що лежи́ть на столі́" }, "."]
          - type: note
            level: B1
            text:
              uk: ["Так само змінюється ", { term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, "), але в означальних реченнях його вживаємо рідше, ніж ", { term: яки́й }, "."]
              en: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") changes in the same way, but relative clauses use it less often than ", { term: яки́й }, "."]
              es: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") cambia igual, pero en las oraciones de relativo se usa menos que ", { term: яки́й }, "."]
              pt: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") muda do mesmo modo, mas as orações relativas o usam menos que ", { term: яки́й }, "."]
              fr: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") se décline de la même façon, mais les propositions relatives l’emploient moins souvent que ", { term: яки́й }, "."]
              de: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") verändert sich genauso, kommt in Relativsätzen aber seltener vor als ", { term: яки́й }, "."]
              it: [{ term: котри́й }, " (", { term: котра́ }, ", ", { term: котре́ }, ") cambia allo stesso modo, ma nelle proposizioni relative si usa meno di ", { term: яки́й }, "."]
