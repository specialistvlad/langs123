              tr: [{ term: А }, " yalnızca iki farklı olguyu yan yana koyar; ", { term: але́ }, " ise ikincisinin birincisine ters düştüğünü söyler."]
              id: [{ term: А }, " hanya menjajarkan dua fakta; ", { term: але́ }, " menyatakan bahwa fakta kedua bertentangan dengan yang pertama."]
              vi: [{ term: А }, " chỉ đặt hai sự việc cạnh nhau; ", { term: але́ }, " cho biết sự việc thứ hai trái với sự việc thứ nhất."]

