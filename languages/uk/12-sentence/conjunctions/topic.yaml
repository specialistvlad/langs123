            ex: ["Оле́на зателефонува́ла Ві́кторові, ", { target: але́ }, " він не відпові́в."]
            tr: { en: "Olena called Viktor, but he didn't answer.", es: "Olena llamó a Viktor, pero él no contestó.", pt: "Olena ligou para Viktor, mas ele não atendeu.", fr: "Olena a téléphoné à Viktor, mais il n’a pas répondu.", de: "Olena hat Viktor angerufen, aber er hat nicht geantwortet.", it: "Olena ha telefonato a Viktor, ma lui non ha risposto.", pl: "Ołena zadzwoniła do Wiktora, ale on nie odpowiedział.", tr: "Olena Viktor’u aradı ama o cevap vermedi.", id: "Olena menelepon Viktor, tetapi dia tidak menjawab.", vi: "Olena gọi điện cho Viktor, nhưng anh ấy không trả lời." }
          - level: B1
            use: { uk: [{ term: а }, ": зіставлення"], en: [{ term: а }, ": whereas, setting two things side by side"], es: [{ term: а }, ": mientras que, comparando dos cosas"], pt: [{ term: а }, ": enquanto, comparando duas coisas"], fr: [{ term: а }, " : alors que, pour comparer deux choses"], de: [{ term: а }, ": während, zwei Dinge einander gegenüberstellend"], it: [{ term: а }, ": mentre, per confrontare due cose"], pl: [{ term: а }, ": natomiast, zestawienie dwóch rzeczy"], tr: [{ term: а }, ": ise, iki şeyi karşılaştırır"], id: [{ term: а }, ": sedangkan, membandingkan dua hal"], vi: [{ term: а }, ": còn, đặt hai điều cạnh nhau"] }
            ex: ["Зазвича́й я ї́жджу на мо́ре, ", { target: а }, " моя́ по́друга ї́здить у го́ри."]
            tr: { en: "I usually go to the seaside, whereas my friend goes to the mountains.", es: "Normalmente voy al mar, mientras que mi amiga va a la montaña.", pt: "Normalmente eu vou para o mar, enquanto minha amiga vai para as montanhas.", fr: "En général, je vais à la mer, alors que mon amie va à la montagne.", de: "Normalerweise fahre ich ans Meer, meine Freundin dagegen fährt in die Berge.", it: "Di solito io vado al mare, mentre la mia amica va in montagna.", pl: "Zwykle jeżdżę nad morze, a moja koleżanka jeździ w góry.", tr: "Genellikle ben denize giderim, arkadaşım ise dağlara gider.", id: "Biasanya saya pergi ke pantai, sedangkan teman perempuan saya pergi ke gunung.", vi: "Thường thì tôi đi biển, còn bạn gái tôi đi núi." }
      - type: list
