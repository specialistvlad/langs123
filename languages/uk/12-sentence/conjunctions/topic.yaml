            ex: ["У сі́чні було́ хо́лодно ", { target: та }, " ча́сто дув ві́тер."]
            tr: { en: "In January it was cold, and the wind often blew.", es: "En enero hacía frío y a menudo soplaba el viento.", pt: "Em janeiro fazia frio e muitas vezes ventava.", fr: "En janvier, il faisait froid et le vent soufflait souvent.", de: "Im Januar war es kalt, und oft wehte der Wind.", it: "A gennaio faceva freddo e spesso soffiava il vento.", pl: "W styczniu było zimno i często wiał wiatr.", tr: "Ocak ayında hava soğuktu ve sık sık rüzgâr esiyordu.", id: "Pada bulan Januari cuaca dingin dan sering berangin.", vi: "Tháng Giêng trời lạnh và gió thổi thường xuyên." }
