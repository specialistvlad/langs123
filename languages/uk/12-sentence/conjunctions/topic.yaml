sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Сполучник поєднує однорідні слова або частини складного речення."
              en: "A conjunction joins words of the same kind or the clauses of a sentence."
              es: "Un conector une palabras del mismo tipo o las oraciones de una frase."
              pt: "A conjunção une palavras da mesma função ou as orações de uma frase."
              fr: "La conjonction relie des mots de même fonction ou les propositions d’une phrase."
              de: "Eine Konjunktion verbindet gleichartige Wörter oder die Teilsätze eines Satzes."
              it: "La congiunzione unisce parole della stessa funzione o le proposizioni di una frase."
              pl: "Spójnik łączy jednorodne wyrazy albo części zdania złożonego."
              tr: "Bağlaç, aynı görevdeki sözcükleri ya da bir cümlenin yan yana gelen cümlelerini birbirine bağlar."
              id: "Konjungsi menghubungkan kata yang setara atau klausa dalam sebuah kalimat."
              vi: "Liên từ nối các từ cùng loại hoặc các mệnh đề trong một câu."
            ex: ["Ми сі́ли в кафе́", { target: ", і" }, " офіціа́нт прині́с меню́."]
            tr: { en: "We sat down in the café, and the waiter brought the menu.", es: "Nos sentamos en el café y el camarero trajo la carta.", pt: "Nós nos sentamos no café, e o garçom trouxe o cardápio.", fr: "Nous nous sommes assis au café, et le serveur a apporté la carte.", de: "Wir haben uns ins Café gesetzt, und der Kellner hat die Speisekarte gebracht.", it: "Ci siamo seduti al bar, e il cameriere ha portato il menù.", pl: "Usiedliśmy w kawiarni i kelner przyniósł kartę.", tr: "Kafeye oturduk ve garson menüyü getirdi.", id: "Kami duduk di kafe, dan pelayan membawakan menu.", vi: "Chúng tôi ngồi xuống quán cà phê, và người phục vụ mang thực đơn đến." }
          - type: rule
            level: A1
            text:
              uk: ["Між частинами речення перед сполучником ставимо кому: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", а також ", { term: і }, ", коли кожна частина має свій підмет."]
              en: ["A comma goes before the conjunction between clauses: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", and ", { term: і }, " when each clause has its own subject."]
              es: ["Entre oraciones va una coma delante del conector: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", y ", { term: і }, " cuando cada oración tiene su propio sujeto."]
              pt: ["Entre as orações, a vírgula vem antes da conjunção: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, " e também ", { term: і }, ", quando cada oração tem seu próprio sujeito."]
              fr: ["Entre deux propositions, la virgule précède la conjonction : ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", et aussi ", { term: і }, " quand chaque proposition a son propre sujet."]
              de: ["Zwischen den Teilsätzen steht das Komma vor der Konjunktion: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, " und auch vor ", { term: і }, ", wenn jeder Teilsatz sein eigenes Subjekt hat."]
              it: ["Tra le proposizioni la virgola precede la congiunzione: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, " e anche ", { term: і }, " quando ogni proposizione ha un soggetto proprio."]
              pl: ["Między częściami zdania przecinek stawiamy przed spójnikiem: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, " oraz przed ", { term: і }, ", gdy każda część ma własny podmiot."]
              tr: ["Cümleler arasında bağlaçtan önce virgül konur: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, "; her cümlenin kendi öznesi varsa ", { term: і }, " öncesinde de konur."]
              id: ["Di antara klausa, koma diletakkan sebelum konjungsi: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", dan juga ", { term: і }, " jika tiap klausa punya subjeknya sendiri."]
              vi: ["Giữa các mệnh đề, dấu phẩy đứng trước liên từ: ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, ", và cả ", { term: і }, " khi mỗi mệnh đề có chủ ngữ riêng."]
          - type: note
            level: A1
            text:
              uk: [{ term: Й }, " стоїть між голосними, ", { term: і }, " — між приголосними. Див. ", { link: "Милозвучність", to: uk.foundations.euphony }, "."]
              en: [{ term: Й }, " goes between vowels, ", { term: і }, " between consonants. See ", { link: "у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              es: [{ term: Й }, " va entre vocales, ", { term: і }, " entre consonantes. Ver ", { link: "La eufonía", to: uk.foundations.euphony }, "."]
              pt: [{ term: Й }, " vem entre vogais e ", { term: і }, " entre consoantes. Veja ", { link: "Eufonia", to: uk.foundations.euphony }, "."]
              fr: [{ term: Й }, " se met entre des voyelles, ", { term: і }, " entre des consonnes. Voir ", { link: "L’euphonie", to: uk.foundations.euphony }, "."]
              de: [{ term: Й }, " steht zwischen Vokalen, ", { term: і }, " zwischen Konsonanten. Siehe ", { link: "Euphonie", to: uk.foundations.euphony }, "."]
              it: [{ term: Й }, " sta tra vocali, ", { term: і }, " tra consonanti. Vedi ", { link: "L'eufonia", to: uk.foundations.euphony }, "."]
              pl: [{ term: Й }, " stoi między samogłoskami, ", { term: і }, " — między spółgłoskami. Zob. ", { link: "Eufonia", to: uk.foundations.euphony }, "."]
              tr: [{ term: Й }, " ünlüler arasında, ", { term: і }, " ünsüzler arasında kullanılır. Bkz. ", { link: "Ses ahengi", to: uk.foundations.euphony }, "."]
              id: [{ term: Й }, " dipakai di antara vokal, ", { term: і }, " di antara konsonan. Lihat ", { link: "Eufoni", to: uk.foundations.euphony }, "."]
              vi: [{ term: Й }, " đứng giữa các nguyên âm, ", { term: і }, " đứng giữa các phụ âm. Xem ", { link: "Tính êm tai", to: uk.foundations.euphony }, "."]

