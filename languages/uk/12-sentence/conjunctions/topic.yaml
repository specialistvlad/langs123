              en: "The items of a list answer the same question and depend on the same word."
              es: "Los elementos de una enumeración responden a la misma pregunta y dependen de la misma palabra."
              pt: "Os itens de uma enumeração respondem à mesma pergunta e dependem da mesma palavra."
              fr: "Les éléments d’une énumération répondent à la même question et dépendent du même mot."
              de: "Die Glieder einer Aufzählung beantworten dieselbe Frage und hängen vom selben Wort ab."
              it: "Gli elementi di un elenco rispondono alla stessa domanda e dipendono dalla stessa parola."
              pl: "Elementy wyliczenia odpowiadają na to samo pytanie i zależą od tego samego wyrazu."
              tr: "Bir sıralamanın öğeleri aynı soruya cevap verir ve aynı sözcüğe bağlıdır."
              id: "Unsur-unsur dalam rincian menjawab pertanyaan yang sama dan bergantung pada kata yang sama."
              vi: "Các thành phần trong phần liệt kê trả lời cùng một câu hỏi và phụ thuộc vào cùng một từ."
          - type: rule
            level: B1
            text:
              uk: "Вставне слово показує, наскільки мовець упевнений; без нього речення не втрачає змісту."
              en: "An introductory word shows how sure the speaker is; the sentence keeps its meaning without it."
              es: "La palabra incidental muestra cuán seguro está quien habla; la oración no pierde su sentido sin ella."
              pt: "A palavra intercalada mostra o quanto o falante tem certeza; sem ela, a frase mantém o sentido."
              fr: "Le mot incident montre le degré de certitude de celui qui parle ; sans lui, la phrase garde son sens."
              de: "Ein Einschubwort zeigt, wie sicher sich der Sprecher ist; ohne es behält der Satz seinen Sinn."
              it: "La parola incidentale mostra quanto è sicuro chi parla; senza di essa la frase non perde il suo senso."
              pl: "Wtrącenie pokazuje, jak pewny jest mówiący; bez niego zdanie nie traci sensu."
              tr: "Ara söz, konuşanın ne kadar emin olduğunu gösterir; o olmadan da cümle anlamını yitirmez."
              id: "Kata penyela menunjukkan seberapa yakin penutur; tanpa kata itu, kalimat tetap bermakna."
              vi: "Từ chêm xen cho thấy người nói chắc chắn đến đâu; bỏ nó đi, câu vẫn giữ nguyên nghĩa."

