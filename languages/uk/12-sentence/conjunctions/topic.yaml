title: { uk: Сполучники, en: Conjunctions, es: Los conectores, pt: "Conjunções", fr: "Les conjonctions", de: "Konjunktionen", it: "Le congiunzioni", pl: "Spójniki", tr: "Bağlaçlar", id: "Konjungsi", vi: "Liên từ" }
summary:
  lead:
    uk: ["Сполучники ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, ", ", { term: тому́ що }, " поєднують слова й частини речення; перед ", { term: але́ }, ", ", { term: бо }, " і ", { term: тому́ що }, " ставимо кому."]
    en: ["The conjunctions ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " and ", { term: тому́ що }, " join words and clauses; a comma goes before ", { term: але́ }, ", ", { term: бо }, " and ", { term: тому́ що }, "."]
    es: ["Los conectores ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " y ", { term: тому́ що }, " unen palabras y oraciones; delante de ", { term: але́ }, ", ", { term: бо }, " y ", { term: тому́ що }, " va coma."]
    pt: ["As conjunções ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " e ", { term: тому́ що }, " unem palavras e orações; antes de ", { term: але́ }, ", ", { term: бо }, " e ", { term: тому́ що }, " vai vírgula."]
    fr: ["Les conjonctions ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " et ", { term: тому́ що }, " relient des mots et des propositions ; une virgule précède ", { term: але́ }, ", ", { term: бо }, " et ", { term: тому́ що }, "."]
    de: ["Die Konjunktionen ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " und ", { term: тому́ що }, " verbinden Wörter und Teilsätze; vor ", { term: але́ }, ", ", { term: бо }, " und ", { term: тому́ що }, " steht ein Komma."]
    it: ["Le congiunzioni ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " e ", { term: тому́ що }, " uniscono parole e proposizioni; prima di ", { term: але́ }, ", ", { term: бо }, " e ", { term: тому́ що }, " va una virgola."]
    pl: ["Spójniki ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " i ", { term: тому́ що }, " łączą wyrazy i części zdania; przed ", { term: але́ }, ", ", { term: бо }, " i ", { term: тому́ що }, " stawiamy przecinek."]
    tr: ["Bağlaçlar ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " ve ", { term: тому́ що }, " sözcükleri ve cümleleri birbirine bağlar; ", { term: але́ }, ", ", { term: бо }, " ve ", { term: тому́ що }, " bağlaçlarından önce virgül konur."]
    id: ["Konjungsi ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, ", dan ", { term: тому́ що }, " menghubungkan kata dan klausa; koma diletakkan sebelum ", { term: але́ }, ", ", { term: бо }, ", dan ", { term: тому́ що }, "."]
    vi: ["Các liên từ ", { term: і }, ", ", { term: але́ }, ", ", { term: бо }, " và ", { term: тому́ що }, " nối các từ và các mệnh đề; dấu phẩy đứng trước ", { term: але́ }, ", ", { term: бо }, " và ", { term: тому́ що }, "."]
  rule:
    uk: "Між двома частинами складного речення перед сполучником ставимо кому:"
    en: "A comma goes before the conjunction that joins two clauses:"
    es: "Delante del conector que une dos oraciones va una coma:"
    pt: "Antes da conjunção que une duas orações, vai uma vírgula:"
    fr: "Une virgule précède la conjonction qui relie deux propositions :"
    de: "Vor der Konjunktion, die zwei Teilsätze verbindet, steht ein Komma:"
    it: "Prima della congiunzione che unisce due proposizioni va una virgola:"
    pl: "Przed spójnikiem łączącym dwie części zdania stawiamy przecinek:"
    tr: "İki cümleyi birbirine bağlayan bağlaçtan önce virgül konur:"
    id: "Koma diletakkan sebelum konjungsi yang menghubungkan dua klausa:"
    vi: "Dấu phẩy đứng trước liên từ nối hai mệnh đề:"
  ex: ["Ми не гуля́ємо", { target: ", бо" }, " хо́лодно."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Сполучник, en: Conjunction, es: Conector, pt: "Conjunção", fr: "Conjonction", de: "Konjunktion", it: "Congiunzione", pl: "Spójnik", tr: "Bağlaç", id: "Konjungsi", vi: "Liên từ" } }
        - { key: rule, label: { uk: Значення, en: Meaning, es: Significado, pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: A1
          point: { alternatives: [і, й] }
          rule:
            uk: "поєднання"
            en: "and"
            es: "y"
            pt: "e"
            fr: "et"
            de: "und"
            it: "e"
            pl: "i"
            tr: "ve"
            id: "dan"
            vi: "và"
          ex: ["Полта́ва ", { target: й }, " Оде́са."]
          tr: { en: "Poltava and Odesa.", es: "Poltava y Odesa.", pt: "Poltava e Odesa.", fr: "Poltava et Odesa.", de: "Poltawa und Odesa.", it: "Poltava e Odesa.", pl: "Połtawa i Odessa.", tr: "Poltava ve Odesa.", id: "Poltava dan Odesa.", vi: "Poltava và Odessa." }
        - level: A2
          point: та
          rule:
            uk: [{ term: та }, " у значенні ", { term: і }]
            en: ["the same as ", { term: і }]
            es: ["lo mismo que ", { term: і }]
            pt: [{ term: та }, " com o sentido de ", { term: і }]
            fr: [{ term: та }, " au sens de ", { term: і }]
            de: [{ term: та }, " in der Bedeutung von ", { term: і }]
            it: [{ term: та }, " con il significato di ", { term: і }]
            pl: [{ term: та }, " w znaczeniu ", { term: і }]
            tr: [{ term: та }, ", ", { term: і }, " ile aynı anlamdadır"]
            id: [{ term: та }, " dalam arti ", { term: і }]
            vi: [{ term: та }, " với nghĩa như ", { term: і }]
          ex: ["Купи́ хліб ", { target: та }, " молоко́."]
          tr: { en: "Buy bread and milk.", es: "Compra pan y leche.", pt: "Compre pão e leite.", fr: "Achète du pain et du lait.", de: "Kauf Brot und Milch.", it: "Compra pane e latte.", pl: "Kup chleb i mleko.", tr: "Ekmek ve süt al.", id: "Belilah roti dan susu.", vi: "Mua bánh mì và sữa đi." }
        - level: A1
          point: але́
          rule:
            uk: "протиставлення"
            en: "but"
            es: "pero"
            pt: "mas"
            fr: "mais"
            de: "aber"
            it: "ma"
            pl: "ale"
            tr: "ama"
            id: "tetapi"
            vi: "nhưng"
          ex: ["Я зателефонува́в, ", { target: але́ }, " ніхто́ не відпові́в."]
          tr: { en: "I called, but nobody answered.", es: "Llamé, pero nadie contestó.", pt: "Eu liguei, mas ninguém atendeu.", fr: "J’ai téléphoné, mais personne n’a répondu.", de: "Ich habe angerufen, aber niemand hat geantwortet.", it: "Ho telefonato, ma nessuno ha risposto.", pl: "Zadzwoniłem, ale nikt nie odpowiedział.", tr: "Aradım ama kimse cevap vermedi.", id: "Saya menelepon, tetapi tidak ada yang menjawab.", vi: "Tôi đã gọi điện, nhưng không ai trả lời." }
        - level: A1
          point: { alternatives: [бо, тому́ що] }
          rule:
            uk: "причина"
            en: "because"
            es: "porque"
            pt: "porque"
            fr: "parce que"
            de: "weil"
            it: "perché"
            pl: "ponieważ, bo"
            tr: "çünkü"
            id: "karena"
            vi: "vì"
          ex: ["Ві́ктор не при́йде, ", { target: бо }, " він хво́рий."]
          tr: { en: "Viktor isn't coming because he's ill.", es: "Viktor no viene porque está enfermo.", pt: "Viktor não vem porque está doente.", fr: "Viktor ne vient pas parce qu’il est malade.", de: "Viktor kommt nicht, weil er krank ist.", it: "Viktor non viene perché è malato.", pl: "Wiktor nie przyjdzie, bo jest chory.", tr: "Viktor gelmeyecek çünkü hasta.", id: "Viktor tidak datang karena dia sakit.", vi: "Viktor sẽ không đến vì anh ấy bị ốm." }
        - level: B1
          point: а
          rule:
            uk: "зіставлення двох різних осіб чи речей"
            en: "whereas: two people or things set side by side"
            es: "mientras que: dos personas o cosas comparadas"
            pt: "enquanto: duas pessoas ou coisas comparadas"
            fr: "alors que : deux personnes ou choses comparées"
            de: "während: zwei Personen oder Dinge im Vergleich"
            it: "mentre: due persone o cose messe a confronto"
            pl: "natomiast: dwie osoby lub rzeczy zestawione ze sobą"
            tr: "ise: iki kişi ya da şey karşılaştırılır"
            id: "sedangkan: dua orang atau benda dibandingkan"
            vi: "còn: so sánh hai người hoặc hai vật"
          ex: ["Я п’ю ка́ву, ", { target: а }, " сестра́ п’є чай."]
          tr: { en: "I drink coffee, and my sister drinks tea.", es: "Yo tomo café, y mi hermana, té.", pt: "Eu tomo café, e minha irmã toma chá.", fr: "Je bois du café, et ma sœur du thé.", de: "Ich trinke Kaffee, meine Schwester dagegen Tee.", it: "Io bevo caffè, mentre mia sorella beve tè.", pl: "Ja piję kawę, a siostra pije herbatę.", tr: "Ben kahve içiyorum, kız kardeşim ise çay içiyor.", id: "Saya minum kopi, sedangkan saudara perempuan saya minum teh.", vi: "Tôi uống cà phê, còn chị gái tôi uống trà." }
        - level: B1
          point: { alternatives: [або́, ["або́ ", { gap: true }, " або́"]] }
          rule:
            uk: "вибір"
            en: "or; either… or"
            es: "o; o… o"
            pt: "ou; ou… ou"
            fr: "ou ; soit… soit"
            de: "oder; entweder… oder"
            it: "o; o… o"
            pl: "albo, lub; albo… albo"
            tr: "veya; ya… ya da"
            id: "atau; atau… atau"
            vi: "hoặc; hoặc… hoặc"
          ex: [{ target: Або́ }, " ви завіта́єте до нас, ", { target: або́ }, " ми заї́демо до вас."]
          tr: { en: "Either you'll come over to ours, or we'll drop in on you.", es: "O vienen ustedes a vernos, o pasamos nosotros a verlos.", pt: "Ou vocês vêm nos visitar, ou nós passamos na casa de vocês.", fr: "Ou bien vous venez chez nous, ou bien nous passons chez vous.", de: "Entweder besuchen Sie uns, oder wir schauen bei Ihnen vorbei.", it: "O venite voi da noi, o passiamo noi da voi.", pl: "Albo wy do nas zajrzycie, albo my wpadniemy do was.", tr: "Ya siz bize uğrarsınız ya da biz size uğrarız.", id: "Anda yang berkunjung ke tempat kami, atau kami yang mampir ke tempat Anda.", vi: "Hoặc các bạn đến thăm chúng tôi, hoặc chúng tôi ghé thăm các bạn." }
        - level: B1
          point: { alternatives: [хоч, незважа́ючи на те що] }
          rule:
            uk: "попри щось"
            en: "although, despite"
            es: "aunque, a pesar de que"
            pt: "embora, apesar de que"
            fr: "bien que, malgré le fait que"
            de: "obwohl, trotz der Tatsache, dass"
            it: "benché, nonostante il fatto che"
            pl: "chociaż, mimo że"
            tr: "her ne kadar, -e rağmen"
            id: "meskipun, walaupun"
            vi: "mặc dù, dù"
          ex: [{ target: Хоч }, " було́ пі́зно, ми пішли́ в кіно́."]
          tr: { en: "Although it was late, we went to the cinema.", es: "Aunque era tarde, fuimos al cine.", pt: "Embora fosse tarde, fomos ao cinema.", fr: "Bien qu’il soit tard, nous sommes allés au cinéma.", de: "Obwohl es spät war, sind wir ins Kino gegangen.", it: "Benché fosse tardi, siamo andati al cinema.", pl: "Chociaż było późno, poszliśmy do kina.", tr: "Geç olmasına rağmen sinemaya gittik.", id: "Meskipun sudah malam, kami pergi ke bioskop.", vi: "Mặc dù đã muộn, chúng tôi vẫn đi xem phim." }
        - level: B1
          point: { uk: Вставні слова, en: Introductory words, es: Palabras incidentales, pt: "Palavras intercaladas", fr: "Mots incidents", de: "Einschubwörter", it: "Parole incidentali", pl: "Wtrącenia", tr: "Ara sözler", id: "Kata penyela", vi: "Từ chêm xen" }
          rule:
            uk: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, ": виділяємо комами"]
            en: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (probably, maybe, it seems): set off by commas"]
            es: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (probablemente, quizás, parece): van entre comas"]
            pt: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (provavelmente, talvez, parece): ficam entre vírgulas"]
            fr: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (probablement, peut-être, il semble) : elles s’isolent par des virgules"]
            de: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (wahrscheinlich, vielleicht, anscheinend): werden durch Kommas abgetrennt"]
            it: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (probabilmente, forse, sembra): stanno tra virgole"]
            pl: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (prawdopodobnie, być może, wydaje się): oddzielamy przecinkami"]
            tr: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (herhalde, belki, galiba): virgülle ayrılır"]
            id: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (mungkin, barangkali, tampaknya): diapit koma"]
            vi: [{ alternatives: [{ term: мабу́ть }, { term: можли́во }, { term: здає́ться }] }, " (có lẽ, có thể, hình như): được ngăn bằng dấu phẩy"]
          ex: ["Він", { target: ", мабу́ть," }, " запізни́ться."]
          tr: { en: "He'll probably be late.", es: "Probablemente llegue tarde.", pt: "Ele provavelmente vai se atrasar.", fr: "Il sera probablement en retard.", de: "Er kommt wahrscheinlich zu spät.", it: "Probabilmente farà tardi.", pl: "Pewnie się spóźni.", tr: "Muhtemelen geç kalacak.", id: "Dia mungkin akan terlambat.", vi: "Có lẽ anh ấy sẽ đến muộn." }
        - level: B2
          point: { uk: "Узагальнювальне слово", en: "Generalising word", es: "Palabra generalizadora", pt: "Palavra generalizadora", fr: "Mot généralisateur", de: "Verallgemeinerndes Wort", it: "Parola generalizzante", pl: "Wyraz uogólniający", tr: "Genelleyici sözcük", id: "Kata perangkum", vi: "Từ khái quát" }
          rule: { uk: "тире чи двокрапка перед переліком, тире після нього", en: "a dash or a colon before the list, a dash after it", es: "raya o dos puntos antes de la enumeración, raya después de ella", pt: "travessão ou dois-pontos antes da enumeração, travessão depois dela", fr: "tiret ou deux-points avant l’énumération, tiret après elle", de: "Gedankenstrich oder Doppelpunkt vor der Aufzählung, Gedankenstrich danach", it: "trattino o due punti prima dell'elenco, trattino dopo di esso", pl: "myślnik lub dwukropek przed wyliczeniem, myślnik po nim", tr: "sıralamadan önce tire ya da iki nokta, sıralamadan sonra tire", id: "tanda pisah atau tanda titik dua sebelum rincian, tanda pisah sesudahnya", vi: "dấu gạch ngang hoặc dấu hai chấm trước phần liệt kê, dấu gạch ngang sau đó" }
          ex: ["Усе́ в кімна́ті ", { target: "—" }, " стіл, крі́сло, ша́фа ", { target: "—" }, " було́ нове́."]
          tr: { en: "Everything in the room — a table, an armchair, a wardrobe — was new.", es: "Todo en la habitación —una mesa, un sillón, un armario— era nuevo.", pt: "Tudo no quarto — uma mesa, uma poltrona, um armário — era novo.", fr: "Tout dans la pièce — une table, un fauteuil, une armoire — était neuf.", de: "Alles im Zimmer — ein Tisch, ein Sessel, ein Schrank — war neu.", it: "Tutto nella stanza — un tavolo, una poltrona, un armadio — era nuovo.", pl: "Wszystko w pokoju — stół, fotel, szafa — było nowe.", tr: "Odadaki her şey — masa, koltuk, dolap — yeniydi.", id: "Semua barang di kamar itu — meja, kursi, lemari — baru.", vi: "Mọi thứ trong phòng — bàn, ghế bành, tủ — đều mới." }
        - level: C1
          point: { uk: "Зв’язки між частинами", en: "Links between clauses", es: "Relaciones entre oraciones", pt: "Relações entre orações", fr: "Liens entre propositions", de: "Verbindungen zwischen Teilsätzen", it: "Legami tra proposizioni", pl: "Związki między częściami zdania", tr: "Cümleler arası bağlantılar", id: "Hubungan antarklausa", vi: "Quan hệ giữa các mệnh đề" }
          rule: { uk: "єднальний, протиставний, розділовий, приєднувальний", en: "additive, adversative, disjunctive, connective", es: "copulativo, adversativo, disyuntivo, aditivo", pt: "aditivo, adversativo, alternativo, de acréscimo", fr: "copulatif, adversatif, disjonctif, d’adjonction", de: "kopulativ, adversativ, disjunktiv, anknüpfend", it: "copulativo, avversativo, disgiuntivo, aggiuntivo", pl: "łączny, przeciwstawny, rozłączny, dołączający", tr: "ekleme, karşıtlık, seçenek, ek bilgi", id: "penambahan, pertentangan, pilihan, tambahan", vi: "cộng gộp, đối lập, lựa chọn, bổ sung" }
          ex: ["Дощ переста́в", { target: ", і" }, " ви́йшло со́нце."]
          tr: { en: "The rain stopped, and the sun came out.", es: "Dejó de llover y salió el sol.", pt: "A chuva parou, e o sol apareceu.", fr: "La pluie s’est arrêtée, et le soleil est sorti.", de: "Der Regen hörte auf, und die Sonne kam heraus.", it: "La pioggia è smessa, e il sole è uscito.", pl: "Deszcz przestał padać i wyszło słońce.", tr: "Yağmur durdu ve güneş çıktı.", id: "Hujan berhenti, dan matahari pun muncul.", vi: "Mưa tạnh, và mặt trời ló ra." }
        - level: C2
          point: { alternatives: [проте́, зате́, одна́к] }
