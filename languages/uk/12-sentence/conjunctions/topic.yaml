            ex: ["Він ви́вчив усе́", { target: ":" }, " грама́тику, ле́ксику, вимо́ву."]
            tr: { en: "He has learned everything: grammar, vocabulary, pronunciation.", es: "Aprendió todo: gramática, vocabulario, pronunciación.", pt: "Ele aprendeu tudo: gramática, vocabulário, pronúncia.", fr: "Il a tout appris : la grammaire, le vocabulaire, la prononciation.", de: "Er hat alles gelernt: Grammatik, Wortschatz, Aussprache.", it: "Ha imparato tutto: grammatica, lessico, pronuncia.", pl: "Nauczył się wszystkiego: gramatyki, słownictwa, wymowy.", tr: "Her şeyi öğrendi: dilbilgisi, kelime bilgisi, telaffuz.", id: "Dia sudah mempelajari semuanya: tata bahasa, kosakata, pelafalan.", vi: "Anh ấy đã học tất cả: ngữ pháp, từ vựng, phát âm." }
          - level: B2
            use: { uk: "речення триває після переліку: тире чи двокрапка перед переліком, тире після нього", en: "the sentence goes on after the list: a dash or a colon before the list, a dash after it", es: "la oración sigue tras la enumeración: raya o dos puntos antes de ella, raya después", pt: "a frase continua depois da enumeração: travessão ou dois-pontos antes dela, travessão depois", fr: "la phrase continue après l’énumération : tiret ou deux-points avant elle, tiret après", de: "der Satz geht nach der Aufzählung weiter: Gedankenstrich oder Doppelpunkt davor, Gedankenstrich danach", it: "la frase continua dopo l'elenco: trattino o due punti prima, trattino dopo", pl: "zdanie toczy się dalej po wyliczeniu: myślnik lub dwukropek przed nim, myślnik po nim", tr: "cümle sıralamadan sonra sürer: sıralamadan önce tire ya da iki nokta, sonra tire", id: "kalimat berlanjut setelah rincian: tanda pisah atau tanda titik dua sebelum rincian, tanda pisah sesudahnya", vi: "câu còn tiếp tục sau phần liệt kê: dấu gạch ngang hoặc dấu hai chấm trước đó, dấu gạch ngang sau đó" }
            ex: ["Усе́ в кімна́ті ", { target: "—" }, " стіл, крі́сло, ша́фа ", { target: "—" }, " було́ нове́."]
            tr: { en: "Everything in the room — a table, an armchair, a wardrobe — was new.", es: "Todo en la habitación —una mesa, un sillón, un armario— era nuevo.", pt: "Tudo no quarto — uma mesa, uma poltrona, um armário — era novo.", fr: "Tout dans la pièce — une table, un fauteuil, une armoire — était neuf.", de: "Alles im Zimmer — ein Tisch, ein Sessel, ein Schrank — war neu.", it: "Tutto nella stanza — un tavolo, una poltrona, un armadio — era nuovo.", pl: "Wszystko w pokoju — stół, fotel, szafa — było nowe.", tr: "Odadaki her şey — masa, koltuk, dolap — yeniydi.", id: "Semua barang di kamar itu — meja, kursi, lemari — baru.", vi: "Mọi thứ trong phòng — bàn, ghế bành, tủ — đều mới." }
          - level: B2
            use: { uk: "узагальнювальне слово після переліку: тире перед ним", en: "a generalising word after a list: a dash before it", es: "palabra generalizadora tras la enumeración: raya delante de ella", pt: "palavra generalizadora depois da enumeração: travessão antes dela", fr: "mot généralisateur après l’énumération : tiret devant lui", de: "verallgemeinerndes Wort nach der Aufzählung: Gedankenstrich davor", it: "parola generalizzante dopo l'elenco: trattino prima di essa", pl: "wyraz uogólniający po wyliczeniu: myślnik przed nim", tr: "sıralamadan sonra genelleyici sözcük: öncesinde tire", id: "kata perangkum sesudah rincian: tanda pisah sebelum kata itu", vi: "từ khái quát đứng sau phần liệt kê: dấu gạch ngang trước nó" }
            ex: ["Ні дощ, ні сніг, ні ві́тер ", { target: "—" }, " ніщо́ не заважа́ло нам гуля́ти."]
            tr: { en: "Neither rain, nor snow, nor wind — nothing stopped us from walking.", es: "Ni la lluvia, ni la nieve, ni el viento: nada nos impedía pasear.", pt: "Nem chuva, nem neve, nem vento — nada nos impedia de passear.", fr: "Ni pluie, ni neige, ni vent — rien ne nous empêchait de nous promener.", de: "Weder Regen noch Schnee noch Wind — nichts hielt uns vom Spazierengehen ab.", it: "Né pioggia, né neve, né vento — niente ci impediva di passeggiare.", pl: "Ani deszcz, ani śnieg, ani wiatr — nic nie przeszkadzało nam w spacerze.", tr: "Ne yağmur, ne kar, ne rüzgâr — hiçbir şey yürüyüş yapmamıza engel olmuyordu.", id: "Hujan, salju, angin — semuanya tidak menghalangi kami berjalan-jalan.", vi: "Dù mưa, tuyết hay gió — không gì ngăn được chúng tôi đi dạo." }
