  - title: { uk: "Зв’язки між частинами складного речення", en: "Links between the clauses of a sentence", es: "Relaciones entre las oraciones de una frase", pt: "Relações entre as orações de uma frase", fr: "Liens entre les propositions d’une phrase", de: "Verbindungen zwischen den Teilsätzen eines Satzes", it: "Legami tra le proposizioni di una frase", pl: "Związki między częściami zdania złożonego", tr: "Birleşik cümlenin parçaları arasındaki bağlantılar", id: "Hubungan antarklausa dalam kalimat", vi: "Quan hệ giữa các mệnh đề trong câu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Зв’язок, en: "Link", es: "Relación", pt: "Relação", fr: "Lien", de: "Verbindung", it: "Legame", pl: "Związek", tr: "Bağlantı", id: "Hubungan", vi: "Quan hệ" } }
          - { key: conj, label: { uk: Сполучники, en: "Conjunctions", es: "Conectores", pt: "Conjunções", fr: "Conjonctions", de: "Konjunktionen", it: "Congiunzioni", pl: "Spójniki", tr: "Bağlaçlar", id: "Konjungsi", vi: "Liên từ" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            use: { uk: "єднальний: події йдуть разом або одна за одною", en: "additive: events go together or one after another", es: "copulativo: los hechos van juntos o uno tras otro", pt: "aditivo: os fatos acontecem juntos ou um após o outro", fr: "copulatif : les faits vont ensemble ou se suivent", de: "kopulativ: Ereignisse laufen zusammen oder nacheinander ab", it: "copulativo: gli eventi vanno insieme o uno dopo l'altro", pl: "łączny: zdarzenia następują razem albo jedno po drugim", tr: "ekleme: olaylar birlikte ya da art arda gelir", id: "penambahan: peristiwa terjadi bersamaan atau berurutan", vi: "cộng gộp: các sự việc xảy ra cùng nhau hoặc nối tiếp nhau" }
            conj: { alternatives: [і, й, та] }
            ex: ["Дощ переста́в", { target: ", і" }, " ви́йшло со́нце."]
            tr: { en: "The rain stopped, and the sun came out.", es: "Dejó de llover y salió el sol.", pt: "A chuva parou, e o sol apareceu.", fr: "La pluie s’est arrêtée, et le soleil est sorti.", de: "Der Regen hörte auf, und die Sonne kam heraus.", it: "La pioggia è smessa, e il sole è uscito.", pl: "Deszcz przestał padać i wyszło słońce.", tr: "Yağmur durdu ve güneş çıktı.", id: "Hujan berhenti, dan matahari pun muncul.", vi: "Mưa tạnh, và mặt trời ló ra." }
          - level: C1
            use: { uk: "протиставний: друга частина суперечить першій або зіставляється з нею", en: "adversative: the second clause contradicts the first or is set against it", es: "adversativo: la segunda oración contradice a la primera o se contrapone a ella", pt: "adversativo: a segunda oração contradiz a primeira ou se contrapõe a ela", fr: "adversatif : la seconde proposition contredit la première ou s’oppose à elle", de: "adversativ: der zweite Teilsatz widerspricht dem ersten oder wird ihm gegenübergestellt", it: "avversativo: la seconda proposizione contraddice la prima o si contrappone ad essa", pl: "przeciwstawny: druga część zdania przeczy pierwszej albo jest jej przeciwstawiona", tr: "karşıtlık: ikinci cümle birincisine ters düşer ya da onunla karşılaştırılır", id: "pertentangan: klausa kedua bertentangan dengan klausa pertama atau dibandingkan dengannya", vi: "đối lập: mệnh đề thứ hai trái với mệnh đề thứ nhất hoặc được đặt cạnh để so sánh" }
            conj: { alternatives: [а, але́] }
            ex: ["Я чека́в на дзвіно́к", { target: ", але́" }, " ніхто́ не подзвони́в."]
            tr: { en: "I waited for a call, but nobody phoned.", es: "Esperaba una llamada, pero nadie llamó.", pt: "Eu esperava uma ligação, mas ninguém ligou.", fr: "J’attendais un appel, mais personne n’a téléphoné.", de: "Ich habe auf einen Anruf gewartet, aber niemand hat angerufen.", it: "Aspettavo una telefonata, ma nessuno ha telefonato.", pl: "Czekałem na telefon, ale nikt nie zadzwonił.", tr: "Bir telefon bekliyordum ama kimse aramadı.", id: "Saya menunggu telepon, tetapi tidak ada yang menelepon.", vi: "Tôi chờ một cuộc gọi, nhưng không ai gọi." }
          - level: C1
            use: { uk: "розділовий: одна з двох подій", en: "disjunctive: one of two events", es: "disyuntivo: uno de dos hechos", pt: "alternativo: um de dois fatos", fr: "disjonctif : l’un des deux faits", de: "disjunktiv: eines von zwei Ereignissen", it: "disgiuntivo: uno dei due eventi", pl: "rozłączny: jedno z dwóch zdarzeń", tr: "seçenek: iki olaydan biri", id: "pilihan: salah satu dari dua peristiwa", vi: "lựa chọn: một trong hai sự việc" }
            conj: { alternatives: [["або́ ", { gap: true }, " або́"], ["чи ", { gap: true }, " чи"]] }
            ex: [{ target: Або́ }, " ми пої́демо в кіно́, ", { target: або́ }, " ви завіта́єте до нас."]
            tr: { en: "Either we'll go to the cinema, or you'll come to see us.", es: "O vamos nosotros al cine, o ustedes vienen a visitarnos.", pt: "Ou nós vamos ao cinema, ou vocês vêm nos visitar.", fr: "Ou bien nous allons au cinéma, ou bien vous passez chez nous.", de: "Entweder gehen wir ins Kino, oder Sie besuchen uns.", it: "O andiamo noi al cinema, o venite voi da noi.", pl: "Albo my pójdziemy do kina, albo wy do nas zajrzycie.", tr: "Ya biz sinemaya gideriz ya da siz bize uğrarsınız.", id: "Entah kami yang pergi ke bioskop, entah Anda yang berkunjung ke tempat kami.", vi: "Hoặc chúng tôi đi xem phim, hoặc các bạn đến thăm chúng tôi." }
          - level: C1
            use: { uk: "приєднувальний: друга частина додає ще один факт", en: "connective: the second clause adds one more fact", es: "aditivo: la segunda oración añade un hecho más", pt: "de acréscimo: a segunda oração acrescenta mais um fato", fr: "d’adjonction : la seconde proposition ajoute un fait de plus", de: "anknüpfend: der zweite Teilsatz fügt eine weitere Tatsache hinzu", it: "aggiuntivo: la seconda proposizione aggiunge un altro fatto", pl: "dołączający: druga część zdania dodaje jeszcze jeden fakt", tr: "ek bilgi: ikinci cümle bir olgu daha ekler", id: "tambahan: klausa kedua menambahkan satu fakta lagi", vi: "bổ sung: mệnh đề thứ hai thêm một sự việc nữa" }
            conj: { alternatives: [і, ще й, та й] }
            ex: ["Надво́рі було́ хо́лодно", { target: ", ще й" }, " поча́вся дощ."]
            tr: { en: "It was cold outside, and on top of that it started to rain.", es: "Hacía frío afuera y, además, empezó a llover.", pt: "Estava frio lá fora e, ainda por cima, começou a chover.", fr: "Il faisait froid dehors, et en plus il s’est mis à pleuvoir.", de: "Draußen war es kalt, und dazu fing es auch noch an zu regnen.", it: "Fuori faceva freddo, e per giunta ha cominciato a piovere.", pl: "Na dworze było zimno, a w dodatku zaczął padać deszcz.", tr: "Dışarısı soğuktu, üstelik yağmur da başladı.", id: "Di luar dingin, ditambah lagi hujan mulai turun.", vi: "Ngoài trời lạnh, lại còn bắt đầu mưa." }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              uk: ["Перед ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, " між частинами речення кома стоїть, коли підмети різні, а при спільному підметі її немає."]
              en: ["A comma goes before ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, " between clauses with different subjects; a shared subject takes none."]
              es: ["Entre oraciones con sujetos distintos va coma delante de ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; con sujeto común no va."]
              pt: ["Entre orações com sujeitos diferentes, vai vírgula antes de ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; com sujeito comum, não vai."]
              fr: ["Entre deux propositions de sujets différents, une virgule précède ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, " ; avec un sujet commun, il n’y en a pas."]
              de: ["Zwischen Teilsätzen mit verschiedenen Subjekten steht vor ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, " ein Komma; bei gemeinsamem Subjekt steht keines."]
              it: ["Tra proposizioni con soggetti diversi va una virgola prima di ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; con un soggetto comune non va."]
              pl: ["Między częściami zdania o różnych podmiotach stawiamy przecinek przed ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; przy wspólnym podmiocie go nie ma."]
              tr: ["Özneleri farklı cümleler arasında ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, " bağlaçlarından önce virgül konur; ortak öznede konmaz."]
              id: ["Di antara klausa dengan subjek berbeda, koma diletakkan sebelum ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; jika subjeknya sama, tidak ada koma."]
              vi: ["Giữa các mệnh đề có chủ ngữ khác nhau, dấu phẩy đứng trước ", { alternatives: [{ term: і }, { term: й }, { term: та }] }, "; khi chung chủ ngữ thì không có dấu phẩy."]
            ex: { contrast: [["Ми прийшли́ додо́му", { target: ", і" }, " ма́ма почала́ вече́рю."], ["Ми прийшли́ додо́му ", { target: й }, " почали́ вече́ряти."]] }
            tr: { en: { contrast: ["We came home, and Mum started dinner.", "We came home and started to have dinner."] }, es: { contrast: ["Llegamos a casa, y mamá empezó la cena.", "Llegamos a casa y empezamos a cenar."] }, pt: { contrast: ["Chegamos em casa, e a mamãe começou o jantar.", "Chegamos em casa e começamos a jantar."] }, fr: { contrast: ["Nous sommes rentrés, et maman a commencé à préparer le dîner.", "Nous sommes rentrés et avons commencé à dîner."] }, de: { contrast: ["Wir sind nach Hause gekommen, und Mama hat das Abendessen angefangen.", "Wir sind nach Hause gekommen und haben angefangen, zu Abend zu essen."] }, it: { contrast: ["Siamo arrivati a casa, e la mamma ha cominciato la cena.", "Siamo arrivati a casa e abbiamo cominciato a cenare."] }, pl: { contrast: ["Przyszliśmy do domu i mama zaczęła robić kolację.", "Przyszliśmy do domu i zaczęliśmy jeść kolację."] }, tr: { contrast: ["Eve geldik, annem de akşam yemeğini hazırlamaya başladı.", "Eve gelip akşam yemeği yemeye başladık."] }, id: { contrast: ["Kami tiba di rumah, dan ibu mulai menyiapkan makan malam.", "Kami tiba di rumah dan mulai makan malam."] }, vi: { contrast: ["Chúng tôi về đến nhà, và mẹ bắt đầu nấu bữa tối.", "Chúng tôi về đến nhà và bắt đầu ăn tối."] } }

