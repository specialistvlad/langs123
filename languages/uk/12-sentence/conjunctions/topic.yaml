            level: B1
            text:
              uk: [{ term: А }, " лише зіставляє два різні факти; ", { term: але́ }, " каже, що другий факт суперечить першому."]
              en: [{ term: А }, " only sets two facts side by side; ", { term: але́ }, " says the second goes against the first."]
              es: [{ term: А }, " solo pone dos hechos uno al lado del otro; ", { term: але́ }, " dice que el segundo contradice al primero."]
              pt: [{ term: А }, " apenas põe dois fatos lado a lado; ", { term: але́ }, " diz que o segundo contradiz o primeiro."]
              fr: [{ term: А }, " met seulement deux faits côte à côte ; ", { term: але́ }, " dit que le second contredit le premier."]
