            text:
              uk: [{ term: Й }, " стоїть між голосними, ", { term: і }, " — між приголосними. Див. ", { link: "Милозвучність", to: uk.foundations.euphony }, "."]
              en: [{ term: Й }, " goes between vowels, ", { term: і }, " between consonants. See ", { link: "у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              es: [{ term: Й }, " va entre vocales, ", { term: і }, " entre consonantes. Ver ", { link: "La eufonía", to: uk.foundations.euphony }, "."]
              pt: [{ term: Й }, " vem entre vogais e ", { term: і }, " entre consoantes. Veja ", { link: "Eufonia", to: uk.foundations.euphony }, "."]
              fr: [{ term: Й }, " se met entre des voyelles, ", { term: і }, " entre des consonnes. Voir ", { link: "L’euphonie", to: uk.foundations.euphony }, "."]
              de: [{ term: Й }, " steht zwischen Vokalen, ", { term: і }, " zwischen Konsonanten. Siehe ", { link: "Euphonie", to: uk.foundations.euphony }, "."]
              it: [{ term: Й }, " sta tra vocali, ", { term: і }, " tra consonanti. Vedi ", { link: "L'eufonia", to: uk.foundations.euphony }, "."]
              pl: [{ term: Й }, " stoi między samogłoskami, ", { term: і }, " — między spółgłoskami. Zob. ", { link: "Eufonia", to: uk.foundations.euphony }, "."]
              tr: [{ term: Й }, " ünlüler arasında, ", { term: і }, " ünsüzler arasında kullanılır. Bkz. ", { link: "Ses ahengi", to: uk.foundations.euphony }, "."]
