title: { uk: Односкладні речення, en: One-Part Sentences, es: "Oraciones unimembres", pt: "Frases de um só membro principal", fr: "Les phrases à un seul terme principal", de: "Eingliedrige Sätze", it: "Le frasi monomembri", pl: "Zdania jednoczłonowe", tr: "Tek ögeli cümleler", id: "Kalimat satu unsur", vi: "Câu đơn phần" }
summary:
  lead:
    uk: "Односкладні речення — означено-особові, неозначено-особові, безособові й називні — мають один головний член і не потребують другого."
    en: "One-part sentences — definite-personal, indefinite-personal, impersonal and nominative — have one main member and need no second one."
    es: "Las oraciones unimembres —personales determinadas, personales indeterminadas, impersonales y nominativas— tienen un solo miembro principal y no necesitan otro."
    pt: "As frases de um só membro principal — pessoais determinadas, pessoais indeterminadas, impessoais e nominativas — não precisam de um segundo."
    fr: "Les phrases à un seul terme principal — personnelles déterminées, personnelles indéterminées, impersonnelles et nominales — n’ont pas besoin d’un second terme."
    de: "Eingliedrige Sätze — bestimmt-persönliche, unbestimmt-persönliche, unpersönliche und Nominativsätze — haben nur ein Hauptglied und brauchen kein zweites."
    it: "Le frasi monomembri — personali determinate, personali indeterminate, impersonali e nominali — hanno un solo membro principale e non ne richiedono un secondo."
    pl: "Zdania jednoczłonowe — określonoosobowe, nieokreślonoosobowe, bezosobowe i nominatywne — mają jeden człon główny i nie potrzebują drugiego."
    tr: "Tek ögeli cümleler — belirli kişili, belirsiz kişili, kişisiz ve yalın hâl cümleleri — tek bir ana ögeye sahiptir ve ikincisine ihtiyaç duymaz."
    id: "Kalimat satu unsur — berpersona tentu, berpersona tak tentu, tak berpersona, dan nominatif — hanya punya satu unsur utama dan tidak butuh unsur kedua."
    vi: "Câu đơn phần — có chủ thể xác định, không xác định, vô nhân xưng, định danh — chỉ có một thành phần chính và không cần thành phần thứ hai."
  rule:
    uk: "Підмета в односкладному реченні немає, і додавати його не треба:"
    en: "A one-part sentence has no subject, and none is needed:"
    es: "La oración unimembre no tiene sujeto, y no hace falta añadirlo:"
    pt: "A frase de um só membro não tem sujeito, e não é preciso acrescentá-lo:"
    fr: "La phrase à un seul terme principal n’a pas de sujet, et il ne faut pas en ajouter :"
    de: "Ein eingliedriger Satz hat kein Subjekt, und man fügt keines hinzu:"
    it: "La frase monomembre non ha il soggetto, e non serve aggiungerlo:"
    pl: "Zdanie jednoczłonowe nie ma podmiotu i nie trzeba go dodawać:"
    tr: "Tek ögeli cümlede özne yoktur ve eklemeye gerek yoktur:"
    id: "Kalimat satu unsur tidak punya subjek, dan subjek tidak perlu ditambahkan:"
    vi: "Câu đơn phần không có chủ ngữ, và không cần thêm chủ ngữ:"
  ex: { examples: [[{ target: "Іду́" }, " додо́му."], [{ target: "Світа́є" }, "."]] }

