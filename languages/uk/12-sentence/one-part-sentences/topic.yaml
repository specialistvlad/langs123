          rule: { uk: "3-тя особа множини чи минулий час множини; діяч не названий", en: "3rd person plural or past tense plural; the doer is not named", es: "3.ª persona del plural o pasado en plural; no se nombra a quien actúa", pt: "3ª pessoa do plural ou passado no plural; o agente não é nomeado", fr: "3e personne du pluriel ou passé au pluriel ; l’agent n’est pas nommé", de: "3. Person Plural oder Vergangenheit im Plural; der Handelnde wird nicht genannt", it: "3ª persona plurale o passato al plurale; l’agente non è nominato", pl: "3. osoba liczby mnogiej lub czas przeszły w liczbie mnogiej; wykonawca nie jest nazwany", tr: "çoğul 3. kişi ya da çoğul geçmiş zaman; eylemi yapan anılmaz", id: "orang ketiga jamak atau masa lampau jamak; pelakunya tidak disebut", vi: "ngôi thứ ba số nhiều hoặc quá khứ số nhiều; không nêu chủ thể hành động" }
