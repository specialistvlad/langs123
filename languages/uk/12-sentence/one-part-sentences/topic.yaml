        - level: C2
          point: { uk: Неозначено-особове, en: "Indefinite-personal", es: "Personal indeterminada", pt: "Pessoal indeterminada", fr: "Personnelle indéterminée", de: "Unbestimmt-persönlich", it: "Personale indeterminata", pl: "Nieokreślonoosobowe", tr: "Belirsiz kişili", id: "Berpersona tak tentu", vi: "Chủ thể không xác định" }
          rule: { uk: "увага на результаті: значення, близьке до пасивного", en: "the focus is on the result: the meaning is close to the passive", es: "la atención va al resultado: el significado se acerca a la pasiva", pt: "a atenção vai para o resultado: o sentido é próximo ao da voz passiva", fr: "l’accent est sur le résultat : le sens est proche du passif", de: "der Blick liegt auf dem Ergebnis: die Bedeutung ähnelt dem Passiv", it: "l’attenzione è sul risultato: il significato è vicino al passivo", pl: "uwaga na wyniku: znaczenie bliskie stronie biernej", tr: "dikkat sonuçtadır: anlam edilgene yakındır", id: "perhatian pada hasil: maknanya mendekati pasif", vi: "trọng tâm là kết quả: nghĩa gần với câu bị động" }
          ex: ["Две́рі вже ", { target: "пофарбува́ли" }, "."]
          tr: { en: "The door has already been painted.", es: "Ya pintaron la puerta.", pt: "A porta já foi pintada.", fr: "La porte a déjà été peinte.", de: "Die Tür wurde schon gestrichen.", it: "La porta è già stata verniciata.", pl: "Drzwi już pomalowano.", tr: "Kapı çoktan boyandı.", id: "Pintu itu sudah dicat.", vi: "Cửa đã được sơn rồi." }
        - level: C2
          point: { uk: Безособове, en: "Impersonal", es: "Impersonal", pt: "Impessoal", fr: "Impersonnel", de: "Unpersönlich", it: "Impersonale", pl: "Bezosobowe", tr: "Kişisiz", id: "Tak berpersona", vi: "Vô nhân xưng" }
          rule: { uk: "хто відчуває — у давальному; зворотне дієслово", en: "the one who feels is in the dative; a reflexive verb", es: "quien siente va en dativo; verbo reflexivo", pt: "quem sente fica no dativo; verbo reflexivo", fr: "celui qui ressent est au datif ; verbe pronominal", de: "wer etwas empfindet, steht im Dativ; reflexives Verb", it: "chi prova una sensazione sta al dativo; verbo riflessivo", pl: "kto odczuwa — w celowniku; czasownik zwrotny", tr: "hisseden kişi yönelme hâlindedir; dönüşlü fiil", id: "yang merasakan berada dalam datif; kata kerja refleksif", vi: "người cảm nhận đứng ở tặng cách; động từ phản thân" }
          ex: [{ target: "Нам ста́ло стра́шно" }, " у те́мряві."]
          tr: { en: "We felt afraid in the dark.", es: "Nos dio miedo en la oscuridad.", pt: "Ficamos com medo no escuro.", fr: "Nous avons eu peur dans l’obscurité.", de: "Uns wurde in der Dunkelheit angst.", it: "Al buio ci è venuta paura.", pl: "Zrobiło nam się strasznie w ciemności.", tr: "Karanlıkta içimize korku düştü.", id: "Kami merasa takut dalam kegelapan.", vi: "Chúng tôi thấy sợ trong bóng tối." }
        - level: B2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: ["у минулому часі безособовий присудок — ", { term: "було́" }], en: ["in the past tense the impersonal predicate is ", { term: "було́" }], es: ["en pasado el predicado impersonal es ", { term: "було́" }], pt: ["no passado, o predicado impessoal é ", { term: "було́" }], fr: ["au passé, le prédicat impersonnel est ", { term: "було́" }], de: ["in der Vergangenheit lautet das unpersönliche Prädikat ", { term: "було́" }], it: ["al passato il predicato impersonale è ", { term: "було́" }], pl: ["w czasie przeszłym orzeczenie bezosobowe to ", { term: "було́" }], tr: ["geçmiş zamanda kişisiz yüklem ", { term: "було́" }, " olur"], id: ["pada masa lampau, predikat tak berpersona adalah ", { term: "було́" }], vi: ["ở quá khứ, vị ngữ vô nhân xưng là ", { term: "було́" }] }
          ex: ["У за́лі ", { target: "було́" }, " ти́хо."]
          tr: { en: "It was quiet in the hall.", es: "En la sala había silencio.", pt: "Na sala havia silêncio.", fr: "Il y avait du silence dans la salle.", de: "Im Saal war es still.", it: "Nella sala c’era silenzio.", pl: "W sali było cicho.", tr: "Salonda sessizlik vardı.", id: "Di dalam aula itu sunyi.", vi: "Trong hội trường yên tĩnh." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "В односкладному реченні один головний член, і другий додавати не треба:", en: "A one-part sentence has one main member, and you do not add a second:", es: "La oración unimembre tiene un solo miembro principal, y no hace falta añadir otro:", pt: "A frase de um só membro tem um único membro principal, e não é preciso acrescentar outro:", fr: "La phrase à un seul terme principal n’a qu’un terme principal, et il ne faut pas en ajouter un second :", de: "Ein eingliedriger Satz hat ein Hauptglied, und man fügt kein zweites hinzu:", it: "La frase monomembre ha un solo membro principale, e non serve aggiungerne un secondo:", pl: "Zdanie jednoczłonowe ma jeden człon główny i nie trzeba dodawać drugiego:", tr: "Tek ögeli cümlede tek bir ana öge vardır; ikincisini eklemeye gerek yoktur:", id: "Kalimat satu unsur hanya punya satu unsur utama; unsur kedua tidak perlu ditambahkan:", vi: "Câu đơn phần có một thành phần chính, và không cần thêm thành phần thứ hai:" }
            ex: [{ target: "Іду́" }, " додо́му."]
            tr: { en: "I'm going home.", es: "Voy a casa.", pt: "Vou para casa.", fr: "Je rentre à la maison.", de: "Ich gehe nach Hause.", it: "Vado a casa.", pl: "Idę do domu.", tr: "Eve gidiyorum.", id: "Saya pulang.", vi: "Tôi đi về nhà." }
          - type: note
            level: B2
            text: { uk: ["Безособові присудки ", { term: "тре́ба" }, " і ", { term: "мо́жна" }, ": ", { link: "Модальні слова: треба, можна, мусити", to: uk.modality.modal-words }, "."], en: ["The impersonal predicates ", { term: "тре́ба" }, " and ", { term: "мо́жна" }, ": ", { link: "Need, May, Must: треба, можна, мусити", to: uk.modality.modal-words }, "."], es: ["Los predicados impersonales ", { term: "тре́ба" }, " y ", { term: "мо́жна" }, ": ", { link: "Necesidad y permiso: треба, можна, мусити", to: uk.modality.modal-words }, "."], pt: ["Os predicados impessoais ", { term: "тре́ба" }, " e ", { term: "мо́жна" }, ": ", { link: "Palavras modais: треба, можна, мусити", to: uk.modality.modal-words }, "."], fr: ["Les prédicats impersonnels ", { term: "тре́ба" }, " et ", { term: "мо́жна" }, " : ", { link: "Les mots modaux : треба, можна, мусити", to: uk.modality.modal-words }, "."], de: ["Die unpersönlichen Prädikate ", { term: "тре́ба" }, " und ", { term: "мо́жна" }, ": ", { link: "Modalwörter: треба, можна, мусити", to: uk.modality.modal-words }, "."], it: ["I predicati impersonali ", { term: "тре́ба" }, " e ", { term: "мо́жна" }, ": ", { link: "Parole modali: треба, можна, мусити", to: uk.modality.modal-words }, "."], pl: ["Orzeczenia bezosobowe ", { term: "тре́ба" }, " i ", { term: "мо́жна" }, ": ", { link: "Wyrazy modalne: треба, можна, мусити", to: uk.modality.modal-words }, "."], tr: ["Kişisiz yüklemler ", { term: "тре́ба" }, " ve ", { term: "мо́жна" }, ": ", { link: "Modal sözcükler: треба, можна, мусити", to: uk.modality.modal-words }, "."], id: ["Predikat tak berpersona ", { term: "тре́ба" }, " dan ", { term: "мо́жна" }, ": ", { link: "Kata modal: треба, можна, мусити", to: uk.modality.modal-words }, "."], vi: ["Các vị ngữ vô nhân xưng ", { term: "тре́ба" }, " và ", { term: "мо́жна" }, ": ", { link: "Từ tình thái: треба, можна, мусити", to: uk.modality.modal-words }, "."] }

  - title: { uk: Означено-особові речення, en: "Definite-personal sentences", es: "Oraciones personales determinadas", pt: "Frases pessoais determinadas", fr: "Phrases personnelles déterminées", de: "Bestimmt-persönliche Sätze", it: "Frasi personali determinate", pl: "Zdania określonoosobowe", tr: "Belirli kişili cümleler", id: "Kalimat berpersona tentu", vi: "Câu có chủ thể xác định" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Присудок, en: "Predicate", es: "Predicado", pt: "Predicado", fr: "Prédicat", de: "Prädikat", it: "Predicato", pl: "Orzeczenie", tr: "Yüklem", id: "Predikat", vi: "Vị ngữ" } }
          - { key: ex, label: { uk: Приклад, en: "Example", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            features: { person: 1, number: sg }
            form: { uk: "1-ша особа однини: діяч — я", en: "1st person singular: the doer is I", es: "1.ª persona del singular: actúo yo", pt: "1ª pessoa do singular: quem age sou eu", fr: "1re personne du singulier : l’agent, c’est moi", de: "1. Person Singular: der Handelnde bin ich", it: "1ª persona singolare: agisco io", pl: "1. osoba liczby pojedynczej: wykonawcą jestem ja", tr: "tekil 1. kişi: eylemi yapan benim", id: "orang pertama tunggal: pelakunya saya", vi: "ngôi thứ nhất số ít: chủ thể là tôi" }
            ex: { examples: [[{ target: "Іду́" }, " по ву́лиці й ", { target: "слу́хаю" }, " му́зику."], [{ target: "Не люблю́" }, " втруча́тися в чуже́ життя́."]] }
            tr: { en: { examples: ["I walk along the street and listen to music.", "I don't like interfering in other people's lives."] }, es: { examples: ["Camino por la calle y escucho música.", "No me gusta meterme en la vida de los demás."] }, pt: { examples: ["Ando pela rua e escuto música.", "Não gosto de me intrometer na vida dos outros."] }, fr: { examples: ["Je marche dans la rue et j’écoute de la musique.", "Je n’aime pas me mêler de la vie des autres."] }, de: { examples: ["Ich gehe die Straße entlang und höre Musik.", "Ich mische mich nicht gern in das Leben anderer ein."] }, it: { examples: ["Cammino per strada e ascolto musica.", "Non mi piace immischiarmi nella vita degli altri."] }, pl: { examples: ["Idę ulicą i słucham muzyki.", "Nie lubię wtrącać się w cudze życie."] }, tr: { examples: ["Sokakta yürüyüp müzik dinliyorum.", "Başkalarının hayatına karışmayı sevmem."] }, id: { examples: ["Saya berjalan di jalan sambil mendengarkan musik.", "Saya tidak suka ikut campur urusan orang lain."] }, vi: { examples: ["Tôi đi trên phố và nghe nhạc.", "Tôi không thích can thiệp vào cuộc sống của người khác."] } }
          - level: B2
            features: { person: 2, number: sg }
            form: { uk: "2-га особа однини: діяч — ти", en: "2nd person singular: the doer is you", es: "2.ª persona del singular: actúas tú", pt: "2ª pessoa do singular: quem age é você", fr: "2e personne du singulier : l’agent, c’est toi", de: "2. Person Singular: der Handelnde bist du", it: "2ª persona singolare: agisci tu", pl: "2. osoba liczby pojedynczej: wykonawcą jesteś ty", tr: "tekil 2. kişi: eylemi yapan sensin", id: "orang kedua tunggal: pelakunya kamu", vi: "ngôi thứ hai số ít: chủ thể là bạn" }
            ex: [{ target: "Чита́єш" }, " цю кни́жку?"]
            tr: { en: "Are you reading this book?", es: "¿Estás leyendo este libro?", pt: "Você está lendo este livro?", fr: "Tu lis ce livre ?", de: "Liest du dieses Buch?", it: "Stai leggendo questo libro?", pl: "Czytasz tę książkę?", tr: "Bu kitabı okuyor musun?", id: "Apakah kamu sedang membaca buku ini?", vi: "Bạn đang đọc cuốn sách này à?" }
          - level: B2
            features: { person: 2, number: pl }
            form: { uk: "2-га особа множини: діяч — ви", en: "2nd person plural: the doer is you (plural)", es: "2.ª persona del plural: actúan ustedes", pt: "2ª pessoa do plural: quem age são vocês", fr: "2e personne du pluriel : l’agent, c’est vous", de: "2. Person Plural: die Handelnden seid ihr", it: "2ª persona plurale: agite voi", pl: "2. osoba liczby mnogiej: wykonawcami jesteście wy", tr: "çoğul 2. kişi: eylemi yapan sizsiniz", id: "orang kedua jamak: pelakunya kalian", vi: "ngôi thứ hai số nhiều: chủ thể là các bạn" }
            ex: [{ target: "Вихо́дите" }, " на насту́пній зупи́нці?"]
            tr: { en: "Do you get off at the next stop?", es: "¿Bajan en la próxima parada?", pt: "Vocês descem no próximo ponto?", fr: "Vous descendez au prochain arrêt ?", de: "Steigen Sie an der nächsten Haltestelle aus?", it: "Scendete alla prossima fermata?", pl: "Wysiadacie na następnym przystanku?", tr: "Bir sonraki durakta iniyor musunuz?", id: "Apakah Anda turun di halte berikutnya?", vi: "Các bạn xuống ở trạm dừng tiếp theo không?" }
          - level: C1
            features: { person: 1, number: pl }
            form: { uk: "1-ша особа множини: діяч — ми", en: "1st person plural: the doer is we", es: "1.ª persona del plural: actuamos nosotros", pt: "1ª pessoa do plural: quem age somos nós", fr: "1re personne du pluriel : l’agent, c’est nous", de: "1. Person Plural: die Handelnden sind wir", it: "1ª persona plurale: agiamo noi", pl: "1. osoba liczby mnogiej: wykonawcami jesteśmy my", tr: "çoğul 1. kişi: eylemi yapan biziz", id: "orang pertama jamak: pelakunya kami", vi: "ngôi thứ nhất số nhiều: chủ thể là chúng tôi" }
            ex: ["У субо́ту ", { target: "пої́демо" }, " за мі́сто."]
            tr: { en: "On Saturday we'll go out of town.", es: "El sábado saldremos de la ciudad.", pt: "No sábado vamos sair da cidade.", fr: "Samedi, nous irons à la campagne.", de: "Am Samstag fahren wir aus der Stadt hinaus.", it: "Sabato andremo fuori città.", pl: "W sobotę pojedziemy za miasto.", tr: "Cumartesi şehir dışına çıkacağız.", id: "Hari Sabtu kami akan pergi ke luar kota.", vi: "Thứ Bảy chúng tôi sẽ ra ngoài thành phố." }
          - level: C1
            features: { mood: imp }
            form: { uk: "наказовий спосіб: діє співрозмовник", en: "the imperative: the person addressed acts", es: "imperativo: actúa el interlocutor", pt: "imperativo: age o interlocutor", fr: "l’impératif : c’est l’interlocuteur qui agit", de: "Imperativ: der Gesprächspartner handelt", it: "imperativo: agisce l’interlocutore", pl: "tryb rozkazujący: działa rozmówca", tr: "emir kipi: eylemi karşıdaki kişi yapar", id: "bentuk perintah: lawan bicara yang bertindak", vi: "thức mệnh lệnh: người đối thoại hành động" }
            ex: { examples: [[{ target: "Подзвоні́ть" }, " мені́ за́втра."], [{ target: "Не забу́дьте" }, " взя́ти па́спорт."]] }
            tr: { en: { examples: ["Call me tomorrow.", "Don't forget to take your passport."] }, es: { examples: ["Llámenme mañana.", "No olviden llevar el pasaporte."] }, pt: { examples: ["Liguem para mim amanhã.", "Não esqueçam de levar o passaporte."] }, fr: { examples: ["Appelez-moi demain.", "N’oubliez pas de prendre votre passeport."] }, de: { examples: ["Rufen Sie mich morgen an.", "Vergessen Sie nicht, Ihren Pass mitzunehmen."] }, it: { examples: ["Chiamatemi domani.", "Non dimenticate di prendere il passaporto."] }, pl: { examples: ["Zadzwońcie do mnie jutro.", "Nie zapomnijcie zabrać paszportu."] }, tr: { examples: ["Yarın beni arayın.", "Pasaportunuzu almayı unutmayın."] }, id: { examples: ["Telepon saya besok.", "Jangan lupa membawa paspor."] }, vi: { examples: ["Ngày mai hãy gọi cho tôi.", "Đừng quên mang theo hộ chiếu."] } }
          - level: C2
            features: { person: 1, number: pl }
            form: { uk: "узагальнення: діють усі, кого стосується думка", en: "a generalisation: everyone the thought concerns acts", es: "generalización: actúan todos a quienes se refiere la idea", pt: "generalização: agem todos a quem a ideia diz respeito", fr: "généralisation : tous ceux que l’idée concerne agissent", de: "Verallgemeinerung: alle handeln, die der Gedanke betrifft", it: "generalizzazione: agiscono tutti quelli a cui si riferisce il pensiero", pl: "uogólnienie: działają wszyscy, których dotyczy myśl", tr: "genelleme: düşüncenin ilgilendirdiği herkes eylemi yapar", id: "generalisasi: semua orang yang dicakup pernyataan itu bertindak", vi: "khái quát hóa: tất cả những người mà nhận định nhắc tới đều hành động" }
            ex: [{ target: "Лю́бимо" }, " люде́й щи́рих, ", { target: "поважа́ємо" }, " люде́й наполе́гливих."]
            tr: { en: "We love sincere people, we respect persistent people.", es: "Queremos a la gente sincera y respetamos a la gente tenaz.", pt: "Amamos as pessoas sinceras e respeitamos as pessoas persistentes.", fr: "Nous aimons les gens sincères, nous respectons les gens persévérants.", de: "Wir lieben aufrichtige Menschen und respektieren beharrliche Menschen.", it: "Amiamo le persone sincere e rispettiamo le persone tenaci.", pl: "Kochamy ludzi szczerych, szanujemy ludzi wytrwałych.", tr: "Samimi insanları severiz, azimli insanlara saygı duyarız.", id: "Kita menyukai orang yang tulus dan menghormati orang yang gigih.", vi: "Chúng ta yêu quý những người chân thành, kính trọng những người kiên trì." }
          - level: C2
            features: { person: 2, number: sg }
            form: { uk: "2-га особа однини: прислів’я й поради", en: "2nd person singular: proverbs and advice", es: "2.ª persona del singular: refranes y consejos", pt: "2ª pessoa do singular: provérbios e conselhos", fr: "2e personne du singulier : proverbes et conseils", de: "2. Person Singular: Sprichwörter und Ratschläge", it: "2ª persona singolare: proverbi e consigli", pl: "2. osoba liczby pojedynczej: przysłowia i rady", tr: "tekil 2. kişi: atasözleri ve öğütler", id: "orang kedua tunggal: peribahasa dan nasihat", vi: "ngôi thứ hai số ít: tục ngữ và lời khuyên" }
            ex: ["Тихі́ше ", { target: "ї́деш" }, " — да́лі ", { target: "бу́деш" }, "."]
            tr: { en: "The slower you go, the further you get.", es: "Cuanto más despacio vas, más lejos llegas.", pt: "Quanto mais devagar você vai, mais longe você chega.", fr: "Plus tu vas doucement, plus tu vas loin.", de: "Je langsamer du gehst, desto weiter kommst du.", it: "Più vai piano, più lontano arrivi.", pl: "Im wolniej jedziesz, tym dalej zajedziesz.", tr: "Ne kadar yavaş gidersen o kadar uzağa varırsın.", id: "Semakin pelan kamu melaju, semakin jauh kamu sampai.", vi: "Đi càng chậm, càng đến được xa." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "Займенник-підмет додаємо лише для наголосу; тоді речення вже двоскладне:", en: "We add a subject pronoun only for emphasis; then the sentence is already a two-part one:", es: "El pronombre sujeto se añade solo para enfatizar; entonces la oración ya es bimembre:", pt: "O pronome sujeito só se acrescenta para dar ênfase; então a frase já tem dois membros principais:", fr: "On ajoute le pronom sujet seulement pour insister ; la phrase a alors deux termes principaux :", de: "Das Subjektpronomen steht nur zur Betonung; dann ist der Satz schon zweigliedrig:", it: "Il pronome soggetto si aggiunge solo per enfasi; allora la frase è già bimembre:", pl: "Zaimek w roli podmiotu dodajemy tylko dla podkreślenia; wtedy zdanie jest już dwuczłonowe:", tr: "Özne zamirini yalnızca vurgu için ekleriz; o zaman cümle artık çift ögelidir:", id: "Pronomina subjek ditambahkan hanya untuk penekanan; kalimat itu lalu menjadi kalimat dua unsur:", vi: "Đại từ làm chủ ngữ chỉ được thêm vào để nhấn mạnh; khi đó câu đã là câu hai thành phần:" }
            ex: [{ target: "Я" }, " люблю́ мандрува́ти."]
