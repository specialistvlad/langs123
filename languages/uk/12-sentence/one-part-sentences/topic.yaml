          rule: { uk: "присудок у 1-й чи 2-й особі; діяч відомий", en: "the predicate is in the 1st or 2nd person; the doer is known", es: "el predicado va en 1.ª o 2.ª persona; se sabe quién actúa", pt: "o predicado fica na 1ª ou 2ª pessoa; o agente é conhecido", fr: "le prédicat est à la 1re ou à la 2e personne ; l’agent est connu", de: "das Prädikat steht in der 1. oder 2. Person; der Handelnde ist bekannt", it: "il predicato è alla 1ª o 2ª persona; l’agente è noto", pl: "orzeczenie w 1. lub 2. osobie; wykonawca czynności jest znany", tr: "yüklem 1. ya da 2. kişidedir; eylemi yapan bellidir", id: "predikat berada di orang pertama atau kedua; pelakunya diketahui", vi: "vị ngữ ở ngôi thứ nhất hoặc thứ hai; chủ thể hành động đã rõ" }
