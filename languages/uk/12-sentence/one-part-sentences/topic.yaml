          tr: { en: "It was announced on the radio that the weather will get worse.", es: "Anunciaron por la radio que el tiempo empeorará.", pt: "Anunciaram pelo rádio que o tempo vai piorar.", fr: "On a annoncé à la radio une dégradation du temps.", de: "Im Radio wurde eine Wetterverschlechterung gemeldet.", it: "Alla radio hanno annunciato un peggioramento del tempo.", pl: "W radiu zapowiedziano pogorszenie pogody.", tr: "Radyoda havanın kötüleşeceğini duyurdular.", id: "Di radio diumumkan bahwa cuaca akan memburuk.", vi: "Đài đã thông báo thời tiết sẽ xấu đi." }
