            use: { uk: [{ term: щоб }, " з минулим часом: прохання чи наказ"], en: [{ term: щоб }, " with the past tense: a request or an order"], es: [{ term: щоб }, " con el pasado: un pedido o una orden"] }
            ex: ["Виклада́ч сказа́в, ", { target: щоб я бага́то працюва́в }, "."]
            tr: { en: "The teacher told me to work hard.", es: "El profesor me dijo que trabajara mucho." }
      - type: list
