          tr: { en: "I know that we did it right.", es: "Sé que lo hicimos bien.", pt: "Sei que fizemos isso certo.", fr: "Je sais que nous l’avons bien fait.", de: "Ich weiß, dass wir es richtig gemacht haben.", it: "So che lo abbiamo fatto bene.", pl: "Wiem, że zrobiliśmy to dobrze.", tr: "Bunu doğru yaptığımızı biliyorum.", id: "Saya tahu bahwa kami sudah melakukannya dengan benar.", vi: "Tôi biết là chúng tôi đã làm việc này đúng." }
