title: { uk: Речення з що і щоб, en: Clauses with що and щоб, es: Oraciones con що y щоб, pt: "Orações com що e щоб", fr: "Les propositions avec що et щоб", de: "Sätze mit що und щоб", it: "Le proposizioni con що e щоб", pl: "Zdania z що i щоб", tr: "що ve щоб ile kurulan yan cümleler", id: "Anak kalimat dengan що dan щоб", vi: "Mệnh đề với що và щоб" }
summary:
  lead:
    uk: [{ term: Що }, " вводить те, що хтось знає чи каже; ", { term: щоб }, " — мету або бажання: з інфінітивом чи з дієсловом минулого часу."]
    en: [{ term: Що }, " introduces what someone knows or says; ", { term: щоб }, " introduces a purpose or a wish, with the infinitive or a past-tense verb."]
    es: [{ term: Що }, " introduce lo que alguien sabe o dice; ", { term: щоб }, ", una finalidad o un deseo, con infinitivo o con un verbo en pasado."]
    pt: [{ term: Що }, " introduz o que alguém sabe ou diz; ", { term: щоб }, " introduz uma finalidade ou um desejo, com infinitivo ou com um verbo no passado."]
    fr: [{ term: Що }, " introduit ce que quelqu’un sait ou dit ; ", { term: щоб }, " introduit un but ou un souhait, avec l’infinitif ou un verbe au passé."]
    de: [{ term: Що }, " leitet ein, was jemand weiß oder sagt; ", { term: щоб }, " leitet einen Zweck oder Wunsch ein, mit dem Infinitiv oder einem Verb in der Vergangenheit."]
    it: [{ term: Що }, " introduce ciò che qualcuno sa o dice; ", { term: щоб }, " introduce uno scopo o un desiderio, con l’infinito o con un verbo al passato."]
    pl: [{ term: Що }, " wprowadza to, co ktoś wie lub mówi; ", { term: щоб }, " wprowadza cel lub życzenie, z bezokolicznikiem albo z czasownikiem w czasie przeszłym."]
    tr: [{ term: Що }, " birinin bildiği ya da söylediği şeyi, ", { term: щоб }, " ise bir amacı ya da isteği başlatır; mastar veya geçmiş zamanlı bir fiille kullanılır."]
    id: [{ term: Що }, " memperkenalkan apa yang diketahui atau dikatakan seseorang; ", { term: щоб }, " memperkenalkan tujuan atau keinginan, dengan infinitif atau kata kerja bentuk lampau."]
    vi: [{ term: Що }, " dẫn điều ai đó biết hoặc nói; ", { term: щоб }, " dẫn mục đích hoặc mong muốn, đi với động từ nguyên mẫu hoặc quá khứ."]
  rule:
    uk: ["Перед ", { term: що }, " і ", { term: щоб }, ", які починають підрядну частину, звичайно ставимо кому:"]
    en: ["A comma usually goes before ", { term: що }, " and ", { term: щоб }, " when they open a clause:"]
    es: ["Delante de ", { term: що }, " y ", { term: щоб }, " que abren una oración suele ir coma:"]
    pt: ["Antes de ", { term: що }, " e ", { term: щоб }, ", que abrem uma oração subordinada, costuma ir uma vírgula:"]
    fr: ["Une virgule précède d’ordinaire ", { term: що }, " et ", { term: щоб }, " quand ils ouvrent une proposition :"]
    de: ["Vor ", { term: що }, " und ", { term: щоб }, ", die einen Nebensatz einleiten, steht in der Regel ein Komma:"]
    it: ["Prima di ", { term: що }, " e ", { term: щоб }, ", che aprono una proposizione, di solito si mette la virgola:"]
    pl: ["Przed ", { term: що }, " i ", { term: щоб }, ", które otwierają zdanie podrzędne, zwykle stawiamy przecinek:"]
    tr: ["Yan cümleyi başlatan ", { term: що }, " ve ", { term: щоб }, " öncesine genellikle virgül konur:"]
    id: ["Sebelum ", { term: що }, " dan ", { term: щоб }, " yang membuka anak kalimat, biasanya ada koma:"]
    vi: ["Trước ", { term: що }, " và ", { term: щоб }, " mở đầu mệnh đề phụ thường có dấu phẩy:"]
  ex: { examples: [["Я зна́ю", { target: ", що" }, " ти пра́вий."], ["Ми вчимо́ мо́ву", { target: ", щоб" }, " розмовля́ти з дру́зями."]] }

