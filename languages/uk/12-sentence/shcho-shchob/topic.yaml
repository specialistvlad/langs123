    id: [{ term: Що }, " memperkenalkan apa yang diketahui atau dikatakan seseorang; ", { term: щоб }, " memperkenalkan tujuan atau keinginan, dengan infinitif atau kata kerja bentuk lampau."]
    vi: [{ term: Що }, " dẫn điều ai đó biết hoặc nói; ", { term: щоб }, " dẫn mục đích hoặc mong muốn, đi với động từ nguyên mẫu hoặc quá khứ."]
