sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: [{ term: Що }, " приєднує частину, у якій сказано, що хтось знає, думає чи говорить."]
              en: [{ term: Що }, " joins a clause that says what someone knows, thinks or says."]
              es: [{ term: Що }, " une una oración que dice lo que alguien sabe, piensa o dice."]
              pt: [{ term: Що }, " liga uma oração que diz o que alguém sabe, pensa ou diz."]
              fr: [{ term: Що }, " relie une proposition qui dit ce que quelqu’un sait, pense ou dit."]
              de: [{ term: Що }, " verbindet einen Nebensatz, der sagt, was jemand weiß, denkt oder sagt."]
              it: [{ term: Що }, " collega una proposizione che dice ciò che qualcuno sa, pensa o dice."]
              pl: [{ term: Що }, " łączy zdanie podrzędne, które mówi, co ktoś wie, myśli lub mówi."]
              tr: [{ term: Що }, " birinin bildiğini, düşündüğünü ya da söylediğini anlatan bir yan cümleyi bağlar."]
              id: [{ term: Що }, " menghubungkan anak kalimat yang menyatakan apa yang diketahui, dipikirkan, atau dikatakan seseorang."]
              vi: [{ term: Що }, " nối mệnh đề nói điều ai đó biết, nghĩ hoặc nói."]
            ex: ["Виклада́ч сказа́в, ", { target: що }, " я ма́ю бага́то працюва́ти."]
            tr: { en: "The teacher said that I have to work hard.", es: "El profesor dijo que tengo que trabajar mucho.", pt: "O professor disse que eu tenho que trabalhar muito.", fr: "Le professeur a dit que je dois beaucoup travailler.", de: "Der Lehrer sagte, dass ich viel arbeiten muss.", it: "L’insegnante ha detto che devo lavorare molto.", pl: "Nauczyciel powiedział, że muszę dużo pracować.", tr: "Öğretmen çok çalışmam gerektiğini söyledi.", id: "Guru berkata bahwa saya harus bekerja keras.", vi: "Giáo viên nói là tôi phải làm việc chăm chỉ." }
          - type: rule
            level: A2
            text:
              uk: [{ term: Щоб }, " приєднує частину, яка називає мету: навіщо щось робиться."]
              en: [{ term: Щоб }, " joins a clause that names a purpose: why something is done."]
              es: [{ term: Щоб }, " une una oración que expresa una finalidad: para qué se hace algo."]
              pt: [{ term: Щоб }, " liga uma oração que expressa uma finalidade: para que algo é feito."]
              fr: [{ term: Щоб }, " relie une proposition qui exprime un but : pourquoi on fait quelque chose."]
              de: [{ term: Щоб }, " verbindet einen Nebensatz, der einen Zweck nennt: wozu etwas getan wird."]
              it: [{ term: Щоб }, " collega una proposizione che esprime uno scopo: perché si fa qualcosa."]
              pl: [{ term: Щоб }, " łączy zdanie podrzędne, które podaje cel: po co coś się robi."]
              tr: [{ term: Щоб }, " bir amacı, yani bir şeyin ne için yapıldığını bildiren yan cümleyi bağlar."]
              id: [{ term: Щоб }, " menghubungkan anak kalimat yang menyatakan tujuan: untuk apa sesuatu dilakukan."]
