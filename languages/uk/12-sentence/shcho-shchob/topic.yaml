          - level: B1
            use: { uk: [{ term: щоб }, " з минулим часом: бажання"], en: [{ term: щоб }, " with the past tense: a wish"], es: [{ term: щоб }, " con el pasado: un deseo"] }
            ex: ["Я хо́чу, ", { target: щоб ти прийшо́в }, "."]
