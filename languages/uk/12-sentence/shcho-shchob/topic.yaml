            it: ["virgola prima di ", { term: що }, " e ", { term: щоб }]
            pl: ["przecinek przed ", { term: що }, " i ", { term: щоб }]
            tr: [{ term: що }, " ve ", { term: щоб }, " öncesinde virgül"]
