            tr: { en: "He had a car.", es: "Él tenía auto." }
          - level: B1
            form: { uk: [{ term: було́ }, ": середній рід"], en: [{ term: було́ }, ": neuter"], es: [{ term: було́ }, ": neutro"] }
            ex: ["У не́ї ", { target: було́ }, " пита́ння."]
            tr: { en: "She had a question.", es: "Ella tenía una pregunta." }
          - level: B1
            form: { uk: [{ term: були́ }, ": множина"], en: [{ term: були́ }, ": plural"], es: [{ term: були́ }, ": plural"] }
            ex: ["У нас ", { target: були́ }, " квитки́."]
            tr: { en: "We had tickets.", es: "Teníamos entradas." }
          - level: B1
            form: { uk: { alternatives: [{ term: бу́де }, { term: бу́дуть }] }, en: [{ alternatives: [{ term: бу́де }, { term: бу́дуть }] }, ": the future"], es: [{ alternatives: [{ term: бу́де }, { term: бу́дуть }] }, ": el futuro"] }
            ex: { examples: [["У мене́ ", { target: бу́де }, " ві́льний час."], ["У нас ", { target: бу́дуть }, " го́сті."]] }
            tr: { en: { examples: ["I'll have some free time.", "We'll have guests."] }, es: { examples: ["Tendré tiempo libre.", "Tendremos invitados."] } }
