              pl: ["Gramatycznie osoba po ", { term: у }, " stoi w dopełniaczu: ", { term: мене́ }, " to dopełniacz od ", { term: я }, ", a ", { term: не́ї }, " — od ", { term: вона́ }, "."]
              tr: ["Dilbilgisi açısından ", { term: у }, " sonrasındaki kişi tamlayan hâlindedir: ", { term: мене́ }, ", ", { term: я }, " sözcüğünün; ", { term: не́ї }, ", ", { term: вона́ }, " sözcüğünün tamlayan hâlidir."]
              id: ["Secara gramatika, orang setelah ", { term: у }, " berada dalam genitif: ", { term: мене́ }, " adalah genitif dari ", { term: я }, ", dan ", { term: не́ї }, " dari ", { term: вона́ }, "."]
