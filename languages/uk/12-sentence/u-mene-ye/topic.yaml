            text:
              uk: [{ term: У мене́ є }, " — готовий зворот зі значенням «я маю»; те, що є, стоїть у називному відмінку."]
              en: [{ term: У мене́ є }, " is a set phrase meaning “I have”; what you have is in the nominative."]
              es: [{ term: У мене́ є }, " es una expresión fija que significa «tengo»; lo que se tiene va en nominativo."]
              pt: [{ term: У мене́ є }, " é uma expressão fixa que significa “eu tenho”; o que se tem fica no nominativo."]
              fr: [{ term: У мене́ є }, " est une expression figée qui signifie « j’ai » ; ce qu’on a est au nominatif."]
              de: [{ term: У мене́ є }, " ist eine feste Wendung mit der Bedeutung „ich habe“; was man hat, steht im Nominativ."]
              it: [{ term: У мене́ є }, " è un’espressione fissa che significa «ho»; ciò che si ha sta al nominativo."]
              pl: [{ term: У мене́ є }, " to stały zwrot oznaczający „mam”; to, co się ma, stoi w mianowniku."]
              tr: [{ term: У мене́ є }, " “bende var” anlamına gelen kalıplaşmış bir yapıdır; sahip olunan şey yalın hâlde durur."]
              id: [{ term: У мене́ є }, " adalah ungkapan tetap yang berarti “saya punya”; benda yang dimiliki berada dalam nominatif."]
              vi: [{ term: У мене́ є }, " là cụm cố định nghĩa là “tôi có”; vật được sở hữu ở danh cách."]
            ex: [{ target: У мене́ є }, " брат."]
            tr: { en: "I have a brother.", es: "Tengo un hermano.", pt: "Tenho um irmão.", fr: "J’ai un frère.", de: "Ich habe einen Bruder.", it: "Ho un fratello.", pl: "Mam brata.", tr: "Bir erkek kardeşim var.", id: "Saya punya saudara laki-laki.", vi: "Tôi có một anh trai." }
          - type: rule
            level: A1
            text:
              uk: ["Дієслово ", { term: ма́ти }, " зі знахідним відмінком означає те саме; у побуті частіше кажуть ", { term: у мене́ є }, "."]
              en: ["The verb ", { term: ма́ти }, " with the accusative means the same; everyday speech more often says ", { term: у мене́ є }, "."]
              es: ["El verbo ", { term: ма́ти }, " con el acusativo significa lo mismo; en el habla cotidiana es más frecuente ", { term: у мене́ є }, "."]
              pt: ["O verbo ", { term: ма́ти }, " com o acusativo significa o mesmo; na fala cotidiana é mais comum ", { term: у мене́ є }, "."]
              fr: ["Le verbe ", { term: ма́ти }, " avec l’accusatif a le même sens ; dans la langue courante, on dit plus souvent ", { term: у мене́ є }, "."]
              de: ["Das Verb ", { term: ма́ти }, " mit dem Akkusativ bedeutet dasselbe; im Alltag sagt man häufiger ", { term: у мене́ є }, "."]
              it: ["Il verbo ", { term: ма́ти }, " con l’accusativo significa lo stesso; nel parlato quotidiano si dice più spesso ", { term: у мене́ є }, "."]
              pl: ["Czasownik ", { term: ма́ти }, " z biernikiem znaczy to samo; na co dzień częściej mówi się ", { term: у мене́ є }, "."]
              tr: ["Belirtme hâlindeki ", { term: ма́ти }, " fiili aynı anlama gelir; günlük konuşmada daha çok ", { term: у мене́ є }, " denir."]
              id: ["Kata kerja ", { term: ма́ти }, " dengan akusatif berarti sama; dalam percakapan sehari-hari lebih sering dipakai ", { term: у мене́ є }, "."]
              vi: ["Động từ ", { term: ма́ти }, " với đối cách có nghĩa như vậy; trong lời nói hằng ngày người ta hay nói ", { term: у мене́ є }, " hơn."]
            ex: ["Я ", { target: ма́ю бра́та }, "."]
            tr: { en: "I have a brother.", es: "Tengo un hermano.", pt: "Tenho um irmão.", fr: "J’ai un frère.", de: "Ich habe einen Bruder.", it: "Ho un fratello.", pl: "Mam brata.", tr: "Bir erkek kardeşim var.", id: "Saya punya saudara laki-laki.", vi: "Tôi có một anh trai." }
          - type: note
            level: A1
            text:
              uk: ["Після голосного ", { term: у }, " часто стає ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Див. ", { link: "Милозвучність", to: uk.foundations.euphony }, "."]
              en: ["After a vowel, ", { term: у }, " often becomes ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " See ", { link: "у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              es: ["Después de vocal, ", { term: у }, " suele pasar a ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Ver ", { link: "La eufonía", to: uk.foundations.euphony }, "."]
              pt: ["Depois de vogal, ", { term: у }, " costuma virar ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Ver ", { link: "Eufonia: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              fr: ["Après une voyelle, ", { term: у }, " devient souvent ", { term: в }, " : ", { term: Чи в тебе́ є час? }, " Voir ", { link: "L’euphonie : у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              de: ["Nach einem Vokal wird ", { term: у }, " oft zu ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Siehe ", { link: "Euphonie: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              it: ["Dopo una vocale ", { term: у }, " diventa spesso ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Vedi ", { link: "L'eufonia: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              pl: ["Po samogłosce ", { term: у }, " często zmienia się w ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Zob. ", { link: "Eufonia: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              tr: ["Ünlüden sonra ", { term: у }, " çoğu zaman ", { term: в }, " olur: ", { term: Чи в тебе́ є час? }, " Bkz. ", { link: "Ses ahengi: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              id: ["Setelah vokal, ", { term: у }, " sering menjadi ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Lihat ", { link: "Eufoni: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
              vi: ["Sau nguyên âm, ", { term: у }, " thường đổi thành ", { term: в }, ": ", { term: Чи в тебе́ є час? }, " Xem ", { link: "Tính êm tai: у/в, і/й, з/із/зі", to: uk.foundations.euphony }, "."]
          - type: rule
            level: B1
            text:
              uk: ["Граматично особа після ", { term: у }, " стоїть у родовому відмінку: ", { term: мене́ }, " — родовий від ", { term: я }, ", ", { term: не́ї }, " — від ", { term: вона́ }, "."]
              en: ["In grammar terms, the person after ", { term: у }, " is in the genitive: ", { term: мене́ }, " is the genitive of ", { term: я }, ", ", { term: не́ї }, " of ", { term: вона́ }, "."]
