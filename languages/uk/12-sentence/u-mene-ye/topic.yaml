            form: { uk: [{ alternatives: [{ term: не було́ }, { term: не бу́де }] }, " і родовий"], en: [{ alternatives: [{ term: не було́ }, { term: не бу́де }] }, " with the genitive"], es: [{ alternatives: [{ term: не було́ }, { term: не бу́де }] }, " con el genitivo"] }
            ex: { examples: [["У мене́ ", { target: не було́ ча́су }, "."], ["У нас ", { target: не бу́де уро́ку }, "."]] }
            tr: { en: { examples: ["I didn't have time.", "We won't have a class."] }, es: { examples: ["No tuve tiempo.", "No tendremos clase."] } }
