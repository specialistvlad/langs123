              pt: ["Em termos gramaticais, a pessoa depois de ", { term: у }, " fica no genitivo: ", { term: мене́ }, " é o genitivo de ", { term: я }, ", e ", { term: не́ї }, ", o de ", { term: вона́ }, "."]
