              en: ["In the past the verb agrees with the thing, not the person: ", { term: у мене́ була́ маши́на }, "."]
              es: ["En pasado, el verbo concuerda con lo que se tiene, no con la persona: ", { term: у мене́ була́ маши́на }, "."]

