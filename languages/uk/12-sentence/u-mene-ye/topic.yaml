        columns:
          - { key: use, label: { uk: Відповідь, en: Answer, es: Respuesta } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: A1
            use: { uk: { term: "Так, є" }, en: [{ term: "Так, є" }, " (yes)"], es: [{ term: "Так, є" }, " (sí)"] }
            ex: { exchange: ["У вас є ру́чка?", [{ target: "Так, є" }, "."]] }
            tr: { en: { exchange: ["Have you got a pen?", "Yes, I have."] }, es: { exchange: ["¿Tiene un bolígrafo?", "Sí, tengo."] } }
          - level: A2
            use: { uk: { term: "Ні, нема́є" }, en: [{ term: "Ні, нема́є" }, " (no)"], es: [{ term: "Ні, нема́є" }, " (no)"] }
            ex: { exchange: ["У тебе́ є оліве́ць?", [{ target: "Ні, нема́є" }, "."]] }
            tr: { en: { exchange: ["Have you got a pencil?", "No, I haven't."] }, es: { exchange: ["¿Tienes un lápiz?", "No, no tengo."] } }
      - type: list
        items:
          - type: note
            level: A2
            text:
              uk: [{ term: "Ні, нема́є" }, " — готова коротка відповідь; заперечення з ", { term: нема́є }, " і родовим відмінком — нижче, на рівні B1."]
              en: [{ term: "Ні, нема́є" }, " is a set short answer; the negative with ", { term: нема́є }, " and the genitive comes below, at B1."]
              es: [{ term: "Ні, нема́є" }, " es una respuesta corta fija; la negación con ", { term: нема́є }, " y el genitivo viene más abajo, en B1."]

  - title: { uk: "Заперечення: немає", en: "Negative: немає", es: "Negación: немає" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            form: { uk: [{ term: нема́є }, " і родовий"], en: [{ term: нема́є }, " with the genitive"], es: [{ term: нема́є }, " con el genitivo"] }
            ex: { examples: [["У мене́ нема́є ", { target: бра́та }, "."], ["У нас нема́є ", { target: ча́су }, "."]] }
            tr: { en: { examples: ["I haven't got a brother.", "We haven't got time."] }, es: { examples: ["No tengo hermano.", "No tenemos tiempo."] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: Нема́є }, " стоїть замість ", { term: є }, ", а те, чого немає, переходить у родовий відмінок."]
              en: [{ term: Нема́є }, " replaces ", { term: є }, ", and what someone does not have goes into the genitive."]
              es: [{ term: Нема́є }, " sustituye a ", { term: є }, ", y lo que no se tiene pasa al genitivo."]
          - type: note
            level: B1
            text:
              uk: ["Форми родового відмінка: ", { link: Родовий відмінок, to: uk.nouns-cases.genitive }, "."]
              en: ["The genitive forms: ", { link: Genitive Case, to: uk.nouns-cases.genitive }, "."]
              es: ["Las formas del genitivo: ", { link: El caso genitivo, to: uk.nouns-cases.genitive }, "."]

  - title: { uk: Минулий і майбутній час, en: Past and future, es: Pasado y futuro }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { uk: Форма, en: Form, es: Forma } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            form: { uk: [{ term: був }, ": чоловічий рід"], en: [{ term: був }, ": masculine"], es: [{ term: був }, ": masculino"] }
            ex: ["У нас ", { target: був }, " кіт."]
            tr: { en: "We had a cat.", es: "Teníamos un gato." }
          - level: B1
            form: { uk: [{ term: була́ }, ": жіночий рід"], en: [{ term: була́ }, ": feminine"], es: [{ term: була́ }, ": femenino"] }
