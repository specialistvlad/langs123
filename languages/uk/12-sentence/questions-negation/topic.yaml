            text:
              uk: "Питання має той самий порядок слів, що й ствердження. У розмові його показує інтонація: голос іде вгору."
              en: "A question has the same word order as a statement. In speech the rising voice makes it a question."
              es: "La pregunta tiene el mismo orden que la afirmación. Al hablar, la voz que sube la convierte en pregunta."
              pt: "A pergunta tem a mesma ordem de palavras da afirmação. Na fala, a voz que sobe a transforma em pergunta."
              fr: "La question a le même ordre des mots que l’affirmation. À l’oral, la voix qui monte en fait une question."
              de: "Eine Frage hat dieselbe Wortstellung wie eine Aussage. Beim Sprechen macht die steigende Stimme sie zur Frage."
              it: "La domanda ha lo stesso ordine delle parole dell'affermazione. Nel parlato è la voce che sale a farne una domanda."
              pl: "Pytanie ma ten sam szyk wyrazów co zdanie oznajmujące. W mowie pytaniem czyni je głos idący w górę."
              tr: "Soru cümlesinin sözcük sırası olumlu cümleyle aynıdır. Konuşmada yükselen ses onu soru yapar."
              id: "Pertanyaan memiliki urutan kata yang sama dengan kalimat pernyataan. Dalam percakapan, suara yang naik menjadikannya pertanyaan."
              vi: "Câu hỏi có trật tự từ giống câu khẳng định. Khi nói, giọng lên cao biến nó thành câu hỏi."
