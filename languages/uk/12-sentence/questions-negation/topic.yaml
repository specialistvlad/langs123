summary:
  lead:
    uk: ["Питання будуємо інтонацією, словом ", { term: чи }, " або питальним словом на початку, а заперечення — часткою ", { term: не }, " перед дієсловом."]
    en: ["A question needs only a rising voice, ", { term: чи }, " or a question word at the start; a negative puts ", { term: не }, " before the verb."]
    es: ["Una pregunta se hace con la entonación, con ", { term: чи }, " o con una palabra interrogativa al principio; la negación pone ", { term: не }, " delante del verbo."]
    pt: ["A pergunta se faz com a entonação, com ", { term: чи }, " ou com uma palavra interrogativa no início; a negação põe ", { term: не }, " antes do verbo."]
    fr: ["La question se forme avec l’intonation, ", { term: чи }, " ou un mot interrogatif au début ; la négation place ", { term: не }, " devant le verbe."]
    de: ["Eine Frage entsteht durch die Intonation, durch ", { term: чи }, " oder ein Fragewort am Anfang; die Verneinung setzt ", { term: не }, " vor das Verb."]
    it: ["La domanda si forma con l'intonazione, con ", { term: чи }, " o con una parola interrogativa all'inizio; la negazione mette ", { term: не }, " davanti al verbo."]
    pl: ["Pytanie tworzymy intonacją, słowem ", { term: чи }, " lub wyrazem pytającym na początku, a przeczenie — partykułą ", { term: не }, " przed czasownikiem."]
    tr: ["Soru, tonlamayla, ", { term: чи }, " ile ya da başta duran bir soru sözcüğüyle kurulur; olumsuzluk için fiilin önüne ", { term: не }, " konur."]
    id: ["Pertanyaan dibentuk dengan intonasi, ", { term: чи }, ", atau kata tanya di awal; kalimat negatif menaruh ", { term: не }, " sebelum kata kerja."]
    vi: ["Câu hỏi được tạo bằng ngữ điệu, ", { term: чи }, " hoặc từ để hỏi ở đầu câu; phủ định đặt ", { term: не }, " trước động từ."]
  rule:
    uk: ["У питанні порядок слів не змінюється, а ", { term: не }, " стоїть перед дієсловом:"]
    en: ["A question keeps the word order of a statement, and ", { term: не }, " goes before the verb:"]
    es: ["La pregunta mantiene el orden de la afirmación, y ", { term: не }, " va delante del verbo:"]
    pt: ["A pergunta mantém a ordem da afirmação, e ", { term: не }, " vai antes do verbo:"]
    fr: ["La question garde l’ordre de l’affirmation, et ", { term: не }, " se place devant le verbe :"]
    de: ["Die Frage behält die Wortstellung der Aussage, und ", { term: не }, " steht vor dem Verb:"]
    it: ["La domanda mantiene l'ordine dell'affermazione, e ", { term: не }, " va davanti al verbo:"]
    pl: ["Pytanie zachowuje szyk zdania oznajmującego, a ", { term: не }, " stoi przed czasownikiem:"]
    tr: ["Soru, olumlu cümlenin sözcük sırasını korur; ", { term: не }, " fiilin önüne gelir:"]
    id: ["Pertanyaan mempertahankan urutan kata kalimat pernyataan, dan ", { term: не }, " berada sebelum kata kerja:"]
    vi: ["Câu hỏi giữ trật tự từ của câu khẳng định, và ", { term: не }, " đứng trước động từ:"]
