# yaml-language-server: $schema=../../../schema/topic.schema.json
id: uk.sentence.when-if
lang: uk
kind: grammar
tags: [time-clauses, conditionals, koly, yakshcho, yakby]
concepts: [conditionals]
related: [uk.future-imperative-conditional.conditional, uk.future-imperative-conditional.future-compound, uk.past-aspect.aspect, uk.sentence.conjunctions]
status: { uk: draft, en: draft, es: draft }
translated: { en: "326f87 3a1feb 6e26d0 d03785 07e7eb faf369 35e60a", es: "326f87 3a1feb 6e26d0 d03785 07e7eb faf369 35e60a" }

title: { uk: "Коли, якщо, якби", en: "When and If: коли, якщо, якби", es: "Cuándo y si: коли, якщо, якби" }
summary:
  lead:
    uk: [{ term: Коли́ }, " називає час, ", { term: якщо́ }, " — реальну умову, ", { term: якби́ }, " — нереальну умову з минулим часом і ", { term: би }, "."]
    en: [{ term: Коли́ }, " names a time, ", { term: якщо́ }, " a real condition, and ", { term: якби́ }, " an unreal condition, with the past tense and ", { term: би }, "."]
    es: [{ term: Коли́ }, " expresa el tiempo, ", { term: якщо́ }, " una condición real, y ", { term: якби́ }, " una condición irreal, con el pasado y ", { term: би }, "."]
  rule:
    uk: ["Про майбутнє після ", { term: якщо́ }, " і ", { term: коли́ }, " вживаємо майбутній час:"]
    en: ["About the future, ", { term: якщо́ }, " and ", { term: коли́ }, " take the future tense:"]
    es: ["Para el futuro, ", { term: якщо́ }, " y ", { term: коли́ }, " llevan el futuro:"]
  ex: { examples: [[{ target: Якщо́ пі́де }, " дощ, ми зали́шимося вдо́ма."], [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Сполучник, en: Conjunction, es: Conector } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: коли́
          rule:
            uk: "дії одночасні: недоконаний вид"
            en: "things happening at the same time: the imperfective"
            es: "acciones simultáneas: el imperfectivo"
          ex: [{ target: Коли́ }, " ми йшли до університе́ту, пішо́в дощ."]
          tr: { en: "As we were walking to the university, it started to rain.", es: "Cuando íbamos a la universidad, empezó a llover." }
        - level: B1
          point: коли́
          rule:
            uk: "одна дія після іншої: доконаний вид"
            en: "one thing after another: the perfective"
            es: "una acción tras otra: el perfectivo"
          ex: [{ target: Коли́ }, " ми прийшли́, уро́к уже́ поча́вся."]
          tr: { en: "When we arrived, the class had already started.", es: "Cuando llegamos, la clase ya había empezado." }
        - level: B1
          point: коли́
          rule:
            uk: "про майбутнє: майбутній час"
            en: "about the future: the future tense"
            es: "sobre el futuro: el futuro"
          ex: [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]
          tr: { en: "When you come, we'll have lunch.", es: "Cuando vengas, comeremos." }
        - level: B1
          point: якщо́
          rule:
            uk: ["реальна умова; друга частина часто з ", { term: то }]
            en: ["a real condition; the main clause often opens with ", { term: то }]
            es: ["condición real; la principal a menudo empieza con ", { term: то }]
          ex: [{ target: Якщо́ }, " ви ви́вчите слова́, ", { target: то }, " ле́гко зрозумі́єте текст."]
          tr: { en: "If you learn the words, you'll understand the text easily.", es: "Si aprenden las palabras, entenderán el texto fácilmente." }
        - level: B1
          point: якщо́
          rule:
            uk: "загальна правда: теперішній час"
            en: "a general truth: the present tense"
            es: "una verdad general: el presente"
          ex: [{ target: Якщо́ }, " йде дощ, ми сидимо́ вдо́ма."]
          tr: { en: "If it rains, we stay at home.", es: "Si llueve, nos quedamos en casa." }
        - level: B1
          point: якби́
          rule:
            uk: ["нереальна умова: минулий час і ", { term: би }]
            en: ["an unreal condition: the past tense and ", { term: би }]
            es: ["condición irreal: el pasado y ", { term: би }]
          ex: [{ target: Якби́ }, " я мав час, я ", { target: пої́хав би }, " до Льво́ва."]
          tr: { en: "If I had time, I would go to Lviv.", es: "Si tuviera tiempo, iría a Leópolis." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: ["після ", { term: якщо́ }, " про майбутнє — майбутній час"]
            en: ["after ", { term: якщо́ }, " about the future, the future tense"]
            es: ["después de ", { term: якщо́ }, " sobre el futuro, el futuro"]
          ex: [{ target: Якщо́ за́втра пі́де }, " дощ, ми зали́шимося вдо́ма."]
          tr: { en: "If it rains tomorrow, we'll stay at home.", es: "Si mañana llueve, nos quedaremos en casa." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa }
          rule:
            uk: [{ term: би }, " і в головній частині"]
            en: [{ term: би }, " in the main clause too"]
            es: [{ term: би }, " también en la principal"]
          ex: ["Якби́ я знав, я ", { target: прийшо́в би }, "."]
          tr: { en: "If I'd known, I would have come.", es: "Si lo hubiera sabido, habría venido." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: Коли́ }, " відповідає на питання «коли?», ", { term: якщо́ }, " і ", { term: якби́ }, " — «за якої умови?»."]
              en: [{ term: Коли́ }, " answers “when?”; ", { term: якщо́ }, " and ", { term: якби́ }, " answer “on what condition?”."]
              es: [{ term: Коли́ }, " responde a «¿cuándo?»; ", { term: якщо́ }, " y ", { term: якби́ }, ", a «¿con qué condición?»."]
          - type: rule
            level: B1
            text:
              uk: "Частини речення розділяємо комою, яка б із них не стояла першою."
              en: "A comma separates the two clauses, whichever comes first."
              es: "Una coma separa las dos oraciones, vaya primero la que vaya."
            ex: ["Ми зали́шимося вдо́ма", { target: ", якщо́" }, " пі́де дощ."]
            tr: { en: "We'll stay at home if it rains.", es: "Nos quedaremos en casa si llueve." }

  - title: { uk: "Коли: час", en: "Коли: time", es: "Коли: el tiempo" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            use: { uk: "одночасні дії: недоконаний вид", en: "at the same time: the imperfective", es: "al mismo tiempo: el imperfectivo" }
            ex: [{ target: Коли́ }, " ми йшли до університе́ту, виклада́ч повідо́мив про змі́ни в ро́зкладі."]
            tr: { en: "While we were walking to the university, the teacher told us about changes to the timetable.", es: "Mientras íbamos a la universidad, el profesor nos avisó de cambios en el horario." }
          - level: B1
            use: { uk: "одна дія після іншої: доконаний вид", en: "one after the other: the perfective", es: "una tras otra: el perfectivo" }
            ex: [{ target: Коли́ }, " ми прийшли́ до університе́ту, виклада́ч повідо́мив про змі́ни в ро́зкладі."]
            tr: { en: "When we got to the university, the teacher told us about changes to the timetable.", es: "Cuando llegamos a la universidad, el profesor nos avisó de cambios en el horario." }
          - level: B1
            use: { uk: "майбутнє: майбутній час", en: "the future: the future tense", es: "el futuro: el futuro" }
            ex: [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]
            tr: { en: "When you come, we'll have lunch.", es: "Cuando vengas, comeremos." }
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: ["Вид дієслова: ", { link: "Вид дієслова", to: uk.past-aspect.aspect }, "."]
              en: ["Aspect: ", { link: "Perfective and Imperfective, Pairs", to: uk.past-aspect.aspect }, "."]
              es: ["El aspecto: ", { link: "Aspecto", to: uk.past-aspect.aspect }, "."]

  - title: { uk: "Якщо: реальна умова", en: "Якщо: a real condition", es: "Якщо: la condición real" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            use: { uk: "майбутнє: майбутній час в обох частинах", en: "the future: the future tense in both clauses", es: "el futuro: el futuro en las dos oraciones" }
            ex: [{ target: Якщо́ }, " ви ви́вчите слова́, ", { target: то }, " ле́гко зрозумі́єте текст."]
            tr: { en: "If you learn the words, you'll understand the text easily.", es: "Si aprenden las palabras, entenderán el texto fácilmente." }
          - level: B1
            use: { uk: "загальна правда, звичка: теперішній час", en: "a general truth, a habit: the present tense", es: "una verdad general, un hábito: el presente" }
            ex: [{ target: Якщо́ }, " йде дощ, ми сидимо́ вдо́ма."]
            tr: { en: "If it rains, we stay at home.", es: "Si llueve, nos quedamos en casa." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Головна частина після підрядної може починатися з ", { term: то }, "."]
              en: ["After the if-clause, the main clause may open with ", { term: то }, " (then)."]
              es: ["Después de la condición, la principal puede empezar con ", { term: то }, " (entonces)."]

  - title: { uk: "Якби: нереальна умова", en: "Якби: an unreal condition", es: "Якби: la condición irreal" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo } }
        rows:
          - level: B1
            use: { uk: ["зараз: ", { term: якби́ }, ", минулий час і ", { term: би }], en: ["now: ", { term: якби́ }, ", the past tense and ", { term: би }], es: ["ahora: ", { term: якби́ }, ", el pasado y ", { term: би }] }
            ex: [{ target: Якби́ }, " я мав час, я ", { target: пої́хав би }, " до Льво́ва."]
            tr: { en: "If I had time, I would go to Lviv.", es: "Si tuviera tiempo, iría a Leópolis." }
          - level: B1
            use: { uk: "у минулому: ті самі форми", en: "in the past: the same forms", es: "en el pasado: las mismas formas" }
            ex: [{ target: Якби́ }, " ви ви́вчили слова́, то ", { target: зрозумі́ли б }, " текст."]
            tr: { en: "If you had learned the words, you would have understood the text.", es: "Si hubieran aprendido las palabras, habrían entendido el texto." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: Якби́ }, " вже містить ", { term: би }, "; у головній частині ставимо ", { term: би }, " після приголосного й ", { term: б }, " після голосного."]
              en: [{ term: Якби́ }, " already holds ", { term: би }, "; the main clause takes ", { term: би }, " after a consonant and ", { term: б }, " after a vowel."]
              es: [{ term: Якби́ }, " ya contiene ", { term: би }, "; la principal lleva ", { term: би }, " después de consonante y ", { term: б }, " después de vocal."]
            ex: { examples: [["я ", { target: пої́хав би }], ["ми ", { target: пої́хали б }]] }
            tr: { en: { examples: ["I would go", "we would go"] }, es: { examples: ["yo iría", "nosotros iríamos"] } }
          - type: note
            level: B1
            text:
              uk: [{ term: Коли́ б }, " означає те саме, що ", { term: якби́ }, ". Форми з ", { term: би }, ": ", { link: "Умовний спосіб", to: uk.future-imperative-conditional.conditional }, "."]
              en: [{ term: Коли́ б }, " means the same as ", { term: якби́ }, ". The forms with ", { term: би }, ": ", { link: "Conditional with би", to: uk.future-imperative-conditional.conditional }, "."]
              es: [{ term: Коли́ б }, " significa lo mismo que ", { term: якби́ }, ". Las formas con ", { term: би }, ": ", { link: "Condicional", to: uk.future-imperative-conditional.conditional }, "."]

  - title: { uk: Типові помилки, en: Typical errors, es: Errores típicos }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Єслі бу́де час, я подзвоню́.", right: [{ target: Якщо́ }, " бу́де час, я подзвоню́."], rule: { uk: [{ term: якщо́ }, "; ", { term: єслі }, " — суржик з російським «если»"], en: [{ term: якщо́ }, "; ", { term: єслі }, " is a mix with the Russian «если»"], es: [{ term: якщо́ }, "; ", { term: єслі }, " es una mezcla con el ruso «если»"] } }
          - { level: B1, wrong: "Якщо́ би я знав, я прийшо́в би.", right: [{ target: Якби́ }, " я знав, я прийшо́в би."], rule: { uk: ["нереальна умова — ", { term: якби́ }, ", а не ", { term: якщо́ би }], en: ["an unreal condition takes ", { term: якби́ }, ", never ", { term: якщо́ би }], es: ["la condición irreal lleva ", { term: якби́ }, ", nunca ", { term: якщо́ би }] } }
          - { level: B1, speakers: [en, es], wrong: "Якщо́ за́втра йде дощ, ми зали́шимося вдо́ма.", right: ["Якщо́ за́втра ", { target: пі́де }, " дощ, ми зали́шимося вдо́ма."], rule: { en: ["about the future, ", { term: якщо́ }, " takes the future tense, not the present as in English"], es: ["para el futuro, ", { term: якщо́ }, " lleva el futuro, no el presente como en español"] } }
          - { level: B1, speakers: [en, es], wrong: "Коли́ ти прихо́диш, ми пообі́даємо.", right: ["Коли́ ти ", { target: при́йдеш }, ", ми пообі́даємо."], rule: { en: ["about the future, ", { term: коли́ }, " takes the future tense"], es: ["para el futuro, ", { term: коли́ }, " lleva el futuro, no el presente ni el subjuntivo"] } }
          - { level: B1, speakers: [en], wrong: "Якби́ я знав, я прийшо́в.", right: ["Якби́ я знав, я ", { target: прийшо́в би }, "."], rule: { en: ["“would” is ", { term: би }, " with the past tense in the main clause"] } }
