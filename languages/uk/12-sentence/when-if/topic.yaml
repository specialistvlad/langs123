              pt: ["O aspecto verbal: ", { link: "Aspecto: perfectivo e imperfectivo", to: uk.past-aspect.aspect }, "."]
              fr: ["L’aspect verbal : ", { link: "L’aspect : perfectif et imperfectif", to: uk.past-aspect.aspect }, "."]
              de: ["Der Aspekt: ", { link: "Aspekt: perfektiv und imperfektiv", to: uk.past-aspect.aspect }, "."]
              it: ["L’aspetto verbale: ", { link: "Aspetto: perfettivo e imperfettivo", to: uk.past-aspect.aspect }, "."]
              pl: ["Aspekt czasownika: ", { link: "Aspekt: dokonany i niedokonany", to: uk.past-aspect.aspect }, "."]
              tr: ["Görünüş: ", { link: "Görünüş: tamamlanmış ve tamamlanmamış", to: uk.past-aspect.aspect }, "."]
              id: ["Aspek kata kerja: ", { link: "Aspek: perfektif dan imperfektif", to: uk.past-aspect.aspect }, "."]
              vi: ["Thể của động từ: ", { link: "Thể của động từ: hoàn thành và chưa hoàn thành", to: uk.past-aspect.aspect }, "."]

