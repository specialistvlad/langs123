          tr: { en: "If I'd known, I would have come.", es: "Si lo hubiera sabido, habría venido.", pt: "Se eu soubesse, teria vindo.", fr: "Si j’avais su, je serais venu.", de: "Wenn ich es gewusst hätte, wäre ich gekommen.", it: "Se l’avessi saputo, sarei venuto.", pl: "Gdybym wiedział, przyszedłbym.", tr: "Bilseydim gelirdim.", id: "Seandainya saya tahu, saya pasti sudah datang.", vi: "Nếu tôi biết, tôi đã đến rồi." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: Коли́ }, " відповідає на питання «коли?», ", { term: якщо́ }, " і ", { term: якби́ }, " — «за якої умови?»."]
              en: [{ term: Коли́ }, " answers “when?”; ", { term: якщо́ }, " and ", { term: якби́ }, " answer “on what condition?”."]
              es: [{ term: Коли́ }, " responde a «¿cuándo?»; ", { term: якщо́ }, " y ", { term: якби́ }, ", a «¿con qué condición?»."]
              pt: [{ term: Коли́ }, " responde a “quando?”; ", { term: якщо́ }, " e ", { term: якби́ }, ", a “sob que condição?”."]
              fr: [{ term: Коли́ }, " répond à « quand ? » ; ", { term: якщо́ }, " et ", { term: якби́ }, " répondent à « à quelle condition ? »."]
              de: [{ term: Коли́ }, " antwortet auf „wann?“; ", { term: якщо́ }, " und ", { term: якби́ }, " auf „unter welcher Bedingung?“."]
              it: [{ term: Коли́ }, " risponde a «quando?»; ", { term: якщо́ }, " e ", { term: якби́ }, " a «a quale condizione?»."]
              pl: [{ term: Коли́ }, " odpowiada na pytanie „kiedy?”, a ", { term: якщо́ }, " i ", { term: якби́ }, " — „pod jakim warunkiem?”."]
              tr: [{ term: Коли́ }, " “ne zaman?” sorusunu, ", { term: якщо́ }, " ve ", { term: якби́ }, " ise “hangi şartla?” sorusunu yanıtlar."]
              id: [{ term: Коли́ }, " menjawab “kapan?”; ", { term: якщо́ }, " dan ", { term: якби́ }, " menjawab “dengan syarat apa?”."]
              vi: [{ term: Коли́ }, " trả lời câu hỏi “khi nào?”; ", { term: якщо́ }, " và ", { term: якби́ }, " trả lời “với điều kiện nào?”."]
          - type: rule
            level: B1
            text:
              uk: "Частини речення розділяємо комою, яка б із них не стояла першою."
              en: "A comma separates the two clauses, whichever comes first."
              es: "Una coma separa las dos oraciones, vaya primero la que vaya."
              pt: "Uma vírgula separa as duas orações, qualquer que seja a primeira."
              fr: "Une virgule sépare les deux propositions, quelle que soit celle qui vient en premier."
              de: "Ein Komma trennt die beiden Teilsätze, gleich welcher zuerst steht."
              it: "Una virgola separa le due proposizioni, qualunque venga per prima."
              pl: "Przecinek oddziela oba zdania, niezależnie od tego, które jest pierwsze."
              tr: "Hangisi önce gelirse gelsin, iki cümleyi bir virgül ayırır."
              id: "Sebuah koma memisahkan kedua klausa, mana pun yang datang lebih dulu."
              vi: "Một dấu phẩy ngăn cách hai mệnh đề, bất kể mệnh đề nào đứng trước."
            ex: ["Ми зали́шимося вдо́ма", { target: ", якщо́" }, " пі́де дощ."]
            tr: { en: "We'll stay at home if it rains.", es: "Nos quedaremos en casa si llueve.", pt: "Ficaremos em casa se chover.", fr: "Nous resterons à la maison s’il pleut.", de: "Wir bleiben zu Hause, wenn es regnet.", it: "Resteremo a casa se piove.", pl: "Zostaniemy w domu, jeśli będzie padać.", tr: "Yağmur yağarsa evde kalırız.", id: "Kami akan tinggal di rumah kalau hujan.", vi: "Chúng tôi sẽ ở nhà nếu trời mưa." }

  - title: { uk: "Коли: час", en: "Коли: time", es: "Коли: el tiempo", pt: "Коли: o momento", fr: "Коли : le moment", de: "Коли: die Zeit", it: "Коли: il tempo", pl: "Коли: czas", tr: "Коли: zaman", id: "Коли: waktu", vi: "Коли: thời gian" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Вживання, en: Use, es: Uso, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B1
            use: { uk: "одночасні дії: недоконаний вид", en: "at the same time: the imperfective", es: "al mismo tiempo: el imperfectivo", pt: "ao mesmo tempo: aspecto imperfectivo", fr: "en même temps : aspect imperfectif", de: "gleichzeitig: imperfektiver Aspekt", it: "nello stesso tempo: aspetto imperfettivo", pl: "równocześnie: aspekt niedokonany", tr: "eş zamanlı: tamamlanmamış görünüş", id: "bersamaan: aspek imperfektif", vi: "cùng lúc: thể chưa hoàn thành" }
            ex: [{ target: Коли́ }, " ми йшли до університе́ту, виклада́ч повідо́мив про змі́ни в ро́зкладі."]
            tr: { en: "While we were walking to the university, the teacher told us about changes to the timetable.", es: "Mientras íbamos a la universidad, el profesor nos avisó de cambios en el horario.", pt: "Enquanto íamos para a universidade, o professor nos avisou de mudanças no horário.", fr: "Pendant que nous allions à l’université, le professeur nous a informés de changements d’horaire.", de: "Als wir zur Universität gingen, teilte uns der Lehrer Änderungen im Stundenplan mit.", it: "Mentre andavamo all’università, l’insegnante ci ha comunicato dei cambiamenti nell’orario.", pl: "Gdy szliśmy na uniwersytet, nauczyciel poinformował nas o zmianach w planie zajęć.", tr: "Üniversiteye giderken öğretmen bize ders programındaki değişiklikleri bildirdi.", id: "Saat kami berjalan ke universitas, guru memberi tahu kami tentang perubahan jadwal.", vi: "Khi chúng tôi đang đi đến trường đại học, giáo viên thông báo về những thay đổi trong thời khóa biểu." }
          - level: B1
            use: { uk: "одна дія після іншої: доконаний вид", en: "one after the other: the perfective", es: "una tras otra: el perfectivo", pt: "uma depois da outra: aspecto perfectivo", fr: "l’une après l’autre : aspect perfectif", de: "nacheinander: perfektiver Aspekt", it: "una dopo l’altra: aspetto perfettivo", pl: "jedna po drugiej: aspekt dokonany", tr: "art arda: tamamlanmış görünüş", id: "berurutan: aspek perfektif", vi: "lần lượt: thể hoàn thành" }
            ex: [{ target: Коли́ }, " ми прийшли́ до університе́ту, виклада́ч повідо́мив про змі́ни в ро́зкладі."]
            tr: { en: "When we got to the university, the teacher told us about changes to the timetable.", es: "Cuando llegamos a la universidad, el profesor nos avisó de cambios en el horario.", pt: "Quando chegamos à universidade, o professor nos avisou de mudanças no horário.", fr: "Quand nous sommes arrivés à l’université, le professeur nous a informés de changements d’horaire.", de: "Als wir an der Universität ankamen, teilte uns der Lehrer Änderungen im Stundenplan mit.", it: "Quando siamo arrivati all’università, l’insegnante ci ha comunicato dei cambiamenti nell’orario.", pl: "Gdy przyszliśmy na uniwersytet, nauczyciel poinformował nas o zmianach w planie zajęć.", tr: "Üniversiteye vardığımızda öğretmen bize ders programındaki değişiklikleri bildirdi.", id: "Ketika kami sampai di universitas, guru memberi tahu kami tentang perubahan jadwal.", vi: "Khi chúng tôi đến trường đại học, giáo viên thông báo về những thay đổi trong thời khóa biểu." }
          - level: B1
            use: { uk: "майбутнє: майбутній час", en: "the future: the future tense", es: "el futuro: el futuro", pt: "o futuro: o tempo futuro", fr: "le futur : le temps futur", de: "die Zukunft: das Futur", it: "il futuro: il tempo futuro", pl: "przyszłość: czas przyszły", tr: "gelecek: gelecek zaman", id: "masa depan: bentuk masa depan", vi: "tương lai: thì tương lai" }
            ex: [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]
            tr: { en: "When you come, we'll have lunch.", es: "Cuando vengas, comeremos.", pt: "Quando você vier, almoçaremos.", fr: "Quand tu viendras, nous déjeunerons.", de: "Wenn du kommst, essen wir zu Mittag.", it: "Quando verrai, pranzeremo.", pl: "Gdy przyjdziesz, zjemy obiad.", tr: "Geldiğinde öğle yemeği yiyeceğiz.", id: "Ketika kamu datang, kita akan makan siang.", vi: "Khi bạn đến, chúng ta sẽ ăn trưa." }
      - type: list
        items:
          - type: note
            level: B1
            text:
              uk: ["Вид дієслова: ", { link: "Вид дієслова", to: uk.past-aspect.aspect }, "."]
