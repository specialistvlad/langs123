            tr: { en: "While the children are sleeping, I'm making breakfast.", es: "Mientras los niños duermen, preparo el desayuno.", pt: "Enquanto as crianças dormem, eu preparo o café da manhã.", fr: "Pendant que les enfants dorment, je prépare le petit-déjeuner.", de: "Während die Kinder schlafen, mache ich das Frühstück.", it: "Mentre i bambini dormono, preparo la colazione.", pl: "Gdy dzieci śpią, przygotowuję śniadanie.", tr: "Çocuklar uyurken ben kahvaltıyı hazırlıyorum.", id: "Selama anak-anak tidur, saya menyiapkan sarapan.", vi: "Trong lúc bọn trẻ ngủ, tôi chuẩn bị bữa sáng." }
          - level: B2
            use: { uk: ["дія встигає до події: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " і доконане майбутнє"], en: ["an action finishes before an event: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " and the perfective future"], es: ["la acción termina antes del suceso: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " y el futuro perfectivo"], pt: ["a ação termina antes do evento: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " e futuro perfectivo"], fr: ["l’action s’achève avant l’événement : ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " et futur perfectif"], de: ["die Handlung wird vor dem Ereignis fertig: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " und perfektives Futur"], it: ["l’azione si conclude prima dell’evento: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " e futuro perfettivo"], pl: ["czynność kończy się przed zdarzeniem: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " i czas przyszły dokonany"], tr: ["eylem olaydan önce biter: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " ve tamamlanmış görünüşlü gelecek zaman"], id: ["tindakan selesai sebelum suatu peristiwa: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " dan bentuk masa depan perfektif"], vi: ["hành động xong trước khi có sự kiện: ", { alternatives: [{ term: по́ки }, { term: до́ки }] }, " và thì tương lai thể hoàn thành"] }
            ex: [{ target: По́ки суп закипи́ть }, ", я наріжу́ хліб."]
            tr: { en: "Before the soup boils, I'll slice the bread.", es: "Antes de que hierva la sopa, cortaré el pan.", pt: "Antes de a sopa ferver, vou cortar o pão.", fr: "Avant que la soupe ne bouille, je couperai le pain.", de: "Bevor die Suppe kocht, schneide ich das Brot.", it: "Prima che la zuppa bolla, taglierò il pane.", pl: "Zanim zupa się zagotuje, pokroję chleb.", tr: "Çorba kaynamadan önce ekmeği keseceğim.", id: "Sebelum sup mendidih, saya akan memotong roti.", vi: "Trước khi canh sôi, tôi sẽ thái bánh mì." }
          - level: B2
