            ex: { examples: [["Чека́й, ", { target: по́ки не при́йде }, " авто́бус."], ["Ми чека́ли, ", { target: по́ки не закі́нчився }, " дощ."]] }
            tr: { en: { examples: ["Wait until the bus comes.", "We waited until the rain stopped."] }, es: { examples: ["Espera hasta que llegue el autobús.", "Esperamos hasta que dejó de llover."] }, pt: { examples: ["Espere até o ônibus chegar.", "Esperamos até a chuva parar."] }, fr: { examples: ["Attends que le bus arrive.", "Nous avons attendu que la pluie s’arrête."] }, de: { examples: ["Warte, bis der Bus kommt.", "Wir haben gewartet, bis der Regen aufgehört hat."] }, it: { examples: ["Aspetta finché non arriva l’autobus.", "Abbiamo aspettato finché non ha smesso di piovere."] }, pl: { examples: ["Czekaj, aż przyjedzie autobus.", "Czekaliśmy, aż przestało padać."] }, tr: { examples: ["Otobüs gelene kadar bekle.", "Yağmur dinene kadar bekledik."] }, id: { examples: ["Tunggu sampai bus datang.", "Kami menunggu sampai hujan berhenti."] }, vi: { examples: ["Cứ đợi đến khi xe buýt tới.", "Chúng tôi đã đợi đến khi mưa tạnh."] } }
