title: { uk: "Коли, якщо, якби", en: "When and If: коли, якщо, якби", es: "Cuándo y si: коли, якщо, якби", pt: "Quando e se: коли, якщо, якби", fr: "Quand et si : коли, якщо, якби", de: "Wann und wenn: коли, якщо, якби", it: "Quando e se: коли, якщо, якби", pl: "Kiedy i jeśli: коли, якщо, якби", tr: "Zaman ve şart: коли, якщо, якби", id: "Ketika dan jika: коли, якщо, якби", vi: "Khi và nếu: коли, якщо, якби" }
summary:
  lead:
    uk: [{ term: Коли́ }, " називає час, ", { term: якщо́ }, " — реальну умову, ", { term: якби́ }, " — нереальну умову з минулим часом і ", { term: би }, "."]
    en: [{ term: Коли́ }, " names a time, ", { term: якщо́ }, " a real condition, and ", { term: якби́ }, " an unreal condition, with the past tense and ", { term: би }, "."]
    es: [{ term: Коли́ }, " expresa el tiempo, ", { term: якщо́ }, " una condición real, y ", { term: якби́ }, " una condición irreal, con el pasado y ", { term: би }, "."]
    pt: [{ term: Коли́ }, " expressa o tempo, ", { term: якщо́ }, " uma condição real e ", { term: якби́ }, " uma condição irreal, com o passado e ", { term: би }, "."]
    fr: [{ term: Коли́ }, " exprime le temps, ", { term: якщо́ }, " une condition réelle et ", { term: якби́ }, " une condition irréelle, avec le passé et ", { term: би }, "."]
    de: [{ term: Коли́ }, " nennt die Zeit, ", { term: якщо́ }, " eine reale und ", { term: якби́ }, " eine irreale Bedingung, mit der Vergangenheit und ", { term: би }, "."]
    it: [{ term: Коли́ }, " indica il tempo, ", { term: якщо́ }, " una condizione reale e ", { term: якби́ }, " una condizione irreale, con il passato e ", { term: би }, "."]
    pl: [{ term: Коли́ }, " wyraża czas, ", { term: якщо́ }, " — warunek realny, a ", { term: якби́ }, " — warunek nierealny, z czasem przeszłym i ", { term: би }, "."]
    tr: [{ term: Коли́ }, " zamanı, ", { term: якщо́ }, " gerçek şartı, ", { term: якби́ }, " ise geçmiş zaman ve ", { term: би }, " ile gerçek dışı şartı bildirir."]
    id: [{ term: Коли́ }, " menyatakan waktu, ", { term: якщо́ }, " syarat nyata, dan ", { term: якби́ }, " syarat tidak nyata, dengan bentuk lampau dan ", { term: би }, "."]
    vi: [{ term: Коли́ }, " chỉ thời gian, ", { term: якщо́ }, " chỉ điều kiện có thật, còn ", { term: якби́ }, " chỉ điều kiện không có thật, đi với quá khứ và ", { term: би }, "."]
  rule:
    uk: ["Про майбутнє після ", { term: якщо́ }, " і ", { term: коли́ }, " вживаємо майбутній час:"]
    en: ["About the future, ", { term: якщо́ }, " and ", { term: коли́ }, " take the future tense:"]
    es: ["Para el futuro, ", { term: якщо́ }, " y ", { term: коли́ }, " llevan el futuro:"]
    pt: ["Para o futuro, ", { term: якщо́ }, " e ", { term: коли́ }, " levam o futuro:"]
    fr: ["Pour le futur, ", { term: якщо́ }, " et ", { term: коли́ }, " se construisent avec le futur :"]
    de: ["Für die Zukunft steht nach ", { term: якщо́ }, " und ", { term: коли́ }, " das Futur:"]
    it: ["Per il futuro, ", { term: якщо́ }, " e ", { term: коли́ }, " vogliono il futuro:"]
    pl: ["Mówiąc o przyszłości, po ", { term: якщо́ }, " i ", { term: коли́ }, " używamy czasu przyszłego:"]
    tr: ["Gelecek için ", { term: якщо́ }, " ve ", { term: коли́ }, " ile gelecek zaman kullanılır:"]
    id: ["Untuk masa depan, ", { term: якщо́ }, " dan ", { term: коли́ }, " memakai bentuk masa depan:"]
    vi: ["Khi nói về tương lai, sau ", { term: якщо́ }, " và ", { term: коли́ }, " dùng thì tương lai:"]
  ex: { examples: [[{ target: Якщо́ пі́де }, " дощ, ми зали́шимося вдо́ма."], [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { uk: Сполучник, en: Conjunction, es: Conector, pt: "Conjunção", fr: "Conjonction", de: "Konjunktion", it: "Congiunzione", pl: "Spójnik", tr: "Bağlaç", id: "Konjungsi", vi: "Liên từ" } }
        - { key: rule, label: { uk: Правило, en: Rule, es: Regla, pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B1
          point: коли́
          rule:
            uk: "дії одночасні: недоконаний вид"
            en: "things happening at the same time: the imperfective"
            es: "acciones simultáneas: el imperfectivo"
            pt: "ações simultâneas: aspecto imperfectivo"
            fr: "actions simultanées : aspect imperfectif"
            de: "gleichzeitige Handlungen: imperfektiver Aspekt"
            it: "azioni simultanee: aspetto imperfettivo"
            pl: "czynności równoczesne: aspekt niedokonany"
            tr: "eş zamanlı eylemler: tamamlanmamış görünüş"
            id: "tindakan bersamaan: aspek imperfektif"
            vi: "hành động đồng thời: thể chưa hoàn thành"
          ex: [{ target: Коли́ }, " ми йшли до університе́ту, пішо́в дощ."]
          tr: { en: "As we were walking to the university, it started to rain.", es: "Cuando íbamos a la universidad, empezó a llover.", pt: "Quando íamos para a universidade, começou a chover.", fr: "Alors que nous allions à l’université, il s’est mis à pleuvoir.", de: "Als wir zur Universität gingen, fing es an zu regnen.", it: "Mentre andavamo all’università, ha cominciato a piovere.", pl: "Gdy szliśmy na uniwersytet, zaczął padać deszcz.", tr: "Üniversiteye giderken yağmur başladı.", id: "Ketika kami berjalan ke universitas, hujan mulai turun.", vi: "Khi chúng tôi đang đi đến trường đại học thì trời bắt đầu mưa." }
        - level: B1
          point: коли́
          rule:
            uk: "одна дія після іншої: доконаний вид"
            en: "one thing after another: the perfective"
            es: "una acción tras otra: el perfectivo"
            pt: "uma ação depois da outra: aspecto perfectivo"
            fr: "une action après l’autre : aspect perfectif"
            de: "eine Handlung nach der anderen: perfektiver Aspekt"
            it: "un’azione dopo l’altra: aspetto perfettivo"
            pl: "jedna czynność po drugiej: aspekt dokonany"
            tr: "bir eylem ardından diğeri: tamamlanmış görünüş"
            id: "satu tindakan setelah yang lain: aspek perfektif"
            vi: "hành động này sau hành động kia: thể hoàn thành"
          ex: [{ target: Коли́ }, " ми прийшли́, уро́к уже́ поча́вся."]
          tr: { en: "When we arrived, the class had already started.", es: "Cuando llegamos, la clase ya había empezado.", pt: "Quando chegamos, a aula já tinha começado.", fr: "Quand nous sommes arrivés, le cours avait déjà commencé.", de: "Als wir ankamen, hatte der Unterricht schon begonnen.", it: "Quando siamo arrivati, la lezione era già iniziata.", pl: "Gdy przyszliśmy, lekcja już się zaczęła.", tr: "Geldiğimizde ders çoktan başlamıştı.", id: "Ketika kami tiba, pelajaran sudah dimulai.", vi: "Khi chúng tôi đến, buổi học đã bắt đầu rồi." }
        - level: B1
          point: коли́
          rule:
            uk: "про майбутнє: майбутній час"
            en: "about the future: the future tense"
            es: "sobre el futuro: el futuro"
            pt: "sobre o futuro: o tempo futuro"
            fr: "à propos du futur : le futur"
            de: "über die Zukunft: das Futur"
            it: "sul futuro: il tempo futuro"
            pl: "o przyszłości: czas przyszły"
            tr: "gelecek için: gelecek zaman"
            id: "tentang masa depan: bentuk masa depan"
            vi: "về tương lai: thì tương lai"
          ex: [{ target: Коли́ ти при́йдеш }, ", ми пообі́даємо."]
          tr: { en: "When you come, we'll have lunch.", es: "Cuando vengas, comeremos.", pt: "Quando você vier, almoçaremos.", fr: "Quand tu viendras, nous déjeunerons.", de: "Wenn du kommst, essen wir zu Mittag.", it: "Quando verrai, pranzeremo.", pl: "Gdy przyjdziesz, zjemy obiad.", tr: "Geldiğinde öğle yemeği yiyeceğiz.", id: "Ketika kamu datang, kita akan makan siang.", vi: "Khi bạn đến, chúng ta sẽ ăn trưa." }
        - level: B1
          point: якщо́
          rule:
            uk: ["реальна умова; друга частина часто з ", { term: то }]
            en: ["a real condition; the main clause often opens with ", { term: то }]
            es: ["condición real; la principal a menudo empieza con ", { term: то }]
            pt: ["condição real; a oração principal costuma começar com ", { term: то }]
            fr: ["condition réelle ; la principale commence souvent par ", { term: то }]
            de: ["reale Bedingung; der Hauptsatz beginnt oft mit ", { term: то }]
            it: ["condizione reale; la principale spesso comincia con ", { term: то }]
            pl: ["warunek realny; zdanie główne często zaczyna się od ", { term: то }]
            tr: ["gerçek şart; ana cümle çoğu zaman ", { term: то }, " ile başlar"]
            id: ["syarat nyata; induk kalimat sering dimulai dengan ", { term: то }]
            vi: ["điều kiện có thật; mệnh đề chính thường mở đầu bằng ", { term: то }]
          ex: [{ target: Якщо́ }, " ви ви́вчите слова́, ", { target: то }, " ле́гко зрозумі́єте текст."]
          tr: { en: "If you learn the words, you'll understand the text easily.", es: "Si aprenden las palabras, entenderán el texto fácilmente.", pt: "Se vocês aprenderem as palavras, entenderão o texto com facilidade.", fr: "Si vous apprenez les mots, vous comprendrez facilement le texte.", de: "Wenn Sie die Wörter lernen, verstehen Sie den Text leicht.", it: "Se imparate le parole, capirete facilmente il testo.", pl: "Jeśli nauczycie się słów, łatwo zrozumiecie tekst.", tr: "Sözcükleri öğrenirseniz metni kolayca anlarsınız.", id: "Jika kalian mempelajari kosakatanya, kalian akan mudah memahami teksnya.", vi: "Nếu các bạn học từ vựng, thì các bạn sẽ hiểu bài đọc dễ dàng." }
        - level: B1
          point: якщо́
          rule:
            uk: "загальна правда: теперішній час"
            en: "a general truth: the present tense"
            es: "una verdad general: el presente"
            pt: "verdade geral: o presente"
            fr: "vérité générale : le présent"
            de: "allgemeine Wahrheit: das Präsens"
            it: "verità generale: il presente"
            pl: "prawda ogólna: czas teraźniejszy"
            tr: "genel doğru: şimdiki zaman"
            id: "kebenaran umum: bentuk masa kini"
            vi: "chân lý chung: thì hiện tại"
          ex: [{ target: Якщо́ }, " йде дощ, ми сидимо́ вдо́ма."]
          tr: { en: "If it rains, we stay at home.", es: "Si llueve, nos quedamos en casa.", pt: "Se chove, ficamos em casa.", fr: "S’il pleut, nous restons à la maison.", de: "Wenn es regnet, bleiben wir zu Hause.", it: "Se piove, restiamo a casa.", pl: "Jeśli pada deszcz, siedzimy w domu.", tr: "Yağmur yağarsa evde otururuz.", id: "Kalau hujan, kami tinggal di rumah.", vi: "Nếu trời mưa, chúng tôi ở nhà." }
        - level: B1
          point: якби́
          rule:
            uk: ["нереальна умова: минулий час і ", { term: би }]
            en: ["an unreal condition: the past tense and ", { term: би }]
            es: ["condición irreal: el pasado y ", { term: би }]
            pt: ["condição irreal: o passado e ", { term: би }]
            fr: ["condition irréelle : le passé et ", { term: би }]
            de: ["irreale Bedingung: Vergangenheit und ", { term: би }]
            it: ["condizione irreale: il passato e ", { term: би }]
            pl: ["warunek nierealny: czas przeszły i ", { term: би }]
            tr: ["gerçek dışı şart: geçmiş zaman ve ", { term: би }]
            id: ["syarat tidak nyata: bentuk lampau dan ", { term: би }]
            vi: ["điều kiện không có thật: quá khứ và ", { term: би }]
          ex: [{ target: Якби́ }, " я мав час, я ", { target: пої́хав би }, " до Льво́ва."]
          tr: { en: "If I had time, I would go to Lviv.", es: "Si tuviera tiempo, iría a Leópolis.", pt: "Se eu tivesse tempo, iria a Lviv.", fr: "Si j’avais le temps, j’irais à Lviv.", de: "Wenn ich Zeit hätte, würde ich nach Lwiw fahren.", it: "Se avessi tempo, andrei a Leopoli.", pl: "Gdybym miał czas, pojechałbym do Lwowa.", tr: "Vaktim olsaydı Lviv’e giderdim.", id: "Seandainya saya punya waktu, saya akan pergi ke Lviv.", vi: "Nếu tôi có thời gian, tôi sẽ đi Lviv." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: ["після ", { term: якщо́ }, " про майбутнє — майбутній час"]
            en: ["after ", { term: якщо́ }, " about the future, the future tense"]
            es: ["después de ", { term: якщо́ }, " sobre el futuro, el futuro"]
            pt: ["depois de ", { term: якщо́ }, ", sobre o futuro, o tempo futuro"]
            fr: ["après ", { term: якщо́ }, ", à propos du futur, le futur"]
            de: ["nach ", { term: якщо́ }, " steht für die Zukunft das Futur"]
            it: ["dopo ", { term: якщо́ }, ", sul futuro, il tempo futuro"]
            pl: ["po ", { term: якщо́ }, " o przyszłości — czas przyszły"]
            tr: [{ term: якщо́ }, " sonrasında gelecekten söz ederken gelecek zaman"]
            id: ["setelah ", { term: якщо́ }, " tentang masa depan, bentuk masa depan"]
            vi: ["sau ", { term: якщо́ }, " khi nói về tương lai, dùng thì tương lai"]
          ex: [{ target: Якщо́ за́втра пі́де }, " дощ, ми зали́шимося вдо́ма."]
          tr: { en: "If it rains tomorrow, we'll stay at home.", es: "Si mañana llueve, nos quedaremos en casa.", pt: "Se chover amanhã, ficaremos em casa.", fr: "S’il pleut demain, nous resterons à la maison.", de: "Wenn es morgen regnet, bleiben wir zu Hause.", it: "Se domani piove, resteremo a casa.", pl: "Jeśli jutro będzie padać, zostaniemy w domu.", tr: "Yarın yağmur yağarsa evde kalacağız.", id: "Kalau besok hujan, kami akan tinggal di rumah.", vi: "Nếu ngày mai trời mưa, chúng tôi sẽ ở nhà." }
        - level: B1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            uk: [{ term: би }, " і в головній частині"]
            en: [{ term: би }, " in the main clause too"]
            es: [{ term: би }, " también en la principal"]
            pt: [{ term: би }, " também na oração principal"]
            fr: [{ term: би }, " aussi dans la principale"]
            de: [{ term: би }, " auch im Hauptsatz"]
            it: [{ term: би }, " anche nella principale"]
            pl: [{ term: би }, " także w zdaniu głównym"]
            tr: [{ term: би }, " ana cümlede de"]
            id: [{ term: би }, " juga di induk kalimat"]
            vi: [{ term: би }, " cả ở mệnh đề chính"]
          ex: ["Якби́ я знав, я ", { target: прийшо́в би }, "."]
          tr: { en: "If I'd known, I would have come.", es: "Si lo hubiera sabido, habría venido.", pt: "Se eu soubesse, teria vindo.", fr: "Si j’avais su, je serais venu.", de: "Wenn ich es gewusst hätte, wäre ich gekommen.", it: "Se l’avessi saputo, sarei venuto.", pl: "Gdybym wiedział, przyszedłbym.", tr: "Bilseydim gelirdim.", id: "Seandainya saya tahu, saya pasti sudah datang.", vi: "Nếu tôi biết, tôi đã đến rồi." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: [{ term: Коли́ }, " відповідає на питання «коли?», ", { term: якщо́ }, " і ", { term: якби́ }, " — «за якої умови?»."]
              en: [{ term: Коли́ }, " answers “when?”; ", { term: якщо́ }, " and ", { term: якби́ }, " answer “on what condition?”."]
              es: [{ term: Коли́ }, " responde a «¿cuándo?»; ", { term: якщо́ }, " y ", { term: якби́ }, ", a «¿con qué condición?»."]
              pt: [{ term: Коли́ }, " responde a “quando?”; ", { term: якщо́ }, " e ", { term: якби́ }, ", a “sob que condição?”."]
              fr: [{ term: Коли́ }, " répond à « quand ? » ; ", { term: якщо́ }, " et ", { term: якби́ }, " répondent à « à quelle condition ? »."]
              de: [{ term: Коли́ }, " antwortet auf „wann?“; ", { term: якщо́ }, " und ", { term: якби́ }, " auf „unter welcher Bedingung?“."]
              it: [{ term: Коли́ }, " risponde a «quando?»; ", { term: якщо́ }, " e ", { term: якби́ }, " a «a quale condizione?»."]
              pl: [{ term: Коли́ }, " odpowiada na pytanie „kiedy?”, a ", { term: якщо́ }, " i ", { term: якби́ }, " — „pod jakim warunkiem?”."]
              tr: [{ term: Коли́ }, " “ne zaman?” sorusunu, ", { term: якщо́ }, " ve ", { term: якби́ }, " ise “hangi şartla?” sorusunu yanıtlar."]
              id: [{ term: Коли́ }, " menjawab “kapan?”; ", { term: якщо́ }, " dan ", { term: якби́ }, " menjawab “dengan syarat apa?”."]
              vi: [{ term: Коли́ }, " trả lời câu hỏi “khi nào?”; ", { term: якщо́ }, " và ", { term: якби́ }, " trả lời “với điều kiện nào?”."]
          - type: rule
            level: B1
            text:
              uk: "Частини речення розділяємо комою, яка б із них не стояла першою."
              en: "A comma separates the two clauses, whichever comes first."
              es: "Una coma separa las dos oraciones, vaya primero la que vaya."
              pt: "Uma vírgula separa as duas orações, qualquer que seja a primeira."
              fr: "Une virgule sépare les deux propositions, quelle que soit celle qui vient en premier."
              de: "Ein Komma trennt die beiden Teilsätze, gleich welcher zuerst steht."
              it: "Una virgola separa le due proposizioni, qualunque venga per prima."
              pl: "Przecinek oddziela oba zdania, niezależnie od tego, które jest pierwsze."
              tr: "Hangisi önce gelirse gelsin, iki cümleyi bir virgül ayırır."
