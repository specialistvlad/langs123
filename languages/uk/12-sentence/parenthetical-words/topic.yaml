title: { uk: Вставні слова й конструкції, en: Parenthetical Words and Phrases, es: "Palabras y construcciones incidentales", pt: "Palavras e construções intercaladas", fr: "Mots et constructions incidents", de: "Einschubwörter und Einschubkonstruktionen", it: "Parole e costrutti incidentali", pl: "Wtrącenia: wyrazy i wyrażenia", tr: "Ara sözler ve ara söz öbekleri", id: "Kata dan frasa penyela", vi: "Từ và cụm từ chêm xen" }
summary:
  lead:
    uk: "Вставні слова й конструкції показують порядок думок, упевненість, джерело й ставлення мовця; їх виділяємо комами."
    en: "Parenthetical words and phrases show the order of thoughts, the speaker's certainty, the source and the attitude; commas set them off."
    es: "Las palabras y construcciones incidentales muestran el orden de las ideas, la seguridad, la fuente y la actitud de quien habla; van entre comas."
    pt: "As palavras e construções intercaladas mostram a ordem das ideias, a certeza, a fonte e a atitude de quem fala; ficam entre vírgulas."
    fr: "Les mots et constructions incidents marquent l’ordre des idées, la certitude, la source et l’attitude du locuteur ; des virgules les isolent."
    de: "Einschubwörter und Einschubkonstruktionen zeigen Gedankenfolge, Sicherheit, Quelle und Einstellung des Sprechers; Kommas trennen sie ab."
    it: "Le parole e i costrutti incidentali mostrano l'ordine dei pensieri, la sicurezza, la fonte e l'atteggiamento di chi parla; si isolano con virgole."
    pl: "Wtrącenia, czyli wyrazy i wyrażenia wtrącone, pokazują porządek myśli, pewność, źródło i postawę mówiącego; oddzielamy je przecinkami."
    tr: "Ara sözler ve ara söz öbekleri düşüncelerin sırasını, eminliği, kaynağı ve tutumu gösterir; virgülle ayrılır."
    id: "Kata dan frasa penyela menunjukkan urutan gagasan, keyakinan, sumber, dan sikap penutur; semuanya diapit koma."
    vi: "Từ và cụm từ chêm xen cho biết thứ tự các ý, độ chắc chắn, nguồn tin và thái độ của người nói; ta đặt chúng giữa hai dấu phẩy."
  rule:
    uk: "Вставне слово не є членом речення, тому його виділяємо комами:"
    en: "A parenthetical word is not a sentence element, so commas set it off:"
    es: "La palabra incidental no es un elemento de la oración, así que se separa con comas:"
    pt: "A palavra intercalada não é um termo da oração, por isso fica entre vírgulas:"
    fr: "Le mot incident n’est pas un élément de la phrase ; on l’isole donc par des virgules :"
    de: "Ein Einschubwort ist kein Satzglied, darum trennt man es durch Kommas ab:"
    it: "La parola incidentale non è un elemento della frase, quindi si isola con le virgole:"
    pl: "Wtrącenie nie jest częścią zdania, dlatego oddzielamy je przecinkami:"
    tr: "Ara söz cümlenin ögesi değildir, bu yüzden virgülle ayrılır:"
    id: "Kata penyela bukan unsur kalimat, jadi diapit koma:"
    vi: "Từ chêm xen không phải thành phần câu, nên ta đặt nó giữa dấu phẩy:"
  ex: ["Ми, ", { target: "на жаль" }, ", запізни́лися."]

