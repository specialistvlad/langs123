          rule: { uk: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, en: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, es: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, pt: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, fr: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, de: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, it: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, pl: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, tr: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, id: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] }, vi: { alternatives: [{ term: "на жаль" }, { term: "на ща́стя" }] } }
          ex: [{ target: "На ща́стя" }, ", ніхто́ не постражда́в."]
