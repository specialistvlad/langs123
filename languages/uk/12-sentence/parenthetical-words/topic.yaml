            ex: { examples: [[{ target: "По-пе́рше" }, ", ми ма́ємо ма́ло ча́су."], [{ target: "О́тже" }, ", ми зустрі́немося за́втра."]] }
            tr: { en: { examples: ["First, we have little time.", "So we'll meet tomorrow."] }, es: { examples: ["Primero, tenemos poco tiempo.", "Así que nos veremos mañana."] }, pt: { examples: ["Primeiro, temos pouco tempo.", "Portanto, vamos nos encontrar amanhã."] }, fr: { examples: ["D’abord, nous avons peu de temps.", "Donc, nous nous retrouvons demain."] }, de: { examples: ["Erstens haben wir wenig Zeit.", "Also treffen wir uns morgen."] }, it: { examples: ["Prima di tutto, abbiamo poco tempo.", "Dunque ci vediamo domani."] }, pl: { examples: ["Po pierwsze, mamy mało czasu.", "A zatem spotkamy się jutro."] }, tr: { examples: ["Birincisi, az zamanımız var.", "O hâlde yarın buluşacağız."] }, id: { examples: ["Pertama, waktu kita sedikit.", "Jadi, kita bertemu besok."] }, vi: { examples: ["Thứ nhất, chúng ta có ít thời gian.", "Vậy nên ngày mai chúng ta gặp nhau."] } }
          - level: B2
            use: { uk: "ймовірність", en: "probability", es: "probabilidad", pt: "probabilidade", fr: "probabilité", de: "Wahrscheinlichkeit", it: "probabilità", pl: "prawdopodobieństwo", tr: "olasılık", id: "kemungkinan", vi: "khả năng" }
