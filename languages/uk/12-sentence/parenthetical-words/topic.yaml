          rule: { uk: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, en: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, es: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, pt: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, fr: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, de: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, it: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, pl: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, tr: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, id: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] }, vi: { alternatives: [{ term: "на мою́ ду́мку" }, { term: "за його́ слова́ми" }] } }
          ex: [{ target: "На мою́ ду́мку" }, ", це га́рне рі́шення."]
