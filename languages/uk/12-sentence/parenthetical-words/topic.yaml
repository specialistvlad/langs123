          rule: { uk: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, en: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, es: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, pt: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, fr: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, de: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, it: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, pl: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, tr: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, id: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] }, vi: { alternatives: [{ term: "то́бто" }, { term: "іна́кше ка́жучи" }] } }
          ex: ["Ра́но вра́нці", { target: ", то́бто," }, " о п’я́тій, ми ви́їхали."]
          tr: { en: "We left early in the morning, that is, at five.", es: "Salimos temprano por la mañana, es decir, a las cinco.", pt: "Saímos de manhã cedo, ou seja, às cinco.", fr: "Nous sommes partis tôt le matin, c’est-à-dire à cinq heures.", de: "Wir sind früh am Morgen aufgebrochen, das heißt um fünf Uhr.", it: "Siamo partiti la mattina presto, cioè alle cinque.", pl: "Wyjechaliśmy wcześnie rano, to znaczy o piątej.", tr: "Sabah erkenden, yani saat beşte yola çıktık.", id: "Kami berangkat pagi-pagi, yaitu pukul lima.", vi: "Chúng tôi lên đường từ sáng sớm, tức là lúc năm giờ." }
        - level: C2
          point: { uk: Підсумок, en: "Conclusion", es: "Conclusión", pt: "Conclusão", fr: "Conclusion", de: "Fazit", it: "Conclusione", pl: "Podsumowanie", tr: "Sonuç", id: "Kesimpulan", vi: "Kết luận" }
          rule: { uk: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, en: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, es: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, pt: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, fr: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, de: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, it: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, pl: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, tr: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, id: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] }, vi: { alternatives: [{ term: "таки́м чи́ном" }, { term: "сло́вом" }] } }
          ex: [{ target: "Таки́м чи́ном" }, ", ми ма́ємо два варіа́нти."]
          tr: { en: "Thus, we have two options.", es: "Así pues, tenemos dos opciones.", pt: "Assim, temos duas opções.", fr: "Ainsi, nous avons deux options.", de: "Wir haben also zwei Möglichkeiten.", it: "Dunque abbiamo due possibilità.", pl: "A zatem mamy dwie możliwości.", tr: "Böylece iki seçeneğimiz var.", id: "Dengan demikian, kita punya dua pilihan.", vi: "Như vậy, chúng ta có hai lựa chọn." }
        - level: C2
          point: { uk: Кінець речення, en: "End of the sentence", es: "Final de la oración", pt: "Fim da frase", fr: "Fin de la phrase", de: "Satzende", it: "Fine della frase", pl: "Koniec zdania", tr: "Cümlenin sonu", id: "Akhir kalimat", vi: "Cuối câu" }
          rule: { uk: "кома стоїть перед вставним словом", en: "the comma comes before the parenthetical word", es: "la coma va antes de la palabra incidental", pt: "a vírgula vem antes da palavra intercalada", fr: "la virgule précède le mot incident", de: "das Komma steht vor dem Einschubwort", it: "la virgola sta prima della parola incidentale", pl: "przecinek stoi przed wtrąceniem", tr: "virgül ara sözden önce gelir", id: "koma diletakkan sebelum kata penyela", vi: "dấu phẩy đứng trước từ chêm xen" }
          ex: ["Він не прийшо́в", { target: ", на жаль" }, "."]
          tr: { en: "He didn't come, unfortunately.", es: "No vino, lamentablemente.", pt: "Ele não veio, infelizmente.", fr: "Il n’est pas venu, malheureusement.", de: "Er ist leider nicht gekommen.", it: "Non è venuto, purtroppo.", pl: "Nie przyszedł, niestety.", tr: "Maalesef gelmedi.", id: "Sayangnya, dia tidak datang.", vi: "Tiếc là anh ấy đã không đến." }
        - level: B2
          point: { uk: Пастка, en: "Trap", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: [{ term: "мо́же" }, " з інфінітивом — дієслово: коми немає"], en: [{ term: "мо́же" }, " with an infinitive is a verb: no comma"], es: [{ term: "мо́же" }, " con infinitivo es un verbo: sin coma"], pt: [{ term: "мо́же" }, " com infinitivo é verbo: sem vírgula"], fr: [{ term: "мо́же" }, " suivi d’un infinitif est un verbe : pas de virgule"], de: [{ term: "мо́же" }, " mit Infinitiv ist ein Verb: kein Komma"], it: [{ term: "мо́же" }, " con l'infinito è un verbo: senza virgola"], pl: [{ term: "мо́же" }, " z bezokolicznikiem to czasownik: bez przecinka"], tr: [{ term: "мо́же" }, " mastarla birlikte fiildir: virgül konmaz"], id: [{ term: "мо́же" }, " dengan infinitif adalah kata kerja: tanpa koma"], vi: [{ term: "мо́же" }, " đi với động từ nguyên mẫu là động từ: không có dấu phẩy"] }
          ex: ["Він ", { target: "мо́же" }, " прийти́."]
          tr: { en: "He can come.", es: "Él puede venir.", pt: "Ele pode vir.", fr: "Il peut venir.", de: "Er kann kommen.", it: "Lui può venire.", pl: "On może przyjść.", tr: "O gelebilir.", id: "Dia bisa datang.", vi: "Anh ấy có thể đến." }

sections:
  - title: { uk: Огляд, en: "Overview", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { uk: "Вставне слово не є членом речення: воно показує порядок думок, упевненість чи ставлення мовця.", en: "A parenthetical word is not a sentence element: it shows the order of thoughts, the speaker's certainty or attitude.", es: "La palabra incidental no es un elemento de la oración: muestra el orden de las ideas, la seguridad o la actitud de quien habla.", pt: "A palavra intercalada não é um termo da oração: ela mostra a ordem das ideias, a certeza ou a atitude de quem fala.", fr: "Le mot incident n’est pas un élément de la phrase : il indique l’ordre des idées, la certitude ou l’attitude de celui qui parle.", de: "Ein Einschubwort ist kein Satzglied: Es zeigt die Reihenfolge der Gedanken, die Sicherheit oder die Einstellung des Sprechers.", it: "La parola incidentale non è un elemento della frase: mostra l'ordine dei pensieri, la sicurezza o l'atteggiamento di chi parla.", pl: "Wtrącenie nie jest częścią zdania: pokazuje porządek myśli, pewność lub postawę mówiącego.", tr: "Ara söz cümlenin ögesi değildir; düşüncelerin sırasını, konuşanın eminliğini ya da tutumunu gösterir.", id: "Kata penyela bukan unsur kalimat: kata ini menunjukkan urutan gagasan, keyakinan, atau sikap penutur.", vi: "Từ chêm xen không phải là thành phần câu: nó cho thấy thứ tự các ý, độ chắc chắn hoặc thái độ của người nói." }
            ex: ["Ми, ", { target: "о́тже" }, ", ма́ємо чека́ти."]
            tr: { en: "So we have to wait.", es: "Por tanto, tenemos que esperar.", pt: "Portanto, temos que esperar.", fr: "Nous devons donc attendre.", de: "Wir müssen also warten.", it: "Quindi dobbiamo aspettare.", pl: "Musimy więc czekać.", tr: "Dolayısıyla beklememiz gerekiyor.", id: "Jadi, kita harus menunggu.", vi: "Vậy là chúng ta phải chờ." }
          - type: rule
            level: B2
            text: { uk: "Вставне слово можна прибрати, і речення лишається повним.", en: "You can remove a parenthetical word, and the sentence stays complete.", es: "Se puede quitar la palabra incidental y la oración sigue completa.", pt: "Dá para tirar a palavra intercalada e a frase continua completa.", fr: "On peut supprimer le mot incident : la phrase reste complète.", de: "Man kann das Einschubwort weglassen, und der Satz bleibt vollständig.", it: "La parola incidentale si può togliere e la frase resta completa.", pl: "Wtrącenie można pominąć, a zdanie pozostaje pełne.", tr: "Ara söz çıkarılabilir; cümle yine tamdır.", id: "Kata penyela dapat dihilangkan, dan kalimat tetap lengkap.", vi: "Có thể bỏ từ chêm xen đi, và câu vẫn đầy đủ." }
            ex: { mapping: [["Він, ", { target: "о́тже" }, ", не при́йде."], "Він не при́йде."] }
            tr: { en: { mapping: ["He, therefore, isn't coming.", "He isn't coming."] }, es: { mapping: ["Él, por tanto, no vendrá.", "Él no vendrá."] }, pt: { mapping: ["Ele, portanto, não virá.", "Ele não virá."] }, fr: { mapping: ["Il ne viendra donc pas.", "Il ne viendra pas."] }, de: { mapping: ["Er kommt also nicht.", "Er kommt nicht."] }, it: { mapping: ["Lui, quindi, non verrà.", "Lui non verrà."] }, pl: { mapping: ["On, więc, nie przyjdzie.", "On nie przyjdzie."] }, tr: { mapping: ["Bu durumda o gelmeyecek.", "O gelmeyecek."] }, id: { mapping: ["Jadi, dia tidak akan datang.", "Dia tidak akan datang."] }, vi: { mapping: ["Vậy là anh ấy sẽ không đến.", "Anh ấy sẽ không đến."] } }
          - type: rule
            level: C1
            text: { uk: ["Вставна конструкція — кілька слів, що діють як одне вставне слово: ", { term: "на мою́ ду́мку" }, "."], en: ["A parenthetical phrase is a group of words that works as one parenthetical word: ", { term: "на мою́ ду́мку" }, "."], es: ["La construcción incidental es un grupo de palabras que funciona como una sola palabra incidental: ", { term: "на мою́ ду́мку" }, "."], pt: ["A construção intercalada é um grupo de palavras que funciona como uma só palavra intercalada: ", { term: "на мою́ ду́мку" }, "."], fr: ["La construction incidente est un groupe de mots qui fonctionne comme un seul mot incident : ", { term: "на мою́ ду́мку" }, "."], de: ["Eine Einschubkonstruktion besteht aus mehreren Wörtern, die wie ein einziges Einschubwort wirken: ", { term: "на мою́ ду́мку" }, "."], it: ["Il costrutto incidentale è un gruppo di parole che funziona come una sola parola incidentale: ", { term: "на мою́ ду́мку" }, "."], pl: ["Wyrażenie wtrącone to kilka wyrazów, które działają jak jedno wtrącenie: ", { term: "на мою́ ду́мку" }, "."], tr: ["Ara söz öbeği, tek bir ara söz gibi işleyen birkaç sözcüktür: ", { term: "на мою́ ду́мку" }, "."], id: ["Frasa penyela adalah beberapa kata yang berfungsi sebagai satu kata penyela: ", { term: "на мою́ ду́мку" }, "."], vi: ["Cụm từ chêm xen là một nhóm từ có chức năng như một từ chêm xen: ", { term: "на мою́ ду́мку" }, "."] }
          - type: note
            level: B2
            text: { uk: ["Вставні слова ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": ", { link: Сполучники, to: uk.sentence.conjunctions }, "."], en: ["The parenthetical words ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": see ", { link: "Conjunctions", to: uk.sentence.conjunctions }, "."], es: ["Las palabras incidentales ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": véase ", { link: "Los conectores", to: uk.sentence.conjunctions }, "."], pt: ["As palavras intercaladas ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": veja ", { link: "Conjunções", to: uk.sentence.conjunctions }, "."], fr: ["Les mots incidents ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, " : voir ", { link: "Les conjonctions", to: uk.sentence.conjunctions }, "."], de: ["Die Einschubwörter ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": siehe ", { link: "Konjunktionen", to: uk.sentence.conjunctions }, "."], it: ["Le parole incidentali ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": vedi ", { link: "Le congiunzioni", to: uk.sentence.conjunctions }, "."], pl: ["Wtrącenia ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": zob. ", { link: "Spójniki", to: uk.sentence.conjunctions }, "."], tr: ["Ara sözler ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": bkz. ", { link: "Bağlaçlar", to: uk.sentence.conjunctions }, "."], id: ["Kata penyela ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": lihat ", { link: "Konjungsi", to: uk.sentence.conjunctions }, "."], vi: ["Các từ chêm xen ", { term: "мабу́ть" }, ", ", { term: "можли́во" }, ", ", { term: "здає́ться" }, ": xem ", { link: "Liên từ", to: uk.sentence.conjunctions }, "."] }
          - type: note
            level: C1
            text: { uk: ["Чужі слова й джерело інформації: ", { link: "Пряма й непряма мова", to: uk.sentence.reported-speech }, "."], en: ["Other people's words and the source of information: see ", { link: "Direct and Reported Speech", to: uk.sentence.reported-speech }, "."], es: ["Las palabras de otros y la fuente de la información: véase ", { link: "Estilo directo e indirecto", to: uk.sentence.reported-speech }, "."], pt: ["As palavras de outras pessoas e a fonte da informação: veja ", { link: "Discurso direto e indireto", to: uk.sentence.reported-speech }, "."], fr: ["Les paroles d’autrui et la source de l’information : voir ", { link: "Discours direct et indirect", to: uk.sentence.reported-speech }, "."], de: ["Fremde Worte und die Quelle der Information: siehe ", { link: "Direkte und indirekte Rede", to: uk.sentence.reported-speech }, "."], it: ["Le parole altrui e la fonte dell'informazione: vedi ", { link: "Discorso diretto e indiretto", to: uk.sentence.reported-speech }, "."], pl: ["Cudze słowa i źródło informacji: zob. ", { link: "Mowa niezależna i zależna", to: uk.sentence.reported-speech }, "."], tr: ["Başkalarının sözleri ve bilginin kaynağı: bkz. ", { link: "Doğrudan ve dolaylı anlatım", to: uk.sentence.reported-speech }, "."], id: ["Kata-kata orang lain dan sumber informasi: lihat ", { link: "Kalimat langsung dan tak langsung", to: uk.sentence.reported-speech }, "."], vi: ["Lời của người khác và nguồn thông tin: xem ", { link: "Câu trực tiếp và câu gián tiếp", to: uk.sentence.reported-speech }, "."] }

  - title: { uk: Значення вставних слів, en: "Meanings of parenthetical words", es: "Significados de las palabras incidentales", pt: "Significados das palavras intercaladas", fr: "Le sens des mots incidents", de: "Bedeutungen der Einschubwörter", it: "Significati delle parole incidentali", pl: "Znaczenia wtrąceń", tr: "Ara sözlerin anlamları", id: "Makna kata penyela", vi: "Nghĩa của từ chêm xen" }
