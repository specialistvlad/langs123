          rule: { uk: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, en: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, es: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, pt: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, fr: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, de: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, it: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, pl: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, tr: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, id: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] }, vi: { alternatives: [{ term: "зна́єш" }, { term: "розумі́єш" }, { term: "ба́чиш" }, { term: "ба́чите" }] } }
          ex: ["За́втра в ме́не", { target: ", зна́єш," }, " важли́ві спра́ви."]
