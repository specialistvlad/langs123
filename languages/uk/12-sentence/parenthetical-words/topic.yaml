          rule: { uk: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, en: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, es: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, pt: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, fr: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, de: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, it: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, pl: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, tr: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, id: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] }, vi: { alternatives: [{ term: "по-пе́рше" }, { term: "по-дру́ге" }, { term: "по-тре́тє" }, { term: "о́тже" }] } }
          ex: [{ target: "По-пе́рше" }, ", ми ма́ємо ма́ло ча́су."]
          tr: { en: "First, we have little time.", es: "Primero, tenemos poco tiempo.", pt: "Primeiro, temos pouco tempo.", fr: "D’abord, nous avons peu de temps.", de: "Erstens haben wir wenig Zeit.", it: "Prima di tutto, abbiamo poco tempo.", pl: "Po pierwsze, mamy mało czasu.", tr: "Birincisi, az zamanımız var.", id: "Pertama, waktu kita sedikit.", vi: "Thứ nhất, chúng ta có ít thời gian." }
        - level: B2
          point: { uk: Ймовірність, en: "Probability", es: "Probabilidad", pt: "Probabilidade", fr: "Probabilité", de: "Wahrscheinlichkeit", it: "Probabilità", pl: "Prawdopodobieństwo", tr: "Olasılık", id: "Kemungkinan", vi: "Khả năng" }
          rule: { uk: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, en: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, es: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, pt: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, fr: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, de: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, it: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, pl: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, tr: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, id: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] }, vi: { equivalence: [{ term: "мо́же" }, { term: "можли́во" }] } }
          ex: [{ target: "Мо́же" }, ", за́втра пої́демо до мо́ря?"]
          tr: { en: "Perhaps we'll go to the sea tomorrow?", es: "¿Quizá vayamos mañana al mar?", pt: "Talvez a gente vá à praia amanhã?", fr: "Peut-être qu’on ira à la mer demain ?", de: "Vielleicht fahren wir morgen ans Meer?", it: "Forse domani andiamo al mare?", pl: "Może jutro pojedziemy nad morze?", tr: "Belki yarın denize gideriz?", id: "Mungkin besok kita pergi ke pantai?", vi: "Có lẽ ngày mai chúng ta đi biển nhé?" }
        - level: B2
          point: { uk: Коми, en: "Commas", es: "Comas", pt: "Vírgulas", fr: "Virgules", de: "Kommas", it: "Virgole", pl: "Przecinki", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
          rule: { uk: "на початку — кома після слова; всередині — коми з обох боків", en: "at the start: a comma after the word; in the middle: commas on both sides", es: "al principio: coma después de la palabra; en medio: comas a ambos lados", pt: "no início: vírgula depois da palavra; no meio: vírgulas dos dois lados", fr: "au début : virgule après le mot ; au milieu : virgules des deux côtés", de: "am Anfang: Komma nach dem Wort; in der Mitte: Kommas auf beiden Seiten", it: "all'inizio: virgola dopo la parola; in mezzo: virgole da entrambi i lati", pl: "na początku: przecinek po wyrazie; w środku: przecinki po obu stronach", tr: "başta: sözcükten sonra virgül; ortada: iki yanında virgül", id: "di awal: koma setelah kata; di tengah: koma di kedua sisi", vi: "ở đầu câu: dấu phẩy sau từ; ở giữa câu: dấu phẩy ở cả hai bên" }
          ex: ["Він", { target: ", о́тже," }, " не при́йде."]
