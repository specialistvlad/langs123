title: { uk: Порядок слів, en: Word Order, es: El orden de las palabras, pt: "Ordem das palavras", fr: "L’ordre des mots", de: "Wortstellung", it: "L’ordine delle parole", pl: "Szyk wyrazów", tr: "Sözcük sırası", id: "Urutan kata", vi: "Trật tự từ" }
summary:
  lead:
    uk: "Звичайний порядок слів — підмет, присудок, додаток; прикметник стоїть перед іменником, а нове чи найважливіше — у кінці речення."
    en: "The usual order is subject, verb, object; an adjective goes before its noun, and the new or most important information comes at the end."
    es: "El orden habitual es sujeto, verbo, objeto; el adjetivo va delante del sustantivo, y la información nueva o más importante va al final."
    pt: "A ordem habitual é sujeito, verbo, objeto; o adjetivo vem antes do substantivo, e a informação nova ou mais importante vai no fim da frase."
    fr: "L’ordre habituel est sujet, verbe, objet ; l’adjectif précède le nom, et l’information nouvelle ou la plus importante vient en fin de phrase."
    de: "Die übliche Reihenfolge ist Subjekt, Verb, Objekt; das Adjektiv steht vor dem Nomen, und die neue oder wichtigste Information kommt ans Satzende."
    it: "L’ordine abituale è soggetto, verbo, oggetto; l’aggettivo sta prima del nome, e l’informazione nuova o più importante va alla fine della frase."
    pl: "Zwykły szyk to podmiot, orzeczenie, dopełnienie; przymiotnik stoi przed rzeczownikiem, a nowa lub najważniejsza informacja — na końcu zdania."
    tr: "Olağan sıra özne, yüklem, nesnedir; sıfat isimden önce gelir, yeni ya da en önemli bilgi ise cümlenin sonunda yer alır."
    id: "Urutan yang biasa adalah subjek, predikat, objek; kata sifat berada sebelum nomina, dan informasi baru atau terpenting berada di akhir kalimat."
    vi: "Trật tự thông thường là chủ ngữ, động từ, tân ngữ; tính từ đứng trước danh từ, còn thông tin mới hoặc quan trọng nhất đứng ở cuối câu."
  rule:
    uk: "Прикметник стоїть перед іменником, який він описує:"
    en: "An adjective goes before the noun it describes:"
    es: "El adjetivo va delante del sustantivo que describe:"
    pt: "O adjetivo vem antes do substantivo que descreve:"
    fr: "L’adjectif se place devant le nom qu’il décrit :"
    de: "Das Adjektiv steht vor dem Nomen, das es beschreibt:"
    it: "L’aggettivo sta prima del nome che descrive:"
    pl: "Przymiotnik stoi przed rzeczownikiem, który opisuje:"
    tr: "Sıfat, nitelediği isimden önce gelir:"
    id: "Kata sifat berada sebelum nomina yang dijelaskannya:"
    vi: "Tính từ đứng trước danh từ mà nó miêu tả:"
  ex: { examples: [["Це ", { target: ціка́ва кни́жка }, "."], ["Ми живемо́ у ", { target: вели́кому мі́сті }, "."]] }

