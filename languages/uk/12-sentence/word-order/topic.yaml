            ex: ["Ти розмовля́єш украї́нською?", { intonation: rise }]
            tr: { en: "Do you speak Ukrainian?", es: "¿Hablas ucraniano?", pt: "Você fala ucraniano?", fr: "Tu parles ukrainien ?", de: "Sprichst du Ukrainisch?", it: "Parli ucraino?", pl: "Mówisz po ukraińsku?", tr: "Ukraynaca konuşuyor musun?", id: "Apakah kamu berbicara bahasa Ukraina?", vi: "Bạn có nói tiếng Ukraina không?" }
          - level: A2
