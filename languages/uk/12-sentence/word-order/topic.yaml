            en: "the adjective goes before the noun; after it only as a stylistic device"
            es: "el adjetivo va delante del sustantivo; detrás, solo como recurso de estilo"
            pt: "o adjetivo vem antes do substantivo; depois dele, só como recurso de estilo"
            fr: "l’adjectif précède le nom ; après lui, seulement comme procédé de style"
            de: "das Adjektiv steht vor dem Nomen; dahinter nur als Stilmittel"
            it: "l’aggettivo sta prima del nome; dopo di esso, solo come espediente stilistico"
            pl: "przymiotnik stoi przed rzeczownikiem; po nim tylko jako środek stylistyczny"
            tr: "sıfat isimden önce gelir; ondan sonra yalnızca üslup aracı olarak"
            id: "kata sifat berada sebelum nomina; sesudahnya hanya sebagai gaya bahasa"
            vi: "tính từ đứng trước danh từ; đứng sau chỉ như một thủ pháp tu từ"
          ex: ["Я ма́ю ", { target: черво́ну су́мку }, "."]
          tr: { en: "I have a red bag.", es: "Tengo una bolsa roja.", pt: "Tenho uma bolsa vermelha.", fr: "J’ai un sac rouge.", de: "Ich habe eine rote Tasche.", it: "Ho una borsa rossa.", pl: "Mam czerwoną torbę.", tr: "Kırmızı bir çantam var.", id: "Saya punya tas merah.", vi: "Tôi có một chiếc túi màu đỏ." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Відмінкові закінчення показують, хто що робить, тому порядок слів в українській вільний. Звичайний порядок — підмет, присудок, додаток:"
              en: "Case endings show who does what, so Ukrainian word order is free. The usual order is subject, verb, object:"
              es: "Las terminaciones de caso muestran quién hace qué, así que el orden de las palabras es libre. El orden habitual es sujeto, verbo, objeto:"
              pt: "As terminações de caso mostram quem faz o quê, por isso a ordem das palavras em ucraniano é livre. A ordem habitual é sujeito, verbo, objeto:"
              fr: "Les terminaisons de cas montrent qui fait quoi ; l’ordre des mots est donc libre en ukrainien. L’ordre habituel est sujet, verbe, objet :"
              de: "Die Kasusendungen zeigen, wer was tut, deshalb ist die Wortstellung im Ukrainischen frei. Die übliche Reihenfolge ist Subjekt, Verb, Objekt:"
              it: "Le desinenze di caso mostrano chi fa che cosa, perciò l’ordine delle parole in ucraino è libero. L’ordine abituale è soggetto, verbo, oggetto:"
              pl: "Końcówki przypadków pokazują, kto co robi, dlatego szyk wyrazów w ukraińskim jest swobodny. Zwykły szyk to podmiot, orzeczenie, dopełnienie:"
              tr: "Hâl ekleri kimin ne yaptığını gösterir; bu yüzden Ukraynacada sözcük sırası serbesttir. Olağan sıra özne, yüklem, nesnedir:"
              id: "Akhiran kasus menunjukkan siapa melakukan apa, sehingga urutan kata dalam bahasa Ukraina bebas. Urutan yang biasa adalah subjek, predikat, objek:"
              vi: "Đuôi cách cho biết ai làm gì, nên trật tự từ trong tiếng Ukraina khá tự do. Trật tự thông thường là chủ ngữ, động từ, tân ngữ:"
            ex: "Ма́ма чита́є газе́ту."
            tr: { en: "Mum is reading the newspaper.", es: "Mamá lee el periódico.", pt: "A mãe está lendo o jornal.", fr: "Maman lit le journal.", de: "Mama liest die Zeitung.", it: "La mamma legge il giornale.", pl: "Mama czyta gazetę.", tr: "Annem gazete okuyor.", id: "Ibu sedang membaca koran.", vi: "Mẹ đang đọc báo." }
          - type: rule
            level: A2
            text:
              uk: "Інший порядок змінює не зміст, а те, що в реченні нове: нове чи найважливіше стоїть у кінці."
              en: "Another order keeps the meaning and changes what is new: the new or most important information comes at the end."
              es: "Otro orden mantiene el significado y cambia lo que es nuevo: la información nueva o más importante va al final."
              pt: "Outra ordem mantém o significado e muda o que é novo: a informação nova ou mais importante vem no fim."
              fr: "Un autre ordre garde le sens et change ce qui est nouveau : l’information nouvelle ou la plus importante vient à la fin."
              de: "Eine andere Reihenfolge ändert nicht die Bedeutung, sondern das, was neu ist: Die neue oder wichtigste Information steht am Ende."
              it: "Un altro ordine mantiene il significato e cambia ciò che è nuovo: l’informazione nuova o più importante va alla fine."
              pl: "Inny szyk nie zmienia treści, lecz to, co w zdaniu jest nowe: nowa lub najważniejsza informacja stoi na końcu."
              tr: "Başka bir sıra anlamı değiştirmez, cümlede neyin yeni olduğunu değiştirir: yeni ya da en önemli bilgi sonda yer alır."
              id: "Urutan lain tidak mengubah arti, tetapi mengubah apa yang baru: informasi baru atau terpenting berada di akhir."
              vi: "Trật tự khác không đổi nghĩa mà đổi điều được coi là mới: thông tin mới hoặc quan trọng nhất đứng ở cuối."
            ex: { contrast: [["Ма́ма чита́є ", { target: газе́ту }, "."], ["Газе́ту чита́є ", { target: ма́ма }, "."]] }
            tr: { en: { contrast: ["Mum is reading the newspaper.", "It's Mum who is reading the newspaper."] }, es: { contrast: ["Mamá lee el periódico.", "El periódico lo lee mamá."] }, pt: { contrast: ["A mãe está lendo o jornal.", "Quem lê o jornal é a mãe."] }, fr: { contrast: ["Maman lit le journal.", "Le journal, c’est maman qui le lit."] }, de: { contrast: ["Mama liest die Zeitung.", "Die Zeitung liest Mama."] }, it: { contrast: ["La mamma legge il giornale.", "Il giornale lo legge la mamma."] }, pl: { contrast: ["Mama czyta gazetę.", "Gazetę czyta mama."] }, tr: { contrast: ["Annem gazete okuyor.", "Gazeteyi annem okuyor."] }, id: { contrast: ["Ibu sedang membaca koran.", "Yang membaca koran itu ibu."] }, vi: { contrast: ["Mẹ đang đọc báo.", "Người đọc báo là mẹ."] } }

  - title: { uk: Звичайний порядок, en: The usual order, es: El orden habitual, pt: "A ordem habitual", fr: "L’ordre habituel", de: "Die übliche Reihenfolge", it: "L’ordine abituale", pl: "Zwykły szyk", tr: "Olağan sıra", id: "Urutan yang biasa", vi: "Trật tự thông thường" }
