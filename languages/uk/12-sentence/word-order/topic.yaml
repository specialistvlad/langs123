            ex: ["Сього́дні я ", { target: не працю́ю }, "."]
            tr: { en: "I'm not working today.", es: "Hoy no trabajo.", pt: "Hoje não trabalho.", fr: "Aujourd’hui, je ne travaille pas.", de: "Heute arbeite ich nicht.", it: "Oggi non lavoro.", pl: "Dzisiaj nie pracuję.", tr: "Bugün çalışmıyorum.", id: "Hari ini saya tidak bekerja.", vi: "Hôm nay tôi không làm việc." }
          - level: A1
