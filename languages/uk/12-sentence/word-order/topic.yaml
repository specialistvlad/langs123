  - title: { uk: Нове в кінці речення, en: New information at the end, es: Lo nuevo al final, pt: "O novo no fim da frase", fr: "Le nouveau à la fin de la phrase", de: "Neues am Satzende", it: "Il nuovo alla fine della frase", pl: "Nowe na końcu zdania", tr: "Yeni olan cümlenin sonunda", id: "Yang baru di akhir kalimat", vi: "Điều mới ở cuối câu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { uk: Нове, en: What is new, es: Lo nuevo, pt: "O que é novo", fr: "Ce qui est nouveau", de: "Was neu ist", it: "Ciò che è nuovo", pl: "Co jest nowe", tr: "Yeni olan", id: "Yang baru", vi: "Điều mới" } }
          - { key: ex, label: { uk: Приклад, en: Example, es: Ejemplo, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A2
            use: { uk: "коли?", en: "when?", es: "¿cuándo?", pt: "quando?", fr: "quand ?", de: "wann?", it: "quando?", pl: "kiedy?", tr: "ne zaman?", id: "kapan?", vi: "khi nào?" }
            ex: { exchange: ["Коли́ ви ї́дете до Льво́ва?", ["До Льво́ва ми ї́демо ", { target: за́втра }, "."]] }
            tr: { en: { exchange: ["When are you going to Lviv?", "We're going to Lviv tomorrow."] }, es: { exchange: ["¿Cuándo van a Leópolis?", "A Leópolis vamos mañana."] }, pt: { exchange: ["Quando vocês vão a Lviv?", "A Lviv vamos amanhã."] }, fr: { exchange: ["Quand allez-vous à Lviv ?", "À Lviv, nous allons demain."] }, de: { exchange: ["Wann fahrt ihr nach Lwiw?", "Nach Lwiw fahren wir morgen."] }, it: { exchange: ["Quando andate a Leopoli?", "A Leopoli andiamo domani."] }, pl: { exchange: ["Kiedy jedziecie do Lwowa?", "Do Lwowa jedziemy jutro."] }, tr: { exchange: ["Lviv’e ne zaman gidiyorsunuz?", "Lviv’e yarın gidiyoruz."] }, id: { exchange: ["Kapan kalian pergi ke Lviv?", "Ke Lviv kami pergi besok."] }, vi: { exchange: ["Khi nào các bạn đi Lviv?", "Chúng tôi đi Lviv vào ngày mai."] } }
          - level: A2
            use: { uk: "куди?", en: "where to?", es: "¿adónde?", pt: "para onde?", fr: "où ?", de: "wohin?", it: "dove?", pl: "dokąd?", tr: "nereye?", id: "ke mana?", vi: "đi đâu?" }
            ex: { exchange: ["Куди́ ви ї́дете за́втра?", ["За́втра ми ї́демо ", { target: до Льво́ва }, "."]] }
            tr: { en: { exchange: ["Where are you going tomorrow?", "Tomorrow we're going to Lviv."] }, es: { exchange: ["¿Adónde van mañana?", "Mañana vamos a Leópolis."] }, pt: { exchange: ["Para onde vocês vão amanhã?", "Amanhã vamos a Lviv."] }, fr: { exchange: ["Où allez-vous demain ?", "Demain, nous allons à Lviv."] }, de: { exchange: ["Wohin fahrt ihr morgen?", "Morgen fahren wir nach Lwiw."] }, it: { exchange: ["Dove andate domani?", "Domani andiamo a Leopoli."] }, pl: { exchange: ["Dokąd jedziecie jutro?", "Jutro jedziemy do Lwowa."] }, tr: { exchange: ["Yarın nereye gidiyorsunuz?", "Yarın Lviv’e gidiyoruz."] }, id: { exchange: ["Ke mana kalian pergi besok?", "Besok kami pergi ke Lviv."] }, vi: { exchange: ["Ngày mai các bạn đi đâu?", "Ngày mai chúng tôi đi Lviv."] } }
          - level: A2
            use: { uk: "хто?", en: "who?", es: "¿quién?", pt: "quem?", fr: "qui ?", de: "wer?", it: "chi?", pl: "kto?", tr: "kim?", id: "siapa?", vi: "ai?" }
            ex: { exchange: ["Хто написа́в цей текст?", ["Цей текст написа́в ", { target: І́гор }, "."]] }
            tr: { en: { exchange: ["Who wrote this text?", "Ihor wrote this text."] }, es: { exchange: ["¿Quién escribió este texto?", "Este texto lo escribió Ihor."] }, pt: { exchange: ["Quem escreveu este texto?", "Este texto foi escrito por Ihor."] }, fr: { exchange: ["Qui a écrit ce texte ?", "Ce texte, c’est Ihor qui l’a écrit."] }, de: { exchange: ["Wer hat diesen Text geschrieben?", "Diesen Text hat Ihor geschrieben."] }, it: { exchange: ["Chi ha scritto questo testo?", "Questo testo l’ha scritto Ihor."] }, pl: { exchange: ["Kto napisał ten tekst?", "Ten tekst napisał Ihor."] }, tr: { exchange: ["Bu metni kim yazdı?", "Bu metni Ihor yazdı."] }, id: { exchange: ["Siapa yang menulis teks ini?", "Teks ini ditulis oleh Ihor."] }, vi: { exchange: ["Ai đã viết văn bản này?", "Văn bản này do Ihor viết."] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              uk: "Слово, яке відповідає на питання, стоїть у кінці відповіді."
              en: "The word that answers the question goes at the end of the answer."
              es: "La palabra que responde a la pregunta va al final de la respuesta."
              pt: "A palavra que responde à pergunta vai no fim da resposta."
              fr: "Le mot qui répond à la question se place à la fin de la réponse."
              de: "Das Wort, das die Frage beantwortet, steht am Ende der Antwort."
              it: "La parola che risponde alla domanda va alla fine della risposta."
              pl: "Wyraz, który odpowiada na pytanie, stoi na końcu odpowiedzi."
