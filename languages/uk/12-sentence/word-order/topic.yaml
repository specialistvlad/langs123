            ex: ["У нас ", { target: нова́ кварти́ра }, "."]
            tr: { en: "We have a new flat.", es: "Tenemos un apartamento nuevo.", pt: "Temos um apartamento novo.", fr: "Nous avons un nouvel appartement.", de: "Wir haben eine neue Wohnung.", it: "Abbiamo un appartamento nuovo.", pl: "Mamy nowe mieszkanie.", tr: "Yeni bir dairemiz var.", id: "Kami punya apartemen baru.", vi: "Chúng tôi có một căn hộ mới." }
          - level: A1
            rule: { uk: "час чи місце на початку", en: "time or place at the start", es: "el tiempo o el lugar al principio", pt: "o tempo ou o lugar no início", fr: "le temps ou le lieu au début", de: "Zeit oder Ort am Anfang", it: "il tempo o il luogo all’inizio", pl: "czas lub miejsce na początku", tr: "zaman ya da yer başta", id: "waktu atau tempat di awal", vi: "thời gian hoặc nơi chốn ở đầu" }
            ex: [{ target: У се́рпні }, " ми ї́демо до Льво́ва."]
            tr: { en: "In August we're going to Lviv.", es: "En agosto vamos a Leópolis.", pt: "Em agosto vamos a Lviv.", fr: "En août, nous allons à Lviv.", de: "Im August fahren wir nach Lwiw.", it: "In agosto andiamo a Leopoli.", pl: "W sierpniu jedziemy do Lwowa.", tr: "Ağustos’ta Lviv’e gidiyoruz.", id: "Pada bulan Agustus kami pergi ke Lviv.", vi: "Vào tháng Tám chúng tôi đi Lviv." }
