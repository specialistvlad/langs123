      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Час дієслова лишається таким, яким був у прямій мові: теперішній час означає «тоді, коли говорили»."
              en: "The verb keeps the tense of the direct speech: the present means “at the time they spoke”."
              es: "El verbo mantiene el tiempo del estilo directo: el presente significa «en el momento en que habló»."
              pt: "O tempo do verbo continua o do discurso direto: o presente significa “no momento em que falaram”."
              fr: "Le verbe garde le temps du discours direct : le présent signifie « au moment où la personne parlait »."
              de: "Das Verb behält die Zeitform der direkten Rede: Das Präsens bedeutet „zum Zeitpunkt des Sprechens“."
              it: "Il verbo mantiene il tempo del discorso diretto: il presente significa «nel momento in cui hanno parlato»."
              pl: "Czasownik zachowuje czas z mowy niezależnej: czas teraźniejszy oznacza „w chwili, gdy ktoś mówił”."
              tr: "Fiil, doğrudan anlatımdaki zamanını korur: şimdiki zaman “konuşulduğu anı” gösterir."
              id: "Kata kerja tetap memakai kala dari kalimat langsung: kala kini berarti “pada saat orang itu berbicara”."
              vi: "Động từ giữ nguyên thì của câu trực tiếp: thì hiện tại nghĩa là “vào lúc người ấy nói”."
            ex: { contrast: [["Він сказа́в: «Я ", { target: працю́ю }, " в ба́нку»."], ["Він сказа́в, що ", { target: працю́є }, " в ба́нку."]] }
            tr: { en: { contrast: ["He said, “I work in a bank.”", "He said he worked in a bank."] }, es: { contrast: ["Dijo: «Trabajo en un banco».", "Dijo que trabajaba en un banco."] }, pt: { contrast: ["Ele disse: “Trabalho em um banco.”", "Ele disse que trabalhava em um banco."] }, fr: { contrast: ["Il a dit : « Je travaille dans une banque. »", "Il a dit qu’il travaillait dans une banque."] }, de: { contrast: ["Er sagte: „Ich arbeite in einer Bank.“", "Er sagte, dass er in einer Bank arbeitet."] }, it: { contrast: ["Ha detto: «Lavoro in una banca».", "Ha detto che lavorava in una banca."] }, pl: { contrast: ["Powiedział: „Pracuję w banku.”", "Powiedział, że pracuje w banku."] }, tr: { contrast: ["Dedi ki: “Bankada çalışıyorum.”", "Bankada çalıştığını söyledi."] }, id: { contrast: ["Dia berkata, “Saya bekerja di bank.”", "Dia berkata bahwa dia bekerja di bank."] }, vi: { contrast: ["Anh ấy nói: “Tôi làm việc ở ngân hàng.”", "Anh ấy nói là anh ấy làm việc ở ngân hàng."] } }
          - type: rule
            level: B1
            text:
              uk: "Займенники й дієслова змінюють особу так, як у звичайному переказі."
              en: "Pronouns and verbs change person, as when you pass anything on."
              es: "Los pronombres y los verbos cambian de persona, como en cualquier relato."
              pt: "Os pronomes e os verbos mudam de pessoa, como em qualquer relato."
              fr: "Les pronoms et les verbes changent de personne, comme dans tout récit rapporté."
              de: "Pronomen und Verben wechseln die Person, wie in jeder Wiedergabe."
              it: "I pronomi e i verbi cambiano persona, come in qualsiasi racconto riferito."
              pl: "Zaimki i czasowniki zmieniają osobę, jak w każdym przekazie cudzych słów."
              tr: "Zamirler ve fiiller, başkasının sözü aktarılırken olduğu gibi kişi değiştirir."
              id: "Pronomina dan kata kerja berganti orang, seperti saat menceritakan ulang apa pun."
              vi: "Đại từ và động từ đổi ngôi, như khi thuật lại bất kỳ lời nào."
            ex: { contrast: [["Андрі́й: «", { target: Я люблю́ }, " ка́ву»."], ["Андрі́й сказа́в, що ", { target: він лю́бить }, " ка́ву."]] }
            tr: { en: { contrast: ["Andrii: “I love coffee.”", "Andrii said he loved coffee."] }, es: { contrast: ["Andrii: «Me encanta el café».", "Andrii dijo que le encantaba el café."] }, pt: { contrast: ["Andrii: “Eu gosto de café.”", "Andrii disse que gostava de café."] }, fr: { contrast: ["Andrii : « J’aime le café. »", "Andrii a dit qu’il aimait le café."] }, de: { contrast: ["Andrii: „Ich mag Kaffee.“", "Andrii sagte, dass er Kaffee mag."] }, it: { contrast: ["Andrii: «Mi piace il caffè».", "Andrii ha detto che gli piaceva il caffè."] }, pl: { contrast: ["Andrii: „Lubię kawę.”", "Andrii powiedział, że lubi kawę."] }, tr: { contrast: ["Andrii: “Kahveyi severim.”", "Andrii kahveyi sevdiğini söyledi."] }, id: { contrast: ["Andrii: “Saya suka kopi.”", "Andrii bilang bahwa dia suka kopi."] }, vi: { contrast: ["Andrii: “Tôi thích cà phê.”", "Andrii nói là anh ấy thích cà phê."] } }

