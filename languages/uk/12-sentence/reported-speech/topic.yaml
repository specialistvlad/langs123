sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Пряма мова передає слова дослівно, у лапках; непряма переказує їх у підрядній частині."
              en: "Direct speech gives the exact words in quotation marks; reported speech passes them on in a clause."
              es: "El estilo directo da las palabras exactas entre comillas; el indirecto las transmite en una oración subordinada."
              pt: "O discurso direto reproduz as palavras exatas, entre aspas; o indireto as transmite em uma oração subordinada."
              fr: "Le discours direct reproduit les paroles exactes entre guillemets ; le discours indirect les rapporte dans une proposition subordonnée."
              de: "Die direkte Rede gibt die Worte wörtlich in Anführungszeichen wieder; die indirekte Rede gibt sie in einem Nebensatz weiter."
              it: "Il discorso diretto riporta le parole esatte tra virgolette; il discorso indiretto le riferisce in una proposizione subordinata."
              pl: "Mowa niezależna podaje słowa dosłownie, w cudzysłowie; mowa zależna przekazuje je w zdaniu podrzędnym."
              tr: "Doğrudan anlatım sözleri olduğu gibi, tırnak içinde verir; dolaylı anlatım onları yan cümlede aktarır."
              id: "Kalimat langsung menyampaikan kata-kata persis, dalam tanda kutip; kalimat tak langsung menyampaikannya dalam anak kalimat."
              vi: "Câu trực tiếp giữ nguyên lời, đặt trong dấu ngoặc kép; câu gián tiếp thuật lại lời ấy trong một mệnh đề phụ."
            ex: { contrast: ["Виклада́ч сказа́в: «Ви пови́нні ува́жно прочита́ти текст».", ["Виклада́ч сказа́в, ", { target: що ми пови́нні }, " ува́жно прочита́ти текст."]] }
            tr: { en: { contrast: ["The teacher said, “You must read the text carefully.”", "The teacher said that we had to read the text carefully."] }, es: { contrast: ["El profesor dijo: «Deben leer el texto con atención».", "El profesor dijo que debíamos leer el texto con atención."] }, pt: { contrast: ["O professor disse: “Vocês devem ler o texto com atenção.”", "O professor disse que nós devíamos ler o texto com atenção."] }, fr: { contrast: ["Le professeur a dit : « Vous devez lire le texte attentivement. »", "Le professeur a dit que nous devions lire le texte attentivement."] }, de: { contrast: ["Der Lehrer sagte: „Ihr müsst den Text aufmerksam lesen.“", "Der Lehrer sagte, dass wir den Text aufmerksam lesen müssen."] }, it: { contrast: ["L’insegnante ha detto: «Dovete leggere il testo con attenzione».", "L’insegnante ha detto che dovevamo leggere il testo con attenzione."] }, pl: { contrast: ["Nauczyciel powiedział: „Musicie uważnie przeczytać tekst.”", "Nauczyciel powiedział, że musimy uważnie przeczytać tekst."] }, tr: { contrast: ["Öğretmen şöyle dedi: “Metni dikkatle okumalısınız.”", "Öğretmen metni dikkatle okumamız gerektiğini söyledi."] }, id: { contrast: ["Guru berkata, “Kalian harus membaca teks ini dengan saksama.”", "Guru berkata bahwa kami harus membaca teks itu dengan saksama."] }, vi: { contrast: ["Giáo viên nói: “Các bạn phải đọc kỹ văn bản.”", "Giáo viên nói là chúng tôi phải đọc kỹ văn bản."] } }
          - type: rule
            level: B1
            text:
              uk: "Коли слова автора стоять перед прямою мовою, після них ставимо двокрапку. Коли після: за розповідною прямою мовою — кома й тире, за питанням чи окликом — лише тире."
              en: "When the reporting words come first, a colon follows them. When they come after: a statement takes a comma and a dash after the quotation marks, a question or an exclamation only a dash."
              es: "Cuando las palabras del narrador van delante, las siguen dos puntos. Cuando van detrás: tras una afirmación van una coma y una raya; tras una pregunta o una exclamación, solo la raya."
              pt: "Quando as palavras do narrador vêm antes da fala, depois delas vão dois-pontos. Quando vêm depois: após uma afirmação, vírgula e travessão; após uma pergunta ou exclamação, só o travessão."
              fr: "Quand les mots du narrateur précèdent les paroles, ils sont suivis de deux-points. Quand ils les suivent : après une phrase déclarative, une virgule et un tiret ; après une question ou une exclamation, un tiret seulement."
              de: "Stehen die Worte des Erzählers vor der direkten Rede, folgt ein Doppelpunkt. Stehen sie danach: Nach einer Aussage folgen Komma und Gedankenstrich, nach einer Frage oder einem Ausruf nur der Gedankenstrich."
              it: "Quando le parole del narratore precedono il discorso diretto, seguono i due punti. Quando lo seguono: dopo un’affermazione si mettono virgola e trattino, dopo una domanda o un’esclamazione solo il trattino."
              pl: "Gdy słowa narratora stoją przed mową niezależną, po nich stawiamy dwukropek. Gdy stoją po niej: po zdaniu oznajmującym — przecinek i myślnik, po pytaniu lub wykrzyknieniu — sam myślnik."
              tr: "Anlatıcının sözleri doğrudan anlatımdan önce gelirse, ardından iki nokta konur. Sonra gelirse: bildirme cümlesinden sonra virgül ve tire, soru ya da ünlemden sonra yalnız tire konur."
              id: "Jika kata-kata narator berada sebelum kalimat langsung, setelahnya dipasang tanda titik dua. Jika sesudahnya: setelah kalimat berita dipakai koma dan tanda pisah, setelah kalimat tanya atau seru hanya tanda pisah."
              vi: "Khi lời dẫn của người kể đứng trước lời trực tiếp, sau đó đặt dấu hai chấm. Khi đứng sau: sau câu kể là dấu phẩy và dấu gạch ngang, sau câu hỏi hoặc câu cảm thán chỉ có dấu gạch ngang."
            ex: { contrast: ["«Я вдо́ма», — сказа́ла ма́ма.", "«Ти вдо́ма?» — запита́ла ма́ма."] }
            tr: { en: { contrast: ["“I'm home,” Mum said.", "“Are you home?” Mum asked."] }, es: { contrast: ["«Estoy en casa», dijo mamá.", "«¿Estás en casa?», preguntó mamá."] }, pt: { contrast: ["“Estou em casa”, disse a mãe.", "“Você está em casa?”, perguntou a mãe."] }, fr: { contrast: ["« Je suis à la maison », a dit maman.", "« Tu es à la maison ? » a demandé maman."] }, de: { contrast: ["„Ich bin zu Hause“, sagte Mama.", "„Bist du zu Hause?“, fragte Mama."] }, it: { contrast: ["«Sono a casa», ha detto la mamma.", "«Sei a casa?», ha chiesto la mamma."] }, pl: { contrast: ["„Jestem w domu”, powiedziała mama.", "„Jesteś w domu?” — zapytała mama."] }, tr: { contrast: ["“Evdeyim,” dedi annem.", "“Evde misin?” diye sordu annem."] }, id: { contrast: ["“Saya di rumah,” kata ibu.", "“Apakah kamu di rumah?” tanya ibu."] }, vi: { contrast: ["“Mẹ ở nhà,” mẹ nói.", "“Con có ở nhà không?” mẹ hỏi."] } }

