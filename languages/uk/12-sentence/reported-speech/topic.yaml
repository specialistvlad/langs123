title: { uk: Пряма й непряма мова, en: Direct and Reported Speech, es: Estilo directo e indirecto, pt: "Discurso direto e indireto", fr: "Discours direct et indirect", de: "Direkte und indirekte Rede", it: "Discorso diretto e indiretto", pl: "Mowa niezależna i zależna", tr: "Doğrudan ve dolaylı anlatım", id: "Kalimat langsung dan tak langsung", vi: "Câu trực tiếp và câu gián tiếp" }
summary:
  lead:
    uk: ["Непряма мова переказує чужі слова через ", { term: що }, ", ", { term: чи }, ", питальне слово або ", { term: щоб }, ", а час дієслова лишається таким, як у прямій мові."]
    en: ["Reported speech passes on words with ", { term: що }, ", ", { term: чи }, ", a question word or ", { term: щоб }, ", and the verb keeps the tense of the original words."]
    es: ["El estilo indirecto transmite lo dicho con ", { term: що }, ", ", { term: чи }, ", una palabra interrogativa o ", { term: щоб }, ", y el verbo mantiene el tiempo de las palabras originales."]
    pt: ["O discurso indireto transmite as palavras de outra pessoa com ", { term: що }, ", ", { term: чи }, ", uma palavra interrogativa ou ", { term: щоб }, ", e o verbo mantém o tempo do discurso direto."]
    fr: ["Le discours indirect rapporte les paroles d’autrui avec ", { term: що }, ", ", { term: чи }, ", un mot interrogatif ou ", { term: щоб }, ", et le verbe garde le temps du discours direct."]
    de: ["Die indirekte Rede gibt fremde Worte mit ", { term: що }, ", ", { term: чи }, ", einem Fragewort oder ", { term: щоб }, " wieder, und das Verb behält die Zeitform der direkten Rede."]
    it: ["Il discorso indiretto riferisce le parole altrui con ", { term: що }, ", ", { term: чи }, ", una parola interrogativa o ", { term: щоб }, ", e il verbo mantiene il tempo del discorso diretto."]
    pl: ["Mowa zależna przekazuje cudze słowa za pomocą ", { term: що }, ", ", { term: чи }, ", zaimka pytajnego lub ", { term: щоб }, ", a czasownik zachowuje czas z mowy niezależnej."]
    tr: ["Dolaylı anlatım, başkasının sözlerini ", { term: що }, ", ", { term: чи }, ", bir soru sözcüğü ya da ", { term: щоб }, " ile aktarır; fiilin zamanı doğrudan anlatımdaki gibi kalır."]
    id: ["Kalimat tak langsung menyampaikan ucapan orang lain dengan ", { term: що }, ", ", { term: чи }, ", kata tanya atau ", { term: щоб }, ", dan kala kata kerja tetap seperti pada kalimat langsung."]
    vi: ["Câu gián tiếp thuật lại lời người khác bằng ", { term: що }, ", ", { term: чи }, ", từ để hỏi hoặc ", { term: щоб }, ", và động từ giữ nguyên thì như trong câu trực tiếp."]
  rule:
    uk: "Час дієслова в непрямій мові не змінюється:"
    en: "The verb keeps the tense the speaker used:"
    es: "El verbo mantiene el tiempo que usó quien habló:"
    pt: "O tempo do verbo no discurso indireto não muda:"
    fr: "Le temps du verbe ne change pas dans le discours indirect :"
    de: "Die Zeitform des Verbs ändert sich in der indirekten Rede nicht:"
    it: "Il tempo del verbo nel discorso indiretto non cambia:"
    pl: "Czas czasownika w mowie zależnej się nie zmienia:"
    tr: "Dolaylı anlatımda fiilin zamanı değişmez:"
    id: "Kala kata kerja dalam kalimat tak langsung tidak berubah:"
    vi: "Thì của động từ trong câu gián tiếp không thay đổi:"
  ex: { contrast: [["Оле́г сказа́в: «Я ", { target: вто́млений }, "»."], ["Оле́г сказа́в, що він ", { target: уто́млений }, "."]] }

