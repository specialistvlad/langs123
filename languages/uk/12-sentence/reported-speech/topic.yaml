            de: ["eine indirekte Ja-Nein-Frage steht mit ", { term: чи }]
            it: ["la domanda indiretta sì/no vuole ", { term: чи }]
            pl: ["pytanie zależne typu tak/nie wprowadza się przez ", { term: чи }]
            tr: ["dolaylı evet-hayır sorusu ", { term: чи }, " ile kurulur"]
