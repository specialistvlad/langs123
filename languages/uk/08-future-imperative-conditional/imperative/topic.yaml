sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Форма на «ти» звертається до однієї близької особи, форма на ", { term: -те }, " — до кількох осіб або ввічливо до однієї."]
              en: ["The ти form speaks to one person you know well; the form in ", { term: -те }, " speaks to several people or politely to one."]
              es: ["La forma de ти se dirige a una persona de confianza; la forma en ", { term: -те }, ", a varias personas o, con cortesía, a una."]
              pt: ["A forma de ти se dirige a uma pessoa próxima; a forma em ", { term: -те }, " se dirige a várias pessoas ou, com cortesia, a uma só."]
              fr: ["La forme de ти s’adresse à une personne qu’on connaît bien ; la forme en ", { term: -те }, " s’adresse à plusieurs personnes ou, par politesse, à une seule."]
              de: ["Die ти-Form richtet sich an eine vertraute Person; die Form auf ", { term: -те }, " an mehrere Personen oder höflich an eine einzelne."]
              it: ["La forma di ти si rivolge a una persona di confidenza; la forma in ", { term: -те }, " a più persone o, per cortesia, a una sola."]
              pl: ["Forma ти zwraca się do jednej bliskiej osoby; forma na ", { term: -те }, " — do kilku osób albo grzecznościowo do jednej."]
              tr: ["ти biçimi tanıdık tek bir kişiye seslenir; ", { term: -те }, " ile biten biçim birkaç kişiye ya da nazik biçimde tek kişiye seslenir."]
              id: ["Bentuk ти ditujukan kepada satu orang yang akrab; bentuk berakhiran ", { term: -те }, " ditujukan kepada beberapa orang atau, secara sopan, kepada satu orang."]
              vi: ["Dạng ти dùng với một người thân quen; dạng kết thúc bằng ", { term: -те }, " dùng với nhiều người hoặc với một người một cách lịch sự."]
            ex: { examples: [["Окса́но, ", { target: сіда́й }, "."], ["Па́не профе́соре, ", { target: сіда́йте }, "."]] }
            tr: { en: { examples: ["Oksana, sit down.", "Professor, please sit down."] }, es: { examples: ["Oksana, siéntate.", "Profesor, siéntese."] }, pt: { examples: ["Oksana, senta.", "Professor, sente-se."] }, fr: { examples: ["Oksana, assieds-toi.", "Monsieur le professeur, asseyez-vous."] }, de: { examples: ["Oksana, setz dich.", "Herr Professor, setzen Sie sich."] }, it: { examples: ["Oksana, siediti.", "Professore, si segga."] }, pl: { examples: ["Oksana, usiądź.", "Panie profesorze, proszę usiąść."] }, tr: { examples: ["Oksana, otur.", "Profesör Bey, oturun."] }, id: { examples: ["Oksana, duduklah.", "Pak Profesor, silakan duduk."] }, vi: { examples: ["Oksana, ngồi xuống đi.", "Thưa giáo sư, mời ông ngồi."] } }
          - type: rule
            level: A1
            text:
              uk: "Форму утворюють від основи теперішнього або простого майбутнього часу: вона та сама, що у формі «вони»."
              en: "The form is built on the stem of the present or the simple future: the stem of the вони (they) form."
              es: "La forma se construye sobre la raíz del presente o del futuro simple: la de la forma de вони (ellos)."
              pt: "A forma se constrói sobre o radical do presente ou do futuro simples: o mesmo da forma de вони (eles)."
              fr: "La forme se construit sur le radical du présent ou du futur simple : celui de la forme de вони (ils)."
              de: "Die Form wird vom Stamm des Präsens oder des einfachen Futurs gebildet: dem der вони-Form (sie)."
              it: "La forma si costruisce sulla radice del presente o del futuro semplice: la stessa della forma di вони (loro)."
              pl: "Forma powstaje od rdzenia czasu teraźniejszego lub prostego czasu przyszłego: tego samego, co w formie вони (oni)."
              tr: "Biçim, şimdiki zamanın ya da basit gelecek zamanın kökünden kurulur: вони (onlar) biçimindeki kökle aynıdır."
