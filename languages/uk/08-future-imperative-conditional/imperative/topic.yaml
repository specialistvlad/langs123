title: { uk: Наказовий спосіб, en: Imperative, es: El imperativo, pt: "O imperativo", fr: "L’impératif", de: "Imperativ", it: "Imperativo", pl: "Tryb rozkazujący", tr: "Emir kipi", id: "Kalimat perintah", vi: "Câu mệnh lệnh" }
summary:
  lead:
    uk: ["Наказовий спосіб виражає прохання, пораду чи наказ: ", { term: чита́й }, " до однієї особи на «ти», ", { term: чита́йте }, " до кількох осіб і ввічливо."]
    en: ["The imperative makes requests, suggestions and orders: ", { term: чита́й }, " to one person you call ти, ", { term: чита́йте }, " to several people and politely."]
    es: ["El imperativo expresa peticiones, consejos y órdenes: ", { term: чита́й }, " a una persona a la que se trata de ти; ", { term: чита́йте }, ", a varias personas y con cortesía."]
    pt: ["O imperativo expressa pedidos, conselhos e ordens: ", { term: чита́й }, " para uma pessoa tratada por ти, ", { term: чита́йте }, " para várias pessoas e com cortesia."]
    fr: ["L’impératif exprime demandes, conseils et ordres : ", { term: чита́й }, " pour une personne qu’on tutoie (ти), ", { term: чита́йте }, " pour plusieurs personnes et par politesse."]
    de: ["Der Imperativ drückt Bitten, Ratschläge und Befehle aus: ", { term: чита́й }, " für eine Person, die man duzt (ти), ", { term: чита́йте }, " für mehrere Personen und höflich."]
    it: ["L'imperativo esprime richieste, consigli e ordini: ", { term: чита́й }, " per una persona a cui si dà del ти, ", { term: чита́йте }, " per più persone e per cortesia."]
    pl: ["Tryb rozkazujący wyraża prośby, rady i polecenia: ", { term: чита́й }, " do jednej osoby na «ти», ", { term: чита́йте }, " do kilku osób i grzecznościowo."]
    tr: ["Emir kipi rica, tavsiye ve emir bildirir: ", { term: чита́й }, " «ти» diye hitap edilen tek kişiye, ", { term: чита́йте }, " birkaç kişiye ve nazik hitapta."]
    id: ["Kalimat perintah menyatakan permintaan, saran, dan perintah: ", { term: чита́й }, " untuk satu orang yang disapa «ти», ", { term: чита́йте }, " untuk beberapa orang dan secara sopan."]
    vi: ["Câu mệnh lệnh diễn đạt lời nhờ, lời khuyên và mệnh lệnh: ", { term: чита́й }, " cho một người xưng «ти», ", { term: чита́йте }, " cho nhiều người và khi lịch sự."]
  rule:
    uk: ["Ввічлива форма й форма множини мають ", { term: -те }, " або ", { term: -іть }, ":"]
    en: ["The polite and plural form ends in ", { term: -те }, " or ", { term: -іть }, ":"]
    es: ["La forma de cortesía y de plural termina en ", { term: -те }, " o ", { term: -іть }, ":"]
    pt: ["A forma de cortesia e a do plural terminam em ", { term: -те }, " ou ", { term: -іть }, ":"]
    fr: ["La forme de politesse et celle du pluriel se terminent en ", { term: -те }, " ou ", { term: -іть }, " :"]
    de: ["Die Höflichkeitsform und die Pluralform enden auf ", { term: -те }, " oder ", { term: -іть }, ":"]
    it: ["La forma di cortesia e quella plurale terminano in ", { term: -те }, " o ", { term: -іть }, ":"]
    pl: ["Forma grzecznościowa i forma liczby mnogiej kończą się na ", { term: -те }, " lub ", { term: -іть }, ":"]
    tr: ["Nazik hitap ve çoğul biçimi ", { term: -те }, " veya ", { term: -іть }, " ile biter:"]
    id: ["Bentuk sopan dan bentuk jamak berakhiran ", { term: -те }, " atau ", { term: -іть }, ":"]
    vi: ["Dạng lịch sự và dạng số nhiều kết thúc bằng ", { term: -те }, " hoặc ", { term: -іть }, ":"]
  ex: { examples: [[{ target: Сіда́йте }, ", будь ла́ска."], [{ target: Скажі́ть }, ", де вокза́л?"]] }

