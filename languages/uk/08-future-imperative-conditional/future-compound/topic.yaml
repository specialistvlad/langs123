  - title: { uk: "Форма: просте майбутнє доконаного виду", en: "Form: the simple future of the perfective", es: "Forma: el futuro simple del perfectivo", pt: "Forma: o futuro simples do perfectivo", fr: "Forme : le futur simple du perfectif", de: "Form: das einfache Futur des perfektiven Aspekts", it: "Forma: il futuro semplice del perfettivo", pl: "Forma: czas przyszły prosty aspektu dokonanego", tr: "Biçim: tamamlanmış görünüşün basit gelecek zamanı", id: "Bentuk: masa depan sederhana aspek perfektif", vi: "Dạng: tương lai đơn của thể hoàn thành" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: who, label: { uk: Хто, en: Who, es: Quién, pt: "Quem", fr: "Qui", de: "Wer", it: "Chi", pl: "Kto", tr: "Kim", id: "Siapa", vi: "Ai" } }
