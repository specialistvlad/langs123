title: { uk: "Майбутній час: буду читати, скажу", en: "Future: буду читати, скажу", es: "El futuro: буду читати, скажу", pt: "Futuro: буду читати, скажу", fr: "Le futur : буду читати, скажу", de: "Das Futur: буду читати, скажу", it: "Il futuro: буду читати, скажу", pl: "Czas przyszły: буду читати, скажу", tr: "Gelecek zaman: буду читати, скажу", id: "Masa depan: буду читати, скажу", vi: "Thì tương lai: буду читати, скажу" }
summary:
  lead:
    uk: ["Недоконаний вид утворює майбутнє з ", { term: бу́ду }, " та інфінітивом (", { term: бу́ду чита́ти }, "), доконаний — з особовими закінченнями (", { term: скажу́ }, ")."]
    en: ["The imperfective forms its future with ", { term: бу́ду }, " and the infinitive (", { term: бу́ду чита́ти }, "), the perfective with person endings (", { term: скажу́ }, ")."]
    es: ["El imperfectivo forma el futuro con ", { term: бу́ду }, " y el infinitivo (", { term: бу́ду чита́ти }, "); el perfectivo, con terminaciones de persona (", { term: скажу́ }, ")."]
    pt: ["O imperfectivo forma o futuro com ", { term: бу́ду }, " e o infinitivo (", { term: бу́ду чита́ти }, "); o perfectivo, com desinências de pessoa (", { term: скажу́ }, ")."]
    fr: ["L’imperfectif forme son futur avec ", { term: бу́ду }, " et l’infinitif (", { term: бу́ду чита́ти }, "), le perfectif avec les terminaisons de personne (", { term: скажу́ }, ")."]
    de: ["Der imperfektive Aspekt bildet das Futur mit ", { term: бу́ду }, " und dem Infinitiv (", { term: бу́ду чита́ти }, "), der perfektive mit Personenendungen (", { term: скажу́ }, ")."]
    it: ["L'imperfettivo forma il futuro con ", { term: бу́ду }, " e l'infinito (", { term: бу́ду чита́ти }, "), il perfettivo con le desinenze personali (", { term: скажу́ }, ")."]
    pl: ["Aspekt niedokonany tworzy czas przyszły z ", { term: бу́ду }, " i bezokolicznikiem (", { term: бу́ду чита́ти }, "), dokonany — z końcówkami osobowymi (", { term: скажу́ }, ")."]
    tr: ["Tamamlanmamış görünüş geleceği ", { term: бу́ду }, " ve mastarla kurar (", { term: бу́ду чита́ти }, "), tamamlanmış görünüş kişi ekleriyle (", { term: скажу́ }, ")."]
    id: ["Aspek imperfektif membentuk masa depan dengan ", { term: бу́ду }, " dan infinitif (", { term: бу́ду чита́ти }, "), aspek perfektif dengan akhiran persona (", { term: скажу́ }, ")."]
    vi: ["Thể chưa hoàn thành tạo thì tương lai bằng ", { term: бу́ду }, " và động từ nguyên mẫu (", { term: бу́ду чита́ти }, "), thể hoàn thành bằng đuôi chia ngôi (", { term: скажу́ }, ")."]
  rule:
    uk: ["Після ", { term: бу́ду }, " стоїть лише інфінітив недоконаного виду:"]
    en: ["Only an imperfective infinitive follows ", { term: бу́ду }, ":"]
    es: ["Después de ", { term: бу́ду }, " solo va un infinitivo imperfectivo:"]
    pt: ["Depois de ", { term: бу́ду }, " vem só um infinitivo imperfectivo:"]
    fr: ["Seul un infinitif imperfectif suit ", { term: бу́ду }, " :"]
    de: ["Nach ", { term: бу́ду }, " steht nur ein imperfektiver Infinitiv:"]
    it: ["Dopo ", { term: бу́ду }, " va solo un infinito imperfettivo:"]
    pl: ["Po ", { term: бу́ду }, " stoi tylko bezokolicznik niedokonany:"]
    tr: ["Yalnızca tamamlanmamış görünüşün mastarı ", { term: бу́ду }, " sözcüğünü izler:"]
    id: ["Setelah ", { term: бу́ду }, " hanya infinitif imperfektif yang dipakai:"]
    vi: ["Sau ", { term: бу́ду }, " chỉ có động từ nguyên mẫu thể chưa hoàn thành:"]
  ex: { examples: [["Уве́чері я ", { target: бу́ду чита́ти }, "."], ["Я ", { target: прочита́ю }, " цей текст."]] }

