          - { key: say, label: сказа́ти, features: { tense: fut, aspect: pfv } }
          - { key: can, label: змогти́, features: { tense: fut, aspect: pfv } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, who: я, read: [прочита́, { ending: ю }], say: [скаж, { ending: у́ }], can: [змо́ж, { ending: у }] }
          - { level: A1, features: { person: 2, number: sg }, who: ти, read: [прочита́, { ending: єш }], say: [ска́ж, { ending: еш }], can: [змо́ж, { ending: еш }] }
          - { level: A1, features: { person: 3, number: sg }, who: { alternatives: [він, вона́, воно́] }, read: [прочита́, { ending: є }], say: [ска́ж, { ending: е }], can: [змо́ж, { ending: е }] }
          - { level: A1, features: { person: 1, number: pl }, who: ми, read: [прочита́, { ending: ємо }], say: [ска́ж, { ending: емо }], can: [змо́ж, { ending: емо }] }
          - { level: A1, features: { person: 2, number: pl }, who: { alternatives: [ви, Ви] }, read: [прочита́, { ending: єте }], say: [ска́ж, { ending: ете }], can: [змо́ж, { ending: ете }] }
          - { level: A1, features: { person: 3, number: pl }, who: вони́, read: [прочита́, { ending: ють }], say: [ска́ж, { ending: уть }], can: [змо́ж, { ending: уть }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: "Доконані дієслова відмінюються, як дієслова в теперішньому часі, але означають майбутнє."
              en: "Perfective verbs conjugate like verbs in the present but mean the future."
              es: "Los verbos perfectivos se conjugan como en presente, pero expresan futuro."
              pt: "Os verbos perfectivos se conjugam como no presente, mas indicam futuro."
              fr: "Les verbes perfectifs se conjuguent comme au présent, mais expriment le futur."
              de: "Perfektive Verben werden wie im Präsens konjugiert, drücken aber das Futur aus."
              it: "I verbi perfettivi si coniugano come al presente, ma esprimono il futuro."
              pl: "Czasowniki dokonane odmieniają się jak w czasie teraźniejszym, ale oznaczają przyszłość."
              tr: "Tamamlanmış görünüşteki fiiller şimdiki zamandaki gibi çekimlenir, ama geleceği anlatır."
              id: "Kata kerja perfektif dikonjugasi seperti pada masa kini, tetapi menyatakan masa depan."
              vi: "Động từ thể hoàn thành chia như ở thì hiện tại nhưng diễn tả tương lai."
            ex: { contrast: [["Я ", { target: чита́ю }, " текст"], ["Я ", { target: прочита́ю }, " текст"]] }
            tr: { en: { contrast: ["I'm reading the text", "I'll read the text"] }, es: { contrast: ["Leo el texto", "Leeré el texto"] }, pt: { contrast: ["Estou lendo o texto", "Vou ler o texto"] }, fr: { contrast: ["Je lis le texte", "Je lirai le texte"] }, de: { contrast: ["Ich lese den Text", "Ich werde den Text lesen"] }, it: { contrast: ["Leggo il testo", "Leggerò il testo"] }, pl: { contrast: ["Czytam tekst", "Przeczytam tekst"] }, tr: { contrast: ["Metni okuyorum", "Metni okuyacağım"] }, id: { contrast: ["Saya sedang membaca teks itu", "Saya akan membaca teks itu"] }, vi: { contrast: ["Tôi đang đọc bài", "Tôi sẽ đọc bài"] } }

