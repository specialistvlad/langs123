          tr: { en: "I'll read this text.", es: "Leeré este texto.", pt: "Vou ler este texto.", fr: "Je lirai ce texte.", de: "Ich werde diesen Text lesen.", it: "Leggerò questo testo.", pl: "Przeczytam ten tekst.", tr: "Bu metni okuyacağım.", id: "Saya akan membaca teks ini.", vi: "Tôi sẽ đọc bài này." }

sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              uk: ["Дієслова недоконаного виду мають складене майбутнє: ", { term: бу́ду }, " та інфінітив."]
              en: ["Imperfective verbs have a compound future: ", { term: бу́ду }, " and the infinitive."]
              es: ["Los verbos imperfectivos tienen un futuro compuesto: ", { term: бу́ду }, " y el infinitivo."]
              pt: ["Os verbos imperfectivos têm um futuro composto: ", { term: бу́ду }, " e o infinitivo."]
              fr: ["Les verbes imperfectifs ont un futur composé : ", { term: бу́ду }, " et l’infinitif."]
              de: ["Imperfektive Verben haben ein zusammengesetztes Futur: ", { term: бу́ду }, " und der Infinitiv."]
              it: ["I verbi imperfettivi hanno un futuro composto: ", { term: бу́ду }, " e l'infinito."]
              pl: ["Czasowniki niedokonane mają czas przyszły złożony: ", { term: бу́ду }, " i bezokolicznik."]
              tr: ["Tamamlanmamış görünüşteki fiillerin gelecek zamanı bileşiktir: ", { term: бу́ду }, " ve mastar."]
              id: ["Kata kerja imperfektif punya masa depan majemuk: ", { term: бу́ду }, " dan infinitif."]
              vi: ["Động từ thể chưa hoàn thành có tương lai ghép: ", { term: бу́ду }, " và động từ nguyên mẫu."]
            ex: ["За́втра я ", { target: бу́ду працюва́ти }, "."]
            tr: { en: "I'll be working tomorrow.", es: "Mañana trabajaré.", pt: "Amanhã eu vou trabalhar.", fr: "Demain, je travaillerai.", de: "Morgen arbeite ich.", it: "Domani lavorerò.", pl: "Jutro będę pracować.", tr: "Yarın çalışacağım.", id: "Besok saya akan bekerja.", vi: "Ngày mai tôi sẽ làm việc." }
          - type: rule
            level: A1
            text:
              uk: "Дієслова доконаного виду мають просте майбутнє: ті самі закінчення, що в теперішньому часі."
              en: "Perfective verbs have a simple future: the same endings as the present tense."
              es: "Los verbos perfectivos tienen un futuro simple: las mismas terminaciones que el presente."
              pt: "Os verbos perfectivos têm um futuro simples: as mesmas desinências do presente."
              fr: "Les verbes perfectifs ont un futur simple : les mêmes terminaisons qu’au présent."
              de: "Perfektive Verben haben ein einfaches Futur: dieselben Endungen wie im Präsens."
              it: "I verbi perfettivi hanno un futuro semplice: le stesse desinenze del presente."
              pl: "Czasowniki dokonane mają czas przyszły prosty: te same końcówki co w czasie teraźniejszym."
              tr: "Tamamlanmış görünüşteki fiillerin gelecek zamanı basittir: şimdiki zamanla aynı ekler kullanılır."
              id: "Kata kerja perfektif punya masa depan sederhana: akhirannya sama dengan masa kini."
              vi: "Động từ thể hoàn thành có tương lai đơn: đuôi giống như ở thì hiện tại."
            ex: ["Ми ", { target: прочита́ємо }, " текст."]
            tr: { en: "We'll read the text.", es: "Leeremos el texto.", pt: "Vamos ler o texto.", fr: "Nous lirons le texte.", de: "Wir werden den Text lesen.", it: "Leggeremo il testo.", pl: "Przeczytamy tekst.", tr: "Metni okuyacağız.", id: "Kami akan membaca teksnya.", vi: "Chúng tôi sẽ đọc bài." }
          - type: note
            level: A2
            text:
              uk: ["Недоконаний вид має ще одну форму майбутнього: ", { term: чита́тиму }, ". Див. ", { link: "Майбутній час на -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              en: ["The imperfective has one more future form: ", { term: чита́тиму }, ". See ", { link: "Future in -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              es: ["El imperfectivo tiene otra forma de futuro: ", { term: чита́тиму }, ". Ver ", { link: "El futuro en -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              pt: ["O imperfectivo tem mais uma forma de futuro: ", { term: чита́тиму }, ". Veja ", { link: "Futuro em -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              fr: ["L’imperfectif a une autre forme de futur : ", { term: чита́тиму }, ". Voir ", { link: "Le futur en -му : читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              de: ["Der imperfektive Aspekt hat noch eine weitere Futurform: ", { term: чита́тиму }, ". Siehe ", { link: "Das Futur auf -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              it: ["L'imperfettivo ha un'altra forma di futuro: ", { term: чита́тиму }, ". Vedi ", { link: "Il futuro in -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              pl: ["Aspekt niedokonany ma jeszcze jedną formę czasu przyszłego: ", { term: чита́тиму }, ". Zob. ", { link: "Czas przyszły na -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              tr: ["Tamamlanmamış görünüşün bir gelecek zaman biçimi daha vardır: ", { term: чита́тиму }, ". Bkz. ", { link: "-му ile gelecek zaman: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              id: ["Aspek imperfektif punya satu bentuk masa depan lagi: ", { term: чита́тиму }, ". Lihat ", { link: "Masa depan dengan -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]
              vi: ["Thể chưa hoàn thành còn có một dạng tương lai nữa: ", { term: чита́тиму }, ". Xem ", { link: "Thì tương lai với -му: читатиму", to: uk.future-imperative-conditional.future-synthetic }, "."]

  - title: { uk: "Форма: буду й інфінітив", en: "Form: буду with the infinitive", es: "Forma: буду con infinitivo", pt: "Forma: буду com o infinitivo", fr: "Forme : буду avec l’infinitif", de: "Form: буду mit dem Infinitiv", it: "Forma: буду con l'infinito", pl: "Forma: буду z bezokolicznikiem", tr: "Biçim: буду ve mastar", id: "Bentuk: буду dengan infinitif", vi: "Dạng: буду với động từ nguyên mẫu" }
