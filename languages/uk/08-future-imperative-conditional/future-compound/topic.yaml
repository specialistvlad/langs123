          ex: ["Уве́чері ми ", { target: бу́демо диви́тися }, " фільм."]
          tr: { en: "We'll be watching a film this evening.", es: "Esta noche veremos una película.", pt: "À noite, vamos assistir a um filme.", fr: "Ce soir, nous regarderons un film.", de: "Heute Abend sehen wir uns einen Film an.", it: "Stasera guarderemo un film.", pl: "Wieczorem będziemy oglądać film.", tr: "Akşam film izleyeceğiz.", id: "Malam ini kami akan menonton film.", vi: "Tối nay chúng tôi sẽ xem phim." }
        - level: A1
          point: { uk: "Доконаний вид", en: Perfective, es: Perfectivo, pt: "Perfectivo", fr: "Perfectif", de: "Perfektiv", it: "Perfettivo", pl: "Dokonany", tr: "Tamamlanmış görünüş", id: "Perfektif", vi: "Thể hoàn thành" }
          rule: { uk: "особові закінчення означають майбутнє", en: "the person endings mean the future", es: "las terminaciones de persona expresan futuro", pt: "as desinências de pessoa indicam futuro", fr: "les terminaisons de personne expriment le futur", de: "die Personenendungen drücken das Futur aus", it: "le desinenze personali esprimono il futuro", pl: "końcówki osobowe oznaczają czas przyszły", tr: "kişi ekleri gelecek zamanı anlatır", id: "akhiran persona menyatakan masa depan", vi: "đuôi chia ngôi diễn tả tương lai" }
          ex: ["Я ", { target: скажу́ }, " тобі́ за́втра."]
          tr: { en: "I'll tell you tomorrow.", es: "Te lo diré mañana.", pt: "Eu te digo amanhã.", fr: "Je te le dirai demain.", de: "Ich sage es dir morgen.", it: "Te lo dirò domani.", pl: "Powiem ci jutro.", tr: "Sana yarın söyleyeceğim.", id: "Saya akan memberi tahu kamu besok.", vi: "Ngày mai tôi sẽ nói với bạn." }
        - level: A1
          point: { uk: змогти́, en: змогти́, es: змогти́, pt: змогти́, fr: змогти́, de: змогти́, it: змогти́, pl: змогти́, tr: змогти́, id: змогти́, vi: змогти́ }
          rule: { uk: [{ term: змо́жу }, " — майбутнє від ", { term: могти́ }], en: [{ term: змо́жу }, " is the future of ", { term: могти́ }, " (can)"], es: [{ term: змо́жу }, " es el futuro de ", { term: могти́ }, " (poder)"], pt: [{ term: змо́жу }, " é o futuro de ", { term: могти́ }, " (poder)"], fr: [{ term: змо́жу }, " est le futur de ", { term: могти́ }, " (pouvoir)"], de: [{ term: змо́жу }, " ist das Futur von ", { term: могти́ }, " (können)"], it: [{ term: змо́жу }, " è il futuro di ", { term: могти́ }, " (potere)"], pl: [{ term: змо́жу }, " to czas przyszły od ", { term: могти́ }, " (móc)"], tr: [{ term: змо́жу }, ", ", { term: могти́ }, " (-ebilmek) fiilinin gelecek zamanıdır"], id: [{ term: змо́жу }, " adalah bentuk masa depan ", { term: могти́ }, " (bisa)"], vi: [{ term: змо́жу }, " là tương lai của ", { term: могти́ }, " (có thể)"] }
          ex: ["Я ", { target: змо́жу }, " прийти́ о шо́стій."]
          tr: { en: "I'll be able to come at six.", es: "Podré venir a las seis.", pt: "Poderei vir às seis.", fr: "Je pourrai venir à six heures.", de: "Ich werde um sechs kommen können.", it: "Potrò venire alle sei.", pl: "Będę mógł przyjść o szóstej.", tr: "Altıda gelebileceğim.", id: "Saya akan bisa datang pukul enam.", vi: "Tôi sẽ có thể đến lúc sáu giờ." }
        - level: A2
          point: { uk: "Процес чи результат", en: "Process or result", es: "Proceso o resultado", pt: "Processo ou resultado", fr: "Processus ou résultat", de: "Vorgang oder Ergebnis", it: "Processo o risultato", pl: "Proces albo wynik", tr: "Süreç ya da sonuç", id: "Proses atau hasil", vi: "Quá trình hay kết quả" }
          rule: { uk: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, en: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, es: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, pt: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, fr: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, de: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, it: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, pl: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, tr: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, id: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] }, vi: { contrast: [{ term: бу́ду писа́ти }, { term: напишу́ }] } }
          ex: ["Я ", { target: напишу́ }, " вам уве́чері."]
          tr: { en: "I'll write to you this evening.", es: "Le escribiré esta noche.", pt: "Eu vou escrever para vocês hoje à noite.", fr: "Je vous écrirai ce soir.", de: "Ich schreibe Ihnen heute Abend.", it: "Le scriverò stasera.", pl: "Napiszę do was wieczorem.", tr: "Akşam size yazacağım.", id: "Saya akan menulis kepada Anda malam ini.", vi: "Tối nay tôi sẽ viết thư cho bạn." }
        - level: A2
          point: { uk: Обіцянка, en: Promise, es: Promesa, pt: "Promessa", fr: "Promesse", de: "Versprechen", it: "Promessa", pl: "Obietnica", tr: "Söz", id: "Janji", vi: "Lời hứa" }
          rule: { uk: "одна дія з результатом — доконаний вид", en: "one action with a result takes the perfective", es: "una acción con resultado lleva el perfectivo", pt: "uma ação com resultado leva o perfectivo", fr: "une action avec résultat prend le perfectif", de: "eine Handlung mit Ergebnis steht im perfektiven Aspekt", it: "un'azione con risultato vuole il perfettivo", pl: "jedna czynność z wynikiem wymaga aspektu dokonanego", tr: "sonucu olan tek bir eylem tamamlanmış görünüşle kurulur", id: "satu tindakan dengan hasil memakai aspek perfektif", vi: "một hành động có kết quả dùng thể hoàn thành" }
          ex: ["Я ", { target: подзвоню́ }, " тобі́ пі́сля робо́ти."]
          tr: { en: "I'll call you after work.", es: "Te llamo después del trabajo.", pt: "Eu te ligo depois do trabalho.", fr: "Je t’appellerai après le travail.", de: "Ich rufe dich nach der Arbeit an.", it: "Ti chiamo dopo il lavoro.", pl: "Zadzwonię do ciebie po pracy.", tr: "İşten sonra seni arayacağım.", id: "Saya akan menelepon kamu sepulang kerja.", vi: "Tôi sẽ gọi cho bạn sau giờ làm." }
        - level: A1
          point: { uk: Пастка, en: Trap, es: Trampa, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { uk: ["ніколи ", { term: бу́ду }, " з доконаним видом"], en: ["never ", { term: бу́ду }, " with a perfective verb"], es: ["nunca ", { term: бу́ду }, " con un verbo perfectivo"], pt: ["nunca ", { term: бу́ду }, " com um verbo perfectivo"], fr: ["jamais ", { term: бу́ду }, " avec un verbe perfectif"], de: ["nie ", { term: бу́ду }, " mit einem perfektiven Verb"], it: ["mai ", { term: бу́ду }, " con un verbo perfettivo"], pl: ["nigdy ", { term: бу́ду }, " z czasownikiem dokonanym"], tr: [{ term: бу́ду }, " asla tamamlanmış görünüşteki fiille kullanılmaz"], id: ["jangan pernah ", { term: бу́ду }, " dengan kata kerja perfektif"], vi: ["không bao giờ dùng ", { term: бу́ду }, " với động từ thể hoàn thành"] }
