sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: ["Умовний спосіб утворюють від минулого часу: додають ", { term: би }, " чи ", { term: б }, "."]
              en: ["The conditional is built on the past tense: add ", { term: би }, " or ", { term: б }, "."]
              es: ["El condicional se forma sobre el pasado: se añade ", { term: би }, " o ", { term: б }, "."]
              pt: ["O modo condicional se forma a partir do passado: acrescenta-se ", { term: би }, " ou ", { term: б }, "."]
              fr: ["Le conditionnel se forme sur le passé : on ajoute ", { term: би }, " ou ", { term: б }, "."]
              de: ["Der Konditional wird aus der Vergangenheit gebildet: Man fügt ", { term: би }, " oder ", { term: б }, " hinzu."]
              it: ["Il condizionale si forma dal passato: si aggiunge ", { term: би }, " o ", { term: б }, "."]
              pl: ["Tryb warunkowy tworzy się od czasu przeszłego: dodaje się ", { term: би }, " lub ", { term: б }, "."]
              tr: ["Şart kipi geçmiş zamandan kurulur: ", { term: би }, " veya ", { term: б }, " eklenir."]
              id: ["Modus kondisional dibentuk dari bentuk lampau: tambahkan ", { term: би }, " atau ", { term: б }, "."]
              vi: ["Thức điều kiện được tạo từ thì quá khứ: thêm ", { term: би }, " hoặc ", { term: б }, "."]
            ex: { mapping: [прочита́ли, { target: прочита́ли б }] }
          - type: rule
            level: B1
            text:
              uk: "Умовний спосіб не має часу: одна форма говорить і про теперішнє, і про майбутнє, і про минуле."
              en: "The conditional has no tense: one form covers the present, the future and the past."
              es: "El condicional no tiene tiempo: una sola forma sirve para el presente, el futuro y el pasado."
              pt: "O modo condicional não tem tempo: uma só forma serve para o presente, o futuro e o passado."
              fr: "Le conditionnel n’a pas de temps : une seule forme sert pour le présent, le futur et le passé."
              de: "Der Konditional hat keine Zeitstufe: Eine Form gilt für Gegenwart, Zukunft und Vergangenheit."
              it: "Il condizionale non ha tempo: una sola forma vale per il presente, il futuro e il passato."
              pl: "Tryb warunkowy nie ma czasu: jedna forma służy do teraźniejszości, przyszłości i przeszłości."
              tr: "Şart kipinin zamanı yoktur: tek biçim şimdiki zamanı, geleceği ve geçmişi karşılar."
              id: "Modus kondisional tidak punya kala: satu bentuk berlaku untuk masa kini, masa depan, dan masa lalu."
