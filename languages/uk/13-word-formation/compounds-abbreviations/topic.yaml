title: { uk: Складні слова й абревіатури, en: Compound Words and Abbreviations, es: "Palabras compuestas y abreviaturas", pt: "Palavras compostas e abreviaturas", fr: "Mots composés et abréviations", de: "Zusammengesetzte Wörter und Abkürzungen", it: "Parole composte e abbreviazioni", pl: "Wyrazy złożone i skróty", tr: "Birleşik sözcükler ve kısaltmalar", id: "Kata majemuk dan singkatan", vi: "Từ ghép và từ viết tắt" }
summary:
  lead:
    uk: "Складне слово пишемо через дефіс, коли його частини рівноправні, і разом, коли перша частина визначає другу; абревіатури мають власні правила."
    en: "A compound word takes a hyphen when its parts are equal, and is one word when the first part defines the second; abbreviations follow their own rules."
    es: "La palabra compuesta lleva guion si sus partes son equivalentes y se escribe junta si la primera determina a la segunda; las abreviaturas tienen sus reglas."
    pt: "A palavra composta leva hífen quando as partes têm igual valor e se escreve junta quando a primeira determina a segunda; as abreviaturas têm regras próprias."
    fr: "Le mot composé prend un trait d’union si ses parties sont de même rang, et se soude si la première détermine la seconde ; les abréviations ont leurs règles."
    de: "Zusammengesetzte Wörter schreibt man bei gleichrangigen Teilen mit Bindestrich, bei bestimmendem ersten Teil zusammen; Abkürzungen haben eigene Regeln."
    it: "La parola composta vuole il trattino se le parti sono di pari valore, ed è unita se la prima parte determina la seconda; le abbreviazioni hanno regole proprie."
    pl: "Wyraz złożony piszemy z łącznikiem, gdy jego człony są równorzędne, a łącznie, gdy pierwszy człon określa drugi; skróty mają własne zasady."
    tr: "Birleşik sözcük, bölümleri eş değerliyse tire ile, ilk bölüm ikincisini niteliyorsa bitişik yazılır; kısaltmaların kendine özgü kuralları vardır."
    id: "Kata majemuk memakai tanda hubung bila bagiannya setara, dan serangkai bila bagian pertama menerangkan bagian kedua; singkatan punya aturan sendiri."
    vi: "Từ ghép dùng dấu gạch nối khi các phần ngang hàng, viết liền khi phần đầu bổ nghĩa cho phần sau; từ viết tắt có quy tắc riêng."
  rule:
    uk: ["Дефіс стоїть між рівноправними частинами, між якими можна вставити ", { term: і }, ":"]
    en: ["A hyphen stands between equal parts when you can insert ", { term: і }, " between them:"]
    es: ["El guion va entre partes equivalentes, entre las que se puede insertar ", { term: і }, ":"]
    pt: ["O hífen fica entre partes de igual valor, entre as quais se pode inserir ", { term: і }, ":"]
    fr: ["Le trait d’union relie des parties de même rang, où l’on peut insérer ", { term: і }, " :"]
    de: ["Der Bindestrich steht zwischen gleichrangigen Teilen, zwischen die man ", { term: і }, " einfügen kann:"]
    it: ["Il trattino sta tra parti di pari valore, tra le quali si può inserire ", { term: і }, ":"]
    pl: ["Łącznik stoi między równorzędnymi członami, między które można wstawić ", { term: і }, ":"]
    tr: ["Tire, arasına ", { term: і }, " getirilebilen eş değerli bölümlerin arasına konur:"]
    id: ["Tanda hubung berada di antara bagian yang setara, yang di antaranya dapat disisipkan ", { term: і }, ":"]
    vi: ["Dấu gạch nối đứng giữa các phần ngang hàng, giữa chúng có thể chèn ", { term: і }, ":"]
  ex: ["У ме́не є ", { target: украї́нсько-англі́йський }, " словни́к."]

