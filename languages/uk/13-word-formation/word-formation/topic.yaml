sections:
  - title: { uk: Огляд, en: Overview, es: Visión general, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              uk: "Нові слова утворюємо від дієслів, іменників і прикметників за допомогою суфіксів; суфікс показує, що означає слово, і часто його рід."
              en: "New words come from verbs, nouns and adjectives through suffixes; the suffix shows what the word means, and often its gender."
              es: "Las palabras nuevas se forman a partir de verbos, sustantivos y adjetivos con sufijos; el sufijo muestra qué significa la palabra y, a menudo, su género."
              pt: "Formamos palavras novas de verbos, substantivos e adjetivos com sufixos; o sufixo mostra o significado e muitas vezes o gênero."
              fr: "On forme des mots nouveaux à partir de verbes, de noms et d’adjectifs avec des suffixes ; le suffixe montre le sens du mot et souvent son genre."
              de: "Neue Wörter entstehen aus Verben, Substantiven und Adjektiven durch Suffixe; das Suffix zeigt die Bedeutung des Wortes und oft auch das Genus."
              it: "Le parole nuove si formano da verbi, sostantivi e aggettivi con i suffissi; il suffisso indica il significato e spesso anche il genere."
              pl: "Nowe wyrazy tworzymy od czasowników, rzeczowników i przymiotników za pomocą przyrostków; przyrostek pokazuje znaczenie wyrazu i często rodzaj."
              tr: "Yeni sözcükler fiillerden, isimlerden ve sıfatlardan soneklerle türetilir; sonek sözcüğün anlamını ve çoğu zaman cinsiyetini gösterir."
              id: "Kata baru dibentuk dari kata kerja, kata benda, dan kata sifat dengan sufiks; sufiks menunjukkan arti kata dan sering juga gendernya."
              vi: "Từ mới được tạo từ động từ, danh từ và tính từ bằng hậu tố; hậu tố cho biết nghĩa của từ và thường cả giống."
            ex: { mapping: [чита́ти, { alternatives: [чита́ч, чита́ння, чита́льня] }] }
