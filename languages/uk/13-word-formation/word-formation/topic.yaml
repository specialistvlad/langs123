summary:
  lead:
    uk: ["Суфікс показує значення нового слова: ", { term: -ач }, " і ", { term: -ець }, " — хто, ", { term: -ння }, " — дія, ", { term: -льня }, " — місце, ", { term: -ість }, " — ознака, а ", { term: -н- }, " і ", { term: -ськ- }, " утворюють прикметники."]
