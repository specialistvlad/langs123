    es: ["El sufijo muestra qué significa la palabra nueva: ", { term: -ач }, " y ", { term: -ець }, ", una persona; ", { term: -ння }, ", una acción; ", { term: -льня }, ", un lugar; ", { term: -ість }, ", una cualidad; ", { term: -н- }, " y ", { term: -ськ- }, " forman adjetivos."]
    pt: ["O sufixo mostra o que a palavra nova significa: ", { term: -ач }, " e ", { term: -ець }, " indicam pessoa, ", { term: -ння }, " ação, ", { term: -льня }, " lugar, ", { term: -ість }, " qualidade; ", { term: -н- }, " e ", { term: -ськ- }, " formam adjetivos."]
    fr: ["Le suffixe donne son sens au mot nouveau : ", { term: -ач }, " et ", { term: -ець }, " une personne, ", { term: -ння }, " une action, ", { term: -льня }, " un lieu, ", { term: -ість }, " une qualité ; ", { term: -н- }, " et ", { term: -ськ- }, " forment des adjectifs."]
    de: ["Das Suffix gibt dem neuen Wort seine Bedeutung: ", { term: -ач }, " und ", { term: -ець }, " Person, ", { term: -ння }, " Handlung, ", { term: -льня }, " Ort, ", { term: -ість }, " Eigenschaft; ", { term: -н- }, " und ", { term: -ськ- }, " bilden Adjektive."]
    it: ["Il suffisso indica il significato della parola nuova: ", { term: -ач }, " e ", { term: -ець }, " una persona, ", { term: -ння }, " un’azione, ", { term: -льня }, " un luogo, ", { term: -ість }, " una qualità; ", { term: -н- }, " e ", { term: -ськ- }, " formano aggettivi."]
    pl: ["Przyrostek pokazuje znaczenie nowego wyrazu: ", { term: -ач }, " i ", { term: -ець }, " oznaczają osobę, ", { term: -ння }, " czynność, ", { term: -льня }, " miejsce, ", { term: -ість }, " cechę; ", { term: -н- }, " i ", { term: -ськ- }, " tworzą przymiotniki."]
    tr: ["Sonek yeni sözcüğün anlamını gösterir: ", { term: -ач }, " ve ", { term: -ець }, " kişiyi, ", { term: -ння }, " eylemi, ", { term: -льня }, " yeri, ", { term: -ість }, " niteliği bildirir; ", { term: -н- }, " ile ", { term: -ськ- }, " sıfat yapar."]
    id: ["Sufiks menunjukkan arti kata baru: ", { term: -ач }, " dan ", { term: -ець }, " untuk orang, ", { term: -ння }, " untuk perbuatan, ", { term: -льня }, " untuk tempat, ", { term: -ість }, " untuk sifat; ", { term: -н- }, " dan ", { term: -ськ- }, " membentuk kata sifat."]
    vi: ["Hậu tố cho biết nghĩa của từ mới: ", { term: -ач }, " và ", { term: -ець }, " chỉ người, ", { term: -ння }, " chỉ hành động, ", { term: -льня }, " chỉ nơi chốn, ", { term: -ість }, " chỉ tính chất; ", { term: -н- }, " và ", { term: -ськ- }, " tạo tính từ."]
  rule:
    uk: ["Суфікс часто визначає й рід: іменники на ", { term: -ння }, " належать до середнього роду:"]
    en: ["The suffix often sets the gender too: nouns in ", { term: -ння }, " are neuter:"]
    es: ["El sufijo suele fijar también el género: los sustantivos en ", { term: -ння }, " son neutros:"]
    pt: ["O sufixo muitas vezes define também o gênero: os substantivos em ", { term: -ння }, " são neutros:"]
    fr: ["Le suffixe fixe souvent aussi le genre : les noms en ", { term: -ння }, " sont neutres :"]
    de: ["Das Suffix legt oft auch das Genus fest: Substantive auf ", { term: -ння }, " sind Neutra:"]
    it: ["Il suffisso spesso fissa anche il genere: i sostantivi in ", { term: -ння }, " sono neutri:"]
    pl: ["Przyrostek często określa też rodzaj: rzeczowniki na ", { term: -ння }, " mają rodzaj nijaki:"]
    tr: ["Sonek çoğu zaman cinsiyeti de belirler: ", { term: -ння }, " ile biten isimler nötrdür:"]
    id: ["Sufiks sering menentukan gender juga: kata benda berakhiran ", { term: -ння }, " bergender netral:"]
    vi: ["Hậu tố thường quyết định cả giống: danh từ tận cùng bằng ", { term: -ння }, " thuộc giống trung:"]
  ex: ["Це ", { target: ціка́ве чита́ння }, "."]

