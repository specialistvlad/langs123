              en: "A diminutive suffix names something small or shows affection; the gender of the word stays the same. At this level you recognise these words."
              es: "Un sufijo diminutivo nombra algo pequeño o muestra cariño; el género de la palabra no cambia. En este nivel se trata de reconocer estas palabras."
              pt: "O sufixo diminutivo indica algo pequeno ou mostra carinho; o gênero da palavra não muda. Neste nível, basta reconhecer essas palavras."
              fr: "Un suffixe diminutif désigne une petite chose ou exprime l’affection ; le genre du mot ne change pas. À ce niveau, il suffit de reconnaître ces mots."
              de: "Ein Verkleinerungssuffix nennt etwas Kleines oder zeigt Zuneigung; das Genus des Wortes bleibt gleich. Auf diesem Niveau erkennt man diese Wörter nur."
              it: "Un suffisso diminutivo indica qualcosa di piccolo o mostra affetto; il genere della parola non cambia. A questo livello basta riconoscere queste parole."
              pl: "Przyrostek zdrabniający nazywa coś małego lub wyraża czułość; rodzaj wyrazu się nie zmienia. Na tym poziomie takie wyrazy wystarczy rozpoznawać."
              tr: "Küçültme soneki küçük bir şeyi anlatır ya da sevgi gösterir; sözcüğün cinsiyeti değişmez. Bu düzeyde bu sözcükleri tanımak yeterlidir."
              id: "Sufiks diminutif menyebut sesuatu yang kecil atau menunjukkan kasih sayang; gender kata tidak berubah. Pada tingkat ini kata-kata seperti itu cukup dikenali."
              vi: "Hậu tố chỉ sự nhỏ bé gọi tên vật nhỏ hoặc thể hiện sự trìu mến; giống của từ không đổi. Ở trình độ này chỉ cần nhận ra những từ như vậy."
            ex: ["Ді́вчинка ма́є ", { target: бра́тика }, "."]
