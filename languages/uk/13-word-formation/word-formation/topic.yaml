            level: C2
            text:
              uk: "Оцінні суфікси — зменшувальні, збільшувальні, зневажливі, підсилювальні — додають ставлення мовця й не змінюють основного значення."
              en: "Evaluative suffixes (diminutive, augmentative, contemptuous, intensifying) add the speaker’s attitude and keep the basic meaning."
              es: "Los sufijos apreciativos (diminutivos, aumentativos, despectivos, intensificadores) añaden la actitud del hablante y no cambian el significado básico."
              pt: "Os sufixos avaliativos (diminutivos, aumentativos, depreciativos, intensificadores) acrescentam a atitude do falante e não mudam o significado básico."
              fr: "Les suffixes appréciatifs (diminutifs, augmentatifs, péjoratifs, intensifs) ajoutent l’attitude du locuteur et ne changent pas le sens de base."
              de: "Wertende Suffixe (Verkleinerung, Vergrößerung, Abwertung, Verstärkung) fügen die Haltung des Sprechers hinzu und ändern die Grundbedeutung nicht."
              it: "I suffissi valutativi (diminutivi, accrescitivi, spregiativi, intensivi) aggiungono l’atteggiamento di chi parla e non cambiano il significato di base."
              pl: "Przyrostki wartościujące (zdrabniające, zgrubiające, pogardliwe, wzmacniające) wyrażają stosunek mówiącego i nie zmieniają podstawowego znaczenia."
              tr: "Değer bildiren sonekler (küçültme, büyütme, küçümseme, pekiştirme) konuşanın tutumunu katar ve temel anlamı değiştirmez."
              id: "Sufiks evaluatif (diminutif, augmentatif, merendahkan, penguat) menambahkan sikap penutur dan tidak mengubah arti dasar."
              vi: "Hậu tố biểu cảm (chỉ nhỏ, chỉ lớn, khinh miệt, nhấn mạnh) thêm thái độ của người nói và không đổi nghĩa gốc."
            ex: ["Надво́рі ", { target: вітри́ще }, "!"]
            tr: { en: "There is a huge wind outside!", es: "¡Afuera hay un viento enorme!", pt: "Lá fora está um ventão!", fr: "Dehors, il y a un vent énorme !", de: "Draußen weht ein gewaltiger Wind!", it: "Fuori c’è un ventone!", pl: "Na dworze wieje potężny wiatr!", tr: "Dışarıda müthiş bir rüzgâr var!", id: "Di luar ada angin yang sangat kencang!", vi: "Ngoài trời gió rất to!" }

