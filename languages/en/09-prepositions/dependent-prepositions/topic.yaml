  - title: { en: "Typical errors" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: "B2", wrong: "We discussed about the plan.", right: ["We ", { target: "discussed" }, " the plan."], rule: { en: [{ term: "discuss" }, " takes its object directly"] } }
          - { level: "B2", wrong: "It depends of the weather.", right: ["It ", { target: "depends on" }, " the weather."], rule: { en: [{ term: "depend" }, " takes ", { term: "on" }] } }
          - { level: "B2", wrong: "She is married with a doctor.", right: ["She is ", { target: "married to" }, " a doctor."], rule: { en: [{ term: "married" }, " takes ", { term: "to" }] } }
          - { level: "B2", wrong: "I'm interested on music.", right: ["I'm ", { target: "interested in" }, " music."], rule: { en: [{ term: "interested" }, " takes ", { term: "in" }] } }
          - { level: "B2", wrong: "Can you explain me the rule?", right: ["Can you ", { target: "explain" }, " the rule ", { target: "to me" }, "?"], rule: { en: [{ term: "explain" }, " puts the person after ", { term: "to" }] } }
          - { level: "B2", wrong: "He entered in the room.", right: ["He ", { target: "entered" }, " the room."], rule: { en: [{ term: "enter" }, " takes its object directly"] } }
          - { level: "B2", wrong: "I'm afraid of to fly.", right: ["I'm afraid of ", { target: "flying" }, "."], rule: { en: ["the ", { term: "-ing" }, " form follows a preposition"] } }
          - { level: "C1", wrong: "You must comply to the rules.", right: ["You must ", { target: "comply with" }, " the rules."], rule: { en: [{ term: "comply" }, " takes ", { term: "with" }] } }
          - { level: "C1", wrong: "The course comprises of six units.", right: ["The course ", { target: "comprises" }, " six units."], rule: { en: [{ term: "comprise" }, " takes its object directly"] } }
          - { level: "C1", wrong: "The report emphasises on safety.", right: ["The report ", { target: "emphasises" }, " safety."], rule: { en: [{ term: "emphasise" }, " takes its object directly; the noun ", { term: "emphasis" }, " takes ", { term: "on" }] } }
          - { level: "C1", wrong: "I prefer tea than coffee.", right: ["I prefer tea ", { target: "to" }, " coffee."], rule: { en: [{ term: "prefer" }, " joins the two things with ", { term: "to" }] } }
          - { level: "C1", wrong: "The law had an impact to small shops.", right: ["The law had an ", { target: "impact on" }, " small shops."], rule: { en: [{ term: "impact" }, " takes ", { term: "on" }] } }
          - { level: "C1", wrong: "They are committed to help the project.", right: ["They are committed to ", { target: "helping" }, " the project."], rule: { en: [{ term: "to" }, " is a preposition here, so ", { term: "-ing" }, " follows"] } }
