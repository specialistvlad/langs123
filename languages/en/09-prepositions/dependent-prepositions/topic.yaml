          - { level: "B2", follows: { en: "a pronoun in the object form", uk: "займенник у формі додатка", es: "un pronombre en forma de objeto", pt: "um pronome na forma de objeto", fr: "un pronom complément", de: "ein Pronomen in der Objektform", it: "un pronome nella forma complemento", pl: "zaimek w formie dopełnienia", tr: "nesne biçiminde bir zamir", id: "kata ganti dalam bentuk objek", vi: "một đại từ ở dạng tân ngữ" }, ex: ["Wait ", { target: "for me" }, ", please."], tr: { uk: "Зачекай на мене, будь ласка.", es: "Espérame, por favor.", pt: "Espere por mim, por favor.", fr: "Attends-moi, s’il te plaît.", de: "Warte bitte auf mich.", it: "Aspettami, per favore.", pl: "Poczekaj na mnie, proszę.", tr: "Lütfen beni bekle.", id: "Tolong tunggu saya.", vi: "Làm ơn đợi tôi với." } }
          - { level: "B2", follows: { en: ["an ", { term: "-ing" }, " form"], uk: ["форма на ", { term: "-ing" }], es: ["una forma en ", { term: "-ing" }], pt: ["uma forma com ", { term: "-ing" }], fr: ["une forme en ", { term: "-ing" }], de: ["eine ", { term: "-ing" }, "-Form"], it: ["una forma in ", { term: "-ing" }], pl: ["forma ", { term: "-ing" }], tr: ["bir ", { term: "-ing" }, " biçimi"], id: ["bentuk ", { term: "-ing" }], vi: ["một dạng ", { term: "-ing" }] }, ex: ["She insisted ", { target: "on paying" }, "."], tr: { uk: "Вона наполягала, що заплатить сама.", es: "Ella insistió en pagar.", pt: "Ela insistiu em pagar.", fr: "Elle a insisté pour payer.", de: "Sie bestand darauf, zu bezahlen.", it: "Lei ha insistito per pagare.", pl: "Nalegała, żeby zapłacić.", tr: "Ödemekte ısrar etti.", id: "Dia berkeras ingin membayar.", vi: "Cô ấy nhất quyết đòi trả tiền." } }
      - type: usage
        columns: [{ key: "where", label: { en: "The preposition stays with its verb in", uk: "Прийменник залишається при дієслові у", es: "La preposición se queda con su verbo en", pt: "A preposição fica com o verbo em", fr: "La préposition reste avec son verbe dans", de: "Die Präposition bleibt beim Verb in", it: "La preposizione resta con il verbo in", pl: "Przyimek zostaje przy czasowniku w", tr: "Edat, fiilin yanında şu yapılarda kalır", id: "Kata depan tetap bersama kata kerja dalam", vi: "Giới từ vẫn đi với động từ trong" } }, { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }]
