          - { level: "C1", noun: "impact on", ex: ["The new law had a big ", { target: "impact on" }, " small shops."], tr: { uk: "Новий закон сильно вплинув на малі крамниці.", es: "La nueva ley tuvo un gran impacto en las tiendas pequeñas.", pt: "A nova lei teve um grande impacto nas lojas pequenas.", fr: "La nouvelle loi a eu un grand impact sur les petits commerces.", de: "Das neue Gesetz hatte große Auswirkungen auf kleine Geschäfte.", it: "La nuova legge ha avuto un grande impatto sui piccoli negozi.", pl: "Nowe prawo miało duży wpływ na małe sklepy.", tr: "Yeni yasa küçük dükkânlar üzerinde büyük bir etki yarattı.", id: "Undang-undang baru itu berdampak besar pada toko-toko kecil.", vi: "Luật mới có tác động lớn đến các cửa hàng nhỏ." } }
          - { level: "C1", noun: "influence on", ex: ["Friends have a strong ", { target: "influence on" }, " teenagers."], tr: { uk: "Друзі мають сильний вплив на підлітків.", es: "Los amigos tienen una gran influencia en los adolescentes.", pt: "Os amigos têm uma forte influência sobre os adolescentes.", fr: "Les amis ont une forte influence sur les adolescents.", de: "Freunde haben großen Einfluss auf Jugendliche.", it: "Gli amici hanno una forte influenza sugli adolescenti.", pl: "Przyjaciele mają silny wpływ na nastolatków.", tr: "Arkadaşların gençler üzerinde güçlü bir etkisi vardır.", id: "Teman memiliki pengaruh kuat pada remaja.", vi: "Bạn bè có ảnh hưởng mạnh đến thanh thiếu niên." } }
          - { level: "C1", noun: "influence over", ex: ["She has great ", { target: "influence over" }, " the committee."], tr: { uk: "Вона має великий вплив на комітет.", es: "Ella tiene gran influencia sobre el comité.", pt: "Ela tem grande influência sobre o comitê.", fr: "Elle exerce une grande influence sur le comité.", de: "Sie hat großen Einfluss auf den Ausschuss.", it: "Lei ha una grande influenza sul comitato.", pl: "Ma duży wpływ na komitet.", tr: "Komite üzerinde büyük bir nüfuzu var.", id: "Dia memiliki pengaruh besar atas komite itu.", vi: "Cô ấy có ảnh hưởng lớn đối với ủy ban." } }
          - { level: "C1", noun: "emphasis on", ex: ["The school puts great ", { target: "emphasis on" }, " reading."], tr: { uk: "Школа надає великого значення читанню.", es: "La escuela pone gran énfasis en la lectura.", pt: "A escola dá grande ênfase à leitura.", fr: "L’école met un fort accent sur la lecture.", de: "Die Schule legt großen Wert auf das Lesen.", it: "La scuola dà grande enfasi alla lettura.", pl: "Szkoła kładzie duży nacisk na czytanie.", tr: "Okul okumaya büyük önem verir.", id: "Sekolah itu memberi penekanan besar pada membaca.", vi: "Nhà trường rất chú trọng việc đọc." } }
          - { level: "C1", noun: "effect on", ex: ["Noise has an ", { target: "effect on" }, " sleep."], tr: { uk: "Шум впливає на сон.", es: "El ruido afecta el sueño.", pt: "O barulho afeta o sono.", fr: "Le bruit a un effet sur le sommeil.", de: "Lärm wirkt sich auf den Schlaf aus.", it: "Il rumore ha un effetto sul sonno.", pl: "Hałas wpływa na sen.", tr: "Gürültünün uyku üzerinde etkisi vardır.", id: "Kebisingan berpengaruh pada tidur.", vi: "Tiếng ồn có ảnh hưởng đến giấc ngủ." } }
          - { level: "C1", noun: "contribution to", ex: ["Her ", { target: "contribution to" }, " the project was huge."], tr: { uk: "Її внесок у проєкт був величезним.", es: "Su contribución al proyecto fue enorme.", pt: "A contribuição dela para o projeto foi enorme.", fr: "Sa contribution au projet a été énorme.", de: "Ihr Beitrag zum Projekt war riesig.", it: "Il suo contributo al progetto è stato enorme.", pl: "Jej wkład w projekt był ogromny.", tr: "Projeye katkısı çok büyüktü.", id: "Kontribusinya pada proyek itu sangat besar.", vi: "Đóng góp của cô ấy cho dự án rất lớn." } }
          - { level: "C1", noun: "commitment to", ex: ["We admire her ", { target: "commitment to" }, " her patients."], tr: { uk: "Ми захоплюємося її відданістю пацієнтам.", es: "Admiramos su compromiso con sus pacientes.", pt: "Admiramos o compromisso dela com os pacientes.", fr: "Nous admirons son engagement envers ses patients.", de: "Wir bewundern ihren Einsatz für ihre Patienten.", it: "Ammiriamo il suo impegno verso i pazienti.", pl: "Podziwiamy jej oddanie pacjentom.", tr: "Hastalarına olan bağlılığına hayranız.", id: "Kami mengagumi komitmennya terhadap pasiennya.", vi: "Chúng tôi ngưỡng mộ sự tận tâm của cô ấy với bệnh nhân." } }
          - { level: "C1", noun: "attitude towards", ex: ["The company's ", { target: "attitude towards" }, " risk is careful."], tr: { uk: "Компанія ставиться до ризику обережно.", es: "La actitud de la empresa hacia el riesgo es prudente.", pt: "A atitude da empresa em relação ao risco é cautelosa.", fr: "L’attitude de l’entreprise face au risque est prudente.", de: "Die Haltung des Unternehmens zum Risiko ist vorsichtig.", it: "L'atteggiamento dell'azienda verso il rischio è prudente.", pl: "Firma podchodzi do ryzyka ostrożnie.", tr: "Şirketin riske karşı tutumu temkinlidir.", id: "Sikap perusahaan terhadap risiko hati-hati.", vi: "Thái độ của công ty đối với rủi ro rất thận trọng." } }
          - { level: "C1", noun: "tolerance of", ex: ["The town shows great ", { target: "tolerance of" }, " newcomers."], tr: { uk: "Містечко дуже терпимо ставиться до новоприбулих.", es: "La ciudad muestra mucha tolerancia con los recién llegados.", pt: "A cidade mostra grande tolerância com os recém-chegados.", fr: "La ville se montre très tolérante envers les nouveaux venus.", de: "Die Stadt zeigt große Toleranz gegenüber Neuankömmlingen.", it: "La città mostra grande tolleranza verso i nuovi arrivati.", pl: "Miasteczko okazuje dużą tolerancję wobec przybyszów.", tr: "Kasaba yeni gelenlere büyük hoşgörü gösterir.", id: "Kota itu sangat toleran terhadap pendatang baru.", vi: "Thị trấn rất khoan dung với người mới đến." } }
          - { level: "C1", noun: "tolerance for", ex: ["He has a low ", { target: "tolerance for" }, " noise."], tr: { uk: "Він погано переносить шум.", es: "Él tiene poca tolerancia al ruido.", pt: "Ele tem pouca tolerância a barulho.", fr: "Il supporte mal le bruit.", de: "Er hat eine geringe Toleranz gegenüber Lärm.", it: "Lui ha una scarsa tolleranza al rumore.", pl: "Ma niską tolerancję na hałas.", tr: "Gürültüye toleransı düşüktür.", id: "Dia kurang tahan terhadap kebisingan.", vi: "Anh ấy khó chịu được tiếng ồn." } }
          - { level: "C1", noun: "insight into", ex: ["The book gives ", { target: "insight into" }, " village life."], tr: { uk: "Книжка дає уявлення про життя в селі.", es: "El libro ofrece una visión de la vida en el pueblo.", pt: "O livro dá uma visão da vida na aldeia.", fr: "Le livre donne un aperçu de la vie au village.", de: "Das Buch gibt Einblick in das Dorfleben.", it: "Il libro offre uno sguardo sulla vita del villaggio.", pl: "Książka daje wgląd w życie wsi.", tr: "Kitap köy yaşamına dair bir bakış sunar.", id: "Buku itu memberi gambaran tentang kehidupan desa.", vi: "Cuốn sách cho ta cái nhìn sâu vào đời sống làng quê." } }
          - { level: "C1", noun: "expertise in", ex: ["She has ", { target: "expertise in" }, " employment law."], tr: { uk: "Вона має експертні знання з трудового права.", es: "Ella tiene experiencia en derecho laboral.", pt: "Ela tem expertise em direito trabalhista.", fr: "Elle est experte en droit du travail.", de: "Sie hat Fachwissen im Arbeitsrecht.", it: "Lei ha competenza in diritto del lavoro.", pl: "Ma wiedzę ekspercką z zakresu prawa pracy.", tr: "İş hukuku alanında uzmanlığı var.", id: "Dia ahli dalam hukum ketenagakerjaan.", vi: "Cô ấy có chuyên môn về luật lao động." } }
          - { level: "C1", noun: "preference for", ex: ["He has a ", { target: "preference for" }, " quiet places."], tr: { uk: "Він віддає перевагу тихим місцям.", es: "Él prefiere los lugares tranquilos.", pt: "Ele tem preferência por lugares tranquilos.", fr: "Il a une préférence pour les endroits calmes.", de: "Er bevorzugt ruhige Orte.", it: "Lui ha una preferenza per i luoghi tranquilli.", pl: "Woli ciche miejsca.", tr: "Sessiz yerleri tercih eder.", id: "Dia lebih menyukai tempat yang tenang.", vi: "Anh ấy thích những nơi yên tĩnh hơn." } }
          - { level: "C1", noun: "concern over", ex: ["There is growing ", { target: "concern over" }, " rising prices."], tr: { uk: "Зростає занепокоєння через підвищення цін.", es: "Crece la preocupación por el aumento de los precios.", pt: "Há uma preocupação crescente com a alta dos preços.", fr: "La hausse des prix suscite une inquiétude grandissante.", de: "Die Sorge über steigende Preise wächst.", it: "Cresce la preoccupazione per l'aumento dei prezzi.", pl: "Rośnie niepokój z powodu rosnących cen.", tr: "Artan fiyatlar konusunda endişe büyüyor.", id: "Kekhawatiran akan naiknya harga makin meningkat.", vi: "Mối lo ngại về giá cả leo thang ngày càng tăng." } }
          - { level: "C1", noun: "concern about", ex: ["Parents voiced ", { target: "concern about" }, " safety."], tr: { uk: "Батьки висловили занепокоєння щодо безпеки.", es: "Los padres expresaron su preocupación por la seguridad.", pt: "Os pais manifestaram preocupação com a segurança.", fr: "Les parents ont exprimé leur inquiétude au sujet de la sécurité.", de: "Die Eltern äußerten Bedenken wegen der Sicherheit.", it: "I genitori hanno espresso preoccupazione per la sicurezza.", pl: "Rodzice wyrazili obawy o bezpieczeństwo.", tr: "Veliler güvenlik konusundaki endişelerini dile getirdi.", id: "Orang tua menyampaikan kekhawatiran tentang keselamatan.", vi: "Các bậc phụ huynh bày tỏ lo ngại về sự an toàn." } }
          - { level: "C1", noun: "correlation between", ex: ["Researchers found a ", { target: "correlation between" }, " diet and health."], tr: { uk: "Дослідники виявили кореляцію між харчуванням і здоров’ям.", es: "Los investigadores encontraron una correlación entre la dieta y la salud.", pt: "Os pesquisadores encontraram uma correlação entre dieta e saúde.", fr: "Les chercheurs ont trouvé une corrélation entre l’alimentation et la santé.", de: "Forschende fanden einen Zusammenhang zwischen Ernährung und Gesundheit.", it: "I ricercatori hanno trovato una correlazione tra dieta e salute.", pl: "Badacze odkryli korelację między dietą a zdrowiem.", tr: "Araştırmacılar beslenme ile sağlık arasında bir ilişki buldu.", id: "Para peneliti menemukan korelasi antara pola makan dan kesehatan.", vi: "Các nhà nghiên cứu tìm thấy mối tương quan giữa chế độ ăn và sức khỏe." } }
          - { level: "C1", noun: "link between", ex: ["There is a ", { target: "link between" }, " sleep and memory."], tr: { uk: "Існує зв’язок між сном і пам’яттю.", es: "Hay un vínculo entre el sueño y la memoria.", pt: "Existe uma ligação entre o sono e a memória.", fr: "Il existe un lien entre le sommeil et la mémoire.", de: "Es gibt einen Zusammenhang zwischen Schlaf und Gedächtnis.", it: "C'è un legame tra il sonno e la memoria.", pl: "Istnieje związek między snem a pamięcią.", tr: "Uyku ile bellek arasında bir bağ vardır.", id: "Ada hubungan antara tidur dan ingatan.", vi: "Có mối liên hệ giữa giấc ngủ và trí nhớ." } }
          - { level: "C1", noun: "shortage of", ex: ["There is a ", { target: "shortage of" }, " nurses."], tr: { uk: "Не вистачає медсестер.", es: "Hay escasez de enfermeras.", pt: "Há escassez de enfermeiros.", fr: "Il y a une pénurie d’infirmières.", de: "Es herrscht ein Mangel an Pflegekräften.", it: "C'è una carenza di infermieri.", pl: "Brakuje pielęgniarek.", tr: "Hemşire sıkıntısı var.", id: "Ada kekurangan perawat.", vi: "Đang thiếu y tá." } }
          - { level: "C1", noun: "excess of", ex: ["An ", { target: "excess of" }, " sugar harms health."], tr: { uk: "Надлишок цукру шкодить здоров’ю.", es: "El exceso de azúcar daña la salud.", pt: "O excesso de açúcar prejudica a saúde.", fr: "Un excès de sucre nuit à la santé.", de: "Ein Übermaß an Zucker schadet der Gesundheit.", it: "Un eccesso di zucchero danneggia la salute.", pl: "Nadmiar cukru szkodzi zdrowiu.", tr: "Aşırı şeker sağlığa zarar verir.", id: "Kelebihan gula merusak kesehatan.", vi: "Quá nhiều đường gây hại cho sức khỏe." } }

  - title: { en: "Formal verbs with a preposition", uk: "Формальні дієслова з прийменником", es: "Verbos formales con preposición", pt: "Verbos formais com preposição", fr: "Verbes soutenus avec préposition", de: "Förmliche Verben mit Präposition", it: "Verbi formali con preposizione", pl: "Czasowniki formalne z przyimkiem", tr: "Edatlı resmî fiiller", id: "Kata kerja formal dengan kata depan", vi: "Động từ trang trọng đi với giới từ" }
    role: own
    content:
      - type: usage
        columns: [{ key: "form", label: { en: "Verb", uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }, { key: "meaning", label: { en: "Meaning", uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }, { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }]
        rows:
          - { level: "C1", form: "adhere to", meaning: { en: "follow a rule or a belief closely", uk: "суворо дотримуватися правила чи переконання", es: "seguir de cerca una regla o una creencia", pt: "seguir de perto uma regra ou uma crença", fr: "suivre strictement une règle ou une croyance", de: "einer Regel oder Überzeugung genau folgen", it: "seguire con rigore una regola o una convinzione", pl: "ściśle przestrzegać zasady lub przekonania", tr: "bir kurala ya da inanca sıkı sıkıya uymak", id: "mengikuti aturan atau keyakinan dengan ketat", vi: "tuân thủ chặt chẽ một quy tắc hay một niềm tin" }, ex: ["All staff must ", { target: "adhere to" }, " the safety rules."], tr: { uk: "Усі працівники мають суворо дотримуватися правил безпеки.", es: "Todo el personal debe respetar las normas de seguridad.", pt: "Todos os funcionários devem seguir as regras de segurança.", fr: "Tout le personnel doit respecter les règles de sécurité.", de: "Alle Mitarbeitenden müssen sich an die Sicherheitsregeln halten.", it: "Tutto il personale deve attenersi alle norme di sicurezza.", pl: "Cały personel musi stosować się do zasad bezpieczeństwa.", tr: "Tüm personel güvenlik kurallarına bağlı kalmalıdır.", id: "Seluruh staf harus mematuhi aturan keselamatan.", vi: "Toàn bộ nhân viên phải tuân thủ nghiêm các quy tắc an toàn." } }
          - { level: "C1", form: "comply with", meaning: { en: "do what a rule or a request asks", uk: "робити те, чого вимагає правило чи прохання", es: "hacer lo que pide una regla o una petición", pt: "fazer o que uma regra ou um pedido exige", fr: "faire ce qu’une règle ou une demande exige", de: "tun, was eine Regel oder Bitte verlangt", it: "fare ciò che una regola o una richiesta prescrive", pl: "robić to, czego wymaga przepis lub prośba", tr: "bir kuralın ya da isteğin gerektirdiğini yapmak", id: "melakukan apa yang diminta aturan atau permintaan", vi: "làm đúng điều một quy tắc hay yêu cầu đòi hỏi" }, ex: ["The company ", { target: "complied with" }, " the law."], tr: { uk: "Компанія виконала вимоги закону.", es: "La empresa cumplió con la ley.", pt: "A empresa cumpriu a lei.", fr: "L’entreprise s’est conformée à la loi.", de: "Das Unternehmen hat das Gesetz befolgt.", it: "L'azienda si è conformata alla legge.", pl: "Firma zastosowała się do prawa.", tr: "Şirket yasaya uydu.", id: "Perusahaan itu mematuhi undang-undang.", vi: "Công ty đã tuân thủ pháp luật." } }
          - { level: "C1", form: "conform to", meaning: { en: "match a standard", uk: "відповідати стандарту", es: "ajustarse a una norma", pt: "estar de acordo com um padrão", fr: "répondre à une norme", de: "einer Norm entsprechen", it: "essere conforme a uno standard", pl: "odpowiadać normie", tr: "bir standarda uymak", id: "sesuai dengan suatu standar", vi: "phù hợp với một tiêu chuẩn" }, ex: ["The product ", { target: "conforms to" }, " European standards."], tr: { uk: "Продукт відповідає європейським стандартам.", es: "El producto cumple las normas europeas.", pt: "O produto está em conformidade com os padrões europeus.", fr: "Le produit est conforme aux normes européennes.", de: "Das Produkt entspricht den europäischen Normen.", it: "Il prodotto è conforme agli standard europei.", pl: "Produkt spełnia europejskie normy.", tr: "Ürün Avrupa standartlarına uygundur.", id: "Produk itu sesuai dengan standar Eropa.", vi: "Sản phẩm này phù hợp với các tiêu chuẩn châu Âu." } }
          - { level: "C1", form: "abide by", meaning: { en: "accept and follow a rule or a decision", uk: "визнавати й виконувати правило чи рішення", es: "aceptar y cumplir una regla o una decisión", pt: "aceitar e seguir uma regra ou uma decisão", fr: "accepter et respecter une règle ou une décision", de: "eine Regel oder Entscheidung akzeptieren und befolgen", it: "accettare e rispettare una regola o una decisione", pl: "akceptować i przestrzegać zasady lub decyzji", tr: "bir kuralı ya da kararı kabul edip uymak", id: "menerima dan menaati aturan atau keputusan", vi: "chấp nhận và tuân theo một quy tắc hay một quyết định" }, ex: ["You must ", { target: "abide by" }, " the referee's decision."], tr: { uk: "Ти мусиш підкорятися рішенню судді.", es: "Debes acatar la decisión del árbitro.", pt: "Você deve acatar a decisão do árbitro.", fr: "Tu dois respecter la décision de l’arbitre.", de: "Du musst dich an die Entscheidung des Schiedsrichters halten.", it: "Devi rispettare la decisione dell'arbitro.", pl: "Musisz podporządkować się decyzji sędziego.", tr: "Hakemin kararına uymalısın.", id: "Kamu harus menaati keputusan wasit.", vi: "Bạn phải chấp hành quyết định của trọng tài." } }
          - { level: "C1", form: "account for", meaning: { en: "explain; make up a part", uk: "пояснювати; становити частину", es: "explicar; constituir una parte", pt: "explicar; constituir uma parte", fr: "expliquer ; représenter une part", de: "erklären; einen Teil ausmachen", it: "spiegare; costituire una parte", pl: "wyjaśniać; stanowić część", tr: "açıklamak; bir bölümünü oluşturmak", id: "menjelaskan; menjadi sebagian dari", vi: "giải thích; chiếm một phần" }, ex: ["Rain ", { target: "accounts for" }, " the delay."], tr: { uk: "Затримка пояснюється дощем.", es: "La lluvia explica la demora.", pt: "A chuva explica o atraso.", fr: "La pluie explique le retard.", de: "Der Regen erklärt die Verspätung.", it: "La pioggia spiega il ritardo.", pl: "Opóźnienie wyjaśnia deszcz.", tr: "Gecikmeyi yağmur açıklıyor.", id: "Hujan menjelaskan keterlambatan itu.", vi: "Mưa là lý do của sự chậm trễ." } }
          - { level: "C1", form: "contribute to", meaning: { en: "help to cause or produce", uk: "сприяти виникненню чи появі", es: "ayudar a causar o producir", pt: "ajudar a causar ou produzir", fr: "contribuer à causer ou à produire", de: "dazu beitragen, etwas zu verursachen oder hervorzubringen", it: "concorrere a causare o produrre", pl: "przyczyniać się do powstania", tr: "oluşmasına ya da ortaya çıkmasına yardım etmek", id: "turut menyebabkan atau menghasilkan", vi: "góp phần gây ra hoặc tạo ra" }, ex: ["Stress ", { target: "contributes to" }, " illness."], tr: { uk: "Стрес сприяє виникненню хвороб.", es: "El estrés contribuye a las enfermedades.", pt: "O estresse contribui para as doenças.", fr: "Le stress contribue aux maladies.", de: "Stress trägt zu Krankheiten bei.", it: "Lo stress contribuisce alle malattie.", pl: "Stres przyczynia się do chorób.", tr: "Stres hastalıklara katkıda bulunur.", id: "Stres turut menyebabkan penyakit.", vi: "Căng thẳng góp phần gây ra bệnh tật." } }
          - { level: "C1", form: "derive from", meaning: { en: "come from a source", uk: "походити з джерела", es: "proceder de una fuente", pt: "vir de uma fonte", fr: "provenir d’une source", de: "aus einer Quelle stammen", it: "derivare da una fonte", pl: "pochodzić ze źródła", tr: "bir kaynaktan gelmek", id: "berasal dari suatu sumber", vi: "bắt nguồn từ một nguồn" }, ex: ["The word ", { target: "derives from" }, " Latin."], tr: { uk: "Це слово походить від латини.", es: "La palabra deriva del latín.", pt: "A palavra deriva do latim.", fr: "Le mot dérive du latin.", de: "Das Wort stammt aus dem Lateinischen.", it: "La parola deriva dal latino.", pl: "To słowo wywodzi się z łaciny.", tr: "Sözcük Latinceden gelir.", id: "Kata itu berasal dari bahasa Latin.", vi: "Từ này bắt nguồn từ tiếng Latin." } }
          - { level: "C1", form: "attribute to", meaning: { en: "say that something is caused by or belongs to", uk: "казати, що щось спричинене чимось або належить комусь", es: "decir que algo es causado por algo o pertenece a alguien", pt: "dizer que algo é causado por algo ou pertence a alguém", fr: "dire que quelque chose est dû à une cause ou appartient à quelqu’un", de: "sagen, dass etwas durch etwas verursacht wird oder jemandem gehört", it: "dire che qualcosa è causato da qualcosa o appartiene a qualcuno", pl: "twierdzić, że coś jest skutkiem czegoś lub należy do kogoś", tr: "bir şeyin başka bir şeyden kaynaklandığını ya da birine ait olduğunu söylemek", id: "mengatakan bahwa sesuatu disebabkan oleh sesuatu atau milik seseorang", vi: "nói rằng điều gì đó do một nguyên nhân gây ra hoặc thuộc về ai đó" }, ex: ["She ", { target: "attributes" }, " her success ", { target: "to" }, " hard work."], tr: { uk: "Вона пояснює свій успіх наполегливою працею.", es: "Ella atribuye su éxito al trabajo duro.", pt: "Ela atribui seu sucesso ao trabalho duro.", fr: "Elle attribue son succès au travail acharné.", de: "Sie führt ihren Erfolg auf harte Arbeit zurück.", it: "Lei attribuisce il suo successo al duro lavoro.", pl: "Przypisuje swój sukces ciężkiej pracy.", tr: "Başarısını çok çalışmasına bağlar.", id: "Dia menganggap keberhasilannya berkat kerja keras.", vi: "Cô ấy cho rằng thành công của mình nhờ làm việc chăm chỉ." } }
          - { level: "C1", form: "allude to", meaning: { en: "mention indirectly", uk: "згадувати побічно", es: "mencionar de forma indirecta", pt: "mencionar de forma indireta", fr: "mentionner de façon indirecte", de: "indirekt erwähnen", it: "menzionare in modo indiretto", pl: "wspominać pośrednio", tr: "dolaylı olarak söz etmek", id: "menyinggung secara tidak langsung", vi: "nhắc đến một cách gián tiếp" }, ex: ["He ", { target: "alluded to" }, " a problem without naming it."], tr: { uk: "Він натякнув на проблему, не називаючи її.", es: "Él aludió a un problema sin nombrarlo.", pt: "Ele aludiu a um problema sem nomeá-lo.", fr: "Il a fait allusion à un problème sans le nommer.", de: "Er spielte auf ein Problem an, ohne es zu nennen.", it: "Lui ha alluso a un problema senza nominarlo.", pl: "Napomknął o problemie, nie nazywając go.", tr: "Bir soruna adını vermeden değindi.", id: "Dia menyinggung sebuah masalah tanpa menyebutkannya.", vi: "Anh ấy nhắc bóng gió đến một vấn đề mà không nêu tên." } }
          - { level: "C1", form: "amount to", meaning: { en: "add up to", uk: "становити в сумі", es: "sumar", pt: "somar", fr: "s’élever à", de: "sich belaufen auf", it: "ammontare a", pl: "wynosić w sumie", tr: "toplamda bir miktara ulaşmak", id: "berjumlah", vi: "lên đến" }, ex: ["The costs ", { target: "amount to" }, " ten thousand pounds."], tr: { uk: "Витрати становлять десять тисяч фунтів.", es: "Los costos ascienden a diez mil libras.", pt: "Os custos chegam a dez mil libras.", fr: "Les coûts s’élèvent à dix mille livres.", de: "Die Kosten belaufen sich auf zehntausend Pfund.", it: "I costi ammontano a diecimila sterline.", pl: "Koszty wynoszą dziesięć tysięcy funtów.", tr: "Maliyet on bin sterlini bulur.", id: "Biayanya mencapai sepuluh ribu pound.", vi: "Chi phí lên đến mười nghìn bảng Anh." } }
          - { level: "C1", form: "resort to", meaning: { en: "use as a last choice", uk: "вдаватися як до останнього засобу", es: "recurrir a algo como última opción", pt: "recorrer a algo como última opção", fr: "recourir à quelque chose en dernier ressort", de: "als letzte Möglichkeit greifen zu", it: "ricorrere a qualcosa come ultima scelta", pl: "uciekać się do czegoś jako ostateczności", tr: "son çare olarak kullanmak", id: "menggunakan sebagai pilihan terakhir", vi: "dùng đến như lựa chọn cuối cùng" }, ex: ["They ", { target: "resorted to" }, " force."], tr: { uk: "Вони вдалися до сили.", es: "Recurrieron a la fuerza.", pt: "Eles recorreram à força.", fr: "Ils ont eu recours à la force.", de: "Sie griffen zu Gewalt.", it: "Hanno fatto ricorso alla forza.", pl: "Uciekli się do siły.", tr: "Güce başvurdular.", id: "Mereka menggunakan kekerasan.", vi: "Họ đã dùng đến vũ lực." } }

