          - { level: "B2", adj: "fond of", ex: ["He is ", { target: "fond of" }, " his old dog."], tr: { uk: "Він прив’язаний до свого старого пса.", es: "Él le tiene cariño a su perro viejo.", pt: "Ele gosta muito do seu cachorro velho.", fr: "Il est attaché à son vieux chien.", de: "Er mag seinen alten Hund sehr.", it: "Lui è affezionato al suo vecchio cane.", pl: "Jest przywiązany do swojego starego psa.", tr: "Yaşlı köpeğine düşkün.", id: "Dia sayang pada anjing tuanya.", vi: "Anh ấy rất quý con chó già của mình." } }
          - { level: "B2", adj: "proud of", ex: ["We are ", { target: "proud of" }, " our team."], tr: { uk: "Ми пишаємося нашою командою.", es: "Estamos orgullosos de nuestro equipo.", pt: "Temos orgulho da nossa equipe.", fr: "Nous sommes fiers de notre équipe.", de: "Wir sind stolz auf unser Team.", it: "Siamo orgogliosi della nostra squadra.", pl: "Jesteśmy dumni z naszego zespołu.", tr: "Takımımızla gurur duyuyoruz.", id: "Kami bangga pada tim kami.", vi: "Chúng tôi tự hào về đội của mình." } }
          - { level: "B2", adj: "capable of", ex: ["She is ", { target: "capable of" }, " hard work."], tr: { uk: "Вона здатна наполегливо працювати.", es: "Ella es capaz de trabajar duro.", pt: "Ela é capaz de trabalhar duro.", fr: "Elle est capable de travailler dur.", de: "Sie ist zu harter Arbeit fähig.", it: "Lei è capace di lavorare sodo.", pl: "Jest zdolna do ciężkiej pracy.", tr: "Zor işlerin üstesinden gelebilir.", id: "Dia mampu bekerja keras.", vi: "Cô ấy có khả năng làm việc chăm chỉ." } }
          - { level: "B2", adj: "tired of", ex: ["I'm ", { target: "tired of" }, " this weather."], tr: { uk: "Мені набридла ця погода.", es: "Estoy harto de este clima.", pt: "Estou cansado desse tempo.", fr: "J’en ai assez de ce temps.", de: "Ich habe dieses Wetter satt.", it: "Sono stufo di questo tempo.", pl: "Mam dość tej pogody.", tr: "Bu havadan bıktım.", id: "Saya bosan dengan cuaca ini.", vi: "Tôi chán thời tiết này rồi." } }
          - { level: "B2", adj: "good at", ex: ["He is ", { target: "good at" }, " maths."], tr: { uk: "Він сильний у математиці.", es: "Él es bueno para las matemáticas.", pt: "Ele é bom em matemática.", fr: "Il est bon en maths.", de: "Er ist gut in Mathe.", it: "Lui è bravo in matematica.", pl: "Jest dobry z matematyki.", tr: "Matematikte iyidir.", id: "Dia pandai matematika.", vi: "Anh ấy giỏi toán." } }
          - { level: "B2", adj: "surprised at", ex: ["I was ", { target: "surprised at" }, " the price."], tr: { uk: "Я був здивований ціною.", es: "Me sorprendió el precio.", pt: "Fiquei surpreso com o preço.", fr: "J’ai été surpris par le prix.", de: "Ich war über den Preis überrascht.", it: "Sono rimasto sorpreso dal prezzo.", pl: "Zaskoczyła mnie cena.", tr: "Fiyata şaşırdım.", id: "Saya terkejut melihat harganya.", vi: "Tôi ngạc nhiên về giá." } }
          - { level: "B2", adj: "interested in", ex: ["She is ", { target: "interested in" }, " art."], tr: { uk: "Вона цікавиться мистецтвом.", es: "A ella le interesa el arte.", pt: "Ela se interessa por arte.", fr: "Elle s’intéresse à l’art.", de: "Sie interessiert sich für Kunst.", it: "Lei è interessata all'arte.", pl: "Interesuje się sztuką.", tr: "Sanatla ilgileniyor.", id: "Dia tertarik pada seni.", vi: "Cô ấy quan tâm đến nghệ thuật." } }
          - { level: "B2", adj: "different from", ex: ["My phone is ", { target: "different from" }, " yours."], tr: { uk: "Мій телефон відрізняється від твого.", es: "Mi celular es diferente del tuyo.", pt: "Meu celular é diferente do seu.", fr: "Mon téléphone est différent du tien.", de: "Mein Handy ist anders als deins.", it: "Il mio telefono è diverso dal tuo.", pl: "Mój telefon różni się od twojego.", tr: "Benim telefonum seninkinden farklı.", id: "Ponsel saya berbeda dari ponselmu.", vi: "Điện thoại của tôi khác điện thoại của bạn." } }
          - { level: "B2", adj: "famous for", ex: ["Paris is ", { target: "famous for" }, " its food."], tr: { uk: "Париж славиться своєю кухнею.", es: "París es famoso por su comida.", pt: "Paris é famosa por sua comida.", fr: "Paris est célèbre pour sa cuisine.", de: "Paris ist berühmt für sein Essen.", it: "Parigi è famosa per il suo cibo.", pl: "Paryż słynie ze swojego jedzenia.", tr: "Paris yemekleriyle ünlüdür.", id: "Paris terkenal dengan makanannya.", vi: "Paris nổi tiếng về ẩm thực." } }
          - { level: "B2", adj: "ready for", ex: ["Are you ", { target: "ready for" }, " the test?"], tr: { uk: "Ти готовий до тесту?", es: "¿Estás listo para el examen?", pt: "Você está pronto para a prova?", fr: "Es-tu prêt pour le test ?", de: "Bist du bereit für den Test?", it: "Sei pronto per il test?", pl: "Czy jesteś gotowy na sprawdzian?", tr: "Teste hazır mısın?", id: "Apakah kamu siap untuk tes itu?", vi: "Bạn đã sẵn sàng cho bài kiểm tra chưa?" } }
          - { level: "B2", adj: "responsible for", ex: ["She is ", { target: "responsible for" }, " the budget."], tr: { uk: "Вона відповідає за бюджет.", es: "Ella es responsable del presupuesto.", pt: "Ela é responsável pelo orçamento.", fr: "Elle est responsable du budget.", de: "Sie ist für das Budget verantwortlich.", it: "Lei è responsabile del budget.", pl: "Odpowiada za budżet.", tr: "Bütçeden o sorumlu.", id: "Dia bertanggung jawab atas anggaran.", vi: "Cô ấy chịu trách nhiệm về ngân sách." } }
          - { level: "B2", adj: "keen on", ex: ["He is ", { target: "keen on" }, " football."], tr: { uk: "Він захоплюється футболом.", es: "Él es aficionado al fútbol.", pt: "Ele é apaixonado por futebol.", fr: "Il est passionné de football.", de: "Er ist ein großer Fußballfan.", it: "Lui è appassionato di calcio.", pl: "Jest zapalonym fanem piłki nożnej.", tr: "Futbola meraklıdır.", id: "Dia sangat suka sepak bola.", vi: "Anh ấy rất mê bóng đá." } }
          - { level: "B2", adj: "similar to", ex: ["Your bag is ", { target: "similar to" }, " mine."], tr: { uk: "Твоя сумка схожа на мою.", es: "Tu bolso es parecido al mío.", pt: "Sua bolsa é parecida com a minha.", fr: "Ton sac est semblable au mien.", de: "Deine Tasche ist ähnlich wie meine.", it: "La tua borsa è simile alla mia.", pl: "Twoja torba jest podobna do mojej.", tr: "Çantan benimkine benziyor.", id: "Tasmu mirip dengan tasku.", vi: "Túi của bạn giống túi của tôi." } }
          - { level: "B2", adj: "married to", ex: ["She is ", { target: "married to" }, " a doctor."], tr: { uk: "Вона заміжня за лікарем.", es: "Ella está casada con un médico.", pt: "Ela é casada com um médico.", fr: "Elle est mariée à un médecin.", de: "Sie ist mit einem Arzt verheiratet.", it: "Lei è sposata con un medico.", pl: "Jest żoną lekarza.", tr: "Bir doktorla evli.", id: "Dia menikah dengan seorang dokter.", vi: "Cô ấy kết hôn với một bác sĩ." } }
          - { level: "B2", adj: "kind to", ex: ["Be ", { target: "kind to" }, " animals."], tr: { uk: "Будь добрим до тварин.", es: "Sé amable con los animales.", pt: "Seja gentil com os animais.", fr: "Sois gentil avec les animaux.", de: "Sei freundlich zu Tieren.", it: "Sii gentile con gli animali.", pl: "Bądź życzliwy dla zwierząt.", tr: "Hayvanlara karşı nazik ol.", id: "Bersikaplah baik kepada hewan.", vi: "Hãy đối xử tử tế với động vật." } }
          - { level: "B2", adj: "angry with", ex: ["She is ", { target: "angry with" }, " her brother."], tr: { uk: "Вона сердита на брата.", es: "Ella está enojada con su hermano.", pt: "Ela está brava com o irmão.", fr: "Elle est fâchée contre son frère.", de: "Sie ist wütend auf ihren Bruder.", it: "Lei è arrabbiata con suo fratello.", pl: "Jest zła na brata.", tr: "Kardeşine kızgın.", id: "Dia marah kepada saudara laki-lakinya.", vi: "Cô ấy giận em trai của mình." } }
          - { level: "B2", adj: "pleased with", ex: ["I'm ", { target: "pleased with" }, " my results."], tr: { uk: "Я задоволений своїми результатами.", es: "Estoy contento con mis resultados.", pt: "Estou satisfeito com meus resultados.", fr: "Je suis content de mes résultats.", de: "Ich bin mit meinen Ergebnissen zufrieden.", it: "Sono soddisfatto dei miei risultati.", pl: "Jestem zadowolony ze swoich wyników.", tr: "Sonuçlarımdan memnunum.", id: "Saya puas dengan hasil saya.", vi: "Tôi hài lòng với kết quả của mình." } }
          - { level: "B2", adj: "disappointed with", ex: ["We were ", { target: "disappointed with" }, " the hotel."], tr: { uk: "Готель нас розчарував.", es: "Nos decepcionó el hotel.", pt: "Ficamos decepcionados com o hotel.", fr: "Nous avons été déçus par l’hôtel.", de: "Wir waren vom Hotel enttäuscht.", it: "Siamo rimasti delusi dall'albergo.", pl: "Hotel nas rozczarował.", tr: "Otelden hayal kırıklığına uğradık.", id: "Kami kecewa dengan hotel itu.", vi: "Chúng tôi thất vọng về khách sạn đó." } }
          - { level: "B2", adj: "angry about", ex: ["He is ", { target: "angry about" }, " the delay."], tr: { uk: "Він сердиться через затримку.", es: "Él está enojado por la demora.", pt: "Ele está bravo com o atraso.", fr: "Il est en colère à cause du retard.", de: "Er ist wegen der Verspätung verärgert.", it: "Lui è arrabbiato per il ritardo.", pl: "Jest zły z powodu opóźnienia.", tr: "Gecikmeye kızgın.", id: "Dia marah karena keterlambatan itu.", vi: "Anh ấy giận vì sự chậm trễ." } }
          - { level: "B2", adj: "worried about", ex: ["I'm ", { target: "worried about" }, " my exams."], tr: { uk: "Я хвилююся через іспити.", es: "Estoy preocupado por mis exámenes.", pt: "Estou preocupado com as minhas provas.", fr: "Je m’inquiète pour mes examens.", de: "Ich mache mir Sorgen um meine Prüfungen.", it: "Sono preoccupato per i miei esami.", pl: "Martwię się egzaminami.", tr: "Sınavlarım için endişeleniyorum.", id: "Saya khawatir tentang ujian saya.", vi: "Tôi lo lắng về các kỳ thi của mình." } }
          - { level: "B2", adj: "excited about", ex: ["The children are ", { target: "excited about" }, " the trip."], tr: { uk: "Діти в захваті від поїздки.", es: "Los niños están emocionados por el viaje.", pt: "As crianças estão empolgadas com a viagem.", fr: "Les enfants sont enthousiastes à l’idée du voyage.", de: "Die Kinder freuen sich auf den Ausflug.", it: "I bambini sono entusiasti per la gita.", pl: "Dzieci są podekscytowane wycieczką.", tr: "Çocuklar gezi için heyecanlı.", id: "Anak-anak bersemangat tentang perjalanan itu.", vi: "Bọn trẻ rất háo hức về chuyến đi." } }

  - title: { en: "Nouns with a preposition", uk: "Іменники з прийменником", es: "Sustantivos con preposición", pt: "Substantivos com preposição", fr: "Noms avec préposition", de: "Nomen mit Präposition", it: "Sostantivi con preposizione", pl: "Rzeczowniki z przyimkiem", tr: "Edatlı isimler", id: "Kata benda dengan kata depan", vi: "Danh từ đi với giới từ" }
    role: own
    content:
      - type: usage
        columns: [{ key: "noun", label: { en: "Noun", uk: "Іменник", es: "Sustantivo", pt: "Substantivo", fr: "Nom", de: "Nomen", it: "Sostantivo", pl: "Rzeczownik", tr: "İsim", id: "Kata benda", vi: "Danh từ" } }, { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }]
        rows:
          - { level: "B2", noun: "reason for", ex: ["What is the ", { target: "reason for" }, " the delay?"], tr: { uk: "Яка причина затримки?", es: "¿Cuál es el motivo de la demora?", pt: "Qual é o motivo do atraso?", fr: "Quelle est la raison du retard ?", de: "Was ist der Grund für die Verspätung?", it: "Qual è il motivo del ritardo?", pl: "Jaka jest przyczyna opóźnienia?", tr: "Gecikmenin nedeni nedir?", id: "Apa alasan keterlambatan itu?", vi: "Lý do của sự chậm trễ là gì?" } }
          - { level: "B2", noun: "need for", ex: ["There is a ", { target: "need for" }, " more nurses."], tr: { uk: "Потрібно більше медсестер.", es: "Se necesitan más enfermeras.", pt: "Há necessidade de mais enfermeiros.", fr: "Il faut davantage d’infirmières.", de: "Es besteht Bedarf an mehr Pflegekräften.", it: "C'è bisogno di più infermieri.", pl: "Potrzeba więcej pielęgniarek.", tr: "Daha fazla hemşireye ihtiyaç var.", id: "Ada kebutuhan akan lebih banyak perawat.", vi: "Cần có thêm y tá." } }
          - { level: "B2", noun: "demand for", ex: ["The ", { target: "demand for" }, " tickets is high."], tr: { uk: "Попит на квитки високий.", es: "La demanda de boletos es alta.", pt: "A demanda por ingressos é alta.", fr: "La demande de billets est forte.", de: "Die Nachfrage nach Tickets ist hoch.", it: "La richiesta di biglietti è alta.", pl: "Popyt na bilety jest duży.", tr: "Biletlere talep yüksek.", id: "Permintaan akan tiket tinggi.", vi: "Nhu cầu mua vé rất cao." } }
          - { level: "B2", noun: "cause of", ex: ["Speed is a ", { target: "cause of" }, " many accidents."], tr: { uk: "Швидкість — причина багатьох аварій.", es: "La velocidad es una causa de muchos accidentes.", pt: "A velocidade é uma causa de muitos acidentes.", fr: "La vitesse est une cause de nombreux accidents.", de: "Geschwindigkeit ist eine Ursache vieler Unfälle.", it: "La velocità è una causa di molti incidenti.", pl: "Prędkość jest przyczyną wielu wypadków.", tr: "Hız, birçok kazanın nedenidir.", id: "Kecepatan adalah penyebab banyak kecelakaan.", vi: "Tốc độ là một nguyên nhân của nhiều vụ tai nạn." } }
          - { level: "B2", noun: "example of", ex: ["This is a good ", { target: "example of" }, " teamwork."], tr: { uk: "Це гарний приклад командної роботи.", es: "Este es un buen ejemplo de trabajo en equipo.", pt: "Este é um bom exemplo de trabalho em equipe.", fr: "C’est un bon exemple de travail d’équipe.", de: "Das ist ein gutes Beispiel für Teamarbeit.", it: "Questo è un buon esempio di lavoro di squadra.", pl: "To dobry przykład pracy zespołowej.", tr: "Bu, takım çalışmasına iyi bir örnektir.", id: "Ini contoh yang baik dari kerja sama tim.", vi: "Đây là một ví dụ hay về tinh thần làm việc nhóm." } }
          - { level: "B2", noun: "lack of", ex: ["A ", { target: "lack of" }, " sleep makes me tired."], tr: { uk: "Брак сну втомлює мене.", es: "La falta de sueño me cansa.", pt: "A falta de sono me deixa cansado.", fr: "Le manque de sommeil me fatigue.", de: "Schlafmangel macht mich müde.", it: "La mancanza di sonno mi stanca.", pl: "Brak snu mnie męczy.", tr: "Uykusuzluk beni yorar.", id: "Kurang tidur membuat saya lelah.", vi: "Thiếu ngủ làm tôi mệt." } }
          - { level: "B2", noun: "advantage of", ex: ["One ", { target: "advantage of" }, " the flat is its size."], tr: { uk: "Одна з переваг квартири — її розмір.", es: "Una ventaja del apartamento es su tamaño.", pt: "Uma vantagem do apartamento é o tamanho.", fr: "L’un des avantages de l’appartement est sa taille.", de: "Ein Vorteil der Wohnung ist ihre Größe.", it: "Un vantaggio dell'appartamento è la sua grandezza.", pl: "Jedną z zalet mieszkania jest jego wielkość.", tr: "Dairenin bir avantajı büyüklüğüdür.", id: "Salah satu keuntungan apartemen itu adalah ukurannya.", vi: "Một ưu điểm của căn hộ là diện tích của nó." } }
          - { level: "B2", noun: "knowledge of", ex: ["He has a good ", { target: "knowledge of" }, " history."], tr: { uk: "Він добре знає історію.", es: "Él tiene buenos conocimientos de historia.", pt: "Ele tem bom conhecimento de história.", fr: "Il a de bonnes connaissances en histoire.", de: "Er hat gute Geschichtskenntnisse.", it: "Lui ha una buona conoscenza della storia.", pl: "Ma dobrą znajomość historii.", tr: "Tarih bilgisi iyidir.", id: "Dia punya pengetahuan sejarah yang baik.", vi: "Anh ấy có kiến thức tốt về lịch sử." } }
          - { level: "B2", noun: "problem with", ex: ["I have a ", { target: "problem with" }, " my phone."], tr: { uk: "У мене проблема з телефоном.", es: "Tengo un problema con mi celular.", pt: "Estou com um problema no meu celular.", fr: "J’ai un problème avec mon téléphone.", de: "Ich habe ein Problem mit meinem Handy.", it: "Ho un problema con il mio telefono.", pl: "Mam problem z telefonem.", tr: "Telefonumla ilgili bir sorunum var.", id: "Ada masalah dengan ponsel saya.", vi: "Điện thoại của tôi có vấn đề." } }
          - { level: "B2", noun: "relationship with", ex: ["She has a good ", { target: "relationship with" }, " her sister."], tr: { uk: "У неї добрі стосунки із сестрою.", es: "Ella tiene una buena relación con su hermana.", pt: "Ela tem um bom relacionamento com a irmã.", fr: "Elle a de bons rapports avec sa sœur.", de: "Sie hat ein gutes Verhältnis zu ihrer Schwester.", it: "Lei ha un buon rapporto con sua sorella.", pl: "Ma dobre relacje z siostrą.", tr: "Kız kardeşiyle arası iyidir.", id: "Dia punya hubungan yang baik dengan saudara perempuannya.", vi: "Cô ấy có mối quan hệ tốt với em gái." } }
          - { level: "B2", noun: "difficulty in", ex: ["He had ", { target: "difficulty in" }, " finding the house."], tr: { uk: "Йому було важко знайти будинок.", es: "Le costó trabajo encontrar la casa.", pt: "Ele teve dificuldade para encontrar a casa.", fr: "Il a eu du mal à trouver la maison.", de: "Er hatte Schwierigkeiten, das Haus zu finden.", it: "Lui ha avuto difficoltà a trovare la casa.", pl: "Miał trudności ze znalezieniem domu.", tr: "Evi bulmakta zorluk çekti.", id: "Dia kesulitan menemukan rumah itu.", vi: "Anh ấy gặp khó khăn khi tìm ngôi nhà." } }
          - { level: "B2", noun: "difficulty with", ex: ["She has ", { target: "difficulty with" }, " spelling."], tr: { uk: "Їй складно з правописом.", es: "A ella le cuesta la ortografía.", pt: "Ela tem dificuldade com a ortografia.", fr: "Elle a des difficultés en orthographe.", de: "Sie hat Schwierigkeiten mit der Rechtschreibung.", it: "Lei ha difficoltà con l'ortografia.", pl: "Ma trudności z ortografią.", tr: "Yazımda zorlanıyor.", id: "Dia kesulitan dalam mengeja.", vi: "Cô ấy gặp khó khăn với chính tả." } }
          - { level: "B2", noun: "increase in", ex: ["There was an ", { target: "increase in" }, " prices."], tr: { uk: "Відбулося зростання цін.", es: "Hubo un aumento de precios.", pt: "Houve um aumento nos preços.", fr: "Il y a eu une hausse des prix.", de: "Es gab einen Preisanstieg.", it: "C'è stato un aumento dei prezzi.", pl: "Nastąpił wzrost cen.", tr: "Fiyatlarda bir artış oldu.", id: "Terjadi kenaikan harga.", vi: "Giá cả đã tăng." } }
          - { level: "B2", noun: "difference in", ex: ["There is a big ", { target: "difference in" }, " price."], tr: { uk: "Є велика різниця в ціні.", es: "Hay una gran diferencia de precio.", pt: "Há uma grande diferença de preço.", fr: "Il y a une grande différence de prix.", de: "Es gibt einen großen Preisunterschied.", it: "C'è una grande differenza di prezzo.", pl: "Jest duża różnica w cenie.", tr: "Fiyatta büyük bir fark var.", id: "Ada perbedaan harga yang besar.", vi: "Có sự chênh lệch lớn về giá." } }
          - { level: "B2", noun: "solution to", ex: ["I can't find a ", { target: "solution to" }, " this problem."], tr: { uk: "Я не можу знайти розв’язання цієї проблеми.", es: "No puedo encontrar una solución a este problema.", pt: "Não consigo encontrar uma solução para este problema.", fr: "Je ne trouve pas de solution à ce problème.", de: "Ich finde keine Lösung für dieses Problem.", it: "Non riesco a trovare una soluzione a questo problema.", pl: "Nie mogę znaleźć rozwiązania tego problemu.", tr: "Bu soruna bir çözüm bulamıyorum.", id: "Saya tidak bisa menemukan solusi untuk masalah ini.", vi: "Tôi không tìm được giải pháp cho vấn đề này." } }
          - { level: "B2", noun: "answer to", ex: ["What is the ", { target: "answer to" }, " question five?"], tr: { uk: "Яка відповідь на п’яте запитання?", es: "¿Cuál es la respuesta a la pregunta cinco?", pt: "Qual é a resposta da pergunta cinco?", fr: "Quelle est la réponse à la question cinq ?", de: "Wie lautet die Antwort auf Frage fünf?", it: "Qual è la risposta alla domanda cinque?", pl: "Jaka jest odpowiedź na pytanie piąte?", tr: "Beşinci sorunun cevabı nedir?", id: "Apa jawaban untuk pertanyaan nomor lima?", vi: "Đáp án của câu hỏi số năm là gì?" } }
          - { level: "B2", noun: "reaction to", ex: ["Her ", { target: "reaction to" }, " the news was calm."], tr: { uk: "Вона спокійно відреагувала на новину.", es: "Su reacción ante la noticia fue tranquila.", pt: "A reação dela à notícia foi calma.", fr: "Sa réaction à la nouvelle a été calme.", de: "Ihre Reaktion auf die Nachricht war ruhig.", it: "La sua reazione alla notizia è stata calma.", pl: "Jej reakcja na wiadomość była spokojna.", tr: "Habere tepkisi sakin oldu.", id: "Reaksinya terhadap berita itu tenang.", vi: "Phản ứng của cô ấy trước tin này rất bình tĩnh." } }
          - { level: "B2", noun: "attitude to", ex: ["His ", { target: "attitude to" }, " work is serious."], tr: { uk: "Він серйозно ставиться до роботи.", es: "Su actitud hacia el trabajo es seria.", pt: "A atitude dele em relação ao trabalho é séria.", fr: "Son attitude face au travail est sérieuse.", de: "Seine Einstellung zur Arbeit ist ernst.", it: "Il suo atteggiamento verso il lavoro è serio.", pl: "Jego stosunek do pracy jest poważny.", tr: "İşe karşı tutumu ciddidir.", id: "Sikapnya terhadap pekerjaan serius.", vi: "Thái độ của anh ấy đối với công việc rất nghiêm túc." } }
          - { level: "B2", noun: "access to", ex: ["Students have ", { target: "access to" }, " the library."], tr: { uk: "Студенти мають доступ до бібліотеки.", es: "Los estudiantes tienen acceso a la biblioteca.", pt: "Os alunos têm acesso à biblioteca.", fr: "Les étudiants ont accès à la bibliothèque.", de: "Studierende haben Zugang zur Bibliothek.", it: "Gli studenti hanno accesso alla biblioteca.", pl: "Studenci mają dostęp do biblioteki.", tr: "Öğrenciler kütüphaneye erişebilir.", id: "Mahasiswa punya akses ke perpustakaan.", vi: "Sinh viên được vào thư viện." } }
          - { level: "B2", noun: "relationship between", ex: ["The ", { target: "relationship between" }, " the two countries is good."], tr: { uk: "Відносини між двома країнами добрі.", es: "La relación entre los dos países es buena.", pt: "A relação entre os dois países é boa.", fr: "Les relations entre les deux pays sont bonnes.", de: "Die Beziehung zwischen den beiden Ländern ist gut.", it: "Il rapporto tra i due paesi è buono.", pl: "Stosunki między tymi dwoma krajami są dobre.", tr: "İki ülke arasındaki ilişki iyidir.", id: "Hubungan antara kedua negara itu baik.", vi: "Mối quan hệ giữa hai nước rất tốt." } }
          - { level: "B2", noun: "difference between", ex: ["What is the ", { target: "difference between" }, " these two words?"], tr: { uk: "Яка різниця між цими двома словами?", es: "¿Cuál es la diferencia entre estas dos palabras?", pt: "Qual é a diferença entre essas duas palavras?", fr: "Quelle est la différence entre ces deux mots ?", de: "Was ist der Unterschied zwischen diesen beiden Wörtern?", it: "Qual è la differenza tra queste due parole?", pl: "Jaka jest różnica między tymi dwoma słowami?", tr: "Bu iki sözcük arasındaki fark nedir?", id: "Apa perbedaan antara kedua kata ini?", vi: "Hai từ này khác nhau như thế nào?" } }

  - title: { en: "Compare: one verb, different prepositions", uk: "Порівняння: одне дієслово, різні прийменники", es: "Comparación: un verbo, distintas preposiciones", pt: "Comparação: um verbo, preposições diferentes", fr: "Comparaison : un verbe, des prépositions différentes", de: "Vergleich: ein Verb, verschiedene Präpositionen", it: "Confronto: un verbo, preposizioni diverse", pl: "Porównanie: jeden czasownik, różne przyimki", tr: "Karşılaştırma: tek fiil, farklı edatlar", id: "Perbandingan: satu kata kerja, kata depan yang berbeda", vi: "So sánh: một động từ, nhiều giới từ khác nhau" }
    role: compare
    content:
      - type: usage
        columns: [{ key: "verb", label: { en: "Verb", uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }, { key: "meaning", label: { en: "Meaning", uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }, { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }]
        rows:
          - { level: "B2", verb: "look at", meaning: { en: "direct your eyes towards", uk: "спрямовувати погляд на", es: "dirigir la mirada hacia", pt: "dirigir o olhar para", fr: "diriger son regard vers", de: "den Blick auf etwas richten", it: "rivolgere lo sguardo verso", pl: "kierować wzrok na", tr: "gözünü bir şeye çevirmek", id: "mengarahkan pandangan ke", vi: "hướng mắt về phía" }, ex: [{ target: "Look at" }, " this map."], tr: { uk: "Подивись на цю карту.", es: "Mira este mapa.", pt: "Olhe este mapa.", fr: "Regarde cette carte.", de: "Sieh dir diese Karte an.", it: "Guarda questa mappa.", pl: "Spójrz na tę mapę.", tr: "Şu haritaya bak.", id: "Lihat peta ini.", vi: "Hãy nhìn tấm bản đồ này." } }
          - { level: "B2", verb: "look for", meaning: { en: "search", uk: "шукати", es: "buscar", pt: "procurar", fr: "chercher", de: "suchen", it: "cercare", pl: "szukać", tr: "aramak", id: "mencari", vi: "tìm kiếm" }, ex: ["I'm ", { target: "looking for" }, " a map."], tr: { uk: "Я шукаю карту.", es: "Estoy buscando un mapa.", pt: "Estou procurando um mapa.", fr: "Je cherche une carte.", de: "Ich suche eine Karte.", it: "Sto cercando una mappa.", pl: "Szukam mapy.", tr: "Bir harita arıyorum.", id: "Saya sedang mencari peta.", vi: "Tôi đang tìm một tấm bản đồ." } }
          - { level: "B2", verb: "look after", meaning: { en: "take care of", uk: "доглядати, піклуватися", es: "cuidar de", pt: "cuidar de", fr: "s’occuper de", de: "sich kümmern um", it: "prendersi cura di", pl: "opiekować się", tr: "bakmak, ilgilenmek", id: "merawat", vi: "chăm sóc" }, ex: ["She ", { target: "looks after" }, " her brother."], tr: { uk: "Вона доглядає за братом.", es: "Ella cuida a su hermano.", pt: "Ela cuida do irmão dela.", fr: "Elle s’occupe de son frère.", de: "Sie kümmert sich um ihren Bruder.", it: "Lei si prende cura di suo fratello.", pl: "Ona opiekuje się bratem.", tr: "O, kardeşine bakıyor.", id: "Dia menjaga saudara laki-lakinya.", vi: "Cô ấy chăm sóc em trai của mình." } }
          - { level: "B2", verb: "look into", meaning: { en: "investigate", uk: "розслідувати", es: "investigar", pt: "investigar", fr: "enquêter sur", de: "untersuchen", it: "indagare", pl: "badać, dochodzić", tr: "araştırmak", id: "menyelidiki", vi: "điều tra" }, ex: ["The police are ", { target: "looking into" }, " the theft."], tr: { uk: "Поліція розслідує крадіжку.", es: "La policía está investigando el robo.", pt: "A polícia está investigando o roubo.", fr: "La police enquête sur le vol.", de: "Die Polizei untersucht den Diebstahl.", it: "La polizia sta indagando sul furto.", pl: "Policja bada sprawę kradzieży.", tr: "Polis hırsızlığı araştırıyor.", id: "Polisi sedang menyelidiki pencurian itu.", vi: "Cảnh sát đang điều tra vụ trộm." } }
          - { level: "B2", verb: "think of", meaning: { en: "have in mind; form an opinion", uk: "мати на думці; мати власну думку", es: "tener en mente; formarse una opinión", pt: "ter em mente; formar uma opinião", fr: "avoir en tête ; se faire une opinion", de: "im Sinn haben; sich eine Meinung bilden", it: "avere in mente; farsi un'opinione", pl: "mieć na myśli; wyrobić sobie opinię", tr: "aklında tutmak; bir fikir edinmek", id: "memikirkan; membentuk pendapat", vi: "nghĩ đến; có ý kiến về" }, ex: ["What do you ", { target: "think of" }, " this song?"], tr: { uk: "Що ти думаєш про цю пісню?", es: "¿Qué piensas de esta canción?", pt: "O que você acha desta música?", fr: "Que penses-tu de cette chanson ?", de: "Was hältst du von diesem Lied?", it: "Che cosa pensi di questa canzone?", pl: "Co sądzisz o tej piosence?", tr: "Bu şarkı hakkında ne düşünüyorsun?", id: "Bagaimana pendapatmu tentang lagu ini?", vi: "Bạn nghĩ gì về bài hát này?" } }
          - { level: "B2", verb: "think about", meaning: { en: "consider carefully", uk: "уважно обмірковувати", es: "considerar con cuidado", pt: "considerar com cuidado", fr: "réfléchir attentivement à", de: "gründlich überlegen", it: "considerare con attenzione", pl: "rozważać", tr: "dikkatle düşünmek", id: "mempertimbangkan dengan cermat", vi: "cân nhắc kỹ" }, ex: ["I'm ", { target: "thinking about" }, " a new job."], tr: { uk: "Я думаю про нову роботу.", es: "Estoy pensando en un nuevo trabajo.", pt: "Estou pensando em um novo emprego.", fr: "Je réfléchis à un nouvel emploi.", de: "Ich denke über einen neuen Job nach.", it: "Sto pensando a un nuovo lavoro.", pl: "Zastanawiam się nad nową pracą.", tr: "Yeni bir iş düşünüyorum.", id: "Saya sedang memikirkan pekerjaan baru.", vi: "Tôi đang cân nhắc một công việc mới." } }
          - { level: "B2", verb: "care about", meaning: { en: "feel that something matters", uk: "вважати щось важливим", es: "sentir que algo importa", pt: "sentir que algo importa", fr: "trouver que quelque chose compte", de: "etwas wichtig finden", it: "sentire che qualcosa conta", pl: "uważać, że coś jest ważne", tr: "bir şeyi önemsemek", id: "merasa sesuatu itu penting", vi: "thấy điều gì đó quan trọng" }, ex: ["She ", { target: "cares about" }, " the planet."], tr: { uk: "Вона дбає про планету.", es: "A ella le importa el planeta.", pt: "Ela se importa com o planeta.", fr: "Elle se soucie de la planète.", de: "Ihr liegt der Planet am Herzen.", it: "Le sta a cuore il pianeta.", pl: "Zależy jej na planecie.", tr: "Gezegeni önemsiyor.", id: "Dia peduli pada planet ini.", vi: "Cô ấy quan tâm đến hành tinh của chúng ta." } }
          - { level: "B2", verb: "care for", meaning: { en: "look after; like", uk: "доглядати; любити", es: "cuidar; tener aprecio", pt: "cuidar; gostar", fr: "s’occuper de ; aimer", de: "sich kümmern um; mögen", it: "prendersi cura di; apprezzare", pl: "opiekować się; lubić", tr: "bakmak; hoşlanmak", id: "merawat; menyukai", vi: "chăm sóc; thích" }, ex: ["He ", { target: "cares for" }, " his mother."], tr: { uk: "Він доглядає за своєю матір’ю.", es: "Él cuida de su madre.", pt: "Ele cuida da mãe dele.", fr: "Il s’occupe de sa mère.", de: "Er kümmert sich um seine Mutter.", it: "Lui si prende cura di sua madre.", pl: "Opiekuje się swoją matką.", tr: "Annesine bakıyor.", id: "Dia merawat ibunya.", vi: "Anh ấy chăm sóc mẹ của mình." } }
          - { level: "B2", verb: "agree with", meaning: { en: "share someone's opinion", uk: "поділяти чиюсь думку", es: "compartir la opinión de alguien", pt: "compartilhar a opinião de alguém", fr: "partager l’avis de quelqu’un", de: "jemandes Meinung teilen", it: "condividere l'opinione di qualcuno", pl: "podzielać czyjąś opinię", tr: "birinin görüşünü paylaşmak", id: "sependapat dengan seseorang", vi: "chia sẻ ý kiến của ai đó" }, ex: ["I ", { target: "agree with" }, " you."], tr: { uk: "Я з тобою згоден.", es: "Estoy de acuerdo contigo.", pt: "Eu concordo com você.", fr: "Je suis d’accord avec toi.", de: "Ich stimme dir zu.", it: "Sono d'accordo con te.", pl: "Zgadzam się z tobą.", tr: "Sana katılıyorum.", id: "Saya setuju denganmu.", vi: "Tôi đồng ý với bạn." } }
          - { level: "B2", verb: "agree to", meaning: { en: "accept a plan or a request", uk: "погоджуватися з планом чи проханням", es: "aceptar un plan o una petición", pt: "aceitar um plano ou um pedido", fr: "accepter un projet ou une demande", de: "einem Plan oder einer Bitte zustimmen", it: "accettare un piano o una richiesta", pl: "zgodzić się na plan lub prośbę", tr: "bir planı ya da isteği kabul etmek", id: "menerima rencana atau permintaan", vi: "chấp nhận một kế hoạch hay một yêu cầu" }, ex: ["She ", { target: "agreed to" }, " the plan."], tr: { uk: "Вона погодилася на цей план.", es: "Ella aceptó el plan.", pt: "Ela concordou com o plano.", fr: "Elle a accepté le plan.", de: "Sie stimmte dem Plan zu.", it: "Lei ha accettato il piano.", pl: "Zgodziła się na ten plan.", tr: "Plana razı oldu.", id: "Dia menyetujui rencana itu.", vi: "Cô ấy đồng ý với kế hoạch." } }
          - { level: "B2", verb: "agree on", meaning: { en: "reach one decision together", uk: "дійти спільного рішення", es: "llegar juntos a una decisión", pt: "chegar juntos a uma decisão", fr: "arriver ensemble à une décision", de: "gemeinsam zu einer Entscheidung kommen", it: "arrivare insieme a una decisione", pl: "wspólnie podjąć decyzję", tr: "birlikte bir karara varmak", id: "mencapai satu keputusan bersama", vi: "cùng đi đến một quyết định" }, ex: ["We ", { target: "agreed on" }, " a date."], tr: { uk: "Ми домовилися про дату.", es: "Acordamos una fecha.", pt: "Combinamos uma data.", fr: "Nous nous sommes mis d’accord sur une date.", de: "Wir haben uns auf ein Datum geeinigt.", it: "Ci siamo accordati su una data.", pl: "Uzgodniliśmy datę.", tr: "Bir tarih üzerinde anlaştık.", id: "Kami menyepakati sebuah tanggal.", vi: "Chúng tôi đã thống nhất một ngày." } }
          - { level: "B2", verb: "blame someone for", meaning: { en: "say that a person is at fault", uk: "казати, що хтось винен", es: "decir que alguien tiene la culpa", pt: "dizer que alguém tem culpa", fr: "dire qu’une personne est en faute", de: "sagen, dass jemand schuld ist", it: "dire che una persona ha colpa", pl: "twierdzić, że ktoś zawinił", tr: "bir kişiyi suçlu bulmak", id: "mengatakan bahwa seseorang bersalah", vi: "nói rằng ai đó có lỗi" }, ex: ["They ", { target: "blamed" }, " him ", { target: "for" }, " the delay."], tr: { uk: "Вони звинуватили його в затримці.", es: "Lo culparon por la demora.", pt: "Eles o culparam pelo atraso.", fr: "Ils lui ont reproché le retard.", de: "Sie gaben ihm die Schuld an der Verspätung.", it: "Lo hanno incolpato del ritardo.", pl: "Obwinili go o opóźnienie.", tr: "Gecikme için onu suçladılar.", id: "Mereka menyalahkannya atas keterlambatan itu.", vi: "Họ đổ lỗi cho anh ấy về sự chậm trễ." } }
          - { level: "B2", verb: "blame something on", meaning: { en: "say that a person is the cause", uk: "казати, що причина в комусь", es: "decir que alguien es la causa", pt: "dizer que alguém é a causa", fr: "dire qu’une personne en est la cause", de: "sagen, dass jemand die Ursache ist", it: "dire che una persona è la causa", pl: "twierdzić, że ktoś jest przyczyną", tr: "bir kişiyi sebep göstermek", id: "mengatakan bahwa seseorang adalah penyebabnya", vi: "nói rằng ai đó là nguyên nhân" }, ex: ["They ", { target: "blamed" }, " the delay ", { target: "on" }, " him."], tr: { uk: "Вони скинули провину за затримку на нього.", es: "Le echaron a él la culpa de la demora.", pt: "Eles botaram a culpa do atraso nele.", fr: "Ils lui ont mis le retard sur le dos.", de: "Sie schoben ihm die Schuld an der Verspätung zu.", it: "Hanno attribuito a lui la colpa del ritardo.", pl: "Zwalili winę za opóźnienie na niego.", tr: "Gecikmenin suçunu ona yüklediler.", id: "Mereka melimpahkan kesalahan keterlambatan itu kepadanya.", vi: "Họ đổ lỗi về sự chậm trễ lên anh ấy." } }
          - { level: "B2", verb: "pay for", meaning: { en: "give money for what you buy", uk: "платити за те, що купуєш", es: "dar dinero por lo que compras", pt: "dar dinheiro pelo que você compra", fr: "donner de l’argent pour ce qu’on achète", de: "Geld für etwas Gekauftes geben", it: "dare denaro per ciò che si compra", pl: "płacić za to, co się kupuje", tr: "satın aldığın şey için para vermek", id: "membayar uang untuk barang yang dibeli", vi: "trả tiền cho thứ mình mua" }, ex: ["I ", { target: "paid for" }, " the tickets."], tr: { uk: "Я заплатив за квитки.", es: "Pagué los boletos.", pt: "Paguei pelos ingressos.", fr: "J’ai payé les billets.", de: "Ich habe die Tickets bezahlt.", it: "Ho pagato i biglietti.", pl: "Zapłaciłem za bilety.", tr: "Biletlerin parasını ödedim.", id: "Saya membayar tiket itu.", vi: "Tôi đã trả tiền vé." } }
          - { level: "B2", verb: "pay to", meaning: { en: "give money to a person or an office", uk: "віддавати гроші людині чи установі", es: "dar dinero a una persona o a una oficina", pt: "dar dinheiro a uma pessoa ou a um escritório", fr: "donner de l’argent à une personne ou à un bureau", de: "einer Person oder einer Stelle Geld geben", it: "dare denaro a una persona o a un ufficio", pl: "przekazywać pieniądze osobie lub biuru", tr: "bir kişiye ya da bir ofise para vermek", id: "memberikan uang kepada seseorang atau suatu kantor", vi: "đưa tiền cho một người hoặc một văn phòng" }, ex: ["Please ", { target: "pay" }, " the fee ", { target: "to" }, " the receptionist."], tr: { uk: "Будь ласка, сплати внесок адміністраторові.", es: "Por favor, paga la tarifa a la recepcionista.", pt: "Por favor, pague a taxa ao recepcionista.", fr: "Merci de régler les frais auprès de la réceptionniste.", de: "Bitte zahle die Gebühr an der Rezeption.", it: "Per favore, paga la quota alla receptionist.", pl: "Proszę wpłacić opłatę recepcjonistce.", tr: "Lütfen ücreti resepsiyon görevlisine ödeyin.", id: "Tolong bayarkan biayanya kepada resepsionis.", vi: "Làm ơn nộp phí cho lễ tân." } }
          - { level: "B2", verb: "speak to", meaning: { en: "say something to a person", uk: "говорити щось людині", es: "decirle algo a una persona", pt: "dizer algo a uma pessoa", fr: "dire quelque chose à une personne", de: "jemandem etwas sagen", it: "dire qualcosa a una persona", pl: "mówić coś do osoby", tr: "bir kişiye bir şey söylemek", id: "mengatakan sesuatu kepada seseorang", vi: "nói điều gì đó với một người" }, ex: ["Can I ", { target: "speak to" }, " the manager?"], tr: { uk: "Можна поговорити з менеджером?", es: "¿Puedo hablar con el gerente?", pt: "Posso falar com o gerente?", fr: "Puis-je parler au directeur ?", de: "Kann ich mit dem Chef sprechen?", it: "Posso parlare con il direttore?", pl: "Czy mogę porozmawiać z kierownikiem?", tr: "Müdürle konuşabilir miyim?", id: "Bolehkah saya berbicara dengan manajer?", vi: "Tôi có thể nói chuyện với quản lý được không?" } }
