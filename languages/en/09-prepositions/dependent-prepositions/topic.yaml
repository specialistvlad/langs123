        - { level: "C1", point: { en: "Finer contrasts", uk: "Тонші відмінності", es: "Contrastes más finos", pt: "Contrastes mais sutis", fr: "Nuances plus fines", de: "Feinere Unterschiede", it: "Contrasti più sottili", pl: "Subtelniejsze różnice", tr: "Daha ince ayrımlar", id: "Perbedaan yang lebih halus", vi: "Khác biệt tinh tế hơn" }, rule: { en: ["one word, two meanings: ", { term: "responsible for" }, " a task, ", { term: "responsible to" }, " a person"], uk: ["одне слово, два значення: ", { term: "responsible for" }, " вживається із завданням, ", { term: "responsible to" }, " — з людиною"], es: ["una palabra, dos significados: ", { term: "responsible for" }, " va con una tarea, ", { term: "responsible to" }, " con una persona"], pt: ["uma palavra, dois significados: ", { term: "responsible for" }, " vai com uma tarefa, ", { term: "responsible to" }, " com uma pessoa"], fr: ["un mot, deux sens : ", { term: "responsible for" }, " va avec une tâche, ", { term: "responsible to" }, " avec une personne"], de: ["ein Wort, zwei Bedeutungen: ", { term: "responsible for" }, " steht bei einer Aufgabe, ", { term: "responsible to" }, " bei einer Person"], it: ["una parola, due significati: ", { term: "responsible for" }, " si usa con un compito, ", { term: "responsible to" }, " con una persona"], pl: ["jedno słowo, dwa znaczenia: ", { term: "responsible for" }, " łączy się z zadaniem, ", { term: "responsible to" }, " z osobą"], tr: ["tek sözcük, iki anlam: ", { term: "responsible for" }, " bir görevle, ", { term: "responsible to" }, " bir kişiyle kullanılır"], id: ["satu kata, dua arti: ", { term: "responsible for" }, " untuk tugas, ", { term: "responsible to" }, " untuk orang"], vi: ["một từ, hai nghĩa: ", { term: "responsible for" }, " đi với một nhiệm vụ, ", { term: "responsible to" }, " đi với một người"] }, ex: { examples: [["He is ", { target: "responsible to" }, " the manager."], ["I ", { target: "prefer" }, " tea ", { target: "to" }, " coffee."]] }, tr: { uk: { examples: ["Він підзвітний менеджеру.", "Я віддаю перевагу чаю над кавою."] }, es: { examples: ["Él responde ante el gerente.", "Prefiero el té al café."] }, pt: { examples: ["Ele responde ao gerente.", "Prefiro chá a café."] }, fr: { examples: ["Il rend des comptes au directeur.", "Je préfère le thé au café."] }, de: { examples: ["Er ist dem Chef unterstellt.", "Ich trinke lieber Tee als Kaffee."] }, it: { examples: ["Risponde al direttore.", "Preferisco il tè al caffè."] }, pl: { examples: ["Podlega kierownikowi.", "Wolę herbatę od kawy."] }, tr: { examples: ["Müdüre karşı sorumludur.", "Çayı kahveye tercih ederim."] }, id: { examples: ["Dia bertanggung jawab kepada manajer.", "Saya lebih suka teh daripada kopi."] }, vi: { examples: ["Anh ấy chịu trách nhiệm trước quản lý.", "Tôi thích trà hơn cà phê."] } } }
        - { level: "C1", point: { en: "Academic nouns", uk: "Академічні іменники", es: "Sustantivos académicos", pt: "Substantivos acadêmicos", fr: "Noms académiques", de: "Akademische Nomen", it: "Sostantivi accademici", pl: "Rzeczowniki akademickie", tr: "Akademik isimler", id: "Kata benda akademik", vi: "Danh từ học thuật" }, rule: { en: "abstract nouns keep one preposition each", uk: "кожен абстрактний іменник зберігає один прийменник", es: "cada sustantivo abstracto conserva una sola preposición", pt: "cada substantivo abstrato mantém uma só preposição", fr: "chaque nom abstrait garde une seule préposition", de: "jedes abstrakte Nomen behält eine feste Präposition", it: "ogni sostantivo astratto mantiene una sola preposizione", pl: "każdy rzeczownik abstrakcyjny zachowuje jeden przyimek", tr: "her soyut isim tek bir edatla kullanılır", id: "setiap kata benda abstrak tetap memakai satu kata depan", vi: "mỗi danh từ trừu tượng giữ một giới từ" }, ex: { examples: [["the ", { target: "impact on" }, " small shops"], ["a ", { target: "link between" }, " sleep and memory"]] }, tr: { uk: { examples: ["вплив на малі крамниці", "зв’язок між сном і пам’яттю"] }, es: { examples: ["el impacto en las tiendas pequeñas", "un vínculo entre el sueño y la memoria"] }, pt: { examples: ["o impacto nas lojas pequenas", "uma ligação entre o sono e a memória"] }, fr: { examples: ["l’impact sur les petits commerces", "un lien entre le sommeil et la mémoire"] }, de: { examples: ["die Auswirkung auf kleine Geschäfte", "ein Zusammenhang zwischen Schlaf und Gedächtnis"] }, it: { examples: ["l'impatto sui piccoli negozi", "un legame tra il sonno e la memoria"] }, pl: { examples: ["wpływ na małe sklepy", "związek między snem a pamięcią"] }, tr: { examples: ["küçük dükkânlar üzerindeki etki", "uyku ile bellek arasındaki bağ"] }, id: { examples: ["dampak pada toko-toko kecil", "hubungan antara tidur dan ingatan"] }, vi: { examples: ["tác động lên các cửa hàng nhỏ", "mối liên hệ giữa giấc ngủ v