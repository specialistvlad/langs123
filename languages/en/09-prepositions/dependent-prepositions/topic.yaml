    role: overview
    content:
      - type: usage
        columns: [{ key: "form", label: { en: "Pattern" } }, { key: "ex", label: { en: "Example" } }]
        rows:
          - { level: "B2", form: { pattern: [{ slot: "verb" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, ex: ["I ", { target: "depend on" }, " my parents."] }
          - { level: "B2", form: { pattern: [{ slot: "adjective" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, ex: ["She is ", { target: "afraid of" }, " spiders."] }
          - { level: "B2", form: { pattern: [{ slot: "noun" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, ex: ["What is the ", { target: "reason for" }, " the delay?"] }
      - type: usage
        columns: [{ key: "follows", label: { en: "After the preposition" } }, { key: "ex", label: { en: "Example" } }]
        rows:
          - { level: "B2", follows: { en: "a noun" }, ex: ["She is interested ", { target: "in music" }, "."] }
          - { level: "B2", follows: { en: "a pronoun in the object form" }, ex: ["Wait ", { target: "for me" }, ", please."] }
          - { level: "B2", follows: { en: ["an ", { term: "-ing" }, " form"] }, ex: ["She insisted ", { target: "on paying" }, "."] }
      - type: usage
        columns: [{ key: "where", label: { en: "The preposition stays with its verb in" } }, { key: "ex", label: { en: "Example" } }]
        rows:
          - { level: "B2", where: { en: "a question" }, ex: ["What are you ", { target: "waiting for" }, "?"] }
          - { level: "B2", where: { en: "a relative clause" }, ex: ["This is the girl I ", { target: "spoke to" }, "."] }
          - { level: "B2", where: { en: "a passive" }, ex: ["The problem was ", { target: "dealt with" }, " quickly."] }
      - type: list
        items:
          - { type: "note", level: "B2", text: { en: ["A particle that changes the meaning, as in ", { term: "look up" }, ", makes a phrasal verb. See ", { link: "Phrasal Verbs: Core", to: "en.verbs.phrasal-verbs-core" }, "."] } }
          - { type: "note", level: "B2", text: { en: ["Verbs that take ", { term: "-ing" }, " or a ", { term: "to" }, "-infinitive directly are in ", { link: "Gerund vs Infinitive", to: "en.verbs.gerund-vs-infinitive" }, "."] } }

