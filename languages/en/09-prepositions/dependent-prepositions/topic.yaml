          - { type: "note", level: "B2", text: { en: ["A particle that changes the meaning, as in ", { term: "look up" }, ", makes a phrasal verb. See ", { link: "Phrasal Verbs", to: "en.verbs.phrasal-verbs-core" }, "."], uk: ["Частка, що змінює значення, як у ", { term: "look up" }, ", утворює фразове дієслово. Див. ", { link: "Фразові дієслова", to: "en.verbs.phrasal-verbs-core" }, "."], es: ["Una partícula que cambia el significado, como en ", { term: "look up" }, ", forma un phrasal verb. Consulta ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], pt: ["Uma partícula que muda o significado, como em ", { term: "look up" }, ", forma um phrasal verb. Veja ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], fr: ["Une particule qui change le sens, comme dans ", { term: "look up" }, ", forme un phrasal verb. Voir ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], de: ["Eine Partikel, die die Bedeutung ändert, wie in ", { term: "look up" }, ", bildet ein Phrasal Verb. Siehe ", { link: "Phrasal Verbs", to: "en.verbs.phrasal-verbs-core" }, "."], it: ["Una particella che cambia il significato, come in ", { term: "look up" }, ", forma un phrasal verb. Vedi ", { link: "Phrasal verb", to: "en.verbs.phrasal-verbs-core" }, "."], pl: ["Partykuła zmieniająca znaczenie, jak w ", { term: "look up" }, ", tworzy czasownik frazowy. Zob. ", { link: "Czasowniki frazowe", to: "en.verbs.phrasal-verbs-core" }, "."], tr: ["Anlamı değiştiren bir parçacık, ", { term: "look up" }, " örneğindeki gibi, phrasal verb oluşturur. Bkz. ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], id: ["Partikel yang mengubah arti, seperti pada ", { term: "look up" }, ", membentuk phrasal verb. Lihat ", { link: "Phrasal verb", to: "en.verbs.phrasal-verbs-core" }, "."], vi: ["Tiểu từ làm đổi nghĩa, như trong ", { term: "look up" }, ", tạo thành một cụm động từ. Xem ", { link: "Cụm động từ", to: "en.verbs.phrasal-verbs-core" }, "."] } }
          - { type: "note", level: "B2", text: { en: ["Verbs that take ", { term: "-ing" }, " or a ", { term: "to" }, "-infinitive directly are in ", { link: "Gerund vs Infinitive", to: "en.verbs.gerund-vs-infinitive" }, "."], uk: ["Дієслова, після яких одразу стоїть ", { term: "-ing" }, " або інфінітив із ", { term: "to" }, ": див. ", { link: "Герундій чи інфінітив", to: "en.verbs.gerund-vs-infinitive" }, "."], es: ["Los verbos que llevan directamente ", { term: "-ing" }, " o un infinitivo con ", { term: "to" }, " están en ", { link: "Gerundio o infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], pt: ["Os verbos que levam diretamente ", { term: "-ing" }, " ou um infinitivo com ", { term: "to" }, " estão em ", { link: "Gerúndio ou infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], fr: ["Les verbes suivis directement de ", { term: "-ing" }, " ou d’un infinitif en ", { term: "to" }, " sont dans ", { link: "Forme en -ing ou infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], de: ["Verben mit direktem ", { term: "-ing" }, " oder ", { term: "to" }, "-Infinitiv stehen in ", { link: "Gerund oder Infinitiv", to: "en.verbs.gerund-vs-infinitive" }, "."], it: ["I verbi seguiti direttamente da ", { term: "-ing" }, " o da un infinito con ", { term: "to" }, " sono in ", { link: "Gerundio o infinito", to: "en.verbs.gerund-vs-infinitive" }, "."], pl: ["Czasowniki, po których od razu występuje ", { term: "-ing" }, " lub bezokolicznik z ", { term: "to" }, ": zob. ", { link: "Gerund czy bezokolicznik", to: "en.verbs.gerund-vs-infinitive" }, "."], tr: ["Doğrudan ", { term: "-ing" }, " ya da ", { term: "to" }, " ile mastar alan fiiller: bkz. ", { link: "Gerund mu, mastar mı", to: "en.verbs.gerund-vs-infinitive" }, "."], id: ["Kata kerja yang langsung diikuti ", { term: "-ing" }, " atau infinitif dengan ", { term: "to" }, " ada di ", { link: "Gerund atau infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], vi: ["Các động từ đi thẳng với ", { term: "-ing" }, " hoặc động từ nguyên mẫu có ", { term: "to" }, " nằm trong ", { link: "Danh động từ hay động từ nguyên mẫu", to: "en.verbs.gerund-vs-infinitive" }, "."] } }

