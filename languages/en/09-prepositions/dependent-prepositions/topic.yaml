          - { level: "C1", form: "different to", meaning: { en: ["the British form beside ", { term: "different from" }], uk: ["британська форма поряд із ", { term: "different from" }], es: ["la forma británica junto a ", { term: "different from" }], pt: ["a forma britânica ao lado de ", { term: "different from" }], fr: ["la forme britannique à côté de ", { term: "different from" }], de: ["die britische Form neben ", { term: "different from" }], it: ["la forma britannica accanto a ", { term: "different from" }], pl: ["forma brytyjska obok ", { term: "different from" }], tr: [{ term: "different from" }, " yanında kullanılan İngiliz biçimi"], id: ["bentuk Inggris di samping ", { term: "different from" }], vi: ["dạng của Anh bên cạnh ", { term: "different from" }] }, ex: ["My phone is ", { target: "different to" }, " yours. ", { variant: { target: "different than" }, variety: "en-US" }], tr: { uk: "Мій телефон відрізняється від твого.", es: "Mi celular es diferente del tuyo.", pt: "Meu celular é diferente do seu.", fr: "Mon téléphone est différent du tien.", de: "Mein Handy ist anders als deins.", it: "Il mio telefono è diverso dal tuo.", pl: "Mój telefon różni się od twojego.", tr: "Benim telefonum seninkinden farklı.", id: "Ponsel saya berbeda dari ponselmu.", vi: "Điện thoại của tôi khác điện thoại của bạn." } }
          - { level: "C1", form: "compared to", meaning: { en: "say that two things are alike", uk: "казати, що дві речі схожі", es: "decir que dos cosas son parecidas", pt: "dizer que duas coisas são parecidas", fr: "dire que deux choses se ressemblent", de: "sagen, dass zwei Dinge sich ähneln", it: "dire che due cose sono simili", pl: "mówić, że dwie rzeczy są podobne", tr: "iki şeyin benzer olduğunu söylemek", id: "mengatakan bahwa dua hal serupa", vi: "nói rằng hai thứ giống nhau" }, ex: ["He ", { target: "compared" }, " her voice ", { target: "to" }, " velvet."], tr: { uk: "Він порівняв її голос з оксамитом.", es: "Él comparó su voz con el terciopelo.", pt: "Ele comparou a voz dela a veludo.", fr: "Il a comparé sa voix à du velours.", de: "Er verglich ihre Stimme mit Samt.", it: "Lui ha paragonato la sua voce al velluto.", pl: "Porównał jej głos do aksamitu.", tr: "Onun sesini kadifeye benzetti.", id: "Dia membandingkan suaranya dengan beludru.", vi: "Anh ấy ví giọng cô ấy như nhung." } }
          - { level: "C1", form: "compared with", meaning: { en: "examine how two things differ", uk: "дивитися, чим відрізняються дві речі", es: "examinar en qué se diferencian dos cosas", pt: "examinar em que duas coisas diferem", fr: "examiner en quoi deux choses diffèrent", de: "prüfen, wie sich zwei Dinge unterscheiden", it: "esaminare in che cosa due cose differiscono", pl: "sprawdzać, czym różnią się dwie rzeczy", tr: "iki şeyin nasıl farklılaştığını incelemek", id: "memeriksa perbedaan dua hal", vi: "xem hai thứ khác nhau ở đâu" }, ex: [{ target: "Compared with" }, " Paris, London is bigger."], tr: { uk: "Порівняно з Парижем Лондон більший.", es: "Comparado con París, Londres es más grande.", pt: "Comparado com Paris, Londres é maior.", fr: "Comparé à Paris, Londres est plus grand.", de: "Im Vergleich zu Paris ist London größer.", it: "Rispetto a Parigi, Londra è più grande.", pl: "W porównaniu z Paryżem Londyn jest większy.", tr: "Paris’le karşılaştırıldığında Londra daha büyüktür.", id: "Dibandingkan dengan Paris, London lebih besar.", vi: "So với Paris, London lớn hơn." } }
          - { level: "C1", form: "prefer X to Y", meaning: { en: [{ term: "to" }, " joins the two things, also before ", { term: "-ing" }, " forms"], uk: [{ term: "to" }, " поєднує дві речі, зокрема й перед формами на ", { term: "-ing" }], es: [{ term: "to" }, " une las dos cosas, también ante formas en ", { term: "-ing" }], pt: [{ term: "to" }, " liga as duas coisas, também diante de formas com ", { term: "-ing" }], fr: [{ term: "to" }, " relie les deux éléments, y compris devant une forme en ", { term: "-ing" }], de: [{ term: "to" }, " verbindet die beiden Dinge, auch vor ", { term: "-ing" }, "-Formen"], it: [{ term: "to" }, " collega le due cose, anche davanti a forme in ", { term: "-ing" }], pl: [{ term: "to" }, " łączy obie rzeczy, także przed formami ", { term: "-ing" }], tr: [{ term: "to" }, " iki şeyi birbirine bağlar, ", { term: "-ing" }, " biçimlerinden önce de"], id: [{ term: "to" }, " menghubungkan kedua hal itu, juga sebelum bentuk ", { term: "-ing" }], vi: [{ term: "to" }, " nối hai vế, kể cả trước dạng ", { term: "-ing" }] }, ex: { examples: [["I ", { target: "prefer" }, " tea ", { target: "to" }, " coffee."], ["She ", { target: "prefers" }, " walking ", { target: "to" }, " driving."]] }, tr: { uk: { examples: ["Я віддаю перевагу чаю над кавою.", "Вона віддає перевагу ходьбі перед водінням."] }, es: { examples: ["Prefiero el té al café.", "Ella prefiere caminar a manejar."] }, pt: { examples: ["Prefiro chá a café.", "Ela prefere caminhar a dirigir."] }, fr: { examples: ["Je préfère le thé au café.", "Elle préfère marcher plutôt que conduire."] }, de: { examples: ["Ich trinke lieber Tee als Kaffee.", "Sie geht lieber zu Fuß, als zu fahren."] }, it: { examples: ["Preferisco il tè al caffè.", "Lei preferisce camminare a guidare."] }, pl: { examples: ["Wolę herbatę od kawy.", "Ona woli chodzić pieszo, niż jeździć samochodem."] }, tr: { examples: ["Çayı kahveye tercih ederim.", "Yürümeyi araba kullanmaya tercih eder."] }, id: { examples: ["Saya lebih suka teh daripada kopi.", "Dia lebih suka berjalan kaki daripada menyetir."] }, vi: { examples: ["Tôi thích trà hơn cà phê.", "Cô ấy thích đi bộ hơn lái xe."] } } }
          - { level: "C1", form: "protect against", meaning: { en: ["guard in advance against a risk; ", { term: "protect from" }, " names a danger already there"], uk: ["оберігати наперед від ризику; ", { term: "protect from" }, " називає небезпеку, що вже існує"], es: ["proteger de antemano contra un riesgo; ", { term: "protect from" }, " nombra un peligro que ya existe"], pt: ["proteger de antemão contra um risco; ", { term: "protect from" }, " indica um perigo que já existe"], fr: ["se prémunir à l’avance contre un risque ; ", { term: "protect from" }, " désigne un danger déjà présent"], de: ["sich im Voraus gegen ein Risiko schützen; ", { term: "protect from" }, " nennt eine schon bestehende Gefahr"], it: ["proteggere in anticipo da un rischio; ", { term: "protect from" }, " indica un pericolo già presente"], pl: ["chronić z wyprzedzeniem przed ryzykiem; ", { term: "protect from" }, " wskazuje zagrożenie, które już istnieje"], tr: ["bir riske karşı önceden korumak; ", { term: "protect from" }, " zaten var olan bir tehlikeyi belirtir"], id: ["melindungi lebih dulu dari suatu risiko; ", { term: "protect from" }, " menyebut bahaya yang sudah ada"], vi: ["bảo vệ trước một rủi ro; ", { term: "protect from" }, " nói về mối nguy đã có sẵn"] }, ex: ["Vaccines ", { target: "protect" }, " children ", { target: "against" }, " disease."], tr: { uk: "Вакцини захищають дітей від хвороб.", es: "Las vacunas protegen a los niños contra las enfermedades.", pt: "As vacinas protegem as crianças contra doenças.", fr: "Les vaccins protègent les enfants contre les maladies.", de: "Impfstoffe schützen Kinder vor Krankheiten.", it: "I vaccini proteggono i bambini dalle malattie.", pl: "Szczepionki chronią dzieci przed chorobami.", tr: "Aşılar çocukları hastalıklara karşı korur.", id: "Vaksin melindungi anak-anak dari penyakit.", vi: "Vắc-xin bảo vệ trẻ em khỏi bệnh tật." } }
          - { level: "C1", form: "responsible to", meaning: { en: ["answering to the person above you; the task takes ", { term: "for" }], uk: ["відповідати перед керівником; завдання вимагає ", { term: "for" }], es: ["rendir cuentas a la persona que está por encima de ti; la tarea lleva ", { term: "for" }], pt: ["prestar contas à pessoa acima de você; a tarefa leva ", { term: "for" }], fr: ["rendre des comptes à la personne au-dessus de soi ; la tâche prend ", { term: "for" }], de: ["gegenüber der vorgesetzten Person Rechenschaft ablegen; die Aufgabe steht mit ", { term: "for" }], it: ["rispondere alla persona che sta sopra di te; il compito vuole ", { term: "for" }], pl: ["odpowiadać przed przełożonym; zadanie łączy się z ", { term: "for" }], tr: ["üstündeki kişiye hesap vermek; görev ", { term: "for" }, " alır"], id: ["bertanggung jawab kepada atasan; tugas memakai ", { term: "for" }], vi: ["chịu trách nhiệm trước người cấp trên; nhiệm vụ đi với ", { term: "for" }] }, ex: ["He is ", { target: "responsible to" }, " the manager."], tr: { uk: "Він підзвітний менеджеру.", es: "Él responde ante el gerente.", pt: "Ele responde ao gerente.", fr: "Il rend des comptes au directeur.", de: "Er ist dem Chef unterstellt.", it: "Risponde al direttore.", pl: "Podlega kierownikowi.", tr: "Müdüre karşı sorumludur.", id: "Dia bertanggung jawab kepada manajer.", vi: "Anh ấy chịu trách nhiệm trước quản lý." } }
          - { level: "C1", form: "angry at", meaning: { en: ["a person or a thing in the moment; ", { term: "with" }, " takes a person, ", { term: "about" }, " a situation"], uk: ["людина чи річ у певну мить; ", { term: "with" }, " стосується людини, ", { term: "about" }, " — ситуації"], es: ["una persona o una cosa en el momento; ", { term: "with" }, " lleva una persona, ", { term: "about" }, " una situación"], pt: ["uma pessoa ou uma coisa no momento; ", { term: "with" }, " vai com uma pessoa, ", { term: "about" }, " com uma situação"], fr: ["une personne ou une chose sur le moment ; ", { term: "with" }, " s’emploie avec une personne, ", { term: "about" }, " avec une situation"], de: ["eine Person oder Sache im Augenblick; ", { term: "with" }, " steht bei einer Person, ", { term: "about" }, " bei einer Situation"], it: ["una persona o una cosa sul momento; ", { term: "with" }, " si usa con una persona, ", { term: "about" }, " con una situazione"], pl: ["osoba lub rzecz w danej chwili; ", { term: "with" }, " łączy się z osobą, ", { term: "about" }, " z sytuacją"], tr: ["o anda bir kişi ya da şey; ", { term: "with" }, " kişiyle, ", { term: "about" }, " bir durumla kullanılır"], id: ["seseorang atau sesuatu pada saat itu; ", { term: "with" }, " untuk orang, ", { term: "about" }, " untuk keadaan"], vi: ["một người hay một vật ngay lúc đó; ", { term: "with" }, " đi với người, ", { term: "about" }, " đi với một tình huống"] }, ex: ["She was ", { target: "angry at" }, " the waiter."], tr: { uk: "Вона розсердилася на офіціанта.", es: "Ella se enojó con el mesero.", pt: "Ela ficou brava com o garçom.", fr: "Elle était en colère contre le serveur.", de: "Sie war wütend auf den Kellner.", it: "Lei era arrabbiata con il cameriere.", pl: "Była zła na kelnera.", tr: "Garsona kızmıştı.", id: "Dia marah pada pelayan itu.", vi: "Cô ấy giận người phục vụ." } }
          - { level: "C1", form: "good for", meaning: { en: "helpful to a person or a thing", uk: "корисний для людини чи речі", es: "beneficioso para una persona o una cosa", pt: "benéfico para uma pessoa ou uma coisa", fr: "bénéfique pour une personne ou une chose", de: "nützlich für eine Person oder Sache", it: "utile a una persona o a una cosa", pl: "korzystny dla osoby lub rzeczy", tr: "bir kişi ya da şey için yararlı", id: "bermanfaat bagi orang atau benda", vi: "có ích cho người hay vật" }, ex: ["Exercise is ", { target: "good for" }, " you."], tr: { uk: "Фізичні вправи корисні для тебе.", es: "El ejercicio es bueno para ti.", pt: "O exercício faz bem para você.", fr: "L’exercice est bon pour toi.", de: "Bewegung ist gut für dich.", it: "L'esercizio fisico ti fa bene.", pl: "Ćwiczenia są dla ciebie dobre.", tr: "Egzersiz sana iyi gelir.", id: "Olahraga baik untukmu.", vi: "Tập thể dục tốt cho bạn." } }
          - { level: "C1", form: "good to", meaning: { en: "kind to a person", uk: "добрий до людини", es: "amable con una persona", pt: "gentil com uma pessoa", fr: "gentil avec une personne", de: "freundlich zu einer Person", it: "gentile con una persona", pl: "życzliwy wobec osoby", tr: "bir kişiye karşı nazik", id: "ramah kepada seseorang", vi: "tử tế với một người" }, ex: ["She was always ", { target: "good to" }, " her staff."], tr: { uk: "Вона завжди добре ставилася до своїх працівників.", es: "Ella siempre fue buena con su personal.", pt: "Ela sempre foi boa com os funcionários dela.", fr: "Elle a toujours été bienveillante avec son personnel.", de: "Sie war immer gut zu ihren Mitarbeitern.", it: "Lei è sempre stata gentile con il suo personale.", pl: "Zawsze była dobra dla swoich pracowników.", tr: "Çalışanlarına her zaman iyi davranırdı.", id: "Dia selalu baik kepada stafnya.", vi: "Cô ấy luôn tốt với nhân viên của mình." } }
          - { level: "C1", form: "sorry for", meaning: { en: "your own action, or pity for a person", uk: "власний вчинок або жаль до людини", es: "una acción propia, o lástima por una persona", pt: "uma ação própria, ou pena de uma pessoa", fr: "un acte personnel, ou la pitié pour quelqu’un", de: "die eigene Handlung oder Mitleid mit einer Person", it: "una propria azione, o pietà per una persona", pl: "własny czyn lub współczucie dla osoby", tr: "kendi eylemin ya da bir kişiye acıma", id: "tindakan sendiri, atau rasa kasihan pada seseorang", vi: "việc mình làm, hoặc thương hại một người" }, ex: { examples: [["I'm ", { target: "sorry for" }, " the noise."], ["I feel ", { target: "sorry for" }, " him."]] }, tr: { uk: { examples: ["Перепрошую за шум.", "Мені його шкода."] }, es: { examples: ["Perdón por el ruido.", "Siento lástima por él."] }, pt: { examples: ["Desculpe pelo barulho.", "Sinto pena dele."] }, fr: { examples: ["Je suis désolé pour le bruit.", "Il me fait pitié."] }, de: { examples: ["Es tut mir leid wegen des Lärms.", "Er tut mir leid."] }, it: { examples: ["Mi dispiace per il rumore.", "Mi dispiace per lui."] }, pl: { examples: ["Przepraszam za hałas.", "Jest mi go żal."] }, tr: { examples: ["Gürültü için özür dilerim.", "Ona üzülüyorum."] }, id: { examples: ["Maaf atas kebisingannya.", "Saya kasihan padanya."] }, vi: { examples: ["Tôi xin lỗi vì tiếng ồn.", "Tôi thấy thương anh ấy."] } } }
          - { level: "C1", form: "sorry about", meaning: { en: "a situation or some news", uk: "ситуація або новина", es: "una situación o una noticia", pt: "uma situação ou uma notícia", fr: "une situation ou une nouvelle", de: "eine Situation oder eine Nachricht", it: "una situazione o una notizia", pl: "sytuacja lub wiadomość", tr: "bir durum ya da bir haber", id: "suatu keadaan atau kabar", vi: "một tình huống hoặc một tin tức" }, ex: ["I'm ", { target: "sorry about" }, " your job."], tr: { uk: "Мені шкода твоєї роботи.", es: "Lamento lo de tu trabajo.", pt: "Sinto muito pelo seu emprego.", fr: "Je suis désolé pour ton travail.", de: "Es tut mir leid um deinen Job.", it: "Mi dispiace per il tuo lavoro.", pl: "Przykro mi z powodu twojej pracy.", tr: "İşin için üzgünüm.", id: "Saya turut menyesal soal pekerjaanmu.", vi: "Tôi rất tiếc về công việc của bạn." } }
          - { level: "C1", form: "grateful to", meaning: { en: "the person who helped", uk: "людина, яка допомогла", es: "la persona que ayudó", pt: "a pessoa que ajudou", fr: "la personne qui a aidé", de: "die Person, die geholfen hat", it: "la persona che ha aiutato", pl: "osoba, która pomogła", tr: "yardım eden kişi", id: "orang yang membantu", vi: "người đã giúp đỡ" }, ex: ["I'm ", { target: "grateful to" }, " my teacher."], tr: { uk: "Я вдячний своєму вчителеві.", es: "Estoy agradecido con mi maestro.", pt: "Sou grato ao meu professor.", fr: "Je suis reconnaissant envers mon professeur.", de: "Ich bin meinem Lehrer dankbar.", it: "Sono grato al mio insegnante.", pl: "Jestem wdzięczny mojemu nauczycielowi.", tr: "Öğretmenime minnettarım.", id: "Saya berterima kasih kepada guru saya.", vi: "Tôi biết ơn thầy giáo của mình." } }
          - { level: "C1", form: "grateful for", meaning: { en: "the help or the gift", uk: "допомога або подарунок", es: "la ayuda o el regalo", pt: "a ajuda ou o presente", fr: "l’aide ou le cadeau", de: "die Hilfe oder das Geschenk", it: "l'aiuto o il regalo", pl: "pomoc lub prezent", tr: "yardım ya da hediye", id: "bantuan atau hadiah", vi: "sự giúp đỡ hoặc món quà" }, ex: ["I'm ", { target: "grateful for" }, " your help."], tr: { uk: "Я вдячний за твою допомогу.", es: "Estoy agradecido por tu ayuda.", pt: "Sou grato pela sua ajuda.", fr: "Je te suis reconnaissant de ton aide.", de: "Ich bin dir für deine Hilfe dankbar.", it: "Sono grato per il tuo aiuto.", pl: "Jestem wdzięczny za twoją pomoc.", tr: "Yardımın için minnettarım.", id: "Saya bersyukur atas bantuanmu.", vi: "Tôi biết ơn sự giúp đỡ của bạn." } }
          - { level: "C1", form: "typical of", meaning: { en: "characteristic of a person or a group", uk: "характерний для людини чи групи", es: "característico de una persona o un grupo", pt: "característico de uma pessoa ou de um grupo", fr: "caractéristique d’une personne ou d’un groupe", de: "kennzeichnend für eine Person oder Gruppe", it: "caratteristico di una persona o di un gruppo", pl: "charakterystyczny dla osoby lub grupy", tr: "bir kişinin ya da grubun özelliği olan", id: "ciri khas seseorang atau suatu kelompok", vi: "đặc trưng của một người hay một nhóm" }, ex: ["Late arrival is ", { target: "typical of" }, " him."], tr: { uk: "Запізнення — типове для нього.", es: "Llegar tarde es típico de él.", pt: "Chegar atrasado é típico dele.", fr: "Arriver en retard, c’est typique de lui.", de: "Zu spät zu kommen ist typisch für ihn.", it: "Arrivare in ritardo è tipico di lui.", pl: "Spóźnianie się jest dla niego typowe.", tr: "Geç gelmek onun tipik bir özelliği.", id: "Datang terlambat itu khas dirinya.", vi: "Đến muộn là điều đặc trưng của anh ấy." } }

  - title: { en: "Abstract and academic nouns with a preposition", uk: "Абстрактні й академічні іменники з прийменником", es: "Sustantivos abstractos y académicos con preposición", pt: "Substantivos abstratos e acadêmicos com preposição", fr: "Noms abstraits et académiques avec préposition", de: "Abstrakte und akademische Nomen mit Präposition", it: "Sostantivi astratti e accademici con preposizione", pl: "Rzeczowniki abstrakcyjne i akademickie z przyimkiem", tr: "Edatlı soyut ve akademik isimler", id: "Kata benda abstrak dan akademik dengan kata depan", vi: "Danh từ trừu tượng và học thuật đi với giới từ" }
