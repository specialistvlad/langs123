# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.prepositions.dependent-prepositions
lang: en
kind: grammar
tags: [prepositions, dependent-prepositions, verbs, adjectives, nouns]
concepts: [governed-prepositions]
related: [en.verbs.gerund-vs-infinitive, en.verbs.phrasal-verbs-core, en.adjectives-adverbs.adjective-order, en.prepositions.place-movement, en.prepositions.time-in-on-at]
status: { en: draft }

title: { en: "Dependent Prepositions" }
summary:
  lead:
    en: ["Many verbs, adjectives and nouns take one fixed preposition, as in ", { term: "depend on" }, ", ", { term: "afraid of" }, " and ", { term: "reason for" }, "."]
  rule:
    en: ["A noun, an object pronoun or an ", { term: "-ing" }, " form follows the preposition:"]
  ex: { examples: [["wait ", { target: "for me" }], ["insist ", { target: "on paying" }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns: [{ key: "point", label: { en: "Point" } }, { key: "rule", label: { en: "Rule" } }, { key: "ex", label: { en: "Example" } }]
      rows:
        - { level: "B2", point: { en: "Verb" }, rule: { en: [{ pattern: [{ slot: "verb" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, "; the verb selects the preposition"] }, ex: ["I ", { target: "depend on" }, " my parents."] }
        - { level: "B2", point: { en: "Adjective" }, rule: { en: [{ pattern: [{ slot: "adjective" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, "; learn the pair"] }, ex: ["She is ", { target: "afraid of" }, " spiders."] }
        - { level: "B2", point: { en: "Noun" }, rule: { en: [{ pattern: [{ slot: "noun" }, { slot: { en: "preposition" } }, { slot: "noun" }] }, "; learn the pair"] }, ex: ["What is the ", { target: "reason for" }, " the delay?"] }
        - { level: "B2", point: { en: "After the preposition" }, rule: { en: ["a noun, an object pronoun or an ", { term: "-ing" }, " form"] }, ex: ["She insisted ", { target: "on paying" }, "."] }
        - { level: "B2", point: { en: "Questions and passives" }, rule: { en: "the preposition stays with its verb" }, ex: ["What are you ", { target: "waiting for" }, "?"] }
        - { level: "B2", point: { en: "Two prepositions" }, rule: { en: "the preposition changes the meaning" }, ex: { examples: [["I'm ", { target: "looking for" }, " a map."], ["She ", { target: "looks after" }, " her brother."]] } }
        - { level: "C1", point: { en: "Participles" }, rule: { en: ["participles take fixed prepositions; ", { term: "-ing" }, " follows ", { term: "committed to" }] }, ex: { examples: [["The film is ", { target: "based on" }, " a true story."], ["We are ", { target: "committed to" }, " helping."]] } }
        - { level: "C1", point: { en: "Finer contrasts" }, rule: { en: ["one word, two meanings: ", { term: "responsible for" }, " a task, ", { term: "responsible to" }, " a person"] }, ex: { examples: [["He is ", { target: "responsible to" }, " the manager."], ["I ", { target: "prefer" }, " tea ", { target: "to" }, " coffee."]] } }
        - { level: "C1", point: { en: "Academic nouns" }, rule: { en: "abstract nouns keep one preposition each" }, ex: { examples: [["the ", { target: "impact on" }, " small shops"], ["a ", { target: "link between" }, " sleep and memory"]] } }
        - { level: "C1", point: { en: "Formal verbs" }, rule: { en: "formal verbs take fixed prepositions" }, ex: { examples: [["Staff must ", { target: "comply with" }, " the rules."], ["Costs ", { target: "amount to" }, " ten thousand pounds."]] } }
        - { level: "B2", point: { en: "Trap" }, rule: { en: [{ term: "discuss" }, ", ", { term: "mention" }, ", ", { term: "enter" }, " and ", { term: "attend" }, " take no preposition"] }, ex: ["We ", { target: "discussed" }, " the plan."] }
        - { level: "C1", point: { en: "Trap" }, rule: { en: [{ term: "comprise" }, " and ", { term: "emphasise" }, " take no preposition"] }, ex: ["The course ", { target: "comprises" }, " six units."] }

sections:
