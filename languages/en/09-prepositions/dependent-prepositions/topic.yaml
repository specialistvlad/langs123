          - { level: "C1", form: "prefer X to Y", meaning: { en: [{ term: "to" }, " joins the two things, also before ", { term: "-ing" }, " forms"] }, ex: { examples: [["I ", { target: "prefer" }, " tea ", { target: "to" }, " coffee."], ["She ", { target: "prefers" }, " walking ", { target: "to" }, " driving."]] } }
