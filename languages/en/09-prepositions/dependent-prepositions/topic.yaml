          - { level: "B2", form: { pattern: ["discourage", { slot: "person" }, "from", { slot: "V-ing" }] }, ex: ["The cost ", { target: "discouraged" }, " her ", { target: "from going" }, "."] }

  - title: { en: "Participles and passives with a preposition" }
