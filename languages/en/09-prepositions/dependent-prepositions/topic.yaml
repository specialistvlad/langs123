        - { level: "C1", point: { en: "Formal verbs", uk: "Формальні дієслова", es: "Verbos formales", pt: "Verbos formais", fr: "Verbes soutenus", de: "Förmliche Verben", it: "Verbi formali", pl: "Czasowniki formalne", tr: "Resmî fiiller", id: "Kata kerja formal", vi: "Động từ trang trọng" }, rule: { en: "formal verbs take fixed prepositions", uk: "формальні дієслова мають усталені прийменники", es: "los verbos formales llevan preposiciones fijas", pt: "os verbos formais levam preposições fixas", fr: "les verbes soutenus prennent des prépositions fixes", de: "förmliche Verben haben feste Präpositionen", it: "i verbi formali hanno preposizioni fisse", pl: "czasowniki formalne mają stałe przyimki", tr: "resmî fiiller sabit edatlarla kullanılır", id: "kata kerja formal memakai kata depan tetap", vi: "động từ trang trọng đi với giới từ cố định" }, ex: { examples: [["Staff must ", { target: "comply with" }, " the rules."], ["Costs ", { target: "amount to" }, " ten thousand pounds."]] }, tr: { uk: { examples: ["Працівники повинні дотримуватися правил.", "Витрати становлять десять тисяч фунтів."] }, es: { examples: ["El personal debe cumplir las reglas.", "Los costos ascienden a diez mil libras."] }, pt: { examples: ["Os funcionários devem cumprir as regras.", "Os custos chegam a dez mil libras."] }, fr: { examples: ["Le personnel doit respecter le règlement.", "Les coûts s’élèvent à dix mille livres."] }, de: { examples: ["Das Personal muss die Regeln einhalten.", "Die Kosten belaufen sich auf zehntausend Pfund."] }, it: { examples: ["Il personale deve rispettare le regole.", "I costi ammontano a diecimila sterline."] }, pl: { examples: ["Pracownicy muszą przestrzegać przepisów.", "Koszty wynoszą dziesięć tysięcy funtów."] }, tr: { examples: ["Personel kurallara uymak zorundadır.", "Maliyet on bin sterlini bulur."] }, id: { examples: ["Staf harus menaati aturan.", "Biayanya mencapai sepuluh ribu pound."] }, vi: { examples: ["Nhân viên phải tuân thủ các quy định.", "Chi p