summary:
  lead:
    en: ["Many verbs, adjectives and nouns take one fixed preposition, as in ", { term: "depend on" }, ", ", { term: "afraid of" }, " and ", { term: "reason for" }, "."]
    uk: ["Багато дієслів, прикметників та іменників вживаються з одним усталеним прийменником, як-от ", { term: "depend on" }, ", ", { term: "afraid of" }, " і ", { term: "reason for" }, "."]
    es: ["Muchos verbos, adjetivos y sustantivos llevan una preposición fija, como en ", { term: "depend on" }, ", ", { term: "afraid of" }, " y ", { term: "reason for" }, "."]
    pt: ["Muitos verbos, adjetivos e substantivos levam uma preposição fixa, como em ", { term: "depend on" }, ", ", { term: "afraid of" }, " e ", { term: "reason for" }, "."]
    fr: ["De nombreux verbes, adjectifs et noms se construisent avec une préposition fixe, comme dans ", { term: "depend on" }, ", ", { term: "afraid of" }, " et ", { term: "reason for" }, "."]
    de: ["Viele Verben, Adjektive und Nomen stehen mit einer festen Präposition, etwa ", { term: "depend on" }, ", ", { term: "afraid of" }, " und ", { term: "reason for" }, "."]
    it: ["Molti verbi, aggettivi e sostantivi vogliono una preposizione fissa, come in ", { term: "depend on" }, ", ", { term: "afraid of" }, " e ", { term: "reason for" }, "."]
    pl: ["Wiele czasowników, przymiotników i rzeczowników łączy się z jednym stałym przyimkiem, np. ", { term: "depend on" }, ", ", { term: "afraid of" }, " i ", { term: "reason for" }, "."]
    tr: ["Pek çok fiil, sıfat ve isim tek bir sabit edatla kullanılır: ", { term: "depend on" }, ", ", { term: "afraid of" }, " ve ", { term: "reason for" }, " gibi."]
    id: ["Banyak kata kerja, kata sifat, dan kata benda memakai satu kata depan yang tetap, seperti ", { term: "depend on" }, ", ", { term: "afraid of" }, ", dan ", { term: "reason for" }, "."]
    vi: ["Nhiều động từ, tính từ và danh từ đi với một giới từ cố định, như ", { term: "depend on" }, ", ", { term: "afraid of" }, " và ", { term: "reason for" }, "."]
  rule:
    en: ["A noun, an object pronoun or an ", { term: "-ing" }, " form follows the preposition:"]
    uk: ["Після прийменника стоїть іменник, займенник у формі додатка або форма на ", { term: "-ing" }, ":"]
    es: ["Después de la preposición va un sustantivo, un pronombre de objeto o una forma en ", { term: "-ing" }, ":"]
    pt: ["Depois da preposição vem um substantivo, um pronome de objeto ou uma forma com ", { term: "-ing" }, ":"]
    fr: ["Après la préposition viennent un nom, un pronom complément ou une forme en ", { term: "-ing" }, " :"]
    de: ["Nach der Präposition steht ein Nomen, ein Objektpronomen oder eine ", { term: "-ing" }, "-Form:"]
    it: ["Dopo la preposizione vengono un sostantivo, un pronome complemento o una forma in ", { term: "-ing" }, ":"]
    pl: ["Po przyimku stoi rzeczownik, zaimek w formie dopełnienia lub forma ", { term: "-ing" }, ":"]
    tr: ["Edattan sonra bir isim, nesne zamiri ya da ", { term: "-ing" }, " biçimi gelir:"]
    id: ["Setelah kata depan datang kata benda, kata ganti objek, atau bentuk ", { term: "-ing" }, ":"]
    vi: ["Sau giới từ là một danh từ, một đại từ tân ngữ hoặc dạng ", { term: "-ing" }, ":"]
  ex: { examples: [["wait ", { target: "for me" }], ["insist ", { target: "on paying" }, "."]] }

