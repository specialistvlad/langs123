          - { level: "B2", verb: "refer to", ex: ["She often ", { target: "refers to" }, " her notes."], tr: { uk: "Вона часто заглядає у свої нотатки.", es: "Ella a menudo consulta sus apuntes.", pt: "Ela costuma consultar suas anotações.", fr: "Elle se réfère souvent à ses notes.", de: "Sie schaut oft in ihre Notizen.", it: "Lei si riferisce spesso ai suoi appunti.", pl: "Często zagląda do swoich notatek.", tr: "Sık sık notlarına bakar.", id: "Dia sering merujuk pada catatannya.", vi: "Cô ấy thường xem lại ghi chú của mình." } }
          - { level: "B2", verb: "object to", ex: ["Many residents ", { target: "object to" }, " the new road."], tr: { uk: "Багато мешканців виступають проти нової дороги.", es: "Muchos residentes se oponen a la nueva carretera.", pt: "Muitos moradores são contra a nova estrada.", fr: "De nombreux habitants s’opposent à la nouvelle route.", de: "Viele Anwohner sind gegen die neue Straße.", it: "Molti residenti si oppongono alla nuova strada.", pl: "Wielu mieszkańców sprzeciwia się nowej drodze.", tr: "Birçok sakin yeni yola karşı çıkıyor.", id: "Banyak warga menentang jalan baru itu.", vi: "Nhiều cư dân phản đối con đường mới." } }
          - { level: "B2", verb: "respond to", ex: ["He didn't ", { target: "respond to" }, " my email."], tr: { uk: "Він не відповів на мій електронний лист.", es: "Él no respondió a mi correo.", pt: "Ele não respondeu ao meu e-mail.", fr: "Il n’a pas répondu à mon e-mail.", de: "Er hat auf meine E-Mail nicht geantwortet.", it: "Lui non ha risposto alla mia e-mail.", pl: "Nie odpowiedział na mój e-mail.", tr: "E-postama yanıt vermedi.", id: "Dia tidak membalas email saya.", vi: "Anh ấy không trả lời email của tôi." } }
          - { level: "B2", verb: "lead to", ex: ["Bad sleep ", { target: "leads to" }, " stress."], tr: { uk: "Поганий сон призводить до стресу.", es: "Dormir mal provoca estrés.", pt: "Dormir mal leva ao estresse.", fr: "Un mauvais sommeil mène au stress.", de: "Schlechter Schlaf führt zu Stress.", it: "Dormire male porta allo stress.", pl: "Zły sen prowadzi do stresu.", tr: "Kötü uyku strese yol açar.", id: "Tidur yang buruk menyebabkan stres.", vi: "Ngủ kém dẫn đến căng thẳng." } }
          - { level: "B2", verb: "reply to", ex: ["I must ", { target: "reply to" }, " her letter."], tr: { uk: "Мені треба відповісти на її лист.", es: "Tengo que responder a su carta.", pt: "Preciso responder à carta dela.", fr: "Je dois répondre à sa lettre.", de: "Ich muss auf ihren Brief antworten.", it: "Devo rispondere alla sua lettera.", pl: "Muszę odpisać na jej list.", tr: "Onun mektubuna cevap vermeliyim.", id: "Saya harus membalas suratnya.", vi: "Tôi phải trả lời thư của cô ấy." } }
          - { level: "B2", verb: "happen to", ex: ["What ", { target: "happened to" }, " your arm?"], tr: { uk: "Що сталося з твоєю рукою?", es: "¿Qué le pasó a tu brazo?", pt: "O que aconteceu com o seu braço?", fr: "Qu’est-il arrivé à ton bras ?", de: "Was ist mit deinem Arm passiert?", it: "Che cosa è successo al tuo braccio?", pl: "Co się stało z twoją ręką?", tr: "Koluna ne oldu?", id: "Apa yang terjadi dengan lenganmu?", vi: "Tay bạn bị làm sao vậy?" } }

