          - { level: "B2", verb: "deal with", ex: ["She ", { target: "deals with" }, " customer complaints."], tr: { uk: "Вона розглядає скарги клієнтів.", es: "Ella se encarga de las quejas de los clientes.", pt: "Ela lida com as reclamações dos clientes.", fr: "Elle s’occupe des réclamations des clients.", de: "Sie bearbeitet Kundenbeschwerden.", it: "Lei si occupa dei reclami dei clienti.", pl: "Zajmuje się reklamacjami klientów.", tr: "Müşteri şikâyetleriyle ilgilenir.", id: "Dia menangani keluhan pelanggan.", vi: "Cô ấy xử lý các khiếu nại của khách hàng." } }
          - { level: "B2", verb: "cope with", ex: ["He ", { target: "copes with" }, " stress well."], tr: { uk: "Він добре справляється зі стресом.", es: "Él maneja bien el estrés.", pt: "Ele lida bem com o estresse.", fr: "Il gère bien le stress.", de: "Er geht gut mit Stress um.", it: "Lui gestisce bene lo stress.", pl: "Dobrze radzi sobie ze stresem.", tr: "Stresle iyi başa çıkar.", id: "Dia mampu mengatasi stres dengan baik.", vi: "Anh ấy đối phó với căng thẳng rất tốt." } }
          - { level: "B2", verb: "argue with", ex: ["Don't ", { target: "argue with" }, " your sister."], tr: { uk: "Не сперечайся із сестрою.", es: "No discutas con tu hermana.", pt: "Não discuta com sua irmã.", fr: "Ne te dispute pas avec ta sœur.", de: "Streite nicht mit deiner Schwester.", it: "Non litigare con tua sorella.", pl: "Nie kłóć się z siostrą.", tr: "Kız kardeşinle tartışma.", id: "Jangan bertengkar dengan saudara perempuanmu.", vi: "Đừng cãi nhau với em gái của bạn." } }
          - { level: "B2", verb: "provide someone with", ex: ["The hotel ", { target: "provides" }, " guests ", { target: "with" }, " towels."], tr: { uk: "Готель надає гостям рушники.", es: "El hotel proporciona toallas a los huéspedes.", pt: "O hotel fornece toalhas aos hóspedes.", fr: "L’hôtel fournit des serviettes aux clients.", de: "Das Hotel stellt den Gästen Handtücher zur Verfügung.", it: "L'albergo fornisce asciugamani agli ospiti.", pl: "Hotel zapewnia gościom ręczniki.", tr: "Otel konuklara havlu sağlar.", id: "Hotel menyediakan handuk untuk para tamu.", vi: "Khách sạn cung cấp khăn tắm cho khách." } }
          - { level: "B2", verb: "compare something with", ex: [{ target: "Compare" }, " this price ", { target: "with" }, " that one."], tr: { uk: "Порівняй цю ціну з тією.", es: "Compara este precio con aquel.", pt: "Compare este preço com aquele.", fr: "Compare ce prix avec celui-là.", de: "Vergleiche diesen Preis mit jenem.", it: "Confronta questo prezzo con quello.", pl: "Porównaj tę cenę z tamtą.", tr: "Bu fiyatı şununla karşılaştır.", id: "Bandingkan harga ini dengan yang itu.", vi: "Hãy so sánh giá này với giá kia." } }
          - { level: "B2", verb: "interfere with", ex: ["Noise ", { target: "interferes with" }, " my sleep."], tr: { uk: "Шум заважає мені спати.", es: "El ruido interfiere con mi sueño.", pt: "O barulho atrapalha meu sono.", fr: "Le bruit perturbe mon sommeil.", de: "Lärm stört meinen Schlaf.", it: "Il rumore disturba il mio sonno.", pl: "Hałas zakłóca mi sen.", tr: "Gürültü uykuma engel oluyor.", id: "Kebisingan mengganggu tidur saya.", vi: "Tiếng ồn làm ảnh hưởng đến giấc ngủ của tôi." } }

  - title: { en: "Verbs with no preposition", uk: "Дієслова без прийменника", es: "Verbos sin preposición", pt: "Verbos sem preposição", fr: "Verbes sans préposition", de: "Verben ohne Präposition", it: "Verbi senza preposizione", pl: "Czasowniki bez przyimka", tr: "Edatsız fiiller", id: "Kata kerja tanpa kata depan", vi: "Động từ không có giới từ" }
    role: own
    content:
      - type: usage
        columns: [{ key: "verb", label: { en: "Verb", uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }, { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }]
        rows:
          - { level: "B2", verb: "discuss", ex: ["We ", { target: "discussed" }, " the plan."], tr: { uk: "Ми обговорили план.", es: "Discutimos el plan.", pt: "Discutimos o plano.", fr: "Nous avons discuté du plan.", de: "Wir haben den Plan besprochen.", it: "Abbiamo discusso il piano.", pl: "Omówiliśmy plan.", tr: "Planı görüştük.", id: "Kami membahas rencana itu.", vi: "Chúng tôi đã bàn về kế hoạch." } }
          - { level: "B2", verb: "mention", ex: ["She didn't ", { target: "mention" }, " the price."], tr: { uk: "Вона не згадала про ціну.", es: "Ella no mencionó el precio.", pt: "Ela não mencionou o preço.", fr: "Elle n’a pas mentionné le prix.", de: "Sie erwähnte den Preis nicht.", it: "Lei non ha menzionato il prezzo.", pl: "Nie wspomniała o cenie.", tr: "Fiyattan söz etmedi.", id: "Dia tidak menyebutkan harganya.", vi: "Cô ấy không nhắc đến giá." } }
          - { level: "B2", verb: "attend", ex: ["Over two hundred people ", { target: "attended" }, " the meeting."], tr: { uk: "На зустрічі були присутні понад двісті людей.", es: "Más de doscientas personas asistieron a la reunión.", pt: "Mais de duzentas pessoas compareceram à reunião.", fr: "Plus de deux cents personnes ont assisté à la réunion.", de: "Über zweihundert Personen nahmen an der Versammlung teil.", it: "Più di duecento persone hanno partecipato alla riunione.", pl: "W spotkaniu uczestniczyło ponad dwieście osób.", tr: "İki yüzden fazla kişi toplantıya katıldı.", id: "Lebih dari dua ratus orang menghadiri rapat itu.", vi: "Hơn hai trăm người đã dự cuộc họp." } }
          - { level: "B2", verb: "answer", ex: ["Please ", { target: "answer" }, " the question."], tr: { uk: "Будь ласка, дай відповідь на запитання.", es: "Por favor, responde la pregunta.", pt: "Por favor, responda à pergunta.", fr: "Réponds à la question, s’il te plaît.", de: "Bitte beantworte die Frage.", it: "Per favore, rispondi alla domanda.", pl: "Odpowiedz, proszę, na pytanie.", tr: "Lütfen soruyu cevapla.", id: "Tolong jawab pertanyaannya.", vi: "Làm ơn trả lời câu hỏi." } }
          - { level: "B2", verb: "enter", ex: ["He ", { target: "entered" }, " the room quietly."], tr: { uk: "Він тихо зайшов до кімнати.", es: "Él entró en la habitación sin hacer ruido.", pt: "Ele entrou na sala em silêncio.", fr: "Il est entré dans la pièce sans bruit.", de: "Er betrat leise den Raum.", it: "Lui è entrato nella stanza senza far rumore.", pl: "Cicho wszedł do pokoju.", tr: "Odaya sessizce girdi.", id: "Dia memasuki ruangan itu dengan tenang.", vi: "Anh ấy lặng lẽ bước vào phòng." } }
          - { level: "B2", verb: "approach", ex: ["The cars ", { target: "approached" }, " the bridge slowly."], tr: { uk: "Машини повільно наближалися до мосту.", es: "Los autos se acercaron lentamente al puente.", pt: "Os carros se aproximaram devagar da ponte.", fr: "Les voitures s’approchaient lentement du pont.", de: "Die Autos näherten sich langsam der Brücke.", it: "Le auto si avvicinavano lentamente al ponte.", pl: "Samochody powoli zbliżały się do mostu.", tr: "Arabalar köprüye yavaşça yaklaştı.", id: "Mobil-mobil itu mendekati jembatan dengan pelan.", vi: "Những chiếc xe từ từ tiến đến cây cầu." } }
          - { level: "B2", verb: "reach", ex: ["We ", { target: "reached" }, " the hotel at noon."], tr: { uk: "Ми дісталися готелю опівдні.", es: "Llegamos al hotel al mediodía.", pt: "Chegamos ao hotel ao meio-dia.", fr: "Nous sommes arrivés à l’hôtel à midi.", de: "Wir erreichten das Hotel mittags.", it: "Siamo arrivati all'albergo a mezzogiorno.", pl: "Dotarliśmy do hotelu w południe.", tr: "Otele öğlen vardık.", id: "Kami tiba di hotel pada siang hari.", vi: "Chúng tôi đến khách sạn vào buổi trưa." } }
          - { level: "B2", verb: "marry", ex: ["She ", { target: "married" }, " a teacher."], tr: { uk: "Вона вийшла заміж за вчителя.", es: "Ella se casó con un maestro.", pt: "Ela se casou com um professor.", fr: "Elle a épousé un professeur.", de: "Sie heiratete einen Lehrer.", it: "Lei ha sposato un insegnante.", pl: "Wyszła za mąż za nauczyciela.", tr: "Bir öğretmenle evlendi.", id: "Dia menikah dengan seorang guru.", vi: "Cô ấy kết hôn với một giáo viên." } }
          - { level: "B2", verb: "obey", ex: ["Children must ", { target: "obey" }, " the rules."], tr: { uk: "Діти мають виконувати правила.", es: "Los niños deben obedecer las reglas.", pt: "As crianças devem obedecer às regras.", fr: "Les enfants doivent obéir aux règles.", de: "Kinder müssen die Regeln befolgen.", it: "I bambini devono rispettare le regole.", pl: "Dzieci muszą przestrzegać zasad.", tr: "Çocuklar kurallara uymak zorundadır.", id: "Anak-anak harus menaati aturan.", vi: "Trẻ em phải tuân theo các quy tắc." } }
          - { level: "B2", verb: "resemble", ex: ["He ", { target: "resembles" }, " his father."], tr: { uk: "Він схожий на свого батька.", es: "Él se parece a su padre.", pt: "Ele se parece com o pai dele.", fr: "Il ressemble à son père.", de: "Er ähnelt seinem Vater.", it: "Lui assomiglia a suo padre.", pl: "Jest podobny do swojego ojca.", tr: "Babasına benziyor.", id: "Dia mirip dengan ayahnya.", vi: "Anh ấy giống bố mình." } }
          - { level: "B2", verb: "contact", ex: [{ target: "Contact" }, " the office by Friday."], tr: { uk: "Зв’яжися з офісом до п’ятниці.", es: "Comunícate con la oficina antes del viernes.", pt: "Entre em contato com o escritório até sexta-feira.", fr: "Contacte le bureau d’ici vendredi.", de: "Kontaktiere das Büro bis Freitag.", it: "Contatta l'ufficio entro venerdì.", pl: "Skontaktuj się z biurem do piątku.", tr: "Cumaya kadar ofisle iletişime geç.", id: "Hubungi kantor paling lambat hari Jumat.", vi: "Hãy liên hệ với văn phòng trước thứ Sáu." } }
          - { level: "C1", verb: "comprise", ex: ["The course ", { target: "comprises" }, " six units."], tr: { uk: "Курс складається з шести модулів.", es: "El curso consta de seis unidades.", pt: "O curso é composto de seis unidades.", fr: "Le cours comprend six unités.", de: "Der Kurs umfasst sechs Einheiten.", it: "Il corso comprende sei unità.", pl: "Kurs składa się z sześciu modułów.", tr: "Kurs altı üniteden oluşur.", id: "Kursus itu terdiri dari enam unit.", vi: "Khóa học gồm sáu bài." } }
          - { level: "C1", verb: "emphasise", ex: ["The teacher ", { target: "emphasised" }, " the need for practice."], tr: { uk: "Учитель наголосив на потребі практики.", es: "El maestro destacó la necesidad de practicar.", pt: "O professor enfatizou a necessidade de praticar.", fr: "Le professeur a souligné la nécessité de s’exercer.", de: "Der Lehrer betonte, wie wichtig Übung ist.", it: "L'insegnante ha sottolineato la necessità di esercitarsi.", pl: "Nauczyciel podkreślił potrzebę ćwiczeń.", tr: "Öğretmen alıştırma yapmanın gerekliliğini vurguladı.", id: "Guru itu menekankan perlunya latihan.", vi: "Thầy giáo nhấn mạnh sự cần thiết của việc luyện tập." } }
      - type: list
        items:
          - { type: "rule", level: "B2", text: { en: "These verbs take their object directly, with no preposition before it.", uk: "Ці дієслова вживаються з додатком без прийменника.", es: "Estos verbos llevan el objeto directamente, sin preposición delante.", pt: "Esses verbos levam o objeto diretamente, sem preposição antes dele.", fr: "Ces verbes se construisent avec un complément direct, sans préposition devant.", de: "Diese Verben stehen direkt mit dem Objekt, ohne Präposition davor.", it: "Questi verbi reggono direttamente il complemento oggetto, senza preposizione davanti.", pl: "Te czasowniki łączą się z dopełnieniem bezpośrednio, bez przyimka.", tr: "Bu fiiller nesnesini doğrudan alır; önlerinde edat bulunmaz.", id: "Kata kerja ini langsung diikuti objek, tanpa kata depan di depannya.", vi: "Những động từ này đi thẳng với tân ngữ, không có giới từ đứng trước." } }

  - title: { en: "Adjectives with a preposition", uk: "Прикметники з прийменником", es: "Adjetivos con preposición", pt: "Adjetivos com preposição", fr: "Adjectifs avec préposition", de: "Adjektive mit Präposition", it: "Aggettivi con preposizione", pl: "Przymiotniki z przyimkiem", tr: "Edatlı sıfatlar", id: "Kata sifat dengan kata depan", vi: "Tính từ đi với giới từ" }
