          - { level: "B2", verb: "shout to", meaning: { en: "call so that a person hears", uk: "гукати, щоб людина почула", es: "llamar a alguien para que escuche", pt: "chamar alguém em voz alta para que ouça", fr: "appeler quelqu’un pour qu’il entende", de: "rufen, damit jemand es hört", it: "chiamare perché qualcuno senta", pl: "zawołać, żeby ktoś usłyszał", tr: "birinin duyması için seslenmek", id: "memanggil agar seseorang mendengar", vi: "gọi lớn để ai đó nghe thấy" }, ex: ["She ", { target: "shouted to" }, " me across the street."], tr: { uk: "Вона гукнула мене через вулицю.", es: "Ella me gritó desde el otro lado de la calle.", pt: "Ela me chamou aos gritos do outro lado da rua.", fr: "Elle m’a appelé de l’autre côté de la rue.", de: "Sie rief mir von der anderen Straßenseite zu.", it: "Lei mi ha chiamato gridando dall'altra parte della strada.", pl: "Zawołała do mnie z drugiej strony ulicy.", tr: "Sokağın karşısından bana seslendi.", id: "Dia memanggil saya dari seberang jalan.", vi: "Cô ấy gọi tôi từ bên kia đường." } }

