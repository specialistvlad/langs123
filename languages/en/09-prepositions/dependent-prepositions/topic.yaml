        rows:
          - { level: "B2", form: { pattern: [{ slot: "verb" }, { slot: { en: "preposition" } }, { slot: "V-ing" }] }, ex: ["She ", { target: "insisted on paying" }, "."] }
          - { level: "B2", form: { pattern: [{ slot: "adjective" }, { slot: { en: "preposition" } }, { slot: "V-ing" }] }, ex: ["I'm ", { target: "afraid of flying" }, "."] }
          - { level: "B2", form: { pattern: [{ slot: "noun" }, { slot: { en: "preposition" } }, { slot: "V-ing" }] }, ex: ["I like the ", { target: "idea of leaving" }, " early."] }
          - { level: "B2", form: { pattern: ["prevent", { slot: "person" }, "from", { slot: "V-ing" }] }, ex: ["The noise ", { target: "prevented" }, " us ", { target: "from sleeping" }, "."] }
          - { level: "B2", form: { pattern: ["blame", { slot: "person" }, "for", { slot: "V-ing" }] }, ex: ["He ", { target: "blamed" }, " her ", { target: "for losing" }, " the keys."] }
          - { level: "B2", form: { pattern: ["congratulate", { slot: "person" }, "on", { slot: "V-ing" }] }, ex: ["We ", { target: "congratulated" }, " her ", { target: "on winning" }, "."] }
