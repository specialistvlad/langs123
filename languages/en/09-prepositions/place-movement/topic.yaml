            meaning: { en: "a state", uk: "стан", es: "un estado", pt: "um estado", fr: "un état", de: "ein Zustand", it: "uno stato", pl: "stan", tr: "bir durum", id: "suatu keadaan", vi: "một trạng thái" }
            ex: { examples: [["The children are ", { target: in danger }, "."], ["They fell ", { target: in love }, "."]] }
            tr: { uk: { examples: ["Діти в небезпеці.", "Вони закохалися."] }, es: { examples: ["Los niños están en peligro.", "Se enamoraron."] }, pt: { examples: ["As crianças estão em perigo.", "Eles se apaixonaram."] }, fr: { examples: ["Les enfants sont en danger.", "Ils sont tombés amoureux."] }, de: { examples: ["Die Kinder sind in Gefahr.", "Sie haben sich verliebt."] }, it: { examples: ["I bambini sono in pericolo.", "Si sono innamorati."] }, pl: { examples: ["Dzieci są w niebezpieczeństwie.", "Zakochali się."] }, tr: { examples: ["Çocuklar tehlikede.", "Âşık oldular."] }, id: { examples: ["Anak-anak itu dalam bahaya.", "Mereka jatuh cinta."] }, vi: { examples: ["Bọn trẻ đang gặp nguy hiểm.", "Họ đã yêu nhau."] } }
          - level: C1
            prep: under
            meaning: { en: "the influence of something", uk: "вплив чогось", es: "la influencia de algo", pt: "a influência de algo", fr: "l’influence de quelque chose", de: "der Einfluss von etwas", it: "l'influenza di qualcosa", pl: "wpływ czegoś", tr: "bir şeyin etkisi", id: "pengaruh sesuatu", vi: "ảnh hưởng của một điều gì đó" }
            ex: { examples: [["She works well ", { target: under pressure }, "."], ["The fire is ", { target: under control }, "."]] }
            tr: { uk: { examples: ["Вона добре працює під тиском.", "Пожежу взято під контроль."] }, es: { examples: ["Ella trabaja bien bajo presión.", "El incendio está bajo control."] }, pt: { examples: ["Ela trabalha bem sob pressão.", "O incêndio está sob controle."] }, fr: { examples: ["Elle travaille bien sous pression.", "L’incendie est maîtrisé."] }, de: { examples: ["Sie arbeitet gut unter Druck.", "Das Feuer ist unter Kontrolle."] }, it: { examples: ["Lavora bene sotto pressione.", "L'incendio è sotto controllo."] }, pl: { examples: ["Dobrze pracuje pod presją.", "Pożar jest pod kontrolą."] }, tr: { examples: ["Baskı altında iyi çalışır.", "Yangın kontrol altında."] }, id: { examples: ["Dia bekerja dengan baik di bawah tekanan.", "Kebakarannya sudah terkendali."] }, vi: { examples: ["Cô ấy làm việc tốt dưới áp lực.", "Đám cháy đã được kiểm soát."] } }
          - level: C1
            prep: out of
            meaning: { en: "a loss", uk: "втрата", es: "una pérdida", pt: "uma perda", fr: "une perte", de: "ein Verlust", it: "una perdita", pl: "utrata", tr: "bir kayıp", id: "suatu kehilangan", vi: "sự mất mát" }
            ex: { examples: [["The car went ", { target: out of control }, "."], ["This map is ", { target: out of date }, "."]] }
            tr: { uk: { examples: ["Машина вийшла з-під контролю.", "Ця карта застаріла."] }, es: { examples: ["El auto se salió de control.", "Este mapa está desactualizado."] }, pt: { examples: ["O carro saiu de controle.", "Este mapa está desatualizado."] }, fr: { examples: ["La voiture est devenue incontrôlable.", "Cette carte est périmée."] }, de: { examples: ["Das Auto geriet außer Kontrolle.", "Diese Karte ist veraltet."] }, it: { examples: ["La macchina è andata fuori controllo.", "Questa mappa è superata."] }, pl: { examples: ["Samochód wymknął się spod kontroli.", "Ta mapa jest nieaktualna."] }, tr: { examples: ["Araba kontrolden çıktı.", "Bu harita güncel değil."] }, id: { examples: ["Mobil itu lepas kendali.", "Peta ini sudah kedaluwarsa."] }, vi: { examples: ["Chiếc xe mất kiểm soát.", "Tấm bản đồ này đã cũ."] } }
          - level: C1
            prep: beyond
            meaning: { en: "a limit", uk: "межа", es: "un límite", pt: "um limite", fr: "une limite", de: "eine Grenze", it: "un limite", pl: "granica", tr: "bir sınır", id: "suatu batas", vi: "một giới hạn" }
            ex: { examples: [["His kindness is ", { target: beyond belief }, "."], ["The damage is ", { target: beyond repair }, "."]] }
            tr: { uk: { examples: ["Його доброта неймовірна.", "Пошкодження не підлягають ремонту."] }, es: { examples: ["Su amabilidad es increíble.", "El daño no tiene arreglo."] }, pt: { examples: ["A bondade dele é inacreditável.", "O dano não tem conserto."] }, fr: { examples: ["Sa gentillesse est incroyable.", "Les dégâts sont irréparables."] }, de: { examples: ["Seine Freundlichkeit ist unglaublich.", "Der Schaden ist nicht mehr zu reparieren."] }, it: { examples: ["La sua gentilezza è incredibile.", "Il danno è irreparabile."] }, pl: { examples: ["Jego życzliwość jest niewiarygodna.", "Szkody nie da się naprawić."] }, tr: { examples: ["Nezaketi inanılmaz.", "Hasar onarılamayacak durumda."] }, id: { examples: ["Kebaikannya sulit dipercaya.", "Kerusakannya tidak bisa diperbaiki."] }, vi: { examples: ["Lòng tốt của anh ấy thật khó tin.", "Hư hại này không thể sửa được."] } }
          - level: C1
            prep: within
            meaning: { en: "a range", uk: "діапазон", es: "un rango", pt: "uma faixa", fr: "une portée", de: "ein Bereich", it: "un ambito", pl: "zakres", tr: "bir kapsam", id: "suatu rentang", vi: "một phạm vi" }
            ex: { examples: [["The beach is ", { target: within reach }, "."], ["We stayed ", { target: within }, " our budget."]] }
            tr: { uk: { examples: ["Пляж зовсім поруч, рукою подати.", "Ми вклалися в наш бюджет."] }, es: { examples: ["La playa está al alcance de la mano.", "Nos mantuvimos dentro de nuestro presupuesto."] }, pt: { examples: ["A praia fica ao alcance.", "Ficamos dentro do nosso orçamento."] }, fr: { examples: ["La plage est à portée de main.", "Nous sommes restés dans notre budget."] }, de: { examples: ["Der Strand ist in Reichweite.", "Wir sind im Rahmen unseres Budgets geblieben."] }, it: { examples: ["La spiaggia è a portata di mano.", "Siamo rimasti entro il nostro budget."] }, pl: { examples: ["Plaża jest w zasięgu ręki.", "Zmieściliśmy się w budżecie."] }, tr: { examples: ["Plaj elimizin altında.", "Bütçemizin içinde kaldık."] }, id: { examples: ["Pantai itu mudah dijangkau.", "Kami tetap berada dalam anggaran kami."] }, vi: { examples: ["Bãi biển nằm trong tầm với.", "Chúng tôi chi tiêu trong ngân sách của mình."] } }
          - level: C1
            prep: "on"
            meaning: { en: "a condition or an activity", uk: "стан або діяльність", es: "una condición o una actividad", pt: "uma condição ou uma atividade", fr: "une condition ou une activité", de: "ein Zustand oder eine Tätigkeit", it: "una condizione o un'attività", pl: "stan lub czynność", tr: "bir durum ya da etkinlik", id: "suatu kondisi atau kegiatan", vi: "một tình trạng hoặc một hoạt động" }
            ex: { examples: [["I feel ", { target: on edge }, "."], ["The workers are ", { target: on strike }, "."]] }
            tr: { uk: { examples: ["Я на нервах.", "Працівники страйкують."] }, es: { examples: ["Siento los nervios de punta.", "Los trabajadores están en huelga."] }, pt: { examples: ["Estou com os nervos à flor da pele.", "Os trabalhadores estão em greve."] }, fr: { examples: ["Je suis sur les nerfs.", "Les ouvriers sont en grève."] }, de: { examples: ["Ich bin angespannt.", "Die Arbeiter streiken."] }, it: { examples: ["Mi sento teso.", "Gli operai sono in sciopero."] }, pl: { examples: ["Jestem zdenerwowany.", "Pracownicy strajkują."] }, tr: { examples: ["Gergin hissediyorum.", "İşçiler grevde."] }, id: { examples: ["Saya merasa gelisah.", "Para pekerja sedang mogok."] }, vi: { examples: ["Tôi thấy căng thẳng.", "Các công nhân đang đình công."] } }
          - level: C1
            prep: at
            meaning: { en: "a point on a scale or in a situation", uk: "точка на шкалі або в ситуації", es: "un punto en una escala o en una situación", pt: "um ponto em uma escala ou em uma situação", fr: "un point sur une échelle ou dans une situation", de: "ein Punkt auf einer Skala oder in einer Situation", it: "un punto su una scala o in una situazione", pl: "punkt na skali lub w sytuacji", tr: "bir ölçekte ya da bir durumda bir nokta", id: "satu titik pada skala atau dalam suatu situasi", vi: "một điểm trên thang đo hoặc trong một tình huống" }
            ex: { examples: [["Smokers are ", { target: at risk }, "."], ["The two brothers are ", { target: at odds }, "."]] }
            tr: { uk: { examples: ["Курці в групі ризику.", "Двоє братів посварилися."] }, es: { examples: ["Los fumadores están en riesgo.", "Los dos hermanos están en desacuerdo."] }, pt: { examples: ["Os fumantes correm risco.", "Os dois irmãos estão em desacordo."] }, fr: { examples: ["Les fumeurs sont à risque.", "Les deux frères sont en désaccord."] }, de: { examples: ["Raucher sind gefährdet.", "Die beiden Brüder sind zerstritten."] }, it: { examples: ["I fumatori sono a rischio.", "I due fratelli sono in disaccordo."] }, pl: { examples: ["Palacze są narażeni na ryzyko.", "Dwaj bracia są skłóceni."] }, tr: { examples: ["Sigara içenler risk altında.", "İki kardeş anlaşmazlık içinde."] }, id: { examples: ["Para perokok berisiko.", "Kedua kakak beradik itu berselisih."] }, vi: { examples: ["Người hút thuốc có nguy cơ.", "Hai anh em đang bất hòa."] } }

  - title: { en: Complex prepositions, uk: "Складні прийменники", es: "Preposiciones compuestas", pt: "Preposições compostas", fr: "Prépositions composées", de: "Zusammengesetzte Präpositionen", it: "Preposizioni composte", pl: "Przyimki złożone", tr: "Birleşik edatlar", id: "Kata depan majemuk", vi: "Giới từ phức" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: meaning, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            form: { alternatives: [in front of, on top of, at the back of, away from, out of, up to] }
            meaning: { en: "a group of words that works as one preposition: the noun follows the last word", uk: "група слів, що діє як один прийменник: іменник стоїть після останнього слова", es: "un grupo de palabras que funciona como una sola preposición: el sustantivo va después de la última palabra", pt: "um grupo de palavras que funciona como uma só preposição: o substantivo vem depois da última palavra", fr: "un groupe de mots qui fonctionne comme une seule préposition : le nom suit le dernier mot", de: "eine Wortgruppe, die wie eine einzige Präposition funktioniert: das Nomen folgt auf das letzte Wort", it: "un gruppo di parole che funziona come un'unica preposizione: il sostantivo segue l'ultima parola", pl: "grupa wyrazów działająca jak jeden przyimek: rzeczownik stoi po ostatnim wyrazie", tr: "tek bir edat gibi işleyen sözcük grubu: isim son sözcükten sonra gelir", id: "sekelompok kata yang berfungsi sebagai satu kata depan: kata benda mengikuti kata terakhir", vi: "một nhóm từ có chức năng như một giới từ: danh từ đứng sau từ cuối cùng" }
            ex: { examples: [["A taxi stopped ", { target: in front of }, " the hotel."], ["Keep ", { target: away from }, " the edge."], ["He walked ", { target: up to }, " the door."]] }
            tr: { uk: { examples: ["Таксі зупинилося перед готелем.", "Тримайтеся подалі від краю.", "Він підійшов до дверей."] }, es: { examples: ["Un taxi se detuvo delante del hotel.", "Mantente alejado del borde.", "Caminó hasta la puerta."] }, pt: { examples: ["Um táxi parou na frente do hotel.", "Fique longe da beirada.", "Ele caminhou até a porta."] }, fr: { examples: ["Un taxi s’est arrêté devant l’hôtel.", "Reste loin du bord.", "Il s’est approché de la porte."] }, de: { examples: ["Ein Taxi hielt vor dem Hotel.", "Halte Abstand vom Rand.", "Er ging bis zur Tür."] }, it: { examples: ["Un taxi si è fermato davanti all'albergo.", "Stai lontano dal bordo.", "Si è avvicinato alla porta."] }, pl: { examples: ["Taksówka zatrzymała się przed hotelem.", "Trzymaj się z dala od krawędzi.", "Podszedł do drzwi."] }, tr: { examples: ["Bir taksi otelin önünde durdu.", "Kenardan uzak dur.", "Kapıya kadar yürüdü."] }, id: { examples: ["Sebuah taksi berhenti di depan hotel.", "Jauhi tepinya.", "Dia berjalan sampai ke pintu."] }, vi: { examples: ["Một chiếc taxi dừng trước khách sạn.", "Hãy tránh xa mép.", "Anh ấy đi đến tận cửa."] } }
          - level: C1
            form: along with
            meaning: { en: "together with", uk: "разом з", es: "junto con", pt: "junto com", fr: "avec", de: "zusammen mit", it: "insieme a", pl: "razem z", tr: "ile birlikte", id: "bersama", vi: "cùng với" }
            ex: ["She arrived ", { target: along with }, " her parents."]
            tr: { uk: "Вона приїхала разом зі своїми батьками.", es: "Ella llegó junto con sus padres.", pt: "Ela chegou junto com os pais.", fr: "Elle est arrivée avec ses parents.", de: "Sie kam zusammen mit ihren Eltern an.", it: "È arrivata insieme ai suoi genitori.", pl: "Przyjechała razem z rodzicami.", tr: "Anne babasıyla birlikte geldi.", id: "Dia tiba bersama orang tuanya.", vi: "Cô ấy đến cùng với bố mẹ." }
          - level: C1
            form: by means of
            meaning: { en: "using a tool or a method", uk: "за допомогою знаряддя чи способу", es: "usando una herramienta o un método", pt: "usando uma ferramenta ou um método", fr: "en utilisant un outil ou une méthode", de: "mit einem Werkzeug oder einer Methode", it: "usando uno strumento o un metodo", pl: "przy użyciu narzędzia lub metody", tr: "bir araç ya da yöntem kullanarak", id: "dengan menggunakan alat atau cara", vi: "bằng một công cụ hoặc một phương pháp" }
            ex: ["They crossed the river ", { target: by means of }, " a rope."]
            tr: { uk: "Вони перетнули річку за допомогою линви.", es: "Cruzaron el río por medio de una cuerda.", pt: "Eles atravessaram o rio por meio de uma corda.", fr: "Ils ont traversé la rivière au moyen d’une corde.", de: "Sie überquerten den Fluss mithilfe eines Seils.", it: "Hanno attraversato il fiume per mezzo di una corda.", pl: "Przeprawili się przez rzekę za pomocą liny.", tr: "Nehri bir ip yardımıyla geçtiler.", id: "Mereka menyeberangi sungai dengan bantuan tali.", vi: "Họ vượt sông bằng một sợi dây thừng." }
          - level: C1
            form: on behalf of
            meaning: { en: "for someone, as their representative", uk: "для когось, як його представник", es: "por alguien, como su representante", pt: "por alguém, como seu representante", fr: "pour quelqu’un, en tant que son représentant", de: "für jemanden, als dessen Vertreter", it: "per qualcuno, come suo rappresentante", pl: "w czyimś imieniu, jako jego przedstawiciel", tr: "biri için, onun temsilcisi olarak", id: "untuk seseorang, sebagai wakilnya", vi: "cho một người, với tư cách là người đại diện" }
            ex: ["I am writing ", { target: on behalf of }, " the team."]
            tr: { uk: "Я пишу від імені команди.", es: "Escribo en nombre del equipo.", pt: "Escrevo em nome da equipe.", fr: "J’écris au nom de l’équipe.", de: "Ich schreibe im Namen des Teams.", it: "Scrivo a nome della squadra.", pl: "Piszę w imieniu zespołu.", tr: "Ekip adına yazıyorum.", id: "Saya menulis atas nama tim.", vi: "Tôi viết thay mặt cả nhóm." }
          - level: C1
            form: in terms of
            meaning: { en: "looking at one side of a question", uk: "розгляд одного боку питання", es: "mirar un solo aspecto de una cuestión", pt: "olhar para um só lado de uma questão", fr: "considérer un seul aspect d’une question", de: "eine Seite einer Frage betrachten", it: "considerare un solo lato di una questione", pl: "rozpatrywanie jednej strony zagadnienia", tr: "bir konunun yalnızca bir yönüne bakmak", id: "melihat satu sisi dari suatu persoalan", vi: "xem xét một khía cạnh của vấn đề" }
            ex: [{ target: In terms of }, " price, this phone is the best."]
            tr: { uk: "Щодо ціни цей телефон найкращий.", es: "En cuanto al precio, este teléfono es el mejor.", pt: "Em termos de preço, este celular é o melhor.", fr: "Pour ce qui est du prix, ce téléphone est le meilleur.", de: "Was den Preis betrifft, ist dieses Handy das beste.", it: "In termini di prezzo, questo telefono è il migliore.", pl: "Pod względem ceny ten telefon jest najlepszy.", tr: "Fiyat açısından bu telefon en iyisi.", id: "Dari segi harga, ponsel ini yang terbaik.", vi: "Về giá cả, chiếc điện thoại này là tốt nhất." }
          - level: C1
            form: with regard to
            meaning: { en: "about, in a formal letter or talk", uk: "щодо, в офіційному листі чи промові", es: "acerca de, en una carta o charla formal", pt: "a respeito de, em uma carta ou conversa formal", fr: "au sujet de, dans une lettre ou un discours formel", de: "bezüglich, in einem formellen Brief oder Gespräch", it: "riguardo a, in una lettera o in un discorso formale", pl: "odnośnie do, w formalnym liście lub wypowiedzi", tr: "hakkında, resmî bir mektupta ya da konuşmada", id: "mengenai, dalam surat atau pembicaraan formal", vi: "về, trong thư hoặc bài nói trang trọng" }
            ex: [{ target: With regard to }, " your question, the answer is yes."]
            tr: { uk: "Щодо вашого запитання: відповідь — так.", es: "Con respecto a su pregunta, la respuesta es sí.", pt: "Com relação à sua pergunta, a resposta é sim.", fr: "En ce qui concerne votre question, la réponse est oui.", de: "Zu Ihrer Frage: Die Antwort ist Ja.", it: "Riguardo alla sua domanda, la risposta è sì.", pl: "Co do Pana pytania, odpowiedź brzmi: tak.", tr: "Sorunuza gelince, cevap evet.", id: "Sehubungan dengan pertanyaan Anda, jawabannya ya.", vi: "Về câu hỏi của quý vị, câu trả lời là có." }
          - level: C1
            form: in view of
            meaning: { en: "because of, taking a fact into account", uk: "через; беручи до уваги якийсь факт", es: "a causa de, teniendo en cuenta un hecho", pt: "por causa de, levando um fato em conta", fr: "à cause de, en tenant compte d’un fait", de: "wegen, unter Berücksichtigung einer Tatsache", it: "a causa di, tenendo conto di un fatto", pl: "z powodu, biorąc pod uwagę jakiś fakt", tr: "nedeniyle, bir olguyu göz önünde bulundurarak", id: "karena, dengan mempertimbangkan suatu fakta", vi: "vì, có tính đến một sự việc" }
            ex: [{ target: In view of }, " the weather, we stayed at home."]
            tr: { uk: "З огляду на погоду ми залишилися вдома.", es: "Dado el clima, nos quedamos en casa.", pt: "Em vista do tempo, ficamos em casa.", fr: "Vu le temps, nous sommes restés à la maison.", de: "Angesichts des Wetters blieben wir zu Hause.", it: "Visto il tempo, siamo rimasti a casa.", pl: "Ze względu na pogodę zostaliśmy w domu.", tr: "Havayı göz önünde bulundurarak evde kaldık.", id: "Mengingat cuaca, kami tinggal di rumah.", vi: "Xét đến thời tiết, chúng tôi ở nhà." }
          - level: C1
