  - title: { en: Direction }
    role: own
    content:
      - type: usage
        columns:
          - { key: words, label: { en: Word } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            words: { contrast: [towards, to] }
            use: { en: [{ term: towards }, " heads in the direction of a place; ", { term: to }, " reaches it"] }
            ex: { contrast: [["The dog ran ", { target: towards }, " the gate, but stopped."], ["The dog ran ", { target: to }, " the gate and sat down."]] }
          - level: B2
            words: away from
            use: { en: "increasing the distance from a place" }
            ex: ["Please move ", { target: away from }, " the door."]
          - level: B2
            words: { contrast: ["off", out of] }
            use: { en: [{ term: "off" }, " leaves a surface; ", { term: out of }, " leaves a closed space"] }
            ex: { contrast: [["The cup fell ", { target: "off" }, " the table."], ["She got ", { target: out of }, " the taxi."]] }
          - level: B2
            words: onto
            use: { en: [{ term: onto }, " is movement to a surface; ", { term: "on" }, " also serves after ", { term: jump }, ", ", { term: climb }, " and ", { term: step }] }
            ex: { examples: [["The cat jumped ", { target: onto }, " the roof."], ["She stepped ", { target: "on" }, " the stage."]] }
          - level: B2
            words: round the corner
            use: { en: "a turn at a bend, or very near" }
            ex: ["The post office is just ", { target: round the corner }, " ", { variant: { target: around the corner }, variety: en-US }, "."]
          - level: B2
            words: along
            use: { en: "the length of a road, a river or a line" }
            ex: ["Cars were parked ", { target: along }, " the street."]
          - level: B2
            words: { contrast: [throw at, throw to] }
            use: { en: [{ term: at }, " aims to hit; ", { term: to }, " aims to be caught"] }
            ex: { contrast: [["Boys were throwing stones ", { target: at }, " the window."], ["Throw the ball ", { target: to }, " me."]] }
          - level: B2
            words: { contrast: [shout at, shout to] }
            use: { en: [{ term: at }, " is angry; ", { term: to }, " calls to be heard from far away"] }
            ex: { contrast: [["Please don't shout ", { target: at }, " me."], ["She shouted ", { target: to }, " us from the boat."]] }
          - level: B2
            words: { contrast: [point at, point to] }
            use: { en: [{ term: at }, " aims straight at a thing; ", { term: to }, " shows where something is"] }
            ex: { contrast: [["The child pointed ", { target: at }, " the cake."], ["The guide pointed ", { target: to }, " the old tower."]] }
          - level: B2
