              it: [{ term: "behind" }, ", ", { term: "opposite" }, " e ", { term: "near" }, " stanno direttamente davanti al sostantivo: ", { term: "near the park" }, "."]
              pl: [{ term: "behind" }, ", ", { term: "opposite" }, " i ", { term: "near" }, " stoją bezpośrednio przed rzeczownikiem: ", { term: "near the park" }, "."]
              tr: [{ term: "behind" }, ", ", { term: "opposite" }, " ve ", { term: "near" }, " doğrudan ismin önünde yer alır: ", { term: "near the park" }, "."]
              id: [{ term: "behind" }, ", ", { term: "opposite" }, " dan ", { term: "near" }, " diletakkan langsung sebelum kata benda: ", { term: "near the park" }, "."]
              vi: [{ term: "behind" }, ", ", { term: "opposite" }, " và ", { term: "near" }, " đứng ngay trước danh từ: ", { term: "near the park" }, "."]

  - title: { en: "In, on, at: place", uk: "In, on, at: місце", es: "In, on, at: lugar", pt: "In, on, at: lugar", fr: "In, on, at : lieu", de: "In, on, at: Ort", it: "In, on, at: luogo", pl: "In, on, at: miejsce", tr: "In, on, at: yer", id: "In, on, at: tempat", vi: "In, on, at: nơi chốn" }
