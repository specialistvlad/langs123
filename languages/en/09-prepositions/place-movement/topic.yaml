sections:
  - title: { en: "Place: where something is", uk: "Місце: де щось знаходиться", es: "Lugar: dónde está algo", pt: "Lugar: onde algo está", fr: "Lieu : où se trouve quelque chose", de: "Ort: wo etwas ist", it: "Luogo: dove si trova qualcosa", pl: "Miejsce: gdzie coś jest", tr: "Yer: bir şey nerede", id: "Tempat: di mana sesuatu berada", vi: "Nơi chốn: vật ở đâu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, uk: "Прийменник", es: "Preposición", pt: "Preposição", fr: "Préposition", de: "Präposition", it: "Preposizione", pl: "Przyimek", tr: "Edat", id: "Kata depan", vi: "Giới từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, prep: in, ex: ["The keys are ", { target: in }, " the bag."], tr: { uk: "Ключі в сумці.", es: "Las llaves están en la bolsa.", pt: "As chaves estão na bolsa.", fr: "Les clés sont dans le sac.", de: "Die Schlüssel sind in der Tasche.", it: "Le chiavi sono nella borsa.", pl: "Klucze są w torbie.", tr: "Anahtarlar çantanın içinde.", id: "Kunci ada di dalam tas.", vi: "Chìa khóa ở trong túi." } }
          - { level: A1, prep: "on", ex: ["The phone is ", { target: "on" }, " the table."], tr: { uk: "Телефон на столі.", es: "El teléfono está sobre la mesa.", pt: "O celular está sobre a mesa.", fr: "Le téléphone est sur la table.", de: "Das Handy liegt auf dem Tisch.", it: "Il telefono è sul tavolo.", pl: "Telefon leży na stole.", tr: "Telefon masanın üstünde.", id: "Ponsel ada di atas meja.", vi: "Điện thoại ở trên bàn." } }
          - { level: A1, prep: at, ex: ["She is ", { target: at }, " the door."], tr: { uk: "Вона біля дверей.", es: "Ella está en la puerta.", pt: "Ela está na porta.", fr: "Elle est à la porte.", de: "Sie ist an der Tür.", it: "Lei è alla porta.", pl: "Ona stoi przy drzwiach.", tr: "O kapıda.", id: "Dia ada di pintu.", vi: "Cô ấy đang ở cửa." } }
          - { level: A1, prep: under, ex: ["The cat is ", { target: under }, " the chair."], tr: { uk: "Кіт під стільцем.", es: "El gato está debajo de la silla.", pt: "O gato está debaixo da cadeira.", fr: "Le chat est sous la chaise.", de: "Die Katze ist unter dem Stuhl.", it: "Il gatto è sotto la sedia.", pl: "Kot jest pod krzesłem.", tr: "Kedi sandalyenin altında.", id: "Kucing ada di bawah kursi.", vi: "Con mèo ở dưới ghế." } }
          - { level: A1, prep: next to, ex: ["The bank is ", { target: next to }, " the café."], tr: { uk: "Банк поруч із кафе.", es: "El banco está al lado del café.", pt: "O banco fica ao lado do café.", fr: "La banque est à côté du café.", de: "Die Bank ist neben dem Café.", it: "La banca è accanto al bar.", pl: "Bank jest obok kawiarni.", tr: "Banka kafenin yanında.", id: "Bank ada di sebelah kafe.", vi: "Ngân hàng ở bên cạnh quán cà phê." } }
          - { level: A1, prep: between, ex: ["The shop is ", { target: between }, " the bank and the café."], tr: { uk: "Магазин між банком і кафе.", es: "La tienda está entre el banco y el café.", pt: "A loja fica entre o banco e o café.", fr: "Le magasin est entre la banque et le café.", de: "Das Geschäft ist zwischen der Bank und dem Café.", it: "Il negozio è tra la banca e il bar.", pl: "Sklep jest między bankiem a kawiarnią.", tr: "Mağaza banka ile kafenin arasında.", id: "Toko ada di antara bank dan kafe.", vi: "Cửa hàng ở giữa ngân hàng và quán cà phê." } }
          - { level: A1, prep: behind, ex: ["The garden is ", { target: behind }, " the house."], tr: { uk: "Сад за будинком.", es: "El jardín está detrás de la casa.", pt: "O jardim fica atrás da casa.", fr: "Le jardin est derrière la maison.", de: "Der Garten ist hinter dem Haus.", it: "Il giardino è dietro la casa.", pl: "Ogród jest za domem.", tr: "Bahçe evin arkasında.", id: "Kebun ada di belakang rumah.", vi: "Khu vườn ở phía sau ngôi nhà." } }
          - { level: A1, prep: in front of, ex: ["The bus stop is ", { target: in front of }, " the school."], tr: { uk: "Автобусна зупинка перед школою.", es: "La parada de autobús está delante de la escuela.", pt: "O ponto de ônibus fica na frente da escola.", fr: "L’arrêt de bus est devant l’école.", de: "Die Bushaltestelle ist vor der Schule.", it: "La fermata dell'autobus è davanti alla scuola.", pl: "Przystanek autobusowy jest przed szkołą.", tr: "Otobüs durağı okulun önünde.", id: "Halte bus ada di depan sekolah.", vi: "Trạm xe buýt ở trước cửa trường." } }
          - { level: A2, prep: opposite, ex: ["The hotel is ", { target: opposite }, " the station."], tr: { uk: "Готель навпроти вокзалу.", es: "El hotel está frente a la estación.", pt: "O hotel fica em frente à estação.", fr: "L’hôtel est en face de la gare.", de: "Das Hotel ist gegenüber vom Bahnhof.", it: "L'albergo è di fronte alla stazione.", pl: "Hotel jest naprzeciwko dworca.", tr: "Otel istasyonun karşısında.", id: "Hotel ada di seberang stasiun.", vi: "Khách sạn ở đối diện nhà ga." } }
          - { level: A1, prep: near, ex: ["I live ", { target: near }, " the park."], tr: { uk: "Я живу біля парку.", es: "Vivo cerca del parque.", pt: "Moro perto do parque.", fr: "J’habite près du parc.", de: "Ich wohne in der Nähe des Parks.", it: "Abito vicino al parco.", pl: "Mieszkam blisko parku.", tr: "Parkın yakınında yaşıyorum.", id: "Saya tinggal dekat taman.", vi: "Tôi sống gần công viên." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: behind }, ", ", { term: opposite }, " and ", { term: near }, " go straight before the noun: ", { term: near the park }, "."]
