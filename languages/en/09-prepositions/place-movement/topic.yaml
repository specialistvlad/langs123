          - { level: A2, use: { pattern: [by, { slot: { en: transport, uk: "транспорт", es: "transporte", pt: "transporte", fr: "transport", de: "Verkehrsmittel", it: "mezzo di trasporto", pl: "środek transportu", tr: "ulaşım", id: "transportasi", vi: "phương tiện" } }] }, ex: { examples: [["I go to school ", { target: by bus }, "."], ["We go ", { target: on foot }, "."]] }, tr: { uk: { examples: ["Я їжджу до школи автобусом.", "Ми йдемо пішки."] }, es: { examples: ["Voy a la escuela en autobús.", "Vamos a pie."] }, pt: { examples: ["Vou para a escola de ônibus.", "Vamos a pé."] }, fr: { examples: ["Je vais à l’école en bus.", "Nous y allons à pied."] }, de: { examples: ["Ich fahre mit dem Bus zur Schule.", "Wir gehen zu Fuß."] }, it: { examples: ["Vado a scuola in autobus.", "Andiamo a piedi."] }, pl: { examples: ["Do szkoły jeżdżę autobusem.", "Idziemy pieszo."] }, tr: { examples: ["Okula otobüsle giderim.", "Yürüyerek gideriz."] }, id: { examples: ["Saya pergi ke sekolah naik bus.", "Kami berjalan kaki."] }, vi: { examples: ["Tôi đến trường bằng xe buýt.", "Chúng tôi đi bộ."] } } }
          - { level: A2, use: { examples: [{ pattern: ["on", "bus, train, plane, bike"] }, { pattern: [in, "car, taxi"] }] }, ex: { examples: [["I'm ", { target: "on" }, " the train."], ["She's ", { target: in }, " the car."]] }, tr: { uk: { examples: ["Я в потязі.", "Вона в машині."] }, es: { examples: ["Estoy en el tren.", "Ella está en el auto."] }, pt: { examples: ["Estou no trem.", "Ela está no carro."] }, fr: { examples: ["Je suis dans le train.", "Elle est dans la voiture."] }, de: { examples: ["Ich bin im Zug.", "Sie ist im Auto."] }, it: { examples: ["Sono sul treno.", "Lei è in macchina."] }, pl: { examples: ["Jestem w pociągu.", "Ona jest w samochodzie."] }, tr: { examples: ["Trendeyim.", "O arabada."] }, id: { examples: ["Saya ada di dalam kereta.", "Dia ada di dalam mobil."] }, vi: { examples: ["Tôi đang ở trên tàu.", "Cô ấy đang ở trong xe."] } } }

  - title: { en: Abstract and figurative uses, uk: "Абстрактне й переносне вживання", es: "Usos abstractos y figurados", pt: "Usos abstratos e figurados", fr: "Emplois abstraits et figurés", de: "Abstrakter und übertragener Gebrauch", it: "Usi astratti e figurati", pl: "Użycia abstrakcyjne i przenośne", tr: "Soyut ve mecazi kullanımlar", id: "Penggunaan abstrak dan kiasan", vi: "Cách dùng trừu tượng và nghĩa bóng" }
    role: own
