          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, use: { pattern: [in, { slot: { en: "room, building, town, country", uk: "кімната, будівля, місто, країна", es: "habitación, edificio, ciudad, país", pt: "cômodo, edifício, cidade, país", fr: "pièce, bâtiment, ville, pays", de: "Zimmer, Gebäude, Stadt, Land", it: "stanza, edificio, città, paese", pl: "pokój, budynek, miasto, kraj", tr: "oda, bina, şehir, ülke", id: "ruangan, bangunan, kota, negara", vi: "phòng, tòa nhà, thị trấn, quốc gia" } }] }, ex: { examples: [["He lives ", { target: in }, " Madrid."], ["It's ", { target: in }, " the kitchen."]] }, tr: { uk: { examples: ["Він живе в Мадриді.", "Це на кухні."] }, es: { examples: ["Él vive en Madrid.", "Está en la cocina."] }, pt: { examples: ["Ele mora em Madri.", "Está na cozinha."] }, fr: { examples: ["Il habite à Madrid.", "Il est dans la cuisine."] }, de: { examples: ["Er wohnt in Madrid.", "Es ist in der Küche."] }, it: { examples: ["Vive a Madrid.", "È in cucina."] }, pl: { examples: ["On mieszka w Madrycie.", "To jest w kuchni."] }, tr: { examples: ["Madrid’de yaşıyor.", "Mutfakta."] }, id: { examples: ["Dia tinggal di Madrid.", "Itu ada di dapur."] }, vi: { examples: ["Anh ấy sống ở Madrid.", "Nó ở trong bếp."] } } }
          - { level: A1, use: { pattern: [in, "bed, hospital"] }, ex: ["I'm ", { target: in }, " bed. ", { variant: { target: in the hospital }, variety: en-US }], tr: { uk: "Я в ліжку.", es: "Estoy en la cama.", pt: "Estou na cama.", fr: "Je suis au lit.", de: "Ich liege im Bett.", it: "Sono a letto.", pl: "Jestem w łóżku.", tr: "Yataktayım.", id: "Saya ada di tempat tidur.", vi: "Tôi đang ở trên giường." } }
          - { level: A1, use: { pattern: ["on", { slot: { en: "surface, wall, floor", uk: "поверхня, стіна, підлога", es: "superficie, pared, suelo", pt: "superfície, parede, chão", fr: "surface, mur, sol", de: "Fläche, Wand, Boden", it: "superficie, parete, pavimento", pl: "powierzchnia, ściana, podłoga", tr: "yüzey, duvar, zemin", id: "permukaan, dinding, lantai", vi: "bề mặt, tường, sàn" } }] }, ex: ["The picture is ", { target: "on" }, " the wall."], tr: { uk: "Картина на стіні.", es: "El cuadro está en la pared.", pt: "O quadro está na parede.", fr: "Le tableau est au mur.", de: "Das Bild hängt an der Wand.", it: "Il quadro è sulla parete.", pl: "Obraz wisi na ścianie.", tr: "Tablo duvarda.", id: "Lukisan itu ada di dinding.", vi: "Bức tranh ở trên tường." } }
          - { level: A1, use: { pattern: [at, "home, work, school, university"] }, ex: { examples: [["She's ", { target: at }, " home."], ["He's ", { target: at }, " work."]] }, tr: { uk: { examples: ["Вона вдома.", "Він на роботі."] }, es: { examples: ["Ella está en casa.", "Él está en el trabajo."] }, pt: { examples: ["Ela está em casa.", "Ele está no trabalho."] }, fr: { examples: ["Elle est à la maison.", "Il est au travail."] }, de: { examples: ["Sie ist zu Hause.", "Er ist auf der Arbeit."] }, it: { examples: ["Lei è a casa.", "Lui è al lavoro."] }, pl: { examples: ["Ona jest w domu.", "On jest w pracy."] }, tr: { examples: ["O evde.", "O işte."] }, id: { examples: ["Dia ada di rumah.", "Dia ada di tempat kerja."] }, vi: { examples: ["Cô ấy ở nhà.", "Anh ấy ở chỗ làm."] } } }
          - { level: A1, use: { pattern: [at, { slot: { en: point or event, uk: "точка або подія", es: "punto o evento", pt: "ponto ou evento", fr: "point ou événement", de: "Punkt oder Ereignis", it: "punto o evento", pl: "punkt lub wydarzenie", tr: "nokta ya da etkinlik", id: "titik atau acara", vi: "điểm hoặc sự kiện" } }] }, ex: { examples: [["I'm ", { target: at }, " the bus stop."], ["We're ", { target: at }, " a party."]] }, tr: { uk: { examples: ["Я на автобусній зупинці.", "Ми на вечірці."] }, es: { examples: ["Estoy en la parada de autobús.", "Estamos en una fiesta."] }, pt: { examples: ["Estou no ponto de ônibus.", "Estamos em uma festa."] }, fr: { examples: ["Je suis à l’arrêt de bus.", "Nous sommes à une fête."] }, de: { examples: ["Ich bin an der Bushaltestelle.", "Wir sind auf einer Party."] }, it: { examples: ["Sono alla fermata dell'autobus.", "Siamo a una festa."] }, pl: { examples: ["Jestem na przystanku autobusowym.", "Jesteśmy na przyjęciu."] }, tr: { examples: ["Otobüs durağındayım.", "Bir partideyiz."] }, id: { examples: ["Saya ada di halte bus.", "Kami ada di sebuah pesta."] }, vi: { examples: ["Tôi đang ở trạm xe buýt.", "Chúng tôi đang ở một bữa tiệc."] } } }
      - type: list
        items:
