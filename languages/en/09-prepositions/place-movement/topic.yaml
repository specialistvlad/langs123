            tr: { uk: "Його обрали на підставі результатів тесту.", es: "Lo eligieron con base en los resultados de su examen.", pt: "Eles o escolheram com base nos resultados do teste dele.", fr: "Ils l’ont choisi sur la base de ses résultats au test.", de: "Sie wählten ihn aufgrund seiner Testergebnisse aus.", it: "L'hanno scelto in base ai risultati del suo test.", pl: "Wybrali go na podstawie wyników jego testu.", tr: "Onu test sonuçlarına dayanarak seçtiler.", id: "Mereka memilihnya berdasarkan hasil tesnya.", vi: "Họ chọn anh ấy dựa trên kết quả bài kiểm tra." }

