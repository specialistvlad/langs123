            meaning: { en: "using something as the reason or the evidence", uk: "коли щось слугує підставою чи доказом", es: "usar algo como razón o como prueba", pt: "usando algo como motivo ou como prova", fr: "en se servant de quelque chose comme raison ou comme preuve", de: "etwas als Grund oder als Beleg nehmen", it: "usando qualcosa come ragione o come prova", pl: "używanie czegoś jako powodu lub dowodu", tr: "bir şeyi gerekçe ya da kanıt olarak kullanarak", id: "memakai sesuatu sebagai alasan atau bukti", vi: "lấy điều gì đó làm lý do hoặc bằng chứng" }
