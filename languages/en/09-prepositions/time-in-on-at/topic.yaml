title: { en: "Time: In, On, At", uk: "Прийменники часу: in, on, at", es: "Preposiciones de tiempo: in, on, at", pt: "Preposições de tempo: in, on, at", fr: "Prépositions de temps : in, on, at", de: "Präpositionen der Zeit: in, on, at", it: "Preposizioni di tempo: in, on, at", pl: "Przyimki czasu: in, on, at", tr: "Zaman edatları: in, on, at", id: "Kata depan waktu: in, on, at", vi: "Giới từ chỉ thời gian: in, on, at" }
summary:
  lead:
    en: [{ term: At }, " goes with clock times, ", { term: "on" }, " with days and dates, and ", { term: in }, " with months, years and seasons."]
    uk: [{ term: At }, " вживається з точним часом, ", { term: "on" }, " — з днями й датами, ", { term: in }, " — з місяцями, роками й порами року."]
    es: [{ term: At }, " va con las horas, ", { term: "on" }, " con días y fechas, e ", { term: in }, " con meses, años y estaciones."]
    pt: [{ term: "At" }, " vai com horas do relógio, ", { term: "on" }, " com dias e datas, e ", { term: "in" }, " com meses, anos e estações."]
    fr: [{ term: "At" }, " va avec les heures, ", { term: "on" }, " avec les jours et les dates, ", { term: "in" }, " avec les mois, les années et les saisons."]
    de: [{ term: "At" }, " steht bei Uhrzeiten, ", { term: "on" }, " bei Tagen und Datumsangaben und ", { term: "in" }, " bei Monaten, Jahren und Jahreszeiten."]
    it: [{ term: "At" }, " si usa con gli orari, ", { term: "on" }, " con i giorni e le date, ", { term: "in" }, " con mesi, anni e stagioni."]
    pl: [{ term: "At" }, " łączy się z godzinami, ", { term: "on" }, " z dniami i datami, a ", { term: "in" }, " z miesiącami, latami i porami roku."]
    tr: [{ term: "At" }, " saatlerle, ", { term: "on" }, " günler ve tarihlerle, ", { term: "in" }, " ise aylar, yıllar ve mevsimlerle kullanılır."]
    id: [{ term: "At" }, " dipakai dengan jam, ", { term: "on" }, " dengan hari dan tanggal, dan ", { term: "in" }, " dengan bulan, tahun, dan musim."]
    vi: [{ term: "At" }, " đi với giờ đồng hồ, ", { term: "on" }, " đi với thứ và ngày tháng, còn ", { term: "in" }, " đi với tháng, năm và mùa."]
  rule:
    en: ["The period gets longer from ", { term: at }, " to ", { term: "on" }, " to ", { term: in }, ", and ", { term: next }, ", ", { term: last }, ", ", { term: this }, " and ", { term: every }, " take no preposition:"]
    uk: ["Період довшає від ", { term: at }, " до ", { term: "on" }, " і до ", { term: in }, ", а ", { term: next }, ", ", { term: last }, ", ", { term: this }, " і ", { term: every }, " прийменника не мають:"]
    es: ["El período se alarga de ", { term: at }, " a ", { term: "on" }, " y a ", { term: in }, ", y ", { term: next }, ", ", { term: last }, ", ", { term: this }, " y ", { term: every }, " no llevan preposición:"]
    pt: ["O período fica mais longo de ", { term: "at" }, " para ", { term: "on" }, " e para ", { term: "in" }, ", e ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " e ", { term: "every" }, " não levam preposição:"]
    fr: ["La période s’allonge de ", { term: "at" }, " à ", { term: "on" }, " puis ", { term: "in" }, ", et ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " et ", { term: "every" }, " se passent de préposition :"]
    de: ["Die Zeitspanne wird länger von ", { term: "at" }, " über ", { term: "on" }, " zu ", { term: "in" }, ", und ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " und ", { term: "every" }, " stehen ohne Präposition:"]
    it: ["Il periodo si allunga da ", { term: "at" }, " a ", { term: "on" }, " e a ", { term: "in" }, ", e ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " e ", { term: "every" }, " non hanno preposizione:"]
    pl: ["Okres wydłuża się od ", { term: "at" }, " przez ", { term: "on" }, " do ", { term: "in" }, ", a ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " i ", { term: "every" }, " nie mają przyimka:"]
    tr: ["Zaman aralığı ", { term: "at" }, ", ", { term: "on" }, ", ", { term: "in" }, " sırasıyla uzar; ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " ve ", { term: "every" }, " ile edat kullanılmaz:"]
    id: ["Rentang waktunya makin panjang dari ", { term: "at" }, " ke ", { term: "on" }, " ke ", { term: "in" }, ", dan ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " serta ", { term: "every" }, " tidak memakai kata depan:"]
    vi: ["Khoảng thời gian dài dần từ ", { term: "at" }, " đến ", { term: "on" }, " rồi ", { term: "in" }, "; ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, ", ", { term: "every" }, " không dùng giới từ:"]
  ex: { examples: [[{ target: at }, " 7 o'clock"], [{ target: "on" }, " ", { weekday: Monday, value: 1 }], [{ target: in }, " ", { date: July, value: "--07" }], [{ target: next }, " ", { weekday: Friday, value: 5 }, "."]] }

