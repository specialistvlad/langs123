            tr: { uk: { examples: ["Поговоримо після обіду.", "Вона зателефонувала через два дні після вечірки."] }, es: { examples: ["Hablamos después del almuerzo.", "Ella llamó dos días después de la fiesta."] }, pt: { examples: ["Conversamos depois do almoço.", "Ela ligou dois dias depois da festa."] }, fr: { examples: ["Nous en parlerons après le déjeuner.", "Elle a appelé deux jours après la fête."] }, de: { examples: ["Wir sprechen nach dem Mittagessen darüber.", "Sie rief zwei Tage nach der Party an."] }, it: { examples: ["Ne parliamo dopo pranzo.", "Ha chiamato due giorni dopo la festa."] }, pl: { examples: ["Porozmawiamy po lunchu.", "Zadzwoniła dwa dni po przyjęciu."] }, tr: { examples: ["Öğle yemeğinden sonra konuşuruz.", "Partiden iki gün sonra aradı."] }, id: { examples: ["Kita bicara setelah makan siang.", "Dia menelepon dua hari setelah pesta."] }, vi: { examples: ["Chúng ta sẽ nói chuyện sau bữa trưa.", "Cô ấy gọi điện hai ngày sau bữa tiệc."] } }
