    de: ["Die Zeitspanne wird länger von ", { term: "at" }, " über ", { term: "on" }, " zu ", { term: "in" }, ", und ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " und ", { term: "every" }, " stehen ohne Präposition:"]
    it: ["Il periodo si allunga da ", { term: "at" }, " a ", { term: "on" }, " e a ", { term: "in" }, ", e ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " e ", { term: "every" }, " non hanno preposizione:"]
    pl: ["Okres wydłuża się od ", { term: "at" }, " przez ", { term: "on" }, " do ", { term: "in" }, ", a ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " i ", { term: "every" }, " nie mają przyimka:"]
    tr: ["Zaman aralığı ", { term: "at" }, ", ", { term: "on" }, ", ", { term: "in" }, " sırasıyla uzar; ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " ve ", { term: "every" }, " ile edat kullanılmaz:"]
    id: ["Rentang waktunya makin panjang dari ", { term: "at" }, " ke ", { term: "on" }, " ke ", { term: "in" }, ", dan ", { term: "next" }, ", ", { term: "last" }, ", ", { term: "this" }, " serta ", { term: "every" }, " tidak memakai kata depan:"]
