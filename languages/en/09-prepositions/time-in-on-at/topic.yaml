            tr: { uk: { contrast: ["Наприкінці дня я почуваюся втомленим.", "Зрештою ми взяли таксі."] }, es: { contrast: ["Me siento cansado al final del día.", "Al final, tomamos un taxi."] }, pt: { contrast: ["Sinto-me cansado no fim do dia.", "No fim, pegamos um táxi."] }, fr: { contrast: ["Je me sens fatigué à la fin de la journée.", "Finalement, nous avons pris un taxi."] }, de: { contrast: ["Am Ende des Tages bin ich müde.", "Am Ende haben wir ein Taxi genommen."] }, it: { contrast: ["Mi sento stanco alla fine della giornata.", "Alla fine abbiamo preso un taxi."] }, pl: { contrast: ["Pod koniec dnia czuję się zmęczony.", "W końcu wzięliśmy taksówkę."] }, tr: { contrast: ["Günün sonunda yorgun hissediyorum.", "Sonunda taksiye bindik."] }, id: { contrast: ["Saya merasa lelah di penghujung hari.", "Akhirnya, kami naik taksi."] }, vi: { contrast: ["Cuối ngày tôi thấy mệt.", "Cuối cùng, chúng tôi bắt taxi."] } }
          - level: B2
