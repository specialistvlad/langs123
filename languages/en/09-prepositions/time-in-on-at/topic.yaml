title: { en: "Time: In, On, At", uk: "Прийменники часу: in, on, at", es: "Preposiciones de tiempo: in, on, at", pt: "Preposições de tempo: in, on, at", fr: "Prépositions de temps : in, on, at", de: "Präpositionen der Zeit: in, on, at", it: "Preposizioni di tempo: in, on, at", pl: "Przyimki czasu: in, on, at", tr: "Zaman edatları: in, on, at", id: "Kata depan waktu: in, on, at", vi: "Giới từ chỉ thời gian: in, on, at" }
summary:
  lead:
    en: [{ term: At }, " goes with clock times, ", { term: "on" }, " with days and dates, and ", { term: in }, " with months, years and seasons."]
    uk: [{ term: At }, " вживається з точним часом, ", { term: "on" }, " — з днями й датами, ", { term: in }, " — з місяцями, роками й порами року."]
    es: [{ term: At }, " va con las horas, ", { term: "on" }, " con días y fechas, e ", { term: in }, " con meses, años y estaciones."]
    pt: [{ term: "At" }, " vai com horas do relógio, ", { term: "on" }, " com dias e datas, e ", { term: "in" }, " com meses, anos e estações."]
    fr: [{ term: "At" }, " va avec les heures, ", { term: "on" }, " avec les jours et les dates, ", { term: "in" }, " avec les mois, les années et les saisons."]
    de: [{ term: "At" }, " steht bei Uhrzeiten, ", { term: "on" }, " bei Tagen und Datumsangaben und ", { term: "in" }, " bei Monaten, Jahren und Jahreszeiten."]
    it: [{ term: "At" }, " si usa con gli orari, ", { term: "on" }, " con i giorni e le date, ", { term: "in" }, " con mesi, anni e stagioni."]
    pl: [{ term: "At" }, " łączy się z godzinami, ", { term: "on" }, " z dniami i datami, a ", { term: "in" }, " z miesiącami, latami i porami roku."]
    tr: [{ term: "At" }, " saatlerle, ", { term: "on" }, " günler ve tarihlerle, ", { term: "in" }, " ise aylar, yıllar ve mevsimlerle kullanılır."]
    id: [{ term: "At" }, " dipakai dengan jam, ", { term: "on" }, " dengan hari dan tanggal, dan ", { term: "in" }, " dengan bulan, tahun, dan musim."]
    vi: [{ term: "At" }, " đi với giờ đồng hồ, ", { term: "on" }, " đi với thứ và ngày tháng, còn ", { term: "in" }, " đi với tháng, năm và mùa."]
