          rule: { en: [{ term: "would have" }, " for the result of an unreal past condition"], uk: [{ term: "would have" }, " — для результату нереальної умови в минулому"], es: [{ term: "would have" }, " para el resultado de una condición irreal en el pasado"], pt: [{ term: "would have" }, " para o resultado de uma condição irreal no passado"], fr: [{ term: "would have" }, " pour le résultat d’une condition irréelle au passé"], de: [{ term: "would have" }, " für das Ergebnis einer irrealen Bedingung in der Vergangenheit"], it: [{ term: "would have" }, " per il risultato di una condizione irreale nel passato"], pl: [{ term: "would have" }, " dla skutku nierealnego warunku w przeszłości"], tr: [{ term: "would have" }, " geçmişteki gerçek dışı bir koşulun sonucu için kullanılır"], id: [{ term: "would have" }, " untuk akibat dari syarat yang tidak nyata di masa lampau"], vi: [{ term: "would have" }, " cho kết quả của điều kiện không có thật trong quá khứ"] }
          ex: ["If I had known, I ", { target: "would have called" }, "."]
          tr: { uk: "Якби я знав, я б зателефонував.", es: "Si lo hubiera sabido, habría llamado.", pt: "Se eu soubesse, teria ligado.", fr: "Si j’avais su, j’aurais appelé.", de: "Wenn ich es gewusst hätte, hätte ich angerufen.", it: "Se l'avessi saputo, avrei chiamato.", pl: "Gdybym wiedział, zadzwoniłbym.", tr: "Bilseydim arardım.", id: "Kalau saya tahu, saya pasti sudah menelepon.", vi: "Nếu tôi biết, tôi đã gọi điện rồi." }
        - level: C1
          point: { en: "Passive and continuous", uk: "Пасивний стан і тривала форма", es: "Voz pasiva y forma continua", pt: "Voz passiva e forma contínua", fr: "Passif et forme continue", de: "Passiv und Verlaufsform", it: "Forma passiva e forma continua", pl: "Strona bierna i forma ciągła", tr: "Edilgen ve sürekli biçim", id: "Pasif dan continuous", vi: "Bị động và tiếp diễn" }
          rule: { en: ["after any modal: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: past participle }, { slot: V-ing }] }] }], uk: ["після будь-якого модального дієслова: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], es: ["después de cualquier modal: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], pt: ["depois de qualquer modal: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], fr: ["après n’importe quel modal : ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], de: ["nach jedem Modalverb: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], it: ["dopo qualsiasi modale: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], pl: ["po każdym czasowniku modalnym: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], tr: ["her modal fiilden sonra: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], id: ["setelah kata kerja modal apa pun: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }], vi: ["sau bất kỳ động từ khuyết thiếu nào: ", { pattern: [{ term: "have been" }, { alternatives: [{ slot: "past participle" }, { slot: "V-ing" }] }] }] }
          ex: { examples: [["It ", { target: "must have been lost" }, "."], ["She ", { target: "can't have been sleeping" }, "."]] }
          tr: { uk: { examples: ["Воно, певно, загубилося.", "Вона не могла спати."] }, es: { examples: ["Debe de haberse perdido.", "No puede haber estado durmiendo."] }, pt: { examples: ["Deve ter sido perdido.", "Ela não pode ter estado dormindo."] }, fr: { examples: ["Il a dû se perdre.", "Elle ne dormait sûrement pas."] }, de: { examples: ["Es muss verloren gegangen sein.", "Sie kann nicht geschlafen haben."] }, it: { examples: ["Deve essersi perso.", "Non stava di certo dormendo."] }, pl: { examples: ["Musiało się zgubić.", "Nie mogła spać."] }, tr: { examples: ["Kaybolmuş olmalı.", "Uyuyor olamazdı."] }, id: { examples: ["Itu pasti hilang.", "Dia tidak mungkin sedang tidur."] }, vi: { examples: ["Chắc nó đã bị mất.", "Cô ấy không thể đang ngủ."] } }
        - level: C1
          point: { en: "Adverb inside", uk: "Прислівник усередині форми", es: "Adverbio dentro de la forma", pt: "Advérbio dentro da forma", fr: "Adverbe dans la forme", de: "Adverb in der Form", it: "Avverbio dentro la forma", pl: "Przysłówek wewnątrz formy", tr: "Biçimin içindeki zarf", id: "Adverbia di dalam bentuk", vi: "Trạng từ trong cấu trúc" }
          rule: { en: [{ term: "may well have" }, ": quite likely; ", { term: "can't possibly have" }, ": impossible"], uk: [{ term: "may well have" }, ": цілком імовірно; ", { term: "can't possibly have" }, ": неможливо"], es: [{ term: "may well have" }, ": muy probable; ", { term: "can't possibly have" }, ": imposible"], pt: [{ term: "may well have" }, ": bem provável; ", { term: "can't possibly have" }, ": impossível"], fr: [{ term: "may well have" }, " : très probable ; ", { term: "can't possibly have" }, " : impossible"], de: [{ term: "may well have" }, ": ziemlich wahrscheinlich; ", { term: "can't possibly have" }, ": unmöglich"], it: [{ term: "may well have" }, ": molto probabile; ", { term: "can't possibly have" }, ": impossibile"], pl: [{ term: "may well have" }, ": całkiem prawdopodobne; ", { term: "can't possibly have" }, ": niemożliwe"], tr: [{ term: "may well have" }, ": büyük olasılıkla; ", { term: "can't possibly have" }, ": imkânsız"], id: [{ term: "may well have" }, ": sangat mungkin; ", { term: "can't possibly have" }, ": mustahil"], vi: [{ term: "may well have" }, ": rất có khả năng; ", { term: "can't possibly have" }, ": không thể nào"] }
          ex: { examples: [["She ", { target: "may well have forgotten" }, "."], ["You ", { target: "can't possibly have finished" }, "."]] }
          tr: { uk: { examples: ["Вона цілком могла забути.", "Ти ніяк не міг закінчити."] }, es: { examples: ["Es muy probable que lo haya olvidado.", "Es imposible que hayas terminado."] }, pt: { examples: ["Ela pode muito bem ter esquecido.", "Você não pode ter terminado de jeito nenhum."] }, fr: { examples: ["Elle a très bien pu oublier.", "Tu ne peux vraiment pas avoir fini."] }, de: { examples: ["Sie hat es sehr wahrscheinlich vergessen.", "Du kannst unmöglich fertig geworden sein."] }, it: { examples: ["Potrebbe benissimo averlo dimenticato.", "Non puoi assolutamente aver finito."] }, pl: { examples: ["Mogła równie dobrze zapomnieć.", "Nie mogłeś w żaden sposób skończyć."] }, tr: { examples: ["Unutmuş olması çok olası.", "Bitirmiş olman mümkün değil."] }, id: { examples: ["Dia sangat mungkin lupa.", "Kamu tidak mungkin sudah selesai."] }, vi: { examples: ["Rất có thể cô ấy đã quên.", "Bạn không thể nào đã xong rồi."] } }
        - level: C1
          point: { en: "Expectation and estimate", uk: "Очікування й оцінка", es: "Expectativa y cálculo", pt: "Expectativa e estimativa", fr: "Attente et estimation", de: "Erwartung und Schätzung", it: "Aspettativa e stima", pl: "Oczekiwanie i szacunek", tr: "Beklenti ve tahmin", id: "Harapan dan perkiraan", vi: "Kỳ vọng và ước đoán" }
          rule: { en: [{ term: "should have" }, ": expected by now; ", { term: "would have" }, ": an estimate"], uk: [{ term: "should have" }, ": до цього часу мало статися; ", { term: "would have" }, ": приблизна оцінка"], es: [{ term: "should have" }, ": se esperaba para ahora; ", { term: "would have" }, ": un cálculo"], pt: [{ term: "should have" }, ": era esperado até agora; ", { term: "would have" }, ": uma estimativa"], fr: [{ term: "should have" }, " : attendu à présent ; ", { term: "would have" }, " : une estimation"], de: [{ term: "should have" }, ": bis jetzt zu erwarten; ", { term: "would have" }, ": eine Schätzung"], it: [{ term: "should have" }, ": previsto entro adesso; ", { term: "would have" }, ": una stima"], pl: [{ term: "should have" }, ": spodziewane do tej pory; ", { term: "would have" }, ": szacunek"], tr: [{ term: "should have" }, ": şimdiye kadar beklenen; ", { term: "would have" }, ": bir tahmin"], id: [{ term: "should have" }, ": seharusnya sudah terjadi sekarang; ", { term: "would have" }, ": sebuah perkiraan"], vi: [{ term: "should have" }, ": lẽ ra đã xảy ra đến giờ; ", { term: "would have" }, ": một ước đoán"] }
          ex: { examples: [["It ", { target: "should have arrived" }, " by now."], ["That ", { target: "would have been" }, " ten years ago."]] }
          tr: { uk: { examples: ["Воно вже мало прибути.", "Це, певно, було років десять тому."] }, es: { examples: ["Ya debería haber llegado.", "Eso habrá sido hace diez años."] }, pt: { examples: ["Já deveria ter chegado.", "Isso deve ter sido há dez anos."] }, fr: { examples: ["Cela aurait déjà dû arriver.", "Cela devait remonter à dix ans."] }, de: { examples: ["Es müsste inzwischen angekommen sein.", "Das war wohl vor zehn Jahren."] }, it: { examples: ["Dovrebbe essere già arrivato.", "Sarà stato dieci anni fa."] }, pl: { examples: ["Powinno już dotrzeć.", "To było chyba dziesięć lat temu."] }, tr: { examples: ["Şimdiye kadar gelmiş olmalı.", "Bu herhalde on yıl önceydi."] }, id: { examples: ["Seharusnya sudah tiba sekarang.", "Itu mungkin sepuluh tahun yang lalu."] }, vi: { examples: ["Lẽ ra giờ này nó đã đến rồi.", "Chuyện đó chắc là mười năm trước."] } }
        - level: C1
          point: { en: "Plan that failed", uk: "План, що не здійснився", es: "Plan que fracasó", pt: "Plano que não deu certo", fr: "Projet qui n’a pas abouti", de: "Gescheiterter Plan", it: "Piano non realizzato", pl: "Plan, który się nie udał", tr: "Gerçekleşmeyen plan", id: "Rencana yang gagal", vi: "Kế hoạch không thành" }
          rule: { en: [{ pattern: [{ term: "was to have" }, { slot: past participle }] }, ": planned, but it did not happen"], uk: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": заплановано, але не сталося"], es: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": estaba planeado, pero no ocurrió"], pt: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": estava planejado, mas não aconteceu"], fr: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, " : prévu, mais cela ne s’est pas produit"], de: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": geplant, aber nicht geschehen"], it: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": previsto, ma non è successo"], pl: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": zaplanowane, ale się nie stało"], tr: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": planlanmıştı ama gerçekleşmedi"], id: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": direncanakan, tetapi tidak terjadi"], vi: [{ pattern: [{ term: "was to have" }, { slot: "past participle" }] }, ": đã được lên kế hoạch nhưng không xảy ra"] }
          ex: ["The bridge ", { target: "was to have opened" }, " in May."]
          tr: { uk: "Міст мали відкрити в травні.", es: "El puente iba a abrirse en mayo.", pt: "A ponte seria inaugurada em maio.", fr: "Le pont devait ouvrir en mai.", de: "Die Brücke sollte im Mai eröffnet werden.", it: "Il ponte doveva aprire a maggio.", pl: "Most miał zostać otwarty w maju.", tr: "Köprü Mayıs’ta açılacaktı.", id: "Jembatan itu direncanakan dibuka pada bulan Mei.", vi: "Cây cầu dự kiến khai trương vào tháng Năm." }
        - level: B2
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: ["write ", { term: have }, " or ", { term: "'ve" }, ", never ", { term: of }], uk: ["пиши ", { term: "have" }, " або ", { term: "'ve" }, ", ніколи ", { term: "of" }], es: ["escribe ", { term: "have" }, " o ", { term: "'ve" }, ", nunca ", { term: "of" }], pt: ["escreve-se ", { term: "have" }, " ou ", { term: "'ve" }, ", nunca ", { term: "of" }], fr: ["on écrit ", { term: "have" }, " ou ", { term: "'ve" }, ", jamais ", { term: "of" }], de: ["man schreibt ", { term: "have" }, " oder ", { term: "'ve" }, ", nie ", { term: "of" }], it: ["si scrive ", { term: "have" }, " o ", { term: "'ve" }, ", mai ", { term: "of" }], pl: ["pisze się ", { term: "have" }, " lub ", { term: "'ve" }, ", nigdy ", { term: "of" }], tr: [{ term: "have" }, " ya da ", { term: "'ve" }, " yazılır, hiçbir zaman ", { term: "of" }, " yazılmaz"], id: ["tulis ", { term: "have" }, " atau ", { term: "'ve" }, ", jangan pernah ", { term: "of" }], vi: ["viết ", { term: "have" }, " hoặc ", { term: "'ve" }, ", không bao giờ viết ", { term: "of" }] }
          ex: ["You ", { target: "should've" }, " called."]
          tr: { uk: "Тобі слід було зателефонувати.", es: "Deberías haber llamado.", pt: "Você deveria ter ligado.", fr: "Tu aurais dû appeler.", de: "Du hättest anrufen sollen.", it: "Avresti dovuto chiamare.", pl: "Powinieneś był zadzwonić.", tr: "Aramalıydın.", id: "Seharusnya kamu menelepon.", vi: "Lẽ ra bạn nên gọi điện." }

sections:
  - title: { en: "Form: the modal perfect", uk: "Форма: модальне дієслово з have і 3-тя форма", es: "Forma: modal con have y participio", pt: "Forma: modal com have e particípio", fr: "Forme : modal avec have et participe passé", de: "Form: Modalverb mit have und Past Participle", it: "Forma: modale con have e participio passato", pl: "Forma: czasownik modalny z have i III forma", tr: "Biçim: modal fiil, have ve past participle", id: "Bentuk: kata kerja modal dengan have dan past participle", vi: "Dạng: động từ khuyết thiếu với have và quá khứ phân từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: "Form", uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: pattern, label: { en: "Pattern", uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, features: { polarity: pos, interrogativity: decl }, form: { en: "Affirmative", uk: "Ствердження", es: "Afirmación", pt: "Afirmação", fr: "Affirmation", de: "Bejahung", it: "Affermazione", pl: "Twierdzenie", tr: "Olumlu", id: "Positif", vi: "Khẳng định" }, pattern: { pattern: [{ slot: subject }, { alternatives: [must, should, could, might] }, have, { slot: past participle }] }, ex: ["She ", { target: "should have called" }, "."] }
          - { level: B2, features: { polarity: neg, interrogativity: decl }, form: { en: "Negative", uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [{ slot: subject }, { alternatives: ["can't", "couldn't", "shouldn't", "needn't"] }, have, { slot: past participle }] }, ex: ["You ", { target: "shouldn't have waited" }, "."] }
          - { level: B2, features: { polarity: pos, interrogativity: int }, form: { en: "Question", uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }, pattern: { pattern: [{ alternatives: [Should, Could, Would] }, { slot: subject }, have, { slot: past participle }] }, ex: [{ target: "Should" }, " I ", { target: "have called" }, "?"] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["The modal and ", { term: have }, " keep one form for every subject:"], uk: ["Модальне дієслово й ", { term: "have" }, " мають одну форму для всіх підметів:"], es: ["El modal y ", { term: "have" }, " tienen una sola forma para todos los sujetos:"], pt: ["O modal e ", { term: "have" }, " têm uma só forma para todos os sujeitos:"], fr: ["Le modal et ", { term: "have" }, " gardent une seule forme pour tous les sujets :"], de: ["Das Modalverb und ", { term: "have" }, " haben für alle Subjekte eine Form:"], it: ["Il verbo modale e ", { term: "have" }, " hanno una sola forma per tutti i soggetti:"], pl: ["Czasownik modalny i ", { term: "have" }, " mają jedną formę dla wszystkich podmiotów:"], tr: ["Modal fiil ve ", { term: "have" }, " her özne için aynı biçimde kalır:"], id: ["Kata kerja modal dan ", { term: "have" }, " hanya punya satu bentuk untuk semua subjek:"], vi: ["Động từ khuyết thiếu và ", { term: "have" }, " chỉ có một dạng cho mọi chủ ngữ:"] }
            ex: { examples: [["I ", { target: "should have" }, " gone."], ["They ", { target: "should have" }, " gone."]] }
            tr: { uk: { examples: ["Мені слід було піти.", "Їм слід було піти."] }, es: { examples: ["Yo debería haber ido.", "Ellos deberían haber ido."] }, pt: { examples: ["Eu deveria ter ido.", "Eles deveriam ter ido."] }, fr: { examples: ["J’aurais dû partir.", "Ils auraient dû partir."] }, de: { examples: ["Ich hätte gehen sollen.", "Sie hätten gehen sollen."] }, it: { examples: ["Avrei dovuto andare.", "Avrebbero dovuto andare."] }, pl: { examples: ["Powinienem był iść.", "Powinni byli iść."] }, tr: { examples: ["Gitmem gerekirdi.", "Gitmeleri gerekirdi."] }, id: { examples: ["Seharusnya saya pergi.", "Seharusnya mereka pergi."] }, vi: { examples: ["Lẽ ra tôi nên đi.", "Lẽ ra họ nên đi."] } }
          - type: rule
            level: B2
            text: { en: [{ term: may }, " and ", { term: might }, " take ", { term: not }, " as a separate word:"], uk: [{ term: "may" }, " і ", { term: "might" }, " беруть ", { term: "not" }, " як окреме слово:"], es: [{ term: "may" }, " y ", { term: "might" }, " llevan ", { term: "not" }, " como palabra separada:"], pt: [{ term: "may" }, " e ", { term: "might" }, " levam ", { term: "not" }, " como palavra separada:"], fr: [{ term: "may" }, " et ", { term: "might" }, " prennent ", { term: "not" }, " comme mot séparé :"], de: [{ term: "may" }, " und ", { term: "might" }, " nehmen ", { term: "not" }, " als eigenes Wort:"], it: [{ term: "may" }, " e ", { term: "might" }, " prendono ", { term: "not" }, " come parola separata:"], pl: [{ term: "may" }, " i ", { term: "might" }, " przyjmują ", { term: "not" }, " jako osobne słowo:"], tr: [{ term: "may" }, " ve ", { term: "might" }, " ile ", { term: "not" }, " ayrı bir sözcük olarak kullanılır:"], id: [{ term: "may" }, " dan ", { term: "might" }, " diikuti ", { term: "not" }, " sebagai kata terpisah:"], vi: [{ term: "may" }, " và ", { term: "might" }, " đi với ", { term: "not" }, " như một từ riêng:"] }
            ex: ["She ", { target: "might not have" }, " heard."]
            tr: { uk: "Можливо, вона не почула.", es: "Puede que ella no lo haya oído.", pt: "Talvez ela não tenha ouvido.", fr: "Elle n’a peut-être pas entendu.", de: "Vielleicht hat sie es nicht gehört.", it: "Forse non ha sentito.", pl: "Może nie usłyszała.", tr: "Duymamış olabilir.", id: "Mungkin dia tidak mendengarnya.", vi: "Có thể cô ấy đã không nghe thấy." }

  - title: { en: "Form: short forms", uk: "Форма: скорочені форми", es: "Forma: formas contraídas", pt: "Forma: formas contraídas", fr: "Forme : formes contractées", de: "Form: Kurzformen", it: "Forma: forme contratte", pl: "Forma: formy skrócone", tr: "Biçim: kısa biçimler", id: "Bentuk: bentuk singkat", vi: "Dạng: các dạng rút gọn" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: full, label: { en: "Full form", uk: "Повна форма", es: "Forma completa", pt: "Forma completa", fr: "Forme pleine", de: "Langform", it: "Forma estesa", pl: "Forma pełna", tr: "Tam biçim", id: "Bentuk lengkap", vi: "Dạng đầy đủ" }, features: { contraction: full } }
          - { key: short, label: { en: "Short form", uk: "Скорочена форма", es: "Forma contraída", pt: "Forma contraída", fr: "Forme contractée", de: "Kurzform", it: "Forma contratta", pl: "Forma skrócona", tr: "Kısa biçim", id: "Bentuk singkat", vi: "Dạng rút gọn" }, features: { contraction: short } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, full: "should have", short: "should've", ex: ["You ", { target: "should've" }, " left early."] }
          - { level: B2, full: "must have", short: "must've", ex: ["She ", { target: "must've" }, " left early."] }
          - { level: B2, full: "could have", short: "could've", ex: ["We ", { target: "could've" }, " stayed."] }
          - { level: B2, full: "might have", short: "might've", ex: ["It ", { target: "might've" }, " rained."] }
          - { level: B2, full: "would have", short: { alternatives: ["would've", "'d have"] }, ex: ["I", { target: "'d have" }, " gone."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "Short forms belong to speech and informal writing; formal writing keeps the full form.", uk: "Скорочені форми властиві мовленню й неформальному письму; офіційний текст зберігає повну форму.", es: "Las formas contraídas son propias del habla y de la escritura informal; la escritura formal conserva la forma completa.", pt: "As formas contraídas são próprias da fala e da escrita informal; a escrita formal mantém a forma completa.", fr: "Les formes contractées appartiennent à l’oral et à l’écrit familier ; l’écrit formel garde la forme pleine.", de: "Kurzformen gehören zur gesprochenen Sprache und zum informellen Schreiben; im formellen Schreiben steht die Langform.", it: "Le forme contratte sono tipiche del parlato e della scrittura informale; la scrittura formale mantiene la forma estesa.", pl: "Formy skrócone należą do mowy i pisma nieformalnego; w piśmie formalnym zostaje forma pełna.", tr: "Kısa biçimler konuşma diline ve resmî olmayan yazıya aittir; resmî yazıda tam biçim kullanılır.", id: "Bentuk singkat dipakai dalam percakapan dan tulisan informal; tulisan formal memakai bentuk lengkap.", vi: "Dạng rút gọn dùng trong văn nói và văn viết thân mật; văn viết trang trọng giữ dạng đầy đủ." }

  - title: { en: "Pronunciation: have after a modal", uk: "Вимова: have після модального дієслова", es: "Pronunciación: have después de un modal", pt: "Pronúncia: have depois de um modal", fr: "Prononciation : have après un modal", de: "Aussprache: have nach einem Modalverb", it: "Pronuncia: have dopo un modale", pl: "Wymowa: have po czasowniku modalnym", tr: "Telaffuz: modal fiilden sonra have", id: "Pelafalan: have setelah kata kerja modal", vi: "Phát âm: have sau động từ khuyết thiếu" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: form, label: { en: "Form", uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: sound, label: { en: "Sound", uk: "Звук", es: "Sonido", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: "should have", sound: { ipa: "ʃəd əv" }, ex: ["You ", { target: "should have" }, " called. ", { ipa: "juː ʃəd əv ˈkɔːld" }], tr: { uk: "Тобі слід було зателефонувати.", es: "Deberías haber llamado.", pt: "Você deveria ter ligado.", fr: "Tu aurais dû appeler.", de: "Du hättest anrufen sollen.", it: "Avresti dovuto chiamare.", pl: "Powinieneś był zadzwonić.", tr: "Aramalıydın.", id: "Seharusnya kamu menelepon.", vi: "Lẽ ra bạn nên gọi điện." } }
          - { level: B2, form: "must have", sound: { ipa: "məst əv" }, ex: ["She ", { target: "must have" }, " left. ", { ipa: "ʃi məst əv ˈleft" }], tr: { uk: "Вона, певно, пішла.", es: "Ella debe de haberse ido.", pt: "Ela deve ter saído.", fr: "Elle a dû partir.", de: "Sie muss gegangen sein.", it: "Deve essere partita.", pl: "Ona musiała wyjść.", tr: "Gitmiş olmalı.", id: "Dia pasti sudah pergi.", vi: "Chắc hẳn cô ấy đã đi rồi." } }
          - { level: B2, form: "could have", sound: { ipa: "kəd əv" }, ex: ["We ", { target: "could have" }, " won. ", { ipa: "wi kəd əv ˈwʌn" }], tr: { uk: "Ми могли виграти.", es: "Podríamos haber ganado.", pt: "Nós poderíamos ter ganhado.", fr: "Nous aurions pu gagner.", de: "Wir hätten gewinnen können.", it: "Avremmo potuto vincere.", pl: "Mogliśmy wygrać.", tr: "Kazanabilirdik.", id: "Kita bisa saja menang.", vi: "Chúng tôi đã có thể thắng." } }
          - { level: B2, form: "can't have", sound: [{ ipa: "kɑːnt əv" }, " ", { variant: { ipa: "kænt əv" }, variety: en-US }], ex: ["He ", { target: "can't have" }, " known. ", { ipa: "hi ˈkɑːnt əv ˈnəʊn" }], tr: { uk: "Він не міг знати.", es: "Él no puede haberlo sabido.", pt: "Ele não pode ter sabido.", fr: "Il n’a pas pu le savoir.", de: "Er kann es nicht gewusst haben.", it: "Non può averlo saputo.", pl: "On nie mógł tego wiedzieć.", tr: "Bilmiş olamaz.", id: "Dia tidak mungkin sudah tahu.", vi: "Anh ấy không thể biết được." } }
          - { level: B2, form: "needn't have", sound: { ipa: "ˈniːdnt əv" }, ex: ["I ", { target: "needn't have" }, " gone. ", { ipa: "aɪ ˈniːdnt əv ˈɡɒn" }], tr: { uk: "Мені не треба було йти.", es: "No hacía falta que fuera.", pt: "Eu não precisava ter ido.", fr: "Je n’avais pas besoin d’y aller.", de: "Ich hätte nicht gehen müssen.", it: "Non c'era bisogno che andassi.", pl: "Niepotrzebnie poszedłem.", tr: "Gitmem gerekmiyordu.", id: "Saya sebenarnya tidak perlu pergi.", vi: "Lẽ ra tôi không cần phải đi." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["After a modal, ", { term: have }, " is weak, ", { ipa: əv }, ": it sounds like ", { term: of }, " but is written ", { term: have }, " or ", { term: "'ve" }, "."], uk: ["Після модального дієслова ", { term: "have" }, " звучить слабко, ", { ipa: "əv" }, ": воно звучить як ", { term: "of" }, ", а пишеться ", { term: "have" }, " або ", { term: "'ve" }, "."], es: ["Después de un modal, ", { term: "have" }, " es débil, ", { ipa: "əv" }, ": suena como ", { term: "of" }, ", pero se escribe ", { term: "have" }, " o ", { term: "'ve" }, "."], pt: ["Depois de um modal, ", { term: "have" }, " é fraco, ", { ipa: "əv" }, ": soa como ", { term: "of" }, ", mas se escreve ", { term: "have" }, " ou ", { term: "'ve" }, "."], fr: ["Après un modal, ", { term: "have" }, " est faible, ", { ipa: "əv" }, " : il sonne comme ", { term: "of" }, ", mais s’écrit ", { term: "have" }, " ou ", { term: "'ve" }, "."], de: ["Nach einem Modalverb ist ", { term: "have" }, " schwach, ", { ipa: "əv" }, ": Es klingt wie ", { term: "of" }, ", wird aber ", { term: "have" }, " oder ", { term: "'ve" }, " geschrieben."], it: ["Dopo un modale, ", { term: "have" }, " è debole, ", { ipa: "əv" }, ": suona come ", { term: "of" }, ", ma si scrive ", { term: "have" }, " o ", { term: "'ve" }, "."], pl: ["Po czasowniku modalnym ", { term: "have" }, " jest słabe, ", { ipa: "əv" }, ": brzmi jak ", { term: "of" }, ", ale pisze się ", { term: "have" }, " lub ", { term: "'ve" }, "."], tr: ["Modal fiilden sonra ", { term: "have" }, " zayıf okunur, ", { ipa: "əv" }, ": ", { term: "of" }, " gibi duyulur ama ", { term: "have" }, " ya da ", { term: "'ve" }, " diye yazılır."], id: ["Setelah kata kerja modal, ", { term: "have" }, " lemah, ", { ipa: "əv" }, ": bunyinya seperti ", { term: "of" }, ", tetapi ditulis ", { term: "have" }, " atau ", { term: "'ve" }, "."], vi: ["Sau động từ khuyết thiếu, ", { term: "have" }, " đọc yếu, ", { ipa: "əv" }, ": nghe giống ", { term: "of" }, " nhưng viết là ", { term: "have" }, " hoặc ", { term: "'ve" }, "."] }
          - type: rule
            level: B2
            text: { en: "In a statement the past participle takes the stress; the modal and have are weak.", uk: "У ствердженні наголос падає на 3-тю форму дієслова; модальне дієслово й have звучать слабко.", es: "En una afirmación el acento recae en el participio; el modal y have son débiles.", pt: "Em uma frase afirmativa, a ênfase cai no particípio; o modal e have são fracos.", fr: "Dans une affirmation, l’accent tombe sur le participe ; le modal et have sont faibles.", de: "In einer Aussage trägt das Past Participle die Betonung; Modalverb und have sind schwach.", it: "In un'affermazione l'accento cade sul participio; il verbo modale e have sono deboli.", pl: "W zdaniu twierdzącym akcent pada na III formę; czasownik modalny i have są słabe.", tr: "Olumlu cümlede vurgu past participle üzerindedir; modal fiil ve have zayıf okunur.", id: "Dalam kalimat positif tekanan jatuh pada past participle; kata kerja modal dan have lemah.", vi: "Trong câu khẳng định, trọng âm rơi vào quá khứ phân từ; động từ khuyết thiếu và have đọc yếu." }

  - title: { en: "Use: deduction about the past", uk: "Вживання: висновки про минуле", es: "Uso: deducciones sobre el pasado", pt: "Uso: deduções sobre o passado", fr: "Emploi : déductions sur le passé", de: "Gebrauch: Schlussfolgerungen über die Vergangenheit", it: "Uso: deduzioni sul passato", pl: "Użycie: wnioskowanie o przeszłości", tr: "Kullanım: geçmiş hakkında çıkarım", id: "Penggunaan: kesimpulan tentang masa lampau", vi: "Cách dùng: suy luận về quá khứ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: pattern, label: { en: "Pattern", uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { en: "Sure it happened", uk: "Упевнено, що це сталося", es: "Seguro que ocurrió", pt: "Certeza de que aconteceu", fr: "Certain que cela s’est produit", de: "Sicher, dass es geschehen ist", it: "Sicuro che sia successo", pl: "Pewność, że to się stało", tr: "Olduğundan emin", id: "Yakin hal itu terjadi", vi: "Chắc chắn đã xảy ra" }
            pattern: { pattern: [must, have, { slot: past participle }] }
            ex: ["Their car has gone, so they ", { target: "must have left" }, "."]
            tr: { uk: "Їхньої машини немає, отже, вони, певно, поїхали.", es: "Su auto no está, así que deben de haberse ido.", pt: "O carro deles sumiu, então eles devem ter saído.", fr: "Leur voiture n’est plus là, donc ils ont dû partir.", de: "Ihr Auto ist weg, also müssen sie gegangen sein.", it: "La loro macchina non c'è più, quindi devono essere partiti.", pl: "Ich samochodu nie ma, więc musieli wyjechać.", tr: "Arabaları gitmiş, o hâlde ayrılmış olmalılar.", id: "Mobil mereka sudah tidak ada, jadi mereka pasti sudah pergi.", vi: "Xe của họ đã đi mất, nên chắc hẳn họ đã rời đi." }
          - level: B2
            use: { en: "Sure it did not happen", uk: "Упевнено, що цього не було", es: "Seguro que no ocurrió", pt: "Certeza de que não aconteceu", fr: "Certain que cela ne s’est pas produit", de: "Sicher, dass es nicht geschehen ist", it: "Sicuro che non sia successo", pl: "Pewność, że tego nie było", tr: "Olmadığından emin", id: "Yakin hal itu tidak terjadi", vi: "Chắc chắn không xảy ra" }
            pattern: { pattern: [{ alternatives: ["can't", "couldn't"] }, have, { slot: past participle }] }
            ex: ["He ", { target: "can't have known" }, ". Nobody told him."]
            tr: { uk: "Він не міг знати. Йому ніхто не сказав.", es: "No puede haberlo sabido. Nadie se lo dijo.", pt: "Ele não pode ter sabido. Ninguém contou a ele.", fr: "Il n’a pas pu le savoir. Personne ne le lui a dit.", de: "Er kann es nicht gewusst haben. Niemand hat es ihm gesagt.", it: "Non può averlo saputo. Nessuno glielo ha detto.", pl: "Nie mógł tego wiedzieć. Nikt mu nie powiedział.", tr: "Bilmiş olamaz. Ona kimse söylememiş.", id: "Dia tidak mungkin tahu. Tidak ada yang memberi tahu dia.", vi: "Anh ấy không thể biết được. Không ai nói với anh ấy." }
          - level: B2
            use: { en: "Possible that it happened", uk: "Можливо, це сталося", es: "Es posible que haya ocurrido", pt: "Possível que tenha acontecido", fr: "Possible que cela se soit produit", de: "Möglich, dass es geschehen ist", it: "Possibile che sia successo", pl: "Możliwe, że to się stało", tr: "Olmuş olabilir", id: "Mungkin hal itu terjadi", vi: "Có thể đã xảy ra" }
            pattern: { pattern: [{ alternatives: [may, might, could] }, have, { slot: past participle }] }
            ex: ["She ", { target: "might have missed" }, " the train."]
            tr: { uk: "Вона могла не встигнути на потяг.", es: "Puede que haya perdido el tren.", pt: "Ela pode ter perdido o trem.", fr: "Elle a peut-être raté le train.", de: "Vielleicht hat sie den Zug verpasst.", it: "Potrebbe aver perso il treno.", pl: "Mogła spóźnić się na pociąg.", tr: "Treni kaçırmış olabilir.", id: "Mungkin dia ketinggalan kereta.", vi: "Có thể cô ấy đã lỡ chuyến tàu." }
          - level: B2
            use: { en: "Possible that it did not happen", uk: "Можливо, цього не було", es: "Es posible que no haya ocurrido", pt: "Possível que não tenha acontecido", fr: "Possible que cela ne se soit pas produit", de: "Möglich, dass es nicht geschehen ist", it: "Possibile che non sia successo", pl: "Możliwe, że tego nie było", tr: "Olmamış olabilir", id: "Mungkin hal itu tidak terjadi", vi: "Có thể đã không xảy ra" }
            pattern: { pattern: [{ alternatives: ["may not", "might not"] }, have, { slot: past participle }] }
            ex: ["They ", { target: "might not have heard" }, " the bell."]
            tr: { uk: "Можливо, вони не почули дзвінка.", es: "Puede que no hayan oído el timbre.", pt: "Eles podem não ter ouvido a campainha.", fr: "Ils n’ont peut-être pas entendu la sonnette.", de: "Vielleicht haben sie die Klingel nicht gehört.", it: "Potrebbero non aver sentito il campanello.", pl: "Mogli nie usłyszeć dzwonka.", tr: "Zili duymamış olabilirler.", id: "Mungkin mereka tidak mendengar bel itu.", vi: "Có thể họ đã không nghe thấy chuông." }
          - level: B2
            use: { en: "An activity in progress", uk: "Дія, що тривала", es: "Una acción en curso", pt: "Uma ação em andamento", fr: "Une action en cours", de: "Eine Handlung, die im Gange war", it: "Un'azione in corso", pl: "Czynność w toku", tr: "Sürmekte olan bir eylem", id: "Tindakan yang sedang berlangsung", vi: "Hành động đang diễn ra" }
            pattern: { pattern: [must, have been, { slot: V-ing }] }
            ex: ["They ", { target: "must have been waiting" }, " for hours."]
            tr: { uk: "Вони, певно, чекали годинами.", es: "Deben de haber estado esperando durante horas.", pt: "Eles devem ter ficado esperando por horas.", fr: "Ils ont dû attendre pendant des heures.", de: "Sie müssen stundenlang gewartet haben.", it: "Devono aver aspettato per ore.", pl: "Musieli czekać całymi godzinami.", tr: "Saatlerce beklemiş olmalılar.", id: "Mereka pasti sudah menunggu berjam-jam.", vi: "Chắc hẳn họ đã chờ hàng giờ." }

  - title: { en: "Use: criticism and regret", uk: "Вживання: докір і жаль", es: "Uso: crítica y arrepentimiento", pt: "Uso: crítica e arrependimento", fr: "Emploi : reproche et regret", de: "Gebrauch: Kritik und Bedauern", it: "Uso: critica e rimpianto", pl: "Użycie: krytyka i żal", tr: "Kullanım: eleştiri ve pişmanlık", id: "Penggunaan: kritik dan penyesalan", vi: "Cách dùng: chê trách và hối tiếc" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: pattern, label: { en: "Pattern", uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { en: "A good action that was not done", uk: "Добра дія, якої не зробили", es: "Una buena acción que no se hizo", pt: "Uma boa ação que não foi feita", fr: "Une bonne action qui n’a pas été faite", de: "Eine gute Handlung, die nicht getan wurde", it: "Una buona azione che non è stata fatta", pl: "Dobra czynność, której nie wykonano", tr: "Yapılmayan iyi bir eylem", id: "Tindakan baik yang tidak dilakukan", vi: "Việc tốt đã không được làm" }
            pattern: { pattern: [{ alternatives: ["should", "ought to"] }, have, { slot: past participle }] }
            ex: { examples: [["You ", { target: "should have asked" }, " first."], ["I ", { target: "ought to have saved" }, " more."]] }
            tr: { uk: { examples: ["Тобі слід було спершу спитати.", "Мені слід було більше заощаджувати."] }, es: { examples: ["Deberías haber preguntado primero.", "Debería haber ahorrado más."] }, pt: { examples: ["Você deveria ter perguntado primeiro.", "Eu deveria ter economizado mais."] }, fr: { examples: ["Tu aurais dû demander d’abord.", "J’aurais dû économiser davantage."] }, de: { examples: ["Du hättest zuerst fragen sollen.", "Ich hätte mehr sparen sollen."] }, it: { examples: ["Avresti dovuto chiedere prima.", "Avrei dovuto risparmiare di più."] }, pl: { examples: ["Powinieneś był najpierw zapytać.", "Powinienem był więcej oszczędzać."] }, tr: { examples: ["Önce sormalıydın.", "Daha çok biriktirmeliydim."] }, id: { examples: ["Seharusnya kamu bertanya dulu.", "Seharusnya saya menabung lebih banyak."] }, vi: { examples: ["Lẽ ra bạn nên hỏi trước.", "Lẽ ra tôi nên tiết kiệm nhiều hơn."] } }
          - level: B2
            use: { en: "A bad action that was done", uk: "Погана дія, яку зробили", es: "Una mala acción que se hizo", pt: "Uma má ação que foi feita", fr: "Une mauvaise action qui a été faite", de: "Eine schlechte Handlung, die getan wurde", it: "Una cattiva azione che è stata fatta", pl: "Zła czynność, którą wykonano", tr: "Yapılmış kötü bir eylem", id: "Tindakan buruk yang dilakukan", vi: "Việc xấu đã được làm" }
            pattern: { pattern: ["shouldn't", have, { slot: past participle }] }
            ex: ["I ", { target: "shouldn't have shouted" }, " at her."]
            tr: { uk: "Мені не слід було на неї кричати.", es: "No debería haberle gritado.", pt: "Eu não deveria ter gritado com ela.", fr: "Je n’aurais pas dû lui crier dessus.", de: "Ich hätte sie nicht anschreien sollen.", it: "Non avrei dovuto gridarle contro.", pl: "Nie powinienem był na nią krzyczeć.", tr: "Ona bağırmamalıydım.", id: "Seharusnya saya tidak berteriak padanya.", vi: "Lẽ ra tôi không nên quát cô ấy." }
          - level: B2
            use: { en: "A chance that nobody took", uk: "Можливість, якою ніхто не скористався", es: "Una oportunidad que nadie aprovechó", pt: "Uma chance que ninguém aproveitou", fr: "Une occasion que personne n’a saisie", de: "Eine Chance, die niemand genutzt hat", it: "Un'occasione che nessuno ha colto", pl: "Szansa, z której nikt nie skorzystał", tr: "Kimsenin değerlendirmediği bir fırsat", id: "Kesempatan yang tidak diambil siapa pun", vi: "Cơ hội mà không ai nắm lấy" }
            pattern: { pattern: [{ alternatives: [could, might] }, have, { slot: past participle }] }
            ex: { examples: [["You ", { target: "could have told" }, " me."], ["You ", { target: "might have told" }, " me!"]] }
