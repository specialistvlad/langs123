            use: { en: "A possible result, less sure than would have", uk: "Можливий результат, менш певний, ніж із would have", es: "Un resultado posible, menos seguro que con would have", pt: "Um resultado possível, menos certo que com would have", fr: "Un résultat possible, moins sûr qu’avec would have", de: "Ein mögliches Ergebnis, weniger sicher als mit would have", it: "Un risultato possibile, meno sicuro di would have", pl: "Możliwy skutek, mniej pewny niż z would have", tr: "Olası bir sonuç; would have kadar kesin değil", id: "Akibat yang mungkin, kurang pasti daripada would have", vi: "Kết quả có thể xảy ra, kém chắc chắn hơn would have" }
            pattern: { pattern: [might, have, { slot: past participle }] }
            ex: ["If he had tried harder, he ", { target: "might have won" }, "."]
            tr: { uk: "Якби він постарався більше, він міг би виграти.", es: "Si se hubiera esforzado más, podría haber ganado.", pt: "Se ele tivesse se esforçado mais, poderia ter vencido.", fr: "S’il avait fait plus d’efforts, il aurait pu gagner.", de: "Wenn er sich mehr angestrengt hätte, hätte er vielleicht gewonnen.", it: "Se si fosse impegnato di più, avrebbe potuto vincere.", pl: "Gdyby bardziej się starał, mógłby wygrać.", tr: "Daha çok çabalasaydı kazanabilirdi.", id: "Kalau dia berusaha lebih keras, mungkin dia menang.", vi: "Nếu anh ấy cố gắng hơn, có thể anh ấy đã thắng." }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["The if-clause takes the past perfect: ", { pattern: [{ term: if }, { term: had }, { slot: past participle }] }, ". See ", { link: "Conditionals", to: en.sentence-building.conditionals-0-1-2 }, "."], uk: ["Підрядне речення з if стоїть у Past Perfect: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Див. ", { link: "Умовні речення", to: "en.sentence-building.conditionals-0-1-2" }, "."], es: ["La oración con if va en pasado perfecto: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Ver ", { link: "Condicionales", to: "en.sentence-building.conditionals-0-1-2" }, "."], pt: ["A oração com if fica no passado perfeito: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Ver ", { link: "Condicionais", to: "en.sentence-building.conditionals-0-1-2" }, "."], fr: ["La proposition avec if est au past perfect : ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Voir ", { link: "Phrases conditionnelles", to: "en.sentence-building.conditionals-0-1-2" }, "."], de: ["Der if-Satz steht im Past Perfect: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Siehe ", { link: "Bedingungssätze", to: "en.sentence-building.conditionals-0-1-2" }, "."], it: ["La proposizione con if è al past perfect: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Vedi ", { link: "Periodo ipotetico", to: "en.sentence-building.conditionals-0-1-2" }, "."], pl: ["Zdanie podrzędne z if stoi w Past Perfect: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Zob. ", { link: "Zdania warunkowe", to: "en.sentence-building.conditionals-0-1-2" }, "."], tr: ["if cümleciğinde Past Perfect kullanılır: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Bkz. ", { link: "Koşul cümleleri", to: "en.sentence-building.conditionals-0-1-2" }, "."], id: ["Klausa if memakai past perfect: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Lihat ", { link: "Kalimat conditional", to: "en.sentence-building.conditionals-0-1-2" }, "."], vi: ["Mệnh đề if dùng quá khứ hoàn thành: ", { pattern: [{ term: "if" }, { term: "had" }, { slot: "past participle" }] }, ". Xem ", { link: "Câu điều kiện", to: "en.sentence-building.conditionals-0-1-2" }, "."] }

