summary:
  lead:
    en: [{ term: Will }, " for assumption, habit, willingness and refusal; ", { term: shall }, " for offers and suggestions with I and we, and for formal duty."]
    uk: [{ term: "Will" }, " — для припущення, звички, готовності й відмови; ", { term: "shall" }, " — для пропозицій допомоги й спільних планів із I та we і для формального обов’язку."]
    es: [{ term: "Will" }, " para la suposición, el hábito, la disposición y la negativa; ", { term: "shall" }, " para ofrecimientos y sugerencias con I y we, y para el deber formal."]
    pt: [{ term: "Will" }, " para suposição, hábito, disposição e recusa; ", { term: "shall" }, " para ofertas e sugestões com I e we e para dever formal."]
    fr: [{ term: "Will" }, " pour la supposition, l’habitude, la bonne volonté et le refus ; ", { term: "shall" }, " pour les propositions et les suggestions avec I et we, et pour le devoir formel."]
    de: [{ term: "Will" }, " für Vermutung, Gewohnheit, Bereitschaft und Weigerung; ", { term: "shall" }, " für Angebote und Vorschläge mit I und we sowie für förmliche Pflicht."]
    it: [{ term: "Will" }, " per supposizione, abitudine, disponibilità e rifiuto; ", { term: "shall" }, " per offerte e proposte con I e we e per il dovere formale."]
    pl: [{ term: "Will" }, " dla przypuszczenia, zwyczaju, gotowości i odmowy; ", { term: "shall" }, " dla propozycji i sugestii z I i we oraz dla formalnego obowiązku."]
    tr: [{ term: "Will" }, " varsayım, alışkanlık, isteklilik ve ret için; ", { term: "shall" }, " I ve we ile teklif ve önerilerde, ayrıca resmî görevlerde kullanılır."]
    id: [{ term: "Will" }, " untuk dugaan, kebiasaan, kesediaan, dan penolakan; ", { term: "shall" }, " untuk tawaran dan ajakan dengan I dan we, serta untuk kewajiban formal."]
    vi: [{ term: "Will" }, " chỉ suy đoán, thói quen, sự sẵn lòng, sự từ chối; ", { term: "shall" }, " chỉ lời đề nghị, gợi ý với I, we và nghĩa vụ trang trọng."]
  rule:
    en: [{ term: Will }, " guesses what is true now, and ", { term: shall }, " asks what to do:"]
    uk: [{ term: "Will" }, " припускає, що є правдою зараз, а ", { term: "shall" }, " питає, що робити:"]
    es: [{ term: "Will" }, " supone lo que es verdad ahora, y ", { term: "shall" }, " pregunta qué hacer:"]
    pt: [{ term: "Will" }, " supõe o que é verdade agora, e ", { term: "shall" }, " pergunta o que fazer:"]
    fr: [{ term: "Will" }, " suppose ce qui est vrai maintenant, et ", { term: "shall" }, " demande quoi faire :"]
    de: [{ term: "Will" }, " vermutet, was jetzt zutrifft, und ", { term: "shall" }, " fragt, was zu tun ist:"]
    it: [{ term: "Will" }, " suppone ciò che è vero ora, e ", { term: "shall" }, " chiede che cosa fare:"]
    pl: [{ term: "Will" }, " przypuszcza, co jest prawdą teraz, a ", { term: "shall" }, " pyta, co robić:"]
    tr: [{ term: "Will" }, " şu an doğru olanı tahmin eder, ", { term: "shall" }, " ise ne yapılacağını sorar:"]
    id: [{ term: "Will" }, " menduga apa yang benar sekarang, dan ", { term: "shall" }, " menanyakan apa yang harus dilakukan:"]
    vi: [{ term: "Will" }, " đoán điều đang đúng lúc này, còn ", { term: "shall" }, " hỏi nên làm gì:"]
  ex: { examples: [["That", { target: "'ll" }, " be Tom at the door."], [{ target: Shall }, " we wait?"]] }

