          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: ["A guess about the present from what the speaker knows (", { term: will }, ")"], uk: ["Припущення про теперішнє на основі того, що знає мовець (", { term: "will" }, ")"], es: ["Una suposición sobre el presente a partir de lo que sabe el hablante (", { term: "will" }, ")"], pt: ["Uma suposição sobre o presente a partir do que quem fala sabe (", { term: "will" }, ")"], fr: ["Une supposition sur le présent d’après ce que sait le locuteur (", { term: "will" }, ")"], de: ["Eine Vermutung über die Gegenwart nach dem, was der Sprecher weiß (", { term: "will" }, ")"], it: ["Una supposizione sul presente in base a ciò che sa chi parla (", { term: "will" }, ")"], pl: ["Przypuszczenie o teraźniejszości na podstawie wiedzy mówiącego (", { term: "will" }, ")"], tr: ["Konuşanın bildiklerinden yola çıkarak şimdiki zaman hakkında tahmin (", { term: "will" }, ")"], id: ["Dugaan tentang saat ini berdasarkan apa yang diketahui penutur (", { term: "will" }, ")"], vi: ["Suy đoán về hiện tại dựa trên những gì người nói biết (", { term: "will" }, ")"] }, ex: { examples: [["That", { target: "'ll be" }, " Tom at the door."], ["You", { target: "'ll be" }, " tired after the flight."]] }, tr: { uk: { examples: ["Це, мабуть, Том за дверима.", "Ти, мабуть, втомився після перельоту."] }, es: { examples: ["Será Tom, que llama a la puerta.", "Estarás cansado después del vuelo."] }, pt: { examples: ["Deve ser o Tom na porta.", "Você deve estar cansado depois do voo."] }, fr: { examples: ["Ça doit être Tom à la porte.", "Tu dois être fatigué après le vol."] }, de: { examples: ["Das wird Tom an der Tür sein.", "Du wirst nach dem Flug müde sein."] }, it: { examples: ["Sarà Tom alla porta.", "Sarai stanco dopo il volo."] }, pl: { examples: ["To pewnie Tom przy drzwiach.", "Pewnie jesteś zmęczony po locie."] }, tr: { examples: ["Kapıdaki Tom'dur herhalde.", "Uçuştan sonra yorgunsundur."] }, id: { examples: ["Itu pasti Tom di pintu.", "Kamu pasti lelah setelah penerbangan."] }, vi: { examples: ["Chắc đó là Tom ở ngoài cửa.", "Chắc bạn mệt sau chuyến bay."] } } }
          - { level: B2, use: { en: ["A guess that something is not yet true (", { term: "won't" }, ")"], uk: ["Припущення, що щось ще не відбулося (", { term: "won't" }, ")"], es: ["Una suposición de que algo todavía no es verdad (", { term: "won't" }, ")"], pt: ["Uma suposição de que algo ainda não é verdade (", { term: "won't" }, ")"], fr: ["Une supposition que quelque chose n’est pas encore vrai (", { term: "won't" }, ")"], de: ["Eine Vermutung, dass etwas noch nicht zutrifft (", { term: "won't" }, ")"], it: ["Una supposizione che qualcosa non sia ancora vero (", { term: "won't" }, ")"], pl: ["Przypuszczenie, że coś jeszcze nie jest prawdą (", { term: "won't" }, ")"], tr: ["Bir şeyin henüz doğru olmadığına dair tahmin (", { term: "won't" }, ")"], id: ["Dugaan bahwa sesuatu belum benar (", { term: "won't" }, ")"], vi: ["Suy đoán rằng điều gì đó chưa đúng (", { term: "won't" }, ")"] }, ex: ["She ", { target: "won't be" }, " home yet."], tr: { uk: "Її, мабуть, ще немає вдома.", es: "Todavía no estará en casa.", pt: "Ela ainda não deve ter chegado em casa.", fr: "Elle ne doit pas encore être rentrée.", de: "Sie wird noch nicht zu Hause sein.", it: "Non sarà ancora a casa.", pl: "Jej pewnie jeszcze nie ma w domu.", tr: "Henüz eve gelmemiştir.", id: "Dia pasti belum sampai di rumah.", vi: "Chắc cô ấy chưa về nhà." } }
          - { level: C1, use: { en: ["A guess about what is happening now (", { pattern: [{ term: will be }, { slot: V-ing }] }, ")"], uk: ["Припущення про те, що відбувається зараз (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], es: ["Una suposición sobre lo que ocurre ahora (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], pt: ["Uma suposição sobre o que está acontecendo agora (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], fr: ["Une supposition sur ce qui se passe en ce moment (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], de: ["Eine Vermutung über das, was gerade geschieht (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], it: ["Una supposizione su ciò che sta accadendo ora (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], pl: ["Przypuszczenie o tym, co dzieje się teraz (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], tr: ["Şu anda olanlar hakkında tahmin (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], id: ["Dugaan tentang apa yang sedang terjadi sekarang (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"], vi: ["Suy đoán về điều đang diễn ra lúc này (", { pattern: [{ term: "will be" }, { slot: "V-ing" }] }, ")"] }, ex: { examples: [["Don't call yet. They", { target: "'ll be having" }, " dinner."], ["She", { target: "'ll be waiting" }, " at the station by now."]] }, tr: { uk: { examples: ["Не телефонуй поки. Вони, мабуть, вечеряють.", "Вона, мабуть, уже чекає на вокзалі."] }, es: { examples: ["No llames todavía. Estarán cenando.", "Ya estará esperando en la estación."] }, pt: { examples: ["Não ligue ainda. Eles devem estar jantando.", "Ela já deve estar esperando na estação."] }, fr: { examples: ["N’appelle pas encore. Ils doivent être en train de dîner.", "Elle doit déjà attendre à la gare à l’heure qu’il est."] }, de: { examples: ["Ruf noch nicht an. Sie werden gerade zu Abend essen.", "Sie wird jetzt schon am Bahnhof warten."] }, it: { examples: ["Non chiamare ancora. Staranno cenando.", "Ormai starà aspettando alla stazione."] }, pl: { examples: ["Jeszcze nie dzwoń. Pewnie jedzą kolację.", "Pewnie już czeka na dworcu."] }, tr: { examples: ["Henüz arama. Şimdi akşam yemeği yiyorlardır.", "Şimdiye kadar istasyonda bekliyordur."] }, id: { examples: ["Jangan telepon dulu. Mereka pasti sedang makan malam.", "Dia pasti sudah menunggu di stasiun sekarang."] }, vi: { examples: ["Đừng gọi vội. Chắc họ đang ăn tối.", "Giờ này chắc cô ấy đang đợi ở nhà ga."] } } }
          - { level: C1, use: { en: ["A guess about something finished (", { pattern: [{ term: will have }, { slot: past participle }] }, ")"], uk: ["Припущення про щось завершене (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], es: ["Una suposición sobre algo terminado (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], pt: ["Uma suposição sobre algo concluído (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], fr: ["Une supposition sur quelque chose de terminé (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], de: ["Eine Vermutung über etwas Abgeschlossenes (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], it: ["Una supposizione su qualcosa di concluso (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], pl: ["Przypuszczenie o czymś zakończonym (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], tr: ["Tamamlanmış bir şey hakkında tahmin (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], id: ["Dugaan tentang sesuatu yang sudah selesai (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"], vi: ["Suy đoán về việc đã kết thúc (", { pattern: [{ term: "will have" }, { slot: "past participle" }] }, ")"] }, ex: { examples: [["You", { target: "'ll have heard" }, " the news."], ["They", { target: "'ll have arrived" }, " by now."]] }, tr: { uk: { examples: ["Ти, мабуть, уже чув цю новину.", "Вони, мабуть, уже приїхали."] }, es: { examples: ["Ya habrás oído la noticia.", "Ya habrán llegado."] }, pt: { examples: ["Você já deve ter ouvido a notícia.", "Eles já devem ter chegado."] }, fr: { examples: ["Tu as sûrement entendu la nouvelle.", "Ils sont sûrement arrivés à l’heure qu’il est."] }, de: { examples: ["Du wirst die Neuigkeit schon gehört haben.", "Sie werden inzwischen angekommen sein."] }, it: { examples: ["Avrai già sentito la notizia.", "Saranno già arrivati."] }, pl: { examples: ["Pewnie słyszałeś już tę wiadomość.", "Pewnie już dotarli."] }, tr: { examples: ["Haberi duymuşsundur.", "Şimdiye kadar varmışlardır."] }, id: { examples: ["Kamu pasti sudah mendengar beritanya.", "Mereka pasti sudah tiba sekarang."] }, vi: { examples: ["Chắc bạn đã nghe tin rồi.", "Giờ này chắc họ đã đến nơi rồi."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Words such as ", { term: yet }, " and ", { term: "by now" }, " often mark a guess about the present:"], uk: ["Слова на кшталт ", { term: "yet" }, " і ", { term: "by now" }, " часто вказують на припущення про теперішнє:"], es: ["Palabras como ", { term: "yet" }, " y ", { term: "by now" }, " suelen señalar una suposición sobre el presente:"], pt: ["Palavras como ", { term: "yet" }, " e ", { term: "by now" }, " costumam marcar uma suposição sobre o presente:"], fr: ["Des mots comme ", { term: "yet" }, " et ", { term: "by now" }, " marquent souvent une supposition sur le présent :"], de: ["Wörter wie ", { term: "yet" }, " und ", { term: "by now" }, " zeigen oft eine Vermutung über die Gegenwart an:"], it: ["Parole come ", { term: "yet" }, " e ", { term: "by now" }, " segnalano spesso una supposizione sul presente:"], pl: ["Słowa takie jak ", { term: "yet" }, " i ", { term: "by now" }, " często sygnalizują przypuszczenie o teraźniejszości:"], tr: [{ term: "yet" }, " ve ", { term: "by now" }, " gibi sözcükler çoğu zaman şimdiki zaman hakkında bir tahmini gösterir:"], id: ["Kata seperti ", { term: "yet" }, " dan ", { term: "by now" }, " sering menandai dugaan tentang saat ini:"], vi: ["Những từ như ", { term: "yet" }, " và ", { term: "by now" }, " thường báo hiệu một suy đoán về hiện tại:"] }
            ex: ["They'll be home ", { signal: "by now" }, "."]
            tr: { uk: "Вони, мабуть, уже вдома.", es: "Ya estarán en casa.", pt: "Eles já devem estar em casa.", fr: "Ils doivent être rentrés à l’heure qu’il est.", de: "Sie werden inzwischen zu Hause sein.", it: "Ormai saranno a casa.", pl: "Pewnie już są w domu.", tr: "Şimdiye kadar evdelerdir.", id: "Mereka pasti sudah di rumah sekarang.", vi: "Giờ này chắc họ đã ở nhà rồi." }
          - type: rule
