        - { level: C1, point: { en: "Guess about the past", uk: "Припущення про минуле", es: "Suposición sobre el pasado", pt: "Suposição sobre o passado", fr: "Supposition sur le passé", de: "Vermutung über Vergangenes", it: "Supposizione sul passato", pl: "Przypuszczenie o przeszłości", tr: "Geçmiş hakkında tahmin", id: "Dugaan tentang masa lalu", vi: "Suy đoán về quá khứ" }, rule: { en: [{ pattern: [{ term: will have }, { slot: past participle }] }, " guesses about something finished"], uk: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " припускає щось про завершену дію"], es: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " supone algo ya terminado"], pt: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " supõe algo já concluído"], fr: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " suppose quelque chose de terminé"], de: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " vermutet etwas Abgeschlossenes"], it: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " suppone qualcosa di concluso"], pl: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " przypuszcza coś o zakończonej czynności"], tr: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " tamamlanmış bir şey hakkında tahmin yürütür"], id: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " menduga sesuatu yang sudah selesai"], vi: [{ pattern: [{ term: "will have" }, { slot: "past participle" }] }, " đoán về việc đã kết thúc"] }, ex: ["You", { target: "'ll have heard" }, " the news."], tr: { uk: "Ти, мабуть, уже чув цю новину.", es: "Ya habrás oído la noticia.", pt: "Você já deve ter ouvido a notícia.", fr: "Tu as sûrement entendu la nouvelle.", de: "Du wirst die Neuigkeit schon gehört haben.", it: "Avrai già sentito la notizia.", pl: "Pewnie słyszałeś już tę wiadomość.", tr: "Haberi duymuşsundur.", id: "Kamu pasti sudah mendengar beritanya.", vi: "Chắc bạn đã nghe tin rồi." } }
        - { level: C1, point: { en: "Persistent habit", uk: "Настирлива звичка", es: "Hábito persistente", pt: "Hábito persistente", fr: "Habitude persistante", de: "Hartnäckige Gewohnheit", it: "Abitudine ostinata", pl: "Uporczywy zwyczaj", tr: "Israrlı alışkanlık", id: "Kebiasaan yang terus-menerus", vi: "Thói quen dai dẳng" }, rule: { en: ["stressed ", { term: will }, " shows an annoying habit"], uk: ["наголошене ", { term: "will" }, " показує набридливу звичку"], es: [{ term: "will" }, " acentuado muestra un hábito molesto"], pt: [{ term: "will" }, " acentuado mostra um hábito irritante"], fr: [{ term: "will" }, " accentué montre une habitude agaçante"], de: ["betontes ", { term: "will" }, " zeigt eine lästige Gewohnheit"], it: [{ term: "will" }, " accentato mostra un'abitudine fastidiosa"], pl: ["akcentowane ", { term: "will" }, " pokazuje irytujący zwyczaj"], tr: ["vurgulu ", { term: "will" }, " can sıkıcı bir alışkanlığı gösterir"], id: [{ term: "will" }, " yang ditekankan menunjukkan kebiasaan yang mengganggu"], vi: [{ term: "will" }, " mang trọng âm cho thấy một thói quen gây khó chịu"] }, ex: ["He ", { target: { stress: will } }, " keep interrupting."], tr: { uk: "Він постійно всіх перебиває.", es: "No deja de interrumpir.", pt: "Ele não para de interromper.", fr: "Il faut toujours qu’il interrompe.", de: "Er unterbricht ständig.", it: "Non smette mai di interrompere.", pl: "On ciągle przerywa.", tr: "Sürekli lafımızı kesiyor.", id: "Dia selalu saja menyela.", vi: "Anh ấy cứ hay ngắt lời." } }
        - { level: C1, point: { en: "Formal shall", uk: "Формальне shall", es: "Shall formal", pt: "Shall formal", fr: "Shall soutenu", de: "Förmliches shall", it: "Shall formale", pl: "Formalne shall", tr: "Resmî shall", id: "Shall resmi", vi: "Shall trang trọng" }, rule: { en: [{ term: shall }, " after ", { term: I }, " or ", { term: we }, ", and in rules and promises"], uk: [{ term: "shall" }, " після ", { term: "I" }, " або ", { term: "we" }, ", а також у правилах і обіцянках"], es: [{ term: "shall" }, " tras ", { term: "I" }, " o ", { term: "we" }, ", y en normas y promesas"], pt: [{ term: "shall" }, " depois de ", { term: "I" }, " ou ", { term: "we" }, ", e em regras e promessas"], fr: [{ term: "shall" }, " après ", { term: "I" }, " ou ", { term: "we" }, ", et dans les règlements et les promesses"], de: [{ term: "shall" }, " nach ", { term: "I" }, " oder ", { term: "we" }, " sowie in Regeln und Versprechen"], it: [{ term: "shall" }, " dopo ", { term: "I" }, " o ", { term: "we" }, ", e in regole e promesse"], pl: [{ term: "shall" }, " po ", { term: "I" }, " lub ", { term: "we" }, " oraz w zasadach i obietnicach"], tr: [{ term: "shall" }, ", ", { term: "I" }, " ya da ", { term: "we" }, " sonrasında, ayrıca kurallarda ve sözlerde kullanılır"], id: [{ term: "shall" }, " setelah ", { term: "I" }, " atau ", { term: "we" }, ", serta dalam aturan dan janji"], vi: [{ term: "shall" }, " sau ", { term: "I" }, " hoặc ", { term: "we" }, ", và trong quy định và lời hứa"] }, ex: { examples: [["I ", { target: shall }, " be there."], ["Passengers ", { target: "shall not" }, " smoke."]] }, tr: { uk: { examples: ["Я буду там.", "Пасажирам заборонено курити."] }, es: { examples: ["Estaré allí.", "Los pasajeros no deberán fumar."] }, pt: { examples: ["Estarei lá.", "Os passageiros não devem fumar."] }, fr: { examples: ["J’y serai.", "Les passagers ne doivent pas fumer."] }, de: { examples: ["Ich werde dort sein.", "Fahrgäste dürfen nicht rauchen."] }, it: { examples: ["Ci sarò.", "I passeggeri non devono fumare."] }, pl: { examples: ["Będę tam.", "Pasażerom nie wolno palić."] }, tr: { examples: ["Orada olacağım.", "Yolcular sigara içmemelidir."] }, id: { examples: ["Saya akan hadir di sana.", "Penumpang dilarang merokok."] }, vi: { examples: ["Tôi sẽ có mặt ở đó.", "Hành khách không được hút thuốc."] } } }
        - { level: C2, point: { en: "Legal shall", uk: "Юридичне shall", es: "Shall jurídico", pt: "Shall jurídico", fr: "Shall juridique", de: "Rechtliches shall", it: "Shall giuridico", pl: "Prawnicze shall", tr: "Hukuki shall", id: "Shall hukum", vi: "Shall trong pháp lý" }, rule: { en: [{ term: shall }, " states a duty on any subject in laws and contracts"], uk: ["у законах і договорах ", { term: "shall" }, " виражає обов’язок для будь-якого підмета"], es: ["en leyes y contratos, ", { term: "shall" }, " establece un deber para cualquier sujeto"], pt: ["em leis e contratos, ", { term: "shall" }, " estabelece um dever para qualquer sujeito"], fr: ["dans les lois et les contrats, ", { term: "shall" }, " énonce un devoir pour n’importe quel sujet"], de: ["in Gesetzen und Verträgen legt ", { term: "shall" }, " bei jedem Subjekt eine Pflicht fest"], it: ["in leggi e contratti ", { term: "shall" }, " stabilisce un dovere per qualsiasi soggetto"], pl: ["w ustawach i umowach ", { term: "shall" }, " nakłada obowiązek na dowolny podmiot"], tr: ["yasalarda ve sözleşmelerde ", { term: "shall" }, ", her özne için bir görev bildirir"], id: ["dalam undang-undang dan kontrak, ", { term: "shall" }, " menyatakan kewajiban untuk subjek apa pun"], vi: ["trong luật và hợp đồng, ", { term: "shall" }, " nêu nghĩa vụ với mọi chủ ngữ"] }, ex: { examples: [["The tenant ", { target: shall }, " pay the rent monthly."], ["Thou ", { target: shalt }, " not steal."]] }, tr: { uk: { examples: ["Орендар повинен сплачувати орендну плату щомісяця.", "Не кради."] }, es: { examples: ["El arrendatario deberá pagar el alquiler mensualmente.", "No robarás."] }, pt: { examples: ["O locatário deverá pagar o aluguel mensalmente.", "Não roubarás."] }, fr: { examples: ["Le locataire devra payer le loyer chaque mois.", "Tu ne voleras point."] }, de: { examples: ["Der Mieter hat die Miete monatlich zu zahlen.", "Du sollst nicht stehlen."] }, it: { examples: ["L'inquilino deve pagare l'affitto ogni mese.", "Non rubare."] }, pl: { examples: ["Najemca jest zobowiązany płacić czynsz co miesiąc.", "Nie kradnij."] }, tr: { examples: ["Kiracı kirayı her ay ödemekle yükümlüdür.", "Çalmayacaksın."] }, id: { examples: ["Penyewa wajib membayar sewa setiap bulan.", "Jangan mencuri."] }, vi: { examples: ["Bên thuê phải trả tiền thuê hằng tháng.", "Ngươi không được trộm cắp."] } } }
        - { level: C2, point: { en: Command, uk: "Наказ", es: "Orden", pt: "Ordem", fr: "Ordre", de: "Befehl", it: "Ordine", pl: "Rozkaz", tr: "Emir", id: "Perintah", vi: "Mệnh lệnh" }, rule: { en: [{ term: will }, " gives an order as a fact; ", { term: "will do" }, " accepts it"], uk: [{ term: "will" }, " подає наказ як факт; ", { term: "will do" }, " його приймає"], es: [{ term: "will" }, " da una orden como si fuera un hecho; ", { term: "will do" }, " la acepta"], pt: [{ term: "will" }, " dá uma ordem como se fosse um fato; ", { term: "will do" }, " a aceita"], fr: [{ term: "will" }, " donne un ordre comme un fait ; ", { term: "will do" }, " l’accepte"], de: [{ term: "will" }, " erteilt einen Befehl als Tatsache; ", { term: "will do" }, " nimmt ihn an"], it: [{ term: "will" }, " dà un ordine come un fatto; ", { term: "will do" }, " lo accetta"], pl: [{ term: "will" }, " wydaje rozkaz jako fakt; ", { term: "will do" }, " go przyjmuje"], tr: [{ term: "will" }, " emri bir olgu gibi verir; ", { term: "will do" }, " onu kabul eder"], id: [{ term: "will" }, " memberi perintah seolah-olah fakta; ", { term: "will do" }, " menerimanya"], vi: [{ term: "will" }, " đưa ra mệnh lệnh như một sự thật; ", { term: "will do" }, " là chấp nhận lệnh đó"] }, ex: ["You ", { target: will }, " report at nine."], tr: { uk: "Ви з’явитеся о дев’ятій.", es: "Se presentará a las nueve.", pt: "Você se apresentará às nove.", fr: "Vous vous présenterez à neuf heures.", de: "Sie melden sich um neun Uhr.", it: "Si presenterà alle nove.", pl: "Zgłosisz się o dziewiątej.", tr: "Saat dokuzda rapor vereceksiniz.", id: "Anda akan melapor pukul sembilan.", vi: "Bạn sẽ trình diện lúc chín giờ." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["an offer with ", { term: I }, " takes ", { term: shall }], uk: ["пропозиція допомоги з ", { term: "I" }, " вимагає ", { term: "shall" }], es: ["un ofrecimiento con ", { term: "I" }, " lleva ", { term: "shall" }], pt: ["uma oferta com ", { term: "I" }, " leva ", { term: "shall" }], fr: ["une proposition avec ", { term: "I" }, " prend ", { term: "shall" }], de: ["ein Angebot mit ", { term: "I" }, " steht mit ", { term: "shall" }], it: ["un'offerta con ", { term: "I" }, " vuole ", { term: "shall" }], pl: ["propozycja z ", { term: "I" }, " wymaga ", { term: "shall" }], tr: [{ term: "I" }, " ile yapılan teklif ", { term: "shall" }, " alır"], id: ["tawaran dengan ", { term: "I" }, " memakai ", { term: "shall" }], vi: ["lời đề nghị với ", { term: "I" }, " dùng ", { term: "shall" }] }, ex: [{ target: Shall }, " I carry your bag?"], tr: { uk: "Понести твою сумку?", es: "¿Te llevo la bolsa?", pt: "Quer que eu carregue sua bolsa?", fr: "Je porte ton sac ?", de: "Soll ich deine Tasche tragen?", it: "Ti porto la borsa?", pl: "Czy mam zanieść twoją torbę?", tr: "Çantanı taşıyayım mı?", id: "Mau saya bawakan tasnya?", vi: "Để tôi xách túi cho bạn nhé?" } }

sections:
  - title: { en: "Form: will and shall", uk: "Форма: will і shall", es: "Forma: will y shall", pt: "Forma: will e shall", fr: "Forme : will et shall", de: "Form: will und shall", it: "Forma: will e shall", pl: "Forma: will i shall", tr: "Biçim: will ve shall", id: "Bentuk: will dan shall", vi: "Dạng: will và shall" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, features: { polarity: pos, interrogativity: decl }, form: { en: Statement, uk: "Розповідне речення", es: "Afirmación", pt: "Afirmação", fr: "Affirmation", de: "Aussage", it: "Affermazione", pl: "Zdanie oznajmujące", tr: "Bildirme cümlesi", id: "Pernyataan", vi: "Câu khẳng định" }, pattern: { pattern: [{ slot: subject }, { alternatives: [will, "'ll"] }, { slot: V }] }, ex: ["That", { target: "'ll be" }, " the postman."] }
          - { level: B2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative, uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [{ slot: subject }, { alternatives: ["won't", will not] }, { slot: V }] }, ex: ["He ", { target: "won't be" }, " at work today."] }
          - { level: B2, features: { polarity: pos, interrogativity: int, person: 1 }, form: { en: "Question with shall", uk: "Питання з shall", es: "Pregunta con shall", pt: "Pergunta com shall", fr: "Question avec shall", de: "Frage mit shall", it: "Domanda con shall", pl: "Pytanie z shall", tr: "Shall ile soru", id: "Pertanyaan dengan shall", vi: "Câu hỏi với shall" }, pattern: { pattern: [Shall, { alternatives: [I, we] }, { slot: V }] }, ex: [{ target: Shall }, " I carry your bag? ", { variant: { target: "Should I carry your bag?" }, variety: en-US }] }
          - { level: C1, features: { aspect: prog }, form: { en: Continuous, uk: "Continuous", es: "Continuo", pt: "Contínuo", fr: "Continu", de: "Verlaufsform", it: "Continuous", pl: "Continuous", tr: "Continuous", id: "Continuous", vi: "Tiếp diễn" }, pattern: { pattern: [{ slot: subject }, will be, { slot: V-ing }] }, ex: ["He", { target: "'ll be working" }, " late again."] }
          - { level: C1, features: { aspect: prf }, form: { en: Perfect, uk: "Перфект", es: "Perfecto", pt: "Perfeito", fr: "Parfait", de: "Perfekt", it: "Perfetto", pl: "Perfect", tr: "Tamamlanmış", id: "Perfect", vi: "Hoàn thành" }, pattern: { pattern: [{ slot: subject }, will have, { slot: past participle }] }, ex: ["He", { target: "'ll have missed" }, " the bus."] }
          - { level: C1, features: { polarity: pos, interrogativity: decl, person: 1 }, form: { en: "Statement with shall", uk: "Розповідне речення з shall", es: "Afirmación con shall", pt: "Afirmação com shall", fr: "Affirmation avec shall", de: "Aussage mit shall", it: "Affermazione con shall", pl: "Zdanie oznajmujące z shall", tr: "Shall ile bildirme cümlesi", id: "Pernyataan dengan shall", vi: "Câu khẳng định với shall" }, pattern: { pattern: [{ alternatives: [I, we] }, shall, { slot: V }] }, ex: ["I ", { target: shall }, " call you tomorrow."] }
          - { level: C1, features: { polarity: neg, interrogativity: decl, person: 1 }, form: { en: "Negative with shall", uk: "Заперечення з shall", es: "Negación con shall", pt: "Negação com shall", fr: "Négation avec shall", de: "Verneinung mit shall", it: "Negazione con shall", pl: "Przeczenie z shall", tr: "Shall ile olumsuz", id: "Negatif dengan shall", vi: "Phủ định với shall" }, pattern: { pattern: [{ alternatives: [I, we] }, { alternatives: [shall not, "shan't"] }, { slot: V }] }, ex: ["We ", { target: "shan't" }, " be long. ", { variant: { target: "won't" }, variety: en-US }] }
          - { level: C2, features: { polarity: pos, interrogativity: decl, person: 3 }, form: { en: "Shall with any subject", uk: "Shall з будь-яким підметом", es: "Shall con cualquier sujeto", pt: "Shall com qualquer sujeito", fr: "Shall avec n’importe quel sujet", de: "Shall mit jedem Subjekt", it: "Shall con qualsiasi soggetto", pl: "Shall z dowolnym podmiotem", tr: "Her özneyle shall", id: "Shall dengan subjek apa pun", vi: "Shall với mọi chủ ngữ" }, pattern: { pattern: [{ slot: subject }, shall, { slot: V }] }, ex: ["The seller ", { target: shall }, " deliver the goods in May."] }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["Plans, decisions, offers and predictions with ", { term: will }, " are in ", { link: Future Forms, to: en.tenses.future-forms }, "."], uk: ["Про плани, рішення, пропозиції та прогнози з ", { term: "will" }, " див. ", { link: "Способи вираження майбутнього", to: "en.tenses.future-forms" }, "."], es: ["Para planes, decisiones, ofrecimientos y predicciones con ", { term: "will" }, ", ver ", { link: "Formas de futuro", to: "en.tenses.future-forms" }, "."], pt: ["Para planos, decisões, ofertas e previsões com ", { term: "will" }, ", ver ", { link: "Formas de futuro", to: "en.tenses.future-forms" }, "."], fr: ["Pour les projets, les décisions, les propositions et les prédictions avec ", { term: "will" }, ", voir ", { link: "Formes du futur", to: "en.tenses.future-forms" }, "."], de: ["Zu Plänen, Entscheidungen, Angeboten und Vorhersagen mit ", { term: "will" }, " siehe ", { link: "Zukunftsformen", to: "en.tenses.future-forms" }, "."], it: ["Per programmi, decisioni, offerte e previsioni con ", { term: "will" }, ", vedi ", { link: "Forme del futuro", to: "en.tenses.future-forms" }, "."], pl: ["O planach, decyzjach, propozycjach i przewidywaniach z ", { term: "will" }, " zob. ", { link: "Sposoby wyrażania przyszłości", to: "en.tenses.future-forms" }, "."], tr: [{ term: "will" }, " ile plan, karar, teklif ve tahminler için bkz. ", { link: "Gelecek zaman biçimleri", to: "en.tenses.future-forms" }, "."], id: ["Untuk rencana, keputusan, tawaran, dan prediksi dengan ", { term: "will" }, ", lihat ", { link: "Bentuk future", to: "en.tenses.future-forms" }, "."], vi: ["Về kế hoạch, quyết định, lời đề nghị và dự đoán với ", { term: "will" }, ", xem ", { link: "Các dạng tương lai", to: "en.tenses.future-forms" }, "."] }
          - type: rule
            level: C1
