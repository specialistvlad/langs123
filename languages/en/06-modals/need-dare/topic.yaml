            use: { en: "A thing that is needed", uk: "Потрібний предмет", es: "Una cosa que se necesita", pt: "Uma coisa de que se precisa", fr: "Une chose dont on a besoin", de: "Eine Sache, die man braucht", it: "Una cosa di cui si ha bisogno", pl: "Rzecz, której się potrzebuje", tr: "İhtiyaç duyulan şey", id: "Sesuatu yang dibutuhkan", vi: "Một thứ cần có" }
            pattern: { pattern: [need, { slot: noun }] }
            ex: ["I ", { target: "need a new phone" }, "."]
            tr: { uk: "Мені потрібен новий телефон.", es: "Necesito un teléfono nuevo.", pt: "Eu preciso de um celular novo.", fr: "J’ai besoin d’un nouveau téléphone.", de: "Ich brauche ein neues Handy.", it: "Ho bisogno di un telefono nuovo.", pl: "Potrzebuję nowego telefonu.", tr: "Yeni bir telefona ihtiyacım var.", id: "Saya butuh ponsel baru.", vi: "Tôi cần một chiếc điện thoại mới." }
          - level: B2
            use: { en: "Someone else must act", uk: "Дії потрібно від іншої особи", es: "Otra persona debe actuar", pt: "Outra pessoa precisa agir", fr: "Quelqu’un d’autre doit agir", de: "Jemand anderes muss handeln", it: "Un'altra persona deve agire", pl: "Ktoś inny musi coś zrobić", tr: "Başka birinin harekete geçmesi gerekir", id: "Orang lain harus bertindak", vi: "Người khác phải hành động" }
            pattern: { pattern: [need, { slot: person }, to, { slot: V }] }
            ex: ["I ", { target: "need you to help" }, " me."]
            tr: { uk: "Мені потрібно, щоб ти мені допоміг.", es: "Necesito que me ayudes.", pt: "Eu preciso que você me ajude.", fr: "J’ai besoin que tu m’aides.", de: "Ich brauche deine Hilfe.", it: "Ho bisogno che tu mi aiuti.", pl: "Potrzebuję, żebyś mi pomógł.", tr: "Bana yardım etmene ihtiyacım var.", id: "Saya perlu kamu membantu saya.", vi: "Tôi cần bạn giúp tôi." }
          - level: B2
            use: { en: "A thing that needs a job done", uk: "Предмет, над яким треба попрацювати", es: "Una cosa que necesita un trabajo", pt: "Algo que precisa de um serviço", fr: "Une chose qui demande un travail", de: "Eine Sache, an der etwas getan werden muss", it: "Una cosa che richiede un lavoro", pl: "Rzecz, przy której trzeba coś zrobić", tr: "Üzerinde iş yapılması gereken şey", id: "Benda yang perlu dikerjakan", vi: "Một vật cần được xử lý" }
            pattern: { pattern: [needs, { slot: V-ing }] }
            ex: ["The car ", { target: "needs washing" }, "."]
