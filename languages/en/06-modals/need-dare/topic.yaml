summary:
  lead:
    en: [{ term: Need }, " for what is necessary and ", { term: dare }, " for what takes courage, each as a main verb with ", { term: to }, " or as a modal without it."]
    uk: [{ term: "Need" }, " — про необхідність, ", { term: "dare" }, " — про сміливість; обидва вживаються як основне дієслово з ", { term: "to" }, " або як модальне без нього."]
    es: [{ term: "Need" }, " para lo necesario y ", { term: "dare" }, " para lo que exige valor, cada uno como verbo principal con ", { term: "to" }, " o como modal sin él."]
    pt: [{ term: "Need" }, " para o que é necessário e ", { term: "dare" }, " para o que exige coragem, cada um como verbo principal com ", { term: "to" }, " ou como modal sem ele."]
    fr: [{ term: "Need" }, " pour ce qui est nécessaire et ", { term: "dare" }, " pour ce qui demande du courage, chacun comme verbe principal avec ", { term: "to" }, " ou comme modal sans lui."]
    de: [{ term: "Need" }, " für das Nötige und ", { term: "dare" }, " für das, was Mut verlangt, jeweils als Hauptverb mit ", { term: "to" }, " oder als Modalverb ohne ", { term: "to" }, "."]
    it: [{ term: "Need" }, " per ciò che è necessario e ", { term: "dare" }, " per ciò che richiede coraggio, ciascuno come verbo principale con ", { term: "to" }, " o come modale senza di esso."]
    pl: [{ term: "Need" }, " dla tego, co konieczne, i ", { term: "dare" }, " dla tego, co wymaga odwagi, każdy jako czasownik główny z ", { term: "to" }, " lub jako modalny bez niego."]
    tr: [{ term: "Need" }, " gerekli olanı, ", { term: "dare" }, " cesaret isteyeni anlatır; ikisi de ", { term: "to" }, " ile ana fiil olarak ya da ", { term: "to" }, " olmadan modal olarak kullanılır."]
    id: [{ term: "Need" }, " untuk hal yang perlu dan ", { term: "dare" }, " untuk hal yang butuh keberanian, masing-masing sebagai kata kerja utama dengan ", { term: "to" }, " atau sebagai modal tanpa ", { term: "to" }, "."]
    vi: [{ term: "Need" }, " chỉ điều cần thiết, ", { term: "dare" }, " chỉ điều cần can đảm; cả hai là động từ chính với ", { term: "to" }, " hoặc động từ khuyết thiếu không ", { term: "to" }, "."]
  rule:
    en: ["The modal forms take the base verb; the main-verb forms take ", { term: to }, ":"]
    uk: ["Модальні форми вживаються з початковою формою дієслова, а форми основного дієслова — з ", { term: "to" }, ":"]
    es: ["Las formas modales van con la forma base; las del verbo principal llevan ", { term: "to" }, ":"]
    pt: ["As formas modais vêm com a forma base; as do verbo principal levam ", { term: "to" }, ":"]
    fr: ["Les formes modales se construisent avec la base verbale ; celles du verbe principal prennent ", { term: "to" }, " :"]
    de: ["Die Modalformen stehen mit der Grundform; die Formen des Hauptverbs nehmen ", { term: "to" }, ":"]
    it: ["Le forme modali vogliono la forma base; quelle del verbo principale prendono ", { term: "to" }, ":"]
    pl: ["Formy modalne łączą się z formą podstawową; formy czasownika głównego przyjmują ", { term: "to" }, ":"]
    tr: ["Modal biçimler yalın fiille kullanılır; ana fiil biçimleri ", { term: "to" }, " alır:"]
    id: ["Bentuk modal diikuti kata kerja dasar; bentuk kata kerja utama memakai ", { term: "to" }, ":"]
    vi: ["Dạng khuyết thiếu dùng động từ nguyên mẫu; dạng động từ chính dùng ", { term: "to" }, ":"]
