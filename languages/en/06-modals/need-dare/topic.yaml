          - level: B2
            use: { en: "The same meaning, in the passive", uk: "Те саме значення, у пасивному стані", es: "El mismo significado, en pasiva", pt: "O mesmo sentido, na passiva", fr: "Le même sens, au passif", de: "Dieselbe Bedeutung im Passiv", it: "Lo stesso significato, al passivo", pl: "To samo znaczenie w stronie biernej", tr: "Aynı anlam, edilgen çatıda", id: "Arti yang sama, dalam bentuk pasif", vi: "Cùng nghĩa, ở câu bị động" }
            pattern: { pattern: [needs to be, { slot: past participle }] }
            ex: ["The car ", { target: "needs to be washed" }, "."]
            tr: { uk: "Машину потрібно помити.", es: "El auto necesita ser lavado.", pt: "O carro precisa ser lavado.", fr: "La voiture doit être lavée.", de: "Das Auto muss gewaschen werden.", it: "L'auto deve essere lavata.", pl: "Samochód musi zostać umyty.", tr: "Araba yıkanmalı.", id: "Mobil itu harus dicuci.", vi: "Chiếc xe phải được rửa." }

