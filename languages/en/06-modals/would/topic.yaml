          - { level: B2, form: { pattern: [{ term: Would you mind if }, { slot: subject }, { slot: past simple }] }, use: { en: polite permission, uk: "ввічливе прохання про дозвіл", es: "petición cortés de permiso", pt: "pedido educado de permissão", fr: "demande polie de permission", de: "höfliche Bitte um Erlaubnis", it: "richiesta cortese di permesso", pl: "uprzejma prośba o pozwolenie", tr: "nazik izin isteme", id: "permintaan izin yang sopan", vi: "xin phép lịch sự" }, ex: [{ target: Would you mind if }, " I opened the window?"], tr: { uk: "Ви не проти, якщо я відчиню вікно?", es: "¿Te molestaría que abriera la ventana?", pt: "Você se importaria se eu abrisse a janela?", fr: "Ça te dérangerait si j’ouvrais la fenêtre ?", de: "Hättest du etwas dagegen, wenn ich das Fenster öffne?", it: "Ti dispiacerebbe se aprissi la finestra?", pl: "Czy miałbyś coś przeciwko temu, żebym otworzył okno?", tr: "Pencereyi açsam sakıncası var mı?", id: "Apakah Anda keberatan jika saya membuka jendela?", vi: "Bạn có phiền nếu tôi mở cửa sổ không?" } }
          - { level: B2, form: { pattern: [{ slot: subject }, { term: wouldn't mind }, { alternatives: [{ slot: noun }, { slot: V-ing }] }] }, use: { en: "would be happy with it", uk: "був би радий цьому", es: "estaría contento con eso", pt: "ficaria contente com isso", fr: "en serait content", de: "wäre damit zufrieden", it: "ne sarebbe contento", pl: "byłby z tego zadowolony", tr: "bundan memnun olurdu", id: "akan senang dengan itu", vi: "sẽ hài lòng với điều đó" }, ex: ["I ", { target: wouldn't mind }, " a coffee."], tr: { uk: "Я б не відмовився від кави.", es: "No me vendría mal un café.", pt: "Eu não recusaria um café.", fr: "Je ne dirais pas non à un café.", de: "Gegen einen Kaffee hätte ich nichts einzuwenden.", it: "Un caffè non mi dispiacerebbe.", pl: "Nie miałbym nic przeciwko kawie.", tr: "Bir kahveye hayır demem.", id: "Saya tidak keberatan minum kopi.", vi: "Tôi cũng không phản đối một ly cà phê." } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: "To agree, answer no, because the question asks whether it is a problem:"
              uk: "Щоб погодитися, відповідайте «Ні», бо питання з’ясовує, чи це проблема:"
              es: "Para aceptar, se responde que no, porque la pregunta es si hay algún problema:"
              pt: "Para concordar, responda não, porque a pergunta é se isso é um problema:"
              fr: "Pour accepter, on répond non, car la question demande si c’est un problème :"
              de: "Zum Zustimmen antwortet man mit Nein, denn die Frage lautet, ob es ein Problem ist:"
              it: "Per accettare si risponde di no, perché la domanda chiede se è un problema:"
              pl: "Żeby się zgodzić, odpowiada się „nie”, bo pytanie dotyczy tego, czy to problem:"
              tr: "Kabul etmek için “hayır” yanıtı verilir, çünkü soru bunun bir sorun olup olmadığını sorar:"
              id: "Untuk menyetujui, jawab tidak, karena pertanyaannya menanyakan apakah hal itu masalah:"
              vi: "Để đồng ý, ta trả lời “không”, vì câu hỏi là liệu việc đó có phiền hay không:"
            ex: { exchange: [[{ target: Would you mind }, " opening the window?"], "No, not at all."] }
            tr: { uk: { exchange: ["Ви не проти відчинити вікно?", "Ні, зовсім не проти."] }, es: { exchange: ["¿Te importaría abrir la ventana?", "No, para nada."] }, pt: { exchange: ["Você se importaria de abrir a janela?", "Não, de jeito nenhum."] }, fr: { exchange: ["Ça te dérangerait d’ouvrir la fenêtre ?", "Non, pas du tout."] }, de: { exchange: ["Würde es dir etwas ausmachen, das Fenster zu öffnen?", "Nein, überhaupt nicht."] }, it: { exchange: ["Ti dispiacerebbe aprire la finestra?", "No, per niente."] }, pl: { exchange: ["Czy miałbyś coś przeciwko otwarciu okna?", "Nie, skądże."] }, tr: { exchange: ["Pencereyi açmanın sakıncası var mı?", "Hayır, hiç sakıncası yok."] }, id: { exchange: ["Apakah Anda keberatan membuka jendela?", "Tidak, sama sekali tidak."] }, vi: { exchange: ["Bạn có phiền mở cửa sổ giúp tôi không?", "Không, không phiền chút nào."] } }

