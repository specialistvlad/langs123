              fr: [{ term: "would" }, " a une seule forme pour tous les sujets : ", { term: "I would" }, ", ", { term: "she would" }, "."]
              de: [{ term: "would" }, " hat für alle Subjekte eine Form: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              it: [{ term: "would" }, " ha una sola forma per tutti i soggetti: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              pl: [{ term: "would" }, " ma jedną formę dla wszystkich podmiotów: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              tr: [{ term: "would" }, " tüm özneler için tek biçimdedir: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              id: [{ term: "would" }, " memiliki satu bentuk untuk semua subjek: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              vi: [{ term: "would" }, " có một dạng cho mọi chủ ngữ: ", { term: "I would" }, ", ", { term: "she would" }, "."]
          - type: rule
            level: B1
            text:
              en: ["The verb after ", { term: would }, " is in the base form:"]
              uk: ["Дієслово після ", { term: would }, " стоїть у початковій формі:"]
              es: ["El verbo después de ", { term: would }, " va en la forma base:"]
              pt: ["O verbo depois de ", { term: "would" }, " fica na forma base:"]
              fr: ["Le verbe après ", { term: "would" }, " est à la base verbale :"]
              de: ["Das Verb nach ", { term: "would" }, " steht in der Grundform:"]
              it: ["Il verbo dopo ", { term: "would" }, " è alla forma base:"]
              pl: ["Czasownik po ", { term: "would" }, " ma formę podstawową:"]
              tr: [{ term: "would" }, " sonrasında fiil yalın biçimdedir:"]
              id: ["Kata kerja sesudah ", { term: "would" }, " berbentuk dasar:"]
              vi: ["Động từ sau ", { term: "would" }, " ở dạng nguyên mẫu:"]
            ex: ["She would ", { target: help }, "."]
            tr: { uk: "Вона б допомогла.", es: "Ella ayudaría.", pt: "Ela ajudaria.", fr: "Elle aiderait.", de: "Sie würde helfen.", it: "Aiuterebbe.", pl: "Ona by pomogła.", tr: "O yardım ederdi.", id: "Dia akan membantu.", vi: "Cô ấy sẽ giúp." }
          - type: rule
            level: B1
            text:
              en: ["Questions and negatives need no ", { term: do }, ":"]
              uk: ["У питаннях і запереченнях ", { term: do }, " не потрібне:"]
              es: ["Las preguntas y las negaciones no necesitan ", { term: do }, ":"]
              pt: ["Perguntas e negações não precisam de ", { term: "do" }, ":"]
              fr: ["Les questions et les négations n’ont pas besoin de ", { term: "do" }, " :"]
              de: ["Fragen und Verneinung brauchen kein ", { term: "do" }, ":"]
              it: ["Domande e negazioni non richiedono ", { term: "do" }, ":"]
              pl: ["Pytania i przeczenia nie potrzebują ", { term: "do" }, ":"]
              tr: ["Soru ve olumsuz cümleler ", { term: "do" }, " gerektirmez:"]
              id: ["Pertanyaan dan kalimat negatif tidak memerlukan ", { term: "do" }, ":"]
              vi: ["Câu hỏi và câu phủ định không cần ", { term: "do" }, ":"]
            ex: { examples: [[{ target: Would }, " you go?"], ["I ", { target: wouldn't }, " go."]] }
            tr: { uk: { examples: ["Ти б пішов?", "Я б не пішов."] }, es: { examples: ["¿Irías?", "No iría."] }, pt: { examples: ["Você iria?", "Eu não iria."] }, fr: { examples: ["Irais-tu ?", "Je n’irais pas."] }, de: { examples: ["Würdest du gehen?", "Ich würde nicht gehen."] }, it: { examples: ["Andresti?", "Non andrei."] }, pl: { examples: ["Czy poszedłbyś?", "Nie poszedłbym."] }, tr: { examples: ["Gider miydin?", "Gitmezdim."] }, id: { examples: ["Apakah kamu akan pergi?", "Saya tidak akan pergi."] }, vi: { examples: ["Bạn sẽ đi không?", "Tôi sẽ không đi."] } }

