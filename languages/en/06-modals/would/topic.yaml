        - { level: B2, point: { en: Would rather, uk: "Would rather", es: "Would rather", pt: "Would rather", fr: "Would rather", de: "Would rather", it: "Would rather", pl: "Would rather", tr: "Would rather", id: "Would rather", vi: "Would rather" }, rule: { en: [{ term: would rather }, " states a preference; the negative is ", { term: would rather not }], uk: [{ term: "would rather" }, " виражає перевагу; заперечна форма — ", { term: "would rather not" }], es: [{ term: "would rather" }, " expresa una preferencia; la forma negativa es ", { term: "would rather not" }], pt: [{ term: "would rather" }, " expressa uma preferência; a forma negativa é ", { term: "would rather not" }], fr: [{ term: "would rather" }, " exprime une préférence ; la forme négative est ", { term: "would rather not" }], de: [{ term: "would rather" }, " drückt eine Vorliebe aus; die Verneinung ist ", { term: "would rather not" }], it: [{ term: "would rather" }, " esprime una preferenza; la forma negativa è ", { term: "would rather not" }], pl: [{ term: "would rather" }, " wyraża preferencję; forma przecząca to ", { term: "would rather not" }], tr: [{ term: "would rather" }, " bir tercihi bildirir; olumsuz biçimi: ", { term: "would rather not" }], id: [{ term: "would rather" }, " menyatakan preferensi; bentuk negatifnya adalah ", { term: "would rather not" }], vi: [{ term: "would rather" }, " diễn tả sự ưu tiên; dạng phủ định là ", { term: "would rather not" }] }, ex: ["I", { target: "'d rather" }, " stay in tonight."], tr: { uk: "Я б краще залишився вдома сьогодні ввечері.", es: "Prefiero quedarme en casa esta noche.", pt: "Prefiro ficar em casa hoje à noite.", fr: "Je préfère rester à la maison ce soir.", de: "Ich bleibe heute Abend lieber zu Hause.", it: "Stasera preferisco restare a casa.", pl: "Wolałbym dziś wieczorem zostać w domu.", tr: "Bu akşam evde kalmayı tercih ederim.", id: "Saya lebih suka di rumah malam ini.", vi: "Tối nay tôi muốn ở nhà hơn." } }
        - { level: B2, point: { en: Would you mind, uk: "Would you mind", es: "Would you mind", pt: "Would you mind", fr: "Would you mind", de: "Would you mind", it: "Would you mind", pl: "Would you mind", tr: "Would you mind", id: "Would you mind", vi: "Would you mind" }, rule: { en: [{ term: Would you mind }, " takes -ing; with ", { term: if }, " it takes the past simple"], uk: [{ term: "Would you mind" }, " вимагає форми з -ing; з ", { term: "if" }, " — Past Simple"], es: [{ term: "Would you mind" }, " va con -ing; con ", { term: "if" }, " va con el pasado simple"], pt: [{ term: "Would you mind" }, " é seguido de -ing; com ", { term: "if" }, " leva o passado simples"], fr: [{ term: "Would you mind" }, " se construit avec -ing ; avec ", { term: "if" }, " il prend le prétérit simple"], de: [{ term: "Would you mind" }, " steht mit -ing; mit ", { term: "if" }, " steht das Simple Past"], it: [{ term: "Would you mind" }, " è seguito da -ing; con ", { term: "if" }, " richiede il past simple"], pl: [{ term: "Would you mind" }, " łączy się z formą -ing; z ", { term: "if" }, " wymaga Past Simple"], tr: [{ term: "Would you mind" }, " ile -ing kullanılır; ", { term: "if" }, " ile Simple Past kullanılır"], id: [{ term: "Would you mind" }, " diikuti -ing; dengan ", { term: "if" }, " memakai simple past"], vi: [{ term: "Would you mind" }, " đi với -ing; với ", { term: "if" }, " thì dùng quá khứ đơn"] }, ex: [{ target: Would you mind }, " opening the window?"], tr: { uk: "Ви не проти відчинити вікно?", es: "¿Te importaría abrir la ventana?", pt: "Você se importaria de abrir a janela?", fr: "Ça te dérangerait d’ouvrir la fenêtre ?", de: "Würde es dir etwas ausmachen, das Fenster zu öffnen?", it: "Ti dispiacerebbe aprire la finestra?", pl: "Czy miałbyś coś przeciwko otwarciu okna?", tr: "Pencereyi açmanın sakıncası var mı?", id: "Apakah Anda keberatan membuka jendela?", vi: "Bạn có phiền mở cửa sổ giúp tôi không?" } }
        - { level: B2, point: { en: Hedged opinion, uk: "Обережна думка", es: "Opinión matizada", pt: "Opinião atenuada", fr: "Opinion nuancée", de: "Abgeschwächte Meinung", it: "Opinione attenuata", pl: "Złagodzona opinia", tr: "Yumuşatılmış görüş", id: "Pendapat yang dilunakkan", vi: "Ý kiến giảm nhẹ" }, rule: { en: [{ term: I would say }, " and ", { term: I would think }, " soften an opinion"], uk: [{ term: "I would say" }, " і ", { term: "I would think" }, " пом’якшують думку"], es: [{ term: "I would say" }, " y ", { term: "I would think" }, " suavizan una opinión"], pt: [{ term: "I would say" }, " e ", { term: "I would think" }, " suavizam uma opinião"], fr: [{ term: "I would say" }, " et ", { term: "I would think" }, " atténuent une opinion"], de: [{ term: "I would say" }, " und ", { term: "I would think" }, " schwächen eine Meinung ab"], it: [{ term: "I would say" }, " e ", { term: "I would think" }, " attenuano un'opinione"], pl: [{ term: "I would say" }, " i ", { term: "I would think" }, " łagodzą opinię"], tr: [{ term: "I would say" }, " ve ", { term: "I would think" }, " bir görüşü yumuşatır"], id: [{ term: "I would say" }, " dan ", { term: "I would think" }, " melunakkan pendapat"], vi: [{ term: "I would say" }, " và ", { term: "I would think" }, " làm dịu một ý kiến"] }, ex: ["I ", { target: would say }, " it's too expensive."], tr: { uk: "Я б сказав, що це задорого.", es: "Yo diría que es demasiado caro.", pt: "Eu diria que é caro demais.", fr: "Je dirais que c’est trop cher.", de: "Ich würde sagen, das ist zu teuer.", it: "Direi che è troppo caro.", pl: "Powiedziałbym, że to za drogo.", tr: "Bence bu biraz fazla pahalı.", id: "Saya rasa ini terlalu mahal.", vi: "Tôi cho rằng nó quá đắt." } }
        - { level: C1, point: { en: Indirectness, uk: "Непряме формулювання", es: "Formulación indirecta", pt: "Formulação indireta", fr: "Formulation indirecte", de: "Indirekte Formulierung", it: "Formulazione indiretta", pl: "Pośrednie sformułowania", tr: "Dolaylı ifade", id: "Penyampaian tak langsung", vi: "Cách nói gián tiếp" }, rule: { en: [{ term: would be grateful if }, " makes a formal request"], uk: [{ term: "would be grateful if" }, " вводить офіційне прохання"], es: [{ term: "would be grateful if" }, " introduce una petición formal"], pt: [{ term: "would be grateful if" }, " introduce um pedido formal"], fr: [{ term: "would be grateful if" }, " introduit une demande formelle"], de: [{ term: "would be grateful if" }, " leitet eine förmliche Bitte ein"], it: [{ term: "would be grateful if" }, " introduce una richiesta formale"], pl: [{ term: "would be grateful if" }, " wprowadza oficjalną prośbę"], tr: [{ term: "would be grateful if" }, " resmî bir rica başlatır"], id: [{ term: "would be grateful if" }, " mengawali permintaan formal"], vi: [{ term: "would be grateful if" }, " mở đầu một yêu cầu trang trọng"] }, ex: ["We ", { target: would be grateful if }, " you could reply."], tr: { uk: "Ми були б вдячні, якби ви могли відповісти.", es: "Le agradeceríamos que pudiera responder.", pt: "Ficaríamos agradecidos se você pudesse responder.", fr: "Nous vous serions reconnaissants de bien vouloir répondre.", de: "Wir wären dankbar, wenn Sie antworten könnten.", it: "Le saremmo grati se potesse rispondere.", pl: "Bylibyśmy wdzięczni, gdyby mogli Państwo odpowiedzieć.", tr: "Cevap verebilirseniz minnettar oluruz.", id: "Kami akan berterima kasih jika Anda dapat membalas.", vi: "Chúng tôi sẽ rất biết ơn nếu quý vị có thể phản hồi." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: used to }, " for a past state: ", { term: live }, ", ", { term: be }, ", ", { term: have }, ", ", { term: know }], uk: [{ term: used to }, " для минулого стану: ", { term: live }, ", ", { term: be }, ", ", { term: have }, ", ", { term: know }], es: [{ term: used to }, " para un estado del pasado: ", { term: live }, ", ", { term: be }, ", ", { term: have }, ", ", { term: know }], pt: [{ term: "used to" }, " para um estado do passado: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], fr: [{ term: "used to" }, " pour un état passé : ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], de: [{ term: "used to" }, " für einen Zustand in der Vergangenheit: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], it: [{ term: "used to" }, " per uno stato del passato: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], pl: [{ term: "used to" }, " dla stanu z przeszłości: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], tr: [{ term: "used to" }, ", geçmişteki durumlar için: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], id: [{ term: "used to" }, " untuk keadaan di masa lalu: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }], vi: [{ term: "used to" }, " cho trạng thái trong quá khứ: ", { term: "live" }, ", ", { term: "be" }, ", ", { term: "have" }, ", ", { term: "know" }] }, ex: ["When I was young, I ", { target: used to }, " live in Paris."], tr: { uk: "Коли я був молодим, я жив у Парижі.", es: "Cuando era joven, vivía en París.", pt: "Quando eu era jovem, morava em Paris.", fr: "Quand j’étais jeune, j’habitais à Paris.", de: "Als ich jung war, habe ich in Paris gewohnt.", it: "Quando ero giovane, vivevo a Parigi.", pl: "Kiedy byłem młody, mieszkałem w Paryżu.", tr: "Gençken Paris’te yaşardım.", id: "Ketika masih muda, saya tinggal di Paris.", vi: "Hồi trẻ, tôi từng sống ở Paris." } }

sections:
  - title: { en: "Form: would", uk: "Форма: would", es: "Forma: would", pt: "Forma: would", fr: "Forme : would", de: "Form: would", it: "Forma: would", pl: "Forma: would", tr: "Biçim: would", id: "Bentuk: would", vi: "Dạng: would" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative, uk: "Ствердження", es: "Afirmación", pt: "Afirmação", fr: "Affirmation", de: "Bejahung", it: "Affermazione", pl: "Twierdzenie", tr: "Olumlu", id: "Positif", vi: "Khẳng định" }, pattern: { pattern: [{ slot: subject }, { alternatives: [would, "'d"] }, { slot: V }] }, ex: ["She ", { target: would }, " help."] }
          - { level: B1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative, uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [{ slot: subject }, wouldn't, { slot: V }] }, ex: ["I ", { target: wouldn't }, " go."] }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }, pattern: { pattern: [Would, { slot: subject }, { slot: V }] }, ex: [{ target: Would }, " you like tea?"] }
          - { level: B1, features: { interrogativity: decl, polarity: [pos, neg] }, form: { en: Short answer, uk: "Коротка відповідь", es: "Respuesta corta", pt: "Resposta curta", fr: "Réponse courte", de: "Kurzantwort", it: "Risposta breve", pl: "Krótka odpowiedź", tr: "Kısa cevap", id: "Jawaban singkat", vi: "Câu trả lời ngắn" }, pattern: { alternatives: [["Yes, ", { gap: true }, " would."], ["No, ", { gap: true }, " wouldn't."]] }, ex: { examples: [["Yes, I ", { target: would }, "."], ["No, I ", { target: wouldn't }, "."]] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: would }, " has one form for every subject: ", { term: I would }, ", ", { term: she would }, "."]
              uk: [{ term: would }, " має одну форму для всіх підметів: ", { term: I would }, ", ", { term: she would }, "."]
              es: [{ term: would }, " tiene una sola forma para todos los sujetos: ", { term: I would }, ", ", { term: she would }, "."]
              pt: [{ term: "would" }, " tem uma só forma para todos os sujeitos: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              fr: [{ term: "would" }, " a une seule forme pour tous les sujets : ", { term: "I would" }, ", ", { term: "she would" }, "."]
              de: [{ term: "would" }, " hat für alle Subjekte eine Form: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              it: [{ term: "would" }, " ha una sola forma per tutti i soggetti: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              pl: [{ term: "would" }, " ma jedną formę dla wszystkich podmiotów: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              tr: [{ term: "would" }, " tüm özneler için tek biçimdedir: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              id: [{ term: "would" }, " memiliki satu bentuk untuk semua subjek: ", { term: "I would" }, ", ", { term: "she would" }, "."]
              vi: [{ term: "would" }, " có một dạng cho mọi chủ ngữ: ", { term: "I would" }, ", ", { term: "she would" }, "."]
          - type: rule
            level: B1
            text:
              en: ["The verb after ", { term: would }, " is in the base form:"]
              uk: ["Дієслово після ", { term: would }, " стоїть у початковій формі:"]
              es: ["El verbo después de ", { term: would }, " va en la forma base:"]
              pt: ["O verbo depois de ", { term: "would" }, " fica na forma base:"]
              fr: ["Le verbe après ", { term: "would" }, " est à la base verbale :"]
              de: ["Das Verb nach ", { term: "would" }, " steht in der Grundform:"]
              it: ["Il verbo dopo ", { term: "would" }, " è alla forma base:"]
              pl: ["Czasownik po ", { term: "would" }, " ma formę podstawową:"]
              tr: [{ term: "would" }, " sonrasında fiil yalın biçimdedir:"]
              id: ["Kata kerja sesudah ", { term: "would" }, " berbentuk dasar:"]
              vi: ["Động từ sau ", { term: "would" }, " ở dạng nguyên mẫu:"]
            ex: ["She would ", { target: help }, "."]
            tr: { uk: "Вона б допомогла.", es: "Ella ayudaría.", pt: "Ela ajudaria.", fr: "Elle aiderait.", de: "Sie würde helfen.", it: "Aiuterebbe.", pl: "Ona by pomogła.", tr: "O yardım ederdi.", id: "Dia akan membantu.", vi: "Cô ấy sẽ giúp." }
          - type: rule
            level: B1
            text:
              en: ["Questions and negatives need no ", { term: do }, ":"]
              uk: ["У питаннях і запереченнях ", { term: do }, " не потрібне:"]
              es: ["Las preguntas y las negaciones no necesitan ", { term: do }, ":"]
              pt: ["Perguntas e negações não precisam de ", { term: "do" }, ":"]
              fr: ["Les questions et les négations n’ont pas besoin de ", { term: "do" }, " :"]
              de: ["Fragen und Verneinung brauchen kein ", { term: "do" }, ":"]
              it: ["Domande e negazioni non richiedono ", { term: "do" }, ":"]
              pl: ["Pytania i przeczenia nie potrzebują ", { term: "do" }, ":"]
              tr: ["Soru ve olumsuz cümleler ", { term: "do" }, " gerektirmez:"]
              id: ["Pertanyaan dan kalimat negatif tidak memerlukan ", { term: "do" }, ":"]
              vi: ["Câu hỏi và câu phủ định không cần ", { term: "do" }, ":"]
            ex: { examples: [[{ target: Would }, " you go?"], ["I ", { target: wouldn't }, " go."]] }
            tr: { uk: { examples: ["Ти б пішов?", "Я б не пішов."] }, es: { examples: ["¿Irías?", "No iría."] }, pt: { examples: ["Você iria?", "Eu não iria."] }, fr: { examples: ["Irais-tu ?", "Je n’irais pas."] }, de: { examples: ["Würdest du gehen?", "Ich würde nicht gehen."] }, it: { examples: ["Andresti?", "Non andrei."] }, pl: { examples: ["Czy poszedłbyś?", "Nie poszedłbym."] }, tr: { examples: ["Gider miydin?", "Gitmezdim."] }, id: { examples: ["Apakah kamu akan pergi?", "Saya tidak akan pergi."] }, vi: { examples: ["Bạn sẽ đi không?", "Tôi sẽ không đi."] } }

  - title: { en: "Form: short forms", uk: "Форма: скорочені форми", es: "Forma: formas contraídas", pt: "Forma: formas contraídas", fr: "Forme : formes contractées", de: "Form: Kurzformen", it: "Forma: forme contratte", pl: "Forma: formy skrócone", tr: "Biçim: kısa biçimler", id: "Bentuk: bentuk singkat", vi: "Dạng: các dạng rút gọn" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: full, label: { en: Full form, uk: "Повна форма", es: "Forma completa", pt: "Forma completa", fr: "Forme pleine", de: "Langform", it: "Forma estesa", pl: "Forma pełna", tr: "Tam biçim", id: "Bentuk lengkap", vi: "Dạng đầy đủ" }, features: { contraction: full } }
          - { key: short, label: { en: Short form, uk: "Скорочена форма", es: "Forma contraída", pt: "Forma contraída", fr: "Forme contractée", de: "Kurzform", it: "Forma contratta", pl: "Forma skrócona", tr: "Kısa biçim", id: "Bentuk singkat", vi: "Dạng rút gọn" }, features: { contraction: short } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
