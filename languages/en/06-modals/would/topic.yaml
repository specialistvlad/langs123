sections:
  - title: { en: "Form: would", uk: "Форма: would", es: "Forma: would", pt: "Forma: would", fr: "Forme : would", de: "Form: would", it: "Forma: would", pl: "Forma: would", tr: "Biçim: would", id: "Bentuk: would", vi: "Dạng: would" }
