title: { en: Can and Could, uk: Can і could, es: Can y could }
summary:
  lead:
    en: [{ term: Can }, " for ability, permission and requests; ", { term: could }, " for past ability, polite requests and possibility."]
    uk: [{ term: Can }, " виражає вміння, дозвіл і прохання; ", { term: could }, " — вміння в минулому, ввічливі прохання й можливість."]
    es: [{ term: Can }, " expresa habilidad, permiso y peticiones; ", { term: could }, ", habilidad en el pasado, peticiones corteses y posibilidad."]
  rule:
    en: [{ term: Can }, " and ", { term: could }, " never change and take the base verb without ", { term: to }, ":"]
    uk: [{ term: Can }, " і ", { term: could }, " не змінюються й вживаються з початковою формою дієслова без ", { term: to }, ":"]
    es: [{ term: Can }, " y ", { term: could }, " nunca cambian y van con la forma base del verbo, sin ", { term: to }, ":"]
  ex: ["She ", { target: can }, " swim. ", { target: Can }, " she swim?"]

