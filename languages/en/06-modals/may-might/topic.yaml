          - { level: A2, wrong: It might to rain., right: ["It might ", { target: rain }, "."], rule: { en: [{ pattern: [{ term: might }, { slot: base verb }] }, "; no ", { term: to }], uk: [{ pattern: [{ term: might }, { slot: base verb }] }, "; без ", { term: to }], es: [{ pattern: [{ term: might }, { slot: base verb }] }, "; sin ", { term: to }] } }
          - { level: A2, wrong: I don't might go., right: ["I ", { target: might not }, " go."], rule: { en: ["negative = ", { term: might not }], uk: ["заперечення — ", { term: might not }], es: ["la negación es ", { term: might not }] } }
          - { level: A2, wrong: He maybe at home., right: { alternatives: [["He ", { target: may be }, " at home."], [{ target: Maybe }, " he is at home."]] }, rule: { en: [{ term: may be }, " after the subject; ", { term: maybe }, " at the start"], uk: [{ term: may be }, " стоїть після підмета, ", { term: maybe }, " — на початку речення"], es: [{ term: may be }, " va después del sujeto; ", { term: maybe }, ", al principio"] } }
          - { level: A2, wrong: She might will come., right: ["She ", { target: might }, " come."], rule: { en: a modal verb takes no second modal, uk: "після модального дієслова не стоїть друге модальне", es: "un verbo modal no admite otro modal después" } }
          - { level: A2, speakers: [uk], wrong: It can rain tomorrow., right: ["It ", { target: might }, " rain tomorrow."], rule: { uk: ["для можливості вживають ", { term: may }, " або ", { term: might }, ", а не ", { term: can }, "; українське «може» передає все це"] } }
          - { level: A2, speakers: [es], wrong: It can rain tomorrow., right: ["It ", { target: might }, " rain tomorrow."], rule: { es: ["para una posibilidad se usa ", { term: may }, " o ", { term: might }, ", no ", { term: can }, "; el español «puede» sirve para todo"] } }
