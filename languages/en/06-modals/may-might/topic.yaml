              fr: ["On emploie ", { term: "will" }, " quand on est sûr et ", { alternatives: [{ term: "may" }, { term: "might" }] }, " quand on ne l’est pas."]
              de: [{ term: "will" }, " steht bei Sicherheit, ", { alternatives: [{ term: "may" }, { term: "might" }] }, " bei Unsicherheit."]
