        rows:
          - { level: A2, form: might, sound: { ipa: maɪt }, ex: ["It ", { target: might }, " rain. ", { ipa: ɪt maɪt reɪn }], tr: { uk: "Може піти дощ.", es: "Podría llover." } }
          - { level: A2, form: may, sound: { ipa: meɪ }, ex: ["It ", { target: may }, " rain. ", { ipa: ɪt meɪ reɪn }], tr: { uk: "Можливо, піде дощ.", es: "Puede que llueva." } }
          - { level: A2, form: maybe, sound: { ipa: ˈmeɪbi }, ex: [{ target: Maybe }, " later. ", { ipa: ˈmeɪbi ˈleɪtə }], tr: { uk: "Можливо, пізніше.", es: "Quizá más tarde." } }
      - type: list
