          - { level: B2, form: { pattern: [{ slot: subject }, { alternatives: [{ term: can't }, { term: couldn't }] }, { slot: base verb }] }, use: { en: "sure it is false, from evidence", uk: "упевнені, що це неправда, на підставі фактів", es: "se está seguro de que es falso, por la evidencia", pt: "há certeza de que é falso, pelas evidências", fr: "on est sûr que c’est faux, d’après des indices", de: "sicher, dass es nicht stimmt, aufgrund von Belegen", it: "si è sicuri che sia falso, per via delle prove", pl: "pewność, że to nieprawda, na podstawie dowodów", tr: "kanıtlara dayanarak yanlış olduğundan emin olmak", id: "yakin hal itu salah, berdasarkan bukti", vi: "chắc chắn điều đó sai, dựa trên bằng chứng" }, ex: ["He ", { target: can't }, " be at work. It's Sunday."], tr: { uk: "Він не може бути на роботі. Сьогодні неділя.", es: "No puede estar en el trabajo. Es domingo.", pt: "Ele não pode estar no trabalho. É domingo.", fr: "Il ne peut pas être au travail. C’est dimanche.", de: "Er kann nicht bei der Arbeit sein. Es ist Sonntag.", it: "Non può essere al lavoro. È domenica.", pl: "On nie może być w pracy. Jest niedziela.", tr: "İşte olamaz. Bugün pazar.", id: "Dia tidak mungkin ada di kantor. Hari ini hari Minggu.", vi: "Anh ấy không thể đang ở chỗ làm. Hôm nay là Chủ nhật." } }
