        - { level: A2, point: { en: Negative, uk: "Заперечення", es: "Negación" }, rule: { alternatives: [might not, may not] }, ex: ["He ", { target: might not }, " come."], tr: { uk: "Він, можливо, не прийде.", es: "Puede que él no venga." } }
