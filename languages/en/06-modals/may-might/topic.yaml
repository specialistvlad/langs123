  - title: { en: Certainty about the present }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern } }
          - { key: use, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: { pattern: [{ slot: subject }, { term: must }, { slot: base verb }] }, use: { en: "sure it is true, from evidence" }, ex: ["You've been up since five. You ", { target: must }, " be tired."] }
          - { level: B2, form: { pattern: [{ slot: subject }, { alternatives: [{ term: can't }, { term: couldn't }] }, { slot: base verb }] }, use: { en: "sure it is false, from evidence" }, ex: ["He ", { target: can't }, " be at work. It's Sunday."] }
          - { level: B2, form: { pattern: [{ slot: subject }, { alternatives: [{ term: may }, { term: might }, { term: could }] }, { slot: base verb }] }, use: { en: "possible, but not sure" }, ex: ["She ", { target: might }, " be at the gym."] }
          - { level: B2, form: { pattern: [{ slot: subject }, { alternatives: [{ term: must }, { term: can't }] }, { term: be }, { slot: V-ing }] }, use: { en: "sure about something happening now" }, ex: ["She isn't answering. She ", { target: must be working }, "."] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: ["A deduction about a state uses a state verb, such as ", { term: be }, ", ", { term: have }, " or ", { term: know }, ":"]
            ex: ["They ", { target: must have }, " a lot of money."]
          - type: note
            level: B2
            variety: en-US
            text:
              en: ["US English also says ", { term: must not be }, " for a deduction that is false."]

