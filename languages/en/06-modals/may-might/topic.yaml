          - { level: B2, modal: { term: may }, pct: "40–60%", ex: ["She ", { target: may }, " be at the gym."], tr: { uk: "Вона, можливо, у спортзалі.", es: "Puede que esté en el gimnasio.", pt: "Ela pode estar na academia.", fr: "Elle est peut-être à la salle de sport.", de: "Sie ist vielleicht im Fitnessstudio.", it: "Potrebbe essere in palestra.", pl: "Być może jest na siłowni.", tr: "Spor salonunda olabilir.", id: "Dia mungkin ada di pusat kebugaran.", vi: "Có thể cô ấy đang ở phòng tập." } }
          - { level: B2, modal: { term: might }, pct: "30–50%", ex: ["It ", { target: might }, " snow tonight."], tr: { uk: "Сьогодні вночі може піти сніг.", es: "Podría nevar esta noche.", pt: "Pode nevar hoje à noite.", fr: "Il pourrait neiger ce soir.", de: "Es könnte heute Nacht schneien.", it: "Stanotte potrebbe nevicare.", pl: "Dziś w nocy może spaść śnieg.", tr: "Bu gece kar yağabilir.", id: "Malam ini mungkin turun salju.", vi: "Tối nay trời có thể có tuyết." } }
          - { level: B2, modal: { term: could }, pct: "20–40%", ex: ["It ", { target: could }, " be a mistake."], tr: { uk: "Це могла б бути помилка.", es: "Podría ser un error.", pt: "Pode ser um erro.", fr: "Ce pourrait être une erreur.", de: "Das könnte ein Fehler sein.", it: "Potrebbe essere un errore.", pl: "To mogłaby być pomyłka.", tr: "Bu bir hata olabilir.", id: "Itu bisa jadi sebuah kesalahan.", vi: "Đây có thể là một sự nhầm lẫn." } }
          - { level: B2, modal: { term: can't }, pct: "<10%", ex: ["That ", { target: can't }, " be her. She is abroad."], tr: { uk: "Це не може бути вона. Вона за кордоном.", es: "No puede ser ella. Está en el extranjero.", pt: "Não pode ser ela. Ela está no exterior.", fr: "Ça ne peut pas être elle. Elle est à l’étranger.", de: "Das kann sie nicht sein. Sie ist im Ausland.", it: "Non può essere lei. È all’estero.", pl: "To nie może być ona. Ona jest za granicą.", tr: "Bu o olamaz. O yurtdışında.", id: "Itu tidak mungkin dia. Dia sedang di luar negeri.", vi: "Đó không thể là cô ấy. Cô ấy đang ở nước ngoài." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Use ", { term: will }, " when you are sure and ", { alternatives: [{ term: may }, { term: might }] }, " when you are not."]
              uk: ["Вживай ", { term: will }, ", коли ти впевнений, і ", { alternatives: [{ term: may }, { term: might }] }, ", коли ні."]
              es: ["Usa ", { term: will }, " cuando estás seguro y ", { alternatives: [{ term: may }, { term: might }] }, " cuando no lo estás."]
