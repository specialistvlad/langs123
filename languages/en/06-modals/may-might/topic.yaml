              uk: [{ term: could }, " теж виражає можливість: ", { term: It could rain }, ". Див. ", { link: "Can і could", to: en.modals.can-could }, "."]
              es: [{ term: could }, " también expresa posibilidad: ", { term: It could rain }, ". Ver ", { link: "Can y could", to: en.modals.can-could }, "."]

  - title: { en: Signal words, uk: "Слова-маркери", es: "Palabras clave" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, word: maybe, ex: [{ signal: Maybe }, " she is busy."], tr: { uk: "Можливо, вона зайнята.", es: "Quizá esté ocupada." } }
          - { level: A2, word: perhaps, ex: [{ signal: Perhaps }, " we can meet later."], tr: { uk: "Можливо, ми зможемо зустрітися пізніше.", es: "Quizá podamos vernos más tarde." } }
          - { level: A2, word: probably, ex: ["She'll ", { signal: probably }, " come."], tr: { uk: "Вона, ймовірно, прийде.", es: "Probablemente vendrá." } }
          - { level: A2, word: I'm not sure, ex: [{ signal: I'm not sure. }, " It might rain."], tr: { uk: "Я не впевнений. Може піти дощ.", es: "No estoy seguro. Podría llover." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: maybe }, " is one word and starts a clause:"]
              uk: [{ term: maybe }, " — одне слово, воно починає речення:"]
              es: [{ term: maybe }, " es una sola palabra y empieza una oración:"]
            ex: [{ target: Maybe }, " he is late."]
            tr: { uk: "Можливо, він запізнюється.", es: "Quizá llegue tarde." }
          - type: rule
            level: A2
            text:
              en: [{ term: may be }, " is two words and follows the subject:"]
              uk: [{ term: may be }, " — два слова, воно стоїть після підмета:"]
              es: [{ term: may be }, " son dos palabras y va después del sujeto:"]
            ex: ["He ", { target: may be }, " late."]
            tr: { uk: "Він, можливо, запізнюється.", es: "Puede que llegue tarde." }

  - title: { en: Degrees of certainty, uk: "Ступені впевненості", es: "Grados de certeza" }
    role: own
    content:
      - type: usage
        columns:
          - { key: degree, label: { en: Certainty, uk: "Упевненість", es: "Certeza" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, degree: { en: sure, uk: "упевнено", es: "seguro" }, ex: { examples: [["She ", { target: will }, " come."], ["She ", { target: won't }, " come."]] }, tr: { uk: { examples: ["Вона прийде.", "Вона не прийде."] }, es: { examples: ["Ella vendrá.", "Ella no vendrá."] } } }
          - { level: B1, degree: { en: very likely, uk: "дуже ймовірно", es: "muy probable" }, ex: ["She'll ", { target: probably }, " come."], tr: { uk: "Вона, ймовірно, прийде.", es: "Probablemente vendrá." } }
          - { level: B1, degree: { en: possible, uk: "можливо", es: "posible" }, ex: { examples: [["She ", { target: may }, " come."], ["She ", { target: might }, " come."]] }, tr: { uk: { examples: ["Вона, можливо, прийде.", "Вона, може, й прийде."] }, es: { examples: ["Puede que ella venga.", "Ella podría venir."] } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Use ", { term: will }, " when you are sure and ", { alternatives: [{ term: may }, { term: might }] }, " when you are not."]
              uk: ["Вживай ", { term: will }, ", коли ти впевнений, і ", { alternatives: [{ term: may }, { term: might }] }, ", коли ні."]
              es: ["Usa ", { term: will }, " cuando estás seguro y ", { alternatives: [{ term: may }, { term: might }] }, " cuando no lo estás."]

