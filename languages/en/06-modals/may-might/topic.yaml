        - { level: A2, point: { en: [{ term: Might }, " or ", { term: may }], uk: [{ term: Might }, " чи ", { term: may }], es: [{ term: Might }, " o ", { term: may }] }, rule: { en: [{ term: might }, " sounds a little less sure"], uk: [{ term: might }, " звучить трохи менш упевнено"], es: [{ term: might }, " suena un poco menos seguro"] }, ex: { examples: [["It ", { target: might }, " rain."], ["It ", { target: may }, " rain."]] }, tr: { uk: { examples: ["Може, й піде дощ.", "Можливо, піде дощ."] }, es: { examples: ["Podría llover.", "Puede que llueva."] } } }
        - { level: A2, point: { en: Possibility question, uk: "Питання про можливість", es: "Pregunta sobre posibilidad" }, rule: { en: ["ask with ", { pattern: [{ term: think }, { term: will }] }], uk: ["питання ставлять так: ", { pattern: [{ term: think }, { term: will }] }], es: ["se pregunta con ", { pattern: [{ term: think }, { term: will }] }] }, ex: ["Do you think it ", { target: will }, " rain?"], tr: { uk: "Як гадаєш, піде дощ?", es: "¿Crees que lloverá?" } }
        - { level: B1, point: { en: Permission, uk: "Дозвіл", es: "Permiso" }, rule: { en: [{ pattern: [{ term: May }, { slot: subject }, { slot: base verb }] }, " asks; ", { term: may }, " allows in formal rules"], uk: [{ pattern: [{ term: May }, { slot: subject }, { slot: base verb }] }, " просить дозволу; ", { term: may }, " дозволяє у формальних правилах"], es: [{ pattern: [{ term: May }, { slot: subject }, { slot: base verb }] }, " pide permiso; ", { term: may }, " permite en normas formales"] }, ex: { examples: [[{ target: May }, " I use your phone?"], ["Guests ", { target: may }, " use the pool until 10."]] }, tr: { uk: { examples: ["Можна мені скористатися твоїм телефоном?", "Гості можуть користуватися басейном до десятої."] }, es: { examples: ["¿Puedo usar tu teléfono?", "Los huéspedes pueden usar la piscina hasta las 10."] } } }
        - { level: B1, point: { en: Certainty, uk: "Ступінь упевненості", es: "Grado de certeza" }, rule: { en: [{ term: will }, " is sure, ", { term: probably }, " very likely, ", { alternatives: [{ term: may }, { term: might }] }, " possible"], uk: [{ term: will }, " — упевнено, ", { term: probably }, " — дуже ймовірно, ", { alternatives: [{ term: may }, { term: might }] }, " — можливо"], es: [{ term: will }, " es seguro, ", { term: probably }, " muy probable, ", { alternatives: [{ term: may }, { term: might }] }, " posible"] }, ex: { examples: [["She ", { target: will }, " come."], ["She'll ", { target: probably }, " come."], ["She ", { target: may }, " come."]] }, tr: { uk: { examples: ["Вона прийде.", "Вона, ймовірно, прийде.", "Вона, можливо, прийде."] }, es: { examples: ["Ella vendrá.", "Probablemente vendrá.", "Puede que venga."] } } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ term: may be }, " follows the subject; ", { term: maybe }, " starts a clause"], uk: [{ term: may be }, " стоїть після підмета; ", { term: maybe }, " починає речення"], es: [{ term: may be }, " va después del sujeto; ", { term: maybe }, " empieza una oración"] }, ex: { examples: [["He ", { target: may be }, " late."], [{ target: Maybe }, " he is late."]] }, tr: { uk: { examples: ["Він, можливо, запізнюється.", "Можливо, він запізнюється."] }, es: { examples: ["Puede que llegue tarde.", "Quizá llegue tarde."] } } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: might }, " and ", { term: may }, " have one form for every subject: ", { term: she might }, ", ", { term: she may }, "."]
              uk: [{ term: might }, " і ", { term: may }, " мають одну форму для всіх підметів: ", { term: she might }, ", ", { term: she may }, "."]
              es: [{ term: might }, " y ", { term: may }, " tienen una sola forma para todos los sujetos: ", { term: she might }, ", ", { term: she may }, "."]
          - type: rule
            level: A2
            text:
              en: ["The verb after ", { term: might }, " or ", { term: may }, " is in the base form:"]
              uk: ["Дієслово після ", { term: might }, " або ", { term: may }, " стоїть у початковій формі:"]
              es: ["El verbo después de ", { term: might }, " o ", { term: may }, " va en la forma base:"]
            ex: ["It might ", { target: rain }, "."]
            tr: { uk: "Може піти дощ.", es: "Podría llover." }
          - type: rule
            level: A2
            text:
              en: ["The negative is ", { alternatives: [{ term: might not }, { term: may not }] }, "."]
              uk: ["Заперечення — ", { alternatives: [{ term: might not }, { term: may not }] }, "."]
              es: ["La negación es ", { alternatives: [{ term: might not }, { term: may not }] }, "."]
          - type: rule
            level: B1
            text:
              en: ["Questions with ", { term: may }, " ask for permission, with ", { term: may }, " before the subject:"]
              uk: ["Питання з ", { term: may }, " просять дозволу; ", { term: may }, " стоїть перед підметом:"]
              es: ["Las preguntas con ", { term: may }, " piden permiso, y ", { term: may }, " va antes del sujeto:"]
            ex: [{ target: May }, " I sit here?"]
            tr: { uk: "Можна мені тут сісти?", es: "¿Puedo sentarme aquí?" }
          - type: rule
            level: A2
            text:
              en: ["A question about possibility uses ", { pattern: [{ term: think }, { term: will }] }, ":"]
              uk: ["Питання про можливість ставлять за схемою ", { pattern: [{ term: think }, { term: will }] }, ":"]
              es: ["Una pregunta sobre posibilidad usa ", { pattern: [{ term: think }, { term: will }] }, ":"]
            ex: ["Do you think it ", { target: will }, " rain?"]
            tr: { uk: "Як гадаєш, піде дощ?", es: "¿Crees que lloverá?" }

