    en: [{ term: Might }, " and ", { term: may }, " for possibility; ", { term: may }, " for formal permission."]
    uk: [{ term: Might }, " і ", { term: may }, " виражають можливість, а ", { term: may }, " ще й офіційний дозвіл."]
    es: [{ term: Might }, " y ", { term: may }, " expresan posibilidad; ", { term: may }, ", además, permiso formal."]
  rule:
    en: [{ term: Might }, " and ", { term: may }, " take no -s, no ", { term: to }, " and no ", { term: do }, ", and the negative is ", { term: might not }, ":"]
    uk: [{ term: Might }, " і ", { term: may }, " не мають -s, не вживаються з ", { term: to }, " й ", { term: do }, ", а заперечення — ", { term: might not }, ":"]
    es: [{ term: Might }, " y ", { term: may }, " no llevan -s, ni ", { term: to }, ", ni ", { term: do }, ", y la negación es ", { term: might not }, ":"]
  ex: { examples: [["She ", { target: might }, " come."], ["He ", { target: might not }, " come."]] }

