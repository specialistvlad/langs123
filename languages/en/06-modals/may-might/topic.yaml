          - { level: B2, modal: { term: must }, pct: "90–99%", ex: ["The lights are on. She ", { target: must }, " be in."], tr: { uk: "Світло горить. Вона, певно, вдома.", es: "Las luces están encendidas. Debe de estar adentro.", pt: "As luzes estão acesas. Ela deve estar em casa.", fr: "Les lumières sont allumées. Elle doit être chez elle.", de: "Das Licht brennt. Sie muss zu Hause sein.", it: "Le luci sono accese. Deve essere in casa.", pl: "Światła się palą. Ona musi być w domu.", tr: "Işıklar yanıyor. İçeride olmalı.", id: "Lampunya menyala. Dia pasti ada di dalam.", vi: "Đèn đang sáng. Chắc chắn cô ấy có ở trong nhà." } }
