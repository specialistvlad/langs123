              pl: ["Używa się ", { term: "will" }, ", gdy ma się pewność, a ", { alternatives: [{ term: "may" }, { term: "might" }] }, ", gdy jej nie ma."]
              tr: ["Kesin olunduğunda ", { term: "will" }, ", emin olunmadığında ", { alternatives: [{ term: "may" }, { term: "might" }] }, " kullanılır."]
              id: [{ term: "will" }, " dipakai untuk hal yang pasti, dan ", { alternatives: [{ term: "may" }, { term: "might" }] }, " untuk hal yang belum pasti."]
              vi: ["Dùng ", { term: "will" }, " khi chắc chắn và ", { alternatives: [{ term: "may" }, { term: "might" }] }, " khi không chắc."]

