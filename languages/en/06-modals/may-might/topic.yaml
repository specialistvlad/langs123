  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: Possibility now, uk: "Можливість зараз", es: "Posibilidad ahora" }, ex: ["She ", { target: might }, " be at home."], tr: { uk: "Вона, можливо, вдома.", es: "Puede que esté en casa." } }
          - { level: A2, use: { en: Possibility in the future, uk: "Можливість у майбутньому", es: "Posibilidad en el futuro" }, ex: ["We ", { target: might }, " go to the beach."], tr: { uk: "Можливо, ми підемо на пляж.", es: "Quizá vayamos a la playa." } }
          - { level: A2, use: { en: Possibility that something is not true, uk: "Можливість того, що щось не відповідає дійсності", es: "Posibilidad de que algo no sea cierto" }, ex: ["He ", { target: might not }, " know."], tr: { uk: "Можливо, він не знає.", es: "Puede que no lo sepa." } }
          - { level: B1, use: { en: ["Formal permission (", { term: [May I, { gap: true }, "?"] }, ")"], uk: ["Офіційний дозвіл (", { term: [May I, { gap: true }, "?"] }, ")"], es: ["Permiso formal (", { term: [May I, { gap: true }, "?"] }, ")"] }, ex: [{ target: May }, " I use your phone?"], tr: { uk: "Можна мені скористатися твоїм телефоном?", es: "¿Puedo usar tu teléfono?" } }
