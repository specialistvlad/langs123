              id: ["Pendapat negatif memakai ", { term: "don't" }, " pada ", { term: "think" }, ":"]
              vi: ["Ý kiến phủ định đặt ", { term: "don't" }, " trước ", { term: "think" }, ":"]
            ex: ["I ", { target: don't think }, " you should go."]
            tr: { uk: "Не думаю, що тобі слід іти.", es: "No creo que debas ir.", pt: "Não acho que você deva ir.", fr: "Je ne pense pas que tu doives y aller.", de: "Ich denke nicht, dass du gehen solltest.", it: "Non penso che tu debba andare.", pl: "Nie sądzę, że powinieneś iść.", tr: "Gitmen gerektiğini sanmıyorum.", id: "Menurut saya, sebaiknya kamu tidak pergi.", vi: "Tôi không nghĩ bạn nên đi." }

