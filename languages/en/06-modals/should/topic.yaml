            text:
              en: ["The verb after ", { term: should }, " is in the base form:"]
              uk: ["Дієслово після ", { term: should }, " стоїть у початковій формі:"]
              es: ["El verbo después de ", { term: should }, " va en la forma base:"]
              pt: ["O verbo depois de ", { term: "should" }, " fica na forma base:"]
              fr: ["Le verbe après ", { term: "should" }, " est à la base verbale :"]
