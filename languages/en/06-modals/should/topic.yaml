              es: ["La opinión negativa lleva ", { term: don't }, " con ", { term: think }, ":"]
              pt: ["A opinião negativa leva ", { term: "don't" }, " com ", { term: "think" }, ":"]
              fr: ["L’opinion négative met ", { term: "don't" }, " devant ", { term: "think" }, " :"]
              de: ["Bei einer verneinten Meinung steht ", { term: "don't" }, " bei ", { term: "think" }, ":"]
