          - { level: C2, verb: point out, formal: note, ex: ["The report ", { target: points out }, " that costs have risen."], tr: { uk: "У звіті зазначено, що витрати зросли.", es: "El informe señala que los costos han subido.", pt: "O relatório aponta que os custos aumentaram.", fr: "Le rapport souligne que les coûts ont augmenté.", de: "Der Bericht weist darauf hin, dass die Kosten gestiegen sind.", it: "Il rapporto fa notare che i costi sono aumentati.", pl: "Raport zwraca uwagę, że koszty wzrosły.", tr: "Rapor, maliyetlerin arttığına dikkat çekiyor.", id: "Laporan itu menunjukkan bahwa biaya telah naik.", vi: "Báo cáo chỉ ra rằng chi phí đã tăng." } }
          - { level: C2, verb: rule out, formal: exclude, ex: ["The results ", { target: rule out }, " an infection."], tr: { uk: "Результати виключають інфекцію.", es: "Los resultados descartan una infección.", pt: "Os resultados descartam uma infecção.", fr: "Les résultats écartent l’hypothèse d’une infection.", de: "Die Ergebnisse schließen eine Infektion aus.", it: "I risultati escludono un'infezione.", pl: "Wyniki wykluczają zakażenie.", tr: "Sonuçlar bir enfeksiyonu dışlıyor.", id: "Hasilnya menyingkirkan kemungkinan infeksi.", vi: "Kết quả loại trừ khả năng nhiễm trùng." } }
          - { level: C2, verb: set out, formal: state, ex: ["The paper ", { target: sets out }, " three aims."], tr: { uk: "У статті викладено три цілі.", es: "El artículo expone tres objetivos.", pt: "O artigo expõe três objetivos.", fr: "L’article expose trois objectifs.", de: "Der Aufsatz legt drei Ziele dar.", it: "L'articolo espone tre obiettivi.", pl: "Artykuł przedstawia trzy cele.", tr: "Makale üç amacı ortaya koyuyor.", id: "Makalah itu memaparkan tiga tujuan.", vi: "Bài viết nêu ra ba mục tiêu." } }
          - { level: C2, verb: bring about, formal: cause, ex: ["The reforms ", { target: brought about }, " a change in attitudes."], tr: { uk: "Реформи призвели до зміни ставлення.", es: "Las reformas provocaron un cambio de actitudes.", pt: "As reformas provocaram uma mudança de atitudes.", fr: "Les réformes ont entraîné un changement des mentalités.", de: "Die Reformen führten zu einem Wandel der Einstellungen.", it: "Le riforme hanno provocato un cambiamento di atteggiamenti.", pl: "Reformy doprowadziły do zmiany postaw.", tr: "Reformlar tutumlarda bir değişime yol açtı.", id: "Reformasi itu membawa perubahan sikap.", vi: "Các cải cách đã tạo ra sự thay đổi trong thái độ." } }
          - { level: C2, verb: account for, formal: explain, ex: ["Several factors ", { target: account for }, " the difference."], tr: { uk: "Різницю пояснюють кілька чинників.", es: "Varios factores explican la diferencia.", pt: "Vários fatores explicam a diferença.", fr: "Plusieurs facteurs expliquent la différence.", de: "Mehrere Faktoren erklären den Unterschied.", it: "Diversi fattori spiegano la differenza.", pl: "Różnicę wyjaśnia kilka czynników.", tr: "Farkı birkaç etken açıklıyor.", id: "Beberapa faktor menjelaskan perbedaan itu.", vi: "Một số yếu tố giải thích sự khác biệt." } }
          - { level: C2, verb: give rise to, formal: produce, ex: ["The discovery ", { target: gave rise to }, " a new field of study."], tr: { uk: "Це відкриття дало початок новій галузі досліджень.", es: "El descubrimiento dio origen a un nuevo campo de estudio.", pt: "A descoberta deu origem a um novo campo de estudo.", fr: "La découverte a donné naissance à un nouveau domaine d’étude.", de: "Die Entdeckung brachte ein neues Forschungsfeld hervor.", it: "La scoperta ha dato origine a un nuovo campo di studio.", pl: "Odkrycie dało początek nowej dziedzinie badań.", tr: "Keşif, yeni bir araştırma alanının doğmasına yol açtı.", id: "Penemuan itu melahirkan bidang studi baru.", vi: "Phát hiện này đã khai sinh một lĩnh vực nghiên cứu mới." } }
