            text: { en: "Reports often use them in the passive, with the agent left out.", uk: "У звітах їх часто вживають у пасивному стані, не називаючи виконавця.", es: "Los informes suelen usarlos en la voz pasiva, sin mencionar al agente.", pt: "Os relatórios costumam usá-los na voz passiva, sem citar o agente.", fr: "Les rapports les emploient souvent au passif, sans nommer l’agent.", de: "Berichte verwenden sie oft im Passiv, ohne den Handelnden zu nennen.", it: "I rapporti li usano spesso alla forma passiva, senza nominare l'agente.", pl: "Raporty często używają ich w stronie biernej, bez podawania wykonawcy.", tr: "Raporlar bunları sık sık edilgen çatıda, yapanı belirtmeden kullanır.", id: "Laporan sering memakainya dalam bentuk pasif, tanpa menyebut pelakunya.", vi: "Báo cáo thường dùng chúng ở dạng bị động, không nêu người thực hiện." }
            ex: ["The survey ", { target: was carried out }, " in May."]
