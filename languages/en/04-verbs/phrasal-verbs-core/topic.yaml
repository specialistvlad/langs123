          - { level: B2, verb: tell sb off, meaning: { en: scold, uk: "насварити", es: "regañar", pt: "repreender", fr: "gronder", de: "ausschimpfen", it: "rimproverare", pl: "skarcić", tr: "azarlamak", id: "memarahi", vi: "la mắng" }, ex: ["The teacher ", { target: told him off }, " for being late."], tr: { uk: "Вчитель насварив його за запізнення.", es: "El profesor lo regañó por llegar tarde.", pt: "O professor o repreendeu por chegar atrasado.", fr: "Le professeur l’a grondé parce qu’il était en retard.", de: "Der Lehrer hat ihn ausgeschimpft, weil er zu spät kam.", it: "L'insegnante lo ha rimproverato perché era in ritardo.", pl: "Nauczyciel skarcił go za spóźnienie.", tr: "Öğretmen geç kaldığı için onu azarladı.", id: "Guru memarahinya karena terlambat.", vi: "Giáo viên la mắng cậu ấy vì đến muộn." } }
          - { level: B2, verb: let sb down, meaning: { en: disappoint, uk: "підвести", es: "decepcionar", pt: "decepcionar", fr: "décevoir", de: "enttäuschen", it: "deludere", pl: "zawieść", tr: "hayal kırıklığına uğratmak", id: "mengecewakan", vi: "làm thất vọng" }, ex: ["Please don't ", { target: let me down }, "."], tr: { uk: "Будь ласка, не підведи мене.", es: "Por favor, no me decepciones.", pt: "Por favor, não me decepcione.", fr: "Ne me déçois pas, s’il te plaît.", de: "Bitte enttäusch mich nicht.", it: "Per favore, non deludermi.", pl: "Proszę, nie zawiedź mnie.", tr: "Lütfen beni hayal kırıklığına uğratma.", id: "Tolong jangan kecewakan saya.", vi: "Làm ơn đừng làm tôi thất vọng." } }
          - { level: B2, verb: put sb off, meaning: { en: make someone lose interest, uk: "відбити в когось охоту", es: "quitarle las ganas a alguien", pt: "tirar a vontade de alguém", fr: "décourager quelqu’un", de: "jemandem die Lust nehmen", it: "far passare la voglia a qualcuno", pl: "zniechęcić kogoś", tr: "birinin ilgisini kaybettirmek", id: "membuat orang kehilangan minat", vi: "làm ai đó mất hứng thú" }, ex: ["The long queue ", { target: put me off }, "."], tr: { uk: "Довга черга відбила в мене охоту.", es: "La cola larga me quitó las ganas.", pt: "A fila longa tirou minha vontade.", fr: "La longue file d’attente m’a découragé.", de: "Die lange Schlange hat mir die Lust genommen.", it: "La lunga coda mi ha fatto passare la voglia.", pl: "Długa kolejka mnie zniechęciła.", tr: "Uzun kuyruk beni isteksiz bıraktı.", id: "Antrean panjang itu membuat saya malas.", vi: "Hàng dài người xếp hàng làm tôi mất hứng." } }
          - { level: B2, verb: see sb off, meaning: { en: say goodbye at a station or an airport, uk: "попрощатися з кимось на вокзалі чи в аеропорту", es: "despedir a alguien en una estación o un aeropuerto", pt: "despedir-se de alguém na estação ou no aeroporto", fr: "dire au revoir à quelqu’un à la gare ou à l’aéroport", de: "jemanden am Bahnhof oder Flughafen verabschieden", it: "salutare qualcuno alla stazione o all'aeroporto", pl: "pożegnać kogoś na dworcu lub na lotnisku", tr: "birini istasyonda ya da havalimanında uğurlamak", id: "mengantar kepergian seseorang di stasiun atau bandara", vi: "tiễn ai đó ở nhà ga hoặc sân bay" }, ex: ["We ", { target: saw her off }, " at the airport."], tr: { uk: "Ми провели її в аеропорту.", es: "La despedimos en el aeropuerto.", pt: "Nós nos despedimos dela no aeroporto.", fr: "Nous lui avons dit au revoir à l’aéroport.", de: "Wir haben sie am Flughafen verabschiedet.", it: "L'abbiamo salutata all'aeroporto.", pl: "Pożegnaliśmy ją na lotnisku.", tr: "Onu havalimanında uğurladık.", id: "Kami mengantarnya di bandara.", vi: "Chúng tôi tiễn cô ấy ở sân bay." } }
          - { level: B2, verb: bring sb up, meaning: { en: raise a child, uk: "виховувати дитину", es: "criar a un niño", pt: "criar uma criança", fr: "élever un enfant", de: "ein Kind aufziehen", it: "crescere un bambino", pl: "wychowywać dziecko", tr: "çocuk yetiştirmek", id: "membesarkan anak", vi: "nuôi dạy một đứa trẻ" }, ex: ["My grandmother ", { target: brought me up }, "."], tr: { uk: "Мене виховувала бабуся.", es: "Me crió mi abuela.", pt: "Minha avó me criou.", fr: "C’est ma grand-mère qui m’a élevé.", de: "Meine Großmutter hat mich großgezogen.", it: "Mi ha cresciuto mia nonna.", pl: "Wychowała mnie babcia.", tr: "Beni büyükannem yetiştirdi.", id: "Nenek saya yang membesarkan saya.", vi: "Bà tôi nuôi dạy tôi." } }
          - { level: B2, verb: { pattern: [talk sb into, { slot: "-ing" }] }, meaning: { en: persuade someone to do something, uk: "переконати когось щось зробити", es: "convencer a alguien de que haga algo", pt: "convencer alguém a fazer algo", fr: "persuader quelqu’un de faire quelque chose", de: "jemanden überreden, etwas zu tun", it: "convincere qualcuno a fare qualcosa", pl: "przekonać kogoś, żeby coś zrobił", tr: "birini bir şeyi yapmaya ikna etmek", id: "membujuk seseorang untuk melakukan sesuatu", vi: "thuyết phục ai làm gì" }, ex: ["My sister ", { target: talked me into }, " joining the gym."], tr: { uk: "Сестра переконала мене записатися до спортзалу.", es: "Mi hermana me convenció de inscribirme en el gimnasio.", pt: "Minha irmã me convenceu a entrar na academia.", fr: "Ma sœur m’a convaincu de m’inscrire à la salle de sport.", de: "Meine Schwester hat mich überredet, mich im Fitnessstudio anzumelden.", it: "Mia sorella mi ha convinto a iscrivermi in palestra.", pl: "Siostra namówiła mnie na zapisanie się na siłownię.", tr: "Kız kardeşim beni spor salonuna yazılmaya ikna etti.", id: "Kakak perempuan saya membujuk saya mendaftar ke gym.", vi: "Chị gái tôi thuyết phục tôi đăng ký phòng tập." } }
          - { level: B2, verb: { pattern: [talk sb out of, { slot: "-ing" }] }, meaning: { en: persuade someone not to do something, uk: "переконати когось не робити щось", es: "convencer a alguien de que no haga algo", pt: "convencer alguém a não fazer algo", fr: "dissuader quelqu’un de faire quelque chose", de: "jemanden davon abbringen, etwas zu tun", it: "dissuadere qualcuno dal fare qualcosa", pl: "odwieść kogoś od zrobienia czegoś", tr: "birini bir şeyi yapmaktan vazgeçirmek", id: "membujuk seseorang agar tidak melakukan sesuatu", vi: "thuyết phục ai đừng làm gì" }, ex: ["He ", { target: talked me out of }, " selling my car."], tr: { uk: "Він відмовив мене від продажу машини.", es: "Me convenció de no vender mi auto.", pt: "Ele me convenceu a não vender meu carro.", fr: "Il m’a dissuadé de vendre ma voiture.", de: "Er hat mich davon abgebracht, mein Auto zu verkaufen.", it: "Mi ha dissuaso dal vendere la mia auto.", pl: "Odwiódł mnie od sprzedaży samochodu.", tr: "Beni arabamı satmaktan vazgeçirdi.", id: "Dia membujuk saya agar tidak menjual mobil saya.", vi: "Anh ấy thuyết phục tôi đừng bán xe." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The person object normally stands between the verb and the particle.", uk: "Додаток-особа зазвичай стоїть між дієсловом і часткою.", es: "El objeto de persona suele ir entre el verbo y la partícula.", pt: "O objeto de pessoa costuma ficar entre o verbo e a partícula.", fr: "Le complément désignant une personne se place normalement entre le verbe et la particule.", de: "Das Personenobjekt steht normalerweise zwischen Verb und Partikel.", it: "Il complemento oggetto di persona sta di norma tra il verbo e la particella.", pl: "Dopełnienie oznaczające osobę zwykle stoi między czasownikiem a partykułą.", tr: "Kişiyi gösteren nesne normalde fiil ile parçacığın arasında yer alır.", id: "Objek orang biasanya berada di antara kata kerja dan partikel.", vi: "Tân ngữ chỉ người thường đứng giữa động từ và tiểu từ." }
            ex: { examples: [["She ", { target: told the boy off }, "."], ["She ", { target: told him off }, "."]] }
            tr: { uk: { examples: ["Вона насварила хлопчика.", "Вона насварила його."] }, es: { examples: ["Regañó al niño.", "Lo regañó."] }, pt: { examples: ["Ela repreendeu o menino.", "Ela o repreendeu."] }, fr: { examples: ["Elle a grondé le garçon.", "Elle l’a grondé."] }, de: { examples: ["Sie schimpfte den Jungen aus.", "Sie schimpfte ihn aus."] }, it: { examples: ["Ha rimproverato il ragazzo.", "L'ha rimproverato."] }, pl: { examples: ["Skarciła chłopca.", "Skarciła go."] }, tr: { examples: ["Çocuğu azarladı.", "Onu azarladı."] }, id: { examples: ["Dia memarahi anak laki-laki itu.", "Dia memarahinya."] }, vi: { examples: ["Cô ấy la mắng cậu bé.", "Cô ấy la mắng cậu ấy."] } }
          - type: rule
            level: B2
            text: { en: ["After ", { term: into }, " and ", { term: out of }, " the verb takes the ", { term: "-ing" }, " form."], uk: ["Після ", { term: "into" }, " і ", { term: "out of" }, " дієслово має форму на ", { term: "-ing" }, "."], es: ["Después de ", { term: "into" }, " y ", { term: "out of" }, " el verbo lleva la forma en ", { term: "-ing" }, "."], pt: ["Depois de ", { term: "into" }, " e ", { term: "out of" }, " o verbo leva a forma ", { term: "-ing" }, "."], fr: ["Après ", { term: "into" }, " et ", { term: "out of" }, ", le verbe prend la forme en ", { term: "-ing" }, "."], de: ["Nach ", { term: "into" }, " und ", { term: "out of" }, " steht das Verb in der ", { term: "-ing" }, "-Form."], it: ["Dopo ", { term: "into" }, " e ", { term: "out of" }, " il verbo prende la forma in ", { term: "-ing" }, "."], pl: ["Po ", { term: "into" }, " i ", { term: "out of" }, " czasownik ma formę ", { term: "-ing" }, "."], tr: [{ term: "into" }, " ve ", { term: "out of" }, " sonrasında fiil ", { term: "-ing" }, " biçimini alır."], id: ["Setelah ", { term: "into" }, " dan ", { term: "out of" }, " kata kerja memakai bentuk ", { term: "-ing" }, "."], vi: ["Sau ", { term: "into" }, " và ", { term: "out of" }, " động từ có dạng ", { term: "-ing" }, "."] }
            ex: ["She ", { target: talked him into }, " buying a car."]
            tr: { uk: "Вона переконала його купити машину.", es: "Lo convenció de comprar un auto.", pt: "Ela o convenceu a comprar um carro.", fr: "Elle l’a convaincu d’acheter une voiture.", de: "Sie hat ihn überredet, ein Auto zu kaufen.", it: "Lo ha convinto a comprare un'auto.", pl: "Namówiła go na kupno samochodu.", tr: "Onu araba almaya ikna etti.", id: "Dia membujuknya membeli mobil.", vi: "Cô ấy thuyết phục anh ấy mua xe." }

  - title: { en: Passive phrasal verbs, uk: "Пасивні фразові дієслова", es: "Phrasal verbs en la voz pasiva", pt: "Phrasal verbs na voz passiva", fr: "Phrasal verbs au passif", de: "Phrasal Verbs im Passiv", it: "Phrasal verb alla forma passiva", pl: "Czasowniki frazowe w stronie biernej", tr: "Edilgen çatıda phrasal verb’ler", id: "Phrasal verb dalam bentuk pasif", vi: "Cụm động từ bị động" }
    role: own
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Passive form, uk: "Пасивна форма", es: "Forma pasiva", pt: "Forma passiva", fr: "Forme passive", de: "Passivform", it: "Forma passiva", pl: "Forma bierna", tr: "Edilgen biçim", id: "Bentuk pasif", vi: "Dạng bị động" } }
          - { key: meaning, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, verb: be looked after, meaning: { en: be cared for, uk: "перебувати під опікою", es: "ser cuidado", pt: "ser cuidado", fr: "être pris en charge", de: "betreut werden", it: "essere accudito", pl: "być pod opieką", tr: "bakılmak", id: "dirawat", vi: "được chăm sóc" }, ex: ["The children ", { target: are looked after }, " by their grandparents."], tr: { uk: "За дітьми доглядають їхні бабусі й дідусі.", es: "Los niños están al cuidado de sus abuelos.", pt: "As crianças ficam aos cuidados dos avós.", fr: "Les enfants sont gardés par leurs grands-parents.", de: "Die Kinder werden von ihren Großeltern betreut.", it: "I bambini sono accuditi dai nonni.", pl: "Dzieci są pod opieką dziadków.", tr: "Çocuklara büyükanne ve büyükbabaları bakıyor.", id: "Anak-anak dirawat oleh kakek-nenek mereka.", vi: "Bọn trẻ được ông bà chăm sóc." } }
          - { level: B2, verb: be brought up, meaning: { en: be raised, uk: "бути вихованим", es: "ser criado", pt: "ser criado", fr: "être élevé", de: "großgezogen werden", it: "essere cresciuto", pl: "być wychowywanym", tr: "yetiştirilmek", id: "dibesarkan", vi: "được nuôi dạy" }, ex: ["He ", { target: was brought up }, " by his aunt."], tr: { uk: "Його виховувала тітка.", es: "Lo crió su tía.", pt: "Ele foi criado pela tia.", fr: "Il a été élevé par sa tante.", de: "Er wurde von seiner Tante großgezogen.", it: "È stato cresciuto da sua zia.", pl: "Wychowywała go ciotka.", tr: "Onu teyzesi yetiştirdi.", id: "Dia dibesarkan oleh bibinya.", vi: "Anh ấy được dì nuôi dạy." } }
          - { level: B2, verb: be put off, meaning: { en: be discouraged, uk: "втратити охоту", es: "desanimarse", pt: "ser desencorajado", fr: "être découragé", de: "abgeschreckt werden", it: "essere scoraggiato", pl: "być zniechęconym", tr: "cesareti kırılmak", id: "dibuat enggan", vi: "bị nản lòng" }, ex: ["We ", { target: were put off }, " by the price."], tr: { uk: "Ціна відбила в нас охоту.", es: "El precio nos quitó las ganas.", pt: "O preço nos desanimou.", fr: "Le prix nous a découragés.", de: "Der Preis hat uns abgeschreckt.", it: "Il prezzo ci ha scoraggiati.", pl: "Cena nas zniechęciła.", tr: "Fiyat bizi soğuttu.", id: "Harganya membuat kami enggan.", vi: "Giá cả làm chúng tôi nản." } }
          - { level: B2, verb: be turned down, meaning: { en: be refused, uk: "отримати відмову", es: "ser rechazado", pt: "ser recusado", fr: "être refusé", de: "abgelehnt werden", it: "essere rifiutato", pl: "zostać odrzuconym", tr: "reddedilmek", id: "ditolak", vi: "bị từ chối" }, ex: ["Her application ", { target: was turned down }, "."], tr: { uk: "Її заявку відхилили.", es: "Rechazaron su solicitud.", pt: "A candidatura dela foi recusada.", fr: "Sa candidature a été refusée.", de: "Ihre Bewerbung wurde abgelehnt.", it: "La sua candidatura è stata respinta.", pl: "Jej podanie zostało odrzucone.", tr: "Başvurusu reddedildi.", id: "Lamarannya ditolak.", vi: "Đơn xin của cô ấy bị từ chối." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The particle stays after the participle, at the end of the clause.", uk: "Частка залишається після Past Participle, наприкінці речення.", es: "La partícula queda después del participio, al final de la oración.", pt: "A partícula fica depois do particípio, no fim da oração.", fr: "La particule reste après le participe, à la fin de la proposition.", de: "Die Partikel bleibt nach dem Past Participle, am Ende des Satzes.", it: "La particella resta dopo il participio, in fondo alla frase.", pl: "Partykuła zostaje po Past Participle, na końcu zdania.", tr: "Past Participle sonrasında parçacık cümlenin sonunda kalır.", id: "Partikel tetap berada setelah Past Participle, di akhir klausa.", vi: "Tiểu từ vẫn đứng sau quá khứ phân từ, ở cuối mệnh đề." }
            ex: ["The offer ", { target: was turned down }, "."]
            tr: { uk: "Пропозицію відхилили.", es: "Rechazaron la oferta.", pt: "A oferta foi recusada.", fr: "L’offre a été refusée.", de: "Das Angebot wurde abgelehnt.", it: "L'offerta è stata rifiutata.", pl: "Ofertę odrzucono.", tr: "Teklif reddedildi.", id: "Tawaran itu ditolak.", vi: "Lời đề nghị đã bị từ chối." }

  - title: { en: "Form: long objects and stranded particles", uk: "Форма: довгі додатки й частка в кінці", es: "Forma: objetos largos y partículas al final", pt: "Forma: objetos longos e partículas no fim", fr: "Forme : compléments longs et particule en fin de phrase", de: "Form: lange Objekte und nachgestellte Partikel", it: "Forma: complementi lunghi e particella in fondo", pl: "Forma: długie dopełnienia i partykuła na końcu", tr: "Biçim: uzun nesneler ve sonda kalan parçacık", id: "Bentuk: objek panjang dan partikel di akhir", vi: "Dạng: tân ngữ dài và tiểu từ đứng cuối" }
    role: form
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Position, uk: "Позиція", es: "Posición", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" } }
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, point: { en: Long object, uk: "Довгий додаток", es: "Objeto largo", pt: "Objeto longo", fr: "Complément long", de: "Langes Objekt", it: "Complemento oggetto lungo", pl: "Długie dopełnienie", tr: "Uzun nesne", id: "Objek panjang", vi: "Tân ngữ dài" }, rule: { en: a long object follows the particle, uk: "довгий додаток стоїть після частки", es: "el objeto largo va después de la partícula", pt: "o objeto longo vai depois da partícula", fr: "le complément long suit la particule", de: "ein langes Objekt steht nach der Partikel", it: "il complemento oggetto lungo va dopo la particella", pl: "długie dopełnienie stoi po partykule", tr: "uzun nesne parçacıktan sonra gelir", id: "objek panjang berada setelah partikel", vi: "tân ngữ dài đứng sau tiểu từ" }, ex: ["She ", { target: picked up }, " the book she had ordered last week."], tr: { uk: "Вона забрала книжку, яку замовила минулого тижня.", es: "Recogió el libro que había pedido la semana pasada.", pt: "Ela pegou o livro que tinha encomendado na semana passada.", fr: "Elle est allée chercher le livre qu’elle avait commandé la semaine dernière.", de: "Sie holte das Buch ab, das sie letzte Woche bestellt hatte.", it: "Ha ritirato il libro che aveva ordinato la settimana scorsa.", pl: "Odebrała książkę, którą zamówiła w zeszłym tygodniu.", tr: "Geçen hafta sipariş ettiği kitabı aldı.", id: "Dia mengambil buku yang ia pesan minggu lalu.", vi: "Cô ấy lấy cuốn sách mà cô ấy đã đặt tuần trước." } }
          - { level: C1, point: { en: Relative clause, uk: "Означальне підрядне речення", es: "Oración de relativo", pt: "Oração relativa", fr: "Proposition relative", de: "Relativsatz", it: "Proposizione relativa", pl: "Zdanie względne", tr: "İlgi cümlesi", id: "Klausa relatif", vi: "Mệnh đề quan hệ" }, rule: { en: the particle stays at the end of the clause, uk: "частка залишається наприкінці речення", es: "la partícula queda al final de la oración", pt: "a partícula fica no fim da oração", fr: "la particule reste à la fin de la proposition", de: "die Partikel bleibt am Ende des Satzes", it: "la particella resta in fondo alla frase", pl: "partykuła zostaje na końcu zdania", tr: "parçacık cümlenin sonunda kalır", id: "partikel tetap di akhir klausa", vi: "tiểu từ vẫn đứng ở cuối mệnh đề" }, ex: ["That is the plan we ", { target: came up with }, "."], tr: { uk: "Це план, який ми придумали.", es: "Ese es el plan que se nos ocurrió.", pt: "Esse é o plano que nós bolamos.", fr: "Voilà le plan que nous avons trouvé.", de: "Das ist der Plan, auf den wir gekommen sind.", it: "Questo è il piano che abbiamo ideato.", pl: "To jest plan, który wymyśliliśmy.", tr: "İşte bulduğumuz plan bu.", id: "Itulah rencana yang kami buat.", vi: "Đó là kế hoạch mà chúng tôi nghĩ ra." } }
