              vi: ["Cụm động từ (phrasal verb) là ", { pattern: [{ slot: "verb" }, "tiểu từ"] }, ": ", { pattern: [{ term: "get" }, { term: "up" }] }, ", ", { pattern: [{ term: "turn" }, { term: "off" }] }, ", ", { pattern: [{ term: "look" }, { term: "for" }] }, "."]
