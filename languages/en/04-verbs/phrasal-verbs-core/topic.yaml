            text:
              en: ["With a separable verb, a pronoun goes between the verb and the particle: ", { term: pick it up }, "."]
              uk: ["У роздільного дієслова займенник стоїть між дієсловом і часткою: ", { term: pick it up }, "."]
              es: ["Con un verbo separable, el pronombre va entre el verbo y la partícula: ", { term: pick it up }, "."]
              pt: ["Com um verbo separável, o pronome vai entre o verbo e a partícula: ", { term: "pick it up" }, "."]
              fr: ["Avec un verbe séparable, le pronom se place entre le verbe et la particule : ", { term: "pick it up" }, "."]
              de: ["Bei einem trennbaren Verb steht das Pronomen zwischen Verb und Partikel: ", { term: "pick it up" }, "."]
              it: ["Con un verbo separabile il pronome va tra il verbo e la particella: ", { term: "pick it up" }, "."]
              pl: ["W czasowniku rozdzielnym zaimek stoi między czasownikiem a partykułą: ", { term: "pick it up" }, "."]
              tr: ["Ayrılabilir fiilde zamir, fiil ile parçacığın arasında yer alır: ", { term: "pick it up" }, "."]
              id: ["Pada kata kerja yang dapat dipisah, kata ganti berada di antara kata kerja dan partikel: ", { term: "pick it up" }, "."]
              vi: ["Với cụm động từ tách được, đại từ đứng giữa động từ và tiểu từ: ", { term: "pick it up" }, "."]
          - type: rule
            level: A2
            text:
              en: ["A noun goes before or after the particle: ", { term: ["pick up ", { alternatives: [the bag, pick] }, " the bag up"] }, "."]
              uk: ["Іменник стоїть перед часткою або після неї: ", { term: ["pick up ", { alternatives: [the bag, pick] }, " the bag up"] }, "."]
              es: ["El sustantivo va antes o después de la partícula: ", { term: ["pick up ", { alternatives: [the bag, pick] }, " the bag up"] }, "."]
              pt: ["O substantivo vai antes ou depois da partícula: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              fr: ["Le nom se place avant ou après la particule : ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              de: ["Ein Nomen steht vor oder nach der Partikel: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              it: ["Il sostantivo va prima o dopo la particella: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              pl: ["Rzeczownik stoi przed partykułą lub po niej: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              tr: ["İsim, parçacıktan önce ya da sonra gelir: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              id: ["Kata benda dapat berada sebelum atau sesudah partikel: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
              vi: ["Danh từ đứng trước hoặc sau tiểu từ: ", { term: ["pick up ", { alternatives: ["the bag", "pick"] }, " the bag up"] }, "."]
          - type: rule
            level: A2
            text:
              en: ["With an inseparable verb, the object always follows the particle: ", { term: look after them }, "."]
              uk: ["У нероздільного дієслова додаток завжди стоїть після частки: ", { term: look after them }, "."]
              es: ["Con un verbo inseparable, el objeto siempre va después de la partícula: ", { term: look after them }, "."]
              pt: ["Com um verbo inseparável, o objeto sempre vai depois da partícula: ", { term: "look after them" }, "."]
              fr: ["Avec un verbe inséparable, le complément suit toujours la particule : ", { term: "look after them" }, "."]
              de: ["Bei einem untrennbaren Verb steht das Objekt immer nach der Partikel: ", { term: "look after them" }, "."]
              it: ["Con un verbo inseparabile il complemento oggetto va sempre dopo la particella: ", { term: "look after them" }, "."]
              pl: ["W czasowniku nierozdzielnym dopełnienie zawsze stoi po partykule: ", { term: "look after them" }, "."]
              tr: ["Ayrılamaz fiilde nesne her zaman parçacıktan sonra gelir: ", { term: "look after them" }, "."]
              id: ["Pada kata kerja yang tidak dapat dipisah, objek selalu berada setelah partikel: ", { term: "look after them" }, "."]
              vi: ["Với cụm động từ không tách được, tân ngữ luôn đứng sau tiểu từ: ", { term: "look after them" }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: find out }, " usually takes its object after the particle: ", { term: find out the price }, "."]
              uk: [{ term: find out }, " зазвичай має додаток після частки: ", { term: find out the price }, "."]
