              de: ["Die Partikel (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") gibt dem Verb eine neue Bedeutung."]
              it: ["La particella (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") dà al verbo un nuovo significato."]
              pl: ["Partykuła (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") nadaje czasownikowi nowe znaczenie."]
              tr: ["Parçacık (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") fiile yeni bir anlam kazandırır."]
              id: ["Partikel (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") memberi arti baru pada kata kerja."]
              vi: ["Tiểu từ (", { term: "up" }, ", ", { term: "off" }, ", ", { term: "on" }, ", ", { term: "out" }, ", ", { term: "back" }, ", ", { term: "down" }, ", ", { term: "in" }, ", ", { term: "for" }, ", ", { term: "after" }, ") cho động từ một nghĩa mới."]
          - type: rule
            level: A2
            text:
              en: Phrasal verbs are very common in everyday speech.
              uk: "Фразові дієслова дуже поширені в повсякденному мовленні."
              es: "Los phrasal verbs son muy comunes en el habla cotidiana."
              pt: "Os phrasal verbs são muito comuns na fala do dia a dia."
