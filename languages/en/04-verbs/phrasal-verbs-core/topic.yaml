          - type: rule
            level: C1
            text: { en: "The verb is two words; the noun is one word or has a hyphen.", uk: "Дієслово — це два слова; іменник — одне слово або слово з дефісом.", es: "El verbo son dos palabras; el sustantivo es una palabra o lleva guion.", pt: "O verbo são duas palavras; o substantivo é uma palavra só ou leva hífen.", fr: "Le verbe s’écrit en deux mots ; le nom s’écrit en un mot ou avec un trait d’union.", de: "Das Verb besteht aus zwei Wörtern; das Nomen ist ein Wort oder hat einen Bindestrich.", it: "Il verbo è formato da due parole; il sostantivo è una parola sola o ha il trattino.", pl: "Czasownik to dwa wyrazy; rzeczownik to jeden wyraz lub wyraz z łącznikiem.", tr: "Fiil iki sözcüktür; isim tek sözcüktür ya da kısa çizgi taşır.", id: "Kata kerja terdiri atas dua kata; kata benda satu kata atau memakai tanda hubung.", vi: "Động từ gồm hai từ; danh từ là một từ hoặc có dấu gạch nối." }
            ex: { examples: [{ contrast: [["to ", { target: break down }], ["a ", { target: breakdown }]] }, { contrast: [["to ", { target: check in }], ["a ", { target: check-in }]] }] }
            tr: { uk: { examples: [{ contrast: ["зламатися", "поломка"] }, { contrast: ["зареєструватися", "реєстрація"] }] }, es: { examples: [{ contrast: ["averiarse", "una avería"] }, { contrast: ["registrarse", "el registro de entrada"] }] }, pt: { examples: [{ contrast: ["quebrar", "uma pane"] }, { contrast: ["fazer check-in", "um check-in"] }] }, fr: { examples: [{ contrast: ["tomber en panne", "une panne"] }, { contrast: ["s’enregistrer", "un enregistrement"] }] }, de: { examples: [{ contrast: ["ausfallen", "eine Panne"] }, { contrast: ["einchecken", "ein Check-in"] }] }, it: { examples: [{ contrast: ["guastarsi", "un guasto"] }, { contrast: ["fare il check-in", "un check-in"] }] }, pl: { examples: [{ contrast: ["zepsuć się", "awaria"] }, { contrast: ["odprawić się", "odprawa"] }] }, tr: { examples: [{ contrast: ["bozulmak", "bir arıza"] }, { contrast: ["check-in yapmak", "bir check-in"] }] }, id: { examples: [{ contrast: ["mogok", "kerusakan"] }, { contrast: ["melakukan check-in", "sebuah check-in"] }] }, vi: { examples: [{ contrast: ["hỏng", "sự cố hỏng hóc"] }, { contrast: ["nhận phòng", "thủ tục nhận phòng"] }] } }
          - type: rule
            level: C1
            text: { en: "An adjective has a hyphen before a noun and two words after be.", uk: "Прикметник перед іменником пишеться з дефісом, а після be — як два слова.", es: "Antes de un sustantivo, el adjetivo lleva guion; después de be, son dos palabras.", pt: "Antes de um substantivo, o adjetivo leva hífen; depois de be, são duas palavras.", fr: "Devant un nom, l’adjectif prend un trait d’union ; après be, il s’écrit en deux mots.", de: "Vor einem Nomen hat das Adjektiv einen Bindestrich; nach be steht es in zwei Wörtern.", it: "Davanti a un sostantivo l'aggettivo ha il trattino; dopo be sono due parole.", pl: "Przed rzeczownikiem przymiotnik ma łącznik; po be to dwa wyrazy.", tr: "Sıfat, isimden önce kısa çizgiyle yazılır; be fiilinden sonra iki sözcük olur.", id: "Kata sifat memakai tanda hubung sebelum kata benda dan ditulis dua kata setelah be.", vi: "Tính từ có dấu gạch nối trước danh từ và gồm hai từ sau be." }
            ex: { contrast: [["a ", { target: worn-out }, " coat"], ["The coat is ", { target: worn out }, "."]] }
            tr: { uk: { contrast: ["зношене пальто", "Пальто зношене."] }, es: { contrast: ["un abrigo gastado", "El abrigo está gastado."] }, pt: { contrast: ["um casaco gasto", "O casaco está gasto."] }, fr: { contrast: ["un manteau usé", "Le manteau est usé."] }, de: { contrast: ["ein abgetragener Mantel", "Der Mantel ist abgetragen."] }, it: { contrast: ["un cappotto consumato", "Il cappotto è consumato."] }, pl: { contrast: ["zniszczony płaszcz", "Płaszcz jest zniszczony."] }, tr: { contrast: ["eskimiş bir palto", "Palto eskimiş."] }, id: { contrast: ["mantel usang", "Mantel itu sudah usang."] }, vi: { contrast: ["một chiếc áo khoác đã sờn", "Chiếc áo khoác này đã sờn."] } }
          - type: rule
            level: C1
            text: { en: "A plural adds s at the end.", uk: "У множині s додається в кінці.", es: "El plural añade s al final.", pt: "O plural acrescenta s no final.", fr: "Le pluriel ajoute s à la fin.", de: "Der Plural hängt ein s am Ende an.", it: "Il plurale aggiunge una s alla fine.", pl: "Liczba mnoga dodaje s na końcu.", tr: "Çoğul, sonuna s ekler.", id: "Bentuk jamak menambahkan s di akhir.", vi: "Số nhiều thêm s ở cuối." }
            ex: { examples: [{ mapping: [set-up, { target: set-ups }] }, { mapping: [drop-out, { target: drop-outs }] }] }
            tr: { uk: { examples: [{ mapping: ["конфігурація", "конфігурації"] }, { mapping: ["той, хто кинув навчання", "ті, хто кинув навчання"] }] }, es: { examples: [{ mapping: ["configuración", "configuraciones"] }, { mapping: ["desertor", "desertores"] }] }, pt: { examples: [{ mapping: ["configuração", "configurações"] }, { mapping: ["desistente", "desistentes"] }] }, fr: { examples: [{ mapping: ["installation", "installations"] }, { mapping: ["décrocheur", "décrocheurs"] }] }, de: { examples: [{ mapping: ["Einrichtung", "Einrichtungen"] }, { mapping: ["Aussteiger", "Aussteiger"] }] }, it: { examples: [{ mapping: ["allestimento", "allestimenti"] }, { mapping: ["studente che ha abbandonato", "studenti che hanno abbandonato"] }] }, pl: { examples: [{ mapping: ["konfiguracja", "konfiguracje"] }, { mapping: ["osoba, która rzuciła studia", "osoby, które rzuciły studia"] }] }, tr: { examples: [{ mapping: ["düzen", "düzenler"] }, { mapping: ["okulu bırakan kişi", "okulu bırakan kişiler"] }] }, id: { examples: [{ mapping: ["pengaturan", "pengaturan-pengaturan"] }, { mapping: ["orang yang putus sekolah", "orang-orang yang putus sekolah"] }] }, vi: { examples: [{ mapping: ["cách bố trí", "các cách bố trí"] }, { mapping: ["người bỏ học", "những người bỏ học"] }] } }
          - type: rule
            level: C1
            text: { en: ["Some nouns put the particle first: ", { term: input }, ", ", { term: outcome }, ", ", { term: output }, "."], uk: ["У деяких іменників частка стоїть першою: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], es: ["Algunos sustantivos ponen la partícula primero: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], pt: ["Alguns substantivos colocam a partícula primeiro: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], fr: ["Certains noms placent la particule en premier : ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], de: ["Manche Nomen stellen die Partikel voran: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], it: ["Alcuni sostantivi mettono la particella all'inizio: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], pl: ["Niektóre rzeczowniki mają partykułę na początku: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], tr: ["Bazı isimlerde parçacık başta yer alır: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], id: ["Beberapa kata benda menaruh partikel di depan: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."], vi: ["Một số danh từ đặt tiểu từ lên trước: ", { term: "input" }, ", ", { term: "outcome" }, ", ", { term: "output" }, "."] }

