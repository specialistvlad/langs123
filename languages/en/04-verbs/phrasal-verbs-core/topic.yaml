            text: { en: "The object always follows the preposition, so the verb never splits.", uk: "Додаток завжди стоїть після прийменника, тому дієслово ніколи не розділяється.", es: "El objeto siempre va después de la preposición, así que el verbo nunca se separa.", pt: "O objeto sempre vai depois da preposição, então o verbo nunca se separa.", fr: "Le complément suit toujours la préposition ; le verbe ne se sépare donc jamais.", de: "Das Objekt steht immer nach der Präposition, deshalb wird das Verb nie getrennt.", it: "Il complemento oggetto va sempre dopo la preposizione, quindi il verbo non si separa mai.", pl: "Dopełnienie zawsze stoi po przyimku, więc czasownik nigdy się nie rozdziela.", tr: "Nesne her zaman edattan sonra gelir, bu yüzden fiil hiçbir zaman ayrılmaz.", id: "Objek selalu berada setelah kata depan, jadi kata kerjanya tidak pernah dipisah.", vi: "Tân ngữ luôn đứng sau giới từ, nên cụm động từ không bao giờ bị tách." }
