          - { level: B2, verb: break down, meaning: { en: "stop working, or fail", uk: "зламатися або зазнати краху", es: "averiarse, o fracasar", pt: "quebrar, ou fracassar", fr: "tomber en panne, ou échouer", de: "ausfallen, oder scheitern", it: "guastarsi, o fallire", pl: "zepsuć się lub zakończyć się fiaskiem", tr: "bozulmak ya da başarısız olmak", id: "mogok, atau gagal", vi: "hỏng, hoặc thất bại" }, ex: { examples: [["Our car ", { target: broke down }, " on the motorway."], ["The talks ", { target: broke down }, "."]] }, tr: { uk: { examples: ["Наша машина зламалася на автостраді.", "Переговори зірвалися."] }, es: { examples: ["Nuestro auto se averió en la autopista.", "Las negociaciones fracasaron."] }, pt: { examples: ["Nosso carro quebrou na rodovia.", "As negociações fracassaram."] }, fr: { examples: ["Notre voiture est tombée en panne sur l’autoroute.", "Les négociations ont échoué."] }, de: { examples: ["Unser Auto hatte auf der Autobahn eine Panne.", "Die Gespräche sind gescheitert."] }, it: { examples: ["La nostra auto si è guastata in autostrada.", "I negoziati sono falliti."] }, pl: { examples: ["Nasz samochód zepsuł się na autostradzie.", "Rozmowy zakończyły się fiaskiem."] }, tr: { examples: ["Arabamız otoyolda bozuldu.", "Görüşmeler çöktü."] }, id: { examples: ["Mobil kami mogok di jalan tol.", "Perundingan itu gagal."] }, vi: { examples: ["Xe của chúng tôi bị hỏng trên đường cao tốc.", "Cuộc đàm phán đã đổ vỡ."] } } }

