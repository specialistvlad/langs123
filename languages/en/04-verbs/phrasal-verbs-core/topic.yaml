          - { level: C1, particle: through, meaning: { en: to the end, uk: "до кінця", es: "hasta el final", pt: "até o fim", fr: "jusqu’au bout", de: "bis zum Ende", it: "fino alla fine", pl: "do końca", tr: "sonuna kadar", id: "sampai selesai", vi: "đến cuối cùng" }, ex: { examples: [["Please ", { target: read through }, " the contract."], ["We ", { target: talked through }, " every detail."]] }, tr: { uk: { examples: ["Будь ласка, прочитайте договір до кінця.", "Ми обговорили кожну деталь."] }, es: { examples: ["Por favor, lea el contrato hasta el final.", "Repasamos cada detalle hablando."] }, pt: { examples: ["Por favor, leia o contrato até o fim.", "Conversamos sobre cada detalhe."] }, fr: { examples: ["Lisez le contrat jusqu’au bout, s’il vous plaît.", "Nous avons discuté de chaque détail."] }, de: { examples: ["Bitte lesen Sie den Vertrag ganz durch.", "Wir haben jedes Detail durchgesprochen."] }, it: { examples: ["Per favore, leggete il contratto fino in fondo.", "Abbiamo discusso ogni dettaglio."] }, pl: { examples: ["Proszę przeczytać umowę do końca.", "Omówiliśmy każdy szczegół."] }, tr: { examples: ["Lütfen sözleşmeyi sonuna kadar okuyun.", "Her ayrıntıyı baştan sona konuştuk."] }, id: { examples: ["Tolong baca kontrak itu sampai selesai.", "Kami membicarakan setiap detail sampai tuntas."] }, vi: { examples: ["Xin hãy đọc hợp đồng đến cuối.", "Chúng tôi đã bàn kỹ từng chi tiết."] } } }
