          - { level: B2, phrasal: { ex: ["The surgeons ", { target: carried out }, " the operation."], tr: { uk: "Хірурги провели операцію.", es: "Los cirujanos llevaron a cabo la operación.", pt: "Os cirurgiões levaram a cabo a operação.", fr: "Les chirurgiens ont mené l’opération.", de: "Die Chirurgen führten die Operation durch.", it: "I chirurghi hanno portato a termine l'operazione.", pl: "Chirurdzy przeprowadzili operację.", tr: "Cerrahlar ameliyatı yaptı.", id: "Para dokter bedah menjalankan operasi itu.", vi: "Các bác sĩ phẫu thuật đã làm ca mổ." } }, formal: { ex: ["The surgeons ", { target: performed }, " the operation."], tr: { uk: "Хірурги виконали операцію.", es: "Los cirujanos realizaron la operación.", pt: "Os cirurgiões realizaram a operação.", fr: "Les chirurgiens ont pratiqué l’opération.", de: "Die Chirurgen nahmen die Operation vor.", it: "I chirurghi hanno eseguito l'operazione.", pl: "Chirurdzy wykonali operację.", tr: "Cerrahlar ameliyatı gerçekleştirdi.", id: "Para dokter bedah melaksanakan operasi itu.", vi: "Các bác sĩ phẫu thuật đã thực hiện ca mổ." } } }
          - { level: B2, phrasal: { ex: ["Please ", { target: go on }, " with your story."], tr: { uk: "Продовжуйте, будь ласка, свою розповідь.", es: "Por favor, sigue con tu historia.", pt: "Por favor, siga com a sua história.", fr: "Continue ton histoire, s’il te plaît.", de: "Erzähl bitte weiter.", it: "Per favore, vai avanti con la tua storia.", pl: "Proszę, opowiadaj dalej.", tr: "Lütfen hikâyene devam et.", id: "Silakan teruskan ceritamu.", vi: "Làm ơn cứ kể tiếp đi." } }, formal: { ex: ["Please ", { target: continue }, " with your story."], tr: { uk: "Прошу продовжити вашу розповідь.", es: "Por favor, continúe con su historia.", pt: "Por favor, continue com a sua história.", fr: "Veuillez poursuivre votre récit.", de: "Bitte setzen Sie Ihre Erzählung fort.", it: "Per favore, prosegua con la sua storia.", pl: "Proszę kontynuować opowieść.", tr: "Lütfen hikâyenizi sürdürün.", id: "Silakan lanjutkan cerita Anda.", vi: "Xin hãy tiếp tục câu chuyện của bạn." } } }
          - { level: B2, phrasal: { ex: ["They ", { target: gave up }, " the search."], tr: { uk: "Вони кинули пошуки.", es: "Dejaron la búsqueda.", pt: "Eles desistiram da busca.", fr: "Ils ont renoncé aux recherches.", de: "Sie gaben die Suche auf.", it: "Hanno rinunciato alla ricerca.", pl: "Zrezygnowali z poszukiwań.", tr: "Aramayı bıraktılar.", id: "Mereka menyerah mencari.", vi: "Họ bỏ cuộc tìm kiếm." } }, formal: { ex: ["They ", { target: abandoned }, " the search."], tr: { uk: "Вони відмовилися від пошуків.", es: "Abandonaron la búsqueda.", pt: "Eles abandonaram a busca.", fr: "Ils ont abandonné les recherches.", de: "Sie stellten die Suche ein.", it: "Hanno abbandonato la ricerca.", pl: "Porzucili poszukiwania.", tr: "Aramaktan vazgeçtiler.", id: "Mereka menghentikan pencarian itu.", vi: "Họ từ bỏ cuộc tìm kiếm." } } }
          - { level: B2, phrasal: { ex: ["She ", { target: set up }, " a charity."], tr: { uk: "Вона створила благодійний фонд.", es: "Abrió una organización benéfica.", pt: "Ela montou uma instituição de caridade.", fr: "Elle a monté une association caritative.", de: "Sie hat eine Wohltätigkeitsorganisation auf die Beine gestellt.", it: "Ha messo in piedi un'organizzazione benefica.", pl: "Założyła fundację.", tr: "Bir hayır kurumu kurdu.", id: "Dia membuat sebuah lembaga amal.", vi: "Cô ấy lập ra một tổ chức từ thiện." } }, formal: { ex: ["She ", { target: established }, " a charity."], tr: { uk: "Вона заснувала благодійний фонд.", es: "Fundó una organización benéfica.", pt: "Ela fundou uma instituição de caridade.", fr: "Elle a fondé une association caritative.", de: "Sie hat eine Wohltätigkeitsorganisation gegründet.", it: "Ha fondato un'organizzazione benefica.", pl: "Ustanowiła fundację.", tr: "Bir hayır kurumu tesis etti.", id: "Dia mendirikan sebuah lembaga amal.", vi: "Cô ấy thành lập một tổ chức từ thiện." } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A phrasal verb suits speech and informal writing; a one-word verb suits reports and formal letters.", uk: "Фразове дієслово пасує розмовному мовленню й неформальному листу; однослівне дієслово — звітам і офіційним листам.", es: "El phrasal verb va bien en el habla y en los textos informales; el verbo de una sola palabra, en informes y cartas formales.", pt: "O phrasal verb combina com a fala e a escrita informal; o verbo de uma só palavra combina com relatórios e cartas formais.", fr: "Le phrasal verb convient à l’oral et à l’écrit familier ; le verbe d’un seul mot convient aux rapports et aux lettres formelles.", de: "Das Phrasal Verb passt zur gesprochenen Sprache und zu informellen Texten; das einteilige Verb passt zu Berichten und formellen Briefen.", it: "Il phrasal verb si addice al parlato e alla scrittura informale; il verbo di una sola parola si addice a rapporti e lettere formali.", pl: "Czasownik frazowy pasuje do mowy i nieformalnego pisma; czasownik jednowyrazowy pasuje do raportów i listów formalnych.", tr: "Phrasal verb konuşma diline ve gayriresmî yazıya uygundur; tek sözcüklü fiil raporlara ve resmî mektuplara uygundur.", id: "Phrasal verb cocok untuk percakapan dan tulisan informal; kata kerja satu kata cocok untuk laporan dan surat formal.", vi: "Cụm động từ hợp với lời nói và văn viết thân mật; động từ một từ hợp với báo cáo và thư trang trọng." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Turn off it., right: { target: Turn it off. }, rule: { en: [{ pattern: [separable verb, pronoun] }, ": the pronoun goes in the middle"], uk: [{ pattern: ["роздільне дієслово", "займенник"] }, ": займенник стоїть посередині"], es: [{ pattern: ["verbo separable", "pronombre"] }, ": el pronombre va en medio"], pt: [{ pattern: ["verbo separável", "pronome"] }, ": o pronome vai no meio"], fr: [{ pattern: ["verbe séparable", "pronom"] }, " : le pronom se place au milieu"], de: [{ pattern: ["trennbares Verb", "Pronomen"] }, ": das Pronomen steht in der Mitte"], it: [{ pattern: ["verbo separabile", "pronome"] }, ": il pronome va in mezzo"], pl: [{ pattern: ["czasownik rozdzielny", "zaimek"] }, ": zaimek stoi pośrodku"], tr: [{ pattern: ["ayrılabilir fiil", "zamir"] }, ": zamir ortada yer alır"], id: [{ pattern: ["kata kerja yang dapat dipisah", "kata ganti"] }, ": kata ganti berada di tengah"], vi: [{ pattern: ["cụm động từ tách được", "đại từ"] }, ": đại từ đứng ở giữa"] } }
          - { level: A2, wrong: Can you wake up me at seven?, right: ["Can you ", { target: wake me up }, " at seven?"], rule: { en: ["the pronoun goes between ", { term: wake }, " and ", { term: up }], uk: ["займенник стоїть між ", { term: wake }, " і ", { term: up }], es: ["el pronombre va entre ", { term: wake }, " y ", { term: up }], pt: ["o pronome vai entre ", { term: "wake" }, " e ", { term: "up" }], fr: ["le pronom se place entre ", { term: "wake" }, " et ", { term: "up" }], de: ["das Pronomen steht zwischen ", { term: "wake" }, " und ", { term: "up" }], it: ["il pronome va tra ", { term: "wake" }, " e ", { term: "up" }], pl: ["zaimek stoi między ", { term: "wake" }, " a ", { term: "up" }], tr: ["zamir ", { term: "wake" }, " ile ", { term: "up" }, " arasında yer alır"], id: ["kata ganti berada di antara ", { term: "wake" }, " dan ", { term: "up" }], vi: ["đại từ đứng giữa ", { term: "wake" }, " và ", { term: "up" }] } }
          - { level: A2, wrong: She looks them after., right: ["She ", { target: looks after them }, "."], rule: { en: "inseparable verb: the object follows the particle", uk: "нероздільне дієслово: додаток стоїть після частки", es: "verbo inseparable: el objeto va después de la partícula", pt: "verbo inseparável: o objeto vai depois da partícula", fr: "verbe inséparable : le complément suit la particule", de: "untrennbares Verb: das Objekt steht nach der Partikel", it: "verbo inseparabile: il complemento oggetto va dopo la particella", pl: "czasownik nierozdzielny: dopełnienie stoi po partykule", tr: "ayrılamaz fiil: nesne parçacıktan sonra gelir", id: "kata kerja yang tidak dapat dipisah: objek berada setelah partikel", vi: "cụm động từ không tách được: tân ngữ đứng sau tiểu từ" } }
          - { level: B1, wrong: We ran out milk., right: ["We ran out ", { target: of }, " milk."], rule: { en: [{ term: run out of }, " needs ", { term: of }], uk: [{ term: run out of }, " потребує ", { term: of }], es: [{ term: run out of }, " necesita ", { term: of }], pt: [{ term: "run out of" }, " precisa de ", { term: "of" }], fr: [{ term: "run out of" }, " exige ", { term: "of" }], de: [{ term: "run out of" }, " braucht ", { term: "of" }], it: [{ term: "run out of" }, " richiede ", { term: "of" }], pl: [{ term: "run out of" }, " wymaga ", { term: "of" }], tr: [{ term: "run out of" }, " için ", { term: "of" }, " gerekir"], id: [{ term: "run out of" }, " memerlukan ", { term: "of" }], vi: [{ term: "run out of" }, " cần ", { term: "of" }] } }
          - { level: B1, wrong: I look forward to see you., right: ["I look forward to ", { target: seeing }, " you."], rule: { en: [{ term: to }, " is a preposition: noun or -ing"], uk: [{ term: to }, " тут прийменник: іменник або форма на -ing"], es: [{ term: to }, " es una preposición: sustantivo o forma en -ing"], pt: [{ term: "to" }, " é uma preposição: substantivo ou forma -ing"], fr: [{ term: "to" }, " est une préposition : nom ou forme en -ing"], de: [{ term: "to" }, " ist eine Präposition: Nomen oder -ing-Form"], it: [{ term: "to" }, " è una preposizione: sostantivo o forma in -ing"], pl: [{ term: "to" }, " to tutaj przyimek: rzeczownik lub forma -ing"], tr: [{ term: "to" }, " burada edattır: isim ya da -ing biçimi"], id: [{ term: "to" }, " di sini adalah kata depan: kata benda atau bentuk -ing"], vi: [{ term: "to" }, " là giới từ: danh từ hoặc -ing"] } }
          - { level: B1, wrong: He gave up to smoke., right: ["He gave up ", { target: smoking }, "."], rule: { en: { pattern: [{ term: give up }, { slot: "-ing" }] }, uk: { pattern: [{ term: give up }, { slot: "-ing" }] }, es: { pattern: [{ term: give up }, { slot: "-ing" }] }, pt: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, fr: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, de: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, it: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, pl: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, tr: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, id: { pattern: [{ term: "give up" }, { slot: "-ing" }] }, vi: { pattern: [{ term: "give up" }, { slot: "-ing" }] } } }
          - { level: B2, wrong: "I can't put up it with.", right: ["I can't ", { target: put up with }, " it."], rule: { en: "a three-part verb never splits: the object comes last", uk: "трискладове дієслово не розділяється: додаток стоїть останнім", es: "un verbo de tres partes nunca se separa: el objeto va al final", pt: "um verbo de três partes nunca se separa: o objeto vem por último", fr: "un verbe à trois éléments ne se sépare jamais : le complément vient en dernier", de: "ein dreiteiliges Verb wird nie getrennt: das Objekt steht zuletzt", it: "un verbo a tre parti non si separa mai: il complemento oggetto viene per ultimo", pl: "czasownik trzyczłonowy nigdy się nie rozdziela: dopełnienie stoi na końcu", tr: "üç parçalı fiil asla ayrılmaz: nesne en sonda gelir", id: "kata kerja tiga bagian tidak pernah dipisah: objek berada di akhir", vi: "cụm động từ ba thành phần không bao giờ bị tách: tân ngữ đứng cuối" } }
          - { level: B2, wrong: "We need to cut down sugar.", right: ["We need to ", { target: cut down on }, " sugar."], rule: { en: ["the preposition ", { term: on }, " belongs to the verb"], uk: ["прийменник ", { term: "on" }, " належить до дієслова"], es: ["la preposición ", { term: "on" }, " forma parte del verbo"], pt: ["a preposição ", { term: "on" }, " faz parte do verbo"], fr: ["la préposition ", { term: "on" }, " fait partie du verbe"], de: ["die Präposition ", { term: "on" }, " gehört zum Verb"], it: ["la preposizione ", { term: "on" }, " fa parte del verbo"], pl: ["przyimek ", { term: "on" }, " należy do czasownika"], tr: [{ term: "on" }, " edatı fiilin parçasıdır"], id: ["kata depan ", { term: "on" }, " merupakan bagian dari kata kerja"], vi: ["giới từ ", { term: "on" }, " thuộc về cụm động từ"] } }
          - { level: B2, wrong: "He talked me into buy a car.", right: ["He talked me into ", { target: buying }, " a car."], rule: { en: [{ term: into }, " is a preposition: the -ing form follows"], uk: [{ term: "into" }, " — прийменник: далі йде форма на -ing"], es: [{ term: "into" }, " es una preposición: sigue la forma en -ing"], pt: [{ term: "into" }, " é uma preposição: segue a forma -ing"], fr: [{ term: "into" }, " est une préposition : la forme en -ing suit"], de: [{ term: "into" }, " ist eine Präposition: es folgt die -ing-Form"], it: [{ term: "into" }, " è una preposizione: segue la forma in -ing"], pl: [{ term: "into" }, " to przyimek: dalej stoi forma -ing"], tr: [{ term: "into" }, " bir edattır: ardından -ing biçimi gelir"], id: [{ term: "into" }, " adalah kata depan: diikuti bentuk -ing"], vi: [{ term: "into" }, " là giới từ: theo sau là dạng -ing"] } }
          - { level: C1, wrong: "She picked the book she had ordered last week up.", right: ["She ", { target: picked up }, " the book she had ordered last week."], rule: { en: a long object follows the particle, uk: "довгий додаток стоїть після частки", es: "el objeto largo va después de la partícula", pt: "o objeto longo vai depois da partícula", fr: "le complément long suit la particule", de: "ein langes Objekt steht nach der Partikel", it: "il complemento oggetto lungo va dopo la particella", pl: "długie dopełnienie stoi po partykule", tr: "uzun nesne parçacıktan sonra gelir", id: "objek panjang berada setelah partikel", vi: "tân ngữ dài đứng sau tiểu từ" } }
          - { level: C1, wrong: "The car had a break down.", right: ["The car had a ", { target: breakdown }, "."], rule: { en: "the noun is one word or has a hyphen; the verb is two words", uk: "іменник — одне слово або слово з дефісом; дієслово — два слова", es: "el sustantivo es una palabra o lleva guion; el verbo son dos palabras", pt: "o substantivo é uma palavra só ou leva hífen; o verbo são duas palavras", fr: "le nom s’écrit en un mot ou avec un trait d’union ; le verbe s’écrit en deux mots", de: "das Nomen ist ein Wort oder hat einen Bindestrich; das Verb besteht aus zwei Wörtern", it: "il sostantivo è una parola sola o ha il trattino; il verbo è formato da due parole", pl: "rzeczownik to jeden wyraz lub wyraz z łącznikiem; czasownik to dwa wyrazy", tr: "isim tek sözcüktür ya da kısa çizgi taşır; fiil iki sözcüktür", id: "kata benda satu kata atau memakai tanda hubung; kata kerja terdiri atas dua kata", vi: "danh từ là một từ hoặc có dấu gạch nối; động từ gồm hai từ" } }
          - { level: C1, wrong: "Please setup the equipment.", right: ["Please ", { target: set up }, " the equipment."], rule: { en: "the verb is two words; the noun is set-up", uk: "дієслово — два слова; іменник — set-up", es: "el verbo son dos palabras; el sustantivo es set-up", pt: "o verbo são duas palavras; o substantivo é set-up", fr: "le verbe s’écrit en deux mots ; le nom est set-up", de: "das Verb besteht aus zwei Wörtern; das Nomen heißt set-up", it: "il verbo è formato da due parole; il sostantivo è set-up", pl: "czasownik to dwa wyrazy; rzeczownik to set-up", tr: "fiil iki sözcüktür; isim set-up biçimindedir", id: "kata kerja terdiri atas dua kata; kata bendanya set-up", vi: "động từ gồm hai từ; danh từ là set-up" } }
          - { level: C2, wrong: "The study gave rise a debate.", right: ["The study ", { target: gave rise to }, " a debate."], rule: { en: ["the verb ", { term: give rise }, " needs ", { term: to }], uk: ["дієслово ", { term: "give rise" }, " потребує ", { term: "to" }], es: ["el verbo ", { term: "give rise" }, " necesita ", { term: "to" }], pt: ["o verbo ", { term: "give rise" }, " precisa de ", { term: "to" }], fr: ["le verbe ", { term: "give rise" }, " exige ", { term: "to" }], de: ["das Verb ", { term: "give rise" }, " braucht ", { term: "to" }], it: ["il verbo ", { term: "give rise" }, " richiede ", { term: "to" }], pl: ["czasownik ", { term: "give rise" }, " wymaga ", { term: "to" }], tr: [{ term: "give rise" }, " fiili ", { term: "to" }, " gerektirir"], id: ["kata kerja ", { term: "give rise" }, " memerlukan ", { term: "to" }], vi: ["động từ ", { term: "give rise" }, " cần ", { term: "to" }] } }
          - { level: A2, speakers: [uk], wrong: I'm looking my keys., right: ["I'm ", { target: looking for }, " my keys."], rule: { uk: [{ term: look for }, ": українське «шукати» не має прийменника, а в англійській ", { term: for }, " обов’язковий"] } }
          - { level: A2, speakers: [es], wrong: I'm looking my keys., right: ["I'm ", { target: looking for }, " my keys."], rule: { es: [{ term: look for }, ": «buscar» no lleva preposición, pero en inglés ", { term: for }, " es obligatorio"] } }
