translated: { uk: "138fe0 338a59 8250fd a5c660 efd8ec 435415 ae9e4f 25cfac f10006", es: "138fe0 338a59 8250fd a5c660 efd8ec 435415 ae9e4f 25cfac f10006" }

title: { en: To be, uk: Дієслово to be, es: El verbo to be }
summary:
  lead:
    en: [{ term: Am }, ", ", { term: is }, ", ", { term: are }, ", ", { term: was }, ", ", { term: were }, " and ", { term: will be }, ": the verb for name, age, nationality, job, feelings and place."]
    uk: [{ term: Am }, ", ", { term: is }, ", ", { term: are }, ", ", { term: was }, ", ", { term: were }, " і ", { term: will be }, ": дієслово для імені, віку, національності, професії, почуттів і місця."]
    es: [{ term: Am }, ", ", { term: is }, ", ", { term: are }, ", ", { term: was }, ", ", { term: were }, " y ", { term: will be }, ": el verbo para el nombre, la edad, la nacionalidad, la profesión, los sentimientos y el lugar."]
  rule:
    en: [{ term: Be }, " needs no helper and the subject is always in the sentence:"]
    uk: [{ term: Be }, " не потребує допоміжного дієслова, і підмет у реченні обов’язковий:"]
    es: [{ term: Be }, " no necesita verbo auxiliar y el sujeto siempre aparece en la oración:"]
  ex: { examples: [[{ target: Are }, " you a student?"], [{ target: It is }, " cold."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: tense, label: { en: Tense, uk: "Час", es: "Tiempo" } }
        - { key: qh, slot: verb, features: { interrogativity: int, polarity: pos } }
        - { key: qs, slot: subj, features: { interrogativity: int, polarity: pos } }
        - { key: qv, slot: rest, features: { interrogativity: int, polarity: pos } }
        - { key: ss, slot: subj, features: { interrogativity: decl, polarity: pos } }
        - { key: sh, slot: verb, features: { interrogativity: decl, polarity: pos } }
        - { key: sv, slot: rest, features: { interrogativity: decl, polarity: pos } }
        - { key: ns, slot: subj, features: { interrogativity: decl, polarity: neg } }
        - { key: nh, slot: verb, features: { interrogativity: decl, polarity: neg } }
        - { key: nv, slot: rest, features: { interrogativity: decl, polarity: neg } }
      rows:
        - { level: A2, features: { tense: fut, person: 1, number: sg }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: I, qv: [{ target: be }, " late?"], ss: I, sh: { target: will be }, sv: late., ns: I, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 2 }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: you, qv: [{ target: be }, " late?"], ss: You, sh: { target: will be }, sv: late., ns: You, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: masc }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: he, qv: [{ target: be }, " late?"], ss: He, sh: { target: will be }, sv: late., ns: He, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: fem }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: she, qv: [{ target: be }, " late?"], ss: She, sh: { target: will be }, sv: late., ns: She, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: neut }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: it, qv: [{ target: be }, " late?"], ss: It, sh: { target: will be }, sv: late., ns: It, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 1, number: pl }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: we, qv: [{ target: be }, " late?"], ss: We, sh: { target: will be }, sv: late., ns: We, nh: { target: won't be }, nv: late. }
        - { level: A2, features: { tense: fut, person: 3, number: pl }, tense: { en: Future, uk: "Майбутній", es: "Futuro" }, qh: { target: Will }, qs: they, qv: [{ target: be }, " late?"], ss: They, sh: { target: will be }, sv: late., ns: They, nh: { target: won't be }, nv: late. }
        - { level: A0, features: { tense: prs, person: 1, number: sg }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Am }, qs: I, qv: late?, ss: I, sh: { target: am }, sv: late., ns: I, nh: { target: am not }, nv: late. }
        - { level: A0, features: { tense: prs, person: 2 }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Are }, qs: you, qv: late?, ss: You, sh: { target: are }, sv: late., ns: You, nh: { target: aren't }, nv: late. }
        - { level: A0, features: { tense: prs, person: 3, number: sg, gender: masc }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Is }, qs: he, qv: late?, ss: He, sh: { target: is }, sv: late., ns: He, nh: { target: isn't }, nv: late. }
        - { level: A0, features: { tense: prs, person: 3, number: sg, gender: fem }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Is }, qs: she, qv: late?, ss: She, sh: { target: is }, sv: late., ns: She, nh: { target: isn't }, nv: late. }
        - { level: A0, features: { tense: prs, person: 3, number: sg, gender: neut }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Is }, qs: it, qv: late?, ss: It, sh: { target: is }, sv: late., ns: It, nh: { target: isn't }, nv: late. }
        - { level: A0, features: { tense: prs, person: 1, number: pl }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Are }, qs: we, qv: late?, ss: We, sh: { target: are }, sv: late., ns: We, nh: { target: aren't }, nv: late. }
        - { level: A0, features: { tense: prs, person: 3, number: pl }, tense: { en: Present, uk: "Теперішній", es: "Presente" }, qh: { target: Are }, qs: they, qv: late?, ss: They, sh: { target: are }, sv: late., ns: They, nh: { target: aren't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 1, number: sg }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Was }, qs: I, qv: late?, ss: I, sh: { target: was }, sv: late., ns: I, nh: { target: wasn't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 2 }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Were }, qs: you, qv: late?, ss: You, sh: { target: were }, sv: late., ns: You, nh: { target: weren't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: masc }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Was }, qs: he, qv: late?, ss: He, sh: { target: was }, sv: late., ns: He, nh: { target: wasn't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: fem }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Was }, qs: she, qv: late?, ss: She, sh: { target: was }, sv: late., ns: She, nh: { target: wasn't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: neut }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Was }, qs: it, qv: late?, ss: It, sh: { target: was }, sv: late., ns: It, nh: { target: wasn't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 1, number: pl }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Were }, qs: we, qv: late?, ss: We, sh: { target: were }, sv: late., ns: We, nh: { target: weren't }, nv: late. }
        - { level: A1, features: { tense: pst, person: 3, number: pl }, tense: { en: Past, uk: "Минулий", es: "Pasado" }, qh: { target: Were }, qs: they, qv: late?, ss: They, sh: { target: were }, sv: late., ns: They, nh: { target: weren't }, nv: late. }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: prose
        level: A0
        text:
          en: [{ term: be }, " has its own form in each tense: ", { term: will be }, " for the future, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " for the present, ", { alternatives: [{ term: was }, { term: were }] }, " for the past."]
          uk: [{ term: be }, " має власну форму в кожному часі: ", { term: will be }, " для майбутнього, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " для теперішнього, ", { alternatives: [{ term: was }, { term: were }] }, " для минулого."]
          es: [{ term: be }, " tiene su propia forma en cada tiempo: ", { term: will be }, " para el futuro, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " para el presente, ", { alternatives: [{ term: was }, { term: were }] }, " para el pasado."]
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: be }, " needs no helper: in questions it goes before the subject, in negatives it takes ", { term: not }, "."]
              uk: ["Дієслово ", { term: be }, " не потребує допоміжного: у питаннях воно стоїть перед підметом, у запереченнях до нього додається ", { term: not }, "."]
              es: ["El verbo ", { term: be }, " no necesita auxiliar: en las preguntas va antes del sujeto, en las negaciones lleva ", { term: not }, "."]
          - type: rule
            level: A0
            text:
              en: ["Present and past forms change with the person; ", { term: will be }, " is the same for everyone."]
              uk: ["Форми теперішнього й минулого часу змінюються за особами; ", { term: will be }, " однакове для всіх."]
              es: ["Las formas del presente y del pasado cambian según la persona; ", { term: will be }, " es igual para todos."]
          - type: rule
            level: A0
            text:
              en: [{ term: you }, " takes ", { term: are }, " and ", { term: were }, ", for one person and for many."]
              uk: [{ term: you }, " вживається з ", { term: are }, " і ", { term: were }, ", і для однієї особи, і для багатьох."]
              es: [{ term: you }, " lleva ", { term: are }, " y ", { term: were }, ", tanto para una persona como para varias."]

  - title: { en: "Present: short forms", uk: "Теперішній час: скорочені форми", es: "Presente: formas contraídas" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, uk: "Підмет", es: "Sujeto" } }
          - { key: full, label: { en: Full form, uk: "Повна форма", es: "Forma completa" }, features: { contraction: full } }
          - { key: short, label: { en: Short form, uk: "Скорочена форма", es: "Forma contraída" }, features: { contraction: short } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, subject: I, full: ["I ", { target: am }, " a student."], short: [I, { target: "'m" }, " a student."] }
          - { level: A0, features: { person: 2 }, subject: you, full: ["You ", { target: are }, " late."], short: [You, { target: "'re" }, " late."] }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, subject: he, full: ["He ", { target: is }, " at home."], short: [He, { target: "'s" }, " at home."] }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, subject: she, full: ["She ", { target: is }, " happy."], short: [She, { target: "'s" }, " happy."] }
          - { level: A0, features: { person: 3, number: sg, gender: neut }, subject: it, full: ["It ", { target: is }, " cold."], short: [It, { target: "'s" }, " cold."] }
          - { level: A0, features: { person: 1, number: pl }, subject: we, full: ["We ", { target: are }, " friends."], short: [We, { target: "'re" }, " friends."] }
          - { level: A0, features: { person: 3, number: pl }, subject: they, full: ["They ", { target: are }, " teachers."], short: [They, { target: "'re" }, " teachers."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: Speech and messages use the short forms.
              uk: "У мовленні й повідомленнях вживаються скорочені форми."
              es: "En el habla y en los mensajes se usan las formas contraídas."
          - type: rule
            level: A0
            text:
              en: ["Negatives: ", { term: isn't }, " and ", { term: aren't }, " are usual; ", { term: I'm not }, " is the only short form with ", { term: I }, "."]
              uk: ["Заперечення: ", { term: isn't }, " і ", { term: aren't }, " — звичайні форми; ", { term: I'm not }, " — єдина скорочена форма з ", { term: I }, "."]
              es: ["Negaciones: ", { term: isn't }, " y ", { term: aren't }, " son las habituales; ", { term: I'm not }, " es la única forma contraída con ", { term: I }, "."]
          - type: rule
            level: A0
            text:
              en: ["A noun subject takes ", { term: is }, " (singular) or ", { term: are }, " (plural):"]
              uk: ["Іменник-підмет вживається з ", { term: is }, " (однина) або ", { term: are }, " (множина):"]
              es: ["Un sujeto sustantivo lleva ", { term: is }, " (singular) o ", { term: are }, " (plural):"]
            ex: ["My parents ", { target: are }, " doctors."]
            tr: { uk: "Мої батьки — лікарі.", es: "Mis padres son médicos." }

  - title: { en: "Present: questions and short answers", uk: "Теперішній час: питання й короткі відповіді", es: "Presente: preguntas y respuestas cortas" }
    role: form
    features: { tense: prs }
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A0, form: { pattern: [be, { slot: subject }] }, ex: [{ target: Are }, " you a student?"], tr: { uk: "Ти студент?", es: "¿Eres estudiante?" } }
          - { level: A0, form: { pattern: [{ slot: wh-word }, be, { slot: subject }] }, ex: ["Where ", { target: are }, " you from?"], tr: { uk: "Звідки ти?", es: "¿De dónde eres?" } }
          - { level: A0, form: { pattern: [{ slot: wh-word }, be, { slot: subject }] }, ex: ["What ", { target: is }, " your name?"], tr: { uk: "Як тебе звати?", es: "¿Cómo te llamas?" } }
          - { level: A0, form: { pattern: [{ slot: wh-word }, be, { slot: subject }] }, ex: ["How old ", { target: are }, " you?"], tr: { uk: "Скільки тобі років?", es: "¿Cuántos años tienes?" } }
          - { level: A0, form: { pattern: [{ slot: wh-word }, be, { slot: subject }] }, ex: ["How ", { target: are }, " you?"], tr: { uk: "Як справи?", es: "¿Cómo estás?" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["A short answer repeats ", { term: be }, "; the positive answer takes the full form:"]
              uk: ["Коротка відповідь повторює ", { term: be }, "; стверджувальна відповідь має повну форму:"]
              es: ["La respuesta corta repite ", { term: be }, "; la respuesta afirmativa lleva la forma completa:"]
            ex: { exchange: [Are you tired?, { alternatives: [["Yes, I ", { target: am }, "."], ["No, I'", { target: m not }, "."]] }] }
            tr: { uk: "Ти втомився? — Так, втомився; ні, не втомився.", es: "¿Estás cansado? — Sí, lo estoy; no, no lo estoy." }

  - title: { en: "Past: was and were", uk: "Минулий час: was і were", es: "Pasado: was y were" }
    role: form
    features: { tense: pst }
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: singular, label: { alternatives: [I, he, she, it] }, features: [{ person: 1, number: sg }, { person: 3, number: sg }] }
          - { key: plural, label: { alternatives: [you, we, they] }, features: [{ person: 2 }, { person: 1, number: pl }, { person: 3, number: pl }] }
        rows:
          - { level: A1, features: { polarity: pos, interrogativity: decl }, form: "+", singular: ["I ", { target: was }, " at home."], plural: ["We ", { target: were }, " at home."] }
          - { level: A1, features: { polarity: neg, interrogativity: decl }, form: "−", singular: ["She ", { target: wasn't }, " at home."], plural: ["They ", { target: weren't }, " at home."] }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: "?", singular: [{ target: Was }, " he at home?"], plural: [{ target: Were }, " you at home?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A short answer repeats ", { alternatives: [{ term: was }, { term: were }] }, ":"]
              uk: ["Коротка відповідь повторює ", { alternatives: [{ term: was }, { term: were }] }, ":"]
              es: ["La respuesta corta repite ", { alternatives: [{ term: was }, { term: were }] }, ":"]
            ex: { exchange: [Were you there?, { alternatives: [["Yes, I ", { target: was }, "."], ["No, I ", { target: wasn't }, "."]] }] }
            tr: { uk: "Ти там був? — Так, був; ні, не був.", es: "¿Estuviste allí? — Sí, estuve; no, no estuve." }
          - type: rule
            level: A1
            text:
              en: ["Birth takes ", { alternatives: [{ term: was }, { term: were }] }, " ", { term: born }, ":"]
              uk: ["Для народження вживають ", { alternatives: [{ term: was }, { term: were }] }, " ", { term: born }, ":"]
              es: ["Para el nacimiento se usa ", { alternatives: [{ term: was }, { term: were }] }, " ", { term: born }, ":"]
            ex: ["I ", { target: was born }, " in ", { date: "1995", value: "1995" }, "."]
            tr: { uk: "Я народився 1995 року.", es: "Nací en 1995." }
          - type: rule
            level: A1
            text:
              en: ["Time words: ", { term: yesterday }, ", ", { term: last night }, ", ", { term: last week }, ", ", { term: in 2010 }, "."]
              uk: ["Слова часу: ", { term: yesterday }, ", ", { term: last night }, ", ", { term: last week }, ", ", { term: in 2010 }, "."]
              es: ["Palabras de tiempo: ", { term: yesterday }, ", ", { term: last night }, ", ", { term: last week }, ", ", { term: in 2010 }, "."]

  - title: { en: "Future: will be", uk: "Майбутній час: will be", es: "Futuro: will be" }
    role: form
    features: { tense: fut }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: A future state or place, uk: "Майбутній стан або місце", es: "Un estado o lugar futuro" }, ex: [I, { target: "'ll be" }, " at home tomorrow."], tr: { uk: "Завтра я буду вдома.", es: "Mañana estaré en casa." } }
          - { level: A2, use: { en: Predictions, uk: "Прогнози", es: "Predicciones" }, ex: ["It ", { target: will be }, " sunny at the weekend."], tr: { uk: "На вихідних буде сонячно.", es: "El fin de semana hará sol." } }
          - { level: A2, use: { en: Questions about the future, uk: "Питання про майбутнє", es: "Preguntas sobre el futuro" }, ex: [{ target: Will }, " you ", { target: be }, " there?"], tr: { uk: "Ти там будеш?", es: "¿Estarás allí?" } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Short forms: ", { term: I'll be }, ", ", { term: she'll be }, ", ", { term: won't be }, "."]
              uk: ["Скорочені форми: ", { term: I'll be }, ", ", { term: she'll be }, ", ", { term: won't be }, "."]
              es: ["Formas contraídas: ", { term: I'll be }, ", ", { term: she'll be }, ", ", { term: won't be }, "."]
          - type: note
            level: A2
            text:
              en: ["More about ", { term: will }, ": ", { link: Simple Tenses, to: en.tenses.simple-tenses }, "."]
              uk: ["Докладніше про ", { term: will }, ": ", { link: "Прості часи (Simple)", to: en.tenses.simple-tenses }, "."]
              es: ["Más sobre ", { term: will }, ": ", { link: "Tiempos simples", to: en.tenses.simple-tenses }, "."]

  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A0, use: { en: Name, uk: "Ім’я", es: "Nombre" }, ex: ["My name ", { target: is }, " Anna."], tr: { uk: "Мене звати Анна.", es: "Me llamo Anna." } }
          - { level: A0, use: { en: Age, uk: "Вік", es: "Edad" }, ex: { examples: [[I, { target: "'m" }, " 20."], ["He ", { target: is }, " 30 years old."]] }, tr: { uk: { examples: ["Мені 20 років.", "Йому 30 років."] }, es: { examples: ["Tengo 20 años.", "Él tiene 30 años."] } } }
          - { level: A0, use: { en: Nationality and origin, uk: "Національність і походження", es: "Nacionalidad y origen" }, ex: { examples: [[She, { target: "'s" }, " Spanish."], [We, { target: "'re" }, " from Madrid."]] }, tr: { uk: { examples: ["Вона іспанка.", "Ми з Мадрида."] }, es: { examples: ["Es española.", "Somos de Madrid."] } } }
          - { level: A0, use: { en: Job, uk: "Професія", es: "Profesión" }, ex: [He, { target: "'s" }, " a teacher."], tr: { uk: "Він учитель.", es: "Es profesor." } }
          - { level: A0, use: { en: Description, uk: "Опис", es: "Descripción" }, ex: ["The house ", { target: is }, " big."], tr: { uk: "Будинок великий.", es: "La casa es grande." } }
