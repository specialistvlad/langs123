sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: prose
        level: A0
        text:
          en: [{ term: be }, " has its own form in each tense: ", { term: will be }, " for the future, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " for the present, ", { alternatives: [{ term: was }, { term: were }] }, " for the past."]
          uk: [{ term: be }, " має власну форму в кожному часі: ", { term: will be }, " для майбутнього, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " для теперішнього, ", { alternatives: [{ term: was }, { term: were }] }, " для минулого."]
          es: [{ term: be }, " tiene su propia forma en cada tiempo: ", { term: will be }, " para el futuro, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " para el presente, ", { alternatives: [{ term: was }, { term: were }] }, " para el pasado."]
          pt: [{ term: "be" }, " tem uma forma própria em cada tempo verbal: ", { term: "will be" }, " para o futuro, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " para o presente, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " para o passado."]
          fr: [{ term: "be" }, " a sa propre forme à chaque temps : ", { term: "will be" }, " pour le futur, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " pour le présent, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " pour le passé."]
          de: [{ term: "be" }, " hat in jeder Zeitform eine eigene Form: ", { term: "will be" }, " für die Zukunft, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " für die Gegenwart, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " für die Vergangenheit."]
          it: [{ term: "be" }, " ha una forma propria in ogni tempo: ", { term: "will be" }, " per il futuro, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " per il presente, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " per il passato."]
          pl: [{ term: "be" }, " ma własną formę w każdym czasie: ", { term: "will be" }, " dla przyszłości, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " dla teraźniejszości, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " dla przeszłości."]
          tr: [{ term: "be" }, " her zamanda kendi biçimine sahiptir: gelecek için ", { term: "will be" }, ", şimdiki zaman için ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", geçmiş zaman için ", { alternatives: [{ term: "was" }, { term: "were" }] }, "."]
          id: [{ term: "be" }, " memiliki bentuk sendiri pada setiap tense: ", { term: "will be" }, " untuk future, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " untuk present, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " untuk past."]
          vi: [{ term: "be" }, " có dạng riêng ở mỗi thì: ", { term: "will be" }, " cho tương lai, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " cho hiện tại, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " cho quá khứ."]
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: be }, " needs no helper: in questions it goes before the subject, in negatives it takes ", { term: not }, "."]
              uk: ["Дієслово ", { term: be }, " не потребує допоміжного: у питаннях воно стоїть перед підметом, у запереченнях до нього додається ", { term: not }, "."]
              es: ["El verbo ", { term: be }, " no necesita auxiliar: en las preguntas va antes del sujeto, en las negaciones lleva ", { term: not }, "."]
              pt: ["O verbo ", { term: "be" }, " não precisa de auxiliar: nas perguntas vai antes do sujeito, nas negações leva ", { term: "not" }, "."]
              fr: ["Le verbe ", { term: "be" }, " n’a pas besoin d’auxiliaire : dans les questions il se place avant le sujet, dans les négations il prend ", { term: "not" }, "."]
              de: [{ term: "be" }, " braucht kein Hilfsverb: In Fragen steht es vor dem Subjekt, in der Verneinung folgt ", { term: "not" }, "."]
              it: ["Il verbo ", { term: "be" }, " non richiede un ausiliare: nelle domande va prima del soggetto, nelle frasi negative prende ", { term: "not" }, "."]
              pl: ["Czasownik ", { term: "be" }, " nie potrzebuje pomocniczego: w pytaniach stoi przed podmiotem, w przeczeniach dodaje się ", { term: "not" }, "."]
              tr: [{ term: "be" }, " fiili yardımcı fiil gerektirmez: soru cümlelerinde öznenin önüne geçer, olumsuz cümlelerde ", { term: "not" }, " alır."]
              id: [{ term: "be" }, " tidak membutuhkan kata kerja bantu: dalam pertanyaan diletakkan sebelum subjek, dalam kalimat negatif diikuti ", { term: "not" }, "."]
              vi: [{ term: "be" }, " không cần trợ động từ: trong câu hỏi nó đứng trước chủ ngữ, trong câu phủ định nó đi với ", { term: "not" }, "."]
          - type: rule
            level: A0
            text:
              en: ["Present and past forms change with the person; ", { term: will be }, " is the same for everyone."]
              uk: ["Форми теперішнього й минулого часу змінюються за особами; ", { term: will be }, " однакове для всіх."]
              es: ["Las formas del presente y del pasado cambian según la persona; ", { term: will be }, " es igual para todos."]
              pt: ["As formas do presente e do passado mudam conforme a pessoa; ", { term: "will be" }, " é igual para todos."]
              fr: ["Les formes du présent et du passé changent selon la personne ; ", { term: "will be" }, " est identique pour tous."]
