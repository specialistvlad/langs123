          - { level: C1, verbs: "believe, assume, know", form: { pattern: [{ slot: verb }, { slot: { en: object, uk: "додаток", es: "objeto", pt: "objeto", fr: "complément", de: "Objekt", it: "complemento oggetto", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, "to be", { slot: { en: complement, uk: "доповнення", es: "complemento", pt: "complemento", fr: "attribut", de: "Prädikativ", it: "predicativo", pl: "uzupełnienie", tr: "tümleç", id: "pelengkap", vi: "bổ ngữ" } }] }, ex: { examples: [["I ", { target: "believe him to be" }, " honest."], ["They ", { target: "assumed the figures to be" }, " correct."]] }, tr: { uk: { examples: ["Я вірю, що він чесний.", "Вони припустили, що цифри правильні."] }, es: { examples: ["Creo que es honesto.", "Supusieron que las cifras eran correctas."] }, pt: { examples: ["Eu acredito que ele é honesto.", "Eles presumiram que os números estavam corretos."] }, fr: { examples: ["Je crois qu’il est honnête.", "Ils ont supposé que les chiffres étaient exacts."] }, de: { examples: ["Ich glaube, dass er ehrlich ist.", "Sie gingen davon aus, dass die Zahlen stimmen."] }, it: { examples: ["Credo che sia onesto.", "Hanno presupposto che le cifre fossero corrette."] }, pl: { examples: ["Wierzę, że jest uczciwy.", "Przyjęli, że liczby są poprawne."] }, tr: { examples: ["Onun dürüst olduğuna inanıyorum.", "Rakamların doğru olduğunu varsaydılar."] }, id: { examples: ["Saya yakin dia jujur.", "Mereka mengira angka-angka itu benar."] }, vi: { examples: ["Tôi tin rằng anh ấy trung thực.", "Họ cho rằng các con số là đúng."] } } }
          - { level: C1, verbs: "catch, find", form: { pattern: [{ slot: verb }, { slot: { en: object, uk: "додаток", es: "objeto", pt: "objeto", fr: "complément", de: "Objekt", it: "complemento oggetto", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, { slot: "-ing" }] }, ex: { examples: [["I ", { target: "caught him stealing" }, "."], ["We ", { target: "found the dog sleeping" }, " in my bed."]] }, tr: { uk: { examples: ["Я впіймав його на крадіжці.", "Ми знайшли пса, який спав на моєму ліжку."] }, es: { examples: ["Lo sorprendí robando.", "Encontramos al perro durmiendo en mi cama."] }, pt: { examples: ["Eu o peguei roubando.", "Encontramos o cachorro dormindo na minha cama."] }, fr: { examples: ["Je l’ai surpris en train de voler.", "Nous avons trouvé le chien en train de dormir dans mon lit."] }, de: { examples: ["Ich habe ihn beim Stehlen erwischt.", "Wir haben den Hund schlafend in meinem Bett gefunden."] }, it: { examples: ["L'ho sorpreso a rubare.", "Abbiamo trovato il cane che dormiva nel mio letto."] }, pl: { examples: ["Przyłapałem go na kradzieży.", "Znaleźliśmy psa śpiącego w moim łóżku."] }, tr: { examples: ["Onu çalarken yakaladım.", "Köpeği yatağımda uyurken bulduk."] }, id: { examples: ["Saya memergokinya sedang mencuri.", "Kami menemukan anjing itu sedang tidur di tempat tidur saya."] }, vi: { examples: ["Tôi bắt quả tang anh ta đang ăn trộm.", "Chúng tôi thấy con chó đang ngủ trên giường của tôi."] } } }
          - { level: C1, verbs: "keep, leave", form: { pattern: [{ slot: verb }, { slot: { en: object, uk: "додаток", es: "objeto", pt: "objeto", fr: "complément", de: "Objekt", it: "complemento oggetto", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, { slot: "-ing" }] }, ex: { examples: [["Don't ", { target: "keep me waiting" }, "."], ["She ", { target: "left the engine running" }, "."]] }, tr: { uk: { examples: ["Не змушуй мене чекати.", "Вона залишила двигун увімкненим."] }, es: { examples: ["No me hagas esperar.", "Dejó el motor encendido."] }, pt: { examples: ["Não me faça esperar.", "Ela deixou o motor ligado."] }, fr: { examples: ["Ne me fais pas attendre.", "Elle a laissé le moteur tourner."] }, de: { examples: ["Lass mich nicht warten.", "Sie ließ den Motor laufen."] }, it: { examples: ["Non farmi aspettare.", "Ha lasciato il motore acceso."] }, pl: { examples: ["Nie każ mi czekać.", "Zostawiła włączony silnik."] }, tr: { examples: ["Beni bekletme.", "Motoru çalışır halde bıraktı."] }, id: { examples: ["Jangan membuat saya menunggu.", "Dia membiarkan mesinnya menyala."] }, vi: { examples: ["Đừng bắt tôi phải chờ.", "Cô ấy để máy nổ chạy."] } } }
      - type: list
