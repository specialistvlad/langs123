            text: { en: ["These verbs put the person after the thing, with ", { term: "to" }, "."], uk: ["Ці дієслова ставлять особу після речі, з ", { term: "to" }, "."], es: ["Estos verbos ponen a la persona después de la cosa, con ", { term: "to" }, "."], pt: ["Estes verbos põem a pessoa depois da coisa, com ", { term: "to" }, "."], fr: ["Ces verbes placent la personne après la chose, avec ", { term: "to" }, "."], de: ["Bei diesen Verben steht die Person nach der Sache, mit ", { term: "to" }, "."], it: ["Questi verbi mettono la persona dopo la cosa, con ", { term: "to" }, "."], pl: ["Te czasowniki stawiają osobę po rzeczy, z ", { term: "to" }, "."], tr: ["Bu fiiller kişiyi şeyden sonra, ", { term: "to" }, " ile getirir."], id: ["Kata kerja ini menempatkan orang setelah bendanya, dengan ", { term: "to" }, "."], vi: ["Các động từ này đặt người sau vật, kèm ", { term: "to" }, "."] }
