            text: { en: ["Verbs of amount and duration, such as ", { term: "cost" }, " and ", { term: "weigh" }, ", have no passive: see ", { link: Passive Voice, to: en.sentence-building.passive-voice }, "."], uk: ["Дієслова кількості й тривалості, як-от ", { term: "cost" }, " і ", { term: "weigh" }, ", не мають пасиву: див. ", { link: "Пасивний стан", to: en.sentence-building.passive-voice }, "."], es: ["Los verbos de cantidad y duración, como ", { term: "cost" }, " y ", { term: "weigh" }, ", no tienen pasiva: consulta ", { link: "La voz pasiva", to: en.sentence-building.passive-voice }, "."], pt: ["Os verbos de quantidade e duração, como ", { term: "cost" }, " e ", { term: "weigh" }, ", não têm voz passiva: veja ", { link: "A voz passiva", to: en.sentence-building.passive-voice }, "."], fr: ["Les verbes de quantité et de durée, comme ", { term: "cost" }, " et ", { term: "weigh" }, ", n’ont pas de passif : voir ", { link: "Voix passive", to: en.sentence-building.passive-voice }, "."], de: ["Verben der Menge und Dauer wie ", { term: "cost" }, " und ", { term: "weigh" }, " haben kein Passiv: siehe ", { link: "Das Passiv", to: en.sentence-building.passive-voice }, "."], it: ["I verbi di quantità e durata, come ", { term: "cost" }, " e ", { term: "weigh" }, ", non hanno il passivo: vedi ", { link: "Forma passiva", to: en.sentence-building.passive-voice }, "."], pl: ["Czasowniki ilości i czasu trwania, takie jak ", { term: "cost" }, " i ", { term: "weigh" }, ", nie mają strony biernej: zob. ", { link: "Strona bierna", to: en.sentence-building.passive-voice }, "."], tr: [{ term: "cost" }, " ve ", { term: "weigh" }, " gibi miktar ve süre bildiren fiillerin edilgeni yoktur: bkz. ", { link: "Edilgen çatı", to: en.sentence-building.passive-voice }, "."], id: ["Kata kerja jumlah dan lama, seperti ", { term: "cost" }, " dan ", { term: "weigh" }, ", tidak punya bentuk pasif: lihat ", { link: "Kalimat pasif", to: en.sentence-building.passive-voice }, "."], vi: ["Động từ chỉ số 