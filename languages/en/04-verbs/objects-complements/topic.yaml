          - { level: B2, verb: "move", none: { ex: ["The bus ", { target: "moved" }, "."], tr: { uk: "Автобус рушив.", es: "El autobús se movió.", pt: "O ônibus andou.", fr: "L’autobus a bougé.", de: "Der Bus fuhr an.", it: "L'autobus si è mosso.", pl: "Autobus ruszył.", tr: "Otobüs hareket etti.", id: "Bus itu bergerak.", vi: "Xe buýt chuyển bánh." } }, obj: { ex: ["She ", { target: "moved the chair" }, "."], tr: { uk: "Вона пересунула стілець.", es: "Movió la silla.", pt: "Ela moveu a cadeira.", fr: "Elle a déplacé la chaise.", de: "Sie hat den Stuhl verschoben.", it: "Ha spostato la sedia.", pl: "Przesunęła krzesło.", tr: "Sandalyeyi yerinden oynattı.", id: "Dia memindahkan kursi itu.", vi: "Cô ấy di chuyển cái ghế." } } }
          - { level: B2, verb: "sink", none: { ex: ["The boat ", { target: "sank" }, "."], tr: { uk: "Човен затонув.", es: "El bote se hundió.", pt: "O barco afundou.", fr: "Le bateau a coulé.", de: "Das Boot ist gesunken.", it: "La barca è affondata.", pl: "Łódź zatonęła.", tr: "Tekne battı.", id: "Perahu itu tenggelam.", vi: "Con thuyền chìm." } }, obj: { ex: ["The storm ", { target: "sank the boat" }, "."], tr: { uk: "Буря потопила човен.", es: "La tormenta hundió el bote.", pt: "A tempestade afundou o barco.", fr: "La tempête a fait couler le bateau.", de: "Der Sturm hat das Boot versenkt.", it: "La tempesta ha affondato la barca.", pl: "Burza zatopiła łódź.", tr: "Fırtına tekneyi batırdı.", id: "Badai menenggelamkan perahu itu.", vi: "Cơn bão đã làm chìm con thuyền." } } }
