            ex: { examples: [["She ", { target: "lay" }, " on the sofa."], ["She ", { target: "laid" }, " the book down."]] }
            tr: { uk: { examples: ["Вона лежала на дивані.", "Вона поклала книжку."] }, es: { examples: ["Estaba acostada en el sofá.", "Dejó el libro."] }, pt: { examples: ["Ela estava deitada no sofá.", "Ela pousou o livro."] }, fr: { examples: ["Elle était allongée sur le canapé.", "Elle a posé le livre."] }, de: { examples: ["Sie lag auf dem Sofa.", "Sie legte das Buch hin."] }, it: { examples: ["Era sdraiata sul divano.", "Ha appoggiato il libro."] }, pl: { examples: ["Leżała na kanapie.", "Odłożyła książkę."] }, tr: { examples: ["Kanepede uzandı.", "Kitabı bıraktı."] }, id: { examples: ["Dia berbaring di sofa.", "Dia meletakkan buku itu."] }, vi: { examples: ["Cô ấy nằm trên ghế sofa.", "Cô ấy đặt cuốn sách xuống."] } }
          - type: rule
            level: B2
            text: { en: ["A few verbs always need an object: ", { term: "bring" }, ", ", { term: "put" }, " and ", { term: "make" }, "."], uk: ["Кілька дієслів завжди потребують додатка: ", { term: "bring" }, ", ", { term: "put" }, " і ", { term: "make" }, "."], es: ["Algunos verbos siempre necesitan un objeto: ", { term: "bring" }, ", ", { term: "put" }, " y ", { term: "make" }, "."], pt: ["Alguns verbos sempre precisam de um objeto: ", { term: "bring" }, ", ", { term: "put" }, " e ", { term: "make" }, "."], fr: ["Quelques verbes exigent toujours un complément : ", { term: "bring" }, ", ", { term: "put" }, " et ", { term: "make" }, "."], de: ["Einige Verben brauchen immer ein Objekt: ", { term: "bring" }, ", ", { term: "put" }, " und ", { term: "make" }, "."], it: ["Alcuni verbi richiedono sempre un oggetto: ", { term: "bring" }, ", ", { term: "put" }, " e ", { term: "make" }, "."], pl: ["Kilka czasowników zawsze wymaga dopełnienia: ", { term: "bring" }, ", ", { term: "put" }, " i ", { term: "make" }, "."], tr: ["Bazı fiiller her zaman bir nesne gerektirir: ", { term: "bring" }, ", ", { term: "put" }, " ve ", { term: "make" }, "."], id: ["Beberapa kata kerja selalu membutuhkan objek: ", { term: "bring" }, ", ", { term: "put" }, ", dan ", { term: "make" }, "."], vi: ["Một vài động từ luôn cần tân ngữ: ", { term: "bring" }, ", ", { term: "put" }, " và ", { term: "make" }, "."] }
            ex: ["She ", { target: "brought a cake" }, "."]
            tr: { uk: "Вона принесла торт.", es: "Trajo un pastel.", pt: "Ela trouxe um bolo.", fr: "Elle a apporté un gâteau.", de: "Sie hat einen Kuchen mitgebracht.", it: "Ha portato una torta.", pl: "Przyniosła ciasto.", tr: "Bir pasta getirdi.", id: "Dia membawa kue.", vi: "Cô ấy mang đến một chiếc bánh." }
          - type: rule
            level: B2
            text: { en: ["Some verbs take their noun after a preposition: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], uk: ["Деякі дієслова беруть іменник після прийменника: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], es: ["Algunos verbos llevan su sustantivo después de una preposición: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], pt: ["Alguns verbos levam o substantivo depois de uma preposição: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], fr: ["Certains verbes placent leur nom après une préposition : ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], de: ["Manche Verben haben ihr Nomen nach einer Präposition: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], it: ["Alcuni verbi hanno il sostantivo dopo una preposizione: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], pl: ["Niektóre czasowniki mają rzeczownik po przyimku: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], tr: ["Bazı fiiller ismini bir edattan sonra alır: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], id: ["Beberapa kata kerja diikuti kata benda setelah kata depan: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."], vi: ["Một số động từ có danh từ đứng sau giới từ: ", { term: "depend on" }, ", ", { term: "listen to" }, ", ", { term: "wait for" }, "."] }
            ex: ["It ", { target: "depends on" }, " the weather."]
            tr: { uk: "Це залежить від погоди.", es: "Depende del clima.", pt: "Depende do tempo.", fr: "Cela dépend de la météo.", de: "Es hängt vom Wetter ab.", it: "Dipende dal tempo.", pl: "To zależy od pogody.", tr: "Havaya bağlı.", id: "Itu tergantung cuaca.", vi: "Điều đó tùy thuộc vào thời tiết." }

