            level: C1
            text: { en: ["More on -ing forms and infinitives: see ", { link: Gerund vs Infinitive, to: en.verbs.gerund-vs-infinitive }, "."], uk: ["Докладніше про форми на -ing та інфінітиви: див. ", { link: "Герундій чи інфінітив", to: en.verbs.gerund-vs-infinitive }, "."], es: ["Más sobre las formas en -ing y los infinitivos: consulta ", { link: "Gerundio o infinitivo", to: en.verbs.gerund-vs-infinitive }, "."], pt: ["Mais sobre as formas com -ing e os infinitivos: veja ", { link: "Gerúndio ou infinitivo", to: en.verbs.gerund-vs-infinitive }, "."], fr: ["Plus sur les formes en -ing et les infinitifs : voir ", { link: "Forme en -ing ou infinitif", to: en.verbs.gerund-vs-infinitive }, "."], de: ["Mehr zu -ing-Formen und Infinitiven: siehe ", { link: "Gerund oder Infinitiv", to: en.verbs.gerund-vs-infinitive }, "."], it: ["Altro sulle forme in -ing e sugli infiniti: vedi ", { link: "Gerundio o infinito", to: en.verbs.gerund-vs-infinitive }, "."], pl: ["Więcej o formach -ing i bezokolicznikach: zob. ", { link: "Gerund czy bezokolicznik", to: en.verbs.gerund-vs-infinitive }, "."], tr: ["-ing biçimleri ve mastarlar hakkında daha fazlası: bkz. ", { link: "Gerund mu, mastar mı", to: en.verbs.gerund-vs-infinitive }, "."], id: ["Selengkapnya tentang bentuk -ing dan infinitif: lihat ", { link: "Gerund atau infinitif", to: en.verbs.gerund-vs-infinitive }, "."], vi: ["Thêm về dạng -ing và động từ nguyên mẫu: xem ", { link: "Danh động từ hay động từ nguyên mẫu", to: en.verbs.gerund-vs-infinitive }, "."] }

