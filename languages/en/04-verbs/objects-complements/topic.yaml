          - { level: B2, form: { pattern: [{ slot: subject }, { slot: verb }, { slot: { en: indirect object, uk: "непрямий додаток", es: "objeto indirecto", pt: "objeto indireto", fr: "COI", de: "indirektes Objekt", it: "complemento indiretto", pl: "dopełnienie dalsze", tr: "dolaylı nesne", id: "objek tak langsung", vi: "tân ngữ gián tiếp" } }, { slot: { en: direct object, uk: "прямий додаток", es: "objeto directo", pt: "objeto direto", fr: "COD", de: "direktes Objekt", it: "complemento diretto", pl: "dopełnienie bliższe", tr: "doğrudan nesne", id: "objek langsung", vi: "tân ngữ trực tiếp" } }] }, kind: { en: "verb with two objects", uk: "дієслово з двома додатками", es: "verbo con dos objetos", pt: "verbo com dois objetos", fr: "verbe à deux compléments", de: "Verb mit zwei Objekten", it: "verbo con due oggetti", pl: "czasownik z dwoma dopełnieniami", tr: "iki nesneli fiil", id: "kata kerja dengan dua objek", vi: "động từ có hai tân ngữ" }, ex: ["He ", { target: "gave her a book" }, "."], tr: { uk: "Він дав їй книжку.", es: "Le dio un libro.", pt: "Ele deu um livro para ela.", fr: "Il lui a donné un livre.", de: "Er hat ihr ein Buch gegeben.", it: "Le ha dato un libro.", pl: "Dał jej książkę.", tr: "Ona bir kitap verdi.", id: "Dia memberinya sebuah buku.", vi: "Anh ấy đã đưa cho cô ấy một cuốn sách." } }
          - { level: B2, form: { pattern: [{ slot: subject }, { slot: verb }, { slot: { en: object, uk: "додаток", es: "objeto", pt: "objeto", fr: "complément", de: "Objekt", it: "complemento oggetto", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, { slot: { en: complement, uk: "доповнення", es: "complemento", pt: "complemento", fr: "attribut", de: "Prädikativ", it: "predicativo", pl: "uzupełnienie", tr: "tümleç", id: "pelengkap", vi: "bổ ngữ" } }] }, kind: { en: "verb with object and complement", uk: "дієслово з додатком і доповненням", es: "verbo con objeto y complemento", pt: "verbo com objeto e complemento", fr: "verbe avec complément et attribut", de: "Verb mit Objekt und Prädikativ", it: "verbo con oggetto e predicativo", pl: "czasownik z dopełnieniem i uzupełnieniem", tr: "nesne ve tümleç alan fiil", id: "kata kerja dengan objek dan pelengkap", vi: "động từ có tân ngữ và bổ ngữ" }, ex: { examples: [["They ", { target: "elected him president" }, "."], ["This ", { target: "makes me happy" }, "."]] }, tr: { uk: { examples: ["Вони обрали його президентом.", "Це робить мене щасливим."] }, es: { examples: ["Lo eligieron presidente.", "Esto me hace feliz."] }, pt: { examples: ["Eles o elegeram presidente.", "Isso me deixa feliz."] }, fr: { examples: ["Ils l’ont élu président.", "Cela me rend heureux."] }, de: { examples: ["Sie haben ihn zum Präsidenten gewählt.", "Das macht mich glücklich."] }, it: { examples: ["Lo hanno eletto presidente.", "Questo mi rende felice."] }, pl: { examples: ["Wybrali go na prezydenta.", "To mnie uszczęśliwia."] }, tr: { examples: ["Onu başkan seçtiler.", "Bu beni mutlu ediyor."] }, id: { examples: ["Mereka memilihnya menjadi presiden.", "Ini membuat saya bahagia."] }, vi: { examples: ["Họ đã bầu anh ấy làm chủ tịch.", "Điều này làm tôi hạnh phúc."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A complement describes or renames the subject or the object; an object is a different person or thing.", uk: "Доповнення описує підмет або додаток чи називає його інакше; додаток — це інша особа або річ.", es: "Un complemento describe o vuelve a nombrar al sujeto o al objeto; un objeto es otra persona u otra cosa.", pt: "Um complemento descreve ou renomeia o sujeito ou o objeto; um objeto é outra pessoa ou outra coisa.", fr: "Un attribut décrit ou renomme le sujet ou le complément d’objet ; le complément d’objet désigne une autre personne ou une autre chose.", de: "Ein Prädikativ beschreibt das Subjekt oder das Objekt oder benennt es neu; ein Objekt ist eine andere Person oder Sache.", it: "Un predicativo descrive o ridenomina il soggetto o l'oggetto; un oggetto è un'altra persona o un'altra cosa.", pl: "Uzupełnienie opisuje podmiot lub dopełnienie albo nazywa je inaczej; dopełnienie to inna osoba lub rzecz.", tr: "Tümleç, özneyi ya da nesneyi tanımlar veya ona yeni bir ad verir; nesne ise başka bir kişi ya da şeydir.", id: "Pelengkap menggambarkan atau menamai ulang subjek atau objek; objek adalah orang atau benda yang berbeda.", vi: "Bổ ngữ miêu tả hoặc gọi lại tên của chủ ngữ hoặc tân ngữ; tân ngữ là một người hoặc vật khác." }
            ex: { examples: [["She became ", { target: "a doctor" }, "."], ["She called ", { target: "a doctor" }, "."]] }
            tr: { uk: { examples: ["Вона стала лікаркою.", "Вона викликала лікаря."] }, es: { examples: ["Se hizo doctora.", "Llamó a un doctor."] }, pt: { examples: ["Ela se tornou médica.", "Ela chamou um médico."] }, fr: { examples: ["Elle est devenue médecin.", "Elle a appelé un médecin."] }, de: { examples: ["Sie wurde Ärztin.", "Sie hat einen Arzt gerufen."] }, it: { examples: ["È diventata medico.", "Ha chiamato un medico."] }, pl: { examples: ["Została lekarką.", "Wezwała lekarza."] }, tr: { examples: ["Doktor oldu.", "Bir doktor çağırdı."] }, id: { examples: ["Dia menjadi dokter.", "Dia memanggil dokter."] }, vi: { examples: ["Cô ấy trở thành bác sĩ.", "Cô ấy đã gọi bác sĩ."] } }
          - type: note
            level: B2
            text: { en: ["The most common linking verb is ", { term: "be" }, ": see ", { link: To be, to: en.verbs.to-be }, "."], uk: ["Найчастіша зв’язка — ", { term: "be" }, ": див. ", { link: "Дієслово to be", to: en.verbs.to-be }, "."], es: ["El verbo copulativo más común es ", { term: "be" }, ": consulta ", { link: "El verbo to be", to: en.verbs.to-be }, "."], pt: ["O verbo de ligação mais comum é ", { term: "be" }, ": veja ", { link: "O verbo to be", to: en.verbs.to-be }, "."], fr: ["Le verbe attributif le plus courant est ", { term: "be" }, " : voir ", { link: "Le verbe to be", to: en.verbs.to-be }, "."], de: ["Das häufigste Kopulaverb ist ", { term: "be" }, ": siehe ", { link: "Das Verb to be", to: en.verbs.to-be }, "."], it: ["Il verbo copulativo più comune è ", { term: "be" }, ": vedi ", { link: "Il verbo to be", to: en.verbs.to-be }, "."], pl: ["Najczęstszy czasownik łącznikowy to ", { term: "be" }, ": zob. ", { link: "Czasownik to be", to: en.verbs.to-be }, "."], tr: ["En yaygın bağlayıcı fiil ", { term: "be" }, " fiilidir: bkz. ", { link: "to be fiili", to: en.verbs.to-be }, "."], id: ["Kata kerja penghubung yang paling umum adalah ", { term: "be" }, ": lihat ", { link: "Kata kerja to be", to: en.verbs.to-be }, "."], vi: ["Động từ nối phổ biến nhất là ", { term: "be" }, ": xem ", { link: "Động từ to be", to: en.verbs.to-be }, "."] }

  - title: { en: "Form: two objects", uk: "Форма: два додатки", es: "Forma: dos objetos", pt: "Forma: dois objetos", fr: "Forme : deux compléments", de: "Form: zwei Objekte", it: "Forma: due oggetti", pl: "Forma: dwa dopełnienia", tr: "Biçim: iki nesne", id: "Bentuk: dua objek", vi: "Dạng: hai tân ngữ" }
    role: form
