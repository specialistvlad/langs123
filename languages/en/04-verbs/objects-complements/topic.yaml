          - { level: B2, verbs: "say, announce, mention, report", ex: ["They ", { target: "announced the news to everyone" }, "."], tr: { uk: "Вони оголосили новину всім.", es: "Anunciaron la noticia a todos.", pt: "Eles anunciaram a notícia a todos.", fr: "Ils ont annoncé la nouvelle à tout le monde.", de: "Sie haben allen die Neuigkeit verkündet.", it: "Hanno annunciato la notizia a tutti.", pl: "Ogłosili nowinę wszystkim.", tr: "Haberi herkese duyurdular.", id: "Mereka mengumumkan kabar itu kepada semua orang.", vi: "Họ đã thông báo tin này cho mọi người." } }
          - { level: B2, verbs: "introduce", ex: ["Let me ", { target: "introduce my sister to you" }, "."], tr: { uk: "Дозволь познайомити тебе з моєю сестрою.", es: "Permíteme presentarte a mi hermana.", pt: "Deixe-me apresentar minha irmã a você.", fr: "Laisse-moi te présenter ma sœur.", de: "Lass mich dir meine Schwester vorstellen.", it: "Lascia che ti presenti mia sorella.", pl: "Pozwól, że przedstawię ci moją siostrę.", tr: "Sana kız kardeşimi tanıştırayım.", id: "Biarkan saya memperkenalkan saudara perempuan saya kepadamu.", vi: "Để tôi giới thiệu em gái tôi với bạn." } }
      - type: list
        items:
