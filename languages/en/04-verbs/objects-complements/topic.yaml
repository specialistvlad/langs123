            text: { en: [{ term: "make" }, " also takes a noun complement."], uk: [{ term: "make" }, " бере також іменник як доповнення."], es: [{ term: "make" }, " también lleva un sustantivo como complemento."], pt: [{ term: "make" }, " também leva um substantivo como complemento."], fr: [{ term: "make" }, " peut aussi avoir un nom comme attribut."], de: [{ term: "make" }, " hat auch ein Nomen als Prädikativ bei sich."], it: [{ term: "make" }, " regge anche un sostantivo come predicativo."], pl: [{ term: "make" }, " przyjmuje też rzeczownik jako uzupełnienie."], tr: [{ term: "make" }, " tümleç olarak bir isim de alır."], id: [{ term: "make" }, " juga dapat diikuti kata benda sebagai pelengkap."], vi: [{ term: "make" }, " cũng đi với danh từ làm bổ ngữ."] }
