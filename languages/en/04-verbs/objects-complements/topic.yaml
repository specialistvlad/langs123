          - { key: prep, label: { en: With, uk: "З прийменником", es: "Con", pt: "Com", fr: "Avec", de: "Mit", it: "Con", pl: "Z przyimkiem", tr: "Edat", id: "Dengan", vi: "Đi với" } }
          - { key: verbs, label: { en: Verbs, uk: "Дієслова", es: "Verbos", pt: "Verbos", fr: "Verbes", de: "Verben", it: "Verbi", pl: "Czasowniki", tr: "Fiiller", id: "Kata kerja", vi: "Động từ" } }
          - { key: first, label: { en: Person first, uk: "Особа першою", es: "Persona primero", pt: "Pessoa primeiro", fr: "Personne en premier", de: "Person zuerst", it: "Persona prima", pl: "Osoba na początku", tr: "Kişi başta", id: "Orang di depan", vi: "Người đứng trước" } }
          - { key: last, label: { en: Person last, uk: "Особа останньою", es: "Persona al final", pt: "Pessoa por último", fr: "Personne en dernier", de: "Person zuletzt", it: "Persona per ultima", pl: "Osoba na końcu", tr: "Kişi sonda", id: "Orang di belakang", vi: "Người đứng cuối" } }
        rows:
          - { level: B2, prep: { term: "to" }, verbs: "give, send, show, lend, offer, pay, tell, teach, bring, sell", first: { ex: ["She ", { target: "sent him a card" }, "."], tr: { uk: "Вона надіслала йому листівку.", es: "Ella le envió una tarjeta.", pt: "Ela enviou um cartão para ele.", fr: "Elle lui a envoyé une carte.", de: "Sie hat ihm eine Karte geschickt.", it: "Gli ha mandato un biglietto.", pl: "Wysłała mu kartkę.", tr: "Ona bir kart gönderdi.", id: "Dia mengiriminya sebuah kartu.", vi: "Cô ấy đã gửi cho anh ấy một tấm thiệp." } }, last: { ex: ["She ", { target: "sent a card to him" }, "."], tr: { uk: "Вона надіслала йому листівку.", es: "Ella le envió una tarjeta.", pt: "Ela enviou um cartão para ele.", fr: "Elle lui a envoyé une carte.", de: "Sie hat ihm eine Karte geschickt.", it: "Gli ha mandato un biglietto.", pl: "Wysłała mu kartkę.", tr: "Ona bir kart gönderdi.", id: "Dia mengirim kartu kepadanya.", vi: "Cô ấy đã gửi một tấm thiệp cho anh ấy." } } }
          - { level: B2, prep: { term: "for" }, verbs: "buy, make, cook, find, get, save, order", first: { ex: ["He ", { target: "made her a cake" }, "."], tr: { uk: "Він спік їй торт.", es: "Él le hizo un pastel.", pt: "Ele fez um bolo para ela.", fr: "Il lui a fait un gâteau.", de: "Er hat ihr einen Kuchen gebacken.", it: "Le ha fatto una torta.", pl: "Upiekł jej ciasto.", tr: "Ona bir pasta yaptı.", id: "Dia membuatkannya kue.", vi: "Anh ấy làm cho cô ấy một chiếc bánh." } }, last: { ex: ["He ", { target: "made a cake for her" }, "."], tr: { uk: "Він спік для неї торт.", es: "Él le hizo un pastel.", pt: "Ele fez um bolo para ela.", fr: "Il lui a fait un gâteau.", de: "Er hat einen Kuchen für sie gebacken.", it: "Le ha fatto una torta.", pl: "Upiekł dla niej ciasto.", tr: "Onun için bir pasta yaptı.", id: "Dia membuat kue untuknya.", vi: "Anh ấy làm một chiếc bánh cho cô ấy." } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["When the thing is a pronoun, the person follows it with ", { term: "to" }, " or ", { term: "for" }, "."], uk: ["Коли річ виражена займенником, особа стоїть після нього з ", { term: "to" }, " або ", { term: "for" }, "."], es: ["Cuando la cosa es un pronombre, la persona va después con ", { term: "to" }, " o ", { term: "for" }, "."], pt: ["Quando a coisa é um pronome, a pessoa vem depois dele com ", { term: "to" }, " ou ", { term: "for" }, "."], fr: ["Quand la chose est un pronom, la personne vient après avec ", { term: "to" }, " ou ", { term: "for" }, "."], de: ["Ist die Sache ein Pronomen, folgt die Person danach mit ", { term: "to" }, " oder ", { term: "for" }, "."], it: ["Quando la cosa è un pronome, la persona viene dopo con ", { term: "to" }, " o ", { term: "for" }, "."], pl: ["Gdy rzecz jest zaimkiem, osoba następuje po niej z ", { term: "to" }, " lub ", { term: "for" }, "."], tr: ["Şey bir zamir olduğunda kişi, ", { term: "to" }, " veya ", { term: "for" }, " ile onun arkasından gelir."], id: ["Jika bendanya berupa kata ganti, orangnya mengikutinya dengan ", { term: "to" }, " atau ", { term: "for" }, "."], vi: ["Khi vật là đại từ, người đứng sau nó với ", { term: "to" }, " hoặc ", { term: "for" }, "."] }
            ex: { examples: [["She gave ", { target: "it to him" }, "."], ["I bought ", { target: "them for her" }, "."]] }
            tr: { uk: { examples: ["Вона дала це йому.", "Я купив їх для неї."] }, es: { examples: ["Se lo dio.", "Se los compré."] }, pt: { examples: ["Ela deu isso para ele.", "Eu os comprei para ela."] }, fr: { examples: ["Elle le lui a donné.", "Je les lui ai achetés."] }, de: { examples: ["Sie hat es ihm gegeben.", "Ich habe sie für sie gekauft."] }, it: { examples: ["Glielo ha dato.", "Gliele ho comprate."] }, pl: { examples: ["Dała mu to.", "Kupiłem je dla niej."] }, tr: { examples: ["Onu ona verdi.", "Onları onun için aldım."] }, id: { examples: ["Dia memberikannya kepadanya.", "Saya membelikan semuanya untuknya."] }, vi: { examples: ["Cô ấy đã đưa nó cho anh ấy.", "Tôi đã mua chúng cho cô ấy."] } }
          - type: rule
            level: B2
            text: { en: "The longer or newer object comes last.", uk: "Довший додаток або додаток із новою інформацією стоїть останнім.", es: "El objeto más largo, o el que trae información nueva, va al final.", pt: "O objeto mais longo, ou o que traz informação nova, vem por último.", fr: "Le complément le plus long, ou celui qui apporte l’information nouvelle, vient en dernier.", de: "Das längere Objekt oder das mit der neuen Information steht zuletzt.", it: "L'oggetto più lungo, o quello con l'informazione nuova, viene per ultimo.", pl: "Dłuższe dopełnienie lub to z nową informacją stoi na końcu.", tr: "Daha uzun olan ya da yeni bilgi veren nesne sona gelir.", id: "Objek yang lebih panjang atau yang memuat informasi baru ditempatkan terakhir.", vi: "Tân ngữ dài hơn hoặc mang thông tin mới đứng cuối." }
            ex: { examples: [["She gave ", { target: "him" }, " the letter."], ["She gave the letter ", { target: "to the tall man by the door" }, "."]] }
            tr: { uk: { examples: ["Вона дала йому листа.", "Вона дала листа високому чоловікові біля дверей."] }, es: { examples: ["Le dio la carta.", "Le dio la carta al hombre alto que estaba junto a la puerta."] }, pt: { examples: ["Ela deu a carta para ele.", "Ela deu a carta ao homem alto perto da porta."] }, fr: { examples: ["Elle lui a donné la lettre.", "Elle a donné la lettre à l’homme grand qui se tenait près de la porte."] }, de: { examples: ["Sie hat ihm den Brief gegeben.", "Sie gab den Brief dem großen Mann an der Tür."] }, it: { examples: ["Gli ha dato la lettera.", "Ha dato la lettera all'uomo alto vicino alla porta."] }, pl: { examples: ["Dała mu list.", "Dała list wysokiemu mężczyźnie przy drzwiach."] }, tr: { examples: ["Ona mektubu verdi.", "Mektubu kapının yanındaki uzun boylu adama verdi."] }, id: { examples: ["Dia memberinya surat itu.", "Dia memberikan surat itu kepada pria tinggi di dekat pintu."] }, vi: { examples: ["Cô ấy đã đưa cho anh ấy bức thư.", "Cô ấy đã đưa bức thư cho người đàn ông cao đứng cạnh cửa."] } }

