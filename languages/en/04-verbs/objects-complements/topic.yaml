            text: { en: "In the way construction, the possessive matches the subject.", uk: "У конструкції з way присвійний займенник відповідає підмету.", es: "En la construcción con way, el posesivo concuerda con el sujeto.", pt: "Na construção com way, o possessivo concorda com o sujeito.", fr: "Dans la construction avec way, le possessif correspond au sujet.", de: "In der way-Konstruktion richtet sich der Possessivbegleiter nach dem Subjekt.", it: "Nella costruzione con way, il possessivo corrisponde al soggetto.", pl: "W konstrukcji z way zaimek dzierżawczy odpowiada podmiotowi.", tr: "way yapısında iyelik, özneye uyar.", id: "Dalam konstruksi way, kata ganti kepemilikan sesuai dengan subjek.", vi: "Trong cấu trúc với way, tính từ sở hữu khớp với chủ ngữ." }
