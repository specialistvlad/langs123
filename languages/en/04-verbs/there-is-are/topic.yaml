title: { en: There Is and There Are, uk: There is і there are, es: There is y there are, pt: "There is e there are", fr: "There is et there are", de: "There is und there are", it: "There is e there are", pl: "There is i there are", tr: "There is ve there are", id: "There is dan there are", vi: "There is và there are" }
summary:
  lead:
    en: [{ term: There is }, " and ", { term: there are }, " say that something exists or is in a place, with ", { alternatives: [{ term: a }, { term: some }, { term: any }, numbers] }, "."]
    uk: [{ term: There is }, " і ", { term: there are }, " показують, що щось існує або є в певному місці; далі стоять ", { alternatives: [{ term: a }, { term: some }, { term: any }, "числівник"] }, "."]
    es: [{ term: There is }, " y ", { term: there are }, " indican que algo existe o está en un lugar, con ", { alternatives: [{ term: a }, { term: some }, { term: any }, "números"] }, "."]
    pt: [{ term: "There is" }, " e ", { term: "there are" }, " indicam que algo existe ou está em um lugar, com ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "números"] }, "."]
    fr: [{ term: "There is" }, " et ", { term: "there are" }, " indiquent que quelque chose existe ou se trouve quelque part, avec ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "nombres"] }, "."]
    de: [{ term: "There is" }, " und ", { term: "there are" }, " sagen, dass etwas existiert oder an einem Ort ist, mit ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "Zahlen"] }, "."]
    it: [{ term: "There is" }, " e ", { term: "there are" }, " indicano che qualcosa esiste o si trova in un luogo, con ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "numeri"] }, "."]
    pl: [{ term: "There is" }, " i ", { term: "there are" }, " informują, że coś istnieje lub jest w jakimś miejscu; dalej stoją ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "liczebnik"] }, "."]
    tr: [{ term: "There is" }, " ve ", { term: "there are" }, ", bir şeyin var olduğunu ya da bir yerde bulunduğunu belirtir; ardından ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "sayılar"] }, " gelir."]
    id: [{ term: "There is" }, " dan ", { term: "there are" }, " menyatakan bahwa sesuatu ada atau berada di suatu tempat, dengan ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "angka"] }, "."]
    vi: [{ term: "There is" }, " và ", { term: "there are" }, " cho biết vật tồn tại hoặc ở một nơi, kèm ", { alternatives: [{ term: "a" }, { term: "some" }, { term: "any" }, "số"] }, "."]
  rule:
    en: [{ term: There is }, " goes with singular and uncountable nouns, ", { term: there are }, " with plural nouns:"]
    uk: [{ term: There is }, " вживається з іменниками в однині та незлічуваними, ", { term: there are }, " — з іменниками в множині:"]
    es: [{ term: There is }, " va con sustantivos singulares e incontables, ", { term: there are }, " con sustantivos plurales:"]
    pt: [{ term: "There is" }, " vai com substantivos no singular e incontáveis, ", { term: "there are" }, " com substantivos no plural:"]
    fr: [{ term: "There is" }, " s’emploie avec les noms singuliers et indénombrables, ", { term: "there are" }, " avec les noms pluriels :"]
    de: [{ term: "There is" }, " steht bei Nomen im Singular und bei unzählbaren Nomen, ", { term: "there are" }, " bei Nomen im Plural:"]
    it: [{ term: "There is" }, " si usa con i sostantivi singolari e non numerabili, ", { term: "there are" }, " con i sostantivi plurali:"]
    pl: [{ term: "There is" }, " łączy się z rzeczownikami w liczbie pojedynczej i niepoliczalnymi, ", { term: "there are" }, " — z rzeczownikami w liczbie mnogiej:"]
    tr: [{ term: "There is" }, " tekil ve sayılamayan isimlerle, ", { term: "there are" }, " çoğul isimlerle kullanılır:"]
    id: [{ term: "There is" }, " dipakai dengan kata benda tunggal dan tak terhitung, ", { term: "there are" }, " dengan kata benda jamak:"]
    vi: [{ term: "There is" }, " đi với danh từ số ít và không đếm được, ", { term: "there are" }, " đi với danh từ số nhiều:"]
  ex: { examples: [[{ target: There is }, " a park."], [{ target: There are }, " two beds."]] }

