          - { level: B2, form: { pattern: [there is, { slot: noun }, { slot: past participle }] }, use: { en: something has happened to the noun, uk: "з іменником щось сталося", es: "algo le ha pasado al sustantivo", pt: "algo aconteceu com o substantivo", fr: "quelque chose est arrivé au nom", de: "dem Nomen ist etwas geschehen", it: "al sostantivo è successo qualcosa", pl: "z rzeczownikiem coś się stało", tr: "isme bir şey olmuştur", id: "sesuatu telah terjadi pada kata benda itu", vi: "danh từ đã chịu một tác động" }, ex: ["There was a window ", { target: broken }, "."], tr: { uk: "Було розбите вікно.", es: "Había una ventana rota.", pt: "Havia uma janela quebrada.", fr: "Il y avait une fenêtre cassée.", de: "Es gab ein zerbrochenes Fenster.", it: "C'era una finestra rotta.", pl: "Było rozbite okno.", tr: "Kırık bir pencere vardı.", id: "Ada jendela yang pecah.", vi: "Có một cái cửa sổ bị vỡ." } }

