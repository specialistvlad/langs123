          - { level: C1, form: there is believed to have been, use: { en: reports a belief about the past, uk: "передає думку про минуле", es: "transmite una creencia sobre el pasado", pt: "relata uma crença sobre o passado", fr: "rapporte une croyance sur le passé", de: "gibt eine Annahme über die Vergangenheit wieder", it: "riporta una credenza sul passato", pl: "przekazuje przekonanie o przeszłości", tr: "geçmişle ilgili bir inancı aktarır", id: "melaporkan keyakinan tentang masa lalu", vi: "thuật lại một niềm tin về quá khứ" }, ex: [{ target: There is believed to have been }, " a fire here in the 1800s."], tr: { uk: "Вважають, що тут у 1800-х роках була пожежа.", es: "Se cree que hubo un incendio aquí en el siglo XIX.", pt: "Acredita-se que houve um incêndio aqui no século XIX.", fr: "On pense qu’il y a eu un incendie ici au XIXe siècle.", de: "Man glaubt, dass es hier im 19. Jahrhundert gebrannt hat.", it: "Si crede che qui ci sia stato un incendio nell'Ottocento.", pl: "Uważa się, że w XIX wieku był tu pożar.", tr: "Burada 1800'lerde bir yangın çıktığına inanılıyor.", id: "Diyakini pernah terjadi kebakaran di sini pada tahun 1800-an.", vi: "Người ta tin rằng từng có một vụ hỏa hoạn ở đây vào những năm 1800." } }
          - { level: C1, form: { pattern: [there is no, { alternatives: [knowing, telling] }] }, use: { en: it is impossible to know, uk: "знати неможливо", es: "es imposible saberlo", pt: "é impossível saber", fr: "il est impossible de savoir", de: "es ist unmöglich zu wissen", it: "è impossibile saperlo", pl: "nie sposób tego wiedzieć", tr: "bilmek imkânsızdır", id: "mustahil untuk mengetahui", vi: "không thể biết được" }, ex: [{ target: There is no knowing }, " how long it will last."], tr: { uk: "Невідомо, скільки це триватиме.", es: "No hay manera de saber cuánto durará.", pt: "Não há como saber quanto tempo vai durar.", fr: "Impossible de savoir combien de temps cela durera.", de: "Man kann nicht wissen, wie lange es dauern wird.", it: "Non si può sapere quanto durerà.", pl: "Nie wiadomo, jak długo to potrwa.", tr: "Ne kadar süreceğini bilmek mümkün değil.", id: "Tidak ada yang tahu berapa lama ini akan berlangsung.", vi: "Không thể biết điều này sẽ kéo dài bao lâu." } }
          - { level: C1, form: there is no denying that, use: { en: it is certain that, uk: "це безсумнівно", es: "es seguro que", pt: "é certo que", fr: "il est certain que", de: "es steht fest, dass", it: "è certo che", pl: "to pewne, że", tr: "kesindir ki", id: "sudah pasti bahwa", vi: "chắc chắn rằng" }, ex: [{ target: There is no denying that }, " prices have risen."], tr: { uk: "Не можна заперечувати, що ціни зросли.", es: "No se puede negar que los precios han subido.", pt: "Não há como negar que os preços subiram.", fr: "On ne peut pas nier que les prix ont augmenté.", de: "Es lässt sich nicht leugnen, dass die Preise gestiegen sind.", it: "Non si può negare che i prezzi siano aumentati.", pl: "Nie sposób zaprzeczyć, że ceny wzrosły.", tr: "Fiyatların arttığını inkâr etmek mümkün değil.", id: "Tidak dapat disangkal bahwa harga-harga telah naik.", vi: "Không thể phủ nhận rằng giá cả đã tăng." } }

