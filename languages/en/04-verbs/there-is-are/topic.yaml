    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: there }, " is the subject. The verb ", { term: be }, " agrees with the noun that follows."]
              uk: [{ term: there }, " — підмет. Дієслово ", { term: be }, " узгоджується з іменником, що стоїть після нього."]
              es: [{ term: there }, " es el sujeto. El verbo ", { term: be }, " concuerda con el sustantivo que sigue."]
              pt: [{ term: "there" }, " é o sujeito. O verbo ", { term: "be" }, " concorda com o substantivo que vem depois."]
              fr: [{ term: "there" }, " est le sujet. Le verbe ", { term: "be" }, " s’accorde avec le nom qui suit."]
              de: [{ term: "there" }, " ist das Subjekt. Das Verb ", { term: "be" }, " richtet sich nach dem Nomen, das folgt."]
              it: [{ term: "there" }, " è il soggetto. Il verbo ", { term: "be" }, " concorda con il sostantivo che segue."]
              pl: [{ term: "there" }, " jest podmiotem. Czasownik ", { term: "be" }, " zgadza się z rzeczownikiem, który po nim następuje."]
              tr: [{ term: "there" }, " öznedir. ", { term: "be" }, " fiili, ardından gelen isme uyar."]
              id: [{ term: "there" }, " adalah subjek. Kata kerja ", { term: "be" }, " disesuaikan dengan kata benda yang mengikutinya."]
              vi: [{ term: "there" }, " là chủ ngữ. Động từ ", { term: "be" }, " hòa hợp với danh từ đứng sau."]

