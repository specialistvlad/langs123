          - { level: A1, use: { en: Describe a room or a town, uk: "Описати кімнату або місто", es: "Describir una habitación o una ciudad", pt: "Descrever um cômodo ou uma cidade", fr: "Décrire une pièce ou une ville", de: "Ein Zimmer oder eine Stadt beschreiben", it: "Descrivere una stanza o una città", pl: "Opisać pokój lub miasto", tr: "Bir odayı ya da şehri tarif etme", id: "Menggambarkan sebuah kamar atau kota", vi: "Tả một căn phòng hoặc một thị trấn" }, ex: ["There ", { target: is }, " a big park near the station."], tr: { uk: "Біля станції є великий парк.", es: "Hay un parque grande cerca de la estación.", pt: "Há um parque grande perto da estação.", fr: "Il y a un grand parc près de la gare.", de: "In der Nähe des Bahnhofs gibt es einen großen Park.", it: "C'è un grande parco vicino alla stazione.", pl: "Blisko stacji jest duży park.", tr: "İstasyonun yakınında büyük bir park var.", id: "Ada taman besar di dekat stasiun.", vi: "Gần nhà ga có một công viên lớn." } }
          - { level: A1, use: { en: Ask about places and things, uk: "Запитати про місця й речі", es: "Preguntar por lugares y cosas", pt: "Perguntar por lugares e coisas", fr: "Se renseigner sur des lieux et des choses", de: "Nach Orten und Dingen fragen", it: "Chiedere di luoghi e cose", pl: "Zapytać o miejsca i rzeczy", tr: "Yerler ve nesneler hakkında sorma", id: "Menanyakan tentang tempat dan benda", vi: "Hỏi về nơi chốn và đồ vật" }, ex: [{ target: Is there }, " a toilet here?"], tr: { uk: "Чи є тут туалет?", es: "¿Hay un baño aquí?", pt: "Há um banheiro aqui?", fr: "Y a-t-il des toilettes ici ?", de: "Gibt es hier eine Toilette?", it: "C'è un bagno qui?", pl: "Czy jest tu toaleta?", tr: "Burada tuvalet var mı?", id: "Apakah ada toilet di sini?", vi: "Ở đây có nhà vệ sinh không?" } }
