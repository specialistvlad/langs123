        rows:
          - { level: C1, form: there being, use: { en: opens a clause that gives a reason, uk: "відкриває зворот, що дає причину", es: "abre una oración que da una razón", pt: "abre uma oração que dá uma razão", fr: "ouvre une proposition qui donne une raison", de: "eröffnet einen Satz, der einen Grund nennt", it: "apre una proposizione che indica una ragione", pl: "otwiera konstrukcję podającą powód", tr: "bir neden bildiren yantümceyi başlatır", id: "membuka klausa yang menyatakan alasan", vi: "mở đầu một mệnh đề nêu lý do" }, ex: [{ target: There being }, " no objection, we went ahead."], tr: { uk: "Оскільки заперечень не було, ми продовжили.", es: "Como no hubo objeciones, seguimos adelante.", pt: "Como não houve objeção, seguimos em frente.", fr: "Comme il n’y avait pas d’objection, nous sommes allés de l’avant.", de: "Da es keine Einwände gab, machten wir weiter.", it: "Non essendoci obiezioni, siamo andati avanti.", pl: "Ponieważ nie było sprzeciwu, kontynuowaliśmy.", tr: "İtiraz olmadığı için devam ettik.", id: "Karena tidak ada keberatan, kami melanjutkan.", vi: "Vì không có ai phản đối, chúng tôi tiếp tục." } }
          - { level: C1, form: despite there being, use: { en: follows a preposition, uk: "стоїть після прийменника", es: "va después de una preposición", pt: "vem depois de uma preposição", fr: "suit une préposition", de: "steht nach einer Präposition", it: "segue una preposizione", pl: "stoi po przyimku", tr: "edatın ardından gelir", id: "mengikuti kata depan", vi: "đứng sau giới từ" }, ex: ["Despite ", { target: there being }, " no evidence, he was charged."], tr: { uk: "Попри відсутність доказів, йому висунули обвинувачення.", es: "A pesar de que no había pruebas, lo acusaron.", pt: "Apesar de não haver provas, ele foi acusado.", fr: "Bien qu’il n’y ait pas de preuves, il a été inculpé.", de: "Obwohl es keine Beweise gab, wurde er angeklagt.", it: "Pur non essendoci prove, è stato incriminato.", pl: "Mimo braku dowodów oskarżono go.", tr: "Kanıt olmamasına rağmen hakkında dava açıldı.", id: "Meskipun tidak ada bukti, dia didakwa.", vi: "Dù không có bằng chứng, anh ta vẫn bị truy tố." } }
          - { level: C1, form: the likelihood of there being, use: { en: follows a noun and of, uk: "стоїть після іменника та of", es: "va después de un sustantivo y of", pt: "vem depois de um substantivo e of", fr: "suit un nom et of", de: "steht nach einem Nomen und of", it: "segue un sostantivo e of", pl: "stoi po rzeczowniku i of", tr: "bir isimden ve of sözcüğünden sonra gelir", id: "mengikuti kata benda dan of", vi: "đứng sau danh từ và of" }, ex: ["What is the likelihood of ", { target: there being }, " a delay?"], tr: { uk: "Яка ймовірність того, що буде затримка?", es: "¿Qué probabilidad hay de que haya un retraso?", pt: "Qual é a probabilidade de haver um atraso?", fr: "Quelle est la probabilité qu’il y ait un retard ?", de: "Wie wahrscheinlich ist es, dass es eine Verspätung gibt?", it: "Qual è la probabilità che ci sia un ritardo?", pl: "Jakie jest prawdopodobieństwo, że będzie opóźnienie?", tr: "Gecikme olma olasılığı nedir?", id: "Seberapa besar kemungkinan akan ada keterlambatan?", vi: "Khả năng có sự chậm trễ là bao nhiêu?" } }
          - { level: C1, form: with there being, use: { en: adds a circumstance, uk: "додає обставину", es: "añade una circunstancia", pt: "acrescenta uma circunstância", fr: "ajoute une circonstance", de: "fügt einen Umstand hinzu", it: "aggiunge una circostanza", pl: "dodaje okoliczność", tr: "bir durum ekler", id: "menambahkan keadaan", vi: "thêm một hoàn cảnh" }, ex: ["With ", { target: there being }, " so many guests, we needed a bigger room."], tr: { uk: "Оскільки гостей було так багато, нам потрібна була більша кімната.", es: "Como había tantos invitados, necesitábamos una sala más grande.", pt: "Como havia tantos convidados, precisávamos de uma sala maior.", fr: "Comme il y avait tant d’invités, il nous fallait une salle plus grande.", de: "Da so viele Gäste da waren, brauchten wir einen größeren Raum.", it: "Essendoci così tanti ospiti, ci serviva una sala più grande.", pl: "Skoro było tylu gości, potrzebowaliśmy większej sali.", tr: "Çok fazla misafir olduğu için daha büyük bir odaya ihtiyacımız vardı.", id: "Karena ada begitu banyak tamu, kami membutuhkan ruangan yang lebih besar.", vi: "Vì có quá nhiều khách, chúng tôi cần một căn phòng lớn hơn." } }

