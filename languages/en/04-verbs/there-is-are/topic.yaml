              vi: ["Khi nói và nhắn tin dùng dạng rút gọn ", { term: "there's" }, ". ", { term: "there are" }, " không có dạng rút gọn."]
          - type: rule
            level: A1
            text:
              en: "A list takes the verb of the first noun:"
              uk: "У переліку дієслово узгоджується з першим іменником:"
              es: "En una enumeración, el verbo concuerda con el primer sustantivo:"
              pt: "Em uma enumeração, o verbo concorda com o primeiro substantivo:"
              fr: "Dans une énumération, le verbe s’accorde avec le premier nom :"
              de: "Bei einer Aufzählung richtet sich das Verb nach dem ersten Nomen:"
              it: "In un elenco il verbo concorda con il primo sostantivo:"
              pl: "W wyliczeniu czasownik zgadza się z pierwszym rzeczownikiem:"
              tr: "Sıralamada fiil ilk isme göre kullanılır:"
              id: "Dalam sebuah daftar, kata kerja mengikuti kata benda yang pertama:"
              vi: "Khi liệt kê, động từ theo danh từ đầu tiên:"
