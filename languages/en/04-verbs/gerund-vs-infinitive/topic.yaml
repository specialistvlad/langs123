          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, way: { pattern: [to, { slot: V }] }, ex: ["I went to the shop ", { target: to buy }, " milk."], tr: { uk: "Я пішов у магазин, щоб купити молока.", es: "Fui a la tienda a comprar leche.", pt: "Fui à loja para comprar leite.", fr: "Je suis allé au magasin pour acheter du lait.", de: "Ich ging in den Laden, um Milch zu kaufen.", it: "Sono andato al negozio per comprare il latte.", pl: "Poszedłem do sklepu, żeby kupić mleko.", tr: "Süt almak için markete gittim.", id: "Saya pergi ke toko untuk membeli susu.", vi: "Tôi đến cửa hàng để mua sữa." } }
          - { level: B2, way: { pattern: [in order to, { slot: V }] }, ex: ["She left early ", { target: in order to catch }, " the train."], tr: { uk: "Вона вийшла раніше, щоб устигнути на потяг.", es: "Salió temprano para alcanzar el tren.", pt: "Ela saiu cedo para pegar o trem.", fr: "Elle est partie tôt pour attraper le train.", de: "Sie ging früh los, um den Zug zu erwischen.", it: "È uscita presto per prendere il treno.", pl: "Wyszła wcześnie, żeby zdążyć na pociąg.", tr: "Trene yetişmek için erken çıktı.", id: "Dia berangkat lebih awal untuk mengejar kereta.", vi: "Cô ấy đi sớm để kịp chuyến tàu." } }
          - { level: B2, way: { pattern: [so as to, { slot: V }] }, ex: ["Speak quietly ", { target: so as to avoid }, " waking him."], tr: { uk: "Говори тихо, щоб не розбудити його.", es: "Habla en voz baja para no despertarlo.", pt: "Fale baixo para não acordá-lo.", fr: "Parle doucement pour éviter de le réveiller.", de: "Sprich leise, um ihn nicht zu wecken.", it: "Parla piano per evitare di svegliarlo.", pl: "Mów cicho, żeby go nie obudzić.", tr: "Onu uyandırmamak için sessiz konuş.", id: "Bicaralah pelan-pelan agar tidak membangunkannya.", vi: "Hãy nói khẽ để tránh đánh thức anh ấy." } }
          - { level: B2, way: { pattern: [{ alternatives: [in order not to, so as not to] }, { slot: V }] }, ex: ["We spoke quietly ", { target: so as not to wake }, " the baby."], tr: { uk: "Ми говорили тихо, щоб не розбудити дитину.", es: "Hablamos en voz baja para no despertar al bebé.", pt: "Falamos baixo para não acordar o bebê.", fr: "Nous avons parlé doucement pour ne pas réveiller le bébé.", de: "Wir sprachen leise, um das Baby nicht zu wecken.", it: "Abbiamo parlato piano per non svegliare il bambino.", pl: "Mówiliśmy cicho, żeby nie obudzić dziecka.", tr: "Bebeği uyandırmamak için sessiz konuştuk.", id: "Kami berbicara pelan agar tidak membangunkan bayi itu.", vi: "Chúng tôi nói khẽ để không đánh thức em bé." } }
          - { level: B2, way: { pattern: [for, { slot: "-ing" }] }, ex: ["This knife is ", { target: for cutting }, " bread."], tr: { uk: "Цей ніж — для нарізання хліба.", es: "Este cuchillo es para cortar pan.", pt: "Esta faca é para cortar pão.", fr: "Ce couteau sert à couper le pain.", de: "Dieses Messer ist zum Brotschneiden.", it: "Questo coltello serve per tagliare il pane.", pl: "Ten nóż służy do krojenia chleba.", tr: "Bu bıçak ekmek kesmek içindir.", id: "Pisau ini untuk memotong roti.", vi: "Con dao này dùng để cắt bánh mì." } }
      - type: list
        items:
