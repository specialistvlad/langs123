          - { level: B2, pattern: { pattern: [prefer, { slot: "-ing" }, to, { slot: "-ing" }] }, ex: ["I ", { target: prefer walking to driving }, "."], tr: { uk: "Я волію ходити пішки, ніж їздити за кермом.", es: "Prefiero caminar a conducir.", pt: "Prefiro caminhar a dirigir.", fr: "Je préfère marcher que conduire.", de: "Ich gehe lieber zu Fuß, als zu fahren.", it: "Preferisco camminare che guidare.", pl: "Wolę chodzić pieszo niż jeździć samochodem.", tr: "Yürümeyi araba sürmeye tercih ederim.", id: "Saya lebih suka berjalan kaki daripada menyetir.", vi: "Tôi thích đi bộ hơn lái xe." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["In ", { term: object to }, " and ", { term: prefer }, " X to Y, ", { term: to }, " is a preposition, so ", { term: "-ing" }, " follows."], uk: ["У ", { term: "object to" }, " і ", { term: "prefer" }, " X to Y слово ", { term: "to" }, " — прийменник, тому далі стоїть ", { term: "-ing" }, "."], es: ["En ", { term: "object to" }, " y en ", { term: "prefer" }, " X to Y, ", { term: "to" }, " es una preposición, por eso sigue ", { term: "-ing" }, "."], pt: ["Em ", { term: "object to" }, " e em ", { term: "prefer" }, " X to Y, ", { term: "to" }, " é uma preposição, por isso vem ", { term: "-ing" }, " depois."], fr: ["Dans ", { term: "object to" }, " et dans ", { term: "prefer" }, " X to Y, ", { term: "to" }, " est une préposition ; ", { term: "-ing" }, " suit donc."], de: ["In ", { term: "object to" }, " und ", { term: "prefer" }, " X to Y ist ", { term: "to" }, " eine Präposition, daher folgt ", { term: "-ing" }, "."], it: ["In ", { term: "object to" }, " e in ", { term: "prefer" }, " X to Y, ", { term: "to" }, " è una preposizione, quindi segue ", { term: "-ing" }, "."], pl: ["W ", { term: "object to" }, " i ", { term: "prefer" }, " X to Y słowo ", { term: "to" }, " jest przyimkiem, dlatego dalej stoi ", { term: "-ing" }, "."], tr: [{ term: "object to" }, " ve ", { term: "prefer" }, " X to Y yapılarında ", { term: "to" }, " bir edattır, bu yüzden ", { term: "-ing" }, " gelir."], id: ["Pada ", { term: "object to" }, " dan ", { term: "prefer" }, " X to Y, ", { term: "to" }, " adalah kata depan, sehingga ", { term: "-ing" }, " mengikutinya."], vi: ["Trong ", { term: "object to" }, " và ", { term: "prefer" }, " X to Y, ", { term: "to" }, " là giới từ, nên theo sau là ", { term: "-ing" }, "."] }

  - title: { en: Perfect and passive forms, uk: "Перфектні й пасивні форми", es: "Formas perfectas y pasivas", pt: "Formas perfeitas e passivas", fr: "Formes parfaites et passives", de: "Perfekt- und Passivformen", it: "Forme perfette e passive", pl: "Formy Perfect i bierne", tr: "Tamamlanmış ve edilgen biçimler", id: "Bentuk perfect dan pasif", vi: "Dạng hoàn thành và bị động" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: kind, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: inf, label: { en: To-infinitive, uk: "Інфінітив з to", es: "Infinitivo con to", pt: "Infinitivo com to", fr: "Infinitif avec to", de: "Infinitiv mit to", it: "Infinito con to", pl: "Bezokolicznik z to", tr: "To’lu mastar", id: "Infinitif dengan to", vi: "Nguyên thể có to" }, features: { verbform: inf } }
          - { key: ger, label: { en: "-ing form", uk: "Форма на -ing", es: "Forma en -ing", pt: "Forma com -ing", fr: "Forme en -ing", de: "-ing-Form", it: "Forma in -ing", pl: "Forma -ing", tr: "-ing biçimi", id: "Bentuk -ing", vi: "Dạng -ing" }, features: { verbform: ger } }
        rows:
          - { level: B2, features: { aspect: prf, voice: act }, kind: { en: Perfect, uk: "Перфект", es: "Perfecto", pt: "Perfeito", fr: "Parfait", de: "Perfekt", it: "Perfetto", pl: "Perfect", tr: "Tamamlanmış", id: "Perfect", vi: "Hoàn thành" }, inf: ["I'm glad ", { target: to have met }, " you."], ger: ["He admitted ", { target: having lied }, "."] }
          - { level: B2, features: { voice: pass }, kind: { en: Passive, uk: "Пасивний стан", es: "Voz pasiva", pt: "Voz passiva", fr: "Passif", de: "Passiv", it: "Forma passiva", pl: "Strona bierna", tr: "Edilgen", id: "Pasif", vi: "Bị động" }, inf: ["She wants ", { target: to be told }, "."], ger: ["I hate ", { target: being interrupted }, "."] }
          - { level: B2, features: { aspect: prf, voice: pass }, kind: { en: Perfect passive, uk: "Перфект у пасиві", es: "Perfecto en pasiva", pt: "Perfeito na passiva", fr: "Parfait passif", de: "Perfekt Passiv", it: "Perfetto passivo", pl: "Perfect w stronie biernej", tr: "Tamamlanmış edilgen", id: "Perfect pasif", vi: "Hoàn thành bị động" }, inf: ["The bridge is said ", { target: to have been built }, " in 1890."], ger: ["She denied ", { target: having been warned }, "."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The perfect form looks back: the action comes before the main verb.", uk: "Форма перфекту дивиться назад: дія відбувається раніше за головне дієслово.", es: "La forma perfecta mira hacia atrás: la acción ocurre antes del verbo principal.", pt: "A forma perfeita olha para trás: a ação vem antes do verbo principal.", fr: "La forme parfaite regarde en arrière : l’action précède le verbe principal.", de: "Die Perfektform blickt zurück: Die Handlung liegt vor dem Hauptverb.", it: "La forma perfetta guarda indietro: l'azione viene prima del verbo principale.", pl: "Forma Perfect patrzy wstecz: czynność jest wcześniejsza niż czasownik główny.", tr: "Tamamlanmış biçim geriye bakar: eylem ana fiilden önce gerçekleşir.", id: "Bentuk perfect melihat ke belakang: tindakannya terjadi sebelum kata kerja utama.", vi: "Dạng hoàn thành nhìn lại quá khứ: hành động xảy ra trước động từ chính." }
          - type: rule
            level: B2
            text: { en: ["The negative puts ", { term: not }, " first: ", { term: not to be told }, ", ", { term: not being told }, "."], uk: ["Заперечення ставить ", { term: "not" }, " на початок: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], es: ["La negación pone ", { term: "not" }, " al principio: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], pt: ["A negação coloca ", { term: "not" }, " no início: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], fr: ["La négation place ", { term: "not" }, " en premier : ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], de: ["Die Verneinung setzt ", { term: "not" }, " an den Anfang: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], it: ["La negazione mette ", { term: "not" }, " all'inizio: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], pl: ["Przeczenie stawia ", { term: "not" }, " na początku: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], tr: ["Olumsuzlukta ", { term: "not" }, " başa gelir: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], id: ["Bentuk negatif menaruh ", { term: "not" }, " di depan: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."], vi: ["Câu phủ định đặt ", { term: "not" }, " lên đầu: ", { term: "not to be told" }, ", ", { term: "not being told" }, "."] }
            ex: ["She hopes ", { target: not to be seen }, "."]
            tr: { uk: "Вона сподівається, що її не побачать.", es: "Espera que no la vean.", pt: "Ela espera não ser vista.", fr: "Elle espère ne pas être vue.", de: "Sie hofft, nicht gesehen zu werden.", it: "Spera di non essere vista.", pl: "Ma nadzieję, że nikt jej nie zobaczy.", tr: "Görülmemeyi umuyor.", id: "Dia berharap tidak terlihat.", vi: "Cô ấy hy vọng không bị nhìn thấy." }
  - title: { en: ["Form: ", { pattern: [{ slot: wh-word }, to, { slot: infinitive }] }], uk: ["Форма: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], es: ["Forma: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], pt: ["Forma: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], fr: ["Forme : ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], de: ["Form: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], it: ["Forma: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], pl: ["Forma: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], tr: ["Biçim: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], id: ["Bentuk: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }], vi: ["Dạng: ", { pattern: [{ slot: "wh-word" }, "to", { slot: "infinitive" }] }] }
    role: form
    content:
      - type: usage
        columns:
          - { key: wh, label: { en: Wh-word, uk: "Питальне слово", es: "Palabra interrogativa", pt: "Palavra interrogativa", fr: "Mot interrogatif", de: "Fragewort", it: "Parola interrogativa", pl: "Słowo pytające", tr: "Wh- sözcüğü", id: "Kata tanya", vi: "Từ để hỏi" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, wh: what, ex: ["I don't know ", { target: what to do }, "."], tr: { uk: "Я не знаю, що робити.", es: "No sé qué hacer.", pt: "Não sei o que fazer.", fr: "Je ne sais pas quoi faire.", de: "Ich weiß nicht, was ich tun soll.", it: "Non so cosa fare.", pl: "Nie wiem, co robić.", tr: "Ne yapacağımı bilmiyorum.", id: "Saya tidak tahu harus berbuat apa.", vi: "Tôi không biết phải làm gì." } }
          - { level: B2, wh: how, ex: ["Can you show me ", { target: how to use }, " it?"], tr: { uk: "Ти можеш показати мені, як цим користуватися?", es: "¿Puedes mostrarme cómo usarlo?", pt: "Você pode me mostrar como usar isso?", fr: "Peux-tu me montrer comment l’utiliser ?", de: "Kannst du mir zeigen, wie man das benutzt?", it: "Puoi mostrarmi come si usa?", pl: "Możesz mi pokazać, jak tego używać?", tr: "Bana nasıl kullanılacağını gösterebilir misin?", id: "Bisakah kamu menunjukkan cara memakainya?", vi: "Bạn có thể chỉ tôi cách dùng nó không?" } }
          - { level: B2, wh: "where, when", ex: ["Tell me ", { target: where to go }, "."], tr: { uk: "Скажи мені, куди піти.", es: "Dime adónde ir.", pt: "Me diga aonde ir.", fr: "Dis-moi où aller.", de: "Sag mir, wohin ich gehen soll.", it: "Dimmi dove andare.", pl: "Powiedz mi, dokąd iść.", tr: "Nereye gideceğimi söyle.", id: "Beri tahu saya ke mana harus pergi.", vi: "Hãy cho tôi biết đi đâu." } }
          - { level: B2, wh: "who, which", ex: ["I can't decide ", { target: which to buy }, "."], tr: { uk: "Я не можу вирішити, який купити.", es: "No puedo decidir cuál comprar.", pt: "Não consigo decidir qual comprar.", fr: "Je n’arrive pas à décider lequel acheter.", de: "Ich kann mich nicht entscheiden, welches ich kaufen soll.", it: "Non riesco a decidere quale comprare.", pl: "Nie mogę zdecydować, który kupić.", tr: "Hangisini alacağıma karar veremiyorum.", id: "Saya tidak bisa memutuskan mana yang harus dibeli.", vi: "Tôi không thể quyết định nên mua cái nào." } }
          - { level: B2, wh: whether, ex: ["She doesn't know ", { target: whether to accept }, "."], tr: { uk: "Вона не знає, прийняти пропозицію чи ні.", es: "No sabe si aceptar.", pt: "Ela não sabe se deve aceitar.", fr: "Elle ne sait pas si elle doit accepter.", de: "Sie weiß nicht, ob sie annehmen soll.", it: "Non sa se accettare.", pl: "Ona nie wie, czy przyjąć.", tr: "Kabul edip etmeyeceğini bilmiyor.", id: "Dia tidak tahu apakah harus menerimanya.", vi: "Cô ấy không biết có nên nhận lời hay không." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["These phrases follow verbs of knowing and asking: ", { term: know }, ", ", { term: ask }, ", ", { term: tell }, ", ", { term: show }, ", ", { term: decide }, ", ", { term: wonder }, "."], uk: ["Ці звороти стоять після дієслів знання й запитання: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], es: ["Estas construcciones van después de verbos de saber y preguntar: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], pt: ["Essas construções vêm depois de verbos de saber e perguntar: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], fr: ["Ces constructions suivent des verbes de savoir et de demande : ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], de: ["Diese Ausdrücke folgen auf Verben des Wissens und Fragens: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], it: ["Queste costruzioni seguono i verbi del sapere e del chiedere: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], pl: ["Te wyrażenia występują po czasownikach wiedzy i pytania: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], tr: ["Bu yapılar bilme ve sorma fiillerinden sonra gelir: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], id: ["Frasa ini mengikuti kata kerja yang berarti tahu dan bertanya: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."], vi: ["Các cụm này đi sau động từ chỉ sự biết và hỏi: ", { term: "know" }, ", ", { term: "ask" }, ", ", { term: "tell" }, ", ", { term: "show" }, ", ", { term: "decide" }, ", ", { term: "wonder" }, "."] }

  - title: { en: Purpose, uk: "Мета", es: "Finalidad", pt: "Finalidade", fr: "But", de: "Zweck", it: "Scopo", pl: "Cel", tr: "Amaç", id: "Tujuan", vi: "Mục đích" }
    role: own
