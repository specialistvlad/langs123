sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: The imperative has no subject and no tense. The verb is in the base form.
              uk: "Наказовий спосіб не має ні підмета, ні часу. Дієслово стоїть у початковій формі."
              es: "El imperativo no tiene sujeto ni tiempo. El verbo va en la forma base."
              pt: "O imperativo não tem sujeito nem tempo verbal. O verbo fica na forma base."
              fr: "L’impératif n’a ni sujet ni temps. Le verbe est à la base verbale."
              de: "Der Imperativ hat kein Subjekt und keine Zeitform. Das Verb steht in der Grundform."
              it: "L'imperativo non ha soggetto né tempo. Il verbo è alla forma base."
              pl: "Tryb rozkazujący nie ma podmiotu ani czasu. Czasownik stoi w formie podstawowej."
              tr: "Emir kipinin öznesi ve zamanı yoktur. Fiil yalın biçimdedir."
              id: "Kalimat perintah tidak punya subjek dan tidak punya tense. Kata kerjanya berbentuk dasar."
              vi: "Câu mệnh lệnh không có chủ ngữ và không có thì. Động từ ở dạng nguyên mẫu."

  - title: { en: "Form: affirmative", uk: "Форма: ствердження", es: "Forma: afirmativa", pt: "Forma: afirmativa", fr: "Forme : affirmative", de: "Form: Bejahung", it: "Forma: affermativa", pl: "Forma: twierdząca", tr: "Biçim: olumlu", id: "Bentuk: positif", vi: "Dạng: khẳng định" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, verb: { en: action verb, uk: "дієслово дії", es: "verbo de acción", pt: "verbo de ação", fr: "verbe d’action", de: "Handlungsverb", it: "verbo d'azione", pl: "czasownik oznaczający czynność", tr: "eylem fiili", id: "kata kerja tindakan", vi: "động từ chỉ hành động" }, ex: { examples: [[{ target: Sit }, " down."], [{ target: Close }, " your books."]] }, tr: { uk: { examples: ["Сідай.", "Закрийте книжки."] }, es: { examples: ["Siéntate.", "Cierren los libros."] }, pt: { examples: ["Sente-se.", "Fechem os livros."] }, fr: { examples: ["Assieds-toi.", "Fermez vos livres."] }, de: { examples: ["Setz dich.", "Schließt eure Bücher."] }, it: { examples: ["Siediti.", "Chiudete i libri."] }, pl: { examples: ["Usiądź.", "Zamknijcie książki."] }, tr: { examples: ["Otur.", "Kitaplarınızı kapatın."] }, id: { examples: ["Duduklah.", "Tutup buku kalian."] }, vi: { examples: ["Ngồi xuống.", "Đóng sách lại."] } } }
          - { level: A1, verb: be, ex: { examples: [[{ target: Be }, " quiet."], [{ target: Be }, " careful."]] }, tr: { uk: { examples: ["Тихо.", "Будь обережний."] }, es: { examples: ["Silencio.", "Ten cuidado."] }, pt: { examples: ["Fique em silêncio.", "Tenha cuidado."] }, fr: { examples: ["Silence.", "Fais attention."] }, de: { examples: ["Sei leise.", "Sei vorsichtig."] }, it: { examples: ["Fai silenzio.", "Stai attento."] }, pl: { examples: ["Bądź cicho.", "Bądź ostrożny."] }, tr: { examples: ["Sessiz ol.", "Dikkatli ol."] }, id: { examples: ["Tenanglah.", "Hati-hati."] }, vi: { examples: ["Giữ yên lặng.", "Hãy cẩn thận."] } } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The imperative is the base verb for every person:"
              uk: "Наказовий спосіб — це початкова форма дієслова для всіх осіб:"
              es: "El imperativo es la forma base del verbo para todas las personas:"
              pt: "O imperativo é a forma base do verbo para todas as pessoas:"
              fr: "L’impératif est la base verbale pour toutes les personnes :"
              de: "Der Imperativ ist die Grundform des Verbs für alle Personen:"
              it: "L'imperativo è il verbo alla forma base per tutte le persone:"
              pl: "Tryb rozkazujący to forma podstawowa czasownika dla wszystkich osób:"
              tr: "Emir kipi, tüm kişiler için yalın fiildir:"
              id: "Kalimat perintah memakai kata kerja dasar untuk semua orang:"
              vi: "Câu mệnh lệnh là động từ nguyên mẫu cho mọi ngôi:"
            ex: { examples: [[{ target: Come }, " in."], [{ target: Be }, " quiet."]] }
            tr: { uk: { examples: ["Заходь.", "Тихо."] }, es: { examples: ["Pasa.", "Silencio."] }, pt: { examples: ["Entre.", "Fique em silêncio."] }, fr: { examples: ["Entre.", "Silence."] }, de: { examples: ["Komm herein.", "Sei leise."] }, it: { examples: ["Entra.", "Fai silenzio."] }, pl: { examples: ["Wejdź.", "Bądź cicho."] }, tr: { examples: ["İçeri gel.", "Sessiz ol."] }, id: { examples: ["Masuklah.", "Tenanglah."] }, vi: { examples: ["Mời vào.", "Giữ yên lặng."] } }
          - type: rule
            level: A1
            text:
              en: ["A name or ", { term: everybody }, " opens the sentence to say who is spoken to:"]
              uk: ["Ім’я або ", { term: everybody }, " на початку речення показує, до кого звертаються:"]
              es: ["Un nombre o ", { term: everybody }, " al principio de la oración indica a quién se habla:"]
              pt: ["Um nome ou ", { term: "everybody" }, " no início da frase indica a quem se fala:"]
              fr: ["Un prénom ou ", { term: "everybody" }, " au début de la phrase indique à qui l’on s’adresse :"]
              de: ["Ein Name oder ", { term: "everybody" }, " steht am Satzanfang und zeigt, wer angesprochen wird:"]
              it: ["Un nome o ", { term: "everybody" }, " all'inizio della frase indica a chi ci si rivolge:"]
              pl: ["Imię lub ", { term: "everybody" }, " na początku zdania wskazuje, do kogo się mówi:"]
              tr: ["Başta bir ad ya da ", { term: "everybody" }, " bulunursa kime seslenildiği anlaşılır:"]
              id: ["Nama atau ", { term: "everybody" }, " di awal kalimat menunjukkan siapa yang diajak bicara:"]
              vi: ["Một cái tên hoặc ", { term: "everybody" }, " ở đầu câu cho biết đang nói với ai:"]
            ex: { examples: [[{ target: "Tom, come" }, " here."], { target: "Everybody, listen." }] }
            tr: { uk: { examples: ["Томе, іди сюди.", "Усі, слухайте."] }, es: { examples: ["Tom, ven aquí.", "Todos, escuchen."] }, pt: { examples: ["Tom, venha aqui.", "Todos, escutem."] }, fr: { examples: ["Tom, viens ici.", "Tout le monde, écoutez."] }, de: { examples: ["Tom, komm her.", "Alle herhören."] }, it: { examples: ["Tom, vieni qui.", "Tutti, ascoltate."] }, pl: { examples: ["Tom, chodź tutaj.", "Wszyscy, słuchajcie."] }, tr: { examples: ["Tom, buraya gel.", "Herkes, dinleyin."] }, id: { examples: ["Tom, kemari.", "Semuanya, dengarkan."] }, vi: { examples: ["Tom, lại đây.", "Mọi người, hãy nghe đây."] } }

  - title: { en: "Form: negative", uk: "Форма: заперечення", es: "Forma: negativa", pt: "Forma: negativa", fr: "Forme : négative", de: "Form: Verneinung", it: "Forma: negativa", pl: "Forma: przecząca", tr: "Biçim: olumsuz", id: "Bentuk: negatif", vi: "Dạng: phủ định" }
