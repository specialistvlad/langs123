            level: B2
            text: { en: [{ term: Don't you dare }, " is a strong warning."], uk: [{ term: "Don't you dare" }, " — сильне застереження."], es: [{ term: "Don't you dare" }, " es una advertencia fuerte."], pt: [{ term: "Don't you dare" }, " é um aviso forte."], fr: [{ term: "Don't you dare" }, " est un avertissement fort."], de: [{ term: "Don't you dare" }, " ist eine starke Warnung."], it: [{ term: "Don't you dare" }, " è un avvertimento forte."], pl: [{ term: "Don't you dare" }, " to mocne ostrzeżenie."], tr: [{ term: "Don't you dare" }, " güçlü bir uyarıdır."], id: [{ term: "Don't you dare" }, " adalah peringatan yang keras."], vi: [{ term: "Don't you dare" }, " là lời cảnh báo mạnh."] }
