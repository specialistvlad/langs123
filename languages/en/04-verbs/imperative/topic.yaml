summary:
  lead:
    en: ["The imperative gives instructions, directions, invitations and warnings with the base verb, ", { term: Don't }, " and ", { term: Let's }, "."]
    uk: ["Наказовий спосіб дає інструкції, вказівки, запрошення й застереження за допомогою початкової форми дієслова, ", { term: Don't }, " і ", { term: Let's }, "."]
    es: ["El imperativo da instrucciones, indicaciones, invitaciones y advertencias con la forma base del verbo, ", { term: Don't }, " y ", { term: Let's }, "."]
    pt: ["O imperativo dá instruções, indicações, convites e avisos com o verbo na forma base, ", { term: "Don't" }, " e ", { term: "Let's" }, "."]
    fr: ["L’impératif donne des instructions, des indications, des invitations et des avertissements avec la base verbale, ", { term: "Don't" }, " et ", { term: "Let's" }, "."]
    de: ["Der Imperativ gibt Anweisungen, Wegbeschreibungen, Einladungen und Warnungen mit der Grundform des Verbs, ", { term: "Don't" }, " und ", { term: "Let's" }, "."]
    it: ["L'imperativo dà istruzioni, indicazioni, inviti e avvertimenti con il verbo alla forma base, ", { term: "Don't" }, " e ", { term: "Let's" }, "."]
    pl: ["Tryb rozkazujący wyraża polecenia, wskazówki, zaproszenia i ostrzeżenia za pomocą formy podstawowej czasownika, ", { term: "Don't" }, " i ", { term: "Let's" }, "."]
    tr: ["Emir kipi, talimat, yön tarifi, davet ve uyarıları yalın fiille, ", { term: "Don't" }, " ve ", { term: "Let's" }, " ile verir."]
    id: ["Kalimat perintah dipakai untuk memberi instruksi, petunjuk arah, ajakan, dan peringatan, dengan kata kerja dasar, ", { term: "Don't" }, " dan ", { term: "Let's" }, "."]
    vi: ["Câu mệnh lệnh dùng động từ nguyên mẫu, ", { term: "Don't" }, " và ", { term: "Let's" }, " để đưa ra hướng dẫn, chỉ đường, lời mời và lời cảnh báo."]
  rule:
    en: ["The verb is the bare base form with no subject and no ", { term: to }, ":"]
    uk: ["Дієслово стоїть у початковій формі, без підмета й без ", { term: to }, ":"]
    es: ["El verbo va en la forma base, sin sujeto y sin ", { term: to }, ":"]
    pt: ["O verbo fica na forma base, sem sujeito e sem ", { term: "to" }, ":"]
    fr: ["Le verbe est à la base verbale seule, sans sujet et sans ", { term: "to" }, " :"]
    de: ["Das Verb steht in der bloßen Grundform, ohne Subjekt und ohne ", { term: "to" }, ":"]
    it: ["Il verbo è alla forma base, senza soggetto e senza ", { term: "to" }, ":"]
    pl: ["Czasownik stoi w formie podstawowej, bez podmiotu i bez ", { term: "to" }, ":"]
    tr: ["Fiil yalın biçimdedir; özne ve ", { term: "to" }, " yoktur:"]
    id: ["Kata kerjanya berbentuk dasar, tanpa subjek dan tanpa ", { term: "to" }, ":"]
    vi: ["Động từ ở dạng nguyên mẫu, không có chủ ngữ và không có ", { term: "to" }, ":"]
  ex: { examples: [[{ target: Open }, " the door."], [{ target: Don't open }, " it."], { target: Let's go. }] }

