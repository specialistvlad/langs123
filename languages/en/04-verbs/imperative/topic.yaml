              pt: [{ term: "Don't" }, " vai antes do verbo na forma base, também antes de ", { term: "be" }, "."]
              fr: [{ term: "Don't" }, " se place devant la base verbale, aussi devant ", { term: "be" }, "."]
              de: [{ term: "Don't" }, " steht vor der Grundform, auch vor ", { term: "be" }, "."]
              it: [{ term: "Don't" }, " va davanti al verbo alla forma base, anche davanti a ", { term: "be" }, "."]
              pl: [{ term: "Don't" }, " stoi przed formą podstawową czasownika, także przed ", { term: "be" }, "."]
              tr: [{ term: "Don't" }, " yalın fiilden önce gelir; ", { term: "be" }, " fiilinden önce de gelir."]
              id: [{ term: "Don't" }, " diletakkan sebelum kata kerja dasar, juga sebelum ", { term: "be" }, "."]
              vi: [{ term: "Don't" }, " đứng trước động từ nguyên mẫu, kể cả trước ", { term: "be" }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: Do not }, " is the full form. Signs and notices use it."]
              uk: [{ term: Do not }, " — повна форма. Її вживають на табличках і в оголошеннях."]
              es: [{ term: Do not }, " es la forma completa. Se usa en carteles y avisos."]
              pt: [{ term: "Do not" }, " é a forma completa. É usada em placas e avisos."]
              fr: [{ term: "Do not" }, " est la forme pleine. Les panneaux et les avis l’emploient."]
              de: [{ term: "Do not" }, " ist die Langform. Schilder und Hinweise verwenden sie."]
              it: [{ term: "Do not" }, " è la forma estesa. Si usa nei cartelli e negli avvisi."]
              pl: [{ term: "Do not" }, " to forma pełna. Używa się jej na tablicach i w ogłoszeniach."]
              tr: [{ term: "Do not" }, " tam biçimdir. Tabelalarda ve duyurularda kullanılır."]
              id: [{ term: "Do not" }, " adalah bentuk lengkap. Bentuk ini dipakai pada papan peringatan dan pengumuman."]
              vi: [{ term: "Do not" }, " là dạng đầy đủ. Biển báo và thông báo dùng dạng này."]
