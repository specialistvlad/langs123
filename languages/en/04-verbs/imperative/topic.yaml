      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A bare imperative sounds direct. ", { term: please }, " makes a request friendly."]
              uk: ["Сам наказовий спосіб звучить прямо. ", { term: please }, " робить прохання дружнім."]
              es: ["Un imperativo solo suena directo. ", { term: please }, " hace amable la petición."]
              pt: ["Um imperativo sem mais nada soa direto. ", { term: "please" }, " torna o pedido educado."]
              fr: ["Un impératif seul sonne direct. ", { term: "please" }, " rend la demande plus aimable."]
              de: ["Ein bloßer Imperativ klingt direkt. ", { term: "please" }, " macht eine Bitte freundlich."]
              it: ["Un imperativo semplice suona diretto. ", { term: "please" }, " rende gentile la richiesta."]
              pl: ["Sam tryb rozkazujący brzmi bezpośrednio. ", { term: "please" }, " sprawia, że prośba brzmi uprzejmie."]
              tr: ["Tek başına emir kipi doğrudan duyulur. ", { term: "please" }, " ricayı nazikleştirir."]
              id: ["Kalimat perintah tanpa tambahan terdengar langsung. ", { term: "please" }, " membuat permintaan terdengar ramah."]
              vi: ["Câu mệnh lệnh trần nghe khá thẳng. ", { term: "please" }, " làm lời yêu cầu lịch sự hơn."]
          - type: note
            level: A1
            text:
              en: ["Requests to strangers and in formal situations use ", { term: [Could you, { gap: true }, "?"] }, " See ", { link: Can and Could, to: en.modals.can-could }, "."]
              uk: ["У проханнях до незнайомих людей і в офіційних ситуаціях уживають ", { term: [Could you, { gap: true }, "?"] }, " Див. ", { link: "Can і could", to: en.modals.can-could }, "."]
              es: ["En peticiones a desconocidos y en situaciones formales se usa ", { term: [Could you, { gap: true }, "?"] }, " Ver ", { link: "Can y could", to: en.modals.can-could }, "."]
              pt: ["Pedidos a desconhecidos e em situações formais usam ", { term: ["Could you", { gap: true }, "?"] }, " Ver ", { link: "Can e could", to: "en.modals.can-could" }, "."]
              fr: ["Pour les demandes à des inconnus et en situation formelle, on emploie ", { term: ["Could you", { gap: true }, "?"] }, " Voir ", { link: "Can et could", to: "en.modals.can-could" }, "."]
              de: ["Bitten an Fremde und in förmlichen Situationen verwenden ", { term: ["Could you", { gap: true }, "?"] }, " Siehe ", { link: "Can und could", to: "en.modals.can-could" }, "."]
              it: ["Le richieste a sconosciuti e nelle situazioni formali usano ", { term: ["Could you", { gap: true }, "?"] }, " Vedi ", { link: "Can e could", to: "en.modals.can-could" }, "."]
              pl: ["W prośbach do nieznajomych i w sytuacjach oficjalnych używa się ", { term: ["Could you", { gap: true }, "?"] }, " Zob. ", { link: "Can i could", to: "en.modals.can-could" }, "."]
              tr: ["Yabancılara yönelik ricalarda ve resmî durumlarda ", { term: ["Could you", { gap: true }, "?"] }, " kullanılır. Bkz. ", { link: "Can ve could", to: "en.modals.can-could" }, "."]
              id: ["Permintaan kepada orang asing dan dalam situasi resmi memakai ", { term: ["Could you", { gap: true }, "?"] }, " Lihat ", { link: "Can dan could", to: "en.modals.can-could" }, "."]
              vi: ["Lời yêu cầu với người lạ và trong tình huống trang trọng dùng ", { term: ["Could you", { gap: true }, "?"] }, " Xem ", { link: "Can và Could", to: "en.modals.can-could" }, "."]

