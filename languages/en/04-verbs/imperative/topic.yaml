          - { level: A1, pattern: { pattern: [Don't be, { slot: adjective }] }, ex: [{ target: Don't be }, " late."], tr: { uk: "Не запізнюйся.", es: "No llegues tarde.", pt: "Não chegue tarde.", fr: "Ne sois pas en retard.", de: "Komm nicht zu spät.", it: "Non fare tardi.", pl: "Nie spóźniaj się.", tr: "Geç kalma.", id: "Jangan terlambat.", vi: "Đừng đến muộn." } }
          - { level: A1, pattern: { pattern: [Do not, { slot: V }] }, ex: { target: Do not enter. }, tr: { uk: "Не входити.", es: "No entrar.", pt: "Não entrar.", fr: "Ne pas entrer.", de: "Nicht betreten.", it: "Vietato entrare.", pl: "Nie wchodzić.", tr: "Girmeyin.", id: "Dilarang masuk.", vi: "Cấm vào." } }
          - { level: B2, pattern: { pattern: [Don't you dare, { slot: V }] }, ex: [{ target: Don't you dare touch }, " that!"], tr: { uk: "Не смій це чіпати!", es: "¡No te atrevas a tocar eso!", pt: "Não se atreva a tocar nisso!", fr: "Ne t’avise pas de toucher à ça !", de: "Wage es ja nicht, das anzufassen!", it: "Non osare toccarlo!", pl: "Nie waż się tego dotykać!", tr: "Sakın ona dokunma!", id: "Jangan berani-berani menyentuhnya!", vi: "Đừng có mà dám chạm vào cái đó!" } }
          - { level: B2, pattern: { pattern: [Don't be, { slot: "-ing" }] }, ex: [{ target: Don't be telling }, " everyone."], tr: { uk: "Не розповідай про це всім.", es: "No vayas contándoselo a todos.", pt: "Não saia contando para todo mundo.", fr: "Ne va pas le dire à tout le monde.", de: "Erzähl es bloß nicht überall herum.", it: "Non andare a dirlo a tutti.", pl: "Nie opowiadaj tego wszystkim.", tr: "Herkese anlatıp durma.", id: "Jangan sampai kamu menceritakannya ke semua orang.", vi: "Đừng có đi kể với mọi người." } }
          - { level: B2, pattern: { pattern: [Never, { slot: V }] }, ex: [{ target: Never give }, " your password to anyone."], tr: { uk: "Ніколи нікому не давай свій пароль.", es: "Nunca le des tu contraseña a nadie.", pt: "Nunca dê a sua senha a ninguém.", fr: "Ne donne jamais ton mot de passe à personne.", de: "Gib niemals jemandem dein Passwort.", it: "Non dare mai la tua password a nessuno.", pl: "Nigdy nikomu nie podawaj swojego hasła.", tr: "Şifreni asla kimseye verme.", id: "Jangan pernah memberikan kata sandimu kepada siapa pun.", vi: "Đừng bao giờ đưa mật khẩu của bạn cho bất kỳ ai." } }
          - { level: B2, pattern: { pattern: [No, { slot: noun }] }, ex: [{ target: No parking }, "."], tr: { uk: "Стоянка заборонена.", es: "Prohibido estacionar.", pt: "Proibido estacionar.", fr: "Stationnement interdit.", de: "Parken verboten.", it: "Divieto di sosta.", pl: "Zakaz parkowania.", tr: "Park yapılmaz.", id: "Dilarang parkir.", vi: "Cấm đỗ xe." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: Don't }, " goes before the base verb, also before ", { term: be }, "."]
              uk: [{ term: Don't }, " стоїть перед початковою формою дієслова, також перед ", { term: be }, "."]
