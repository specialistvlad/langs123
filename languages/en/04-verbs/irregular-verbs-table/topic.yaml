            text: { en: ["These forms appear in old stories, poems and set phrases such as ", { term: wrought iron }, " and ", { term: clad in black }, "."], uk: ["Ці форми трапляються в давніх оповіданнях, віршах і сталих виразах, як-от ", { term: "wrought iron" }, " і ", { term: "clad in black" }, "."], es: ["Estas formas aparecen en cuentos antiguos, poemas y expresiones fijas como ", { term: "wrought iron" }, " y ", { term: "clad in black" }, "."], pt: ["Essas formas aparecem em histórias antigas, poemas e expressões fixas como ", { term: "wrought iron" }, " e ", { term: "clad in black" }, "."], fr: ["Ces formes apparaissent dans les récits anciens, les poèmes et les expressions figées comme ", { term: "wrought iron" }, " et ", { term: "clad in black" }, "."], de: ["Diese Formen kommen in alten Geschichten, Gedichten und festen Wendungen wie ", { term: "wrought iron" }, " und ", { term: "clad in black" }, " vor."], it: ["Queste forme compaiono in storie antiche, poesie ed espressioni fisse come ", { term: "wrought iron" }, " e ", { term: "clad in black" }, "."], pl: ["Te formy występują w dawnych opowieściach, wierszach i utartych zwrotach, takich jak ", { term: "wrought iron" }, " i ", { term: "clad in black" }, "."], tr: ["Bu biçimler eski hikâyelerde, şiirlerde ve ", { term: "wrought iron" }, ", ", { term: "clad in black" }, " gibi kalıp ifadelerde görülür."], id: ["Bentuk-bentuk ini muncul dalam cerita lama, puisi, dan ungkapan tetap seperti ", { term: "wrought iron" }, " dan ", { term: "clad in black" }, "."], vi: ["Các dạng này xuất hiện trong truyện cổ, thơ và những cụm cố định như ", { term: "wrought iron" }, " và ", { term: "clad in black" }, "."] }
