title: { en: Irregular Verbs Table, uk: Таблиця неправильних дієслів, es: Tabla de verbos irregulares, pt: "Tabela de verbos irregulares", fr: "Tableau des verbes irréguliers", de: "Tabelle der unregelmäßigen Verben", it: "Tabella dei verbi irregolari", pl: "Tabela czasowników nieregularnych", tr: "Düzensiz fiiller tablosu", id: "Tabel kata kerja tidak beraturan", vi: "Bảng động từ bất quy tắc" }
summary:
  lead:
    en: "The most common irregular verbs: base form, past simple and past participle, grouped by the pattern each verb follows."
    uk: "Найуживаніші неправильні дієслова: початкова форма, 2-га форма (Past Simple) і 3-тя форма (Past Participle), згруповані за схемами."
    es: "Los verbos irregulares más comunes: forma base, pasado simple y participio pasado, agrupados según el patrón que sigue cada verbo."
    pt: "Os verbos irregulares mais comuns: forma base, passado simples e particípio passado, agrupados pelo padrão que cada verbo segue."
    fr: "Les verbes irréguliers les plus courants : base verbale, prétérit simple et participe passé, regroupés selon le schéma que suit chaque verbe."
    de: "Die häufigsten unregelmäßigen Verben: Grundform, Simple Past und Past Participle, geordnet nach dem Muster, dem jedes Verb folgt."
    it: "I verbi irregolari più comuni: forma base, past simple e participio passato, raggruppati secondo lo schema che ogni verbo segue."
    pl: "Najczęstsze czasowniki nieregularne: forma podstawowa, Past Simple i Past Participle, pogrupowane według schematów."
    tr: "En sık kullanılan düzensiz fiiller: yalın hâl, Simple Past ve Past Participle biçimleri; her fiilin izlediği kalıba göre gruplandırılmıştır."
    id: "Kata kerja tidak beraturan yang paling umum: bentuk dasar, simple past, dan past participle, dikelompokkan menurut pola yang diikuti setiap kata kerja."
    vi: "Các động từ bất quy tắc thông dụng nhất: dạng nguyên mẫu, quá khứ đơn và quá khứ phân từ, xếp theo kiểu biến đổi."
  rule:
    en: "Past simple and past participle are separate forms for many verbs:"
    uk: "У багатьох дієслів Past Simple і Past Participle — окремі форми:"
    es: "En muchos verbos, el pasado simple y el participio pasado son formas distintas:"
    pt: "Em muitos verbos, o passado simples e o particípio passado são formas diferentes:"
    fr: "Pour beaucoup de verbes, le prétérit simple et le participe passé sont deux formes distinctes :"
    de: "Bei vielen Verben sind Simple Past und Past Participle verschiedene Formen:"
    it: "In molti verbi il past simple e il participio passato sono forme distinte:"
    pl: "U wielu czasowników Past Simple i Past Participle to osobne formy:"
    tr: "Birçok fiilde Simple Past ve Past Participle ayrı biçimlerdir:"
    id: "Pada banyak kata kerja, simple past dan past participle adalah bentuk yang terpisah:"
    vi: "Ở nhiều động từ, quá khứ đơn và quá khứ phân từ là hai dạng khác nhau:"
  ex: { examples: [["I ", { target: went }, " there."], ["I have ", { target: gone }, " there."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Patrón", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Kiểu biến đổi" } }
        - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base", pt: "Forma base", fr: "Base verbale", de: "Grundform", it: "Forma base", pl: "Forma podstawowa", tr: "Yalın hâl", id: "Bentuk dasar", vi: "Dạng nguyên mẫu" }, features: { verbform: inf } }
        - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple", pt: "Passado simples", fr: "Prétérit simple", de: "Simple Past", it: "Past simple", pl: "Past Simple", tr: "Simple Past", id: "Simple Past", vi: "Quá khứ đơn" }, features: { tense: pst } }
        - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado", pt: "Particípio passado", fr: "Participe passé", de: "Past Participle", it: "Participio passato", pl: "Past Participle", tr: "Past Participle", id: "Past Participle", vi: "Quá khứ phân từ" }, features: { verbform: ptcp } }
      rows:
        - { level: A1, pattern: { en: All three forms are the same, uk: "Усі три форми однакові", es: "Las tres formas son iguales", pt: "As três formas são iguais", fr: "Les trois formes sont identiques", de: "Alle drei Formen sind gleich", it: "Le tre forme sono uguali", pl: "Wszystkie trzy formy są takie same", tr: "Üç biçim de aynı", id: "Ketiga bentuk sama", vi: "Cả ba dạng giống nhau" }, base: put, past: put, participle: put }
        - { level: A1, pattern: { alternatives: ["-ought", "-aught"] }, base: buy, past: bought, participle: bought }
        - { level: A1, pattern: { en: Past and participle end in -d, uk: "Past Simple і Past Participle закінчуються на -d", es: "El pasado y el participio terminan en -d", pt: "O passado e o particípio terminam em -d", fr: "Le prétérit et le participe se terminent en -d", de: "Simple Past und Past Participle enden auf -d", it: "Passato e participio terminano in -d", pl: "Past Simple i Past Participle kończą się na -d", tr: "Simple Past ve Past Participle -d ile biter", id: "Past dan participle berakhiran -d", vi: "Quá khứ đơn và quá khứ phân từ kết thúc bằng -d" }, base: make, past: made, participle: made }
        - { level: B1, pattern: { en: Final -d becomes -t, uk: "Кінцеве -d стає -t", es: "La -d final pasa a -t", pt: "O -d final passa a -t", fr: "Le -d final devient -t", de: "Das End-d wird zu -t", it: "La -d finale diventa -t", pl: "Końcowe -d zmienia się w -t", tr: "Sondaki -d, -t olur", id: "-d akhir menjadi -t", vi: "-d cuối chuyển thành -t" }, base: build, past: built, participle: built }
        - { level: A2, pattern: { en: "Long vowel shortens, -t added", uk: "Довгий голосний скорочується, додається -t", es: "La vocal larga se acorta y se añade -t", pt: "A vogal longa se encurta e se acrescenta -t", fr: "La voyelle longue s’abrège, -t s’ajoute", de: "Langer Vokal wird kurz, -t kommt hinzu", it: "La vocale lunga si accorcia e si aggiunge -t", pl: "Długa samogłoska skraca się, dodaje się -t", tr: "Uzun ünlü kısalır, -t eklenir", id: "Vokal panjang memendek, ditambah -t", vi: "Nguyên âm dài rút ngắn, thêm -t" }, base: keep, past: kept, participle: kept }
        - { level: A1, pattern: { en: [{ ipa: iː }, " shortens to ", { ipa: e }], uk: [{ ipa: iː }, " скорочується до ", { ipa: e }], es: [{ ipa: iː }, " se acorta a ", { ipa: e }], pt: [{ ipa: "iː" }, " se encurta para ", { ipa: "e" }], fr: [{ ipa: "iː" }, " s’abrège en ", { ipa: "e" }], de: [{ ipa: "iː" }, " wird kurz zu ", { ipa: "e" }], it: [{ ipa: "iː" }, " si accorcia in ", { ipa: "e" }], pl: [{ ipa: "iː" }, " skraca się do ", { ipa: "e" }], tr: [{ ipa: "iː" }, " sesi ", { ipa: "e" }, " olarak kısalır"], id: [{ ipa: "iː" }, " memendek menjadi ", { ipa: "e" }], vi: [{ ipa: "iː" }, " rút ngắn thành ", { ipa: "e" }] }, base: meet, past: met, participle: met }
        - { level: A1, pattern: { en: "Vowel changes, past = participle", uk: "Голосний змінюється, Past Simple = Past Participle", es: "La vocal cambia, pasado = participio", pt: "A vogal muda, passado = particípio", fr: "La voyelle change, prétérit = participe", de: "Der Vokal ändert sich, Simple Past = Past Participle", it: "La vocale cambia, passato = participio", pl: "Samogłoska się zmienia, Past Simple = Past Participle", tr: "Ünlü değişir, Simple Past = Past Participle", id: "Vokal berubah, past = participle", vi: "Nguyên âm thay đổi, quá khứ đơn = quá khứ phân từ" }, base: sit, past: sat, participle: sat }
        - { level: A1, pattern: { en: Participle = base form, uk: "Past Participle = початкова форма", es: "Participio = forma base", pt: "Particípio = forma base", fr: "Participe = base verbale", de: "Past Participle = Grundform", it: "Participio = forma base", pl: "Past Participle = forma podstawowa", tr: "Past Participle = yalın hâl", id: "Participle = bentuk dasar", vi: "Quá khứ phân từ = dạng nguyên mẫu" }, base: come, past: came, participle: come }
        - { level: A1, pattern: { mapping: [{ letter: i }, { letter: a }, { letter: u }] }, base: drink, past: drank, participle: drunk }
        - { level: A1, pattern: { en: Participle in -en, uk: "Past Participle на -en", es: "Participio en -en", pt: "Particípio em -en", fr: "Participe en -en", de: "Past Participle auf -en", it: "Participio in -en", pl: "Past Participle na -en", tr: "Past Participle -en ile biter", id: "Participle berakhiran -en", vi: "Quá khứ phân từ có đuôi -en" }, base: take, past: took, participle: taken }
        - { level: A1, pattern: { en: { alternatives: [participle in -n, "-ne"] }, uk: { alternatives: ["Past Participle на -n", "-ne"] }, es: { alternatives: ["participio en -n", "-ne"] }, pt: { alternatives: ["particípio em -n", "-ne"] }, fr: { alternatives: ["participe en -n", "-ne"] }, de: { alternatives: ["Past Participle auf -n", "-ne"] }, it: { alternatives: ["participio in -n", "-ne"] }, pl: { alternatives: ["Past Participle na -n", "-ne"] }, tr: { alternatives: ["Past Participle -n", "-ne"] }, id: { alternatives: ["participle berakhiran -n", "-ne"] }, vi: { alternatives: ["quá khứ phân từ có đuôi -n", "-ne"] } }, base: go, past: went, participle: gone }
        - { level: A1, pattern: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }, past: { en: ["finished actions: ", { term: ["I ", { target: went }, " to Madrid."] }], uk: ["завершені дії: ", { term: ["I ", { target: went }, " to Madrid."] }], es: ["acciones terminadas: ", { term: ["I ", { target: went }, " to Madrid."] }], pt: ["ações concluídas: ", { term: ["I ", { target: "went" }, " to Madrid."] }], fr: ["actions terminées : ", { term: ["I ", { target: "went" }, " to Madrid."] }], de: ["abgeschlossene Handlungen: ", { term: ["I ", { target: "went" }, " to Madrid."] }], it: ["azioni concluse: ", { term: ["I ", { target: "went" }, " to Madrid."] }], pl: ["czynności zakończone: ", { term: ["I ", { target: "went" }, " to Madrid."] }], tr: ["tamamlanmış eylemler: ", { term: ["I ", { target: "went" }, " to Madrid."] }], id: ["tindakan yang sudah selesai: ", { term: ["I ", { target: "went" }, " to Madrid."] }], vi: ["hành động đã kết thúc: ", { term: ["I ", { target: "went" }, " to Madrid."] }] }, participle: { en: ["after ", { term: have }, ": ", { term: ["I have ", { target: gone }, " there."] }], uk: ["після ", { term: have }, ": ", { term: ["I have ", { target: gone }, " there."] }], es: ["después de ", { term: have }, ": ", { term: ["I have ", { target: gone }, " there."] }], pt: ["depois de ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }], fr: ["après ", { term: "have" }, " : ", { term: ["I have ", { target: "gone" }, " there."] }], de: ["nach ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }], it: ["dopo ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }], pl: ["po ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }], tr: [{ term: "have" }, " sonrasında: ", { term: ["I have ", { target: "gone" }, " there."] }], id: ["setelah ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }], vi: ["sau ", { term: "have" }, ": ", { term: ["I have ", { target: "gone" }, " there."] }] } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: ["The ", { term: past simple }, " is used for finished actions. See ", { link: Past Simple, to: en.tenses.simple-tenses }, "."]
              uk: ["2-гу форму (", { term: past simple }, ") вживають для завершених дій. Див. ", { link: "Past Simple", to: en.tenses.simple-tenses }, "."]
              es: ["El pasado simple (", { term: past simple }, ") se usa para acciones terminadas. Ver ", { link: "Pasado simple", to: en.tenses.simple-tenses }, "."]
              pt: ["O passado simples (", { term: "past simple" }, ") é usado para ações concluídas. Ver ", { link: "Passado simples", to: "en.tenses.simple-tenses" }, "."]
              fr: ["Le prétérit simple (", { term: "past simple" }, ") s’emploie pour les actions terminées. Voir ", { link: "Prétérit simple", to: "en.tenses.simple-tenses" }, "."]
              de: ["Das Simple Past (", { term: "past simple" }, ") steht für abgeschlossene Handlungen. Siehe ", { link: "Simple Past", to: "en.tenses.simple-tenses" }, "."]
              it: ["Il ", { term: "past simple" }, " si usa per le azioni concluse. Vedi ", { link: "Past simple", to: "en.tenses.simple-tenses" }, "."]
              pl: ["Forma ", { term: "past simple" }, " służy do opisu czynności zakończonych. Zob. ", { link: "Past Simple", to: "en.tenses.simple-tenses" }, "."]
              tr: [{ term: "past simple" }, " tamamlanmış eylemler için kullanılır. Bkz. ", { link: "Simple Past", to: "en.tenses.simple-tenses" }, "."]
              id: ["Bentuk ", { term: "past simple" }, " dipakai untuk tindakan yang sudah selesai. Lihat ", { link: "Simple Past", to: "en.tenses.simple-tenses" }, "."]
              vi: ["Quá khứ đơn (", { term: "past simple" }, ") dùng cho hành động đã kết thúc. Xem ", { link: "Quá khứ đơn", to: "en.tenses.simple-tenses" }, "."]
          - type: note
            level: A1
            text:
              en: ["The ", { term: past participle }, " is used after ", { term: have }, " in the present perfect. See ", { link: Present Perfect, to: en.tenses.perfect-tenses }, "."]
              uk: ["3-тю форму (", { term: past participle }, ") вживають після ", { term: have }, " в Present Perfect. Див. ", { link: "Present Perfect", to: en.tenses.perfect-tenses }, "."]
              es: ["El participio pasado (", { term: past participle }, ") se usa después de ", { term: have }, " en el presente perfecto. Ver ", { link: "Presente perfecto", to: en.tenses.perfect-tenses }, "."]
              pt: ["O particípio passado (", { term: "past participle" }, ") é usado depois de ", { term: "have" }, " no presente perfeito. Ver ", { link: "Presente perfeito", to: "en.tenses.perfect-tenses" }, "."]
              fr: ["Le participe passé (", { term: "past participle" }, ") s’emploie après ", { term: "have" }, " au present perfect. Voir ", { link: "Present perfect", to: "en.tenses.perfect-tenses" }, "."]
              de: ["Das Past Participle (", { term: "past participle" }, ") steht nach ", { term: "have" }, " im Present Perfect. Siehe ", { link: "Present Perfect", to: "en.tenses.perfect-tenses" }, "."]
              it: ["Il participio passato (", { term: "past participle" }, ") si usa dopo ", { term: "have" }, " nel present perfect. Vedi ", { link: "Present perfect", to: "en.tenses.perfect-tenses" }, "."]
              pl: ["Forma ", { term: "past participle" }, " występuje po ", { term: "have" }, " w czasie Present Perfect. Zob. ", { link: "Present Perfect", to: "en.tenses.perfect-tenses" }, "."]
              tr: [{ term: "past participle" }, ", Present Perfect zamanında ", { term: "have" }, " sonrasında kullanılır. Bkz. ", { link: "Present Perfect", to: "en.tenses.perfect-tenses" }, "."]
              id: ["Bentuk ", { term: "past participle" }, " dipakai setelah ", { term: "have" }, " dalam present perfect. Lihat ", { link: "Present Perfect", to: "en.tenses.perfect-tenses" }, "."]
              vi: ["Quá khứ phân từ (", { term: "past participle" }, ") dùng sau ", { term: "have" }, " trong thì hiện tại hoàn thành. Xem ", { link: "Hiện tại hoàn thành", to: "en.tenses.perfect-tenses" }, "."]
          - type: rule
            level: A1
            text:
              en: ["Regular verbs add ", { term: "-ed" }, " to both forms: ", { term: work }, " – ", { term: worked }, " – ", { term: worked }, "."]
              uk: ["Правильні дієслова додають ", { term: "-ed" }, " до обох форм: ", { term: work }, " – ", { term: worked }, " – ", { term: worked }, "."]
              es: ["Los verbos regulares añaden ", { term: "-ed" }, " a las dos formas: ", { term: work }, " – ", { term: worked }, " – ", { term: worked }, "."]
              pt: ["Os verbos regulares acrescentam ", { term: "-ed" }, " às duas formas: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              fr: ["Les verbes réguliers ajoutent ", { term: "-ed" }, " aux deux formes : ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              de: ["Regelmäßige Verben hängen an beide Formen ", { term: "-ed" }, " an: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              it: ["I verbi regolari aggiungono ", { term: "-ed" }, " a entrambe le forme: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              pl: ["Czasowniki regularne dodają ", { term: "-ed" }, " do obu form: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              tr: ["Düzenli fiiller her iki biçime de ", { term: "-ed" }, " ekler: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              id: ["Kata kerja beraturan menambahkan ", { term: "-ed" }, " pada kedua bentuk: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
              vi: ["Động từ có quy tắc thêm ", { term: "-ed" }, " vào cả hai dạng: ", { term: "work" }, " – ", { term: "worked" }, " – ", { term: "worked" }, "."]
          - type: rule
            level: A1
            text:
              en: "The Level column shows when a verb is usually met: A1 first, B1 last."
              uk: "Колонка «Рівень» показує, коли дієслово зазвичай трапляється: спочатку A1, наприкінці B1."
              es: "La columna «Nivel» muestra cuándo se suele encontrar un verbo: primero A1 y al final B1."
              pt: "A coluna “Nível” mostra quando um verbo costuma aparecer: primeiro A1 e, por último, B1."
              fr: "La colonne « Niveau » indique quand on rencontre généralement un verbe : A1 en premier, B1 en dernier."
              de: "Die Spalte „Niveau“ zeigt, wann ein Verb meist vorkommt: zuerst A1, zuletzt B1."
              it: "La colonna «Livello» indica quando di solito si incontra un verbo: prima A1, per ultimo B1."
              pl: "Kolumna „Poziom” pokazuje, kiedy czasownik zwykle się pojawia: najpierw A1, na końcu B1."
              tr: "Seviye sütunu bir fiille genellikle ne zaman karşılaşıldığını gösterir: önce A1, en son B1."
