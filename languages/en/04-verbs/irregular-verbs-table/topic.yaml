              de: [{ mapping: [{ term: "leave" }, { term: "left" }] }, " und ", { mapping: [{ term: "lose" }, { term: "lost" }] }, " ändern auch den letzten Konsonanten", ": ", { mapping: [{ ipa: "liːv" }, { ipa: "left" }] }, ", ", { mapping: [{ ipa: "luːz" }, { ipa: "lɒst" }] }, "."]
              it: [{ mapping: [{ term: "leave" }, { term: "left" }] }, " e ", { mapping: [{ term: "lose" }, { term: "lost" }] }, " cambiano anche la consonante finale", ": ", { mapping: [{ ipa: "liːv" }, { ipa: "left" }] }, ", ", { mapping: [{ ipa: "luːz" }, { ipa: "lɒst" }] }, "."]
