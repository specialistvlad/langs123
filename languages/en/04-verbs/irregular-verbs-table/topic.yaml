# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.irregular-verbs-table
lang: en
kind: reference
tags: [verbs, irregular, reference]
concepts: [irregular-verbs]
related: [en.tenses.simple-tenses, en.tenses.perfect-tenses, en.verbs.to-be, en.verbs.have-have-got, en.sentence-building.passive-voice]
status: { en: draft, uk: draft, es: draft }

title: { en: Irregular Verbs Table, uk: Таблиця неправильних дієслів, es: Tabla de verbos irregulares }
summary:
  lead:
    en: "The most common irregular verbs: base form, past simple and past participle, grouped by the pattern each verb follows."
    uk: "Найуживаніші неправильні дієслова: початкова форма, 2-га форма (Past Simple) і 3-тя форма (Past Participle), згруповані за схемами."
    es: "Los verbos irregulares más comunes: forma base, pasado simple y participio pasado, agrupados según el patrón que sigue cada verbo."
  rule:
    en: "Past simple and past participle are separate forms for many verbs:"
    uk: "У багатьох дієслів Past Simple і Past Participle — окремі форми:"
    es: "En muchos verbos, el pasado simple y el participio pasado son formas distintas:"
  ex: { examples: [["I ", { target: went }, " there."], ["I have ", { target: gone }, " there."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Patrón" } }
        - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
        - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
        - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
      rows:
        - { level: A1, pattern: { en: All three forms are the same, uk: "Усі три форми однакові", es: "Las tres formas son iguales" }, base: put, past: put, participle: put }
        - { level: A1, pattern: { alternatives: ["-ought", "-aught"] }, base: buy, past: bought, participle: bought }
        - { level: A1, pattern: { en: Past and participle end in -d, uk: "Past Simple і Past Participle закінчуються на -d", es: "El pasado y el participio terminan en -d" }, base: make, past: made, participle: made }
        - { level: B1, pattern: { en: Final -d becomes -t, uk: "Кінцеве -d стає -t", es: "La -d final pasa a -t" }, base: build, past: built, participle: built }
        - { level: A2, pattern: { en: "Long vowel shortens, -t added", uk: "Довгий голосний скорочується, додається -t", es: "La vocal larga se acorta y se añade -t" }, base: keep, past: kept, participle: kept }
        - { level: A1, pattern: { en: [{ ipa: iː }, " shortens to ", { ipa: e }], uk: [{ ipa: iː }, " скорочується до ", { ipa: e }], es: [{ ipa: iː }, " se acorta a ", { ipa: e }] }, base: meet, past: met, participle: met }
        - { level: A1, pattern: { en: "Vowel changes, past = participle", uk: "Голосний змінюється, Past Simple = Past Participle", es: "La vocal cambia, pasado = participio" }, base: sit, past: sat, participle: sat }
        - { level: A1, pattern: { en: Participle = base form, uk: "Past Participle = початкова форма", es: "Participio = forma base" }, base: come, past: came, participle: come }
        - { level: A1, pattern: { mapping: [{ letter: i }, { letter: a }, { letter: u }] }, base: drink, past: drank, participle: drunk }
        - { level: A1, pattern: { en: Participle in -en, uk: "Past Participle на -en", es: "Participio en -en" }, base: take, past: took, participle: taken }
        - { level: A1, pattern: { en: { alternatives: [participle in -n, "-ne"] }, uk: { alternatives: ["Past Participle на -n", "-ne"] }, es: { alternatives: ["participio en -n", "-ne"] } }, base: go, past: went, participle: gone }
        - { level: A1, pattern: { en: Use, uk: "Вживання", es: "Uso" }, past: { en: ["finished actions: I ", { target: went }, " to Madrid."], uk: ["завершені дії: I ", { target: went }, " to Madrid."], es: ["acciones terminadas: I ", { target: went }, " to Madrid."] }, participle: { en: ["after have: I have ", { target: gone }, " there."], uk: ["після have: I have ", { target: gone }, " there."], es: ["después de have: I have ", { target: gone }, " there."] } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: ["The ", { term: past simple }, " is used for finished actions. See ", { link: Past Simple, to: en.tenses.simple-tenses }, "."]
              uk: ["2-гу форму (", { term: past simple }, ") вживають для завершених дій. Див. ", { link: "Past Simple", to: en.tenses.simple-tenses }, "."]
              es: ["El pasado simple (", { term: past simple }, ") se usa para acciones terminadas. Ver ", { link: "Pasado simple", to: en.tenses.simple-tenses }, "."]
          - type: note
            level: A1
            text:
              en: ["The ", { term: past participle }, " is used after have in the present perfect. See ", { link: Present Perfect, to: en.tenses.perfect-tenses }, "."]
              uk: ["3-тю форму (", { term: past participle }, ") вживають після have в Present Perfect. Див. ", { link: "Present Perfect", to: en.tenses.perfect-tenses }, "."]
              es: ["El participio pasado (", { term: past participle }, ") se usa después de have en el presente perfecto. Ver ", { link: "Presente perfecto", to: en.tenses.perfect-tenses }, "."]
          - type: rule
            level: A1
            text:
              en: ["Regular verbs add ", { term: "-ed" }, " to both forms: work – worked – worked."]
              uk: ["Правильні дієслова додають ", { term: "-ed" }, " до обох форм: work – worked – worked."]
              es: ["Los verbos regulares añaden ", { term: "-ed" }, " a las dos formas: work – worked – worked."]
          - type: rule
            level: A1
            text:
              en: "The Level column shows when a verb is usually met: A1 first, B1 last."
              uk: "Колонка «Рівень» показує, коли дієслово зазвичай трапляється: спочатку A1, наприкінці B1."
              es: "La columna «Nivel» muestra cuándo se suele encontrar un verbo: primero A1 y al final B1."

  - title: { en: "Pattern: all three forms are the same", uk: "Схема: усі три форми однакові", es: "Patrón: las tres formas son iguales" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: put, past: put, participle: put }
          - { level: A2, base: cut, past: cut, participle: cut }
          - { level: A2, base: let, past: let, participle: let }
          - { level: A2, base: hit, past: hit, participle: hit }
          - { level: A2, base: shut, past: shut, participle: shut }
          - { level: A2, base: hurt, past: hurt, participle: hurt }
          - { level: A2, base: cost, past: cost, participle: cost }
          - { level: B1, base: set, past: set, participle: set }
          - { level: B1, base: spread, past: spread, participle: spread }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The three forms are the same. The sentence shows the tense:"
              uk: "Усі три форми однакові. Час видно з самого речення:"
              es: "Las tres formas son iguales. La oración indica el tiempo:"
            ex: { examples: [["I ", { target: put }, " it there."], ["I have ", { target: put }, " it there."]] }
            tr: { uk: { examples: ["Я поклав це туди.", "Я вже поклав це туди."] }, es: { examples: ["Lo puse allí.", "Lo he puesto allí."] } }

  - title: { en: ["Pattern: past and participle in ", { alternatives: ["-ought", "-aught"] }], uk: ["Схема: Past Simple і Past Participle на ", { alternatives: ["-ought", "-aught"] }], es: ["Patrón: pasado y participio en ", { alternatives: ["-ought", "-aught"] }] }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: buy, past: bought, participle: bought }
          - { level: A1, base: think, past: thought, participle: thought }
          - { level: A2, base: bring, past: brought, participle: brought }
          - { level: A2, base: catch, past: caught, participle: caught }
          - { level: A2, base: teach, past: taught, participle: taught }
          - { level: B1, base: fight, past: fought, participle: fought }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Past and participle share one form. ", { term: "-ought" }, " and ", { term: "-aught" }, " are both pronounced ", { ipa: ɔːt }, ": bought ", { ipa: bɔːt }, ", caught ", { ipa: kɔːt }, "."]
              uk: ["Past Simple і Past Participle мають однакову форму. ", { term: "-ought" }, " і ", { term: "-aught" }, " вимовляються однаково, ", { ipa: ɔːt }, ": bought ", { ipa: bɔːt }, ", caught ", { ipa: kɔːt }, "."]
              es: ["El pasado y el participio comparten una sola forma. ", { term: "-ought" }, " y ", { term: "-aught" }, " se pronuncian igual, ", { ipa: ɔːt }, ": bought ", { ipa: bɔːt }, ", caught ", { ipa: kɔːt }, "."]

  - title: { en: "Pattern: past and participle end in -d", uk: "Схема: Past Simple і Past Participle закінчуються на -d", es: "Patrón: el pasado y el participio terminan en -d" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: have, past: had, participle: had }
          - { level: A1, base: make, past: made, participle: made }
          - { level: A1, base: say, past: ["said ", { ipa: sed }], participle: ["said ", { ipa: sed }] }
          - { level: A1, base: tell, past: told, participle: told }
          - { level: A2, base: pay, past: paid, participle: paid }
          - { level: A2, base: sell, past: sold, participle: sold }
          - { level: A2, base: hear, past: ["heard ", { ipa: hɜːd }], participle: ["heard ", { ipa: hɜːd }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Past and participle share one form with ", { term: "-d" }, " at the end. The vowel or the stem changes in some verbs."]
              uk: ["Past Simple і Past Participle мають однакову форму із закінченням ", { term: "-d" }, ". У деяких дієслів змінюється голосний або основа."]
              es: ["El pasado y el participio comparten una sola forma que termina en ", { term: "-d" }, ". En algunos verbos cambia la vocal o la raíz."]
          - type: rule
            level: A1
            text:
              en: [{ term: say }, " and ", { term: hear }, " change their vowel sound: ", { mapping: [["say ", { ipa: seɪ }], ["said ", { ipa: sed }]] }, ", ", { mapping: [["hear ", { ipa: hɪə }], ["heard ", { ipa: hɜːd }]] }, "."]
              uk: [{ term: say }, " і ", { term: hear }, " змінюють голосний звук: ", { mapping: [["say ", { ipa: seɪ }], ["said ", { ipa: sed }]] }, ", ", { mapping: [["hear ", { ipa: hɪə }], ["heard ", { ipa: hɜːd }]] }, "."]
              es: [{ term: say }, " y ", { term: hear }, " cambian el sonido de la vocal: ", { mapping: [["say ", { ipa: seɪ }], ["said ", { ipa: sed }]] }, ", ", { mapping: [["hear ", { ipa: hɪə }], ["heard ", { ipa: hɜːd }]] }, "."]

  - title: { en: "Pattern: final -d becomes -t", uk: "Схема: кінцеве -d стає -t", es: "Patrón: la -d final pasa a -t" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A2, base: send, past: sent, participle: sent }
          - { level: A2, base: spend, past: spent, participle: spent }
          - { level: B1, base: build, past: built, participle: built }
          - { level: B1, base: lend, past: lent, participle: lent }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The final ", { term: "-d" }, " of the base verb changes to ", { term: "-t" }, . Past and participle share one form.]
              uk: ["Кінцеве ", { term: "-d" }, " початкової форми змінюється на ", { term: "-t" }, ". Past Simple і Past Participle мають однакову форму."]
              es: ["La ", { term: "-d" }, " final de la forma base cambia a ", { term: "-t" }, ". El pasado y el participio comparten una sola forma."]

  - title: { en: "Pattern: the long vowel shortens and -t is added", uk: "Схема: довгий голосний скорочується, додається -t", es: "Patrón: la vocal larga se acorta y se añade -t" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A2, base: feel, past: felt, participle: felt }
          - { level: A2, base: keep, past: kept, participle: kept }
          - { level: A2, base: sleep, past: slept, participle: slept }
          - { level: A2, base: leave, past: left, participle: left }
          - { level: A2, base: lose, past: lost, participle: lost }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The vowel is short in the past and the participle, and the form ends in ", { term: "-t" }, ": ", { mapping: [["keep ", { ipa: kiːp }], ["kept ", { ipa: kept }]] }, "."]
              uk: ["У Past Simple і Past Participle голосний короткий, а форма закінчується на ", { term: "-t" }, ": ", { mapping: [["keep ", { ipa: kiːp }], ["kept ", { ipa: kept }]] }, "."]
              es: ["La vocal es corta en el pasado y en el participio, y la forma termina en ", { term: "-t" }, ": ", { mapping: [["keep ", { ipa: kiːp }], ["kept ", { ipa: kept }]] }, "."]
          - type: rule
            level: A1
            text:
              en: [{ mapping: [{ term: leave }, left] }, " and ", { mapping: [{ term: lose }, lost] }, " change the final consonant as well", ": ", { mapping: [{ ipa: liːv }, { ipa: left }] }, ", ", { mapping: [{ ipa: luːz }, { ipa: lɒst }] }, "."]
              uk: [{ mapping: [{ term: leave }, left] }, " і ", { mapping: [{ term: lose }, lost] }, " змінюють також кінцевий приголосний", ": ", { mapping: [{ ipa: liːv }, { ipa: left }] }, ", ", { mapping: [{ ipa: luːz }, { ipa: lɒst }] }, "."]
              es: [{ mapping: [{ term: leave }, left] }, " y ", { mapping: [{ term: lose }, lost] }, " cambian también la consonante final", ": ", { mapping: [{ ipa: liːv }, { ipa: left }] }, ", ", { mapping: [{ ipa: luːz }, { ipa: lɒst }] }, "."]

  - title: { en: ["Pattern: the vowel ", { ipa: iː }, " shortens to ", { ipa: e }], uk: ["Схема: голосний ", { ipa: iː }, " скорочується до ", { ipa: e }], es: ["Patrón: la vocal ", { ipa: iː }, " se acorta a ", { ipa: e }] }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: meet, past: met, participle: met }
          - { level: A1, base: read, past: ["read ", { ipa: red }], participle: ["read ", { ipa: red }] }
          - { level: B1, base: lead, past: led, participle: led }
          - { level: B1, base: feed, past: fed, participle: fed }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Past and participle share one form with the short vowel ", { ipa: e }, ": ", { mapping: [["meet ", { ipa: miːt }], ["met ", { ipa: met }]] }, "."]
              uk: ["Past Simple і Past Participle мають однакову форму з коротким голосним ", { ipa: e }, ": ", { mapping: [["meet ", { ipa: miːt }], ["met ", { ipa: met }]] }, "."]
              es: ["El pasado y el participio comparten una sola forma con la vocal corta ", { ipa: e }, ": ", { mapping: [["meet ", { ipa: miːt }], ["met ", { ipa: met }]] }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: read }, " is spelled the same in all three forms: ", { ipa: riːd }, " in the base, ", { ipa: red }, " in the past and the participle."]
              uk: [{ term: read }, " пишеться однаково в усіх трьох формах: ", { ipa: riːd }, " у початковій формі, ", { ipa: red }, " у Past Simple і Past Participle."]
              es: [{ term: read }, " se escribe igual en las tres formas: ", { ipa: riːd }, " en la forma base y ", { ipa: red }, " en el pasado y el participio."]

  - title: { en: "Pattern: the vowel changes, past = participle", uk: "Схема: голосний змінюється, Past Simple = Past Participle", es: "Patrón: la vocal cambia, pasado = participio" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: sit, past: sat, participle: sat }
          - { level: A1, base: get, past: got, participle: got }
          - { level: A1, base: find, past: found, participle: found }
          - { level: A2, base: stand, past: stood, participle: stood }
          - { level: A2, base: win, past: won, participle: won }
          - { level: A2, base: understand, past: understood, participle: understood }
          - { level: B1, base: hold, past: held, participle: held }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A new vowel appears in the past simple, and the participle repeats it."
              uk: "У Past Simple з’являється новий голосний, а Past Participle повторює його."
              es: "En el pasado simple aparece una vocal nueva, y el participio la repite."
          - type: note
            level: A1
            variety: en-US
            text:
              en: ["the participle of ", { term: get }, " is ", { term: gotten }, ": I've gotten a new phone. British English keeps ", { term: got }, "."]
              uk: ["3-тя форма дієслова ", { term: get }, " — ", { term: gotten }, ": I've gotten a new phone. У британській англійській залишається ", { term: got }, "."]
              es: ["el participio de ", { term: get }, " es ", { term: gotten }, ": I've gotten a new phone. El inglés británico mantiene ", { term: got }, "."]

  - title: { en: "Pattern: participle = base form", uk: "Схема: Past Participle = початкова форма", es: "Patrón: participio = forma base" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: come, past: came, participle: come }
          - { level: A1, base: run, past: ran, participle: run }
          - { level: A2, base: become, past: became, participle: become }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: The participle equals the base verb. Only the past simple has its own form.
              uk: "Past Participle збігається з початковою формою. Лише Past Simple має власну форму."
              es: "El participio es igual a la forma base. Solo el pasado simple tiene forma propia."

  - title: { en: ["Pattern: ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }], uk: ["Схема: ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }], es: ["Patrón: ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }] }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: drink, past: drank, participle: drunk }
          - { level: A2, base: begin, past: began, participle: begun }
          - { level: A2, base: swim, past: swam, participle: swum }
          - { level: A2, base: sing, past: sang, participle: sung }
          - { level: B1, base: ring, past: rang, participle: rung }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The vowel runs ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }, ": the past takes ", { letter: a }, ", the participle takes ", { letter: u }, "."]
              uk: ["Голосний чергується за схемою ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }, ": у Past Simple з’являється ", { letter: a }, ", у Past Participle — ", { letter: u }, "."]
              es: ["La vocal sigue el orden ", { mapping: [{ letter: i }, { letter: a }, { letter: u }] }, ": el pasado toma ", { letter: a }, " y el participio toma ", { letter: u }, "."]

  - title: { en: "Pattern: participle in -en", uk: "Схема: Past Participle на -en", es: "Patrón: participio en -en" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: give, past: gave, participle: given }
          - { level: A1, base: take, past: took, participle: taken }
          - { level: A1, base: eat, past: ["ate ", { ipa: et }, " or ", { ipa: eɪt }], participle: eaten }
          - { level: A1, base: write, past: wrote, participle: written }
          - { level: A2, base: drive, past: drove, participle: driven }
          - { level: A2, base: ride, past: rode, participle: ridden }
          - { level: A2, base: break, past: broke, participle: broken }
          - { level: A2, base: speak, past: spoke, participle: spoken }
          - { level: A2, base: choose, past: chose, participle: chosen }
          - { level: A2, base: forget, past: forgot, participle: forgotten }
          - { level: A2, base: fall, past: fell, participle: fallen }
          - { level: B1, base: wake, past: woke, participle: woken }
          - { level: B1, base: steal, past: stole, participle: stolen }
          - { level: B1, base: hide, past: hid, participle: hidden }
          - { level: B1, base: freeze, past: froze, participle: frozen }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The past has its own vowel. The participle ends in ", { term: "-en" }, "."]
              uk: ["Past Simple має власний голосний. Past Participle закінчується на ", { term: "-en" }, "."]
              es: ["El pasado tiene su propia vocal. El participio termina en ", { term: "-en" }, "."]
          - type: note
            level: A1
            variety: en-US
            text:
              en: [{ term: ate }, " is ", { ipa: eɪt }, ". British English also uses ", { ipa: et }, "."]
              uk: [{ term: ate }, " вимовляється ", { ipa: eɪt }, ". У британській англійській також ", { ipa: et }, "."]
              es: [{ term: ate }, " se pronuncia ", { ipa: eɪt }, ". El inglés británico también usa ", { ipa: et }, "."]

  - title: { en: "Pattern: past in -ew, participle in -n", uk: "Схема: Past Simple на -ew, Past Participle на -n", es: "Patrón: pasado en -ew, participio en -n" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: know, past: knew, participle: known }
          - { level: A2, base: fly, past: flew, participle: flown }
          - { level: A2, base: grow, past: grew, participle: grown }
          - { level: A2, base: draw, past: drew, participle: drawn }
          - { level: B1, base: throw, past: threw, participle: thrown }
          - { level: B1, base: blow, past: blew, participle: blown }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The past ends in ", { term: "-ew" }, " and the participle ends in ", { term: "-n" }, ": ", { mapping: [know, knew, known] }, "."]
              uk: ["Past Simple закінчується на ", { term: "-ew" }, ", а Past Participle — на ", { term: "-n" }, ": ", { mapping: [know, knew, known] }, "."]
              es: ["El pasado termina en ", { term: "-ew" }, " y el participio termina en ", { term: "-n" }, ": ", { mapping: [know, knew, known] }, "."]

  - title: { en: ["Pattern: participle in ", { alternatives: ["-n", "-ne"] }, ", past has its own form"], uk: ["Схема: Past Participle на ", { alternatives: ["-n", "-ne"] }, ", Past Simple має власну форму"], es: ["Patrón: participio en ", { alternatives: ["-n", "-ne"] }, ", el pasado tiene su propia forma"] }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base form, uk: "Початкова форма", es: "Forma base" }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
          - { key: participle, label: { en: Past participle, uk: "Past Participle", es: "Participio pasado" }, features: { verbform: ptcp } }
        rows:
          - { level: A1, base: be, past: { alternatives: [was, were] }, participle: ["been ", { ipa: biːn }] }
          - { level: A1, base: do, past: did, participle: ["done ", { ipa: dʌn }] }
          - { level: A1, base: go, past: went, participle: ["gone ", { ipa: ɡɒn }] }
          - { level: A1, base: see, past: saw, participle: seen }
          - { level: A2, base: wear, past: wore, participle: worn }
          - { level: B1, base: tear, past: tore, participle: torn }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The participle ends in ", { term: "-n" }, " or ", { term: "-ne" }, . The past is a form of its own.]
              uk: ["Past Participle закінчується на ", { term: "-n" }, " або ", { term: "-ne" }, ". Past Simple — окрема форма."]
              es: ["El participio termina en ", { term: "-n" }, " o ", { term: "-ne" }, ". El pasado es una forma propia."]
          - type: rule
            level: A1
            text:
              en: [{ term: been }, " is ", { ipa: biːn }, " (", { variant: { ipa: bɪn }, variety: en-US }, "). ", { term: go }, " has two participles: ", { term: gone }, " and ", { term: been }, "."]
              uk: [{ term: been }, " вимовляється ", { ipa: biːn }, " (", { variant: { ipa: bɪn }, variety: en-US }, "). Дієслово ", { term: go }, " має дві форми Past Participle: ", { term: gone }, " і ", { term: been }, "."]
              es: [{ term: been }, " se pronuncia ", { ipa: biːn }, " (", { variant: { ipa: bɪn }, variety: en-US }, "). ", { term: go }, " tiene dos participios: ", { term: gone }, " y ", { term: been }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: gone }, " = he is away. ", { term: been }, " = he went and came back:"]
              uk: [{ term: gone }, " = він поїхав і ще не повернувся. ", { term: been }, " = він їздив і повернувся:"]
              es: [{ term: gone }, " = se fue y no ha vuelto. ", { term: been }, " = fue y volvió:"]
            ex: ["He has ", { target: been }, " to Paris."]
            tr: { uk: "Він побував у Парижі.", es: "Ha estado en París." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: I goed to Madrid., right: ["I ", { target: went }, " to Madrid."], rule: { en: "irregular verbs have their own past form, no -ed", uk: "неправильні дієслова мають власну форму Past Simple, без -ed", es: "los verbos irregulares tienen su propia forma de pasado, sin -ed" } }
          - { level: A1, wrong: She buyed a car., right: ["She ", { target: bought }, " a car."], rule: { en: { mapping: [buy, bought] }, uk: { mapping: [buy, bought] }, es: { mapping: [buy, bought] } } }
          - { level: A1, wrong: I have went there., right: ["I have ", { target: gone }, " there."], rule: { en: "after have use the participle: gone", uk: "після have — Past Participle: gone", es: "después de have se usa el participio: gone" } }
          - { level: A1, wrong: I have saw it., right: ["I have ", { target: seen }, " it."], rule: { en: "after have use the participle: seen", uk: "після have — Past Participle: seen", es: "después de have se usa el participio: seen" } }
          - { level: A1, wrong: I seen him yesterday., right: ["I ", { target: saw }, " him yesterday."], rule: { en: "the past simple takes the past form: saw", uk: "Past Simple вимагає 2-ї форми: saw", es: "el pasado simple lleva la forma de pasado: saw" } }
          - { level: A1, wrong: I have wrote a letter., right: ["I have ", { target: written }, " a letter."], rule: { en: { mapping: [write, wrote, written] }, uk: { mapping: [write, wrote, written] }, es: { mapping: [write, wrote, written] } } }
          - { level: A1, wrong: He readed the book., right: ["He ", { target: read }, " ", { ipa: red }, " the book."], rule: { en: ["read is spelled the same in all forms, the past sounds ", { ipa: red }], uk: ["read пишеться однаково в усіх формах, а в Past Simple звучить ", { ipa: red }], es: ["read se escribe igual en todas las formas, y el pasado suena ", { ipa: red }] } }
