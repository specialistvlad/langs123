          - { level: C1, form: { term: "geo-" }, meaning: { en: "earth" }, ex: { examples: [{ target: "geography" }, { target: "geology" }, { target: "geothermal" }] } }
          - { level: C1, form: { term: "hydro-" }, meaning: { en: "water" }, ex: { examples: [{ target: "hydroelectric" }, { target: "hydrogen" }, { target: "hydrofoil" }] } }
          - { level: C1, form: { term: "photo-" }, meaning: { en: "light" }, ex: { examples: [{ target: "photograph" }, { target: "photocopy" }, { target: "photosynthesis" }] } }
          - { level: C1, form: { term: "tele-" }, meaning: { en: "far, at a distance" }, ex: { examples: [{ target: "telephone" }, { target: "television" }, { target: "telescope" }] } }
          - { level: C1, form: { term: "micro-" }, meaning: { en: "very small" }, ex: { examples: [{ target: "microscope" }, { target: "microwave" }, { target: "microphone" }] } }
          - { level: C1, form: { term: "macro-" }, meaning: { en: "large, on a large scale" }, ex: { examples: [{ target: "macroeconomics" }, { target: "macronutrient" }, { target: "macroscopic" }] } }
          - { level: C1, form: { term: "mono-" }, meaning: { en: "one, single" }, ex: { examples: [{ target: "monologue" }, { target: "monotone" }, { target: "monolingual" }] } }
          - { level: C1, form: { term: "poly-" }, meaning: { en: "many" }, ex: { examples: [{ target: "polygon" }, { target: "polyglot" }, { target: "polytechnic" }] } }
          - { level: C1, form: { term: "auto-" }, meaning: { en: "self" }, ex: { examples: [{ target: "autobiography" }, { target: "automatic" }, { target: "autopilot" }] } }
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, form: { term: "-logy" }, meaning: { en: "the study of" }, ex: { examples: [{ target: "biology" }, { target: "psychology" }, { target: "technology" }] } }
          - { level: C1, form: { term: "-graphy" }, meaning: { en: "writing, drawing or recording" }, ex: { examples: [{ target: "geography" }, { target: "photography" }, { target: "biography" }] } }
          - { level: C1, form: { term: "-phobia" }, meaning: { en: "fear of" }, ex: { examples: [{ target: "claustrophobia" }, { target: "arachnophobia" }, { target: "xenophobia" }] } }
          - { level: C1, form: { term: "-cracy" }, meaning: { en: "rule by" }, ex: { examples: [{ target: "democracy" }, { target: "bureaucracy" }, { target: "aristocracy" }] } }
          - { level: C1, form: { term: "-ectomy" }, meaning: { en: "surgical removal of" }, ex: { examples: [[{ target: "appendicectomy" }, " ", { variant: { target: "appendectomy" }, variety: en-US }], { target: "tonsillectomy" }, { target: "vasectomy" }] } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A linking o joins a form that ends in a consonant to the next form." }
            ex: { mapping: [{ pattern: ["psych", "o", "logy"] }, { target: "psychology" }] }
          - type: rule
            level: C1
            text: { en: [{ alternatives: [{ term: "-ology" }, { term: "-graphy" }] }, " put the stress on the syllable before the ending."] }
            ex: { examples: [["bi", { stress: "ˈol" }, "ogy"], ["ge", { stress: "ˈog" }, "raphy"], ["psy", { stress: "ˈchol" }, "ogy"]] }

  - title: { en: "Adjectives in -ed" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, pattern: { pattern: [{ slot: noun }, { ending: ed }] }, rule: { en: "having the noun; many have no verb behind them" }, ex: { examples: [{ mapping: ["talent", { target: "talented" }] }, { mapping: ["beard", { target: "bearded" }] }, { mapping: ["wood", { target: "wooded" }] }] } }
          - { level: C1, pattern: { pattern: [{ slot: adjective }, { slot: noun }, { ending: ed }] }, rule: { en: "having that feature; a hyphen joins the parts before a noun" }, ex: { examples: [["a ", { target: "blue-eyed" }, " girl"], ["a ", { target: "kind-hearted" }, " man"], ["a ", { target: "left-handed" }, " player"]] } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The noun in the compound stays singular." }
            ex: { examples: [["a ", { target: "long-legged" }, " bird"], ["a ", { target: "two-faced" }, " friend"]] }

  - title: { en: "Compare: everyday and formal words" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: everyday, label: { en: Everyday } }
          - { key: formal, label: { en: Formal } }
        rows:
          - { level: C1, everyday: ["The meeting will ", { target: "begin" }, " at nine."], formal: ["The meeting will ", { target: "commence" }, " at nine."] }
          - { level: C1, everyday: ["We ", { target: "bought" }, " the tickets online."], formal: ["We ", { target: "purchased" }, " the tickets online."] }
          - { level: C1, everyday: ["I ", { target: "asked" }, " about the price."], formal: ["I ", { target: "enquired" }, " ", { variant: { target: "inquired" }, variety: en-US }, " about the price."] }
          - { level: C1, everyday: ["The test ", { target: "shows" }, " that the plan works."], formal: ["The test ", { target: "demonstrates" }, " that the plan works."] }
          - { level: C1, everyday: ["We have ", { target: "enough" }, " time."], formal: ["We have ", { target: "sufficient" }, " time."] }
          - { level: C1, everyday: ["You can ", { target: "get" }, " a form at the desk."], formal: ["You can ", { target: "obtain" }, " a form at the desk."] }
          - { level: C1, everyday: ["Visitors ", { target: "need" }, " a pass."], formal: ["Visitors ", { target: "require" }, " a pass."] }
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: register, label: { en: Register } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, point: { alternatives: [{ term: "-ate" }, { term: "-ify" }, { term: "-ant" }, { term: "-ion" }] }, register: { en: "Latinate endings build formal and technical words" }, ex: { examples: [{ equivalence: ["speed up", { target: "accelerate" }] }, { equivalence: ["make clear", { target: "clarify" }] }, { equivalence: ["helper", { target: "assistant" }] }, { equivalence: ["choice", { target: "selection" }] }] } }
          - { level: C1, point: { en: "Latinate verbs" }, register:{ en: ["a Latinate verb replaces a phrasal verb in formal writing: see ", { link: "Phrasal Verbs: Core", to: en.verbs.phrasal-verbs-core }] }, ex: { examples: [{ equivalence: ["put off", { target: "postpone" }] }, { equivalence: ["find out", { target: "discover" }] }, { equivalence: ["put up with", { target: "tolerate" }] }] } }

  - title: { en: "Compare: look-alike derivations" }
    role: compare
    content:
      - type: usage
        columns:
          - { key: pair, label: { en: Pair } }
          - { key: difference, label: { en: Difference } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C2, pair: { alternatives: [{ term: "economic" }, { term: "economical" }] }, difference: { en: [{ term: "economic" }, " relates to the economy; ", { term: "economical" }, " means not wasteful"] }, ex: { examples: [["an ", { target: "economic" }, " crisis"], ["an ", { target: "economical" }, " car"]] } }
          - { level: C2, pair: { alternatives: [{ term: "historic" }, { term: "historical" }] }, difference: { en: [{ term: "historic" }, " means important in history; ", { term: "historical" }, " means about the past"] }, ex: { examples: [["a ", { target: "historic" }, " victory"], ["a ", { target: "historical" }, " novel"]] } }
          - { level: C2, pair: { alternatives: [{ term: "classic" }, { term: "classical" }] }, difference: { en: [{ term: "classic" }, " means typical or of lasting quality; ", { term: "classical" }, " means of ancient Greece and Rome or of a formal tradition"] }, ex: { examples: [["a ", { target: "classic" }, " mistake"], ["a ", { target: "classical" }, " concert"]] } }
          - { level: C2, pair: { alternatives: [{ term: "electric" }, { term: "electrical" }] }, difference: { en: [{ term: "electric" }, " means powered by electricity; ", { term: "electrical" }, " means about electricity in general"] }, ex: { examples: [["an ", { target: "electric" }, " kettle"], ["an ", { target: "electrical" }, " engineer"]] } }
          - { level: C2, pair: { alternatives: [{ term: "sensible" }, { term: "sensitive" }] }, difference: { en: [{ term: "sensible" }, " means practical and reasonable; ", { term: "sensitive" }, " means quick to feel or easily hurt"] }, ex: { examples: [["a ", { target: "sensible" }, " choice"], [{ target: "sensitive" }, " skin"]] } }
          - { level: C2, pair: { alternatives: [{ term: "continual" }, { term: "continuous" }] }, difference: { en: [{ term: "continual" }, " means repeated with breaks; ", { term: "continuous" }, " means without a break"] }, ex: { examples: [[{ target: "continual" }, " interruptions"], ["a ", { target: "continuous" }, " line"]] } }
          - { level: C2, pair: { alternatives: [{ term: "imaginary" }, { term: "imaginative" }] }, difference: { en: [{ term: "imaginary" }, " means existing only in the mind; ", { term: "imaginative" }, " means full of new ideas"] }, ex: { examples: [["an ", { target: "imaginary" }, " friend"], ["an ", { target: "imaginative" }, " writer"]] } }
          - { level: C2, pair: { alternatives: [{ term: "childish" }, { term: "childlike" }] }, difference: { en: [{ term: "childish" }, " means silly and not mature; ", { term: "childlike" }, " means innocent and simple"] }, ex: { examples: [[{ target: "childish" }, " jokes"], [{ target: "childlike" }, " wonder"]] } }
          - { level: C2, pair: { alternatives: [{ term: "respectable" }, { term: "respectful" }, { term: "respective" }] }, difference: { en: [{ term: "respectable" }, " means of good standing; ", { term: "respectful" }, " means showing respect; ", { term: "respective" }, " means belonging to each one separately"] }, ex: { examples: [["a ", { target: "respectable" }, " family"], ["a ", { target: "respectful" }, " pupil"], ["their ", { target: "respective" }, " rooms"]] } }

  - title: { en: Agent and gender suffixes }
    role: own
