            text: { en: "Most bases take only one negative prefix: learn the pair with the word.", uk: "Більшість основ приймає лише один заперечний префікс: пару вчать разом зі словом.", es: "La mayoría de las bases admite un solo prefijo negativo: la pareja se aprende con la palabra.", pt: "A maioria das bases aceita só um prefixo negativo: o par se aprende com a palavra.", fr: "La plupart des bases ne prennent qu’un seul préfixe négatif : la paire s’apprend avec le mot.", de: "Die meisten Basen nehmen nur ein negatives Präfix: Das Paar lernt man mit dem Wort.", it: "La maggior parte delle basi prende un solo prefisso negativo: la coppia si impara con la parola.", pl: "Większość podstaw przyjmuje tylko jeden przedrostek przeczący: parę uczy się razem ze słowem.", tr: "Çoğu kök yalnızca bir olumsuzluk önekini alır: çift, sözcükle birlikte öğrenilir.", id: "Sebagian besar kata dasar hanya memakai satu prefiks negatif: pasangannya dipelajari bersama kata itu.", vi: "Hầu hết từ gốc chỉ nhận một tiền tố phủ định: hãy học cặp này cùng với từ." }
