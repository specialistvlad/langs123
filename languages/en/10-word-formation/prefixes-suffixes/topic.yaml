            text: { en: "A coinage may be informal or short-lived: check a dictionary before using one in formal writing.", uk: "Новотвір може бути розмовним або недовговічним: перед вживанням у формальному письмі його перевіряють у словнику.", es: "Una creación nueva puede ser informal o efímera: antes de usarla en un texto formal, se consulta un diccionario.", pt: "Uma criação nova pode ser informal ou passageira: antes de usá-la em um texto formal, consulta-se um dicionário.", fr: "Un néologisme peut être familier ou éphémère : avant de l’employer dans un écrit formel, on consulte un dictionnaire.", de: "Eine Neubildung kann umgangssprachlich oder kurzlebig sein: Vor dem Gebrauch in formellen Texten schlägt man im Wörterbuch nach.", it: "Una neoformazione può essere informale o di breve durata: prima di usarla in uno scritto formale si controlla un dizionario.", pl: "Neologizm może być potoczny lub krótkotrwały: przed użyciem w piśmie formalnym sprawdza się słownik.", tr: "Yeni bir türetme gündelik ya da kısa ömürlü olabilir: resmî yazıda kullanmadan önce sözlüğe bakılır.", id: "Kata ciptaan baru bisa bersifat informal atau tidak bertahan lama: sebelum dipakai dalam tulisan formal, kamus diperiksa.", vi: "Từ mới tạo có thể mang tính thân mật hoặc chỉ tồn tại ngắn ngủi: hãy tra từ điển trước khi dùng trong văn viết trang trọng." }

