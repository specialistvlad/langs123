          - { level: C2, affix: { term: "intra-" }, meaning: { en: "within" }, ex: { examples: [{ target: "intranet" }, { target: "intravenous" }, { target: "intrapersonal" }] } }
          - { level: C2, affix: { term: "extra-" }, meaning: { en: "outside, beyond" }, ex: { examples: [{ target: "extraordinary" }, { target: "extracurricular" }, { target: "extraterrestrial" }] } }
          - { level: C2, affix: { term: "circum-" }, meaning: { en: "around" }, ex: { examples: [{ target: "circumference" }, { target: "circumnavigate" }, { target: "circumvent" }] } }
          - { level: C2, affix: { term: "contra-" }, meaning: { en: "against" }, ex: { examples: [{ target: "contradict" }, { target: "contraflow" }, { target: "contraception" }] } }
          - { level: C2, affix: { term: "-itis" }, meaning: { en: "inflammation of" }, ex: { examples: [{ target: "arthritis" }, { target: "bronchitis" }, { target: "tonsillitis" }] } }
          - { level: C2, affix: { term: "-ate" }, meaning: { en: ["Latin endings of verbs, adjectives and nouns: ", { ipa: "eɪt" }, " in a verb, ", { ipa: "ət" }, " in the others"] }, ex: { examples: [{ contrast: [["to ", { target: "estimate" }, " ", { ipa: "ˈestɪmeɪt" }], ["an ", { target: "estimate" }, " ", { ipa: "ˈestɪmət" }]] }, { contrast: [["to ", { target: "separate" }, " ", { ipa: "ˈsepəreɪt" }], ["a ", { target: "separate" }, " room ", { ipa: "ˈseprət" }]] }] } }
          - { level: C2, affix: { term: "a-" }, meaning: { en: "in a state or position; most such adjectives stand after the verb" }, ex: { examples: [["The baby is ", { target: "asleep" }, "."], ["The house was ", { target: "aflame" }, "."], ["The boat is ", { target: "afloat" }, "."]] } }
          - { level: C2, affix: { term: "be-" }, meaning: { en: "all over, thoroughly; literary" }, ex: { examples: [{ mapping: ["deck", { target: "bedeck" }] }, { mapping: ["witch", { target: "bewitch" }] }, { mapping: ["dazzle", { target: "bedazzle" }] }] } }

  - title: { en: Coinage }
    role: own
    content:
      - type: usage
        columns:
          - { key: affix, label: { en: Affix } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C2, affix: { term: "-gate" }, meaning: { en: ["a scandal, after ", { term: "Watergate" }] }, ex: { examples: [{ target: "Partygate" }, { target: "Dieselgate" }] } }
          - { level: C2, affix: { alternatives: [{ term: "-holic" }, { term: "-aholic" }] }, meaning: { en: "addicted to, or unable to stop, after alcoholic" }, ex: { examples: [{ target: "workaholic" }, { target: "shopaholic" }, { target: "chocoholic" }] } }
          - { level: C2, affix: { term: "-athon" }, meaning: { en: "a long event, after marathon" }, ex: { examples: [{ target: "hackathon" }, { target: "telethon" }, { target: "walkathon" }] } }
          - { level: C2, affix: { term: "-ista" }, meaning: { en: "a follower or enthusiast, after Spanish" }, ex: { target: "fashionista" } }
          - { level: C2, affix: { term: "-ism" }, meaning: { en: "prejudice against a group" }, ex: { examples: [{ target: "ageism" }, { target: "sexism" }, { target: "ableism" }] } }
          - { level: C2, affix: { alternatives: [{ term: "e-" }, { term: "cyber-" }, { term: "eco-" }, { term: "mega-" }] }, meaning: { en: [{ term: "e-" }, " and ", { term: "cyber-" }, " mean online; ", { term: "eco-" }, " means environmental; ", { term: "mega-" }, " means very large"] }, ex: { examples: [{ target: "e-commerce" }, { target: "cyberattack" }, { target: "eco-tourism" }, { target: "megastore" }] } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A coinage may be informal or short-lived: check a dictionary before using one in formal writing." }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "unpossible", right: { target: "impossible" }, rule: { en: [{ term: "possible" }, " takes ", { term: "in-" }, ", which becomes ", { term: "im-" }, " before p"] } }
          - { level: B2, wrong: "unhonest", right: { target: "dishonest" }, rule: { en: [{ term: "honest" }, " takes ", { term: "dis-" }] } }
          - { level: B2, wrong: "enjoyful", right: { target: "enjoyable" }, rule: { en: [{ term: "enjoy" }, " takes ", { term: "-able" }, ", not ", { term: "-ful" }] } }
          - { level: B2, wrong: "strongen", right: { target: "strengthen" }, rule: { en: [{ term: "-en" }, " joins the noun ", { term: "strength" }] } }
          - { level: B2, wrong: "She answered friendlily.", right: ["She answered ", { target: "in a friendly way" }, "."], rule: { en: ["an adjective in ", { term: "-ly" }, " has no adverb: use a phrase"] } }
          - { level: C1, wrong: "possibleness", right: { target: "possibility" }, rule: { en: ["a Latinate adjective takes ", { term: "-ity" }] } }
          - { level: C1, wrong: "simplifation", right: { target: "simplification" }, rule: { en: ["a verb in ", { term: "-ify" }, " takes ", { term: "-ification" }] } }
          - { level: C1, wrong: "a blue eyes girl", right: ["a ", { target: "blue-eyed" }, " girl"], rule: { en: ["the compound adjective takes ", { term: "-ed" }, " and a singular noun"] } }
          - { level: C2, wrong: "an economic car", right: ["an ", { target: "economical" }, " car"], rule: { en: [{ term: "economical" }, " means not wasteful"] } }
          - { level: C2, wrong: "sensible skin", right: [{ target: "sensitive" }, " skin"], rule: { en: [{ term: "sensitive" }, " means quick to feel; ", { term: "sensible" }, " means reasonable"] } }
          - { level: C2, wrong: "a historic novel", right: ["a ", { target: "historical" }, " novel"], rule: { en: [{ term: "historical" }, " means about the past"] } }
          - { level: C2, wrong: "continuous interruptions", right: [{ target: "continual" }, " interruptions"], rule: { en: [{ term: "continual" }, " means repeated with breaks"] } }
          - { level: C2, wrong: "an asleep baby", right: ["a ", { target: "sleeping" }, " baby"], rule: { en: ["most adjectives in ", { term: "a-" }, " stand after the verb"] } }
          - { level: C2, wrong: "their respectful rooms", right: ["their ", { target: "respective" }, " rooms"], rule: { en: [{ term: "respective" }, " means belonging to each one separately"] } }
