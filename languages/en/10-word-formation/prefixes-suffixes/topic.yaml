            text: { en: ["The stress patterns of suffixes are set out in ", { link: "Sounds and IPA", to: en.foundations.pronunciation-ipa }, "."], uk: ["Правила наголосу в словах із суфіксами викладено в темі ", { link: "Звуки та МФА", to: en.foundations.pronunciation-ipa }, "."], es: ["Las pautas de acento de los sufijos se explican en ", { link: "Sonidos y AFI", to: en.foundations.pronunciation-ipa }, "."], pt: ["Os padrões de sílaba tônica dos sufixos estão em ", { link: "Sons e AFI", to: en.foundations.pronunciation-ipa }, "."], fr: ["Les schémas d’accent des suffixes sont exposés dans ", { link: "Sons et API", to: en.foundations.pronunciation-ipa }, "."], de: ["Die Betonungsmuster der Suffixe stehen unter ", { link: "Laute und IPA", to: en.foundations.pronunciation-ipa }, "."], it: ["Gli schemi di accento dei suffissi sono spiegati in ", { link: "Suoni e AFI", to: en.foundations.pronunciation-ipa }, "."], pl: ["Schematy akcentu przyrostków omówiono w temacie ", { link: "Dźwięki i IPA", to: en.foundations.pronunciation-ipa }, "."], tr: ["Soneklerin vurgu kalıpları ", { link: "Sesler ve IPA", to: en.foundations.pronunciation-ipa }, " konusunda anlatılır."], id: ["Pola tekanan sufiks dijelaskan dalam ", { link: "Bunyi dan AFI", to: en.foundations.pronunciation-ipa }, "."], vi: ["Các mẫu trọng âm của hậu tố được trình bày trong ", { link: "Âm và IPA", to: en.foundations.pronunciation-ipa }, "."] }

