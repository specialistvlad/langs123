          - { level: C2, suffix: { term: "-ee" }, rule: { en: ["also names a person in a state or role, with no matching ", { term: "-er" }, " word"] }, ex: { examples: [{ target: "absentee" }, { target: "escapee" }, { target: "refugee" }] } }
          - { level: C2, suffix: { term: "-ess" }, rule: { en: "marks a woman and stays in titles" }, ex: { examples: [{ target: "princess" }, { target: "duchess" }, { target: "countess" }] } }
          - { level: C2, suffix: { term: "-person" }, rule: { en: [{ term: "-man" }, " in a job title gives way to ", { term: "-person" }] }, ex: { examples: [{ mapping: ["chairman", { target: "chairperson" }] }, { mapping: ["spokesman", { target: "spokesperson" }] }, { mapping: ["salesman", { target: "salesperson" }] }] } }
          - { level: C2, suffix: { en: "a neutral word" }, rule: { en: "one word serves any person" }, ex: { examples: [{ mapping: ["actress", { target: "actor" }] }, { mapping: ["policeman", { target: "police officer" }] }, { mapping: ["stewardess", { target: "flight attendant" }] }] } }

  - title: { en: Learned and rare affixes }
