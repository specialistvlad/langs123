        - { level: B2, point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: "possible" }, " takes ", { term: "in-" }, ", which becomes ", { term: "im-" }, " before p"], uk: [{ term: "possible" }, " має ", { term: "in-" }, ", яке перед p стає ", { term: "im-" }], es: [{ term: "possible" }, " lleva ", { term: "in-" }, ", que ante p se convierte en ", { term: "im-" }], pt: [{ term: "possible" }, " leva ", { term: "in-" }, ", que vira ", { term: "im-" }, " antes de p"], fr: [{ term: "possible" }, " prend ", { term: "in-" }, ", qui devient ", { term: "im-" }, " devant p"], de: [{ term: "possible" }, " nimmt ", { term: "in-" }, ", das vor p zu ", { term: "im-" }, " wird"], it: [{ term: "possible" }, " prende ", { term: "in-" }, ", che davanti a p diventa ", { term: "im-" }], pl: [{ term: "possible" }, " przyjmuje ", { term: "in-" }, ", które przed p zmienia się w ", { term: "im-" }], tr: [{ term: "possible" }, " sözcüğü ", { term: "in-" }, " alır; p harfinden önce ", { term: "im-" }, " olur"], id: [{ term: "possible" }, " memakai ", { term: "in-" }, ", yang menjadi ", { term: "im-" }, " sebelum p"], vi: [{ term: "possible" }, " dùng ", { term: "in-" }, ", thành ", { term: "im-" }, " trước p"] }, ex: ["It is ", { target: "impossible" }, " to finish today."], tr: { uk: "Закінчити сьогодні неможливо.", es: "Es imposible terminar hoy.", pt: "É impossível terminar hoje.", fr: "Il est impossible de finir aujourd’hui.", de: "Es ist unmöglich, heute fertig zu werden.", it: "È impossibile finire oggi.", pl: "Nie da się skończyć dzisiaj.", tr: "Bugün bitirmek imkânsız.", id: "Mustahil menyelesaikannya hari ini.", vi: "Không thể xong trong hôm nay." } }
        - { level: C1, point: { en: "Productive suffixes", uk: "Продуктивні суфікси", es: "Sufijos productivos", pt: "Sufixos produtivos", fr: "Suffixes productifs", de: "Produktive Suffixe", it: "Suffissi produttivi", pl: "Produktywne przyrostki", tr: "Üretken sonekler", id: "Sufiks produktif", vi: "Hậu tố có tính sản sinh" }, rule: { en: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " attach freely to new bases"], uk: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " легко приєднуються до нових основ"], es: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " se añaden libremente a bases nuevas"], pt: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " se juntam livremente a bases novas"], fr: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " se joignent librement à des bases nouvelles"], de: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " treten frei an neue Basen"], it: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " si aggiungono liberamente a basi nuove"], pl: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " łączą się swobodnie z nowymi podstawami"], tr: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " yeni köklere serbestçe eklenir"], id: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " melekat dengan bebas pada kata dasar baru"], vi: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " gắn tự do vào từ gốc mới"] }, ex: { examples: [{ mapping: ["download", { target: "downloadable" }] }, { mapping: ["solid", { target: "solidify" }] }] }, tr: { uk: { examples: ["який можна завантажити", "затвердівати"] }, es: { examples: ["descargable", "solidificar"] }, pt: { examples: ["que pode ser baixado", "solidificar"] }, fr: { examples: ["téléchargeable", "solidifier"] }, de: { examples: ["herunterladbar", "verfestigen"] }, it: { examples: ["scaricabile", "solidificare"] }, pl: { examples: ["do pobrania", "zestalać"] }, tr: { examples: ["indirilebilir", "katılaştırmak"] }, id: { examples: ["dapat diunduh", "memadatkan"] }, vi: { examples: ["có thể tải xuống", "làm đặc lại"] } } }
        - { level: C1, point: { alternatives: [{ term: "-ity" }, { term: "-ness" }] }, rule: { en: [{ term: "-ity" }, " usually follows a Latinate adjective, ", { term: "-ness" }, " a native one"], uk: [{ term: "-ity" }, " зазвичай додається до прикметника латинського походження, ", { term: "-ness" }, " — до прикметника германського походження"], es: [{ term: "-ity" }, " suele seguir a un adjetivo de origen latino, ", { term: "-ness" }, " a uno de origen germánico"], pt: [{ term: "-ity" }, " costuma vir depois de um adjetivo de origem latina, ", { term: "-ness" }, " depois de um de origem germânica"], fr: [{ term: "-ity" }, " suit d’ordinaire un adjectif d’origine latine, ", { term: "-ness" }, " un adjectif d’origine germanique"], de: [{ term: "-ity" }, " folgt meist einem Adjektiv lateinischen Ursprungs, ", { term: "-ness" }, " einem germanischen"], it: [{ term: "-ity" }, " segue di solito un aggettivo di origine latina, ", { term: "-ness" }, " uno di origine germanica"], pl: [{ term: "-ity" }, " zwykle łączy się z przymiotnikiem pochodzenia łacińskiego, ", { term: "-ness" }, " z germańskim"], tr: [{ term: "-ity" }, " genellikle Latince kökenli bir sıfattan sonra, ", { term: "-ness" }, " ise Cermen kökenli bir sıfattan sonra gelir"], id: [{ term: "-ity" }, " biasanya mengikuti kata sifat dari bahasa Latin, ", { term: "-ness" }, " mengikuti kata sifat Jermanik"], vi: [{ term: "-ity" }, " thường theo sau tính từ gốc Latin, ", { term: "-ness" }, " theo sau tính từ gốc Germanic"] }, ex: { examples: [{ mapping: ["possible", { target: "possibility" }] }, { mapping: ["kind", { target: "kindness" }] }] }, tr: { uk: { examples: ["можливість", "доброта"] }, es: { examples: ["posibilidad", "amabilidad"] }, pt: { examples: ["possibilidade", "gentileza"] }, fr: { examples: ["possibilité", "gentillesse"] }, de: { examples: ["Möglichkeit", "Freundlichkeit"] }, it: { examples: ["possibilità", "gentilezza"] }, pl: { examples: ["możliwość", "życzliwość"] }, tr: { examples: ["olasılık", "nezaket"] }, id: { examples: ["kemungkinan", "kebaikan"] }, vi: { examples: ["khả năng", "sự tử tế"] } } }
        - { level: C1, point: { en: "Combining forms", uk: "Словотвірні елементи", es: "Elementos compositivos", pt: "Elementos de composição", fr: "Éléments de formation", de: "Wortbildungselemente", it: "Elementi di composizione", pl: "Elementy słowotwórcze", tr: "Birleşen biçimler", id: "Bentuk terikat", vi: "Yếu tố cấu tạo từ" }, rule: { en: "Greek and Latin forms build technical words", uk: "грецькі й латинські елементи творять наукові й технічні слова", es: "las formas griegas y latinas crean palabras técnicas", pt: "formas gregas e latinas criam palavras técnicas", fr: "des éléments grecs et latins forment des mots techniques", de: "griechische und lateinische Elemente bilden Fachwörter", it: "elementi greci e latini formano parole tecniche", pl: "greckie i łacińskie elementy tworzą wyrazy specjalistyczne", tr: "Yunanca ve Latince biçimler teknik sözcükler yapar", id: "unsur Yunani dan Latin membentuk kata teknis", vi: "yếu tố Hy Lạp và Latin tạo từ chuyên ngành" }, ex: { examples: [{ target: "biology" }, { target: "geography" }, { target: "telephone" }] }, tr: { uk: { examples: ["біологія", "географія", "телефон"] }, es: { examples: ["biología", "geografía", "teléfono"] }, pt: { examples: ["biologia", "geografia", "telefone"] }, fr: { examples: ["biologie", "géographie", "téléphone"] }, de: { examples: ["Biologie", "Geografie", "Telefon"] }, it: { examples: ["biologia", "geografia", "telefono"] }, pl: { examples: ["biologia", "geografia", "telefon"] }, tr: { examples: ["biyoloji", "coğrafya", "telefon"] }, id: { examples: ["biologi", "geografi", "telepon"] }, vi: { examples: ["sinh học", "địa lý", "điện thoại"] } } }
        - { level: C1, point: { en: "Register", uk: "Регістр", es: "Registro", pt: "Registro", fr: "Registre", de: "Register", it: "Registro", pl: "Rejestr", tr: "Üslup", id: "Ragam bahasa", vi: "Văn phong" }, rule: { en: "Latinate words sound more formal than their native partners", uk: "слова латинського походження звучать офіційніше, ніж їхні германські відповідники", es: "las palabras de origen latino suenan más formales que sus equivalentes germánicos", pt: "as palavras de origem latina soam mais formais que seus equivalentes germânicos", fr: "les mots d’origine latine sonnent plus soutenus que leurs équivalents germaniques", de: "Wörter lateinischen Ursprungs klingen förmlicher als ihre germanischen Entsprechungen", it: "le parole di origine latina suonano più formali dei loro equivalenti germanici", pl: "wyrazy pochodzenia łacińskiego brzmią bardziej formalnie niż ich germańskie odpowiedniki", tr: "Latince kökenli sözcükler, Cermen kökenli karşılıklarından daha resmî duyulur", id: "kata dari bahasa Latin terdengar lebih formal daripada padanannya yang berakar Jermanik", vi: "từ gốc Latin nghe trang trọng hơn từ tương đương gốc Germanic" }, ex: { examples: [{ equivalence: ["begin", { target: "commence" }] }, { equivalence: ["enough", { target: "sufficient" }] }] }, tr: { uk: { examples: ["розпочинати", "достатній"] }, es: { examples: ["comenzar", "suficiente"] }, pt: { examples: ["iniciar", "suficiente"] }, fr: { examples: ["commencer", "suffisant"] }, de: { examples: ["beginnen", "ausreichend"] }, it: { examples: ["iniziare", "sufficiente"] }, pl: { examples: ["rozpocząć", "wystarczający"] }, tr: { examples: ["başlamak", "yeterli"] }, id: { examples: ["memulai", "memadai"] }, vi: { examples: ["bắt đầu", "đủ"] } } }
        - { level: C2, point: { en: "Look-alikes", uk: "Схожі слова", es: "Palabras parecidas", pt: "Palavras parecidas", fr: "Mots qui se ressemblent", de: "Ähnliche Wörter", it: "Parole simili", pl: "Wyrazy podobne", tr: "Benzer sözcükler", id: "Kata yang mirip", vi: "Từ trông giống nhau" }, rule: { en: "a pair of suffixes can split the meaning", uk: "два суфікси можуть розділити значення", es: "dos sufijos pueden repartirse el significado", pt: "dois sufixos podem dividir o significado", fr: "deux suffixes peuvent se partager le sens", de: "zwei Suffixe können die Bedeutung aufteilen", it: "due suffissi possono dividersi il significato", pl: "dwa przyrostki mogą rozdzielić znaczenie", tr: "iki sonek anlamı paylaşabilir", id: "sepasang sufiks dapat membagi makna", vi: "một cặp hậu tố có thể chia tách nghĩa" }, ex: { examples: [["an ", { target: "economic" }, " crisis"], ["an ", { target: "economical" }, " car"]] }, tr: { uk: { examples: ["економічна криза", "ощадливий автомобіль"] }, es: { examples: ["una crisis económica", "un auto económico"] }, pt: { examples: ["uma crise econômica", "um carro econômico"] }, fr: { examples: ["une crise économique", "une voiture économique"] }, de: { examples: ["eine Wirtschaftskrise", "ein sparsames Auto"] }, it: { examples: ["una crisi economica", "un'auto economica"] }, pl: { examples: ["kryzys gospodarczy", "oszczędny samochód"] }, tr: { examples: ["ekonomik bir kriz", "tasarruflu bir araba"] }, id: { examples: ["krisis ekonomi", "mobil yang irit"] }, vi: { examples: ["một cuộc khủng hoảng kinh tế", "một chiếc xe tiết kiệm"] } } }
        - { level: C2, point: { en: "Rare and new affixes", uk: "Рідкісні й нові афікси", es: "Afijos raros y nuevos", pt: "Afixos raros e novos", fr: "Affixes rares et nouveaux", de: "Seltene und neue Affixe", it: "Affissi rari e nuovi", pl: "Rzadkie i nowe afiksy", tr: "Nadir ve yeni ekler", id: "Afiks langka dan baru", vi: "Phụ tố hiếm và mới" }, rule: { en: [{ term: "hyper-" }, " and ", { term: "pseudo-" }, " are learned; ", { term: "-holic" }, " and ", { term: "-gate" }, " are coinages"], uk: [{ term: "hyper-" }, " і ", { term: "pseudo-" }, " — книжні; ", { term: "-holic" }, " і ", { term: "-gate" }, " — новотвори"], es: [{ term: "hyper-" }, " y ", { term: "pseudo-" }, " son cultos; ", { term: "-holic" }, " y ", { term: "-gate" }, " son creaciones recientes"], pt: [{ term: "hyper-" }, " e ", { term: "pseudo-" }, " são eruditos; ", { term: "-holic" }, " e ", { term: "-gate" }, " são criações recentes"], fr: [{ term: "hyper-" }, " et ", { term: "pseudo-" }, " sont savants ; ", { term: "-holic" }, " et ", { term: "-gate" }, " sont des créations récentes"], de: [{ term: "hyper-" }, " und ", { term: "pseudo-" }, " sind gelehrte Bildungen; ", { term: "-holic" }, " und ", { term: "-gate" }, " sind Neuschöpfungen"], it: [{ term: "hyper-" }, " e ", { term: "pseudo-" }, " sono colti; ", { term: "-holic" }, " e ", { term: "-gate" }, " sono neoformazioni"], pl: [{ term: "hyper-" }, " i ", { term: "pseudo-" }, " są książkowe; ", { term: "-holic" }, " i ", { term: "-gate" }, " to neologizmy"], tr: [{ term: "hyper-" }, " ve ", { term: "pseudo-" }, " kitabi eklerdir; ", { term: "-holic" }, " ve ", { term: "-gate" }, " yeni türetmelerdir"], id: [{ term: "hyper-" }, " dan ", { term: "pseudo-" }, " bersifat ilmiah; ", { term: "-holic" }, " dan ", { term: "-gate" }, " adalah bentukan baru"], vi: [{ term: "hyper-" }, " và ", { term: "pseudo-" }, " mang tính học thuật; ", { term: "-holic" }, " và ", { term: "-gate" }, " là từ mới tạo"] }, ex: { examples: [{ target: "hypersensitive" }, { target: "pseudonym" }, { target: "workaholic" }] }, tr: { uk: { examples: ["надчутливий", "псевдонім", "трудоголік"] }, es: { examples: ["hipersensible", "seudónimo", "adicto al trabajo"] }, pt: { examples: ["hipersensível", "pseudônimo", "viciado em trabalho"] }, fr: { examples: ["hypersensible", "pseudonyme", "bourreau de travail"] }, de: { examples: ["überempfindlich", "Pseudonym", "Workaholic"] }, it: { examples: ["ipersensibile", "pseudonimo", "stakanovista"] }, pl: { examples: ["nadwrażliwy", "pseudonim", "pracoholik"] }, tr: { examples: ["aşırı duyarlı", "takma ad", "işkolik"] }, id: { examples: ["sangat sensitif", "nama samaran", "pecandu kerja"] }, vi: { examples: ["quá nhạy cảm", "bút danh", "người nghiện công việc"] } } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A suffix ends a word and usually sets its class; a prefix starts it and usually keeps the class.", uk: "Суфікс стоїть у кінці слова й зазвичай визначає його частину мови; префікс стоїть на початку й зазвичай не змінює її.", es: "El sufijo cierra la palabra y suele fijar su clase; el prefijo la abre y suele conservar la clase.", pt: "O sufixo fecha a palavra e em geral define a sua classe; o prefixo a abre e em geral mantém a classe.", fr: "Le suffixe termine le mot et fixe en général sa classe ; le préfixe le commence et garde en général la classe.", de: "Das Suffix steht am Wortende und legt meist die Wortart fest; das Präfix steht am Wortanfang und behält meist die Wortart bei.", it: "Il suffisso chiude la parola e di solito ne fissa la classe; il prefisso la apre e di solito la mantiene.", pl: "Przyrostek stoi na końcu wyrazu i zwykle wyznacza jego część mowy; przedrostek stoi na początku i zwykle jej nie zmienia.", tr: "Sonek sözcüğü bitirir ve çoğunlukla sözcük türünü belirler; önek sözcüğü başlatır ve çoğunlukla türü değiştirmez.", id: "Sufiks mengakhiri kata dan biasanya menentukan kelasnya; prefiks memulai kata dan biasanya mempertahankan kelasnya.", vi: "Hậu tố đứng cuối từ và thường quyết định từ loại; tiền tố đứng đầu từ và thường giữ nguyên từ loại." }
            ex: { examples: [{ mapping: ["happy", { target: "happiness" }] }, { mapping: ["happy", { target: "unhappy" }] }] }
            tr: { uk: { examples: ["щастя", "нещасливий"] }, es: { examples: ["felicidad", "infeliz"] }, pt: { examples: ["felicidade", "infeliz"] }, fr: { examples: ["bonheur", "malheureux"] }, de: { examples: ["Glück", "unglücklich"] }, it: { examples: ["felicità", "infelice"] }, pl: { examples: ["szczęście", "nieszczęśliwy"] }, tr: { examples: ["mutluluk", "mutsuz"] }, id: { examples: ["kebahagiaan", "tidak bahagia"] }, vi: { examples: ["hạnh phúc", "không hạnh phúc"] } }
          - type: rule
            level: B2
            text: { en: "Read a new word in order: the suffix gives the class, the prefix adds meaning, the base the core.", uk: "Нове слово читають по порядку: суфікс дає частину мови, префікс додає значення, основа — суть.", es: "Una palabra nueva se lee en orden: el sufijo da la clase, el prefijo añade significado y la base aporta el núcleo.", pt: "Uma palavra nova se lê em ordem: o sufixo dá a classe, o prefixo acrescenta significado e a base traz o núcleo.", fr: "Un mot nouveau se lit dans l’ordre : le suffixe donne la classe, le préfixe ajoute un sens, la base apporte le noyau.", de: "Ein neues Wort wird der Reihe nach gelesen: Das Suffix gibt die Wortart, das Präfix die Bedeutung, die Basis den Kern.", it: "Una parola nuova si legge in ordine: il suffisso dà la classe, il prefisso aggiunge significato, la base porta il nucleo.", pl: "Nowy wyraz czyta się po kolei: przyrostek daje część mowy, przedrostek dodaje znaczenie, podstawa niesie rdzeń.", tr: "Yeni bir sözcük sırayla okunur: sonek sözcük türünü verir, önek anlam katar, kök çekirdeği oluşturur.", id: "Kata baru dibaca berurutan: sufiks memberi kelas kata, prefiks menambah makna, kata dasar menjadi intinya.", vi: "Đọc từ mới theo thứ tự: hậu tố cho từ loại, tiền tố thêm nghĩa, từ gốc là phần cốt lõi." }
            ex: { mapping: [{ pattern: ["dis", "agree", "ment"] }, { target: "disagreement" }] }
            tr: { uk: "незгода", es: "desacuerdo", pt: "desacordo", fr: "désaccord", de: "Meinungsverschiedenheit", it: "disaccordo", pl: "niezgoda", tr: "anlaşmazlık", id: "perselisihan", vi: "sự bất đồng" }
          - type: rule
            level: B2
            text: { en: ["Letters that look like an affix are not always one: ", { term: "singer" }, " has ", { term: "-er" }, ", ", { term: "finger" }, " does not."], uk: ["Літери, схожі на афікс, не завжди є афіксом: у ", { term: "singer" }, " є ", { term: "-er" }, ", а в ", { term: "finger" }, " немає."], es: ["Unas letras que parecen un afijo no siempre lo son: ", { term: "singer" }, " tiene ", { term: "-er" }, ", ", { term: "finger" }, " no."], pt: ["Letras que parecem um afixo nem sempre são um: ", { term: "singer" }, " tem ", { term: "-er" }, ", ", { term: "finger" }, " não tem."], fr: ["Des lettres qui ressemblent à un affixe n’en sont pas toujours un : ", { term: "singer" }, " a ", { term: "-er" }, ", ", { term: "finger" }, " n’en a pas."], de: ["Buchstaben, die wie ein Affix aussehen, sind nicht immer eines: ", { term: "singer" }, " hat ", { term: "-er" }, ", ", { term: "finger" }, " nicht."], it: ["Lettere che sembrano un affisso non lo sono sempre: ", { term: "singer" }, " ha ", { term: "-er" }, ", ", { term: "finger" }, " no."], pl: ["Litery podobne do afiksu nie zawsze nim są: ", { term: "singer" }, " ma ", { term: "-er" }, ", a ", { term: "finger" }, " nie ma."], tr: ["Ek gibi görünen harfler her zaman ek değildir: ", { term: "singer" }, " sözcüğünde ", { term: "-er" }, " vardır, ", { term: "finger" }, " sözcüğünde yoktur."], id: ["Huruf yang tampak seperti afiks tidak selalu merupakan afiks: ", { term: "singer" }, " memiliki ", { term: "-er" }, ", ", { term: "finger" }, " tidak."], vi: ["Những chữ cái trông như phụ tố không phải lúc nào cũng là phụ tố: ", { term: "singer" }, " có ", { term: "-er" }, ", ", { term: "finger" }, " thì không."] }

