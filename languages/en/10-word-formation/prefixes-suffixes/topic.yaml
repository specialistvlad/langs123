title: { en: Prefixes and Suffixes, uk: "Префікси й суфікси", es: "Prefijos y sufijos", pt: "Prefixos e sufixos", fr: "Préfixes et suffixes", de: "Präfixe und Suffixe", it: "Prefissi e suffissi", pl: "Przedrostki i przyrostki", tr: "Önekler ve sonekler", id: "Prefiks dan sufiks", vi: "Tiền tố và hậu tố" }
summary:
  lead:
    en: "Prefixes and suffixes build new words from a base: a suffix sets the word class, a prefix adds meaning, and a suffix can move the stress."
    uk: "Префікси й суфікси творять нові слова від основи: суфікс визначає частину мови, префікс додає значення, а суфікс може змістити наголос."
    es: "Prefijos y sufijos forman palabras nuevas desde una base: el sufijo fija la clase de palabra, el prefijo añade significado y un sufijo puede mover el acento."
    pt: "Prefixos e sufixos formam palavras novas a partir de uma base: o sufixo define a classe, o prefixo acrescenta sentido e um sufixo pode mudar a sílaba tônica."
    fr: "Un suffixe fixe la classe du mot et peut déplacer l’accent, un préfixe ajoute un sens : tous deux forment des mots nouveaux à partir d’une base."
    de: "Präfixe und Suffixe bilden aus einer Basis neue Wörter: Das Suffix legt die Wortart fest, das Präfix fügt Bedeutung hinzu, ein Suffix verschiebt die Betonung."
    it: "Prefissi e suffissi formano parole nuove da una base: il suffisso fissa la classe, il prefisso aggiunge significato e un suffisso può spostare l'accento."
    pl: "Przedrostki i przyrostki tworzą nowe wyrazy od podstawy: przyrostek wyznacza część mowy, przedrostek dodaje znaczenie, a przyrostek może przesunąć akcent."
    tr: "Önekler ve sonekler bir kökten yeni sözcükler türetir: sonek sözcük türünü belirler, önek anlam katar, sonek ise vurguyu kaydırabilir."
    id: "Prefiks dan sufiks membentuk kata baru dari kata dasar: sufiks menentukan kelas kata, prefiks menambah makna, dan sufiks dapat menggeser tekanan."
    vi: "Tiền tố và hậu tố tạo từ mới từ một từ gốc: hậu tố quyết định từ loại, tiền tố thêm nghĩa, và hậu tố có thể làm dịch chuyển trọng âm."
  rule:
    en: "The suffix, not the base, gives the word class:"
    uk: "Частину мови визначає суфікс, а не основа:"
    es: "La clase de palabra la da el sufijo, no la base:"
    pt: "A classe gramatical vem do sufixo, não da base:"
    fr: "Le suffixe, et non la base, donne la classe de mots :"
    de: "Die Wortart bestimmt das Suffix, nicht die Basis:"
    it: "La classe di parole la dà il suffisso, non la base:"
    pl: "Część mowy wyznacza przyrostek, a nie podstawa:"
    tr: "Sözcük türünü kök değil, sonek belirler:"
    id: "Kelas kata ditentukan oleh sufiks, bukan kata dasar:"
    vi: "Từ loại do hậu tố quyết định, không phải từ gốc:"
  ex: { examples: [{ mapping: ["enjoy", { target: "enjoyment" }] }, { mapping: ["enjoy", { target: "enjoyable" }] }] }

