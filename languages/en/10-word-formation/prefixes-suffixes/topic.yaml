# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.word-formation.prefixes-suffixes
lang: en
kind: grammar
tags: [word-formation, prefixes, suffixes, derivation]
concepts: [word-formation]
related: [en.foundations.pronunciation-ipa, en.adjectives-adverbs.adverbs-frequency-manner, en.verbs.phrasal-verbs-core]
status: { en: draft }

title: { en: Prefixes and Suffixes }
summary:
  lead:
    en: "Prefixes and suffixes build new words from a base: a suffix sets the word class, a prefix adds meaning, and a suffix can move the stress."
  rule:
    en: "The suffix, not the base, gives the word class:"
  ex: { examples: [{ mapping: ["enjoy", { target: "enjoyment" }] }, { mapping: ["enjoy", { target: "enjoyable" }] }] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B2, point: { en: "Suffixes" }, rule: { en: [{ alternatives: [{ term: "-tion" }, { term: "-ment" }, { term: "-ness" }] }, " make nouns; ", { alternatives: [{ term: "-able" }, { term: "-ful" }, { term: "-ous" }] }, " make adjectives"] }, ex: { examples: [{ mapping: ["educate", { target: "education" }] }, { mapping: ["kind", { target: "kindness" }] }, { mapping: ["enjoy", { target: "enjoyable" }] }] } }
        - { level: B2, point: { en: "Verb formation" }, rule: { en: [{ alternatives: [{ term: "-ise" }, { term: "-ify" }, { term: "-en" }, { term: "en-" }] }, " make verbs"] }, ex: { examples: [{ mapping: ["simple", { target: "simplify" }] }, { mapping: ["short", { target: "shorten" }] }, { mapping: ["rich", { target: "enrich" }] }] } }
        - { level: B2, point: { en: "Negative prefixes" }, rule: { en: [{ alternatives: [{ term: "un-" }, { term: "in-" }, { term: "dis-" }, { term: "non-" }, { term: "mis-" }] }, " negate; ", { term: "in-" }, " becomes ", { term: "im-" }, ", ", { term: "il-" }, ", ", { term: "ir-" }] }, ex: { examples: [{ mapping: ["happy", { target: "unhappy" }] }, { mapping: ["agree", { target: "disagree" }] }] } }
        - { level: B2, point: { en: "Other prefixes" }, rule: { en: [{ term: "re-" }, " again, ", { term: "over-" }, " too much, ", { term: "under-" }, " too little, ", { term: "ex-" }, " former"] }, ex: { examples: [{ mapping: ["write", { target: "rewrite" }] }, { mapping: ["cook", { target: "overcook" }] }, { mapping: ["wife", { target: "ex-wife" }] }] } }
        - { level: B2, point: { en: "Sound" }, rule: { en: "some suffixes move the stress and shorten the vowel" }, ex: { examples: [{ mapping: [[{ stress: "ˈpho" }, "tograph"], { target: ["photo", { stress: "ˈgraph" }, "ic"] }] }, { mapping: ["divide", { target: "division" }] }] } }
        - { level: B2, point: { en: "Trap" }, rule: { en: [{ term: "possible" }, " takes ", { term: "in-" }, ", which becomes ", { term: "im-" }, " before p"] }, ex: ["It is ", { target: "impossible" }, " to finish today."] }
        - { level: C1, point: { en: "Productive suffixes" }, rule: { en: [{ alternatives: [{ term: "-ish" }, { term: "-y" }, { term: "-able" }, { term: "-ify" }, { term: "-ism" }] }, " attach freely to new bases"] }, ex: { examples: [{ mapping: ["download", { target: "downloadable" }] }, { mapping: ["solid", { target: "solidify" }] }] } }
        - { level: C1, point: { alternatives: [{ term: "-ity" }, { term: "-ness" }] }, rule: { en: [{ term: "-ity" }, " usually follows a Latinate adjective, ", { term: "-ness" }, " a native one"] }, ex: { examples: [{ mapping: ["possible", { target: "possibility" }] }, { mapping: ["kind", { target: "kindness" }] }] } }
        - { level: C1, point: { en: "Combining forms" }, rule: { en: "Greek and Latin forms build technical words" }, ex: { examples: [{ target: "biology" }, { target: "geography" }, { target: "telephone" }] } }
        - { level: C1, point: { en: "Register" }, rule: { en: "Latinate words sound more formal than their native partners" }, ex: { examples: [{ equivalence: ["begin", { target: "commence" }] }, { equivalence: ["enough", { target: "sufficient" }] }] } }
        - { level: C2, point: { en: "Look-alikes" }, rule: { en: "a pair of suffixes can split the meaning" }, ex: { examples: [["an ", { target: "economic" }, " crisis"], ["an ", { target: "economical" }, " car"]] } }
        - { level: C2, point: { en: "Rare and new affixes" }, rule: { en: [{ term: "hyper-" }, " and ", { term: "pseudo-" }, " are learned; ", { term: "-holic" }, " and ", { term: "-gate" }, " are coinages"] }, ex: { examples: [{ target: "hypersensitive" }, { target: "pseudonym" }, { target: "workaholic" }] } }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A suffix ends a word and usually sets its class; a prefix starts it and usually keeps the class." }
            ex: { examples: [{ mapping: ["happy", { target: "happiness" }] }, { mapping: ["happy", { target: "unhappy" }] }] }
          - type: rule
            level: B2
            text: { en: "Read a new word in order: the suffix gives the class, the prefix adds meaning, the base the core." }
            ex: { mapping: [{ pattern: ["dis", "agree", "ment"] }, { target: "disagreement" }] }
          - type: rule
            level: B2
            text: { en: ["Letters that look like an affix are not always one: ", { term: "singer" }, " has ", { term: "-er" }, ", ", { term: "finger" }, " does not."] }

  - title: { en: Noun suffixes }
    role: own
    content:
      - type: usage
        columns:
          - { key: suffix, label: { en: Suffix } }
          - { key: makes, label: { en: Makes } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, suffix: { alternatives: [{ term: "-tion" }, { term: "-sion" }, { term: "-ation" }] }, makes: { en: [{ mapping: [{ slot: verb }, { slot: noun }] }, ": the action or its result"] }, ex: { examples: [{ mapping: ["educate", { target: "education" }] }, { mapping: ["decide", { target: "decision" }] }, { mapping: ["inform", { target: "information" }] }] } }
          - { level: B2, suffix: { term: "-ment" }, makes: { en: [{ mapping: [{ slot: verb }, { slot: noun }] }, ": the action or its result"] }, ex: { examples: [{ mapping: ["improve", { target: "improvement" }] }, { mapping: ["develop", { target: "development" }] }, { mapping: ["agree", { target: "agreement" }] }] } }
          - { level: B2, suffix: { term: "-ness" }, makes: { en: [{ mapping: [{ slot: adjective }, { slot: noun }] }, ": a quality or state"] }, ex: { examples: [{ mapping: ["kind", { target: "kindness" }] }, { mapping: ["dark", { target: "darkness" }] }, { mapping: ["happy", { target: "happiness" }] }] } }
          - { level: B2, suffix: { term: "-ity" }, makes: { en: [{ mapping: [{ slot: adjective }, { slot: noun }] }, ": a quality or state"] }, ex: { examples: [{ mapping: ["able", { target: "ability" }] }, { mapping: ["active", { target: "activity" }] }, { mapping: ["popular", { target: "popularity" }] }] } }
          - { level: B2, suffix: { alternatives: [{ term: "-ence" }, { term: "-ance" }] }, makes: { en: [{ mapping: [{ alternatives: [{ slot: verb }, { slot: adjective }] }, { slot: noun }] }, ": an action, quality or state"] }, ex: { examples: [{ mapping: ["perform", { target: "performance" }] }, { mapping: ["differ", { target: "difference" }] }, { mapping: ["important", { target: "importance" }] }] } }
          - { level: B2, suffix: { term: "-ship" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: noun }] }, ": a state, a relationship or a skill"] }, ex: { examples: [{ mapping: ["friend", { target: "friendship" }] }, { mapping: ["member", { target: "membership" }] }, { mapping: ["leader", { target: "leadership" }] }] } }
          - { level: B2, suffix: { term: "-hood" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: noun }] }, ": a stage or state of life"] }, ex: { examples: [{ mapping: ["child", { target: "childhood" }] }, { mapping: ["adult", { target: "adulthood" }] }, { mapping: ["parent", { target: "parenthood" }] }] } }
          - { level: B2, suffix: { term: "-dom" }, makes: { en: [{ mapping: [{ alternatives: [{ slot: noun }, { slot: adjective }] }, { slot: noun }] }, ": a state or a realm"] }, ex: { examples: [{ mapping: ["free", { target: "freedom" }] }, { mapping: ["king", { target: "kingdom" }] }, { mapping: ["bore", { target: "boredom" }] }] } }
          - { level: B2, suffix: { alternatives: [{ term: "-er" }, { term: "-or" }, { term: "-ist" }, { term: "-ian" }] }, makes: { en: [{ mapping: [{ alternatives: [{ slot: verb }, { slot: noun }] }, { slot: person }] }, ": the person who does it"] }, ex: { examples: [{ mapping: ["teach", { target: "teacher" }] }, { mapping: ["art", { target: "artist" }] }, { mapping: ["music", { target: "musician" }] }] } }
          - { level: B2, suffix: { term: "-ism" }, makes: { en: [{ mapping: [{ alternatives: [{ slot: noun }, { slot: adjective }] }, { slot: noun }] }, ": a belief, a system or a practice"] }, ex: { examples: [{ mapping: ["tour", { target: "tourism" }] }, { mapping: ["journal", { target: "journalism" }] }, { mapping: ["real", { target: "realism" }] }] } }
          - { level: B2, suffix: { term: "-th" }, makes: { en: [{ mapping: [{ slot: adjective }, { slot: noun }] }, ": a measure, with a changed vowel"] }, ex: { examples: [{ mapping: ["long", { target: "length" }] }, { mapping: ["deep", { target: "depth" }] }, { mapping: ["wide", { target: "width" }] }, { mapping: ["strong", { target: "strength" }] }] } }

  - title: { en: Adjective suffixes }
    role: own
    content:
      - type: usage
        columns:
          - { key: suffix, label: { en: Suffix } }
          - { key: makes, label: { en: Makes } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, suffix: { alternatives: [{ term: "-able" }, { term: "-ible" }] }, makes: { en: [{ mapping: [{ slot: verb }, { slot: adjective }] }, ": that can be done"] }, ex: { examples: [{ mapping: ["enjoy", { target: "enjoyable" }] }, { mapping: ["accept", { target: "acceptable" }] }, { mapping: ["reverse", { target: "reversible" }] }] } }
          - { level: B2, suffix: { term: "-ful" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": full of"] }, ex: { examples: [{ mapping: ["care", { target: "careful" }] }, { mapping: ["success", { target: "successful" }] }, { mapping: ["use", { target: "useful" }] }] } }
          - { level: B2, suffix: { term: "-less" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": without"] }, ex: { examples: [{ mapping: ["home", { target: "homeless" }] }, { mapping: ["hope", { target: "hopeless" }] }, { mapping: ["end", { target: "endless" }] }] } }
          - { level: B2, suffix: { term: "-ive" }, makes: { en: [{ mapping: [{ slot: verb }, { slot: adjective }] }, ": tending to"] }, ex: { examples: [{ mapping: ["act", { target: "active" }] }, { mapping: ["create", { target: "creative" }] }, { mapping: ["attract", { target: "attractive" }] }] } }
          - { level: B2, suffix: { term: "-ous" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": having the quality"] }, ex: { examples: [{ mapping: ["danger", { target: "dangerous" }] }, { mapping: ["fame", { target: "famous" }] }, { mapping: ["adventure", { target: "adventurous" }] }] } }
          - { level: B2, suffix: { term: "-al" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": relating to"] }, ex: { examples: [{ mapping: ["nation", { target: "national" }] }, { mapping: ["culture", { target: "cultural" }] }, { mapping: ["tradition", { target: "traditional" }] }] } }
          - { level: B2, suffix: { alternatives: [{ term: "-ic" }, { term: "-ical" }] }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": relating to"] }, ex: { examples: [{ mapping: ["artist", { target: "artistic" }] }, { mapping: ["biology", { target: "biological" }] }, { mapping: ["geography", { target: "geographical" }] }] } }
          - { level: B2, suffix: { term: "-y" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": full of, or like"] }, ex: { examples: [{ mapping: ["rain", { target: "rainy" }] }, { mapping: ["salt", { target: "salty" }] }, { mapping: ["health", { target: "healthy" }] }] } }
          - { level: B2, suffix: { term: "-ish" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": like, or typical of"] }, ex: { examples: [{ mapping: ["child", { target: "childish" }] }, { mapping: ["fool", { target: "foolish" }] }, { mapping: ["style", { target: "stylish" }] }] } }
          - { level: B2, suffix: { term: "-ly" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": like, or every"] }, ex: { examples: [{ mapping: ["friend", { target: "friendly" }] }, { mapping: ["love", { target: "lovely" }] }, { mapping: ["week", { target: "weekly" }] }] } }
          - { level: B2, suffix: { alternatives: [{ term: "-ent" }, { term: "-ant" }] }, makes: { en: [{ mapping: [{ slot: verb }, { slot: adjective }] }, ": doing or being"] }, ex: { examples: [{ mapping: ["depend", { target: "dependent" }] }, { mapping: ["please", { target: "pleasant" }] }, { mapping: ["resist", { target: "resistant" }] }] } }

  - title: { en: Verb formation }
    role: own
    content:
      - type: usage
        columns:
          - { key: affix, label: { en: Affix } }
          - { key: makes, label: { en: Makes } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, affix: [{ term: "-ise" }, " ", { variant: { term: "-ize" }, variety: en-US }], makes: { en: [{ mapping: [{ alternatives: [{ slot: adjective }, { slot: noun }] }, { slot: verb }] }, ": make or become"] }, ex: { examples: [[{ mapping: ["modern", { target: "modernise" }] }, " ", { variant: { target: "modernize" }, variety: en-US }], [{ mapping: ["real", { target: "realise" }] }, " ", { variant: { target: "realize" }, variety: en-US }], [{ mapping: ["memory", { target: "memorise" }] }, " ", { variant: { target: "memorize" }, variety: en-US }]] } }
          - { level: B2, affix: { term: "-ify" }, makes: { en: [{ mapping: [{ alternatives: [{ slot: adjective }, { slot: noun }] }, { slot: verb }] }, ": make"] }, ex: { examples: [{ mapping: ["simple", { target: "simplify" }] }, { mapping: ["class", { target: "classify" }] }, { mapping: ["pure", { target: "purify" }] }] } }
          - { level: B2, affix: { term: "-en" }, makes: { en: [{ mapping: [{ alternatives: [{ slot: adjective }, { slot: noun }] }, { slot: verb }] }, ": make or become"] }, ex: { examples: [{ mapping: ["short", { target: "shorten" }] }, { mapping: ["wide", { target: "widen" }] }, { mapping: ["strength", { target: "strengthen" }] }] } }
          - { level: B2, affix: { alternatives: [{ term: "en-" }, { term: "em-" }] }, makes: { en: [{ mapping: [{ alternatives: [{ slot: adjective }, { slot: noun }] }, { slot: verb }] }, ": put into a state; ", { term: "em-" }, " stands before b, m and p"] }, ex: { examples: [{ mapping: ["able", { target: "enable" }] }, { mapping: ["rich", { target: "enrich" }] }, { mapping: ["power", { target: "empower" }] }] } }
          - { level: B2, affix: { term: "be-" }, makes: { en: [{ mapping: [{ alternatives: [{ slot: noun }, { slot: adjective }] }, { slot: verb }] }, ": treat as, or make"] }, ex: { examples: [{ mapping: ["friend", { target: "befriend" }] }, { mapping: ["little", { target: "belittle" }] }] } }

  - title: { en: Negative and reversing prefixes }
    role: own
    content:
      - type: usage
        columns:
          - { key: prefix, label: { en: Prefix } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, prefix: { en: [{ term: "un-" }, " with an adjective or participle"] }, use: { en: "not" }, ex: { examples: [{ mapping: ["happy", { target: "unhappy" }] }, { mapping: ["fair", { target: "unfair" }] }, { mapping: ["finished", { target: "unfinished" }] }] } }
          - { level: B2, prefix: { en: [{ term: "un-" }, " with a verb"] }, use: { en: "reverses the action" }, ex: { examples: [{ mapping: ["do", { target: "undo" }] }, { mapping: ["lock", { target: "unlock" }] }, { mapping: ["pack", { target: "unpack" }] }] } }
          - { level: B2, prefix: { alternatives: [{ term: "in-" }, { term: "im-" }, { term: "il-" }, { term: "ir-" }] }, use: { en: ["not, with an adjective; ", { term: "im-" }, " stands before b, m and p, ", { term: "il-" }, " before l, ", { term: "ir-" }, " before r"] }, ex: { examples: [{ mapping: ["correct", { target: "incorrect" }] }, { mapping: ["possible", { target: "impossible" }] }, { mapping: ["legal", { target: "illegal" }] }, { mapping: ["regular", { target: "irregular" }] }] } }
          - { level: B2, prefix: { term: "dis-" }, use: { en: "the opposite, or the lack of it" }, ex: { examples: [{ mapping: ["agree", { target: "disagree" }] }, { mapping: ["like", { target: "dislike" }] }, { mapping: ["honest", { target: "dishonest" }] }, { mapping: ["connect", { target: "disconnect" }] }] } }
          - { level: B2, prefix: { term: "non-" }, use: { en: "not, or without" }, ex: { examples: [{ mapping: ["stop", { target: "non-stop" }] }, { mapping: ["fiction", { target: "non-fiction" }] }, { mapping: ["smoker", { target: "non-smoker" }] }] } }
          - { level: B2, prefix: { term: "mis-" }, use: { en: "wrongly or badly" }, ex: { examples: [{ mapping: ["understand", { target: "misunderstand" }] }, { mapping: ["spell", { target: "misspell" }] }, { mapping: ["lead", { target: "mislead" }] }] } }
          - { level: B2, prefix: { term: "de-" }, use: { en: "removes or reverses" }, ex: { examples: [{ mapping: ["code", { target: "decode" }] }, { mapping: ["frost", { target: "defrost" }] }, { mapping: ["activate", { target: "deactivate" }] }] } }
          - { level: B2, prefix: { term: "anti-" }, use: { en: "against" }, ex: { examples: [{ mapping: ["social", { target: "antisocial" }] }, [{ mapping: ["clockwise", { target: "anticlockwise" }] }, " ", { variant: { target: "counterclockwise" }, variety: en-US }], { mapping: ["smoking", { target: "anti-smoking" }] }] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "Most bases take only one negative prefix: learn the pair with the word." }
            ex: { examples: [{ target: "unhappy" }, { target: "impossible" }, { target: "dishonest" }] }

  - title: { en: Other prefixes }
    role: own
    content:
      - type: usage
        columns:
          - { key: prefix, label: { en: Prefix } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, prefix: { term: "re-" }, meaning: { en: "again" }, ex: { examples: [{ mapping: ["write", { target: "rewrite" }] }, { mapping: ["build", { target: "rebuild" }] }, { mapping: ["start", { target: "restart" }] }] } }
          - { level: B2, prefix: { term: "pre-" }, meaning: { en: "before" }, ex: { examples: [{ mapping: ["heat", { target: "preheat" }] }, { mapping: ["view", { target: "preview" }] }, { mapping: ["historic", { target: "prehistoric" }] }] } }
          - { level: B2, prefix: { term: "post-" }, meaning: { en: "after" }, ex: { examples: [{ mapping: ["graduate", { target: "postgraduate" }] }, { mapping: ["script", { target: "postscript" }] }] } }
          - { level: B2, prefix: { term: "over-" }, meaning: { en: "too much" }, ex: { examples: [{ mapping: ["work", { target: "overwork" }] }, { mapping: ["cook", { target: "overcook" }] }, { mapping: ["crowded", { target: "overcrowded" }] }] } }
          - { level: B2, prefix: { term: "under-" }, meaning: { en: "too little, or below" }, ex: { examples: [{ mapping: ["pay", { target: "underpay" }] }, { mapping: ["estimate", { target: "underestimate" }] }, { mapping: ["ground", { target: "underground" }] }] } }
          - { level: B2, prefix: { term: "out-" }, meaning: { en: "more or better than" }, ex: { examples: [{ mapping: ["run", { target: "outrun" }] }, { mapping: ["live", { target: "outlive" }] }, { mapping: ["number", { target: "outnumber" }] }] } }
          - { level: B2, prefix: { term: "sub-" }, meaning: { en: "under, below" }, ex: { examples: [{ mapping: ["way", { target: "subway" }] }, { mapping: ["title", { target: "subtitle" }] }, { mapping: ["standard", { target: "substandard" }] }] } }
          - { level: B2, prefix: { term: "super-" }, meaning: { en: "above, more than" }, ex: { examples: [{ mapping: ["market", { target: "supermarket" }] }, { mapping: ["human", { target: "superhuman" }] }, { mapping: ["natural", { target: "supernatural" }] }] } }
          - { level: B2, prefix: { term: "inter-" }, meaning: { en: "between" }, ex: { examples: [{ mapping: ["national", { target: "international" }] }, { mapping: ["act", { target: "interact" }] }, { mapping: ["net", { target: "internet" }] }] } }
          - { level: B2, prefix: { term: "trans-" }, meaning: { en: "across, or into another state" }, ex: { examples: [{ mapping: ["Atlantic", { target: "transatlantic" }] }, { mapping: ["form", { target: "transform" }] }, { mapping: ["plant", { target: "transplant" }] }] } }
          - { level: B2, prefix: { term: "multi-" }, meaning: { en: "many" }, ex: { examples: [{ mapping: ["national", { target: "multinational" }] }, { mapping: ["cultural", { target: "multicultural" }] }, { mapping: ["purpose", { target: "multipurpose" }] }] } }
          - { level: B2, prefix: { term: "semi-" }, meaning: { en: "half, partly" }, ex: { examples: [{ mapping: ["circle", { target: "semicircle" }] }, { mapping: ["final", { target: "semi-final" }] }, { mapping: ["detached", { target: "semi-detached" }] }] } }
          - { level: B2, prefix: { term: "mid-" }, meaning: { en: "the middle of" }, ex: { examples: [{ mapping: ["night", { target: "midnight" }] }, { mapping: ["summer", { target: "midsummer" }] }, { mapping: ["week", { target: "midweek" }] }] } }
          - { level: B2, prefix: { term: "co-" }, meaning: { en: "together" }, ex: { examples: [{ mapping: ["author", { target: "co-author" }] }, { mapping: ["exist", { target: "coexist" }] }, { mapping: ["worker", { target: "co-worker" }] }] } }
          - { level: B2, prefix: { term: "ex-" }, meaning: { en: "former" }, ex: { examples: [{ mapping: ["wife", { target: "ex-wife" }] }, { mapping: ["president", { target: "ex-president" }] }, { mapping: ["boss", { target: "ex-boss" }] }] } }
          - { level: B2, prefix: { term: "self-" }, meaning: { en: "of, to or by oneself" }, ex: { examples: [{ mapping: ["employed", { target: "self-employed" }] }, { mapping: ["confident", { target: "self-confident" }] }, { mapping: ["service", { target: "self-service" }] }] } }
          - { level: B2, prefix: { alternatives: [{ term: "bi-" }, { term: "tri-" }] }, meaning: { en: "two, three" }, ex: { examples: [{ mapping: ["lingual", { target: "bilingual" }] }, { mapping: ["cycle", { target: "bicycle" }] }, { mapping: ["angle", { target: "triangle" }] }] } }

  - title: { en: "Spelling: joining an affix" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: join, label: { en: Join } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, join: { en: [{ term: "-tion" }, " and ", { term: "-sion" }, " after some verbs"] }, rule: { en: "the base changes its letters" }, ex: { examples: [{ mapping: ["explain", { target: "explanation" }] }, { mapping: ["pronounce", { target: "pronunciation" }] }, { mapping: ["repeat", { target: "repetition" }] }, { mapping: ["decide", { target: "decision" }] }] } }
          - { level: B2, join: { alternatives: [{ term: "ex-" }, { term: "self-" }, { term: "non-" }] }, rule: { en: "a hyphen follows the prefix" }, ex: { examples: [{ target: "ex-wife" }, { target: "self-employed" }, { target: "non-stop" }] } }
          - { level: B2, join: { en: "a prefix before a capital letter or a number" }, rule: { en: "a hyphen follows the prefix" }, ex: { examples: [{ target: "anti-American" }, { target: "pre-1990" }, { target: "mid-July" }] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["Doubling, silent e and y to i apply to affixes as to any ending: see ", { link: "Spelling Rules", to: en.foundations.spelling-rules }, "."] }

  - title: { en: "Pronunciation: stress and sound changes" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: change, label: { en: Change } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: B2, change: { en: "stress moves" }, rule: { en: [{ alternatives: [{ term: "-ic" }, { term: "-ical" }, { term: "-ity" }, { term: "-ion" }] }, " put the stress on the syllable before the suffix"] }, ex: { examples: [{ mapping: [[{ stress: "ˈpho" }, "tograph"], { target: ["photo", { stress: "ˈgraph" }, "ic"] }] }, { mapping: [["e", { stress: "ˈlec" }, "tric"], { target: ["elec", { stress: "ˈtri" }, "city"] }] }] } }
          - { level: B2, change: { en: "stress stays" }, rule: { en: [{ alternatives: [{ term: "-ness" }, { term: "-ment" }, { term: "-ful" }, { term: "-ly" }, { term: "un-" }, { term: "dis-" }, { term: "mis-" }] }, " leave the stress on the base"] }, ex: { examples: [{ mapping: [[{ stress: "ˈhap" }, "py"], { target: [{ stress: "ˈhap" }, "piness"] }] }, { mapping: [["a", { stress: "ˈgree" }], { target: ["dis", "a", { stress: "ˈgree" }] }] }] } }
          - { level: B2, change: { en: "the vowel shortens" }, rule: { en: "a long vowel or diphthong often becomes short in the longer word" }, ex: { examples: [{ mapping: [["serene ", { ipa: "səˈriːn" }], [{ target: "serenity" }, " ", { ipa: "səˈrenəti" }]] }, { mapping: [["sane ", { ipa: "seɪn" }], [{ target: "sanity" }, " ", { ipa: "ˈsænəti" }]] }, { mapping: [["divide ", { ipa: "dɪˈvaɪd" }], [{ target: "division" }, " ", { ipa: "dɪˈvɪʒn" }]] }] } }
          - { level: B2, change: { en: "the consonant changes" }, rule: { en: [{ alternatives: [{ term: "-ity" }, { term: "-ian" }] }, " change the sound of a final ", { letter: "c" }] }, ex: { examples: [{ mapping: [["electric ", { ipa: "ɪˈlektrɪk" }], [{ target: "electricity" }, " ", { ipa: "ɪˌlekˈtrɪsəti" }]] }, { mapping: [["music ", { ipa: "ˈmjuːzɪk" }], [{ target: "musician" }, " ", { ipa: "mjuˈzɪʃn" }]] }] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["The stress patterns of suffixes are set out in ", { link: "Sounds and IPA", to: en.foundations.pronunciation-ipa }, "."] }

  - title: { en: Productive suffixes and their limits }
    role: own
    content:
      - type: usage
        columns:
          - { key: suffix, label: { en: Suffix } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, suffix: { term: "-ish" }, rule: { en: "added to an adjective, a number or a time in speech: roughly" }, ex: { examples: [{ mapping: ["tall", { target: "tallish" }] }, { mapping: ["cold", { target: "coldish" }] }, { mapping: ["eight", { target: "eightish" }] }] } }
          - { level: C1, suffix: { term: "-y" }, rule: { en: "added to a noun or verb for an informal adjective of quality" }, ex: { examples: [{ mapping: ["stretch", { target: "stretchy" }] }, { mapping: ["bend", { target: "bendy" }] }, { mapping: ["fizz", { target: "fizzy" }] }] } }
          - { level: C1, suffix: { term: "-able" }, rule: { en: "added to a verb that takes an object, new verbs included" }, ex: { examples: [{ mapping: ["download", { target: "downloadable" }] }, { mapping: ["recycle", { target: "recyclable" }] }, { mapping: ["wash", { target: "washable" }] }] } }
          - { level: C1, suffix: { alternatives: [{ term: "-ise" }, { term: "-ify" }] }, rule: { en: [{ term: "-ise" }, " forms new verbs freely, especially in business; ", { term: "-ify" }, " joins short bases"] }, ex: { examples: [[{ mapping: ["private", { target: "privatise" }] }, " ", { variant: { target: "privatize" }, variety: en-US }], [{ mapping: ["priority", { target: "prioritise" }] }, " ", { variant: { target: "prioritize" }, variety: en-US }], { mapping: ["game", { target: "gamify" }] }] } }
          - { level: C1, suffix: { term: "-ation" }, rule: { en: [{ term: "-ise" }, " gives ", { term: "-isation" }, ", ", { term: "-ify" }, " gives ", { term: "-ification" }] }, ex: { examples: [[{ mapping: ["organise", { target: "organisation" }] }, " ", { variant: { mapping: ["organize", { target: "organization" }] }, variety: en-US }], { mapping: ["simplify", { target: "simplification" }] }] } }
          - { level: C1, suffix: { term: "-ism" }, rule: { en: ["names a movement from a person or a noun; its follower takes ", { term: "-ist" }] }, ex: { examples: [{ mapping: ["minimal", { target: "minimalism" }] }, { mapping: ["Darwin", { target: "Darwinism" }] }, { mapping: ["individual", { target: "individualism" }] }] } }
      - type: usage
        columns:
          - { key: suffix, label: { en: Suffix } }
          - { key: makes, label: { en: Makes } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, suffix: { term: "-proof" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": protected against"] }, ex: { examples: [{ mapping: ["water", { target: "waterproof" }] }, { mapping: ["child", { target: "childproof" }] }, { mapping: ["fire", { target: "fireproof" }] }] } }
          - { level: C1, suffix: { term: "-friendly" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": suited to, or kind to"] }, ex: { examples: [{ mapping: ["user", { target: "user-friendly" }] }, { mapping: ["child", { target: "child-friendly" }] }, { mapping: ["eco", { target: "eco-friendly" }] }] } }
          - { level: C1, suffix: { term: "-free" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": without"] }, ex: { examples: [{ mapping: ["sugar", { target: "sugar-free" }] }, { mapping: ["hassle", { target: "hassle-free" }] }, { mapping: ["tax", { target: "tax-free" }] }] } }
          - { level: C1, suffix: { term: "-led" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adjective }] }, ": directed by"] }, ex: { examples: [{ mapping: ["teacher", { target: "teacher-led" }] }, { mapping: ["student", { target: "student-led" }] }, { mapping: ["export", { target: "export-led" }] }] } }
          - { level: C1, suffix: { term: "-wise" }, makes: { en: [{ mapping: [{ slot: noun }, { slot: adverb }] }, ": as far as the noun is concerned, in informal speech"] }, ex: { examples: [{ mapping: ["money", { target: "moneywise" }] }, { mapping: ["weather", { target: "weatherwise" }] }, { mapping: ["time", { target: "timewise" }] }] } }
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: C1, point: { term: "-ity" }, rule: { en: "usually follows a Latinate adjective" }, ex: { examples: [{ mapping: ["possible", { target: "possibility" }] }, { mapping: ["generous", { target: "generosity" }] }, { mapping: ["electric", { target: "electricity" }] }] } }
          - { level: C1, point: { term: "-ness" }, rule: { en: "usually follows a native adjective, and joins almost any new one" }, ex: { examples: [{ mapping: ["kind", { target: "kindness" }] }, { mapping: ["dark", { target: "darkness" }] }, { mapping: ["awkward", { target: "awkwardness" }] }] } }
          - { level: C1, point: { en: "order of suffixes" }, rule: { en: "each suffix joins the word class that the one before it made" }, ex: [{ mapping: ["nation", "national", "nationalise", { target: "nationalisation" }] }, " ", { variant: { mapping: ["nation", "national", "nationalize", { target: "nationalization" }] }, variety: en-US }] }
          - { level: C1, point: { en: "prefix in a chain" }, rule: { en: "a prefix joins the word it fits, and a suffix can follow" }, ex: { mapping: ["break", "breakable", "unbreakable", { target: "unbreakability" }] } }

  - title: { en: Greek and Latin combining forms }
