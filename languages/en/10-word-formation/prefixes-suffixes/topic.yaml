            text: { en: ["Doubling, silent e and y to i apply to affixes as to any ending: see ", { link: "Spelling Rules", to: en.foundations.spelling-rules }, "."], uk: ["Подвоєння, німе e та заміна y на i діють для афіксів, як і для будь-якого закінчення: див. ", { link: "Правила правопису", to: en.foundations.spelling-rules }, "."], es: ["El doblamiento, la e muda y el cambio de y en i valen para los afijos como para cualquier terminación: véase ", { link: "Reglas de ortografía", to: en.foundations.spelling-rules }, "."], pt: ["A dobra da consoante, o e mudo e a troca de y por i valem para os afixos como para qualquer terminação: veja ", { link: "Regras de ortografia", to: en.foundations.spelling-rules }, "."], fr: ["Le doublement, le e muet et le passage de y à i valent pour les affixes comme pour toute terminaison : voir ", { link: "Règles d’orthographe", to: en.foundations.spelling-rules }, "."], de: ["Verdopplung, stummes e und der Wechsel von y zu i gelten für Affixe wie für jede Endung: siehe ", { link: "Rechtschreibregeln", to: en.foundations.spelling-rules }, "."], it: ["Il raddoppio, la e muta e il passaggio da y a i valgono per gli affissi come per qualsiasi desinenza: vedi ", { link: "Regole di ortografia", to: en.foundations.spelling-rules }, "."], pl: ["Podwojenie, nieme e i zamiana y na i dotyczą afiksów tak samo jak każdej końcówki: zob. ", { link: "Zasady pisowni", to: en.foundations.spelling-rules }, "."], tr: ["Çift yazım, okunmayan e ve y’nin i’ye dönüşmesi, her sözcük sonunda olduğu gibi eklerde de geçerlidir: bkz. ", { link: "Yazım kuralları", to: en.foundations.spelling-rules }, "."], id: ["Penggandaan huruf, e senyap, dan perubahan y menjadi i berlaku untuk afiks seperti untuk akhiran lain: lihat ", { link: "Aturan ejaan", to: en.foundations.spelling-rules }, "."], vi: ["Việc gấp đôi phụ âm, chữ e câm và đổi y thành i áp dụng cho phụ tố như cho mọi đuôi từ: xem ", { link: "Quy tắc chính tả", to: en.foundations.spelling-rules }, "."] }

