            ex: { examples: [["The deal is ", { target: hush-hush }, "."], ["The food was ", { target: so-so }, "."]] }
            tr: { uk: { examples: ["Ця угода — цілком таємна.", "Їжа була так собі."] }, es: { examples: ["El trato es muy secreto.", "La comida estuvo así así."] }, pt: { examples: ["O acordo é supersecreto.", "A comida estava mais ou menos."] }, fr: { examples: ["L’accord est top secret.", "La nourriture était moyenne."] }, de: { examples: ["Der Deal ist streng geheim.", "Das Essen war mittelmäßig."] }, it: { examples: ["L'accordo è segretissimo.", "Il cibo era così così."] }, pl: { examples: ["Ta umowa jest ściśle tajna.", "Jedzenie było takie sobie."] }, tr: { examples: ["Anlaşma çok gizli.", "Yemek şöyle böyleydi."] }, id: { examples: ["Kesepakatan itu sangat rahasia.", "Makanannya biasa saja."] }, vi: { examples: ["Thỏa thuận này là tuyệt mật.", "Đồ ăn cũng tàm tạm."] } }
          - level: C1
            kind: { en: a change of vowel, uk: "зміна голосного", es: "un cambio de vocal", pt: "uma mudança de vogal", fr: "un changement de voyelle", de: "ein Vokalwechsel", it: "un cambio di vocale", pl: "zmiana samogłoski", tr: "ünlü değişimi", id: "perubahan vokal", vi: "đổi nguyên âm" }
