            text: { en: "A noun made from a verb often follows have, take or go for.", uk: "Іменник, утворений від дієслова, часто стоїть після have, take або go for.", es: "Un sustantivo formado de un verbo suele ir después de have, take o go for.", pt: "Um substantivo formado de um verbo costuma vir depois de have, take ou go for.", fr: "Un nom formé à partir d’un verbe suit souvent have, take ou go for.", de: "Ein vom Verb abgeleitetes Nomen steht oft nach have, take oder go for.", it: "Un sostantivo formato da un verbo segue spesso have, take o go for.", pl: "Rzeczownik utworzony od czasownika często stoi po have, take lub go for.", tr: "Fiilden türeyen isim çoğu zaman have, take ya da go for ile kullanılır.", id: "Kata benda bentukan dari kata kerja sering muncul sesudah have, take, atau go for.", vi: "Danh từ tạo từ động từ thường đứng sau have, take hoặc go for." }
