title: { en: Compounds and Conversion, uk: "Складні слова і конверсія", es: "Palabras compuestas y conversión", pt: "Palavras compostas e conversão", fr: "Mots composés et conversion", de: "Zusammensetzungen und Konversion", it: "Parole composte e conversione", pl: "Wyrazy złożone i konwersja", tr: "Bileşik sözcükler ve tür dönüşümü", id: "Kata majemuk dan konversi", vi: "Từ ghép và chuyển loại từ" }
summary:
  lead:
    en: Compounds join two words into one meaning, and conversion gives a word a new class with no change of form.
    uk: "Складні слова поєднують два слова в одне значення, а конверсія дає слову нову частину мови без зміни форми."
    es: "Los compuestos unen dos palabras en un solo significado, y la conversión da a una palabra una clase nueva sin cambiar su forma."
    pt: "Os compostos unem duas palavras em um só significado, e a conversão dá a uma palavra uma classe nova sem mudar sua forma."
    fr: "Les mots composés réunissent deux mots en un seul sens, et la conversion donne à un mot une nouvelle catégorie sans changer sa forme."
    de: "Zusammensetzungen verbinden zwei Wörter zu einer Bedeutung, und Konversion gibt einem Wort eine neue Wortart ohne Formänderung."
    it: "Le parole composte uniscono due parole in un solo significato, e la conversione dà a una parola una nuova categoria senza cambiare forma."
    pl: "Wyrazy złożone łączą dwa wyrazy w jedno znaczenie, a konwersja nadaje wyrazowi nową część mowy bez zmiany formy."
    tr: "Bileşik sözcükler iki sözcüğü tek bir anlamda birleştirir; tür dönüşümü ise bir sözcüğe biçimini değiştirmeden yeni bir tür kazandırır."
    id: "Kata majemuk menggabungkan dua kata menjadi satu makna, dan konversi memberi kata kelas baru tanpa mengubah bentuknya."
    vi: "Từ ghép nối hai từ thành một nghĩa, còn chuyển loại từ cho một từ loại mới mà không đổi hình thức."
  rule:
    en: "A number in a compound adjective keeps its noun singular:"
    uk: "Іменник у складному прикметнику з числівником залишається в однині:"
    es: "Un número en un adjetivo compuesto deja su sustantivo en singular:"
    pt: "Um número em um adjetivo composto mantém o substantivo no singular:"
    fr: "Un nombre dans un adjectif composé garde son nom au singulier :"
    de: "Eine Zahl in einem zusammengesetzten Adjektiv lässt ihr Nomen im Singular:"
    it: "Un numero in un aggettivo composto lascia il suo sostantivo al singolare:"
    pl: "Liczebnik w przymiotniku złożonym zostawia rzeczownik w liczbie pojedynczej:"
    tr: "Bileşik sıfattaki sayı, ismini tekil bırakır:"
    id: "Angka dalam kata sifat majemuk membuat kata bendanya tetap tunggal:"
    vi: "Số đếm trong tính từ ghép giữ danh từ ở số ít:"
  ex: { examples: [["a ", { target: ten-minute }, " walk"], ["a ", { target: five-year-old }, " boy."]] }

