      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A hyphen binds each compound in a chain of modifiers before a noun.", uk: "Дефіс зв’язує кожне складне слово в ланцюжку означень перед іменником.", es: "Un guion une cada compuesto en una cadena de modificadores antes de un sustantivo.", pt: "Um hífen une cada composto em uma sequência de modificadores antes de um substantivo.", fr: "Un trait d’union lie chaque mot composé dans une série de modificateurs avant un nom.", de: "Ein Bindestrich verbindet jede Zusammensetzung in einer Kette von Attributen vor einem Nomen.", it: "Un trattino lega ogni composto in una serie di modificatori prima di un sostantivo.", pl: "Łącznik wiąże każdy wyraz złożony w ciągu określeń przed rzeczownikiem.", tr: "Bir ismin önündeki niteleyici zincirinde tire her bileşiği kendi içinde bağlar.", id: "Tanda hubung mengikat setiap kata majemuk dalam rangkaian pewatas sebelum kata benda.", vi: "Dấu gạch nối gắn từng từ ghép trong chuỗi từ bổ nghĩa đứng trước danh từ." }
            ex: ["a ", { target: low-cost }, ", ", { target: family-run }, " hotel"]
            tr: { uk: "недорогий сімейний готель", es: "un hotel económico y familiar", pt: "um hotel barato e familiar", fr: "un hôtel bon marché tenu par une famille", de: "ein günstiges, familiengeführtes Hotel", it: "un hotel economico a conduzione familiare", pl: "tani hotel rodzinny", tr: "ucuz, aile işletmesi bir otel", id: "hotel murah yang dikelola keluarga", vi: "một khách sạn giá rẻ do gia đình điều hành" }
          - type: rule
            level: C1
            text: { en: "Two compounds that share their last part leave the first with a hanging hyphen.", uk: "Якщо в двох складних слів спільна остання частина, у першого лишається висячий дефіс.", es: "Si dos compuestos comparten la última parte, el primero queda con un guion colgante.", pt: "Se dois compostos compartilham a última parte, o primeiro fica com um hífen pendente.", fr: "Quand deux mots composés partagent leur dernière partie, le premier garde un trait d’union suspendu.", de: "Teilen zwei Zusammensetzungen ihren letzten Teil, behält die erste einen Ergänzungsbindestrich.", it: "Quando due composti hanno in comune l'ultima parte, il primo resta con un trattino sospeso.", pl: "Gdy dwa wyrazy złożone mają wspólną ostatnią część, pierwszy zostaje z wiszącym łącznikiem.", tr: "Son parçası ortak iki bileşikte birincisi askıda bir tireyle kalır.", id: "Jika dua kata majemuk memakai bagian akhir yang sama, yang pertama tersisa dengan tanda hubung menggantung.", vi: "Hai từ ghép chung phần cuối thì từ đầu giữ một dấu gạch nối treo." }
            ex: ["a ", { target: two- or three-bedroom }, " flat ", { variant: apartment, variety: en-US }]
            tr: { uk: "квартира з двома чи трьома спальнями", es: "un apartamento de dos o tres dormitorios", pt: "um apartamento de dois ou três quartos", fr: "un appartement de deux ou trois chambres", de: "eine Zwei- oder Dreizimmerwohnung", it: "un appartamento con due o tre camere da letto", pl: "mieszkanie z dwiema lub trzema sypialniami", tr: "iki ya da üç yatak odalı bir daire", id: "apartemen dengan dua atau tiga kamar tidur", vi: "một căn hộ hai hoặc ba phòng ngủ" }

