            where: { en: "social media, business and sport", uk: "соціальні мережі, бізнес і спорт", es: "redes sociales, negocios y deporte", pt: "redes sociais, negócios e esporte", fr: "réseaux sociaux, affaires et sport", de: "soziale Medien, Wirtschaft und Sport", it: "social media, affari e sport", pl: "media społecznościowe, biznes i sport", tr: "sosyal medya, iş dünyası ve spor", id: "media sosial, bisnis, dan olahraga", vi: "mạng xã hội, kinh doanh và thể thao" }
            ex: { examples: [["Do you ", { target: friend }, " people you have never met?"], ["They ", { target: gifted }, " the museum a painting."], ["She ", { target: medalled }, " ", { variant: medaled, variety: en-US }, " in the 200 metres."]] }
            tr: { uk: { examples: ["Ти додаєш у друзі людей, яких ніколи не зустрічав?", "Вони подарували музею картину.", "Вона здобула медаль на дистанції 200 метрів."] }, es: { examples: ["¿Agregas como amigos a personas que nunca has conocido?", "Le regalaron un cuadro al museo.", "Ganó una medalla en los 200 metros."] }, pt: { examples: ["Você adiciona como amigos pessoas que nunca conheceu?", "Eles doaram uma pintura ao museu.", "Ela ganhou uma medalha nos 200 metros."] }, fr: { examples: ["Tu ajoutes comme amis des gens que tu n’as jamais rencontrés ?", "Ils ont offert un tableau au musée.", "Elle a décroché une médaille au 200 mètres."] }, de: { examples: ["Fügst du Leute als Freunde hinzu, die du nie getroffen hast?", "Sie haben dem Museum ein Gemälde geschenkt.", "Sie hat über 200 Meter eine Medaille gewonnen."] }, it: { examples: ["Aggiungi come amici persone che non hai mai incontrato?", "Hanno regalato un quadro al museo.", "Ha vinto una medaglia nei 200 metri."] }, pl: { examples: ["Dodajesz do znajomych ludzi, których nigdy nie spotkałeś?", "Podarowali muzeum obraz.", "Zdobyła medal na 200 metrów."] }, tr: { examples: ["Hiç tanışmadığın insanları arkadaş olarak ekliyor musun?", "Müzeye bir tablo hediye ettiler.", "200 metrede madalya kazandı."] }, id: { examples: ["Apakah kamu menambahkan orang yang belum pernah kamu temui sebagai teman?", "Mereka menghadiahkan sebuah lukisan kepada museum.", "Dia meraih medali di nomor 200 meter."] }, vi: { examples: ["Bạn có kết bạn với những người chưa từng gặp không?", "Họ tặng bảo tàng một bức tranh.", "Cô ấy giành huy chương ở nội dung 200 mét."] } }
          - level: C2
            kind: { en: a phrase used as a modifier, uk: "словосполучення в ролі означення", es: "un grupo de palabras usado como modificador", pt: "um grupo de palavras usado como modificador", fr: "un groupe de mots employé comme modificateur", de: "eine als Attribut verwendete Wortgruppe", it: "una locuzione usata come modificatore", pl: "wyrażenie użyte jako określenie", tr: "niteleyici olarak kullanılan öbek", id: "frasa yang dipakai sebagai pewatas", vi: "cụm từ dùng như từ bổ nghĩa" }
            where: { en: journalism, uk: "журналістика", es: "periodismo", pt: "jornalismo", fr: "journalisme", de: "Journalismus", it: "giornalismo", pl: "dziennikarstwo", tr: "gazetecilik", id: "jurnalisme", vi: "báo chí" }
            ex: ["His ", { target: I-told-you-so }, " smile annoyed her."]
            tr: { uk: "Його усмішка у стилі «а я ж казав» дратувала її.", es: "Su sonrisa de «te lo dije» la molestó.", pt: "O sorriso de “eu avisei” dele a irritou.", fr: "Son sourire du genre « je te l’avais bien dit » l’agaçait.", de: "Sein „Ich hab's ja gesagt“-Lächeln ärgerte sie.", it: "Il suo sorriso da «te l'avevo detto» la irritava.", pl: "Jego uśmiech w stylu „a nie mówiłem” ją irytował.", tr: "“Ben demiştim” diyen gülümsemesi onu kızdırdı.", id: "Senyum “sudah kubilang” darinya membuatnya kesal.", vi: "Nụ cười kiểu “tôi đã bảo rồi mà” của anh ấy làm cô ấy bực." }
          - level: C2
            kind: { en: a phrase used as a modifier, uk: "словосполучення в ролі означення", es: "un grupo de palabras usado como modificador", pt: "um grupo de palavras usado como modificador", fr: "un groupe de mots employé comme modificateur", de: "eine als Attribut verwendete Wortgruppe", it: "una locuzione usata come modificatore", pl: "wyrażenie użyte jako określenie", tr: "niteleyici olarak kullanılan öbek", id: "frasa yang dipakai sebagai pewatas", vi: "cụm từ dùng như từ bổ nghĩa" }
            where: { en: advertising, uk: "реклама", es: "publicidad", pt: "publicidade", fr: "publicité", de: "Werbung", it: "pubblicità", pl: "reklama", tr: "reklamcılık", id: "iklan", vi: "quảng cáo" }
            ex: ["Taste the ", { target: fresh-from-the-oven }, " difference."]
            tr: { uk: "Відчуй різницю: свіжо з печі.", es: "Prueba la diferencia de lo recién salido del horno.", pt: "Experimente a diferença do que acabou de sair do forno.", fr: "Goûte la différence du tout juste sorti du four.", de: "Schmecke den Unterschied: ofenfrisch.", it: "Assaggia la differenza di ciò che esce dal forno.", pl: "Poczuj różnicę prosto z pieca.", tr: "Fırından yeni çıkmış olmanın farkını tat.", id: "Rasakan bedanya yang baru keluar dari oven.", vi: "Hãy nếm sự khác biệt của món vừa ra lò." }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A nonce compound serves one occasion, and hyphens bind its words into one modifier.", uk: "Разове складне слово виникає для одного випадку, а дефіси об’єднують його слова в одне означення.", es: "Un compuesto ocasional sirve para una sola ocasión, y los guiones unen sus palabras en un solo modificador.", pt: "Um composto ocasional serve a uma só ocasião, e os hífens unem suas palavras em um único modificador.", fr: "Un mot composé de circonstance sert une seule occasion, et les traits d’union réunissent ses mots en un seul modificateur.", de: "Eine Gelegenheitsbildung dient nur einem Anlass, und Bindestriche verbinden ihre Wörter zu einem Attribut.", it: "Un composto occasionale serve per una sola occasione, e i trattini uniscono le sue parole in un solo modificatore.", pl: "Okazjonalizm służy jednej okazji, a łączniki wiążą jego wyrazy w jedno określenie.", tr: "Tek seferlik bileşik tek bir durum için kullanılır; tireler sözcüklerini tek bir niteleyicide birleştirir.", id: "Kata majemuk sesaat dipakai untuk satu kesempatan, dan tanda hubung mengikat kata-katanya menjadi satu pewatas.", vi: "Từ ghép tạm thời chỉ dùng một lần; dấu gạch nối gắn các từ thành một từ bổ nghĩa." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: a ten-minutes walk, right: ["a ", { target: ten-minute }, " walk"], rule: { en: "the noun after a number stays singular", uk: "іменник після числівника залишається в однині", es: "el sustantivo después de un número queda en singular", pt: "o substantivo depois de um número fica no singular", fr: "le nom après un nombre reste au singulier", de: "das Nomen nach einer Zahl bleibt im Singular", it: "il sostantivo dopo un numero resta al singolare", pl: "rzeczownik po liczebniku pozostaje w liczbie pojedynczej", tr: "sayıdan sonraki isim tekil kalır", id: "kata benda setelah angka tetap tunggal", vi: "danh từ sau số đếm vẫn ở số ít" } }
          - { level: B2, wrong: She sells home-make jam., right: ["She sells ", { target: home-made }, " jam."], rule: { en: "the second part is a participle", uk: "друга частина — дієприкметник", es: "la segunda parte es un participio", pt: "a segunda parte é um particípio", fr: "la seconde partie est un participe", de: "der zweite Teil ist ein Partizip", it: "la seconda parte è un participio", pl: "druga część jest imiesłowem", tr: "ikinci parça bir ortaçtır", id: "bagian kedua adalah partisipel", vi: "phần thứ hai là một phân từ" } }
          - { level: B2, wrong: He babysitted the children., right: ["He ", { target: babysat }, " the children."], rule: { en: "a compound verb inflects like its last word", uk: "складне дієслово змінюється, як його останнє слово", es: "un verbo compuesto se conjuga como su última palabra", pt: "um verbo composto se conjuga como sua última palavra", fr: "un verbe composé se conjugue comme son dernier mot", de: "ein zusammengesetztes Verb wird wie sein letztes Wort gebeugt", it: "un verbo composto si coniuga come la sua ultima parola", pl: "czasownik złożony odmienia się jak jego ostatni człon", tr: "bileşik fiil son sözcüğü gibi çekimlenir", id: "kata kerja majemuk berubah bentuk seperti kata terakhirnya", vi: "động từ ghép chia theo từ cuối của nó" } }
          - { level: B2, wrong: a MP, right: ["an ", { target: MP }], rule: { en: ["the first sound of ", { term: MP }, " is a vowel, so it takes ", { term: an }], uk: ["перший звук в ", { term: "MP" }, " — голосний, тому береться ", { term: "an" }], es: ["el primer sonido de ", { term: "MP" }, " es una vocal, así que lleva ", { term: "an" }], pt: ["o primeiro som de ", { term: "MP" }, " é uma vogal, então leva ", { term: "an" }], fr: ["le premier son de ", { term: "MP" }, " est une voyelle, donc il prend ", { term: "an" }], de: ["der erste Laut von ", { term: "MP" }, " ist ein Vokal, deshalb steht ", { term: "an" }], it: ["il primo suono di ", { term: "MP" }, " è una vocale, quindi prende ", { term: "an" }], pl: ["pierwszy dźwięk w ", { term: "MP" }, " to samogłoska, więc stoi ", { term: "an" }], tr: [{ term: "MP" }, " kısaltmasının ilk sesi ünlüdür, bu yüzden ", { term: "an" }, " alır"], id: ["bunyi pertama ", { term: "MP" }, " adalah vokal, jadi memakai ", { term: "an" }], vi: ["âm đầu của ", { term: "MP" }, " là nguyên âm, nên dùng ", { term: "an" }] } }
          - { level: B2, wrong: two CD's, right: ["two ", { target: CDs }], rule: { en: "an initialism takes -s with no apostrophe", uk: "до абревіатури додається -s без апострофа", es: "una sigla toma -s sin apóstrofo", pt: "uma sigla recebe -s sem apóstrofo", fr: "un sigle prend -s sans apostrophe", de: "ein Buchstabenkürzel nimmt -s ohne Apostroph", it: "una sigla prende -s senza apostrofo", pl: "skrótowiec przyjmuje -s bez apostrofu", tr: "baş harf kısaltması kesme işareti olmadan -s alır", id: "singkatan menerima -s tanpa apostrof", vi: "chữ viết tắt thêm -s, không có dấu nháy đơn" } }
          - { level: C1, wrong: a saving account, right: ["a ", { target: savings }, " account"], rule: { en: "this modifier keeps its plural form", uk: "це означення зберігає форму множини", es: "este modificador conserva su forma plural", pt: "este modificador mantém sua forma plural", fr: "ce modificateur garde sa forme plurielle", de: "dieses Attribut behält seine Pluralform", it: "questo modificatore mantiene la forma plurale", pl: "to określenie zachowuje formę liczby mnogiej", tr: "bu niteleyici çoğul biçimini korur", id: "pewatas ini tetap berbentuk jamak", vi: "định ngữ này giữ dạng số nhiều" } }
          - { level: C1, wrong: a woman magazine, right: ["a ", { target: women's }, " magazine"], rule: { en: "an irregular plural takes 's as a modifier", uk: "неправильна множина в ролі означення приймає 's", es: "un plural irregular lleva 's como modificador", pt: "um plural irregular leva 's como modificador", fr: "un pluriel irrégulier prend 's comme modificateur", de: "ein unregelmäßiger Plural nimmt als Attribut 's", it: "un plurale irregolare prende 's come modificatore", pl: "nieregularna liczba mnoga przyjmuje 's jako określenie", tr: "düzensiz çoğul niteleyici olarak 's alır", id: "bentuk jamak tak beraturan memakai 's sebagai pewatas", vi: "số nhiều bất quy tắc nhận 's khi làm định ngữ" } }
          - { level: C1, wrong: a two or three bedroom flat, right: ["a ", { target: two- or three-bedroom }, " flat"], rule: { en: "a hanging hyphen shows the shared last part", uk: "висячий дефіс показує спільну останню частину", es: "un guion colgante indica la última parte compartida", pt: "um hífen pendente indica a última parte compartilhada", fr: "un trait d’union suspendu signale la dernière partie commune", de: "ein Ergänzungsbindestrich zeigt den gemeinsamen letzten Teil", it: "un trattino sospeso indica l'ultima parte in comune", pl: "wiszący łącznik pokazuje wspólną ostatnią część", tr: "askıdaki tire ortak son parçayı gösterir", id: "tanda hubung menggantung menunjukkan bagian akhir yang sama", vi: "dấu gạch nối treo cho thấy phần cuối chung" } }
          - { level: C1, wrong: a teacher-lead class, right: ["a ", { target: teacher-led }, " class"], rule: { en: [{ term: "-led" }, " is the participle of ", { term: lead }], uk: [{ term: "-led" }, " — дієприкметник від ", { term: "lead" }], es: [{ term: "-led" }, " es el participio de ", { term: "lead" }], pt: [{ term: "-led" }, " é o particípio de ", { term: "lead" }], fr: [{ term: "-led" }, " est le participe de ", { term: "lead" }], de: [{ term: "-led" }, " ist das Partizip von ", { term: "lead" }], it: [{ term: "-led" }, " è il participio di ", { term: "lead" }], pl: [{ term: "-led" }, " to imiesłów od ", { term: "lead" }], tr: [{ term: "-led" }, ", ", { term: "lead" }, " fiilinin ortacıdır"], id: [{ term: "-led" }, " adalah partisipel dari ", { term: "lead" }], vi: [{ term: "-led" }, " là phân từ của ", { term: "lead" }] } }
          - { level: C2, wrong: chips and fish, right: { target: fish and chips }, rule: { en: "a frozen binomial keeps its order", uk: "усталена пара слів зберігає порядок", es: "un binomio fijo mantiene su orden", pt: "um binômio fixo mantém sua ordem", fr: "un binôme figé garde son ordre", de: "ein festes Wortpaar behält seine Reihenfolge", it: "un binomio fisso mantiene il suo ordine", pl: "utarta para wyrazów zachowuje kolejność", tr: "kalıplaşmış ikili sırasını korur", id: "pasangan kata tetap mempertahankan urutannya", vi: "cặp từ cố định giữ nguyên thứ tự" } }
          - { level: C2, wrong: gentlemen and ladies, right: { target: ladies and gentlemen }, rule: { en: "the greeting keeps its order", uk: "вітання зберігає свій порядок", es: "el saludo mantiene su orden", pt: "a saudação mantém sua ordem", fr: "la formule d’appel garde son ordre", de: "die Anrede behält ihre Reihenfolge", it: "il saluto mantiene il suo ordine", pl: "formuła powitania zachowuje kolejność", tr: "hitap sırasını korur", id: "sapaan itu mempertahankan urutannya", vi: "lời chào giữ nguyên thứ tự" } }
          - { level: C2, wrong: a very blackbird, right: ["a ", { target: very black }, " bird"], rule: { en: "only the phrase takes a degree word", uk: "слово міри приймає лише словосполучення", es: "solo el grupo de palabras admite una palabra de grado", pt: "só o grupo de palavras aceita uma palavra de grau", fr: "seul le groupe de mots accepte un mot de degré", de: "nur die Wortgruppe nimmt ein Gradwort", it: "solo la locuzione accetta una parola di grado", pl: "tylko wyrażenie przyjmuje słowo stopnia", tr: "yalnızca öbek bir derece sözcüğü alır", id: "hanya frasa yang menerima kata derajat", vi: "chỉ cụm từ mới nhận từ chỉ mức độ" } }
