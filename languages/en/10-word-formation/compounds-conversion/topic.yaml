          - type: note
            level: C1
            text: { en: ["The 's of a classifying modifier: ", { link: "Possessive 's", to: en.nouns-determiners.possessive-s }, "."], uk: ["'s в означенні, що вказує на клас: ", { link: "Присвійний 's", to: en.nouns-determiners.possessive-s }, "."], es: ["El 's de un modificador que clasifica: ", { link: "El posesivo 's", to: en.nouns-determiners.possessive-s }, "."], pt: ["O 's de um modificador que classifica: ", { link: "O possessivo 's", to: en.nouns-determiners.possessive-s }, "."], fr: ["Le 's d’un modificateur de classe : ", { link: "Le génitif 's", to: en.nouns-determiners.possessive-s }, "."], de: ["Das 's eines klassifizierenden Attributs: ", { link: "Der s-Genitiv", to: en.nouns-determiners.possessive-s }, "."], it: ["Il 's di un modificatore che classifica: ", { link: "Il genitivo sassone 's", to: en.nouns-determiners.possessive-s }, "."], pl: ["'s w określeniu klasyfikującym: ", { link: "Dopełniacz saksoński 's", to: en.nouns-determiners.possessive-s }, "."], tr: ["Sınıflandırıcı niteleyicideki 's: ", { link: "İyelik 's", to: en.nouns-determiners.possessive-s }, "."], id: ["'s pada pewatas penggolong: ", { link: "Kepemilikan dengan 's", to: en.nouns-determiners.possessive-s }, "."], vi: ["'s trong định ngữ phân loại: ", { link: "Sở hữu cách 's", to: en.nouns-determiners.possessive-s }, "."] }

