            tr: { uk: { examples: ["поглянути", "прогулятися", "поплавати"] }, es: { examples: ["echar un vistazo", "dar un paseo", "ir a nadar"] }, pt: { examples: ["dar uma olhada", "dar uma caminhada", "ir nadar"] }, fr: { examples: ["jeter un coup d’œil", "faire une promenade", "aller nager"] }, de: { examples: ["einen Blick werfen", "einen Spaziergang machen", "schwimmen gehen"] }, it: { examples: ["dare un'occhiata", "fare una passeggiata", "andare a nuotare"] }, pl: { examples: ["rzucić okiem", "pójść na spacer", "pójść popływać"] }, tr: { examples: ["göz atmak", "yürüyüşe çıkmak", "yüzmeye gitmek"] }, id: { examples: ["melihat sekilas", "berjalan-jalan", "pergi berenang"] }, vi: { examples: ["nhìn qua", "đi dạo", "đi bơi"] } }
          - type: rule
