        - { level: C1, point: { en: Plural modifier, uk: "Означення у множині", es: "Modificador en plural", pt: "Modificador no plural", fr: "Modificateur au pluriel", de: "Attribut im Plural", it: "Modificatore al plurale", pl: "Określenie w liczbie mnogiej", tr: "Çoğul niteleyici", id: "Pewatas jamak", vi: "Định ngữ số nhiều" }, rule: { en: "a few modifiers keep a plural form", uk: "кілька означень зберігають форму множини", es: "unos pocos modificadores conservan la forma plural", pt: "alguns modificadores mantêm a forma plural", fr: "quelques modificateurs gardent leur forme plurielle", de: "einige Attribute behalten die Pluralform", it: "alcuni modificatori mantengono la forma plurale", pl: "kilka określeń zachowuje formę liczby mnogiej", tr: "birkaç niteleyici çoğul biçimini korur", id: "beberapa pewatas tetap berbentuk jamak", vi: "một vài định ngữ giữ dạng số nhiều" }, ex: { examples: [["a ", { target: sports }, " car"], ["a ", { target: women's }, " magazine"]] }, tr: { uk: { examples: ["спортивний автомобіль", "жіночий журнал"] }, es: { examples: ["un auto deportivo", "una revista femenina"] }, pt: { examples: ["um carro esportivo", "uma revista feminina"] }, fr: { examples: ["une voiture de sport", "un magazine féminin"] }, de: { examples: ["ein Sportwagen", "eine Frauenzeitschrift"] }, it: { examples: ["un'auto sportiva", "una rivista femminile"] }, pl: { examples: ["samochód sportowy", "magazyn dla kobiet"] }, tr: { examples: ["spor araba", "kadın dergisi"] }, id: { examples: ["mobil sport", "majalah wanita"] }, vi: { examples: ["một chiếc xe thể thao", "một tạp chí phụ nữ"] } } }
        - { level: C1, point: { en: Reduplication, uk: "Редуплікація", es: "Reduplicación", pt: "Reduplicação", fr: "Redoublement", de: "Reduplikation", it: "Reduplicazione", pl: "Reduplikacja", tr: "İkileme", id: "Reduplikasi", vi: "Từ láy" }, rule: { en: "the vowel changes in the repeat; i comes before a or o", uk: "у повторі голосний змінюється; i стоїть перед a або o", es: "la vocal cambia en la repetición; la i va antes que la a o la o", pt: "a vogal muda na repetição; o i vem antes do a ou do o", fr: "la voyelle change dans la répétition ; i vient avant a ou o", de: "der Vokal wechselt in der Wiederholung; i steht vor a oder o", it: "la vocale cambia nella ripetizione; la i viene prima della a o della o", pl: "w powtórzeniu zmienia się samogłoska; i stoi przed a lub o", tr: "tekrarda ünlü değişir; i ünlüsü a ya da o ünlüsünden önce gelir", id: "vokal berubah pada pengulangan; i mendahului a atau o", vi: "nguyên âm đổi ở phần lặp; i đứng trước a hoặc o" }, ex: { examples: [{ target: zigzag }, { target: ping-pong }] }, tr: { uk: { examples: ["зигзаг", "пінг-понг"] }, es: { examples: ["zigzag", "ping-pong"] }, pt: { examples: ["zigue-zague", "pingue-pongue"] }, fr: { examples: ["zigzag", "ping-pong"] }, de: { examples: ["Zickzack", "Tischtennis"] }, it: { examples: ["zigzag", "ping-pong"] }, pl: { examples: ["zygzak", "ping-pong"] }, tr: { examples: ["zikzak", "pinpon"] }, id: { examples: ["zig-zag", "tenis meja"] }, vi: { examples: ["đường ngoằn ngoèo", "bóng bàn"] } } }
        - { level: C1, point: { en: Productive element, uk: "Продуктивний елемент", es: "Elemento productivo", pt: "Elemento produtivo", fr: "Élément productif", de: "Produktives Element", it: "Elemento produttivo", pl: "Produktywny element", tr: "Üretken öğe", id: "Unsur produktif", vi: "Yếu tố tạo từ" }, rule: { en: ["an element such as ", { term: "-free" }, ", ", { term: "-proof" }, " or ", { term: "-led" }, " makes new adjectives"], uk: ["елемент на зразок ", { term: "-free" }, ", ", { term: "-proof" }, " або ", { term: "-led" }, " утворює нові прикметники"], es: ["un elemento como ", { term: "-free" }, ", ", { term: "-proof" }, " o ", { term: "-led" }, " forma adjetivos nuevos"], pt: ["um elemento como ", { term: "-free" }, ", ", { term: "-proof" }, " ou ", { term: "-led" }, " forma novos adjetivos"], fr: ["un élément comme ", { term: "-free" }, ", ", { term: "-proof" }, " ou ", { term: "-led" }, " forme de nouveaux adjectifs"], de: ["ein Element wie ", { term: "-free" }, ", ", { term: "-proof" }, " oder ", { term: "-led" }, " bildet neue Adjektive"], it: ["un elemento come ", { term: "-free" }, ", ", { term: "-proof" }, " o ", { term: "-led" }, " forma nuovi aggettivi"], pl: ["element taki jak ", { term: "-free" }, ", ", { term: "-proof" }, " czy ", { term: "-led" }, " tworzy nowe przymiotniki"], tr: [{ term: "-free" }, ", ", { term: "-proof" }, " ya da ", { term: "-led" }, " gibi bir öğe yeni sıfatlar türetir"], id: ["unsur seperti ", { term: "-free" }, ", ", { term: "-proof" }, " atau ", { term: "-led" }, " membentuk kata sifat baru"], vi: ["yếu tố như ", { term: "-free" }, ", ", { term: "-proof" }, " hoặc ", { term: "-led" }, " tạo ra tính từ mới"] }, ex: ["a ", { target: sugar-free }, " drink"], tr: { uk: "напій без цукру", es: "una bebida sin azúcar", pt: "uma bebida sem açúcar", fr: "une boisson sans sucre", de: "ein zuckerfreies Getränk", it: "una bevanda senza zucchero", pl: "napój bez cukru", tr: "şekersiz bir içecek", id: "minuman bebas gula", vi: "một đồ uống không đường" } }
        - { level: C2, point: { en: Binomial, uk: "Пара слів", es: "Binomio", pt: "Binômio", fr: "Binôme", de: "Wortpaar", it: "Binomio", pl: "Para wyrazów", tr: "İkili kalıp", id: "Pasangan kata", vi: "Cặp từ" }, rule: { en: "the order is fixed by length, sound or custom", uk: "порядок слів визначають довжина, звучання або звичка", es: "el orden lo fijan la longitud, el sonido o la costumbre", pt: "a ordem é fixada pelo tamanho, pelo som ou pelo costume", fr: "l’ordre est fixé par la longueur, le son ou l’usage", de: "die Reihenfolge ist durch Länge, Klang oder Gewohnheit festgelegt", it: "l'ordine è fissato da lunghezza, suono o consuetudine", pl: "kolejność wyznaczają długość, brzmienie lub zwyczaj", tr: "sırayı uzunluk, ses ya da alışkanlık belirler", id: "urutannya ditetapkan oleh panjang, bunyi, atau kebiasaan", vi: "thứ tự được quy định bởi độ dài, âm thanh hoặc thói quen" }, ex: { examples: [{ target: fish and chips }, { target: null and void }] }, tr: { uk: { examples: ["риба з картоплею фрі", "недійсний, без юридичної сили"] }, es: { examples: ["pescado con papas fritas", "nulo y sin valor"] }, pt: { examples: ["peixe com batatas fritas", "nulo e sem efeito"] }, fr: { examples: ["poisson-frites", "nul et non avenu"] }, de: { examples: ["Fisch mit Pommes", "null und nichtig"] }, it: { examples: ["pesce e patatine fritte", "nullo e privo di effetto"] }, pl: { examples: ["ryba z frytkami", "nieważny i bezskuteczny"] }, tr: { examples: ["balık ve patates kızartması", "geçersiz ve hükümsüz"] }, id: { examples: ["ikan dan kentang goreng", "batal demi hukum"] }, vi: { examples: ["cá chiên và khoai tây chiên", "vô hiệu"] } } }
        - { level: C2, point: { en: Compound or phrase, uk: "Складне слово чи словосполучення", es: "Compuesto o grupo de palabras", pt: "Composto ou grupo de palavras", fr: "Mot composé ou groupe de mots", de: "Zusammensetzung oder Wortgruppe", it: "Parola composta o locuzione", pl: "Wyraz złożony czy wyrażenie", tr: "Bileşik sözcük mü sözcük öbeği mi", id: "Kata majemuk atau frasa", vi: "Từ ghép hay cụm từ" }, rule: { en: "a compound takes first-word stress and can mean more than its parts", uk: "складне слово має наголос на першому слові й може значити більше, ніж його частини", es: "un compuesto lleva el acento en la primera palabra y puede significar más que sus partes", pt: "um composto tem o acento na primeira palavra e pode significar mais que suas partes", fr: "un mot composé est accentué sur le premier mot et peut avoir plus de sens que ses parties", de: "eine Zusammensetzung wird auf dem ersten Wort betont und kann mehr bedeuten als ihre Teile", it: "una parola composta ha l'accento sulla prima parola e può significare più delle sue parti", pl: "wyraz złożony ma akcent na pierwszym członie i może znaczyć więcej niż jego części", tr: "bileşik sözcükte vurgu ilk sözcüktedir ve anlam parçalarının toplamından fazla olabilir", id: "kata majemuk bertekanan pada kata pertama dan bisa berarti lebih dari bagian-bagiannya", vi: "từ ghép nhấn ở từ đầu và có thể mang nghĩa nhiều hơn các phần của nó" }, ex: { contrast: [["a ", { stress: ˈblack }, "bird"], ["a black ", { stress: ˈbird }]] }, tr: { uk: { contrast: ["дрізд", "чорний птах"] }, es: { contrast: ["un mirlo", "un pájaro negro"] }, pt: { contrast: ["um melro", "um pássaro preto"] }, fr: { contrast: ["un merle", "un oiseau noir"] }, de: { contrast: ["eine Amsel", "ein schwarzer Vogel"] }, it: { contrast: ["un merlo", "un uccello nero"] }, pl: { contrast: ["kos", "czarny ptak"] }, tr: { contrast: ["karatavuk", "siyah bir kuş"] }, id: { contrast: ["burung blackbird", "burung hitam"] }, vi: { contrast: ["chim blackbird", "chim đen"] } } }
        - { level: C2, point: { en: Creative conversion, uk: "Творча конверсія", es: "Conversión creativa", pt: "Conversão criativa", fr: "Conversion créative", de: "Kreative Konversion", it: "Conversione creativa", pl: "Kreatywna konwersja", tr: "Yaratıcı tür dönüşümü", id: "Konversi kreatif", vi: "Chuyển loại từ sáng tạo" }, rule: { en: "nouns become verbs and phrases become modifiers for one occasion", uk: "іменники стають дієсловами, а словосполучення — означеннями лише для одного випадку", es: "los sustantivos pasan a verbos y los grupos de palabras a modificadores, solo para una ocasión", pt: "substantivos viram verbos e grupos de palavras viram modificadores, só para uma ocasião", fr: "des noms deviennent verbes et des groupes de mots deviennent modificateurs, le temps d’une occasion", de: "Nomen werden zu Verben und Wortgruppen zu Attributen, nur für einen Anlass", it: "i sostantivi diventano verbi e le locuzioni diventano modificatori per una sola occasione", pl: "rzeczowniki stają się czasownikami, a wyrażenia określeniami, tylko na jedną okazję", tr: "isimler fiile, öbekler niteleyiciye dönüşür; yalnızca o durum için", id: "kata benda menjadi kata kerja dan frasa menjadi pewatas, hanya untuk satu kesempatan", vi: "danh từ thành động từ, cụm từ thành từ bổ nghĩa, chỉ dùng cho một dịp" }, ex: { examples: [["They ", { target: gifted }, " us a painting."], ["an ", { target: I-told-you-so }, " look"]] }, tr: { uk: { examples: ["Вони подарували нам картину.", "погляд у стилі «а я ж казав»"] }, es: { examples: ["Nos regalaron un cuadro.", "una mirada de «te lo dije»"] }, pt: { examples: ["Eles nos deram um quadro de presente.", "um olhar de “eu avisei”"] }, fr: { examples: ["Ils nous ont offert un tableau.", "un regard du genre « je te l’avais bien dit »"] }, de: { examples: ["Sie haben uns ein Gemälde geschenkt.", "ein Blick nach dem Motto „Ich hab's ja gesagt“"] }, it: { examples: ["Ci hanno regalato un quadro.", "uno sguardo da «te l'avevo detto»"] }, pl: { examples: ["Podarowali nam obraz.", "spojrzenie w stylu „a nie mówiłem”"] }, tr: { examples: ["Bize bir tablo hediye ettiler.", "“ben demiştim” bakışı"] }, id: { examples: ["Mereka menghadiahi kami sebuah lukisan.", "tatapan “sudah kubilang”"] }, vi: { examples: ["Họ tặng chúng tôi một bức tranh.", "ánh mắt kiểu “tôi đã bảo rồi mà”"] } } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "the noun after a number stays singular", uk: "іменник після числівника залишається в однині", es: "el sustantivo después de un número queda en singular", pt: "o substantivo depois de um número fica no singular", fr: "le nom après un nombre reste au singulier", de: "das Nomen nach einer Zahl bleibt im Singular", it: "il sostantivo dopo un numero resta al singolare", pl: "rzeczownik po liczebniku pozostaje w liczbie pojedynczej", tr: "sayıdan sonraki isim tekil kalır", id: "kata benda setelah angka tetap tunggal", vi: "danh từ sau số đếm vẫn ở số ít" }, ex: ["a ", { target: five-year-old }, " boy"], tr: { uk: "п’ятирічний хлопчик", es: "un niño de cinco años", pt: "um menino de cinco anos", fr: "un garçon de cinq ans", de: "ein fünfjähriger Junge", it: "un bambino di cinque anni", pl: "pięcioletni chłopiec", tr: "beş yaşında bir oğlan", id: "anak laki-laki berusia lima tahun", vi: "một cậu bé năm tuổi" } }

sections:
  - title: { en: "Form: compound nouns", uk: "Форма: складні іменники", es: "Forma: sustantivos compuestos", pt: "Forma: substantivos compostos", fr: "Forme : noms composés", de: "Form: zusammengesetzte Nomen", it: "Forma: sostantivi composti", pl: "Forma: rzeczowniki złożone", tr: "Biçim: bileşik isimler", id: "Bentuk: kata benda majemuk", vi: "Dạng: danh từ ghép" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: words, label: { en: Compounds, uk: "Складні слова", es: "Compuestos", pt: "Compostos", fr: "Mots composés", de: "Zusammensetzungen", it: "Parole composte", pl: "Wyrazy złożone", tr: "Bileşik sözcükler", id: "Kata majemuk", vi: "Từ ghép" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            pattern: { pattern: [{ slot: noun }, { slot: noun }] }
            words: { examples: [toothbrush, bus stop, football] }
            ex: ["We wait at the ", { target: bus stop }, "."]
            tr: { uk: "Ми чекаємо на автобусній зупинці.", es: "Esperamos en la parada de autobús.", pt: "Esperamos no ponto de ônibus.", fr: "Nous attendons à l’arrêt de bus.", de: "Wir warten an der Bushaltestelle.", it: "Aspettiamo alla fermata dell'autobus.", pl: "Czekamy na przystanku autobusowym.", tr: "Otobüs durağında bekliyoruz.", id: "Kami menunggu di halte bus.", vi: "Chúng tôi đợi ở trạm xe buýt." }
          - level: B2
            pattern: { pattern: [{ slot: adjective }, { slot: noun }] }
            words: { examples: [blackboard, software, shortcut] }
            ex: ["The teacher wrote on the ", { target: blackboard }, "."]
            tr: { uk: "Учитель писав на дошці.", es: "El profesor escribió en la pizarra.", pt: "O professor escreveu no quadro negro.", fr: "Le professeur a écrit au tableau noir.", de: "Der Lehrer schrieb an die Tafel.", it: "L'insegnante ha scritto sulla lavagna.", pl: "Nauczyciel pisał na tablicy.", tr: "Öğretmen kara tahtaya yazdı.", id: "Guru itu menulis di papan tulis.", vi: "Thầy giáo viết lên bảng đen." }
          - level: B2
            pattern: { pattern: [{ slot: V-ing }, { slot: noun }] }
            words: { examples: [swimming pool, washing machine, waiting room] }
            ex: ["The ", { target: washing machine }, " is broken."]
            tr: { uk: "Пральна машина зламана.", es: "La lavadora está rota.", pt: "A máquina de lavar está quebrada.", fr: "Le lave-linge est en panne.", de: "Die Waschmaschine ist kaputt.", it: "La lavatrice è rotta.", pl: "Pralka jest zepsuta.", tr: "Çamaşır makinesi bozuk.", id: "Mesin cuci itu rusak.", vi: "Máy giặt bị hỏng." }
          - level: B2
            pattern: { pattern: [{ slot: noun }, { slot: V-ing }] }
            words: { examples: [sunbathing, babysitting, house-hunting] }
            ex: ["She earns extra money from ", { target: babysitting }, "."]
            tr: { uk: "Вона заробляє додаткові гроші, доглядаючи за дітьми.", es: "Gana dinero extra cuidando niños.", pt: "Ela ganha um dinheiro extra cuidando de crianças.", fr: "Elle gagne un peu d’argent en plus en faisant du baby-sitting.", de: "Sie verdient mit Babysitten etwas dazu.", it: "Guadagna qualche soldo in più facendo la babysitter.", pl: "Dorabia sobie opieką nad dziećmi.", tr: "Çocuk bakıcılığından ek para kazanıyor.", id: "Dia mendapat uang tambahan dari menjaga anak.", vi: "Cô ấy kiếm thêm tiền nhờ trông trẻ." }
          - level: B2
            pattern: { pattern: [{ slot: verb }, { slot: { en: particle, uk: "частка", es: "partícula", pt: "partícula", fr: "particule", de: "Partikel", it: "particella", pl: "partykuła", tr: "parçacık", id: "partikel", vi: "tiểu từ" } }] }
            words: { examples: [check-in, breakdown, [takeaway, " ", { variant: takeout, variety: en-US }]] }
            ex: ["A ", { target: breakdown }, " delayed us by an hour."]
            tr: { uk: "Поломка затримала нас на годину.", es: "Una avería nos retrasó una hora.", pt: "Uma pane nos atrasou uma hora.", fr: "Une panne nous a retardés d’une heure.", de: "Eine Panne hat uns eine Stunde aufgehalten.", it: "Un guasto ci ha ritardato di un'ora.", pl: "Awaria opóźniła nas o godzinę.", tr: "Bir arıza bizi bir saat geciktirdi.", id: "Mogok membuat kami terlambat satu jam.", vi: "Sự cố hỏng xe làm chúng tôi trễ một tiếng." }
          - level: B2
            pattern: { pattern: [{ slot: noun }, { slot: { en: preposition, uk: "прийменник", es: "preposición", pt: "preposição", fr: "préposition", de: "Präposition", it: "preposizione", pl: "przyimek", tr: "edat", id: "kata depan", vi: "giới từ" } }, { slot: noun }] }
            words: { examples: [mother-in-law, editor-in-chief, passer-by] }
            ex: ["My ", { target: mother-in-law }, " lives in Leeds."]
            tr: { uk: "Моя теща живе в Лідсі.", es: "Mi suegra vive en Leeds.", pt: "Minha sogra mora em Leeds.", fr: "Ma belle-mère habite à Leeds.", de: "Meine Schwiegermutter wohnt in Leeds.", it: "Mia suocera vive a Leeds.", pl: "Moja teściowa mieszka w Leeds.", tr: "Kayınvalidem Leeds’te yaşıyor.", id: "Ibu mertua saya tinggal di Leeds.", vi: "Mẹ vợ tôi sống ở Leeds." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The last word is the head; the first word tells which kind.", uk: "Останнє слово головне; перше слово показує, який це різновид.", es: "La última palabra es el núcleo; la primera dice de qué tipo es.", pt: "A última palavra é o núcleo; a primeira diz de que tipo é.", fr: "Le dernier mot est le noyau ; le premier dit de quel genre il s’agit.", de: "Das letzte Wort ist der Kern; das erste Wort sagt, um welche Art es geht.", it: "L'ultima parola è quella principale; la prima dice di che tipo si tratta.", pl: "Ostatni wyraz jest nadrzędny; pierwszy mówi, jakiego rodzaju jest rzecz.", tr: "Son sözcük ana sözcüktür; ilk sözcük bunun hangi tür olduğunu söyler.", id: "Kata terakhir adalah inti; kata pertama menunjukkan jenisnya.", vi: "Từ cuối là từ trung tâm; từ đầu cho biết đó là loại nào." }
            ex: ["A ", { target: toothbrush }, " is a kind of brush."]
            tr: { uk: "Зубна щітка — це різновид щітки.", es: "Un cepillo de dientes es un tipo de cepillo.", pt: "Uma escova de dentes é um tipo de escova.", fr: "Une brosse à dents est une sorte de brosse.", de: "Eine Zahnbürste ist eine Art Bürste.", it: "Uno spazzolino da denti è un tipo di spazzola.", pl: "Szczoteczka do zębów to rodzaj szczotki.", tr: "Diş fırçası bir tür fırçadır.", id: "Sikat gigi adalah sejenis sikat.", vi: "Bàn chải đánh răng là một loại bàn chải." }
          - type: rule
            level: B2
            text: { en: "Closed, hyphenated and open spellings all occur; the dictionary sets which one a compound takes.", uk: "Трапляються злите, дефісне й роздільне написання; яке саме — визначає словник.", es: "Existen la escritura junta, con guion y separada; el diccionario indica cuál lleva cada compuesto.", pt: "Existem a grafia junta, com hífen e separada; o dicionário indica qual cada composto usa.", fr: "On trouve l’écriture soudée, avec trait d’union et en deux mots ; le dictionnaire dit laquelle un mot composé prend.", de: "Zusammenschreibung, Schreibung mit Bindestrich und Getrenntschreibung kommen alle vor; das Wörterbuch zeigt, welche gilt.", it: "Esistono la grafia unita, quella con trattino e quella separata; il dizionario indica quale usa ogni composto.", pl: "Występują pisownia łączna, z łącznikiem i rozdzielna; którą wybrać, mówi słownik.", tr: "Bitişik, tireli ve ayrı yazım görülür; hangisinin kullanıldığını sözlük gösterir.", id: "Ada ejaan serangkai, ejaan dengan tanda hubung, dan ejaan terpisah; kamus menunjukkan mana yang dipakai.", vi: "Có cách viết liền, có gạch nối và tách rời; từ điển cho biết từ ghép nào viết kiểu nào." }
            ex: { examples: [{ target: bedroom }, { target: mother-in-law }, { target: post office }] }
            tr: { uk: { examples: ["спальня", "теща", "пошта"] }, es: { examples: ["dormitorio", "suegra", "oficina de correos"] }, pt: { examples: ["quarto", "sogra", "agência dos correios"] }, fr: { examples: ["chambre", "belle-mère", "bureau de poste"] }, de: { examples: ["Schlafzimmer", "Schwiegermutter", "Postamt"] }, it: { examples: ["camera da letto", "suocera", "ufficio postale"] }, pl: { examples: ["sypialnia", "teściowa", "poczta"] }, tr: { examples: ["yatak odası", "kayınvalide", "postane"] }, id: { examples: ["kamar tidur", "ibu mertua", "kantor pos"] }, vi: { examples: ["phòng ngủ", "mẹ vợ", "bưu điện"] } }
          - type: rule
            level: B2
            text: { en: "A phrasal verb is two words; the noun made from it is one word or hyphenated.", uk: "Фразове дієслово складається з двох слів; іменник, утворений від нього, пишеться разом або через дефіс.", es: "Un phrasal verb tiene dos palabras; el sustantivo que se forma de él se escribe junto o con guion.", pt: "Um phrasal verb tem duas palavras; o substantivo formado dele se escreve junto ou com hífen.", fr: "Un phrasal verb compte deux mots ; le nom dérivé s’écrit en un mot ou avec un trait d’union.", de: "Ein Phrasal Verb besteht aus zwei Wörtern; das davon abgeleitete Nomen wird zusammen oder mit Bindestrich geschrieben.", it: "Un phrasal verb è formato da due parole; il sostantivo che ne deriva si scrive unito o con il trattino.", pl: "Czasownik frazowy to dwa wyrazy; utworzony od niego rzeczownik pisze się łącznie lub z łącznikiem.", tr: "Phrasal verb iki sözcüktür; ondan türeyen isim bitişik ya da tireyle yazılır.", id: "Phrasal verb terdiri atas dua kata; kata benda turunannya ditulis serangkai atau dengan tanda hubung.", vi: "Cụm động từ gồm hai từ; danh từ tạo ra từ nó viết liền hoặc có gạch nối." }
            ex: { contrast: [["We ", { target: check in }, " at six."], ["The ", { target: check-in }, " desk opens at six."]] }
            tr: { uk: { contrast: ["Ми реєструємося о шостій.", "Стійка реєстрації відкривається о шостій."] }, es: { contrast: ["Nos registramos a las seis.", "El mostrador de registro abre a las seis."] }, pt: { contrast: ["Fazemos o check-in às seis.", "O balcão de check-in abre às seis."] }, fr: { contrast: ["Nous nous enregistrons à six heures.", "Le comptoir d’enregistrement ouvre à six heures."] }, de: { contrast: ["Wir checken um sechs Uhr ein.", "Der Check-in-Schalter öffnet um sechs Uhr."] }, it: { contrast: ["Facciamo il check-in alle sei.", "Il banco del check-in apre alle sei."] }, pl: { contrast: ["Odprawiamy się o szóstej.", "Stanowisko odprawy otwiera się o szóstej."] }, tr: { contrast: ["Saat altıda giriş işlemi yaptırıyoruz.", "Kayıt masası saat altıda açılıyor."] }, id: { contrast: ["Kami check-in pukul enam.", "Meja check-in buka pukul enam."] }, vi: { contrast: ["Chúng tôi làm thủ tục lúc sáu giờ.", "Quầy làm thủ tục mở lúc sáu giờ."] } }
          - type: note
            level: B2
            text: { en: ["Plural of a compound: ", { link: Plurals, to: en.nouns-determiners.plurals }, ". Stress of a compound: ", { link: Sounds and IPA, to: en.foundations.pronunciation-ipa }, ". Phrasal verbs: ", { link: "Phrasal Verbs", to: en.verbs.phrasal-verbs-core }, "."], uk: ["Множина складних слів: ", { link: "Множина іменників", to: en.nouns-determiners.plurals }, ". Наголос у складних словах: ", { link: "Звуки та МФА", to: en.foundations.pronunciation-ipa }, ". Фразові дієслова: ", { link: "Фразові дієслова", to: en.verbs.phrasal-verbs-core }, "."], es: ["El plural de un compuesto: ", { link: "El plural", to: en.nouns-determiners.plurals }, ". El acento de un compuesto: ", { link: "Sonidos y AFI", to: en.foundations.pronunciation-ipa }, ". Phrasal verbs: ", { link: "Phrasal verbs", to: en.verbs.phrasal-verbs-core }, "."], pt: ["O plural de um composto: ", { link: "O plural", to: en.nouns-determiners.plurals }, ". O acento de um composto: ", { link: "Sons e AFI", to: en.foundations.pronunciation-ipa }, ". Phrasal verbs: ", { link: "Phrasal verbs", to: en.verbs.phrasal-verbs-core }, "."], fr: ["Le pluriel d’un mot composé : ", { link: "Le pluriel", to: en.nouns-determiners.plurals }, ". L’accent d’un mot composé : ", { link: "Sons et API", to: en.foundations.pronunciation-ipa }, ". Phrasal verbs : ", { link: "Phrasal verbs", to: en.verbs.phrasal-verbs-core }, "."], de: ["Plural einer Zusammensetzung: ", { link: "Plural", to: en.nouns-determiners.plurals }, ". Betonung einer Zusammensetzung: ", { link: "Laute und IPA", to: en.foundations.pronunciation-ipa }, ". Phrasal Verbs: ", { link: "Phrasal Verbs", to: en.verbs.phrasal-verbs-core }, "."], it: ["Il plurale di una parola composta: ", { link: "Il plurale", to: en.nouns-determiners.plurals }, ". L'accento di una parola composta: ", { link: "Suoni e AFI", to: en.foundations.pronunciation-ipa }, ". Phrasal verb: ", { link: "Phrasal verb", to: en.verbs.phrasal-verbs-core }, "."], pl: ["Liczba mnoga wyrazu złożonego: ", { link: "Liczba mnoga", to: en.nouns-determiners.plurals }, ". Akcent w wyrazie złożonym: ", { link: "Dźwięki i IPA", to: en.foundations.pronunciation-ipa }, ". Czasowniki frazowe: ", { link: "Czasowniki frazowe", to: en.verbs.phrasal-verbs-core }, "."], tr: ["Bileşik sözcüğün çoğulu: ", { link: "Tekil ve çoğul", to: en.nouns-determiners.plurals }, ". Bileşik sözcüğün vurgusu: ", { link: "Sesler ve IPA", to: en.foundations.pronunciation-ipa }, ". Phrasal verb’ler: ", { link: "Phrasal verbs", to: en.verbs.phrasal-verbs-core }, "."], id: ["Bentuk jamak kata majemuk: ", { link: "Bentuk jamak", to: en.nouns-determiners.plurals }, ". Tekanan pada kata majemuk: ", { link: "Bunyi dan AFI", to: en.foundations.pronunciation-ipa }, ". Phrasal verb: ", { link: "Phrasal verb", to: en.verbs.phrasal-verbs-core }, "."], vi: ["Số nhiều của từ ghép: ", { link: "Danh từ số nhiều", to: en.nouns-determiners.plurals }, ". Trọng âm của từ ghép: ", { link: "Âm và IPA", to: en.foundations.pronunciation-ipa }, ". Cụm động từ: ", { link: "Cụm động từ", to: en.verbs.phrasal-verbs-core }, "."] }

  - title: { en: "Form: compound adjectives", uk: "Форма: складні прикметники", es: "Forma: adjetivos compuestos", pt: "Forma: adjetivos compostos", fr: "Forme : adjectifs composés", de: "Form: zusammengesetzte Adjektive", it: "Forma: aggettivi composti", pl: "Forma: przymiotniki złożone", tr: "Biçim: bileşik sıfatlar", id: "Bentuk: kata sifat majemuk", vi: "Dạng: tính từ ghép" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: words, label: { en: Compounds, uk: "Складні слова", es: "Compuestos", pt: "Compostos", fr: "Mots composés", de: "Zusammensetzungen", it: "Parole composte", pl: "Wyrazy złożone", tr: "Bileşik sözcükler", id: "Kata majemuk", vi: "Từ ghép" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            pattern: { pattern: [{ slot: number }, { slot: hyphen }, { slot: singular noun }] }
            words: { examples: [five-year-old, three-course, two-bedroom] }
            ex: { examples: [["We took a ", { target: ten-minute }, " walk."], ["They rented a ", { target: two-bedroom }, " flat ", { variant: apartment, variety: en-US }, "."]] }
            tr: { uk: { examples: ["Ми прогулялися десять хвилин.", "Вони винайняли двокімнатну квартиру."] }, es: { examples: ["Dimos un paseo de diez minutos.", "Alquilaron un apartamento de dos dormitorios."] }, pt: { examples: ["Demos uma caminhada de dez minutos.", "Eles alugaram um apartamento de dois quartos."] }, fr: { examples: ["Nous avons fait une promenade de dix minutes.", "Ils ont loué un appartement de deux chambres."] }, de: { examples: ["Wir haben einen zehnminütigen Spaziergang gemacht.", "Sie haben eine Zweizimmerwohnung gemietet."] }, it: { examples: ["Abbiamo fatto una passeggiata di dieci minuti.", "Hanno affittato un appartamento con due camere da letto."] }, pl: { examples: ["Poszliśmy na dziesięciominutowy spacer.", "Wynajęli mieszkanie z dwiema sypialniami."] }, tr: { examples: ["On dakikalık bir yürüyüş yaptık.", "İki yatak odalı bir daire kiraladılar."] }, id: { examples: ["Kami berjalan kaki selama sepuluh menit.", "Mereka menyewa apartemen dengan dua kamar tidur."] }, vi: { examples: ["Chúng tôi đi bộ mười phút.", "Họ thuê một căn hộ hai phòng ngủ."] } }
          - level: B2
            pattern: { pattern: [{ slot: noun }, { slot: { en: participle, uk: "дієприкметник", es: "participio", pt: "particípio", fr: "participe", de: "Partizip", it: "participio", pl: "imiesłów", tr: "ortaç", id: "partisipel", vi: "phân từ" } }] }
            words: { examples: [home-made, hand-knitted, man-made] }
            ex: ["She sells ", { target: home-made }, " jam."]
            tr: { uk: "Вона продає домашнє варення.", es: "Vende mermelada casera.", pt: "Ela vende geleia caseira.", fr: "Elle vend de la confiture maison.", de: "Sie verkauft selbst gemachte Marmelade.", it: "Vende marmellata fatta in casa.", pl: "Sprzedaje domowy dżem.", tr: "Ev yapımı reçel satıyor.", id: "Dia menjual selai buatan sendiri.", vi: "Cô ấy bán mứt tự làm." }
          - level: B2
            pattern: { pattern: [{ slot: adverb }, { slot: { en: participle, uk: "дієприкметник", es: "participio", pt: "particípio", fr: "participe", de: "Partizip", it: "participio", pl: "imiesłów", tr: "ortaç", id: "partisipel", vi: "phân từ" } }] }
            words: { examples: [well-known, hard-working, fast-moving] }
            ex: ["She is a ", { target: well-known }, " author."]
            tr: { uk: "Вона — відома письменниця.", es: "Es una autora muy conocida.", pt: "Ela é uma autora conhecida.", fr: "C’est une auteure très connue.", de: "Sie ist eine bekannte Autorin.", it: "È un'autrice molto nota.", pl: "Jest znaną autorką.", tr: "O tanınmış bir yazar.", id: "Dia seorang penulis terkenal.", vi: "Cô ấy là một tác giả nổi tiếng." }
          - level: B2
            pattern: { pattern: [{ slot: adjective }, { slot: { en: participle, uk: "дієприкметник", es: "participio", pt: "particípio", fr: "participe", de: "Partizip", it: "participio", pl: "imiesłów", tr: "ortaç", id: "partisipel", vi: "phân từ" } }] }
            words: { examples: [long-lasting, good-looking, old-fashioned] }
            ex: ["This paint is ", { target: long-lasting }, "."]
            tr: { uk: "Ця фарба довговічна.", es: "Esta pintura dura mucho.", pt: "Esta tinta é duradoura.", fr: "Cette peinture est durable.", de: "Diese Farbe ist langlebig.", it: "Questa vernice è di lunga durata.", pl: "Ta farba jest trwała.", tr: "Bu boya uzun ömürlüdür.", id: "Cat ini awet.", vi: "Loại sơn này bền lâu." }
          - level: B2
            pattern: { pattern: [{ slot: noun }, { slot: adjective }] }
            words: { examples: [world-famous, lifelong, snow-white] }
            ex: ["It is a ", { target: world-famous }, " museum."]
            tr: { uk: "Це всесвітньо відомий музей.", es: "Es un museo famoso en todo el mundo.", pt: "É um museu famoso no mundo todo.", fr: "C’est un musée de renommée mondiale.", de: "Es ist ein weltberühmtes Museum.", it: "È un museo famoso in tutto il mondo.", pl: "To muzeum znane na całym świecie.", tr: "Dünyaca ünlü bir müze.", id: "Itu museum yang terkenal di seluruh dunia.", vi: "Đó là một bảo tàng nổi tiếng thế giới." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The noun after a number stays singular in a compound adjective.", uk: "Іменник після числівника в складному прикметнику залишається в однині.", es: "En un adjetivo compuesto, el sustantivo después de un número queda en singular.", pt: "Em um adjetivo composto, o substantivo depois de um número fica no singular.", fr: "Dans un adjectif composé, le nom après un nombre reste au singulier.", de: "Im zusammengesetzten Adjektiv bleibt das Nomen nach einer Zahl im Singular.", it: "In un aggettivo composto il sostantivo dopo un numero resta al singolare.", pl: "W przymiotniku złożonym rzeczownik po liczebniku pozostaje w liczbie pojedynczej.", tr: "Bileşik sıfatta sayıdan sonraki isim tekil kalır.", id: "Dalam kata sifat majemuk, kata benda setelah angka tetap tunggal.", vi: "Trong tính từ ghép, danh từ sau số đếm vẫn ở số ít." }
            ex: { examples: [["a ", { target: five-year-old }, " boy"], ["a ", { target: three-course }, " meal"]] }
            tr: { uk: { examples: ["п’ятирічний хлопчик", "обід із трьох страв"] }, es: { examples: ["un niño de cinco años", "una comida de tres platos"] }, pt: { examples: ["um menino de cinco anos", "uma refeição de três pratos"] }, fr: { examples: ["un garçon de cinq ans", "un repas en trois services"] }, de: { examples: ["ein fünfjähriger Junge", "ein Dreigangmenü"] }, it: { examples: ["un bambino di cinque anni", "un pasto di tre portate"] }, pl: { examples: ["pięcioletni chłopiec", "posiłek z trzech dań"] }, tr: { examples: ["beş yaşında bir oğlan", "üç çeşit yemek"] }, id: { examples: ["anak laki-laki berusia lima tahun", "makanan tiga hidangan"] }, vi: { examples: ["một cậu bé năm tuổi", "một bữa ăn ba món"] } }
          - type: rule
            level: B2
            text: { en: "The first word carries the comparison.", uk: "Ступінь порівняння виражає перше слово.", es: "La primera palabra lleva la comparación.", pt: "A primeira palavra leva a comparação.", fr: "Le premier mot porte la comparaison.", de: "Das erste Wort trägt die Steigerung.", it: "La prima parola porta il comparativo.", pl: "Stopniowanie przyjmuje pierwszy człon.", tr: "Karşılaştırma ilk sözcükte yapılır.", id: "Kata pertama yang menyatakan perbandingan.", vi: "Từ đầu mang dạng so sánh." }
            ex: { examples: [{ mapping: [well-known, { target: better-known }] }, { mapping: [well-known, { target: best-known }] }, { mapping: [good-looking, { target: better-looking }] }] }
            tr: { uk: { examples: ["відоміший", "найвідоміший", "привабливіший"] }, es: { examples: ["más conocido", "el más conocido", "más atractivo"] }, pt: { examples: ["mais conhecido", "o mais conhecido", "mais bonito"] }, fr: { examples: ["plus connu", "le plus connu", "plus beau"] }, de: { examples: ["bekannter", "am bekanntesten", "besser aussehend"] }, it: { examples: ["più noto", "il più noto", "più bello"] }, pl: { examples: ["bardziej znany", "najbardziej znany", "przystojniejszy"] }, tr: { examples: ["daha tanınmış", "en tanınmış", "daha yakışıklı"] }, id: { examples: ["lebih terkenal", "paling terkenal", "lebih menarik"] }, vi: { examples: ["nổi tiếng hơn", "nổi tiếng nhất", "ưa nhìn hơn"] } }
          - type: note
            level: B2
            text: { en: ["Hyphens in compound adjectives: ", { link: Punctuation and Capital Letters, to: en.foundations.punctuation }, ". Their place before or after a noun: ", { link: Adjectives and Adjective Order, to: en.adjectives-adverbs.adjective-order }, "."], uk: ["Дефіс у складних прикметниках: ", { link: "Розділові знаки та великі літери", to: en.foundations.punctuation }, ". Їхнє місце перед іменником чи після нього: ", { link: "Прикметники та їхній порядок", to: en.adjectives-adverbs.adjective-order }, "."], es: ["El guion en los adjetivos compuestos: ", { link: "Puntuación y mayúsculas", to: en.foundations.punctuation }, ". Su lugar antes o después de un sustantivo: ", { link: "Los adjetivos y su orden", to: en.adjectives-adverbs.adjective-order }, "."], pt: ["O hífen em adjetivos compostos: ", { link: "Pontuação e letras maiúsculas", to: en.foundations.punctuation }, ". Sua posição antes ou depois de um substantivo: ", { link: "Os adjetivos e sua ordem", to: en.adjectives-adverbs.adjective-order }, "."], fr: ["Le trait d’union dans les adjectifs composés : ", { link: "Ponctuation et majuscules", to: en.foundations.punctuation }, ". Leur place avant ou après le nom : ", { link: "Adjectifs et ordre des adjectifs", to: en.adjectives-adverbs.adjective-order }, "."], de: ["Bindestriche in zusammengesetzten Adjektiven: ", { link: "Zeichensetzung und Großschreibung", to: en.foundations.punctuation }, ". Ihre Stellung vor oder nach dem Nomen: ", { link: "Adjektive und ihre Reihenfolge", to: en.adjectives-adverbs.adjective-order }, "."], it: ["Il trattino negli aggettivi composti: ", { link: "Punteggiatura e maiuscole", to: en.foundations.punctuation }, ". La loro posizione prima o dopo un sostantivo: ", { link: "Gli aggettivi e il loro ordine", to: en.adjectives-adverbs.adjective-order }, "."], pl: ["Łącznik w przymiotnikach złożonych: ", { link: "Interpunkcja i wielkie litery", to: en.foundations.punctuation }, ". Ich miejsce przed rzeczownikiem lub po nim: ", { link: "Przymiotniki i ich kolejność", to: en.adjectives-adverbs.adjective-order }, "."], tr: ["Bileşik sıfatlarda tire: ", { link: "Noktalama ve büyük harfler", to: en.foundations.punctuation }, ". İsmin önündeki ya da arkasındaki yerleri: ", { link: "Sıfatlar ve sıfat sırası", to: en.adjectives-adverbs.adjective-order }, "."], id: ["Tanda hubung pada kata sifat majemuk: ", { link: "Tanda baca dan huruf kapital", to: en.foundations.punctuation }, ". Posisinya sebelum atau sesudah kata benda: ", { link: "Kata sifat dan urutannya", to: en.adjectives-adverbs.adjective-order }, "."], vi: ["Dấu gạch nối trong tính từ ghép: ", { link: "Dấu câu và chữ hoa", to: en.foundations.punctuation }, ". Vị trí trước hoặc sau danh từ: ", { link: "Tính từ và trật tự của tính từ", to: en.adjectives-adverbs.adjective-order }, "."] }

