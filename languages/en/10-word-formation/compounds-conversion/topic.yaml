            tr: { uk: { examples: ["Ми їли рибу з картоплею фрі біля моря.", "Добрий вечір, пані та панове."] }, es: { examples: ["Comimos pescado con papas fritas junto al mar.", "Buenas noches, damas y caballeros."] }, pt: { examples: ["Comemos peixe com batatas fritas à beira-mar.", "Boa noite, senhoras e senhores."] }, fr: { examples: ["Nous avons mangé du poisson-frites au bord de la mer.", "Bonsoir, mesdames et messieurs."] }, de: { examples: ["Wir haben am Meer Fisch mit Pommes gegessen.", "Guten Abend, meine Damen und Herren."] }, it: { examples: ["Abbiamo mangiato pesce e patatine in riva al mare.", "Buonasera, signore e signori."] }, pl: { examples: ["Jedliśmy rybę z frytkami nad morzem.", "Dobry wieczór, panie i panowie."] }, tr: { examples: ["Deniz kenarında balık ve patates kızartması yedik.", "İyi akşamlar, bayanlar ve baylar."] }, id: { examples: ["Kami makan ikan dan kentang goreng di tepi laut.", "Selamat malam, ibu-ibu dan bapak-bapak."] }, vi: { examples: ["Chúng tôi ăn cá và khoai tây chiên bên bờ biển.", "Chào buổi tối, thưa quý bà và quý ông."] } }
          - level: C2
            order: { en: a legal pair of near-synonyms, uk: "юридична пара майже синонімів", es: "un par jurídico de casi sinónimos", pt: "um par jurídico de quase sinônimos", fr: "un couple juridique de quasi-synonymes", de: "ein juristisches Paar fast gleichbedeutender Wörter", it: "una coppia giuridica di quasi sinonimi", pl: "prawnicza para prawie synonimów", tr: "yakın anlamlı sözcüklerden oluşan hukuki bir ikili", id: "pasangan istilah hukum yang hampir sinonim", vi: "cặp từ pháp lý gần đồng nghĩa" }
            words: { examples: [aid and abet, cease and desist, "null and void"] }
            ex: ["The contract is now ", { target: null and void }, "."]
            tr: { uk: "Договір тепер недійсний.", es: "El contrato ahora es nulo y sin valor.", pt: "O contrato agora é nulo e sem efeito.", fr: "Le contrat est désormais nul et non avenu.", de: "Der Vertrag ist jetzt null und nichtig.", it: "Il contratto ora è nullo e privo di effetto.", pl: "Umowa jest teraz nieważna i bezskuteczna.", tr: "Sözleşme artık geçersiz ve hükümsüz.", id: "Kontrak itu sekarang batal demi hukum.", vi: "Hợp đồng bây giờ vô hiệu." }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A frozen binomial keeps its order in every sentence.", uk: "Усталена пара слів зберігає свій порядок у кожному реченні.", es: "Un binomio fijo mantiene su orden en cualquier oración.", pt: "Um binômio fixo mantém sua ordem em qualquer frase.", fr: "Un binôme figé garde son ordre dans toute phrase.", de: "Ein festes Wortpaar behält seine Reihenfolge in jedem Satz.", it: "Un binomio fisso mantiene il suo ordine in ogni frase.", pl: "Utarta para wyrazów zachowuje kolejność w każdym zdaniu.", tr: "Kalıplaşmış ikili her cümlede sırasını korur.", id: "Pasangan kata tetap mempertahankan urutannya di setiap kalimat.", vi: "Cặp từ cố định giữ nguyên thứ tự trong mọi câu." }
            ex: ["It was a matter of ", { target: life and death }, "."]
