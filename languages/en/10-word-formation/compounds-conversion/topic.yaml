            tr: { uk: "Кишеньковий злодій утік з моїм гаманцем.", es: "El carterista salió corriendo con mi billetera.", pt: "O batedor de carteira fugiu com minha carteira.", fr: "Le pickpocket s’est enfui avec mon portefeuille.", de: "Der Taschendieb ist mit meiner Geldbörse abgehauen.", it: "Il borseggiatore è scappato con il mio portafoglio.", pl: "Kieszonkowiec uciekł z moim portfelem.", tr: "Yankesici cüzdanımla kaçtı.", id: "Pencopet itu kabur membawa dompet saya.", vi: "Tên móc túi chạy mất cùng ví của tôi." }
          - level: C2
