          - { key: compound, label: { en: Compound, uk: "Складне слово", es: "Compuesto", pt: "Composto", fr: "Mot composé", de: "Zusammensetzung", it: "Composto", pl: "Wyraz złożony", tr: "Bileşik sözcük", id: "Kata majemuk", vi: "Từ ghép" } }
          - { key: phrase, label: { en: Phrase, uk: "Словосполучення", es: "Grupo de palabras", pt: "Grupo de palavras", fr: "Groupe de mots", de: "Wortgruppe", it: "Locuzione", pl: "Wyrażenie", tr: "Sözcük öbeği", id: "Frasa", vi: "Cụm từ" } }
        rows:
          - { level: C2, point: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" }, compound: { ex: ["a ", { target: blackbird }, " ", { gloss: { en: "= a kind of bird", uk: "= вид птаха", es: "= un tipo de ave", pt: "= um tipo de ave", fr: "= une espèce d’oiseau", de: "= eine Vogelart", it: "= un tipo di uccello", pl: "= gatunek ptaka", tr: "= bir kuş türü", id: "= sejenis burung", vi: "= một loài chim" } }], tr: { uk: "дрізд", es: "un mirlo", pt: "um melro", fr: "un merle", de: "eine Amsel", it: "un merlo", pl: "kos", tr: "bir karatavuk", id: "burung blackbird", vi: "chim blackbird" } }, phrase: { ex: ["a ", { target: black bird }, " ", { gloss: { en: "= any bird that is black", uk: "= будь-який чорний птах", es: "= cualquier ave negra", pt: "= qualquer ave preta", fr: "= n’importe quel oiseau noir", de: "= irgendein schwarzer Vogel", it: "= qualunque uccello nero", pl: "= każdy czarny ptak", tr: "= siyah olan herhangi bir kuş", id: "= burung apa pun yang hitam", vi: "= bất kỳ con chim nào màu đen" } }], tr: { uk: "чорний птах", es: "un pájaro negro", pt: "um pássaro preto", fr: "un oiseau noir", de: "ein schwarzer Vogel", it: "un uccello nero", pl: "czarny ptak", tr: "siyah bir kuş", id: "burung hitam", vi: "chim đen" } } }
          - { level: C2, point: { en: Stress, uk: "Наголос", es: "Acento", pt: "Acento tônico", fr: "Accent", de: "Betonung", it: "Accento", pl: "Akcent", tr: "Vurgu", id: "Tekanan", vi: "Trọng âm" }, compound: { ex: ["a ", { stress: ˈblack }, "bird"], tr: { uk: "дрізд", es: "un mirlo", pt: "um melro", fr: "un merle", de: "eine Amsel", it: "un merlo", pl: "kos", tr: "bir karatavuk", id: "burung blackbird", vi: "chim blackbird" } }, phrase: { ex: ["a black ", { stress: ˈbird }], tr: { uk: "чорний птах", es: "un pájaro negro", pt: "um pássaro preto", fr: "un oiseau noir", de: "ein schwarzer Vogel", it: "un uccello nero", pl: "czarny ptak", tr: "siyah bir kuş", id: "burung hitam", vi: "chim đen" } } }
          - { level: C2, point: { en: Degree word, uk: "Слово міри", es: "Palabra de grado", pt: "Palavra de grau", fr: "Mot de degré", de: "Gradwort", it: "Parola di grado", pl: "Słowo stopnia", tr: "Derece sözcüğü", id: "Kata derajat", vi: "Từ chỉ mức độ" }, compound: { en: "the first part takes none", uk: "перша частина його не приймає", es: "la primera parte no lleva ninguna", pt: "a primeira parte não aceita nenhuma", fr: "la première partie n’en accepte aucun", de: "der erste Teil nimmt keines", it: "la prima parte non ne prende", pl: "pierwsza część go nie przyjmuje", tr: "ilk parça almaz", id: "bagian pertama tidak menerimanya", vi: "phần đầu không nhận từ nào" }, phrase: { ex: ["a ", { target: very black }, " bird"], tr: { uk: "дуже чорний птах", es: "un pájaro muy negro", pt: "um pássaro muito preto", fr: "un oiseau très noir", de: "ein sehr schwarzer Vogel", it: "un uccello molto nero", pl: "bardzo czarny ptak", tr: "çok siyah bir kuş", id: "burung yang sangat hitam", vi: "một con chim rất đen" } } }
          - { level: C2, point: { en: Idiom, uk: "Ідіоматичне значення", es: "Sentido idiomático", pt: "Sentido idiomático", fr: "Sens figé", de: "Idiomatik", it: "Senso idiomatico", pl: "Znaczenie idiomatyczne", tr: "Deyim anlamı", id: "Makna idiomatis", vi: "Nghĩa thành ngữ" }, compound: { ex: ["a ", { target: hot dog }, " ", { gloss: { en: "= a sausage in a bun", uk: "= сосиска в булочці", es: "= una salchicha en un pan", pt: "= uma salsicha em um pão", fr: "= une saucisse dans un petit pain", de: "= eine Wurst im Brötchen", it: "= una salsiccia in un panino", pl: "= parówka w bułce", tr: "= ekmek arasında sosis", id: "= sosis dalam roti", vi: "= xúc xích kẹp bánh mì" } }], tr: { uk: "хот-дог", es: "un perro caliente", pt: "um cachorro-quente", fr: "un hot-dog", de: "ein Hotdog", it: "un hot dog", pl: "hot dog", tr: "bir sosisli sandviç", id: "hot dog", vi: "một cái hot dog" } }, phrase: { ex: ["a ", { target: hot }, " dog ", { gloss: { en: "= a dog that is hot", uk: "= собака, якій жарко", es: "= un perro que tiene calor", pt: "= um cachorro com calor", fr: "= un chien qui a chaud", de: "= ein Hund, dem heiß ist", it: "= un cane che ha caldo", pl: "= pies, któremu jest gorąco", tr: "= sıcağı basmış bir köpek", id: "= anjing yang kepanasan", vi: "= con chó đang nóng bức" } }], tr: { uk: "собака, якій спекотно", es: "un perro con calor", pt: "um cachorro com calor", fr: "un chien qui a chaud", de: "ein Hund, dem heiß ist", it: "un cane accaldato", pl: "pies, któremu jest gorąco", tr: "sıcaklamış bir köpek", id: "anjing yang kepanasan", vi: "con chó đang nóng bức" } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "The meaning of a compound can lie beyond its parts: butterfly names an insect.", uk: "Значення складного слова може виходити за межі його частин: butterfly — це комаха.", es: "El significado de un compuesto puede ir más allá de sus partes: butterfly nombra un insecto.", pt: "O significado de um composto pode ir além de suas partes: butterfly nomeia um inseto.", fr: "Le sens d’un mot composé peut dépasser celui de ses parties : butterfly désigne un insecte.", de: "Die Bedeutung einer Zusammensetzung kann über ihre Teile hinausgehen: butterfly bezeichnet ein Insekt.", it: "Il significato di un composto può andare oltre le sue parti: butterfly indica un insetto.", pl: "Znaczenie wyrazu złożonego może wykraczać poza jego części: butterfly oznacza owada.", tr: "Bileşik sözcüğün anlamı parçalarının ötesine geçebilir: butterfly bir böceği adlandırır.", id: "Makna kata majemuk bisa melampaui bagian-bagiannya: butterfly menyebut seekor serangga.", vi: "Nghĩa của từ ghép có thể vượt ra ngoài các phần của nó: butterfly gọi tên một loài côn trùng." }
            ex: ["A ", { target: butterfly }, " landed on the flower."]
            tr: { uk: "Метелик сів на квітку.", es: "Una mariposa se posó en la flor.", pt: "Uma borboleta pousou na flor.", fr: "Un papillon s’est posé sur la fleur.", de: "Ein Schmetterling landete auf der Blume.", it: "Una farfalla si è posata sul fiore.", pl: "Motyl usiadł na kwiatku.", tr: "Bir kelebek çiçeğin üzerine kondu.", id: "Seekor kupu-kupu hinggap di bunga itu.", vi: "Một con bướm đậu xuống bông hoa." }
          - type: note
            level: C2
            text: { en: ["Stress in compounds: ", { link: Sounds and IPA, to: en.foundations.pronunciation-ipa }, "."], uk: ["Наголос у складних словах: ", { link: "Звуки та МФА", to: en.foundations.pronunciation-ipa }, "."], es: ["El acento en los compuestos: ", { link: "Sonidos y AFI", to: en.foundations.pronunciation-ipa }, "."], pt: ["O acento nos compostos: ", { link: "Sons e AFI", to: en.foundations.pronunciation-ipa }, "."], fr: ["L’accent dans les mots composés : ", { link: "Sons et API", to: en.foundations.pronunciation-ipa }, "."], de: ["Betonung in Zusammensetzungen: ", { link: "Laute und IPA", to: en.foundations.pronunciation-ipa }, "."], it: ["L'accento nelle parole composte: ", { link: "Suoni e AFI", to: en.foundations.pronunciation-ipa }, "."], pl: ["Akcent w wyrazach złożonych: ", { link: "Dźwięki i IPA", to: en.foundations.pronunciation-ipa }, "."], tr: ["Bileşik sözcüklerde vurgu: ", { link: "Sesler ve IPA", to: en.foundations.pronunciation-ipa }, "."], id: ["Tekanan pada kata majemuk: ", { link: "Bunyi dan AFI", to: en.foundations.pronunciation-ipa }, "."], vi: ["Trọng âm trong từ ghép: ", { link: "Âm và IPA", to: en.foundations.pronunciation-ipa }, "."] }

