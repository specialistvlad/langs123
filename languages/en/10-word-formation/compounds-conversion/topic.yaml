            text: { en: "The plural names a whole class or set, and the head noun can still be plural.", uk: "Множина називає цілий клас або набір, а головний іменник теж може стояти в множині.", es: "El plural nombra una clase o un conjunto entero, y el sustantivo núcleo aún puede ir en plural.", pt: "O plural nomeia uma classe ou um conjunto inteiro, e o substantivo núcleo ainda pode ficar no plural.", fr: "Le pluriel nomme toute une catégorie ou un ensemble, et le nom noyau peut encore se mettre au pluriel.", de: "Der Plural benennt eine ganze Gruppe oder Menge, und das Kernnomen kann trotzdem im Plural stehen.", it: "Il plurale indica un'intera categoria o un insieme, e il sostantivo principale può restare al plurale.", pl: "Liczba mnoga nazywa całą klasę lub zbiór, a rzeczownik nadrzędny może nadal stać w liczbie mnogiej.", tr: "Çoğul, bütün bir sınıfı ya da kümeyi adlandırır; ana isim yine de çoğul olabilir.", id: "Bentuk jamak menyebut satu kelas atau kumpulan utuh, dan kata benda inti masih boleh jamak.", vi: "Số nhiều gọi tên cả một nhóm, và danh từ trung tâm vẫn có thể ở số nhiều." }
