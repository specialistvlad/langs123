            text: { en: "A nonce compound serves one occasion, and hyphens bind its words into one modifier." }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: a ten-minutes walk, right: ["a ", { target: ten-minute }, " walk"], rule: { en: "the noun after a number stays singular" } }
          - { level: B2, wrong: She sells home-make jam., right: ["She sells ", { target: home-made }, " jam."], rule: { en: "the second part is a participle" } }
          - { level: B2, wrong: He babysitted the children., right: ["He ", { target: babysat }, " the children."], rule: { en: "a compound verb inflects like its last word" } }
          - { level: B2, wrong: a MP, right: ["an ", { target: MP }], rule: { en: ["the first sound of ", { term: MP }, " is a vowel, so it takes ", { term: an }] } }
          - { level: B2, wrong: two CD's, right: ["two ", { target: CDs }], rule: { en: "an initialism takes -s with no apostrophe" } }
          - { level: C1, wrong: a saving account, right: ["a ", { target: savings }, " account"], rule: { en: "this modifier keeps its plural form" } }
          - { level: C1, wrong: a woman magazine, right: ["a ", { target: women's }, " magazine"], rule: { en: "an irregular plural takes 's as a modifier" } }
          - { level: C1, wrong: a two or three bedroom flat, right: ["a ", { target: two- or three-bedroom }, " flat"], rule: { en: "a hanging hyphen shows the shared last part" } }
          - { level: C1, wrong: a teacher-lead class, right: ["a ", { target: teacher-led }, " class"], rule: { en: [{ term: "-led" }, " is the participle of ", { term: lead }] } }
          - { level: C2, wrong: chips and fish, right: { target: fish and chips }, rule: { en: "a frozen binomial keeps its order" } }
          - { level: C2, wrong: gentlemen and ladies, right: { target: ladies and gentlemen }, rule: { en: "the greeting keeps its order" } }
          - { level: C2, wrong: a very blackbird, right: ["a ", { target: very black }, " bird"], rule: { en: "only the phrase takes a degree word" } }
