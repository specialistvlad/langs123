            tr: { uk: { examples: ["Годинник цокав: тік-так.", "Після обіду ми пограли в пінг-понг."] }, es: { examples: ["El reloj hacía tic-tac.", "Jugamos al ping-pong después de comer."] }, pt: { examples: ["O relógio fazia tique-taque.", "Jogamos pingue-pongue depois do almoço."] }, fr: { examples: ["L’horloge faisait tic-tac.", "Nous avons joué au ping-pong après le déjeuner."] }, de: { examples: ["Die Uhr machte tick-tack.", "Wir haben nach dem Mittagessen Tischtennis gespielt."] }, it: { examples: ["L'orologio faceva tic-tac.", "Abbiamo giocato a ping-pong dopo pranzo."] }, pl: { examples: ["Zegar tykał: tik-tak.", "Po obiedzie graliśmy w ping-ponga."] }, tr: { examples: ["Saat tik tak diye çalıştı.", "Öğle yemeğinden sonra pinpon oynadık."] }, id: { examples: ["Jam itu berbunyi tik-tak.", "Kami main pingpong setelah makan siang."] }, vi: { examples: ["Chiếc đồng hồ kêu tích tắc.", "Chúng tôi chơi bóng bàn sau bữa trưa."] } }
          - level: C1
            kind: { en: a rhyme, uk: "рима", es: "una rima", pt: "uma rima", fr: "une rime", de: "ein Reim", it: "una rima", pl: "rym", tr: "uyak", id: "rima", vi: "vần" }
            words: { examples: [hocus-pocus, razzle-dazzle, willy-nilly] }
            ex: { examples: [["The magician said ", { target: hocus-pocus }, "."], ["Don't spend money ", { target: willy-nilly }, "."]] }
            tr: { uk: { examples: ["Фокусник вигукнув: «Абракадабра!»", "Не витрачай гроші як попало."] }, es: { examples: ["El mago dijo «abracadabra».", "No gastes dinero a lo loco."] }, pt: { examples: ["O mágico disse “abracadabra”.", "Não gaste dinheiro à toa."] }, fr: { examples: ["Le magicien a dit « abracadabra ».", "Ne dépense pas ton argent n’importe comment."] }, de: { examples: ["Der Zauberer sagte „Abrakadabra“.", "Gib dein Geld nicht planlos aus."] }, it: { examples: ["Il mago disse «abracadabra».", "Non spendere i soldi a casaccio."] }, pl: { examples: ["Magik powiedział „abrakadabra”.", "Nie wydawaj pieniędzy byle jak."] }, tr: { examples: ["Sihirbaz “abrakadabra” dedi.", "Parayı gelişigüzel harcama."] }, id: { examples: ["Pesulap itu berkata “abrakadabra”.", "Jangan menghabiskan uang sembarangan."] }, vi: { examples: ["Ảo thuật gia nói “abracadabra”.", "Đừng tiêu tiền bừa bãi."] } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "With a change of vowel, i comes first and a or o follows.", uk: "Якщо голосний змінюється, спершу йде i, а потім a або o.", es: "Con cambio de vocal, la i va antes que la a o la o.", pt: "Na mudança de vogal, o i vem antes do a ou do o.", fr: "Avec un changement de voyelle, i vient d’abord, puis a ou o.", de: "Beim Vokalwechsel steht i zuerst, danach a oder o.", it: "Con il cambio di vocale la i viene prima, poi la a o la o.", pl: "Przy zmianie samogłoski najpierw stoi i, potem a lub o.", tr: "Ünlü değişiminde önce i, sonra a ya da o gelir.", id: "Pada perubahan vokal, i datang lebih dulu, lalu a atau o.", vi: "Khi đổi nguyên âm, i đứng trước, a hoặc o đứng sau." }
            ex: { examples: [{ target: zigzag }, { target: ping-pong }, { target: tick-tock }] }
            tr: { uk: { examples: ["зигзаг", "пінг-понг", "тік-так"] }, es: { examples: ["zigzag", "ping-pong", "tic-tac"] }, pt: { examples: ["zigue-zague", "pingue-pongue", "tique-taque"] }, fr: { examples: ["zigzag", "ping-pong", "tic-tac"] }, de: { examples: ["Zickzack", "Tischtennis", "Ticktack"] }, it: { examples: ["zigzag", "ping-pong", "tic-tac"] }, pl: { examples: ["zygzak", "ping-pong", "tik-tak"] }, tr: { examples: ["zikzak", "pinpon", "tik tak"] }, id: { examples: ["zig-zag", "tenis meja", "tik-tak"] }, vi: { examples: ["đường ngoằn ngoèo", "bóng bàn", "tích tắc"] } }
          - type: rule
            level: C1
            text: { en: "Reduplications are informal and often imitate a sound or a movement.", uk: "Редуплікації неформальні й часто наслідують звук або рух.", es: "Las reduplicaciones son informales y a menudo imitan un sonido o un movimiento.", pt: "As reduplicações são informais e muitas vezes imitam um som ou um movimento.", fr: "Les redoublements sont familiers et imitent souvent un bruit ou un mouvement.", de: "Reduplikationen sind informell und ahmen oft ein Geräusch oder eine Bewegung nach.", it: "Le reduplicazioni sono informali e spesso imitano un suono o un movimento.", pl: "Reduplikacje są potoczne i często naśladują dźwięk lub ruch.", tr: "İkilemeler günlük dile aittir ve çoğu zaman bir sesi ya da hareketi taklit eder.", id: "Reduplikasi bersifat informal dan sering menirukan bunyi atau gerakan.", vi: "Từ láy mang tính thân mật và thường mô phỏng âm thanh hoặc chuyển động." }
            ex: ["The tap went ", { target: drip-drop }, " all night."]
            tr: { uk: "Кран капав усю ніч: кап-кап.", es: "La llave goteó toda la noche: plic, plic.", pt: "A torneira pingou plique-plique a noite toda.", fr: "Le robinet a fait plic-ploc toute la nuit.", de: "Der Wasserhahn hat die ganze Nacht getropft.", it: "Il rubinetto ha fatto plic-ploc tutta la notte.", pl: "Kran kapał kap-kap przez całą noc.", tr: "Musluk bütün gece damla damla damladı.", id: "Keran itu menetes tik-tik sepanjang malam.", vi: "Vòi nước nhỏ tí tách suốt đêm." }

