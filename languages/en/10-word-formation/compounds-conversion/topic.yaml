            tr: { uk: "Вставай, ледацюго!", es: "¡Levántate, flojo!", pt: "Levanta, preguiçoso!", fr: "Debout, espèce de paresseux !", de: "Steh auf, du Faulpelz!", it: "Alzati, pigrone!", pl: "Wstawaj, leniu!", tr: "Kalk, tembel!", id: "Bangun, dasar pemalas!", vi: "Dậy đi, đồ lười!" }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "The head lies outside the compound: a redhead names the person who has red hair.", uk: "Головне слово лежить поза складним словом: a redhead називає людину з рудим волоссям.", es: "El núcleo queda fuera del compuesto: a redhead nombra a la persona que tiene el pelo rojo.", pt: "O núcleo fica fora do composto: a redhead nomeia a pessoa que tem cabelo ruivo.", fr: "Le noyau est hors du mot composé : a redhead désigne la personne qui a les cheveux roux.", de: "Der Kern liegt außerhalb der Zusammensetzung: a redhead nennt die Person mit roten Haaren.", it: "La parola principale sta fuori dal composto: a redhead indica la persona che ha i capelli rossi.", pl: "Człon nadrzędny leży poza wyrazem: a redhead oznacza osobę o rudych włosach.", tr: "Ana sözcük bileşiğin dışındadır: a redhead, kızıl saçlı kişiyi adlandırır.", id: "Intinya berada di luar kata majemuk: a redhead menyebut orang yang berambut merah.", vi: "Từ trung tâm nằm ngoài từ ghép: a redhead gọi tên người có mái tóc đỏ." }
            ex: ["A ", { target: redhead }, " sat beside me."]
            tr: { uk: "Поруч зі мною сиділа рудоволоса людина.", es: "Un pelirrojo se sentó a mi lado.", pt: "Um ruivo sentou ao meu lado.", fr: "Un roux s’est assis à côté de moi.", de: "Ein Rothaariger saß neben mir.", it: "Un rosso si è seduto accanto a me.", pl: "Obok mnie usiadł rudowłosy.", tr: "Yanıma kızıl saçlı biri oturdu.", id: "Seseorang berambut merah duduk di sebelah saya.", vi: "Một người tóc đỏ ngồi cạnh tôi." }

  - title: { en: "Compare: compound and phrase", uk: "Порівняння: складне слово і словосполучення", es: "Comparación: compuesto y grupo de palabras", pt: "Comparação: composto e grupo de palavras", fr: "Comparaison : mot composé et groupe de mots", de: "Vergleich: Zusammensetzung und Wortgruppe", it: "Confronto: parola composta e locuzione", pl: "Porównanie: wyraz złożony i wyrażenie", tr: "Karşılaştırma: bileşik sözcük ve sözcük öbeği", id: "Perbandingan: kata majemuk dan frasa", vi: "So sánh: từ ghép và cụm từ" }
