title: { en: Sounds and IPA, uk: Звуки та МФА, es: Sonidos y AFI }
summary:
  lead:
    en: "The sounds of English, how to read them in IPA, and word stress."
    uk: "Звуки англійської мови, їхній запис у МФА та наголос у слові."
    es: "Los sonidos del inglés, cómo leerlos en el AFI y el acento de la palabra."
  rule:
    en: "IPA gives every sound one symbol between slashes, so it shows how a word sounds whatever its spelling:"
    uk: "МФА дає кожному звуку один символ між скісними рисками, тож показує звучання слова незалежно від його написання:"
    es: "El AFI da a cada sonido un símbolo entre barras, así que muestra cómo suena una palabra sea cual sea su ortografía:"
  ex: { examples: [[{ target: ship }, " ", { ipa: ʃɪp }], [{ target: sheep }, " ", { ipa: ʃiːp }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A0, point: IPA, rule: { en: "one symbol for each sound, written between slashes", uk: "один символ для кожного звука, між скісними рисками", es: "un símbolo para cada sonido, escrito entre barras" }, ex: ["book ", { target: { ipa: bʊk } }], tr: { uk: "книжка", es: "libro" } }
        - { level: A0, point: { en: Spelling and sound, uk: "Правопис і звук", es: "Ortografía y sonido" }, rule: { en: ["spelling and sound often differ: ", { term: photo }, " has no ", { ipa: p }, " and no ", { ipa: h }], uk: ["правопис і звук часто не збігаються: у ", { term: photo }, " немає ні ", { ipa: p }, ", ні ", { ipa: h }], es: ["la ortografía y el sonido suelen diferir: ", { term: photo }, " no tiene ", { ipa: p }, " ni ", { ipa: h }] }, ex: ["photo ", { target: { ipa: ˈfəʊtəʊ } }], tr: { uk: "фото", es: "foto" } }
        - { level: A0, point: { alternatives: [{ letter: ː }, { letter: ˈ }] }, rule: { en: [{ letter: ː }, " makes a vowel long; ", { letter: ˈ }, " comes before the stressed syllable"], uk: [{ letter: ː }, " робить голосний довгим; ", { letter: ˈ }, " стоїть перед наголошеним складом"], es: [{ letter: ː }, " alarga una vocal; ", { letter: ˈ }, " va antes de la sílaba acentuada"] }, ex: { examples: [["food ", { target: { ipa: fuːd } }], ["teacher ", { target: { ipa: ˈtiːtʃə } }]] }, tr: { uk: { examples: ["їжа", "учитель"] }, es: { examples: ["comida", "profesor"] } } }
        - { level: A0, point: { en: Consonant symbols, uk: "Символи приголосних", es: "Símbolos de consonantes" }, rule: { en: ["some symbols differ from the spelling: ", { mapping: [{ letter: ch }, { ipa: tʃ }] }, ", ", { mapping: [{ letter: j }, { ipa: dʒ }] }, ", ", { mapping: [{ letter: "y" }, { ipa: j }] }], uk: ["деякі символи не збігаються з правописом: ", { mapping: [{ letter: ch }, { ipa: tʃ }] }, ", ", { mapping: [{ letter: j }, { ipa: dʒ }] }, ", ", { mapping: [{ letter: "y" }, { ipa: j }] }], es: ["algunos símbolos difieren de la ortografía: ", { mapping: [{ letter: ch }, { ipa: tʃ }] }, ", ", { mapping: [{ letter: j }, { ipa: dʒ }] }, ", ", { mapping: [{ letter: "y" }, { ipa: j }] }] }, ex: { examples: [[{ target: { letter: ch } }, air], [{ target: { letter: j } }, ob], [{ target: { letter: "y" } }, es]] }, tr: { uk: { examples: ["стілець", "робота", "так"] }, es: { examples: ["silla", "trabajo", "sí"] } } }
        - { level: A1, point: { en: Stress in two syllables, uk: "Наголос у двоскладових словах", es: "Acento en dos sílabas" }, rule: { en: "most nouns and adjectives: first syllable; many verbs: second", uk: "більшість іменників і прикметників: перший склад; багато дієслів: другий", es: "la mayoría de los sustantivos y adjetivos: primera sílaba; muchos verbos: segunda" }, ex: { examples: [{ target: [{ stress: ˈtea }, cher] }, { target: [be, { stress: ˈgin }] }] }, tr: { uk: { examples: ["учитель", "починати"] }, es: { examples: ["profesor", "empezar"] } } }
        - { level: A1, point: { alternatives: ["-tion", "-sion", "-ic"] }, rule: { en: stress the syllable before the ending, uk: "наголос падає на склад перед закінченням", es: "el acento cae en la sílaba anterior a la terminación" }, ex: { examples: [{ target: [infor, { stress: ˈma }, tion] }, { target: [fan, { stress: ˈtas }, tic] }] }, tr: { uk: { examples: ["інформація", "фантастичний"] }, es: { examples: ["información", "fantástico"] } } }
        - { level: A1, point: { en: Weak vowel, uk: "Слабкий голосний", es: "Vocal débil" }, rule: { en: ["unstressed vowels are often the weak ", { ipa: ə }], uk: ["ненаголошені голосні часто звучать як слабкий ", { ipa: ə }], es: ["las vocales átonas suelen ser la vocal débil ", { ipa: ə }] }, ex: ["about ", { target: { ipa: əˈbaʊt } }], tr: { uk: "про", es: "sobre" } }
        - { level: A1, point: US, rule: { en: [{ ipa: ɒ }, " becomes ", { ipa: ɑː }, ", ", { ipa: əʊ }, " becomes ", { ipa: oʊ }, ", and ", { ipa: r }, " is pronounced after vowels"], uk: [{ ipa: ɒ }, " переходить у ", { ipa: ɑː }, ", ", { ipa: əʊ }, " — в ", { ipa: oʊ }, ", а ", { ipa: r }, " вимовляється після голосних"], es: [{ ipa: ɒ }, " pasa a ", { ipa: ɑː }, ", ", { ipa: əʊ }, " pasa a ", { ipa: oʊ }, " y ", { ipa: r }, " se pronuncia después de vocales"] }, ex: { examples: [["hot ", { target: { ipa: hɑːt } }], ["car ", { target: { ipa: kɑːr } }]] }, tr: { uk: { examples: ["гарячий", "машина"] }, es: { examples: ["caliente", "coche"] } }, variety: en-US }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: ["short ", { ipa: ɪ }, " and long ", { ipa: iː }, " make different words"], uk: ["короткий ", { ipa: ɪ }, " і довгий ", { ipa: iː }, " утворюють різні слова"], es: ["la ", { ipa: ɪ }, " corta y la ", { ipa: iː }, " larga forman palabras distintas"] }, ex: { examples: [["ship ", { target: { ipa: ʃɪp } }], ["sheep ", { target: { ipa: ʃiːp } }]] }, tr: { uk: { examples: ["корабель", "вівця"] }, es: { examples: ["barco", "oveja"] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ letter: th }, " is ", { ipa: θ }, " or ", { ipa: ð }], uk: [{ letter: th }, " читається як ", { ipa: θ }, " або ", { ipa: ð }], es: [{ letter: th }, " se pronuncia ", { ipa: θ }, " o ", { ipa: ð }] }, ex: { examples: [[{ letter: th }, "ink ", { target: { ipa: θɪŋk } }], [{ letter: th }, "is ", { target: { ipa: ðɪs } }]] }, tr: { uk: { examples: ["думати", "це"] }, es: { examples: ["pensar", "esto"] } } }

sections:
  - title: { en: How IPA works, uk: "Як працює МФА", es: "Cómo funciona el AFI" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["IPA writes sounds, one symbol for each sound. Dictionaries put it between slashes: ", { term: book }, " ", { ipa: bʊk }, "."]
              uk: ["МФА записує звуки: один символ для кожного звука. У словниках його ставлять між скісними рисками: ", { term: book }, " ", { ipa: bʊk }, "."]
              es: ["El AFI escribe los sonidos, un símbolo para cada sonido. Los diccionarios lo ponen entre barras: ", { term: book }, " ", { ipa: bʊk }, "."]
          - type: rule
            level: A0
            text:
              en: ["Spelling and sound often differ: ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " has no ", { ipa: p }, " and no ", { ipa: h }, "."]
              uk: ["Правопис і звук часто не збігаються: у ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " немає ні ", { ipa: p }, ", ні ", { ipa: h }, "."]
              es: ["La ortografía y el sonido suelen diferir: ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " no tiene ", { ipa: p }, " ni ", { ipa: h }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ː }, " makes a vowel long: ", { ipa: uː }, " in ", { term: food }, "."]
              uk: [{ letter: ː }, " робить голосний довгим: ", { ipa: uː }, " у ", { term: food }, "."]
              es: [{ letter: ː }, " alarga una vocal: ", { ipa: uː }, " en ", { term: food }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ˈ }, " comes before the stressed syllable: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]
              uk: [{ letter: ˈ }, " стоїть перед наголошеним складом: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]
              es: [{ letter: ˈ }, " va antes de la sílaba acentuada: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]

  - title: { en: Consonant sounds, uk: "Приголосні звуки", es: "Sonidos consonánticos" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: sound, label: { en: Sound, uk: "Звук", es: "Sonido" } }
          - { key: spelling, label: { en: Spelling, uk: "Правопис", es: "Ortografía" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A0, value: p, sound: { ipa: p }, spelling: p, ex: [{ letter: p }, en], tr: { uk: "ручка", es: "bolígrafo" } }
          - { level: A0, value: b, sound: { ipa: b }, spelling: b, ex: [{ letter: b }, ed], tr: { uk: "ліжко", es: "cama" } }
          - { level: A0, value: t, sound: { ipa: t }, spelling: t, ex: [{ letter: t }, en], tr: { uk: "десять", es: "diez" } }
          - { level: A0, value: d, sound: { ipa: d }, spelling: d, ex: [{ letter: d }, og], tr: { uk: "собака", es: "perro" } }
          - { level: A0, value: k, sound: { ipa: k }, spelling: { alternatives: [c, k, ck] }, ex: { examples: [[{ letter: c }, at], [ba, { letter: ck }]] }, tr: { uk: { examples: ["кіт", "спина"] }, es: { examples: ["gato", "espalda"] } } }
          - { level: A1, value: g, sound: { ipa: g }, spelling: g, ex: [{ letter: g }, o], tr: { uk: "іти", es: "ir" } }
          - { level: A0, value: f, sound: { ipa: f }, spelling: { alternatives: [f, ph] }, ex: { examples: [[{ letter: f }, ish], [{ letter: ph }, one]] }, tr: { uk: { examples: ["риба", "телефон"] }, es: { examples: ["pez", "teléfono"] } } }
          - { level: A0, value: v, sound: { ipa: v }, spelling: v, ex: [{ letter: v }, an], tr: { uk: "фургон", es: "furgoneta" } }
          - { level: A1, value: θ, sound: { ipa: θ }, spelling: th, ex: [{ letter: th }, ink], tr: { uk: "думати", es: "pensar" } }
          - { level: A1, value: ð, sound: { ipa: ð }, spelling: th, ex: [{ letter: th }, is], tr: { uk: "це", es: "esto" } }
          - { level: A0, value: s, sound: { ipa: s }, spelling: { alternatives: [s, c] }, ex: { examples: [[{ letter: s }, un], [{ letter: c }, ity]] }, tr: { uk: { examples: ["сонце", "місто"] }, es: { examples: ["sol", "ciudad"] } } }
          - { level: A0, value: z, sound: { ipa: z }, spelling: { alternatives: [z, s] }, ex: { examples: [[{ letter: z }, oo], [i, { letter: s }]] }, tr: { uk: { examples: ["зоопарк", "є"] }, es: { examples: ["zoológico", "es"] } } }
          - { level: A1, value: ʃ, sound: { ipa: ʃ }, spelling: sh, ex: [{ letter: sh }, op], tr: { uk: "магазин", es: "tienda" } }
          - { level: A1, value: ʒ, sound: { ipa: ʒ }, spelling: s, ex: [televi, { letter: s }, ion], tr: { uk: "телебачення", es: "televisión" } }
          - { level: A1, value: h, sound: { ipa: h }, spelling: h, ex: [{ letter: h }, at], tr: { uk: "капелюх", es: "sombrero" } }
          - { level: A0, value: tʃ, sound: { ipa: tʃ }, spelling: ch, ex: [{ letter: ch }, air], tr: { uk: "стілець", es: "silla" } }
          - { level: A0, value: dʒ, sound: { ipa: dʒ }, spelling: { alternatives: [j, g] }, ex: { examples: [[{ letter: j }, ob], [a, { letter: g }, e]] }, tr: { uk: { examples: ["робота", "вік"] }, es: { examples: ["trabajo", "edad"] } } }
          - { level: A0, value: m, sound: { ipa: m }, spelling: m, ex: [{ letter: m }, an], tr: { uk: "чоловік", es: "hombre" } }
          - { level: A0, value: "n", sound: { ipa: "n" }, spelling: "n", ex: [{ letter: "n" }, o], tr: { uk: "ні", es: "no" } }
          - { level: A1, value: ŋ, sound: { ipa: ŋ }, spelling: ng, ex: [si, { letter: ng }], tr: { uk: "співати", es: "cantar" } }
          - { level: A0, value: l, sound: { ipa: l }, spelling: l, ex: [{ letter: l }, eg], tr: { uk: "нога", es: "pierna" } }
          - { level: A1, value: r, sound: { ipa: r }, spelling: r, ex: [{ letter: r }, ed], tr: { uk: "червоний", es: "rojo" } }
          - { level: A0, value: w, sound: { ipa: w }, spelling: w, ex: [{ letter: w }, ater], tr: { uk: "вода", es: "agua" } }
          - { level: A0, value: j, sound: { ipa: j }, spelling: "y", ex: [{ letter: "y" }, es], tr: { uk: "так", es: "sí" } }

  - title: { en: Vowel sounds, uk: "Голосні звуки", es: "Sonidos vocálicos" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: sound, label: { en: Sound, uk: "Звук", es: "Sonido" } }
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, value: ɪ, sound: { ipa: ɪ }, type: { en: short, uk: "короткий", es: "corto" }, ex: [sh, { letter: i }, p], tr: { uk: "корабель", es: "barco" } }
          - { level: A0, value: iː, sound: { ipa: iː }, type: { en: long, uk: "довгий", es: "largo" }, ex: [sh, { letter: ee }, p], tr: { uk: "вівця", es: "oveja" } }
          - { level: A0, value: e, sound: { ipa: e }, type: { en: short, uk: "короткий", es: "corto" }, ex: [b, { letter: e }, d], tr: { uk: "ліжко", es: "cama" } }
          - { level: A0, value: æ, sound: { ipa: æ }, type: { en: short, uk: "короткий", es: "corto" }, ex: [c, { letter: a }, t], tr: { uk: "кіт", es: "gato" } }
          - { level: A0, value: ʌ, sound: { ipa: ʌ }, type: { en: short, uk: "короткий", es: "corto" }, ex: [c, { letter: u }, p], tr: { uk: "чашка", es: "taza" } }
          - { level: A0, value: ɑː, sound: { ipa: ɑː }, type: { en: long, uk: "довгий", es: "largo" }, ex: [c, { letter: ar }], tr: { uk: "машина", es: "coche" } }
          - { level: A1, value: ɒ, sound: { ipa: ɒ }, type: { en: short, uk: "короткий", es: "corto" }, ex: [h, { letter: o }, t], tr: { uk: "гарячий", es: "caliente" } }
          - { level: A1, value: ɔː, sound: { ipa: ɔː }, type: { en: long, uk: "довгий", es: "largo" }, ex: [d, { letter: oor }], tr: { uk: "двері", es: "puerta" } }
          - { level: A1, value: ʊ, sound: { ipa: ʊ }, type: { en: short, uk: "короткий", es: "corto" }, ex: [b, { letter: oo }, k], tr: { uk: "книжка", es: "libro" } }
          - { level: A0, value: uː, sound: { ipa: uː }, type: { en: long, uk: "довгий", es: "largo" }, ex: [f, { letter: oo }, d], tr: { uk: "їжа", es: "comida" } }
          - { level: A1, value: ɜː, sound: { ipa: ɜː }, type: { en: long, uk: "довгий", es: "largo" }, ex: [b, { letter: ir }, d], tr: { uk: "птах", es: "pájaro" } }
          - { level: A0, value: ə, sound: { ipa: ə }, type: { en: "short, weak", uk: "короткий, слабкий", es: "corto, débil" }, ex: [{ letter: a }, bout], tr: { uk: "про", es: "sobre" } }
          - { level: A0, value: eɪ, sound: { ipa: eɪ }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [d, { letter: ay }], tr: { uk: "день", es: "día" } }
          - { level: A0, value: aɪ, sound: { ipa: aɪ }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [m, { letter: "y" }], tr: { uk: "мій", es: "mi" } }
          - { level: A1, value: ɔɪ, sound: { ipa: ɔɪ }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [b, { letter: oy }], tr: { uk: "хлопчик", es: "niño" } }
          - { level: A0, value: əʊ, sound: { ipa: əʊ }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [g, { letter: o }], tr: { uk: "іти", es: "ir" } }
          - { level: A1, value: aʊ, sound: { ipa: aʊ }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: ["n", { letter: ow }], tr: { uk: "зараз", es: "ahora" } }
          - { level: A1, value: ɪə, sound: { ipa: ɪə }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [h, { letter: ere }], tr: { uk: "тут", es: "aquí" } }
          - { level: A1, value: eə, sound: { ipa: eə }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [h, { letter: air }], tr: { uk: "волосся", es: "pelo" } }
          - { level: A1, value: ʊə, sound: { ipa: ʊə }, type: { en: diphthong, uk: "дифтонг", es: "diptongo" }, ex: [t, { letter: our }], tr: { uk: "тур", es: "gira" } }
      - type: list
        items:
          - type: note
            level: A1
            variety: en-US
            text:
              en: [{ ipa: ɒ }, " becomes ", { ipa: ɑː }, " (", { term: hot }, " ", { ipa: hɑːt }, "), ", { ipa: əʊ }, " becomes ", { ipa: oʊ }, ", and ", { ipa: r }, " is pronounced after vowels (", { term: car }, " ", { ipa: kɑːr }, ")."]
              uk: [{ ipa: ɒ }, " переходить у ", { ipa: ɑː }, " (", { term: hot }, " ", { ipa: hɑːt }, "), ", { ipa: əʊ }, " — в ", { ipa: oʊ }, ", а ", { ipa: r }, " вимовляється після голосних (", { term: car }, " ", { ipa: kɑːr }, ")."]
              es: [{ ipa: ɒ }, " pasa a ", { ipa: ɑː }, " (", { term: hot }, " ", { ipa: hɑːt }, "), ", { ipa: əʊ }, " pasa a ", { ipa: oʊ }, " y ", { ipa: r }, " se pronuncia después de vocales (", { term: car }, " ", { ipa: kɑːr }, ")."]

  - title: { en: Word stress, uk: "Наголос у слові", es: "El acento de la palabra" }
    role: own
    content:
      - type: prose
        level: A1
        text:
          en: "In a word of two or more syllables, one syllable is stronger and longer."
          uk: "У слові з двох і більше складів один склад звучить сильніше й довше."
          es: "En una palabra de dos o más sílabas, una sílaba es más fuerte y más larga."
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
