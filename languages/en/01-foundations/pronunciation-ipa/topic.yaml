            ex: { examples: [["trai", { stress: ˈnee }], ["engi", { stress: ˈneer }], ["Japa", { stress: ˈnese }], ["tech", { stress: ˈnique }]] }
          - level: B2
            pattern: { alternatives: ["-ness", "-ment", "-ful", "-er", "-ing"] }
            rule: { en: the base word keeps its stress }
            ex: { examples: [[{ stress: ˈhap }, "piness"], ["en", { stress: ˈjoy }, "ment"], [{ stress: ˈcare }, "ful"]] }
          - level: B2
            pattern: { en: A word family }
