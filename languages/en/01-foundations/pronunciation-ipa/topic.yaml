        - { level: B2, point: { en: Noun and verb }, rule: { en: "the noun stresses the first syllable, the verb the second" }, ex: { contrast: [["a ", { stress: ˈre }, "cord"], ["to re", { stress: ˈcord }]] } }
        - { level: C1, point: { en: Secondary stress }, rule: { en: ["long words add ", { letter: ˌ }, " before the main stress ", { letter: ˈ }] }, ex: ["information ", { target: { ipa: ˌɪnfəˈmeɪʃn } }] }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["short ", { ipa: ɪ }, " and long ", { ipa: iː }, " make different words"], uk: ["короткий ", { ipa: ɪ }, " і довгий ", { ipa: iː }, " утворюють різні слова"], es: ["la ", { ipa: ɪ }, " corta y la ", { ipa: iː }, " larga forman palabras distintas"], pt: ["o ", { ipa: "ɪ" }, " curto e o ", { ipa: "iː" }, " longo formam palavras diferentes"], fr: ["le ", { ipa: "ɪ" }, " bref et le ", { ipa: "iː" }, " long forment des mots différents"], de: ["kurzes ", { ipa: "ɪ" }, " und langes ", { ipa: "iː" }, " bilden verschiedene Wörter"], it: [{ ipa: "ɪ" }, " breve e ", { ipa: "iː" }, " lunga formano parole diverse"], pl: ["krótkie ", { ipa: "ɪ" }, " i długie ", { ipa: "iː" }, " tworzą różne wyrazy"], tr: ["kısa ", { ipa: "ɪ" }, " ile uzun ", { ipa: "iː" }, " farklı sözcükler oluşturur"], id: [{ ipa: "ɪ" }, " pendek dan ", { ipa: "iː" }, " panjang membentuk kata yang berbeda"], vi: [{ ipa: "ɪ" }, " ngắn và ", { ipa: "iː" }, " dài tạo thành những từ khác nhau"] }, ex: { examples: [["ship ", { target: { ipa: ʃɪp } }], ["sheep ", { target: { ipa: ʃiːp } }]] }, tr: { uk: { examples: ["корабель", "вівця"] }, es: { examples: ["barco", "oveja"] }, pt: { examples: ["navio", "ovelha"] }, fr: { examples: ["bateau", "mouton"] }, de: { examples: ["Schiff", "Schaf"] }, it: { examples: ["nave", "pecora"] }, pl: { examples: ["statek", "owca"] }, tr: { examples: ["gemi", "koyun"] }, id: { examples: ["kapal", "domba"] }, vi: { examples: ["tàu thủy", "con cừu"] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ letter: th }, " is ", { ipa: θ }, " or ", { ipa: ð }], uk: [{ letter: th }, " читається як ", { ipa: θ }, " або ", { ipa: ð }], es: [{ letter: th }, " se pronuncia ", { ipa: θ }, " o ", { ipa: ð }], pt: [{ letter: "th" }, " é pronunciado ", { ipa: "θ" }, " ou ", { ipa: "ð" }], fr: [{ letter: "th" }, " se prononce ", { ipa: "θ" }, " ou ", { ipa: "ð" }], de: [{ letter: "th" }, " wird als ", { ipa: "θ" }, " oder ", { ipa: "ð" }, " gesprochen"], it: [{ letter: "th" }, " si pronuncia ", { ipa: "θ" }, " o ", { ipa: "ð" }], pl: [{ letter: "th" }, " wymawia się ", { ipa: "θ" }, " lub ", { ipa: "ð" }], tr: [{ letter: "th" }, ", ", { ipa: "θ" }, " ya da ", { ipa: "ð" }, " olarak okunur"], id: [{ letter: "th" }, " diucapkan ", { ipa: "θ" }, " atau ", { ipa: "ð" }], vi: [{ letter: "th" }, " đọc là ", { ipa: "θ" }, " hoặc ", { ipa: "ð" }] }, ex: { examples: [[{ letter: th }, "ink ", { target: { ipa: θɪŋk } }], [{ letter: th }, "is ", { target: { ipa: ðɪs } }]] }, tr: { uk: { examples: ["думати", "це"] }, es: { examples: ["pensar", "esto"] }, pt: { examples: ["pensar", "isto"] }, fr: { examples: ["penser", "ceci"] }, de: { examples: ["denken", "dies"] }, it: { examples: ["pensare", "questo"] }, pl: { examples: ["myśleć", "to"] }, tr: { examples: ["düşünmek", "bu"] }, id: { examples: ["berpikir", "ini"] }, vi: { examples: ["nghĩ", "cái này"] } } }

sections:
  - title: { en: How IPA works, uk: "Як працює МФА", es: "Cómo funciona el AFI", pt: "Como funciona o AFI", fr: "Comment fonctionne l’API", de: "Wie IPA funktioniert", it: "Come funziona l'AFI", pl: "Jak działa IPA", tr: "IPA nasıl çalışır", id: "Cara kerja AFI", vi: "Cách IPA hoạt động" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["IPA writes sounds, one symbol for each sound. Dictionaries put it between slashes: ", { term: book }, " ", { ipa: bʊk }, "."]
              uk: ["МФА записує звуки: один символ для кожного звука. У словниках його ставлять між скісними рисками: ", { term: book }, " ", { ipa: bʊk }, "."]
              es: ["El AFI escribe los sonidos, un símbolo para cada sonido. Los diccionarios lo ponen entre barras: ", { term: book }, " ", { ipa: bʊk }, "."]
              pt: ["O AFI escreve os sons, um símbolo para cada som. Os dicionários o põem entre barras: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              fr: ["L’API note les sons, un symbole pour chaque son. Les dictionnaires le placent entre barres obliques : ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              de: ["IPA schreibt Laute, ein Symbol für jeden Laut. Wörterbücher setzen es zwischen Schrägstriche: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              it: ["L'AFI scrive i suoni, un simbolo per ogni suono. I dizionari lo mettono tra barre oblique: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              pl: ["IPA zapisuje dźwięki, jeden symbol dla każdego dźwięku. Słowniki umieszczają go między ukośnikami: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              tr: ["IPA sesleri yazar; her ses için bir simge vardır. Sözlükler onu eğik çizgiler arasına koyar: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              id: ["AFI menuliskan bunyi, satu simbol untuk setiap bunyi. Kamus meletakkannya di antara garis miring: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
              vi: ["IPA ghi lại các âm, mỗi âm một ký hiệu. Từ điển đặt nó giữa hai dấu gạch chéo: ", { term: "book" }, " ", { ipa: "bʊk" }, "."]
          - type: rule
            level: A0
            text:
              en: ["Spelling and sound often differ: ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " has no ", { ipa: p }, " and no ", { ipa: h }, "."]
              uk: ["Правопис і звук часто не збігаються: у ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " немає ні ", { ipa: p }, ", ні ", { ipa: h }, "."]
              es: ["La ortografía y el sonido suelen diferir: ", { term: photo }, " ", { ipa: ˈfəʊtəʊ }, " no tiene ", { ipa: p }, " ni ", { ipa: h }, "."]
              pt: ["A ortografia e o som costumam diferir: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " não tem ", { ipa: "p" }, " nem ", { ipa: "h" }, "."]
              fr: ["L’orthographe et le son diffèrent souvent : ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " ne contient ni ", { ipa: "p" }, " ni ", { ipa: "h" }, "."]
              de: ["Schreibung und Laut unterscheiden sich oft: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " hat kein ", { ipa: "p" }, " und kein ", { ipa: "h" }, "."]
              it: ["Ortografia e suono spesso differiscono: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " non ha ", { ipa: "p" }, " né ", { ipa: "h" }, "."]
              pl: ["Pisownia i dźwięk często się różnią: w ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " nie ma ", { ipa: "p" }, " ani ", { ipa: "h" }, "."]
              tr: ["Yazım ve ses çoğu zaman farklıdır: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " sözcüğünde ne ", { ipa: "p" }, " ne de ", { ipa: "h" }, " sesi vardır."]
              id: ["Ejaan dan bunyi sering berbeda: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " tidak memiliki ", { ipa: "p" }, " dan tidak memiliki ", { ipa: "h" }, "."]
              vi: ["Chính tả và âm thường khác nhau: ", { term: "photo" }, " ", { ipa: "ˈfəʊtəʊ" }, " không có ", { ipa: "p" }, " và ", { ipa: "h" }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ː }, " makes a vowel long: ", { ipa: uː }, " in ", { term: food }, "."]
              uk: [{ letter: ː }, " робить голосний довгим: ", { ipa: uː }, " у ", { term: food }, "."]
              es: [{ letter: ː }, " alarga una vocal: ", { ipa: uː }, " en ", { term: food }, "."]
              pt: [{ letter: "ː" }, " alonga uma vogal: ", { ipa: "uː" }, " em ", { term: "food" }, "."]
              fr: [{ letter: "ː" }, " allonge une voyelle : ", { ipa: "uː" }, " dans ", { term: "food" }, "."]
              de: [{ letter: "ː" }, " macht einen Vokal lang: ", { ipa: "uː" }, " in ", { term: "food" }, "."]
              it: [{ letter: "ː" }, " allunga una vocale: ", { ipa: "uː" }, " in ", { term: "food" }, "."]
              pl: [{ letter: "ː" }, " wydłuża samogłoskę: ", { ipa: "uː" }, " w ", { term: "food" }, "."]
              tr: [{ letter: "ː" }, " ünlüyü uzatır: ", { term: "food" }, " sözcüğünde ", { ipa: "uː" }, "."]
              id: [{ letter: "ː" }, " membuat vokal menjadi panjang: ", { ipa: "uː" }, " dalam ", { term: "food" }, "."]
              vi: [{ letter: "ː" }, " làm nguyên âm dài: ", { ipa: "uː" }, " trong ", { term: "food" }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ˈ }, " comes before the stressed syllable: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]
              uk: [{ letter: ˈ }, " стоїть перед наголошеним складом: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]
              es: [{ letter: ˈ }, " va antes de la sílaba acentuada: ", { term: teacher }, " ", { ipa: ˈtiːtʃə }, "."]
              pt: [{ letter: "ˈ" }, " vem antes da sílaba tônica: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              fr: [{ letter: "ˈ" }, " se place avant la syllabe accentuée : ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              de: [{ letter: "ˈ" }, " steht vor der betonten Silbe: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              it: [{ letter: "ˈ" }, " sta prima della sillaba accentata: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              pl: [{ letter: "ˈ" }, " stoi przed sylabą akcentowaną: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              tr: [{ letter: "ˈ" }, " vurgulu hecenin önüne gelir: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              id: [{ letter: "ˈ" }, " berada sebelum suku kata yang diberi tekanan: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]
              vi: [{ letter: "ˈ" }, " đứng trước âm tiết mang trọng âm: ", { term: "teacher" }, " ", { ipa: "ˈtiːtʃə" }, "."]

  - title: { en: Consonant sounds, uk: "Приголосні звуки", es: "Sonidos consonánticos", pt: "Sons consonantais", fr: "Sons consonantiques", de: "Konsonantenlaute", it: "Suoni consonantici", pl: "Dźwięki spółgłoskowe", tr: "Ünsüz sesler", id: "Bunyi konsonan", vi: "Các phụ âm" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: sound, label: { en: Sound, uk: "Звук", es: "Sonido", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: spelling, label: { en: Spelling, uk: "Правопис", es: "Ortografía", pt: "Ortografia", fr: "Orthographe", de: "Schreibweise", it: "Ortografia", pl: "Pisownia", tr: "Yazım", id: "Ejaan", vi: "Chính tả" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
