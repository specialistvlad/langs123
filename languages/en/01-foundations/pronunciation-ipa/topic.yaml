  - title: { en: Word stress, uk: "Наголос у слові", es: "El acento de la palabra", pt: "Acento tônico da palavra", fr: "L’accent de mot", de: "Wortbetonung", it: "L'accento delle parole", pl: "Akcent wyrazowy", tr: "Sözcük vurgusu", id: "Tekanan kata", vi: "Trọng âm của từ" }
    role: own
    content:
      - type: prose
        level: A1
        text:
          en: "In a word of two or more syllables, one syllable is stronger and longer."
          uk: "У слові з двох і більше складів один склад звучить сильніше й довше."
          es: "En una palabra de dos o más sílabas, una sílaba es más fuerte y más larga."
          pt: "Em uma palavra de duas ou mais sílabas, uma sílaba é mais forte e mais longa."
          fr: "Dans un mot de deux syllabes ou plus, une syllabe est plus forte et plus longue."
          de: "In einem Wort mit zwei oder mehr Silben ist eine Silbe stärker und länger."
          it: "In una parola di due o più sillabe, una sillaba è più forte e più lunga."
          pl: "W wyrazie o dwóch lub więcej sylabach jedna sylaba jest mocniejsza i dłuższa."
          tr: "İki ya da daha çok heceli bir sözcükte bir hece daha güçlü ve daha uzundur."
          id: "Dalam kata yang terdiri atas dua suku kata atau lebih, satu suku kata lebih kuat dan lebih panjang."
          vi: "Trong từ có hai âm tiết trở lên, một âm tiết mạnh hơn và dài hơn."
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
