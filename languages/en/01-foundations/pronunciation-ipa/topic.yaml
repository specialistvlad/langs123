title: { en: Sounds and IPA, uk: Звуки та МФА, es: Sonidos y AFI, pt: "Sons e AFI", fr: "Sons et API", de: "Laute und IPA", it: "Suoni e AFI", pl: "Dźwięki i IPA", tr: "Sesler ve IPA", id: "Bunyi dan AFI", vi: "Âm và IPA" }
summary:
  lead:
    en: "The sounds of English, how to read them in IPA, and word stress."
    uk: "Звуки англійської мови, їхній запис у МФА та наголос у слові."
    es: "Los sonidos del inglés, cómo leerlos en el AFI y el acento de la palabra."
    pt: "Os sons do inglês, como lê-los em AFI e o acento tônico das palavras."
    fr: "Les sons de l’anglais, comment les lire en API, et l’accent de mot."
    de: "Die Laute des Englischen, wie man sie in IPA liest, und die Wortbetonung."
    it: "I suoni dell'inglese, come leggerli in AFI e l'accento delle parole."
    pl: "Dźwięki angielskiego, ich odczytywanie w IPA oraz akcent wyrazowy."
    tr: "İngilizcenin sesleri, bunların IPA ile nasıl okunduğu ve sözcük vurgusu."
    id: "Bunyi bahasa Inggris, cara membacanya dalam AFI, dan tekanan kata."
    vi: "Các âm của tiếng Anh, cách đọc chúng bằng IPA và trọng âm của từ."
  rule:
    en: "IPA gives every sound one symbol between slashes, so it shows how a word sounds whatever its spelling:"
    uk: "МФА дає кожному звуку один символ між скісними рисками, тож показує звучання слова незалежно від його написання:"
    es: "El AFI da a cada sonido un símbolo entre barras, así que muestra cómo suena una palabra sea cual sea su ortografía:"
    pt: "O AFI dá a cada som um símbolo entre barras, por isso mostra como uma palavra soa, qualquer que seja a sua ortografia:"
    fr: "L’API donne à chaque son un symbole entre barres obliques et montre ainsi comment un mot se prononce, quelle que soit son orthographe :"
    de: "IPA gibt jedem Laut ein eigenes Symbol zwischen Schrägstrichen und zeigt so, wie ein Wort klingt, unabhängig von der Schreibung:"
    it: "L'AFI dà a ogni suono un simbolo tra barre oblique, così mostra come suona una parola, qualunque sia la sua ortografia:"
    pl: "IPA daje każdemu dźwiękowi jeden symbol między ukośnikami, dzięki czemu pokazuje, jak brzmi wyraz, niezależnie od jego pisowni:"
    tr: "IPA her sese eğik çizgiler arasında tek bir simge verir; bu yüzden bir sözcüğün yazımı ne olursa olsun nasıl okunduğunu gösterir:"
    id: "AFI memberi setiap bunyi satu simbol di antara garis miring, sehingga menunjukkan cara sebuah kata diucapkan apa pun ejaannya:"
    vi: "IPA dùng một ký hiệu cho mỗi âm, đặt giữa hai dấu gạch chéo, nên cho biết từ phát âm thế nào dù viết ra sao:"
  ex: { examples: [[{ target: ship }, " ", { ipa: ʃɪp }], [{ target: sheep }, " ", { ipa: ʃiːp }, "."]] }

