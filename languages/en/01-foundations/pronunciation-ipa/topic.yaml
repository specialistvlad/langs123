        rows:
          - level: B2
            pattern: { alternatives: ["-ical", "-ity", "-graphy"] }
            rule: { en: the syllable before the suffix }
            ex: { examples: [["e", { stress: ˈlec }, "trical"], ["a", { stress: ˈbil }, "ity"], ["pho", { stress: ˈtog }, "raphy"]] }
          - level: B2
            pattern: { alternatives: ["-ee", "-eer", "-ese", "-ique"] }
