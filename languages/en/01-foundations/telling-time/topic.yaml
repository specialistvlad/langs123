          - type: rule
            level: A1
            text:
              en: ["In speech, the 12-hour clock is usual. Timetables use 24 hours: 19:30 = ", { time: nineteen thirty, value: "19:30" }, "."]
              uk: ["У мовленні зазвичай вживають 12-годинний формат. У розкладах — 24 години: 19:30 = ", { time: nineteen thirty, value: "19:30" }, "."]
              es: ["Al hablar se usa normalmente el reloj de 12 horas. Los horarios usan 24 horas: 19:30 = ", { time: nineteen thirty, value: "19:30" }, "."]
              pt: ["Na fala, costuma-se usar o relógio de 12 horas. Os horários usam 24 horas: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              fr: ["À l’oral, on emploie en général l’horloge de 12 heures. Les horaires utilisent 24 heures : 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              de: ["Gesprochen wird meist mit der 12-Stunden-Uhr. Fahrpläne verwenden 24 Stunden: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              it: ["Nel parlato si usa di solito l'orologio di 12 ore. Gli orari usano le 24 ore: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              pl: ["W mowie zwykle używa się zegara 12-godzinnego. Rozkłady jazdy używają 24 godzin: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              tr: ["Konuşmada genellikle 12 saatlik düzen kullanılır. Tarifelerde 24 saatlik düzen kullanılır: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              id: ["Dalam percakapan, format 12 jam yang umum dipakai. Jadwal memakai format 24 jam: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]
              vi: ["Khi nói, thường dùng đồng hồ 12 giờ. Lịch trình dùng đồng hồ 24 giờ: 19:30 = ", { time: "nineteen thirty", value: "19:30" }, "."]

