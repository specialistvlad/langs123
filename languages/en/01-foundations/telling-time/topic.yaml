              pt: ["Diz-se a hora e depois os minutos. Os minutos 1–9 levam ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              fr: ["On dit l’heure, puis les minutes. Les minutes 1–9 prennent ", { term: "oh" }, " : ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              de: ["Zuerst wird die Stunde gesagt, dann die Minuten. Die Minuten 1–9 nehmen ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              it: ["Si dice prima l'ora e poi i minuti. I minuti 1–9 prendono ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              pl: ["Najpierw podaje się godzinę, potem minuty. Przed minutami 1–9 stoi ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              tr: ["Önce saat, sonra dakika söylenir. 1–9 dakika ", { term: "oh" }, " alır: ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              id: ["Jam disebutkan lebih dulu, lalu menit. Menit 1–9 memakai ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
              vi: ["Nói giờ trước, rồi đến phút. Phút từ 1 đến 9 có ", { term: "oh" }, ": ", { mapping: ["7:05", { term: "seven oh five" }] }, "."]
          - type: rule
            level: A0
            text:
              en: [{ term: o'clock }, " ", { ipa: əˈklɒk }, " goes only with full hours: ", { term: seven o'clock }, "."]
              uk: [{ term: o'clock }, " ", { ipa: əˈklɒk }, " вживається лише з повними годинами: ", { term: seven o'clock }, "."]
              es: [{ term: o'clock }, " ", { ipa: əˈklɒk }, " se usa solo con horas en punto: ", { term: seven o'clock }, "."]
