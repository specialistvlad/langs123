summary:
  lead:
    en: ["How to ask the time and say it in numbers, and with ", { term: past }, " and ", { term: to }, "."]
    uk: ["Як запитати, котра година, і назвати час числами та за допомогою слів ", { term: past }, " і ", { term: to }, "."]
    es: ["Cómo preguntar la hora y decirla con números, y con ", { term: past }, " y ", { term: to }, "."]
    pt: ["Como perguntar as horas e dizê-las com números, e com ", { term: "past" }, " e ", { term: "to" }, "."]
    fr: ["Comment demander l’heure et la dire avec des nombres, et avec ", { term: "past" }, " et ", { term: "to" }, "."]
    de: ["Wie man nach der Uhrzeit fragt und sie mit Zahlen sagt, und mit ", { term: "past" }, " und ", { term: "to" }, "."]
    it: ["Come chiedere l'ora e dirla con i numeri e con ", { term: "past" }, " e ", { term: "to" }, "."]
    pl: ["Jak zapytać o godzinę i podać ją za pomocą liczb oraz słów ", { term: "past" }, " i ", { term: "to" }, "."]
    tr: ["Saatin nasıl sorulacağı ve rakamlarla, ", { term: "past" }, " ve ", { term: "to" }, " ile nasıl söyleneceği."]
    id: ["Cara menanyakan jam dan menyebutkannya dengan angka, serta dengan ", { term: "past" }, " dan ", { term: "to" }, "."]
    vi: ["Cách hỏi giờ và nói giờ bằng số, bằng ", { term: "past" }, " và ", { term: "to" }, "."]
  rule:
    en: ["Say the hour first, then the minutes: 7:05 is ", { term: seven oh five }, ", and ", { term: o'clock }, " follows only a full hour:"]
    uk: ["Спочатку називають годину, потім хвилини: 7:05 — це ", { term: seven oh five }, ", а ", { term: o'clock }, " стоїть лише після повної години:"]
    es: ["Se dice primero la hora y luego los minutos: 7:05 es ", { term: seven oh five }, ", y ", { term: o'clock }, " solo va después de una hora completa:"]
    pt: ["Diz-se primeiro a hora e depois os minutos: 7:05 é ", { term: "seven oh five" }, ", e ", { term: "o'clock" }, " só vem depois de uma hora cheia:"]
    fr: ["On dit d’abord l’heure, puis les minutes : 7:05 se dit ", { term: "seven oh five" }, ", et ", { term: "o'clock" }, " ne suit qu’une heure pleine :"]
    de: ["Zuerst wird die Stunde gesagt, dann die Minuten: 7:05 ist ", { term: "seven oh five" }, ", und ", { term: "o'clock" }, " folgt nur auf eine volle Stunde:"]
    it: ["Si dice prima l'ora e poi i minuti: 7:05 si dice ", { term: "seven oh five" }, ", e ", { term: "o'clock" }, " segue solo un'ora piena:"]
    pl: ["Najpierw podaje się godzinę, potem minuty: 7:05 to ", { term: "seven oh five" }, ", a ", { term: "o'clock" }, " występuje tylko po pełnej godzinie:"]
    tr: ["Önce saat, sonra dakika söylenir: 7:05 ", { term: "seven oh five" }, " olur; ", { term: "o'clock" }, " yalnızca tam saatten sonra gelir:"]
    id: ["Jam disebutkan lebih dulu, lalu menit: 7:05 dibaca ", { term: "seven oh five" }, ", dan ", { term: "o'clock" }, " hanya mengikuti jam penuh:"]
    vi: ["Nói giờ trước, rồi đến phút: 7:05 đọc là ", { term: "seven oh five" }, ", và ", { term: "o'clock" }, " chỉ đi với giờ tròn:"]
  ex: [{ target: seven o'clock }, "."]

