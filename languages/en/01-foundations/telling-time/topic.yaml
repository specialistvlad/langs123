              pl: [{ term: "o'clock" }, " ", { ipa: "əˈklɒk" }, " występuje tylko z pełnymi godzinami: ", { term: "seven o'clock" }, "."]
              tr: [{ term: "o'clock" }, " ", { ipa: "əˈklɒk" }, " yalnızca tam saatlerle kullanılır: ", { term: "seven o'clock" }, "."]
              id: [{ term: "o'clock" }, " ", { ipa: "əˈklɒk" }, " hanya dipakai untuk jam penuh: ", { term: "seven o'clock" }, "."]
              vi: [{ term: "o'clock" }, " ", { ipa: "əˈklɒk" }, " chỉ đi với giờ tròn: ", { term: "seven o'clock" }, "."]

