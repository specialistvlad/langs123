sections:
  - title: { en: The time in numbers, uk: "Час у числах", es: "La hora en números", pt: "As horas em números", fr: "L’heure en chiffres", de: "Die Uhrzeit mit Zahlen", it: "L'ora in numeri", pl: "Godzina w liczbach", tr: "Rakamlarla saat", id: "Jam dalam angka", vi: "Giờ bằng số" }
