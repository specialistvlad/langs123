            text:
              en: ["13–19 add ", { term: "-teen" }, "; 13, 15 and 18 change their first part: ", { letter: thir }, "teen, ", { letter: fif }, "teen, ", { letter: eigh }, teen.]
              uk: ["Числа 13–19 утворюються за допомогою ", { term: "-teen" }, "; у 13, 15 і 18 змінюється перша частина: ", { letter: thir }, "teen, ", { letter: fif }, "teen, ", { letter: eigh }, "teen."]
