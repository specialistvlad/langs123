              vi: ["Viết tắt: ", { pattern: [{ slot: "number" }, "hai chữ cái cuối của từ"] }, ": 1", { ending: "st" }, ", 2", { ending: "nd" }, ", 3", { ending: "rd" }, ", 4", { ending: "th" }, "."]
          - type: rule
