          - level: C1
            point: { en: Rounding }
            rule: { en: [{ term: to the nearest }, " names the unit; ", { term: decimal places }, " counts the digits after the point"] }
            ex: { examples: [["Round it ", { target: to the nearest ten }, "."], ["Give it ", { target: to two decimal places }, "."]] }

  - title: { en: Roman numerals and regnal numbers }
