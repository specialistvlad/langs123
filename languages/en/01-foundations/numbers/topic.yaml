  rule:
    en: "Numbers in -teen stress the end and numbers in -ty the start:"
    uk: "У числах із -teen наголос падає на кінець, а в числах із -ty — на початок:"
    es: "En los números con -teen el acento va al final y en los números con -ty, al principio:"
    pt: "Nos números com -teen a sílaba tônica fica no fim e nos números com -ty, no início:"
    fr: "L’accent tonique tombe sur la fin dans les nombres en -teen et sur le début dans les nombres en -ty :"
    de: "Bei Zahlen auf -teen liegt die Betonung am Ende, bei Zahlen auf -ty am Anfang:"
    it: "I numeri in -teen hanno l'accento alla fine e quelli in -ty all'inizio:"
    pl: "W liczbach z -teen akcent pada na koniec, a w liczbach z -ty na początek:"
    tr: "Sonu -teen ile biten sayılarda vurgu sona, sonu -ty ile biten sayılarda başa gelir:"
    id: "Angka berakhiran -teen ditekankan di bagian akhir dan angka berakhiran -ty ditekankan di bagian awal:"
    vi: "Số có đuôi -teen nhấn ở phần cuối, số có đuôi -ty nhấn ở phần đầu:"
  ex: { examples: [[thir, { stress: teen }, " is 13"], [{ stress: thir }, ty is 30.]] }

