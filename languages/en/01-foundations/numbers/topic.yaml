    es: ["Los números del 0 al millón y los ordinales ", { term: first }, ", ", { term: second }, ", ", { term: third }, "."]
    pt: ["Os números de 0 a um milhão e os ordinais ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
    fr: ["Les nombres de 0 à un million, et les ordinaux ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
    de: ["Zahlen von 0 bis zu einer Million und die Ordnungszahlen ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
    it: ["I numeri da 0 a un milione e gli ordinali ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
    pl: ["Liczby od 0 do miliona i liczebniki porządkowe ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
    tr: ["Sıfırdan bir milyona kadar sayılar ve ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, " sıra sayıları."]
    id: ["Angka dari 0 sampai satu juta, serta angka ordinal ", { term: "first" }, ", ", { term: "second" }, ", ", { term: "third" }, "."]
