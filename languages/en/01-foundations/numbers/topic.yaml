              pt: ["Os números 13–19 acrescentam ", { term: "-teen" }, "; em 13, 15 e 18 muda a primeira parte: ", { letter: "thir" }, "teen, ", { letter: "fif" }, "teen, ", { letter: "eigh" }, "teen."]
