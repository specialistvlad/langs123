          - level: C1
            point: { en: Ranges }
            rule: { en: [{ term: between }, " takes ", { term: and }, "; ", { term: from }, " takes ", { term: to }, " or ", { term: up to }, "; tables use an en dash"] }
            ex: { examples: [{ target: "between 5 and 10" }, { target: "from 5 up to 10" }, { target: "5–10" }] }
          - level: C1
            point: { en: per }
            rule: { en: [{ term: per }, " means for each"] }
