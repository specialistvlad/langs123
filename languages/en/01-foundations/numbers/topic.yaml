# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.numbers
lang: en
kind: foundations
tags: [numbers, counting, ordinals]
concepts: [numbers]
related: [en.foundations.pronunciation-ipa, en.foundations.days-months-dates, en.foundations.telling-time]
status: { en: draft, uk: draft, es: draft }

title: { en: Numbers, uk: Числа, es: Los números }
summary:
  lead:
    en: "Numbers from 0 to a million, and the ordinals first, second, third."
    uk: "Числа від 0 до мільйона та порядкові числівники first, second, third."
    es: "Los números del 0 al millón y los ordinales first, second, third."
  rule:
    en: "Numbers in -teen stress the end and numbers in -ty the start:"
    uk: "У числах із -teen наголос падає на кінець, а в числах із -ty — на початок:"
    es: "En los números con -teen el acento va al final y en los números con -ty, al principio:"
  ex: { examples: [[thir, { stress: teen }, " is 13"], [{ stress: thir }, ty is 30.]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A0, point: "0–12", rule: { en: ["each has its own word; ", { term: "-teen" }, " starts at 13"], uk: ["кожне число має власне слово; ", { term: "-teen" }, " починається з 13"], es: ["cada número tiene su propia palabra; ", { term: "-teen" }, " empieza en 13"] }, ex: { examples: [{ target: zero }, { target: eleven }, { target: twelve }] }, tr: { uk: { examples: ["нуль", "одинадцять", "дванадцять"] }, es: { examples: ["cero", "once", "doce"] } } }
        - { level: A0, point: "-teen", rule: { en: ["13–19 add stressed ", { term: "-teen" }, "; 13, 15 and 18 change their first part"], uk: ["13–19 мають наголошене ", { term: "-teen" }, "; у 13, 15 і 18 змінюється перша частина"], es: ["13–19 añaden ", { term: "-teen" }, " acentuado; en 13, 15 y 18 cambia la primera parte"] }, ex: { examples: [[{ target: [{ letter: thir }, { stress: teen }] }, " ", { ipa: θɜːˈtiːn }], { target: [{ letter: fif }, teen] }, { target: [{ letter: eigh }, teen] }] }, tr: { uk: { examples: ["тринадцять", "п’ятнадцять", "вісімнадцять"] }, es: { examples: ["trece", "quince", "dieciocho"] } } }
        - { level: A0, point: "-ty", rule: { en: ["tens end in ", { term: "-ty" }, " and the stress is on the first part"], uk: ["десятки закінчуються на ", { term: "-ty" }, ", наголос на першій частині"], es: ["las decenas terminan en ", { term: "-ty" }, " y el acento va en la primera parte"] }, ex: { examples: [[{ target: [{ stress: thir }, ty] }, " ", { ipa: ˈθɜːti }], { target: [{ stress: for }, ty] }] }, tr: { uk: { examples: ["тридцять", "сорок"] }, es: { examples: ["treinta", "cuarenta"] } } }
        - { level: A0, point: "21–99", rule: { en: { pattern: [ten, { slot: hyphen }, { slot: unit }] }, uk: { pattern: [ten, { slot: hyphen }, { slot: unit }] }, es: { pattern: [ten, { slot: hyphen }, { slot: unit }] } }, ex: { examples: [{ target: twenty-one }, { target: forty-five }] }, tr: { uk: { examples: ["двадцять один", "сорок п’ять"] }, es: { examples: ["veintiuno", "cuarenta y cinco"] } } }
        - { level: A0, point: "hundred, thousand, million", rule: { en: ["they stay singular after a number; ", { term: and }, " comes after ", { term: hundred }], uk: ["після числа вони залишаються в однині, без -s; ", { term: and }, " стоїть після ", { term: hundred }], es: ["después de un número quedan en singular; ", { term: and }, " va después de ", { term: hundred }] }, ex: { examples: [["two ", { target: hundred }, " ", { target: and }, " fifty"], ["five ", { target: million }]] }, tr: { uk: { examples: ["двісті п’ятдесят", "п’ять мільйонів"] }, es: { examples: ["doscientos cincuenta", "cinco millones"] } } }
        - { level: A0, point: { en: Ordinals, uk: "Порядкові числівники", es: "Números ordinales" }, rule: { en: ["the order of things: first, second, third; from 4 add ", { term: "-th" }], uk: ["показують порядок: first, second, third; від 4 додається ", { term: "-th" }], es: ["indican el orden de las cosas: first, second, third; desde el 4 se añade ", { term: "-th" }] }, ex: { examples: [["My flat is on the ", { target: second }, " floor."], ["the ", { target: [four, { ending: th }] }, " of July"]] }, tr: { uk: { examples: ["Моя квартира на другому поверсі.", "четверте липня"] }, es: { examples: ["Mi apartamento está en el segundo piso.", "el cuatro de julio"] } } }
        - { level: A0, point: { en: Short ordinals, uk: "Скорочений запис", es: "Escritura abreviada" }, rule: { en: { pattern: [{ slot: number }, the last two letters of the word] }, uk: { pattern: [{ slot: number }, "дві останні літери слова"] }, es: { pattern: [{ slot: number }, "las dos últimas letras de la palabra"] } }, ex: { examples: [{ target: ["1", { ending: st }] }, { target: ["2", { ending: nd }] }, { target: ["3", { ending: rd }] }, { target: ["4", { ending: th }] }] }, tr: { uk: { examples: ["перший", "другий", "третій", "четвертий"] }, es: { examples: ["primero", "segundo", "tercero", "cuarto"] } } }
        - { level: A0, point: { en: Compound ordinals, uk: "Складені порядкові числівники", es: "Ordinales compuestos" }, rule: { en: only the last word changes, uk: "змінюється лише останнє слово", es: "solo cambia la última palabra" }, ex: { examples: [["twenty-", { target: first }], ["a hundred and ", { target: second }]] }, tr: { uk: { examples: ["двадцять перший", "сто другий"] }, es: { examples: ["vigésimo primero", "centésimo segundo"] } } }
        - { level: A0, point: { en: Phone numbers, uk: "Телефонні номери", es: "Números de teléfono" }, rule: { en: ["say each digit; 0 is ", { term: oh }, "; two equal digits are ", { term: double }], uk: ["кожну цифру називають окремо; 0 читається ", { term: oh }, "; дві однакові цифри — ", { term: double }], es: ["se dice cada dígito; el 0 es ", { term: oh }, "; dos dígitos iguales se dicen ", { term: double }] }, ex: { mapping: ["077", { numeral: [{ target: oh }, " ", { target: double }, " seven"], value: "077" }] }, tr: { uk: "нуль, сім, сім", es: "cero, siete, siete" } }
        - { level: A0, point: { en: Comma and point, uk: "Кома і крапка", es: "Coma y punto" }, rule: { en: a comma separates thousands; a point separates decimals, uk: "кома відокремлює тисячі; крапка відокремлює десяткові частини", es: "la coma separa los miles; el punto separa los decimales" }, ex: { examples: [{ target: "1,500" }, { mapping: ["2.5", { numeral: ["two ", { target: point }, " five"], value: 2.5 }] }] }, tr: { uk: { examples: ["тисяча п’ятсот", "дві цілих п’ять десятих"] }, es: { examples: ["mil quinientos", "dos coma cinco"] } } }
        - { level: A0, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: "five, nine, twelve and twenty change their spelling in ordinals", uk: "five, nine, twelve і twenty змінюють написання в порядкових числівниках", es: "five, nine, twelve y twenty cambian su ortografía en los ordinales" }, ex: { examples: [{ target: [fi, { letter: f }, th] }, { target: [nin, { ending: th }] }, { target: [twel, { letter: f }, th] }, { target: [twent, { letter: ie }, th] }] }, tr: { uk: { examples: ["п’ятий", "дев’ятий", "дванадцятий", "двадцятий"] }, es: { examples: ["quinto", "noveno", "duodécimo", "vigésimo"] } } }
        - { level: A0, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: forty drops the u that fourteen keeps, uk: "у forty немає u, яку зберігає fourteen", es: "forty pierde la u que fourteen conserva" }, ex: { contrast: [fourteen, { target: forty }] }, tr: { uk: "чотирнадцять, сорок", es: "catorce, cuarenta" } }

sections:
  - title: { en: "0 to 12", uk: "Від 0 до 12", es: "Del 0 al 12" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, uk: "Число", es: "Número" } }
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: ipa, label: { en: Pronunciation, uk: "Вимова", es: "Pronunciación" } }
        rows:
          - { level: A0, value: 0, number: "0", word: zero, ipa: { ipa: ˈzɪərəʊ } }
          - { level: A0, value: 1, number: "1", word: one, ipa: { ipa: wʌn } }
          - { level: A0, value: 2, number: "2", word: two, ipa: { ipa: tuː } }
          - { level: A0, value: 3, number: "3", word: three, ipa: { ipa: θriː } }
          - { level: A0, value: 4, number: "4", word: four, ipa: { ipa: fɔː } }
          - { level: A0, value: 5, number: "5", word: five, ipa: { ipa: faɪv } }
          - { level: A0, value: 6, number: "6", word: six, ipa: { ipa: sɪks } }
          - { level: A0, value: 7, number: "7", word: seven, ipa: { ipa: ˈsevn } }
          - { level: A0, value: 8, number: "8", word: eight, ipa: { ipa: eɪt } }
          - { level: A0, value: 9, number: "9", word: nine, ipa: { ipa: naɪn } }
          - { level: A0, value: 10, number: "10", word: ten, ipa: { ipa: ten } }
          - { level: A0, value: 11, number: "11", word: eleven, ipa: { ipa: ɪˈlevn } }
          - { level: A0, value: 12, number: "12", word: twelve, ipa: { ipa: twelv } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["In phone numbers, say each digit. 0 is ", { term: oh }, " ", { ipa: əʊ }, "; two equal digits are ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]
              uk: ["У телефонних номерах кожну цифру називають окремо. 0 читається ", { term: oh }, " ", { ipa: əʊ }, "; дві однакові цифри — ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]
              es: ["En los números de teléfono se dice cada dígito. El 0 es ", { term: oh }, " ", { ipa: əʊ }, "; dos dígitos iguales se dicen ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]

  - title: { en: "13 to 19", uk: "Від 13 до 19", es: "Del 13 al 19" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, uk: "Число", es: "Número" } }
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: ipa, label: { en: Pronunciation, uk: "Вимова", es: "Pronunciación" } }
        rows:
          - { level: A0, value: 13, number: "13", word: [{ letter: thir }, teen], ipa: { ipa: θɜːˈtiːn } }
          - { level: A0, value: 14, number: "14", word: fourteen, ipa: { ipa: fɔːˈtiːn } }
          - { level: A0, value: 15, number: "15", word: [{ letter: fif }, teen], ipa: { ipa: fɪfˈtiːn } }
          - { level: A0, value: 16, number: "16", word: sixteen, ipa: { ipa: sɪksˈtiːn } }
          - { level: A0, value: 17, number: "17", word: seventeen, ipa: { ipa: sevnˈtiːn } }
          - { level: A0, value: 18, number: "18", word: [{ letter: eigh }, teen], ipa: { ipa: eɪˈtiːn } }
          - { level: A0, value: 19, number: "19", word: nineteen, ipa: { ipa: naɪnˈtiːn } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["13–19 add ", { term: "-teen" }, "; 13, 15 and 18 change their first part: ", { letter: thir }, "teen, ", { letter: fif }, "teen, ", { letter: eigh }, teen.]
              uk: ["Числа 13–19 утворюються за допомогою ", { term: "-teen" }, "; у 13, 15 і 18 змінюється перша частина: ", { letter: thir }, "teen, ", { letter: fif }, "teen, ", { letter: eigh }, "teen."]
              es: ["Los números 13–19 añaden ", { term: "-teen" }, "; en 13, 15 y 18 cambia la primera parte: ", { letter: thir }, "teen, ", { letter: fif }, "teen, ", { letter: eigh }, "teen."]

  - title: { en: "20 to 90", uk: "Від 20 до 90", es: "Del 20 al 90" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, uk: "Число", es: "Número" } }
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: ipa, label: { en: Pronunciation, uk: "Вимова", es: "Pronunciación" } }
        rows:
          - { level: A0, value: 20, number: "20", word: twenty, ipa: { ipa: ˈtwenti } }
          - { level: A0, value: 30, number: "30", word: [{ letter: thir }, ty], ipa: { ipa: ˈθɜːti } }
          - { level: A0, value: 40, number: "40", word: [{ letter: for }, ty], ipa: { ipa: ˈfɔːti } }
          - { level: A0, value: 50, number: "50", word: [{ letter: fif }, ty], ipa: { ipa: ˈfɪfti } }
          - { level: A0, value: 60, number: "60", word: sixty, ipa: { ipa: ˈsɪksti } }
          - { level: A0, value: 70, number: "70", word: seventy, ipa: { ipa: ˈsevnti } }
          - { level: A0, value: 80, number: "80", word: [{ letter: eigh }, ty], ipa: { ipa: ˈeɪti } }
          - { level: A0, value: 90, number: "90", word: ninety, ipa: { ipa: ˈnaɪnti } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Tens end in ", { term: "-ty" }, ". ", { pattern: [Ten, { slot: hyphen }, { slot: unit }] }, ": twenty-one, forty-five, ninety-nine."]
              uk: ["Десятки закінчуються на ", { term: "-ty" }, ". ", { pattern: [Ten, { slot: hyphen }, { slot: unit }] }, ": twenty-one, forty-five, ninety-nine."]
              es: ["Las decenas terminan en ", { term: "-ty" }, ". ", { pattern: [Ten, { slot: hyphen }, { slot: unit }] }, ": twenty-one, forty-five, ninety-nine."]
          - type: rule
            level: A0
            text:
              en: ["-teen is stressed; -ty is not: ", { contrast: [[thir, { stress: teen }, " ", { ipa: θɜːˈtiːn }], [{ stress: thir }, "ty ", { ipa: ˈθɜːti }]] }, "."]
              uk: ["-teen наголошується, -ty — ні: ", { contrast: [[thir, { stress: teen }, " ", { ipa: θɜːˈtiːn }], [{ stress: thir }, "ty ", { ipa: ˈθɜːti }]] }, "."]
              es: ["-teen lleva el acento; -ty no: ", { contrast: [[thir, { stress: teen }, " ", { ipa: θɜːˈtiːn }], [{ stress: thir }, "ty ", { ipa: ˈθɜːti }]] }, "."]

  - title: { en: "Hundreds, thousands, millions", uk: "Сотні, тисячі, мільйони", es: "Centenas, miles, millones" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, uk: "Число", es: "Número" } }
          - { key: words, label: { en: Words, uk: "Слова", es: "Palabras" } }
        rows:
          - { level: A0, value: 100, number: "100", words: [{ alternatives: [a, one] }, " ", { target: hundred }] }
          - { level: A0, value: 105, number: "105", words: ["a hundred ", { target: and }, " five"] }
          - { level: A0, value: 250, number: "250", words: ["two hundred ", { target: and }, " fifty"] }
          - { level: A0, value: 1000, number: "1,000", words: [{ alternatives: [a, one] }, " ", { target: thousand }] }
          - { level: A0, value: 1250, number: "1,250", words: ["one thousand two hundred ", { target: and }, " fifty"] }
          - { level: A0, value: 10000, number: "10,000", words: ten thousand }
          - { level: A0, value: 1000000, number: "1,000,000", words: [{ alternatives: [a, one] }, " ", { target: million }] }
          - { level: A0, value: 2.5, number: "2.5", words: ["two ", { target: point }, " five"] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: and }, " comes after hundred: three hundred ", { term: and }, " five (", { variant: three hundred five, variety: en-US }, ")."]
              uk: [{ term: and }, " стоїть після hundred: three hundred ", { term: and }, " five (", { variant: three hundred five, variety: en-US }, ")."]
              es: [{ term: and }, " va después de hundred: three hundred ", { term: and }, " five (", { variant: three hundred five, variety: en-US }, ")."]
          - type: rule
            level: A0
            text:
              en: ["After a number, hundred, thousand and million stay singular: two ", { term: hundred }, ", five ", { term: million }, "."]
              uk: ["Після числа hundred, thousand і million залишаються в однині: two ", { term: hundred }, ", five ", { term: million }, "."]
              es: ["Después de un número, hundred, thousand y million quedan en singular: two ", { term: hundred }, ", five ", { term: million }, "."]
          - type: rule
            level: A0
            text:
              en: ["A comma separates thousands; a point separates decimals: ", { examples: ["1,500", "2.5"] }, "."]
              uk: ["Кома відокремлює тисячі, крапка — десяткові частини: ", { examples: ["1,500", "2.5"] }, "."]
              es: ["La coma separa los miles y el punto separa los decimales: ", { examples: ["1,500", "2.5"] }, "."]

  - title: { en: Ordinal numbers, uk: "Порядкові числівники", es: "Números ordinales" }
    role: own
    content:
      - type: inventory
        set: ordinals
        columns:
          - { key: number, label: { en: Number, uk: "Число", es: "Número" } }
          - { key: word, label: { en: Ordinal, uk: "Порядковий числівник", es: "Ordinal" } }
          - { key: ipa, label: { en: Pronunciation, uk: "Вимова", es: "Pronunciación" } }
        rows:
          - { level: A0, value: 1, number: "1st", word: [fir, { ending: st }], ipa: { ipa: fɜːst } }
          - { level: A0, value: 2, number: "2nd", word: [seco, { ending: nd }], ipa: { ipa: ˈsekənd } }
          - { level: A0, value: 3, number: "3rd", word: [thi, { ending: rd }], ipa: { ipa: θɜːd } }
          - { level: A0, value: 4, number: "4th", word: [four, { ending: th }], ipa: { ipa: fɔːθ } }
          - { level: A0, value: 5, number: "5th", word: [fif, { ending: th }], ipa: { ipa: fɪfθ } }
          - { level: A0, value: 6, number: "6th", word: [six, { ending: th }], ipa: { ipa: sɪksθ } }
          - { level: A0, value: 7, number: "7th", word: [seven, { ending: th }], ipa: { ipa: ˈsevnθ } }
          - { level: A0, value: 8, number: "8th", word: [eigh, { ending: th }], ipa: { ipa: eɪtθ } }
          - { level: A0, value: 9, number: "9th", word: [nin, { ending: th }], ipa: { ipa: naɪnθ } }
          - { level: A0, value: 10, number: "10th", word: [ten, { ending: th }], ipa: { ipa: tenθ } }
          - { level: A0, value: 12, number: "12th", word: [twelf, { ending: th }], ipa: { ipa: twelfθ } }
          - { level: A0, value: 20, number: "20th", word: [twentie, { ending: th }], ipa: { ipa: ˈtwentiəθ } }
          - { level: A0, value: 100, number: "100th", word: [hundred, { ending: th }], ipa: { ipa: ˈhʌndrədθ } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["1, 2 and 3 have their own words. From 4, add ", { term: "-th" }, "."]
              uk: ["Для 1, 2 і 3 є власні слова. Від 4 додається ", { term: "-th" }, "."]
              es: ["1, 2 y 3 tienen sus propias palabras. Desde el 4 se añade ", { term: "-th" }, "."]
          - type: rule
            level: A0
            text:
              en: ["Spelling changes: ", { mapping: [five, [fi, { letter: f }, th]] }, ", ", { mapping: [nine, [nin, { ending: th }]] }, ", ", { mapping: [twelve, [twel, { letter: f }, th]] }, ", ", { mapping: [twenty, [twent, { letter: ie }, th]] }, "."]
              uk: ["Змінюється написання: ", { mapping: [five, [fi, { letter: f }, th]] }, ", ", { mapping: [nine, [nin, { ending: th }]] }, ", ", { mapping: [twelve, [twel, { letter: f }, th]] }, ", ", { mapping: [twenty, [twent, { letter: ie }, th]] }, "."]
              es: ["Cambia la ortografía: ", { mapping: [five, [fi, { letter: f }, th]] }, ", ", { mapping: [nine, [nin, { ending: th }]] }, ", ", { mapping: [twelve, [twel, { letter: f }, th]] }, ", ", { mapping: [twenty, [twent, { letter: ie }, th]] }, "."]
          - type: rule
            level: A0
            text:
              en: ["Written short: ", { pattern: [{ slot: number }, the last two letters of the word] }, ": 1", { ending: st }, ", 2", { ending: nd }, ", 3", { ending: rd }, ", 4", { ending: th }, "."]
              uk: ["Скорочений запис: ", { pattern: [{ slot: number }, "дві останні літери слова"] }, ": 1", { ending: st }, ", 2", { ending: nd }, ", 3", { ending: rd }, ", 4", { ending: th }, "."]
              es: ["Escritura abreviada: ", { pattern: [{ slot: number }, "las dos últimas letras de la palabra"] }, ": 1", { ending: st }, ", 2", { ending: nd }, ", 3", { ending: rd }, ", 4", { ending: th }, "."]
          - type: rule
            level: A0
            text:
              en: ["In compound numbers, only the last word changes: twenty-", { term: first }, ", a hundred and ", { term: second }, "."]
              uk: ["У складених числівниках змінюється лише останнє слово: twenty-", { term: first }, ", a hundred and ", { term: second }, "."]
              es: ["En los números compuestos solo cambia la última palabra: twenty-", { term: first }, ", a hundred and ", { term: second }, "."]
          - type: rule
            level: A0
            text:
              en: "Ordinals give the order of things: floors, places, dates."
              uk: "Порядкові числівники показують порядок: поверхи, місця, дати."
              es: "Los ordinales indican el orden de las cosas: pisos, lugares, fechas."
            ex: ["My flat is on the ", { target: second }, " floor."]
            tr: { uk: "Моя квартира на другому поверсі.", es: "Mi apartamento está en el segundo piso." }

