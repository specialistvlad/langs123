              vi: ["Trong số ghép, chỉ từ cuối thay đổi: ", { term: "twenty-first" }, ", ", { term: "a hundred and second" }, "."]
          - type: rule
            level: A0
            text:
              en: "Ordinals give the order of things: floors, places, dates."
              uk: "Порядкові числівники показують порядок: поверхи, місця, дати."
              es: "Los ordinales indican el orden de las cosas: pisos, lugares, fechas."
              pt: "Os ordinais indicam a ordem das coisas: andares, lugares, datas."
              fr: "Les ordinaux indiquent l’ordre des choses : étages, places, dates."
              de: "Ordnungszahlen geben die Reihenfolge von Dingen an: Stockwerke, Plätze, Daten."
              it: "Gli ordinali indicano l'ordine delle cose: piani, posizioni, date."
              pl: "Liczebniki porządkowe wskazują kolejność: piętra, miejsca, daty."
