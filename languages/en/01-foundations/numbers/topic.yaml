            ex: ["My flat is on the ", { target: second }, " floor."]
            tr: { uk: "Моя квартира на другому поверсі.", es: "Mi apartamento está en el segundo piso.", pt: "Meu apartamento fica no segundo andar.", fr: "Mon appartement est au deuxième étage.", de: "Meine Wohnung liegt im zweiten Stock.", it: "Il mio appartamento è al secondo piano.", pl: "Moje mieszkanie jest na drugim piętrze.", tr: "Dairem ikinci katta.", id: "Apartemen saya ada di lantai dua.", vi: "Căn hộ của tôi ở tầng hai." }

  - title: { en: Fractions and decimals }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: B2, value: 0.5, number: "1/2", said: [{ alternatives: ["a", "one"] }, " ", { target: half }] }
          - { level: B2, value: 0.3333333333333333, number: "1/3", said: ["a ", { target: third }] }
          - { level: B2, value: 0.6666666666666666, number: "2/3", said: ["two ", { target: thirds }] }
          - { level: B2, value: 0.25, number: "1/4", said: ["a ", { target: quarter }] }
          - { level: B2, value: 0.75, number: "3/4", said: ["three ", { target: quarters }] }
          - { level: B2, value: 0.625, number: "5/8", said: ["five ", { target: eighths }] }
          - { level: B2, value: 1.5, number: "1 1/2", said: { target: "one and a half" } }
          - { level: B2, value: 0.5, number: "0.5", said: [{ alternatives: ["nought", "zero"] }, " point five"] }
          - { level: B2, value: 3.14, number: "3.14", said: "three point one four" }
          - { level: B2, value: 0.25, number: "0.25", said: [{ alternatives: ["nought", "zero"] }, " point two five"] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: ["Say the top number, then the bottom number as an ordinal; above one it takes ", { term: "-s" }, ": ", { term: five eighths }, "."]
          - type: rule
            level: B2
            text:
              en: ["Join a whole number and a fraction with ", { term: and }, ": ", { term: one and a half }, "."]
          - type: rule
            level: B2
            text:
              en: ["After the point, say each digit alone: ", { mapping: ["3.14", { numeral: three point one four, value: 3.14 }] }, "."]
          - type: rule
            level: B2
            text:
              en: ["With a noun, ", { term: half }, " comes before the article: ", { term: half an hour }, "."]

  - title: { en: Percentages and approximations }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            point: { en: Percentages }
            rule: { en: ["say ", { term: per cent }, " after the number"] }
            ex: { mapping: ["50%", [{ numeral: fifty, value: 50 }, " ", { target: per cent }, " ", { variant: percent, variety: en-US }]] }
          - level: B2
            point: { en: Percentage points }
            rule: { en: "a change from one percentage to another counts in percentage points" }
            ex: ["Support rose from 10% to 12%, a rise of two ", { target: percentage points }, "."]
          - level: B2
            point: { alternatives: ["about", "around", "roughly"] }
            rule: { en: "before a number, they show it is not exact" }
            ex: { examples: [[{ target: about }, " fifty"], [{ target: around }, " two hundred"], [{ target: roughly }, " a thousand"]] }
          - level: B2
            point: { alternatives: ["nearly", "almost", "just under"] }
            rule: { en: "a little less than the number" }
            ex: { examples: [[{ target: nearly }, " ten"], [{ target: almost }, " a hundred"], [{ target: just under }, " fifty"]] }
          - level: B2
            point: { alternatives: ["just over", "a bit over"] }
            rule: { en: "a little more than the number" }
            ex: { examples: [[{ target: just over }, " a hundred"], [{ target: a bit over }, " ten"]] }
          - level: B2
            point: { en: dozen }
            rule: { en: "a dozen is twelve; after a number it stays singular" }
            ex: { examples: [["a ", { target: dozen }, " eggs"], ["two ", { target: dozen }, " eggs"]] }
          - level: B2
            point: { en: a couple of }
            rule: { en: "about two" }
            ex: ["We stayed for ", { target: a couple of }, " days."]
          - level: B2
            point: { alternatives: ["dozens of", "hundreds of"] }
            rule: { en: "many, with no exact number" }
            ex: { examples: [[{ target: dozens of }, " people"], [{ target: hundreds of }, " books"]] }

  - title: { en: Calculations and measurements }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: rule, label: { en: Say } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            use: { en: Adding and subtracting }
            rule: { en: [{ term: plus }, ", ", { term: minus }, " and ", { term: equals }, " or ", { term: is }] }
            ex: { examples: [["Two ", { target: plus }, " three ", { target: equals }, " five."], ["Ten ", { target: minus }, " four ", { target: is }, " six."]] }
          - level: B2
            use: { en: Multiplying and dividing }
            rule: { en: [{ term: times }, " and ", { term: divided by }] }
            ex: { examples: [["Three ", { target: times }, " four is twelve."], ["Twelve ", { target: divided by }, " three is four."]] }
          - level: B2
            use: { en: Powers and roots }
            rule: { en: [{ term: squared }, ", ", { term: cubed }, " and ", { term: square root }] }
            ex: { examples: [["Five ", { target: squared }, " is twenty-five."], ["The ", { target: square root }, " of nine is three."]] }
          - level: B2
            use: { en: Units }
            rule: { en: "read the symbol as the full name of the unit" }
            ex: { examples: [{ mapping: ["5 cm", ["five ", { target: centimetres }, " ", { variant: centimeters, variety: en-US }]] }, { mapping: ["10 kg", ["ten ", { target: kilos }]] }, { mapping: ["30 mph", ["thirty ", { target: miles per hour }]] }] }
          - level: B2
            use: { en: Temperatures }
            rule: { en: ["say ", { term: degrees }, "; a negative temperature takes ", { term: minus }] }
            ex: { examples: [{ mapping: ["25°C", ["twenty-five ", { target: degrees }]] }, { mapping: ["−5°C", [{ target: minus }, " five degrees"]] }] }
          - level: B2
            use: { en: Height }
            rule: { en: ["say ", { term: foot }, " and the number of inches"] }
            ex: { examples: [{ mapping: ["5 ft 10", { target: five foot ten }] }, { mapping: ["6′2″", { target: six foot two }] }] }

  - title: { en: Prices and currency }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: rule, label: { en: Say } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            use: { en: Pounds and pence }
            rule: { en: ["the pounds, then the pence as a number; ", { term: p }, " stands for ", { term: pence }] }
            ex: { examples: [{ mapping: ["£3.50", { target: three pounds fifty }] }, { mapping: ["50p", ["fifty ", { target: pence }]] }] }
          - level: B2
            use: { en: Large sums }
            rule: { en: "the number, then million or billion, then the currency" }
            ex: { examples: [{ mapping: ["$1.2 million", { target: one point two million dollars }] }, { mapping: ["€5bn", { target: five billion euros }] }] }
          - level: B2
            use: { en: Billion and trillion }
            rule: { en: "a billion is a thousand million; a trillion is a thousand billion" }
            ex: { examples: [{ mapping: ["1,000,000,000", { target: a billion }] }, { mapping: ["1,000,000,000,000", { target: a trillion }] }] }

  - title: { en: Numbers before nouns }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            use: { en: Number as a modifier }
            rule: { en: ["the noun stays singular: ", { pattern: [{ slot: number }, { slot: hyphen }, { slot: singular noun }] }] }
            ex: { examples: [["a ", { target: ten-minute }, " walk"], ["a ", { target: five-year-old }, " boy"], ["a ", { target: two-bedroom }, " flat ", { variant: apartment, variety: en-US }]] }
          - level: B2
            use: { en: After the noun }
            rule: { en: "the unit is plural again" }
            ex: ["The walk takes ten ", { target: minutes }, "."]
          - level: B2
            use: { en: Amounts with a verb }
            rule: { en: "an amount or a period is one thing, so the verb is singular" }
            ex: { examples: [["Ten pounds ", { target: is }, " a lot."], ["Three weeks ", { target: is }, " a long time."]] }

  - title: { en: "Powers, ratios and statistics" }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: rule, label: { en: Say } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: C1
            point: { en: Powers }
            rule: { en: [{ term: to the power of }, " from the fourth power on; ", { term: times }, " links a number to a power of ten"] }
