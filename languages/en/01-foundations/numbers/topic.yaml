              de: ["13–19 erhalten ", { term: "-teen" }, "; bei 13, 15 und 18 ändert sich der erste Teil: ", { letter: "thir" }, "teen, ", { letter: "fif" }, "teen, ", { letter: "eigh" }, "teen."]
              it: ["I numeri da 13 a 19 aggiungono ", { term: "-teen" }, "; in 13, 15 e 18 cambia la prima parte: ", { letter: "thir" }, "teen, ", { letter: "fif" }, "teen, ", { letter: "eigh" }, "teen."]
