          - { level: A0, value: 6, number: "6", word: six, ipa: { ipa: sɪks } }
          - { level: A0, value: 7, number: "7", word: seven, ipa: { ipa: ˈsevn } }
          - { level: A0, value: 8, number: "8", word: eight, ipa: { ipa: eɪt } }
          - { level: A0, value: 9, number: "9", word: nine, ipa: { ipa: naɪn } }
          - { level: A0, value: 10, number: "10", word: ten, ipa: { ipa: ten } }
          - { level: A0, value: 11, number: "11", word: eleven, ipa: { ipa: ɪˈlevn } }
          - { level: A0, value: 12, number: "12", word: twelve, ipa: { ipa: twelv } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["In phone numbers, say each digit. 0 is ", { term: oh }, " ", { ipa: əʊ }, "; two equal digits are ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]
              uk: ["У телефонних номерах кожну цифру називають окремо. 0 читається ", { term: oh }, " ", { ipa: əʊ }, "; дві однакові цифри — ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]
              es: ["En los números de teléfono se dice cada dígito. El 0 es ", { term: oh }, " ", { ipa: əʊ }, "; dos dígitos iguales se dicen ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]
              pt: ["Em números de telefone, diz-se cada dígito. O 0 é ", { term: "oh" }, " ", { ipa: "əʊ" }, "; dois dígitos iguais se dizem ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              fr: ["Dans les numéros de téléphone, on dit chaque chiffre. 0 se dit ", { term: "oh" }, " ", { ipa: "əʊ" }, " ; deux chiffres identiques se disent ", { term: "double" }, " : ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              de: ["In Telefonnummern wird jede Ziffer einzeln gesagt. 0 ist ", { term: "oh" }, " ", { ipa: "əʊ" }, "; zwei gleiche Ziffern heißen ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              it: ["Nei numeri di telefono si dice ogni cifra. Lo 0 è ", { term: "oh" }, " ", { ipa: "əʊ" }, "; due cifre uguali si dicono ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              pl: ["W numerach telefonów każdą cyfrę czyta się osobno. 0 to ", { term: "oh" }, " ", { ipa: "əʊ" }, "; dwie takie same cyfry to ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              tr: ["Telefon numaralarında her rakam ayrı söylenir. 0 ", { term: "oh" }, " ", { ipa: "əʊ" }, " olarak okunur; iki aynı rakam ", { term: "double" }, " ile söylenir: ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              id: ["Pada nomor telepon, setiap digit diucapkan satu per satu. 0 dibaca ", { term: "oh" }, " ", { ipa: "əʊ" }, "; dua digit yang sama dibaca ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]
              vi: ["Trong số điện thoại, đọc từng chữ số. Số 0 đọc là ", { term: "oh" }, " ", { ipa: "əʊ" }, "; hai chữ số giống nhau đọc là ", { term: "double" }, ": ", { mapping: ["077", { numeral: "oh double seven", value: "077" }] }, "."]

