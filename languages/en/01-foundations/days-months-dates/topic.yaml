          - { level: A0, wrong: ["the five of ", { date: May, value: "--05" }], right: { date: ["the ", { target: fifth }, " of ", May], value: "--05-05" }, rule: { en: days are ordinals, uk: "день називають порядковим числівником", es: "el día se dice con un ordinal", pt: "o dia se diz com um ordinal", fr: "le jour se dit avec un ordinal", de: "der Tag wird mit einer Ordnungszahl gesprochen", it: "il giorno si dice con un ordinale", pl: "dzień podaje się liczebnikiem porządkowym", tr: "gün sıra sayısıyla söylenir", id: "tanggal memakai ordinal", vi: "ngày đọc bằng số thứ tự" } }
          - { level: B2, wrong: "the 1990's", right: ["the ", { target: 1990s }], rule: { en: "a decade takes s with no apostrophe" } }
          - { level: B2, wrong: "2026 AD", right: { target: AD 2026 }, rule: { en: [{ term: AD }, " goes before the year"] } }
