          - { level: A0, speakers: [uk], wrong: I was born in one thousand nine hundred ninety-nine., right: ["I was born in ", { target: nineteen ninety-nine }, "."], rule: { uk: ["рік читають двома парами цифр: ", { term: nineteen ninety-nine }, ", а не повним числом"] } }
          - { level: A0, speakers: [es], wrong: I work on monday., right: ["I work on ", { target: { weekday: Monday, value: 1 } }, "."], rule: { es: ["los días y los meses van con mayúscula: ", { term: Monday }, "; en español, con minúscula («lunes»)"] } }
          - { level: A0, speakers: [es], wrong: I was born in one thousand nine hundred and ninety-nine., right: ["I was born in ", { target: nineteen ninety-nine }, "."], rule: { es: ["el año se lee en dos pares de dígitos: ", { term: nineteen ninety-nine }, ", no como un número completo"] } }
