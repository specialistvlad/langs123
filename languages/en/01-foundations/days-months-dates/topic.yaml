              vi: ["Số thế kỷ hơn các chữ số đầu của năm một đơn vị: ", { term: "1800s" }, " là ", { term: "nineteenth century" }, "."]
          - type: rule
            level: B2
            text:
              en: ["The phrase ", { term: the turn of the century }, " means the years around a change of century, usually 1900 or 2000."]
              uk: ["Вираз ", { term: "the turn of the century" }, " означає роки навколо зміни століття, зазвичай 1900 або 2000."]
              es: ["La expresión ", { term: "the turn of the century" }, " significa los años en torno al cambio de siglo, por lo general 1900 o 2000."]
