title: { en: "Days, Months and Dates", uk: "Дні, місяці та дати", es: "Días, meses y fechas", pt: "Dias, meses e datas", fr: "Jours, mois et dates", de: "Tage, Monate und Datumsangaben", it: "Giorni, mesi e date", pl: "Dni, miesiące i daty", tr: "Günler, aylar ve tarihler", id: "Hari, bulan, dan tanggal", vi: "Thứ, tháng và ngày" }
summary:
  lead:
    en: "The days of the week, the months, and how to say and write dates and years."
    uk: "Дні тижня, місяці та те, як називати й записувати дати й роки."
    es: "Los días de la semana, los meses y cómo decir y escribir fechas y años."
    pt: "Os dias da semana, os meses e como dizer e escrever datas e anos."
    fr: "Les jours de la semaine, les mois, et comment dire et écrire les dates et les années."
    de: "Die Wochentage, die Monate und wie man Datum und Jahreszahlen sagt und schreibt."
    it: "I giorni della settimana, i mesi e come dire e scrivere date e anni."
    pl: "Dni tygodnia, miesiące oraz sposób mówienia i zapisywania dat i lat."
    tr: "Haftanın günleri, aylar ve tarihlerin ve yılların nasıl söylenip yazıldığı."
    id: "Hari dalam seminggu, bulan, serta cara mengucapkan dan menulis tanggal dan tahun."
    vi: "Các thứ trong tuần, các tháng, cùng cách đọc và cách viết ngày tháng và năm."
  rule:
    en: "Days and months always start with a capital letter, and dates are said with ordinals:"
    uk: "В англійській назви днів і місяців завжди починаються з великої літери, а дати називають порядковими числівниками:"
    es: "En inglés, los días y los meses siempre empiezan con mayúscula, y las fechas se dicen con ordinales:"
    pt: "Em inglês, os dias e os meses sempre começam com letra maiúscula, e as datas são ditas com ordinais:"
    fr: "En anglais, les jours et les mois commencent toujours par une majuscule, et les dates se disent avec des ordinaux :"
    de: "Tage und Monate beginnen im Englischen immer mit einem Großbuchstaben, und Datumsangaben werden mit Ordnungszahlen gesprochen:"
    it: "In inglese i giorni e i mesi iniziano sempre con la maiuscola, e le date si dicono con i numeri ordinali:"
    pl: "W angielskim nazwy dni i miesięcy zawsze pisze się wielką literą, a daty podaje się liczebnikami porządkowymi:"
    tr: "İngilizcede gün ve ay adları her zaman büyük harfle başlar; tarihler sıra sayılarıyla söylenir:"
    id: "Dalam bahasa Inggris, nama hari dan bulan selalu diawali huruf kapital, dan tanggal diucapkan dengan ordinal:"
    vi: "Thứ và tháng luôn bắt đầu bằng chữ hoa, còn ngày tháng đọc bằng số thứ tự:"
  ex: { examples: [["on ", { target: { weekday: Monday, value: 1 } }], [{ date: ["the ", { target: third }, " of ", { target: July }], value: "--07-03" }, "."]] }

