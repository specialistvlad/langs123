            tr: { uk: "Сьогодні десяте жовтня.", es: "Hoy es diez de octubre.", pt: "Hoje é dia dez de outubro.", fr: "Nous sommes le dix octobre.", de: "Heute ist der zehnte Oktober.", it: "Oggi è il dieci ottobre.", pl: "Dzisiaj jest dziesiąty października.", tr: "Bugün 10 Ekim.", id: "Hari ini tanggal sepuluh Oktober.", vi: "Hôm nay là ngày 10 tháng 10." }

  - title: { en: Years, uk: "Роки", es: "Años", pt: "Anos", fr: "Années", de: "Jahre", it: "Anni", pl: "Lata", tr: "Yıllar", id: "Tahun", vi: "Năm" }
    role: own
    content:
      - type: inventory
        set: years
        columns:
          - { key: year, label: { en: Year, uk: "Рік", es: "Año", pt: "Ano", fr: "Année", de: "Jahr", it: "Anno", pl: "Rok", tr: "Yıl", id: "Tahun", vi: "Năm" } }
          - { key: said, label: { en: Said, uk: "Як читається", es: "Cómo se dice", pt: "Como se diz", fr: "À l’oral", de: "Gesprochen", it: "Come si dice", pl: "Jak się mówi", tr: "Okunuşu", id: "Cara mengucapkan", vi: "Cách đọc" } }
        rows:
          - { level: A0, value: "1999", year: "1999", said: [{ target: nineteen }, " ninety-nine"] }
          - { level: A0, value: "1900", year: "1900", said: ["nineteen ", { target: hundred }] }
          - { level: A0, value: "1905", year: "1905", said: ["nineteen ", { target: oh }, " five"] }
          - { level: A0, value: "2000", year: "2000", said: two thousand }
          - { level: A0, value: "2008", year: "2008", said: ["two thousand ", { target: and }, " eight"] }
          - { level: A0, value: "2026", year: "2026", said: { alternatives: [[{ target: twenty }, " twenty-six"], two thousand and twenty-six] } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Say most years in two pairs of digits: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: nineteen ninety-nine }] }, "."]
              uk: ["Більшість років читають двома парами цифр: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: nineteen ninety-nine }] }, "."]
              es: ["La mayoría de los años se dicen en dos pares de dígitos: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: nineteen ninety-nine }] }, "."]
              pt: ["A maioria dos anos se diz em dois pares de dígitos: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              fr: ["La plupart des années se disent en deux paires de chiffres : ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              de: ["Die meisten Jahreszahlen werden in zwei Ziffernpaaren gesprochen: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              it: ["La maggior parte degli anni si dice con due coppie di cifre: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              pl: ["Większość lat czyta się w dwóch parach cyfr: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              tr: ["Çoğu yıl iki rakam çiftiyle okunur: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              id: ["Kebanyakan tahun dibaca dalam dua pasang angka: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
              vi: ["Hầu hết các năm đọc thành hai cặp chữ số: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, { term: "nineteen ninety-nine" }] }, "."]
          - type: rule
            level: A0
            text:
              en: ["Say 00 as ", { term: hundred }, " and 01 to 09 with ", { term: oh }, ": ", { term: nineteen hundred }, ", ", { term: nineteen oh five }, "."]
              uk: ["00 читається як ", { term: hundred }, ", а 01–09 — з ", { term: oh }, ": ", { term: nineteen hundred }, ", ", { term: nineteen oh five }, "."]
              es: ["El 00 se dice ", { term: hundred }, " y del 01 al 09 se usa ", { term: oh }, ": ", { term: nineteen hundred }, ", ", { term: nineteen oh five }, "."]
              pt: ["O 00 se diz ", { term: "hundred" }, " e de 01 a 09 usa-se ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              fr: ["00 se dit ", { term: "hundred" }, " et 01 à 09 prennent ", { term: "oh" }, " : ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              de: ["00 wird als ", { term: "hundred" }, " gesprochen, 01 bis 09 mit ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              it: ["Lo 00 si dice ", { term: "hundred" }, " e da 01 a 09 si usa ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              pl: ["00 czyta się jako ", { term: "hundred" }, ", a 01–09 z ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              tr: ["00 ", { term: "hundred" }, " diye, 01–09 arası ", { term: "oh" }, " ile okunur: ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              id: ["00 dibaca ", { term: "hundred" }, " dan 01 sampai 09 memakai ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
              vi: ["00 đọc là ", { term: "hundred" }, ", còn 01–09 có ", { term: "oh" }, ": ", { term: "nineteen hundred" }, ", ", { term: "nineteen oh five" }, "."]
          - type: rule
            level: A0
            text:
              en: ["2000–2009: ", { term: two thousand }, " ", { pattern: [{ optional: and }, { slot: unit }] }, ". From 2010, both forms are common."]
              uk: ["2000–2009: ", { term: two thousand }, " ", { pattern: [{ optional: and }, { slot: unit }] }, ". З 2010 року поширені обидві форми."]
              es: ["2000–2009: ", { term: two thousand }, " ", { pattern: [{ optional: and }, { slot: unit }] }, ". Desde 2010 son comunes las dos formas."]
              pt: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". A partir de 2010, as duas formas são comuns."]
              fr: ["2000–2009 : ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". À partir de 2010, les deux formes sont courantes."]
              de: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". Ab 2010 sind beide Formen üblich."]
              it: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". Dal 2010 sono comuni entrambe le forme."]
              pl: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". Od 2010 roku używane są obie formy."]
              tr: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". 2010’dan itibaren iki biçim de yaygındır."]
              id: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". Mulai 2010 kedua bentuk sama-sama umum."]
              vi: ["2000–2009: ", { term: "two thousand" }, " ", { pattern: [{ optional: "and" }, { slot: "unit" }] }, ". Từ 2010, cả hai dạng đều phổ biến."]

  - title: { en: Decades and centuries }
    role: own
    content:
      - type: inventory
        set: years
        columns:
          - { key: written, label: { en: Written } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: B2, value: "1960", written: "the 1960s", said: ["the ", { target: sixties }] }
          - { level: B2, value: "1990", written: "the 1990s", said: ["the ", { target: nineties }] }
          - { level: B2, value: "1990", written: "the early 1990s", said: ["the ", { target: early }, " nineties"] }
          - { level: B2, value: "1995", written: "the mid-1990s", said: ["the ", { target: mid-nineties }] }
          - { level: B2, value: "1997", written: "the late 1990s", said: ["the ", { target: late }, " nineties"] }
          - { level: B2, value: "2000", written: "the 2000s", said: { alternatives: [["the ", { target: noughties }], ["the ", { target: two thousands }]] } }
          - { level: B2, value: "1800", written: "the 1800s", said: ["the ", { target: eighteen hundreds }] }
          - { level: B2, value: "2001", written: "the 21st century", said: ["the ", { ordinal: twenty-first, value: 21 }, " century"] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: ["A century is one number ahead of its years: the ", { term: 1800s }, " are the ", { term: nineteenth century }, "."]
          - type: rule
            level: B2
            text:
              en: ["The phrase ", { term: the turn of the century }, " means the years around a change of century, usually 1900 or 2000."]

  - title: { en: Eras }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            use: { alternatives: ["AD", "BC"] }
            rule: { en: [{ term: AD }, " goes before the year and ", { term: BC }, " after it"] }
            ex: { examples: [{ target: "AD 2026" }, { target: "44 BC" }] }
          - level: B2
            use: { alternatives: ["CE", "BCE"] }
            rule: { en: [{ term: CE }, " and ", { term: BCE }, " go after the year; they are the neutral names for AD and BC"] }
            ex: { examples: [{ target: "2026 CE" }, { target: "44 BCE" }] }

  - title: { en: Date formats in writing }
    role: own
    content:
      - type: prose
        level: B2
        text:
          en: "Each row writes the same date, 3 July 2026."
      - type: comparison
        columns:
          - { key: format, label: { en: Format } }
          - { key: written, label: { en: Written } }
        rows:
          - level: B2
            format: { en: "Day, month, year" }
            written: ["3 July 2026 ", { variant: "July 3, 2026", variety: en-US }]
          - level: B2
            format: { en: With an ordinal }
            written: ["3rd July 2026 ", { variant: "July 3rd, 2026", variety: en-US }]
          - level: B2
            format: { en: Numbers only }
            written: ["03/07/2026 ", { variant: "07/03/2026", variety: en-US }]
          - level: B2
            format: { en: ISO 8601 }
            written: "2026-07-03"
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: "ISO dates run year, month, day and read the same in every country."

  - title: { en: Date ranges and periods }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            use: { en: Date range }
            rule: { en: "an en dash, or from and to" }
            ex: { examples: [{ target: "3–5 July" }, { target: "from the 3rd to the 5th" }] }
          - level: B2
            use: { en: Days ahead }
            rule: { en: [{ term: after next }, " skips the coming one"] }
            ex: ["The meeting is on the Monday ", { target: after next }, "."]
          - level: B2
            use: { en: Every second one }
            rule: { en: [{ term: every other }, " means every second one"] }
            ex: ["The class meets ", { target: every other }, " Tuesday."]
          - level: B2
            use: { en: Two weeks }
            rule: { en: [{ term: fortnight }, " is two weeks"] }
            ex: ["We leave in a ", { target: fortnight }, " ", { variant: two weeks, variety: en-US }, "."]
          - level: B2
            use: { en: Quarters and halves }
            rule: { en: [{ term: Q1 }, " to ", { term: Q4 }, " are quarters of three months; ", { term: H1 }, " and ", { term: H2 }, " are halves of six"] }
            ex: { examples: [{ mapping: ["Q3", { target: the third quarter }] }, { mapping: ["H1", { target: the first half }] }] }
          - level: B2
            use: { en: Terms }
            rule: { en: [{ term: term }, " names a school period: autumn, spring or summer"] }
            ex: ["the ", { target: autumn term }, " ", { variant: fall semester, variety: en-US }]
          - level: B2
            use: { en: Financial year }
            rule: { en: "it can start in any month; UK public bodies start in April" }
            ex: ["the ", { target: 2025–26 financial year }, " ", { variant: fiscal year, variety: en-US }]
  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
