              de: ["Der Ausdruck ", { term: "the turn of the century" }, " meint die Jahre um einen Jahrhundertwechsel, meist 1900 oder 2000."]
              it: ["L'espressione ", { term: "the turn of the century" }, " indica gli anni intorno al cambio di secolo, di solito il 1900 o il 2000."]
              pl: ["Wyrażenie ", { term: "the turn of the century" }, " oznacza lata wokół przełomu wieków, zwykle 1900 lub 2000."]
              tr: [{ term: "the turn of the century" }, " ifadesi yüzyıl dönümünün çevresindeki yılları, genellikle 1900 ya da 2000’i anlatır."]
