        - { level: B2, point: { en: Sentence stress, uk: "Наголос у реченні", es: "Acento de la oración", pt: "Acento da frase", fr: "Accent de phrase", de: "Satzbetonung", it: "Accento di frase", pl: "Akcent zdaniowy", tr: "Cümle vurgusu", id: "Tekanan kalimat", vi: "Trọng âm câu" }, rule: { en: "content words carry the stress; function words stay weak", uk: "повнозначні слова несуть наголос, службові залишаються слабкими", es: "las palabras de contenido llevan el acento; las funcionales se quedan débiles", pt: "as palavras de conteúdo recebem o acento; as funcionais ficam fracas", fr: "les mots lexicaux portent l’accent ; les mots grammaticaux restent faibles", de: "Inhaltswörter tragen die Betonung, Funktionswörter bleiben schwach", it: "le parole piene portano l'accento; le parole funzionali restano deboli", pl: "wyrazy znaczeniowe niosą akcent, wyrazy funkcyjne pozostają słabe", tr: "içerik sözcükleri vurgu taşır, işlev sözcükleri zayıf kalır", id: "kata isi menerima tekanan; kata fungsi tetap lemah", vi: "từ nội dung mang trọng âm; từ chức năng vẫn đọc yếu" }, ex: ["We ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."], tr: { uk: "Ми хочемо піти в парк.", es: "Queremos ir al parque.", pt: "Queremos ir ao parque.", fr: "Nous voulons aller au parc.", de: "Wir wollen in den Park gehen.", it: "Vogliamo andare al parco.", pl: "Chcemy iść do parku.", tr: "Parka gitmek istiyoruz.", id: "Kami ingin pergi ke taman.", vi: "Chúng tôi muốn đi đến công viên." } }
