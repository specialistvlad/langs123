        rows:
          - { level: B2, ex: [{ stress: I }, " didn't say he stole her money."], meaning: { en: "Someone else said it.", uk: "Це сказав хтось інший.", es: "Lo dijo otra persona.", pt: "Outra pessoa disse isso.", fr: "Quelqu’un d’autre l’a dit.", de: "Jemand anderes hat es gesagt.", it: "Lo ha detto qualcun altro.", pl: "Powiedział to ktoś inny.", tr: "Bunu başka biri söyledi.", id: "Orang lain yang mengatakannya.", vi: "Người khác đã nói điều đó." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I ", { stress: "didn't" }, " say he stole her money."], meaning: { en: "I never said it.", uk: "Я ніколи цього не казав.", es: "Nunca lo dije.", pt: "Eu nunca disse isso.", fr: "Je ne l’ai jamais dit.", de: "Ich habe das nie gesagt.", it: "Non l'ho mai detto.", pl: "Nigdy tego nie powiedziałem.", tr: "Bunu hiç söylemedim.", id: "Saya tidak pernah mengatakannya.", vi: "Tôi chưa bao giờ nói điều đó." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I didn't ", { stress: say }, " he stole her money."], meaning: { en: "I only hinted at it.", uk: "Я лише натякнув на це.", es: "Solo lo insinué.", pt: "Eu só insinuei isso.", fr: "Je l’ai seulement laissé entendre.", de: "Ich habe es nur angedeutet.", it: "L'ho solo fatto capire.", pl: "Tylko to zasugerowałem.", tr: "Bunu sadece ima ettim.", id: "Saya hanya menyiratkannya.", vi: "Tôi chỉ ám chỉ điều đó." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I didn't say ", { stress: he }, " stole her money."], meaning: { en: "I said another person stole it.", uk: "Я казав, що вкрав хтось інший.", es: "Dije que lo robó otra persona.", pt: "Eu disse que outra pessoa roubou.", fr: "J’ai dit qu’une autre personne l’avait volé.", de: "Ich habe gesagt, dass eine andere Person es gestohlen hat.", it: "Ho detto che l'ha rubato un'altra persona.", pl: "Powiedziałem, że ukradł to ktoś inny.", tr: "Başka birinin çaldığını söyledim.", id: "Saya bilang orang lain yang mencurinya.", vi: "Tôi nói là một người khác đã lấy cắp." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I didn't say he ", { stress: stole }, " her money."], meaning: { en: "He took it in another way.", uk: "Він узяв це іншим способом.", es: "Lo tomó de otra manera.", pt: "Ele pegou de outra maneira.", fr: "Il l’a pris d’une autre manière.", de: "Er hat es auf andere Weise genommen.", it: "L'ha preso in un altro modo.", pl: "Zabrał to w inny sposób.", tr: "Onu başka bir yolla aldı.", id: "Dia mengambilnya dengan cara lain.", vi: "Anh ta lấy nó bằng cách khác." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I didn't say he stole ", { stress: her }, " money."], meaning: { en: "He stole someone else's money.", uk: "Він украв чужі гроші.", es: "Robó el dinero de otra persona.", pt: "Ele roubou o dinheiro de outra pessoa.", fr: "Il a volé l’argent de quelqu’un d’autre.", de: "Er hat das Geld einer anderen Person gestohlen.", it: "Ha rubato i soldi di un'altra persona.", pl: "Ukradł pieniądze kogoś innego.", tr: "Başkasının parasını çaldı.", id: "Dia mencuri uang orang lain.", vi: "Anh ta lấy cắp tiền của người khác." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
          - { level: B2, ex: ["I didn't say he stole her ", { stress: mo }, "ney."], meaning: { en: "He stole something else of hers.", uk: "Він украв щось інше з її речей.", es: "Le robó otra cosa suya.", pt: "Ele roubou outra coisa dela.", fr: "Il a volé autre chose qui lui appartenait.", de: "Er hat etwas anderes von ihr gestohlen.", it: "Ha rubato qualcos'altro di suo.", pl: "Ukradł jej coś innego.", tr: "Onun başka bir şeyini çaldı.", id: "Dia mencuri hal lain miliknya.", vi: "Anh ta lấy cắp thứ khác của cô ấy." }, tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Stress the word that differs from what the listener expects; the other words keep their normal weight.", uk: "Наголошуй слово, що відрізняється від очікуваного слухачем; решта слів зберігає звичайну вагу.", es: "Se acentúa la palabra que difiere de lo que el oyente espera; las demás palabras conservan su peso normal.", pt: "Acentue a palavra que difere do que o ouvinte espera; as outras palavras mantêm o peso normal.", fr: "On accentue le mot qui diffère de ce que l’auditeur attend ; les autres mots gardent leur poids normal.", de: "Betont wird das Wort, das von der Erwartung des Hörers abweicht; die anderen Wörter behalten ihr normales Gewicht.", it: "Si accentua la parola diversa da ciò che l'ascoltatore si aspetta; le altre parole mantengono il peso normale.", pl: "Akcentuje się wyraz, który odbiega od oczekiwań słuchacza; pozostałe wyrazy zachowują zwykłą wagę.", tr: "Dinleyicinin beklediğinden farklı olan sözcük vurgulanır; diğer sözcükler olağan ağırlığını korur.", id: "Tekankan kata yang berbeda dari yang diharapkan pendengar; kata-kata lain tetap berbobot normal.", vi: "Nhấn vào từ khác với điều người nghe chờ đợi; các từ còn lại giữ mức nhấn bình thường." } }

