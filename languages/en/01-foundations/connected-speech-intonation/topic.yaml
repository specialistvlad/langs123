          - { level: B2, elision: { en: "t and d", uk: "t і d", es: "t y d", pt: "t e d", fr: "t et d", de: "t und d", it: "t e d", pl: "t i d", tr: "t ve d", id: "t dan d", vi: "t và d" }, rule: { en: "t or d disappears between two consonants", uk: "t або d зникає між двома приголосними", es: "t o d desaparece entre dos consonantes", pt: "t ou d desaparece entre duas consoantes", fr: "t ou d disparaît entre deux consonnes", de: "t oder d verschwindet zwischen zwei Konsonanten", it: "t o d scompare tra due consonanti", pl: "t lub d znika między dwiema spółgłoskami", tr: "t veya d, iki ünsüzün arasında kaybolur", id: "t atau d hilang di antara dua konsonan", vi: "t hoặc d biến mất giữa hai phụ âm" }, ex: { examples: [["next day ", { ipa: neks deɪ }], ["old man ", { ipa: əʊl mæn }], ["last night ", { ipa: lɑːs naɪt }]] }, tr: { uk: { examples: ["наступного дня", "старий чоловік", "учора ввечері"] }, es: { examples: ["al día siguiente", "hombre mayor", "anoche"] }, pt: { examples: ["no dia seguinte", "homem velho", "ontem à noite"] }, fr: { examples: ["le lendemain", "vieil homme", "hier soir"] }, de: { examples: ["am nächsten Tag", "alter Mann", "gestern Abend"] }, it: { examples: ["il giorno dopo", "vecchio", "ieri sera"] }, pl: { examples: ["następnego dnia", "starzec", "wczoraj wieczorem"] }, tr: { examples: ["ertesi gün", "yaşlı adam", "dün gece"] }, id: { examples: ["hari berikutnya", "pria tua", "tadi malam"] }, vi: { examples: ["ngày hôm sau", "ông già", "tối qua"] } } }
          - { level: B2, elision: { en: Unstressed vowel, uk: "Ненаголошений голосний", es: "Vocal átona", pt: "Vogal átona", fr: "Voyelle inaccentuée", de: "Unbetonter Vokal", it: "Vocale atona", pl: "Samogłoska nieakcentowana", tr: "Vurgusuz ünlü", id: "Vokal tanpa tekanan", vi: "Nguyên âm không mang trọng âm" }, rule: { en: "an unstressed vowel is lost in some words", uk: "у деяких словах ненаголошений голосний випадає", es: "en algunas palabras se pierde una vocal átona", pt: "em algumas palavras, uma vogal átona se perde", fr: "dans certains mots, une voyelle inaccentuée tombe", de: "in manchen Wörtern fällt ein unbetonter Vokal weg", it: "in alcune parole una vocale atona cade", pl: "w niektórych wyrazach samogłoska nieakcentowana zanika", tr: "bazı sözcüklerde vurgusuz ünlü düşer", id: "pada beberapa kata, vokal tanpa tekanan hilang", vi: "ở một số từ, nguyên âm không mang trọng âm bị lược" }, ex: { examples: [["comfortable ", { ipa: ˈkʌmftəbl }], ["interesting ", { ipa: ˈɪntrəstɪŋ }], ["different ", { ipa: ˈdɪfrənt }]] }, tr: { uk: { examples: ["зручний", "цікавий", "різний"] }, es: { examples: ["cómodo", "interesante", "diferente"] }, pt: { examples: ["confortável", "interessante", "diferente"] }, fr: { examples: ["confortable", "intéressant", "différent"] }, de: { examples: ["bequem", "interessant", "verschieden"] }, it: { examples: ["comodo", "interessante", "diverso"] }, pl: { examples: ["wygodny", "interesujący", "inny"] }, tr: { examples: ["rahat", "ilginç", "farklı"] }, id: { examples: ["nyaman", "menarik", "berbeda"] }, vi: { examples: ["thoải mái", "thú vị", "khác"] } } }

  - title: { en: Assimilation, uk: "Асиміляція", es: "Asimilación", pt: "Assimilação", fr: "Assimilation", de: "Assimilation", it: "Assimilazione", pl: "Asymilacja", tr: "Benzeşme", id: "Asimilasi", vi: "Đồng hóa âm" }
    role: own
    content:
      - type: usage
        columns:
          - { key: change, label: { en: Change, uk: "Зміна", es: "Cambio", pt: "Mudança", fr: "Changement", de: "Veränderung", it: "Cambiamento", pl: "Zmiana", tr: "Değişim", id: "Perubahan", vi: "Thay đổi" } }
          - { key: before, label: { en: Before, uk: "Перед", es: "Antes de", pt: "Antes de", fr: "Devant", de: "Vor", it: "Davanti a", pl: "Przed", tr: "Önünde", id: "Sebelum", vi: "Trước" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, change: { mapping: [{ ipa: "n" }, { ipa: m }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["ten boys ", { ipa: tem bɔɪz }], ["handbag ", { ipa: ˈhæmbæg }]] }, tr: { uk: { examples: ["десять хлопчиків", "сумочка"] }, es: { examples: ["diez chicos", "bolso de mano"] }, pt: { examples: ["dez meninos", "bolsa"] }, fr: { examples: ["dix garçons", "sac à main"] }, de: { examples: ["zehn Jungen", "Handtasche"] }, it: { examples: ["dieci ragazzi", "borsetta"] }, pl: { examples: ["dziesięciu chłopców", "torebka"] }, tr: { examples: ["on oğlan", "el çantası"] }, id: { examples: ["sepuluh anak laki-laki", "tas tangan"] }, vi: { examples: ["mười cậu bé", "túi xách"] } } }
          - { level: B2, change: { mapping: [{ ipa: d }, { ipa: b }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["good morning ", { ipa: gʊb ˈmɔːnɪŋ }], ["road map ", { ipa: rəʊb mæp }]] }, tr: { uk: { examples: ["добрий ранок", "карта доріг"] }, es: { examples: ["buenos días", "mapa de carreteras"] }, pt: { examples: ["bom dia", "mapa rodoviário"] }, fr: { examples: ["bonjour", "carte routière"] }, de: { examples: ["guten Morgen", "Straßenkarte"] }, it: { examples: ["buongiorno", "cartina stradale"] }, pl: { examples: ["dzień dobry", "mapa drogowa"] }, tr: { examples: ["günaydın", "yol haritası"] }, id: { examples: ["selamat pagi", "peta jalan"] }, vi: { examples: ["chào buổi sáng", "bản đồ đường bộ"] } } }
          - { level: B2, change: { mapping: [{ ipa: t }, { ipa: p }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["that man ", { ipa: ðæp mæn }], ["right place ", { ipa: raɪp pleɪs }]] }, tr: { uk: { examples: ["той чоловік", "потрібне місце"] }, es: { examples: ["ese hombre", "el lugar correcto"] }, pt: { examples: ["aquele homem", "lugar certo"] }, fr: { examples: ["cet homme", "le bon endroit"] }, de: { examples: ["dieser Mann", "der richtige Ort"] }, it: { examples: ["quell'uomo", "posto giusto"] }, pl: { examples: ["tamten mężczyzna", "właściwe miejsce"] }, tr: { examples: ["o adam", "doğru yer"] }, id: { examples: ["pria itu", "tempat yang tepat"] }, vi: { examples: ["người đàn ông đó", "đúng chỗ"] } } }
          - { level: B2, change: { mapping: [{ ipa: "n" }, { ipa: ŋ }] }, before: { alternatives: [{ ipa: k }, { ipa: g }] }, ex: { examples: [["ten girls ", { ipa: teŋ gɜːlz }], ["in case ", { ipa: ɪŋ keɪs }]] }, tr: { uk: { examples: ["десять дівчат", "на випадок"] }, es: { examples: ["diez chicas", "en caso de que"] }, pt: { examples: ["dez meninas", "caso"] }, fr: { examples: ["dix filles", "au cas où"] }, de: { examples: ["zehn Mädchen", "falls"] }, it: { examples: ["dieci ragazze", "nel caso"] }, pl: { examples: ["dziesięć dziewczyn", "na wypadek"] }, tr: { examples: ["on kız", "ihtimale karşı"] }, id: { examples: ["sepuluh anak perempuan", "kalau-kalau"] }, vi: { examples: ["mười cô gái", "phòng khi"] } } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "The last sound of a word changes to match the first sound of the next word.", uk: "Останній звук слова змінюється так, щоб відповідати першому звуку наступного слова.", es: "El último sonido de una palabra cambia para parecerse al primer sonido de la palabra siguiente.", pt: "O último som de uma palavra muda para combinar com o primeiro som da palavra seguinte.", fr: "Le dernier son d’un mot change pour s’accorder au premier son du mot suivant.", de: "Der letzte Laut eines Wortes verändert sich und passt sich dem ersten Laut des nächsten Wortes an.", it: "L'ultimo suono di una parola cambia per adattarsi al primo suono della parola seguente.", pl: "Ostatni dźwięk wyrazu zmienia się i upodabnia do pierwszego dźwięku następnego wyrazu.", tr: "Bir sözcüğün son sesi, sonraki sözcüğün ilk sesine uyacak biçimde değişir.", id: "Bunyi terakhir sebuah kata berubah agar sesuai dengan bunyi pertama kata berikutnya.", vi: "Âm cuối của một từ đổi để hợp với âm đầu của từ đứng sau." } }

  - title: { en: "Intonation: the main tunes", uk: "Інтонація: основні тони", es: "Entonación: los tonos principales", pt: "Entonação: os tons principais", fr: "Intonation : les mélodies principales", de: "Intonation: die wichtigsten Tonverläufe", it: "Intonazione: i toni principali", pl: "Intonacja: główne melodie", tr: "Tonlama: temel tonlar", id: "Intonasi: nada utama", vi: "Ngữ điệu: các kiểu chính" }
    role: own
    content:
      - type: usage
        columns:
          - { key: tune, label: { en: Tune, uk: "Тон", es: "Tono", pt: "Tom", fr: "Mélodie", de: "Tonverlauf", it: "Tono", pl: "Melodia", tr: "Ton", id: "Nada", vi: "Kiểu ngữ điệu" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, tune: { en: ["Fall ", { intonation: fall }], uk: ["Спадний ", { intonation: "fall" }], es: ["Descendente ", { intonation: "fall" }], pt: ["Descendente ", { intonation: "fall" }], fr: ["Descendante ", { intonation: "fall" }], de: ["Fallend ", { intonation: "fall" }], it: ["Discendente ", { intonation: "fall" }], pl: ["Opadający ", { intonation: "fall" }], tr: ["İnen ", { intonation: "fall" }], id: ["Turun ", { intonation: "fall" }], vi: ["Xuống giọng ", { intonation: "fall" }] }, use: { en: "statements, wh-questions and commands", uk: "розповіді, wh-питання й накази", es: "afirmaciones, preguntas con wh- y órdenes", pt: "afirmações, perguntas com wh- e ordens", fr: "affirmations, questions en wh- et ordres", de: "Aussagen, wh-Fragen und Befehle", it: "affermazioni, domande con wh- e comandi", pl: "zdania oznajmujące, pytania z wh- i rozkazy", tr: "bildirme cümleleri, wh- soruları ve emirler", id: "pernyataan, pertanyaan wh-, dan perintah", vi: "câu khẳng định, câu hỏi Wh- và câu mệnh lệnh" }, ex: { examples: [["I live in ", { stress: Leeds }, ". ", { intonation: fall }], ["Where do you ", { stress: live }, "? ", { intonation: fall }]] }, tr: { uk: { examples: ["Я живу в Лідсі.", "Де ти живеш?"] }, es: { examples: ["Vivo en Leeds.", "¿Dónde vives?"] }, pt: { examples: ["Eu moro em Leeds.", "Onde você mora?"] }, fr: { examples: ["J’habite à Leeds.", "Où habites-tu ?"] }, de: { examples: ["Ich wohne in Leeds.", "Wo wohnst du?"] }, it: { examples: ["Vivo a Leeds.", "Dove vivi?"] }, pl: { examples: ["Mieszkam w Leeds.", "Gdzie mieszkasz?"] }, tr: { examples: ["Leeds’te yaşıyorum.", "Nerede yaşıyorsun?"] }, id: { examples: ["Saya tinggal di Leeds.", "Di mana kamu tinggal?"] }, vi: { examples: ["Tôi sống ở Leeds.", "Bạn sống ở đâu?"] } } }
          - { level: B2, tune: { en: ["Rise ", { intonation: rise }], uk: ["Висхідний ", { intonation: "rise" }], es: ["Ascendente ", { intonation: "rise" }], pt: ["Ascendente ", { intonation: "rise" }], fr: ["Montante ", { intonation: "rise" }], de: ["Steigend ", { intonation: "rise" }], it: ["Ascendente ", { intonation: "rise" }], pl: ["Wznoszący ", { intonation: "rise" }], tr: ["Çıkan ", { intonation: "rise" }], id: ["Naik ", { intonation: "rise" }], vi: ["Lên giọng ", { intonation: "rise" }] }, use: { en: "yes-no questions", uk: "загальні питання", es: "preguntas de sí o no", pt: "perguntas de sim ou não", fr: "questions fermées", de: "Entscheidungsfragen", it: "domande sì o no", pl: "pytania ogólne", tr: "evet/hayır soruları", id: "pertanyaan ya atau tidak", vi: "câu hỏi có/không" }, ex: ["Do you live in ", { stress: Leeds }, "? ", { intonation: rise }], tr: { uk: "Ти живеш у Лідсі?", es: "¿Vives en Leeds?", pt: "Você mora em Leeds?", fr: "Habites-tu à Leeds ?", de: "Wohnst du in Leeds?", it: "Vivi a Leeds?", pl: "Czy mieszkasz w Leeds?", tr: "Leeds’te mi yaşıyorsun?", id: "Apakah kamu tinggal di Leeds?", vi: "Bạn sống ở Leeds à?" } }
          - { level: B2, tune: { en: ["Fall-rise ", { intonation: fall }, { intonation: rise }], uk: ["Спадно-висхідний ", { intonation: "fall" }, { intonation: "rise" }], es: ["Descendente-ascendente ", { intonation: "fall" }, { intonation: "rise" }], pt: ["Descendente-ascendente ", { intonation: "fall" }, { intonation: "rise" }], fr: ["Descendante-montante ", { intonation: "fall" }, { intonation: "rise" }], de: ["Fallend-steigend ", { intonation: "fall" }, { intonation: "rise" }], it: ["Discendente-ascendente ", { intonation: "fall" }, { intonation: "rise" }], pl: ["Opadająco-wznoszący ", { intonation: "fall" }, { intonation: "rise" }], tr: ["İnen-çıkan ", { intonation: "fall" }, { intonation: "rise" }], id: ["Turun-naik ", { intonation: "fall" }, { intonation: "rise" }], vi: ["Xuống rồi lên ", { intonation: "fall" }, { intonation: "rise" }] }, use: { en: "reservation, with something left unsaid", uk: "застереження, коли щось залишається несказаним", es: "reserva, con algo sin decir", pt: "ressalva, com algo não dito", fr: "réserve, avec une pensée laissée en suspens", de: "Vorbehalt, mit etwas Unausgesprochenem", it: "riserva, con qualcosa di non detto", pl: "zastrzeżenie, z czymś niedopowiedzianym", tr: "çekince, söylenmemiş bir şeyle", id: "keberatan, dengan sesuatu yang tidak dikatakan", vi: "sự dè dặt, còn điều chưa nói ra" }, ex: ["The room was ", { stress: clean }, ". ", { intonation: fall }, { intonation: rise }], tr: { uk: "Кімната була чистою.", es: "La habitación estaba limpia.", pt: "O quarto estava limpo.", fr: "La chambre était propre.", de: "Das Zimmer war sauber.", it: "La camera era pulita.", pl: "Pokój był czysty.", tr: "Oda temizdi.", id: "Kamarnya bersih.", vi: "Căn phòng sạch sẽ." } }
          - { level: B2, tune: { en: "Rise-rise-fall", uk: "Висхідно-висхідно-спадний", es: "Ascendente-ascendente-descendente", pt: "Ascendente-ascendente-descendente", fr: "Montante-montante-descendante", de: "Steigend-steigend-fallend", it: "Ascendente-ascendente-discendente", pl: "Wznosząco-wznosząco-opadający", tr: "Çıkan-çıkan-inen", id: "Naik-naik-turun", vi: "Lên-lên-xuống" }, use: { en: lists, uk: "перелік", es: "enumeraciones", pt: "enumerações", fr: "énumérations", de: "Aufzählungen", it: "elenchi", pl: "wyliczenia", tr: "sıralamalar", id: "daftar", vi: "liệt kê" }, ex: ["We need ", { stress: eggs }, ", ", { intonation: rise }, " ", { stress: milk }, ", ", { intonation: rise }, " and ", { stress: bread }, ". ", { intonation: fall }], tr: { uk: "Нам потрібні яйця, молоко і хліб.", es: "Necesitamos huevos, leche y pan.", pt: "Precisamos de ovos, leite e pão.", fr: "Il nous faut des œufs, du lait et du pain.", de: "Wir brauchen Eier, Milch und Brot.", it: "Ci servono uova, latte e pane.", pl: "Potrzebujemy jajek, mleka i chleba.", tr: "Yumurta, süt ve ekmeğe ihtiyacımız var.", id: "Kami butuh telur, susu, dan roti.", vi: "Chúng tôi cần trứng, sữa và bánh mì." } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "A tone unit is a stretch of speech with one tune; short pauses separate tone units.", uk: "Інтонаційна група — відрізок мовлення з одним тоном; короткі паузи розділяють інтонаційні групи.", es: "Un grupo tonal es un tramo de habla con un solo tono; pausas breves separan los grupos tonales.", pt: "Um grupo tonal é um trecho de fala com um só tom; pausas curtas separam os grupos tonais.", fr: "Un groupe intonatif est un segment de parole avec une seule mélodie ; de courtes pauses séparent les groupes intonatifs.", de: "Eine Intonationsphrase ist ein Redeabschnitt mit einem Tonverlauf; kurze Pausen trennen die Intonationsphrasen.", it: "Un'unità tonale è un tratto di parlato con un solo tono; brevi pause separano le unità tonali.", pl: "Grupa intonacyjna to odcinek mowy z jedną melodią; krótkie pauzy oddzielają grupy intonacyjne.", tr: "Ton birimi, tek bir tonla söylenen konuşma parçasıdır; kısa duraklar ton birimlerini ayırır.", id: "Satuan nada adalah bagian ujaran dengan satu nada; jeda singkat memisahkan satuan nada.", vi: "Nhóm ngữ điệu là một đoạn lời nói có một kiểu ngữ điệu; những quãng ngắt ngắn ngăn cách các nhóm ngữ điệu." } }
          - { type: rule, level: B2, text: { en: "The nucleus is the main stressed syllable of a tone unit, usually on its last content word.", uk: "Ядро — головний наголошений склад інтонаційної групи, зазвичай у її останньому повнозначному слові.", es: "El núcleo es la sílaba acentuada principal de un grupo tonal, normalmente en su última palabra de contenido.", pt: "O núcleo é a sílaba tônica principal de um grupo tonal, em geral na sua última palavra de conteúdo.", fr: "Le noyau est la syllabe accentuée principale d’un groupe intonatif, le plus souvent dans son dernier mot lexical.", de: "Der Kern ist die Hauptbetonungssilbe einer Intonationsphrase, meist im letzten Inhaltswort.", it: "Il nucleo è la sillaba accentata principale di un'unità tonale, di solito nella sua ultima parola piena.", pl: "Jądro to główna sylaba akcentowana grupy intonacyjnej, zwykle w jej ostatnim wyrazie znaczeniowym.", tr: "Çekirdek, bir ton biriminin ana vurgulu hecesidir; genellikle son içerik sözcüğünde bulunur.", id: "Inti adalah suku kata bertekanan utama dalam satuan nada, biasanya pada kata isi terakhirnya.", vi: "Hạt nhân là âm tiết mang trọng âm chính của một nhóm ngữ điệu, thường nằm ở từ nội dung cuối cùng." }, ex: ["I have lost my ", { stress: keys }, "."], tr: { uk: "Я загубив свої ключі.", es: "He perdido mis llaves.", pt: "Eu perdi minhas chaves.", fr: "J’ai perdu mes clés.", de: "Ich habe meine Schlüssel verloren.", it: "Ho perso le mie chiavi.", pl: "Zgubiłem klucze.", tr: "Anahtarlarımı kaybettim.", id: "Saya kehilangan kunci saya.", vi: "Tôi đã làm mất chìa khóa." } }
          - { type: note, level: B2, text: { en: ["For the tunes of questions and tags, see ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, " and ", { link: Question Tags, to: en.sentence-building.question-tags }, "."], uk: ["Про інтонацію питань і розділових питань див. ", { link: "Питання та заперечення", to: en.sentence-building.questions-negatives }, " та ", { link: "Розділові питання", to: en.sentence-building.question-tags }, "."], es: ["Para el tono de las preguntas y de las coletillas, véanse ", { link: "Preguntas y negaciones", to: en.sentence-building.questions-negatives }, " y ", { link: "Preguntas coletilla", to: en.sentence-building.question-tags }, "."], pt: ["Para os tons das perguntas e das question tags, veja ", { link: "Perguntas e negações", to: en.sentence-building.questions-negatives }, " e ", { link: "Question tags", to: en.sentence-building.question-tags }, "."], fr: ["Pour les mélodies des questions et des question tags, voir ", { link: "Questions et négations", to: en.sentence-building.questions-negatives }, " et ", { link: "Question tags", to: en.sentence-building.question-tags }, "."], de: ["Zu den Tonverläufen von Fragen und Question Tags siehe ", { link: "Fragen und Verneinung", to: en.sentence-building.questions-negatives }, " und ", { link: "Question Tags", to: en.sentence-building.question-tags }, "."], it: ["Per i toni delle domande e dei question tag, vedi ", { link: "Domande e negazioni", to: en.sentence-building.questions-negatives }, " e ", { link: "Question tag", to: en.sentence-building.question-tags }, "."], pl: ["O melodii pytań i pytań rozłącznych zob. ", { link: "Pytania i przeczenia", to: en.sentence-building.questions-negatives }, " i ", { link: "Pytania rozłączne", to: en.sentence-building.question-tags }, "."], tr: ["Soruların ve question tags kalıplarının tonları için ", { link: "Sorular ve olumsuz cümleler", to: en.sentence-building.questions-negatives }, " ve ", { link: "Question tags", to: en.sentence-building.question-tags }, " konularına bakın."], id: ["Untuk nada pertanyaan dan question tag, lihat ", { link: "Pertanyaan dan kalimat negatif", to: en.sentence-building.questions-negatives }, " dan ", { link: "Question tag", to: en.sentence-building.question-tags }, "."], vi: ["Về ngữ điệu của câu hỏi và câu hỏi đuôi, xem ", { link: "Câu hỏi và câu phủ định", to: en.sentence-building.questions-negatives }, " và ", { link: "Câu hỏi đuôi", to: en.sentence-building.question-tags }, "."] } }

  - title: { en: Contrastive stress, uk: "Контрастний наголос", es: "Acento contrastivo", pt: "Acento contrastivo", fr: "Accent contrastif", de: "Kontrastbetonung", it: "Accento contrastivo", pl: "Akcent kontrastywny", tr: "Karşıtlık vurgusu", id: "Tekanan kontras", vi: "Trọng âm đối lập" }
