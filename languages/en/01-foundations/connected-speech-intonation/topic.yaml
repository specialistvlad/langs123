# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.connected-speech-intonation
lang: en
kind: foundations
tags: [pronunciation, connected-speech, intonation, stress, rhythm]
concepts: [connected-speech, intonation]
related: [en.foundations.pronunciation-ipa, en.sentence-building.question-tags, en.sentence-building.questions-negatives, en.modals.can-could]
status: { en: draft }

title: { en: Connected Speech and Intonation }
summary:
  lead:
    en: "Connected speech links, reduces and changes sounds between words, while stress and intonation carry meaning, attitude and focus."
  rule:
    en: "Content words take the stress and function words go weak, so the beat falls on the meaning:"
  ex: ["The ", { stress: chil }, "dren ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B2, point: { en: Weak forms }, rule: { en: "function words are weak inside a clause, strong at its end" }, ex: ["a cup of tea ", { target: { ipa: ə ˈkʌp əv ˈtiː } }] }
        - { level: B2, point: { en: Sentence stress }, rule: { en: "content words carry the stress; function words stay weak" }, ex: ["We ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."] }
        - { level: B2, point: { en: Linking }, rule: { en: ["a final consonant joins the next vowel; ", { ipa: r }, ", ", { ipa: j }, " and ", { ipa: w }, " link vowels"] }, ex: ["turn off ", { target: { ipa: tɜː.nɒf } }] }
        - { level: B2, point: { en: Elision and assimilation }, rule: { en: "t and d drop between consonants; a final consonant matches the next" }, ex: { examples: [["next day ", { ipa: neks deɪ }], ["ten boys ", { ipa: tem bɔɪz }]] } }
        - { level: B2, point: { en: Intonation }, rule: { en: "falls for statements and wh-questions, rises for yes-no questions" }, ex: { examples: [["Where do you ", { stress: live }, "? ", { intonation: fall }], ["Do you ", { stress: live }, " here? ", { intonation: rise }]] } }
        - { level: B2, point: { en: Contrastive stress }, rule: { en: "stress the word that carries the contrast" }, ex: ["I didn't say ", { stress: he }, " stole her money."] }
        - { level: C1, point: { en: Informal reductions }, rule: { en: "you merges with d and t; gonna for going to; h drops" }, ex: { examples: [["did you ", { target: { ipa: ˈdɪdʒuː } }], ["going to ", { target: gonna }]] } }
        - { level: C1, point: { en: Attitude }, rule: { en: "the same words change meaning with the tune" }, ex: { examples: [["Really? ", { intonation: rise }], ["Really? ", { intonation: fall }, { intonation: rise }]] } }
        - { level: C1, point: { en: Focus }, rule: { en: "new information takes the stress; given words lose it" }, ex: { exchange: ["Who broke it?", [{ stress: Tom }, " broke it."]] } }
        - { level: C1, point: { en: Trap }, rule: { en: "statements fall; a final rise sounds like a question" }, ex: ["I live in Leeds. ", { target: { intonation: fall } }] }
        - { level: C2, point: { en: Key and turns }, rule: { en: "high key engages, low key closes; falls end turns, rises hold them" }, ex: ["That is all from me. ", { intonation: fall }] }
        - { level: C2, point: { en: Stress shift }, rule: { en: "a stress moves earlier before another stressed syllable" }, ex: ["thir", { stress: teen }, " but ", { stress: thir }, "teen ", { stress: men }] }

sections:
  - title: { en: Strong and weak forms }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: word, label: { en: Word } }
          - { key: weak, label: { en: Weak form } }
          - { key: strong, label: { en: Strong form } }
        rows:
          - { level: B2, value: ə, word: a, weak: { ipa: ə }, strong: { ipa: eɪ } }
          - { level: B2, value: ən, word: an, weak: { ipa: ən }, strong: { ipa: æn } }
          - { level: B2, value: ðə, word: the, weak: { ipa: ðə }, strong: { ipa: ðiː } }
          - { level: B2, value: ən, word: and, weak: { ipa: ən }, strong: { ipa: ænd } }
          - { level: B2, value: bət, word: but, weak: { ipa: bət }, strong: { ipa: bʌt } }
          - { level: B2, value: tə, word: to, weak: { ipa: tə }, strong: { ipa: tuː } }
          - { level: B2, value: əv, word: of, weak: { ipa: əv }, strong: { ipa: ɒv } }
          - { level: B2, value: fə, word: for, weak: { ipa: fə }, strong: { ipa: fɔː } }
          - { level: B2, value: frəm, word: from, weak: { ipa: frəm }, strong: { ipa: frɒm } }
          - { level: B2, value: ət, word: at, weak: { ipa: ət }, strong: { ipa: æt } }
          - { level: B2, value: kən, word: can, weak: { ipa: kən }, strong: { ipa: kæn } }
          - { level: B2, value: wəz, word: was, weak: { ipa: wəz }, strong: { ipa: wɒz } }
          - { level: B2, value: wə, word: were, weak: { ipa: wə }, strong: { ipa: wɜː } }
          - { level: B2, value: həv, word: have, weak: { ipa: həv }, strong: { ipa: hæv } }
          - { level: B2, value: həz, word: has, weak: { ipa: həz }, strong: { ipa: hæz } }
          - { level: B2, value: həd, word: had, weak: { ipa: həd }, strong: { ipa: hæd } }
          - { level: B2, value: də, word: do, weak: { ipa: də }, strong: { ipa: duː } }
          - { level: B2, value: məst, word: must, weak: { ipa: məst }, strong: { ipa: mʌst } }
          - { level: B2, value: ðə, word: there, weak: { ipa: ðə }, strong: { ipa: ðeə } }
          - { level: B2, value: ðət, word: that, weak: { ipa: ðət }, strong: { ipa: ðæt } }
          - { level: B2, value: səm, word: some, weak: { ipa: səm }, strong: { ipa: sʌm } }
          - { level: B2, value: hə, word: her, weak: { ipa: hə }, strong: { ipa: hɜː } }
          - { level: B2, value: ðəm, word: them, weak: { ipa: ðəm }, strong: { ipa: ðem } }
      - type: usage
        columns:
          - { key: use, label: { en: Where the strong form appears } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, use: { en: At the end of a clause }, ex: { examples: [["What are you looking ", { target: at }, "?"], ["Yes, she ", { target: can }, "."]] } }
          - { level: B2, use: { en: In a contrast }, ex: ["It is a gift ", { target: from }, " Ana, not ", { target: for }, " her."] }
          - { level: B2, use: { en: For emphasis }, ex: ["I ", { target: do }, " like it!"] }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Inside a clause, articles, prepositions, auxiliaries, pronouns and conjunctions take their weak form." } }
          - { type: rule, level: B2, text: { en: ["Before a vowel, ", { term: the }, ", ", { term: to }, " and ", { term: do }, " become ", { ipa: ðɪ }, ", ", { ipa: tʊ }, " and ", { ipa: dʊ }, "; ", { term: for }, ", ", { term: were }, " and ", { term: there }, " add ", { ipa: r }, "."] } }
          - { type: rule, level: B2, text: { en: ["As a conjunction, ", { term: that }, " is weak; as a demonstrative it is strong."] }, ex: { examples: [["I know ", { target: that }, " she is right."], [{ target: That }, " one is mine."]] } }
          - { type: rule, level: B2, text: { en: ["In ", { term: there is }, ", ", { term: there }, " is weak; as a word for a place it is strong."] }, ex: ["There is a bus stop over ", { target: there }, "."] }
          - { type: note, level: B2, variety: en-US, text: { en: ["In US English the strong forms of ", { term: was }, ", ", { term: of }, " and ", { term: from }, " have ", { ipa: ʌ }, " in place of ", { ipa: ɒ }, "."] } }
          - { type: note, level: B2, text: { en: ["The IPA symbols are set out in ", { link: Sounds and IPA, to: en.foundations.pronunciation-ipa }, "."] } }

  - title: { en: Sentence stress and rhythm }
    role: own
    content:
      - type: usage
        columns:
          - { key: words, label: { en: Words } }
          - { key: stress, label: { en: In the sentence } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, words: { en: "Nouns, main verbs, adjectives and adverbs" }, stress: { en: stressed }, ex: ["The ", { stress: chil }, "dren ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."] }
          - { level: B2, words: { en: "Question words, negatives, demonstratives and numbers" }, stress: { en: stressed }, ex: ["I ", { stress: don't }, " ", { stress: know }, " ", { stress: where }, " he ", { stress: lives }, "."] }
          - { level: B2, words: { en: "Articles, prepositions, auxiliaries, pronouns and conjunctions" }, stress: { en: weak }, ex: ["The children want to go to the park. ", { ipa: ðə ˈtʃɪldrən ˈwɒnt tə ˈgəʊ tə ðə ˈpɑːk }] }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Stressed syllables come at regular beats; the unstressed syllables between them are said faster and shorter." } }
          - { type: rule, level: B2, text: { en: "Sentences with the same number of stresses take about the same time." }, ex: { examples: [[{ stress: Dogs }, " ", { stress: eat }, " ", { stress: bones }, "."], ["The ", { stress: dogs }, " are ", { stress: eat }, "ing the ", { stress: bones }, "."]] } }

  - title: { en: Linking }
    role: own
    content:
      - type: usage
        columns:
          - { key: link, label: { en: Link } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, link: { en: Consonant to vowel }, rule: { en: "a final consonant moves to the next syllable" }, ex: { examples: [["turn off ", { ipa: tɜː.nɒf }], ["pick it up ", { ipa: ˈpɪ.kɪ.tʌp }]] } }
          - { level: B2, link: { en: Linking r }, rule: { en: "written r is pronounced before a vowel" }, ex: { examples: [["far away ", { ipa: ˌfɑː.rəˈweɪ }], ["later on ", { ipa: ˈleɪ.tə.rɒn }]] } }
          - { level: B2, link: { en: Intrusive r }, rule: { en: [{ ipa: r }, " is added after ", { ipa: ɔː }, ", ", { ipa: ɑː }, " and ", { ipa: ə }, " before a vowel"] }, ex: { examples: [["law and order ", { ipa: ˌlɔː.rənˈɔː.də }], ["sofa and chair ", { ipa: ˈsəʊ.fə.rən.tʃeə }]] } }
          - { level: B2, link: { en: Glide j }, rule: { en: [{ ipa: j }, " joins ", { ipa: iː }, ", ", { ipa: eɪ }, ", ", { ipa: aɪ }, " and ", { ipa: ɔɪ }, " to a vowel"] }, ex: { examples: [["I agree ", { ipa: aɪ.jəˈgriː }], ["say it ", { ipa: seɪ.jɪt }]] } }
          - { level: B2, link: { en: Glide w }, rule: { en: [{ ipa: w }, " joins ", { ipa: uː }, ", ", { ipa: əʊ }, " and ", { ipa: aʊ }, " to a vowel"] }, ex: { examples: [["go on ", { ipa: gəʊ.wɒn }], ["how about ", { ipa: ˌhaʊ.wəˈbaʊt }]] } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "In IPA, a dot marks a syllable break." } }
          - { type: note, level: B2, variety: en-US, text: { en: "US English pronounces every r, so it has no linking r and no intrusive r." } }
          - { type: note, level: B2, variety: en-US, text: { en: ["Between vowels US English says t as a flap ", { ipa: ɾ }, ", so ", { term: get it }, " is ", { ipa: ˈgeɾɪt }, "."] } }

  - title: { en: Elision }
    role: own
    content:
      - type: usage
        columns:
          - { key: elision, label: { en: Lost sound } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, elision: { en: "t and d" }, rule: { en: "t or d disappears between two consonants" }, ex: { examples: [["next day ", { ipa: neks deɪ }], ["old man ", { ipa: əʊl mæn }], ["last night ", { ipa: lɑːs naɪt }]] } }
          - { level: B2, elision: { en: Unstressed vowel }, rule: { en: "an unstressed vowel is lost in some words" }, ex: { examples: [["comfortable ", { ipa: ˈkʌmftəbl }], ["interesting ", { ipa: ˈɪntrəstɪŋ }], ["different ", { ipa: ˈdɪfrənt }]] } }

  - title: { en: Assimilation }
    role: own
    content:
      - type: usage
        columns:
          - { key: change, label: { en: Change } }
          - { key: before, label: { en: Before } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, change: { mapping: [{ ipa: "n" }, { ipa: m }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["ten boys ", { ipa: tem bɔɪz }], ["handbag ", { ipa: ˈhæmbæg }]] } }
          - { level: B2, change: { mapping: [{ ipa: d }, { ipa: b }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["good morning ", { ipa: gʊb ˈmɔːnɪŋ }], ["road map ", { ipa: rəʊb mæp }]] } }
          - { level: B2, change: { mapping: [{ ipa: t }, { ipa: p }] }, before: { alternatives: [{ ipa: p }, { ipa: b }, { ipa: m }] }, ex: { examples: [["that man ", { ipa: ðæp mæn }], ["right place ", { ipa: raɪp pleɪs }]] } }
          - { level: B2, change: { mapping: [{ ipa: "n" }, { ipa: ŋ }] }, before: { alternatives: [{ ipa: k }, { ipa: g }] }, ex: { examples: [["ten girls ", { ipa: teŋ gɜːlz }], ["in case ", { ipa: ɪŋ keɪs }]] } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "The last sound of a word changes to match the first sound of the next word." } }

  - title: { en: "Intonation: the main tunes" }
    role: own
    content:
      - type: usage
        columns:
          - { key: tune, label: { en: Tune } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, tune: { en: ["Fall ", { intonation: fall }] }, use: { en: "statements, wh-questions and commands" }, ex: { examples: [["I live in ", { stress: Leeds }, ". ", { intonation: fall }], ["Where do you ", { stress: live }, "? ", { intonation: fall }]] } }
          - { level: B2, tune: { en: ["Rise ", { intonation: rise }] }, use: { en: "yes-no questions" }, ex: ["Do you live in ", { stress: Leeds }, "? ", { intonation: rise }] }
          - { level: B2, tune: { en: ["Fall-rise ", { intonation: fall }, { intonation: rise }] }, use: { en: "reservation, with something left unsaid" }, ex: ["The room was ", { stress: clean }, ". ", { intonation: fall }, { intonation: rise }] }
          - { level: B2, tune: { en: "Rise-rise-fall" }, use: { en: lists }, ex: ["We need ", { stress: eggs }, ", ", { intonation: rise }, " ", { stress: milk }, ", ", { intonation: rise }, " and ", { stress: bread }, ". ", { intonation: fall }] }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "A tone unit is a stretch of speech with one tune; short pauses separate tone units." } }
          - { type: rule, level: B2, text: { en: "The nucleus is the main stressed syllable of a tone unit, usually on its last content word." }, ex: ["I have lost my ", { stress: keys }, "."] }
          - { type: note, level: B2, text: { en: ["For the tunes of questions and tags, see ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, " and ", { link: Question Tags, to: en.sentence-building.question-tags }, "."] } }

  - title: { en: Contrastive stress }
    role: own
    content:
      - type: usage
        columns:
          - { key: ex, label: { en: Stress on } }
          - { key: meaning, label: { en: Meaning } }
        rows:
          - { level: B2, ex: [{ stress: I }, " didn't say he stole her money."], meaning: { en: "Someone else said it." } }
          - { level: B2, ex: ["I ", { stress: "didn't" }, " say he stole her money."], meaning: { en: "I never said it." } }
          - { level: B2, ex: ["I didn't ", { stress: say }, " he stole her money."], meaning: { en: "I only hinted at it." } }
          - { level: B2, ex: ["I didn't say ", { stress: he }, " stole her money."], meaning: { en: "I said another person stole it." } }
          - { level: B2, ex: ["I didn't say he ", { stress: stole }, " her money."], meaning: { en: "He took it in another way." } }
          - { level: B2, ex: ["I didn't say he stole ", { stress: her }, " money."], meaning: { en: "He stole someone else's money." } }
          - { level: B2, ex: ["I didn't say he stole her ", { stress: mo }, "ney."], meaning: { en: "He stole something else of hers." } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Stress the word that differs from what the listener expects; the other words keep their normal weight." } }

  - title: { en: Informal reductions }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: full, label: { en: Full form } }
          - { key: reduced, label: { en: In speech } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, value: dʒ, full: did you, reduced: { ipa: ˈdɪdʒuː }, ex: ["What ", { target: did you }, " say?"] }
          - { level: C1, value: tʃ, full: meet you, reduced: { ipa: ˈmiːtʃuː }, ex: ["Nice to ", { target: meet you }, "."] }
          - { level: C1, value: ˈgənə, full: going to, reduced: [{ term: gonna }, " ", { ipa: ˈgənə }], ex: ["It is ", { target: gonna }, " rain."] }
          - { level: C1, value: ˈwɒnə, full: want to, reduced: [{ term: wanna }, " ", { ipa: ˈwɒnə }], ex: ["I ", { target: wanna }, " go home."] }
          - { level: C1, value: ˈhæftə, full: have to, reduced: [{ term: hafta }, " ", { ipa: ˈhæftə }], ex: ["We ", { target: hafta }, " leave now."] }
          - { level: C1, value: ˈgɒtə, full: got to, reduced: [{ term: gotta }, " ", { ipa: ˈgɒtə }], ex: ["I ", { target: gotta }, " go."] }
          - { level: C1, value: ˈkaɪndə, full: kind of, reduced: [{ term: kinda }, " ", { ipa: ˈkaɪndə }], ex: ["It is ", { target: kinda }, " cold."] }
          - { level: C1, value: ˈlemi, full: let me, reduced: [{ term: lemme }, " ", { ipa: ˈlemi }], ex: [{ target: Lemme }, " see."] }
          - { level: C1, value: dəˈnəʊ, full: don't know, reduced: [{ term: dunno }, " ", { ipa: dəˈnəʊ }], ex: ["I ", { target: dunno }, "."] }
          - { level: C1, value: ɪm, full: tell him, reduced: { ipa: ˈtelɪm }, ex: ["Did you ", { target: tell him }, "?"] }
          - { level: C1, value: "n", full: and, reduced: { ipa: "n" }, ex: ["fish ", { target: and }, " chips"] }
          - { level: C1, value: ʔ, full: { en: t before a consonant }, reduced: { ipa: ʔ }, ex: ["foo", { letter: t }, "ball"] }
      - type: list
        items:
          - { type: rule, level: C1, text: { en: ["Before ", { term: you }, " and ", { term: your }, ", a final ", { ipa: d }, " or ", { ipa: t }, " merges with ", { ipa: j }, " into ", { ipa: dʒ }, " or ", { ipa: tʃ }, "."] } }
          - { type: rule, level: C1, text: { en: ["After another word, ", { term: he }, ", ", { term: him }, ", ", { term: his }, ", ", { term: her }, ", ", { term: have }, ", ", { term: has }, " and ", { term: had }, " lose ", { ipa: h }, "."] } }
          - { type: rule, level: C1, text: { en: "Informal reductions suit casual speech; formal speech keeps the full forms." } }

  - title: { en: Intonation and attitude }
    role: own
    content:
      - type: usage
        columns:
          - { key: tune, label: { en: Tune } }
          - { key: attitude, label: { en: Attitude } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, tune: { en: ["Fall ", { intonation: fall }] }, attitude: { en: "flat, final or uninterested" }, ex: { examples: [["Really. ", { intonation: fall }], ["Thanks. ", { intonation: fall }]] } }
          - { level: C1, tune: { en: ["Rise ", { intonation: rise }] }, attitude: { en: "interest, or a real question" }, ex: { examples: [["Really? ", { intonation: rise }], ["Oh yes? ", { intonation: rise }]] } }
          - { level: C1, tune: { en: ["Fall-rise ", { intonation: fall }, { intonation: rise }] }, attitude: { en: "doubt or disbelief" }, ex: { examples: [["Really? ", { intonation: fall }, { intonation: rise }], ["Oh yes? ", { intonation: fall }, { intonation: rise }]] } }
          - { level: C1, tune: { en: ["Rise-fall ", { intonation: rise }, { intonation: fall }] }, attitude: { en: "strong feeling: surprise, warmth or irony" }, ex: { examples: [["Really? ", { intonation: rise }, { intonation: fall }], ["Thanks! ", { intonation: rise }, { intonation: fall }]] } }
      - type: list
        items:
          - { type: rule, level: C1, text: { en: "The tune carries the attitude, so the same words change meaning." } }

  - title: { en: Intonation and grammar }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, point: { en: Defining relative clause }, rule: { en: "one tone unit, with no pause" }, ex: "The students who passed the exam were pleased." }
          - { level: C1, point: { en: Non-defining relative clause }, rule: { en: "its own tone unit, with a pause on each side" }, ex: ["The students, ", { intonation: rise }, " who passed the exam, ", { intonation: rise }, " were pleased. ", { intonation: fall }] }
          - { level: C1, point: { en: Parenthetical phrase }, rule: { en: "lower and faster, in a tone unit of its own" }, ex: "The film, I think, was too long." }
          - { level: C1, point: { en: Echo question }, rule: { en: "repeats the word heard with a rise, to check or to show surprise" }, ex: { exchange: ["I am moving to Oslo.", ["Oslo? ", { intonation: rise }]] } }
          - { level: C1, point: { en: Open list }, rule: { en: "a final rise shows that the list goes on" }, ex: ["Bring pens, ", { intonation: rise }, " paper, ", { intonation: rise }, " ink, ", { intonation: rise }] }
      - type: list
        items:
          - { type: note, level: C1, text: { en: ["For the tunes of question tags, see ", { link: Question Tags, to: en.sentence-building.question-tags }, "."] } }

  - title: { en: Focus and new information }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, point: { en: New information }, rule: { en: "the nucleus falls on the word that adds something new" }, ex: ["There is a ", { stress: letter }, " for you."] }
          - { level: C1, point: { en: Given words }, rule: { en: "words already in the conversation lose their stress" }, ex: ["I wanted the ", { stress: red }, " car, but they only had the ", { stress: blue }, " car."] }
          - { level: C1, point: { en: Clefts }, rule: { en: "the stress falls on the word in focus" }, ex: { examples: [["It was ", { stress: Tom }, " who broke it."], ["What I need is a ", { stress: rest }, "."]] } }
          - { level: C1, point: { en: Answers }, rule: { en: "the answer word takes the stress and the rest is weak" }, ex: { exchange: ["Who broke it?", [{ stress: Tom }, " broke it."]] } }

  - title: { en: Pitch range and key }
    role: own
    content:
      - type: usage
        columns:
          - { key: pitch, label: { en: Pitch } }
          - { key: effect, label: { en: Effect } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, pitch: { en: High key }, effect: { en: "engagement, surprise or excitement" }, ex: ["You have got the ", { stress: job }, "? ", { intonation: rise }] }
          - { level: C2, pitch: { en: Low key }, effect: { en: "finality, seriousness or calm" }, ex: ["That is my ", { stress: de }, "cision. ", { intonation: fall }] }
          - { level: C2, pitch: { en: Wide range }, effect: { en: enthusiasm }, ex: ["It was absolutely ", { stress: won }, "derful!"] }
          - { level: C2, pitch: { en: Narrow range }, effect: { en: "boredom or restraint" }, ex: ["It was ", { stress: fine }, "."] }
      - type: list
        items:
          - { type: rule, level: C2, text: { en: "Key is the overall height of the voice; range is the distance between its highest and lowest notes." } }

  - title: { en: Stress shift }
    role: own
    content:
      - type: comparison
        columns:
          - { key: alone, label: { en: Before a pause } }
          - { key: before, label: { en: Before a stressed syllable } }
        rows:
          - { level: C2, alone: ["He is thir", { stress: teen }, "."], before: [{ stress: thir }, "teen ", { stress: men }] }
          - { level: C2, alone: ["She is Japa", { stress: nese }, "."], before: [{ stress: Jap }, "anese ", { stress: food }] }
          - { level: C2, alone: ["It is un", { stress: known }, "."], before: [{ stress: un }, "known ", { stress: au }, "thor"] }
      - type: list
        items:
          - { type: rule, level: C2, text: { en: "The rhythm rule: a word's stress moves to an earlier syllable before another stressed syllable." } }

  - title: { en: Hesitation and discourse structure }
    role: own
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Signal } }
          - { key: effect, label: { en: Effect } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, signal: { en: Filler }, effect: { en: "a level tone holds the turn while you think" }, ex: ["I think, ", { target: um }, ", we should wait."] }
          - { level: C2, signal: { en: New topic }, effect: { en: "the pitch starts high again after a pause" }, ex: ["That is the budget. ", { intonation: fall }, " Now, the schedule."] }
          - { level: C2, signal: { en: ["Fall ", { intonation: fall }] }, effect: { en: "ends the turn" }, ex: ["That is all from me. ", { intonation: fall }] }
          - { level: C2, signal: { en: ["Rise ", { intonation: rise }] }, effect: { en: "keeps the floor: more is coming" }, ex: ["First we call the client, ", { intonation: rise }, " and then ", { gap: true }] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: C1, wrong: [{ stress: I }, " ", { stress: want }, " ", { stress: to }, " ", { stress: go }, " ", { stress: to }, " ", { stress: the }, " ", { stress: park }, "."], right: ["I ", { stress: want }, " ", { target: to }, " ", { stress: go }, " ", { target: to the }, " ", { stress: park }, "."], rule: { en: "stress content words only; function words stay weak" } }
          - { level: C1, wrong: ["I live in Leeds. ", { intonation: rise }], right: ["I live in Leeds. ", { target: { intonation: fall } }], rule: { en: "a statement ends in a fall; a rise sounds like a question or a doubt" } }
          - { level: C1, wrong: ["turn off ", { ipa: tɜːn ʔɒf }], right: ["turn off ", { target: { ipa: tɜː.nɒf } }], rule: { en: "link a final consonant to the vowel that follows" } }
