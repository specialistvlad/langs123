title: { en: Connected Speech and Intonation, uk: "Зв’язне мовлення та інтонація", es: "Habla conectada y entonación", pt: "Fala conectada e entonação", fr: "Chaîne parlée et intonation", de: "Gebundenes Sprechen und Intonation", it: "Parlato connesso e intonazione", pl: "Mowa ciągła i intonacja", tr: "Bağlı konuşma ve tonlama", id: "Ujaran bersambung dan intonasi", vi: "Lời nói liên tục và ngữ điệu" }
summary:
  lead:
    en: "Connected speech links, reduces and changes sounds between words, while stress and intonation carry meaning, attitude and focus."
    uk: "У зв’язному мовленні звуки на межі слів поєднуються, редукуються і змінюються, а наголос та інтонація передають значення, ставлення й фокус."
    es: "En el habla conectada los sonidos se enlazan, se reducen y cambian; el acento y la entonación dan significado, actitud y foco."
    pt: "Na fala conectada, os sons entre palavras se ligam, se reduzem e mudam; acento e entonação transmitem significado, atitude e foco."
    fr: "Dans la chaîne parlée, les sons s’enchaînent, se réduisent et changent, tandis que l’accent et l’intonation portent le sens, l’attitude et le focus."
    de: "Im gebundenen Sprechen verbinden, verkürzen und verändern sich die Laute zwischen Wörtern; Betonung und Intonation tragen Bedeutung, Haltung und Fokus."
    it: "Nel parlato connesso i suoni tra le parole si legano, si riducono e cambiano, mentre l'accento e l'intonazione trasmettono significato, atteggiamento e focus."
    pl: "W mowie ciągłej dźwięki na styku wyrazów łączą się, redukują i zmieniają, a akcent i intonacja niosą znaczenie, nastawienie i fokus."
    tr: "Bağlı konuşmada sözcükler arasındaki sesler birbirine bağlanır, zayıflar ve değişir; vurgu ile tonlama ise anlamı, tutumu ve odağı taşır."
    id: "Dalam ujaran bersambung, bunyi di antara kata saling menyambung, berkurang, dan berubah, sedangkan tekanan dan intonasi membawa makna, sikap, dan fokus."
    vi: "Trong lời nói liên tục, âm giữa các từ nối, giảm và đổi; trọng âm và ngữ điệu truyền nghĩa, thái độ, trọng tâm."
  rule:
    en: "Content words take the stress and function words go weak, so the beat falls on the meaning:"
    uk: "Повнозначні слова несуть наголос, а службові слабшають, тож ритмічний удар падає на зміст:"
    es: "Las palabras de contenido llevan el acento y las funcionales se debilitan, así que el pulso cae sobre el significado:"
    pt: "As palavras de conteúdo recebem o acento e as funcionais ficam fracas, então a batida cai sobre o significado:"
    fr: "Les mots lexicaux portent l’accent, les mots grammaticaux s’affaiblissent, et le rythme suit le sens :"
    de: "Inhaltswörter tragen die Betonung, Funktionswörter werden schwach; der Takt fällt so auf die Bedeutung:"
    it: "Le parole piene prendono l'accento e le parole funzionali si indeboliscono, così il ritmo cade sul significato:"
    pl: "Wyrazy znaczeniowe niosą akcent, a wyrazy funkcyjne słabną, więc rytm pada na znaczenie:"
    tr: "İçerik sözcükleri vurgu alır, işlev sözcükleri zayıflar; böylece ritim anlama düşer:"
    id: "Kata isi menerima tekanan dan kata fungsi menjadi lemah, sehingga ketukan jatuh pada makna:"
    vi: "Từ nội dung mang trọng âm, từ chức năng đọc yếu, nên nhịp rơi vào từ có nghĩa:"
  ex: ["The ", { stress: chil }, "dren ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."]

