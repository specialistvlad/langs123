cüklerindeki ", { ipa: "h" }, " sesi düşer."], id: ["Setelah kata lain, ", { term: "he" }, ", ", { term: "him" }, ", ", { term: "his" }, ", ", { term: "her" }, ", ", { term: "have" }, ", ", { term: "has" }, ", dan ", { term: "had" }, " kehilangan ", { ipa: "h" }, "."], vi: ["Sau một từ khác, ", { term: "he" }, ", ", { term: "him" }, ", ", { term: "his" }, ", ", { term: "her" }, ", ", { term: "have" }, ", ", { term: "has" }, " và ", { term: "had" }, " mất âm ", { ipa: "h" }, "."] } }
          - { type: rule, level: C1, text: { en: "Informal reductions suit casual speech; formal speech keeps the full forms.", uk: "Розмовні редукції доречні в невимушеному мовленні; офіційне мовлення зберігає повні форми.", es: "Las reducciones informales van con el habla coloquial; el habla formal conserva las formas completas.", pt: "As reduções informais combinam com a fala coloquial; a fala formal mantém as formas completas.", fr: "Les réductions familières conviennent à l’oral détendu ; le registre soutenu garde les formes pleines.", de: "Umgangssprachliche Verkürzungen passen zur lockeren Rede; die formelle Rede behält die Langformen.", it: "Le riduzioni informali vanno bene nel parlato colloquiale; il parlato formale mantiene le forme estese.", pl: "Redukcje potoczne pasują do swobodnej mowy; mowa formalna zachowuje formy pełne.", tr: "Gündelik kısaltmalar rahat konuşmaya uyar; resmî konuşma tam biçimleri korur.", id: "Pengurangan informal cocok untuk ujaran santai; ujaran formal mempertahankan bentuk lengkap.", vi: "Rút gọn thân mật hợp với lời nói thoải mái; lời nói trang trọng giữ dạng đầy đủ." } }

