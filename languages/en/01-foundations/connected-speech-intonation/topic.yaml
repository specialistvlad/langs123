        rows:
          - { level: C1, point: { en: Defining relative clause, uk: "Обмежувальне означальне речення", es: "Oración de relativo especificativa", pt: "Oração relativa restritiva", fr: "Proposition relative déterminative", de: "Notwendiger Relativsatz", it: "Proposizione relativa restrittiva", pl: "Zdanie względne definiujące", tr: "Belirleyici ilgi cümlesi", id: "Klausa relatif yang membatasi", vi: "Mệnh đề quan hệ xác định" }, rule: { en: "one tone unit, with no pause", uk: "одна інтонаційна група, без паузи", es: "un solo grupo tonal, sin pausa", pt: "um só grupo tonal, sem pausa", fr: "un seul groupe intonatif, sans pause", de: "eine Intonationsphrase, ohne Pause", it: "una sola unità tonale, senza pausa", pl: "jedna grupa intonacyjna, bez pauzy", tr: "tek ton birimi, duraksız", id: "satu satuan nada, tanpa jeda", vi: "một nhóm ngữ điệu, không ngắt" }, ex: "The students who passed the exam were pleased.", tr: { uk: "Ті студенти, які склали іспит, були задоволені.", es: "Los estudiantes que aprobaron el examen estaban contentos.", pt: "Os alunos que passaram na prova ficaram contentes.", fr: "Les étudiants qui ont réussi l’examen étaient contents.", de: "Die Studenten, die die Prüfung bestanden haben, waren zufrieden.", it: "Gli studenti che hanno superato l'esame erano contenti.", pl: "Ci studenci, którzy zdali egzamin, byli zadowoleni.", tr: "Sınavı geçen öğrenciler memnundu.", id: "Para mahasiswa yang lulus ujian merasa senang.", vi: "Những sinh viên đã đỗ kỳ thi rất vui." } }
          - { level: C1, point: { en: Non-defining relative clause, uk: "Необмежувальне означальне речення", es: "Oración de relativo explicativa", pt: "Oração relativa explicativa", fr: "Proposition relative explicative", de: "Nicht notwendiger Relativsatz", it: "Proposizione relativa non restrittiva", pl: "Zdanie względne niedefiniujące", tr: "Açıklayıcı ilgi cümlesi", id: "Klausa relatif yang tidak membatasi", vi: "Mệnh đề quan hệ không xác định" }, rule: { en: "its own tone unit, with a pause on each side", uk: "окрема інтонаційна група, з паузою з обох боків", es: "un grupo tonal propio, con una pausa a cada lado", pt: "um grupo tonal próprio, com uma pausa de cada lado", fr: "un groupe intonatif à part, avec une pause de chaque côté", de: "eine eigene Intonationsphrase, mit einer Pause auf jeder Seite", it: "un'unità tonale a sé, con una pausa da ogni lato", pl: "osobna grupa intonacyjna, z pauzą po obu stronach", tr: "kendi ton birimi, her iki yanında duraklarla", id: "satuan nada tersendiri, dengan jeda di kedua sisi", vi: "nhóm ngữ điệu riêng, có quãng ngắt ở hai bên" }, ex: ["The students, ", { intonation: rise }, " who passed the exam, ", { intonation: rise }, " were pleased. ", { intonation: fall }], tr: { uk: "Студенти, які склали іспит, були задоволені.", es: "Los estudiantes, que aprobaron el examen, estaban contentos.", pt: "Os alunos, que passaram na prova, ficaram contentes.", fr: "Les étudiants, qui ont réussi l’examen, étaient contents.", de: "Die Studenten, die die Prüfung bestanden haben, waren zufrieden.", it: "Gli studenti, che hanno superato l'esame, erano contenti.", pl: "Studenci, którzy zdali egzamin, byli zadowoleni.", tr: "Sınavı geçen öğrenciler memnundu.", id: "Para mahasiswa, yang lulus ujian, merasa senang.", vi: "Các sinh viên, những người đã đỗ kỳ thi, rất vui." } }
          - { level: C1, point: { en: Parenthetical phrase, uk: "Вставна конструкція", es: "Inciso", pt: "Frase parentética", fr: "Incise", de: "Einschub", it: "Inciso", pl: "Wtrącenie", tr: "Araya girme öbeği", id: "Frasa sisipan", vi: "Cụm xen" }, rule: { en: "lower and faster, in a tone unit of its own", uk: "нижче й швидше, в окремій інтонаційній групі", es: "más grave y más rápido, en un grupo tonal propio", pt: "mais grave e mais rápido, em um grupo tonal próprio", fr: "plus bas et plus vite, dans un groupe intonatif à part", de: "tiefer und schneller, in einer eigenen Intonationsphrase", it: "più basso e più veloce, in un'unità tonale a sé", pl: "niżej i szybciej, w osobnej grupie intonacyjnej", tr: "daha alçak ve hızlı, kendi ton biriminde", id: "lebih rendah dan lebih cepat, dalam satuan nada tersendiri", vi: "thấp hơn và nhanh hơn, trong một nhóm ngữ điệu riêng" }, ex: "The film, I think, was too long.", tr: { uk: "Фільм, здається, був задовгий.", es: "La película, creo, fue demasiado larga.", pt: "O filme, acho, foi longo demais.", fr: "Le film, je crois, était trop long.", de: "Der Film war, glaube ich, zu lang.", it: "Il film, penso, era troppo lungo.", pl: "Film, jak sądzę, był za długi.", tr: "Film, bence, çok uzundu.", id: "Filmnya, menurut saya, terlalu panjang.", vi: "Bộ phim, tôi nghĩ, quá dài." } }
          - { level: C1, point: { en: Echo question, uk: "Перепитування", es: "Pregunta eco", pt: "Pergunta eco", fr: "Question écho", de: "Echofrage", it: "Domanda eco", pl: "Pytanie echo", tr: "Yankı sorusu", id: "Pertanyaan gema", vi: "Câu hỏi lặp" }, rule: { en: "repeats the word heard with a rise, to check or to show surprise", uk: "повторює почуте слово з підвищенням, щоб перевірити або виразити подив", es: "repite con subida la palabra oída, para comprobar o mostrar sorpresa", pt: "repete a palavra ouvida com subida, para confirmar ou mostrar surpresa", fr: "reprend avec une montée le mot entendu, pour vérifier ou marquer la surprise", de: "wiederholt das gehörte Wort mit steigendem Ton, zur Rückfrage oder aus Überraschung", it: "ripete con una salita la parola sentita, per controllare o mostrare sorpresa", pl: "powtarza usłyszane słowo z wznoszeniem, by się upewnić lub okazać zdziwienie", tr: "duyulan sözcüğü yükselen tonla tekrarlar; doğrulamak veya şaşkınlığı göstermek için", id: "mengulang kata yang didengar dengan nada naik, untuk memastikan atau menunjukkan keterkejutan", vi: "lặp lại từ vừa nghe với giọng lên, để kiểm tra hoặc thể hiện sự ngạc nhiên" }, ex: { exchange: ["I am moving to Oslo.", ["Oslo? ", { intonation: rise }]] }, tr: { uk: "Я переїжджаю до Осло. — До Осло?", es: "Me mudo a Oslo. — ¿A Oslo?", pt: "Estou me mudando para Oslo. — Para Oslo?", fr: "Je déménage à Oslo. — À Oslo ?", de: "Ich ziehe nach Oslo. — Nach Oslo?", it: "Mi trasferisco a Oslo. — A Oslo?", pl: "Przeprowadzam się do Oslo. — Do Oslo?", tr: "Oslo’ya taşınıyorum. — Oslo’ya mı?", id: "Saya pindah ke Oslo. — Ke Oslo?", vi: "Tôi sắp chuyển đến Oslo. — Đến Oslo á?" } }
          - { level: C1, point: { en: Open list, uk: "Відкритий перелік", es: "Enumeración abierta", pt: "Enumeração aberta", fr: "Énumération ouverte", de: "Offene Aufzählung", it: "Elenco aperto", pl: "Wyliczenie otwarte", tr: "Açık sıralama", id: "Daftar terbuka", vi: "Danh sách mở" }, rule: { en: "a final rise shows that the list goes on", uk: "підвищення в кінці показує, що перелік триває", es: "una subida final indica que la enumeración continúa", pt: "uma subida no fim mostra que a enumeração continua", fr: "une montée finale montre que l’énumération continue", de: "ein Anstieg am Ende zeigt, dass die Aufzählung weitergeht", it: "una salita finale mostra che l'elenco continua", pl: "wznoszenie na końcu pokazuje, że wyliczenie trwa", tr: "sondaki yükselme sıralamanın sürdüğünü gösterir", id: "nada naik di akhir menunjukkan bahwa daftar berlanjut", vi: "giọng lên ở cuối cho thấy danh sách còn tiếp" }, ex: ["Bring pens, ", { intonation: rise }, " paper, ", { intonation: rise }, " ink, ", { intonation: rise }], tr: { uk: "Принеси ручки, папір, чорнило…", es: "Trae bolígrafos, papel, tinta…", pt: "Traga canetas, papel, tinta…", fr: "Apporte des stylos, du papier, de l’encre…", de: "Bring Stifte, Papier, Tinte …", it: "Porta penne, carta, inchiostro…", pl: "Przynieś długopisy, papier, atrament…", tr: "Kalem, kâğıt, mürekkep getir…", id: "Bawalah pulpen, kertas, tinta …", vi: "Hãy mang bút, giấy, mực…" } }
      - type: list
        items:
          - { type: note, level: C1, text: { en: ["For the tunes of question tags, see ", { link: Question Tags, to: en.sentence-building.question-tags }, "."], uk: ["Про інтонацію розділових питань див. ", { link: "Розділові питання", to: en.sentence-building.question-tags }, "."], es: ["Para el tono de las preguntas coletilla, véase ", { link: "Preguntas coletilla", to: en.sentence-building.question-tags }, "."], pt: ["Para os tons das question tags, veja ", { link: "Question tags", to: en.sentence-building.question-tags }, "."], fr: ["Pour les mélodies des question tags, voir ", { link: "Question tags", to: en.sentence-building.question-tags }, "."], de: ["Zu den Tonverläufen der Question Tags siehe ", { link: "Question Tags", to: en.sentence-building.question-tags }, "."], it: ["Per i toni dei question tag, vedi ", { link: "Question tag", to: en.sentence-building.question-tags }, "."], pl: ["O melodii pytań rozłącznych zob. ", { link: "Pytania rozłączne", to: en.sentence-building.question-tags }, "."], tr: ["Question tags kalıplarının tonları için ", { link: "Question tags", to: en.sentence-building.question-tags }, " konusuna bakın."], id: ["Untuk nada question tag, lihat ", { link: "Question tag", to: en.sentence-building.question-tags }, "."], vi: ["Về ngữ điệu của câu hỏi đuôi, xem ", { link: "Câu hỏi đuôi", to: en.sentence-building.question-tags }, "."] } }

  - title: { en: Focus and new information, uk: "Фокус і нова інформація", es: "Foco e información nueva", pt: "Foco e informação nova", fr: "Focus et information nouvelle", de: "Fokus und neue Information", it: "Focus e informazione nuova", pl: "Fokus i nowa informacja", tr: "Odak ve yeni bilgi", id: "Fokus dan informasi baru", vi: "Trọng tâm và thông tin mới" }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, point: { en: New information, uk: "Нова інформація", es: "Información nueva", pt: "Informação nova", fr: "Information nouvelle", de: "Neue Information", it: "Informazione nuova", pl: "Nowa informacja", tr: "Yeni bilgi", id: "Informasi baru", vi: "Thông tin mới" }, rule: { en: "the nucleus falls on the word that adds something new", uk: "ядро припадає на слово, що додає щось нове", es: "el núcleo cae en la palabra que aporta algo nuevo", pt: "o núcleo cai na palavra que acrescenta algo novo", fr: "le noyau tombe sur le mot qui apporte quelque chose de nouveau", de: "der Kern liegt auf dem Wort, das etwas Neues bringt", it: "il nucleo cade sulla parola che aggiunge qualcosa di nuovo", pl: "jądro pada na wyraz, który wnosi coś nowego", tr: "çekirdek, yeni bir şey ekleyen sözcüğe düşer", id: "inti jatuh pada kata yang menambahkan hal baru", vi: "hạt nhân rơi vào từ đem lại điều mới" }, ex: ["There is a ", { stress: letter }, " for you."], tr: { uk: "Для тебе є лист.", es: "Hay una carta para ti.", pt: "Tem uma carta para você.", fr: "Il y a une lettre pour toi.", de: "Da ist ein Brief für dich.", it: "C'è una lettera per te.", pl: "Jest do ciebie list.", tr: "Sana bir mektup var.", id: "Ada surat untukmu.", vi: "Có một lá thư cho bạn." } }
          - { level: C1, point: { en: Given words, uk: "Відомі слова", es: "Palabras ya dadas", pt: "Palavras já dadas", fr: "Mots déjà donnés", de: "Bereits Gegebenes", it: "Parole già date", pl: "Wyrazy znane", tr: "Bilinen sözcükler", id: "Kata yang sudah diketahui", vi: "Từ đã biết" }, rule: { en: "words already in the conversation lose their stress", uk: "слова, що вже прозвучали в розмові, втрачають наголос", es: "las palabras que ya están en la conversación pierden el acento", pt: "as palavras que já estão na conversa perdem o acento", fr: "les mots déjà présents dans la conversation perdent leur accent", de: "Wörter, die schon im Gespräch sind, verlieren ihre Betonung", it: "le parole già presenti nella conversazione perdono l'accento", pl: "wyrazy, które już padły w rozmowie, tracą akcent", tr: "konuşmada zaten geçen sözcükler vurgusunu kaybeder", id: "kata yang sudah ada dalam percakapan kehilangan tekanannya", vi: "từ đã có trong cuộc trò chuyện mất trọng âm" }, ex: ["I wanted the ", { stress: red }, " car, but they only had the ", { stress: blue }, " car."], tr: { uk: "Я хотів червону машину, але в них була лише синя.", es: "Quería el auto rojo, pero solo tenían el azul.", pt: "Eu queria o carro vermelho, mas eles só tinham o azul.", fr: "Je voulais la voiture rouge, mais ils n’avaient que la bleue.", de: "Ich wollte das rote Auto, aber sie hatten nur das blaue.", it: "Volevo l'auto rossa, ma avevano solo quella blu.", pl: "Chciałem czerwony samochód, ale mieli tylko niebieski.", tr: "Kırmızı arabayı istedim ama sadece mavi olanı vardı.", id: "Saya mau mobil merah, tetapi mereka hanya punya yang biru.", vi: "Tôi muốn chiếc xe màu đỏ, nhưng họ chỉ có xe màu xanh." } }
          - { level: C1, point: { en: Clefts, uk: "Розщеплені речення", es: "Oraciones hendidas", pt: "Orações clivadas", fr: "Phrases clivées", de: "Spaltsätze", it: "Frasi scisse", pl: "Zdania rozszczepione", tr: "Yarılmış cümleler", id: "Kalimat belah", vi: "Câu chẻ" }, rule: { en: "the stress falls on the word in focus", uk: "наголос падає на слово у фокусі", es: "el acento cae en la palabra en foco", pt: "o acento cai na palavra em foco", fr: "l’accent tombe sur le mot mis en relief", de: "die Betonung liegt auf dem Wort im Fokus", it: "l'accento cade sulla parola in focus", pl: "akcent pada na wyraz w fokusie", tr: "vurgu odaktaki sözcüğe düşer", id: "tekanan jatuh pada kata yang menjadi fokus", vi: "trọng âm rơi vào từ là trọng tâm" }, ex: { examples: [["It was ", { stress: Tom }, " who broke it."], ["What I need is a ", { stress: rest }, "."]] }, tr: { uk: { examples: ["Це Том його зламав.", "Мені потрібен відпочинок."] }, es: { examples: ["Fue Tom quien lo rompió.", "Lo que necesito es descansar."] }, pt: { examples: ["Foi o Tom que quebrou.", "O que eu preciso é de um descanso."] }, fr: { examples: ["C’est Tom qui l’a cassé.", "Ce dont j’ai besoin, c’est d’une pause."] }, de: { examples: ["Tom war es, der es kaputt gemacht hat.", "Was ich brauche, ist eine Pause."] }, it: { examples: ["È stato Tom a romperlo.", "Ciò di cui ho bisogno è un riposo."] }, pl: { examples: ["To Tom to zepsuł.", "Potrzebuję odpoczynku."] }, tr: { examples: ["Onu kıran Tom’du.", "İhtiyacım olan şey bir dinlenme."] }, id: { examples: ["Tom yang merusaknya.", "Yang saya butuhkan adalah istirahat."] }, vi: { examples: ["Chính Tom đã làm hỏng nó.", "Điều tôi cần là được nghỉ ngơi."] } } }
          - { level: C1, point: { en: Answers, uk: "Відповіді", es: "Respuestas", pt: "Respostas", fr: "Réponses", de: "Antworten", it: "Risposte", pl: "Odpowiedzi", tr: "Cevaplar", id: "Jawaban", vi: "Câu trả lời" }, rule: { en: "the answer word takes the stress and the rest is weak", uk: "слово-відповідь отримує наголос, решта слабка", es: "la palabra de la respuesta lleva el acento y el resto queda débil", pt: "a palavra da resposta recebe o acento e o resto fica fraco", fr: "le mot de la réponse porte l’accent et le reste reste faible", de: "das Antwortwort trägt die Betonung, der Rest bleibt schwach", it: "la parola della risposta prende l'accento e il resto resta debole", pl: "wyraz odpowiedzi dostaje akcent, a reszta jest słaba", tr: "cevap sözcüğü vurgu alır, geri kalanı zayıf kalır", id: "kata jawaban menerima tekanan dan sisanya lemah", vi: "từ trả lời mang trọng âm, phần còn lại đọc yếu" }, ex: { exchange: ["Who broke it?", [{ stress: Tom }, " broke it."]] }, tr: { uk: "Хто це зламав? — Це зламав Том.", es: "¿Quién lo rompió? — Lo rompió Tom.", pt: "Quem quebrou isso? — O Tom quebrou.", fr: "Qui l’a cassé ? — C’est Tom qui l’a cassé.", de: "Wer hat das kaputt gemacht? — Tom hat es kaputt gemacht.", it: "Chi l'ha rotto? — L'ha rotto Tom.", pl: "Kto to zepsuł? — Tom to zepsuł.", tr: "Bunu kim kırdı? — Tom kırdı.", id: "Siapa yang merusaknya? — Tom yang merusaknya.", vi: "Ai làm hỏng nó? — Tom làm hỏng nó." } }

  - title: { en: Pitch range and key, uk: "Діапазон і регістр голосу", es: "Rango tonal y registro", pt: "Extensão e registro da voz", fr: "Registre et étendue de la voix", de: "Tonhöhenumfang und Tonhöhenlage", it: "Estensione e registro della voce", pl: "Zakres i rejestr głosu", tr: "Ses aralığı ve perde", id: "Rentang dan tinggi nada", vi: "Quãng giọng và cao độ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pitch, label: { en: Pitch, uk: "Висота тону", es: "Altura", pt: "Altura", fr: "Hauteur", de: "Tonhöhe", it: "Altezza", pl: "Wysokość", tr: "Perde", id: "Tinggi nada", vi: "Cao độ" } }
          - { key: effect, label: { en: Effect, uk: "Ефект", es: "Efecto", pt: "Efeito", fr: "Effet", de: "Wirkung", it: "Effetto", pl: "Efekt", tr: "Etki", id: "Efek", vi: "Hiệu quả" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, pitch: { en: High key, uk: "Високий регістр", es: "Registro alto", pt: "Registro alto", fr: "Registre haut", de: "Hohe Lage", it: "Registro alto", pl: "Wysoki rejestr", tr: "Yüksek perde", id: "Nada tinggi", vi: "Giọng cao" }, effect: { en: "engagement, surprise or excitement", uk: "залученість, подив або хвилювання", es: "implicación, sorpresa o entusiasmo", pt: "envolvimento, surpresa ou empolgação", fr: "engagement, surprise ou excitation", de: "Beteiligung, Überraschung oder Aufregung", it: "coinvolgimento, sorpresa o eccitazione", pl: "zaangażowanie, zdziwienie lub podekscytowanie", tr: "ilgi, şaşkınlık veya heyecan", id: "keterlibatan, kejutan, atau kegembiraan", vi: "sự quan tâm, ngạc nhiên hoặc phấn khích" }, ex: ["You have got the ", { stress: job }, "? ", { intonation: rise }], tr: { uk: "Ти отримав цю роботу?", es: "¿Conseguiste el trabajo?", pt: "Você conseguiu o emprego?", fr: "Tu as eu le poste ?", de: "Du hast den Job bekommen?", it: "Hai avuto il lavoro?", pl: "Dostałeś tę pracę?", tr: "İşi aldın mı?", id: "Kamu mendapat pekerjaan itu?", vi: "Bạn được nhận việc rồi à?" } }
          - { level: C2, pitch: { en: Low key, uk: "Низький регістр", es: "Registro bajo", pt: "Registro baixo", fr: "Registre bas", de: "Tiefe Lage", it: "Registro basso", pl: "Niski rejestr", tr: "Alçak perde", id: "Nada rendah", vi: "Giọng thấp" }, effect: { en: "finality, seriousness or calm", uk: "остаточність, серйозність або спокій", es: "carácter definitivo, seriedad o calma", pt: "caráter definitivo, seriedade ou calma", fr: "caractère définitif, sérieux ou calme", de: "Endgültigkeit, Ernst oder Ruhe", it: "definitività, serietà o calma", pl: "stanowczość, powaga lub spokój", tr: "kesinlik, ciddiyet veya sakinlik", id: "kepastian, kesungguhan, atau ketenangan", vi: "tính dứt khoát, nghiêm túc hoặc bình tĩnh" }, ex: ["That is my ", { stress: de }, "cision. ", { intonation: fall }], tr: { uk: "Це моє рішення.", es: "Esa es mi decisión.", pt: "Essa é a minha decisão.", fr: "C’est ma décision.", de: "Das ist meine Entscheidung.", it: "Questa è la mia decisione.", pl: "To moja decyzja.", tr: "Bu benim kararım.", id: "Itu keputusan saya.", vi: "Đó là quyết định của tôi." } }
          - { level: C2, pitch: { en: Wide range, uk: "Широкий діапазон", es: "Rango amplio", pt: "Extensão ampla", fr: "Étendue large", de: "Großer Umfang", it: "Estensione ampia", pl: "Szeroki zakres", tr: "Geniş aralık", id: "Rentang lebar", vi: "Quãng rộng" }, effect: { en: enthusiasm, uk: "ентузіазм", es: "entusiasmo", pt: "entusiasmo", fr: "enthousiasme", de: "Begeisterung", it: "entusiasmo", pl: "entuzjazm", tr: "coşku", id: "antusiasme", vi: "sự hào hứng" }, ex: ["It was absolutely ", { stress: won }, "derful!"], tr: { uk: "Це було просто чудово!", es: "¡Fue absolutamente maravilloso!", pt: "Foi absolutamente maravilhoso!", fr: "C’était absolument merveilleux !", de: "Es war absolut wunderbar!", it: "È stato assolutamente meraviglioso!", pl: "To było absolutnie wspaniałe!", tr: "Kesinlikle harikaydı!", id: "Itu benar-benar luar biasa!", vi: "Thật sự tuyệt vời!" } }
          - { level: C2, pitch: { en: Narrow range, uk: "Вузький діапазон", es: "Rango estrecho", pt: "Extensão estreita", fr: "Étendue étroite", de: "Kleiner Umfang", it: "Estensione stretta", pl: "Wąski zakres", tr: "Dar aralık", id: "Rentang sempit", vi: "Quãng hẹp" }, effect: { en: "boredom or restraint", uk: "нудьга або стриманість", es: "aburrimiento o reserva", pt: "tédio ou reserva", fr: "ennui ou retenue", de: "Langeweile oder Zurückhaltung", it: "noia o riservatezza", pl: "nuda lub powściągliwość", tr: "can sıkıntısı veya çekingenlik", id: "kebosanan atau sikap menahan diri", vi: "sự chán nản hoặc dè dặt" }, ex: ["It was ", { stress: fine }, "."], tr: { uk: "Було нормально.", es: "Estuvo bien.", pt: "Foi bom.", fr: "C’était bien.", de: "Es war in Ordnung.", it: "È andata bene.", pl: "Było w porządku.", tr: "İyiydi.", id: "Lumayan.", vi: "Cũng được." } }
      - type: list
        items:
          - { type: rule, level: C2, text: { en: "Key is the overall height of the voice; range is the distance between its highest and lowest notes.", uk: "Регістр — загальна висота голосу; діапазон — відстань між його найвищою й найнижчою нотами.", es: "El registro es la altura general de la voz; el rango es la distancia entre sus notas más alta y más baja.", pt: "O registro é a altura geral da voz; a extensão é a distância entre a nota mais alta e a mais baixa.", fr: "Le registre est la hauteur générale de la voix ; l’étendue est l’écart entre ses notes la plus haute et la plus basse.", de: "Die Tonhöhenlage ist die allgemeine Höhe der Stimme; der Umfang ist der Abstand zwischen höchstem und tiefstem Ton.", it: "Il registro è l'altezza generale della voce; l'estensione è la distanza fra la nota più alta e la più bassa.", pl: "Rejestr to ogólna wysokość głosu; zakres to odległość między jego najwyższą a najniższą nutą.", tr: "Perde sesin genel yüksekliğidir; aralık, en yüksek ve en alçak notalar arasındaki uzaklıktır.", id: "Tinggi nada adalah ketinggian suara secara keseluruhan; rentang adalah jarak antara nada tertinggi dan terendah.", vi: "Cao độ là độ cao chung của giọng; quãng giọng là khoảng cách giữa nốt cao nhất và thấp nhất." } }

  - title: { en: Stress shift, uk: "Зсув наголосу", es: "Cambio de acento", pt: "Deslocamento do acento", fr: "Déplacement de l’accent", de: "Betonungsverschiebung", it: "Spostamento dell'accento", pl: "Przesunięcie akcentu", tr: "Vurgu kayması", id: "Pergeseran tekanan", vi: "Dịch chuyển trọng âm" }
    role: own
    content:
      - type: comparison
        columns:
          - { key: alone, label: { en: Before a pause, uk: "Перед паузою", es: "Antes de una pausa", pt: "Antes de uma pausa", fr: "Devant une pause", de: "Vor einer Pause", it: "Prima di una pausa", pl: "Przed pauzą", tr: "Duraktan önce", id: "Sebelum jeda", vi: "Trước quãng ngắt" } }
          - { key: before, label: { en: Before a stressed syllable, uk: "Перед наголошеним складом", es: "Antes de una sílaba acentuada", pt: "Antes de uma sílaba tônica", fr: "Devant une syllabe accentuée", de: "Vor einer betonten Silbe", it: "Prima di una sillaba accentata", pl: "Przed sylabą akcentowaną", tr: "Vurgulu hecenin önünde", id: "Sebelum suku kata bertekanan", vi: "Trước âm tiết mang trọng âm" } }
        rows:
          - { level: C2, alone: { ex: ["He is thir", { stress: teen }, "."], tr: { uk: "Йому тринадцять.", es: "Tiene trece años.", pt: "Ele tem treze anos.", fr: "Il a treize ans.", de: "Er ist dreizehn.", it: "Ha tredici anni.", pl: "On ma trzynaście lat.", tr: "On üç yaşında.", id: "Dia berumur tiga belas tahun.", vi: "Cậu ấy mười ba tuổi." } }, before: { ex: [{ stress: thir }, "teen ", { stress: men }], tr: { uk: "тринадцять чоловіків", es: "trece hombres", pt: "treze homens", fr: "treize hommes", de: "dreizehn Männer", it: "tredici uomini", pl: "trzynastu mężczyzn", tr: "on üç adam", id: "tiga belas pria", vi: "mười ba người đàn ông" } } }
          - { level: C2, alone: { ex: ["She is Japa", { stress: nese }, "."], tr: { uk: "Вона японка.", es: "Ella es japonesa.", pt: "Ela é japonesa.", fr: "Elle est japonaise.", de: "Sie ist Japanerin.", it: "È giapponese.", pl: "Ona jest Japonką.", tr: "O Japonyalı.", id: "Dia orang Jepang.", vi: "Cô ấy là người Nhật." } }, before: { ex: [{ stress: Jap }, "anese ", { stress: food }], tr: { uk: "японська кухня", es: "comida japonesa", pt: "comida japonesa", fr: "cuisine japonaise", de: "japanisches Essen", it: "cibo giapponese", pl: "japońskie jedzenie", tr: "Japon yemeği", id: "makanan Jepang", vi: "đồ ăn Nhật" } } }
          - { level: C2, alone: { ex: ["It is un", { stress: known }, "."], tr: { uk: "Це невідомо.", es: "Es desconocido.", pt: "É desconhecido.", fr: "C’est inconnu.", de: "Es ist unbekannt.", it: "È sconosciuto.", pl: "To jest nieznane.", tr: "Bu bilinmiyor.", id: "Itu tidak diketahui.", vi: "Điều đó chưa được biết." } }, before: { ex: [{ stress: un }, "known ", { stress: au }, "thor"], tr: { uk: "невідомий автор", es: "autor desconocido", pt: "autor desconhecido", fr: "auteur inconnu", de: "unbekannter Autor", it: "autore sconosciuto", pl: "nieznany autor", tr: "bilinmeyen yazar", id: "penulis tidak dikenal", vi: "tác giả vô danh" } } }
      - type: list
        items:
          - { type: rule, level: C2, text: { en: "The rhythm rule: a word's stress moves to an earlier syllable before another stressed syllable.", uk: "Правило ритму: наголос слова зміщується на раніший склад перед іншим наголошеним складом.", es: "La regla del ritmo: el acento de una palabra se adelanta a una sílaba anterior ante otra sílaba acentuada.", pt: "A regra do ritmo: o acento de uma palavra passa para uma sílaba anterior diante de outra sílaba tônica.", fr: "La règle du rythme : l’accent d’un mot recule vers une syllabe antérieure devant une autre syllabe accentuée.", de: "Die Rhythmusregel: Die Betonung eines Wortes rückt vor einer weiteren betonten Silbe auf eine frühere Silbe.", it: "La regola del ritmo: l'accento di una parola si sposta su una sillaba precedente davanti a un'altra sillaba accentata.", pl: "Reguła rytmu: akcent wyrazu przesuwa się na wcześniejszą sylabę przed inną sylabą akcentowaną.", tr: "Ritim kuralı: bir sözcüğün vurgusu, vurgulu başka bir hecenin önünde daha öndeki heceye kayar.", id: "Aturan irama: tekanan sebuah kata bergeser ke suku kata yang lebih awal sebelum suku kata bertekanan lain.", vi: "Quy tắc nhịp: trọng âm của một từ dời về âm tiết đứng trước khi đi trước một âm tiết mang trọng âm khác." } }

  - title: { en: Hesitation and discourse structure, uk: "Вагання та структура дискурсу", es: "Titubeo y estructura del discurso", pt: "Hesitação e estrutura do discurso", fr: "Hésitation et structure du discours", de: "Zögern und Gesprächsstruktur", it: "Esitazione e struttura del discorso", pl: "Wahanie i struktura wypowiedzi", tr: "Duraksama ve söylem yapısı", id: "Keraguan dan struktur wacana", vi: "Ngập ngừng và cấu trúc diễn ngôn" }
    role: own
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Signal, uk: "Сигнал", es: "Señal", pt: "Sinal", fr: "Signal", de: "Signal", it: "Segnale", pl: "Sygnał", tr: "İşaret", id: "Sinyal", vi: "Tín hiệu" } }
          - { key: effect, label: { en: Effect, uk: "Ефект", es: "Efecto", pt: "Efeito", fr: "Effet", de: "Wirkung", it: "Effetto", pl: "Efekt", tr: "Etki", id: "Efek", vi: "Hiệu quả" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, signal: { en: Filler, uk: "Слово-заповнювач", es: "Relleno", pt: "Preenchedor", fr: "Mot de remplissage", de: "Füllwort", it: "Riempitivo", pl: "Wypełniacz", tr: "Dolgu sözcüğü", id: "Kata pengisi", vi: "Từ đệm" }, effect: { en: "a level tone holds the turn while you think", uk: "рівний тон утримує репліку, поки мовець думає", es: "un tono llano mantiene el turno mientras se piensa", pt: "um tom nivelado mantém o turno enquanto se pensa", fr: "un ton égal garde la parole le temps de réfléchir", de: "ein gleichbleibender Ton hält das Rederecht, solange man nachdenkt", it: "un tono piatto mantiene il turno mentre si pensa", pl: "równy ton podtrzymuje turę, dopóki się myśli", tr: "düz bir ton, düşünürken sırayı tutar", id: "nada datar mempertahankan giliran selagi berpikir", vi: "giọng đều giữ lượt lời trong lúc suy nghĩ" }, ex: ["I think, ", { target: um }, ", we should wait."], tr: { uk: "Я думаю, е-е, нам слід зачекати.", es: "Creo, eh, que deberíamos esperar.", pt: "Acho, hum, que devemos esperar.", fr: "Je pense, euh, qu’on devrait attendre.", de: "Ich denke, äh, wir sollten warten.", it: "Penso, ehm, che dovremmo aspettare.", pl: "Myślę, yyy, że powinniśmy poczekać.", tr: "Bence, ııı, beklememiz gerekiyor.", id: "Menurut saya, eh, kita sebaiknya menunggu.", vi: "Tôi nghĩ, ừm, chúng ta nên đợi." } }
          - { level: C2, signal: { en: New topic, uk: "Нова тема", es: "Tema nuevo", pt: "Novo tema", fr: "Nouveau sujet", de: "Neues Thema", it: "Nuovo argomento", pl: "Nowy temat", tr: "Yeni konu", id: "Topik baru", vi: "Chủ đề mới" }, effect: { en: "the pitch starts high again after a pause", uk: "після паузи голос знову починає з високої ноти", es: "tras la pausa, la voz vuelve a empezar alta", pt: "depois da pausa, a voz volta a começar alta", fr: "après la pause, la voix repart haut", de: "nach der Pause beginnt die Stimme wieder hoch", it: "dopo la pausa la voce riparte alta", pl: "po pauzie głos znów zaczyna wysoko", tr: "duraktan sonra ses yine yüksekten başlar", id: "setelah jeda, nada kembali dimulai tinggi", vi: "sau quãng ngắt, giọng lại bắt đầu ở mức cao" }, ex: ["That is the budget. ", { intonation: fall }, " Now, the schedule."], tr: { uk: "Це бюджет. А тепер — графік.", es: "Eso es el presupuesto. Ahora, el calendario.", pt: "Esse é o orçamento. Agora, o cronograma.", fr: "Voilà pour le budget. Passons au calendrier.", de: "Das ist das Budget. Nun zum Zeitplan.", it: "Questo è il budget. Ora, il calendario.", pl: "To jest budżet. Teraz harmonogram.", tr: "Bütçe bu kadar. Şimdi de program.", id: "Itu anggarannya. Sekarang, jadwalnya.", vi: "Đó là ngân sách. Bây giờ đến lịch trình." } }
          - { level: C2, signal: { en: ["Fall ", { intonation: fall }], uk: ["Спадний ", { intonation: "fall" }], es: ["Descendente ", { intonation: "fall" }], pt: ["Descendente ", { intonation: "fall" }], fr: ["Descendante ", { intonation: "fall" }], de: ["Fallend ", { intonation: "fall" }], it: ["Discendente ", { intonation: "fall" }], pl: ["Opadający ", { intonation: "fall" }], tr: ["İnen ", { intonation: "fall" }], id: ["Turun ", { intonation: "fall" }], vi: ["Xuống giọng ", { intonation: "fall" }] }, effect: { en: "ends the turn", uk: "закінчує репліку", es: "cierra el turno", pt: "encerra o turno", fr: "clôt le tour de parole", de: "beendet den Redebeitrag", it: "chiude il turno", pl: "kończy turę", tr: "sırayı bitirir", id: "mengakhiri giliran", vi: "kết thúc lượt lời" }, ex: ["That is all from me. ", { intonation: fall }], tr: { uk: "Це все з мого боку.", es: "Eso es todo de mi parte.", pt: "Isso é tudo da minha parte.", fr: "C’est tout de ma part.", de: "Das war alles von mir.", it: "Questo è tutto da parte mia.", pl: "To wszystko z mojej strony.", tr: "Benden bu kadar.", id: "Itu saja dari saya.", vi: "Phần của tôi đến đây là hết." } }
          - { level: C2, signal: { en: ["Rise ", { intonation: rise }], uk: ["Висхідний ", { intonation: "rise" }], es: ["Ascendente ", { intonation: "rise" }], pt: ["Ascendente ", { intonation: "rise" }], fr: ["Montante ", { intonation: "rise" }], de: ["Steigend ", { intonation: "rise" }], it: ["Ascendente ", { intonation: "rise" }], pl: ["Wznoszący ", { intonation: "rise" }], tr: ["Çıkan ", { intonation: "rise" }], id: ["Naik ", { intonation: "rise" }], vi: ["Lên giọng ", { intonation: "rise" }] }, effect: { en: "keeps the floor: more is coming", uk: "утримує слово: далі буде ще", es: "mantiene la palabra: hay más por venir", pt: "mantém a palavra: ainda vem mais", fr: "garde la parole : la suite arrive", de: "behält das Wort: es kommt noch mehr", it: "mantiene la parola: c'è ancora altro", pl: "podtrzymuje głos: będzie ciąg dalszy", tr: "söz hakkını korur: devamı var", id: "mempertahankan giliran bicara: masih ada lanjutan", vi: "giữ lượt nói: còn tiếp" }, ex: ["First we call the client, ", { intonation: rise }, " and then ", { gap: true }], tr: { uk: "Спочатку ми телефонуємо клієнту, а потім …", es: "Primero llamamos al cliente y luego …", pt: "Primeiro ligamos para o cliente e depois …", fr: "D’abord nous appelons le client, puis …", de: "Zuerst rufen wir den Kunden an, und dann …", it: "Prima chiamiamo il cliente, e poi …", pl: "Najpierw dzwonimy do klienta, a potem …", tr: "Önce müşteriyi arıyoruz, sonra da …", id: "Pertama kita menelepon klien, lalu …", vi: "Đầu tiên chúng ta gọi cho khách hàng, rồi …" } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
