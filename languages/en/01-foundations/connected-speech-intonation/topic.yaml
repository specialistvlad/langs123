mples: ["Thật không?", "Cảm ơn!"] } } }
      - type: list
        items:
          - { type: rule, level: C1, text: { en: "The tune carries the attitude, so the same words change meaning.", uk: "Тон передає ставлення, тому ті самі слова змінюють значення.", es: "El tono transmite la actitud, así que las mismas palabras cambian de significado.", pt: "O tom transmite a atitude, por isso as mesmas palavras mudam de significado.", fr: "La mélodie porte l’attitude, et les mêmes mots changent donc de sens.", de: "Der Tonverlauf trägt die Haltung, darum ändern dieselben Wörter ihre Bedeutung.", it: "Il tono porta l'atteggiamento, quindi le stesse parole cambiano significato.", pl: "Melodia niesie nastawienie, więc te same słowa zmieniają znaczenie.", tr: "Ton tutumu taşır; bu yüzden aynı sözcükler anlam değiştirir.", id: "Nada membawa sikap, sehingga kata yang sama dapat berubah makna.", vi: "Ngữ điệu mang thái độ, nên cùng một câu có thể đổi nghĩa." } }

