          - { type: rule, level: C1, text: { en: ["Before ", { term: you }, " and ", { term: your }, ", a final ", { ipa: d }, " or ", { ipa: t }, " merges with ", { ipa: j }, " into ", { ipa: dʒ }, " or ", { ipa: tʃ }, "."], uk: ["Перед ", { term: "you" }, " і ", { term: "your" }, " кінцеве ", { ipa: "d" }, " або ", { ipa: "t" }, " зливається з ", { ipa: "j" }, " в ", { ipa: "dʒ" }, " або ", { ipa: "tʃ" }, "."], es: ["Ante ", { term: "you" }, " y ", { term: "your" }, ", una ", { ipa: "d" }, " o ", { ipa: "t" }, " final se funde con ", { ipa: "j" }, " en ", { ipa: "dʒ" }, " o ", { ipa: "tʃ" }, "."], pt: ["Antes de ", { term: "you" }, " e ", { term: "your" }, ", um ", { ipa: "d" }, " ou ", { ipa: "t" }, " final se funde com ", { ipa: "j" }, " em ", { ipa: "dʒ" }, " ou ", { ipa: "tʃ" }, "."], fr: ["Devant ", { term: "you" }, " et ", { term: "your" }, ", un ", { ipa: "d" }, " ou un ", { ipa: "t" }, " final se fond avec ", { ipa: "j" }, " en ", { ipa: "dʒ" }, " ou ", { ipa: "tʃ" }, "."], de: ["Vor ", { term: "you" }, " und ", { term: "your" }, " verschmilzt ein auslautendes ", { ipa: "d" }, " oder ", { ipa: "t" }, " mit ", { ipa: "j" }, " zu ", { ipa: "dʒ" }, " oder ", { ipa: "tʃ" }, "."], it: ["Davanti a ", { term: "you" }, " e ", { term: "your" }, ", una ", { ipa: "d" }, " o ", { ipa: "t" }, " finale si fonde con ", { ipa: "j" }, " in ", { ipa: "dʒ" }, " o ", { ipa: "tʃ" }, "."], pl: ["Przed ", { term: "you" }, " i ", { term: "your" }, " końcowe ", { ipa: "d" }, " lub ", { ipa: "t" }, " zlewa się z ", { ipa: "j" }, " w ", { ipa: "dʒ" }, " lub ", { ipa: "tʃ" }, "."], tr: [{ term: "you" }, " ve ", { term: "your" }, " sözcüklerinden önce sondaki ", { ipa: "d" }, " veya ", { ipa: "t" }, ", ", { ipa: "j" }, " ile birleşip ", { ipa: "dʒ" }, " veya ", { ipa: "tʃ" }, " olur."], id: ["Sebelum ", { term: "you" }, " dan ", { term: "your" }, ", ", { ipa: "d" }, " atau ", { ipa: "t" }, " di akhir kata melebur dengan ", { ipa: "j" }, " menjadi ", { ipa: "dʒ" }, " atau ", { ipa: "tʃ" }, "."], vi: ["Trước ", { term: "you" }, " và ", { term: "your" }, ", ", { ipa: "d" }, " hoặc ", { ipa: "t" }, " ở cuối từ hòa với ", { ipa: "j" }, " thành ", { ipa: "dʒ" }, " hoặc ", { ipa: "tʃ" }, "."] } }
