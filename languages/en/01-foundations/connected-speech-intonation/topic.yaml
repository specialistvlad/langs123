        - { level: B2, point: { en: Elision and assimilation, uk: "Випадіння та асиміляція", es: "Elisión y asimilación", pt: "Elisão e assimilação", fr: "Élision et assimilation", de: "Elision und Assimilation", it: "Elisione e assimilazione", pl: "Elizja i asymilacja", tr: "Ses düşmesi ve benzeşme", id: "Pelesapan dan asimilasi", vi: "Lược âm và đồng hóa âm" }, rule: { en: "t and d drop between consonants; a final consonant matches the next", uk: "t і d випадають між приголосними; кінцевий приголосний підлаштовується під наступний", es: "t y d se pierden entre consonantes; una consonante final se adapta a la siguiente", pt: "t e d desaparecem entre consoantes; uma consoante final se ajusta à seguinte", fr: "t et d tombent entre deux consonnes ; une consonne finale s’aligne sur la suivante", de: "t und d fallen zwischen Konsonanten weg; ein Endkonsonant passt sich dem nächsten an", it: "t e d cadono tra due consonanti; una consonante finale si adatta alla successiva", pl: "t i d znikają między spółgłoskami; końcowa spółgłoska upodabnia się do następnej", tr: "t ve d ünsüzler arasında düşer; sondaki ünsüz sonrakine uyar", id: "t dan d hilang di antara konsonan; konsonan akhir menyesuaikan diri dengan konsonan berikutnya", vi: "t và d biến mất giữa các phụ âm; phụ âm cuối đổi theo phụ âm đứng sau" }, ex: { examples: [["next day ", { ipa: neks deɪ }], ["ten boys ", { ipa: tem bɔɪz }]] }, tr: { uk: { examples: ["наступного дня", "десять хлопчиків"] }, es: { examples: ["al día siguiente", "diez chicos"] }, pt: { examples: ["no dia seguinte", "dez meninos"] }, fr: { examples: ["le lendemain", "dix garçons"] }, de: { examples: ["am nächsten Tag", "zehn Jungen"] }, it: { examples: ["il giorno dopo", "dieci ragazzi"] }, pl: { examples: ["następnego dnia", "dziesięciu chłopców"] }, tr: { examples: ["ertesi gün", "on oğlan"] }, id: { examples: ["hari berikutnya", "sepuluh anak laki-laki"] }, vi: { examples: ["ngày hôm sau", "mười cậu bé"] } } }
        - { level: B2, point: { en: Intonation, uk: "Інтонація", es: "Entonación", pt: "Entonação", fr: "Intonation", de: "Intonation", it: "Intonazione", pl: "Intonacja", tr: "Tonlama", id: "Intonasi", vi: "Ngữ điệu" }, rule: { en: "falls for statements and wh-questions, rises for yes-no questions", uk: "спадає в розповідях і wh-питаннях, зростає в загальних питаннях", es: "baja en las afirmaciones y en las preguntas con wh-, sube en las preguntas de sí o no", pt: "desce nas afirmações e nas perguntas com wh-, sobe nas perguntas de sim ou não", fr: "descend dans les affirmations et les questions en wh-, monte dans les questions fermées", de: "fällt in Aussagen und wh-Fragen, steigt in Entscheidungsfragen", it: "scende nelle affermazioni e nelle domande con wh-, sale nelle domande sì o no", pl: "opada w zdaniach oznajmujących i pytaniach z wh-, wznosi się w pytaniach ogólnych", tr: "bildirme cümlelerinde ve wh- sorularında düşer, evet/hayır sorularında yükselir", id: "turun pada pernyataan dan pertanyaan wh-, naik pada pertanyaan ya atau tidak", vi: "xuống ở câu khẳng định và câu hỏi Wh-, lên ở câu hỏi có/không" }, ex: { examples: [["Where do you ", { stress: live }, "? ", { intonation: fall }], ["Do you ", { stress: live }, " here? ", { intonation: rise }]] }, tr: { uk: { examples: ["Де ти живеш?", "Ти тут живеш?"] }, es: { examples: ["¿Dónde vives?", "¿Vives aquí?"] }, pt: { examples: ["Onde você mora?", "Você mora aqui?"] }, fr: { examples: ["Où habites-tu ?", "Habites-tu ici ?"] }, de: { examples: ["Wo wohnst du?", "Wohnst du hier?"] }, it: { examples: ["Dove vivi?", "Vivi qui?"] }, pl: { examples: ["Gdzie mieszkasz?", "Czy mieszkasz tutaj?"] }, tr: { examples: ["Nerede yaşıyorsun?", "Burada mı yaşıyorsun?"] }, id: { examples: ["Di mana kamu tinggal?", "Apakah kamu tinggal di sini?"] }, vi: { examples: ["Bạn sống ở đâu?", "Bạn sống ở đây à?"] } } }
        - { level: B2, point: { en: Contrastive stress, uk: "Контрастний наголос", es: "Acento contrastivo", pt: "Acento contrastivo", fr: "Accent contrastif", de: "Kontrastbetonung", it: "Accento contrastivo", pl: "Akcent kontrastywny", tr: "Karşıtlık vurgusu", id: "Tekanan kontras", vi: "Trọng âm đối lập" }, rule: { en: "stress the word that carries the contrast", uk: "наголошуй слово, що несе протиставлення", es: "se acentúa la palabra que lleva el contraste", pt: "o acento cai na palavra que traz o contraste", fr: "on accentue le mot qui porte le contraste", de: "betont wird das Wort, das den Kontrast trägt", it: "si accentua la parola che porta il contrasto", pl: "akcentuje się wyraz niosący kontrast", tr: "karşıtlığı taşıyan sözcük vurgulanır", id: "tekanan jatuh pada kata yang membawa kontras", vi: "nhấn vào từ mang sự đối lập" }, ex: ["I didn't say ", { stress: he }, " stole her money."], tr: { uk: "Я не казав, що він украв її гроші.", es: "No dije que él le robó su dinero.", pt: "Eu não disse que ele roubou o dinheiro dela.", fr: "Je n’ai pas dit qu’il avait volé son argent.", de: "Ich habe nicht gesagt, dass er ihr Geld gestohlen hat.", it: "Non ho detto che ha rubato i suoi soldi.", pl: "Nie powiedziałem, że ukradł jej pieniądze.", tr: "Onun parasını çaldığını söylemedim.", id: "Saya tidak bilang dia mencuri uangnya.", vi: "Tôi không nói là anh ta lấy cắp tiền của cô ấy." } }
        - { level: C1, point: { en: Informal reductions, uk: "Розмовні редукції", es: "Reducciones informales", pt: "Reduções informais", fr: "Réductions familières", de: "Umgangssprachliche Verkürzungen", it: "Riduzioni informali", pl: "Redukcje potoczne", tr: "Gündelik kısaltmalar", id: "Pengurangan informal", vi: "Rút gọn thân mật" }, rule: { en: "you merges with d and t; gonna for going to; h drops", uk: "you зливається з d і t; gonna замість going to; h зникає", es: "you se funde con d y t; gonna por going to; la h se pierde", pt: "you se funde com d e t; gonna no lugar de going to; o h cai", fr: "you se fond avec d et t ; gonna pour going to ; le h tombe", de: "you verschmilzt mit d und t; gonna für going to; h fällt weg", it: "you si fonde con d e t; gonna per going to; la h cade", pl: "you zlewa się z d i t; gonna zamiast going to; h znika", tr: "you, d ve t ile kaynaşır; going to yerine gonna kullanılır; h düşer", id: "you melebur dengan d dan t; gonna untuk going to; h hilang", vi: "you hòa với d và t; gonna thay cho going to; h bị lược" }, ex: { examples: [["did you ", { target: { ipa: ˈdɪdʒuː } }], ["going to ", { target: gonna }]] }, tr: { uk: { examples: ["чи ти …", "збираюся"] }, es: { examples: ["¿tú …?", "voy a"] }, pt: { examples: ["você …?", "vou"] }, fr: { examples: ["tu … ?", "je vais"] }, de: { examples: ["hast du … ?", "ich werde"] }, it: { examples: ["hai …?", "sto per"] }, pl: { examples: ["czy ty … ?", "zamierzam"] }, tr: { examples: ["sen … mı?", "yapacağım"] }, id: { examples: ["apakah kamu …?", "akan"] }, vi: { examples: ["bạn … à?", "sắp"] } } }
        - { level: C1, point: { en: Attitude, uk: "Ставлення", es: "Actitud", pt: "Atitude", fr: "Attitude", de: "Haltung", it: "Atteggiamento", pl: "Nastawienie", tr: "Tutum", id: "Sikap", vi: "Thái độ" }, rule: { en: "the same words change meaning with the tune", uk: "ті самі слова змінюють значення залежно від тону", es: "las mismas palabras cambian de significado según el tono", pt: "as mesmas palavras mudam de significado conforme o tom", fr: "les mêmes mots changent de sens selon la mélodie", de: "dieselben Wörter ändern mit dem Tonverlauf ihre Bedeutung", it: "le stesse parole cambiano significato con il tono", pl: "te same słowa zmieniają znaczenie wraz z melodią", tr: "aynı sözcükler tona göre anlam değiştirir", id: "kata yang sama berubah makna menurut nada", vi: "cùng một câu đổi nghĩa theo ngữ điệu" }, ex: { examples: [["Really? ", { intonation: rise }], ["Really? ", { intonation: fall }, { intonation: rise }]] }, tr: { uk: { examples: ["Справді?", "Справді?"] }, es: { examples: ["¿En serio?", "¿En serio?"] }, pt: { examples: ["Sério?", "Sério?"] }, fr: { examples: ["Vraiment ?", "Vraiment ?"] }, de: { examples: ["Wirklich?", "Wirklich?"] }, it: { examples: ["Davvero?", "Davvero?"] }, pl: { examples: ["Naprawdę?", "Naprawdę?"] }, tr: { examples: ["Gerçekten mi?", "Gerçekten mi?"] }, id: { examples: ["Benarkah?", "Benarkah?"] }, vi: { examples: ["Thật không?", "Thật không?"] } } }
        - { level: C1, point: { en: Focus, uk: "Фокус", es: "Foco", pt: "Foco", fr: "Focus", de: "Fokus", it: "Focus", pl: "Fokus", tr: "Odak", id: "Fokus", vi: "Trọng tâm" }, rule: { en: "new information takes the stress; given words lose it", uk: "нова інформація отримує наголос, відомі слова його втрачають", es: "la información nueva lleva el acento; las palabras ya dadas lo pierden", pt: "a informação nova recebe o acento; as palavras já dadas o perdem", fr: "l’information nouvelle porte l’accent ; les mots déjà donnés le perdent", de: "neue Information trägt die Betonung; bereits Gegebenes verliert sie", it: "l'informazione nuova prende l'accento; le parole già date lo perdono", pl: "nowa informacja dostaje akcent; wyrazy już znane go tracą", tr: "yeni bilgi vurgu alır; bilinen sözcükler vurguyu kaybeder", id: "informasi baru menerima tekanan; kata yang sudah diketahui kehilangannya", vi: "thông tin mới mang trọng âm; từ đã biết mất trọng âm" }, ex: { exchange: ["Who broke it?", [{ stress: Tom }, " broke it."]] }, tr: { uk: "Хто це зламав? — Це зламав Том.", es: "¿Quién lo rompió? — Lo rompió Tom.", pt: "Quem quebrou isso? — O Tom quebrou.", fr: "Qui l’a cassé ? — C’est Tom qui l’a cassé.", de: "Wer hat das kaputt gemacht? — Tom hat es kaputt gemacht.", it: "Chi l'ha rotto? — L'ha rotto Tom.", pl: "Kto to zepsuł? — Tom to zepsuł.", tr: "Bunu kim kırdı? — Tom kırdı.", id: "Siapa yang merusaknya? — Tom yang merusaknya.", vi: "Ai làm hỏng nó? — Tom làm hỏng nó." } }
        - { level: C1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "statements fall; a final rise sounds like a question", uk: "розповідь спадає; підвищення в кінці звучить як питання", es: "las afirmaciones bajan; una subida final suena a pregunta", pt: "as afirmações descem; uma subida no fim soa como pergunta", fr: "les affirmations descendent ; une montée finale sonne comme une question", de: "Aussagen fallen; ein Anstieg am Ende klingt wie eine Frage", it: "le affermazioni scendono; una salita finale suona come una domanda", pl: "zdania oznajmujące opadają; wznoszenie na końcu brzmi jak pytanie", tr: "bildirme cümleleri düşer; sondaki yükselme soru gibi duyulur", id: "pernyataan turun; naik di akhir terdengar seperti pertanyaan", vi: "câu khẳng định xuống giọng; lên giọng ở cuối nghe như câu hỏi" }, ex: ["I live in Leeds. ", { target: { intonation: fall } }], tr: { uk: "Я живу в Лідсі.", es: "Vivo en Leeds.", pt: "Eu moro em Leeds.", fr: "J’habite à Leeds.", de: "Ich wohne in Leeds.", it: "Vivo a Leeds.", pl: "Mieszkam w Leeds.", tr: "Leeds’te yaşıyorum.", id: "Saya tinggal di Leeds.", vi: "Tôi sống ở Leeds." } }
        - { level: C2, point: { en: Key and turns, uk: "Регістр і репліки", es: "Registro y turnos", pt: "Registro e turnos", fr: "Registre et tours de parole", de: "Tonhöhenlage und Sprecherwechsel", it: "Registro e turni", pl: "Rejestr i tury rozmowy", tr: "Ses perdesi ve konuşma sırası", id: "Tinggi nada dan giliran bicara", vi: "Cao độ và lượt lời" }, rule: { en: "high key engages, low key closes; falls end turns, rises hold them", uk: "високий регістр залучає, низький завершує; спад закінчує репліку, підйом утримує її", es: "el registro alto implica, el bajo cierra; el descenso cierra el turno, la subida lo mantiene", pt: "o registro alto envolve, o baixo encerra; a descida encerra o turno, a subida o mantém", fr: "un registre haut engage, un registre bas clôt ; une descente termine le tour, une montée le garde", de: "hohe Lage bindet ein, tiefe Lage schließt ab; Fall beendet den Redebeitrag, Anstieg hält ihn", it: "un registro alto coinvolge, uno basso chiude; la discesa chiude il turno, la salita lo mantiene", pl: "wysoki rejestr angażuje, niski zamyka; opadanie kończy turę, wznoszenie ją podtrzymuje", tr: "yüksek perde ilgi çeker, alçak perde kapatır; düşüş sırayı bitirir, yükseliş sırayı tutar", id: "nada tinggi melibatkan, nada rendah menutup; nada turun mengakhiri giliran, nada naik mempertahankannya", vi: "giọng cao thu hút, giọng thấp khép lại; xuống giọng kết thúc lượt lời, lên giọng giữ lượt lời" }, ex: ["That is all from me. ", { intonation: fall }], tr: { uk: "Це все з мого боку.", es: "Eso es todo de mi parte.", pt: "Isso é tudo da minha parte.", fr: "C’est tout de ma part.", de: "Das war alles von mir.", it: "Questo è tutto da parte mia.", pl: "To wszystko z mojej strony.", tr: "Benden bu kadar.", id: "Itu saja dari saya.", vi: "Phần của tôi đến đây là hết." } }
        - { level: C2, point: { en: Stress shift, uk: "Зсув наголосу", es: "Cambio de acento", pt: "Deslocamento do acento", fr: "Déplacement de l’accent", de: "Betonungsverschiebung", it: "Spostamento dell'accento", pl: "Przesunięcie akcentu", tr: "Vurgu kayması", id: "Pergeseran tekanan", vi: "Dịch chuyển trọng âm" }, rule: { en: "a stress moves earlier before another stressed syllable", uk: "наголос зміщується на раніший склад перед іншим наголошеним складом", es: "el acento se adelanta antes de otra sílaba acentuada", pt: "o acento passa para uma sílaba anterior antes de outra sílaba tônica", fr: "l’accent recule vers le début du mot devant une autre syllabe accentuée", de: "die Betonung rückt vor einer weiteren betonten Silbe nach vorn", it: "l'accento si sposta verso l'inizio prima di un'altra sillaba accentata", pl: "akcent przesuwa się na wcześniejszą sylabę przed inną sylabą akcentowaną", tr: "vurgu, vurgulu başka bir hecenin önünde daha öndeki heceye kayar", id: "tekanan bergeser ke suku kata yang lebih awal sebelum suku kata bertekanan lain", vi: "trọng âm dời về âm tiết đứng trước khi đi trước một âm tiết mang trọng âm khác" }, ex: ["thir", { stress: teen }, " but ", { stress: thir }, "teen ", { stress: men }], tr: { uk: "тринадцять, але тринадцять чоловіків", es: "trece, pero trece hombres", pt: "treze, mas treze homens", fr: "treize, mais treize hommes", de: "dreizehn, aber dreizehn Männer", it: "tredici, ma tredici uomini", pl: "trzynaście, ale trzynastu mężczyzn", tr: "on üç, ama on üç adam", id: "tiga belas, tetapi tiga belas pria", vi: "mười ba, nhưng mười ba người đàn ông" } }

sections:
  - title: { en: Strong and weak forms, uk: "Сильні та слабкі форми", es: "Formas fuertes y débiles", pt: "Formas fortes e fracas", fr: "Formes fortes et faibles", de: "Starkformen und Schwachformen", it: "Forme forti e deboli", pl: "Formy mocne i słabe", tr: "Güçlü ve zayıf biçimler", id: "Bentuk kuat dan lemah", vi: "Dạng mạnh và dạng yếu" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: weak, label: { en: Weak form, uk: "Слабка форма", es: "Forma débil", pt: "Forma fraca", fr: "Forme faible", de: "Schwachform", it: "Forma debole", pl: "Forma słaba", tr: "Zayıf biçim", id: "Bentuk lemah", vi: "Dạng yếu" } }
          - { key: strong, label: { en: Strong form, uk: "Сильна форма", es: "Forma fuerte", pt: "Forma forte", fr: "Forme forte", de: "Starkform", it: "Forma forte", pl: "Forma mocna", tr: "Güçlü biçim", id: "Bentuk kuat", vi: "Dạng mạnh" } }
        rows:
          - { level: B2, value: ə, word: a, weak: { ipa: ə }, strong: { ipa: eɪ } }
          - { level: B2, value: ən, word: an, weak: { ipa: ən }, strong: { ipa: æn } }
          - { level: B2, value: ðə, word: the, weak: { ipa: ðə }, strong: { ipa: ðiː } }
          - { level: B2, value: ən, word: and, weak: { ipa: ən }, strong: { ipa: ænd } }
          - { level: B2, value: bət, word: but, weak: { ipa: bət }, strong: { ipa: bʌt } }
          - { level: B2, value: tə, word: to, weak: { ipa: tə }, strong: { ipa: tuː } }
          - { level: B2, value: əv, word: of, weak: { ipa: əv }, strong: { ipa: ɒv } }
          - { level: B2, value: fə, word: for, weak: { ipa: fə }, strong: { ipa: fɔː } }
          - { level: B2, value: frəm, word: from, weak: { ipa: frəm }, strong: { ipa: frɒm } }
          - { level: B2, value: ət, word: at, weak: { ipa: ət }, strong: { ipa: æt } }
          - { level: B2, value: kən, word: can, weak: { ipa: kən }, strong: { ipa: kæn } }
          - { level: B2, value: wəz, word: was, weak: { ipa: wəz }, strong: { ipa: wɒz } }
          - { level: B2, value: wə, word: were, weak: { ipa: wə }, strong: { ipa: wɜː } }
          - { level: B2, value: həv, word: have, weak: { ipa: həv }, strong: { ipa: hæv } }
          - { level: B2, value: həz, word: has, weak: { ipa: həz }, strong: { ipa: hæz } }
          - { level: B2, value: həd, word: had, weak: { ipa: həd }, strong: { ipa: hæd } }
          - { level: B2, value: də, word: do, weak: { ipa: də }, strong: { ipa: duː } }
          - { level: B2, value: məst, word: must, weak: { ipa: məst }, strong: { ipa: mʌst } }
          - { level: B2, value: ðə, word: there, weak: { ipa: ðə }, strong: { ipa: ðeə } }
          - { level: B2, value: ðət, word: that, weak: { ipa: ðət }, strong: { ipa: ðæt } }
          - { level: B2, value: səm, word: some, weak: { ipa: səm }, strong: { ipa: sʌm } }
          - { level: B2, value: hə, word: her, weak: { ipa: hə }, strong: { ipa: hɜː } }
          - { level: B2, value: ðəm, word: them, weak: { ipa: ðəm }, strong: { ipa: ðem } }
      - type: usage
        columns:
          - { key: use, label: { en: Where the strong form appears, uk: "Де з’являється сильна форма", es: "Dónde aparece la forma fuerte", pt: "Onde aparece a forma forte", fr: "Où apparaît la forme forte", de: "Wo die Starkform steht", it: "Dove compare la forma forte", pl: "Gdzie występuje forma mocna", tr: "Güçlü biçim nerede görünür", id: "Di mana bentuk kuat muncul", vi: "Khi nào dùng dạng mạnh" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: At the end of a clause, uk: "У кінці фрази", es: "Al final de la frase", pt: "No fim da frase", fr: "À la fin de la phrase", de: "Am Satzende", it: "Alla fine della frase", pl: "Na końcu zdania", tr: "Cümlenin sonunda", id: "Di akhir kalimat", vi: "Ở cuối câu" }, ex: { examples: [["What are you looking ", { target: at }, "?"], ["Yes, she ", { target: can }, "."]] }, tr: { uk: { examples: ["На що ти дивишся?", "Так, вона вміє."] }, es: { examples: ["¿Qué estás mirando?", "Sí, ella puede."] }, pt: { examples: ["O que você está olhando?", "Sim, ela pode."] }, fr: { examples: ["Que regardes-tu ?", "Oui, elle peut."] }, de: { examples: ["Was siehst du dir an?", "Ja, sie kann das."] }, it: { examples: ["Che cosa stai guardando?", "Sì, lei può."] }, pl: { examples: ["Na co patrzysz?", "Tak, ona może."] }, tr: { examples: ["Neye bakıyorsun?", "Evet, yapabilir."] }, id: { examples: ["Apa yang kamu lihat?", "Ya, dia bisa."] }, vi: { examples: ["Bạn đang nhìn gì vậy?", "Vâng, cô ấy có thể."] } } }
          - { level: B2, use: { en: In a contrast, uk: "У протиставленні", es: "En un contraste", pt: "Em um contraste", fr: "Dans un contraste", de: "Im Kontrast", it: "In un contrasto", pl: "W kontraście", tr: "Karşıtlıkta", id: "Dalam kontras", vi: "Trong sự đối lập" }, ex: ["It is a gift ", { target: from }, " Ana, not ", { target: for }, " her."], tr: { uk: "Це подарунок від Ани, а не для неї.", es: "Es un regalo de Ana, no para ella.", pt: "É um presente da Ana, não para ela.", fr: "C’est un cadeau d’Ana, pas pour elle.", de: "Das ist ein Geschenk von Ana, nicht für sie.", it: "È un regalo di Ana, non per lei.", pl: "To prezent od Ani, a nie dla niej.", tr: "Bu, Ana’dan bir hediye, ona değil.", id: "Ini hadiah dari Ana, bukan untuk dia.", vi: "Đây là món quà từ Ana, không phải cho cô ấy." } }
          - { level: B2, use: { en: For emphasis, uk: "Для підсилення", es: "Para enfatizar", pt: "Para dar ênfase", fr: "Pour insister", de: "Zur Betonung", it: "Per enfatizzare", pl: "Dla podkreślenia", tr: "Vurgulamak için", id: "Untuk penekanan", vi: "Để nhấn mạnh" }, ex: ["I ", { target: do }, " like it!"], tr: { uk: "Мені це справді подобається!", es: "¡Sí que me gusta!", pt: "Eu gosto, sim!", fr: "Ça me plaît vraiment !", de: "Es gefällt mir wirklich!", it: "Mi piace davvero!", pl: "Naprawdę mi się to podoba!", tr: "Gerçekten hoşuma gidiyor!", id: "Saya benar-benar menyukainya!", vi: "Tôi thực sự thích nó!" } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Inside a clause, articles, prepositions, auxiliaries, pronouns and conjunctions take their weak form.", uk: "Усередині фрази артиклі, прийменники, допоміжні дієслова, займенники й сполучники мають слабку форму.", es: "Dentro de la frase, los artículos, las preposiciones, los auxiliares, los pronombres y las conjunciones toman su forma débil.", pt: "Dentro da frase, artigos, preposições, auxiliares, pronomes e conjunções assumem a forma fraca.", fr: "À l’intérieur de la phrase, les articles, les prépositions, les auxiliaires, les pronoms et les conjonctions prennent leur forme faible.", de: "Im Satzinneren haben Artikel, Präpositionen, Hilfsverben, Pronomen und Konjunktionen ihre Schwachform.", it: "Dentro la frase, articoli, preposizioni, ausiliari, pronomi e congiunzioni prendono la forma debole.", pl: "Wewnątrz zdania przedimki, przyimki, czasowniki pomocnicze, zaimki i spójniki przyjmują formę słabą.", tr: "Cümle içinde artikeller, edatlar, yardımcı fiiller, zamirler ve bağlaçlar zayıf biçimini alır.", id: "Di dalam kalimat, artikel, preposisi, kata kerja bantu, kata ganti, dan konjungsi memakai bentuk lemahnya.", vi: "Bên trong câu, mạo từ, giới từ, trợ động từ, đại từ và liên từ đọc ở dạng yếu." } }
          - { type: rule, level: B2, text: { en: ["Before a vowel, ", { term: the }, ", ", { term: to }, " and ", { term: do }, " become ", { ipa: ðɪ }, ", ", { ipa: tʊ }, " and ", { ipa: dʊ }, "; ", { term: for }, ", ", { term: were }, " and ", { term: there }, " add ", { ipa: r }, "."], uk: ["Перед голосним ", { term: "the" }, ", ", { term: "to" }, " і ", { term: "do" }, " звучать як ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " і ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " і ", { term: "there" }, " додають ", { ipa: "r" }, "."], es: ["Delante de una vocal, ", { term: "the" }, ", ", { term: "to" }, " y ", { term: "do" }, " pasan a ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " y ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " y ", { term: "there" }, " añaden ", { ipa: "r" }, "."], pt: ["Antes de vogal, ", { term: "the" }, ", ", { term: "to" }, " e ", { term: "do" }, " passam a ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " e ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " e ", { term: "there" }, " acrescentam ", { ipa: "r" }, "."], fr: ["Devant une voyelle, ", { term: "the" }, ", ", { term: "to" }, " et ", { term: "do" }, " deviennent ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " et ", { ipa: "dʊ" }, " ; ", { term: "for" }, ", ", { term: "were" }, " et ", { term: "there" }, " ajoutent ", { ipa: "r" }, "."], de: ["Vor einem Vokal werden ", { term: "the" }, ", ", { term: "to" }, " und ", { term: "do" }, " zu ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " und ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " und ", { term: "there" }, " erhalten ein ", { ipa: "r" }, "."], it: ["Davanti a una vocale, ", { term: "the" }, ", ", { term: "to" }, " e ", { term: "do" }, " diventano ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " e ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " e ", { term: "there" }, " aggiungono ", { ipa: "r" }, "."], pl: ["Przed samogłoską ", { term: "the" }, ", ", { term: "to" }, " i ", { term: "do" }, " zmieniają się w ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " i ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " i ", { term: "there" }, " dodają ", { ipa: "r" }, "."], tr: ["Ünlüden önce ", { term: "the" }, ", ", { term: "to" }, " ve ", { term: "do" }, " sözcükleri ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " ve ", { ipa: "dʊ" }, " olur; ", { term: "for" }, ", ", { term: "were" }, " ve ", { term: "there" }, " sözcüklerine ", { ipa: "r" }, " eklenir."], id: ["Sebelum vokal, ", { term: "the" }, ", ", { term: "to" }, ", dan ", { term: "do" }, " menjadi ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, ", dan ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, ", dan ", { term: "there" }, " menambahkan ", { ipa: "r" }, "."], vi: ["Trước nguyên âm, ", { term: "the" }, ", ", { term: "to" }, " và ", { term: "do" }, " đọc thành ", { ipa: "ðɪ" }, ", ", { ipa: "tʊ" }, " và ", { ipa: "dʊ" }, "; ", { term: "for" }, ", ", { term: "were" }, " và ", { term: "there" }, " thêm ", { ipa: "r" }, "."] } }
          - { type: rule, level: B2, text: { en: ["As a conjunction, ", { term: that }, " is weak; as a demonstrative it is strong."], uk: ["Як сполучник ", { term: "that" }, " слабкий; як вказівний займенник він сильний."], es: ["Como conjunción, ", { term: "that" }, " es débil; como demostrativo, es fuerte."], pt: ["Como conjunção, ", { term: "that" }, " é fraco; como demonstrativo, é forte."], fr: ["Comme conjonction, ", { term: "that" }, " est faible ; comme démonstratif, il est fort."], de: ["Als Konjunktion ist ", { term: "that" }, " schwach, als Demonstrativum stark."], it: ["Come congiunzione, ", { term: "that" }, " è debole; come dimostrativo è forte."], pl: ["Jako spójnik ", { term: "that" }, " jest słabe; jako zaimek wskazujący jest mocne."], tr: ["Bağlaç olarak ", { term: "that" }, " zayıftır; işaret sözcüğü olarak güçlüdür."], id: ["Sebagai konjungsi, ", { term: "that" }, " lemah; sebagai kata tunjuk, bentuknya kuat."], vi: ["Là liên từ, ", { term: "that" }, " đọc yếu; là từ chỉ định, nó đọc mạnh."] }, ex: { examples: [["I know ", { target: that }, " she is right."], [{ target: That }, " one is mine."]] }, tr: { uk: { examples: ["Я знаю, що вона права.", "Той — мій."] }, es: { examples: ["Sé que ella tiene razón.", "Ese es mío."] }, pt: { examples: ["Eu sei que ela tem razão.", "Aquele é meu."] }, fr: { examples: ["Je sais qu’elle a raison.", "Celui-là est à moi."] }, de: { examples: ["Ich weiß, dass sie recht hat.", "Das da gehört mir."] }, it: { examples: ["So che ha ragione.", "Quello è mio."] }, pl: { examples: ["Wiem, że ona ma rację.", "Tamten jest mój."] }, tr: { examples: ["Onun haklı olduğunu biliyorum.", "Şu benim."] }, id: { examples: ["Saya tahu bahwa dia benar.", "Yang itu milik saya."] }, vi: { examples: ["Tôi biết rằng cô ấy đúng.", "Cái đó là của tôi."] } } }
          - { type: rule, level: B2, text: { en: ["In ", { term: there is }, ", ", { term: there }, " is weak; as a word for a place it is strong."], uk: ["У ", { term: "there is" }, " слово ", { term: "there" }, " слабке; як слово на позначення місця воно сильне."], es: ["En ", { term: "there is" }, ", ", { term: "there" }, " es débil; como palabra de lugar, es fuerte."], pt: ["Em ", { term: "there is" }, ", ", { term: "there" }, " é fraco; como palavra de lugar, é forte."], fr: ["Dans ", { term: "there is" }, ", ", { term: "there" }, " est faible ; comme mot de lieu, il est fort."], de: ["In ", { term: "there is" }, " ist ", { term: "there" }, " schwach; als Ortswort ist es stark."], it: ["In ", { term: "there is" }, ", ", { term: "there" }, " è debole; come parola di luogo è forte."], pl: ["W ", { term: "there is" }, " wyraz ", { term: "there" }, " jest słaby; jako określenie miejsca jest mocny."], tr: [{ term: "there is" }, " yapısında ", { term: "there" }, " zayıftır; yer bildiren sözcük olarak güçlüdür."], id: ["Dalam ", { term: "there is" }, ", ", { term: "there" }, " lemah; sebagai kata tempat, bentuknya kuat."], vi: ["Trong ", { term: "there is" }, ", ", { term: "there" }, " đọc yếu; là từ chỉ nơi chốn, nó đọc mạnh."] }, ex: ["There is a bus stop over ", { target: there }, "."], tr: { uk: "Там є автобусна зупинка.", es: "Hay una parada de autobús allá.", pt: "Tem um ponto de ônibus ali.", fr: "Il y a un arrêt de bus là-bas.", de: "Dort drüben ist eine Bushaltestelle.", it: "Laggiù c'è una fermata dell'autobus.", pl: "Tam jest przystanek autobusowy.", tr: "Şurada bir otobüs durağı var.", id: "Ada halte bus di sana.", vi: "Ở đằng kia có một trạm xe buýt." } }
          - { type: note, level: B2, variety: en-US, text: { en: ["In US English the strong forms of ", { term: was }, ", ", { term: of }, " and ", { term: from }, " have ", { ipa: ʌ }, " in place of ", { ipa: ɒ }, "."], uk: ["В американській англійській сильні форми ", { term: "was" }, ", ", { term: "of" }, " і ", { term: "from" }, " мають ", { ipa: "ʌ" }, " замість ", { ipa: "ɒ" }, "."], es: ["En el inglés estadounidense, las formas fuertes de ", { term: "was" }, ", ", { term: "of" }, " y ", { term: "from" }, " tienen ", { ipa: "ʌ" }, " en lugar de ", { ipa: "ɒ" }, "."], pt: ["No inglês americano, as formas fortes de ", { term: "was" }, ", ", { term: "of" }, " e ", { term: "from" }, " têm ", { ipa: "ʌ" }, " no lugar de ", { ipa: "ɒ" }, "."], fr: ["En anglais américain, les formes fortes de ", { term: "was" }, ", ", { term: "of" }, " et ", { term: "from" }, " ont ", { ipa: "ʌ" }, " au lieu de ", { ipa: "ɒ" }, "."], de: ["Im amerikanischen Englisch haben die Starkformen von ", { term: "was" }, ", ", { term: "of" }, " und ", { term: "from" }, " ", { ipa: "ʌ" }, " statt ", { ipa: "ɒ" }, "."], it: ["Nell'inglese americano le forme forti di ", { term: "was" }, ", ", { term: "of" }, " e ", { term: "from" }, " hanno ", { ipa: "ʌ" }, " al posto di ", { ipa: "ɒ" }, "."], pl: ["W amerykańskiej angielszczyźnie mocne formy ", { term: "was" }, ", ", { term: "of" }, " i ", { term: "from" }, " mają ", { ipa: "ʌ" }, " zamiast ", { ipa: "ɒ" }, "."], tr: ["Amerikan İngilizcesinde ", { term: "was" }, ", ", { term: "of" }, " ve ", { term: "from" }, " sözcüklerinin güçlü biçimlerinde ", { ipa: "ɒ" }, " yerine ", { ipa: "ʌ" }, " bulunur."], id: ["Dalam bahasa Inggris Amerika, bentuk kuat ", { term: "was" }, ", ", { term: "of" }, ", dan ", { term: "from" }, " memakai ", { ipa: "ʌ" }, " sebagai pengganti ", { ipa: "ɒ" }, "."], vi: ["Trong tiếng Anh Mỹ, dạng mạnh của ", { term: "was" }, ", ", { term: "of" }, " và ", { term: "from" }, " dùng ", { ipa: "ʌ" }, " thay cho ", { ipa: "ɒ" }, "."] } }
          - { type: note, level: B2, text: { en: ["The IPA symbols are set out in ", { link: Sounds and IPA, to: en.foundations.pronunciation-ipa }, "."], uk: ["Символи МФА подано в темі ", { link: "Звуки та МФА", to: en.foundations.pronunciation-ipa }, "."], es: ["Los símbolos del AFI se presentan en ", { link: "Sonidos y AFI", to: en.foundations.pronunciation-ipa }, "."], pt: ["Os símbolos do AFI estão em ", { link: "Sons e AFI", to: en.foundations.pronunciation-ipa }, "."], fr: ["Les symboles de l’API sont présentés dans ", { link: "Sons et API", to: en.foundations.pronunciation-ipa }, "."], de: ["Die IPA-Symbole stehen in ", { link: "Laute und IPA", to: en.foundations.pronunciation-ipa }, "."], it: ["I simboli dell'AFI sono presentati in ", { link: "Suoni e AFI", to: en.foundations.pronunciation-ipa }, "."], pl: ["Symbole IPA przedstawia temat ", { link: "Dźwięki i IPA", to: en.foundations.pronunciation-ipa }, "."], tr: ["IPA simgeleri ", { link: "Sesler ve IPA", to: en.foundations.pronunciation-ipa }, " konusunda anlatılır."], id: ["Simbol AFI dijelaskan di ", { link: "Bunyi dan AFI", to: en.foundations.pronunciation-ipa }, "."], vi: ["Các ký hiệu IPA được trình bày trong ", { link: "Âm và IPA", to: en.foundations.pronunciation-ipa }, "."] } }

  - title: { en: Sentence stress and rhythm, uk: "Наголос у реченні та ритм", es: "Acento de la oración y ritmo", pt: "Acento da frase e ritmo", fr: "Accent de phrase et rythme", de: "Satzbetonung und Rhythmus", it: "Accento di frase e ritmo", pl: "Akcent zdaniowy i rytm", tr: "Cümle vurgusu ve ritim", id: "Tekanan kalimat dan irama", vi: "Trọng âm câu và nhịp điệu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: words, label: { en: Words, uk: "Слова", es: "Palabras", pt: "Palavras", fr: "Mots", de: "Wörter", it: "Parole", pl: "Słowa", tr: "Sözcükler", id: "Kata", vi: "Từ" } }
          - { key: stress, label: { en: In the sentence, uk: "У реченні", es: "En la oración", pt: "Na frase", fr: "Dans la phrase", de: "Im Satz", it: "Nella frase", pl: "W zdaniu", tr: "Cümlede", id: "Dalam kalimat", vi: "Trong câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, words: { en: "Nouns, main verbs, adjectives and adverbs", uk: "Іменники, повнозначні дієслова, прикметники й прислівники", es: "Sustantivos, verbos principales, adjetivos y adverbios", pt: "Substantivos, verbos principais, adjetivos e advérbios", fr: "Noms, verbes principaux, adjectifs et adverbes", de: "Nomen, Vollverben, Adjektive und Adverbien", it: "Sostantivi, verbi principali, aggettivi e avverbi", pl: "Rzeczowniki, czasowniki główne, przymiotniki i przysłówki", tr: "İsimler, ana fiiller, sıfatlar ve zarflar", id: "Kata benda, kata kerja utama, kata sifat, dan kata keterangan", vi: "Danh từ, động từ chính, tính từ và trạng từ" }, stress: { en: stressed, uk: "наголошені", es: "acentuadas", pt: "acentuadas", fr: "accentués", de: "betont", it: "accentate", pl: "akcentowane", tr: "vurgulu", id: "bertekanan", vi: "mang trọng âm" }, ex: ["The ", { stress: chil }, "dren ", { stress: want }, " to ", { stress: go }, " to the ", { stress: park }, "."], tr: { uk: "Діти хочуть піти в парк.", es: "Los niños quieren ir al parque.", pt: "As crianças querem ir ao parque.", fr: "Les enfants veulent aller au parc.", de: "Die Kinder wollen in den Park gehen.", it: "I bambini vogliono andare al parco.", pl: "Dzieci chcą iść do parku.", tr: "Çocuklar parka gitmek istiyor.", id: "Anak-anak ingin pergi ke taman.", vi: "Bọn trẻ muốn đi đến công viên." } }
          - { level: B2, words: { en: "Question words, negatives, demonstratives and numbers", uk: "Питальні слова, заперечення, вказівні слова й числівники", es: "Palabras interrogativas, negaciones, demostrativos y numerales", pt: "Palavras interrogativas, negações, demonstrativos e numerais", fr: "Mots interrogatifs, négations, démonstratifs et nombres", de: "Fragewörter, Verneinungen, Demonstrativa und Zahlen", it: "Parole interrogative, negazioni, dimostrativi e numeri", pl: "Wyrazy pytajne, przeczenia, zaimki wskazujące i liczebniki", tr: "Soru sözcükleri, olumsuzluklar, işaret sözcükleri ve sayılar", id: "Kata tanya, kata negasi, kata tunjuk, dan bilangan", vi: "Từ để hỏi, từ phủ định, từ chỉ định và số từ" }, stress: { en: stressed, uk: "наголошені", es: "acentuadas", pt: "acentuadas", fr: "accentués", de: "betont", it: "accentate", pl: "akcentowane", tr: "vurgulu", id: "bertekanan", vi: "mang trọng âm" }, ex: ["I ", { stress: don't }, " ", { stress: know }, " ", { stress: where }, " he ", { stress: lives }, "."], tr: { uk: "Я не знаю, де він живе.", es: "No sé dónde vive.", pt: "Eu não sei onde ele mora.", fr: "Je ne sais pas où il habite.", de: "Ich weiß nicht, wo er wohnt.", it: "Non so dove abita.", pl: "Nie wiem, gdzie on mieszka.", tr: "Nerede yaşadığını bilmiyorum.", id: "Saya tidak tahu di mana dia tinggal.", vi: "Tôi không biết anh ấy sống ở đâu." } }
          - { level: B2, words: { en: "Articles, prepositions, auxiliaries, pronouns and conjunctions", uk: "Артиклі, прийменники, допоміжні дієслова, займенники й сполучники", es: "Artículos, preposiciones, auxiliares, pronombres y conjunciones", pt: "Artigos, preposições, auxiliares, pronomes e conjunções", fr: "Articles, prépositions, auxiliaires, pronoms et conjonctions", de: "Artikel, Präpositionen, Hilfsverben, Pronomen und Konjunktionen", it: "Articoli, preposizioni, ausiliari, pronomi e congiunzioni", pl: "Przedimki, przyimki, czasowniki pomocnicze, zaimki i spójniki", tr: "Artikeller, edatlar, yardımcı fiiller, zamirler ve bağlaçlar", id: "Artikel, preposisi, kata kerja bantu, kata ganti, dan konjungsi", vi: "Mạo từ, giới từ, trợ động từ, đại từ và liên từ" }, stress: { en: weak, uk: "слабкі", es: "débiles", pt: "fracas", fr: "faibles", de: "schwach", it: "deboli", pl: "słabe", tr: "zayıf", id: "lemah", vi: "đọc yếu" }, ex: ["The children want to go to the park. ", { ipa: ðə ˈtʃɪldrən ˈwɒnt tə ˈgəʊ tə ðə ˈpɑːk }], tr: { uk: "Діти хочуть піти в парк.", es: "Los niños quieren ir al parque.", pt: "As crianças querem ir ao parque.", fr: "Les enfants veulent aller au parc.", de: "Die Kinder wollen in den Park gehen.", it: "I bambini vogliono andare al parco.", pl: "Dzieci chcą iść do parku.", tr: "Çocuklar parka gitmek istiyor.", id: "Anak-anak ingin pergi ke taman.", vi: "Bọn trẻ muốn đi đến công viên." } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "Stressed syllables come at regular beats; the unstressed syllables between them are said faster and shorter.", uk: "Наголошені склади йдуть через рівні проміжки; ненаголошені склади між ними вимовляються швидше й коротше.", es: "Las sílabas acentuadas llegan a intervalos regulares; las átonas entre ellas se dicen más rápido y más cortas.", pt: "As sílabas tônicas vêm em intervalos regulares; as átonas entre elas são ditas mais rápido e mais curtas.", fr: "Les syllabes accentuées reviennent à intervalles réguliers ; les syllabes inaccentuées entre elles se disent plus vite et plus brièvement.", de: "Betonte Silben kommen in regelmäßigen Abständen; die unbetonten Silben dazwischen werden schneller und kürzer gesprochen.", it: "Le sillabe accentate cadono a intervalli regolari; le sillabe atone fra di esse si pronunciano più in fretta e più brevi.", pl: "Sylaby akcentowane padają w równych odstępach; sylaby nieakcentowane między nimi wymawia się szybciej i krócej.", tr: "Vurgulu heceler düzenli aralıklarla gelir; aradaki vurgusuz heceler daha hızlı ve daha kısa söylenir.", id: "Suku kata bertekanan muncul dalam ketukan yang teratur; suku kata tanpa tekanan di antaranya diucapkan lebih cepat dan lebih pendek.", vi: "Các âm tiết mang trọng âm xuất hiện theo nhịp đều; những âm tiết không mang trọng âm ở giữa được đọc nhanh hơn và ngắn hơn." } }
          - { type: rule, level: B2, text: { en: "Sentences with the same number of stresses take about the same time.", uk: "Речення з однаковою кількістю наголосів займають приблизно однаковий час.", es: "Las oraciones con el mismo número de acentos duran casi lo mismo.", pt: "Frases com o mesmo número de acentos levam quase o mesmo tempo.", fr: "Les phrases qui ont le même nombre d’accents durent à peu près le même temps.", de: "Sätze mit gleich vielen Betonungen dauern ungefähr gleich lang.", it: "Le frasi con lo stesso numero di accenti durano all'incirca lo stesso tempo.", pl: "Zdania z taką samą liczbą akcentów trwają mniej więcej tyle samo.", tr: "Vurgu sayısı aynı olan cümleler yaklaşık aynı sürede söylenir.", id: "Kalimat dengan jumlah tekanan yang sama membutuhkan waktu yang hampir sama.", vi: "Những câu có cùng số trọng âm mất khoảng thời gian gần bằng nhau." }, ex: { examples: [[{ stress: Dogs }, " ", { stress: eat }, " ", { stress: bones }, "."], ["The ", { stress: dogs }, " are ", { stress: eat }, "ing the ", { stress: bones }, "."]] }, tr: { uk: { examples: ["Собаки їдять кістки.", "Собаки зараз їдять кістки."] }, es: { examples: ["Los perros comen huesos.", "Los perros se están comiendo los huesos."] }, pt: { examples: ["Cães comem ossos.", "Os cães estão comendo os ossos."] }, fr: { examples: ["Les chiens mangent des os.", "Les chiens sont en train de manger les os."] }, de: { examples: ["Hunde fressen Knochen.", "Die Hunde fressen gerade die Knochen."] }, it: { examples: ["I cani mangiano ossa.", "I cani stanno mangiando le ossa."] }, pl: { examples: ["Psy jedzą kości.", "Psy jedzą teraz te kości."] }, tr: { examples: ["Köpekler kemik yer.", "Köpekler kemikleri yiyor."] }, id: { examples: ["Anjing makan tulang.", "Anjing-anjing itu sedang memakan tulang-tulang itu."] }, vi: { examples: ["Chó ăn xương.", "Những con chó đang ăn những khúc xương."] } } }

