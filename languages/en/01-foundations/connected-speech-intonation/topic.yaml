          - { level: B2, link: { en: Glide w, uk: "Перехідний w", es: "w de transición", pt: "w de transição", fr: "w de transition", de: "Gleit-w", it: "w di transizione", pl: "w przejściowe", tr: "Geçiş sesi w", id: "w peralihan", vi: "Âm lướt w" }, rule: { en: [{ ipa: w }, " joins ", { ipa: uː }, ", ", { ipa: əʊ }, " and ", { ipa: aʊ }, " to a vowel"], uk: [{ ipa: "w" }, " з’єднує ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " і ", { ipa: "aʊ" }, " з наступним голосним"], es: [{ ipa: "w" }, " une ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " y ", { ipa: "aʊ" }, " con una vocal"], pt: [{ ipa: "w" }, " liga ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " e ", { ipa: "aʊ" }, " a uma vogal"], fr: [{ ipa: "w" }, " relie ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " et ", { ipa: "aʊ" }, " à une voyelle"], de: [{ ipa: "w" }, " verbindet ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " und ", { ipa: "aʊ" }, " mit einem Vokal"], it: [{ ipa: "w" }, " collega ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " e ", { ipa: "aʊ" }, " a una vocale"], pl: [{ ipa: "w" }, " łączy ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " i ", { ipa: "aʊ" }, " z samogłoską"], tr: [{ ipa: "w" }, ", ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " ve ", { ipa: "aʊ" }, " seslerini bir ünlüye bağlar"], id: [{ ipa: "w" }, " menghubungkan ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, ", dan ", { ipa: "aʊ" }, " dengan vokal"], vi: [{ ipa: "w" }, " nối ", { ipa: "uː" }, ", ", { ipa: "əʊ" }, " và ", { ipa: "aʊ" }, " với một nguyên âm"] }, ex: { examples: [["go on ", { ipa: gəʊ.wɒn }], ["how about ", { ipa: ˌhaʊ.wəˈbaʊt }]] }, tr: { uk: { examples: ["продовжуй", "а як щодо …"] }, es: { examples: ["sigue", "¿qué tal …?"] }, pt: { examples: ["continue", "que tal …"] }, fr: { examples: ["continue", "et si …"] }, de: { examples: ["mach weiter", "wie wäre es mit …"] }, it: { examples: ["continua", "che ne dici di …"] }, pl: { examples: ["kontynuuj", "co powiesz na …"] }, tr: { examples: ["devam et", "… ne dersin"] }, id: { examples: ["lanjutkan", "bagaimana kalau …"] }, vi: { examples: ["tiếp tục đi", "còn … thì sao"] } } }
      - type: list
        items:
          - { type: rule, level: B2, text: { en: "In IPA, a dot marks a syllable break.", uk: "У МФА крапка позначає межу складів.", es: "En el AFI, un punto marca el límite entre sílabas.", pt: "No AFI, um ponto marca a divisão de sílabas.", fr: "En API, un point marque la coupure entre deux syllabes.", de: "In der IPA markiert ein Punkt eine Silbengrenze.", it: "Nell'AFI un punto segna il confine tra sillabe.", pl: "W IPA kropka oznacza granicę sylab.", tr: "IPA’da nokta hece sınırını gösterir.", id: "Dalam AFI, titik menandai batas suku kata.", vi: "Trong IPA, dấu chấm đánh dấu ranh giới âm tiết." } }
          - { type: note, level: B2, variety: en-US, text: { en: "US English pronounces every r, so it has no linking r and no intrusive r.", uk: "В американській англійській вимовляється кожне r, тож зв’язувального й вставного r там немає.", es: "El inglés estadounidense pronuncia todas las r, así que no tiene r de enlace ni r intrusiva.", pt: "O inglês americano pronuncia todos os r, então não tem r de ligação nem r intrusivo.", fr: "L’anglais américain prononce tous les r : il n’a ni r de liaison ni r intrusif.", de: "Das amerikanische Englisch spricht jedes r, daher gibt es kein Bindungs-r und kein intrusives r.", it: "L'inglese americano pronuncia ogni r, quindi non ha né r di collegamento né r intrusiva.", pl: "Amerykańska angielszczyzna wymawia każde r, więc nie ma r łączącego ani r wtrąconego.", tr: "Amerikan İngilizcesi her r’yi okur; bu yüzden bağlayıcı r ve araya giren r yoktur.", id: "Bahasa Inggris Amerika mengucapkan setiap r, jadi tidak ada r penyambung dan r sisipan.", vi: "Tiếng Anh Mỹ phát âm mọi chữ r, nên không có r nối và r chen vào." } }
          - { type: note, level: B2, variety: en-US, text: { en: ["Between vowels US English says t as a flap ", { ipa: ɾ }, ", so ", { term: get it }, " is ", { ipa: ˈgeɾɪt }, "."], uk: ["Між голосними в американській англійській t звучить як одноударний ", { ipa: "ɾ" }, ", тож ", { term: "get it" }, " вимовляється ", { ipa: "ˈgeɾɪt" }, "."], es: ["Entre vocales, el inglés estadounidense dice la t como vibrante simple ", { ipa: "ɾ" }, "; así, ", { term: "get it" }, " se pronuncia ", { ipa: "ˈgeɾɪt" }, "."], pt: ["Entre vogais, o inglês americano pronuncia o t como tepe ", { ipa: "ɾ" }, ", então ", { term: "get it" }, " soa ", { ipa: "ˈgeɾɪt" }, "."], fr: ["Entre deux voyelles, l’anglais américain prononce le t comme une battue ", { ipa: "ɾ" }, " : ", { term: "get it" }, " se dit donc ", { ipa: "ˈgeɾɪt" }, "."], de: ["Zwischen Vokalen spricht das amerikanische Englisch t als Flap ", { ipa: "ɾ" }, "; ", { term: "get it" }, " klingt also ", { ipa: "ˈgeɾɪt" }, "."], it: ["Tra vocali l'inglese americano pronuncia la t come vibrante ", { ipa: "ɾ" }, ", quindi ", { term: "get it" }, " si legge ", { ipa: "ˈgeɾɪt" }, "."], pl: ["Między samogłoskami amerykańska angielszczyzna wymawia t jako klapnięcie ", { ipa: "ɾ" }, ", więc ", { term: "get it" }, " brzmi ", { ipa: "ˈgeɾɪt" }, "."], tr: ["Amerikan İngilizcesi ünlüler arasında t’yi çarpma sesi ", { ipa: "ɾ" }, " olarak söyler; bu yüzden ", { term: "get it" }, " sözcüğü ", { ipa: "ˈgeɾɪt" }, " olur."], id: ["Di antara dua vokal, bahasa Inggris Amerika mengucapkan t sebagai bunyi sentuh ", { ipa: "ɾ" }, ", sehingga ", { term: "get it" }, " dibaca ", { ipa: "ˈgeɾɪt" }, "."], vi: ["Giữa hai nguyên âm, tiếng Anh Mỹ đọc t thành âm vỗ ", { ipa: "ɾ" }, ", nên ", { term: "get it" }, " đọc là ", { ipa: "ˈgeɾɪt" }, "."] } }

