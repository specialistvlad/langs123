title: { en: The Alphabet, uk: Алфавіт, es: El alfabeto }
summary:
  lead:
    en: "The 26 letters of the English alphabet and their names, used to spell words aloud."
    uk: "В англійському алфавіті 26 літер; за їхніми назвами слова диктують по літерах."
    es: "Las 26 letras del alfabeto inglés y sus nombres, que sirven para deletrear palabras en voz alta."
  rule:
    en: ["A letter's name differs from its sound in a word: ", { letter: A }, " is said ", { ipa: eɪ }, ", but ", { term: [{ letter: a }, pple] }, " starts with ", { ipa: æ }, "."]
    uk: ["Назва літери відрізняється від її звука в слові: ", { letter: A }, " називається ", { ipa: eɪ }, ", але ", { term: [{ letter: a }, pple] }, " починається зі звука ", { ipa: æ }, "."]
    es: ["El nombre de una letra difiere de su sonido en una palabra: ", { letter: A }, " se dice ", { ipa: eɪ }, ", pero ", { term: [{ letter: a }, pple] }, " empieza con ", { ipa: æ }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A0, point: { en: 26 letters, uk: "26 літер", es: "26 letras" }, rule: { en: ["vowels ", { letter: "a, e, i, o, u" }, "; 21 consonants; ", { letter: "y" }, " works as both"], uk: ["голосні ", { letter: "a, e, i, o, u" }, "; приголосних 21; ", { letter: "y" }, " буває і голосною, і приголосною"], es: ["vocales ", { letter: "a, e, i, o, u" }, "; 21 consonantes; ", { letter: "y" }, " funciona como ambas"] }, ex: { examples: [[{ target: { letter: "y" } }, es], [m, { target: { letter: "y" } }]] }, tr: { uk: { examples: ["так", "мій"] }, es: { examples: ["sí", "mi"] } } }
        - { level: A0, point: { letter: A H J K }, rule: { en: ["names have the sound ", { ipa: eɪ }], uk: ["назви мають звук ", { ipa: eɪ }], es: ["los nombres tienen el sonido ", { ipa: eɪ }] }, ex: { examples: [[{ letter: H }, " ", { target: { ipa: eɪtʃ } }], [{ letter: J }, " ", { target: { ipa: dʒeɪ } }], [{ letter: K }, " ", { target: { ipa: keɪ } }]] }, tr: { uk: { examples: ["ейч", "джей", "кей"] }, es: { examples: ["eich", "yei", "kei"] } } }
        - { level: A0, point: { letter: B C D E G P T V }, rule: { en: ["names end in ", { ipa: iː }], uk: ["назви закінчуються на ", { ipa: iː }], es: ["los nombres terminan en ", { ipa: iː }] }, ex: { examples: [[{ letter: B }, " ", { target: { ipa: biː } }], [{ letter: C }, " ", { target: { ipa: siː } }], [{ letter: T }, " ", { target: { ipa: tiː } }]] }, tr: { uk: { examples: ["бі", "сі", "ті"] }, es: { examples: ["bi", "si", "ti"] } } }
        - { level: A0, point: { letter: F L M N S X }, rule: { en: ["names start with ", { ipa: e }], uk: ["назви починаються зі звука ", { ipa: e }], es: ["los nombres empiezan con ", { ipa: e }] }, ex: { examples: [[{ letter: F }, " ", { target: { ipa: ef } }], [{ letter: M }, " ", { target: { ipa: em } }], [{ letter: X }, " ", { target: { ipa: eks } }]] }, tr: { uk: { examples: ["еф", "ем", "екс"] }, es: { examples: ["ef", "em", "eks"] } } }
        - { level: A0, point: { letter: I Y }, rule: { en: ["names end in ", { ipa: aɪ }], uk: ["назви закінчуються на ", { ipa: aɪ }], es: ["los nombres terminan en ", { ipa: aɪ }] }, ex: { examples: [[{ letter: I }, " ", { target: { ipa: aɪ } }], [{ letter: Y }, " ", { target: { ipa: waɪ } }]] }, tr: { uk: { examples: ["ай", "вай"] }, es: { examples: ["ai", "uai"] } } }
        - { level: A0, point: { letter: O R Z }, rule: { en: each name is its own, uk: "кожна назва звучить по-своєму", es: "cada nombre es distinto" }, ex: { examples: [[{ letter: O }, " ", { target: { ipa: əʊ } }], [{ letter: R }, " ", { target: { ipa: ɑː } }], [{ letter: Z }, " ", { target: { ipa: zed } }]] }, tr: { uk: { examples: ["оу", "ар", "зед"] }, es: { examples: ["ou", "ar", "zed"] } } }
        - { level: A0, point: { letter: Q U W }, rule: { en: ["names end in ", { ipa: juː }, "; W is ", { term: double U }], uk: ["назви закінчуються на ", { ipa: juː }, "; W — ", { term: double U }], es: ["los nombres terminan en ", { ipa: juː }, "; W es ", { term: double U }] }, ex: { examples: [[{ letter: Q }, " ", { target: { ipa: kjuː } }], [{ letter: U }, " ", { target: { ipa: juː } }], [{ letter: W }, " ", { target: { ipa: ˈdʌbəljuː } }]] }, tr: { uk: { examples: ["к’ю", "ю", "дабл-ю"] }, es: { examples: ["kiu", "iu", "dabliu"] } } }
        - { level: A0, point: { en: Name and sound, uk: "Назва і звук", es: "Nombre y sonido" }, rule: { en: a letter's name can differ from its sound in a word, uk: "назва літери може відрізнятися від її звука в слові", es: "el nombre de una letra puede diferir de su sonido en una palabra" }, ex: { contrast: [[{ letter: A }, " ", { ipa: eɪ }], [{ letter: a }, "pple ", { target: { ipa: æ } }]] }, tr: { uk: "яблуко", es: "manzana" } }
        - { level: A0, point: US, rule: { en: ["Z is ", { ipa: ziː }, " and R is ", { ipa: ɑːr }], uk: ["Z читається ", { ipa: ziː }, ", а R — ", { ipa: ɑːr }], es: ["Z se dice ", { ipa: ziː }, " y R se dice ", { ipa: ɑːr }] }, ex: { examples: [[{ letter: Z }, " ", { target: { ipa: ziː } }], [{ letter: R }, " ", { target: { ipa: ɑːr } }]] }, variety: en-US, tr: { uk: { examples: ["зі", "ар"] }, es: { examples: ["zi", "ar"] } } }
        - { level: A0, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: the name's vowel tells G from J and E from I, uk: "голосний у назві відрізняє G від J і E від I", es: "la vocal del nombre distingue G de J y E de I" }, ex: { examples: [[{ letter: G }, " ", { target: { ipa: dʒiː } }], [{ letter: J }, " ", { target: { ipa: dʒeɪ } }], [{ letter: E }, " ", { target: { ipa: iː } }], [{ letter: I }, " ", { target: { ipa: aɪ } }]] }, tr: { uk: { examples: ["джі", "джей", "і", "ай"] }, es: { examples: ["yi", "yei", "i", "ai"] } } }

