summary:
  lead:
    en: "The 26 letters of the English alphabet and their names, used to spell words aloud."
    uk: "В англійському алфавіті 26 літер; за їхніми назвами слова диктують по літерах."
    es: "Las 26 letras del alfabeto inglés y sus nombres, que sirven para deletrear palabras en voz alta."
    pt: "As 26 letras do alfabeto inglês e seus nomes, usados para soletrar palavras em voz alta."
    fr: "Les 26 lettres de l’alphabet anglais et leurs noms, qui servent à épeler des mots à voix haute."
    de: "Die 26 Buchstaben des englischen Alphabets und ihre Namen, mit denen man Wörter laut buchstabiert."
    it: "Le 26 lettere dell'alfabeto inglese e i loro nomi, usati per dire le parole lettera per lettera."
    pl: "Alfabet angielski ma 26 liter; ich nazwy służą do literowania słów na głos."
    tr: "İngiliz alfabesinin 26 harfi ve adları; sözcükleri sesli olarak harf harf söylemek için kullanılır."
    id: "Alfabet bahasa Inggris memiliki 26 huruf; namanya dipakai untuk mengeja kata secara lisan."
    vi: "Bảng chữ cái tiếng Anh có 26 chữ cái, mỗi chữ có một tên riêng dùng để đánh vần từ thành tiếng."
  rule:
    en: ["A letter's name differs from its sound in a word: ", { letter: A }, " is said ", { ipa: eɪ }, ", but ", { term: [{ letter: a }, pple] }, " starts with ", { ipa: æ }, "."]
    uk: ["Назва літери відрізняється від її звука в слові: ", { letter: A }, " називається ", { ipa: eɪ }, ", але ", { term: [{ letter: a }, pple] }, " починається зі звука ", { ipa: æ }, "."]
    es: ["El nombre de una letra difiere de su sonido en una palabra: ", { letter: A }, " se dice ", { ipa: eɪ }, ", pero ", { term: [{ letter: a }, pple] }, " empieza con ", { ipa: æ }, "."]
    pt: ["O nome de uma letra difere do seu som em uma palavra: ", { letter: "A" }, " se diz ", { ipa: "eɪ" }, ", mas ", { term: [{ letter: "a" }, "pple"] }, " começa com ", { ipa: "æ" }, "."]
    fr: ["Le nom d’une lettre diffère de son son dans un mot : ", { letter: "A" }, " se dit ", { ipa: "eɪ" }, ", mais ", { term: [{ letter: "a" }, "pple"] }, " commence par ", { ipa: "æ" }, "."]
    de: ["Der Name eines Buchstabens unterscheidet sich von seinem Laut in einem Wort: ", { letter: "A" }, " heißt ", { ipa: "eɪ" }, ", aber ", { term: [{ letter: "a" }, "pple"] }, " beginnt mit ", { ipa: "æ" }, "."]
    it: ["Il nome di una lettera differisce dal suo suono in una parola: ", { letter: "A" }, " si dice ", { ipa: "eɪ" }, ", ma ", { term: [{ letter: "a" }, "pple"] }, " inizia con ", { ipa: "æ" }, "."]
    pl: ["Nazwa litery różni się od jej dźwięku w słowie: ", { letter: "A" }, " czyta się ", { ipa: "eɪ" }, ", ale ", { term: [{ letter: "a" }, "pple"] }, " zaczyna się od ", { ipa: "æ" }, "."]
    tr: ["Bir harfin adı, sözcük içindeki sesinden farklıdır: ", { letter: "A" }, " harfinin adı ", { ipa: "eɪ" }, ", ama ", { term: [{ letter: "a" }, "pple"] }, " sözcüğü ", { ipa: "æ" }, " sesiyle başlar."]
    id: ["Nama huruf berbeda dari bunyinya dalam kata: ", { letter: "A" }, " dibaca ", { ipa: "eɪ" }, ", tetapi ", { term: [{ letter: "a" }, "pple"] }, " diawali bunyi ", { ipa: "æ" }, "."]
    vi: ["Tên của một chữ cái khác với âm của nó trong từ: ", { letter: "A" }, " đọc là ", { ipa: "eɪ" }, ", nhưng ", { term: [{ letter: "a" }, "pple"] }, " bắt đầu bằng ", { ipa: "æ" }, "."]

