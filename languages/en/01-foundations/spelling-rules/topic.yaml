          - { level: C1, words: { alternatives: ["principal", "principle"] }, rule: { en: [{ term: "principal" }, " is an adjective, ", { term: "principle" }, " is a noun for a rule"] }, ex: { examples: [["Her ", { target: "principal" }, " aim is to win."], ["It is a matter of ", { target: "principle" }, "."]] } }
