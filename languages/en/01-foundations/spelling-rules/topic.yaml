summary:
  lead:
    en: ["Endings change the last letters of a word by rule (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), and British and American spelling differ in set patterns."]
    uk: ["Закінчення змінюють кінцеві літери слова за правилами (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), а британський і американський правопис різняться за сталими схемами."]
    es: ["Las terminaciones cambian las últimas letras según reglas (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), y la ortografía británica y la estadounidense difieren en patrones fijos."]
    pt: ["As terminações mudam as últimas letras da palavra por regra (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), e a ortografia britânica e a americana diferem em padrões fixos."]
    fr: ["Les terminaisons changent les lettres finales par règle (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, ") ; l’orthographe britannique et l’américaine diffèrent par des schémas fixes."]
    de: ["Endungen ändern die letzten Buchstaben nach Regeln (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "); britische und amerikanische Schreibweise unterscheiden sich in festen Mustern."]
    it: ["Le desinenze cambiano le ultime lettere secondo regole (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), e l'ortografia britannica e quella americana differiscono per schemi fissi."]
    pl: ["Końcówki zmieniają ostatnie litery wyrazu według reguł (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), a pisownia brytyjska i amerykańska różnią się według stałych wzorców."]
    tr: ["Ekler, sözcüğün son harflerini kurala göre değiştirir (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "); İngiliz ve Amerikan yazımı da belirli kalıplarda ayrılır."]
    id: ["Akhiran mengubah huruf terakhir kata menurut aturan (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), dan ejaan Inggris serta Amerika berbeda menurut pola tetap."]
    vi: ["Đuôi từ làm đổi các chữ cái cuối của từ theo quy tắc (", { term: "running" }, ", ", { term: "hoping" }, ", ", { term: "studies" }, "), còn chính tả Anh và Mỹ khác nhau theo những mẫu cố định."]
  rule:
    en: "A final consonant doubles after one stressed vowel:"
    uk: "Кінцевий приголосний подвоюється після одного наголошеного голосного:"
    es: "Una consonante final se duplica tras una sola vocal tónica:"
    pt: "Uma consoante final se dobra depois de uma única vogal tônica:"
    fr: "Une consonne finale se double après une seule voyelle tonique :"
    de: "Ein Endkonsonant wird nach einem einzelnen betonten Vokal verdoppelt:"
    it: "Una consonante finale si raddoppia dopo una sola vocale tonica:"
    pl: "Końcowa spółgłoska podwaja się po jednej akcentowanej samogłosce:"
    tr: "Son ünsüz, vurgulu tek bir ünlüden sonra ikilenir:"
    id: "Konsonan akhir digandakan setelah satu vokal bertekanan:"
    vi: "Phụ âm cuối được gấp đôi sau một nguyên âm mang trọng âm:"
  ex: { examples: [{ mapping: ["begin", { target: "beginning" }] }, { mapping: ["visit", { target: "visiting" }] }] }

