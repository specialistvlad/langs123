          - { level: C1, spelling: { letter: "-sion" }, rule: { en: [{ ipa: "ʃn" }, " after ", { letter: "l" }, ", ", { letter: "n" }, " and ", { letter: "r" }] }, ex: { examples: [{ target: "compulsion" }, { target: "tension" }, { target: "version" }] } }
          - { level: C1, spelling: { letter: "-ssion" }, rule: { en: [{ ipa: "ʃn" }, " after a short vowel"] }, ex: { examples: [{ target: "mission" }, { target: "passion" }, { target: "discussion" }, { target: "permission" }] } }
          - { level: C1, spelling: { letter: "-sion" }, rule: { en: [{ ipa: "ʒn" }, " after a vowel"] }, ex: { examples: [{ target: "decision" }, { target: "television" }, { target: "occasion" }] } }
