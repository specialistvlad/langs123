          - { level: C1, words: { alternatives: ["whose", "who's"] }, rule: { en: [{ term: "whose" }, " asks about an owner, ", { term: "who's" }, " is ", { term: "who is" }, " or ", { term: "who has" }] }, ex: { examples: [[{ target: "Whose" }, " bag is this?"], [{ target: "Who's" }, " coming?"]] } }
