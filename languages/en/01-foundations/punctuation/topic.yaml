title: { en: "Punctuation and Capital Letters", uk: "Розділові знаки та великі літери", es: "Puntuación y mayúsculas", pt: "Pontuação e letras maiúsculas", fr: "Ponctuation et majuscules", de: "Zeichensetzung und Großschreibung", it: "Punteggiatura e maiuscole", pl: "Interpunkcja i wielkie litery", tr: "Noktalama ve büyük harfler", id: "Tanda baca dan huruf kapital", vi: "Dấu câu và chữ hoa" }
summary:
  lead:
    en: "Capital letters and marks such as full stops, commas, apostrophes, colons and quotation marks show where sentences end, how clauses join and who speaks."
    uk: "Великі літери та знаки, як-от крапки, коми, апострофи, двокрапки й лапки, показують, де закінчується речення, як з’єднуються його частини і хто говорить."
    es: "Mayúsculas y signos (punto, coma, apóstrofo, dos puntos, comillas) indican dónde termina la oración, cómo se unen sus partes y quién habla."
    pt: "Maiúsculas e sinais (ponto final, vírgula, apóstrofo, dois-pontos, aspas) mostram onde a frase termina, como as orações se unem e quem fala."
    fr: "Majuscules et signes (point, virgule, apostrophe, deux-points, guillemets) montrent où la phrase finit, comment les propositions se joignent et qui parle."
    de: "Großbuchstaben und Zeichen (Punkt, Komma, Apostroph, Doppelpunkt, Anführungszeichen) zeigen, wo ein Satz endet, wie Teilsätze sich verbinden und wer spricht."
    it: "Maiuscole e segni (punto, virgola, apostrofo, due punti, virgolette) mostrano dove finisce la frase, come si uniscono le proposizioni e chi parla."
    pl: "Wielkie litery i znaki, takie jak kropka, przecinek, apostrof, dwukropek i cudzysłów, pokazują, gdzie kończy się zdanie, jak łączą się jego części i kto mówi."
    tr: "Büyük harfler ve noktalama (nokta, virgül, kesme, iki nokta, tırnak) cümlenin nerede bittiğini, parçaların nasıl bağlandığını ve kimin konuştuğunu gösterir."
    id: "Huruf kapital dan tanda (titik, koma, apostrof, titik dua, tanda petik) menunjukkan akhir kalimat, hubungan antarklausa, dan siapa yang berbicara."
    vi: "Chữ hoa và dấu câu cho biết câu kết thúc ở đâu, các mệnh đề nối nhau ra sao và ai đang nói."
  rule:
    en: "A comma alone never joins two main clauses:"
    uk: "Сама кома ніколи не з’єднує два головні речення:"
    es: "Una coma sola nunca une dos oraciones principales:"
    pt: "Uma vírgula sozinha nunca une duas orações principais:"
    fr: "Une virgule seule ne relie jamais deux propositions principales :"
    de: "Ein Komma allein verbindet nie zwei Hauptsätze:"
    it: "Una virgola da sola non unisce mai due proposizioni principali:"
    pl: "Sam przecinek nigdy nie łączy dwóch zdań głównych:"
    tr: "Tek başına virgül, iki ana cümleyi asla birbirine bağlamaz:"
    id: "Koma saja tidak pernah menyambung dua klausa utama:"
    vi: "Một dấu phẩy không thể nối hai mệnh đề chính:"
  ex:
    examples:
      - ["It was late", { target: ", so" }, " we went home."]
      - ["It was late", { target: ";" }, " we went home."]

