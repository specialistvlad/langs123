          rule: { en: "colon explains, semicolon balances, dash adds emphasis", uk: "двокрапка пояснює, крапка з комою врівноважує, тире підкреслює", es: "los dos puntos explican, el punto y coma equilibra, la raya da énfasis", pt: "os dois-pontos explicam, o ponto e vírgula equilibra, o travessão enfatiza", fr: "les deux-points expliquent, le point-virgule équilibre, le tiret met en relief", de: "der Doppelpunkt erklärt, das Semikolon gleicht aus, der Gedankenstrich betont", it: "i due punti spiegano, il punto e virgola bilancia, la lineetta enfatizza", pl: "dwukropek wyjaśnia, średnik równoważy, myślnik podkreśla", tr: "iki nokta açıklar, noktalı virgül dengeler, tire vurgular", id: "titik dua menjelaskan, titik koma menyeimbangkan, tanda pisah memberi penekanan", vi: "dấu hai chấm giải thích, dấu chấm phẩy cân bằng, dấu gạch ngang nhấn mạnh" }
