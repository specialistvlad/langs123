            rule: { en: [{ term: "such as" }, " and ", { term: "including" }, " take commas when the examples add information"], uk: [{ term: "such as" }, " і ", { term: "including" }, " беруть коми, коли приклади додають інформацію"], es: [{ term: "such as" }, " y ", { term: "including" }, " llevan comas cuando los ejemplos añaden información"], pt: [{ term: "such as" }, " e ", { term: "including" }, " levam vírgulas quando os exemplos acrescentam informação"], fr: [{ term: "such as" }, " et ", { term: "including" }, " prennent des virgules quand les exemples ajoutent une information"], de: [{ term: "such as" }, " und ", { term: "including" }, " stehen mit Kommas, wenn die Beispiele Zusatzinformation liefern"], it: [{ term: "such as" }, " e ", { term: "including" }, " vogliono le virgole quando gli esempi aggiungono informazioni"], pl: [{ term: "such as" }, " i ", { term: "including" }, " mają przecinki, gdy przykłady dodają informację"], tr: [{ term: "such as" }, " ve ", { term: "including" }, " ifadeleri, örnekler ek bilgi veriyorsa virgülle ayrılır"], id: [{ term: "such as" }, " dan ", { term: "including" }, " memakai koma bila contohnya menambah informasi"], vi: [{ term: "such as" }, " và ", { term: "including" }, " dùng dấu phẩy khi các ví dụ thêm thông tin"] }
            ex: { examples: [["She loves big cities", { target: "," }, " such as Paris and Rome."], ["Many cities", { target: "," }, " including Paris", { target: "," }, " are expensive."]] }
            tr: { uk: { examples: ["Вона любить великі міста, як-от Париж і Рим.", "Багато міст, зокрема Париж, дорогі."] }, es: { examples: ["Le encantan las grandes ciudades, como París y Roma.", "Muchas ciudades, incluida París, son caras."] }, pt: { examples: ["Ela adora cidades grandes, como Paris e Roma.", "Muitas cidades, inclusive Paris, são caras."] }, fr: { examples: ["Elle adore les grandes villes, comme Paris et Rome.", "Beaucoup de villes, dont Paris, sont chères."] }, de: { examples: ["Sie liebt Großstädte, wie Paris und Rom.", "Viele Städte, darunter Paris, sind teuer."] }, it: { examples: ["Ama le grandi città, come Parigi e Roma.", "Molte città, compresa Parigi, sono care."] }, pl: { examples: ["Uwielbia duże miasta, takie jak Paryż i Rzym.", "Wiele miast, w tym Paryż, jest drogich."] }, tr: { examples: ["Paris ve Roma gibi büyük şehirleri çok sever.", "Paris dahil birçok şehir pahalıdır."] }, id: { examples: ["Dia menyukai kota besar, seperti Paris dan Roma.", "Banyak kota, termasuk Paris, mahal."] }, vi: { examples: ["Cô ấy thích các thành phố lớn, như Paris và Rome.", "Nhiều thành phố, kể cả Paris, đều đắt đỏ."] } }
          - level: C1
            rule: { en: ["a comma follows an opening phrase with ", { ending: "-ing" }, " or ", { ending: "-ed" }], uk: ["кома стоїть після початкового звороту з ", { ending: "-ing" }, " або ", { ending: "-ed" }], es: ["una coma sigue a una frase inicial con ", { ending: "-ing" }, " o ", { ending: "-ed" }], pt: ["uma vírgula vem depois de uma expressão inicial com ", { ending: "-ing" }, " ou ", { ending: "-ed" }], fr: ["une virgule suit un groupe initial en ", { ending: "-ing" }, " ou ", { ending: "-ed" }], de: ["nach einer Anfangswendung mit ", { ending: "-ing" }, " oder ", { ending: "-ed" }, " steht ein Komma"], it: ["una virgola segue un'espressione iniziale con ", { ending: "-ing" }, " o ", { ending: "-ed" }], pl: ["przecinek stoi po początkowym zwrocie z ", { ending: "-ing" }, " lub ", { ending: "-ed" }], tr: ["başta gelen ", { ending: "-ing" }, " veya ", { ending: "-ed" }, " öbeğinden sonra virgül gelir"], id: ["koma mengikuti frasa pembuka dengan ", { ending: "-ing" }, " atau ", { ending: "-ed" }], vi: ["dấu phẩy đứng sau cụm mở đầu có ", { ending: "-ing" }, " hoặc ", { ending: "-ed" }] }
            ex: { examples: [["Having finished", { target: "," }, " she left."], ["Surprised by the news", { target: "," }, " he sat down."]] }
            tr: { uk: { examples: ["Закінчивши, вона пішла.", "Здивований новиною, він сів."] }, es: { examples: ["Al terminar, se fue.", "Sorprendido por la noticia, se sentó."] }, pt: { examples: ["Tendo terminado, ela saiu.", "Surpreso com a notícia, ele se sentou."] }, fr: { examples: ["Ayant fini, elle est partie.", "Surpris par la nouvelle, il s’est assis."] }, de: { examples: ["Als sie fertig war, ging sie.", "Von der Nachricht überrascht, setzte er sich."] }, it: { examples: ["Avendo finito, se ne andò.", "Sorpreso dalla notizia, si sedette."] }, pl: { examples: ["Skończywszy, wyszła.", "Zaskoczony wiadomością, usiadł."] }, tr: { examples: ["İşini bitirince gitti.", "Habere şaşırarak oturdu."] }, id: { examples: ["Setelah selesai, dia pergi.", "Terkejut oleh kabar itu, dia duduk."] }, vi: { examples: ["Làm xong, cô ấy đi.", "Ngạc nhiên vì tin đó, anh ấy ngồi xuống."] } }
          - level: C1
            rule: { en: "a comma follows an absolute phrase, which has a subject of its own", uk: "кома стоїть після абсолютної конструкції, яка має власний підмет", es: "una coma sigue a una construcción absoluta, que tiene sujeto propio", pt: "uma vírgula vem depois de uma construção absoluta, que tem sujeito próprio", fr: "une virgule suit une proposition absolue, qui a son propre sujet", de: "nach einer absoluten Konstruktion, die ein eigenes Subjekt hat, steht ein Komma", it: "una virgola segue una costruzione assoluta, che ha un soggetto proprio", pl: "przecinek stoi po konstrukcji absolutnej, która ma własny podmiot", tr: "kendi öznesi olan bağımsız yapıdan sonra virgül gelir", id: "koma mengikuti konstruksi absolut, yang memiliki subjek sendiri", vi: "dấu phẩy đứng sau cụm tuyệt đối, là cụm có chủ ngữ riêng" }
            ex: ["The work done", { target: "," }, " they went home."]
            tr: { uk: "Коли роботу було закінчено, вони пішли додому.", es: "Terminado el trabajo, se fueron a casa.", pt: "Terminado o trabalho, eles foram para casa.", fr: "Le travail terminé, ils sont rentrés.", de: "Nach getaner Arbeit gingen sie nach Hause.", it: "Finito il lavoro, tornarono a casa.", pl: "Praca skończona, poszli do domu.", tr: "İş bitince eve gittiler.", id: "Setelah pekerjaan selesai, mereka pulang.", vi: "Công việc xong xuôi, họ về nhà." }
          - level: C1
            rule: { en: ["a ", { term: "that" }, "-clause follows its verb or noun with no comma"], uk: ["підрядне речення з ", { term: "that" }, " стоїть після свого дієслова чи іменника без коми"], es: ["una oración con ", { term: "that" }, " sigue a su verbo o sustantivo sin coma"], pt: ["uma oração com ", { term: "that" }, " vem depois do seu verbo ou substantivo sem vírgula"], fr: ["une proposition en ", { term: "that" }, " suit son verbe ou son nom sans virgule"], de: ["ein ", { term: "that" }, "-Satz folgt seinem Verb oder Nomen ohne Komma"], it: ["una proposizione con ", { term: "that" }, " segue il suo verbo o sostantivo senza virgola"], pl: ["zdanie z ", { term: "that" }, " następuje po swoim czasowniku lub rzeczowniku bez przecinka"], tr: [{ term: "that" }, " cümlesi, bağlı olduğu fiilin veya ismin ardından virgülsüz gelir"], id: ["klausa ", { term: "that" }, " mengikuti kata kerja atau kata bendanya tanpa koma"], vi: ["mệnh đề ", { term: "that" }, " đứng sau động từ hoặc danh từ của nó, không có dấu phẩy"] }
            ex: { examples: [["She said ", { target: "that" }, " she was ill."], ["The idea ", { target: "that" }, " we should wait is wrong."]] }
            tr: { uk: { examples: ["Вона сказала, що хвора.", "Ідея, що нам слід чекати, хибна."] }, es: { examples: ["Dijo que estaba enferma.", "La idea de que debemos esperar es errónea."] }, pt: { examples: ["Ela disse que estava doente.", "A ideia de que devemos esperar está errada."] }, fr: { examples: ["Elle a dit qu’elle était malade.", "L’idée que nous devrions attendre est fausse."] }, de: { examples: ["Sie sagte, dass sie krank sei.", "Die Idee, dass wir warten sollten, ist falsch."] }, it: { examples: ["Ha detto che era malata.", "L'idea che dovremmo aspettare è sbagliata."] }, pl: { examples: ["Powiedziała, że jest chora.", "Pomysł, że powinniśmy czekać, jest błędny."] }, tr: { examples: ["Hasta olduğunu söyledi.", "Beklememiz gerektiği fikri yanlış."] }, id: { examples: ["Dia berkata bahwa dia sakit.", "Gagasan bahwa kita harus menunggu itu keliru."] }, vi: { examples: ["Cô ấy nói rằng cô ấy bị ốm.", "Ý nghĩ rằng chúng ta nên đợi là sai."] } }

  - title: { en: "Parentheses, brackets, ellipsis and slash", uk: "Круглі й квадратні дужки, три крапки, коса риска", es: "Paréntesis, corchetes, puntos suspensivos y barra", pt: "Parênteses, colchetes, reticências e barra", fr: "Parenthèses, crochets, points de suspension et barre oblique", de: "Klammern, Auslassungspunkte und Schrägstrich", it: "Parentesi, puntini di sospensione e barra obliqua", pl: "Nawiasy, wielokropek i ukośnik", tr: "Parantez, köşeli parantez, üç nokta ve eğik çizgi", id: "Tanda kurung, elipsis, dan garis miring", vi: "Dấu ngoặc đơn, ngoặc vuông, dấu ba chấm và dấu gạch chéo" }
    role: own
