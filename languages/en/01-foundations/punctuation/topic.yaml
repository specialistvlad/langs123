            rule: { en: "joins a compound modifier before a noun", uk: "з’єднує складне означення перед іменником", es: "une un modificador compuesto antes de un sustantivo", pt: "une um modificador composto antes de um substantivo", fr: "relie un modificateur composé placé avant le nom", de: "verbindet ein zusammengesetztes Attribut vor einem Nomen", it: "unisce un modificatore composto prima di un sostantivo", pl: "łączy złożone określenie przed rzeczownikiem", tr: "isimden önceki birleşik niteleyiciyi bağlar", id: "menyambung pewatas majemuk sebelum kata benda", vi: "nối một định ngữ ghép đứng trước danh từ" }
            ex: { examples: [["a ", { target: "well-known" }, " author"], ["a ", { target: "five-year-old" }, " child"]] }
            tr: { uk: { examples: ["відомий автор", "п’ятирічна дитина"] }, es: { examples: ["un autor muy conocido", "un niño de cinco años"] }, pt: { examples: ["um autor muito conhecido", "uma criança de cinco anos"] }, fr: { examples: ["un auteur bien connu", "un enfant de cinq ans"] }, de: { examples: ["ein bekannter Autor", "ein fünfjähriges Kind"] }, it: { examples: ["un autore molto noto", "un bambino di cinque anni"] }, pl: { examples: ["znany autor", "pięcioletnie dziecko"] }, tr: { examples: ["tanınmış bir yazar", "beş yaşında bir çocuk"] }, id: { examples: ["penulis yang terkenal", "anak berusia lima tahun"] }, vi: { examples: ["một tác giả nổi tiếng", "một đứa trẻ năm tuổi"] } }
          - level: B2
            point: { en: "compound after the noun", uk: "складний вираз після іменника", es: "expresión compuesta después del sustantivo", pt: "expressão composta depois do substantivo", fr: "expression composée après le nom", de: "zusammengesetzter Ausdruck nach dem Nomen", it: "espressione composta dopo il sostantivo", pl: "złożone wyrażenie po rzeczowniku", tr: "isimden sonra gelen birleşik ifade", id: "ungkapan majemuk setelah kata benda", vi: "cụm ghép đứng sau danh từ" }
            rule: { en: "separate words", uk: "окремі слова", es: "palabras separadas", pt: "palavras separadas", fr: "mots séparés", de: "getrennte Wörter", it: "parole separate", pl: "osobne wyrazy", tr: "ayrı sözcükler", id: "kata terpisah", vi: "các từ viết rời" }
            ex: { examples: [["The author is ", { target: "well known" }, "."], ["The child is ", { target: "five years old" }, "."]] }
            tr: { uk: { examples: ["Автор добре відомий.", "Дитині п’ять років."] }, es: { examples: ["El autor es muy conocido.", "El niño tiene cinco años."] }, pt: { examples: ["O autor é muito conhecido.", "A criança tem cinco anos."] }, fr: { examples: ["L’auteur est bien connu.", "L’enfant a cinq ans."] }, de: { examples: ["Der Autor ist bekannt.", "Das Kind ist fünf Jahre alt."] }, it: { examples: ["L'autore è molto noto.", "Il bambino ha cinque anni."] }, pl: { examples: ["Autor jest znany.", "Dziecko ma pięć lat."] }, tr: { examples: ["Yazar tanınmıştır.", "Çocuk beş yaşında."] }, id: { examples: ["Penulis itu terkenal.", "Anak itu berusia lima tahun."] }, vi: { examples: ["Tác giả này nổi tiếng.", "Đứa trẻ này năm tuổi."] } }
          - level: B2
            point: { en: ["en dash ", { letter: "–" }], uk: ["коротке тире ", { letter: "–" }], es: ["semirraya ", { letter: "–" }], pt: ["meia-risca ", { letter: "–" }], fr: ["tiret demi-cadratin ", { letter: "–" }], de: ["Halbgeviertstrich ", { letter: "–" }], it: ["trattino medio ", { letter: "–" }], pl: ["półpauza ", { letter: "–" }], tr: ["orta tire ", { letter: "–" }], id: ["tanda pisah en ", { letter: "–" }], vi: ["dấu gạch ngang ngắn ", { letter: "–" }] }
            rule: { en: "joins the two ends of a range, with no spaces", uk: "поєднує обидва кінці діапазону, без пробілів", es: "une los dos extremos de un rango, sin espacios", pt: "une as duas pontas de um intervalo, sem espaços", fr: "relie les deux bornes d’un intervalle, sans espaces", de: "verbindet die beiden Enden eines Bereichs, ohne Leerzeichen", it: "unisce i due estremi di un intervallo, senza spazi", pl: "łączy oba końce zakresu, bez spacji", tr: "bir aralığın iki ucunu boşluksuz birleştirir", id: "menghubungkan kedua ujung rentang, tanpa spasi", vi: "nối hai đầu của một khoảng, không có khoảng trắng" }
            ex: { examples: [["the years ", { target: "1990–2000" }], [{ target: "3–5" }, " July"]] }
            tr: { uk: { examples: ["роки 1990–2000", "3–5 липня"] }, es: { examples: ["los años 1990–2000", "3–5 de julio"] }, pt: { examples: ["os anos 1990–2000", "3–5 de julho"] }, fr: { examples: ["les années 1990–2000", "3–5 juillet"] }, de: { examples: ["die Jahre 1990–2000", "3.–5. Juli"] }, it: { examples: ["gli anni 1990–2000", "3–5 luglio"] }, pl: { examples: ["lata 1990–2000", "3–5 lipca"] }, tr: { examples: ["1990–2000 yılları", "3–5 Temmuz"] }, id: { examples: ["tahun 1990–2000", "3–5 Juli"] }, vi: { examples: ["những năm 1990–2000", "3–5 tháng 7"] } }
          - level: B2
            point: { en: ["dash ", { letter: "–" }], uk: ["тире ", { letter: "–" }], es: ["raya ", { letter: "–" }], pt: ["travessão ", { letter: "–" }], fr: ["tiret ", { letter: "–" }], de: ["Gedankenstrich ", { letter: "–" }], it: ["lineetta ", { letter: "–" }], pl: ["myślnik ", { letter: "–" }], tr: ["tire ", { letter: "–" }], id: ["tanda pisah ", { letter: "–" }], vi: ["dấu gạch ngang ", { letter: "–" }] }
            rule: { en: "a pair sets off an aside; British style spaces an en dash, American style closes up an em dash", uk: "пара тире виділяє вставну частину; британський стиль ставить коротке тире з пробілами, американський — довге тире без пробілів", es: "un par de rayas aísla un inciso; el estilo británico pone una semirraya con espacios, el estadounidense una raya sin espacios", pt: "um par de travessões isola uma informação extra; o estilo britânico usa meia-risca com espaços, o americano usa travessão sem espaços", fr: "une paire de tirets isole une incise ; le style britannique met un tiret demi-cadratin entre espaces, le style américain un tiret cadratin sans espaces", de: "ein Paar Gedankenstriche setzt einen Einschub ab; britisch steht ein Halbgeviertstrich mit Leerzeichen, amerikanisch ein Geviertstrich ohne Leerzeichen", it: "una coppia di lineette isola un inciso; lo stile britannico usa il trattino medio con gli spazi, quello americano il trattino lungo senza spazi", pl: "para myślników wydziela wtrącenie; styl brytyjski daje półpauzę ze spacjami, amerykański pauzę bez spacji", tr: "bir çift tire ara ifadeyi ayırır; İngiliz stilinde boşluklu orta tire, Amerikan stilinde boşluksuz uzun tire kullanılır", id: "sepasang tanda pisah mengapit sisipan; gaya Inggris memakai en dash dengan spasi, gaya Amerika memakai em dash tanpa spasi", vi: "một cặp dấu gạch ngang tách phần chen thêm; kiểu Anh dùng dấu gạch ngang ngắn có khoảng trắng, kiểu Mỹ dùng dấu gạch ngang dài viết liền" }
            ex: ["Her flat ", { target: "–" }, " a tiny studio ", { target: "–" }, " is near the station. ", { variant: ["Her flat", { target: "—" }, "a tiny studio", { target: "—" }, "is near the station."], variety: en-US }]
            tr: { uk: "Її квартира — крихітна студія — розташована біля вокзалу.", es: "Su departamento —un estudio diminuto— está cerca de la estación.", pt: "O apartamento dela – um estúdio minúsculo – fica perto da estação.", fr: "Son appartement – un minuscule studio – est près de la gare.", de: "Ihre Wohnung – ein winziges Studio – liegt in der Nähe des Bahnhofs.", it: "Il suo appartamento – un monolocale minuscolo – è vicino alla stazione.", pl: "Jej mieszkanie – maleńka kawalerka – jest blisko dworca.", tr: "Dairesi – küçücük bir stüdyo – istasyonun yakınında.", id: "Flatnya – sebuah studio kecil – dekat stasiun.", vi: "Căn hộ của cô ấy – một phòng studio nhỏ xíu – nằm gần nhà ga." }

  - title: { en: "Quotation marks and direct speech", uk: "Лапки й пряма мова", es: "Comillas y estilo directo", pt: "Aspas e discurso direto", fr: "Guillemets et discours direct", de: "Anführungszeichen und direkte Rede", it: "Virgolette e discorso diretto", pl: "Cudzysłów i mowa niezależna", tr: "Tırnak işareti ve doğrudan anlatım", id: "Tanda petik dan kalimat langsung", vi: "Dấu ngoặc kép và câu trực tiếp" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            rule: { en: "British English puts single marks round the words spoken; American English uses double marks", uk: "У британській англійській слова мовця беруть в одинарні лапки, в американській — у подвійні", es: "El inglés británico pone comillas simples alrededor de lo que se dice; el estadounidense usa comillas dobles", pt: "O inglês britânico usa aspas simples em volta das palavras ditas; o americano usa aspas duplas", fr: "L’anglais britannique met des guillemets simples autour des paroles prononcées ; l’anglais américain emploie des guillemets doubles", de: "Britisches Englisch setzt die gesprochenen Worte in einfache Anführungszeichen; amerikanisches Englisch verwendet doppelte", it: "L'inglese britannico mette le parole dette tra virgolette singole; l'inglese americano usa le virgolette doppie", pl: "Brytyjski angielski ujmuje wypowiedź w pojedynczy cudzysłów; amerykański używa podwójnego", tr: "İngiliz İngilizcesi söylenen sözleri tek tırnak içine alır; Amerikan İngilizcesi çift tırnak kullanır", id: "Bahasa Inggris Britania mengapit ucapan dengan tanda petik tunggal; bahasa Inggris Amerika memakai tanda petik ganda", vi: "Tiếng Anh Anh đặt lời nói trong dấu ngoặc kép đơn; tiếng Anh Mỹ dùng dấu ngoặc kép đôi" }
            ex: ["Tom said, ", { target: "‘I’m tired.’" }, " ", { variant: ["Tom said, ", { target: "“I’m tired.”" }], variety: en-US }]
            tr: { uk: "Том сказав: «Я втомився».", es: "Tom dijo: «Estoy cansado».", pt: "Tom disse: “Estou cansado.”", fr: "Tom a dit : « Je suis fatigué. »", de: "Tom sagte: „Ich bin müde.“", it: "Tom ha detto: «Sono stanco».", pl: "Tom powiedział: „Jestem zmęczony.”", tr: "Tom, “Yorgunum.” dedi.", id: "Tom berkata, “Saya lelah.”", vi: "Tom nói: “Tôi mệt.”" }
          - level: B2
            rule: { en: "a comma and a capital letter introduce speech that follows the speaker", uk: "кома й велика літера вводять мову, що йде після слів автора", es: "una coma y una mayúscula introducen lo que se dice después de quien habla", pt: "uma vírgula e uma letra maiúscula introduzem a fala que vem depois de quem fala", fr: "une virgule et une majuscule introduisent les paroles qui suivent celui qui parle", de: "ein Komma und ein Großbuchstabe leiten die Rede ein, die auf den Sprecher folgt", it: "una virgola e una maiuscola introducono il discorso che segue chi parla", pl: "przecinek i wielka litera wprowadzają wypowiedź następującą po osobie mówiącej", tr: "konuşanı belirttikten sonra gelen söz, virgül ve büyük harfle başlar", id: "koma dan huruf kapital memperkenalkan ucapan yang mengikuti penutur", vi: "dấu phẩy và chữ hoa dẫn vào lời nói đứng sau người nói" }
            ex: ["She said", { target: "," }, " ‘Come in.’"]
            tr: { uk: "Вона сказала: «Заходьте».", es: "Dijo: «Entra».", pt: "Ela disse: “Entre.”", fr: "Elle a dit : « Entre. »", de: "Sie sagte: „Komm herein.“", it: "Disse: «Entra».", pl: "Powiedziała: „Wejdź.”", tr: "Dedi ki: “İçeri gel.”", id: "Dia berkata, “Masuklah.”", vi: "Cô ấy nói: “Mời vào.”" }
          - level: B2
            rule: { en: "a comma, not a full stop, ends speech before the speaker; it stands inside the marks, and ? and ! stay", uk: "кома, а не крапка, закінчує мову перед словами автора й стоїть усередині лапок; ? та ! зберігаються", es: "una coma, no un punto, cierra lo que se dice antes de quien habla; va dentro de las comillas, y ? y ! se mantienen", pt: "uma vírgula, e não um ponto final, encerra a fala antes de quem fala; ela fica dentro das aspas, e ? e ! se mantêm", fr: "une virgule, et non un point, termine les paroles avant celui qui parle ; elle reste à l’intérieur des guillemets, et ? et ! se maintiennent", de: "ein Komma, kein Punkt, beendet die Rede vor dem Sprecher; es steht innerhalb der Zeichen, und ? und ! bleiben erhalten", it: "una virgola, non un punto, chiude il discorso prima di chi parla; sta dentro le virgolette, e ? e ! restano", pl: "przecinek, a nie kropka, kończy wypowiedź przed osobą mówiącą; stoi w środku cudzysłowu, a ? i ! zostają", tr: "konuşanı belirtmeden önce söz, nokta ile değil virgülle biter; virgül tırnağın içinde durur, ? ve ! ise kalır", id: "koma, bukan titik, mengakhiri ucapan sebelum penutur; koma berada di dalam tanda petik, dan ? serta ! tetap dipertahankan", vi: "dấu phẩy, không phải dấu chấm, kết thúc lời nói trước người nói; dấu phẩy nằm trong dấu ngoặc, còn ? và ! được giữ nguyên" }
            ex: { examples: [["‘Come in", { target: ",’" }, " she said."], ["‘Where are you going", { target: "?’" }, " she asked."]] }
            tr: { uk: { examples: ["«Заходьте», — сказала вона.", "«Куди ти йдеш?» — запитала вона."] }, es: { examples: ["«Entra», dijo ella.", "«¿Adónde vas?», preguntó ella."] }, pt: { examples: ["“Entre”, disse ela.", "“Aonde você vai?”, perguntou ela."] }, fr: { examples: ["« Entre », dit-elle.", "« Où vas-tu ? » demanda-t-elle."] }, de: { examples: ["„Komm herein“, sagte sie.", "„Wohin gehst du?“, fragte sie."] }, it: { examples: ["«Entra», disse lei.", "«Dove vai?», chiese lei."] }, pl: { examples: ["„Wejdź”, powiedziała.", "„Dokąd idziesz?”, zapytała."] }, tr: { examples: ["“İçeri gel,” dedi.", "“Nereye gidiyorsun?” diye sordu."] }, id: { examples: ["“Masuklah,” katanya.", "“Kamu mau ke mana?” tanyanya."] }, vi: { examples: ["“Mời vào,” cô ấy nói.", "“Bạn đi đâu?” cô ấy hỏi."] } }
          - level: B2
            rule: { en: "each new speaker starts a new line", uk: "кожен новий мовець починає новий рядок", es: "cada nuevo hablante empieza una línea nueva", pt: "cada novo falante começa uma nova linha", fr: "chaque nouvel interlocuteur commence une nouvelle ligne", de: "jeder neue Sprecher beginnt eine neue Zeile", it: "ogni nuovo parlante comincia una nuova riga", pl: "każdy nowy mówca zaczyna nowy wiersz", tr: "her yeni konuşan yeni bir satıra başlar", id: "setiap penutur baru memulai baris baru", vi: "mỗi người nói mới bắt đầu một dòng mới" }
            ex: { exchange: ["‘Are you ready?’ asked Tom.", "‘Almost,’ said Ana."] }
            tr: { uk: { exchange: ["«Ти готовий?» — запитав Том.", "«Майже», — сказала Ана."] }, es: { exchange: ["«¿Estás listo?», preguntó Tom.", "«Casi», dijo Ana."] }, pt: { exchange: ["“Você está pronto?”, perguntou o Tom.", "“Quase”, disse a Ana."] }, fr: { exchange: ["« Tu es prêt ? » demanda Tom.", "« Presque », dit Ana."] }, de: { exchange: ["„Bist du bereit?“, fragte Tom.", "„Fast“, sagte Ana."] }, it: { exchange: ["«Sei pronto?», chiese Tom.", "«Quasi», disse Ana."] }, pl: { exchange: ["„Jesteś gotowy?”, zapytał Tom.", "„Prawie”, powiedziała Ana."] }, tr: { exchange: ["“Hazır mısın?” diye sordu Tom.", "“Neredeyse,” dedi Ana."] }, id: { exchange: ["“Apakah kamu sudah siap?” tanya Tom.", "“Hampir,” kata Ana."] }, vi: { exchange: ["“Bạn sẵn sàng chưa?” Tom hỏi.", "“Gần xong rồi,” Ana nói."] } }
          - level: B2
            rule: { en: "marks go round a title when italics are not possible, as in handwriting", uk: "лапки беруть назву, коли курсив неможливий, наприклад у рукописному тексті", es: "las comillas encierran un título cuando no se puede usar cursiva, como en la escritura a mano", pt: "as aspas envolvem um título quando o itálico não é possível, como na escrita à mão", fr: "les guillemets entourent un titre quand l’italique est impossible, comme à la main", de: "Anführungszeichen umschließen einen Titel, wenn Kursivschrift nicht möglich ist, etwa in Handschrift", it: "le virgolette racchiudono un titolo quando il corsivo non è possibile, come nella scrittura a mano", pl: "cudzysłów obejmuje tytuł, gdy kursywa nie jest możliwa, na przykład w piśmie odręcznym", tr: "italik mümkün olmadığında, örneğin el yazısında, başlık tırnak içine alınır", id: "tanda petik mengapit judul bila huruf miring tidak mungkin, misalnya dalam tulisan tangan", vi: "dấu ngoặc kép bao quanh nhan đề khi không thể dùng chữ nghiêng, ví dụ khi viết tay" }
            ex: ["We read ", { target: "‘Emma’" }, " in class."]
            tr: { uk: "Ми читали «Емму» на уроці.", es: "Leímos «Emma» en clase.", pt: "Lemos “Emma” na aula.", fr: "Nous avons lu « Emma » en classe.", de: "Wir haben im Unterricht „Emma“ gelesen.", it: "Abbiamo letto «Emma» in classe.", pl: "Czytaliśmy „Emmę” na lekcji.", tr: "Derste “Emma”yı okuduk.", id: "Kami membaca “Emma” di kelas.", vi: "Chúng tôi đã đọc “Emma” trên lớp." }
          - level: B2
            rule: { en: "marks go round a word used in a doubtful or special sense", uk: "лапки беруть слово, вжите у сумнівному або особливому значенні", es: "las comillas encierran una palabra usada en un sentido dudoso o especial", pt: "as aspas envolvem uma palavra usada em sentido duvidoso ou especial", fr: "les guillemets entourent un mot employé dans un sens douteux ou particulier", de: "Anführungszeichen umschließen ein Wort in zweifelhafter oder besonderer Bedeutung", it: "le virgolette racchiudono una parola usata in senso dubbio o particolare", pl: "cudzysłów obejmuje wyraz użyty w wątpliwym lub szczególnym znaczeniu", tr: "kuşkulu ya da özel anlamda kullanılan sözcük tırnak içine alınır", id: "tanda petik mengapit kata yang dipakai dengan makna meragukan atau khusus", vi: "dấu ngoặc kép bao quanh một từ dùng với nghĩa đáng ngờ hoặc nghĩa đặc biệt" }
            ex: ["He is a ", { target: "‘friend’" }, " who never calls."]
            tr: { uk: "Він «друг», який ніколи не телефонує.", es: "Es un «amigo» que nunca llama.", pt: "Ele é um “amigo” que nunca liga.", fr: "C’est un « ami » qui n’appelle jamais.", de: "Er ist ein „Freund“, der nie anruft.", it: "È un «amico» che non chiama mai.", pl: "To „przyjaciel”, który nigdy nie dzwoni.", tr: "O hiç aramayan bir “arkadaş”.", id: "Dia seorang “teman” yang tidak pernah menelepon.", vi: "Anh ta là một “người bạn” chẳng bao giờ gọi điện." }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["Direct speech turned into reported speech: see ", { link: "Reported speech", to: en.sentence-building.reported-speech }, "."], uk: ["Пряма мова, перетворена на непряму: див. ", { link: "Непряма мова", to: en.sentence-building.reported-speech }, "."], es: ["Del estilo directo al indirecto: véase ", { link: "el estilo indirecto", to: en.sentence-building.reported-speech }, "."], pt: ["Do discurso direto ao indireto: veja ", { link: "Discurso indireto", to: en.sentence-building.reported-speech }, "."], fr: ["Du discours direct au discours indirect : voir ", { link: "le discours indirect", to: en.sentence-building.reported-speech }, "."], de: ["Von direkter zu indirekter Rede: siehe ", { link: "Indirekte Rede", to: en.sentence-building.reported-speech }, "."], it: ["Dal discorso diretto al discorso indiretto: vedi ", { link: "Discorso indiretto", to: en.sentence-building.reported-speech }, "."], pl: ["Przejście z mowy niezależnej na zależną: zob. ", { link: "Mowa zależna", to: en.sentence-building.reported-speech }, "."], tr: ["Doğrudan anlatımın dolaylı anlatıma çevrilmesi için bkz. ", { link: "Dolaylı anlatım", to: en.sentence-building.reported-speech }, "."], id: ["Kalimat langsung yang diubah menjadi tak langsung: lihat ", { link: "Kalimat tak langsung", to: en.sentence-building.reported-speech }, "."], vi: ["Chuyển câu trực tiếp thành câu gián tiếp: xem ", { link: "Câu gián tiếp", to: en.sentence-building.reported-speech }, "."] }

  - title: { en: "Capital letters", uk: "Великі літери", es: "Mayúsculas", pt: "Letras maiúsculas", fr: "Majuscules", de: "Großschreibung", it: "Maiuscole", pl: "Wielkie litery", tr: "Büyük harfler", id: "Huruf kapital", vi: "Chữ hoa" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            rule: { en: ["capital for the first word of a sentence and for the pronoun ", { letter: "I" }], uk: ["велика літера для першого слова речення й для займенника ", { letter: "I" }], es: ["mayúscula para la primera palabra de una oración y para el pronombre ", { letter: "I" }], pt: ["maiúscula para a primeira palavra da frase e para o pronome ", { letter: "I" }], fr: ["majuscule pour le premier mot de la phrase et pour le pronom ", { letter: "I" }], de: ["Großbuchstabe für das erste Wort eines Satzes und für das Pronomen ", { letter: "I" }], it: ["maiuscola per la prima parola della frase e per il pronome ", { letter: "I" }], pl: ["wielka litera na początku zdania i w zaimku ", { letter: "I" }], tr: ["cümlenin ilk sözcüğü ve ", { letter: "I" }, " zamiri büyük harfle yazılır"], id: ["huruf kapital untuk kata pertama kalimat dan untuk pronomina ", { letter: "I" }], vi: ["chữ hoa cho từ đầu tiên của câu và cho đại từ ", { letter: "I" }] }
            ex: { examples: [[{ target: "The" }, " train was late."], ["Tom and ", { target: "I" }, " were late."]] }
            tr: { uk: { examples: ["Потяг запізнився.", "Том і я запізнилися."] }, es: { examples: ["El tren llegó tarde.", "Tom y yo llegamos tarde."] }, pt: { examples: ["O trem atrasou.", "Tom e eu nos atrasamos."] }, fr: { examples: ["Le train était en retard.", "Tom et moi étions en retard."] }, de: { examples: ["Der Zug hatte Verspätung.", "Tom und ich kamen zu spät."] }, it: { examples: ["Il treno era in ritardo.", "Tom e io eravamo in ritardo."] }, pl: { examples: ["Pociąg się spóźnił.", "Tom i ja spóźniliśmy się."] }, tr: { examples: ["Tren geç kaldı.", "Tom ve ben geç kaldık."] }, id: { examples: ["Kereta itu terlambat.", "Tom dan saya terlambat."] }, vi: { examples: ["Chuyến tàu bị trễ.", "Tom và tôi đến muộn."] } }
          - level: B2
            rule: { en: "capital for names of people, places and organisations", uk: "велика літера для імен людей, назв місць та організацій", es: "mayúscula para nombres de personas, lugares y organizaciones", pt: "maiúscula para nomes de pessoas, lugares e organizações", fr: "majuscule pour les noms de personnes, de lieux et d’organisations", de: "Großbuchstabe für Namen von Personen, Orten und Organisationen", it: "maiuscola per nomi di persone, luoghi e organizzazioni", pl: "wielka litera w imionach osób oraz nazwach miejsc i organizacji", tr: "kişi, yer ve kurum adları büyük harfle yazılır", id: "huruf kapital untuk nama orang, tempat, dan organisasi", vi: "chữ hoa cho tên người, địa điểm và tổ chức" }
            ex: ["Ana lives in ", { target: "Madrid" }, "."]
            tr: { uk: "Ана живе в Мадриді.", es: "Ana vive en Madrid.", pt: "A Ana mora em Madri.", fr: "Ana habite à Madrid.", de: "Ana wohnt in Madrid.", it: "Ana vive a Madrid.", pl: "Ana mieszka w Madrycie.", tr: "Ana Madrid’de yaşıyor.", id: "Ana tinggal di Madrid.", vi: "Ana sống ở Madrid." }
          - level: B2
            rule: { en: "capital for nationalities and languages", uk: "в англійській з великої літери пишуть національності й мови", es: "en inglés, las nacionalidades y los idiomas llevan mayúscula", pt: "em inglês, nacionalidades e idiomas levam letra maiúscula", fr: "en anglais, les nationalités et les langues prennent une majuscule", de: "im Englischen werden Nationalitäten und Sprachen großgeschrieben", it: "in inglese nazionalità e lingue vogliono la maiuscola", pl: "w angielskim narodowości i języki piszemy wielką literą", tr: "İngilizcede uyruklar ve diller büyük harfle yazılır", id: "kebangsaan dan bahasa memakai huruf kapital", vi: "trong tiếng Anh, quốc tịch và ngôn ngữ viết hoa" }
            ex: ["My teacher is ", { target: "Polish" }, " and speaks ", { target: "French" }, "."]
            tr: { uk: "Мій учитель — поляк і розмовляє французькою.", es: "Mi profesor es polaco y habla francés.", pt: "Meu professor é polonês e fala francês.", fr: "Mon professeur est polonais et parle français.", de: "Mein Lehrer ist Pole und spricht Französisch.", it: "Il mio insegnante è polacco e parla francese.", pl: "Mój nauczyciel jest Polakiem i mówi po francusku.", tr: "Öğretmenim Polonyalı ve Fransızca konuşuyor.", id: "Guru saya orang Polandia dan berbicara bahasa Prancis.", vi: "Giáo viên của tôi là người Ba Lan và nói tiếng Pháp." }
          - level: B2
            rule: { en: "capital for adjectives made from names", uk: "в англійській прикметники, утворені від власних назв, пишуть з великої літери", es: "en inglés, los adjetivos formados a partir de nombres propios llevan mayúscula", pt: "em inglês, adjetivos formados a partir de nomes próprios levam maiúscula", fr: "en anglais, les adjectifs formés sur des noms propres prennent une majuscule", de: "im Englischen werden von Namen abgeleitete Adjektive großgeschrieben", it: "in inglese gli aggettivi derivati da nomi propri vogliono la maiuscola", pl: "w angielskim przymiotniki utworzone od nazw własnych piszemy wielką literą", tr: "İngilizcede özel adlardan türeyen sıfatlar büyük harfle yazılır", id: "kata sifat yang dibentuk dari nama memakai huruf kapital", vi: "trong tiếng Anh, tính từ tạo từ tên riêng viết hoa" }
            ex: ["a ", { target: "Victorian" }, " house"]
            tr: { uk: "вікторіанський будинок", es: "una casa victoriana", pt: "uma casa vitoriana", fr: "une maison victorienne", de: "ein viktorianisches Haus", it: "una casa vittoriana", pl: "dom wiktoriański", tr: "Viktorya dönemi evi", id: "rumah bergaya Victoria", vi: "một ngôi nhà thời Victoria" }
          - level: B2
            rule: { en: "capital for days, months and holidays", uk: "в англійській з великої літери пишуть дні тижня, місяці й свята", es: "en inglés, los días, los meses y las fiestas llevan mayúscula", pt: "em inglês, dias, meses e feriados levam maiúscula", fr: "en anglais, les jours, les mois et les fêtes prennent une majuscule", de: "im Englischen werden Wochentage, Monate und Feiertage großgeschrieben", it: "in inglese giorni, mesi e feste vogliono la maiuscola", pl: "w angielskim dni, miesiące i święta piszemy wielką literą", tr: "İngilizcede günler, aylar ve bayramlar büyük harfle yazılır", id: "hari, bulan, dan hari raya memakai huruf kapital", vi: "trong tiếng Anh, thứ, tháng và ngày lễ viết hoa" }
            ex: ["We meet on ", { target: "Friday" }, " in ", { target: "March" }, ", and at ", { target: "Easter" }, "."]
            tr: { uk: "Ми зустрічаємося в п’ятницю в березні та на Великдень.", es: "Nos reunimos el viernes en marzo y en Pascua.", pt: "Nos encontramos na sexta-feira em março e na Páscoa.", fr: "Nous nous retrouvons le vendredi en mars, et à Pâques.", de: "Wir treffen uns freitags im März und an Ostern.", it: "Ci incontriamo il venerdì a marzo e a Pasqua.", pl: "Spotykamy się w piątek w marcu i na Wielkanoc.", tr: "Mart ayında cuma günü ve Paskalya’da buluşuyoruz.", id: "Kami bertemu pada hari Jumat di bulan Maret, dan pada Paskah.", vi: "Chúng tôi gặp nhau vào thứ Sáu trong tháng 3 và vào lễ Phục sinh." }
          - level: B2
            rule: { en: "small letter for seasons", uk: "мала літера для пір року", es: "minúscula para las estaciones", pt: "minúscula para as estações", fr: "minuscule pour les saisons", de: "Kleinbuchstabe für Jahreszeiten", it: "minuscola per le stagioni", pl: "mała litera w nazwach pór roku", tr: "mevsimler küçük harfle yazılır", id: "huruf kecil untuk musim", vi: "chữ thường cho các mùa" }
            ex: ["We go skiing in ", { target: "winter" }, "."]
            tr: { uk: "Взимку ми катаємося на лижах.", es: "Vamos a esquiar en invierno.", pt: "Vamos esquiar no inverno.", fr: "Nous faisons du ski en hiver.", de: "Im Winter fahren wir Ski.", it: "In inverno andiamo a sciare.", pl: "Zimą jeździmy na nartach.", tr: "Kışın kayak yapmaya gideriz.", id: "Kami bermain ski pada musim dingin.", vi: "Chúng tôi đi trượt tuyết vào mùa đông." }
          - level: B2
            rule: { en: "capital for a title before a name; small letter for a title on its own", uk: "велика літера для титулу чи посади перед іменем; мала — для посади окремо", es: "mayúscula para un título antes de un nombre; minúscula para un título solo", pt: "maiúscula para um título antes de um nome; minúscula para um título sozinho", fr: "majuscule pour un titre devant un nom ; minuscule pour un titre seul", de: "Großbuchstabe für einen Titel vor einem Namen; Kleinbuchstabe für einen Titel allein", it: "maiuscola per un titolo prima del nome; minuscola per un titolo da solo", pl: "wielka litera w tytule przed nazwiskiem; mała litera w tytule użytym samodzielnie", tr: "addan önceki unvan büyük harfle, tek başına kullanılan unvan küçük harfle yazılır", id: "huruf kapital untuk gelar sebelum nama; huruf kecil untuk gelar yang berdiri sendiri", vi: "chữ hoa cho chức danh đứng trước tên; chữ thường cho chức danh đứng một mình" }
            ex: ["I met ", { target: "Dr Khan" }, " and ", { target: "the prime minister" }, "."]
            tr: { uk: "Я зустрів доктора Хана та прем’єр-міністра.", es: "Conocí al doctor Khan y al primer ministro.", pt: "Conheci o doutor Khan e o primeiro-ministro.", fr: "J’ai rencontré le docteur Khan et le premier ministre.", de: "Ich habe Doktor Khan und den Premierminister getroffen.", it: "Ho incontrato il dottor Khan e il primo ministro.", pl: "Poznałem doktora Khana i premiera.", tr: "Doktor Khan’la ve başbakanla tanıştım.", id: "Saya bertemu Dokter Khan dan perdana menteri.", vi: "Tôi đã gặp bác sĩ Khan và thủ tướng." }
          - level: B2
            rule: { en: "capitals on the main words of a title; small letters on articles, prepositions and conjunctions inside it", uk: "в англійській у назві твору з великої літери пишуть головні слова, а артиклі, прийменники й сполучники всередині назви — з малої", es: "en inglés, en el título de una obra las palabras principales llevan mayúscula y los artículos, preposiciones y conjunciones internos, minúscula", pt: "em inglês, no título de uma obra as palavras principais levam maiúscula e os artigos, preposições e conjunções internos, minúscula", fr: "en anglais, dans le titre d’une œuvre, les mots principaux prennent une majuscule, et les articles, prépositions et conjonctions internes une minuscule", de: "im Englischen werden im Titel eines Werks die wichtigen Wörter großgeschrieben, Artikel, Präpositionen und Konjunktionen darin kleingeschrieben", it: "in inglese, nel titolo di un'opera le parole principali hanno la maiuscola, mentre articoli, preposizioni e congiunzioni interni hanno la minuscola", pl: "w angielskim w tytule dzieła główne wyrazy piszemy wielką literą, a rodzajniki, przyimki i spójniki wewnątrz tytułu — małą", tr: "İngilizcede bir eserin başlığında ana sözcükler büyük harfle, içindeki artikeller, edatlar ve bağlaçlar küçük harfle yazılır", id: "dalam judul karya, kata utama memakai huruf kapital, sedangkan artikel, preposisi, dan konjungsi di dalamnya memakai huruf kecil", vi: "trong nhan đề một tác phẩm tiếng Anh, từ chính viết hoa, còn mạo từ, giới từ và liên từ bên trong viết thường" }
            ex: ["I loved ", { target: "The Lord of the Rings" }, "."]
            tr: { uk: "Мені дуже сподобався Володар перснів.", es: "Me encantó El señor de los anillos.", pt: "Eu adorei O Senhor dos Anéis.", fr: "J’ai adoré Le Seigneur des anneaux.", de: "Ich habe Der Herr der Ringe geliebt.", it: "Ho amato Il Signore degli Anelli.", pl: "Uwielbiałem Władcę Pierścieni.", tr: "Yüzüklerin Efendisi’ni çok sevdim.", id: "Saya menyukai The Lord of the Rings.", vi: "Tôi rất thích Chúa tể những chiếc nhẫn." }
          - level: B2
            rule: { en: "capital for every letter of an acronym", uk: "велика літера для кожної літери абревіатури", es: "mayúscula en cada letra de una sigla", pt: "maiúscula em cada letra de uma sigla", fr: "majuscule pour chaque lettre d’un sigle", de: "Großbuchstabe für jeden Buchstaben eines Akronyms", it: "maiuscola per ogni lettera di una sigla", pl: "wielka litera dla każdej litery akronimu", tr: "akronimin her harfi büyük harfle yazılır", id: "huruf kapital untuk setiap huruf akronim", vi: "chữ hoa cho mọi chữ cái của từ viết tắt" }
            ex: ["Both ", { target: "NASA" }, " and the ", { target: "EU" }, " fund the project."]
            tr: { uk: "І НАСА, і ЄС фінансують проєкт.", es: "Tanto la NASA como la UE financian el proyecto.", pt: "Tanto a NASA quanto a UE financiam o projeto.", fr: "La NASA et l’UE financent toutes deux le projet.", de: "Sowohl die NASA als auch die EU finanzieren das Projekt.", it: "Sia la NASA sia l'UE finanziano il progetto.", pl: "Zarówno NASA, jak i UE finansują projekt.", tr: "Hem NASA hem de AB projeyi finanse ediyor.", id: "NASA dan Uni Eropa sama-sama mendanai proyek itu.", vi: "Cả NASA và EU đều tài trợ cho dự án." }
          - level: B2
            rule: { en: "capital for a compass point only when it is part of a name", uk: "велика літера для сторони світу лише тоді, коли вона є частиною назви", es: "mayúscula para un punto cardinal solo si forma parte de un nombre", pt: "maiúscula para um ponto cardeal só quando faz parte de um nome", fr: "majuscule pour un point cardinal seulement quand il fait partie d’un nom", de: "Großbuchstabe für eine Himmelsrichtung nur, wenn sie Teil eines Namens ist", it: "maiuscola per un punto cardinale solo quando fa parte di un nome", pl: "wielka litera w nazwie strony świata tylko wtedy, gdy jest częścią nazwy", tr: "yön adı yalnızca bir adın parçasıysa büyük harfle yazılır", id: "huruf kapital untuk arah mata angin hanya bila menjadi bagian dari nama", vi: "chữ hoa cho hướng la bàn chỉ khi nó là một phần của tên" }
            ex: { contrast: [["We drove ", { target: "south" }, "."], ["She was born in ", { target: "South" }, " Africa."]] }
            tr: { uk: { examples: ["Ми поїхали на південь.", "Вона народилася в Південній Африці."] }, es: { examples: ["Condujimos hacia el sur.", "Nació en Sudáfrica."] }, pt: { examples: ["Dirigimos para o sul.", "Ela nasceu na África do Sul."] }, fr: { examples: ["Nous avons roulé vers le sud.", "Elle est née en Afrique du Sud."] }, de: { examples: ["Wir fuhren nach Süden.", "Sie wurde in Südafrika geboren."] }, it: { examples: ["Abbiamo guidato verso sud.", "È nata in Sudafrica."] }, pl: { examples: ["Pojechaliśmy na południe.", "Urodziła się w Afryce Południowej."] }, tr: { examples: ["Güneye doğru araba sürdük.", "Güney Afrika’da doğdu."] }, id: { examples: ["Kami mengemudi ke arah selatan.", "Dia lahir di Afrika Selatan."] }, vi: { examples: ["Chúng tôi lái xe về phía nam.", "Cô ấy sinh ra ở Nam Phi."] } }

  - title: { en: "Layout: paragraphs, letters and emails", uk: "Оформлення: абзаци, листи та електронні листи", es: "Presentación: párrafos, cartas y correos electrónicos", pt: "Layout: parágrafos, cartas e e-mails", fr: "Mise en page : paragraphes, lettres et courriels", de: "Layout: Absätze, Briefe und E-Mails", it: "Impaginazione: paragrafi, lettere ed email", pl: "Układ tekstu: akapity, listy i e-maile", tr: "Düzen: paragraflar, mektuplar ve e-postalar", id: "Tata letak: paragraf, surat, dan email", vi: "Bố cục: đoạn văn, thư và email" }
    role: own
    content:
