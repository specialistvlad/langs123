            tr: { uk: "Ми відвідали Лідс, в Англії; Кардіфф, в Уельсі; і Белфаст, у Північній Ірландії.", es: "Visitamos Leeds, en Inglaterra; Cardiff, en Gales; y Belfast, en Irlanda del Norte.", pt: "Visitamos Leeds, na Inglaterra; Cardiff, no País de Gales; e Belfast, na Irlanda do Norte.", fr: "Nous avons visité Leeds, en Angleterre ; Cardiff, au pays de Galles ; et Belfast, en Irlande du Nord.", de: "Wir besuchten Leeds, in England; Cardiff, in Wales; und Belfast, in Nordirland.", it: "Abbiamo visitato Leeds, in Inghilterra; Cardiff, in Galles; e Belfast, in Irlanda del Nord.", pl: "Odwiedziliśmy Leeds, w Anglii; Cardiff, w Walii; oraz Belfast, w Irlandii Północnej.", tr: "Leeds’i (İngiltere), Cardiff’i (Galler) ve Belfast’ı (Kuzey İrlanda) gezdik.", id: "Kami mengunjungi Leeds, di Inggris; Cardiff, di Wales; dan Belfast, di Irlandia Utara.", vi: "Chúng tôi đã thăm Leeds, ở Anh; Cardiff, ở xứ Wales; và Belfast, ở Bắc Ireland." }

