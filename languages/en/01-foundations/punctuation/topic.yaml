          - level: C1
            rule: { en: "titles of articles, poems, songs and chapters take quotation marks", uk: "назви статей, віршів, пісень і розділів беруть у лапки", es: "los títulos de artículos, poemas, canciones y capítulos van entre comillas", pt: "os títulos de artigos, poemas, músicas e capítulos levam aspas", fr: "les titres d’articles, de poèmes, de chansons et de chapitres prennent des guillemets", de: "Titel von Artikeln, Gedichten, Liedern und Kapiteln stehen in Anführungszeichen", it: "i titoli di articoli, poesie, canzoni e capitoli vanno tra virgolette", pl: "tytuły artykułów, wierszy, piosenek i rozdziałów bierzemy w cudzysłów", tr: "makale, şiir, şarkı ve bölüm adları tırnak içine alınır", id: "judul artikel, puisi, lagu, dan bab memakai tanda petik", vi: "nhan đề bài báo, bài thơ, bài hát và chương đặt trong dấu ngoặc kép" }
