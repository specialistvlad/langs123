          - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            point: { en: "parentheses", uk: "круглі дужки", es: "paréntesis", pt: "parênteses", fr: "parenthèses", de: "runde Klammern", it: "parentesi tonde", pl: "nawiasy okrągłe", tr: "parantez", id: "tanda kurung", vi: "dấu ngoặc đơn" }
            rule: { en: "hold an aside that can be removed; the full stop stays outside", uk: "містять вставну інформацію, яку можна прибрати; крапка залишається ззовні", es: "encierran un inciso que se puede quitar; el punto queda fuera", pt: "contêm uma informação extra que pode ser retirada; o ponto final fica fora", fr: "contiennent une incise qu’on peut supprimer ; le point reste à l’extérieur", de: "enthalten einen Einschub, den man weglassen kann; der Punkt bleibt außerhalb", it: "contengono un inciso che si può togliere; il punto resta fuori", pl: "obejmują wtrącenie, które można usunąć; kropka zostaje na zewnątrz", tr: "çıkarılabilecek bir ara ifadeyi içerir; nokta dışarıda kalır", id: "memuat sisipan yang dapat dihapus; titik tetap di luar", vi: "chứa phần chen thêm có thể bỏ đi; dấu chấm nằm bên ngoài" }
            ex: ["We left early ", { optional: "at six" }, "."]
            tr: { uk: "Ми пішли рано (о шостій).", es: "Nos fuimos temprano (a las seis).", pt: "Saímos cedo (às seis).", fr: "Nous sommes partis tôt (à six heures).", de: "Wir sind früh gegangen (um sechs).", it: "Siamo andati via presto (alle sei).", pl: "Wyszliśmy wcześnie (o szóstej).", tr: "Erken çıktık (altıda).", id: "Kami pergi lebih awal (pukul enam).", vi: "Chúng tôi đi sớm (lúc sáu giờ)." }
          - level: C1
            point: { en: "parentheses", uk: "круглі дужки", es: "paréntesis", pt: "parênteses", fr: "parenthèses", de: "runde Klammern", it: "parentesi tonde", pl: "nawiasy okrągłe", tr: "parantez", id: "tanda kurung", vi: "dấu ngoặc đơn" }
            rule: { en: "keep the full stop inside when they hold a whole sentence", uk: "тримають крапку всередині, коли в них ціле речення", es: "llevan el punto dentro cuando encierran una oración entera", pt: "mantêm o ponto final dentro quando contêm uma frase inteira", fr: "gardent le point à l’intérieur quand elles contiennent une phrase entière", de: "behalten den Punkt innen, wenn sie einen ganzen Satz enthalten", it: "tengono il punto dentro quando racchiudono una frase intera", pl: "zachowują kropkę wewnątrz, gdy obejmują całe zdanie", tr: "tam bir cümle içerdiğinde nokta içeride kalır", id: "menyimpan titik di dalam bila memuat satu kalimat utuh", vi: "giữ dấu chấm bên trong khi chứa cả một câu" }
            ex: ["We left early. ", { optional: "It was raining." }]
            tr: { uk: "Ми пішли рано. (Йшов дощ.)", es: "Nos fuimos temprano. (Estaba lloviendo.)", pt: "Saímos cedo. (Estava chovendo.)", fr: "Nous sommes partis tôt. (Il pleuvait.)", de: "Wir sind früh gegangen. (Es regnete.)", it: "Siamo andati via presto. (Pioveva.)", pl: "Wyszliśmy wcześnie. (Padało.)", tr: "Erken çıktık. (Yağmur yağıyordu.)", id: "Kami pergi lebih awal. (Hujan turun.)", vi: "Chúng tôi đi sớm. (Trời đang mưa.)" }
          - level: C1
            point: { en: "square brackets", uk: "квадратні дужки", es: "corchetes", pt: "colchetes", fr: "crochets", de: "eckige Klammern", it: "parentesi quadre", pl: "nawiasy kwadratowe", tr: "köşeli parantez", id: "tanda kurung siku", vi: "dấu ngoặc vuông" }
            rule: { en: ["add the writer’s words inside a quotation; ", { term: "[sic]" }, " marks a mistake in the original"], uk: ["додають слова автора тексту всередині цитати; ", { term: "[sic]" }, " позначає помилку в оригіналі"], es: ["añaden palabras de quien escribe dentro de una cita; ", { term: "[sic]" }, " señala un error del original"], pt: ["acrescentam palavras de quem escreve dentro de uma citação; ", { term: "[sic]" }, " marca um erro do original"], fr: ["ajoutent des mots de l’auteur à l’intérieur d’une citation ; ", { term: "[sic]" }, " signale une erreur de l’original"], de: ["fügen Worte des Schreibenden in ein Zitat ein; ", { term: "[sic]" }, " kennzeichnet einen Fehler im Original"], it: ["aggiungono parole di chi scrive dentro una citazione; ", { term: "[sic]" }, " segnala un errore dell'originale"], pl: ["dodają słowa piszącego wewnątrz cytatu; ", { term: "[sic]" }, " oznacza błąd w oryginale"], tr: ["alıntının içine yazarın kendi sözlerini ekler; ", { term: "[sic]" }, " özgün metindeki bir hatayı gösterir"], id: ["menambahkan kata penulis di dalam kutipan; ", { term: "[sic]" }, " menandai kesalahan dalam aslinya"], vi: ["thêm lời của người viết vào bên trong đoạn trích; ", { term: "[sic]" }, " đánh dấu một lỗi trong bản gốc"] }
            ex: ["‘He ", { target: "[the manager]" }, " said no.’"]
            tr: { uk: "«Він [менеджер] відмовив».", es: "«Él [el gerente] dijo que no».", pt: "“Ele [o gerente] disse não.”", fr: "« Il [le directeur] a dit non. »", de: "„Er [der Manager] sagte nein.“", it: "«Lui [il direttore] ha detto di no».", pl: "„On [kierownik] powiedział nie.”", tr: "“O [müdür] hayır dedi.”", id: "“Dia [manajer itu] menolak.”", vi: "“Ông ấy [người quản lý] đã nói không.”" }
          - level: C1
            point: { en: ["ellipsis ", { letter: "..." }], uk: ["три крапки ", { letter: "..." }], es: ["puntos suspensivos ", { letter: "..." }], pt: ["reticências ", { letter: "..." }], fr: ["points de suspension ", { letter: "..." }], de: ["Auslassungspunkte ", { letter: "..." }], it: ["puntini di sospensione ", { letter: "..." }], pl: ["wielokropek ", { letter: "..." }], tr: ["üç nokta ", { letter: "..." }], id: ["elipsis ", { letter: "..." }], vi: ["dấu ba chấm ", { letter: "..." }] }
            rule: { en: "three full stops show words left out of a quotation, or a pause", uk: "три крапки показують слова, пропущені в цитаті, або паузу", es: "tres puntos muestran palabras omitidas de una cita, o una pausa", pt: "três pontos mostram palavras omitidas de uma citação, ou uma pausa", fr: "trois points montrent des mots omis dans une citation, ou une pause", de: "drei Punkte zeigen ausgelassene Worte in einem Zitat oder eine Pause an", it: "tre punti indicano parole omesse da una citazione, oppure una pausa", pl: "trzy kropki oznaczają słowa pominięte w cytacie albo pauzę", tr: "üç nokta alıntıda atlanan sözleri ya da bir duraklamayı gösterir", id: "tiga titik menunjukkan kata yang dihilangkan dari kutipan, atau jeda", vi: "ba dấu chấm cho biết những từ bị lược khỏi đoạn trích, hoặc một quãng ngừng" }
            ex: ["‘The report ", { target: "..." }, " was late.’"]
            tr: { uk: "«Звіт ... запізнився».", es: "«El informe ... llegó tarde».", pt: "“O relatório ... atrasou.”", fr: "« Le rapport ... était en retard. »", de: "„Der Bericht ... kam zu spät.“", it: "«Il rapporto ... era in ritardo».", pl: "„Raport ... się spóźnił.”", tr: "“Rapor ... geç kaldı.”", id: "“Laporan ... terlambat.”", vi: "“Bản báo cáo ... bị trễ.”" }
          - level: C1
            point: { en: "slash", uk: "коса риска", es: "barra", pt: "barra", fr: "barre oblique", de: "Schrägstrich", it: "barra obliqua", pl: "ukośnik", tr: "eğik çizgi", id: "garis miring", vi: "dấu gạch chéo" }
            rule: { en: ["joins alternatives, with no spaces round it: ", { term: "and/or" }], uk: ["з’єднує варіанти, без пробілів навколо себе: ", { term: "and/or" }], es: ["une alternativas, sin espacios alrededor: ", { term: "and/or" }], pt: ["une alternativas, sem espaços em volta: ", { term: "and/or" }], fr: ["relie des variantes, sans espaces autour : ", { term: "and/or" }], de: ["verbindet Alternativen, ohne Leerzeichen drumherum: ", { term: "and/or" }], it: ["unisce alternative, senza spazi intorno: ", { term: "and/or" }], pl: ["łączy alternatywy, bez spacji wokół: ", { term: "and/or" }], tr: ["seçenekleri bağlar, çevresinde boşluk bırakılmaz: ", { term: "and/or" }], id: ["menghubungkan alternatif, tanpa spasi di sekelilingnya: ", { term: "and/or" }], vi: ["nối các lựa chọn, không có khoảng trắng xung quanh: ", { term: "and/or" }] }
            ex: ["Please bring a passport ", { target: "and/or" }, " a driving licence."]
            tr: { uk: "Візьміть із собою паспорт та/або водійське посвідчення.", es: "Traiga un pasaporte y/o una licencia de conducir.", pt: "Traga um passaporte e/ou uma carteira de motorista.", fr: "Veuillez apporter un passeport et/ou un permis de conduire.", de: "Bitte bringen Sie einen Reisepass und/oder einen Führerschein mit.", it: "Porti un passaporto e/o la patente di guida.", pl: "Proszę zabrać paszport i/lub prawo jazdy.", tr: "Lütfen pasaport ve/veya ehliyet getirin.", id: "Harap bawa paspor dan/atau SIM.", vi: "Vui lòng mang theo hộ chiếu và/hoặc bằng lái xe." }
          - level: C1
            point: { en: "bullet list", uk: "маркований список", es: "lista con viñetas", pt: "lista com marcadores", fr: "liste à puces", de: "Aufzählung mit Spiegelstrichen", it: "elenco puntato", pl: "lista punktowana", tr: "madde işaretli liste", id: "daftar berpoin", vi: "danh sách có dấu đầu dòng" }
            rule: { en: "a colon follows the lead-in, and every item ends the same way", uk: "після вступної частини стоїть двокрапка, і кожен пункт закінчується однаково", es: "tras la frase introductoria van dos puntos, y todos los elementos terminan igual", pt: "depois da frase de abertura vêm dois-pontos, e todos os itens terminam do mesmo modo", fr: "deux-points après la phrase d’introduction, et tous les éléments se terminent de la même façon", de: "nach der Einleitung steht ein Doppelpunkt, und alle Punkte enden gleich", it: "dopo la frase introduttiva vanno i due punti, e ogni voce termina allo stesso modo", pl: "po zdaniu wprowadzającym stoi dwukropek, a każdy punkt kończy się tak samo", tr: "giriş cümlesinden sonra iki nokta gelir ve her madde aynı biçimde biter", id: "titik dua mengikuti kalimat pengantar, dan setiap butir diakhiri dengan cara yang sama", vi: "sau câu dẫn có dấu hai chấm, và mọi mục kết thúc giống nhau" }

