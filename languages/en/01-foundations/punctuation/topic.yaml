  - title: { en: "Comma", uk: "Кома", es: "Coma", pt: "Vírgula", fr: "Virgule", de: "Komma", it: "Virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
    role: own
