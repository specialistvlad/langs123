        - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { en: "Sentence end", uk: "Кінець речення", es: "Fin de la oración", pt: "Fim da frase", fr: "Fin de phrase", de: "Satzende", it: "Fine della frase", pl: "Koniec zdania", tr: "Cümle sonu", id: "Akhir kalimat", vi: "Cuối câu" }
          rule: { en: "full stop after an indirect question, question mark after a direct one", uk: "крапка після непрямого питання, знак питання після прямого", es: "punto tras una pregunta indirecta, signo de interrogación tras una directa", pt: "ponto final depois de uma pergunta indireta, ponto de interrogação depois de uma direta", fr: "point après une question indirecte, point d’interrogation après une question directe", de: "Punkt nach einer indirekten Frage, Fragezeichen nach einer direkten", it: "punto dopo una domanda indiretta, punto interrogativo dopo una diretta", pl: "kropka po pytaniu zależnym, znak zapytania po pytaniu bezpośrednim", tr: "dolaylı sorudan sonra nokta, doğrudan sorudan sonra soru işareti", id: "titik setelah pertanyaan tak langsung, tanda tanya setelah pertanyaan langsung", vi: "dấu chấm sau câu hỏi gián tiếp, dấu chấm hỏi sau câu hỏi trực tiếp" }
          ex: { examples: [["She asked where I was going", { target: "." }], ["Where are you going", { target: "?" }]] }
          tr: { uk: { examples: ["Вона запитала, куди я йду.", "Куди ти йдеш?"] }, es: { examples: ["Preguntó adónde iba.", "¿Adónde vas?"] }, pt: { examples: ["Ela perguntou aonde eu ia.", "Aonde você vai?"] }, fr: { examples: ["Elle a demandé où j’allais.", "Où vas-tu ?"] }, de: { examples: ["Sie fragte, wohin ich gehe.", "Wohin gehst du?"] }, it: { examples: ["Mi ha chiesto dove stavo andando.", "Dove stai andando?"] }, pl: { examples: ["Zapytała, dokąd idę.", "Dokąd idziesz?"] }, tr: { examples: ["Nereye gittiğimi sordu.", "Nereye gidiyorsun?"] }, id: { examples: ["Dia bertanya ke mana saya pergi.", "Kamu mau ke mana?"] }, vi: { examples: ["Cô ấy hỏi tôi đi đâu.", "Bạn đi đâu?"] } }
        - level: B2
          point: { en: "Comma: clauses", uk: "Кома: речення", es: "Coma: oraciones", pt: "Vírgula: orações", fr: "Virgule : propositions", de: "Komma: Sätze", it: "Virgola: proposizioni", pl: "Przecinek: zdania", tr: "Virgül: cümleler", id: "Koma: klausa", vi: "Dấu phẩy: mệnh đề" }
          rule: { en: ["after an opening clause; before ", { term: "but" }, ", ", { term: "so" }, " or ", { term: "yet" }], uk: ["після підрядного речення на початку; перед ", { term: "but" }, ", ", { term: "so" }, " або ", { term: "yet" }], es: ["tras una oración inicial; antes de ", { term: "but" }, ", ", { term: "so" }, " o ", { term: "yet" }], pt: ["depois de uma oração inicial; antes de ", { term: "but" }, ", ", { term: "so" }, " ou ", { term: "yet" }], fr: ["après une proposition en début de phrase ; avant ", { term: "but" }, ", ", { term: "so" }, " ou ", { term: "yet" }], de: ["nach einem vorangestellten Nebensatz; vor ", { term: "but" }, ", ", { term: "so" }, " oder ", { term: "yet" }], it: ["dopo una proposizione iniziale; prima di ", { term: "but" }, ", ", { term: "so" }, " o ", { term: "yet" }], pl: ["po zdaniu na początku; przed ", { term: "but" }, ", ", { term: "so" }, " lub ", { term: "yet" }], tr: ["baştaki cümleden sonra; ", { term: "but" }, ", ", { term: "so" }, " ve ", { term: "yet" }, " öncesinde"], id: ["setelah klausa pembuka; sebelum ", { term: "but" }, ", ", { term: "so" }, " atau ", { term: "yet" }], vi: ["sau mệnh đề mở đầu; trước ", { term: "but" }, ", ", { term: "so" }, " hoặc ", { term: "yet" }] }
          ex: { examples: [["If it rains", { target: "," }, " we stay in."], ["I was tired", { target: "," }, " so I went home."]] }
          tr: { uk: { examples: ["Якщо піде дощ, ми залишимося вдома.", "Я втомився, тому пішов додому."] }, es: { examples: ["Si llueve, nos quedamos en casa.", "Estaba cansado, así que me fui a casa."] }, pt: { examples: ["Se chover, ficamos em casa.", "Eu estava cansado, então fui para casa."] }, fr: { examples: ["S’il pleut, nous restons à la maison.", "J’étais fatigué, alors je suis rentré."] }, de: { examples: ["Wenn es regnet, bleiben wir zu Hause.", "Ich war müde, also bin ich nach Hause gegangen."] }, it: { examples: ["Se piove, restiamo a casa.", "Ero stanco, così sono andato a casa."] }, pl: { examples: ["Jeśli będzie padać, zostajemy w domu.", "Byłem zmęczony, więc poszedłem do domu."] }, tr: { examples: ["Yağmur yağarsa evde kalırız.", "Yorgundum, bu yüzden eve gittim."] }, id: { examples: ["Kalau hujan, kami tinggal di rumah.", "Saya lelah, jadi saya pulang."] }, vi: { examples: ["Nếu trời mưa, chúng tôi ở nhà.", "Tôi mệt nên tôi về nhà."] } }
        - level: B2
          point: { en: "Comma: asides", uk: "Кома: додаткова інформація", es: "Coma: información extra", pt: "Vírgula: informação extra", fr: "Virgule : précisions", de: "Komma: Einschübe", it: "Virgola: incisi", pl: "Przecinek: wtrącenia", tr: "Virgül: ara ifadeler", id: "Koma: keterangan tambahan", vi: "Dấu phẩy: thông tin thêm" }
          rule: { en: "a pair of commas round extra information", uk: "пара ком навколо додаткової інформації", es: "un par de comas rodea la información extra", pt: "um par de vírgulas em volta da informação extra", fr: "une paire de virgules autour d’une information supplémentaire", de: "ein Kommapaar um zusätzliche Information", it: "una coppia di virgole intorno a un'informazione extra", pl: "para przecinków wokół dodatkowej informacji", tr: "ek bilginin iki yanında bir çift virgül", id: "sepasang koma mengapit informasi tambahan", vi: "một cặp dấu phẩy bao quanh thông tin thêm" }
          ex: ["Anna", { target: "," }, " who lives here", { target: "," }, " is a nurse."]
          tr: { uk: "Анна, яка живе тут, — медсестра.", es: "Anna, que vive aquí, es enfermera.", pt: "A Anna, que mora aqui, é enfermeira.", fr: "Anna, qui habite ici, est infirmière.", de: "Anna, die hier wohnt, ist Krankenschwester.", it: "Anna, che abita qui, è infermiera.", pl: "Anna, która tu mieszka, jest pielęgniarką.", tr: "Burada yaşayan Anna bir hemşire.", id: "Anna, yang tinggal di sini, adalah seorang perawat.", vi: "Anna, người sống ở đây, là y tá." }
        - level: B2
          point: { en: "Apostrophe", uk: "Апостроф", es: "Apóstrofo", pt: "Apóstrofo", fr: "Apostrophe", de: "Apostroph", it: "Apostrofo", pl: "Apostrof", tr: "Kesme işareti", id: "Apostrof", vi: "Dấu nháy đơn" }
          rule: { en: "contractions and possession; none in plurals or in its", uk: "скорочення й належність; немає в множині та в its", es: "contracciones y posesión; no se usa en plurales ni en its", pt: "contrações e posse; não se usa em plurais nem em its", fr: "contractions et possession ; pas dans les pluriels ni dans its", de: "Kurzformen und Besitz; nicht in Pluralen und nicht bei its", it: "contrazioni e possesso; mai nei plurali né in its", pl: "skróty i przynależność; brak w liczbie mnogiej i w its", tr: "kısaltmalar ve sahiplik; çoğulda ve its sözcüğünde kullanılmaz", id: "kontraksi dan kepemilikan; tidak dipakai pada jamak dan pada its", vi: "dạng rút gọn và sở hữu; không dùng cho số nhiều và trong its" }
          ex: { examples: [["I ", { target: "don’t" }, " know."], ["two ", { target: "CDs" }], ["the dog wagged ", { target: "its" }, " tail"]] }
          tr: { uk: { examples: ["Я не знаю.", "два компакт-диски", "собака виляла хвостом"] }, es: { examples: ["No sé.", "dos CD", "el perro movió la cola"] }, pt: { examples: ["Eu não sei.", "dois CDs", "o cachorro balançou o rabo"] }, fr: { examples: ["Je ne sais pas.", "deux CD", "le chien a remué la queue"] }, de: { examples: ["Ich weiß es nicht.", "zwei CDs", "der Hund wedelte mit dem Schwanz"] }, it: { examples: ["Non lo so.", "due CD", "il cane scodinzolava"] }, pl: { examples: ["Nie wiem.", "dwie płyty CD", "pies machał ogonem"] }, tr: { examples: ["Bilmiyorum.", "iki CD", "köpek kuyruğunu salladı"] }, id: { examples: ["Saya tidak tahu.", "dua CD", "anjing itu mengibaskan ekornya"] }, vi: { examples: ["Tôi không biết.", "hai đĩa CD", "con chó vẫy đuôi"] } }
        - level: B2
          point: { en: "Colon and semicolon", uk: "Двокрапка й крапка з комою", es: "Dos puntos y punto y coma", pt: "Dois-pontos e ponto e vírgula", fr: "Deux-points et point-virgule", de: "Doppelpunkt und Semikolon", it: "Due punti e punto e virgola", pl: "Dwukropek i średnik", tr: "İki nokta ve noktalı virgül", id: "Titik dua dan titik koma", vi: "Dấu hai chấm và dấu chấm phẩy" }
          rule: { en: "colon introduces; semicolon joins related clauses", uk: "двокрапка вводить; крапка з комою з’єднує пов’язані речення", es: "los dos puntos introducen; el punto y coma une oraciones relacionadas", pt: "os dois-pontos introduzem; o ponto e vírgula une orações relacionadas", fr: "les deux-points introduisent ; le point-virgule relie des propositions liées", de: "der Doppelpunkt leitet ein; das Semikolon verbindet zusammengehörige Sätze", it: "i due punti introducono; il punto e virgola unisce proposizioni collegate", pl: "dwukropek wprowadza; średnik łączy powiązane zdania", tr: "iki nokta açıklama başlatır; noktalı virgül ilgili cümleleri bağlar", id: "titik dua memperkenalkan; titik koma menghubungkan klausa yang berkaitan", vi: "dấu hai chấm dẫn vào; dấu chấm phẩy nối các mệnh đề có liên quan" }
          ex: { examples: [["Two options", { target: ":" }, " stay or go."], ["Tom likes tea", { target: ";" }, " Ana likes coffee."]] }
          tr: { uk: { examples: ["Є два варіанти: залишитися або піти.", "Том любить чай; Ана любить каву."] }, es: { examples: ["Hay dos opciones: quedarse o irse.", "A Tom le gusta el té; a Ana le gusta el café."] }, pt: { examples: ["Duas opções: ficar ou ir.", "O Tom gosta de chá; a Ana gosta de café."] }, fr: { examples: ["Deux options : rester ou partir.", "Tom aime le thé ; Ana aime le café."] }, de: { examples: ["Zwei Möglichkeiten: bleiben oder gehen.", "Tom mag Tee; Ana mag Kaffee."] }, it: { examples: ["Due opzioni: restare o andare.", "A Tom piace il tè; ad Ana piace il caffè."] }, pl: { examples: ["Dwie opcje: zostać albo iść.", "Tom lubi herbatę; Ana lubi kawę."] }, tr: { examples: ["İki seçenek var: kalmak ya da gitmek.", "Tom çayı sever; Ana kahveyi sever."] }, id: { examples: ["Ada dua pilihan: tinggal atau pergi.", "Tom suka teh; Ana suka kopi."] }, vi: { examples: ["Có hai lựa chọn: ở lại hoặc đi.", "Tom thích trà; Ana thích cà phê."] } }
        - level: B2
          point: { en: "Hyphen and dash", uk: "Дефіс і тире", es: "Guion y raya", pt: "Hífen e travessão", fr: "Trait d’union et tiret", de: "Bindestrich und Gedankenstrich", it: "Trattino e lineetta", pl: "Łącznik i myślnik", tr: "Kısa çizgi ve tire", id: "Tanda hubung dan tanda pisah", vi: "Dấu gạch nối và dấu gạch ngang" }
          rule: { en: "hyphen before the noun, none after; en dash for ranges", uk: "дефіс перед іменником, після нього — ні; коротке тире для діапазонів", es: "guion antes del sustantivo, no después; semirraya para los rangos", pt: "hífen antes do substantivo, não depois; meia-risca para intervalos", fr: "trait d’union avant le nom, pas après ; tiret demi-cadratin pour les intervalles", de: "Bindestrich vor dem Nomen, nicht danach; Halbgeviertstrich für Bereiche", it: "trattino prima del sostantivo, non dopo; trattino medio per gli intervalli", pl: "łącznik przed rzeczownikiem, nie po nim; półpauza w zakresach", tr: "isimden önce kısa çizgi, sonra yok; aralıklar için orta tire", id: "tanda hubung sebelum kata benda, tidak setelahnya; tanda pisah en untuk rentang", vi: "dấu gạch nối đứng trước danh từ, không dùng sau nó; dấu gạch ngang ngắn cho khoảng" }
          ex: { examples: [["a ", { target: "well-known" }, " author"], ["the years ", { target: "1990–2000" }]] }
          tr: { uk: { examples: ["відомий автор", "роки 1990–2000"] }, es: { examples: ["un autor muy conocido", "los años 1990–2000"] }, pt: { examples: ["um autor muito conhecido", "os anos 1990–2000"] }, fr: { examples: ["un auteur bien connu", "les années 1990–2000"] }, de: { examples: ["ein bekannter Autor", "die Jahre 1990–2000"] }, it: { examples: ["un autore molto noto", "gli anni 1990–2000"] }, pl: { examples: ["znany autor", "lata 1990–2000"] }, tr: { examples: ["tanınmış bir yazar", "1990–2000 yılları"] }, id: { examples: ["penulis yang terkenal", "tahun 1990–2000"] }, vi: { examples: ["một tác giả nổi tiếng", "những năm 1990–2000"] } }
        - level: B2
          point: { en: "Quotation marks", uk: "Лапки", es: "Comillas", pt: "Aspas", fr: "Guillemets", de: "Anführungszeichen", it: "Virgolette", pl: "Cudzysłów", tr: "Tırnak işareti", id: "Tanda petik", vi: "Dấu ngoặc kép" }
          rule: { en: "single marks; the comma stands inside them before the speaker", uk: "одинарні лапки; перед словами автора кома стоїть всередині лапок", es: "comillas simples; la coma va dentro, antes de quien habla", pt: "aspas simples; a vírgula fica dentro delas, antes de quem fala", fr: "guillemets simples ; la virgule reste à l’intérieur, avant celui qui parle", de: "einfache Anführungszeichen; das Komma steht innerhalb, vor dem Sprecher", it: "virgolette singole; la virgola sta dentro, prima di chi parla", pl: "pojedynczy cudzysłów; przecinek stoi w środku, przed osobą mówiącą", tr: "tek tırnak; konuşanı belirtmeden önce virgül tırnağın içinde kalır", id: "tanda petik tunggal; koma berada di dalamnya sebelum penutur", vi: "dấu ngoặc kép đơn; dấu phẩy nằm bên trong, trước người nói" }
          ex: ["‘Come in", { target: ",’" }, " she said."]
          tr: { uk: "«Заходьте», — сказала вона.", es: "«Entra», dijo ella.", pt: "“Entre”, disse ela.", fr: "« Entre », dit-elle.", de: "„Komm herein“, sagte sie.", it: "«Entra», disse lei.", pl: "„Wejdź”, powiedziała.", tr: "“İçeri gel,” dedi.", id: "“Masuklah,” katanya.", vi: "“Mời vào,” cô ấy nói." }
        - level: B2
          point: { en: "Capital letters", uk: "Великі літери", es: "Mayúsculas", pt: "Letras maiúsculas", fr: "Majuscules", de: "Großschreibung", it: "Maiuscole", pl: "Wielkie litery", tr: "Büyük harfler", id: "Huruf kapital", vi: "Chữ hoa" }
          rule: { en: "names, nationalities, languages, days, months; not seasons", uk: "в англійській: імена й назви, національності, мови, дні, місяці — з великої літери; пори року — ні", es: "en inglés: nombres, nacionalidades, idiomas, días y meses con mayúscula; las estaciones, no", pt: "em inglês: nomes, nacionalidades, idiomas, dias e meses com maiúscula; as estações, não", fr: "en anglais : noms, nationalités, langues, jours et mois prennent une majuscule ; les saisons, non", de: "im Englischen: Namen, Nationalitäten, Sprachen, Tage und Monate groß; Jahreszeiten klein", it: "in inglese: nomi, nazionalità, lingue, giorni e mesi con la maiuscola; le stagioni no", pl: "w angielskim wielką literą: nazwy, narodowości, języki, dni i miesiące; pór roku nie", tr: "İngilizcede özel adlar, uyruklar, diller, günler ve aylar büyük harfle başlar; mevsimler başlamaz", id: "dalam bahasa Inggris: nama, kebangsaan, bahasa, hari, dan bulan memakai huruf kapital; musim tidak", vi: "trong tiếng Anh: tên, quốc tịch, ngôn ngữ, thứ và tháng viết hoa; mùa thì không" }
          ex: ["She teaches ", { target: "Spanish" }, " on ", { target: "Mondays" }, " in summer."]
          tr: { uk: "Влітку вона викладає іспанську по понеділках.", es: "En verano da clases de español los lunes.", pt: "No verão, ela dá aulas de espanhol às segundas-feiras.", fr: "L’été, elle enseigne l’espagnol le lundi.", de: "Im Sommer unterrichtet sie montags Spanisch.", it: "D'estate insegna spagnolo il lunedì.", pl: "Latem uczy hiszpańskiego w poniedziałki.", tr: "Yazın pazartesi günleri İspanyolca öğretir.", id: "Pada musim panas, dia mengajar bahasa Spanyol setiap hari Senin.", vi: "Vào mùa hè, cô ấy dạy tiếng Tây Ban Nha vào các thứ Hai." }
        - level: C1
          point: { en: "Commas and meaning", uk: "Коми і значення", es: "Comas y significado", pt: "Vírgulas e significado", fr: "Virgules et sens", de: "Kommas und Bedeutung", it: "Virgole e significato", pl: "Przecinki a znaczenie", tr: "Virgül ve anlam", id: "Koma dan makna", vi: "Dấu phẩy và nghĩa" }
          rule: { en: "commas add information; without them the clause identifies", uk: "з комами речення додає інформацію; без ком воно вказує, про кого саме йдеться", es: "con comas, la oración añade información; sin comas, identifica", pt: "com vírgulas, a oração acrescenta informação; sem vírgulas, ela identifica", fr: "avec des virgules, la proposition ajoute une information ; sans virgules, elle identifie", de: "mit Kommas liefert der Satz Zusatzinformation; ohne Kommas legt er fest, wer gemeint ist", it: "con le virgole la proposizione aggiunge un'informazione; senza virgole identifica", pl: "z przecinkami zdanie dodaje informację; bez przecinków wskazuje, o kogo chodzi", tr: "virgüllü cümle ek bilgi verir; virgülsüz cümle kimden söz edildiğini belirtir", id: "dengan koma, klausa menambah informasi; tanpa koma, klausa menentukan yang mana", vi: "có dấu phẩy, mệnh đề thêm thông tin; không có dấu phẩy, mệnh đề xác định đối tượng" }
          ex: { contrast: ["my brother who lives in Leeds", ["my brother", { target: "," }, " who lives in Leeds", { target: "," }]] }
          tr: { uk: { examples: ["той мій брат, який живе в Лідсі", "мій брат, який, до речі, живе в Лідсі"] }, es: { examples: ["mi hermano que vive en Leeds", "mi hermano, que vive en Leeds,"] }, pt: { examples: ["meu irmão que mora em Leeds", "meu irmão, que mora em Leeds,"] }, fr: { examples: ["mon frère qui habite à Leeds", "mon frère, qui habite à Leeds,"] }, de: { examples: ["der Bruder, der in Leeds wohnt", "mein Bruder, der übrigens in Leeds wohnt,"] }, it: { examples: ["mio fratello che vive a Leeds", "mio fratello, che vive a Leeds,"] }, pl: { examples: ["ten brat, który mieszka w Leeds", "mój brat, który zresztą mieszka w Leeds,"] }, tr: { examples: ["Leeds’te yaşayan erkek kardeşim", "erkek kardeşim, ki Leeds’te yaşıyor,"] }, id: { examples: ["saudara laki-laki saya yang tinggal di Leeds", "saudara laki-laki saya, yang tinggal di Leeds,"] }, vi: { examples: ["người anh trai sống ở Leeds của tôi", "anh trai tôi, người sống ở Leeds,"] } }
