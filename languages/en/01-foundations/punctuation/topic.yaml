          rule: { en: ["comma after an opening participle or absolute phrase; none before ", { term: "that" }], uk: ["кома після дієприкметникового звороту або абсолютної конструкції на початку; перед ", { term: "that" }, " коми немає"], es: ["coma tras una frase inicial con participio o una construcción absoluta; sin coma antes de ", { term: "that" }], pt: ["vírgula depois de uma expressão inicial com particípio ou de uma construção absoluta; nenhuma antes de ", { term: "that" }], fr: ["virgule après un groupe participial ou une proposition absolue en début de phrase ; aucune devant ", { term: "that" }], de: ["Komma nach einer vorangestellten Partizipialgruppe oder absoluten Konstruktion; keins vor ", { term: "that" }], it: ["virgola dopo un sintagma participiale o una costruzione assoluta iniziale; nessuna prima di ", { term: "that" }], pl: ["przecinek po początkowym zwrocie imiesłowowym lub konstrukcji absolutnej; przed ", { term: "that" }, " go nie ma"], tr: ["başta gelen ortaç öbeğinden veya bağımsız yapıdan sonra virgül gelir; ", { term: "that" }, " öncesinde virgül yoktur"], id: ["koma setelah frasa partisipel atau konstruksi absolut di awal; tidak ada koma sebelum ", { term: "that" }], vi: ["dấu phẩy sau cụm phân từ hoặc cụm tuyệt đối ở đầu câu; không có dấu phẩy trước ", { term: "that" }] }
          ex: { examples: [["Having finished", { target: "," }, " she left."], ["The work done", { target: "," }, " they went home."]] }
          tr: { uk: { examples: ["Закінчивши, вона пішла.", "Коли роботу було закінчено, вони пішли додому."] }, es: { examples: ["Al terminar, se fue.", "Terminado el trabajo, se fueron a casa."] }, pt: { examples: ["Tendo terminado, ela saiu.", "Terminado o trabalho, eles foram para casa."] }, fr: { examples: ["Ayant fini, elle est partie.", "Le travail terminé, ils sont rentrés."] }, de: { examples: ["Als sie fertig war, ging sie.", "Nach getaner Arbeit gingen sie nach Hause."] }, it: { examples: ["Avendo finito, se ne andò.", "Finito il lavoro, tornarono a casa."] }, pl: { examples: ["Skończywszy, wyszła.", "Praca skończona, poszli do domu."] }, tr: { examples: ["İşini bitirince gitti.", "İş bitince eve gittiler."] }, id: { examples: ["Setelah selesai, dia pergi.", "Setelah pekerjaan selesai, mereka pulang."] }, vi: { examples: ["Làm xong, cô ấy đi.", "Công việc xong xuôi, họ về nhà."] } }
        - level: C1
