          - level: C1
            rule: { en: "title case begins every main word; sentence case begins only the first word and names", uk: "у заголовному стилі з великої літери починається кожне головне слово; у реченнєвому — лише перше слово та власні назви", es: "el estilo título pone mayúscula en cada palabra principal; el estilo oración solo en la primera palabra y en los nombres", pt: "no estilo título, cada palavra principal começa com maiúscula; no estilo frase, só a primeira palavra e os nomes", fr: "le style titre met une majuscule à chaque mot principal ; le style phrase seulement au premier mot et aux noms propres", de: "Title Case beginnt jedes wichtige Wort groß; Sentence Case nur das erste Wort und Namen", it: "il title case apre con la maiuscola ogni parola principale; il sentence case solo la prima parola e i nomi", pl: "w stylu tytułowym wielką literą zaczyna się każdy główny wyraz; w stylu zdaniowym tylko pierwszy wyraz i nazwy własne", tr: "başlık stilinde her ana sözcük büyük harfle başlar; cümle stilinde yalnızca ilk sözcük ve özel adlar", id: "title case memulai setiap kata utama dengan huruf kapital; sentence case hanya kata pertama dan nama", vi: "kiểu tiêu đề viết hoa mọi từ chính; kiểu câu chỉ viết hoa từ đầu tiên và tên riêng" }
