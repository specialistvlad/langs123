      - type: usage
        columns:
          - { key: rule, label: { en: "A comma", uk: "Кома", es: "La coma", pt: "A vírgula", fr: "La virgule", de: "Das Komma", it: "La virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            rule: { en: "separates the items of a list; the comma before the final and is optional", uk: "відокремлює елементи переліку; кома перед останнім and необов’язкова", es: "separa los elementos de una lista; la coma antes del and final es opcional", pt: "separa os itens de uma lista; a vírgula antes do and final é opcional", fr: "sépare les éléments d’une liste ; la virgule avant le and final est facultative", de: "trennt die Glieder einer Aufzählung; das Komma vor dem letzten and ist freiwillig", it: "separa gli elementi di un elenco; la virgola prima dell'and finale è facoltativa", pl: "oddziela elementy wyliczenia; przecinek przed ostatnim and jest nieobowiązkowy", tr: "bir sıralamanın öğelerini ayırır; son and’den önceki virgül isteğe bağlıdır", id: "memisahkan butir dalam daftar; koma sebelum and terakhir bersifat opsional", vi: "ngăn cách các mục trong danh sách; dấu phẩy trước and cuối cùng là tùy chọn" }
            ex: ["We bought apples", { target: "," }, " pears and plums. ", { variant: ["We bought apples, pears", { target: "," }, " and plums."], variety: en-US }]
            tr: { uk: "Ми купили яблука, груші та сливи.", es: "Compramos manzanas, peras y ciruelas.", pt: "Compramos maçãs, peras e ameixas.", fr: "Nous avons acheté des pommes, des poires et des prunes.", de: "Wir haben Äpfel, Birnen und Pflaumen gekauft.", it: "Abbiamo comprato mele, pere e prugne.", pl: "Kupiliśmy jabłka, gruszki i śliwki.", tr: "Elma, armut ve erik aldık.", id: "Kami membeli apel, pir, dan prem.", vi: "Chúng tôi mua táo, lê và mận." }
          - level: B2
            rule: { en: "follows an opening adverbial or clause", uk: "стоїть після вступного обставинного звороту або підрядного речення", es: "sigue a un complemento circunstancial o a una oración inicial", pt: "vem depois de um adjunto adverbial ou de uma oração no início", fr: "suit un complément circonstanciel ou une proposition en tête de phrase", de: "steht nach einer vorangestellten Adverbialbestimmung oder einem Nebensatz", it: "segue un complemento circostanziale o una proposizione iniziale", pl: "stoi po okoliczniku lub zdaniu na początku", tr: "baştaki zarf öbeğinden veya cümleden sonra gelir", id: "mengikuti keterangan atau klausa pembuka", vi: "đứng sau trạng ngữ hoặc mệnh đề mở đầu" }
            ex: { examples: [["If it rains", { target: "," }, " we stay in."], ["However", { target: "," }, " the room was cold."]] }
            tr: { uk: { examples: ["Якщо піде дощ, ми залишимося вдома.", "Проте в кімнаті було холодно."] }, es: { examples: ["Si llueve, nos quedamos en casa.", "Sin embargo, la habitación estaba fría."] }, pt: { examples: ["Se chover, ficamos em casa.", "No entanto, o quarto estava frio."] }, fr: { examples: ["S’il pleut, nous restons à la maison.", "Cependant, la pièce était froide."] }, de: { examples: ["Wenn es regnet, bleiben wir zu Hause.", "Allerdings war das Zimmer kalt."] }, it: { examples: ["Se piove, restiamo a casa.", "Tuttavia, la stanza era fredda."] }, pl: { examples: ["Jeśli będzie padać, zostajemy w domu.", "Jednak w pokoju było zimno."] }, tr: { examples: ["Yağmur yağarsa evde kalırız.", "Ancak oda soğuktu."] }, id: { examples: ["Kalau hujan, kami tinggal di rumah.", "Namun, kamar itu dingin."] }, vi: { examples: ["Nếu trời mưa, chúng tôi ở nhà.", "Tuy nhiên, căn phòng rất lạnh."] } }
          - level: B2
            rule: { en: ["comes before ", { term: "but" }, ", ", { term: "so" }, " or ", { term: "yet" }, " when it joins two main clauses"], uk: ["стоїть перед ", { term: "but" }, ", ", { term: "so" }, " або ", { term: "yet" }, ", коли вони з’єднують два головні речення"], es: ["va antes de ", { term: "but" }, ", ", { term: "so" }, " o ", { term: "yet" }, " cuando unen dos oraciones principales"], pt: ["vem antes de ", { term: "but" }, ", ", { term: "so" }, " ou ", { term: "yet" }, " quando eles unem duas orações principais"], fr: ["précède ", { term: "but" }, ", ", { term: "so" }, " ou ", { term: "yet" }, " quand ils relient deux propositions principales"], de: ["steht vor ", { term: "but" }, ", ", { term: "so" }, " oder ", { term: "yet" }, ", wenn sie zwei Hauptsätze verbinden"], it: ["precede ", { term: "but" }, ", ", { term: "so" }, " o ", { term: "yet" }, " quando uniscono due proposizioni principali"], pl: ["stoi przed ", { term: "but" }, ", ", { term: "so" }, " lub ", { term: "yet" }, ", gdy łączą dwa zdania główne"], tr: ["iki ana cümleyi bağlayan ", { term: "but" }, ", ", { term: "so" }, " veya ", { term: "yet" }, " öncesinde gelir"], id: ["diletakkan sebelum ", { term: "but" }, ", ", { term: "so" }, " atau ", { term: "yet" }, " ketika menghubungkan dua klausa utama"], vi: ["đứng trước ", { term: "but" }, ", ", { term: "so" }, " hoặc ", { term: "yet" }, " khi chúng nối hai mệnh đề chính"] }
            ex: ["The film was long", { target: "," }, " but we enjoyed it."]
            tr: { uk: "Фільм був довгим, але нам сподобався.", es: "La película fue larga, pero nos gustó.", pt: "O filme foi longo, mas nós gostamos dele.", fr: "Le film était long, mais nous l’avons aimé.", de: "Der Film war lang, aber er hat uns gefallen.", it: "Il film era lungo, ma ci è piaciuto.", pl: "Film był długi, ale nam się podobał.", tr: "Film uzundu ama beğendik.", id: "Filmnya panjang, tetapi kami menikmatinya.", vi: "Bộ phim dài nhưng chúng tôi thích." }
          - level: B2
            rule: { en: "opens and closes a non-defining clause or an added phrase", uk: "відкриває й закриває необмежувальне підрядне речення або додатковий зворот", es: "abre y cierra una oración explicativa o una frase añadida", pt: "abre e fecha uma oração explicativa ou uma expressão acrescentada", fr: "ouvre et ferme une proposition explicative ou un groupe ajouté", de: "öffnet und schließt einen nicht notwendigen Relativsatz oder einen Zusatz", it: "apre e chiude una proposizione non restrittiva o un inciso", pl: "otwiera i zamyka zdanie niedefiniujące lub dodane wtrącenie", tr: "açıklayıcı bir cümleyi veya eklenen bir öbeği açar ve kapatır", id: "membuka dan menutup klausa yang tidak membatasi atau frasa tambahan", vi: "mở đầu và kết thúc một mệnh đề không xác định hoặc một cụm thêm vào" }
            ex: { examples: [["Our neighbour", { target: "," }, " who is a nurse", { target: "," }, " helps us."], ["Tom", { target: "," }, " our new manager", { target: "," }, " starts today."]] }
            tr: { uk: { examples: ["Наша сусідка, яка працює медсестрою, допомагає нам.", "Том, наш новий менеджер, починає сьогодні."] }, es: { examples: ["Nuestro vecino, que es enfermero, nos ayuda.", "Tom, nuestro nuevo gerente, empieza hoy."] }, pt: { examples: ["Nosso vizinho, que é enfermeiro, nos ajuda.", "O Tom, nosso novo gerente, começa hoje."] }, fr: { examples: ["Notre voisin, qui est infirmier, nous aide.", "Tom, notre nouveau directeur, commence aujourd’hui."] }, de: { examples: ["Unser Nachbar, der Krankenpfleger ist, hilft uns.", "Tom, unser neuer Chef, fängt heute an."] }, it: { examples: ["Il nostro vicino, che è infermiere, ci aiuta.", "Tom, il nostro nuovo direttore, comincia oggi."] }, pl: { examples: ["Nasz sąsiad, który jest pielęgniarzem, nam pomaga.", "Tom, nasz nowy kierownik, zaczyna dzisiaj."] }, tr: { examples: ["Hemşire olan komşumuz bize yardım ediyor.", "Yeni müdürümüz Tom bugün başlıyor."] }, id: { examples: ["Tetangga kami, yang seorang perawat, membantu kami.", "Tom, manajer baru kami, mulai hari ini."] }, vi: { examples: ["Hàng xóm của chúng tôi, một y tá, giúp đỡ chúng tôi.", "Tom, quản lý mới của chúng tôi, bắt đầu từ hôm nay."] } }
          - level: B2
            rule: { en: "sets off the name of the person addressed", uk: "відокремлює ім’я того, до кого звертаються", es: "separa el nombre de la persona a quien se habla", pt: "separa o nome da pessoa com quem se fala", fr: "isole le nom de la personne à qui l’on s’adresse", de: "trennt den Namen der angesprochenen Person ab", it: "separa il nome della persona a cui ci si rivolge", pl: "oddziela imię osoby, do której się zwracamy", tr: "hitap edilen kişinin adını ayırır", id: "memisahkan nama orang yang disapa", vi: "tách tên của người được gọi ra khỏi câu" }
            ex: { examples: [["Thanks for your help", { target: "," }, " Tom."], ["Tom", { target: "," }, " come here."]] }
            tr: { uk: { examples: ["Дякую за допомогу, Томе.", "Томе, іди сюди."] }, es: { examples: ["Gracias por tu ayuda, Tom.", "Tom, ven aquí."] }, pt: { examples: ["Obrigado pela sua ajuda, Tom.", "Tom, venha aqui."] }, fr: { examples: ["Merci de ton aide, Tom.", "Tom, viens ici."] }, de: { examples: ["Danke für deine Hilfe, Tom.", "Tom, komm her."] }, it: { examples: ["Grazie per il tuo aiuto, Tom.", "Tom, vieni qui."] }, pl: { examples: ["Dziękuję za pomoc, Tomie.", "Tomie, chodź tutaj."] }, tr: { examples: ["Yardımın için teşekkürler, Tom.", "Tom, buraya gel."] }, id: { examples: ["Terima kasih atas bantuanmu, Tom.", "Tom, kemari."] }, vi: { examples: ["Cảm ơn bạn đã giúp, Tom.", "Tom, lại đây."] } }
          - level: B2
            rule: { en: "comes before a question tag", uk: "стоїть перед розділовим питанням", es: "va antes de una pregunta coletilla", pt: "vem antes de uma question tag", fr: "précède un question tag", de: "steht vor einem Question Tag", it: "precede un question tag", pl: "stoi przed pytaniem rozłącznym", tr: "bir question tag’den önce gelir", id: "diletakkan sebelum question tag", vi: "đứng trước phần hỏi đuôi" }
            ex: ["It’s cold today", { target: "," }, " isn’t it?"]
            tr: { uk: "Сьогодні холодно, правда?", es: "Hoy hace frío, ¿no?", pt: "Hoje está frio, não é?", fr: "Il fait froid aujourd’hui, n’est-ce pas ?", de: "Heute ist es kalt, oder?", it: "Oggi fa freddo, vero?", pl: "Dzisiaj jest zimno, prawda?", tr: "Bugün hava soğuk, değil mi?", id: "Hari ini dingin, kan?", vi: "Hôm nay trời lạnh, phải không?" }
          - level: B2
            rule: { en: "never stands between a subject and its verb, however long the subject", uk: "ніколи не стоїть між підметом і його дієсловом, хоч би яким довгим був підмет", es: "nunca va entre el sujeto y su verbo, por largo que sea el sujeto", pt: "nunca fica entre o sujeito e o seu verbo, por mais longo que seja o sujeito", fr: "ne se place jamais entre le sujet et son verbe, même si le sujet est long", de: "steht nie zwischen Subjekt und Verb, auch wenn das Subjekt lang ist", it: "non sta mai tra il soggetto e il suo verbo, per quanto lungo sia il soggetto", pl: "nigdy nie stoi między podmiotem a czasownikiem, choćby podmiot był długi", tr: "özne ile fiil arasına asla girmez, özne ne kadar uzun olursa olsun", id: "tidak pernah berdiri di antara subjek dan kata kerjanya, sepanjang apa pun subjeknya", vi: "không bao giờ đứng giữa chủ ngữ và động từ, dù chủ ngữ dài đến đâu" }
            ex: [{ subj: "The man in the grey coat" }, " ", { verb: "is" }, " my uncle."]
            tr: { uk: "Чоловік у сірому пальті — мій дядько.", es: "El hombre del abrigo gris es mi tío.", pt: "O homem de casaco cinza é meu tio.", fr: "L’homme au manteau gris est mon oncle.", de: "Der Mann im grauen Mantel ist mein Onkel.", it: "L'uomo con il cappotto grigio è mio zio.", pl: "Mężczyzna w szarym płaszczu to mój wujek.", tr: "Gri paltolu adam benim amcam.", id: "Pria yang memakai mantel abu-abu itu adalah paman saya.", vi: "Người đàn ông mặc áo khoác xám là chú của tôi." }
          - level: B2
            rule: { en: "never joins two main clauses alone: add a conjunction, or use a semicolon or a full stop", uk: "ніколи сама не з’єднує два головні речення: потрібні сполучник, крапка з комою або крапка", es: "nunca une sola dos oraciones principales: se necesita una conjunción, un punto y coma o un punto", pt: "nunca une sozinha duas orações principais: é preciso uma conjunção, um ponto e vírgula ou um ponto final", fr: "ne relie jamais seule deux propositions principales : il faut une conjonction, un point-virgule ou un point", de: "verbindet allein nie zwei Hauptsätze: Es braucht eine Konjunktion, ein Semikolon oder einen Punkt", it: "da sola non unisce mai due proposizioni principali: serve una congiunzione, un punto e virgola o un punto", pl: "sam nigdy nie łączy dwóch zdań głównych: potrzebny jest spójnik, średnik lub kropka", tr: "tek başına iki ana cümleyi asla bağlamaz: bir bağlaç, noktalı virgül ya da nokta gerekir", id: "tidak pernah menyambung dua klausa utama sendirian: diperlukan konjungsi, titik koma, atau titik", vi: "không bao giờ tự nối được hai mệnh đề chính: cần một liên từ, dấu chấm phẩy hoặc dấu chấm" }
            ex: { alternatives: [["It was late", { target: ", so" }, " we left."], ["It was late", { target: ";" }, " we left."], ["It was late", { target: "." }, " We left."]] }
            tr: { uk: "Було пізно, тому ми пішли.", es: "Era tarde, así que nos fuimos.", pt: "Era tarde, então fomos embora.", fr: "Il était tard, alors nous sommes partis.", de: "Es war spät, also sind wir gegangen.", it: "Era tardi, così siamo andati via.", pl: "Było późno, więc wyszliśmy.", tr: "Geç olmuştu, bu yüzden çıktık.", id: "Sudah larut, jadi kami pergi.", vi: "Đã muộn nên chúng tôi đi." }
