            rule: { en: ["a full stop: ", { term: "Prof." }, ", ", { term: "etc." }, "; at the end of a sentence it also ends the sentence"], uk: ["з крапкою: ", { term: "Prof." }, ", ", { term: "etc." }, "; в кінці речення ця крапка водночас закінчує речення"], es: ["con punto: ", { term: "Prof." }, ", ", { term: "etc." }, "; al final de una oración, ese punto también cierra la oración"], pt: ["com ponto final: ", { term: "Prof." }, ", ", { term: "etc." }, "; no fim da frase, esse ponto também encerra a frase"], fr: ["avec un point : ", { term: "Prof." }, ", ", { term: "etc." }, " ; en fin de phrase, ce point termine aussi la phrase"], de: ["mit Punkt: ", { term: "Prof." }, ", ", { term: "etc." }, "; am Satzende beendet dieser Punkt zugleich den Satz"], it: ["con il punto: ", { term: "Prof." }, ", ", { term: "etc." }, "; a fine frase, quel punto chiude anche la frase"], pl: ["z kropką: ", { term: "Prof." }, ", ", { term: "etc." }, "; na końcu zdania ta kropka kończy też zdanie"], tr: ["nokta ile yazılır: ", { term: "Prof." }, ", ", { term: "etc." }, "; cümlenin sonunda bu nokta cümleyi de bitirir"], id: ["dengan titik: ", { term: "Prof." }, ", ", { term: "etc." }, "; di akhir kalimat, titik itu sekaligus mengakhiri kalimat"], vi: ["có dấu chấm: ", { term: "Prof." }, ", ", { term: "etc." }, "; ở cuối câu, dấu chấm này đồng thời kết thúc câu"] }
