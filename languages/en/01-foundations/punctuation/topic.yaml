            rule: { en: "written without full stops", uk: "пишуться без крапок", es: "se escriben sin puntos", pt: "escrevem-se sem pontos", fr: "s’écrivent sans points", de: "werden ohne Punkte geschrieben", it: "si scrivono senza punti", pl: "pisze się bez kropek", tr: "nokta olmadan yazılır", id: "ditulis tanpa titik", vi: "viết không có dấu chấm" }
