        rows:
          - level: C1
            rule: { en: "a quotation inside a quotation takes the other kind of mark", uk: "цитата всередині цитати бере інший вид лапок", es: "una cita dentro de otra cita lleva el otro tipo de comillas", pt: "uma citação dentro de outra citação leva o outro tipo de aspas", fr: "une citation à l’intérieur d’une citation prend l’autre sorte de guillemets", de: "ein Zitat im Zitat erhält die andere Art von Anführungszeichen", it: "una citazione dentro una citazione usa l'altro tipo di virgolette", pl: "cytat wewnątrz cytatu bierze drugi rodzaj cudzysłowu", tr: "alıntı içindeki alıntı diğer tür tırnağı alır", id: "kutipan di dalam kutipan memakai jenis tanda petik yang lain", vi: "một trích dẫn nằm trong trích dẫn khác dùng loại dấu ngoặc kép còn lại" }
            ex: ["Tom said, ‘Ana called the plan ", { target: "“perfect”" }, " and left.’ ", { variant: ["Tom said, “Ana called the plan ", { target: "‘perfect’" }, " and left.”"], variety: en-US }]
            tr: { uk: "Том сказав: «Ана назвала план „ідеальним“ і пішла».", es: "Tom dijo: «Ana calificó el plan de “perfecto” y se fue».", pt: "Tom disse: “Ana chamou o plano de ‘perfeito’ e foi embora.”", fr: "Tom a dit : « Ana a qualifié le plan de “parfait” et elle est partie. »", de: "Tom sagte: „Ana nannte den Plan ‚perfekt‘ und ging.“", it: "Tom ha detto: «Ana ha definito il piano “perfetto” ed è andata via».", pl: "Tom powiedział: „Ana nazwała plan «idealnym» i wyszła.”", tr: "Tom şöyle dedi: “Ana planı ‘mükemmel’ diye niteledi ve gitti.”", id: "Tom berkata, “Ana menyebut rencana itu ‘sempurna’ lalu pergi.”", vi: "Tom nói: “Ana gọi kế hoạch đó là ‘hoàn hảo’ rồi bỏ đi.”" }
          - level: C1
            rule: { en: "a long quotation stands as an indented block, without quotation marks", uk: "довга цитата подається окремим абзацом із відступом, без лапок", es: "una cita larga va en un bloque con sangría, sin comillas", pt: "uma citação longa fica em um bloco recuado, sem aspas", fr: "une longue citation forme un bloc en retrait, sans guillemets", de: "ein langes Zitat steht als eingerückter Block, ohne Anführungszeichen", it: "una citazione lunga forma un blocco rientrato, senza virgolette", pl: "długi cytat stoi jako akapit z wcięciem, bez cudzysłowu", tr: "uzun alıntı, tırnak işareti olmadan girintili bir blok olarak yazılır", id: "kutipan panjang ditulis sebagai blok menjorok, tanpa tanda petik", vi: "trích dẫn dài đứng thành một khối thụt lề, không có dấu ngoặc kép" }
          - level: C1
            rule: { en: "titles of books, films, newspapers and albums are in italics", uk: "назви книжок, фільмів, газет і альбомів набирають курсивом", es: "los títulos de libros, películas, periódicos y álbumes van en cursiva", pt: "os títulos de livros, filmes, jornais e álbuns ficam em itálico", fr: "les titres de livres, de films, de journaux et d’albums sont en italique", de: "Titel von Büchern, Filmen, Zeitungen und Alben stehen kursiv", it: "i titoli di libri, film, giornali e album vanno in corsivo", pl: "tytuły książek, filmów, gazet i albumów piszemy kursywą", tr: "kitap, film, gazete ve albüm adları italik yazılır", id: "judul buku, film, surat kabar, dan album ditulis dengan huruf miring", vi: "nhan đề sách, phim, báo và album viết bằng chữ nghiêng" }
            ex: ["She is reading ", { target: "Emma" }, "."]
