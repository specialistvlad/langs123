  - title: { en: Anticipatory it as subject, uk: "It як підготовчий підмет", es: "It anticipatorio como sujeto", pt: "It antecipatório como sujeito", fr: "It d’anticipation comme sujet", de: "Vorausweisendes it als Subjekt", it: "It anticipatorio come soggetto", pl: "It zapowiadające podmiot", tr: "Özneyi önceleyen it", id: "It pendahulu sebagai subjek", vi: "It báo trước làm chủ ngữ" }
    role: own
    content:
      - type: prose
        level: B2
        text: { en: ["A long subject moves to the end of the sentence, and ", { term: it }, " takes its place."], uk: ["Довгий підмет переходить у кінець речення, а його місце займає ", { term: "it" }, "."], es: ["Un sujeto largo pasa al final de la oración, y ", { term: "it" }, " ocupa su lugar."], pt: ["Um sujeito longo vai para o fim da frase, e ", { term: "it" }, " ocupa o seu lugar."], fr: ["Un sujet long passe en fin de phrase, et ", { term: "it" }, " prend sa place."], de: ["Ein langes Subjekt rückt ans Satzende, und ", { term: "it" }, " nimmt seinen Platz ein."], it: ["Un soggetto lungo si sposta alla fine della frase e ", { term: "it" }, " prende il suo posto."], pl: ["Długi podmiot przechodzi na koniec zdania, a jego miejsce zajmuje ", { term: "it" }, "."], tr: ["Uzun bir özne cümlenin sonuna geçer ve ", { term: "it" }, " onun yerini tutar."], id: ["Subjek yang panjang dipindah ke akhir kalimat, dan ", { term: "it" }, " mengisi tempatnya."], vi: ["Chủ ngữ dài chuyển xuống cuối câu, và ", { term: "it" }, " đứng vào vị trí của nó."] }
      - type: usage
        columns:
