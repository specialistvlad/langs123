  - title: { en: "Form: object pronouns", uk: "Форма: займенники-додатки", es: "Forma: pronombres objeto", pt: "Forma: pronomes objeto", fr: "Forme : pronoms compléments", de: "Form: Objektpronomen", it: "Forma: pronomi complemento", pl: "Forma: zaimki dopełnienia", tr: "Biçim: nesne zamirleri", id: "Bentuk: kata ganti objek", vi: "Dạng: đại từ tân ngữ" }
    role: form
    content:
      - type: prose
        level: A1
        text:
          en: The object pronoun goes after the verb or after a preposition.
          uk: "Займенник-додаток стоїть після дієслова або після прийменника."
          es: "El pronombre objeto va después del verbo o de una preposición."
          pt: "O pronome objeto vai depois do verbo ou de uma preposição."
          fr: "Le pronom complément se place après le verbe ou après une préposition."
          de: "Das Objektpronomen steht nach dem Verb oder nach einer Präposition."
          it: "Il pronome complemento sta dopo il verbo o dopo una preposizione."
          pl: "Zaimek dopełnienia stoi po czasowniku lub po przyimku."
          tr: "Nesne zamiri fiilden ya da edattan sonra gelir."
          id: "Kata ganti objek berada sesudah kata kerja atau kata depan."
          vi: "Đại từ tân ngữ đứng sau động từ hoặc sau giới từ."
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, uk: "Підмет", es: "Sujeto", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }, features: { case: nom } }
          - { key: object, label: { en: Object, uk: "Додаток", es: "Objeto", pt: "Objeto", fr: "Complément", de: "Objekt", it: "Complemento", pl: "Dopełnienie", tr: "Nesne", id: "Objek", vi: "Tân ngữ" }, features: { case: acc } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, subject: I, object: me, ex: ["Can you help ", { target: me }, "?"] }
          - { level: A1, features: { person: 2 }, subject: you, object: you, ex: ["I love ", { target: you }, "."] }
          - { level: A1, features: { person: 3, number: sg, gender: masc }, subject: he, object: him, ex: ["I know ", { target: him }, "."] }
          - { level: A1, features: { person: 3, number: sg, gender: fem }, subject: she, object: her, ex: ["Call ", { target: her }, " later."] }
          - { level: A1, features: { person: 3, number: sg, gender: neut }, subject: it, object: it, ex: ["I like ", { target: it }, "."] }
          - { level: A1, features: { person: 1, number: pl }, subject: we, object: us, ex: ["Come with ", { target: us }, "."] }
          - { level: A1, features: { person: 3, number: pl }, subject: they, object: them, ex: ["I see ", { target: them }, " every day."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Short answers and answers with ", { term: be }, " take the object form:"]
              uk: ["У коротких відповідях і відповідях із ", { term: be }, " вживають форму додатка:"]
              es: ["Las respuestas cortas y las respuestas con ", { term: be }, " llevan la forma de objeto:"]
              pt: ["Respostas curtas e respostas com ", { term: "be" }, " usam a forma de objeto:"]
              fr: ["Les réponses courtes et les réponses avec ", { term: "be" }, " prennent la forme complément :"]
              de: ["Kurzantworten und Antworten mit ", { term: "be" }, " haben die Objektform:"]
              it: ["Le risposte brevi e le risposte con ", { term: "be" }, " prendono la forma del complemento:"]
              pl: ["Krótkie odpowiedzi i odpowiedzi z ", { term: "be" }, " przyjmują formę dopełnienia:"]
              tr: ["Kısa cevaplarda ve ", { term: "be" }, " ile verilen cevaplarda nesne biçimi kullanılır:"]
              id: ["Jawaban singkat dan jawaban dengan ", { term: "be" }, " memakai bentuk objek:"]
              vi: ["Câu trả lời ngắn và câu trả lời với ", { term: "be" }, " dùng dạng tân ngữ:"]
