title: { en: Personal Pronouns, uk: Особові займенники, es: Pronombres personales, pt: "Pronomes pessoais", fr: "Pronoms personnels", de: "Personalpronomen", it: "Pronomi personali", pl: "Zaimki osobowe", tr: "Kişi zamirleri", id: "Kata ganti orang", vi: "Đại từ nhân xưng" }
summary:
  lead:
    en: ["Subject, object and possessive forms of the personal pronouns: ", { term: I }, ", ", { term: me }, ", ", { term: my }, ", ", { term: mine }, "."]
    uk: ["Особові займенники в ролі підмета й додатка та присвійні форми: ", { term: I }, ", ", { term: me }, ", ", { term: my }, ", ", { term: mine }, "."]
    es: ["Las formas de sujeto, de objeto y posesivas de los pronombres personales: ", { term: I }, ", ", { term: me }, ", ", { term: my }, ", ", { term: mine }, "."]
    pt: ["As formas de sujeito, de objeto e possessivas dos pronomes pessoais: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    fr: ["Les formes sujet, complément et possessives des pronoms personnels : ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    de: ["Subjekt-, Objekt- und Possessivformen der Personalpronomen: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    it: ["Le forme soggetto, complemento e possessive dei pronomi personali: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    pl: ["Formy podmiotu, dopełnienia i formy dzierżawcze zaimków osobowych: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    tr: ["Kişi zamirlerinin özne, nesne ve iyelik biçimleri: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    id: ["Bentuk subjek, objek, dan kepemilikan dari kata ganti orang: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
    vi: ["Dạng chủ ngữ, tân ngữ và sở hữu của đại từ nhân xưng: ", { term: "I" }, ", ", { term: "me" }, ", ", { term: "my" }, ", ", { term: "mine" }, "."]
  rule:
    en: "English always states the subject, even with weather and time:"
    uk: "В англійській підмет називають завжди, навіть у реченнях про погоду й час:"
    es: "En inglés el sujeto siempre se expresa, incluso con el clima y la hora:"
    pt: "Em inglês, o sujeito sempre aparece, mesmo ao falar do clima e das horas:"
    fr: "En anglais, le sujet est toujours exprimé, même pour la météo et l’heure :"
    de: "Im Englischen steht das Subjekt immer, auch bei Wetter und Uhrzeit:"
    it: "In inglese il soggetto va sempre espresso, anche con il meteo e con l'ora:"
    pl: "W angielskim podmiot jest zawsze wyrażony, także przy pogodzie i godzinie:"
    tr: "İngilizcede özne, hava durumu ve saat anlatılırken bile her zaman söylenir:"
    id: "Dalam bahasa Inggris subjek selalu disebutkan, bahkan untuk cuaca dan waktu:"
    vi: "Tiếng Anh luôn nêu chủ ngữ, kể cả khi nói về thời tiết và giờ giấc:"
  ex: [{ target: It }, " is cold."]

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: forms, label: { en: Pronouns, uk: "Займенники", es: "Pronombres", pt: "Pronomes", fr: "Pronoms", de: "Pronomen", it: "Pronomi", pl: "Zaimki", tr: "Zamirler", id: "Kata ganti", vi: "Đại từ" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - { level: A0, features: { case: nom }, point: { en: Subject, uk: "Підмет", es: "Sujeto", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }, forms: { alternatives: [I, you, he, she, it, we, they] }, rule: { en: goes before the verb, uk: "стоїть перед дієсловом", es: "va antes del verbo", pt: "vai antes do verbo", fr: "se place avant le verbe", de: "steht vor dem Verb", it: "sta prima del verbo", pl: "stoi przed czasownikiem", tr: "fiilden önce gelir", id: "berada sebelum kata kerja", vi: "đứng trước động từ" }, ex: [{ target: She }, "'s a teacher."] }
        - { level: A1, features: { case: acc }, point: { en: Object, uk: "Додаток", es: "Objeto", pt: "Objeto", fr: "Complément", de: "Objekt", it: "Complemento", pl: "Dopełnienie", tr: "Nesne", id: "Objek", vi: "Tân ngữ" }, forms: { alternatives: [me, you, him, her, it, us, them] }, rule: { en: goes after a verb or a preposition, uk: "стоїть після дієслова або прийменника", es: "va después de un verbo o de una preposición", pt: "vai depois de um verbo ou de uma preposição", fr: "se place après un verbe ou une préposition", de: "steht nach einem Verb oder einer Präposition", it: "sta dopo un verbo o una preposizione", pl: "stoi po czasowniku lub przyimku", tr: "fiilden ya da edattan sonra gelir", id: "berada sesudah kata kerja atau kata depan", vi: "đứng sau động từ hoặc giới từ" }, ex: ["Can you help ", { target: me }, "?"] }
        - { level: A0, features: { case: gen, wordclass: det }, point: { en: { pattern: [Possessive, { slot: noun }] }, uk: { pattern: ["Присвійний", { slot: noun }] }, es: { pattern: ["Posesivo", { slot: noun }] }, pt: { pattern: ["Possessivo", { slot: "noun" }] }, fr: { pattern: ["Possessif", { slot: "noun" }] }, de: { pattern: ["Possessivbegleiter", { slot: "noun" }] }, it: { pattern: ["Possessivo", { slot: "noun" }] }, pl: { pattern: ["Zaimek dzierżawczy", { slot: "noun" }] }, tr: { pattern: ["İyelik", { slot: "noun" }] }, id: { pattern: ["Kepemilikan", { slot: "noun" }] }, vi: { pattern: ["Tính từ sở hữu", { slot: "noun" }] } }, forms: { alternatives: [my, your, his, her, its, our, their] }, rule: { en: "goes before a noun, with no article", uk: "стоїть перед іменником, без артикля", es: "va antes de un sustantivo, sin artículo", pt: "vai antes de um substantivo, sem artigo", fr: "se place avant un nom, sans article", de: "steht vor einem Nomen, ohne Artikel", it: "sta davanti a un sostantivo, senza articolo", pl: "stoi przed rzeczownikiem, bez przedimka", tr: "isimden önce gelir, artikel almaz", id: "berada sebelum kata benda, tanpa artikel", vi: "đứng trước danh từ, không có mạo từ" }, ex: [{ target: My }, " name is Tom."] }
        - { level: A1, features: { case: gen, wordclass: pro }, point: { en: Possessive alone, uk: "Присвійний без іменника", es: "Posesivo solo", pt: "Possessivo sozinho", fr: "Possessif seul", de: "Possessivpronomen allein", it: "Possessivo da solo", pl: "Samodzielny zaimek dzierżawczy", tr: "Tek başına iyelik", id: "Kepemilikan berdiri sendiri", vi: "Đại từ sở hữu" }, forms: { alternatives: [mine, yours, his, hers, ours, theirs] }, rule: { en: "stands alone, without a noun", uk: "стоїть сам, без іменника", es: "va solo, sin sustantivo", pt: "vai sozinho, sem substantivo", fr: "s’emploie seul, sans nom", de: "steht allein, ohne Nomen", it: "sta da solo, senza sostantivo", pl: "stoi samodzielnie, bez rzeczownika", tr: "tek başına kullanılır, isim almaz", id: "berdiri sendiri, tanpa kata benda", vi: "đứng một mình, không có danh từ" }, ex: ["This bag is ", { target: mine }, "."] }
        - { level: A0, features: { person: 3, number: sg, gender: neut, case: nom }, point: { en: "Weather, time", uk: "Погода, час", es: "Clima, hora", pt: "Clima, hora", fr: "Météo, heure", de: "Wetter, Uhrzeit", it: "Meteo, ora", pl: "Pogoda, godzina", tr: "Hava durumu, saat", id: "Cuaca, waktu", vi: "Thời tiết, giờ giấc" }, forms: it, rule: { en: ["no real subject: ", { term: it }, " fills the place"], uk: ["справжнього підмета немає: ", { term: it }, " займає його місце"], es: ["no hay sujeto real: ", { term: it }, " ocupa su lugar"], pt: ["sem sujeito real: ", { term: "it" }, " ocupa o lugar"], fr: ["pas de vrai sujet : ", { term: "it" }, " occupe la place"], de: ["kein echtes Subjekt: ", { term: "it" }, " nimmt den Platz ein"], it: ["non c'è un vero soggetto: ", { term: "it" }, " occupa il suo posto"], pl: ["brak rzeczywistego podmiotu: ", { term: "it" }, " zajmuje jego miejsce"], tr: ["gerçek özne yok: ", { term: "it" }, " onun yerini tutar"], id: ["tidak ada subjek yang sebenarnya: ", { term: "it" }, " mengisi tempatnya"], vi: ["không có chủ ngữ thật: ", { term: "it" }, " đứng ở vị trí đó"] }, ex: [{ target: It }, "'s cold today."] }
        - { level: B2, features: { person: 3, number: sg, gender: neut, case: nom }, point: { en: Anticipatory it }, forms: it, rule: { en: "stands for a later infinitive or clause" }, ex: [{ target: It }, " is important to rest."] }
        - { level: B2, features: { person: 3, number: sg, case: nom }, point: { en: Singular they }, forms: they, rule: { en: "one person, gender unknown; a plural verb" }, ex: ["If a student is late, ", { target: they }, " must sign in."] }
        - { level: C1, features: { case: [nom, acc] }, point: { en: Case }, forms: { alternatives: [I, me] }, rule: { en: "object form after a preposition, even in a pair" }, ex: ["This is between ", { target: you and me }, "."] }
        - { level: C1, features: { person: [1, 2, 3] }, point: { en: Generic pronouns }, forms: { alternatives: [one, you, we, they] }, rule: { en: [{ term: one }, " is formal, ", { term: you }, " informal"] }, ex: { examples: [[{ target: One }, " should check the facts."], [{ target: You }, " never know."]] } }
        - { level: A0, features: { person: 3, number: sg, gender: neut, case: gen, wordclass: det }, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, forms: its, rule: { en: [{ term: its }, " has no apostrophe; ", { term: it's }, " = ", { term: it is }], uk: [{ term: its }, " пишеться без апострофа; ", { term: it's }, " = ", { term: it is }], es: [{ term: its }, " no lleva apóstrofo; ", { term: it's }, " = ", { term: it is }], pt: [{ term: "its" }, " não tem apóstrofo; ", { term: "it's" }, " = ", { term: "it is" }], fr: [{ term: "its" }, " ne prend pas d’apostrophe ; ", { term: "it's" }, " = ", { term: "it is" }], de: [{ term: "its" }, " hat keinen Apostroph; ", { term: "it's" }, " = ", { term: "it is" }], it: [{ term: "its" }, " non ha l'apostrofo; ", { term: "it's" }, " = ", { term: "it is" }], pl: [{ term: "its" }, " nie ma apostrofu; ", { term: "it's" }, " = ", { term: "it is" }], tr: [{ term: "its" }, " kesme işareti almaz; ", { term: "it's" }, " = ", { term: "it is" }], id: [{ term: "its" }, " tidak memakai apostrof; ", { term: "it's" }, " = ", { term: "it is" }], vi: [{ term: "its" }, " không có dấu nháy đơn; ", { term: "it's" }, " = ", { term: "it is" }] }, ex: ["The dog wants ", { target: its }, " food."] }
        - { level: A1, features: { case: gen, wordclass: pro }, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, forms: { alternatives: [yours, hers, ours, theirs] }, rule: { en: no apostrophe, uk: "без апострофа", es: "sin apóstrofo", pt: "sem apóstrofo", fr: "sans apostrophe", de: "kein Apostroph", it: "senza apostrofo", pl: "bez apostrofu", tr: "kesme işareti yok", id: "tanpa apostrof", vi: "không có dấu nháy đơn" }, ex: ["Is this ", { target: yours }, "?"] }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: prose
        level: A1
        text:
          en: "Subject before the verb, object after it, possessive before a noun or alone:"
          uk: "Підмет стоїть перед дієсловом, додаток — після нього, присвійний займенник — перед іменником або сам по собі:"
          es: "El sujeto va antes del verbo, el objeto después, y el posesivo antes de un sustantivo o solo:"
          pt: "O sujeito vai antes do verbo, o objeto depois dele e o possessivo antes de um substantivo ou sozinho:"
          fr: "Le sujet se place avant le verbe, le complément après, et le possessif avant un nom ou seul :"
          de: "Das Subjekt steht vor dem Verb, das Objekt danach, die Possessivform vor einem Nomen oder allein:"
          it: "Il soggetto sta prima del verbo, il complemento dopo, il possessivo prima di un sostantivo o da solo:"
          pl: "Podmiot stoi przed czasownikiem, dopełnienie po nim, a zaimek dzierżawczy przed rzeczownikiem lub samodzielnie:"
          tr: "Özne fiilden önce, nesne fiilden sonra gelir; iyelik biçimi bir isimden önce ya da tek başına kullanılır:"
          id: "Subjek berada sebelum kata kerja, objek sesudahnya, dan kepemilikan sebelum kata benda atau berdiri sendiri:"
          vi: "Chủ ngữ đứng trước động từ, tân ngữ đứng sau động từ, tính từ sở hữu đứng trước danh từ và đại từ sở hữu đứng một mình:"
        ex: [{ target: We }, " like ", { target: them }, ". ", { target: Their }, " house is next to ", { target: ours }, "."]
        tr: { uk: "Вони нам подобаються. Їхній будинок поруч із нашим.", es: "Nos caen bien. Su casa está al lado de la nuestra.", pt: "Gostamos deles. A casa deles fica ao lado da nossa.", fr: "Nous les aimons bien. Leur maison est à côté de la nôtre.", de: "Wir mögen sie. Ihr Haus ist neben unserem.", it: "Ci piacciono. La loro casa è accanto alla nostra.", pl: "Lubimy ich. Ich dom stoi obok naszego.", tr: "Onlardan hoşlanıyoruz. Onların evi bizimkinin yanında.", id: "Kami menyukai mereka. Rumah mereka bersebelahan dengan rumah kami.", vi: "Chúng tôi quý họ. Nhà của họ ở cạnh nhà của chúng tôi." }

  - title: { en: "Form: subject pronouns", uk: "Форма: займенники-підмети", es: "Forma: pronombres sujeto", pt: "Forma: pronomes sujeito", fr: "Forme : pronoms sujets", de: "Form: Subjektpronomen", it: "Forma: pronomi soggetto", pl: "Forma: zaimki podmiotu", tr: "Biçim: özne zamirleri", id: "Bentuk: kata ganti subjek", vi: "Dạng: đại từ chủ ngữ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: pronoun, label: { en: Pronoun, uk: "Займенник", es: "Pronombre", pt: "Pronome", fr: "Pronom", de: "Pronomen", it: "Pronome", pl: "Zaimek", tr: "Zamir", id: "Kata ganti", vi: "Đại từ" } }
          - { key: refers, label: { en: Refers to, uk: "Позначає", es: "Se refiere a", pt: "Refere-se a", fr: "Désigne", de: "Bezieht sich auf", it: "Si riferisce a", pl: "Odnosi się do", tr: "Neyi belirtir", id: "Merujuk pada", vi: "Dùng để chỉ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, pronoun: I, refers: { en: the speaker, uk: "мовця", es: "el hablante", pt: "quem fala", fr: "celui qui parle", de: "die sprechende Person", it: "chi parla", pl: "mówiący", tr: "konuşan kişi", id: "pembicara", vi: "người nói" }, ex: [{ target: I }, "'m Tom."] }
          - { level: A0, features: { person: 2 }, pronoun: you, refers: { en: the listener or listeners, uk: "співрозмовника або співрозмовників", es: "el oyente o los oyentes", pt: "quem ouve, uma ou várias pessoas", fr: "la ou les personnes à qui l’on parle", de: "die angesprochene Person oder die angesprochenen Personen", it: "la persona o le persone con cui si parla", pl: "słuchacz lub słuchacze", tr: "dinleyen kişi ya da kişiler", id: "lawan bicara", vi: "người nghe hoặc những người nghe" }, ex: [{ target: You }, "'re late."] }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, pronoun: he, refers: { en: a man or a boy, uk: "чоловіка або хлопчика", es: "un hombre o un niño", pt: "um homem ou um menino", fr: "un homme ou un garçon", de: "ein Mann oder ein Junge", it: "un uomo o un ragazzo", pl: "mężczyzna lub chłopiec", tr: "bir erkek ya da erkek çocuk", id: "laki-laki atau anak laki-laki", vi: "một người đàn ông hoặc một cậu bé" }, ex: [{ target: He }, "'s my brother."] }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, pronoun: she, refers: { en: a woman or a girl, uk: "жінку або дівчинку", es: "una mujer o una niña", pt: "uma mulher ou uma menina", fr: "une femme ou une fille", de: "eine Frau oder ein Mädchen", it: "una donna o una ragazza", pl: "kobieta lub dziewczynka", tr: "bir kadın ya da kız çocuk", id: "perempuan atau anak perempuan", vi: "một người phụ nữ hoặc một cô bé" }, ex: [{ target: She }, "'s a teacher."] }
          - { level: A0, features: { person: 3, number: sg, gender: neut }, pronoun: it, refers: { en: a thing or an animal, uk: "предмет або тварину", es: "una cosa o un animal", pt: "uma coisa ou um animal", fr: "une chose ou un animal", de: "eine Sache oder ein Tier", it: "una cosa o un animale", pl: "rzecz lub zwierzę", tr: "bir şey ya da hayvan", id: "benda atau hewan", vi: "một vật hoặc một con vật" }, ex: [{ target: It }, "'s new."] }
          - { level: A0, features: { person: 1, number: pl }, pronoun: we, refers: { en: the speaker and others, uk: "мовця та інших", es: "el hablante y otros", pt: "quem fala e outras pessoas", fr: "celui qui parle et d’autres personnes", de: "die sprechende Person und andere", it: "chi parla e altre persone", pl: "mówiący i inni", tr: "konuşan kişi ve başkaları", id: "pembicara dan orang lain", vi: "người nói và những người khác" }, ex: [{ target: We }, "'re from Spain."] }
          - { level: A0, features: { person: 3, number: pl }, pronoun: they, refers: { en: people or things, uk: "людей або предмети", es: "personas o cosas", pt: "pessoas ou coisas", fr: "des personnes ou des choses", de: "Personen oder Dinge", it: "persone o cose", pl: "osoby lub rzeczy", tr: "kişiler ya da şeyler", id: "orang atau benda", vi: "người hoặc vật" }, ex: [{ target: They }, "'re here."] }
          - { level: B2, features: { person: 3, number: sg }, pronoun: they, refers: { en: "one person of unknown or unstated gender" }, ex: ["If a student is late, ", { target: they }, " must sign in."] }
      - type: list
        items:
          - type: rule
            level: A0
