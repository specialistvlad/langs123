          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [it, be, { slot: adjective }, { optional: { pattern: [for, { slot: person }] } }, to, { slot: V }] }, ex: { examples: [[{ target: It }, " is important to rest."], [{ target: It }, " is important for children to rest."]] }, tr: { uk: { examples: ["Важливо відпочивати.", "Важливо, щоб діти відпочивали."] }, es: { examples: ["Es importante descansar.", "Es importante que los niños descansen."] }, pt: { examples: ["É importante descansar.", "É importante que as crianças descansem."] }, fr: { examples: ["Il est important de se reposer.", "Il est important que les enfants se reposent."] }, de: { examples: ["Es ist wichtig, sich auszuruhen.", "Es ist wichtig, dass Kinder sich ausruhen."] }, it: { examples: ["È importante riposarsi.", "È importante che i bambini si riposino."] }, pl: { examples: ["Ważne jest, żeby odpoczywać.", "Ważne jest, żeby dzieci odpoczywały."] }, tr: { examples: ["Dinlenmek önemlidir.", "Çocukların dinlenmesi önemlidir."] }, id: { examples: ["Penting untuk beristirahat.", "Penting bagi anak-anak untuk beristirahat."] }, vi: { examples: ["Nghỉ ngơi là điều quan trọng.", "Việc trẻ em được nghỉ ngơi là điều quan trọng."] } } }
          - { level: B2, form: { pattern: [it, be, { slot: adjective }, that, { slot: clause }] }, ex: { examples: [[{ target: It }, "'s likely that she knows."], [{ target: It }, " was obvious that he was tired."]] }, tr: { uk: { examples: ["Імовірно, що вона знає.", "Було очевидно, що він утомлений."] }, es: { examples: ["Es probable que ella lo sepa.", "Era obvio que él estaba cansado."] }, pt: { examples: ["É provável que ela saiba.", "Era óbvio que ele estava cansado."] }, fr: { examples: ["Il est probable qu’elle le sache.", "Il était évident qu’il était fatigué."] }, de: { examples: ["Es ist wahrscheinlich, dass sie es weiß.", "Es war offensichtlich, dass er müde war."] }, it: { examples: ["È probabile che lei lo sappia.", "Era evidente che era stanco."] }, pl: { examples: ["Jest prawdopodobne, że ona wie.", "Było oczywiste, że był zmęczony."] }, tr: { examples: ["Onun bildiği muhtemeldir.", "Onun yorgun olduğu açıktı."] }, id: { examples: ["Besar kemungkinan dia tahu.", "Jelas bahwa dia kelelahan."] }, vi: { examples: ["Có khả năng cô ấy biết.", "Rõ ràng là anh ấy mệt."] } } }
          - { level: B2, form: { pattern: [it, { alternatives: [takes, costs] }, { slot: { en: time or money, uk: "час або гроші", es: "tiempo o dinero", pt: "tempo ou dinheiro", fr: "temps ou argent", de: "Zeit oder Geld", it: "tempo o denaro", pl: "czas lub pieniądze", tr: "zaman ya da para", id: "waktu atau uang", vi: "thời gian hoặc tiền bạc" } }, to, { slot: V }] }, ex: { examples: [[{ target: It }, " takes two hours to get there."], [{ target: It }, " costs a lot to live here."]] }, tr: { uk: { examples: ["Дорога туди займає дві години.", "Жити тут коштує дорого."] }, es: { examples: ["Toma dos horas llegar allá.", "Cuesta mucho vivir aquí."] }, pt: { examples: ["Leva duas horas para chegar lá.", "Custa caro morar aqui."] }, fr: { examples: ["Il faut deux heures pour y aller.", "Ça coûte cher de vivre ici."] }, de: { examples: ["Es dauert zwei Stunden, dorthin zu kommen.", "Es kostet viel, hier zu wohnen."] }, it: { examples: ["Ci vogliono due ore per arrivarci.", "Costa molto vivere qui."] }, pl: { examples: ["Dotarcie tam zajmuje dwie godziny.", "Mieszkanie tutaj dużo kosztuje."] }, tr: { examples: ["Oraya varmak iki saat sürer.", "Burada yaşamak çok paraya mal olur."] }, id: { examples: ["Perlu dua jam untuk sampai ke sana.", "Tinggal di sini butuh banyak biaya."] }, vi: { examples: ["Mất hai tiếng để đến đó.", "Sống ở đây tốn nhiều tiền."] } } }
          - { level: B2, form: { pattern: [it, { alternatives: [seems, appears] }, that, { slot: clause }] }, ex: { examples: [[{ target: It }, " seems that the shop is closed."], [{ target: It }, " appears that nobody knew."]] }, tr: { uk: { examples: ["Здається, що крамниця зачинена.", "Схоже, що ніхто не знав."] }, es: { examples: ["Parece que la tienda está cerrada.", "Parece que nadie lo sabía."] }, pt: { examples: ["Parece que a loja está fechada.", "Parece que ninguém sabia."] }, fr: { examples: ["Il semble que le magasin soit fermé.", "Il apparaît que personne ne le savait."] }, de: { examples: ["Es scheint, dass das Geschäft geschlossen ist.", "Es scheint, dass niemand es wusste."] }, it: { examples: ["Sembra che il negozio sia chiuso.", "Pare che nessuno lo sapesse."] }, pl: { examples: ["Wygląda na to, że sklep jest zamknięty.", "Wygląda na to, że nikt nie wiedział."] }, tr: { examples: ["Mağaza kapalı gibi görünüyor.", "Görünüşe göre kimse bilmiyormuş."] }, id: { examples: ["Sepertinya toko itu tutup.", "Tampaknya tidak ada yang tahu."] }, vi: { examples: ["Có vẻ như cửa hàng đóng cửa.", "Dường như không ai biết."] } } }
          - { level: B2, form: { pattern: [it, be, { alternatives: [no use, no good, worth] }, { slot: "-ing" }] }, ex: { examples: [[{ target: It }, "'s no use complaining."], [{ target: It }, "'s worth waiting."]] }, tr: { uk: { examples: ["Скаржитися марно.", "Варто почекати."] }, es: { examples: ["No sirve de nada quejarse.", "Vale la pena esperar."] }, pt: { examples: ["Não adianta reclamar.", "Vale a pena esperar."] }, fr: { examples: ["Ça ne sert à rien de se plaindre.", "Ça vaut la peine d’attendre."] }, de: { examples: ["Es hat keinen Sinn, sich zu beschweren.", "Es lohnt sich zu warten."] }, it: { examples: ["Non serve a niente lamentarsi.", "Vale la pena aspettare."] }, pl: { examples: ["Narzekanie nie ma sensu.", "Warto poczekać."] }, tr: { examples: ["Şikâyet etmenin faydası yok.", "Beklemeye değer."] }, id: { examples: ["Percuma mengeluh.", "Layak menunggu."] }, vi: { examples: ["Than phiền cũng vô ích.", "Đáng để chờ."] } } }

  - title: { en: Anticipatory it as object, uk: "It як підготовчий додаток", es: "It anticipatorio como objeto", pt: "It antecipatório como objeto", fr: "It d’anticipation comme objet", de: "Vorausweisendes it als Objekt", it: "It anticipatorio come complemento", pl: "It zapowiadające dopełnienie", tr: "Nesneyi önceleyen it", id: "It pendahulu sebagai objek", vi: "It báo trước làm tân ngữ" }
    role: own
    content:
      - type: prose
        level: B2
        text: { en: ["After ", { term: find }, ", ", { term: think }, ", ", { term: make }, ", ", { term: take }, " and ", { term: hate }, ", ", { term: it }, " is the object and stands for a later infinitive or clause."], uk: ["Після ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " і ", { term: "hate" }, " слово ", { term: "it" }, " є додатком і заступає пізніший інфінітив або підрядне речення."], es: ["Después de ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " y ", { term: "hate" }, ", ", { term: "it" }, " es el objeto y ocupa el lugar de un infinitivo o una oración que viene después."], pt: ["Depois de ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " e ", { term: "hate" }, ", ", { term: "it" }, " é o objeto e ocupa o lugar de um infinitivo ou de uma oração que vem depois."], fr: ["Après ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " et ", { term: "hate" }, ", ", { term: "it" }, " est le complément et remplace un infinitif ou une proposition qui vient plus loin."], de: ["Nach ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " und ", { term: "hate" }, " ist ", { term: "it" }, " das Objekt und steht für einen später folgenden Infinitiv oder Nebensatz."], it: ["Dopo ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " e ", { term: "hate" }, ", ", { term: "it" }, " è il complemento e sta al posto di un infinito o di una proposizione che segue."], pl: ["Po ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " i ", { term: "hate" }, " ", { term: "it" }, " jest dopełnieniem i zastępuje bezokolicznik lub zdanie, które pojawia się dalej."], tr: [{ term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " ve ", { term: "hate" }, " fiillerinden sonra ", { term: "it" }, " nesnedir ve daha sonra gelen mastarın ya da yan cümlenin yerini tutar."], id: ["Setelah ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " dan ", { term: "hate" }, ", ", { term: "it" }, " adalah objek dan mewakili infinitif atau klausa yang muncul kemudian."], vi: ["Sau ", { term: "find" }, ", ", { term: "think" }, ", ", { term: "make" }, ", ", { term: "take" }, " và ", { term: "hate" }, ", ", { term: "it" }, " là tân ngữ và thay cho động từ nguyên mẫu hoặc mệnh đề đứng sau."] }
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [{ alternatives: [find, think, consider, make] }, it, { slot: adjective }, to, { slot: V }] }, ex: { examples: [["I ", { target: find it hard }, " to believe."], ["I ", { target: think it best }, " to wait."]] }, tr: { uk: { examples: ["Мені важко в це повірити.", "Я вважаю за краще почекати."] }, es: { examples: ["Me resulta difícil creerlo.", "Creo que es mejor esperar."] }, pt: { examples: ["Acho difícil acreditar.", "Acho melhor esperar."] }, fr: { examples: ["J’ai du mal à le croire.", "Je pense qu’il vaut mieux attendre."] }, de: { examples: ["Ich finde es schwer zu glauben.", "Ich halte es für das Beste, zu warten."] }, it: { examples: ["Trovo difficile crederci.", "Ritengo meglio aspettare."] }, pl: { examples: ["Trudno mi w to uwierzyć.", "Uważam, że najlepiej poczekać."] }, tr: { examples: ["İnanmayı zor buluyorum.", "Beklemeyi en iyisi sayıyorum."] }, id: { examples: ["Saya merasa sulit untuk percaya.", "Saya menganggap lebih baik menunggu."] }, vi: { examples: ["Tôi thấy khó tin.", "Tôi nghĩ tốt nhất là chờ."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [make, find, think] }, it, { slot: adjective }, that, { slot: clause }] }, ex: { examples: [["She ", { target: made it clear }, " that she disagreed."], ["I ", { target: find it strange }, " that nobody called."]] }, tr: { uk: { examples: ["Вона дала зрозуміти, що не згодна.", "Мені дивно, що ніхто не зателефонував."] }, es: { examples: ["Dejó claro que no estaba de acuerdo.", "Me parece extraño que nadie haya llamado."] }, pt: { examples: ["Ela deixou claro que discordava.", "Acho estranho que ninguém tenha ligado."] }, fr: { examples: ["Elle a bien fait comprendre qu’elle n’était pas d’accord.", "Je trouve étrange que personne n’ait appelé."] }, de: { examples: ["Sie machte deutlich, dass sie anderer Meinung war.", "Ich finde es seltsam, dass niemand angerufen hat."] }, it: { examples: ["Ha chiarito di non essere d'accordo.", "Trovo strano che nessuno abbia chiamato."] }, pl: { examples: ["Dała jasno do zrozumienia, że się nie zgadza.", "Dziwi mnie, że nikt nie zadzwonił."] }, tr: { examples: ["Katılmadığını açıkça belli etti.", "Kimsenin aramamış olmasını tuhaf buluyorum."] }, id: { examples: ["Dia menegaskan bahwa dia tidak setuju.", "Saya merasa aneh bahwa tidak ada yang menelepon."] }, vi: { examples: ["Cô ấy nói rõ rằng mình không đồng ý.", "Tôi thấy lạ là không ai gọi điện."] } } }
          - { level: B2, form: { pattern: [take, it, { optional: that }, { slot: clause }] }, ex: ["I ", { target: take it }, " ", { optional: that }, " you agree."], tr: { uk: "Я так розумію, що ви згодні.", es: "Entiendo que estás de acuerdo.", pt: "Suponho que você concorda.", fr: "J’imagine que vous êtes d’accord.", de: "Ich nehme an, dass du einverstanden bist.", it: "Presumo che tu sia d'accordo.", pl: "Rozumiem, że się zgadzasz.", tr: "Anladığım kadarıyla kabul ediyorsun.", id: "Saya anggap kamu setuju.", vi: "Tôi hiểu là bạn đồng ý." } }
          - { level: B2, form: { pattern: [{ alternatives: [like, hate, love, appreciate] }, it, { alternatives: [when, if] }, { slot: clause }] }, ex: { examples: [["I ", { target: hate it when }, " you shout."], ["I'd ", { target: appreciate it if }, " you could wait."]] }, tr: { uk: { examples: ["Терпіти не можу, коли ти кричиш.", "Я був би вдячний, якби ви могли почекати."] }, es: { examples: ["Odio que grites.", "Te agradecería que pudieras esperar."] }, pt: { examples: ["Odeio quando você grita.", "Eu agradeceria se você pudesse esperar."] }, fr: { examples: ["Je déteste quand tu cries.", "Je vous serais reconnaissant si vous pouviez attendre."] }, de: { examples: ["Ich hasse es, wenn du schreist.", "Ich wäre dankbar, wenn Sie warten könnten."] }, it: { examples: ["Odio quando urli.", "Apprezzerei se potessi aspettare."] }, pl: { examples: ["Nienawidzę, kiedy krzyczysz.", "Byłbym wdzięczny, gdybyś mógł poczekać."] }, tr: { examples: ["Bağırmandan nefret ediyorum.", "Bekleyebilirsen minnettar olurum."] }, id: { examples: ["Saya benci kalau kamu berteriak.", "Saya akan berterima kasih jika Anda bisa menunggu."] }, vi: { examples: ["Tôi ghét khi bạn la hét.", "Tôi sẽ rất biết ơn nếu bạn có thể chờ."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [like, hate, resent] }, it, that, { slot: clause }] }, ex: ["I don't ", { target: like it that }, " you left early."], tr: { uk: "Мені не подобається, що ти пішов раніше.", es: "No me gusta que te hayas ido temprano.", pt: "Não gosto que você tenha saído cedo.", fr: "Je n’aime pas que tu sois parti tôt.", de: "Ich mag es nicht, dass du früh gegangen bist.", it: "Non mi piace che tu sia andato via presto.", pl: "Nie podoba mi się, że wyszedłeś wcześniej.", tr: "Erken ayrılmandan hoşlanmadım.", id: "Saya tidak suka kamu pergi lebih awal.", vi: "Tôi không thích việc bạn về sớm." } }

