title: { en: Indefinite Pronouns, uk: Неозначені займенники, es: Pronombres indefinidos, pt: "Pronomes indefinidos", fr: "Pronoms indéfinis", de: "Indefinitpronomen", it: "Pronomi indefiniti", pl: "Zaimki nieokreślone", tr: "Belgisiz zamirler", id: "Kata ganti tak tentu", vi: "Đại từ bất định" }
summary:
  lead:
    en: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " and ", { term: everyone }, " name unknown or general people, things and places, in four families: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " and ", { term: every- }, "."]
    uk: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " і ", { term: everyone }, " називають невідомих або загальних людей, речі й місця в чотирьох групах: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " та ", { term: every- }, "."]
    es: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " y ", { term: everyone }, " nombran personas, cosas y lugares desconocidos o generales, en cuatro familias: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " y ", { term: every- }, "."]
    pt: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " e ", { term: "everyone" }, " nomeiam pessoas, coisas e lugares desconhecidos ou gerais, em quatro famílias: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " e ", { term: "every-" }, "."]
    fr: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " et ", { term: "everyone" }, " désignent des personnes, des choses et des lieux inconnus ou généraux, en quatre familles : ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " et ", { term: "every-" }, "."]
    de: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " und ", { term: "everyone" }, " bezeichnen unbekannte oder allgemeine Personen, Dinge und Orte, in vier Familien: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " und ", { term: "every-" }, "."]
    it: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " e ", { term: "everyone" }, " indicano persone, cose e luoghi sconosciuti o generici, in quattro famiglie: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " e ", { term: "every-" }, "."]
    pl: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " i ", { term: "everyone" }, " nazywają nieznane lub ogólne osoby, rzeczy i miejsca; tworzą cztery grupy: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " i ", { term: "every-" }, "."]
    tr: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " ve ", { term: "everyone" }, " bilinmeyen veya genel kişileri, şeyleri ve yerleri bildirir; dört grup vardır: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " ve ", { term: "every-" }, "."]
    id: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " dan ", { term: "everyone" }, " menyebut orang, benda, dan tempat yang tidak tentu atau umum, dalam empat kelompok: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " dan ", { term: "every-" }, "."]
    vi: [{ term: "Somebody" }, ", ", { term: "anything" }, ", ", { term: "nowhere" }, " và ", { term: "everyone" }, " chỉ người, vật và nơi chốn chưa biết hoặc nói chung, thuộc bốn nhóm: ", { term: "some-" }, ", ", { term: "any-" }, ", ", { term: "no-" }, " và ", { term: "every-" }, "."]
  rule:
    en: "English uses one negative word per clause:"
    uk: "В англійській у реченні вживають лише одне заперечне слово:"
    es: "El inglés usa una sola palabra negativa por oración:"
    pt: "O inglês usa uma só palavra negativa por oração:"
    fr: "L’anglais emploie un seul mot négatif par proposition :"
    de: "Das Englische verwendet ein Verneinungswort pro Satz:"
    it: "L'inglese usa una sola parola negativa per proposizione:"
    pl: "W angielskim w zdaniu stosuje się tylko jedno słowo przeczące:"
    tr: "İngilizcede bir cümlede yalnızca bir olumsuz sözcük kullanılır:"
    id: "Bahasa Inggris hanya memakai satu kata negatif per klausa:"
    vi: "Tiếng Anh chỉ dùng một từ phủ định trong mỗi câu:"
  ex: { examples: [["I don't know ", { target: anything }], ["or I know ", { target: nothing }, "."]] }

