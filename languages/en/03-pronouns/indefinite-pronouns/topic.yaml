          - { level: A2, speakers: [uk], wrong: Nobody didn't come., right: [{ target: Nobody }, " came."], rule: { uk: ["підмет ", { term: nobody }, " уже заперечний, дієслово стверджувальне; в українській «ніхто не прийшов»"] } }
          - { level: A2, speakers: [es], wrong: I don't have nothing., right: { alternatives: [["I don't have ", { target: anything }, "."], ["I have ", { target: nothing }, "."]] }, rule: { es: ["una sola palabra negativa: ", { term: ["not ", { gap: true }, " anything"] }, " o ", { term: nothing }, "; en español «no tengo nada» lleva dos"] } }
