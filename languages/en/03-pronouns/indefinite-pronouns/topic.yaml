# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.indefinite-pronouns
lang: en
kind: grammar
tags: [pronouns, indefinite, some, any, "no", every]
concepts: [indefinite-pronouns]
related: [en.nouns-determiners.quantifiers-some-any-much-many, en.pronouns.personal-pronouns]
status: { en: draft, uk: draft, es: draft }
translated: { uk: "762d1a e7a1ee 09a264 d56305 0d7930 1c4616 be140c", es: "762d1a e7a1ee 09a264 d56305 0d7930 1c4616 be140c" }

title: { en: Indefinite Pronouns, uk: Неозначені займенники, es: Pronombres indefinidos }
summary:
  lead:
    en: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " and ", { term: everyone }, " name unknown or general people, things and places, in four families: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " and ", { term: every- }, "."]
    uk: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " і ", { term: everyone }, " називають невідомих або загальних людей, речі й місця в чотирьох групах: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " та ", { term: every- }, "."]
    es: [{ term: Somebody }, ", ", { term: anything }, ", ", { term: nowhere }, " y ", { term: everyone }, " nombran personas, cosas y lugares desconocidos o generales, en cuatro familias: ", { term: some- }, ", ", { term: any- }, ", ", { term: no- }, " y ", { term: every- }, "."]
  rule:
    en: "English uses one negative word per clause:"
    uk: "В англійській у реченні вживають лише одне заперечне слово:"
    es: "El inglés usa una sola palabra negativa por oración:"
  ex: { examples: [["I don't know ", { target: anything }], ["or I know ", { target: nothing }, "."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: words, label: { en: Words, uk: "Слова", es: "Palabras" }, features: { wordclass: pro, definiteness: indf } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A2, point: some-, words: { alternatives: [somebody, someone, something, somewhere] }, rule: { en: "affirmative sentences, offers and requests", uk: "стверджувальні речення, пропозиції та прохання", es: "oraciones afirmativas, ofrecimientos y peticiones" }, ex: ["I saw ", { target: somebody }, " in the garden."] }
        - { level: A2, point: any-, words: { alternatives: [anybody, anyone, anything, anywhere] }, rule: { en: ["after ", { term: not }, " and in questions"], uk: ["після ", { term: not }, " і в питаннях"], es: ["después de ", { term: not }, " y en preguntas"] }, ex: { examples: [["I didn't see ", { target: anybody }, "."], ["Did ", { target: anyone }, " call?"]] } }
        - { level: A2, point: "no-", words: { alternatives: [nobody, no one, nothing, nowhere] }, rule: { en: "the verb stays affirmative: one negative word", uk: "дієслово стверджувальне: одне заперечне слово", es: "el verbo es afirmativo: una sola palabra negativa" }, ex: ["I saw ", { target: nothing }, "."] }
        - { level: A2, point: every-, words: { alternatives: [everybody, everyone, everything, everywhere] }, rule: { en: means all, uk: "означає «усі, усе»", es: "significa «todos, todo»" }, ex: [{ target: Everything }, " is ready."] }
        - { level: A2, point: { en: Verb, uk: "Дієслово", es: "Verbo" }, words: everybody, rule: { en: indefinite pronouns take a singular verb, uk: "неозначені займенники вживаються з дієсловом в однині", es: "los pronombres indefinidos llevan el verbo en singular" }, ex: [{ target: Everybody is }, " here."] }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa" }, words: nobody, rule: { en: { takes: [negative subject, { term: nobody }] }, uk: { takes: ["заперечний підмет", { term: nobody }] }, es: { takes: ["sujeto negativo", { term: nobody }] } }, ex: [{ target: Nobody }, " came."] }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["-body and -one mean the same: ", { term: somebody }, " = ", { term: someone }, "."]
              uk: ["-body і -one означають те саме: ", { term: somebody }, " = ", { term: someone }, "."]
              es: ["-body y -one significan lo mismo: ", { term: somebody }, " = ", { term: someone }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: no one }, " is two words; the others are one word."]
              uk: [{ term: no one }, " пишеться як два слова, решта — як одне."]
              es: [{ term: no one }, " se escribe en dos palabras; las demás, en una."]
          - type: note
            level: A2
            text:
              en: [{ term: some- }, ", ", { term: any- }, " and ", { term: no- }, " follow the rules of ", { term: some }, ", ", { term: any }, " and ", { term: "no" }, ": see ", { link: Quantifiers, to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]
              uk: [{ term: some- }, ", ", { term: any- }, " і ", { term: no- }, " підпорядковуються правилам ", { term: some }, ", ", { term: any }, " і ", { term: "no" }, ": див. ", { link: "Кількісні слова: some, any, much, many", to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]
              es: [{ term: some- }, ", ", { term: any- }, " y ", { term: no- }, " siguen las reglas de ", { term: some }, ", ", { term: any }, " y ", { term: "no" }, ": ver ", { link: "Cuantificadores: some, any, much, many", to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]

  - title: { en: "Form: verb and word order", uk: "Форма: дієслово й порядок слів", es: "Forma: verbo y orden de las palabras" }
    role: form
    content:
      - type: prose
        level: A2
        text:
          en: Indefinite pronouns take a singular verb.
          uk: "Неозначені займенники вживаються з дієсловом в однині."
          es: "Los pronombres indefinidos llevan el verbo en singular."
      - type: usage
        columns:
          - { key: pronoun, label: { en: Pronoun, uk: "Займенник", es: "Pronombre" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, pronoun: everybody, ex: [{ target: Everybody is }, " here."], tr: { uk: "Усі тут.", es: "Todos están aquí." } }
          - { level: A2, pronoun: somebody, ex: [{ target: Somebody wants }, " to see you."], tr: { uk: "Хтось хоче тебе бачити.", es: "Alguien quiere verte." } }
          - { level: A2, pronoun: nothing, ex: [{ target: Nothing is }, " open on ", { weekday: Sundays, value: 7 }, "."], tr: { uk: "По неділях нічого не працює.", es: "Los domingos no abre nada." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["To refer back to ", { term: somebody }, ", ", { term: everyone }, "…, use ", { alternatives: [{ term: they }, { term: them }, { term: their }] }, ":"]
              uk: ["Щоб далі говорити про ", { term: somebody }, ", ", { term: everyone }, "…, уживають ", { alternatives: [{ term: they }, { term: them }, { term: their }] }, ":"]
              es: ["Para referirse de nuevo a ", { term: somebody }, ", ", { term: everyone }, "…, se usa ", { alternatives: [{ term: they }, { term: them }, { term: their }] }, ":"]
            ex: ["Somebody left ", { target: their }, " bag."]
            tr: { uk: "Хтось залишив свою сумку.", es: "Alguien dejó su bolso." }
          - type: rule
            level: A2
            text:
              en: ["Adjectives and ", { term: else }, " go after: ", { term: something new }, ", ", { term: somebody else }, "."]
              uk: ["Прикметники й ", { term: else }, " стоять після займенника: ", { term: something new }, ", ", { term: somebody else }, "."]
              es: ["Los adjetivos y ", { term: else }, " van después: ", { term: something new }, ", ", { term: somebody else }, "."]

  - title: { en: Pronunciation, uk: "Вимова", es: "Pronunciación" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: ipa, label: { en: Sound, uk: "Звук", es: "Sonido" } }
        rows:
          - { level: A2, word: somebody, ipa: { ipa: ˈsʌmbədi } }
          - { level: A2, word: someone, ipa: { ipa: ˈsʌmwʌn } }
          - { level: A2, word: anything, ipa: { ipa: ˈeniθɪŋ } }
          - { level: A2, word: nobody, ipa: { ipa: ˈnəʊbədi } }
          - { level: A2, word: nothing, ipa: { ipa: ˈnʌθɪŋ } }
          - { level: A2, word: everywhere, ipa: { ipa: ˈevriweə } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: The stress falls on the first syllable.
              uk: "Наголос падає на перший склад."
              es: "El acento recae en la primera sílaba."
          - type: rule
            level: A2
            text:
              en: [{ term: any }, " is ", { ipa: ˈeni }, ", with the vowel of ", { term: bed }, "."]
              uk: [{ term: any }, " читається ", { ipa: ˈeni }, ", із голосним як у ", { term: bed }, "."]
              es: [{ term: any }, " se pronuncia ", { ipa: ˈeni }, ", con la vocal de ", { term: bed }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: nothing }, " has ", { ipa: ʌ }, ", like ", { term: some }, "; ", { term: nobody }, " has ", { ipa: əʊ }, ", like ", { term: "no" }, "."]
              uk: [{ term: nothing }, " має ", { ipa: ʌ }, ", як у ", { term: some }, "; ", { term: nobody }, " має ", { ipa: əʊ }, ", як у ", { term: "no" }, "."]
              es: [{ term: nothing }, " tiene ", { ipa: ʌ }, ", como ", { term: some }, "; ", { term: nobody }, " tiene ", { ipa: əʊ }, ", como ", { term: "no" }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: every }, " has two syllables: ", { ipa: ˈevri }, "."]
              uk: [{ term: every }, " має два склади: ", { ipa: ˈevri }, "."]
              es: [{ term: every }, " tiene dos sílabas: ", { ipa: ˈevri }, "."]

  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: ["affirmative: ", { term: some- }], uk: ["ствердження: ", { term: some- }], es: ["afirmación: ", { term: some- }] }, ex: ["I saw ", { target: somebody }, " in the garden."], tr: { uk: "Я бачив когось у саду.", es: "Vi a alguien en el jardín." } }
          - { level: A2, use: { en: ["negative: ", { term: ["not ", { gap: true }, " any-"] }], uk: ["заперечення: ", { term: ["not ", { gap: true }, " any-"] }], es: ["negación: ", { term: ["not ", { gap: true }, " any-"] }] }, ex: ["I didn't see ", { target: anybody }, "."], tr: { uk: "Я нікого не бачив.", es: "No vi a nadie." } }
          - { level: A2, use: { en: ["question: ", { term: any- }], uk: ["питання: ", { term: any- }], es: ["pregunta: ", { term: any- }] }, ex: ["Did ", { target: anyone }, " call?"], tr: { uk: "Хтось дзвонив?", es: "¿Llamó alguien?" } }
          - { level: A2, use: { en: ["offer or request: ", { term: some- }], uk: ["пропозиція або прохання: ", { term: some- }], es: ["ofrecimiento o petición: ", { term: some- }] }, ex: ["Would you like ", { target: something }, " to drink?"], tr: { uk: "Хочеш чогось випити?", es: "¿Quieres algo de beber?" } }
          - { level: A2, use: { en: { pattern: [{ term: no- }, affirmative verb] }, uk: { pattern: [{ term: no- }, "стверджувальне дієслово"] }, es: { pattern: [{ term: no- }, "verbo afirmativo"] } }, ex: ["I saw ", { target: nothing }, "."], tr: { uk: "Я нічого не бачив.", es: "No vi nada." } }
          - { level: A2, use: { en: ["one-word answer: ", { term: no- }], uk: ["відповідь одним словом: ", { term: no- }], es: ["respuesta de una palabra: ", { term: no- }] }, ex: { exchange: [What did you buy?, [{ target: Nothing }, "."]] }, tr: { uk: "Що ти купив? — Нічого.", es: "¿Qué compraste? — Nada." } }
          - { level: A2, use: { en: [{ term: every- }, " = all"], uk: [{ term: every- }, " = усі, усе"], es: [{ term: every- }, " = todos, todo"] }, ex: [{ target: Everything }, " is ready."], tr: { uk: "Усе готово.", es: "Todo está listo." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["One negative word only: ", { term: ["not ", { gap: true }, " anybody"] }, " or ", { term: nobody }, "."]
              uk: ["Лише одне заперечне слово: ", { term: ["not ", { gap: true }, " anybody"] }, " або ", { term: nobody }, "."]
              es: ["Una sola palabra negativa: ", { term: ["not ", { gap: true }, " anybody"] }, " o ", { term: nobody }, "."]
          - type: rule
            level: A2
            text:
              en: ["A negative subject is ", { term: no- }, ", with an affirmative verb:"]
              uk: ["Заперечний підмет утворюють із ", { term: no- }, ", а дієслово стоїть у стверджувальній формі:"]
              es: ["Un sujeto negativo lleva ", { term: no- }, " y el verbo va en afirmativo:"]
            ex: [{ target: Nobody }, " came."]
            tr: { uk: "Ніхто не прийшов.", es: "No vino nadie." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Anybody came., right: [{ target: Nobody }, " came."], rule: { en: { takes: [negative subject, { term: nobody }] }, uk: { takes: ["заперечний підмет", { term: nobody }] }, es: { takes: ["sujeto negativo", { term: nobody }] } } }
          - { level: A2, wrong: Everybody are here., right: ["Everybody ", { target: is }, " here."], rule: { en: singular verb, uk: "дієслово в однині", es: "verbo en singular" } }
          - { level: A2, speakers: [uk], wrong: I don't know nothing., right: { alternatives: [["I don't know ", { target: anything }, "."], ["I know ", { target: nothing }, "."]] }, rule: { uk: ["одне заперечне слово: ", { term: ["not ", { gap: true }, " anything"] }, " або ", { term: nothing }, "; в українській їх кілька («нічого не знаю»)"] } }
          - { level: A2, speakers: [uk], wrong: Nobody didn't come., right: [{ target: Nobody }, " came."], rule: { uk: ["підмет ", { term: nobody }, " уже заперечний, дієслово стверджувальне; в українській «ніхто не прийшов»"] } }
          - { level: A2, speakers: [es], wrong: I don't have nothing., right: { alternatives: [["I don't have ", { target: anything }, "."], ["I have ", { target: nothing }, "."]] }, rule: { es: ["una sola palabra negativa: ", { term: ["not ", { gap: true }, " anything"] }, " o ", { term: nothing }, "; en español «no tengo nada» lleva dos"] } }
