          - { level: A2, wrong: Everybody are here., right: ["Everybody ", { target: is }, " here."], rule: { en: singular verb, uk: "дієслово в однині", es: "verbo en singular", pt: "verbo no singular", fr: "verbe au singulier", de: "Verb im Singular", it: "verbo al singolare", pl: "czasownik w liczbie pojedynczej", tr: "tekil fiil", id: "kata kerja bentuk tunggal", vi: "động từ số ít" } }
          - { level: B2, wrong: I would like another books., right: { alternatives: [["I would like ", { target: another book }, "."], ["I would like ", { target: other books }, "."]] }, rule: { en: { pattern: [{ term: another }, { slot: singular noun }] } } }
          - { level: B2, wrong: "Where is the others book?", right: ["Where is ", { target: the other book }, "?"], rule: { en: [{ term: others }, " stands alone; before a noun the word is ", { term: other }] } }
