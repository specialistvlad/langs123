  - title: { en: "With to, relative clauses and of", uk: "З to, означальні підрядні речення та of", es: "Con to, oraciones de relativo y of", pt: "Com to, orações relativas e of", fr: "Avec to, propositions relatives et of", de: "Mit to, Relativsätze und of", it: "Con to, proposizioni relative e of", pl: "Z to, zdania względne i of", tr: "to, ilgi cümleleri ve of ile", id: "Dengan to, klausa relatif, dan of", vi: "Với to, mệnh đề quan hệ và of" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [{ alternatives: [something, anything, nothing] }, to, { slot: V }] }, ex: { examples: [["I need ", { target: something to eat }, "."], ["She has ", { target: nothing to lose }, "."]] }, tr: { uk: { examples: ["Мені потрібно щось поїсти.", "Їй нічого втрачати."] }, es: { examples: ["Necesito algo de comer.", "No tiene nada que perder."] }, pt: { examples: ["Preciso de algo para comer.", "Ela não tem nada a perder."] }, fr: { examples: ["J’ai besoin de manger quelque chose.", "Elle n’a rien à perdre."] }, de: { examples: ["Ich brauche etwas zu essen.", "Sie hat nichts zu verlieren."] }, it: { examples: ["Ho bisogno di qualcosa da mangiare.", "Non ha niente da perdere."] }, pl: { examples: ["Potrzebuję czegoś do jedzenia.", "Ona nie ma nic do stracenia."] }, tr: { examples: ["Yiyecek bir şeye ihtiyacım var.", "Kaybedecek hiçbir şeyi yok."] }, id: { examples: ["Saya butuh sesuatu untuk dimakan.", "Dia tidak punya apa-apa yang bisa hilang."] }, vi: { examples: ["Tôi cần thứ gì đó để ăn.", "Cô ấy chẳng còn gì để mất."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [someone, anyone, nobody] }, to, { slot: V }, { slot: { en: preposition, uk: "прийменник", es: "preposición", pt: "preposição", fr: "préposition", de: "Präposition", it: "preposizione", pl: "przyimek", tr: "edat", id: "kata depan", vi: "giới từ" } }] }, ex: { examples: [["I need ", { target: someone to talk to }, "."], ["He has ", { target: nobody to rely on }, "."]] }, tr: { uk: { examples: ["Мені потрібен хтось, з ким поговорити.", "Йому ні на кого покластися."] }, es: { examples: ["Necesito a alguien con quien hablar.", "No tiene a nadie en quien confiar."] }, pt: { examples: ["Preciso de alguém com quem conversar.", "Ele não tem ninguém em quem confiar."] }, fr: { examples: ["J’ai besoin de quelqu’un à qui parler.", "Il n’a personne sur qui compter."] }, de: { examples: ["Ich brauche jemanden zum Reden.", "Er hat niemanden, auf den er sich verlassen kann."] }, it: { examples: ["Ho bisogno di qualcuno con cui parlare.", "Non ha nessuno su cui contare."] }, pl: { examples: ["Potrzebuję kogoś, z kim można porozmawiać.", "Nie ma na kim polegać."] }, tr: { examples: ["Konuşacak birine ihtiyacım var.", "Güvenebileceği kimsesi yok."] }, id: { examples: ["Saya butuh seseorang untuk diajak bicara.", "Dia tidak punya siapa pun untuk diandalkan."] }, vi: { examples: ["Tôi cần một người để trò chuyện.", "Anh ấy không có ai để nương tựa."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [someone, anyone, everyone, nobody] }, who, { slot: clause }] }, ex: { examples: [[{ target: Anyone who }, " has a ticket can come in."], ["I know ", { target: someone who }, " speaks Japanese."]] }, tr: { uk: { examples: ["Кожен, хто має квиток, може увійти.", "Я знаю когось, хто розмовляє японською."] }, es: { examples: ["Cualquiera que tenga un boleto puede entrar.", "Conozco a alguien que habla japonés."] }, pt: { examples: ["Qualquer pessoa que tenha um ingresso pode entrar.", "Conheço alguém que fala japonês."] }, fr: { examples: ["Toute personne qui a un billet peut entrer.", "Je connais quelqu’un qui parle japonais."] }, de: { examples: ["Jeder, der eine Eintrittskarte hat, darf hinein.", "Ich kenne jemanden, der Japanisch spricht."] }, it: { examples: ["Chiunque abbia un biglietto può entrare.", "Conosco qualcuno che parla giapponese."] }, pl: { examples: ["Każdy, kto ma bilet, może wejść.", "Znam kogoś, kto mówi po japońsku."] }, tr: { examples: ["Bileti olan herkes içeri girebilir.", "Japonca konuşan birini tanıyorum."] }, id: { examples: ["Siapa pun yang punya tiket boleh masuk.", "Saya kenal seseorang yang bisa berbahasa Jepang."] }, vi: { examples: ["Ai có vé đều được vào.", "Tôi biết một người nói tiếng Nhật."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [something, anything, everything, nothing] }, that, { slot: clause }] }, ex: { examples: [[{ target: Everything that }, " she said was true."], ["Is there ", { target: anything that }, " you need?"]] }, tr: { uk: { examples: ["Усе, що вона сказала, було правдою.", "Чи є щось, що тобі потрібне?"] }, es: { examples: ["Todo lo que dijo era verdad.", "¿Hay algo que necesites?"] }, pt: { examples: ["Tudo o que ela disse era verdade.", "Tem alguma coisa de que você precise?"] }, fr: { examples: ["Tout ce qu’elle a dit était vrai.", "Y a-t-il quelque chose dont tu as besoin ?"] }, de: { examples: ["Alles, was sie gesagt hat, war wahr.", "Gibt es etwas, das du brauchst?"] }, it: { examples: ["Tutto quello che ha detto era vero.", "C'è qualcosa di cui hai bisogno?"] }, pl: { examples: ["Wszystko, co powiedziała, było prawdą.", "Czy jest coś, czego potrzebujesz?"] }, tr: { examples: ["Söylediği her şey doğruydu.", "İhtiyacın olan bir şey var mı?"] }, id: { examples: ["Semua yang dia katakan itu benar.", "Apakah ada sesuatu yang kamu butuhkan?"] }, vi: { examples: ["Mọi điều cô ấy nói đều đúng.", "Có thứ gì bạn cần không?"] } } }
          - { level: B2, form: { pattern: [all, that, { slot: clause }] }, ex: { examples: [[{ target: All that }, " matters is your health."], ["That is ", { target: all that }, " I know."]] }, tr: { uk: { examples: ["Єдине, що має значення, — твоє здоров’я.", "Це все, що я знаю."] }, es: { examples: ["Lo único que importa es tu salud.", "Eso es todo lo que sé."] }, pt: { examples: ["Tudo o que importa é a sua saúde.", "Isso é tudo o que eu sei."] }, fr: { examples: ["Tout ce qui compte, c’est ta santé.", "C’est tout ce que je sais."] }, de: { examples: ["Alles, was zählt, ist deine Gesundheit.", "Das ist alles, was ich weiß."] }, it: { examples: ["Tutto ciò che conta è la tua salute.", "Questo è tutto ciò che so."] }, pl: { examples: ["Liczy się tylko twoje zdrowie.", "To wszystko, co wiem."] }, tr: { examples: ["Önemli olan tek şey sağlığın.", "Bildiğim her şey bu kadar."] }, id: { examples: ["Yang penting hanyalah kesehatanmu.", "Hanya itu yang saya tahu."] }, vi: { examples: ["Điều quan trọng duy nhất là sức khỏe của bạn.", "Đó là tất cả những gì tôi biết."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [some, any, none, each] }, of, { alternatives: [them, us, you] }] }, ex: { examples: [[{ target: Some of them }, " were late."], [{ target: None of us }, " knew the answer."]] }, tr: { uk: { examples: ["Деякі з них запізнилися.", "Ніхто з нас не знав відповіді."] }, es: { examples: ["Algunos de ellos llegaron tarde.", "Ninguno de nosotros sabía la respuesta."] }, pt: { examples: ["Alguns deles chegaram atrasados.", "Nenhum de nós sabia a resposta."] }, fr: { examples: ["Certains d’entre eux étaient en retard.", "Aucun de nous ne connaissait la réponse."] }, de: { examples: ["Einige von ihnen kamen zu spät.", "Keiner von uns kannte die Antwort."] }, it: { examples: ["Alcuni di loro erano in ritardo.", "Nessuno di noi sapeva la risposta."] }, pl: { examples: ["Niektórzy z nich się spóźnili.", "Nikt z nas nie znał odpowiedzi."] }, tr: { examples: ["Bazıları geç kaldı.", "Hiçbirimiz cevabı bilmiyordu."] }, id: { examples: ["Beberapa dari mereka terlambat.", "Tidak satu pun dari kami tahu jawabannya."] }, vi: { examples: ["Một vài người trong số họ đến muộn.", "Không ai trong chúng tôi biết câu trả lời."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Leave out ", { term: that }, " when it is the object of its clause:"], uk: ["Опускайте ", { term: "that" }, ", коли воно є додатком у своєму реченні:"], es: ["Omite ", { term: "that" }, " cuando es el objeto de su oración:"], pt: ["Omita ", { term: "that" }, " quando ele é o objeto da sua oração:"], fr: ["On omet ", { term: "that" }, " quand il est complément d’objet de sa proposition :"], de: ["Lass ", { term: "that" }, " weg, wenn es das Objekt seines Satzes ist:"], it: ["Ometti ", { term: "that" }, " quando è il complemento oggetto della sua proposizione:"], pl: ["Pomijaj ", { term: "that" }, ", gdy jest dopełnieniem w swoim zdaniu:"], tr: ["Kendi cümlesinde nesne olduğunda ", { term: "that" }, " düşürülür:"], id: ["Hilangkan ", { term: "that" }, " bila ia menjadi objek dalam klausanya:"], vi: ["Bỏ ", { term: "that" }, " khi nó là tân ngữ trong mệnh đề của nó:"] }
            ex: ["Everything ", { optional: that }, " she said was true."]
            tr: { uk: "Усе, що вона сказала, було правдою.", es: "Todo lo que dijo era verdad.", pt: "Tudo o que ela disse era verdade.", fr: "Tout ce qu’elle a dit était vrai.", de: "Alles, was sie gesagt hat, war wahr.", it: "Tutto quello che ha detto era vero.", pl: "Wszystko, co powiedziała, było prawdą.", tr: "Söylediği her şey doğruydu.", id: "Semua yang dia katakan itu benar.", vi: "Mọi điều cô ấy nói đều đúng." }
          - type: rule
            level: B2
            text: { en: ["A noun after ", { term: of }, " takes ", { term: the }, ", ", { term: my }, ", ", { term: these }, " or a similar word:"], uk: ["Іменник після ", { term: "of" }, " має ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " або подібне слово:"], es: ["Un sustantivo después de ", { term: "of" }, " lleva ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " u otra palabra similar:"], pt: ["Um substantivo depois de ", { term: "of" }, " leva ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " ou uma palavra parecida:"], fr: ["Un nom après ", { term: "of" }, " prend ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " ou un mot semblable :"], de: ["Ein Nomen nach ", { term: "of" }, " steht mit ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " oder einem ähnlichen Wort:"], it: ["Un sostantivo dopo ", { term: "of" }, " vuole ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " o una parola simile:"], pl: ["Rzeczownik po ", { term: "of" }, " ma ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " lub podobne słowo:"], tr: [{ term: "of" }, " sözcüğünden sonraki isim ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " ya da benzeri bir sözcük alır:"], id: ["Kata benda setelah ", { term: "of" }, " memakai ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, ", atau kata serupa:"], vi: ["Danh từ sau ", { term: "of" }, " đi với ", { term: "the" }, ", ", { term: "my" }, ", ", { term: "these" }, " hoặc một từ tương tự:"] }
            ex: ["Some of ", { target: my friends }, " live abroad."]
            tr: { uk: "Деякі з моїх друзів живуть за кордоном.", es: "Algunos de mis amigos viven en el extranjero.", pt: "Alguns dos meus amigos moram no exterior.", fr: "Certains de mes amis vivent à l’étranger.", de: "Einige meiner Freunde leben im Ausland.", it: "Alcuni dei miei amici vivono all'estero.", pl: "Niektórzy z moich przyjaciół mieszkają za granicą.", tr: "Arkadaşlarımdan bazıları yurt dışında yaşıyor.", id: "Beberapa temanku tinggal di luar negeri.", vi: "Một vài người bạn của tôi sống ở nước ngoài." }
