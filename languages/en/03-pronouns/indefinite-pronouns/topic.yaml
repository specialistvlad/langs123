}, " folgen"], it: ["può seguire un infinito, una proposizione con ", { term: "who" }, " o ", { term: "that" }, " o un gruppo con ", { term: "of" }], pl: ["może następować bezokolicznik, zdanie z ", { term: "who" }, " lub ", { term: "that" }, " albo grupa z ", { term: "of" }], tr: ["ardından bir mastar, ", { term: "who" }, " ya da ", { term: "that" }, " ile başlayan bir cümle veya ", { term: "of" }, " ile kurulan bir öbek gelebilir"], id: ["dapat diikuti infinitif, klausa dengan ", { term: "who" }, " atau ", { term: "that" }, ", atau frasa dengan ", { term: "of" }], vi: ["có thể theo sau là động từ nguyên mẫu, mệnh đề với ", { term: "who" }, " hoặc ", { term: "that" }, ", hoặc cụm với ", { term: "of" }] }, ex: ["I need ", { target: someone to talk to }, "."] }
