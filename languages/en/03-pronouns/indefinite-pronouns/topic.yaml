              vi: ["Chỉ một từ phủ định: ", { term: ["not ", { gap: true }, " anybody"] }, " hoặc ", { term: "nobody" }, "."]
          - type: rule
            level: A2
            text:
              en: ["A negative subject is ", { term: no- }, ", with an affirmative verb:"]
              uk: ["Заперечний підмет утворюють із ", { term: no- }, ", а дієслово стоїть у стверджувальній формі:"]
              es: ["Un sujeto negativo lleva ", { term: no- }, " y el verbo va en afirmativo:"]
              pt: ["Um sujeito negativo leva ", { term: "no-" }, " e o verbo fica afirmativo:"]
              fr: ["Un sujet négatif prend ", { term: "no-" }, " et le verbe reste à la forme affirmative :"]
              de: ["Ein verneintes Subjekt hat ", { term: "no-" }, ", mit bejahtem Verb:"]
              it: ["Un soggetto negativo prende ", { term: "no-" }, ", con un verbo affermativo:"]
              pl: ["Podmiot przeczący tworzy się z ", { term: "no-" }, ", a czasownik stoi w formie twierdzącej:"]
              tr: ["Olumsuz özne ", { term: "no-" }, " ile kurulur, fiil olumlu kalır:"]
              id: ["Subjek negatif memakai ", { term: "no-" }, ", dengan kata kerja positif:"]
              vi: ["Chủ ngữ phủ định dùng ", { term: "no-" }, ", với động từ khẳng định:"]
            ex: [{ target: Nobody }, " came."]
            tr: { uk: "Ніхто не прийшов.", es: "No vino nadie.", pt: "Ninguém veio.", fr: "Personne n’est venu.", de: "Niemand ist gekommen.", it: "Non è venuto nessuno.", pl: "Nikt nie przyszedł.", tr: "Kimse gelmedi.", id: "Tidak ada yang datang.", vi: "Không ai đến." }

  - title: { en: Other and another }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, features: { number: sg, definiteness: indf }, form: another, meaning: { en: "one more, or a different one" }, ex: { examples: [["Would you like ", { target: another }, " biscuit?"], ["This pen is dry. Have you got ", { target: another }, "?"]] } }
          - { level: B2, features: { number: sg, definiteness: def }, form: the other, meaning: { en: "the second of two" }, ex: ["One bag is red; ", { target: the other }, " is blue."] }
          - { level: B2, features: { number: pl, definiteness: indf, wordclass: pro }, form: others, meaning: { en: "some more, not all" }, ex: ["Some people like tea; ", { target: others }, " prefer coffee."] }
          - { level: B2, features: { number: pl, definiteness: def, wordclass: pro }, form: the others, meaning: { en: "all the rest" }, ex: ["Ana stayed, but ", { target: the others }, " went home."] }
          - { level: B2, features: { number: pl, wordclass: det }, form: { pattern: [other, { slot: plural noun }] }, meaning: { en: "further or different things" }, ex: ["I have ", { target: other plans }, " for Saturday."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Before a number, ", { term: another }, " takes a plural noun and means a further amount:"] }
            ex: ["Wait ", { target: another ten minutes }, "."]
          - type: rule
            level: B2
            text: { en: ["Before a noun, ", { term: other }, " never takes -s; the pronouns ", { term: others }, " and ", { term: the others }, " stand alone:"] }
            ex: ["Where are ", { target: the other students }, "?"]
          - type: note
            level: B2
            text: { en: ["For ", { term: each other }, " and ", { term: one another }, ", see ", { link: Reflexive pronouns, to: en.pronouns.reflexive-pronouns }, "."] }

  - title: { en: "With to, relative clauses and of" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: { pattern: [{ alternatives: [something, anything, nothing] }, to, { slot: V }] }, ex: { examples: [["I need ", { target: something to eat }, "."], ["She has ", { target: nothing to lose }, "."]] } }
          - { level: B2, form: { pattern: [{ alternatives: [someone, anyone, nobody] }, to, { slot: V }, { slot: { en: preposition } }] }, ex: { examples: [["I need ", { target: someone to talk to }, "."], ["He has ", { target: nobody to rely on }, "."]] } }
          - { level: B2, form: { pattern: [{ alternatives: [someone, anyone, everyone, nobody] }, who, { slot: clause }] }, ex: { examples: [[{ target: Anyone who }, " has a ticket can come in."], ["I know ", { target: someone who }, " speaks Japanese."]] } }
          - { level: B2, form: { pattern: [{ alternatives: [something, anything, everything, nothing] }, that, { slot: clause }] }, ex: { examples: [[{ target: Everything that }, " she said was true."], ["Is there ", { target: anything that }, " you need?"]] } }
          - { level: B2, form: { pattern: [all, that, { slot: clause }] }, ex: { examples: [[{ target: All that }, " matters is your health."], ["That is ", { target: all that }, " I know."]] } }
          - { level: B2, form: { pattern: [{ alternatives: [some, any, none, each] }, of, { alternatives: [them, us, you] }] }, ex: { examples: [[{ target: Some of them }, " were late."], [{ target: None of us }, " knew the answer."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Leave out ", { term: that }, " when it is the object of its clause:"] }
            ex: ["Everything ", { optional: that }, " she said was true."]
          - type: rule
            level: B2
            text: { en: ["A noun after ", { term: of }, " takes ", { term: the }, ", ", { term: my }, ", ", { term: these }, " or a similar word:"] }
            ex: ["Some of ", { target: my friends }, " live abroad."]
  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
