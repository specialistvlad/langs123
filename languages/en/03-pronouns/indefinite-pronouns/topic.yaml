        - { level: A2, point: any-, words: { alternatives: [anybody, anyone, anything, anywhere] }, rule: { en: ["after ", { term: not }, " and in questions"], uk: ["після ", { term: not }, " і в питаннях"], es: ["después de ", { term: not }, " y en preguntas"], pt: ["depois de ", { term: "not" }, " e em perguntas"], fr: ["après ", { term: "not" }, " et dans les questions"], de: ["nach ", { term: "not" }, " und in Fragen"], it: ["dopo ", { term: "not" }, " e nelle domande"], pl: ["po ", { term: "not" }, " i w pytaniach"], tr: [{ term: "not" }, " sözcüğünden sonra ve sorularda"], id: ["setelah ", { term: "not" }, " dan dalam pertanyaan"], vi: ["sau ", { term: "not" }, " và trong câu hỏi"] }, ex: { examples: [["I didn't see ", { target: anybody }, "."], ["Did ", { target: anyone }, " call?"]] } }
        - { level: A2, point: "no-", words: { alternatives: [nobody, no one, nothing, nowhere] }, rule: { en: "the verb stays affirmative: one negative word", uk: "дієслово стверджувальне: одне заперечне слово", es: "el verbo es afirmativo: una sola palabra negativa", pt: "o verbo fica afirmativo: uma só palavra negativa", fr: "le verbe reste à la forme affirmative : un seul mot négatif", de: "das Verb bleibt bejaht: ein Verneinungswort", it: "il verbo resta affermativo: una sola parola negativa", pl: "czasownik jest w formie twierdzącej: jedno słowo przeczące", tr: "fiil olumlu kalır: tek bir olumsuz sözcük", id: "kata kerja tetap positif: hanya satu kata negatif", vi: "động từ ở dạng khẳng định: chỉ một từ phủ định" }, ex: ["I saw ", { target: nothing }, "."] }
        - { level: A2, point: every-, words: { alternatives: [everybody, everyone, everything, everywhere] }, rule: { en: means all, uk: "означає «усі, усе»", es: "significa «todos, todo»", pt: "significa “todos, tudo”", fr: "signifie « tous, tout »", de: "bedeutet „alle, alles“", it: "significa «tutti, tutto»", pl: "oznacza „wszyscy, wszystko”", tr: "“hepsi, her şey” anlamına gelir", id: "berarti semua", vi: "nghĩa là tất cả" }, ex: [{ target: Everything }, " is ready."] }
        - { level: A2, point: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" }, words: everybody, rule: { en: indefinite pronouns take a singular verb, uk: "неозначені займенники вживаються з дієсловом в однині", es: "los pronombres indefinidos llevan el verbo en singular", pt: "os pronomes indefinidos levam o verbo no singular", fr: "les pronoms indéfinis prennent un verbe au singulier", de: "Indefinitpronomen stehen mit dem Verb im Singular", it: "i pronomi indefiniti prendono il verbo al singolare", pl: "zaimki nieokreślone łączą się z czasownikiem w liczbie pojedynczej", tr: "belgisiz zamirler tekil fiille kullanılır", id: "kata ganti tak tentu diikuti kata kerja bentuk tunggal", vi: "đại từ bất định đi với động từ số ít" }, ex: [{ target: Everybody is }, " here."] }
        - { level: B2, point: { en: Singular }, words: { alternatives: [another, the other] }, rule: { en: "one more or a different one; the second of two" }, ex: ["One bag is red; ", { target: the other }, " is blue."] }
        - { level: B2, point: { en: Plural }, words: { alternatives: [others, the others] }, rule: { en: "some more; all the rest" }, ex: ["Some stayed; ", { target: the others }, " left."] }
        - { level: B2, point: { en: ["With ", { term: to }, ", ", { term: who }, ", ", { term: that }, " and ", { term: of }] }, words: { alternatives: [something, someone, everything, none] }, rule: { en: ["an infinitive, a ", { term: who }, " or ", { term: that }, " clause or an ", { term: of }, "-phrase can follow"] }, ex: ["I need ", { target: someone to talk to }, "."] }
        - { level: B2, point: { en: Fixed phrases }, words: { alternatives: [anything but, nothing but, something of a, no one but] }, rule: { en: "not at all; only; a bit of a; nobody except" }, ex: ["The film was ", { target: anything but }, " dull."] }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, words: nobody, rule: { en: { takes: [negative subject, { term: nobody }] }, uk: { takes: ["заперечний підмет", { term: nobody }] }, es: { takes: ["sujeto negativo", { term: nobody }] }, pt: { takes: ["sujeito negativo", { term: "nobody" }] }, fr: { takes: ["sujet négatif", { term: "nobody" }] }, de: { takes: ["verneintes Subjekt", { term: "nobody" }] }, it: { takes: ["soggetto negativo", { term: "nobody" }] }, pl: { takes: ["podmiot przeczący", { term: "nobody" }] }, tr: { takes: ["olumsuz özne", { term: "nobody" }] }, id: { takes: ["subjek negatif", { term: "nobody" }] }, vi: { takes: ["chủ ngữ phủ định", { term: "nobody" }] } }, ex: [{ target: Nobody }, " came."] }
        - { level: B2, point: { en: Trap }, words: another, rule: { en: { pattern: [{ term: another }, { slot: singular noun }] } }, ex: { examples: [["I need ", { target: another book }, "."], ["I need ", { target: other books }, "."]] } }

