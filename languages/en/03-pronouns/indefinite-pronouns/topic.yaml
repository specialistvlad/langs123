          - { level: B2, wrong: "Where is the others book?", right: ["Where is ", { target: the other book }, "?"], rule: { en: [{ term: others }, " stands alone; before a noun the word is ", { term: other }], uk: [{ term: "others" }, " стоїть самостійно; перед іменником слово має вигляд ", { term: "other" }], es: [{ term: "others" }, " va solo; ante un sustantivo la palabra es ", { term: "other" }], pt: [{ term: "others" }, " fica sozinho; antes de um substantivo a palavra é ", { term: "other" }], fr: [{ term: "others" }, " s’emploie seul ; devant un nom, le mot est ", { term: "other" }], de: [{ term: "others" }, " steht allein; vor einem Nomen heißt das Wort ", { term: "other" }], it: [{ term: "others" }, " sta da solo; davanti a un sostantivo la parola è ", { term: "other" }], pl: [{ term: "others" }, " stoi samodzielnie; przed rzeczownikiem słowo ma postać ", { term: "other" }], tr: [{ term: "others" }, " tek başına kullanılır; bir isimden önce sözcük ", { term: "other" }, " olur"], id: [{ term: "others" }, " berdiri sendiri; sebelum kata benda, katanya adalah ", { term: "other" }], vi: [{ term: "others" }, " đứng một mình; trước danh từ thì từ này là ", { term: "other" }] } }
