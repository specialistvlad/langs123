        - { level: A2, point: each other, rule: { en: { takes: [each person, the other person] }, uk: { takes: ["кожна особа", "інша особа"] }, es: { takes: ["cada persona", "la otra persona"] }, pt: { takes: ["cada pessoa", "a outra pessoa"] }, fr: { takes: ["chaque personne", "l’autre personne"] }, de: { takes: ["jede Person", "die andere Person"] }, it: { takes: ["ciascuna persona", "l'altra persona"] }, pl: { takes: ["każda osoba", "inna osoba"] }, tr: { takes: ["her kişi", "diğer kişi"] }, id: { takes: ["setiap orang", "orang yang lain"] }, vi: { takes: ["mỗi người", "người kia"] } }, ex: ["They looked at ", { target: each other }, "."], tr: { uk: "Вони подивилися одне на одного.", es: "Se miraron el uno al otro.", pt: "Eles olharam um para o outro.", fr: "Ils se sont regardés l’un l’autre.", de: "Sie sahen sich gegenseitig an.", it: "Si sono guardati l'un l'altro.", pl: "Spojrzeli na siebie nawzajem.", tr: "Birbirlerine baktılar.", id: "Mereka saling memandang.", vi: "Họ nhìn nhau." } }
        - { level: B2, point: { en: Verbs with a reflexive, uk: "Дієслова зі зворотним займенником", es: "Verbos con reflexivo", pt: "Verbos com reflexivo", fr: "Verbes avec un pronom réfléchi", de: "Verben mit Reflexivpronomen", it: "Verbi con il riflessivo", pl: "Czasowniki z zaimkiem zwrotnym", tr: "Dönüşlü zamirli fiiller", id: "Kata kerja dengan refleksif", vi: "Động từ đi với đại từ phản thân" }, rule: { en: ["the reflexive belongs to the verb: ", { term: enjoy yourself }, ", ", { term: pride oneself on }], uk: ["зворотний займенник — частина дієслова: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], es: ["el reflexivo forma parte del verbo: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], pt: ["o reflexivo faz parte do verbo: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], fr: ["le pronom réfléchi fait partie du verbe : ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], de: ["das Reflexivpronomen gehört zum Verb: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], it: ["il riflessivo fa parte del verbo: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], pl: ["zaimek zwrotny należy do czasownika: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], tr: ["dönüşlü zamir fiilin parçasıdır: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], id: ["refleksif merupakan bagian dari kata kerja: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }], vi: ["đại từ phản thân là một phần của động từ: ", { term: "enjoy yourself" }, ", ", { term: "pride oneself on" }] }, ex: ["Please ", { target: behave yourselves }, "."], tr: { uk: "Поводьтеся пристойно, будь ласка.", es: "Pórtense bien, por favor.", pt: "Comportem-se, por favor.", fr: "Tenez-vous bien, s’il vous plaît.", de: "Benehmt euch bitte.", it: "Comportatevi bene, per favore.", pl: "Zachowujcie się, proszę.", tr: "Lütfen düzgün davranın.", id: "Tolong bersikaplah yan