        - { level: A2, point: { en: Same person, uk: "Та сама особа", es: "La misma persona", pt: "A mesma pessoa", fr: "Même personne", de: "Dieselbe Person", it: "La stessa persona", pl: "Ta sama osoba", tr: "Aynı kişi", id: "Orang yang sama", vi: "Cùng một người" }, rule: { en: the object is the same person as the subject, uk: "додаток — та сама особа, що й підмет", es: "el objeto es la misma persona que el sujeto", pt: "o objeto é a mesma pessoa que o sujeito", fr: "le complément est la même personne que le sujet", de: "das Objekt ist dieselbe Person wie das Subjekt", it: "il complemento è la stessa persona del soggetto", pl: "dopełnienie to ta sama osoba co podmiot", tr: "nesne, özneyle aynı kişidir", id: "objek adalah orang yang sama dengan subjek", vi: "tân ngữ là cùng một người với chủ ngữ" }, ex: ["I burnt ", { target: myself }, " in the kitchen."], tr: { uk: "Я обпікся на кухні.", es: "Me quemé en la cocina.", pt: "Eu me queimei na cozinha.", fr: "Je me suis brûlé dans la cuisine.", de: "Ich habe mich in der Küche verbrannt.", it: "Mi sono bruciato in cucina.", pl: "Oparzyłem się w kuchni.", tr: "Mutfakta kendimi yaktım.", id: "Saya kena luka bakar di dapur.", vi: "Tôi bị bỏng trong bếp." } }
        - { level: A2, point: { en: Emphasis, uk: "Підсилення", es: "Énfasis", pt: "Ênfase", fr: "Insistance", de: "Hervorhebung", it: "Enfasi", pl: "Podkreślenie", tr: "Vurgu", id: "Penekanan", vi: "Nhấn mạnh" }, rule: { en: that person and nobody else, uk: "саме ця особа і ніхто інший", es: "esa persona y nadie más", pt: "essa pessoa e mais ninguém", fr: "cette personne et personne d’autre", de: "genau diese Person und niemand sonst", it: "quella persona e nessun altro", pl: "właśnie ta osoba i nikt inny", tr: "yalnızca o kişi, başkası değil", id: "orang itu sendiri dan bukan orang lain", vi: "chính người đó và không ai khác" }, ex: ["I made the cake ", { target: myself }, "."], tr: { uk: "Я сам спік торт.", es: "Hice el pastel yo mismo.", pt: "Eu mesmo fiz o bolo.", fr: "J’ai fait le gâteau moi-même.", de: "Ich habe den Kuchen selbst gebacken.", it: "Ho fatto la torta io stesso.", pl: "Sam upiekłem ciasto.", tr: "Pastayı kendim yaptım.", id: "Saya membuat kue itu sendiri.", vi: "Tôi tự làm cái bánh này." } }
        - { level: A2, point: { pattern: [by, { slot: { en: reflexive, uk: "зворотний займенник", es: "pronombre reflexivo", pt: "pronome reflexivo", fr: "pronom réfléchi", de: "Reflexivpronomen", it: "pronome riflessivo", pl: "zaimek zwrotny", tr: "dönüşlü zamir", id: "kata ganti refleksif", vi: "đại từ phản thân" } }] }, rule: { en: "alone, without help", uk: "сам, без допомоги", es: "solo, sin ayuda", pt: "sozinho, sem ajuda", fr: "seul, sans aide", de: "allein, ohne Hilfe", it: "da solo, senza aiuto", pl: "sam, bez pomocy", tr: "yalnız, yardımsız", id: "sendirian, tanpa bantuan", vi: "một mình, không cần giúp đỡ" }, ex: ["He lives ", { target: by himself }, "."], tr: { uk: "Він живе сам.", es: "Vive solo.", pt: "Ele mora sozinho.", fr: "Il vit seul.", de: "Er wohnt allein.", it: "Vive da solo.", pl: "Mieszka sam.", tr: "O tek başına yaşıyor.", id: "Dia tinggal sendiri.", vi: "Anh ấy sống một mình." } }
