title: { en: Reflexive Pronouns, uk: Зворотні займенники, es: Pronombres reflexivos, pt: "Pronomes reflexivos", fr: "Pronoms réfléchis", de: "Reflexivpronomen", it: "Pronomi riflessivi", pl: "Zaimki zwrotne", tr: "Dönüşlü zamirler", id: "Kata ganti refleksif", vi: "Đại từ phản thân" }
summary:
  lead:
    en: ["Reflexive pronouns (", { term: myself }, ", ", { term: yourself }, ", ", { term: themselves }, ") show that the subject and the object are the same person."]
    uk: ["Зворотні займенники (", { term: myself }, ", ", { term: yourself }, ", ", { term: themselves }, ") показують, що підмет і додаток — та сама особа."]
    es: ["Los pronombres reflexivos (", { term: myself }, ", ", { term: yourself }, ", ", { term: themselves }, ") muestran que el sujeto y el objeto son la misma persona."]
    pt: ["Os pronomes reflexivos (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") mostram que o sujeito e o objeto são a mesma pessoa."]
    fr: ["Les pronoms réfléchis (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") indiquent que le sujet et le complément sont la même personne."]
    de: ["Reflexivpronomen (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") zeigen, dass Subjekt und Objekt dieselbe Person sind."]
    it: ["I pronomi riflessivi (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") indicano che il soggetto e il complemento sono la stessa persona."]
    pl: ["Zaimki zwrotne (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") pokazują, że podmiot i dopełnienie to ta sama osoba."]
    tr: ["Dönüşlü zamirler (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") öznenin ve nesnenin aynı kişi olduğunu gösterir."]
    id: ["Kata ganti refleksif (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") menunjukkan bahwa subjek dan objek adalah orang yang sama."]
    vi: ["Đại từ phản thân (", { term: "myself" }, ", ", { term: "yourself" }, ", ", { term: "themselves" }, ") cho biết chủ ngữ và tân ngữ là cùng một người."]
  rule:
    en: ["Routine verbs such as ", { term: get up }, " and ", { term: get dressed }, " take no reflexive:"]
    uk: ["Дієслова щоденних дій, як-от ", { term: get up }, " і ", { term: get dressed }, ", вживаються без зворотного займенника:"]
    es: ["Los verbos de la rutina diaria, como ", { term: get up }, " y ", { term: get dressed }, ", no llevan pronombre reflexivo:"]
    pt: ["Verbos da rotina diária, como ", { term: "get up" }, " e ", { term: "get dressed" }, ", não levam pronome reflexivo:"]
    fr: ["Les verbes de la routine quotidienne, comme ", { term: "get up" }, " et ", { term: "get dressed" }, ", se construisent sans pronom réfléchi :"]
    de: ["Alltagsverben wie ", { term: "get up" }, " und ", { term: "get dressed" }, " stehen ohne Reflexivpronomen:"]
    it: ["I verbi della routine quotidiana, come ", { term: "get up" }, " e ", { term: "get dressed" }, ", non prendono il pronome riflessivo:"]
    pl: ["Czasowniki codziennych czynności, takie jak ", { term: "get up" }, " i ", { term: "get dressed" }, ", występują bez zaimka zwrotnego:"]
    tr: ["Günlük rutin fiilleri, örneğin ", { term: "get up" }, " ve ", { term: "get dressed" }, ", dönüşlü zamir almaz:"]
    id: ["Kata kerja rutinitas seperti ", { term: "get up" }, " dan ", { term: "get dressed" }, " tidak memakai kata ganti refleksif:"]
    vi: ["Các động từ sinh hoạt hằng ngày như ", { term: "get up" }, " và ", { term: "get dressed" }, " không đi với đại từ phản thân:"]
  ex: { examples: [["I ", { target: get up }], ["I ", { target: get dressed }, "."]] }

