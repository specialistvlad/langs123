: { examples: ["Mereka saling meminjam buku.", "Si kembar saling menyelesaikan kalimat."] }, vi: { examples: ["Họ mượn sách của nhau.", "Hai anh em sinh đôi nói nốt câu của nhau."] } } }

  - title: { en: "Everyday routines: the verb alone", uk: "Щоденні дії: дієслово без займенника", es: "Rutinas diarias: el verbo solo", pt: "Rotinas diárias: o verbo sozinho", fr: "Routines quotidiennes : le verbe seul", de: "Tagesablauf: das Verb allein", it: "Routine quotidiane: il verbo da solo", pl: "Codzienne czynności: sam czasownik", tr: "Günlük rutinler: fiil tek başına", id: "Rutinitas sehari-hari: kata kerja berdiri sendiri", vi: "Sinh hoạt hằng ngày: động từ đứng một mình" }
    role: own
    content:
      - type: prose
        level: A2
        text:
          en: "These everyday verbs take no reflexive pronoun:"
          uk: "Ці щоденні дієслова вживаються без зворотного займенника:"
          es: "Estos verbos cotidianos no llevan pronombre reflexivo:"
          pt: "Estes verbos do dia a dia não levam pronome reflexivo:"
          fr: "Ces verbes du quotidien ne prennent pas de pronom réfléchi :"
          de: "Diese Alltagsverben stehen ohne Reflexivpronomen:"
          it: "Questi verbi di uso quotidiano non prendono il pronome riflessivo:"
          pl: "Te codzienne czasowniki występują bez zaimka zwrotnego:"
          tr: "Bu günlük fiiller dönüşlü zamir almaz:"
          id: "Kata kerja sehari-hari ini tidak memakai kata ganti refleksif:"
          vi: "Những động từ thường ngày này không đi với đại từ phản thân:"
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, verb: { alternatives: [get up, wake up] }, ex: ["I ", { target: get up }, " at seven."], tr: { uk: "Я встаю о сьомій.", es: "Me levanto a las siete.", pt: "Eu levanto às sete.", fr: "Je me lève à sept heures.", de: "Ich stehe um sieben auf.", it: "Mi alzo alle sette.", pl: "Wstaję o siódmej.", tr: "Saat yedide kalkarım.", id: "Saya bangun pukul tujuh.", vi: "Tôi dậy lúc bảy giờ." } }
          - { level: A2, verb: have a shower, ex: ["He ", { target: has a shower }, " every morning."], tr: { uk: "Він щоранку приймає душ.", es: "Se ducha todas las mañanas.", pt: "Ele toma banho toda manhã.", fr: "Il prend une douche tous les matins.", de: "Er duscht jeden Morgen.", it: "Si fa la doccia ogni mattina.", pl: "Codziennie rano bierze prysznic.", tr: "Her sabah duş alır.", id: "Dia mandi setiap pagi.", vi: "Anh ấy tắm mỗi buổi sáng." } }
          - { level: A2, verb: get dressed, ex: ["I ", { target: get dressed }, " quickly."], tr: { uk: "Я швидко одягаюся.", es: "Me visto rápido.", pt: "Eu me visto rápido.", fr: "Je m’habille vite.", de: "Ich ziehe mich schnell an.", it: "Mi vesto in fretta.", pl: "Szybko się ubieram.", tr: "Çabuk giyinirim.", id: "Saya berpakaian dengan cepat.", vi: "Tôi mặc quần áo nhanh." } }
          - { level: A2, verb: sit down, ex: ["Please ", { target: sit down }, "."], tr: { uk: "Сідай, будь ласка.", es: "Siéntate, por favor.", pt: "Sente-se, por favor.", fr: "Assieds-toi, s’il te plaît.", de: "Bitte setz dich.", it: "Siediti, per favore.", pl: "Usiądź, proszę.", tr: "Lütfen otur.", id: "Silakan duduk.", vi: "Làm ơn ngồi xuống." } }
          - { level: A2, verb: feel, ex: ["I ", { target: feel }, " tired."], tr: { uk: "Я почуваюся втомленим.", es: "Me siento cansado.", pt: "Eu me sinto cansado.", fr: "Je me sens fatigué.", de: "Ich fühle mich müde.", it: "Mi sento stanco.", pl: "Czuję się zmęczony.", tr: "Kendimi yorgun hissediyorum.", id: "Saya merasa lelah.", vi: "Tôi thấy mệt." } }
          - { level: A2, verb: relax, ex: ["We ", { target: relax }, " at the weekend."], tr: { uk: "Ми відпочиваємо на вихідних.", es: "Nos relajamos el fin de semana.", pt: "Nós relaxamos no fim de semana.", fr: "Nous nous détendons le week-end.", de: "Wir entspannen uns am Wochenende.", it: "Ci rilassiamo nel fine settimana.", pl: "W weekend odpoczywamy.", tr: "Hafta sonu dinleniriz.", id: "Kami bersantai pada akhir pekan.", vi: "Cuối tuần chúng tôi thư giãn." } }
          - { level: A2, verb: remember, ex: ["I ", { target: remember }, " her."], tr: { uk: "Я пам’ятаю її.", es: "La recuerdo.", pt: "Eu me lembro dela.", fr: "Je me souviens d’elle.", de: "Ich erinnere mich an sie.", it: "La ricordo.", pl: "Pamiętam ją.", tr: "Onu hatırlıyorum.", id: "Saya ingat dia.", vi: "Tôi còn nhớ cô ấy." } }
          - { level: A2, verb: meet, ex: ["We ", { target: met }, " in ", { date: "2019", value: "2019" }, "."], tr: { uk: "Ми зустрілися 2019 року.", es: "Nos conocimos en 2019.", pt: "Nós nos conhecemos em 2019.", fr: "Nous nous sommes rencontrés en 2019.", de: "Wir haben uns 2019 kennengelernt.", it: "Ci siamo conosciuti nel 2019.", pl: "Poznaliśmy się w 2019 roku.", tr: "2019’da tanıştık.", id: "Kami bertemu pada tahun 2019.", vi: "Chúng tôi quen nhau vào năm 2019." } }
          - { level: A2, verb: worry, ex: ["Don't ", { target: worry }, "."], tr: { uk: "Не хвилюйся.", es: "No te preocupes.", pt: "Não se preocupe.", fr: "Ne t’inquiète pas.", de: "Mach dir keine Sorgen.", it: "Non preoccuparti.", pl: "Nie martw się.", tr: "Endişelenme.", id: "Jangan khawatir.", vi: "Đừng lo." } }

  - title: { en: Verbs with a reflexive, uk: "Дієслова зі зворотним займенником", es: "Verbos con reflexivo", pt: "Verbos com reflexivo", fr: "Verbes avec un pronom réfléchi", de: "Verben mit Reflexivpronomen", it: "Verbi con il riflessivo", pl: "Czasowniki z zaimkiem zwrotnym", tr: "Dönüşlü zamirli fiiller", id: "Kata kerja dengan refleksif", vi: "Động từ đi với đại từ phản thân" }
    role: own
    content:
      - type: prose
        level: B2
        text: { en: "With these verbs the reflexive pronoun is part of the meaning and matches the subject.", uk: "З цими дієсловами зворотний займенник є частиною значення і узгоджується з підметом.", es: "Con estos verbos el pronombre reflexivo forma parte del significado y concuerda con el sujeto.", pt: "Com estes verbos, o pronome reflexivo faz parte do significado e concorda com o sujeito.", fr: "Avec ces verbes, le pronom réfléchi fait partie du sens et s’accorde avec le sujet.", de: "Bei diesen Verben gehört das Reflexivpronomen zur Bedeutung und richtet sich nach dem Subjekt.", it: "Con questi verbi il pronome riflessivo fa parte del significato e concorda con il soggetto.", pl: "Przy tych czasownikach zaimek zwrotny należy do znaczenia i zgadza się z podmiotem.", tr: "Bu fiillerde dönüşlü zamir anlamın bir parçasıdır ve özneyle uyum sağlar.", id: "Pada kata kerja ini, kata ganti refleksif merupakan bagian dari makna dan sesuai dengan subjek.", vi: "Với những động từ này, đại từ phản thân là một phần của nghĩa và phù hợp với chủ ngữ." }
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: meaning, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, verb: enjoy yourself, meaning: { en: "have a good time", uk: "добре проводити час", es: "pasarlo bien", pt: "divertir-se", fr: "passer un bon moment", de: "sich gut amüsieren", it: "divertirsi", pl: "dobrze się bawić", tr: "iyi vakit geçirmek", id: "bersenang-senang", vi: "vui vẻ" }, ex: ["They ", { target: enjoyed themselves }, " at the beach."], tr: { uk: "Вони чудово провели час на пляжі.", es: "Se divirtieron en la playa.", pt: "Eles se divertiram na praia.", fr: "Ils se sont bien amusés à la plage.", de: "Sie haben sich am Strand amüsiert.", it: "Si sono divertiti in spiaggia.", pl: "Dobrze się bawili na plaży.", tr: "Plajda eğlendiler.", id: "Mereka bersenang-senang di pantai.", vi: "Họ đã vui vẻ trên bãi biển." } }
          - { level: B2, verb: behave yourself, meaning: { en: "act well", uk: "добре поводитися", es: "portarse bien", pt: "comportar-se bem", fr: "bien se tenir", de: "sich gut benehmen", it: "comportarsi bene", pl: "dobrze się zachowywać", tr: "uslu durmak", id: "bersikap baik", vi: "cư xử đúng mực" }, ex: [{ target: Behave yourself }, " in class."], tr: { uk: "Поводься пристойно на уроці.", es: "Pórtate bien en clase.", pt: "Comporte-se bem na aula.", fr: "Tiens-toi bien en classe.", de: "Benimm dich im Unterricht.", it: "Comportati bene in classe.", pl: "Zachowuj się w klasie.", tr: "Sınıfta uslu dur.", id: "Bersikaplah baik di kelas.", vi: "Hãy cư xử đúng mực trong lớp." } }
          - { level: B2, verb: help yourself, meaning: { en: "take what you want", uk: "брати все, що хочеться", es: "servirse lo que quieras", pt: "servir-se do que quiser", fr: "se servir", de: "sich nehmen, was man möchte", it: "servirsi", pl: "brać, na co ma się ochotę", tr: "canı ne isterse almak", id: "mengambil apa yang diinginkan", vi: "cứ lấy thứ mình muốn" }, ex: [{ target: Help yourself }, " to a biscuit."], tr: { uk: "Пригощайся печивом.", es: "Sírvete una galleta.", pt: "Sirva-se de um biscoito.", fr: "Sers-toi un biscuit.", de: "Nimm dir einen Keks.", it: "Prenditi un biscotto.", pl: "Poczęstuj się ciasteczkiem.", tr: "Bir bisküvi al, çekinme.", id: "Silakan ambil sebuah biskuit.", vi: "Cứ lấy một cái bánh quy đi." } }
          - { level: B2, verb: pride oneself on, meaning: { en: "be proud of a skill", uk: "пишатися своїм умінням", es: "estar orgulloso de una habilidad", pt: "orgulhar-se de uma habilidade", fr: "être fier d’un savoir-faire", de: "stolz auf ein Können sein", it: "essere orgogliosi di un'abilità", pl: "być dumnym ze swojej umiejętności", tr: "bir yeteneğiyle gurur duymak", id: "bangga akan suatu keahlian", vi: "tự hào về một kỹ năng" }, ex: ["She ", { target: prides herself on }, " her cooking."], tr: { uk: "Вона пишається своєю кулінарією.", es: "Se enorgullece de su cocina.", pt: "Ela se orgulha da sua culinária.", fr: "Elle est fière de sa cuisine.", de: "Sie ist stolz auf ihre Kochkunst.", it: "Va fiera della sua cucina.", pl: "Szczyci się swoim gotowaniem.", tr: "Yemek yapmasıyla gurur duyar.", id: "Dia bangga akan masakannya.", vi: "Cô ấy tự hào về tài nấu nướng của mình." } }
          - { level: B2, verb: avail oneself of, meaning: { en: "use an offer or a chance", uk: "скористатися пропозицією чи нагодою", es: "aprovechar una oferta o una oportunidad", pt: "aproveitar uma oferta ou uma chance", fr: "profiter d’une offre ou d’une occasion", de: "ein Angebot oder eine Gelegenheit nutzen", it: "approfittare di un'offerta o di un'occasione", pl: "skorzystać z oferty lub okazji", tr: "bir teklif ya da fırsattan yararlanmak", id: "memanfaatkan tawaran atau kesempatan", vi: "tận dụng một lời đề nghị hoặc cơ hội" }, ex: ["He ", { target: availed himself of }, " the free advice."], tr: { uk: "Він скористався безкоштовною порадою.", es: "Aprovechó el consejo gratuito.", pt: "Ele aproveitou o conselho gratuito.", fr: "Il a profité des conseils gratuits.", de: "Er nahm den kostenlosen Rat in Anspruch.", it: "Ha approfittato del consiglio gratuito.", pl: "Skorzystał z darmowej porady.", tr: "Ücretsiz tavsiyeden yararlandı.", id: "Dia memanfaatkan nasihat gratis itu.", vi: "Anh ấy đã tận dụng lời khuyên miễn phí." } }
          - { level: B2, verb: content oneself with, meaning: { en: "accept something less", uk: "задовольнитися меншим", es: "conformarse con algo menos", pt: "contentar-se com menos", fr: "se contenter de moins", de: "sich mit weniger zufriedengeben", it: "accontentarsi di meno", pl: "zadowolić się czymś skromniejszym", tr: "daha azıyla yetinmek", id: "menerima yang lebih sedikit", vi: "chấp nhận điều ít hơn" }, ex: ["She ", { target: contented herself with }, " a short walk."], tr: { uk: "Вона задовольнилася короткою прогулянкою.", es: "Se conformó con un paseo corto.", pt: "Ela se contentou com uma caminhada curta.", fr: "Elle s’est contentée d’une courte promenade.", de: "Sie gab sich mit einem kurzen Spaziergang zufrieden.", it: "Si è accontentata di una breve passeggiata.", pl: "Zadowoliła się krótkim spacerem.", tr: "Kısa bir yürüyüşle yetindi.", id: "Dia puas dengan berjalan-jalan sebentar.", vi: "Cô ấy bằng lòng với một cuộc đi dạo ngắn." } }

  - title: { en: Emphatic reflexives, uk: "Підсилювальні зворотні займенники", es: "Reflexivos enfáticos", pt: "Reflexivos enfáticos", fr: "Pronoms réfléchis d’insistance", de: "Betonte Reflexivpronomen", it: "Riflessivi enfatici", pl: "Zaimki zwrotne wzmacniające", tr: "Vurgulu dönüşlü zamirler", id: "Refleksif penekan", vi: "Đại từ phản thân nhấn mạnh" }
    role: own
