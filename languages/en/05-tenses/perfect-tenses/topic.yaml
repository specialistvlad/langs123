      rows:
        - { level: B2, point: { en: Result or duration, uk: "Результат чи тривалість", es: "Resultado o duración", pt: "Resultado ou duração", fr: "Résultat ou durée", de: "Ergebnis oder Dauer", it: "Risultato o durata", pl: "Wynik lub czas trwania", tr: "Sonuç ya da süre", id: "Hasil atau durasi", vi: "Kết quả hoặc thời lượng" }, rule: { en: "perfect simple: a result or a number; continuous: a process or its length", uk: "Perfect Simple: результат або кількість; Continuous: процес чи його тривалість", es: "perfecto simple: un resultado o una cantidad; continuo: un proceso o su duración", pt: "perfeito simples: um resultado ou uma quantidade; contínuo: um processo ou sua duração", fr: "perfect simple : un résultat ou un nombre ; continuous : un processus ou sa durée", de: "Perfect Simple: ein Ergebnis oder eine Anzahl; Continuous: ein Vorgang oder seine Dauer", it: "perfect simple: un risultato o un numero; continuous: un processo o la sua durata", pl: "Perfect Simple: wynik lub liczba; Continuous: proces lub jego czas trwania", tr: "Perfect Simple: sonuç ya da sayı; Continuous: süreç ya da süresi", id: "perfect simple: hasil atau jumlah; continuous: proses atau lamanya", vi: "hoàn thành đơn: kết quả hoặc số lượng; tiếp diễn: quá trình hoặc độ dài của nó" }, ex: { examples: [["I", { target: "'ve written" }, " five emails."], ["I", { target: "'ve been writing" }, " all morning."]] }, tr: { uk: { examples: ["Я написав п’ять листів.", "Я пишу вже цілий ранок."] }, es: { examples: ["He escrito cinco correos.", "Llevo toda la mañana escribiendo."] }, pt: { examples: ["Escrevi cinco e-mails.", "Estou escrevendo a manhã toda."] }, fr: { examples: ["J’ai écrit cinq e-mails.", "J’écris depuis ce matin."] }, de: { examples: ["Ich habe fünf E-Mails geschrieben.", "Ich schreibe schon den ganzen Vormittag."] }, it: { examples: ["Ho scritto cinque e-mail.", "Scrivo da stamattina."] }, pl: { examples: ["Napisałem pięć e-maili.", "Piszę od rana."] }, tr: { examples: ["Beş e-posta yazdım.", "Sabahtan beri yazıyorum."] }, id: { examples: ["Saya sudah menulis lima email.", "Saya menulis sepanjang pagi."] }, vi: { examples: ["Tôi đã viết xong năm email.", "Tôi đã viết suốt cả buổi sáng."] } } }
        - { level: B2, point: { en: First time and superlatives, uk: "Перший раз і найвищий ступінь", es: "La primera vez y los superlativos", pt: "A primeira vez e os superlativos", fr: "Première fois et superlatifs", de: "Das erste Mal und Superlative", it: "La prima volta e i superlativi", pl: "Pierwszy raz i stopień najwyższy", tr: "İlk kez ve üstünlük dereceleri", id: "Pertama kali dan superlatif", vi: "Lần đầu tiên và so sánh nhất" }, rule: { en: "present perfect after it's the first time and after a superlative with ever", uk: "Present Perfect після it's the first time і після найвищого ступеня з ever", es: "presente perfecto después de it's the first time y de un superlativo con ever", pt: "presente perfeito depois de it's the first time e de um superlativo com ever", fr: "present perfect après it's the first time et après un superlatif avec ever", de: "Present Perfect nach it's the first time und nach einem Superlativ mit ever", it: "present perfect dopo it's the first time e dopo un superlativo con ever", pl: "Present Perfect po it's the first time i po stopniu najwyższym z ever", tr: "it's the first time ifadesinden ve ever ile kullanılan üstünlük derecesinden sonra Present Perfect gelir", id: "present perfect sesudah it's the first time dan sesudah superlatif dengan ever", vi: "hiện tại hoàn thành sau it's the first time và sau so sánh nhất đi với ever" }, ex: ["It's the first time I", { target: "'ve flown" }, "."], tr: { uk: "Я вперше лечу літаком.", es: "Es la primera vez que vuelo.", pt: "É a primeira vez que eu voo.", fr: "C’est la première fois que je prends l’avion.", de: "Es ist das erste Mal, dass ich fliege.", it: "È la prima volta che volo.", pl: "Po raz pierwszy lecę samolotem.", tr: "İlk kez uçağa biniyorum.", id: "Ini pertama kalinya saya naik pesawat.", vi: "Đây là lần đầu tiên tôi đi máy bay." } }
        - { level: B2, point: { en: Completed by a future time, uk: "Завершено до певного моменту в майбутньому", es: "Terminado antes de un momento futuro", pt: "Concluído antes de um momento futuro", fr: "Achevé avant un moment futur", de: "Bis zu einem Zeitpunkt in der Zukunft abgeschlossen", it: "Concluso entro un momento futuro", pl: "Zakończone przed przyszłym momentem", tr: "Gelecekteki bir zamana kadar tamamlanmış", id: "Selesai sebelum waktu tertentu di masa depan", vi: "Hoàn tất trước một thời điểm trong tương lai" }, rule: { en: "future perfect, with by or by the time", uk: "Future Perfect, з by або by the time", es: "futuro perfecto, con by o by the time", pt: "futuro perfeito, com by ou by the time", fr: "futur antérieur, avec by ou by the time", de: "Futur II, mit by oder by the time", it: "futuro anteriore, con by o by the time", pl: "Future Perfect, z by lub by the time", tr: "by ya da by the time ile Future Perfect", id: "future perfect, dengan by atau by the time", vi: "tương lai hoàn thành, với by hoặc by the time" }, ex: ["By Friday I", { target: "'ll have finished" }, "."], tr: { uk: "До п’ятниці я закінчу.", es: "Para el viernes habré terminado.", pt: "Até sexta eu terei terminado.", fr: "D’ici vendredi, j’aurai fini.", de: "Bis Freitag werde ich fertig sein.", it: "Entro venerdì avrò finito.", pl: "Do piątku skończę.", tr: "Cumaya kadar bitirmiş olacağım.", id: "Pada hari Jumat saya sudah selesai.", vi: "Đến thứ Sáu tôi sẽ làm xong." } }
        - { level: C1, point: { en: News and details, uk: "Новини й подробиці", es: "Noticias y detalles", pt: "Notícias e detalhes", fr: "Nouvelles et détails", de: "Neuigkeiten und Einzelheiten", it: "Notizie e dettagli", pl: "Wiadomości i szczegóły", tr: "Haberler ve ayrıntılar", id: "Berita dan rincian", vi: "Tin tức và chi tiết" }, rule: { en: "the present perfect announces; the past simple gives the details", uk: "Present Perfect повідомляє новину; Past Simple дає подробиці", es: "el presente perfecto anuncia; el pasado simple da los detalles", pt: "o presente perfeito anuncia; o passado simples dá os detalhes", fr: "le present perfect annonce ; le prétérit simple donne les détails", de: "das Present Perfect kündigt an; das Simple Past gibt die Einzelheiten", it: "il present perfect annuncia; il past simple dà i dettagli", pl: "Present Perfect ogłasza; Past Simple podaje szczegóły", tr: "Present Perfect haberi duyurur; Simple Past ayrıntıları verir", id: "present perfect mengumumkan; simple past memberi rincian", vi: "hiện tại hoàn thành thông báo; quá khứ đơn đưa chi tiết" }, ex: ["The minister ", { target: "has resigned" }, ". He ", { target: said }, " the pressure was too great."], tr: { uk: "Міністр подав у відставку. Він сказав, що тиск був надто великим.", es: "El ministro ha renunciado. Dijo que la presión era demasiado grande.", pt: "O ministro renunciou. Ele disse que a pressão era grande demais.", fr: "Le ministre a démissionné. Il a dit que la pression était trop forte.", de: "Der Minister ist zurückgetreten. Er sagte, der Druck sei zu groß gewesen.", it: "Il ministro si è dimesso. Ha detto che la pressione era troppo forte.", pl: "Minister podał się do dymisji. Powiedział, że presja była zbyt duża.", tr: "Bakan istifa etti. Baskının çok büyük olduğunu söyledi.", id: "Menteri itu telah mengundurkan diri. Dia mengatakan tekanannya terlalu besar.", vi: "Bộ trưởng đã từ chức. Ông ấy nói áp lực quá lớn." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "verbs of state take the simple perfect", uk: "дієслова стану вживаються в Perfect Simple", es: "los verbos de estado llevan el perfecto simple", pt: "os verbos de estado levam o perfeito simples", fr: "les verbes d’état prennent le perfect simple", de: "Zustandsverben stehen im Perfect Simple", it: "i verbi di stato richiedono il perfect simple", pl: "czasowniki stanu występują w Perfect Simple", tr: "durum fiilleri Perfect Simple alır", id: "kata kerja statif memakai perfect simple", vi: "động từ chỉ trạng thái dùng hoàn thành đơn" }, ex: ["I", { target: "'ve known" }, " her for years."], tr: { uk: "Я знаю її вже багато років.", es: "La conozco desde hace años.", pt: "Eu a conheço há anos.", fr: "Je la connais depuis des années.", de: "Ich kenne sie seit Jahren.", it: "La conosco da anni.", pl: "Znam ją od lat.", tr: "Onu yıllardır tanıyorum.", id: "Saya sudah mengenalnya bertahun-tahun.", vi: "Tôi quen cô ấy nhiều năm rồi." } }

