sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: prose
        level: A2
        text:
          en: ["Each perfect tense is ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " for the present, ", { term: had }, " for the past."]
          uk: ["Кожен час групи Perfect має форму ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " для теперішнього, ", { term: had }, " для минулого."]
          es: ["Cada tiempo perfecto tiene la forma ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " para el presente, ", { term: had }, " para el pasado."]
          pt: ["Cada tempo perfeito tem a forma ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " para o presente, ", { term: "had" }, " para o passado."]
          fr: ["Chaque temps du perfect a la forme ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, " : ", { alternatives: [{ term: "have" }, { term: "has" }] }, " pour le présent, ", { term: "had" }, " pour le passé."]
          de: ["Jede Perfect-Zeitform lautet ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " für die Gegenwart, ", { term: "had" }, " für die Vergangenheit."]
          it: ["Ogni tempo perfect ha la forma ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " per il presente, ", { term: "had" }, " per il passato."]
          pl: ["Każdy czas Perfect ma postać ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " w teraźniejszości, ", { term: "had" }, " w przeszłości."]
          tr: ["Her perfect zaman ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, " kalıbıyla kurulur: şimdiki zaman için ", { alternatives: [{ term: "have" }, { term: "has" }] }, ", geçmiş zaman için ", { term: "had" }, "."]
          id: ["Setiap perfect tense berbentuk ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " untuk present, ", { term: "had" }, " untuk past."]
          vi: ["Mỗi thì hoàn thành có dạng ", { pattern: [{ term: "have" }, { slot: "past participle" }] }, ": ", { alternatives: [{ term: "have" }, { term: "has" }] }, " cho hiện tại, ", { term: "had" }, " cho quá khứ."]
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["In questions the helper goes before the subject; in negatives it takes ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
              uk: ["У питаннях допоміжне дієслово стоїть перед підметом; у запереченнях до нього додається ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
              es: ["En las preguntas el verbo auxiliar va antes del sujeto; en las negaciones lleva ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
              pt: ["Nas perguntas, o auxiliar vai antes do sujeito; nas negações, leva ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              fr: ["Dans les questions, l’auxiliaire se place avant le sujet ; dans les négations, il prend ", { term: "not" }, " : ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              de: ["In Fragen steht das Hilfsverb vor dem Subjekt; in der Verneinung nimmt es ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              it: ["Nelle domande l'ausiliare va prima del soggetto; nelle negazioni prende ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              pl: ["W pytaniach czasownik pomocniczy stoi przed podmiotem; w przeczeniach przyjmuje ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              tr: ["Sorularda yardımcı fiil öznenin önüne geçer; olumsuz cümlelerde ", { term: "not" }, " alır: ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              id: ["Dalam pertanyaan, kata kerja bantu berada sebelum subjek; dalam kalimat negatif, kata kerja bantu diikuti ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
              vi: ["Trong câu hỏi, trợ động từ đứng trước chủ ngữ; trong câu phủ định, nó đi với ", { term: "not" }, ": ", { term: "haven't" }, ", ", { term: "hasn't" }, ", ", { term: "hadn't" }, "."]
          - type: rule
            level: A2
            text:
              en: ["The main verb is always the past participle: ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
              uk: ["Основне дієслово завжди стоїть у 3-й формі (Past Participle): ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
              es: ["El verbo principal siempre va en participio pasado: ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
              pt: ["O verbo principal fica sempre no particípio passado: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              fr: ["Le verbe principal est toujours au participe passé : ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              de: ["Das Hauptverb steht immer im Past Participle: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              it: ["Il verbo principale è sempre al participio passato: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              pl: ["Czasownik główny ma zawsze III formę: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              tr: ["Ana fiil her zaman past participle biçimindedir: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              id: ["Kata kerja utama selalu berbentuk past participle: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
              vi: ["Động từ chính luôn ở dạng quá khứ phân từ: ", { term: "worked" }, ", ", { term: "seen" }, ", ", { term: "gone" }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: has }, " goes with he, she, it; ", { term: had }, " is the same for everyone."]
              uk: [{ term: has }, " вживається з he, she, it; ", { term: had }, " однакове для всіх."]
              es: [{ term: has }, " va con he, she, it; ", { term: had }, " es igual para todos."]
              pt: [{ term: "has" }, " vai com he, she, it; ", { term: "had" }, " é igual para todos."]
              fr: [{ term: "has" }, " va avec he, she, it ; ", { term: "had" }, " est identique pour tous."]
              de: [{ term: "has" }, " steht bei he, she, it; ", { term: "had" }, " ist für alle gleich."]
              it: [{ term: "has" }, " si usa con he, she, it; ", { term: "had" }, " è uguale per tutti."]
              pl: [{ term: "has" }, " występuje z he, she, it; ", { term: "had" }, " jest takie samo dla wszystkich."]
              tr: [{ term: "has" }, ", he, she, it ile kullanılır; ", { term: "had" }, " herkes için aynıdır."]
              id: [{ term: "has" }, " dipakai dengan he, she, it; ", { term: "had" }, " sama untuk semua subjek."]
              vi: [{ term: "has" }, " đi với he, she, it; ", { term: "had" }, " dùng cho mọi chủ ngữ."]
          - type: rule
            level: A2
            text:
