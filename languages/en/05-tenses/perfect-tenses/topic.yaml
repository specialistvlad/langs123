          - { level: C1, use: { en: A general statement about history up to now, uk: "Загальне твердження про історію до цього моменту", es: "Una afirmación general sobre la historia hasta ahora", pt: "Uma afirmação geral sobre a história até agora", fr: "Une affirmation générale sur l’histoire jusqu’à maintenant", de: "Eine allgemeine Aussage über die Geschichte bis heute", it: "Un'affermazione generale sulla storia fino a oggi", pl: "Ogólne stwierdzenie o historii do dziś", tr: "Bugüne kadarki tarih hakkında genel bir ifade", id: "Pernyataan umum tentang sejarah sampai sekarang", vi: "Một nhận định chung về lịch sử cho đến nay" }, ex: ["Humans ", { target: "have always looked" }, " up at the stars."], tr: { uk: "Люди завжди дивилися на зорі.", es: "Los seres humanos siempre han mirado las estrellas.", pt: "Os seres humanos sempre olharam para as estrelas.", fr: "Les êtres humains ont toujours levé les yeux vers les étoiles.", de: "Die Menschen haben schon immer zu den Sternen aufgeschaut.", it: "Gli esseri umani hanno sempre guardato le stelle.", pl: "Ludzie zawsze patrzyli w gwiazdy.", tr: "İnsanlar her zaman yıldızlara bakmıştır.", id: "Manusia selalu menatap bintang-bintang.", vi: "Con người luôn ngước nhìn các vì sao." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: been }, " = went and came back; ", { term: gone }, " = went and is still there:"]
              uk: [{ term: been }, " = побував і повернувся; ", { term: gone }, " = поїхав і ще там:"]
              es: [{ term: been }, " = fue y volvió; ", { term: gone }, " = fue y sigue allí:"]
              pt: [{ term: "been" }, " = foi e voltou; ", { term: "gone" }, " = foi e ainda está lá:"]
              fr: [{ term: "been" }, " = est allé et revenu ; ", { term: "gone" }, " = est allé et y est encore :"]
              de: [{ term: "been" }, " = hingegangen und zurückgekommen; ", { term: "gone" }, " = hingegangen und noch dort:"]
              it: [{ term: "been" }, " = è andato ed è tornato; ", { term: "gone" }, " = è andato e si trova ancora là:"]
              pl: [{ term: "been" }, " = pojechał i wrócił; ", { term: "gone" }, " = pojechał i nadal tam jest:"]
              tr: [{ term: "been" }, " = gitti ve geri döndü; ", { term: "gone" }, " = gitti ve hâlâ orada:"]
              id: [{ term: "been" }, " = pergi lalu kembali; ", { term: "gone" }, " = pergi dan masih di sana:"]
              vi: [{ term: "been" }, " = đã đến rồi quay về; ", { term: "gone" }, " = đã đi và vẫn ở đó:"]
            ex: { examples: [[She, { target: "'s been" }, " to Spain."], [She, { target: "'s gone" }, " to Spain."]] }
            tr: { uk: { examples: ["Вона побувала в Іспанії.", "Вона поїхала до Іспанії."] }, es: { examples: ["Ha estado en España.", "Se ha ido a España."] }, pt: { examples: ["Ela já esteve na Espanha.", "Ela foi para a Espanha."] }, fr: { examples: ["Elle est allée en Espagne et en est revenue.", "Elle est partie en Espagne."] }, de: { examples: ["Sie war in Spanien.", "Sie ist nach Spanien gefahren."] }, it: { examples: ["È stata in Spagna.", "È andata in Spagna."] }, pl: { examples: ["Była w Hiszpanii.", "Wyjechała do Hiszpanii."] }, tr: { examples: ["O, İspanya’ya gidip geldi.", "O, İspanya’ya gitmiş durumda."] }, id: { examples: ["Dia pernah ke Spanyol.", "Dia sudah berangkat ke Spanyol."] }, vi: { examples: ["Cô ấy đã từng đến Tây Ban Nha.", "Cô ấy đã đi Tây Ban Nha rồi."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: for }, " takes a length of time; ", { term: since }, " takes a starting point:"]
              uk: [{ term: for }, " вживається з тривалістю часу; ", { term: since }, " — з моментом початку:"]
              es: [{ term: for }, " lleva una duración; ", { term: since }, " lleva un punto de partida:"]
              pt: [{ term: "for" }, " leva uma duração; ", { term: "since" }, " leva um ponto de partida:"]
              fr: [{ term: "for" }, " prend une durée ; ", { term: "since" }, " prend un point de départ :"]
              de: [{ term: "for" }, " steht mit einer Zeitdauer, ", { term: "since" }, " mit einem Anfangspunkt:"]
              it: [{ term: "for" }, " richiede una durata; ", { term: "since" }, " richiede un punto di partenza:"]
              pl: [{ term: "for" }, " łączy się z okresem trwania; ", { term: "since" }, " z punktem początkowym:"]
              tr: [{ term: "for" }, " süre bildirir, ", { term: "since" }, " başlangıç noktası bildirir:"]
              id: [{ term: "for" }, " dipakai dengan lamanya waktu; ", { term: "since" }, " dipakai dengan titik awal:"]
              vi: [{ term: "for" }, " đi với một khoảng thời gian; ", { term: "since" }, " đi với một mốc bắt đầu:"]
            ex: ["I've known her ", { alternatives: [[{ target: for }, " ten years"], [{ target: since }, " ", { date: "2015", value: "2015" }]] }, "."]
            tr: { uk: { examples: ["Я знаю її десять років.", "Я знаю її з 2015 року."] }, es: { examples: ["La conozco desde hace diez años.", "La conozco desde 2015."] }, pt: { examples: ["Eu a conheço há dez anos.", "Eu a conheço desde 2015."] }, fr: { examples: ["Je la connais depuis dix ans.", "Je la connais depuis 2015."] }, de: { examples: ["Ich kenne sie seit zehn Jahren.", "Ich kenne sie seit 2015."] }, it: { examples: ["La conosco da dieci anni.", "La conosco dal 2015."] }, pl: { examples: ["Znam ją od dziesięciu lat.", "Znam ją od 2015 roku."] }, tr: { examples: ["Onu on yıldır tanıyorum.", "Onu 2015’ten beri tanıyorum."] }, id: { examples: ["Saya sudah mengenalnya selama sepuluh tahun.", "Saya sudah mengenalnya sejak 2015."] }, vi: { examples: ["Tôi quen cô ấy được mười năm rồi.", "Tôi quen cô ấy từ năm 2015."] } }

  - title: { en: "Present perfect continuous: form", uk: "Present Perfect Continuous: форма", es: "Presente perfecto continuo: forma", pt: "Presente perfeito contínuo: forma", fr: "Present perfect continuous : forme", de: "Present Perfect Continuous: Form", it: "Present perfect continuous: forma", pl: "Present Perfect Continuous: forma", tr: "Present Perfect Continuous: biçim", id: "Present perfect continuous: bentuk", vi: "Hiện tại hoàn thành tiếp diễn: dạng" }
