translated: { uk: "e8ac09 a6afd7 9fca77 206f93 690a22 6efe36 124535 3da88a 1d9cf0 9aa19d", es: "e8ac09 a6afd7 9fca77 206f93 690a22 6efe36 124535 3da88a 1d9cf0 9aa19d" }

title: { en: Perfect Tenses, uk: "Доконані часи (Perfect)", es: Tiempos perfectos }
summary:
  lead:
    en: ["Present perfect and past perfect: ", { term: have }, ", ", { term: has }, " or ", { term: had }, " plus the past participle for an earlier event seen from a later point."]
    uk: ["Present Perfect і Past Perfect: ", { term: have }, ", ", { term: has }, " або ", { term: had }, " і 3-тя форма дієслова показують ранішу подію з погляду пізнішого моменту."]
    es: ["Presente perfecto y pasado perfecto: ", { term: have }, ", ", { term: has }, " o ", { term: had }, " más el participio pasado para un hecho anterior visto desde un momento posterior."]
  rule:
    en: ["A finished time such as ", { term: yesterday }, " or ", { term: ago }, " takes the past simple:"]
    uk: ["Закінчений час, як-от ", { term: yesterday }, " чи ", { term: ago }, ", вимагає Past Simple:"]
    es: ["Un tiempo terminado, como ", { term: yesterday }, " o ", { term: ago }, ", lleva el pasado simple:"]
  ex: { examples: [["I ", { target: saw }, " her yesterday."], ["I ", { target: have seen }, " her today."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: tense, label: { en: Tense, uk: "Час", es: "Tiempo" } }
        - { key: qh, slot: aux, features: { interrogativity: int, polarity: pos } }
        - { key: qs, slot: subj, features: { interrogativity: int, polarity: pos } }
        - { key: qv, slot: verb, features: { interrogativity: int, polarity: pos } }
        - { key: ss, slot: subj, features: { interrogativity: decl, polarity: pos } }
        - { key: sh, slot: aux, features: { interrogativity: decl, polarity: pos } }
        - { key: sv, slot: verb, features: { interrogativity: decl, polarity: pos } }
        - { key: ns, slot: subj, features: { interrogativity: decl, polarity: neg } }
        - { key: nh, slot: aux, features: { interrogativity: decl, polarity: neg } }
        - { key: nv, slot: verb, features: { interrogativity: decl, polarity: neg } }
      rows:
        - { level: A2, features: { tense: prs, aspect: prf, person: 1, number: sg }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Have }, qs: I, qv: [work, { ending: ed }, "?"], ss: I, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: I, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 2 }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Have }, qs: you, qv: [work, { ending: ed }, "?"], ss: You, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: You, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: masc }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Has }, qs: he, qv: [work, { ending: ed }, "?"], ss: He, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: He, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: fem }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Has }, qs: she, qv: [work, { ending: ed }, "?"], ss: She, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: She, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: neut }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Has }, qs: it, qv: [work, { ending: ed }, "?"], ss: It, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: It, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 1, number: pl }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Have }, qs: we, qv: [work, { ending: ed }, "?"], ss: We, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: We, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: pl }, tense: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, qh: { aux: Have }, qs: they, qv: [work, { ending: ed }, "?"], ss: They, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: They, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 1, number: sg }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: I, qv: [work, { ending: ed }, "?"], ss: I, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: I, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 2 }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: you, qv: [work, { ending: ed }, "?"], ss: You, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: You, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: masc }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: he, qv: [work, { ending: ed }, "?"], ss: He, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: He, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: fem }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: she, qv: [work, { ending: ed }, "?"], ss: She, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: She, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: neut }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: it, qv: [work, { ending: ed }, "?"], ss: It, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: It, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 1, number: pl }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: we, qv: [work, { ending: ed }, "?"], ss: We, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: We, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: pl }, tense: { en: Past perfect, uk: "Past Perfect", es: "Pasado perfecto" }, qh: { aux: Had }, qs: they, qv: [work, { ending: ed }, "?"], ss: They, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: They, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: prose
        level: A2
        text:
          en: ["Each perfect tense is ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " for the present, ", { term: had }, " for the past."]
          uk: ["Кожен час групи Perfect має форму ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " для теперішнього, ", { term: had }, " для минулого."]
          es: ["Cada tiempo perfecto tiene la forma ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " para el presente, ", { term: had }, " para el pasado."]
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["In questions the helper goes before the subject; in negatives it takes ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
              uk: ["У питаннях допоміжне дієслово стоїть перед підметом; у запереченнях до нього додається ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
              es: ["En las preguntas el verbo auxiliar va antes del sujeto; en las negaciones lleva ", { term: not }, ": ", { term: haven't }, ", ", { term: hasn't }, ", ", { term: hadn't }, "."]
          - type: rule
            level: A2
            text:
              en: ["The main verb is always the past participle: ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
              uk: ["Основне дієслово завжди стоїть у 3-й формі (Past Participle): ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
              es: ["El verbo principal siempre va en participio pasado: ", { term: worked }, ", ", { term: seen }, ", ", { term: gone }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: has }, " goes with he, she, it; ", { term: had }, " is the same for everyone."]
              uk: [{ term: has }, " вживається з he, she, it; ", { term: had }, " однакове для всіх."]
              es: [{ term: has }, " va con he, she, it; ", { term: had }, " es igual para todos."]
          - type: rule
            level: A2
            text:
              en: ["Short forms: ", { term: I've }, ", ", { term: she's }, " (= ", { term: she has }, "), ", { term: I'd }, " (= ", { term: I had }, ")."]
              uk: ["Скорочені форми: ", { term: I've }, ", ", { term: she's }, " (= ", { term: she has }, "), ", { term: I'd }, " (= ", { term: I had }, ")."]
              es: ["Formas contraídas: ", { term: I've }, ", ", { term: she's }, " (= ", { term: she has }, "), ", { term: I'd }, " (= ", { term: I had }, ")."]

  - title: { en: The past participle, uk: "3-тя форма дієслова (Past Participle)", es: "El participio pasado" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo" } }
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
          - { key: ex, label: { en: Examples, uk: "Приклади", es: "Ejemplos" } }
        rows:
          - { level: A2, type: { en: regular verbs, uk: "правильні дієслова", es: "verbos regulares" }, rule: { pattern: [{ slot: V }, "-ed"] }, ex: { examples: [{ mapping: [work, worked] }, { mapping: [live, lived] }, { mapping: [study, studied] }] }, tr: { uk: { examples: ["працювати", "жити", "вчитися"] }, es: { examples: ["trabajar", "vivir", "estudiar"] } } }
          - { level: A2, type: { en: "irregular, same as past simple", uk: "неправильні, як у Past Simple", es: "irregulares, igual que el pasado simple" }, rule: { en: participle = past simple form, uk: "3-тя форма збігається з 2-ю", es: "el participio es igual a la forma de pasado simple" }, ex: { examples: [{ mapping: [have, had] }, { mapping: [buy, bought] }, { mapping: [meet, met] }] }, tr: { uk: { examples: ["мати", "купувати", "зустрічати"] }, es: { examples: ["tener", "comprar", "encontrar"] } } }
          - { level: A2, type: { en: "irregular, own form", uk: "неправильні, окрема форма", es: "irregulares, forma propia" }, rule: { en: learn each one, uk: "кожну форму треба вивчити", es: "hay que aprender cada una" }, ex: { examples: [{ mapping: [see, seen] }, { mapping: [write, written] }, { mapping: [eat, eaten] }, { mapping: [do, done] }] }, tr: { uk: { examples: ["бачити", "писати", "їсти", "робити"] }, es: { examples: ["ver", "escribir", "comer", "hacer"] } } }
          - { level: A2, type: "go, be", rule: { en: [{ term: go }, " has two participles"], uk: [{ term: go }, " має дві форми Past Participle"], es: [{ term: go }, " tiene dos participios"] }, ex: { examples: [{ mapping: [go, { examples: [gone, been] }] }, { mapping: [be, been] }] }, tr: { uk: { examples: ["йти", "бути"] }, es: { examples: ["ir", "ser"] } } }
      - type: list
        items:
          - type: note
            level: A2
            text:
              en: ["The -ed spelling is the same as in the past simple: see ", { link: Simple Tenses, to: en.tenses.simple-tenses }, "."]
              uk: ["Правопис закінчення -ed такий самий, як у Past Simple: див. ", { link: "Прості часи (Simple)", to: en.tenses.simple-tenses }, "."]
              es: ["La ortografía de -ed es la misma que en el pasado simple: ver ", { link: "Tiempos simples", to: en.tenses.simple-tenses }, "."]
          - type: note
            level: A2
            text:
              en: ["All irregular forms: ", { link: Irregular verbs table, to: en.verbs.irregular-verbs-table }, "."]
              uk: ["Усі неправильні форми: ", { link: "Таблиця неправильних дієслів", to: en.verbs.irregular-verbs-table }, "."]
              es: ["Todas las formas irregulares: ", { link: "Tabla de verbos irregulares", to: en.verbs.irregular-verbs-table }, "."]

  - title: { en: "Present perfect: form", uk: "Present Perfect: форма", es: "Presente perfecto: forma" }
    role: form
    features: { tense: prs, aspect: prf }
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A short answer repeats ", { alternatives: [{ term: have }, { term: has }] }, ":"]
              uk: ["Коротка відповідь повторює ", { alternatives: [{ term: have }, { term: has }] }, ":"]
              es: ["La respuesta corta repite ", { alternatives: [{ term: have }, { term: has }] }, ":"]
            ex: { exchange: [Have you met Tom?, { alternatives: [["Yes, I ", { target: have }, "."], ["No, I ", { target: haven't }, "."]] }] }
            tr: { uk: "Ти вже зустрічався з Томом? — Так, зустрічався; ні, не зустрічався.", es: "¿Has conocido a Tom? — Sí, lo he conocido; no, no lo he conocido." }
          - type: rule
            level: A2
            text:
              en: [{ term: ever }, ", ", { term: never }, ", ", { term: just }, " and ", { term: already }, " go between ", { alternatives: [{ term: have }, { term: has }] }, " and the participle:"]
              uk: [{ term: ever }, ", ", { term: never }, ", ", { term: just }, " і ", { term: already }, " стоять між ", { alternatives: [{ term: have }, { term: has }] }, " і 3-ю формою дієслова:"]
              es: [{ term: ever }, ", ", { term: never }, ", ", { term: just }, " y ", { term: already }, " van entre ", { alternatives: [{ term: have }, { term: has }] }, " y el participio:"]
            ex: { examples: [[I, { target: "'ve never" }, " seen snow."], [He, { target: "'s just" }, " left."]] }
            tr: { uk: { examples: ["Я ніколи не бачив снігу.", "Він щойно пішов."] }, es: { examples: ["Nunca he visto nieve.", "Acaba de irse."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: yet }, " goes at the end, in negatives and questions:"]
              uk: [{ term: yet }, " стоїть у кінці речення, у запереченнях і питаннях:"]
              es: [{ term: yet }, " va al final, en negaciones y preguntas:"]
            ex: { examples: [["I haven't finished ", { target: yet }, "."], ["Have you finished ", { target: yet }, "?"]] }
            tr: { uk: { examples: ["Я ще не закінчив.", "Ти вже закінчив?"] }, es: { examples: ["Todavía no he terminado.", "¿Ya has terminado?"] } }
          - type: rule
            level: B1
            text:
              en: [{ term: How long }, " asks about the length of a state up to now:"]
              uk: [{ term: How long }, " питає про тривалість стану до цього моменту:"]
              es: [{ term: How long }, " pregunta por la duración de un estado hasta ahora:"]
            ex: ["How long ", { target: have }, " you ", { target: lived }, " here?"]
            tr: { uk: "Як довго ти тут живеш?", es: "¿Cuánto tiempo llevas viviendo aquí?" }

  - title: { en: "Present perfect: use", uk: "Present Perfect: вживання", es: "Presente perfecto: uso" }
    role: use
    features: { tense: prs, aspect: prf }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: "Life experience, no time given", uk: "Життєвий досвід, час не названий", es: "Experiencia de vida, sin indicar el tiempo" }, ex: [I, { target: "'ve been" }, " to Paris twice."], tr: { uk: "Я двічі був у Парижі.", es: "He estado en París dos veces." } }
          - { level: A2, use: { en: Recent news, uk: "Свіжі новини", es: "Noticias recientes" }, ex: [I, { target: "'ve just seen" }, " Anna."], tr: { uk: "Я щойно бачив Анну.", es: "Acabo de ver a Anna." } }
          - { level: A2, use: { en: Result visible now, uk: "Результат, видимий зараз", es: "Resultado visible ahora" }, ex: [I, { target: "'ve lost" }, " my keys."], tr: { uk: "Я загубив ключі.", es: "He perdido mis llaves." } }
          - { level: A2, use: { en: ["Unfinished time (", { term: today }, ", ", { term: this week }, ")"], uk: "Незакінчений період часу (сьогодні, цього тижня)", es: "Tiempo no terminado (hoy, esta semana)" }, ex: [I, { target: "'ve had" }, " three coffees today."], tr: { uk: "Сьогодні я випив три кави.", es: "Hoy me he tomado tres cafés." } }
          - { level: B1, use: { en: ["A state from the past up to now (", { term: for }, ", ", { term: since }, ")"], uk: ["Стан, що триває з минулого до цього часу (", { term: for }, ", ", { term: since }, ")"], es: ["Un estado desde el pasado hasta ahora (", { term: for }, ", ", { term: since }, ")"] }, ex: [She, { target: "'s lived" }, " here since ", { date: "2019", value: "2019" }, "."], tr: { uk: "Вона живе тут з 2019 року.", es: "Vive aquí desde 2019." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: been }, " = went and came back; ", { term: gone }, " = went and is still there:"]
              uk: [{ term: been }, " = побував і повернувся; ", { term: gone }, " = поїхав і ще там:"]
              es: [{ term: been }, " = fue y volvió; ", { term: gone }, " = fue y sigue allí:"]
            ex: { examples: [[She, { target: "'s been" }, " to Spain."], [She, { target: "'s gone" }, " to Spain."]] }
            tr: { uk: { examples: ["Вона побувала в Іспанії.", "Вона поїхала до Іспанії."] }, es: { examples: ["Ha estado en España.", "Se ha ido a España."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: for }, " takes a length of time; ", { term: since }, " takes a starting point:"]
              uk: [{ term: for }, " вживається з тривалістю часу; ", { term: since }, " — з моментом початку:"]
              es: [{ term: for }, " lleva una duración; ", { term: since }, " lleva un punto de partida:"]
            ex: ["I've known her ", { alternatives: [[{ target: for }, " ten years"], [{ target: since }, " ", { date: "2015", value: "2015" }]] }, "."]
            tr: { uk: { examples: ["Я знаю її десять років.", "Я знаю її з 2015 року."] }, es: { examples: ["La conozco desde hace diez años.", "La conozco desde 2015."] } }

  - title: { en: "Past perfect: form", uk: "Past Perfect: форма", es: "Pasado perfecto: forma" }
    role: form
    features: { tense: pst, aspect: prf }
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A short answer repeats ", { term: had }, ":"]
              uk: ["Коротка відповідь повторює ", { term: had }, ":"]
              es: ["La respuesta corta repite ", { term: had }, ":"]
            ex: { exchange: [Had they left?, { alternatives: [["Yes, they ", { target: had }, "."], ["No, they ", { target: hadn't }, "."]] }] }
            tr: { uk: "Вони вже пішли? — Так, пішли; ні, не пішли.", es: "¿Se habían ido? — Sí, se habían ido; no, no se habían ido." }
          - type: rule
            level: B1
            text:
              en: [{ term: already }, ", ", { term: just }, " and ", { term: never }, " go between ", { term: had }, " and the participle:"]
              uk: [{ term: already }, ", ", { term: just }, " і ", { term: never }, " стоять між ", { term: had }, " і 3-ю формою дієслова:"]
              es: [{ term: already }, ", ", { term: just }, " y ", { term: never }, " van entre ", { term: had }, " y el participio:"]
            ex: [I, { target: "'d never" }, " flown before."]
            tr: { uk: "Я ніколи раніше не літав.", es: "Nunca antes había volado." }

  - title: { en: "Past perfect: use", uk: "Past Perfect: вживання", es: "Pasado perfecto: uso" }
    role: use
    features: { tense: pst, aspect: prf }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, use: { en: An action before another past action, uk: "Дія раніше за іншу минулу дію", es: "Una acción anterior a otra acción pasada" }, ex: ["When I got home, she ", { target: had }, " already ", { target: cooked }, "."], tr: { uk: "Коли я прийшов додому, вона вже приготувала їжу.", es: "Cuando llegué a casa, ella ya había cocinado." } }
          - { level: B1, use: { en: An action before a past time, uk: "Дія раніше за певний момент у минулому", es: "Una acción anterior a un momento del pasado" }, ex: ["By 8 o'clock he ", { target: had left }, "."], tr: { uk: "До восьмої години він уже пішов.", es: "A las ocho ya se había ido." } }
