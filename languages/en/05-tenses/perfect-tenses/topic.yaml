title: { en: Perfect Tenses, uk: "Доконані часи (Perfect)", es: Tiempos perfectos, pt: "Tempos perfeitos", fr: "Temps du perfect", de: "Perfektformen (Perfect)", it: "Tempi perfetti (Perfect)", pl: "Czasy Perfect", tr: "Tamamlanmış zamanlar (Perfect)", id: "Perfect Tenses", vi: "Các thì hoàn thành (Perfect)" }
summary:
  lead:
    en: ["Present perfect and past perfect: ", { term: have }, ", ", { term: has }, " or ", { term: had }, " plus the past participle for an earlier event seen from a later point."]
    uk: ["Present Perfect і Past Perfect: ", { term: have }, ", ", { term: has }, " або ", { term: had }, " і 3-тя форма дієслова показують ранішу подію з погляду пізнішого моменту."]
    es: ["Presente perfecto y pasado perfecto: ", { term: have }, ", ", { term: has }, " o ", { term: had }, " más el participio pasado para un hecho anterior visto desde un momento posterior."]
    pt: ["Presente perfeito e passado perfeito: ", { term: "have" }, ", ", { term: "has" }, " ou ", { term: "had" }, " mais o particípio passado para um fato anterior visto de um momento posterior."]
    fr: ["Present perfect et past perfect : ", { term: "have" }, ", ", { term: "has" }, " ou ", { term: "had" }, " plus le participe passé pour un fait antérieur vu depuis un moment postérieur."]
    de: ["Present Perfect und Past Perfect: ", { term: "have" }, ", ", { term: "has" }, " oder ", { term: "had" }, " plus Past Participle für ein früheres Geschehen, von einem späteren Zeitpunkt aus gesehen."]
    it: ["Present perfect e past perfect: ", { term: "have" }, ", ", { term: "has" }, " o ", { term: "had" }, " più il participio passato per un fatto anteriore visto da un momento successivo."]
    pl: ["Present Perfect i Past Perfect: ", { term: "have" }, ", ", { term: "has" }, " lub ", { term: "had" }, " oraz III forma czasownika; opisują wcześniejsze zdarzenie widziane z późniejszego momentu."]
    tr: ["Present Perfect ve Past Perfect: daha sonraki bir noktadan bakılan, daha önce olmuş bir olay için ", { term: "have" }, ", ", { term: "has" }, " ya da ", { term: "had" }, " ile past participle."]
    id: ["Present perfect dan past perfect: ", { term: "have" }, ", ", { term: "has" }, " atau ", { term: "had" }, " ditambah past participle untuk peristiwa yang lebih awal, dilihat dari titik waktu yang lebih kemudian."]
    vi: ["Hiện tại hoàn thành và quá khứ hoàn thành: ", { term: "have" }, ", ", { term: "has" }, " hoặc ", { term: "had" }, " cộng quá khứ phân từ, chỉ việc xảy ra trước, nhìn từ mốc sau."]
  rule:
    en: ["A finished time such as ", { term: yesterday }, " or ", { term: ago }, " takes the past simple:"]
    uk: ["Закінчений час, як-от ", { term: yesterday }, " чи ", { term: ago }, ", вимагає Past Simple:"]
    es: ["Un tiempo terminado, como ", { term: yesterday }, " o ", { term: ago }, ", lleva el pasado simple:"]
    pt: ["Um tempo terminado, como ", { term: "yesterday" }, " ou ", { term: "ago" }, ", leva o passado simples:"]
    fr: ["Une période révolue comme ", { term: "yesterday" }, " ou ", { term: "ago" }, " prend le prétérit simple :"]
    de: ["Eine abgeschlossene Zeitangabe wie ", { term: "yesterday" }, " oder ", { term: "ago" }, " verlangt das Simple Past:"]
    it: ["Un tempo concluso, come ", { term: "yesterday" }, " o ", { term: "ago" }, ", richiede il past simple:"]
    pl: ["Czas zakończony, np. ", { term: "yesterday" }, " lub ", { term: "ago" }, ", wymaga Past Simple:"]
    tr: ["Bitmiş bir zaman ifadesi (", { term: "yesterday" }, ", ", { term: "ago" }, ") Simple Past ile kullanılır:"]
    id: ["Waktu yang sudah selesai seperti ", { term: "yesterday" }, " atau ", { term: "ago" }, " memakai simple past:"]
    vi: ["Thời gian đã kết thúc như ", { term: "yesterday" }, " hoặc ", { term: "ago" }, " đi với quá khứ đơn:"]
  ex: { examples: [["I ", { target: saw }, " her yesterday."], ["I ", { target: have seen }, " her today."]] }

