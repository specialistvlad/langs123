          - type: rule
            level: B2
            text: { en: ["A question starts with ", { alternatives: [{ term: Have }, { term: Has }] }, "; the short answer repeats it:"], uk: ["Питання починається з ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; коротка відповідь повторює його:"], es: ["Una pregunta empieza con ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; la respuesta corta lo repite:"], pt: ["Uma pergunta começa com ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; a resposta curta o repete:"], fr: ["Une question commence par ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, " ; la réponse courte le reprend :"], de: ["Eine Frage beginnt mit ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; die Kurzantwort wiederholt es:"], it: ["Una domanda inizia con ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; la risposta breve lo ripete:"], pl: ["Pytanie zaczyna się od ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; krótka odpowiedź je powtarza:"], tr: ["Soru ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, " ile başlar; kısa cevapta bu sözcük tekrarlanır:"], id: ["Pertanyaan dimulai dengan ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; jawaban singkat mengulangnya:"], vi: ["Câu hỏi bắt đầu bằng ", { alternatives: [{ term: "Have" }, { term: "Has" }] }, "; câu trả lời ngắn lặp lại từ đó:"] }
            ex: { exchange: ["Have you been waiting long?", { alternatives: [["Yes, I ", { target: have }, "."], ["No, I ", { target: "haven't" }, "."]] }] }
            tr: { uk: "Ти вже давно чекаєш? — Так, давно; ні, недовго.", es: "¿Llevas mucho tiempo esperando? — Sí, mucho tiempo; no, no mucho.", pt: "Você está esperando há muito tempo? — Sim, estou; não, não estou.", fr: "Tu attends depuis longtemps ? — Oui, depuis longtemps ; non, pas depuis longtemps.", de: "Wartest du schon lange? — Ja, schon lange; nein, noch nicht lange.", it: "Aspetti da molto? — Sì, da molto; no, non da molto.", pl: "Czekasz już długo? — Tak, długo; nie, niedługo.", tr: "Uzun zamandır mı bekliyorsun? — Evet, bekliyorum; hayır, beklemiyorum.", id: "Apakah kamu sudah lama menunggu? — Ya, sudah; tidak, belum.", vi: "Bạn đợi lâu chưa? — Rồi, tôi đợi lâu rồi; chưa, tôi chưa đợi lâu." }
          - type: rule
            level: B2
            text: { en: "Verbs of state take the simple perfect, also for duration:", uk: "Дієслова стану вживаються в Perfect Simple і тоді, коли йдеться про тривалість:", es: "Los verbos de estado llevan el perfecto simple, también para la duración:", pt: "Verbos de estado levam o perfeito simples, também para duração:", fr: "Les verbes d’état prennent le perfect simple, même pour une durée :", de: "Zustandsverben stehen im Perfect Simple, auch bei einer Zeitdauer:", it: "I verbi di stato richiedono il perfect simple, anche per la durata:", pl: "Czasowniki stanu występują w Perfect Simple, także przy określaniu czasu trwania:", tr: "Durum fiilleri, süre bildirirken bile Perfect Simple alır:", id: "Kata kerja statif memakai perfect simple, juga untuk durasi:", vi: "Động từ chỉ trạng thái dùng hoàn thành đơn, kể cả khi nói về khoảng thời gian:" }
            ex: ["I", { target: "'ve known" }, " her for years."]
            tr: { uk: "Я знаю її вже багато років.", es: "La conozco desde hace años.", pt: "Eu a conheço há anos.", fr: "Je la connais depuis des années.", de: "Ich kenne sie seit Jahren.", it: "La conosco da anni.", pl: "Znam ją od lat.", tr: "Onu yıllardır tanıyorum.", id: "Saya sudah mengenalnya bertahun-tahun.", vi: "Tôi quen cô ấy nhiều năm rồi." }

