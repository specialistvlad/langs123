            text: { en: ["Guesses with modal verbs: see ", { link: Must and have to, to: en.modals.must-have-to }, " and ", { link: May and might, to: en.modals.may-might }, "."], uk: ["Здогади з модальними дієсловами: див. ", { link: "Must і have to", to: "en.modals.must-have-to" }, " і ", { link: "May і might", to: "en.modals.may-might" }, "."], es: ["Suposiciones con verbos modales: ver ", { link: "Must y have to", to: "en.modals.must-have-to" }, " y ", { link: "May y might", to: "en.modals.may-might" }, "."], pt: ["Suposições com verbos modais: ver ", { link: "Must e have to", to: "en.modals.must-have-to" }, " e ", { link: "May e might", to: "en.modals.may-might" }, "."], fr: ["Suppositions avec les verbes modaux : voir ", { link: "Must et have to", to: "en.modals.must-have-to" }, " et ", { link: "May et might", to: "en.modals.may-might" }, "."], de: ["Vermutungen mit Modalverben: siehe ", { link: "Must und have to", to: "en.modals.must-have-to" }, " und ", { link: "May und might", to: "en.modals.may-might" }, "."], it: ["Ipotesi con i verbi modali: vedi ", { link: "Must e have to", to: "en.modals.must-have-to" }, " e ", { link: "May e might", to: "en.modals.may-might" }, "."], pl: ["Przypuszczenia z czasownikami modalnymi: zob. ", { link: "Must i have to", to: "en.modals.must-have-to" }, " i ", { link: "May i might", to: "en.modals.may-might" }, "."], tr: ["Kip fiilleriyle yapılan tahminler için bkz. ", { link: "Must ve have to", to: "en.modals.must-have-to" }, " ve ", { link: "May ve might", to: "en.modals.may-might" }, "."], id: ["Dugaan dengan kata kerja modal: lihat ", { link: "Must dan have to", to: "en.modals.must-have-to" }, " dan ", { link: "May dan might", to: "en.modals.may-might" }, "."], vi: ["Suy đoán với động từ khuyết thiếu: xem ", { link: "Must và have to", to: "en.modals.must-have-to" }, " và ", { link: "May và might", to: "en.modals.may-might" }, "."] }

  - title: { en: Narrative and commentary, uk: "Розповідь і коментар", es: "Narración y comentario en vivo", pt: "Narração e comentário", fr: "Récit et commentaire", de: "Erzählung und Kommentar", it: "Narrazione e commento", pl: "Narracja i komentarz", tr: "Anlatım ve yorum", id: "Narasi dan komentar", vi: "Kể chuyện và bình luận" }
    role: own
