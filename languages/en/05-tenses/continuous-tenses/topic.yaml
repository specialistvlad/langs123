        - { level: B2, point: { en: Always with the continuous, uk: "Always з Continuous", es: "Always con el continuo", pt: "Always com o contínuo", fr: "Always avec le continu", de: "Always mit der Verlaufsform", it: "Always con il continuous", pl: "Always z formą Continuous", tr: "Continuous ile always", id: "Always dengan continuous", vi: "Always với thì tiếp diễn" }, rule: { en: "repeated, annoying or surprising actions", uk: "повторювані дії, що дратують або дивують", es: "acciones repetidas que molestan o sorprenden", pt: "ações repetidas que irritam ou surpreendem", fr: "actions répétées qui agacent ou surprennent", de: "wiederholte Handlungen, die stören oder überraschen", it: "azioni ripetute che infastidiscono o sorprendono", pl: "powtarzane czynności, które irytują lub zaskakują", tr: "tekrarlanan, can sıkıcı ya da şaşırtıcı eylemler", id: "tindakan berulang yang menjengkelkan atau mengejutkan", vi: "hành động lặp lại gây khó chịu hoặc bất ngờ" }, ex: ["He", { target: "'s always losing" }, " his keys."], tr: { uk: "Він постійно губить ключі.", es: "Siempre está perdiendo las llaves.", pt: "Ele está sempre perdendo as chaves.", fr: "Il est toujours en train de perdre ses clés.", de: "Er verliert ständig seine Schlüssel.", it: "Perde sempre le chiavi.", pl: "Wiecznie gubi klucze.", tr: "Sürekli anahtarlarını kaybediyor.", id: "Dia selalu saja menghilangkan kuncinya.", vi: "Anh ấy lúc nào cũng làm mất chìa khóa." } }
        - { level: B2, point: { en: Verbs with two meanings, uk: "Дієслова з двома значеннями", es: "Verbos con dos significados", pt: "Verbos com dois significados", fr: "Verbes à deux sens", de: "Verben mit zwei Bedeutungen", it: "Verbi con due significati", pl: "Czasowniki o dwóch znaczeniach", tr: "İki anlamlı fiiller", id: "Kata kerja dengan dua arti", vi: "Động từ có hai nghĩa" }, rule: { en: only the activity meaning takes the continuous, uk: "лише значення дії вживається в Continuous", es: "solo el significado de actividad admite el continuo", pt: "só o sentido de atividade aceita o contínuo", fr: "seul le sens d’activité accepte le continu", de: "nur die Tätigkeitsbedeutung steht in der Verlaufsform", it: "solo il significato di attività ammette il continuous", pl: "tylko znaczenie czynności przyjmuje formę Continuous", tr: "yalnızca eylem anlamı Continuous alır", id: "hanya arti aktivitas yang memakai continuous", vi: "chỉ nghĩa chỉ hành động mới dùng thì tiếp diễn" }, ex: { examples: [["I ", { target: think }, " so."], ["I", { target: "'m thinking" }, " about it."]] }, tr: { uk: { examples: ["Гадаю, так.", "Я обмірковую це."] }, es: { examples: ["Creo que sí.", "Lo estoy pensando."] }, pt: { examples: ["Acho que sim.", "Estou pensando nisso."] }, fr: { examples: ["Je pense que oui.", "J’y réfléchis."] }, de: { examples: ["Das denke ich.", "Ich denke darüber nach."] }, it: { examples: ["Penso di sì.", "Ci sto pensando."] }, pl: { examples: ["Tak myślę.", "Zastanawiam się nad tym."] }, tr: { examples: ["Bence öyle.", "Bunu düşünüyorum."] }, id: { examples: ["Saya kira begitu.", "Saya sedang memikirkannya."] }, vi: { examples: ["Tôi nghĩ vậy.", "Tôi đang suy nghĩ về điều đó."] } } }
        - { level: B2, point: { en: Polite and tentative, uk: "Ввічливо й обережно", es: "Cortesía y cautela", pt: "Cortesia e cautela", fr: "Politesse et prudence", de: "Höflich und vorsichtig", it: "Cortesia e cautela", pl: "Grzecznie i ostrożnie", tr: "Nazik ve çekingen", id: "Sopan dan hati-hati", vi: "Lịch sự và dè dặt" }, rule: { en: the continuous softens a request or a hope, uk: "Continuous пом’якшує прохання або сподівання", es: "el continuo suaviza una petición o un deseo", pt: "o contínuo suaviza um pedido ou uma esperança", fr: "le continu adoucit une demande ou un souhait", de: "die Verlaufsform macht eine Bitte oder einen Wunsch weicher", it: "il continuous attenua una richiesta o una speranza", pl: "Continuous łagodzi prośbę lub nadzieję", tr: "Continuous bir ricayı ya da umudu yumuşatır", id: "continuous melunakkan permintaan atau harapan", vi: "thì tiếp diễn làm lời nhờ hoặc lời mong mỏi nhẹ nhàng hơn" }, ex: ["I ", { target: was wondering }, " if you could help."], tr: { uk: "Цікаво, чи не могли б ви допомогти.", es: "Me preguntaba si podría ayudarme.", pt: "Eu queria saber se você poderia ajudar.", fr: "Je me demandais si vous pourriez m’aider.", de: "Ich wollte fragen, ob Sie helfen könnten.", it: "Mi chiedevo se potesse aiutarmi.", pl: "Zastanawiałem się, czy mógłby pan pomóc.", tr: "Yardım edebilir misiniz diye merak ediyordum.", id: "Saya ingin tahu apakah Anda bisa membantu.", vi: "Không biết bạn có thể giúp được không ạ." } }
        - { level: B2, point: { en: Continuous infinitive, uk: "Continuous Infinitive", es: "Infinitivo continuo", pt: "Infinitivo contínuo", fr: "Infinitif continu", de: "Infinitiv der Verlaufsform", it: "Infinito continuo", pl: "Bezokolicznik Continuous", tr: "Continuous mastar", id: "Infinitif continuous", vi: "Động từ nguyên mẫu tiếp diễn" }, rule: { en: "a guess about now: modal or seem, then be and the -ing verb", uk: "здогад про теперішнє: модальне дієслово або seem, потім be і дієслово з -ing", es: "una suposición sobre el presente: verbo modal o seem, luego be y el verbo con -ing", pt: "uma suposição sobre o presente: verbo modal ou seem, depois be e o verbo com -ing", fr: "une supposition sur le présent : modal ou seem, puis be et le verbe en -ing", de: "eine Vermutung über die Gegenwart: Modalverb oder seem, dann be und das Verb mit -ing", it: "un'ipotesi sul presente: verbo modale o seem, poi be e il verbo in -ing", pl: "przypuszczenie o teraźniejszości: czasownik modalny lub seem, potem be i czasownik z -ing", tr: "şimdiyle ilgili tahmin: kip fiili ya da seem, sonra be ve -ing alan fiil", id: "dugaan tentang saat ini: kata kerja modal atau seem, lalu be dan kata kerja berakhiran -ing", vi: "suy đoán về hiện tại: động từ khuyết thiếu hoặc seem, rồi be và động từ thêm -ing" }, ex: ["She must ", { target: be working }, "."], tr: { uk: "Вона, мабуть, зараз працює.", es: "Debe de estar trabajando.", pt: "Ela deve estar trabalhando.", fr: "Elle doit être en train de travailler.", de: "Sie arbeitet bestimmt gerade.", it: "Dev'essere al lavoro.", pl: "Ona pewnie teraz pracuje.", tr: "Şu an çalışıyor olmalı.", id: "Dia pasti sedang bekerja.", vi: "Cô ấy chắc đang làm việc." } }
        - { level: C1, point: { en: Narrative present, uk: "Теперішній час у розповіді", es: "Presente narrativo", pt: "Presente narrativo", fr: "Présent de narration", de: "Erzählendes Präsens", it: "Presente narrativo", pl: "Czas teraźniejszy w narracji", tr: "Anlatımda şimdiki zaman", id: "Present untuk bercerita", vi: "Hiện tại dùng để kể chuyện" }, rule: { en: "anecdotes, commentary and stage directions", uk: "розповіді з життя, коментар і сценічні ремарки", es: "anécdotas, comentarios en vivo y acotaciones escénicas", pt: "relatos, comentários ao vivo e indicações de cena", fr: "anecdotes, commentaire en direct et indications scéniques", de: "Anekdoten, Live-Kommentar und Regieanweisungen", it: "aneddoti, telecronaca e didascalie", pl: "anegdoty, komentarz na żywo i didaskalia", tr: "anekdotlar, canlı anlatım ve sahne yönergeleri", id: "anekdot, komentar langsung, dan petunjuk panggung", vi: "giai thoại kể lại, bình luận trực tiếp và chỉ dẫn sân khấu" }, ex: ["So I", { target: "'m walking" }, " home and I see Tom."], tr: { uk: "Ну от, іду я додому і бачу Тома.", es: "Entonces voy caminando a casa y veo a Tom.", pt: "Aí eu estou andando para casa e vejo o Tom.", fr: "Alors je rentre à pied et je vois Tom.", de: "Also ich gehe so nach Hause und sehe Tom.", it: "Allora sto tornando a casa e vedo Tom.", pl: "Więc idę sobie do domu i widzę Toma.", tr: "Eve doğru yürüyorum ve Tom'u görüyorum.", id: "Jadi saya sedang berjalan pulang dan melihat Tom.", vi: "Thế là tôi đang đi bộ về nhà và thấy Tom." } }
        - { level: C1, point: { en: State verbs for emphasis, uk: "Дієслова стану для наголосу", es: "Verbos de estado con énfasis", pt: "Verbos de estado para dar ênfase", fr: "Verbes d’état pour insister", de: "Zustandsverben zur Betonung", it: "Verbi di stato per enfasi", pl: "Czasowniki stanu dla podkreślenia", tr: "Vurgu için durum fiilleri", id: "Kata kerja statif untuk penekanan", vi: "Động từ chỉ trạng thái để nhấn mạnh" }, rule: { en: a feeling stressed as new or temporary, uk: "почуття, що підкреслюється як нове або тимчасове", es: "un sentimiento que se destaca como nuevo o pasajero", pt: "um sentimento destacado como novo ou temporário", fr: "un sentiment présenté comme nouveau ou passager", de: "ein Gefühl, das als neu oder vorübergehend hervorgehoben wird", it: "un sentimento sottolineato come nuovo o temporaneo", pl: "uczucie podkreślane jako nowe lub chwilowe", tr: "yeni ya da geçici olarak vurgulanan bir duygu", id: "perasaan yang ditekankan sebagai hal baru atau sementara", vi: "một cảm xúc được nhấn mạnh là mới hoặc tạm thời" }, ex: ["I", { target: "'m loving" }, " it."], tr: { uk: "Мені це дуже подобається.", es: "Me está encantando.", pt: "Estou amando.", fr: "J’adore ça.", de: "Ich finde es gerade richtig toll.", it: "Mi sta piacendo un sacco.", pl: "Uwielbiam to!", tr: "Buna bayılıyorum.", id: "Saya sangat menyukainya.", vi: "Tôi đang rất thích điều này!" } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: prose
        level: A1
        text:
          en: ["Each continuous tense is ", { pattern: [{ term: be }, { slot: verb }, { term: "-ing" }] }, ": ", { term: will be }, " for the future, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " for the present, ", { alternatives: [{ term: was }, { term: were }] }, " for the past."]
          uk: ["Кожен час Continuous має форму ", { pattern: [{ term: be }, { slot: verb }, { term: "-ing" }] }, ": ", { term: will be }, " для майбутнього, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " для теперішнього, ", { alternatives: [{ term: was }, { term: were }] }, " для минулого."]
          es: ["Cada tiempo continuo se forma con ", { pattern: [{ term: be }, { slot: verb }, { term: "-ing" }] }, ": ", { term: will be }, " para el futuro, ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, " para el presente, ", { alternatives: [{ term: was }, { term: were }] }, " para el pasado."]
          pt: ["Cada tempo contínuo se forma com ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " para o futuro, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " para o presente, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " para o passado."]
          fr: ["Chaque temps continu a la forme ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, " : ", { term: "will be" }, " au futur, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " au présent, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " au passé."]
          de: ["Jede Verlaufsform hat die Form ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " für die Zukunft, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " für die Gegenwart, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " für die Vergangenheit."]
          it: ["Ogni tempo continuo ha la forma ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " per il futuro, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " per il presente, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " per il passato."]
          pl: ["Każdy czas ciągły ma budowę ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " dla przyszłości, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " dla teraźniejszości, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " dla przeszłości."]
          tr: ["Her Continuous zaman ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, " biçimindedir: gelecek için ", { term: "will be" }, ", şimdiki zaman için ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", geçmiş zaman için ", { alternatives: [{ term: "was" }, { term: "were" }] }, "."]
          id: ["Setiap continuous tense berbentuk ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " untuk future, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " untuk present, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " untuk past."]
          vi: ["Mỗi thì tiếp diễn có dạng ", { pattern: [{ term: "be" }, { slot: "verb" }, { term: "-ing" }] }, ": ", { term: "will be" }, " cho tương lai, ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, " cho hiện tại, ", { alternatives: [{ term: "was" }, { term: "were" }] }, " cho quá khứ."]
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In questions ", { term: be }, " goes before the subject; in negatives it takes ", { term: not }, ": ", { term: isn't }, ", ", { term: wasn't }, ", ", { term: won't be }, "."]
              uk: ["У питаннях ", { term: be }, " стоїть перед підметом; у запереченнях після нього стоїть ", { term: not }, ": ", { term: isn't }, ", ", { term: wasn't }, ", ", { term: won't be }, "."]
              es: ["En las preguntas, ", { term: be }, " va antes del sujeto; en las negaciones lleva ", { term: not }, ": ", { term: isn't }, ", ", { term: wasn't }, ", ", { term: won't be }, "."]
              pt: ["Nas perguntas, ", { term: "be" }, " vem antes do sujeito; nas negações, recebe ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              fr: ["Dans les questions, ", { term: "be" }, " passe avant le sujet ; dans les négations, il prend ", { term: "not" }, " : ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              de: ["In Fragen steht ", { term: "be" }, " vor dem Subjekt; in Verneinungen folgt darauf ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              it: ["Nelle domande ", { term: "be" }, " precede il soggetto; nelle frasi negative prende ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              pl: ["W pytaniach ", { term: "be" }, " stoi przed podmiotem; w przeczeniach następuje po nim ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              tr: ["Sorularda ", { term: "be" }, " özneden önce gelir; olumsuz cümlelerde ", { term: "not" }, " alır: ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              id: ["Dalam pertanyaan, ", { term: "be" }, " diletakkan sebelum subjek; dalam kalimat negatif, ditambahkan ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
              vi: ["Trong câu hỏi, ", { term: "be" }, " đứng trước chủ ngữ; câu phủ định thêm ", { term: "not" }, ": ", { term: "isn't" }, ", ", { term: "wasn't" }, ", ", { term: "won't be" }, "."]
          - type: rule
            level: A1
            text:
              en: ["The main verb always ends in ", { term: "-ing" }, ", in every tense and for every person."]
              uk: ["Основне дієслово завжди закінчується на ", { term: "-ing" }, " в усіх часах і для всіх осіб."]
              es: ["El verbo principal siempre termina en ", { term: "-ing" }, ", en todos los tiempos y para todas las personas."]
              pt: ["O verbo principal sempre termina em ", { term: "-ing" }, ", em todos os tempos e para todas as pessoas."]
              fr: ["Le verbe principal se termine toujours par ", { term: "-ing" }, ", à tous les temps et pour toutes les personnes."]
              de: ["Das Hauptverb endet immer auf ", { term: "-ing" }, ", in allen Zeitformen und für alle Personen."]
              it: ["Il verbo principale termina sempre in ", { term: "-ing" }, ", in tutti i tempi e per tutte le persone."]
              pl: ["Czasownik główny zawsze kończy się na ", { term: "-ing" }, ", we wszystkich czasach i dla wszystkich osób."]
              tr: ["Ana fiil her zamanda ve her kişide daima ", { term: "-ing" }, " ile biter."]
              id: ["Kata kerja utama selalu berakhiran ", { term: "-ing" }, ", di setiap tense dan untuk setiap orang."]
              vi: ["Động từ chính luôn có đuôi ", { term: "-ing" }, ", ở mọi thì và với mọi ngôi."]
          - type: rule
            level: A1
            text:
              en: [{ term: Be }, " changes with the person in the present and past; ", { term: will be }, " is the same for everyone."]
              uk: [{ term: Be }, " змінюється залежно від особи в теперішньому й минулому часі; ", { term: will be }, " однакове для всіх."]
              es: [{ term: Be }, " cambia según la persona en presente y pasado; ", { term: will be }, " es igual para todos."]
              pt: [{ term: "Be" }, " muda conforme a pessoa no presente e no passado; ", { term: "will be" }, " é igual para todos."]
              fr: [{ term: "Be" }, " change selon la personne au présent et au passé ; ", { term: "will be" }, " reste le même pour tous."]
              de: [{ term: "Be" }, " ändert sich in Gegenwart und Vergangenheit mit der Person; ", { term: "will be" }, " ist für alle gleich."]
              it: [{ term: "Be" }, " cambia con la persona al presente e al passato; ", { term: "will be" }, " è uguale per tutti."]
              pl: [{ term: "Be" }, " zmienia się zależnie od osoby w czasie teraźniejszym i przeszłym; ", { term: "will be" }, " jest takie samo dla wszystkich."]
              tr: [{ term: "Be" }, " şimdiki ve geçmiş zamanda kişiye göre değişir; ", { term: "will be" }, " herkes için aynıdır."]
              id: [{ term: "Be" }, " berubah menurut orang pada present dan past; ", { term: "will be" }, " sama untuk semua."]
              vi: [{ term: "Be" }, " thay đổi theo ngôi ở hiện tại và quá khứ; ", { term: "will be" }, " giữ nguyên với mọi chủ ngữ."]
          - type: rule
            level: A1
            text:
              en: ["Speech and messages use short forms: ", { term: I'm }, ", ", { term: she's }, ", ", { term: they're }, ", ", { term: won't be }, "."]
              uk: ["У мовленні й повідомленнях уживають скорочені форми: ", { term: I'm }, ", ", { term: she's }, ", ", { term: they're }, ", ", { term: won't be }, "."]
              es: ["En el habla y en los mensajes se usan formas contraídas: ", { term: I'm }, ", ", { term: she's }, ", ", { term: they're }, ", ", { term: won't be }, "."]
              pt: ["Na fala e nas mensagens usam-se formas contraídas: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              fr: ["À l’oral et dans les messages, on emploie les formes contractées : ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              de: ["Gesprochen und in Nachrichten gelten Kurzformen: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              it: ["Nel parlato e nei messaggi si usano le forme contratte: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              pl: ["W mowie i w wiadomościach używa się form skróconych: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              tr: ["Konuşmada ve mesajlarda kısa biçimler kullanılır: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              id: ["Dalam percakapan dan pesan dipakai bentuk singkat: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]
              vi: ["Văn nói và tin nhắn dùng dạng rút gọn: ", { term: "I'm" }, ", ", { term: "she's" }, ", ", { term: "they're" }, ", ", { term: "won't be" }, "."]

  - title: { en: The -ing form, uk: "Форма на -ing", es: "La forma en -ing", pt: "A forma com -ing", fr: "La forme en -ing", de: "Die -ing-Form", it: "La forma in -ing", pl: "Forma -ing", tr: "-ing biçimi", id: "Bentuk -ing", vi: "Dạng -ing" }
    role: form
    content:
      - type: usage
