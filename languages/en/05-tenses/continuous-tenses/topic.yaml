          - { level: C1, use: { en: Stage directions and descriptions of a picture, uk: "Ремарки до п’єси й опис картини", es: "Acotaciones y descripciones de una imagen", pt: "Rubricas e descrições de uma imagem", fr: "Indications scéniques et descriptions d’une image", de: "Regieanweisungen und Bildbeschreibungen", it: "Didascalie e descrizioni di un'immagine", pl: "Didaskalia i opisy obrazu", tr: "Sahne yönergeleri ve bir resmin betimlenmesi", id: "Petunjuk panggung dan deskripsi gambar", vi: "Chỉ dẫn sân khấu và mô tả một bức tranh" }, ex: ["Anna ", { target: is sitting }, " by the window with a letter in her hand."], tr: { uk: "Анна сидить біля вікна з листом у руці.", es: "Anna está sentada junto a la ventana con una carta en la mano.", pt: "Anna está sentada perto da janela com uma carta na mão.", fr: "Anna est assise près de la fenêtre, une lettre à la main.", de: "Anna sitzt mit einem Brief in der Hand am Fenster.", it: "Anna è seduta vicino alla finestra con una lettera in mano.", pl: "Anna siedzi przy oknie z listem w ręku.", tr: "Anna elinde bir mektupla pencerenin yanında oturuyor.", id: "Anna duduk di dekat jendela dengan sepucuk surat di tangannya.", vi: "Anna ngồi bên cửa sổ, tay cầm một lá thư." } }
  - title: { en: Stative verbs, uk: "Дієслова стану", es: "Verbos de estado", pt: "Verbos de estado", fr: "Verbes d’état", de: "Zustandsverben", it: "Verbi di stato", pl: "Czasowniki stanu", tr: "Durum fiilleri", id: "Kata kerja statif", vi: "Động từ chỉ trạng thái" }
    role: own
    content:
      - type: prose
        level: A1
        text:
          en: "Verbs for states take the simple tenses, also for what is true right now."
          uk: "Дієслова стану вживаються в простих часах, також для того, що є правдою саме зараз."
          es: "Los verbos de estado se usan en los tiempos simples, también para lo que es verdad ahora mismo."
          pt: "Os verbos de estado ficam nos tempos simples, também para o que é verdade neste momento."
          fr: "Les verbes d’état s’emploient aux temps simples, y compris pour ce qui est vrai en ce moment."
          de: "Verben des Zustands stehen in den einfachen Zeitformen, auch für das, was gerade jetzt gilt."
          it: "I verbi di stato si usano nei tempi semplici, anche per ciò che è vero in questo momento."
          pl: "Czasowniki stanu występują w czasach prostych, także gdy chodzi o to, co jest prawdą właśnie teraz."
          tr: "Durum bildiren fiiller basit zamanlarla kullanılır; şu anda doğru olan durumlar için de."
          id: "Kata kerja statif memakai simple tense, juga untuk hal yang benar saat ini."
          vi: "Động từ chỉ trạng thái dùng ở các thì đơn, kể cả cho điều đúng ngay lúc này."
      - type: usage
        columns:
          - { key: group, label: { en: Group, uk: "Група", es: "Grupo", pt: "Grupo", fr: "Groupe", de: "Gruppe", it: "Gruppo", pl: "Grupa", tr: "Grup", id: "Kelompok", vi: "Nhóm" } }
          - { key: verbs, label: { en: Verbs, uk: "Дієслова", es: "Verbos", pt: "Verbos", fr: "Verbes", de: "Verben", it: "Verbi", pl: "Czasowniki", tr: "Fiiller", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, group: { en: Feelings, uk: "Почуття", es: "Sentimientos", pt: "Sentimentos", fr: "Sentiments", de: "Gefühle", it: "Sentimenti", pl: "Uczucia", tr: "Duygular", id: "Perasaan", vi: "Cảm xúc" }, verbs: "like, love, hate, want, need, prefer", ex: ["I ", { target: want }, " a coffee."], tr: { uk: "Я хочу каву.", es: "Quiero un café.", pt: "Quero um café.", fr: "Je veux un café.", de: "Ich möchte einen Kaffee.", it: "Voglio un caffè.", pl: "Chcę kawy.", tr: "Bir kahve istiyorum.", id: "Saya ingin secangkir kopi.", vi: "Tôi muốn một ly cà phê." } }
          - { level: A1, group: { en: Thinking, uk: "Мислення", es: "Pensamiento", pt: "Pensamento", fr: "Pensée", de: "Denken", it: "Pensiero", pl: "Myślenie", tr: "Düşünme", id: "Pikiran", vi: "Suy nghĩ" }, verbs: { en: [{ term: know }, ", ", { term: think }, " (= ", { term: believe }, "), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }], uk: [{ term: know }, ", ", { term: think }, " (= вважати), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }], es: [{ term: know }, ", ", { term: think }, " (= creer), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }], pt: [{ term: "know" }, ", ", { term: "think" }, " (= achar), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], fr: [{ term: "know" }, ", ", { term: "think" }, " (= croire), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], de: [{ term: "know" }, ", ", { term: "think" }, " (= glauben), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], it: [{ term: "know" }, ", ", { term: "think" }, " (= credere), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], pl: [{ term: "know" }, ", ", { term: "think" }, " (= uważać), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], tr: [{ term: "know" }, ", ", { term: "think" }, " (= sanmak), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], id: [{ term: "know" }, ", ", { term: "think" }, " (= percaya), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }], vi: [{ term: "know" }, ", ", { term: "think" }, " (= tin rằng), ", { term: "understand" }, ", ", { term: "remember" }, ", ", { term: "mean" }] }, ex: ["I ", { target: understand }, " you."], tr: { uk: "Я тебе розумію.", es: "Te entiendo.", pt: "Eu entendo você.", fr: "Je te comprends.", de: "Ich verstehe dich.", it: "Ti capisco.", pl: "Rozumiem cię.", tr: "Seni anlıyorum.", id: "Saya mengerti kamu.", vi: "Tôi hiểu bạn." } }
          - { level: A2, group: { en: Possession, uk: "Володіння", es: "Posesión", pt: "Posse", fr: "Possession", de: "Besitz", it: "Possesso", pl: "Posiadanie", tr: "Sahiplik", id: "Kepemilikan", vi: "Sở hữu" }, verbs: { en: [{ term: have }, " (= ", { term: own }, "), ", { term: own }, ", ", { term: belong }], uk: [{ term: have }, " (= володіти), ", { term: own }, ", ", { term: belong }], es: [{ term: have }, " (= poseer), ", { term: own }, ", ", { term: belong }], pt: [{ term: "have" }, " (= possuir), ", { term: "own" }, ", ", { term: "belong" }], fr: [{ term: "have" }, " (= posséder), ", { term: "own" }, ", ", { term: "belong" }], de: [{ term: "have" }, " (= besitzen), ", { term: "own" }, ", ", { term: "belong" }], it: [{ term: "have" }, " (= possedere), ", { term: "own" }, ", ", { term: "belong" }], pl: [{ term: "have" }, " (= posiadać), ", { term: "own" }, ", ", { term: "belong" }], tr: [{ term: "have" }, " (= sahip olmak), ", { term: "own" }, ", ", { term: "belong" }], id: [{ term: "have" }, " (= memiliki), ", { term: "own" }, ", ", { term: "belong" }], vi: [{ term: "have" }, " (= sở hữu), ", { term: "own" }, ", ", { term: "belong" }] }, ex: ["This bag ", { target: belongs }, " to me."], tr: { uk: "Ця сумка належить мені.", es: "Esta bolsa me pertenece.", pt: "Esta bolsa me pertence.", fr: "Ce sac m’appartient.", de: "Diese Tasche gehört mir.", it: "Questa borsa mi appartiene.", pl: "Ta torba należy do mnie.", tr: "Bu çanta bana ait.", id: "Tas ini milik saya.", vi: "Chiếc túi này là của tôi." } }
          - { level: A2, group: { en: "Senses, being", uk: "Сприйняття, стан", es: "Sentidos, estado", pt: "Sentidos, estado", fr: "Perceptions, état", de: "Sinne, Zustand", it: "Sensi, essere", pl: "Zmysły, stan", tr: "Duyular, olma durumu", id: "Indra, keadaan", vi: "Giác quan, trạng thái" }, verbs: "see, hear, seem, cost", ex: ["It ", { target: costs }, " £10."], tr: { uk: "Це коштує 10 фунтів.", es: "Cuesta 10 libras.", pt: "Custa 10 libras.", fr: "Ça coûte 10 livres.", de: "Es kostet 10 Pfund.", it: "Costa 10 sterline.", pl: "To kosztuje 10 funtów.", tr: "Bunun fiyatı 10 pound.", id: "Harganya 10 pound.", vi: "Cái này giá 10 bảng." } }
      - type: prose
        level: B2
        text: { en: "Some verbs have a state meaning and an activity meaning. Only the activity meaning takes the continuous.", uk: "Деякі дієслова мають значення стану й значення дії. У Continuous вживається лише значення дії.", es: "Algunos verbos tienen un significado de estado y otro de actividad. Solo el significado de actividad admite el continuo.", pt: "Alguns verbos têm um sentido de estado e um sentido de atividade. Só o sentido de atividade aceita o contínuo.", fr: "Certains verbes ont un sens d’état et un sens d’activité. Seul le sens d’activité accepte le continu.", de: "Manche Verben haben eine Zustandsbedeutung und eine Tätigkeitsbedeutung. Nur die Tätigkeitsbedeutung steht in der Verlaufsform.", it: "Alcuni verbi hanno un significato di stato e un significato di attività. Solo il significato di attività ammette il continuous.", pl: "Niektóre czasowniki mają znaczenie stanu i znaczenie czynności. Tylko znaczenie czynności przyjmuje formę Continuous.", tr: "Bazı fiillerin hem durum anlamı hem eylem anlamı vardır. Yalnızca eylem anlamı Continuous alır.", id: "Sebagian kata kerja punya arti keadaan dan arti aktivitas. Hanya arti aktivitas yang memakai continuous.", vi: "Một số động từ có nghĩa chỉ trạng thái và nghĩa chỉ hành động. Chỉ nghĩa chỉ hành động mới dùng thì tiếp diễn." }
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: meaning, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Examples, uk: "Приклади", es: "Ejemplos", pt: "Exemplos", fr: "Exemples", de: "Beispiele", it: "Esempi", pl: "Przykłady", tr: "Örnekler", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, verb: { term: think }, meaning: { en: "believe (simple); consider (continuous)", uk: "вважати (Simple); обмірковувати (Continuous)", es: "creer (simple); considerar (continuo)", pt: "achar (simples); considerar (contínuo)", fr: "croire (simple) ; réfléchir à (continu)", de: "glauben (Simple); überlegen (Verlaufsform)", it: "credere (semplice); riflettere (continuo)", pl: "uważać (Simple); rozważać (Continuous)", tr: "inanmak (basit); değerlendirmek (Continuous)", id: "percaya (simple); mempertimbangkan (continuous)", vi: "tin rằng (thì đơn); cân nhắc (thì tiếp diễn)" }, ex: { examples: [["I ", { target: think }, " you are right."], ["I", { target: "'m thinking" }, " about the offer."]] }, tr: { uk: { examples: ["Я вважаю, що ви праві.", "Я обмірковую цю пропозицію."] }, es: { examples: ["Creo que tienes razón.", "Estoy pensando en la oferta."] }, pt: { examples: ["Acho que você tem razão.", "Estou pensando na proposta."] }, fr: { examples: ["Je pense que vous avez raison.", "Je réfléchis à l’offre."] }, de: { examples: ["Ich glaube, Sie haben recht.", "Ich überlege mir das Angebot."] }, it: { examples: ["Penso che tu abbia ragione.", "Sto riflettendo sull'offerta."] }, pl: { examples: ["Myślę, że ma pan rację.", "Zastanawiam się nad ofertą."] }, tr: { examples: ["Bence haklısınız.", "Teklifi değerlendiriyorum."] }, id: { examples: ["Saya kira Anda benar.", "Saya sedang mempertimbangkan tawaran itu."] }, vi: { examples: ["Tôi nghĩ bạn đúng.", "Tôi đang cân nhắc lời đề nghị."] } } }
