          - { level: A1, wrong: I am work now., right: ["I'm ", { target: working }, " now."], rule: { en: { pattern: [{ term: be }, { slot: V-ing }] }, uk: { pattern: [{ term: be }, { slot: V-ing }] }, es: { pattern: [{ term: be }, { slot: V-ing }] } } }
          - { level: A1, wrong: What you are doing?, right: ["What ", { target: are you }, " doing?"], rule: { en: [{ term: be }, " goes before the subject"], uk: [{ term: be }, " стоїть перед підметом"], es: [{ term: be }, " va antes del sujeto"] } }
          - { level: A1, wrong: Does she working?, right: [{ target: Is }, " she working?"], rule: { en: ["questions start with ", { term: be }], uk: ["питання починаються з ", { term: be }], es: ["las preguntas empiezan con ", { term: be }] } }
          - { level: A1, wrong: He is runing., right: ["He is ", { target: running }, "."], rule: { en: { mapping: [{ pattern: [one vowel, one consonant] }, double it] }, uk: { mapping: [{ pattern: ["один голосний", "один приголосний"] }, "подвоїти приголосний"] }, es: { mapping: [{ pattern: ["una vocal", "una consonante"] }, "duplicar la consonante"] } } }
          - { level: A1, wrong: I am knowing the answer., right: ["I ", { target: know }, " the answer."], rule: { en: { takes: [stative verbs, simple tenses] }, uk: { takes: ["дієслова стану", "прості часи"] }, es: { takes: ["verbos de estado", "tiempos simples"] } } }
          - { level: A2, wrong: "When I was walking home, I was seeing an accident.", right: [{ gap: true }, "I ", { target: saw }, " an accident."], rule: { en: { takes: [short interrupting action, past simple] }, uk: { takes: ["коротка дія, що перериває", "Past Simple"] }, es: { takes: ["acción corta que interrumpe", "pasado simple"] } } }
          - { level: A2, wrong: We was playing., right: ["We ", { target: were }, " playing."], rule: { en: { takes: [{ alternatives: [{ term: you }, { term: we }, { term: they }] }, { term: were }] }, uk: { takes: [{ alternatives: [{ term: you }, { term: we }, { term: they }] }, { term: were }] }, es: { takes: [{ alternatives: [{ term: you }, { term: we }, { term: they }] }, { term: were }] } } }
          - { level: B1, wrong: I will flying tomorrow., right: ["I ", { target: will be flying }, " tomorrow."], rule: { en: { pattern: [{ term: will be }, { slot: V-ing }] }, uk: { pattern: [{ term: will be }, { slot: V-ing }] }, es: { pattern: [{ term: will be }, { slot: V-ing }] } } }
          - { level: A1, speakers: [uk], wrong: "Be quiet! The baby sleeps.", right: ["Be quiet! The baby ", { target: is sleeping }, "."], rule: { uk: ["дія, що триває зараз, — ", { pattern: [{ term: be }, { slot: V-ing }] }, "; українське теперішнє одне для звички й для дії зараз"] } }
          - { level: A1, speakers: [es], wrong: Is raining now., right: [{ target: It }, " is raining now."], rule: { es: ["el sujeto es obligatorio también con el clima: ", { term: It is raining }, ", mientras que el español dice «está lloviendo»"] } }
          - { level: A2, speakers: [es], wrong: "When I was a child, I was playing football every day.", right: ["When I was a child, I ", { target: played }, " football every day."], rule: { es: ["un hábito del pasado va en pasado simple; el imperfecto español no equivale a ", { term: was playing }] } }
