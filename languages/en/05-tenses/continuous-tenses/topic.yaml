            text: { en: ["The continuous makes a request or a hope sound less direct than ", { term: I wonder }, " or ", { term: I hope }, "."], uk: ["Continuous робить прохання чи сподівання менш прямим, ніж ", { term: "I wonder" }, " або ", { term: "I hope" }, "."], es: ["El continuo hace que una petición o un deseo suene menos directo que ", { term: "I wonder" }, " o ", { term: "I hope" }, "."], pt: ["O contínuo faz um pedido ou uma esperança soar menos direto do que ", { term: "I wonder" }, " ou ", { term: "I hope" }, "."], fr: ["Le continu rend une demande ou un souhait moins direct que ", { term: "I wonder" }, " ou ", { term: "I hope" }, "."], de: ["Die Verlaufsform lässt eine Bitte oder einen Wunsch weniger direkt klingen als ", { term: "I wonder" }, " oder ", { term: "I hope" }, "."], it: ["Il continuous fa sembrare una richiesta o una speranza meno diretta di ", { term: "I wonder" }, " o ", { term: "I hope" }, "."], pl: ["Continuous sprawia, że prośba lub nadzieja brzmi mniej bezpośrednio niż ", { term: "I wonder" }, " lub ", { term: "I hope" }, "."], tr: ["Continuous, bir ricayı ya da umudu ", { term: "I wonder" }, " veya ", { term: "I hope" }, " kalıbından daha dolaylı gösterir."], id: ["Continuous membuat permintaan atau harapan terdengar kurang langsung dibandingkan ", { term: "I wonder" }, " atau ", { term: "I hope" }, "."], vi: ["Thì tiếp diễn khiến lời nhờ hoặc lời mong mỏi nghe bớt trực tiếp hơn so với ", { term: "I wonder" }, " hoặc ", { term: "I hope" }, "."] }

