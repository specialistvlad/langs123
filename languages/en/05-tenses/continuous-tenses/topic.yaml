          - { level: B2, form: { pattern: [{ alternatives: [must, can't, may, might, could] }, be, { slot: V-ing }] }, use: { en: A guess about what is happening now, uk: "Здогад про те, що відбувається зараз", es: "Una suposición sobre lo que ocurre ahora", pt: "Uma suposição sobre o que está acontecendo agora", fr: "Une supposition sur ce qui se passe maintenant", de: "Eine Vermutung darüber, was gerade geschieht", it: "Un'ipotesi su ciò che sta accadendo ora", pl: "Przypuszczenie o tym, co dzieje się teraz", tr: "Şu anda olup bitene dair bir tahmin", id: "Dugaan tentang apa yang sedang terjadi sekarang", vi: "Suy đoán về điều đang diễn ra lúc này" }, ex: { examples: [["She must ", { target: be working }, "."], ["He might ", { target: be sleeping }, "."]] }, tr: { uk: { examples: ["Вона, мабуть, зараз працює.", "Він, можливо, спить."] }, es: { examples: ["Debe de estar trabajando.", "Puede que esté durmiendo."] }, pt: { examples: ["Ela deve estar trabalhando.", "Ele pode estar dormindo."] }, fr: { examples: ["Elle doit être en train de travailler.", "Il est peut-être en train de dormir."] }, de: { examples: ["Sie arbeitet bestimmt gerade.", "Er schläft vielleicht gerade."] }, it: { examples: ["Dev'essere al lavoro.", "Potrebbe stare dormendo."] }, pl: { examples: ["Ona pewnie teraz pracuje.", "On może teraz spać."] }, tr: { examples: ["Şu an çalışıyor olmalı.", "Uyuyor olabilir."] }, id: { examples: ["Dia pasti sedang bekerja.", "Dia mungkin sedang tidur."] }, vi: { examples: ["Cô ấy chắc đang làm việc.", "Anh ấy có thể đang ngủ."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [seem, appear] }, to be, { slot: V-ing }] }, use: { en: An impression of an action in progress, uk: "Враження про дію, що триває", es: "Una impresión de una acción en curso", pt: "Uma impressão de uma ação em andamento", fr: "Une impression d’action en cours", de: "Ein Eindruck von einer ablaufenden Handlung", it: "Un'impressione di un'azione in corso", pl: "Wrażenie trwającej czynności", tr: "Süren bir eylem izlenimi", id: "Kesan tentang tindakan yang sedang berlangsung", vi: "Ấn tượng về một hành động đang diễn ra" }, ex: ["It ", { target: seems to be raining }, "."], tr: { uk: "Здається, іде дощ.", es: "Parece que está lloviendo.", pt: "Parece que está chovendo.", fr: "On dirait qu’il pleut.", de: "Es scheint zu regnen.", it: "Sembra che stia piovendo.", pl: "Wygląda na to, że pada deszcz.", tr: "Yağmur yağıyor gibi görünüyor.", id: "Sepertinya sedang hujan.", vi: "Có vẻ như trời đang mưa." } }
