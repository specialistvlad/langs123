title: { en: Continuous Tenses, uk: "Тривалі часи (Continuous)", es: Tiempos continuos, pt: "Tempos contínuos", fr: "Temps continus", de: "Verlaufsformen (Continuous)", it: "Tempi continui (Continuous)", pl: "Czasy ciągłe (Continuous)", tr: "Sürekli zamanlar (Continuous)", id: "Continuous Tenses", vi: "Các thì tiếp diễn (Continuous)" }
summary:
  lead:
    en: ["Present, past and future continuous: ", { term: be }, " plus the verb with -ing for actions in progress at a moment."]
    uk: ["Present, Past і Future Continuous: ", { term: be }, " та дієслово з -ing для дій, що тривають у певний момент."]
    es: ["Presente, pasado y futuro continuos: ", { term: be }, " más el verbo con -ing para las acciones en curso en un momento dado."]
    pt: ["Presente, passado e futuro contínuos: ", { term: "be" }, " mais o verbo com -ing para ações em andamento em um momento."]
    fr: ["Présent, passé et futur continus : ", { term: "be" }, " suivi du verbe en -ing pour les actions en cours à un moment donné."]
    de: ["Present, Past und Future Continuous: ", { term: "be" }, " und das Verb mit -ing für Handlungen, die zu einem bestimmten Zeitpunkt gerade ablaufen."]
    it: ["Present, past e future continuous: ", { term: "be" }, " più il verbo in -ing per le azioni in corso in un dato momento."]
    pl: ["Present, Past i Future Continuous: ", { term: "be" }, " plus czasownik z -ing dla czynności trwających w danym momencie."]
    tr: ["Present, Past ve Future Continuous: ", { term: "be" }, " ve -ing alan fiil, belli bir anda süren eylemler için."]
    id: ["Present, past, dan future continuous: ", { term: "be" }, " ditambah kata kerja berakhiran -ing untuk tindakan yang sedang berlangsung pada suatu saat."]
    vi: ["Hiện tại, quá khứ và tương lai tiếp diễn: ", { term: "be" }, " và động từ thêm -ing, dùng cho hành động đang diễn ra tại một thời điểm."]
  rule:
    en: ["Every continuous form needs ", { term: be }, " before the -ing verb:"]
    uk: ["Кожна форма Continuous потребує ", { term: be }, " перед дієсловом з -ing:"]
    es: ["Cada forma continua necesita ", { term: be }, " antes del verbo con -ing:"]
    pt: ["Toda forma contínua precisa de ", { term: "be" }, " antes do verbo com -ing:"]
    fr: ["Chaque forme continue demande ", { term: "be" }, " devant le verbe en -ing :"]
    de: ["Jede Verlaufsform braucht ", { term: "be" }, " vor dem Verb mit -ing:"]
    it: ["Ogni forma continua richiede ", { term: "be" }, " prima del verbo in -ing:"]
    pl: ["Każda forma ciągła wymaga ", { term: "be" }, " przed czasownikiem z -ing:"]
    tr: ["Her Continuous biçimde -ing alan fiilden önce ", { term: "be" }, " gerekir:"]
    id: ["Setiap bentuk continuous memerlukan ", { term: "be" }, " sebelum kata kerja berakhiran -ing:"]
    vi: ["Mọi dạng tiếp diễn đều cần ", { term: "be" }, " đứng trước động từ thêm -ing:"]
  ex: { examples: [["She ", { target: is reading }, " now."], [{ target: Was }, " she ", { target: reading }, "?"]] }

