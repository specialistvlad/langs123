  - title: { en: Stative verbs, uk: "Дієслова стану", es: "Verbos de estado" }
    role: own
    content:
      - type: prose
        level: A1
        text:
          en: "Verbs for states take the simple tenses, also for what is true right now."
          uk: "Дієслова стану вживаються в простих часах, також для того, що є правдою саме зараз."
          es: "Los verbos de estado se usan en los tiempos simples, también para lo que es verdad ahora mismo."
      - type: usage
        columns:
          - { key: group, label: { en: Group, uk: "Група", es: "Grupo" } }
          - { key: verbs, label: { en: Verbs, uk: "Дієслова", es: "Verbos" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, group: { en: Feelings, uk: "Почуття", es: "Sentimientos" }, verbs: "like, love, hate, want, need, prefer", ex: ["I ", { target: want }, " a coffee."], tr: { uk: "Я хочу каву.", es: "Quiero un café." } }
          - { level: A1, group: { en: Thinking, uk: "Мислення", es: "Pensamiento" }, verbs: { en: [{ term: know }, ", ", { term: think }, " (= ", { term: believe }, "), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }], uk: [{ term: know }, ", ", { term: think }, " (= вважати), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }], es: [{ term: know }, ", ", { term: think }, " (= creer), ", { term: understand }, ", ", { term: remember }, ", ", { term: mean }] }, ex: ["I ", { target: understand }, " you."], tr: { uk: "Я тебе розумію.", es: "Te entiendo." } }
          - { level: A2, group: { en: Possession, uk: "Володіння", es: "Posesión" }, verbs: { en: [{ term: have }, " (= ", { term: own }, "), ", { term: own }, ", ", { term: belong }], uk: [{ term: have }, " (= володіти), ", { term: own }, ", ", { term: belong }], es: [{ term: have }, " (= poseer), ", { term: own }, ", ", { term: belong }] }, ex: ["This bag ", { target: belongs }, " to me."], tr: { uk: "Ця сумка належить мені.", es: "Esta bolsa me pertenece." } }
          - { level: A2, group: { en: "Senses, being", uk: "Сприйняття, стан", es: "Sentidos, estado" }, verbs: "see, hear, seem, cost", ex: ["It ", { target: costs }, " £10."], tr: { uk: "Це коштує 10 фунтів.", es: "Cuesta 10 libras." } }

  - title: { en: "Compare: continuous and simple", uk: "Порівняння: Continuous і Simple", es: "Comparación: tiempos continuos y simples" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: continuous, label: { en: Continuous, uk: "Continuous", es: "Continuo" }, features: { aspect: prog } }
          - { key: simple, label: Simple }
        rows:
          - { level: A1, continuous: { en: "in progress, temporary", uk: "триває зараз, тимчасово", es: "en curso, temporal" }, simple: { en: "habit, fact, finished event", uk: "звичка, факт, завершена подія", es: "hábito, hecho, suceso terminado" } }
          - { level: A1, continuous: { ex: [I, { target: "'m drinking" }, " tea now."], tr: { uk: "Я зараз п’ю чай.", es: "Ahora estoy tomando té." } }, simple: { ex: ["I ", { target: drink }, " tea every day."], tr: { uk: "Я щодня п’ю чай.", es: "Tomo té todos los días." } } }
          - { level: A1, continuous: { ex: ["What ", { target: are }, " you ", { target: doing }, "? ", { gloss: { en: = now, uk: "= зараз", es: "= ahora" } }], tr: { uk: "Що ти робиш?", es: "¿Qué estás haciendo?" } }, simple: { ex: ["What ", { target: do }, " you ", { target: do }, "? ", { gloss: { en: = your job, uk: "= твоя робота", es: "= tu trabajo" } }], tr: { uk: "Ким ти працюєш?", es: "¿A qué te dedicas?" } } }
          - { level: A2, continuous: { ex: ["I ", { target: was walking }, " home", { gap: true }], tr: { uk: "Я йшов додому…", es: "Iba caminando a casa…" } }, simple: { ex: [{ gap: true }, "when I ", { target: saw }, " Tom."], tr: { uk: "…коли я побачив Тома.", es: "…cuando vi a Tom." } } }
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: ["Simple forms: ", { link: Simple Tenses, to: en.tenses.simple-tenses }, "."]
              uk: ["Форми Simple: ", { link: "Прості часи (Simple)", to: en.tenses.simple-tenses }, "."]
              es: ["Formas simples: ", { link: "Tiempos simples", to: en.tenses.simple-tenses }, "."]

