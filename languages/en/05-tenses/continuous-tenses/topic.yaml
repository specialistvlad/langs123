        rows:
          - { level: C1, use: { en: An anecdote told in the present, uk: "Історія з життя, розказана в теперішньому часі", es: "Una anécdota contada en presente", pt: "Um relato contado no presente", fr: "Une anecdote racontée au présent", de: "Eine im Präsens erzählte Anekdote", it: "Un aneddoto raccontato al presente", pl: "Anegdota opowiedziana w czasie teraźniejszym", tr: "Şimdiki zamanda anlatılan bir anı", id: "Sebuah cerita pengalaman yang dituturkan dalam bentuk present", vi: "Một câu chuyện kể ở thì hiện tại" }, ex: ["So I", { target: "'m walking" }, " down the road and I see my old teacher."], tr: { uk: "Ну от, іду я вулицею і бачу свого колишнього вчителя.", es: "Entonces voy caminando por la calle y veo a mi antiguo profesor.", pt: "Aí eu estou andando pela rua e vejo meu antigo professor.", fr: "Alors je marche dans la rue et je vois mon ancien professeur.", de: "Also ich gehe so die Straße entlang und sehe meinen alten Lehrer.", it: "Allora sto camminando per la strada e vedo il mio vecchio insegnante.", pl: "Więc idę sobie ulicą i widzę swojego dawnego nauczyciela.", tr: "Yani yolda yürüyorum ve eski öğretmenimi görüyorum.", id: "Jadi saya sedang berjalan di jalan dan melihat guru lama saya.", vi: "Thế là tôi đang đi trên đường và thấy thầy giáo cũ của mình." } }
