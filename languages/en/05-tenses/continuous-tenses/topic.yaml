          - { level: B1, use: { en: Polite questions about plans, uk: "Ввічливі запитання про плани", es: "Preguntas corteses sobre planes" }, ex: [{ target: Will }, " you ", { target: be using }, " the car tonight?"], tr: { uk: "Ти будеш користуватися машиною сьогодні ввечері?", es: "¿Vas a usar el auto esta noche?" } }
