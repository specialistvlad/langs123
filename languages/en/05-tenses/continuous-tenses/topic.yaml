  - title: { en: Stative verbs, uk: "Дієслова стану", es: "Verbos de estado", pt: "Verbos de estado", fr: "Verbes d’état", de: "Zustandsverben", it: "Verbi di stato", pl: "Czasowniki stanu", tr: "Durum fiilleri", id: "Kata kerja statif", vi: "Động từ chỉ trạng thái" }
    role: own
    content:
      - type: prose
        level: A1
        text:
          en: "Verbs for states take the simple tenses, also for what is true right now."
          uk: "Дієслова стану вживаються в простих часах, також для того, що є правдою саме зараз."
          es: "Los verbos de estado se usan en los tiempos simples, también para lo que es verdad ahora mismo."
          pt: "Os verbos de estado ficam nos tempos simples, também para o que é verdade neste momento."
          fr: "Les verbes d’état s’emploient aux temps simples, y compris pour ce qui est vrai en ce moment."
          de: "Verben des Zustands stehen in den einfachen Zeitformen, auch für das, was gerade jetzt gilt."
          it: "I verbi di stato si usano nei tempi semplici, anche per ciò che è vero in questo momento."
          pl: "Czasowniki stanu występują w czasach prostych, także gdy chodzi o to, co jest prawdą właśnie teraz."
          tr: "Durum bildiren fiiller basit zamanlarla kullanılır; şu anda doğru olan durumlar için de."
          id: "Kata kerja statif memakai simple tense, juga untuk hal yang benar saat ini."
          vi: "Động từ chỉ trạng thái dùng ở các thì đơn, kể cả cho điều đúng ngay lúc này."
