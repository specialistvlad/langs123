        - { level: A2, features: { tense: fut }, tense: { en: [{ link: Present simple, to: en.tenses.simple-tenses }, " for the future"], uk: [{ link: "Present Simple", to: en.tenses.simple-tenses }, " для майбутнього"], es: [{ link: "Presente simple", to: en.tenses.simple-tenses }, " para el futuro"], pt: [{ link: "Presente simples", to: "en.tenses.simple-tenses" }, " para o futuro"], fr: [{ link: "Présent simple", to: "en.tenses.simple-tenses" }, " pour le futur"], de: [{ link: "Simple Present", to: "en.tenses.simple-tenses" }, " für die Zukunft"], it: [{ link: "Present simple", to: "en.tenses.simple-tenses" }, " per il futuro"], pl: [{ link: "Present Simple", to: "en.tenses.simple-tenses" }, " dla przyszłości"], tr: [{ link: "Simple Present", to: "en.tenses.simple-tenses" }, " gelecek için"], id: [{ link: "Simple Present", to: "en.tenses.simple-tenses" }, " untuk masa depan"], vi: [{ link: "Hiện tại đơn", to: "en.tenses.simple-tenses" }, " cho tương lai"] }, form: { alternatives: [V, V-s] }, meaning: { en: timetables, uk: "розклади", es: "horarios", pt: "horários", fr: "horaires", de: "Fahrpläne", it: "orari", pl: "rozkłady jazdy", tr: "tarifeler", id: "jadwal", vi: "lịch trình" }, ex: ["The train ", { target: leaves }, " at six."] }
