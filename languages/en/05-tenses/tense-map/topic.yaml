          - { level: A2, marker: "when I was a child, years ago", tense: { link: Used to, to: en.tenses.used-to }, ex: ["I ", { target: used to }, " swim ", { signal: when I was a child }, "."], tr: { uk: "У дитинстві я плавав.", es: "Cuando era niño, nadaba.", pt: "Quando eu era criança, eu nadava.", fr: "Quand j’étais enfant, je nageais.", de: "Als ich ein Kind war, bin ich geschwommen.", it: "Quando ero bambino, nuotavo.", pl: "W dzieciństwie pływałem.", tr: "Çocukken yüzerdim.", id: "Waktu kecil, saya dulu berenang.", vi: "Khi còn nhỏ, tôi hay bơi." } }
