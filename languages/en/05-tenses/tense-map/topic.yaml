  - title: { en: Tenses in one story }
    role: own
    features: { tense: pst }
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense } }
          - { key: job, label: { en: Job in the story } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, tense: { en: { link: Past simple, to: en.tenses.simple-tenses } }, job: { en: "the events, one after another" }, ex: ["She ", { target: opened }, " the door and ", { target: walked }, " in."] }
          - { level: B2, tense: { en: { link: Past continuous, to: en.tenses.continuous-tenses } }, job: { en: the background }, ex: ["It ", { target: was raining }, "."] }
          - { level: B2, tense: { en: { link: Past perfect, to: en.tenses.perfect-tenses } }, job: { en: what happened earlier }, ex: ["She ", { target: had forgotten }, " her umbrella."] }
          - { level: B2, tense: { en: { link: Past perfect continuous, to: en.tenses.perfect-tenses } }, job: { en: "the cause, or the length of time before" }, ex: ["She ", { target: had been walking }, " for an hour."] }
      - type: list
        items:
          - type: example
            level: B2
            ex: ["It ", { target: was raining }, " when she ", { target: arrived }, ". She ", { target: had been walking }, " for an hour and ", { target: had forgotten }, " her umbrella."]
