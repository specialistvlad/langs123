title: { en: Tense map, uk: Карта часів, es: Mapa de los tiempos, pt: "Mapa dos tempos verbais", fr: "Carte des temps", de: "Übersicht der Zeitformen", it: "Mappa dei tempi verbali", pl: "Mapa czasów", tr: "Zaman haritası", id: "Peta tenses", vi: "Sơ đồ các thì" }
summary:
  lead:
    en: "Every tense on one page, placed by time and aspect, with form, main use, example and time words."
    uk: "Усі часи на одній сторінці, розподілені за часом і видом, з формою, головним вживанням, прикладом і словами-маркерами."
    es: "Todos los tiempos en una página, ubicados por tiempo y aspecto, con forma, uso principal, ejemplo y palabras clave."
    pt: "Todos os tempos verbais em uma página, dispostos por momento e aspecto, com forma, uso principal, exemplo e palavras indicadoras."
    fr: "Tous les temps sur une page, classés par moment et par aspect, avec leur forme, leur emploi principal, un exemple et des mots-clés."
    de: "Alle Zeitformen auf einer Seite, nach Zeit und Aspekt geordnet, mit Form, Hauptgebrauch, Beispiel und Signalwörtern."
    it: "Tutti i tempi verbali in una pagina, collocati per tempo e aspetto, con forma, uso principale, esempio e parole spia."
    pl: "Wszystkie czasy na jednej stronie, ułożone według czasu i aspektu, z formą, głównym użyciem, przykładem i słowami sygnalnymi."
    tr: "Tüm zamanlar tek sayfada; zamana ve görünüşe göre yerleştirilmiş, biçim, başlıca kullanım, örnek ve anahtar sözcüklerle birlikte."
    id: "Semua tense dalam satu halaman, ditempatkan menurut waktu dan aspek, dengan bentuk, penggunaan utama, contoh, dan kata penanda."
    vi: "Mọi thì trên một trang, xếp theo thời gian và thể, kèm dạng, cách dùng chính, ví dụ và dấu hiệu nhận biết."
  rule:
    en: ["Time words and meaning choose the tense: ", { term: yesterday }, " takes the past simple (", { term: I }, " ", { target: played }, "), ", { term: now }, " takes the present continuous (", { term: I }, " ", { target: am playing }, ")."]
    uk: ["Слова-маркери й значення визначають час: ", { term: yesterday }, " вимагає Past Simple (", { term: I }, " ", { target: played }, "), ", { term: now }, " — Present Continuous (", { term: I }, " ", { target: am playing }, ")."]
    es: ["Las palabras clave y el significado eligen el tiempo: ", { term: yesterday }, " pide el pasado simple (", { term: I }, " ", { target: played }, "), ", { term: now }, " pide el presente continuo (", { term: I }, " ", { target: am playing }, ")."]
    pt: ["As palavras indicadoras e o significado escolhem o tempo verbal: ", { term: "yesterday" }, " pede o passado simples (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " pede o presente contínuo (", { term: "I" }, " ", { target: "am playing" }, ")."]
    fr: ["Les mots-clés et le sens déterminent le temps : ", { term: "yesterday" }, " appelle le prétérit simple (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " appelle le présent continu (", { term: "I" }, " ", { target: "am playing" }, ")."]
    de: ["Signalwörter und Bedeutung bestimmen die Zeitform: ", { term: "yesterday" }, " verlangt das Simple Past (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " verlangt das Present Continuous (", { term: "I" }, " ", { target: "am playing" }, ")."]
    it: ["Le parole spia e il significato scelgono il tempo verbale: ", { term: "yesterday" }, " richiede il past simple (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " richiede il present continuous (", { term: "I" }, " ", { target: "am playing" }, ")."]
    pl: ["Słowa sygnalne i znaczenie wyznaczają czas: ", { term: "yesterday" }, " wymaga Past Simple (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " — Present Continuous (", { term: "I" }, " ", { target: "am playing" }, ")."]
    tr: ["Anahtar sözcükler ve anlam zamanı belirler: ", { term: "yesterday" }, " ile Simple Past (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " ile Present Continuous (", { term: "I" }, " ", { target: "am playing" }, ") kullanılır."]
    id: ["Kata penanda dan makna menentukan tense: ", { term: "yesterday" }, " memakai simple past (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " memakai present continuous (", { term: "I" }, " ", { target: "am playing" }, ")."]
    vi: ["Từ chỉ thời gian và nghĩa quyết định thì: ", { term: "yesterday" }, " đi với quá khứ đơn (", { term: "I" }, " ", { target: "played" }, "), ", { term: "now" }, " đi với hiện tại tiếp diễn (", { term: "I" }, " ", { target: "am playing" }, ")."]

