          - { level: B2, marker: "all day, lately, how long", tense: { en: { link: Present perfect continuous, to: en.tenses.perfect-tenses }, uk: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, es: { link: "Presente perfecto continuo", to: "en.tenses.perfect-tenses" }, pt: { link: "Presente perfeito contínuo", to: "en.tenses.perfect-tenses" }, fr: { link: "Present perfect continuous", to: "en.tenses.perfect-tenses" }, de: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, it: { link: "Present perfect continuous", to: "en.tenses.perfect-tenses" }, pl: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, tr: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, id: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, vi: { link: "Hiện tại hoàn thành tiếp diễn", to: "en.tenses.perfect-tenses" } }, ex: ["I've been working ", { signal: all day }, "."], tr: { uk: "Я працюю весь день.", es: "Llevo todo el día trabajando.", pt: "Estou trabalhando o dia todo.", fr: "Je travaille toute la journée.", de: "Ich arbeite schon den ganzen Tag.", it: "Lavoro tutto il giorno.", pl: "Pracuję cały dzień.", tr: "Bütün gündür çalışıyorum.", id: "Saya sudah bekerja seharian.", vi: "Tôi làm việc cả ngày rồi." } }
          - { level: B2, marker: "since, for the last two years", tense: { en: { link: Present perfect continuous, to: en.tenses.perfect-tenses }, uk: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, es: { link: "Presente perfecto continuo", to: "en.tenses.perfect-tenses" }, pt: { link: "Presente perfeito contínuo", to: "en.tenses.perfect-tenses" }, fr: { link: "Present perfect continuous", to: "en.tenses.perfect-tenses" }, de: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, it: { link: "Present perfect continuous", to: "en.tenses.perfect-tenses" }, pl: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, tr: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, id: { link: "Present Perfect Continuous", to: "en.tenses.perfect-tenses" }, vi: { link: "Hiện tại hoàn thành tiếp diễn", to: "en.tenses.perfect-tenses" } }, ex: ["She's been learning Greek ", { signal: for the last two years }, "."], tr: { uk: "Вона вчить грецьку мову останні два роки.", es: "Lleva los últimos dos años aprendiendo griego.", pt: "Ela está aprendendo grego há dois anos.", fr: "Elle apprend le grec depuis deux ans.", de: "Sie lernt seit zwei Jahren Griechisch.", it: "Studia greco da due anni.", pl: "Uczy się greckiego od dwóch lat.", tr: "Son iki yıldır Yunanca öğreniyor.", id: "Dia sudah belajar bahasa Yunani selama dua tahun terakhir.", vi: "Cô ấy học tiếng Hy Lạp trong hai năm qua." } }
          - { level: B2, marker: "by Friday, by then, in two weeks' time", tense: { en: { link: Future perfect, to: en.tenses.perfect-tenses }, uk: { link: "Future Perfect", to: "en.tenses.perfect-tenses" }, es: { link: "Futuro perfecto", to: "en.tenses.perfect-tenses" }, pt: { link: "Futuro perfeito", to: "en.tenses.perfect-tenses" }, fr: { link: "Future perfect", to: "en.tenses.perfect-tenses" }, de: { link: "Future Perfect", to: "en.tenses.perfect-tenses" }, it: { link: "Future perfect", to: "en.tenses.perfect-tenses" }, pl: { link: "Future Perfect", to: "en.tenses.perfect-tenses" }, tr: { link: "Future Perfect", to: "en.tenses.perfect-tenses" }, id: { link: "Future Perfect", to: "en.tenses.perfect-tenses" }, vi: { link: "Tương lai hoàn thành", to: "en.tenses.perfect-tenses" } }, ex: [{ signal: By then }, " I'll have finished."], tr: { uk: "До того часу я закінчу.", es: "Para entonces habré terminado.", pt: "Até lá eu já terei terminado.", fr: "D’ici là, j’aurai terminé.", de: "Bis dahin bin ich fertig.", it: "Per allora avrò finito.", pl: "Do tego czasu skończę.", tr: "O zamana kadar bitirmiş olacağım.", id: "Pada saat itu saya sudah selesai.", vi: "Đến lúc đó tôi sẽ làm xong." } }
          - { level: C1, marker: "by the end of the year, by next summer", tense: { en: { link: Future perfect continuous, to: en.tenses.perfect-tenses }, uk: { link: "Future Perfect Continuous", to: "en.tenses.perfect-tenses" }, es: { link: "Futuro perfecto continuo", to: "en.tenses.perfect-tenses" }, pt: { link: "Futuro perfeito contínuo", to: "en.tenses.perfect-tenses" }, fr: { link: "Future perfect continuous", to: "en.tenses.perfect-tenses" }, de: { link: "Future Perfect Continuous", to: "en.tenses.perfect-tenses" }, it: { link: "Future perfect continuous", to: "en.tenses.perfect-tenses" }, pl: { link: "Future Perfect Continuous", to: "en.tenses.perfect-tenses" }, tr: { link: "Future Perfect Continuous", to: "en.tenses.perfect-tenses" }, id: { link: "Future Perfect Continuous", to: "en.tenses.perfect-tenses" }, vi: { link: "Tương lai hoàn thành tiếp diễn", to: "en.tenses.perfect-tenses" } }, ex: [{ signal: By the end of the year }, " I'll have been working here for a decade."], tr: { uk: "До кінця року я працюватиму тут уже десять років.", es: "Para fin de año llevaré diez años trabajando aquí.", pt: "Até o fim do ano, eu já estarei trabalhando aqui há dez anos.", fr: "D’ici la fin de l’année, cela fera dix ans que je travaille ici.", de: "Bis zum Jahresende arbeite ich seit zehn Jahren hier.", it: "Entro la fine dell'anno lavorerò qui da dieci anni.", pl: "Do końca roku będę tu pracować od dziesięciu lat.", tr: "Yıl sonuna kadar burada on yıldır çalışıyor olacağım.", id: "Pada akhir tahun ini saya sudah bekerja di sini selama sepuluh tahun.", vi: "Đến cuối năm, tôi sẽ làm việc ở đây được mười năm." } }
          - { level: C1, marker: "so, suddenly, and then", tense: { en: { link: Present continuous in a story, to: en.tenses.continuous-tenses }, uk: { link: "Present Continuous в розповіді", to: "en.tenses.continuous-tenses" }, es: { link: "Presente continuo en un relato", to: "en.tenses.continuous-tenses" }, pt: { link: "Presente contínuo em uma história", to: "en.tenses.continuous-tenses" }, fr: { link: "Présent continu dans un récit", to: "en.tenses.continuous-tenses" }, de: { link: "Present Continuous in einer Erzählung", to: "en.tenses.continuous-tenses" }, it: { link: "Present continuous in un racconto", to: "en.tenses.continuous-tenses" }, pl: { link: "Present Continuous w opowieści", to: "en.tenses.continuous-tenses" }, tr: { link: "Hikâyede Present Continuous", to: "en.tenses.continuous-tenses" }, id: { link: "Present Continuous dalam cerita", to: "en.tenses.continuous-tenses" }, vi: { link: "Hiện tại tiếp diễn trong câu chuyện", to: "en.tenses.continuous-tenses" } }, ex: [{ signal: So }, " I'm walking home and I see Tom."], tr: { uk: "Отже, іду я додому й бачу Тома.", es: "Así que voy caminando a casa y veo a Tom.", pt: "Aí eu estou voltando a pé para casa e vejo o Tom.", fr: "Alors je rentre à pied et je vois Tom.", de: "Also gehe ich nach Hause und sehe Tom.", it: "Allora sto tornando a casa a piedi e vedo Tom.", pl: "No więc idę do domu i widzę Toma.", tr: "Eve yürüyorum, bir bakıyorum karşımda Tom.", id: "Jadi saya sedang berjalan pulang dan saya melihat Tom.", vi: "Thế là tôi đang đi bộ về nhà thì thấy Tom." } }
