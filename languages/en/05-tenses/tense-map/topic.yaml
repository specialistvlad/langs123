sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Read the table by time: past on the left, now in the middle, future on the right."
              uk: "Таблицю читають за часом: минуле ліворуч, теперішнє посередині, майбутнє праворуч."
              es: "La tabla se lee por tiempo: pasado a la izquierda, presente en el centro y futuro a la derecha."
              pt: "A tabela se lê por momento: passado à esquerda, presente no centro e futuro à direita."
              fr: "Le tableau se lit par moment : le passé à gauche, le présent au milieu, le futur à droite."
              de: "Die Tabelle wird nach der Zeit gelesen: Vergangenheit links, Gegenwart in der Mitte, Zukunft rechts."
              it: "La tabella si legge per tempo: passato a sinistra, presente al centro, futuro a destra."
              pl: "Tabelę czyta się według czasu: przeszłość po lewej, teraźniejszość pośrodku, przyszłość po prawej."
              tr: "Tablo zamana göre okunur: solda geçmiş, ortada şimdi, sağda gelecek."
              id: "Tabel dibaca menurut waktu: past di kiri, present di tengah, future di kanan."
              vi: "Đọc bảng theo thời gian: quá khứ bên trái, hiện tại ở giữa, tương lai bên phải."
          - type: rule
            level: A1
            text:
              en: Simple = the fact or event. In progress = while it happens. Perfect = before another moment.
              uk: "Simple = факт або подія. Continuous = поки дія триває. Perfect = до іншого моменту."
              es: "Simple = el hecho o el suceso. Continuo = mientras ocurre. Perfecto = antes de otro momento."
              pt: "Simples = o fato ou o acontecimento. Contínuo = enquanto acontece. Perfeito = antes de outro momento."
              fr: "Simple = le fait ou l’événement. Continu = pendant qu’il se produit. Perfect = avant un autre moment."
              de: "Simple = die Tatsache oder das Ereignis. Continuous = während es geschieht. Perfect = vor einem anderen Zeitpunkt."
              it: "Simple = il fatto o l'evento. Continuous = mentre accade. Perfect = prima di un altro momento."
              pl: "Simple = fakt lub zdarzenie. Continuous = w trakcie trwania czynności. Perfect = przed innym momentem."
              tr: "Simple = olgu veya olay. Continuous = olay sürerken. Perfect = başka bir andan önce."
              id: "Simple = fakta atau peristiwa. Continuous = selama kejadian berlangsung. Perfect = sebelum saat yang lain."
              vi: "Đơn = sự việc hoặc sự kiện. Tiếp diễn = trong khi sự việc đang diễn ra. Hoàn thành = trước một thời điểm khác."

  - title: { en: Present, uk: "Теперішній час", es: "Presente", pt: "Presente", fr: "Présent", de: "Gegenwart", it: "Presente", pl: "Teraźniejszy", tr: "Şimdiki zaman", id: "Present", vi: "Hiện tại" }
