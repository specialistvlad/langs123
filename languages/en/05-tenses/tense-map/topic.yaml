          - { level: A1, tense: { en: [{ link: Present continuous, to: en.tenses.continuous-tenses }, ": now, temporary situations"], uk: [{ link: "Present Continuous", to: en.tenses.continuous-tenses }, ": зараз, тимчасові ситуації"], es: [{ link: "Presente continuo", to: en.tenses.continuous-tenses }, ": ahora, situaciones temporales"], pt: [{ link: "Presente contínuo", to: "en.tenses.continuous-tenses" }, ": agora, situações temporárias"], fr: [{ link: "Présent continu", to: "en.tenses.continuous-tenses" }, " : maintenant, situations temporaires"], de: [{ link: "Present Continuous", to: "en.tenses.continuous-tenses" }, ": jetzt, vorübergehende Situationen"], it: [{ link: "Present continuous", to: "en.tenses.continuous-tenses" }, ": adesso, situazioni temporanee"], pl: [{ link: "Present Continuous", to: "en.tenses.continuous-tenses" }, ": teraz, sytuacje tymczasowe"], tr: [{ link: "Present Continuous", to: "en.tenses.continuous-tenses" }, ": şu an, geçici durumlar"], id: [{ link: "Present Continuous", to: "en.tenses.continuous-tenses" }, ": sekarang, situasi sementara"], vi: [{ link: "Hiện tại tiếp diễn", to: "en.tenses.continuous-tenses" }, ": ngay lúc này, tình huống tạm thời"] }, form: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ing }] }, ex: [I, { target: "'m working" }, " now."], tr: { uk: "Я зараз працюю.", es: "Ahora estoy trabajando.", pt: "Agora eu estou trabalhando.", fr: "Je suis en train de travailler maintenant.", de: "Ich arbeite gerade.", it: "Adesso sto lavorando.", pl: "Teraz pracuję.", tr: "Şu an çalışıyorum.", id: "Sekarang saya sedang bekerja.", vi: "Bây giờ tôi đang làm việc." } }
          - { level: A2, tense: { en: [{ link: Present perfect, to: en.tenses.perfect-tenses }, ": past events that matter now"], uk: [{ link: "Present Perfect", to: en.tenses.perfect-tenses }, ": минулі події, важливі зараз"], es: [{ link: "Presente perfecto", to: en.tenses.perfect-tenses }, ": hechos pasados que importan ahora"], pt: [{ link: "Presente perfeito", to: "en.tenses.perfect-tenses" }, ": fatos passados que importam agora"], fr: [{ link: "Present perfect", to: "en.tenses.perfect-tenses" }, " : événements passés qui comptent maintenant"], de: [{ link: "Present Perfect", to: "en.tenses.perfect-tenses" }, ": vergangene Ereignisse, die jetzt wichtig sind"], it: [{ link: "Present perfect", to: "en.tenses.perfect-tenses" }, ": azioni passate rilevanti per il presente"], pl: [{ link: "Present Perfect", to: "en.tenses.perfect-tenses" }, ": przeszłe zdarzenia ważne teraz"], tr: [{ link: "Present Perfect", to: "en.tenses.perfect-tenses" }, ": şimdiyle ilgili geçmiş olaylar"], id: [{ link: "Present Perfect", to: "en.tenses.perfect-tenses" }, ": peristiwa lampau yang penting sekarang"], vi: [{ link: "Hiện tại hoàn thành", to: "en.tenses.perfect-tenses" }, ": sự việc trong quá khứ còn liên quan đến hiện tại"] }, form: { pattern: [{ alternatives: [have, has] }, { slot: V-ed }] }, ex: [I, { target: "'ve lost" }, " my keys."], tr: { uk: "Я загубив ключі.", es: "He perdido las llaves.", pt: "Eu perdi minhas chaves.", fr: "J’ai perdu mes clés.", de: "Ich habe meine Schlüssel verloren.", it: "Ho perso le chiavi.", pl: "Zgubiłem klucze.", tr: "Anahtarlarımı kaybettim.", id: "Saya sudah kehilangan kunci saya.", vi: "Tôi vừa làm mất chìa khóa." } }
          - { level: B2, tense: { en: [{ link: Present perfect continuous, to: en.tenses.perfect-tenses }, ": an activity up to now"] }, form: { pattern: [{ alternatives: [have, has] }, been, { slot: V-ing }] }, ex: ["I", { target: "'ve been working" }, " since nine."] }
