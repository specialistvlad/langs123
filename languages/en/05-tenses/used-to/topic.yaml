          - { level: B2, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative }, structure: { pattern: [{ alternatives: [am, is, are, was, were] }, used to, { slot: -ing }] }, ex: ["She", { target: "'s used to" }, " working at night."] }
          - { level: B2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, structure: { pattern: [{ alternatives: ["am not", "isn't", "aren't", "wasn't", "weren't"] }, used to, { slot: -ing }] }, ex: ["I", { target: "'m not used to" }, " the cold."] }
