    content:
      - type: usage
        columns:
          - { key: subject, label: { en: Subject, uk: "Підмет", es: "Sujeto" } }
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, subject: { en: all subjects, uk: "усі підмети", es: "todos los sujetos" }, form: { pattern: [used to, { slot: V }] }, ex: ["She ", { target: used to live }, " in Rome."], tr: { uk: "Раніше вона жила в Римі.", es: "Antes vivía en Roma." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The form is the same for every subject:"
              uk: "Форма однакова для всіх підметів:"
              es: "La forma es la misma para todos los sujetos:"
            ex: [{ alternatives: [I, he, they] }, " ", { target: used to }, " live here."]
            tr: { uk: { examples: ["Раніше я жив тут.", "Раніше він жив тут.", "Раніше вони жили тут."] }, es: { examples: ["Antes yo vivía aquí.", "Antes él vivía aquí.", "Antes ellos vivían aquí."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: used to }, " is followed by the base verb: ", { term: used to play }, "."]
              uk: [{ term: used to }, " вживається з початковою формою дієслова: ", { term: used to play }, "."]
              es: [{ term: used to }, " va seguido de la forma base del verbo: ", { term: used to play }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: used to }, " exists only in the past."]
              uk: [{ term: used to }, " існує тільки в минулому часі."]
              es: [{ term: used to }, " existe solo en pasado."]

