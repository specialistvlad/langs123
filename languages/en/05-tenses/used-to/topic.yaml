        - { level: A2, point: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, rule: { en: "a single event, or a stated time or number", uk: "одна подія, або названий час чи кількість разів", es: "un hecho único, o un tiempo o número de veces indicado" }, ex: ["I ", { target: lived }, " in Paris for two years."], tr: { uk: "Я жив у Парижі два роки.", es: "Viví en París durante dos años." } }
