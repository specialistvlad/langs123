            text:
              en: [{ term: always }, ", ", { term: often }, " and ", { term: never }, " go before ", { term: used to }, ":"]
              uk: [{ term: always }, ", ", { term: often }, " і ", { term: never }, " стоять перед ", { term: used to }, ":"]
              es: [{ term: always }, ", ", { term: often }, " y ", { term: never }, " van antes de ", { term: used to }, ":"]
            ex: ["He ", { target: always }, " used to be late."]
            tr: { uk: "Він завжди запізнювався.", es: "Siempre llegaba tarde." }

  - title: { en: "Compare: used to vs past simple", uk: "Порівняння: used to і Past Simple", es: "Comparación: used to y pasado simple" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: used, label: Used to, features: { aspect: hab, tense: pst } }
          - { key: simple, label: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, features: { tense: pst } }
        rows:
          - { level: A2, used: { en: "past habits and states, over now", uk: "минулі звички й стани, яких уже немає", es: "hábitos y estados del pasado que ya terminaron" }, simple: { en: "finished actions, stated time or number", uk: "завершені дії, названий час або кількість разів", es: "acciones terminadas, con tiempo o número de veces indicado" } }
          - { level: A2, used: { ex: ["I ", { target: used to live }, " in Paris."], tr: { uk: "Раніше я жив у Парижі.", es: "Antes vivía en París." } }, simple: { ex: ["I ", { target: lived }, " in Paris for two years."], tr: { uk: "Я жив у Парижі два роки.", es: "Viví en París durante dos años." } } }
          - { level: A2, used: { ex: ["We ", { target: used to eat }, " out on ", { weekday: Fridays, value: 5 }, "."], tr: { uk: "Раніше ми ходили в ресторан по п’ятницях.", es: "Antes comíamos fuera los viernes." } }, simple: { ex: ["We ", { target: ate }, " out last ", { weekday: Friday, value: 5 }, "."], tr: { uk: "Минулої п’ятниці ми ходили в ресторан.", es: "El viernes pasado comimos fuera." } } }
          - { level: A2, used: { ex: [{ target: Did }, " you ", { target: use to }, " have a dog?"], tr: { uk: "У тебе раніше був собака?", es: "¿Antes tenías un perro?" } }, simple: { ex: [{ target: Did }, " you ", { target: have }, " a dog last year?"], tr: { uk: "У тебе торік був собака?", es: "¿Tenías un perro el año pasado?" } } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A single event takes the past simple:"
              uk: "Одноразова подія вживається в Past Simple:"
              es: "Un hecho único va en pasado simple:"
            ex: ["I ", { target: visited }, " Rome in ", { date: May, value: "--05" }, "."]
            tr: { uk: "Я відвідав Рим у травні.", es: "Visité Roma en mayo." }
          - type: rule
            level: A2
            text:
              en: "A habit with a time expression takes either form:"
              uk: "Звичка з позначенням часу допускає обидві форми:"
              es: "Un hábito con una expresión de tiempo admite las dos formas:"
            ex: ["I ", { target: played }, " football every ", { weekday: Saturday, value: 6 }, "."]
            tr: { uk: "Я грав у футбол щосуботи.", es: "Jugaba al fútbol todos los sábados." }
          - type: note
            level: A2
            text:
              en: ["See ", { link: Past simple, to: en.tenses.simple-tenses }, "."]
              uk: ["Див. ", { link: "Past Simple", to: en.tenses.simple-tenses }, "."]
              es: ["Ver ", { link: "Pasado simple", to: en.tenses.simple-tenses }, "."]

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: I use to play football., right: ["I ", { target: used to }, " play football."], rule: { en: { takes: [affirmative, [{ term: used to }, ", with -d"]] }, uk: { takes: ["ствердження", [{ term: used to }, ", з -d"]] }, es: { takes: ["afirmación", [{ term: used to }, ", con -d"]] } } }
          - { level: A2, wrong: Did you used to play?, right: ["Did you ", { target: use to }, " play?"], rule: { en: { takes: [["after ", { term: did }], { term: use to }] }, uk: { takes: [["після ", { term: did }], { term: use to }] }, es: { takes: [["después de ", { term: did }], { term: use to }] } } }
          - { level: A2, wrong: I didn't used to like it., right: ["I didn't ", { target: use to }, " like it."], rule: { en: { takes: [["after ", { term: didn't }], { term: use to }] }, uk: { takes: [["після ", { term: didn't }], { term: use to }] }, es: { takes: [["después de ", { term: didn't }], { term: use to }] } } }
          - { level: A2, wrong: I used to playing football., right: ["I used to ", { target: play }, " football."], rule: { en: { pattern: [{ term: used to }, { slot: base verb }] }, uk: { pattern: [{ term: used to }, { slot: base verb }] }, es: { pattern: [{ term: used to }, { slot: base verb }] } } }
          - { level: A2, speakers: [es], wrong: I was used to play football when I was a child., right: ["I ", { target: used to play }, " football when I was a child."], rule: { es: ["un hábito del pasado se dice ", { term: used to }, " y el verbo base; ", { term: be used to }, " significa «estar acostumbrado a»"] } }
