          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: ipa, label: { en: IPA, uk: "МФА", es: "AFI" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, form: used to, ipa: { ipa: ˈjuːst tə }, ex: ["I ", { target: used to }, " swim."], tr: { uk: "Раніше я плавав.", es: "Antes nadaba." } }
          - { level: A2, form: use to, ipa: { ipa: juːs tə }, ex: ["Did you ", { target: use to }, " swim?"], tr: { uk: "Ти раніше плавав?", es: "¿Antes nadabas?" } }
      - type: list
        items:
          - type: rule
