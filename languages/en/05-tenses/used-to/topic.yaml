        - { level: A2, point: { en: Sound, uk: "Звук", es: "Sonido" }, rule: { en: ["the ", { letter: d }, " is silent: ", { term: used to }, " sounds like ", { sound: use-ta }], uk: ["літера ", { letter: d }, " німа: ", { term: used to }, " звучить як ", { sound: use-ta }], es: ["la letra ", { letter: d }, " es muda: ", { term: used to }, " suena como ", { sound: use-ta }] }, ex: ["I ", { target: used to }, " swim."], tr: { uk: "Раніше я плавав.", es: "Antes nadaba." } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: ["the affirmative keeps the ", { letter: d }, ": ", { term: used to }], uk: ["у ствердженні ", { letter: d }, " зберігається: ", { term: used to }], es: ["la afirmación conserva la ", { letter: d }, ": ", { term: used to }] }, ex: ["I ", { target: used to }, " play football."], tr: { uk: "Раніше я грав у футбол.", es: "Antes jugaba al fútbol." } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: ["after ", { term: did }, " and ", { term: didn't }, " the ", { letter: d }, " goes: ", { term: use to }], uk: ["після ", { term: did }, " і ", { term: didn't }, " ", { letter: d }, " зникає: ", { term: use to }], es: ["después de ", { term: did }, " y ", { term: didn't }, " la ", { letter: d }, " desaparece: ", { term: use to }] }, ex: ["I didn't ", { target: use to }, " like it."], tr: { uk: "Раніше мені це не подобалося.", es: "Antes no me gustaba." } }

sections:
  - title: { en: "Form: affirmative", uk: "Форма: ствердження", es: "Forma: afirmativa" }
