          - { level: A2, use: { en: Past states, uk: "Минулі стани", es: "Estados del pasado", pt: "Estados do passado", fr: "États passés", de: "Vergangene Zustände", it: "Stati nel passato", pl: "Stany w przeszłości", tr: "Geçmişteki durumlar", id: "Keadaan di masa lalu", vi: "Trạng thái trong quá khứ" }, ex: ["We ", { target: used to have }, " a dog."], tr: { uk: "Раніше в нас був собака.", es: "Antes teníamos un perro.", pt: "Antes nós tínhamos um cachorro.", fr: "Avant, nous avions un chien.", de: "Wir hatten früher einen Hund.", it: "Prima avevamo un cane.", pl: "Kiedyś mieliśmy psa.", tr: "Eskiden bir köpeğimiz vardı.", id: "Dulu kami punya anjing.", vi: "Trước đây chúng tôi có một con chó." } }
          - { level: A2, use: { en: Past situations that changed, uk: "Минулі ситуації, які змінилися", es: "Situaciones del pasado que cambiaron", pt: "Situações do passado que mudaram", fr: "Situations passées qui ont changé", de: "Vergangene Situationen, die sich geändert haben", it: "Situazioni del passato che sono cambiate", pl: "Dawne sytuacje, które się zmieniły", tr: "Değişen geçmiş durumlar", id: "Situasi di masa lalu yang berubah", vi: "Tình huống trong quá khứ đã thay đổi" }, ex: ["There ", { target: used to be }, " a cinema here."], tr: { uk: "Колись тут був кінотеатр.", es: "Antes había un cine aquí.", pt: "Antes havia um cinema aqui.", fr: "Avant, il y avait un cinéma ici.", de: "Hier gab es früher ein Kino.", it: "Prima qui c'era un cinema.", pl: "Kiedyś było tu kino.", tr: "Burada eskiden bir sinema vardı.", id: "Dulu ada bioskop di sini.", vi: "Trước đây ở đây có một rạp chiếu phim." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: The habit or state is over now. The speaker compares past and present.
              uk: "Звичка чи стан тепер закінчилися. Мовець порівнює минуле й теперішнє."
              es: "El hábito o el estado ya terminó. El hablante compara el pasado con el presente."
              pt: "O hábito ou o estado já terminou. Quem fala compara o passado com o presente."
              fr: "L’habitude ou l’état n’existe plus. Le locuteur compare le passé et le présent."
              de: "Die Gewohnheit oder der Zustand ist jetzt vorbei. Der Sprecher vergleicht Vergangenheit und Gegenwart."
              it: "L'abitudine o lo stato è finito. Chi parla confronta il passato con il presente."
              pl: "Zwyczaj lub stan już się skończył. Mówiący porównuje przeszłość z teraźniejszością."
              tr: "Alışkanlık veya durum artık sona ermiştir. Konuşan geçmişi şimdiyle karşılaştırır."
              id: "Kebiasaan atau keadaan itu kini sudah berakhir. Penutur membandingkan masa lalu dengan masa kini."
              vi: "Thói quen hoặc trạng thái ấy đã chấm dứt. Người nói đối chiếu quá khứ với hiện tại."

