          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, subject: { en: all subjects, uk: "усі підмети", es: "todos los sujetos" }, form: { pattern: [didn't use to, { slot: V }] }, ex: ["We ", { target: didn't use to have }, " a car."], tr: { uk: "Раніше в нас не було машини.", es: "Antes no teníamos auto." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["After ", { term: didn't }, " the form is ", { term: use to }, ", with no -d."]
              uk: ["Після ", { term: didn't }, " форма має вигляд ", { term: use to }, ", без -d."]
              es: ["Después de ", { term: didn't }, " la forma es ", { term: use to }, ", sin -d."]
          - type: rule
            level: A2
            text:
              en: [{ term: never }, " also makes a negative:"]
              uk: [{ term: never }, " теж утворює заперечення:"]
              es: [{ term: never }, " también forma una oración negativa:"]
            ex: ["I ", { target: never used to }, " like fish."]
            tr: { uk: "Раніше я ніколи не любив рибу.", es: "Antes nunca me gustaba el pescado." }

  - title: { en: "Form: questions", uk: "Форма: питання", es: "Forma: preguntas" }
    role: form
    content:
