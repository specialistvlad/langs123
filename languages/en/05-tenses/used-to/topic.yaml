          - { level: A2, aux: { pattern: [Did, { slot: subject }] }, verb: { pattern: [use to, { slot: V }] }, ex: [{ target: Did }, " you ", { target: use to walk }, " to school?"], tr: { uk: "Ти ходив до школи пішки?", es: "¿Ibas a la escuela caminando?" } }
          - { level: A2, aux: { pattern: [{ slot: wh-word }, did, { slot: subject }] }, verb: { pattern: [use to, { slot: V }] }, ex: ["Where ", { target: did }, " you ", { target: use to live }, "?"], tr: { uk: "Де ти жив раніше?", es: "¿Dónde vivías antes?" } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["After ", { term: Did }, " the form is ", { term: use to }, ", with no -d."]
              uk: ["Після ", { term: Did }, " форма має вигляд ", { term: use to }, ", без -d."]
              es: ["Después de ", { term: Did }, " la forma es ", { term: use to }, ", sin -d."]
