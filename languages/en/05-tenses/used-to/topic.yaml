              uk: ["Літера ", { letter: d }, " у мовленні німа: ", { term: used to }, " звучить як ", { sound: use-ta }, "."]
              es: ["La letra ", { letter: d }, " es muda al hablar: ", { term: used to }, " suena como ", { sound: use-ta }, "."]

  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: Past habits, uk: "Минулі звички", es: "Hábitos del pasado" }, ex: ["I ", { target: used to walk }, " to school."], tr: { uk: "Раніше я ходив до школи пішки.", es: "Antes iba a la escuela caminando." } }
          - { level: A2, use: { en: Past states, uk: "Минулі стани", es: "Estados del pasado" }, ex: ["We ", { target: used to have }, " a dog."], tr: { uk: "Раніше в нас був собака.", es: "Antes teníamos un perro." } }
          - { level: A2, use: { en: Past situations that changed, uk: "Минулі ситуації, які змінилися", es: "Situaciones del pasado que cambiaron" }, ex: ["There ", { target: used to be }, " a cinema here."], tr: { uk: "Колись тут був кінотеатр.", es: "Antes había un cine aquí." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: The habit or state is over now. The speaker compares past and present.
              uk: "Звичка чи стан тепер закінчилися. Мовець порівнює минуле й теперішнє."
              es: "El hábito o el estado ya terminó. El hablante compara el pasado con el presente."

  - title: { en: Signal words, uk: "Слова-маркери", es: "Palabras clave" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: expression, label: { en: Expression, uk: "Вираз", es: "Expresión" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, expression: { alternatives: [when I was a child, young] }, ex: [{ signal: When I was a child }, ", I used to climb trees."], tr: { uk: "Коли я був дитиною, я лазив по деревах.", es: "Cuando era niño, trepaba a los árboles." } }
          - { level: A2, expression: in those days, ex: ["People used to write letters ", { signal: in those days }, "."], tr: { uk: "Тоді люди писали листи.", es: "En aquella época la gente escribía cartas." } }
          - { level: A2, expression: years ago, ex: ["I used to smoke ", { signal: years ago }, "."], tr: { uk: "Багато років тому я курив.", es: "Hace años fumaba." } }
