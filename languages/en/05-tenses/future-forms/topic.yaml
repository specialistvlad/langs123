          - { level: A2, use: { en: "present simple: timetables", uk: "Present Simple: розклади", es: "presente simple: horarios", pt: "presente simples: horários", fr: "présent simple : horaires", de: "Simple Present: Fahrpläne", it: "present simple: orari", pl: "Present Simple: rozkłady jazdy", tr: "Simple Present: tarifeler", id: "simple present: jadwal", vi: "hiện tại đơn: lịch trình" }, ex: ["The train ", { target: leaves }, " at ", { time: "6:15", value: "06:15" }, "."], tr: { uk: "Потяг відправляється о 6:15.", es: "El tren sale a las 6:15.", pt: "O trem sai às 6h15.", fr: "Le train part à 6 h 15.", de: "Der Zug fährt um 6:15 Uhr ab.", it: "Il treno parte alle 6:15.", pl: "Pociąg odjeżdża o 6:15.", tr: "Tren 6:15’te kalkıyor.", id: "Kereta berangkat pukul 6.15.", vi: "Tàu rời ga lúc 6:15." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: The present continuous needs a future time and a plan with a fixed person or place.
              uk: "Present Continuous потребує вказівки на майбутній час і плану з визначеною особою чи місцем."
              es: "El presente continuo necesita una referencia de futuro y un plan con una persona o un lugar concretos."
              pt: "O presente contínuo precisa de uma referência de futuro e de um plano com uma pessoa ou um lugar definidos."
              fr: "Le présent continu demande une indication de temps futur et un projet avec une personne ou un lieu précis."
              de: "Das Present Continuous braucht eine Zeitangabe für die Zukunft und einen Plan mit festen Personen oder einem festen Ort."
              it: "Il present continuous richiede un riferimento al futuro e un piano con una persona o un luogo precisi."
              pl: "Present Continuous wymaga określenia przyszłości oraz planu z konkretną osobą lub miejscem."
              tr: "Present Continuous için gelecekte bir zaman ve belirli bir kişi ya da yer içeren bir plan gerekir."
              id: "Present continuous membutuhkan keterangan waktu masa depan dan rencana yang melibatkan orang atau tempat tertentu."
              vi: "Hiện tại tiếp diễn cần có thời gian trong tương lai và một kế hoạch với người hoặc nơi cụ thể."
          - type: note
            level: A1
            text:
              en: ["See ", { link: Present continuous, to: en.tenses.continuous-tenses }, " and ", { link: Present simple, to: en.tenses.simple-tenses }, "."]
              uk: ["Див. ", { link: "Present Continuous", to: en.tenses.continuous-tenses }, " і ", { link: "Present Simple", to: en.tenses.simple-tenses }, "."]
              es: ["Ver ", { link: "Presente continuo", to: en.tenses.continuous-tenses }, " y ", { link: "Presente simple", to: en.tenses.simple-tenses }, "."]
              pt: ["Ver ", { link: "Presente contínuo", to: "en.tenses.continuous-tenses" }, " e ", { link: "Presente simples", to: "en.tenses.simple-tenses" }, "."]
              fr: ["Voir ", { link: "Présent continu", to: "en.tenses.continuous-tenses" }, " et ", { link: "Présent simple", to: "en.tenses.simple-tenses" }, "."]
              de: ["Siehe ", { link: "Present Continuous", to: "en.tenses.continuous-tenses" }, " und ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              it: ["Vedi ", { link: "Present continuous", to: "en.tenses.continuous-tenses" }, " e ", { link: "Present simple", to: "en.tenses.simple-tenses" }, "."]
              pl: ["Zob. ", { link: "Present Continuous", to: "en.tenses.continuous-tenses" }, " i ", { link: "Present Simple", to: "en.tenses.simple-tenses" }, "."]
              tr: ["Bkz. ", { link: "Present Continuous", to: "en.tenses.continuous-tenses" }, " ve ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              id: ["Lihat ", { link: "Present Continuous", to: "en.tenses.continuous-tenses" }, " dan ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              vi: ["Xem ", { link: "Hiện tại tiếp diễn", to: "en.tenses.continuous-tenses" }, " và ", { link: "Hiện tại đơn", to: "en.tenses.simple-tenses" }, "."]

  - title: { en: Signal words, uk: "Слова-маркери", es: "Palabras clave", pt: "Palavras indicadoras", fr: "Mots-clés", de: "Signalwörter", it: "Parole spia", pl: "Słowa sygnalne", tr: "Anahtar sözcükler", id: "Kata penanda", vi: "Dấu hiệu nhận biết" }
