      rows:
        - { level: A1, point: { pattern: [[{ alternatives: [am, is, are] }, " going to"], { slot: V }] }, rule: { en: "plans and intentions; predictions with evidence", uk: "плани й наміри; прогнози з опорою на факти", es: "planes e intenciones; predicciones con evidencia", pt: "planos e intenções; previsões com evidência", fr: "projets et intentions ; prédictions fondées sur des indices", de: "Pläne und Absichten; Vorhersagen aufgrund von Anzeichen", it: "piani e intenzioni; previsioni basate su prove", pl: "plany i zamiary; przewidywania oparte na dowodach", tr: "planlar ve niyetler; kanıta dayanan tahminler", id: "rencana dan niat; prediksi berdasarkan bukti", vi: "kế hoạch và ý định; dự đoán có căn cứ" }, ex: { examples: [[We, { target: "'re going to" }, " visit Granada."], [Look at those clouds. It, { target: "'s going to" }, " rain."]] }, tr: { uk: { examples: ["Ми збираємося відвідати Гранаду.", "Подивись на ті хмари. Буде дощ."] }, es: { examples: ["Vamos a visitar Granada.", "Mira esas nubes. Va a llover."] }, pt: { examples: ["Vamos visitar Granada.", "Olha aquelas nuvens. Vai chover."] }, fr: { examples: ["Nous allons visiter Grenade.", "Regarde ces nuages. Il va pleuvoir."] }, de: { examples: ["Wir werden Granada besuchen.", "Schau dir die Wolken an. Es wird regnen."] }, it: { examples: ["Visiteremo Granada.", "Guarda quelle nuvole. Sta per piovere."] }, pl: { examples: ["Zamierzamy odwiedzić Granadę.", "Spójrz na te chmury. Będzie padać."] }, tr: { examples: ["Granada’yı ziyaret edeceğiz.", "Şu bulutlara bak. Yağmur yağacak."] }, id: { examples: ["Kami akan mengunjungi Granada.", "Lihat awan-awan itu. Sebentar lagi akan hujan."] }, vi: { examples: ["Chúng tôi định đến thăm Granada.", "Nhìn những đám mây kia kìa. Trời sắp mưa rồi."] } } }
        - { level: A1, point: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ing }] }, rule: { en: "present continuous: a fixed arrangement, with a future time", uk: "Present Continuous: чітка домовленість із вказівкою на майбутній час", es: "presente continuo: un plan acordado, con una referencia de futuro", pt: "presente contínuo: um compromisso marcado, com uma referência de futuro", fr: "présent continu : un rendez-vous convenu, avec une indication de temps futur", de: "Present Continuous: feste Verabredung, mit einer Zeitangabe für die Zukunft", it: "present continuous: un impegno fissato, con un riferimento al futuro", pl: "Present Continuous: ustalony plan, z określeniem przyszłości", tr: "Present Continuous: kesinleşmiş düzenleme, gelecekteki bir zamanla", id: "present continuous: kesepakatan yang sudah pasti, dengan keterangan waktu masa depan", vi: "hiện tại tiếp diễn: sự sắp xếp đã định, kèm thời gian trong tương lai" }, ex: [I, { target: "'m seeing" }, " the dentist on ", { weekday: Friday, value: 5 }, "."], tr: { uk: "У п’ятницю я йду до стоматолога.", es: "El viernes voy al dentista.", pt: "Vou ao dentista na sexta.", fr: "Vendredi, je vais chez le dentiste.", de: "Am Freitag gehe ich zum Zahnarzt.", it: "Venerdì vado dal dentista.", pl: "W piątek idę do dentysty.", tr: "Cuma günü diş hekimine gidiyorum.", id: "Saya ke dokter gigi hari Jumat.", vi: "Tôi có hẹn với nha sĩ vào thứ Sáu." } }
        - { level: A2, point: { pattern: [{ alternatives: [will, "'ll", "won't"] }, { slot: V }] }, rule: { en: ["decisions now, offers, promises, opinions (", { term: I think }, ")"], uk: ["рішення в момент мовлення, пропозиції, обіцянки, думки (", { term: I think }, ")"], es: ["decisiones en el momento, ofrecimientos, promesas, opiniones (", { term: I think }, ")"], pt: ["decisões na hora, ofertas, promessas, opiniões (", { term: "I think" }, ")"], fr: ["décisions sur le moment, offres, promesses, opinions (", { term: "I think" }, ")"], de: ["Entscheidungen im Moment, Angebote, Versprechen, Meinungen (", { term: "I think" }, ")"], it: ["decisioni prese al momento, offerte, promesse, opinioni (", { term: "I think" }, ")"], pl: ["decyzje podejmowane w chwili mówienia, propozycje, obietnice, opinie (", { term: "I think" }, ")"], tr: ["o anda verilen kararlar, teklifler, sözler, görüşler (", { term: "I think" }, ")"], id: ["keputusan saat ini, tawaran, janji, pendapat (", { term: "I think" }, ")"], vi: ["quyết định ngay lúc nói, lời đề nghị, lời hứa, ý kiến (", { term: "I think" }, ")"] }, ex: { examples: [[It's cold. I, { target: "'ll close" }, " the window."], [I think she, { target: "'ll win" }, "."]] }, tr: { uk: { examples: ["Холодно. Я зачиню вікно.", "Думаю, вона виграє."] }, es: { examples: ["Hace frío. Cerraré la ventana.", "Creo que ganará."] }, pt: { examples: ["Está frio. Vou fechar a janela.", "Acho que ela vai ganhar."] }, fr: { examples: ["Il fait froid. Je vais fermer la fenêtre.", "Je pense qu’elle gagnera."] }, de: { examples: ["Es ist kalt. Ich mache das Fenster zu.", "Ich glaube, sie wird gewinnen."] }, it: { examples: ["Fa freddo. Chiudo la finestra.", "Penso che vincerà."] }, pl: { examples: ["Jest zimno. Zamknę okno.", "Myślę, że ona wygra."] }, tr: { examples: ["Hava soğuk. Pencereyi kapatayım.", "Bence o kazanacak."] }, id: { examples: ["Dingin. Saya akan menutup jendela.", "Saya rasa dia akan menang."] }, vi: { examples: ["Lạnh quá. Tôi sẽ đó