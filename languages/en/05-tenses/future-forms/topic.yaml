        - { level: B1, point: { en: Arrangement or intention, uk: "Домовленість або намір", es: "Plan acordado o intención", pt: "Compromisso marcado ou intenção", fr: "Rendez-vous convenu ou intention", de: "Verabredung oder Absicht", it: "Impegno fissato o intenzione", pl: "Ustalony plan lub zamiar", tr: "Düzenleme ya da niyet", id: "Kesepakatan atau niat", vi: "Sự sắp xếp hoặc ý định" }, rule: { en: ["fixed arrangement: present continuous; intention: ", { term: going to }], uk: ["чітка домовленість: Present Continuous; намір: ", { term: going to }], es: ["plan acordado: presente continuo; intención: ", { term: going to }], pt: ["compromisso marcado: presente contínuo; intenção: ", { term: "going to" }], fr: ["rendez-vous convenu : présent continu ; intention : ", { term: "going to" }], de: ["feste Verabredung: Present Continuous; Absicht: ", { term: "going to" }], it: ["impegno fissato: present continuous; intenzione: ", { term: "going to" }], pl: ["ustalony plan: Present Continuous; zamiar: ", { term: "going to" }], tr: ["kesinleşmiş düzenleme: Present Continuous; niyet: ", { term: "going to" }], id: ["kesepakatan yang sudah pasti: present continuous; niat: ", { term: "going to" }], vi: ["sự sắp xếp đã định: hiện tại tiếp diễn; ý định: ", { term: "going to" }] }, ex: { examples: [[I, { target: "'m meeting" }, " Sam at 8."], [I, { target: "'m going to" }, " learn Italian."]] }, tr: { uk: { examples: ["Я зустрічаюся із Семом о 8.", "Я збираюся вивчати італійську."] }, es: { examples: ["Me veo con Sam a las 8.", "Voy a aprender italiano."] }, pt: { examples: ["Vou me encontrar com o Sam às 8.", "Vou aprender italiano."] }, fr: { examples: ["Je retrouve Sam à 8 h.", "Je vais apprendre l’italien."] }, de: { examples: ["Ich treffe Sam um 8.", "Ich werde Italienisch lernen."] }, it: { examples: ["Incontro Sam alle 8.", "Ho intenzione di imparare l'italiano."] }, pl: { examples: ["Spotykam się z Samem o 8.", "Zamierzam nauczyć się włoskiego."] }, tr: { examples: ["Sam’l