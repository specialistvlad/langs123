    fr: ["Un projet formé avant de parler prend ", { term: "going to" }, " ; une décision prise en parlant prend ", { term: "will" }, " :"]
    de: ["Ein Plan, der vor dem Sprechen gefasst wurde, nimmt ", { term: "going to" }, "; eine Entscheidung im Moment des Sprechens nimmt ", { term: "will" }, ":"]
    it: ["Un piano fatto prima di parlare richiede ", { term: "going to" }, ", una decisione presa mentre si parla richiede ", { term: "will" }, ":"]
    pl: ["Plan sprzed chwili mówienia wymaga ", { term: "going to" }, "; decyzja podjęta w trakcie mówienia wymaga ", { term: "will" }, ":"]
    tr: ["Konuşmadan önce yapılan plan ", { term: "going to" }, " ile, konuşurken verilen karar ", { term: "will" }, " ile ifade edilir:"]
    id: ["Rencana yang dibuat sebelum berbicara memakai ", { term: "going to" }, ", keputusan yang dibuat saat berbicara memakai ", { term: "will" }, ":"]
