          - { level: A2, will: { ex: [The phone is ringing. I, { target: "'ll answer" }, " it."], tr: { uk: "Телефон дзвонить. Я відповім.", es: "Suena el teléfono. Contestaré yo.", pt: "O telefone está tocando. Eu atendo.", fr: "Le téléphone sonne. Je vais répondre.", de: "Das Telefon klingelt. Ich gehe ran.", it: "Squilla il telefono. Rispondo io.", pl: "Dzwoni telefon. Odbiorę.", tr: "Telefon çalıyor. Ben açayım.", id: "Telepon berdering. Saya yang akan mengangkatnya.", vi: "Điện thoại đang reo. Tôi sẽ nghe máy." } }, going: { ex: [I, { target: "'m going to call" }, " Tom tonight. I decided yesterday."], tr: { uk: "Сьогодні ввечері я збираюся зателефонувати Томові. Я вирішив ще вчора.", es: "Esta noche voy a llamar a Tom. Lo decidí ayer.", pt: "Hoje à noite vou ligar para o Tom. Decidi ontem.", fr: "Ce soir, je vais appeler Tom. Je l’ai décidé hier.", de: "Ich werde Tom heute Abend anrufen. Ich habe es gestern beschlossen.", it: "Stasera chiamo Tom. L'ho deciso ieri.", pl: "Dziś wieczorem zadzwonię do Toma. Zdecydowałem o tym wczoraj.", tr: "Bu akşam Tom’u arayacağım. Dün karar verdim.", id: "Malam ini saya akan menelepon Tom. Saya memutuskannya kemarin.", vi: "Tối nay tôi định gọi cho Tom. Hôm qua tôi đã quyết định rồi." } } }
          - { level: B1, will: { en: ["opinion or guess (", { term: I think }, ")"], uk: ["думка чи припущення (", { term: I think }, ")"], es: ["opinión o suposición (", { term: I think }, ")"], pt: ["opinião ou suposição (", { term: "I think" }, ")"], fr: ["opinion ou supposition (", { term: "I think" }, ")"], de: ["Meinung oder Vermutung (", { term: "I think" }, ")"], it: ["opinione o ipotesi (", { term: "I think" }, ")"], pl: ["opinia lub przypuszczenie (", { term: "I think" }, ")"], tr: ["görüş ya da tahmin (", { term: "I think" }, ")"], id: ["pendapat atau tebakan (", { term: "I think" }, ")"], vi: ["ý kiến hoặc phỏng đoán (", { term: "I think" }, ")"] }, going: { en: evidence now, uk: "докази зараз", es: "evidencia actual", pt: "evidência no momento", fr: "indice actuel", de: "Anzeichen jetzt", it: "prove attuali", pl: "dowody w chwili obecnej", tr: "şu anda elde kanıt var", id: "bukti saat ini", vi: "bằng chứng ở hiện tại" } }
