        - { level: A2, point: { alternatives: [V, V-s] }, rule: { en: "present simple: timetables", uk: "Present Simple: розклади", es: "presente simple: horarios", pt: "presente simples: horários", fr: "présent simple : horaires", de: "Simple Present: Fahrpläne", it: "present simple: orari", pl: "Present Simple: rozkłady jazdy", tr: "Simple Present: tarifeler", id: "simple present: jadwal", vi: "hiện tại đơn: lịch trình" }, ex: ["The train ", { target: leaves }, " at ", { time: "6:15", value: "06:15" }, "."], tr: { uk: "Потяг відправляється о 6:15.", es: "El tren sale a las 6:15.", pt: "O trem sai às 6h15.", fr: "Le train part à 6 h 15.", de: "Der Zug fährt um 6:15 Uhr ab.", it: "Il treno parte alle 6:15.", pl: "Pociąg odjeżdża o 6:15.", tr: "Tren 6:15’te kalkıyor.", id: "Kereta berangkat pukul 6.15.", vi: "Tàu rời ga lúc 6:15." } }
