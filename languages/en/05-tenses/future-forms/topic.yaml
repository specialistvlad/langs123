          - { level: A2, use: { en: [{ term: will }, ": promises"], uk: [{ term: will }, ": обіцянки"], es: [{ term: will }, ": promesas"], pt: [{ term: "will" }, ": promessas"], fr: [{ term: "will" }, " : promesses"], de: [{ term: "will" }, ": Versprechen"], it: [{ term: "will" }, ": promesse"], pl: [{ term: "will" }, ": obietnice"], tr: [{ term: "will" }, ": sözler"], id: [{ term: "will" }, ": janji"], vi: [{ term: "will" }, ": lời hứa"] }, ex: ["I ", { target: won't tell }, " anyone."], tr: { uk: "Я нікому не скажу.", es: "No se lo diré a nadie.", pt: "Não vou contar a ninguém.", fr: "Je ne le dirai à personne.", de: "Ich sage es niemandem.", it: "Non lo dirò a nessuno.", pl: "Nikomu nie powiem.", tr: "Kimseye söylemeyeceğim.", id: "Saya tidak akan memberi tahu siapa pun.", vi: "Tôi sẽ không nói với ai." } }
