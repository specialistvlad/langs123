          - { level: A1, expression: { alternatives: [["on ", { weekday: Friday, value: 5 }], at the weekend] }, ex: ["She's leaving ", { signal: ["on ", { weekday: Friday, value: 5 }] }, "."], tr: { uk: "У п’ятницю вона від’їжджає.", es: "Ella se va el viernes.", pt: "Ela vai embora na sexta.", fr: "Elle part vendredi.", de: "Sie reist am Freitag ab.", it: "Parte venerdì.", pl: "Ona wyjeżdża w piątek.", tr: "O cuma günü ayrılıyor.", id: "Dia berangkat hari Jumat.", vi: "Cô ấy đi vào thứ Sáu." } }
          - { level: A2, expression: { alternatives: [in two days, in a minute] }, ex: ["I'll call you ", { signal: in a minute }, "."], tr: { uk: "Я зателефоную тобі за хвилину.", es: "Te llamaré en un minuto.", pt: "Ligo para você daqui a um minuto.", fr: "Je t’appelle dans une minute.", de: "Ich rufe dich in einer Minute an.", it: "Ti chiamo tra un minuto.", pl: "Zadzwonię do ciebie za minutę.", tr: "Bir dakika sonra seni arayacağım.", id: "Saya akan meneleponmu sebentar lagi.", vi: "Một phút nữa tôi sẽ gọi cho bạn." } }
          - { level: A2, expression: { alternatives: [soon, later] }, ex: ["He'll be here ", { signal: soon }, "."], tr: { uk: "Він скоро буде тут.", es: "Pronto estará aquí.", pt: "Ele chega logo.", fr: "Il sera bientôt là.", de: "Er ist bald hier.", it: "Sarà qui presto.", pl: "Wkrótce tu będzie.", tr: "Yakında burada olur.", id: "Dia akan segera tiba di sini.", vi: "Anh ấy sẽ sớm có mặt ở đây." } }
