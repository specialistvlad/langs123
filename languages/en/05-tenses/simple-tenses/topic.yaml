  - title: { en: Historic present, uk: "Історичний теперішній час", es: "Presente histórico", pt: "Presente histórico", fr: "Présent historique", de: "Historisches Präsens", it: "Presente storico", pl: "Czas teraźniejszy historyczny", tr: "Tarihî şimdiki zaman", id: "Present historis", vi: "Hiện tại lịch sử" }
    role: own
