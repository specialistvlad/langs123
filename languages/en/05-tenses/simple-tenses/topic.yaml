              vi: ["Dạng bất quy tắc chỉ dùng trong câu khẳng định; câu hỏi và câu phủ định dùng ", { pattern: [{ term: "did" }, { slot: "base verb" }] }, ":"]
            ex: ["Did you ", { target: go }, "?"]
