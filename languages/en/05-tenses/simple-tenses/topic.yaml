      - type: errors
        rows:
          - { level: A1, wrong: She work here., right: ["She ", { target: works }, " here."], rule: { en: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, V-s] }, uk: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, V-s] }, es: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, V-s] } } }
          - { level: A1, wrong: He doesn't works., right: ["He doesn't ", { target: work }, "."], rule: { en: { pattern: [{ slot: helper }, { slot: base verb }] }, uk: { pattern: [{ slot: helper }, { slot: base verb }] }, es: { pattern: [{ slot: helper }, { slot: base verb }] } } }
          - { level: A1, wrong: Where you live?, right: ["Where ", { target: do }, " you live?"], rule: { en: questions need a helper, uk: "питання потребують допоміжного дієслова", es: "las preguntas necesitan un auxiliar" } }
          - { level: A1, wrong: Did you went there?, right: ["Did you ", { target: go }, " there?"], rule: { en: { pattern: [{ term: did }, { slot: base verb }] }, uk: { pattern: [{ term: did }, { slot: base verb }] }, es: { pattern: [{ term: did }, { slot: base verb }] } } }
          - { level: A1, wrong: She didn't called., right: ["She didn't ", { target: call }, "."], rule: { en: { pattern: [{ term: didn't }, { slot: base verb }] }, uk: { pattern: [{ term: didn't }, { slot: base verb }] }, es: { pattern: [{ term: didn't }, { slot: base verb }] } } }
          - { level: A1, wrong: I goed home., right: ["I ", { target: went }, " home."], rule: { en: { mapping: [{ term: go }, [{ term: went }, " (irregular verb)"]] }, uk: { mapping: [{ term: go }, [{ term: went }, " (неправильне дієслово)"]] }, es: { mapping: [{ term: go }, [{ term: went }, " (verbo irregular)"]] } } }
          - { level: A1, wrong: Did he was late?, right: [{ target: Was }, " he late?"], rule: { en: [{ term: be }, " makes questions by itself"], uk: [{ term: be }, " сам утворює питання, без допоміжного дієслова"], es: [{ term: be }, " forma las preguntas sin auxiliar"] } }
          - { level: A2, wrong: He will goes., right: ["He will ", { target: go }, "."], rule: { en: { pattern: [{ term: will }, { slot: base verb }] }, uk: { pattern: [{ term: will }, { slot: base verb }] }, es: { pattern: [{ term: will }, { slot: base verb }] } } }
          - { level: A2, wrong: Do you will come?, right: [{ target: Will }, " you come?"], rule: { en: [{ term: will }, " makes questions by itself"], uk: [{ term: will }, " сам утворює питання, без допоміжного дієслова"], es: [{ term: will }, " forma las preguntas sin auxiliar"] } }
          - { level: A1, speakers: [uk], wrong: I am agree., right: ["I ", { target: agree }, "."], rule: { uk: [{ term: agree }, " — дієслово, тож без ", { term: am }, ": ", { term: I agree }, "; українське «згоден» — прикметник"] } }
          - { level: A1, speakers: [es], wrong: What means this word?, right: ["What ", { target: does }, " this word ", { target: mean }, "?"], rule: { es: ["la pregunta necesita ", { term: do }, " o ", { term: does }, ": el verbo no se invierte como en «¿qué significa…?»"] } }
          - { level: A1, speakers: [es], wrong: I no like coffee., right: ["I ", { target: don't }, " like coffee."], rule: { es: ["la negación lleva ", { term: don't }, " o ", { term: doesn't }, ", no ", { term: no }, " delante del verbo"] } }
