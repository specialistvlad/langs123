            tr: { uk: { examples: ["Я часто ходжу на роботу пішки.", "Вона завжди запізнюється."] }, es: { examples: ["A menudo voy al trabajo caminando.", "Ella siempre llega tarde."] }, pt: { examples: ["Eu vou a pé para o trabalho com frequência.", "Ela está sempre atrasada."] }, fr: { examples: ["Je vais souvent au travail à pied.", "Elle est toujours en retard."] }, de: { examples: ["Ich gehe oft zu Fuß zur Arbeit.", "Sie kommt immer zu spät."] }, it: { examples: ["Vado spesso al lavoro a piedi.", "Lei è sempre in ritardo."] }, pl: { examples: ["Często chodzę do pracy pieszo.", "Ona zawsze się spóźnia."] }, tr: { examples: ["İşe sık sık yürüyerek giderim.", "O her zaman geç kalır."] }, id: { examples: ["Saya sering berjalan kaki ke tempat kerja.", "Dia selalu terlambat."] }, vi: { examples: ["Tôi thường đi bộ đi làm.", "Cô ấy luôn đến muộn."] } }
          - type: rule
