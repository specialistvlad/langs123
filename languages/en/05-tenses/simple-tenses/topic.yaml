          - { level: C1, use: { en: Formal declarations and suggestions, uk: "Офіційні заяви й пропозиції", es: "Declaraciones y sugerencias formales", pt: "Declarações e sugestões formais", fr: "Déclarations et suggestions formelles", de: "Förmliche Erklärungen und Vorschläge", it: "Dichiarazioni e suggerimenti formali", pl: "Formalne oświadczenia i sugestie", tr: "Resmî bildirimler ve öneriler", id: "Pernyataan dan saran formal", vi: "Tuyên bố và đề xuất trang trọng" }, ex: { examples: [["I ", { target: declare }, " the meeting open."], ["I ", { target: suggest }, " we start again."]] }, tr: { uk: { examples: ["Оголошую засідання відкритим.", "Пропоную почати спочатку."] }, es: { examples: ["Declaro abierta la sesión.", "Sugiero que empecemos de nuevo."] }, pt: { examples: ["Declaro aberta a reunião.", "Sugiro que comecemos de novo."] }, fr: { examples: ["Je déclare la séance ouverte.", "Je suggère que nous recommencions."] }, de: { examples: ["Ich erkläre die Sitzung für eröffnet.", "Ich schlage vor, dass wir noch einmal anfangen."] }, it: { examples: ["Dichiaro aperta la riunione.", "Suggerisco di ricominciare."] }, pl: { examples: ["Otwieram zebranie.", "Proponuję zacząć od nowa."] }, tr: { examples: ["Toplantıyı açıyorum.", "Baştan başlamayı öneriyorum."] }, id: { examples: ["Saya menyatakan rapat dibuka.", "Saya mengusulkan agar kita mulai lagi."] }, vi: { examples: ["Tôi tuyên bố khai mạc cuộc họp.", "Tôi đề nghị chúng ta bắt đầu lại."] } } }
