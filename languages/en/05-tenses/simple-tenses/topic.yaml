        - { level: B2, point: { en: Narrative present, uk: "Теперішній час у розповіді", es: "Presente narrativo", pt: "Presente narrativo", fr: "Présent de narration", de: "Erzählendes Präsens", it: "Presente narrativo", pl: "Czas teraźniejszy w narracji", tr: "Anlatımda şimdiki zaman", id: "Present untuk bercerita", vi: "Hiện tại dùng để kể chuyện" }, rule: { en: "jokes, headlines, plot summaries, commentary, reporting verbs", uk: "жарти, заголовки, переказ сюжету, коментар на місці подій, дієслова повідомлення", es: "chistes, titulares, resúmenes de argumento, narración en vivo, verbos de información", pt: "piadas, manchetes, resumos de enredo, narração ao vivo, verbos de relato", fr: "blagues, titres de presse, résumés d’intrigue, commentaire en direct, verbes de report", de: "Witze, Schlagzeilen, Inhaltsangaben, Live-Kommentar, Verben des Berichtens", it: "barzellette, titoli di giornale, riassunti di trama, telecronaca, verbi di riferimento", pl: "dowcipy, nagłówki, streszczenia fabuły, komentarz na żywo, czasowniki relacjonujące", tr: "fıkralar, manşetler, olay örgüsü özetleri, canlı anlatım, aktarma fiilleri", id: "lelucon, judul berita, ringkasan alur cerita, komentar langsung, kata kerja pelaporan", vi: "chuyện cười, tiêu đề báo, tóm tắt cốt truyện, bình luận trực tiếp, động từ tường thuật" }, ex: ["A man ", { target: walks }, " into a pub."], tr: { uk: "Чоловік заходить у паб.", es: "Un hombre entra en un bar.", pt: "Um homem entra em um bar.", fr: "Un homme entre dans un pub.", de: "Ein Mann geht in eine Kneipe.", it: "Un uomo entra in un pub.", pl: "Mężczyzna wchodzi do pubu.", tr: "Bir adam bara giriyor.", id: "Seorang pria masuk ke sebuah pub.", vi: "Một người đàn ông bước vào quán rượu." } }
        - { level: C1, point: { en: Historic present, uk: "Історичний теперішній час", es: "Presente histórico", pt: "Presente histórico", fr: "Présent historique", de: "Historisches Präsens", it: "Presente storico", pl: "Czas teraźniejszy historyczny", tr: "Tarihî şimdiki zaman", id: "Present historis", vi: "Hiện tại lịch sử" }, rule: { en: "a vivid shift to the present inside a past account", uk: "яскравий перехід на теперішній час усередині розповіді про минуле", es: "un cambio expresivo al presente dentro de un relato en pasado", pt: "uma mudança viva para o presente dentro de um relato no passado", fr: "un passage vivant au présent dans un récit au passé", de: "ein lebendiger Wechsel ins Präsens mitten in einer Erzählung in der Vergangenheit", it: "un passaggio vivido al presente dentro un racconto al passato", pl: "żywe przejście do teraźniejszości w opowieści o przeszłości", tr: "geçmişi anlatırken canlılık için şimdiki zamana geçiş", id: "peralihan yang hidup ke present di tengah cerita masa lalu", vi: "chuyển sinh động sang hiện tại giữa lời kể về quá khứ" }, ex: ["Suddenly the door ", { target: opens }, "."], tr: { uk: "Раптом двері відчиняються.", es: "De repente, la puerta se abre.", pt: "De repente, a porta se abre.", fr: "Soudain, la porte s’ouvre.", de: "Plötzlich geht die Tür auf.", it: "All'improvviso la porta si apre.", pl: "Nagle drzwi się otwierają.", tr: "Birden kapı açılıyor.", id: "Tiba-tiba pintu terbuka.", vi: "Đột nhiên cánh cửa mở ra." } }
        - { level: C1, point: { en: Distance and politeness, uk: "Дистанція та ввічливість", es: "Distancia y cortesía", pt: "Distanciamento e cortesia", fr: "Distance et politesse", de: "Distanz und Höflichkeit", it: "Distanza e cortesia", pl: "Dystans i grzeczność", tr: "Mesafe ve nezaket", id: "Jarak dan kesopanan", vi: "Khoảng cách và sự lịch sự" }, rule: { en: "the past simple softens a request or a question about now", uk: "Past Simple пом’якшує прохання або питання про теперішнє", es: "el pasado simple suaviza una petición o una pregunta sobre el presente", pt: "o passado simples suaviza um pedido ou uma pergunta sobre o presente", fr: "le prétérit simple adoucit une demande ou une question sur le présent", de: "das Simple Past macht eine Bitte oder eine Frage zur Gegenwart weicher", it: "il past simple attenua una richiesta o una domanda sul presente", pl: "Past Simple łagodzi prośbę lub pytanie o teraźniejszość", tr: "Simple Past, şimdiyle ilgili bir ricayı ya da soruyu yumuşatır", id: "simple past melunakkan permintaan atau pertanyaan tentang saat ini", vi: "quá khứ đơn làm lời yêu cầu hoặc câu hỏi về hiện tại nhẹ nhàng hơn" }, ex: [{ target: Did }, " you ", { target: want }, " to see me?"], tr: { uk: "Ви хотіли мене бачити?", es: "¿Quería verme?", pt: "Você queria me ver?", fr: "Vouliez-vous me voir ?", de: "Wollten Sie mich sprechen?", it: "Voleva vedermi?", pl: "Czy chciał pan ze mną rozmawiać?", tr: "Beni görmek mi istemiştiniz?", id: "Apakah Anda ingin bertemu dengan saya?", vi: "Bạn có muốn gặp tôi không?" } }
        - { level: C1, point: { en: Performative verbs, uk: "Перформативні дієслова", es: "Verbos realizativos", pt: "Verbos performativos", fr: "Verbes performatifs", de: "Performative Verben", it: "Verbi performativi", pl: "Czasowniki performatywne", tr: "Edim fiilleri", id: "Kata kerja performatif", vi: "Động từ ngôn hành" }, rule: { en: saying the verb does the act, uk: "сказати дієслово — це вже вчинити дію", es: "decir el verbo es hacer la acción", pt: "dizer o verbo é fazer o ato", fr: "dire le verbe, c’est faire l’acte", de: "das Verb auszusprechen ist die Handlung", it: "dire il verbo equivale a compiere l'atto", pl: "wypowiedzenie czasownika jest wykonaniem czynności", tr: "fiili söylemek eylemi yapmaktır", id: "mengucapkan kata kerjanya sama dengan melakukan tindakannya", vi: "nói động từ ra cũng là thực hiện hành động" }, ex: ["I ", { target: promise }, " to be on time."], tr: { uk: "Обіцяю бути вчасно.", es: "Prometo llegar a tiempo.", pt: "Prometo chegar na hora.", fr: "Je promets d’être à l’heure.", de: "Ich verspreche, pünktlich zu sein.", it: "Prometto di essere puntuale.", pl: "Obiecuję być punktualnie.", tr: "Zamanında olacağıma söz veriyorum.", id: "Saya berjanji akan tepat waktu.", vi: "Tôi hứa sẽ đúng giờ." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: prose
        level: A1
        text:
          en: ["Each simple tense has a helper verb: ", { term: will }, " for the future, ", { alternatives: [{ term: do }, { term: does }] }, " for the present, ", { term: did }, " for the past."]
          uk: ["У кожному простому часі є допоміжне дієслово: ", { term: will }, " для майбутнього, ", { alternatives: [{ term: do }, { term: does }] }, " для теперішнього, ", { term: did }, " для минулого."]
          es: ["Cada tiempo simple tiene un verbo auxiliar: ", { term: will }, " para el futuro, ", { alternatives: [{ term: do }, { term: does }] }, " para el presente, ", { term: did }, " para el pasado."]
          pt: ["Cada tempo simples tem um verbo auxiliar: ", { term: "will" }, " para o futuro, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " para o presente, ", { term: "did" }, " para o passado."]
          fr: ["Chaque temps simple a son auxiliaire : ", { term: "will" }, " pour le futur, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " pour le présent, ", { term: "did" }, " pour le passé."]
          de: ["Jede Simple-Zeitform hat ein Hilfsverb: ", { term: "will" }, " für die Zukunft, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " für die Gegenwart, ", { term: "did" }, " für die Vergangenheit."]
          it: ["Ogni tempo semplice ha un verbo ausiliare: ", { term: "will" }, " per il futuro, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " per il presente, ", { term: "did" }, " per il passato."]
          pl: ["Każdy czas prosty ma czasownik pomocniczy: ", { term: "will" }, " dla przyszłości, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " dla teraźniejszości, ", { term: "did" }, " dla przeszłości."]
          tr: ["Her simple zamanın bir yardımcı fiili vardır: gelecek için ", { term: "will" }, ", şimdiki zaman için ", { alternatives: [{ term: "do" }, { term: "does" }] }, ", geçmiş zaman için ", { term: "did" }, "."]
          id: ["Setiap simple tense memiliki kata kerja bantu: ", { term: "will" }, " untuk future, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " untuk present, ", { term: "did" }, " untuk past."]
          vi: ["Mỗi thì đơn có một trợ động từ: ", { term: "will" }, " cho tương lai, ", { alternatives: [{ term: "do" }, { term: "does" }] }, " cho hiện tại, ", { term: "did" }, " cho quá khứ."]
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In questions the helper goes before the subject; in negatives it takes ", { term: not }, ": ", { term: don't }, ", ", { term: doesn't }, ", ", { term: didn't }, ", ", { term: won't }, "."]
              uk: ["У питаннях допоміжне дієслово стоїть перед підметом; у запереченнях воно приєднує ", { term: not }, ": ", { term: don't }, ", ", { term: doesn't }, ", ", { term: didn't }, ", ", { term: won't }, "."]
              es: ["En las preguntas el auxiliar va antes del sujeto; en las negaciones lleva ", { term: not }, ": ", { term: don't }, ", ", { term: doesn't }, ", ", { term: didn't }, ", ", { term: won't }, "."]
              pt: ["Nas perguntas, o auxiliar vai antes do sujeito; nas negações, leva ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              fr: ["Dans les questions, l’auxiliaire se place avant le sujet ; dans les négations, il prend ", { term: "not" }, " : ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              de: ["In Fragen steht das Hilfsverb vor dem Subjekt; in Verneinungen folgt ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              it: ["Nelle domande l'ausiliare va prima del soggetto; nelle frasi negative prende ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              pl: ["W pytaniach czasownik pomocniczy stoi przed podmiotem; w przeczeniach łączy się z ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              tr: ["Soru cümlelerinde yardımcı fiil öznenin önüne geçer; olumsuz cümlelerde ", { term: "not" }, " alır: ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              id: ["Dalam pertanyaan kata kerja bantu diletakkan sebelum subjek; dalam kalimat negatif diikuti ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
              vi: ["Trong câu hỏi, trợ động từ đứng trước chủ ngữ; trong câu phủ định, nó đi với ", { term: "not" }, ": ", { term: "don't" }, ", ", { term: "doesn't" }, ", ", { term: "didn't" }, ", ", { term: "won't" }, "."]
          - type: rule
            level: A1
            text:
              en: "After every helper the main verb is in the base form:"
              uk: "Після кожного допоміжного дієслова основне дієслово стоїть у початковій формі:"
              es: "Después de cualquier auxiliar, el verbo principal va en la forma base:"
              pt: "Depois de qualquer auxiliar, o verbo principal fica na forma base:"
              fr: "Après tout auxiliaire, le verbe principal est à la base verbale :"
              de: "Nach jedem Hilfsverb steht das Hauptverb in der Grundform:"
              it: "Dopo ogni ausiliare il verbo principale è alla forma base:"
              pl: "Po każdym czasowniku pomocniczym czasownik główny stoi w formie podstawowej:"
              tr: "Her yardımcı fiilden sonra ana fiil yalın hâldedir:"
              id: "Setelah setiap kata kerja bantu, kata kerja utama berbentuk dasar:"
              vi: "Sau mọi trợ động từ, động từ chính ở dạng nguyên mẫu:"
            ex: { examples: [["Does she ", { target: work }, "?"], ["She didn't ", { target: work }, "."]] }
            tr: { uk: { examples: ["Вона працює?", "Вона не працювала."] }, es: { examples: ["¿Trabaja ella?", "Ella no trabajó."] }, pt: { examples: ["Ela trabalha?", "Ela não trabalhou."] }, fr: { examples: ["Travaille-t-elle ?", "Elle n’a pas travaillé."] }, de: { examples: ["Arbeitet sie?", "Sie hat nicht gearbeitet."] }, it: { examples: ["Lei lavora?", "Lei non ha lavorato."] }, pl: { examples: ["Czy ona pracuje?", "Ona nie pracowała."] }, tr: { examples: ["O çalışıyor mu?", "O çalışmadı."] }, id: { examples: ["Apakah dia bekerja?", "Dia tidak bekerja."] }, vi: { examples: ["Cô ấy có làm việc không?", "Cô ấy đã không làm việc."] } }
          - type: rule
            level: A1
            text:
              en: ["Present and past statements have no helper: the verb itself takes ", { term: "-s" }, " (", { term: he }, ", ", { term: she }, ", ", { term: it }, ") or ", { term: "-ed" }, "."]
              uk: ["У ствердженнях Present Simple і Past Simple допоміжного дієслова немає: саме дієслово приймає ", { term: "-s" }, " (", { term: he }, ", ", { term: she }, ", ", { term: it }, ") або ", { term: "-ed" }, "."]
              es: ["Las afirmaciones en presente y en pasado no llevan auxiliar: el propio verbo toma ", { term: "-s" }, " (", { term: he }, ", ", { term: she }, ", ", { term: it }, ") o ", { term: "-ed" }, "."]
              pt: ["As afirmações no presente e no passado não levam auxiliar: o próprio verbo recebe ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") ou ", { term: "-ed" }, "."]
              fr: ["Les phrases affirmatives au présent et au passé n’ont pas d’auxiliaire : le verbe prend lui-même ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") ou ", { term: "-ed" }, "."]
              de: ["Aussagen in Gegenwart und Vergangenheit haben kein Hilfsverb: Das Verb selbst erhält ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") oder ", { term: "-ed" }, "."]
              it: ["Le frasi affermative al present e al past simple non hanno ausiliare: è il verbo stesso a prendere ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") o ", { term: "-ed" }, "."]
              pl: ["W zdaniach twierdzących Present Simple i Past Simple nie ma czasownika pomocniczego: sam czasownik przyjmuje ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") lub ", { term: "-ed" }, "."]
              tr: ["Şimdiki ve geçmiş zamanlı olumlu cümlelerde yardımcı fiil yoktur: fiilin kendisi ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") veya ", { term: "-ed" }, " alır."]
              id: ["Kalimat positif present dan past tidak memakai kata kerja bantu: kata kerjanya sendiri mendapat ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") atau ", { term: "-ed" }, "."]
              vi: ["Câu khẳng định ở hiện tại và quá khứ không có trợ động từ: bản thân động từ nhận ", { term: "-s" }, " (", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, ") hoặc ", { term: "-ed" }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: will }, " and ", { term: did }, " are the same for every person; only the present changes with ", { term: he }, ", ", { term: she }, ", ", { term: it }, "."]
              uk: [{ term: will }, " і ", { term: did }, " однакові для всіх осіб; лише Present Simple змінюється з ", { term: he }, ", ", { term: she }, ", ", { term: it }, "."]
              es: [{ term: will }, " y ", { term: did }, " son iguales para todas las personas; solo el presente cambia con ", { term: he }, ", ", { term: she }, ", ", { term: it }, "."]
              pt: [{ term: "will" }, " e ", { term: "did" }, " são iguais para todas as pessoas; só o presente muda com ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              fr: [{ term: "will" }, " et ", { term: "did" }, " sont identiques pour toutes les personnes ; seul le présent change avec ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              de: [{ term: "will" }, " und ", { term: "did" }, " sind für jede Person gleich; nur die Gegenwart ändert sich bei ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              it: [{ term: "will" }, " e ", { term: "did" }, " sono uguali per tutte le persone; solo il present cambia con ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              pl: [{ term: "will" }, " i ", { term: "did" }, " są takie same dla wszystkich osób; tylko Present Simple zmienia się z ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              tr: [{ term: "will" }, " ve ", { term: "did" }, " her kişi için aynıdır; yalnızca şimdiki zaman ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, " ile değişir."]
              id: [{ term: "will" }, " dan ", { term: "did" }, " sama untuk semua orang; hanya present yang berubah dengan ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
              vi: [{ term: "will" }, " và ", { term: "did" }, " giống nhau với mọi ngôi; chỉ hiện tại thay đổi với ", { term: "he" }, ", ", { term: "she" }, ", ", { term: "it" }, "."]
          - type: note
            level: A1
            text:
              en: [{ term: be }, " has its own forms: ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, ", ", { alternatives: [{ term: was }, { term: were }] }, ". See ", { link: To be, to: en.verbs.to-be }, "."]
              uk: [{ term: be }, " має власні форми: ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, ", ", { alternatives: [{ term: was }, { term: were }] }, ". Див. ", { link: "Дієслово to be", to: en.verbs.to-be }, "."]
              es: [{ term: be }, " tiene formas propias: ", { alternatives: [{ term: am }, { term: is }, { term: are }] }, ", ", { alternatives: [{ term: was }, { term: were }] }, ". Ver ", { link: "El verbo to be", to: en.verbs.to-be }, "."]
              pt: [{ term: "be" }, " tem formas próprias: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Ver ", { link: "O verbo to be", to: "en.verbs.to-be" }, "."]
              fr: [{ term: "be" }, " a ses propres formes : ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Voir ", { link: "Le verbe to be", to: "en.verbs.to-be" }, "."]
              de: [{ term: "be" }, " hat eigene Formen: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Siehe ", { link: "Das Verb to be", to: "en.verbs.to-be" }, "."]
              it: [{ term: "be" }, " ha forme proprie: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Vedi ", { link: "Il verbo to be", to: "en.verbs.to-be" }, "."]
              pl: [{ term: "be" }, " ma własne formy: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Zob. ", { link: "Czasownik to be", to: "en.verbs.to-be" }, "."]
              tr: [{ term: "be" }, " fiilinin kendine özgü biçimleri vardır: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Bkz. ", { link: "to be fiili", to: "en.verbs.to-be" }, "."]
              id: [{ term: "be" }, " memiliki bentuk sendiri: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Lihat ", { link: "Kata kerja to be", to: "en.verbs.to-be" }, "."]
              vi: [{ term: "be" }, " có các dạng riêng: ", { alternatives: [{ term: "am" }, { term: "is" }, { term: "are" }] }, ", ", { alternatives: [{ term: "was" }, { term: "were" }] }, ". Xem ", { link: "Động từ to be", to: "en.verbs.to-be" }, "."]

  - title: { en: "Present simple: form", uk: "Present Simple: форма", es: "Presente simple: forma", pt: "Presente simples: forma", fr: "Présent simple : forme", de: "Simple Present: Form", it: "Present simple: forma", pl: "Present Simple: forma", tr: "Simple Present: biçim", id: "Simple Present: bentuk", vi: "Hiện tại đơn: dạng" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
