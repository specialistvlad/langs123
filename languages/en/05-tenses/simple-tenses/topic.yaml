              es: ["La forma irregular solo se usa en afirmaciones; las preguntas y las negaciones llevan ", { pattern: [{ term: did }, { slot: base verb }] }, ":"]
              pt: ["A forma irregular só vale para afirmações; as perguntas e as negações levam ", { pattern: [{ term: "did" }, { slot: "base verb" }] }, ":"]
