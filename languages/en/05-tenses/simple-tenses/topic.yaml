              vi: "Cách nói chỉ thời gian đứng ở cuối câu:"
            ex: { examples: [["I swim ", { target: every day }, "."], ["She works late ", { target: ["on ", { weekday: Mondays, value: 1 }] }, "."]] }
            tr: { uk: { examples: ["Я плаваю щодня.", "Вона працює допізна по понеділках."] }, es: { examples: ["Nado todos los días.", "Ella trabaja hasta tarde los lunes."] }, pt: { examples: ["Eu nado todos os dias.", "Ela trabalha até tarde às segundas-feiras."] }, fr: { examples: ["Je nage tous les jours.", "Elle travaille tard le lundi."] }, de: { examples: ["Ich schwimme jeden Tag.", "Sie arbeitet montags lange."] }, it: { examples: ["Nuoto ogni giorno.", "Il lunedì lei lavora fino a tardi."] }, pl: { examples: ["Pływam codziennie.", "W poniedziałki pracuje do późna."] }, tr: { examples: ["Her gün yüzerim.", "O pazartesileri geç saate kadar çalışır."] }, id: { examples: ["Saya berenang setiap hari.", "Dia bekerja sampai larut pada hari Senin."] }, vi: { examples: ["Tôi bơi mỗi ngày.", "Cô ấy làm việc muộn vào các ngày thứ Hai."] } }
          - type: rule
            level: A2
            text:
              en: "Verbs for states take the present simple, also for now:"
              uk: "Дієслова стану вживаються в Present Simple, навіть коли йдеться про теперішній момент:"
