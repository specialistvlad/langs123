              tr: "Durum fiilleri, şu an için de Simple Present alır:"
              id: "Kata kerja keadaan memakai simple present, juga untuk saat ini:"
              vi: "Động từ chỉ trạng thái dùng hiện tại đơn, kể cả cho lúc này:"
            ex: { examples: [["I ", { target: know }, " the answer."], ["I ", { target: want }, " a coffee."]] }
            tr: { uk: { examples: ["Я знаю відповідь.", "Я хочу кави."] }, es: { examples: ["Sé la respuesta.", "Quiero un café."] }, pt: { examples: ["Eu sei a resposta.", "Eu quero um café."] }, fr: { examples: ["Je connais la réponse.", "Je veux un café."] }, de: { examples: ["Ich kenne die Antwort.", "Ich möchte einen Kaffee."] }, it: { examples: ["So la risposta.", "Voglio un caffè."] }, pl: { examples: ["Znam odpowiedź.", "Chcę kawy."] }, tr: { examples: ["Cevabı biliyorum.", "Bir kahve istiyorum."] }, id: { examples: ["Saya tahu jawabannya.", "Saya mau secangkir kopi."] }, vi: { examples: ["Tôi biết câu trả lời.", "Tôi muốn một ly cà phê."] } }
