        rows:
          - { level: C1, use: { en: A vivid moment inside an account in the past, uk: "Яскравий момент усередині розповіді про минуле", es: "Un momento vívido dentro de un relato en pasado", pt: "Um momento vívido dentro de um relato no passado", fr: "Un moment vivant à l’intérieur d’un récit au passé", de: "Ein lebendiger Moment innerhalb einer Erzählung in der Vergangenheit", it: "Un momento vivido dentro un racconto al passato", pl: "Żywy moment w opowieści o przeszłości", tr: "Geçmiş bir anlatının içinde canlı bir an", id: "Momen yang hidup di tengah cerita masa lalu", vi: "Một khoảnh khắc sống động trong lời kể về quá khứ" }, ex: ["We were driving home when suddenly a deer ", { target: jumps }, " out."], tr: { uk: "Ми їхали додому, коли раптом на дорогу вистрибує олень.", es: "Volvíamos a casa en el auto cuando, de repente, un venado salta al camino.", pt: "Estávamos indo para casa de carro quando, de repente, um cervo pula na pista.", fr: "Nous rentrions en voiture quand, tout à coup, un cerf surgit.", de: "Wir fuhren gerade nach Hause, als plötzlich ein Reh herausspringt.", it: "Stavamo tornando a casa in macchina quando all'improvviso un cervo salta fuori.", pl: "Jechaliśmy do domu, gdy nagle wyskakuje jeleń.", tr: "Eve arabayla dönüyorduk ki birden bir geyik fırlıyor.", id: "Kami sedang mengemudi pulang ketika tiba-tiba seekor rusa melompat keluar.", vi: "Chúng tôi đang lái xe về nhà thì đột nhiên một con hươu nhảy ra." } }
          - { level: C1, use: { en: History writing and documentaries, uk: "Історичні тексти й документальні фільми", es: "Textos de historia y documentales", pt: "Textos de história e documentários", fr: "Textes d’histoire et documentaires", de: "Geschichtsschreibung und Dokumentarfilme", it: "Testi di storia e documentari", pl: "Teksty historyczne i filmy dokumentalne", tr: "Tarih yazımı ve belgeseller", id: "Penulisan sejarah dan film dokumenter", vi: "Viết sử và phim tài liệu" }, ex: ["In ", { date: "1789", value: "1789" }, " the people of Paris ", { target: storm }, " the Bastille."], tr: { uk: "У 1789 році парижани штурмують Бастилію.", es: "En 1789, el pueblo de París toma la Bastilla.", pt: "Em 1789, o povo de Paris toma a Bastilha.", fr: "En 1789, le peuple de Paris prend la Bastille.", de: "Im Jahr 1789 stürmen die Pariser die Bastille.", it: "Nel 1789 il popolo di Parigi assalta la Bastiglia.", pl: "W 1789 roku paryżanie szturmują Bastylię.", tr: "1789’da Paris halkı Bastille’e saldırıyor.", id: "Pada tahun 1789, rakyat Paris menyerbu Penjara Bastille.", vi: "Năm 1789, người dân Paris tấn công ngục Bastille." } }
          - { level: C1, use: { en: Earlier events keep a past form, uk: "Раніші події зберігають форму минулого", es: "Los hechos anteriores conservan una forma de pasado", pt: "Os fatos anteriores mantêm uma forma de passado", fr: "Les faits antérieurs gardent une forme du passé", de: "Frühere Ereignisse behalten eine Vergangenheitsform", it: "Gli eventi precedenti mantengono una forma del passato", pl: "Wcześniejsze zdarzenia zachowują formę przeszłą", tr: "Daha önceki olaylar geçmiş biçimini korur", id: "Peristiwa yang lebih awal tetap berbentuk past", vi: "Sự việc xảy ra trước vẫn giữ dạng quá khứ" }, ex: ["He ", { target: opens }, " the letter. His brother ", { target: had written }, " it years ago."], tr: { uk: "Він відкриває листа. Його брат написав його багато років тому.", es: "Él abre la carta. Su hermano la había escrito años atrás.", pt: "Ele abre a carta. O irmão dele a tinha escrito anos antes.", fr: "Il ouvre la lettre. Son frère l’avait écrite des années plus tôt.", de: "Er öffnet den Brief. Sein Bruder hatte ihn vor Jahren geschrieben.", it: "Apre la lettera. Suo fratello l'aveva scritta anni prima.", pl: "Otwiera list. Jego brat napisał go wiele lat wcześniej.", tr: "Mektubu açıyor. Kardeşi onu yıllar önce yazmıştı.", id: "Dia membuka surat itu. Saudara laki-lakinya sudah menulisnya bertahun-tahun yang lalu.", vi: "Anh ấy mở lá thư. Anh trai của anh ấy đã viết nó từ nhiều năm trước." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["A shift to the present marks the peak of the story; ", { term: suddenly }, " and ", { term: then }, " often introduce it."], uk: ["Перехід на теперішній час позначає кульмінацію розповіді; його часто вводять ", { term: "suddenly" }, " і ", { term: "then" }, "."], es: ["El cambio al presente marca el punto culminante del relato; a menudo lo introducen ", { term: "suddenly" }, " y ", { term: "then" }, "."], pt: ["A mudança para o presente marca o ponto alto da história; ", { term: "suddenly" }, " e ", { term: "then" }, " costumam introduzi-la."], fr: ["Le passage au présent marque le moment fort du récit ; ", { term: "suddenly" }, " et ", { term: "then" }, " l’introduisent souvent."], de: ["Der Wechsel ins Präsens markiert den Höhepunkt der Geschichte; ", { term: "suddenly" }, " und ", { term: "then" }, " leiten ihn oft ein."], it: ["Il passaggio al presente segna il culmine del racconto; spesso lo introducono ", { term: "suddenly" }, " e ", { term: "then" }, "."], pl: ["Przejście do teraźniejszości zaznacza punkt kulminacyjny opowieści; często wprowadzają je ", { term: "suddenly" }, " i ", { term: "then" }, "."], tr: ["Şimdiki zamana geçiş hikâyenin doruk noktasını gösterir; geçişi çoğu kez ", { term: "suddenly" }, " ve ", { term: "then" }, " başlatır."], id: ["Peralihan ke present menandai puncak cerita; ", { term: "suddenly" }, " dan ", { term: "then" }, " sering mengawalinya."], vi: ["Chuyển sang hiện tại đánh dấu cao trào của câu chuyện; ", { term: "suddenly" }, " và ", { term: "then" }, " thường mở đầu cho nó."] }

