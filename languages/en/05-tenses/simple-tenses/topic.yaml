        rows:
          - { level: C1, use: { en: A polite question about what someone wants now, uk: "Ввічливе питання про те, чого людина хоче зараз", es: "Una pregunta cortés sobre lo que alguien quiere ahora", pt: "Uma pergunta educada sobre o que alguém quer agora", fr: "Une question polie sur ce que quelqu’un veut maintenant", de: "Eine höfliche Frage danach, was jemand jetzt möchte", it: "Una domanda cortese su ciò che qualcuno vuole ora", pl: "Uprzejme pytanie o to, czego ktoś chce teraz", tr: "Birinin şu anda ne istediğine dair nazik bir soru", id: "Pertanyaan sopan tentang apa yang diinginkan seseorang saat ini", vi: "Câu hỏi lịch sự về điều ai đó muốn lúc này" }, ex: [{ target: Did }, " you ", { target: want }, " to see me?"], tr: { uk: "Ви хотіли мене бачити?", es: "¿Quería verme?", pt: "Você queria me ver?", fr: "Vouliez-vous me voir ?", de: "Wollten Sie mich sprechen?", it: "Voleva vedermi?", pl: "Czy chciał pan ze mną rozmawiać?", tr: "Beni görmek mi istemiştiniz?", id: "Apakah Anda ingin bertemu dengan saya?", vi: "Bạn có muốn gặp tôi không?" } }
          - { level: C1, use: { en: A polite request, uk: "Ввічливе прохання", es: "Una petición cortés", pt: "Um pedido educado", fr: "Une demande polie", de: "Eine höfliche Bitte", it: "Una richiesta cortese", pl: "Uprzejma prośba", tr: "Nazik bir rica", id: "Permintaan yang sopan", vi: "Lời yêu cầu lịch sự" }, ex: ["I ", { target: wondered }, " if you could help me."], tr: { uk: "Цікаво, чи не могли б ви мені допомогти.", es: "Me preguntaba si podría ayudarme.", pt: "Eu queria saber se você poderia me ajudar.", fr: "Je me demandais si vous pourriez m’aider.", de: "Ich habe mich gefragt, ob Sie mir helfen könnten.", it: "Mi chiedevo se potesse aiutarmi.", pl: "Zastanawiałem się, czy mógłby mi pan pomóc.", tr: "Acaba bana yardım edebilir misiniz diye düşünüyordum.", id: "Saya tadi bertanya-tanya apakah Anda bisa membantu saya.", vi: "Tôi đang tự hỏi liệu bạn có thể giúp tôi không." } }
          - { level: C1, use: { en: A softened statement, uk: "Пом’якшене висловлення", es: "Una afirmación suavizada", pt: "Uma afirmação suavizada", fr: "Une affirmation adoucie", de: "Eine abgeschwächte Aussage", it: "Un'affermazione attenuata", pl: "Złagodzone stwierdzenie", tr: "Yumuşatılmış bir ifade", id: "Pernyataan yang dilunakkan", vi: "Một lời nói được làm nhẹ đi" }, ex: ["I ", { target: just wanted }, " to say thank you."], tr: { uk: "Я лише хотів подякувати вам.", es: "Solo quería darle las gracias.", pt: "Eu só queria agradecer.", fr: "Je voulais simplement vous remercier.", de: "Ich wollte mich nur bedanken.", it: "Volevo solo ringraziarla.", pl: "Chciałem tylko panu podziękować.", tr: "Sadece teşekkür etmek istedim.", id: "Saya hanya ingin mengucapkan terima kasih.", vi: "Tôi chỉ muốn nói lời cảm ơn." } }
          - { level: C1, use: { en: A tentative suggestion, uk: "Обережна пропозиція", es: "Una sugerencia cautelosa", pt: "Uma sugestão cautelosa", fr: "Une suggestion prudente", de: "Ein vorsichtiger Vorschlag", it: "Un suggerimento cauto", pl: "Ostrożna sugestia", tr: "Çekingen bir öneri", id: "Saran yang hati-hati", vi: "Một gợi ý dè dặt" }, ex: ["I ", { target: thought }, " you might like it."], tr: { uk: "Я подумав, що вам це може сподобатися.", es: "Pensé que quizá le gustaría.", pt: "Pensei que você poderia gostar.", fr: "Je pensais que cela pourrait vous plaire.", de: "Ich dachte, es könnte Ihnen gefallen.", it: "Pensavo che potesse piacerle.", pl: "Pomyślałem, że może się panu spodobać.", tr: "Hoşunuza gidebileceğini düşündüm.", id: "Saya pikir Anda mungkin menyukainya.", vi: "Tôi nghĩ bạn có thể sẽ thích nó." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: The past form talks about now; the step back in time makes the sentence less direct., uk: "Форма минулого часу говорить про теперішнє; крок назад у часі робить речення менш прямим.", es: "La forma de pasado habla del presente; el paso atrás en el tiempo hace la frase menos directa.", pt: "A forma de passado fala do presente; o passo atrás no tempo deixa a frase menos direta.", fr: "La forme du passé parle du présent ; le pas en arrière dans le temps rend la phrase moins directe.", de: "Die Vergangenheitsform spricht über die Gegenwart; der Schritt zurück in der Zeit macht den Satz weniger direkt.", it: "La forma del passato parla del presente; il passo indietro nel tempo rende la frase meno diretta.", pl: "Forma przeszła mówi o teraźniejszości; krok wstecz w czasie sprawia, że zdanie brzmi mniej bezpośrednio.", tr: "Geçmiş biçimi şimdiyi anlatır; zamanda geri çekilmek cümleyi daha az doğrudan yapar.", id: "Bentuk past berbicara tentang saat ini; langkah mundur dalam waktu membuat kalimat kurang langsung.", vi: "Dạng quá khứ nói về hiện tại; bước lùi về thời gian làm câu bớt thẳng thừng." }
