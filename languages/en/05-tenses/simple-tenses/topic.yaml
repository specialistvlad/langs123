title: { en: Simple Tenses, uk: "Прості часи (Simple)", es: Tiempos simples, pt: "Tempos simples", fr: "Temps simples", de: "Einfache Zeitformen (Simple)", it: "Tempi semplici (Simple)", pl: "Czasy proste (Simple)", tr: "Basit zamanlar (Simple)", id: "Simple Tenses", vi: "Các thì đơn" }
summary:
  lead:
    en: ["Past, present and future simple: ", { term: do }, " or ", { term: does }, ", ", { term: did }, " and ", { term: will }, " make questions and negatives, and the main verb stays in its base form."]
    uk: ["У Past Simple, Present Simple і Future Simple питання й заперечення утворюють ", { term: do }, " або ", { term: does }, ", ", { term: did }, " і ", { term: will }, ", а основне дієслово стоїть у початковій формі."]
    es: ["En los tiempos simples de presente, pasado y futuro, ", { term: do }, " o ", { term: does }, ", ", { term: did }, " y ", { term: will }, " forman las preguntas y las negaciones, y el verbo principal queda en la forma base."]
    pt: ["Nos tempos simples de presente, passado e futuro, ", { term: "do" }, " ou ", { term: "does" }, ", ", { term: "did" }, " e ", { term: "will" }, " formam as perguntas e as negações, e o verbo principal fica na forma base."]
    fr: ["Prétérit, présent et futur simples : ", { term: "do" }, " ou ", { term: "does" }, ", ", { term: "did" }, " et ", { term: "will" }, " forment les questions et les négations, et le verbe principal reste à la base verbale."]
    de: ["Simple-Formen in Gegenwart, Vergangenheit und Zukunft: ", { term: "do" }, " oder ", { term: "does" }, ", ", { term: "did" }, " und ", { term: "will" }, " bilden Fragen und Verneinungen, und das Hauptverb bleibt in der Grundform."]
    it: ["Past, present e future simple: ", { term: "do" }, " o ", { term: "does" }, ", ", { term: "did" }, " e ", { term: "will" }, " formano le domande e le frasi negative, e il verbo principale resta alla forma base."]
    pl: ["W czasach Past Simple, Present Simple i Future Simple pytania i przeczenia tworzą ", { term: "do" }, " lub ", { term: "does" }, ", ", { term: "did" }, " i ", { term: "will" }, ", a czasownik główny stoi w formie podstawowej."]
    tr: ["Simple Past, Simple Present ve Simple Future: soru ve olumsuz cümleleri ", { term: "do" }, " veya ", { term: "does" }, ", ", { term: "did" }, " ve ", { term: "will" }, " kurar; ana fiil yalın hâlde kalır."]
    id: ["Pada ketiga simple tense, ", { term: "do" }, " atau ", { term: "does" }, ", ", { term: "did" }, ", dan ", { term: "will" }, " membentuk pertanyaan dan kalimat negatif, dan kata kerja utama tetap berbentuk dasar."]
    vi: ["Ở các thì đơn, ", { term: "do" }, " hoặc ", { term: "does" }, ", ", { term: "did" }, " và ", { term: "will" }, " tạo câu hỏi và câu phủ định, còn động từ chính giữ dạng nguyên mẫu."]
  rule:
    en: "Once a helper appears, the main verb loses -s and -ed:"
    uk: "Коли з’являється допоміжне дієслово, основне дієслово втрачає -s і -ed:"
    es: "Cuando aparece un verbo auxiliar, el verbo principal pierde -s y -ed:"
    pt: "Quando aparece um verbo auxiliar, o verbo principal perde -s e -ed:"
    fr: "Dès qu’un auxiliaire apparaît, le verbe principal perd -s et -ed :"
    de: "Sobald ein Hilfsverb steht, verliert das Hauptverb -s und -ed:"
    it: "Quando compare un ausiliare, il verbo principale perde -s e -ed:"
    pl: "Gdy pojawia się czasownik pomocniczy, czasownik główny traci -s i -ed:"
    tr: "Yardımcı fiil geldiğinde ana fiil -s ve -ed ekini kaybeder:"
    id: "Setelah kata kerja bantu muncul, kata kerja utama kehilangan -s dan -ed:"
    vi: "Khi đã có trợ động từ, động từ chính mất -s và -ed:"
  ex: { examples: [["She ", { target: doesn't like }, " tea."], [{ target: Did }, " he ", { target: go }, "?"]] }

