            text: { en: ["Manner adverbs and their position are in ", { link: Adverbs of frequency and manner, to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], uk: ["Прислівники способу дії та їхнє місце в реченні описано в ", { link: "Прислівники частотності та способу дії", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], es: ["Los adverbios de modo y su posición se explican en ", { link: "Adverbios de frecuencia y de modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], pt: ["Os advérbios de modo e a posição deles estão em ", { link: "Advérbios de frequência e de modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], fr: ["Les adverbes de manière et leur place sont traités dans ", { link: "Adverbes de fréquence et de manière", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], de: ["Adverbien der Art und Weise und ihre Stellung stehen unter ", { link: "Adverbien der Häufigkeit und der Art und Weise", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], it: ["Gli avverbi di modo e la loro posizione sono trattati in ", { link: "Avverbi di frequenza e di modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], pl: ["Przysłówki sposobu i ich miejsce w zdaniu omówiono w ", { link: "Przysłówki częstotliwości i sposobu", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], tr: ["Durum zarfları ve konumları ", { link: "Sıklık ve durum zarfları", to: en.adjectives-adverbs.adverbs-frequency-manner }, " bölümünde anlatılır."], id: ["Kata keterangan cara dan posisinya dibahas di ", { link: "Kata keterangan frekuensi dan cara", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], vi: ["Trạng từ chỉ cách thức và vị trí của chúng được nói trong ", { link: "Trạng từ chỉ tần suất và cách thức", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."] }

  - title: { en: Downtoners and approximators, uk: "Послаблювачі й прислівники наближення", es: "Atenuadores y aproximadores", pt: "Atenuadores e aproximadores", fr: "Atténuateurs et approximateurs", de: "Abschwächer und Näherungsadverbien", it: "Attenuatori e approssimatori", pl: "Osłabiacze i przysłówki przybliżające", tr: "Yumuşatıcılar ve yaklaşıklık zarfları", id: "Pelunak dan kata keterangan pendekatan", vi: "Từ giảm nhẹ và trạng từ xấp xỉ" }
