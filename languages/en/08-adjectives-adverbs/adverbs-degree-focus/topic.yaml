          - { level: B2, position: { en: "at the end, after a comma", uk: "наприкінці, після коми", es: "al final, después de una coma", pt: "no fim, depois de uma vírgula", fr: "à la fin, après une virgule", de: "am Ende, nach einem Komma", it: "alla fine, dopo una virgola", pl: "na końcu, po przecinku", tr: "sonda, virgülden sonra", id: "di akhir, setelah koma", vi: "ở cuối câu, sau dấu phẩy" }, ex: ["She was tired, ", { target: obviously }, "."], tr: { uk: "Вона була втомлена, очевидно.", es: "Estaba cansada, obviamente.", pt: "Ela estava cansada, obviamente.", fr: "Elle était fatiguée, évidemment.", de: "Sie war müde, offensichtlich.", it: "Era stanca, ovviamente.", pl: "Była zmęczona, oczywiście.", tr: "Yorgundu, belli ki.", id: "Dia lelah, jelas sekali.", vi: "Cô ấy mệt, rõ ràng như vậy." } }

