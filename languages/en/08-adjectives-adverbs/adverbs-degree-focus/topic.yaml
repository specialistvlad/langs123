        - { level: B2, point: { en: Still and no longer, uk: "Still і no longer", es: "Still y no longer", pt: "Still e no longer", fr: "Still et no longer", de: "Still und no longer", it: "Still e no longer", pl: "Still i no longer", tr: "Still ve no longer", id: "Still dan no longer", vi: "Still và no longer" }, rule: { en: [{ term: still }, " continues; ", { term: no longer }, " and ", { term: any more }, " end"], uk: [{ term: "still" }, " означає, що ситуація триває; ", { term: "no longer" }, " і ", { term: "any more" }, " — що вона закінчилася"], es: [{ term: "still" }, " indica que algo continúa; ", { term: "no longer" }, " y ", { term: "any more" }, ", que terminó"], pt: [{ term: "still" }, " indica que algo continua; ", { term: "no longer" }, " e ", { term: "any more" }, ", que terminou"], fr: [{ term: "still" }, " indique que la situation continue ; ", { term: "no longer" }, " et ", { term: "any more" }, ", qu’elle a pris fin"], de: [{ term: "still" }, " zeigt, dass etwas andauert; ", { term: "no longer" }, " und ", { term: "any more" }, " zeigen, dass es vorbei ist"], it: [{ term: "still" }, " indica che qualcosa continua; ", { term: "no longer" }, " e ", { term: "any more" }, ", che è finito"], pl: [{ term: "still" }, " oznacza, że coś trwa; ", { term: "no longer" }, " i ", { term: "any more" }, " — że się skończyło"], tr: [{ term: "still" }, " sürmekte olduğunu; ", { term: "no longer" }, " ve ", { term: "any more" }, " sona erdiğini bildirir"], id: [{ term: "still" }, " menyatakan sesuatu berlanjut; ", { term: "no longer" }, " dan ", { term: "any more" }, " menyatakan sesuatu sudah berakhir"], vi: [{ term: "still" }, " cho biết điều gì còn tiếp diễn; ", { term: "no longer" }, " và ", { term: "any more" }, " cho biết đã chấm dứt"] }, ex: { examples: [["She ", { target: still }, " lives here."], ["She ", { target: no longer }, " lives here."]] }, tr: { uk: { examples: ["Вона досі живе тут.", "Вона більше тут не живе."] }, es: { examples: ["Ella todavía vive aquí.", "Ella ya no vive aquí."] }, pt: { examples: ["Ela ainda mora aqui.", "Ela não mora mais aqui."] }, fr: { examples: ["Elle habite toujours ici.", "Elle n’habite plus ici."] }, de: { examples: ["Sie wohnt immer noch hier.", "Sie wohnt nicht mehr hier."] }, it: { examples: ["Lei abita ancora qui.", "Lei non abita più qui."] }, pl: { examples: ["Ona nadal tu mieszka.", "Ona już tu nie mieszka."] }, tr: { examples: ["Hâlâ burada yaşıyor.", "Artık burada yaşamıyor."] }, id: { examples: ["Dia masih tinggal di sini.", "Dia tidak tinggal di sini lagi."] }, vi: { examples: ["Cô ấy vẫn sống ở đây.", "Cô ấy không còn sống ở đây nữa."] } } }
        - { level: B2, point: { en: Sentence adverbs, uk: "Прислівники речення", es: "Adverbios oracionales", pt: "Advérbios oracionais", fr: "Adverbes de phrase", de: "Satzadverbien", it: "Avverbi di frase", pl: "Przysłówki zdaniowe", tr: "Cümle zarfları", id: "Kata keterangan kalimat", vi: "Trạng từ cả câu" }, rule: { en: "they comment on the whole sentence; a comma follows at the start", uk: "вони коментують усе речення; на початку після них стоїть кома", es: "comentan toda la oración; al inicio van seguidos de coma", pt: "comentam a frase inteira; no início, vêm seguidos de vírgula", fr: "ils commentent toute la phrase ; en début de phrase, une virgule les suit", de: "sie kommentieren den ganzen Satz; am Satzanfang folgt ein Komma", it: "commentano l'intera frase; all'inizio sono seguiti da una virgola", pl: "komentują całe zdanie; na początku zdania następuje po nich przecinek", tr: "tüm cümleyi yorumlar; başta olduklarında virgül gelir", id: "mengomentari seluruh kalimat; di awal kalimat diikuti koma", vi: "chúng bình luận về cả câu; ở đầu câu có dấu phẩy theo sau" }, ex: [{ target: Luckily }, ", nobody was hurt."], tr: { uk: "На щастя, ніхто не постраждав.", es: "Por suerte, nadie resultó herido.", pt: "Felizmente, ninguém se machucou.", fr: "Heureusement, personne n’a été blessé.", de: "Zum Glück wurde niemand verletzt.", it: "Per fortuna, nessuno si è fatto male.", pl: "Na szczęście nikt nie ucierpiał.", tr: "Şans eseri, kimse yaralanmadı.", id: "Untungnya, tidak ada yang terluka.", vi: "May mắn là không ai bị thương." } }
        - { level: C1, point: { en: Downtoners, uk: "Послаблювачі", es: "Atenuadores", pt: "Atenuadores", fr: "Atténuateurs", de: "Abschwächer", it: "Attenuatori", pl: "Osłabiacze", tr: "Yumuşatıcılar", id: "Pelunak", vi: "Từ giảm nhẹ" }, rule: { en: [{ term: hardly }, ", ", { term: scarcely }, " and ", { term: barely }, " are negative: no second negative"], uk: [{ term: "hardly" }, ", ", { term: "scarcely" }, " і ", { term: "barely" }, " мають заперечне значення: другого заперечення не потрібно"], es: [{ term: "hardly" }, ", ", { term: "scarcely" }, " y ", { term: "barely" }, " son negativos: no llevan otra negación"], pt: [{ term: "hardly" }, ", ", { term: "scarcely" }, " e ", { term: "barely" }, " são negativos: não levam outra negação"], fr: [{ term: "hardly" }, ", ", { term: "scarcely" }, " et ", { term: "barely" }, " sont négatifs : pas de seconde négation"], de: [{ term: "hardly" }, ", ", { term: "scarcely" }, " und ", { term: "barely" }, " sind negativ: keine zweite Verneinung"], it: [{ term: "hardly" }, ", ", { term: "scarcely" }, " e ", { term: "barely" }, " sono negativi: niente seconda negazione"], pl: [{ term: "hardly" }, ", ", { term: "scarcely" }, " i ", { term: "barely" }, " są negatywne: bez drugiego przeczenia"], tr: [{ term: "hardly" }, ", ", { term: "scarcely" }, " ve ", { term: "barely" }, " olumsuz anlamlıdır: ikinci bir olumsuzluk gelmez"], id: [{ term: "hardly" }, ", ", { term: "scarcely" }, ", dan ", { term: "barely" }, " bermakna negatif: tanpa negasi kedua"], vi: [{ term: "hardly" }, ", ", { term: "scarcely" }, " và ", { term: "barely" }, " mang nghĩa phủ định: không thêm phủ định thứ hai"] }, ex: ["I can ", { target: hardly }, " see."], tr: { uk: "Я ледве бачу.", es: "Casi no puedo ver.", pt: "Mal consigo enxergar.", fr: "Je vois à peine.", de: "Ich kann kaum etwas sehen.", it: "Vedo a malapena.", pl: "Ledwo widzę.", tr: "Zar zor görebiliyorum.", id: "Saya hampir tidak bisa melihat.", vi: "Tôi hầu như không nhìn thấy gì." } }
        - { level: C1, point: { en: Collocations, uk: "Сполучуваність", es: "Colocaciones", pt: "Colocações", fr: "Collocations", de: "Kollokationen", it: "Collocazioni", pl: "Kolokacje", tr: "Eşdizimler", id: "Kolokasi", vi: "Kết hợp từ" }, rule: { en: "the intensifier follows the meaning of the adjective", uk: "підсилювач залежить від значення прикметника", es: "el intensificador depende del significado del adjetivo", pt: "o intensificador depende do significado do adjetivo", fr: "le renforçateur dépend du sens de l’adjectif", de: "der Verstärker richtet sich nach der Bedeutung des Adjektivs", it: "il rafforzativo dipende dal significato dell'aggettivo", pl: "wzmacniacz zależy od znaczenia przymiotnika", tr: "pekiştirici, sıfatın anlamına göre seçilir", id: "penegas dipilih sesuai makna kata sifatnya", vi: "từ nhấn mạnh phụ thuộc vào nghĩa của tính từ" }, ex: { examples: [[{ target: highly }, " unlikely"], [{ target: deeply }, " concerned"]] }, tr: { uk: { examples: ["вкрай малоймовірно", "глибоко стурбований"] }, es: { examples: ["muy improbable", "profundamente preocupado"] }, pt: { examples: ["muito improvável", "profundamente preocupado"] }, fr: { examples: ["très improbable", "profondément inquiet"] }, de: { examples: ["höchst unwahrscheinlich", "zutiefst besorgt"] }, it: { examples: ["molto improbabile", "profondamente preoccupato"] }, pl: { examples: ["wysoce nieprawdopodobne", "głęboko zaniepokojony"] }, tr: { examples: ["çok düşük ihtimalli", "derinden endişeli"] }, id: { examples: ["sangat tidak mungkin", "sangat prihatin"] }, vi: { examples: ["rất khó xảy ra", "vô cùng lo ngại"] } } }
        - { level: C1, point: { en: Stance adverbs, uk: "Прислівники ставлення", es: "Adverbios de actitud", pt: "Advérbios de atitude", fr: "Adverbes d’attitude", de: "Einstellungsadverbien", it: "Avverbi di atteggiamento", pl: "Przysłówki postawy", tr: "Tutum zarfları", id: "Kata keterangan sikap", vi: "Trạng từ thái độ" }, rule: { en: "they show how sure or how fair the speaker is", uk: "вони показують, наскільки мовець упевнений і наскільки об’єктивний", es: "muestran cuán seguro o cuán justo es el hablante", pt: "mostram quão seguro ou quão justo o falante é", fr: "ils montrent à quel point le locuteur est sûr de lui ou équitable", de: "sie zeigen, wie sicher oder wie fair der Sprecher ist", it: "mostrano quanto il parlante è sicuro o equo", pl: "pokazują, jak pewny lub jak sprawiedliwy jest mówiący", tr: "konuşurun ne kadar emin ya da ne kadar adil olduğunu gösterir", id: "menunjukkan seberapa yakin atau seberapa adil si pembicara", vi: "chúng cho thấy người nói chắc chắn đến đâu hoặc công bằng đến đâu" }, ex: [{ target: Arguably }, ", it is her best book."], tr: { uk: "Можна стверджувати, що це її найкраща книга.", es: "Se podría decir que es su mejor libro.", pt: "Pode-se dizer que é o melhor livro dela.", fr: "On peut dire que c’est son meilleur livre.", de: "Es ist wohl ihr bestes Buch.", it: "Si può dire che è il suo libro migliore.", pl: "Można twierdzić, że to jej najlepsza książka.", tr: "Bu, onun en iyi kitabı sayılabilir.", id: "Bisa dikatakan, ini buku terbaiknya.", vi: "Có thể nói đây là cuốn sách hay nhất của cô ấy." } }
        - { level: C2, point: { en: Formal adverbs, uk: "Формальні прислівники", es: "Adverbios formales", pt: "Advérbios formais", fr: "Adverbes soutenus", de: "Formelle Adverbien", it: "Avverbi formali", pl: "Przysłówki formalne", tr: "Resmî zarflar", id: "Kata keterangan formal", vi: "Trạng từ trang trọng" }, rule: { en: "formal prose adds adverbs such as invariably and exceedingly", uk: "формальний письмовий стиль додає такі прислівники, як invariably і exceedingly", es: "la prosa formal añade adverbios como invariably y exceedingly", pt: "a prosa formal acrescenta advérbios como invariably e exceedingly", fr: "la prose soutenue ajoute des adverbes comme invariably et exceedingly", de: "formelle Texte verwenden zusätzlich Adverbien wie invariably und exceedingly", it: "la prosa formale aggiunge avverbi come invariably ed exceedingly", pl: "formalny tekst dodaje przysłówki takie jak invariably i exceedingly", tr: "resmî yazı dili invariably ve exceedingly gibi zarflar ekler", id: "tulisan formal menambahkan kata keterangan seperti invariably dan exceedingly", vi: "văn viết trang trọng thêm các trạng từ như invariably và exceedingly" }, ex: { examples: [["He ", { target: invariably }, " arrives early."], ["She was ", { target: exceedingly }, " kind."]] }, tr: { uk: { examples: ["Він незмінно приходить рано.", "Вона була надзвичайно добра."] }, es: { examples: ["Invariablemente llega temprano.", "Fue sumamente amable."] }, pt: { examples: ["Ele invariavelmente chega cedo.", "Ela foi extremamente gentil."] }, fr: { examples: ["Il arrive invariablement tôt.", "Elle a été extrêmement gentille."] }, de: { examples: ["Er kommt ausnahmslos früh.", "Sie war überaus freundlich."] }, it: { examples: ["Arriva invariabilmente presto.", "È stata estremamente gentile."] }, pl: { examples: ["Niezmiennie przychodzi wcześnie.", "Była niezwykle miła."] }, tr: { examples: ["Her zaman istisnasız erken gelir.", "Son derece nazikti."] }, id: { examples: ["Dia selalu datang lebih awal, tanpa kecuali.", "Dia sangat baik hati."] }, vi: { examples: ["Anh ấy lúc nào cũng đến sớm, không ngoại lệ.", "Cô ấy vô cùng tốt bụng."] } } }
        - { level: C2, point: { en: Position, uk: "Місце", es: "Posición", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" }, rule: { en: "an adverb follows the first auxiliary; before it for emphasis", uk: "прислівник стоїть після першого допоміжного дієслова; для підсилення — перед ним", es: "el adverbio va después del primer auxiliar; antes de él, para enfatizar", pt: "o advérbio vem depois do primeiro auxiliar; antes dele, para dar ênfase", fr: "l’adverbe se place après le premier auxiliaire ; avant lui, pour insister", de: "das Adverb steht nach dem ersten Hilfsverb; davor zur Betonung", it: "l'avverbio segue il primo ausiliare; lo precede per enfasi", pl: "przysłówek stoi po pierwszym czasowniku pomocniczym; przed nim dla podkreślenia", tr: "zarf ilk yardımcı fiilden sonra gelir; vurgu için ondan önce gelir", id: "kata keterangan diletakkan setelah kata kerja bantu pertama; sebelum kata kerja bantu untuk penekanan", vi: "trạng từ đứng sau trợ động từ đầu tiên; đứng trước để nhấn mạnh" }, ex: { examples: [["It has ", { target: quite clearly }, " been a success."], ["He ", { target: certainly }, " has."]] }, tr: { uk: { examples: ["Це цілком очевидно був успіх.", "Так, безперечно."] }, es: { examples: ["Claramente ha sido un éxito.", "Claro que sí."] }, pt: { examples: ["Isso claramente foi um sucesso.", "Certamente que sim."] }, fr: { examples: ["Cela a de toute évidence été un succès.", "Oui, certainement."] }, de: { examples: ["Es war ganz offensichtlich ein Erfolg.", "Das hat er ganz sicher."] }, it: { examples: ["È stato chiaramente un successo.", "Certo che sì."] }, pl: { examples: ["To wyraźnie był sukces.", "Z całą pewnością tak."] }, tr: { examples: ["Bu açıkça bir başarı oldu.", "Evet, kesinlikle."] }, id: { examples: ["Ini jelas sudah menjadi sebuah keberhasilan.", "Tentu saja sudah."] }, vi: { examples: ["Rõ ràng đó đã là một thành công.", "Chắc chắn là có."] } } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["an extreme adjective takes ", { term: absolutely }, " or ", { term: really }], uk: ["крайній прикметник вживається з ", { term: "absolutely" }, " або ", { term: "really" }], es: ["un adjetivo extremo lleva ", { term: "absolutely" }, " o ", { term: "really" }], pt: ["um adjetivo extremo leva ", { term: "absolutely" }, " ou ", { term: "really" }], fr: ["un adjectif extrême se construit avec ", { term: "absolutely" }, " ou ", { term: "really" }], de: ["ein extremes Adjektiv steht mit ", { term: "absolutely" }, " oder ", { term: "really" }], it: ["un aggettivo estremo prende ", { term: "absolutely" }, " o ", { term: "really" }], pl: ["przymiotnik skrajny łączy się z ", { term: "absolutely" }, " lub ", { term: "really" }], tr: ["uç anlamlı sıfat ", { term: "absolutely" }, " veya ", { term: "really" }, " alır"], id: ["kata sifat ekstrem memakai ", { term: "absolutely" }, " atau ", { term: "really" }], vi: ["tính từ cực độ đi với ", { term: "absolutely" }, " hoặc ", { term: "really" }] }, ex: ["The soup is ", { target: "absolutely delicious" }, "."], tr: { uk: "Суп просто неймовірно смачний.", es: "La sopa está absolutamente deliciosa.", pt: "A sopa está absolutamente deliciosa.", fr: "La soupe est absolument délicieuse.", de: "Die Suppe ist absolut köstlich.", it: "La zuppa è assolutamente deliziosa.", pl: "Zupa jest absolutnie pyszna.", tr: "Çorba kesinlikle harika.", id: "Supnya benar-benar lezat.", vi: "Món súp ngon tuyệt." } }

sections:
  - title: { en: "Form: degree adverbs with adjectives", uk: "Форма: прислівники ступеня з прикметниками", es: "Forma: adverbios de grado con adjetivos", pt: "Forma: advérbios de grau com adjetivos", fr: "Forme : adverbes de degré avec les adjectifs", de: "Form: Gradadverbien bei Adjektiven", it: "Forma: avverbi di grado con gli aggettivi", pl: "Forma: przysłówki stopnia z przymiotnikami", tr: "Biçim: sıfatlarla derece zarfları", id: "Bentuk: kata keterangan derajat dengan kata sifat", vi: "Dạng: trạng từ chỉ mức độ với tính từ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Adjective type, uk: "Тип прикметника", es: "Tipo de adjetivo", pt: "Tipo de adjetivo", fr: "Type d’adjectif", de: "Art des Adjektivs", it: "Tipo di aggettivo", pl: "Rodzaj przymiotnika", tr: "Sıfat türü", id: "Jenis kata sifat", vi: "Loại tính từ" } }
          - { key: adverbs, label: { en: Adverbs, uk: "Прислівники", es: "Adverbios", pt: "Advérbios", fr: "Adverbes", de: "Adverbien", it: "Avverbi", pl: "Przysłówki", tr: "Zarflar", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, type: { en: "gradable, a high degree", uk: "градуйований, високий ступінь", es: "graduable, grado alto", pt: "graduável, grau alto", fr: "gradable, degré élevé", de: "graduierbar, hoher Grad", it: "graduabile, grado alto", pl: "stopniowalny, wysoki stopień", tr: "derecelendirilebilir, yüksek derece", id: "bertingkat, derajat tinggi", vi: "có mức độ, mức cao" }, adverbs: { alternatives: [very, extremely, terribly] }, ex: { examples: [["It's ", { target: "very cold" }, "."], ["The soup is ", { target: "extremely hot" }, "."]] }, tr: { uk: { examples: ["Дуже холодно.", "Суп надзвичайно гарячий."] }, es: { examples: ["Hace mucho frío.", "La sopa está extremadamente caliente."] }, pt: { examples: ["Está muito frio.", "A sopa está extremamente quente."] }, fr: { examples: ["Il fait très froid.", "La soupe est extrêmement chaude."] }, de: { examples: ["Es ist sehr kalt.", "Die Suppe ist extrem heiß."] }, it: { examples: ["Fa molto freddo.", "La zuppa è estremamente calda."] }, pl: { examples: ["Jest bardzo zimno.", "Zupa jest wyjątkowo gorąca."] }, tr: { examples: ["Hava çok soğuk.", "Çorba son derece sıcak."] }, id: { examples: ["Cuacanya sangat dingin.", "Supnya sangat panas."] }, vi: { examples: ["Trời rất lạnh.", "Món súp cực kỳ nóng."] } } }
          - { level: B2, type: { en: extreme, uk: "крайній", es: "extremo", pt: "extremo", fr: "extrême", de: "extrem", it: "estremo", pl: "skrajny", tr: "uç anlamlı", id: "ekstrem", vi: "cực độ" }, adverbs: { alternatives: [absolutely, completely, totally, utterly] }, ex: { examples: [["It's ", { target: "absolutely freezing" }, "."], ["I'm ", { target: "completely exhausted" }, "."]] }, tr: { uk: { examples: ["Просто лютий холод.", "Я цілком виснажений."] }, es: { examples: ["Hace un frío helador.", "Estoy completamente agotado."] }, pt: { examples: ["Está um frio congelante.", "Estou completamente exausto."] }, fr: { examples: ["Il fait un froid glacial.", "Je suis complètement épuisé."] }, de: { examples: ["Es ist absolut eiskalt.", "Ich bin völlig erschöpft."] }, it: { examples: ["Fa un freddo glaciale.", "Sono completamente esausto."] }, pl: { examples: ["Jest lodowato.", "Jestem kompletnie wyczerpany."] }, tr: { examples: ["Hava dondurucu soğuk.", "Tamamen bitkinim."] }, id: { examples: ["Cuacanya benar-benar membekukan.", "Saya benar-benar kelelahan."] }, vi: { examples: ["Trời lạnh cóng.", "Tôi kiệt sức hoàn toàn."] } } }
          - { level: B2, type: { en: classifying, uk: "класифікувальний", es: "clasificador", pt: "classificatório", fr: "classifiant", de: "klassifizierend", it: "classificatorio", pl: "klasyfikujący", tr: "sınıflandırıcı", id: "klasifikasi", vi: "phân loại" }, adverbs: { alternatives: [completely, totally, entirely, absolutely] }, ex: { examples: [["The plan is ", { target: "absolutely perfect" }, "."], ["The two cases are ", { target: "entirely different" }, "."]] }, tr: { uk: { examples: ["План абсолютно досконалий.", "Ці два випадки зовсім різні."] }, es: { examples: ["El plan es absolutamente perfecto.", "Los dos casos son totalmente distintos."] }, pt: { examples: ["O plano é absolutamente perfeito.", "Os dois casos são totalmente diferentes."] }, fr: { examples: ["Le plan est absolument parfait.", "Les deux cas sont entièrement différents."] }, de: { examples: ["Der Plan ist absolut perfekt.", "Die beiden Fälle sind völlig verschieden."] }, it: { examples: ["Il piano è assolutamente perfetto.", "I due casi sono del tutto diversi."] }, pl: { examples: ["Plan jest absolutnie doskonały.", "Te dwa przypadki są zupełnie różne."] }, tr: { examples: ["Plan kesinlikle kusursuz.", "İki durum tamamen farklı."] }, id: { examples: ["Rencana itu benar-benar sempurna.", "Kedua kasus itu sama sekali berbeda."] }, vi: { examples: ["Kế hoạch này hoàn hảo tuyệt đối.", "Hai trường hợp này hoàn toàn khác nhau."] } } }
