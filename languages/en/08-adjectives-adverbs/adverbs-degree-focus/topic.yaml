            level: C2
            text: { en: [{ term: vastly }, " goes with comparatives and change, ", { term: profoundly }, " with feeling and effect."], uk: [{ term: "vastly" }, " сполучається з вищим ступенем порівняння та зі зміною, ", { term: "profoundly" }, " — з почуттями та впливом."], es: [{ term: "vastly" }, " va con comparativos y con cambios; ", { term: "profoundly" }, ", con sentimientos y efectos."], pt: [{ term: "vastly" }, " vai com comparativos e mudança; ", { term: "profoundly" }, ", com sentimento e efeito."], fr: [{ term: "vastly" }, " se combine avec les comparatifs et le changement, ", { term: "profoundly" }, " avec le sentiment et l’effet."], de: [{ term: "vastly" }, " steht bei Komparativen und Veränderung, ", { term: "profoundly" }, " bei Gefühl und Wirkung."], it: [{ term: "vastly" }, " va con i comparativi e il cambiamento, ", { term: "profoundly" }, " con il sentimento e l'effetto."], pl: [{ term: "vastly" }, " łączy się ze stopniem wyższym i zmianą, ", { term: "profoundly" }, " z uczuciem i skutkiem."], tr: [{ term: "vastly" }, " karşılaştırma derecesi ve değişimle, ", { term: "profoundly" }, " duygu ve etkiyle kullanılır."], id: [{ term: "vastly" }, " dipakai dengan komparatif dan perubahan, ", { term: "profoundly" }, " dengan perasaan dan dampak."], vi: [{ term: "vastly" }, " đi với dạng so sánh hơn và sự thay đổi, ", { term: "profoundly" }, " đi với cảm xúc và tác động."] }

