          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, position: { en: "before the subject", uk: "перед підметом", es: "antes del sujeto", pt: "antes do sujeito", fr: "avant le sujet", de: "vor dem Subjekt", it: "prima del soggetto", pl: "przed podmiotem", tr: "öznenin önünde", id: "sebelum subjek", vi: "trước chủ ngữ" }, use: { en: "no one else said it", uk: "ніхто інший цього не казав", es: "nadie más lo dijo", pt: "ninguém mais disse isso", fr: "personne d’autre ne l’a dit", de: "sonst hat es niemand gesagt", it: "nessun altro l'ha detto", pl: "nikt inny tego nie powiedział", tr: "başka kimse bunu söylemedi", id: "tidak ada orang lain yang mengatakannya", vi: "không ai khác nói điều đó" }, ex: [{ target: Only }, " she said hello."], tr: { uk: "Тільки вона привіталася.", es: "Solo ella saludó.", pt: "Só ela disse oi.", fr: "Elle seule a dit bonjour.", de: "Nur sie hat Hallo gesagt.", it: "Solo lei ha salutato.", pl: "Tylko ona się przywitała.", tr: "Yalnızca o merhaba dedi.", id: "Hanya dia yang menyapa.", vi: "Chỉ có cô ấy chào." } }
          - { level: C1, position: { en: "before the verb", uk: "перед дієсловом", es: "antes del verbo", pt: "antes do verbo", fr: "avant le verbe", de: "vor dem Verb", it: "prima del verbo", pl: "przed czasownikiem", tr: "fiilin önünde", id: "sebelum kata kerja", vi: "trước động từ" }, use: { en: "she did nothing more than say it", uk: "вона лише це сказала й нічого більше", es: "no hizo nada más que decirlo", pt: "ela não fez nada além de dizer isso", fr: "elle n’a rien fait de plus que le dire", de: "sie hat es nur gesagt und sonst nichts getan", it: "non ha fatto altro che dirlo", pl: "nie zrobiła nic poza tym, że to powiedziała", tr: "onu söylemekten başka bir şey yapmadı", id: "dia tidak melakukan apa pun selain mengatakannya", vi: "cô ấy không làm gì hơn ngoài nói câu đó" }, ex: ["She ", { target: only }, " said hello."], tr: { uk: "Вона лише привіталася.", es: "Ella solo saludó.", pt: "Ela só disse oi.", fr: "Elle a seulement dit bonjour.", de: "Sie hat nur Hallo gesagt.", it: "Lei ha solo salutato.", pl: "Ona tylko się przywitała.", tr: "Sadece merhaba dedi.", id: "Dia hanya menyapa.", vi: "Cô ấy chỉ chào thôi." } }
          - { level: C1, position: { en: "before the object", uk: "перед додатком", es: "antes del objeto", pt: "antes do objeto", fr: "avant le complément", de: "vor dem Objekt", it: "prima del complemento", pl: "przed dopełnieniem", tr: "nesnenin önünde", id: "sebelum objek", vi: "trước tân ngữ" }, use: { en: "she said nothing else", uk: "вона не сказала нічого іншого", es: "no dijo nada más", pt: "ela não disse mais nada", fr: "elle n’a rien dit d’autre", de: "sie hat nichts anderes gesagt", it: "non ha detto nient'altro", pl: "nie powiedziała nic innego", tr: "başka bir şey söylemedi", id: "dia tidak mengatakan hal lain", vi: "cô ấy không nói gì khác" }, ex: ["She said ", { target: only }, " hello."], tr: { uk: "Вона сказала тільки привіт.", es: "Ella no dijo más que hola.", pt: "Ela não disse nada além de oi.", fr: "Elle n’a dit que bonjour.", de: "Sie hat nichts als Hallo gesagt.", it: "Ha detto soltanto ciao.", pl: "Powiedziała tylko cześć.", tr: "Merhabadan başka bir şey demedi.", id: "Dia hanya mengatakan halo.", vi: "Cô ấy chỉ nói mỗi câu xin chào." } }

