          - { key: adverb, label: { en: Adverb, uk: "Прислівник", es: "Adverbio", pt: "Advérbio", fr: "Adverbe", de: "Adverb", it: "Avverbio", pl: "Przysłówek", tr: "Zarf", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: with, label: { en: Goes with, uk: "Поєднується з", es: "Va con", pt: "Combina com", fr: "Se combine avec", de: "Steht bei", it: "Va con", pl: "Łączy się z", tr: "Birlikte kullanıldığı sözcükler", id: "Dipakai dengan", vi: "Đi với" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, adverb: deeply, with: { alternatives: [concerned, grateful, moved, ashamed] }, ex: { examples: [["We are ", { target: deeply grateful }, "."], ["She was ", { target: deeply moved }, "."]] }, tr: { uk: { examples: ["Ми глибоко вдячні.", "Вона була глибоко зворушена."] }, es: { examples: ["Estamos profundamente agradecidos.", "Ella estaba profundamente conmovida."] }, pt: { examples: ["Somos profundamente gratos.", "Ela ficou profundamente comovida."] }, fr: { examples: ["Nous sommes profondément reconnaissants.", "Elle a été profondément émue."] }, de: { examples: ["Wir sind zutiefst dankbar.", "Sie war zutiefst gerührt."] }, it: { examples: ["Siamo profondamente grati.", "Era profondamente commossa."] }, pl: { examples: ["Jesteśmy głęboko wdzięczni.", "Była głęboko poruszona."] }, tr: { examples: ["Derinden minnettarız.", "Derinden etkilendi."] }, id: { examples: ["Kami sangat berterima kasih.", "Dia sangat terharu."] }, vi: { examples: ["Chúng tôi vô cùng biết ơn.", "Cô ấy vô cùng xúc động."] } } }
          - { level: C1, adverb: highly, with: { alternatives: [unlikely, likely, successful, skilled] }, ex: { examples: [["It is ", { target: highly unlikely }, "."], ["He is a ", { target: highly skilled }, " nurse."]] }, tr: { uk: { examples: ["Це вкрай малоймовірно.", "Він — висококваліфікований медбрат."] }, es: { examples: ["Es muy poco probable.", "Es un enfermero muy capacitado."] }, pt: { examples: ["É muito improvável.", "Ele é um enfermeiro altamente qualificado."] }, fr: { examples: ["C’est très peu probable.", "C’est un infirmier hautement qualifié."] }, de: { examples: ["Das ist höchst unwahrscheinlich.", "Er ist ein hochqualifizierter Krankenpfleger."] }, it: { examples: ["È molto improbabile.", "È un infermiere altamente qualificato."] }, pl: { examples: ["To wysoce nieprawdopodobne.", "Jest wysoce wykwalifikowanym pielęgniarzem."] }, tr: { examples: ["Bu çok düşük ihtimal.", "O, son derece yetenekli bir hemşire."] }, id: { examples: ["Itu sangat tidak mungkin terjadi.", "Dia perawat yang sangat terampil."] }, vi: { examples: ["Điều đó rất khó xảy ra.", "Anh ấy là một y tá có tay nghề rất cao."] } } }
          - { level: C1, adverb: bitterly, with: { alternatives: [cold, disappointed] }, ex: { examples: [["It was ", { target: bitterly cold }, " last night."], ["He was ", { target: bitterly disappointed }, "."]] }, tr: { uk: { examples: ["Минулої ночі було пронизливо холодно.", "Він був гірко розчарований."] }, es: { examples: ["Anoche hacía un frío cortante.", "Estaba amargamente decepcionado."] }, pt: { examples: ["Ontem à noite estava um frio cortante.", "Ele ficou amargamente decepcionado."] }, fr: { examples: ["Il faisait un froid mordant hier soir.", "Il était amèrement déçu."] }, de: { examples: ["Gestern Nacht war es bitterkalt.", "Er war bitter enttäuscht."] }, it: { examples: ["Ieri notte faceva un freddo pungente.", "Era amaramente deluso."] }, pl: { examples: ["Zeszłej nocy było przeraźliwie zimno.", "Był gorzko rozczarowany."] }, tr: { examples: ["Dün gece hava çok sert soğuktu.", "Çok acı bir hayal kırıklığı yaşadı."] }, id: { examples: ["Tadi malam cuacanya dingin menusuk.", "Dia sangat kecewa."] }, vi: { examples: ["Đêm qua trời lạnh buốt giá.", "Anh ấy thất vọng cay đắng."] } } }
          - { level: C1, adverb: utterly, with: { alternatives: [ridiculous, useless, hopeless] }, ex: ["The idea is ", { target: utterly ridiculous }, "."], tr: { uk: "Ця ідея цілковито безглузда.", es: "La idea es totalmente ridícula.", pt: "A ideia é completamente ridícula.", fr: "L’idée est parfaitement ridicule.", de: "Die Idee ist völlig lächerlich.", it: "L'idea è assolutamente ridicola.", pl: "Ten pomysł jest zupełnie absurdalny.", tr: "Fikir tamamen saçma.", id: "Ide itu benar-benar konyol.", vi: "Ý tưởng này hoàn toàn lố bịch." } }
          - { level: C1, adverb: fully, with: { alternatives: [aware, prepared, understand] }, ex: ["I am ", { target: fully aware }, " of the risks."], tr: { uk: "Я цілком усвідомлюю ризики.", es: "Soy plenamente consciente de los riesgos.", pt: "Estou plenamente ciente dos riscos.", fr: "Je suis pleinement conscient des risques.", de: "Ich bin mir der Risiken voll bewusst.", it: "Sono pienamente consapevole dei rischi.", pl: "W pełni zdaję sobie sprawę z ryzyka.", tr: "Riskleri tamamen biliyorum.", id: "Saya sepenuhnya sadar akan risikonya.", vi: "Tôi hoàn toàn nhận thức được những rủi ro." } }
          - { level: C1, adverb: perfectly, with: { alternatives: [clear, normal, fine] }, ex: ["It's ", { target: perfectly normal }, " to feel nervous."], tr: { uk: "Цілком нормально хвилюватися.", es: "Es perfectamente normal sentirse nervioso.", pt: "É perfeitamente normal sentir-se nervoso.", fr: "Il est parfaitement normal d’être nerveux.", de: "Es ist völlig normal, nervös zu sein.", it: "È perfettamente normale sentirsi nervosi.", pl: "To całkiem normalne, że się denerwujesz.", tr: "Gergin hissetmek gayet normal.", id: "Merasa gugup itu sangat wajar.", vi: "Cảm thấy lo lắng là hoàn toàn bình thường." } }
          - { level: C1, adverb: painfully, with: { alternatives: [slow, shy, obvious] }, ex: ["The queue was ", { target: painfully slow }, "."], tr: { uk: "Черга рухалася нестерпно повільно.", es: "La fila avanzaba con una lentitud desesperante.", pt: "A fila estava dolorosamente lenta.", fr: "La file d’attente était d’une lenteur exaspérante.", de: "Die Schlange war quälend langsam.", it: "La fila era dolorosamente lenta.", pl: "Kolejka posuwała się boleśnie wolno.", tr: "Kuyruk acı verecek kadar yavaş ilerliyordu.", id: "Antreannya bergerak sangat lambat.", vi: "Hàng người xếp chậm đến mức khó chịu." } }
          - { level: C1, adverb: widely, with: { alternatives: [known, believed, used] }, ex: ["The song is ", { target: widely known }, "."], tr: { uk: "Ця пісня широко відома.", es: "La canción es ampliamente conocida.", pt: "A música é amplamente conhecida.", fr: "La chanson est largement connue.", de: "Das Lied ist weithin bekannt.", it: "La canzone è ampiamente conosciuta.", pl: "Ta piosenka jest powszechnie znana.", tr: "Şarkı çok yaygın olarak bilinir.", id: "Lagu itu dikenal luas.", vi: "Bài hát này được biết đến rộng rãi." } }
          - { level: C1, adverb: { alternatives: [strongly, firmly] }, with: { alternatives: [recommend, believe, disagree, support] }, ex: { examples: [["I ", { target: strongly recommend }, " this book."], ["We ", { target: firmly believe }, " in her."]] }, tr: { uk: { examples: ["Я наполегливо рекомендую цю книгу.", "Ми твердо в неї віримо."] }, es: { examples: ["Recomiendo encarecidamente este libro.", "Creemos firmemente en ella."] }, pt: { examples: ["Recomendo fortemente este livro.", "Acreditamos firmemente nela."] }, fr: { examples: ["Je recommande vivement ce livre.", "Nous croyons fermement en elle."] }, de: { examples: ["Ich empfehle dieses Buch nachdrücklich.", "Wir glauben fest an sie."] }, it: { examples: ["Consiglio vivamente questo libro.", "Crediamo fermamente in lei."] }, pl: { examples: ["Gorąco polecam tę książkę.", "Mocno w nią wierzymy."] }, tr: { examples: ["Bu kitabı şiddetle tavsiye ederim.", "Ona sıkı sıkıya inanıyoruz."] }, id: { examples: ["Saya sangat merekomendasikan buku ini.", "Kami sangat percaya padanya."] }, vi: { examples: ["Tôi cực kỳ khuyên bạn đọc cuốn sách này.", "Chúng tôi tin tưởng cô ấy hết lòng."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["The intensifier follows the meaning of the word: feelings take ", { term: deeply }, ", chances take ", { term: highly }, ", clarity takes ", { term: perfectly }, "."], uk: ["Підсилювач залежить від значення слова: почуття сполучаються з ", { term: "deeply" }, ", імовірність — з ", { term: "highly" }, ", ясність — з ", { term: "perfectly" }, "."], es: ["El intensificador depende del significado de la palabra: los sentimientos llevan ", { term: "deeply" }, ", las probabilidades llevan ", { term: "highly" }, " y la claridad lleva ", { term: "perfectly" }, "."], pt: ["O intensificador depende do significado da palavra: sentimentos levam ", { term: "deeply" }, ", probabilidades levam ", { term: "highly" }, " e clareza leva ", { term: "perfectly" }, "."], fr: ["Le renforçateur dépend du sens du mot : les sentiments prennent ", { term: "deeply" }, ", les chances prennent ", { term: "highly" }, " et la clarté prend ", { term: "perfectly" }, "."], de: ["Der Verstärker richtet sich nach der Bedeutung des Wortes: Gefühle stehen mit ", { term: "deeply" }, ", Wahrscheinlichkeiten mit ", { term: "highly" }, ", Klarheit mit ", { term: "perfectly" }, "."], it: ["Il rafforzativo dipende dal significato della parola: i sentimenti prendono ", { term: "deeply" }, ", le probabilità ", { term: "highly" }, ", la chiarezza ", { term: "perfectly" }, "."], pl: ["Wzmacniacz zależy od znaczenia słowa: uczucia łączą się z ", { term: "deeply" }, ", szanse z ", { term: "highly" }, ", jasność z ", { term: "perfectly" }, "."], tr: ["Pekiştirici sözcüğün anlamına göre seçilir: duygular ", { term: "deeply" }, ", olasılıklar ", { term: "highly" }, ", açıklık ", { term: "perfectly" }, " alır."], id: ["Penegas dipilih sesuai makna kata: perasaan memakai ", { term: "deeply" }, ", kemungkinan memakai ", { term: "highly" }, ", kejelasan memakai ", { term: "perfectly" }, "."], vi: ["Từ nhấn mạnh phụ thuộc vào nghĩa của từ: cảm xúc đi với ", { term: "deeply" }, ", khả năng đi với ", { term: "highly" }, ", sự rõ ràng đi với ", { term: "perfectly" }, "."] }

  - title: { en: Adverbs before participles, uk: "Прислівники перед дієприкметниками", es: "Adverbios ante participios", pt: "Advérbios antes de particípios", fr: "Adverbes devant les participes", de: "Adverbien vor Partizipien", it: "Avverbi prima dei participi", pl: "Przysłówki przed imiesłowami", tr: "Ortaçlardan önce gelen zarflar", id: "Kata keterangan sebelum partisip", vi: "Trạng từ trước phân từ" }
    role: own
