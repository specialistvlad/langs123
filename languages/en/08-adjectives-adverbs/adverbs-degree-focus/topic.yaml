        rows:
          - { level: B2, adverbs: { alternatives: [only, merely, simply] }, use: { en: "nothing more than", uk: "не більше ніж", es: "nada más que", pt: "nada mais que", fr: "rien de plus que", de: "nicht mehr als", it: "nient'altro che", pl: "nic więcej niż", tr: "yalnızca, ondan fazlası değil", id: "tidak lebih dari", vi: "không hơn" }, ex: { examples: [["She ", { target: only }, " wants a coffee."], ["It is ", { target: merely }, " a suggestion."], ["You ", { target: simply }, " press the button."]] }, tr: { uk: { examples: ["Вона хоче лише каву.", "Це лише пропозиція.", "Ти просто натискаєш кнопку."] }, es: { examples: ["Ella solo quiere un café.", "Es meramente una sugerencia.", "Solo tienes que presionar el botón."] }, pt: { examples: ["Ela só quer um café.", "É apenas uma sugestão.", "Você simplesmente aperta o botão."] }, fr: { examples: ["Elle veut seulement un café.", "Ce n’est qu’une suggestion.", "Il suffit d’appuyer sur le bouton."] }, de: { examples: ["Sie möchte nur einen Kaffee.", "Es ist lediglich ein Vorschlag.", "Du drückst einfach den Knopf."] }, it: { examples: ["Lei vuole solo un caffè.", "È semplicemente un suggerimento.", "Basta premere il pulsante."] }, pl: { examples: ["Ona chce tylko kawę.", "To jedynie sugestia.", "Po prostu naciskasz przycisk."] }, tr: { examples: ["Yalnızca bir kahve istiyor.", "Bu yalnızca bir öneri.", "Sadece düğmeye basarsın."] }, id: { examples: ["Dia hanya ingin secangkir kopi.", "Itu hanyalah sebuah saran.", "Kamu tinggal menekan tombolnya."] }, vi: { examples: ["Cô ấy chỉ muốn một ly cà phê.", "Đó chỉ là một lời gợi ý.", "Bạn chỉ cần nhấn nút."] } } }
          - { level: B2, adverbs: even, use: { en: "more than expected", uk: "більше, ніж очікувалося", es: "más de lo esperado", pt: "mais do que o esperado", fr: "plus que prévu", de: "mehr als erwartet", it: "più del previsto", pl: "więcej, niż się spodziewano", tr: "beklenenden fazla", id: "lebih dari yang diharapkan", vi: "hơn mức mong đợi" }, ex: [{ target: Even }, " a child can do it."], tr: { uk: "Навіть дитина може це зробити.", es: "Hasta un niño puede hacerlo.", pt: "Até uma criança consegue fazer isso.", fr: "Même un enfant peut le faire.", de: "Sogar ein Kind kann das.", it: "Anche un bambino può farlo.", pl: "Nawet dziecko to potrafi.", tr: "Bir çocuk bile yapabilir.", id: "Anak kecil pun bisa melakukannya.", vi: "Ngay cả trẻ con cũng làm được." } }
          - { level: B2, adverbs: { alternatives: [also, too, as well] }, use: { en: "in addition; also goes before the main verb, too and as well at the end", uk: "додатково; also стоїть перед основним дієсловом, too і as well — наприкінці", es: "además; also va antes del verbo principal; too y as well, al final", pt: "além disso; also vai antes do verbo principal; too e as well, no fim", fr: "en plus ; also se place avant le verbe principal ; too et as well, à la fin", de: "zusätzlich; also steht vor dem Hauptverb, too und as well am Ende", it: "in aggiunta; also va prima del verbo principale; too e as well alla fine", pl: "dodatkowo; also stoi przed czasownikiem głównym, too i as well — na końcu", tr: "ek olarak; also ana fiilden önce, too ve as well sonda gelir", id: "sebagai tambahan; also diletakkan sebelum kata kerja utama, too dan as well di akhir", vi: "thêm vào đó; also đứng trước động từ chính, too và as well đứng ở cuối" }, ex: { examples: [["She ", { target: also }, " speaks French."], ["She speaks French ", { target: too }, "."]] }, tr: { uk: { examples: ["Вона також говорить французькою.", "Вона говорить і французькою."] }, es: { examples: ["Ella también habla francés.", "Ella habla francés también."] }, pt: { examples: ["Ela também fala francês.", "Ela fala francês também."] }, fr: { examples: ["Elle parle aussi français.", "Elle parle français aussi."] }, de: { examples: ["Sie spricht ebenfalls Französisch.", "Sie spricht auch Französisch."] }, it: { examples: ["Lei parla anche francese.", "Parla francese anche lei."] }, pl: { examples: ["Ona także mówi po francusku.", "Ona też mówi po francusku."] }, tr: { examples: ["O da Fransızca konuşur.", "Fransızca da konuşur."] }, id: { examples: ["Dia juga berbicara bahasa Prancis.", "Dia berbicara bahasa Prancis juga."] }, vi: { examples: ["Cô ấy cũng nói tiếng Pháp.", "Cô ấy nói tiếng Pháp nữa."] } } }
          - { level: B2, adverbs: { alternatives: [especially, particularly] }, use: { en: "above all the others", uk: "понад усі інші", es: "por encima de todos los demás", pt: "acima de todos os outros", fr: "plus que tout le reste", de: "mehr als alles andere", it: "più di tutti gli altri", pl: "bardziej niż wszystkie inne", tr: "diğerlerinin hepsinden çok", id: "lebih dari yang lain", vi: "hơn tất cả những cái còn lại" }, ex: { examples: [["I love fruit, ", { target: especially }, " apples."], ["The food was ", { target: particularly }, " good."]] }, tr: { uk: { examples: ["Я люблю фрукти, особливо яблука.", "Їжа була особливо смачна."] }, es: { examples: ["Me encantan las frutas, especialmente las manzanas.", "La comida estuvo particularmente buena."] }, pt: { examples: ["Adoro frutas, especialmente maçãs.", "A comida estava particularmente boa."] }, fr: { examples: ["J’adore les fruits, surtout les pommes.", "Le repas était particulièrement bon."] }, de: { examples: ["Ich liebe Obst, besonders Äpfel.", "Das Essen war besonders gut."] }, it: { examples: ["Adoro la frutta, soprattutto le mele.", "Il cibo era particolarmente buono."] }, pl: { examples: ["Uwielbiam owoce, zwłaszcza jabłka.", "Jedzenie było szczególnie dobre."] }, tr: { examples: ["Meyveyi severim, özellikle elmayı.", "Yemek özellikle iyiydi."] }, id: { examples: ["Saya suka buah, terutama apel.", "Makanannya enak sekali."] }, vi: { examples: ["Tôi thích trái cây, đặc biệt là táo.", "Đồ ăn đặc biệt ngon."] } } }
          - { level: B2, adverbs: { alternatives: [mainly, mostly] }, use: { en: "in most cases", uk: "у більшості випадків", es: "en la mayoría de los casos", pt: "na maioria dos casos", fr: "dans la plupart des cas", de: "in den meisten Fällen", it: "nella maggior parte dei casi", pl: "w większości przypadków", tr: "çoğu durumda", id: "dalam kebanyakan kasus", vi: "trong hầu hết trường hợp" }, ex: { examples: [["We sell ", { target: mainly }, " books."], ["The guests were ", { target: mostly }, " students."]] }, tr: { uk: { examples: ["Ми продаємо переважно книжки.", "Гості здебільшого були студентами."] }, es: { examples: ["Vendemos principalmente libros.", "Los invitados eran en su mayoría estudiantes."] }, pt: { examples: ["Vendemos principalmente livros.", "Os convidados eram, na maioria, estudantes."] }, fr: { examples: ["Nous vendons principalement des livres.", "Les invités étaient pour la plupart des étudiants."] }, de: { examples: ["Wir verkaufen hauptsächlich Bücher.", "Die Gäste waren größtenteils Studenten."] }, it: { examples: ["Vendiamo principalmente libri.", "Gli ospiti erano per lo più studenti."] }, pl: { examples: ["Sprzedajemy głównie książki.", "Goście byli w większości studentami."] }, tr: { examples: ["Çoğunlukla kitap satıyoruz.", "Konukların çoğu öğrenciydi."] }, id: { examples: ["Kami terutama menjual buku.", "Para tamu kebanyakan adalah mahasiswa."] }, vi: { examples: ["Chúng tôi chủ yếu bán sách.", "Khách mời phần lớn là sinh viên."] } } }
          - { level: B2, adverbs: { alternatives: [exactly, precisely] }, use: { en: "no more and no less", uk: "ні більше, ні менше", es: "ni más ni menos", pt: "nem mais nem menos", fr: "ni plus ni moins", de: "nicht mehr und nicht weniger", it: "né più né meno", pl: "ani więcej, ani mniej", tr: "ne fazla ne eksik", id: "tidak lebih dan tidak kurang", vi: "không hơn không kém" }, ex: { examples: [["It costs ", { target: exactly }, " ten pounds."], ["We meet at ", { target: precisely }, " nine."]] }, tr: { uk: { examples: ["Це коштує рівно десять фунтів.", "Ми зустрічаємося рівно о дев’ятій."] }, es: { examples: ["Cuesta exactamente diez libras.", "Nos vemos exactamente a las nueve."] }, pt: { examples: ["Custa exatamente dez libras.", "Nos encontramos exatamente às nove."] }, fr: { examples: ["Cela coûte exactement dix livres.", "Nous nous retrouvons à neuf heures précises."] }, de: { examples: ["Es kostet genau zehn Pfund.", "Wir treffen uns Punkt neun."] }, it: { examples: ["Costa esattamente dieci sterline.", "Ci vediamo alle nove in punto."] }, pl: { examples: ["To kosztuje dokładnie dziesięć funtów.", "Spotykamy się równo o dziewiątej."] }, tr: { examples: ["Tam on pound tutuyor.", "Tam dokuzda buluşuyoruz."] }, id: { examples: ["Harganya tepat sepuluh pound.", "Kami bertemu tepat pukul sembilan."] }, vi: { examples: ["Giá chính xác là mười bảng Anh.", "Chúng ta gặp nhau đúng chín giờ."] } } }
