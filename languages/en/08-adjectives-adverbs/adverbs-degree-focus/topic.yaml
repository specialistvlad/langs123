title: { en: "Adverbs of Degree, Focus and Attitude", uk: "Прислівники ступеня, фокусу та ставлення", es: "Adverbios de grado, de foco y de actitud", pt: "Advérbios de grau, de foco e de atitude", fr: "Adverbes de degré, de focalisation et d’attitude", de: "Adverbien des Grades, des Fokus und der Einstellung", it: "Avverbi di grado, di focalizzazione e di atteggiamento", pl: "Przysłówki stopnia, wyróżniające i postawy mówiącego", tr: "Derece, odak ve tutum zarfları", id: "Kata keterangan derajat, fokus, dan sikap", vi: "Trạng từ chỉ mức độ, tiêu điểm và thái độ" }
summary:
  lead:
    en: ["Degree adverbs say how much (", { term: very }, ", ", { term: absolutely }, "), focus adverbs single out a word (", { term: only }, ") and stance adverbs show the speaker's view (", { term: frankly }, ")."]
    uk: ["Прислівники ступеня показують, наскільки (", { term: "very" }, ", ", { term: "absolutely" }, "), фокусні виділяють слово (", { term: "only" }, "), а прислівники ставлення передають погляд мовця (", { term: "frankly" }, ")."]
    es: ["Los adverbios de grado dicen cuánto (", { term: "very" }, ", ", { term: "absolutely" }, "), los de foco destacan una palabra (", { term: "only" }, ") y los de actitud muestran la postura del hablante (", { term: "frankly" }, ")."]
    pt: ["Os advérbios de grau dizem quanto (", { term: "very" }, ", ", { term: "absolutely" }, "), os de foco destacam uma palavra (", { term: "only" }, ") e os de atitude mostram o ponto de vista do falante (", { term: "frankly" }, ")."]
    fr: ["Les adverbes de degré disent combien (", { term: "very" }, ", ", { term: "absolutely" }, "), ceux de focalisation isolent un mot (", { term: "only" }, "), ceux d’attitude montrent l’avis du locuteur (", { term: "frankly" }, ")."]
    de: ["Gradadverbien sagen, wie sehr (", { term: "very" }, ", ", { term: "absolutely" }, "), Fokusadverbien heben ein Wort hervor (", { term: "only" }, "), Einstellungsadverbien zeigen die Sicht des Sprechers (", { term: "frankly" }, ")."]
    it: ["Gli avverbi di grado dicono quanto (", { term: "very" }, ", ", { term: "absolutely" }, "), quelli di focalizzazione isolano una parola (", { term: "only" }, ") e quelli di atteggiamento l'opinione (", { term: "frankly" }, ")."]
    pl: ["Przysłówki stopnia mówią, jak bardzo (", { term: "very" }, ", ", { term: "absolutely" }, "), wyróżniające wskazują słowo (", { term: "only" }, "), a przysłówki postawy pokazują punkt widzenia mówiącego (", { term: "frankly" }, ")."]
    tr: ["Derece zarfları ne kadar olduğunu (", { term: "very" }, ", ", { term: "absolutely" }, "), odak zarfları bir sözcüğü (", { term: "only" }, "), tutum zarfları konuşurun bakışını (", { term: "frankly" }, ") gösterir."]
    id: ["Kata keterangan derajat menyatakan seberapa (", { term: "very" }, ", ", { term: "absolutely" }, "), fokus menyoroti satu kata (", { term: "only" }, "), dan sikap menunjukkan pandangan pembicara (", { term: "frankly" }, ")."]
    vi: ["Trạng từ chỉ mức độ cho biết bao nhiêu (", { term: "very" }, ", ", { term: "absolutely" }, "), trạng từ tiêu điểm nhấn vào một từ (", { term: "only" }, "), trạng từ thái độ cho thấy quan điểm người nói (", { term: "frankly" }, ")."]
  rule:
    en: ["Gradable adjectives take ", { term: very }, "; extreme adjectives take ", { term: absolutely }, ":"]
    uk: ["Градуйовані прикметники сполучаються з ", { term: "very" }, ", крайні — з ", { term: "absolutely" }, ":"]
    es: ["Los adjetivos graduables llevan ", { term: "very" }, "; los extremos llevan ", { term: "absolutely" }, ":"]
    pt: ["Os adjetivos graduáveis levam ", { term: "very" }, "; os extremos levam ", { term: "absolutely" }, ":"]
    fr: ["Les adjectifs gradables se construisent avec ", { term: "very" }, " ; les adjectifs extrêmes avec ", { term: "absolutely" }, " :"]
    de: ["Graduierbare Adjektive stehen mit ", { term: "very" }, "; extreme Adjektive mit ", { term: "absolutely" }, ":"]
    it: ["Gli aggettivi graduabili prendono ", { term: "very" }, "; quelli estremi prendono ", { term: "absolutely" }, ":"]
    pl: ["Przymiotniki stopniowalne łączą się z ", { term: "very" }, ", a skrajne z ", { term: "absolutely" }, ":"]
    tr: ["Derecelendirilebilir sıfatlar ", { term: "very" }, ", uç anlamlı sıfatlar ", { term: "absolutely" }, " alır:"]
    id: ["Kata sifat bertingkat memakai ", { term: "very" }, "; kata sifat ekstrem memakai ", { term: "absolutely" }, ":"]
    vi: ["Tính từ có mức độ dùng ", { term: "very" }, "; tính từ cực độ dùng ", { term: "absolutely" }, ":"]
  ex: { examples: [["It's ", { target: "very cold" }, "."], ["It's ", { target: "absolutely freezing" }, "."]] }

