        rows:
          - { level: C1, adverbs: { alternatives: [solely, purely] }, use: { en: "only, and nothing else", uk: "тільки це й більше нічого", es: "solo eso y nada más", pt: "só isso e nada mais", fr: "seulement cela et rien d’autre", de: "nur das und nichts anderes", it: "solo questo e nient'altro", pl: "tylko to i nic innego", tr: "yalnızca bu, başka hiçbir şey değil", id: "hanya itu, tidak ada yang lain", vi: "chỉ vậy, không gì khác" }, ex: { examples: [["The decision was ", { target: solely }, " mine."], ["I did it ", { target: purely }, " for fun."]] }, tr: { uk: { examples: ["Це рішення було лише моїм.", "Я зробив це суто заради розваги."] }, es: { examples: ["La decisión fue únicamente mía.", "Lo hice puramente por diversión."] }, pt: { examples: ["A decisão foi exclusivamente minha.", "Fiz isso puramente por diversão."] }, fr: { examples: ["La décision était uniquement la mienne.", "Je l’ai fait uniquement pour m’amuser."] }, de: { examples: ["Die Entscheidung war allein meine.", "Ich habe es rein zum Spaß getan."] }, it: { examples: ["La decisione è stata unicamente mia.", "L'ho fatto puramente per divertimento."] }, pl: { examples: ["Decyzja należała wyłącznie do mnie.", "Zrobiłem to wyłącznie dla zabawy."] }, tr: { examples: ["Karar yalnızca bana aitti.", "Bunu sırf eğlence için yaptım."] }, id: { examples: ["Keputusan itu sepenuhnya milik saya.", "Saya melakukannya semata-mata untuk bersenang-senang."] }, vi: { examples: ["Quyết định đó hoàn toàn là của tôi.", "Tôi làm việc đó chỉ để cho vui."] } } }
          - { level: C1, adverbs: chiefly, use: { en: "mainly; formal", uk: "переважно; формальне слово", es: "principalmente; formal", pt: "principalmente; formal", fr: "principalement ; soutenu", de: "hauptsächlich; formell", it: "principalmente; formale", pl: "głównie; formalne", tr: "esas olarak; resmî", id: "terutama; formal", vi: "chủ yếu; trang trọng" }, ex: ["She is known ", { target: chiefly }, " for her poems."], tr: { uk: "Вона відома насамперед своїми віршами.", es: "Es conocida principalmente por sus poemas.", pt: "Ela é conhecida principalmente por seus poemas.", fr: "Elle est connue principalement pour ses poèmes.", de: "Sie ist vor allem für ihre Gedichte bekannt.", it: "È nota soprattutto per le sue poesie.", pl: "Jest znana przede wszystkim ze swoich wierszy.", tr: "Esas olarak şiirleriyle tanınır.", id: "Dia terutama dikenal lewat puisi-puisinya.", vi: "Cô ấy nổi tiếng chủ yếu nhờ thơ của mình." } }
          - { level: C1, adverbs: { alternatives: [notably, in particular] }, use: { en: "singles out the most important example", uk: "виділяє найважливіший приклад", es: "destaca el ejemplo más importante", pt: "destaca o exemplo mais importante", fr: "met en avant l’exemple le plus important", de: "hebt das wichtigste Beispiel hervor", it: "mette in risalto l'esempio più importante", pl: "wyróżnia najważniejszy przykład", tr: "en önemli örneği öne çıkarır", id: "menyoroti contoh yang paling penting", vi: "nêu bật ví dụ quan trọng nhất" }, ex: { examples: [["Many cities, ", { target: notably }, " Rome, are crowded."], ["I enjoyed the music ", { target: in particular }, "."]] }, tr: { uk: { examples: ["Багато міст, зокрема Рим, переповнені.", "Мені особливо сподобалася музика."] }, es: { examples: ["Muchas ciudades, en particular Roma, están abarrotadas.", "Disfruté especialmente la música."] }, pt: { examples: ["Muitas cidades, especialmente Roma, são lotadas.", "Gostei especialmente da música."] }, fr: { examples: ["Beaucoup de villes, notamment Rome, sont bondées.", "J’ai surtout apprécié la musique."] }, de: { examples: ["Viele Städte, insbesondere Rom, sind überfüllt.", "Besonders die Musik hat mir gefallen."] }, it: { examples: ["Molte città, in particolare Roma, sono affollate.", "Ho apprezzato soprattutto la musica."] }, pl: { examples: ["Wiele miast, zwłaszcza Rzym, jest zatłoczonych.", "Szczególnie spodobała mi się muzyka."] }, tr: { examples: ["Birçok şehir, özellikle Roma, kalabalık.", "Özellikle müziği beğendim."] }, id: { examples: ["Banyak kota, terutama Roma, sangat ramai.", "Saya terutama menikmati musiknya."] }, vi: { examples: ["Nhiều thành phố, nổi bật là Rome, rất đông đúc.", "Tôi đặc biệt thích phần âm nhạc."] } } }
          - { level: C1, adverbs: { alternatives: [not only, not just] }, use: { en: "adds a second point", uk: "додає другий пункт", es: "añade un segundo punto", pt: "acrescenta um segundo ponto", fr: "ajoute un deuxième point", de: "fügt einen zweiten Punkt hinzu", it: "aggiunge un secondo punto", pl: "dodaje drugi punkt", tr: "ikinci bir noktayı ekler", id: "menambahkan poin kedua", vi: "thêm một ý thứ hai" }, ex: { examples: [["The food is ", { target: not only }, " cheap but also good."], ["It is ", { target: not just }, " a game."]] }, tr: { uk: { examples: ["Їжа не тільки дешева, а й смачна.", "Це не просто гра."] }, es: { examples: ["La comida no solo es barata, sino también buena.", "No es solo un juego."] }, pt: { examples: ["A comida não é só barata, mas também boa.", "Não é apenas um jogo."] }, fr: { examples: ["La nourriture n’est pas seulement bon marché, elle est aussi bonne.", "Ce n’est pas juste un jeu."] }, de: { examples: ["Das Essen ist nicht nur billig, sondern auch gut.", "Es ist nicht nur ein Spiel."] }, it: { examples: ["Il cibo non è solo economico, ma anche buono.", "Non è solo un gioco."] }, pl: { examples: ["Jedzenie jest nie tylko tanie, ale i dobre.", "To nie tylko gra."] }, tr: { examples: ["Yemek yalnızca ucuz değil, aynı zamanda lezzetli.", "Bu sadece bir oyun değil."] }, id: { examples: ["Makanannya tidak hanya murah, tetapi juga enak.", "Ini bukan sekadar permainan."] }, vi: { examples: ["Đồ ăn không chỉ rẻ mà còn ngon.", "Đây không chỉ là một trò chơi."] } } }
          - { level: C1, adverbs: not even, use: { en: "not the least likely person or thing", uk: "жодна, навіть найменш імовірна, людина чи річ", es: "ni siquiera la persona o cosa menos probable", pt: "nem mesmo a pessoa ou coisa menos provável", fr: "pas même la personne ou la chose la moins probable", de: "nicht einmal die unwahrscheinlichste Person oder Sache", it: "nemmeno la persona o la cosa meno probabile", pl: "nawet najmniej prawdopodobna osoba lub rzecz nie", tr: "en olası olmayan kişi ya da şey bile değil", id: "bahkan orang atau benda yang paling kecil kemungkinannya pun tidak", vi: "ngay cả người hay vật ít có khả năng nhất cũng không" }, ex: [{ target: Not even }, " the teacher knew the answer."], tr: { uk: "Навіть учитель не знав відповіді.", es: "Ni siquiera el profesor sabía la respuesta.", pt: "Nem o professor sabia a resposta.", fr: "Même le professeur ne connaissait pas la réponse.", de: "Nicht einmal der Lehrer kannte die Antwort.", it: "Nemmeno l'insegnante sapeva la risposta.", pl: "Nawet nauczyciel nie znał odpowiedzi.", tr: "Öğretmen bile cevabı bilmiyordu.", id: "Bahkan guru pun tidak tahu jawabannya.", vi: "Ngay cả thầy giáo cũng không biết câu trả lời." } }
