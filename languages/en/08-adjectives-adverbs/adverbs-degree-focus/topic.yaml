        rows:
          - { level: B2, use: { en: [{ term: just }, " means exactly"], uk: [{ term: "just" }, " означає «точно»"], es: [{ term: "just" }, " significa «exactamente»"], pt: [{ term: "just" }, " significa “exatamente”"], fr: [{ term: "just" }, " signifie « exactement »"], de: [{ term: "just" }, " bedeutet „genau“"], it: [{ term: "just" }, " significa «esattamente»"], pl: [{ term: "just" }, " znaczy „dokładnie”"], tr: [{ term: "just" }, " “tam olarak” anlamına gelir"], id: [{ term: "just" }, " berarti “tepat”"], vi: [{ term: "just" }, " có nghĩa là “chính xác”"] }, ex: { examples: [["The soup is ", { target: just }, " right."], ["It looks ", { target: just }, " like mine."]] }, tr: { uk: { examples: ["Суп саме такий, як треба.", "Воно виглядає точнісінько як моє."] }, es: { examples: ["La sopa está justo en su punto.", "Se ve exactamente como el mío."] }, pt: { examples: ["A sopa está no ponto exato.", "Parece exatamente com o meu."] }, fr: { examples: ["La soupe est juste comme il faut.", "Cela ressemble exactement au mien."] }, de: { examples: ["Die Suppe ist genau richtig.", "Es sieht genauso aus wie meins."] }, it: { examples: ["La zuppa è proprio come deve essere.", "Sembra proprio uguale al mio."] }, pl: { examples: ["Zupa jest w sam raz.", "Wygląda dokładnie jak mój."] }, tr: { examples: ["Çorba tam kıvamında.", "Tıpkı benimkine benziyor."] }, id: { examples: ["Supnya pas sekali.", "Kelihatannya persis seperti punya saya."] }, vi: { examples: ["Món súp vừa miệng.", "Trông giống hệt cái của tôi."] } } }
          - { level: B2, use: { en: [{ term: just }, " means only"], uk: [{ term: "just" }, " означає «лише»"], es: [{ term: "just" }, " significa «solo»"], pt: [{ term: "just" }, " significa “apenas”"], fr: [{ term: "just" }, " signifie « seulement »"], de: [{ term: "just" }, " bedeutet „nur“"], it: [{ term: "just" }, " significa «solo»"], pl: [{ term: "just" }, " znaczy „tylko”"], tr: [{ term: "just" }, " “yalnızca” anlamına gelir"], id: [{ term: "just" }, " berarti “hanya”"], vi: [{ term: "just" }, " có nghĩa là “chỉ”"] }, ex: ["It will take ", { target: just }, " a minute."], tr: { uk: "Це займе лише хвилину.", es: "Solo tomará un minuto.", pt: "Vai levar só um minuto.", fr: "Cela ne prendra qu’une minute.", de: "Es dauert nur eine Minute.", it: "Ci vorrà solo un minuto.", pl: "To zajmie tylko minutę.", tr: "Yalnızca bir dakika sürecek.", id: "Ini hanya akan memakan waktu semenit.", vi: "Chỉ mất một phút thôi." } }
          - { level: B2, use: { en: [{ term: just }, " means at this moment, or about to do something"], uk: [{ term: "just" }, " означає: у цю мить або ось-ось щось зробити"], es: [{ term: "just" }, " indica que algo ocurre en este momento o que está a punto de hacerse"], pt: [{ term: "just" }, " indica que algo ocorre neste momento ou que está prestes a acontecer"], fr: [{ term: "just" }, " indique le moment présent, ou qu’on est sur le point de faire quelque chose"], de: [{ term: "just" }, " bedeutet: in diesem Moment oder kurz davor, etwas zu tun"], it: [{ term: "just" }, " indica il momento presente, o che si sta per fare qualcosa"], pl: [{ term: "just" }, " oznacza: w tej chwili lub tuż przed zrobieniem czegoś"], tr: [{ term: "just" }, ", şu an ya da bir şeyi yapmak üzere olmak anlamına gelir"], id: [{ term: "just" }, " berarti pada saat ini, atau akan segera melakukan sesuatu"], vi: [{ term: "just" }, " nghĩa là ngay lúc này, hoặc sắp làm điều gì đó"] }, ex: { examples: [["I'm ", { target: just }, " leaving."], ["I was ", { target: just }, " going to call you."]] }, tr: { uk: { examples: ["Я саме йду.", "Я саме збирався тобі подзвонити."] }, es: { examples: ["Justo ahora me estoy yendo.", "Justo iba a llamarte."] }, pt: { examples: ["Estou saindo agora mesmo.", "Eu ia te ligar agora mesmo."] }, fr: { examples: ["Je suis juste en train de partir.", "J’étais justement sur le point de t’appeler."] }, de: { examples: ["Ich gehe gerade.", "Ich wollte dich gerade anrufen."] }, it: { examples: ["Sto giusto uscendo.", "Stavo giusto per chiamarti."] }, pl: { examples: ["Właśnie wychodzę.", "Właśnie miałem do ciebie dzwonić."] }, tr: { examples: ["Tam çıkıyorum.", "Tam seni arayacaktım."] }, id: { examples: ["Saya baru saja mau pergi.", "Saya baru saja mau meneleponmu."] }, vi: { examples: ["Tôi vừa định đi.", "Tôi vừa định gọi cho bạn."] } } }
          - { level: B2, use: { en: [{ term: just }, " in a request or an instruction makes it friendlier"], uk: [{ term: "just" }, " у проханні чи вказівці робить їх дружнішими"], es: [{ term: "just" }, " en una petición o en una instrucción la hace más amable"], pt: [{ term: "just" }, " em um pedido ou em uma instrução o torna mais amigável"], fr: [{ term: "just" }, " dans une demande ou une consigne la rend plus aimable"], de: [{ term: "just" }, " macht eine Bitte oder eine Anweisung freundlicher"], it: [{ term: "just" }, " in una richiesta o in un'istruzione la rende più cordiale"], pl: [{ term: "just" }, " w prośbie lub poleceniu czyni je bardziej uprzejmymi"], tr: [{ term: "just" }, ", bir rica ya da talimatta onu daha dostça yapar"], id: [{ term: "just" }, " dalam permintaan atau instruksi membuatnya terdengar lebih ramah"], vi: [{ term: "just" }, " trong lời nhờ hoặc chỉ dẫn làm câu nghe thân thiện hơn"] }, ex: { examples: [[{ target: Just }, " ask her."], ["Could I ", { target: just }, " borrow your pen?"]] }, tr: { uk: { examples: ["Просто запитай її.", "Чи можна мені позичити твою ручку?"] }, es: { examples: ["Solo pregúntale.", "¿Podría pedirte prestado tu bolígrafo?"] }, pt: { examples: ["É só perguntar a ela.", "Eu poderia pegar sua caneta emprestada?"] }, fr: { examples: ["Demande-lui simplement.", "Pourrais-je simplement t’emprunter ton stylo ?"] }, de: { examples: ["Frag sie einfach.", "Könnte ich mir kurz deinen Stift ausleihen?"] }, it: { examples: ["Chiedile e basta.", "Potrei prendere in prestito la tua penna?"] }, pl: { examples: ["Po prostu ją zapytaj.", "Czy mógłbym pożyczyć twój długopis?"] }, tr: { examples: ["Sadece ona sor.", "Kalemini ödünç alabilir miyim?"] }, id: { examples: ["Tanya saja dia.", "Bolehkah saya meminjam pulpenmu?"] }, vi: { examples: ["Cứ hỏi cô ấy đi.", "Tôi mượn bút của bạn một chút được không?"] } } }
