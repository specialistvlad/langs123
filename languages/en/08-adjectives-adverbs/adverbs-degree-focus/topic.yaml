        rows:
          - { level: C2, adverbs: { alternatives: [purportedly, ostensibly] }, use: { en: "claimed or apparent, but perhaps untrue", uk: "заявлений чи позірний, але, можливо, неправдивий", es: "afirmado o aparente, pero quizá falso", pt: "alegado ou aparente, mas talvez falso", fr: "affirmé ou apparent, mais peut-être faux", de: "behauptet oder scheinbar, aber vielleicht unwahr", it: "dichiarato o apparente, ma forse falso", pl: "rzekomy lub pozorny, ale być może nieprawdziwy", tr: "iddia edilen ya da görünürdeki, ama belki de doğru olmayan", id: "diklaim atau tampak, tetapi mungkin tidak benar", vi: "được cho là hoặc bề ngoài, nhưng có thể không đúng" }, ex: { examples: [["The photo was ", { target: purportedly }, " taken in 1950."], ["He left early, ", { target: ostensibly }, " to catch a train."]] }, tr: { uk: { examples: ["Фото нібито зроблено 1950 року.", "Він пішов рано, нібито щоб устигнути на потяг."] }, es: { examples: ["La foto supuestamente fue tomada en 1950.", "Se fue temprano, con el pretexto de tomar un tren."] }, pt: { examples: ["A foto foi supostamente tirada em 1950.", "Ele saiu cedo, aparentemente para pegar um trem."] }, fr: { examples: ["La photo aurait prétendument été prise en 1950.", "Il est parti tôt, soi-disant pour prendre un train."] }, de: { examples: ["Das Foto wurde angeblich 1950 aufgenommen.", "Er ging früh, angeblich um einen Zug zu erwischen."] }, it: { examples: ["La foto sarebbe stata scattata nel 1950.", "È andato via presto, ufficialmente per prendere un treno."] }, pl: { examples: ["Zdjęcie rzekomo zrobiono w 1950 roku.", "Wyszedł wcześnie, rzekomo, żeby zdążyć na pociąg."] }, tr: { examples: ["Fotoğrafın iddiaya göre 1950'de çekildiği söyleniyor.", "Erken ayrıldı, sözde bir trene yetişmek için."] }, id: { examples: ["Foto itu konon diambil pada tahun 1950.", "Dia pergi lebih awal, katanya untuk mengejar kereta."] }, vi: { examples: ["Bức ảnh được cho là chụp vào năm 1950.", "Anh ấy về sớm, với lý do là để kịp chuyến tàu."] } } }
          - { level: C2, adverbs: conceivably, use: { en: "it is possible to imagine", uk: "це можна уявити", es: "es posible imaginarlo", pt: "é possível imaginar", fr: "on peut l’imaginer", de: "man kann es sich vorstellen", it: "è possibile immaginarlo", pl: "można to sobie wyobrazić", tr: "hayal edilebilir", id: "bisa dibayangkan", vi: "có thể hình dung được" }, ex: ["The strike could ", { target: conceivably }, " last a month."], tr: { uk: "Страйк цілком може тривати місяць.", es: "La huelga podría llegar a durar un mes.", pt: "A greve poderia, em tese, durar um mês.", fr: "La grève pourrait éventuellement durer un mois.", de: "Der Streik könnte durchaus einen Monat dauern.", it: "Lo sciopero potrebbe anche durare un mese.", pl: "Strajk mógłby potencjalnie trwać miesiąc.", tr: "Grev bir ay bile sürebilir.", id: "Mogok itu bisa saja berlangsung sebulan.", vi: "Cuộc đình công có thể kéo dài cả tháng." } }
          - { level: C2, adverbs: inevitably, use: { en: "it cannot be avoided", uk: "цього не уникнути", es: "no se puede evitar", pt: "não dá para evitar", fr: "on ne peut pas l’éviter", de: "es lässt sich nicht vermeiden", it: "non si può evitare", pl: "nie da się tego uniknąć", tr: "kaçınılamaz", id: "tidak bisa dihindari", vi: "không thể tránh được" }, ex: ["Delays ", { target: inevitably }, " follow."], tr: { uk: "Затримки неминуче виникають.", es: "Inevitablemente hay retrasos.", pt: "Atrasos inevitavelmente ocorrem.", fr: "Des retards s’ensuivent inévitablement.", de: "Verzögerungen folgen unweigerlich.", it: "I ritardi seguono inevitabilmente.", pl: "Opóźnienia nieuchronnie następują.", tr: "Gecikmeler kaçınılmaz olarak yaşanır.", id: "Keterlambatan pasti terjadi.", vi: "Chậm trễ chắc chắn sẽ xảy ra." } }
          - { level: C2, adverbs: invariably, use: { en: "every time", uk: "щоразу", es: "siempre, cada vez", pt: "toda vez", fr: "à chaque fois", de: "jedes Mal", it: "ogni volta", pl: "za każdym razem", tr: "her seferinde", id: "setiap kali", vi: "lần nào cũng vậy" }, ex: ["He ", { target: invariably }, " arrives early."], tr: { uk: "Він незмінно приходить рано.", es: "Invariablemente llega temprano.", pt: "Ele invariavelmente chega cedo.", fr: "Il arrive invariablement tôt.", de: "Er kommt ausnahmslos früh.", it: "Arriva invariabilmente presto.", pl: "Niezmiennie przychodzi wcześnie.", tr: "Her zaman istisnasız erken gelir.", id: "Dia selalu datang lebih awal, tanpa kecuali.", vi: "Anh ấy lúc nào cũng đến sớm, không ngoại lệ." } }
          - { level: C2, adverbs: { alternatives: [undeniably, unquestionably] }, use: { en: "beyond doubt", uk: "поза сумнівом", es: "fuera de toda duda", pt: "sem sombra de dúvida", fr: "sans aucun doute", de: "ohne jeden Zweifel", it: "fuori da ogni dubbio", pl: "ponad wszelką wątpliwość", tr: "şüphe götürmez biçimde", id: "tanpa keraguan", vi: "không còn nghi ngờ gì" }, ex: { examples: [["It is ", { target: undeniably }, " true."], ["She is ", { target: unquestionably }, " the best candidate."]] }, tr: { uk: { examples: ["Це безперечно правда.", "Вона, безперечно, найкраща кандидатка."] }, es: { examples: ["Es innegablemente cierto.", "Sin lugar a dudas, ella es la mejor candidata."] }, pt: { examples: ["É inegavelmente verdade.", "Ela é, indiscutivelmente, a melhor candidata."] }, fr: { examples: ["C’est indéniablement vrai.", "Elle est incontestablement la meilleure candidate."] }, de: { examples: ["Das ist unbestreitbar wahr.", "Sie ist unbestritten die beste Kandidatin."] }, it: { examples: ["È innegabilmente vero.", "È indiscutibilmente la migliore candidata."] }, pl: { examples: ["To bezsprzecznie prawda.", "Jest bezsprzecznie najlepszą kandydatką."] }, tr: { examples: ["Bu yadsınamaz biçimde doğru.", "O, tartışmasız en iyi aday."] }, id: { examples: ["Itu tak dapat disangkal benar.", "Dia tanpa keraguan kandidat terbaik."] }, vi: { examples: ["Điều đó không thể phủ nhận là đúng.", "Cô ấy chắc chắn là ứng viên tốt nhất."] } } }
          - { level: C2, adverbs: { alternatives: [markedly, decidedly] }, use: { en: "clearly, to a noticeable degree", uk: "чітко, помітною мірою", es: "claramente, en un grado notable", pt: "claramente, em grau notável", fr: "nettement, à un degré perceptible", de: "deutlich, in spürbarem Maß", it: "chiaramente, in misura notevole", pl: "wyraźnie, w zauważalnym stopniu", tr: "açıkça, fark edilir ölçüde", id: "jelas, sampai tingkat yang terlihat", vi: "rõ ràng, ở mức đáng chú ý" }, ex: { examples: [["The results were ", { target: markedly }, " different."], ["It was a ", { target: decidedly }, " odd result."]] }, tr: { uk: { examples: ["Результати помітно відрізнялися.", "Це був вочевидь дивний результат."] }, es: { examples: ["Los resultados fueron notablemente distintos.", "Fue un resultado decididamente extraño."] }, pt: { examples: ["Os resultados foram marcadamente diferentes.", "Foi um resultado decididamente estranho."] }, fr: { examples: ["Les résultats étaient nettement différents.", "C’était un résultat franchement étrange."] }, de: { examples: ["Die Ergebnisse waren deutlich verschieden.", "Es war ein entschieden seltsames Ergebnis."] }, it: { examples: ["I risultati erano nettamente diversi.", "È stato un risultato decisamente strano."] }, pl: { examples: ["Wyniki były wyraźnie różne.", "To był zdecydowanie dziwny wynik."] }, tr: { examples: ["Sonuçlar belirgin biçimde farklıydı.", "Kesinlikle tuhaf bir sonuçtu."] }, id: { examples: ["Hasilnya jelas berbeda.", "Itu hasil yang jelas-jelas aneh."] }, vi: { examples: ["Kết quả khác nhau rõ rệt.", "Đó là một kết quả rõ ràng là kỳ lạ."] } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["Speech uses plainer words instead: ", { term: always }, " for ", { term: invariably }, ", ", { term: definitely }, " for ", { term: undeniably }, "."], uk: ["У мовленні замість них вживають простіші слова: ", { term: "always" }, " замість ", { term: "invariably" }, ", ", { term: "definitely" }, " замість ", { term: "undeniably" }, "."], es: ["En el habla se usan palabras más simples: ", { term: "always" }, " en lugar de ", { term: "invariably" }, ", ", { term: "definitely" }, " en lugar de ", { term: "undeniably" }, "."], pt: ["Na fala, usam-se palavras mais simples: ", { term: "always" }, " no lugar de ", { term: "invariably" }, ", ", { term: "definitely" }, " no lugar de ", { term: "undeniably" }, "."], fr: ["À l’oral, on emploie des mots plus simples : ", { term: "always" }, " pour ", { term: "invariably" }, ", ", { term: "definitely" }, " pour ", { term: "undeniably" }, "."], de: ["In der Rede stehen stattdessen einfachere Wörter: ", { term: "always" }, " für ", { term: "invariably" }, ", ", { term: "definitely" }, " für ", { term: "undeniably" }, "."], it: ["Nel parlato si usano parole più semplici: ", { term: "always" }, " per ", { term: "invariably" }, ", ", { term: "definitely" }, " per ", { term: "undeniably" }, "."], pl: ["W mowie używa się zamiast nich prostszych słów: ", { term: "always" }, " zamiast ", { term: "invariably" }, ", ", { term: "definitely" }, " zamiast ", { term: "undeniably" }, "."], tr: ["Konuşmada bunların yerine daha sade sözcükler kullanılır: ", { term: "invariably" }, " yerine ", { term: "always" }, ", ", { term: "undeniably" }, " yerine ", { term: "definitely" }, "."], id: ["Dalam percakapan dipakai kata yang lebih sederhana: ", { term: "always" }, " untuk ", { term: "invariably" }, ", ", { term: "definitely" }, " untuk ", { term: "undeniably" }, "."], vi: ["Trong lời nói, người ta dùng từ đơn giản hơn: ", { term: "always" }, " thay cho ", { term: "invariably" }, ", ", { term: "definitely" }, " thay cho ", { term: "undeniably" }, "."] }

