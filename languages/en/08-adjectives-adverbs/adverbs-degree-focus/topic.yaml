          - { level: B2, adverbs: { alternatives: [obviously, clearly] }, use: { en: "the fact is plain to everyone", uk: "факт очевидний для всіх", es: "el hecho es evidente para todos", pt: "o fato é evidente para todos", fr: "le fait est évident pour tous", de: "die Tatsache ist für alle klar", it: "il fatto è evidente per tutti", pl: "fakt jest oczywisty dla wszystkich", tr: "durum herkes için açıktır", id: "faktanya jelas bagi semua orang", vi: "sự việc rõ ràng với mọi người" }, ex: { examples: [[{ target: Obviously }, ", she was tired."], [{ target: Clearly }, ", he knew the answer."]] }, tr: { uk: { examples: ["Очевидно, вона була втомлена.", "Зрозуміло, він знав відповідь."] }, es: { examples: ["Obviamente, ella estaba cansada.", "Claramente, él sabía la respuesta."] }, pt: { examples: ["Obviamente, ela estava cansada.", "Claramente, ele sabia a resposta."] }, fr: { examples: ["Évidemment, elle était fatiguée.", "De toute évidence, il connaissait la réponse."] }, de: { examples: ["Offensichtlich war sie müde.", "Eindeutig kannte er die Antwort."] }, it: { examples: ["Ovviamente, era stanca.", "Chiaramente, conosceva la risposta."] }, pl: { examples: ["Oczywiście była zmęczona.", "Najwyraźniej znał odpowiedź."] }, tr: { examples: ["Belli ki yorgundu.", "Açıkça cevabı biliyordu."] }, id: { examples: ["Jelas sekali dia lelah.", "Jelas, dia tahu jawabannya."] }, vi: { examples: ["Rõ ràng là cô ấy mệt.", "Rõ ràng là anh ấy biết câu trả lời."] } } }
          - { level: B2, adverbs: { alternatives: [apparently, presumably] }, use: { en: "the speaker has heard it, or assumes it", uk: "мовець це чув або припускає", es: "el hablante lo ha oído o lo supone", pt: "o falante ouviu isso ou supõe", fr: "le locuteur l’a entendu dire ou le suppose", de: "der Sprecher hat es gehört oder nimmt es an", it: "il parlante l'ha sentito dire o lo suppone", pl: "mówiący to słyszał lub zakłada", tr: "konuşur bunu duymuştur ya da varsayar", id: "pembicara mendengarnya, atau mengira begitu", vi: "người nói nghe được điều đó hoặc suy đoán" }, ex: { examples: [[{ target: Apparently }, ", the shop is closed."], [{ target: Presumably }, ", he has left."]] }, tr: { uk: { examples: ["Схоже, магазин зачинений.", "Імовірно, він пішов."] }, es: { examples: ["Al parecer, la tienda está cerrada.", "Presumiblemente, ya se fue."] }, pt: { examples: ["Pelo visto, a loja está fechada.", "Presumivelmente, ele já foi embora."] }, fr: { examples: ["Apparemment, le magasin est fermé.", "Vraisemblablement, il est parti."] }, de: { examples: ["Anscheinend ist der Laden geschlossen.", "Vermutlich ist er gegangen."] }, it: { examples: ["A quanto pare, il negozio è chiuso.", "Presumibilmente, se n'è andato."] }, pl: { examples: ["Podobno sklep jest zamknięty.", "Przypuszczalnie wyszedł."] }, tr: { examples: ["Anlaşılan dükkân kapalı.", "Muhtemelen gitmiştir."] }, id: { examples: ["Rupanya tokonya tutup.", "Kemungkinan dia sudah pergi."] }, vi: { examples: ["Nghe nói cửa hàng đã đóng cửa.", "Có lẽ anh ấy đã đi rồi."] } } }
          - { level: B2, adverbs: { alternatives: [frankly, honestly, personally] }, use: { en: "the speaker's own words and view", uk: "власні слова й погляд мовця", es: "las palabras y el punto de vista del propio hablante", pt: "as palavras e o ponto de vista do próprio falante", fr: "les mots et le point de vue du locuteur lui-même", de: "die eigenen Worte und die Sicht des Sprechers", it: "le parole e il punto di vista del parlante stesso", pl: "własne słowa i punkt widzenia mówiącego", tr: "konuşurun kendi sözleri ve görüşü", id: "kata-kata dan pandangan pembicara sendiri", vi: "lời nói và quan điểm riêng của người nói" }, ex: { examples: [[{ target: Frankly }, ", I disagree."], [{ target: Personally }, ", I prefer tea."]] }, tr: { uk: { examples: ["Відверто кажучи, я не згоден.", "Особисто я віддаю перевагу чаю."] }, es: { examples: ["Con franqueza, no estoy de acuerdo.", "Personalmente, prefiero el té."] }, pt: { examples: ["Francamente, discordo.", "Pessoalmente, prefiro chá."] }, fr: { examples: ["Franchement, je ne suis pas d’accord.", "Personnellement, je préfère le thé."] }, de: { examples: ["Ehrlich gesagt, bin ich anderer Meinung.", "Persönlich bevorzuge ich Tee."] }, it: { examples: ["Francamente, non sono d'accordo.", "Personalmente, preferisco il tè."] }, pl: { examples: ["Szczerze mówiąc, nie zgadzam się.", "Osobiście wolę herbatę."] }, tr: { examples: ["Açıkçası katılmıyorum.", "Şahsen ben çayı tercih ederim."] }, id: { examples: ["Terus terang, saya tidak setuju.", "Secara pribadi, saya lebih suka teh."] }, vi: { examples: ["Nói thẳng ra, tôi không đồng ý.", "Cá nhân tôi thích trà hơn."] } } }
          - { level: B2, adverbs: basically, use: { en: "in essence", uk: "по суті", es: "en esencia", pt: "em essência", fr: "en substance", de: "im Kern", it: "in sostanza", pl: "w istocie", tr: "özünde", id: "pada intinya", vi: "về bản chất" }, ex: [{ target: Basically }, ", it is a game of chance."], tr: { uk: "По суті, це гра на везіння.", es: "Básicamente, es un juego de azar.", pt: "Basicamente, é um jogo de azar.", fr: "En gros, c’est un jeu de hasard.", de: "Im Grunde ist es ein Glücksspiel.", it: "In sostanza, è un gioco di fortuna.", pl: "W gruncie rzeczy to gra losowa.", tr: "Temelde bu bir şans oyunu.", id: "Pada dasarnya, ini permainan untung-untungan.", vi: "Về cơ bản, đây là trò chơi may rủi." } }
          - { level: B2, adverbs: actually, use: { en: "corrects or adds a fact, often a surprising one", uk: "уточнює або додає факт, часто несподіваний", es: "corrige o añade un dato, a menudo sorprendente", pt: "corrige ou acrescenta um fato, muitas vezes surpreendente", fr: "corrige ou ajoute un fait, souvent surprenant", de: "korrigiert oder ergänzt eine Tatsache, oft eine überraschende", it: "corregge o aggiunge un fatto, spesso sorprendente", pl: "poprawia lub dodaje fakt, często zaskakujący", tr: "bir olguyu düzeltir ya da ekler, çoğu zaman şaşırtıcı bir olguyu", id: "mengoreksi atau menambahkan fakta, sering kali mengejutkan", vi: "sửa hoặc bổ sung một sự thật, thường là điều bất ngờ" }, ex: [{ target: Actually }, ", the film starts at eight."], tr: { uk: "Насправді фільм починається о восьмій.", es: "En realidad, la película empieza a las ocho.", pt: "Na verdade, o filme começa às oito.", fr: "En fait, le film commence à huit heures.", de: "Eigentlich beginnt der Film um acht.", it: "In realtà, il film comincia alle otto.", pl: "Właściwie film zaczyna się o ósmej.", tr: "Aslında film saat sekizde başlıyor.", id: "Sebenarnya, filmnya mulai pukul delapan.", vi: "Thực ra phim bắt đầu lúc tám giờ." } }
          - { level: B2, adverbs: naturally, use: { en: "of course", uk: "звісно", es: "por supuesto", pt: "é claro", fr: "bien sûr", de: "selbstverständlich", it: "naturalmente", pl: "oczywiście", tr: "tabii ki", id: "tentu saja", vi: "dĩ nhiên" }, ex: [{ target: Naturally }, ", we said yes."], tr: { uk: "Звісно, ми погодилися.", es: "Naturalmente, dijimos que sí.", pt: "Naturalmente, dissemos que sim.", fr: "Naturellement, nous avons dit oui.", de: "Natürlich haben wir Ja gesagt.", it: "Naturalmente, abbiamo detto di sì.", pl: "Oczywiście zgodziliśmy się.", tr: "Doğal olarak evet dedik.", id: "Tentu saja, kami bilang ya.", vi: "Dĩ nhiên, chúng tôi đã nói đồng ý." } }
          - { level: B2, adverbs: { alternatives: [politically, financially, technically] }, use: { en: "in that respect: a viewpoint", uk: "з цього погляду: точка зору", es: "en ese aspecto: un punto de vista", pt: "nesse aspecto: um ponto de vista", fr: "sous cet angle : un point de vue", de: "in dieser Hinsicht: ein Gesichtspunkt", it: "sotto quell'aspetto: un punto di vista", pl: "pod tym względem: punkt widzenia", tr: "o bakımdan: bir bakış açısı", id: "dalam hal itu: sudut pandang", vi: "xét về mặt đó: một góc nhìn" }, ex: { examples: [[{ target: Politically }, ", the plan is risky."], ["The idea is ", { target: technically }, " possible."]] }, tr: { uk: { examples: ["З політичного погляду план ризикований.", "З технічного погляду ця ідея можлива."] }, es: { examples: ["Políticamente, el plan es arriesgado.", "La idea es técnicamente posible."] }, pt: { examples: ["Politicamente, o plano é arriscado.", "A ideia é tecnicamente possível."] }, fr: { examples: ["Sur le plan politique, le plan est risqué.", "L’idée est techniquement possible."] }, de: { examples: ["Politisch gesehen ist der Plan riskant.", "Die Idee ist technisch möglich."] }, it: { examples: ["Politicamente, il piano è rischioso.", "L'idea è tecnicamente possibile."] }, pl: { examples: ["Politycznie plan jest ryzykowny.", "Pomysł jest technicznie możliwy."] }, tr: { examples: ["Siyasi açıdan plan riskli.", "Fikir teknik açıdan mümkün."] }, id: { examples: ["Secara politik, rencana itu berisiko.", "Idenya secara teknis mungkin dilakukan."] }, vi: { examples: ["Về mặt chính trị, kế hoạch này nhiều rủi ro.", "Về mặt kỹ thuật thì ý tưởng này khả thi."] } } }

