  - title: { en: "Use: degree adverbs with verbs", uk: "Вживання: прислівники ступеня з дієсловами", es: "Uso: adverbios de grado con verbos", pt: "Uso: advérbios de grau com verbos", fr: "Emploi : adverbes de degré avec les verbes", de: "Gebrauch: Gradadverbien bei Verben", it: "Uso: avverbi di grado con i verbi", pl: "Użycie: przysłówki stopnia z czasownikami", tr: "Kullanım: fiillerle derece zarfları", id: "Penggunaan: kata keterangan derajat dengan kata kerja", vi: "Cách dùng: trạng từ chỉ mức độ với động từ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs, uk: "Прислівники", es: "Adverbios", pt: "Advérbios", fr: "Adverbes", de: "Adverbien", it: "Avverbi", pl: "Przysłówki", tr: "Zarflar", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, adverbs: { alternatives: [really, totally, completely, absolutely] }, use: { en: "a high degree; before the main verb", uk: "високий ступінь; перед основним дієсловом", es: "grado alto; antes del verbo principal", pt: "grau alto; antes do verbo principal", fr: "degré élevé ; avant le verbe principal", de: "hoher Grad; vor dem Hauptverb", it: "grado alto; prima del verbo principale", pl: "wysoki stopień; przed czasownikiem głównym", tr: "yüksek derece; ana fiilden önce", id: "derajat tinggi; sebelum kata kerja utama", vi: "mức cao; trước động từ chính" }, ex: { examples: [["I ", { target: really }, " like it."], ["I ", { target: totally }, " agree."]] }, tr: { uk: { examples: ["Мені це справді подобається.", "Я повністю згоден."] }, es: { examples: ["De verdad me gusta.", "Estoy totalmente de acuerdo."] }, pt: { examples: ["Eu realmente gosto disso.", "Concordo totalmente."] }, fr: { examples: ["Ça me plaît vraiment.", "Je suis tout à fait d’accord."] }, de: { examples: ["Es gefällt mir wirklich.", "Ich stimme völlig zu."] }, it: { examples: ["Mi piace davvero.", "Sono totalmente d'accordo."] }, pl: { examples: ["Naprawdę mi się to podoba.", "Całkowicie się zgadzam."] }, tr: { examples: ["Gerçekten hoşuma gidiyor.", "Tamamen katılıyorum."] }, id: { examples: ["Saya benar-benar menyukainya.", "Saya sangat setuju."] }, vi: { examples: ["Tôi thực sự thích nó.", "Tôi hoàn toàn đồng ý."] } } }
          - { level: B2, adverbs: { alternatives: [deeply, strongly, greatly] }, use: { en: "a strong, more formal degree; before the main verb", uk: "сильний, більш офіційний ступінь; перед основним дієсловом", es: "grado fuerte y más formal; antes del verbo principal", pt: "grau forte e mais formal; antes do verbo principal", fr: "degré fort et plus soutenu ; avant le verbe principal", de: "starker, formellerer Grad; vor dem Hauptverb", it: "grado forte e più formale; prima del verbo principale", pl: "silny, bardziej formalny stopień; przed czasownikiem głównym", tr: "güçlü, daha resmî bir derece; ana fiilden önce", id: "derajat kuat dan lebih formal; sebelum kata kerja utama", vi: "mức mạnh, trang trọng hơn; trước động từ chính" }, ex: { examples: [["I ", { target: strongly }, " disagree."], ["We ", { target: greatly }, " admire her."]] }, tr: { uk: { examples: ["Я рішуче не згоден.", "Ми дуже захоплюємося нею."] }, es: { examples: ["Discrepo rotundamente.", "La admiramos enormemente."] }, pt: { examples: ["Discordo veementemente.", "Nós a admiramos muito."] }, fr: { examples: ["Je suis fermement en désaccord.", "Nous l’admirons énormément."] }, de: { examples: ["Da bin ich entschieden anderer Meinung.", "Wir bewundern sie sehr."] }, it: { examples: ["Non sono assolutamente d'accordo.", "La ammiriamo moltissimo."] }, pl: { examples: ["Stanowczo się nie zgadzam.", "Bardzo ją podziwiamy."] }, tr: { examples: ["Kesinlikle katılmıyorum.", "Onu çok takdir ediyoruz."] }, id: { examples: ["Saya sangat tidak setuju.", "Kami sangat mengagumi dia."] }, vi: { examples: ["Tôi hoàn toàn không đồng ý.", "Chúng tôi rất ngưỡng mộ cô ấy."] } } }
          - { level: B2, adverbs: { alternatives: [almost, nearly] }, use: { en: "not quite; before the main verb", uk: "не зовсім; перед основним дієсловом", es: "no del todo; antes del verbo principal", pt: "não totalmente; antes do verbo principal", fr: "pas tout à fait ; avant le verbe principal", de: "nicht ganz; vor dem Hauptverb", it: "non del tutto; prima del verbo principale", pl: "nie całkiem; przed czasownikiem głównym", tr: "tam olmasa da; ana fiilden önce", id: "belum sepenuhnya; sebelum kata kerja utama", vi: "chưa hẳn; trước động từ chính" }, ex: { examples: [["I ", { target: almost }, " fell."], ["She ", { target: nearly }, " missed the bus."]] }, tr: { uk: { examples: ["Я ледь не впав.", "Вона ледь не запізнилася на автобус."] }, es: { examples: ["Casi me caigo.", "Casi pierde el autobús."] }, pt: { examples: ["Quase caí.", "Ela quase perdeu o ônibus."] }, fr: { examples: ["J’ai failli tomber.", "Elle a failli rater le bus."] }, de: { examples: ["Ich wäre beinahe gefallen.", "Sie hätte den Bus beinahe verpasst."] }, it: { examples: ["Per poco non cadevo.", "Ha quasi perso l'autobus."] }, pl: { examples: ["Prawie upadłem.", "Prawie spóźniła się na autobus."] }, tr: { examples: ["Neredeyse düşüyordum.", "Neredeyse otobüsü kaçırıyordu."] }, id: { examples: ["Saya hampir jatuh.", "Dia hampir ketinggalan bus."] }, vi: { examples: ["Tôi suýt ngã.", "Cô ấy suýt lỡ chuyến xe buýt."] } } }
          - { level: B2, adverbs: hardly, use: { en: "almost not; before the main verb", uk: "майже не; перед основним дієсловом", es: "casi no; antes del verbo principal", pt: "quase não; antes do verbo principal", fr: "presque pas ; avant le verbe principal", de: "fast nicht; vor dem Hauptverb", it: "quasi non; prima del verbo principale", pl: "prawie nie; przed czasownikiem głównym", tr: "neredeyse hiç; ana fiilden önce", id: "hampir tidak; sebelum kata kerja utama", vi: "hầu như không; trước động từ chính" }, ex: ["I ", { target: hardly }, " know him."], tr: { uk: "Я його майже не знаю.", es: "Casi no lo conozco.", pt: "Mal o conheço.", fr: "Je le connais à peine.", de: "Ich kenne ihn kaum.", it: "Lo conosco appena.", pl: "Prawie go nie znam.", tr: "Onu pek tanımıyorum.", id: "Saya hampir tidak mengenalnya.", vi: "Tôi hầu như không biết anh ấy." } }
          - { level: B2, adverbs: { alternatives: [a lot, very much] }, use: { en: "a high degree; after the verb or its object", uk: "високий ступінь; після дієслова або його додатка", es: "grado alto; después del verbo o de su objeto", pt: "grau alto; depois do verbo ou do seu objeto", fr: "degré élevé ; après le verbe ou son complément", de: "hoher Grad; nach dem Verb oder seinem Objekt", it: "grado alto; dopo il verbo o il suo complemento", pl: "wysoki stopień; po czasowniku lub jego dopełnieniu", tr: "yüksek derece; fiilden ya da nesnesinden sonra", id: "derajat tinggi; setelah kata kerja atau objeknya", vi: "mức cao; sau động từ hoặc tân ngữ của nó" }, ex: { examples: [["She helps ", { target: a lot }, "."], ["I like it ", { target: very much }, "."]] }, tr: { uk: { examples: ["Вона багато допомагає.", "Мені це дуже подобається."] }, es: { examples: ["Ella ayuda mucho.", "Me gusta mucho."] }, pt: { examples: ["Ela ajuda muito.", "Gosto muito disso."] }, fr: { examples: ["Elle aide beaucoup.", "Ça me plaît beaucoup."] }, de: { examples: ["Sie hilft viel.", "Es gefällt mir sehr."] }, it: { examples: ["Lei aiuta molto.", "Mi piace molto."] }, pl: { examples: ["Ona dużo pomaga.", "Bardzo mi się to podoba."] }, tr: { examples: ["Çok yardım ediyor.", "Çok hoşuma gidiyor."] }, id: { examples: ["Dia banyak membantu.", "Saya sangat menyukainya."] }, vi: { examples: ["Cô ấy giúp đỡ rất nhiều.", "Tôi rất thích nó."] } } }
          - { level: B2, adverbs: a bit, use: { en: "a low degree; after the verb or its object", uk: "низький ступінь; після дієслова або його додатка", es: "grado bajo; después del verbo o de su objeto", pt: "grau baixo; depois do verbo ou do seu objeto", fr: "degré faible ; après le verbe ou son complément", de: "niedriger Grad; nach dem Verb oder seinem Objekt", it: "grado basso; dopo il verbo o il suo complemento", pl: "niski stopień; po czasowniku lub jego dopełnieniu", tr: "düşük derece; fiilden ya da nesnesinden sonra", id: "derajat rendah; setelah kata kerja atau objeknya", vi: "mức thấp; sau động từ hoặc tân ngữ của nó" }, ex: ["Can you speak up ", { target: a bit }, "?"], tr: { uk: "Можеш говорити трохи голосніше?", es: "¿Puedes hablar un poco más fuerte?", pt: "Você pode falar um pouco mais alto?", fr: "Peux-tu parler un peu plus fort ?", de: "Kannst du ein bisschen lauter sprechen?", it: "Puoi parlare un po' più forte?", pl: "Możesz mówić trochę głośniej?", tr: "Biraz daha yüksek sesle konuşabilir misin?", id: "Bisakah kamu bicara sedikit lebih keras?", vi: "Bạn nói to hơn một chút được không?" } }
          - { level: B2, adverbs: ["not", { gap: true }, "at all"], use: { en: "none; at the end of the clause", uk: "жодного ступеня; наприкінці речення", es: "ningún grado; al final de la oración", pt: "nenhum grau; no fim da oração", fr: "aucun degré ; à la fin de la proposition", de: "gar nicht; am Ende des Satzes", it: "nessun grado; alla fine della proposizione", pl: "żaden stopień; na końcu zdania", tr: "hiç; cümlenin sonunda", id: "tidak sama sekali; di akhir klausa", vi: "không chút nào; ở cuối mệnh đề" }, ex: ["I didn't enjoy it ", { target: at all }, "."], tr: { uk: "Мені це зовсім не сподобалося.", es: "No lo disfruté para nada.", pt: "Não gostei nem um pouco.", fr: "Je n’ai pas du tout aimé.", de: "Es hat mir überhaupt nicht gefallen.", it: "Non mi è piaciuto per niente.", pl: "Wcale mi się to nie podobało.", tr: "Hiç hoşuma gitmedi.", id: "Saya sama sekali tidak menikmatinya.", vi: "Tôi không thích nó chút nào." } }
          - { level: B2, adverbs: not quite, use: { en: "almost, but not completely", uk: "майже, але не повністю", es: "casi, pero no del todo", pt: "quase, mas não completamente", fr: "presque, mais pas complètement", de: "fast, aber nicht ganz", it: "quasi, ma non del tutto", pl: "prawie, ale nie całkiem", tr: "neredeyse ama tam değil", id: "hampir, tetapi belum sepenuhnya", vi: "gần như, nhưng chưa hoàn toàn" }, ex: ["I'm ", { target: not quite }, " ready."], tr: { uk: "Я ще не зовсім готовий.", es: "Todavía no estoy del todo listo.", pt: "Ainda não estou totalmente pronto.", fr: "Je ne suis pas tout à fait prêt.", de: "Ich bin noch nicht ganz fertig.", it: "Non sono ancora del tutto pronto.", pl: "Nie jestem jeszcze całkiem gotowy.", tr: "Henüz tam hazır değilim.", id: "Saya belum benar-benar siap.", vi: "Tôi chưa hoàn toàn sẵn sàng." } }
          - { level: B2, adverbs: not really, use: { en: "a softer no", uk: "м’якша відмова", es: "un no más suave", pt: "um não mais suave", fr: "un non plus doux", de: "ein weicheres Nein", it: "un no più morbido", pl: "łagodniejsze nie", tr: "daha yumuşak bir hayır", id: "penolakan yang lebih halus", vi: "một lời từ chối nhẹ nhàng hơn" }, ex: { exchange: ["Do you like jazz?", [{ target: Not really }, "."]] }, tr: { uk: "Ти любиш джаз? — Не дуже.", es: "¿Te gusta el jazz? — No mucho.", pt: "Você gosta de jazz? — Não muito.", fr: "Aimes-tu le jazz ? — Pas vraiment.", de: "Magst du Jazz? — Nicht wirklich.", it: "Ti piace il jazz? — Non proprio.", pl: "Lubisz jazz? — Niezbyt.", tr: "Cazı sever misin? — Pek sevmem.", id: "Apakah kamu suka jazz? — Tidak terlalu.", vi: "Bạn có thích nhạc jazz không? — Không hẳn." } }

