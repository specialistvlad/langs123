        rows:
          - { level: C1, use: { en: "adverb and past participle as an adjective before a noun", uk: "прислівник і дієприкметник минулого часу як прикметник перед іменником", es: "adverbio y participio pasado como adjetivo antes de un sustantivo", pt: "advérbio e particípio passado como adjetivo antes de um substantivo", fr: "adverbe et participe passé employés comme adjectif devant un nom", de: "Adverb und Partizip Perfekt als Adjektiv vor einem Nomen", it: "avverbio e participio passato come aggettivo prima di un nome", pl: "przysłówek i imiesłów bierny jako przymiotnik przed rzeczownikiem", tr: "zarf ve geçmiş zaman ortacı, isimden önce sıfat olarak", id: "kata keterangan dan partisip lampau sebagai kata sifat sebelum kata benda", vi: "trạng từ và phân từ quá khứ làm tính từ đứng trước danh từ" }, ex: { examples: [["a ", { target: highly recommended }, " hotel"], ["a ", { target: carefully planned }, " trip"]] }, tr: { uk: { examples: ["дуже рекомендований готель", "ретельно спланована подорож"] }, es: { examples: ["un hotel muy recomendado", "un viaje cuidadosamente planeado"] }, pt: { examples: ["um hotel altamente recomendado", "uma viagem cuidadosamente planejada"] }, fr: { examples: ["un hôtel très recommandé", "un voyage soigneusement planifié"] }, de: { examples: ["ein sehr empfehlenswertes Hotel", "eine sorgfältig geplante Reise"] }, it: { examples: ["un hotel molto raccomandato", "un viaggio pianificato con cura"] }, pl: { examples: ["bardzo polecany hotel", "starannie zaplanowana podróż"] }, tr: { examples: ["çok tavsiye edilen bir otel", "dikkatle planlanmış bir gezi"] }, id: { examples: ["hotel yang sangat direkomendasikan", "perjalanan yang direncanakan dengan matang"] }, vi: { examples: ["một khách sạn được đánh giá rất cao", "một chuyến đi được lên kế hoạch cẩn thận"] } } }
          - { level: C1, use: { en: ["after ", { term: be }, ": the same pair describes the subject"], uk: ["після ", { term: "be" }, ": та сама пара описує підмет"], es: ["después de ", { term: "be" }, ": el mismo par describe el sujeto"], pt: ["depois de ", { term: "be" }, ": o mesmo par descreve o sujeito"], fr: ["après ", { term: "be" }, " : la même paire décrit le sujet"], de: ["nach ", { term: "be" }, ": dasselbe Paar beschreibt das Subjekt"], it: ["dopo ", { term: "be" }, ": la stessa coppia descrive il soggetto"], pl: ["po ", { term: "be" }, ": ta sama para opisuje podmiot"], tr: [{ term: "be" }, " fiilinden sonra: aynı ikili özneyi niteler"], id: ["setelah ", { term: "be" }, ": pasangan yang sama menerangkan subjek"], vi: ["sau ", { term: "be" }, ": cặp từ đó miêu tả chủ ngữ"] }, ex: { examples: [["The story is ", { target: widely believed }, "."], ["She was ", { target: deeply moved }, "."]] }, tr: { uk: { examples: ["У цю історію широко вірять.", "Вона була глибоко зворушена."] }, es: { examples: ["Mucha gente cree en esta historia.", "Ella estaba profundamente conmovida."] }, pt: { examples: ["A história é amplamente aceita.", "Ela ficou profundamente comovida."] }, fr: { examples: ["Cette histoire est largement crue.", "Elle a été profondément émue."] }, de: { examples: ["Die Geschichte wird weithin geglaubt.", "Sie war zutiefst gerührt."] }, it: { examples: ["La storia è ampiamente creduta.", "Era profondamente commossa."] }, pl: { examples: ["W tę historię powszechnie się wierzy.", "Była głęboko poruszona."] }, tr: { examples: ["Bu hikâyeye geniş çapta inanılır.", "Derinden etkilendi."] }, id: { examples: ["Cerita itu dipercaya secara luas.", "Dia sangat terharu."] }, vi: { examples: ["Câu chuyện này được nhiều người tin.", "Cô ấy vô cùng xúc động."] } } }
          - { level: C1, use: { en: "adverb and -ing participle: the effect on others", uk: "прислівник і дієприкметник на -ing: вплив на інших", es: "adverbio y participio en -ing: el efecto sobre otros", pt: "advérbio e particípio em -ing: o efeito sobre os outros", fr: "adverbe et participe en -ing : l’effet sur les autres", de: "Adverb und Partizip auf -ing: die Wirkung auf andere", it: "avverbio e participio in -ing: l'effetto sugli altri", pl: "przysłówek i imiesłów z końcówką -ing: wpływ na innych", tr: "zarf ve -ing ortacı: başkaları üzerindeki etki", id: "kata keterangan dan partisip -ing: pengaruhnya pada orang lain", vi: "trạng từ và phân từ -ing: tác động lên người khác" }, ex: { examples: [["a ", { target: deeply moving }, " film"], ["a ", { target: highly demanding }, " job"]] }, tr: { uk: { examples: ["глибоко зворушливий фільм", "надзвичайно вимоглива робота"] }, es: { examples: ["una película profundamente conmovedora", "un trabajo muy exigente"] }, pt: { examples: ["um filme profundamente comovente", "um trabalho altamente exigente"] }, fr: { examples: ["un film profondément émouvant", "un travail très exigeant"] }, de: { examples: ["ein zutiefst bewegender Film", "eine äußerst anspruchsvolle Arbeit"] }, it: { examples: ["un film profondamente commovente", "un lavoro molto impegnativo"] }, pl: { examples: ["głęboko poruszający film", "bardzo wymagająca praca"] }, tr: { examples: ["derinden etkileyen bir film", "son derece zorlu bir iş"] }, id: { examples: ["film yang sangat mengharukan", "pekerjaan yang sangat menuntut"] }, vi: { examples: ["một bộ phim vô cùng cảm động", "một công việc đòi hỏi rất cao"] } } }

  - title: { en: Stance adverbs, uk: "Прислівники ставлення", es: "Adverbios de actitud", pt: "Advérbios de atitude", fr: "Adverbes d’attitude", de: "Einstellungsadverbien", it: "Avverbi di atteggiamento", pl: "Przysłówki postawy", tr: "Tutum zarfları", id: "Kata keterangan sikap", vi: "Trạng từ thái độ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs, uk: "Прислівники", es: "Adverbios", pt: "Advérbios", fr: "Adverbes", de: "Adverbien", it: "Avverbi", pl: "Przysłówki", tr: "Zarflar", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, adverbs: arguably, use: { en: "the claim can be defended, but not everyone agrees", uk: "твердження можна обґрунтувати, але не всі з ним згодні", es: "la afirmación se puede defender, pero no todos están de acuerdo", pt: "a afirmação pode ser defendida, mas nem todos concordam", fr: "l’affirmation peut se défendre, mais tout le monde n’est pas d’accord", de: "die Behauptung lässt sich vertreten, aber nicht alle stimmen zu", it: "l'affermazione si può difendere, ma non tutti sono d'accordo", pl: "twierdzenie można obronić, ale nie wszyscy się z nim zgadzają", tr: "iddia savunulabilir, ama herkes katılmaz", id: "klaim itu bisa dipertahankan, tetapi tidak semua orang setuju", vi: "nhận định này có thể bảo vệ được, nhưng không phải ai cũng đồng ý" }, ex: [{ target: Arguably }, ", it is her best book."], tr: { uk: "Можна стверджувати, що це її найкраща книга.", es: "Se podría decir que es su mejor libro.", pt: "Pode-se dizer que é o melhor livro dela.", fr: "On peut dire que c’est son meilleur livre.", de: "Es ist wohl ihr bestes Buch.", it: "Si può dire che è il suo libro migliore.", pl: "Można twierdzić, że to jej najlepsza książka.", tr: "Bu, onun en iyi kitabı sayılabilir.", id: "Bisa dikatakan, ini buku terbaiknya.", vi: "Có thể nói đây là cuốn sách hay nhất của cô ấy." } }
          - { level: C1, adverbs: admittedly, use: { en: "the speaker accepts a point against the argument", uk: "мовець визнає аргумент проти власної думки", es: "el hablante acepta un punto en contra de su argumento", pt: "o falante aceita um ponto contrário ao argumento", fr: "le locuteur admet un point qui va contre l’argument", de: "der Sprecher räumt einen Punkt gegen das Argument ein", it: "il parlante ammette un punto contrario all'argomento", pl: "mówiący przyznaje rację w punkcie przeciwnym argumentowi", tr: "konuşur, savına karşı bir noktayı kabul eder", id: "pembicara menerima satu poin yang melawan argumennya", vi: "người nói thừa nhận một điểm đi ngược lại lập luận" }, ex: ["The hotel is old, ", { target: admittedly }, ", but it is clean."], tr: { uk: "Готель старий, це правда, але чистий.", es: "El hotel es viejo, es cierto, pero está limpio.", pt: "O hotel é velho, é verdade, mas é limpo.", fr: "L’hôtel est vieux, certes, mais il est propre.", de: "Das Hotel ist zwar alt, aber sauber.", it: "L'hotel è vecchio, certo, ma è pulito.", pl: "Hotel jest stary, to prawda, ale jest czysty.", tr: "Otel eski, doğru, ama temiz.", id: "Hotelnya memang tua, tetapi bersih.", vi: "Khách sạn cũ thật, nhưng sạch sẽ." } }
          - { level: C1, adverbs: supposedly, use: { en: "people say so, but the speaker doubts it", uk: "так кажуть, але мовець сумнівається", es: "la gente lo dice, pero el hablante lo duda", pt: "dizem isso, mas o falante duvida", fr: "on le dit, mais le locuteur en doute", de: "man sagt es, aber der Sprecher zweifelt daran", it: "la gente lo dice, ma il parlante ne dubita", pl: "ludzie tak mówią, ale mówiący w to wątpi", tr: "insanlar öyle söyler, ama konuşur şüphelidir", id: "orang berkata begitu, tetapi pembicara meragukannya", vi: "người ta nói vậy, nhưng người nói nghi ngờ" }, ex: ["The food is ", { target: supposedly }, " the best in town."], tr: { uk: "Їжа нібито найкраща в місті.", es: "Supuestamente, la comida es la mejor de la ciudad.", pt: "A comida é supostamente a melhor da cidade.", fr: "La cuisine est soi-disant la meilleure de la ville.", de: "Das Essen soll angeblich das beste der Stadt sein.", it: "Il cibo è, a quanto si dice, il migliore della città.", pl: "Jedzenie ma być podobno najlepsze w mieście.", tr: "Yemeklerin sözde şehirdeki en iyisi olduğu söyleniyor.", id: "Makanannya konon yang terbaik di kota ini.", vi: "Đồ ăn ở đây được cho là ngon nhất thành phố." } }
          - { level: C1, adverbs: evidently, use: { en: "the evidence shows it", uk: "це підтверджують докази", es: "las pruebas lo muestran", pt: "as evidências mostram isso", fr: "les preuves le montrent", de: "die Belege zeigen es", it: "le prove lo dimostrano", pl: "dowody to pokazują", tr: "kanıtlar bunu gösterir", id: "buktinya menunjukkan hal itu", vi: "bằng chứng cho thấy điều đó" }, ex: [{ target: Evidently }, ", the meeting has ended."], tr: { uk: "Очевидно, зустріч закінчилася.", es: "Evidentemente, la reunión ha terminado.", pt: "Evidentemente, a reunião terminou.", fr: "De toute évidence, la réunion est terminée.", de: "Offenbar ist die Besprechung zu Ende.", it: "Evidentemente, la riunione è finita.", pl: "Najwyraźniej spotkanie się skończyło.", tr: "Anlaşılan toplantı sona erdi.", id: "Jelas bahwa rapatnya sudah selesai.", vi: "Rõ ràng là cuộc họp đã kết thúc." } }
          - { level: C1, adverbs: undoubtedly, use: { en: "there is no doubt", uk: "сумнівів немає", es: "no hay duda", pt: "não há dúvida", fr: "il n’y a aucun doute", de: "es gibt keinen Zweifel", it: "non ci sono dubbi", pl: "nie ma wątpliwości", tr: "şüphe yok", id: "tidak ada keraguan", vi: "không có gì phải nghi ngờ" }, ex: ["She is ", { target: undoubtedly }, " the best player."], tr: { uk: "Вона, безсумнівно, найкраща гравчиня.", es: "Sin duda, ella es la mejor jugadora.", pt: "Ela é, sem dúvida, a melhor jogadora.", fr: "Elle est sans aucun doute la meilleure joueuse.", de: "Sie ist zweifellos die beste Spielerin.", it: "È senza dubbio la migliore giocatrice.", pl: "Jest niewątpliwie najlepszą zawodniczką.", tr: "O, şüphesiz en iyi oyuncu.", id: "Dia tak diragukan lagi pemain terbaik.", vi: "Cô ấy chắc chắn là cầu thủ giỏi nhất." } }
          - { level: C1, adverbs: indeed, use: { en: "confirms a statement and adds to it", uk: "підтверджує твердження і доповнює його", es: "confirma una afirmación y añade algo más", pt: "confirma uma afirmação e acrescenta algo a ela", fr: "confirme une affirmation et la complète", de: "bestätigt eine Aussage und ergänzt sie", it: "conferma un'affermazione e la completa", pl: "potwierdza twierdzenie i coś do niego dodaje", tr: "bir ifadeyi onaylar ve ona ekleme yapar", id: "menegaskan pernyataan dan menambahkan sesuatu padanya", vi: "xác nhận một nhận định và bổ sung thêm cho nó" }, ex: ["It was a good idea, ", { target: indeed }, " a brilliant one."], tr: { uk: "Це була гарна ідея, навіть блискуча.", es: "Fue una buena idea, de hecho una idea brillante.", pt: "Foi uma boa ideia, aliás, uma ideia brilhante.", fr: "C’était une bonne idée, et même une idée brillante.", de: "Es war eine gute Idee, ja sogar eine brillante.", it: "Era una buona idea, anzi, un'idea brillante.", pl: "To był dobry pomysł, wręcz znakomity.", tr: "İyi bir fikirdi, hatta harika bir fikirdi.", id: "Itu ide yang bagus, bahkan sangat cemerlang.", vi: "Đó là một ý hay, thật ra là một ý tuyệt vời." } }
          - { level: C1, adverbs: in fact, use: { en: "adds a fact that strengthens or corrects the sentence before", uk: "додає факт, який підсилює або виправляє попереднє речення", es: "añade un dato que refuerza o corrige la oración anterior", pt: "acrescenta um fato que reforça ou corrige a frase anterior", fr: "ajoute un fait qui renforce ou corrige la phrase précédente", de: "fügt eine Tatsache hinzu, die den vorigen Satz verstärkt oder korrigiert", it: "aggiunge un fatto che rafforza o corregge la frase precedente", pl: "dodaje fakt, który wzmacnia lub poprawia poprzednie zdanie", tr: "önceki cümleyi güçlendiren ya da düzelten bir olgu ekler", id: "menambahkan fakta yang memperkuat atau mengoreksi kalimat sebelumnya", vi: "bổ sung một sự thật làm mạnh thêm hoặc sửa lại câu trước" }, ex: ["I don't mind. ", { target: In fact }, ", I'd love to."], tr: { uk: "Я не заперечую. Навпаки, я з радістю.", es: "No me importa. De hecho, me encantaría.", pt: "Não me importo. Na verdade, adoraria.", fr: "Ça ne me dérange pas. En fait, j’adorerais.", de: "Das stört mich nicht. Tatsächlich würde ich es gern tun.", it: "Non mi dispiace. Anzi, mi piacerebbe molto.", pl: "Nie mam nic przeciwko. Wręcz chętnie to zrobię.", tr: "Sorun değil. Hatta çok isterim.", id: "Saya tidak keberatan. Bahkan, saya sangat ingin.", vi: "Tôi không phiền. Thật ra, tôi rất muốn." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "At the start of a sentence, a stance adverb takes a comma:", uk: "На початку речення після прислівника ставлення стоїть кома:", es: "Al comienzo de una oración, el adverbio de actitud va seguido de coma:", pt: "No início de uma frase, o advérbio de atitude leva vírgula:", fr: "En début de phrase, l’adverbe d’attitude prend une virgule :", de: "Am Satzanfang folgt auf ein Einstellungsadverb ein Komma:", it: "All'inizio di una frase, l'avverbio di atteggiamento prende la virgola:", pl: "Na początku zdania po przysłówku postawy stoi przecinek:", tr: "Cümle başında tutum zarfından sonra virgül gelir:", id: "Di awal kalimat, kata keterangan sikap diikuti koma:", vi: "Ở đầu câu, trạng từ thái độ có dấu phẩy theo sau:" }
            ex: [{ target: Undoubtedly }, ", she is the best player."]
            tr: { uk: "Безсумнівно, вона найкраща гравчиня.", es: "Sin duda alguna, ella es la mejor jugadora.", pt: "Sem dúvida, ela é a melhor jogadora.", fr: "Sans aucun doute, elle est la meilleure joueuse.", de: "Zweifellos ist sie die beste Spielerin.", it: "Senza dubbio, è la migliore giocatrice.", pl: "Niewątpliwie jest najlepszą zawodniczką.", tr: "Şüphesiz o en iyi oyuncu.", id: "Tak diragukan lagi, dia pemain terbaik.", vi: "Chắc chắn cô ấy là cầu thủ giỏi nhất." }
          - type: rule
            level: C1
            text: { en: [{ term: arguably }, " and ", { term: undoubtedly }, " stand before the word they judge, with no commas:"], uk: [{ term: "arguably" }, " і ", { term: "undoubtedly" }, " стоять перед словом, яке оцінюють, без ком:"], es: [{ term: "arguably" }, " y ", { term: "undoubtedly" }, " van antes de la palabra que valoran, sin comas:"], pt: [{ term: "arguably" }, " e ", { term: "undoubtedly" }, " vêm antes da palavra que avaliam, sem vírgulas:"], fr: [{ term: "arguably" }, " et ", { term: "undoubtedly" }, " se placent avant le mot qu’ils évaluent, sans virgules :"], de: [{ term: "arguably" }, " und ", { term: "undoubtedly" }, " stehen vor dem Wort, das sie beurteilen, ohne Kommas:"], it: [{ term: "arguably" }, " e ", { term: "undoubtedly" }, " stanno prima della parola che valutano, senza virgole:"], pl: [{ term: "arguably" }, " i ", { term: "undoubtedly" }, " stoją przed słowem, które oceniają, bez przecinków:"], tr: [{ term: "arguably" }, " ve ", { term: "undoubtedly" }, ", değerlendirdikleri sözcükten önce gelir, virgül almaz:"], id: [{ term: "arguably" }, " dan ", { term: "undoubtedly" }, " diletakkan sebelum kata yang dinilainya, tanpa koma:"], vi: [{ term: "arguably" }, " và ", { term: "undoubtedly" }, " đứng trước từ mà chúng đánh giá, không có dấu phẩy:"] }
            ex: ["It is ", { target: arguably }, " her best book."]
            tr: { uk: "Це, можна сказати, її найкраща книга.", es: "Es posiblemente su mejor libro.", pt: "É possivelmente o melhor livro dela.", fr: "C’est sans doute son meilleur livre.", de: "Es ist wohl ihr bestes Buch.", it: "È probabilmente il suo libro migliore.", pl: "To chyba jej najlepsza książka.", tr: "Bu, onun en iyi kitabı sayılabilir.", id: "Ini bisa dibilang buku terbaiknya.", vi: "Có thể nói đây là cuốn sách hay nhất của cô ấy." }
          - type: rule
            level: C1
            text: { en: [{ term: admittedly }, " and ", { term: in fact }, " interrupt the clause between commas, marking a pause:"], uk: [{ term: "admittedly" }, " і ", { term: "in fact" }, " уривають речення між двома комами, позначаючи паузу:"], es: [{ term: "admittedly" }, " y ", { term: "in fact" }, " interrumpen la oración entre comas y marcan una pausa:"], pt: [{ term: "admittedly" }, " e ", { term: "in fact" }, " interrompem a oração entre vírgulas, marcando uma pausa:"], fr: [{ term: "admittedly" }, " et ", { term: "in fact" }, " interrompent la proposition entre virgules, pour marquer une pause :"], de: [{ term: "admittedly" }, " und ", { term: "in fact" }, " unterbrechen den Satz zwischen Kommas und markieren eine Pause:"], it: [{ term: "admittedly" }, " e ", { term: "in fact" }, " interrompono la proposizione tra virgole, segnando una pausa:"], pl: [{ term: "admittedly" }, " i ", { term: "in fact" }, " przerywają zdanie między przecinkami, zaznaczając pauzę:"], tr: [{ term: "admittedly" }, " ve ", { term: "in fact" }, ", cümleyi virgüller arasında keser ve bir duraklamayı gösterir:"], id: [{ term: "admittedly" }, " dan ", { term: "in fact" }, " menyela klausa di antara dua koma, menandai jeda:"], vi: [{ term: "admittedly" }, " và ", { term: "in fact" }, " xen vào mệnh đề giữa hai dấu phẩy, đánh dấu một chỗ ngắt:"] }
            ex: ["The plan is, ", { target: admittedly }, ", expensive."]
            tr: { uk: "План, правда, дорогий.", es: "El plan es, hay que admitirlo, costoso.", pt: "O plano é, é preciso admitir, caro.", fr: "Le plan est, il faut l’admettre, coûteux.", de: "Der Plan ist zugegebenermaßen teuer.", it: "Il piano è, bisogna ammetterlo, costoso.", pl: "Plan jest, trzeba przyznać, drogi.", tr: "Plan, kabul etmek gerek, pahalı.", id: "Rencana itu memang mahal, harus diakui.", vi: "Kế hoạch này tốn kém, phải thừa nhận như vậy." }

  - title: { en: Focusing adverbs and scope, uk: "Фокусні прислівники та сфера дії", es: "Adverbios de foco y alcance", pt: "Advérbios de foco e alcance", fr: "Adverbes de focalisation et portée", de: "Fokusadverbien und Bezugsbereich", it: "Avverbi di focalizzazione e portata", pl: "Przysłówki wyróżniające i zakres", tr: "Odak zarfları ve kapsam", id: "Kata keterangan fokus dan cakupan", vi: "Trạng từ tiêu điểm và phạm vi" }
