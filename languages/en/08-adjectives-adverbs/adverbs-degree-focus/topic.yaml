        rows:
          - { level: C1, adverbs: { alternatives: [scarcely, barely] }, use: { en: "only just; scarcely is formal", uk: "ледве; scarcely належить до формального стилю", es: "apenas; scarcely es formal", pt: "por pouco; scarcely é formal", fr: "tout juste ; scarcely est soutenu", de: "gerade noch; scarcely ist formell", it: "appena; scarcely è formale", pl: "ledwie; scarcely jest formalne", tr: "ancak, zar zor; scarcely resmî bir sözcüktür", id: "nyaris tidak; scarcely bersifat formal", vi: "chỉ vừa đủ; scarcely mang tính trang trọng" }, ex: { examples: [["We had ", { target: scarcely }, " enough money."], ["She ", { target: barely }, " slept."]] }, tr: { uk: { examples: ["У нас ледве вистачало грошей.", "Вона майже не спала."] }, es: { examples: ["Apenas teníamos suficiente dinero.", "Apenas durmió."] }, pt: { examples: ["Mal tínhamos dinheiro suficiente.", "Ela mal dormiu."] }, fr: { examples: ["Nous avions tout juste assez d’argent.", "Elle a à peine dormi."] }, de: { examples: ["Wir hatten kaum genug Geld.", "Sie hat kaum geschlafen."] }, it: { examples: ["Avevamo a malapena abbastanza soldi.", "Ha dormito appena."] }, pl: { examples: ["Ledwo starczało nam pieniędzy.", "Ledwo spała."] }, tr: { examples: ["Zar zor yetecek kadar paramız vardı.", "Zar zor uyudu."] }, id: { examples: ["Kami nyaris tidak punya cukup uang.", "Dia nyaris tidak tidur."] }, vi: { examples: ["Chúng tôi hầu như không đủ tiền.", "Cô ấy hầu như không ngủ."] } } }
          - { level: C1, adverbs: { alternatives: [virtually, practically] }, use: { en: "in effect, though not strictly", uk: "фактично, хоча й не зовсім строго", es: "en la práctica, aunque no en sentido estricto", pt: "na prática, embora não estritamente", fr: "en pratique, sans l’être au sens strict", de: "faktisch, wenn auch nicht im strengen Sinn", it: "di fatto, anche se non in senso stretto", pl: "faktycznie, choć nie dosłownie", tr: "fiilen, kesin anlamda olmasa da", id: "pada praktiknya, meski tidak secara ketat", vi: "trên thực tế, dù không hoàn toàn chặt chẽ" }, ex: { examples: [["The road is ", { target: virtually }, " empty."], ["It's ", { target: practically }, " impossible."]] }, tr: { uk: { examples: ["Дорога практично порожня.", "Це практично неможливо."] }, es: { examples: ["La carretera está prácticamente vacía.", "Es prácticamente imposible."] }, pt: { examples: ["A estrada está praticamente vazia.", "É praticamente impossível."] }, fr: { examples: ["La route est quasiment vide.", "C’est pratiquement impossible."] }, de: { examples: ["Die Straße ist praktisch leer.", "Das ist praktisch unmöglich."] }, it: { examples: ["La strada è virtualmente vuota.", "È praticamente impossibile."] }, pl: { examples: ["Droga jest praktycznie pusta.", "To praktycznie niemożliwe."] }, tr: { examples: ["Yol neredeyse bomboş.", "Neredeyse imkânsız."] }, id: { examples: ["Jalan itu praktis kosong.", "Itu praktis mustahil."] }, vi: { examples: ["Con đường gần như trống không.", "Điều đó gần như không thể."] } } }
          - { level: C1, adverbs: all but, use: { en: "very nearly", uk: "майже зовсім", es: "casi del todo", pt: "quase por completo", fr: "presque tout à fait", de: "so gut wie", it: "quasi del tutto", pl: "prawie całkiem", tr: "neredeyse tamamen", id: "hampir sepenuhnya", vi: "gần như hoàn toàn" }, ex: ["The job is ", { target: all but }, " finished."], tr: { uk: "Робота майже закінчена.", es: "El trabajo está casi terminado.", pt: "O trabalho está quase terminado.", fr: "Le travail est presque terminé.", de: "Die Arbeit ist so gut wie fertig.", it: "Il lavoro è praticamente finito.", pl: "Praca jest prawie skończona.", tr: "İş hemen hemen bitti.", id: "Pekerjaan itu hampir selesai.", vi: "Công việc gần như đã xong." } }
          - { level: C1, adverbs: more or less, use: { en: "roughly, nearly", uk: "приблизно, майже", es: "aproximadamente, casi", pt: "aproximadamente, quase", fr: "à peu près, presque", de: "ungefähr, fast", it: "più o meno, quasi", pl: "mniej więcej, prawie", tr: "yaklaşık olarak, neredeyse", id: "kira-kira, hampir", vi: "xấp xỉ, gần như" }, ex: { examples: [["I ", { target: more or less }, " agree."], ["It's ", { target: more or less }, " ready."]] }, tr: { uk: { examples: ["Я більш-менш згоден.", "Воно більш-менш готове."] }, es: { examples: ["Más o menos estoy de acuerdo.", "Está más o menos listo."] }, pt: { examples: ["Mais ou menos concordo.", "Está mais ou menos pronto."] }, fr: { examples: ["Je suis plus ou moins d’accord.", "C’est plus ou moins prêt."] }, de: { examples: ["Ich stimme mehr oder weniger zu.", "Es ist mehr oder weniger fertig."] }, it: { examples: ["Più o meno sono d'accordo.", "È più o meno pronto."] }, pl: { examples: ["Mniej więcej się zgadzam.", "To mniej więcej gotowe."] }, tr: { examples: ["Aşağı yukarı katılıyorum.", "Aşağı yukarı hazır."] }, id: { examples: ["Kurang lebih saya setuju.", "Ini kurang lebih sudah siap."] }, vi: { examples: ["Tôi đồng ý ít nhiều.", "Nó gần như đã sẵn sàng."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: hardly }, ", ", { term: scarcely }, " and ", { term: barely }, " are negative in meaning, so the verb is positive:"], uk: [{ term: "hardly" }, ", ", { term: "scarcely" }, " і ", { term: "barely" }, " мають заперечне значення, тому дієслово стоїть у ствердній формі:"], es: [{ term: "hardly" }, ", ", { term: "scarcely" }, " y ", { term: "barely" }, " son negativos de significado, así que el verbo va en afirmativo:"], pt: [{ term: "hardly" }, ", ", { term: "scarcely" }, " e ", { term: "barely" }, " são negativos no significado, por isso o verbo fica no afirmativo:"], fr: [{ term: "hardly" }, ", ", { term: "scarcely" }, " et ", { term: "barely" }, " sont négatifs par le sens, donc le verbe est à la forme affirmative :"], de: [{ term: "hardly" }, ", ", { term: "scarcely" }, " und ", { term: "barely" }, " sind der Bedeutung nach negativ, deshalb steht das Verb in der bejahenden Form:"], it: [{ term: "hardly" }, ", ", { term: "scarcely" }, " e ", { term: "barely" }, " hanno significato negativo, quindi il verbo è affermativo:"], pl: [{ term: "hardly" }, ", ", { term: "scarcely" }, " i ", { term: "barely" }, " mają znaczenie przeczące, więc czasownik jest w formie twierdzącej:"], tr: [{ term: "hardly" }, ", ", { term: "scarcely" }, " ve ", { term: "barely" }, " anlamca olumsuzdur, bu yüzden fiil olumlu olur:"], id: [{ term: "hardly" }, ", ", { term: "scarcely" }, ", dan ", { term: "barely" }, " bermakna negatif, jadi kata kerjanya positif:"], vi: [{ term: "hardly" }, ", ", { term: "scarcely" }, " và ", { term: "barely" }, " mang nghĩa phủ định, nên động từ ở dạng khẳng định:"] }
            ex: ["I ", { target: hardly }, " know anyone here."]
            tr: { uk: "Я майже нікого тут не знаю.", es: "Casi no conozco a nadie aquí.", pt: "Quase não conheço ninguém aqui.", fr: "Je ne connais presque personne ici.", de: "Ich kenne hier kaum jemanden.", it: "Non conosco quasi nessuno qui.", pl: "Prawie nikogo tu nie znam.", tr: "Burada neredeyse kimseyi tanımıyorum.", id: "Saya hampir tidak kenal siapa pun di sini.", vi: "Tôi hầu như không quen ai ở đây." }
          - type: rule
            level: C1
            text: { en: ["Before negative words such as ", { term: nobody }, " and ", { term: never }, ", ", { term: almost }, " is the usual choice:"], uk: ["Перед заперечними словами, як-от ", { term: "nobody" }, " і ", { term: "never" }, ", зазвичай вживають ", { term: "almost" }, ":"], es: ["Ante palabras negativas como ", { term: "nobody" }, " y ", { term: "never" }, ", lo habitual es ", { term: "almost" }, ":"], pt: ["Antes de palavras negativas como ", { term: "nobody" }, " e ", { term: "never" }, ", o usual é ", { term: "almost" }, ":"], fr: ["Devant des mots négatifs comme ", { term: "nobody" }, " et ", { term: "never" }, ", on emploie d’ordinaire ", { term: "almost" }, " :"], de: ["Vor Verneinungswörtern wie ", { term: "nobody" }, " und ", { term: "never" }, " steht gewöhnlich ", { term: "almost" }, ":"], it: ["Davanti a parole negative come ", { term: "nobody" }, " e ", { term: "never" }, ", la scelta usuale è ", { term: "almost" }, ":"], pl: ["Przed wyrazami przeczącymi, takimi jak ", { term: "nobody" }, " i ", { term: "never" }, ", zwykle stosuje się ", { term: "almost" }, ":"], tr: [{ term: "nobody" }, " ve ", { term: "never" }, " gibi olumsuz sözcüklerden önce genellikle ", { term: "almost" }, " kullanılır:"], id: ["Sebelum kata negatif seperti ", { term: "nobody" }, " dan ", { term: "never" }, ", pilihan yang lazim adalah ", { term: "almost" }, ":"], vi: ["Trước các từ phủ định như ", { term: "nobody" }, " và ", { term: "never" }, ", thường dùng ", { term: "almost" }, ":"] }
            ex: { examples: [[{ target: Almost }, " nobody came."], ["We ", { target: almost }, " never eat out."]] }
            tr: { uk: { examples: ["Майже ніхто не прийшов.", "Ми майже ніколи не ходимо їсти в ресторани."] }, es: { examples: ["Casi nadie vino.", "Casi nunca comemos fuera."] }, pt: { examples: ["Quase ninguém veio.", "Quase nunca comemos fora."] }, fr: { examples: ["Presque personne n’est venu.", "Nous ne mangeons presque jamais au restaurant."] }, de: { examples: ["Fast niemand kam.", "Wir essen fast nie auswärts."] }, it: { examples: ["Non è venuto quasi nessuno.", "Non mangiamo quasi mai fuori."] }, pl: { examples: ["Prawie nikt nie przyszedł.", "Prawie nigdy nie jadamy poza domem."] }, tr: { examples: ["Neredeyse kimse gelmedi.", "Neredeyse hiç dışarıda yemek yemeyiz."] }, id: { examples: ["Hampir tidak ada yang datang.", "Kami hampir tidak pernah makan di luar."] }, vi: { examples: ["Hầu như không ai đến.", "Chúng tôi hầu như không bao giờ ăn ngoài."] } }
          - type: rule
            level: C1
            text: { en: [{ term: not nearly }, " means far from:"], uk: [{ term: "not nearly" }, " означає «далеко не»:"], es: [{ term: "not nearly" }, " significa «ni de lejos»:"], pt: [{ term: "not nearly" }, " significa “nem de longe”:"], fr: [{ term: "not nearly" }, " signifie « loin de » :"], de: [{ term: "not nearly" }, " bedeutet „bei Weitem nicht“:"], it: [{ term: "not nearly" }, " significa «neanche lontanamente»:"], pl: [{ term: "not nearly" }, " znaczy „daleko od tego”:"], tr: [{ term: "not nearly" }, " “hiç de değil, çok uzak” anlamına gelir:"], id: [{ term: "not nearly" }, " berarti “jauh dari”:"], vi: [{ term: "not nearly" }, " có nghĩa là “còn lâu mới”:"] }
            ex: ["That is ", { target: not nearly }, " enough."]
            tr: { uk: "Цього далеко не досить.", es: "Eso no es ni de lejos suficiente.", pt: "Isso não é nem de longe suficiente.", fr: "C’est loin d’être suffisant.", de: "Das ist bei Weitem nicht genug.", it: "Non è neanche lontanamente abbastanza.", pl: "To zdecydowanie za mało.", tr: "Bu yeterli olmaktan çok uzak.", id: "Itu jauh dari cukup.", vi: "Thế còn lâu mới đủ." }

  - title: { en: Intensifier collocations, uk: "Сполучуваність підсилювачів", es: "Colocaciones de los intensificadores", pt: "Colocações dos intensificadores", fr: "Collocations des renforçateurs", de: "Kollokationen von Verstärkern", it: "Collocazioni dei rafforzativi", pl: "Kolokacje wzmacniaczy", tr: "Pekiştiricilerin eşdizimleri", id: "Kolokasi penegas", vi: "Kết hợp từ của từ nhấn mạnh" }
    role: own
