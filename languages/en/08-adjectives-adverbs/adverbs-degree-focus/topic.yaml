          - { level: C2, adverb: immensely, with: { alternatives: [popular, grateful, enjoy] }, ex: { examples: [["The show was ", { target: immensely popular }, "."], ["We ", { target: immensely }, " enjoyed the concert."]] }, tr: { uk: { examples: ["Шоу було надзвичайно популярним.", "Ми надзвичайно насолодилися концертом."] }, es: { examples: ["El espectáculo fue inmensamente popular.", "Disfrutamos inmensamente del concierto."] }, pt: { examples: ["O show foi imensamente popular.", "Nós apreciamos imensamente o show."] }, fr: { examples: ["Le spectacle a eu un immense succès.", "Nous avons immensément apprécié le concert."] }, de: { examples: ["Die Show war ungeheuer beliebt.", "Wir haben das Konzert ungemein genossen."] }, it: { examples: ["Lo spettacolo era immensamente popolare.", "Abbiamo goduto immensamente del concerto."] }, pl: { examples: ["Spektakl był niezmiernie popularny.", "Niezmiernie podobał nam się koncert."] }, tr: { examples: ["Gösteri son derece popülerdi.", "Konserden son derece keyif aldık."] }, id: { examples: ["Pertunjukan itu sangat populer.", "Kami sangat menikmati konser itu."] }, vi: { examples: ["Chương trình vô cùng nổi tiếng.", "Chúng tôi vô cùng thích buổi hòa nhạc."] } } }
