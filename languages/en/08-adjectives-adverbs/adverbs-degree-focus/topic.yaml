            text: { en: [{ term: even }, " follows the auxiliary in a negative sentence:"], uk: ["У реченні із запереченням ", { term: "even" }, " стоїть після допоміжного дієслова:"], es: ["En una oración negativa, ", { term: "even" }, " va después del auxiliar:"], pt: ["Em uma frase negativa, ", { term: "even" }, " vem depois do auxiliar:"], fr: ["Dans une phrase négative, ", { term: "even" }, " se place après l’auxiliaire :"], de: ["In einem verneinten Satz steht ", { term: "even" }, " nach dem Hilfsverb:"], it: ["In una frase negativa, ", { term: "even" }, " segue l'ausiliare:"], pl: ["W zdaniu przeczącym ", { term: "even" }, " stoi po czasowniku pomocniczym:"], tr: ["Olumsuz cümlede ", { term: "even" }, ", yardımcı fiilden sonra gelir:"], id: ["Dalam kalimat negatif, ", { term: "even" }, " diletakkan setelah kata kerja bantu:"], vi: ["Trong câu phủ định, ", { term: "even" }, " đứng sau trợ động từ:"] }
            ex: ["He didn't ", { target: even }, " call."]
            tr: { uk: "Він навіть не подзвонив.", es: "Ni siquiera llamó.", pt: "Ele nem ligou.", fr: "Il n’a même pas appelé.", de: "Er hat nicht einmal angerufen.", it: "Non ha nemmeno chiamato.", pl: "Nawet nie zadzwonił.", tr: "Aramadı bile.", id: "Dia bahkan tidak menelepon.", vi: "Anh ấy thậm chí không gọi điện." }

