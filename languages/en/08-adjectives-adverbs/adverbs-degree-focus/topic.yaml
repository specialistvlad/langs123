 "Burada epey insan tanıyorum."] }, id: { examples: ["Kami punya cukup banyak waktu.", "Saya kenal cukup banyak orang di sini."] }, vi: { examples: ["Chúng ta có khá nhiều thời gian.", "Tôi quen khá nhiều người ở đây."] } } }
          - { level: B2, use: { en: [{ term: rather }, " means more than expected, often in a critical sense"], uk: [{ term: "rather" }, " означає більше, ніж очікувалося, часто з критичним відтінком"], es: [{ term: "rather" }, " indica más de lo esperado, a menudo con sentido crítico"], pt: [{ term: "rather" }, " indica mais do que o esperado, muitas vezes em sentido crítico"], fr: [{ term: "rather" }, " indique plus que prévu, souvent dans un sens critique"], de: [{ term: "rather" }, " bedeutet mehr als erwartet, oft kritisch gemeint"], it: [{ term: "rather" }, " indica più del previsto, spesso in senso critico"], pl: [{ term: "rather" }, " oznacza więcej, niż się spodziewano, często w znaczeniu krytycznym"], tr: [{ term: "rather" }, " beklenenden fazlasını bildirir, çoğu zaman eleştirel bir anlamda"], id: [{ term: "rather" }, " berarti lebih dari yang diharapkan, sering dengan nada kritis"], vi: [{ term: "rather" }, " nghĩa là hơn mức mong đợi, thường mang sắc thái chê"] }, ex: { examples: [["It's ", { target: "rather cold" }, " in here."], ["The test was ", { target: "rather difficult" }, "."]] }, tr: { uk: { examples: ["Тут доволі холодно.", "Тест був доволі складний."] }, es: { examples: ["Aquí hace más bien frío.", "El examen fue más bien difícil."] }, pt: { examples: ["Está bem frio aqui dentro.", "O teste foi bem difícil."] }, fr: { examples: ["Il fait plutôt froid ici.", "Le test était plutôt difficile."] }, de: { examples: ["Hier drinnen ist es recht kalt.", "Der Test war recht schwierig."] }, it: { examples: ["Qui dentro fa piuttosto freddo.", "Il test era piuttosto difficile."] }, pl: { examples: ["Jest tu raczej zimno.", "Test był raczej trudny."] }, tr: { examples: ["Burada hava biraz fazla soğuk.", "Test epey zordu."] }, id: { examples: ["Di sini lumayan dingin.", "Tesnya lumayan sulit."] }, vi: { examples: ["Ở đây khá là lạnh.", "Bài kiểm tra khá khó."] } } }
          - { level: B2, use: { en: ["Before a singular noun, the article follows ", { term: quite }, " and ", { term: rather }], uk: ["Перед іменником в однині артикль стоїть після ", { term: "quite" }, " і ", { term: "rather" }], es: ["Ante un sustantivo singular, el artículo va después de ", { term: "quite" }, " y ", { term: "rather" }], pt: ["Antes de um substantivo singular, o artigo vem depois de ", { term: "quite" }, " e ", { term: "rather" }], fr: ["Devant un nom au singulier, l’article se place après ", { term: "quite" }, " et ", { term: "rather" }], de: ["Vor einem Nomen im Singular steht der Artikel nach ", { term: "quite" }, " und ", { term: "rather" }], it: ["Davanti a un nome singolare, l'articolo segue ", { term: "quite" }, " e ", { term: "rather" }], pl: ["Przed rzeczownikiem w liczbie pojedynczej przedimek stoi po ", { term: "quite" }, " i ", { term: "rather" }], tr: ["Tekil bir isimden önce artikel ", { term: "quite" }, " ve ", { term: "rather" }, " sözcüklerinden sonra gelir"], id: ["Sebelum kata benda tunggal, artikel diletakkan setelah ", { term: "quite" }, " dan ", { term: "rather" }], vi: ["Trước danh từ số ít, mạo từ đứng sau ", { term: "quite" }, " và ", { term: "rather" }] }, ex: { examples: [["We had ", { target: "quite a nice" }, " day."], ["It was ", { target: "rather a long" }, " journey."]] }, tr: { uk: { examples: ["У нас був досить гарний день.", "Це була доволі довга подорож."] }, es: { examples: ["Tuvimos un día bastante agradable.", "Fue un viaje más bien largo."] }, pt: { examples: ["Tivemos um dia bastante agradável.", "Foi uma viagem bem longa."] }, fr: { examples: ["Nous avons passé une assez belle journée.", "Le voyage a été plutôt long."] }, de: { examples: ["Wir hatten einen ziemlich schönen Tag.", "Es war eine recht lange Reise."] }, it: { examples: ["Abbiamo passato una giornata piuttosto bella.", "È stato un viaggio piuttosto lungo."] }, pl: { examples: ["Mieliśmy całkiem miły dzień.", "To była raczej długa podróż."] }, tr: { examples: ["Oldukça güzel bir gün geçirdik.", "Epey uzun bir yolculuktu."] }, id: { examples: ["Kami menghabiskan hari yang cukup menyenangkan.", "Itu perjalanan yang lumayan panjang."] }, vi: { examples: ["Chúng tôi đã có một ngày khá vui.", "Đó là một chuyến đi khá dài."] } } }
