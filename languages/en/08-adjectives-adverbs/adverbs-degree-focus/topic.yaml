# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.adjectives-adverbs.adverbs-degree-focus
lang: en
kind: grammar
tags: [adverbs, degree, focus, stance]
concepts: [adverbs, degree, stance]
related: [en.adjectives-adverbs.adverbs-frequency-manner, en.adjectives-adverbs.too-enough-so-such, en.adjectives-adverbs.adjective-order, en.sentence-building.word-order, en.adjectives-adverbs.comparatives-superlatives]
status: { en: draft }

title: { en: "Adverbs of Degree, Focus and Attitude" }
summary:
  lead:
    en: ["Degree adverbs say how much (", { term: very }, ", ", { term: absolutely }, "), focus adverbs single out a word (", { term: only }, ") and stance adverbs show the speaker's view (", { term: frankly }, ")."]
  rule:
    en: ["Gradable adjectives take ", { term: very }, "; extreme adjectives take ", { term: absolutely }, ":"]
  ex: { examples: [["It's ", { target: "very cold" }, "."], ["It's ", { target: "absolutely freezing" }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B2, point: { en: Degree with adjectives }, rule: { en: [{ term: very }, " goes with gradable adjectives, ", { term: absolutely }, " with extreme ones"] }, ex: { examples: [["It's ", { target: "very cold" }, "."], ["It's ", { target: "absolutely freezing" }, "."]] } }
        - { level: B2, point: { en: Quite }, rule: { en: [{ term: quite }, " means fairly before a gradable adjective, completely before an extreme one"] }, ex: { examples: [["It's ", { target: "quite good" }, "."], ["I'm ", { target: "quite sure" }, "."]] } }
        - { level: B2, point: { en: Degree with verbs }, rule: { en: ["most precede the verb; ", { term: very much }, " and ", { term: a lot }, " follow it"] }, ex: { examples: [["I ", { target: totally }, " agree."], ["I like it ", { target: "very much" }, "."]] } }
        - { level: B2, point: { en: Focus }, rule: { en: "a focus adverb stands next to the word it focuses on" }, ex: { examples: [[{ target: Only }, " Tom came."], ["Tom came ", { target: only }, " on Monday."]] } }
        - { level: B2, point: { en: Still and no longer }, rule: { en: [{ term: still }, " continues; ", { term: no longer }, " and ", { term: any more }, " end"] }, ex: { examples: [["She ", { target: still }, " lives here."], ["She ", { target: no longer }, " lives here."]] } }
        - { level: B2, point: { en: Sentence adverbs }, rule: { en: "they comment on the whole sentence; a comma follows at the start" }, ex: [{ target: Luckily }, ", nobody was hurt."] }
        - { level: C1, point: { en: Downtoners }, rule: { en: [{ term: hardly }, ", ", { term: scarcely }, " and ", { term: barely }, " are negative: no second negative"] }, ex: ["I can ", { target: hardly }, " see."] }
        - { level: C1, point: { en: Collocations }, rule: { en: "the intensifier follows the meaning of the adjective" }, ex: { examples: [[{ target: highly }, " unlikely"], [{ target: deeply }, " concerned"]] } }
        - { level: C1, point: { en: Stance adverbs }, rule: { en: "they show how sure or how fair the speaker is" }, ex: [{ target: Arguably }, ", it is her best book."] }
        - { level: C2, point: { en: Formal adverbs }, rule: { en: "formal prose adds adverbs such as invariably and exceedingly" }, ex: { examples: [["He ", { target: invariably }, " arrives early."], ["She was ", { target: exceedingly }, " kind."]] } }
        - { level: C2, point: { en: Position }, rule: { en: "an adverb follows the first auxiliary; before it for emphasis" }, ex: { examples: [["It has ", { target: quite clearly }, " been a success."], ["He ", { target: certainly }, " has."]] } }
        - { level: B2, point: { en: Trap }, rule: { en: ["an extreme adjective takes ", { term: absolutely }, " or ", { term: really }] }, ex: ["The soup is ", { target: "absolutely delicious" }, "."] }

sections:
  - title: { en: "Form: degree adverbs with adjectives" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Adjective type } }
          - { key: adverbs, label: { en: Adverbs } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, type: { en: "gradable, a high degree" }, adverbs: { alternatives: [very, extremely, terribly] }, ex: { examples: [["It's ", { target: "very cold" }, "."], ["The soup is ", { target: "extremely hot" }, "."]] } }
          - { level: B2, type: { en: extreme }, adverbs: { alternatives: [absolutely, completely, totally, utterly] }, ex: { examples: [["It's ", { target: "absolutely freezing" }, "."], ["I'm ", { target: "completely exhausted" }, "."]] } }
          - { level: B2, type: { en: classifying }, adverbs: { alternatives: [completely, totally, entirely, absolutely] }, ex: { examples: [["The plan is ", { target: "absolutely perfect" }, "."], ["The two cases are ", { target: "entirely different" }, "."]] } }
          - { level: B2, type: { en: "gradable, a moderate degree" }, adverbs: { alternatives: [quite, rather, fairly, pretty] }, ex: { examples: [["The room is ", { target: "fairly big" }, "."], ["The food was ", { target: "pretty good" }, "."]] } }
          - { level: B2, type: { en: "gradable, a low degree" }, adverbs: { alternatives: [slightly, "a bit", somewhat] }, ex: { examples: [["I'm ", { target: "slightly tired" }, "."], ["It's ", { target: "a bit cold" }, " today."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: Really }, " goes with gradable and extreme adjectives:"] }
            ex: { examples: [["It's ", { target: "really cold" }, "."], ["It's ", { target: "really fantastic" }, "."]] }

  - title: { en: "Gradable, extreme and classifying adjectives" }
    role: own
    content:
      - type: comparison
        columns:
          - { key: gradable, label: { en: Gradable } }
          - { key: extreme, label: { en: Extreme } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, gradable: cold, extreme: freezing, ex: ["It was ", { target: "very cold" }, " at noon and ", { target: "absolutely freezing" }, " at night."] }
          - { level: B2, gradable: good, extreme: fantastic, ex: ["The soup was ", { target: "very good" }, " and the cake was ", { target: "absolutely fantastic" }, "."] }
          - { level: B2, gradable: big, extreme: enormous, ex: ["Our flat is ", { target: "very big" }, ", but theirs is ", { target: "absolutely enormous" }, "."] }
          - { level: B2, gradable: tired, extreme: exhausted, ex: ["I was ", { target: "very tired" }, " and she was ", { target: "completely exhausted" }, "."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["A classifying adjective names a category, not a point on a scale: ", { term: impossible }, ", ", { term: perfect }, ", ", { term: identical }, ", ", { term: unique }, "."] }
            ex: ["The answer is ", { target: "completely impossible" }, "."]

  - title: { en: "Use: quite and rather" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, use: { en: [{ term: quite }, " before a gradable adjective means fairly"] }, ex: { examples: [["The film was ", { target: "quite good" }, "."], ["It's ", { target: "quite cold" }, " today."]] } }
          - { level: B2, use: { en: [{ term: quite }, " before an extreme or classifying adjective means completely"] }, ex: { examples: [["The plan is ", { target: "quite perfect" }, "."], ["That is ", { target: "quite impossible" }, "."]] } }
          - { level: B2, use: { en: [{ term: quite a lot }, " and ", { term: quite a few }, " mean a fairly large amount or number"] }, ex: { examples: [["We have ", { target: "quite a lot" }, " of time."], ["I know ", { target: "quite a few" }, " people here."]] } }
          - { level: B2, use: { en: [{ term: rather }, " means more than expected, often in a critical sense"] }, ex: { examples: [["It's ", { target: "rather cold" }, " in here."], ["The test was ", { target: "rather difficult" }, "."]] } }
          - { level: B2, use: { en: ["Before a singular noun, the article follows ", { term: quite }, " and ", { term: rather }] }, ex: { examples: [["We had ", { target: "quite a nice" }, " day."], ["It was ", { target: "rather a long" }, " journey."]] } }
      - type: list
        items:
          - type: note
            level: B2
            variety: en-US
            text: { en: [{ term: quite }, " is often as strong as ", { term: very }, "."] }
            ex: ["The film was ", { target: "quite good" }, "."]

  - title: { en: "Use: degree adverbs with verbs" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, adverbs: { alternatives: [really, totally, completely, absolutely] }, use: { en: "a high degree; before the main verb" }, ex: { examples: [["I ", { target: really }, " like it."], ["I ", { target: totally }, " agree."]] } }
          - { level: B2, adverbs: { alternatives: [deeply, strongly, greatly] }, use: { en: "a strong, more formal degree; before the main verb" }, ex: { examples: [["I ", { target: strongly }, " disagree."], ["We ", { target: greatly }, " admire her."]] } }
          - { level: B2, adverbs: { alternatives: [almost, nearly] }, use: { en: "not quite; before the main verb" }, ex: { examples: [["I ", { target: almost }, " fell."], ["She ", { target: nearly }, " missed the bus."]] } }
          - { level: B2, adverbs: hardly, use: { en: "almost not; before the main verb" }, ex: ["I ", { target: hardly }, " know him."] }
          - { level: B2, adverbs: { alternatives: [a lot, very much] }, use: { en: "a high degree; after the verb or its object" }, ex: { examples: [["She helps ", { target: a lot }, "."], ["I like it ", { target: very much }, "."]] } }
          - { level: B2, adverbs: a bit, use: { en: "a low degree; after the verb or its object" }, ex: ["Can you speak up ", { target: a bit }, "?"] }
          - { level: B2, adverbs: ["not", { gap: true }, "at all"], use: { en: "none; at the end of the clause" }, ex: ["I didn't enjoy it ", { target: at all }, "."] }
          - { level: B2, adverbs: not quite, use: { en: "almost, but not completely" }, ex: ["I'm ", { target: not quite }, " ready."] }
          - { level: B2, adverbs: not really, use: { en: "a softer no" }, ex: { exchange: ["Do you like jazz?", [{ target: Not really }, "."]] } }

  - title: { en: "Use: focus adverbs" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, adverbs: { alternatives: [only, merely, simply] }, use: { en: "nothing more than" }, ex: { examples: [["She ", { target: only }, " wants a coffee."], ["It is ", { target: merely }, " a suggestion."], ["You ", { target: simply }, " press the button."]] } }
          - { level: B2, adverbs: even, use: { en: "more than expected" }, ex: [{ target: Even }, " a child can do it."] }
          - { level: B2, adverbs: { alternatives: [also, too, as well] }, use: { en: "in addition; also goes before the main verb, too and as well at the end" }, ex: { examples: [["She ", { target: also }, " speaks French."], ["She speaks French ", { target: too }, "."]] } }
          - { level: B2, adverbs: { alternatives: [especially, particularly] }, use: { en: "above all the others" }, ex: { examples: [["I love fruit, ", { target: especially }, " apples."], ["The food was ", { target: particularly }, " good."]] } }
          - { level: B2, adverbs: { alternatives: [mainly, mostly] }, use: { en: "in most cases" }, ex: { examples: [["We sell ", { target: mainly }, " books."], ["The guests were ", { target: mostly }, " students."]] } }
          - { level: B2, adverbs: { alternatives: [exactly, precisely] }, use: { en: "no more and no less" }, ex: { examples: [["It costs ", { target: exactly }, " ten pounds."], ["We meet at ", { target: precisely }, " nine."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A focus adverb stands next to the word it focuses on:" }
            ex: { examples: [[{ target: Only }, " Tom came."], ["Tom came ", { target: only }, " on Monday."]] }
          - type: rule
            level: B2
            text: { en: [{ term: even }, " follows the auxiliary in a negative sentence:"] }
            ex: ["He didn't ", { target: even }, " call."]

  - title: { en: "Use: the meanings of just" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, use: { en: [{ term: just }, " means exactly"] }, ex: { examples: [["The soup is ", { target: just }, " right."], ["It looks ", { target: just }, " like mine."]] } }
          - { level: B2, use: { en: [{ term: just }, " means only"] }, ex: ["It will take ", { target: just }, " a minute."] }
          - { level: B2, use: { en: [{ term: just }, " means at this moment, or about to do something"] }, ex: { examples: [["I'm ", { target: just }, " leaving."], ["I was ", { target: just }, " going to call you."]] } }
          - { level: B2, use: { en: [{ term: just }, " in a request or an instruction makes it friendlier"] }, ex: { examples: [[{ target: Just }, " ask her."], ["Could I ", { target: just }, " borrow your pen?"]] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: [{ term: just }, " with the present perfect, for a moment ago, is in ", { link: Perfect Tenses, to: en.tenses.perfect-tenses }, "."] }

  - title: { en: "Use: still, no longer and any more" }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, word: still, use: { en: "the situation continues; before the main verb, after be" }, ex: { examples: [["She ", { target: still }, " lives here."], ["She is ", { target: still }, " asleep."]] } }
          - { level: B2, word: no longer, use: { en: "the situation has ended; before the main verb, after be" }, ex: { examples: [["She ", { target: no longer }, " lives here."], ["He is ", { target: no longer }, " a student."]] } }
          - { level: B2, word: { alternatives: [["not", { gap: true }, "any more"], ["not", { gap: true }, "any longer"]] }, use: { en: "the situation has ended; at the end of the clause" }, ex: { examples: [["She doesn't live here ", { target: any more }, " ", { variant: anymore, variety: en-US }, "."], ["I can't wait ", { target: any longer }, "."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["In a negative sentence, ", { term: still }, " goes before the auxiliary:"] }
            ex: ["He ", { target: still }, " doesn't understand."]

  - title: { en: "Compare: still, yet and already" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: row, label: { en: Point } }
          - { key: still, label: still }
          - { key: yet, label: yet }
          - { key: already, label: already }
        rows:
          - { level: B2, row: { en: Meaning }, still: { en: "continues up to now" }, yet: { en: "expected, but not yet true" }, already: { en: "sooner than expected" } }
          - { level: B2, row: { en: Sentences }, still: { en: "positive, negative, questions" }, yet: { en: "negative and questions" }, already: { en: "positive and questions" } }
          - { level: B2, row: { en: Position }, still: { en: "before the main verb" }, yet: { en: "at the end" }, already: { en: "before the main verb or at the end" } }
          - { level: B2, row: { en: Example }, still: ["She is ", { target: still }, " here."], yet: ["She isn't here ", { target: yet }, "."], already: ["She is ", { target: already }, " here."] }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: [{ term: yet }, " and ", { term: already }, " with the present perfect are in ", { link: Perfect Tenses, to: en.tenses.perfect-tenses }, "."] }

  - title: { en: "Use: sentence adverbs" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, adverbs: { alternatives: [fortunately, unfortunately, luckily, surprisingly] }, use: { en: "the speaker's judgement of the event" }, ex: { examples: [[{ target: Fortunately }, ", nobody was hurt."], [{ target: Surprisingly }, ", the test was easy."]] } }
          - { level: B2, adverbs: { alternatives: [obviously, clearly] }, use: { en: "the fact is plain to everyone" }, ex: { examples: [[{ target: Obviously }, ", she was tired."], [{ target: Clearly }, ", he knew the answer."]] } }
          - { level: B2, adverbs: { alternatives: [apparently, presumably] }, use: { en: "the speaker has heard it, or assumes it" }, ex: { examples: [[{ target: Apparently }, ", the shop is closed."], [{ target: Presumably }, ", he has left."]] } }
          - { level: B2, adverbs: { alternatives: [frankly, honestly, personally] }, use: { en: "the speaker's own words and view" }, ex: { examples: [[{ target: Frankly }, ", I disagree."], [{ target: Personally }, ", I prefer tea."]] } }
          - { level: B2, adverbs: basically, use: { en: "in essence" }, ex: [{ target: Basically }, ", it is a game of chance."] }
          - { level: B2, adverbs: actually, use: { en: "corrects or adds a fact, often a surprising one" }, ex: [{ target: Actually }, ", the film starts at eight."] }
          - { level: B2, adverbs: naturally, use: { en: "of course" }, ex: [{ target: Naturally }, ", we said yes."] }
          - { level: B2, adverbs: { alternatives: [politically, financially, technically] }, use: { en: "in that respect: a viewpoint" }, ex: { examples: [[{ target: Politically }, ", the plan is risky."], ["The idea is ", { target: technically }, " possible."]] } }

  - title: { en: "Form: position of sentence adverbs" }
    role: form
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, position: { en: "at the start, followed by a comma" }, ex: [{ target: Obviously }, ", she was tired."] }
          - { level: B2, position: { en: "in the middle: before the main verb, after be" }, ex: { examples: [["She ", { target: obviously }, " knew."], ["He is ", { target: obviously }, " tired."]] } }
          - { level: B2, position: { en: "at the end, after a comma" }, ex: ["She was tired, ", { target: obviously }, "."] }

  - title: { en: "Compare: sentence adverbs and manner adverbs" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: row, label: { en: Point } }
          - { key: sentence, label: { en: Sentence adverb } }
          - { key: manner, label: { en: Manner adverb } }
        rows:
          - { level: B2, row: { en: Meaning }, sentence: { en: "the speaker's comment on the whole sentence" }, manner: { en: "how the action is done" } }
          - { level: B2, row: { en: Example }, sentence: [{ target: Clearly }, ", she was ill."], manner: ["She spoke ", { target: clearly }, "."] }
          - { level: B2, row: { en: Example }, sentence: [{ target: Honestly }, ", he answered."], manner: ["He answered ", { target: honestly }, "."] }
      - type: list
        items:
          - type: note
            level: B2
            text: { en: ["Manner adverbs and their position are in ", { link: Adverbs of frequency and manner, to: en.adjectives-adverbs.adverbs-frequency-manner }, "."] }

  - title: { en: Downtoners and approximators }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, adverbs: { alternatives: [scarcely, barely] }, use: { en: "only just; scarcely is formal" }, ex: { examples: [["We had ", { target: scarcely }, " enough money."], ["She ", { target: barely }, " slept."]] } }
          - { level: C1, adverbs: { alternatives: [virtually, practically] }, use: { en: "in effect, though not strictly" }, ex: { examples: [["The road is ", { target: virtually }, " empty."], ["It's ", { target: practically }, " impossible."]] } }
          - { level: C1, adverbs: all but, use: { en: "very nearly" }, ex: ["The job is ", { target: all but }, " finished."] }
          - { level: C1, adverbs: more or less, use: { en: "roughly, nearly" }, ex: { examples: [["I ", { target: more or less }, " agree."], ["It's ", { target: more or less }, " ready."]] } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: hardly }, ", ", { term: scarcely }, " and ", { term: barely }, " are negative in meaning, so the verb is positive:"] }
            ex: ["I ", { target: hardly }, " know anyone here."]
          - type: rule
            level: C1
            text: { en: ["Before negative words such as ", { term: nobody }, " and ", { term: never }, ", ", { term: almost }, " is the usual choice:"] }
            ex: { examples: [[{ target: Almost }, " nobody came."], ["We ", { target: almost }, " never eat out."]] }
          - type: rule
            level: C1
            text: { en: [{ term: not nearly }, " means far from:"] }
            ex: ["That is ", { target: not nearly }, " enough."]

  - title: { en: Intensifier collocations }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: with, label: { en: Goes with } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, adverb: deeply, with: { alternatives: [concerned, grateful, moved, ashamed] }, ex: { examples: [["We are ", { target: deeply grateful }, "."], ["She was ", { target: deeply moved }, "."]] } }
          - { level: C1, adverb: highly, with: { alternatives: [unlikely, likely, successful, skilled] }, ex: { examples: [["It is ", { target: highly unlikely }, "."], ["He is a ", { target: highly skilled }, " nurse."]] } }
          - { level: C1, adverb: bitterly, with: { alternatives: [cold, disappointed] }, ex: { examples: [["It was ", { target: bitterly cold }, " last night."], ["He was ", { target: bitterly disappointed }, "."]] } }
          - { level: C1, adverb: utterly, with: { alternatives: [ridiculous, useless, hopeless] }, ex: ["The idea is ", { target: utterly ridiculous }, "."] }
          - { level: C1, adverb: fully, with: { alternatives: [aware, prepared, understand] }, ex: ["I am ", { target: fully aware }, " of the risks."] }
          - { level: C1, adverb: perfectly, with: { alternatives: [clear, normal, fine] }, ex: ["It's ", { target: perfectly normal }, " to feel nervous."] }
          - { level: C1, adverb: painfully, with: { alternatives: [slow, shy, obvious] }, ex: ["The queue was ", { target: painfully slow }, "."] }
          - { level: C1, adverb: widely, with: { alternatives: [known, believed, used] }, ex: ["The song is ", { target: widely known }, "."] }
          - { level: C1, adverb: { alternatives: [strongly, firmly] }, with: { alternatives: [recommend, believe, disagree, support] }, ex: { examples: [["I ", { target: strongly recommend }, " this book."], ["We ", { target: firmly believe }, " in her."]] } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["The intensifier follows the meaning of the word: feelings take ", { term: deeply }, ", chances take ", { term: highly }, ", clarity takes ", { term: perfectly }, "."] }

  - title: { en: Adverbs before participles }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, use: { en: "adverb and past participle as an adjective before a noun" }, ex: { examples: [["a ", { target: highly recommended }, " hotel"], ["a ", { target: carefully planned }, " trip"]] } }
          - { level: C1, use: { en: ["after ", { term: be }, ": the same pair describes the subject"] }, ex: { examples: [["The story is ", { target: widely believed }, "."], ["She was ", { target: deeply moved }, "."]] } }
          - { level: C1, use: { en: "adverb and -ing participle: the effect on others" }, ex: { examples: [["a ", { target: deeply moving }, " film"], ["a ", { target: highly demanding }, " job"]] } }

  - title: { en: Stance adverbs }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, adverbs: arguably, use: { en: "the claim can be defended, but not everyone agrees" }, ex: [{ target: Arguably }, ", it is her best book."] }
          - { level: C1, adverbs: admittedly, use: { en: "the speaker accepts a point against the argument" }, ex: ["The hotel is old, ", { target: admittedly }, ", but it is clean."] }
          - { level: C1, adverbs: supposedly, use: { en: "people say so, but the speaker doubts it" }, ex: ["The food is ", { target: supposedly }, " the best in town."] }
          - { level: C1, adverbs: evidently, use: { en: "the evidence shows it" }, ex: [{ target: Evidently }, ", the meeting has ended."] }
          - { level: C1, adverbs: undoubtedly, use: { en: "there is no doubt" }, ex: ["She is ", { target: undoubtedly }, " the best player."] }
          - { level: C1, adverbs: indeed, use: { en: "confirms a statement and adds to it" }, ex: ["It was a good idea, ", { target: indeed }, " a brilliant one."] }
          - { level: C1, adverbs: in fact, use: { en: "adds a fact that strengthens or corrects the sentence before" }, ex: ["I don't mind. ", { target: In fact }, ", I'd love to."] }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "At the start of a sentence, a stance adverb takes a comma:" }
            ex: [{ target: Undoubtedly }, ", she is the best player."]
          - type: rule
            level: C1
            text: { en: [{ term: arguably }, " and ", { term: undoubtedly }, " stand before the word they judge, with no commas:"] }
            ex: ["It is ", { target: arguably }, " her best book."]
          - type: rule
            level: C1
            text: { en: [{ term: admittedly }, " and ", { term: in fact }, " interrupt the clause between commas, marking a pause:"] }
            ex: ["The plan is, ", { target: admittedly }, ", expensive."]

  - title: { en: Focusing adverbs and scope }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, adverbs: { alternatives: [solely, purely] }, use: { en: "only, and nothing else" }, ex: { examples: [["The decision was ", { target: solely }, " mine."], ["I did it ", { target: purely }, " for fun."]] } }
          - { level: C1, adverbs: chiefly, use: { en: "mainly; formal" }, ex: ["She is known ", { target: chiefly }, " for her poems."] }
          - { level: C1, adverbs: { alternatives: [notably, in particular] }, use: { en: "singles out the most important example" }, ex: { examples: [["Many cities, ", { target: notably }, " Rome, are crowded."], ["I enjoyed the music ", { target: in particular }, "."]] } }
          - { level: C1, adverbs: { alternatives: [not only, not just] }, use: { en: "adds a second point" }, ex: { examples: [["The food is ", { target: not only }, " cheap but also good."], ["It is ", { target: not just }, " a game."]] } }
          - { level: C1, adverbs: not even, use: { en: "not the least likely person or thing" }, ex: [{ target: Not even }, " the teacher knew the answer."] }
      - type: usage
        columns:
          - { key: position, label: { en: Position of only } }
          - { key: use, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, position: { en: "before the subject" }, use: { en: "no one else said it" }, ex: [{ target: Only }, " she said hello."] }
          - { level: C1, position: { en: "before the verb" }, use: { en: "she did nothing more than say it" }, ex: ["She ", { target: only }, " said hello."] }
          - { level: C1, position: { en: "before the object" }, use: { en: "she said nothing else" }, ex: ["She said ", { target: only }, " hello."] }

  - title: { en: Informal intensifiers }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, adverbs: ever so, use: { en: "very; friendly, British" }, ex: { examples: [["It's ", { target: ever so }, " kind of you."], ["She was ", { target: ever so }, " nice."]] } }
          - { level: C1, adverbs: { alternatives: [awfully, dreadfully] }, use: { en: "very; before pleasant and unpleasant adjectives, British" }, ex: { examples: [["I'm ", { target: awfully }, " sorry."], ["She is ", { target: dreadfully }, " busy."]] } }
          - { level: C1, adverbs: jolly, use: { en: "very; dated, British" }, ex: ["That was ", { target: jolly }, " good."] }
          - { level: C1, adverbs: way, use: { en: "much, before a comparative or too; informal, mainly American" }, ex: { examples: [["This is ", { target: way }, " better."], ["It's ", { target: way }, " too late."]] } }

  - title: { en: Formal stance adverbs }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverbs, label: { en: Adverbs } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, adverbs: { alternatives: [purportedly, ostensibly] }, use: { en: "claimed or apparent, but perhaps untrue" }, ex: { examples: [["The photo was ", { target: purportedly }, " taken in 1950."], ["He left early, ", { target: ostensibly }, " to catch a train."]] } }
          - { level: C2, adverbs: conceivably, use: { en: "it is possible to imagine" }, ex: ["The strike could ", { target: conceivably }, " last a month."] }
          - { level: C2, adverbs: inevitably, use: { en: "it cannot be avoided" }, ex: ["Delays ", { target: inevitably }, " follow."] }
          - { level: C2, adverbs: invariably, use: { en: "every time" }, ex: ["He ", { target: invariably }, " arrives early."] }
          - { level: C2, adverbs: { alternatives: [undeniably, unquestionably] }, use: { en: "beyond doubt" }, ex: { examples: [["It is ", { target: undeniably }, " true."], ["She is ", { target: unquestionably }, " the best candidate."]] } }
          - { level: C2, adverbs: { alternatives: [markedly, decidedly] }, use: { en: "clearly, to a noticeable degree" }, ex: { examples: [["The results were ", { target: markedly }, " different."], ["It was a ", { target: decidedly }, " odd result."]] } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["Speech uses plainer words instead: ", { term: always }, " for ", { term: invariably }, ", ", { term: definitely }, " for ", { term: undeniably }, "."] }

  - title: { en: Formal degree adverbs }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: with, label: { en: Goes with } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, adverb: exceedingly, with: { alternatives: [difficult, rare, kind] }, ex: ["The exam was ", { target: exceedingly difficult }, "."] }
          - { level: C2, adverb: exceptionally, with: { alternatives: [talented, rare, well] }, ex: ["She is an ", { target: exceptionally talented }, " pianist."] }
          - { level: C2, adverb: remarkably, with: { alternatives: [similar, calm, quickly] }, ex: ["The twins are ", { target: remarkably similar }, "."] }
          - { level: C2, adverb: immensely, with: { alternatives: [popular, grateful, enjoy] }, ex: { examples: [["The show was ", { target: immensely popular }, "."], ["We ", { target: immensely }, " enjoyed the concert."]] } }
          - { level: C2, adverb: vastly, with: { alternatives: [better, different, improved] }, ex: { examples: [["The new road is ", { target: vastly better }, "."], ["Her health has ", { target: vastly improved }, "."]] } }
          - { level: C2, adverb: profoundly, with: { alternatives: [shocked, affected, moved] }, ex: ["He was ", { target: profoundly shocked }, "."] }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: [{ term: vastly }, " goes with comparatives and change, ", { term: profoundly }, " with feeling and effect."] }

  - title: { en: Position in complex verb phrases }
    role: own
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, position: { en: "after the first auxiliary" }, use: { en: "the usual place for adverbs of certainty and degree" }, ex: { examples: [["It has ", { target: quite clearly }, " been a success."], ["She will ", { target: probably }, " have left."]] } }
          - { level: C2, position: { en: "before the auxiliary" }, use: { en: "emphasis, mostly in short replies" }, ex: { exchange: ["Has he paid?", ["He ", { target: certainly }, " has."]] } }
          - { level: C2, position: { en: "between to and the verb" }, use: { en: "a split infinitive puts the stress on the adverb" }, ex: { examples: [["We want to ", { target: fully }, " understand it."], ["to ", { target: boldly }, " go"]] } }
          - { level: C2, position: { en: "final though" }, use: { en: "contrast with the sentence before; informal" }, ex: ["It's expensive. I like it, ", { target: though }, "."] }
          - { level: C2, position: { en: "final anyway" }, use: { en: "in spite of that" }, ex: ["It was raining, but we went ", { target: anyway }, "."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "It's very freezing today.", right: ["It's ", { target: absolutely freezing }, " today."], rule: { en: ["an extreme adjective takes ", { term: absolutely }, " or ", { term: really }, ", not ", { term: very }] } }
          - { level: B2, wrong: "The plan is very impossible.", right: ["The plan is ", { target: completely impossible }, "."], rule: { en: ["a classifying adjective takes ", { term: completely }, " or ", { term: totally }] } }
          - { level: B2, wrong: "I very like it.", right: ["I ", { target: really }, " like it."], rule: { en: [{ term: very }, " does not modify a verb; a verb takes ", { term: really }, " or ", { term: very much }] } }
          - { level: B2, wrong: "I like very much it.", right: ["I like it ", { target: very much }, "."], rule: { en: [{ term: very much }, " follows the object"] } }
          - { level: B2, wrong: "I don't no longer smoke.", right: ["I ", { target: no longer }, " smoke."], rule: { en: [{ term: no longer }, " is already negative, so the verb stays positive"] } }
          - { level: B2, wrong: "He even didn't call.", right: ["He didn't ", { target: even }, " call."], rule: { en: [{ term: even }, " follows the auxiliary in a negative sentence"] } }
          - { level: C1, wrong: "I can't hardly hear you.", right: ["I can ", { target: hardly }, " hear you."], rule: { en: [{ term: hardly }, " is negative in meaning, so the verb is positive"] } }
          - { level: C1, wrong: "The idea is highly ridiculous.", right: ["The idea is ", { target: utterly ridiculous }, "."], rule: { en: [{ term: ridiculous }, " takes ", { term: utterly }, ", not ", { term: highly }] } }
          - { level: C2, wrong: "The twins are remarkable similar.", right: ["The twins are ", { target: remarkably similar }, "."], rule: { en: "an adverb, not an adjective, modifies an adjective" } }
          - { level: C2, wrong: "It is a vastly good result.", right: ["It is a ", { target: vastly better }, " result."], rule: { en: [{ term: vastly }, " goes with comparatives and verbs of change"] } }
