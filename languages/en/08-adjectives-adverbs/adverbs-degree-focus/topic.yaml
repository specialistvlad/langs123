            text: { en: "A focus adverb stands next to the word it focuses on:", uk: "Фокусний прислівник стоїть біля слова, яке він виділяє:", es: "El adverbio de foco va junto a la palabra que destaca:", pt: "O advérbio de foco fica junto à palavra que destaca:", fr: "L’adverbe de focalisation se place à côté du mot qu’il met en relief :", de: "Ein Fokusadverb steht neben dem Wort, auf das es sich bezieht:", it: "L'avverbio di focalizzazione sta accanto alla parola che mette in risalto:", pl: "Przysłówek wyróżniający stoi obok słowa, które wyróżnia:", tr: "Odak zarfı, vurguladığı sözcüğün yanında yer alır:", id: "Kata keterangan fokus diletakkan di samping kata yang disorotnya:", vi: "Trạng từ tiêu điểm đứng cạnh từ mà nó nhấn vào:" }
            ex: { examples: [[{ target: Only }, " Tom came."], ["Tom came ", { target: only }, " on Monday."]] }
            tr: { uk: { examples: ["Прийшов тільки Том.", "Том прийшов лише в понеділок."] }, es: { examples: ["Solo vino Tom.", "Tom vino solo el lunes."] }, pt: { examples: ["Só o Tom veio.", "O Tom veio só na segunda-feira."] }, fr: { examples: ["Seul Tom est venu.", "Tom n’est venu que le lundi."] }, de: { examples: ["Nur Tom kam.", "Tom kam nur am Montag."] }, it: { examples: ["È venuto solo Tom.", "Tom è venuto solo il lunedì."] }, pl: { examples: ["Przyszedł tylko Tom.", "Tom przyszedł tylko w poniedziałek."] }, tr: { examples: ["Yalnızca Tom geldi.", "Tom yalnızca pazartesi günü geldi."] }, id: { examples: ["Hanya Tom yang datang.", "Tom datang hanya pada hari Senin."] }, vi: { examples: ["Chỉ có Tom đến.", "Tom chỉ đến vào thứ Hai."] } }
          - type: rule
