          - { level: C1, adverbs: way, use: { en: "much, before a comparative or too; informal, mainly American", uk: "набагато, перед вищим ступенем порівняння або too; розмовне, переважно американське", es: "mucho, ante un comparativo o too; informal, sobre todo estadounidense", pt: "muito, antes de um comparativo ou de too; informal, principalmente americano", fr: "beaucoup, devant un comparatif ou too ; familier, surtout américain", de: "viel, vor einem Komparativ oder too; umgangssprachlich, vor allem amerikanisch", it: "molto, davanti a un comparativo o a too; informale, soprattutto americano", pl: "dużo, przed stopniem wyższym lub too; nieformalne, głównie amerykańskie", tr: "çok daha, karşılaştırma derecesinden ya da too'dan önce; gündelik, çoğunlukla Amerikan kullanımı", id: "jauh, sebelum bentuk komparatif atau too; informal, terutama gaya Amerika", vi: "nhiều, trước dạng so sánh hơn hoặc too; thân mật, chủ yếu kiểu Mỹ" }, ex: { examples: [["This is ", { target: way }, " better."], ["It's ", { target: way }, " too late."]] }, tr: { uk: { examples: ["Це набагато краще.", "Уже геть запізно."] }, es: { examples: ["Esto es muchísimo mejor.", "Ya es demasiado tarde."] }, pt: { examples: ["Isso é bem melhor.", "Já é tarde demais."] }, fr: { examples: ["C’est bien mieux.", "Il est beaucoup trop tard."] }, de: { examples: ["Das ist viel besser.", "Es ist viel zu spät."] }, it: { examples: ["Questo è molto meglio.", "È decisamente troppo tardi."] }, pl: { examples: ["To jest dużo lepsze.", "Jest zdecydowanie za późno."] }, tr: { examples: ["Bu çok daha iyi.", "Çok geç oldu."] }, id: { examples: ["Ini jauh lebih baik.", "Sudah terlalu larut."] }, vi: { examples: ["Cái này tốt hơn nhiều.", "Đã quá muộn rồi."] } } }

  - title: { en: Formal stance adverbs, uk: "Формальні прислівники ставлення", es: "Adverbios de actitud formales", pt: "Advérbios de atitude formais", fr: "Adverbes d’attitude soutenus", de: "Formelle Einstellungsadverbien", it: "Avverbi di atteggiamento formali", pl: "Formalne przysłówki postawy", tr: "Resmî tutum zarfları", id: "Kata keterangan sikap formal", vi: "Trạng từ thái độ trang trọng" }
