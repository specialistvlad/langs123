          - { key: well, label: { en: [{ term: well }, " (adverb)"], uk: [{ term: well }, " (прислівник)"], es: [{ term: well }, " (adverbio)"], pt: [{ term: "well" }, " (advérbio)"], fr: [{ term: "well" }, " (adverbe)"], de: [{ term: "well" }, " (Adverb)"], it: [{ term: "well" }, " (avverbio)"], pl: [{ term: "well" }, " (przysłówek)"], tr: [{ term: "well" }, " (zarf)"], id: [{ term: "well" }, " (kata keterangan)"], vi: [{ term: "well" }, " (trạng từ)"] } }
        rows:
          - { level: A2, good: { en: describes a noun, uk: "описує іменник", es: "describe un sustantivo", pt: "descreve um substantivo", fr: "décrit un nom", de: "beschreibt ein Nomen", it: "descrive un sostantivo", pl: "opisuje rzeczownik", tr: "ismi niteler", id: "menerangkan kata benda", vi: "miêu tả danh từ" }, well: { en: describes a verb, uk: "описує дієслово", es: "describe un verbo", pt: "descreve um verbo", fr: "décrit un verbe", de: "beschreibt ein Verb", it: "descrive un verbo", pl: "opisuje czasownik", tr: "fiili niteler", id: "menerangkan kata kerja", vi: "miêu tả động từ" } }
          - { level: A2, good: { ex: ["She is a ", { target: good }, " singer."], tr: { uk: "Вона гарна співачка.", es: "Es una buena cantante.", pt: "Ela é uma boa cantora.", fr: "C’est une bonne chanteuse.", de: "Sie ist eine gute Sängerin.", it: "È una brava cantante.", pl: "Ona jest dobrą śpiewaczką.", tr: "O iyi bir şarkıcı.", id: "Dia penyanyi yang bagus.", vi: "Cô ấy là một ca sĩ giỏi." } }, well: { ex: ["She sings ", { target: well }, "."], tr: { uk: "Вона добре співає.", es: "Canta bien.", pt: "Ela canta bem.", fr: "Elle chante bien.", de: "Sie singt gut.", it: "Canta bene.", pl: "Ona dobrze śpiewa.", tr: "İyi şarkı söyler.", id: "Dia menyanyi dengan baik.", vi: "Cô ấy hát hay." } } }
          - { level: A2, good: { ex: ["The food is ", { target: good }, "."], tr: { uk: "Їжа смачна.", es: "La comida está buena.", pt: "A comida está boa.", fr: "Le repas est bon.", de: "Das Essen ist gut.", it: "Il cibo è buono.", pl: "Jedzenie jest dobre.", tr: "Yemek güzel.", id: "Makanannya enak.", vi: "Món ăn ngon." } }, well: { ex: ["He speaks English ", { target: well }, "."], tr: { uk: "Він добре говорить англійською.", es: "Habla bien inglés.", pt: "Ele fala bem inglês.", fr: "Il parle bien anglais.", de: "Er spricht gut Englisch.", it: "Parla bene l'inglese.", pl: "On dobrze mówi po angielsku.", tr: "İngilizceyi iyi konuşur.", id: "Dia berbicara bahasa Inggris dengan baik.", vi: "Anh ấy nói tiếng Anh giỏi." } } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
