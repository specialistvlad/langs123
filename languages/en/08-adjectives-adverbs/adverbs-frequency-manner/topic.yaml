          - { level: A2, ending: "-le", rule: { mapping: ["-le", ly] }, ex: { examples: [{ mapping: [simple, simply] }, { mapping: [terrible, terribly] }] }, tr: { uk: { examples: ["простий — просто", "жахливий — жахливо"] }, es: { examples: ["simple — simplemente", "terrible — terriblemente"] }, pt: { examples: ["simples — simplesmente", "terrível — terrivelmente"] }, fr: { examples: ["simple — simplement", "terrible — terriblement"] }, de: { examples: ["einfach — einfach", "schrecklich — schrecklich"] }, it: { examples: ["semplice — semplicemente", "terribile — terribilmente"] }, pl: { examples: ["prosty — prosto", "okropny — okropnie"] }, tr: { examples: ["basit — basitçe", "korkunç — korkunç derecede"] }, id: { examples: ["sederhana — dengan sederhana", "mengerikan — dengan mengerikan"] }, vi: { examples: ["đơn giản — một cách đơn giản", "khủng khiếp — một cách khủng khiếp"] } } }
          - { level: A2, ending: "-ic", rule: { pattern: [{ ending: ally }], follows: true }, ex: { mapping: [basic, basically] }, tr: { uk: "основний — в основному", es: "básico — básicamente", pt: "básico — basicamente", fr: "essentiel — essentiellement", de: "grundlegend — grundsätzlich", it: "fondamentale — fondamentalmente", pl: "podstawowy — zasadniczo", tr: "temel — temelde", id: "dasar — pada dasarnya", vi: "cơ bản — về cơ bản" } }
