  - title: { en: "Form: position of manner adverbs", uk: "Форма: місце прислівників способу дії", es: "Forma: posición de los adverbios de modo", pt: "Forma: posição dos advérbios de modo", fr: "Forme : place des adverbes de manière", de: "Form: Stellung der Adverbien der Art und Weise", it: "Forma: posizione degli avverbi di modo", pl: "Forma: miejsce przysłówków sposobu", tr: "Biçim: durum zarflarının konumu", id: "Bentuk: posisi kata keterangan cara", vi: "Dạng: vị trí của trạng từ chỉ cách thức" }
    role: form
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position, uk: "Місце", es: "Posición", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, position: { en: after the verb, uk: "після дієслова", es: "después del verbo", pt: "depois do verbo", fr: "après le verbe", de: "nach dem Verb", it: "dopo il verbo", pl: "po czasowniku", tr: "fiilden sonra", id: "setelah kata kerja", vi: "sau động từ" }, ex: ["She sings ", { target: beautifully }, "."], tr: { uk: "Вона чудово співає.", es: "Canta maravillosamente.", pt: "Ela canta lindamente.", fr: "Elle chante merveilleusement.", de: "Sie singt wunderschön.", it: "Canta magnificamente.", pl: "Ona pięknie śpiewa.", tr: "Çok güzel şarkı söyler.", id: "Dia menyanyi dengan indah.", vi: "Cô ấy hát tuyệt vời." } }
          - { level: A2, position: { en: after the object, uk: "після додатка", es: "después del objeto", pt: "depois do objeto", fr: "après le complément", de: "nach dem Objekt", it: "dopo il complemento oggetto", pl: "po dopełnieniu", tr: "nesneden sonra", id: "setelah objek", vi: "sau tân ngữ" }, ex: ["He opened the door ", { target: slowly }, "."], tr: { uk: "Він повільно відчинив двері.", es: "Abrió la puerta despacio.", pt: "Ele abriu a porta devagar.", fr: "Il a ouvert la porte lentement.", de: "Er öffnete die Tür langsam.", it: "Ha aperto la porta lentamente.", pl: "Powoli otworzył drzwi.", tr: "Kapıyı yavaşça açtı.", id: "Dia membuka pintu perlahan-lahan.", vi: "Anh ấy mở cửa chậm rãi." } }
          - { level: B2, position: { en: before the main verb }, ex: ["She ", { target: angrily }, " left."] }
          - { level: B2, position: { en: at the start of the sentence }, ex: [{ target: Angrily }, ", she left."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "After the verb the adverb tells how it was done; before the verb or first, how the doer felt." }
            ex: { examples: [["She left ", { target: angrily }, "."], ["She ", { target: angrily }, " left."], [{ target: Angrily }, ", she left."]] }
          - type: rule
            level: B2
            text: { en: "A comma follows an adverb at the start of a sentence." }
            ex: [{ target: Slowly }, ", he opened the door."]

