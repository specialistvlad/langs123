              id: ["Kata keterangan cara menyatakan bagaimana seseorang melakukan sesuatu. Sebagian besar berbentuk ", { pattern: [{ slot: "adjective" }, { term: "-ly" }] }, "."]
              vi: ["Trạng từ chỉ cách thức cho biết ai đó làm việc gì như thế nào. Hầu hết có dạng ", { pattern: [{ slot: "adjective" }, { term: "-ly" }] }, "."]

