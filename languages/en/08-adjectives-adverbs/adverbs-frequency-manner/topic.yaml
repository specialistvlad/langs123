          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, position: { en: after the verb, uk: "після дієслова", es: "después del verbo", pt: "depois do verbo", fr: "après le verbe", de: "nach dem Verb", it: "dopo il verbo", pl: "po czasowniku", tr: "fiilden sonra", id: "setelah kata kerja", vi: "sau động từ" }, ex: ["She sings ", { target: beautifully }, "."], tr: { uk: "Вона чудово співає.", es: "Canta maravillosamente.", pt: "Ela canta lindamente.", fr: "Elle chante merveilleusement.", de: "Sie singt wunderschön.", it: "Canta magnificamente.", pl: "Ona pięknie śpiewa.", tr: "Çok güzel şarkı söyler.", id: "Dia menyanyi dengan indah.", vi: "Cô ấy hát tuyệt vời." } }
          - { level: A2, position: { en: after the object, uk: "після додатка", es: "después del objeto", pt: "depois do objeto", fr: "après le complément", de: "nach dem Objekt", it: "dopo il complemento oggetto", pl: "po dopełnieniu", tr: "nesneden sonra", id: "setelah objek", vi: "sau tân ngữ" }, ex: ["He opened the door ", { target: slowly }, "."], tr: { uk: "Він повільно відчинив двері.", es: "Abrió la puerta despacio.", pt: "Ele abriu a porta devagar.", fr: "Il a ouvert la porte lentement.", de: "Er öffnete die Tür langsam.", it: "Ha aperto la porta lentamente.", pl: "Powoli otworzył drzwi.", tr: "Kapıyı yavaşça açtı.", id: "Dia membuka pintu perlahan-lahan.", vi: "Anh ấy mở cửa chậm rãi." } }
          - { level: B2, position: { en: before the main verb, uk: "перед основним дієсловом", es: "antes del verbo principal", pt: "antes do verbo principal", fr: "avant le verbe principal", de: "vor dem Hauptverb", it: "prima del verbo principale", pl: "przed czasownikiem głównym", tr: "ana fiilden önce", id: "sebelum kata kerja utama", vi: "trước động từ chính" }, ex: ["She ", { target: angrily }, " left."], tr: { uk: "Вона сердито пішла.", es: "Se fue enojada.", pt: "Ela saiu irritada.", fr: "Elle est partie, furieuse.", de: "Sie ging wütend weg.", it: "Se n'è andata arrabbiata.", pl: "Wyszła rozzłoszczona.", tr: "Kızgın ayrıldı.", id: "Dia pergi, marah.", vi: "Cô ấy giận dữ bỏ đi." } }
          - { level: B2, position: { en: at the start of the sentence, uk: "на початку речення", es: "al principio de la oración", pt: "no início da frase", fr: "au début de la phrase", de: "am Satzanfang", it: "all'inizio della frase", pl: "na początku zdania", tr: "cümlenin başında", id: "di awal kalimat", vi: "ở đầu câu" }, ex: [{ target: Angrily }, ", she left."], tr: { uk: "Розсерджена, вона пішла.", es: "Enojada, se fue.", pt: "Irritada, ela saiu.", fr: "Furieuse, elle est partie.", de: "Wütend ging sie weg.", it: "Arrabbiata, se n'è andata.", pl: "Rozzłoszczona, wyszła.", tr: "Kızgın, ayrıldı.", id: "Marah, dia pergi.", vi: "Giận dữ, cô ấy bỏ đi." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "After the verb the adverb tells how it was done; before the verb or first, how the doer felt.", uk: "Після дієслова прислівник показує, як це було зроблено; перед дієсловом або на початку — як почувався виконавець.", es: "Tras el verbo, el adverbio dice cómo se hizo; antes del verbo o al inicio, cómo se sentía quien actuaba.", pt: "Depois do verbo, o advérbio diz como foi feito; antes do verbo ou no início, como se sentia quem agiu.", fr: "Après le verbe, l’adverbe dit comment on a agi ; avant lui ou en tête, ce que ressentait la personne.", de: "Nach dem Verb sagt das Adverb, wie etwas getan wurde; davor oder am Anfang, wie sich die Person fühlte.", it: "Dopo il verbo l'avverbio dice come è stata fatta l'azione; prima del verbo o all'inizio, come si sentiva chi agiva.", pl: "Po czasowniku przysłówek mówi, jak coś zrobiono; przed czasownikiem lub na początku — jak czuł się wykonawca.", tr: "Fiilden sonra gelen zarf eylemin nasıl yapıldığını, fiilden önce ya da başta gelen zarf ise yapanın nasıl hissettiğini söyler.", id: "Setelah kata kerja, kata keterangan menyatakan bagaimana sesuatu dilakukan; sebelum kata kerja atau di awal, bagaimana perasaan pelakunya.", vi: "Sau động từ, trạng từ chỉ cách làm; trước động từ hoặc đầu câu, chỉ cảm xúc của người làm." }
            ex: { examples: [["She left ", { target: angrily }, "."], ["She ", { target: angrily }, " left."], [{ target: Angrily }, ", she left."]] }
            tr: { uk: { examples: ["Вона пішла з гнівом.", "Вона сердито пішла.", "Розсерджена, вона пішла."] }, es: { examples: ["Se fue con enojo.", "Se fue enojada.", "Enojada, se fue."] }, pt: { examples: ["Ela saiu com raiva.", "Ela saiu irritada.", "Irritada, ela saiu."] }, fr: { examples: ["Elle est partie avec colère.", "Elle est partie, furieuse.", "Furieuse, elle est partie."] }, de: { examples: ["Sie ging im Zorn weg.", "Sie ging wütend weg.", "Wütend ging sie weg."] }, it: { examples: ["Se n'è andata con rabbia.", "Se n'è andata arrabbiata.", "Arrabbiata, se n'è andata."] }, pl: { examples: ["Wyszła ze złością.", "Wyszła rozzłoszczona.", "Rozzłoszczona, wyszła."] }, tr: { examples: ["Öfkeyle ayrıldı.", "Kızgın ayrıldı.", "Kızgın, ayrıldı."] }, id: { examples: ["Dia pergi dengan marah.", "Dia pergi, marah.", "Marah, dia pergi."] }, vi: { examples: ["Cô ấy bỏ đi một cách giận dữ.", "Cô ấy giận dữ bỏ đi.", "Giận dữ, cô ấy bỏ đi."] } }
          - type: rule
            level: B2
            text: { en: "A comma follows an adverb at the start of a sentence.", uk: "Після прислівника на початку речення ставиться кома.", es: "Después de un adverbio al inicio de la oración va una coma.", pt: "Uma vírgula vem depois de um advérbio no início da frase.", fr: "Une virgule suit un adverbe placé au début de la phrase.", de: "Nach einem Adverb am Satzanfang steht ein Komma.", it: "Dopo un avverbio all'inizio della frase va una virgola.", pl: "Po przysłówku na początku zdania stawia się przecinek.", tr: "Cümle başındaki zarftan sonra virgül konur.", id: "Tanda koma mengikuti kata keterangan di awal kalimat.", vi: "Sau trạng từ đứng đầu câu có dấu phẩy." }
            ex: [{ target: Slowly }, ", he opened the door."]
            tr: { uk: "Повільно він відчинив двері.", es: "Despacio, abrió la puerta.", pt: "Devagar, ele abriu a porta.", fr: "Lentement, il a ouvert la porte.", de: "Langsam öffnete er die Tür.", it: "Lentamente, ha aperto la porta.", pl: "Powoli otworzył drzwi.", tr: "Yavaşça kapıyı açtı.", id: "Perlahan-lahan, dia membuka pintu.", vi: "Chậm rãi, anh ấy mở cửa." }

  - title: { en: "Form: comparing adverbs", uk: "Форма: ступені порівняння прислівників", es: "Forma: comparación de los adverbios", pt: "Forma: comparação dos advérbios", fr: "Forme : comparaison des adverbes", de: "Form: Steigerung der Adverbien", it: "Forma: comparazione degli avverbi", pl: "Forma: stopniowanie przysłówków", tr: "Biçim: zarflarda karşılaştırma ve üstünlük dereceleri", id: "Bentuk: perbandingan kata keterangan", vi: "Dạng: so sánh của trạng từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: adverb, label: { en: Adverb, uk: "Прислівник", es: "Adverbio", pt: "Advérbio", fr: "Adverbe", de: "Adverb", it: "Avverbio", pl: "Przysłówek", tr: "Zarf", id: "Kata keterangan", vi: "Trạng từ" }, features: { degree: pos } }
          - { key: comparative, label: { en: Comparative, uk: "Вищий ступінь", es: "Comparativo", pt: "Comparativo", fr: "Comparatif", de: "Komparativ", it: "Comparativo", pl: "Stopień wyższy", tr: "Karşılaştırma derecesi", id: "Komparatif", vi: "So sánh hơn" }, features: { degree: cmpr } }
          - { key: superlative, label: { en: Superlative, uk: "Найвищий ступінь", es: "Superlativo", pt: "Superlativo", fr: "Superlatif", de: "Superlativ", it: "Superlativo", pl: "Stopień najwyższy", tr: "Üstünlük derecesi", id: "Superlatif", vi: "So sánh nhất" }, features: { degree: sprl } }
        rows:
          - { level: B2, adverb: fast, comparative: [fast, { ending: er }], superlative: [the fast, { ending: est }] }
          - { level: B2, adverb: early, comparative: [earl, { ending: ier }], superlative: [the earl, { ending: iest }] }
          - { level: B2, adverb: carefully, comparative: [{ target: more }, " carefully"], superlative: ["the ", { target: most }, " carefully"] }
          - { level: B2, adverb: well, comparative: better, superlative: the best }
          - { level: B2, adverb: badly, comparative: worse, superlative: the worst }
          - { level: B2, adverb: far, comparative: { alternatives: [further, farther] }, superlative: { alternatives: [the furthest, the farthest] } }
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, pattern: { pattern: [{ slot: comparative }, than] }, ex: ["She types ", { target: faster than }, " I do."], tr: { uk: "Вона друкує швидше, ніж я.", es: "Ella escribe más rápido que yo.", pt: "Ela digita mais rápido do que eu.", fr: "Elle tape plus vite que moi.", de: "Sie tippt schneller als ich.", it: "Lei scrive più velocemente di me.", pl: "Ona pisze szybciej niż ja.", tr: "O benden daha hızlı yazar.", id: "Dia mengetik lebih cepat daripada saya.", vi: "Cô ấy gõ nhanh hơn tôi." } }
          - { level: B2, pattern: { alternatives: [{ pattern: [as, { slot: adverb }, as] }, { pattern: [not as, { slot: adverb }, as] }] }, ex: { examples: [["He drives ", { target: as carefully as }, " his father."], ["I don't run ", { target: as fast as }, " you."]] }, tr: { uk: { examples: ["Він їздить так само обережно, як його батько.", "Я бігаю не так швидко, як ти."] }, es: { examples: ["Conduce tan cuidadosamente como su padre.", "No corro tan rápido como tú."] }, pt: { examples: ["Ele dirige tão cuidadosamente quanto o pai dele.", "Eu não corro tão rápido quanto você."] }, fr: { examples: ["Il conduit aussi prudemment que son père.", "Je ne cours pas aussi vite que toi."] }, de: { examples: ["Er fährt so vorsichtig wie sein Vater.", "Ich laufe nicht so schnell wie du."] }, it: { examples: ["Guida con la stessa prudenza di suo padre.", "Non corro veloce come te."] }, pl: { examples: ["Jeździ tak ostrożnie jak jego ojciec.", "Nie biegam tak szybko jak ty."] }, tr: { examples: ["Babası kadar dikkatli araba kullanır.", "Senin kadar hızlı koşmam."] }, id: { examples: ["Dia mengemudi sehati-hati ayahnya.", "Saya tidak berlari secepat kamu."] }, vi: { examples: ["Anh ấy lái xe cẩn thận như bố anh ấy.", "Tôi không chạy nhanh như bạn."] } } }
          - { level: B2, pattern: { pattern: [the, { slot: superlative }, { alternatives: [in, of] }] }, ex: ["She works ", { target: the hardest }, " in the team."], tr: { uk: "Вона працює найстаранніше в команді.", es: "Ella trabaja más duro de todo el equipo.", pt: "Ela trabalha mais duro de toda a equipe.", fr: "Elle travaille le plus dur de l’équipe.", de: "Sie arbeitet am härtesten im Team.", it: "Lavora più sodo di tutta la squadra.", pl: "Ona pracuje najciężej w zespole.", tr: "Takımda en çok o çalışır.", id: "Dia bekerja paling keras di tim.", vi: "Cô ấy làm việc chăm chỉ nhất trong nhóm." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["An adverb of one syllable adds -er and -est; an adverb in -ly takes ", { term: more }, " and ", { term: most }, "."], uk: ["Односкладовий прислівник отримує -er і -est; прислівник на -ly утворює форми з ", { term: "more" }, " і ", { term: "most" }, "."], es: ["Un adverbio de una sílaba añade -er y -est; un adverbio en -ly lleva ", { term: "more" }, " y ", { term: "most" }, "."], pt: ["Um advérbio de uma sílaba recebe -er e -est; um advérbio em -ly usa ", { term: "more" }, " e ", { term: "most" }, "."], fr: ["Un adverbe d’une syllabe ajoute -er et -est ; un adverbe en -ly prend ", { term: "more" }, " et ", { term: "most" }, "."], de: ["Ein einsilbiges Adverb erhält -er und -est; ein Adverb auf -ly steht mit ", { term: "more" }, " und ", { term: "most" }, "."], it: ["Un avverbio di una sillaba aggiunge -er ed -est; un avverbio in -ly prende ", { term: "more" }, " e ", { term: "most" }, "."], pl: ["Przysłówek jednosylabowy dostaje -er i -est; przysłówek na -ly tworzy formy z ", { term: "more" }, " i ", { term: "most" }, "."], tr: ["Tek heceli zarflar -er ve -est alır; -ly ile biten zarflar ", { term: "more" }, " ve ", { term: "most" }, " ile kurulur."], id: ["Kata keterangan satu suku kata menambah -er dan -est; kata keterangan berakhiran -ly memakai ", { term: "more" }, " dan ", { term: "most" }, "."], vi: ["Trạng từ một âm tiết thêm -er và -est; trạng từ có -ly dùng ", { term: "more" }, " và ", { term: "most" }, "."] }
            ex: { examples: [{ mapping: [fast, faster] }, { mapping: [slowly, more slowly] }] }
            tr: { uk: { examples: ["швидко — швидше", "повільно — повільніше"] }, es: { examples: ["rápido — más rápido", "despacio — más despacio"] }, pt: { examples: ["rápido — mais rápido", "devagar — mais devagar"] }, fr: { examples: ["vite — plus vite", "lentement — plus lentement"] }, de: { examples: ["schnell — schneller", "langsam — langsamer"] }, it: { examples: ["veloce — più veloce", "lentamente — più lentamente"] }, pl: { examples: ["szybko — szybciej", "powoli — wolniej"] }, tr: { examples: ["hızlı — daha hızlı", "yavaşça — daha yavaşça"] }, id: { examples: ["cepat — lebih cepat", "perlahan — lebih perlahan"] }, vi: { examples: ["nhanh — nhanh hơn", "chậm rãi — chậm rãi hơn"] } }
          - type: note
            level: B2
            text: { en: ["Adjectives follow the same patterns. See ", { link: Comparatives and Superlatives, to: en.adjectives-adverbs.comparatives-superlatives }, "."], uk: ["Прикметники мають ті самі схеми. Див. ", { link: "Ступені порівняння прикметників", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], es: ["Los adjetivos siguen las mismas estructuras. Véase ", { link: "Comparativos y superlativos", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], pt: ["Os adjetivos seguem os mesmos padrões. Veja ", { link: "Comparativos e superlativos", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], fr: ["Les adjectifs suivent les mêmes schémas. Voir ", { link: "Comparatifs et superlatifs", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], de: ["Adjektive folgen denselben Mustern. Siehe ", { link: "Komparativ und Superlativ", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], it: ["Gli aggettivi seguono gli stessi schemi. Vedi ", { link: "Comparativi e superlativi", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], pl: ["Przymiotniki mają te same schematy. Zob. ", { link: "Stopniowanie przymiotników", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], tr: ["Sıfatlar da aynı kalıpları izler. Bkz. ", { link: "Karşılaştırma ve üstünlük dereceleri", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], id: ["Kata sifat mengikuti pola yang sama. Lihat ", { link: "Komparatif dan superlatif", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."], vi: ["Tính từ theo cùng các mẫu. Xem ", { link: "So sánh hơn và so sánh nhất", to: "en.adjectives-adverbs.comparatives-superlatives" }, "."] }

  - title: { en: "Compare: good and well", uk: "Порівняння: good і well", es: "Comparación: good y well", pt: "Comparação: good e well", fr: "Comparaison : good et well", de: "Vergleich: good und well", it: "Confronto: good e well", pl: "Porównanie: good i well", tr: "Karşılaştırma: good ve well", id: "Perbandingan: good dan well", vi: "So sánh: good và well" }
