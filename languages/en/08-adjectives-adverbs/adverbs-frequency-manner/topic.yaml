On biega szybko.", tr: "Hızlı koşar.", id: "Dia berlari cepat.", vi: "Anh ấy chạy nhanh." } }
        - { level: A1, point: "How often?", rule: { en: frequency expressions go at the end, uk: "вирази частотності стоять наприкінці", es: "las expresiones de frecuencia van al final", pt: "as expressões de frequência vão no fim", fr: "les expressions de fréquence se placent à la fin", de: "Häufigkeitsangaben stehen am Ende", it: "le espressioni di frequenza vanno alla fine", pl: "wyrażenia częstotliwości stoją na końcu", tr: "sıklık ifadeleri sonda yer alır", id: "ungkapan frekuensi diletakkan di akhir", vi: "cụm chỉ tần suất đứng ở cuối câu" }, ex: { exchange: [How often do you swim?, ["I swim ", { target: every day }, "."]] }, tr: { uk: "Як часто ти плаваєш? — Я плаваю щодня.", es: "¿Con qué frecuencia nadas? — Nado todos los días.", pt: "Com que frequência você nada? — Eu nado todos os dias.", fr: "À quelle fréquence nages-tu ? — Je nage tous les jours.", de: "Wie oft schwimmst du? — Ich schwimme jeden Tag.", it: "Quanto spesso nuoti? — Nuoto ogni giorno.", pl: "Jak często pływasz? — Pływam codziennie.", tr: "Ne sıklıkla yüzersin? — Her gün yüzerim.", id: "Seberapa sering kamu berenang? — Saya berenang setiap hari.", vi: "Bạn bơi bao lâu một lần? — Tôi bơi mỗi ngày." } }
