        - { level: A2, point: { en: "Frequency: with an auxiliary", uk: "Частотність: з допоміжним дієсловом", es: "Frecuencia: con verbo auxiliar", pt: "Frequência: com verbo auxiliar", fr: "Fréquence : avec un auxiliaire", de: "Häufigkeit: mit Hilfsverb", it: "Frequenza: con un ausiliare", pl: "Częstotliwość: z czasownikiem pomocniczym", tr: "Sıklık: yardımcı fiil ile", id: "Frekuensi: dengan kata kerja bantu", vi: "Tần suất: với trợ động từ" }, rule: { en: between the auxiliary and the main verb, uk: "між допоміжним і основним дієсловом", es: "entre el verbo auxiliar y el verbo principal", pt: "entre o verbo auxiliar e o verbo principal", fr: "entre l’auxiliaire et le verbe principal", de: "zwischen Hilfsverb und Hauptverb", it: "tra l'ausiliare e il verbo principale", pl: "między czasownikiem pomocniczym a głównym", tr: "yardımcı fiil ile ana fiil arasında", id: "di antara kata kerja bantu dan kata kerja utama", vi: "giữa trợ động từ và động từ chính" }, ex: ["I can ", { target: never }, " find my keys."], tr: { uk: "Я ніколи не можу знайти свої ключі.", es: "Nunca puedo encontrar mis llaves.", pt: "Nunca consigo encontrar minhas chaves.", fr: "Je ne trouve jamais mes clés.", de: "Ich kann meine Schlüssel nie finden.", it: "Non trovo mai le mie chiavi.", pl: "Nigdy nie mogę znaleźć swoich kluczy.", tr: "Anahtarlarımı hiçbir zaman bulamam.", id: "Saya tidak pernah bisa menemukan kunci saya.", vi: "Tôi chẳng bao giờ tìm được chìa khóa của mình." } }
        - { level: A2, point: { en: "Manner: position", uk: "Спосіб дії: місце", es: "Modo: posición", pt: "Modo: posição", fr: "Manière : place", de: "Art und Weise: Stellung", it: "Modo: posizione", pl: "Sposób: miejsce", tr: "Durum: konum", id: "Cara: posisi", vi: "Cách thức: vị trí" }, rule: { en: "after the verb, or after the object", uk: "після дієслова або після додатка", es: "después del verbo o después del objeto", pt: "depois do verbo ou depois do objeto", fr: "après le verbe ou après le complément", de: "nach dem Verb oder nach dem Objekt", it: "dopo il verbo o dopo il complemento oggetto", pl: "po czasowniku lub po dopełnieniu", tr: "fiilden sonra ya da nesneden sonra", id: "setelah kata kerja, atau setelah objek", vi: "sau động từ, hoặc sau tân ngữ" }, ex: ["He opened the door ", { target: slowly }, "."], tr: { uk: "Він повільно відчинив двері.", es: "Abrió la puerta despacio.", pt: "Ele abriu a porta devagar.", fr: "Il a ouvert la porte lentement.", de: "Er öffnete die Tür langsam.", it: "Ha aperto la porta lentamente.", pl: "Powoli otworzył drzwi.", tr: "Kapıyı yavaşça açtı.", id: "Dia membuka pintu perlahan-lahan.", vi: "Anh ấy mở cửa chậm rãi." } }
        - { level: B2, point: { en: Two adverbs, uk: "Два прислівники", es: "Dos adverbios", pt: "Dois advérbios", fr: "Deux adverbes", de: "Zwei Adverbien", it: "Due avverbi", pl: "Dwa przysłówki", tr: "İki zarf", id: "Dua kata keterangan", vi: "Hai trạng từ" }, rule: { en: "the same form and the -ly form can differ in meaning", uk: "форма, що збігається з прикметником, і форма на -ly можуть мати різні значення", es: "la forma igual al adjetivo y la forma en -ly pueden tener significados distintos", pt: "a forma igual à do adjetivo e a forma em -ly podem ter significados diferentes", fr: "la forme identique à l’adjectif et la forme en -ly peuvent avoir des sens différents", de: "die Form des Adjektivs und die Form auf -ly können Verschiedenes bedeuten", it: "la forma uguale all'aggettivo e la forma in -ly possono avere significati diversi", pl: "forma taka jak przymiotnik i forma na -ly mogą mieć różne znaczenia", tr: "sıfatla aynı biçimdeki zarf ile -ly biçimi farklı anlamlara gelebilir", id: "bentuk yang sama dengan kata sifat dan bentuk -ly bisa berbeda arti", vi: "dạng giống tính từ và dạng có -ly có thể khác nghĩa" }, ex: { examples: [["They work ", { target: hard }, "."], ["I ", { target: hardly }, " know him."]] }, tr: { uk: { examples: ["Вони наполегливо працюють.", "Я його майже не знаю."] }, es: { examples: ["Trabajan duro.", "Casi no lo conozco."] }, pt: { examples: ["Eles trabalham duro.", "Eu mal o conheço."] }, fr: { examples: ["Ils travaillent dur.", "Je le connais à peine."] }, de: { examples: ["Sie arbeiten hart.", "Ich kenne ihn kaum."] }, it: { examples: ["Lavorano sodo.", "Lo conosco appena."] }, pl: { examples: ["Ciężko pracują.", "Ledwo go znam."] }, tr: { examples: ["Sıkı çalışıyorlar.", "Onu neredeyse hiç tanımıyorum."] }, id: { examples: ["Mereka bekerja keras.", "Saya hampir tidak mengenalnya."] }, vi: { examples: ["Họ làm việc chăm chỉ.", "Tôi hầu như không biết anh ấy."] } } }
        - { level: B2, point: { en: "Frequency: expressions", uk: "Частотність: вирази", es: "Frecuencia: expresiones", pt: "Frequência: expressões", fr: "Fréquence : expressions", de: "Häufigkeit: Angaben", it: "Frequenza: espressioni", pl: "Częstotliwość: wyrażenia", tr: "Sıklık: ifadeler", id: "Frekuensi: ungkapan", vi: "Tần suất: cụm từ" }, rule: { en: [{ term: seldom }, ", ", { term: scarcely ever }, ", ", { term: every other day }, ", ", { term: now and then }], uk: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], es: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], pt: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], fr: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], de: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], it: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], pl: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], tr: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], id: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }], vi: [{ term: "seldom" }, ", ", { term: "scarcely ever" }, ", ", { term: "every other day" }, ", ", { term: "now and then" }] }, ex: ["We meet ", { target: twice a week }, "."], tr: { uk: "Ми зустрічаємося двічі на тиждень.", es: "Nos vemos dos veces por semana.", pt: "Nós nos encontramos duas vezes por semana.", fr: "Nous nous voyons deux fois par semaine.", de: "Wir treffen uns zweimal pro Woche.", it: "Ci vediamo due volte alla settimana.", pl: "Spotykamy się dwa razy w tygodniu.", tr: "Haftada iki kez buluşuyoruz.", id: "Kami bertemu dua kali seminggu.", vi: "Chúng tôi gặp nhau hai lần một tuần." } }
        - { level: B2, point: { en: "Frequency: questions", uk: "Частотність: питання", es: "Frecuencia: preguntas", pt: "Frequência: perguntas", fr: "Fréquence : questions", de: "Häufigkeit: Fragen", it: "Frequenza: domande", pl: "Częstotliwość: pytania", tr: "Sıklık: sorular", id: "Frekuensi: pertanyaan", vi: "Tần suất: câu hỏi" }, rule: { en: "between the subject and the main verb", uk: "між підметом і основним дієсловом", es: "entre el sujeto y el verbo principal", pt: "entre o sujeito e o verbo principal", fr: "entre le sujet et le verbe principal", de: "zwischen Subjekt und Hauptverb", it: "tra il soggetto e il verbo principale", pl: "między podmiotem a czasownikiem głównym", tr: "özne ile ana fiil arasında", id: "di antara subjek dan kata kerja utama", vi: "giữa chủ ngữ và động từ chính" }, ex: ["Do you ", { target: often }, " eat out?"], tr: { uk: "Ти часто ходиш у ресторани?", es: "¿Comes fuera a menudo?", pt: "Você come fora com frequência?", fr: "Manges-tu souvent au restaurant ?", de: "Isst du oft auswärts?", it: "Mangi spesso fuori?", pl: "Czy często jadasz w restauracjach?", tr: "Sık sık dışarıda yemek yer misin?", id: "Apakah kamu sering makan di luar?", vi: "Bạn có thường ăn ngoài không?" } }
        - { level: B2, point: { en: Comparing adverbs, uk: "Порівняння прислівників", es: "Comparación de adverbios", pt: "Comparação de advérbios", fr: "Comparaison des adverbes", de: "Steigerung der Adverbien", it: "Comparazione degli avverbi", pl: "Stopniowanie przysłówków", tr: "Zarflarda karşılaştırma", id: "Perbandingan kata keterangan", vi: "So sánh trạng từ" }, rule: { en: ["-er after one syllable, ", { term: more }, " with -ly adverbs"], uk: ["-er для односкладових, ", { term: "more" }, " для прислівників на -ly"], es: ["-er con una sílaba, ", { term: "more" }, " con los adverbios en -ly"], pt: ["-er com uma sílaba, ", { term: "more" }, " com advérbios em -ly"], fr: ["-er avec une syllabe, ", { term: "more" }, " avec les adverbes en -ly"], de: ["-er bei einer Silbe, ", { term: "more" }, " bei Adverbien auf -ly"], it: ["-er con una sillaba, ", { term: "more" }, " con gli avverbi in -ly"], pl: ["-er przy jednej sylabie, ", { term: "more" }, " przy przysłówkach na -ly"], tr: ["tek hecede -er, -ly ile biten zarflarda ", { term: "more" }], id: ["-er untuk satu suku kata, ", { term: "more" }, " untuk kata keterangan berakhiran -ly"], vi: ["-er với từ một âm tiết, ", { term: "more" }, " với trạng từ có -ly"] }, ex: { examples: [["She types ", { target: faster }, " than me."], ["Drive ", { target: more carefully }, "."]] }, tr: { uk: { examples: ["Вона друкує швидше за мене.", "Їдь обережніше."] }, es: { examples: ["Ella escribe más rápido que yo.", "Conduce con más cuidado."] }, pt: { examples: ["Ela digita mais rápido do que eu.", "Dirija com mais cuidado."] }, fr: { examples: ["Elle tape plus vite que moi.", "Conduis plus prudemment."] }, de: { examples: ["Sie tippt schneller als ich.", "Fahr vorsichtiger."] }, it: { examples: ["Lei scrive più velocemente di me.", "Guida con più attenzione."] }, pl: { examples: ["Ona pisze szybciej niż ja.", "Jedź ostrożniej."] }, tr: { examples: ["O benden daha hızlı yazar.", "Daha dikkatli sür."] }, id: { examples: ["Dia mengetik lebih cepat daripada saya.", "Mengemudilah dengan lebih hati-hati."] }, vi: { examples: ["Cô ấy gõ nhanh hơn tôi.", "Hãy lái xe cẩn thận hơn."] } } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: good }, " describes a noun; ", { term: well }, " describes a verb"], uk: [{ term: good }, " описує іменник, ", { term: well }, " — дієслово"], es: [{ term: good }, " describe un sustantivo; ", { term: well }, " describe un verbo"], pt: [{ term: "good" }, " descreve um substantivo; ", { term: "well" }, " descreve um verbo"], fr: [{ term: "good" }, " décrit un nom ; ", { term: "well" }, " décrit un verbe"], de: [{ term: "good" }, " beschreibt ein Nomen; ", { term: "well" }, " beschreibt ein Verb"], it: [{ term: "good" }, " descrive un sostantivo; ", { term: "well" }, " descrive un verbo"], pl: [{ term: "good" }, " opisuje rzeczownik, ", { term: "well" }, " — czasownik"], tr: [{ term: "good" }, " ismi niteler; ", { term: "well" }, " fiili niteler"], id: [{ term: "good" }, " menerangkan kata benda; ", { term: "well" }, " menerangkan kata kerja"], vi: [{ term: "good" }, " miêu tả danh từ; ", { term: "well" }, " miêu tả động từ"] }, ex: ["She sings ", { target: well }, "."], tr: { uk: "Вона добре співає.", es: "Ella canta bien.", pt: "Ela canta bem.", fr: "Elle chante bien.", de: "Sie singt gut.", it: "Lei canta bene.", pl: "Ona dobrze śpiewa.", tr: "İyi şarkı söyler.", id: "Dia menyanyi dengan baik.", vi: "Cô ấy hát hay." } }

sections:
  - title: { en: "Form: frequency adverbs", uk: "Форма: прислівники частотності", es: "Forma: adverbios de frecuencia", pt: "Forma: advérbios de frequência", fr: "Forme : adverbes de fréquence", de: "Form: Adverbien der Häufigkeit", it: "Forma: avverbi di frequenza", pl: "Forma: przysłówki częstotliwości", tr: "Biçim: sıklık zarfları", id: "Bentuk: kata keterangan frekuensi", vi: "Dạng: trạng từ chỉ tần suất" }
    role: form
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, uk: "Прислівник", es: "Adverbio", pt: "Advérbio", fr: "Adverbe", de: "Adverb", it: "Avverbio", pl: "Przysłówek", tr: "Zarf", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: often, label: { en: How often, uk: "Як часто", es: "Con qué frecuencia", pt: "Com que frequência", fr: "À quelle fréquence", de: "Wie oft", it: "Quanto spesso", pl: "Jak często", tr: "Ne sıklıkla", id: "Seberapa sering", vi: "Mức độ thường xuyên" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, adverb: always, often: "100%", ex: ["I ", { target: always }, " walk to work."], tr: { uk: "Я завжди ходжу на роботу пішки.", es: "Siempre voy al trabajo a pie.", pt: "Eu sempre vou a pé para o trabalho.", fr: "Je vais toujours au travail à pied.", de: "Ich gehe immer zu Fuß zur Arbeit.", it: "Vado sempre al lavoro a piedi.", pl: "Zawsze chodzę do pracy pieszo.", tr: "Her zaman işe yürüyerek giderim.", id: "Saya selalu berjalan kaki ke tempat kerja.", vi: "Tôi luôn đi bộ đến chỗ làm." } }
          - { level: A1, adverb: usually, often: ≈ 90%, ex: ["She ", { target: usually }, " has toast."], tr: { uk: "Вона зазвичай їсть грінки.", es: "Normalmente come tostadas.", pt: "Ela geralmente come torrada.", fr: "Elle mange généralement des toasts.", de: "Sie isst normalerweise Toast.", it: "Di solito mangia pane tostato.", pl: "Ona zwykle je tosty.", tr: "Genellikle tost yer.", id: "Dia biasanya makan roti panggang.", vi: "Cô ấy thường ăn bánh mì nướng." } }
          - { level: A1, adverb: often, often: ≈ 70%, ex: ["We ", { target: often }, " eat out."], tr: { uk: "Ми часто ходимо в ресторани.", es: "A menudo comemos fuera.", pt: "Comemos fora com frequência.", fr: "Nous mangeons souvent au restaurant.", de: "Wir essen oft auswärts.", it: "Mangiamo spesso fuori.", pl: "Często jadamy w restauracjach.", tr: "Sık sık dışarıda yemek yeriz.", id: "Kami sering makan di luar.", vi: "Chúng tôi thường ăn ngoài." } }
          - { level: B2, adverb: frequently, often: "≈ 70%", ex: ["They ", { target: frequently }, " travel for work."], tr: { uk: "Вони часто їздять у відрядження.", es: "Viajan con frecuencia por trabajo.", pt: "Eles viajam com frequência a trabalho.", fr: "Ils voyagent fréquemment pour le travail.", de: "Sie reisen häufig beruflich.", it: "Viaggiano spesso per lavoro.", pl: "Często podróżują służbowo.", tr: "İş için sık sık seyahat ederler.", id: "Mereka sering bepergian untuk urusan pekerjaan.", vi: "Họ thường xuyên đi công tác." } }
          - { level: A1, adverb: sometimes, often: ≈ 50%, ex: ["They ", { target: sometimes }, " call me."], tr: { uk: "Вони іноді мені телефонують.", es: "A veces me llaman.", pt: "Às vezes eles me ligam.", fr: "Ils m’appellent parfois.", de: "Sie rufen mich manchmal an.", it: "A volte mi chiamano.", pl: "Czasem do mnie dzwonią.", tr: "Bazen beni ararlar.", id: "Mereka kadang-kadang menelepon saya.", vi: "Thỉnh thoảng họ gọi cho tôi." } }
          - { level: B2, adverb: occasionally, often: "≈ 25%", ex: ["I ", { target: occasionally }, " have coffee after lunch."], tr: { uk: "Я зрідка п’ю каву після обіду.", es: "Ocasionalmente tomo café después del almuerzo.", pt: "Ocasionalmente tomo café depois do almoço.", fr: "Je prends occasionnellement un café après le déjeuner.", de: "Ich trinke gelegentlich nach dem Mittagessen einen Kaffee.", it: "Occasionalmente prendo un caffè dopo pranzo.", pl: "Okazjonalnie piję kawę po obiedzie.", tr: "Ara sıra öğle yemeğinden sonra kahve içerim.", id: "Saya sesekali minum kopi setelah makan siang.", vi: "Đôi khi tôi uống cà phê sau bữa trưa." } }
          - { level: A1, adverb: rarely, often: ≈ 10%, ex: ["He ", { target: rarely }, " drives."], tr: { uk: "Він рідко водить машину.", es: "Rara vez conduce.", pt: "Ele raramente dirige.", fr: "Il conduit rarement.", de: "Er fährt selten Auto.", it: "Guida raramente.", pl: "On rzadko prowadzi samochód.", tr: "Nadiren araba kullanır.", id: "Dia jarang mengemudi.", vi: "Anh ấy hiếm khi lái xe." } }
          - { level: B2, adverb: seldom, often: "≈ 10%", ex: ["He ", { target: seldom }, " eats meat."], tr: { uk: "Він рідко їсть м’ясо.", es: "Rara vez come carne.", pt: "Ele raramente come carne.", fr: "Il mange rarement de la viande.", de: "Er isst selten Fleisch.", it: "Mangia raramente carne.", pl: "On rzadko je mięso.", tr: "Nadiren et yer.", id: "Dia jarang makan daging.", vi: "Anh ấy hiếm khi ăn thịt." } }
          - { level: B2, adverb: scarcely ever, often: "≈ 5%", ex: ["She ", { target: scarcely ever }, " complains."], tr: { uk: "Вона майже ніколи не скаржиться.", es: "Casi nunca se queja.", pt: "Ela quase nunca reclama.", fr: "Elle ne se plaint presque jamais.", de: "Sie beschwert sich fast nie.", it: "Non si lamenta quasi mai.", pl: "Ona prawie nigdy nie narzeka.", tr: "O neredeyse hiç şikâyet etmez.", id: "Dia hampir tidak pernah mengeluh.", vi: "Cô ấy hầu như không bao giờ phàn nàn." } }
          - { level: A1, adverb: never, often: "0%", ex: ["I ", { target: never }, " drink coffee."], tr: { uk: "Я ніколи не п’ю каву.", es: "Nunca tomo café.", pt: "Eu nunca tomo café.", fr: "Je ne bois jamais de café.", de: "Ich trinke nie Kaffee.", it: "Non bevo mai caffè.", pl: "Nigdy nie piję kawy.", tr: "Hiçbir zaman kahve içmem.", id: "Saya tidak pernah minum kopi.", vi: "Tôi không bao giờ uống cà phê." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: hardly ever }, " (≈ 5%) is close to ", { term: never }, ":"]
              uk: [{ term: hardly ever }, " (≈ 5%) майже дорівнює ", { term: never }, ":"]
              es: [{ term: hardly ever }, " (≈ 5%) se acerca a ", { term: never }, ":"]
              pt: [{ term: "hardly ever" }, " (≈ 5%) está perto de ", { term: "never" }, ":"]
              fr: [{ term: "hardly ever" }, " (≈ 5 %) est proche de ", { term: "never" }, " :"]
              de: [{ term: "hardly ever" }, " (≈ 5%) steht ", { term: "never" }, " nahe:"]
              it: [{ term: "hardly ever" }, " (≈ 5%) è vicino a ", { term: "never" }, ":"]
              pl: [{ term: "hardly ever" }, " (≈ 5%) jest bliskie ", { term: "never" }, ":"]
              tr: [{ term: "hardly ever" }, " (≈ 5%), ", { term: "never" }, " ifadesine yakındır:"]
              id: [{ term: "hardly ever" }, " (≈ 5%) hampir sama dengan ", { term: "never" }, ":"]
              vi: [{ term: "hardly ever" }, " (≈ 5%) gần với ", { term: "never" }, ":"]
            ex: ["We ", { target: hardly ever }, " go out."]
            tr: { uk: "Ми майже ніколи нікуди не ходимо.", es: "Casi nunca salimos.", pt: "Quase nunca saímos.", fr: "Nous ne sortons presque jamais.", de: "Wir gehen fast nie aus.", it: "Non usciamo quasi mai.", pl: "Prawie nigdy nigdzie nie wychodzimy.", tr: "Neredeyse hiç dışarı çıkmıyoruz.", id: "Kami hampir tidak pernah keluar.", vi: "Chúng tôi hầu như không đi chơi." }
