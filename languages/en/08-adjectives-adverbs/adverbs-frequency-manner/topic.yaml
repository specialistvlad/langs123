title: { en: Adverbs of frequency and manner, uk: Прислівники частотності та способу дії, es: Adverbios de frecuencia y de modo, pt: "Advérbios de frequência e de modo", fr: "Adverbes de fréquence et de manière", de: "Adverbien der Häufigkeit und der Art und Weise", it: "Avverbi di frequenza e di modo", pl: "Przysłówki częstotliwości i sposobu", tr: "Sıklık ve durum zarfları", id: "Kata keterangan frekuensi dan cara", vi: "Trạng từ chỉ tần suất và cách thức" }
summary:
  lead:
    en: ["Frequency adverbs say how often things happen (", { term: always }, ", ", { term: never }, "); manner adverbs say how they happen (", { term: slowly }, ", ", { term: well }, ")."]
    uk: ["Прислівники частотності показують, як часто щось відбувається (", { term: always }, ", ", { term: never }, "), а прислівники способу дії — як воно відбувається (", { term: slowly }, ", ", { term: well }, ")."]
    es: ["Los adverbios de frecuencia dicen con qué frecuencia ocurren las cosas (", { term: always }, ", ", { term: never }, "); los de modo dicen cómo ocurren (", { term: slowly }, ", ", { term: well }, ")."]
    pt: ["Os advérbios de frequência dizem com que frequência as coisas acontecem (", { term: "always" }, ", ", { term: "never" }, "); os de modo dizem como elas acontecem (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    fr: ["Les adverbes de fréquence disent à quelle fréquence les choses ont lieu (", { term: "always" }, ", ", { term: "never" }, ") ; les adverbes de manière disent comment elles se font (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    de: ["Adverbien der Häufigkeit sagen, wie oft etwas geschieht (", { term: "always" }, ", ", { term: "never" }, "); Adverbien der Art und Weise sagen, wie es geschieht (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    it: ["Gli avverbi di frequenza dicono quanto spesso accadono le cose (", { term: "always" }, ", ", { term: "never" }, "); quelli di modo dicono come accadono (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    pl: ["Przysłówki częstotliwości mówią, jak często coś się dzieje (", { term: "always" }, ", ", { term: "never" }, "), a przysłówki sposobu — jak się dzieje (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    tr: ["Sıklık zarfları bir şeyin ne sıklıkla olduğunu (", { term: "always" }, ", ", { term: "never" }, "), durum zarfları nasıl olduğunu (", { term: "slowly" }, ", ", { term: "well" }, ") söyler."]
    id: ["Kata keterangan frekuensi menyatakan seberapa sering sesuatu terjadi (", { term: "always" }, ", ", { term: "never" }, "); kata keterangan cara menyatakan bagaimana sesuatu terjadi (", { term: "slowly" }, ", ", { term: "well" }, ")."]
    vi: ["Trạng từ chỉ tần suất cho biết mức độ thường xuyên (", { term: "always" }, ", ", { term: "never" }, "); trạng từ chỉ cách thức cho biết hành động diễn ra thế nào (", { term: "slowly" }, ", ", { term: "well" }, ")."]
  rule:
    en: ["Frequency adverbs go before the main verb but after ", { term: be }, ":"]
    uk: ["Прислівники частотності стоять перед основним дієсловом, але після ", { term: be }, ":"]
    es: ["Los adverbios de frecuencia van antes del verbo principal, pero después de ", { term: be }, ":"]
    pt: ["Os advérbios de frequência vão antes do verbo principal, mas depois de ", { term: "be" }, ":"]
    fr: ["Les adverbes de fréquence se placent avant le verbe principal, mais après ", { term: "be" }, " :"]
    de: ["Adverbien der Häufigkeit stehen vor dem Hauptverb, aber nach ", { term: "be" }, ":"]
    it: ["Gli avverbi di frequenza vanno prima del verbo principale, ma dopo ", { term: "be" }, ":"]
    pl: ["Przysłówki częstotliwości stoją przed czasownikiem głównym, ale po ", { term: "be" }, ":"]
    tr: ["Sıklık zarfları ana fiilden önce, ama ", { term: "be" }, " fiilinden sonra gelir:"]
    id: ["Kata keterangan frekuensi diletakkan sebelum kata kerja utama, tetapi setelah ", { term: "be" }, ":"]
    vi: ["Trạng từ chỉ tần suất đứng trước động từ chính nhưng sau ", { term: "be" }, ":"]
  ex: { examples: [["I ", { target: always }, " go."], ["I am ", { target: always }, " tired."]] }

