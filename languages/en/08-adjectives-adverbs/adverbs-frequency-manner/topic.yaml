        - { level: B2, point: { en: "Frequency: questions" }, rule: { en: "between the subject and the main verb" }, ex: ["Do you ", { target: often }, " eat out?"] }
        - { level: B2, point: { en: Comparing adverbs }, rule: { en: ["-er after one syllable, ", { term: more }, " with -ly adverbs"] }, ex: { examples: [["She types ", { target: faster }, " than me."], ["Drive ", { target: more carefully }, "."]] } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: good }, " describes a noun; ", { term: well }, " describes a verb"], uk: [{ term: good }, " описує іменник, ", { term: well }, " — дієслово"], es: [{ term: good }, " describe un sustantivo; ", { term: well }, " describe un verbo"], pt: [{ term: "good" }, " descreve um substantivo; ", { term: "well" }, " descreve um verbo"], fr: [{ term: "good" }, " décrit un nom ; ", { term: "well" }, " décrit un verbe"], de: [{ term: "good" }, " beschreibt ein Nomen; ", { term: "well" }, " beschreibt ein Verb"], it: [{ term: "good" }, " descrive un sostantivo; ", { term: "well" }, " descrive un verbo"], pl: [{ term: "good" }, " opisuje rzeczownik, ", { term: "well" }, " — czasownik"], tr: [{ term: "good" }, " ismi niteler; ", { term: "well" }, " fiili niteler"], id: [{ term: "good" }, " menerangkan kata benda; ", { term: "well" }, " menerangkan kata kerja"], vi: [{ term: "good" }, " miêu tả danh từ; ", { term: "well" }, " miêu tả động từ"] }, ex: ["She sings ", { target: well }, "."], tr: { uk: "Вона добре співає.", es: "Ella canta bien.", pt: "Ela canta bem.", fr: "Elle chante bien.", de: "Sie singt gut.", it: "Lei canta bene.", pl: "Ona dobrze śpiewa.", tr: "İyi şarkı söyler.", id: "Dia menyanyi dengan baik.", vi: "Cô ấy hát hay." } }

sections:
  - title: { en: "Form: frequency adverbs", uk: "Форма: прислівники частотності", es: "Forma: adverbios de frecuencia", pt: "Forma: advérbios de frequência", fr: "Forme : adverbes de fréquence", de: "Form: Adverbien der Häufigkeit", it: "Forma: avverbi di frequenza", pl: "Forma: przysłówki częstotliwości", tr: "Biçim: sıklık zarfları", id: "Bentuk: kata keterangan frekuensi", vi: "Dạng: trạng từ chỉ tần suất" }
    role: form
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, uk: "Прислівник", es: "Adverbio", pt: "Advérbio", fr: "Adverbe", de: "Adverb", it: "Avverbio", pl: "Przysłówek", tr: "Zarf", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: often, label: { en: How often, uk: "Як часто", es: "Con qué frecuencia", pt: "Com que frequência", fr: "À quelle fréquence", de: "Wie oft", it: "Quanto spesso", pl: "Jak często", tr: "Ne sıklıkla", id: "Seberapa sering", vi: "Mức độ thường xuyên" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, adverb: always, often: "100%", ex: ["I ", { target: always }, " walk to work."], tr: { uk: "Я завжди ходжу на роботу пішки.", es: "Siempre voy al trabajo a pie.", pt: "Eu sempre vou a pé para o trabalho.", fr: "Je vais toujours au travail à pied.", de: "Ich gehe immer zu Fuß zur Arbeit.", it: "Vado sempre al lavoro a piedi.", pl: "Zawsze chodzę do pracy pieszo.", tr: "Her zaman işe yürüyerek giderim.", id: "Saya selalu berjalan kaki ke tempat kerja.", vi: "Tôi luôn đi bộ đến chỗ làm." } }
          - { level: A1, adverb: usually, often: ≈ 90%, ex: ["She ", { target: usually }, " has toast."], tr: { uk: "Вона зазвичай їсть грінки.", es: "Normalmente come tostadas.", pt: "Ela geralmente come torrada.", fr: "Elle mange généralement des toasts.", de: "Sie isst normalerweise Toast.", it: "Di solito mangia pane tostato.", pl: "Ona zwykle je tosty.", tr: "Genellikle tost yer.", id: "Dia biasanya makan roti panggang.", vi: "Cô ấy thường ăn bánh mì nướng." } }
          - { level: A1, adverb: often, often: ≈ 70%, ex: ["We ", { target: often }, " eat out."], tr: { uk: "Ми часто ходимо в ресторани.", es: "A menudo comemos fuera.", pt: "Comemos fora com frequência.", fr: "Nous mangeons souvent au restaurant.", de: "Wir essen oft auswärts.", it: "Mangiamo spesso fuori.", pl: "Często jadamy w restauracjach.", tr: "Sık sık dışarıda yemek yeriz.", id: "Kami sering makan di luar.", vi: "Chúng tôi thường ăn ngoài." } }
          - { level: B2, adverb: frequently, often: "≈ 70%", ex: ["They ", { target: frequently }, " travel for work."] }
          - { level: A1, adverb: sometimes, often: ≈ 50%, ex: ["They ", { target: sometimes }, " call me."], tr: { uk: "Вони іноді мені телефонують.", es: "A veces me llaman.", pt: "Às vezes eles me ligam.", fr: "Ils m’appellent parfois.", de: "Sie rufen mich manchmal an.", it: "A volte mi chiamano.", pl: "Czasem do mnie dzwonią.", tr: "Bazen beni ararlar.", id: "Mereka kadang-kadang menelepon saya.", vi: "Thỉnh thoảng họ gọi cho tôi." } }
          - { level: B2, adverb: occasionally, often: "≈ 25%", ex: ["I ", { target: occasionally }, " have coffee after lunch."] }
          - { level: A1, adverb: rarely, often: ≈ 10%, ex: ["He ", { target: rarely }, " drives."], tr: { uk: "Він рідко водить машину.", es: "Rara vez conduce.", pt: "Ele raramente dirige.", fr: "Il conduit rarement.", de: "Er fährt selten Auto.", it: "Guida raramente.", pl: "On rzadko prowadzi samochód.", tr: "Nadiren araba kullanır.", id: "Dia jarang mengemudi.", vi: "Anh ấy hiếm khi lái xe." } }
          - { level: B2, adverb: seldom, often: "≈ 10%", ex: ["He ", { target: seldom }, " eats meat."] }
          - { level: B2, adverb: scarcely ever, often: "≈ 5%", ex: ["She ", { target: scarcely ever }, " complains."] }
          - { level: A1, adverb: never, often: "0%", ex: ["I ", { target: never }, " drink coffee."], tr: { uk: "Я ніколи не п’ю каву.", es: "Nunca tomo café.", pt: "Eu nunca tomo café.", fr: "Je ne bois jamais de café.", de: "Ich trinke nie Kaffee.", it: "Non bevo mai caffè.", pl: "Nigdy nie piję kawy.", tr: "Hiçbir zaman kahve içmem.", id: "Saya tidak pernah minum kopi.", vi: "Tôi không bao giờ uống cà phê." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: hardly ever }, " (≈ 5%) is close to ", { term: never }, ":"]
              uk: [{ term: hardly ever }, " (≈ 5%) майже дорівнює ", { term: never }, ":"]
              es: [{ term: hardly ever }, " (≈ 5%) se acerca a ", { term: never }, ":"]
              pt: [{ term: "hardly ever" }, " (≈ 5%) está perto de ", { term: "never" }, ":"]
              fr: [{ term: "hardly ever" }, " (≈ 5 %) est proche de ", { term: "never" }, " :"]
              de: [{ term: "hardly ever" }, " (≈ 5%) steht ", { term: "never" }, " nahe:"]
              it: [{ term: "hardly ever" }, " (≈ 5%) è vicino a ", { term: "never" }, ":"]
              pl: [{ term: "hardly ever" }, " (≈ 5%) jest bliskie ", { term: "never" }, ":"]
              tr: [{ term: "hardly ever" }, " (≈ 5%), ", { term: "never" }, " ifadesine yakındır:"]
              id: [{ term: "hardly ever" }, " (≈ 5%) hampir sama dengan ", { term: "never" }, ":"]
              vi: [{ term: "hardly ever" }, " (≈ 5%) gần với ", { term: "never" }, ":"]
            ex: ["We ", { target: hardly ever }, " go out."]
            tr: { uk: "Ми майже ніколи нікуди не ходимо.", es: "Casi nunca salimos.", pt: "Quase nunca saímos.", fr: "Nous ne sortons presque jamais.", de: "Wir gehen fast nie aus.", it: "Non usciamo quasi mai.", pl: "Prawie nigdy nigdzie nie wychodzimy.", tr: "Neredeyse hiç dışarı çıkmıyoruz.", id: "Kami hampir tidak pernah keluar.", vi: "Chúng tôi hầu như không đi chơi." }
          - type: rule
            level: B2
            text: { en: [{ term: frequently }, ", ", { term: seldom }, " and ", { term: scarcely ever }, " are more formal than ", { term: often }, ", ", { term: rarely }, " and ", { term: hardly ever }, "."] }

  - title: { en: "Form: position of frequency adverbs", uk: "Форма: місце прислівників частотності", es: "Forma: posición de los adverbios de frecuencia", pt: "Forma: posição dos advérbios de frequência", fr: "Forme : place des adverbes de fréquence", de: "Form: Stellung der Adverbien der Häufigkeit", it: "Forma: posizione degli avverbi di frequenza", pl: "Forma: miejsce przysłówków częstotliwości", tr: "Biçim: sıklık zarflarının konumu", id: "Bentuk: posisi kata keterangan frekuensi", vi: "Dạng: vị trí của trạng từ chỉ tần suất" }
    role: form
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position, uk: "Місце", es: "Posición", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, position: { en: before the main verb, uk: "перед основним дієсловом", es: "antes del verbo principal", pt: "antes do verbo principal", fr: "avant le verbe principal", de: "vor dem Hauptverb", it: "prima del verbo principale", pl: "przed czasownikiem głównym", tr: "ana fiilden önce", id: "sebelum kata kerja utama", vi: "trước động từ chính" }, ex: ["I ", { target: often }, " walk."], tr: { uk: "Я часто ходжу пішки.", es: "Camino a menudo.", pt: "Eu caminho com frequência.", fr: "Je marche souvent.", de: "Ich gehe oft zu Fuß.", it: "Cammino spesso.", pl: "Często chodzę pieszo.", tr: "Sık sık yürürüm.", id: "Saya sering berjalan kaki.", vi: "Tôi thường đi bộ." } }
          - { level: A1, position: { en: ["after ", { term: be }], uk: ["після ", { term: be }], es: ["después de ", { term: be }], pt: ["depois de ", { term: "be" }], fr: ["après ", { term: "be" }], de: ["nach ", { term: "be" }], it: ["dopo ", { term: "be" }], pl: ["po ", { term: "be" }], tr: [{ term: "be" }, " fiilinden sonra"], id: ["setelah ", { term: "be" }], vi: ["sau ", { term: "be" }] }, ex: ["She is ", { target: always }, " late."], tr: { uk: "Вона завжди запізнюється.", es: "Ella siempre llega tarde.", pt: "Ela sempre chega atrasada.", fr: "Elle est toujours en retard.", de: "Sie kommt immer zu spät.", it: "Lei è sempre in ritardo.", pl: "Ona zawsze się spóźnia.", tr: "O her zaman geç kalır.", id: "Dia selalu terlambat.", vi: "Cô ấy luôn đến muộn." } }
          - { level: A2, position: { en: between auxiliary and main verb, uk: "між допоміжним і основним дієсловом", es: "entre el verbo auxiliar y el verbo principal", pt: "entre o verbo auxiliar e o verbo principal", fr: "entre l’auxiliaire et le verbe principal", de: "zwischen Hilfsverb und Hauptverb", it: "tra l'ausiliare e il verbo principale", pl: "między czasownikiem pomocniczym a głównym", tr: "yardımcı fiil ile ana fiil arasında", id: "di antara kata kerja bantu dan kata kerja utama", vi: "giữa trợ động từ và động từ chính" }, ex: ["I can ", { target: never }, " find my keys."], tr: { uk: "Я ніколи не можу знайти свої ключі.", es: "Nunca puedo encontrar mis llaves.", pt: "Nunca consigo encontrar minhas chaves.", fr: "Je ne trouve jamais mes clés.", de: "Ich kann meine Schlüssel nie finden.", it: "Non trovo mai le mie chiavi.", pl: "Nigdy nie mogę znaleźć swoich kluczy.", tr: "Anahtarlarımı hiçbir zaman bulamam.", id: "Saya tidak pernah bisa menemukan kunci saya.", vi: "Tôi chẳng bao giờ tìm được chìa khóa của mình." } }
          - { level: A2, position: { en: { alternatives: [["after ", { term: "don't" }], { term: "doesn't" }] }, uk: { alternatives: [["після ", { term: "don't" }], { term: "doesn't" }] }, es: { alternatives: [["después de ", { term: "don't" }], { term: "doesn't" }] }, pt: { alternatives: [["depois de ", { term: "don't" }], { term: "doesn't" }] }, fr: { alternatives: [["après ", { term: "don't" }], { term: "doesn't" }] }, de: { alternatives: [["nach ", { term: "don't" }], { term: "doesn't" }] }, it: { alternatives: [["dopo ", { term: "don't" }], { term: "doesn't" }] }, pl: { alternatives: [["po ", { term: "don't" }], { term: "doesn't" }] }, tr: { alternatives: [{ term: "don't" }, [{ term: "doesn't" }, " sonrasında"]] }, id: { alternatives: [["setelah ", { term: "don't" }], { term: "doesn't" }] }, vi: { alternatives: [["sau ", { term: "don't" }], { term: "doesn't" }] } }, ex: ["He doesn't ", { target: always }, " call."], tr: { uk: "Він не завжди дзвонить.", es: "No siempre llama.", pt: "Ele nem sempre liga.", fr: "Il n’appelle pas toujours.", de: "Er ruft nicht immer an.", it: "Non chiama sempre.", pl: "On nie zawsze dzwoni.", tr: "Her zaman aramaz.", id: "Dia tidak selalu menelepon.", vi: "Anh ấy không phải lúc nào cũng gọi." } }
          - { level: B2, position: { en: between the subject and the main verb in a question }, ex: ["Do you ", { target: often }, " eat out?"] }
          - { level: B2, position: { en: after the subject in a question with be }, ex: ["Is she ", { target: usually }, " late?"] }
          - { level: B2, position: { en: ["after a negative form of ", { term: be }] }, ex: ["He isn't ", { target: often }, " late."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: sometimes }, " also goes at the start:"]
              uk: [{ term: sometimes }, " може також стояти на початку речення:"]
              es: [{ term: sometimes }, " también puede ir al principio:"]
              pt: [{ term: "sometimes" }, " também pode ir no início:"]
              fr: [{ term: "sometimes" }, " peut aussi se placer au début :"]
              de: [{ term: "sometimes" }, " steht auch am Anfang:"]
              it: [{ term: "sometimes" }, " può stare anche all'inizio:"]
              pl: [{ term: "sometimes" }, " może też stać na początku zdania:"]
              tr: [{ term: "sometimes" }, " cümlenin başında da yer alabilir:"]
              id: [{ term: "sometimes" }, " juga dapat diletakkan di awal:"]
              vi: [{ term: "sometimes" }, " cũng có thể đứng đầu câu:"]
            ex: [{ target: Sometimes }, " I work from home."]
            tr: { uk: "Іноді я працюю вдома.", es: "A veces trabajo desde casa.", pt: "Às vezes trabalho em casa.", fr: "Parfois, je travaille à la maison.", de: "Manchmal arbeite ich von zu Hause aus.", it: "A volte lavoro da casa.", pl: "Czasami pracuję w domu.", tr: "Bazen evden çalışırım.", id: "Kadang-kadang saya bekerja dari rumah.", vi: "Thỉnh thoảng tôi làm việc ở nhà." }
          - type: rule
            level: B2
            text: { en: ["After ", { term: doesn't }, ", ", { term: often }, " means rarely; before it, ", { term: often }, " means many times."] }
            ex: { examples: [["He doesn't ", { target: often }, " call."], ["He ", { target: often }, " doesn't call."]] }
          - type: rule
            level: B2
            text: { en: [{ term: frequently }, " and ", { term: occasionally }, " can also open or close the sentence."] }
            ex: { examples: [[{ target: Occasionally }, ", we eat out."], ["We eat out ", { target: occasionally }, "."]] }
          - type: rule
            level: B2
            text: { en: [{ term: never }, ", ", { term: seldom }, " and ", { term: hardly ever }, " are negative already, so the verb stays positive."] }
            ex: ["I ", { target: seldom }, " eat out."]

  - title: { en: "Form: how often?", uk: "Форма: як часто?", es: "Forma: ¿con qué frecuencia?", pt: "Forma: com que frequência?", fr: "Forme : à quelle fréquence ?", de: "Form: Wie oft?", it: "Forma: quanto spesso?", pl: "Forma: jak często?", tr: "Biçim: ne sıklıkla?", id: "Bentuk: seberapa sering?", vi: "Dạng: bao lâu một lần?" }
    role: form
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: answer, label: { en: Answer, uk: "Відповідь", es: "Respuesta", pt: "Resposta", fr: "Réponse", de: "Antwort", it: "Risposta", pl: "Odpowiedź", tr: "Cevap", id: "Jawaban", vi: "Câu trả lời" } }
        rows:
          - { level: A1, question: How often do you swim?, answer: ["I swim ", { target: every day }, "."], tr: { uk: "Як часто ти плаваєш? — Я плаваю щодня.", es: "¿Con qué frecuencia nadas? — Nado todos los días.", pt: "Com que frequência você nada? — Eu nado todos os dias.", fr: "À quelle fréquence nages-tu ? — Je nage tous les jours.", de: "Wie oft schwimmst du? — Ich schwimme jeden Tag.", it: "Quanto spesso nuoti? — Nuoto ogni giorno.", pl: "Jak często pływasz? — Pływam codziennie.", tr: "Ne sıklıkla yüzersin? — Her gün yüzerim.", id: "Seberapa sering kamu berenang? — Saya berenang setiap hari.", vi: "Bạn bơi bao lâu một lần? — Tôi bơi mỗi ngày." } }
          - { level: A1, question: How often does she cook?, answer: ["She cooks ", { target: once a week }, "."], tr: { uk: "Як часто вона готує? — Вона готує раз на тиждень.", es: "¿Con qué frecuencia cocina? — Cocina una vez a la semana.", pt: "Com que frequência ela cozinha? — Ela cozinha uma vez por semana.", fr: "À quelle fréquence cuisine-t-elle ? — Elle cuisine une fois par semaine.", de: "Wie oft kocht sie? — Sie kocht einmal pro Woche.", it: "Quanto spesso cucina lei? — Cucina una volta alla settimana.", pl: "Jak często ona gotuje? — Gotuje raz w tygodniu.", tr: "O ne sıklıkla yemek yapar? — Haftada bir yemek yapar.", id: "Seberapa sering dia memasak? — Dia memasak seminggu sekali.", vi: "Cô ấy nấu ăn bao lâu một lần? — Cô ấy nấu mỗi tuần một lần." } }
          - { level: A1, question: How often do they visit you?, answer: ["They visit ", { target: twice a month }, "."], tr: { uk: "Як часто вони тебе відвідують? — Вони відвідують мене двічі на місяць.", es: "¿Con qué frecuencia te visitan? — Me visitan dos veces al mes.", pt: "Com que frequência eles visitam você? — Eles me visitam duas vezes por mês.", fr: "À quelle fréquence te rendent-ils visite ? — Ils me rendent visite deux fois par mois.", de: "Wie oft besuchen sie dich? — Sie besuchen mich zweimal im Monat.", it: "Quanto spesso vengono a trovarti? — Vengono a trovarmi due volte al mese.", pl: "Jak często cię odwiedzają? — Odwiedzają mnie dwa razy w miesiącu.", tr: "Seni ne sıklıkla ziyaret ederler? — Ayda iki kez ziyaret ederler.", id: "Seberapa sering mereka mengunjungimu? — Mereka mengunjungi saya dua kali sebulan.", vi: "Họ đến thăm bạn bao lâu một lần? — Họ đến thăm tôi mỗi tháng hai lần." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Frequency expressions go at the end: ", { term: every day }, ", ", { term: once a week }, ", ", { term: three times a year }, "."]
              uk: ["Вирази частотності стоять наприкінці речення: ", { term: every day }, ", ", { term: once a week }, ", ", { term: three times a year }, "."]
              es: ["Las expresiones de frecuencia van al final: ", { term: every day }, ", ", { term: once a week }, ", ", { term: three times a year }, "."]
              pt: ["As expressões de frequência vão no fim: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              fr: ["Les expressions de fréquence se placent à la fin : ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              de: ["Häufigkeitsangaben stehen am Ende: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              it: ["Le espressioni di frequenza vanno alla fine: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              pl: ["Wyrażenia częstotliwości stoją na końcu zdania: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              tr: ["Sıklık ifadeleri sonda yer alır: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              id: ["Ungkapan frekuensi diletakkan di akhir: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]
              vi: ["Cụm chỉ tần suất đứng ở cuối câu: ", { term: "every day" }, ", ", { term: "once a week" }, ", ", { term: "three times a year" }, "."]

  - title: { en: "Form: frequency expressions" }
    role: form
    content:
      - type: usage
        columns:
          - { key: expression, label: { en: Expression } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
