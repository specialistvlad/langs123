status: { en: draft, uk: draft, es: draft }
translated: { uk: "2b56e8 2adf0e d486d0 0b8f71 98d1f7 0a9f69", es: "2b56e8 2adf0e d486d0 0b8f71 98d1f7 0a9f69" }

title: { en: "Too, Enough, So and Such", uk: "Too, enough, so і such", es: "Too, enough, so y such" }
summary:
  lead:
    en: [{ term: Too }, ", ", { term: enough }, ", ", { term: so }, " and ", { term: such }, " say how much of a quality: ", { term: too hot }, ", ", { term: hot enough }, ", ", { term: so hot }, ", ", { term: such a hot day }, "."]
    uk: [{ term: Too }, ", ", { term: enough }, ", ", { term: so }, " і ", { term: such }, " показують міру якості: ", { term: too hot }, ", ", { term: hot enough }, ", ", { term: so hot }, ", ", { term: such a hot day }, "."]
    es: [{ term: Too }, ", ", { term: enough }, ", ", { term: so }, " y ", { term: such }, " indican el grado de una cualidad: ", { term: too hot }, ", ", { term: hot enough }, ", ", { term: so hot }, ", ", { term: such a hot day }, "."]
  rule:
    en: [{ term: Enough }, " follows the adjective, ", { term: so }, " goes with an adjective and ", { term: such }, " with a noun:"]
    uk: [{ term: Enough }, " стоїть після прикметника, ", { term: so }, " вживається з прикметником, а ", { term: such }, " — з іменником:"]
    es: [{ term: Enough }, " va después del adjetivo, ", { term: so }, " se usa con un adjetivo y ", { term: such }, " con un sustantivo:"]
  ex: { examples: [["big ", { target: enough }], [{ target: so }, " nice"], [{ target: such a }, " nice day."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: B1, point: { pattern: [too, { alternatives: [adjective, adverb] }] }, rule: { en: ["more than is good; the result follows with ", { pattern: [{ term: to }, { slot: V }] }], uk: ["більше, ніж треба; результат вводить ", { pattern: [{ term: to }, { slot: V }] }], es: ["más de lo conveniente; el resultado sigue con ", { pattern: [{ term: to }, { slot: V }] }] }, ex: ["The box is ", { target: too }, " heavy ", { target: for me to }, " lift."], tr: { uk: "Коробка надто важка, щоб я міг її підняти.", es: "La caja es demasiado pesada para que yo la levante." } }
        - { level: B1, point: { alternatives: [{ pattern: [{ slot: adjective }, enough] }, { pattern: [enough, { slot: noun }] }] }, rule: { en: [{ term: enough }, " follows an adjective and comes before a noun"], uk: [{ term: enough }, " стоїть після прикметника й перед іменником"], es: [{ term: enough }, " va después del adjetivo y antes del sustantivo"] }, ex: { examples: [["She is old ", { target: enough }, " to drive."], ["We have ", { target: enough }, " chairs."]] }, tr: { uk: { examples: ["Вона достатньо доросла, щоб водити машину.", "У нас достатньо стільців."] }, es: { examples: ["Ella tiene edad suficiente para conducir.", "Tenemos suficientes sillas."] } } }
        - { level: B1, point: { pattern: [so, { alternatives: [adjective, adverb] }] }, rule: { en: ["the result follows with ", { term: that }], uk: ["результат вводить ", { term: that }], es: ["el resultado sigue con ", { term: that }] }, ex: ["I was ", { target: so }, " tired ", { target: that }, " I fell asleep."], tr: { uk: "Я так втомився, що заснув.", es: "Estaba tan cansado que me quedé dormido." } }
        - { level: B1, point: { alternatives: [{ pattern: [such a, { slot: adjective }, { slot: singular noun }] }, { pattern: [such, { slot: adjective }, { slot: plural noun }] }] }, rule: { en: [{ term: such }, " goes with a noun, ", { term: so }, " with an adjective or adverb"], uk: [{ term: such }, " вживається з іменником, ", { term: so }, " — з прикметником чи прислівником"], es: [{ term: such }, " va con un sustantivo, ", { term: so }, " con un adjetivo o adverbio"] }, ex: { examples: [["It's ", { target: such a }, " good film."], ["They are ", { target: such }, " nice people."]] }, tr: { uk: { examples: ["Це такий хороший фільм.", "Вони такі приємні люди."] }, es: { examples: ["Es una película tan buena.", "Son personas tan simpáticas."] } } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { pattern: [not, { slot: adjective }, enough] }, ex: ["The room is ", { target: not big enough }, "."], tr: { uk: "Кімната недостатньо велика.", es: "La habitación no es lo bastante grande." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { pattern: [so many, { slot: plural noun }] }, ex: ["I have ", { target: so many }, " friends."], tr: { uk: "У мене так багато друзів.", es: "Tengo tantos amigos." } }

sections:
  - title: { en: "Form: too and enough", uk: "Форма: too і enough", es: "Forma: too y enough" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, pattern: { pattern: [too, { alternatives: [adjective, adverb] }] }, ex: ["This coffee is ", { target: too }, " hot."], tr: { uk: "Ця кава надто гаряча.", es: "Este café está demasiado caliente." } }
          - { level: B1, pattern: { pattern: [too, { slot: adjective }, { optional: for person }, to, { slot: V }] }, ex: ["The box is ", { target: too }, " heavy ", { target: for me to }, " lift."], tr: { uk: "Коробка надто важка, щоб я міг її підняти.", es: "La caja es demasiado pesada para que yo la levante." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [too much, too many] }, { slot: noun }] }, ex: ["There are ", { target: too many }, " people."], tr: { uk: "Тут надто багато людей.", es: "Hay demasiadas personas." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [adjective, adverb] }, enough] }, ex: ["She is old ", { target: enough }, " to drive."], tr: { uk: "Вона достатньо доросла, щоб водити машину.", es: "Ella tiene edad suficiente para conducir." } }
          - { level: B1, pattern: { pattern: [enough, { slot: noun }] }, ex: ["We have ", { target: enough }, " chairs."], tr: { uk: "У нас достатньо стільців.", es: "Tenemos suficientes sillas." } }
          - { level: B1, pattern: { pattern: [not, { slot: adjective }, enough] }, ex: ["The room isn't big ", { target: enough }, "."], tr: { uk: "Кімната недостатньо велика.", es: "La habitación no es lo bastante grande." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: too }, " means more than is good. It has a negative result."]
              uk: [{ term: too }, " означає більше, ніж треба. Результат негативний."]
              es: [{ term: too }, " significa más de lo conveniente. Tiene un resultado negativo."]
          - type: rule
            level: B1
            text:
              en: [{ term: enough }, " follows an adjective or adverb and comes before a noun."]
              uk: [{ term: enough }, " стоїть після прикметника чи прислівника й перед іменником."]
              es: [{ term: enough }, " va después de un adjetivo o adverbio y antes de un sustantivo."]

  - title: { en: "Form: so and such", uk: "Форма: so і such", es: "Forma: so y such" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, pattern: { pattern: [so, { slot: adjective }] }, ex: ["The film is ", { target: so }, " good."], tr: { uk: "Фільм такий гарний.", es: "La película es tan buena." } }
          - { level: B1, pattern: { pattern: [so, { slot: adverb }] }, ex: ["He speaks ", { target: so }, " quickly."], tr: { uk: "Він говорить так швидко.", es: "Habla tan rápido." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [so many, so much] }, { slot: noun }] }, ex: ["I have ", { target: so many }, " friends."], tr: { uk: "У мене так багато друзів.", es: "Tengo tantos amigos." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [such a, an] }, { slot: adjective }, { slot: singular noun }] }, ex: ["It's ", { target: such a }, " good film."], tr: { uk: "Це такий хороший фільм.", es: "Es una película tan buena." } }
          - { level: B1, pattern: { pattern: [such, { slot: adjective }, [{ alternatives: [plural, uncountable] }, " noun"]] }, ex: ["They are ", { target: such }, " nice people."], tr: { uk: "Вони такі приємні люди.", es: "Son personas tan simpáticas." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [so, ["such ", { gap: true }, " that"]] }, { slot: result }] }, ex: ["I was ", { target: so }, " tired ", { target: that }, " I fell asleep."], tr: { uk: "Я так втомився, що заснув.", es: "Estaba tan cansado que me quedé dormido." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: such }, " goes with a noun: ", { term: such a day }, ". ", { term: so }, " goes with an adjective or adverb: ", { term: so hot }, "."]
              uk: [{ term: such }, " вживається з іменником: ", { term: such a day }, ". ", { term: so }, " вживається з прикметником або прислівником: ", { term: so hot }, "."]
              es: [{ term: such }, " va con un sustantivo: ", { term: such a day }, ". ", { term: so }, " va con un adjetivo o adverbio: ", { term: so hot }, "."]
          - type: rule
            level: B1
            text:
              en: [{ alternatives: [{ term: a }, { term: an }] }, " comes after ", { term: such }, ": ", { term: such a big house }, "."]
              uk: [{ alternatives: [{ term: a }, { term: an }] }, " стоїть після ", { term: such }, ": ", { term: such a big house }, "."]
              es: [{ alternatives: [{ term: a }, { term: an }] }, " va después de ", { term: such }, ": ", { term: such a big house }, "."]

  - title: { en: "Compare: very and too", uk: "Порівняння: very і too", es: "Comparación: very y too" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: very, label: very }
          - { key: too, label: too }
        rows:
          - { level: B1, very: { en: "a high degree, no problem", uk: "висока міра, проблеми немає", es: "un grado alto, sin problema" }, too: { en: "more than is good, a problem", uk: "більше, ніж треба, і це проблема", es: "más de lo conveniente, un problema" } }
          - { level: B1, very: { ex: ["It's ", { target: very }, " hot, but I like it."], tr: { uk: "Дуже спекотно, але мені подобається.", es: "Hace mucho calor, pero me gusta." } }, too: { ex: ["It's ", { target: too }, " hot. I can't sit outside."], tr: { uk: "Надто спекотно. Я не можу сидіти надворі.", es: "Hace demasiado calor. No puedo estar fuera." } } }
          - { level: B1, very: { ex: ["The bag is ", { target: very }, " heavy, but I can lift it."], tr: { uk: "Сумка дуже важка, але я можу її підняти.", es: "La bolsa es muy pesada, pero puedo levantarla." } }, too: { ex: ["The bag is ", { target: too }, " heavy to lift."], tr: { uk: "Сумка надто важка, щоб її підняти.", es: "La bolsa es demasiado pesada para levantarla." } } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: The room is not enough big., right: ["The room is ", { target: not big enough }, "."], rule: { en: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] }, uk: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] }, es: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] } } }
          - { level: B1, wrong: I have so much friends., right: ["I have ", { target: so many }, " friends."], rule: { en: { pattern: [{ term: many }, { slot: plural noun }] }, uk: { pattern: [{ term: many }, { slot: plural noun }] }, es: { pattern: [{ term: many }, { slot: plural noun }] } } }
          - { level: B1, speakers: [uk], wrong: It is so nice day., right: ["It is ", { target: such a }, " nice day."], rule: { uk: ["з іменником вживають ", { term: such }, ", а не ", { term: so }, "; українське «такий» відповідає обом"] } }
          - { level: B1, speakers: [uk], wrong: "I was so tired, that I fell asleep.", right: ["I was so ", { target: tired that }, " I fell asleep."], rule: { uk: ["перед ", { term: that }, " коми немає; в українській перед «що» кома обов’язкова"] } }
          - { level: B1, speakers: [es], wrong: It is a so nice day., right: ["It is ", { target: such a }, " nice day."], rule: { es: ["con un sustantivo se usa ", { term: such a }, ", no ", { term: a so }, "; el español dice «tan» en ambos casos"] } }
          - { level: B1, speakers: [es], wrong: It is too much hot., right: ["It is ", { target: too }, " hot."], rule: { es: ["ante un adjetivo se usa ", { term: too }, ", no ", { term: too much }, "; «demasiado» se traduce de dos formas"] } }
          - { level: B1, speakers: [es], wrong: This coffee is too hot for drink., right: ["This coffee is too hot ", { target: to drink }, "."], rule: { es: ["tras ", { term: too }, " y un adjetivo, «para» ante un verbo se dice ", { term: to }, ", no ", { term: for }] } }
