  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: The room is not enough big., right: ["The room is ", { target: not big enough }, "."], rule: { en: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] }, uk: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] }, es: { pattern: [{ term: not }, { slot: adjective }, { term: enough }] }, pt: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, fr: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, de: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, it: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, pl: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, tr: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, id: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] }, vi: { pattern: [{ term: "not" }, { slot: "adjective" }, { term: "enough" }] } } }
          - { level: B1, wrong: I have so much friends., right: ["I have ", { target: so many }, " friends."], rule: { en: { pattern: [{ term: many }, { slot: plural noun }] }, uk: { pattern: [{ term: many }, { slot: plural noun }] }, es: { pattern: [{ term: many }, { slot: plural noun }] }, pt: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, fr: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, de: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, it: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, pl: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, tr: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, id: { pattern: [{ term: "many" }, { slot: "plural noun" }] }, vi: { pattern: [{ term: "many" }, { slot: "plural noun" }] } } }
          - { level: B1, speakers: [uk], wrong: It is so nice day., right: ["It is ", { target: such a }, " nice day."], rule: { uk: ["з іменником вживають ", { term: such }, ", а не ", { term: so }, "; українське «такий» відповідає обом"] } }
          - { level: B1, speakers: [uk], wrong: "I was so tired, that I fell asleep.", right: ["I was so ", { target: tired that }, " I fell asleep."], rule: { uk: ["перед ", { term: that }, " коми немає; в українській перед «що» кома обов’язкова"] } }
          - { level: B1, speakers: [es], wrong: It is a so nice day., right: ["It is ", { target: such a }, " nice day."], rule: { es: ["con un sustantivo se usa ", { term: such a }, ", no ", { term: a so }, "; el español dice «tan» en ambos casos"] } }
          - { level: B1, speakers: [es], wrong: It is too much hot., right: ["It is ", { target: too }, " hot."], rule: { es: ["ante un adjetivo se usa ", { term: too }, ", no ", { term: too much }, "; «demasiado» se traduce de dos formas"] } }
          - { level: B1, speakers: [es], wrong: This coffee is too hot for drink., right: ["This coffee is too hot ", { target: to drink }, "."], rule: { es: ["tras ", { term: too }, " y un adjetivo, «para» ante un verbo se dice ", { term: to }, ", no ", { term: for }] } }
          - { level: B2, wrong: What day!, right: [{ target: What a day }, "!"], rule: { en: [{ term: what }, " takes ", { term: a }, " before a singular countable noun"] } }
          - { level: B2, wrong: How a nice day!, right: [{ target: What a nice day }, "!"], rule: { en: [{ term: how }, " takes an adjective alone; ", { term: what }, " takes a noun"] } }
          - { level: B2, wrong: We left early so that to get seats., right: ["We left early ", { target: so as to }, " get seats."], rule: { en: [{ term: so that }, " takes a clause; ", { term: so as }, " takes ", { term: to }] } }
          - { level: C1, wrong: She is not enough a leader., right: ["She is not ", { target: enough of a }, " leader."], rule: { en: [{ term: enough }, " takes ", { term: of a }, " before a noun"] } }
          - { level: C1, wrong: "He was nervous, so much that he could not speak.", right: ["He was nervous, ", { target: so much so that }, " he could not speak."], rule: { en: ["the fixed phrase repeats ", { term: so }] } }
          - { level: C2, wrong: It was so great challenge., right: ["It was ", { target: so great a challenge }, "."], rule: { en: ["after ", { term: so }, " the adjective comes before ", { term: a }] } }
          - { level: C2, wrong: How big house do you need?, right: [{ target: How big a house }, " do you need?"], rule: { en: ["after ", { term: how }, " the adjective comes before ", { term: a }] } }
