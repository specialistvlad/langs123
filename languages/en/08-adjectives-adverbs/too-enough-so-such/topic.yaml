        - { level: C1, point: { en: Formal degree, uk: "Формальна міра", es: "Grado formal", pt: "Grau formal", fr: "Degré soutenu", de: "Formeller Grad", it: "Grado formale", pl: "Stopień w stylu formalnym", tr: "Resmî derece", id: "Tingkat formal", vi: "Mức độ trang trọng" }, rule: { en: [{ term: so much so that }, ", ", { term: to such an extent that }, ", ", { term: so foolish as to }], uk: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], es: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], pt: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], fr: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], de: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], it: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], pl: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], tr: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], id: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }], vi: [{ term: "so much so that" }, ", ", { term: "to such an extent that" }, ", ", { term: "so foolish as to" }] }, ex: ["He was nervous, ", { target: so much so that }, " he could not speak."], tr: { uk: "Він нервував, і то так сильно, що не міг говорити.", es: "Estaba nervioso, tanto así que no podía hablar.", pt: "Ele estava nervoso, a tal ponto que não conseguia falar.", fr: "Il était nerveux, à tel point qu’il ne pouvait pas parler.", de: "Er war nervös, so sehr, dass er nicht sprechen konnte.", it: "Era nervoso, a tal punto che non riusciva a parlare.", pl: "Był zdenerwowany, i to do tego stopnia, że nie mógł mówić.", tr: "Gergindi, hem de öyle ki konuşamıyordu.", id: "Dia gugup, begitu gugupnya sampai tidak bisa bicara.", vi: "Anh ấy lo lắng, lo đến mức không nói được." } }
        - { level: C1, point: { pattern: [something of a, { slot: noun }] }, rule: { en: [{ term: enough of a }, ", ", { term: not much of a }, ", ", { term: something of a }], uk: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], es: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], pt: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], fr: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], de: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], it: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], pl: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], tr: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], id: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }], vi: [{ term: "enough of a" }, ", ", { term: "not much of a" }, ", ", { term: "something of a" }] }, ex: ["She is ", { target: something of an expert }, "."], tr: { uk: "Вона певною мірою фахівчиня.", es: "Es algo así como una experta.", pt: "Ela é uma espécie de especialista.", fr: "Elle est en quelque sorte une experte.", de: "Sie ist so etwas wie eine Expertin.", it: "È una specie di esperta.", pl: "Jest w pewnym sensie ekspertką.", tr: "O, bir bakıma uzman sayılır.", id: "Dia boleh dibilang seorang ahli.", vi: "Cô ấy có thể coi là một chuyên gia." } }
        - { level: C2, point: { pattern: [so, { slot: adjective }, a, { slot: singular noun }] }, rule: { en: ["after ", { term: as }, ", ", { term: so }, ", ", { term: too }, ", ", { term: how }, " the adjective precedes ", { term: a }], uk: ["після ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, ", ", { term: "how" }, " прикметник стоїть перед ", { term: "a" }], es: ["tras ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " y ", { term: "how" }, " el adjetivo va antes de ", { term: "a" }], pt: ["depois de ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " e ", { term: "how" }, " o adjetivo vem antes de ", { term: "a" }], fr: ["après ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " et ", { term: "how" }, ", l’adjectif précède ", { term: "a" }], de: ["nach ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " und ", { term: "how" }, " steht das Adjektiv vor ", { term: "a" }], it: ["dopo ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " e ", { term: "how" }, " l'aggettivo precede ", { term: "a" }], pl: ["po ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " i ", { term: "how" }, " przymiotnik stoi przed ", { term: "a" }], tr: [{ term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, " ve ", { term: "how" }, " sözcüklerinden sonra sıfat ", { term: "a" }, " sözcüğünden önce gelir"], id: ["setelah ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, ", dan ", { term: "how" }, ", kata sifat berada sebelum ", { term: "a" }], vi: ["sau ", { term: "as" }, ", ", { term: "so" }, ", ", { term: "too" }, ", ", { term: "how" }, ", tính từ đứng trước ", { term: "a" }] }, ex: ["It was ", { target: too long a delay }, "."], tr: { uk: "Це надто тривала затримка.", es: "Es una demora demasiado larga.", pt: "É um atraso longo demais.", fr: "C’est un retard trop long.", de: "Das ist eine zu lange Verzögerung.", it: "È un ritardo troppo lungo.", pl: "To zbyt długie opóźnienie.", tr: "Bu, fazla uzun bir gecikme.", id: "Ini penundaan yang terlalu lama.", vi: "Đây là một sự chậm trễ quá lâu." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { pattern: [not, { slot: adjective }, enough] }, ex: ["The room is ", { target: not big enough }, "."], tr: { uk: "Кімната недостатньо велика.", es: "La habitación no es lo bastante grande.", pt: "O quarto não é grande o suficiente.", fr: "La pièce n’est pas assez grande.", de: "Der Raum ist nicht groß genug.", it: "La stanza non è abbastanza grande.", pl: "Pokój nie jest wystarczająco duży.", tr: "Oda yeterince büyük değil.", id: "Ruangan itu tidak cukup besar.", vi: "Căn phòng không đủ rộng." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { pattern: [so many, { slot: plural noun }] }, ex: ["I have ", { target: so many }, " friends."], tr: { uk: "У мене так багато друзів.", es: "Tengo tantos amigos.", pt: "Tenho tantos amigos.", fr: "J’ai tellement d’amis.", de: "Ich habe so viele Freunde.", it: "Ho così tanti amici.", pl: "Mam tak wielu przyjaciół.", tr: "Pek çok arkadaşım var.", id: "Saya punya begitu banyak teman.", vi: "Tôi có rất nhiều bạn bè." } }

sections:
  - title: { en: "Form: too and enough", uk: "Форма: too і enough", es: "Forma: too y enough", pt: "Forma: too e enough", fr: "Forme : too et enough", de: "Form: too und enough", it: "Forma: too e enough", pl: "Forma: too i enough", tr: "Biçim: too ve enough", id: "Bentuk: too dan enough", vi: "Dạng: too và enough" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, pattern: { pattern: [too, { alternatives: [adjective, adverb] }] }, ex: ["This coffee is ", { target: too }, " hot."], tr: { uk: "Ця кава надто гаряча.", es: "Este café está demasiado caliente.", pt: "Este café está quente demais.", fr: "Ce café est trop chaud.", de: "Dieser Kaffee ist zu heiß.", it: "Questo caffè è troppo caldo.", pl: "Ta kawa jest zbyt gorąca.", tr: "Bu kahve fazla sıcak.", id: "Kopi ini terlalu panas.", vi: "Cà phê này nóng quá." } }
          - { level: B1, pattern: { pattern: [too, { slot: adjective }, { optional: for person }, to, { slot: V }] }, ex: ["The box is ", { target: too }, " heavy ", { target: for me to }, " lift."], tr: { uk: "Коробка надто важка, щоб я міг її підняти.", es: "La caja es demasiado pesada para que yo la levante.", pt: "A caixa é pesada demais para eu levantar.", fr: "La boîte est trop lourde pour que je la soulève.", de: "Die Kiste ist zu schwer, als dass ich sie heben könnte.", it: "La scatola è troppo pesante perché io possa sollevarla.", pl: "Pudełko jest zbyt ciężkie, żebym mógł je podnieść.", tr: "Kutu, kaldıramayacağım kadar ağır.", id: "Kotak ini terlalu berat untuk saya angkat.", vi: "Cái hộp quá nặng, tôi không nhấc nổi." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [too much, too many] }, { slot: noun }] }, ex: ["There are ", { target: too many }, " people."], tr: { uk: "Тут надто багато людей.", es: "Hay demasiadas personas.", pt: "Há pessoas demais.", fr: "Il y a trop de gens.", de: "Es sind zu viele Leute da.", it: "Ci sono troppe persone.", pl: "Jest za dużo ludzi.", tr: "Çok fazla insan var.", id: "Ada terlalu banyak orang.", vi: "Có quá nhiều người." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [adjective, adverb] }, enough] }, ex: ["She is old ", { target: enough }, " to drive."], tr: { uk: "Вона достатньо доросла, щоб водити машину.", es: "Ella tiene edad suficiente para conducir.", pt: "Ela tem idade suficiente para dirigir.", fr: "Elle est assez âgée pour conduire.", de: "Sie ist alt genug, um Auto zu fahren.", it: "Ha l'età giusta per guidare.", pl: "Jest wystarczająco dorosła, żeby prowadzić samochód.", tr: "O, araba kullanabilecek yaşta.", id: "Dia sudah cukup umur untuk mengemudi.", vi: "Cô ấy đủ tuổi để lái xe." } }
          - { level: B1, pattern: { pattern: [enough, { slot: noun }] }, ex: ["We have ", { target: enough }, " chairs."], tr: { uk: "У нас достатньо стільців.", es: "Tenemos suficientes sillas.", pt: "Temos cadeiras suficientes.", fr: "Nous avons assez de chaises.", de: "Wir haben genug Stühle.", it: "Abbiamo abbastanza sedie.", pl: "Mamy wystarczająco dużo krzeseł.", tr: "Yeterince sandalyemiz var.", id: "Kami punya cukup kursi.", vi: "Chúng tôi có đủ ghế." } }
          - { level: B1, pattern: { pattern: [not, { slot: adjective }, enough] }, ex: ["The room isn't big ", { target: enough }, "."], tr: { uk: "Кімната недостатньо велика.", es: "La habitación no es lo bastante grande.", pt: "O quarto não é grande o suficiente.", fr: "La pièce n’est pas assez grande.", de: "Der Raum ist nicht groß genug.", it: "La stanza non è abbastanza grande.", pl: "Pokój nie jest wystarczająco duży.", tr: "Oda yeterince büyük değil.", id: "Ruangan itu tidak cukup besar.", vi: "Căn phòng không đủ rộng." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: too }, " means more than is good. It has a negative result."]
              uk: [{ term: too }, " означає більше, ніж треба. Результат негативний."]
              es: [{ term: too }, " significa más de lo conveniente. Tiene un resultado negativo."]
              pt: [{ term: "too" }, " significa mais do que o conveniente. Tem um resultado negativo."]
              fr: [{ term: "too" }, " signifie plus qu’il ne faut. Le résultat est négatif."]
              de: [{ term: "too" }, " bedeutet mehr, als gut ist. Es hat ein negatives Ergebnis."]
              it: [{ term: "too" }, " significa più del dovuto. Ha un risultato negativo."]
              pl: [{ term: "too" }, " oznacza więcej, niż trzeba. Ma negatywny skutek."]
              tr: [{ term: "too" }, ", gerekenden fazla anlamına gelir. Sonucu olumsuzdur."]
              id: [{ term: "too" }, " berarti lebih dari yang semestinya. Hasilnya negatif."]
              vi: [{ term: "too" }, " nghĩa là nhiều hơn mức vừa phải. Nó dẫn đến kết quả tiêu cực."]
          - type: rule
            level: B1
            text:
              en: [{ term: enough }, " follows an adjective or adverb and comes before a noun."]
              uk: [{ term: enough }, " стоїть після прикметника чи прислівника й перед іменником."]
              es: [{ term: enough }, " va después de un adjetivo o adverbio y antes de un sustantivo."]
              pt: [{ term: "enough" }, " vem depois de um adjetivo ou advérbio e antes de um substantivo."]
              fr: [{ term: "enough" }, " se place après un adjectif ou un adverbe et avant un nom."]
              de: [{ term: "enough" }, " steht nach einem Adjektiv oder Adverb und vor einem Nomen."]
              it: [{ term: "enough" }, " segue un aggettivo o un avverbio e precede un sostantivo."]
              pl: [{ term: "enough" }, " stoi po przymiotniku lub przysłówku i przed rzeczownikiem."]
              tr: [{ term: "enough" }, ", sıfat ya da zarftan sonra ve isimden önce gelir."]
              id: [{ term: "enough" }, " berada sesudah kata sifat atau kata keterangan dan sebelum kata benda."]
              vi: [{ term: "enough" }, " đứng sau tính từ hoặc trạng từ và đứng trước danh từ."]

  - title: { en: "Form: so and such", uk: "Форма: so і such", es: "Forma: so y such", pt: "Forma: so e such", fr: "Forme : so et such", de: "Form: so und such", it: "Forma: so e such", pl: "Forma: so i such", tr: "Biçim: so ve such", id: "Bentuk: so dan such", vi: "Dạng: so và such" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, pattern: { pattern: [so, { slot: adjective }] }, ex: ["The film is ", { target: so }, " good."], tr: { uk: "Фільм такий гарний.", es: "La película es tan buena.", pt: "O filme é tão bom.", fr: "Le film est si bon.", de: "Der Film ist so gut.", it: "Il film è così bello.", pl: "Ten film jest taki dobry.", tr: "Film çok iyi.", id: "Filmnya begitu bagus.", vi: "Bộ phim hay quá." } }
          - { level: B1, pattern: { pattern: [so, { slot: adverb }] }, ex: ["He speaks ", { target: so }, " quickly."], tr: { uk: "Він говорить так швидко.", es: "Habla tan rápido.", pt: "Ele fala tão rápido.", fr: "Il parle si vite.", de: "Er spricht so schnell.", it: "Parla così velocemente.", pl: "On mówi tak szybko.", tr: "O çok hızlı konuşuyor.", id: "Dia berbicara begitu cepat.", vi: "Anh ấy nói nhanh quá." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [so many, so much] }, { slot: noun }] }, ex: ["I have ", { target: so many }, " friends."], tr: { uk: "У мене так багато друзів.", es: "Tengo tantos amigos.", pt: "Tenho tantos amigos.", fr: "J’ai tellement d’amis.", de: "Ich habe so viele Freunde.", it: "Ho così tanti amici.", pl: "Mam tak wielu przyjaciół.", tr: "Pek çok arkadaşım var.", id: "Saya punya begitu banyak teman.", vi: "Tôi có rất nhiều bạn bè." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [such a, an] }, { slot: adjective }, { slot: singular noun }] }, ex: ["It's ", { target: such a }, " good film."], tr: { uk: "Це такий хороший фільм.", es: "Es una película tan buena.", pt: "É um filme tão bom.", fr: "C’est un si bon film.", de: "Das ist ein so guter Film.", it: "È un film così bello.", pl: "To taki dobry film.", tr: "Bu çok iyi bir film.", id: "Itu film yang sangat bagus.", vi: "Đó là một bộ phim thật hay." } }
          - { level: B1, pattern: { pattern: [such, { slot: adjective }, [{ alternatives: [plural, uncountable] }, " noun"]] }, ex: ["They are ", { target: such }, " nice people."], tr: { uk: "Вони такі приємні люди.", es: "Son personas tan simpáticas.", pt: "Eles são pessoas tão legais.", fr: "Ce sont des gens si gentils.", de: "Das sind so nette Leute.", it: "Sono persone così simpatiche.", pl: "To tacy mili ludzie.", tr: "Onlar çok iyi insanlar.", id: "Mereka orang-orang yang sangat baik.", vi: "Họ là những người thật dễ mến." } }
          - { level: B1, pattern: { pattern: [{ alternatives: [so, ["such ", { gap: true }, " that"]] }, { slot: result }] }, ex: ["I was ", { target: so }, " tired ", { target: that }, " I fell asleep."], tr: { uk: "Я так втомився, що заснув.", es: "Estaba tan cansado que me quedé dormido.", pt: "Eu estava tão cansado que adormeci.", fr: "J’étais si fatigué que je me suis endormi.", de: "Ich war so müde, dass ich eingeschlafen bin.", it: "Ero così stanco che mi sono addormentato.", pl: "Byłem tak zmęczony, że zasnąłem.", tr: "O kadar yorgundum ki uyuyakaldım.", id: "Saya begitu lelah sehingga tertidur.", vi: "Tôi mệt đến mức ngủ thiếp đi." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: such }, " goes with a noun: ", { term: such a day }, ". ", { term: so }, " goes with an adjective or adverb: ", { term: so hot }, "."]
