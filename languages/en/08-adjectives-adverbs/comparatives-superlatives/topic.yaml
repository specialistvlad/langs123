            text: { en: ["Adverbs compare like adjectives. See ", { link: Adverbs of frequency and manner, to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], uk: ["Прислівники порівнюються так само, як прикметники. Див. ", { link: "Прислівники частотності та способу дії", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], es: ["Los adverbios se comparan como los adjetivos. Ver ", { link: "Adverbios de frecuencia y de modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], pt: ["Os advérbios se comparam como os adjetivos. Ver ", { link: "Advérbios de frequência e de modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], fr: ["Les adverbes se comparent comme les adjectifs. Voir ", { link: "Adverbes de fréquence et de manière", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], de: ["Adverbien werden wie Adjektive verglichen. Siehe ", { link: "Adverbien der Häufigkeit und der Art und Weise", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], it: ["Gli avverbi si comparano come gli aggettivi. Vedi ", { link: "Avverbi di frequenza e di modo", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], pl: ["Przysłówki stopniuje się tak jak przymiotniki. Zob. ", { link: "Przysłówki częstotliwości i sposobu", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], tr: ["Zarflar sıfatlar gibi karşılaştırılır. Bkz. ", { link: "Sıklık ve durum zarfları", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], id: ["Kata keterangan dibandingkan seperti kata sifat. Lihat ", { link: "Kata keterangan frekuensi dan cara", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."], vi: ["Trạng từ được so sánh như tính từ. Xem ", { link: "Trạng từ chỉ tần suất và cách thức", to: en.adjectives-adverbs.adverbs-frequency-manner }, "."] }

