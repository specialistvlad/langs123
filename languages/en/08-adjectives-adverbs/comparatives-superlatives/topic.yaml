        rows:
          - { level: C1, structure: all the more, meaning: { en: "even more, because of something just said", uk: "ще більше — через щойно сказане", es: "aún más, por lo que se acaba de decir", pt: "ainda mais, por causa do que acabou de ser dito", fr: "encore plus, à cause de ce qui vient d’être dit", de: "noch mehr, wegen des gerade Gesagten", it: "ancora di più, a causa di quanto appena detto", pl: "tym bardziej, z powodu tego, co właśnie powiedziano", tr: "az önce söylenen şey yüzünden daha da fazla", id: "lebih lagi, karena hal yang baru saja disebut", vi: "càng hơn nữa, vì điều vừa nói" }, ex: ["We admire her ", { target: all the more }, " for staying calm."], tr: { uk: "Ми захоплюємося нею ще більше за те, що вона зберігає спокій.", es: "La admiramos aún más por mantener la calma.", pt: "Nós a admiramos ainda mais por manter a calma.", fr: "Nous l’admirons d’autant plus qu’elle garde son calme.", de: "Wir bewundern sie umso mehr dafür, dass sie ruhig bleibt.", it: "La ammiriamo ancora di più perché resta calma.", pl: "Podziwiamy ją tym bardziej, że zachowuje spokój.", tr: "Sakin kaldığı için ona daha da hayranız.", id: "Kami semakin mengagumi dia karena tetap tenang.", vi: "Chúng tôi càng ngưỡng mộ cô ấy vì cô ấy giữ được bình tĩnh." } }
          - { level: C1, structure: none the less, meaning: { en: "in spite of that", uk: "попри це", es: "a pesar de eso", pt: "apesar disso", fr: "malgré cela", de: "trotzdem", it: "nonostante ciò", pl: "mimo to", tr: "buna rağmen", id: "meskipun begitu", vi: "mặc dù vậy" }, ex: ["The route was long; ", { target: none the less }, ", we enjoyed it."], tr: { uk: "Маршрут був довгий, але нам усе одно сподобалося.", es: "El recorrido fue largo; aun así, lo disfrutamos.", pt: "O trajeto foi longo; mesmo assim, gostamos.", fr: "Le trajet était long ; nous l’avons néanmoins apprécié.", de: "Die Strecke war lang; trotzdem hat sie uns gefallen.", it: "Il percorso era lungo; ciò nonostante ci è piaciuto.", pl: "Trasa była długa; mimo to nam się podobała.", tr: "Güzergâh uzundu; yine de keyif aldık.", id: "Rutenya panjang; meskipun begitu, kami menikmatinya.", vi: "Lộ trình dài; dù vậy, chúng tôi vẫn thích." } }
          - { level: C1, structure: none the wiser, meaning: { en: "knowing no more than before", uk: "знаючи не більше, ніж раніше", es: "sin saber más que antes", pt: "sem saber mais do que antes", fr: "sans en savoir plus qu’avant", de: "nicht klüger als zuvor", it: "senza saperne di più di prima", pl: "wiedząc tyle samo co przedtem", tr: "öncekinden daha fazla bilmeden", id: "tidak tahu lebih banyak daripada sebelumnya", vi: "không biết thêm gì so với trước" }, ex: ["I read the notice and I am ", { target: none the wiser }, "."], tr: { uk: "Я прочитав оголошення, але розумію не більше, ніж раніше.", es: "Leí el aviso y no estoy más enterado que antes.", pt: "Li o aviso e continuo sem entender mais do que antes.", fr: "J’ai lu l’avis et je n’en sais pas plus qu’avant.", de: "Ich habe den Aushang gelesen und bin nicht klüger als vorher.", it: "Ho letto l'avviso e non ne so più di prima.", pl: "Przeczytałem ogłoszenie i wiem tyle samo co przedtem.", tr: "Duyuruyu okudum, ama öncekinden fazla bir şey anlamadım.", id: "Saya membaca pengumuman itu, tetapi saya tidak jadi lebih tahu.", vi: "Tôi đã đọc thông báo mà vẫn chẳng hiểu thêm gì." } }
          - { level: C1, structure: { pattern: [no more, { slot: noun }, than] }, meaning: { en: "not, just as the other is not", uk: "ні, так само як ні й інший", es: "no lo es, igual que el otro tampoco", pt: "não é, assim como o outro também não é", fr: "ne l’est pas, pas plus que l’autre", de: "nein, ebenso wenig wie der andere", it: "non lo è, proprio come l'altro non lo è", pl: "nie jest, tak samo jak ten drugi nie jest", tr: "değildir, tıpkı diğerinin olmadığı gibi", id: "bukan, sama seperti yang lain juga bukan", vi: "không phải, cũng như người kia không phải" }, ex: ["He is ", { target: no more a doctor than }, " I am."], tr: { uk: "Він так само не лікар, як і я.", es: "Él no es médico, igual que yo tampoco.", pt: "Ele não é médico, assim como eu também não sou.", fr: "Il n’est pas plus médecin que moi.", de: "Er ist genauso wenig Arzt wie ich.", it: "Non è un medico, così come non lo sono io.", pl: "On nie jest lekarzem, tak samo jak ja.", tr: "O, tıpkı benim gibi doktor değil.", id: "Dia bukan dokter, sama seperti saya.", vi: "Anh ấy không phải bác sĩ, cũng như tôi vậy." } }
          - { level: C1, structure: { pattern: [no less, { slot: adjective }, than] }, meaning: { en: "just as", uk: "так само", es: "igual que", pt: "da mesma forma que", fr: "tout autant que", de: "ebenso", it: "altrettanto", pl: "tak samo", tr: "aynı derecede", id: "sama seperti", vi: "cũng như" }, ex: ["He is ", { target: no less clever than }, " his sister."], tr: { uk: "Він не менш розумний, ніж його сестра.", es: "Él no es menos inteligente que su hermana.", pt: "Ele não é menos inteligente que a irmã.", fr: "Il n’est pas moins intelligent que sa sœur.", de: "Er ist nicht weniger klug als seine Schwester.", it: "Non è meno intelligente di sua sorella.", pl: "On nie jest mniej mądry niż jego siostra.", tr: "O, kız kardeşinden daha az zeki değil.", id: "Dia tidak kurang pintar daripada saudara perempuannya.", vi: "Anh ấy thông minh không kém chị gái mình." } }
          - { level: C1, structure: { pattern: [not so much, { slot: noun }, as] }, meaning: { en: "this rather than that", uk: "це, а не те", es: "esto más que aquello", pt: "isto mais do que aquilo", fr: "plutôt ceci que cela", de: "eher dies als das", it: "questo piuttosto che quello", pl: "raczej to niż tamto", tr: "ötekinden çok bu", id: "ini, bukan itu", vi: "cái này hơn là cái kia" }, ex: ["It is ", { target: not so much a problem as }, " a worry."], tr: { uk: "Це не стільки проблема, скільки турбота.", es: "No es tanto un problema como una preocupación.", pt: "Não é tanto um problema quanto uma preocupação.", fr: "C’est moins un problème qu’une source d’inquiétude.", de: "Es ist nicht so sehr ein Problem als vielmehr eine Sorge.", it: "Non è tanto un problema quanto una preoccupazione.", pl: "To nie tyle problem, ile zmartwienie.", tr: "Bu bir sorundan çok bir endişe.", id: "Ini bukan sekadar masalah, melainkan kekhawatiran.", vi: "Đó không hẳn là một vấn đề mà là một mối lo." } }
          - { level: C1, structure: { pattern: [{ slot: comparative }, than ever] }, meaning: { en: "more than at any earlier time", uk: "більше, ніж будь-коли раніше", es: "más que en cualquier momento anterior", pt: "mais do que em qualquer momento anterior", fr: "plus qu’à n’importe quel moment antérieur", de: "mehr als zu jedem früheren Zeitpunkt", it: "più che in qualsiasi momento precedente", pl: "bardziej niż kiedykolwiek wcześniej", tr: "daha önceki her zamandan daha fazla", id: "lebih daripada kapan pun sebelumnya", vi: "hơn bất kỳ lúc nào trước đó" }, ex: ["It is raining ", { target: harder than ever }, "."], tr: { uk: "Дощ ллє дужче, ніж будь-коли.", es: "Llueve más fuerte que nunca.", pt: "Está chovendo mais forte do que nunca.", fr: "Il pleut plus fort que jamais.", de: "Es regnet stärker denn je.", it: "Piove più forte che mai.", pl: "Pada mocniej niż kiedykolwiek.", tr: "Yağmur hiç olmadığı kadar şiddetli yağıyor.", id: "Hujan turun lebih deras daripada sebelumnya.", vi: "Trời mưa to hơn bao giờ hết." } }
          - { level: C1, structure: the less said the better, meaning: { en: "it is better not to talk about it", uk: "краще про це не говорити", es: "es mejor no hablar de ello", pt: "é melhor não falar sobre isso", fr: "il vaut mieux ne pas en parler", de: "es ist besser, nicht darüber zu reden", it: "è meglio non parlarne", pl: "lepiej o tym nie mówić", tr: "bu konuda konuşmamak daha iyidir", id: "lebih baik tidak membicarakannya", vi: "tốt hơn là đừng nói về chuyện đó" }, ex: ["About the party, ", { target: the less said the better }, "."], tr: { uk: "Про вечірку краще не говорити.", es: "De la fiesta, mejor no hablar.", pt: "Da festa, é melhor nem falar.", fr: "Quant à la fête, mieux vaut n’en rien dire.", de: "Über die Party sollte man besser schweigen.", it: "Della festa, meglio non parlarne.", pl: "O imprezie lepiej nie mówić.", tr: "Parti konusunda, ne kadar az konuşulursa o kadar iyi.", id: "Soal pesta itu, lebih baik tidak dibicarakan.", vi: "Về bữa tiệc, tốt nhất là đừng nhắc đến." } }

