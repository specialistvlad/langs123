          - { level: A2, adjective: { en: ["two syllables ending in -y: ", { term: easy }], uk: ["два склади на -y: ", { term: easy }], es: ["dos sílabas terminadas en -y: ", { term: easy }], pt: ["duas sílabas terminadas em -y: ", { term: "easy" }], fr: ["deux syllabes se terminant par -y : ", { term: "easy" }], de: ["zwei Silben auf -y: ", { term: "easy" }], it: ["due sillabe che finiscono in -y: ", { term: "easy" }], pl: ["dwie sylaby z końcówką -y: ", { term: "easy" }], tr: ["-y ile biten iki hece: ", { term: "easy" }], id: ["dua suku kata berakhiran -y: ", { term: "easy" }], vi: ["hai âm tiết tận cùng bằng -y: ", { term: "easy" }] }, comparative: [eas, { ending: ier }], superlative: [the eas, { ending: iest }] }
          - { level: A2, adjective: { en: ["two or more syllables: ", { term: expensive }], uk: ["два й більше складів: ", { term: expensive }], es: ["dos o más sílabas: ", { term: expensive }], pt: ["duas ou mais sílabas: ", { term: "expensive" }], fr: ["deux syllabes ou plus : ", { term: "expensive" }], de: ["zwei oder mehr Silben: ", { term: "expensive" }], it: ["due o più sillabe: ", { term: "expensive" }], pl: ["dwie lub więcej sylab: ", { term: "expensive" }], tr: ["iki veya daha fazla hece: ", { term: "expensive" }], id: ["dua suku kata atau lebih: ", { term: "expensive" }], vi: ["hai âm tiết trở lên: ", { term: "expensive" }] }, comparative: [{ target: more }, " expensive"], superlative: ["the ", { target: most }, " expensive"] }
      - type: list
