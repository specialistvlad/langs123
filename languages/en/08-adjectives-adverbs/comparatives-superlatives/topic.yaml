        - { level: A2, point: { en: Spelling, uk: "Правопис", es: "Ortografía", pt: "Ortografia", fr: "Orthographe", de: "Schreibweise", it: "Ortografia", pl: "Pisownia", tr: "Yazım", id: "Ejaan", vi: "Chính tả" }, rule: { en: "add r after -e; y becomes i; double one final consonant", uk: "після -e додаємо r; y стає i; одну кінцеву приголосну подвоюємо", es: "se añade r después de -e; y pasa a i; se duplica una consonante final", pt: "acrescenta-se r depois de -e; y vira i; dobra-se uma consoante final", fr: "r s’ajoute après -e ; y devient i ; une consonne finale se double", de: "nach -e wird nur r angehängt; y wird zu i; ein einzelner Endkonsonant wird verdoppelt", it: "si aggiunge r dopo -e; y diventa i; si raddoppia una consonante finale", pl: "po -e dodaje się r; y zmienia się w i; jedną końcową spółgłoskę podwaja się", tr: "-e ile bitenlere r eklenir; y, i olur; son ünsüz ikilenir", id: "tambahkan r setelah -e; y menjadi i; satu konsonan akhir digandakan", vi: "thêm r sau -e; y đổi thành i; gấp đôi một phụ âm cuối" }, ex: { examples: [{ mapping: [nice, { target: nicer }] }, { mapping: [happy, { target: happier }] }, { mapping: [big, { target: bigger }] }] }, tr: { uk: { examples: ["приємний, приємніший", "щасливий, щасливіший", "великий, більший"] }, es: { examples: ["agradable, más agradable", "feliz, más feliz", "grande, más grande"] }, pt: { examples: ["agradável, mais agradável", "feliz, mais feliz", "grande, maior"] }, fr: { examples: ["agréable, plus agréable", "heureux, plus heureux", "grand, plus grand"] }, de: { examples: ["nett, netter", "glücklich, glücklicher", "groß, größer"] }, it: { examples: ["carino, più carino", "felice, più felice", "grande, più grande"] }, pl: { examples: ["miły, milszy", "szczęśliwy, szczęśliwszy", "duży, większy"] }, tr: { examples: ["hoş, daha hoş", "mutlu, daha mutlu", "büyük, daha büyük"] }, id: { examples: ["menyenangkan, lebih menyenangkan", "bahagia, lebih bahagia", "besar, lebih besar"] }, vi: { examples: ["dễ chịu