          - { level: B2, phrase: compared with, rule: { en: "puts two things side by side to find differences", uk: "ставить два предмети поруч, щоб знайти відмінності", es: "pone dos cosas lado a lado para hallar diferencias", pt: "põe duas coisas lado a lado para achar diferenças", fr: "met deux choses côte à côte pour trouver des différences", de: "stellt zwei Dinge nebeneinander, um Unterschiede zu finden", it: "mette due cose una accanto all'altra per trovare le differenze", pl: "zestawia dwie rzeczy, by znaleźć różnice", tr: "farkları bulmak için iki şeyi yan yana koyar", id: "menaruh dua hal berdampingan untuk menemukan perbedaan", vi: "đặt hai vật cạnh nhau để tìm ra điểm khác biệt" }, ex: [{ target: Compared with }, " Leeds, York is small."], tr: { uk: "У порівнянні з Лідсом Йорк невеликий.", es: "Comparado con Leeds, York es pequeño.", pt: "Em comparação com Leeds, York é pequena.", fr: "Comparée à Leeds, York est petite.", de: "Verglichen mit Leeds ist York klein.", it: "In confronto a Leeds, York è piccola.", pl: "W porównaniu z Leeds York jest niewielki.", tr: "Leeds’le karşılaştırıldığında York küçüktür.", id: "Dibandingkan dengan Leeds, York kecil.", vi: "So với Leeds, York nhỏ." } }
          - { level: B2, phrase: look like, rule: { en: "a noun follows", uk: "далі йде іменник", es: "va seguido de un sustantivo", pt: "é seguido de um substantivo", fr: "un nom suit", de: "ein Nomen folgt", it: "segue un sostantivo", pl: "następuje rzeczownik", tr: "arkasından isim gelir", id: "diikuti kata benda", vi: "theo sau là một danh từ" }, ex: ["It ", { target: looks like }, " rain."], tr: { uk: "Схоже на дощ.", es: "Parece lluvia.", pt: "Parece chuva.", fr: "On dirait de la pluie.", de: "Es sieht nach Regen aus.", it: "Ha l'aria di pioggia.", pl: "Wygląda na deszcz.", tr: "Hava yağmura benziyor.", id: "Kelihatannya hujan.", vi: "Trông như sắp mưa." } }
