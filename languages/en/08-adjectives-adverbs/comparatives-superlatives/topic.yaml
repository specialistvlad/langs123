              vi: ["Một số tính từ hai âm tiết dùng được cả hai dạng: ", { mapping: [{ term: "clever" }, { alternatives: [{ term: "cleverer" }, { term: "more clever" }] }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Use ", { term: the }, " before a superlative: ", { term: the cheapest }, "."]
              uk: ["Перед найвищим ступенем порівняння вживають ", { term: the }, ": ", { term: the cheapest }, "."]
              es: ["Delante de un superlativo se usa ", { term: the }, ": ", { term: the cheapest }, "."]
              pt: ["Antes de um superlativo, usa-se ", { term: "the" }, ": ", { term: "the cheapest" }, "."]
              fr: ["Devant un superlatif, on emploie ", { term: "the" }, " : ", { term: "the cheapest" }, "."]
              de: ["Vor einem Superlativ steht ", { term: "the" }, ": ", { term: "the cheapest" }, "."]
              it: ["Davanti a un superlativo si usa ", { term: "the" }, ": ", { term: "the cheapest" }, "."]
              pl: ["Przed stopniem najwyższym używa się ", { term: "the" }, ": ", { term: "the cheapest" }, "."]
              tr: ["Üstünlük derecesinden önce ", { term: "the" }, " kullanılır: ", { term: "the cheapest" }, "."]
              id: ["Sebelum superlatif dipakai ", { term: "the" }, ": ", { term: "the cheapest" }, "."]
