title: { en: Comparatives and Superlatives, uk: Ступені порівняння прикметників, es: Comparativos y superlativos, pt: "Comparativos e superlativos", fr: "Comparatifs et superlatifs", de: "Komparativ und Superlativ", it: "Comparativi e superlativi", pl: "Stopniowanie przymiotników", tr: "Karşılaştırma ve üstünlük dereceleri", id: "Komparatif dan superlatif", vi: "So sánh hơn và so sánh nhất" }
summary:
  lead:
    en: ["Comparatives and superlatives compare things: ", { term: taller than }, ", ", { term: the tallest }, ", ", { term: as tall as }, "."]
    uk: ["Вищий і найвищий ступені порівняння зіставляють предмети: ", { term: taller than }, ", ", { term: the tallest }, ", ", { term: as tall as }, "."]
    es: ["Los comparativos y superlativos comparan cosas: ", { term: taller than }, ", ", { term: the tallest }, ", ", { term: as tall as }, "."]
    pt: ["Os comparativos e superlativos comparam coisas: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    fr: ["Les comparatifs et les superlatifs comparent des choses : ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    de: ["Komparativ und Superlativ vergleichen Dinge: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    it: ["I comparativi e i superlativi mettono a confronto le cose: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    pl: ["Stopień wyższy i najwyższy służą do porównywania rzeczy: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    tr: ["Karşılaştırma ve üstünlük dereceleri nesneleri birbiriyle kıyaslar: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    id: ["Komparatif dan superlatif dipakai untuk membandingkan benda: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
    vi: ["Dạng so sánh hơn và so sánh nhất dùng để so sánh sự vật: ", { term: "taller than" }, ", ", { term: "the tallest" }, ", ", { term: "as tall as" }, "."]
  rule:
    en: ["Short adjectives add -er and -est, and long adjectives take ", { term: more }, " and ", { term: the most }, ":"]
    uk: ["Короткі прикметники беруть -er і -est, а довгі — ", { term: more }, " і ", { term: the most }, ":"]
    es: ["Los adjetivos cortos añaden -er y -est, y los largos llevan ", { term: more }, " y ", { term: the most }, ":"]
    pt: ["Os adjetivos curtos recebem -er e -est, e os longos levam ", { term: "more" }, " e ", { term: "the most" }, ":"]
    fr: ["Les adjectifs courts prennent -er et -est, et les adjectifs longs prennent ", { term: "more" }, " et ", { term: "the most" }, " :"]
    de: ["Kurze Adjektive erhalten -er und -est, und lange Adjektive nehmen ", { term: "more" }, " und ", { term: "the most" }, ":"]
    it: ["Gli aggettivi brevi aggiungono -er e -est, quelli lunghi prendono ", { term: "more" }, " e ", { term: "the most" }, ":"]
    pl: ["Krótkie przymiotniki przyjmują -er i -est, a długie — ", { term: "more" }, " i ", { term: "the most" }, ":"]
    tr: ["Kısa sıfatlar -er ve -est alır, uzun sıfatlar ", { term: "more" }, " ve ", { term: "the most" }, " alır:"]
    id: ["Kata sifat pendek mendapat -er dan -est, sedangkan kata sifat panjang memakai ", { term: "more" }, " dan ", { term: "the most" }, ":"]
    vi: ["Tính từ ngắn thêm -er và -est, tính từ dài dùng ", { term: "more" }, " và ", { term: "the most" }, ":"]
  ex: { examples: [["She is ", { target: taller }, " than me."], ["This bag is ", { target: more expensive }, "."]] }

