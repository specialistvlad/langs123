  - title: { en: "Spelling: -er and -est", uk: "Правопис: -er і -est", es: "Ortografía: -er y -est", pt: "Ortografia: -er e -est", fr: "Orthographe : -er et -est", de: "Schreibweise: -er und -est", it: "Ortografia: -er e -est", pl: "Pisownia: -er i -est", tr: "Yazım: -er ve -est", id: "Ejaan: -er dan -est", vi: "Chính tả: -er và -est" }
