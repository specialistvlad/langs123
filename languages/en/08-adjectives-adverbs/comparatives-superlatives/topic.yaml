        - { level: A2, point: { en: Other adjectives of two or more syllables, uk: "Інші прикметники з двох і більше складів", es: "Otros adjetivos de dos o más sílabas", pt: "Outros adjetivos de duas ou mais sílabas", fr: "Autres adjectifs de deux syllabes ou plus", de: "Andere Adjektive mit zwei oder mehr Silben", it: "Altri aggettivi di due o più sillabe", pl: "Pozostałe przymiotniki o dwóch lub więcej sylabach", tr: "İki ya da daha fazla heceli diğer sıfatlar", id: "Kata sifat lain dengan dua suku kata atau lebih", vi: "Các tính từ khác có hai âm tiết trở lên" }, rule: { alternatives: [{ pattern: [more, { slot: adjective }] }, { pattern: [the most, { slot: adjective }] }] }, ex: ["This bag is ", { target: more expensive }, "."], tr: { uk: "Ця сумка дорожча.", es: "Este bolso es más caro.", pt: "Esta bolsa é mais cara.", fr: "Ce sac est plus cher.", de: "Diese Tasche ist teurer.", it: "Questa borsa è più cara.", pl: "Ta torba jest droższa.", tr: "Bu çanta daha pahalı.", id: "Tas ini lebih mahal.", vi: "Cái túi này đắt hơn." } }
        - { level: A2, point: { en: Irregular, uk: "Неправильні форми", es: "Formas irregulares", pt: "Irregulares", fr: "Formes irrégulières", de: "Unregelmäßige Formen", it: "Irregolari", pl: "Formy nieregularne", tr: "Düzensiz biçimler", id: "Tidak beraturan", vi: "Bất quy tắc" }, rule: { examples: [{ mapping: [good, better, the best] }, { mapping: [bad, worse, the worst] }] }, ex: ["It's ", { target: the best }, " film of the year."], tr: { uk: "Це найкращий фільм року.", es: "Es la mejor película del año.", pt: "É o melhor filme do ano.", fr: "C’est le meilleur film de l’année.", de: "Das ist der beste Film des Jahres.", it: "È il miglior film dell'anno.", pl: "To najlepszy film roku.", tr: "Yılın en iyi filmi bu.", id: "Ini film terbaik tahun ini.", vi: "Đó là bộ phim hay nhất năm." } }
        - { level: A2, point: { pattern: [{ slot: comparative }, than] }, rule: { en: ["compares two things; speech has an object pronoun after ", { term: than }], uk: ["порівнює два предмети; у мовленні після ", { term: than }, " стоїть займенник-додаток"], es: ["compara dos cosas; en el habla, después de ", { term: than }, " va un pronombre objeto"], pt: ["compara duas coisas; na fala, usa-se um pronome objeto depois de ", { term: "than" }], fr: ["compare deux choses ; à l’oral, un pronom complément suit ", { term: "than" }], de: ["vergleicht zwei Dinge; in der gesprochenen Sprache folgt auf ", { term: "than" }, " ein Objektpronomen"], it: ["confronta due cose; nel parlato dopo ", { term: "than" }, " va un pronome complemento"], pl: ["porównuje dwie rzeczy; w mowie po ", { term: "than" }, " stoi zaimek dopełnieniowy"], tr: ["iki şeyi karşılaştırır; konuşmada ", { term: "than" }, " sonrasında nesne zamiri gelir"], id: ["membandingkan dua benda; dalam percakapan, setelah ", { term: "than" }, " dipakai kata ganti objek"], vi: ["so sánh hai vật; khi nói, sau ", { term: "than" }, " dùng đại từ tân ngữ"] }, ex: ["She is ", { target: taller than }, " me."], tr: { uk: "Вона вища за мене.", es: "Ella es más alta que yo.", pt: "Ela é mais alta que eu.", fr: "Elle est plus grande que moi.", de: "Sie ist größer als ich.", it: "Lei è più alta di me.", pl: "Ona jest wyższa ode mnie.", tr: "O benden daha uzun.", id: "Dia lebih tinggi daripada saya.", vi: "Cô ấy cao hơn tôi." } }
        - { level: A2, point: { pattern: [the, { slot: superlative }, { alternatives: [in, of] }] }, rule: { en: ["top of three or more; ", { term: in }, " a place or group, ", { term: of }, " a number"], uk: ["перше серед трьох і більше; ", { term: in }, " — місце чи група, ", { term: of }, " — число"], es: ["el primero entre tres o más; ", { term: in }, " con un lugar o grupo, ", { term: of }, " con un número"], pt: ["o primeiro entre três ou mais; ", { term: "in" }, " com um lugar ou grupo, ", { term: "of" }, " com um número"], fr: ["le plus haut degré parmi trois choses ou plus ; ", { term: "in" }, " avec un lieu ou un groupe, ", { term: "of" }, " avec un nombre"], de: ["der Erste unter dreien oder mehr; ", { term: "in" }, " steht bei einem Ort oder einer Gruppe, ", { term: "of" }, " bei einer Zahl"], it: ["il primo tra tre o più; ", { term: "in" }, " con un luogo o un gruppo, ", { term: "of" }, " con un numero"], pl: ["pierwsze miejsce wśród trzech lub więcej; ", { term: "in" }, " — miejsce lub grupa, ", { term: "of" }, " — liczba"], tr: ["üç ya da daha fazla şey arasında en üstteki; yer ya da grupla ", { term: "in" }, ", sayıyla ", { term: "of" }, " kullanılır"], id: ["yang paling unggul di antara tiga benda atau lebih; ", { term: "in" }, " untuk tempat atau kelompok, ", { term: "of" }, " untuk angka"], vi: ["đứng đầu trong ba vật trở lên; ", { term: "in" }, " đi với nơi chốn hoặc nhóm, ", { term: "of" }, " đi với số lượng"] }, ex: ["She is ", { target: the tallest }, " in the class."], tr: { uk: "Вона найвища в класі.", es: "Ella es la más alta de la clase.", pt: "Ela é a mais alta da turma.", fr: "Elle est la plus grande de la classe.", de: "Sie ist die Größte in der Klasse.", it: "Lei è la più alta della classe.", pl: "Ona jest najwyższa w klasie.", tr: "Sınıfın en uzunu o.", id: "Dia yang paling tinggi di kelas.", vi: "Cô ấy cao nhất lớp." } }
        - { level: A2, point: { alternatives: [{ pattern: [as, { slot: adjective }, as] }, { pattern: [not as, { slot: adjective }, as] }] }, rule: { en: "equal; not equal", uk: "рівність; нерівність", es: "igualdad; desigualdad", pt: "igualdade; desigualdade", fr: "égalité ; inégalité", de: "gleich; ungleich", it: "uguaglianza; disuguaglianza", pl: "równość; nierówność", tr: "eşitlik; eşitsizlik", id: "sama; tidak sama", vi: "ngang bằng; không ngang bằng" }, ex: { examples: [["My flat is ", { target: as big as }, " yours."], ["Tea is ", { target: not as strong as }, " coffee."]] }, tr: { uk: { examples: ["Моя квартира така ж велика, як твоя.", "Чай не такий міцний, як кава."] }, es: { examples: ["Mi apartamento es tan grande como el tuyo.", "El té no es tan fuerte como el café."] }, pt: { examples: ["Meu apartamento é tão grande quanto o seu.", "O chá não é tão forte quanto o café."] }, fr: { examples: ["Mon appartement est aussi grand que le tien.", "Le thé n’est pas aussi fort que le café."] }, de: { examples: ["Meine Wohnung ist so groß wie deine.", "Tee ist nicht so stark wie Kaffee."] }, it: { examples: ["Il mio appartamento è grande come il tuo.", "Il tè non è forte come il caffè."] }, pl: { examples: ["Moje mieszkanie jest tak samo duże jak twoje.", "Herbata nie jest tak mocna jak kawa."] }, tr: { examples: ["Benim dairem seninki kadar büyük.", "Çay kahve kadar kuvvetli değil."] }, id: { examples: ["Apartemen saya sama besarnya dengan apartemen kamu.", "Teh tidak sekuat kopi."] }, vi: { examples: ["Căn hộ của tôi lớn bằng căn hộ của bạn.", "Trà không đậm bằng cà phê."] } } }
