              pl: ["Niektóre przymiotniki dwusylabowe mają obie formy: ", { mapping: [{ term: "clever" }, { alternatives: [{ term: "cleverer" }, { term: "more clever" }] }] }, "."]
              tr: ["Bazı iki heceli sıfatlar iki biçimi de alır: ", { mapping: [{ term: "clever" }, { alternatives: [{ term: "cleverer" }, { term: "more clever" }] }] }, "."]
