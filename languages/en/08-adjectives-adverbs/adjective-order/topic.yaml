        - { level: B2, point: { pattern: [the, { slot: adjective }] }, rule: { en: "names a whole group and takes a plural verb", uk: "називає цілу групу й вимагає дієслова у множині", es: "nombra a todo un grupo y lleva el verbo en plural", pt: "nomeia um grupo inteiro e leva o verbo no plural", fr: "désigne tout un groupe et prend un verbe au pluriel", de: "bezeichnet eine ganze Gruppe und hat ein Verb im Plural", it: "indica un intero gruppo e vuole il verbo al plurale", pl: "oznacza całą grupę i łączy się z czasownikiem w liczbie mnogiej", tr: "bütün bir grubu adlandırır ve çoğul fiil alır", id: "menyebut satu kelompok utuh dan memakai kata kerja jamak", vi: "chỉ cả một nhóm người và đi với động từ số nhiều" }, ex: ["The ", { target: rich }, " are not always happy."], tr: { uk: "Багаті не завжди щасливі.", es: "Los ricos no siempre son felices.", pt: "Os ricos nem sempre são felizes.", fr: "Les riches ne sont pas toujours heureux.", de: "Die Reichen sind nicht immer glücklich.", it: "I ricchi non sono sempre felici.", pl: "Bogaci nie zawsze są szczęśliwi.", tr: "Zenginler her zaman mutlu değildir.", id: "Orang kaya tidak selalu bahagia.", vi: "Người giàu không phải lúc nào cũng hạnh phúc." } }
