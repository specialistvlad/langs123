, fr: "Tu as l’air fatigué.", de: "Du siehst müde aus.", it: "Sembri stanco.", pl: "Wyglądasz na zmęczonego.", tr: "Yorgun görünüyorsun.", id: "Kamu kelihatan lelah.", vi: "Trông bạn mệt mỏi." } }
