            level: A2
            text:
              en: "Opinion comes first, material and purpose come last:"
              uk: "Спочатку йде оцінка, а матеріал і призначення — в кінці:"
              es: "La opinión va primero; el material y el propósito van al final:"
              pt: "A opinião vem primeiro; o material e a finalidade vêm por último:"
              fr: "L’opinion vient en premier, la matière et l’usage viennent en dernier :"
              de: "Die Meinung steht zuerst, Material und Zweck stehen zuletzt:"
              it: "L'opinione viene per prima; materiale e scopo vengono per ultimi:"
              pl: "Opinia stoi na początku, a materiał i przeznaczenie — na końcu:"
              tr: "Görüş önce gelir, malzeme ve amaç en sona gelir:"
              id: "Pendapat diletakkan pertama, bahan dan tujuan terakhir:"
              vi: "Nhận xét đứng đầu, chất liệu và mục đích đứng cuối:"
            ex: ["a ", { target: nice old wooden }, " chair"]
            tr: { uk: "гарний старий дерев’яний стілець", es: "una bonita silla vieja de madera", pt: "uma bela cadeira velha de madeira", fr: "une jolie vieille chaise en bois", de: "ein schöner alter Holzstuhl", it: "una bella sedia vecchia di legno", pl: "ładne stare drewniane krzesło", tr: "güzel eski tahta bir sandalye", id: "kursi kayu tua yang bagus", vi: "một chiếc ghế gỗ cũ đẹp" }
          - type: rule
            level: A2
            text:
              en: "Most phrases use two or three adjectives:"
              uk: "У більшості словосполучень два-три прикметники:"
              es: "La mayoría de las frases usan dos o tres adjetivos:"
              pt: "A maioria das expressões usa dois ou três adjetivos:"
              fr: "La plupart des groupes de mots emploient deux ou trois adjectifs :"
              de: "Die meisten Wendungen haben zwei oder drei Adjektive:"
              it: "La maggior parte dei gruppi usa due o tre aggettivi:"
              pl: "Większość fraz zawiera dwa lub trzy przymiotniki:"
              tr: "Çoğu öbek iki ya da üç sıfat kullanır:"
              id: "Sebagian besar frasa memakai dua atau tiga kata sifat:"
              vi: "Hầu hết các cụm dùng hai hoặc ba tính từ:"
            ex: { examples: [["a ", { target: small black }, " cat"], [{ target: long dark }, " hair"]] }
            tr: { uk: { examples: ["маленький чорний кіт", "довге темне волосся"] }, es: { examples: ["un gato pequeño y negro", "pelo largo y oscuro"] }, pt: { examples: ["um gato pequeno e preto", "cabelo longo e escuro"] }, fr: { examples: ["un petit chat noir", "de longs cheveux foncés"] }, de: { examples: ["eine kleine schwarze Katze", "langes dunkles Haar"] }, it: { examples: ["un gatto piccolo e nero", "capelli lunghi e scuri"] }, pl: { examples: ["mały czarny kot", "długie ciemne włosy"] }, tr: { examples: ["küçük siyah bir kedi", "uzun koyu saç"] }, id: { examples: ["kucing hitam kecil", "rambut panjang berwarna gelap"] }, vi: { examples: ["một con mèo đen nhỏ", "mái tóc dài đen"] } }
          - type: rule
            level: A2
