title: { en: Adjectives and Adjective Order, uk: Прикметники та їхній порядок, es: Los adjetivos y su orden, pt: "Os adjetivos e sua ordem", fr: "Adjectifs et ordre des adjectifs", de: "Adjektive und ihre Reihenfolge", it: "Gli aggettivi e il loro ordine", pl: "Przymiotniki i ich kolejność", tr: "Sıfatlar ve sıfat sırası", id: "Kata sifat dan urutannya", vi: "Tính từ và trật tự của tính từ" }
summary:
  lead:
    en: "Where adjectives go, their fixed order, and -ed and -ing adjectives."
    uk: "Місце прикметників, їхній сталий порядок і прикметники на -ed та -ing."
    es: "Dónde van los adjetivos, su orden fijo y los adjetivos en -ed y -ing."
    pt: "Onde ficam os adjetivos, sua ordem fixa e os adjetivos em -ed e -ing."
    fr: "Où se placent les adjectifs, leur ordre fixe, et les adjectifs en -ed et -ing."
    de: "Wo Adjektive stehen, ihre feste Reihenfolge und die Adjektive auf -ed und -ing."
    it: "Dove vanno gli aggettivi, il loro ordine fisso e gli aggettivi in -ed e in -ing."
    pl: "Miejsce przymiotników, ich stała kolejność oraz przymiotniki na -ed i -ing."
    tr: "Sıfatların yeri, sabit sıraları ve -ed ile -ing ile biten sıfatlar."
    id: "Posisi kata sifat, urutannya yang tetap, serta kata sifat berakhiran -ed dan -ing."
    vi: "Vị trí của tính từ, thứ tự cố định của chúng, và tính từ đuôi -ed và -ing."
  rule:
    en: "Adjectives go before a noun, take no plural -s, and put size before colour and age before material:"
    uk: "Прикметники стоять перед іменником, не набувають -s у множині, а розмір ставлять перед кольором і вік — перед матеріалом:"
    es: "Los adjetivos van delante del sustantivo, no toman -s de plural y colocan el tamaño antes que el color y la edad antes que el material:"
    pt: "Os adjetivos vêm antes do substantivo, não recebem -s de plural e colocam o tamanho antes da cor e a idade antes do material:"
    fr: "Les adjectifs se placent devant un nom, ne prennent pas de -s au pluriel, et mettent la taille avant la couleur et l’âge avant la matière :"
    de: "Adjektive stehen vor dem Nomen, bekommen kein Plural-s und setzen die Größe vor die Farbe und das Alter vor das Material:"
    it: "Gli aggettivi vanno prima del sostantivo, non prendono la -s del plurale e mettono la dimensione prima del colore e l'età prima del materiale:"
    pl: "Przymiotniki stoją przed rzeczownikiem, nie przyjmują -s w liczbie mnogiej, a rozmiar stawia się przed kolorem, wiek zaś — przed materiałem:"
    tr: "Sıfatlar ismin önünde yer alır, çoğul -s almaz; boyut renkten, yaş da malzemeden önce gelir:"
    id: "Kata sifat diletakkan sebelum kata benda, tidak menerima -s jamak, dan menempatkan ukuran sebelum warna serta usia sebelum bahan:"
    vi: "Tính từ đứng trước danh từ, không thêm -s ở số nhiều, và xếp kích thước trước màu sắc, tuổi trước chất liệu:"
  ex: { examples: [["a ", { target: big red }, " bag"], ["an ", { target: old wooden }, " table."]] }

