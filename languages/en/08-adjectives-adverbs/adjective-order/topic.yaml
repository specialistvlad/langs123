          - { level: A1, position: { en: before a plural noun, uk: "перед іменником у множині", es: "delante de un sustantivo en plural", pt: "antes de um substantivo no plural", fr: "devant un nom pluriel", de: "vor einem Nomen im Plural", it: "prima di un sostantivo plurale", pl: "przed rzeczownikiem w liczbie mnogiej", tr: "çoğul ismin önünde", id: "sebelum kata benda jamak", vi: "trước danh từ số nhiều" }, pattern: { pattern: [{ slot: adjective }, { slot: plural noun }] }, ex: ["I like ", { target: old }, " films."], tr: { uk: "Я люблю старі фільми.", es: "Me gustan las películas antiguas.", pt: "Gosto de filmes antigos.", fr: "J’aime les vieux films.", de: "Ich mag alte Filme.", it: "Mi piacciono i vecchi film.", pl: "Lubię stare filmy.", tr: "Eski filmleri severim.", id: "Saya suka film lama.", vi: "Tôi thích những bộ phim cũ." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "An adjective has one form for singular and plural, masculine and feminine."
              uk: "Прикметник має одну форму для однини й множини, чоловічого й жіночого роду."
              es: "El adjetivo tiene una sola forma para singular y plural, masculino y femenino."
              pt: "O adjetivo tem uma só forma para singular e plural, masculino e feminino."
              fr: "L’adjectif a une seule forme au singulier et au pluriel, au masculin et au féminin."
              de: "Ein Adjektiv hat eine Form für Singular und Plural, Maskulinum und Femininum."
              it: "L'aggettivo ha una sola forma per singolare e plurale, maschile e femminile."
              pl: "Przymiotnik angielski ma jedną formę dla liczby pojedynczej i mnogiej oraz dla rodzaju męskiego i żeńskiego."
              tr: "Sıfatın tekil ve çoğul, eril ve dişil için tek bir biçimi vardır."
              id: "Kata sifat memiliki satu bentuk untuk tunggal dan jamak, maskulin dan feminin."
              vi: "Tính từ chỉ có một dạng cho số ít và số nhiều, giống đực và giống cái."

