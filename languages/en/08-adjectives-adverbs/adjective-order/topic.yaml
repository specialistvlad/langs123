            text: { en: "After the verb the same words stand apart, with no hyphens.", uk: "Після дієслова ті самі слова стоять окремо, без дефісів.", es: "Después del verbo las mismas palabras van separadas, sin guiones.", pt: "Depois do verbo as mesmas palavras ficam separadas, sem hífens.", fr: "Après le verbe, les mêmes mots restent séparés, sans traits d’union.", de: "Nach dem Verb stehen dieselben Wörter getrennt, ohne Bindestriche.", it: "Dopo il verbo le stesse parole stanno separate, senza trattini.", pl: "Po czasowniku te same wyrazy stoją osobno, bez łączników.", tr: "Fiilden sonra aynı sözcükler ayrı durur, tire kullanılmaz.", id: "Setelah kata kerja, kata-kata yang sama berdiri terpisah, tanpa tanda hubung.", vi: "Sau động từ, những từ đó đứng riêng, không có gạch nối." }
