        - { level: A2, point: { alternatives: ["-ed", "-ing"] }, rule: { en: "-ed: how a person feels; -ing: what causes it", uk: "-ed: як почувається людина; -ing: що це викликає", es: "-ed: cómo se siente una persona; -ing: lo que lo causa", pt: "-ed: como uma pessoa se sente; -ing: o que causa isso", fr: "-ed : ce que ressent une personne ; -ing : ce qui le provoque", de: "-ed: wie sich eine Person fühlt; -ing: was das Gefühl auslöst", it: "-ed: come si sente una persona; -ing: ciò che lo causa", pl: "-ed: jak czuje się osoba; -ing: co to uczucie wywołuje", tr: "-ed: kişinin nasıl hissettiği; -ing: buna neyin yol açtığı", id: "-ed: bagaimana perasaan seseorang; -ing: penyebab perasaan itu", vi: "-ed: cảm giác của một người; -ing: điều gây ra cảm giác đó" }, ex: { examples: [["I'm ", { target: bored }, "."], ["The film is ", { target: boring }, "."]] }, tr: { uk: { examples: ["Мені нудно.", "Фільм нудний."] }, es: { examples: ["Estoy aburrido.", "La película es aburrida."] }, pt: { examples: ["Estou entediado.", "O filme é entediante."] }, fr: { examples: ["Je m’ennuie.", "Le film est ennuyeux."] }, de: { examples: ["Mir ist langweilig.", "Der Film ist langweilig."] }, it: { examples: ["Sono annoiato.", "Il film è noioso."] }, pl: { examples: ["Nudzę się.", "Film jest nudny."] }, tr: { examples: ["Sıkıldım.", "Film sıkıcı."] }, id: { examples: ["Saya bosan.", "Filmnya membosankan."] }, vi: { examples: ["Tôi thấy chán.", "Bộ phim rất chán."] } } }
