          - { level: C1, modifier: { en: hyphenated phrase, uk: "словосполучення з дефісами", es: "grupo de palabras con guiones", pt: "expressão com hífens", fr: "groupe de mots avec traits d’union", de: "Wortgruppe mit Bindestrichen", it: "gruppo di parole con trattini", pl: "wyrażenie z łącznikami", tr: "tireli öbek", id: "frasa bertanda hubung", vi: "cụm từ có gạch nối" }, rule: { en: "hyphens make the words of a phrase one adjective", uk: "дефіси перетворюють слова словосполучення на один прикметник", es: "los guiones convierten las palabras del grupo en un solo adjetivo", pt: "os hífens transformam as palavras da expressão em um só adjetivo", fr: "les traits d’union font des mots du groupe un seul adjectif", de: "Bindestriche machen die Wörter der Wortgruppe zu einem Adjektiv", it: "i trattini fanno delle parole del gruppo un solo aggettivo", pl: "łączniki zamieniają wyrazy wyrażenia w jeden przymiotnik", tr: "tireler öbeğin sözcüklerini tek bir sıfata dönüştürür", id: "tanda hubung menjadikan kata-kata dalam frasa itu satu kata sifat", vi: "gạch nối biến các từ trong cụm thành một tính từ" }, ex: { examples: [["an ", { target: easy-to-use }, " app"], ["a ", { target: bigger-than-expected }, " profit"]] }, tr: { uk: { examples: ["простий у користуванні додаток", "прибуток, більший за очікуваний"] }, es: { examples: ["una aplicación fácil de usar", "una ganancia mayor de lo esperado"] }, pt: { examples: ["um aplicativo fácil de usar", "um lucro maior que o esperado"] }, fr: { examples: ["une application facile à utiliser", "un bénéfice supérieur aux attentes"] }, de: { examples: ["eine einfach zu bedienende App", "ein höherer Gewinn als erwartet"] }, it: { examples: ["un'app facile da usare", "un profitto superiore al previsto"] }, pl: { examples: ["łatwa w obsłudze aplikacja", "zysk większy od oczekiwanego"] }, tr: { examples: ["kullanımı kolay bir uygulama", "beklenenden büyük bir kâr"] }, id: { examples: ["aplikasi yang mudah digunakan", "keuntungan yang lebih besar dari perkiraan"] }, vi: { examples: ["một ứng dụng dễ sử dụng", "một khoản lợi nhuận cao hơn dự kiến"] } } }
      - type: list
