          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, type: { en: coordinate, uk: "рівноправні", es: "coordinados", pt: "coordenados", fr: "coordonnés", de: "gleichrangig", it: "coordinati", pl: "współrzędne", tr: "eş değerli", id: "setara", vi: "đẳng lập" }, rule: { en: ["each adjective describes the noun alone; a comma or ", { term: and }, " joins them"], uk: ["кожен прикметник описує іменник окремо; їх сполучає кома або ", { term: "and" }], es: ["cada adjetivo describe el sustantivo por separado; los une una coma o ", { term: "and" }], pt: ["cada adjetivo descreve o substantivo sozinho; uma vírgula ou ", { term: "and" }, " os une"], fr: ["chaque adjectif décrit le nom seul ; une virgule ou ", { term: "and" }, " les relie"], de: ["jedes Adjektiv beschreibt das Nomen für sich; ein Komma oder ", { term: "and" }, " verbindet sie"], it: ["ogni aggettivo descrive il sostantivo da solo; una virgola o ", { term: "and" }, " li unisce"], pl: ["każdy przymiotnik opisuje rzeczownik osobno; łączy je przecinek lub ", { term: "and" }], tr: ["her sıfat ismi tek başına niteler; bunları virgül veya ", { term: "and" }, " bağlar"], id: ["setiap kata sifat menggambarkan kata benda secara sendiri-sendiri; koma atau ", { term: "and" }, " menghubungkannya"], vi: ["mỗi tính từ mô tả danh từ riêng rẽ; dấu phẩy hoặc ", { term: "and" }, " nối chúng"] }, ex: { examples: [["a ", { target: "long, dark" }, " corridor"], ["a ", { target: long and dark }, " corridor"]] }, tr: { uk: { examples: ["довгий темний коридор", "довгий і темний коридор"] }, es: { examples: ["un pasillo largo, oscuro", "un pasillo largo y oscuro"] }, pt: { examples: ["um corredor longo, escuro", "um corredor longo e escuro"] }, fr: { examples: ["un couloir long, sombre", "un couloir long et sombre"] }, de: { examples: ["ein langer, dunkler Flur", "ein langer und dunkler Flur"] }, it: { examples: ["un corridoio lungo, buio", "un corridoio lungo e buio"] }, pl: { examples: ["długi, ciemny korytarz", "długi i ciemny korytarz"] }, tr: { examples: ["uzun, karanlık bir koridor", "uzun ve karanlık bir koridor"] }, id: { examples: ["koridor yang panjang, gelap", "koridor yang panjang dan gelap"] }, vi: { examples: ["một hành lang dài, tối", "một hành lang dài và tối"] } } }
          - { level: B2, type: { en: cumulative, uk: "кумулятивні", es: "acumulativos", pt: "cumulativos", fr: "cumulatifs", de: "kumulativ", it: "cumulativi", pl: "kumulatywne", tr: "birikimli", id: "kumulatif", vi: "tích lũy" }, rule: { en: "each adjective describes the group after it; no comma, fixed order", uk: "кожен прикметник описує групу слів після нього; коми немає, порядок сталий", es: "cada adjetivo describe el grupo que sigue; sin coma, con orden fijo", pt: "cada adjetivo descreve o grupo que vem depois; sem vírgula, com ordem fixa", fr: "chaque adjectif décrit le groupe qui suit ; pas de virgule, ordre fixe", de: "jedes Adjektiv beschreibt die folgende Gruppe; kein Komma, feste Reihenfolge", it: "ogni aggettivo descrive il gruppo che segue; niente virgola, ordine fisso", pl: "każdy przymiotnik opisuje następującą po nim grupę; bez przecinka, stała kolejność", tr: "her sıfat kendisinden sonraki öbeği niteler; virgül yok, sıra sabit", id: "setiap kata sifat menggambarkan kelompok kata setelahnya; tanpa koma, urutan tetap", vi: "mỗi tính từ mô tả cụm đứng sau nó; không có dấu phẩy, thứ tự cố định" }, ex: ["a ", { target: lovely old }, " house"], tr: { uk: "чудовий старий будинок", es: "una hermosa casa antigua", pt: "uma bela casa antiga", fr: "une belle vieille maison", de: "ein schönes altes Haus", it: "una bella vecchia casa", pl: "piękny stary dom", tr: "güzel eski bir ev", id: "rumah tua yang indah", vi: "một ngôi nhà cũ đẹp" } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "Coordinate adjectives can change places; cumulative adjectives cannot.", uk: "Рівноправні прикметники можна міняти місцями; кумулятивні — не можна.", es: "Los adjetivos coordinados pueden cambiar de lugar; los acumulativos no.", pt: "Os adjetivos coordenados podem trocar de lugar; os cumulativos não.", fr: "Les adjectifs coordonnés peuvent changer de place ; les adjectifs cumulatifs, non.", de: "Gleichrangige Adjektive können die Plätze tauschen; kumulative nicht.", it: "Gli aggettivi coordinati possono cambiare posto; quelli cumulativi no.", pl: "Przymiotniki współrzędne mogą zamieniać się miejscami; kumulatywne nie mogą.", tr: "Eş değerli sıfatlar yer değiştirebilir; birikimli sıfatlar değiştiremez.", id: "Kata sifat setara dapat bertukar tempat; kata sifat kumulatif tidak dapat.", vi: "Các tính từ đẳng lập có thể đổi chỗ; các tính từ tích lũy thì không." }
