          - { level: A2, pair: { alternatives: [interested, interesting] }, ed: { ex: ["She's ", { target: interested }, " in art."], tr: { uk: "Вона цікавиться мистецтвом.", es: "Ella está interesada en el arte.", pt: "Ela está interessada em arte.", fr: "Elle s’intéresse à l’art.", de: "Sie interessiert sich für Kunst.", it: "Lei è interessata all'arte.", pl: "Ona interesuje się sztuką.", tr: "Sanata ilgi duyuyor.", id: "Dia tertarik pada seni.", vi: "Cô ấy quan tâm đến nghệ thuật." } }, ing: { ex: ["The book is ", { target: interesting }, "."], tr: { uk: "Книжка цікава.", es: "El libro es interesante.", pt: "O livro é interessante.", fr: "Le livre est intéressant.", de: "Das Buch ist interessant.", it: "Il libro è interessante.", pl: "Książka jest interesująca.", tr: "Kitap ilginç.", id: "Bukunya menarik.", vi: "Cuốn sách này thú vị." } } }
          - { level: A2, pair: { alternatives: [excited, exciting] }, ed: { ex: ["We're ", { target: excited }, "."], tr: { uk: "Ми в захваті.", es: "Estamos emocionados.", pt: "Estamos empolgados.", fr: "Nous sommes enthousiastes.", de: "Wir sind aufgeregt.", it: "Siamo emozionati.", pl: "Jesteśmy podekscytowani.", tr: "Çok heyecanlıyız.", id: "Kami bersemangat.", vi: "Chúng tôi rất hào hứng." } }, ing: { ex: ["The game is ", { target: exciting }, "."], tr: { uk: "Гра захоплива.", es: "El juego es emocionante.", pt: "O jogo é empolgante.", fr: "Le jeu est passionnant.", de: "Das Spiel ist aufregend.", it: "La partita è emozionante.", pl: "Gra jest ekscytująca.", tr: "Oyun heyecan verici.", id: "Permainannya seru.", vi: "Trận đấu rất hấp dẫn." } } }
          - { level: A2, pair: { alternatives: [tired, tiring] }, ed: { ex: ["I'm ", { target: tired }, "."], tr: { uk: "Я втомився.", es: "Estoy cansado.", pt: "Estou cansado.", fr: "Je suis fatigué.", de: "Ich bin müde.", it: "Sono stanco.", pl: "Jestem zmęczony.", tr: "Yorgunum.", id: "Saya lelah.", vi: "Tôi mệt." } }, ing: { ex: ["The job is ", { target: tiring }, "."], tr: { uk: "Ця робота втомлива.", es: "El trabajo es agotador.", pt: "O trabalho é cansativo.", fr: "Le travail est fatigant.", de: "Die Arbeit ist anstrengend.", it: "Il lavoro è stancante.", pl: "Ta praca jest męcząca.", tr: "İş yorucu.", id: "Pekerjaan ini melelahkan.", vi: "Công việc này rất mệt." } } }
          - { level: A2, pair: { alternatives: [surprised, surprising] }, ed: { ex: ["He's ", { target: surprised }, "."], tr: { uk: "Він здивований.", es: "Está sorprendido.", pt: "Ele está surpreso.", fr: "Il est surpris.", de: "Er ist überrascht.", it: "È sorpreso.", pl: "Jest zaskoczony.", tr: "Şaşırmış.", id: "Dia terkejut.", vi: "Anh ấy ngạc nhiên." } }, ing: { ex: ["The news is ", { target: surprising }, "."], tr: { uk: "Ця новина несподівана.", es: "La noticia es sorprendente.", pt: "A notícia é surpreendente.", fr: "La nouvelle est surprenante.", de: "Die Nachricht ist überraschend.", it: "La notizia è sorprendente.", pl: "Ta wiadomość jest zaskakująca.", tr: "Haber şaşırtıcı.", id: "Beritanya mengejutkan.", vi: "Tin này gây ngạc nhiên." } } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "-ed describes how a person feels; -ing describes the person or thing that causes the feeling."
              uk: "-ed описує, як почувається людина; -ing описує людину чи річ, що викликає це почуття."
              es: "-ed describe cómo se siente una persona; -ing describe a la persona o la cosa que causa esa sensación."
              pt: "-ed descreve como uma pessoa se sente; -ing descreve a pessoa ou a coisa que causa essa sensação."
              fr: "-ed décrit ce que ressent une personne ; -ing décrit la personne ou la chose qui provoque le sentiment."
              de: "-ed beschreibt, wie sich eine Person fühlt; -ing beschreibt die Person oder Sache, die das Gefühl auslöst."
              it: "-ed descrive come si sente una persona; -ing descrive la persona o la cosa che causa la sensazione."
              pl: "-ed opisuje, jak czuje się osoba; -ing opisuje osobę lub rzecz, która wywołuje to uczucie."
              tr: "-ed kişinin nasıl hissettiğini anlatır; -ing duyguya yol açan kişiyi ya da şeyi anlatır."
              id: "-ed menggambarkan bagaimana perasaan seseorang; -ing menggambarkan orang atau benda yang menyebabkan perasaan itu."
              vi: "-ed mô tả cảm giác của một người; -ing mô tả người hoặc vật gây ra cảm giác đó."

