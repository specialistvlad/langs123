          - { level: B2, form: { examples: [the French, the British, the Spanish, the Dutch] }, meaning: { en: "the people of a nation, from an adjective in -sh, -ch or -ese; plural verb", uk: "народ країни, від прикметника на -sh, -ch або -ese; дієслово у множині", es: "los habitantes de un país, a partir de un adjetivo en -sh, -ch o -ese; verbo en plural", pt: "o povo de uma nação, a partir de um adjetivo em -sh, -ch ou -ese; verbo no plural", fr: "les habitants d’un pays, formés sur un adjectif en -sh, -ch ou -ese ; verbe au pluriel", de: "die Menschen eines Landes, von einem Adjektiv auf -sh, -ch oder -ese; Verb im Plural", it: "il popolo di una nazione, da un aggettivo in -sh, -ch o -ese; verbo al plurale", pl: "mieszkańcy kraju, od przymiotnika na -sh, -ch lub -ese; czasownik w liczbie mnogiej", tr: "bir ulusun halkı, -sh, -ch veya -ese ile biten bir sıfattan; çoğul fiil", id: "penduduk suatu negara, dari kata sifat berakhiran -sh, -ch, atau -ese; kata kerja jamak", vi: "người dân của một quốc gia, từ tính từ đuôi -sh, -ch hoặc -ese; động từ số nhiều" }, ex: ["The ", { target: Dutch }, " cycle to work."], tr: { uk: "Голландці їздять на роботу на велосипедах.", es: "Los holandeses van al trabajo en bicicleta.", pt: "Os holandeses vão de bicicleta para o trabalho.", fr: "Les Néerlandais vont au travail à vélo.", de: "Die Niederländer fahren mit dem Fahrrad zur Arbeit.", it: "Gli olandesi vanno al lavoro in bicicletta.", pl: "Holendrzy jeżdżą do pracy na rowerze.", tr: "Hollandalılar işe bisikletle gider.", id: "Orang Belanda bersepeda ke tempat kerja.", vi: "Người Hà Lan đạp xe đi làm." } }
          - { level: B2, form: { pattern: [a, { slot: adjective }, { alternatives: [man, woman, person] }] }, meaning: { en: "one person of the group", uk: "одна людина з цієї групи", es: "una persona del grupo", pt: "uma pessoa do grupo", fr: "une personne du groupe", de: "eine Person aus der Gruppe", it: "una persona del gruppo", pl: "jedna osoba z tej grupy", tr: "gruptan bir kişi", id: "satu orang dari kelompok itu", vi: "một người trong nhóm" }, ex: { examples: [["an ", { target: unemployed }, " man"], ["a ", { target: Japanese }, " woman"]] }, tr: { uk: { examples: ["безробітний чоловік", "японка"] }, es: { examples: ["un hombre desempleado", "una mujer japonesa"] }, pt: { examples: ["um homem desempregado", "uma mulher japonesa"] }, fr: { examples: ["un homme au chômage", "une femme japonaise"] }, de: { examples: ["ein arbeitsloser Mann", "eine japanische Frau"] }, it: { examples: ["un uomo disoccupato", "una donna giapponese"] }, pl: { examples: ["bezrobotny mężczyzna", "japońska kobieta"] }, tr: { examples: ["işsiz bir adam", "Japon bir kadın"] }, id: { examples: ["pria yang menganggur", "wanita Jepang"] }, vi: { examples: ["một người đàn ông thất nghiệp", "một phụ nữ Nhật"] } } }
          - { level: B2, form: { examples: [a Briton, a Spaniard, a Frenchman] }, meaning: { en: "one person, where the nation has a noun of its own", uk: "одна людина, якщо для країни є власний іменник", es: "una persona, cuando la nación tiene un sustantivo propio", pt: "uma pessoa, quando a nação tem um substantivo próprio", fr: "une personne, quand la nation a un nom à elle", de: "eine Person, wenn die Nation ein eigenes Nomen hat", it: "una persona, quando la nazione ha un sostantivo proprio", pl: "jedna osoba, gdy dla narodu istnieje osobny rzeczownik", tr: "bir kişi; ulusun kendine ait bir ismi varsa", id: "satu orang, jika bangsa itu punya kata benda sendiri", vi: "một người, khi quốc gia đó có danh từ riêng" }, ex: [{ target: A Spaniard }, " sat next to me."], tr: { uk: "Поруч зі мною сидів іспанець.", es: "Un español se sentó a mi lado.", pt: "Um espanhol sentou ao meu lado.", fr: "Un Espagnol s’est assis à côté de moi.", de: "Ein Spanier saß neben mir.", it: "Uno spagnolo era seduto accanto a me.", pl: "Obok mnie siedział Hiszpan.", tr: "Yanımda bir İspanyol oturuyordu.", id: "Seorang Spanyol duduk di sebelah saya.", vi: "Một người Tây Ban Nha ngồi cạnh tôi." } }

  - title: { en: Adjective with a complement, uk: "Прикметник із доповненням", es: "Adjetivo con complemento", pt: "Adjetivo com complemento", fr: "Adjectif avec complément", de: "Adjektiv mit Ergänzung", it: "Aggettivo con complemento", pl: "Przymiotnik z uzupełnieniem", tr: "Tümleçli sıfat", id: "Kata sifat dengan pelengkap", vi: "Tính từ với bổ ngữ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: words, label: { en: Typical adjectives, uk: "Типові прикметники", es: "Adjetivos típicos", pt: "Adjetivos típicos", fr: "Adjectifs typiques", de: "Typische Adjektive", it: "Aggettivi tipici", pl: "Typowe przymiotniki", tr: "Tipik sıfatlar", id: "Kata sifat yang umum", vi: "Tính từ thường gặp" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, pattern: { pattern: [{ slot: adjective }, to, { slot: V }] }, words: { examples: [easy, hard, ready, glad, likely] }, ex: { examples: [["The app is ", { target: easy to use }, "."], ["We are ", { target: ready to go }, "."]] }, tr: { uk: { examples: ["Додаток простий у користуванні.", "Ми готові йти."] }, es: { examples: ["La aplicación es fácil de usar.", "Estamos listos para irnos."] }, pt: { examples: ["O aplicativo é fácil de usar.", "Estamos prontos para ir."] }, fr: { examples: ["L’application est facile à utiliser.", "Nous sommes prêts à partir."] }, de: { examples: ["Die App ist einfach zu bedienen.", "Wir sind bereit zu gehen."] }, it: { examples: ["L'app è facile da usare.", "Siamo pronti ad andare."] }, pl: { examples: ["Aplikacja jest łatwa w obsłudze.", "Jesteśmy gotowi do wyjścia."] }, tr: { examples: ["Uygulamanın kullanımı kolay.", "Gitmeye hazırız."] }, id: { examples: ["Aplikasinya mudah digunakan.", "Kami siap berangkat."] }, vi: { examples: ["Ứng dụng này dễ sử dụng.", "Chúng tôi sẵn sàng đi."] } } }
          - { level: B2, pattern: { pattern: [{ slot: adjective }, { optional: that }, { slot: clause }] }, words: { examples: [afraid, sure, glad, aware, certain] }, ex: ["I am ", { target: afraid that }, " we are late."], tr: { uk: "Боюся, що ми запізнюємося.", es: "Me temo que llegamos tarde.", pt: "Receio que estejamos atrasados.", fr: "Je crains que nous soyons en retard.", de: "Ich fürchte, wir sind zu spät.", it: "Temo che siamo in ritardo.", pl: "Obawiam się, że się spóźniamy.", tr: "Korkarım geç kaldık.", id: "Saya khawatir kita terlambat.", vi: "Tôi e là chúng ta bị muộn." } }
          - { level: B2, pattern: { pattern: [{ slot: adjective }, { slot: V-ing }] }, words: { examples: [busy, worth] }, ex: { examples: [["She is ", { target: busy packing }, "."], ["The film is ", { target: worth seeing }, "."]] }, tr: { uk: { examples: ["Вона зайнята пакуванням речей.", "Цей фільм вартий перегляду."] }, es: { examples: ["Está ocupada haciendo las maletas.", "La película vale la pena."] }, pt: { examples: ["Ela está ocupada fazendo as malas.", "O filme vale a pena."] }, fr: { examples: ["Elle est occupée à faire ses valises.", "Le film vaut la peine d’être vu."] }, de: { examples: ["Sie ist damit beschäftigt, zu packen.", "Der Film ist sehenswert."] }, it: { examples: ["È occupata a fare le valigie.", "Il film vale la pena di essere visto."] }, pl: { examples: ["Jest zajęta pakowaniem.", "Ten film warto zobaczyć."] }, tr: { examples: ["Valiz hazırlamakla meşgul.", "Film izlemeye değer."] }, id: { examples: ["Dia sibuk berkemas.", "Film itu layak ditonton."] }, vi: { examples: ["Cô ấy đang bận thu dọn đồ.", "Bộ phim này đáng xem."] } } }
          - { level: B2, pattern: { pattern: [It is, { slot: adjective }, of, { slot: person }, to, { slot: V }] }, words: { examples: [kind, good, silly, rude, clever] }, ex: ["It is ", { target: kind of you to help }, "."], tr: { uk: "Дуже мило з твого боку, що допомагаєш.", es: "Es amable de tu parte ayudar.", pt: "É gentil da sua parte ajudar.", fr: "C’est gentil de ta part d’aider.", de: "Es ist nett von dir, dass du hilfst.", it: "È gentile da parte tua aiutare.", pl: "To miło z twojej strony, że pomagasz.", tr: "Yardım etmen çok nazik bir davranış.", id: "Baik sekali kamu mau membantu.", vi: "Bạn thật tốt bụng khi giúp đỡ." } }
          - { level: B2, pattern: { pattern: [It is, { slot: adjective }, for, { slot: person }, to, { slot: V }] }, words: { examples: [easy, hard, important, necessary, possible] }, ex: ["It is ", { target: important for you to rest }, "."], tr: { uk: "Тобі важливо відпочивати.", es: "Es importante que descanses.", pt: "É importante você descansar.", fr: "Il est important que tu te reposes.", de: "Es ist wichtig, dass du dich ausruhst.", it: "È importante che tu riposi.", pl: "To ważne, żebyś odpoczął.", tr: "Dinlenmen önemli.", id: "Penting bagimu untuk beristirahat.", vi: "Việc bạn nghỉ ngơi là quan trọng." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: of }, " judges how a person behaves; ", { term: for }, " names the person the situation concerns."], uk: [{ term: "of" }, " оцінює поведінку людини; ", { term: "for" }, " називає людину, якої стосується ситуація."], es: [{ term: "of" }, " juzga cómo se comporta una persona; ", { term: "for" }, " nombra a la persona a la que afecta la situación."], pt: [{ term: "of" }, " julga como uma pessoa se comporta; ", { term: "for" }, " nomeia a pessoa a quem a situação diz respeito."], fr: [{ term: "of" }, " juge le comportement d’une personne ; ", { term: "for" }, " nomme la personne concernée par la situation."], de: [{ term: "of" }, " beurteilt das Verhalten einer Person; ", { term: "for" }, " nennt die Person, die die Situation betrifft."], it: [{ term: "of" }, " giudica come si comporta una persona; ", { term: "for" }, " indica la persona a cui riguarda la situazione."], pl: [{ term: "of" }, " ocenia zachowanie osoby; ", { term: "for" }, " wskazuje osobę, której dotyczy sytuacja."], tr: [{ term: "of" }, " kişinin davranışını değerlendirir; ", { term: "for" }, " durumun ilgilendirdiği kişiyi belirtir."], id: [{ term: "of" }, " menilai perilaku seseorang; ", { term: "for" }, " menyebut orang yang terkait dengan situasi itu."], vi: [{ term: "of" }, " đánh giá cách cư xử của một người; ", { term: "for" }, " chỉ người mà tình huống liên quan đến."] }
            ex: { examples: [["It was rude ", { target: of }, " him to leave."], ["It was hard ", { target: for }, " him to leave."]] }
            tr: { uk: { examples: ["Було грубо з його боку піти.", "Йому було важко піти."] }, es: { examples: ["Fue grosero de su parte irse.", "Le resultó difícil irse."] }, pt: { examples: ["Foi rude da parte dele ir embora.", "Foi difícil para ele ir embora."] }, fr: { examples: ["C’était impoli de sa part de partir.", "C’était difficile pour lui de partir."] }, de: { examples: ["Es war unhöflich von ihm, zu gehen.", "Es war schwer für ihn, zu gehen."] }, it: { examples: ["È stato maleducato da parte sua andarsene.", "È stato difficile per lui andarsene."] }, pl: { examples: ["To było niegrzeczne z jego strony, że wyszedł.", "Trudno mu było wyjść."] }, tr: { examples: ["Gitmesi kabalıktı.", "Onun için gitmek zordu."] }, id: { examples: ["Tidak sopan dia pergi begitu saja.", "Sulit baginya untuk pergi."] }, vi: { examples: ["Anh ấy bỏ đi như vậy là thô lỗ.", "Việc ra đi thật khó đối với anh ấy."] } }

  - title: { en: "Punctuation: commas between adjectives", uk: "Розділові знаки: коми між прикметниками", es: "Puntuación: comas entre adjetivos", pt: "Pontuação: vírgulas entre adjetivos", fr: "Ponctuation : virgules entre les adjectifs", de: "Zeichensetzung: Kommas zwischen Adjektiven", it: "Punteggiatura: virgole tra gli aggettivi", pl: "Interpunkcja: przecinki między przymiotnikami", tr: "Noktalama: sıfatlar arasındaki virgüller", id: "Tanda baca: koma di antara kata sifat", vi: "Dấu câu: dấu phẩy giữa các tính từ" }
    role: own
