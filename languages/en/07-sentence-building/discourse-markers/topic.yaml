        rows:
          - { level: C1, move: { en: "Asking for help", uk: "Прохання про допомогу", es: "Pedir ayuda", pt: "Pedir ajuda", fr: "Demander de l’aide", de: "Um Hilfe bitten", it: "Chiedere aiuto", pl: "Prośba o pomoc", tr: "Yardım istemek", id: "Meminta bantuan", vi: "Nhờ giúp đỡ" }, words: { alternatives: [["I was wondering if ", { gap: true }], ["I don't suppose you could ", { gap: true }]] }, ex: { examples: [[{ target: "I was wondering if" }, " you could help me."], [{ target: "I don't suppose you could" }, " lend me a pen?"]] }, tr: { uk: { examples: ["Я хотів запитати, чи не могли б ви мені допомогти.", "Ви, мабуть, не позичили б мені ручку?"] }, es: { examples: ["Me preguntaba si podría ayudarme.", "¿Por casualidad podría prestarme un bolígrafo?"] }, pt: { examples: ["Eu estava me perguntando se você poderia me ajudar.", "Será que você poderia me emprestar uma caneta?"] }, fr: { examples: ["Je me demandais si vous pourriez m’aider.", "Vous ne pourriez pas me prêter un stylo, par hasard ?"] }, de: { examples: ["Ich habe mich gefragt, ob Sie mir helfen könnten.", "Könnten Sie mir vielleicht einen Stift leihen?"] }, it: { examples: ["Mi chiedevo se potesse aiutarmi.", "Non è che potrebbe prestarmi una penna?"] }, pl: { examples: ["Zastanawiałem się, czy mógłby mi pan pomóc.", "Czy nie mógłby mi pan przypadkiem pożyczyć długopisu?"] }, tr: { examples: ["Bana yardım edebilir misiniz diye düşünüyordum.", "Acaba bana bir kalem ödünç verebilir misiniz?"] }, id: { examples: ["Saya ingin tahu apakah Anda bisa membantu saya.", "Mungkinkah Anda bisa meminjamkan saya sebuah pulpen?"] }, vi: { examples: ["Tôi đang tự hỏi liệu bạn có thể giúp tôi không.", "Không biết bạn có thể cho tôi mượn cây bút được không?"] } } }
          - { level: C1, move: { en: "Disagreeing", uk: "Незгода", es: "Discrepar", pt: "Discordar", fr: "Exprimer son désaccord", de: "Widersprechen", it: "Dissentire", pl: "Sprzeciw", tr: "Karşı çıkmak", id: "Tidak setuju", vi: "Phản đối" }, words: { alternatives: [["With all due respect, ", { gap: true }], ["I take your point, but ", { gap: true }]] }, ex: { examples: [[{ target: "With all due respect" }, ", I think the figures are wrong."], [{ target: "I take your point" }, ", but we have no time."]] }, tr: { uk: { examples: ["З усією повагою, я вважаю, що ці цифри неправильні.", "Я розумію вашу думку, але в нас немає часу."] }, es: { examples: ["Con el debido respeto, creo que las cifras están mal.", "Entiendo su punto, pero no tenemos tiempo."] }, pt: { examples: ["Com todo o respeito, acho que os números estão errados.", "Entendo o seu ponto, mas não temos tempo."] }, fr: { examples: ["Avec tout le respect que je vous dois, je pense que les chiffres sont faux.", "Je comprends votre point de vue, mais nous n’avons pas le temps."] }, de: { examples: ["Bei allem Respekt, ich halte die Zahlen für falsch.", "Ich verstehe Ihren Punkt, aber wir haben keine Zeit."] }, it: { examples: ["Con tutto il rispetto, credo che le cifre siano sbagliate.", "Capisco il suo punto di vista, ma non abbiamo tempo."] }, pl: { examples: ["Z całym szacunkiem, uważam, że te liczby są błędne.", "Rozumiem pański punkt widzenia, ale nie mamy czasu."] }, tr: { examples: ["Saygımla söylüyorum, rakamların yanlış olduğunu düşünüyorum.", "Söylediğinizi anlıyorum ama vaktimiz yok."] }, id: { examples: ["Dengan segala hormat, menurut saya angka-angkanya salah.", "Saya paham maksud Anda, tetapi kita tidak punya waktu."] }, vi: { examples: ["Với tất cả sự tôn trọng, tôi cho rằng các con số này sai.", "Tôi hiểu ý anh, nhưng chúng ta không có thời gian."] } } }
          - { level: C1, move: { en: "Refusing or giving bad news", uk: "Відмова або погана новина", es: "Rechazar o dar una mala noticia", pt: "Recusar ou dar uma má notícia", fr: "Refuser ou annoncer une mauvaise nouvelle", de: "Ablehnen oder eine schlechte Nachricht überbringen", it: "Rifiutare o dare una brutta notizia", pl: "Odmowa lub zła wiadomość", tr: "Reddetmek ya da kötü haber vermek", id: "Menolak atau menyampaikan kabar buruk", vi: "Từ chối hoặc báo tin xấu" }, words: { alternatives: [["Unfortunately, ", { gap: true }], ["I'm afraid ", { gap: true }]] }, ex: { examples: [[{ target: Unfortunately }, ", the post has been filled."], [{ target: "I'm afraid" }, " we are fully booked."]] }, tr: { uk: { examples: ["На жаль, цю посаду вже зайнято.", "Боюся, у нас усе заброньовано."] }, es: { examples: ["Lamentablemente, el puesto ya fue ocupado.", "Me temo que estamos completos."] }, pt: { examples: ["Infelizmente, a vaga já foi preenchida.", "Receio que estejamos com tudo reservado."] }, fr: { examples: ["Malheureusement, le poste a été pourvu.", "J’ai bien peur que nous soyons complets."] }, de: { examples: ["Leider ist die Stelle bereits besetzt.", "Wir sind leider ausgebucht."] }, it: { examples: ["Purtroppo il posto è stato assegnato.", "Temo che siamo al completo."] }, pl: { examples: ["Niestety stanowisko zostało już obsadzone.", "Obawiam się, że mamy komplet rezerwacji."] }, tr: { examples: ["Maalesef kadro doldu.", "Korkarım tamamen doluyuz."] }, id: { examples: ["Sayangnya, posisi itu sudah terisi.", "Mohon maaf, semua tempat sudah dipesan."] }, vi: { examples: ["Rất tiếc, vị trí này đã có người.", "Tôi e là chúng tôi đã kín chỗ."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["After ", { term: "I was wondering if" }, ", the clause keeps statement order and usually takes ", { term: could }, " or ", { term: would }, "."], uk: ["Після ", { term: "I was wondering if" }, " частина речення зберігає порядок слів розповідного речення і зазвичай має ", { term: "could" }, " або ", { term: "would" }, "."], es: ["Después de ", { term: "I was wondering if" }, ", la oración conserva el orden de una afirmación y suele llevar ", { term: "could" }, " o ", { term: "would" }, "."], pt: ["Depois de ", { term: "I was wondering if" }, ", a oração mantém a ordem de uma afirmação e costuma levar ", { term: "could" }, " ou ", { term: "would" }, "."], fr: ["Après ", { term: "I was wondering if" }, ", la proposition garde l’ordre d’une affirmation et prend en général ", { term: "could" }, " ou ", { term: "would" }, "."], de: ["Nach ", { term: "I was wondering if" }, " behält der Satz die Aussagestellung und steht meist mit ", { term: "could" }, " oder ", { term: "would" }, "."], it: ["Dopo ", { term: "I was wondering if" }, ", la proposizione mantiene l'ordine di un'affermazione e di solito prende ", { term: "could" }, " o ", { term: "would" }, "."], pl: ["Po ", { term: "I was wondering if" }, " zdanie zachowuje szyk oznajmujący i zwykle zawiera ", { term: "could" }, " lub ", { term: "would" }, "."], tr: [{ term: "I was wondering if" }, " ifadesinden sonra yan cümle düz cümle sırasını korur ve genellikle ", { term: "could" }, " ya da ", { term: "would" }, " alır."], id: ["Setelah ", { term: "I was wondering if" }, ", klausa tetap berurutan seperti kalimat pernyataan dan biasanya memakai ", { term: "could" }, " atau ", { term: "would" }, "."], vi: ["Sau ", { term: "I was wondering if" }, ", mệnh đề giữ trật tự của câu khẳng định và thường có ", { term: "could" }, " hoặc ", { term: "would" }, "."] }
            ex: ["I was wondering if you ", { target: could }, " send it today."]
            tr: { uk: "Я хотів запитати, чи не могли б ви надіслати це сьогодні.", es: "Me preguntaba si podría enviarlo hoy.", pt: "Eu estava me perguntando se você poderia enviar isso hoje.", fr: "Je me demandais si vous pourriez l’envoyer aujourd’hui.", de: "Ich habe mich gefragt, ob Sie es heute schicken könnten.", it: "Mi chiedevo se potesse inviarlo oggi.", pl: "Zastanawiałem się, czy mógłby pan to dziś wysłać.", tr: "Bugün gönderebilir misiniz diye düşünüyordum.", id: "Saya ingin tahu apakah Anda bisa mengirimkannya hari ini.", vi: "Tôi đang tự hỏi liệu bạn có thể gửi nó hôm nay không." }
          - type: rule
            level: C1
            text: { en: [{ term: Unfortunately }, " opens formal bad news; ", { term: "I'm afraid" }, " does the same in speech."], uk: [{ term: "Unfortunately" }, " відкриває офіційну погану новину; ", { term: "I'm afraid" }, " робить те саме в усному мовленні."], es: [{ term: "Unfortunately" }, " abre una mala noticia formal; ", { term: "I'm afraid" }, " hace lo mismo al hablar."], pt: [{ term: "Unfortunately" }, " abre uma má notícia formal; ", { term: "I'm afraid" }, " faz o mesmo na fala."], fr: [{ term: "Unfortunately" }, " ouvre une mauvaise nouvelle formelle ; ", { term: "I'm afraid" }, " fait de même à l’oral."], de: [{ term: "Unfortunately" }, " leitet eine formelle schlechte Nachricht ein; ", { term: "I'm afraid" }, " tut dasselbe in der gesprochenen Sprache."], it: [{ term: "Unfortunately" }, " apre una brutta notizia formale; ", { term: "I'm afraid" }, " fa lo stesso nel parlato."], pl: [{ term: "Unfortunately" }, " otwiera formalną złą wiadomość; ", { term: "I'm afraid" }, " robi to samo w mowie."], tr: [{ term: "Unfortunately" }, " resmî bir kötü haberi başlatır; ", { term: "I'm afraid" }, " konuşmada aynı işi görür."], id: [{ term: "Unfortunately" }, " membuka kabar buruk yang formal; ", { term: "I'm afraid" }, " melakukan hal yang sama dalam ujaran."], vi: [{ term: "Unfortunately" }, " mở đầu một tin xấu trang trọng; ", { term: "I'm afraid" }, " làm việc tương tự trong lời nói."] }
          - type: note
            level: C1
            text: { en: [{ term: Would }, " and ", { term: could }, " soften a request. See ", { link: Would, to: en.modals.would }, "."], uk: [{ term: "Would" }, " і ", { term: "could" }, " м’якшать прохання. Див. ", { link: "Would", to: "en.modals.would" }, "."], es: [{ term: "Would" }, " y ", { term: "could" }, " suavizan una petición. Ver ", { link: "Would", to: "en.modals.would" }, "."], pt: [{ term: "Would" }, " e ", { term: "could" }, " suavizam um pedido. Ver ", { link: "Would", to: "en.modals.would" }, "."], fr: [{ term: "Would" }, " et ", { term: "could" }, " adoucissent une demande. Voir ", { link: "Would", to: "en.modals.would" }, "."], de: [{ term: "Would" }, " und ", { term: "could" }, " mildern eine Bitte. Siehe ", { link: "Would", to: "en.modals.would" }, "."], it: [{ term: "Would" }, " e ", { term: "could" }, " smorzano una richiesta. Vedi ", { link: "Would", to: "en.modals.would" }, "."], pl: [{ term: "Would" }, " i ", { term: "could" }, " łagodzą prośbę. Zob. ", { link: "Would", to: "en.modals.would" }, "."], tr: [{ term: "Would" }, " ve ", { term: "could" }, " bir isteği yumuşatır. Bkz. ", { link: "Would", to: "en.modals.would" }, "."], id: [{ term: "Would" }, " dan ", { term: "could" }, " melunakkan permintaan. Lihat ", { link: "Would", to: "en.modals.would" }, "."], vi: [{ term: "Would" }, " và ", { term: "could" }, " làm nhẹ một lời nhờ. Xem ", { link: "Would", to: "en.modals.would" }, "."] }

