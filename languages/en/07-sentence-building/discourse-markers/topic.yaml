          - { key: move, label: { en: "Move", uk: "Дія", es: "Acción", pt: "Ação", fr: "Action", de: "Handlung", it: "Mossa", pl: "Działanie", tr: "Hamle", id: "Tindakan", vi: "Hành động" } }
          - { key: words, label: { en: "Phrase", uk: "Вираз", es: "Expresión", pt: "Expressão", fr: "Expression", de: "Wendung", it: "Espressione", pl: "Zwrot", tr: "İfade", id: "Frasa", vi: "Cụm từ" } }
