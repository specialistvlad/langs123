        rows:
          - { level: C2, move: { en: "Previewing the plan", uk: "Анонс плану", es: "Anunciar el plan", pt: "Antecipar o plano", fr: "Annoncer le plan", de: "Den Plan ankündigen", it: "Anticipare il piano", pl: "Zapowiedź planu", tr: "Planı önceden bildirmek", id: "Mengumumkan rencana", vi: "Báo trước kế hoạch" }, words: { pattern: ["I'd like to begin by", { slot: -ing }] }, ex: [{ target: "I'd like to begin by" }, " thanking you all."], tr: { uk: "Я хотів би почати з подяки всім вам.", es: "Quisiera comenzar agradeciéndoles a todos.", pt: "Gostaria de começar agradecendo a todos.", fr: "Je voudrais commencer par vous remercier tous.", de: "Ich möchte damit beginnen, Ihnen allen zu danken.", it: "Vorrei iniziare ringraziando tutti voi.", pl: "Chciałbym zacząć od podziękowania wam wszystkim.", tr: "Hepinize teşekkür ederek başlamak istiyorum.", id: "Saya ingin memulai dengan berterima kasih kepada Anda semua.", vi: "Tôi muốn bắt đầu bằng lời cảm ơn tất cả mọi người." } }
          - { level: C2, move: { en: "Stating the main claim", uk: "Формулювання головної тези", es: "Enunciar la tesis principal", pt: "Enunciar a tese principal", fr: "Énoncer la thèse principale", de: "Die Hauptthese nennen", it: "Enunciare la tesi principale", pl: "Sformułowanie głównej tezy", tr: "Ana iddiayı belirtmek", id: "Menyatakan klaim utama", vi: "Nêu luận điểm chính" }, words: { pattern: ["What I want to argue is", that, { slot: clause }] }, ex: [{ target: "What I want to argue is" }, " that cities need more trees."], tr: { uk: "Я хочу довести, що містам потрібно більше дерев.", es: "Lo que quiero sostener es que las ciudades necesitan más árboles.", pt: "O que eu quero defender é que as cidades precisam de mais árvores.", fr: "Ce que je veux soutenir, c’est que les villes ont besoin de plus d’arbres.", de: "Ich möchte darlegen, dass Städte mehr Bäume brauchen.", it: "Quello che voglio sostenere è che le città hanno bisogno di più alberi.", pl: "Chcę dowieść, że miasta potrzebują więcej drzew.", tr: "Savunmak istediğim şey, şehirlerin daha fazla ağaca ihtiyaç duyduğudur.", id: "Yang ingin saya sampaikan adalah bahwa kota membutuhkan lebih banyak pohon.", vi: "Điều tôi muốn lập luận là các thành phố cần nhiều cây xanh hơn." } }
          - { level: C2, move: { en: "Referring back", uk: "Посилання на сказане раніше", es: "Remitir a lo dicho", pt: "Remeter ao que foi dito", fr: "Renvoyer à ce qui précède", de: "Auf Gesagtes zurückverweisen", it: "Rimandare a quanto detto", pl: "Odwołanie do wcześniejszych słów", tr: "Önceki söze atıfta bulunmak", id: "Merujuk kembali", vi: "Nhắc lại điều đã nói" }, words: "as I mentioned earlier", ex: [{ target: "As I mentioned earlier" }, ", the budget is fixed."], tr: { uk: "Як я вже згадував, бюджет затверджено.", es: "Como mencioné antes, el presupuesto es fijo.", pt: "Como mencionei antes, o orçamento é fixo.", fr: "Comme je l’ai mentionné plus tôt, le budget est fixé.", de: "Wie ich schon erwähnt habe, steht das Budget fest.", it: "Come ho detto prima, il budget è fisso.", pl: "Jak wspomniałem wcześniej, budżet jest ustalony.", tr: "Daha önce belirttiğim gibi, bütçe sabittir.", id: "Seperti yang saya sebutkan tadi, anggarannya sudah tetap.", vi: "Như tôi đã đề cập trước đó, ngân sách đã cố định." } }
          - { level: C2, move: { en: "Promising to return", uk: "Обіцянка повернутися до теми", es: "Prometer volver sobre el tema", pt: "Prometer voltar ao tema", fr: "Promettre d’y revenir", de: "Versprechen, darauf zurückzukommen", it: "Promettere di tornarci", pl: "Obietnica powrotu do tematu", tr: "Konuya döneceğini söylemek", id: "Berjanji akan kembali", vi: "Hứa sẽ quay lại" }, words: "I'll come back to this", ex: [{ target: "I'll come back to this" }, " after the break."], tr: { uk: "Я повернуся до цього після перерви.", es: "Volveré sobre esto después del descanso.", pt: "Vou voltar a isso depois do intervalo.", fr: "J’y reviendrai après la pause.", de: "Darauf komme ich nach der Pause zurück.", it: "Ci tornerò dopo la pausa.", pl: "Wrócę do tego po przerwie.", tr: "Bu konuya moladan sonra döneceğim.", id: "Saya akan kembali ke hal ini setelah istirahat.", vi: "Tôi sẽ quay lại vấn đề này sau giờ giải lao." } }
          - { level: C2, move: { en: "Restating", uk: "Перефразування", es: "Reformular", pt: "Reformular", fr: "Reformuler", de: "Umformulieren", it: "Riformulare", pl: "Przeformułowanie", tr: "Yeniden ifade etmek", id: "Merumuskan ulang", vi: "Diễn đạt lại" }, words: { alternatives: ["that is", "put differently"] }, ex: { examples: [["The test is cheap; ", { target: "that is" }, ", it costs under a pound."], ["Prices rose; ", { target: "put differently" }, ", we pay more."]] }, tr: { uk: { examples: ["Тест дешевий, тобто коштує менше фунта.", "Ціни зросли; іншими словами, ми платимо більше."] }, es: { examples: ["La prueba es barata; es decir, cuesta menos de una libra.", "Los precios subieron; dicho de otro modo, pagamos más."] }, pt: { examples: ["O teste é barato; isto é, custa menos de uma libra.", "Os preços subiram; dito de outra forma, pagamos mais."] }, fr: { examples: ["Le test est bon marché ; c’est-à-dire qu’il coûte moins d’une livre.", "Les prix ont augmenté ; autrement dit, nous payons plus."] }, de: { examples: ["Der Test ist billig; das heißt, er kostet weniger als ein Pfund.", "Die Preise sind gestiegen; anders gesagt, wir zahlen mehr."] }, it: { examples: ["Il test è economico; cioè costa meno di una sterlina.", "I prezzi sono saliti; detto in altro modo, paghiamo di più."] }, pl: { examples: ["Test jest tani, to znaczy kosztuje poniżej funta.", "Ceny wzrosły; innymi słowy, płacimy więcej."] }, tr: { examples: ["Test ucuz; yani bir poundun altında bir maliyeti var.", "Fiyatlar arttı; başka bir deyişle, daha fazla ödüyoruz."] }, id: { examples: ["Tesnya murah; artinya, biayanya kurang dari satu pound.", "Harga naik; dengan kata lain, kita membayar lebih banyak."] }, vi: { examples: ["Bài kiểm tra rẻ; nghĩa là nó tốn chưa đến một bảng.", "Giá đã tăng; nói cách khác, chúng ta trả nhiều hơn."] } } }
          - { level: C2, move: { en: "Listing the members", uk: "Перелік членів групи", es: "Enumerar los miembros", pt: "Enumerar os membros", fr: "Énumérer les éléments", de: "Die Glieder aufzählen", it: "Elencare i membri", pl: "Wyliczenie elementów", tr: "Üyeleri saymak", id: "Merinci anggotanya", vi: "Liệt kê các thành viên" }, words: namely, ex: ["There are two options, ", { target: namely }, " rent or buy."], tr: { uk: "Є два варіанти, а саме: орендувати або купити.", es: "Hay dos opciones, a saber, alquilar o comprar.", pt: "Há duas opções, a saber, alugar ou comprar.", fr: "Il y a deux options, à savoir louer ou acheter.", de: "Es gibt zwei Möglichkeiten, nämlich mieten oder kaufen.", it: "Ci sono due opzioni, cioè affittare o comprare.", pl: "Są dwie opcje, mianowicie wynająć lub kupić.", tr: "İki seçenek var, yani kiralamak ya da satın almak.", id: "Ada dua pilihan, yaitu menyewa atau membeli.", vi: "Có hai lựa chọn, cụ thể là thuê hoặc mua." } }
          - { level: C2, move: { en: "Sharpening", uk: "Уточнення", es: "Precisar", pt: "Precisar", fr: "Préciser", de: "Präzisieren", it: "Precisare", pl: "Doprecyzowanie", tr: "Netleştirmek", id: "Mempertajam", vi: "Nói chính xác hơn" }, words: "to be more precise", ex: ["It took a year, or, ", { target: "to be more precise" }, ", thirteen months."], tr: { uk: "Це зайняло рік, а якщо точніше, тринадцять місяців.", es: "Tomó un año o, para ser más precisos, trece meses.", pt: "Levou um ano ou, para ser mais preciso, treze meses.", fr: "Cela a pris un an ou, pour être plus précis, treize mois.", de: "Es dauerte ein Jahr, genauer gesagt dreizehn Monate.", it: "Ci è voluto un anno o, per essere più precisi, tredici mesi.", pl: "Zajęło to rok, a ściślej trzynaście miesięcy.", tr: "Bir yıl sürdü, daha doğrusu on üç ay.", id: "Butuh waktu satu tahun, atau lebih tepatnya tiga belas bulan.", vi: "Mất một năm, hay chính xác hơn là mười ba tháng." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: [{ term: Namely }, " lists every member of a group; ", { term: "for example" }, " gives only some."], uk: [{ term: "Namely" }, " називає всіх членів групи; ", { term: "for example" }, " називає лише деяких."], es: [{ term: "Namely" }, " enumera todos los miembros de un grupo; ", { term: "for example" }, " da solo algunos."], pt: [{ term: "Namely" }, " enumera todos os membros de um grupo; ", { term: "for example" }, " dá apenas alguns."], fr: [{ term: "Namely" }, " énumère tous les éléments d’un groupe ; ", { term: "for example" }, " n’en donne que certains."], de: [{ term: "Namely" }, " zählt alle Glieder einer Gruppe auf; ", { term: "for example" }, " nennt nur einige."], it: [{ term: "Namely" }, " elenca tutti i membri di un gruppo; ", { term: "for example" }, " ne dà solo alcuni."], pl: [{ term: "Namely" }, " wylicza wszystkich członków grupy; ", { term: "for example" }, " podaje tylko niektórych."], tr: [{ term: "Namely" }, " bir grubun bütün üyelerini sayar; ", { term: "for example" }, " yalnızca bazılarını verir."], id: [{ term: "Namely" }, " menyebut semua anggota suatu kelompok; ", { term: "for example" }, " hanya menyebut sebagian."], vi: [{ term: "Namely" }, " liệt kê mọi thành viên của một nhóm; ", { term: "for example" }, " chỉ nêu một vài thành viên."] }
            ex: { contrast: [["Two groups pay, ", { target: namely }, " students and parents."], ["Some groups pay, ", { target: "for example" }, " students."]] }
            tr: { uk: { contrast: ["Платять дві групи, а саме студенти й батьки.", "Платять деякі групи, наприклад студенти."] }, es: { contrast: ["Pagan dos grupos, a saber, los estudiantes y los padres.", "Pagan algunos grupos, por ejemplo, los estudiantes."] }, pt: { contrast: ["Dois grupos pagam, a saber, os estudantes e os pais.", "Alguns grupos pagam, por exemplo, os estudantes."] }, fr: { contrast: ["Deux groupes paient, à savoir les étudiants et les parents.", "Certains groupes paient, par exemple les étudiants."] }, de: { contrast: ["Zwei Gruppen zahlen, nämlich Studierende und Eltern.", "Einige Gruppen zahlen, zum Beispiel Studierende."] }, it: { contrast: ["Pagano due gruppi, cioè studenti e genitori.", "Pagano alcuni gruppi, per esempio gli studenti."] }, pl: { contrast: ["Płacą dwie grupy, mianowicie studenci i rodzice.", "Płacą niektóre grupy, na przykład studenci."] }, tr: { contrast: ["İki grup ödeme yapar, yani öğrenciler ve ebeveynler.", "Bazı gruplar ödeme yapar, örneğin öğrenciler."] }, id: { contrast: ["Dua kelompok membayar, yaitu mahasiswa dan orang tua.", "Beberapa kelompok membayar, misalnya mahasiswa."] }, vi: { contrast: ["Hai nhóm phải trả tiền, cụ thể là sinh viên và phụ huynh.", "Một số nhóm phải trả tiền, ví dụ sinh viên."] } }

  - title: { en: "Typical errors", uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
