        - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - { level: B2, point: { en: "Spoken markers", uk: "Розмовні маркери", es: "Marcadores orales", pt: "Marcadores da fala", fr: "Marqueurs de l’oral", de: "Marker der gesprochenen Sprache", it: "Segnali del parlato", pl: "Markery mówione", tr: "Konuşma dilinin belirteçleri", id: "Penanda lisan", vi: "Dấu hiệu trong lời nói" }, rule: { en: "each marks a job: start, shift, return, check, correct, conclude", uk: "кожен виконує свою роль: почати, змінити тему, повернутися, перевірити, виправити, завершити", es: "cada uno cumple una función: empezar, cambiar de tema, volver, comprobar, corregir, concluir", pt: "cada um tem uma função: começar, mudar de assunto, voltar, checar, corrigir, concluir", fr: "chacun a une fonction : commencer, changer de sujet, revenir, vérifier, corriger, conclure", de: "jeder hat eine Aufgabe: beginnen, wechseln, zurückkehren, nachfragen, korrigieren, abschließen", it: "ognuno ha una funzione: aprire, cambiare argomento, tornare, verificare, correggere, concludere", pl: "każdy ma swoje zadanie: zacząć, zmienić temat, wrócić, sprawdzić, poprawić, zakończyć", tr: "her biri bir iş görür: başlamak, konu değiştirmek, geri dönmek, kontrol etmek, düzeltmek, bitirmek", id: "masing-masing punya tugas: memulai, berpindah topik, kembali, memeriksa, mengoreksi, menyimpulkan", vi: "mỗi dấu hiệu có một việc: mở đầu, chuyển ý, quay lại, kiểm tra, sửa lời, kết thúc" }, ex: [{ target: "By the way" }, ", did you call Anna?"], tr: { uk: "До речі, ти зателефонував Анні?", es: "Por cierto, ¿llamaste a Ana?", pt: "A propósito, você ligou para a Ana?", fr: "Au fait, tu as appelé Anna ?", de: "Übrigens, hast du Anna angerufen?", it: "A proposito, hai chiamato Anna?", pl: "Przy okazji, dzwoniłeś do Anny?", tr: "Bu arada, Anna'yı aradın mı?", id: "Ngomong-ngomong, apakah kamu sudah menelepon Anna?", vi: "Nhân tiện, bạn đã gọi cho Anna chưa?" } }
        - { level: B2, point: { en: "Hedges", uk: "Пом’якшувачі", es: "Atenuadores", pt: "Atenuadores", fr: "Atténuateurs", de: "Abschwächer", it: "Attenuatori", pl: "Wyrażenia łagodzące", tr: "Yumuşatıcılar", id: "Pelunak", vi: "Từ giảm nhẹ" }, rule: { en: ["soften a word or a claim: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], uk: ["м’якшать слово чи твердження: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], es: ["suavizan una palabra o una afirmación: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], pt: ["suavizam uma palavra ou uma afirmação: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], fr: ["adoucissent un mot ou une affirmation : ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], de: ["mildern ein Wort oder eine Aussage: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], it: ["smorzano una parola o un'affermazione: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], pl: ["osłabiają słowo lub twierdzenie: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], tr: ["bir sözcüğü ya da iddiayı hafifletir: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], id: ["melunakkan kata atau klaim: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }], vi: ["làm nhẹ một từ hoặc một khẳng định: ", { term: "sort of" }, ", ", { term: "a bit" }, ", ", { term: "I'd say" }] }, ex: [{ target: "I'd say" }, " it's ", { target: "a bit" }, " late."], tr: { uk: "Я б сказав, що вже трохи пізно.", es: "Diría que ya es un poco tarde.", pt: "Eu diria que já é um pouco tarde.", fr: "Je dirais qu’il est un peu tard.", de: "Ich würde sagen, es ist ein bisschen spät.", it: "Direi che è un po' tardi.", pl: "Powiedziałbym, że jest trochę późno.", tr: "Bence biraz geç oldu.", id: "Menurut saya, sudah agak malam.", vi: "Tôi nghĩ là hơi muộn rồi." } }
        - { level: B2, point: { en: "Vague language", uk: "Нечітка мова", es: "Lenguaje vago", pt: "Linguagem vaga", fr: "Langage vague", de: "Vage Sprache", it: "Linguaggio vago", pl: "Język niedookreślony", tr: "Belirsiz dil", id: "Bahasa tidak tentu", vi: "Ngôn ngữ mơ hồ" }, rule: { en: [{ term: "or so" }, ", ", { term: "and so on" }, " and ", { term: "or something" }, " leave the detail open"], uk: [{ term: "or so" }, ", ", { term: "and so on" }, " і ", { term: "or something" }, " залишають подробиці невизначеними"], es: [{ term: "or so" }, ", ", { term: "and so on" }, " y ", { term: "or something" }, " dejan abierto el detalle"], pt: [{ term: "or so" }, ", ", { term: "and so on" }, " e ", { term: "or something" }, " deixam o detalhe em aberto"], fr: [{ term: "or so" }, ", ", { term: "and so on" }, " et ", { term: "or something" }, " laissent le détail ouvert"], de: [{ term: "or so" }, ", ", { term: "and so on" }, " und ", { term: "or something" }, " lassen die Einzelheiten offen"], it: [{ term: "or so" }, ", ", { term: "and so on" }, " e ", { term: "or something" }, " lasciano il dettaglio aperto"], pl: [{ term: "or so" }, ", ", { term: "and so on" }, " i ", { term: "or something" }, " pozostawiają szczegóły otwarte"], tr: [{ term: "or so" }, ", ", { term: "and so on" }, " ve ", { term: "or something" }, " ayrıntıyı açık bırakır"], id: [{ term: "or so" }, ", ", { term: "and so on" }, " dan ", { term: "or something" }, " membiarkan detailnya terbuka"], vi: [{ term: "or so" }, ", ", { term: "and so on" }, " và ", { term: "or something" }, " để ngỏ chi tiết"] }, ex: ["Let's have a coffee ", { target: "or something" }, "."], tr: { uk: "Давай вип’ємо кави чи ще чогось.", es: "Tomemos un café o algo así.", pt: "Vamos tomar um café ou algo assim.", fr: "Prenons un café ou quelque chose comme ça.", de: "Lass uns einen Kaffee trinken oder so.", it: "Prendiamo un caffè o qualcosa del genere.", pl: "Napijmy się kawy czy coś.", tr: "Bir kahve içelim ya da onun gibi bir şey.", id: "Ayo minum kopi atau apa saja.", vi: "Mình đi uống cà phê hay gì đó nhé." } }
        - { level: B2, point: { en: "Turn-taking", uk: "Черговість реплік", es: "Turnos de palabra", pt: "Troca de turnos", fr: "Tours de parole", de: "Sprecherwechsel", it: "Turni di parola", pl: "Zmiana mówcy", tr: "Söz sırası", id: "Pergantian giliran bicara", vi: "Luân phiên lượt lời" }, rule: { en: "set phrases hold the floor, interrupt, agree and show you listen", uk: "усталені фрази допомагають втримати слово, перебити, погодитися й показати, що ти слухаєш", es: "las frases hechas sirven para mantener la palabra, interrumpir, mostrar acuerdo y demostrar que se escucha", pt: "frases feitas servem para manter a palavra, interromper, concordar e mostrar que você escuta", fr: "des expressions toutes faites permettent de garder la parole, d’interrompre, d’approuver et de montrer qu’on écoute", de: "feste Wendungen halten das Wort, unterbrechen, stimmen zu und zeigen, dass man zuhört", it: "formule fisse servono a tenere la parola, interrompere, essere d'accordo e mostrare che si ascolta", pl: "stałe zwroty pozwalają zatrzymać głos, przerwać, zgodzić się i pokazać, że się słucha", tr: "kalıp ifadeler sözü korur, sözü keser, onaylar ve dinlediğini gösterir", id: "frasa baku dipakai untuk mempertahankan giliran, menyela, menyetujui, dan menunjukkan bahwa kita menyimak", vi: "các cụm cố định giúp giữ lượt lời, ngắt lời, đồng ý và cho thấy bạn đang nghe" }, ex: [{ target: "Sorry to interrupt" }, ", but the shop closes at five."], tr: { uk: "Вибачте, що перебиваю, але магазин зачиняється о п’ятій.", es: "Perdón que interrumpa, pero la tienda cierra a las cinco.", pt: "Desculpe interromper, mas a loja fecha às cinco.", fr: "Désolé de vous interrompre, mais le magasin ferme à cinq heures.", de: "Entschuldigung, wenn ich unterbreche, aber das Geschäft schließt um fünf.", it: "Scusa se ti interrompo, ma il negozio chiude alle cinque.", pl: "Przepraszam, że przerywam, ale sklep zamykają o piątej.", tr: "Sözünüzü kestiğim için özür dilerim ama mağaza beşte kapanıyor.", id: "Maaf menyela, tetapi tokonya tutup pukul lima.", vi: "Xin lỗi vì đã ngắt lời, nhưng cửa hàng đóng cửa lúc năm giờ." } }
        - { level: C1, point: { en: "Stance", uk: "Позиція мовця", es: "Postura del hablante", pt: "Posicionamento do falante", fr: "Positionnement du locuteur", de: "Haltung des Sprechers", it: "Posizione del parlante", pl: "Postawa mówiącego", tr: "Konuşanın tutumu", id: "Sikap pembicara", vi: "Thái độ của người nói" }, rule: { en: [{ term: frankly }, ", ", { term: "to be fair" }, " and ", { term: "in fact" }, " show how the speaker sees a point"], uk: [{ term: "frankly" }, ", ", { term: "to be fair" }, " і ", { term: "in fact" }, " показують, як мовець ставиться до певної думки"], es: [{ term: "frankly" }, ", ", { term: "to be fair" }, " y ", { term: "in fact" }, " muestran cómo ve el hablante un asunto"], pt: [{ term: "frankly" }, ", ", { term: "to be fair" }, " e ", { term: "in fact" }, " mostram como o falante vê um ponto"], fr: [{ term: "frankly" }, ", ", { term: "to be fair" }, " et ", { term: "in fact" }, " montrent comment le locuteur voit un point"], de: [{ term: "frankly" }, ", ", { term: "to be fair" }, " und ", { term: "in fact" }, " zeigen, wie der Sprecher einen Punkt sieht"], it: [{ term: "frankly" }, ", ", { term: "to be fair" }, " e ", { term: "in fact" }, " mostrano come il parlante vede un punto"], pl: [{ term: "frankly" }, ", ", { term: "to be fair" }, " i ", { term: "in fact" }, " pokazują, jak mówiący widzi daną kwestię"], tr: [{ term: "frankly" }, ", ", { term: "to be fair" }, " ve ", { term: "in fact" }, " konuşanın bir noktaya nasıl baktığını gösterir"], id: [{ term: "frankly" }, ", ", { term: "to be fair" }, " dan ", { term: "in fact" }, " menunjukkan cara pembicara memandang sebuah hal"], vi: [{ term: "frankly" }, ", ", { term: "to be fair" }, " và ", { term: "in fact" }, " cho thấy người nói nhìn nhận một vấn đề thế nào"] }, ex: [{ target: "To be fair" }, ", he did say sorry."], tr: { uk: "Справедливості заради, він таки перепросив.", es: "Para ser justos, sí pidió perdón.", pt: "Para ser justo, ele pediu desculpas, sim.", fr: "Pour être juste, il s’est quand même excusé.", de: "Fairerweise muss man sagen: Er hat sich entschuldigt.", it: "Per essere onesti, si è scusato.", pl: "Żeby być sprawiedliwym, on jednak przeprosił.", tr: "Adil olmak gerekirse, özür diledi.", id: "Harus diakui, dia memang sudah minta maaf.", vi: "Công bằng mà nói, anh ấy đã xin lỗi." } }
        - { level: C1, point: { en: "Academic hedging", uk: "Академічне пом’якшення", es: "Atenuación académica", pt: "Atenuação acadêmica", fr: "Atténuation académique", de: "Abschwächung in der Wissenschaftssprache", it: "Attenuazione accademica", pl: "Łagodzenie w tekście naukowym", tr: "Akademik yumuşatma", id: "Pelunakan akademik", vi: "Giảm nhẹ trong văn bản học thuật" }, rule: { en: [{ term: "tend to" }, ", ", { term: may }, " and ", { term: suggest }, " fit a claim to its evidence; boosters raise it"], uk: [{ term: "tend to" }, ", ", { term: "may" }, " і ", { term: "suggest" }, " узгоджують твердження з доказами; підсилювачі його посилюють"], es: [{ term: "tend to" }, ", ", { term: "may" }, " y ", { term: "suggest" }, " ajustan una afirmación a sus pruebas; los intensificadores la refuerzan"], pt: [{ term: "tend to" }, ", ", { term: "may" }, " e ", { term: "suggest" }, " ajustam uma afirmação às suas evidências; os intensificadores a reforçam"], fr: [{ term: "tend to" }, ", ", { term: "may" }, " et ", { term: "suggest" }, " ajustent une affirmation à ses preuves ; les renforçateurs la durcissent"], de: [{ term: "tend to" }, ", ", { term: "may" }, " und ", { term: "suggest" }, " passen eine Behauptung an ihre Belege an; Verstärker erhöhen ihre Stärke"], it: [{ term: "tend to" }, ", ", { term: "may" }, " e ", { term: "suggest" }, " adattano un'affermazione alle prove; i rafforzativi la rendono più forte"], pl: [{ term: "tend to" }, ", ", { term: "may" }, " i ", { term: "suggest" }, " dopasowują twierdzenie do dowodów; wzmacniacze je wzmacniają"], tr: [{ term: "tend to" }, ", ", { term: "may" }, " ve ", { term: "suggest" }, " bir iddiayı kanıtına uydurur; pekiştiriciler onu güçlendirir"], id: [{ term: "tend to" }, ", ", { term: "may" }, " dan ", { term: "suggest" }, " menyesuaikan klaim dengan buktinya; penegas menaikkan kekuatannya"], vi: [{ term: "tend to" }, ", ", { term: "may" }, " và ", { term: "suggest" }, " điều chỉnh một khẳng định cho khớp với bằng chứng; từ nhấn mạnh làm nó mạnh hơn"] }, ex: ["Prices ", { target: "tend to" }, " rise in summer."], tr: { uk: "Влітку ціни, як правило, зростають.", es: "Los precios tienden a subir en verano.", pt: "Os preços tendem a subir no verão.", fr: "Les prix ont tendance à monter en été.", de: "Die Preise steigen im Sommer tendenziell.", it: "I prezzi tendono ad aumentare in estate.", pl: "Latem ceny mają tendencję do wzrostu.", tr: "Fiyatlar yazın artma eğilimindedir.", id: "Harga cenderung naik pada musim panas.", vi: "Giá thường có xu hướng tăng vào mùa hè." } }
        - { level: C1, point: { en: "Indirectness", uk: "Непрямість", es: "Indirección", pt: "Indireção", fr: "Indirection", de: "Indirektheit", it: "Indirettezza", pl: "Pośredniość", tr: "Dolaylılık", id: "Ketidaklangsungan", vi: "Cách nói gián tiếp" }, rule: { en: ["soften a request or a disagreement: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], uk: ["м’якшать прохання чи незгоду: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], es: ["suavizan una petición o un desacuerdo: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], pt: ["suavizam um pedido ou uma discordância: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], fr: ["adoucissent une demande ou un désaccord : ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], de: ["mildern eine Bitte oder einen Widerspruch: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], it: ["smorzano una richiesta o un disaccordo: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], pl: ["łagodzą prośbę lub sprzeciw: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], tr: ["bir isteği ya da karşı çıkışı yumuşatır: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], id: ["melunakkan permintaan atau ketidaksetujuan: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }], vi: ["làm nhẹ một lời nhờ hoặc một lời phản đối: ", { term: "I was wondering if" }, ", ", { term: "with all due respect" }] }, ex: [{ target: "I was wondering if" }, " you could help me."], tr: { uk: "Я хотів запитати, чи не могли б ви мені допомогти.", es: "Me preguntaba si podría ayudarme.", pt: "Eu estava me perguntando se você poderia me ajudar.", fr: "Je me demandais si vous pourriez m’aider.", de: "Ich habe mich gefragt, ob Sie mir helfen könnten.", it: "Mi chiedevo se potesse aiutarmi.", pl: "Zastanawiałem się, czy mógłby mi pan pomóc.", tr: "Bana yardım edebilir misiniz diye düşünüyordum.", id: "Saya ingin tahu apakah Anda bisa membantu saya.", vi: "Tôi đang tự hỏi liệu bạn có thể giúp tôi không." } }
        - { level: C1, point: { en: "Distancing", uk: "Дистанціювання", es: "Distanciamiento", pt: "Distanciamento", fr: "Prise de distance", de: "Distanzierung", it: "Presa di distanza", pl: "Dystansowanie się", tr: "Mesafe koyma", id: "Pengambilan jarak", vi: "Giữ khoảng cách" }, rule: { en: [{ term: allegedly }, ", ", { term: reportedly }, " and ", { term: "so-called" }, " credit a claim to others"], uk: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " і ", { term: "so-called" }, " приписують твердження іншим"], es: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " y ", { term: "so-called" }, " atribuyen una afirmación a otros"], pt: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " e ", { term: "so-called" }, " atribuem uma afirmação a outros"], fr: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " et ", { term: "so-called" }, " attribuent une affirmation à d’autres"], de: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " und ", { term: "so-called" }, " schreiben eine Behauptung anderen zu"], it: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " e ", { term: "so-called" }, " attribuiscono un'affermazione ad altri"], pl: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " i ", { term: "so-called" }, " przypisują twierdzenie innym"], tr: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " ve ", { term: "so-called" }, " bir iddiayı başkalarına atfeder"], id: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " dan ", { term: "so-called" }, " mengaitkan klaim dengan pihak lain"], vi: [{ term: "allegedly" }, ", ", { term: "reportedly" }, " và ", { term: "so-called" }, " gán một khẳng định cho người khác"] }, ex: ["The man ", { target: allegedly }, " took the car."], tr: { uk: "Чоловік нібито взяв автомобіль.", es: "El hombre presuntamente se llevó el auto.", pt: "O homem supostamente levou o carro.", fr: "L’homme aurait pris la voiture.", de: "Der Mann hat das Auto angeblich genommen.", it: "L'uomo avrebbe preso l'auto.", pl: "Mężczyzna rzekomo zabrał samochód.", tr: "Adam iddiaya göre arabayı almış.", id: "Pria itu diduga mengambil mobil itu.", vi: "Người đàn ông bị cho là đã lấy chiếc xe." } }
        - { level: C2, point: { en: "Understatement and irony", uk: "Применшення та іронія", es: "Subestimación e ironía", pt: "Subestimação e ironia", fr: "Litote et ironie", de: "Untertreibung und Ironie", it: "Understatement e ironia", pl: "Niedopowiedzenie i ironia", tr: "Hafife alma ve ironi", id: "Pernyataan merendah dan ironi", vi: "Nói giảm và mỉa mai" }, rule: { en: [{ term: "not bad" }, " and ", { term: "not exactly" }, " say less than they mean; the tune shows it"], uk: [{ term: "not bad" }, " і ", { term: "not exactly" }, " кажуть менше, ніж мають на увазі; це видно з інтонації"], es: [{ term: "not bad" }, " y ", { term: "not exactly" }, " dicen menos de lo que quieren decir; la entonación lo muestra"], pt: [{ term: "not bad" }, " e ", { term: "not exactly" }, " dizem menos do que querem dizer; a entonação mostra isso"], fr: [{ term: "not bad" }, " et ", { term: "not exactly" }, " disent moins qu’ils ne pensent ; l’intonation le montre"], de: [{ term: "not bad" }, " und ", { term: "not exactly" }, " sagen weniger, als sie meinen; die Satzmelodie zeigt es"], it: [{ term: "not bad" }, " e ", { term: "not exactly" }, " dicono meno di quanto intendono; l'intonazione lo mostra"], pl: [{ term: "not bad" }, " i ", { term: "not exactly" }, " mówią mniej, niż znaczą; widać to po intonacji"], tr: [{ term: "not bad" }, " ve ", { term: "not exactly" }, " kastettiğinden azını söyler; tonlama bunu gösterir"], id: [{ term: "not bad" }, " dan ", { term: "not exactly" }, " mengatakan lebih sedikit daripada maksudnya; intonasi menunjukkannya"], vi: [{ term: "not bad" }, " và ", { term: "not exactly" }, " nói ít hơn điều muốn nói; ngữ điệu cho thấy điều đó"] }, ex: { exchange: ["How was the film?", [{ target: "Not bad" }, "."]] }, tr: { uk: { exchange: ["Як тобі фільм?", "Непогано."] }, es: { exchange: ["¿Qué tal la película?", "No está mal."] }, pt: { exchange: ["Como foi o filme?", "Nada mal."] }, fr: { exchange: ["Comment était le film ?", "Pas mal."] }, de: { exchange: ["Wie war der Film?", "Nicht schlecht."] }, it: { exchange: ["Com'era il film?", "Non male."] }, pl: { exchange: ["Jaki był film?", "Nieźle."] }, tr: { exchange: ["Film nasıldı?", "Fena değildi."] }, id: { exchange: ["Bagaimana filmnya?", "Lumayan."] }, vi: { exchange: ["Phim thế nào?", "Cũng không tệ."] } } }
        - { level: C2, point: { en: "Formal markers", uk: "Формальні маркери", es: "Marcadores formales", pt: "Marcadores formais", fr: "Marqueurs formels", de: "Formelle Marker", it: "Segnali formali", pl: "Markery formalne", tr: "Resmî belirteçler", id: "Penanda formal", vi: "Dấu hiệu trang trọng" }, rule: { en: [{ term: "that said" }, ", ", { term: "to that end" }, " and ", { term: "by the same token" }, " link the steps of a formal argument"], uk: [{ term: "that said" }, ", ", { term: "to that end" }, " і ", { term: "by the same token" }, " поєднують кроки формальної аргументації"], es: [{ term: "that said" }, ", ", { term: "to that end" }, " y ", { term: "by the same token" }, " enlazan los pasos de un argumento formal"], pt: [{ term: "that said" }, ", ", { term: "to that end" }, " e ", { term: "by the same token" }, " ligam as etapas de um argumento formal"], fr: [{ term: "that said" }, ", ", { term: "to that end" }, " et ", { term: "by the same token" }, " relient les étapes d’une argumentation formelle"], de: [{ term: "that said" }, ", ", { term: "to that end" }, " und ", { term: "by the same token" }, " verbinden die Schritte einer formellen Argumentation"], it: [{ term: "that said" }, ", ", { term: "to that end" }, " e ", { term: "by the same token" }, " collegano i passaggi di un'argomentazione formale"], pl: [{ term: "that said" }, ", ", { term: "to that end" }, " i ", { term: "by the same token" }, " łączą kroki formalnego wywodu"], tr: [{ term: "that said" }, ", ", { term: "to that end" }, " ve ", { term: "by the same token" }, " resmî bir savın adımlarını birbirine bağlar"], id: [{ term: "that said" }, ", ", { term: "to that end" }, " dan ", { term: "by the same token" }, " menghubungkan langkah-langkah argumen formal"], vi: [{ term: "that said" }, ", ", { term: "to that end" }, " và ", { term: "by the same token" }, " nối các bước của một lập luận trang trọng"] }, ex: ["The cost is high. ", { target: "That said" }, ", the benefits are clear."], tr: { uk: "Витрати високі. Проте переваги очевидні.", es: "El costo es alto. Dicho esto, los beneficios son evidentes.", pt: "O custo é alto. Dito isso, os benefícios são claros.", fr: "Le coût est élevé. Cela dit, les avantages sont évidents.", de: "Die Kosten sind hoch. Dennoch liegen die Vorteile auf der Hand.", it: "Il costo è alto. Detto questo, i vantaggi sono evidenti.", pl: "Koszt jest wysoki. Niemniej korzyści są oczywiste.", tr: "Maliyet yüksek. Bununla birlikte, yararları açık.", id: "Biayanya tinggi. Meskipun demikian, manfaatnya jelas.", vi: "Chi phí cao. Dù vậy, lợi ích rất rõ ràng." } }
        - { level: C2, point: { en: "Metadiscourse", uk: "Метадискурс", es: "Metadiscurso", pt: "Metadiscurso", fr: "Métadiscours", de: "Metadiskurs", it: "Metadiscorso", pl: "Metadyskurs", tr: "Üstsöylem", id: "Metawacana", vi: "Siêu diễn ngôn" }, rule: { en: "preview, review and reformulate in a long talk", uk: "у довгому виступі: анонсувати, підсумовувати й перефразовувати", es: "en una charla larga: anunciar, recapitular y reformular", pt: "em uma fala longa: anunciar, retomar e reformular", fr: "dans un long exposé : annoncer, rappeler et reformuler", de: "in einem langen Vortrag: ankündigen, zurückblicken und umformulieren", it: "in un lungo discorso: anticipare, richiamare e riformulare", pl: "w długiej wypowiedzi: zapowiadać, przypominać i przeformułowywać", tr: "uzun bir konuşmada önceden bildirir, geri döner ve yeniden ifade eder", id: "dalam pidato panjang: menyampaikan gambaran awal, mengulas, dan merumuskan ulang", vi: "trong một bài nói dài: báo trước, nhìn lại và diễn đạt lại" }, ex: [{ target: "I'd like to begin by" }, " thanking you all."], tr: { uk: "Я хотів би почати з подяки всім вам.", es: "Quisiera comenzar agradeciéndoles a todos.", pt: "Gostaria de começar agradecendo a todos.", fr: "Je voudrais commencer par vous remercier tous.", de: "Ich möchte damit beginnen, Ihnen allen zu danken.", it: "Vorrei iniziare ringraziando tutti voi.", pl: "Chciałbym zacząć od podziękowania wam wszystkim.", tr: "Hepinize teşekkür ederek başlamak istiyorum.", id: "Saya ingin memulai dengan berterima kasih kepada Anda semua.", vi: "Tôi muốn bắt đầu bằng lời cảm ơn tất cả mọi người." } }
        - { level: C1, point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: "according to" }, " names a source; give your own view with ", { term: "in my opinion" }], uk: [{ term: "according to" }, " називає джерело; власну думку виражай через ", { term: "in my opinion" }], es: [{ term: "according to" }, " nombra una fuente; tu propia opinión va con ", { term: "in my opinion" }], pt: [{ term: "according to" }, " indica uma fonte; sua própria opinião usa ", { term: "in my opinion" }], fr: [{ term: "according to" }, " nomme une source ; ton propre avis se dit avec ", { term: "in my opinion" }], de: [{ term: "according to" }, " nennt eine Quelle; die eigene Meinung steht mit ", { term: "in my opinion" }], it: [{ term: "according to" }, " indica una fonte; la propria opinione si esprime con ", { term: "in my opinion" }], pl: [{ term: "according to" }, " wskazuje źródło; własne zdanie wyraża się przez ", { term: "in my opinion" }], tr: [{ term: "according to" }, " bir kaynağı gösterir; kendi görüşünü ", { term: "in my opinion" }, " ile söylersin"], id: [{ term: "according to" }, " menyebutkan sumber; pendapat sendiri memakai ", { term: "in my opinion" }], vi: [{ term: "according to" }, " nêu một nguồn; ý kiến của chính bạn dùng ", { term: "in my opinion" }] }, ex: [{ target: "In my opinion" }, ", the plan is weak."], tr: { uk: "На мою думку, план слабкий.", es: "En mi opinión, el plan es débil.", pt: "Na minha opinião, o plano é fraco.", fr: "À mon avis, le plan est faible.", de: "Meiner Meinung nach ist der Plan schwach.", it: "Secondo me, il piano è debole.", pl: "Moim zdaniem plan jest słaby.", tr: "Bence plan zayıf.", id: "Menurut saya, rencananya lemah.", vi: "Theo tôi, kế hoạch này yếu." } }

sections:
  - title: { en: "Overview", uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A discourse marker organises talk or shows the speaker's attitude; the clause keeps its meaning without it.", uk: "Дискурсивний маркер упорядковує розмову або показує ставлення мовця; речення зберігає зміст і без нього.", es: "Un marcador del discurso ordena la conversación o muestra la actitud del hablante; la oración conserva su significado sin él.", pt: "Um marcador discursivo organiza a conversa ou mostra a atitude de quem fala; a oração mantém seu sentido sem ele.", fr: "Un marqueur discursif organise la conversation ou montre l’attitude du locuteur ; la proposition garde son sens sans lui.", de: "Ein Diskursmarker gliedert das Gespräch oder zeigt die Haltung des Sprechers; der Satz behält ohne ihn seine Bedeutung.", it: "Un segnale discorsivo organizza il discorso o mostra l'atteggiamento del parlante; la frase mantiene il suo significato anche senza di esso.", pl: "Marker dyskursu porządkuje rozmowę lub pokazuje postawę mówiącego; zdanie zachowuje znaczenie także bez niego.", tr: "Söylem belirteci konuşmayı düzenler ya da konuşanın tutumunu gösterir; cümle onsuz da anlamını korur.", id: "Penanda wacana menata percakapan atau menunjukkan sikap pembicara; klausa tetap bermakna tanpanya.", vi: "Dấu hiệu diễn ngôn tổ chức lời nói hoặc cho thấy thái độ của người nói; mệnh đề vẫn giữ nghĩa khi không có nó." }
            ex: [{ target: Well }, ", I'm not sure."]
            tr: { uk: "Ну, я не впевнений.", es: "Bueno, no estoy seguro.", pt: "Bem, não tenho certeza.", fr: "Bon, je ne suis pas sûr.", de: "Na ja, ich bin nicht sicher.", it: "Beh, non sono sicuro.", pl: "No cóż, nie jestem pewien.", tr: "Şey, emin değilim.", id: "Yah, saya tidak yakin.", vi: "Ừm, tôi không chắc." }
          - type: rule
            level: B2
            text: { en: "The same marker can do several jobs, and the situation shows which.", uk: "Один і той самий маркер може виконувати кілька ролей, а яку саме — показує ситуація.", es: "Un mismo marcador puede cumplir varias funciones, y la situación muestra cuál.", pt: "Um mesmo marcador pode ter várias funções, e a situação mostra qual.", fr: "Un même marqueur peut avoir plusieurs fonctions ; la situation montre laquelle.", de: "Derselbe Marker kann mehrere Aufgaben haben; die Situation zeigt, welche.", it: "Lo stesso segnale può avere più funzioni, e la situazione mostra quale.", pl: "Ten sam marker może pełnić kilka funkcji, a którą — pokazuje sytuacja.", tr: "Aynı belirteç birkaç iş görebilir; hangisini gördüğünü durum gösterir.", id: "Satu penanda bisa punya beberapa fungsi, dan situasilah yang menunjukkan fungsinya.", vi: "Một dấu hiệu có thể làm nhiều việc, và tình huống cho biết đó là việc nào." }
            ex: { examples: [[{ target: Anyway }, ", as I was saying, we leave at nine."], [{ target: Anyway }, ", that's it for today."]] }
            tr: { uk: { examples: ["Так от, як я казав, ми виїжджаємо о дев’ятій.", "Ну що ж, на сьогодні це все."] }, es: { examples: ["En fin, como decía, salimos a las nueve.", "En fin, eso es todo por hoy."] }, pt: { examples: ["Enfim, como eu estava dizendo, nós saímos às nove.", "Enfim, por hoje é só."] }, fr: { examples: ["Bref, comme je le disais, nous partons à neuf heures.", "Bref, c’est tout pour aujourd’hui."] }, de: { examples: ["Jedenfalls, wie ich schon sagte, wir fahren um neun los.", "Jedenfalls, das war's für heute."] }, it: { examples: ["Comunque, come dicevo, partiamo alle nove.", "Comunque, per oggi è tutto."] }, pl: { examples: ["W każdym razie, jak mówiłem, wyjeżdżamy o dziewiątej.", "W każdym razie, na dziś to wszystko."] }, tr: { examples: ["Neyse, dediğim gibi dokuzda çıkıyoruz.", "Neyse, bugünlük bu kadar."] }, id: { examples: ["Pokoknya, seperti yang saya katakan, kami berangkat pukul sembilan.", "Pokoknya, sekian untuk hari ini."] }, vi: { examples: ["Dù sao thì, như tôi đã nói, chín giờ chúng tôi đi.", "Dù sao thì, hôm nay đến đây thôi."] } }
          - type: note
            level: B2
            text: { en: ["Linkers such as ", { term: however }, " and ", { term: therefore }, " join clauses. See ", { link: "Conjunctions and Linkers", to: en.sentence-building.conjunctions-linkers }, "."], uk: ["Слова-зв’язки, як-от ", { term: "however" }, " і ", { term: "therefore" }, ", поєднують частини речення. Див. ", { link: "Сполучники та слова-зв’язки", to: "en.sentence-building.conjunctions-linkers" }, "."], es: ["Los conectores, como ", { term: "however" }, " y ", { term: "therefore" }, ", unen oraciones. Ver ", { link: "Conjunciones y conectores", to: "en.sentence-building.conjunctions-linkers" }, "."], pt: ["Os conectivos, como ", { term: "however" }, " e ", { term: "therefore" }, ", unem orações. Ver ", { link: "Conjunções e conectivos", to: "en.sentence-building.conjunctions-linkers" }, "."], fr: ["Les connecteurs comme ", { term: "however" }, " et ", { term: "therefore" }, " relient des propositions. Voir ", { link: "Conjonctions et connecteurs", to: "en.sentence-building.conjunctions-linkers" }, "."], de: ["Bindewörter wie ", { term: "however" }, " und ", { term: "therefore" }, " verbinden Teilsätze. Siehe ", { link: "Konjunktionen und Bindewörter", to: "en.sentence-building.conjunctions-linkers" }, "."], it: ["I connettivi come ", { term: "however" }, " e ", { term: "therefore" }, " uniscono le proposizioni. Vedi ", { link: "Congiunzioni e connettivi", to: "en.sentence-building.conjunctions-linkers" }, "."], pl: ["Słowa łączące, takie jak ", { term: "however" }, " i ", { term: "therefore" }, ", spajają części zdania. Zob. ", { link: "Spójniki i słowa łączące", to: "en.sentence-building.conjunctions-linkers" }, "."], tr: [{ term: "however" }, " ve ", { term: "therefore" }, " gibi bağlayıcılar cümleleri birbirine bağlar. Bkz. ", { link: "Bağlaçlar ve bağlayıcılar", to: "en.sentence-building.conjunctions-linkers" }, "."], id: ["Kata penghubung seperti ", { term: "however" }, " dan ", { term: "therefore" }, " menghubungkan klausa. Lihat ", { link: "Konjungsi dan kata penghubung", to: "en.sentence-building.conjunctions-linkers" }, "."], vi: ["Từ nối như ", { term: "however" }, " và ", { term: "therefore" }, " nối các mệnh đề. Xem ", { link: "Liên từ và từ nối", to: "en.sentence-building.conjunctions-linkers" }, "."] }

  - title: { en: "Spoken markers by function", uk: "Розмовні маркери за функцією", es: "Marcadores orales según su función", pt: "Marcadores da fala por função", fr: "Marqueurs de l’oral selon leur fonction", de: "Marker der gesprochenen Sprache nach Funktion", it: "Segnali del parlato per funzione", pl: "Markery mówione według funkcji", tr: "İşlevlerine göre konuşma belirteçleri", id: "Penanda lisan menurut fungsinya", vi: "Dấu hiệu trong lời nói theo chức năng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: job, label: { en: "Job", uk: "Функція", es: "Función", pt: "Função", fr: "Fonction", de: "Aufgabe", it: "Funzione", pl: "Funkcja", tr: "İşlev", id: "Fungsi", vi: "Chức năng" } }
          - { key: words, label: { en: "Markers", uk: "Маркери", es: "Marcadores", pt: "Marcadores", fr: "Marqueurs", de: "Marker", it: "Segnali", pl: "Markery", tr: "Belirteçler", id: "Penanda", vi: "Dấu hiệu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, job: { en: "Starting or shifting", uk: "Початок або перехід", es: "Empezar o cambiar de tema", pt: "Começar ou mudar", fr: "Commencer ou enchaîner", de: "Beginnen oder wechseln", it: "Iniziare o cambiare", pl: "Rozpoczęcie lub przejście", tr: "Başlamak ya da geçiş yapmak", id: "Memulai atau beralih", vi: "Mở đầu hoặc chuyển ý" }, words: { alternatives: [well, right, "OK", so, now, anyway] }, ex: [{ target: Right }, ", let's begin."], tr: { uk: "Гаразд, починаймо.", es: "Bien, empecemos.", pt: "Certo, vamos começar.", fr: "Bon, commençons.", de: "Gut, fangen wir an.", it: "Bene, cominciamo.", pl: "Dobrze, zaczynajmy.", tr: "Pekâlâ, başlayalım.", id: "Baiklah, mari kita mulai.", vi: "Được rồi, chúng ta bắt đầu nhé." } }
          - { level: B2, job: { en: "Continuing", uk: "Продовження", es: "Continuar", pt: "Continuar", fr: "Poursuivre", de: "Weitermachen", it: "Proseguire", pl: "Kontynuacja", tr: "Sürdürmek", id: "Melanjutkan", vi: "Tiếp tục" }, words: { alternatives: [and, then, so, "I mean", "you see", "you know"] }, ex: ["I can't come. ", { target: "You see" }, ", I have to work."], tr: { uk: "Я не можу прийти. Розумієш, мені треба працювати.", es: "No puedo ir. Es que tengo que trabajar.", pt: "Eu não posso ir. É que eu tenho que trabalhar.", fr: "Je ne peux pas venir. Tu vois, je dois travailler.", de: "Ich kann nicht kommen. Weißt du, ich muss arbeiten.", it: "Non posso venire. Vedi, devo lavorare.", pl: "Nie mogę przyjść. Widzisz, muszę pracować.", tr: "Gelemem. Bak, çalışmam gerek.", id: "Saya tidak bisa datang. Begini, saya harus bekerja.", vi: "Tôi không đến được. Bạn thấy đấy, tôi phải làm việc." } }
          - { level: B2, job: { en: "Changing topic", uk: "Зміна теми", es: "Cambiar de tema", pt: "Mudar de assunto", fr: "Changer de sujet", de: "Das Thema wechseln", it: "Cambiare argomento", pl: "Zmiana tematu", tr: "Konu değiştirmek", id: "Berganti topik", vi: "Đổi chủ đề" }, words: { alternatives: ["by the way", "speaking of", "that reminds me"] }, ex: [{ target: "By the way" }, ", did you call Anna?"], tr: { uk: "До речі, ти зателефонував Анні?", es: "Por cierto, ¿llamaste a Ana?", pt: "A propósito, você ligou para a Ana?", fr: "Au fait, tu as appelé Anna ?", de: "Übrigens, hast du Anna angerufen?", it: "A proposito, hai chiamato Anna?", pl: "Przy okazji, dzwoniłeś do Anny?", tr: "Bu arada, Anna'yı aradın mı?", id: "Ngomong-ngomong, apakah kamu sudah menelepon Anna?", vi: "Nhân tiện, bạn đã gọi cho Anna chưa?" } }
          - { level: B2, job: { en: "Returning", uk: "Повернення до теми", es: "Volver al tema", pt: "Voltar ao assunto", fr: "Revenir au sujet", de: "Zum Thema zurückkehren", it: "Tornare all'argomento", pl: "Powrót do tematu", tr: "Konuya dönmek", id: "Kembali ke topik", vi: "Quay lại chủ đề" }, words: { alternatives: [anyway, "as I was saying", "to get back to"] }, ex: [{ target: "To get back to" }, " the budget, we have two weeks."], tr: { uk: "Повертаючись до бюджету: у нас є два тижні.", es: "Volviendo al presupuesto, tenemos dos semanas.", pt: "Voltando ao orçamento, temos duas semanas.", fr: "Pour revenir au budget, nous avons deux semaines.", de: "Zurück zum Budget: Wir haben zwei Wochen.", it: "Tornando al budget, abbiamo due settimane.", pl: "Wracając do budżetu: mamy dwa tygodnie.", tr: "Bütçeye dönersek, iki haftamız var.", id: "Kembali ke anggaran, kita punya waktu dua minggu.", vi: "Quay lại vấn đề ngân sách, chúng ta có hai tuần." } }
          - { level: B2, job: { en: "Checking", uk: "Перевірка", es: "Comprobar", pt: "Checar", fr: "Vérifier", de: "Nachfragen", it: "Verificare", pl: "Sprawdzenie", tr: "Kontrol etmek", id: "Memeriksa", vi: "Kiểm tra" }, words: { alternatives: ["you know?", "right?"] }, ex: ["It's a long way, ", { target: "you know" }, "? ", { intonation: rise }], tr: { uk: "Це далеко, розумієш?", es: "Queda lejos, ¿sabes?", pt: "É longe, sabe?", fr: "C’est loin, tu sais ?", de: "Das ist weit, weißt du?", it: "È lontano, sai?", pl: "To daleko, wiesz?", tr: "Yol uzun, biliyor musun?", id: "Jauh sekali, kamu tahu?", vi: "Đường xa lắm, bạn biết không?" } }
          - { level: B2, job: { en: "Correcting", uk: "Виправлення", es: "Corregir", pt: "Corrigir", fr: "Corriger", de: "Korrigieren", it: "Correggere", pl: "Poprawka", tr: "Düzeltmek", id: "Mengoreksi", vi: "Sửa lời" }, words: { alternatives: ["I mean", "or rather", "that is"] }, ex: { examples: [["We met on Monday, ", { target: "I mean" }, " Tuesday."], ["She lives in Leeds, ", { target: "or rather" }, " near Leeds."]] }, tr: { uk: { examples: ["Ми зустрілися в понеділок, тобто у вівторок.", "Вона живе в Лідсі, точніше, поблизу Лідса."] }, es: { examples: ["Nos vimos el lunes, o sea, el martes.", "Vive en Leeds, mejor dicho, cerca de Leeds."] }, pt: { examples: ["Nós nos encontramos na segunda, quer dizer, na terça.", "Ela mora em Leeds, ou melhor, perto de Leeds."] }, fr: { examples: ["Nous nous sommes vus lundi, enfin, mardi.", "Elle habite à Leeds, ou plutôt près de Leeds."] }, de: { examples: ["Wir haben uns am Montag getroffen, ich meine Dienstag.", "Sie wohnt in Leeds, genauer gesagt in der Nähe von Leeds."] }, it: { examples: ["Ci siamo visti lunedì, cioè martedì.", "Vive a Leeds, anzi vicino a Leeds."] }, pl: { examples: ["Spotkaliśmy się w poniedziałek, to znaczy we wtorek.", "Mieszka w Leeds, a raczej koło Leeds."] }, tr: { examples: ["Pazartesi görüştük, yani salı.", "Leeds'te yaşıyor, daha doğrusu Leeds yakınlarında."] }, id: { examples: ["Kami bertemu hari Senin, maksud saya hari Selasa.", "Dia tinggal di Leeds, atau lebih tepatnya dekat Leeds."] }, vi: { examples: ["Chúng tôi gặp nhau hôm thứ Hai, ý tôi là thứ Ba.", "Cô ấy sống ở Leeds, hay đúng hơn là gần Leeds."] } } }
          - { level: B2, job: { en: "Concluding", uk: "Завершення", es: "Concluir", pt: "Concluir", fr: "Conclure", de: "Abschließen", it: "Concludere", pl: "Zakończenie", tr: "Bitirmek", id: "Menyimpulkan", vi: "Kết thúc" }, words: { alternatives: [anyway, so, "that's it"] }, ex: ["That's the plan. ", { target: So }, ", see you at nine."], tr: { uk: "Такий план. Отже, до зустрічі о дев’ятій.", es: "Ese es el plan. Entonces, nos vemos a las nueve.", pt: "Esse é o plano. Então, até as nove.", fr: "Voilà le plan. Alors, à neuf heures.", de: "Das ist der Plan. Also, bis um neun.", it: "Questo è il piano. Quindi, ci vediamo alle nove.", pl: "Taki jest plan. No to do zobaczenia o dziewiątej.", tr: "Plan bu. O hâlde dokuzda görüşürüz.", id: "Itu rencananya. Jadi, sampai jumpa pukul sembilan.", vi: "Kế hoạch là thế. Vậy nhé, chín giờ gặp." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A marker usually opens its clause; a comma sets it off in writing and a pause in speech.", uk: "Маркер зазвичай відкриває речення; на письмі його відокремлює кома, а в усному мовленні — пауза.", es: "Un marcador suele abrir la oración; en la escritura lo separa una coma y en el habla, una pausa.", pt: "Um marcador costuma abrir a oração; na escrita, uma vírgula o separa, e na fala, uma pausa.", fr: "Un marqueur ouvre en général la proposition ; à l’écrit, une virgule l’isole, à l’oral, une pause.", de: "Ein Marker eröffnet meist den Satz; in der Schrift trennt ihn ein Komma ab, in der Rede eine Pause.", it: "Un segnale di solito apre la frase; per iscritto lo separa una virgola, nel parlato una pausa.", pl: "Marker zwykle otwiera zdanie; w piśmie oddziela go przecinek, a w mowie pauza.", tr: "Belirteç genellikle cümleyi açar; yazıda virgül, konuşmada duraksama onu ayırır.", id: "Penanda biasanya membuka klausa; dalam tulisan dipisahkan koma, dalam ujaran dipisahkan jeda.", vi: "Dấu hiệu thường mở đầu mệnh đề; khi viết có dấu phẩy tách ra, khi nói có chỗ ngắt." }
            ex: [{ target: Well }, ", I think we should wait."]
            tr: { uk: "Ну, мабуть, нам варто зачекати.", es: "Bueno, creo que deberíamos esperar.", pt: "Bem, acho que deveríamos esperar.", fr: "Bon, je pense qu’on devrait attendre.", de: "Na ja, ich finde, wir sollten warten.", it: "Beh, penso che dovremmo aspettare.", pl: "No cóż, myślę, że powinniśmy poczekać.", tr: "Şey, bence beklemeliyiz.", id: "Yah, menurut saya kita sebaiknya menunggu.", vi: "Ừm, tôi nghĩ chúng ta nên đợi." }
          - type: rule
            level: B2
            text: { en: "Checking markers come at the end of the clause and take a rising tune.", uk: "Маркери перевірки стоять наприкінці речення й мають висхідну інтонацію.", es: "Los marcadores de comprobación van al final de la oración y llevan entonación ascendente.", pt: "Os marcadores de checagem vêm no fim da oração e levam entonação ascendente.", fr: "Les marqueurs de vérification se placent à la fin de la proposition et prennent une intonation montante.", de: "Marker zum Nachfragen stehen am Satzende und haben steigende Intonation.", it: "I segnali di verifica stanno alla fine della frase e hanno un'intonazione ascendente.", pl: "Markery sprawdzające stoją na końcu zdania i mają intonację wznoszącą.", tr: "Kontrol belirteçleri cümlenin sonunda gelir ve yükselen tonlama alır.", id: "Penanda pengecekan berada di akhir klausa dan memakai intonasi naik.", vi: "Dấu hiệu kiểm tra đứng cuối mệnh đề và lên giọng." }
            ex: ["You're coming, ", { target: right }, "? ", { intonation: rise }]
            tr: { uk: "Ти ж прийдеш, так?", es: "Vienes, ¿verdad?", pt: "Você vem, certo?", fr: "Tu viens, non ?", de: "Du kommst doch, oder?", it: "Vieni anche tu, giusto?", pl: "Przyjdziesz, prawda?", tr: "Geliyorsun, değil mi?", id: "Kamu datang, kan?", vi: "Bạn đến chứ, đúng không?" }
          - type: rule
            level: B2
            text: { en: [{ term: Well }, ", ", { term: "you know" }, " and ", { term: "I mean" }, " are informal; ", { term: "by the way" }, " and ", { term: "as I was saying" }, " suit any situation."], uk: [{ term: "Well" }, ", ", { term: "you know" }, " і ", { term: "I mean" }, " неформальні; ", { term: "by the way" }, " і ", { term: "as I was saying" }, " підходять до будь-якої ситуації."], es: [{ term: "Well" }, ", ", { term: "you know" }, " y ", { term: "I mean" }, " son informales; ", { term: "by the way" }, " y ", { term: "as I was saying" }, " sirven en cualquier situación."], pt: [{ term: "Well" }, ", ", { term: "you know" }, " e ", { term: "I mean" }, " são informais; ", { term: "by the way" }, " e ", { term: "as I was saying" }, " servem em qualquer situação."], fr: [{ term: "Well" }, ", ", { term: "you know" }, " et ", { term: "I mean" }, " sont familiers ; ", { term: "by the way" }, " et ", { term: "as I was saying" }, " conviennent à toute situation."], de: [{ term: "Well" }, ", ", { term: "you know" }, " und ", { term: "I mean" }, " sind umgangssprachlich; ", { term: "by the way" }, " und ", { term: "as I was saying" }, " passen in jede Situation."], it: [{ term: "Well" }, ", ", { term: "you know" }, " e ", { term: "I mean" }, " sono informali; ", { term: "by the way" }, " e ", { term: "as I was saying" }, " vanno bene in ogni situazione."], pl: [{ term: "Well" }, ", ", { term: "you know" }, " i ", { term: "I mean" }, " są potoczne; ", { term: "by the way" }, " i ", { term: "as I was saying" }, " pasują do każdej sytuacji."], tr: [{ term: "Well" }, ", ", { term: "you know" }, " ve ", { term: "I mean" }, " günlük konuşma diline aittir; ", { term: "by the way" }, " ve ", { term: "as I was saying" }, " her durumda kullanılır."], id: [{ term: "Well" }, ", ", { term: "you know" }, " dan ", { term: "I mean" }, " bersifat tidak resmi; ", { term: "by the way" }, " dan ", { term: "as I was saying" }, " cocok untuk situasi apa pun."], vi: [{ term: "Well" }, ", ", { term: "you know" }, " và ", { term: "I mean" }, " mang tính thân mật; ", { term: "by the way" }, " và ", { term: "as I was saying" }, " dùng được trong mọi tình huống."] }
          - type: note
            level: B2
            text: { en: ["A question tag also checks a statement. See ", { link: "Question Tags", to: en.sentence-building.question-tags }, "."], uk: ["Розділове питання (question tag) теж перевіряє твердження. Див. ", { link: "Розділові питання", to: "en.sentence-building.question-tags" }, "."], es: ["Una pregunta coletilla también comprueba una afirmación. Ver ", { link: "Preguntas coletilla", to: "en.sentence-building.question-tags" }, "."], pt: ["Uma ", { term: "question tag" }, " também checa uma afirmação. Ver ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], fr: ["Un ", { term: "question tag" }, " vérifie aussi une affirmation. Voir ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], de: ["Auch ein ", { term: "Question Tag" }, " prüft eine Aussage. Siehe ", { link: "Question Tags", to: "en.sentence-building.question-tags" }, "."], it: ["Anche un ", { term: "question tag" }, " verifica un'affermazione. Vedi ", { link: "Question tag", to: "en.sentence-building.question-tags" }, "."], pl: ["Pytanie rozłączne również sprawdza twierdzenie. Zob. ", { link: "Pytania rozłączne", to: "en.sentence-building.question-tags" }, "."], tr: [{ term: "Question tag" }, " de bir ifadeyi kontrol eder. Bkz. ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], id: [{ term: "Question tag" }, " juga memeriksa sebuah pernyataan. Lihat ", { link: "Question tag", to: "en.sentence-building.question-tags" }, "."], vi: ["Câu hỏi đuôi cũng dùng để kiểm tra một câu khẳng định. Xem ", { link: "Câu hỏi đuôi", to: "en.sentence-building.question-tags" }, "."] }

  - title: { en: "Hedges and softeners", uk: "Пом’якшувачі та обережні формулювання", es: "Atenuadores y suavizadores", pt: "Atenuadores e suavizadores", fr: "Atténuateurs et adoucisseurs", de: "Abschwächer und Abmilderungen", it: "Attenuatori e ammorbidenti", pl: "Wyrażenia łagodzące i zmiękczające", tr: "Yumuşatıcılar ve hafifletici ifadeler", id: "Pelunak dan penghalus", vi: "Từ giảm nhẹ và cách nói mềm" }
    role: own
    content:
      - type: usage
        columns:
          - { key: softens, label: { en: "Softens", uk: "Що пом’якшує", es: "Qué suaviza", pt: "O que suaviza", fr: "Ce qu’il adoucit", de: "Mildert", it: "Cosa attenua", pl: "Co łagodzi", tr: "Neyi yumuşatır", id: "Yang dilunakkan", vi: "Làm nhẹ điều gì" } }
          - { key: words, label: { en: "Markers", uk: "Маркери", es: "Marcadores", pt: "Marcadores", fr: "Marqueurs", de: "Marker", it: "Segnali", pl: "Markery", tr: "Belirteçler", id: "Penanda", vi: "Dấu hiệu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, softens: { en: "A word", uk: "Слово", es: "Una palabra", pt: "Uma palavra", fr: "Un mot", de: "Ein Wort", it: "Una parola", pl: "Słowo", tr: "Bir sözcük", id: "Satu kata", vi: "Một từ" }, words: { alternatives: ["sort of", "kind of", "a bit", rather, somewhat, quite, fairly] }, ex: { examples: [["He is ", { target: "sort of" }, " shy."], ["The soup is ", { target: "a bit" }, " cold."]] }, tr: { uk: { examples: ["Він якийсь сором’язливий.", "Суп трохи холодний."] }, es: { examples: ["Es medio tímido.", "La sopa está un poco fría."] }, pt: { examples: ["Ele é meio tímido.", "A sopa está um pouco fria."] }, fr: { examples: ["Il est plutôt timide.", "La soupe est un peu froide."] }, de: { examples: ["Er ist irgendwie schüchtern.", "Die Suppe ist ein bisschen kalt."] }, it: { examples: ["È un tipo timido, diciamo.", "La zuppa è un po' fredda."] }, pl: { examples: ["On jest jakby nieśmiały.", "Zupa jest trochę zimna."] }, tr: { examples: ["O bir bakıma çekingen.", "Çorba biraz soğuk."] }, id: { examples: ["Dia semacam pemalu.", "Supnya sedikit dingin."] }, vi: { examples: ["Anh ấy kiểu hơi nhút nhát.", "Món súp nguội một chút."] } } }
          - { level: B2, softens: { en: "An opinion", uk: "Думка", es: "Una opinión", pt: "Uma opinião", fr: "Un avis", de: "Eine Meinung", it: "Un'opinione", pl: "Opinia", tr: "Bir görüş", id: "Sebuah pendapat", vi: "Một ý kiến" }, words: { alternatives: ["I'd say", "I suppose", "I guess", "if you ask me"] }, ex: [{ target: "I'd say" }, " it's too expensive."], tr: { uk: "Я б сказав, що це надто дорого.", es: "Diría que es demasiado caro.", pt: "Eu diria que é caro demais.", fr: "Je dirais que c’est trop cher.", de: "Ich würde sagen, das ist zu teuer.", it: "Direi che è troppo caro.", pl: "Powiedziałbym, że to za drogie.", tr: "Bence bu çok pahalı.", id: "Menurut saya, ini terlalu mahal.", vi: "Tôi cho là cái này quá đắt." } }
