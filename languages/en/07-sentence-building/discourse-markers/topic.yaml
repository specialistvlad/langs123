            text: { en: [{ term: "Sort of" }, " and ", { term: "kind of" }, " go before an adjective or a verb and sound informal."], uk: [{ term: "Sort of" }, " і ", { term: "kind of" }, " стоять перед прикметником або дієсловом і звучать неформально."], es: [{ term: "Sort of" }, " y ", { term: "kind of" }, " van antes de un adjetivo o de un verbo y suenan informales."], pt: [{ term: "Sort of" }, " e ", { term: "kind of" }, " vêm antes de um adjetivo ou de um verbo e soam informais."], fr: [{ term: "Sort of" }, " et ", { term: "kind of" }, " se placent devant un adjectif ou un verbe et sonnent familiers."], de: [{ term: "Sort of" }, " und ", { term: "kind of" }, " stehen vor einem Adjektiv oder einem Verb und klingen umgangssprachlich."], it: [{ term: "Sort of" }, " e ", { term: "kind of" }, " stanno davanti a un aggettivo o a un verbo e suonano informali."], pl: [{ term: "Sort of" }, " i ", { term: "kind of" }, " stoją przed przymiotnikiem lub czasownikiem i brzmią potocznie."], tr: [{ term: "Sort of" }, " ve ", { term: "kind of" }, " sıfatın ya da fiilin önüne gelir ve günlük konuşma dili gibi duyulur."], id: [{ term: "Sort of" }, " dan ", { term: "kind of" }, " berada di depan kata sifat atau kata kerja dan terdengar tidak resmi."], vi: [{ term: "Sort of" }, " và ", { term: "kind of" }, " đứng trước tính từ hoặc động từ và nghe thân mật."] }
