          - type: rule
            level: B2
            text: { en: [{ term: "Or anything" }, " follows a negative statement; ", { term: "or something" }, " follows a positive statement or an offer."], uk: [{ term: "Or anything" }, " стоїть після заперечного речення; ", { term: "or something" }, " — після ствердного речення або пропозиції."], es: [{ term: "Or anything" }, " sigue a una oración negativa; ", { term: "or something" }, " sigue a una oración afirmativa o a un ofrecimiento."], pt: [{ term: "Or anything" }, " vem depois de uma frase negativa; ", { term: "or something" }, " vem depois de uma frase afirmativa ou de uma oferta."], fr: [{ term: "Or anything" }, " suit une phrase négative ; ", { term: "or something" }, " suit une phrase affirmative ou une offre."], de: [{ term: "Or anything" }, " folgt auf einen verneinten Satz; ", { term: "or something" }, " folgt auf einen bejahten Satz oder ein Angebot."], it: [{ term: "Or anything" }, " segue una frase negativa; ", { term: "or something" }, " segue una frase affermativa o un'offerta."], pl: [{ term: "Or anything" }, " stoi po zdaniu przeczącym; ", { term: "or something" }, " — po zdaniu twierdzącym lub propozycji."], tr: [{ term: "Or anything" }, " olumsuz bir cümleden sonra gelir; ", { term: "or something" }, " olumlu bir cümleden ya da bir tekliften sonra gelir."], id: [{ term: "Or anything" }, " mengikuti kalimat negatif; ", { term: "or something" }, " mengikuti kalimat positif atau tawaran."], vi: [{ term: "Or anything" }, " đứng sau câu phủ định; ", { term: "or something" }, " đứng sau câu khẳng định hoặc lời mời."] }
            ex: { examples: [["I haven't got a pen ", { target: "or anything" }, "."], ["Do you want a drink ", { target: "or something" }, "?"]] }
            tr: { uk: { examples: ["У мене немає ручки чи чогось такого.", "Хочеш щось випити чи що?"] }, es: { examples: ["No tengo un bolígrafo ni nada por el estilo.", "¿Quieres una bebida o algo?"] }, pt: { examples: ["Eu não tenho uma caneta nem nada.", "Você quer uma bebida ou alguma coisa?"] }, fr: { examples: ["Je n’ai pas de stylo ni rien.", "Tu veux un verre ou quelque chose ?"] }, de: { examples: ["Ich habe keinen Stift oder so etwas.", "Willst du etwas trinken oder so?"] }, it: { examples: ["Non ho una penna o niente del genere.", "Vuoi qualcosa da bere o qualcosa del genere?"] }, pl: { examples: ["Nie mam długopisu ani niczego takiego.", "Chcesz coś do picia czy coś?"] }, tr: { examples: ["Kalem falan yok bende.", "İçecek bir şey ister misin falan?"] }, id: { examples: ["Saya tidak punya pulpen atau apa pun.", "Mau minum sesuatu atau apa?"] }, vi: { examples: ["Tôi không có cây bút nào hay gì cả.", "Bạn muốn uống gì đó không?"] } }
          - type: rule
            level: B2
            text: { en: "Vague language suits friendly speech; formal writing gives the exact name or number.", uk: "Нечітка мова пасує дружній розмові; у формальному письмі треба називати точну назву або число.", es: "El lenguaje vago va bien con el habla amistosa; la escritura formal da el nombre o el número exacto.", pt: "A linguagem vaga combina com a fala amigável; a escrita formal dá o nome ou o número exato.", fr: "Le langage vague convient à la conversation amicale ; l’écrit formel donne le nom ou le chiffre exact.", de: "Vage Sprache passt zu freundlichem Sprechen; formelles Schreiben nennt den genauen Namen oder die genaue Zahl.", it: "Il linguaggio vago si addice al parlato amichevole; la scrittura formale dà il nome o il numero esatto.", pl: "Język niedookreślony pasuje do przyjacielskiej rozmowy; tekst formalny podaje dokładną nazwę lub liczbę.", tr: "Belirsiz dil samimi konuşmaya uygundur; resmî yazı tam adı ya da sayıyı verir.", id: "Bahasa tidak tentu cocok untuk percakapan akrab; tulisan formal menyebut nama atau angka yang tepat.", vi: "Ngôn ngữ mơ hồ hợp với lời nói thân mật; văn viết trang trọng nêu tên hoặc con số chính xác." }

  - title: { en: "Turn-taking", uk: "Черговість реплік", es: "Turnos de palabra", pt: "Troca de turnos", fr: "Tours de parole", de: "Sprecherwechsel", it: "Turni di parola", pl: "Zmiana mówcy", tr: "Söz sırası", id: "Pergantian giliran bicara", vi: "Luân phiên lượt lời" }
    role: own
    content:
      - type: usage
        columns:
          - { key: move, label: { en: "Move", uk: "Дія", es: "Acción", pt: "Ação", fr: "Action", de: "Handlung", it: "Mossa", pl: "Działanie", tr: "Hamle", id: "Tindakan", vi: "Hành động" } }
          - { key: words, label: { en: "Words", uk: "Слова", es: "Palabras", pt: "Palavras", fr: "Mots", de: "Wörter", it: "Parole", pl: "Słowa", tr: "Sözcükler", id: "Kata", vi: "Từ" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, move: { en: "Filling a pause", uk: "Заповнення паузи", es: "Llenar una pausa", pt: "Preencher uma pausa", fr: "Combler une pause", de: "Eine Pause füllen", it: "Riempire una pausa", pl: "Wypełnienie pauzy", tr: "Duraksamayı doldurmak", id: "Mengisi jeda", vi: "Lấp chỗ ngắt" }, words: { alternatives: [er, um] }, ex: ["It was, ", { target: um }, ", about ten years ago."], tr: { uk: "Це було, ем, років десять тому.", es: "Fue, eh, hace unos diez años.", pt: "Foi, hã, há uns dez anos.", fr: "C’était, euh, il y a une dizaine d’années.", de: "Das war, äh, vor etwa zehn Jahren.", it: "Era, ehm, circa dieci anni fa.", pl: "To było, yyy, jakieś dziesięć lat temu.", tr: "Bu, şey, yaklaşık on yıl önceydi.", id: "Itu, eh, sekitar sepuluh tahun yang lalu.", vi: "Chuyện đó, ừm, khoảng mười năm trước." } }
          - { level: B2, move: { en: "Holding the floor", uk: "Утримання слова", es: "Mantener la palabra", pt: "Manter a palavra", fr: "Garder la parole", de: "Das Wort behalten", it: "Tenere la parola", pl: "Utrzymanie głosu", tr: "Sözü korumak", id: "Mempertahankan giliran", vi: "Giữ lượt lời" }, words: { alternatives: ["let me think", "how shall I put it"] }, ex: [{ target: "How shall I put it" }, "? It was a surprise."], tr: { uk: "Як би це сказати? Це був сюрприз.", es: "¿Cómo lo diría? Fue una sorpresa.", pt: "Como posso dizer? Foi uma surpresa.", fr: "Comment dire ? Ce fut une surprise.", de: "Wie soll ich sagen? Es war eine Überraschung.", it: "Come dire? È stata una sorpresa.", pl: "Jak to powiedzieć? To była niespodzianka.", tr: "Nasıl desem? Bir sürprizdi.", id: "Bagaimana mengatakannya? Itu sebuah kejutan.", vi: "Nói sao nhỉ? Đó là một bất ngờ." } }
          - { level: B2, move: { en: "Interrupting politely", uk: "Ввічливе перебивання", es: "Interrumpir con cortesía", pt: "Interromper com educação", fr: "Interrompre poliment", de: "Höflich unterbrechen", it: "Interrompere con garbo", pl: "Uprzejme przerwanie", tr: "Nazikçe sözü kesmek", id: "Menyela dengan sopan", vi: "Ngắt lời lịch sự" }, words: { alternatives: [["Sorry to interrupt, but ", { gap: true }], ["Can I just say ", { gap: true }]] }, ex: [{ target: "Sorry to interrupt" }, ", but the shop closes at five."], tr: { uk: "Вибачте, що перебиваю, але магазин зачиняється о п’ятій.", es: "Perdón que interrumpa, pero la tienda cierra a las cinco.", pt: "Desculpe interromper, mas a loja fecha às cinco.", fr: "Désolé de vous interrompre, mais le magasin ferme à cinq heures.", de: "Entschuldigung, wenn ich unterbreche, aber das Geschäft schließt um fünf.", it: "Scusa se ti interrompo, ma il negozio chiude alle cinque.", pl: "Przepraszam, że przerywam, ale sklep zamykają o piątej.", tr: "Sözünüzü kestiğim için özür dilerim ama mağaza beşte kapanıyor.", id: "Maaf menyela, tetapi tokonya tutup pukul lima.", vi: "Xin lỗi vì đã ngắt lời, nhưng cửa hàng đóng cửa lúc năm giờ." } }
          - { level: B2, move: { en: "Agreeing in part", uk: "Часткова згода", es: "Estar de acuerdo en parte", pt: "Concordar em parte", fr: "Approuver en partie", de: "Teilweise zustimmen", it: "Essere d'accordo in parte", pl: "Częściowa zgoda", tr: "Kısmen katılmak", id: "Setuju sebagian", vi: "Đồng ý một phần" }, words: ["I see what you mean, but ", { gap: true }], ex: [{ target: "I see what you mean" }, ", but it costs too much."], tr: { uk: "Я розумію, що ви маєте на увазі, але це надто дорого.", es: "Entiendo lo que dices, pero cuesta demasiado.", pt: "Entendo o que você quer dizer, mas custa caro demais.", fr: "Je vois ce que tu veux dire, mais ça coûte trop cher.", de: "Ich verstehe, was du meinst, aber es kostet zu viel.", it: "Capisco cosa intendi, ma costa troppo.", pl: "Rozumiem, co masz na myśli, ale to za dużo kosztuje.", tr: "Ne demek istediğini anlıyorum ama çok pahalı.", id: "Saya mengerti maksud Anda, tetapi harganya terlalu mahal.", vi: "Tôi hiểu ý bạn, nhưng nó tốn quá nhiều tiền." } }
          - { level: B2, move: { en: "Disagreeing gently", uk: "М’яка незгода", es: "Discrepar con suavidad", pt: "Discordar com delicadeza", fr: "Contredire avec douceur", de: "Sanft widersprechen", it: "Dissentire con delicatezza", pl: "Łagodny sprzeciw", tr: "Nazikçe karşı çıkmak", id: "Tidak setuju dengan halus", vi: "Phản đối nhẹ nhàng" }, words: "I'm not so sure", ex: { exchange: ["It's the best plan.", [{ target: "I'm not so sure" }, "."]] }, tr: { uk: { exchange: ["Це найкращий план.", "Я не такий певний."] }, es: { exchange: ["Es el mejor plan.", "No estoy tan seguro."] }, pt: { exchange: ["É o melhor plano.", "Não tenho tanta certeza."] }, fr: { exchange: ["C’est le meilleur plan.", "Je n’en suis pas si sûr."] }, de: { exchange: ["Das ist der beste Plan.", "Da bin ich mir nicht so sicher."] }, it: { exchange: ["È il piano migliore.", "Non ne sono così sicuro."] }, pl: { exchange: ["To najlepszy plan.", "Nie jestem tego taki pewien."] }, tr: { exchange: ["Bu en iyi plan.", "Pek emin değilim."] }, id: { exchange: ["Ini rencana terbaik.", "Saya tidak begitu yakin."] }, vi: { exchange: ["Đây là kế hoạch tốt nhất.", "Tôi không chắc lắm."] } } }
          - { level: B2, move: { en: "Showing you listen", uk: "Показати, що слухаєш", es: "Mostrar que se escucha", pt: "Mostrar que você escuta", fr: "Montrer qu’on écoute", de: "Zeigen, dass man zuhört", it: "Mostrare che si ascolta", pl: "Okazanie, że się słucha", tr: "Dinlediğini göstermek", id: "Menunjukkan bahwa kita menyimak", vi: "Cho thấy bạn đang nghe" }, words: { alternatives: ["uh-huh", "I see", really] }, ex: { exchange: ["I got the job!", [{ target: Really }, "? ", { intonation: rise }]] }, tr: { uk: { exchange: ["Я отримав роботу!", "Справді?"] }, es: { exchange: ["¡Conseguí el trabajo!", "¿De verdad?"] }, pt: { exchange: ["Consegui o emprego!", "Sério?"] }, fr: { exchange: ["J’ai eu le poste !", "Vraiment ?"] }, de: { exchange: ["Ich habe die Stelle bekommen!", "Echt?"] }, it: { exchange: ["Ho avuto il lavoro!", "Davvero?"] }, pl: { exchange: ["Dostałem tę pracę!", "Naprawdę?"] }, tr: { exchange: ["İşi aldım!", "Gerçekten mi?"] }, id: { exchange: ["Saya diterima kerja!", "Benarkah?"] }, vi: { exchange: ["Tôi nhận được việc rồi!", "Thật à?"] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A backchannel word is short, and the speaker keeps the turn.", uk: "Сигнал слухача короткий, і мовець не втрачає слова.", es: "Una señal de escucha es corta, y el hablante conserva el turno.", pt: "Um sinal de escuta é curto, e quem fala mantém a vez.", fr: "Un signal d’écoute est bref, et le locuteur garde la parole.", de: "Ein Hörersignal ist kurz, und der Sprecher behält das Wort.", it: "Un segnale di ascolto è breve, e chi parla mantiene il turno.", pl: "Sygnał słuchania jest krótki, a mówiący zachowuje głos.", tr: "Dinleme sinyali kısadır ve konuşan sözü bırakmaz.", id: "Tanda menyimak itu singkat, dan pembicara tetap memegang giliran.", vi: "Tín hiệu lắng nghe rất ngắn, và người nói vẫn giữ lượt lời." }
            ex: { exchange: ["First I went to Leeds.", [{ target: "Uh-huh" }, "."]] }
            tr: { uk: { exchange: ["Спершу я поїхав до Лідса.", "Угу."] }, es: { exchange: ["Primero fui a Leeds.", "Aja."] }, pt: { exchange: ["Primeiro fui a Leeds.", "Aham."] }, fr: { exchange: ["D’abord, je suis allé à Leeds.", "Mm-mm."] }, de: { exchange: ["Zuerst bin ich nach Leeds gefahren.", "Mhm."] }, it: { exchange: ["Prima sono andato a Leeds.", "Mm-mm."] }, pl: { exchange: ["Najpierw pojechałem do Leeds.", "Aha."] }, tr: { exchange: ["Önce Leeds'e gittim.", "Hı hı."] }, id: { exchange: ["Pertama saya pergi ke Leeds.", "Hm-hm."] }, vi: { exchange: ["Đầu tiên tôi đến Leeds.", "Ừm."] } }

  - title: { en: "Stance markers", uk: "Маркери позиції мовця", es: "Marcadores de postura", pt: "Marcadores de posicionamento", fr: "Marqueurs de positionnement", de: "Marker der Sprechereinstellung", it: "Segnali di posizione del parlante", pl: "Markery postawy mówiącego", tr: "Tutum belirteçleri", id: "Penanda sikap", vi: "Dấu hiệu thái độ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: stance, label: { en: "Stance", uk: "Позиція", es: "Postura", pt: "Posicionamento", fr: "Positionnement", de: "Haltung", it: "Posizione", pl: "Postawa", tr: "Tutum", id: "Sikap", vi: "Thái độ" } }
          - { key: words, label: { en: "Markers", uk: "Маркери", es: "Marcadores", pt: "Marcadores", fr: "Marqueurs", de: "Marker", it: "Segnali", pl: "Markery", tr: "Belirteçler", id: "Penanda", vi: "Dấu hiệu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, stance: { en: "Frankness", uk: "Відвертість", es: "Franqueza", pt: "Franqueza", fr: "Franchise", de: "Offenheit", it: "Franchezza", pl: "Szczerość", tr: "Açık sözlülük", id: "Keterusterangan", vi: "Sự thẳng thắn" }, words: { alternatives: [frankly, honestly, "to tell the truth"] }, ex: [{ target: Frankly }, ", I found the book dull."], tr: { uk: "Відверто кажучи, книжка здалася мені нудною.", es: "Francamente, el libro me pareció aburrido.", pt: "Francamente, achei o livro chato.", fr: "Franchement, j’ai trouvé le livre ennuyeux.", de: "Ehrlich gesagt fand ich das Buch langweilig.", it: "Francamente, ho trovato il libro noioso.", pl: "Szczerze mówiąc, książka wydała mi się nudna.", tr: "Açıkçası kitabı sıkıcı buldum.", id: "Terus terang, saya merasa buku itu membosankan.", vi: "Nói thẳng ra, tôi thấy cuốn sách này chán." } }
          - { level: C1, stance: { en: "Fairness to the other side", uk: "Справедливість до іншої сторони", es: "Justicia hacia la otra parte", pt: "Justiça com o outro lado", fr: "Équité envers l’autre point de vue", de: "Fairness gegenüber der Gegenseite", it: "Correttezza verso l'altra parte", pl: "Uczciwość wobec drugiej strony", tr: "Karşı tarafa adil davranmak", id: "Bersikap adil kepada pihak lain", vi: "Công bằng với phía bên kia" }, words: { alternatives: ["to be fair", "mind you", "then again"] }, ex: { examples: [[{ target: "To be fair" }, ", he did say sorry."], ["The hotel was noisy. ", { target: "Mind you" }, ", it was cheap."]] }, tr: { uk: { examples: ["Справедливості заради, він таки перепросив.", "Готель був галасливий. Щоправда, він був дешевий."] }, es: { examples: ["Para ser justos, sí pidió perdón.", "El hotel era ruidoso. Eso sí, era barato."] }, pt: { examples: ["Para ser justo, ele pediu desculpas, sim.", "O hotel era barulhento. Em compensação, era barato."] }, fr: { examples: ["Pour être juste, il s’est quand même excusé.", "L’hôtel était bruyant. Remarquez, il n’était pas cher."] }, de: { examples: ["Fairerweise muss man sagen: Er hat sich entschuldigt.", "Das Hotel war laut. Allerdings war es billig."] }, it: { examples: ["Per essere onesti, si è scusato.", "L'hotel era rumoroso. Però costava poco."] }, pl: { examples: ["Żeby być sprawiedliwym, on jednak przeprosił.", "Hotel był hałaśliwy. Ale z drugiej strony był tani."] }, tr: { examples: ["Adil olmak gerekirse, özür diledi.", "Otel gürültülüydü. Gerçi ucuzdu."] }, id: { examples: ["Harus diakui, dia memang sudah minta maaf.", "Hotelnya berisik. Namun, harganya murah."] }, vi: { examples: ["Công bằng mà nói, anh ấy đã xin lỗi.", "Khách sạn ồn ào. Nhưng phải nói là nó rẻ."] } } }
          - { level: C1, stance: { en: "A reason to accept", uk: "Причина погодитися", es: "Una razón para aceptar", pt: "Uma razão para aceitar", fr: "Une raison d’accepter", de: "Ein Grund, es hinzunehmen", it: "Un motivo per accettare", pl: "Powód, by się zgodzić", tr: "Kabul etmek için bir neden", id: "Alasan untuk menerima", vi: "Một lý do để chấp nhận" }, words: "after all", ex: ["Let her go. ", { target: "After all" }, ", she is an adult."], tr: { uk: "Нехай іде. Зрештою, вона доросла.", es: "Déjala ir. Después de todo, es adulta.", pt: "Deixe-a ir. Afinal, ela é adulta.", fr: "Laisse-la partir. Après tout, elle est adulte.", de: "Lass sie gehen. Sie ist schließlich erwachsen.", it: "Lasciala andare. Dopotutto, è un'adulta.", pl: "Niech idzie. W końcu jest dorosła.", tr: "Gitmesine izin ver. Sonuçta o yetişkin biri.", id: "Biarkan dia pergi. Lagi pula, dia sudah dewasa.", vi: "Cứ để cô ấy đi. Dù sao thì cô ấy cũng là người lớn." } }
          - { level: C1, stance: { en: "A fact that corrects or surprises", uk: "Факт, що виправляє або дивує", es: "Un hecho que corrige o sorprende", pt: "Um fato que corrige ou surpreende", fr: "Un fait qui corrige ou surprend", de: "Eine Tatsache, die korrigiert oder überrascht", it: "Un fatto che corregge o sorprende", pl: "Fakt, który prostuje lub zaskakuje", tr: "Düzelten ya da şaşırtan bir olgu", id: "Fakta yang mengoreksi atau mengejutkan", vi: "Một sự thật sửa lại hoặc gây bất ngờ" }, words: { alternatives: ["as a matter of fact", "in fact", actually] }, ex: ["I thought he was rich. ", { target: Actually }, ", he has no money."], tr: { uk: "Я думав, що він багатий. Насправді в нього немає грошей.", es: "Pensé que era rico. En realidad, no tiene dinero.", pt: "Pensei que ele fosse rico. Na verdade, ele não tem dinheiro.", fr: "Je pensais qu’il était riche. En fait, il n’a pas d’argent.", de: "Ich dachte, er sei reich. Tatsächlich hat er kein Geld.", it: "Pensavo che fosse ricco. In realtà, non ha soldi.", pl: "Myślałem, że jest bogaty. Tak naprawdę nie ma pieniędzy.", tr: "Onun zengin olduğunu sanıyordum. Aslında parası yok.", id: "Saya kira dia kaya. Sebenarnya, dia tidak punya uang.", vi: "Tôi tưởng anh ấy giàu. Thật ra, anh ấy không có tiền." } }
          - { level: C1, stance: { en: "Whatever happens", uk: "Що б не сталося", es: "Pase lo que pase", pt: "Aconteça o que acontecer", fr: "Quoi qu’il arrive", de: "Was auch geschieht", it: "Comunque vada", pl: "Cokolwiek się zdarzy", tr: "Ne olursa olsun", id: "Apa pun yang terjadi", vi: "Dù chuyện gì xảy ra" }, words: "in any case", ex: [{ target: "In any case" }, ", we have until Friday."], tr: { uk: "У будь-якому разі, ми маємо час до п’ятниці.", es: "De todos modos, tenemos hasta el viernes.", pt: "De qualquer modo, temos até sexta-feira.", fr: "De toute façon, nous avons jusqu’à vendredi.", de: "Auf jeden Fall haben wir bis Freitag Zeit.", it: "In ogni caso, abbiamo tempo fino a venerdì.", pl: "W każdym razie mamy czas do piątku.", tr: "Her halükârda cumaya kadar vaktimiz var.", id: "Bagaimanapun, kita punya waktu sampai hari Jumat.", vi: "Dù sao thì, chúng ta có thời gian đến thứ Sáu." } }
          - { level: C1, stance: { en: "A bright side or a minimum", uk: "Світлий бік або мінімум", es: "Un lado bueno o un mínimo", pt: "Um lado bom ou um mínimo", fr: "Un point positif ou un minimum", de: "Ein Lichtblick oder ein Minimum", it: "Un lato positivo o un minimo", pl: "Jasna strona lub minimum", tr: "İyi bir yan ya da asgari bir ölçü", id: "Sisi baik atau batas minimum", vi: "Mặt tốt hoặc mức tối thiểu" }, words: "at least", ex: { examples: [[{ target: "At least" }, " it didn't rain."], ["Call me ", { target: "at least" }, " once a week."]] }, tr: { uk: { examples: ["Принаймні дощу не було.", "Телефонуй мені хоча б раз на тиждень."] }, es: { examples: ["Al menos no llovió.", "Llámame al menos una vez por semana."] }, pt: { examples: ["Pelo menos não choveu.", "Me ligue pelo menos uma vez por semana."] }, fr: { examples: ["Au moins, il n’a pas plu.", "Appelle-moi au moins une fois par semaine."] }, de: { examples: ["Wenigstens hat es nicht geregnet.", "Ruf mich wenigstens einmal pro Woche an."] }, it: { examples: ["Almeno non ha piovuto.", "Chiamami almeno una volta alla settimana."] }, pl: { examples: ["Przynajmniej nie padało.", "Dzwoń do mnie przynajmniej raz w tygodniu."] }, tr: { examples: ["En azından yağmur yağmadı.", "Beni haftada en az bir kez ara."] }, id: { examples: ["Setidaknya tidak hujan.", "Telepon saya paling tidak seminggu sekali."] }, vi: { examples: ["Ít nhất thì trời không mưa.", "Hãy gọi cho tôi ít nhất một lần mỗi tuần."] } } }
          - { level: C1, stance: { en: "Restating", uk: "Перефразування", es: "Reformular", pt: "Reformular", fr: "Reformuler", de: "Umformulieren", it: "Riformulare", pl: "Przeformułowanie", tr: "Yeniden ifade etmek", id: "Merumuskan ulang", vi: "Diễn đạt lại" }, words: "in other words", ex: ["He was let go. ", { target: "In other words" }, ", he was fired."], tr: { uk: "Його звільнили. Іншими словами, його вигнали.", es: "Lo dejaron ir. En otras palabras, lo despidieron.", pt: "Ele foi dispensado. Em outras palavras, foi demitido.", fr: "On l’a laissé partir. Autrement dit, il a été renvoyé.", de: "Man hat ihn gehen lassen. Mit anderen Worten: Er wurde entlassen.", it: "Lo hanno lasciato andare. In altre parole, è stato licenziato.", pl: "Zwolniono go. Innymi słowy, wyrzucono go z pracy.", tr: "İşine son verildi. Başka bir deyişle, kovuldu.", id: "Dia dilepas. Dengan kata lain, dia dipecat.", vi: "Anh ấy bị cho thôi việc. Nói cách khác, anh ấy bị sa thải." } }
          - { level: C1, stance: { en: "A loose fit", uk: "Неточний збіг", es: "Un ajuste aproximado", pt: "Um encaixe aproximado", fr: "Un rapprochement approximatif", de: "Eine lose Entsprechung", it: "Una corrispondenza approssimativa", pl: "Luźne dopasowanie", tr: "Gevşek bir uyum", id: "Padanan yang longgar", vi: "Cách nói tương đối" }, words: { alternatives: ["so to speak", "as it were", "in a sense"] }, ex: ["He is, ", { target: "so to speak" }, ", the boss's right hand."], tr: { uk: "Він, так би мовити, права рука начальника.", es: "Es, por así decirlo, la mano derecha del jefe.", pt: "Ele é, por assim dizer, o braço direito do chefe.", fr: "Il est, pour ainsi dire, le bras droit du patron.", de: "Er ist sozusagen die rechte Hand des Chefs.", it: "È, per così dire, il braccio destro del capo.", pl: "Jest, że tak powiem, prawą ręką szefa.", tr: "O, tabir caizse, patronun sağ kolu.", id: "Dia, boleh dibilang, tangan kanan bosnya.", vi: "Anh ấy, có thể nói là, cánh tay phải của sếp." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: "Mind you" }, " and ", { term: "then again" }, " follow a statement and add a point that weakens it."], uk: [{ term: "Mind you" }, " і ", { term: "then again" }, " стоять після твердження й додають думку, що його послаблює."], es: [{ term: "Mind you" }, " y ", { term: "then again" }, " siguen a una afirmación y añaden un punto que la debilita."], pt: [{ term: "Mind you" }, " e ", { term: "then again" }, " vêm depois de uma afirmação e acrescentam um ponto que a enfraquece."], fr: [{ term: "Mind you" }, " et ", { term: "then again" }, " suivent une affirmation et ajoutent un point qui l’affaiblit."], de: [{ term: "Mind you" }, " und ", { term: "then again" }, " folgen auf eine Aussage und fügen einen Punkt hinzu, der sie abschwächt."], it: [{ term: "Mind you" }, " e ", { term: "then again" }, " seguono un'affermazione e aggiungono un punto che la indebolisce."], pl: [{ term: "Mind you" }, " i ", { term: "then again" }, " stoją po twierdzeniu i dodają myśl, która je osłabia."], tr: [{ term: "Mind you" }, " ve ", { term: "then again" }, " bir ifadeden sonra gelir ve onu zayıflatan bir nokta ekler."], id: [{ term: "Mind you" }, " dan ", { term: "then again" }, " mengikuti sebuah pernyataan dan menambahkan hal yang melemahkannya."], vi: [{ term: "Mind you" }, " và ", { term: "then again" }, " đứng sau một câu và thêm một ý làm yếu câu đó."] }
            ex: ["The film was long. ", { target: "Then again" }, ", it was good."]
            tr: { uk: "Фільм був довгий. Зате він був хороший.", es: "La película fue larga. Por otra parte, estuvo buena.", pt: "O filme foi longo. Por outro lado, foi bom.", fr: "Le film était long. Mais, d’un autre côté, il était bon.", de: "Der Film war lang. Andererseits war er gut.", it: "Il film era lungo. D'altra parte, era bello.", pl: "Film był długi. Z drugiej strony był dobry.", tr: "Film uzundu. Öte yandan iyiydi.", id: "Filmnya panjang. Di sisi lain, filmnya bagus.", vi: "Bộ phim dài. Mặt khác, phim hay." }

  - title: { en: "Hedging and boosting in academic writing", uk: "Пом’якшення й підсилення в науковому тексті", es: "Atenuación e intensificación en la escritura académica", pt: "Atenuação e reforço na escrita acadêmica", fr: "Atténuation et renforcement dans l’écrit académique", de: "Abschwächen und Verstärken in wissenschaftlichen Texten", it: "Attenuazione e rafforzamento nella scrittura accademica", pl: "Łagodzenie i wzmacnianie w tekście naukowym", tr: "Akademik yazıda yumuşatma ve pekiştirme", id: "Pelunakan dan penegasan dalam tulisan akademik", vi: "Giảm nhẹ và nhấn mạnh trong văn bản học thuật" }
    role: own
    content:
      - type: usage
        columns:
          - { key: device, label: { en: "Device", uk: "Засіб", es: "Recurso", pt: "Recurso", fr: "Procédé", de: "Mittel", it: "Strumento", pl: "Środek", tr: "Araç", id: "Sarana", vi: "Phương tiện" } }
          - { key: words, label: { en: "Words", uk: "Слова", es: "Palabras", pt: "Palavras", fr: "Mots", de: "Wörter", it: "Parole", pl: "Słowa", tr: "Sözcükler", id: "Kata", vi: "Từ" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, device: { en: "A hedging verb", uk: "Дієслово-пом’якшувач", es: "Un verbo atenuador", pt: "Um verbo atenuador", fr: "Un verbe atténuateur", de: "Ein abschwächendes Verb", it: "Un verbo attenuativo", pl: "Czasownik łagodzący", tr: "Yumuşatıcı bir fiil", id: "Kata kerja pelunak", vi: "Động từ giảm nhẹ" }, words: { alternatives: ["tend to", "appear to", "seem to"] }, ex: ["Prices ", { target: "tend to" }, " rise in summer."], tr: { uk: "Влітку ціни, як правило, зростають.", es: "Los precios tienden a subir en verano.", pt: "Os preços tendem a subir no verão.", fr: "Les prix ont tendance à monter en été.", de: "Die Preise steigen im Sommer tendenziell.", it: "I prezzi tendono ad aumentare in estate.", pl: "Latem ceny mają tendencję do wzrostu.", tr: "Fiyatlar yazın artma eğilimindedir.", id: "Harga cenderung naik pada musim panas.", vi: "Giá thường có xu hướng tăng vào mùa hè." } }
          - { level: C1, device: { en: "A modal verb", uk: "Модальне дієслово", es: "Un verbo modal", pt: "Um verbo modal", fr: "Un verbe modal", de: "Ein Modalverb", it: "Un verbo modale", pl: "Czasownik modalny", tr: "Bir modal fiil", id: "Kata kerja modal", vi: "Động từ khuyết thiếu" }, words: { alternatives: [may, might, could] }, ex: ["The change ", { target: may }, " reduce costs."], tr: { uk: "Ця зміна може зменшити витрати.", es: "El cambio puede reducir los costos.", pt: "A mudança pode reduzir os custos.", fr: "Ce changement peut réduire les coûts.", de: "Die Änderung kann die Kosten senken.", it: "Il cambiamento può ridurre i costi.", pl: "Ta zmiana może obniżyć koszty.", tr: "Bu değişiklik maliyetleri düşürebilir.", id: "Perubahan ini dapat mengurangi biaya.", vi: "Sự thay đổi này có thể giảm chi phí." } }
          - { level: C1, device: { en: "A reporting verb", uk: "Дієслово повідомлення", es: "Un verbo introductorio", pt: "Um verbo introdutório", fr: "Un verbe introducteur", de: "Ein einleitendes Verb", it: "Un verbo introduttivo", pl: "Czasownik wprowadzający", tr: "Bir aktarma fiili", id: "Kata kerja pelapor", vi: "Động từ tường thuật" }, words: { alternatives: [suggest, indicate] }, ex: ["The survey ", { target: suggests }, " that most people agree."], tr: { uk: "Опитування свідчить, що більшість людей згодні.", es: "La encuesta sugiere que la mayoría está de acuerdo.", pt: "A pesquisa sugere que a maioria concorda.", fr: "L’enquête suggère que la plupart des gens sont d’accord.", de: "Die Umfrage legt nahe, dass die meisten Menschen zustimmen.", it: "Il sondaggio suggerisce che la maggior parte delle persone è d'accordo.", pl: "Ankieta sugeruje, że większość ludzi się zgadza.", tr: "Anket, çoğu insanın hemfikir olduğunu gösteriyor.", id: "Survei itu menunjukkan bahwa sebagian besar orang setuju.", vi: "Cuộc khảo sát cho thấy đa số mọi người đồng ý." } }
          - { level: C1, device: { en: "A probability phrase", uk: "Вираз імовірності", es: "Una expresión de probabilidad", pt: "Uma expressão de probabilidade", fr: "Une expression de probabilité", de: "Eine Wahrscheinlichkeitsformel", it: "Un'espressione di probabilità", pl: "Wyrażenie prawdopodobieństwa", tr: "Olasılık bildiren bir ifade", id: "Frasa kemungkinan", vi: "Cụm chỉ khả năng" }, words: { alternatives: ["it is likely that", "it is possible that"] }, ex: [{ target: "It is likely that" }, " demand will grow."], tr: { uk: "Імовірно, попит зросте.", es: "Es probable que la demanda crezca.", pt: "É provável que a demanda cresça.", fr: "Il est probable que la demande augmente.", de: "Es ist wahrscheinlich, dass die Nachfrage wächst.", it: "È probabile che la domanda cresca.", pl: "Prawdopodobnie popyt wzrośnie.", tr: "Talebin artması muhtemeldir.", id: "Besar kemungkinan permintaan akan naik.", vi: "Nhiều khả năng nhu cầu sẽ tăng." } }
          - { level: C1, device: { en: "A limiting adverb", uk: "Обмежувальний прислівник", es: "Un adverbio limitador", pt: "Um advérbio limitador", fr: "Un adverbe restrictif", de: "Ein einschränkendes Adverb", it: "Un avverbio limitativo", pl: "Przysłówek ograniczający", tr: "Sınırlayıcı bir zarf", id: "Adverbia pembatas", vi: "Trạng từ giới hạn" }, words: { alternatives: ["to some extent", largely, generally, "on the whole"] }, ex: ["The project was ", { target: largely }, " a success."], tr: { uk: "Проєкт був здебільшого успішним.", es: "El proyecto fue en gran parte un éxito.", pt: "O projeto foi, em grande parte, um sucesso.", fr: "Le projet a été en grande partie un succès.", de: "Das Projekt war größtenteils ein Erfolg.", it: "Il progetto è stato in gran parte un successo.", pl: "Projekt był w dużej mierze sukcesem.", tr: "Proje büyük ölçüde başarılı oldu.", id: "Proyek itu sebagian besar berhasil.", vi: "Dự án phần lớn đã thành công." } }
          - { level: C1, device: { en: "An attitude adverb", uk: "Прислівник ставлення", es: "Un adverbio de actitud", pt: "Um advérbio de atitude", fr: "Un adverbe d’attitude", de: "Ein Einstellungsadverb", it: "Un avverbio di atteggiamento", pl: "Przysłówek wyrażający postawę", tr: "Tutum bildiren bir zarf", id: "Adverbia sikap", vi: "Trạng từ chỉ thái độ" }, words: { alternatives: [arguably, presumably] }, ex: ["This is ", { target: arguably }, " the best result so far."], tr: { uk: "Це, можна сказати, найкращий результат на сьогодні.", es: "Este es, se podría decir, el mejor resultado hasta ahora.", pt: "Pode-se dizer que este é o melhor resultado até agora.", fr: "C’est sans doute le meilleur résultat à ce jour.", de: "Das ist wohl das beste Ergebnis bisher.", it: "Questo è probabilmente il miglior risultato finora.", pl: "To prawdopodobnie najlepszy dotychczasowy wynik.", tr: "Bu, muhtemelen şimdiye kadarki en iyi sonuçtur.", id: "Ini bisa dibilang hasil terbaik sejauh ini.", vi: "Có thể nói đây là kết quả tốt nhất cho đến nay." } }
          - { level: C1, device: { en: "A booster", uk: "Підсилювач", es: "Un intensificador", pt: "Um intensificador", fr: "Un renforçateur", de: "Ein Verstärker", it: "Un rafforzativo", pl: "Wzmacniacz", tr: "Pekiştirici", id: "Penegas", vi: "Từ nhấn mạnh" }, words: { alternatives: [clearly, undoubtedly, "it is evident that"] }, ex: ["The figures ", { target: clearly }, " show a rise."], tr: { uk: "Ці цифри чітко показують зростання.", es: "Las cifras muestran claramente un aumento.", pt: "Os números mostram claramente um aumento.", fr: "Les chiffres montrent clairement une hausse.", de: "Die Zahlen zeigen deutlich einen Anstieg.", it: "Le cifre mostrano chiaramente un aumento.", pl: "Liczby wyraźnie pokazują wzrost.", tr: "Rakamlar açıkça bir artış gösteriyor.", id: "Angka-angka itu jelas menunjukkan kenaikan.", vi: "Các số liệu cho thấy rõ một mức tăng." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A hedge fits the strength of a claim to its evidence; a booster raises it.", uk: "Пом’якшувач узгоджує силу твердження з доказами; підсилювач її підвищує.", es: "Un atenuador ajusta la fuerza de una afirmación a sus pruebas; un intensificador la aumenta.", pt: "Um atenuador ajusta a força de uma afirmação às suas evidências; um intensificador a aumenta.", fr: "Un atténuateur ajuste la force d’une affirmation à ses preuves ; un renforçateur l’augmente.", de: "Ein Abschwächer passt die Stärke einer Behauptung an ihre Belege an; ein Verstärker erhöht sie.", it: "Un attenuatore adatta la forza di un'affermazione alle prove; un rafforzativo la aumenta.", pl: "Wyrażenie łagodzące dopasowuje siłę twierdzenia do dowodów; wzmacniacz ją zwiększa.", tr: "Yumuşatıcı, bir iddianın gücünü kanıtına uydurur; pekiştirici onu artırır.", id: "Pelunak menyesuaikan kekuatan klaim dengan buktinya; penegas menaikkannya.", vi: "Từ giảm nhẹ điều chỉnh độ mạnh của một khẳng định cho khớp với bằng chứng; từ nhấn mạnh làm nó tăng lên." }
          - type: rule
            level: C1
            text: { en: "A claim can take a booster and a hedge together.", uk: "Одне твердження може мати і підсилювач, і пом’якшувач.", es: "Una afirmación puede llevar un intensificador y un atenuador a la vez.", pt: "Uma afirmação pode ter um intensificador e um atenuador ao mesmo tempo.", fr: "Une affirmation peut prendre un renforçateur et un atténuateur à la fois.", de: "Eine Behauptung kann einen Verstärker und einen Abschwächer zugleich enthalten.", it: "Un'affermazione può avere insieme un rafforzativo e un attenuatore.", pl: "Twierdzenie może mieć jednocześnie wzmacniacz i wyrażenie łagodzące.", tr: "Bir iddia aynı anda hem pekiştirici hem yumuşatıcı alabilir.", id: "Satu klaim dapat memuat penegas dan pelunak sekaligus.", vi: "Một khẳng định có thể có cả từ nhấn mạnh lẫn từ giảm nhẹ." }
            ex: ["The data ", { target: clearly }, " show a link, but it ", { target: may }, " not hold for adults."]
            tr: { uk: "Дані чітко показують зв’язок, але він може не стосуватися дорослих.", es: "Los datos muestran claramente una relación, pero puede que no valga para los adultos.", pt: "Os dados mostram claramente uma relação, mas ela pode não valer para adultos.", fr: "Les données montrent clairement un lien, mais il se peut qu’il ne vaille pas pour les adultes.", de: "Die Daten zeigen deutlich einen Zusammenhang, der aber bei Erwachsenen möglicherweise nicht gilt.", it: "I dati mostrano chiaramente un legame, ma potrebbe non valere per gli adulti.", pl: "Dane wyraźnie wskazują na związek, ale może on nie dotyczyć dorosłych.", tr: "Veriler açıkça bir ilişki gösteriyor ama bu ilişki yetişkinler için geçerli olmayabilir.", id: "Data itu jelas menunjukkan adanya hubungan, tetapi hubungan itu mungkin tidak berlaku bagi orang dewasa.", vi: "Dữ liệu cho thấy rõ một mối liên hệ, nhưng có thể nó không đúng với người lớn." }
          - type: rule
            level: C1
