          - { level: C2, device: { en: "A bit of a", uk: { term: "A bit of a" }, es: { term: "A bit of a" }, pt: { term: "A bit of a" }, fr: { term: "A bit of a" }, de: { term: "A bit of a" }, it: { term: "A bit of a" }, pl: { term: "A bit of a" }, tr: { term: "A bit of a" }, id: { term: "A bit of a" }, vi: { term: "A bit of a" } }, meaning: { en: "a big problem, said lightly", uk: "серйозна проблема, сказана легким тоном", es: "un problema grande, dicho con ligereza", pt: "um problema grande, dito com leveza", fr: "un gros problème, dit avec légèreté", de: "ein großes Problem, leicht dahingesagt", it: "un grosso problema, detto con leggerezza", pl: "duży problem, powiedziany lekko", tr: "büyük bir sorun, hafif bir dille söylenmiş", id: "masalah besar yang dikatakan dengan ringan", vi: "một vấn đề lớn, nói một cách nhẹ nhàng" }, ex: ["The holiday was ", { target: "a bit of a disaster" }, ": we missed the flight."], tr: { uk: "Відпустка вийшла, скажімо так, невдалою: ми запізнилися на рейс.", es: "Las vacaciones fueron un pequeño desastre: perdimos el vuelo.", pt: "As férias foram um pequeno desastre: perdemos o voo.", fr: "Les vacances ont été un petit désastre : nous avons raté l’avion.", de: "Der Urlaub war ein kleines Desaster: Wir haben den Flug verpasst.", it: "La vacanza è stata un piccolo disastro: abbiamo perso il volo.", pl: "Wakacje były małą katastrofą: spóźniliśmy się na lot.", tr: "Tatil küçük bir felaketti: uçağı kaçırdık.", id: "Liburannya agak jadi bencana: kami ketinggalan pesawat.", vi: "Kỳ nghỉ hơi thành một thảm họa: chúng tôi lỡ chuyến bay." } }
          - { level: C2, device: { en: "Not bad", uk: { term: "Not bad" }, es: { term: "Not bad" }, pt: { term: "Not bad" }, fr: { term: "Not bad" }, de: { term: "Not bad" }, it: { term: "Not bad" }, pl: { term: "Not bad" }, tr: { term: "Not bad" }, id: { term: "Not bad" }, vi: { term: "Not bad" } }, meaning: { en: "good, often very good", uk: "добре, часто дуже добре", es: "bueno, a menudo muy bueno", pt: "bom, muitas vezes muito bom", fr: "bon, souvent très bon", de: "gut, oft sehr gut", it: "buono, spesso molto buono", pl: "dobry, często bardzo dobry", tr: "iyi, çoğu zaman çok iyi", id: "bagus, sering kali sangat bagus", vi: "tốt, thường là rất tốt" }, ex: { exchange: ["How was the film?", [{ target: "Not bad" }, "."]] }, tr: { uk: { exchange: ["Як тобі фільм?", "Непогано."] }, es: { exchange: ["¿Qué tal la película?", "No está mal."] }, pt: { exchange: ["Como foi o filme?", "Nada mal."] }, fr: { exchange: ["Comment était le film ?", "Pas mal."] }, de: { exchange: ["Wie war der Film?", "Nicht schlecht."] }, it: { exchange: ["Com'era il film?", "Non male."] }, pl: { exchange: ["Jaki był film?", "Nieźle."] }, tr: { exchange: ["Film nasıldı?", "Fena değildi."] }, id: { exchange: ["Bagaimana filmnya?", "Lumayan."] }, vi: { exchange: ["Phim thế nào?", "Cũng không tệ."] } } }
          - { level: C2, device: { en: "Not exactly", uk: { term: "Not exactly" }, es: { term: "Not exactly" }, pt: { term: "Not exactly" }, fr: { term: "Not exactly" }, de: { term: "Not exactly" }, it: { term: "Not exactly" }, pl: { term: "Not exactly" }, tr: { term: "Not exactly" }, id: { term: "Not exactly" }, vi: { term: "Not exactly" } }, meaning: { en: "no, or only in part", uk: "ні або лише частково", es: "no, o solo en parte", pt: "não, ou só em parte", fr: "non, ou en partie seulement", de: "nein oder nur zum Teil", it: "no, o solo in parte", pl: "nie albo tylko częściowo", tr: "hayır ya da yalnızca kısmen", id: "tidak, atau hanya sebagian", vi: "không, hoặc chỉ một phần" }, ex: { exchange: ["Are you ready?", [{ target: "Not exactly" }, ". I haven't started."]] }, tr: { uk: { exchange: ["Ти готовий?", "Не зовсім. Я ще не почав."] }, es: { exchange: ["¿Estás listo?", "No exactamente. No he empezado."] }, pt: { exchange: ["Você está pronto?", "Não exatamente. Eu ainda não comecei."] }, fr: { exchange: ["Tu es prêt ?", "Pas vraiment. Je n’ai pas commencé."] }, de: { exchange: ["Bist du fertig?", "Nicht ganz. Ich habe noch nicht angefangen."] }, it: { exchange: ["Sei pronto?", "Non proprio. Non ho ancora cominciato."] }, pl: { exchange: ["Jesteś gotowy?", "Niezupełnie. Jeszcze nie zacząłem."] }, tr: { exchange: ["Hazır mısın?", "Tam olarak değil. Henüz başlamadım."] }, id: { exchange: ["Apakah kamu sudah siap?", "Belum juga. Saya belum mulai."] }, vi: { exchange: ["Bạn sẵn sàng chưa?", "Chưa hẳn. Tôi chưa bắt đầu."] } } }
          - { level: C2, device: { en: Rather, uk: { term: "Rather" }, es: { term: "Rather" }, pt: { term: "Rather" }, fr: { term: "Rather" }, de: { term: "Rather" }, it: { term: "Rather" }, pl: { term: "Rather" }, tr: { term: "Rather" }, id: { term: "Rather" }, vi: { term: "Rather" } }, meaning: { en: "more than expected", uk: "більше, ніж очікувалося", es: "más de lo esperado", pt: "mais do que o esperado", fr: "plus que prévu", de: "mehr als erwartet", it: "più del previsto", pl: "bardziej, niż oczekiwano", tr: "beklenenden fazla", id: "lebih dari yang diharapkan", vi: "nhiều hơn dự kiến" }, ex: ["That was ", { target: rather }, " a surprise."], tr: { uk: "Це стало справжнім сюрпризом.", es: "Eso fue toda una sorpresa.", pt: "Isso foi uma surpresa e tanto.", fr: "Ce fut plutôt une surprise.", de: "Das war eine ziemliche Überraschung.", it: "È stata una sorpresa non da poco.", pl: "To było dość spore zaskoczenie.", tr: "Bu epey bir sürprizdi.", id: "Itu cukup mengejutkan.", vi: "Đó quả là một bất ngờ." } }
          - { level: C2, device: { en: "Quite as a reply", uk: [{ term: "Quite" }, " як відповідь"], es: [{ term: "Quite" }, " como respuesta"], pt: [{ term: "Quite" }, " como resposta"], fr: [{ term: "Quite" }, " comme réponse"], de: [{ term: "Quite" }, " als Antwort"], it: [{ term: "Quite" }, " come risposta"], pl: [{ term: "Quite" }, " jako odpowiedź"], tr: [{ term: "Quite" }, " bir cevap olarak"], id: [{ term: "Quite" }, " sebagai jawaban"], vi: [{ term: "Quite" }, " làm câu trả lời"] }, meaning: { en: "full agreement, in British English", uk: "повна згода, у британській англійській", es: "acuerdo total, en inglés británico", pt: "concordância total, no inglês britânico", fr: "accord total, en anglais britannique", de: "volle Zustimmung, im britischen Englisch", it: "pieno accordo, nell'inglese britannico", pl: "pełna zgoda, w brytyjskiej angielszczyźnie", tr: "tam onay, İngiliz İngilizcesinde", id: "persetujuan penuh, dalam bahasa Inggris Britania", vi: "hoàn toàn đồng ý, trong tiếng Anh Anh" }, ex: { exchange: ["It's a shame they lost.", [{ target: Quite }, "."]] }, tr: { uk: { exchange: ["Шкода, що вони програли.", "Саме так."] }, es: { exchange: ["Es una lástima que hayan perdido.", "Exacto."] }, pt: { exchange: ["É uma pena que eles tenham perdido.", "Exatamente."] }, fr: { exchange: ["Dommage qu’ils aient perdu.", "Tout à fait."] }, de: { exchange: ["Schade, dass sie verloren haben.", "Genau."] }, it: { exchange: ["Peccato che abbiano perso.", "Esattamente."] }, pl: { exchange: ["Szkoda, że przegrali.", "Dokładnie."] }, tr: { exchange: ["Kaybetmeleri yazık oldu.", "Aynen."] }, id: { exchange: ["Sayang sekali mereka kalah.", "Betul sekali."] }, vi: { exchange: ["Tiếc là họ đã thua.", "Chính xác."] } } }
          - { level: C2, device: { en: "Hardly the best", uk: { term: "Hardly the best" }, es: { term: "Hardly the best" }, pt: { term: "Hardly the best" }, fr: { term: "Hardly the best" }, de: { term: "Hardly the best" }, it: { term: "Hardly the best" }, pl: { term: "Hardly the best" }, tr: { term: "Hardly the best" }, id: { term: "Hardly the best" }, vi: { term: "Hardly the best" } }, meaning: { en: "a poor one", uk: "поганий варіант", es: "una mala opción", pt: "uma má opção", fr: "un mauvais choix", de: "eine schlechte Wahl", it: "una scelta scadente", pl: "kiepski sposób", tr: "kötü bir seçenek", id: "pilihan yang buruk", vi: "một lựa chọn tồi" }, ex: ["That is ", { target: "hardly the best way" }, " to start."], tr: { uk: "Це навряд чи найкращий спосіб почати.", es: "Esa no es precisamente la mejor manera de empezar.", pt: "Essa não é exatamente a melhor maneira de começar.", fr: "Ce n’est guère la meilleure façon de commencer.", de: "Das ist wohl kaum der beste Anfang.", it: "Non è certo il modo migliore per cominciare.", pl: "To raczej nie najlepszy sposób na początek.", tr: "Bu, başlamak için pek de en iyi yol sayılmaz.", id: "Itu hampir bukan cara terbaik untuk memulai.", vi: "Đó khó có thể là cách tốt nhất để bắt đầu." } }
          - { level: C2, device: { en: Irony, uk: "Іронія", es: "Ironía", pt: "Ironia", fr: "Ironie", de: "Ironie", it: "Ironia", pl: "Ironia", tr: "İroni", id: "Ironi", vi: "Mỉa mai" }, meaning: { en: "the opposite of the words, shown by the tune and the situation", uk: "протилежність словам; її показують інтонація й ситуація", es: "lo contrario de las palabras, que muestran la entonación y la situación", pt: "o oposto das palavras, mostrado pela entonação e pela situação", fr: "le contraire des mots, que montrent l’intonation et la situation", de: "das Gegenteil der Worte, gezeigt durch Satzmelodie und Situation", it: "il contrario delle parole, mostrato dall'intonazione e dalla situazione", pl: "przeciwieństwo słów, widoczne w intonacji i sytuacji", tr: "sözlerin tersi; tonlama ve durum bunu gösterir", id: "kebalikan dari kata-katanya, ditunjukkan oleh intonasi dan situasi", vi: "điều trái với lời nói, được thể hiện qua ngữ điệu và tình huống" }, ex: { exchange: ["Look, it's pouring.", [{ target: "Lovely weather" }, "! ", { intonation: rise }, { intonation: fall }]] }, tr: { uk: { exchange: ["Дивись, ллє як із відра.", "Чудова погода!"] }, es: { exchange: ["Mira, está lloviendo a cántaros.", "¡Qué buen tiempo!"] }, pt: { exchange: ["Olha, está chovendo muito.", "Que tempo lindo!"] }, fr: { exchange: ["Regarde, il pleut à verse.", "Quel beau temps !"] }, de: { exchange: ["Schau, es gießt in Strömen.", "Schönes Wetter!"] }, it: { exchange: ["Guarda, sta diluviando.", "Che bel tempo!"] }, pl: { exchange: ["Patrz, leje jak z cebra.", "Piękna pogoda!"] }, tr: { exchange: ["Bak, yağmur sele döndü.", "Ne güzel hava!"] }, id: { exchange: ["Lihat, hujannya deras sekali.", "Cuacanya indah sekali!"] }, vi: { exchange: ["Nhìn kìa, trời mưa như trút.", "Thời tiết đẹp quá nhỉ!"] } } }
          - { level: C2, device: { en: Implication, uk: "Натяк", es: "Insinuación", pt: "Insinuação", fr: "Sous-entendu", de: "Andeutung", it: "Allusione", pl: "Sugestia", tr: "İma", id: "Implikasi", vi: "Hàm ý" }, meaning: { en: "a remark that asks for action", uk: "зауваження, що спонукає до дії", es: "un comentario que pide una acción", pt: "um comentário que pede uma ação", fr: "une remarque qui demande une action", de: "eine Bemerkung, die zum Handeln auffordert", it: "un'osservazione che chiede un'azione", pl: "uwaga, która skłania do działania", tr: "eylem isteyen bir söz", id: "ucapan yang meminta tindakan", vi: "một lời nhận xét ngầm yêu cầu hành động" }, ex: { exchange: [[{ target: "It's a bit cold in here" }, "."], "I'll close the window."] }, tr: { uk: { exchange: ["Тут трохи холодно.", "Я зачиню вікно."] }, es: { exchange: ["Hace un poco de frío aquí.", "Voy a cerrar la ventana."] }, pt: { exchange: ["Está um pouco frio aqui.", "Vou fechar a janela."] }, fr: { exchange: ["Il fait un peu froid ici.", "Je vais fermer la fenêtre."] }, de: { exchange: ["Es ist ein bisschen kalt hier.", "Ich mache das Fenster zu."] }, it: { exchange: ["Qui fa un po' freddo.", "Chiudo la finestra."] }, pl: { exchange: ["Trochę tu zimno.", "Zamknę okno."] }, tr: { exchange: ["Burası biraz soğuk.", "Pencereyi kapatayım."] }, id: { exchange: ["Di sini agak dingin.", "Saya akan menutup jendelanya."] }, vi: { exchange: ["Ở đây hơi lạnh.", "Để tôi đóng cửa sổ."] } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Understatement says less than it means, and the situation completes the meaning.", uk: "Применшення каже менше, ніж має на увазі, а зміст доповнює ситуація.", es: "La subestimación dice menos de lo que significa, y la situación completa el sentido.", pt: "A subestimação diz menos do que significa, e a situação completa o sentido.", fr: "La litote dit moins qu’elle ne signifie, et la situation complète le sens.", de: "Untertreibung sagt weniger, als sie meint, und die Situation vervollständigt die Bedeutung.", it: "L'understatement dice meno di quanto significa, e la situazione completa il senso.", pl: "Niedopowiedzenie mówi mniej, niż znaczy, a sens dopełnia sytuacja.", tr: "Hafife alma, kastettiğinden azını söyler; anlamı durum tamamlar.", id: "Pernyataan merendah mengatakan lebih sedikit daripada maksudnya, dan situasi melengkapi maknanya.", vi: "Nói giảm nói ít hơn điều muốn nói, và tình huống hoàn thiện nghĩa." }
          - type: rule
            level: C2
            text: { en: "The tune of the voice carries the meaning: the same words can praise or criticise.", uk: "Інтонація голосу несе значення: одні й ті самі слова можуть хвалити або критикувати.", es: "La entonación de la voz lleva el significado: las mismas palabras pueden elogiar o criticar.", pt: "A entonação da voz carrega o significado: as mesmas palavras podem elogiar ou criticar.", fr: "L’intonation de la voix porte le sens : les mêmes mots peuvent louer ou critiquer.", de: "Die Satzmelodie trägt die Bedeutung: Dieselben Worte können loben oder kritisieren.", it: "L'intonazione della voce porta il significato: le stesse parole possono lodare o criticare.", pl: "Intonacja głosu niesie znaczenie: te same słowa mogą chwalić lub krytykować.", tr: "Sesin tonlaması anlamı taşır: aynı sözler övebilir de eleştirebilir de.", id: "Intonasi suara membawa makna: kata-kata yang sama bisa memuji atau mengkritik.", vi: "Ngữ điệu của giọng nói mang nghĩa: cùng những từ ấy có thể khen hoặc chê." }
          - type: note
            level: C2
            text: { en: ["The tunes are in ", { link: "Connected Speech and Intonation", to: en.foundations.connected-speech-intonation }, "."], uk: ["Види інтонації описано в розділі ", { link: "Зв’язне мовлення та інтонація", to: "en.foundations.connected-speech-intonation" }, "."], es: ["Las entonaciones están en ", { link: "Habla conectada y entonación", to: "en.foundations.connected-speech-intonation" }, "."], pt: ["As entonações estão em ", { link: "Fala conectada e entonação", to: "en.foundations.connected-speech-intonation" }, "."], fr: ["Les intonations sont dans ", { link: "Chaîne parlée et intonation", to: "en.foundations.connected-speech-intonation" }, "."], de: ["Die Satzmelodien stehen in ", { link: "Gebundenes Sprechen und Intonation", to: "en.foundations.connected-speech-intonation" }, "."], it: ["Le intonazioni sono in ", { link: "Parlato connesso e intonazione", to: "en.foundations.connected-speech-intonation" }, "."], pl: ["Intonacje omówiono w temacie ", { link: "Mowa ciągła i intonacja", to: "en.foundations.connected-speech-intonation" }, "."], tr: ["Tonlamalar ", { link: "Bağlı konuşma ve tonlama", to: "en.foundations.connected-speech-intonation" }, " konusunda yer alır."], id: ["Intonasi dibahas di ", { link: "Ujaran bersambung dan intonasi", to: "en.foundations.connected-speech-intonation" }, "."], vi: ["Các kiểu ngữ điệu nằm trong bài ", { link: "Lời nói liên tục và ngữ điệu", to: "en.foundations.connected-speech-intonation" }, "."] }

  - title: { en: "Markers of formal speech and writing", uk: "Маркери офіційного мовлення й письма", es: "Marcadores del habla y la escritura formales", pt: "Marcadores da fala e da escrita formais", fr: "Marqueurs de l’oral et de l’écrit formels", de: "Marker der formellen Rede und Schrift", it: "Segnali del parlato e dello scritto formali", pl: "Markery mowy i pisma formalnego", tr: "Resmî konuşma ve yazının belirteçleri", id: "Penanda ujaran dan tulisan formal", vi: "Dấu hiệu của lời nói và văn viết trang trọng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: job, label: { en: "Job", uk: "Функція", es: "Función", pt: "Função", fr: "Fonction", de: "Aufgabe", it: "Funzione", pl: "Funkcja", tr: "İşlev", id: "Fungsi", vi: "Chức năng" } }
          - { key: words, label: { en: "Markers", uk: "Маркери", es: "Marcadores", pt: "Marcadores", fr: "Marqueurs", de: "Marker", it: "Segnali", pl: "Markery", tr: "Belirteçler", id: "Penanda", vi: "Dấu hiệu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, job: { en: "Conceding, then turning", uk: "Поступка, а потім поворот", es: "Conceder y luego matizar", pt: "Conceder e depois contrapor", fr: "Concéder, puis nuancer", de: "Einräumen und dann wenden", it: "Concedere, poi cambiare direzione", pl: "Ustępstwo, a potem zwrot", tr: "Taviz verip yön değiştirmek", id: "Mengakui lalu berbalik", vi: "Nhượng bộ rồi chuyển hướng" }, words: { alternatives: ["be that as it may", "having said that", "that said"] }, ex: ["The cost is high. ", { target: "That said" }, ", the benefits are clear."], tr: { uk: "Витрати високі. Проте переваги очевидні.", es: "El costo es alto. Dicho esto, los beneficios son evidentes.", pt: "O custo é alto. Dito isso, os benefícios são claros.", fr: "Le coût est élevé. Cela dit, les avantages sont évidents.", de: "Die Kosten sind hoch. Dennoch liegen die Vorteile auf der Hand.", it: "Il costo è alto. Detto questo, i vantaggi sono evidenti.", pl: "Koszt jest wysoki. Niemniej korzyści są oczywiste.", tr: "Maliyet yüksek. Bununla birlikte, yararları açık.", id: "Biayanya tinggi. Meskipun demikian, manfaatnya jelas.", vi: "Chi phí cao. Dù vậy, lợi ích rất rõ ràng." } }
          - { level: C2, job: { en: "Drawing a consequence", uk: "Висновок із сказаного", es: "Sacar una consecuencia", pt: "Tirar uma consequência", fr: "Tirer une conséquence", de: "Eine Folgerung ziehen", it: "Trarre una conseguenza", pl: "Wyciągnięcie wniosku", tr: "Sonuç çıkarmak", id: "Menarik konsekuensi", vi: "Rút ra hệ quả" }, words: "in light of this", ex: [{ target: "In light of this" }, ", we ask for more time."], tr: { uk: "З огляду на це, ми просимо більше часу.", es: "A la luz de esto, pedimos más tiempo.", pt: "Diante disso, pedimos mais tempo.", fr: "Compte tenu de cela, nous demandons plus de temps.", de: "Vor diesem Hintergrund bitten wir um mehr Zeit.", it: "Alla luce di ciò, chiediamo più tempo.", pl: "W świetle tego prosimy o więcej czasu.", tr: "Bu doğrultuda, daha fazla zaman istiyoruz.", id: "Mengingat hal ini, kami meminta tambahan waktu.", vi: "Xét theo điều này, chúng tôi xin thêm thời gian." } }
          - { level: C2, job: { en: "Giving the purpose", uk: "Назва мети", es: "Indicar la finalidad", pt: "Indicar a finalidade", fr: "Donner le but", de: "Den Zweck nennen", it: "Indicare lo scopo", pl: "Podanie celu", tr: "Amacı belirtmek", id: "Menyatakan tujuan", vi: "Nêu mục đích" }, words: "to that end", ex: ["The aim is to cut costs. ", { target: "To that end" }, ", we shall close two offices."], tr: { uk: "Мета — скоротити витрати. З цією метою ми закриємо два офіси.", es: "El objetivo es reducir los costos. Con ese fin, cerraremos dos oficinas.", pt: "O objetivo é cortar custos. Para isso, vamos fechar dois escritórios.", fr: "L’objectif est de réduire les coûts. À cette fin, nous fermerons deux bureaux.", de: "Das Ziel ist, die Kosten zu senken. Zu diesem Zweck schließen wir zwei Büros.", it: "L'obiettivo è ridurre i costi. A tal fine, chiuderemo due uffici.", pl: "Celem jest obniżenie kosztów. W tym celu zamkniemy dwa biura.", tr: "Amaç maliyetleri düşürmek. Bu amaçla iki ofisi kapatacağız.", id: "Tujuannya memangkas biaya. Untuk itu, kami akan menutup dua kantor.", vi: "Mục tiêu là cắt giảm chi phí. Vì mục đích đó, chúng tôi sẽ đóng hai văn phòng." } }
          - { level: C2, job: { en: "Adding a parallel point", uk: "Додавання паралельної думки", es: "Añadir un punto paralelo", pt: "Acrescentar um ponto paralelo", fr: "Ajouter un point parallèle", de: "Einen parallelen Punkt hinzufügen", it: "Aggiungere un punto parallelo", pl: "Dodanie równoległej myśli", tr: "Paralel bir nokta eklemek", id: "Menambahkan butir yang sejajar", vi: "Thêm một ý song song" }, words: { alternatives: ["by the same token", "in the same vein"] }, ex: { examples: [["He expects loyalty; ", { target: "by the same token" }, ", he gives it."], [{ target: "In the same vein" }, ", she thanked the staff."]] }, tr: { uk: { examples: ["Він чекає вірності; так само він її віддає.", "У тому ж дусі вона подякувала персоналу."] }, es: { examples: ["Espera lealtad; del mismo modo, la ofrece.", "En la misma línea, agradeció al personal."] }, pt: { examples: ["Ele espera lealdade; da mesma forma, ele a oferece.", "Na mesma linha, ela agradeceu à equipe."] }, fr: { examples: ["Il attend de la loyauté ; de même, il en donne.", "Dans la même veine, elle a remercié le personnel."] }, de: { examples: ["Er erwartet Loyalität; ebenso gibt er sie.", "In derselben Weise dankte sie dem Personal."] }, it: { examples: ["Si aspetta lealtà; allo stesso modo, la offre.", "Sulla stessa linea, ha ringraziato il personale."] }, pl: { examples: ["Oczekuje lojalności; z tego samego powodu sam ją okazuje.", "W tym samym duchu podziękowała personelowi."] }, tr: { examples: ["Sadakat bekler; aynı şekilde sadakat de gösterir.", "Aynı doğrultuda personele teşekkür etti."] }, id: { examples: ["Dia mengharapkan kesetiaan; begitu pula, dia memberikannya.", "Senada dengan itu, dia berterima kasih kepada para staf."] }, vi: { examples: ["Ông ấy đòi hỏi sự trung thành; cũng vì lẽ đó, ông ấy trao lại sự trung thành.", "Cùng mạch ý đó, bà ấy cảm ơn nhân viên."] } } }
          - { level: C2, job: { en: "Speaking bluntly", uk: "Пряме висловлювання", es: "Hablar sin rodeos", pt: "Falar sem rodeios", fr: "Parler sans détour", de: "Unverblümt sprechen", it: "Parlare senza giri di parole", pl: "Mówienie bez ogródek", tr: "Açık sözlü olmak", id: "Berbicara blak-blakan", vi: "Nói thẳng" }, words: "to put it bluntly", ex: [{ target: "To put it bluntly" }, ", the plan has failed."], tr: { uk: "Кажучи прямо, план провалився.", es: "Dicho sin rodeos, el plan ha fracasado.", pt: "Para falar sem rodeios, o plano fracassou.", fr: "Pour parler franchement, le plan a échoué.", de: "Um es ganz offen zu sagen: Der Plan ist gescheitert.", it: "A dirla senza giri di parole, il piano è fallito.", pl: "Mówiąc wprost, plan się nie powiódł.", tr: "Açık söylemek gerekirse, plan başarısız oldu.", id: "Terus terang saja, rencana itu gagal.", vi: "Nói thẳng ra, kế hoạch đã thất bại." } }
          - { level: C2, job: { en: "Stating the obvious", uk: "Констатація очевидного", es: "Decir lo obvio", pt: "Dizer o óbvio", fr: "Dire une évidence", de: "Das Offensichtliche aussprechen", it: "Dire l'ovvio", pl: "Stwierdzenie oczywistości", tr: "Aşikâr olanı söylemek", id: "Menyatakan hal yang jelas", vi: "Nói điều hiển nhiên" }, words: { alternatives: ["needless to say", "it goes without saying"] }, ex: [{ target: "Needless to say" }, ", we shall pay on time."], tr: { uk: "Зайве казати, ми заплатимо вчасно.", es: "Ni qué decir tiene que pagaremos a tiempo.", pt: "Nem é preciso dizer que pagaremos em dia.", fr: "Inutile de dire que nous paierons à temps.", de: "Selbstverständlich zahlen wir pünktlich.", it: "Inutile dire che pagheremo in tempo.", pl: "Nie trzeba mówić, że zapłacimy w terminie.", tr: "Söylemeye gerek yok, zamanında ödeyeceğiz.", id: "Tak perlu dikatakan lagi, kami akan membayar tepat waktu.", vi: "Không cần nói, chúng tôi sẽ trả đúng hạn." } }
          - { level: C2, job: { en: "Summing up", uk: "Підсумок", es: "Resumir", pt: "Resumir", fr: "Résumer", de: "Zusammenfassen", it: "Riassumere", pl: "Podsumowanie", tr: "Özetlemek", id: "Merangkum", vi: "Tóm lại" }, words: { alternatives: ["by and large", "all in all"] }, ex: [{ target: "By and large" }, ", the trip was a success."], tr: { uk: "Загалом поїздка була вдалою.", es: "En general, el viaje fue un éxito.", pt: "No geral, a viagem foi um sucesso.", fr: "Dans l’ensemble, le voyage a été un succès.", de: "Im Großen und Ganzen war die Reise ein Erfolg.", it: "Nel complesso, il viaggio è stato un successo.", pl: "Ogólnie rzecz biorąc, podróż się udała.", tr: "Genel olarak gezi başarılı geçti.", id: "Secara umum, perjalanan itu sukses.", vi: "Nhìn chung, chuyến đi đã thành công." } }
          - { level: C2, job: { en: "Setting the precision", uk: "Уточнення ступеня точності", es: "Fijar el grado de precisión", pt: "Definir o grau de precisão", fr: "Fixer le degré de précision", de: "Den Genauigkeitsgrad festlegen", it: "Fissare il grado di precisione", pl: "Określenie stopnia dokładności", tr: "Kesinlik düzeyini belirlemek", id: "Menentukan tingkat ketepatan", vi: "Xác định mức độ chính xác" }, words: { alternatives: ["strictly speaking", "broadly speaking"] }, ex: { examples: [[{ target: "Strictly speaking" }, ", a tomato is a fruit."], [{ target: "Broadly speaking" }, ", prices are falling."]] }, tr: { uk: { examples: ["Строго кажучи, помідор — це фрукт.", "Загалом кажучи, ціни знижуються."] }, es: { examples: ["Estrictamente hablando, el tomate es una fruta.", "En términos generales, los precios están bajando."] }, pt: { examples: ["A rigor, o tomate é uma fruta.", "De modo geral, os preços estão caindo."] }, fr: { examples: ["À proprement parler, la tomate est un fruit.", "En gros, les prix baissent."] }, de: { examples: ["Streng genommen ist die Tomate eine Frucht.", "Im Allgemeinen sinken die Preise."] }, it: { examples: ["A rigor di termini, il pomodoro è un frutto.", "In linea generale, i prezzi stanno scendendo."] }, pl: { examples: ["Ściśle mówiąc, pomidor jest owocem.", "Ogólnie mówiąc, ceny spadają."] }, tr: { examples: ["Kesin konuşmak gerekirse, domates bir meyvedir.", "Genel olarak konuşursak, fiyatlar düşüyor."] }, id: { examples: ["Secara tegas, tomat adalah buah.", "Secara garis besar, harga-harga sedang turun."] }, vi: { examples: ["Nói một cách chặt chẽ, cà chua là một loại quả.", "Nói chung, giá cả đang giảm."] } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A formal marker opens its sentence and takes a comma.", uk: "Формальний маркер відкриває речення і відокремлюється комою.", es: "Un marcador formal abre la oración y lleva una coma.", pt: "Um marcador formal abre a frase e leva uma vírgula.", fr: "Un marqueur formel ouvre la phrase et prend une virgule.", de: "Ein formeller Marker eröffnet den Satz und hat ein Komma nach sich.", it: "Un segnale formale apre la frase e prende la virgola.", pl: "Marker formalny otwiera zdanie i wymaga przecinka.", tr: "Resmî belirteç cümleyi açar ve virgül alır.", id: "Penanda formal membuka kalimat dan diikuti koma.", vi: "Dấu hiệu trang trọng mở đầu câu và đi kèm dấu phẩy." }
          - type: rule
            level: C2
            text: { en: ["Formal markers suit lectures, reports and essays; chat prefers ", { term: well }, " and ", { term: anyway }, "."], uk: ["Формальні маркери пасують до лекцій, звітів і есе; у невимушеній розмові воліють ", { term: "well" }, " та ", { term: "anyway" }, "."], es: ["Los marcadores formales van bien en clases, informes y ensayos; en una charla informal se prefieren ", { term: "well" }, " y ", { term: "anyway" }, "."], pt: ["Os marcadores formais servem para palestras, relatórios e ensaios; na conversa informal se preferem ", { term: "well" }, " e ", { term: "anyway" }, "."], fr: ["Les marqueurs formels conviennent aux conférences, aux rapports et aux essais ; la conversation courante préfère ", { term: "well" }, " et ", { term: "anyway" }, "."], de: ["Formelle Marker passen zu Vorlesungen, Berichten und Aufsätzen; im Plauderton bevorzugt man ", { term: "well" }, " und ", { term: "anyway" }, "."], it: ["I segnali formali si addicono a lezioni, relazioni e saggi; nella chiacchierata si preferiscono ", { term: "well" }, " e ", { term: "anyway" }, "."], pl: ["Markery formalne pasują do wykładów, raportów i esejów; w luźnej rozmowie wybiera się ", { term: "well" }, " i ", { term: "anyway" }, "."], tr: ["Resmî belirteçler ders, rapor ve denemeye uygundur; sohbette ", { term: "well" }, " ve ", { term: "anyway" }, " tercih edilir."], id: ["Penanda formal cocok untuk kuliah, laporan, dan esai; obrolan santai lebih suka memakai ", { term: "well" }, " dan ", { term: "anyway" }, "."], vi: ["Dấu hiệu trang trọng hợp với bài giảng, báo cáo và bài luận; trò chuyện thường dùng ", { term: "well" }, " và ", { term: "anyway" }, "."] }

