            tr: { uk: { examples: ["Фільм був якийсь сумний.", "Я певною мірою згоден."] }, es: { examples: ["La película fue medio triste.", "Más o menos estoy de acuerdo."] }, pt: { examples: ["O filme foi meio triste.", "Eu meio que concordo."] }, fr: { examples: ["Le film était un peu triste.", "Je suis plus ou moins d’accord."] }, de: { examples: ["Der Film war irgendwie traurig.", "Ich stimme irgendwie zu."] }, it: { examples: ["Il film era piuttosto triste, diciamo.", "In un certo senso sono d'accordo."] }, pl: { examples: ["Film był jakiś smutny.", "W pewnym sensie się zgadzam."] }, tr: { examples: ["Film biraz hüzünlüydü.", "Bir bakıma katılıyorum."] }, id: { examples: ["Filmnya agak sedih.", "Saya kurang lebih setuju."] }, vi: { examples: ["Bộ phim hơi buồn.", "Tôi kiểu như đồng ý."] } }
          - type: rule
