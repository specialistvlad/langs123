            text: { en: [{ term: "A bit" }, " takes an adjective, or ", { term: "of a" }, " and a noun."], uk: [{ term: "A bit" }, " вживається з прикметником або з ", { term: "of a" }, " та іменником."], es: [{ term: "A bit" }, " se usa con un adjetivo, o con ", { term: "of a" }, " y un sustantivo."], pt: [{ term: "A bit" }, " é usado com um adjetivo, ou com ", { term: "of a" }, " e um substantivo."], fr: [{ term: "A bit" }, " s’emploie avec un adjectif, ou avec ", { term: "of a" }, " et un nom."], de: [{ term: "A bit" }, " steht bei einem Adjektiv oder mit ", { term: "of a" }, " und einem Nomen."], it: [{ term: "A bit" }, " si usa con un aggettivo, o con ", { term: "of a" }, " e un sostantivo."], pl: [{ term: "A bit" }, " łączy się z przymiotnikiem albo z ", { term: "of a" }, " i rzeczownikiem."], tr: [{ term: "A bit" }, " sıfatla ya da ", { term: "of a" }, " ve isimle kullanılır."], id: [{ term: "A bit" }, " dipakai dengan kata sifat, atau dengan ", { term: "of a" }, " dan kata benda."], vi: [{ term: "A bit" }, " đi với tính từ, hoặc với ", { term: "of a" }, " và danh từ."] }
