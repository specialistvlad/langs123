title: { en: "Discourse Markers and Hedging", uk: "Дискурсивні маркери та пом’якшення", es: "Marcadores del discurso y atenuación", pt: "Marcadores discursivos e atenuação", fr: "Marqueurs discursifs et atténuation", de: "Diskursmarker und Abschwächung", it: "Segnali discorsivi e attenuazione", pl: "Markery dyskursu i łagodzenie wypowiedzi", tr: "Söylem belirteçleri ve yumuşatma", id: "Penanda wacana dan pelunakan", vi: "Dấu hiệu diễn ngôn và cách nói giảm nhẹ" }
summary:
  lead:
    en: ["Discourse markers such as ", { term: well }, " and ", { term: anyway }, " organise talk, hedges such as ", { term: "sort of" }, " soften a claim, and formal markers shape an argument."]
    uk: ["Дискурсивні маркери, як-от ", { term: "well" }, " і ", { term: "anyway" }, ", упорядковують розмову, пом’якшувачі, як-от ", { term: "sort of" }, ", м’якшать твердження, а формальні маркери вибудовують аргументацію."]
    es: ["Los marcadores como ", { term: "well" }, " y ", { term: "anyway" }, " ordenan la charla, los atenuadores como ", { term: "sort of" }, " suavizan una afirmación y los formales estructuran un argumento."]
    pt: ["Marcadores como ", { term: "well" }, " e ", { term: "anyway" }, " organizam a conversa, atenuadores como ", { term: "sort of" }, " suavizam uma afirmação e marcadores formais estruturam um argumento."]
    fr: ["Des marqueurs comme ", { term: "well" }, " et ", { term: "anyway" }, " organisent la parole, des atténuateurs comme ", { term: "sort of" }, " adoucissent une idée, des marqueurs formels bâtissent un argument."]
    de: ["Diskursmarker wie ", { term: "well" }, " und ", { term: "anyway" }, " gliedern das Gespräch, Abschwächer wie ", { term: "sort of" }, " mildern eine Aussage, und formelle Marker bauen eine Argumentation auf."]
    it: ["Segnali come ", { term: "well" }, " e ", { term: "anyway" }, " organizzano il discorso, attenuatori come ", { term: "sort of" }, " smorzano un'affermazione, segnali formali costruiscono un'argomentazione."]
    pl: ["Markery takie jak ", { term: "well" }, " i ", { term: "anyway" }, " porządkują rozmowę, wyrażenia jak ", { term: "sort of" }, " łagodzą twierdzenie, a markery formalne budują argumentację."]
    tr: ["Söylem belirteçleri ", { term: "well" }, " ve ", { term: "anyway" }, " konuşmayı düzenler, ", { term: "sort of" }, " gibi yumuşatıcılar iddiayı hafifletir, resmî belirteçler savı biçimlendirir."]
    id: ["Penanda wacana seperti ", { term: "well" }, " dan ", { term: "anyway" }, " menata percakapan, pelunak seperti ", { term: "sort of" }, " melunakkan klaim, dan penanda formal membentuk sebuah argumen."]
    vi: ["Dấu hiệu như ", { term: "well" }, " và ", { term: "anyway" }, " tổ chức lời nói, từ giảm nhẹ như ", { term: "sort of" }, " làm nhẹ khẳng định, dấu hiệu trang trọng dựng lập luận."]
  rule:
    en: "A marker stands outside the clause, set off by a comma or a pause:"
    uk: "Маркер стоїть поза реченням і відокремлюється комою або паузою:"
    es: "El marcador queda fuera de la oración y se separa con una coma o una pausa:"
    pt: "O marcador fica fora da oração e é separado por uma vírgula ou por uma pausa:"
    fr: "Le marqueur se place en dehors de la proposition, isolé par une virgule ou une pause :"
    de: "Ein Marker steht außerhalb des Satzes und wird durch ein Komma oder eine Pause abgesetzt:"
    it: "Il segnale sta fuori dalla frase ed è separato da una virgola o da una pausa:"
    pl: "Marker stoi poza zdaniem i jest oddzielony przecinkiem lub pauzą:"
    tr: "Belirteç cümlenin dışında durur; virgül ya da duraksamayla ayrılır:"
    id: "Penanda berdiri di luar klausa, dipisahkan oleh koma atau jeda:"
    vi: "Dấu hiệu đứng ngoài mệnh đề, tách bằng dấu phẩy hoặc chỗ ngắt:"
  ex: [{ target: "To be honest" }, ", I'm a bit tired."]

