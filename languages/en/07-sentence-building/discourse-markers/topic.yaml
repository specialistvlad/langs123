          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, marker: allegedly, shows: { en: "a claim made but not proved", uk: "твердження висунуте, але не доведене", es: "una afirmación hecha pero no probada", pt: "uma afirmação feita, mas não provada", fr: "une affirmation avancée mais non prouvée", de: "eine Behauptung, die aufgestellt, aber nicht bewiesen ist", it: "un'affermazione fatta ma non provata", pl: "twierdzenie postawione, ale nieudowodnione", tr: "ileri sürülmüş ama kanıtlanmamış bir iddia", id: "klaim yang diajukan tetapi belum terbukti", vi: "một khẳng định được nêu ra nhưng chưa được chứng minh" }, ex: ["The man ", { target: allegedly }, " took the car."], tr: { uk: "Чоловік нібито взяв автомобіль.", es: "El hombre presuntamente se llevó el auto.", pt: "O homem supostamente levou o carro.", fr: "L’homme aurait pris la voiture.", de: "Der Mann hat das Auto angeblich genommen.", it: "L'uomo avrebbe preso l'auto.", pl: "Mężczyzna rzekomo zabrał samochód.", tr: "Adam iddiaya göre arabayı almış.", id: "Pria itu diduga mengambil mobil itu.", vi: "Người đàn ông bị cho là đã lấy chiếc xe." } }
          - { level: C1, marker: reportedly, shows: { en: "a report the writer has not checked", uk: "повідомлення, яке автор не перевірив", es: "una información que quien escribe no ha comprobado", pt: "uma informação que quem escreve não verificou", fr: "une information que l’auteur n’a pas vérifiée", de: "eine Meldung, die der Schreiber nicht überprüft hat", it: "una notizia che chi scrive non ha verificato", pl: "informacja, której autor nie sprawdził", tr: "yazarın doğrulamadığı bir haber", id: "kabar yang belum diperiksa penulisnya", vi: "một thông tin mà người viết chưa kiểm chứng" }, ex: ["The film ", { target: reportedly }, " cost ten million."], tr: { uk: "Фільм, за повідомленнями, коштував десять мільйонів.", es: "Según se informa, la película costó diez millones.", pt: "Segundo relatos, o filme custou dez milhões.", fr: "Le film aurait coûté dix millions.", de: "Der Film soll zehn Millionen gekostet haben.", it: "Il film sarebbe costato dieci milioni.", pl: "Film podobno kosztował dziesięć milionów.", tr: "Bildirildiğine göre filmin maliyeti on milyon.", id: "Film itu dilaporkan menelan biaya sepuluh juta.", vi: "Theo báo cáo, bộ phim tốn mười triệu." } }
          - { level: C1, marker: supposedly, shows: { en: "a belief the writer doubts", uk: "переконання, у якому автор сумнівається", es: "una creencia de la que quien escribe duda", pt: "uma crença da qual quem escreve duvida", fr: "une croyance dont l’auteur doute", de: "eine Annahme, an der der Schreiber zweifelt", it: "una convinzione di cui chi scrive dubita", pl: "przekonanie, w które autor wątpi", tr: "yazarın şüphe duyduğu bir inanç", id: "anggapan yang diragukan penulisnya", vi: "một niềm tin mà người viết nghi ngờ" }, ex: ["This is ", { target: supposedly }, " the best café in town."], tr: { uk: "Це нібито найкраща кав’ярня в місті.", es: "Este es supuestamente el mejor café de la ciudad.", pt: "Este é supostamente o melhor café da cidade.", fr: "C’est soi-disant le meilleur café de la ville.", de: "Das ist angeblich das beste Café der Stadt.", it: "Questo sarebbe il miglior caffè della città.", pl: "To rzekomo najlepsza kawiarnia w mieście.", tr: "Burası sözde şehrin en iyi kafesi.", id: "Ini konon kafe terbaik di kota.", vi: "Đây được cho là quán cà phê ngon nhất thành phố." } }
          - { level: C1, marker: "so-called", shows: { en: "a name that may not fit", uk: "назва, що може не пасувати", es: "un nombre que quizá no corresponde", pt: "um nome que pode não ser adequado", fr: "un nom qui ne convient peut-être pas", de: "eine Bezeichnung, die vielleicht nicht passt", it: "un nome che forse non è appropriato", pl: "nazwa, która może nie pasować", tr: "uymayabilecek bir ad", id: "sebutan yang mungkin tidak cocok", vi: "một tên gọi có thể không phù hợp" }, ex: ["His ", { target: "so-called" }, " friends never helped."], tr: { uk: "Його так звані друзі ніколи не допомагали.", es: "Sus supuestos amigos nunca ayudaron.", pt: "Os ditos amigos dele nunca ajudaram.", fr: "Ses soi-disant amis ne l’ont jamais aidé.", de: "Seine sogenannten Freunde haben nie geholfen.", it: "I suoi cosiddetti amici non lo hanno mai aiutato.", pl: "Jego tak zwani przyjaciele nigdy mu nie pomogli.", tr: "Sözde arkadaşları ona hiç yardım etmedi.", id: "Teman-temannya yang katanya teman itu tidak pernah membantu.", vi: "Những người được gọi là bạn của anh ấy chưa bao giờ giúp đỡ." } }
          - { level: C1, marker: "according to", shows: { en: "another person or document as the source", uk: "інша особа чи документ як джерело", es: "otra persona o un documento como fuente", pt: "outra pessoa ou um documento como fonte", fr: "une autre personne ou un document comme source", de: "eine andere Person oder ein Dokument als Quelle", it: "un'altra persona o un documento come fonte", pl: "inna osoba lub dokument jako źródło", tr: "kaynak olarak başka bir kişi ya da belge", id: "orang lain atau dokumen sebagai sumber", vi: "người khác hoặc tài liệu làm nguồn" }, ex: [{ target: "According to" }, " the report, sales fell."], tr: { uk: "Згідно зі звітом, продажі впали.", es: "Según el informe, las ventas cayeron.", pt: "De acordo com o relatório, as vendas caíram.", fr: "Selon le rapport, les ventes ont baissé.", de: "Laut dem Bericht sind die Verkäufe gesunken.", it: "Secondo il rapporto, le vendite sono calate.", pl: "Według raportu sprzedaż spadła.", tr: "Rapora göre satışlar düştü.", id: "Menurut laporan itu, penjualan turun.", vi: "Theo báo cáo, doanh số đã giảm." } }
          - { level: C1, marker: { pattern: [it is, said, that, { slot: clause }] }, shows: { en: "a general report with no named source", uk: "загальне повідомлення без названого джерела", es: "una información general sin fuente concreta", pt: "um relato geral sem fonte nomeada", fr: "un rapport général sans source nommée", de: "eine allgemeine Meldung ohne genannte Quelle", it: "una notizia generale senza fonte indicata", pl: "ogólna informacja bez wskazanego źródła", tr: "kaynağı belirtilmemiş genel bir bildirim", id: "kabar umum tanpa sumber yang disebut", vi: "một thông tin chung không nêu nguồn" }, ex: [{ target: "It is said that" }, " the mayor will resign."], tr: { uk: "Кажуть, що мер піде у відставку.", es: "Se dice que el alcalde renunciará.", pt: "Diz-se que o prefeito vai renunciar.", fr: "On dit que le maire va démissionner.", de: "Man sagt, der Bürgermeister werde zurücktreten.", it: "Si dice che il sindaco si dimetterà.", pl: "Mówi się, że burmistrz poda się do dymisji.", tr: "Belediye başkanının istifa edeceği söyleniyor.", id: "Konon wali kota akan mengundurkan diri.", vi: "Người ta nói rằng thị trưởng sẽ từ chức." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: Allegedly }, " and ", { term: reportedly }, " stand before the main verb or at the start of the clause."], uk: [{ term: "Allegedly" }, " і ", { term: "reportedly" }, " стоять перед основним дієсловом або на початку речення."], es: [{ term: "Allegedly" }, " y ", { term: "reportedly" }, " van antes del verbo principal o al principio de la oración."], pt: [{ term: "Allegedly" }, " e ", { term: "reportedly" }, " vêm antes do verbo principal ou no início da oração."], fr: [{ term: "Allegedly" }, " et ", { term: "reportedly" }, " se placent avant le verbe principal ou au début de la proposition."], de: [{ term: "Allegedly" }, " und ", { term: "reportedly" }, " stehen vor dem Hauptverb oder am Satzanfang."], it: [{ term: "Allegedly" }, " e ", { term: "reportedly" }, " stanno prima del verbo principale o all'inizio della frase."], pl: [{ term: "Allegedly" }, " i ", { term: "reportedly" }, " stoją przed czasownikiem głównym lub na początku zdania."], tr: [{ term: "Allegedly" }, " ve ", { term: "reportedly" }, " ana fiilden önce ya da cümlenin başında gelir."], id: [{ term: "Allegedly" }, " dan ", { term: "reportedly" }, " berada sebelum kata kerja utama atau di awal klausa."], vi: [{ term: "Allegedly" }, " và ", { term: "reportedly" }, " đứng trước động từ chính hoặc ở đầu mệnh đề."] }
            ex: { examples: [["The company has ", { target: reportedly }, " closed."], [{ target: Reportedly }, ", the company has closed."]] }
            tr: { uk: { examples: ["Компанія, за повідомленнями, закрилася.", "За повідомленнями, компанія закрилася."] }, es: { examples: ["La empresa, según se informa, cerró.", "Según se informa, la empresa cerró."] }, pt: { examples: ["A empresa, segundo relatos, fechou.", "Segundo relatos, a empresa fechou."] }, fr: { examples: ["L’entreprise aurait fermé.", "Selon certaines informations, l’entreprise a fermé."] }, de: { examples: ["Die Firma hat Berichten zufolge geschlossen.", "Berichten zufolge hat die Firma geschlossen."] }, it: { examples: ["L'azienda avrebbe chiuso.", "Secondo quanto riferito, l'azienda ha chiuso."] }, pl: { examples: ["Firma podobno została zamknięta.", "Podobno firma została zamknięta."] }, tr: { examples: ["Şirket bildirildiğine göre kapandı.", "Bildirildiğine göre şirket kapandı."] }, id: { examples: ["Perusahaan itu dilaporkan telah tutup.", "Dilaporkan, perusahaan itu telah tutup."] }, vi: { examples: ["Công ty được cho là đã đóng cửa.", "Theo báo cáo, công ty đã đóng cửa."] } }
          - type: rule
            level: C1
            text: { en: ["A passive reporting verb with ", { term: to }, " puts a claim at a distance:"], uk: ["Пасивне дієслово повідомлення з ", { term: "to" }, " тримає твердження на відстані:"], es: ["Un verbo introductorio en voz pasiva con ", { term: "to" }, " mantiene la afirmación a distancia:"], pt: ["Um verbo introdutório na voz passiva com ", { term: "to" }, " mantém a afirmação à distância:"], fr: ["Un verbe introducteur au passif suivi de ", { term: "to" }, " tient l’affirmation à distance :"], de: ["Ein einleitendes Verb im Passiv mit ", { term: "to" }, " hält eine Behauptung auf Distanz:"], it: ["Un verbo introduttivo al passivo con ", { term: "to" }, " tiene a distanza l'affermazione:"], pl: ["Czasownik wprowadzający w stronie biernej z ", { term: "to" }, " trzyma twierdzenie na dystans:"], tr: ["Edilgen aktarma fiili ve ", { term: "to" }, " bir iddiayı uzakta tutar:"], id: ["Kata kerja pelapor dalam bentuk pasif dengan ", { term: "to" }, " menjauhkan klaim:"], vi: ["Động từ tường thuật ở dạng bị động với ", { term: "to" }, " giữ khoảng cách với một khẳng định:"] }
            ex: ["She ", { target: "is said to speak" }, " six languages."]
            tr: { uk: "Кажуть, що вона розмовляє шістьма мовами.", es: "Se dice que habla seis idiomas.", pt: "Dizem que ela fala seis idiomas.", fr: "On dit qu’elle parle six langues.", de: "Sie soll sechs Sprachen sprechen.", it: "Si dice che parli sei lingue.", pl: "Podobno mówi sześcioma językami.", tr: "Altı dil konuştuğu söyleniyor.", id: "Dia konon bisa berbicara enam bahasa.", vi: "Nghe nói cô ấy nói được sáu thứ tiếng." }
          - type: note
            level: C1
            text: { en: ["Reporting verbs are in ", { link: "Reported Speech", to: en.sentence-building.reported-speech }, "."], uk: ["Дієслова повідомлення розглянуто в розділі ", { link: "Непряма мова", to: "en.sentence-building.reported-speech" }, "."], es: ["Los verbos introductorios están en ", { link: "El estilo indirecto", to: "en.sentence-building.reported-speech" }, "."], pt: ["Os verbos introdutórios estão em ", { link: "Discurso indireto", to: "en.sentence-building.reported-speech" }, "."], fr: ["Les verbes introducteurs sont dans ", { link: "Le discours indirect", to: "en.sentence-building.reported-speech" }, "."], de: ["Einleitende Verben stehen in ", { link: "Indirekte Rede", to: "en.sentence-building.reported-speech" }, "."], it: ["I verbi introduttivi sono in ", { link: "Discorso indiretto", to: "en.sentence-building.reported-speech" }, "."], pl: ["Czasowniki wprowadzające omówiono w temacie ", { link: "Mowa zależna", to: "en.sentence-building.reported-speech" }, "."], tr: ["Aktarma fiilleri ", { link: "Dolaylı anlatım", to: "en.sentence-building.reported-speech" }, " konusunda yer alır."], id: ["Kata kerja pelapor dibahas di ", { link: "Kalimat tak langsung", to: "en.sentence-building.reported-speech" }, "."], vi: ["Động từ tường thuật nằm trong bài ", { link: "Câu gián tiếp", to: "en.sentence-building.reported-speech" }, "."] }

