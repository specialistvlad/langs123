          - type: rule
            level: B2
            text: { en: [{ term: Fairly }, ", ", { term: quite }, " and ", { term: rather }, " rise in strength; ", { term: rather }, " often carries mild surprise."], uk: [{ term: "Fairly" }, ", ", { term: "quite" }, " і ", { term: "rather" }, " зростають за силою; ", { term: "rather" }, " часто виражає легке здивування."], es: [{ term: "Fairly" }, ", ", { term: "quite" }, " y ", { term: "rather" }, " aumentan en fuerza; ", { term: "rather" }, " suele expresar una leve sorpresa."], pt: [{ term: "Fairly" }, ", ", { term: "quite" }, " e ", { term: "rather" }, " aumentam em intensidade; ", { term: "rather" }, " costuma expressar uma leve surpresa."], fr: [{ term: "Fairly" }, ", ", { term: "quite" }, " et ", { term: "rather" }, " vont crescendo en force ; ", { term: "rather" }, " exprime souvent une légère surprise."], de: [{ term: "Fairly" }, ", ", { term: "quite" }, " und ", { term: "rather" }, " steigen in der Stärke; ", { term: "rather" }, " drückt oft leichte Überraschung aus."], it: [{ term: "Fairly" }, ", ", { term: "quite" }, " e ", { term: "rather" }, " crescono di intensità; ", { term: "rather" }, " spesso esprime una lieve sorpresa."], pl: [{ term: "Fairly" }, ", ", { term: "quite" }, " i ", { term: "rather" }, " rosną pod względem siły; ", { term: "rather" }, " często wyraża lekkie zaskoczenie."], tr: [{ term: "Fairly" }, ", ", { term: "quite" }, " ve ", { term: "rather" }, " sırayla güçlenir; ", { term: "rather" }, " çoğu zaman hafif bir şaşkınlık taşır."], id: [{ term: "Fairly" }, ", ", { term: "quite" }, " dan ", { term: "rather" }, " berurutan makin kuat; ", { term: "rather" }, " sering membawa kesan sedikit terkejut."], vi: [{ term: "Fairly" }, ", ", { term: "quite" }, " và ", { term: "rather" }, " tăng dần về mức độ; ", { term: "rather" }, " thường kèm chút ngạc nhiên."] }
            ex: { examples: [["The food was ", { target: fairly }, " good."], ["The food was ", { target: quite }, " good."], ["The food was ", { target: rather }, " good."]] }
            tr: { uk: { examples: ["Їжа була досить смачна.", "Їжа була цілком смачна.", "Їжа була напрочуд смачна."] }, es: { examples: ["La comida estuvo razonablemente buena.", "La comida estuvo bastante buena.", "La comida estuvo realmente buena."] }, pt: { examples: ["A comida estava razoavelmente boa.", "A comida estava bem boa.", "A comida estava bastante boa."] }, fr: { examples: ["La nourriture était assez bonne.", "La nourriture était plutôt bonne.", "La nourriture était franchement bonne."] }, de: { examples: ["Das Essen war ziemlich gut.", "Das Essen war recht gut.", "Das Essen war ausgesprochen gut."] }, it: { examples: ["Il cibo era abbastanza buono.", "Il cibo era piuttosto buono.", "Il cibo era decisamente buono."] }, pl: { examples: ["Jedzenie było dosyć dobre.", "Jedzenie było całkiem dobre.", "Jedzenie było naprawdę dobre."] }, tr: { examples: ["Yemek oldukça iyiydi.", "Yemek gayet iyiydi.", "Yemek epey iyiydi."] }, id: { examples: ["Makanannya cukup enak.", "Makanannya lumayan enak.", "Makanannya benar-benar enak."] }, vi: { examples: ["Đồ ăn khá ngon.", "Đồ ăn tương đối ngon.", "Đồ ăn ngon thật đấy."] } }

