  - title: { en: "Indirectness and politeness", uk: "Непрямість і ввічливість", es: "Indirección y cortesía", pt: "Indireção e cortesia", fr: "Indirection et politesse", de: "Indirektheit und Höflichkeit", it: "Indirettezza e cortesia", pl: "Pośredniość i uprzejmość", tr: "Dolaylılık ve nezaket", id: "Ketidaklangsungan dan kesopanan", vi: "Cách nói gián tiếp và lịch sự" }
