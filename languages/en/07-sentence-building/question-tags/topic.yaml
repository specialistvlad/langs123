          - { level: C1, start: { en: an exclamation }, tag: isn't it, ex: ["What a view, ", { target: isn't it }, "?"] }
          - { level: C1, start: "this, that", tag: it, ex: ["That's yours, ", { target: isn't it }, "?"] }
          - { level: C1, start: { en: a polite request }, tag: { alternatives: [would you, could you] }, ex: { examples: [["Pass the salt, ", { target: would you }, "?"], ["Hold the door, ", { target: could you }, "?"]] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: Nobody }, ", ", { term: nothing }, " and ", { term: never }, " make the statement negative, so the tag is positive."]
              uk: [{ term: Nobody }, ", ", { term: nothing }, " і ", { term: never }, " роблять речення заперечним, тому tag стверджувальний."]
              es: [{ term: Nobody }, ", ", { term: nothing }, " y ", { term: never }, " hacen negativa la oración, por eso la coletilla es afirmativa."]
              pt: [{ term: "Nobody" }, ", ", { term: "nothing" }, " e ", { term: "never" }, " tornam a frase negativa, por isso a tag é afirmativa."]
              fr: [{ term: "Nobody" }, ", ", { term: "nothing" }, " et ", { term: "never" }, " rendent la phrase négative, le tag est donc affirmatif."]
              de: [{ term: "Nobody" }, ", ", { term: "nothing" }, " und ", { term: "never" }, " machen die Aussage verneint, daher ist der Tag bejaht."]
              it: [{ term: "Nobody" }, ", ", { term: "nothing" }, " e ", { term: "never" }, " rendono negativa la frase, quindi il tag è affermativo."]
              pl: [{ term: "Nobody" }, ", ", { term: "nothing" }, " i ", { term: "never" }, " czynią zdanie przeczącym, dlatego tag jest twierdzący."]
              tr: [{ term: "Nobody" }, ", ", { term: "nothing" }, " ve ", { term: "never" }, " cümleyi olumsuz yapar, bu yüzden tag olumludur."]
              id: [{ term: "Nobody" }, ", ", { term: "nothing" }, " dan ", { term: "never" }, " membuat kalimat menjadi negatif, sehingga tag-nya positif."]
              vi: [{ term: "Nobody" }, ", ", { term: "nothing" }, " và ", { term: "never" }, " làm câu mang nghĩa phủ định, nên phần hỏi đuôi là khẳng định."]
          - type: rule
            level: B1
            text:
              en: ["A tag after a command is a polite request. ", { term: won't you }, " is more friendly: ", { term: "Come in, won't you?" }]
              uk: ["Tag після наказу звучить як ввічливе прохання. ", { term: won't you }, " звучить дружніше: ", { term: "Come in, won't you?" }]
              es: ["Una coletilla después de una orden es una petición cortés. ", { term: won't you }, " es más amable: ", { term: "Come in, won't you?" }]
              pt: ["Uma tag depois de uma ordem é um pedido educado. ", { term: "won't you" }, " é mais amável: ", { term: "Come in, won't you?" }]
              fr: ["Un tag après un ordre est une demande polie. ", { term: "won't you" }, " est plus aimable : ", { term: "Come in, won't you?" }]
              de: ["Ein Tag nach einem Befehl ist eine höfliche Bitte. ", { term: "won't you" }, " ist freundlicher: ", { term: "Come in, won't you?" }]
              it: ["Un tag dopo un imperativo è una richiesta cortese. ", { term: "won't you" }, " è più cordiale: ", { term: "Come in, won't you?" }]
              pl: ["Tag po poleceniu brzmi jak uprzejma prośba. ", { term: "won't you" }, " brzmi przyjaźniej: ", { term: "Come in, won't you?" }]
              tr: ["Emirden sonra gelen tag nazik bir rica olur. ", { term: "won't you" }, " daha sıcaktır: ", { term: "Come in, won't you?" }]
              id: ["Tag setelah perintah merupakan permintaan sopan. ", { term: "won't you" }, " lebih ramah: ", { term: "Come in, won't you?" }]
              vi: ["Phần hỏi đuôi sau câu mệnh lệnh là một lời yêu cầu lịch sự. ", { term: "won't you" }, " thân thiện hơn: ", { term: "Come in, won't you?" }]

  - title: { en: "Form: tags after I think and complex sentences" }
    role: form
    content:
      - type: usage
        columns:
          - { key: start, label: { en: Statement } }
          - { key: follows, label: { en: The tag matches } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, start: { pattern: [{ alternatives: [I think, I suppose, I believe] }, { slot: clause }] }, follows: { en: the clause after the verb }, ex: ["I suppose he's late, ", { target: isn't he }, "?"] }
          - { level: B2, start: { pattern: [I don't think, { slot: clause }] }, follows: { en: "the clause, read as negative: a positive tag" }, ex: ["I don't think he's coming, ", { target: is he }, "?"] }
          - { level: B2, start: { pattern: [{ slot: subject }, { slot: verb }, { slot: clause }] }, follows: { en: the main clause }, ex: ["He said he would come, ", { target: didn't he }, "?"] }
          - { level: B2, start: { en: [{ alternatives: [{ term: if }, { term: when }] }, " clause, then the main clause"] }, follows: { en: the main clause }, ex: ["If it rains, we'll stay in, ", { target: won't we }, "?"] }

  - title: { en: "Form: same-polarity tags" }
