      rows:
        - { level: B1, point: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }, rule: { en: "positive statement, negative tag; negative statement, positive tag", uk: "стверджувальне речення, заперечний tag; заперечне речення, стверджувальний tag", es: "oración afirmativa, coletilla negativa; oración negativa, coletilla afirmativa", pt: "frase afirmativa, tag negativa; frase negativa, tag afirmativa", fr: "phrase affirmative, tag négatif ; phrase négative, tag affirmatif", de: "bejahte Aussage, verneinter Tag; verneinte Aussage, bejahter Tag", it: "frase affermativa, tag negativo; frase negativa, tag affermativo", pl: "zdanie twierdzące, tag przeczący; zdanie przeczące, tag twierdzący", tr: "olumlu cümle, olumsuz tag; olumsuz cümle, olumlu tag", id: "kalimat positif, tag negatif; kalimat negatif, tag positif", vi: "câu khẳng định, phần hỏi đuôi phủ định; câu phủ định, phần hỏi đuôi khẳng định" }, ex: { examples: [["It's cold, ", { target: isn't it }, "?"], ["It isn't cold, ", { target: is it }, "?"]] }, tr: { uk: { examples: ["Холодно, правда?", "Не холодно, правда?"] }, es: { examples: ["Hace frío, ¿no?", "No hace frío, ¿verdad?"] }, pt: { examples: ["Está frio, não é?", "Não está frio, está?"] }, fr: { examples: ["Il fait froid, non ?", "Il ne fait pas froid, n’est-ce pas ?"] }, de: { examples: ["Es ist kalt, nicht wahr?", "Es ist nicht kalt, oder?"] }, it: { examples: ["Fa freddo, vero?", "Non fa freddo, vero?"] }, pl: { examples: ["Jest zimno, prawda?", "Nie jest zimno, prawda?"] }, tr: { examples: ["Hava soğuk, değil mi?", "Hava soğuk değil, değil mi?"] }, id: { examples: ["Dingin, ya?", "Tidak dingin, kan?"] }, vi: { examples: ["Trời lạnh, đúng không?", "Trời không lạnh, đúng không?"] } } }
        - { level: B1, point: { en: Pronoun, uk: "Займенник", es: "Pronombre", pt: "Pronome", fr: "Pronom", de: "Pronomen", it: "Pronome", pl: "Zaimek", tr: "Zamir", id: "Kata ganti", vi: "Đại từ" }, rule: { en: [{ pattern: [auxiliary, pronoun] }, "; the pronoun replaces the subject"], uk: [{ pattern: ["допоміжне дієслово", "займенник"] }, "; займенник замінює підмет"], es: [{ pattern: ["verbo auxiliar", "pronombre"] }, "; el pronombre sustituye al sujeto"], pt: [{ pattern: ["verbo auxiliar", "pronome"] }, "; o pronome substitui o sujeito"], fr: [{ pattern: ["auxiliaire", "pronom"] }, " ; le pronom remplace le sujet"], de: [{ pattern: ["Hilfsverb", "Pronomen"] }, "; das Pronomen ersetzt das Subjekt"], it: [{ pattern: ["ausiliare", "pronome"] }, "; il pronome sostituisce il soggetto"], pl: [{ pattern: ["czasownik pomocniczy", "zaimek"] }, "; zaimek zastępuje podmiot"], tr: [{ pattern: ["yardımcı fiil", "zamir"] }, "; zamir özneyi karşılar"], id: [{ pattern: ["kata kerja bantu", "kata ganti"] }, "; kata ganti menggantikan subjek"], vi: [{ pattern: ["trợ động từ", "đại từ"] }, "; đại từ thay cho chủ ngữ"] }, ex: ["Tom is late, isn't ", { target: he }, "?"], tr: { uk: "Том запізнюється, правда ж?", es: "Tom llega tarde, ¿no?", pt: "O Tom está atrasado, não é?", fr: "Tom est en retard, n’est-ce pas ?", de: "Tom kommt zu spät, oder?", it: "Tom è in ritardo, vero?", pl: "Tom się spóźnia, prawda?", tr: "Tom geç kaldı, değil mi?", id: "Tom terlambat, kan?", vi: "Tom đến muộn, phải không?" } }
        - { level: B1, point: be, rule: { alternatives: [isn't, aren't, wasn't, weren't] }, ex: ["They ", { target: were }, " late, ", { target: weren't they }, "?"], tr: { uk: "Вони запізнилися, чи не так?", es: "Llegaron tarde, ¿no?", pt: "Eles chegaram atrasados, não é?", fr: "Ils étaient en retard, n’est-ce pas ?", de: "Sie kamen zu spät, oder?", it: "Erano in ritardo, vero?", pl: "Spóźnili się, prawda?", tr: "Geç kaldılar, değil mi?", id: "Mereka terlambat, kan?", vi: "Họ đã đến muộn, phải không?" } }
        - { level: B1, point: { en: Other verbs, uk: "Інші дієслова", es: "Otros verbos", pt: "Outros verbos", fr: "Autres verbes", de: "Andere Verben", it: "Altri verbi", pl: "Inne czasowniki", tr: "Diğer fiiller", id: "Kata kerja lain", vi: "Các động từ khác" }, rule: { en: ["present: ", { alternatives: [{ term: don't }, { term: doesn't }] }, "; past: ", { term: didn't }], uk: ["теперішній час: ", { alternatives: [{ term: don't }, { term: doesn't }] }, "; минулий час: ", { term: didn't }], es: ["presente: ", { alternatives: [{ term: don't }, { term: doesn't }] }, "; pasado: ", { term: didn't }], pt: ["presente: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; passado: ", { term: "didn't" }], fr: ["présent : ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, " ; prétérit : ", { term: "didn't" }], de: ["Gegenwart: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; Vergangenheit: ", { term: "didn't" }], it: ["presente: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; passato: ", { term: "didn't" }], pl: ["czas teraźniejszy: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; czas przeszły: ", { term: "didn't" }], tr: ["şimdiki zaman: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; geçmiş zaman: ", { term: "didn't" }], id: ["present: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; past: ", { term: "didn't" }], vi: ["hiện tại: ", { alternatives: [{ term: "don't" }, { term: "doesn't" }] }, "; quá khứ: ", { term: "didn't" }] }, ex: { examples: [["She ", { target: works }, " here, ", { target: doesn't she }, "?"], ["He ", { target: left }, " early, ", { target: didn't he }, "?"]] }, tr: { uk: { examples: ["Вона тут працює, правда?", "Він рано пішов, так?"] }, es: { examples: ["Ella trabaja aquí, ¿no?", "Se fue temprano, ¿no?"] }, pt: { examples: ["Ela trabalha aqui, não é?", "Ele saiu cedo, não é?"] }, fr: { examples: ["Elle travaille ici, non ?", "Il est parti tôt, n’est-ce pas ?"] }, de: { examples: ["Sie arbeitet hier, oder?", "Er ist früh gegangen, nicht wahr?"] }, it: { examples: ["Lavora qui, vero?", "È andato via presto, vero?"] }, pl: { examples: ["Ona tu pracuje, prawda?", "Wyszedł wcześnie, prawda?"] }, tr: { examples: ["Burada çalışıyor, değil mi?", "Erken gitti, değil mi?"] }, id: { examples: ["Dia bekerja di sini, kan?", "Dia berangkat lebih awal, kan?"] }, vi: { examples: ["Cô ấy làm việc ở đây, phải không?", "Anh ấy đã về sớm, phải không?"] } } }
        - { level: B1, point: "have, modals", rule: { en: repeat the auxiliary or modal, uk: "повтори допоміжне чи модальне дієслово", es: "repite el auxiliar o el modal", pt: "repete o auxiliar ou o modal", fr: "reprend l’auxiliaire ou le modal", de: "das Hilfsverb oder Modalverb wiederholen", it: "ripete l'ausiliare o il modale", pl: "powtarza się czasownik pomocniczy lub modalny", tr: "yardımcı ya da modal fiil tekrarlanır", id: "ulangi kata kerja bantu atau modal", vi: "lặp lại trợ động từ hoặc động từ khuyết thiếu" }, ex: { examples: [["You've ", { target: finished }, ", ", { target: haven't you }, "?"], ["You ", { target: can }, " swim, ", { target: can't you }, "?"]] }, tr: { uk: { examples: ["Ти закінчив, так?", "Ти вмієш плавати, так?"] }, es: { examples: ["Has terminado, ¿no?", "Sabes nadar, ¿no?"] }, pt: { examples: ["Você terminou, não é?", "Você sabe nadar, não é?"] }, fr: { examples: ["Tu as fini, non ?", "Tu sais nager, n’est-ce pas ?"] }, de: { examples: ["Du bist fertig, oder?", "Du kannst schwimmen, oder?"] }, it: { examples: ["Hai finito, vero?", "Sai nuotare, vero?"] }, pl: { examples: ["Skończyłeś, prawda?", "Umiesz pływać, prawda?"] }, tr: { examples: ["Bitirdin, değil mi?", "Yüzebilirsin, değil mi?"] }, id: { examples: ["Kamu sudah selesai, kan?", "Kamu bisa berenang, kan?"] }, vi: { examples: ["Bạn đã làm xong rồi, phải không?", "Bạn biết bơi, phải không?"] } } }
        - { level: B1, point: I am, rule: aren't I, ex: [I, { target: "'m" }, " right, ", { target: aren't I }, "?"], tr: { uk: "Я правий, чи не так?", es: "Tengo razón, ¿no?", pt: "Eu tenho razão, não é?", fr: "J’ai raison, n’est-ce pas ?", de: "Ich habe recht, oder?", it: "Ho ragione, vero?", pl: "Mam rację, prawda?", tr: "Haklıyım, değil mi?", id: "Saya benar, kan?", vi: "Tôi nói đúng, phải không?" } }
        - { level: B1, point: { en: [{ term: Let's }, ", command"], uk: [{ term: Let's }, ", наказ"], es: [{ term: Let's }, ", orden"], pt: [{ term: "Let's" }, ", ordem"], fr: [{ term: "Let's" }, ", ordre"], de: [{ term: "Let's" }, ", Befehl"], it: [{ term: "Let's" }, ", imperativo"], pl: [{ term: "Let's" }, ", polecenie"], tr: [{ term: "Let's" }, ", emir"], id: [{ term: "Let's" }, ", perintah"], vi: [{ term: "Let's" }, ", câu mệnh lệnh"] }, rule: { en: [{ takes: [{ term: Let's }, { term: shall we }] }, "; ", { takes: [command, { term: will you }] }], uk: [{ takes: [{ term: Let's }, { term: shall we }] }, "; ", { takes: ["наказ", { term: will you }] }], es: [{ takes: [{ term: Let's }, { term: shall we }] }, "; ", { takes: ["orden", { term: will you }] }], pt: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["ordem", { term: "will you" }] }], fr: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, " ; ", { takes: ["ordre", { term: "will you" }] }], de: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["Befehl", { term: "will you" }] }], it: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["imperativo", { term: "will you" }] }], pl: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["polecenie", { term: "will you" }] }], tr: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["emir", { term: "will you" }] }], id: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["perintah", { term: "will you" }] }], vi: [{ takes: [{ term: "Let's" }, { term: "shall we" }] }, "; ", { takes: ["câu mệnh lệnh", { term: "will you" }] }] }, ex: { examples: [[{ target: Let's }, " go, ", { target: shall we }, "?"], [{ target: Open }, " the door, ", { target: will you }, "?"]] }, tr: { uk: { examples: ["Ходімо, гаразд?", "Відчини двері, добре?"] }, es: { examples: ["Vamos, ¿te parece?", "Abre la puerta, ¿sí?"] }, pt: { examples: ["Vamos, que tal?", "Abra a porta, pode ser?"] }, fr: { examples: ["Allons-y, d’accord ?", "Ouvre la porte, tu veux bien ?"] }, de: { examples: ["Lass uns gehen, ja?", "Mach die Tür auf, ja?"] }, it: { examples: ["Andiamo, ti va?", "Apri la porta, va bene?"] }, pl: { examples: ["Chodźmy, dobrze?", "Otwórz drzwi, dobrze?"] }, tr: { examples: ["Gidelim, olur mu?", "Kapıyı aç, olur mu?"] }, id: { examples: ["Ayo pergi, ya?", "Buka pintunya, ya?"] }, vi: { examples: ["Đi thôi, được không?", "Mở cửa ra, được không?"] } } }
        - { level: B1, point: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }, rule: { en: "check something, make conversation or ask politely", uk: "перевірити щось, підтримати розмову або ввічливо попросити", es: "comprobar algo, conversar o pedir con cortesía", pt: "verificar algo, puxar conversa ou pedir com educação", fr: "vérifier quelque chose, faire la conversation ou demander poliment", de: "etwas prüfen, ein Gespräch führen oder höflich bitten", it: "verificare qualcosa, fare conversazione o chiedere con gentilezza", pl: "sprawdzić coś, podtrzymać rozmowę lub uprzejmie o coś poprosić", tr: "bir şeyi kontrol etmek, sohbet etmek ya da nazikçe rica etmek", id: "memeriksa sesuatu, bercakap-cakap, atau meminta dengan sopan", vi: "kiểm tra điều gì đó, bắt chuyện hoặc nhờ vả một cách lịch sự" }, ex: ["You're from Madrid, ", { target: aren't you }, "?"], tr: { uk: "Ти з Мадрида, так?", es: "Eres de Madrid, ¿verdad?", pt: "Você é de Madri, não é?", fr: "Tu es de Madrid, n’est-ce pas ?", de: "Du kommst aus Madrid, oder?", it: "Sei di Madrid, vero?", pl: "Jesteś z Madrytu, prawda?", tr: "Madrid’densin, değil mi?", id: "Kamu dari Madrid, kan?", vi: "Bạn đến từ Madrid, phải không?" } }
        - { level: B1, point: { en: Intonation, uk: "Інтонація", es: "Entonación", pt: "Entonação", fr: "Intonation", de: "Intonation", it: "Intonazione", pl: "Intonacja", tr: "Tonlama", id: "Intonasi", vi: "Ngữ điệu" }, rule: { en: ["falling ", { intonation: fall }, ": you are sure; rising ", { intonation: rise }, ": a real question"], uk: ["спадна ", { intonation: fall }, ": мовець упевнений; висхідна ", { intonation: rise }, ": справжнє питання"], es: ["descendente ", { intonation: fall }, ": el hablante está seguro; ascendente ", { intonation: rise }, ": una pregunta real"], pt: ["descendente ", { intonation: "fall" }, ": o falante tem certeza; ascendente ", { intonation: "rise" }, ": uma pergunta de verdade"], fr: ["descendante ", { intonation: "fall" }, " : le locuteur est sûr ; montante ", { intonation: "rise" }, " : une vraie question"], de: ["fallend ", { intonation: "fall" }, ": der Sprecher ist sicher; steigend ", { intonation: "rise" }, ": eine echte Frage"], it: ["discendente ", { intonation: "fall" }, ": il parlante è sicuro; ascendente ", { intonation: "rise" }, ": una domanda vera"], pl: ["opadająca ", { intonation: "fall" }, ": mówiący jest pewny; wznosząca ", { intonation: "rise" }, ": prawdziwe pytanie"], tr: ["inen ", { intonation: "fall" }, ": konuşan emin; yükselen ", { intonation: "rise" }, ": gerçek bir soru"], id: ["turun ", { intonation: "fall" }, ": penutur yakin; naik ", { intonation: "rise" }, ": pertanyaan sungguhan"], vi: ["xuống giọng ", { intonation: "fall" }, ": người nói chắc chắn; lên giọng ", { intonation: "rise" }, ": một câu hỏi thật sự"] }, ex: { examples: [["It's a lovely day, ", { target: isn't it }, "? ", { intonation: fall }], ["You haven't seen my keys, ", { target: have you }, "? ", { intonation: rise }]] }, tr: { uk: { examples: ["Чудовий день, правда?", "Ти не бачив моїх ключів, правда?"] }, es: { examples: ["Es un día precioso, ¿verdad?", "No has visto mis llaves, ¿verdad?"] }, pt: { examples: ["É um dia lindo, não é?", "Você não viu minhas chaves, viu?"] }, fr: { examples: ["C’est une belle journée, n’est-ce pas ?", "Tu n’as pas vu mes clés, par hasard ?"] }, de: { examples: ["Es ist ein schöner Tag, nicht wahr?", "Du hast meine Schlüssel nicht gesehen, oder?"] }, it: { examples: ["È una bella giornata, vero?", "Non hai visto le mie chiavi, vero?"] }, pl: { examples: ["To piękny dzień, prawda?", "Nie widziałeś moich kluczy, prawda?"] }, tr: { examples: ["Güzel bir gün, değil mi?", "Anahtarlarımı görmedin, değil mi?"] }, id: { examples: ["Hari yang indah, ya?", "Kamu belum melihat kunci saya, kan?"] }, vi: { examples: ["Hôm nay trời đẹp, đúng không?", "Bạn chưa thấy chìa khóa của tôi, phải không?"] } } }
        - { level: B2, point: { en: Claim and same polarity, uk: "Твердження й однакова полярність", es: "Afirmación y misma polaridad", pt: "Afirmação e mesma polaridade", fr: "Affirmation et même polarité", de: "Behauptung und gleiche Polarität", it: "Affermazione e stessa polarità", pl: "Twierdzenie i ta sama polarność", tr: "İddia ve aynı kutupluluk", id: "Pernyataan dan polaritas yang sama", vi: "Nhận định và phần hỏi đuôi cùng dạng" }, rule: { en: "the tag follows the claim; the same polarity shows suspicion", uk: "tag відповідає твердженню; однакова полярність виражає підозру", es: "la coletilla concuerda con la afirmación; la misma polaridad expresa sospecha", pt: "a tag concorda com a afirmação; a mesma polaridade expressa desconfiança", fr: "le tag s’accorde avec l’affirmation ; la même polarité exprime le soupçon", de: "der Tag passt zur Behauptung; gleiche Polarität drückt Misstrauen aus", it: "il tag corrisponde all'affermazione; la stessa polarità esprime sospetto", pl: "tag odpowiada twierdzeniu; ta sama polarność wyraża podejrzliwość", tr: "tag iddiayla uyumludur; aynı kutupluluk şüpheyi gösterir", id: "tag mengikuti pernyataan; polaritas yang sama menunjukkan kecurigaan", vi: "phần hỏi đuôi phù hợp với nhận định; cùng dạng khẳng định hoặc phủ định thể hiện sự nghi ngờ" }, ex: { examples: [["I don't think he's coming, ", { target: is he }, "?"], ["So you're a doctor, ", { target: are you }, "?"]] }, tr: { uk: { examples: ["Я не думаю, що він прийде, правда?", "Отже, ти лікар, так?"] }, es: { examples: ["No creo que venga, ¿verdad?", "Así que eres médico, ¿eh?"] }, pt: { examples: ["Acho que ele não vem, não é?", "Então você é médico, é?"] }, fr: { examples: ["Je ne pense pas qu’il vienne, n’est-ce pas ?", "Alors comme ça, tu es médecin, hein ?"] }, de: { examples: ["Ich glaube nicht, dass er kommt, oder?", "Du bist also Arzt, ja?"] }, it: { examples: ["Non penso che venga, vero?", "Quindi sei medico, eh?"] }, pl: { examples: ["Nie sądzę, że przyjdzie, prawda?", "Więc jesteś lekarzem, tak?"] }, tr: { examples: ["Geleceğini sanmıyorum, değil mi?", "Demek doktorsun, öyle mi?"] }, id: { examples: ["Saya rasa dia tidak datang, kan?", "Jadi kamu dokter, ya?"] }, vi: { examples: ["Tôi không nghĩ anh ấy sẽ đến, phải không?", "Vậy là bạn làm bác sĩ, à?"] } } }
        - { level: C1, point: { en: Echo and informal checks, uk: "Перепитування й розмовні перевірки", es: "Eco y comprobaciones informales", pt: "Eco e verificações informais", fr: "Écho et vérifications familières", de: "Echo und lockere Nachfragen", it: "Eco e verifiche informali", pl: "Echo i nieformalne sprawdzenia", tr: "Yankı ve gündelik onay soruları", id: "Gema dan pemeriksaan informal", vi: "Câu hỏi lặp và cách hỏi xác nhận thân mật" }, rule: { en: ["an echo repeats the auxiliary; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " check informally"], uk: ["перепитування повторює допоміжне дієслово; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " — неформальні перевірки"], es: ["el eco repite el auxiliar; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " comprueban de manera informal"], pt: ["o eco repete o auxiliar; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " verificam de modo informal"], fr: ["l’écho reprend l’auxiliaire ; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " vérifient de façon familière"], de: ["das Echo wiederholt das Hilfsverb; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " fragen locker nach"], it: ["l'eco ripete l'ausiliare; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " verificano in modo informale"], pl: ["echo powtarza czasownik pomocniczy; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " sprawdzają nieformalnie"], tr: ["yankı sorusu yardımcı fiili tekrarlar; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " gündelik konuşmada onay alır"], id: ["gema mengulang kata kerja bantu; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " memeriksa secara informal"], vi: ["câu lặp nhắc lại trợ động từ; ", { alternatives: [{ term: "right" }, { term: "OK" }, { term: "yeah" }] }, " dùng để kiểm tra một cách thân mật"] }, ex: { exchange: ["I've been to Peru.", [{ target: Have }, " you?"]] }, tr: { uk: { exchange: ["Я був у Перу.", "Справді?"] }, es: { exchange: ["He estado en Perú.", "¿En serio?"] }, pt: { exchange: ["Eu já estive no Peru.", "Sério?"] }, fr: { exchange: ["Je suis allé au Pérou.", "Vraiment ?"] }, de: { exchange: ["Ich war schon mal in Peru.", "Wirklich?"] }, it: { exchange: ["Sono stato in Perù.", "Davvero?"] }, pl: { exchange: ["Byłem w Peru.", "Naprawdę?"] }, tr: { exchange: ["Peru’ya gittim.", "Gerçekten mi?"] }, id: { exchange: ["Saya pernah ke Peru.", "Oh ya?"] }, vi: { exchange: ["Tôi từng đến Peru.", "Vậy à?"] } } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ alternatives: [{ term: nobody }, { term: nothing }, { term: never }] }, " make the statement negative: positive tag"], uk: [{ alternatives: [{ term: nobody }, { term: nothing }, { term: never }] }, " роблять речення заперечним: стверджувальний tag"], es: [{ alternatives: [{ term: nobody }, { term: nothing }, { term: never }] }, " hacen negativa la oración: coletilla afirmativa"], pt: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " tornam a frase negativa: tag afirmativa"], fr: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " rendent la phrase négative : tag affirmatif"], de: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " machen die Aussage verneint: bejahter Tag"], it: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " rendono negativa la frase: tag affermativo"], pl: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " czynią zdanie przeczącym: tag twierdzący"], tr: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " cümleyi olumsuz yapar: olumlu tag"], id: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " membuat kalimat menjadi negatif: tag positif"], vi: [{ alternatives: [{ term: "nobody" }, { term: "nothing" }, { term: "never" }] }, " làm câu mang nghĩa phủ định: phần hỏi đuôi khẳng định"] }, ex: [{ target: Nobody }, " called, ", { target: did they }, "?"], tr: { uk: "Ніхто не дзвонив, правда?", es: "Nadie llamó, ¿verdad?", pt: "Ninguém ligou, não é?", fr: "Personne n’a appelé, n’est-ce pas ?", de: "Niemand hat angerufen, oder?", it: "Non ha chiamato nessuno, vero?", pl: "Nikt nie dzwonił, prawda?", tr: "Kimse aramadı, değil mi?", id: "Tidak ada yang menelepon, kan?", vi: "Không ai gọi, đúng không?" } }

sections:
  - title: { en: "Form: auxiliary and pronoun", uk: "Форма: допоміжне дієслово й займенник", es: "Forma: auxiliar y pronombre", pt: "Forma: auxiliar e pronome", fr: "Forme : auxiliaire et pronom", de: "Form: Hilfsverb und Pronomen", it: "Forma: ausiliare e pronome", pl: "Forma: czasownik pomocniczy i zaimek", tr: "Biçim: yardımcı fiil ve zamir", id: "Bentuk: kata kerja bantu dan kata ganti", vi: "Dạng: trợ động từ và đại từ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: statement, label: { en: Statement, uk: "Речення", es: "Oración", pt: "Frase", fr: "Phrase", de: "Aussage", it: "Frase", pl: "Zdanie", tr: "Cümle", id: "Kalimat", vi: "Câu trần thuật" } }
          - { key: tag, label: { en: Tag, uk: "Tag", es: "Coletilla", pt: "Tag", fr: "Tag", de: "Question Tag", it: "Tag", pl: "Tag", tr: "Tag", id: "Tag", vi: "Phần hỏi đuôi" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, statement: { en: positive, uk: "стверджувальне", es: "afirmativa", pt: "afirmativa", fr: "affirmative", de: "bejaht", it: "affermativa", pl: "twierdzące", tr: "olumlu", id: "positif", vi: "khẳng định" }, tag: { en: negative, uk: "заперечний", es: "negativa", pt: "negativa", fr: "négative", de: "verneint", it: "negativa", pl: "przeczący", tr: "olumsuz", id: "negatif", vi: "phủ định" }, ex: ["It's cold, ", { target: isn't it }, "?"], tr: { uk: "Холодно, правда?", es: "Hace frío, ¿no?", pt: "Está frio, não é?", fr: "Il fait froid, non ?", de: "Es ist kalt, nicht wahr?", it: "Fa freddo, vero?", pl: "Jest zimno, prawda?", tr: "Hava soğuk, değil mi?", id: "Dingin, ya?", vi: "Trời lạnh, đúng không?" } }
          - { level: B1, statement: { en: negative, uk: "заперечне", es: "negativa", pt: "negativa", fr: "négative", de: "verneint", it: "negativa", pl: "przeczące", tr: "olumsuz", id: "negatif", vi: "phủ định" }, tag: { en: positive, uk: "стверджувальний", es: "afirmativa", pt: "afirmativa", fr: "affirmative", de: "bejaht", it: "affermativa", pl: "twierdzący", tr: "olumlu", id: "positif", vi: "khẳng định" }, ex: ["It isn't cold, ", { target: is it }, "?"], tr: { uk: "Не холодно, правда?", es: "No hace frío, ¿verdad?", pt: "Não está frio, está?", fr: "Il ne fait pas froid, n’est-ce pas ?", de: "Es ist nicht kalt, oder?", it: "Non fa freddo, vero?", pl: "Nie jest zimno, prawda?", tr: "Hava soğuk değil, değil mi?", id: "Tidak dingin, kan?", vi: "Trời không lạnh, đúng không?" } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The tag is an ", { pattern: [auxiliary, a pronoun] }, ": ", { term: isn't it }, ", ", { term: doesn't she }, "."]
              uk: ["Tag — це ", { pattern: ["допоміжне дієслово", "займенник"] }, ": ", { term: isn't it }, ", ", { term: doesn't she }, "."]
              es: ["La coletilla es ", { pattern: ["verbo auxiliar", "pronombre"] }, ": ", { term: isn't it }, ", ", { term: doesn't she }, "."]
              pt: ["A tag é ", { pattern: ["verbo auxiliar", "pronome"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              fr: ["Le tag est ", { pattern: ["un auxiliaire", "un pronom"] }, " : ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              de: ["Der Tag besteht aus ", { pattern: ["Hilfsverb", "Pronomen"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              it: ["Il tag è formato da ", { pattern: ["ausiliare", "pronome"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              pl: ["Tag to ", { pattern: ["czasownik pomocniczy", "zaimek"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              tr: ["Tag ", { pattern: ["yardımcı fiil", "bir zamir"] }, " olarak kurulur: ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              id: ["Tag berupa ", { pattern: ["kata kerja bantu", "kata ganti"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
              vi: ["Phần hỏi đuôi gồm ", { pattern: ["trợ động từ", "đại từ"] }, ": ", { term: "isn't it" }, ", ", { term: "doesn't she" }, "."]
          - type: rule
            level: B1
            text:
              en: "The pronoun replaces the subject:"
              uk: "Займенник замінює підмет:"
              es: "El pronombre sustituye al sujeto:"
              pt: "O pronome substitui o sujeito:"
              fr: "Le pronom remplace le sujet :"
              de: "Das Pronomen ersetzt das Subjekt:"
              it: "Il pronome sostituisce il soggetto:"
              pl: "Zaimek zastępuje podmiot:"
              tr: "Zamir özneyi karşılar:"
              id: "Kata ganti menggantikan subjek:"
              vi: "Đại từ thay cho chủ ngữ:"
            ex: ["Tom is late, isn't ", { target: he }, "?"]
            tr: { uk: "Том запізнюється, правда ж?", es: "Tom llega tarde, ¿no?", pt: "O Tom está atrasado, não é?", fr: "Tom est en retard, n’est-ce pas ?", de: "Tom kommt zu spät, oder?", it: "Tom è in ritardo, vero?", pl: "Tom się spóźnia, prawda?", tr: "Tom geç kaldı, değil mi?", id: "Tom terlambat, kan?", vi: "Tom đến muộn, phải không?" }
          - type: rule
            level: B1
            text:
              en: ["The negative tag uses the short form: ", { term: isn't }, ", ", { term: doesn't }, ", ", { term: can't }, "."]
              uk: ["Заперечний tag має скорочену форму: ", { term: isn't }, ", ", { term: doesn't }, ", ", { term: can't }, "."]
              es: ["La coletilla negativa usa la forma contraída: ", { term: isn't }, ", ", { term: doesn't }, ", ", { term: can't }, "."]
              pt: ["A tag negativa usa a forma contraída: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              fr: ["Le tag négatif emploie la forme contractée : ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              de: ["Der verneinte Tag verwendet die Kurzform: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              it: ["Il tag negativo usa la forma contratta: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              pl: ["Tag przeczący ma formę skróconą: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              tr: ["Olumsuz tag kısa biçimi kullanır: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              id: ["Tag negatif memakai bentuk singkat: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]
              vi: ["Phần hỏi đuôi phủ định dùng dạng rút gọn: ", { term: "isn't" }, ", ", { term: "doesn't" }, ", ", { term: "can't" }, "."]

  - title: { en: "Form: the auxiliary matches the verb", uk: "Форма: допоміжне дієслово відповідає дієслову", es: "Forma: el auxiliar concuerda con el verbo", pt: "Forma: o auxiliar concorda com o verbo", fr: "Forme : l’auxiliaire s’accorde avec le verbe", de: "Form: das Hilfsverb passt zum Verb", it: "Forma: l'ausiliare corrisponde al verbo", pl: "Forma: czasownik pomocniczy odpowiada czasownikowi", tr: "Biçim: yardımcı fiil, fiille uyumludur", id: "Bentuk: kata kerja bantu mengikuti kata kerja", vi: "Dạng: trợ động từ phù hợp với động từ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb in the statement, uk: "Дієслово в реченні", es: "Verbo de la oración", pt: "Verbo da frase", fr: "Verbe de la phrase", de: "Verb in der Aussage", it: "Verbo della frase", pl: "Czasownik w zdaniu", tr: "Cümledeki fiil", id: "Kata kerja dalam kalimat", vi: "Động từ trong câu" } }
          - { key: tag, label: { en: Tag, uk: "Tag", es: "Coletilla", pt: "Tag", fr: "Tag", de: "Question Tag", it: "Tag", pl: "Tag", tr: "Tag", id: "Tag", vi: "Phần hỏi đuôi" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: be, tag: { alternatives: [isn't, aren't, wasn't, weren't] }, ex: ["They ", { target: were }, " late, ", { target: weren't they }, "?"], tr: { uk: "Вони запізнилися, чи не так?", es: "Llegaron tarde, ¿no?", pt: "Eles chegaram atrasados, não é?", fr: "Ils étaient en retard, n’est-ce pas ?", de: "Sie kamen zu spät, oder?", it: "Erano in ritardo, vero?", pl: "Spóźnili się, prawda?", tr: "Geç kaldılar, değil mi?", id: "Mereka terlambat, kan?", vi: "Họ đã đến muộn, phải không?" } }
          - { level: B1, verb: { en: present simple (other verbs), uk: "Present Simple (інші дієслова)", es: "presente simple (otros verbos)", pt: "presente simples (outros verbos)", fr: "présent simple (autres verbes)", de: "Simple Present (andere Verben)", it: "present simple (altri verbi)", pl: "Present Simple (inne czasowniki)", tr: "Simple Present (diğer fiiller)", id: "simple present (kata kerja lain)", vi: "hiện tại đơn (các động từ khác)" }, tag: { alternatives: [don't, doesn't] }, ex: ["She ", { target: works }, " here, ", { target: doesn't she }, "?"], tr: { uk: "Вона тут працює, правда?", es: "Ella trabaja aquí, ¿no?", pt: "Ela trabalha aqui, não é?", fr: "Elle travaille ici, non ?", de: "Sie arbeitet hier, oder?", it: "Lavora qui, vero?", pl: "Ona tu pracuje, prawda?", tr: "Burada çalışıyor, değil mi?", id: "Dia bekerja di sini, kan?", vi: "Cô ấy làm việc ở đây, phải không?" } }
          - { level: B1, verb: { en: past simple (other verbs), uk: "Past Simple (інші дієслова)", es: "pasado simple (otros verbos)", pt: "passado simples (outros verbos)", fr: "prétérit simple (autres verbes)", de: "Simple Past (andere Verben)", it: "past simple (altri verbi)", pl: "Past Simple (inne czasowniki)", tr: "Simple Past (diğer fiiller)", id: "simple past (kata kerja lain)", vi: "quá khứ đơn (các động từ khác)" }, tag: didn't, ex: ["He ", { target: left }, " early, ", { target: didn't he }, "?"], tr: { uk: "Він рано пішов, так?", es: "Se fue temprano, ¿no?", pt: "Ele saiu cedo, não é?", fr: "Il est parti tôt, n’est-ce pas ?", de: "Er ist früh gegangen, oder?", it: "È andato via presto, vero?", pl: "Wyszedł wcześnie, prawda?", tr: "Erken gitti, değil mi?", id: "Dia berangkat lebih awal, kan?", vi: "Anh ấy đã về sớm, phải không?" } }
          - { level: B1, verb: { pattern: [{ alternatives: [have, has, had] }, { slot: { en: participle, uk: "Past Participle", es: "participio pasado", pt: "particípio passado", fr: "participe passé", de: "Past Participle", it: "participio passato", pl: "Past Participle", tr: "past participle", id: "past participle", vi: "quá khứ phân từ" } }] }, tag: { alternatives: [haven't, hasn't, hadn't] }, ex: ["You've ", { target: finished }, ", ", { target: haven't you }, "?"], tr: { uk: "Ти закінчив, так?", es: "Has terminado, ¿no?", pt: "Você terminou, não é?", fr: "Tu as fini, non ?", de: "Du bist fertig, oder?", it: "Hai finito, vero?", pl: "Skończyłeś, prawda?", tr: "Bitirdin, değil mi?", id: "Kamu sudah selesai, kan?", vi: "Bạn đã làm xong rồi, phải không?" } }
          - { level: B1, verb: ["will, can, must, should", { gap: true }], tag: { en: the same modal, uk: "те саме модальне дієслово", es: "el mismo verbo modal", pt: "o mesmo verbo modal", fr: "le même modal", de: "dasselbe Modalverb", it: "lo stesso modale", pl: "ten sam czasownik modalny", tr: "aynı modal fiil", id: "modal yang sama", vi: "cùng động từ khuyết thiếu đó" }, ex: ["You ", { target: can }, " swim, ", { target: can't you }, "?"], tr: { uk: "Ти вмієш плавати, так?", es: "Sabes nadar, ¿no?", pt: "Você sabe nadar, não é?", fr: "Tu sais nager, n’est-ce pas ?", de: "Du kannst schwimmen, oder?", it: "Sai nuotare, vero?", pl: "Umiesz pływać, prawda?", tr: "Yüzebilirsin, değil mi?", id: "Kamu bisa berenang, kan?", vi: "Bạn biết bơi, phải không?" } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "When the statement has an auxiliary or a modal, the tag repeats it."
              uk: "Якщо в реченні є допоміжне чи модальне дієслово, tag повторює його."
              es: "Cuando la oración tiene un auxiliar o un modal, la coletilla lo repite."
              pt: "Quando a frase tem um auxiliar ou um modal, a tag o repete."
              fr: "Quand la phrase a un auxiliaire ou un modal, le tag le reprend."
              de: "Hat die Aussage ein Hilfsverb oder ein Modalverb, wiederholt der Tag es."
              it: "Quando la frase ha un ausiliare o un modale, il tag lo ripete."
              pl: "Jeśli zdanie zawiera czasownik pomocniczy lub modalny, tag go powtarza."
              tr: "Cümlede yardımcı ya da modal fiil varsa tag onu tekrarlar."
              id: "Bila kalimat memiliki kata kerja bantu atau modal, tag mengulanginya."
              vi: "Khi câu có trợ động từ hoặc động từ khuyết thiếu, phần hỏi đuôi lặp lại từ đó."
          - type: rule
            level: B1
            text:
              en: ["When it has no auxiliary, the tag uses ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: ["Якщо допоміжного дієслова немає, tag використовує ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: ["Cuando no tiene auxiliar, la coletilla usa ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              pt: ["Quando não tem auxiliar, a tag usa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              fr: ["Quand la phrase n’a pas d’auxiliaire, le tag emploie ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              de: ["Hat sie kein Hilfsverb, verwendet der Tag ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              it: ["Quando non ha un ausiliare, il tag usa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              pl: ["Jeśli czasownika pomocniczego nie ma, tag używa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              tr: ["Yardımcı fiil yoksa tag ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " kullanır."]
              id: ["Bila tidak ada kata kerja bantu, tag memakai ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              vi: ["Khi không có trợ động từ, phần hỏi đuôi dùng ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]

  - title: { en: "Form: special cases", uk: "Форма: особливі випадки", es: "Forma: casos especiales", pt: "Forma: casos especiais", fr: "Forme : cas particuliers", de: "Form: Sonderfälle", it: "Forma: casi particolari", pl: "Forma: przypadki szczególne", tr: "Biçim: özel durumlar", id: "Bentuk: kasus khusus", vi: "Dạng: các trường hợp đặc biệt" }
    role: form
    content:
      - type: usage
        columns:
          - { key: start, label: { en: Statement, uk: "Речення", es: "Oración", pt: "Frase", fr: "Phrase", de: "Aussage", it: "Frase", pl: "Zdanie", tr: "Cümle", id: "Kalimat", vi: "Câu trần thuật" } }
          - { key: tag, label: { en: Tag, uk: "Tag", es: "Coletilla", pt: "Tag", fr: "Tag", de: "Question Tag", it: "Tag", pl: "Tag", tr: "Tag", id: "Tag", vi: "Phần hỏi đuôi" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, start: I am, tag: aren't I, ex: [I, { target: "'m" }, " right, ", { target: aren't I }, "?"], tr: { uk: "Я правий, чи не так?", es: "Tengo razón, ¿no?", pt: "Eu tenho razão, não é?", fr: "J’ai raison, n’est-ce pas ?", de: "Ich habe recht, oder?", it: "Ho ragione, vero?", pl: "Mam rację, prawda?", tr: "Haklıyım, değil mi?", id: "Saya benar, kan?", vi: "Tôi nói đúng, phải không?" } }
          - { level: B1, start: Let's, tag: shall we, ex: [{ target: Let's }, " go, ", { target: shall we }, "?"], tr: { uk: "Ходімо, гаразд?", es: "Vamos, ¿te parece?", pt: "Vamos, que tal?", fr: "Allons-y, d’accord ?", de: "Lass uns gehen, ja?", it: "Andiamo, ti va?", pl: "Chodźmy, dobrze?", tr: "Gidelim, olur mu?", id: "Ayo pergi, ya?", vi: "Đi thôi, được không?" } }
          - { level: B1, start: { en: command, uk: "наказ", es: "orden", pt: "ordem", fr: "ordre", de: "Befehl", it: "imperativo", pl: "polecenie", tr: "emir", id: "perintah", vi: "câu mệnh lệnh" }, tag: will you, ex: [{ target: Open }, " the door, ", { target: will you }, "?"], tr: { uk: "Відчини двері, добре?", es: "Abre la puerta, ¿sí?", pt: "Abra a porta, pode ser?", fr: "Ouvre la porte, tu veux bien ?", de: "Mach die Tür auf, ja?", it: "Apri la porta, va bene?", pl: "Otwórz drzwi, dobrze?", tr: "Kapıyı aç, olur mu?", id: "Buka pintunya, ya?", vi: "Mở cửa ra, được không?" } }
          - { level: B1, start: { en: negative command, uk: "заперечний наказ", es: "orden negativa", pt: "ordem negativa", fr: "ordre négatif", de: "verneinter Befehl", it: "imperativo negativo", pl: "polecenie przeczące", tr: "olumsuz emir", id: "perintah negatif", vi: "câu mệnh lệnh phủ định" }, tag: will you, ex: [{ target: Don't }, " be late, ", { target: will you }, "?"], tr: { uk: "Не запізнюйся, добре?", es: "No llegues tarde, ¿sí?", pt: "Não chegue atrasado, tá?", fr: "Ne sois pas en retard, tu veux bien ?", de: "Komm nicht zu spät, ja?", it: "Non fare tardi, va bene?", pl: "Nie spóźnij się, dobrze?", tr: "Geç kalma, olur mu?", id: "Jangan terlambat, ya?", vi: "Đừng đến muộn, được không?" } }
          - { level: B1, start: { alternatives: [There is, are] }, tag: [{ alternatives: [isn't, aren't] }, " there"], ex: [{ target: There's }, " a bus, ", { target: isn't there }, "?"], tr: { uk: "Є автобус, чи не так?", es: "Hay un autobús, ¿no?", pt: "Tem um ônibus, não tem?", fr: "Il y a un bus, n’est-ce pas ?", de: "Es gibt einen Bus, oder?", it: "C'è un autobus, vero?", pl: "Jest autobus, prawda?", tr: "Bir otobüs var, değil mi?", id: "Ada bus, kan?", vi: "Có một chuyến xe buýt, phải không?" } }
          - { level: B1, start: "everybody, somebody, nobody", tag: they, ex: [{ target: Everybody }, " came, ", { target: didn't they }, "?"], tr: { uk: "Усі прийшли, чи не так?", es: "Todos vinieron, ¿no?", pt: "Todo mundo veio, não é?", fr: "Tout le monde est venu, n’est-ce pas ?", de: "Alle sind gekommen, oder?", it: "Sono venuti tutti, vero?", pl: "Wszyscy przyszli, prawda?", tr: "Herkes geldi, değil mi?", id: "Semua orang datang, kan?", vi: "Mọi người đã đến, phải không?" } }
          - { level: B1, start: "nobody, nothing, never", tag: { en: positive tag, uk: "стверджувальний tag", es: "coletilla afirmativa", pt: "tag afirmativa", fr: "tag affirmatif", de: "bejahter Tag", it: "tag affermativo", pl: "tag twierdzący", tr: "olumlu tag", id: "tag positif", vi: "phần hỏi đuôi khẳng định" }, ex: [{ target: Nobody }, " called, ", { target: did they }, "?"], tr: { uk: "Ніхто не дзвонив, правда?", es: "Nadie llamó, ¿verdad?", pt: "Ninguém ligou, não é?", fr: "Personne n’a appelé, n’est-ce pas ?", de: "Niemand hat angerufen, oder?", it: "Non ha chiamato nessuno, vero?", pl: "Nikt nie dzwonił, prawda?", tr: "Kimse aramadı, değil mi?", id: "Tidak ada yang menelepon, kan?", vi: "Không ai gọi, đúng không?" } }
          - { level: B2, start: have got, tag: { alternatives: [haven't, hasn't] }, ex: { examples: [["You've got time, ", { target: haven't you }, "?"], ["She's got a dog, ", { target: hasn't she }, "?"]] }, tr: { uk: { examples: ["У тебе є час, правда?", "У неї є собака, правда?"] }, es: { examples: ["Tienes tiempo, ¿verdad?", "Ella tiene un perro, ¿verdad?"] }, pt: { examples: ["Você tem tempo, não tem?", "Ela tem um cachorro, não tem?"] }, fr: { examples: ["Tu as du temps, n’est-ce pas ?", "Elle a un chien, n’est-ce pas ?"] }, de: { examples: ["Du hast Zeit, oder?", "Sie hat einen Hund, oder?"] }, it: { examples: ["Hai tempo, vero?", "Ha un cane, vero?"] }, pl: { examples: ["Masz czas, prawda?", "Ona ma psa, prawda?"] }, tr: { examples: ["Vaktin var, değil mi?", "Onun bir köpeği var, değil mi?"] }, id: { examples: ["Kamu punya waktu, kan?", "Dia punya anjing, kan?"] }, vi: { examples: ["Bạn có thời gian, phải không?", "Cô ấy có một con chó, phải không?"] } } }
          - { level: B2, start: { en: [{ term: have }, " for possession"], uk: [{ term: "have" }, " для володіння"], es: [{ term: "have" }, " para la posesión"], pt: [{ term: "have" }, " para posse"], fr: [{ term: "have" }, " pour la possession"], de: [{ term: "have" }, " für Besitz"], it: [{ term: "have" }, " per il possesso"], pl: [{ term: "have" }, " w znaczeniu posiadania"], tr: [{ term: "have" }, " sahiplik anlamında"], id: [{ term: "have" }, " untuk kepemilikan"], vi: [{ term: "have" }, " chỉ sự sở hữu"] }, tag: { alternatives: [don't, doesn't] }, ex: ["She has a brother, ", { target: doesn't she }, "?"], tr: { uk: "У неї є брат, правда?", es: "Ella tiene un hermano, ¿verdad?", pt: "Ela tem um irmão, não tem?", fr: "Elle a un frère, n’est-ce pas ?", de: "Sie hat einen Bruder, oder?", it: "Ha un fratello, vero?", pl: "Ona ma brata, prawda?", tr: "Onun bir erkek kardeşi var, değil mi?", id: "Dia punya saudara laki-laki, kan?", vi: "Cô ấy có một người anh trai, phải không?" } }
          - { level: B2, start: used to, tag: didn't, ex: ["You ", { target: used to }, " live here, ", { target: didn't you }, "?"], tr: { uk: "Ти раніше жив тут, правда?", es: "Antes vivías aquí, ¿no?", pt: "Você morava aqui antes, não morava?", fr: "Tu habitais ici avant, n’est-ce pas ?", de: "Du hast früher hier gewohnt, oder?", it: "Prima abitavi qui, vero?", pl: "Kiedyś tu mieszkałeś, prawda?", tr: "Eskiden burada yaşardın, değil mi?", id: "Dulu kamu tinggal di sini, kan?", vi: "Trước đây bạn từng sống ở đây, phải không?" } }
          - { level: B2, start: ought to, tag: oughtn't, ex: ["We ", { target: ought to }, " go, ", { target: oughtn't we }, "?"], tr: { uk: "Нам слід іти, чи не так?", es: "Deberíamos irnos, ¿no?", pt: "Nós deveríamos ir, não é?", fr: "Nous devrions partir, n’est-ce pas ?", de: "Wir sollten gehen, oder?", it: "Dovremmo andare, vero?", pl: "Powinniśmy iść, prawda?", tr: "Gitmemiz gerek, değil mi?", id: "Kita sebaiknya pergi, kan?", vi: "Chúng ta nên đi, phải không?" } }
          - { level: B2, start: { en: [{ term: need }, " as a modal"], uk: [{ term: "need" }, " як модальне дієслово"], es: [{ term: "need" }, " como verbo modal"], pt: [{ term: "need" }, " como verbo modal"], fr: [{ term: "need" }, " comme modal"], de: [{ term: "need" }, " als Modalverb"], it: [{ term: "need" }, " come modale"], pl: [{ term: "need" }, " jako czasownik modalny"], tr: [{ term: "need" }, " modal fiil olarak"], id: [{ term: "need" }, " sebagai modal"], vi: [{ term: "need" }, " như một động từ khuyết thiếu"] }, tag: { alternatives: [need, needn't] }, ex: ["You needn't worry, ", { target: need you }, "?"], tr: { uk: "Тобі не треба хвилюватися, правда?", es: "No necesitas preocuparte, ¿verdad?", pt: "Você não precisa se preocupar, precisa?", fr: "Tu n’as pas besoin de t’inquiéter, n’est-ce pas ?", de: "Du musst dir keine Sorgen machen, oder?", it: "Non c'è bisogno che ti preoccupi, vero?", pl: "Nie musisz się martwić, prawda?", tr: "Endişelenmene gerek yok, değil mi?", id: "Kamu tidak perlu khawatir, kan?", vi: "Bạn không cần lo lắng, phải không?" } }
          - { level: B2, start: had better, tag: hadn't, ex: ["You'd better go, ", { target: hadn't you }, "?"], tr: { uk: "Тобі краще піти, чи не так?", es: "Será mejor que te vayas, ¿no?", pt: "É melhor você ir, não é?", fr: "Tu ferais mieux d’y aller, n’est-ce pas ?", de: "Du solltest besser gehen, oder?", it: "Faresti meglio ad andare, vero?", pl: "Lepiej już idź, prawda?", tr: "Gitsen iyi olur, değil mi?", id: "Sebaiknya kamu pergi, kan?", vi: "Tốt hơn là bạn nên đi, phải không?" } }
          - { level: B2, start: would rather, tag: wouldn't, ex: ["You'd rather stay, ", { target: wouldn't you }, "?"], tr: { uk: "Ти б краще залишився, правда?", es: "Preferirías quedarte, ¿no?", pt: "Você preferiria ficar, não é?", fr: "Tu préférerais rester, n’est-ce pas ?", de: "Du würdest lieber bleiben, oder?", it: "Preferiresti restare, vero?", pl: "Wolałbyś zostać, prawda?", tr: "Kalmayı tercih edersin, değil mi?", id: "Kamu lebih suka tinggal, kan?", vi: "Bạn thích ở lại hơn, phải không?" } }
          - { level: C1, start: { en: a short sentence without a verb, uk: "коротка фраза без дієслова", es: "una oración corta sin verbo", pt: "uma frase curta sem verbo", fr: "une phrase courte sans verbe", de: "ein kurzer Satz ohne Verb", it: "una frase breve senza verbo", pl: "krótkie zdanie bez czasownika", tr: "fiilsiz kısa bir cümle", id: "kalimat pendek tanpa kata kerja", vi: "câu ngắn không có động từ" }, tag: { en: the tag of the full sentence, uk: "tag повного речення", es: "la coletilla de la oración completa", pt: "a tag da frase completa", fr: "le tag de la phrase complète", de: "der Tag des vollständigen Satzes", it: "il tag della frase completa", pl: "tag pełnego zdania", tr: "tam cümledeki tag", id: "tag dari kalimat lengkapnya", vi: "phần hỏi đuôi của câu đầy đủ" }, ex: { examples: [["Lovely day, ", { target: isn't it }, "?"], ["Nice shoes, ", { target: aren't they }, "?"]] }, tr: { uk: { examples: ["Чудовий день, правда?", "Гарні туфлі, правда?"] }, es: { examples: ["Qué día tan lindo, ¿verdad?", "Qué zapatos tan bonitos, ¿no?"] }, pt: { examples: ["Que dia lindo, não é?", "Que sapatos bonitos, não é?"] }, fr: { examples: ["Belle journée, n’est-ce pas ?", "Jolies chaussures, n’est-ce pas ?"] }, de: { examples: ["Schöner Tag, nicht wahr?", "Schöne Schuhe, nicht wahr?"] }, it: { examples: ["Bella giornata, vero?", "Belle scarpe, vero?"] }, pl: { examples: ["Piękny dzień, prawda?", "Ładne buty, prawda?"] }, tr: { examples: ["Güzel bir gün, değil mi?", "Güzel ayakkabılar, değil mi?"] }, id: { examples: ["Hari yang indah, ya?", "Sepatu yang bagus, ya?"] }, vi: { examples: ["Ngày đẹp trời, đúng không?", "Đôi giày đẹp quá, phải không?"] } } }
          - { level: C1, start: { en: an exclamation, uk: "вигук", es: "una exclamación", pt: "uma exclamação", fr: "une exclamation", de: "ein Ausruf", it: "un'esclamazione", pl: "wykrzyknienie", tr: "ünlem cümlesi", id: "seruan", vi: "câu cảm thán" }, tag: isn't it, ex: ["What a view, ", { target: isn't it }, "?"], tr: { uk: "Який краєвид, правда?", es: "Qué vista, ¿verdad?", pt: "Que vista, não é?", fr: "Quelle vue, n’est-ce pas ?", de: "Was für eine Aussicht, nicht wahr?", it: "Che vista, vero?", pl: "Cóż za widok, prawda?", tr: "Ne manzara, değil mi?", id: "Pemandangan yang luar biasa, ya?", vi: "Cảnh đẹp quá, phải không?" } }
          - { level: C1, start: "this, that", tag: it, ex: ["That's yours, ", { target: isn't it }, "?"], tr: { uk: "Це твоє, правда?", es: "Eso es tuyo, ¿verdad?", pt: "Isso é seu, não é?", fr: "C’est à toi, n’est-ce pas ?", de: "Das gehört dir, oder?", it: "Questo è tuo, vero?", pl: "To twoje, prawda?", tr: "Bu senin, değil mi?", id: "Itu milikmu, kan?", vi: "Cái đó là của bạn, phải không?" } }
          - { level: C1, start: { en: a polite request, uk: "ввічливе прохання", es: "una petición cortés", pt: "um pedido educado", fr: "une demande polie", de: "eine höfliche Bitte", it: "una richiesta cortese", pl: "uprzejma prośba", tr: "nazik bir rica", id: "permintaan sopan", vi: "lời yêu cầu lịch sự" }, tag: { alternatives: [would you, could you] }, ex: { examples: [["Pass the salt, ", { target: would you }, "?"], ["Hold the door, ", { target: could you }, "?"]] }, tr: { uk: { examples: ["Подай сіль, добре?", "Притримай двері, зможеш?"] }, es: { examples: ["Pásame la sal, ¿podrías?", "Sostén la puerta, ¿podrías?"] }, pt: { examples: ["Passe o sal, pode ser?", "Segure a porta, você pode?"] }, fr: { examples: ["Passe-moi le sel, tu veux bien ?", "Tiens la porte, tu pourrais ?"] }, de: { examples: ["Reich mir das Salz, ja?", "Halt die Tür auf, kannst du?"] }, it: { examples: ["Passami il sale, va bene?", "Tieni la porta, potresti?"] }, pl: { examples: ["Podaj sól, dobrze?", "Przytrzymaj drzwi, możesz?"] }, tr: { examples: ["Tuzu uzat, olur mu?", "Kapıyı tut, tutabilir misin?"] }, id: { examples: ["Berikan garamnya, ya?", "Tolong tahan pintunya, bisa?"] }, vi: { examples: ["Đưa muối cho tôi, được không?", "Giữ cửa giúp tôi, được chứ?"] } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: Nobody }, ", ", { term: nothing }, " and ", { term: never }, " make the statement negative, so the tag is positive."]
              uk: [{ term: Nobody }, ", ", { term: nothing }, " і ", { term: never }, " роблять речення заперечним, тому tag стверджувальний."]
              es: [{ term: Nobody }, ", ", { term: nothing }, " y ", { term: never }, " hacen negativa la oración, por eso la coletilla es afirmativa."]
