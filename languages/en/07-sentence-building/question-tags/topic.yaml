          - { level: B1, use: { en: Asking politely for help, uk: "Ввічливе прохання про допомогу", es: "Pedir ayuda con cortesía", pt: "Pedir ajuda com educação", fr: "Demander poliment de l’aide", de: "Höflich um Hilfe bitten", it: "Chiedere aiuto con cortesia", pl: "Uprzejma prośba o pomoc", tr: "Nazikçe yardım isteme", id: "Meminta bantuan dengan sopan", vi: "Nhờ giúp đỡ một cách lịch sự" }, ex: ["You couldn't lend me a pen, ", { target: could you }, "?"], tr: { uk: "Ти не міг би позичити мені ручку?", es: "¿No podrías prestarme un bolígrafo?", pt: "Você não poderia me emprestar uma caneta?", fr: "Tu ne pourrais pas me prêter un stylo ?", de: "Du könntest mir nicht zufällig einen Stift leihen, oder?", it: "Non potresti prestarmi una penna?", pl: "Nie mógłbyś pożyczyć mi długopisu?", tr: "Bana bir kalem ödünç veremez misin?", id: "Kamu tidak bisa meminjamkan saya pulpen, ya?", vi: "Bạn có thể cho tôi mượn một cây bút được không?" } }

