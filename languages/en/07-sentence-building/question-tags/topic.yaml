    content:
      - type: usage
        columns:
          - { key: pair, label: { en: Statement and tag } }
          - { key: shows, label: { en: Shows } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, pair: { en: positive and positive }, shows: { en: realisation or interest }, ex: ["So you're a doctor, ", { target: are you }, "?"] }
          - { level: B2, pair: { en: positive and positive }, shows: { en: irony or suspicion }, ex: ["You've been reading my letters, ", { target: have you }, "?"] }
          - { level: B2, pair: { en: negative and negative }, shows: { en: anger or a challenge }, ex: { exchange: ["I won't tell you.", ["Oh, you ", { target: won't }, ", ", { target: won't you }, "?"]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: A same-polarity tag repeats a claim that the speaker has just heard or worked out. }

