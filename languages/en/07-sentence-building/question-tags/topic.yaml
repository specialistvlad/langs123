          - { level: C1, tone: { en: ["falling ", { intonation: fall }], uk: ["спадна ", { intonation: "fall" }], es: ["descendente ", { intonation: "fall" }], pt: ["descendente ", { intonation: "fall" }], fr: ["descendante ", { intonation: "fall" }], de: ["fallend ", { intonation: "fall" }], it: ["discendente ", { intonation: "fall" }], pl: ["opadająca ", { intonation: "fall" }], tr: ["inen ", { intonation: "fall" }], id: ["turun ", { intonation: "fall" }], vi: ["xuống giọng ", { intonation: "fall" }] }, shows: { en: "a polite or flat reaction, or doubt", uk: "ввічлива чи байдужа реакція або сумнів", es: "una reacción cortés o indiferente, o duda", pt: "uma reação educada ou indiferente, ou dúvida", fr: "une réaction polie ou neutre, ou du doute", de: "eine höfliche oder nüchterne Reaktion oder Zweifel", it: "una reazione cortese o neutra, oppure dubbio", pl: "uprzejma lub obojętna reakcja albo wątpliwość", tr: "kibar ya da ilgisiz bir tepki ya da şüphe", id: "reaksi sopan atau datar, atau keraguan", vi: "phản ứng lịch sự hoặc nhạt nhẽo, hoặc sự nghi ngờ" }, ex: { exchange: ["She left yesterday.", [{ target: Did }, " she? ", { intonation: fall }]] }, tr: { uk: { exchange: ["Вона поїхала вчора.", "Он як?"] }, es: { exchange: ["Se fue ayer.", "¿Ah, sí?"] }, pt: { exchange: ["Ela foi embora ontem.", "Foi mesmo?"] }, fr: { exchange: ["Elle est partie hier.", "Ah bon ?"] }, de: { exchange: ["Sie ist gestern abgereist.", "Ach ja?"] }, it: { exchange: ["È partita ieri.", "Ah sì?"] }, pl: { exchange: ["Wyjechała wczoraj.", "Ach tak?"] }, tr: { exchange: ["Dün gitti.", "Öyle mi?"] }, id: { exchange: ["Dia pergi kemarin.", "Oh, begitu?"] }, vi: { exchange: ["Cô ấy đã đi hôm qua.", "Thế à?"] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "An echo reply is an auxiliary and a pronoun, with the polarity of the statement.", uk: "Відповідь-перепитування — це допоміжне дієслово й займенник з тією самою полярністю, що й речення.", es: "Una respuesta eco consta de un auxiliar y un pronombre, con la polaridad de la oración.", pt: "Uma resposta eco é um auxiliar e um pronome, com a polaridade da frase.", fr: "Une réponse écho se compose d’un auxiliaire et d’un pronom, avec la polarité de la phrase.", de: "Eine Echo-Antwort besteht aus Hilfsverb und Pronomen, mit der Polarität der Aussage.", it: "Una risposta eco è formata da un ausiliare e un pronome, con la polarità della frase.", pl: "Odpowiedź echo to czasownik pomocniczy i zaimek, o tej samej polarności co zdanie.", tr: "Yankı yanıtı bir yardımcı fiil ve bir zamirden oluşur; cümlenin kutupluluğunu taşır.", id: "Jawaban gema terdiri atas kata kerja bantu dan kata ganti, dengan polaritas yang sama dengan kalimat.", vi: "Câu đáp lặp gồm một trợ động từ và một đại từ, cùng dạng khẳng định hoặc phủ định với câu trước." }
            ex: { exchange: ["I can't swim.", [{ target: Can't }, " you?"]] }
            tr: { uk: { exchange: ["Я не вмію плавати.", "Не вмієш?"] }, es: { exchange: ["No sé nadar.", "¿No sabes?"] }, pt: { exchange: ["Eu não sei nadar.", "Não sabe?"] }, fr: { exchange: ["Je ne sais pas nager.", "Tu ne sais pas ?"] }, de: { exchange: ["Ich kann nicht schwimmen.", "Du kannst nicht?"] }, it: { exchange: ["Non so nuotare.", "Non sai?"] }, pl: { exchange: ["Nie umiem pływać.", "Nie umiesz?"] }, tr: { exchange: ["Yüzme bilmiyorum.", "Bilmiyor musun?"] }, id: { exchange: ["Saya tidak bisa berenang.", "Tidak bisa?"] }, vi: { exchange: ["Tôi không biết bơi.", "Bạn không biết à?"] } }

  - title: { en: Informal tags and checks, uk: "Розмовні tag і перевірки", es: "Coletillas informales y comprobaciones", pt: "Tags informais e verificações", fr: "Tags familiers et vérifications", de: "Lockere Tags und Rückversicherungen", it: "Tag informali e verifiche", pl: "Nieformalne tagi i sprawdzenia", tr: "Gündelik tag ve onay ifadeleri", id: "Tag informal dan pengecekan", vi: "Phần hỏi đuôi thân mật và cách hỏi xác nhận" }
    role: own
    content:
      - type: usage
        columns:
          - { key: tag, label: { en: Tag, uk: "Tag", es: "Coletilla", pt: "Tag", fr: "Tag", de: "Question Tag", it: "Tag", pl: "Tag", tr: "Tag", id: "Tag", vi: "Phần hỏi đuôi" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, tag: right, use: { en: checks agreement or understanding after any statement, uk: "перевіряє згоду або розуміння після будь-якого речення", es: "comprueba acuerdo o comprensión después de cualquier oración", pt: "verifica concordância ou compreensão depois de qualquer frase", fr: "vérifie l’accord ou la compréhension après n’importe quelle phrase", de: "prüft Zustimmung oder Verständnis nach jeder Aussage", it: "verifica accordo o comprensione dopo qualsiasi frase", pl: "sprawdza zgodę lub zrozumienie po dowolnym zdaniu", tr: "herhangi bir cümleden sonra onayı ya da anlaşılıp anlaşılmadığını kontrol eder", id: "memeriksa persetujuan atau pemahaman setelah kalimat apa pun", vi: "kiểm tra sự đồng tình hoặc sự hiểu sau bất kỳ câu nào" }, ex: ["We meet at six, ", { target: right }, "?"], tr: { uk: "Зустрічаємося о шостій, так?", es: "Nos vemos a las seis, ¿cierto?", pt: "A gente se encontra às seis, certo?", fr: "On se retrouve à six heures, c’est bien ça ?", de: "Wir treffen uns um sechs, richtig?", it: "Ci vediamo alle sei, giusto?", pl: "Spotykamy się o szóstej, prawda?", tr: "Altıda buluşuyoruz, doğru mu?", id: "Kita bertemu jam enam, benar?", vi: "Chúng ta gặp nhau lúc sáu giờ, đúng không?" } }
          - { level: C1, tag: "OK", use: { en: checks that someone accepts a plan or a request, uk: "перевіряє, чи співрозмовник приймає план або прохання", es: "comprueba que alguien acepta un plan o una petición", pt: "verifica se alguém aceita um plano ou um pedido", fr: "vérifie que quelqu’un accepte un plan ou une demande", de: "prüft, ob jemand einen Plan oder eine Bitte akzeptiert", it: "verifica che qualcuno accetti un piano o una richiesta", pl: "sprawdza, czy ktoś przyjmuje plan lub prośbę", tr: "birinin bir planı ya da ricayı kabul edip etmediğini kontrol eder", id: "memeriksa apakah seseorang menerima rencana atau permintaan", vi: "kiểm tra xem ai đó có chấp nhận một kế hoạch hoặc yêu cầu không" }, ex: ["I'll pay you on Friday, ", { target: "OK" }, "?"], tr: { uk: "Я заплачу тобі в п’ятницю, добре?", es: "Te pago el viernes, ¿está bien?", pt: "Eu te pago na sexta, tudo bem?", fr: "Je te paie vendredi, d’accord ?", de: "Ich bezahle dich am Freitag, okay?", it: "Ti pago venerdì, ok?", pl: "Zapłacę ci w piątek, dobrze?", tr: "Sana cuma günü öderim, tamam mı?", id: "Saya bayar hari Jumat, oke?", vi: "Thứ Sáu tôi sẽ trả bạn, được chứ?" } }
          - { level: C1, tag: yeah, use: { en: "a casual check, with a rising voice", uk: "невимушена перевірка з висхідною інтонацією", es: "una comprobación casual, con voz ascendente", pt: "uma verificação casual, com a voz subindo", fr: "une vérification décontractée, avec la voix montante", de: "eine lockere Rückfrage mit steigender Stimme", it: "una verifica informale, con la voce che sale", pl: "swobodne sprawdzenie, z głosem wznoszącym się", tr: "yükselen sesle yapılan rahat bir kontrol", id: "pengecekan santai dengan suara naik", vi: "cách hỏi xác nhận thoải mái, với giọng lên" }, ex: ["You're coming tonight, ", { target: yeah }, "? ", { intonation: rise }], tr: { uk: "Ти сьогодні прийдеш, так?", es: "Vienes esta noche, ¿sí?", pt: "Você vem hoje à noite, né?", fr: "Tu viens ce soir, hein ?", de: "Du kommst heute Abend, ja?", it: "Vieni stasera, no?", pl: "Przyjdziesz dziś wieczorem, no?", tr: "Bu akşam geliyorsun, di mi?", id: "Kamu datang malam ini, ya?", vi: "Tối nay bạn đến, nhỉ?" } }
          - { level: C1, tag: eh, use: { en: "a friendly check, common in Canadian English", uk: "дружня перевірка, поширена в канадській англійській", es: "una comprobación amistosa, común en el inglés canadiense", pt: "uma verificação amigável, comum no inglês canadense", fr: "une vérification amicale, courante en anglais canadien", de: "eine freundliche Rückfrage, üblich im kanadischen Englisch", it: "una verifica amichevole, comune nell'inglese canadese", pl: "przyjazne sprawdzenie, częste w kanadyjskiej angielszczyźnie", tr: "Kanada İngilizcesinde yaygın, dostça bir kontrol", id: "pengecekan yang ramah, umum dalam bahasa Inggris Kanada", vi: "cách hỏi xác nhận thân thiện, phổ biến trong tiếng Anh Canada" }, ex: ["Nice day, ", { target: eh }, "?"], tr: { uk: "Гарний день, правда?", es: "Qué buen día, ¿eh?", pt: "Dia bonito, hein?", fr: "Belle journée, hein ?", de: "Schöner Tag, ne?", it: "Bella giornata, eh?", pl: "Piękny dzień, co?", tr: "Güzel gün, ha?", id: "Hari yang cerah, ya?", vi: "Ngày đẹp trời, nhỉ?" } }
          - { level: C1, tag: innit, use: { en: "informal British speech: one form for every statement", uk: "розмовна британська мова: одна форма для будь-якого речення", es: "habla informal británica: una sola forma para toda oración", pt: "fala informal britânica: uma só forma para qualquer frase", fr: "oral familier britannique : une seule forme pour toute phrase", de: "britische Umgangssprache: eine Form für jede Aussage", it: "parlato informale britannico: una sola forma per ogni frase", pl: "nieformalna mowa brytyjska: jedna forma do każdego zdania", tr: "gündelik İngiliz konuşma dili: her cümle için tek biçim", id: "ujaran informal Britania: satu bentuk untuk setiap kalimat", vi: "lời nói thân mật của người Anh: một dạng duy nhất cho mọi câu" }, ex: ["They're late, ", { target: innit }, "?"], tr: { uk: "Вони запізнюються, правда?", es: "Llegan tarde, ¿no?", pt: "Eles estão atrasados, né?", fr: "Ils sont en retard, pas vrai ?", de: "Sie sind spät dran, oder?", it: "Sono in ritardo, no?", pl: "Spóźniają się, nie?", tr: "Geç kaldılar, di mi?", id: "Mereka terlambat, kan?", vi: "Họ đến muộn, nhỉ?" } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "These tags suit speech and informal messages; careful writing keeps the full tag.", uk: "Ці tag пасують до усного мовлення й неформальних повідомлень; ретельне письмо зберігає повний tag.", es: "Estas coletillas van con el habla y los mensajes informales; la escritura cuidada conserva la coletilla completa.", pt: "Essas tags combinam com a fala e com mensagens informais; a escrita cuidada mantém a tag completa.", fr: "Ces tags conviennent à l’oral et aux messages familiers ; l’écrit soigné garde le tag complet.", de: "Diese Tags passen zur gesprochenen Sprache und zu lockeren Nachrichten; sorgfältiges Schreiben behält den vollständigen Tag.", it: "Questi tag vanno bene nel parlato e nei messaggi informali; la scrittura curata mantiene il tag completo.", pl: "Te tagi pasują do mowy i nieformalnych wiadomości; staranne pismo zachowuje pełny tag.", tr: "Bu tag yapıları konuşmaya ve gündelik mesajlara uyar; özenli yazıda tam tag kullanılır.", id: "Tag ini cocok untuk percakapan dan pesan informal; tulisan yang cermat memakai tag lengkap.", vi: "Các phần hỏi đuôi này hợp với lời nói và tin nhắn thân mật; văn viết chỉn chu giữ phần hỏi đuôi đầy đủ." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
