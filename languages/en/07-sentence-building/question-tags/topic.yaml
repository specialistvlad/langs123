  - title: { en: "Form: tags after I think and complex sentences", uk: "Форма: tag після I think і в складних реченнях", es: "Forma: coletillas después de I think y en oraciones complejas", pt: "Forma: tags depois de I think e em frases complexas", fr: "Forme : tags après I think et dans les phrases complexes", de: "Form: Tags nach I think und in komplexen Sätzen", it: "Forma: tag dopo I think e nelle frasi complesse", pl: "Forma: tagi po I think i w zdaniach złożonych", tr: "Biçim: I think sonrasında ve karmaşık cümlelerde tag", id: "Bentuk: tag setelah I think dan dalam kalimat kompleks", vi: "Dạng: phần hỏi đuôi sau I think và trong câu phức" }
    role: form
