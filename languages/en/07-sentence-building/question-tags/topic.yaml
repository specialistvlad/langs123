        rows:
          - { level: B1, tone: { en: ["falling ", { intonation: fall }], uk: ["спадна ", { intonation: fall }], es: ["descendente ", { intonation: fall }], pt: ["descendente ", { intonation: "fall" }], fr: ["descendante ", { intonation: "fall" }], de: ["fallend ", { intonation: "fall" }], it: ["discendente ", { intonation: "fall" }], pl: ["opadająca ", { intonation: "fall" }], tr: ["inen ", { intonation: "fall" }], id: ["turun ", { intonation: "fall" }], vi: ["xuống giọng ", { intonation: "fall" }] }, meaning: { en: you are sure and want agreement, uk: "мовець упевнений і чекає згоди", es: "el hablante está seguro y espera acuerdo", pt: "o falante tem certeza e espera concordância", fr: "le locuteur est sûr et attend un accord", de: "der Sprecher ist sicher und erwartet Zustimmung", it: "il parlante è sicuro e cerca conferma", pl: "mówiący jest pewny i oczekuje zgody", tr: "konuşan emin ve onay bekliyor", id: "penutur yakin dan mengharapkan persetujuan", vi: "người nói chắc chắn và mong được đồng tình" }, ex: ["It's a lovely day, ", { target: isn't it }, "? ", { intonation: fall }], tr: { uk: "Чудовий день, правда?", es: "Es un día precioso, ¿verdad?", pt: "É um dia lindo, não é?", fr: "C’est une belle journée, n’est-ce pas ?", de: "Es ist ein schöner Tag, nicht wahr?", it: "È una bella giornata, vero?", pl: "Piękny dzień, prawda?", tr: "Güzel bir gün, değil mi?", id: "Hari yang indah, ya?", vi: "Hôm nay trời đẹp quá, đúng không?" } }
          - { level: B1, tone: { en: ["rising ", { intonation: rise }], uk: ["висхідна ", { intonation: rise }], es: ["ascendente ", { intonation: rise }], pt: ["ascendente ", { intonation: "rise" }], fr: ["montante ", { intonation: "rise" }], de: ["steigend ", { intonation: "rise" }], it: ["ascendente ", { intonation: "rise" }], pl: ["wznosząca ", { intonation: "rise" }], tr: ["yükselen ", { intonation: "rise" }], id: ["naik ", { intonation: "rise" }], vi: ["lên giọng ", { intonation: "rise" }] }, meaning: { en: you are not sure and ask a real question, uk: "мовець не впевнений і ставить справжнє питання", es: "el hablante no está seguro y hace una pregunta real", pt: "o falante não tem certeza e faz uma pergunta de verdade", fr: "le locuteur n’est pas sûr et pose une vraie question", de: "der Sprecher ist nicht sicher und stellt eine echte Frage", it: "il parlante non è sicuro e pone una domanda vera", pl: "mówiący nie jest pewny i zadaje prawdziwe pytanie", tr: "konuşan emin değil ve gerçek bir soru soruyor", id: "penutur tidak yakin dan mengajukan pertanyaan sungguhan", vi: "người nói không chắc chắn và hỏi thật" }, ex: ["You haven't seen my keys, ", { target: have you }, "? ", { intonation: rise }], tr: { uk: "Ти не бачив моїх ключів, правда?", es: "No has visto mis llaves, ¿verdad?", pt: "Você não viu minhas chaves, viu?", fr: "Tu n’as pas vu mes clés, par hasard ?", de: "Du hast meine Schlüssel nicht gesehen, oder?", it: "Non hai visto le mie chiavi, vero?", pl: "Nie widziałeś moich kluczy, prawda?", tr: "Anahtarlarımı görmedin, değil mi?", id: "Kamu belum melihat kunci saya, kan?", vi: "Bạn chưa thấy chìa khóa của tôi, phải không?" } }
