              de: ["Ein Tag nach einem Befehl ist eine höfliche Bitte. ", { term: "won't you" }, " ist freundlicher: ", { term: "Come in, won't you?" }]
              it: ["Un tag dopo un imperativo è una richiesta cortese. ", { term: "won't you" }, " è più cordiale: ", { term: "Come in, won't you?" }]
              pl: ["Tag po poleceniu brzmi jak uprzejma prośba. ", { term: "won't you" }, " brzmi przyjaźniej: ", { term: "Come in, won't you?" }]
              tr: ["Emirden sonra gelen tag nazik bir rica olur. ", { term: "won't you" }, " daha sıcaktır: ", { term: "Come in, won't you?" }]
              id: ["Tag setelah perintah merupakan permintaan sopan. ", { term: "won't you" }, " lebih ramah: ", { term: "Come in, won't you?" }]
