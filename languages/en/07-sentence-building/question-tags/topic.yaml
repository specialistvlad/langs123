              fr: [{ term: "Nobody" }, ", ", { term: "nothing" }, " et ", { term: "never" }, " rendent la phrase négative, le tag est donc affirmatif."]
              de: [{ term: "Nobody" }, ", ", { term: "nothing" }, " und ", { term: "never" }, " machen die Aussage verneint, daher ist der Tag bejaht."]
              it: [{ term: "Nobody" }, ", ", { term: "nothing" }, " e ", { term: "never" }, " rendono negativa la frase, quindi il tag è affermativo."]
              pl: [{ term: "Nobody" }, ", ", { term: "nothing" }, " i ", { term: "never" }, " czynią zdanie przeczącym, dlatego tag jest twierdzący."]
              tr: [{ term: "Nobody" }, ", ", { term: "nothing" }, " ve ", { term: "never" }, " cümleyi olumsuz yapar, bu yüzden tag olumludur."]
              id: [{ term: "Nobody" }, ", ", { term: "nothing" }, " dan ", { term: "never" }, " membuat kalimat menjadi negatif, sehingga tag-nya positif."]
              vi: [{ term: "Nobody" }, ", ", { term: "nothing" }, " và ", { term: "never" }, " làm câu mang nghĩa phủ định, nên phần hỏi đuôi là khẳng định."]
          - type: rule
            level: B1
