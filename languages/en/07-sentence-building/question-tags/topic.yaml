title: { en: Question Tags, uk: Розділові питання, es: Preguntas coletilla, pt: "Question tags", fr: "Question tags", de: "Question Tags", it: "Question tag", pl: "Pytania rozłączne", tr: "Question tags", id: "Question tag", vi: "Câu hỏi đuôi" }
summary:
  lead:
    en: Question tags are short questions added to a statement to check or confirm it.
    uk: "Розділові питання (question tags) — це короткі питання, які додають до речення, щоб перевірити або підтвердити його."
    es: "Las preguntas coletilla son preguntas cortas que se añaden a una oración para comprobarla o confirmarla."
    pt: "As question tags são perguntas curtas acrescentadas a uma frase para verificá-la ou confirmá-la."
    fr: "Les question tags sont de courtes questions ajoutées à une phrase pour la vérifier ou la confirmer."
    de: "Question Tags sind kurze Fragen, die an eine Aussage angehängt werden, um sie zu prüfen oder zu bestätigen."
    it: "I question tag sono brevi domande aggiunte a una frase per verificarla o confermarla."
    pl: "Pytania rozłączne (question tags) to krótkie pytania dodawane do zdania, aby je sprawdzić lub potwierdzić."
    tr: "Question tag, bir cümleyi kontrol etmek ya da onaylatmak için cümlenin sonuna eklenen kısa bir sorudur."
    id: "Question tag adalah pertanyaan pendek yang ditambahkan pada kalimat untuk memeriksa atau memastikannya."
    vi: "Câu hỏi đuôi là câu hỏi ngắn thêm vào sau một câu để kiểm tra hoặc xác nhận câu đó."
  rule:
    en: "A positive statement takes a negative tag and a negative statement a positive tag, with the same auxiliary:"
    uk: "Після стверджувального речення стоїть заперечний tag, після заперечного — стверджувальний, з тим самим допоміжним дієсловом:"
    es: "Una oración afirmativa lleva una coletilla negativa y una oración negativa, una coletilla afirmativa, con el mismo auxiliar:"
    pt: "Uma frase afirmativa leva uma tag negativa e uma frase negativa leva uma tag afirmativa, com o mesmo auxiliar:"
    fr: "Une phrase affirmative prend un tag négatif et une phrase négative un tag affirmatif, avec le même auxiliaire :"
    de: "Auf eine bejahte Aussage folgt ein verneinter Tag, auf eine verneinte Aussage ein bejahter Tag, mit demselben Hilfsverb:"
    it: "Una frase affermativa prende un tag negativo e una frase negativa un tag affermativo, con lo stesso ausiliare:"
    pl: "Po zdaniu twierdzącym stoi tag przeczący, a po przeczącym — twierdzący, z tym samym czasownikiem pomocniczym:"
    tr: "Olumlu cümleden sonra olumsuz tag, olumsuz cümleden sonra olumlu tag gelir; yardımcı fiil aynıdır:"
    id: "Kalimat positif memakai tag negatif dan kalimat negatif memakai tag positif, dengan kata kerja bantu yang sama:"
    vi: "Câu khẳng định đi với phần hỏi đuôi phủ định, câu phủ định đi với phần hỏi đuôi khẳng định, cùng một trợ động từ:"
  ex: { examples: [It's cold, [{ target: isn't it }, "?"]] }

