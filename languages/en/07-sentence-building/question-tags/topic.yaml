          - { level: B1, wrong: "You like tea, aren't you?", right: ["You like tea, ", { target: don't you }, "?"], rule: { en: ["the tag matches the verb: ", { mapping: [{ term: like }, { term: don't }] }], uk: ["tag відповідає дієслову: ", { mapping: [{ term: like }, { term: don't }] }], es: ["la coletilla concuerda con el verbo: ", { mapping: [{ term: like }, { term: don't }] }], pt: ["a tag concorda com o verbo: ", { mapping: [{ term: "like" }, { term: "don't" }] }], fr: ["le tag s’accorde avec le verbe : ", { mapping: [{ term: "like" }, { term: "don't" }] }], de: ["der Tag passt zum Verb: ", { mapping: [{ term: "like" }, { term: "don't" }] }], it: ["il tag corrisponde al verbo: ", { mapping: [{ term: "like" }, { term: "don't" }] }], pl: ["tag odpowiada czasownikowi: ", { mapping: [{ term: "like" }, { term: "don't" }] }], tr: ["tag fiille uyumludur: ", { mapping: [{ term: "like" }, { term: "don't" }] }], id: ["tag mengikuti kata kerja: ", { mapping: [{ term: "like" }, { term: "don't" }] }], vi: ["phần hỏi đuôi phải phù hợp với động từ: ", { mapping: [{ term: "like" }, { term: "don't" }] }] } }
          - { level: B1, wrong: "She works here, isn't she?", right: ["She works here, ", { target: doesn't she }, "?"], rule: { en: { takes: [["present simple, ", { alternatives: [{ term: he }, { term: she }, { term: it }] }], { term: doesn't }] }, uk: { takes: [["Present Simple, ", { alternatives: [{ term: he }, { term: she }, { term: it }] }], { term: doesn't }] }, es: { takes: [["presente simple, ", { alternatives: [{ term: he }, { term: she }, { term: it }] }], { term: doesn't }] }, pt: { takes: [["presente simples, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, fr: { takes: [["présent simple, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, de: { takes: [["Simple Present, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, it: { takes: [["present simple, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, pl: { takes: [["Present Simple, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, tr: { takes: [["Simple Present, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, id: { takes: [["simple present, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] }, vi: { takes: [["hiện tại đơn, ", { alternatives: [{ term: "he" }, { term: "she" }, { term: "it" }] }], { term: "doesn't" }] } } }
          - { level: B1, wrong: "He doesn't like it, doesn't he?", right: ["He doesn't like it, ", { target: does he }, "?"], rule: { en: { takes: [negative statement, positive tag] }, uk: { takes: ["заперечне речення", "стверджувальний tag"] }, es: { takes: ["oración negativa", "coletilla afirmativa"] }, pt: { takes: ["frase negativa", "tag afirmativa"] }, fr: { takes: ["phrase négative", "tag affirmatif"] }, de: { takes: ["verneinte Aussage", "bejahter Tag"] }, it: { takes: ["frase negativa", "tag affermativo"] }, pl: { takes: ["zdanie przeczące", "tag twierdzący"] }, tr: { takes: ["olumsuz cümle", "olumlu tag"] }, id: { takes: ["kalimat negatif", "tag positif"] }, vi: { takes: ["câu phủ định", "phần hỏi đuôi khẳng định"] } } }
          - { level: B1, wrong: "Let's go, will we?", right: ["Let's go, ", { target: shall we }, "?"], rule: { en: { takes: [{ term: Let's }, { term: shall we }] }, uk: { takes: [{ term: Let's }, { term: shall we }] }, es: { takes: [{ term: Let's }, { term: shall we }] }, pt: { takes: [{ term: "Let's" }, { term: "shall we" }] }, fr: { takes: [{ term: "Let's" }, { term: "shall we" }] }, de: { takes: [{ term: "Let's" }, { term: "shall we" }] }, it: { takes: [{ term: "Let's" }, { term: "shall we" }] }, pl: { takes: [{ term: "Let's" }, { term: "shall we" }] }, tr: { takes: [{ term: "Let's" }, { term: "shall we" }] }, id: { takes: [{ term: "Let's" }, { term: "shall we" }] }, vi: { takes: [{ term: "Let's" }, { term: "shall we" }] } } }
          - { level: B1, wrong: "Open the door, don't you?", right: ["Open the door, ", { target: will you }, "?"], rule: { en: { takes: [command, { term: will you }] }, uk: { takes: ["наказ", { term: will you }] }, es: { takes: ["orden", { term: will you }] }, pt: { takes: ["ordem", { term: "will you" }] }, fr: { takes: ["ordre", { term: "will you" }] }, de: { takes: ["Befehl", { term: "will you" }] }, it: { takes: ["imperativo", { term: "will you" }] }, pl: { takes: ["polecenie", { term: "will you" }] }, tr: { takes: ["emir", { term: "will you" }] }, id: { takes: ["perintah", { term: "will you" }] }, vi: { takes: ["câu mệnh lệnh", { term: "will you" }] } } }
