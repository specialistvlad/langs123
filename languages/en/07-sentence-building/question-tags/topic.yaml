          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, start: { pattern: [{ alternatives: [I think, I suppose, I believe] }, { slot: clause }] }, follows: { en: the clause after the verb, uk: "реченню після дієслова", es: "la subordinada después del verbo", pt: "a oração depois do verbo", fr: "la proposition après le verbe", de: "dem Nebensatz nach dem Verb", it: "alla proposizione dopo il verbo", pl: "zdaniu po czasowniku", tr: "fiilden sonraki yan cümle", id: "klausa setelah kata kerja", vi: "mệnh đề sau động từ" }, ex: ["I suppose he's late, ", { target: isn't he }, "?"], tr: { uk: "Гадаю, він запізнюється, правда?", es: "Supongo que llega tarde, ¿no?", pt: "Suponho que ele está atrasado, não é?", fr: "Je suppose qu’il est en retard, n’est-ce pas ?", de: "Ich nehme an, er kommt zu spät, oder?", it: "Suppongo che sia in ritardo, vero?", pl: "Przypuszczam, że się spóźnia, prawda?", tr: "Sanırım geç kaldı, değil mi?", id: "Saya kira dia terlambat, kan?", vi: "Tôi đoán anh ấy đến muộn, phải không?" } }
          - { level: B2, start: { pattern: [I don't think, { slot: clause }] }, follows: { en: "the clause, read as negative: a positive tag", uk: "реченню, яке сприймають як заперечне: стверджувальний tag", es: "la subordinada, leída como negativa: coletilla afirmativa", pt: "a oração, lida como negativa: tag afirmativa", fr: "la proposition, lue comme négative : tag affirmatif", de: "dem Nebensatz, der als verneint gilt: bejahter Tag", it: "alla proposizione, letta come negativa: tag affermativo", pl: "zdaniu, które czytamy jako przeczące: tag twierdzący", tr: "olumsuz kabul edilen yan cümle: olumlu tag", id: "klausa yang dibaca sebagai negatif: tag positif", vi: "mệnh đề, được hiểu là phủ định: phần hỏi đuôi khẳng định" }, ex: ["I don't think he's coming, ", { target: is he }, "?"], tr: { uk: "Я не думаю, що він прийде, правда?", es: "No creo que venga, ¿verdad?", pt: "Acho que ele não vem, não é?", fr: "Je ne pense pas qu’il vienne, n’est-ce pas ?", de: "Ich glaube nicht, dass er kommt, oder?", it: "Non penso che venga, vero?", pl: "Nie sądzę, że przyjdzie, prawda?", tr: "Geleceğini sanmıyorum, değil mi?", id: "Saya rasa dia tidak datang, kan?", vi: "Tôi không nghĩ anh ấy sẽ đến, phải không?" } }
          - { level: B2, start: { pattern: [{ slot: subject }, { slot: verb }, { slot: clause }] }, follows: { en: the main clause, uk: "головному реченню", es: "la oración principal", pt: "a oração principal", fr: "la proposition principale", de: "dem Hauptsatz", it: "alla proposizione principale", pl: "zdaniu głównemu", tr: "ana cümle", id: "klausa utama", vi: "mệnh đề chính" }, ex: ["He said he would come, ", { target: didn't he }, "?"], tr: { uk: "Він казав, що прийде, чи не так?", es: "Dijo que vendría, ¿no?", pt: "Ele disse que viria, não disse?", fr: "Il a dit qu’il viendrait, n’est-ce pas ?", de: "Er hat gesagt, dass er kommt, oder?", it: "Ha detto che sarebbe venuto, vero?", pl: "Powiedział, że przyjdzie, prawda?", tr: "Geleceğini söyledi, değil mi?", id: "Dia bilang dia akan datang, kan?", vi: "Anh ấy nói là sẽ đến, phải không?" } }
          - { level: B2, start: { en: [{ alternatives: [{ term: if }, { term: when }] }, " clause, then the main clause"], uk: ["речення з ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", потім головне речення"], es: ["oración con ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", luego la oración principal"], pt: ["oração com ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", depois a oração principal"], fr: ["proposition avec ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", puis la proposition principale"], de: ["Nebensatz mit ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", dann der Hauptsatz"], it: ["proposizione con ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", poi la proposizione principale"], pl: ["zdanie z ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", potem zdanie główne"], tr: [{ alternatives: [{ term: "if" }, { term: "when" }] }, " cümleciği, sonra ana cümle"], id: ["klausa ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", lalu klausa utama"], vi: ["mệnh đề ", { alternatives: [{ term: "if" }, { term: "when" }] }, ", rồi đến mệnh đề chính"] }, follows: { en: the main clause, uk: "головному реченню", es: "la oración principal", pt: "a oração principal", fr: "la proposition principale", de: "dem Hauptsatz", it: "alla proposizione principale", pl: "zdaniu głównemu", tr: "ana cümle", id: "klausa utama", vi: "mệnh đề chính" }, ex: ["If it rains, we'll stay in, ", { target: won't we }, "?"], tr: { uk: "Якщо піде дощ, ми залишимося вдома, правда?", es: "Si llueve, nos quedaremos en casa, ¿verdad?", pt: "Se chover, ficaremos em casa, não é?", fr: "S’il pleut, nous resterons à la maison, n’est-ce pas ?", de: "Wenn es regnet, bleiben wir zu Hause, oder?", it: "Se piove, restiamo a casa, vero?", pl: "Jeśli będzie padać, zostaniemy w domu, prawda?", tr: "Yağmur yağarsa evde kalırız, değil mi?", id: "Kalau hujan, kita di rumah saja, kan?", vi: "Nếu trời mưa, chúng ta sẽ ở nhà, phải không?" } }

  - title: { en: "Form: same-polarity tags", uk: "Форма: tag тієї самої полярності", es: "Forma: coletillas de la misma polaridad", pt: "Forma: tags de mesma polaridade", fr: "Forme : tags de même polarité", de: "Form: Tags gleicher Polarität", it: "Forma: tag della stessa polarità", pl: "Forma: tagi o tej samej polarności", tr: "Biçim: aynı kutupluluktaki tag", id: "Bentuk: tag berpolaritas sama", vi: "Dạng: phần hỏi đuôi cùng dạng khẳng định hoặc phủ định" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pair, label: { en: Statement and tag, uk: "Речення й tag", es: "Oración y coletilla", pt: "Frase e tag", fr: "Phrase et tag", de: "Aussage und Tag", it: "Frase e tag", pl: "Zdanie i tag", tr: "Cümle ve tag", id: "Kalimat dan tag", vi: "Câu và phần hỏi đuôi" } }
          - { key: shows, label: { en: Shows, uk: "Що виражає", es: "Expresa", pt: "Expressa", fr: "Exprime", de: "Zeigt", it: "Esprime", pl: "Co wyraża", tr: "Gösterdiği duygu", id: "Menunjukkan", vi: "Thể hiện" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, pair: { en: positive and positive, uk: "обидва стверджувальні", es: "afirmativa y afirmativa", pt: "afirmativa e afirmativa", fr: "affirmative et affirmatif", de: "bejaht und bejaht", it: "affermativa e affermativo", pl: "twierdzące i twierdzący", tr: "olumlu ve olumlu", id: "positif dan positif", vi: "khẳng định và khẳng định" }, shows: { en: realisation or interest, uk: "усвідомлення або зацікавлення", es: "comprensión repentina o interés", pt: "percepção ou interesse", fr: "prise de conscience ou intérêt", de: "Erkenntnis oder Interesse", it: "presa di coscienza o interesse", pl: "olśnienie lub zainteresowanie", tr: "fark etme ya da ilgi", id: "kesadaran baru atau ketertarikan", vi: "sự nhận ra hoặc sự quan tâm" }, ex: ["So you're a doctor, ", { target: are you }, "?"], tr: { uk: "Отже, ти лікар, так?", es: "Así que eres médico, ¿eh?", pt: "Então você é médico, é?", fr: "Alors comme ça, tu es médecin, hein ?", de: "Du bist also Arzt, ja?", it: "Quindi sei medico, eh?", pl: "Więc jesteś lekarzem, tak?", tr: "Demek doktorsun, öyle mi?", id: "Jadi kamu dokter, ya?", vi: "Vậy là bạn làm bác sĩ, à?" } }
          - { level: B2, pair: { en: positive and positive, uk: "обидва стверджувальні", es: "afirmativa y afirmativa", pt: "afirmativa e afirmativa", fr: "affirmative et affirmatif", de: "bejaht und bejaht", it: "affermativa e affermativo", pl: "twierdzące i twierdzący", tr: "olumlu ve olumlu", id: "positif dan positif", vi: "khẳng định và khẳng định" }, shows: { en: irony or suspicion, uk: "іронія або підозра", es: "ironía o sospecha", pt: "ironia ou desconfiança", fr: "ironie ou soupçon", de: "Ironie oder Misstrauen", it: "ironia o sospetto", pl: "ironia lub podejrzliwość", tr: "alay ya da şüphe", id: "ironi atau kecurigaan", vi: "sự mỉa mai hoặc nghi ngờ" }, ex: ["You've been reading my letters, ", { target: have you }, "?"], tr: { uk: "Значить, ти читав мої листи, га?", es: "Así que has estado leyendo mis cartas, ¿eh?", pt: "Então você anda lendo as minhas cartas, é?", fr: "Alors comme ça, tu lis mes lettres, hein ?", de: "Du hast also meine Briefe gelesen, ja?", it: "Quindi hai letto le mie lettere, eh?", pl: "Więc czytałeś moje listy, tak?", tr: "Demek mektuplarımı okuyordun, öyle mi?", id: "Jadi kamu membaca surat-surat saya, begitu?", vi: "Vậy là bạn đã đọc thư của tôi, à?" } }
          - { level: B2, pair: { en: negative and negative, uk: "обидва заперечні", es: "negativa y negativa", pt: "negativa e negativa", fr: "négative et négatif", de: "verneint und verneint", it: "negativa e negativo", pl: "przeczące i przeczący", tr: "olumsuz ve olumsuz", id: "negatif dan negatif", vi: "phủ định và phủ định" }, shows: { en: anger or a challenge, uk: "злість або виклик", es: "enojo o desafío", pt: "raiva ou desafio", fr: "colère ou défi", de: "Ärger oder Herausforderung", it: "rabbia o sfida", pl: "złość lub wyzwanie", tr: "öfke ya da meydan okuma", id: "kemarahan atau tantangan", vi: "sự tức giận hoặc thách thức" }, ex: { exchange: ["I won't tell you.", ["Oh, you ", { target: won't }, ", ", { target: won't you }, "?"]] }, tr: { uk: { exchange: ["Я тобі не скажу.", "Ах так, не скажеш?"] }, es: { exchange: ["No te lo diré.", "Ah, ¿no me lo dirás, eh?"] }, pt: { exchange: ["Eu não vou te contar.", "Ah, não vai, é?"] }, fr: { exchange: ["Je ne te le dirai pas.", "Ah, tu ne me le diras pas, hein ?"] }, de: { exchange: ["Ich sage es dir nicht.", "Ach, du sagst es mir also nicht, ja?"] }, it: { exchange: ["Non te lo dico.", "Ah, non me lo dici, eh?"] }, pl: { exchange: ["Nie powiem ci.", "Ach, nie powiesz mi, tak?"] }, tr: { exchange: ["Sana söylemeyeceğim.", "Ha, söylemeyeceksin, öyle mi?"] }, id: { exchange: ["Saya tidak akan memberitahumu.", "Oh, kamu tidak mau memberitahu, begitu?"] }, vi: { exchange: ["Tôi sẽ không nói cho bạn đâu.", "Ồ, không nói à?"] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A same-polarity tag repeats a claim that the speaker has just heard or worked out.", uk: "Tag тієї самої полярності повторює твердження, яке мовець щойно почув або зрозумів.", es: "Una coletilla de la misma polaridad repite una afirmación que el hablante acaba de oír o de deducir.", pt: "Uma tag de mesma polaridade repete uma afirmação que o falante acabou de ouvir ou de deduzir.", fr: "Un tag de même polarité reprend une affirmation que le locuteur vient d’entendre ou de déduire.", de: "Ein Tag gleicher Polarität wiederholt eine Behauptung, die der Sprecher gerade gehört oder erschlossen hat.", it: "Un tag della stessa polarità ripete un'affermazione che il parlante ha appena sentito o dedotto.", pl: "Tag o tej samej polarności powtarza twierdzenie, które mówiący właśnie usłyszał lub do którego właśnie doszedł.", tr: "Aynı kutupluluktaki tag, konuşanın az önce duyduğu ya da çıkarım yaptığı bir iddiayı tekrarlar.", id: "Tag berpolaritas sama mengulang pernyataan yang baru saja didengar atau disimpulkan oleh penutur.", vi: "Phần hỏi đuôi cùng dạng lặp lại một nhận định mà người nói vừa nghe hoặc vừa suy ra." }

