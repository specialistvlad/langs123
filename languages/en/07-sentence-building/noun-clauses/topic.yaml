          - type: rule
            level: B2
            text: { en: ["A noun-clause ", { term: if }, " reports a question; a conditional ", { term: if }, " sets a condition."], uk: ["В іменниковому підрядному реченні ", { term: "if" }, " передає питання; умовне ", { term: "if" }, " задає умову."], es: ["En una oración sustantiva, ", { term: "if" }, " traslada una pregunta; el ", { term: "if" }, " condicional establece una condición."], pt: ["Em uma oração substantiva, ", { term: "if" }, " reporta uma pergunta; o ", { term: "if" }, " condicional estabelece uma condição."], fr: ["Dans une proposition nominale, ", { term: "if" }, " rapporte une question ; le ", { term: "if" }, " conditionnel pose une condition."], de: ["Ein ", { term: "if" }, " im Nebensatz in Nomenfunktion gibt eine Frage wieder; ein konditionales ", { term: "if" }, " nennt eine Bedingung."], it: ["In una proposizione completiva ", { term: "if" }, " riporta una domanda; il ", { term: "if" }, " condizionale pone una condizione."], pl: [{ term: "if" }, " w zdaniu rzeczownikowym przekazuje pytanie; warunkowe ", { term: "if" }, " stawia warunek."], tr: ["İsim cümleciğindeki ", { term: "if" }, " bir soruyu aktarır; koşul bildiren ", { term: "if" }, " bir koşul koyar."], id: [{ term: "if" }, " dalam klausa nomina melaporkan pertanyaan; ", { term: "if" }, " kondisional menetapkan syarat."], vi: [{ term: "if" }, " trong mệnh đề danh từ thuật lại một câu hỏi; ", { term: "if" }, " điều kiện đặt ra một điều kiện."] }
            ex: { contrast: [["I wonder ", { target: "if it will rain" }, "."], ["I stay in ", { target: "if it rains" }, "."]] }
            tr: { uk: { contrast: ["Цікаво, чи піде дощ.", "Я залишуся вдома, якщо піде дощ."] }, es: { contrast: ["Me pregunto si va a llover.", "Me quedo en casa si llueve."] }, pt: { contrast: ["Me pergunto se vai chover.", "Fico em casa se chover."] }, fr: { contrast: ["Je me demande s’il va pleuvoir.", "Je reste à la maison s’il pleut."] }, de: { contrast: ["Ich frage mich, ob es regnen wird.", "Ich bleibe zu Hause, wenn es regnet."] }, it: { contrast: ["Mi chiedo se pioverà.", "Resto a casa se piove."] }, pl: { contrast: ["Zastanawiam się, czy będzie padać.", "Zostaję w domu, jeśli będzie padać."] }, tr: { contrast: ["Yağmur yağıp yağmayacağını merak ediyorum.", "Yağmur yağarsa evde kalırım."] }, id: { contrast: ["Saya bertanya-tanya apakah akan hujan.", "Saya tinggal di rumah kalau hujan."] }, vi: { contrast: ["Tôi tự hỏi liệu trời có mưa không.", "Tôi ở nhà nếu trời mưa."] } }
          - type: note
