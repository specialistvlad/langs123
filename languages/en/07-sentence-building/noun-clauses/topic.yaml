        rows:
          - { level: B2, form: { pattern: [{ slot: wh-word }, { slot: subject }, { slot: verb }] }, rule: { en: ["statement order, with no ", { term: do }, ", ", { term: does }, " or ", { term: did }], uk: ["порядок слів розповідного речення, без ", { term: "do" }, ", ", { term: "does" }, " чи ", { term: "did" }], es: ["orden de una afirmación, sin ", { term: "do" }, ", ", { term: "does" }, " ni ", { term: "did" }], pt: ["ordem de uma afirmação, sem ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }], fr: ["ordre d’une phrase affirmative, sans ", { term: "do" }, ", ", { term: "does" }, " ni ", { term: "did" }], de: ["Wortstellung des Aussagesatzes, ohne ", { term: "do" }, ", ", { term: "does" }, " oder ", { term: "did" }], it: ["ordine della frase affermativa, senza ", { term: "do" }, ", ", { term: "does" }, " o ", { term: "did" }], pl: ["szyk zdania oznajmującego, bez ", { term: "do" }, ", ", { term: "does" }, " i ", { term: "did" }], tr: ["düz cümle sırası; ", { term: "do" }, ", ", { term: "does" }, " ya da ", { term: "did" }, " kullanılmaz"], id: ["urutan kalimat pernyataan, tanpa ", { term: "do" }, ", ", { term: "does" }, ", atau ", { term: "did" }], vi: ["trật tự như câu trần thuật, không có ", { term: "do" }, ", ", { term: "does" }, " hay ", { term: "did" }] }, ex: ["Tell me ", { target: "where he lives" }, "."], tr: { uk: "Скажи мені, де він живе.", es: "Dime dónde vive.", pt: "Me diga onde ele mora.", fr: "Dis-moi où il habite.", de: "Sag mir, wo er wohnt.", it: "Dimmi dove abita.", pl: "Powiedz mi, gdzie mieszka.", tr: "Bana nerede yaşadığını söyle.", id: "Beri tahu saya di mana dia tinggal.", vi: "Hãy cho tôi biết anh ấy sống ở đâu." } }
          - { level: B2, form: { pattern: [{ slot: wh-word }, { slot: verb }] }, rule: { en: "the wh-word is the subject, so the verb follows it", uk: "питальне слово є підметом, тому дієслово йде одразу за ним", es: "la palabra interrogativa es el sujeto, así que el verbo va justo después", pt: "a palavra interrogativa é o sujeito, então o verbo vem logo depois dela", fr: "le mot interrogatif est le sujet, donc le verbe le suit directement", de: "das Fragewort ist das Subjekt, deshalb folgt das Verb direkt darauf", it: "la parola interrogativa è il soggetto, quindi il verbo la segue subito", pl: "słowo pytające jest podmiotem, więc czasownik stoi tuż po nim", tr: "soru sözcüğü özne olduğu için fiil hemen arkasından gelir", id: "kata tanya wh adalah subjek, jadi kata kerja langsung mengikutinya", vi: "từ để hỏi là chủ ngữ, nên động từ đứng ngay sau nó" }, ex: ["I wonder ", { target: "who called" }, "."], tr: { uk: "Цікаво, хто дзвонив.", es: "Me pregunto quién llamó.", pt: "Me pergunto quem ligou.", fr: "Je me demande qui a appelé.", de: "Ich frage mich, wer angerufen hat.", it: "Mi chiedo chi abbia telefonato.", pl: "Zastanawiam się, kto dzwonił.", tr: "Kimin aradığını merak ediyorum.", id: "Saya bertanya-tanya siapa yang menelepon.", vi: "Tôi tự hỏi ai đã gọi." } }
          - { level: B2, form: { pattern: [{ slot: { en: wh-clause, uk: "речення з wh-", es: "oración con wh-", pt: "oração com wh-", fr: "proposition avec wh-", de: "wh-Satz", it: "proposizione con wh-", pl: "zdanie z wh-", tr: "wh- cümleciği", id: "klausa wh-", vi: "mệnh đề wh-" } }, { slot: { en: singular verb, uk: "дієслово в однині", es: "verbo en singular", pt: "verbo no singular", fr: "verbe au singulier", de: "Verb im Singular", it: "verbo al singolare", pl: "czasownik w liczbie pojedynczej", tr: "tekil fiil", id: "kata kerja tunggal", vi: "động từ số ít" } }] }, rule: { en: "a wh-clause as subject takes a singular verb", uk: "речення з wh- у ролі підмета вживається з дієсловом в однині", es: "una oración con wh- como sujeto lleva el verbo en singular", pt: "uma oração com wh- como sujeito leva o verbo no singular", fr: "une proposition avec wh- en position de sujet prend un verbe au singulier", de: "ein wh-Satz als Subjekt steht mit dem Verb im Singular", it: "una proposizione con wh- come soggetto vuole il verbo al singolare", pl: "zdanie z wh- w roli podmiotu łączy się z czasownikiem w liczbie pojedynczej", tr: "özne olan bir wh- cümleciği tekil fiil alır", id: "klausa wh- sebagai subjek memakai kata kerja tunggal", vi: "mệnh đề wh- làm chủ ngữ đi với động từ số ít" }, ex: { examples: [[{ target: "What he does" }, " is his business."], [{ target: "What they need" }, " is more time."]] }, tr: { uk: { examples: ["Те, що він робить, — його справа.", "Те, що їм потрібно, — більше часу."] }, es: { examples: ["Lo que él hace es asunto suyo.", "Lo que necesitan es más tiempo."] }, pt: { examples: ["O que ele faz é problema dele.", "O que eles precisam é de mais tempo."] }, fr: { examples: ["Ce qu’il fait, c’est son affaire.", "Ce dont ils ont besoin, c’est de plus de temps."] }, de: { examples: ["Was er tut, ist seine Sache.", "Was sie brauchen, ist mehr Zeit."] }, it: { examples: ["Quello che fa è affar suo.", "Quello di cui hanno bisogno è più tempo."] }, pl: { examples: ["To, co robi, to jego sprawa.", "To, czego potrzebują, to więcej czasu."] }, tr: { examples: ["Ne yaptığı onun bileceği iş.", "İhtiyaçları olan şey daha fazla zaman."] }, id: { examples: ["Apa yang dia lakukan adalah urusannya.", "Apa yang mereka butuhkan adalah lebih banyak waktu."] }, vi: { examples: ["Việc anh ấy làm là chuyện của anh ấy.", "Điều họ cần là thêm thời gian."] } } }

