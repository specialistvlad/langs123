          - { key: use, label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, use: { en: ["A problem or question: ", { term: "The problem is" }, ", ", { term: "The question is" }], uk: ["Проблема чи питання: ", { term: "The problem is" }, ", ", { term: "The question is" }], es: ["Un problema o una pregunta: ", { term: "The problem is" }, ", ", { term: "The question is" }], pt: ["Um problema ou uma pergunta: ", { term: "The problem is" }, ", ", { term: "The question is" }], fr: ["Un problème ou une question : ", { term: "The problem is" }, ", ", { term: "The question is" }], de: ["Ein Problem oder eine Frage: ", { term: "The problem is" }, ", ", { term: "The question is" }], it: ["Un problema o una domanda: ", { term: "The problem is" }, ", ", { term: "The question is" }], pl: ["Problem lub pytanie: ", { term: "The problem is" }, ", ", { term: "The question is" }], tr: ["Sorun ya da soru: ", { term: "The problem is" }, ", ", { term: "The question is" }], id: ["Masalah atau pertanyaan: ", { term: "The problem is" }, ", ", { term: "The question is" }], vi: ["Một vấn đề hay câu hỏi: ", { term: "The problem is" }, ", ", { term: "The question is" }] }, ex: { examples: [["The problem is ", { target: "where to park" }, "."], ["The question is ", { target: "whether we can afford it" }, "."]] }, tr: { uk: { examples: ["Проблема в тому, де припаркуватися.", "Питання в тому, чи можемо ми це собі дозволити."] }, es: { examples: ["El problema es dónde estacionar.", "La pregunta es si podemos pagarlo."] }, pt: { examples: ["O problema é onde estacionar.", "A questão é se podemos pagar."] }, fr: { examples: ["Le problème, c’est où se garer.", "La question est de savoir si nous en avons les moyens."] }, de: { examples: ["Das Problem ist, wo man parken soll.", "Die Frage ist, ob wir uns das leisten können."] }, it: { examples: ["Il problema è dove parcheggiare.", "La questione è se possiamo permettercelo."] }, pl: { examples: ["Problem w tym, gdzie zaparkować.", "Pytanie brzmi, czy nas na to stać."] }, tr: { examples: ["Sorun nereye park edeceğimiz.", "Soru, bunu karşılayıp karşılayamayacağımız."] }, id: { examples: ["Masalahnya adalah di mana harus parkir.", "Pertanyaannya adalah apakah kita mampu membelinya."] }, vi: { examples: ["Vấn đề là đỗ xe ở đâu.", "Câu hỏi là liệu chúng ta có đủ khả năng hay không."] } } }
          - { level: C1, use: { en: ["A reason: ", { term: "This is why" }], uk: ["Причина: ", { term: "This is why" }], es: ["Una razón: ", { term: "This is why" }], pt: ["Uma razão: ", { term: "This is why" }], fr: ["Une raison : ", { term: "This is why" }], de: ["Ein Grund: ", { term: "This is why" }], it: ["Un motivo: ", { term: "This is why" }], pl: ["Powód: ", { term: "This is why" }], tr: ["Neden: ", { term: "This is why" }], id: ["Alasan: ", { term: "This is why" }], vi: ["Một lý do: ", { term: "This is why" }] }, ex: ["This is ", { target: "why I called" }, "."], tr: { uk: "Ось чому я зателефонував.", es: "Por eso llamé.", pt: "É por isso que eu liguei.", fr: "C’est pour cela que j’ai appelé.", de: "Deshalb habe ich angerufen.", it: "È per questo che ho chiamato.", pl: "Dlatego zadzwoniłem.", tr: "Bu yüzden aradım.", id: "Itulah sebabnya saya menelepon.", vi: "Đó là lý do tôi gọi." } }
          - { level: C1, use: { en: ["A way: ", { term: "That's how" }], uk: ["Спосіб: ", { term: "That's how" }], es: ["Una manera: ", { term: "That's how" }], pt: ["Um modo: ", { term: "That's how" }], fr: ["Une manière : ", { term: "That's how" }], de: ["Eine Art und Weise: ", { term: "That's how" }], it: ["Un modo: ", { term: "That's how" }], pl: ["Sposób: ", { term: "That's how" }], tr: ["Yol: ", { term: "That's how" }], id: ["Cara: ", { term: "That's how" }], vi: ["Một cách: ", { term: "That's how" }] }, ex: ["That's ", { target: "how it works" }, "."], tr: { uk: "Ось так це працює.", es: "Así es como funciona.", pt: "É assim que funciona.", fr: "C’est comme ça que ça marche.", de: "So funktioniert es.", it: "È così che funziona.", pl: "Tak to działa.", tr: "Böyle çalışıyor.", id: "Begitulah cara kerjanya.", vi: "Đó là cách nó hoạt động." } }
          - { level: C1, use: { en: ["A place: ", { term: "This is where" }], uk: ["Місце: ", { term: "This is where" }], es: ["Un lugar: ", { term: "This is where" }], pt: ["Um lugar: ", { term: "This is where" }], fr: ["Un lieu : ", { term: "This is where" }], de: ["Ein Ort: ", { term: "This is where" }], it: ["Un luogo: ", { term: "This is where" }], pl: ["Miejsce: ", { term: "This is where" }], tr: ["Yer: ", { term: "This is where" }], id: ["Tempat: ", { term: "This is where" }], vi: ["Một nơi: ", { term: "This is where" }] }, ex: ["This is ", { target: "where we met" }, "."], tr: { uk: "Саме тут ми познайомилися.", es: "Aquí es donde nos conocimos.", pt: "Foi aqui que nos conhecemos.", fr: "C’est ici que nous nous sommes rencontrés.", de: "Hier haben wir uns kennengelernt.", it: "È qui che ci siamo conosciuti.", pl: "Tu się poznaliśmy.", tr: "Tanıştığımız yer burası.", id: "Di sinilah kami bertemu.", vi: "Đây là nơi chúng tôi đã gặp nhau." } }
          - { level: C1, use: { en: ["A thing meant: ", { term: "That's what" }], uk: ["Що мається на увазі: ", { term: "That's what" }], es: ["Lo que se quiere decir: ", { term: "That's what" }], pt: ["O que se quer dizer: ", { term: "That's what" }], fr: ["Ce qu’on veut dire : ", { term: "That's what" }], de: ["Das Gemeinte: ", { term: "That's what" }], it: ["Ciò che si intende: ", { term: "That's what" }], pl: ["To, co mamy na myśli: ", { term: "That's what" }], tr: ["Kastedilen şey: ", { term: "That's what" }], id: ["Hal yang dimaksud: ", { term: "That's what" }], vi: ["Điều muốn nói: ", { term: "That's what" }] }, ex: ["That's ", { target: "what I mean" }, "."], tr: { uk: "Ось що я маю на увазі.", es: "Eso es lo que quiero decir.", pt: "É isso que eu quero dizer.", fr: "C’est ce que je veux dire.", de: "Das meine ich.", it: "È questo che intendo.", pl: "To właśnie mam na myśli.", tr: "Kastettiğim şey bu.", id: "Itulah yang saya maksud.", vi: "Đó là điều tôi muốn nói." } }

  - title: { en: "Clauses after prepositions and adjectives", uk: "Підрядні речення після прийменників і прикметників", es: "Oraciones después de preposiciones y adjetivos", pt: "Orações depois de preposições e adjetivos", fr: "Propositions après des prépositions et des adjectifs", de: "Nebensätze nach Präpositionen und Adjektiven", it: "Proposizioni dopo preposizioni e aggettivi", pl: "Zdania po przyimkach i przymiotnikach", tr: "Edatlardan ve sıfatlardan sonra gelen cümlecikler", id: "Klausa setelah kata depan dan kata sifat", vi: "Mệnh đề sau giới từ và tính từ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: phrase, label: { en: "Phrase", uk: "Зворот", es: "Expresión", pt: "Expressão", fr: "Expression", de: "Wendung", it: "Espressione", pl: "Wyrażenie", tr: "Söz öbeği", id: "Frasa", vi: "Cụm từ" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, phrase: { pattern: [{ alternatives: [aware, sure] }, of, { slot: wh-word }] }, ex: { examples: [["She is ", { target: "aware of how much it costs" }, "."], ["I'm not ", { target: "sure of what he meant" }, "."]] }, tr: { uk: { examples: ["Вона усвідомлює, скільки це коштує.", "Я не впевнений, що він мав на увазі."] }, es: { examples: ["Ella es consciente de cuánto cuesta.", "No estoy seguro de lo que quiso decir."] }, pt: { examples: ["Ela está ciente de quanto custa.", "Não tenho certeza do que ele quis dizer."] }, fr: { examples: ["Elle sait combien cela coûte.", "Je ne suis pas sûr de ce qu’il voulait dire."] }, de: { examples: ["Ihr ist bewusst, wie viel es kostet.", "Ich bin nicht sicher, was er gemeint hat."] }, it: { examples: ["È consapevole di quanto costa.", "Non sono sicuro di ciò che intendeva."] }, pl: { examples: ["Ona zdaje sobie sprawę, ile to kosztuje.", "Nie jestem pewien, co miał na myśli."] }, tr: { examples: ["O, bunun ne kadar tuttuğunun farkında.", "Onun ne demek istediğinden emin değilim."] }, id: { examples: ["Dia sadar berapa harganya.", "Saya tidak yakin dengan apa yang dia maksud."] }, vi: { examples: ["Cô ấy biết nó giá bao nhiêu.", "Tôi không chắc anh ấy muốn nói gì."] } } }
          - { level: C1, phrase: { pattern: [depends on, whether, { slot: clause }] }, ex: ["It ", { target: "depends on whether we can park" }, "."], tr: { uk: "Це залежить від того, чи зможемо ми припаркуватися.", es: "Depende de si podemos estacionar.", pt: "Depende de conseguirmos estacionar.", fr: "Cela dépend si nous pouvons nous garer.", de: "Es hängt davon ab, ob wir parken können.", it: "Dipende se riusciamo a parcheggiare.", pl: "To zależy od tego, czy będziemy mogli zaparkować.", tr: "Park edip edemeyeceğimize bağlı.", id: "Itu tergantung apakah kita bisa parkir.", vi: "Điều đó tùy thuộc vào việc chúng ta có đỗ xe được không." } }
          - { level: C1, phrase: { pattern: [the extent, to which, { slot: clause }] }, ex: ["The report shows ", { target: "the extent to which prices have risen" }, "."], tr: { uk: "Звіт показує, наскільки зросли ціни.", es: "El informe muestra en qué medida han subido los precios.", pt: "O relatório mostra em que medida os preços subiram.", fr: "Le rapport montre dans quelle mesure les prix ont augmenté.", de: "Der Bericht zeigt, in welchem Ausmaß die Preise gestiegen sind.", it: "Il rapporto mostra in che misura sono aumentati i prezzi.", pl: "Raport pokazuje, w jakim stopniu wzrosły ceny.", tr: "Rapor, fiyatların ne ölçüde yükseldiğini gösteriyor.", id: "Laporan itu menunjukkan sejauh mana harga telah naik.", vi: "Báo cáo cho thấy giá đã tăng đến mức nào." } }
          - { level: C1, phrase: { pattern: [in what way, { slot: clause }] }, ex: ["She asked ", { target: "in what way the plan had failed" }, "."], tr: { uk: "Вона спитала, яким чином план зазнав невдачі.", es: "Ella preguntó de qué manera había fracasado el plan.", pt: "Ela perguntou de que maneira o plano tinha fracassado.", fr: "Elle a demandé de quelle manière le plan avait échoué.", de: "Sie fragte, auf welche Weise der Plan gescheitert war.", it: "Ha chiesto in che modo il piano era fallito.", pl: "Zapytała, w jaki sposób plan zawiódł.", tr: "Planın hangi bakımdan başarısız olduğunu sordu.", id: "Dia bertanya dengan cara apa rencana itu gagal.", vi: "Cô ấy hỏi kế hoạch đã thất bại theo cách nào." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["Before a ", { term: that }, "-clause the preposition drops, or ", { term: "the fact" }, " carries it."], uk: ["Перед реченням із ", { term: "that" }, " прийменник опускається або переходить до ", { term: "the fact" }, "."], es: ["Antes de una oración con ", { term: "that" }, " se omite la preposición, o bien la lleva ", { term: "the fact" }, "."], pt: ["Antes de uma oração com ", { term: "that" }, ", a preposição some, ou ", { term: "the fact" }, " a leva."], fr: ["Devant une proposition avec ", { term: "that" }, ", la préposition tombe, ou ", { term: "the fact" }, " la porte."], de: ["Vor einem ", { term: "that" }, "-Satz entfällt die Präposition, oder ", { term: "the fact" }, " trägt sie."], it: ["Davanti a una proposizione con ", { term: "that" }, " la preposizione cade, oppure la porta ", { term: "the fact" }, "."], pl: ["Przed zdaniem z ", { term: "that" }, " przyimek znika albo przejmuje go ", { term: "the fact" }, "."], tr: [{ term: "that" }, " cümleciğinden önce edat düşer ya da edatı ", { term: "the fact" }, " taşır."], id: ["Sebelum klausa ", { term: "that" }, ", kata depan dihilangkan, atau ", { term: "the fact" }, " yang membawanya."], vi: ["Trước mệnh đề ", { term: "that" }, ", giới từ bị lược bỏ, hoặc ", { term: "the fact" }, " mang giới từ."] }
            ex: { equivalence: [["She is aware ", { target: that }, " it closed."], ["She is aware ", { target: "of the fact that" }, " it closed."]] }
