            text: { en: ["Conditional clauses are in ", { link: "Conditionals", to: en.sentence-building.conditionals-0-1-2 }, "."], uk: ["Умовні речення розглянуто в темі ", { link: "Умовні речення", to: "en.sentence-building.conditionals-0-1-2" }, "."], es: ["Las oraciones condicionales están en ", { link: "Condicionales", to: "en.sentence-building.conditionals-0-1-2" }, "."], pt: ["As orações condicionais estão em ", { link: "Condicionais", to: "en.sentence-building.conditionals-0-1-2" }, "."], fr: ["Les propositions conditionnelles sont dans ", { link: "Phrases conditionnelles", to: "en.sentence-building.conditionals-0-1-2" }, "."], de: ["Bedingungssätze stehen in ", { link: "Bedingungssätze", to: "en.sentence-building.conditionals-0-1-2" }, "."], it: ["Le proposizioni condizionali sono in ", { link: "Periodo ipotetico", to: "en.sentence-building.conditionals-0-1-2" }, "."], pl: ["Zdania warunkowe omawia temat ", { link: "Zdania warunkowe", to: "en.sentence-building.conditionals-0-1-2" }, "."], tr: ["Koşul cümlecikleri ", { link: "Koşul cümleleri", to: "en.sentence-building.conditionals-0-1-2" }, " konusundadır."], id: ["Klausa kondisional dibahas di ", { link: "Kalimat conditional", to: "en.sentence-building.conditionals-0-1-2" }, "."], vi: ["Các mệnh đề điều kiện nằm trong ", { link: "Câu điều kiện", to: "en.sentence-building.conditionals-0-1-2" }, "."] }

