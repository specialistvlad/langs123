            if: { ex: ["I wonder ", { target: if }, " she knows."], tr: { uk: "Цікаво, чи вона знає.", es: "Me pregunto si ella lo sabe.", pt: "Me pergunto se ela sabe.", fr: "Je me demande si elle sait.", de: "Ich frage mich, ob sie es weiß.", it: "Mi chiedo se lei lo sa.", pl: "Zastanawiam się, czy ona wie.", tr: "Onun bilip bilmediğini merak ediyorum.", id: "Saya bertanya-tanya apakah dia tahu.", vi: "Tôi tự hỏi liệu cô ấy có biết không." } }
            whether: { ex: ["I wonder ", { target: whether }, " she knows."], tr: { uk: "Цікаво, чи вона знає.", es: "Me pregunto si ella lo sabe.", pt: "Me pergunto se ela sabe.", fr: "Je me demande si elle sait.", de: "Ich frage mich, ob sie es weiß.", it: "Mi chiedo se lei lo sa.", pl: "Zastanawiam się, czy ona wie.", tr: "Onun bilip bilmediğini merak ediyorum.", id: "Saya bertanya-tanya apakah dia tahu.", vi: "Tôi tự hỏi liệu cô ấy có biết không." } }
          - level: B2
            point: { en: "After a preposition", uk: "Після прийменника", es: "Después de una preposición", pt: "Depois de uma preposição", fr: "Après une préposition", de: "Nach einer Präposition", it: "Dopo una preposizione", pl: "Po przyimku", tr: "Edat sonrası", id: "Setelah kata depan", vi: "Sau giới từ" }
            whether: { ex: ["It depends on ", { target: whether }, " it rains."], tr: { uk: "Це залежить від того, чи піде дощ.", es: "Depende de si llueve.", pt: "Depende de chover.", fr: "Ça dépend s’il pleut.", de: "Es hängt davon ab, ob es regnet.", it: "Dipende se piove.", pl: "To zależy od tego, czy będzie padać.", tr: "Yağmur yağıp yağmamasına bağlı.", id: "Itu tergantung apakah hujan.", vi: "Điều đó tùy thuộc vào việc trời có mưa không." } }
          - level: B2
            point: { en: "Before a to-infinitive", uk: "Перед інфінітивом із to", es: "Antes de un infinitivo con to", pt: "Antes de um infinitivo com to", fr: "Devant un infinitif avec to", de: "Vor einem Infinitiv mit to", it: "Davanti a un infinito con to", pl: "Przed bezokolicznikiem z to", tr: "to ile kurulan mastardan önce", id: "Sebelum infinitif dengan to", vi: "Trước động từ nguyên mẫu có to" }
            whether: { ex: ["I can't decide ", { target: whether }, " to go."], tr: { uk: "Я не можу вирішити, йти чи ні.", es: "No puedo decidir si ir.", pt: "Não consigo decidir se vou.", fr: "Je n’arrive pas à décider si j’y vais.", de: "Ich kann mich nicht entscheiden, ob ich gehe.", it: "Non riesco a decidere se andare.", pl: "Nie mogę zdecydować, czy iść.", tr: "Gidip gitmeyeceğime karar veremiyorum.", id: "Saya tidak bisa memutuskan apakah akan pergi.", vi: "Tôi không thể quyết định có đi hay không." } }
