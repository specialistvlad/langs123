          - { level: B2, word: whatever, use: { en: "anything that", uk: "будь-що, що", es: "cualquier cosa que", pt: "qualquer coisa que", fr: "tout ce que", de: "alles, was", it: "qualunque cosa che", pl: "wszystko, co", tr: "olan herhangi bir şey", id: "apa pun yang", vi: "bất kỳ điều gì mà" }, ex: ["Take ", { target: "whatever you like" }, "."], tr: { uk: "Бери все, що хочеш.", es: "Toma lo que quieras.", pt: "Pegue o que quiser.", fr: "Prends ce que tu veux.", de: "Nimm, was du willst.", it: "Prendi quello che vuoi.", pl: "Weź, co chcesz.", tr: "Ne istersen al.", id: "Ambil apa pun yang kamu suka.", vi: "Cứ lấy bất cứ thứ gì bạn thích." } }
