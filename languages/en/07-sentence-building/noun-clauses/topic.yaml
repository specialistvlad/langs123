        rows:
          - { level: C1, phrase: { pattern: [the, { alternatives: [fact, idea, claim, belief] }, that, { slot: clause }] }, use: { en: "the noun names what the clause says", uk: "іменник називає зміст речення", es: "el sustantivo dice qué expresa la oración", pt: "o substantivo diz o que a oração expressa", fr: "le nom dit ce qu’exprime la proposition", de: "das Nomen nennt, was der Nebensatz sagt", it: "il sostantivo dice che cosa esprime la proposizione", pl: "rzeczownik nazywa treść zdania", tr: "isim, cümleciğin ne söylediğini adlandırır", id: "kata benda menyebut isi klausa", vi: "danh từ nêu nội dung của mệnh đề" }, ex: ["The claim ", { target: "that prices will fall" }, " is false."], tr: { uk: "Твердження, що ціни впадуть, хибне.", es: "La afirmación de que los precios bajarán es falsa.", pt: "A afirmação de que os preços vão cair é falsa.", fr: "L’affirmation selon laquelle les prix vont baisser est fausse.", de: "Die Behauptung, dass die Preise fallen werden, ist falsch.", it: "L'affermazione che i prezzi scenderanno è falsa.", pl: "Twierdzenie, że ceny spadną, jest fałszywe.", tr: "Fiyatların düşeceği iddiası yanlış.", id: "Klaim bahwa harga akan turun itu salah.", vi: "Lời khẳng định rằng giá sẽ giảm là sai." } }
          - { level: C1, phrase: { pattern: [the question, whether, { slot: clause }] }, use: { en: [{ term: question }, " takes ", { term: whether }], uk: [{ term: "question" }, " вживається з ", { term: "whether" }], es: [{ term: "question" }, " lleva ", { term: "whether" }], pt: [{ term: "question" }, " leva ", { term: "whether" }], fr: [{ term: "question" }, " prend ", { term: "whether" }], de: [{ term: "question" }, " steht mit ", { term: "whether" }], it: [{ term: "question" }, " vuole ", { term: "whether" }], pl: [{ term: "question" }, " łączy się z ", { term: "whether" }], tr: [{ term: "question" }, " sözcüğü ", { term: "whether" }, " alır"], id: [{ term: "question" }, " memakai ", { term: "whether" }], vi: [{ term: "question" }, " đi với ", { term: "whether" }] }, ex: ["The question ", { target: "whether we can afford it" }, " remains."], tr: { uk: "Питання, чи можемо ми це собі дозволити, залишається відкритим.", es: "Sigue en pie la pregunta de si podemos pagarlo.", pt: "A questão de se podemos pagar continua em aberto.", fr: "La question de savoir si nous en avons les moyens reste posée.", de: "Die Frage, ob wir uns das leisten können, bleibt offen.", it: "Resta aperta la questione se possiamo permettercelo.", pl: "Pytanie, czy nas na to stać, pozostaje otwarte.", tr: "Bunu karşılayıp karşılayamayacağımız sorusu ortada duruyor.", id: "Pertanyaan apakah kita mampu membelinya masih tersisa.", vi: "Câu hỏi liệu chúng ta có đủ khả năng chi trả hay không vẫn còn đó." } }
          - { level: C1, phrase: despite the fact that, use: { en: "although", uk: "хоча", es: "aunque", pt: "embora", fr: "bien que", de: "obwohl", it: "sebbene", pl: "chociaż", tr: "olmasına rağmen", id: "meskipun", vi: "mặc dù" }, ex: [{ target: "Despite the fact that" }, " it was late, we stayed."], tr: { uk: "Хоча було пізно, ми залишилися.", es: "Aunque era tarde, nos quedamos.", pt: "Apesar de ser tarde, ficamos.", fr: "Même s’il était tard, nous sommes restés.", de: "Obwohl es spät war, blieben wir.", it: "Anche se era tardi, siamo rimasti.", pl: "Chociaż było późno, zostaliśmy.", tr: "Geç olmasına rağmen kaldık.", id: "Meskipun sudah larut, kami tetap tinggal.", vi: "Dù đã muộn, chúng tôi vẫn ở lại." } }
          - { level: C1, phrase: in view of the fact that, use: { en: "because of; formal", uk: "через те, що; офіційний стиль", es: "debido a; formal", pt: "por causa de; formal", fr: "en raison de ; soutenu", de: "wegen; förmlich", it: "a causa di; formale", pl: "z powodu; formalne", tr: "yüzünden; resmî", id: "karena; formal", vi: "vì; trang trọng" }, ex: [{ target: "In view of the fact that" }, " prices rose, we waited."], tr: { uk: "Зважаючи на те, що ціни зросли, ми почекали.", es: "Dado que los precios subieron, esperamos.", pt: "Tendo em vista que os preços subiram, esperamos.", fr: "Étant donné que les prix ont augmenté, nous avons attendu.", de: "Angesichts der Tatsache, dass die Preise gestiegen sind, warteten wir.", it: "Dato che i prezzi sono saliti, abbiamo aspettato.", pl: "Ze względu na to, że ceny wzrosły, poczekaliśmy.", tr: "Fiyatlar yükseldiği için bekledik.", id: "Mengingat harga naik, kami menunggu.", vi: "Xét việc giá đã tăng, chúng tôi đã chờ." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["An appositive clause names the noun's content; a relative ", { term: that }, " clause has a gap and can become ", { term: which }, "."], uk: ["Пояснювальне підрядне речення називає зміст іменника; відносне речення з ", { term: "that" }, " має пропуск і може набути форми з ", { term: "which" }, "."], es: ["Una oración apositiva expresa el contenido del sustantivo; una oración de relativo con ", { term: "that" }, " tiene un hueco y puede pasar a ", { term: "which" }, "."], pt: ["Uma oração apositiva diz o conteúdo do substantivo; uma oração relativa com ", { term: "that" }, " tem uma lacuna e pode passar para ", { term: "which" }, "."], fr: ["Une complétive du nom exprime le contenu du nom ; une relative avec ", { term: "that" }, " a une lacune et peut passer à ", { term: "which" }, "."], de: ["Ein Appositivsatz nennt den Inhalt des Nomens; ein Relativsatz mit ", { term: "that" }, " hat eine Lücke und kann zu ", { term: "which" }, " werden."], it: ["Una proposizione appositiva dice il contenuto del sostantivo; una relativa con ", { term: "that" }, " ha un vuoto e può diventare ", { term: "which" }, "."], pl: ["Zdanie apozycyjne nazywa treść rzeczownika; zdanie względne z ", { term: "that" }, " ma lukę i może przyjąć ", { term: "which" }, "."], tr: ["İsmi açıklayan cümlecik, ismin içeriğini adlandırır; ", { term: "that" }, " ile kurulan ilgi cümleciğinde boşluk vardır ve cümlecik ", { term: "which" }, " ile kurulabilir."], id: ["Klausa apositif menyebut isi kata benda; klausa relatif dengan ", { term: "that" }, " punya celah dan bisa memakai ", { term: "which" }, "."], vi: ["Mệnh đề đồng vị nêu nội dung của danh từ; mệnh đề quan hệ với ", { term: "that" }, " có chỗ trống và có thể đổi thành ", { term: "which" }, "."] }
            ex: { contrast: [["the news ", { target: "that she won" }], ["the news ", { target: "that she told us" }]] }
            tr: { uk: { contrast: ["новина про те, що вона виграла", "новина, яку вона нам розповіла"] }, es: { contrast: ["la noticia de que ella ganó", "la noticia que ella nos contó"] }, pt: { contrast: ["a notícia de que ela ganhou", "a notícia que ela nos contou"] }, fr: { contrast: ["la nouvelle selon laquelle elle a gagné", "la nouvelle qu’elle nous a annoncée"] }, de: { contrast: ["die Nachricht, dass sie gewonnen hat", "die Nachricht, die sie uns erzählt hat"] }, it: { contrast: ["la notizia che ha vinto", "la notizia che ci ha raccontato"] }, pl: { contrast: ["wiadomość, że wygrała", "wiadomość, którą nam przekazała"] }, tr: { contrast: ["onun kazandığı haberi", "bize anlattığı haber"] }, id: { contrast: ["kabar bahwa dia menang", "kabar yang dia ceritakan kepada kami"] }, vi: { contrast: ["tin cô ấy đã thắng", "tin cô ấy đã kể cho chúng tôi nghe"] } }

  - title: { en: "Wh-clauses after be", uk: "Речення з wh- після be", es: "Oraciones con wh- después de be", pt: "Orações com wh- depois de be", fr: "Propositions avec wh- après be", de: "wh-Sätze nach be", it: "Proposizioni con wh- dopo be", pl: "Zdania z wh- po be", tr: "be sonrasında wh- cümlecikleri", id: "Klausa wh- setelah be", vi: "Mệnh đề wh- sau be" }
    role: own
