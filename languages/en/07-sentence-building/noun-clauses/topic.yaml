          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [That, { slot: clause }, { slot: verb }] }, ex: [{ target: "That he left" }, " surprised me."], tr: { uk: "Те, що він пішов, мене здивувало.", es: "Que se fuera me sorprendió.", pt: "Que ele tenha ido embora me surpreendeu.", fr: "Qu’il soit parti m’a surpris.", de: "Dass er gegangen ist, hat mich überrascht.", it: "Che sia partito mi ha sorpreso.", pl: "To, że wyszedł, mnie zaskoczyło.", tr: "Onun gitmiş olması beni şaşırttı.", id: "Bahwa dia pergi mengejutkan saya.", vi: "Việc anh ấy đã đi làm tôi ngạc nhiên." } }
          - { level: B2, form: { pattern: [It, { slot: verb }, { slot: person }, that, { slot: clause }] }, ex: [{ target: "It surprised me that he left" }, "."], tr: { uk: "Мене здивувало, що він пішов.", es: "Me sorprendió que se fuera.", pt: "Me surpreendeu que ele tenha ido embora.", fr: "Ça m’a surpris qu’il soit parti.", de: "Es hat mich überrascht, dass er gegangen ist.", it: "Mi ha sorpreso che sia partito.", pl: "Zaskoczyło mnie, że wyszedł.", tr: "Onun gittiğine şaşırdım.", id: "Mengejutkan saya bahwa dia pergi.", vi: "Tôi ngạc nhiên là anh ấy đã đi." } }
          - { level: B2, form: { pattern: [It, is, { slot: adjective }, that, { slot: clause }] }, ex: [{ target: "It is clear that she is tired" }, "."], tr: { uk: "Зрозуміло, що вона втомилася.", es: "Es evidente que ella está cansada.", pt: "É claro que ela está cansada.", fr: "Il est clair qu’elle est fatiguée.", de: "Es ist klar, dass sie müde ist.", it: "È chiaro che è stanca.", pl: "Jasne, że ona jest zmęczona.", tr: "Onun yorgun olduğu açık.", id: "Jelas bahwa dia lelah.", vi: "Rõ ràng là cô ấy mệt." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["A ", { term: that }, "-clause subject sounds formal; speech prefers ", { term: it }, " first."], uk: ["Підрядне речення з ", { term: "that" }, " у ролі підмета звучить офіційно; у мовленні перевагу віддають ", { term: "it" }, " на початку."], es: ["Una oración con ", { term: "that" }, " como sujeto suena formal; al hablar se prefiere empezar con ", { term: "it" }, "."], pt: ["Uma oração com ", { term: "that" }, " como sujeito soa formal; na fala se prefere começar com ", { term: "it" }, "."], fr: ["Une proposition avec ", { term: "that" }, " en position de sujet fait soutenu ; à l’oral, on préfère commencer par ", { term: "it" }, "."], de: ["Ein ", { term: "that" }, "-Satz als Subjekt klingt förmlich; gesprochen steht lieber ", { term: "it" }, " am Anfang."], it: ["Una proposizione con ", { term: "that" }, " come soggetto suona formale; nel parlato si preferisce iniziare con ", { term: "it" }, "."], pl: ["Zdanie z ", { term: "that" }, " w roli podmiotu brzmi formalnie; w mowie woli się zaczynać od ", { term: "it" }, "."], tr: ["Özne olan bir ", { term: "that" }, " cümleciği resmî durur; konuşmada başa ", { term: "it" }, " getirmek tercih edilir."], id: ["Klausa ", { term: "that" }, " sebagai subjek terdengar formal; dalam percakapan lebih sering diawali ", { term: "it" }, "."], vi: ["Mệnh đề ", { term: "that" }, " làm chủ ngữ nghe trang trọng; trong lời nói người ta thích mở đầu bằng ", { term: "it" }, "."] }

  - title: { en: "Form: wh-clauses", uk: "Форма: речення з wh-", es: "Forma: oraciones con wh-", pt: "Forma: orações com wh-", fr: "Forme : propositions avec wh-", de: "Form: wh-Sätze", it: "Forma: proposizioni con wh-", pl: "Forma: zdania z wh-", tr: "Biçim: wh- cümlecikleri", id: "Bentuk: klausa wh-", vi: "Dạng: mệnh đề wh-" }
