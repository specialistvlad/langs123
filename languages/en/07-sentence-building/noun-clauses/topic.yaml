            point: { en: "The subject goes before the verb", uk: "Підмет стоїть перед дієсловом", es: "El sujeto va antes del verbo", pt: "O sujeito vem antes do verbo", fr: "Le sujet se place avant le verbe", de: "Das Subjekt steht vor dem Verb", it: "Il soggetto sta prima del verbo", pl: "Podmiot stoi przed czasownikiem", tr: "Özne fiilden önce gelir", id: "Subjek berada sebelum kata kerja", vi: "Chủ ngữ đứng trước động từ" }
            direct: { ex: "Where is the station?", tr: { uk: "Де станція?", es: "¿Dónde está la estación?", pt: "Onde fica a estação?", fr: "Où est la gare ?", de: "Wo ist der Bahnhof?", it: "Dov'è la stazione?", pl: "Gdzie jest dworzec?", tr: "İstasyon nerede?", id: "Di mana stasiunnya?", vi: "Nhà ga ở đâu?" } }
            embedded: { ex: ["Could you tell me ", { target: "where the station is" }, "?"], tr: { uk: "Підкажіть, будь ласка, де станція?", es: "¿Podría decirme dónde está la estación?", pt: "Você poderia me dizer onde fica a estação?", fr: "Pourriez-vous me dire où se trouve la gare ?", de: "Könnten Sie mir sagen, wo der Bahnhof ist?", it: "Potrebbe dirmi dov'è la stazione?", pl: "Czy mógłby mi pan powiedzieć, gdzie jest dworzec?", tr: "İstasyonun nerede olduğunu söyler misiniz?", id: "Bisakah Anda memberi tahu saya di mana stasiunnya?", vi: "Bạn có thể cho tôi biết nhà ga ở đâu không?" } }
          - level: B2
            point: { en: [{ term: do }, ", ", { term: does }, " and ", { term: did }, " drop"], uk: [{ term: "do" }, ", ", { term: "does" }, " і ", { term: "did" }, " зникають"], es: [{ term: "do" }, ", ", { term: "does" }, " y ", { term: "did" }, " desaparecen"], pt: [{ term: "do" }, ", ", { term: "does" }, " e ", { term: "did" }, " desaparecem"], fr: [{ term: "do" }, ", ", { term: "does" }, " et ", { term: "did" }, " disparaissent"], de: [{ term: "do" }, ", ", { term: "does" }, " und ", { term: "did" }, " entfallen"], it: [{ term: "do" }, ", ", { term: "does" }, " e ", { term: "did" }, " cadono"], pl: [{ term: "do" }, ", ", { term: "does" }, " i ", { term: "did" }, " znikają"], tr: [{ term: "do" }, ", ", { term: "does" }, " ve ", { term: "did" }, " düşer"], id: [{ term: "do" }, ", ", { term: "does" }, ", dan ", { term: "did" }, " hilang"], vi: [{ term: "do" }, ", ", { term: "does" }, " và ", { term: "did" }, " biến mất"] }
            direct: { ex: "What time does it start?", tr: { uk: "О котрій це починається?", es: "¿A qué hora empieza?", pt: "A que horas começa?", fr: "À quelle heure ça commence ?", de: "Wann fängt es an?", it: "A che ora comincia?", pl: "O której to się zaczyna?", tr: "Saat kaçta başlıyor?", id: "Jam berapa itu mulai?", vi: "Mấy giờ thì bắt đầu?" } }
            embedded: { ex: ["Do you know ", { target: "what time it starts" }, "?"], tr: { uk: "Ви знаєте, о котрій це починається?", es: "¿Sabes a qué hora empieza?", pt: "Você sabe a que horas começa?", fr: "Sais-tu à quelle heure ça commence ?", de: "Weißt du, wann es anfängt?", it: "Sai a che ora comincia?", pl: "Czy wiesz, o której to się zaczyna?", tr: "Saat kaçta başladığını biliyor musun?", id: "Apakah kamu tahu jam berapa itu mulai?", vi: "Bạn có biết mấy giờ thì bắt đầu không?" } }
          - level: B2
            point: { en: [{ term: if }, " or ", { term: whether }, " replaces the inversion"], uk: [{ term: "if" }, " або ", { term: "whether" }, " замінює зворотний порядок слів"], es: [{ term: "if" }, " o ", { term: "whether" }, " reemplaza la inversión"], pt: [{ term: "if" }, " ou ", { term: "whether" }, " substitui a inversão"], fr: [{ term: "if" }, " ou ", { term: "whether" }, " remplace l’inversion"], de: [{ term: "if" }, " oder ", { term: "whether" }, " ersetzt die Inversion"], it: [{ term: "if" }, " o ", { term: "whether" }, " sostituisce l'inversione"], pl: [{ term: "if" }, " lub ", { term: "whether" }, " zastępuje inwersję"], tr: [{ term: "if" }, " veya ", { term: "whether" }, " devrik sıranın yerini alır"], id: [{ term: "if" }, " atau ", { term: "whether" }, " menggantikan inversi"], vi: [{ term: "if" }, " hoặc ", { term: "whether" }, " thay cho đảo ngữ"] }
            direct: { ex: "Is she at home?", tr: { uk: "Вона вдома?", es: "¿Está ella en casa?", pt: "Ela está em casa?", fr: "Est-elle à la maison ?", de: "Ist sie zu Hause?", it: "È a casa?", pl: "Czy ona jest w domu?", tr: "O evde mi?", id: "Apakah dia ada di rumah?", vi: "Cô ấy có ở nhà không?" } }
            embedded: { ex: ["I wonder ", { target: "whether she is at home" }, "."], tr: { uk: "Цікаво, чи вона вдома.", es: "Me pregunto si ella está en casa.", pt: "Me pergunto se ela está em casa.", fr: "Je me demande si elle est à la maison.", de: "Ich frage mich, ob sie zu Hause ist.", it: "Mi chiedo se sia a casa.", pl: "Zastanawiam się, czy ona jest w domu.", tr: "Onun evde olup olmadığını merak ediyorum.", id: "Saya bertanya-tanya apakah dia ada di rumah.", vi: "Tôi tự hỏi liệu cô ấy có ở nhà không." } }
      - type: usage
        columns:
          - { key: use, label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: "A polite request for information", uk: "Ввічливе прохання про інформацію", es: "Una petición cortés de información", pt: "Um pedido educado de informação", fr: "Une demande polie de renseignement", de: "Eine höfliche Bitte um Auskunft", it: "Una richiesta cortese di informazioni", pl: "Uprzejma prośba o informację", tr: "Nazik bir bilgi isteği", id: "Permintaan informasi yang sopan", vi: "Một lời xin thông tin lịch sự" }, ex: [{ target: "Could you tell me" }, " how much this costs?"], tr: { uk: "Підкажіть, будь ласка, скільки це коштує?", es: "¿Podría decirme cuánto cuesta esto?", pt: "Você poderia me dizer quanto custa isto?", fr: "Pourriez-vous me dire combien ça coûte ?", de: "Könnten Sie mir sagen, was das kostet?", it: "Potrebbe dirmi quanto costa questo?", pl: "Czy mógłby mi pan powiedzieć, ile to kosztuje?", tr: "Bunun ne kadar olduğunu söyler misiniz?", id: "Bisakah Anda memberi tahu saya berapa harga ini?", vi: "Bạn có thể cho tôi biết cái này giá bao nhiêu không?" } }
          - { level: B2, use: { en: "A question to someone who may know", uk: "Питання до того, хто, можливо, знає", es: "Una pregunta a alguien que quizá lo sepa", pt: "Uma pergunta a alguém que talvez saiba", fr: "Une question à quelqu’un qui sait peut-être", de: "Eine Frage an jemanden, der es vielleicht weiß", it: "Una domanda a qualcuno che forse lo sa", pl: "Pytanie do kogoś, kto może wiedzieć", tr: "Bilebilecek birine sorulan soru", id: "Pertanyaan kepada orang yang mungkin tahu", vi: "Một câu hỏi dành cho người có thể biết" }, ex: [{ target: "Do you know" }, " who is coming?"], tr: { uk: "Ти знаєш, хто прийде?", es: "¿Sabes quién viene?", pt: "Você sabe quem vem?", fr: "Sais-tu qui vient ?", de: "Weißt du, wer kommt?", it: "Sai chi viene?", pl: "Czy wiesz, kto przyjdzie?", tr: "Kimin geleceğini biliyor musun?", id: "Apakah kamu tahu siapa yang akan datang?", vi: "Bạn có biết ai sẽ đến không?" } }
          - { level: B2, use: { en: "A doubt, or a question to yourself", uk: "Сумнів або питання до себе", es: "Una duda, o una pregunta que uno se hace a sí mismo", pt: "Uma dúvida, ou uma pergunta feita a si mesmo", fr: "Un doute, ou une question qu’on se pose à soi-même", de: "Ein Zweifel oder eine Frage an sich selbst", it: "Un dubbio, o una domanda a se stessi", pl: "Wątpliwość lub pytanie do samego siebie", tr: "Bir kuşku ya da kendine sorulan soru", id: "Keraguan, atau pertanyaan untuk diri sendiri", vi: "Một mối nghi ngờ, hoặc câu hỏi cho chính mình" }, ex: [{ target: "I wonder" }, " why she left."], tr: { uk: "Цікаво, чому вона пішла.", es: "Me pregunto por qué se fue.", pt: "Me pergunto por que ela foi embora.", fr: "Je me demande pourquoi elle est partie.", de: "Ich frage mich, warum sie gegangen ist.", it: "Mi chiedo perché se ne sia andata.", pl: "Zastanawiam się, dlaczego wyszła.", tr: "Neden gittiğini merak ediyorum.", id: "Saya bertanya-tanya mengapa dia pergi.", vi: "Tôi tự hỏi tại sao cô ấy đã đi." } }
          - { level: B2, use: { en: "Not knowing", uk: "Незнання", es: "No saber", pt: "Não saber", fr: "Ne pas savoir", de: "Nicht wissen", it: "Non sapere", pl: "Niewiedza", tr: "Bilmemek", id: "Tidak tahu", vi: "Không biết" }, ex: [{ target: "I have no idea" }, " when the shop opens."], tr: { uk: "Гадки не маю, коли відкривається магазин.", es: "No tengo idea de cuándo abre la tienda.", pt: "Não faço ideia de quando a loja abre.", fr: "Je ne sais pas du tout quand le magasin ouvre.", de: "Ich habe keine Ahnung, wann der Laden öffnet.", it: "Non ho idea di quando apra il negozio.", pl: "Nie mam pojęcia, kiedy otwierają sklep.", tr: "Dükkânın ne zaman açıldığı hakkında hiçbir fikrim yok.", id: "Saya tidak tahu kapan toko itu buka.", vi: "Tôi không biết khi nào cửa hàng mở cửa." } }

  - title: { en: "Wh-words with to", uk: "Питальні слова з to", es: "Palabras interrogativas con to", pt: "Palavras interrogativas com to", fr: "Mots interrogatifs avec to", de: "Fragewörter mit to", it: "Parole interrogative con to", pl: "Słowa pytające z to", tr: "to ile soru sözcükleri", id: "Kata tanya dengan to", vi: "Từ để hỏi với to" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: "Pattern", uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            form: { pattern: [{ slot: wh-word }, to, { slot: V }] }
            ex: { equivalence: [["I don't know ", { target: "what to do" }, "."], ["I don't know ", { target: "what I should do" }, "."]] }
            tr: { uk: { equivalence: ["Я не знаю, що робити.", "Я не знаю, що мені робити."] }, es: { equivalence: ["No sé qué hacer.", "No sé qué debo hacer."] }, pt: { equivalence: ["Não sei o que fazer.", "Não sei o que devo fazer."] }, fr: { equivalence: ["Je ne sais pas quoi faire.", "Je ne sais pas ce que je dois faire."] }, de: { equivalence: ["Ich weiß nicht, was zu tun ist.", "Ich weiß nicht, was ich tun soll."] }, it: { equivalence: ["Non so che cosa fare.", "Non so che cosa dovrei fare."] }, pl: { equivalence: ["Nie wiem, co robić.", "Nie wiem, co powinienem zrobić."] }, tr: { equivalence: ["Ne yapacağımı bilmiyorum.", "Ne yapmam gerektiğini bilmiyorum."] }, id: { equivalence: ["Saya tidak tahu harus berbuat apa.", "Saya tidak tahu apa yang harus saya lakukan."] }, vi: { equivalence: ["Tôi không biết phải làm gì.", "Tôi không biết mình nên làm gì."] } }
          - level: B2
            form: { pattern: [whether, to, { slot: V }] }
            ex: { equivalence: [["We can't decide ", { target: "whether to go" }, "."], ["We can't decide ", { target: "whether we should go" }, "."]] }
            tr: { uk: { equivalence: ["Ми не можемо вирішити, йти нам чи ні.", "Ми не можемо вирішити, чи варто нам іти."] }, es: { equivalence: ["No podemos decidir si ir.", "No podemos decidir si deberíamos ir."] }, pt: { equivalence: ["Não conseguimos decidir se vamos.", "Não conseguimos decidir se devemos ir."] }, fr: { equivalence: ["Nous ne pouvons pas décider d’y aller ou non.", "Nous ne pouvons pas décider si nous devons y aller."] }, de: { equivalence: ["Wir können uns nicht entscheiden, ob wir gehen.", "Wir können uns nicht entscheiden, ob wir gehen sollen."] }, it: { equivalence: ["Non riusciamo a decidere se andare.", "Non riusciamo a decidere se dovremmo andare."] }, pl: { equivalence: ["Nie możemy zdecydować, czy iść.", "Nie możemy zdecydować, czy powinniśmy iść."] }, tr: { equivalence: ["Gidip gitmeyeceğimize karar veremiyoruz.", "Gitmemiz gerekip gerekmediğine karar veremiyoruz."] }, id: { equivalence: ["Kami tidak bisa memutuskan apakah akan pergi.", "Kami tidak bisa memutuskan apakah kami harus pergi."] }, vi: { equivalence: ["Chúng tôi không thể quyết định có đi hay không.", "Chúng tôi không thể quyết định liệu mình có nên đi."] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The to-clause has no subject; the doer is the subject or the object of the main verb.", uk: "Конструкція з to не має підмета; виконавець дії — підмет або додаток головного дієслова.", es: "La construcción con to no tiene sujeto; quien hace la acción es el sujeto o el objeto del verbo principal.", pt: "A construção com to não tem sujeito; quem faz a ação é o sujeito ou o objeto do verbo principal.", fr: "La construction avec to n’a pas de sujet ; celui qui agit est le sujet ou le complément d’objet du verbe principal.", de: "Die to-Konstruktion hat kein Subjekt; wer handelt, ist das Subjekt oder das Objekt des Hauptverbs.", it: "La costruzione con to non ha soggetto; chi agisce è il soggetto o l'oggetto del verbo principale.", pl: "Konstrukcja z to nie ma podmiotu; wykonawcą czynności jest podmiot lub dopełnienie czasownika głównego.", tr: "to yapısının öznesi yoktur; eylemi yapan, ana fiilin öznesi veya nesnesidir.", id: "Konstruksi dengan to tidak punya subjek; pelakunya adalah subjek atau objek kata kerja utama.", vi: "Cấu trúc với to không có chủ ngữ; người thực hiện hành động là chủ ngữ hoặc tân ngữ của động từ chính." }
            ex: { examples: [["She doesn't know ", { target: "where to park" }, "."], ["He told me ", { target: "where to park" }, "."]] }
            tr: { uk: { examples: ["Вона не знає, де припаркуватися.", "Він сказав мені, де припаркуватися."] }, es: { examples: ["Ella no sabe dónde estacionar.", "Él me dijo dónde estacionar."] }, pt: { examples: ["Ela não sabe onde estacionar.", "Ele me disse onde estacionar."] }, fr: { examples: ["Elle ne sait pas où se garer.", "Il m’a dit où me garer."] }, de: { examples: ["Sie weiß nicht, wo sie parken soll.", "Er hat mir gesagt, wo ich parken soll."] }, it: { examples: ["Non sa dove parcheggiare.", "Mi ha detto dove parcheggiare."] }, pl: { examples: ["Ona nie wie, gdzie zaparkować.", "Powiedział mi, gdzie zaparkować."] }, tr: { examples: ["O, nereye park edeceğini bilmiyor.", "Bana nereye park edeceğimi söyledi."] }, id: { examples: ["Dia tidak tahu di mana harus parkir.", "Dia memberi tahu saya di mana harus parkir."] }, vi: { examples: ["Cô ấy không biết đỗ xe ở đâu.", "Anh ấy nói cho tôi biết đỗ xe ở đâu."] } }
          - type: note
            level: B2
            text: { en: ["The verbs that take these phrases are listed in ", { link: "Gerund vs Infinitive", to: en.verbs.gerund-vs-infinitive }, "."], uk: ["Дієслова, після яких вживаються такі звороти, наведено в темі ", { link: "Герундій чи інфінітив", to: "en.verbs.gerund-vs-infinitive" }, "."], es: ["Los verbos que llevan estas construcciones están en ", { link: "Gerundio o infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], pt: ["Os verbos que levam essas construções estão em ", { link: "Gerúndio ou infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], fr: ["Les verbes qui prennent ces constructions sont listés dans ", { link: "Forme en -ing ou infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], de: ["Die Verben, die diese Wendungen nehmen, stehen in ", { link: "Gerund oder Infinitiv", to: "en.verbs.gerund-vs-infinitive" }, "."], it: ["I verbi che reggono queste costruzioni sono elencati in ", { link: "Gerundio o infinito", to: "en.verbs.gerund-vs-infinitive" }, "."], pl: ["Czasowniki, po których stoją takie wyrażenia, wymienia temat ", { link: "Gerund czy bezokolicznik", to: "en.verbs.gerund-vs-infinitive" }, "."], tr: ["Bu kalıpları alan fiiller ", { link: "Gerund mu, mastar mı", to: "en.verbs.gerund-vs-infinitive" }, " konusunda listelenmiştir."], id: ["Kata kerja yang memakai konstruksi ini terdaftar di ", { link: "Gerund atau infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], vi: ["Các động từ đi với những cấu trúc này được liệt kê trong ", { link: "Danh động từ hay động từ nguyên mẫu", to: "en.verbs.gerund-vs-infinitive" }, "."] }

  - title: { en: "Compare: if and whether", uk: "Порівняння: if і whether", es: "Comparación: if y whether", pt: "Comparação: if e whether", fr: "Comparaison : if et whether", de: "Vergleich: if und whether", it: "Confronto: if e whether", pl: "Porównanie: if i whether", tr: "Karşılaştırma: if ve whether", id: "Perbandingan: if dan whether", vi: "So sánh: if và whether" }
