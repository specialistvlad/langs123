title: { en: "Noun Clauses", uk: "Іменникові підрядні речення", es: "Las oraciones subordinadas sustantivas", pt: "As orações subordinadas substantivas", fr: "Les propositions nominales", de: "Nebensätze in Nomenfunktion", it: "Le proposizioni completive", pl: "Zdania rzeczownikowe", tr: "İsim cümlecikleri", id: "Klausa nomina", vi: "Mệnh đề danh từ" }
summary:
  lead:
    en: ["Noun clauses work as a subject, object or complement and open with ", { term: that }, ", a wh-word, ", { term: if }, " or ", { term: whether }, "."]
    uk: ["Іменникові підрядні речення виконують роль підмета, додатка або доповнення й починаються з ", { term: "that" }, ", питального слова, ", { term: "if" }, " або ", { term: "whether" }, "."]
    es: ["Las oraciones sustantivas funcionan como sujeto, objeto o complemento y empiezan con ", { term: "that" }, ", una palabra interrogativa, ", { term: "if" }, " o ", { term: "whether" }, "."]
    pt: ["As orações substantivas funcionam como sujeito, objeto ou complemento e começam com ", { term: "that" }, ", uma palavra interrogativa, ", { term: "if" }, " ou ", { term: "whether" }, "."]
    fr: ["Les propositions nominales font fonction de sujet, de complément ou d’attribut et s’ouvrent par ", { term: "that" }, ", un mot interrogatif, ", { term: "if" }, " ou ", { term: "whether" }, "."]
    de: ["Nebensätze in Nomenfunktion stehen als Subjekt, Objekt oder Prädikativ und beginnen mit ", { term: "that" }, ", einem Fragewort, ", { term: "if" }, " oder ", { term: "whether" }, "."]
    it: ["Le proposizioni completive funzionano da soggetto, oggetto o predicativo e iniziano con ", { term: "that" }, ", una parola interrogativa, ", { term: "if" }, " o ", { term: "whether" }, "."]
    pl: ["Zdania rzeczownikowe pełnią funkcję podmiotu, dopełnienia lub uzupełnienia i zaczynają się od ", { term: "that" }, ", słowa pytającego, ", { term: "if" }, " lub ", { term: "whether" }, "."]
    tr: ["İsim cümlecikleri özne, nesne veya tümleç görevi görür; ", { term: "that" }, ", bir soru sözcüğü, ", { term: "if" }, " ya da ", { term: "whether" }, " ile başlar."]
    id: ["Klausa nomina berfungsi sebagai subjek, objek, atau pelengkap dan diawali ", { term: "that" }, ", kata tanya, ", { term: "if" }, ", atau ", { term: "whether" }, "."]
    vi: ["Mệnh đề danh từ làm chủ ngữ, tân ngữ hoặc bổ ngữ và mở đầu bằng ", { term: "that" }, ", từ để hỏi, ", { term: "if" }, " hoặc ", { term: "whether" }, "."]
  rule:
    en: "Inside a noun clause the subject comes before the verb, as in a statement:"
    uk: "В іменниковому підрядному реченні підмет стоїть перед дієсловом, як у розповідному реченні:"
    es: "Dentro de una oración sustantiva el sujeto va antes del verbo, como en una afirmación:"
    pt: "Dentro de uma oração substantiva o sujeito vem antes do verbo, como em uma afirmação:"
    fr: "Dans une proposition nominale, le sujet se place avant le verbe, comme dans une phrase affirmative :"
    de: "Im Nebensatz in Nomenfunktion steht das Subjekt vor dem Verb, wie im Aussagesatz:"
    it: "In una proposizione completiva il soggetto sta prima del verbo, come in una frase affermativa:"
    pl: "W zdaniu rzeczownikowym podmiot stoi przed czasownikiem, tak jak w zdaniu oznajmującym:"
    tr: "İsim cümleciğinde özne, düz cümledeki gibi fiilden önce gelir:"
    id: "Dalam klausa nomina, subjek berada sebelum kata kerja, seperti dalam kalimat pernyataan:"
    vi: "Trong mệnh đề danh từ, chủ ngữ đứng trước động từ, như trong câu trần thuật:"
  ex:
    examples:
      - ["I know ", { target: "where she lives" }, "."]
      - ["Tell me ", { target: "what you want" }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: "Point", uk: "Аспект", es: "Aspecto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { en: "That-clause", uk: "Речення з that", es: "Oración con that", pt: "Oração com that", fr: "Proposition avec that", de: "that-Satz", it: "Proposizione con that", pl: "Zdanie z that", tr: "that cümleciği", id: "Klausa that", vi: "Mệnh đề that" }
          rule: { en: [{ pattern: [{ term: that }, { slot: subject }, { slot: verb }] }, "; ", { term: that }, " drops after common verbs"], uk: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " опускається після поширених дієслів"], es: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " se omite después de verbos comunes"], pt: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " é omitido depois de verbos comuns"], fr: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, " ; ", { term: "that" }, " s’omet après les verbes courants"], de: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " entfällt nach gängigen Verben"], it: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " si omette dopo i verbi comuni"], pl: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " można pominąć po częstych czasownikach"], tr: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, ", yaygın fiillerden sonra düşer"], id: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " dihilangkan setelah kata kerja umum"], vi: [{ pattern: [{ term: "that" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "that" }, " được lược bỏ sau các động từ thông dụng"] }
          ex: ["I know ", { target: [{ optional: that }, " he left"] }, "."]
          tr: { uk: "Я знаю, що він пішов.", es: "Sé que se fue.", pt: "Sei que ele foi embora.", fr: "Je sais qu’il est parti.", de: "Ich weiß, dass er gegangen ist.", it: "So che è partito.", pl: "Wiem, że wyszedł.", tr: "Onun gittiğini biliyorum.", id: "Saya tahu bahwa dia sudah pergi.", vi: "Tôi biết là anh ấy đã đi rồi." }
        - level: B2
          point: { en: "Wh-clause", uk: "Речення з wh-", es: "Oración con wh-", pt: "Oração com wh-", fr: "Proposition avec wh-", de: "wh-Satz", it: "Proposizione con wh-", pl: "Zdanie z wh-", tr: "wh- cümleciği", id: "Klausa wh-", vi: "Mệnh đề wh-" }
          rule: { en: [{ pattern: [{ slot: wh-word }, { slot: subject }, { slot: verb }] }, "; no ", { term: do }, ", ", { term: does }, " or ", { term: did }], uk: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; без ", { term: "do" }, ", ", { term: "does" }, " чи ", { term: "did" }], es: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; sin ", { term: "do" }, ", ", { term: "does" }, " ni ", { term: "did" }], pt: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; sem ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }], fr: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, " ; sans ", { term: "do" }, ", ", { term: "does" }, " ni ", { term: "did" }], de: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; kein ", { term: "do" }, ", ", { term: "does" }, " oder ", { term: "did" }], it: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; senza ", { term: "do" }, ", ", { term: "does" }, " o ", { term: "did" }], pl: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; bez ", { term: "do" }, ", ", { term: "does" }, " i ", { term: "did" }], tr: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; ", { term: "do" }, ", ", { term: "does" }, " ya da ", { term: "did" }, " kullanılmaz"], id: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; tanpa ", { term: "do" }, ", ", { term: "does" }, ", atau ", { term: "did" }], vi: [{ pattern: [{ slot: "wh-word" }, { slot: "subject" }, { slot: "verb" }] }, "; không có ", { term: "do" }, ", ", { term: "does" }, " hay ", { term: "did" }] }
          ex: ["Tell me ", { target: "where he lives" }, "."]
          tr: { uk: "Скажи мені, де він живе.", es: "Dime dónde vive.", pt: "Me diga onde ele mora.", fr: "Dis-moi où il habite.", de: "Sag mir, wo er wohnt.", it: "Dimmi dove abita.", pl: "Powiedz mi, gdzie mieszka.", tr: "Bana nerede yaşadığını söyle.", id: "Beri tahu saya di mana dia tinggal.", vi: "Hãy cho tôi biết anh ấy sống ở đâu." }
        - level: B2
          point: { en: "If and whether", uk: "If і whether", es: "If y whether", pt: "If e whether", fr: "If et whether", de: "If und whether", it: "If e whether", pl: "If i whether", tr: "If ve whether", id: "If dan whether", vi: "If và whether" }
          rule: { en: [{ term: if }, " or ", { term: whether }, " after ask and wonder; ", { term: whether }, " after a preposition or ", { term: to }], uk: [{ term: "if" }, " або ", { term: "whether" }, " після ask і wonder; ", { term: "whether" }, " після прийменника або ", { term: "to" }], es: [{ term: "if" }, " o ", { term: "whether" }, " después de ask y wonder; ", { term: "whether" }, " después de una preposición o de ", { term: "to" }], pt: [{ term: "if" }, " ou ", { term: "whether" }, " depois de ask e wonder; ", { term: "whether" }, " depois de uma preposição ou de ", { term: "to" }], fr: [{ term: "if" }, " ou ", { term: "whether" }, " après ask et wonder ; ", { term: "whether" }, " après une préposition ou ", { term: "to" }], de: [{ term: "if" }, " oder ", { term: "whether" }, " nach ask und wonder; ", { term: "whether" }, " nach einer Präposition oder ", { term: "to" }], it: [{ term: "if" }, " o ", { term: "whether" }, " dopo ask e wonder; ", { term: "whether" }, " dopo una preposizione o ", { term: "to" }], pl: [{ term: "if" }, " lub ", { term: "whether" }, " po ask i wonder; ", { term: "whether" }, " po przyimku lub przed ", { term: "to" }], tr: ["ask ve wonder sonrasında ", { term: "if" }, " veya ", { term: "whether" }, "; edat ya da ", { term: "to" }, " sonrasında ", { term: "whether" }], id: [{ term: "if" }, " atau ", { term: "whether" }, " setelah ask dan wonder; ", { term: "whether" }, " setelah kata depan atau ", { term: "to" }], vi: [{ term: "if" }, " hoặc ", { term: "whether" }, " sau ask và wonder; ", { term: "whether" }, " sau giới từ hoặc ", { term: "to" }] }
          ex: ["I wonder ", { target: "whether she knows" }, "."]
          tr: { uk: "Цікаво, чи вона знає.", es: "Me pregunto si ella lo sabe.", pt: "Me pergunto se ela sabe.", fr: "Je me demande si elle sait.", de: "Ich frage mich, ob sie es weiß.", it: "Mi chiedo se lei lo sa.", pl: "Zastanawiam się, czy ona wie.", tr: "Onun bilip bilmediğini merak ediyorum.", id: "Saya bertanya-tanya apakah dia tahu.", vi: "Tôi tự hỏi liệu cô ấy có biết không." }
        - level: B2
          point: { en: "Wh-word and to", uk: "Питальне слово і to", es: "Palabra interrogativa y to", pt: "Palavra interrogativa e to", fr: "Mot interrogatif et to", de: "Fragewort und to", it: "Parola interrogativa e to", pl: "Słowo pytające i to", tr: "Soru sözcüğü ve to", id: "Kata tanya dan to", vi: "Từ để hỏi và to" }
          rule: { en: { pattern: [{ slot: wh-word }, to, { slot: V }] }, uk: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, es: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, pt: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, fr: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, de: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, it: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, pl: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, tr: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, id: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] }, vi: { pattern: [{ slot: "wh-word" }, "to", { slot: "V" }] } }
          ex: ["I don't know ", { target: "what to do" }, "."]
          tr: { uk: "Я не знаю, що робити.", es: "No sé qué hacer.", pt: "Não sei o que fazer.", fr: "Je ne sais pas quoi faire.", de: "Ich weiß nicht, was ich tun soll.", it: "Non so che cosa fare.", pl: "Nie wiem, co robić.", tr: "Ne yapacağımı bilmiyorum.", id: "Saya tidak tahu harus berbuat apa.", vi: "Tôi không biết phải làm gì." }
        - level: B2
          point: { en: "Embedded question", uk: "Непряме питання", es: "Pregunta indirecta", pt: "Pergunta indireta", fr: "Question indirecte", de: "Indirekte Frage", it: "Domanda indiretta", pl: "Pytanie zależne", tr: "Dolaylı soru", id: "Pertanyaan tak langsung", vi: "Câu hỏi gián tiếp" }
          rule: { en: ["a polite question starts ", { term: "Could you tell me" }, " and keeps statement order"], uk: ["ввічливе питання починається з ", { term: "Could you tell me" }, " і має порядок слів розповідного речення"], es: ["una pregunta cortés empieza con ", { term: "Could you tell me" }, " y mantiene el orden de una afirmación"], pt: ["uma pergunta educada começa com ", { term: "Could you tell me" }, " e mantém a ordem de uma afirmação"], fr: ["une question polie commence par ", { term: "Could you tell me" }, " et garde l’ordre d’une phrase affirmative"], de: ["eine höfliche Frage beginnt mit ", { term: "Could you tell me" }, " und behält die Wortstellung des Aussagesatzes"], it: ["una domanda cortese inizia con ", { term: "Could you tell me" }, " e mantiene l'ordine della frase affermativa"], pl: ["uprzejme pytanie zaczyna się od ", { term: "Could you tell me" }, " i ma szyk zdania oznajmującego"], tr: ["nazik bir soru ", { term: "Could you tell me" }, " ile başlar ve düz cümle sırasını korur"], id: ["pertanyaan sopan dimulai dengan ", { term: "Could you tell me" }, " dan memakai urutan kalimat pernyataan"], vi: ["câu hỏi lịch sự bắt đầu bằng ", { term: "Could you tell me" }, " và giữ trật tự như câu trần thuật"] }
          ex: [{ target: "Could you tell me" }, " where the station is?"]
          tr: { uk: "Підкажіть, будь ласка, де станція?", es: "¿Podría decirme dónde está la estación?", pt: "Você poderia me dizer onde fica a estação?", fr: "Pourriez-vous me dire où se trouve la gare ?", de: "Könnten Sie mir sagen, wo der Bahnhof ist?", it: "Potrebbe dirmi dov'è la stazione?", pl: "Czy mógłby mi pan powiedzieć, gdzie jest dworzec?", tr: "İstasyonun nerede olduğunu söyler misiniz?", id: "Bisakah Anda memberi tahu saya di mana stasiunnya?", vi: "Bạn có thể cho tôi biết nhà ga ở đâu không?" }
        - level: B2
          point: { en: "-ever words", uk: "Слова на -ever", es: "Palabras en -ever", pt: "Palavras em -ever", fr: "Les mots en -ever", de: "Wörter auf -ever", it: "Parole in -ever", pl: "Słowa z końcówką -ever", tr: "-ever ile biten sözcükler", id: "Kata berakhiran -ever", vi: "Các từ có đuôi -ever" }
          rule: { en: ["words in ", { term: "-ever" }, " mean any person, thing, time, place or way that"], uk: ["слова на ", { term: "-ever" }, " означають «будь-який»: хто, що, коли, де, як завгодно"], es: ["las palabras en ", { term: "-ever" }, " significan cualquier persona, cosa, momento, lugar o manera que"], pt: ["as palavras em ", { term: "-ever" }, " significam qualquer pessoa, coisa, momento, lugar ou modo que"], fr: ["les mots en ", { term: "-ever" }, " signifient « n’importe qui, quoi, quand, où ou comment »"], de: ["Wörter auf ", { term: "-ever" }, " bedeuten: egal wer, was, wann, wo oder wie"], it: ["le parole in ", { term: "-ever" }, " significano qualunque persona, cosa, momento, luogo o modo che"], pl: ["słowa z końcówką ", { term: "-ever" }, " znaczą: ktokolwiek, cokolwiek, kiedykolwiek, gdziekolwiek, jakkolwiek"], tr: [{ term: "-ever" }, " ile biten sözcükler herhangi bir kişi, şey, zaman, yer veya yol anlamına gelir"], id: ["kata berakhiran ", { term: "-ever" }, " berarti orang, benda, waktu, tempat, atau cara apa pun"], vi: ["các từ có đuôi ", { term: "-ever" }, " nghĩa là bất kỳ người, vật, lúc, nơi hay cách nào"] }
          ex: ["Take ", { target: "whatever you like" }, "."]
          tr: { uk: "Бери все, що тобі подобається.", es: "Toma lo que quieras.", pt: "Pegue o que você quiser.", fr: "Prends ce qui te plaît.", de: "Nimm, was du willst.", it: "Prendi quello che ti piace.", pl: "Weź, co chcesz.", tr: "Ne istersen al.", id: "Ambil apa pun yang kamu suka.", vi: "Cứ lấy bất cứ thứ gì bạn thích." }
        - level: B2
          point: { en: "Exclamation", uk: "Оклик", es: "Exclamación", pt: "Exclamação", fr: "Exclamation", de: "Ausruf", it: "Esclamazione", pl: "Wykrzyknienie", tr: "Ünlem", id: "Seruan", vi: "Câu cảm thán" }
          rule: { en: [{ term: what }, " or ", { term: how }, " opens it; the subject comes before the verb"], uk: ["його починає ", { term: "what" }, " або ", { term: "how" }, "; підмет стоїть перед дієсловом"], es: ["la abre ", { term: "what" }, " o ", { term: "how" }, "; el sujeto va antes del verbo"], pt: ["começa com ", { term: "what" }, " ou ", { term: "how" }, "; o sujeito vem antes do verbo"], fr: ["elle s’ouvre par ", { term: "what" }, " ou ", { term: "how" }, " ; le sujet se place avant le verbe"], de: ["er beginnt mit ", { term: "what" }, " oder ", { term: "how" }, "; das Subjekt steht vor dem Verb"], it: ["la apre ", { term: "what" }, " o ", { term: "how" }, "; il soggetto sta prima del verbo"], pl: ["zaczyna się od ", { term: "what" }, " lub ", { term: "how" }, "; podmiot stoi przed czasownikiem"], tr: [{ term: "what" }, " veya ", { term: "how" }, " ile açılır; özne fiilden önce gelir"], id: ["diawali ", { term: "what" }, " atau ", { term: "how" }, "; subjek berada sebelum kata kerja"], vi: ["mở đầu bằng ", { term: "what" }, " hoặc ", { term: "how" }, "; chủ ngữ đứng trước động từ"] }
          ex: ["I can't believe ", { target: "how beautiful it is" }, "."]
          tr: { uk: "Не віриться, наскільки це гарно.", es: "No puedo creer lo hermoso que es.", pt: "Não consigo acreditar como isso é bonito.", fr: "Je n’arrive pas à croire à quel point c’est beau.", de: "Ich kann nicht glauben, wie schön es ist.", it: "Non riesco a credere quanto sia bello.", pl: "Nie mogę uwierzyć, jakie to piękne.", tr: "Ne kadar güzel olduğuna inanamıyorum.", id: "Saya tidak percaya betapa indahnya itu.", vi: "Tôi không thể tin nó đẹp đến thế." }
        - level: C1
          point: { en: "Noun and clause", uk: "Іменник і речення", es: "Sustantivo y oración", pt: "Substantivo e oração", fr: "Nom et proposition", de: "Nomen und Nebensatz", it: "Sostantivo e proposizione", pl: "Rzeczownik i zdanie", tr: "İsim ve cümlecik", id: "Kata benda dan klausa", vi: "Danh từ và mệnh đề" }
          rule: { en: ["the noun names what the clause says: ", { term: "the fact that" }, ", ", { term: "the question whether" }], uk: ["іменник називає зміст речення: ", { term: "the fact that" }, ", ", { term: "the question whether" }], es: ["el sustantivo dice qué expresa la oración: ", { term: "the fact that" }, ", ", { term: "the question whether" }], pt: ["o substantivo diz o que a oração expressa: ", { term: "the fact that" }, ", ", { term: "the question whether" }], fr: ["le nom dit ce qu’exprime la proposition : ", { term: "the fact that" }, ", ", { term: "the question whether" }], de: ["das Nomen nennt, was der Nebensatz sagt: ", { term: "the fact that" }, ", ", { term: "the question whether" }], it: ["il sostantivo dice che cosa esprime la proposizione: ", { term: "the fact that" }, ", ", { term: "the question whether" }], pl: ["rzeczownik nazywa treść zdania: ", { term: "the fact that" }, ", ", { term: "the question whether" }], tr: ["isim, cümleciğin ne söylediğini adlandırır: ", { term: "the fact that" }, ", ", { term: "the question whether" }], id: ["kata benda menyebut isi klausa: ", { term: "the fact that" }, ", ", { term: "the question whether" }], vi: ["danh từ nêu nội dung của mệnh đề: ", { term: "the fact that" }, ", ", { term: "the question whether" }] }
          ex: [{ target: "Despite the fact that" }, " it was late, we stayed."]
          tr: { uk: "Хоча було пізно, ми залишилися.", es: "Aunque era tarde, nos quedamos.", pt: "Apesar de ser tarde, ficamos.", fr: "Même s’il était tard, nous sommes restés.", de: "Obwohl es spät war, blieben wir.", it: "Anche se era tardi, siamo rimasti.", pl: "Chociaż było późno, zostaliśmy.", tr: "Geç olmasına rağmen kaldık.", id: "Meskipun sudah larut, kami tetap tinggal.", vi: "Dù đã muộn, chúng tôi vẫn ở lại." }
        - level: C1
          point: { en: "After be", uk: "Після be", es: "Después de be", pt: "Depois de be", fr: "Après be", de: "Nach be", it: "Dopo be", pl: "Po be", tr: "be sonrası", id: "Setelah be", vi: "Sau be" }
          rule: { en: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + clause"], uk: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + речення"], es: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + oración"], pt: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + oração"], fr: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + proposition"], de: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + Nebensatz"], it: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + proposizione"], pl: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + zdanie"], tr: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + cümlecik"], id: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + klausa"], vi: [{ term: "The problem is" }, ", ", { term: "This is why" }, ", ", { term: "That's what" }, " + mệnh đề"] }
          ex: ["The problem is ", { target: "where to park" }, "."]
          tr: { uk: "Проблема в тому, де припаркуватися.", es: "El problema es dónde estacionar.", pt: "O problema é onde estacionar.", fr: "Le problème, c’est où se garer.", de: "Das Problem ist, wo man parken soll.", it: "Il problema è dove parcheggiare.", pl: "Problem w tym, gdzie zaparkować.", tr: "Sorun nereye park edeceğimiz.", id: "Masalahnya adalah di mana harus parkir.", vi: "Vấn đề là đỗ xe ở đâu." }
        - level: C1
          point: { en: "After a preposition", uk: "Після прийменника", es: "Después de una preposición", pt: "Depois de uma preposição", fr: "Après une préposition", de: "Nach einer Präposition", it: "Dopo una preposizione", pl: "Po przyimku", tr: "Edat sonrası", id: "Setelah kata depan", vi: "Sau giới từ" }
          rule: { en: ["a wh-word or ", { term: whether }, " follows; before ", { term: that }, " the preposition drops"], uk: ["далі йде питальне слово або ", { term: "whether" }, "; перед ", { term: "that" }, " прийменник опускається"], es: ["sigue una palabra interrogativa o ", { term: "whether" }, "; antes de ", { term: "that" }, " se omite la preposición"], pt: ["vem uma palavra interrogativa ou ", { term: "whether" }, "; antes de ", { term: "that" }, " a preposição some"], fr: ["un mot interrogatif ou ", { term: "whether" }, " suit ; devant ", { term: "that" }, ", la préposition tombe"], de: ["ein Fragewort oder ", { term: "whether" }, " folgt; vor ", { term: "that" }, " entfällt die Präposition"], it: ["segue una parola interrogativa o ", { term: "whether" }, "; davanti a ", { term: "that" }, " la preposizione cade"], pl: ["następuje słowo pytające lub ", { term: "whether" }, "; przed ", { term: "that" }, " przyimek znika"], tr: ["soru sözcüğü veya ", { term: "whether" }, " gelir; ", { term: "that" }, " öncesinde edat düşer"], id: ["diikuti kata tanya atau ", { term: "whether" }, "; sebelum ", { term: "that" }, " kata depan dihilangkan"], vi: ["theo sau là từ để hỏi hoặc ", { term: "whether" }, "; trước ", { term: "that" }, " giới từ bị lược bỏ"] }
          ex: ["It depends on ", { target: "whether we can park" }, "."]
          tr: { uk: "Це залежить від того, чи зможемо ми припаркуватися.", es: "Depende de si podemos estacionar.", pt: "Depende de conseguirmos estacionar.", fr: "Cela dépend si nous pouvons nous garer.", de: "Es hängt davon ab, ob wir parken können.", it: "Dipende se riusciamo a parcheggiare.", pl: "To zależy od tego, czy będziemy mogli zaparkować.", tr: "Park edip edemeyeceğimize bağlı.", id: "Itu tergantung apakah kita bisa parkir.", vi: "Điều đó tùy thuộc vào việc chúng ta có đỗ xe được không." }
        - level: C1
          point: { en: "Verbs of demand", uk: "Дієслова вимоги", es: "Verbos de exigencia", pt: "Verbos de exigência", fr: "Verbes d’exigence", de: "Verben der Forderung", it: "Verbi di richiesta", pl: "Czasowniki żądania", tr: "İstek bildiren fiiller", id: "Kata kerja tuntutan", vi: "Động từ chỉ yêu cầu" }
          rule: { en: [{ pattern: [{ alternatives: [insist, demand, recommend] }, that, { slot: subject }, { slot: base verb }] }, "; British English often adds ", { term: should }], uk: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; у британській англійській часто додають ", { term: "should" }], es: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; el inglés británico suele añadir ", { term: "should" }], pt: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; o inglês britânico costuma acrescentar ", { term: "should" }], fr: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, " ; l’anglais britannique ajoute souvent ", { term: "should" }], de: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; britisches Englisch ergänzt oft ", { term: "should" }], it: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; l'inglese britannico spesso aggiunge ", { term: "should" }], pl: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; brytyjski angielski często dodaje ", { term: "should" }], tr: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; İngiliz İngilizcesi çoğu zaman ", { term: "should" }, " ekler"], id: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; bahasa Inggris Britania sering menambahkan ", { term: "should" }], vi: [{ pattern: [{ alternatives: ["insist", "demand", "recommend"] }, "that", { slot: "subject" }, { slot: "base verb" }] }, "; tiếng Anh Anh thường thêm ", { term: "should" }] }
          ex: ["She recommends ", { target: "that he rest" }, "."]
          tr: { uk: "Вона радить, щоб він відпочив.", es: "Ella recomienda que él descanse.", pt: "Ela recomenda que ele descanse.", fr: "Elle recommande qu’il se repose.", de: "Sie empfiehlt, dass er sich ausruht.", it: "Raccomanda che lui si riposi.", pl: "Ona zaleca, żeby odpoczął.", tr: "Onun dinlenmesini öneriyor.", id: "Dia menyarankan agar dia beristirahat.", vi: "Cô ấy khuyên anh ấy nên nghỉ ngơi." }
        - level: B2
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: ["a noun clause keeps statement order, with no ", { term: do }], uk: ["іменникове підрядне речення має порядок слів розповідного, без ", { term: "do" }], es: ["una oración sustantiva mantiene el orden de una afirmación, sin ", { term: "do" }], pt: ["uma oração substantiva mantém a ordem de uma afirmação, sem ", { term: "do" }], fr: ["une proposition nominale garde l’ordre d’une phrase affirmative, sans ", { term: "do" }], de: ["ein Nebensatz in Nomenfunktion behält die Wortstellung des Aussagesatzes, ohne ", { term: "do" }], it: ["una proposizione completiva mantiene l'ordine della frase affermativa, senza ", { term: "do" }], pl: ["zdanie rzeczownikowe ma szyk zdania oznajmującego, bez ", { term: "do" }], tr: ["isim cümleciği düz cümle sırasını korur, ", { term: "do" }, " kullanılmaz"], id: ["klausa nomina memakai urutan kalimat pernyataan, tanpa ", { term: "do" }], vi: ["mệnh đề danh từ giữ trật tự như câu trần thuật, không có ", { term: "do" }] }
          ex: ["I don't know ", { target: "where the station is" }, "."]
          tr: { uk: "Я не знаю, де станція.", es: "No sé dónde está la estación.", pt: "Não sei onde fica a estação.", fr: "Je ne sais pas où est la gare.", de: "Ich weiß nicht, wo der Bahnhof ist.", it: "Non so dov'è la stazione.", pl: "Nie wiem, gdzie jest dworzec.", tr: "İstasyonun nerede olduğunu bilmiyorum.", id: "Saya tidak tahu di mana stasiunnya.", vi: "Tôi không biết nhà ga ở đâu." }

sections:
  - title: { en: "Overview", uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: usage
        columns:
          - { key: use, label: { en: "Function", uk: "Функція", es: "Función", pt: "Função", fr: "Fonction", de: "Funktion", it: "Funzione", pl: "Funkcja", tr: "İşlev", id: "Fungsi", vi: "Chức năng" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: "Subject", uk: "Підмет", es: "Sujeto", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }, ex: [{ target: "What she said" }, " surprised me."], tr: { uk: "Те, що вона сказала, мене здивувало.", es: "Lo que dijo me sorprendió.", pt: "O que ela disse me surpreendeu.", fr: "Ce qu’elle a dit m’a surpris.", de: "Was sie gesagt hat, hat mich überrascht.", it: "Quello che ha detto mi ha sorpreso.", pl: "To, co powiedziała, mnie zaskoczyło.", tr: "Söylediği şey beni şaşırttı.", id: "Apa yang dia katakan mengejutkan saya.", vi: "Điều cô ấy nói làm tôi ngạc nhiên." } }
          - { level: B2, use: { en: "Object", uk: "Додаток", es: "Objeto", pt: "Objeto", fr: "Complément d’objet", de: "Objekt", it: "Oggetto", pl: "Dopełnienie", tr: "Nesne", id: "Objek", vi: "Tân ngữ" }, ex: ["I know ", { target: "that he left" }, "."], tr: { uk: "Я знаю, що він пішов.", es: "Sé que se fue.", pt: "Sei que ele foi embora.", fr: "Je sais qu’il est parti.", de: "Ich weiß, dass er gegangen ist.", it: "So che è partito.", pl: "Wiem, że wyszedł.", tr: "Onun gittiğini biliyorum.", id: "Saya tahu bahwa dia sudah pergi.", vi: "Tôi biết là anh ấy đã đi rồi." } }
          - { level: B2, use: { en: "Complement", uk: "Доповнення", es: "Complemento", pt: "Complemento", fr: "Attribut", de: "Prädikativ", it: "Predicativo", pl: "Uzupełnienie", tr: "Tümleç", id: "Pelengkap", vi: "Bổ ngữ" }, ex: ["The problem is ", { target: "that we have no money" }, "."], tr: { uk: "Проблема в тому, що в нас немає грошей.", es: "El problema es que no tenemos dinero.", pt: "O problema é que não temos dinheiro.", fr: "Le problème, c’est que nous n’avons pas d’argent.", de: "Das Problem ist, dass wir kein Geld haben.", it: "Il problema è che non abbiamo soldi.", pl: "Problem w tym, że nie mamy pieniędzy.", tr: "Sorun, hiç paramızın olmaması.", id: "Masalahnya adalah kami tidak punya uang.", vi: "Vấn đề là chúng tôi không có tiền." } }
          - { level: B2, use: { en: "After a preposition", uk: "Після прийменника", es: "Después de una preposición", pt: "Depois de uma preposição", fr: "Après une préposition", de: "Nach einer Präposition", it: "Dopo una preposizione", pl: "Po przyimku", tr: "Edat sonrası", id: "Setelah kata depan", vi: "Sau giới từ" }, ex: ["I'm interested in ", { target: "what you think" }, "."], tr: { uk: "Мене цікавить, що ти думаєш.", es: "Me interesa lo que piensas.", pt: "Me interessa o que você pensa.", fr: "Ce que tu penses m’intéresse.", de: "Mich interessiert, was du denkst.", it: "Mi interessa quello che pensi.", pl: "Interesuje mnie, co myślisz.", tr: "Ne düşündüğünle ilgileniyorum.", id: "Saya tertarik pada apa yang kamu pikirkan.", vi: "Tôi quan tâm đến điều bạn nghĩ." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A noun clause has its own subject and verb and does the work of a noun phrase.", uk: "Іменникове підрядне речення має власний підмет і дієслово та виконує роль іменникової групи.", es: "Una oración sustantiva tiene su propio sujeto y verbo y cumple la función de un sintagma nominal.", pt: "Uma oração substantiva tem sujeito e verbo próprios e faz o trabalho de um sintagma nominal.", fr: "Une proposition nominale a son propre sujet et son propre verbe, et joue le rôle d’un groupe nominal.", de: "Ein Nebensatz in Nomenfunktion hat ein eigenes Subjekt und Verb und übernimmt die Aufgabe einer Nominalphrase.", it: "Una proposizione completiva ha un soggetto e un verbo propri e svolge il lavoro di un sintagma nominale.", pl: "Zdanie rzeczownikowe ma własny podmiot i czasownik i pełni funkcję grupy rzeczownikowej.", tr: "İsim cümleciğinin kendi öznesi ve fiili vardır ve bir isim öbeğinin işini görür.", id: "Klausa nomina punya subjek dan kata kerja sendiri serta berfungsi seperti frasa nomina.", vi: "Mệnh đề danh từ có chủ ngữ và động từ riêng, và làm việc của một cụm danh từ." }
            ex: { examples: [["I know ", { target: "the answer" }, "."], ["I know ", { target: "what she said" }, "."]] }
            tr: { uk: { examples: ["Я знаю відповідь.", "Я знаю, що вона сказала."] }, es: { examples: ["Sé la respuesta.", "Sé lo que dijo."] }, pt: { examples: ["Sei a resposta.", "Sei o que ela disse."] }, fr: { examples: ["Je connais la réponse.", "Je sais ce qu’elle a dit."] }, de: { examples: ["Ich kenne die Antwort.", "Ich weiß, was sie gesagt hat."] }, it: { examples: ["Conosco la risposta.", "So quello che ha detto."] }, pl: { examples: ["Znam odpowiedź.", "Wiem, co powiedziała."] }, tr: { examples: ["Cevabı biliyorum.", "Onun ne söylediğini biliyorum."] }, id: { examples: ["Saya tahu jawabannya.", "Saya tahu apa yang dia katakan."] }, vi: { examples: ["Tôi biết câu trả lời.", "Tôi biết cô ấy đã nói gì."] } }
          - type: note
            level: B2
            text: { en: ["Reported statements and questions are noun clauses. See ", { link: "Reported Speech", to: en.sentence-building.reported-speech }, "."], uk: ["Непрямі твердження й питання — це іменникові підрядні речення. Див. ", { link: "Непряма мова", to: "en.sentence-building.reported-speech" }, "."], es: ["Las afirmaciones y preguntas del estilo indirecto son oraciones sustantivas. Ver ", { link: "El estilo indirecto", to: "en.sentence-building.reported-speech" }, "."], pt: ["Afirmações e perguntas do discurso indireto são orações substantivas. Veja ", { link: "Discurso indireto", to: "en.sentence-building.reported-speech" }, "."], fr: ["Les affirmations et les questions rapportées sont des propositions nominales. Voir ", { link: "Le discours indirect", to: "en.sentence-building.reported-speech" }, "."], de: ["Indirekte Aussagen und Fragen sind Nebensätze in Nomenfunktion. Siehe ", { link: "Indirekte Rede", to: "en.sentence-building.reported-speech" }, "."], it: ["Le affermazioni e le domande del discorso indiretto sono proposizioni completive. Vedi ", { link: "Discorso indiretto", to: "en.sentence-building.reported-speech" }, "."], pl: ["Pytania i twierdzenia w mowie zależnej to zdania rzeczownikowe. Zob. ", { link: "Mowa zależna", to: "en.sentence-building.reported-speech" }, "."], tr: ["Dolaylı anlatımdaki cümleler ve sorular isim cümlecikleridir. Bkz. ", { link: "Dolaylı anlatım", to: "en.sentence-building.reported-speech" }, "."], id: ["Pernyataan dan pertanyaan dalam kalimat tak langsung adalah klausa nomina. Lihat ", { link: "Kalimat tak langsung", to: "en.sentence-building.reported-speech" }, "."], vi: ["Câu tường thuật và câu hỏi gián tiếp là mệnh đề danh từ. Xem ", { link: "Câu gián tiếp", to: "en.sentence-building.reported-speech" }, "."] }

  - title: { en: "Form: that-clauses", uk: "Форма: речення з that", es: "Forma: oraciones con that", pt: "Forma: orações com that", fr: "Forme : propositions avec that", de: "Form: that-Sätze", it: "Forma: proposizioni con that", pl: "Forma: zdania z that", tr: "Biçim: that cümlecikleri", id: "Bentuk: klausa that", vi: "Dạng: mệnh đề that" }
    role: form
    content:
      - type: usage
        columns:
          - { key: after, label: { en: "Follows", uk: "Стоїть після", es: "Va después de", pt: "Vem depois de", fr: "Se place après", de: "Steht nach", it: "Segue", pl: "Występuje po", tr: "Neyden sonra gelir", id: "Mengikuti", vi: "Đứng sau" } }
          - { key: words, label: { en: "Common words", uk: "Поширені слова", es: "Palabras frecuentes", pt: "Palavras comuns", fr: "Mots fréquents", de: "Häufige Wörter", it: "Parole frequenti", pl: "Częste słowa", tr: "Sık kullanılan sözcükler", id: "Kata yang umum", vi: "Từ thường gặp" } }
          - { key: ex, label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, after: { en: "A verb", uk: "Дієслово", es: "Un verbo", pt: "Um verbo", fr: "Un verbe", de: "Ein Verb", it: "Un verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Một động từ" }, words: { alternatives: [believe, say, know, hope, decide, realise, discover] }, ex: ["I realised ", { target: "that I had lost my keys" }, "."], tr: { uk: "Я зрозумів, що загубив ключі.", es: "Me di cuenta de que había perdido mis llaves.", pt: "Percebi que tinha perdido minhas chaves.", fr: "J’ai réalisé que j’avais perdu mes clés.", de: "Ich habe gemerkt, dass ich meine Schlüssel verloren hatte.", it: "Ho capito di aver perso le chiavi.", pl: "Zdałem sobie sprawę, że zgubiłem klucze.", tr: "Anahtarlarımı kaybettiğimi fark ettim.", id: "Saya sadar bahwa saya telah kehilangan kunci.", vi: "Tôi nhận ra là mình đã làm mất chìa khóa." } }
          - { level: B2, after: { en: "An adjective", uk: "Прикметник", es: "Un adjetivo", pt: "Um adjetivo", fr: "Un adjectif", de: "Ein Adjektiv", it: "Un aggettivo", pl: "Przymiotnik", tr: "Sıfat", id: "Kata sifat", vi: "Một tính từ" }, words: { alternatives: [afraid, certain, glad, sure, aware, surprised] }, ex: ["I'm glad ", { target: "that you came" }, "."], tr: { uk: "Я радий, що ти прийшов.", es: "Me alegra que hayas venido.", pt: "Fico feliz que você tenha vindo.", fr: "Je suis content que tu sois venu.", de: "Ich freue mich, dass du gekommen bist.", it: "Sono contento che tu sia venuto.", pl: "Cieszę się, że przyszedłeś.", tr: "Geldiğine sevindim.", id: "Saya senang kamu datang.", vi: "Tôi mừng là bạn đã đến." } }
          - { level: B2, after: { en: "A noun", uk: "Іменник", es: "Un sustantivo", pt: "Um substantivo", fr: "Un nom", de: "Ein Nomen", it: "Un sostantivo", pl: "Rzeczownik", tr: "İsim", id: "Kata benda", vi: "Một danh từ" }, words: { alternatives: [idea, fact, news, hope, belief, claim] }, ex: ["We heard the news ", { target: "that she had won" }, "."], tr: { uk: "Ми почули новину, що вона виграла.", es: "Supimos la noticia de que ella había ganado.", pt: "Ouvimos a notícia de que ela tinha ganhado.", fr: "Nous avons appris la nouvelle selon laquelle elle avait gagné.", de: "Wir hörten die Nachricht, dass sie gewonnen hatte.", it: "Abbiamo saputo la notizia che aveva vinto.", pl: "Usłyszeliśmy wiadomość, że wygrała.", tr: "Onun kazandığı haberini duyduk.", id: "Kami mendengar kabar bahwa dia menang.", vi: "Chúng tôi nghe tin là cô ấy đã thắng." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: That }, " is optional after common verbs and adjectives, and speech usually drops it."], uk: [{ term: "That" }, " не є обов’язковим після поширених дієслів і прикметників; у мовленні його зазвичай опускають."], es: [{ term: "That" }, " es opcional después de verbos y adjetivos comunes, y al hablar casi siempre se omite."], pt: [{ term: "That" }, " é opcional depois de verbos e adjetivos comuns, e na fala geralmente é omitido."], fr: [{ term: "That" }, " est facultatif après les verbes et adjectifs courants, et à l’oral on l’omet le plus souvent."], de: [{ term: "That" }, " ist nach gängigen Verben und Adjektiven optional, und gesprochen entfällt es meist."], it: [{ term: "That" }, " è facoltativo dopo i verbi e gli aggettivi comuni, e nel parlato di solito si omette."], pl: [{ term: "That" }, " jest opcjonalne po częstych czasownikach i przymiotnikach, a w mowie zwykle się je pomija."], tr: [{ term: "That" }, ", yaygın fiillerden ve sıfatlardan sonra isteğe bağlıdır; konuşmada çoğunlukla düşer."], id: [{ term: "That" }, " bersifat opsional setelah kata kerja dan kata sifat umum, dan dalam percakapan biasanya dihilangkan."], vi: [{ term: "That" }, " là tùy chọn sau các động từ và tính từ thông dụng, và trong lời nói thường được bỏ."] }
            ex: ["I hope ", { optional: that }, " you feel better."]
            tr: { uk: "Сподіваюся, тобі стане краще.", es: "Espero que te sientas mejor.", pt: "Espero que você melhore.", fr: "J’espère que tu te sens mieux.", de: "Ich hoffe, dass es dir besser geht.", it: "Spero che tu stia meglio.", pl: "Mam nadzieję, że poczujesz się lepiej.", tr: "Umarım daha iyi hissedersin.", id: "Saya harap kamu merasa lebih baik.", vi: "Tôi hy vọng bạn sẽ thấy khá hơn." }
          - type: rule
            level: B2
            text: { en: ["Formal verbs and nouns keep ", { term: that }, "."], uk: ["Дієслова й іменники офіційного стилю зберігають ", { term: "that" }, "."], es: ["Los verbos y sustantivos formales conservan ", { term: "that" }, "."], pt: ["Verbos e substantivos formais mantêm ", { term: "that" }, "."], fr: ["Les verbes et les noms du registre soutenu gardent ", { term: "that" }, "."], de: ["Verben und Nomen der förmlichen Sprache behalten ", { term: "that" }, "."], it: ["I verbi e i sostantivi formali mantengono ", { term: "that" }, "."], pl: ["Czasowniki i rzeczowniki formalne zachowują ", { term: "that" }, "."], tr: ["Resmî fiiller ve isimler ", { term: "that" }, " sözcüğünü korur."], id: ["Kata kerja dan kata benda formal tetap memakai ", { term: "that" }, "."], vi: ["Các động từ và danh từ trang trọng giữ ", { term: "that" }, "."] }
            ex: { examples: [["The report states ", { target: that }, " prices fell."], ["He has the idea ", { target: that }, " it is easy."]] }
            tr: { uk: { examples: ["У звіті сказано, що ціни впали.", "Він вважає, що це легко."] }, es: { examples: ["El informe afirma que los precios bajaron.", "Tiene la idea de que es fácil."] }, pt: { examples: ["O relatório afirma que os preços caíram.", "Ele tem a ideia de que é fácil."] }, fr: { examples: ["Le rapport indique que les prix ont baissé.", "Il a l’idée que c’est facile."] }, de: { examples: ["Der Bericht stellt fest, dass die Preise gefallen sind.", "Er hat die Vorstellung, dass es leicht ist."] }, it: { examples: ["Il rapporto afferma che i prezzi sono scesi.", "Ha l'idea che sia facile."] }, pl: { examples: ["Raport stwierdza, że ceny spadły.", "Ma wrażenie, że to łatwe."] }, tr: { examples: ["Rapor, fiyatların düştüğünü belirtiyor.", "Bunun kolay olduğunu düşünüyor."] }, id: { examples: ["Laporan menyatakan bahwa harga turun.", "Dia punya gagasan bahwa itu mudah."] }, vi: { examples: ["Báo cáo nêu rằng giá đã giảm.", "Anh ấy nghĩ rằng việc đó dễ."] } }

  - title: { en: "That-clauses as subject", uk: "Речення з that у ролі підмета", es: "Oraciones con that como sujeto", pt: "Orações com that como sujeito", fr: "Propositions avec that en position de sujet", de: "that-Sätze als Subjekt", it: "Proposizioni con that come soggetto", pl: "Zdania z that w roli podmiotu", tr: "Özne olarak that cümlecikleri", id: "Klausa that sebagai subjek", vi: "Mệnh đề that làm chủ ngữ" }
    role: own
