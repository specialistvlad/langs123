          - { level: C2, form: { pattern: [were it not for, { slot: noun }] }, use: { en: "a formal reason that decided the outcome", uk: "офіційна причина, що вирішила результат", es: "un motivo formal que decidió el resultado", pt: "um motivo formal que decidiu o resultado", fr: "une raison formelle qui a décidé de l’issue", de: "ein förmlicher Grund, der das Ergebnis bestimmte", it: "un motivo formale che ha deciso l'esito", pl: "formalny powód, który przesądził o wyniku", tr: "sonucu belirleyen resmî bir neden", id: "alasan formal yang menentukan hasil", vi: "một lý do trang trọng đã quyết định kết quả" }, ex: [{ target: Were it not for her advice }, ", I would have signed."], tr: { uk: "Якби не її порада, я б підписав.", es: "De no haber sido por su consejo, habría firmado.", pt: "Não fosse o conselho dela, eu teria assinado.", fr: "Sans son conseil, j’aurais signé.", de: "Ohne ihren Rat hätte ich unterschrieben.", it: "Se non fosse stato per il suo consiglio, avrei firmato.", pl: "Gdyby nie jej rada, podpisałbym.", tr: "Onun tavsiyesi olmasaydı imzalamış olurdum.", id: "Andai bukan karena nasihatnya, saya sudah menandatangani.", vi: "Nếu không nhờ lời khuyên của cô ấy, tôi đã ký rồi." } }
          - { level: C2, form: { pattern: [should, { slot: subject }, { slot: "base verb" }] }, use: { en: "a polite notice or email", uk: "ввічливе оголошення чи лист", es: "un aviso o correo cortés", pt: "um aviso ou e-mail educado", fr: "un avis ou un courriel poli", de: "eine höfliche Mitteilung oder E-Mail", it: "un avviso o un'e-mail cortese", pl: "uprzejme ogłoszenie lub e-mail", tr: "nazik bir duyuru ya da e-posta", id: "pengumuman atau surel yang sopan", vi: "thông báo hoặc email lịch sự" }, ex: [{ target: Should you need }, " help, please ask at the desk."], tr: { uk: "Якщо вам знадобиться допомога, будь ласка, зверніться до стійки.", es: "En caso de necesitar ayuda, no dude en preguntar en el mostrador.", pt: "Caso precise de ajuda, por favor, pergunte na recepção.", fr: "Au cas où vous auriez besoin d’aide, n’hésitez pas à vous adresser à l’accueil.", de: "Sollten Sie Hilfe benötigen, fragen Sie bitte am Schalter nach.", it: "Qualora abbia bisogno di aiuto, si rivolga allo sportello.", pl: "Gdyby potrzebowali Państwo pomocy, prosimy zwrócić się do recepcji.", tr: "Yardıma ihtiyacınız olması hâlinde lütfen danışmaya başvurunuz.", id: "Apabila Anda memerlukan bantuan, silakan bertanya di meja layanan.", vi: "Trường hợp quý vị cần hỗ trợ, xin vui lòng hỏi tại quầy." } }
