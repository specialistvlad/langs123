        - { level: C2, point: { en: Conditionals, uk: "Умовні речення", es: "Condicionales", pt: "Condicionais", fr: "Conditionnelles", de: "Bedingungssätze", it: "Periodo ipotetico", pl: "Zdania warunkowe", tr: "Koşul cümleleri", id: "Kalimat conditional", vi: "Câu điều kiện" }, rule: { en: [{ term: had }, ", ", { term: were }, " and ", { term: should }, " replace ", { term: if }, " in formal conditions"], uk: [{ term: "had" }, ", ", { term: "were" }, " і ", { term: "should" }, " замінюють ", { term: "if" }, " в офіційних умовних реченнях"], es: [{ term: "had" }, ", ", { term: "were" }, " y ", { term: "should" }, " sustituyen a ", { term: "if" }, " en condiciones formales"], pt: [{ term: "had" }, ", ", { term: "were" }, " e ", { term: "should" }, " substituem ", { term: "if" }, " em condições formais"], fr: [{ term: "had" }, ", ", { term: "were" }, " et ", { term: "should" }, " remplacent ", { term: "if" }, " dans les conditions soutenues"], de: [{ term: "had" }, ", ", { term: "were" }, " und ", { term: "should" }, " ersetzen ", { term: "if" }, " in förmlichen Bedingungen"], it: [{ term: "had" }, ", ", { term: "were" }, " e ", { term: "should" }, " sostituiscono ", { term: "if" }, " nelle condizioni formali"], pl: [{ term: "had" }, ", ", { term: "were" }, " i ", { term: "should" }, " zastępują ", { term: "if" }, " w formalnych warunkach"], tr: ["resmî koşullarda ", { term: "had" }, ", ", { term: "were" }, " ve ", { term: "should" }, ", ", { term: "if" }, " yerine geçer"], id: [{ term: "had" }, ", ", { term: "were" }, ", dan ", { term: "should" }, " menggantikan ", { term: "if" }, " dalam syarat formal"], vi: [{ term: "had" }, ", ", { term: "were" }, " và ", { term: "should" }, " thay cho ", { term: "if" }, " trong điều kiện trang trọng"] }, ex: [{ target: Should you need }, " help, please ask."], tr: { uk: "Якщо вам знадобиться допомога, будь ласка, звертайтеся.", es: "En caso de necesitar ayuda, no dude en preguntar.", pt: "Caso precise de ajuda, por favor, pergunte.", fr: "Au cas où vous auriez besoin d’aide, n’hésitez pas à demander.", de: "Sollten Sie Hilfe benötigen, fragen Sie bitte nach.", it: "Qualora abbia bisogno di aiuto, chieda pure.", pl: "Gdyby potrzebowali Państwo pomocy, prosimy pytać.", tr: "Yardıma ihtiyacınız olması hâlinde lütfen sorunuz.", id: "Apabila Anda memerlukan bantuan, silakan bertanya.", vi: "Trường hợp quý vị cần hỗ trợ, xin vui lòng hỏi." } }
        - { level: C1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "the subject follows the auxiliary, not the adverbial", uk: "підмет стоїть після допоміжного дієслова, а не після обставини", es: "el sujeto va después del auxiliar, no del complemento circunstancial", pt: "o sujeito vem depois do auxiliar, não do adjunto adverbial", fr: "le sujet suit l’auxiliaire, et non le complément circonstanciel", de: "das Subjekt folgt dem Hilfsverb, nicht der Adverbiale", it: "il soggetto segue l'ausiliare, non il complemento circostanziale", pl: "podmiot idzie po czasowniku pomocniczym, a nie po okoliczniku", tr: "özne yardımcı fiilin ardından gelir, zarf tümlecinin değil", id: "subjek mengikuti kata kerja bantu, bukan keterangan", vi: "chủ ngữ đứng sau trợ động từ, không phải sau trạng ngữ" }, ex: [{ target: Not only did she }, " win, but she also set a record."], tr: { uk: "Мало того що вона перемогла — вона ще й встановила рекорд.", es: "No solo ganó, sino que además estableció un récord.", pt: "Ela não só venceu, como ainda bateu um recorde.", fr: "Non seulement elle a gagné, mais elle a aussi établi un record.", de: "Nicht nur hat sie gewonnen, sondern sie hat auch einen Rekord aufgestellt.", it: "Non solo ha vinto, ma ha anche stabilito un record.", pl: "Nie dość, że wygrała, to jeszcze pobiła rekord.", tr: "Sadece kazanmakla kalmadı, bir de rekor kırdı.", id: "Bukan hanya menang, dia juga memecahkan rekor.", vi: "Không những thắng cuộc, cô ấy còn lập kỷ lục." } }
        - { level: C1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: do }, ", ", { term: does }, " and ", { term: did }, " take the base verb"], uk: ["після ", { term: "do" }, ", ", { term: "does" }, " і ", { term: "did" }, " дієслово стоїть у початковій формі"], es: [{ term: "do" }, ", ", { term: "does" }, " y ", { term: "did" }, " llevan el verbo en forma base"], pt: [{ term: "do" }, ", ", { term: "does" }, " e ", { term: "did" }, " levam o verbo na forma base"], fr: [{ term: "do" }, ", ", { term: "does" }, " et ", { term: "did" }, " sont suivis de la base verbale"], de: ["nach ", { term: "do" }, ", ", { term: "does" }, " und ", { term: "did" }, " steht das Verb in der Grundform"], it: [{ term: "do" }, ", ", { term: "does" }, " e ", { term: "did" }, " vogliono il verbo alla forma base"], pl: ["po ", { term: "do" }, ", ", { term: "does" }, " i ", { term: "did" }, " czasownik ma formę podstawową"], tr: [{ term: "do" }, ", ", { term: "does" }, " ve ", { term: "did" }, " sonrasında fiil yalın biçimdedir"], id: [{ term: "do" }, ", ", { term: "does" }, ", dan ", { term: "did" }, " diikuti kata kerja bentuk dasar"], vi: [{ term: "do" }, ", ", { term: "does" }, " và ", { term: "did" }, " đi với động từ nguyên mẫu"] }, ex: ["Rarely ", { target: does he come }, " late."], tr: { uk: "Рідко коли він запізнюється.", es: "Rara vez llega tarde.", pt: "Raramente ele chega atrasado.", fr: "Rarement arrive-t-il en retard.", de: "Selten kommt er zu spät.", it: "Raramente arriva in ritardo.", pl: "Rzadko się spóźnia.", tr: "Nadiren geç gelir.", id: "Jarang sekali dia datang terlambat.", vi: "Hiếm khi anh ấy đến muộn." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "Inversion puts the auxiliary before the subject, the order of a question.", uk: "Інверсія ставить допоміжне дієслово перед підметом, як у питанні.", es: "La inversión pone el auxiliar antes del sujeto, como en una pregunta.", pt: "A inversão põe o auxiliar antes do sujeito, a ordem de uma pergunta.", fr: "L’inversion place l’auxiliaire avant le sujet, comme dans une question.", de: "Bei der Inversion steht das Hilfsverb vor dem Subjekt, wie in einer Frage.", it: "L'inversione mette l'ausiliare prima del soggetto, come in una domanda.", pl: "Inwersja stawia czasownik pomocniczy przed podmiotem, jak w pytaniu.", tr: "Devrik sırada yardımcı fiil, soruda olduğu gibi özneden önce gelir.", id: "Inversi menempatkan kata kerja bantu sebelum subjek, seperti urutan pertanyaan.", vi: "Đảo ngữ đặt trợ động từ trước chủ ngữ, giống thứ tự của câu hỏi." }
            ex: [{ target: Never have I }, " seen such a crowd."]
            tr: { uk: "Такого натовпу я ще ніколи не бачив.", es: "Jamás he visto una multitud así.", pt: "Jamais vi uma multidão assim.", fr: "Jamais je n’ai vu pareille foule.", de: "Noch nie habe ich eine solche Menschenmenge gesehen.", it: "Una folla così non l'ho mai vista.", pl: "Takiego tłumu jeszcze nigdy nie widziałem.", tr: "Böyle bir kalabalığı daha önce hiç görmedim.", id: "Belum pernah saya melihat kerumunan seperti ini.", vi: "Chưa bao giờ tôi thấy một đám đông như thế." }
          - type: rule
            level: C1
            text: { en: "A negative or restrictive adverbial at the start of the clause calls for it.", uk: "Інверсії вимагає заперечна або обмежувальна обставина на початку речення.", es: "Un complemento circunstancial negativo o restrictivo al inicio de la oración la exige.", pt: "Um adjunto adverbial negativo ou restritivo no início da oração a exige.", fr: "Un complément circonstanciel négatif ou restrictif en tête de proposition l’exige.", de: "Eine negative oder einschränkende Adverbiale am Satzanfang verlangt sie.", it: "Un complemento circostanziale negativo o restrittivo a inizio proposizione la richiede.", pl: "Inwersji wymaga okolicznik przeczący lub ograniczający na początku zdania.", tr: "Cümlenin başındaki olumsuz ya da sınırlayıcı bir zarf tümleci bunu gerektirir.", id: "Keterangan negatif atau pembatas di awal klausa menuntutnya.", vi: "Trạng ngữ phủ định hoặc hạn chế ở đầu mệnh đề đòi hỏi đảo ngữ." }
            ex: { examples: [[{ target: Seldom is she }, " late."], [{ target: Only then did I }, " understand."]] }
            tr: { uk: { examples: ["Спізнюється вона дуже рідко.", "Лише тоді я зрозумів."] }, es: { examples: ["Pocas veces llega tarde.", "Solo entonces entendí."] }, pt: { examples: ["Raramente ela se atrasa.", "Só então eu entendi."] }, fr: { examples: ["Rarement est-elle en retard.", "Ce n’est qu’alors que j’ai compris."] }, de: { examples: ["Selten ist sie zu spät.", "Erst dann verstand ich."] }, it: { examples: ["Di rado è in ritardo.", "Solo allora ho capito."] }, pl: { examples: ["Bardzo rzadko jest spóźniona.", "Dopiero wtedy zrozumiałem."] }, tr: { examples: ["Nadiren geç kalır.", "Ancak o zaman anladım."] }, id: { examples: ["Jarang sekali dia terlambat.", "Baru saat itulah saya mengerti."] }, vi: { examples: ["Hiếm khi cô ấy đến muộn.", "Mãi đến lúc đó tôi mới hiểu."] } }
          - type: rule
            level: C1
            text: { en: "The clause remains a statement; the order adds emphasis.", uk: "Речення залишається розповідним; порядок слів додає підсилення.", es: "La oración sigue siendo una afirmación; el orden añade énfasis.", pt: "A oração continua sendo uma afirmação; a ordem acrescenta ênfase.", fr: "La proposition reste une phrase déclarative ; l’ordre ajoute de l’insistance.", de: "Der Satz bleibt eine Aussage; die Wortstellung verstärkt die Betonung.", it: "La proposizione resta un'affermazione; l'ordine aggiunge enfasi.", pl: "Zdanie nadal jest oznajmujące; szyk dodaje podkreślenia.", tr: "Cümle bildirim cümlesi olarak kalır; sıra vurgu katar.", id: "Klausa tetap kalimat pernyataan; urutan ini menambah penekanan.", vi: "Mệnh đề vẫn là câu trần thuật; trật tự này thêm sức nhấn mạnh." }
          - type: rule
            level: C2
            text: { en: "Fronting puts a place word, a complement or an object first for emphasis or style.", uk: "Винесення на початок ставить першим слово місця, доповнення або додаток — для підсилення чи стилю.", es: "La anteposición pone primero una palabra de lugar, un complemento o un objeto, por énfasis o por estilo.", pt: "A anteposição coloca primeiro uma palavra de lugar, um complemento ou um objeto, por ênfase ou estilo.", fr: "En tête, on place un mot de lieu, un attribut ou un complément d’objet pour insister ou pour le style.", de: "Bei der Voranstellung steht ein Ortsadverb, ein Prädikativ oder ein Objekt zuerst, zur Betonung oder als Stilmittel.", it: "L'anteposizione mette per primo un avverbio di luogo, un predicativo o un complemento oggetto, per enfasi o per stile.", pl: "Wysunięcie stawia na początku wyraz miejsca, uzupełnienie lub dopełnienie, dla podkreślenia lub stylu.", tr: "Öne alma, vurgu ya da üslup için bir yer sözcüğünü, tümleci veya nesneyi başa getirir.", id: "Pengedepanan menaruh kata tempat, pelengkap, atau objek di awal untuk penekanan atau gaya.", vi: "Đưa lên đầu câu là đặt từ chỉ nơi chốn, bổ ngữ hoặc tân ngữ lên trước để nhấn mạnh hoặc tạo văn phong." }
            ex: [{ target: Up went }, " the balloon."]
            tr: { uk: "Угору злетіла повітряна куля.", es: "Arriba subió el globo.", pt: "Para cima subiu o balão.", fr: "Vers le ciel s’éleva le ballon.", de: "Hoch hinauf stieg der Ballon.", it: "In alto salì il pallone.", pl: "W górę wzniósł się balon.", tr: "Yukarı yükseldi balon.", id: "Ke atas melayanglah balon itu.", vi: "Quả bóng bay vút lên cao." }

  - title: { en: "Form: the order", uk: "Форма: порядок слів", es: "Forma: el orden", pt: "Forma: a ordem", fr: "Forme : l’ordre", de: "Form: die Reihenfolge", it: "Forma: l'ordine", pl: "Forma: szyk", tr: "Biçim: sıra", id: "Bentuk: urutan", vi: "Dạng: trật tự" }
    role: form
    content:
      - type: usage
        columns:
          - { key: with, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, with: { en: { term: be }, uk: { term: "be" }, es: { term: "be" }, pt: { term: "be" }, fr: { term: "be" }, de: { term: "be" }, it: { term: "be" }, pl: { term: "be" }, tr: { term: "be" }, id: { term: "be" }, vi: { term: "be" } }, pattern: { pattern: [{ slot: { en: negative adverbial, uk: "заперечна обставина", es: "complemento circunstancial negativo", pt: "adjunto adverbial negativo", fr: "complément circonstanciel négatif", de: "negative Adverbiale", it: "complemento circostanziale negativo", pl: "okolicznik przeczący", tr: "olumsuz zarf tümleci", id: "keterangan negatif", vi: "trạng ngữ phủ định" } }, be, { slot: subject }] }, ex: [{ target: Seldom is she }, " late."], tr: { uk: "Спізнюється вона дуже рідко.", es: "Pocas veces llega tarde.", pt: "Raramente ela se atrasa.", fr: "Rarement est-elle en retard.", de: "Selten ist sie zu spät.", it: "Di rado è in ritardo.", pl: "Bardzo rzadko jest spóźniona.", tr: "Nadiren geç kalır.", id: "Jarang sekali dia terlambat.", vi: "Hiếm khi cô ấy đến muộn." } }
          - { level: C1, with: { en: [{ term: have }, ", ", { term: will }, " and other auxiliaries"], uk: [{ term: "have" }, ", ", { term: "will" }, " та інші допоміжні дієслова"], es: [{ term: "have" }, ", ", { term: "will" }, " y otros auxiliares"], pt: [{ term: "have" }, ", ", { term: "will" }, " e outros auxiliares"], fr: [{ term: "have" }, ", ", { term: "will" }, " et les autres auxiliaires"], de: [{ term: "have" }, ", ", { term: "will" }, " und andere Hilfsverben"], it: [{ term: "have" }, ", ", { term: "will" }, " e altri ausiliari"], pl: [{ term: "have" }, ", ", { term: "will" }, " i inne czasowniki pomocnicze"], tr: [{ term: "have" }, ", ", { term: "will" }, " ve diğer yardımcı fiiller"], id: [{ term: "have" }, ", ", { term: "will" }, ", dan kata kerja bantu lain"], vi: [{ term: "have" }, ", ", { term: "will" }, " và các trợ động từ khác"] }, pattern: { pattern: [{ slot: { en: negative adverbial, uk: "заперечна обставина", es: "complemento circunstancial negativo", pt: "adjunto adverbial negativo", fr: "complément circonstanciel négatif", de: "negative Adverbiale", it: "complemento circostanziale negativo", pl: "okolicznik przeczący", tr: "olumsuz zarf tümleci", id: "keterangan negatif", vi: "trạng ngữ phủ định" } }, { slot: { en: auxiliary, uk: "допоміжне дієслово", es: "auxiliar", pt: "auxiliar", fr: "auxiliaire", de: "Hilfsverb", it: "ausiliare", pl: "czasownik pomocniczy", tr: "yardımcı fiil", id: "kata kerja bantu", vi: "trợ động từ" } }, { slot: subject }, { slot: verb }] }, ex: { examples: [[{ target: Never before had I }, " seen snow."], [{ target: Never will I }, " forget it."]] }, tr: { uk: { examples: ["Досі я ніколи не бачив снігу.", "Ніколи я цього не забуду."] }, es: { examples: ["Jamás antes había visto nieve.", "Jamás lo olvidaré."] }, pt: { examples: ["Nunca antes tinha visto neve.", "Jamais vou esquecer isso."] }, fr: { examples: ["Jamais auparavant je n’avais vu de neige.", "Jamais je ne l’oublierai."] }, de: { examples: ["Nie zuvor hatte ich Schnee gesehen.", "Nie werde ich das vergessen."] }, it: { examples: ["Mai prima di allora avevo visto la neve.", "Mai lo dimenticherò."] }, pl: { examples: ["Nigdy wcześniej nie widziałem śniegu.", "Nigdy tego nie zapomnę."] }, tr: { examples: ["Daha önce hiç kar görmemiştim.", "Bunu asla unutmayacağım."] }, id: { examples: ["Belum pernah sebelumnya saya melihat salju.", "Tidak akan pernah saya lupakan."] }, vi: { examples: ["Trước đó, chưa bao giờ tôi thấy tuyết.", "Không bao giờ tôi quên được điều đó."] } } }
          - { level: C1, with: { en: "modal verbs", uk: "модальні дієслова", es: "verbos modales", pt: "verbos modais", fr: "verbes modaux", de: "Modalverben", it: "verbi modali", pl: "czasowniki modalne", tr: "modal fiiller", id: "kata kerja modal", vi: "động từ khuyết thiếu" }, pattern: { pattern: [{ slot: { en: negative adverbial, uk: "заперечна обставина", es: "complemento circunstancial negativo", pt: "adjunto adverbial negativo", fr: "complément circonstanciel négatif", de: "negative Adverbiale", it: "complemento circostanziale negativo", pl: "okolicznik przeczący", tr: "olumsuz zarf tümleci", id: "keterangan negatif", vi: "trạng ngữ phủ định" } }, { slot: { en: modal, uk: "модальне дієслово", es: "verbo modal", pt: "verbo modal", fr: "verbe modal", de: "Modalverb", it: "verbo modale", pl: "czasownik modalny", tr: "modal fiil", id: "kata kerja modal", vi: "động từ khuyết thiếu" } }, { slot: subject }, { slot: "base verb" }] }, ex: [{ target: Seldom can you }, " find a quieter café."], tr: { uk: "Рідко де знайдеш тихіше кафе.", es: "Rara vez se encuentra un café más tranquilo.", pt: "Raramente se encontra um café mais tranquilo.", fr: "Rarement trouve-t-on un café plus calme.", de: "Selten findet man ein ruhigeres Café.", it: "Raramente si trova un caffè più tranquillo.", pl: "Rzadko znajdziesz cichszą kawiarnię.", tr: "Bundan daha sessiz bir kafe nadiren bulursun.", id: "Jarang sekali Anda menemukan kafe yang lebih tenang.", vi: "Hiếm khi bạn tìm được một quán cà phê yên tĩnh hơn." } }
          - { level: C1, with: { en: "other verbs", uk: "інші дієслова", es: "los demás verbos", pt: "os demais verbos", fr: "les autres verbes", de: "andere Verben", it: "gli altri verbi", pl: "pozostałe czasowniki", tr: "diğer fiiller", id: "kata kerja lain", vi: "động từ thường" }, pattern: { pattern: [{ slot: { en: negative adverbial, uk: "заперечна обставина", es: "complemento circunstancial negativo", pt: "adjunto adverbial negativo", fr: "complément circonstanciel négatif", de: "negative Adverbiale", it: "complemento circostanziale negativo", pl: "okolicznik przeczący", tr: "olumsuz zarf tümleci", id: "keterangan negatif", vi: "trạng ngữ phủ định" } }, "do, does, did", { slot: subject }, { slot: "base verb" }] }, ex: { examples: [[{ target: Rarely does she }, " complain."], [{ target: Seldom did we }, " meet."]] }, tr: { uk: { examples: ["Рідко коли вона скаржиться.", "Рідко ми зустрічалися."] }, es: { examples: ["Rara vez se queja.", "Rara vez nos veíamos."] }, pt: { examples: ["Raramente ela reclama.", "Raramente nos encontrávamos."] }, fr: { examples: ["Rarement se plaint-elle.", "Rarement nous voyions-nous."] }, de: { examples: ["Selten beschwert sie sich.", "Selten trafen wir uns."] }, it: { examples: ["Raramente si lamenta.", "Raramente ci incontravamo."] }, pl: { examples: ["Rzadko kiedy się skarży.", "Rzadko się spotykaliśmy."] }, tr: { examples: ["Nadiren şikâyet eder.", "Nadiren görüşürdük."] }, id: { examples: ["Jarang sekali dia mengeluh.", "Jarang sekali kami bertemu."] }, vi: { examples: ["Hiếm khi cô ấy phàn nàn.", "Hiếm khi chúng tôi gặp nhau."] } } }
      - type: list
        items:
