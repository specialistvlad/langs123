arlah kelegaannya."] }, vi: { examples: ["Đã qua rồi những ngày viết thư dài.", "Lớn lao thay sự nhẹ nhõm của cô ấy."] } } }
          - { level: C2, use: { en: ["A noun phrase with ", { term: such }, " before ", { term: be }], uk: ["Іменникове словосполучення з ", { term: "such" }, " перед ", { term: "be" }], es: ["Un grupo nominal con ", { term: "such" }, " antes de ", { term: "be" }], pt: ["Um sintagma nominal com ", { term: "such" }, " antes de ", { term: "be" }], fr: ["Un groupe nominal avec ", { term: "such" }, " avant ", { term: "be" }], de: ["Eine Nominalphrase mit ", { term: "such" }, " vor ", { term: "be" }], it: ["Un sintagma nominale con ", { term: "such" }, " prima di ", { term: "be" }], pl: ["Grupa rzeczownikowa z ", { term: "such" }, " przed ", { term: "be" }], tr: [{ term: "be" }, " öncesinde ", { term: "such" }, " içeren isim öbeği"], id: ["Frasa nomina dengan ", { term: "such" }, " sebelum ", { term: "be" }], vi: ["Cụm danh từ có ", { term: "such" }, " đứng trước ", { term: "be" }] }, ex: [{ target: Such a kind teacher was }, " she."], tr: { uk: "Такою доброю вчителькою була вона.", es: "Tan buena maestra era ella.", pt: "Tão gentil professora era ela.", fr: "Quelle gentille enseignante elle était.", de: "So eine freundliche Lehrerin war sie.", it: "Un'insegnante così gentile era lei.", pl: "Taką miłą nauczycielką była ona.", tr: "Ne kadar nazik bir öğretmendi o.", id: "Begitu baik hatinya dia sebagai guru.", vi: "Cô ấy là một giáo viên tốt bụng biết bao." } }
          - { level: C2, use: { en: "A complement with a pronoun subject", uk: "Доповнення із займенниковим підметом", es: "Un complemento con sujeto pronominal", pt: "Um complemento com sujeito pronome", fr: "Un attribut avec un sujet pronom", de: "Ein Prädikativ mit Pronomen als Subjekt", it: "Un predicativo con soggetto pronome", pl: "Uzupełnienie z podmiotem zaimkowym", tr: "Zamir özneli tümleç", id: "Pelengkap dengan subjek berupa kata ganti", vi: "Bổ ngữ với chủ ngữ là đại từ" }, ex: [{ target: Cold it was }, ", and wet."], tr: { uk: "Холодно було, і мокро.", es: "Frío y húmedo estaba el día.", pt: "Frio e úmido estava o dia.", fr: "Froid, il l’était, et humide aussi.", de: "Kalt war es, und nass.", it: "Freddo era, e umido.", pl: "Zimno było i mokro.", tr: "Soğuktu, hem de ıslak.", id: "Dinginlah cuacanya, dan basah.", vi: "Trời lạnh lắm, lại còn ẩm ướt." } }
          - { level: C2, use: { en: "An object first, then subject and verb", uk: "Спочатку додаток, потім підмет і дієслово", es: "Primero el objeto, luego el sujeto y el verbo", pt: "Primeiro o objeto, depois o sujeito e o verbo", fr: "D’abord le complément d’objet, puis le sujet et le verbe", de: "Zuerst das Objekt, dann Subjekt und Verb", it: "Prima il complemento oggetto, poi soggetto e verbo", pl: "Najpierw dopełnienie, potem podmiot i czasownik", tr: "Önce nesne, sonra özne ve fiil", id: "Objek lebih dulu, lalu subjek dan kata kerja", vi: "Tân ngữ đứng đầu, rồi đến chủ ngữ và động từ" }, ex: { examples: [[{ target: This much I }, " know."], [{ target: Money he }, " had, but friends he lacked."]] }, tr: { uk: { examples: ["Це я принаймні знаю.", "Гроші в нього були, а друзів бракувало."] }, es: { examples: ["Esto, al menos, lo sé.", "Dinero tenía, pero amigos le faltaban."] }, pt: { examples: ["Isto pelo menos eu sei.", "Dinheiro ele tinha, mas amigos lhe faltavam."] }, fr: { examples: ["Cela, au moins, je le sais.", "De l’argent, il en avait, mais des amis lui manquaient."] }, de: { examples: ["So viel weiß ich.", "Geld hatte er, aber Freunde fehlten ihm."] }, it: { examples: ["Questo almeno lo so.", "Soldi ne aveva, ma gli mancavano gli amici."] }, pl: { examples: ["Tyle wiem.", "Pieniądze miał, ale przyjaciół mu brakowało."] }, tr: { examples: ["Bu kadarını biliyorum.", "Parası vardı, ama arkadaşı yoktu."] }, id: { examples: ["Hanya ini yang saya tahu.", "Uang dia punya, tetapi teman dia tidak punya."] }, vi: { examples: ["Chừng này thì tôi biết.", "Tiền thì anh ta có, nhưng bạn bè thì anh ta thiếu."] } } }
          - { level: C2, use: { en: ["A verb phrase first, with ", { term: do }, " after the subject"], uk: ["Спочатку група дієслова, а ", { term: "do" }, " — після підмета"], es: ["Primero un grupo verbal, con ", { term: "do" }, " después del sujeto"], pt: ["Primeiro um sintagma verbal, com ", { term: "do" }, " depois do sujeito"], fr: ["D’abord un groupe verbal, avec ", { term: "do" }, " après le sujet"], de: ["Zuerst eine Verbgruppe, mit ", { term: "do" }, " nach dem Subjekt"], it: ["Prima un sintagma verbale, con ", { term: "do" }, " dopo il soggetto"], pl: ["Najpierw grupa czasownikowa, a ", { term: "do" }, " po podmiocie"], tr: ["Önce fiil öbeği, özneden sonra ", { term: "do" }], id: ["Frasa kata kerja lebih dulu, dengan ", { term: "do" }, " setelah subjek"], vi: ["Cụm động từ đứng đầu, với ", { term: "do" }, " sau chủ ngữ"] }, ex: [{ target: Win the match we did }, ", but only just."], tr: { uk: "Виграти матч — виграли, але ледве.", es: "Ganar el partido, lo ganamos, pero por poco.", pt: "Ganhar o jogo, nós ganhamos, mas por pouco.", fr: "Gagner le match, nous l’avons fait, mais de justesse.", de: "Das Spiel gewinnen — das taten wir, aber nur knapp.", it: "La partita, l'abbiamo vinta, ma per un soffio.", pl: "Wygrać mecz — wygraliśmy, ale ledwo.", tr: "Maçı kazandık kazanmasına, ama zar zor.", id: "Memenangkan pertandingan memang kami lakukan, tetapi dengan selisih tipis.", vi: "Thắng trận thì chúng tôi có thắng, nhưng chỉ sát nút." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "After a fronted object or verb phrase, the subject and verb keep their normal order.", uk: "Після додатка чи дієслівної групи на початку підмет і дієслово зберігають звичайний порядок.", es: "Tras un objeto o un grupo verbal al inicio, el sujeto y el verbo conservan el orden normal.", pt: "Depois de um objeto ou sintagma verbal no início, sujeito e verbo mantêm a ordem normal.", fr: "Après un complément d’objet ou un groupe verbal en tête, le sujet et le verbe gardent l’ordre normal.", de: "Nach einem vorangestellten Objekt oder einer Verbgruppe behalten Subjekt und Verb ihre normale Ordnung.", it: "Dopo un complemento oggetto o un sintagma verbale in testa, soggetto e verbo mantengono l'ordine normale.", pl: "Po dopełnieniu lub grupie czasownikowej na początku podmiot i czasownik zachowują zwykły szyk.", tr: "Başa alınan nesne ya da fiil öbeğinden sonra özne ve fiil olağan sırasını korur.", id: "Setelah objek atau frasa kata kerja di awal, subjek dan kata kerja tetap berurutan biasa.", vi: "Sau tân ngữ hoặc cụm động từ đứng đầu, chủ ngữ và động từ giữ trật tự thường." }
          - type: rule
            level: C2
            text: { en: "These patterns belong to literary, rhetorical and formal style.", uk: "Ці конструкції належать до художнього, риторичного й офіційного стилю.", es: "Estas estructuras pertenecen al estilo literario, retórico y formal.", pt: "Essas estruturas pertencem ao estilo literário, retórico e formal.", fr: "Ces tours appartiennent au style littéraire, oratoire et soutenu.", de: "Diese Muster gehören zum literarischen, rhetorischen und förmlichen Stil.", it: "Questi schemi appartengono allo stile letterario, retorico e formale.", pl: "Te wzorce należą do stylu literackiego, retorycznego i oficjalnego.", tr: "Bu kalıplar edebî, retorik ve resmî üsluba aittir.", id: "Pola ini termasuk gaya sastra, retorika, dan formal.", vi: "Các mẫu này thuộc văn phong văn chương, hùng biện và trang trọng." }

  - title: { en: "Than, as and quotation tags", uk: "Than, as і слова автора", es: "Than, as y los incisos de cita", pt: "Than, as e as indicações de fala", fr: "Than, as et incises de citation", de: "Than, as und Redebegleitsätze", it: "Than, as e incisi di citazione", pl: "Than, as i wtrącenia przy cytatach", tr: "Than, as ve alıntı sonrası ifadeler", id: "Than, as dan keterangan kutipan", vi: "Than, as và lời dẫn sau trích dẫn" }
