            text: { en: [{ term: little }, " means not at all and goes with ", { term: know }, ", ", { term: realise }, ", ", { term: suspect }, " and ", { term: imagine }, "."], uk: [{ term: "little" }, " означає «зовсім не» й вживається з ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " та ", { term: "imagine" }, "."], es: [{ term: "little" }, " significa «en absoluto» y va con ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " e ", { term: "imagine" }, "."], pt: [{ term: "little" }, " significa “de modo nenhum” e vai com ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " e ", { term: "imagine" }, "."], fr: [{ term: "little" }, " signifie « pas du tout » et s’emploie avec ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " et ", { term: "imagine" }, "."], de: [{ term: "little" }, " bedeutet „überhaupt nicht“ und steht bei ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " und ", { term: "imagine" }, "."], it: [{ term: "little" }, " significa «per niente» e va con ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " e ", { term: "imagine" }, "."], pl: [{ term: "little" }, " znaczy „wcale nie” i łączy się z ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " i ", { term: "imagine" }, "."], tr: [{ term: "little" }, " “hiç” anlamına gelir ve ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " ve ", { term: "imagine" }, " fiilleriyle kullanılır."], id: [{ term: "little" }, " berarti “sama sekali tidak” dan dipakai dengan ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, ", dan ", { term: "imagine" }, "."], vi: [{ term: "little" }, " nghĩa là “hoàn toàn không” và đi với ", { term: "know" }, ", ", { term: "realise" }, ", ", { term: "suspect" }, " và ", { term: "imagine" }, "."] }
          - type: note
            level: C1
            text: { en: ["Negative words with a positive verb are in ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, "."], uk: ["Про заперечні слова зі ствердним дієсловом див. ", { link: "Питання та заперечення", to: en.sentence-building.questions-negatives }, "."], es: ["Para las palabras negativas con un verbo afirmativo, ver ", { link: "Preguntas y negaciones", to: en.sentence-building.questions-negatives }, "."], pt: ["Para palavras negativas com verbo afirmativo, ver ", { link: "Perguntas e negações", to: en.sentence-building.questions-negatives }, "."], fr: ["Pour les mots négatifs avec un verbe affirmatif, voir ", { link: "Questions et négations", to: en.sentence-building.questions-negatives }, "."], de: ["Zu Verneinungswörtern mit bejahtem Verb siehe ", { link: "Fragen und Verneinung", to: en.sentence-building.questions-negatives }, "."], it: ["Per le parole negative con un verbo affermativo, vedi ", { link: "Domande e negazioni", to: en.sentence-building.questions-negatives }, "."], pl: ["O wyrazach przeczących z czasownikiem w formie twierdzącej zob. ", { link: "Pytania i przeczenia", to: en.sentence-building.questions-negatives }, "."], tr: ["Olumlu fiille kullanılan olumsuz sözcükler için bkz. ", { link: "Sorular ve olumsuz cümleler", to: en.sentence-building.questions-negatives }, "."], id: ["Untuk kata negatif dengan kata kerja positif, lihat ", { link: "Pertanyaan dan kalimat negatif", to: en.sentence-building.questions-negatives }, "."], vi: ["Về từ phủ định đi với động từ khẳng định, xem ", { link: "Câu hỏi và câu phủ định", to: en.sentence-building.questions-negatives }, "."] }

  - title: { en: "Hardly … when and no sooner … than", uk: "Hardly … when і no sooner … than", es: "Hardly … when y no sooner … than", pt: "Hardly … when e no sooner … than", fr: "Hardly … when et no sooner … than", de: "Hardly … when und no sooner … than", it: "Hardly … when e no sooner … than", pl: "Hardly … when i no sooner … than", tr: "Hardly … when ve no sooner … than", id: "Hardly … when dan no sooner … than", vi: "Hardly … when và no sooner … than" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [hardly had, { slot: subject }, { slot: past participle }, when, { slot: clause }] }, ex: [{ target: Hardly had we }, " sat down when the lights went out."], tr: { uk: "Ледве ми сіли, як погасло світло.", es: "Apenas nos habíamos sentado cuando se apagaron las luces.", pt: "Mal nos sentamos, as luzes se apagaram.", fr: "À peine étions-nous assis que les lumières se sont éteintes.", de: "Kaum hatten wir uns gesetzt, da gingen die Lichter aus.", it: "Ci eravamo appena seduti quando le luci si spensero.", pl: "Ledwo usiedliśmy, kiedy zgasło światło.", tr: "Daha oturmuştuk ki ışıklar söndü.", id: "Baru saja kami duduk, lampu-lampu padam.", vi: "Chúng tôi vừa ngồi xuống thì đèn tắt." } }
          - { level: C1, form: { pattern: [scarcely had, { slot: subject }, { slot: past participle }, when, { slot: clause }] }, ex: [{ target: Scarcely had she }, " spoken when the phone rang."], tr: { uk: "Вона ледве встигла заговорити, як задзвонив телефон.", es: "Apenas había hablado cuando sonó el teléfono.", pt: "Mal ela falou, o telefone tocou.", fr: "À peine avait-elle parlé que le téléphone a sonné.", de: "Kaum hatte sie gesprochen, da klingelte das Telefon.", it: "Aveva appena parlato quando squillò il telefono.", pl: "Ledwo się odezwała, zadzwonił telefon.", tr: "Daha konuşmuştu ki telefon çaldı.", id: "Baru saja dia berbicara, telepon berdering.", vi: "Cô ấy vừa nói xong thì điện thoại reo." } }
          - { level: C1, form: { pattern: [no sooner had, { slot: subject }, { slot: past participle }, than, { slot: clause }] }, ex: [{ target: No sooner had he }, " arrived than it began to rain."], tr: { uk: "Тільки-но він приїхав, як пішов дощ.", es: "Apenas había llegado cuando empezó a llover.", pt: "Mal ele chegou, começou a chover.", fr: "À peine était-il arrivé qu’il s’est mis à pleuvoir.", de: "Kaum war er angekommen, da begann es zu regnen.", it: "Era appena arrivato che cominciò a piovere.", pl: "Ledwo przyjechał, zaczął padać deszcz.", tr: "Daha gelir gelmez yağmur başladı.", id: "Begitu dia tiba, hujan pun mulai turun.", vi: "Anh ấy vừa đến thì trời đã đổ mưa." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["Only the first clause inverts, with ", { term: had }, "; the second clause, in the past simple, keeps normal order."], uk: ["Інверсія лише в першій частині, з ", { term: "had" }, "; друга частина в Past Simple зберігає звичайний порядок."], es: ["Solo se invierte la primera oración, con ", { term: "had" }, "; la segunda, en pasado simple, conserva el orden normal."], pt: ["Só a primeira oração se inverte, com ", { term: "had" }, "; a segunda, no passado simples, mantém a ordem normal."], fr: ["Seule la première proposition s’inverse, avec ", { term: "had" }, " ; la seconde, au prétérit simple, garde l’ordre normal."], de: ["Nur der erste Satz wird invertiert, mit ", { term: "had" }, "; der zweite Satz im Simple Past behält die normale Ordnung."], it: ["Si inverte solo la prima proposizione, con ", { term: "had" }, "; la seconda, al past simple, mantiene l'ordine normale."], pl: ["Tylko pierwsze zdanie ma szyk przestawny, z ", { term: "had" }, "; drugie, w Past Simple, zachowuje zwykły szyk."], tr: ["Yalnızca ilk cümlede sıra değişir, ", { term: "had" }, " ile; Simple Past’taki ikinci cümle olağan sırayı korur."], id: ["Hanya klausa pertama yang diinversi, dengan ", { term: "had" }, "; klausa kedua dalam Simple Past tetap berurutan biasa."], vi: ["Chỉ mệnh đề đầu đảo ngữ, với ", { term: "had" }, "; mệnh đề sau, ở quá khứ đơn, giữ trật tự thường."] }
          - type: rule
            level: C1
            text: { en: "The pattern reports two past events in quick succession: the first is complete when the second begins.", uk: "Схема описує дві минулі події, що йдуть одна за одною: перша завершена, коли починається друга.", es: "El patrón presenta dos hechos pasados seguidos: el primero está completo cuando empieza el segundo.", pt: "O padrão relata dois fatos passados em sequência rápida: o primeiro está completo quando o segundo começa.", fr: "Le schéma rapporte deux faits passés qui se suivent de près : le premier est achevé quand le second commence.", de: "Das Muster berichtet von zwei Ereignissen, die kurz aufeinander folgen: Das erste ist abgeschlossen, wenn das zweite beginnt.", it: "Lo schema riferisce due fatti passati in rapida successione: il primo è concluso quando inizia il secondo.", pl: "Schemat opisuje dwa zdarzenia z przeszłości następujące szybko po sobie: pierwsze jest zakończone, gdy zaczyna się drugie.", tr: "Kalıp, birbirini hızla izleyen iki geçmiş olayı anlatır: ikincisi başlarken birincisi bitmiştir.", id: "Pola ini melaporkan dua peristiwa lampau yang terjadi cepat berurutan: yang pertama sudah selesai saat yang kedua mulai.", vi: "Mẫu này kể hai việc quá khứ nối nhau rất nhanh: việc đầu đã xong khi việc sau bắt đầu." }

  - title: { en: "Not only, not until and only", uk: "Not only, not until і only", es: "Not only, not until y only", pt: "Not only, not until e only", fr: "Not only, not until et only", de: "Not only, not until und only", it: "Not only, not until e only", pl: "Not only, not until i only", tr: "Not only, not until ve only", id: "Not only, not until dan only", vi: "Not only, not until và only" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Opening, uk: "Початок речення", es: "Inicio de la oración", pt: "Início da frase", fr: "Début de phrase", de: "Satzanfang", it: "Inizio della frase", pl: "Początek zdania", tr: "Cümle başı", id: "Pembuka kalimat", vi: "Phần mở đầu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: ["Not only ", { gap: true }, " but also"], ex: [{ target: Not only did she }, " win, but she also set a record."], tr: { uk: "Мало того що вона перемогла — вона ще й встановила рекорд.", es: "No solo ganó, sino que además estableció un récord.", pt: "Ela não só venceu, como ainda bateu um recorde.", fr: "Non seulement elle a gagné, mais elle a aussi établi un record.", de: "Nicht nur hat sie gewonnen, sondern sie hat auch einen Rekord aufgestellt.", it: "Non solo ha vinto, ma ha anche stabilito un record.", pl: "Nie dość, że wygrała, to jeszcze pobiła rekord.", tr: "Sadece kazanmakla kalmadı, bir de rekor kırdı.", id: "Bukan hanya menang, dia juga memecahkan rekor.", vi: "Không những thắng cuộc, cô ấy còn lập kỷ lục." } }
          - { level: C1, form: ["Not until ", { gap: true }], ex: [{ target: Not until he left did I }, " understand."], tr: { uk: "Лише коли він пішов, я зрозумів.", es: "Solo cuando se fue entendí.", pt: "Só quando ele foi embora eu entendi.", fr: "Ce n’est qu’après son départ que j’ai compris.", de: "Erst als er ging, verstand ich es.", it: "Solo quando se n'è andato ho capito.", pl: "Dopiero gdy wyszedł, zrozumiałem.", tr: "Ancak o gittikten sonra anladım.", id: "Baru setelah dia pergi saya mengerti.", vi: "Mãi đến khi anh ấy đi tôi mới hiểu." } }
          - { level: C1, form: { term: Only then }, ex: [{ target: Only then did I }, " see the problem."], tr: { uk: "Лише тоді я побачив проблему.", es: "Solo entonces vi el problema.", pt: "Só então eu vi o problema.", fr: "Ce n’est qu’alors que j’ai vu le problème.", de: "Erst dann sah ich das Problem.", it: "Solo allora ho visto il problema.", pl: "Dopiero wtedy zobaczyłem problem.", tr: "Sorunu ancak o zaman gördüm.", id: "Baru saat itulah saya melihat masalahnya.", vi: "Mãi đến lúc đó tôi mới nhận ra vấn đề." } }
          - { level: C1, form: { alternatives: [{ term: Only when }, { term: only after }] }, ex: { examples: [[{ target: Only after dinner did he }, " tell us the news."], [{ target: Only when the rain stopped did we }, " leave."]] }, tr: { uk: { examples: ["Лише після вечері він розповів нам новину.", "Лише коли дощ припинився, ми пішли."] }, es: { examples: ["Solo después de la cena nos contó la noticia.", "Solo cuando paró la lluvia nos fuimos."] }, pt: { examples: ["Só depois do jantar ele nos contou a novidade.", "Só quando a chuva parou nós saímos."] }, fr: { examples: ["Ce n’est qu’après le dîner qu’il nous a annoncé la nouvelle.", "Ce n’est que lorsque la pluie s’est arrêtée que nous sommes partis."] }, de: { examples: ["Erst nach dem Abendessen erzählte er uns die Neuigkeit.", "Erst als der Regen aufhörte, gingen wir."] }, it: { examples: ["Solo dopo cena ci ha dato la notizia.", "Solo quando la pioggia si è fermata siamo partiti."] }, pl: { examples: ["Dopiero po kolacji przekazał nam wiadomość.", "Dopiero gdy przestało padać, wyszliśmy."] }, tr: { examples: ["Haberi bize ancak akşam yemeğinden sonra verdi.", "Ancak yağmur dindikten sonra ayrıldık."] }, id: { examples: ["Baru setelah makan malam dia menceritakan kabar itu kepada kami.", "Baru ketika hujan berhenti kami pergi."] }, vi: { examples: ["Mãi sau bữa tối anh ấy mới kể tin đó cho chúng tôi.", "Mãi đến khi mưa tạnh chúng tôi mới đi."] } } }
          - { level: C1, form: { alternatives: [{ term: Only if }, { term: only by }] }, ex: { examples: [[{ target: Only if you ask will she }, " help."], [{ target: Only by working together can we }, " finish."]] }, tr: { uk: { examples: ["Лише якщо ти попросиш, вона допоможе.", "Лише спільними зусиллями ми зможемо закінчити."] }, es: { examples: ["Solo si se lo pides, ella ayudará.", "Solo trabajando juntos podemos terminar."] }, pt: { examples: ["Só se você pedir ela vai ajudar.", "Só trabalhando juntos podemos terminar."] }, fr: { examples: ["Ce n’est que si tu lui demandes qu’elle t’aidera.", "Ce n’est qu’en travaillant ensemble que nous pourrons finir."] }, de: { examples: ["Nur wenn du fragst, wird sie helfen.", "Nur durch Zusammenarbeit können wir fertig werden."] }, it: { examples: ["Solo se glielo chiedi, lei ti aiuterà.", "Solo lavorando insieme possiamo finire."] }, pl: { examples: ["Tylko jeśli poprosisz, ona pomoże.", "Tylko pracując razem, możemy skończyć."] }, tr: { examples: ["Ancak sen istersen o yardım edecek.", "Ancak birlikte çalışarak bitirebiliriz."] }, id: { examples: ["Hanya jika kamu meminta, dia akan membantu.", "Hanya dengan bekerja sama kita dapat menyelesaikannya."] }, vi: { examples: ["Chỉ khi bạn nhờ, cô ấy mới giúp.", "Chỉ khi cùng làm việc chúng ta mới xong được."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The opening clause keeps normal order; the main clause that follows it inverts.", uk: "Початкова частина зберігає звичайний порядок; головне речення після неї інвертується.", es: "La oración inicial conserva el orden normal; la oración principal que le sigue se invierte.", pt: "A oração inicial mantém a ordem normal; a oração principal que vem depois se inverte.", fr: "La proposition initiale garde l’ordre normal ; la proposition principale qui suit s’inverse.", de: "Der einleitende Satz behält die normale Ordnung; der folgende Hauptsatz wird invertiert.", it: "La proposizione iniziale mantiene l'ordine normale; la principale che segue si inverte.", pl: "Zdanie wprowadzające zachowuje zwykły szyk; następujące po nim zdanie główne ma szyk przestawny.", tr: "Baştaki cümle olağan sırayı korur; ardından gelen ana cümlede sıra değişir.", id: "Klausa pembuka tetap berurutan biasa; klausa utama sesudahnya diinversi.", vi: "Mệnh đề mở đầu giữ trật tự thường; mệnh đề chính theo sau thì đảo ngữ." }
          - type: rule
            level: C1
            text: { en: ["In ", { term: not only }, " … ", { term: but also }, " only the first clause inverts."], uk: ["У конструкції ", { term: "not only" }, " … ", { term: "but also" }, " інверсія лише в першій частині."], es: ["En ", { term: "not only" }, " … ", { term: "but also" }, " solo se invierte la primera oración."], pt: ["Em ", { term: "not only" }, " … ", { term: "but also" }, " só a primeira oração se inverte."], fr: ["Dans ", { term: "not only" }, " … ", { term: "but also" }, ", seule la première proposition s’inverse."], de: ["Bei ", { term: "not only" }, " … ", { term: "but also" }, " wird nur der erste Satz invertiert."], it: ["In ", { term: "not only" }, " … ", { term: "but also" }, " si inverte solo la prima proposizione."], pl: ["W ", { term: "not only" }, " … ", { term: "but also" }, " tylko pierwsze zdanie ma szyk przestawny."], tr: [{ term: "not only" }, " … ", { term: "but also" }, " yapısında yalnızca ilk cümlede sıra değişir."], id: ["Dalam ", { term: "not only" }, " … ", { term: "but also" }, " hanya klausa pertama yang diinversi."], vi: ["Trong ", { term: "not only" }, " … ", { term: "but also" }, " chỉ mệnh đề đầu đảo ngữ."] }
          - type: note
            level: C1
            text: { en: [{ term: only }, " and ", { term: even }, " in other places are in ", { link: Word Order, to: en.sentence-building.word-order }, "."], uk: ["Про ", { term: "only" }, " та ", { term: "even" }, " в інших позиціях див. ", { link: "Порядок слів", to: en.sentence-building.word-order }, "."], es: ["Para ", { term: "only" }, " y ", { term: "even" }, " en otras posiciones, ver ", { link: "El orden de las palabras", to: en.sentence-building.word-order }, "."], pt: ["Para ", { term: "only" }, " e ", { term: "even" }, " em outras posições, ver ", { link: "Ordem das palavras", to: en.sentence-building.word-order }, "."], fr: ["Pour ", { term: "only" }, " et ", { term: "even" }, " à d’autres places, voir ", { link: "Ordre des mots", to: en.sentence-building.word-order }, "."], de: ["Zu ", { term: "only" }, " und ", { term: "even" }, " an anderen Stellen siehe ", { link: "Wortstellung", to: en.sentence-building.word-order }, "."], it: ["Per ", { term: "only" }, " e ", { term: "even" }, " in altre posizioni, vedi ", { link: "L'ordine delle parole", to: en.sentence-building.word-order }, "."], pl: ["O ", { term: "only" }, " i ", { term: "even" }, " w innych miejscach zob. ", { link: "Szyk zdania", to: en.sentence-building.word-order }, "."], tr: [{ term: "only" }, " ve ", { term: "even" }, " sözcüklerinin diğer konumları için bkz. ", { link: "Sözcük sırası", to: en.sentence-building.word-order }, "."], id: ["Untuk ", { term: "only" }, " dan ", { term: "even" }, " di posisi lain, lihat ", { link: "Urutan kata", to: en.sentence-building.word-order }, "."], vi: ["Về ", { term: "only" }, " và ", { term: "even" }, " ở các vị trí khác, xem ", { link: "Trật tự từ", to: en.sentence-building.word-order }, "."] }

  - title: { en: "So and such", uk: "So і such", es: "So y such", pt: "So e such", fr: "So et such", de: "So und such", it: "So e such", pl: "So i such", tr: "So ve such", id: "So dan such", vi: "So và such" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [so, { slot: adjective }, be, { slot: subject }, that, { slot: clause }] }, ex: [{ target: So tired was she }, " that she fell asleep at once."], tr: { uk: "Так утомилася вона, що відразу заснула.", es: "Tan cansada estaba que se durmió enseguida.", pt: "Tão cansada estava ela que dormiu na mesma hora.", fr: "Si fatiguée était-elle qu’elle s’endormit aussitôt.", de: "So müde war sie, dass sie sofort einschlief.", it: "Tanto era stanca che si addormentò subito.", pl: "Tak zmęczona była, że od razu zasnęła.", tr: "Öyle yorgundu ki hemen uyuyakaldı.", id: "Begitu lelahnya dia sampai langsung tertidur.", vi: "Cô ấy mệt đến mức ngủ thiếp đi ngay." } }
          - { level: C1, form: { pattern: [so, { slot: adverb }, { slot: { en: auxiliary, uk: "допоміжне дієслово", es: "auxiliar", pt: "auxiliar", fr: "auxiliaire", de: "Hilfsverb", it: "ausiliare", pl: "czasownik pomocniczy", tr: "yardımcı fiil", id: "kata kerja bantu", vi: "trợ động từ" } }, { slot: subject }, { slot: verb }, that, { slot: clause }] }, ex: [{ target: So quickly did he run }, " that nobody caught him."], tr: { uk: "Так швидко він біг, що ніхто його не наздогнав.", es: "Tan rápido corrió que nadie lo alcanzó.", pt: "Tão rápido ele correu que ninguém o alcançou.", fr: "Si vite courut-il que personne ne le rattrapa.", de: "So schnell rannte er, dass ihn niemand einholte.", it: "Tanto velocemente corse che nessuno lo raggiunse.", pl: "Tak szybko biegł, że nikt go nie dogonił.", tr: "Öyle hızlı koştu ki kimse onu yakalayamadı.", id: "Begitu cepatnya dia berlari sampai tak seorang pun dapat menangkapnya.", vi: "Anh ấy chạy nhanh đến mức không ai bắt kịp." } }
          - { level: C1, form: { pattern: [such, be, { slot: subject }, that, { slot: clause }] }, ex: [{ target: Such was his anger }, " that he left the room."], tr: { uk: "Такий був його гнів, що він вийшов із кімнати.", es: "Tal era su enojo que salió de la habitación.", pt: "Tamanha era sua raiva que ele saiu da sala.", fr: "Telle fut sa colère qu’il quitta la pièce.", de: "Derart groß war seine Wut, dass er den Raum verließ.", it: "Tale era la sua rabbia che uscì dalla stanza.", pl: "Taka była jego złość, że wyszedł z pokoju.", tr: "Öfkesi öyle büyüktü ki odadan çıktı.", id: "Begitu besar amarahnya sampai dia meninggalkan ruangan.", vi: "Anh ấy giận đến mức bỏ ra khỏi phòng." } }
      - type: list
