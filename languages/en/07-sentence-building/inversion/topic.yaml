        rows:
          - { level: C2, use: { en: ["After ", { term: than }, " in a formal comparison"], uk: ["Після ", { term: "than" }, " в офіційному порівнянні"], es: ["Después de ", { term: "than" }, " en una comparación formal"], pt: ["Depois de ", { term: "than" }, " em uma comparação formal"], fr: ["Après ", { term: "than" }, " dans une comparaison soutenue"], de: ["Nach ", { term: "than" }, " in einem förmlichen Vergleich"], it: ["Dopo ", { term: "than" }, " in un confronto formale"], pl: ["Po ", { term: "than" }, " w formalnym porównaniu"], tr: ["Resmî bir karşılaştırmada ", { term: "than" }, " sonrası"], id: ["Setelah ", { term: "than" }, " dalam perbandingan formal"], vi: ["Sau ", { term: "than" }, " trong so sánh trang trọng"] }, ex: ["Prices rose faster ", { target: than did wages }, "."], tr: { uk: "Ціни зросли швидше, ніж заробітна плата.", es: "Los precios subieron más rápido que los salarios.", pt: "Os preços subiram mais rápido do que os salários.", fr: "Les prix ont augmenté plus vite que ne l’ont fait les salaires.", de: "Die Preise stiegen schneller, als die Löhne es taten.", it: "I prezzi sono cresciuti più rapidamente dei salari.", pl: "Ceny wzrosły szybciej niż płace.", tr: "Fiyatlar, ücretlerin arttığından daha hızlı arttı.", id: "Harga naik lebih cepat daripada upah.", vi: "Giá cả tăng nhanh hơn tiền lương." } }
          - { level: C2, use: { en: ["After ", { term: as }, ", adding a parallel fact"], uk: ["Після ", { term: "as" }, ": додавання паралельного факту"], es: ["Después de ", { term: "as" }, ", para añadir un hecho paralelo"], pt: ["Depois de ", { term: "as" }, ", para acrescentar um fato paralelo"], fr: ["Après ", { term: "as" }, ", pour ajouter un fait parallèle"], de: ["Nach ", { term: "as" }, ", um eine parallele Tatsache anzufügen"], it: ["Dopo ", { term: "as" }, ", per aggiungere un fatto parallelo"], pl: ["Po ", { term: "as" }, ", przy dodaniu równoległego faktu"], tr: [{ term: "as" }, " sonrası, paralel bir bilgi eklemek için"], id: ["Setelah ", { term: "as" }, ", untuk menambah fakta yang sejajar"], vi: ["Sau ", { term: "as" }, ", để thêm một sự việc song song"] }, ex: { examples: [["Tom is tall, ", { target: as is his brother }, "."], ["The company grew, ", { target: as did its profits }, "."]] }, tr: { uk: { examples: ["Том високий, як і його брат.", "Компанія зростала, як і її прибутки."] }, es: { examples: ["Tom es alto, al igual que su hermano.", "La empresa creció, al igual que sus ganancias."] }, pt: { examples: ["Tom é alto, assim como seu irmão.", "A empresa cresceu, assim como seus lucros."] }, fr: { examples: ["Tom est grand, tout comme son frère.", "L’entreprise a grandi, tout comme ses bénéfices."] }, de: { examples: ["Tom ist groß, ebenso wie sein Bruder.", "Das Unternehmen wuchs, ebenso wie seine Gewinne."] }, it: { examples: ["Tom è alto, così come suo fratello.", "L'azienda è cresciuta, così come i suoi profitti."] }, pl: { examples: ["Tom jest wysoki, podobnie jak jego brat.", "Firma rosła, podobnie jak jej zyski."] }, tr: { examples: ["Tom uzun boyludur, kardeşi de öyle.", "Şirket büyüdü, kârları da öyle."] }, id: { examples: ["Tom tinggi, begitu pula saudaranya.", "Perusahaan itu berkembang, begitu pula labanya."] }, vi: { examples: ["Tom cao, em trai anh ấy cũng vậy.", "Công ty phát triển, lợi nhuận cũng vậy."] } } }
          - { level: C2, use: { en: "A tag after a quotation, with a noun subject", uk: "Слова автора після прямої мови з іменниковим підметом", es: "Un inciso después de una cita, con sujeto nominal", pt: "Uma indicação depois da citação, com sujeito substantivo", fr: "Une incise après une citation, avec un sujet nominal", de: "Ein Redebegleitsatz nach dem Zitat, mit Nomen als Subjekt", it: "Un inciso dopo una citazione, con soggetto nominale", pl: "Wtrącenie po cytacie z podmiotem rzeczownikowym", tr: "Alıntıdan sonra gelen ve isim öznesi olan ifade", id: "Keterangan sesudah kutipan, dengan subjek kata benda", vi: "Lời dẫn sau trích dẫn, với chủ ngữ là danh từ" }, ex: { examples: [["“Come in,” ", { target: said Tom }, "."], ["“We will wait,” ", { target: replied the old man }, "."]] }, tr: { uk: { examples: ["«Заходьте», — сказав Том.", "«Ми зачекаємо», — відповів старий."] }, es: { examples: ["«Pasa», dijo Tom.", "«Esperaremos», respondió el anciano."] }, pt: { examples: ["“Entre”, disse Tom.", "“Vamos esperar”, respondeu o velho."] }, fr: { examples: ["« Entrez », dit Tom.", "« Nous attendrons », répondit le vieil homme."] }, de: { examples: ["„Kommen Sie herein“, sagte Tom.", "„Wir warten“, antwortete der alte Mann."] }, it: { examples: ["«Entra», disse Tom.", "«Aspetteremo», rispose il vecchio."] }, pl: { examples: ["„Wejdź” — powiedział Tom.", "„Poczekamy” — odpowiedział starzec."] }, tr: { examples: ["“Gir içeri,” dedi Tom.", "“Bekleyeceğiz,” diye yanıtladı yaşlı adam."] }, id: { examples: ["“Masuklah,” kata Tom.", "“Kami akan menunggu,” jawab lelaki tua itu."] }, vi: { examples: ["“Mời vào,” Tom nói.", "“Chúng tôi sẽ đợi,” ông lão đáp."] } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["The auxiliary after ", { term: than }, " or ", { term: as }, " stands for the verb already mentioned."], uk: ["Допоміжне дієслово після ", { term: "than" }, " чи ", { term: "as" }, " заступає дієслово, яке вже прозвучало."], es: ["El auxiliar después de ", { term: "than" }, " o ", { term: "as" }, " sustituye al verbo ya mencionado."], pt: ["O auxiliar depois de ", { term: "than" }, " ou ", { term: "as" }, " substitui o verbo já mencionado."], fr: ["L’auxiliaire après ", { term: "than" }, " ou ", { term: "as" }, " remplace le verbe déjà mentionné."], de: ["Das Hilfsverb nach ", { term: "than" }, " oder ", { term: "as" }, " steht für das schon genannte Verb."], it: ["L'ausiliare dopo ", { term: "than" }, " o ", { term: "as" }, " sostituisce il verbo già citato."], pl: ["Czasownik pomocniczy po ", { term: "than" }, " lub ", { term: "as" }, " zastępuje czasownik, który już padł."], tr: [{ term: "than" }, " ya da ", { term: "as" }, " sonrasındaki yardımcı fiil, daha önce geçen fiilin yerini tutar."], id: ["Kata kerja bantu setelah ", { term: "than" }, " atau ", { term: "as" }, " mewakili kata kerja yang sudah disebut."], vi: ["Trợ động từ sau ", { term: "than" }, " hoặc ", { term: "as" }, " thay cho động từ đã nhắc đến."] }
          - type: rule
            level: C2
            text: { en: "A pronoun subject comes first in a tag:", uk: "Займенниковий підмет у словах автора стоїть першим:", es: "Un sujeto pronominal va primero en un inciso:", pt: "Um sujeito pronome vem primeiro na indicação:", fr: "Un sujet pronom vient d’abord dans une incise :", de: "Ein Pronomen als Subjekt steht im Redebegleitsatz vorn:", it: "Un soggetto pronome viene per primo nell'inciso:", pl: "Podmiot zaimkowy stoi we wtrąceniu na pierwszym miejscu:", tr: "Zamir özne bu ifadede başta gelir:", id: "Subjek berupa kata ganti berada di depan dalam keterangan ini:", vi: "Chủ ngữ là đại từ đứng trước trong lời dẫn:" }
            ex: ["“Come in,” ", { target: he said }, "."]
            tr: { uk: "«Заходьте», — сказав він.", es: "«Pasa», dijo él.", pt: "“Entre”, disse ele.", fr: "« Entrez », dit-il.", de: "„Kommen Sie herein“, sagte er.", it: "«Entra», disse lui.", pl: "„Wejdź” — powiedział.", tr: "“Gir içeri,” dedi.", id: "“Masuklah,” katanya.", vi: "“Mời vào,” anh ấy nói." }
          - type: rule
            level: C2
            text: { en: ["Speech and plain writing keep the subject first: ", { term: than his brother did }, ", ", { term: as his brother is }, "."], uk: ["Усне мовлення й проста писемна мова ставлять підмет першим: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], es: ["El habla y los textos sencillos ponen el sujeto primero: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], pt: ["A fala e a escrita simples põem o sujeito primeiro: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], fr: ["La langue parlée et les écrits simples mettent le sujet en premier : ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], de: ["Gesprochene Sprache und einfache Schriftsprache stellen das Subjekt voran: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], it: ["Il parlato e la scrittura semplice mettono il soggetto per primo: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], pl: ["Mowa i proste pismo stawiają podmiot na pierwszym miejscu: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], tr: ["Konuşma dili ve sade yazıda özne başta kalır: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], id: ["Ujaran dan tulisan biasa menaruh subjek di depan: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."], vi: ["Lời nói và văn viết thông thường đặt chủ ngữ trước: ", { term: "than his brother did" }, ", ", { term: "as his brother is" }, "."] }
