.", "Voilà ma chance qui s’en va."] }, de: { examples: ["Da kommt der Bus.", "Da geht sie hin, meine Chance."] }, it: { examples: ["Ecco l'autobus.", "Ecco che se ne va la mia occasione."] }, pl: { examples: ["Oto jedzie autobus.", "No i przepadła moja szansa."] }, tr: { examples: ["İşte otobüs geliyor.", "İşte şansım da gitti."] }, id: { examples: ["Nah, itu busnya datang.", "Lenyap sudah kesempatanku."] }, vi: { examples: ["Xe buýt đến rồi kìa.", "Cơ hội của tôi thế là bay mất."] } } }
          - { level: C2, use: { en: "A place phrase with a verb of position", uk: "Вираз місця з дієсловом положення", es: "Una expresión de lugar con un verbo de posición", pt: "Uma expressão de lugar com um verbo de posição", fr: "Un groupe de lieu avec un verbe de position", de: "Eine Ortsangabe mit einem Verb der Lage", it: "Un'espressione di luogo con un verbo di posizione", pl: "Wyrażenie miejsca z czasownikiem położenia", tr: "Konum fiiliyle yer ifadesi", id: "Frasa tempat dengan kata kerja posisi", vi: "Cụm chỉ nơi chốn với động từ chỉ vị trí" }, ex: { examples: [["At the end of the road ", { target: stood }, " an old mill."], ["Beside the window ", { target: sat }, " a sleeping cat."]] }, tr: { uk: { examples: ["Наприкінці дороги стояв старий млин.", "Біля вікна спала кішка."] }, es: { examples: ["Al final del camino se alzaba un viejo molino.", "Junto a la ventana dormitaba un gato."] }, pt: { examples: ["No fim da estrada erguia-se um velho moinho.", "Perto da janela dormia um gato."] }, fr: { examples: ["Au bout de la route se dressait un vieux moulin.", "Près de la fenêtre dormait un chat."] }, de: { examples: ["Am Ende der Straße stand eine alte Mühle.", "Neben dem Fenster saß eine schlafende Katze."] }, it: { examples: ["In fondo alla strada sorgeva un vecchio mulino.", "Accanto alla finestra dormiva un gatto."] }, pl: { examples: ["Na końcu drogi stał stary młyn.", "Obok okna siedział śpiący kot."] }, tr: { examples: ["Yolun sonunda eski bir değirmen duruyordu.", "Pencerenin yanında uyuyan bir kedi oturuyordu."] }, id: { examples: ["Di ujung jalan berdirilah sebuah penggilingan tua.", "Di samping jendela duduklah seekor kucing yang sedang tidur."] }, vi: { examples: ["Cuối con đường sừng sững một nhà máy xay cũ.", "Bên cửa sổ có một con mèo đang ngủ."] } } }
          - { level: C2, use: { en: "A direction word with a verb of motion", uk: "Слово напрямку з дієсловом руху", es: "Una palabra de dirección con un verbo de movimiento", pt: "Uma palavra de direção com um verbo de movimento", fr: "Un mot de direction avec un verbe de mouvement", de: "Ein Richtungswort mit einem Bewegungsverb", it: "Una parola di direzione con un verbo di movimento", pl: "Wyraz kierunku z czasownikiem ruchu", tr: "Hareket fiiliyle yön sözcüğü", id: "Kata arah dengan kata kerja gerak", vi: "Từ chỉ hướng với động từ chỉ chuyển động" }, ex: { examples: [[{ target: Up went }, " the balloon."], [{ target: In came }, " the waiter with the soup."]] }, tr: { uk: { examples: ["Угору злетіла повітряна куля.", "Увійшов офіціант із супом."] }, es: { examples: ["Arriba subió el globo.", "Entró el mesero con la sopa."] }, pt: { examples: ["Para cima subiu o balão.", "Entrou o garçom com a sopa."] }, fr: { examples: ["Vers le ciel s’éleva le ballon.", "Entra le serveur avec la soupe."] }, de: { examples: ["Hoch hinauf stieg der Ballon.", "Herein kam der Kellner mit der Suppe."] }, it: { examples: ["In alto salì il pallone.", "Entrò il cameriere con la zuppa."] }, pl: { examples: ["W górę wzniósł się balon.", "Wszedł kelner z zupą."] }, tr: { examples: ["Yukarı yükseldi balon.", "İçeri çorbayla birlikte garson girdi."] }, id: { examples: ["Ke atas melayanglah balon itu.", "Masuklah pelayan membawa sup."] }, vi: { examples: ["Quả bóng bay vút lên cao.", "Bước vào là người phục vụ, mang theo bát súp."] } } }
