            text: { en: [{ term: neither }, " and ", { term: nor }, " both start a reply; ", { term: nor }, " also joins a second clause to a negative first."], uk: [{ term: "neither" }, " і ", { term: "nor" }, " обидва починають відповідь; ", { term: "nor" }, " ще й додає другу частину до заперечної першої."], es: [{ term: "neither" }, " y ", { term: "nor" }, " abren una respuesta; ", { term: "nor" }, " también une una segunda oración a una primera negativa."], pt: [{ term: "neither" }, " e ", { term: "nor" }, " abrem uma resposta; ", { term: "nor" }, " também liga uma segunda oração a uma primeira negativa."], fr: [{ term: "neither" }, " et ", { term: "nor" }, " ouvrent tous deux une réponse ; ", { term: "nor" }, " relie aussi une seconde proposition à une première négative."], de: [{ term: "neither" }, " und ", { term: "nor" }, " leiten beide eine Antwort ein; ", { term: "nor" }, " verbindet auch einen zweiten Satz mit einem verneinten ersten."], it: [{ term: "neither" }, " e ", { term: "nor" }, " aprono entrambi una risposta; ", { term: "nor" }, " collega anche una seconda proposizione a una prima negativa."], pl: [{ term: "neither" }, " i ", { term: "nor" }, " otwierają odpowiedź; ", { term: "nor" }, " łączy też drugie zdanie z pierwszym przeczącym."], tr: [{ term: "neither" }, " ve ", { term: "nor" }, " ikisi de yanıtı başlatır; ", { term: "nor" }, " ayrıca olumsuz birinci cümleye ikinci bir cümle bağlar."], id: [{ term: "neither" }, " dan ", { term: "nor" }, " sama-sama membuka jawaban; ", { term: "nor" }, " juga menyambung klausa kedua ke klausa pertama yang negatif."], vi: [{ term: "neither" }, " và ", { term: "nor" }, " đều mở đầu câu trả lời; ", { term: "nor" }, " còn nối mệnh đề thứ hai với mệnh đề đầu phủ định."] }

