summary:
  lead:
    en: ["The auxiliary before the subject after ", { term: never }, ", ", { term: rarely }, ", ", { term: not only }, " and ", { term: no sooner }, "; place words, complements and objects fronted for emphasis."]
    uk: ["Допоміжне дієслово перед підметом після ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " і ", { term: "no sooner" }, "; для підсилення на початок виносять слова місця, доповнення й додатки."]
    es: ["El auxiliar antes del sujeto tras ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " y ", { term: "no sooner" }, "; palabras de lugar, complementos y objetos al inicio, por énfasis."]
    pt: ["O auxiliar antes do sujeito após ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " e ", { term: "no sooner" }, "; palavras de lugar, complementos e objetos no início, por ênfase."]
    fr: ["L’auxiliaire avant le sujet après ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " et ", { term: "no sooner" }, " ; mots de lieu, attributs et compléments en tête, pour insister."]
    de: ["Das Hilfsverb steht vor dem Subjekt nach ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " und ", { term: "no sooner" }, "; Ortsadverbien, Prädikative und Objekte stehen zur Betonung voran."]
    it: ["L'ausiliare precede il soggetto dopo ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " e ", { term: "no sooner" }, "; parole di luogo, predicativi e complementi in testa per enfasi."]
    pl: ["Czasownik pomocniczy przed podmiotem po ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " i ", { term: "no sooner" }, "; wyrazy miejsca, uzupełnienia i dopełnienia na początku zdania dla podkreślenia."]
    tr: ["Yardımcı fiil, ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, " ve ", { term: "no sooner" }, " sonrasında özneden önce gelir; yer sözcükleri, tümleçler ve nesneler vurgu için başa alınır."]
    id: ["Kata kerja bantu mendahului subjek setelah ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, ", dan ", { term: "no sooner" }, "; kata tempat, pelengkap, dan objek dikedepankan untuk penekanan."]
    vi: ["Trợ động từ trước chủ ngữ sau ", { term: "never" }, ", ", { term: "rarely" }, ", ", { term: "not only" }, ", ", { term: "no sooner" }, "; nơi chốn, bổ ngữ, tân ngữ lên đầu nhấn mạnh."]
  rule:
    en: "After a fronted negative adverbial the auxiliary comes before the subject, as in a question:"
    uk: "Після заперечної обставини на початку речення допоміжне дієслово стоїть перед підметом, як у питанні:"
    es: "Tras un complemento circunstancial negativo inicial, el auxiliar precede al sujeto, como en una pregunta:"
    pt: "Após um adjunto adverbial negativo inicial, o auxiliar precede o sujeito, como numa pergunta:"
    fr: "Après un complément circonstanciel négatif en tête, l’auxiliaire précède le sujet, comme dans une question :"
    de: "Nach einer vorangestellten negativen Adverbiale steht das Hilfsverb vor dem Subjekt, wie in einer Frage:"
    it: "Dopo un complemento circostanziale negativo in testa alla frase, l'ausiliare precede il soggetto, come in una domanda:"
    pl: "Po okoliczniku przeczącym na początku zdania czasownik pomocniczy stoi przed podmiotem, jak w pytaniu:"
    tr: "Başa alınan olumsuz bir zarf tümlecinden sonra yardımcı fiil, soruda olduğu gibi özneden önce gelir:"
    id: "Setelah keterangan negatif di awal kalimat, kata kerja bantu berada di depan subjek, seperti dalam pertanyaan:"
    vi: "Sau trạng ngữ phủ định đầu câu, trợ động từ trước chủ ngữ như câu hỏi:"
  ex: { examples: [[{ target: Never have I }, " seen such a crowd."], [{ target: Rarely does she }, " complain."]] }

