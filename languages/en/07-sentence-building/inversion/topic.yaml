          - { level: C1, row: { en: Frequency, uk: "Частотність", es: "Frecuencia", pt: "Frequência", fr: "Fréquence", de: "Häufigkeit", it: "Frequenza", pl: "Częstotliwość", tr: "Sıklık", id: "Frekuensi", vi: "Tần suất" }, inv: { ex: [{ target: Never have I }, " seen such a crowd."], tr: { uk: "Такого натовпу я ще ніколи не бачив.", es: "Jamás he visto una multitud así.", pt: "Jamais vi uma multidão assim.", fr: "Jamais je n’ai vu pareille foule.", de: "Noch nie habe ich eine solche Menschenmenge gesehen.", it: "Una folla così non l'ho mai vista.", pl: "Takiego tłumu jeszcze nigdy nie widziałem.", tr: "Böyle bir kalabalığı daha önce hiç görmedim.", id: "Belum pernah saya melihat kerumunan seperti ini.", vi: "Chưa bao giờ tôi thấy một đám đông như thế." } }, normal: { ex: ["I have ", { target: never }, " seen such a crowd."], tr: { uk: "Я ніколи не бачив такого натовпу.", es: "Nunca he visto una multitud así.", pt: "Eu nunca vi uma multidão assim.", fr: "Je n’ai jamais vu une telle foule.", de: "Ich habe noch nie eine solche Menschenmenge gesehen.", it: "Non ho mai visto una folla simile.", pl: "Nigdy nie widziałem takiego tłumu.", tr: "Hiç böyle bir kalabalık görmedim.", id: "Saya belum pernah melihat kerumunan seperti ini.", vi: "Tôi chưa bao giờ thấy một đám đông như thế." } } }
          - { level: C1, row: { en: Place, uk: "Місце", es: "Lugar", pt: "Lugar", fr: "Lieu", de: "Ort", it: "Luogo", pl: "Miejsce", tr: "Yer", id: "Tempat", vi: "Nơi chốn" }, inv: { ex: [{ target: Nowhere else could we }, " find fresh bread."], tr: { uk: "Ніде більше ми не могли знайти свіжого хліба.", es: "En ningún otro lugar pudimos encontrar pan fresco.", pt: "Em nenhum outro lugar conseguíamos encontrar pão fresco.", fr: "Nulle part ailleurs nous ne pouvions trouver du pain frais.", de: "Nirgendwo sonst konnten wir frisches Brot finden.", it: "In nessun altro posto potevamo trovare pane fresco.", pl: "Nigdzie indziej nie mogliśmy znaleźć świeżego chleba.", tr: "Başka hiçbir yerde taze ekmek bulamazdık.", id: "Di tempat lain mana pun kami tidak bisa menemukan roti segar.", vi: "Không nơi nào khác chúng tôi có thể tìm được bánh mì tươi." } }, normal: { ex: ["We couldn't find fresh bread ", { target: anywhere else }, "."], tr: { uk: "Ми не могли знайти свіжого хліба більше ніде.", es: "No pudimos encontrar pan fresco en ningún otro lugar.", pt: "Não conseguíamos encontrar pão fresco em nenhum outro lugar.", fr: "Nous ne pouvions trouver du pain frais nulle part ailleurs.", de: "Wir konnten nirgendwo sonst frisches Brot finden.", it: "Non potevamo trovare pane fresco in nessun altro posto.", pl: "Nie mogliśmy znaleźć świeżego chleba nigdzie indziej.", tr: "Taze ekmeği başka hiçbir yerde bulamadık.", id: "Kami tidak bisa menemukan roti segar di tempat lain.", vi: "Chúng tôi không thể tìm được bánh mì tươi ở nơi nào khác." } } }
          - { level: C1, row: { en: Addition, uk: "Додавання", es: "Adición", pt: "Acréscimo", fr: "Ajout", de: "Ergänzung", it: "Aggiunta", pl: "Dodawanie", tr: "Ekleme", id: "Penambahan", vi: "Bổ sung" }, inv: { ex: [{ target: Not only did she }, " win, but she also set a record."], tr: { uk: "Мало того що вона перемогла — вона ще й встановила рекорд.", es: "No solo ganó, sino que además estableció un récord.", pt: "Ela não só venceu, como ainda bateu um recorde.", fr: "Non seulement elle a gagné, mais elle a aussi établi un record.", de: "Nicht nur hat sie gewonnen, sondern sie hat auch einen Rekord aufgestellt.", it: "Non solo ha vinto, ma ha anche stabilito un record.", pl: "Nie dość, że wygrała, to jeszcze pobiła rekord.", tr: "Sadece kazanmakla kalmadı, bir de rekor kırdı.", id: "Bukan hanya menang, dia juga memecahkan rekor.", vi: "Không những thắng cuộc, cô ấy còn lập kỷ lục." } }, normal: { ex: ["She ", { target: not only }, " won, but also set a record."], tr: { uk: "Вона не тільки перемогла, а й встановила рекорд.", es: "No solo ganó, sino que también estableció un récord.", pt: "Ela não só venceu, mas também bateu um recorde.", fr: "Elle n’a pas seulement gagné, elle a aussi établi un record.", de: "Sie hat nicht nur gewonnen, sondern auch einen Rekord aufgestellt.", it: "Non ha solo vinto, ma ha anche stabilito un record.", pl: "Nie tylko wygrała, ale też pobiła rekord.", tr: "Hem kazandı, hem de rekor kırdı.", id: "Dia tidak hanya menang, tetapi juga memecahkan rekor.", vi: "Cô ấy không chỉ thắng cuộc mà còn lập kỷ lục." } } }

