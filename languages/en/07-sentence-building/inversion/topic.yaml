            level: C2
            text: { en: ["The full verb moves before a noun subject, with no ", { term: do }, "."], uk: ["Основне дієслово йде перед іменниковим підметом, без ", { term: "do" }, "."], es: ["El verbo principal pasa antes de un sujeto nominal, sin ", { term: "do" }, "."], pt: ["O verbo principal vai antes de um sujeito substantivo, sem ", { term: "do" }, "."], fr: ["Le verbe principal passe avant un sujet nominal, sans ", { term: "do" }, "."], de: ["Das Vollverb steht vor einem Nomen als Subjekt, ohne ", { term: "do" }, "."], it: ["Il verbo principale precede un soggetto nominale, senza ", { term: "do" }, "."], pl: ["Czasownik główny stoi przed podmiotem rzeczownikowym, bez ", { term: "do" }, "."], tr: ["Ana fiil, isim özneden önce gelir; ", { term: "do" }, " kullanılmaz."], id: ["Kata kerja utama berpindah ke depan subjek kata benda, tanpa ", { term: "do" }, "."], vi: ["Động từ chính đứng trước chủ ngữ là danh từ, không dùng ", { term: "do" }, "."] }
          - type: rule
            level: C2
            text: { en: "Verbs of position and motion fit best: stand, sit, lie, come, go, run and fall.", uk: ["Найкраще пасують дієслова положення й руху: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " і ", { term: "fall" }, "."], es: ["Los verbos de posición y movimiento van mejor: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " y ", { term: "fall" }, "."], pt: ["Os verbos de posição e movimento combinam melhor: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " e ", { term: "fall" }, "."], fr: ["Les verbes de position et de mouvement conviennent le mieux : ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " et ", { term: "fall" }, "."], de: ["Am besten passen Verben der Lage und der Bewegung: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " und ", { term: "fall" }, "."], it: ["I verbi di posizione e di movimento vanno meglio: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " e ", { term: "fall" }, "."], pl: ["Najlepiej pasują czasowniki położenia i ruchu: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " i ", { term: "fall" }, "."], tr: ["En uygun olanlar konum ve hareket fiilleridir: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " ve ", { term: "fall" }, "."], id: ["Kata kerja posisi dan gerak paling cocok: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, ", dan ", { term: "fall" }, "."], vi: ["Động từ chỉ vị trí và chuyển động thích hợp nhất: ", { term: "stand" }, ", ", { term: "sit" }, ", ", { term: "lie" }, ", ", { term: "come" }, ", ", { term: "go" }, ", ", { term: "run" }, " và ", { term: "fall" }, "."] }
          - type: rule
            level: C2
            text: { en: "Stories, descriptions and stage directions use this order to set a scene.", uk: "Оповідання, описи й ремарки вживають цей порядок слів, щоб створити сцену.", es: "Los relatos, las descripciones y las acotaciones usan este orden para crear una escena.", pt: "Narrativas, descrições e rubricas usam essa ordem para compor uma cena.", fr: "Les récits, les descriptions et les didascalies emploient cet ordre pour planter un décor.", de: "Erzählungen, Beschreibungen und Regieanweisungen nutzen diese Ordnung, um eine Szene zu setzen.", it: "Racconti, descrizioni e didascalie usano quest'ordine per costruire una scena.", pl: "Opowiadania, opisy i didaskalia używają tego szyku, by nakreślić scenę.", tr: "Hikâyeler, betimlemeler ve sahne yönergeleri bu sırayı bir sahneyi kurmak için kullanır.", id: "Cerita, deskripsi, dan petunjuk panggung memakai urutan ini untuk membangun suasana.", vi: "Truyện, đoạn miêu tả và chỉ dẫn sân khấu dùng trật tự này để dựng cảnh." }

