            text: { en: [{ term: so }, " and ", { term: such }, " in normal order are in ", { link: "Too, Enough, So and Such", to: en.adjectives-adverbs.too-enough-so-such }, "."], uk: ["Про ", { term: "so" }, " та ", { term: "such" }, " у звичайному порядку слів див. ", { link: "Too, enough, so і such", to: en.adjectives-adverbs.too-enough-so-such }, "."], es: ["Para ", { term: "so" }, " y ", { term: "such" }, " en orden normal, ver ", { link: "Too, enough, so y such", to: en.adjectives-adverbs.too-enough-so-such }, "."], pt: ["Para ", { term: "so" }, " e ", { term: "such" }, " em ordem normal, ver ", { link: "Too, enough, so e such", to: en.adjectives-adverbs.too-enough-so-such }, "."], fr: ["Pour ", { term: "so" }, " et ", { term: "such" }, " dans l’ordre normal, voir ", { link: "Too, enough, so et such", to: en.adjectives-adverbs.too-enough-so-such }, "."], de: ["Zu ", { term: "so" }, " und ", { term: "such" }, " in normaler Wortstellung siehe ", { link: "Too, enough, so und such", to: en.adjectives-adverbs.too-enough-so-such }, "."], it: ["Per ", { term: "so" }, " e ", { term: "such" }, " nell'ordine normale, vedi ", { link: "Too, enough, so e such", to: en.adjectives-adverbs.too-enough-so-such }, "."], pl: ["O ", { term: "so" }, " i ", { term: "such" }, " w zwykłym szyku zob. ", { link: "Too, enough, so i such", to: en.adjectives-adverbs.too-enough-so-such }, "."], tr: ["Olağan sıradaki ", { term: "so" }, " ve ", { term: "such" }, " için bkz. ", { link: "Too, enough, so ve such", to: en.adjectives-adverbs.too-enough-so-such }, "."], id: ["Untuk ", { term: "so" }, " dan ", { term: "such" }, " dalam urutan biasa, lihat ", { link: "Too, enough, so, dan such", to: en.adjectives-adverbs.too-enough-so-such }, "."], vi: ["Về ", { term: "so" }, " và ", { term: "such" }, " ở trật tự thường, xem ", { link: "Too, Enough, So và Such", to: en.adjectives-adverbs.too-enough-so-such }, "."] }

