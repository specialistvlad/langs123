        rows:
          - { level: C1, use: { en: "Agreeing with a negative statement", uk: "Згода із заперечним реченням", es: "Estar de acuerdo con una oración negativa", pt: "Concordar com uma frase negativa", fr: "Être d’accord avec une phrase négative", de: "Zustimmung zu einer verneinten Aussage", it: "Essere d'accordo con una frase negativa", pl: "Zgoda z wypowiedzią przeczącą", tr: "Olumsuz bir cümleye katılma", id: "Menyetujui pernyataan negatif", vi: "Đồng ý với một câu phủ định" }, ex: { exchange: ["I don't like it.", [{ target: Neither do I }, "."]] }, tr: { uk: "Мені це не подобається. — Мені теж ні.", es: "No me gusta. — A mí tampoco.", pt: "Eu não gosto. — Nem eu.", fr: "Je n’aime pas ça. — Moi non plus.", de: "Ich mag es nicht. — Ich auch nicht.", it: "Non mi piace. — Neanche a me.", pl: "Nie podoba mi się to. — Mnie też nie.", tr: "Hoşlanmıyorum. — Ben de.", id: "Saya tidak suka. — Saya juga tidak.", vi: "Tôi không thích nó. — Tôi cũng không." } }
          - { level: C1, use: { en: "Adding a second negative to a negative clause", uk: "Додавання другого заперечення до заперечного речення", es: "Añadir una segunda negación a una oración negativa", pt: "Acrescentar uma segunda negação a uma oração negativa", fr: "Ajouter une seconde négation à une proposition négative", de: "Eine zweite Verneinung an einen verneinten Satz anfügen", it: "Aggiungere una seconda negazione a una proposizione negativa", pl: "Dodanie drugiego przeczenia do zdania przeczącego", tr: "Olumsuz bir cümleye ikinci bir olumsuzluk ekleme", id: "Menambahkan negasi kedua pada klausa negatif", vi: "Thêm một phủ định thứ hai vào mệnh đề phủ định" }, ex: ["He didn't call, ", { target: nor did he }, " write."], tr: { uk: "Він не подзвонив, та й не написав.", es: "No llamó, ni tampoco escribió.", pt: "Ele não ligou, nem escreveu.", fr: "Il n’a pas appelé, pas plus qu’il n’a écrit.", de: "Er hat weder angerufen noch geschrieben.", it: "Non ha telefonato, né ha scritto.", pl: "Nie zadzwonił ani nie napisał.", tr: "Aramadı, yazmadı da.", id: "Dia tidak menelepon, tidak pula menulis.", vi: "Anh ấy không gọi điện, cũng chẳng viết thư." } }
          - { level: C1, use: { en: "Continuing a negative point in a new sentence", uk: "Продовження заперечної думки в новому реченні", es: "Continuar una idea negativa en una oración nueva", pt: "Continuar uma ideia negativa em uma nova frase", fr: "Poursuivre une idée négative dans une nouvelle phrase", de: "Einen verneinten Gedanken im neuen Satz fortführen", it: "Proseguire un concetto negativo in una nuova frase", pl: "Kontynuacja myśli przeczącej w nowym zdaniu", tr: "Olumsuz bir düşünceyi yeni bir cümlede sürdürme", id: "Melanjutkan hal negatif dalam kalimat baru", vi: "Tiếp tục ý phủ định trong một câu mới" }, ex: ["The plan was risky. ", { target: Nor was it }, " cheap."], tr: { uk: "План був ризикований. Та й дешевим він не був.", es: "El plan era arriesgado. Tampoco era barato.", pt: "O plano era arriscado. Nem era barato.", fr: "Le projet était risqué. Il n’était pas non plus bon marché.", de: "Der Plan war riskant. Billig war er auch nicht.", it: "Il piano era rischioso. E non era nemmeno economico.", pl: "Plan był ryzykowny. Nie był też tani.", tr: "Plan riskliydi. Ucuz da değildi.", id: "Rencana itu berisiko. Tidak pula murah.", vi: "Kế hoạch này rủi ro. Cũng không rẻ." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["The auxiliary matches the first clause: ", { term: be }, ", ", { term: have }, " or a modal as there; ", { term: do }, ", ", { term: does }, " or ", { term: did }, " otherwise."], uk: ["Допоміжне дієслово таке, як у першій частині: ", { term: "be" }, ", ", { term: "have" }, " або модальне; інакше ", { term: "do" }, ", ", { term: "does" }, " чи ", { term: "did" }, "."], es: ["El auxiliar repite el de la primera oración: ", { term: "be" }, ", ", { term: "have" }, " o un modal; si no, ", { term: "do" }, ", ", { term: "does" }, " o ", { term: "did" }, "."], pt: ["O auxiliar repete o da primeira oração: ", { term: "be" }, ", ", { term: "have" }, " ou um modal; caso contrário, ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }, "."], fr: ["L’auxiliaire reprend celui de la première proposition : ", { term: "be" }, ", ", { term: "have" }, " ou un modal ; sinon ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }, "."], de: ["Das Hilfsverb entspricht dem des ersten Satzes: ", { term: "be" }, ", ", { term: "have" }, " oder ein Modalverb; sonst ", { term: "do" }, ", ", { term: "does" }, " oder ", { term: "did" }, "."], it: ["L'ausiliare è quello della prima proposizione: ", { term: "be" }, ", ", { term: "have" }, " o un modale; altrimenti ", { term: "do" }, ", ", { term: "does" }, " o ", { term: "did" }, "."], pl: ["Czasownik pomocniczy jak w pierwszym zdaniu: ", { term: "be" }, ", ", { term: "have" }, " lub modalny; w pozostałych wypadkach ", { term: "do" }, ", ", { term: "does" }, " lub ", { term: "did" }, "."], tr: ["Yardımcı fiil ilk cümleyle aynıdır: ", { term: "be" }, ", ", { term: "have" }, " ya da bir modal; yoksa ", { term: "do" }, ", ", { term: "does" }, " veya ", { term: "did" }, "."], id: ["Kata kerja bantu sama dengan klausa pertama: ", { term: "be" }, ", ", { term: "have" }, ", atau modal; jika tidak, ", { term: "do" }, ", ", { term: "does" }, ", atau ", { term: "did" }, "."], vi: ["Trợ động từ giống mệnh đề