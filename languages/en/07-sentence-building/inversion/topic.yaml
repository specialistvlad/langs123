            level: C1
            text: { en: ["The ", { term: that }, " clause gives the result and keeps normal order."], uk: ["Частина з ", { term: "that" }, " називає наслідок і зберігає звичайний порядок слів."], es: ["La oración con ", { term: "that" }, " da el resultado y conserva el orden normal."], pt: ["A oração com ", { term: "that" }, " dá o resultado e mantém a ordem normal."], fr: ["La proposition en ", { term: "that" }, " donne le résultat et garde l’ordre normal."], de: ["Der ", { term: "that" }, "-Satz nennt das Ergebnis und behält die normale Ordnung."], it: ["La proposizione con ", { term: "that" }, " indica il risultato e mantiene l'ordine normale."], pl: ["Zdanie z ", { term: "that" }, " podaje skutek i zachowuje zwykły szyk."], tr: [{ term: "that" }, " cümlesi sonucu verir ve olağan sırayı korur."], id: ["Klausa ", { term: "that" }, " menyatakan hasil dan tetap berurutan biasa."], vi: ["Mệnh đề ", { term: "that" }, " nêu kết quả và giữ trật tự thường."] }
