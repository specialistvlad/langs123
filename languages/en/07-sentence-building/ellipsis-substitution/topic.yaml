          - { level: C1, use: { en: "The subject and the helper of a question", uk: "Підмет і допоміжне дієслово питання", es: "El sujeto y el auxiliar de una pregunta", pt: "O sujeito e o auxiliar de uma pergunta", fr: "Le sujet et l’auxiliaire d’une question", de: "Das Subjekt und das Hilfsverb einer Frage", it: "Il soggetto e l'ausiliare di una domanda", pl: "Podmiot i czasownik pomocniczy w pytaniu", tr: "Bir sorunun öznesi ve yardımcı fiili", id: "Subjek dan kata kerja bantu dalam pertanyaan", vi: "Chủ ngữ và trợ động từ của một câu hỏi" }, ex: { equivalence: [[{ target: "Seen him" }, "?"], "Have you seen him?"] }, tr: { uk: { equivalence: ["Бачив його?", "Ти бачив його?"] }, es: { equivalence: ["¿Lo viste?", "¿Tú lo viste?"] }, pt: { equivalence: ["Viu ele?", "Você viu ele?"] }, fr: { equivalence: ["Tu l’as vu ?", "L’as-tu vu ?"] }, de: { equivalence: ["Ihn gesehen?", "Hast du ihn gesehen?"] }, it: { equivalence: ["L'hai visto?", "Tu l'hai visto?"] }, pl: { equivalence: ["Widziałeś go?", "Czy go widziałeś?"] }, tr: { equivalence: ["Onu gördün mü?", "Sen onu gördün mü?"] }, id: { equivalence: ["Sudah lihat dia?", "Apakah kamu sudah melihatnya?"] }, vi: { equivalence: ["Thấy anh ấy chưa?", "Bạn đã thấy anh ấy chưa?"] } } }
          - { level: C1, use: { en: ["The subject and the helper before ", { term: got }], uk: ["Підмет і допоміжне дієслово перед ", { term: "got" }], es: ["El sujeto y el auxiliar antes de ", { term: "got" }], pt: ["O sujeito e o auxiliar antes de ", { term: "got" }], fr: ["Le sujet et l’auxiliaire avant ", { term: "got" }], de: ["Das Subjekt und das Hilfsverb vor ", { term: "got" }], it: ["Il soggetto e l'ausiliare prima di ", { term: "got" }], pl: ["Podmiot i czasownik pomocniczy przed ", { term: "got" }], tr: [{ term: "got" }, " öncesinde özne ve yardımcı fiil"], id: ["Subjek dan kata kerja bantu sebelum ", { term: "got" }], vi: ["Chủ ngữ và trợ động từ trước ", { term: "got" }] }, ex: { equivalence: [[{ target: "Got a minute" }, "?"], "Have you got a minute?"] }, tr: { uk: { equivalence: ["Є хвилинка?", "У тебе є хвилинка?"] }, es: { equivalence: ["¿Un minuto?", "¿Tienes un minuto?"] }, pt: { equivalence: ["Um minutinho?", "Você tem um minutinho?"] }, fr: { equivalence: ["Une minute ?", "Tu as une minute ?"] }, de: { equivalence: ["Kurz Zeit?", "Hast du kurz Zeit?"] }, it: { equivalence: ["Un minuto?", "Hai un minuto?"] }, pl: { equivalence: ["Masz chwilę?", "Czy masz chwilę?"] }, tr: { equivalence: ["Bir dakika?", "Bir dakikan var mı?"] }, id: { equivalence: ["Ada waktu sebentar?", "Apakah kamu punya waktu sebentar?"] }, vi: { equivalence: ["Rảnh chút không?", "Bạn có rảnh một chút không?"] } } }
          - { level: C1, use: { en: ["The subject and ", { term: do }, " before the verb"], uk: ["Підмет і ", { term: "do" }, " перед дієсловом"], es: ["El sujeto y ", { term: "do" }, " antes del verbo"], pt: ["O sujeito e ", { term: "do" }, " antes do verbo"], fr: ["Le sujet et ", { term: "do" }, " avant le verbe"], de: ["Das Subjekt und ", { term: "do" }, " vor dem Verb"], it: ["Il soggetto e ", { term: "do" }, " prima del verbo"], pl: ["Podmiot i ", { term: "do" }, " przed czasownikiem"], tr: ["Fiilden önce özne ve ", { term: "do" }], id: ["Subjek dan ", { term: "do" }, " sebelum kata kerja"], vi: ["Chủ ngữ và ", { term: "do" }, " trước động từ"] }, ex: { equivalence: [[{ target: "Want some" }, "?"], "Do you want some?"] }, tr: { uk: { equivalence: ["Хочеш трохи?", "Ти хочеш трохи?"] }, es: { equivalence: ["¿Un poco?", "¿Quieres un poco?"] }, pt: { equivalence: ["Quer um pouco?", "Você quer um pouco?"] }, fr: { equivalence: ["Un peu ?", "Tu en veux ?"] }, de: { equivalence: ["Etwas davon?", "Möchtest du etwas davon?"] }, it: { equivalence: ["Un po'?", "Ne vuoi un po'?"] }, pl: { equivalence: ["Trochę?", "Chcesz trochę?"] }, tr: { equivalence: ["Biraz?", "Biraz ister misin?"] }, id: { equivalence: ["Mau sedikit?", "Apakah kamu mau sedikit?"] }, vi: { equivalence: ["Muốn một ít không?", "Bạn có muốn một ít không?"] } } }
          - { level: C1, use: { en: "The subject of a statement", uk: "Підмет розповідного речення", es: "El sujeto de una oración enunciativa", pt: "O sujeito de uma afirmação", fr: "Le sujet d’une affirmation", de: "Das Subjekt einer Aussage", it: "Il soggetto di un'affermazione", pl: "Podmiot zdania oznajmującego", tr: "Bildirme cümlesinin öznesi", id: "Subjek sebuah pernyataan", vi: "Chủ ngữ của câu trần thuật" }, ex: { examples: [{ equivalence: [[{ target: "Sounds good" }, "."], "That sounds good."] }, { equivalence: [[{ target: "No idea" }, "."], "I have no idea."] }] }, tr: { uk: { examples: [{ equivalence: ["Гарна ідея.", "Це гарна ідея."] }, { equivalence: ["Поняття не маю.", "Я не маю жодного поняття."] }] }, es: { examples: [{ equivalence: ["Suena bien.", "Eso suena bien."] }, { equivalence: ["Ni idea.", "No tengo ni idea."] }] }, pt: { examples: [{ equivalence: ["Boa ideia.", "Essa é uma boa ideia."] }, { equivalence: ["Não faço ideia.", "Eu não faço a menor ideia."] }] }, fr: { examples: [{ equivalence: ["Bonne idée.", "C’est une bonne idée."] }, { equivalence: ["Aucune idée.", "Je n’en ai aucune idée."] }] }, de: { examples: [{ equivalence: ["Klingt gut.", "Das klingt gut."] }, { equivalence: ["Keine Ahnung.", "Ich habe keine Ahnung."] }] }, it: { examples: [{ equivalence: ["Ottima idea.", "È un'ottima idea."] }, { equivalence: ["Nessuna idea.", "Non ho nessuna idea."] }] }, pl: { examples: [{ equivalence: ["Brzmi dobrze.", "To brzmi dobrze."] }, { equivalence: ["Pojęcia nie mam.", "Nie mam żadnego pojęcia."] }] }, tr: { examples: [{ equivalence: ["Kulağa hoş geliyor.", "Bu kulağa hoş geliyor."] }, { equivalence: ["Fikrim yok.", "Hiçbir fikrim yok."] }] }, id: { examples: [{ equivalence: ["Kedengarannya bagus.", "Itu kedengarannya bagus."] }, { equivalence: ["Tidak ada ide.", "Saya tidak punya ide."] }] }, vi: { examples: [{ equivalence: ["Nghe hay đấy.", "Điều đó nghe hay đấy."] }, { equivalence: ["Không biết.", "Tôi không biết gì cả."] }] } } }
          - { level: C1, use: { en: ["A diary or note: the subject, mostly ", { term: I }], uk: ["Щоденник або нотатка: підмет, найчастіше ", { term: "I" }], es: ["Un diario o una nota: el sujeto, sobre todo ", { term: "I" }], pt: ["Um diário ou uma anotação: o sujeito, em geral ", { term: "I" }], fr: ["Un journal intime ou une note : le sujet, surtout ", { term: "I" }], de: ["Ein Tagebuch oder eine Notiz: das Subjekt, meist ", { term: "I" }], it: ["Un diario o un appunto: il soggetto, per lo più ", { term: "I" }], pl: ["Pamiętnik lub notatka: podmiot, najczęściej ", { term: "I" }], tr: ["Günlük ya da not: özne, çoğunlukla ", { term: "I" }], id: ["Buku harian atau catatan: subjek, terutama ", { term: "I" }], vi: ["Nhật ký hoặc ghi chú: chủ ngữ, nhất là ", { term: "I" }] }, ex: { target: "Missed the bus. Walked to work." }, tr: { uk: "Спізнився на автобус. Пішов на роботу пішки.", es: "Perdí el autobús. Fui caminando al trabajo.", pt: "Perdi o ônibus. Fui a pé para o trabalho.", fr: "Raté le bus. Allé au travail à pied.", de: "Bus verpasst. Zu Fuß zur Arbeit gegangen.", it: "Perso l'autobus. Andato al lavoro a piedi.", pl: "Spóźniłem się na autobus. Poszedłem do pracy pieszo.", tr: "Otobüsü kaçırdım. İşe yürüyerek gittim.", id: "Ketinggalan bus. Jalan kaki ke kantor.", vi: "Lỡ xe buýt. Đi bộ đến chỗ làm." } }
          - { level: C1, use: { en: ["A headline: the articles and ", { term: be }], uk: ["Заголовок: артиклі та ", { term: "be" }], es: ["Un titular: los artículos y ", { term: "be" }], pt: ["Uma manchete: os artigos e ", { term: "be" }], fr: ["Un titre de presse : les articles et ", { term: "be" }], de: ["Eine Schlagzeile: die Artikel und ", { term: "be" }], it: ["Un titolo di giornale: gli articoli e ", { term: "be" }], pl: ["Nagłówek prasowy: rodzajniki i ", { term: "be" }], tr: ["Bir manşet: artikeller ve ", { term: "be" }], id: ["Judul berita: artikel dan ", { term: "be" }], vi: ["Tiêu đề báo: mạo từ và ", { term: "be" }] }, ex: { examples: [{ target: "Storm hits coast" }, { target: "Minister to resign" }] }, tr: { uk: { examples: ["Шторм накриває узбережжя", "Міністр піде у відставку"] }, es: { examples: ["Tormenta golpea la costa", "Ministro renunciará"] }, pt: { examples: ["Tempestade atinge o litoral", "Ministro vai renunciar"] }, fr: { examples: ["Tempête sur la côte", "Le ministre va démissionner"] }, de: { examples: ["Sturm trifft Küste", "Minister vor Rücktritt"] }, it: { examples: ["Tempesta colpisce la costa", "Ministro verso le dimissioni"] }, pl: { examples: ["Burza uderza w wybrzeże", "Minister poda się do dymisji"] }, tr: { examples: ["Fırtına kıyıyı vurdu", "Bakan istifa edecek"] }, id: { examples: ["Badai menghantam pesisir", "Menteri akan mengundurkan diri"] }, vi: { examples: ["Bão đổ bộ vào bờ biển", "Bộ trưởng sẽ từ chức"] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["Speakers drop only what the situation supplies, from the start of a clause: ", { term: I }, ", ", { term: you }, ", ", { term: it }, ", the first auxiliary."], uk: ["Мовці випускають лише те, що підказує ситуація, з початку речення: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", перше допоміжне дієслово."], es: ["Los hablantes omiten solo lo que aporta la situación, desde el comienzo de la oración: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", el primer auxiliar."], pt: ["Os falantes omitem só o que a situação fornece, a partir do início da oração: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", o primeiro auxiliar."], fr: ["Les locuteurs n’omettent que ce que la situation fournit, au début de la proposition : ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", le premier auxiliaire."], de: ["Sprecher lassen nur weg, was die Situation liefert, und zwar am Satzanfang: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", das erste Hilfsverb."], it: ["I parlanti omettono solo ciò che la situazione fornisce, dall'inizio della proposizione: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", il primo ausiliare."], pl: ["Mówiący pomijają tylko to, co podpowiada sytuacja, od początku zdania: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", pierwszy czasownik pomocniczy."], tr: ["Konuşanlar yalnızca durumun sağladığını, cümlenin başından başlayarak düşürür: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", ilk yardımcı fiil."], id: ["Penutur hanya menghilangkan apa yang sudah jelas dari situasi, mulai dari awal klausa: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", kata kerja bantu pertama."], vi: ["Người nói chỉ bỏ những gì tình huống đã cho biết, từ đầu mệnh đề: ", { term: "I" }, ", ", { term: "you" }, ", ", { term: "it" }, ", trợ động từ đầu tiên."] }
          - type: rule
            level: C1
            text: { en: "The main verb and the words after it stay.", uk: "Основне дієслово й слова після нього залишаються.", es: "El verbo principal y las palabras que le siguen se quedan.", pt: "O verbo principal e as palavras depois dele ficam.", fr: "Le verbe principal et les mots qui le suivent restent.", de: "Das Hauptverb und die Wörter danach bleiben stehen.", it: "Il verbo principale e le parole che lo seguono restano.", pl: "Czasownik główny i słowa po nim zostają.", tr: "Ana fiil ve ondan sonraki sözcükler kalır.", id: "Kata kerja utama dan kata-kata sesudahnya tetap ada.", vi: "Động từ chính và các từ sau nó được giữ lại." }

  - title: { en: "Reference to a clause", uk: "Відсилання до речення", es: "Referencia a una oración", pt: "Referência a uma oração", fr: "Renvoi à une proposition", de: "Bezug auf einen Satz", it: "Riferimento a una proposizione", pl: "Odniesienie do zdania", tr: "Bir cümleye gönderme", id: "Rujukan ke sebuah klausa", vi: "Quy chiếu đến một mệnh đề" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: "it", use: { en: "a fact or idea already named", uk: "факт або думка, уже згадані", es: "un hecho o una idea ya nombrados", pt: "um fato ou uma ideia já mencionados", fr: "un fait ou une idée déjà évoqués", de: "eine schon genannte Tatsache oder Idee", it: "un fatto o un'idea già nominati", pl: "fakt lub myśl już wymienione", tr: "daha önce geçen bir olgu ya da fikir", id: "fakta atau gagasan yang sudah disebut", vi: "sự việc hoặc ý đã nêu" }, ex: ["She said she would resign, and I didn't expect ", { target: it }, "."], tr: { uk: "Вона сказала, що піде у відставку, а я цього не очікував.", es: "Dijo que renunciaría, y yo no lo esperaba.", pt: "Ela disse que renunciaria, e eu não esperava isso.", fr: "Elle a dit qu’elle démissionnerait, et je ne m’y attendais pas.", de: "Sie sagte, sie werde zurücktreten, und ich hatte das nicht erwartet.", it: "Ha detto che si sarebbe dimessa, e io non me lo aspettavo.", pl: "Powiedziała, że zrezygnuje, a ja się tego nie spodziewałem.", tr: "İstifa edeceğini söyledi ve bunu beklemiyordum.", id: "Dia bilang akan mengundurkan diri, dan saya tidak menduganya.", vi: "Cô ấy nói sẽ từ chức, và tôi không ngờ điều đó." } }
          - { level: C1, form: "this", use: { en: "what the speaker has just said or is about to explain", uk: "те, що мовець щойно сказав або зараз пояснить", es: "lo que el hablante acaba de decir o está a punto de explicar", pt: "o que o falante acabou de dizer ou está prestes a explicar", fr: "ce que le locuteur vient de dire ou va expliquer", de: "was der Sprecher gerade gesagt hat oder gleich erklärt", it: "ciò che chi parla ha appena detto o sta per spiegare", pl: "to, co mówiący właśnie powiedział lub zaraz wyjaśni", tr: "konuşanın az önce söylediği ya da şimdi açıklayacağı şey", id: "apa yang baru dikatakan penutur atau akan dijelaskannya", vi: "điều người nói vừa nói hoặc sắp giải thích" }, ex: ["Prices rose sharply. ", { target: This }, " led to protests."], tr: { uk: "Ціни різко зросли. Це призвело до протестів.", es: "Los precios subieron bruscamente. Esto provocó protestas.", pt: "Os preços subiram bruscamente. Isso levou a protestos.", fr: "Les prix ont fortement augmenté. Cela a provoqué des manifestations.", de: "Die Preise stiegen stark. Das führte zu Protesten.", it: "I prezzi sono saliti bruscamente. Questo ha portato a proteste.", pl: "Ceny gwałtownie wzrosły. To doprowadziło do protestów.", tr: "Fiyatlar keskin biçimde yükseldi. Bu, protestolara yol açtı.", id: "Harga naik tajam. Hal ini memicu protes.", vi: "Giá cả tăng mạnh. Điều này dẫn đến các cuộc biểu tình." } }
          - { level: C1, form: "that", use: { en: "what someone else said or did", uk: "те, що сказав чи зробив хтось інший", es: "lo que otra persona dijo o hizo", pt: "o que outra pessoa disse ou fez", fr: "ce qu’une autre personne a dit ou fait", de: "was jemand anderes gesagt oder getan hat", it: "ciò che un'altra persona ha detto o fatto", pl: "to, co powiedział lub zrobił ktoś inny", tr: "bir başkasının söylediği ya da yaptığı şey", id: "apa yang dikatakan atau dilakukan orang lain", vi: "điều người khác đã nói hoặc làm" }, ex: { exchange: ["She quit her job.", [{ target: That }, " surprised everyone."]] }, tr: { uk: { exchange: ["Вона звільнилася з роботи.", "Це здивувало всіх."] }, es: { exchange: ["Dejó su trabajo.", "Eso sorprendió a todos."] }, pt: { exchange: ["Ela largou o emprego.", "Isso surpreendeu todo mundo."] }, fr: { exchange: ["Elle a quitté son travail.", "Cela a surpris tout le monde."] }, de: { exchange: ["Sie hat ihren Job gekündigt.", "Das hat alle überrascht."] }, it: { exchange: ["Ha lasciato il lavoro.", "Questo ha sorpreso tutti."] }, pl: { exchange: ["Rzuciła pracę.", "To zaskoczyło wszystkich."] }, tr: { exchange: ["İşinden ayrıldı.", "Bu herkesi şaşırttı."] }, id: { exchange: ["Dia berhenti dari pekerjaannya.", "Itu mengejutkan semua orang."] }, vi: { exchange: ["Cô ấy nghỉ việc.", "Điều đó khiến mọi người ngạc nhiên."] } } }
          - { level: C1, form: "which", use: { en: "a comment on a whole clause, after a comma", uk: "коментар до цілого речення після коми", es: "un comentario sobre una oración entera, después de una coma", pt: "um comentário sobre uma oração inteira, depois de uma vírgula", fr: "un commentaire sur toute une proposition, après une virgule", de: "ein Kommentar zu einem ganzen Satz, nach einem Komma", it: "un commento su un'intera proposizione, dopo una virgola", pl: "komentarz do całego zdania, po przecinku", tr: "bütün bir cümle hakkında, virgülden sonra gelen bir yorum", id: "komentar atas seluruh klausa, setelah koma", vi: "lời nhận xét về cả mệnh đề, đứng sau dấu phẩy" }, ex: ["He passed the test, ", { target: which }, " surprised us."], tr: { uk: "Він склав іспит, що нас здивувало.", es: "Aprobó el examen, lo que nos sorprendió.", pt: "Ele passou no teste, o que nos surpreendeu.", fr: "Il a réussi l’examen, ce qui nous a surpris.", de: "Er hat die Prüfung bestanden, was uns überrascht hat.", it: "Ha superato l'esame, il che ci ha sorpreso.", pl: "Zdał egzamin, co nas zaskoczyło.", tr: "Sınavı geçti, bu da bizi şaşırttı.", id: "Dia lulus ujian, yang membuat kami terkejut.", vi: "Anh ấy đã đỗ kỳ thi, điều đó khiến chúng tôi ngạc nhiên." } }
          - { level: C1, form: "a chain", use: { en: "each sentence picks up the one before", uk: "кожне речення підхоплює попереднє", es: "cada oración retoma la anterior", pt: "cada frase retoma a anterior", fr: "chaque phrase reprend la précédente", de: "jeder Satz greift den vorigen auf", it: "ogni frase riprende la precedente", pl: "każde zdanie podejmuje poprzednie", tr: "her cümle bir öncekini devralır", id: "setiap kalimat melanjutkan kalimat sebelumnya", vi: "mỗi câu tiếp nối câu trước" }, ex: ["The council closed the road. ", { target: This }, " caused delays, ", { target: which }, " led to protests. ", { target: That }, " in turn forced a review."], tr: { uk: "Рада закрила дорогу. Це спричинило затримки, що призвело до протестів. Це, у свою чергу, змусило переглянути рішення.", es: "El ayuntamiento cerró la carretera. Esto causó retrasos, lo que provocó protestas. Eso, a su vez, obligó a una revisión.", pt: "A prefeitura fechou a estrada. Isso causou atrasos, o que levou a protestos. Isso, por sua vez, forçou uma revisão.", fr: "Le conseil a fermé la route. Cela a causé des retards, ce qui a provoqué des manifestations. Cela a, à son tour, imposé un réexamen.", de: "Der Rat sperrte die Straße. Das verursachte Verspätungen, was zu Protesten führte. Das erzwang wiederum eine Überprüfung.", it: "Il consiglio ha chiuso la strada. Questo ha causato ritardi, il che ha portato a proteste. Ciò ha, a sua volta, imposto una revisione.", pl: "Rada zamknęła drogę. To spowodowało opóźnienia, co doprowadziło do protestów. To z kolei wymusiło przegląd decyzji.", tr: "Belediye meclisi yolu kapattı. Bu gecikmelere yol açtı, bu da protestolara neden oldu. Bu da sırayla bir incelemeyi zorunlu kıldı.", id: "Dewan kota menutup jalan. Hal itu menyebabkan keterlambatan, yang memicu protes. Hal itu pada gilirannya memaksa dilakukannya peninjauan.", vi: "Hội đồng đã đóng con đường. Việc này gây ra tình trạng chậm trễ, dẫn đến các cuộc biểu tình. Điều đó đến lượt nó buộc phải xem xét lại." } }
      - type: list
        items:
          - type: rule
            level: C1
