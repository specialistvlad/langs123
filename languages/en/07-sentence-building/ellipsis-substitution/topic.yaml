          - { level: B2, form: { pattern: [{ alternatives: ["the one", "the ones"] }, { alternatives: [with, in, "on", that] }] }, use: { en: "a phrase or clause says which one", uk: "фраза або підрядне речення уточнює, який саме", es: "una frase o una oración dice cuál", pt: "uma expressão ou oração diz qual", fr: "une expression ou une proposition dit lequel", de: "eine Wortgruppe oder ein Nebensatz sagt, welcher", it: "un'espressione o una proposizione dice quale", pl: "fraza lub zdanie wskazuje, który", tr: "bir öbek ya da cümle hangisi olduğunu söyler", id: "sebuah frasa atau klausa menyebutkan yang mana", vi: "một cụm từ hoặc mệnh đề cho biết cái nào" }, ex: { examples: [["The ", { target: one }, " with the blue door is mine."], ["I like the ", { target: ones }, " that you bought."]] }, tr: { uk: { examples: ["Той, що з синіми дверима, мій.", "Мені подобаються ті, які ти купив."] }, es: { examples: ["El de la puerta azul es el mío.", "Me gustan los que compraste."] }, pt: { examples: ["O de porta azul é o meu.", "Eu gosto dos que você comprou."] }, fr: { examples: ["Celui à la porte bleue est le mien.", "J’aime bien ceux que tu as achetés."] }, de: { examples: ["Der mit der blauen Tür gehört mir.", "Mir gefallen die, die du gekauft hast."] }, it: { examples: ["Quello con la porta blu è il mio.", "Mi piacciono quelli che hai comprato."] }, pl: { examples: ["Ten z niebieskimi drzwiami jest mój.", "Podobają mi się te, które kupiłeś."] }, tr: { examples: ["Mavi kapılı olan benim.", "Senin aldıklarını beğeniyorum."] }, id: { examples: ["Yang berpintu biru itu milik saya.", "Saya suka yang kamu beli."] }, vi: { examples: ["Cái có cửa màu xanh là của tôi.", "Tôi thích những cái bạn đã mua."] } } }
