            text: { en: [{ term: one }, " stands for a countable noun; an uncountable noun is left out."], uk: [{ term: "one" }, " замінює злічуваний іменник; незлічуваний іменник просто випускають."], es: [{ term: "one" }, " sustituye un sustantivo contable; un sustantivo incontable se omite."], pt: [{ term: "one" }, " substitui um substantivo contável; um substantivo incontável é omitido."], fr: [{ term: "one" }, " remplace un nom dénombrable ; un nom indénombrable est simplement omis."], de: [{ term: "one" }, " ersetzt ein zählbares Nomen; ein unzählbares Nomen wird weggelassen."], it: [{ term: "one" }, " sostituisce un sostantivo numerabile; un sostantivo non numerabile si omette."], pl: [{ term: "one" }, " zastępuje rzeczownik policzalny; rzeczownik niepoliczalny się pomija."], tr: [{ term: "one" }, " sayılabilir bir ismin yerini tutar; sayılamayan isim düşürülür."], id: [{ term: "one" }, " menggantikan kata benda terhitung; kata benda tak terhitung dihilangkan."], vi: [{ term: "one" }, " thay cho danh từ đếm được; danh từ không đếm được thì được lược bỏ."] }
