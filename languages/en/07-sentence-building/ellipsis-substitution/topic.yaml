          - { level: B2, form: "do so", use: { en: "formal; replaces a verb and its object", uk: "формальне; замінює дієслово разом з додатком", es: "formal; sustituye un verbo y su complemento", pt: "formal; substitui um verbo e o seu objeto", fr: "soutenu ; remplace un verbe et son complément", de: "formell; ersetzt ein Verb und sein Objekt", it: "formale; sostituisce un verbo e il suo complemento", pl: "formalne; zastępuje czasownik i jego dopełnienie", tr: "resmî; bir fiilin ve nesnesinin yerini tutar", id: "formal; menggantikan kata kerja beserta objeknya", vi: "trang trọng; thay cho một động từ và tân ngữ của nó" }, ex: { examples: [["I asked him to leave, and he ", { target: "did so" }, " at once."], ["Anyone may apply, and may ", { target: "do so" }, " online."]] }, tr: { uk: { examples: ["Я попросив його піти, і він одразу це зробив.", "Подати заявку може будь-хто, і зробити це можна онлайн."] }, es: { examples: ["Le pedí que se fuera y lo hizo de inmediato.", "Cualquiera puede presentar una solicitud, y puede hacerlo en línea."] }, pt: { examples: ["Pedi que ele saísse, e ele o fez imediatamente.", "Qualquer pessoa pode se candidatar, e pode fazê-lo on-line."] }, fr: { examples: ["Je lui ai demandé de partir, et il l’a fait aussitôt.", "Tout le monde peut postuler, et peut le faire en ligne."] }, de: { examples: ["Ich bat ihn zu gehen, und er tat dies sofort.", "Jeder darf sich bewerben und kann dies online tun."] }, it: { examples: ["Gli ho chiesto di andarsene e lo ha fatto subito.", "Chiunque può fare domanda, e può farlo online."] }, pl: { examples: ["Poprosiłem go, żeby wyszedł, a on zrobił to natychmiast.", "Każdy może się zgłosić i może to zrobić online."] }, tr: { examples: ["Ondan gitmesini istedim, o da hemen öyle yaptı.", "Herkes başvurabilir ve bunu çevrimiçi yapabilir."] }, id: { examples: ["Saya memintanya pergi, dan dia segera melakukannya.", "Siapa pun boleh mendaftar, dan boleh melakukannya secara daring."] }, vi: { examples: ["Tôi bảo anh