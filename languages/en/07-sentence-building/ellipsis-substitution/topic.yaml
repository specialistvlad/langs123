          point: { en: Nouns, uk: "Іменники", es: "Sustantivos", pt: "Substantivos", fr: "Noms", de: "Nomen", it: "Sostantivi", pl: "Rzeczowniki", tr: "İsimler", id: "Kata benda", vi: "Danh từ" }
          rule: { en: [{ term: those }, ", ", { term: "that of" }, " and ", { term: "the latter" }, " point back to a noun"], uk: [{ term: "those" }, ", ", { term: "that of" }, " і ", { term: "the latter" }, " вказують назад на іменник"], es: [{ term: "those" }, ", ", { term: "that of" }, " y ", { term: "the latter" }, " remiten a un sustantivo anterior"], pt: [{ term: "those" }, ", ", { term: "that of" }, " e ", { term: "the latter" }, " remetem a um substantivo anterior"], fr: [{ term: "those" }, ", ", { term: "that of" }, " et ", { term: "the latter" }, " renvoient à un nom déjà cité"], de: [{ term: "those" }, ", ", { term: "that of" }, " und ", { term: "the latter" }, " verweisen auf ein Nomen zurück"], it: [{ term: "those" }, ", ", { term: "that of" }, " e ", { term: "the latter" }, " rimandano a un sostantivo già detto"], pl: [{ term: "those" }, ", ", { term: "that of" }, " i ", { term: "the latter" }, " wracają do rzeczownika"], tr: [{ term: "those" }, ", ", { term: "that of" }, " ve ", { term: "the latter" }, " daha önce geçen bir isme geri gönderir"], id: [{ term: "those" }, ", ", { term: "that of" }, ", dan ", { term: "the latter" }, " merujuk kembali ke sebuah kata benda"], vi: [{ term: "those" }, ", ", { term: "that of" }, " và ", { term: "the latter" }, " chỉ ngược lại một danh từ"] }
          ex: ["Prices here are higher than ", { target: those }, " in town."]
          tr: { uk: "Ціни тут вищі, ніж у місті.", es: "Los precios aquí son más altos que los de la ciudad.", pt: "Os preços aqui são mais altos que os da cidade.", fr: "Les prix ici sont plus élevés que ceux du centre-ville.", de: "Die Preise hier sind höher als die in der Stadt.", it: "I prezzi qui sono più alti di quelli in città.", pl: "Ceny tu są wyższe niż te w mieście.", tr: "Buradaki fiyatlar şehir merkezindekilerden yüksek.", id: "Harga di sini lebih tinggi daripada harga di kota.", vi: "Giá ở đây cao hơn giá trong thành phố." }
        - level: C1
          point: { en: Speech, uk: "Усне мовлення", es: "Habla", pt: "Fala", fr: "Oral", de: "Gesprochene Sprache", it: "Parlato", pl: "Mowa", tr: "Konuşma", id: "Percakapan", vi: "Lời nói" }
          rule: { en: "the start of a clause goes: the subject and the first auxiliary", uk: "початок речення випадає: підмет і перше допоміжне дієслово", es: "se omite el comienzo de la oración: el sujeto y el primer auxiliar", pt: "o início da oração é omitido: o sujeito e o primeiro auxiliar", fr: "le début de la proposition disparaît : le sujet et le premier auxiliaire", de: "der Satzanfang fällt weg: das Subjekt und das erste Hilfsverb", it: "cade l'inizio della proposizione: il soggetto e il primo ausiliare", pl: "znika początek zdania: podmiot i pierwszy czasownik pomocniczy", tr: "cümlenin başı düşer: özne ve ilk yardımcı fiil", id: "awal klausa dihilangkan: subjek dan kata kerja bantu pertama", vi: "phần đầu mệnh đề bị lược: chủ ngữ và trợ động từ đầu tiên" }
          ex: [{ target: "Got a minute" }, "?"]
          tr: { uk: "Є хвилинка?", es: "¿Un minuto?", pt: "Um minutinho?", fr: "Une minute ?", de: "Kurz Zeit?", it: "Un minuto?", pl: "Masz chwilę?", tr: "Bir dakika?", id: "Ada waktu sebentar?", vi: "Rảnh chút không?" }
        - level: C1
          point: { en: A whole clause, uk: "Ціле речення", es: "Una oración entera", pt: "Uma oração inteira", fr: "Une proposition entière", de: "Ein ganzer Satz", it: "Un'intera proposizione", pl: "Całe zdanie", tr: "Bütün bir cümle", id: "Seluruh klausa", vi: "Cả một mệnh đề" }
          rule: { en: [{ term: it }, ", ", { term: this }, ", ", { term: that }, " and ", { term: which }, " refer to a whole clause"], uk: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " і ", { term: "which" }, " відсилають до цілого речення"], es: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " y ", { term: "which" }, " remiten a una oración entera"], pt: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " e ", { term: "which" }, " remetem a uma oração inteira"], fr: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " et ", { term: "which" }, " renvoient à une proposition entière"], de: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " und ", { term: "which" }, " beziehen sich auf einen ganzen Satz"], it: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " e ", { term: "which" }, " si riferiscono a un'intera proposizione"], pl: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " i ", { term: "which" }, " odnoszą się do całego zdania"], tr: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " ve ", { term: "which" }, " bütün bir cümleye gönderme yapar"], id: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, ", dan ", { term: "which" }, " merujuk pada seluruh klausa"], vi: [{ term: "it" }, ", ", { term: "this" }, ", ", { term: "that" }, " và ", { term: "which" }, " chỉ cả một mệnh đề"] }
          ex: ["He passed, ", { target: which }, " surprised us."]
          tr: { uk: "Він склав іспит, що нас здивувало.", es: "Aprobó, lo que nos sorprendió.", pt: "Ele passou, o que nos surpreendeu.", fr: "Il a réussi, ce qui nous a surpris.", de: "Er hat bestanden, was uns überrascht hat.", it: "Ha superato l'esame, il che ci ha sorpreso.", pl: "Zdał, co nas zaskoczyło.", tr: "Geçti, bu da bizi şaşırttı.", id: "Dia lulus, yang membuat kami terkejut.", vi: "Anh ấy đã đỗ, điều đó khiến chúng tôi ngạc nhiên." }
        - level: C1
          point: { en: Short replies, uk: "Короткі відповіді", es: "Respuestas breves", pt: "Respostas curtas", fr: "Réponses courtes", de: "Kurzantworten", it: "Risposte brevi", pl: "Krótkie odpowiedzi", tr: "Kısa cevaplar", id: "Jawaban singkat", vi: "Câu trả lời ngắn" }
          rule: { en: "a wh-question gets the missing phrase alone; a stripped clause adds one phrase", uk: "на питання з wh-словом відповідають самою бракуючою фразою; скорочене речення додає одну фразу", es: "una pregunta con wh- se responde solo con la frase que falta; una oración reducida añade una sola frase", pt: "uma pergunta com wh- recebe só a frase que falta; uma oração reduzida acrescenta uma só frase", fr: "une question en wh- reçoit la seule expression manquante ; une proposition réduite ajoute une seule expression", de: "eine W-Frage bekommt nur die fehlende Wortgruppe als Antwort; ein verkürzter Satz fügt nur eine Wortgruppe hinzu", it: "a una domanda con wh- si risponde con la sola espressione mancante; una proposizione ridotta aggiunge una sola espressione", pl: "na pytanie z wh- odpowiada się samą brakującą frazą; zdanie skrócone dodaje jedną frazę", tr: "wh- sorusuna yalnızca eksik öbek söylenir; kısaltılmış cümle tek bir öbek ekler", id: "pertanyaan wh- dijawab hanya dengan frasa yang kurang; klausa yang dipangkas menambahkan satu frasa", vi: "câu hỏi wh- chỉ cần đáp bằng cụm từ còn thiếu; mệnh đề rút gọn chỉ thêm một cụm từ" }
          ex: ["Tom left, and ", { target: "Ann too" }, "."]
          tr: { uk: "Том пішов, і Анна теж.", es: "Tom se fue, y Ana también.", pt: "O Tom saiu, e a Ana também.", fr: "Tom est parti, et Anne aussi.", de: "Tom ist gegangen, und Anna auch.", it: "Tom se n'è andato, e anche Anna.", pl: "Tom wyszedł, i Anna też.", tr: "Tom gitti, Ann da.", id: "Tom pergi, Ann juga.", vi: "Tom đã đi, Ann cũng vậy." }
        - level: B2
          point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: neither }, " and ", { term: nor }, " are negative, so the auxiliary stays positive"], uk: [{ term: "neither" }, " і ", { term: "nor" }, " уже заперечні, тому допоміжне дієслово стоїть у стверджувальній формі"], es: [{ term: "neither" }, " y ", { term: "nor" }, " ya son negativos, así que el auxiliar queda en forma afirmativa"], pt: [{ term: "neither" }, " e ", { term: "nor" }, " já são negativos, então o auxiliar fica na forma afirmativa"], fr: [{ term: "neither" }, " et ", { term: "nor" }, " sont déjà négatifs, donc l’auxiliaire reste à la forme affirmative"], de: [{ term: "neither" }, " und ", { term: "nor" }, " sind schon verneint, also bleibt das Hilfsverb bejaht"], it: [{ term: "neither" }, " e ", { term: "nor" }, " sono già negativi, quindi l'ausiliare resta affermativo"], pl: [{ term: "neither" }, " i ", { term: "nor" }, " są już przeczące, więc czasownik pomocniczy zostaje twierdzący"], tr: [{ term: "neither" }, " ve ", { term: "nor" }, " zaten olumsuzdur, bu yüzden yardımcı fiil olumlu kalır"], id: [{ term: "neither" }, " dan ", { term: "nor" }, " sudah bermakna negatif, jadi kata kerja bantu tetap positif"], vi: [{ term: "neither" }, " và ", { term: "nor" }, " vốn đã phủ định, nên trợ động từ giữ dạng khẳng định"] }
          ex: { exchange: ["I can't swim.", [{ target: "Neither can I" }, "."]] }
          tr: { uk: { exchange: ["Я не вмію плавати.", "Я теж не вмію."] }, es: { exchange: ["No sé nadar.", "Yo tampoco."] }, pt: { exchange: ["Eu não sei nadar.", "Eu também não."] }, fr: { exchange: ["Je ne sais pas nager.", "Moi non plus."] }, de: { exchange: ["Ich kann nicht schwimmen.", "Ich auch nicht."] }, it: { exchange: ["Non so nuotare.", "Neanch'io."] }, pl: { exchange: ["Nie umiem pływać.", "Ja też nie."] }, tr: { exchange: ["Yüzme bilmiyorum.", "Ben de bilmiyorum."] }, id: { exchange: ["Saya tidak bisa berenang.", "Saya juga tidak."] }, vi: { exchange: ["Tôi không biết bơi.", "Tôi cũng không."] } }

sections:
  - title: { en: "Overview", uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Device, uk: "Засіб", es: "Recurso", pt: "Recurso", fr: "Procédé", de: "Mittel", it: "Strumento", pl: "Środek", tr: "Yöntem", id: "Cara", vi: "Cách" } }
          - { key: rule, label: { en: What it does, uk: "Що робить", es: "Qué hace", pt: "O que faz", fr: "Ce qu’il fait", de: "Funktion", it: "Che cosa fa", pl: "Co robi", tr: "İşlevi", id: "Fungsinya", vi: "Chức năng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: Ellipsis, uk: "Еліпсис", es: "Elipsis", pt: "Elipse", fr: "Ellipse", de: "Ellipse", it: "Ellissi", pl: "Elipsa", tr: "Eksiltme", id: "Elipsis", vi: "Tỉnh lược" }, rule: { en: "leaves out words that the context supplies", uk: "випускає слова, які підказує контекст", es: "omite palabras que el contexto aporta", pt: "omite palavras que o contexto fornece", fr: "omet des mots que le contexte fournit", de: "lässt Wörter weg, die der Kontext liefert", it: "omette parole che il contesto fornisce", pl: "pomija słowa, które podpowiada kontekst", tr: "bağlamın sağladığı sözcükleri düşürür", id: "menghilangkan kata yang sudah ditunjukkan konteks", vi: "bỏ những từ mà ngữ cảnh đã cho biết" }, ex: { exchange: ["Which film did you like?", ["The ", { target: first }, "."]] }, tr: { uk: { exchange: ["Який фільм тобі сподобався?", "Перший."] }, es: { exchange: ["¿Qué película te gustó?", "La primera."] }, pt: { exchange: ["De qual filme você gostou?", "Do primeiro."] }, fr: { exchange: ["Quel film as-tu aimé ?", "Le premier."] }, de: { exchange: ["Welcher Film hat dir gefallen?", "Der erste."] }, it: { exchange: ["Quale film ti è piaciuto?", "Il primo."] }, pl: { exchange: ["Który film ci się podobał?", "Pierwszy."] }, tr: { exchange: ["Hangi filmi beğendin?", "İlkini."] }, id: { exchange: ["Film mana yang kamu suka?", "Yang pertama."] }, vi: { exchange: ["Bạn thích bộ phim nào?", "Bộ đầu tiên."] } } }
          - { level: B2, use: { en: Substitution, uk: "Заміна", es: "Sustitución", pt: "Substituição", fr: "Substitution", de: "Ersetzung", it: "Sostituzione", pl: "Zastępowanie", tr: "Yerine koyma", id: "Substitusi", vi: "Thay thế" }, rule: { en: "puts a short word in the place of a longer phrase", uk: "ставить коротке слово замість довшого виразу", es: "pone una palabra corta en lugar de una expresión más larga", pt: "põe uma palavra curta no lugar de uma expressão mais longa", fr: "met un mot court à la place d’une expression plus longue", de: "setzt ein kurzes Wort an die Stelle eines längeren Ausdrucks", it: "mette una parola breve al posto di un'espressione più lunga", pl: "wstawia krótkie słowo w miejsce dłuższego wyrażenia", tr: "daha uzun bir ifadenin yerine kısa bir sözcük koyar", id: "memakai kata pendek sebagai pengganti frasa yang lebih panjang", vi: "dùng một từ ngắn thay cho một cụm dài hơn" }, ex: ["Pass me the blue pen, not the black ", { target: one }, "."], tr: { uk: "Подай мені синю ручку, а не чорну.", es: "Pásame el bolígrafo azul, no el negro.", pt: "Me passe a caneta azul, não a preta.", fr: "Passe-moi le stylo bleu, pas le noir.", de: "Gib mir den blauen Stift, nicht den schwarzen.", it: "Passami la penna blu, non quella nera.", pl: "Podaj mi niebieski długopis, nie czarny.", tr: "Bana mavi kalemi ver, siyah olanı değil.", id: "Berikan saya pulpen biru, bukan yang hitam.", vi: "Đưa tôi cây bút xanh, không phải cây màu đen." } }
          - { level: C1, use: { en: Speech and notes, uk: "Мовлення й нотатки", es: "Habla y notas", pt: "Fala e anotações", fr: "Oral et notes", de: "Gesprochene Sprache und Notizen", it: "Parlato e appunti", pl: "Mowa i notatki", tr: "Konuşma ve notlar", id: "Percakapan dan catatan", vi: "Lời nói và ghi chú" }, rule: { en: "drops the start of a clause", uk: "випускає початок речення", es: "omite el comienzo de la oración", pt: "omite o início da oração", fr: "omet le début de la proposition", de: "lässt den Satzanfang weg", it: "omette l'inizio della proposizione", pl: "pomija początek zdania", tr: "cümlenin başını düşürür", id: "menghilangkan awal klausa", vi: "bỏ phần đầu của mệnh đề" }, ex: [{ target: Coming }, "?"], tr: { uk: "Ідеш?", es: "¿Vienes?", pt: "Vem junto?", fr: "Tu viens ?", de: "Kommst du mit?", it: "Vieni?", pl: "Idziesz?", tr: "Geliyor musun?", id: "Ikut?", vi: "Đi không?" } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The listener or reader must be able to supply every word that is left out.", uk: "Слухач або читач має змогу відновити кожне пропущене слово.", es: "El oyente o el lector debe poder suplir cada palabra que se omite.", pt: "O ouvinte ou leitor precisa poder suprir cada palavra omitida.", fr: "L’auditeur ou le lecteur doit pouvoir rétablir chaque mot omis.", de: "Hörer oder Leser müssen jedes weggelassene Wort ergänzen können.", it: "Chi ascolta o legge deve poter ricostruire ogni parola omessa.", pl: "Słuchacz lub czytelnik musi móc dopowiedzieć każde pominięte słowo.", tr: "Dinleyen ya da okuyan, düşen her sözcüğü tamamlayabilmelidir.", id: "Pendengar atau pembaca harus dapat melengkapi setiap kata yang dihilangkan.", vi: "Người nghe hoặc người đọc phải tự bổ sung được mọi từ bị lược." }
          - type: note
            level: B2
            text: { en: ["A question tag repeats the auxiliary in the same way. See ", { link: Question Tags, to: en.sentence-building.question-tags }, "."], uk: ["Розділове питання так само повторює допоміжне дієслово. Див. ", { link: "Розділові питання", to: "en.sentence-building.question-tags" }, "."], es: ["Una pregunta coletilla repite el auxiliar del mismo modo. Ver ", { link: "Preguntas coletilla", to: "en.sentence-building.question-tags" }, "."], pt: ["Uma question tag repete o auxiliar da mesma maneira. Ver ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], fr: ["Un question tag reprend l’auxiliaire de la même façon. Voir ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], de: ["Ein Question Tag wiederholt das Hilfsverb auf dieselbe Weise. Siehe ", { link: "Question Tags", to: "en.sentence-building.question-tags" }, "."], it: ["Un question tag riprende l'ausiliare allo stesso modo. Vedi ", { link: "Question tag", to: "en.sentence-building.question-tags" }, "."], pl: ["Pytanie rozłączne powtarza czasownik pomocniczy w ten sam sposób. Zob. ", { link: "Pytania rozłączne", to: "en.sentence-building.question-tags" }, "."], tr: ["Question tag de yardımcı fiili aynı şekilde tekrarlar. Bkz. ", { link: "Question tags", to: "en.sentence-building.question-tags" }, "."], id: ["Question tag mengulang kata kerja bantu dengan cara yang sama. Lihat ", { link: "Question tag", to: "en.sentence-building.question-tags" }, "."], vi: ["Câu hỏi đuôi cũng lặp lại trợ động từ theo cách tương tự. Xem ", { link: "Câu hỏi đuôi", to: "en.sentence-building.question-tags" }, "."] }

  - title: { en: "Form: agreeing with so and too", uk: "Форма: згода з so і too", es: "Forma: estar de acuerdo con so y too", pt: "Forma: concordar com so e too", fr: "Forme : exprimer l’accord avec so et too", de: "Form: Zustimmung mit so und too", it: "Forma: essere d'accordo con so e too", pl: "Forma: zgoda z so i too", tr: "Biçim: so ve too ile katılma", id: "Bentuk: setuju dengan so dan too", vi: "Dạng: đồng tình với so và too" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: aux, label: { en: Reply uses, uk: "Відповідь вживає", es: "La respuesta usa", pt: "A resposta usa", fr: "La réponse emploie", de: "Antwort mit", it: "La risposta usa", pl: "Odpowiedź używa", tr: "Cevapta kullanılan", id: "Jawaban memakai", vi: "Câu đáp dùng" } }
          - { key: statement, label: { en: Statement, uk: "Речення", es: "Oración", pt: "Frase", fr: "Phrase", de: "Aussage", it: "Frase", pl: "Zdanie", tr: "Cümle", id: "Kalimat", vi: "Câu trần thuật" } }
          - { key: so, label: { pattern: [So, { slot: helper }, { slot: subject }] } }
          - { key: too, label: { pattern: [{ slot: subject }, { slot: helper }, too] } }
        rows:
          - { level: B2, features: { polarity: pos, tense: prs }, aux: { alternatives: [am, is, are] }, statement: ["She", { aux: "'s" }, " late."], so: [{ target: "So am I" }, "."], too: ["I ", { target: "am too" }, "."] }
          - { level: B2, features: { polarity: pos, tense: pst }, aux: { alternatives: [was, were] }, statement: ["He ", { aux: was }, " ill."], so: [{ target: "So was she" }, "."], too: ["She ", { target: "was too" }, "."] }
          - { level: B2, features: { polarity: pos, tense: prs }, aux: do, statement: "We like tea.", so: [{ target: "So do I" }, "."], too: ["I ", { target: "do too" }, "."] }
          - { level: B2, features: { polarity: pos, tense: prs }, aux: does, statement: "I like tea.", so: [{ target: "So does she" }, "."], too: ["She ", { target: "does too" }, "."] }
          - { level: B2, features: { polarity: pos, tense: pst }, aux: did, statement: "I missed the bus.", so: [{ target: "So did he" }, "."], too: ["He ", { target: "did too" }, "."] }
          - { level: B2, features: { polarity: pos, aspect: prf }, aux: { alternatives: [have, has] }, statement: ["We", { aux: "'ve" }, " finished."], so: [{ target: "So have they" }, "."], too: ["They ", { target: "have too" }, "."] }
          - { level: B2, features: { polarity: pos }, aux: { alternatives: [can, will, would] }, statement: ["She ", { aux: can }, " swim."], so: [{ target: "So can I" }, "."], too: ["I ", { target: "can too" }, "."] }
      - type: list
        items:
          - type: rule
            level: B2
