phê?", "Tôi."] }, { exchange: ["Khi nào chúng ta gặp nhau?", "Ngày mai."] }] } } }
          - { level: C1, use: { en: "A wh-word alone asks for the missing part", uk: "Саме wh-слово питає про бракуючу частину", es: "Una palabra wh- sola pregunta por la parte que falta", pt: "Uma palavra wh- sozinha pergunta pela parte que falta", fr: "Un mot en wh- seul demande la partie manquante", de: "Ein Fragewort allein fragt nach dem fehlenden Teil", it: "Una parola wh- da sola chiede la parte mancante", pl: "Samo słowo z wh- pyta o brakującą część", tr: "Tek başına bir wh- sözcüğü eksik kısmı sorar", id: "Satu kata wh- saja menanyakan bagian yang kurang", vi: "Một từ wh- đứng một mình hỏi về phần còn thiếu" }, ex: { examples: [{ exchange: ["I met someone yesterday.", [{ target: Who }, "?"]] }, { exchange: ["I'm leaving soon.", [{ target: When }, "?"]] }] }, tr: { uk: { examples: [{ exchange: ["Учора я зустрів одну людину.", "Кого?"] }, { exchange: ["Я скоро йду.", "Коли?"] }] }, es: { examples: [{ exchange: ["Ayer conocí a alguien.", "¿A quién?"] }, { exchange: ["Me voy pronto.", "¿Cuándo?"] }] }, pt: { examples: [{ exchange: ["Ontem eu encontrei alguém.", "Quem?"] }, { exchange: ["Vou embora logo.", "Quando?"] }] }, fr: { examples: [{ exchange: ["J’ai rencontré quelqu’un hier.", "Qui ?"] }, { exchange: ["Je pars bientôt.", "Quand ?"] }] }, de: { examples: [{ exchange: ["Ich habe gestern jemanden getroffen.", "Wen?"] }, { exchange: ["Ich gehe bald.", "Wann?"] }] }, it: { examples: [{ exchange: ["Ieri ho incontrato qualcuno.", "Chi?"] }, { exchange: ["Parto presto.", "Quando?"] }] }, pl: { examples: [{ exchange: ["Wczoraj kogoś spotkałem.", "Kogo?"] }, { exchange: ["Niedługo wyjeżdżam.", "Kiedy?"] }] }, tr: { examples: [{ exchange: ["Dün birini gördüm.", "Kimi?"] }, { exchange: ["Yakında gidiyorum.", "Ne zaman?"] }] }, id: { examples: [{ exchange: ["Kemarin saya bertemu seseorang.", "Siapa?"] }, { exchange: ["Saya akan segera pergi.", "Kapan?"] }] }, vi: { examples: [{ exchange: ["Hôm qua tôi đã gặp một người.", "Ai cơ?"] }, { exchange: ["Tôi sắp đi rồi.", "Khi nào?"] }] } } }
          - { level: C1, use: { en: "A wh-word and its preposition, with the preposition last", uk: "Wh-слово з прийменником, причому прийменник стоїть останнім", es: "Una palabra wh- con su preposición, con la preposición al final", pt: "Uma palavra wh- com a sua preposição, com a preposição no fim", fr: "Un mot en wh- avec sa préposition, la préposition en dernier", de: "Ein Fragewort mit seiner Präposition, die Präposition steht zuletzt", it: "Una parola wh- con la sua preposizione, con la preposizione alla fine", pl: "Słowo z wh- i jego przyimek, przy czym przyimek stoi na końcu", tr: "Bir wh- sözcüğü ve edatı; edat sonda gelir", id: "Kata wh- dengan kata depannya, dengan kata depan di akhir", vi: "Một từ wh- và giới từ của nó, giới từ đứng cuối" }, ex: { examples: [{ exchange: ["I'm going out tonight.", [{ target: "Who with" }, "?"]] }, { exchange: ["I need some money.", [{ target: "What for" }, "?"]] }] }, tr: { uk: { examples: [{ exchange: ["Сьогодні ввечері я йду гуляти.", "З ким?"] }, { exchange: ["Мені потрібні гроші.", "Навіщо?"] }] }, es: { examples: [{ exchange: ["Esta noche salgo.", "¿Con quién?"] }, { exchange: ["Necesito dinero.", "¿Para qué?"] }] }, pt: { examples: [{ exchange: ["Vou sair hoje à noite.", "Com quem?"] }, { exchange: ["Preciso de dinheiro.", "Para quê?"] }] }, fr: { examples: [{ exchange: ["Je sors ce soir.", "Avec qui ?"] }, { exchange: ["J’ai besoin d’argent.", "Pour quoi faire ?"] }] }, de: { examples: [{ exchange: ["Ich gehe heute Abend aus.", "Mit wem?"] }, { exchange: ["Ich brauche Geld.", "Wofür?"] }] }, it: { examples: [{ exchange: ["Stasera esco.", "Con chi?"] }, { exchange: ["Mi servono dei soldi.", "Per cosa?"] }] }, pl: { examples: [{ exchange: ["Wychodzę dziś wieczorem.", "Z kim?"] }, { exchange: ["Potrzebuję pieniędzy.", "Na co?"] }] }, tr: { examples: [{ exchange: ["Bu akşam dışarı çıkıyorum.", "Kiminle?"] }, { exchange: ["Biraz paraya ihtiyacım var.", "Ne için?"] }] }, id: { examples: [{ exchange: ["Malam ini saya akan keluar.", "Dengan siapa?"] }, { exchange: ["Saya butuh uang.", "Untuk apa?"] }] }, vi: { examples: [{ exchange: ["Tối nay tôi đi chơi.", "Với ai?"] }, { exchange: ["Tôi cần ít tiền.", "Để làm gì?"] }] } } }
          - { level: C1, use: { en: ["Stripping: one phrase after ", { term: and }, " or ", { term: but }], uk: ["Скорочене речення: одна фраза після ", { term: "and" }, " або ", { term: "but" }], es: ["Oración reducida: una sola frase después de ", { term: "and" }, " o ", { term: "but" }], pt: ["Oração reduzida: uma só frase depois de ", { term: "and" }, " ou ", { term: "but" }], fr: ["Proposition réduite : une seule expression après ", { term: "and" }, " ou ", { term: "but" }], de: ["Verkürzter Satz: nur eine Wortgruppe nach ", { term: "and" }, " oder ", { term: "but" }], it: ["Frase ridotta: una sola espressione dopo ", { term: "and" }, " o ", { term: "but" }], pl: ["Zdanie skrócone: jedna fraza po ", { term: "and" }, " lub ", { term: "but" }], tr: ["Kısaltılmış cümle: ", { term: "and" }, " ya da ", { term: "but" }, " sonrasında tek bir öbek"], id: ["Klausa yang dipangkas: satu frasa setelah ", { term: "and" }, " atau ", { term: "but" }], vi: ["Câu rút gọn: một cụm từ sau ", { term: "and" }, " hoặc ", { term: "but" }] }, ex: { examples: [["Tom left, and ", { target: "Ann too" }, "."], ["Tom left, but ", { target: "not Ann" }, "."]] }, tr: { uk: { examples: ["Том пішов, і Анна теж.", "Том пішов, але не Анна."] }, es: { examples: ["Tom se fue, y Ana también.", "Tom se fue, pero Ana no."] }, pt: { examples: ["O Tom saiu, e a Ana também.", "O Tom saiu, mas a Ana não."] }, fr: { examples: ["Tom est parti, et Anne aussi.", "Tom est parti, mais pas Anne."] }, de: { examples: ["Tom ist gegangen, und Anna auch.", "Tom ist gegangen, aber Anna nicht."] }, it: { examples: ["Tom se n'è andato, e anche Anna.", "Tom se n'è andato, ma non Anna."] }, pl: { examples: ["Tom wyszedł, i Anna też.", "Tom wyszedł, ale nie Anna."] }, tr: { examples: ["Tom gitti, Ann da.", "Tom gitti, Ann değil."] }, id: { examples: ["Tom pergi, Ann juga.", "Tom pergi, tetapi Ann tidak."] }, vi: { examples: ["Tom đã đi, Ann cũng vậy.", "Tom đã đi, nhưng Ann thì không."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["A bare answer takes the object pronoun: ", { term: me }, ", ", { term: him }, ", ", { term: her }, ", ", { term: us }, ", ", { term: them }, "."], uk: ["Відповідь без дієслова містить займенник-додаток: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], es: ["Una respuesta sin verbo lleva el pronombre objeto: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], pt: ["Uma resposta sem verbo leva o pronome objeto: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], fr: ["Une réponse sans verbe prend le pronom complément : ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], de: ["Eine Antwort ohne Verb verwendet das Objektpronomen: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], it: ["Una risposta senza verbo prende il pronome complemento: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], pl: ["Odpowiedź bez czasownika przyjmuje zaimek dopełnienia: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], tr: ["Fiilsiz bir cevap nesne zamirini alır: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], id: ["Jawaban tanpa kata kerja memakai kata ganti objek: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."], vi: ["Câu đáp không có động từ dùng đại từ tân ngữ: ", { term: "me" }, ", ", { term: "him" }, ", ", { term: "her" }, ", ", { term: "us" }, ", ", { term: "them" }, "."] }
            ex: { exchange: ["Who broke it?", [{ target: Him }, "."]] }
            tr: { uk: { exchange: ["Хто це зламав?", "Він."] }, es: { exchange: ["¿Quién lo rompió?", "Él."] }, pt: { exchange: ["Quem quebrou isso?", "Ele."] }, fr: { exchange: ["Qui l’a cassé ?", "Lui."] }, de: { exchange: ["Wer hat es kaputt gemacht?", "Er."] }, it: { exchange: ["Chi l'ha rotto?", "Lui."] }, pl: { exchange: ["Kto to zepsuł?", "On."] }, tr: { exchange: ["Bunu kim kırdı?", "O."] }, id: { exchange: ["Siapa yang merusaknya?", "Dia."] }, vi: { exchange: ["Ai làm hỏng nó?", "Anh ấy."] } }

  - title: { en: "Identity condition", uk: "Умова тотожності", es: "Condición de identidad", pt: "Condição de identidade", fr: "Condition d’identité", de: "Identitätsbedingung", it: "Condizione di identità", pl: "Warunek tożsamości", tr: "Özdeşlik koşulu", id: "Syarat identitas", vi: "Điều kiện đồng nhất" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, use: { en: "The left-out words repeat what was said; the auxiliary left behind stands for the whole verb group", uk: "Пропущені слова повторюють сказане; допоміжне дієслово, що залишилося, заступає всю дієслівну групу", es: "Las palabras omitidas repiten lo ya dicho; el auxiliar que queda representa todo el grupo verbal", pt: "As palavras omitidas repetem o que foi dito; o auxiliar que fica representa todo o grupo verbal", fr: "Les mots omis répètent ce qui a été dit ; l’auxiliaire qui reste représente tout le groupe verbal", de: "Die weggelassenen Wörter wiederholen das Gesagte; das übrig gebliebene Hilfsverb steht für die ganze Verbgruppe", it: "Le parole omesse ripetono ciò che è stato detto; l'ausiliare rimasto sta per l'intero gruppo verbale", pl: "Pominięte słowa powtarzają to, co padło; pozostały czasownik pomocniczy zastępuje całą grupę czasownikową", tr: "Düşen sözcükler söyleneni tekrarlar; geride kalan yardımcı fiil bütün fiil öbeğinin yerini tutar", id: "Kata yang dihilangkan mengulang apa yang sudah dikatakan; kata kerja bantu yang tersisa mewakili seluruh frasa verba", vi: "Những từ bị lược lặp lại điều đã nói; trợ động từ còn lại đại diện cho cả cụm động từ" }, ex: ["He isn't going, but I ", { target: am }, "."], tr: { uk: "Він не йде, а я йду.", es: "Él no va, pero yo sí.", pt: "Ele não vai, mas eu vou.", fr: "Lui, il n’y va pas, mais moi, si.", de: "Er geht nicht, aber ich schon.", it: "Lui non va, ma io sì.", pl: "On nie idzie, ale ja tak.", tr: "O gitmiyor ama ben gidiyorum.", id: "Dia tidak pergi, tetapi saya pergi.", vi: "Anh ấy không đi nhưng tôi thì có." } }
          - { level: C1, use: { en: "The auxiliary may change its polarity or tense, if it still fits the left-out verb", uk: "Допоміжне дієслово може змінити стверджувальну форму на заперечну або навпаки чи змінити час, якщо воно все ще пасує до пропущеного дієслова", es: "El auxiliar puede pasar de afirmativo a negativo, o al revés, o cambiar de tiempo, si sigue encajando con el verbo omitido", pt: "O auxiliar pode passar de afirmativo a negativo, ou o contrário, ou mudar de tempo, se ainda combina com o verbo omitido", fr: "L’auxiliaire peut passer de l’affirmatif au négatif, ou l’inverse, ou changer de temps, s’il convient encore au verbe omis", de: "Das Hilfsverb darf von bejaht zu verneint wechseln, oder umgekehrt, oder die Zeit ändern, wenn es noch zum weggelassenen Verb passt", it: "L'ausiliare può passare da affermativo a negativo, o viceversa, o cambiare tempo, se è ancora adatto al verbo omesso", pl: "Czasownik pomocniczy może zmienić formę z twierdzącej na przeczącą lub odwrotnie albo zmienić czas, jeśli nadal pasuje do pominiętego czasownika", tr: "Yardımcı fiil, düşen fiile hâlâ uyuyorsa olumlu ya da olumsuz biçimini veya zamanını değiştirebilir", id: "Kata kerja bantu boleh berganti positif atau negatif, atau berganti tense, asalkan masih cocok dengan kata kerja yang dihilangkan", vi: "Trợ động từ có thể đổi giữa khẳng định và phủ định hoặc đổi thì, miễn là vẫn hợp với động từ bị lược" }, ex: { examples: [["She didn't phone, but she ", { target: "should have" }, "."], ["He doesn't swim now, but he ", { target: did }, " once."]] }, tr: { uk: { examples: ["Вона не зателефонувала, але мала б.", "Тепер він не плаває, а колись плавав."] }, es: { examples: ["No llamó, pero debería haberlo hecho.", "Ahora no nada, pero antes sí."] }, pt: { examples: ["Ela não ligou, mas deveria ter ligado.", "Agora ele não nada, mas já nadou."] }, fr: { examples: ["Elle n’a pas téléphoné, mais elle aurait dû.", "Il ne nage plus maintenant, mais il nageait autrefois."] }, de: { examples: ["Sie hat nicht angerufen, aber sie hätte es tun sollen.", "Er schwimmt jetzt nicht, aber früher hat er es getan."] }, it: { examples: ["Non ha telefonato, ma avrebbe dovuto.", "Ora non nuota, ma un tempo nuotava."] }, pl: { examples: ["Nie zadzwoniła, ale powinna była.", "Teraz nie pływa, ale kiedyś pływał."] }, tr: { examples: ["Telefon etmedi ama etmeliydi.", "Şimdi yüzmüyor ama bir zamanlar yüzerdi."] }, id: { examples: ["Dia tidak menelepon, tetapi seharusnya dia menelepon.", "Sekarang dia tidak berenang, tetapi dulu pernah."] }, vi: { examples: ["Cô ấy không gọi điện, nhưng lẽ ra cô ấy nên gọi.", "Bây giờ anh ấy không bơi, nhưng trước đây thì có."] } } }
          - { level: C1, use: { en: ["A different form of ", { term: be }, " or ", { term: have }, " returns in full"], uk: ["Інша форма ", { term: "be" }, " або ", { term: "have" }, " повертається повністю"], es: ["Una forma distinta de ", { term: "be" }, " o ", { term: "have" }, " vuelve a aparecer completa"], pt: ["Uma forma diferente de ", { term: "be" }, " ou ", { term: "have" }, " volta por inteiro"], fr: ["Une autre forme de ", { term: "be" }, " ou de ", { term: "have" }, " revient en entier"], de: ["Eine andere Form von ", { term: "be" }, " oder ", { term: "have" }, " steht wieder vollständig"], it: ["Una forma diversa di ", { term: "be" }, " o ", { term: "have" }, " ritorna per intero"], pl: ["Inna forma ", { term: "be" }, " lub ", { term: "have" }, " wraca w całości"], tr: [{ term: "be" }, " ya da ", { term: "have" }, " fiilinin farklı bir biçimi tam olarak geri gelir"], id: ["Bentuk ", { term: "be" }, " atau ", { term: "have" }, " yang berbeda muncul kembali secara utuh"], vi: ["Một dạng khác của ", { term: "be" }, " hoặc ", { term: "have" }, " xuất hiện lại đầy đủ"] }, ex: ["He was here at nine, and she ", { target: "has been" }, " here since eight."], tr: { uk: "Він був тут о дев’ятій, а вона тут з восьмої.", es: "Él estuvo aquí a las nueve, y ella lleva aquí desde las ocho.", pt: "Ele estava aqui às nove, e ela está aqui desde as oito.", fr: "Il était ici à neuf heures, et elle est ici depuis huit heures.", de: "Er war um neun hier, und sie ist schon seit acht hier.", it: "Lui era qui alle nove, e lei è qui dalle otto.", pl: "On był tu o dziewiątej, a ona jest tu od ósmej.", tr: "Tom dokuzda buradaydı, Ann ise sekizden beri burada.", id: "Tom ada di sini pukul sembilan, dan Ann sudah di sini sejak pukul delapan.", vi: "Anh ấy có mặt ở đây lúc chín giờ, còn cô ấy đã ở đây từ tám giờ." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A different verb is never left out: it appears in the clause.", uk: "Інше дієслово ніколи не випускають: воно стоїть у реченні.", es: "Un verbo distinto nunca se omite: aparece en la oración.", pt: "Um verbo diferente nunca é omitido: ele aparece na oração.", fr: "Un verbe différent n’est jamais omis : il apparaît dans la proposition.", de: "Ein anderes Verb wird nie weggelassen: Es steht im Satz.", it: "Un verbo diverso non si omette mai: compare nella proposizione.", pl: "Innego czasownika nigdy się nie pomija: pojawia się w zdaniu.", tr: "Farklı bir fiil asla düşmez: cümlede yer alır.", id: "Kata kerja yang berbeda tidak pernah dihilangkan: ia muncul dalam klausa.", vi: "Một động từ khác không bao giờ bị lược: nó xuất hiện trong mệnh đề." }
            ex: ["Tom plays the guitar, and Ann ", { target: sings }, "."]
            tr: { uk: "Том грає на гітарі, а Анна співає.", es: "Tom toca la guitarra y Ana canta.", pt: "O Tom toca violão e a Ana canta.", fr: "Tom joue de la guitare et Anne chante.", de: "Tom spielt Gitarre und Anna singt.", it: "Tom suona la chitarra e Anna canta.", pl: "Tom gra na gitarze, a Anna śpiewa.", tr: "Tom gitar çalıyor, Ann ise şarkı söylüyor.", id: "Tom bermain gitar, dan Ann bernyanyi.", vi: "Tom chơi guitar còn Ann hát." }

  - title: { en: "Typical errors", uk: "Типові помилки", es: "Errores típicos", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - level: B2
            wrong: "So I do."
            right: [{ target: "So do I" }, "."]
            rule: { en: ["after ", { term: so }, ", the auxiliary comes before the new subject"], uk: ["після ", { term: "so" }, " допоміжне дієслово стоїть перед новим підметом"], es: ["después de ", { term: "so" }, ", el auxiliar va antes del nuevo sujeto"], pt: ["depois de ", { term: "so" }, ", o auxiliar vem antes do novo sujeito"], fr: ["après ", { term: "so" }, ", l’auxiliaire se place avant le nouveau sujet"], de: ["nach ", { term: "so" }, " steht das Hilfsverb vor dem neuen Subjekt"], it: ["dopo ", { term: "so" }, ", l'ausiliare va prima del nuovo soggetto"], pl: ["po ", { term: "so" }, " czasownik pomocniczy stoi przed nowym podmiotem"], tr: [{ term: "so" }, " sonrasında yardımcı fiil yeni öznenin önüne gelir"], id: ["setelah ", { term: "so" }, ", kata kerja bantu ditempatkan sebelum subjek yang baru"], vi: ["sau ", { term: "so" }, ", trợ động từ đứng trước chủ ngữ mới"] }
          - level: B2
            wrong: "Neither don't I."
            right: [{ target: "Neither do I" }, "."]
            rule: { en: [{ term: neither }, " is negative, so the auxiliary stays positive"], uk: [{ term: "neither" }, " уже заперечне, тому допоміжне дієслово залишається стверджувальним"], es: [{ term: "neither" }, " es negativo, así que el auxiliar queda afirmativo"], pt: [{ term: "neither" }, " é negativo, então o auxiliar fica afirmativo"], fr: [{ term: "neither" }, " est négatif, donc l’auxiliaire reste affirmatif"], de: [{ term: "neither" }, " ist verneint, also bleibt das Hilfsverb bejaht"], it: [{ term: "neither" }, " è negativo, quindi l'ausiliare resta affermativo"], pl: [{ term: "neither" }, " jest przeczące, więc czasownik pomocniczy zostaje twierdzący"], tr: [{ term: "neither" }, " olumsuzdur, bu yüzden yardımcı fiil olumlu kalır"], id: [{ term: "neither" }, " sudah negatif, jadi kata kerja bantu tetap positif"], vi: [{ term: "neither" }, " đã mang nghĩa phủ định, nên trợ động từ giữ dạng khẳng định"] }
          - level: B2
            wrong: "She is late, and so does he."
            right: ["She is late, and ", { target: "so is he" }, "."]
            rule: { en: [{ term: be }, " is answered by ", { term: be }], uk: ["на ", { term: "be" }, " відповідають ", { term: "be" }], es: [{ term: "be" }, " se responde con ", { term: "be" }], pt: [{ term: "be" }, " é respondido com ", { term: "be" }], fr: [{ term: "be" }, " appelle ", { term: "be" }, " en réponse"], de: ["auf ", { term: "be" }, " antwortet man mit ", { term: "be" }], it: ["a ", { term: "be" }, " si risponde con ", { term: "be" }], pl: ["na ", { term: "be" }, " odpowiada się ", { term: "be" }], tr: [{ term: "be" }, " fiiline ", { term: "be" }, " ile karşılık verilir"], id: [{ term: "be" }, " dijawab dengan ", { term: "be" }], vi: [{ term: "be" }, " được đáp bằng ", { term: "be" }] }
          - level: B2
            wrong: "I hope it not."
            right: ["I ", { target: "hope not" }, "."]
            rule: { en: [{ term: not }, " replaces the whole clause after ", { term: hope }], uk: [{ term: "not" }, " замінює все речення після ", { term: "hope" }], es: [{ term: "not" }, " sustituye toda la oración después de ", { term: "hope" }], pt: [{ term: "not" }, " substitui toda a oração depois de ", { term: "hope" }], fr: [{ term: "not" }, " remplace toute la proposition après ", { term: "hope" }], de: [{ term: "not" }, " ersetzt nach ", { term: "hope" }, " den ganzen Satz"], it: [{ term: "not" }, " sostituisce l'intera proposizione dopo ", { term: "hope" }], pl: [{ term: "not" }, " zastępuje całe zdanie po ", { term: "hope" }], tr: [{ term: "hope" }, " sonrasında ", { term: "not" }, " bütün cümlenin yerini tutar"], id: [{ term: "not" }, " menggantikan seluruh klausa setelah ", { term: "hope" }], vi: [{ term: "not" }, " thay cho cả mệnh đề sau ", { term: "hope" }] }
          - level: B2
