          - { level: B2, form: "do it", use: { en: "informal; the action just named or about to happen", uk: "неформальне; дія, яку щойно назвали або яка ось-ось станеться", es: "informal; la acción que se acaba de nombrar o que va a ocurrir", pt: "informal; a ação que acabou de ser nomeada ou que vai acontecer", fr: "familier ; l’action qui vient d’être nommée ou qui va avoir lieu", de: "umgangssprachlich; die gerade genannte oder bevorstehende Handlung", it: "informale; l'azione appena nominata o che sta per accadere", pl: "nieformalne; czynność przed chwilą nazwana lub zaraz mająca nastąpić", tr: "gündelik; az önce adı geçen ya da olmak üzere olan eylem", id: "informal; tindakan yang baru disebut atau akan terjadi", vi: "thân mật; hành động vừa được nhắc đến hoặc sắp xảy ra" }, ex: { exchange: ["Can you lock up?", ["Yes, I'll ", { target: "do it" }, " now."]] }, tr: { uk: { exchange: ["Ти замкнеш усе?", "Так, зараз зроблю."] }, es: { exchange: ["¿Puedes cerrar con llave?", "Sí, lo hago ahora."] }, pt: { exchange: ["Você pode trancar tudo?", "Sim, faço isso agora."] }, fr: { exchange: ["Tu peux fermer à clé ?", "Oui, je m’en occupe maintenant."] }, de: { exchange: ["Kannst du abschließen?", "Ja, mache ich jetzt."] }, it: { exchange: ["Puoi chiudere a chiave?", "Sì, lo faccio adesso."] }, pl: { exchange: ["Możesz zamknąć?", "Tak, zaraz to zrobię."] }, tr: { exchange: ["Kapıları kilitleyebilir misin?", "Evet, hemen yapıyorum."] }, id: { exchange: ["Bisakah kamu mengunci semuanya?", "Ya, akan kulakukan sekarang."] }, vi: { exchange: ["Bạn khóa cửa giúp được không?", "Được, tôi làm ngay bây giờ."] } } }
