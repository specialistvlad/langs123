          - { level: C1, form: "do", use: { en: ["a verb phrase after ", { term: than }, " and ", { term: as }], uk: ["дієслівна група після ", { term: "than" }, " і ", { term: "as" }], es: ["un grupo verbal después de ", { term: "than" }, " y ", { term: "as" }], pt: ["um grupo verbal depois de ", { term: "than" }, " e ", { term: "as" }], fr: ["un groupe verbal après ", { term: "than" }, " et ", { term: "as" }], de: ["eine Verbgruppe nach ", { term: "than" }, " und ", { term: "as" }], it: ["un sintagma verbale dopo ", { term: "than" }, " e ", { term: "as" }], pl: ["grupa czasownikowa po ", { term: "than" }, " i ", { term: "as" }], tr: [{ term: "than" }, " ve ", { term: "as" }, " sonrasında bir fiil öbeği"], id: ["frasa verba setelah ", { term: "than" }, " dan ", { term: "as" }], vi: ["cụm động từ sau ", { term: "than" }, " và ", { term: "as" }] }, ex: { examples: [["She runs faster than he ", { target: does }, "."], ["He earns as much as she ", { target: does }, "."]] }, tr: { uk: { examples: ["Вона бігає швидше за нього.", "Він заробляє стільки ж, скільки вона."] }, es: { examples: ["Ella corre más rápido que él.", "Él gana tanto como ella."] }, pt: { examples: ["Ela corre mais rápido que ele.", "Ele ganha tanto quanto ela."] }, fr: { examples: ["Elle court plus vite que lui.", "Il gagne autant qu’elle."] }, de: { examples: ["Sie läuft schneller als er.", "Er verdient so viel wie sie."] }, it: { examples: ["Lei corre più veloce di lui.", "Lui guadagna quanto lei."] }, pl: { examples: ["Ona biega szybciej niż on.", "On zarabia tyle samo co ona."] }, tr: { examples: ["Ann, Tom’dan daha hızlı koşuyor.", "Tom, Ann kadar kazanıyor."] }, id: { examples: ["Ann berlari lebih cepat daripada Tom.", "Tom berpenghasilan sama banyak dengan Ann."] }, vi: { examples: ["Cô ấy chạy nhanh hơn anh ấy.", "Anh ấy kiếm được nhiều bằng cô ấy."] } } }
