          - level: B2
            wrong: "I bought two ones."
            right: ["I bought ", { target: two }, "."]
            rule: { en: ["a number stands alone, or takes an adjective before ", { term: ones }], uk: ["числівник стоїть сам або має прикметник перед ", { term: "ones" }], es: ["un número va solo o lleva un adjetivo antes de ", { term: "ones" }], pt: ["um número fica sozinho ou leva um adjetivo antes de ", { term: "ones" }], fr: ["un nombre s’emploie seul ou prend un adjectif devant ", { term: "ones" }], de: ["eine Zahl steht allein oder hat ein Adjektiv vor ", { term: "ones" }], it: ["un numero sta da solo o prende un aggettivo prima di ", { term: "ones" }], pl: ["liczebnik stoi sam albo ma przymiotnik przed ", { term: "ones" }], tr: ["sayı tek başına durur ya da ", { term: "ones" }, " öncesinde bir sıfat alır"], id: ["angka berdiri sendiri, atau memakai kata sifat sebelum ", { term: "ones" }], vi: ["số từ đứng một mình, hoặc có tính từ trước ", { term: "ones" }] }
          - level: B2
            wrong: "I didn't want to go, but I had."
            right: ["I didn't want to go, but I ", { target: "had to" }, "."]
            rule: { en: [{ term: to }, " stays when its verb goes"], uk: [{ term: "to" }, " залишається, коли дієслово після нього випадає"], es: [{ term: "to" }, " se queda cuando se omite su verbo"], pt: [{ term: "to" }, " fica quando o seu verbo é omitido"], fr: [{ term: "to" }, " reste quand son verbe disparaît"], de: [{ term: "to" }, " bleibt stehen, wenn sein Verb wegfällt"], it: [{ term: "to" }, " resta quando il suo verbo cade"], pl: [{ term: "to" }, " zostaje, gdy znika jego czasownik"], tr: [{ term: "to" }, ", fiili düştüğünde kalır"], id: [{ term: "to" }, " tetap ada ketika kata kerjanya dihilangkan"], vi: [{ term: "to" }, " vẫn ở lại khi động từ của nó bị lược"] }
          - level: C1
            wrong: "The prices here are higher than that in town."
            right: ["The prices here are higher than ", { target: those }, " in town."]
            rule: { en: [{ term: that }, " stands for a singular noun and ", { term: those }, " for a plural one"], uk: [{ term: "that" }, " замінює іменник в однині, а ", { term: "those" }, " — у множині"], es: [{ term: "that" }, " sustituye un sustantivo singular y ", { term: "those" }, ", uno plural"], pt: [{ term: "that" }, " substitui um substantivo no singular e ", { term: "those" }, ", um no plural"], fr: [{ term: "that" }, " remplace un nom singulier et ", { term: "those" }, ", un nom pluriel"], de: [{ term: "that" }, " steht für ein Nomen im Singular, ", { term: "those" }, " für eines im Plural"], it: [{ term: "that" }, " sostituisce un sostantivo singolare e ", { term: "those" }, " uno plurale"], pl: [{ term: "that" }, " zastępuje rzeczownik w liczbie pojedynczej, a ", { term: "those" }, " — w mnogiej"], tr: [{ term: "that" }, " tekil bir ismin, ", { term: "those" }, " ise çoğul bir ismin yerini tutar"], id: [{ term: "that" }, " menggantikan kata benda tunggal dan ", { term: "those" }, " menggantikan kata benda jamak"], vi: [{ term: "that" }, " thay cho danh từ số ít, còn ", { term: "those" }, " thay cho danh từ số nhiều"] }
          - level: C1
            wrong: "Ann, Tom and Sue came, and the latter stayed late."
            right: ["Ann, Tom and Sue came, and ", { target: Sue }, " stayed late."]
            rule: { en: [{ term: "the former" }, " and ", { term: "the latter" }, " name one of two things"], uk: [{ term: "the former" }, " і ", { term: "the latter" }, " називають одну з двох речей"], es: [{ term: "the former" }, " y ", { term: "the latter" }, " nombran una de dos cosas"], pt: [{ term: "the former" }, " e ", { term: "the latter" }, " indicam uma de duas coisas"], fr: [{ term: "the former" }, " et ", { term: "the latter" }, " désignent l’une de deux choses"], de: [{ term: "the former" }, " und ", { term: "the latter" }, " bezeichnen eines von zwei Dingen"], it: [{ term: "the former" }, " e ", { term: "the latter" }, " indicano una di due cose"], pl: [{ term: "the former" }, " i ", { term: "the latter" }, " wskazują jedną z dwóch rzeczy"], tr: [{ term: "the former" }, " ve ", { term: "the latter" }, " iki şeyden birini adlandırır"], id: [{ term: "the former" }, " dan ", { term: "the latter" }, " menyebut salah satu dari dua hal"], vi: [{ term: "the former" }, " và ", { term: "the latter" }, " chỉ một trong hai điều"] }
          - level: C1
            wrong: "He passed the test, what surprised us."
            right: ["He passed the test, ", { target: which }, " surprised us."]
            rule: { en: ["a comment on a whole clause takes ", { term: which }], uk: ["коментар до цілого речення вживається з ", { term: "which" }], es: ["un comentario sobre toda una oración lleva ", { term: "which" }], pt: ["um comentário sobre uma oração inteira leva ", { term: "which" }], fr: ["un commentaire sur toute une proposition prend ", { term: "which" }], de: ["ein Kommentar zu einem ganzen Satz verlangt ", { term: "which" }], it: ["un commento su un'intera proposizione prende ", { term: "which" }], pl: ["komentarz do całego zdania wymaga ", { term: "which" }], tr: ["bütün bir cümleye yönelik yorum ", { term: "which" }, " alır"], id: ["komentar atas seluruh klausa memakai ", { term: "which" }], vi: ["lời nhận xét về cả mệnh đề dùng ", { term: "which" }] }
          - level: C1
            wrong: "Who wants tea? I."
            right: ["Who wants tea? ", { target: Me }, "."]
            rule: { en: "a bare answer takes the object pronoun", uk: "відповідь без дієслова бере займенник-додаток", es: "una respuesta sin verbo lleva el pronombre objeto", pt: "uma resposta sem verbo leva o pronome objeto", fr: "une réponse sans verbe prend le pronom complément", de: "eine Antwort ohne Verb verwendet das Objektpronomen", it: "una risposta senza verbo prende il pronome complemento", pl: "odpowiedź bez czasownika przyjmuje zaimek dopełnienia", tr: "fiilsiz bir cevap nesne zamirini alır", id: "jawaban tanpa kata kerja memakai kata ganti objek", vi: "câu đáp không có động từ dùng đại từ tân ngữ" }
