            text: { en: ["Be answers ", { term: be }, ", and the reply agrees with its own subject."], uk: ["На ", { term: "be" }, " відповідають ", { term: "be" }, ", і ця форма узгоджується з власним підметом відповіді."], es: [{ term: "be" }, " se responde con ", { term: "be" }, ", y la forma concuerda con el sujeto de la respuesta."], pt: [{ term: "be" }, " é respondido com ", { term: "be" }, ", e a forma concorda com o sujeito da própria resposta."], fr: [{ term: "be" }, " appelle ", { term: "be" }, " en réponse, et la forme s’accorde avec le sujet de la réponse."], de: ["Auf ", { term: "be" }, " antwortet man mit ", { term: "be" }, ", und die Form richtet sich nach dem eigenen Subjekt der Antwort."], it: ["A ", { term: "be" }, " si risponde con ", { term: "be" }, ", e la forma concorda con il soggetto della risposta."], pl: ["Na ", { term: "be" }, " odpowiada się ", { term: "be" }, ", a forma zgadza się z podmiotem odpowiedzi."], tr: [{ term: "be" }, " fiiline ", { term: "be" }, " ile karşılık verilir ve biçim, cevabın kendi öznesine uyar."], id: [{ term: "be" }, " dijawab dengan ", { term: "be" }, ", dan bentuknya mengikuti subjek jawaban itu sendiri."], vi: [{ term: "be" }, " được đáp bằng ", { term: "be" }, ", và dạng của nó hợp với chủ ngữ riêng của câu đáp."] }
