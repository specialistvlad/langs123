", ", { term: "that remark" }, "."], vi: ["Khi ", { term: "it" }, ", ", { term: "this" }, " hoặc ", { term: "that" }, " có thể chỉ một danh từ, hãy thêm một danh từ: ", { term: "this decision" }, ", ", { term: "that remark" }, "."] }
