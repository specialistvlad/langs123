summary:
  lead:
    en: ["Ellipsis drops words the listener can supply, and ", { term: so }, ", ", { term: one }, " and ", { term: "do so" }, " replace longer phrases."]
    uk: ["Еліпсис випускає слова, які слухач може відновити, а ", { term: "so" }, ", ", { term: "one" }, " і ", { term: "do so" }, " замінюють довші вирази."]
    es: ["La elipsis omite palabras que el oyente puede suplir, y ", { term: "so" }, ", ", { term: "one" }, " y ", { term: "do so" }, " sustituyen expresiones más largas."]
    pt: ["A elipse omite palavras que o ouvinte pode suprir, e ", { term: "so" }, ", ", { term: "one" }, " e ", { term: "do so" }, " substituem expressões mais longas."]
    fr: ["L’ellipse omet des mots que l’auditeur peut rétablir, et ", { term: "so" }, ", ", { term: "one" }, " et ", { term: "do so" }, " remplacent des expressions plus longues."]
    de: ["Die Ellipse lässt Wörter weg, die der Hörer ergänzen kann, und ", { term: "so" }, ", ", { term: "one" }, " und ", { term: "do so" }, " ersetzen längere Ausdrücke."]
    it: ["L'ellissi omette parole che chi ascolta può ricostruire, e ", { term: "so" }, ", ", { term: "one" }, " e ", { term: "do so" }, " sostituiscono espressioni più lunghe."]
    pl: ["Elipsa pomija słowa, które słuchacz może dopowiedzieć, a ", { term: "so" }, ", ", { term: "one" }, " i ", { term: "do so" }, " zastępują dłuższe wyrażenia."]
    tr: ["Eksiltme, dinleyenin tamamlayabileceği sözcükleri düşürür; ", { term: "so" }, ", ", { term: "one" }, " ve ", { term: "do so" }, " ise daha uzun ifadelerin yerini tutar."]
    id: ["Elipsis menghilangkan kata yang dapat dilengkapi pendengar, dan ", { term: "so" }, ", ", { term: "one" }, " serta ", { term: "do so" }, " menggantikan frasa yang lebih panjang."]
    vi: ["Tỉnh lược bỏ những từ mà người nghe có thể tự bổ sung, còn ", { term: "so" }, ", ", { term: "one" }, " và ", { term: "do so" }, " thay cho những cụm dài hơn."]
  rule:
    en: "An agreeing reply puts the auxiliary before the new subject:"
    uk: "Відповідь-згода ставить допоміжне дієслово перед новим підметом:"
    es: "Una respuesta de acuerdo pone el auxiliar antes del nuevo sujeto:"
    pt: "Uma resposta de concordância põe o auxiliar antes do novo sujeito:"
    fr: "Une réponse d’accord place l’auxiliaire avant le nouveau sujet :"
    de: "Eine zustimmende Antwort stellt das Hilfsverb vor das neue Subjekt:"
    it: "Una risposta di accordo mette l'ausiliare prima del nuovo soggetto:"
    pl: "Odpowiedź wyrażająca zgodę stawia czasownik pomocniczy przed nowym podmiotem:"
    tr: "Katılma cevabında yardımcı fiil, yeni öznenin önüne gelir:"
    id: "Jawaban persetujuan menempatkan kata kerja bantu sebelum subjek yang baru:"
    vi: "Câu đáp đồng tình đặt trợ động từ trước chủ ngữ mới:"
