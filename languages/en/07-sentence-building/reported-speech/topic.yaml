title: { en: Reported Speech, uk: Непряма мова, es: El estilo indirecto, pt: "Discurso indireto", fr: "Le discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Câu gián tiếp" }
summary:
  lead:
    en: ["Reported speech tells what someone said without quoting it, with ", { term: say }, ", ", { term: tell }, " and ", { term: ask }, "."]
    uk: ["Непряма мова передає чиїсь слова без цитування за допомогою дієслів ", { term: say }, ", ", { term: tell }, " і ", { term: ask }, "."]
    es: ["El estilo indirecto cuenta lo que alguien dijo sin citarlo, con ", { term: say }, ", ", { term: tell }, " y ", { term: ask }, "."]
    pt: ["O discurso indireto conta o que alguém disse sem citar suas palavras, com ", { term: "say" }, ", ", { term: "tell" }, " e ", { term: "ask" }, "."]
    fr: ["Le discours indirect rapporte ce que quelqu’un a dit sans le citer, avec ", { term: "say" }, ", ", { term: "tell" }, " et ", { term: "ask" }, "."]
    de: ["Die indirekte Rede gibt wieder, was jemand gesagt hat, ohne es wörtlich zu zitieren, mit ", { term: "say" }, ", ", { term: "tell" }, " und ", { term: "ask" }, "."]
    it: ["Il discorso indiretto riferisce ciò che qualcuno ha detto senza citarlo, con ", { term: "say" }, ", ", { term: "tell" }, " e ", { term: "ask" }, "."]
    pl: ["Mowa zależna przekazuje czyjeś słowa bez cytowania, za pomocą czasowników ", { term: "say" }, ", ", { term: "tell" }, " i ", { term: "ask" }, "."]
    tr: ["Dolaylı anlatım, birinin söylediğini alıntılamadan ", { term: "say" }, ", ", { term: "tell" }, " ve ", { term: "ask" }, " fiilleriyle aktarır."]
    id: ["Kalimat tak langsung menyampaikan apa yang dikatakan seseorang tanpa mengutipnya, dengan ", { term: "say" }, ", ", { term: "tell" }, " dan ", { term: "ask" }, "."]
    vi: ["Câu gián tiếp thuật lại điều ai đó đã nói mà không trích dẫn, với ", { term: "say" }, ", ", { term: "tell" }, " và ", { term: "ask" }, "."]
  rule:
    en: "After a past verb the tense moves one step back and questions take statement order:"
    uk: "Після дієслова в минулому часі час зсувається на один крок назад, а питання мають порядок слів розповідного речення:"
    es: "Después de un verbo en pasado el tiempo retrocede un paso y las preguntas siguen el orden de una afirmación:"
    pt: "Depois de um verbo no passado, o tempo verbal recua um passo e as perguntas seguem a ordem de uma afirmação:"
    fr: "Après un verbe au passé, le temps recule d’un cran et les questions suivent l’ordre d’une phrase affirmative :"
    de: "Nach einem Verb in der Vergangenheit rückt die Zeitform um einen Schritt zurück, und Fragen haben die Wortstellung eines Aussagesatzes:"
    it: "Dopo un verbo al passato il tempo retrocede di un passo e le domande seguono l'ordine della frase affermativa:"
    pl: "Po czasowniku w czasie przeszłym czas cofa się o jeden krok, a pytania mają szyk zdania oznajmującego:"
    tr: "Geçmiş zamanlı bir fiilden sonra zaman bir adım geriye kayar ve sorular düz cümle sırasını alır:"
    id: "Setelah kata kerja dalam bentuk past, tense bergeser satu langkah ke belakang dan pertanyaan memakai urutan kalimat pernyataan:"
    vi: "Sau động từ ở quá khứ, thì lùi một bậc và câu hỏi có trật tự như câu trần thuật:"
  ex: ["She asked where I ", { target: lived }, "."]

