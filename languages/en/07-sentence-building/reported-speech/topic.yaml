        - { level: B1, point: { en: Questions, uk: "Питання", es: "Preguntas", pt: "Perguntas", fr: "Questions", de: "Fragen", it: "Domande", pl: "Pytania", tr: "Sorular", id: "Pertanyaan", vi: "Câu hỏi" }, rule: { en: ["yes/no questions take ", { term: if }, " or ", { term: whether }, "; wh-questions keep the wh-word"], uk: ["загальні питання вживаються з ", { term: if }, " або ", { term: whether }, "; wh-питання зберігають питальне слово"], es: ["las preguntas de sí o no llevan ", { term: if }, " o ", { term: whether }, "; las preguntas con wh- conservan la palabra interrogativa"], pt: ["as perguntas de sim ou não levam ", { term: "if" }, " ou ", { term: "whether" }, "; as perguntas com wh- mantêm a palavra interrogativa"], fr: ["les questions fermées prennent ", { term: "if" }, " ou ", { term: "whether" }, " ; les questions avec un mot interrogatif gardent ce mot"], de: ["Entscheidungsfragen nehmen ", { term: "if" }, " oder ", { term: "whether" }, "; wh-Fragen behalten das Fragewort"], it: ["le domande sì o no hanno ", { term: "if" }, " o ", { term: "whether" }, "; le domande con wh- mantengono la parola interrogativa"], pl: ["pytania ogólne łączą się z ", { term: "if" }, " lub ", { term: "whether" }, "; pytania z wh- zachowują słowo pytające"], tr: ["evet/hayır soruları ", { term: "if" }, " veya ", { term: "whether" }, " alır; wh-soruları soru sözcüğünü korur"], id: ["pertanyaan ya/tidak memakai ", { term: "if" }, " atau ", { term: "whether" }, "; pertanyaan wh- tetap memakai kata tanya wh"], vi: ["câu hỏi có/không dùng ", { term: "if" }, " hoặc ", { term: "whether" }, "; câu hỏi với từ để hỏi giữ nguyên từ để hỏi"] }, ex: ["She asked ", { target: if }, " I ", { target: liked }, " tea."], tr: { uk: "Вона запитала, чи я люблю чай.", es: "Me preguntó si me gustaba el té.", pt: "Ela perguntou se eu gostava de chá.", fr: "Elle m’a demandé si j’aimais le thé.", de: "Sie fragte mich, ob ich Tee mag.", it: "Mi ha chiesto se mi piaceva il tè.", pl: "Zapytała, czy lubię herbatę.", tr: "Çayı sevip sevmediğimi sordu.", id: "Dia bertanya apakah saya suka teh.", vi: "Cô ấy hỏi tôi có thích trà không." } }
        - { level: B1, point: { en: Commands, uk: "Накази", es: "Órdenes", pt: "Ordens", fr: "Ordres", de: "Aufforderungen", it: "Ordini", pl: "Polecenia", tr: "Emirler", id: "Perintah", vi: "Mệnh lệnh" }, rule: { pattern: [{ alternatives: [told, asked] }, { slot: person }, [{ optional: not }, " to"], { slot: V }] }, ex: ["He ", { target: told us not to be }, " late."], tr: { uk: "Він сказав нам не запізнюватися.", es: "Nos dijo que no llegáramos tarde.", pt: "Ele nos disse para não chegarmos atrasados.", fr: "Il nous a dit de ne pas arriver en retard.", de: "Er sagte uns, wir sollten nicht zu spät kommen.", it: "Ci ha detto di non fare tardi.", pl: "Powiedział nam, żebyśmy się nie spóźnili.", tr: "Bize geç kalmamamızı söyledi.", id: "Dia menyuruh kami agar tidak terlambat.", vi: "Anh ấy bảo chúng tôi đừng đến muộn." } }
        - { level: B2, point: { en: Reporting verbs, uk: "Дієслова мовлення", es: "Verbos introductorios", pt: "Verbos introdutórios", fr: "Verbes introducteurs", de: "Einleitende Verben", it: "Verbi introduttivi", pl: "Czasowniki wprowadzające", tr: "Aktarma fiilleri", id: "Kata kerja pelapor", vi: "Động từ tường thuật" }, rule: { en: "each verb has its own pattern: that-clause, to-infinitive or -ing", uk: ["кожне дієслово має власну схему: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " або ", { term: "-ing" }], es: ["cada verbo tiene su propia estructura: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " o ", { term: "-ing" }], pt: ["cada verbo tem seu próprio padrão: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " ou ", { term: "-ing" }], fr: ["chaque verbe a son propre schéma : ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " ou ", { term: "-ing" }], de: ["jedes Verb hat sein eigenes Muster: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " oder ", { term: "-ing" }], it: ["ogni verbo ha il suo schema: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " o ", { term: "-ing" }], pl: ["każdy czasownik ma własny schemat: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " lub ", { term: "-ing" }], tr: ["her fiilin kendi kalıbı vardır: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " ya da ", { term: "-ing" }], id: ["setiap kata kerja punya pola sendiri: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " atau ", { term: "-ing" }], vi: ["mỗi động từ có mẫu câu riêng: ", { pattern: [{ term: "that" }, { slot: "clause" }] }, ", ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " hoặc ", { term: "-ing" }] }, ex: ["She ", { target: advised me to rest }, "."], tr: { uk: "Вона порадила мені відпочити.", es: "Me aconsejó descansar.", pt: "Ela me aconselhou a descansar.", fr: "Elle m’a conseillé de me reposer.", de: "Sie riet mir, mich auszuruhen.", it: "Mi ha consigliato di riposarmi.", pl: "Poradziła mi, żebym odpoczął.", tr: "Bana dinlenmemi tavsiye etti.", id: "Dia menyarankan saya beristirahat.", vi: "Cô ấy khuyên tôi nghỉ ngơi." } }
        - { level: C1, point: { en: Distancing, uk: "Дистанціювання", es: "Distanciamiento", pt: "Distanciamento", fr: "Prise de distance", de: "Distanzierung", it: "Presa di distanza", pl: "Dystansowanie się", tr: "Mesafe koyma", id: "Menjaga jarak", vi: "Giữ khoảng cách" }, rule: { en: [{ term: claim }, ", ", { term: allege }, ", ", { term: reportedly }, ": the reporter does not vouch for it"], uk: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": той, хто передає слова, не ручається за них"], es: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": quien informa no garantiza que sea cierto"], pt: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": quem relata não garante que seja verdade"], fr: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, " : la personne qui rapporte ne s’en porte pas garante"], de: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": Wer berichtet, bürgt nicht dafür"], it: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": chi riferisce non garantisce che sia vero"], pl: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": osoba relacjonująca nie ręczy za to"], tr: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": aktaran kişi bunun doğru olduğunu garanti etmez"], id: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": pelapor tidak menjamin kebenarannya"], vi: [{ term: "claim" }, ", ", { term: "allege" }, ", ", { term: "reportedly" }, ": người tường thuật không bảo đảm điều đó là đúng"] }, ex: ["The witness ", { target: claims }, " that she saw the car."], tr: { uk: "Свідок стверджує, що вона бачила машину.", es: "La testigo afirma que vio el auto.", pt: "A testemunha afirma que viu o carro.", fr: "La témoin affirme qu’elle a vu la voiture.", de: "Die Zeugin behauptet, sie habe das Auto gesehen.", it: "La testimone dichiara di aver visto l'auto.", pl: "Świadek twierdzi, że widziała samochód.", tr: "Tanık arabayı gördüğünü iddia ediyor.", id: "Saksi itu mengklaim bahwa dia melihat mobil itu.", vi: "Nhân chứng khẳng định cô ấy đã thấy chiếc xe." } }
        - { level: C2, point: { en: Free indirect speech, uk: "Невласно-пряма мова", es: "Estilo indirecto libre", pt: "Discurso indireto livre", fr: "Discours indirect libre", de: "Erlebte Rede", it: "Discorso indiretto libero", pl: "Mowa pozornie zależna", tr: "Serbest dolaylı anlatım", id: "Kalimat tak langsung bebas", vi: "Câu gián tiếp tự do" }, rule: { en: "narration gives a character's thoughts with no reporting verb", uk: "розповідь передає думки персонажа без дієслова мовлення", es: "la narración da los pensamientos de un personaje sin verbo introductorio", pt: "a narração apresenta os pensamentos de um personagem sem verbo introdutório", fr: "le récit donne les pensées d’un personnage sans verbe introducteur", de: "die Erzählung gibt die Gedanken einer Figur ohne einleitendes Verb wieder", it: "la narrazione riporta i pensieri di un personaggio senza verbo introduttivo", pl: "narracja oddaje myśli bohatera bez czasownika wprowadzającego", tr: "anlatı, bir karakterin düşüncelerini aktarma fiili olmadan verir", id: "narasi menyampaikan pikiran tokoh tanpa kata kerja pelapor", vi: "lời kể trình bày suy nghĩ của nhân vật mà không có động từ tường thuật" }, ex: ["She was late. ", { target: What would he say? }], tr: { uk: "Вона запізнилася. Що він скаже?", es: "Llegaba tarde. ¿Qué diría él?", pt: "Ela estava atrasada. O que ele diria?", fr: "Elle était en retard. Que dirait-il ?", de: "Sie war spät dran. Was würde er sagen?", it: "Era in ritardo. Che cosa avrebbe detto lui?", pl: "Spóźniła się. Co on powie?", tr: "Geç kalmıştı. Ne derdi?", id: "Dia terlambat. Apa yang akan dia katakan?", vi: "Cô ấy đã đến muộn. Anh ấy sẽ nói gì đây?" } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["a reported question has statement order, with no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], uk: ["непряме питання має порядок слів розповідного речення, без ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], es: ["una pregunta indirecta tiene el orden de una afirmación, sin ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], pt: ["uma pergunta indireta tem a ordem de uma afirmação, sem ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], fr: ["une question indirecte suit l’ordre d’une phrase affirmative, sans ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], de: ["eine indirekte Frage hat die Wortstellung eines Aussagesatzes, ohne ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], it: ["una domanda indiretta ha l'ordine della frase affermativa, senza ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], pl: ["pytanie w mowie zależnej ma szyk zdania oznajmującego, bez ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], tr: ["dolaylı soru düz cümle sırasındadır, ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " kullanılmaz"], id: ["pertanyaan tak langsung memakai urutan kalimat pernyataan, tanpa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], vi: ["câu hỏi gián tiếp có trật tự như câu trần thuật, không có ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }] }, ex: ["She asked me where I ", { target: lived }, "."], tr: { uk: "Вона запитала мене, де я живу.", es: "Me preguntó dónde vivía.", pt: "Ela me perguntou onde eu morava.", fr: "Elle m’a demandé où j’habitais.", de: "Sie fragte mich, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytała mnie, gdzie mieszkam.", tr: "Bana nerede yaşadığımı sordu.", id: "Dia bertanya di mana saya tinggal.", vi: "Cô ấy hỏi tôi sống ở đâu." } }

sections:
  - title: { en: "Form: say and tell", uk: "Форма: say і tell", es: "Forma: say y tell", pt: "Forma: say e tell", fr: "Forme : say et tell", de: "Form: say und tell", it: "Forma: say e tell", pl: "Forma: say i tell", tr: "Biçim: say ve tell", id: "Bentuk: say dan tell", vi: "Dạng: say và tell" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: say, pattern: { pattern: [say, { optional: that }, { slot: clause }] }, ex: ["She ", { target: said }, " ", { optional: that }, " she was tired."], tr: { uk: "Вона сказала, що втомилася.", es: "Dijo que estaba cansada.", pt: "Ela disse que estava cansada.", fr: "Elle a dit qu’elle était fatiguée.", de: "Sie sagte, sie sei müde.", it: "Ha detto che era stanca.", pl: "Powiedziała, że jest zmęczona.", tr: "Yorgun olduğunu söyledi.", id: "Dia berkata bahwa dia lelah.", vi: "Cô ấy nói là cô ấy mệt." } }
          - { level: B1, verb: tell, pattern: { pattern: [tell, { slot: person }, { optional: that }, { slot: clause }] }, ex: ["She ", { target: told me }, " ", { optional: that }, " she was tired."], tr: { uk: "Вона сказала мені, що втомилася.", es: "Me dijo que estaba cansada.", pt: "Ela me disse que estava cansada.", fr: "Elle m’a dit qu’elle était fatiguée.", de: "Sie sagte mir, sie sei müde.", it: "Mi ha detto che era stanca.", pl: "Powiedziała mi, że jest zmęczona.", tr: "Bana yorgun olduğunu söyledi.", id: "Dia memberi tahu saya bahwa dia lelah.", vi: "Cô ấy bảo tôi là cô ấy mệt." } }
          - { level: B1, verb: say, pattern: { pattern: [say, to, { slot: person }] }, ex: ["She ", { target: said to me }, " that she was tired."], tr: { uk: "Вона сказала мені, що втомилася.", es: "Me dijo que estaba cansada.", pt: "Ela me disse que estava cansada.", fr: "Elle m’a dit qu’elle était fatiguée.", de: "Sie sagte mir, sie sei müde.", it: "Mi ha detto che era stanca.", pl: "Powiedziała mi, że jest zmęczona.", tr: "Bana yorgun olduğunu söyledi.", id: "Dia berkata kepada saya bahwa dia lelah.", vi: "Cô ấy nói với tôi là cô ấy mệt." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: tell }, " always has a person after it. ", { term: say }, " has no person, or ", { pattern: [{ term: to }, { slot: person }] }, "."]
              uk: [{ term: tell }, " завжди має після себе особу. ", { term: say }, " вживається без особи або з ", { pattern: [{ term: to }, { slot: person }] }, "."]
              es: [{ term: tell }, " siempre lleva una persona después. ", { term: say }, " no lleva persona, o lleva ", { pattern: [{ term: to }, { slot: person }] }, "."]
              pt: [{ term: "tell" }, " sempre tem uma pessoa depois. ", { term: "say" }, " não tem pessoa, ou tem ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              fr: [{ term: "tell" }, " est toujours suivi d’une personne. ", { term: "say" }, " s’emploie sans personne, ou avec ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              de: [{ term: "tell" }, " hat immer eine Person nach sich. ", { term: "say" }, " hat keine Person oder ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              it: [{ term: "tell" }, " ha sempre una persona dopo di sé. ", { term: "say" }, " non ha una persona, oppure ha ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              pl: [{ term: "tell" }, " zawsze ma po sobie osobę. ", { term: "say" }, " występuje bez osoby lub z ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              tr: [{ term: "tell" }, " fiilinden sonra her zaman kişi gelir. ", { term: "say" }, " kişisiz kullanılır ya da ", { pattern: [{ term: "to" }, { slot: "person" }] }, " alır."]
              id: [{ term: "tell" }, " selalu diikuti orang. ", { term: "say" }, " dipakai tanpa orang, atau dengan ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              vi: [{ term: "tell" }, " luôn có người nghe theo sau. ", { term: "say" }, " không có người nghe, hoặc có ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]

  - title: { en: "Reporting verbs by pattern", uk: "Дієслова мовлення за схемами", es: "Verbos introductorios según su estructura", pt: "Verbos introdutórios por padrão", fr: "Verbes introducteurs selon leur schéma", de: "Einleitende Verben nach Muster", it: "Verbi introduttivi per schema", pl: "Czasowniki wprowadzające według schematu", tr: "Kalıba göre aktarma fiilleri", id: "Kata kerja pelapor menurut pola", vi: "Động từ tường thuật theo mẫu câu" }
