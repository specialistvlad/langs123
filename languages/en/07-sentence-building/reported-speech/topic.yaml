kân kapalı."] }, id: { examples: ["Perusahaan itu dilaporkan telah kehilangan jutaan.", "Konon, dia seorang dokter.", "Rupanya tokonya tutup."] }, vi: { examples: ["Theo báo cáo, công ty đã mất hàng triệu.", "Cô ấy được cho là bác sĩ.", "Có vẻ như cửa hàng đã đóng cửa."] } } }
          - { level: C1, word: according to, use: { en: "names the source of a statement", uk: "називає джерело твердження", es: "nombra la fuente de una afirmación", pt: "indica a fonte de uma afirmação", fr: "nomme la source d’une affirmation", de: "nennt die Quelle einer Aussage", it: "indica la fonte di un'affermazione", pl: "wskazuje źródło wypowiedzi", tr: "bir sözün kaynağını belirtir", id: "menyebut sumber suatu pernyataan", vi: "nêu nguồn của một phát biểu" }, ex: [{ target: According to }, " the report, prices will rise."], tr: { uk: "За даними звіту, ціни зростуть.", es: "Según el informe, los precios subirán.", pt: "De acordo com o relatório, os preços vão subir.", fr: "Selon le rapport, les prix vont augmenter.", de: "Laut dem Bericht werden die Preise steigen.", it: "Secondo il rapporto, i prezzi aumenteranno.", pl: "Według raportu ceny wzrosną.", tr: "Rapora göre fiyatlar artacak.", id: "Menurut laporan itu, harga akan naik.", vi: "Theo báo cáo, giá sẽ tăng." } }
          - { level: C2, word: { alternatives: [aver, contend, concede] }, use: { en: "formal verbs that state, argue or grant a point", uk: "формальні дієслова на позначення твердження, доведення чи визнання", es: "verbos formales que afirman, sostienen o admiten un punto", pt: "verbos formais que afirmam, defendem ou admitem um ponto", fr: "verbes soutenus pour affirmer, soutenir ou concéder un point", de: "formelle Verben, die etwas feststellen, vertreten oder einräumen", it: "verbi formali che affermano, sostengono o concedono un punto", pl: "formalne czasowniki: twierdzić, dowodzić lub przyznawać rację", tr: "bir noktayı belirten, savunan ya da kabul eden resmî fiiller", id: "kata kerja formal untuk menyatakan, berargumen atau mengakui suatu hal", vi: "động từ trang trọng để khẳng định, lập luận hoặc thừa nhận một điểm" }, ex: { examples: [["She ", { target: averred }, " that she had never met him."], ["The defence ", { target: contended }, " that the evidence was unsafe."], ["The minister ", { target: conceded }, " that mistakes had been made."]] }, tr: { uk: { examples: ["Вона заявила, що ніколи його не зустрічала.", "Захист доводив, що докази ненадійні.", "Міністр визнав, що були допущені помилки."] }, es: { examples: ["Afirmó que nunca lo había conocido.", "La defensa sostuvo que las pruebas no eran fiables.", "El ministro admitió que se habían cometido errores."] }, pt: { examples: ["Ela afirmou que nunca o tinha conhecido.", "A defesa sustentou que as provas eram inseguras.", "O ministro admitiu que erros haviam sido cometidos."] }, fr: { examples: ["Elle a affirmé ne l’avoir jamais rencontré.", "La défense a soutenu que les preuves n’étaient pas fiables.", "Le ministre a reconnu que des erreurs avaient été commises."] }, de: { examples: ["Sie versicherte, sie habe ihn nie getroffen.", "Die Verteidigung machte geltend, die Beweise seien nicht verwertbar.", "Der Minister räumte ein, dass Fehler gemacht worden seien."] }, it: { examples: ["Ha affermato di non averlo mai incontrato.", "La difesa ha sostenuto che le prove non erano attendibili.", "Il ministro ha ammesso che erano stati commessi degli errori."] }, pl: { examples: ["Oświadczyła, że nigdy go nie spotkała.", "Obrona dowodziła, że dowody są niewiarygodne.", "Minister przyznał, że popełniono błędy."] }, tr: { examples: ["Onunla hiç tanışmadığını beyan etti.", "Savunma, delillerin güvenilmez olduğunu öne sürdü.", "Bakan, hatalar yapıldığını kabul etti."] }, id: { examples: ["Dia menyatakan bahwa dia tidak pernah bertemu dengannya.", "Pihak pembela berpendapat bahwa buktinya tidak sahih.", "Menteri itu mengakui bahwa kesalahan telah dibuat."] }, vi: { examples: ["Cô ấy quả quyết rằng chưa bao giờ gặp anh ta.", "Bên bào chữa lập luận rằng chứng cứ không đáng tin.", "Bộ trưởng thừa nhận rằng đã có sai sót."] } } }
          - { level: C2, word: enjoin, use: { en: "formal: orders or urges someone to act", uk: "формально: наказує або закликає когось діяти", es: "formal: ordena o insta a alguien a actuar", pt: "formal: ordena ou exorta alguém a agir", fr: "soutenu : ordonne à quelqu’un d’agir ou l’y exhorte", de: "formell: weist jemanden an oder drängt ihn zu handeln", it: "formale: ordina o esorta qualcuno ad agire", pl: "formalne: nakazuje lub nakłania kogoś do działania", tr: "resmî: birine bir şeyi yapmasını emreder ya da yapmasını ister", id: "formal: memerintahkan atau mendesak seseorang untuk bertindak", vi: "trang trọng: ra lệnh hoặc thúc giục ai làm gì" }, ex: ["The judge ", { target: enjoined him to }, " keep the peace."], tr: { uk: "Суддя наказав йому не порушувати громадський порядок.", es: "El juez le ordenó no alterar el orden.", pt: "O juiz o intimou a manter a ordem.", fr: "Le juge lui a enjoint de ne pas troubler l’ordre public.", de: "Der Richter forderte ihn auf, den Frieden zu wahren.", it: "Il giudice gli ha ingiunto di mantenere l'ordine pubblico.", pl: "Sędzia nakazał mu przestrzegać porządku publicznego.", tr: "Hâkim ona kamu düzenini bozmamasını emretti.", id: "Hakim memerintahkannya untuk menjaga ketertiban.", vi: "Thẩm phán yêu cầu anh ta giữ gìn trật tự." } }
          - { level: C2, word: { alternatives: [insist, demand, require, recommend, propose, stipulate] }, use: { en: "the that-clause takes the base verb: the subjunctive", uk: ["підрядне речення з ", { term: "that" }, " має дієслово в початковій формі: суб’юнктив"], es: ["la oración con ", { term: "that" }, " lleva el verbo en forma base: el subjuntivo"], pt: ["a oração com ", { term: "that" }, " leva o verbo na forma base: o subjuntivo"], fr: ["la proposition en ", { term: "that" }, " prend la base verbale : le subjonctif"], de: ["der ", { term: "that" }, "-Satz steht mit der Grundform des Verbs: der Konjunktiv"], it: ["la proposizione con ", { term: "that" }, " ha il verbo alla forma base: il congiuntivo"], pl: ["zdanie z ", { term: "that" }, " ma czasownik w formie podstawowej: tryb łączący"], tr: [{ term: "that" }, " cümlesi yalın fiil alır: dilek kipi"], id: ["klausa ", { term: "that" }, " memakai kata kerja dasar: subjungtif"], vi: ["mệnh đề ", { term: "that" }, " dùng động từ nguyên mẫu: thức giả định"] }, ex: { examples: [["She ", { target: insisted that he be }, " present."], ["The contract ", { target: stipulates that }, " payment ", { target: be }, " made in advance."]] }, tr: { uk: { examples: ["Вона наполягала, щоб він був присутній.", "Договір передбачає, що оплата має бути внесена наперед."] }, es: { examples: ["Insistió en que él estuviera presente.", "El contrato estipula que el pago se haga por adelantado."] }, pt: { examples: ["Ela insistiu que ele estivesse presente.", "O contrato estipula que o pagamento seja feito antecipadamente."] }, fr: { examples: ["Elle a insisté pour qu’il soit présent.", "Le contrat stipule que le paiement soit effectué à l’avance."] }, de: { examples: ["Sie bestand darauf, dass er anwesend sei.", "Der Vertrag sieht vor, dass die Zahlung im Voraus erfolge."] }, it: { examples: ["Ha insistito perché lui fosse presente.", "Il contratto stabilisce che il pagamento sia effettuato in anticipo."] }, pl: { examples: ["Nalegała, żeby był obecny.", "Umowa stanowi, że płatność ma być dokonana z góry."] }, tr: { examples: ["Onun orada bulunması konusunda ısrar etti.", "Sözleşme, ödemenin peşin yapılmasını şart koşuyor."] }, id: { examples: ["Dia bersikeras agar dia hadir.", "Kontrak itu mensyaratkan bahwa pembayaran dilakukan di muka."] }, vi: { examples: ["Cô ấy nhất quyết yêu cầu anh ấy phải có mặt.", "Hợp đồng quy định rằng khoản thanh toán phải được trả trước."] } } }
          - { level: C2, word: to the effect that, use: { en: "gives the gist, not the exact words", uk: "передає зміст, а не точні слова", es: "da la idea general, no las palabras exactas", pt: "dá a ideia geral, não as palavras exatas", fr: "donne l’essentiel, pas les mots exacts", de: "gibt den Kern wieder, nicht den genauen Wortlaut", it: "dà il senso generale, non le parole esatte", pl: "podaje sens, a nie dokładne słowa", tr: "tam sözleri değil, özünü verir", id: "memberi inti, bukan kata-kata yang persis", vi: "nêu ý chính chứ không phải từng lời" }, ex: ["He left a note ", { target: to the effect that }, " he would return."], tr: { uk: "Він залишив записку, що повернеться.", es: "Dejó una nota diciendo que volvería.", pt: "Ele deixou um bilhete dizendo que voltaria.", fr: "Il a laissé un mot disant qu’il reviendrait.", de: "Er hinterließ einen Zettel, auf dem stand, dass er zurückkomme.", it: "Ha lasciato un biglietto in cui diceva che sarebbe tornato.", pl: "Zostawił notatkę, że wróci.", tr: "Döneceğini belirten bir not bıraktı.", id: "Dia meninggalkan catatan yang isinya bahwa dia akan kembali.", vi: "Anh ấy để lại một mẩu giấy nói rằng anh ấy sẽ quay lại." } }
      - type: list
        items:
          - type: note
            level: C2
            text: { en: ["British English often adds ", { term: should }, ": ", { term: "insisted that he should be" }, ". See ", { link: The subjunctive, to: en.sentence-building.subjunctive }, "."], uk: ["У британській англійській часто додають ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Див. ", { link: "Суб’юнктив", to: "en.sentence-building.subjunctive" }, "."], es: ["El inglés británico suele añadir ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Ver ", { link: "El subjuntivo", to: "en.sentence-building.subjunctive" }, "."], pt: ["O inglês britânico costuma acrescentar ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Ver ", { link: "O subjuntivo", to: "en.sentence-building.subjunctive" }, "."], fr: ["L’anglais britannique ajoute souvent ", { term: "should" }, " : ", { term: "insisted that he should be" }, ". Voir ", { link: "Le subjonctif", to: "en.sentence-building.subjunctive" }, "."], de: ["Das britische Englisch ergänzt oft ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Siehe ", { link: "Der Konjunktiv", to: "en.sentence-building.subjunctive" }, "."], it: ["L'inglese britannico spesso aggiunge ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Vedi ", { link: "Il congiuntivo", to: "en.sentence-building.subjunctive" }, "."], pl: ["Brytyjski angielski często dodaje ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Zobacz ", { link: "Tryb łączący", to: "en.sentence-building.subjunctive" }, "."], tr: ["İngiliz İngilizcesi sık sık ", { term: "should" }, " ekler: ", { term: "insisted that he should be" }, ". Bkz. ", { link: "Dilek kipi", to: "en.sentence-building.subjunctive" }, "."], id: ["Bahasa Inggris Britania sering menambahkan ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Lihat ", { link: "Subjungtif", to: "en.sentence-building.subjunctive" }, "."], vi: ["Tiếng Anh Anh thường thêm ", { term: "should" }, ": ", { term: "insisted that he should be" }, ". Xem ", { link: "Thức giả định", to: "en.sentence-building.subjunctive" }, "."] }

  - title: { en: "Form: direct speech", uk: "Форма: пряма мова", es: "Forma: estilo directo", pt: "Forma: discurso direto", fr: "Forme : discours direct", de: "Form: direkte Rede", it: "Forma: discorso diretto", pl: "Forma: mowa niezależna", tr: "Biçim: doğrudan anlatım", id: "Bentuk: kalimat langsung", vi: "Dạng: câu trực tiếp" }
    role: form
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, rule: { en: "The reporting verb follows the words, after a pronoun subject.", uk: "Дієслово мовлення стоїть після слів; перед ним — підмет-займенник.", es: "El verbo introductorio sigue a las palabras, tras un sujeto pronominal.", pt: "O verbo introdutório vem depois das palavras, precedido de um pronome sujeito.", fr: "Le verbe introducteur suit les paroles, après un sujet pronominal.", de: "Das einleitende Verb folgt den Worten, nach einem Pronomen als Subjekt.", it: "Il verbo introduttivo segue le parole, dopo un pronome soggetto.", pl: "Czasownik wprowadzający stoi po cytowanych słowach, po zaimku w roli podmiotu.", tr: "Özne bir zamir olduğunda aktarma fiili sözlerden sonra gelir.", id: "Kata kerja pelapor mengikuti ucapan, setelah subjek berupa kata ganti.", vi: "Động từ tường thuật đứng sau lời nói, sau chủ ngữ là đại từ." }, ex: ["‘I’m leaving,’ ", { target: she said }, "."], tr: { uk: "«Я йду», — сказала вона.", es: "«Me voy», dijo ella.", pt: "“Estou indo embora”, disse ela.", fr: "« Je pars », dit-elle.", de: "„Ich gehe“, sagte sie.", it: "«Me ne vado», disse lei.", pl: "„Wychodzę” — powiedziała.", tr: "“Gidiyorum,” dedi.", id: "“Saya pergi,” katanya.", vi: "“Tôi đi đây,” cô ấy nói." } }
          - { level: C1, rule: { en: "A noun subject can follow the reporting verb.", uk: "Підмет-іменник може стояти після дієслова мовлення.", es: "Un sujeto nominal puede ir después del verbo introductorio.", pt: "Um sujeito nominal pode vir depois do verbo introdutório.", fr: "Un sujet nominal peut suivre le verbe introducteur.", de: "Ein Nomen als Subjekt kann dem einleitenden Verb folgen.", it: "Un nome soggetto può seguire il verbo introduttivo.", pl: "Podmiot-rzeczownik może stać po czasowniku wprowadzającym.", tr: "İsim olan özne, aktarma fiilinden sonra gelebilir.", id: "Subjek berupa kata benda boleh berada setelah kata kerja pelapor.", vi: "Chủ ngữ là danh từ có thể đứng sau động từ tường thuật." }, ex: ["‘I’m leaving,’ ", { target: said Tom }, "."], tr: { uk: "«Я йду», — сказав Том.", es: "«Me voy», dijo Tom.", pt: "“Estou indo embora”, disse Tom.", fr: "« Je pars », dit Tom.", de: "„Ich gehe“, sagte Tom.", it: "«Me ne vado», disse Tom.", pl: "„Wychodzę” — powiedział Tom.", tr: "“Gidiyorum,” dedi Tom.", id: "“Saya pergi,” kata Tom.", vi: "“Tôi đi đây,” Tom nói." } }
          - { level: C1, rule: { en: "The reporting verb can interrupt the words at a pause.", uk: "Дієслово мовлення може розривати слова в місці паузи.", es: "El verbo introductorio puede interrumpir las palabras en una pausa.", pt: "O verbo introdutório pode interromper as palavras numa pausa.", fr: "Le verbe introducteur peut couper les paroles à une pause.", de: "Das einleitende Verb kann die Worte an einer Pause unterbrechen.", it: "Il verbo introduttivo può interrompere le parole a una pausa.", pl: "Czasownik wprowadzający może przerwać cytowane słowa w miejscu pauzy.", tr: "Aktarma fiili, sözleri bir duraklamada bölebilir.", id: "Kata kerja pelapor boleh menyela ucapan pada jeda.", vi: "Động từ tường thuật có thể chen vào giữa lời nói ở chỗ ngắt." }, ex: ["‘I’m leaving,’ ", { target: she said }, ", ‘before it rains.’"], tr: { uk: "«Я йду, — сказала вона, — перш ніж почнеться дощ».", es: "«Me voy», dijo ella, «antes de que llueva».", pt: "“Estou indo embora”, disse ela, “antes que chova”.", fr: "« Je pars », dit-elle, « avant qu’il pleuve ».", de: "„Ich gehe“, sagte sie, „bevor es regnet.“", it: "«Me ne vado», disse lei, «prima che piova».", pl: "„Wychodzę — powiedziała — zanim zacznie padać.”", tr: "“Gidiyorum,” dedi, “yağmur başlamadan önce.”", id: "“Saya pergi,” katanya, “sebelum hujan.”", vi: "“Tôi đi đây,” cô ấy nói, “trước khi trời mưa.”" } }
      - type: list
        items:
          - type: note
            level: C1
            text: { en: ["The marks and commas around direct speech: see ", { link: Punctuation, to: en.foundations.punctuation }, "."], uk: ["Лапки й коми навколо прямої мови: див. ", { link: "Розділові знаки та великі літери", to: "en.foundations.punctuation" }, "."], es: ["Las comillas y las comas alrededor del estilo directo: ver ", { link: "Puntuación y mayúsculas", to: "en.foundations.punctuation" }, "."], pt: ["As aspas e as vírgulas em torno do discurso direto: ver ", { link: "Pontuação e letras maiúsculas", to: "en.foundations.punctuation" }, "."], fr: ["Les guillemets et les virgules autour du discours direct : voir ", { link: "Ponctuation et majuscules", to: "en.foundations.punctuation" }, "."], de: ["Anführungszeichen und Kommas um die direkte Rede: siehe ", { link: "Zeichensetzung und Großschreibung", to: "en.foundations.punctuation" }, "."], it: ["Le virgolette e le virgole intorno al discorso diretto: vedi ", { link: "Punteggiatura e maiuscole", to: "en.foundations.punctuation" }, "."], pl: ["Cudzysłowy i przecinki przy mowie niezależnej: zob. ", { link: "Interpunkcja i wielkie litery", to: "en.foundations.punctuation" }, "."], tr: ["Doğrudan anlatımın çevresindeki tırnak işaretleri ve virgüller: bkz. ", { link: "Noktalama ve büyük harfler", to: "en.foundations.punctuation" }, "."], id: ["Tanda kutip dan koma di sekitar kalimat langsung: lihat ", { link: "Tanda baca dan huruf kapital", to: "en.foundations.punctuation" }, "."], vi: ["Dấu ngoặc kép và dấu phẩy quanh câu trực tiếp: xem ", { link: "Dấu câu và chữ hoa", to: "en.foundations.punctuation" }, "."] }

  - title: { en: "Free indirect speech", uk: "Невласно-пряма мова", es: "Estilo indirecto libre", pt: "Discurso indireto livre", fr: "Discours indirect libre", de: "Erlebte Rede", it: "Discorso indiretto libero", pl: "Mowa pozornie zależna", tr: "Serbest dolaylı anlatım", id: "Kalimat tak langsung bebas", vi: "Câu gián tiếp tự do" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, rule: { en: "The narrator voices a character's thoughts with no reporting verb.", uk: "Оповідач передає думки персонажа без дієслова мовлення.", es: "El narrador expresa los pensamientos de un personaje sin verbo introductorio.", pt: "O narrador expressa os pensamentos de um personagem sem verbo introdutório.", fr: "Le narrateur exprime les pensées d’un personnage sans verbe introducteur.", de: "Der Erzähler gibt die Gedanken einer Figur ohne einleitendes Verb wieder.", it: "Il narratore esprime i pensieri di un personaggio senza verbo introduttivo.", pl: "Narrator oddaje myśli bohatera bez czasownika wprowadzającego.", tr: "Anlatıcı, bir karakterin düşüncelerini aktarma fiili olmadan dile getirir.", id: "Narator menyuarakan pikiran tokoh tanpa kata kerja pelapor.", vi: "Người kể chuyện nói lên suy nghĩ của nhân vật mà không có động từ tường thuật." }, ex: ["She was late. ", { target: What would he say? }], tr: { uk: "Вона запізнилася. Що він скаже?", es: "Llegaba tarde. ¿Qué diría él?", pt: "Ela estava atrasada. O que ele diria?", fr: "Elle était en retard. Que dirait-il ?", de: "Sie war spät dran. Was würde er sagen?", it: "Era in ritardo. Che cosa avrebbe detto lui?", pl: "Spóźniła się. Co on powie?", tr: "Geç kalmıştı. Ne derdi?", id: "Dia terlambat. Apa yang akan dia katakan?", vi: "Cô ấy đã đến muộn. Anh ấy sẽ nói gì đây?" } }
          - { level: C2, rule: { en: "Tense and person follow the narration; a question keeps its own word order.", uk: "Час і особа відповідають розповіді; питання зберігає власний порядок слів.", es: "El tiempo y la persona siguen la narración; la pregunta conserva su propio orden de palabras.", pt: "O tempo verbal e a pessoa seguem a narração; a pergunta mantém sua própria ordem de palavras.", fr: "Le temps et la personne suivent le récit ; la question garde son propre ordre des mots.", de: "Zeitform und Person richten sich nach der Erzählung; die Frage behält ihre eigene Wortstellung.", it: "Tempo e persona seguono la narrazione; la domanda conserva il proprio ordine delle parole.", pl: "Czas i osoba zależą od narracji; pytanie zachowuje własny szyk.", tr: "Zaman ve kişi anlatıya uyar; soru kendi sözcük sırasını korur.", id: "Tense dan persona mengikuti narasi; pertanyaan mempertahankan urutan katanya sendiri.", vi: "Thì và ngôi theo lời kể; câu hỏi giữ trật tự từ của riêng nó." }, ex: ["She looked at the clock. ", { target: Why did she always forget? }], tr: { uk: "Вона подивилася на годинник. Чому вона завжди все забувала?", es: "Miró el reloj. ¿Por qué siempre se olvidaba?", pt: "Ela olhou para o relógio. Por que ela sempre esquecia?", fr: "Elle regarda l’horloge. Pourquoi oubliait-elle toujours ?", de: "Sie sah auf die Uhr. Warum vergaß sie immer alles?", it: "Guardò l'orologio. Perché dimenticava sempre?", pl: "Spojrzała na zegar. Dlaczego zawsze zapominała?", tr: "Saate baktı. Neden hep unutuyordu?", id: "Dia melihat jam. Mengapa dia selalu lupa?", vi: "Cô ấy nhìn đồng hồ. Sao lúc nào cô ấy cũng quên?" } }
          - { level: C2, rule: { en: ["Time and place words stay as the character would think them: ", { term: now }, ", ", { term: tomorrow }, ", ", { term: here }, "."], uk: ["Слова на позначення часу й місця залишаються такими, якими їх подумав би персонаж: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], es: ["Las expresiones de tiempo y lugar quedan como las pensaría el personaje: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], pt: ["As expressões de tempo e lugar ficam como o personagem as pensaria: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], fr: ["Les expressions de temps et de lieu restent telles que le personnage les penserait : ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], de: ["Zeit- und Ortsangaben bleiben so, wie die Figur sie denken würde: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], it: ["Le espressioni di tempo e di luogo restano come le penserebbe il personaggio: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], pl: ["Określenia czasu i miejsca zostają takie, jak pomyślałby je bohater: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], tr: ["Zaman ve yer sözcükleri, karakterin düşüneceği gibi kalır: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], id: ["Kata keterangan waktu dan tempat tetap seperti yang dipikirkan tokoh: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."], vi: ["Từ chỉ thời gian và nơi chốn giữ nguyên như nhân vật sẽ nghĩ: ", { term: "now" }, ", ", { term: "tomorrow" }, ", ", { term: "here" }, "."] }, ex: ["She looked at the calendar. ", { target: Tomorrow }, " was Monday."], tr: { uk: "Вона глянула на календар. Завтра був понеділок.", es: "Miró el calendario. Mañana era lunes.", pt: "Ela olhou para o calendário. Amanhã era segunda-feira.", fr: "Elle regarda le calendrier. Demain était lundi.", de: "Sie sah auf den Kalender. Morgen war Montag.", it: "Guardò il calendario. Domani era lunedì.", pl: "Spojrzała na kalendarz. Jutro był poniedziałek.", tr: "Takvime baktı. Yarın pazartesiydi.", id: "Dia melihat kalender. Besok adalah hari Senin.", vi: "Cô ấy nhìn lịch. Ngày mai là thứ Hai." } }
          - { level: C2, rule: { en: "Exclamations and fragments show the character's feeling.", uk: "Окличні речення й уривки передають почуття персонажа.", es: "Las exclamaciones y los fragmentos muestran el sentimiento del personaje.", pt: "As exclamações e os fragmentos mostram o sentimento do personagem.", fr: "Les exclamations et les fragments montrent le sentiment du personnage.", de: "Ausrufe und Satzfragmente zeigen die Gefühle der Figur.", it: "Le esclamazioni e i frammenti mostrano il sentimento del personaggio.", pl: "Wykrzyknienia i urywki pokazują uczucia bohatera.", tr: "Ünlemler ve cümle parçaları karakterin duygusunu gösterir.", id: "Seruan dan potongan kalimat menunjukkan perasaan tokoh.", vi: "Câu cảm thán và câu rời thể hiện cảm xúc của nhân vật." }, ex: ["Oh, ", { target: how foolish she had been! }], tr: { uk: "Ох, яка ж вона була нерозумна!", es: "¡Ay, qué tonta había sido!", pt: "Ah, como ela tinha sido boba!", fr: "Oh, qu’elle avait été sotte !", de: "Ach, wie dumm sie gewesen war!", it: "Oh, com'era stata sciocca!", pl: "Ach, jaka była głupia!", tr: "Ah, ne kadar aptalca davranmıştı!", id: "Ah, betapa bodohnya dia selama ini!", vi: "Ôi, cô ấy đã dại dột biết bao!" } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Fiction uses free indirect speech to show a character's mind; reports keep a reporting verb.", uk: "У художній прозі невласно-пряму мову вживають, щоб показати думки персонажа; у повідомленнях дієслово мовлення зберігається.", es: "La ficción usa el estilo indirecto libre para mostrar la mente de un personaje; los informes conservan un verbo introductorio.", pt: "A ficção usa o discurso indireto livre para mostrar a mente de um personagem; os relatos mantêm um verbo introdutório.", fr: "La fiction emploie le discours indirect libre pour montrer l’esprit d’un personnage ; un compte rendu garde son verbe introducteur.", de: "Erzählprosa nutzt die erlebte Rede, um das Innenleben einer Figur zu zeigen; Berichte behalten ein einleitendes Verb.", it: "La narrativa usa il discorso indiretto libero per mostrare la mente di un personaggio; i resoconti mantengono un verbo introduttivo.", pl: "Proza używa mowy pozornie zależnej, by pokazać wnętrze bohatera; w relacjach czasownik wprowadzający zostaje.", tr: "Kurmaca, bir karakterin zihnini göstermek için serbest dolaylı anlatımı kullanır; aktarmalarda aktarma fiili korunur.", id: "Fiksi memakai kalimat tak langsung bebas untuk menunjukkan pikiran tokoh; laporan tetap memakai kata kerja pelapor.", vi: "Văn xuôi hư cấu dùng câu gián tiếp tự do để cho thấy tâm trí nhân vật; lời tường thuật giữ động từ tường thuật." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: She said me that she was tired., right: { alternatives: [["She ", { target: told }, " me that she was tired."], ["She ", { target: said }, " that she was tired."]] }, rule: { en: [{ term: say }, " has no person; ", { term: tell }, " needs one"], uk: [{ term: say }, " без особи; ", { term: tell }, " потребує особи"], es: [{ term: say }, " no lleva persona; ", { term: tell }, " la necesita"], pt: [{ term: "say" }, " não tem pessoa; ", { term: "tell" }, " precisa de uma"], fr: [{ term: "say" }, " s’emploie sans personne ; ", { term: "tell" }, " en demande une"], de: [{ term: "say" }, " hat keine Person; ", { term: "tell" }, " braucht eine"], it: [{ term: "say" }, " non ha una persona; ", { term: "tell" }, " ne richiede una"], pl: [{ term: "say" }, " bez osoby; ", { term: "tell" }, " wymaga osoby"], tr: [{ term: "say" }, " fiilinde kişi yoktur; ", { term: "tell" }, " kişi ister"], id: [{ term: "say" }, " tanpa orang; ", { term: "tell" }, " memerlukan orang"], vi: [{ term: "say" }, " không có người nghe; ", { term: "tell" }, " cần có người nghe"] } }
          - { level: B1, wrong: He told that he was late., right: ["He ", { target: said }, " that he was late."], rule: { en: [{ term: tell }, " needs a person"], uk: [{ term: tell }, " потребує особи"], es: [{ term: tell }, " necesita una persona"], pt: [{ term: "tell" }, " precisa de uma pessoa"], fr: [{ term: "tell" }, " demande une personne"], de: [{ term: "tell" }, " braucht eine Person"], it: [{ term: "tell" }, " richiede una persona"], pl: [{ term: "tell" }, " wymaga osoby"], tr: [{ term: "tell" }, " kişi ister"], id: [{ term: "tell" }, " memerlukan orang"], vi: [{ term: "tell" }, " cần có người nghe"] } }
          - { level: B1, wrong: She asked me where did I live., right: ["She asked me where I ", { target: lived }, "."], rule: { en: reported questions use statement order, uk: "непрямі питання мають порядок слів розповідного речення", es: "las preguntas indirectas usan el orden de una afirmación", pt: "as perguntas indiretas usam a ordem de uma afirmação", fr: "les questions indirectes suivent l’ordre d’une phrase affirmative", de: "indirekte Fragen haben die Wortstellung eines Aussagesatzes", it: "le domande indirette hanno l'ordine della frase affermativa", pl: "pytania w mowie zależnej mają szyk zdania oznajmującego", tr: "dolaylı sorular düz cümle sırasını alır", id: "pertanyaan tak langsung memakai urutan kalimat pernyataan", vi: "câu hỏi gián tiếp có trật tự như câu trần thuật" } }
          - { level: B1, wrong: He asked me do I like tea., right: ["He asked me ", { target: if }, " I liked tea."], rule: { en: { takes: [[{ alternatives: ["yes", "no"] }, " questions"], { alternatives: [{ term: if }, { term: whether }] }] }, uk: { takes: [["питання ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: if }, { term: whether }] }] }, es: { takes: [["preguntas ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: if }, { term: whether }] }] }, pt: { takes: [["perguntas ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, fr: { takes: [["questions ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, de: { takes: [[{ alternatives: ["yes", "no"] }, "-Fragen"], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, it: { takes: [["domande ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, pl: { takes: [["pytania ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, tr: { takes: [[{ alternatives: ["yes", "no"] }, " soruları"], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, id: { takes: [["pertanyaan ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] }, vi: { takes: [["câu hỏi ", { alternatives: ["yes", "no"] }], { alternatives: [{ term: "if" }, { term: "whether" }] }] } } }
          - { level: B1, wrong: He said me to sit down., right: ["He ", { target: told }, " me ", { target: to sit }, " down."], rule: { en: { pattern: [{ term: told }, { slot: person }, { term: to }, { slot: V }] }, uk: { pattern: [{ term: told }, { slot: person }, { term: to }, { slot: V }] }, es: { pattern: [{ term: told }, { slot: person }, { term: to }, { slot: V }] }, pt: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, fr: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, de: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, it: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, pl: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, tr: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, id: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] }, vi: { pattern: [{ term: "told" }, { slot: "person" }, { term: "to" }, { slot: "V" }] } } }
          - { level: B1, wrong: He said he will come., right: ["He said he ", { target: would }, " come."], rule: { en: { takes: [{ term: will }, [{ term: would }, " after a past verb"]] }, uk: { takes: [{ term: will }, [{ term: would }, " після дієслова в минулому часі"]] }, es: { takes: [{ term: will }, [{ term: would }, " después de un verbo en pasado"]] }, pt: { takes: [{ term: "will" }, [{ term: "would" }, " depois de um verbo no passado"]] }, fr: { takes: [{ term: "will" }, [{ term: "would" }, " après un verbe au passé"]] }, de: { takes: [{ term: "will" }, [{ term: "would" }, " nach einem Verb in der Vergangenheit"]] }, it: { takes: [{ term: "will" }, [{ term: "would" }, " dopo un verbo al passato"]] }, pl: { takes: [{ term: "will" }, [{ term: "would" }, " po czasowniku w czasie przeszłym"]] }, tr: { takes: [{ term: "will" }, [{ term: "would" }, " geçmiş zamanlı fiilden sonra"]] }, id: { takes: [{ term: "will" }, [{ term: "would" }, " setelah kata kerja past"]] }, vi: { takes: [{ term: "will" }, [{ term: "would" }, " sau động từ ở quá khứ"]] } } }
          - { level: B2, wrong: She suggested me to go., right: { alternatives: [["She ", { target: suggested that I go }, "."], ["She ", { target: suggested going }, "."]] }, rule: { en: [{ term: suggest }, " takes -ing or a ", { term: that }, " clause"], uk: [{ term: "suggest" }, " вимагає ", { term: "-ing" }, " або підрядного речення з ", { term: "that" }], es: [{ term: "suggest" }, " va seguido de ", { term: "-ing" }, " o de una oración con ", { term: "that" }], pt: [{ term: "suggest" }, " leva ", { term: "-ing" }, " ou uma oração com ", { term: "that" }], fr: [{ term: "suggest" }, " se construit avec ", { term: "-ing" }, " ou une proposition en ", { term: "that" }], de: [{ term: "suggest" }, " steht mit ", { term: "-ing" }, " oder einem ", { term: "that" }, "-Satz"], it: [{ term: "suggest" }, " vuole ", { term: "-ing" }, " o una proposizione con ", { term: "that" }], pl: [{ term: "suggest" }, " łączy się z ", { term: "-ing" }, " lub zdaniem z ", { term: "that" }], tr: [{ term: "suggest" }, " fiili ", { term: "-ing" }, " ya da ", { term: "that" }, " cümlesi alır"], id: [{ term: "suggest" }, " memakai ", { term: "-ing" }, " atau klausa ", { term: "that" }], vi: [{ term: "suggest" }, " đi với ", { term: "-ing" }, " hoặc mệnh đề ", { term: "that" }] } }
          - { level: B2, wrong: He denied to take the money., right: ["He denied ", { target: taking }, " the money."], rule: { en: [{ term: deny }, " takes -ing"], uk: ["після ", { term: "deny" }, " стоїть ", { term: "-ing" }], es: [{ term: "deny" }, " va seguido de ", { term: "-ing" }], pt: [{ term: "deny" }, " é seguido de ", { term: "-ing" }], fr: [{ term: "deny" }, " est suivi de ", { term: "-ing" }], de: ["Auf ", { term: "deny" }, " folgt ", { term: "-ing" }], it: [{ term: "deny" }, " è seguito da ", { term: "-ing" }], pl: ["po ", { term: "deny" }, " występuje ", { term: "-ing" }], tr: [{ term: "deny" }, " fiilinden sonra ", { term: "-ing" }, " gelir"], id: [{ term: "deny" }, " diikuti ", { term: "-ing" }], vi: [{ term: "deny" }, " đi với ", { term: "-ing" }] } }
          - { level: B2, wrong: She explained me that the shop was closed., right: ["She explained ", { target: to me }, " that the shop was closed."], rule: { en: [{ term: explain }, " takes ", { pattern: [{ term: to }, { slot: person }] }], uk: [{ term: "explain" }, " вимагає ", { pattern: [{ term: "to" }, { slot: "person" }] }], es: [{ term: "explain" }, " lleva ", { pattern: [{ term: "to" }, { slot: "person" }] }], pt: [{ term: "explain" }, " leva ", { pattern: [{ term: "to" }, { slot: "person" }] }], fr: [{ term: "explain" }, " se construit avec ", { pattern: [{ term: "to" }, { slot: "person" }] }], de: [{ term: "explain" }, " verlangt ", { pattern: [{ term: "to" }, { slot: "person" }] }], it: [{ term: "explain" }, " vuole ", { pattern: [{ term: "to" }, { slot: "person" }] }], pl: [{ term: "explain" }, " łączy się z ", { pattern: [{ term: "to" }, { slot: "person" }] }], tr: [{ term: "explain" }, " fiili ", { pattern: [{ term: "to" }, { slot: "person" }] }, " alır"], id: [{ term: "explain" }, " memakai ", { pattern: [{ term: "to" }, { slot: "person" }] }], vi: [{ term: "explain" }, " đi với ", { pattern: [{ term: "to" }, { slot: "person" }] }] } }
          - { level: B2, wrong: He asked me if to wait., right: ["He asked me ", { target: whether }, " to wait."], rule: { en: [{ term: whether }, " goes before a ", { term: to }, "-infinitive"], uk: [{ term: "whether" }, " ставиться перед ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], es: [{ term: "whether" }, " va antes de ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], pt: [{ term: "whether" }, " vem antes de ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], fr: [{ term: "whether" }, " se place devant ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], de: [{ term: "whether" }, " steht vor ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], it: [{ term: "whether" }, " sta prima di ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], pl: [{ term: "whether" }, " stoi przed ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], tr: [{ term: "whether" }, " sözcüğü ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }, " yapısından önce gelir"], id: [{ term: "whether" }, " berada sebelum ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }], vi: [{ term: "whether" }, " đứng trước ", { pattern: [{ term: "to" }, { slot: "infinitive" }] }] } }
          - { level: B1, speakers: [uk], wrong: "She said, that she was tired.", right: ["She said ", { target: that }, " she was tired."], rule: { uk: ["перед ", { term: that }, " коми немає; в українській перед «що» кома обов’язкова"] } }
          - { level: B1, speakers: [es], wrong: She asked me that I help her., right: ["She asked me ", { target: to help }, " her."], rule: { es: ["una petición indirecta usa ", { pattern: [{ term: asked }, { slot: person }, { term: to }, { slot: V }] }, ", no ", { term: that }, "; en español se dice «me pidió que ayudara»"] } }
