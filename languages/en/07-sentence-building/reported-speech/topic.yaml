          - { level: B1, direct: { en: past simple, uk: "Past Simple", es: "pasado simple", pt: "passado simples", fr: "prétérit simple", de: "Simple Past", it: "past simple", pl: "Past Simple", tr: "Simple Past", id: "simple past", vi: "quá khứ đơn" }, reported: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, ex: { mapping: [["“I ", { target: left }, ".”"], ["He said he ", { target: had left }, "."]] }, tr: { uk: "«Я пішов». Він сказав, що пішов.", es: "«Me fui». Dijo que se había ido.", pt: "“Eu saí.” Ele disse que tinha saído.", fr: "« Je suis parti. » Il a dit qu’il était parti.", de: "„Ich bin gegangen.“ Er sagte, er sei gegangen.", it: "«Sono partito». Ha detto che era partito.", pl: "„Wyszedłem.” Powiedział, że wyszedł.", tr: "“Gittim.” Gittiğini söyledi.", id: "“Saya pergi.” Dia berkata bahwa dia sudah pergi.", vi: "“Tôi đã đi.” Anh ấy nói anh ấy đã đi rồi." } }
          - { level: B1, direct: { en: present perfect, uk: "Present Perfect", es: "presente perfecto", pt: "presente perfeito", fr: "present perfect", de: "Present Perfect", it: "present perfect", pl: "Present Perfect", tr: "Present Perfect", id: "present perfect", vi: "hiện tại hoàn thành" }, reported: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, ex: { mapping: [[“I, { target: "'ve finished" }, ".”"], ["She said she ", { target: had finished }, "."]] }, tr: { uk: "«Я закінчила». Вона сказала, що закінчила.", es: "«He terminado». Dijo que había terminado.", pt: "“Já terminei.” Ela disse que tinha terminado.", fr: "« J’ai fini. » Elle a dit qu’elle avait fini.", de: "„Ich bin fertig.“ Sie sagte, sie sei fertig.", it: "«Ho finito». Ha detto che aveva finito.", pl: "„Skończyłam.” Powiedziała, że skończyła.", tr: "“Bitirdim.” Bitirdiğini söyledi.", id: "“Saya sudah selesai.” Dia berkata bahwa dia sudah selesai.", vi: "“Tôi đã làm xong.” Cô ấy nói cô ấy đã làm xong." } }
          - { level: B1, direct: will, reported: would, ex: { mapping: [[“I, { target: "'ll call" }, ".”"], ["He said he ", { target: would call }, "."]] }, tr: { uk: "«Я зателефоную». Він сказав, що зателефонує.", es: "«Llamaré». Dijo que llamaría.", pt: "“Vou ligar.” Ele disse que ligaria.", fr: "« J’appellerai. » Il a dit qu’il appellerait.", de: "„Ich rufe an.“ Er sagte, er werde anrufen.", it: "«Chiamerò». Ha detto che avrebbe chiamato.", pl: "„Zadzwonię.” Powiedział, że zadzwoni.", tr: "“Arayacağım.” Arayacağını söyledi.", id: "“Saya akan menelepon.” Dia berkata bahwa dia akan menelepon.", vi: "“Tôi sẽ gọi.” Anh ấy nói anh ấy sẽ gọi." } }
          - { level: B1, direct: must, reported: had to, ex: { mapping: [["“I ", { target: must }, " go.”"], ["She said she ", { target: had to }, " go."]] }, tr: { uk: "«Мені треба йти». Вона сказала, що їй треба йти.", es: "«Debo irme». Dijo que tenía que irse.", pt: "“Preciso ir.” Ela disse que precisava ir.", fr: "« Je dois partir. » Elle a dit qu’elle devait partir.", de: "„Ich muss gehen.“ Sie sagte, sie müsse gehen.", it: "«Devo andare». Ha detto che doveva andare.", pl: "„Muszę iść.” Powiedziała, że musi iść.", tr: "“Gitmem gerekiyor.” Gitmesi gerektiğini söyledi.", id: "“Saya harus pergi.” Dia berkata bahwa dia harus pergi.", vi: "“Tôi phải đi.” Cô ấy nói cô ấy phải đi." } }
          - { level: B1, direct: can, reported: could, ex: { mapping: [["“I ", { target: can }, " swim.”"], ["She said she ", { target: could }, " swim."]] }, tr: { uk: "«Я вмію плавати». Вона сказала, що вміє плавати.", es: "«Sé nadar». Dijo que sabía nadar.", pt: "“Sei nadar.” Ela disse que sabia nadar.", fr: "« Je sais nager. » Elle a dit qu’elle savait nager.", de: "„Ich kann schwimmen.“ Sie sagte, sie könne schwimmen.", it: "«So nuotare». Ha detto che sapeva nuotare.", pl: "„Umiem pływać.” Powiedziała, że umie pływać.", tr: "“Yüzebilirim.” Yüzebildiğini söyledi.", id: "“Saya bisa berenang.” Dia berkata bahwa dia bisa berenang.", vi: "“Tôi biết bơi.” Cô ấy nói cô ấy biết bơi." } }
          - { level: B2, direct: may, reported: might, ex: { mapping: [["“I ", { target: may }, " join you.”"], ["She said she ", { target: might }, " join us."]] }, tr: { uk: "«Я, можливо, приєднаюся до вас». Вона сказала, що, можливо, приєднається до нас.", es: "«Quizá me una a ustedes». Dijo que quizá se uniría a nosotros.", pt: "“Talvez eu me junte a vocês.” Ela disse que talvez se juntasse a nós.", fr: "« Je me joindrai peut-être à vous. » Elle a dit qu’elle se joindrait peut-être à nous.", de: "„Vielleicht schließe ich mich euch an.“ Sie sagte, sie schließe sich uns vielleicht an.", it: "«Forse mi unirò a voi». Ha detto che forse si sarebbe unita a noi.", pl: "„Może do was dołączę.” Powiedziała, że może do nas dołączy.", tr: "“Size katılabilirim.” Bize katılabileceğini söyledi.", id: "“Mungkin saya akan bergabung dengan kalian.” Dia berkata bahwa mungkin dia akan bergabung dengan kami.", vi: "“Có thể tôi sẽ đi cùng các bạn.” Cô ấy nói có thể cô ấy sẽ đi cùng chúng tôi." } }
          - { level: B2, direct: shall, reported: should, ex: { mapping: [["“", { target: Shall }, " I open the window?”"], ["He asked if he ", { target: should }, " open the window."]] }, tr: { uk: "«Мені відчинити вікно?» Він запитав, чи йому відчинити вікно.", es: "«¿Abro la ventana?» Preguntó si debía abrir la ventana.", pt: "“Devo abrir a janela?” Ele perguntou se devia abrir a janela.", fr: "« Dois-je ouvrir la fenêtre ? » Il a demandé s’il devait ouvrir la fenêtre.", de: "„Soll ich das Fenster öffnen?“ Er fragte, ob er das Fenster öffnen solle.", it: "«Devo aprire la finestra?» Ha chiesto se doveva aprire la finestra.", pl: "„Czy mam otworzyć okno?” Zapytał, czy ma otworzyć okno.", tr: "“Pencereyi açayım mı?” Pencereyi açıp açmaması gerektiğini sordu.", id: "“Perlukah saya membuka jendela?” Dia bertanya apakah dia harus membuka jendela.", vi: "“Tôi mở cửa sổ nhé?” Anh ấy hỏi anh ấy có nên mở cửa sổ không." } }
          - { level: B2, direct: { en: [{ term: must }, " (certainty)"], uk: [{ term: "must" }, " (упевненість)"], es: [{ term: "must" }, " (certeza)"], pt: [{ term: "must" }, " (certeza)"], fr: [{ term: "must" }, " (certitude)"], de: [{ term: "must" }, " (Gewissheit)"], it: [{ term: "must" }, " (certezza)"], pl: [{ term: "must" }, " (pewność)"], tr: [{ term: "must" }, " (kesinlik)"], id: [{ term: "must" }, " (kepastian)"], vi: [{ term: "must" }, " (sự chắc chắn)"] }, reported: must, ex: { mapping: [["“He ", { target: must }, " be ill.”"], ["She said he ", { target: must }, " be ill."]] }, tr: { uk: "«Він, напевно, хворий». Вона сказала, що він, напевно, хворий.", es: "«Debe de estar enfermo». Dijo que debía de estar enfermo.", pt: "“Ele deve estar doente.” Ela disse que ele devia estar doente.", fr: "« Il doit être malade. » Elle a dit qu’il devait être malade.", de: "„Er muss krank sein.“ Sie sagte, er müsse krank sein.", it: "«Deve essere malato». Ha detto che doveva essere malato.", pl: "„On musi być chory.” Powiedziała, że on musi być chory.", tr: "“Kesin hastadır.” Kesin hasta olduğunu söyledi.", id: "“Dia pasti sakit.” Dia berkata bahwa dia pasti sakit.", vi: "“Chắc anh ấy ốm rồi.” Cô ấy nói chắc anh ấy ốm rồi." } }
          - { level: B2, direct: ought to, reported: ought to, ex: { mapping: [["“You ", { target: ought to }, " rest.”"], ["She told me I ", { target: ought to }, " rest."]] }, tr: { uk: "«Тобі слід відпочити». Вона сказала мені, що мені слід відпочити.", es: "«Deberías descansar». Me dijo que debería descansar.", pt: "“Você deveria descansar.” Ela me disse que eu deveria descansar.", fr: "« Tu devrais te reposer. » Elle m’a dit que je devrais me reposer.", de: "„Du solltest dich ausruhen.“ Sie sagte mir, ich solle mich ausruhen.", it: "«Dovresti riposarti». Mi ha detto che dovrei riposarmi.", pl: "„Powinieneś odpocząć.” Powiedziała mi, że powinienem odpocząć.", tr: "“Dinlenmelisin.” Dinlenmem gerektiğini söyledi.", id: "“Kamu sebaiknya beristirahat.” Dia bilang saya sebaiknya beristirahat.", vi: "“Bạn nên nghỉ ngơi.” Cô ấy bảo tôi nên nghỉ ngơi." } }
          - { level: B2, direct: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, reported: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, ex: { mapping: [["“I ", { target: had finished }, " early.”"], ["He said he ", { target: had finished }, " early."]] }, tr: { uk: "«Я закінчив раніше». Він сказав, що закінчив раніше.", es: "«Había terminado temprano». Dijo que había terminado temprano.", pt: "“Eu tinha terminado cedo.” Ele disse que tinha terminado cedo.", fr: "« J’avais fini tôt. » Il a dit qu’il avait fini tôt.", de: "„Ich war früh fertig gewesen.“ Er sagte, er sei früh fertig gewesen.", it: "«Avevo finito presto». Ha detto che aveva finito presto.", pl: "„Skończyłem wcześniej.” Powiedział, że skończył wcześniej.", tr: "“Erken bitirmiştim.” Erken bitirmiş olduğunu söyledi.", id: "“Saya sudah selesai lebih awal.” Dia berkata bahwa dia sudah selesai lebih awal.", vi: "“Tôi đã làm xong sớm.” Anh ấy nói anh ấy đã làm xong sớm." } }
