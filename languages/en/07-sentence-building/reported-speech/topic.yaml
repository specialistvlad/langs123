        rows:
          - { level: C1, rule: { en: "The tense stays when the report follows at once.", uk: "Час не змінюється, якщо повідомлення йде одразу за сказаним.", es: "El tiempo no cambia cuando se informa de inmediato.", pt: "O tempo verbal não muda quando o relato vem logo em seguida.", fr: "Le temps ne change pas quand le propos est rapporté tout de suite.", de: "Die Zeitform bleibt, wenn der Bericht sofort folgt.", it: "Il tempo non cambia quando si riporta subito.", pl: "Czas się nie zmienia, gdy relacja następuje od razu.", tr: "Aktarma hemen ardından yapılırsa zaman değişmez.", id: "Tense tidak berubah jika laporan disampaikan segera.", vi: "Thì giữ nguyên khi câu được tường thuật ngay sau đó." }, ex: ["Tom has just rung. He said he ", { target: is }, " on his way."], tr: { uk: "Том щойно зателефонував. Він сказав, що вже в дорозі.", es: "Tom acaba de llamar. Dijo que está en camino.", pt: "Tom acabou de ligar. Ele disse que está a caminho.", fr: "Tom vient d’appeler. Il a dit qu’il est en route.", de: "Tom hat gerade angerufen. Er sagte, er sei unterwegs.", it: "Tom ha appena telefonato. Ha detto che è per strada.", pl: "Tom właśnie zadzwonił. Powiedział, że jest w drodze.", tr: "Tom az önce aradı. Yolda olduğunu söyledi.", id: "Tom baru saja menelepon. Dia bilang dia sedang dalam perjalanan.", vi: "Tom vừa gọi điện. Anh ấy nói anh ấy đang trên đường." } }
          - { level: C1, rule: { en: "The past simple can stay when the sentence gives the time.", uk: "Past Simple може залишатися, якщо речення називає час.", es: "El pasado simple puede mantenerse cuando la oración indica el momento.", pt: "O passado simples pode ficar quando a frase indica o momento.", fr: "Le prétérit simple peut rester quand la phrase donne le moment.", de: "Das Simple Past kann bleiben, wenn der Satz die Zeit angibt.", it: "Il past simple può restare quando la frase indica il momento.", pl: "Past Simple może zostać, gdy zdanie podaje czas.", tr: "Cümle zamanı belirtiyorsa Simple Past kalabilir.", id: "Simple past boleh tetap dipakai jika kalimat menyebut waktunya.", vi: "Quá khứ đơn có thể giữ nguyên khi câu nêu rõ thời điểm." }, ex: { equivalence: [["She said she ", { target: left }, " at six."], ["She said she ", { target: had left }, " at six."]] }, tr: { uk: "Вона сказала, що пішла о шостій.", es: { equivalence: ["Dijo que se fue a las seis.", "Dijo que se había ido a las seis."] }, pt: { equivalence: ["Ela disse que saiu às seis.", "Ela disse que tinha saído às seis."] }, fr: { equivalence: ["Elle a dit qu’elle est partie à six heures.", "Elle a dit qu’elle était partie à six heures."] }, de: "Sie sagte, sie sei um sechs gegangen.", it: { equivalence: ["Ha detto che è uscita alle sei.", "Ha detto che era uscita alle sei."] }, pl: "Powiedziała, że wyszła o szóstej.", tr: "Altıda çıktığını söyledi.", id: "Dia berkata bahwa dia pergi pukul enam.", vi: "Cô ấy nói cô ấy đã đi lúc sáu giờ." } }
          - { level: C1, rule: { en: "Unreal conditionals stay unchanged.", uk: "Умовні речення нереальної умови не змінюються.", es: "Los condicionales irreales no cambian.", pt: "Os condicionais irreais não mudam.", fr: "Les phrases conditionnelles irréelles ne changent pas.", de: "Irreale Bedingungssätze bleiben unverändert.", it: "I periodi ipotetici irreali restano invariati.", pl: "Zdania warunkowe nierzeczywiste nie zmieniają się.", tr: "Gerçek dışı koşul cümleleri değişmez.", id: "Kalimat conditional yang tidak nyata tetap sama.", vi: "Câu điều kiện không có thật giữ nguyên." }, ex: { mapping: [["“If I ", { target: were }, " rich, I ", { target: would }, " retire.”"], ["He said that if he ", { target: were }, " rich, he ", { target: would }, " retire."]] }, tr: { uk: "«Якби я був багатим, я пішов би на пенсію». Він сказав, що якби був багатим, то пішов би на пенсію.", es: "«Si fuera rico, me jubilaría». Dijo que si fuera rico, se jubilaría.", pt: "“Se eu fosse rico, eu me aposentaria.” Ele disse que, se fosse rico, se aposentaria.", fr: "« Si j’étais riche, je prendrais ma retraite. » Il a dit que, s’il était riche, il prendrait sa retraite.", de: "„Wäre ich reich, würde ich in Rente gehen.“ Er sagte, wenn er reich wäre, würde er in Rente gehen.", it: "«Se fossi ricco, andrei in pensione». Ha detto che, se fosse stato ricco, sarebbe andato in pensione.", pl: "„Gdybym był bogaty, przeszedłbym na emeryturę.” Powiedział, że gdyby był bogaty, przeszedłby na emeryturę.", tr: "“Zengin olsaydım emekli olurdum.” Zengin olsa emekli olacağını söyledi.", id: "“Kalau saya kaya, saya akan pensiun.” Dia berkata bahwa kalau dia kaya, dia akan pensiun.", vi: "“Nếu tôi giàu, tôi sẽ nghỉ hưu.” Anh ấy nói nếu anh ấy giàu thì anh ấy sẽ nghỉ hưu." } }
          - { level: C1, rule: { en: "Thoughts and perceptions are reported like speech, with the same backshift.", uk: "Думки й сприйняття передають так само, як мовлення, з тим самим зсувом часів.", es: "Los pensamientos y las percepciones se refieren como el habla, con el mismo cambio de tiempos.", pt: "Pensamentos e percepções são relatados como a fala, com a mesma mudança dos tempos verbais.", fr: "Les pensées et les perceptions se rapportent comme les paroles, avec la même concordance des temps.", de: "Gedanken und Wahrnehmungen werden wie Gesagtes wiedergegeben, mit derselben Zeitverschiebung.", it: "Pensieri e percezioni si riportano come le parole, con la stessa concordanza dei tempi.", pl: "Myśli i spostrzeżenia przekazuje się jak wypowiedzi, z takim samym cofnięciem czasu.", tr: "Düşünceler ve algılar da konuşma gibi, aynı zaman kaymasıyla aktarılır.", id: "Pikiran dan persepsi dilaporkan seperti ucapan, dengan pergeseran tense yang sama.", vi: "Suy nghĩ và nhận thức được tường thuật như lời nói, với cùng cách lùi thì." }, ex: { examples: [["He ", { target: thought that }, " the shop was open."], ["She ", { target: realised that }, " she had lost her keys."], ["I ", { target: wondered whether }, " you were free."]] }, tr: { uk: { examples: ["Він думав, що магазин відчинений.", "Вона зрозуміла, що загубила ключі.", "Мені було цікаво, чи ти вільний."] }, es: { examples: ["Pensó que la tienda estaba abierta.", "Se dio cuenta de que había perdido las llaves.", "Me preguntaba si estabas libre."] }, pt: { examples: ["Ele achou que a loja estava aberta.", "Ela percebeu que tinha perdido as chaves.", "Eu me perguntei se você estava livre."] }, fr: { examples: ["Il pensait que le magasin était ouvert.", "Elle s’est rendu compte qu’elle avait perdu ses clés.", "Je me demandais si tu étais libre."] }, de: { examples: ["Er dachte, der Laden sei geöffnet.", "Sie merkte, dass sie ihre Schlüssel verloren hatte.", "Ich fragte mich, ob du Zeit hättest."] }, it: { examples: ["Pensava che il negozio fosse aperto.", "Ha capito di aver perso le chiavi.", "Mi chiedevo se fossi libero."] }, pl: { examples: ["Myślał, że sklep jest otwarty.", "Zdała sobie sprawę, że zgubiła klucze.", "Zastanawiałem się, czy jesteś wolny."] }, tr: { examples: ["Dükkânın açık olduğunu düşündü.", "Anahtarlarını kaybettiğini fark etti.", "Müsait olup olmadığını merak ettim."] }, id: { examples: ["Dia mengira bahwa tokonya buka.", "Dia sadar bahwa dia telah kehilangan kuncinya.", "Saya bertanya-tanya apakah kamu sedang senggang."] }, vi: { examples: ["Anh ấy nghĩ là cửa hàng đang mở.", "Cô ấy nhận ra là mình đã làm mất chìa khóa.", "Tôi tự hỏi bạn có rảnh không."] } } }
          - { level: C1, rule: { en: ["One reporting verb can open several clauses; ", { term: and that }, " links them."], uk: ["Одне дієслово мовлення може вводити кілька підрядних речень; їх поєднує ", { term: "and that" }, "."], es: ["Un verbo introductorio puede abrir varias oraciones; ", { term: "and that" }, " las une."], pt: ["Um verbo introdutório pode abrir várias orações; ", { term: "and that" }, " as liga."], fr: ["Un verbe introducteur peut ouvrir plusieurs propositions ; ", { term: "and that" }, " les relie."], de: ["Ein einleitendes Verb kann mehrere Nebensätze einleiten; ", { term: "and that" }, " verbindet sie."], it: ["Un verbo introduttivo può aprire più proposizioni; ", { term: "and that" }, " le collega."], pl: ["Jeden czasownik wprowadzający może otwierać kilka zdań; łączy je ", { term: "and that" }, "."], tr: ["Tek bir aktarma fiili birkaç yantümceyi başlatabilir; bunları ", { term: "and that" }, " birbirine bağlar."], id: ["Satu kata kerja pelapor dapat membuka beberapa klausa; ", { term: "and that" }, " menghubungkannya."], vi: ["Một động từ tường thuật có thể mở nhiều mệnh đề; ", { term: "and that" }, " nối chúng lại."] }, ex: ["He said he had finished ", { target: and that }, " he would call."], tr: { uk: "Він сказав, що закінчив і що зателефонує.", es: "Dijo que había terminado y que llamaría.", pt: "Ele disse que tinha terminado e que ligaria.", fr: "Il a dit qu’il avait fini et qu’il appellerait.", de: "Er sagte, er sei fertig und er werde anrufen.", it: "Ha detto che aveva finito e che avrebbe chiamato.", pl: "Powiedział, że skończył i że zadzwoni.", tr: "Bitirdiğini ve arayacağını söyledi.", id: "Dia berkata bahwa dia sudah selesai dan bahwa dia akan menelepon.", vi: "Anh ấy nói anh ấy đã làm xong và anh ấy sẽ gọi." } }

  - title: { en: "Form: pronouns and time words", uk: "Форма: займенники й слова на позначення часу", es: "Forma: pronombres y expresiones de tiempo", pt: "Forma: pronomes e expressões de tempo", fr: "Forme : pronoms et expressions de temps", de: "Form: Pronomen und Zeitangaben", it: "Forma: pronomi ed espressioni di tempo", pl: "Forma: zaimki i określenia czasu", tr: "Biçim: zamirler ve zaman sözcükleri", id: "Bentuk: kata ganti dan keterangan waktu", vi: "Dạng: đại từ và từ chỉ thời gian" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: direct, label: { en: Direct, uk: "Пряма мова", es: "Estilo directo", pt: "Discurso direto", fr: "Discours direct", de: "Direkte Rede", it: "Discorso diretto", pl: "Mowa niezależna", tr: "Doğrudan anlatım", id: "Kalimat langsung", vi: "Trực tiếp" } }
          - { key: reported, label: { en: Reported, uk: "Непряма мова", es: "Estilo indirecto", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Gián tiếp" } }
        rows:
          - { level: B1, direct: { alternatives: [I, my] }, reported: { alternatives: [he, she, his, her] } }
          - { level: B1, direct: { alternatives: [we, our] }, reported: { alternatives: [they, their] } }
          - { level: B1, direct: { alternatives: [this, these] }, reported: { alternatives: [that, those] } }
          - { level: B1, direct: here, reported: there }
          - { level: B1, direct: now, reported: then }
          - { level: B1, direct: today, reported: that day }
          - { level: B1, direct: tomorrow, reported: { alternatives: [the next day, the following day] } }
          - { level: B1, direct: yesterday, reported: { alternatives: [the day before, the previous day] } }
          - { level: B1, direct: last week, reported: the week before }
          - { level: B1, direct: next week, reported: { alternatives: [the week after, the following week] } }
          - { level: B1, direct: ago, reported: before }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "Pronouns follow the speaker:"
              uk: "Займенники відповідають мовцеві:"
              es: "Los pronombres siguen al hablante:"
              pt: "Os pronomes acompanham quem fala:"
              fr: "Les pronoms suivent la personne qui parle :"
              de: "Die Pronomen richten sich nach dem Sprecher:"
              it: "I pronomi seguono chi parla:"
              pl: "Zaimki odpowiadają mówiącemu:"
              tr: "Zamirler konuşana göre değişir:"
              id: "Kata ganti mengikuti pembicara:"
              vi: "Đại từ đổi theo người nói:"
            ex: { mapping: ["“I'm tired,” said Anna", ["Anna said ", { target: she }, " was tired."]] }
            tr: { uk: "«Я втомилася», — сказала Анна. Анна сказала, що вона втомилася.", es: "«Estoy cansada», dijo Anna. Anna dijo que estaba cansada.", pt: "“Estou cansada”, disse Anna. Anna disse que estava cansada.", fr: "« Je suis fatiguée », a dit Anna. Anna a dit qu’elle était fatiguée.", de: "„Ich bin müde“, sagte Anna. Anna sagte, sie sei müde.", it: "«Sono stanca», ha detto Anna. Anna ha detto che era stanca.", pl: "„Jestem zmęczona” — powiedziała Anna. Anna powiedziała, że ona jest zmęczona.", tr: "“Yorgunum,” dedi Anna. Anna yorgun olduğunu söyledi.", id: "“Saya lelah,” kata Anna. Anna berkata bahwa dia lelah.", vi: "“Tôi mệt,” Anna nói. Anna nói là cô ấy mệt." }
          - type: rule
            level: B1
            text:
              en: Time words stay the same when the report is made on the same day.
              uk: "Слова на позначення часу не змінюються, якщо повідомляють у той самий день."
              es: "Las expresiones de tiempo no cambian si se informa el mismo día."
              pt: "As expressões de tempo não mudam quando o relato é feito no mesmo dia."
              fr: "Les expressions de temps ne changent pas si le propos est rapporté le jour même."
              de: "Zeitangaben bleiben gleich, wenn am selben Tag berichtet wird."
              it: "Le espressioni di tempo restano invariate se si riporta nello stesso giorno."
              pl: "Określenia czasu się nie zmieniają, jeśli relacja jest podawana tego samego dnia."
              tr: "Aktarma aynı gün yapılıyorsa zaman sözcükleri değişmez."
              id: "Keterangan waktu tidak berubah jika laporan disampaikan pada hari yang sama."
              vi: "Từ chỉ thời gian giữ nguyên khi câu được tường thuật trong cùng ngày."

  - title: { en: "Form: reported questions", uk: "Форма: непрямі питання", es: "Forma: preguntas indirectas", pt: "Forma: perguntas indiretas", fr: "Forme : questions indirectes", de: "Form: indirekte Fragen", it: "Forma: domande indirette", pl: "Forma: pytania w mowie zależnej", tr: "Biçim: dolaylı sorular", id: "Bentuk: pertanyaan tak langsung", vi: "Dạng: câu hỏi gián tiếp" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: type, label: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: direct, label: { en: Direct, uk: "Пряма мова", es: "Estilo directo", pt: "Discurso direto", fr: "Discours direct", de: "Direkte Rede", it: "Discorso diretto", pl: "Mowa niezależna", tr: "Doğrudan anlatım", id: "Kalimat langsung", vi: "Trực tiếp" } }
          - { key: reported, label: { en: Reported, uk: "Непряма мова", es: "Estilo indirecto", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Gián tiếp" } }
        rows:
          - { level: B1, type: { alternatives: ["Yes", "no"] }, direct: { ex: “Do you like tea?”, tr: { uk: "«Ти любиш чай?»", es: "«¿Te gusta el té?»", pt: "“Você gosta de chá?”", fr: "« Tu aimes le thé ? »", de: "„Magst du Tee?“", it: "«Ti piace il tè?»", pl: "„Lubisz herbatę?”", tr: "“Çayı sever misin?”", id: "“Apakah kamu suka teh?”", vi: "“Bạn có thích trà không?”" } }, reported: { ex: ["She asked ", { target: if }, " I ", { target: liked }, " tea."], tr: { uk: "Вона запитала, чи я люблю чай.", es: "Me preguntó si me gustaba el té.", pt: "Ela perguntou se eu gostava de chá.", fr: "Elle m’a demandé si j’aimais le thé.", de: "Sie fragte mich, ob ich Tee mag.", it: "Mi ha chiesto se mi piaceva il tè.", pl: "Zapytała, czy lubię herbatę.", tr: "Çayı sevip sevmediğimi sordu.", id: "Dia bertanya apakah saya suka teh.", vi: "Cô ấy hỏi tôi có thích trà không." } } }
          - { level: B1, type: Wh-, direct: { ex: “Where do you live?”, tr: { uk: "«Де ти живеш?»", es: "«¿Dónde vives?»", pt: "“Onde você mora?”", fr: "« Où habites-tu ? »", de: "„Wo wohnst du?“", it: "«Dove abiti?»", pl: "„Gdzie mieszkasz?”", tr: "“Nerede yaşıyorsun?”", id: "“Di mana kamu tinggal?”", vi: "“Bạn sống ở đâu?”" } }, reported: { ex: ["She asked ", { target: where }, " I ", { target: lived }, "."], tr: { uk: "Вона запитала, де я живу.", es: "Me preguntó dónde vivía.", pt: "Ela perguntou onde eu morava.", fr: "Elle m’a demandé où j’habitais.", de: "Sie fragte mich, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytała, gdzie mieszkam.", tr: "Nerede yaşadığımı sordu.", id: "Dia bertanya di mana saya tinggal.", vi: "Cô ấy hỏi tôi sống ở đâu." } } }
          - { level: B1, type: Wh-, direct: { ex: “What is your name?”, tr: { uk: "«Як тебе звати?»", es: "«¿Cómo te llamas?»", pt: "“Qual é o seu nome?”", fr: "« Comment t’appelles-tu ? »", de: "„Wie heißt du?“", it: "«Come ti chiami?»", pl: "„Jak masz na imię?”", tr: "“Adın ne?”", id: "“Siapa namamu?”", vi: "“Tên bạn là gì?”" } }, reported: { ex: ["She asked ", { target: what }, " my name ", { target: was }, "."], tr: { uk: "Вона запитала, як мене звати.", es: "Me preguntó cómo me llamaba.", pt: "Ela perguntou qual era o meu nome.", fr: "Elle m’a demandé comment je m’appelais.", de: "Sie fragte mich, wie ich heiße.", it: "Mi ha chiesto come mi chiamavo.", pl: "Zapytała, jak mam na imię.", tr: "Adımın ne olduğunu sordu.", id: "Dia bertanya siapa nama saya.", vi: "Cô ấy hỏi tên tôi là gì." } } }
          - { level: B2, type: { pattern: [{ slot: wh-word }, to, { slot: V }] }, direct: { ex: "“Where should I go?”", tr: { uk: "«Куди мені йти?»", es: "«¿Adónde debo ir?»", pt: "“Aonde devo ir?”", fr: "« Où dois-je aller ? »", de: "„Wohin soll ich gehen?“", it: "«Dove devo andare?»", pl: "„Dokąd mam iść?”", tr: "“Nereye gitmeliyim?”", id: "“Ke mana saya harus pergi?”", vi: "“Tôi nên đi đâu?”" } }, reported: { ex: ["She asked me ", { target: where to go }, "."], tr: { uk: "Вона запитала мене, куди йти.", es: "Me preguntó adónde ir.", pt: "Ela me perguntou aonde ir.", fr: "Elle m’a demandé où aller.", de: "Sie fragte mich, wohin sie gehen solle.", it: "Mi ha chiesto dove andare.", pl: "Zapytała mnie, dokąd iść.", tr: "Bana nereye gitmesi gerektiğini sordu.", id: "Dia bertanya kepada saya ke mana harus pergi.", vi: "Cô ấy hỏi tôi nên đi đâu." } } }
          - { level: B2, type: { pattern: [whether, to, { slot: V }] }, direct: { ex: "“Should I wait?”", tr: { uk: "«Мені зачекати?»", es: "«¿Debo esperar?»", pt: "“Devo esperar?”", fr: "« Dois-je attendre ? »", de: "„Soll ich warten?“", it: "«Devo aspettare?»", pl: "„Czy mam czekać?”", tr: "“Beklemeli miyim?”", id: "“Haruskah saya menunggu?”", vi: "“Tôi có nên đợi không?”" } }, reported: { ex: ["He asked ", { target: whether to wait }, "."], tr: { uk: "Він запитав, чи чекати.", es: "Preguntó si debía esperar.", pt: "Ele perguntou se devia esperar.", fr: "Il a demandé s’il devait attendre.", de: "Er fragte, ob er warten solle.", it: "Ha chiesto se aspettare.", pl: "Zapytał, czy czekać.", tr: "Beklemesi gerekip gerekmediğini sordu.", id: "Dia bertanya apakah harus menunggu.", vi: "Anh ấy hỏi có nên đợi không." } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A reported question has statement order: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", with no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: ["Непряме питання має порядок слів розповідного речення: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", без ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: ["Una pregunta indirecta tiene el orden de una afirmación: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", sin ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              pt: ["Uma pergunta indireta tem a ordem de uma afirmação: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", sem ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              fr: ["Une question indirecte suit l’ordre d’une phrase affirmative : ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", sans ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              de: ["Eine indirekte Frage hat die Wortstellung eines Aussagesatzes: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", ohne ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
