              es: ["Después de ", { term: says }, " (presente) el tiempo no cambia:"]
              pt: ["Depois de ", { term: "says" }, " (presente), o tempo verbal não muda:"]
              fr: ["Après ", { term: "says" }, " (présent), le temps ne change pas :"]
              de: ["Nach ", { term: "says" }, " (Gegenwart) bleibt die Zeitform:"]
              it: ["Dopo ", { term: "says" }, " (presente) il tempo non cambia:"]
              pl: ["Po ", { term: "says" }, " (czas teraźniejszy) czas się nie zmienia:"]
              tr: [{ term: "says" }, " (şimdiki zaman) sonrasında zaman değişmez:"]
              id: ["Setelah ", { term: "says" }, " (present), tense tetap sama:"]
              vi: ["Sau ", { term: "says" }, " (hiện tại), thì giữ nguyên:"]
            ex: ["She says she ", { target: is }, " tired."]
            tr: { uk: "Вона каже, що втомилася.", es: "Dice que está cansada.", pt: "Ela diz que está cansada.", fr: "Elle dit qu’elle est fatiguée.", de: "Sie sagt, sie sei müde.", it: "Dice che è stanca.", pl: "Mówi, że jest zmęczona.", tr: "Yorgun olduğunu söylüyor.", id: "Dia bilang dia lelah.", vi: "Cô ấy nói cô ấy đang mệt." }
          - type: rule
            level: B2
            text: { en: "After a present perfect reporting verb the tense stays:", uk: "Після дієслова мовлення в Present Perfect час не змінюється:", es: "Después de un verbo introductorio en presente perfecto el tiempo no cambia:", pt: "Depois de um verbo introdutório no presente perfeito, o tempo verbal não muda:", fr: "Après un verbe introducteur au present perfect, le temps ne change pas :", de: "Nach einem einleitenden Verb im Present Perfect bleibt die Zeitform:", it: "Dopo un verbo introduttivo al present perfect il tempo non cambia:", pl: "Po czasowniku wprowadzającym w Present Perfect czas się nie zmienia:", tr: "Present Perfect zamanlı bir aktarma fiilinden sonra zaman değişmez:", id: "Setelah kata kerja pelapor dalam present perfect, tense tetap sama:", vi: "Sau động từ tường thuật ở hiện tại hoàn thành, thì giữ nguyên:" }
            ex: ["She has told me she ", { target: is }, " leaving."]
            tr: { uk: "Вона вже сказала мені, що від’їжджає.", es: "Me ha dicho que se va.", pt: "Ela me disse que está indo embora.", fr: "Elle m’a dit qu’elle part.", de: "Sie hat mir gesagt, dass sie weggeht.", it: "Mi ha detto che se ne va.", pl: "Powiedziała mi, że wyjeżdża.", tr: "Bana ayrılacağını söyledi.", id: "Dia sudah bilang kepada saya bahwa dia akan pergi.", vi: "Cô ấy đã bảo tôi là cô ấy sắp đi." }

