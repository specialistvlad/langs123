          - { key: direct, label: { en: Direct, uk: "Пряма мова", es: "Estilo directo", pt: "Discurso direto", fr: "Discours direct", de: "Direkte Rede", it: "Discorso diretto", pl: "Mowa niezależna", tr: "Doğrudan anlatım", id: "Kalimat langsung", vi: "Trực tiếp" } }
          - { key: reported, label: { en: Reported, uk: "Непряма мова", es: "Estilo indirecto", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Gián tiếp" } }
        rows:
          - { level: B1, direct: { alternatives: [I, my] }, reported: { alternatives: [he, she, his, her] } }
          - { level: B1, direct: { alternatives: [we, our] }, reported: { alternatives: [they, their] } }
          - { level: B1, direct: { alternatives: [this, these] }, reported: { alternatives: [that, those] } }
          - { level: B1, direct: here, reported: there }
          - { level: B1, direct: now, reported: then }
          - { level: B1, direct: today, reported: that day }
          - { level: B1, direct: tomorrow, reported: { alternatives: [the next day, the following day] } }
          - { level: B1, direct: yesterday, reported: { alternatives: [the day before, the previous day] } }
          - { level: B1, direct: last week, reported: the week before }
          - { level: B1, direct: next week, reported: { alternatives: [the week after, the following week] } }
          - { level: B1, direct: ago, reported: before }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "Pronouns follow the speaker:"
              uk: "Займенники відповідають мовцеві:"
              es: "Los pronombres siguen al hablante:"
              pt: "Os pronomes acompanham quem fala:"
              fr: "Les pronoms suivent la personne qui parle :"
              de: "Die Pronomen richten sich nach dem Sprecher:"
              it: "I pronomi seguono chi parla:"
              pl: "Zaimki odpowiadają mówiącemu:"
              tr: "Zamirler konuşana göre değişir:"
              id: "Kata ganti mengikuti pembicara:"
              vi: "Đại từ đổi theo người nói:"
            ex: { mapping: ["“I'm tired,” said Anna", ["Anna said ", { target: she }, " was tired."]] }
            tr: { uk: "«Я втомилася», — сказала Анна. Анна сказала, що вона втомилася.", es: "«Estoy cansada», dijo Anna. Anna dijo que estaba cansada.", pt: "“Estou cansada”, disse Anna. Anna disse que estava cansada.", fr: "« Je suis fatiguée », a dit Anna. Anna a dit qu’elle était fatiguée.", de: "„Ich bin müde“, sagte Anna. Anna sagte, sie sei müde.", it: "«Sono stanca», ha detto Anna. Anna ha detto che era stanca.", pl: "„Jestem zmęczona” — powiedziała Anna. Anna powiedziała, że ona jest zmęczona.", tr: "“Yorgunum,” dedi Anna. Anna yorgun olduğunu söyledi.", id: "“Saya lelah,” kata Anna. Anna berkata bahwa dia lelah.", vi: "“Tôi mệt,” Anna nói. Anna nói là cô ấy mệt." }
          - type: rule
            level: B1
            text:
              en: Time words stay the same when the report is made on the same day.
              uk: "Слова на позначення часу не змінюються, якщо повідомляють у той самий день."
              es: "Las expresiones de tiempo no cambian si se informa el mismo día."
              pt: "As expressões de tempo não mudam quando o relato é feito no mesmo dia."
              fr: "Les expressions de temps ne changent pas si le propos est rapporté le jour même."
              de: "Zeitangaben bleiben gleich, wenn am selben Tag berichtet wird."
              it: "Le espressioni di tempo restano invariate se si riporta nello stesso giorno."
              pl: "Określenia czasu się nie zmieniają, jeśli relacja jest podawana tego samego dnia."
              tr: "Aktarma aynı gün yapılıyorsa zaman sözcükleri değişmez."
              id: "Keterangan waktu tidak berubah jika laporan disampaikan pada hari yang sama."
              vi: "Từ chỉ thời gian giữ nguyên khi câu được tường thuật trong cùng ngày."

  - title: { en: "Form: reported questions", uk: "Форма: непрямі питання", es: "Forma: preguntas indirectas", pt: "Forma: perguntas indiretas", fr: "Forme : questions indirectes", de: "Form: indirekte Fragen", it: "Forma: domande indirette", pl: "Forma: pytania w mowie zależnej", tr: "Biçim: dolaylı sorular", id: "Bentuk: pertanyaan tak langsung", vi: "Dạng: câu hỏi gián tiếp" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: type, label: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: direct, label: { en: Direct, uk: "Пряма мова", es: "Estilo directo", pt: "Discurso direto", fr: "Discours direct", de: "Direkte Rede", it: "Discorso diretto", pl: "Mowa niezależna", tr: "Doğrudan anlatım", id: "Kalimat langsung", vi: "Trực tiếp" } }
          - { key: reported, label: { en: Reported, uk: "Непряма мова", es: "Estilo indirecto", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Gián tiếp" } }
        rows:
          - { level: B1, type: { alternatives: ["Yes", "no"] }, direct: { ex: “Do you like tea?”, tr: { uk: "«Ти любиш чай?»", es: "«¿Te gusta el té?»", pt: "“Você gosta de chá?”", fr: "« Tu aimes le thé ? »", de: "„Magst du Tee?“", it: "«Ti piace il tè?»", pl: "„Lubisz herbatę?”", tr: "“Çayı sever misin?”", id: "“Apakah kamu suka teh?”", vi: "“Bạn có thích trà không?”" } }, reported: { ex: ["She asked ", { target: if }, " I ", { target: liked }, " tea."], tr: { uk: "Вона запитала, чи я люблю чай.", es: "Me preguntó si me gustaba el té.", pt: "Ela perguntou se eu gostava de chá.", fr: "Elle m’a demandé si j’aimais le thé.", de: "Sie fragte mich, ob ich Tee mag.", it: "Mi ha chiesto se mi piaceva il tè.", pl: "Zapytała, czy lubię herbatę.", tr: "Çayı sevip sevmediğimi sordu.", id: "Dia bertanya apakah saya suka teh.", vi: "Cô ấy hỏi tôi có thích trà không." } } }
          - { level: B1, type: Wh-, direct: { ex: “Where do you live?”, tr: { uk: "«Де ти живеш?»", es: "«¿Dónde vives?»", pt: "“Onde você mora?”", fr: "« Où habites-tu ? »", de: "„Wo wohnst du?“", it: "«Dove abiti?»", pl: "„Gdzie mieszkasz?”", tr: "“Nerede yaşıyorsun?”", id: "“Di mana kamu tinggal?”", vi: "“Bạn sống ở đâu?”" } }, reported: { ex: ["She asked ", { target: where }, " I ", { target: lived }, "."], tr: { uk: "Вона запитала, де я живу.", es: "Me preguntó dónde vivía.", pt: "Ela perguntou onde eu morava.", fr: "Elle m’a demandé où j’habitais.", de: "Sie fragte mich, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytała, gdzie mieszkam.", tr: "Nerede yaşadığımı sordu.", id: "Dia bertanya di mana saya tinggal.", vi: "Cô ấy hỏi tôi sống ở đâu." } } }
          - { level: B1, type: Wh-, direct: { ex: “What is your name?”, tr: { uk: "«Як тебе звати?»", es: "«¿Cómo te llamas?»", pt: "“Qual é o seu nome?”", fr: "« Comment t’appelles-tu ? »", de: "„Wie heißt du?“", it: "«Come ti chiami?»", pl: "„Jak masz na imię?”", tr: "“Adın ne?”", id: "“Siapa namamu?”", vi: "“Tên bạn là gì?”" } }, reported: { ex: ["She asked ", { target: what }, " my name ", { target: was }, "."], tr: { uk: "Вона запитала, як мене звати.", es: "Me preguntó cómo me llamaba.", pt: "Ela perguntou qual era o meu nome.", fr: "Elle m’a demandé comment je m’appelais.", de: "Sie fragte mich, wie ich heiße.", it: "Mi ha chiesto come mi chiamavo.", pl: "Zapytała, jak mam na imię.", tr: "Adımın ne olduğunu sordu.", id: "Dia bertanya siapa nama saya.", vi: "Cô ấy hỏi tên tôi là gì." } } }
          - { level: B2, type: { pattern: [{ slot: wh-word }, to, { slot: V }] }, direct: "“Where should I go?”", reported: ["She asked me ", { target: where to go }, "."] }
          - { level: B2, type: { pattern: [whether, to, { slot: V }] }, direct: "“Should I wait?”", reported: ["He asked ", { target: whether to wait }, "."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A reported question has statement order: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", with no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: ["Непряме питання має порядок слів розповідного речення: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", без ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: ["Una pregunta indirecta tiene el orden de una afirmación: ", { pattern: [{ slot: subject }, { slot: verb }] }, ", sin ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              pt: ["Uma pergunta indireta tem a ordem de uma afirmação: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", sem ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              fr: ["Une question indirecte suit l’ordre d’une phrase affirmative : ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", sans ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              de: ["Eine indirekte Frage hat die Wortstellung eines Aussagesatzes: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", ohne ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              it: ["Una domanda indiretta ha l'ordine della frase affermativa: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", senza ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              pl: ["Pytanie w mowie zależnej ma szyk zdania oznajmującego: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", bez ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              tr: ["Dolaylı sorular düz cümle sırasındadır: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, "; ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " kullanılmaz."]
              id: ["Pertanyaan tak langsung memakai urutan kalimat pernyataan: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", tanpa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              vi: ["Câu hỏi gián tiếp có trật tự như câu trần thuật: ", { pattern: [{ slot: "subject" }, { slot: "verb" }] }, ", không có ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
          - type: rule
            level: B1
            text:
              en: [{ alternatives: ["Yes", "no"] }, " questions take ", { term: if }, " or ", { term: whether }, . The sentence ends with a full stop.]
              uk: ["Питання ", { alternatives: ["Yes", "no"] }, " вживаються з ", { term: if }, " або ", { term: whether }, ". Речення закінчується крапкою."]
              es: ["Las preguntas ", { alternatives: ["Yes", "no"] }, " llevan ", { term: if }, " o ", { term: whether }, ". La oración termina con punto final."]
              pt: ["As perguntas ", { alternatives: ["Yes", "no"] }, " levam ", { term: "if" }, " ou ", { term: "whether" }, ". A frase termina com ponto final."]
              fr: ["Les questions ", { alternatives: ["Yes", "no"] }, " prennent ", { term: "if" }, " ou ", { term: "whether" }, ". La phrase se termine par un point."]
              de: [{ alternatives: ["Yes", "no"] }, "-Fragen nehmen ", { term: "if" }, " oder ", { term: "whether" }, ". Der Satz endet mit einem Punkt."]
              it: ["Le domande ", { alternatives: ["Yes", "no"] }, " si formano con ", { term: "if" }, " o ", { term: "whether" }, ". La frase termina con un punto fermo."]
              pl: ["Pytania ", { alternatives: ["Yes", "no"] }, " łączą się z ", { term: "if" }, " lub ", { term: "whether" }, ". Zdanie kończy się kropką."]
              tr: [{ alternatives: ["Yes", "no"] }, " soruları ", { term: "if" }, " veya ", { term: "whether" }, " alır. Cümle nokta ile biter."]
              id: ["Pertanyaan ", { alternatives: ["Yes", "no"] }, " memakai ", { term: "if" }, " atau ", { term: "whether" }, ". Kalimat diakhiri dengan titik."]
              vi: ["Câu hỏi ", { alternatives: ["Yes", "no"] }, " dùng ", { term: "if" }, " hoặc ", { term: "whether" }, ". Câu kết thúc bằng dấu chấm."]
          - type: rule
            level: B1
            text:
              en: Tenses and pronouns change as in statements.
              uk: "Часи й займенники змінюються так само, як у розповідних реченнях."
              es: "Los tiempos y los pronombres cambian como en las afirmaciones."
              pt: "Os tempos verbais e os pronomes mudam como nas afirmações."
              fr: "Les temps et les pronoms changent comme dans les phrases affirmatives."
              de: "Zeitformen und Pronomen ändern sich wie in Aussagesätzen."
              it: "I tempi e i pronomi cambiano come nelle frasi affermative."
              pl: "Czasy i zaimki zmieniają się tak jak w zdaniach oznajmujących."
              tr: "Zamanlar ve zamirler, düz cümlelerdeki gibi değişir."
              id: "Tense dan kata ganti berubah seperti dalam kalimat pernyataan."
              vi: "Thì và đại từ đổi như trong câu trần thuật."
          - type: rule
            level: B2
            text: { en: ["A wh-word or ", { term: whether }, " can take a ", { term: to }, "-infinitive instead of a clause."] }
            ex: ["She told me ", { target: how to get }, " there."]

  - title: { en: "Form: reported commands", uk: "Форма: непрямі накази", es: "Forma: órdenes indirectas", pt: "Forma: ordens indiretas", fr: "Forme : ordres indirects", de: "Form: indirekte Aufforderungen", it: "Forma: ordini indiretti", pl: "Forma: polecenia w mowie zależnej", tr: "Biçim: dolaylı emirler", id: "Bentuk: perintah tak langsung", vi: "Dạng: mệnh lệnh gián tiếp" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo", pt: "Tipo", fr: "Type", de: "Typ", it: "Tipo", pl: "Typ", tr: "Tür", id: "Jenis", vi: "Loại" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, type: { en: Command, uk: "Наказ", es: "Orden", pt: "Ordem", fr: "Ordre", de: "Befehl", it: "Ordine", pl: "Polecenie", tr: "Emir", id: "Perintah", vi: "Mệnh lệnh" }, pattern: { pattern: [told, { slot: person }, to, { slot: V }] }, ex: { mapping: [“Sit down.”, ["He ", { target: told me to sit }, " down."]] }, tr: { uk: "«Сядь». Він сказав мені сісти.", es: "«Siéntate». Me dijo que me sentara.", pt: "“Sente-se.” Ele me disse para sentar.", fr: "« Assieds-toi. » Il m’a dit de m’asseoir.", de: "„Setz dich hin.“ Er sagte mir, ich solle mich hinsetzen.", it: "«Siediti». Mi ha detto di sedermi.", pl: "„Usiądź.” Powiedział mi, żebym usiadł.", tr: "“Otur.” Bana oturmamı söyledi.", id: "“Duduklah.” Dia menyuruh saya duduk.", vi: "“Ngồi xuống.” Anh ấy bảo tôi ngồi xuống." } }
          - { level: B1, type: { en: Request, uk: "Прохання", es: "Petición", pt: "Pedido", fr: "Demande", de: "Bitte", it: "Richiesta", pl: "Prośba", tr: "Rica", id: "Permintaan", vi: "Yêu cầu" }, pattern: { pattern: [asked, { slot: person }, to, { slot: V }] }, ex: { mapping: [“Please help.”, ["She ", { target: asked me to help }, "."]] }, tr: { uk: "«Допоможи, будь ласка». Вона попросила мене допомогти.", es: "«Ayuda, por favor». Me pidió que ayudara.", pt: "“Ajude, por favor.” Ela me pediu para ajudar.", fr: "« Aide-moi, s’il te plaît. » Elle m’a demandé de l’aider.", de: "„Bitte hilf mir.“ Sie bat mich, ihr zu helfen.", it: "«Aiutami, per favore». Mi ha chiesto di aiutarla.", pl: "„Pomóż, proszę.” Poprosiła mnie, żebym pomógł.", tr: "“Lütfen yardım et.” Benden yardım etmemi istedi.", id: "“Tolong bantu.” Dia meminta saya membantu.", vi: "“Làm ơn giúp với.” Cô ấy nhờ tôi giúp." } }
          - { level: B1, type: { en: Negative, uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [told, { slot: person }, not to, { slot: V }] }, ex: { mapping: [“Don't be late.”, ["He ", { target: told us not to be }, " late."]] }, tr: { uk: "«Не запізнюйтеся». Він сказав нам не запізнюватися.", es: "«No lleguen tarde». Nos dijo que no llegáramos tarde.", pt: "“Não cheguem atrasados.” Ele nos disse para não chegarmos atrasados.", fr: "« Ne soyez pas en retard. » Il nous a dit de ne pas arriver en retard.", de: "„Kommt nicht zu spät.“ Er sagte uns, wir sollten nicht zu spät kommen.", it: "«Non fate tardi». Ci ha detto di non fare tardi.", pl: "„Nie spóźnijcie się.” Powiedział nam, żebyśmy się nie spóźnili.", tr: "“Geç kalmayın.” Bize geç kalmamamızı söyledi.", id: "“Jangan terlambat.” Dia menyuruh kami agar tidak terlambat.", vi: "“Đừng đến muộn.” Anh ấy bảo chúng tôi đừng đến muộn." } }

  - title: { en: "Distancing and evaluating verbs" }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: use, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, word: { alternatives: [claim, allege] }, use: { en: "the reporter passes on a statement without vouching for it" }, ex: { examples: [["The witness ", { target: claims }, " that she saw the car."], ["The report ", { target: alleges }, " that he took the money."], ["He ", { target: claims to have }, " met her."]] } }
          - { level: C1, word: { alternatives: [maintain, assert] }, use: { en: "states a view firmly in the face of doubt" }, ex: { examples: [["She ", { target: maintains }, " that she is innocent."], ["He ", { target: asserted }, " that the rules were clear."]] } }
          - { level: C1, word: suggest, use: { en: "evidence points to something" }, ex: ["The figures ", { target: suggest }, " that sales are falling."] }
          - { level: C1, word: { alternatives: [reportedly, supposedly, apparently] }, use: { en: "the speaker passes on a claim without confirming it" }, ex: { examples: [["The firm has ", { target: reportedly }, " lost millions."], ["She is ", { target: supposedly }, " a doctor."], [{ target: Apparently }, ", the shop is closed."]] } }
          - { level: C1, word: according to, use: { en: "names the source of a statement" }, ex: [{ target: According to }, " the report, prices will rise."] }
          - { level: C2, word: { alternatives: [aver, contend, concede] }, use: { en: "formal verbs that state, argue or grant a point" }, ex: { examples: [["She ", { target: averred }, " that she had never met him."], ["The defence ", { target: contended }, " that the evidence was unsafe."], ["The minister ", { target: conceded }, " that mistakes had been made."]] } }
          - { level: C2, word: enjoin, use: { en: "formal: orders or urges someone to act" }, ex: ["The judge ", { target: enjoined him to }, " keep the peace."] }
          - { level: C2, word: { alternatives: [insist, demand, require, recommend, propose, stipulate] }, use: { en: "the that-clause takes the base verb: the subjunctive" }, ex: { examples: [["She ", { target: insisted that he be }, " present."], ["The contract ", { target: stipulates that }, " payment ", { target: be }, " made in advance."]] } }
          - { level: C2, word: to the effect that, use: { en: "gives the gist, not the exact words" }, ex: ["He left a note ", { target: to the effect that }, " he would return."] }
      - type: list
        items:
          - type: note
            level: C2
            text: { en: ["British English often adds ", { term: should }, ": ", { term: "insisted that he should be" }, ". See ", { link: The subjunctive, to: en.sentence-building.subjunctive }, "."] }

  - title: { en: "Form: direct speech" }
    role: form
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, rule: { en: "The reporting verb follows the words, after a pronoun subject." }, ex: ["‘I’m leaving,’ ", { target: she said }, "."] }
          - { level: C1, rule: { en: "A noun subject can follow the reporting verb." }, ex: ["‘I’m leaving,’ ", { target: said Tom }, "."] }
          - { level: C1, rule: { en: "The reporting verb can interrupt the words at a pause." }, ex: ["‘I’m leaving,’ ", { target: she said }, ", ‘before it rains.’"] }
      - type: list
        items:
          - type: note
            level: C1
            text: { en: ["The marks and commas around direct speech: see ", { link: Punctuation, to: en.foundations.punctuation }, "."] }

  - title: { en: "Free indirect speech" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, rule: { en: "The narrator voices a character's thoughts with no reporting verb." }, ex: ["She was late. ", { target: What would he say? }] }
          - { level: C2, rule: { en: "Tense and person follow the narration; a question keeps its own word order." }, ex: ["She looked at the clock. ", { target: Why did she always forget? }] }
          - { level: C2, rule: { en: ["Time and place words stay as the character would think them: ", { term: now }, ", ", { term: tomorrow }, ", ", { term: here }, "."] }, ex: ["She looked at the calendar. ", { target: Tomorrow }, " was Monday."] }
          - { level: C2, rule: { en: "Exclamations and fragments show the character's feeling." }, ex: ["Oh, ", { target: how foolish she had been! }] }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Fiction uses free indirect speech to show a character's mind; reports keep a reporting verb." }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
