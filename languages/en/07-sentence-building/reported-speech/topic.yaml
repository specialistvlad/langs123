, { term: "that day" }] }, ", ", { mapping: [{ term: "tomorrow" }, { term: "the next day" }] }], vi: ["đại từ đổi theo người nói; ", { mapping: [{ term: "today" }, { term: "that day" }] }, ", ", { mapping: [{ term: "tomorrow" }, { term: "the next day" }] }] }, ex: ["Anna said ", { target: she }, " was tired."], tr: { uk: "Анна сказала, що вона втомилася.", es: "Anna dijo que estaba cansada.", pt: "Anna disse que estava cansada.", fr: "Anna a dit qu’elle était fatiguée.", de: "Anna sagte, sie sei müde.", it: "Anna ha detto che era stanca.", pl: "Anna powiedziała, że ona jest zmęczona.", tr: "Anna yorgun olduğunu söyledi.", id: "Anna berkata bahwa dia lelah.", vi: "Anna nói là cô ấy mệt." } }
        - { level: B1, point: { en: Questions, uk: "Питання", es: "Preguntas", pt: "Perguntas", fr: "Questions", de: "Fragen", it: "Domande", pl: "Pytania", tr: "Sorular", id: "Pertanyaan", vi: "Câu hỏi" }, rule: { en: ["yes/no questions take ", { term: if }, " or ", { term: whether }, "; wh-questions keep the wh-word"], uk: ["загальні питання вживаються з ", { term: if }, " або ", { term: whether }, "; wh-питання зберігають питальне слово"], es: ["las preguntas de sí o no llevan ", { term: if }, " o ", { term: whether }, "; las preguntas con wh- conservan la palabra interrogativa"], pt: ["as perguntas de sim ou não levam ", { term: "if" }, " ou ", { term: "whether" }, "; as perguntas com wh- mantêm a palavra interrogativa"], fr: ["les questions fermées prennent ", { term: "if" }, " ou ", { term: "whether" }, " ; les questions avec un mot interrogatif gardent ce mot"], de: ["Entscheidungsfragen nehmen ", { term: "if" }, " oder ", { term: "whether" }, "; wh-Fragen behalten das Fragewort"], it: ["le domande sì o no hanno ", { term: "if" }, " o ", { term: "whether" }, "; le domande con wh- mantengono la parola interrogativa"], pl: ["pytania ogólne łączą się z ", { term: "if" }, " lub ", { term: "whether" }, "; pytania z wh- zachowują słowo pytające"], tr: ["evet/hayır soruları ", { term: "if" }, " veya ", { term: "whether" }, " alır; wh-soruları soru sözcüğünü korur"], id: ["pertanyaan ya/tidak memakai ", { term: "if" }, " atau ", { term: "whether" }, "; pertanyaan wh- tetap memakai kata tanya wh"], vi: ["câu hỏi có/không dùng ", { term: "if" }, " hoặc ", { term: "whether" }, "; câu hỏi với từ để hỏi giữ nguyên từ để hỏi"] }, ex: ["She asked ", { target: if }, " I ", { target: liked }, " tea."], tr: { uk: "Вона запитала, чи я люблю чай.", es: "Me preguntó si me gustaba el té.", pt: "Ela perguntou se eu gostava de chá.", fr: "Elle m’a demandé si j’aimais le thé.", de: "Sie fragte mich, ob ich Tee mag.", it: "Mi ha chiesto se mi piaceva il tè.", pl: "Zapytała, czy lubię herbatę.", tr: "Çayı sevip sevmediğimi sordu.", id: "Dia bertanya apakah saya suka teh.", vi: "Cô ấy hỏi tôi có thích trà không." } }
        - { level: B1, point: { en: Commands, uk: "Накази", es: "Órdenes", pt: "Ordens", fr: "Ordres", de: "Aufforderungen", it: "Ordini", pl: "Polecenia", tr: "Emirler", id: "Perintah", vi: "Mệnh lệnh" }, rule: { pattern: [{ alternatives: [told, asked] }, { slot: person }, [{ optional: not }, " to"], { slot: V }] }, ex: ["He ", { target: told us not to be }, " late."], tr: { uk: "Він сказав нам не запізнюватися.", es: "Nos dijo que no llegáramos tarde.", pt: "Ele nos disse para não chegarmos atrasados.", fr: "Il nous a dit de ne pas arriver en retard.", de: "Er sagte uns, wir sollten nicht zu spät kommen.", it: "Ci ha detto di non fare tardi.", pl: "Powiedział nam, żebyśmy się nie spóźnili.", tr: "Bize geç kalmamamızı söyledi.", id: "Dia menyuruh kami agar tidak terlambat.", vi: "Anh ấy bảo chúng tôi đừng đến muộn." } }
        - { level: B2, point: { en: Reporting verbs }, rule: { en: "each verb has its own pattern: that-clause, to-infinitive or -ing" }, ex: ["She ", { target: advised me to rest }, "."] }
        - { level: C1, point: { en: Distancing }, rule: { en: [{ term: claim }, ", ", { term: allege }, ", ", { term: reportedly }, ": the reporter does not vouch for it"] }, ex: ["The witness ", { target: claims }, " that she saw the car."] }
        - { level: C2, point: { en: Free indirect speech }, rule: { en: "narration gives a character's thoughts with no reporting verb" }, ex: ["She was late. ", { target: What would he say? }] }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["a reported question has statement order, with no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], uk: ["непряме питання має порядок слів розповідного речення, без ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], es: ["una pregunta indirecta tiene el orden de una afirmación, sin ", { alternatives: [{ term: do }, { term: does }, { term: did }] }], pt: ["uma pergunta indireta tem a ordem de uma afirmação, sem ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], fr: ["une question indirecte suit l’ordre d’une phrase affirmative, sans ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], de: ["eine indirekte Frage hat die Wortstellung eines Aussagesatzes, ohne ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], it: ["una domanda indiretta ha l'ordine della frase affermativa, senza ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], pl: ["pytanie w mowie zależnej ma szyk zdania oznajmującego, bez ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], tr: ["dolaylı soru düz cümle sırasındadır, ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " kullanılmaz"], id: ["pertanyaan tak langsung memakai urutan kalimat pernyataan, tanpa ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }], vi: ["câu hỏi gián tiếp có trật tự như câu trần thuật, không có ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }] }, ex: ["She asked me where I ", { target: lived }, "."], tr: { uk: "Вона запитала мене, де я живу.", es: "Me preguntó dónde vivía.", pt: "Ela me perguntou onde eu morava.", fr: "Elle m’a demandé où j’habitais.", de: "Sie fragte mich, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytała mnie, gdzie mieszkam.", tr: "Bana nerede yaşadığımı sordu.", id: "Dia bertanya di mana saya tinggal.", vi: "Cô ấy hỏi tôi sống ở đâu." } }

sections:
  - title: { en: "Form: say and tell", uk: "Форма: say і tell", es: "Forma: say y tell", pt: "Forma: say e tell", fr: "Forme : say et tell", de: "Form: say und tell", it: "Forma: say e tell", pl: "Forma: say i tell", tr: "Biçim: say ve tell", id: "Bentuk: say dan tell", vi: "Dạng: say và tell" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: say, pattern: { pattern: [say, { optional: that }, { slot: clause }] }, ex: ["She ", { target: said }, " ", { optional: that }, " she was tired."], tr: { uk: "Вона сказала, що втомилася.", es: "Dijo que estaba cansada.", pt: "Ela disse que estava cansada.", fr: "Elle a dit qu’elle était fatiguée.", de: "Sie sagte, sie sei müde.", it: "Ha detto che era stanca.", pl: "Powiedziała, że jest zmęczona.", tr: "Yorgun olduğunu söyledi.", id: "Dia berkata bahwa dia lelah.", vi: "Cô ấy nói là cô ấy mệt." } }
          - { level: B1, verb: tell, pattern: { pattern: [tell, { slot: person }, { optional: that }, { slot: clause }] }, ex: ["She ", { target: told me }, " ", { optional: that }, " she was tired."], tr: { uk: "Вона сказала мені, що втомилася.", es: "Me dijo que estaba cansada.", pt: "Ela me disse que estava cansada.", fr: "Elle m’a dit qu’elle était fatiguée.", de: "Sie sagte mir, sie sei müde.", it: "Mi ha detto che era stanca.", pl: "Powiedziała mi, że jest zmęczona.", tr: "Bana yorgun olduğunu söyledi.", id: "Dia memberi tahu saya bahwa dia lelah.", vi: "Cô ấy bảo tôi là cô ấy mệt." } }
          - { level: B1, verb: say, pattern: { pattern: [say, to, { slot: person }] }, ex: ["She ", { target: said to me }, " that she was tired."], tr: { uk: "Вона сказала мені, що втомилася.", es: "Me dijo que estaba cansada.", pt: "Ela me disse que estava cansada.", fr: "Elle m’a dit qu’elle était fatiguée.", de: "Sie sagte mir, sie sei müde.", it: "Mi ha detto che era stanca.", pl: "Powiedziała mi, że jest zmęczona.", tr: "Bana yorgun olduğunu söyledi.", id: "Dia berkata kepada saya bahwa dia lelah.", vi: "Cô ấy nói với tôi là cô ấy mệt." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: tell }, " always has a person after it. ", { term: say }, " has no person, or ", { pattern: [{ term: to }, { slot: person }] }, "."]
              uk: [{ term: tell }, " завжди має після себе особу. ", { term: say }, " вживається без особи або з ", { pattern: [{ term: to }, { slot: person }] }, "."]
              es: [{ term: tell }, " siempre lleva una persona después. ", { term: say }, " no lleva persona, o lleva ", { pattern: [{ term: to }, { slot: person }] }, "."]
              pt: [{ term: "tell" }, " sempre tem uma pessoa depois. ", { term: "say" }, " não tem pessoa, ou tem ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              fr: [{ term: "tell" }, " est toujours suivi d’une personne. ", { term: "say" }, " s’emploie sans personne, ou avec ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              de: [{ term: "tell" }, " hat immer eine Person nach sich. ", { term: "say" }, " hat keine Person oder ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              it: [{ term: "tell" }, " ha sempre una persona dopo di sé. ", { term: "say" }, " non ha una persona, oppure ha ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              pl: [{ term: "tell" }, " zawsze ma po sobie osobę. ", { term: "say" }, " występuje bez osoby lub z ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              tr: [{ term: "tell" }, " fiilinden sonra her zaman kişi gelir. ", { term: "say" }, " kişisiz kullanılır ya da ", { pattern: [{ term: "to" }, { slot: "person" }] }, " alır."]
              id: [{ term: "tell" }, " selalu diikuti orang. ", { term: "say" }, " dipakai tanpa orang, atau dengan ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]
              vi: [{ term: "tell" }, " luôn có người nghe theo sau. ", { term: "say" }, " không có người nghe, hoặc có ", { pattern: [{ term: "to" }, { slot: "person" }] }, "."]

  - title: { en: "Reporting verbs by pattern" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: verbs, label: { en: Verbs } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, pattern: { pattern: [{ slot: verb }, { optional: that }, { slot: clause }] }, verbs: { alternatives: [admit, claim, complain, deny, explain, insist, mention, point out, suggest] }, ex: ["She ", { target: complained }, " ", { optional: that }, " the room was cold."] }
          - { level: B2, pattern: { pattern: [{ slot: verb }, { slot: person }, { optional: that }, { slot: clause }] }, verbs: { alternatives: [assure, convince, inform, remind, warn] }, ex: ["He ", { target: warned us }, " ", { optional: that }, " the road was icy."] }
          - { level: B2, pattern: { pattern: [{ slot: verb }, to, { slot: V }] }, verbs: { alternatives: [agree, offer, promise, refuse, threaten] }, ex: ["She ", { target: refused to wait }, "."] }
          - { level: B2, pattern: { pattern: [{ slot: verb }, { slot: person }, to, { slot: V }] }, verbs: { alternatives: [advise, ask, beg, forbid, invite, order, urge] }, ex: ["The doctor ", { target: advised me to rest }, "."] }
          - { level: B2, pattern: { pattern: [{ slot: verb }, { slot: V-ing }] }, verbs: { alternatives: [admit, deny, suggest, recommend] }, ex: ["He ", { target: denied taking }, " the money."] }
          - { level: B2, pattern: { pattern: [{ slot: verb }, { slot: { en: preposition } }, { slot: V-ing }] }, verbs: { alternatives: [apologise for, accuse of, blame for, insist on, congratulate on, object to, boast about] }, ex: ["He ", { target: insisted on paying }, "."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: accuse }, ", ", { term: blame }, " and ", { term: congratulate }, " take a person before the preposition."] }
            ex: ["They ", { target: accused him of }, " lying."]

  - title: { en: "Reporting what was done" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: direct, label: { en: Direct speech } }
          - { key: reported, label: { en: Reported speech } }
        rows:
          - { level: B2, verb: apologise for, direct: "‘Sorry, I’m late.’", reported: ["She ", { target: apologised for being }, " late."] }
          - { level: B2, verb: congratulate on, direct: "‘Well done on your exam!’", reported: ["He ", { target: congratulated me on }, " my exam."] }
          - { level: B2, verb: offer, direct: "‘I’ll help.’", reported: ["They ", { target: offered to help }, "."] }
          - { level: B2, verb: suggest, direct: "‘Let’s go.’", reported: { examples: [["She ", { target: suggested going }, "."], ["She ", { target: suggested that we go }, "."]] } }
          - { level: B2, verb: exclaim, direct: "‘How beautiful it is!’", reported: ["He ", { target: exclaimed that }, " it was beautiful."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["A reported exclamation ends with a full stop; ", { term: how }, " and ", { term: what }, " can stay."] }
            ex: ["She said ", { target: what a mess }, " it was."]

  - title: { en: "Form: backshift", uk: "Форма: зсув часів (backshift)", es: "Forma: cambio de tiempos (backshift)", pt: "Forma: mudança dos tempos verbais (backshift)", fr: "Forme : concordance des temps (backshift)", de: "Form: Zeitverschiebung (Backshift)", it: "Forma: concordanza dei tempi (backshift)", pl: "Forma: cofnięcie czasu (backshift)", tr: "Biçim: zaman kayması (backshift)", id: "Bentuk: pergeseran tense (backshift)", vi: "Dạng: lùi thì (backshift)" }
    role: form
    content:
      - type: prose
        level: B1
        text:
          en: ["After a past reporting verb (", { term: said }, ", ", { term: told }, ", ", { term: asked }, "), the tense usually moves one step back."]
          uk: ["Після дієслова в минулому часі (", { term: said }, ", ", { term: told }, ", ", { term: asked }, ") час зазвичай зсувається на один крок назад."]
          es: ["Después de un verbo introductorio en pasado (", { term: said }, ", ", { term: told }, ", ", { term: asked }, "), el tiempo suele retroceder un paso."]
          pt: ["Depois de um verbo introdutório no passado (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, "), o tempo verbal geralmente recua um passo."]
          fr: ["Après un verbe introducteur au passé (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, "), le temps recule en général d’un cran."]
          de: ["Nach einem einleitenden Verb in der Vergangenheit (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, ") rückt die Zeitform meist um einen Schritt zurück."]
          it: ["Dopo un verbo introduttivo al passato (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, ") il tempo di solito retrocede di un passo."]
          pl: ["Po czasowniku wprowadzającym w czasie przeszłym (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, ") czas zwykle cofa się o jeden krok."]
          tr: ["Geçmiş zamanlı aktarma fiilinden (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, ") sonra zaman genellikle bir adım geriye kayar."]
          id: ["Setelah kata kerja pelapor dalam bentuk past (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, "), tense biasanya bergeser satu langkah ke belakang."]
          vi: ["Sau động từ tường thuật ở quá khứ (", { term: "said" }, ", ", { term: "told" }, ", ", { term: "asked" }, "), thì thường lùi một bậc."]
      - type: usage
        columns:
          - { key: direct, label: { en: Direct speech, uk: "Пряма мова", es: "Estilo directo", pt: "Discurso direto", fr: "Discours direct", de: "Direkte Rede", it: "Discorso diretto", pl: "Mowa niezależna", tr: "Doğrudan anlatım", id: "Kalimat langsung", vi: "Câu trực tiếp" } }
          - { key: reported, label: { en: Reported speech, uk: "Непряма мова", es: "Estilo indirecto", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Câu gián tiếp" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, direct: { en: present simple, uk: "Present Simple", es: "presente simple", pt: "presente simples", fr: "présent simple", de: "Simple Present", it: "present simple", pl: "Present Simple", tr: "Simple Present", id: "simple present", vi: "hiện tại đơn" }, reported: { en: past simple, uk: "Past Simple", es: "pasado simple", pt: "passado simples", fr: "prétérit simple", de: "Simple Past", it: "past simple", pl: "Past Simple", tr: "Simple Past", id: "simple past", vi: "quá khứ đơn" }, ex: { mapping: [["“I ", { target: work }, " here.”"], ["He said he ", { target: worked }, " there."]] }, tr: { uk: "«Я працюю тут». Він сказав, що працює там.", es: "«Trabajo aquí». Dijo que trabajaba allí.", pt: "“Trabalho aqui.” Ele disse que trabalhava lá.", fr: "« Je travaille ici. » Il a dit qu’il travaillait là-bas.", de: "„Ich arbeite hier.“ Er sagte, er arbeite dort.", it: "«Lavoro qui». Ha detto che lavorava lì.", pl: "„Pracuję tutaj.” Powiedział, że tam pracuje.", tr: "“Burada çalışıyorum.” Orada çalıştığını söyledi.", id: "“Saya bekerja di sini.” Dia berkata bahwa dia bekerja di sana.", vi: "“Tôi làm việc ở đây.” Anh ấy nói anh ấy làm việc ở đó." } }
          - { level: B1, direct: { en: present continuous, uk: "Present Continuous", es: "presente continuo", pt: "presente contínuo", fr: "présent continu", de: "Present Continuous", it: "present continuous", pl: "Present Continuous", tr: "Present Continuous", id: "present continuous", vi: "hiện tại tiếp diễn" }, reported: { en: past continuous, uk: "Past Continuous", es: "pasado continuo", pt: "passado contínuo", fr: "prétérit continu", de: "Past Continuous", it: "past continuous", pl: "Past Continuous", tr: "Past Continuous", id: "past continuous", vi: "quá khứ tiếp diễn" }, ex: { mapping: [[“I, { target: "'m waiting" }, ".”"], ["She said she ", { target: was waiting }, "."]] }, tr: { uk: "«Я чекаю». Вона сказала, що чекає.", es: "«Estoy esperando». Dijo que estaba esperando.", pt: "“Estou esperando.” Ela disse que estava esperando.", fr: "« J’attends. » Elle a dit qu’elle attendait.", de: "„Ich warte.“ Sie sagte, sie warte.", it: "«Sto aspettando». Ha detto che stava aspettando.", pl: "„Czekam.” Powiedziała, że czeka.", tr: "“Bekliyorum.” Beklediğini söyledi.", id: "“Saya sedang menunggu.” Dia berkata bahwa dia sedang menunggu.", vi: "“Tôi đang đợi.” Cô ấy nói cô ấy đang đợi." } }
          - { level: B1, direct: { en: past simple, uk: "Past Simple", es: "pasado simple", pt: "passado simples", fr: "prétérit simple", de: "Simple Past", it: "past simple", pl: "Past Simple", tr: "Simple Past", id: "simple past", vi: "quá khứ đơn" }, reported: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, ex: { mapping: [["“I ", { target: left }, ".”"], ["He said he ", { target: had left }, "."]] }, tr: { uk: "«Я пішов». Він сказав, що пішов.", es: "«Me fui». Dijo que se había ido.", pt: "“Eu saí.” Ele disse que tinha saído.", fr: "« Je suis parti. » Il a dit qu’il était parti.", de: "„Ich bin gegangen.“ Er sagte, er sei gegangen.", it: "«Sono partito». Ha detto che era partito.", pl: "„Wyszedłem.” Powiedział, że wyszedł.", tr: "“Gittim.” Gittiğini söyledi.", id: "“Saya pergi.” Dia berkata bahwa dia sudah pergi.", vi: "“Tôi đã đi.” Anh ấy nói anh ấy đã đi rồi." } }
          - { level: B1, direct: { en: present perfect, uk: "Present Perfect", es: "presente perfecto", pt: "presente perfeito", fr: "present perfect", de: "Present Perfect", it: "present perfect", pl: "Present Perfect", tr: "Present Perfect", id: "present perfect", vi: "hiện tại hoàn thành" }, reported: { en: past perfect, uk: "Past Perfect", es: "pasado perfecto", pt: "passado perfeito", fr: "past perfect", de: "Past Perfect", it: "past perfect", pl: "Past Perfect", tr: "Past Perfect", id: "past perfect", vi: "quá khứ hoàn thành" }, ex: { mapping: [[“I, { target: "'ve finished" }, ".”"], ["She said she ", { target: had finished }, "."]] }, tr: { uk: "«Я закінчила». Вона сказала, що закінчила.", es: "«He terminado». Dijo que había terminado.", pt: "“Já terminei.” Ela disse que tinha terminado.", fr: "« J’ai fini. » Elle a dit qu’elle avait fini.", de: "„Ich bin fertig.“ Sie sagte, sie sei fertig.", it: "«Ho finito». Ha detto che aveva finito.", pl: "„Skończyłam.” Powiedziała, że skończyła.", tr: "“Bitirdim.” Bitirdiğini söyledi.", id: "“Saya sudah selesai.” Dia berkata bahwa dia sudah selesai.", vi: "“Tôi đã làm xong.” Cô ấy nói cô ấy đã làm xong." } }
          - { level: B1, direct: will, reported: would, ex: { mapping: [[“I, { target: "'ll call" }, ".”"], ["He said he ", { target: would call }, "."]] }, tr: { uk: "«Я зателефоную». Він сказав, що зателефонує.", es: "«Llamaré». Dijo que llamaría.", pt: "“Vou ligar.” Ele disse que ligaria.", fr: "« J’appellerai. » Il a dit qu’il appellerait.", de: "„Ich rufe an.“ Er sagte, er werde anrufen.", it: "«Chiamerò». Ha detto che avrebbe chiamato.", pl: "„Zadzwonię.” Powiedział, że zadzwoni.", tr: "“Arayacağım.” Arayacağını söyledi.", id: "“Saya akan menelepon.” Dia berkata bahwa dia akan menelepon.", vi: "“Tôi sẽ gọi.” Anh ấy nói anh ấy sẽ gọi." } }
          - { level: B1, direct: must, reported: had to, ex: { mapping: [["“I ", { target: must }, " go.”"], ["She said she ", { target: had to }, " go."]] }, tr: { uk: "«Мені треба йти». Вона сказала, що їй треба йти.", es: "«Debo irme». Dijo que tenía que irse.", pt: "“Preciso ir.” Ela disse que precisava ir.", fr: "« Je dois partir. » Elle a dit qu’elle devait partir.", de: "„Ich muss gehen.“ Sie sagte, sie müsse gehen.", it: "«Devo andare». Ha detto che doveva andare.", pl: "„Muszę iść.” Powiedziała, że musi iść.", tr: "“Gitmem gerekiyor.” Gitmesi gerektiğini söyledi.", id: "“Saya harus pergi.” Dia berkata bahwa dia harus pergi.", vi: "“Tôi phải đi.” Cô ấy nói cô ấy phải đi." } }
          - { level: B1, direct: can, reported: could, ex: { mapping: [["“I ", { target: can }, " swim.”"], ["She said she ", { target: could }, " swim."]] }, tr: { uk: "«Я вмію плавати». Вона сказала, що вміє плавати.", es: "«Sé nadar». Dijo que sabía nadar.", pt: "“Sei nadar.” Ela disse que sabia nadar.", fr: "« Je sais nager. » Elle a dit qu’elle savait nager.", de: "„Ich kann schwimmen.“ Sie sagte, sie könne schwimmen.", it: "«So nuotare». Ha detto che sapeva nuotare.", pl: "„Umiem pływać.” Powiedziała, że umie pływać.", tr: "“Yüzebilirim.” Yüzebildiğini söyledi.", id: "“Saya bisa berenang.” Dia berkata bahwa dia bisa berenang.", vi: "“Tôi biết bơi.” Cô ấy nói cô ấy biết bơi." } }
          - { level: B2, direct: may, reported: might, ex: { mapping: [["“I ", { target: may }, " join you.”"], ["She said she ", { target: might }, " join us."]] } }
          - { level: B2, direct: shall, reported: should, ex: { mapping: [["“", { target: Shall }, " I open the window?”"], ["He asked if he ", { target: should }, " open the window."]] } }
          - { level: B2, direct: { en: [{ term: must }, " (certainty)"] }, reported: must, ex: { mapping: [["“He ", { target: must }, " be ill.”"], ["She said he ", { target: must }, " be ill."]] } }
          - { level: B2, direct: ought to, reported: ought to, ex: { mapping: [["“You ", { target: ought to }, " rest.”"], ["She told me I ", { target: ought to }, " rest."]] } }
          - { level: B2, direct: { en: past perfect }, reported: { en: past perfect }, ex: { mapping: [["“I ", { target: had finished }, " early.”"], ["He said he ", { target: had finished }, " early."]] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: would }, ", ", { term: could }, ", ", { term: should }, " and ", { term: might }, " stay the same."]
              uk: [{ term: would }, ", ", { term: could }, ", ", { term: should }, " і ", { term: might }, " не змінюються."]
              es: [{ term: would }, ", ", { term: could }, ", ", { term: should }, " y ", { term: might }, " no cambian."]
              pt: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " e ", { term: "might" }, " não mudam."]
              fr: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " et ", { term: "might" }, " ne changent pas."]
              de: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " und ", { term: "might" }, " bleiben gleich."]
              it: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " e ", { term: "might" }, " non cambiano."]
              pl: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " i ", { term: "might" }, " nie zmieniają się."]
              tr: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " ve ", { term: "might" }, " değişmez."]
              id: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " dan ", { term: "might" }, " tidak berubah."]
              vi: [{ term: "would" }, ", ", { term: "could" }, ", ", { term: "should" }, " và ", { term: "might" }, " giữ nguyên."]
          - type: rule
            level: B1
            text:
              en: "The tense can stay when the fact is still true:"
              uk: "Час може не змінюватися, якщо факт досі правдивий:"
              es: "El tiempo puede quedarse igual si el hecho sigue siendo cierto:"
              pt: "O tempo verbal pode ficar igual quando o fato continua verdadeiro:"
              fr: "Le temps peut rester le même si le fait est toujours vrai :"
              de: "Die Zeitform kann bleiben, wenn die Tatsache weiterhin zutrifft:"
              it: "Il tempo può restare invariato se il fatto è ancora vero:"
              pl: "Czas może się nie zmieniać, jeśli fakt jest nadal prawdziwy:"
              tr: "Gerçek hâlâ doğruysa zaman değişmeyebilir:"
              id: "Tense boleh tetap sama jika faktanya masih benar:"
              vi: "Thì có thể giữ nguyên khi sự thật vẫn còn đúng:"
            ex: ["She said she ", { target: lives }, " in Paris."]
            tr: { uk: "Вона сказала, що живе в Парижі.", es: "Dijo que vive en París.", pt: "Ela disse que mora em Paris.", fr: "Elle a dit qu’elle habite à Paris.", de: "Sie sagte, sie wohne in Paris.", it: "Ha detto che vive a Parigi.", pl: "Powiedziała, że mieszka w Paryżu.", tr: "Paris’te yaşadığını söyledi.", id: "Dia berkata bahwa dia tinggal di Paris.", vi: "Cô ấy nói cô ấy sống ở Paris." }
          - type: rule
            level: B1
            text:
              en: ["After ", { term: says }, " (present) the tense stays:"]
              uk: ["Після ", { term: says }, " (теперішній час) дієслово не змінює форму:"]
              es: ["Después de ", { term: says }, " (presente) el tiempo no cambia:"]
              pt: ["Depois de ", { term: "says" }, " (presente), o tempo verbal não muda:"]
              fr: ["Après ", { term: "says" }, " (présent), le temps ne change pas :"]
              de: ["Nach ", { term: "says" }, " (Gegenwart) bleibt die Zeitform:"]
              it: ["Dopo ", { term: "says" }, " (presente) il tempo non cambia:"]
              pl: ["Po ", { term: "says" }, " (czas teraźniejszy) czas się nie zmienia:"]
              tr: [{ term: "says" }, " (şimdiki zaman) sonrasında zaman değişmez:"]
              id: ["Setelah ", { term: "says" }, " (present), tense tetap sama:"]
              vi: ["Sau ", { term: "says" }, " (hiện tại), thì giữ nguyên:"]
            ex: ["She says she ", { target: is }, " tired."]
            tr: { uk: "Вона каже, що втомилася.", es: "Dice que está cansada.", pt: "Ela diz que está cansada.", fr: "Elle dit qu’elle est fatiguée.", de: "Sie sagt, sie sei müde.", it: "Dice che è stanca.", pl: "Mówi, że jest zmęczona.", tr: "Yorgun olduğunu söylüyor.", id: "Dia bilang dia lelah.", vi: "Cô ấy nói cô ấy đang mệt." }
          - type: rule
            level: B2
            text: { en: "After a present perfect reporting verb the tense stays:" }
            ex: ["She has told me she ", { target: is }, " leaving."]

  - title: { en: "Flexible backshift" }
    role: form
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, rule: { en: "The tense stays when the report follows at once." }, ex: ["Tom has just rung. He said he ", { target: is }, " on his way."] }
          - { level: C1, rule: { en: "The past simple can stay when the sentence gives the time." }, ex: { equivalence: [["She said she ", { target: left }, " at six."], ["She said she ", { target: had left }, " at six."]] } }
          - { level: C1, rule: { en: "Unreal conditionals stay unchanged." }, ex: { mapping: [["“If I ", { target: were }, " rich, I ", { target: would }, " retire.”"], ["He said that if he ", { target: were }, " rich, he ", { target: would }, " retire."]] } }
          - { level: C1, rule: { en: "Thoughts and perceptions are reported like speech, with the same backshift." }, ex: { examples: [["He ", { target: thought that }, " the shop was open."], ["She ", { target: realised that }, " she had lost her keys."], ["I ", { target: wondered whether }, " you were free."]] } }
          - { level: C1, rule: { en: ["One reporting verb can open several clauses; ", { term: and that }, " links them."] }, ex: ["He said he had finished ", { target: and that }, " he would call."] }

  - title: { en: "Form: pronouns and time words", uk: "Форма: займенники й слова на позначення часу", es: "Forma: pronombres y expresiones de tiempo", pt: "Forma: pronomes e expressões de tempo", fr: "Forme : pronoms et expressions de temps", de: "Form: Pronomen und Zeitangaben", it: "Forma: pronomi ed espressioni di tempo", pl: "Forma: zaimki i określenia czasu", tr: "Biçim: zamirler ve zaman sözcükleri", id: "Bentuk: kata ganti dan keterangan waktu", vi: "Dạng: đại từ và từ chỉ thời gian" }
    role: form
