        - { level: C1, point: { en: "Wish about the past", uk: "Бажання про минуле", es: "Deseo sobre el pasado", pt: "Desejo sobre o passado", fr: "Souhait sur le passé", de: "Wunsch über die Vergangenheit", it: "Desiderio sul passato", pl: "Życzenie o przeszłości", tr: "Geçmişle ilgili dilek", id: "Keinginan tentang masa lalu", vi: "Điều ước về quá khứ" }, rule: { en: [{ term: "could have" }, " for a missed chance; ", { term: "had been" }, " + V-ing for an activity"], uk: [{ term: "could have" }, " — для втраченої можливості; ", { term: "had been" }, " + V-ing — для дії, що тривала"], es: [{ term: "could have" }, " para una oportunidad perdida; ", { term: "had been" }, " + V-ing para una actividad"], pt: [{ term: "could have" }, " para uma chance perdida; ", { term: "had been" }, " + V-ing para uma atividade"], fr: [{ term: "could have" }, " pour une occasion manquée ; ", { term: "had been" }, " + V-ing pour une activité"], de: [{ term: "could have" }, " für eine verpasste Gelegenheit; ", { term: "had been" }, " + V-ing für eine Tätigkeit"], it: [{ term: "could have" }, " per un'occasione mancata; ", { term: "had been" }, " + V-ing per un'attività"], pl: [{ term: "could have" }, " dla straconej okazji; ", { term: "had been" }, " + V-ing dla czynności"], tr: [{ term: "could have" }, " kaçırılan fırsat için; ", { term: "had been" }, " + V-ing bir eylem için"], id: [{ term: "could have" }, " untuk kesempatan yang terlewat; ", { term: "had been" }, " + V-ing untuk suatu kegiatan"], vi: [{ term: "could have" }, " cho cơ hội đã lỡ; ", { term: "had been" }, " + V-ing cho một hoạt động"] }, ex: { examples: [["I wish I ", { target: "could have come" }, "."], ["I wish I ", { target: "hadn't been working" }, " so hard."]] }, tr: { uk: { examples: ["Шкода, що я не зміг прийти.", "Шкода, що я так важко працював."] }, es: { examples: ["Ojalá hubiera podido venir.", "Ojalá no hubiera estado trabajando tanto."] }, pt: { examples: ["Eu queria ter podido vir.", "Eu queria não ter trabalhado tanto."] }, fr: { examples: ["J’aurais aimé pouvoir venir.", "J’aurais aimé ne pas avoir travaillé autant."] }, de: { examples: ["Ich wünschte, ich hätte kommen können.", "Ich wünschte, ich hätte nicht so viel gearbeitet."] }, it: { examples: ["Vorrei aver potuto venire.", "Vorrei non aver lavorato così tanto."] }, pl: { examples: ["Szkoda, że nie mogłem przyjść.", "Szkoda, że tak ciężko pracowałem."] }, tr: { examples: ["Keşke gelebilseydim.", "Keşke o kadar çok çalışmasaydım."] }, id: { examples: ["Andai saja saya bisa datang.", "Andai saja saya tidak bekerja sekeras itu."] }, vi: { examples: ["Ước gì tôi đã có thể đến.", "Ước gì tôi đã không làm việc vất vả như vậy."] } } }
        - { level: C1, point: { en: "In reports", uk: "У непрямій мові", es: "En el estilo indirecto", pt: "No discurso indireto", fr: "Au discours indirect", de: "In der indirekten Rede", it: "Nel discorso indiretto", pl: "W mowie zależnej", tr: "Dolaylı anlatımda", id: "Dalam kalimat tak langsung", vi: "Trong câu gián tiếp" }, rule: { en: [{ term: wish }, " becomes ", { term: wished }, "; the unreal tense stays"], uk: [{ term: "wish" }, " стає ", { term: "wished" }, "; нереальний час лишається"], es: [{ term: "wish" }, " pasa a ", { term: "wished" }, "; el tiempo irreal no cambia"], pt: [{ term: "wish" }, " vira ", { term: "wished" }, "; o tempo irreal não muda"], fr: [{ term: "wish" }, " devient ", { term: "wished" }, " ; le temps irréel ne change pas"], de: [{ term: "wish" }, " wird zu ", { term: "wished" }, "; die irreale Zeitform bleibt"], it: [{ term: "wish" }, " diventa ", { term: "wished" }, "; il tempo irreale resta"], pl: [{ term: "wish" }, " zmienia się w ", { term: "wished" }, "; czas nierealny zostaje"], tr: [{ term: "wish" }, " fiili ", { term: "wished" }, " olur; gerçek dışı zaman değişmez"], id: [{ term: "wish" }, " menjadi ", { term: "wished" }, "; tense tidak nyata tetap"], vi: [{ term: "wish" }, " thành ", { term: "wished" }, "; thì không có thật giữ nguyên"] }, ex: ["He said he ", { target: "wished he had" }, " more time."], tr: { uk: "Він сказав, що хотів би мати більше часу.", es: "Dijo que ojalá tuviera más tiempo.", pt: "Ele disse que queria ter mais tempo.", fr: "Il a dit qu’il aimerait avoir plus de temps.", de: "Er sagte, er wünschte, er hätte mehr Zeit.", it: "Ha detto che avrebbe voluto avere più tempo.", pl: "Powiedział, że chciałby mieć więcej czasu.", tr: "Daha fazla zamanı olmasını dilediğini söyledi.", id: "Dia bilang dia berharap punya lebih banyak waktu.", vi: "Anh ấy nói rằng anh ấy ước mình có thêm thời gian." } }
        - { level: C1, point: { en: "Formal wish", uk: "Офіційне бажання", es: "Deseo formal", pt: "Desejo formal", fr: "Souhait formel", de: "Förmlicher Wunsch", it: "Desiderio formale", pl: "Życzenie formalne", tr: "Resmî dilek", id: "Keinginan formal", vi: "Điều ước trang trọng" }, rule: { en: [{ term: "wish for" }, " + noun; ", { term: wish }, " (that) + clause with ", { term: were }], uk: [{ term: "wish for" }, " + іменник; ", { term: "wish" }, " (that) + речення з ", { term: "were" }], es: [{ term: "wish for" }, " + sustantivo; ", { term: "wish" }, " (that) + oración con ", { term: "were" }], pt: [{ term: "wish for" }, " + substantivo; ", { term: "wish" }, " (that) + oração com ", { term: "were" }], fr: [{ term: "wish for" }, " + nom ; ", { term: "wish" }, " (that) + proposition avec ", { term: "were" }], de: [{ term: "wish for" }, " + Nomen; ", { term: "wish" }, " (that) + Satz mit ", { term: "were" }], it: [{ term: "wish for" }, " + sostantivo; ", { term: "wish" }, " (that) + proposizione con ", { term: "were" }], pl: [{ term: "wish for" }, " + rzeczownik; ", { term: "wish" }, " (that) + zdanie z ", { term: "were" }], tr: [{ term: "wish for" }, " + isim; ", { term: "wish" }, " (that) + ", { term: "were" }, " içeren cümle"], id: [{ term: "wish for" }, " + kata benda; ", { term: "wish" }, " (that) + klausa dengan ", { term: "were" }], vi: [{ term: "wish for" }, " + danh từ; ", { term: "wish" }, " (that) + mệnh đề có ", { term: "were" }] }, ex: ["I wish that he ", { target: were }, " here."], tr: { uk: "Хотів би я, щоб він був тут.", es: "Ojalá que él estuviera aquí.", pt: "Eu queria que ele estivesse aqui.", fr: "J’aimerais qu’il soit ici.", de: "Ich wünschte, er wäre hier.", it: "Vorrei che fosse qui.", pl: "Chciałbym, żeby tu był.", tr: "Keşke burada olsa.", id: "Andai saja dia ada di sini.", vi: "Ước gì anh ấy ở đây." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["a state takes the past simple, not ", { term: would }], uk: ["стан вимагає Past Simple, а не ", { term: "would" }], es: ["un estado lleva el pasado simple, no ", { term: "would" }], pt: ["um estado leva o passado simples, não ", { term: "would" }], fr: ["un état prend le prétérit simple, pas ", { term: "would" }], de: ["ein Zustand verlangt das Simple Past, nicht ", { term: "would" }], it: ["uno stato richiede il past simple, non ", { term: "would" }], pl: ["stan wymaga Past Simple, a nie ", { term: "would" }], tr: ["bir durum ", { term: "would" }, " değil, Simple Past alır"], id: ["keadaan memakai simple past, bukan ", { term: "would" }], vi: ["một trạng thái dùng quá khứ đơn, không dùng ", { term: "would" }] }, ex: ["I wish I ", { target: had }, " more time."], tr: { uk: "Хотів би я мати більше часу.", es: "Ojalá tuviera más tiempo.", pt: "Eu queria ter mais tempo.", fr: "J’aimerais avoir plus de temps.", de: "Ich wünschte, ich hätte mehr Zeit.", it: "Vorrei avere più tempo.", pl: "Chciałbym mieć więcej czasu.", tr: "Keşke daha fazla zamanım olsa.", id: "Andai saja saya punya lebih banyak waktu.", vi: "Ước gì tôi có nhiều thời gian hơn." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: "it's time" }, " + subject takes the past simple"], uk: ["після ", { term: "it's time" }, " + підмет стоїть Past Simple"], es: [{ term: "it's time" }, " + sujeto lleva el pasado simple"], pt: [{ term: "it's time" }, " + sujeito leva o passado simples"], fr: [{ term: "it's time" }, " + sujet prend le prétérit simple"], de: [{ term: "it's time" }, " + Subjekt verlangt das Simple Past"], it: [{ term: "it's time" }, " + soggetto richiede il past simple"], pl: [{ term: "it's time" }, " + podmiot wymaga Past Simple"], tr: [{ term: "it's time" }, " + özne Simple Past alır"], id: [{ term: "it's time" }, " + subjek memakai simple past"], vi: [{ term: "it's time" }, " + chủ ngữ dùng quá khứ đơn"] }, ex: ["It's time we ", { target: went }, "."], tr: { uk: "Нам час іти.", es: "Es hora de que nos vayamos.", pt: "É hora de a gente ir.", fr: "Il est temps que nous y allions.", de: "Es wird Zeit, dass wir gehen.", it: "È ora che andiamo.", pl: "Czas, żebyśmy poszli.", tr: "Gitme zamanı geldi.", id: "Sudah waktunya kita pergi.", vi: "Đã đến lúc chúng ta phải đi." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: wish }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " and ", { term: suppose }, " share one set of unreal tenses."], uk: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " і ", { term: "suppose" }, " мають спільний набір нереальних часів."], es: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " y ", { term: "suppose" }, " comparten un mismo conjunto de tiempos irreales."], pt: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " e ", { term: "suppose" }, " compartilham o mesmo conjunto de tempos irreais."], fr: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " et ", { term: "suppose" }, " partagent un même ensemble de temps irréels."], de: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " und ", { term: "suppose" }, " teilen sich dieselben irrealen Zeitformen."], it: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " e ", { term: "suppose" }, " condividono lo stesso insieme di tempi irreali."], pl: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " i ", { term: "suppose" }, " mają wspólny zestaw czasów nierealnych."], tr: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " ve ", { term: "suppose" }, " aynı gerçek dışı zamanları paylaşır."], id: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, ", dan ", { term: "suppose" }, " memakai satu set tenses tidak nyata yang sama."], vi: [{ term: "wish" }, ", ", { term: "if only" }, ", ", { term: "as if" }, ", ", { term: "it's time" }, ", ", { term: "would rather" }, " và ", { term: "suppose" }, " dùng chung một bộ thì không có thật."] }
          - type: rule
            level: B2
            text: { en: "A past tense after these words marks the situation as not real, and the time stays present or future.", uk: "Минулий час після цих слів показує, що ситуація нереальна; час дії лишається теперішнім або майбутнім.", es: "Un tiempo del pasado tras estas palabras marca la situación como irreal; el momento sigue siendo presente o futuro.", pt: "Um tempo do passado depois dessas palavras marca a situação como irreal; o momento continua presente ou futuro.", fr: "Un temps du passé après ces mots rend la situation irréelle ; le moment reste présent ou futur.", de: "Eine Vergangenheitsform nach diesen Wörtern macht die Situation irreal; die Zeit bleibt Gegenwart oder Zukunft.", it: "Un tempo passato dopo queste parole rende la situazione irreale; il momento resta presente o futuro.", pl: "Czas przeszły po tych słowach oznacza sytuację nierealną; moment pozostaje teraźniejszy lub przyszły.", tr: "Bu sözcüklerden sonra gelen geçmiş zaman biçimi durumu gerçek dışı yapar; zaman yine şimdi veya gelecektir.", id: "Bentuk lampau setelah kata-kata ini menandai situasi tidak nyata; waktunya tetap masa kini atau masa depan.", vi: "Thì quá khứ sau những từ này cho biết tình huống không có thật; thời gian vẫn là hiện tại hoặc tương lai." }
            ex: ["I wish I ", { target: lived }, " nearer the sea."]
            tr: { uk: "Хотів би я жити ближче до моря.", es: "Ojalá viviera más cerca del mar.", pt: "Eu queria morar mais perto do mar.", fr: "J’aimerais habiter plus près de la mer.", de: "Ich wünschte, ich wohnte näher am Meer.", it: "Vorrei abitare più vicino al mare.", pl: "Chciałbym mieszkać bliżej morza.", tr: "Keşke denize daha yakın otursam.", id: "Andai saja saya tinggal lebih dekat dengan laut.", vi: "Ước gì tôi sống gần biển hơn." }
          - type: note
            level: B2
            text: { en: ["Conditionals with ", { term: if }, " take the same tenses: see ", { link: "Conditionals", to: en.sentence-building.conditionals-0-1-2 }, "."], uk: ["Умовні речення з ", { term: "if" }, " мають ті самі часи: див. ", { link: "Умовні речення", to: en.sentence-building.conditionals-0-1-2 }, "."], es: ["Las condicionales con ", { term: "if" }, " llevan los mismos tiempos: ver ", { link: "Condicionales", to: en.sentence-building.conditionals-0-1-2 }, "."], pt: ["As condicionais com ", { term: "if" }, " usam os mesmos tempos: ver ", { link: "Condicionais", to: en.sentence-building.conditionals-0-1-2 }, "."], fr: ["Les phrases conditionnelles avec ", { term: "if" }, " prennent les mêmes temps : voir ", { link: "Phrases conditionnelles", to: en.sentence-building.conditionals-0-1-2 }, "."], de: ["Bedingungssätze mit ", { term: "if" }, " verlangen dieselben Zeitformen: siehe ", { link: "Bedingungssätze", to: en.sentence-building.conditionals-0-1-2 }, "."], it: ["Il periodo ipotetico con ", { term: "if" }, " usa gli stessi tempi: vedi ", { link: "Periodo ipotetico", to: en.sentence-building.conditionals-0-1-2 }, "."], pl: ["Zdania warunkowe z ", { term: "if" }, " mają te same czasy: zob. ", { link: "Zdania warunkowe", to: en.sentence-building.conditionals-0-1-2 }, "."], tr: [{ term: "if" }, " ile kurulan koşul cümleleri aynı zamanları alır: bkz. ", { link: "Koşul cümleleri", to: en.sentence-building.conditionals-0-1-2 }, "."], id: ["Kalimat conditional dengan ", { term: "if" }, " memakai tenses yang sama: lihat ", { link: "Kalimat conditional", to: en.sentence-building.conditionals-0-1-2 }, "."], vi: ["Câu điều kiện với ", { term: "if" }, " dùng cùng các thì: xem ", { link: "Câu điều kiện", to: en.sentence-building.conditionals-0-1-2 }, "."] }

  - title: { en: "Form: wish", uk: "Форма: wish", es: "Forma: wish", pt: "Forma: wish", fr: "Forme : wish", de: "Form: wish", it: "Forma: wish", pl: "Forma: wish", tr: "Biçim: wish", id: "Bentuk: wish", vi: "Dạng: wish" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: time, label: { en: Situation, uk: "Ситуація", es: "Situación", pt: "Situação", fr: "Situation", de: "Situation", it: "Situazione", pl: "Sytuacja", tr: "Durum", id: "Situasi", vi: "Tình huống" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, features: { tense: pst }, time: { en: "A present state", uk: "Теперішній стан", es: "Un estado presente", pt: "Um estado presente", fr: "Un état présent", de: "Ein gegenwärtiger Zustand", it: "Uno stato presente", pl: "Stan teraźniejszy", tr: "Şimdiki bir durum", id: "Keadaan saat ini", vi: "Một trạng thái hiện tại" }, pattern: { pattern: [wish, { slot: subject }, { slot: past simple }] }, ex: { ex: ["I wish I ", { target: knew }, " his name."], tr: { uk: "Хотів би я знати його ім’я.", es: "Ojalá supiera su nombre.", pt: "Eu queria saber o nome dele.", fr: "J’aimerais connaître son nom.", de: "Ich wünschte, ich wüsste seinen Namen.", it: "Vorrei sapere il suo nome.", pl: "Chciałbym znać jego imię.", tr: "Keşke adını bilsem.", id: "Andai saja saya tahu namanya.", vi: "Ước gì tôi biết tên anh ấy." } } }
          - { level: B2, features: { tense: pst }, time: { en: "A present state with be", uk: "Теперішній стан із be", es: "Un estado presente con be", pt: "Um estado presente com be", fr: "Un état présent avec be", de: "Ein gegenwärtiger Zustand mit be", it: "Uno stato presente con be", pl: "Stan teraźniejszy z be", tr: "be ile şimdiki bir durum", id: "Keadaan saat ini dengan be", vi: "Một trạng thái hiện tại với be" }, pattern: { pattern: [wish, { slot: subject }, { alternatives: [were, was] }] }, ex: { ex: ["I wish I ", { target: were }, " taller."], tr: { uk: "Хотів би я бути вищим.", es: "Ojalá fuera más alto.", pt: "Eu queria ser mais alto.", fr: "J’aimerais être plus grand.", de: "Ich wünschte, ich wäre größer.", it: "Vorrei essere più alto.", pl: "Chciałbym być wyższy.", tr: "Keşke daha uzun boylu olsam.", id: "Andai saja saya lebih tinggi.", vi: "Ước gì tôi cao hơn." } } }
