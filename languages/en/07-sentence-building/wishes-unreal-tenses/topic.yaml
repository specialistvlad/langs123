        rows:
          - { level: C1, direct: { ex: ["“I wish I ", { target: had }, " more time.”"], tr: { uk: "«Хотів би я мати більше часу.»", es: "«Ojalá tuviera más tiempo.»", pt: "“Eu queria ter mais tempo.”", fr: "« J’aimerais avoir plus de temps. »", de: "„Ich wünschte, ich hätte mehr Zeit.“", it: "«Vorrei avere più tempo.»", pl: "„Chciałbym mieć więcej czasu.”", tr: "“Keşke daha fazla zamanım olsa.”", id: "“Andai saja saya punya lebih banyak waktu.”", vi: "“Ước gì tôi có nhiều thời gian hơn.”" } }, reported: { ex: ["He said he ", { target: "wished he had" }, " more time."], tr: { uk: "Він сказав, що хотів би мати більше часу.", es: "Dijo que ojalá tuviera más tiempo.", pt: "Ele disse que queria ter mais tempo.", fr: "Il a dit qu’il aimerait avoir plus de temps.", de: "Er sagte, er wünschte, er hätte mehr Zeit.", it: "Ha detto che avrebbe voluto avere più tempo.", pl: "Powiedział, że chciałby mieć więcej czasu.", tr: "Daha fazla zamanı olmasını dilediğini söyledi.", id: "Dia bilang dia berharap punya lebih banyak waktu.", vi: "Anh ấy nói rằng anh ấy ước mình có thêm thời gian." } } }
          - { level: C1, direct: { ex: ["“I wish I ", { target: "had listened" }, ".”"], tr: { uk: "«Шкода, що я не послухав.»", es: "«Ojalá hubiera escuchado.»", pt: "“Eu queria ter escutado.”", fr: "« J’aurais aimé avoir écouté. »", de: "„Ich wünschte, ich hätte zugehört.“", it: "«Vorrei aver ascoltato.»", pl: "„Szkoda, że nie posłuchałem.”", tr: "“Keşke dinleseydim.”", id: "“Andai saja saya mau mendengarkan.”", vi: "“Ước gì tôi đã lắng nghe.”" } }, reported: { ex: ["She said she ", { target: "wished she had listened" }, "."], tr: { uk: "Вона сказала, що шкодує, що не послухала.", es: "Dijo que ojalá hubiera escuchado.", pt: "Ela disse que queria ter escutado.", fr: "Elle a dit qu’elle aurait aimé avoir écouté.", de: "Sie sagte, sie wünschte, sie hätte zugehört.", it: "Ha detto che avrebbe voluto aver ascoltato.", pl: "Powiedziała, że żałuje, że nie posłuchała.", tr: "Dinlemiş olmayı dilediğini söyledi.", id: "Dia bilang dia berharap dulu mendengarkan.", vi: "Cô ấy nói rằng cô ấy ước mình đã lắng nghe." } } }
          - { level: C1, direct: { ex: ["“I wish you ", { target: "would help" }, " me.”"], tr: { uk: "«Хотів би я, щоб ти мені допоміг.»", es: "«Ojalá me ayudaras.»", pt: "“Eu queria que você me ajudasse.”", fr: "« J’aimerais que tu m’aides. »", de: "„Ich wünschte, du würdest mir helfen.“", it: "«Vorrei che mi aiutassi.»", pl: "„Chciałbym, żebyś mi pomógł.”", tr: "“Keşke bana yardım etsen.”", id: "“Saya ingin kamu mau membantu saya.”", vi: "“Ước gì bạn giúp tôi.”" } }, reported: { ex: ["She said she ", { target: "wished I would help" }, " her."], tr: { uk: "Вона сказала, що хотіла б, щоб я їй допоміг.", es: "Dijo que ojalá la ayudara.", pt: "Ela disse que queria que eu a ajudasse.", fr: "Elle a dit qu’elle aimerait que je l’aide.", de: "Sie sagte, sie wünschte, ich würde ihr helfen.", it: "Ha detto che avrebbe voluto che l'aiutassi.", pl: "Powiedziała, że chciałaby, żebym jej pomógł.", tr: "Ona yardım etmemi dilediğini söyledi.", id: "Dia bilang dia ingin saya mau membantunya.", vi: "Cô ấy nói rằng cô ấy ước tôi giúp cô ấy." } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: wish }, " becomes ", { term: wished }, " after a past reporting verb, and the unreal tense after it stays."], uk: ["Після дієслова в минулому часі ", { term: "wish" }, " стає ", { term: "wished" }, ", а нереальний час після нього не змінюється."], es: ["Después de un verbo introductorio en pasado, ", { term: "wish" }, " pasa a ", { term: "wished" }, ", y el tiempo irreal que sigue no cambia."], pt: ["Depois de um verbo introdutório no passado, ", { term: "wish" }, " vira ", { term: "wished" }, ", e o tempo irreal que vem depois não muda."], fr: ["Après un verbe introducteur au passé, ", { term: "wish" }, " devient ", { term: "wished" }, ", et le temps irréel qui suit ne change pas."], de: ["Nach einem einleitenden Verb in der Vergangenheit wird ", { term: "wish" }, " zu ", { term: "wished" }, ", und die irreale Zeitform danach bleibt."], it: ["Dopo un verbo introduttivo al passato, ", { term: "wish" }, " diventa ", { term: "wished" }, " e il tempo irreale che segue resta uguale."], pl: ["Po czasowniku wprowadzającym w czasie przeszłym ", { term: "wish" }, " zmienia się w ", { term: "wished" }, ", a czas nierealny po nim zostaje."], tr: ["Geçmiş zamanlı aktarma fiilinden sonra ", { term: "wish" }, " fiili ", { term: "wished" }, " olur; ondan sonraki gerçek dışı zaman değişmez."], id: ["Setelah kata kerja pelapor dalam bentuk past, ", { term: "wish" }, " menjadi ", { term: "wished" }, ", dan tense tidak nyata sesudahnya tetap."], vi: ["Sau động từ tường thuật ở quá khứ, ", { term: "wish" }, " thành ", { term: "wished" }, ", và thì không có thật theo sau giữ nguyên."] }
