          - { level: B2, pattern: { pattern: [{ slot: subject }, would rather, { slot: person }, didn't, { slot: base verb }] }, use: { en: "A preference against", uk: "Перевага: щоб чогось не робили", es: "Una preferencia de que no se haga algo", pt: "Uma preferência de que algo não seja feito", fr: "Une préférence pour que quelque chose ne soit pas fait", de: "Eine Vorliebe dafür, dass etwas nicht geschieht", it: "Una preferenza perché qualcosa non venga fatto", pl: "Preferencja, by czegoś nie robiono", tr: "Bir şeyin yapılmamasını tercih etme", id: "Preferensi agar sesuatu tidak dilakukan", vi: "Một sự ưa thích là đừng làm điều gì" }, ex: ["I'd rather you ", { target: "didn't smoke" }, "."], tr: { uk: "Я б волів, щоб ти не курив.", es: "Preferiría que no fumaras.", pt: "Eu preferiria que você não fumasse.", fr: "Je préférerais que tu ne fumes pas.", de: "Es wäre mir lieber, du würdest nicht rauchen.", it: "Preferirei che non fumassi.", pl: "Wolałbym, żebyś nie palił.", tr: "Sigara içmemeni tercih ederim.", id: "Saya lebih suka kamu tidak merokok.", vi: "Tôi thích bạn đừng hút thuốc hơn." } }
          - { level: B2, pattern: { pattern: [{ slot: subject }, would rather, { slot: person }, had, { slot: past participle }] }, use: { en: "A preference about the past", uk: "Перевага щодо минулого", es: "Una preferencia sobre el pasado", pt: "Uma preferência sobre o passado", fr: "Une préférence sur le passé", de: "Eine Vorliebe in Bezug auf die Vergangenheit", it: "Una preferenza sul passato", pl: "Preferencja dotycząca przeszłości", tr: "Geçmişle ilgili bir tercih", id: "Preferensi tentang masa lalu", vi: "Một sự ưa thích về quá khứ" }, ex: ["I'd rather you ", { target: "had told" }, " me."], tr: { uk: "Я б волів, щоб ти мені сказав.", es: "Hubiera preferido que me lo dijeras.", pt: "Eu preferiria que você tivesse me contado.", fr: "J’aurais préféré que tu me le dises.", de: "Es wäre mir lieber gewesen, du hättest es mir gesagt.", it: "Avrei preferito che tu me l'avessi detto.", pl: "Wolałbym, żebyś mi powiedział.", tr: "Bana söylemiş olmanı tercih ederdim.", id: "Saya lebih suka kalau kamu sudah memberi tahu saya.", vi: "Tôi thích bạn đã nói với tôi hơn." } }
          - { level: C1, pattern: { pattern: [{ slot: subject }, would sooner, { slot: person }, { slot: past simple }] }, use: { en: "The same as would rather, a little more formal", uk: "Те саме, що would rather, але трохи офіційніше", es: "Igual que would rather, un poco más formal", pt: "O mesmo que would rather, um pouco mais formal", fr: "Comme would rather, un peu plus formel", de: "Wie would rather, etwas förmlicher", it: "Come would rather, un po' più formale", pl: "To samo co would rather, nieco bardziej formalne", tr: "would rather ile aynı, biraz daha resmî", id: "Sama seperti would rather, sedikit lebih formal", vi: "Giống would rather, trang trọng hơn một chút" }, ex: ["I'd sooner you ", { target: waited }, " outside."], tr: { uk: "Я б краще хотів, щоб ти почекав надворі.", es: "Preferiría que esperaras afuera.", pt: "Eu preferiria que você esperasse lá fora.", fr: "Je préférerais que tu attendes dehors.", de: "Es wäre mir lieber, du würdest draußen warten.", it: "Preferirei che aspettassi fuori.", pl: "Wolałbym, żebyś poczekał na zewnątrz.", tr: "Dışarıda beklemeni tercih ederim.", id: "Saya lebih suka kamu menunggu di luar.", vi: "Tôi thích bạn đợi ở bên ngoài hơn." } }
