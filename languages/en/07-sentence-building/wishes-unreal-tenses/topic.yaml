        rows:
          - { level: B2, pattern: { pattern: [{ alternatives: ["as if", "as though"] }, { slot: subject }, { slot: past simple }] }, use: { en: "An unreal present: the speaker does not think it is true", uk: "Нереальне теперішнє: мовець не вважає це правдою", es: "Un presente irreal: el hablante no cree que sea verdad", pt: "Um presente irreal: quem fala não acredita que seja verdade", fr: "Un présent irréel : le locuteur ne pense pas que ce soit vrai", de: "Eine irreale Gegenwart: Der Sprecher hält es nicht für wahr", it: "Un presente irreale: chi parla non crede che sia vero", pl: "Nierealna teraźniejszość: mówiący nie uważa tego za prawdę", tr: "Gerçek dışı şimdiki zaman: konuşan bunun doğru olduğunu düşünmez", id: "Masa kini yang tidak nyata: pembicara tidak menganggapnya benar", vi: "Hiện tại không có thật: người nói không cho là đúng" }, ex: ["He talks as if he ", { target: knew }, " everything."], tr: { uk: "Він говорить так, ніби все знає.", es: "Habla como si lo supiera todo.", pt: "Ele fala como se soubesse de tudo.", fr: "Il parle comme s’il savait tout.", de: "Er redet, als ob er alles wüsste.", it: "Parla come se sapesse tutto.", pl: "Mówi tak, jakby wszystko wiedział.", tr: "Her şeyi biliyormuş gibi konuşuyor.", id: "Dia berbicara seolah-olah dia tahu segalanya.", vi: "Anh ấy nói như thể biết tất cả mọi thứ." } }
          - { level: B2, pattern: { pattern: [{ alternatives: ["as if", "as though"] }, { slot: subject }, had, { slot: past participle }] }, use: { en: "An unreal past", uk: "Нереальне минуле", es: "Un pasado irreal", pt: "Um passado irreal", fr: "Un passé irréel", de: "Eine irreale Vergangenheit", it: "Un passato irreale", pl: "Nierealna przeszłość", tr: "Gerçek dışı geçmiş", id: "Masa lalu yang tidak nyata", vi: "Quá khứ không có thật" }, ex: ["She looked as though she ", { target: "had seen" }, " a ghost."], tr: { uk: "Вона виглядала так, ніби побачила привида.", es: "Parecía como si hubiera visto un fantasma.", pt: "Ela parecia ter visto um fantasma.", fr: "On aurait dit qu’elle avait vu un fantôme.", de: "Sie sah aus, als hätte sie ein Gespenst gesehen.", it: "Sembrava che avesse visto un fantasma.", pl: "Wyglądała, jakby zobaczyła ducha.", tr: "Sanki hayalet görmüş gibi görünüyordu.", id: "Dia tampak seolah-olah baru saja melihat hantu.", vi: "Cô ấy trông như thể vừa nhìn thấy ma." } }
          - { level: B2, pattern: { pattern: [{ alternatives: ["as if", "as though"] }, { slot: subject }, { slot: present }] }, use: { en: "A real possibility: the speaker thinks it may be true", uk: "Реальна можливість: мовець думає, що це може бути правдою", es: "Una posibilidad real: el hablante cree que puede ser verdad", pt: "Uma possibilidade real: quem fala acha que pode ser verdade", fr: "Une possibilité réelle : le locuteur pense que c’est peut-être vrai", de: "Eine reale Möglichkeit: Der Sprecher hält es für möglicherweise wahr", it: "Una possibilità reale: chi parla pensa che possa essere vero", pl: "Realna możliwość: mówiący uważa, że może to być prawda", tr: "Gerçek bir olasılık: konuşan bunun doğru olabileceğini düşünür", id: "Kemungkinan nyata: pembicara mengira hal itu mungkin benar", vi: "Một khả năng có thật: người nói nghĩ điều đó có thể đúng" }, ex: { examples: [["It looks as if it ", { target: "is going to rain" }, "."], ["She sounds as though she ", { target: "has" }, " a cold."]] }, tr: { uk: { examples: ["Здається, збирається на дощ.", "Судячи з голосу, вона застудилася."] }, es: { examples: ["Parece que va a llover.", "Por la voz, parece que está resfriada."] }, pt: { examples: ["Parece que vai chover.", "Pela voz, ela parece estar resfriada."] }, fr: { examples: ["On dirait qu’il va pleuvoir.", "On dirait qu’elle est enrhumée."] }, de: { examples: ["Es sieht so aus, als würde es regnen.", "Sie klingt, als hätte sie eine Erkältung."] }, it: { examples: ["Sembra che stia per piovere.", "Sembra che abbia il raffreddore."] }, pl: { examples: ["Wygląda na to, że będzie padać.", "Brzmi, jakby była przeziębiona."] }, tr: { examples: ["Yağmur yağacak gibi görünüyor.", "Sesinden nezle olmuş gibi anlaşılıyor."] }, id: { examples: ["Sepertinya akan hujan.", "Suaranya terdengar seperti sedang pilek."] }, vi: { examples: ["Có vẻ trời sắp mưa.", "Nghe giọng có vẻ cô ấy bị cảm."] } } }
          - { level: C1, pattern: { pattern: [{ alternatives: ["as if", "as though"] }, { slot: subject }, were] }, use: { en: "An unreal present in formal style, for every person", uk: "Нереальне теперішнє в офіційному стилі, для всіх осіб", es: "Un presente irreal en estilo formal, para todas las personas", pt: "Um presente irreal no estilo formal, para todas as pessoas", fr: "Un présent irréel en style formel, pour toutes les personnes", de: "Eine irreale Gegenwart im förmlichen Stil, für alle Personen", it: "Un presente irreale in stile formale, per tutte le persone", pl: "Nierealna teraźniejszość w stylu formalnym, dla wszystkich osób", tr: "Resmî üslupta gerçek dışı şimdiki zaman, her özne için", id: "Masa kini yang tidak nyata dalam gaya formal, untuk semua orang", vi: "Hiện tại không có thật trong văn phong trang trọng, cho mọi ngôi" }, ex: ["He behaves as if he ", { target: were }, " the owner."], tr: { uk: "Він поводиться так, ніби він власник.", es: "Se comporta como si fuera el dueño.", pt: "Ele se comporta como se fosse o dono.", fr: "Il se comporte comme s’il était le propriétaire.", de: "Er benimmt sich, als wäre er der Besitzer.", it: "Si comporta come se fosse il proprietario.", pl: "Zachowuje się, jakby był właścicielem.", tr: "Sanki sahibiymiş gibi davranıyor.", id: "Dia bersikap seolah-olah dia pemiliknya.", vi: "Anh ấy cư xử như thể mình là chủ." } }
