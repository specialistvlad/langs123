            level: B2
            text: { en: ["With one subject, ", { term: "would rather" }, " takes the base verb: see ", { link: Would, to: en.modals.would }, "."], uk: ["З одним підметом ", { term: "would rather" }, " вимагає початкової форми: див. ", { link: "Would", to: en.modals.would }, "."], es: ["Con un solo sujeto, ", { term: "would rather" }, " lleva la forma base: ver ", { link: "Would", to: en.modals.would }, "."], pt: ["Com um só sujeito, ", { term: "would rather" }, " leva a forma base: ver ", { link: "Would", to: en.modals.would }, "."], fr: ["Avec un seul sujet, ", { term: "would rather" }, " prend la base verbale : voir ", { link: "Would", to: en.modals.would }, "."], de: ["Mit nur einem Subjekt steht nach ", { term: "would rather" }, " die Grundform: siehe ", { link: "Would", to: en.modals.would }, "."], it: ["Con un solo soggetto, ", { term: "would rather" }, " vuole la forma base: vedi ", { link: "Would", to: en.modals.would }, "."], pl: ["Przy jednym podmiocie ", { term: "would rather" }, " wymaga formy podstawowej: zob. ", { link: "Would", to: en.modals.would }, "."], tr: ["Tek özneyle ", { term: "would rather" }, " yalın fiil alır: bkz. ", { link: "Would", to: en.modals.would }, "."], id: ["Dengan satu subjek, ", { term: "would rather" }, " memakai kata kerja dasar: lihat ", { link: "Would", to: en.modals.would }, "."], vi: ["Với một chủ ngữ, ", { term: "would rather" }, " đi với động từ nguyên mẫu: xem ", { link: "Would", to: en.modals.would }, "."] }

  - title: { en: "Suppose, imagine and what if", uk: "Suppose, imagine і what if", es: "Suppose, imagine y what if", pt: "Suppose, imagine e what if", fr: "Suppose, imagine et what if", de: "Suppose, imagine und what if", it: "Suppose, imagine e what if", pl: "Suppose, imagine i what if", tr: "Suppose, imagine ve what if", id: "Suppose, imagine, dan what if", vi: "Suppose, imagine và what if" }
    role: own
