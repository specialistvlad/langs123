        rows:
          - { level: B2, pattern: { pattern: ["It's time", { slot: subject }, { slot: past simple }] }, use: { en: "The moment to act has come; the past simple means now", uk: "Настав час діяти; Past Simple тут вказує на теперішній момент", es: "Llegó el momento de actuar; el pasado simple significa ahora", pt: "Chegou a hora de agir; o passado simples significa agora", fr: "Le moment d’agir est venu ; le prétérit simple signifie maintenant", de: "Der Moment zu handeln ist da; das Simple Past meint jetzt", it: "È arrivato il momento di agire; il past simple significa ora", pl: "Nadszedł czas działania; Past Simple oznacza teraz", tr: "Harekete geçme zamanı geldi; Simple Past burada şimdi demektir", id: "Saatnya bertindak sudah tiba; simple past berarti sekarang", vi: "Đã đến lúc hành động; quá khứ đơn mang nghĩa bây giờ" }, ex: ["It's time we ", { target: left }, "."], tr: { uk: "Нам уже пора йти.", es: "Ya es hora de que nos vayamos.", pt: "Já é hora de a gente ir embora.", fr: "Il est temps que nous partions.", de: "Es ist Zeit, dass wir gehen.", it: "È ora che ce ne andiamo.", pl: "Pora, żebyśmy wyszli.", tr: "Artık gitme vaktimiz geldi.", id: "Sudah waktunya kita berangkat.", vi: "Đã đến lúc chúng ta rời đi rồi." } }
          - { level: B2, pattern: { pattern: [{ alternatives: ["It's high time", "It's about time"] }, { slot: subject }, { slot: past simple }] }, use: { en: "The action is overdue, and the speaker is impatient", uk: "Дія вже запізнилася, і мовець нетерплячий", es: "La acción ya se retrasó, y el hablante se impacienta", pt: "A ação está atrasada, e quem fala está impaciente", fr: "L’action est en retard, et le locuteur s’impatiente", de: "Die Handlung ist überfällig, und der Sprecher wird ungeduldig", it: "L'azione è in ritardo e chi parla è impaziente", pl: "Czynność jest spóźniona, a mówiący się niecierpliwi", tr: "Eylem gecikmiştir ve konuşan sabırsızdır", id: "Tindakan itu sudah terlambat, dan pembicara tidak sabar", vi: "Việc đó đã quá chậm, và người nói đang sốt ruột" }, ex: { examples: [["It's high time you ", { target: "went" }, " to bed."], ["It's about time you ", { target: called }, " her."]] }, tr: { uk: { examples: ["Тобі давно пора лягати спати.", "Тобі вже давно пора їй зателефонувати."] }, es: { examples: ["Ya es hora de que te vayas a la cama.", "Ya era hora de que la llamaras."] }, pt: { examples: ["Já passou da hora de você ir para a cama.", "Já estava na hora de você ligar para ela."] }, fr: { examples: ["Il est grand temps que tu ailles au lit.", "Il était temps que tu l’appelles."] }, de: { examples: ["Es ist höchste Zeit, dass du ins Bett gehst.", "Es wird auch Zeit, dass du sie anrufst."] }, it: { examples: ["È proprio ora che tu vada a letto.", "Era ora che la chiamassi."] }, pl: { examples: ["Najwyższy czas, żebyś poszedł spać.", "Już najwyższy czas, żebyś do niej zadzwonił."] }, tr: { examples: ["Yatağa gitme vaktin çoktan geldi.", "Onu arama vaktin çoktan geldi."] }, id: { examples: ["Sudah lewat waktunya kamu tidur.", "Sudah waktunya kamu meneleponnya sejak tadi."] }, vi: { examples: ["Đã quá giờ bạn đi ngủ rồi.", "Đã đến lúc bạn nên gọi cho cô ấy rồi."] } } }
          - { level: B2, pattern: { pattern: ["It's time to", { slot: base verb }] }, use: { en: "The moment has come; the doer is clear from the context", uk: "Настав час; хто діє, ясно з контексту", es: "Llegó el momento; quién actúa queda claro por el contexto", pt: "Chegou a hora; quem age fica claro pelo contexto", fr: "Le moment est venu ; l’acteur se comprend d’après le contexte", de: "Der Moment ist da; wer handelt, ergibt sich aus dem Kontext", it: "È arrivato il momento; chi agisce è chiaro dal contesto", pl: "Nadszedł czas; wykonawca wynika z kontekstu", tr: "Zaman geldi; eylemi kimin yapacağı bağlamdan anlaşılır", id: "Saatnya sudah tiba; pelakunya jelas dari konteks", vi: "Đã đến lúc; người làm việc đó rõ từ ngữ cảnh" }, ex: ["It's time ", { target: "to leave" }, "."], tr: { uk: "Пора йти.", es: "Es hora de irse.", pt: "É hora de ir embora.", fr: "Il est temps de partir.", de: "Es ist Zeit zu gehen.", it: "È ora di andare.", pl: "Czas wyjść.", tr: "Gitme zamanı.", id: "Sudah waktunya pergi.", vi: "Đã đến lúc đi." } }
          - { level: B2, pattern: { pattern: ["It's time for", { slot: person }, "to", { slot: base verb }] }, use: { en: "The moment has come for a named person, with no push", uk: "Настав час для названої особи, без натиску", es: "Llegó el momento para una persona concreta, sin presión", pt: "Chegou a hora para uma pessoa nomeada, sem pressão", fr: "Le moment est venu pour une personne nommée, sans pression", de: "Der Moment ist für eine genannte Person gekommen, ohne Druck", it: "È arrivato il momento per una persona indicata, senza pressione", pl: "Nadszedł czas dla wskazanej osoby, bez nacisku", tr: "Adı geçen kişi için zaman geldi, baskı yok", id: "Saatnya tiba bagi orang yang disebut, tanpa tekanan", vi: "Đã đến lúc cho một người được nêu tên, không thúc ép" }, ex: ["It's time ", { target: "for us to go" }, "."], tr: { uk: "Нам пора йти.", es: "Nos toca irnos.", pt: "Chegou a nossa hora de ir.", fr: "Il est temps pour nous de partir.", de: "Es ist Zeit für uns zu gehen.", it: "È ora per noi di andare.", pl: "Nam już czas iść.", tr: "Bizim gitme zamanımız geldi.", id: "Sudah waktunya bagi kita untuk pergi.", vi: "Đã đến lúc chúng ta đi." } }
          - { level: C1, pattern: { pattern: ["It's high time", { slot: subject }, had, { slot: past participle }] }, use: { en: "Rare: the action should already be done", uk: "Рідко: дія вже мала б бути виконана", es: "Poco frecuente: la acción ya debería estar hecha", pt: "Raro: a ação já deveria estar feita", fr: "Rare : l’action devrait déjà être faite", de: "Selten: Die Handlung sollte schon getan sein", it: "Raro: l'azione dovrebbe essere già fatta", pl: "Rzadkie: czynność powinna być już wykonana", tr: "Seyrek: eylem şimdiye kadar yapılmış olmalıdır", id: "Jarang: tindakan itu seharusnya sudah selesai", vi: "Hiếm: việc đó lẽ ra đã phải xong" }, ex: ["It's high time you ", { target: "had finished" }, " that report."], tr: { uk: "Тобі вже давно слід було закінчити той звіт.", es: "Ya es hora de que hayas terminado ese informe.", pt: "Já era hora de você ter terminado aquele relatório.", fr: "Il serait grand temps que tu aies fini ce rapport.", de: "Es wäre höchste Zeit, dass du den Bericht fertig hättest.", it: "Sarebbe ora che tu avessi finito quel rapporto.", pl: "Najwyższy czas, żebyś skończył ten raport.", tr: "O raporu çoktan bitirmiş olman gerekirdi.", id: "Sudah lama seharusnya kamu menyelesaikan laporan itu.", vi: "Lẽ ra bạn phải hoàn thành báo cáo đó từ lâu rồi." } }

  - title: { en: "As if and as though", uk: "As if і as though", es: "As if y as though", pt: "As if e as though", fr: "As if et as though", de: "As if und as though", it: "As if e as though", pl: "As if i as though", tr: "As if ve as though", id: "As if dan as though", vi: "As if và as though" }
