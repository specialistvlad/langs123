      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: were }, " serves every person in formal style, and ", { term: was }, " is common in speech."], uk: [{ term: "were" }, " підходить для всіх осіб в офіційному стилі, а ", { term: "was" }, " часто вживають у мовленні."], es: [{ term: "were" }, " sirve para todas las personas en estilo formal, y ", { term: "was" }, " es común al hablar."], pt: [{ term: "were" }, " serve para todas as pessoas no estilo formal, e ", { term: "was" }, " é comum na fala."], fr: [{ term: "were" }, " sert pour toutes les personnes dans le style formel, et ", { term: "was" }, " est courant à l’oral."], de: [{ term: "were" }, " gilt im förmlichen Stil für alle Personen, und ", { term: "was" }, " ist in der Alltagssprache üblich."], it: [{ term: "were" }, " vale per tutte le persone nello stile formale, e ", { term: "was" }, " è comune nel parlato."], pl: [{ term: "were" }, " pasuje do wszystkich osób w stylu formalnym, a ", { term: "was" }, " jest częste w mowie."], tr: [{ term: "were" }, " resmî üslupta her özneyle kullanılır, ", { term: "was" }, " ise konuşmada yaygındır."], id: [{ term: "were" }, " dipakai untuk semua orang dalam gaya formal, dan ", { term: "was" }, " umum dalam percakapan."], vi: [{ term: "were" }, " dùng cho mọi ngôi trong văn phong trang trọng, còn ", { term: "was" }, " phổ biến trong lời nói."] }
            ex: ["I wish she ", { alternatives: [{ target: were }, { target: was }] }, " here."]
            tr: { uk: "Хотів би я, щоб вона була тут.", es: "Ojalá ella estuviera aquí.", pt: "Eu queria que ela estivesse aqui.", fr: "J’aimerais qu’elle soit ici.", de: "Ich wünschte, sie wäre hier.", it: "Vorrei che fosse qui.", pl: "Chciałbym, żeby tu była.", tr: "Keşke burada olsa.", id: "Andai saja dia ada di sini.", vi: "Ước gì cô ấy ở đây." }
          - type: rule
            level: B2
            text: { en: "The negative takes didn't, hadn't, couldn't or wouldn't.", uk: "Заперечення утворюють із didn't, hadn't, couldn't або wouldn't.", es: "El negativo lleva didn't, hadn't, couldn't o wouldn't.", pt: "O negativo usa didn't, hadn't, couldn't ou wouldn't.", fr: "La négation se fait avec didn't, hadn't, couldn't ou wouldn't.", de: "Die Verneinung steht mit didn't, hadn't, couldn't oder wouldn't.", it: "La forma negativa usa didn't, hadn't, couldn't o wouldn't.", pl: "Przeczenie tworzy się z didn't, hadn't, couldn't lub wouldn't.", tr: "Olumsuz biçim didn't, hadn't, couldn't veya wouldn't ile kurulur.", id: "Bentuk negatif memakai didn't, hadn't, couldn't, atau wouldn't.", vi: "Dạng phủ định dùng didn't, hadn't, couldn't hoặc wouldn't." }
            ex: ["I wish I ", { target: "hadn't said" }, " that."]
            tr: { uk: "Шкода, що я це сказав.", es: "Ojalá no hubiera dicho eso.", pt: "Eu queria não ter dito isso.", fr: "J’aurais aimé ne pas avoir dit ça.", de: "Ich wünschte, ich hätte das nicht gesagt.", it: "Vorrei non averlo detto.", pl: "Szkoda, że to powiedziałem.", tr: "Keşke bunu söylemeseydim.", id: "Andai saja saya tidak mengatakan itu.", vi: "Ước gì tôi đã không nói điều đó." }

