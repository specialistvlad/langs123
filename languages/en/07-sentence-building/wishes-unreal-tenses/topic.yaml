          - { level: B2, use: { en: ["An ability or chance you lack (", { term: could }, ")"], uk: ["Здатність або можливість, якої бракує (", { term: "could" }, ")"], es: ["Una habilidad o una oportunidad que falta (", { term: "could" }, ")"], pt: ["Uma habilidade ou chance que falta (", { term: "could" }, ")"], fr: ["Une capacité ou une occasion qui manque (", { term: "could" }, ")"], de: ["Eine Fähigkeit oder Gelegenheit, die fehlt (", { term: "could" }, ")"], it: ["Una capacità o un'occasione che manca (", { term: "could" }, ")"], pl: ["Umiejętność lub okazja, której brakuje (", { term: "could" }, ")"], tr: ["Eksik olan bir yetenek ya da fırsat (", { term: "could" }, ")"], id: ["Kemampuan atau kesempatan yang tidak dimiliki (", { term: "could" }, ")"], vi: ["Một khả năng hay cơ hội mà bạn không có (", { term: "could" }, ")"] }, ex: { examples: [["I wish I ", { target: "could play" }, " the piano."], ["I wish we ", { target: "could stay" }, " longer."]] }, tr: { uk: { examples: ["Хотів би я вміти грати на піаніно.", "Шкода, що ми не можемо залишитися довше."] }, es: { examples: ["Ojalá pudiera tocar el piano.", "Ojalá pudiéramos quedarnos más tiempo."] }, pt: { examples: ["Eu queria saber tocar piano.", "Eu queria que a gente pudesse ficar mais tempo."] }, fr: { examples: ["J’aimerais savoir jouer du piano.", "J’aimerais que nous puissions rester plus longtemps."] }, de: { examples: ["Ich wünschte, ich könnte Klavier spielen.", "Ich wünschte, wir könnten länger bleiben."] }, it: { examples: ["Vorrei saper suonare il pianoforte.", "Vorrei che potessimo restare più a lungo."] }, pl: { examples: ["Chciałbym umieć grać na pianinie.", "Szkoda, że nie możemy zostać dłużej."] }, tr: { examples: ["Keşke piyano çalabilsem.", "Keşke daha uzun kalabilsek."] }, id: { examples: ["Andai saja saya bisa main piano.", "Andai saja kami bisa tinggal lebih lama."] }, vi: { examples: ["Ước gì tôi biết chơi piano.", "Ước gì chúng ta có thể ở lại lâu hơn."] } } }
          - { level: B2, use: { en: "A regret about the past (past perfect)", uk: "Жаль щодо минулого (Past Perfect)", es: "Un arrepentimiento por el pasado (pasado perfecto)", pt: "Um arrependimento sobre o passado (passado perfeito)", fr: "Un regret à propos du passé (past perfect)", de: "Ein Bedauern über die Vergangenheit (Past Perfect)", it: "Un rimpianto per il passato (past perfect)", pl: "Żal z powodu przeszłości (Past Perfect)", tr: "Geçmişle ilgili bir pişmanlık (Past Perfect)", id: "Penyesalan atas masa lalu (past perfect)", vi: "Sự nuối tiếc về quá khứ (quá khứ hoàn thành)" }, ex: { examples: [["I wish I ", { target: "had studied" }, " harder."], ["I wish we ", { target: "hadn't argued" }, "."]] }, tr: { uk: { examples: ["Шкода, що я не вчився старанніше.", "Шкода, що ми посварилися."] }, es: { examples: ["Ojalá hubiera estudiado más.", "Ojalá no hubiéramos discutido."] }, pt: { examples: ["Eu queria ter estudado mais.", "Eu queria que a gente não tivesse brigado."] }, fr: { examples: ["J’aurais aimé étudier davantage.", "J’aurais aimé que nous ne nous soyons pas disputés."] }, de: { examples: ["Ich wünschte, ich hätte mehr gelernt.", "Ich wünschte, wir hätten nicht gestritten."] }, it: { examples: ["Vorrei aver studiato di più.", "Vorrei che non avessimo litigato."] }, pl: { examples: ["Szkoda, że nie uczyłem się pilniej.", "Szkoda, że się pokłóciliśmy."] }, tr: { examples: ["Keşke daha çok çalışsaydım.", "Keşke kavga etmeseydik."] }, id: { examples: ["Andai saja saya belajar lebih giat.", "Andai saja kami tidak bertengkar."] }, vi: { examples: ["Ước gì tôi đã học chăm hơn.", "Ước gì chúng ta đã không cãi nhau."] } } }
          - { level: B2, use: { en: ["A change you want in a person's behaviour (", { term: would }, ")"], uk: ["Зміна в поведінці людини, якої хочеться (", { term: "would" }, ")"], es: ["Un cambio que se quiere en la conducta de una persona (", { term: "would" }, ")"], pt: ["Uma mudança desejada no comportamento de uma pessoa (", { term: "would" }, ")"], fr: ["Un changement souhaité dans le comportement de quelqu’un (", { term: "would" }, ")"], de: ["Eine gewünschte Veränderung im Verhalten einer Person (", { term: "would" }, ")"], it: ["Un cambiamento voluto nel comportamento di una persona (", { term: "would" }, ")"], pl: ["Zmiana w zachowaniu osoby, której się pragnie (", { term: "would" }, ")"], tr: ["Bir kişinin davranışında istenen değişiklik (", { term: "would" }, ")"], id: ["Perubahan perilaku seseorang yang diinginkan (", { term: "would" }, ")"], vi: ["Một thay đổi mà bạn muốn ở hành vi của một người (", { term: "would" }, ")"] }, ex: { examples: [["I wish you ", { target: "would listen" }, "."], ["I wish he ", { target: "would hurry" }, " up."]] }, tr: { uk: { examples: ["Хотів би я, щоб ти слухав.", "Хотів би я, щоб він поквапився."] }, es: { examples: ["Ojalá me escucharas.", "Ojalá se apurara."] }, pt: { examples: ["Eu queria que você escutasse.", "Eu queria que ele se apressasse."] }, fr: { examples: ["J’aimerais que tu écoutes.", "J’aimerais qu’il se dépêche."] }, de: { examples: ["Ich wünschte, du würdest zuhören.", "Ich wünschte, er würde sich beeilen."] }, it: { examples: ["Vorrei che mi ascoltassi.", "Vorrei che si sbrigasse."] }, pl: { examples: ["Chciałbym, żebyś słuchał.", "Chciałbym, żeby się pospieszył."] }, tr: { examples: ["Keşke dinlesen.", "Keşke acele etse."] }, id: { examples: ["Saya ingin kamu mau mendengarkan.", "Saya ingin dia lebih cepat."] }, vi: { examples: ["Ước gì bạn chịu lắng nghe.", "Ước gì anh ấy nhanh lên."] } } }
