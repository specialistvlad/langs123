            tr: { uk: "Ти отримав цю роботу? — Якби ж то!", es: "¿Conseguiste el trabajo? — ¡Ojalá!", pt: "Você conseguiu o emprego? — Quem dera!", fr: "Tu as eu le poste ? — Si seulement !", de: "Hast du die Stelle bekommen? — Schön wär's!", it: "Hai ottenuto il lavoro? — Magari!", pl: "Dostałeś tę pracę? — Gdyby tylko!", tr: "İşi aldın mı? — Keşke!", id: "Apakah kamu mendapat pekerjaan itu? — Andai saja!", vi: "Bạn có được công việc đó không? — Giá mà được!" }

  - title: { en: "It's time", uk: "It's time", es: "It's time", pt: "It's time", fr: "It's time", de: "It's time", it: "It's time", pl: "It's time", tr: "It's time", id: "It's time", vi: "It's time" }
