            text: { en: [{ term: "as though" }, " means the same as ", { term: "as if" }, " and is a little more formal."], uk: [{ term: "as though" }, " означає те саме, що й ", { term: "as if" }, ", але трохи офіційніше."], es: [{ term: "as though" }, " significa lo mismo que ", { term: "as if" }, " y es un poco más formal."], pt: [{ term: "as though" }, " significa o mesmo que ", { term: "as if" }, " e é um pouco mais formal."], fr: [{ term: "as though" }, " a le même sens que ", { term: "as if" }, " et il est un peu plus formel."], de: [{ term: "as though" }, " bedeutet dasselbe wie ", { term: "as if" }, " und ist etwas förmlicher."], it: [{ term: "as though" }, " significa come ", { term: "as if" }, " ed è un po' più formale."], pl: [{ term: "as though" }, " znaczy to samo co ", { term: "as if" }, " i jest nieco bardziej formalne."], tr: [{ term: "as though" }, ", ", { term: "as if" }, " ile aynı anlama gelir ve biraz daha resmîdir."], id: [{ term: "as though" }, " artinya sama dengan ", { term: "as if" }, " dan sedikit lebih formal."], vi: [{ term: "as though" }, " có nghĩa giống ", { term: "as if" }, " và trang trọng hơn một chút."] }

