        rows:
          - { level: B2, pattern: { pattern: [{ alternatives: [suppose, supposing] }, { slot: subject }, { slot: past simple }] }, use: { en: "An imagined, unlikely situation", uk: "Уявна, малоймовірна ситуація", es: "Una situación imaginada y poco probable", pt: "Uma situação imaginada e pouco provável", fr: "Une situation imaginée et peu probable", de: "Eine vorgestellte, unwahrscheinliche Situation", it: "Una situazione immaginata e poco probabile", pl: "Wyobrażona, mało prawdopodobna sytuacja", tr: "Hayal edilen, olası olmayan bir durum", id: "Situasi khayalan yang kecil kemungkinannya", vi: "Một tình huống tưởng tượng, khó xảy ra" }, ex: ["Suppose you ", { target: won }, " a million pounds. What would you do?"], tr: { uk: "Уяви, що ти виграв мільйон фунтів. Що б ти зробив?", es: "Supón que ganaras un millón de libras. ¿Qué harías?", pt: "Suponha que você ganhasse um milhão de libras. O que você faria?", fr: "Supposons que tu gagnes un million de livres. Que ferais-tu ?", de: "Angenommen, du würdest eine Million Pfund gewinnen. Was würdest du tun?", it: "Supponi di vincere un milione di sterline. Cosa faresti?", pl: "Załóżmy, że wygrywasz milion funtów. Co byś zrobił?", tr: "Diyelim ki bir milyon sterlin kazandın. Ne yapardın?", id: "Misalkan kamu menang satu juta pound. Apa yang akan kamu lakukan?", vi: "Giả sử bạn trúng một triệu bảng Anh. Bạn sẽ làm gì?" } }
          - { level: B2, pattern: { pattern: [{ alternatives: [suppose, supposing] }, { slot: subject }, had, { slot: past participle }] }, use: { en: "An imagined past situation", uk: "Уявна ситуація в минулому", es: "Una situación pasada imaginada", pt: "Uma situação passada imaginada", fr: "Une situation passée imaginée", de: "Eine vorgestellte Situation in der Vergangenheit", it: "Una situazione passata immaginata", pl: "Wyobrażona sytuacja z przeszłości", tr: "Geçmişte hayal edilen bir durum", id: "Situasi masa lalu yang dibayangkan", vi: "Một tình huống tưởng tượng trong quá khứ" }, ex: ["Supposing you ", { target: "had missed" }, " your train?"], tr: { uk: "А якби ти пропустив свій потяг?", es: "¿Y si hubieras perdido el tren?", pt: "E se você tivesse perdido o trem?", fr: "Et si tu avais raté ton train ?", de: "Angenommen, du hättest deinen Zug verpasst?", it: "E se avessi perso il treno?", pl: "A gdybyś spóźnił się na pociąg?", tr: "Ya trenini kaçırmış olsaydın?", id: "Bagaimana seandainya kamu ketinggalan kereta?", vi: "Giả sử bạn đã lỡ chuyến tàu thì sao?" } }
          - { level: B2, pattern: { pattern: [imagine, { slot: subject }, { slot: past simple }] }, use: { en: "An invitation to picture a situation", uk: "Запрошення уявити ситуацію", es: "Una invitación a imaginar una situación", pt: "Um convite para imaginar uma situação", fr: "Une invitation à se représenter une situation", de: "Eine Aufforderung, sich eine Situation vorzustellen", it: "Un invito a immaginare una situazione", pl: "Zaproszenie do wyobrażenia sobie sytuacji", tr: "Bir durumu hayal etmeye çağrı", id: "Ajakan untuk membayangkan suatu situasi", vi: "Lời mời hình dung một tình huống" }, ex: ["Imagine you ", { target: lived }, " on the moon."], tr: { uk: "Уяви, що ти живеш на Місяці.", es: "Imagina que vivieras en la luna.", pt: "Imagine que você morasse na lua.", fr: "Imagine que tu vives sur la Lune.", de: "Stell dir vor, du lebtest auf dem Mond.", it: "Immagina di vivere sulla luna.", pl: "Wyobraź sobie, że mieszkasz na Księżycu.", tr: "Ayda yaşadığını hayal et.", id: "Bayangkan kamu tinggal di bulan.", vi: "Hãy tưởng tượng bạn sống trên mặt trăng." } }
          - { level: B2, pattern: { pattern: ["what if", { slot: subject }, { slot: past simple }] }, use: { en: "An unlikely problem", uk: "Малоймовірна проблема", es: "Un problema poco probable", pt: "Um problema pouco provável", fr: "Un problème peu probable", de: "Ein unwahrscheinliches Problem", it: "Un problema poco probabile", pl: "Mało prawdopodobny problem", tr: "Olası olmayan bir sorun", id: "Masalah yang kecil kemungkinannya", vi: "Một vấn đề khó xảy ra" }, ex: ["What if nobody ", { target: came }, "?"], tr: { uk: "А що, як ніхто не прийде?", es: "¿Y si nadie viniera?", pt: "E se ninguém viesse?", fr: "Et si personne ne venait ?", de: "Und wenn niemand käme?", it: "E se non venisse nessuno?", pl: "A co, gdyby nikt nie przyszedł?", tr: "Ya kimse gelmezse?", id: "Bagaimana kalau tidak ada yang datang?", vi: "Lỡ không ai đến thì sao?" } }
          - { level: B2, pattern: { pattern: ["what if", { slot: subject }, { slot: present }] }, use: { en: "A real possibility that worries the speaker", uk: "Реальна можливість, що турбує мовця", es: "Una posibilidad real que preocupa al hablante", pt: "Uma possibilidade real que preocupa quem fala", fr: "Une possibilité réelle qui inquiète le locuteur", de: "Eine reale Möglichkeit, die den Sprecher beunruhigt", it: "Una possibilità reale che preoccupa chi parla", pl: "Realna możliwość, która niepokoi mówiącego", tr: "Konuşanı endişelendiren gerçek bir olasılık", id: "Kemungkinan nyata yang mengkhawatirkan pembicara", vi: "Một khả năng có thật khiến người nói lo lắng" }, ex: ["What if he ", { target: says }, " no?"], tr: { uk: "А що, як він скаже ні?", es: "¿Y si dice que no?", pt: "E se ele disser não?", fr: "Et s’il dit non ?", de: "Und wenn er nein sagt?", it: "E se dice di no?", pl: "A co, jeśli powie nie?", tr: "Ya hayır derse?", id: "Bagaimana kalau dia bilang tidak?", vi: "Lỡ anh ấy từ chối thì sao?" } }
          - { level: C1, pattern: { pattern: [say, { slot: subject }, { slot: past simple }] }, use: { en: "Informal: the same as suppose", uk: "Неформально: те саме, що suppose", es: "Informal: igual que suppose", pt: "Informal: o mesmo que suppose", fr: "Familier : comme suppose", de: "Umgangssprachlich: wie suppose", it: "Informale: come suppose", pl: "Potocznie: to samo co suppose", tr: "Gayriresmî: suppose ile aynı", id: "Informal: sama seperti suppose", vi: "Thân mật: giống suppose" }, ex: ["Say you ", { target: "had" }, " a million pounds. What would you do?"], tr: { uk: "Скажімо, у тебе є мільйон фунтів. Що б ти зробив?", es: "Digamos que tuvieras un millón de libras. ¿Qué harías?", pt: "Digamos que você tivesse um milhão de libras. O que faria?", fr: "Disons que tu aies un million de livres. Que ferais-tu ?", de: "Sagen wir, du hättest eine Million Pfund. Was würdest du tun?", it: "Mettiamo che tu avessi un milione di sterline. Cosa faresti?", pl: "Powiedzmy, że masz milion funtów. Co byś zrobił?", tr: "Diyelim ki bir milyon sterlinin var. Ne yapardın?", id: "Katakanlah kamu punya satu juta pound. Apa yang akan kamu lakukan?", vi: "Giả sử bạn có một triệu bảng Anh. Bạn sẽ làm gì?" } }

