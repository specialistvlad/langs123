            ex: { examples: [["He insists that she ", { target: go }, "."], ["He insisted that she ", { target: go }, "."]] }
            tr: { uk: { examples: ["Він наполягає, щоб вона пішла.", "Він наполягав, щоб вона пішла."] }, es: { examples: ["Él insiste en que ella vaya.", "Él insistió en que ella fuera."] }, pt: { examples: ["Ele insiste que ela vá.", "Ele insistiu que ela fosse."] }, fr: { examples: ["Il insiste pour qu’elle y aille.", "Il a insisté pour qu’elle y aille."] }, de: { examples: ["Er besteht darauf, dass sie geht.", "Er bestand darauf, dass sie ging."] }, it: { examples: ["Insiste perché lei vada.", "Ha insistito perché lei andasse."] }, pl: { examples: ["Nalega, żeby poszła.", "Nalegał, żeby poszła."] }, tr: { examples: ["Onun gitmesi için ısrar ediyor.", "Onun gitmesi için ısrar etti."] }, id: { examples: ["Dia bersikeras agar perempuan itu pergi.", "Dia sudah bersikeras agar perempuan itu pergi."] }, vi: { examples: ["Anh ấy khăng khăng bảo cô ấy phải đi.", "Anh ấy đã khăng khăng bảo cô ấy phải đi."] } }
