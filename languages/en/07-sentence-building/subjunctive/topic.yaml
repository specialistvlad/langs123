        rows:
          - { level: C2, use: { en: "A court order", uk: "Судовий наказ", es: "Una orden judicial", pt: "Uma ordem judicial", fr: "Une ordonnance du tribunal", de: "Ein Gerichtsbeschluss", it: "Un ordine del tribunale", pl: "Nakaz sądu", tr: "Mahkeme emri", id: "Perintah pengadilan", vi: "Lệnh của tòa án" }, ex: ["It is ordered that the defendant ", { target: appear }, " in person."], tr: { uk: "Постановляється, щоб відповідач з’явився особисто.", es: "Se ordena que el acusado comparezca en persona.", pt: "Ordena-se que o réu compareça pessoalmente.", fr: "Il est ordonné que le défendeur comparaisse en personne.", de: "Es wird angeordnet, dass der Beklagte persönlich erscheint.", it: "Si ordina che l'imputato compaia di persona.", pl: "Nakazuje się, aby pozwany stawił się osobiście.", tr: "Sanığın bizzat hazır bulunmasına karar verilmiştir.", id: "Diperintahkan agar terdakwa hadir secara langsung.", vi: "Tòa lệnh cho bị đơn phải đích thân có mặt." } }
          - { level: C2, use: { en: "A resolution in minutes", uk: "Резолюція в протоколі", es: "Una resolución en un acta", pt: "Uma resolução em ata", fr: "Une résolution dans un procès-verbal", de: "Ein Beschluss im Protokoll", it: "Una delibera in un verbale", pl: "Uchwała w protokole", tr: "Tutanakta bir karar", id: "Resolusi dalam notulen", vi: "Nghị quyết trong biên bản" }, ex: ["Resolved that the meeting ", { target: be adjourned }, "."], tr: { uk: "Ухвалено закрити засідання.", es: "Se resuelve que se levante la sesión.", pt: "Resolvido que a reunião seja encerrada.", fr: "Il est résolu que la séance soit levée.", de: "Beschlossen, die Sitzung zu vertagen.", it: "Si delibera che la riunione sia aggiornata.", pl: "Postanowiono, aby zamknąć zebranie.", tr: "Toplantının kapatılmasına karar verildi.", id: "Diputuskan bahwa rapat ditunda.", vi: "Nghị quyết: hoãn cuộc họp." } }
          - { level: C2, use: { en: "A motion in a meeting", uk: "Пропозиція на зборах", es: "Una moción en una reunión", pt: "Uma moção em uma reunião", fr: "Une motion en réunion", de: "Ein Antrag in einer Sitzung", it: "Una mozione in una riunione", pl: "Wniosek na zebraniu", tr: "Toplantıda bir önerge", id: "Mosi dalam rapat", vi: "Kiến nghị trong cuộc họp" }, ex: ["I move that the minutes ", { target: be approved }, "."], tr: { uk: "Пропоную затвердити протокол.", es: "Propongo que se apruebe el acta.", pt: "Proponho que a ata seja aprovada.", fr: "Je propose que le procès-verbal soit approuvé.", de: "Ich beantrage, das Protokoll zu genehmigen.", it: "Propongo che il verbale sia approvato.", pl: "Wnioskuję o zatwierdzenie protokołu.", tr: "Tutanağın onaylanmasını öneriyorum.", id: "Saya mengusulkan agar notulen disetujui.", vi: "Tôi đề nghị thông qua biên bản." } }
          - { level: C2, use: { en: "A contract or a regulation", uk: "Договір або регламент", es: "Un contrato o un reglamento", pt: "Um contrato ou um regulamento", fr: "Un contrat ou un règlement", de: "Ein Vertrag oder eine Vorschrift", it: "Un contratto o un regolamento", pl: "Umowa lub przepis", tr: "Bir sözleşme ya da yönetmelik", id: "Kontrak atau peraturan", vi: "Hợp đồng hoặc quy định" }, ex: ["The lease stipulates that the tenant ", { target: give }, " one month's notice."], tr: { uk: "Договір оренди передбачає, що орендар повинен повідомити за місяць.", es: "El contrato de arrendamiento estipula que el inquilino dé un aviso con un mes de anticipación.", pt: "O contrato de locação estipula que o inquilino avise com um mês de antecedência.", fr: "Le bail stipule que le locataire donne un mois de préavis.", de: "Der Mietvertrag sieht vor, dass der Mieter einen Monat im Voraus kündigt.", it: "Il contratto di locazione stabilisce che l'inquilino dia un mese di preavviso.", pl: "Umowa najmu stanowi, że najemca składa wypowiedzenie z miesięcznym wyprzedzeniem.", tr: "Kira sözleşmesi, kiracının bir ay önceden bildirimde bulunmasını şart koşuyor.", id: "Kontrak sewa menetapkan bahwa penyewa memberi pemberitahuan satu bulan sebelumnya.", vi: "Hợp đồng thuê quy định rằng người thuê phải báo trước một tháng." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Formal documents keep the bare verb in British and American English alike.", uk: "Офіційні документи зберігають початкову форму і в британській, і в американській англійській.", es: "Los documentos formales conservan el verbo en forma base tanto en inglés británico como en estadounidense.", pt: "Os documentos formais mantêm o verbo na forma base tanto no inglês britânico quanto no americano.", fr: "Les documents officiels gardent la base verbale en anglais britannique comme en anglais américain.", de: "Förmliche Dokumente behalten die Grundform im britischen wie im amerikanischen Englisch.", it: "I documenti formali conservano la forma base sia in inglese britannico sia in americano.", pl: "Dokumenty formalne zachowują formę podstawową zarówno w brytyjskim, jak i w amerykańskim angielskim.", tr: "Resmî belgeler, hem İngiliz hem Amerikan İngilizcesinde yalın fiili korur.", id: "Dokumen resmi mempertahankan kata kerja dasar, baik dalam bahasa Inggris Britania maupun Amerika.", vi: "Văn bản trang trọng giữ động từ nguyên mẫu, cả trong tiếng Anh Anh lẫn tiếng Anh Mỹ." }
          - type: rule
            level: C2
            text: { en: "The verb stays in the base form when the main verb is in the past:", uk: "Дієслово лишається в початковій формі, коли основне дієслово стоїть у минулому:", es: "El verbo se queda en forma base cuando el verbo principal está en pasado:", pt: "O verbo fica na forma base quando o verbo principal está no passado:", fr: "Le verbe reste à la base verbale quand le verbe principal est au passé :", de: "Das Verb bleibt in der Grundform, wenn das Hauptverb in der Vergangenheit steht:", it: "Il verbo resta alla forma base quando il verbo principale è al passato:", pl: "Czasownik zostaje w formie podstawowej, gdy czasownik główny stoi w czasie przeszłym:", tr: "Ana fiil geçmiş zamandayken de fiil yalın kalır:", id: "Kata kerja tetap berbentuk dasar ketika kata kerja utamanya berada dalam bentuk lampau:", vi: "Động từ vẫn ở dạng nguyên mẫu khi động từ chính ở quá khứ:" }
            ex: ["The court ordered that the defendant ", { target: appear }, " in person."]
            tr: { uk: "Суд постановив, щоб відповідач з’явився особисто.", es: "El tribunal ordenó que el acusado compareciera en persona.", pt: "O tribunal ordenou que o réu comparecesse pessoalmente.", fr: "Le tribunal a ordonné que le défendeur comparaisse en personne.", de: "Das Gericht ordnete an, dass der Beklagte persönlich erscheint.", it: "Il tribunale ha ordinato che l'imputato comparisse di persona.", pl: "Sąd nakazał, aby pozwany stawił się osobiście.", tr: "Mahkeme, sanığın bizzat hazır bulunmasına karar verdi.", id: "Pengadilan memerintahkan agar terdakwa hadir secara langsung.", vi: "Tòa án ra lệnh cho bị đơn phải đích thân có mặt." }

