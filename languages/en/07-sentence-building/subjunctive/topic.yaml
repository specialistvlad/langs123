          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: God save the King, use: { en: "a wish for a ruler's long life", uk: "побажання правителеві довгого життя", es: "un deseo de larga vida para un soberano", pt: "um desejo de vida longa a um soberano", fr: "un souhait de longue vie pour un souverain", de: "ein Wunsch für das lange Leben eines Herrschers", it: "un augurio di lunga vita per un sovrano", pl: "życzenie długiego życia dla władcy", tr: "bir hükümdara uzun ömür dileği", id: "harapan agar seorang penguasa berumur panjang", vi: "lời chúc nhà cai trị sống lâu" }, ex: ["“", { target: God save the King }, "!” shouted the crowd."], tr: { uk: "«Боже, бережи Короля!» — вигукнув натовп.", es: "«¡Dios salve al Rey!», gritó la multitud.", pt: "“Deus salve o Rei!”, gritou a multidão.", fr: "« Dieu sauve le Roi ! », cria la foule.", de: "„Gott schütze den König!“, rief die Menge.", it: "«Dio salvi il Re!», gridò la folla.", pl: "„Boże, chroń Króla!” — krzyknął tłum.", tr: "“Tanrı Kral’ı korusun!” diye bağırdı kalabalık.", id: "“Tuhan selamatkan Raja!” teriak orang banyak.", vi: "“Chúa phù hộ Nhà vua!”, đám đông hô vang." } }
          - { level: C2, form: { pattern: [{ term: Long live }, { slot: noun }] }, use: { en: "a cheer for a person, a group or an idea", uk: "вигук підтримки людини, групи чи ідеї", es: "una aclamación a una persona, un grupo o una idea", pt: "uma aclamação a uma pessoa, a um grupo ou a uma ideia", fr: "une acclamation pour une personne, un groupe ou une idée", de: "ein Hochruf auf eine Person, eine Gruppe oder eine Idee", it: "un'acclamazione per una persona, un gruppo o un'idea", pl: "okrzyk na cześć osoby, grupy lub idei", tr: "bir kişi, bir grup ya da bir fikir için atılan alkış sloganı", id: "seruan dukungan untuk seseorang, kelompok, atau gagasan", vi: "tiếng hô ủng hộ một người, một nhóm hay một ý tưởng" }, ex: ["“", { target: Long live }, " the champions!” they cried."], tr: { uk: "«Хай живуть чемпіони!» — вигукували вони.", es: "«¡Vivan los campeones!», gritaron.", pt: "“Vivam os campeões!”, gritaram.", fr: "« Vivent les champions ! », crièrent-ils.", de: "„Es leben die Meister!“, riefen sie.", it: "«Viva i campioni!», gridarono.", pl: "„Niech żyją mistrzowie!” — wołali.", tr: "“Yaşasın şampiyonlar!” diye bağırdılar.", id: "“Hidup para juara!” seru mereka.", vi: "“Các nhà vô địch muôn năm!”, họ hô lớn." } }
          - { level: C2, form: So be it, use: { en: "I accept it, though I may not like it", uk: "я приймаю це, хоч це мені може й не подобатися", es: "lo acepto, aunque quizá no me guste", pt: "eu aceito, mesmo que talvez não goste", fr: "je l’accepte, même si cela ne me plaît peut-être pas", de: "ich nehme es hin, auch wenn es mir vielleicht nicht gefällt", it: "lo accetto, anche se forse non mi piace", pl: "akceptuję to, choć może mi się to nie podobać", tr: "bunu kabul ediyorum, hoşuma gitmese de", id: "saya menerimanya, meskipun mungkin tidak menyukainya", vi: "tôi chấp nhận, dù có thể tôi không thích" }, ex: ["If you won't change your mind, ", { target: so be it }, "."], tr: { uk: "Якщо ти не передумаєш — що ж, нехай буде так.", es: "Si no vas a cambiar de opinión, que así sea.", pt: "Se você não vai mudar de ideia, que seja assim.", fr: "Si tu ne changes pas d’avis, soit.", de: "Wenn du deine Meinung nicht änderst, dann sei es so.", it: "Se non vuoi cambiare idea, così sia.", pl: "Jeśli nie zmienisz zdania, niech tak będzie.", tr: "Fikrini değiştirmeyeceksen, öyle olsun.", id: "Kalau kamu tidak mau berubah pikiran, biarlah begitu.", vi: "Nếu bạn không đổi ý thì cứ vậy đi." } }
          - { level: C2, form: Heaven forbid, use: { en: "I hope it never happens", uk: "сподіваюся, що цього ніколи не станеться", es: "espero que nunca ocurra", pt: "espero que nunca aconteça", fr: "j’espère que cela n’arrivera jamais", de: "ich hoffe, dass es nie geschieht", it: "spero che non succeda mai", pl: "mam nadzieję, że to się nigdy nie zdarzy", tr: "umarım hiç olmaz", id: "saya berharap hal itu tidak pernah terjadi", vi: "tôi mong điều đó không bao giờ xảy ra" }, ex: ["If he fails, ", { target: heaven forbid }, ", we start again."], tr: { uk: "Якщо він зазнає невдачі, не дай Боже, ми почнемо спочатку.", es: "Si fracasa, Dios no lo quiera, empezamos de nuevo.", pt: "Se ele fracassar, Deus me livre, começamos de novo.", fr: "S’il échoue, Dieu nous en garde, nous recommencerons.", de: "Wenn er scheitert, Gott bewahre, fangen wir von vorn an.", it: "Se fallisce, Dio non voglia, ricominciamo da capo.", pl: "Jeśli mu się nie uda, nie daj Boże, zaczniemy od nowa.", tr: "Başarısız olursa, Allah korusun, baştan başlarız.", id: "Kalau dia gagal, semoga jangan sampai terjadi, kita mulai lagi dari awal.", vi: "Nếu anh ấy thất bại, trời đừng cho xảy ra, thì chúng ta làm lại từ đầu." } }
          - { level: C2, form: Perish the thought, use: { en: "I reject the idea", uk: "я відкидаю таку думку", es: "rechazo la idea", pt: "rejeito a ideia", fr: "je rejette cette idée", de: "ich weise den Gedanken zurück", it: "respingo l'idea", pl: "odrzucam ten pomysł", tr: "bu fikri reddediyorum", id: "saya menolak gagasan itu", vi: "tôi bác bỏ ý nghĩ đó" }, ex: ["Me, late for my own wedding? ", { target: Perish the thought }, "!"], tr: { uk: "Я, і спізнюся на власне весілля? Боронь Боже!", es: "¿Yo, llegar tarde a mi propia boda? ¡Ni lo pienses!", pt: "Eu, chegar atrasado ao meu próprio casamento? Nem pensar!", fr: "Moi, en retard à mon propre mariage ? Loin de moi cette idée !", de: "Ich, zu spät zu meiner eigenen Hochzeit? Auf keinen Fall!", it: "Io, in ritardo al mio matrimonio? Ma neanche per sogno!", pl: "Ja, spóźnić się na własny ślub? Co za pomysł!", tr: "Ben, kendi düğünüme geç mi kalacağım? Aklımdan bile geçmez!", id: "Saya, terlambat di pernikahan saya sendiri? Tidak mungkin!", vi: "Tôi mà đến muộn trong chính đám cưới của mình ư? Không đời nào!" } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["Each formula keeps the bare verb with any subject: ", { term: God save the King }, ", with no -s."], uk: ["Кожен вислів зберігає початкову форму з будь-яким підметом: ", { term: "God save the King" }, ", без -s."], es: ["Cada fórmula conserva el verbo en forma base con cualquier sujeto: ", { term: "God save the King" }, ", sin -s."], pt: ["Cada fórmula mantém o verbo na forma base com qualquer sujeito: ", { term: "God save the King" }, ", sem -s."], fr: ["Chaque formule garde la base verbale avec n’importe quel sujet : ", { term: "God save the King" }, ", sans -s."], de: ["Jede Formel behält die Grundform bei jedem Subjekt: ", { term: "God save the King" }, ", ohne -s."], it: ["Ogni formula conserva la forma base con qualsiasi soggetto: ", { term: "God save the King" }, ", senza -s."], pl: ["Każda formuła zachowuje formę podstawową przy dowolnym podmiocie: ", { term: "God save the King" }, ", bez -s."], tr: ["Her kalıp, öznesi ne olursa olsun yalın fiili korur: ", { term: "God save the King" }, ", -s yok."], id: ["Setiap ungkapan mempertahankan kata kerja dasar untuk subjek apa pun: ", { term: "God save the King" }, ", tanpa -s."], vi: ["Mỗi cụm giữ động từ nguyên mẫu với mọi chủ ngữ: ", { term: "God save the King" }, ", không có -s."] }

  - title: { en: "Fixed formulas: framing a statement", uk: "Усталені вислови: рамка для твердження", es: "Fórmulas fijas: para enmarcar una afirmación", pt: "Fórmulas fixas: para enquadrar uma afirmação", fr: "Formules figées : pour introduire une affirmation", de: "Feste Formeln: eine Aussage einleiten", it: "Formule fisse: per introdurre un'affermazione", pl: "Stałe formuły: wprowadzenie do wypowiedzi", tr: "Kalıplaşmış ifadeler: bir görüşü çerçevelemek", id: "Ungkapan tetap: membingkai suatu pernyataan", vi: "Cụm cố định: mở đầu hoặc rào đón một phát biểu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Formula, uk: "Вислів", es: "Fórmula", pt: "Fórmula", fr: "Formule", de: "Formel", it: "Formula", pl: "Formuła", tr: "Kalıp", id: "Ungkapan", vi: "Cụm cố định" } }
          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: Be that as it may, use: { en: "even if that is true, I go on", uk: "нехай це й правда, я все одно продовжую", es: "aunque eso sea cierto, sigo adelante", pt: "mesmo que isso seja verdade, sigo em frente", fr: "même si c’est vrai, je poursuis", de: "auch wenn das stimmt, mache ich weiter", it: "anche se è vero, vado avanti", pl: "nawet jeśli to prawda, idę dalej", tr: "bu doğru olsa bile devam ediyorum", id: "meskipun itu benar, saya tetap melanjutkan", vi: "dù điều đó đúng, tôi vẫn tiếp tục" }, ex: [{ target: Be that as it may }, ", we still have to decide."], tr: { uk: "Хай там як, а вирішувати нам усе одно треба.", es: "Sea como fuere, todavía tenemos que decidir.", pt: "Seja como for, ainda temos de decidir.", fr: "Quoi qu’il en soit, nous devons encore décider.", de: "Wie dem auch sei, wir müssen uns trotzdem entscheiden.", it: "Comunque sia, dobbiamo ancora decidere.", pl: "Jak by nie było, nadal musimy zdecydować.", tr: "Ne olursa olsun, yine de karar vermemiz gerek.", id: "Bagaimanapun juga, kita tetap harus memutuskan.", vi: "Dù sao đi nữa, chúng ta vẫn phải quyết định." } }
          - { level: C2, form: Come what may, use: { en: "whatever happens", uk: "що б не сталося", es: "pase lo que pase", pt: "aconteça o que acontecer", fr: "quoi qu’il arrive", de: "was auch geschieht", it: "qualunque cosa accada", pl: "cokolwiek się stanie", tr: "ne olursa olsun", id: "apa pun yang terjadi", vi: "dù chuyện gì xảy ra" }, ex: ["I'll support you, ", { target: come what may }, "."], tr: { uk: "Я тебе підтримаю, що б не сталося.", es: "Te apoyaré, pase lo que pase.", pt: "Vou apoiar você, aconteça o que acontecer.", fr: "Je te soutiendrai, quoi qu’il arrive.", de: "Ich unterstütze dich, was auch kommen mag.", it: "Ti sosterrò, qualunque cosa accada.", pl: "Poprę cię, cokolwiek się stanie.", tr: "Ne olursa olsun seni destekleyeceğim.", id: "Saya akan mendukungmu, apa pun yang terjadi.", vi: "Tôi sẽ ủng hộ bạn, dù chuyện gì xảy ra." } }
          - { level: C2, form: { term: ["Far be it from me to", { gap: true }] }, use: { en: "a polite opening before advice or criticism", uk: "ввічливий вступ перед порадою чи критикою", es: "una apertura cortés antes de un consejo o una crítica", pt: "uma abertura educada antes de um conselho ou de uma crítica", fr: "une entrée en matière polie avant un conseil ou une critique", de: "eine höfliche Einleitung vor Rat oder Kritik", it: "un'apertura cortese prima di un consiglio o di una critica", pl: "uprzejmy wstęp przed radą lub krytyką", tr: "tavsiye ya da eleştiriden önce kullanılan kibar bir giriş", id: "pembuka yang sopan sebelum saran atau kritik", vi: "lời mở đầu lịch sự trước khi khuyên hoặc phê bình" }, ex: [{ target: Far be it from me to }, " interfere, but the sign says no parking."], tr: { uk: "Не мені втручатися, але на знаку сказано, що стоянка заборонена.", es: "Lejos de mí meterme, pero el letrero dice que no se puede estacionar.", pt: "Longe de mim interferir, mas a placa diz que é proibido estacionar.", fr: "Loin de moi l’idée de m’en mêler, mais le panneau interdit de stationner.", de: "Es liegt mir fern, mich einzumischen, aber auf dem Schild steht „Parken verboten“.", it: "Non spetta a me intervenire, ma il cartello dice divieto di sosta.", pl: "Nie mnie się wtrącać, ale znak mówi, że parkować nie wolno.", tr: "Karışmak bana düşmez ama tabelada park etmek yasak yazıyor.", id: "Bukan maksud saya ikut campur, tetapi rambu itu melarang parkir.", vi: "Tôi không muốn xen vào, nhưng biển báo ghi là cấm đỗ xe." } }
          - { level: C2, form: Suffice it to say, use: { en: "I will give only the main point", uk: "я скажу лише найголовніше", es: "daré solo lo esencial", pt: "vou dizer só o essencial", fr: "je ne donne que l’essentiel", de: "ich nenne nur den Kernpunkt", it: "dirò solo il punto principale", pl: "podam tylko najważniejszą rzecz", tr: "yalnızca ana noktayı söyleyeceğim", id: "saya hanya akan menyebut poin utamanya", vi: "tôi chỉ nêu điểm chính" }, ex: [{ target: Suffice it to say }, " that we were not impressed."], tr: { uk: "Скажу лише, що нас це не вразило.", es: "Baste decir que no nos impresionó.", pt: "Basta dizer que não ficamos impressionados.", fr: "Qu’il suffise de dire que nous n’avons pas été impressionnés.", de: "Es genügt zu sagen, dass wir nicht beeindruckt waren.", it: "Basti dire che non siamo rimasti colpiti.", pl: "Dość powiedzieć, że nie zrobiło to na nas wrażenia.", tr: "Etkilenmediğimizi söylemek yeter.", id: "Cukup dikatakan bahwa kami tidak terkesan.", vi: "Chỉ cần nói rằng chúng tôi không ấn tượng." } }
          - { level: C2, form: If need be, use: { en: "if it is necessary", uk: "якщо це необхідно", es: "si es necesario", pt: "se for necessário", fr: "si c’est nécessaire", de: "wenn es nötig ist", it: "se è necessario", pl: "jeśli to konieczne", tr: "gerekirse", id: "jika diperlukan", vi: "nếu cần thiết" }, ex: ["We'll work on Sunday ", { target: if need be }, "."], tr: { uk: "Ми працюватимемо в неділю, якщо буде потреба.", es: "Trabajaremos el domingo si es necesario.", pt: "Trabalharemos no domingo, se for preciso.", fr: "Nous travaillerons dimanche si besoin est.", de: "Wir arbeiten am Sonntag, wenn es sein muss.", it: "Lavoreremo domenica, se sarà necessario.", pl: "Będziemy pracować w niedzielę, jeśli zajdzie potrzeba.", tr: "Gerekirse pazar günü çalışırız.", id: "Kami akan bekerja pada hari Minggu jika perlu.", vi: "Chúng tôi sẽ làm việc vào Chủ nhật nếu cần." } }
          - { level: C2, form: as it were, use: { en: "so to speak, softening an unusual word", uk: "так би мовити; пом’якшує незвичне слово", es: "por así decirlo, para suavizar una palabra inusual", pt: "por assim dizer, para suavizar uma palavra incomum", fr: "pour ainsi dire, pour adoucir un mot inhabituel", de: "sozusagen; mildert ein ungewöhnliches Wort ab", it: "per così dire, per attenuare una parola insolita", pl: "że tak powiem; łagodzi nietypowe słowo", tr: "tabir caizse; alışılmadık bir sözcüğü yumuşatır", id: "boleh dikatakan; melunakkan kata yang tidak lazim", vi: "có thể nói là; làm dịu một từ không quen thuộc" }, ex: ["She is, ", { target: as it were }, ", the heart of the team."], tr: { uk: "Вона, так би мовити, серце команди.", es: "Ella es, por así decirlo, el corazón del equipo.", pt: "Ela é, por assim dizer, o coração da equipe.", fr: "Elle est, pour ainsi dire, le cœur de l’équipe.", de: "Sie ist sozusagen das Herz des Teams.", it: "È, per così dire, il cuore della squadra.", pl: "Jest, że tak powiem, sercem zespołu.", tr: "O, tabir caizse, takımın kalbi.", id: "Dia boleh dikatakan jantung tim itu.", vi: "Cô ấy có thể nói là trái tim của cả đội." } }

  - title: { en: "Be-clauses and would that", uk: "Речення з be на початку й would that", es: "Oraciones con be al inicio y would that", pt: "Orações com be no início e would that", fr: "Propositions en be et would that", de: "Be-Sätze und would that", it: "Proposizioni con be e would that", pl: "Zdania z be na początku i would that", tr: "Başta be olan cümlecikler ve would that", id: "Klausa be dan would that", vi: "Mệnh đề với be đứng đầu và would that" }
