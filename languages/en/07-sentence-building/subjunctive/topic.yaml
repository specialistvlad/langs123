  - title: { en: "Formal, legal and meeting language", uk: "Офіційна, юридична мова й мова зборів", es: "Lenguaje formal, jurídico y de reuniones", pt: "Linguagem formal, jurídica e de reuniões", fr: "Langue soutenue, juridique et de réunion", de: "Förmliche Sprache, Rechtssprache und Sitzungssprache", it: "Linguaggio formale, giuridico e delle riunioni", pl: "Język formalny, prawniczy i zebrań", tr: "Resmî, hukuki ve toplantı dili", id: "Bahasa formal, hukum, dan rapat", vi: "Ngôn ngữ trang trọng, pháp lý và họp hành" }
