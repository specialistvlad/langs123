        rows:
          - { level: C2, use: { en: ["Two alternatives, and either one holds: ", { pattern: [{ term: Be }, { slot: subject }, { slot: adjective }, or, { slot: adjective }] }], uk: ["Два варіанти; основне твердження справедливе в обох випадках: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], es: ["Dos alternativas; lo que se afirma vale en cualquiera de los dos casos: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], pt: ["Duas alternativas; o que se afirma vale nos dois casos: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], fr: ["Deux possibilités ; ce qui est affirmé vaut dans les deux cas : ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], de: ["Zwei Alternativen; die Aussage gilt in beiden Fällen: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], it: ["Due alternative; ciò che si afferma vale in entrambi i casi: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], pl: ["Dwie możliwości; twierdzenie jest prawdziwe w obu przypadkach: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], tr: ["İki seçenek; söylenen şey her iki durumda da geçerlidir: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], id: ["Dua pilihan; pernyataannya berlaku pada kedua kasus: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }], vi: ["Hai khả năng; điều được nói đúng trong cả hai trường hợp: ", { pattern: [{ term: "Be" }, { slot: "subject" }, { slot: "adjective" }, "or", { slot: "adjective" }] }] }, ex: { examples: [[{ target: Be it large or small }, ", every gift helps."], [{ tar