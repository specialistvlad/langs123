        rows:
          - { level: C2, form: "Waste not, want not", use: { en: "save what you have and you will not go without", uk: "бережи, що маєш, і не зазнаєш нестатків", es: "cuida lo que tienes y no te faltará nada", pt: "guarde o que você tem e não lhe faltará nada", fr: "économise ce que tu as et tu ne manqueras de rien", de: "spare, was du hast, dann wird dir nichts fehlen", it: "conserva ciò che hai e non ti mancherà nulla", pl: "oszczędzaj to, co masz, a niczego ci nie zabraknie", tr: "elindekini koru, hiçbir şeyden yoksun kalmazsın", id: "hematlah apa yang kamu punya, maka kamu tidak akan kekurangan", vi: "biết tiết kiệm những gì đang có thì sẽ không thiếu thốn" }, ex: ["Keep the leftovers: ", { target: "waste not, want not" }, "."], tr: { uk: "Збережи залишки: не марнуй — не знатимеш нестатків.", es: "Guarda las sobras: el que no desperdicia no pasa necesidad.", pt: "Guarde as sobras: quem não desperdiça não passa necessidade.", fr: "Garde les restes : qui ne gaspille pas ne manque de rien.", de: "Heb die Reste auf: Wer nichts verschwendet, dem fehlt nichts.", it: "Conserva gli avanzi: chi non spreca non manca di nulla.", pl: "Zachowaj resztki: kto nie marnuje, niczego mu nie brakuje.", tr: "Artakalanları sakla: israf etmeyen sıkıntı çekmez.", id: "Simpan sisa makanan itu: siapa tidak memboroskan, tidak akan kekurangan.", vi: "Hãy giữ lại đồ ăn thừa: không lãng phí thì không thiếu thốn." } }
          - { level: C2, form: "Least said, soonest mended", use: { en: "the less said about a quarrel, the sooner it is forgotten", uk: "чим менше говорити про сварку, тим швидше її забудуть", es: "cuanto menos se hable de una pelea, antes se olvida", pt: "quanto menos se falar de uma briga, mais cedo ela é esquecida", fr: "moins on parle d’une dispute, plus vite elle est oubliée", de: "je weniger man über einen Streit redet, desto schneller ist er vergessen", it: "meno si parla di una lite, prima la si dimentica", pl: "im mniej mówi się o kłótni, tym szybciej się o niej zapomina", tr: "bir kavga hakkında ne kadar az konuşulursa o kadar çabuk unutulur", id: "makin sedikit pertengkaran dibicarakan, makin cepat ia terlupakan", vi: "càng ít nhắc đến một cuộc cãi vã thì nó càng mau bị quên" }, ex: ["Don't mention it again: ", { target: "least said, soonest mended" }, "."], tr: { uk: "Не згадуй про це більше: чим менше сказано, тим швидше забудеться.", es: "No lo menciones más: cuanto menos se hable, antes se arregla.", pt: "Não toque mais no assunto: quanto menos se falar, mais cedo se resolve.", fr: "N’en parle plus : moins on en dit, plus vite tout s’arrange.", de: "Erwähne es nicht noch einmal: Je weniger geredet wird, desto schneller ist es vergessen.", it: "Non parlarne più: meno si dice, prima si rimedia.", pl: "Nie wspominaj o tym więcej: im mniej się mówi, tym szybciej się zapomina.", tr: "Bir daha anma: ne kadar az konuşulursa o kadar çabuk unutulur.", id: "Jangan singgung lagi: makin sedikit dibicarakan, makin cepat reda.", vi: "Đừng nhắc lại nữa: càng ít nói thì càng mau yên chuyện." } }
          - { level: C2, form: "Be it ever so humble, there's no place like home", use: { en: "however modest, home is best", uk: "який би скромний він не був, дім — найкраще місце", es: "por humilde que sea, no hay nada como el hogar", pt: "por mais humilde que seja, o lar é o melhor lugar", fr: "aussi modeste soit-il, la maison reste le meilleur endroit", de: "so bescheiden es auch sei, zu Hause ist es am schönsten", it: "per quanto sia modesta, la casa è il posto migliore", pl: "choćby skromny, dom jest najlepszy", tr: "ne kadar mütevazı olursa olsun, en güzel yer evdir", id: "sesederhana apa pun, rumah tetap yang terbaik", vi: "dù khiêm tốn đến đâu, nhà vẫn là nơi tuyệt nhất" }, ex: [{ target: Be it ever so humble }, ", there's no place like home."], tr: { uk: "Хай скромне, а дім — найкраще місце на світі.", es: "Por humilde que sea, no hay lugar como el hogar.", pt: "Por mais humilde que seja, não há lugar como o lar.", fr: "Aussi modeste soit-il, rien ne vaut son chez-soi.", de: "So bescheiden es auch sei, nirgends ist es so schön wie zu Hause.", it: "Per quanto sia umile, non c'è posto come casa.", pl: "Choćby najskromniejszy, nie ma jak w domu.", tr: "Ne kadar mütevazı olursa olsun, ev gibisi yok.", id: "Sesederhana apa pun, tidak ada tempat seperti rumah.", vi: "Dù khiêm tốn đến đâu, không nơi nào bằng nhà." } }
          - { level: C2, form: { pattern: [{ term: Long may }, { slot: subject }, { slot: base verb }] }, use: { en: "a wish that something lasts", uk: "побажання, щоб щось тривало довго", es: "un deseo de que algo dure", pt: "um desejo de que algo dure", fr: "un souhait que quelque chose dure", de: "ein Wunsch, dass etwas lange besteht", it: "un augurio che qualcosa duri", pl: "życzenie, by coś trwało", tr: "bir şeyin sürmesi için dilek", id: "harapan agar sesuatu bertahan lama", vi: "lời chúc điều gì đó bền lâu" }, ex: ["Long ", { target: may }, " our friendship last."], tr: { uk: "Нехай наша дружба триває довго.", es: "Que nuestra amistad dure mucho tiempo.", pt: "Que nossa amizade dure por muito tempo.", fr: "Longue vie à notre amitié.", de: "Möge unsere Freundschaft lange bestehen.", it: "Lunga vita alla nostra amicizia.", pl: "Niech nasza przyjaźń trwa jak najdłużej.", tr: "Dostluğumuz uzun yıllar sürsün.", id: "Semoga persahabatan kita bertahan lama.", vi: "Mong tình bạn của chúng ta bền lâu." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Speakers quote these sayings whole; new sentences take the ordinary word order.", uk: "Мовці цитують ці приказки цілком; нові речення мають звичайний порядок слів.", es: "Los hablantes citan estos dichos enteros; las oraciones nuevas siguen el orden de palabras habitual.", pt: "Os falantes citam esses ditos por inteiro; as frases novas seguem a ordem normal das palavras.", fr: "On cite ces dictons en bloc ; les phrases nouvelles suivent l’ordre normal des mots.", de: "Man zitiert diese Sprüche als Ganzes; neue Sätze folgen der gewöhnlichen Wortstellung.", it: "I parlanti citano questi detti per intero; le frasi nuove seguono l'ordine normale delle parole.", pl: "Mówiący cytują te powiedzenia w całości; nowe zdania mają zwykły szyk.", tr: "Konuşurlar bu sözleri bütün olarak alıntılar; yeni cümleler sıradan sözcük sırasını izler.", id: "Penutur mengutip ungkapan ini secara utuh; kalimat baru memakai urutan kata yang biasa.", vi: "Người nói dẫn nguyên văn những câu này; câu mới theo trật tự từ thông thường." }
          - type: note
            level: C2
            text: { en: ["More wishes with ", { term: may }, " are in ", { link: May and Might, to: en.modals.may-might }, "."], uk: ["Більше побажань з ", { term: "may" }, " — у темі ", { link: "May і might", to: "en.modals.may-might" }, "."], es: ["Más deseos con ", { term: "may" }, " están en ", { link: "May y might", to: "en.modals.may-might" }, "."], pt: ["Mais desejos com ", { term: "may" }, " estão em ", { link: "May e might", to: "en.modals.may-might" }, "."], fr: ["D’autres souhaits avec ", { term: "may" }, " sont dans ", { link: "May et might", to: "en.modals.may-might" }, "."], de: ["Weitere Wünsche mit ", { term: "may" }, " stehen unter ", { link: "May und might", to: "en.modals.may-might" }, "."], it: ["Altri auguri con ", { term: "may" }, " sono in ", { link: "May e might", to: "en.modals.may-might" }, "."], pl: ["Więcej życzeń z ", { term: "may" }, " znajdziesz w temacie ", { link: "May i might", to: "en.modals.may-might" }, "."], tr: [{ term: "may" }, " ile kurulan diğer dilekler ", { link: "May ve might", to: "en.modals.may-might" }, " konusunda yer alır."], id: ["Harapan lain dengan ", { term: "may" }, " dibahas di ", { link: "May dan might", to: "en.modals.may-might" }, "."], vi: ["Các lời chúc khác với ", { term: "may" }, " có trong ", { link: "May và might", to: "en.modals.may-might" }, "."] }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: C1, wrong: I suggest him to go., right: ["I suggest ", { target: that he go }, "."], rule: { en: [{ term: suggest }, " takes a ", { term: that }, " clause for another person's action"], uk: [{ term: "suggest" }, " вимагає підрядного речення з ", { term: "that" }, ", коли дію виконує інша особа"], es: [{ term: "suggest" }, " lleva una oración con ", { term: "that" }, " cuando actúa otra persona"], pt: [{ term: "suggest" }, " pede uma oração com ", { term: "that" }, " quando quem age é outra pessoa"], fr: [{ term: "suggest" }, " se construit avec une proposition en ", { term: "that" }, " quand l’action est celle d’une autre personne"], de: [{ term: "suggest" }, " steht mit einem ", { term: "that" }, "-Satz, wenn eine andere Person handelt"], it: [{ term: "suggest" }, " regge una proposizione con ", { term: "that" }, " quando agisce un'altra persona"], pl: [{ term: "suggest" }, " łączy się ze zdaniem z ", { term: "that" }, ", gdy działa ktoś inny"], tr: ["Eylemi başka biri yapıyorsa ", { term: "suggest" }, ", ", { term: "that" }, " cümleciği alır"], id: [{ term: "suggest" }, " memakai klausa ", { term: "that" }, " untuk tindakan orang lain"], vi: [{ term: "suggest" }, " đi với mệnh đề ", { term: "that" }, " khi người khác thực hiện hành động"] } }
          - { level: C1, wrong: He suggested to take a taxi., right: ["He suggested ", { target: taking }, " a taxi."], rule: { en: [{ term: suggest }, " takes ", { slot: -ing }, " when the speaker is among the doers"], uk: [{ term: "suggest" }, " вимагає ", { slot: "-ing" }, ", коли мовець теж серед тих, хто діє"], es: [{ term: "suggest" }, " lleva ", { slot: "-ing" }, " cuando el hablante está entre quienes actúan"], pt: [{ term: "suggest" }, " pede ", { slot: "-ing" }, " quando quem fala está entre os que agem"], fr: [{ term: "suggest" }, " se construit avec ", { slot: "-ing" }, " quand le locuteur fait partie de ceux qui agissent"], de: [{ term: "suggest" }, " steht mit ", { slot: "-ing" }, ", wenn der Sprecher selbst zu den Handelnden gehört"], it: [{ term: "suggest" }, " regge ", { slot: "-ing" }, " quando chi parla è tra chi agisce"], pl: [{ term: "suggest" }, " łączy się z ", { slot: "-ing" }, ", gdy mówiący należy do wykonawców czynności"], tr: ["Konuşan da eylemi yapanlar arasındaysa ", { term: "suggest" }, ", ", { slot: "-ing" }, " alır"], id: [{ term: "suggest" }, " memakai ", { slot: "-ing" }, " jika pembicara termasuk pelaku tindakan"], vi: [{ term: "suggest" }, " đi với ", { slot: "-ing" }, " khi người nói cũng nằm trong số người thực hiện"] } }
          - { level: C1, wrong: They demand that he will pay., right: ["They demand that he ", { target: pay }, "."], rule: { en: "the clause after a demand takes the base verb alone", uk: "підрядне речення після вимоги має лише початкову форму дієслова", es: "la oración después de una exigencia lleva solo el verbo en forma base", pt: "a oração depois de uma exigência leva só o verbo na forma base", fr: "la proposition après une exigence prend la base verbale seule", de: "der Satz nach einer Forderung steht nur mit der Grundform", it: "la proposizione dopo una richiesta ha solo la forma base", pl: "zdanie po żądaniu ma samą formę podstawową czasownika", tr: "talepten sonraki cümlecikte yalnızca yalın fiil kullanılır", id: "klausa setelah tuntutan hanya memakai kata kerja dasar", vi: "mệnh đề sau một yêu cầu chỉ dùng động từ nguyên mẫu" } }
          - { level: C1, wrong: She spoke quietly lest she did not wake the baby., right: ["She spoke quietly lest she ", { target: wake }, " the baby."], rule: { en: [{ term: lest }, " carries the negative, so its clause has no ", { term: not }], uk: [{ term: "lest" }, " уже містить заперечення, тому в його реченні немає ", { term: "not" }], es: [{ term: "lest" }, " ya lleva la negación, por eso su oración no tiene ", { term: "not" }], pt: [{ term: "lest" }, " já traz a negação, por isso a oração dele não tem ", { term: "not" }], fr: [{ term: "lest" }, " porte la négation ; sa proposition n’a donc pas de ", { term: "not" }], de: [{ term: "lest" }, " enthält die Verneinung, darum steht im Satz kein ", { term: "not" }], it: [{ term: "lest" }, " porta la negazione, perciò la sua proposizione non ha ", { term: "not" }], pl: [{ term: "lest" }, " niesie przeczenie, więc jego zdanie nie ma ", { term: "not" }], tr: [{ term: "lest" }, " olumsuzluğu taşır; bu yüzden cümleciğinde ", { term: "not" }, " bulunmaz"], id: [{ term: "lest" }, " sudah mengandung makna negatif, jadi klausanya tidak memakai ", { term: "not" }], vi: [{ term: "lest" }, " mang nghĩa phủ định, nên mệnh đề của nó không có ", { term: "not" }] } }
          - { level: C2, wrong: Far be it for me to criticise., right: ["Far be it ", { target: from me }, " to criticise."], rule: { en: ["the formula is ", { term: far be it from me to }], uk: ["вислів звучить так: ", { term: "far be it from me to" }], es: ["la fórmula es ", { term: "far be it from me to" }], pt: ["a fórmula é ", { term: "far be it from me to" }], fr: ["la formule est ", { term: "far be it from me to" }], de: ["die Formel lautet ", { term: "far be it from me to" }], it: ["la formula è ", { term: "far be it from me to" }], pl: ["formuła brzmi ", { term: "far be it from me to" }], tr: ["kalıp ", { term: "far be it from me to" }, " biçimindedir"], id: ["ungkapannya adalah ", { term: "far be it from me to" }], vi: ["cụm đúng là ", { term: "far be it from me to" }] } }
          - { level: C2, wrong: God saves the King., right: [{ target: God save }, " the King."], rule: { en: "the formula keeps the bare verb", uk: "вислів зберігає початкову форму", es: "la fórmula conserva el verbo en forma base", pt: "a fórmula mantém o verbo na forma base", fr: "la formule garde la base verbale", de: "die Formel behält die Grundform", it: "la formula conserva la forma base", pl: "formuła zachowuje formę podstawową", tr: "kalıp yalın fiili korur", id: "ungkapan itu mempertahankan kata kerja dasar", vi: "cụm này giữ động từ nguyên mẫu" } }
          - { level: C2, wrong: I move that the motion is carried., right: ["I move that the motion ", { target: be carried }, "."], rule: { en: "a motion takes the base verb be", uk: "у пропозиції на зборах вживають початкову форму be", es: "una moción lleva el verbo be en forma base", pt: "uma moção leva o verbo be na forma base", fr: "une motion prend le verbe be à la base verbale", de: "ein Antrag steht mit dem Verb be in der Grundform", it: "una mozione vuole il verbo be alla forma base", pl: "wniosek wymaga formy podstawowej be", tr: "önergede yalın fiil be kullanılır", id: "mosi memakai kata kerja dasar be", vi: "kiến nghị dùng động từ nguyên mẫu be" } }
