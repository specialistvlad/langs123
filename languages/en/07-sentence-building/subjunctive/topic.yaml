        - { level: C1, point: { en: British and American, uk: "Британський і американський", es: "Británico y estadounidense", pt: "Britânico e americano", fr: "Britannique et américain", de: "Britisch und amerikanisch", it: "Britannico e americano", pl: "Brytyjski i amerykański", tr: "İngiliz ve Amerikan", id: "Inggris dan Amerika", vi: "Anh và Mỹ" }, rule: { en: ["American English prefers the bare verb; British English often adds ", { term: should }], uk: ["Американська англійська віддає перевагу початковій формі; британська часто додає ", { term: "should" }], es: ["El inglés estadounidense prefiere el verbo en forma base; el británico suele añadir ", { term: "should" }], pt: ["O inglês americano prefere o verbo na forma base; o britânico costuma acrescentar ", { term: "should" }], fr: ["L’anglais américain préfère la base verbale seule ; l’anglais britannique ajoute souvent ", { term: "should" }], de: ["Amerikanisches Englisch bevorzugt die bloße Grundform; britisches Englisch ergänzt oft ", { term: "should" }], it: ["L'inglese americano preferisce la forma base; quello britannico aggiunge spesso ", { term: "should" }], pl: ["Amerykański angielski woli samą formę podstawową; brytyjski często dodaje ", { term: "should" }], tr: ["Amerikan İngilizcesi yalın fiili tercih eder; İngiliz İngilizcesi çoğu zaman ", { term: "should" }, " ekler"], id: ["Bahasa Inggris Amerika lebih suka kata kerja dasar saja; bahasa Inggris Britania sering menambahkan ", { term: "should" }], vi: ["Tiếng Anh Mỹ ưa dùng động từ nguyên mẫu trơn; tiếng Anh Anh thường thêm ", { term: "should" }] }, ex: ["We recommend that she ", { target: should apply }, ". ", { variant: { target: apply }, variety: en-US }], tr: { uk: "Ми радимо їй подати заявку.", es: "Recomendamos que ella presente su solicitud.", pt: "Recomendamos que ela se candidate.", fr: "Nous recommandons qu’elle pose sa candidature.", de: "Wir empfehlen, dass sie sich bewirbt.", it: "Raccomandiamo che si candidi.", pl: "Zalecamy, żeby złożyła podanie.", tr: "Onun başvurmasını tavsiye ediyoruz.", id: "Kami menyarankan agar dia mendaftar.", vi: "Chúng tôi khuyên cô ấy nên nộp đơn." } }
        - { level: C1, point: { en: Were, uk: "Were", es: "Were", pt: "Were", fr: "Were", de: "Were", it: "Were", pl: "Were", tr: "Were", id: "Were", vi: "Were" }, rule: { en: [{ term: were }, " follows every subject after ", { term: if }, ", ", { term: as if }, " and ", { term: wish }], uk: [{ term: "were" }, " стоїть з будь-яким підметом після ", { term: "if" }, ", ", { term: "as if" }, " і ", { term: "wish" }], es: [{ term: "were" }, " va con cualquier sujeto después de ", { term: "if" }, ", ", { term: "as if" }, " y ", { term: "wish" }], pt: [{ term: "were" }, " acompanha qualquer sujeito depois de ", { term: "if" }, ", ", { term: "as if" }, " e ", { term: "wish" }], fr: [{ term: "were" }, " s’emploie avec tous les sujets après ", { term: "if" }, ", ", { term: "as if" }, " et ", { term: "wish" }], de: [{ term: "were" }, " steht bei jedem Subjekt nach ", { term: "if" }, ", ", { term: "as if" }, " und ", { term: "wish" }], it: [{ term: "were" }, " si usa con ogni soggetto dopo ", { term: "if" }, ", ", { term: "as if" }, " e ", { term: "wish" }], pl: [{ term: "were" }, " stoi przy każdym podmiocie po ", { term: "if" }, ", ", { term: "as if" }, " i ", { term: "wish" }], tr: [{ term: "if" }, ", ", { term: "as if" }, " ve ", { term: "wish" }, " sonrasında her özneyle ", { term: "were" }, " kullanılır"], id: [{ term: "were" }, " dipakai untuk semua subjek setelah ", { term: "if" }, ", ", { term: "as if" }, ", dan ", { term: "wish" }], vi: [{ term: "were" }, " đi với mọi chủ ngữ sau ", { term: "if" }, ", ", { term: "as if" }, " và ", { term: "wish" }] }, ex: ["I wish it ", { target: were }, " Friday."], tr: { uk: "Якби ж то була п’ятниця.", es: "Ojalá fuera viernes.", pt: "Eu queria que fosse sexta-feira.", fr: "Si seulement on était vendredi.", de: "Ich wünschte, es wäre Freitag.", it: "Vorrei che fosse venerdì.", pl: "Żeby już był piątek.", tr: "Keşke bugün cuma olsaydı.", id: "Andai saja sekarang hari Jumat.", vi: "Giá mà hôm nay là thứ Sáu." } }
        - { level: C1, point: { en: Lest, uk: "Lest", es: "Lest", pt: "Lest", fr: "Lest", de: "Lest", it: "Lest", pl: "Lest", tr: "Lest", id: "Lest", vi: "Lest" }, rule: { en: [{ term: lest }, " is formal and takes the base verb or ", { term: should }], uk: [{ term: "lest" }, " належить до офіційного стилю й вимагає початкової форми або ", { term: "should" }], es: [{ term: "lest" }, " es formal y lleva el verbo en forma base o ", { term: "should" }], pt: [{ term: "lest" }, " é formal e pede o verbo na forma base ou ", { term: "should" }], fr: [{ term: "lest" }, " est soutenu et se construit avec la base verbale ou ", { term: "should" }], de: [{ term: "lest" }, " ist förmlich und steht mit der Grundform oder mit ", { term: "should" }], it: [{ term: "lest" }, " è formale e vuole la forma base o ", { term: "should" }], pl: [{ term: "lest" }, " jest formalne i łączy się z formą podstawową lub z ", { term: "should" }], tr: [{ term: "lest" }, " resmîdir; yalın fiille ya da ", { term: "should" }, " ile kullanılır"], id: [{ term: "lest" }, " bersifat formal dan memakai kata kerja dasar atau ", { term: "should" }], vi: [{ term: "lest" }, " mang tính trang trọng và đi với động từ nguyên mẫu hoặc ", { term: "should" }] }, ex: ["She whispered lest the baby ", { target: wake }, "."], tr: { uk: "Вона шепотіла, щоб не розбудити дитину.", es: "Susurró para no despertar al bebé.", pt: "Ela sussurrou para não acordar o bebê.", fr: "Elle a chuchoté de peur de réveiller le bébé.", de: "Sie flüsterte, damit das Baby nicht aufwachte.", it: "Sussurrò per non svegliare il bambino.", pl: "Szeptała, żeby nie obudzić dziecka.", tr: "Bebeği uyandırmamak için fısıldadı.", id: "Dia berbisik agar bayinya tidak terbangun.", vi: "Cô ấy thì thầm để em bé không thức giấc." } }
        - { level: C2, point: { en: Fixed formulas, uk: "Усталені вислови", es: "Fórmulas fijas", pt: "Fórmulas fixas", fr: "Formules figées", de: "Feste Formeln", it: "Formule fisse", pl: "Stałe formuły", tr: "Kalıplaşmış ifadeler", id: "Ungkapan tetap", vi: "Cụm cố định" }, rule: { en: "old formulas keep the bare verb and are quoted whole", uk: "старі вислови зберігають початкову форму й цитуються цілком", es: "las fórmulas antiguas conservan el verbo en forma base y se citan enteras", pt: "as fórmulas antigas mantêm o verbo na forma base e são citadas por inteiro", fr: "les vieilles formules gardent la base verbale et se citent en bloc", de: "alte Formeln behalten die Grundform und werden als Ganzes zitiert", it: "le formule antiche conservano la forma base e si citano per intero", pl: "dawne formuły zachowują formę podstawową i cytuje się je w całości", tr: "eski kalıplar yalın fiili korur ve bütün olarak alıntılanır", id: "ungkapan lama mempertahankan kata kerja dasar dan dikutip utuh", vi: "các cụm cũ giữ động từ nguyên mẫu và được dẫn nguyên văn" }, ex: { examples: [["I'll be there, ", { target: come what may }, "."], [{ target: Suffice it to say }, " that we lost."]] }, tr: { uk: { examples: ["Я буду там, що б не сталося.", "Скажу лише, що ми програли."] }, es: { examples: ["Estaré allí, pase lo que pase.", "Baste decir que perdimos."] }, pt: { examples: ["Estarei lá, aconteça o que acontecer.", "Basta dizer que perdemos."] }, fr: { examples: ["J’y serai, quoi qu’il arrive.", "Qu’il suffise de dire que nous avons perdu."] }, de: { examples: ["Ich werde da sein, was auch geschieht.", "Es genügt zu sagen, dass wir verloren haben."] }, it: { examples: ["Ci sarò, qualunque cosa accada.", "Basti dire che abbiamo perso."] }, pl: { examples: ["Będę tam, cokolwiek się stanie.", "Dość powiedzieć, że przegraliśmy."] }, tr: { examples: ["Ne olursa olsun orada olacağım.", "Kaybettiğimizi söylemek yeter."] }, id: { examples: ["Saya akan datang, apa pun yang terjadi.", "Cukup dikatakan bahwa kami kalah."] }, vi: { examples: ["Tôi sẽ có mặt, dù chuyện gì xảy ra.", "Chỉ cần nói rằng chúng tôi đã thua."] } } }
        - { level: C2, point: { en: Be-clauses, uk: "Речення з be на початку", es: "Oraciones con be al inicio", pt: "Orações com be no início", fr: "Propositions en be", de: "Be-Sätze", it: "Proposizioni con be", pl: "Zdania z be na początku", tr: "Başta be olan cümlecikler", id: "Klausa be", vi: "Mệnh đề với be đứng đầu" }, rule: { en: [{ term: be }, " opens a formal concession with two alternatives"], uk: [{ term: "be" }, " відкриває офіційну поступку з двома варіантами"], es: [{ term: "be" }, " abre una concesión formal con dos alternativas"], pt: [{ term: "be" }, " abre uma concessão formal com duas alternativas"], fr: [{ term: "be" }, " ouvre une concession soutenue avec deux possibilités"], de: [{ term: "be" }, " eröffnet eine förmliche Einräumung mit zwei Alternativen"], it: [{ term: "be" }, " apre una concessione formale con due alternative"], pl: [{ term: "be" }, " otwiera formalne ustępstwo z dwiema możliwościami"], tr: [{ term: "be" }, ", iki seçenekli resmî bir ödünleme açar"], id: [{ term: "be" }, " membuka konsesi formal dengan dua pilihan"], vi: [{ term: "be" }, " mở đầu một vế nhượng bộ trang trọng với hai khả năng"] }, ex: [{ target: Be it large or small }, ", every gift helps."], tr: { uk: "Великий чи малий, кожен дарунок допомагає.", es: "Grande o pequeño, todo regalo ayuda.", pt: "Grande ou pequeno, todo presente ajuda.", fr: "Grand ou petit, chaque don aide.", de: "Ob groß oder klein, jede Gabe hilft.", it: "Grande o piccolo, ogni dono aiuta.", pl: "Duży czy mały, każdy dar pomaga.", tr: "Büyük de olsa küçük de olsa her bağış yardımcı olur.", id: "Besar atau kecil, setiap pemberian membantu.", vi: "Dù lớn hay nhỏ, món quà nào cũng giúp ích." } }
        - { level: C2, point: { en: Formal texts, uk: "Офіційні тексти", es: "Textos formales", pt: "Textos formais", fr: "Textes formels", de: "Förmliche Texte", it: "Testi formali", pl: "Teksty formalne", tr: "Resmî metinler", id: "Teks formal", vi: "Văn bản trang trọng" }, rule: { en: "orders, resolutions and motions keep the bare verb", uk: "накази, резолюції й пропозиції на зборах зберігають початкову форму", es: "las órdenes, las resoluciones y las mociones conservan el verbo en forma base", pt: "ordens, resoluções e moções mantêm o verbo na forma base", fr: "les ordres, les résolutions et les motions gardent la base verbale", de: "Anordnungen, Beschlüsse und Anträge behalten die Grundform", it: "ordini, delibere e mozioni conservano la forma base", pl: "nakazy, uchwały i wnioski zachowują formę podstawową", tr: "emirler, kararlar ve önergeler yalın fiili korur", id: "perintah, resolusi, dan mosi mempertahankan kata kerja dasar", vi: "mệnh lệnh, nghị quyết và kiến nghị giữ động từ nguyên mẫu" }, ex: ["I move that the minutes ", { target: be approved }, "."], tr: { uk: "Пропоную затвердити протокол.", es: "Propongo que se apruebe el acta.", pt: "Proponho que a ata seja aprovada.", fr: "Je propose que le procès-verbal soit approuvé.", de: "Ich beantrage, das Protokoll zu genehmigen.", it: "Propongo che il verbale sia approvato.", pl: "Wnioskuję o zatwierdzenie protokołu.", tr: "Tutanağın onaylanmasını öneriyorum.", id: "Saya mengusulkan agar notulen disetujui.", vi: "Tôi đề nghị thông qua biên bản." } }
        - { level: C2, point: { en: Proverbs, uk: "Прислів’я", es: "Refranes", pt: "Provérbios", fr: "Proverbes", de: "Sprichwörter", it: "Proverbi", pl: "Przysłowia", tr: "Atasözleri", id: "Peribahasa", vi: "Tục ngữ" }, rule: { en: "short sayings keep an older order and the bare verb", uk: "короткі приказки зберігають давній порядок слів і початкову форму", es: "los dichos breves conservan un orden antiguo y el verbo en forma base", pt: "ditos curtos mantêm uma ordem antiga e o verbo na forma base", fr: "les dictons courts gardent un ordre ancien et la base verbale", de: "kurze Sprüche behalten eine ältere Wortstellung und die Grundform", it: "i detti brevi conservano un ordine antico e la forma base", pl: "krótkie powiedzenia zachowują dawny szyk i formę podstawową", tr: "kısa sözler eski bir sözcük sırasını ve yalın fiili korur", id: "ungkapan pendek mempertahankan urutan kata lama dan kata kerja dasar", vi: "các câu nói ngắn giữ trật tự cũ và động từ nguyên mẫu" }, ex: [{ target: "Waste not, want not" }, "."], tr: { uk: "Не марнуй — не знатимеш нестатків.", es: "El que no desperdicia no pasa necesidad.", pt: "Quem não desperdiça não passa necessidade.", fr: "Qui ne gaspille pas ne manque de rien.", de: "Wer nichts verschwendet, dem fehlt nichts.", it: "Chi non spreca non manca di nulla.", pl: "Kto nie marnuje, niczego mu nie brakuje.", tr: "Israf etmeyen sıkıntı çekmez.", id: "Siapa tidak memboroskan, tidak akan kekurangan.", vi: "Không lãng phí thì không thiếu thốn." } }
        - { level: C1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: suggest }, " takes a ", { term: that }, " clause or ", { slot: -ing }], uk: [{ term: "suggest" }, " вимагає підрядного речення з ", { term: "that" }, " або ", { slot: "-ing" }], es: [{ term: "suggest" }, " lleva una oración con ", { term: "that" }, " o ", { slot: "-ing" }], pt: [{ term: "suggest" }, " pede uma oração com ", { term: "that" }, " ou ", { slot: "-ing" }], fr: [{ term: "suggest" }, " se construit avec une proposition en ", { term: "that" }, " ou avec ", { slot: "-ing" }], de: [{ term: "suggest" }, " steht mit einem ", { term: "that" }, "-Satz oder mit ", { slot: "-ing" }], it: [{ term: "suggest" }, " regge una proposizione con ", { term: "that" }, " oppure ", { slot: "-ing" }], pl: [{ term: "suggest" }, " łączy się ze zdaniem z ", { term: "that" }, " albo z ", { slot: "-ing" }], tr: [{ term: "suggest" }, ", ", { term: "that" }, " cümleciği ya da ", { slot: "-ing" }, " alır"], id: [{ term: "suggest" }, " memakai klausa ", { term: "that" }, " atau ", { slot: "-ing" }], vi: [{ term: "suggest" }, " đi với mệnh đề ", { term: "that" }, " hoặc ", { slot: "-ing" }] }, ex: { examples: [["I suggest that he ", { target: go }, "."], ["I suggest ", { target: going }, " early."]] }, tr: { uk: { examples: ["Я пропоную, щоб він пішов.", "Я пропоную піти рано."] }, es: { examples: ["Sugiero que él vaya.", "Sugiero ir temprano."] }, pt: { examples: ["Sugiro que ele vá.", "Sugiro ir cedo."] }, fr: { examples: ["Je suggère qu’il y aille.", "Je suggère d’y aller tôt."] }, de: { examples: ["Ich schlage vor, dass er geht.", "Ich schlage vor, früh zu gehen."] }, it: { examples: ["Suggerisco che vada.", "Suggerisco di andare presto."] }, pl: { examples: ["Proponuję, żeby poszedł.", "Proponuję pójść wcześnie."] }, tr: { examples: ["Onun gitmesini öneriyorum.", "Erken gitmeyi öneriyorum."] }, id: { examples: ["Saya menyarankan agar dia pergi.", "Saya menyarankan pergi lebih awal."] }, vi: { examples: ["Tôi đề nghị anh ấy đi.", "Tôi đề nghị đi sớm."] } } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The subjunctive is the bare base verb, the same for every person and every time.", uk: "Суб’юнктив — це чиста початкова форма дієслова, однакова для всіх осіб і всіх часів.", es: "El subjuntivo es el verbo en forma base, igual para todas las personas y en cualquier tiempo.", pt: "O subjuntivo é o verbo na forma base, igual para todas as pessoas e em qualquer tempo.", fr: "Le subjonctif est la base verbale nue, la même pour toutes les personnes et à tous les temps.", de: "Der Konjunktiv ist die bloße Grundform, für jede Person und jede Zeit gleich.", it: "Il congiuntivo è la sola forma base del verbo, uguale per ogni persona e in ogni tempo.", pl: "Tryb łączący to sama forma podstawowa czasownika, taka sama dla wszystkich osób i we wszystkich czasach.", tr: "Dilek kipi, yalın fiilin kendisidir; her kişi ve her zaman için aynıdır.", id: "Subjungtif adalah kata kerja dasar apa adanya, sama untuk semua orang dan semua tense.", vi: "Thức giả định là động từ nguyên mẫu trơn, giống nhau cho mọi ngôi và mọi thì." }
            ex: ["The board asks that every member ", { target: vote }, "."]
            tr: { uk: "Рада просить, щоб кожен її член проголосував.", es: "La junta pide que cada miembro vote.", pt: "O conselho pede que todos os membros votem.", fr: "Le conseil demande que chaque membre vote.", de: "Der Vorstand bittet darum, dass jedes Mitglied abstimmt.", it: "Il consiglio chiede che ogni membro voti.", pl: "Zarząd prosi, żeby każdy członek zagłosował.", tr: "Yönetim kurulu her üyenin oy kullanmasını istiyor.", id: "Dewan meminta agar setiap anggota memberikan suara.", vi: "Hội đồng yêu cầu mỗi thành viên đều bỏ phiếu." }
          - type: rule
            level: C1
            text: { en: "It names what is wanted, needed, proposed or imagined.", uk: "Він називає те, чого хочуть, що потрібне, що пропонують або уявляють.", es: "Expresa lo que se quiere, se necesita, se propone o se imagina.", pt: "Expressa o que se quer, o que é preciso, o que se propõe ou o que se imagina.", fr: "Il exprime ce qu’on veut, ce qui est nécessaire, ce qu’on propose ou ce qu’on imagine.", de: "Er nennt, was gewollt, nötig, vorgeschlagen oder vorgestellt wird.", it: "Esprime ciò che si vuole, serve, si propone o si immagina.", pl: "Wyraża to, czego się chce, co jest potrzebne, co się proponuje lub wyobraża.", tr: "İstenen, gereken, önerilen ya da hayal edilen şeyi anlatır.", id: "Bentuk ini menyatakan hal yang diinginkan, dibutuhkan, diusulkan, atau dibayangkan.", vi: "Nó nêu điều được muốn, cần, đề xuất hoặc tưởng tượng." }
          - type: rule
            level: C1
            text: { en: ["Formal writing and speech use it most; everyday speech often chooses ", { term: should }, " or an ordinary verb."], uk: ["Найчастіше його вживають в офіційних текстах і мовленні; у повсякденній мові частіше обирають ", { term: "should" }, " або звичайне дієслово."], es: ["Se usa sobre todo en la escritura y el habla formales; en la conversación diaria se prefiere a menudo ", { term: "should" }, " o un verbo común."], pt: ["Usa-se mais na escrita e na fala formais; na conversa do dia a dia, costuma-se escolher ", { term: "should" }, " ou um verbo comum."], fr: ["On l’emploie surtout à l’écrit et à l’oral soutenus ; dans la conversation courante, on choisit souvent ", { term: "should" }, " ou un verbe ordinaire."], de: ["Man verwendet ihn vor allem in förmlicher Schrift- und Redeweise; im Alltag wählt man oft ", { term: "should" }, " oder ein gewöhnliches Verb."], it: ["Si usa soprattutto nello scritto e nel parlato formali; nel parlare quotidiano si sceglie spesso ", { term: "should" }, " o un verbo ordinario."], pl: ["Używa się go głównie w piśmie i mowie formalnej; na co dzień często wybiera się ", { term: "should" }, " lub zwykły czasownik."], tr: ["En çok resmî yazıda ve konuşmada kullanılır; günlük konuşmada çoğu zaman ", { term: "should" }, " ya da sıradan bir fiil seçilir."], id: ["Bentuk ini paling sering dipakai dalam tulisan dan ucapan formal; dalam percakapan sehari-hari orang sering memilih ", { term: "should" }, " atau kata kerja biasa."], vi: ["Văn viết và lời nói trang trọng dùng nó nhiều nhất; lời nói hằng ngày thường chọn ", { term: "should" }, " hoặc một động từ thông thường."] }
          - type: rule
            level: C2
            text: { en: "It survives in fixed formulas, be-clauses, legal language and proverbs, which speakers quote whole.", uk: "Він зберігся в усталених висловах, реченнях з be на початку, юридичній мові та прислів’ях, які цитують цілком.", es: "Sobrevive en fórmulas fijas, oraciones con be al inicio, lenguaje jurídico y refranes, que se citan enteros.", pt: "Sobrevive em fórmulas fixas, orações com be no início, linguagem jurídica e provérbios, que se citam por inteiro.", fr: "Il survit dans des formules figées, des propositions en be, le langage juridique et les proverbes, qu’on cite en bloc.", de: "Er hat sich in festen Formeln, Be-Sätzen, Rechtssprache und Sprichwörtern erhalten, die man als Ganzes zitiert.", it: "Sopravvive in formule fisse, proposizioni con be, linguaggio giuridico e proverbi, che si citano per intero.", pl: "Przetrwał w stałych formułach, zdaniach z be na początku, języku prawniczym i przysłowiach, które cytuje się w całości.", tr: "Kalıplaşmış ifadelerde, başta be olan cümleciklerde, hukuk dilinde ve atasözlerinde yaşar; bunlar bütün olarak alıntılanır.", id: "Bentuk ini bertahan dalam ungkapan tetap, klausa be, bahasa hukum, dan peribahasa, yang dikutip utuh.", vi: "Nó còn tồn tại trong các cụm cố định, mệnh đề với be đứng đầu, ngôn ngữ pháp lý và tục ngữ, những thứ được dẫn nguyên văn." }

