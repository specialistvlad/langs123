              fr: "Un verbe moyen est à l’actif et ne nomme pas d’agent ; son sens est passif."
              de: "Ein Mediopassiv-Verb steht im Aktiv und nennt keinen Handelnden; seine Bedeutung ist passivisch."
              it: "Un verbo medio è attivo e non nomina l'agente; il suo significato è passivo."
              pl: "Czasownik medialny jest w stronie czynnej i nie nazywa wykonawcy; jego znaczenie jest bierne."
              tr: "Orta çatılı fiil etkendir ve yapanı belirtmez; anlamı edilgendir."
              id: "Kata kerja medial berbentuk aktif dan tidak menyebut pelaku; maknanya pasif."
              vi: "Động từ ở thể trung gian có dạng chủ động và không nêu người thực hiện; nghĩa của nó là bị động."

