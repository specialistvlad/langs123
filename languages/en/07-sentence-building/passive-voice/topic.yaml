          - { level: B1, use: { en: The doer is obvious or unimportant, uk: "Виконавець очевидний або неважливий", es: "El agente es obvio o poco importante", pt: "O agente é óbvio ou pouco importante", fr: "L’agent est évident ou sans importance", de: "Der Handelnde ist offensichtlich oder unwichtig", it: "L'agente è ovvio o poco importante", pl: "Wykonawca jest oczywisty lub nieistotny", tr: "Yapan belli ya da önemsiz", id: "Pelaku sudah jelas atau tidak penting", vi: "Người thực hiện hiển nhiên hoặc không quan trọng" }, ex: ["The room ", { target: is cleaned }, " every day."], tr: { uk: "Кімнату прибирають щодня.", es: "La habitación se limpia todos los días.", pt: "O quarto é limpo todos os dias.", fr: "La pièce est nettoyée tous les jours.", de: "Das Zimmer wird jeden Tag gereinigt.", it: "La stanza viene pulita ogni giorno.", pl: "Pokój jest sprzątany codziennie.", tr: "Oda her gün temizlenir.", id: "Kamar itu dibersihkan setiap hari.", vi: "Căn phòng được dọn dẹp mỗi ngày." } }
          - { level: B1, use: { en: Processes and how things are made, uk: "Процеси й спосіб виготовлення речей", es: "Procesos y cómo se hacen las cosas", pt: "Processos e como as coisas são feitas", fr: "Processus et façon dont les choses sont faites", de: "Vorgänge und wie Dinge hergestellt werden", it: "Processi e modo in cui si fanno le cose", pl: "Procesy i sposób wytwarzania rzeczy", tr: "Süreçler ve bir şeyin nasıl yapıldığı", id: "Proses dan cara benda dibuat", vi: "Quy trình và cách làm ra sự vật" }, ex: ["Wine ", { target: is made }, " from grapes."], tr: { uk: "Вино виготовляють із винограду.", es: "El vino se hace con uvas.", pt: "O vinho é feito de uvas.", fr: "Le vin est fait à partir de raisin.", de: "Wein wird aus Trauben gemacht.", it: "Il vino si fa con l'uva.", pl: "Wino jest produkowane z winogron.", tr: "Şarap üzümden yapılır.", id: "Anggur dibuat dari buah anggur.", vi: "Rượu vang được làm từ nho." } }
          - { level: B1, use: { en: "News, notices and formal writing", uk: "Новини, оголошення й офіційне письмо", es: "Noticias, avisos y textos formales", pt: "Notícias, avisos e textos formais", fr: "Actualités, avis et écrits formels", de: "Nachrichten, Hinweise und förmliche Texte", it: "Notizie, avvisi e testi formali", pl: "Wiadomości, ogłoszenia i pismo formalne", tr: "Haberler, duyurular ve resmî yazı", id: "Berita, pengumuman, dan tulisan formal", vi: "Tin tức, thông báo và văn viết trang trọng" }, ex: ["Two people ", { target: were arrested }, " last night."], tr: { uk: "Минулої ночі заарештували двох людей.", es: "Anoche arrestaron a dos personas.", pt: "Duas pessoas foram presas ontem à noite.", fr: "Deux personnes ont été arrêtées la nuit dernière.", de: "Zwei Personen wurden letzte Nacht festgenommen.", it: "Ieri sera due persone sono state arrestate.", pl: "Dwie osoby zostały aresztowane zeszłej nocy.", tr: "Dün gece iki kişi tutuklandı.", id: "Dua orang ditangkap tadi malam.", vi: "Đêm qua hai người đã bị bắt." } }
          - { level: B1, use: { en: The receiver is the topic, uk: "Одержувач дії — тема речення", es: "El receptor es el tema", pt: "O receptor é o assunto", fr: "Celui qui subit l’action est le thème", de: "Der Empfänger ist das Thema", it: "Chi riceve l'azione è l'argomento", pl: "Odbiorca czynności jest tematem zdania", tr: "Eylemden etkilenen, cümlenin konusudur", id: "Penerima tindakan menjadi topik", vi: "Đối tượng chịu tác động là chủ đề" }, ex: ["Our teacher ", { target: was given }, " a prize."], tr: { uk: "Нашому вчителеві вручили нагороду.", es: "A nuestro profesor le dieron un premio.", pt: "Nosso professor recebeu um prêmio.", fr: "Notre professeur s’est vu remettre un prix.", de: "Unserem Lehrer wurde ein Preis verliehen.", it: "Al nostro insegnante è stato consegnato un premio.", pl: "Naszemu nauczycielowi wręczono nagrodę.", tr: "Öğretmenimize bir ödül verildi.", id: "Guru kami diberi hadiah.", vi: "Giáo viên của chúng tôi được trao một giải thưởng." } }

  - title: { en: Passive in formal and academic writing }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, pattern: { pattern: [It, be, { slot: V-ed }, that, { slot: clause }] }, use: { en: "reports a finding or a decision" }, ex: ["It ", { target: was found that }, " the samples were damaged."] }
          - { level: C1, pattern: { pattern: [It, be, { slot: V-ed }, that, { slot: clause }] }, use: { en: "makes a request or a rule formal" }, ex: ["It ", { target: is requested that }, " visitors sign in."] }
          - { level: C1, pattern: { pattern: [{ slot: noun }, be, { slot: V-ed }] }, use: { en: "method and process: the doer does not matter" }, ex: ["The samples ", { target: were heated }, " to 80 degrees."] }

  - title: { en: Choosing the passive }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Reason } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, use: { en: "known information first, new information last" }, ex: ["We visited the museum. It ", { target: was designed by }, " a young architect."] }
          - { level: C1, use: { en: "a long doer goes at the end" }, ex: ["The prize ", { target: was won by }, " a team of students from three universities."] }
          - { level: C1, use: { en: "the same subject across sentences" }, ex: ["Anna joined the firm in May. She ", { target: was promoted }, " within a year."] }

  - title: { en: "Need and want with -ing" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: use, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, pattern: { pattern: [need, { slot: V-ing }] }, use: { en: "needs to be done" }, ex: ["The car ", { target: needs washing }, "."] }
          - { level: C1, pattern: { pattern: [{ alternatives: [want, deserve, bear] }, { slot: V-ing }] }, use: { en: "wants, deserves or can take being done" }, ex: { examples: [["Your hair ", { target: wants cutting }, ". ", { variant: { target: needs cutting }, variety: en-US }], ["His words ", { target: bear repeating }, "."]] } }

  - title: { en: "Compare: state and event" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: state, label: { en: State } }
          - { key: event, label: { en: Event } }
        rows:
          - { level: C1, state: { en: "a result that exists now; the participle works as an adjective" }, event: { en: "an action that someone does" } }
          - { level: C1, state: ["The door ", { target: is closed }, " now."], event: ["The door ", { target: was closed }, " by the guard."] }
          - { level: C1, state: ["The window ", { target: is broken }, "."], event: ["The window ", { target: was broken }, " by a ball."] }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              en: [{ term: very }, " and ", { term: quite }, " can modify a participle used as an adjective."]
            ex: ["She is ", { target: very worried }, "."]

  - title: { en: Middle voice }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: use, label: { en: Use } }
