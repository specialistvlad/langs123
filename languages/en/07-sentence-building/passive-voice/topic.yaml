# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.passive-voice
lang: en
kind: grammar
tags: [passive, verbs, participle]
concepts: [passive]
related: [en.sentence-building.relative-clauses, en.sentence-building.reported-speech, en.tenses.perfect-tenses, en.tenses.simple-tenses, en.tenses.future-forms]
status: { en: draft, uk: draft, es: draft }

title: { en: Passive Voice, uk: Пасивний стан, es: La voz pasiva }
summary:
  lead:
    en: [The passive (, { pattern: [be, { slot: past participle }] }, ") puts the receiver of the action first, for an unknown or unimportant doer, a process or formal writing."]
    uk: ["Пасивний стан (", { pattern: [be, { slot: past participle }] }, ") ставить на перше місце об’єкт дії, коли виконавець невідомий чи неважливий, а також для процесів і офіційного письма."]
    es: ["La voz pasiva (", { pattern: [be, { slot: past participle }] }, ") pone primero al receptor de la acción: agente desconocido o irrelevante, procesos, textos formales."]
  rule:
    en: "Be changes with the tense and the participle stays:"
    uk: "Be змінюється за часом, а 3-тя форма дієслова лишається тією самою:"
    es: "Be cambia con el tiempo verbal y el participio no cambia:"
  ex: ["English ", { target: is spoken }, " here."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: B1, point: { en: Form, uk: "Форма", es: "Forma" }, rule: { en: ["the object becomes the subject; ", { pattern: [be, { slot: past participle }] }], uk: ["додаток стає підметом; ", { pattern: [be, { slot: past participle }] }], es: ["el objeto pasa a ser el sujeto; ", { pattern: [be, { slot: past participle }] }] }, ex: { mapping: [Shakespeare wrote Hamlet., ["Hamlet ", { target: was written }, " by Shakespeare."]] }, tr: { uk: { mapping: ["Шекспір написав «Гамлета».", "«Гамлет» був написаний Шекспіром."] }, es: { mapping: ["Shakespeare escribió Hamlet.", "Hamlet fue escrito por Shakespeare."] } } }
        - { level: B1, point: { en: Present simple, uk: "Present Simple", es: "Presente simple" }, rule: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ed }] }, ex: ["English ", { target: is spoken }, " here."], tr: { uk: "Тут розмовляють англійською.", es: "Aquí se habla inglés." } }
        - { level: B1, point: { en: Past simple, uk: "Past Simple", es: "Pasado simple" }, rule: { pattern: [{ alternatives: [was, were] }, { slot: V-ed }] }, ex: ["The bridge ", { target: was built }, " in ", { date: "1990", value: "1990" }, "."], tr: { uk: "Міст збудували 1990 року.", es: "El puente fue construido en 1990." } }
        - { level: B1, point: { en: Present perfect, uk: "Present Perfect", es: "Presente perfecto" }, rule: { pattern: [[{ alternatives: [has, have] }, " been"], { slot: V-ed }] }, ex: ["The window ", { target: has been broken }, "."], tr: { uk: "Вікно розбито.", es: "La ventana ha sido rota." } }
        - { level: B1, point: "will, can, must", rule: { pattern: [[{ alternatives: [will, can, must] }, " be"], { slot: V-ed }] }, ex: ["The results ", { target: will be sent }, " tomorrow."], tr: { uk: "Результати надішлють завтра.", es: "Los resultados se enviarán mañana." } }
        - { level: B1, point: { en: "Negative, question", uk: "Заперечення, питання", es: "Negación, pregunta" }, rule: { en: ["negative: ", { pattern: [be, not, { slot: V-ed }] }, "; question: ", { pattern: [be, { slot: subject }, { slot: V-ed }] }], uk: ["заперечення: ", { pattern: [be, not, { slot: V-ed }] }, "; питання: ", { pattern: [be, { slot: subject }, { slot: V-ed }] }], es: ["negación: ", { pattern: [be, not, { slot: V-ed }] }, "; pregunta: ", { pattern: [be, { slot: subject }, { slot: V-ed }] }] }, ex: { examples: [["The room ", { target: wasn't cleaned }, "."], [{ target: Was }, " the room ", { target: cleaned }, "?"]] }, tr: { uk: { examples: ["Кімнату не прибирали.", "Кімнату прибрали?"] }, es: { examples: ["La habitación no se limpió.", "¿Se limpió la habitación?"] } } }
        - { level: B1, point: { en: Use, uk: "Вживання", es: "Uso" }, rule: { en: "unknown or unimportant doer, processes, news, formal writing", uk: "невідомий чи неважливий виконавець, процеси, новини, офіційне письмо", es: "agente desconocido o poco importante, procesos, noticias, textos formales" }, ex: { examples: [["My phone ", { target: was stolen }, " on the train."], ["Wine ", { target: is made }, " from grapes."]] }, tr: { uk: { examples: ["Мій телефон украли в потязі.", "Вино виготовляють із винограду."] }, es: { examples: ["Me robaron el teléfono en el tren.", "El vino se hace con uvas."] } } }
        - { level: B1, point: { alternatives: [by, with] }, rule: { en: [{ term: by }, " names a new or important doer; ", { term: with }, " names a tool"], uk: [{ term: by }, " називає нового чи важливого виконавця; ", { term: with }, " називає знаряддя"], es: [{ term: by }, " introduce al agente nuevo o importante; ", { term: with }, " introduce una herramienta"] }, ex: ["The song ", { target: was written by }, " Adele."], tr: { uk: "Цю пісню написала Адель.", es: "La canción fue escrita por Adele." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: ["verbs without an object stay active: ", { alternatives: [happen, arrive, die] }], uk: ["дієслова без додатка лишаються в активному стані: ", { alternatives: [happen, arrive, die] }], es: ["los verbos sin objeto se quedan en voz activa: ", { alternatives: [happen, arrive, die] }] }, ex: ["The accident ", { target: happened }, " yesterday."], tr: { uk: "Аварія сталася вчора.", es: "El accidente ocurrió ayer." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: "use the past participle: made, written, sold, taken", uk: "вживай 3-тю форму дієслова: made, written, sold, taken", es: "usa el participio pasado: made, written, sold, taken" }, ex: ["The window was ", { target: broken }, "."], tr: { uk: "Вікно було розбите.", es: "La ventana estaba rota." } }

sections:
  - title: { en: "Form: active to passive", uk: "Форма: від активного до пасивного стану", es: "Forma: de la voz activa a la pasiva" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: active, label: { en: Active, uk: "Активний стан", es: "Voz activa" }, features: { voice: act } }
          - { key: passive, label: { en: Passive, uk: "Пасивний стан", es: "Voz pasiva" }, features: { voice: pass } }
        rows:
          - { level: B1, active: ["Shakespeare ", { target: wrote }, " Hamlet."], passive: ["Hamlet ", { target: was written }, " by Shakespeare."] }
          - { level: B1, active: ["They ", { target: sell }, " tickets online."], passive: ["Tickets ", { target: are sold }, " online."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The object of the active sentence becomes the subject of the passive.
              uk: "Додаток активного речення стає підметом пасивного."
              es: "El objeto de la oración activa pasa a ser el sujeto de la pasiva."
          - type: rule
            level: B1
            text:
              en: ["The verb is ", { term: be }, " in the tense of the active verb, plus the past participle."]
              uk: ["Дієслово ", { term: be }, " стоїть у тому ж часі, що й дієслово активного речення, а далі йде 3-тя форма дієслова (Past Participle)."]
              es: ["El verbo ", { term: be }, " va en el mismo tiempo que el verbo activo, seguido del participio pasado."]
          - type: rule
            level: B1
            text:
              en: "Verbs with an object have a passive. happen, arrive, die and sleep have an active form only."
              uk: "Дієслова з додатком мають пасивну форму. Дієслова happen, arrive, die і sleep мають лише активну форму."
              es: "Los verbos con objeto tienen pasiva. Los verbos happen, arrive, die y sleep solo tienen forma activa."

  - title: { en: "Form: tenses", uk: "Форма: часи", es: "Forma: tiempos verbales" }
    role: form
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense, uk: "Час", es: "Tiempo" } }
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, tense: Present simple, form: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ed }] }, ex: ["English ", { target: is spoken }, " here."], tr: { uk: "Тут розмовляють англійською.", es: "Aquí se habla inglés." } }
          - { level: B1, tense: Past simple, form: { pattern: [{ alternatives: [was, were] }, { slot: V-ed }] }, ex: ["The bridge ", { target: was built }, " in ", { date: "1990", value: "1990" }, "."], tr: { uk: "Міст збудували 1990 року.", es: "El puente fue construido en 1990." } }
          - { level: B1, tense: Present perfect, form: { pattern: [[{ alternatives: [has, have] }, " been"], { slot: V-ed }] }, ex: ["The window ", { target: has been broken }, "."], tr: { uk: "Вікно розбито.", es: "La ventana ha sido rota." } }
          - { level: B1, tense: will, form: { pattern: [will be, { slot: V-ed }] }, ex: ["The results ", { target: will be sent }, " tomorrow."], tr: { uk: "Результати надішлють завтра.", es: "Los resultados se enviarán mañana." } }
          - { level: B1, tense: { alternatives: [can, must] }, form: { pattern: [[{ alternatives: [can, must] }, " be"], { slot: V-ed }] }, ex: ["The door ", { target: must be locked }, "."], tr: { uk: "Двері мають бути замкнені.", es: "La puerta debe estar cerrada con llave." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "V-ed = past participle: made, written, sold, taken, built."
              uk: "V-ed — це 3-тя форма дієслова (Past Participle): made, written, sold, taken, built."
              es: "V-ed es el participio pasado: made, written, sold, taken, built."
          - type: rule
            level: B1
            text:
              en: ["Irregular participles are in the ", { link: irregular verbs table, to: en.verbs.irregular-verbs-table }, "."]
              uk: ["3-ті форми неправильних дієслів див. ", { link: "Таблиця неправильних дієслів", to: en.verbs.irregular-verbs-table }, "."]
              es: ["Los participios irregulares están en la ", { link: "Tabla de verbos irregulares", to: en.verbs.irregular-verbs-table }, "."]

  - title: { en: "Form: negatives and questions", uk: "Форма: заперечення й питання", es: "Forma: negación y preguntas" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, features: { polarity: neg, interrogativity: decl }, type: { en: Negative, uk: "Заперечення", es: "Negación" }, pattern: { pattern: [be, not, { slot: V-ed }] }, ex: ["The room ", { target: wasn't cleaned }, "."] }
          - { level: B1, features: { polarity: pos, interrogativity: int }, type: { en: Question, uk: "Питання", es: "Pregunta" }, pattern: { pattern: [be, { slot: subject }, { slot: V-ed }] }, ex: [{ target: Was }, " the room ", { target: cleaned }, "?"] }
          - { level: B1, features: { interrogativity: int }, type: Wh-question, pattern: { pattern: [{ slot: wh-word }, be, { slot: subject }, { slot: V-ed }] }, ex: ["When ", { target: was }, " it ", { target: built }, "?"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The first auxiliary changes position: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]
              uk: ["Перше допоміжне дієслово змінює місце: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]
              es: ["El primer verbo auxiliar cambia de posición: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]

  - title: { en: ["Form: ", { pattern: [by, { slot: agent }] }], uk: ["Форма: ", { pattern: [by, { slot: agent }] }], es: ["Forma: ", { pattern: [by, { slot: agent }] }] }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: introduces, label: { en: Introduces, uk: "Вводить", es: "Introduce" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, word: by, introduces: { en: the doer, uk: "виконавця дії", es: "al agente" }, ex: ["The song ", { target: was written by }, " Adele."], tr: { uk: "Цю пісню написала Адель.", es: "La canción fue escrita por Adele." } }
          - { level: B1, word: with, introduces: { en: a tool or material, uk: "знаряддя або матеріал", es: "una herramienta o un material" }, ex: ["The door ", { target: was opened with }, " a key."], tr: { uk: "Двері відчинили ключем.", es: "La puerta se abrió con una llave." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ pattern: [{ term: by }, { slot: agent }] }, " goes at the end of the clause."]
              uk: [{ pattern: [{ term: by }, { slot: agent }] }, " стоїть наприкінці речення."]
              es: [{ pattern: [{ term: by }, { slot: agent }] }, " va al final de la oración."]
          - type: rule
            level: B1
            text:
              en: The agent is added when it is new or important information.
              uk: "Виконавця вказують, коли це нова або важлива інформація."
              es: "El agente se añade cuando es información nueva o importante."

  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, use: { en: The doer is unknown, uk: "Виконавець невідомий", es: "El agente es desconocido" }, ex: ["My phone ", { target: was stolen }, " on the train."], tr: { uk: "Мій телефон украли в потязі.", es: "Me robaron el teléfono en el tren." } }
          - { level: B1, use: { en: The doer is obvious or unimportant, uk: "Виконавець очевидний або неважливий", es: "El agente es obvio o poco importante" }, ex: ["The room ", { target: is cleaned }, " every day."], tr: { uk: "Кімнату прибирають щодня.", es: "La habitación se limpia todos los días." } }
          - { level: B1, use: { en: Processes and how things are made, uk: "Процеси й спосіб виготовлення речей", es: "Procesos y cómo se hacen las cosas" }, ex: ["Wine ", { target: is made }, " from grapes."], tr: { uk: "Вино виготовляють із винограду.", es: "El vino se hace con uvas." } }
          - { level: B1, use: { en: "News, notices and formal writing", uk: "Новини, оголошення й офіційне письмо", es: "Noticias, avisos y textos formales" }, ex: ["Two people ", { target: were arrested }, " last night."], tr: { uk: "Минулої ночі заарештували двох людей.", es: "Anoche arrestaron a dos personas." } }
          - { level: B1, use: { en: The receiver is the topic, uk: "Одержувач дії — тема речення", es: "El receptor es el tema" }, ex: ["Our teacher ", { target: was given }, " a prize."], tr: { uk: "Нашому вчителеві вручили нагороду.", es: "A nuestro profesor le dieron un premio." } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: English speaks here., right: ["English ", { target: is spoken }, " here."], rule: { en: { takes: [the subject receives the action, { pattern: [be, { slot: V-ed }] }] }, uk: { takes: ["підмет отримує дію", { pattern: [be, { slot: V-ed }] }] }, es: { takes: ["el sujeto recibe la acción", { pattern: [be, { slot: V-ed }] }] } } }
          - { level: B1, wrong: ["The bridge built in ", { date: "1990", value: "1990" }, "."], right: ["The bridge ", { target: was built }, " in ", { date: "1990", value: "1990" }, "."], rule: { en: the passive needs be, uk: "пасивний стан потребує be", es: "la pasiva necesita be" } }
          - { level: B1, wrong: The window was broke., right: ["The window was ", { target: broken }, "."], rule: { en: use the past participle, uk: "вживай 3-тю форму дієслова (Past Participle)", es: "usa el participio pasado" } }
          - { level: B1, wrong: The accident was happened yesterday., right: ["The accident ", { target: happened }, " yesterday."], rule: { en: "happen, arrive and die have no passive", uk: "happen, arrive і die не мають пасивної форми", es: "happen, arrive y die no tienen pasiva" } }
          - { level: B1, wrong: The book was written from Orwell., right: ["The book was written ", { target: by }, " Orwell."], rule: { en: { mapping: [agent, by] }, uk: { mapping: ["виконавець", by] }, es: { mapping: ["agente", by] } } }
          - { level: B1, wrong: { exchange: [Was the room cleaned?, "Yes, it cleaned."] }, right: ["Yes, it ", { target: was }, "."], rule: { en: the short answer repeats be, uk: "коротка відповідь повторює be", es: "la respuesta corta repite be" } }
