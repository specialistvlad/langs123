        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["verbs without an object stay active: ", { alternatives: [{ term: happen }, { term: arrive }, { term: die }] }], uk: ["дієслова без додатка лишаються в активному стані: ", { alternatives: [{ term: happen }, { term: arrive }, { term: die }] }], es: ["los verbos sin objeto se quedan en voz activa: ", { alternatives: [{ term: happen }, { term: arrive }, { term: die }] }], pt: ["verbos sem objeto ficam na voz ativa: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], fr: ["les verbes sans complément restent à l’actif : ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], de: ["Verben ohne Objekt bleiben im Aktiv: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], it: ["i verbi senza complemento oggetto restano attivi: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], pl: ["czasowniki bez dopełnienia zostają w stronie czynnej: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], tr: ["nesnesi olmayan fiiller etken kalır: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], id: ["kata kerja tanpa objek tetap aktif: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }], vi: ["động từ không có tân ngữ giữ nguyên dạng chủ động: ", { alternatives: [{ term: "happen" }, { term: "arrive" }, { term: "die" }] }] }, ex: ["The accident ", { target: happened }, " yesterday."], tr: { uk: "Аварія сталася вчора.", es: "El accidente ocurrió ayer.", pt: "O acidente aconteceu ontem.", fr: "L’accident s’est produit hier.", de: "Der Unfall ist gestern passiert.", it: "L'incidente è avvenuto ieri.", pl: "Wypadek wydarzył się wczoraj.", tr: "Kaza dün oldu.", id: "Kecelakaan itu terjadi kemarin.", vi: "Vụ tai nạn đã xảy ra hôm qua." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: ["use the past participle: ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }], uk: ["вживай 3-тю форму дієслова: ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }], es: ["usa el participio pasado: ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }], pt: ["usa-se o particípio passado: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], fr: ["employer le participe passé : ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], de: ["das Past Participle verwenden: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], it: ["si usa il participio passato: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], pl: ["używa się III formy czasownika: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], tr: ["past participle kullanılır: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], id: ["pakai past participle: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }], vi: ["dùng quá khứ phân từ: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }] }, ex: ["The window was ", { target: broken }, "."], tr: { uk: "Вікно було розбите.", es: "La ventana estaba rota.", pt: "A janela estava quebrada.", fr: "La fenêtre était cassée.", de: "Das Fenster war zerbrochen.", it: "La finestra era rotta.", pl: "Okno było rozbite.", tr: "Pencere kırılmıştı.", id: "Jendelanya pecah.", vi: "Cửa sổ đã bị vỡ." } }

sections:
  - title: { en: "Form: active to passive", uk: "Форма: від активного до пасивного стану", es: "Forma: de la voz activa a la pasiva", pt: "Forma: da voz ativa para a passiva", fr: "Forme : de l’actif au passif", de: "Form: vom Aktiv zum Passiv", it: "Forma: dalla forma attiva a quella passiva", pl: "Forma: ze strony czynnej na bierną", tr: "Biçim: etkenden edilgene", id: "Bentuk: dari aktif ke pasif", vi: "Dạng: từ câu chủ động sang câu bị động" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: active, label: { en: Active, uk: "Активний стан", es: "Voz activa", pt: "Voz ativa", fr: "Actif", de: "Aktiv", it: "Forma attiva", pl: "Strona czynna", tr: "Etken", id: "Aktif", vi: "Chủ động" }, features: { voice: act } }
          - { key: passive, label: { en: Passive, uk: "Пасивний стан", es: "Voz pasiva", pt: "Voz passiva", fr: "Passif", de: "Passiv", it: "Forma passiva", pl: "Strona bierna", tr: "Edilgen", id: "Pasif", vi: "Bị động" }, features: { voice: pass } }
        rows:
          - { level: B1, active: ["Shakespeare ", { target: wrote }, " Hamlet."], passive: ["Hamlet ", { target: was written }, " by Shakespeare."] }
          - { level: B1, active: ["They ", { target: sell }, " tickets online."], passive: ["Tickets ", { target: are sold }, " online."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The object of the active sentence becomes the subject of the passive.
              uk: "Додаток активного речення стає підметом пасивного."
              es: "El objeto de la oración activa pasa a ser el sujeto de la pasiva."
              pt: "O objeto da frase ativa passa a ser o sujeito da passiva."
              fr: "Le complément de la phrase active devient le sujet de la phrase passive."
              de: "Das Objekt des Aktivsatzes wird zum Subjekt des Passivsatzes."
              it: "Il complemento oggetto della frase attiva diventa il soggetto della frase passiva."
              pl: "Dopełnienie zdania w stronie czynnej staje się podmiotem zdania w stronie biernej."
              tr: "Etken cümlenin nesnesi, edilgen cümlenin öznesi olur."
              id: "Objek kalimat aktif menjadi subjek kalimat pasif."
              vi: "Tân ngữ của câu chủ động trở thành chủ ngữ của câu bị động."
          - type: rule
            level: B1
            text:
              en: ["The verb is ", { term: be }, " in the tense of the active verb, plus the past participle."]
              uk: ["Дієслово ", { term: be }, " стоїть у тому ж часі, що й дієслово активного речення, а далі йде 3-тя форма дієслова (Past Participle)."]
              es: ["El verbo ", { term: be }, " va en el mismo tiempo que el verbo activo, seguido del participio pasado."]
              pt: ["O verbo ", { term: "be" }, " fica no mesmo tempo do verbo ativo, seguido do particípio passado."]
              fr: ["Le verbe est ", { term: "be" }, " au temps du verbe actif, suivi du participe passé."]
              de: ["Das Verb ", { term: "be" }, " steht in der Zeitform des Aktivverbs, dazu kommt das Past Participle."]
              it: ["Il verbo è ", { term: "be" }, " allo stesso tempo del verbo attivo, seguito dal participio passato."]
              pl: ["Czasownik ", { term: "be" }, " stoi w tym samym czasie co czasownik w stronie czynnej, a po nim następuje III forma czasownika (Past Participle)."]
              tr: ["Fiil, etken fiilin zamanında ", { term: "be" }, " ve ardından past participle olur."]
              id: ["Kata kerjanya adalah ", { term: "be" }, " dalam tense yang sama dengan kata kerja aktif, ditambah past participle."]
              vi: ["Động từ là ", { term: "be" }, " ở thì của động từ trong câu chủ động, cộng với quá khứ phân từ."]
          - type: rule
            level: B1
            text:
              en: ["Verbs with an object have a passive. ", { term: happen }, ", ", { term: arrive }, ", ", { term: die }, " and ", { term: sleep }, " have an active form only."]
              uk: ["Дієслова з додатком мають пасивну форму. Дієслова ", { term: happen }, ", ", { term: arrive }, ", ", { term: die }, " і ", { term: sleep }, " мають лише активну форму."]
              es: ["Los verbos con objeto tienen pasiva. Los verbos ", { term: happen }, ", ", { term: arrive }, ", ", { term: die }, " y ", { term: sleep }, " solo tienen forma activa."]
              pt: ["Verbos com objeto têm voz passiva. Os verbos ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " e ", { term: "sleep" }, " só têm forma ativa."]
              fr: ["Les verbes avec complément ont un passif. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " et ", { term: "sleep" }, " n’ont qu’une forme active."]
              de: ["Verben mit Objekt haben ein Passiv. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " und ", { term: "sleep" }, " haben nur eine Aktivform."]
              it: ["I verbi con complemento oggetto hanno il passivo. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " e ", { term: "sleep" }, " hanno solo la forma attiva."]
              pl: ["Czasowniki z dopełnieniem mają stronę bierną. Czasowniki ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " i ", { term: "sleep" }, " mają tylko stronę czynną."]
              tr: ["Nesnesi olan fiillerin edilgen biçimi vardır. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " ve ", { term: "sleep" }, " fiillerinin yalnızca etken biçimi vardır."]
              id: ["Kata kerja yang memiliki objek dapat dijadikan pasif. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " dan ", { term: "sleep" }, " hanya memiliki bentuk aktif."]
              vi: ["Động từ có tân ngữ mới có dạng bị động. ", { term: "happen" }, ", ", { term: "arrive" }, ", ", { term: "die" }, " và ", { term: "sleep" }, " chỉ có dạng chủ động."]

  - title: { en: "Form: tenses", uk: "Форма: часи", es: "Forma: tiempos verbales", pt: "Forma: tempos verbais", fr: "Forme : temps", de: "Form: Zeitformen", it: "Forma: tempi verbali", pl: "Forma: czasy", tr: "Biçim: zamanlar", id: "Bentuk: tense", vi: "Dạng: các thì" }
    role: form
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense, uk: "Час", es: "Tiempo", pt: "Tempo verbal", fr: "Temps", de: "Zeitform", it: "Tempo verbale", pl: "Czas", tr: "Zaman", id: "Tense", vi: "Thì" } }
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, tense: Present simple, form: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ed }] }, ex: ["English ", { target: is spoken }, " here."], tr: { uk: "Тут розмовляють англійською.", es: "Aquí se habla inglés.", pt: "Aqui se fala inglês.", fr: "Ici, on parle anglais.", de: "Hier wird Englisch gesprochen.", it: "Qui si parla inglese.", pl: "Tutaj mówi się po angielsku.", tr: "Burada İngilizce konuşulur.", id: "Bahasa Inggris dipakai di sini.", vi: "Tiếng Anh được nói ở đây." } }
          - { level: B1, tense: Past simple, form: { pattern: [{ alternatives: [was, were] }, { slot: V-ed }] }, ex: ["The bridge ", { target: was built }, " in ", { date: "1990", value: "1990" }, "."], tr: { uk: "Міст збудували 1990 року.", es: "El puente fue construido en 1990.", pt: "A ponte foi construída em 1990.", fr: "Le pont a été construit en 1990.", de: "Die Brücke wurde 1990 gebaut.", it: "Il ponte è stato costruito nel 1990.", pl: "Most został zbudowany w 1990 roku.", tr: "Köprü 1990 yılında inşa edildi.", id: "Jembatan itu dibangun pada 1990.", vi: "Cây cầu được xây vào năm 1990." } }
          - { level: B1, tense: Present perfect, form: { pattern: [[{ alternatives: [has, have] }, " been"], { slot: V-ed }] }, ex: ["The window ", { target: has been broken }, "."], tr: { uk: "Вікно розбито.", es: "La ventana ha sido rota.", pt: "A janela foi quebrada.", fr: "La fenêtre a été cassée.", de: "Das Fenster wurde zerbrochen.", it: "La finestra è stata rotta.", pl: "Okno zostało rozbite.", tr: "Pencere kırılmış.", id: "Jendelanya sudah dipecahkan.", vi: "Cửa sổ đã bị vỡ." } }
          - { level: B1, tense: will, form: { pattern: [will be, { slot: V-ed }] }, ex: ["The results ", { target: will be sent }, " tomorrow."], tr: { uk: "Результати надішлють завтра.", es: "Los resultados se enviarán mañana.", pt: "Os resultados serão enviados amanhã.", fr: "Les résultats seront envoyés demain.", de: "Die Ergebnisse werden morgen verschickt.", it: "I risultati saranno inviati domani.", pl: "Wyniki zostaną wysłane jutro.", tr: "Sonuçlar yarın gönderilecek.", id: "Hasilnya akan dikirim besok.", vi: "Kết quả sẽ được gửi vào ngày mai." } }
          - { level: B1, tense: { alternatives: [can, must] }, form: { pattern: [[{ alternatives: [can, must] }, " be"], { slot: V-ed }] }, ex: ["The door ", { target: must be locked }, "."], tr: { uk: "Двері мають бути замкнені.", es: "La puerta debe estar cerrada con llave.", pt: "A porta deve estar trancada.", fr: "La porte doit être fermée à clé.", de: "Die Tür muss abgeschlossen sein.", it: "La porta deve essere chiusa a chiave.", pl: "Drzwi muszą być zamknięte na klucz.", tr: "Kapı kilitli olmalı.", id: "Pintunya harus dikunci.", vi: "Cửa phải được khóa lại." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["V-ed = past participle: ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }, ", ", { term: built }, "."]
              uk: ["V-ed — це 3-тя форма дієслова (Past Participle): ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }, ", ", { term: built }, "."]
              es: ["V-ed es el participio pasado: ", { term: made }, ", ", { term: written }, ", ", { term: sold }, ", ", { term: taken }, ", ", { term: built }, "."]
              pt: ["V-ed é o particípio passado: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              fr: ["V-ed est le participe passé : ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              de: ["V-ed ist das Past Participle: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              it: ["V-ed è il participio passato: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              pl: ["V-ed to III forma czasownika (Past Participle): ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              tr: ["V-ed = past participle: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              id: ["V-ed = past participle: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
              vi: ["V-ed = quá khứ phân từ: ", { term: "made" }, ", ", { term: "written" }, ", ", { term: "sold" }, ", ", { term: "taken" }, ", ", { term: "built" }, "."]
          - type: rule
            level: B1
            text:
              en: ["Irregular participles are in the ", { link: irregular verbs table, to: en.verbs.irregular-verbs-table }, "."]
              uk: ["3-ті форми неправильних дієслів див. ", { link: "Таблиця неправильних дієслів", to: en.verbs.irregular-verbs-table }, "."]
              es: ["Los participios irregulares están en la ", { link: "Tabla de verbos irregulares", to: en.verbs.irregular-verbs-table }, "."]
              pt: ["Os particípios irregulares estão na ", { link: "Tabela de verbos irregulares", to: "en.verbs.irregular-verbs-table" }, "."]
              fr: ["Les participes irréguliers figurent dans le ", { link: "tableau des verbes irréguliers", to: "en.verbs.irregular-verbs-table" }, "."]
              de: ["Unregelmäßige Formen des Past Participle stehen in der ", { link: "Tabelle der unregelmäßigen Verben", to: "en.verbs.irregular-verbs-table" }, "."]
              it: ["I participi irregolari sono nella ", { link: "Tabella dei verbi irregolari", to: "en.verbs.irregular-verbs-table" }, "."]
              pl: ["III formy czasowników nieregularnych: zob. ", { link: "Tabela czasowników nieregularnych", to: "en.verbs.irregular-verbs-table" }, "."]
              tr: ["Düzensiz past participle biçimleri ", { link: "Düzensiz fiiller tablosu", to: "en.verbs.irregular-verbs-table" }, " konusunda bulunur."]
              id: ["Past participle tidak beraturan ada di ", { link: "Tabel kata kerja tidak beraturan", to: "en.verbs.irregular-verbs-table" }, "."]
              vi: ["Quá khứ phân từ bất quy tắc có trong ", { link: "Bảng động từ bất quy tắc", to: "en.verbs.irregular-verbs-table" }, "."]

  - title: { en: "Form: modals and perfect modals" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type } }
          - { key: form, label: { en: Form } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, type: { en: Modal }, form: { pattern: [{ alternatives: [must, should, ought to, may, might, could, can't] }, be, { slot: V-ed }] }, ex: { examples: [["The work ", { target: must be done }, " today."], ["Children ", { target: should be told }, " the truth."], ["Some mistakes ", { target: can't be avoided }, "."]] } }
          - { level: B2, type: { en: Modal perfect }, form: { pattern: [{ alternatives: [should, could, might, must, can't] }, have been, { slot: V-ed }] }, ex: { examples: [["You ", { target: should have been told }, "."], ["The accident ", { target: could have been avoided }, "."]] } }
      - type: list
        items:
          - type: note
            level: B2
            text:
              en: ["More on the modal perfect: ", { link: "Modal Verbs in the Past: must have, should have", to: en.modals.modal-perfect }, "."]

  - title: { en: "Form: continuous and perfect passives" }
    role: form
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Form } }
          - { key: form, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, tense: { en: Present continuous }, form: { pattern: [{ alternatives: [am, is, are] }, being, { slot: V-ed }] }, ex: ["The road ", { target: is being repaired }, "."] }
          - { level: B2, tense: { en: Past continuous }, form: { pattern: [{ alternatives: [was, were] }, being, { slot: V-ed }] }, ex: ["The bridge ", { target: was being built }, " when I arrived."] }
          - { level: B2, tense: { en: Past perfect }, form: { pattern: [had been, { slot: V-ed }] }, ex: ["The house ", { target: had been sold }, " before we called."] }
          - { level: B2, tense: { en: Future perfect }, form: { pattern: [will have been, { slot: V-ed }] }, ex: ["The work ", { target: will have been finished }, " by Friday."] }
          - { level: B2, tense: { en: Passive gerund }, form: { pattern: [being, { slot: V-ed }] }, ex: ["She hates ", { target: being told }, " what to do."] }
          - { level: B2, tense: { en: Passive infinitive }, form: { pattern: [to be, { slot: V-ed }] }, ex: ["I want ", { target: to be told }, " the truth."] }
          - { level: B2, tense: { en: Perfect passive infinitive }, form: { pattern: [to have been, { slot: V-ed }] }, ex: ["He was glad ", { target: to have been chosen }, "."] }

  - title: { en: "Form: negatives and questions", uk: "Форма: заперечення й питання", es: "Forma: negación y preguntas", pt: "Forma: negação e perguntas", fr: "Forme : négations et questions", de: "Form: Verneinung und Fragen", it: "Forma: negazioni e domande", pl: "Forma: przeczenia i pytania", tr: "Biçim: olumsuz cümleler ve sorular", id: "Bentuk: kalimat negatif dan pertanyaan", vi: "Dạng: câu phủ định và câu hỏi" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo", pt: "Tipo", fr: "Type", de: "Typ", it: "Tipo", pl: "Typ", tr: "Tür", id: "Jenis", vi: "Loại" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, features: { polarity: neg, interrogativity: decl }, type: { en: Negative, uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [be, not, { slot: V-ed }] }, ex: ["The room ", { target: wasn't cleaned }, "."] }
          - { level: B1, features: { polarity: pos, interrogativity: int }, type: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }, pattern: { pattern: [be, { slot: subject }, { slot: V-ed }] }, ex: [{ target: Was }, " the room ", { target: cleaned }, "?"] }
          - { level: B1, features: { interrogativity: int }, type: Wh-question, pattern: { pattern: [{ slot: wh-word }, be, { slot: subject }, { slot: V-ed }] }, ex: ["When ", { target: was }, " it ", { target: built }, "?"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The first auxiliary changes position: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]
              uk: ["Перше допоміжне дієслово змінює місце: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]
              es: ["El primer verbo auxiliar cambia de posición: ", { examples: [[{ target: has }, " it ", { target: been }, " fixed?"], ["It ", { target: hasn't been }, " fixed."]] }]
              pt: ["O primeiro auxiliar muda de posição: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              fr: ["Le premier auxiliaire change de place : ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              de: ["Das erste Hilfsverb ändert seine Stellung: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              it: ["Il primo ausiliare cambia posizione: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              pl: ["Pierwszy czasownik pomocniczy zmienia miejsce: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              tr: ["İlk yardımcı fiilin yeri değişir: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              id: ["Kata kerja bantu pertama berpindah posisi: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]
              vi: ["Trợ động từ đầu tiên đổi vị trí: ", { examples: [[{ target: "has" }, " it ", { target: "been" }, " fixed?"], ["It ", { target: "hasn't been" }, " fixed."]] }]

  - title: { en: ["Form: ", { pattern: [by, { slot: agent }] }], uk: ["Форма: ", { pattern: [by, { slot: agent }] }], es: ["Forma: ", { pattern: [by, { slot: agent }] }], pt: ["Forma: ", { pattern: ["by", { slot: "agent" }] }], fr: ["Forme : ", { pattern: ["by", { slot: "agent" }] }], de: ["Form: ", { pattern: ["by", { slot: "agent" }] }], it: ["Forma: ", { pattern: ["by", { slot: "agent" }] }], pl: ["Forma: ", { pattern: ["by", { slot: "agent" }] }], tr: ["Biçim: ", { pattern: ["by", { slot: "agent" }] }], id: ["Bentuk: ", { pattern: ["by", { slot: "agent" }] }], vi: ["Dạng: ", { pattern: ["by", { slot: "agent" }] }] }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: introduces, label: { en: Introduces, uk: "Вводить", es: "Introduce", pt: "Introduz", fr: "Introduit", de: "Nennt", it: "Introduce", pl: "Wprowadza", tr: "Neyi belirtir", id: "Memperkenalkan", vi: "Dùng để nêu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, word: by, introduces: { en: the doer, uk: "виконавця дії", es: "al agente", pt: "o agente", fr: "l’agent", de: "den Handelnden", it: "l'agente", pl: "wykonawcę czynności", tr: "eylemi yapanı", id: "pelaku", vi: "người thực hiện hành động" }, ex: ["The song ", { target: was written by }, " Adele."], tr: { uk: "Цю пісню написала Адель.", es: "La canción fue escrita por Adele.", pt: "A canção foi escrita por Adele.", fr: "La chanson a été écrite par Adele.", de: "Das Lied wurde von Adele geschrieben.", it: "La canzone è stata scritta da Adele.", pl: "Tę piosenkę napisała Adele.", tr: "Şarkı Adele tarafından yazıldı.", id: "Lagu itu ditulis oleh Adele.", vi: "Bài hát này do Adele viết." } }
          - { level: B1, word: with, introduces: { en: a tool or material, uk: "знаряддя або матеріал", es: "una herramienta o un material", pt: "uma ferramenta ou um material", fr: "un outil ou une matière", de: "ein Werkzeug oder Material", it: "uno strumento o un materiale", pl: "narzędzie lub materiał", tr: "bir araç ya da malzemeyi", id: "alat atau bahan", vi: "dụng cụ hoặc vật liệu" }, ex: ["The door ", { target: was opened with }, " a key."], tr: { uk: "Двері відчинили ключем.", es: "La puerta se abrió con una llave.", pt: "A porta foi aberta com uma chave.", fr: "La porte a été ouverte avec une clé.", de: "Die Tür wurde mit einem Schlüssel geöffnet.", it: "La porta è stata aperta con una chiave.", pl: "Drzwi zostały otwarte kluczem.", tr: "Kapı bir anahtarla açıldı.", id: "Pintu itu dibuka dengan kunci.", vi: "Cánh cửa được mở bằng một chiếc chìa khóa." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ pattern: [{ term: by }, { slot: agent }] }, " goes at the end of the clause."]
              uk: [{ pattern: [{ term: by }, { slot: agent }] }, " стоїть наприкінці речення."]
              es: [{ pattern: [{ term: by }, { slot: agent }] }, " va al final de la oración."]
              pt: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " vai no fim da oração."]
              fr: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " se place à la fin de la proposition."]
              de: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " steht am Ende des Satzes."]
              it: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " va in fondo alla frase."]
              pl: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " stoi na końcu zdania."]
              tr: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " cümlenin sonunda yer alır."]
              id: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " diletakkan di akhir klausa."]
              vi: [{ pattern: [{ term: "by" }, { slot: "agent" }] }, " đứng ở cuối câu."]
          - type: rule
            level: B1
            text:
              en: The agent is added when it is new or important information.
              uk: "Виконавця вказують, коли це нова або важлива інформація."
              es: "El agente se añade cuando es información nueva o importante."
              pt: "O agente é acrescentado quando é uma informação nova ou importante."
              fr: "L’agent est ajouté quand il constitue une information nouvelle ou importante."
              de: "Der Handelnde wird ergänzt, wenn er neue oder wichtige Information ist."
              it: "L'agente si aggiunge quando è un'informazione nuova o importante."
              pl: "Wykonawcę podaje się wtedy, gdy jest to nowa lub ważna informacja."
              tr: "Yapan, yeni ya da önemli bir bilgiyse eklenir."
              id: "Pelaku ditambahkan bila merupakan informasi baru atau penting."
              vi: "Tác nhân được thêm vào khi đó là thông tin mới hoặc quan trọng."

  - title: { en: "Form: two objects" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Subject } }
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, type: { en: The person }, pattern: { pattern: [{ slot: person }, be, { slot: V-ed }, { slot: noun }] }, ex: ["She ", { target: was given }, " a prize."] }
          - { level: B2, type: { en: The thing }, pattern: { pattern: [{ slot: noun }, be, { slot: V-ed }, to, { slot: person }] }, ex: ["A prize ", { target: was given }, " to her."] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: ["These verbs allow both passives: ", { alternatives: [{ term: give }, { term: send }, { term: offer }, { term: show }, { term: tell }, { term: teach }, { term: pay }, { term: lend }] }, "."]
          - type: rule
            level: B2
            text:
              en: The person as the subject is the more usual choice.

  - title: { en: Passives with verb patterns }
    role: own
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Verb } }
          - { key: form, label: { en: Form } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, type: { en: Phrasal verbs }, form: { alternatives: [{ term: be looked after }, { term: be called off }, { term: be put off }] }, ex: { examples: [["The children ", { target: were looked after }, " by their grandmother."], ["The match ", { target: was called off }, "."]] } }
          - { level: B2, type: { en: Prepositional verbs }, form: { alternatives: [{ term: be dealt with }, { term: be waited for }, { term: be laughed at }] }, ex: ["The problem ", { target: was dealt with }, " quickly."] }
          - { level: B2, type: { en: "Verb, object and to-infinitive" }, form: { pattern: [be, { slot: V-ed }, to, { slot: base verb }] }, ex: { examples: [["She ", { target: was told to sit }, " down."], ["The guests ", { target: were asked to wait }, "."]] } }
          - { level: B2, type: { en: "make, see and hear" }, form: { pattern: [be, { alternatives: [made, seen, heard] }, to, { slot: base verb }] }, ex: { examples: [["He ", { target: was made to wait }, "."], ["She ", { target: was seen to leave }, "."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: [{ term: make }, ", ", { term: see }, " and ", { term: hear }, " take the base verb in the active and ", { term: to }, " in the passive:"]
            ex: { mapping: [["They made him ", { target: wait }, "."], ["He was made ", { target: to wait }, "."]] }

  - title: { en: Reporting passives }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: use, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, pattern: { pattern: [It, be, { slot: V-ed }, that, { slot: clause }] }, use: { en: "reports what people say or think" }, ex: ["It ", { target: is said that }, " he is rich."] }
          - { level: B2, pattern: { pattern: [{ slot: subject }, be, { slot: V-ed }, to, { slot: base verb }] }, use: { en: "the same time as the report" }, ex: ["He ", { target: is believed to be }, " the winner."] }
          - { level: B2, pattern: { pattern: [{ slot: subject }, be, { slot: V-ed }, to have, { slot: past participle }] }, use: { en: "an earlier time than the report" }, ex: ["He ", { target: is said to have left }, " the country."] }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: ["These verbs form reporting passives: ", { alternatives: [{ term: say }, { term: think }, { term: believe }, { term: know }, { term: report }, { term: expect }, { term: consider }, { term: understand }, { term: claim }, { term: allege }] }, "."]

  - title: { en: Get passive }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, use: { en: "an event that happens to someone, often unwanted" }, ex: { examples: [["He ", { target: got hurt }, " in the match."], ["Two men ", { target: got arrested }, "."]] } }
          - { level: B2, use: { en: "a change of state or status" }, ex: { examples: [["She ", { target: got promoted }, " last year."], ["They ", { target: got married }, " in May."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: The get passive is informal. The be passive suits formal writing.
            ex: { equivalence: [["He ", { target: got arrested }, "."], ["He ", { target: was arrested }, "."]] }
          - type: rule
            level: B2
            text:
              en: ["Negatives and questions use ", { term: do }, ":"]
            ex: [{ aux: Did }, " she ", { target: get promoted }, "?"]

  - title: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
    role: use
