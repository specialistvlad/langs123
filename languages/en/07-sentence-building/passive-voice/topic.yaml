        rows:
          - { level: C1, use: { en: "known information first, new information last", uk: "спершу відома інформація, наприкінці нова", es: "primero la información conocida, al final la nueva", pt: "primeiro a informação conhecida, no fim a nova", fr: "d’abord l’information connue, à la fin l’information nouvelle", de: "bekannte Information zuerst, neue Information zuletzt", it: "prima l'informazione nota, in fondo quella nuova", pl: "najpierw informacja znana, na końcu nowa", tr: "önce bilinen bilgi, sona yeni bilgi", id: "informasi yang sudah diketahui lebih dulu, informasi baru di akhir", vi: "thông tin đã biết đứng trước, thông tin mới đứng sau" }, ex: ["We visited the museum. It ", { target: was designed by }, " a young architect."], tr: { uk: "Ми відвідали музей. Його спроєктував молодий архітектор.", es: "Visitamos el museo. Fue diseñado por un joven arquitecto.", pt: "Visitamos o museu. Ele foi projetado por um jovem arquiteto.", fr: "Nous avons visité le musée. Il a été conçu par un jeune architecte.", de: "Wir besuchten das Museum. Es wurde von einem jungen Architekten entworfen.", it: "Abbiamo visitato il museo. È stato progettato da un giovane architetto.", pl: "Zwiedziliśmy muzeum. Zostało zaprojektowane przez młodego architekta.", tr: "Müzeyi gezdik. Müze genç bir mimar tarafından tasarlanmış.", id: "Kami mengunjungi museum itu. Museum itu dirancang oleh seorang arsitek muda.", vi: "Chúng tôi đã thăm bảo tàng. Nó được một kiến trúc sư trẻ thiết kế." } }
          - { level: C1, use: { en: "a long doer goes at the end", uk: "довгий виконавець ставимо в кінець", es: "un agente largo va al final", pt: "um agente longo vai no fim", fr: "un agent long se place à la fin", de: "ein langer Handelnder steht am Ende", it: "un agente lungo va in fondo", pl: "długi wykonawca stoi na końcu", tr: "uzun bir yapan sonda yer alır", id: "pelaku yang panjang diletakkan di akhir", vi: "tác nhân dài đứng ở cuối câu" }, ex: ["The prize ", { target: was won by }, " a team of students from three universities."], tr: { uk: "Премію здобула команда студентів із трьох університетів.", es: "El premio fue ganado por un equipo de estudiantes de tres universidades.", pt: "O prêmio foi ganho por uma equipe de estudantes de três universidades.", fr: "Le prix a été remporté par une équipe d’étudiants de trois universités.", de: "Der Preis wurde von einem Team von Studierenden aus drei Universitäten gewonnen.", it: "Il premio è stato vinto da una squadra di studenti di tre università.", pl: "Nagrodę zdobył zespół studentów z trzech uniwersytetów.", tr: "Ödül, üç üniversiteden gelen bir öğrenci ekibi tarafından kazanıldı.", id: "Hadiah itu dimenangkan oleh sebuah tim mahasiswa dari tiga universitas.", vi: "Giải thưởng được một nhóm sinh viên đến từ ba trường đại học giành được." } }
          - { level: C1, use: { en: "the same subject across sentences", uk: "той самий підмет у кількох реченнях", es: "el mismo sujeto en varias oraciones", pt: "o mesmo sujeito em várias frases", fr: "le même sujet d’une phrase à l’autre", de: "dasselbe Subjekt über mehrere Sätze hinweg", it: "lo stesso soggetto in più frasi", pl: "ten sam podmiot w kolejnych zdaniach", tr: "cümleler boyunca aynı özne", id: "subjek yang sama di beberapa kalimat", vi: "cùng một chủ ngữ qua nhiều câu" }, ex: ["Anna joined the firm in May. She ", { target: was promoted }, " within a year."], tr: { uk: "Анна прийшла до фірми в травні. За рік її підвищили.", es: "Anna entró en la empresa en mayo. La ascendieron en menos de un año.", pt: "Anna entrou na empresa em maio. Ela foi promovida em menos de um ano.", fr: "Anna est entrée dans l’entreprise en mai. Elle a été promue en moins d’un an.", de: "Anna kam im Mai in die Firma. Innerhalb eines Jahres wurde sie befördert.", it: "Anna è entrata in azienda a maggio. È stata promossa nel giro di un anno.", pl: "Anna zaczęła pracę w firmie w maju. W ciągu roku awansowała.", tr: "Anna şirkete mayısta katıldı. Bir yıl içinde terfi ettirildi.", id: "Anna bergabung dengan perusahaan itu pada bulan Mei. Dalam setahun, dia dipromosikan.", vi: "Anna vào công ty hồi tháng Năm. Trong vòng một năm, cô ấy được thăng chức." } }

