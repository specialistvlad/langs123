  - title: { en: Get passive, uk: "Пасив із get", es: "La pasiva con get", pt: "A passiva com get", fr: "Le passif avec get", de: "Das Passiv mit get", it: "Il passivo con get", pl: "Strona bierna z get", tr: "Get ile edilgen", id: "Pasif dengan get", vi: "Câu bị động với get" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: "an event that happens to someone, often unwanted", uk: "подія, що трапляється з кимось, часто небажана", es: "algo que le ocurre a alguien, a menudo no deseado", pt: "algo que acontece com alguém, muitas vezes indesejado", fr: "un événement qui arrive à quelqu’un, souvent indésirable", de: "ein Ereignis, das jemandem widerfährt, oft ein unerwünschtes", it: "un evento che capita a qualcuno, spesso sgradito", pl: "zdarzenie, które spotyka kogoś, często niechciane", tr: "birinin başına gelen, çoğu zaman istenmeyen bir olay", id: "peristiwa yang menimpa seseorang, sering kali tidak diinginkan", vi: "một sự việc xảy đến với ai đó, thường là điều không mong muốn" }, ex: { examples: [["He ", { target: got hurt }, " in the match."], ["Two men ", { target: got arrested }, "."]] }, tr: { uk: { examples: ["Він травмувався під час матчу.", "Двох чоловіків заарештували."] }, es: { examples: ["Se lastimó en el partido.", "Arrestaron a dos hombres."] }, pt: { examples: ["Ele se machucou na partida.", "Dois homens acabaram presos."] }, fr: { examples: ["Il s’est blessé pendant le match.", "Deux hommes se sont fait arrêter."] }, de: { examples: ["Er hat sich im Spiel verletzt.", "Zwei Männer wurden festgenommen."] }, it: { examples: ["Si è fatto male durante la partita.", "Due uomini sono stati arrestati."] }, pl: { examples: ["Został ranny w meczu.", "Dwóch mężczyzn zostało aresztowanych."] }, tr: { examples: ["Maçta yaralandı.", "İki adam tutuklandı."] }, id: { examples: ["Dia cedera dalam pertandingan itu.", "Dua pria ditangkap."] }, vi: { examples: ["Anh ấy bị thương trong trận đấu.", "Hai người đàn ông bị bắt."] } } }
          - { level: B2, use: { en: "a change of state or status", uk: "зміна стану або статусу", es: "un cambio de estado o de situación", pt: "uma mudança de estado ou de situação", fr: "un changement d’état ou de statut", de: "eine Zustands- oder Statusänderung", it: "un cambiamento di stato o di condizione", pl: "zmiana stanu lub statusu", tr: "durum ya da statü değişikliği", id: "perubahan keadaan atau status", vi: "sự thay đổi trạng thái hoặc vị thế" }, ex: { examples: [["She ", { target: got promoted }, " last year."], ["They ", { target: got married }, " in May."]] }, tr: { uk: { examples: ["Минулого року її підвищили.", "Вони одружилися в травні."] }, es: { examples: ["La ascendieron el año pasado.", "Se casaron en mayo."] }, pt: { examples: ["Ela foi promovida no ano passado.", "Eles se casaram em maio."] }, fr: { examples: ["Elle a été promue l’an dernier.", "Ils se sont mariés en mai."] }, de: { examples: ["Sie wurde letztes Jahr befördert.", "Sie haben im Mai geheiratet."] }, it: { examples: ["L'anno scorso l'hanno promossa.", "Si sono sposati a maggio."] }, pl: { examples: ["Awansowała w zeszłym roku.", "Pobrali się w maju."] }, tr: { examples: ["Geçen yıl terfi etti.", "Mayıs ayında evlendiler."] }, id: { examples: ["Dia dipromosikan tahun lalu.", "Mereka menikah pada bulan Mei."] }, vi: { examples: ["Cô ấy được thăng chức năm ngoái.", "Họ kết hôn vào tháng Năm."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: The get passive is informal. The be passive suits formal writing.
              uk: "Пасив із get — розмовний. Пасив із be підходить для офіційного письма."
              es: "La pasiva con get es informal. La pasiva con be es propia de la escritura formal."
              pt: "A passiva com get é informal. A passiva com be convém à escrita formal."
              fr: "Le passif avec get est familier. Le passif avec be convient à l’écrit formel."
              de: "Das get-Passiv ist umgangssprachlich. Das be-Passiv passt zu förmlichen Texten."
              it: "Il passivo con get è informale. Il passivo con be si addice alla scrittura formale."
              pl: "Strona bierna z get jest nieformalna. Strona bierna z be pasuje do pisma formalnego."
              tr: "Get ile kurulan edilgen yapı gayriresmîdir. Be ile kurulan edilgen yapı resmî yazıya uygundur."
              id: "Pasif dengan get bersifat informal. Pasif dengan be cocok untuk tulisan formal."
              vi: "Câu bị động với get mang tính thân mật. Câu bị động với be phù hợp với văn viết trang trọng."
            ex: { equivalence: [["He ", { target: got arrested }, "."], ["He ", { target: was arrested }, "."]] }
