            text:
              en: A middle verb is active and names no doer; its meaning is passive.
              uk: "Медіальне дієслово активне й не називає виконавця; значення в нього пасивне."
              es: "Un verbo medio está en voz activa y no nombra al agente; su significado es pasivo."
