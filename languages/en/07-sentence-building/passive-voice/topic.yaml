              de: ["Diese Verben bilden solche Passivsätze: ", { alternatives: [{ term: "say" }, { term: "think" }, { term: "believe" }, { term: "know" }, { term: "report" }, { term: "expect" }, { term: "consider" }, { term: "understand" }, { term: "claim" }, { term: "allege" }] }, "."]
              it: ["Questi verbi formano questo tipo di passivo: ", { alternatives: [{ term: "say" }, { term: "think" }, { term: "believe" }, { term: "know" }, { term: "report" }, { term: "expect" }, { term: "consider" }, { term: "understand" }, { term: "claim" }, { term: "allege" }] }, "."]
              pl: ["Takie zdania w stronie biernej tworzą czasowniki: ", { alternatives: [{ term: "say" }, { term: "think" }, { term: "believe" }, { term: "know" }, { term: "report" }, { term: "expect" }, { term: "consider" }, { term: "understand" }, { term: "claim" }, { term: "allege" }] }, "."]
