title: { en: Passive Voice, uk: Пасивний стан, es: La voz pasiva, pt: "A voz passiva", fr: "Voix passive", de: "Das Passiv", it: "Forma passiva", pl: "Strona bierna", tr: "Edilgen çatı", id: "Kalimat pasif", vi: "Câu bị động" }
summary:
  lead:
    en: [The passive (, { pattern: [{ term: be }, { slot: past participle }] }, ") puts the receiver of the action first, for an unknown or unimportant doer, a process or formal writing."]
    uk: ["Пасивний стан (", { pattern: [{ term: be }, { slot: past participle }] }, ") ставить на перше місце об’єкт дії, коли виконавець невідомий чи неважливий, а також для процесів і офіційного письма."]
    es: ["La voz pasiva (", { pattern: [{ term: be }, { slot: past participle }] }, ") pone primero al receptor de la acción: agente desconocido o irrelevante, procesos, textos formales."]
    pt: ["A voz passiva (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") coloca primeiro o receptor da ação: agente desconhecido ou irrelevante, processos, textos formais."]
    fr: ["La voix passive (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") place d’abord ce qui subit l’action : agent inconnu ou sans importance, processus, écrits formels."]
    de: ["Das Passiv (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") stellt den Empfänger der Handlung voran: bei unbekanntem Handelnden, bei Vorgängen und in förmlichen Texten."]
    it: ["La forma passiva (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") mette in primo piano chi riceve l'azione: agente sconosciuto o poco importante, processi, testi formali."]
    pl: ["Strona bierna (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") stawia na początku odbiorcę czynności: gdy wykonawca jest nieznany lub nieistotny, w procesach i w tekstach formalnych."]
    tr: ["Edilgen çatı (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") eylemden etkilenen öğeyi başa alır: yapan bilinmiyorsa veya önemsizse, süreçlerde, resmî yazıda."]
    id: ["Kalimat pasif (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") menempatkan penerima tindakan di depan, untuk pelaku yang tidak diketahui atau tidak penting, proses, dan tulisan formal."]
    vi: ["Câu bị động (", { pattern: [{ term: "be" }, { slot: "past participle" }] }, ") đưa đối tượng chịu tác động lên trước, khi người làm không rõ hoặc không quan trọng, hoặc trong quy trình và văn trang trọng."]
  rule:
    en: [{ term: Be }, " changes with the tense and the participle stays:"]
    uk: [{ term: Be }, " змінюється за часом, а 3-тя форма дієслова лишається тією самою:"]
    es: [{ term: Be }, " cambia con el tiempo verbal y el participio no cambia:"]
    pt: [{ term: "Be" }, " muda com o tempo verbal e o particípio não muda:"]
    fr: [{ term: "Be" }, " change avec le temps et le participe reste identique :"]
    de: [{ term: "Be" }, " ändert sich mit der Zeitform, das Past Participle bleibt gleich:"]
    it: [{ term: "Be" }, " cambia con il tempo verbale e il participio resta invariato:"]
    pl: [{ term: "Be" }, " zmienia się zależnie od czasu, a III forma czasownika pozostaje bez zmian:"]
    tr: [{ term: "Be" }, " zamana göre değişir, past participle sabit kalır:"]
    id: [{ term: "Be" }, " berubah mengikuti tense, sedangkan past participle tetap sama:"]
    vi: [{ term: "Be" }, " thay đổi theo thì, còn quá khứ phân từ giữ nguyên:"]
  ex: ["English ", { target: is spoken }, " here."]

