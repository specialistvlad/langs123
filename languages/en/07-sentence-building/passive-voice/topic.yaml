          - { level: B1, use: { en: Processes and how things are made, uk: "Процеси й спосіб виготовлення речей", es: "Procesos y cómo se hacen las cosas", pt: "Processos e como as coisas são feitas", fr: "Processus et façon dont les choses sont faites", de: "Vorgänge und wie Dinge hergestellt werden", it: "Processi e modo in cui si fanno le cose", pl: "Procesy i sposób wytwarzania rzeczy", tr: "Süreçler ve bir şeyin nasıl yapıldığı", id: "Proses dan cara benda dibuat", vi: "Quy trình và cách làm ra sự vật" }, ex: ["Wine ", { target: is made }, " from grapes."], tr: { uk: "Вино виготовляють із винограду.", es: "El vino se hace con uvas.", pt: "O vinho é feito de uvas.", fr: "Le vin est fait à partir de raisin.", de: "Wein wird aus Trauben gemacht.", it: "Il vino si fa con l'uva.", pl: "Wino jest produkowane z winogron.", tr: "Şarap üzümden yapılır.", id: "Anggur dibuat dari buah anggur.", vi: "Rượu vang được làm từ nho." } }
          - { level: B1, use: { en: "News, notices and formal writing", uk: "Новини, оголошення й офіційне письмо", es: "Noticias, avisos y textos formales", pt: "Notícias, avisos e textos formais", fr: "Actualités, avis et écrits formels", de: "Nachrichten, Hinweise und förmliche Texte", it: "Notizie, avvisi e testi formali", pl: "Wiadomości, ogłoszenia i pismo formalne", tr: "Haberler, duyurular ve resmî yazı", id: "Berita, pengumuman, dan tulisan formal", vi: "Tin tức, thông báo và văn viết trang trọng" }, ex: ["Two people ", { target: were arrested }, " last night."], tr: { uk: "Минулої ночі заарештували двох людей.", es: "Anoche arrestaron a dos personas.", pt: "Duas pessoas foram presas ontem à noite.", fr: "Deux personnes ont été arrêtées la nuit dernière.", de: "Zwei Personen wurden letzte Nacht festgenommen.", it: "Ieri sera due persone sono state arrestate.", pl: "Dwie osoby zostały aresztowane zeszłej nocy.", tr: "Dün gece iki kişi tutuklandı.", id: "Dua orang ditangkap tadi malam.", vi: "Đêm qua hai người đã bị bắt." } }
          - { level: B1, use: { en: The receiver is the topic, uk: "Одержувач дії — тема речення", es: "El receptor es el tema", pt: "O receptor é o assunto", fr: "Celui qui subit l’action est le thème", de: "Der Empfänger ist das Thema", it: "Chi riceve l'azione è l'argomento", pl: "Odbiorca czynności jest tematem zdania", tr: "Eylemden etkilenen, cümlenin konusudur", id: "Penerima tindakan menjadi topik", vi: "Đối tượng chịu tác động là chủ đề" }, ex: ["Our teacher ", { target: was given }, " a prize."], tr: { uk: "Нашому вчителеві вручили нагороду.", es: "A nuestro profesor le dieron un premio.", pt: "Nosso professor recebeu um prêmio.", fr: "Notre professeur s’est vu remettre un prix.", de: "Unserem Lehrer wurde ein Preis verliehen.", it: "Al nostro insegnante è stato consegnato un premio.", pl: "Naszemu nauczycielowi wręczono nagrodę.", tr: "Öğretmenimize bir ödül verildi.", id: "Guru kami diberi hadiah.", vi: "Giáo viên của chúng tôi được trao một giải thưởng." } }

