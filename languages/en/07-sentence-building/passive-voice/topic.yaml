          - { level: B2, type: { en: "Verb, object and to-infinitive", uk: "Дієслово, додаток та інфінітив із to", es: "Verbo, objeto e infinitivo con to", pt: "Verbo, objeto e infinitivo com to", fr: "Verbe, complément et infinitif avec to", de: "Verb, Objekt und Infinitiv mit to", it: "Verbo, complemento oggetto e infinito con to", pl: "Czasownik, dopełnienie i bezokolicznik z to", tr: "Fiil, nesne ve to’lu mastar", id: "Kata kerja, objek, dan infinitif dengan to", vi: "Động từ, tân ngữ và động từ nguyên mẫu có to" }, form: { pattern: [be, { slot: V-ed }, to, { slot: base verb }] }, ex: { examples: [["She ", { target: was told to sit }, " down."], ["The guests ", { target: were asked to wait }, "."]] }, tr: { uk: { examples: ["Їй сказали сісти.", "Гостей попросили зачекати."] }, es: { examples: ["Le dijeron que se sentara.", "A los invitados les pidieron que esperaran."] }, pt: { examples: ["Disseram a ela para se sentar.", "Pediram aos convidados para esperar."] }, fr: { examples: ["On lui a dit de s’asseoir.", "On a demandé aux invités d’attendre."] }, de: { examples: ["Ihr wurde gesagt, sie solle sich setzen.", "Die Gäste wurden gebeten zu warten."] }, it: { examples: ["Le è stato detto di sedersi.", "Agli ospiti è stato chiesto di aspettare."] }, pl: { examples: ["Kazano jej usiąść.", "Gości poproszono, żeby poczekali."] }, tr: { examples: ["Ona oturması söylendi.", "Misafirlerden beklemeleri istendi."] }, id: { examples: ["Dia disuruh duduk.", "Para tamu diminta menunggu."] }, vi: { examples: ["Cô ấy được bảo ngồi xuống.", "Các vị khách được đề nghị chờ."] } } }
          - { level: B2, type: { en: "make, see and hear", uk: "make, see і hear", es: "make, see y hear", pt: "make, see e hear", fr: "make, see et hear", de: "make, see und hear", it: "make, see e hear", pl: "make, see i hear", tr: "make, see ve hear", id: "make, see dan hear", vi: "make, see và hear" }, form: { pattern: [be, { alternatives: [made, seen, heard] }, to, { slot: base verb }] }, ex: { examples: [["He ", { target: was made to wait }, "."], ["She ", { target: was seen to leave }, "."]] }, tr: { uk: { examples: ["Його змусили чекати.", "Її бачили, як вона виходила."] }, es: { examples: ["Fue obligado a esperar.", "La vieron salir."] }, pt: { examples: ["Ele foi obrigado a esperar.", "Ela foi vista saindo."] }, fr: { examples: ["Il a été obligé d’attendre.", "On l’a vue partir."] }, de: { examples: ["Er wurde gezwungen zu warten.", "Man sah sie gehen."] }, it: { examples: ["È stato costretto ad aspettare.", "È stata vista uscire."] }, pl: { examples: ["Kazano mu czekać.", "Widziano, jak wychodzi."] }, tr: { examples: ["Beklemeye zorlandı.", "Ayrılırken görüldü."] }, id: { examples: ["Dia dipaksa menunggu.", "Dia terlihat keluar."] }, vi: { examples: ["Anh ấy bị bắt phải chờ.", "Người ta thấy cô ấy rời đi."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: [{ term: make }, ", ", { term: see }, " and ", { term: hear }, " take the base verb in the active and ", { term: to }, " in the passive:"]
              uk: [{ term: "make" }, ", ", { term: "see" }, " і ", { term: "hear" }, " в активному стані мають після себе початкову форму дієслова, а в пасиві — ", { term: "to" }, ":"]
              es: [{ term: "make" }, ", ", { term: "see" }, " y ", { term: "hear" }, " llevan el verbo en forma base en activa y ", { term: "to" }, " en pasiva:"]
              pt: [{ term: "make" }, ", ", { term: "see" }, " e ", { term: "hear" }, " levam o verbo na forma base na ativa e ", { term: "to" }, " na passiva:"]
              fr: [{ term: "make" }, ", ", { term: "see" }, " et ", { term: "hear" }, " prennent la base verbale à l’actif et ", { term: "to" }, " au passif :"]
              de: [{ term: "make" }, ", ", { term: "see" }, " und ", { term: "hear" }, " stehen im Aktiv mit der Grundform und im Passiv mit ", { term: "to" }, ":"]
              it: [{ term: "make" }, ", ", { term: "see" }, " e ", { term: "hear" }, " nella forma attiva reggono la forma base del verbo, in quella passiva ", { term: "to" }, ":"]
              pl: [{ term: "make" }, ", ", { term: "see" }, " i ", { term: "hear" }, " w stronie czynnej łączą się z formą podstawową czasownika, a w biernej z ", { term: "to" }, ":"]
              tr: [{ term: "make" }, ", ", { term: "see" }, " ve ", { term: "hear" }, " etken cümlede yalın fiille, edilgen cümlede ", { term: "to" }, " ile kullanılır:"]
              id: [{ term: "make" }, ", ", { term: "see" }, " dan ", { term: "hear" }, " memakai kata kerja dasar dalam kalimat aktif dan ", { term: "to" }, " dalam kalimat pasif:"]
              vi: [{ term: "make" }, ", ", { term: "see" }, " và ", { term: "hear" }, " đi với động từ nguyên mẫu trong câu chủ động và với ", { term: "to" }, " trong câu bị động:"]
            ex: { mapping: [["They made him ", { target: wait }, "."], ["He was made ", { target: to wait }, "."]] }
            tr: { uk: { mapping: ["Вони змусили його чекати.", "Його змусили чекати."] }, es: { mapping: ["Lo obligaron a esperar.", "Fue obligado a esperar."] }, pt: { mapping: ["Eles o fizeram esperar.", "Ele foi obrigado a esperar."] }, fr: { mapping: ["Ils l’ont obligé à attendre.", "Il a été obligé d’attendre."] }, de: { mapping: ["Sie zwangen ihn zu warten.", "Er wurde gezwungen zu warten."] }, it: { mapping: ["Lo hanno costretto ad aspettare.", "È stato costretto ad aspettare."] }, pl: { mapping: ["Kazali mu czekać.", "Kazano mu czekać."] }, tr: { mapping: ["Onu beklemeye zorladılar.", "Beklemeye zorlandı."] }, id: { mapping: ["Mereka memaksanya menunggu.", "Dia dipaksa menunggu."] }, vi: { mapping: ["Họ bắt anh ấy chờ.", "Anh ấy bị bắt phải chờ."] } }

