        rows:
          - { level: C1, pattern: { pattern: [It, be, { slot: V-ed }, that, { slot: clause }] }, use: { en: "reports a finding or a decision", uk: "повідомляє про результат чи рішення", es: "comunica un hallazgo o una decisión", pt: "relata uma descoberta ou uma decisão", fr: "rapporte un constat ou une décision", de: "berichtet von einem Befund oder einer Entscheidung", it: "riferisce un risultato o una decisione", pl: "przekazuje ustalenie lub decyzję", tr: "bir bulguyu ya da kararı bildirir", id: "melaporkan temuan atau keputusan", vi: "báo cáo một phát hiện hoặc một quyết định" }, ex: ["It ", { target: was found that }, " the samples were damaged."], tr: { uk: "Було встановлено, що зразки пошкоджені.", es: "Se encontró que las muestras estaban dañadas.", pt: "Constatou-se que as amostras estavam danificadas.", fr: "Il a été constaté que les échantillons étaient endommagés.", de: "Es wurde festgestellt, dass die Proben beschädigt waren.", it: "È stato rilevato che i campioni erano danneggiati.", pl: "Stwierdzono, że próbki były uszkodzone.", tr: "Numunelerin hasar gördüğü tespit edildi.", id: "Ditemukan bahwa sampel tersebut rusak.", vi: "Người ta nhận thấy các mẫu đã bị hỏng." } }
          - { level: C1, pattern: { pattern: [It, be, { slot: V-ed }, that, { slot: clause }] }, use: { en: "makes a request or a rule formal", uk: "надає проханню чи правилу офіційного тону", es: "da carácter formal a una petición o una norma", pt: "dá caráter formal a um pedido ou a uma regra", fr: "rend une demande ou une règle formelle", de: "macht eine Bitte oder Regel förmlich", it: "rende formale una richiesta o una regola", pl: "nadaje prośbie lub zasadzie formalny ton", tr: "bir isteği ya da kuralı resmî kılar", id: "membuat permintaan atau aturan terdengar formal", vi: "làm cho một yêu cầu hoặc quy định mang tính trang trọng" }, ex: ["It ", { target: is requested that }, " visitors sign in."], tr: { uk: "Відвідувачів просять зареєструватися.", es: "Se solicita que los visitantes se registren.", pt: "Solicita-se que os visitantes se registrem.", fr: "Il est demandé aux visiteurs de s’enregistrer.", de: "Besucher werden gebeten, sich anzumelden.", it: "Si richiede che i visitatori si registrino.", pl: "Odwiedzających prosi się o wpisanie się do rejestru.", tr: "Ziyaretçilerin kayıt yaptırması rica olunur.", id: "Pengunjung diminta untuk mendaftar.", vi: "Khách tham quan được yêu cầu đăng ký." } }
          - { level: C1, pattern: { pattern: [{ slot: noun }, be, { slot: V-ed }] }, use: { en: "method and process: the doer does not matter", uk: "метод і процес: виконавець не має значення", es: "método y proceso: el agente no importa", pt: "método e processo: o agente não importa", fr: "méthode et processus : l’agent n’a pas d’importance", de: "Methode und Verfahren: Der Handelnde spielt keine Rolle", it: "metodo e processo: l'agente non conta", pl: "metoda i proces: wykonawca nie ma znaczenia", tr: "yöntem ve süreç: yapanın önemi yoktur", id: "metode dan proses: pelakunya tidak penting", vi: "phương pháp và quy trình: người thực hiện không quan trọng" }, ex: ["The samples ", { target: were heated }, " to 80 degrees."], tr: { uk: "Зразки було нагріто до 80 градусів.", es: "Las muestras se calentaron a 80 grados.", pt: "As amostras foram aquecidas a 80 graus.", fr: "Les échantillons ont été chauffés à 80 degrés.", de: "Die Proben wurden auf 80 Grad erhitzt.", it: "I campioni sono stati riscaldati a 80 gradi.", pl: "Próbki podgrzano do 80 stopni.", tr: "Numuneler 80 dereceye kadar ısıtıldı.", id: "Sampel dipanaskan hingga 80 derajat.", vi: "Các mẫu được đun nóng đến 80 độ." } }

