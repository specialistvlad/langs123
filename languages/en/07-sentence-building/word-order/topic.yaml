      rows:
        - { level: A0, point: { en: Order, uk: "Порядок", es: "Orden", pt: "Ordem", fr: "Ordre", de: "Reihenfolge", it: "Ordine", pl: "Kolejność", tr: "Sıra", id: "Urutan", vi: "Thứ tự" }, rule: { pattern: [{ slot: subject }, { slot: verb }, { slot: { en: object, uk: "додаток", es: "objeto", pt: "objeto", fr: "complément", de: "Objekt", it: "complemento oggetto", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, { slot: { en: place, uk: "місце", es: "lugar", pt: "lugar", fr: "lieu", de: "Ort", it: "luogo", pl: "miejsce", tr: "yer", id: "tempat", vi: "nơi chốn" } }, { slot: { en: time, uk: "час", es: "tiempo", pt: "tempo", fr: "moment", de: "Zeit", it: "tempo", pl: "czas", tr: "zaman", id: "waktu", vi: "thời gian" } }] }, ex: [{ target: My sister buys bread in the shop every day }, "."], tr: { uk: "Моя сестра щодня купує хліб у магазині.", es: "Mi hermana compra pan en la tienda todos los días.", pt: "Minha irmã compra pão na loja todos os dias.", fr: "Ma sœur achète du pain au magasin tous les jours.", de: "Meine Schwester kauft jeden Tag Brot im Laden.", it: "Mia sorella compra il pane al negozio ogni giorno.", pl: "Moja siostra codziennie kupuje chleb w sklepie.", tr: "Kız kardeşim her gün dükkândan ekmek alır.", id: "Kakak perempuan saya membeli roti di toko setiap hari.", vi: "Chị tôi mua bánh mì ở cửa hàng mỗi ngày." } }
        - { level: A0, point: { en: Subject, uk: "Підмет", es: "Sujeto", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }, rule: { en: the subject is always present, uk: "підмет завжди присутній", es: "el sujeto siempre está presente", pt: "o sujeito sempre está presente", fr: "le sujet est toujours exprimé", de: "das Subjekt ist immer vorhanden", it: "il soggetto è sempre presente", pl: "podmiot jest zawsze obecny", tr: "özne her zaman bulunur", id: "subjek selalu ada", vi: "chủ ngữ luôn có mặt" }, ex: [{ target: It }, " is cold."], tr: { uk: "Холодно.", es: "Hace frío.", pt: "Está frio.", fr: "Il fait froid.", de: "Es ist kalt.", it: "Fa freddo.", pl: "Jest zimno.", tr: "Hava soğuk.", id: "Cuaca dingin.", vi: "Trời lạnh." } }
        - { level: A0, point: { en: Adjective, uk: "Прикметник", es: "Adjetivo", pt: "Adjetivo", fr: "Adjectif", de: "Adjektiv", it: "Aggettivo", pl: "Przymiotnik", tr: "Sıfat", id: "Kata sifat", vi: "Tính từ" }, rule: { en: comes before the noun, uk: "стоїть перед іменником", es: "va antes del sustantivo", pt: "vem antes do substantivo", fr: "se place avant le nom", de: "steht vor dem Nomen", it: "va prima del sostantivo", pl: "stoi przed rzeczownikiem", tr: "isimden önce gelir", id: "diletakkan sebelum kata benda", vi: "đứng trước danh từ" }, ex: ["I have a ", { target: red car }, "."], tr: { uk: "У мене червона машина.", es: "Tengo un coche rojo.", pt: "Eu tenho um carro vermelho.", fr: "J’ai une voiture rouge.", de: "Ich habe ein rotes Auto.", it: "Ho una macchina rossa.", pl: "Mam czerwony samochód.", tr: "Kırmızı bir arabam var.", id: "Saya punya mobil merah.", vi: "Tôi có một chiếc xe màu đỏ." } }
        - { level: A1, point: { en: Time first, uk: "Час на початку", es: "Tiempo al principio", pt: "Tempo no início", fr: "Moment en tête", de: "Zeitangabe am Anfang", it: "Il tempo all'inizio", pl: "Czas na początku", tr: "Zaman başta", id: "Waktu di awal", vi: "Thời gian đứng đầu câu" }, rule: { en: "a time phrase can start the sentence, often with a comma", uk: "зворот часу може відкривати речення, часто з комою", es: "una expresión de tiempo puede abrir la oración, a menudo con coma", pt: "uma expressão de tempo pode abrir a frase, muitas vezes com vírgula", fr: "une indication de temps peut ouvrir la phrase, souvent suivie d’une virgule", de: "eine Zeitangabe kann am Satzanfang stehen, oft mit Komma", it: "un'espressione di tempo può aprire la frase, spesso con la virgola", pl: "wyrażenie czasu może otwierać zdanie, często z przecinkiem", tr: "zaman ifadesi cümleyi açabilir, çoğunlukla virgülle", id: "keterangan waktu dapat membuka kalimat, sering diikuti koma", vi: "cụm chỉ thời gian có thể mở đầu câu, thường kèm dấu phẩy" }, ex: [{ target: Last summer }, ", we went to Italy."], tr: { uk: "Минулого літа ми їздили до Італії.", es: "El verano pasado fuimos a Italia.", pt: "No verão passado, nós fomos para a Itália.", fr: "L’été dernier, nous sommes allés en Italie.", de: "Letzten Sommer sind wir nach Italien gefahren.", it: "L'estate scorsa siamo andati in Italia.", pl: "Zeszłego lata pojechaliśmy do Włoch.", tr: "Geçen yaz İtalya’ya gittik.", id: "Musim panas lalu, kami pergi ke Italia.", vi: "Mùa hè năm ngoái, chúng tôi đã đi Ý." } }
        - { level: A1, point: { en: Frequency adverb, uk: "Прислівник частотності", es: "Adverbio de frecuencia", pt: "Advérbio de frequência", fr: "Adverbe de fréquence", de: "Häufigkeitsadverb", it: "Avverbio di frequenza", pl: "Przysłówek częstotliwości", tr: "Sıklık zarfı", id: "Kata keterangan frekuensi", vi: "Trạng từ chỉ tần suất" }, rule: { en: ["before the main verb, after ", { term: be }], uk: ["перед основним дієсловом, після ", { term: be }], es: ["antes del verbo principal, después de ", { term: be }], pt: ["antes do verbo principal, depois de ", { term: "be" }], fr: ["avant le verbe principal, après ", { term: "be" }], de: ["vor dem Hauptverb, nach ", { term: "be" }], it: ["prima del verbo principale, dopo ", { term: "be" }], pl: ["przed czasownikiem głównym, po ", { term: "be" }], tr: ["ana fiilden önce, ", { term: "be" }, " fiilinden sonra"], id: ["sebelum kata kerja utama, setelah ", { term: "be" }], vi: ["trước động từ chính, sau ", { term: "be" }] }, ex: { examples: [["I ", { target: always }, " eat breakfast."], ["She is ", { target: always }, " late."]] }, tr: { uk: { examples: ["Я завжди снідаю.", "Вона завжди запізнюється."] }, es: { examples: ["Siempre desayuno.", "Siempre llega tarde."] }, pt: { examples: ["Eu sempre tomo café da manhã.", "Ela está sempre atrasada."] }, fr: { examples: ["Je prends toujours le petit-déjeuner.", "Elle est toujours en retard."] }, de: { examples: ["Ich frühstücke immer.", "Sie kommt immer zu spät."] }, it: { examples: ["Faccio sempre colazione.", "È sempre in ritardo."] }, pl: { examples: ["Zawsze jem śniadanie.", "Ona zawsze się spóźnia."] }, tr: { examples: ["Her zaman kahvaltı yaparım.", "O her zaman geç kalır."] }, id: { examples: ["Saya selalu sarapan.", "Dia selalu terlambat."] }, vi: { examples: ["Tôi luôn ăn sáng.", "Cô ấy luôn đến muộn."] } } }
        - { level: B2, point: { en: Adverbials, uk: "Обставини", es: "Complementos circunstanciales", pt: "Adjuntos adverbiais", fr: "Compléments circonstanciels", de: "Adverbiale", it: "Complementi circostanziali", pl: "Okoliczniki", tr: "Zarf tümleçleri", id: "Keterangan", vi: "Trạng ngữ" }, rule: { en: "front, middle (after an auxiliary or be) or end", uk: "на початку, всередині (після допоміжного дієслова чи be) або в кінці", es: "al principio, en medio (después de un auxiliar o de be) o al final", pt: "no início, no meio (depois de um auxiliar ou de be) ou no fim", fr: "en tête, au milieu (après un auxiliaire ou be) ou à la fin", de: "am Anfang, in der Mitte (nach einem Hilfsverb oder be) oder am Ende", it: "all'inizio, nel mezzo (dopo un ausiliare o be) o alla fine", pl: "na początku, w środku (po czasowniku pomocniczym lub be) albo na końcu", tr: "başta, ortada (yardımcı fiilden veya be fiilinden sonra) ya da sonda", id: "di awal, di tengah (setelah kata kerja bantu atau be), atau di akhir", vi: "ở đầu câu, ở giữa (sau trợ động từ hoặc be) hoặc ở cuối câu" }, ex: ["She is ", { target: probably }, " late."], tr: { uk: "Вона, імовірно, запізнюється.", es: "Probablemente llega tarde.", pt: "Ela provavelmente está atrasada.", fr: "Elle est probablement en retard.", de: "Sie kommt wahrscheinlich zu spät.", it: "Probabilmente è in ritardo.", pl: "Ona prawdopodobnie się spóźnia.", tr: "O muhtemelen geç kaldı.", id: "Dia kemungkinan besar terlambat.", vi: "Cô ấy có lẽ đến muộn." } }
        - { level: B2, point: { en: Several adverbials, uk: "Кілька обставин", es: "Varios complementos circunstanciales", pt: "Vários adjuntos adverbiais", fr: "Plusieurs compléments circonstanciels", de: "Mehrere Adverbiale", it: "Più complementi circostanziali", pl: "Kilka okoliczników", tr: "Birden çok zarf tümleci", id: "Beberapa keterangan", vi: "Nhiều trạng ngữ" }, rule: { pattern: [{ slot: { en: "manner", uk: "спосіб дії", es: "modo", pt: "modo", fr: "manière", de: "Art und Weise", it: "modo", pl: "sposób", tr: "durum", id: "cara", vi: "cách thức" } }, { slot: { en: "place", uk: "місце", es: "lugar", pt: "lugar", fr: "lieu", de: "Ort", it: "luogo", pl: "miejsce", tr: "yer", id: "tempat", vi: "nơi chốn" } }, { slot: { en: "time", uk: "час", es: "tiempo", pt: "tempo", fr: "moment", de: "Zeit", it: "tempo", pl: "czas", tr: "zaman", id: "waktu", vi: "thời gian" } }] }, ex: ["She sang ", { target: beautifully at the party last night }, "."], tr: { uk: "Вчора ввечері на вечірці вона чудово співала.", es: "Anoche cantó maravillosamente en la fiesta.", pt: "Ela cantou lindamente na festa ontem à noite.", fr: "Elle a chanté magnifiquement à la fête hier soir.", de: "Sie hat gestern Abend auf der Party wunderschön gesungen.", it: "Ieri sera ha cantato magnificamente alla festa.", pl: "Wczoraj wieczorem pięknie śpiewała na przyjęciu.", tr: "Dün gece partide çok güzel şarkı söyledi.", id: "Dia bernyanyi dengan indah di pesta tadi malam.", vi: "Tối qua cô ấy đã hát rất hay ở bữa tiệc." } }
        - { level: B2, point: { en: Phrasal verb, uk: "Фразове дієслово", es: "Phrasal verb", pt: "Phrasal verb", fr: "Phrasal verb", de: "Phrasal Verb", it: "Phrasal verb", pl: "Czasownik frazowy", tr: "Phrasal verb", id: "Phrasal verb", vi: "Cụm động từ" }, rule: { en: "a pronoun object goes between the verb and the particle", uk: "додаток-займенник стоїть між дієсловом і часткою", es: "un objeto pronominal va entre el verbo y la partícula", pt: "um objeto pronominal vai entre o verbo e a partícula", fr: "un complément pronominal se place entre le verbe et la particule", de: "ein Pronomen als Objekt steht zwischen Verb und Partikel", it: "un complemento oggetto pronominale sta tra il verbo e la particella", pl: "dopełnienie będące zaimkiem stoi między czasownikiem a partykułą", tr: "zamir olan nesne, fiil ile parçacığın arasına girer", id: "objek berupa kata ganti berada di antara kata kerja dan partikel", vi: "tân ngữ là đại từ đứng giữa động từ và tiểu từ" }, ex: ["She turned ", { target: it off }, "."], tr: { uk: "Вона його вимкнула.", es: "Lo apagó.", pt: "Ela o desligou.", fr: "Elle l’a éteint.", de: "Sie hat es ausgeschaltet.", it: "Lo ha spento.", pl: "Wyłączyła to.", tr: "Onu kapattı.", id: "Dia mematikannya.", vi: "Cô ấy đã tắt nó." } }
        - { level: C1, point: { en: Information, uk: "Інформація", es: "Información", pt: "Informação", fr: "Information", de: "Information", it: "Informazione", pl: "Informacja", tr: "Bilgi", id: "Informasi", vi: "Thông tin" }, rule: { en: "given information first; new and long parts last", uk: "спершу відома інформація; нові й довгі частини — наприкінці", es: "primero la información conocida; las partes nuevas y largas, al final", pt: "primeiro a informação conhecida; as partes novas e longas, por último", fr: "d’abord l’information connue ; les parties nouvelles et longues à la fin", de: "zuerst die bekannte Information; neue und lange Teile zuletzt", it: "prima l'informazione nota; le parti nuove e lunghe alla fine", pl: "najpierw informacja znana; części nowe i długie na końcu", tr: "önce bilinen bilgi; yeni ve uzun parçalar en sonda", id: "informasi yang sudah diketahui lebih dulu; bagian baru dan panjang di akhir", vi: "thông tin đã biết đứng trước; phần mới và phần dài đứng cuối" }, ex: ["She told the class ", { target: what had happened on the trip }, "."], tr: { uk: "Вона розповіла класові, що сталося під час поїздки.", es: "Le contó a la clase lo que había pasado en el viaje.", pt: "Ela contou para a turma o que tinha acontecido na viagem.", fr: "Elle a raconté à la classe ce qui s’était passé pendant le voyage.", de: "Sie erzählte der Klasse, was auf der Reise passiert war.", it: "Ha raccontato alla classe che cosa era successo durante il viaggio.", pl: "Opowiedziała klasie, co się wydarzyło podczas wycieczki.", tr: "Sınıfa gezide neler olduğunu anlattı.", id: "Dia menceritakan kepada kelas apa yang terjadi selama perjalanan.", vi: "Cô ấy kể cho cả lớp nghe chuyện đã xảy ra trong chuyến đi." } }
        - { level: C1, point: { en: Focus, uk: "Фокус", es: "Foco", pt: "Foco", fr: "Focalisation", de: "Fokus", it: "Focus", pl: "Fokus", tr: "Odak", id: "Fokus", vi: "Tiêu điểm" }, rule: { en: [{ term: only }, ", ", { term: even }, " and ", { term: just }, " stand before the word they limit"], uk: [{ term: "only" }, ", ", { term: "even" }, " і ", { term: "just" }, " стоять перед словом, яке вони обмежують"], es: [{ term: "only" }, ", ", { term: "even" }, " y ", { term: "just" }, " van antes de la palabra que limitan"], pt: [{ term: "only" }, ", ", { term: "even" }, " e ", { term: "just" }, " vêm antes da palavra que limitam"], fr: [{ term: "only" }, ", ", { term: "even" }, " et ", { term: "just" }, " se placent avant le mot qu’ils limitent"], de: [{ term: "only" }, ", ", { term: "even" }, " und ", { term: "just" }, " stehen vor dem Wort, das sie einschränken"], it: [{ term: "only" }, ", ", { term: "even" }, " e ", { term: "just" }, " stanno prima della parola che limitano"], pl: [{ term: "only" }, ", ", { term: "even" }, " i ", { term: "just" }, " stoją przed wyrazem, który ograniczają"], tr: [{ term: "only" }, ", ", { term: "even" }, " ve ", { term: "just" }, ", sınırladıkları sözcükten önce gelir"], id: [{ term: "only" }, ", ", { term: "even" }, ", dan ", { term: "just" }, " berada sebelum kata yang dibatasinya"], vi: [{ term: "only" }, ", ", { term: "even" }, " và ", { term: "just" }, " đứng trước từ mà chúng giới hạn"] }, ex: { contrast: [[{ target: Only }, " Tom borrowed the car."], ["Tom borrowed ", { target: only }, " the car."]] }, tr: { uk: { contrast: ["Машину позичив лише Том.", "Том позичив лише машину."] }, es: { contrast: ["Solo Tom pidió prestado el coche.", "Tom pidió prestado solo el coche."] }, pt: { contrast: ["Só o Tom pegou o carro emprestado.", "O Tom pegou emprestado só o carro."] }, fr: { contrast: ["Seul Tom a emprunté la voiture.", "Tom a emprunté seulement la voiture."] }, de: { contrast: ["Nur Tom hat sich das Auto geliehen.", "Tom hat sich nur das Auto geliehen."] }, it: { contrast: ["Solo Tom ha preso in prestito la macchina.", "Tom ha preso in prestito solo la macchina."] }, pl: { contrast: ["Samochód pożyczył tylko Tom.", "Tom pożyczył tylko samochód."] }, tr: { contrast: ["Arabayı yalnızca Tom ödünç aldı.", "Tom yalnızca arabayı ödünç aldı."] }, id: { contrast: ["Hanya Tom yang meminjam mobil itu.", "Tom hanya meminjam mobil itu."] }, vi: { contrast: ["Chỉ có Tom mượn xe.", "Tom chỉ mượn chiếc xe."] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: place comes before time, uk: "місце стоїть перед часом", es: "el lugar va antes del tiempo", pt: "o lugar vem antes do tempo", fr: "le lieu vient avant le moment", de: "der Ort steht vor der Zeit", it: "il luogo viene prima del tempo", pl: "miejsce stoi przed czasem", tr: "yer zamandan önce gelir", id: "tempat diletakkan sebelum waktu", vi: "nơi chốn đứng trước thời gian" }, ex: ["I went ", { target: to London yesterday }, "."], tr: { uk: "Вчора я їздив до Лондона.", es: "Fui a Londres ayer.", pt: "Eu fui para Londres ontem.", fr: "Je suis allé à Londres hier.", de: "Ich war gestern in London.", it: "Sono andato a Londra ieri.", pl: "Wczoraj pojechałem do Londynu.", tr: "Dün Londra’ya gittim.", id: "Kemarin saya pergi ke London.", vi: "Hôm qua tôi đã đến London." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "The order is subject, verb, object (SVO), then place, then time."
              uk: "Порядок такий: підмет, дієслово, додаток (SVO), потім місце, потім час."
              es: "El orden es sujeto, verbo, objeto (SVO), luego lugar y luego tiempo."
              pt: "A ordem é sujeito, verbo, objeto (SVO), depois lugar e depois tempo."
              fr: "L’ordre est sujet, verbe, complément (SVO), puis lieu, puis moment."
              de: "Die Reihenfolge ist Subjekt, Verb, Objekt (SVO), dann Ort, dann Zeit."
              it: "L'ordine è soggetto, verbo, complemento oggetto (SVO), poi luogo, poi tempo."
              pl: "Kolejność jest taka: podmiot, czasownik, dopełnienie (SVO), potem miejsce, potem czas."
              tr: "Sıra şöyledir: özne, fiil, nesne (SVO), sonra yer, sonra zaman."
              id: "Urutannya: subjek, kata kerja, objek (SVO), lalu tempat, lalu waktu."
              vi: "Trật tự là chủ ngữ, động từ, tân ngữ (SVO), rồi đến nơi chốn, rồi đến thời gian."
          - type: note
            level: A0
            text:
              en: ["Questions change the order. See ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, "."]
              uk: ["У питаннях порядок слів змінюється. Див. ", { link: "Питання та заперечення", to: en.sentence-building.questions-negatives }, "."]
              es: ["Las preguntas cambian el orden. Ver ", { link: "Preguntas y negaciones", to: en.sentence-building.questions-negatives }, "."]
              pt: ["As perguntas mudam a ordem. Ver ", { link: "Perguntas e negações", to: "en.sentence-building.questions-negatives" }, "."]
              fr: ["Les questions changent l’ordre. Voir ", { link: "Questions et négations", to: "en.sentence-building.questions-negatives" }, "."]
              de: ["Fragen ändern die Reihenfolge. Siehe ", { link: "Fragen und Verneinung", to: "en.sentence-building.questions-negatives" }, "."]
              it: ["Le domande cambiano l'ordine. Vedi ", { link: "Domande e negazioni", to: "en.sentence-building.questions-negatives" }, "."]
              pl: ["Pytania zmieniają szyk. Zob. ", { link: "Pytania i przeczenia", to: "en.sentence-building.questions-negatives" }, "."]
              tr: ["Soru cümleleri sırayı değiştirir. Bkz. ", { link: "Sorular ve olumsuz cümleler", to: "en.sentence-building.questions-negatives" }, "."]
              id: ["Pertanyaan mengubah urutan. Lihat ", { link: "Pertanyaan dan kalimat negatif", to: "en.sentence-building.questions-negatives" }, "."]
              vi: ["Câu hỏi thay đổi trật tự. Xem ", { link: "Câu hỏi và câu phủ định", to: "en.sentence-building.questions-negatives" }, "."]

  - title: { en: "Form: statements", uk: "Форма: стверджувальні речення", es: "Forma: oraciones afirmativas", pt: "Forma: frases afirmativas", fr: "Forme : phrases affirmatives", de: "Form: Aussagesätze", it: "Forma: frasi affermative", pl: "Forma: zdania twierdzące", tr: "Biçim: olumlu cümleler", id: "Bentuk: kalimat pernyataan", vi: "Dạng: câu trần thuật" }
    role: form
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, rule: { en: The subject is always present., uk: "Підмет завжди присутній.", es: "El sujeto siempre está presente.", pt: "O sujeito sempre está presente.", fr: "Le sujet est toujours exprimé.", de: "Das Subjekt ist immer vorhanden.", it: "Il soggetto è sempre presente.", pl: "Podmiot jest zawsze obecny.", tr: "Özne her zaman bulunur.", id: "Subjek selalu ada.", vi: "Chủ ngữ luôn có mặt." }, ex: { examples: [[{ target: It }, " is cold."], [{ target: She }, " lives in Madrid."]] }, tr: { uk: { examples: ["Холодно.", "Вона живе в Мадриді."] }, es: { examples: ["Hace frío.", "Ella vive en Madrid."] }, pt: { examples: ["Está frio.", "Ela mora em Madri."] }, fr: { examples: ["Il fait froid.", "Elle habite à Madrid."] }, de: { examples: ["Es ist kalt.", "Sie wohnt in Madrid."] }, it: { examples: ["Fa freddo.", "Lei vive a Madrid."] }, pl: { examples: ["Jest zimno.", "Ona mieszka w Madrycie."] }, tr: { examples: ["Hava soğuk.", "O Madrid’de yaşıyor."] }, id: { examples: ["Cuaca dingin.", "Dia tinggal di Madrid."] }, vi: { examples: ["Trời lạnh.", "Cô ấy sống ở Madrid."] } } }
          - { level: A0, rule: { en: The verb comes right after the subject., uk: "Дієслово стоїть одразу після підмета.", es: "El verbo va justo después del sujeto.", pt: "O verbo vem logo depois do sujeito.", fr: "Le verbe se place juste après le sujet.", de: "Das Verb steht direkt nach dem Subjekt.", it: "Il verbo viene subito dopo il soggetto.", pl: "Czasownik stoi tuż po podmiocie.", tr: "Fiil hemen öznenin arkasından gelir.", id: "Kata kerja berada tepat setelah subjek.", vi: "Động từ đứng ngay sau chủ ngữ." }, ex: ["My friend ", { target: came }, " early."], tr: { uk: "Мій друг прийшов рано.", es: "Mi amigo llegó temprano.", pt: "Meu amigo chegou cedo.", fr: "Mon ami est arrivé tôt.", de: "Mein Freund kam früh.", it: "Il mio amico è arrivato presto.", pl: "Mój przyjaciel przyszedł wcześnie.", tr: "Arkadaşım erken geldi.", id: "Teman saya datang lebih awal.", vi: "Bạn tôi đã đến sớm." } }
          - { level: A0, rule: { en: The object comes right after the verb., uk: "Додаток стоїть одразу після дієслова.", es: "El objeto va justo después del verbo.", pt: "O objeto vem logo depois do verbo.", fr: "Le complément se place juste après le verbe.", de: "Das Objekt steht direkt nach dem Verb.", it: "Il complemento oggetto viene subito dopo il verbo.", pl: "Dopełnienie stoi tuż po czasowniku.", tr: "Nesne hemen fiilin arkasından gelir.", id: "Objek berada tepat setelah kata kerja.", vi: "Tân ngữ đứng ngay sau động từ." }, ex: ["I ", { target: drink tea }, " at night."], tr: { uk: "Я п’ю чай уночі.", es: "Bebo té por la noche.", pt: "Eu bebo chá à noite.", fr: "Je bois du thé la nuit.", de: "Ich trinke nachts Tee.", it: "Bevo il tè la sera.", pl: "Piję herbatę w nocy.", tr: "Geceleri çay içerim.", id: "Saya minum teh pada malam hari.", vi: "Tôi uống trà vào buổi tối." } }
          - { level: A0, rule: { en: An adjective comes before the noun., uk: "Прикметник стоїть перед іменником.", es: "El adjetivo va antes del sustantivo.", pt: "O adjetivo vem antes do substantivo.", fr: "L’adjectif se place avant le nom.", de: "Ein Adjektiv steht vor dem Nomen.", it: "L'aggettivo va prima del sostantivo.", pl: "Przymiotnik stoi przed rzeczownikiem.", tr: "Sıfat ismin önünde gelir.", id: "Kata sifat diletakkan sebelum kata benda.", vi: "Tính từ đứng trước danh từ." }, ex: ["I have a ", { target: red car }, "."], tr: { uk: "У мене червона машина.", es: "Tengo un coche rojo.", pt: "Eu tenho um carro vermelho.", fr: "J’ai une voiture rouge.", de: "Ich habe ein rotes Auto.", it: "Ho una macchina rossa.", pl: "Mam czerwony samochód.", tr: "Kırmızı bir arabam var.", id: "Saya punya mobil merah.", vi: "Tôi có một chiếc xe màu đỏ." } }
          - { level: B2, rule: { en: "A pronoun object stands between the verb and the particle.", uk: "Додаток-займенник стоїть між дієсловом і часткою.", es: "Un objeto pronominal va entre el verbo y la partícula.", pt: "Um objeto pronominal vai entre o verbo e a partícula.", fr: "Un complément pronominal se place entre le verbe et la particule.", de: "Ein Pronomen als Objekt steht zwischen Verb und Partikel.", it: "Un complemento oggetto pronominale sta tra il verbo e la particella.", pl: "Dopełnienie będące zaimkiem stoi między czasownikiem a partykułą.", tr: "Zamir olan nesne, fiil ile parçacığın arasına girer.", id: "Objek berupa kata ganti berada di antara kata kerja dan partikel.", vi: "Tân ngữ là đại từ đứng giữa động từ và tiểu từ." }, ex: ["She turned ", { target: it off }, "."], tr: { uk: "Вона його вимкнула.", es: "Lo apagó.", pt: "Ela o desligou.", fr: "Elle l’a éteint.", de: "Sie hat es ausgeschaltet.", it: "Lo ha spento.", pl: "Wyłączyła to.", tr: "Onu kapattı.", id: "Dia mematikannya.", vi: "Cô ấy đã tắt nó." } }
          - { level: B2, rule: { en: "A long object stands after the particle.", uk: "Довгий додаток стоїть після частки.", es: "Un objeto largo va después de la partícula.", pt: "Um objeto longo vem depois da partícula.", fr: "Un complément long se place après la particule.", de: "Ein langes Objekt steht nach der Partikel.", it: "Un complemento oggetto lungo sta dopo la particella.", pl: "Długie dopełnienie stoi po partykule.", tr: "Uzun nesne parçacıktan sonra gelir.", id: "Objek panjang berada setelah partikel.", vi: "Tân ngữ dài đứng sau tiểu từ." }, ex: ["She turned off ", { target: all the lights in the hall }, "."], tr: { uk: "Вона вимкнула все світло в холі.", es: "Apagó todas las luces del vestíbulo.", pt: "Ela apagou todas as luzes do hall.", fr: "Elle a éteint toutes les lumières du hall.", de: "Sie schaltete alle Lichter im Flur aus.", it: "Ha spento tutte le luci dell'ingresso.", pl: "Wyłączyła wszystkie światła w holu.", tr: "Holdeki bütün ışıkları kapattı.", id: "Dia mematikan semua lampu di koridor.", vi: "Cô ấy tắt tất cả đèn ở sảnh." } }
      - type: list
        items:
          - type: note
            level: A0
            text:
              en: ["For two or more adjectives, see ", { link: Adjective order, to: en.adjectives-adverbs.adjective-order }, "."]
              uk: ["Про два й більше прикметників див. ", { link: "Прикметники та їхній порядок", to: en.adjectives-adverbs.adjective-order }, "."]
              es: ["Para dos o más adjetivos, ver ", { link: "Los adjetivos y su orden", to: en.adjectives-adverbs.adjective-order }, "."]
              pt: ["Para dois ou mais adjetivos, ver ", { link: "Adjetivos e sua ordem", to: "en.adjectives-adverbs.adjective-order" }, "."]
              fr: ["Pour deux adjectifs ou plus, voir ", { link: "Adjectifs et ordre des adjectifs", to: "en.adjectives-adverbs.adjective-order" }, "."]
              de: ["Zu zwei oder mehr Adjektiven siehe ", { link: "Adjektive und ihre Reihenfolge", to: "en.adjectives-adverbs.adjective-order" }, "."]
              it: ["Per due o più aggettivi, vedi ", { link: "Gli aggettivi e il loro ordine", to: "en.adjectives-adverbs.adjective-order" }, "."]
              pl: ["O dwóch lub więcej przymiotnikach zob. ", { link: "Przymiotniki i ich kolejność", to: "en.adjectives-adverbs.adjective-order" }, "."]
              tr: ["İki veya daha fazla sıfat için bkz. ", { link: "Sıfatlar ve sıfat sırası", to: "en.adjectives-adverbs.adjective-order" }, "."]
              id: ["Untuk dua kata sifat atau lebih, lihat ", { link: "Kata sifat dan urutan kata sifat", to: "en.adjectives-adverbs.adjective-order" }, "."]
              vi: ["Với hai tính từ trở lên, xem ", { link: "Tính từ và trật tự tính từ", to: "en.adjectives-adverbs.adjective-order" }, "."]
          - type: note
            level: B2
            text: { en: ["Separable verbs: see ", { link: "Phrasal Verbs", to: en.verbs.phrasal-verbs-core }, "."], uk: ["Роздільні дієслова: див. ", { link: "Фразові дієслова", to: "en.verbs.phrasal-verbs-core" }, "."], es: ["Verbos separables: ver ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], pt: ["Verbos separáveis: ver ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], fr: ["Verbes séparables : voir ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], de: ["Trennbare Verben: siehe ", { link: "Phrasal Verbs", to: "en.verbs.phrasal-verbs-core" }, "."], it: ["Verbi separabili: vedi ", { link: "Phrasal verb", to: "en.verbs.phrasal-verbs-core" }, "."], pl: ["Czasowniki rozdzielne: zob. ", { link: "Czasowniki frazowe", to: "en.verbs.phrasal-verbs-core" }, "."], tr: ["Ayrılabilir fiiller için bkz. ", { link: "Phrasal verbs", to: "en.verbs.phrasal-verbs-core" }, "."], id: ["Phrasal verb yang dapat dipisah: lihat ", { link: "Phrasal verb", to: "en.verbs.phrasal-verbs-core" }, "."], vi: ["Cụm động từ tách được: xem ", { link: "Cụm động từ", to: "en.verbs.phrasal-verbs-core" }, "."] }

  - title: { en: Place and time, uk: "Місце й час", es: "Lugar y tiempo", pt: "Lugar e tempo", fr: "Lieu et moment", de: "Ort und Zeit", it: "Luogo e tempo", pl: "Miejsce i czas", tr: "Yer ve zaman", id: "Tempat dan waktu", vi: "Nơi chốn và thời gian" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, rule: { en: Place comes before time., uk: "Місце стоїть перед часом.", es: "El lugar va antes del tiempo.", pt: "O lugar vem antes do tempo.", fr: "Le lieu vient avant le moment.", de: "Der Ort steht vor der Zeit.", it: "Il luogo viene prima del tempo.", pl: "Miejsce stoi przed czasem.", tr: "Yer zamandan önce gelir.", id: "Tempat diletakkan sebelum waktu.", vi: "Nơi chốn đứng trước thời gian." }, ex: ["I went ", { target: to London }, " ", { target: last year }, "."], tr: { uk: "Торік я їздив до Лондона.", es: "Fui a Londres el año pasado.", pt: "Eu fui para Londres no ano passado.", fr: "Je suis allé à Londres l’année dernière.", de: "Ich war letztes Jahr in London.", it: "Sono andato a Londra l'anno scorso.", pl: "W zeszłym roku pojechałem do Londynu.", tr: "Geçen yıl Londra’ya gittim.", id: "Tahun lalu saya pergi ke London.", vi: "Năm ngoái tôi đã đến London." } }
          - { level: A1, rule: { en: A time word can also start the sentence., uk: "Слово зі значенням часу може стояти й на початку речення.", es: "Una palabra de tiempo también puede abrir la oración.", pt: "Uma palavra de tempo também pode abrir a frase.", fr: "Une indication de temps peut aussi ouvrir la phrase.", de: "Eine Zeitangabe kann auch am Satzanfang stehen.", it: "Una parola di tempo può anche aprire la frase.", pl: "Słowo oznaczające czas może też otwierać zdanie.", tr: "Zaman sözcüğü cümleyi de açabilir.", id: "Kata waktu juga dapat membuka kalimat.", vi: "Từ chỉ thời gian cũng có thể mở đầu câu." }, ex: [{ target: Last year }, " I went to London."], tr: { uk: "Торік я їздив до Лондона.", es: "El año pasado fui a Londres.", pt: "No ano passado eu fui para Londres.", fr: "L’année dernière, je suis allé à Londres.", de: "Letztes Jahr war ich in London.", it: "L'anno scorso sono andato a Londra.", pl: "W zeszłym roku pojechałem do Londynu.", tr: "Geçen yıl Londra’ya gittim.", id: "Tahun lalu saya pergi ke London.", vi: "Năm ngoái tôi đã đến London." } }
          - { level: B2, rule: { en: "Each of several fronted adverbials takes a comma.", uk: "Після кожної з кількох обставин на початку речення стоїть кома.", es: "Cada uno de varios complementos circunstanciales al principio lleva coma.", pt: "Cada um de vários adjuntos adverbiais no início leva vírgula.", fr: "Chacun des compléments circonstanciels placés en tête est suivi d’une virgule.", de: "Nach jeder von mehreren vorangestellten Adverbialen steht ein Komma.", it: "Ognuno dei vari complementi circostanziali all'inizio prende la virgola.", pl: "Po każdym z kilku okoliczników na początku zdania stawia się przecinek.", tr: "Başa alınan birkaç zarf tümlecinin her biri virgül alır.", id: "Setiap keterangan dari beberapa keterangan di awal kalimat diikuti koma.", vi: "Mỗi trạng ngữ trong số nhiều trạng ngữ ở đầu câu đều có dấu phẩy." }, ex: [{ target: Last summer }, ", ", { target: in Spain }, ", we met an old friend."], tr: { uk: "Минулого літа, в Іспанії, ми зустріли старого друга.", es: "El verano pasado, en España, nos encontramos con un viejo amigo.", pt: "No verão passado, na Espanha, nós encontramos um velho amigo.", fr: "L’été dernier, en Espagne, nous avons rencontré un vieil ami.", de: "Letzten Sommer haben wir in Spanien einen alten Freund getroffen.", it: "L'estate scorsa, in Spagna, abbiamo incontrato un vecchio amico.", pl: "Zeszłego lata, w Hiszpanii, spotkaliśmy starego przyjaciela.", tr: "Geçen yaz, İspanya’da, eski bir arkadaşımızla karşılaştık.", id: "Musim panas lalu, di Spanyol, kami bertemu seorang teman lama.", vi: "Mùa hè năm ngoái, ở Tây Ban Nha, chúng tôi đã gặp một người bạn cũ." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A time phrase at the start often takes a comma:"
              uk: "Зворот часу на початку речення часто відокремлюють комою:"
              es: "Una expresión de tiempo al principio suele llevar coma:"
              pt: "Uma expressão de tempo no início costuma levar vírgula:"
              fr: "Une indication de temps en début de phrase est souvent suivie d’une virgule :"
              de: "Nach einer Zeitangabe am Satzanfang steht oft ein Komma:"
              it: "Un'espressione di tempo all'inizio prende spesso la virgola:"
              pl: "Wyrażenie czasu na początku zdania często oddziela się przecinkiem:"
              tr: "Başta yer alan zaman ifadesinden sonra çoğunlukla virgül gelir:"
              id: "Keterangan waktu di awal kalimat sering diikuti koma:"
              vi: "Cụm chỉ thời gian ở đầu câu thường kèm dấu phẩy:"
            ex: [{ target: Last summer }, ", we went to Italy."]
            tr: { uk: "Минулого літа ми їздили до Італії.", es: "El verano pasado fuimos a Italia.", pt: "No verão passado, nós fomos para a Itália.", fr: "L’été dernier, nous sommes allés en Italie.", de: "Letzten Sommer sind wir nach Italien gefahren.", it: "L'estate scorsa siamo andati in Italia.", pl: "Zeszłego lata pojechaliśmy do Włoch.", tr: "Geçen yaz İtalya’ya gittik.", id: "Musim panas lalu, kami pergi ke Italia.", vi: "Mùa hè năm ngoái, chúng tôi đã đi Ý." }
          - type: rule
            level: A1
            text:
              en: "A place or time word follows the object:"
              uk: "Слово місця або часу стоїть після додатка:"
              es: "Una palabra de lugar o de tiempo va después del objeto:"
              pt: "Uma palavra de lugar ou de tempo vem depois do objeto:"
              fr: "Une indication de lieu ou de temps se place après le complément :"
              de: "Eine Orts- oder Zeitangabe steht nach dem Objekt:"
              it: "Una parola di luogo o di tempo viene dopo il complemento oggetto:"
              pl: "Słowo oznaczające miejsce lub czas stoi po dopełnieniu:"
              tr: "Yer veya zaman sözcüğü nesneden sonra gelir:"
              id: "Kata tempat atau waktu berada setelah objek:"
              vi: "Từ chỉ nơi chốn hoặc thời gian đứng sau tân ngữ:"
            ex: ["I met ", { target: Ana }, " in the park."]
            tr: { uk: "Я зустрів Ану в парку.", es: "Me encontré con Ana en el parque.", pt: "Eu encontrei a Ana no parque.", fr: "J’ai rencontré Ana au parc.", de: "Ich habe Ana im Park getroffen.", it: "Ho incontrato Ana al parco.", pl: "Spotkałem Anę w parku.", tr: "Ana’yla parkta buluştum.", id: "Saya bertemu Ana di taman.", vi: "Tôi đã gặp Ana ở công viên." }

