  - title: { en: "Position of adverbials", uk: "Місце обставин", es: "Posición de los complementos circunstanciales", pt: "Posição dos adjuntos adverbiais", fr: "Place des compléments circonstanciels", de: "Stellung der Adverbiale", it: "Posizione dei complementi circostanziali", pl: "Pozycja okoliczników", tr: "Zarf tümleçlerinin yeri", id: "Posisi keterangan", vi: "Vị trí của trạng ngữ" }
