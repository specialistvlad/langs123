          - { key: adverbials, label: { en: Adverbials, uk: "Обставини", es: "Complementos circunstanciales", pt: "Adjuntos adverbiais", fr: "Compléments circonstanciels", de: "Adverbiale", it: "Complementi circostanziali", pl: "Okoliczniki", tr: "Zarf tümleçleri", id: "Keterangan", vi: "Trạng ngữ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, position: { en: Front, uk: "На початку", es: "Al principio", pt: "No início", fr: "En tête", de: "Am Anfang", it: "All'inizio", pl: "Na początku", tr: "Başta", id: "Di awal", vi: "Ở đầu câu" }, adverbials: { en: ["time, place and viewpoint: ", { term: luckily }, ", ", { term: frankly }, "; a comma follows"], uk: ["час, місце й точка зору мовця: ", { term: "luckily" }, ", ", { term: "frankly" }, "; після них стоїть кома"], es: ["tiempo, lugar y punto de vista: ", { term: "luckily" }, ", ", { term: "frankly" }, "; va seguido de coma"], pt: ["tempo, lugar e ponto de vista: ", { term: "luckily" }, ", ", { term: "frankly" }, "; segue-se uma vírgula"], fr: ["moment, lieu et point de vue : ", { term: "luckily" }, ", ", { term: "frankly" }, " ; une virgule suit"], de: ["Zeit, Ort und Standpunkt des Sprechers: ", { term: "luckily" }, ", ", { term: "frankly" }, "; ein Komma folgt"], it: ["tempo, luogo e punto di vista: ", { term: "luckily" }, ", ", { term: "frankly" }, "; segue una virgola"], pl: ["czas, miejsce i punkt widzenia: ", { term: "luckily" }, ", ", { term: "frankly" }, "; po nich stawia się przecinek"], tr: ["zaman, yer ve bakış açısı: ", { term: "luckily" }, ", ", { term: "frankly" }, "; ardından virgül gelir"], id: ["waktu, tempat, dan sudut pandang: ", { term: "luckily" }, ", ", { term: "frankly" }, "; diikuti koma"], vi: ["thời gian, nơi chốn và quan điểm: ", { term: "luckily" }, ", ", { term: "frankly" }, "; theo sau là dấu phẩy"] }, ex: { examples: [[{ target: Luckily }, ", nobody was hurt."], [{ target: In the evenings }, ", we walk by the river."]] }, tr: { uk: { examples: ["На щастя, ніхто не постраждав.", "Вечорами ми гуляємо вздовж річки."] }, es: { examples: ["Por suerte, nadie resultó herido.", "Por las tardes caminamos junto al río."] }, pt: { examples: ["Felizmente, ninguém se feriu.", "À noite, nós caminhamos à beira do rio."] }, fr: { examples: ["Heureusement, personne n’a été blessé.", "Le soir, nous nous promenons au bord de la rivière."] }, de: { examples: ["Zum Glück wurde niemand verletzt.", "Abends gehen wir am Fluss spazieren."] }, it: { examples: ["Per fortuna, nessuno si è fatto male.", "La sera passeggiamo lungo il fiume."] }, pl: { examples: ["Na szczęście nikt nie został ranny.", "Wieczorami spacerujemy nad rzeką."] }, tr: { examples: ["Neyse ki kimse yaralanmadı.", "Akşamları nehir kenarında yürürüz."] }, id: { examples: ["Untungnya, tidak ada yang terluka.", "Pada malam hari, kami berjalan-jalan di tepi sungai."] }, vi: { examples: ["May mắn là không ai bị thương.", "Vào buổi tối, chúng tôi đi dạo bên bờ sông."] } } }
          - { level: B2, position: { en: "Middle: after an auxiliary", uk: "Всередині: після допоміжного дієслова", es: "En medio: después de un auxiliar", pt: "No meio: depois de um auxiliar", fr: "Au milieu : après un auxiliaire", de: "In der Mitte: nach einem Hilfsverb", it: "Nel mezzo: dopo un ausiliare", pl: "W środku: po czasowniku pomocniczym", tr: "Ortada: yardımcı fiilden sonra", id: "Di tengah: setelah kata kerja bantu", vi: "Ở giữa: sau trợ động từ" }, adverbials: { en: ["certainty, time and degree: ", { term: probably }, ", ", { term: already }, ", ", { term: just }, ", ", { term: completely }], uk: ["впевненість, час і ступінь: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], es: ["certeza, tiempo y grado: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], pt: ["certeza, tempo e grau: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], fr: ["certitude, moment et degré : ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], de: ["Sicherheit, Zeit und Grad: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], it: ["certezza, tempo e grado: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], pl: ["pewność, czas i stopień: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], tr: ["kesinlik, zaman ve derece: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], id: ["kepastian, waktu, dan tingkat: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { term: "completely" }], vi: ["mức chắc chắn, thời gian và mức độ: ", { term: "probably" }, ", ", { term: "already" }, ", ", { term: "just" }, ", ", { te