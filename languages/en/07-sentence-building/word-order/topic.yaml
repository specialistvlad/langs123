title: { en: Word Order, uk: Порядок слів, es: El orden de las palabras, pt: "Ordem das palavras", fr: "Ordre des mots", de: "Wortstellung", it: "L'ordine delle parole", pl: "Szyk zdania", tr: "Sözcük sırası", id: "Urutan kata", vi: "Trật tự từ" }
summary:
  lead:
    en: "The order of subject, verb, object, adjectives and adverbs in an English sentence."
    uk: "Порядок підмета, дієслова, додатка, прикметників і прислівників в англійському реченні."
    es: "El orden del sujeto, el verbo, el objeto, los adjetivos y los adverbios en una oración inglesa."
    pt: "A ordem do sujeito, do verbo, do objeto, dos adjetivos e dos advérbios em uma frase em inglês."
    fr: "L’ordre du sujet, du verbe, du complément, des adjectifs et des adverbes dans une phrase anglaise."
    de: "Die Reihenfolge von Subjekt, Verb, Objekt, Adjektiven und Adverbien im englischen Satz."
    it: "L'ordine di soggetto, verbo, complemento oggetto, aggettivi e avverbi in una frase inglese."
    pl: "Kolejność podmiotu, czasownika, dopełnienia, przymiotników i przysłówków w zdaniu angielskim."
    tr: "İngilizce bir cümlede özne, fiil, nesne, sıfatların ve zarfların sırası."
    id: "Urutan subjek, kata kerja, objek, kata sifat, dan kata keterangan dalam kalimat bahasa Inggris."
    vi: "Trật tự của chủ ngữ, động từ, tân ngữ, tính từ và trạng từ trong câu tiếng Anh."
  rule:
    en: "The subject is always present and the adjective comes before the noun:"
    uk: "Підмет у реченні є завжди, а прикметник стоїть перед іменником:"
    es: "El sujeto siempre está presente y el adjetivo va antes del sustantivo:"
    pt: "O sujeito sempre está presente e o adjetivo vem antes do substantivo:"
    fr: "Le sujet est toujours exprimé et l’adjectif se place avant le nom :"
    de: "Das Subjekt ist immer vorhanden, und das Adjektiv steht vor dem Nomen:"
    it: "Il soggetto è sempre presente e l'aggettivo va prima del sostantivo:"
    pl: "Podmiot jest w zdaniu zawsze, a przymiotnik stoi przed rzeczownikiem:"
    tr: "Özne her zaman bulunur ve sıfat ismin önünde gelir:"
    id: "Subjek selalu ada dan kata sifat diletakkan sebelum kata benda:"
    vi: "Chủ ngữ luôn có mặt và tính từ đứng trước danh từ:"
  ex: { examples: [[{ target: It }, " is cold."], ["I have a ", { target: red car }, "."]] }

