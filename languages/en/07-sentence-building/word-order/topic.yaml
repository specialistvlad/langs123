          - { level: A1, adverb: { alternatives: [very much, a lot] }, position: { en: "at the end, after the object", uk: "в кінці, після додатка", es: "al final, después del objeto", pt: "no fim, depois do objeto", fr: "à la fin, après le complément", de: "am Ende, nach dem Objekt", it: "alla fine, dopo il complemento oggetto", pl: "na końcu, po dopełnieniu", tr: "sonda, nesneden sonra", id: "di akhir, setelah objek", vi: "ở cuối câu, sau tân ngữ" }, ex: ["I like coffee ", { target: very much }, "."], tr: { uk: "Я дуже люблю каву.", es: "Me gusta mucho el café.", pt: "Eu gosto muito de café.", fr: "J’aime beaucoup le café.", de: "Ich mag Kaffee sehr.", it: "Mi piace molto il caffè.", pl: "Bardzo lubię kawę.", tr: "Kahveyi çok severim.", id: "Saya sangat suka kopi.", vi: "Tôi rất thích cà phê." } }
