: { en: "place", uk: "місце", es: "lugar", pt: "lugar", fr: "lieu", de: "Ort", it: "luogo", pl: "miejsce", tr: "yer", id: "tempat", vi: "nơi chốn" } }, { slot: { en: "time", uk: "час", es: "tiempo", pt: "tempo", fr: "moment", de: "Zeit", it: "tempo", pl: "czas", tr: "zaman", id: "waktu", vi: "thời gian" } }] }, "."] }, ex: ["She sang ", { target: beautifully at the party last night }, "."], tr: { uk: "Вчора ввечері на вечірці вона чудово співала.", es: "Anoche cantó maravillosamente en la fiesta.", pt: "Ela cantou lindamente na festa ontem à noite.", fr: "Elle a chanté magnifiquement à la fête hier soir.", de: "Sie hat gestern Abend auf der Party wunderschön gesungen.", it: "Ieri sera ha cantato magnificamente alla festa.", pl: "Wczoraj wieczorem pięknie śpiewała na przyjęciu.", tr: "Dün gece partide çok güzel şarkı söyledi.", id: "Dia bernyanyi dengan indah di pesta tadi malam.", vi: "Tối qua cô ấy đã hát rất hay ở bữa tiệc." } }
          - { level: B2, rule: { en: "The object follows the verb directly, and the adverbial follows the object.", uk: "Додаток стоїть одразу після дієслова, а обставина — після додатка.", es: "El objeto va justo después del verbo, y el complemento circunstancial va después del objeto.", pt: "O objeto vem logo depois do verbo, e o adjunto adverbial vem depois do objeto.", fr: "Le complément suit directement le verbe, et le complément circonstanciel vient après lui.", de: "Das Objekt steht direkt nach dem Verb, und die Adverbiale steht nach dem Objekt.", it: "Il complemento oggetto segue direttamente il verbo, e il complemento circostanziale segue il complemento oggetto.", pl: "Dopełnienie stoi tuż po czasowniku, a okolicznik stoi po dopełnieniu.", tr: "Nesne doğrudan fiilin arkasından gelir, zarf tümleci de nesneden sonra gelir.", id: "Objek berada tepat setelah kata kerja, dan keterangan berada setelah objek.", vi: "Tân ngữ đứng ngay sau động từ, và trạng ngữ đứng sau tân ngữ." }, ex: { examples: [["She speaks English ", { target: fluently }, "."], ["He opened the door ", { target: quietly }, "."]] }, tr: { uk: { examples: ["Вона вільно розмовляє англійською.", "Він тихо відчинив двері."] }, es: { examples: ["Habla inglés con fluidez.", "Abrió la puerta en silencio."] }, pt: { examples: ["Ela fala inglês fluentemente.", "Ele abriu a porta em silêncio."] }, fr: { examples: ["Elle parle anglais couramment.", "Il a ouvert la porte doucement."] }, de: { examples: ["Sie spricht fließend Englisch.", "Er öffnete leise die Tür."] }, it: { examples: ["Parla inglese fluentemente.", "Ha aperto la porta piano."] }, pl: { examples: ["Ona biegle mówi po angielsku.", "On cicho otworzył drzwi."] }, tr: { examples: ["İngilizceyi akıcı konuşur.", "Kapıyı sessizce açtı."] }, id: { examples: ["Dia berbicara bahasa Inggris dengan lancar.", "Dia membuka pintu dengan pelan."] }, vi: { examples: ["Cô ấy nói tiếng Anh trôi chảy.", "Anh ấy mở cửa nhẹ nhàng."] } } }

  - title: { en: "Information structure", uk: "Структура інформації", es: "Estructura de la información", pt: "Estrutura da informação", fr: "Structure de l’information", de: "Informationsstruktur", it: "Struttura dell'informazione", pl: "Struktura informacyjna", tr: "Bilgi yapısı", id: "Struktur informasi", vi: "Cấu trúc thông tin" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, rule: { en: "Given information comes first and new information comes last.", uk: "Відома інформація йде першою, а нова — останньою.", es: "La información conocida va primero y la información nueva va al final.", pt: "A informação conhecida vem primeiro e a informação nova vem por último.", fr: "L’information connue vient en premier et l’information nouvelle vient en dernier.", de: "Bekannte Information steht zuerst, neue Information steht zuletzt.", it: "L'informazione già nota viene per prima e l'informazione nuova viene per ultima.", pl: "Informacja znana stoi na początku, a nowa — na końcu.", tr: "Bilinen bilgi önce gelir, yeni bilgi en sona gelir.", id: "Informasi yang sudah diketahui berada di depan, dan informasi baru berada di belakang.", vi: "Thông tin đã biết đứng trước, thông tin mới đứng sau cùng." }, ex: ["I bought a book yesterday. The book was ", { target: about sailing }, "."], tr: { uk: "Вчора я купив книжку. Книжка була про вітрильний спорт.", es: "Ayer compré un libro. El libro era sobre navegación a vela.", pt: "Ontem eu comprei um livro. O livro era sobre navegação à vela.", fr: "Hier, j’ai acheté un livre. Le livre parlait de voile.", de: "Gestern habe ich ein Buch gekauft. Das Buch handelte vom Segeln.", it: "Ieri ho comprato un libro. Il libro parlava di vela.", pl: "Wczoraj kupiłem książkę. Książka była o żeglarstwie.", tr: "Dün bir kitap aldım. Kitap yelkencilik hakkındaydı.", id: "Kemarin saya membeli sebuah buku. Buku itu tentang berlayar.", vi: "Hôm qua tôi mua một cuốn sách. Cuốn sách nói về môn đi thuyền buồm." } }
          - { level: C1, rule: { en: "Long parts come last.", uk: "Довгі частини йдуть останніми.", es: "Las partes largas van al final.", pt: "As partes longas vêm por último.", fr: "Les parties longues viennent en dernier.", de: "Lange Teile stehen zuletzt.", it: "Le parti lunghe vengono per ultime.", pl: "Długie części stoją na końcu.", tr: "Uzun parçalar en sona gelir.", id: "Bagian yang panjang berada di akhir.", vi: "Các phần dài đứng cuối." }, ex: ["She told the class ", { target: what had happened on the trip }, "."], tr: { uk: "Вона розповіла класові, що сталося під час поїздки.", es: "Le contó a la clase lo que había pasado en el viaje.", pt: "Ela contou para a turma o que tinha acontecido na viagem.", fr: "Elle a raconté à la classe ce qui s’était passé pendant le voyage.", de: "Sie erzählte der Klasse, was auf der Reise passiert war.", it: "Ha raccontato alla classe che cosa era successo durante il viaggio.", pl: "Opowiedziała klasie, co się wydarzyło podczas wycieczki.", tr: "Sınıfa gezide neler olduğunu anlattı.", id: "Dia menceritakan kepada kelas apa yang terjadi selama perjalanan.", vi: "Cô ấy kể cho cả lớp nghe chuyện đã xảy ra trong chuyến đi." } }
          - { level: C1, rule: { en: "Fronting a part contrasts it with another part.", uk: "Частина, винесена на початок, протиставляється іншій частині.", es: "Una parte que se pone al principio se contrapone a otra.", pt: "Uma parte colocada no início se contrapõe a outra.", fr: "Une partie placée en tête s’oppose à une autre.", de: "Ein nach vorn gestellter Teil wird einem anderen Teil gegenübergestellt.", it: "Una parte messa all'inizio si contrappone a un'altra.", pl: "Część przesunięta na początek zdania przeciwstawia się innej części.", tr: "Başa alınan bir parça, başka bir parçayla karşıtlık kurar.", id: "Bagian yang dipindah ke depan dikontraskan dengan bagian lain.", vi: "Phần được đưa lên đầu câu tạo sự đối lập với phần khác." }, ex: [{ target: The film }, " I loved; the book I couldn't finish."], tr: { uk: "Фільм мені сподобався; книжку я не зміг дочитати.", es: "La película me encantó; el libro no pude terminarlo.", pt: "O filme eu amei; o livro eu não consegui terminar.", fr: "Le film, je l’ai adoré ; le livre, je n’ai pas pu le finir.", de: "Den Film habe ich geliebt; das Buch konnte ich nicht zu Ende lesen.", it: "Il film l'ho adorato; il libro non sono riuscito a finirlo.", pl: "Film uwielbiałem; książki nie mogłem skończyć.", tr: "Filmi çok sevdim; kitabı bitiremedim.", id: "Filmnya saya suka; bukunya tidak bisa saya selesaikan.", vi: "Bộ phim thì tôi rất thích; cuốn sách thì tôi không đọc hết được." } }
          - { level: C1, rule: { en: ["A long clause subject can move to the end after ", { term: it }, ": extraposition."], uk: ["Довге підрядне речення в ролі підмета може перейти в кінець після ", { term: "it" }, ": екстрапозиція."], es: ["Un sujeto largo que es una oración puede pasar al final después de ", { term: "it" }, ": extraposición."], pt: ["Um sujeito longo em forma de oração pode ir para o fim depois de ", { term: "it" }, ": extraposição."], fr: ["Un sujet long qui est une proposition peut passer à la fin après ", { term: "it" }, " : extraposition."], de: ["Ein langes Satzsubjekt kann nach ", { term: "it" }, " ans Ende rücken: Extraposition."], it: ["Un soggetto lungo che è una proposizione può spostarsi alla fine dopo ", { term: "it" }, ": estraposizione."], pl: ["Długi podmiot będący zdaniem może przejść na koniec po ", { term: "it" }, ": ekstrapozycja."], tr: ["Cümle olan uzun bir özne, ", { term: "it" }, " sözcüğünden sonra sona geçebilir: sona kaydırma."], id: ["Subjek berupa klausa yang panjang dapat pindah ke akhir setelah ", { term: "it" }, ": ekstraposisi."], vi: ["Mệnh đề làm chủ ngữ dài có thể chuyển xuống cuối câu sau ", { term: "it" }, ": đảo chủ ngữ ra sau."] }, ex: { equivalence: ["That he left surprised me.", [{ target: It }, " surprised me ", { target: that he left }, "."]] }, tr: { uk: { equivalence: ["Те, що він пішов, мене здивувало.", "Мене здивувало, що він пішов."] }, es: { equivalence: ["Que se fuera me sorprendió.", "Me sorprendió que se fuera."] }, pt: { equivalence: ["Que ele tenha ido embora me surpreendeu.", "Me surpreendeu que ele tenha ido embora."] }, fr: { equivalence: ["Qu’il soit parti m’a surpris.", "Il m’a surpris qu’il soit parti."] }, de: { equivalence: ["Dass er gegangen ist, hat mich überrascht.", "Es hat mich überrascht, dass er gegangen ist."] }, it: { equivalence: ["Che se ne sia andato mi ha sorpreso.", "Mi ha sorpreso che se ne sia andato."] }, pl: { equivalence: ["To, że wyszedł, mnie zaskoczyło.", "Zaskoczyło mnie, że wyszedł."] }, tr: { equivalence: ["Onun gitmesi beni şaşırttı.", "Beni şaşırtan şey onun gitmesiydi."] }, id: { equivalence: ["Bahwa dia pergi mengejutkan saya.", "Mengejutkan saya bahwa dia pergi."] }, vi: { equivalence: ["Việc anh ấy rời đi làm tôi ngạc nhiên.", "Tôi ngạc nhiên vì anh ấy đã rời đi."] } } }
          - { level: C1, rule: { en: "In speech, a noun can come first and a pronoun repeat it.", uk: "У мовленні іменник може стояти першим, а займенник його повторює.", es: "En el habla, un sustantivo puede ir primero y un pronombre lo repite.", pt: "Na fala, um substantivo pode vir primeiro e um pronome o repete.", fr: "À l’oral, un nom peut venir en premier et un pronom le reprend.", de: "In der gesprochenen Sprache kann ein Nomen zuerst stehen, und ein Pronomen wiederholt es.", it: "Nel parlato, un sostantivo può venire per primo e un pronome lo riprende.", pl: "W mowie rzeczownik może stać na początku, a zaimek go powtarza.", tr: "Konuşmada bir isim başa gelebilir ve bir zamir onu yineler.", id: "Dalam percakapan, kata benda dapat berada di depan dan kata ganti mengulanginya.", vi: "Trong lời nói, danh từ có thể đứng đầu và đại từ nhắc lại nó." }, ex: [{ target: My brother }, ", ", { target: he }, " lives in Leeds."], tr: { uk: "Мій брат, він живе в Лідсі.", es: "Mi hermano, él vive en Leeds.", pt: "Meu irmão, ele mora em Leeds.", fr: "Mon frère, il habite à Leeds.", de: "Mein Bruder, der wohnt in Leeds.", it: "Mio fratello, lui vive a Leeds.", pl: "Mój brat, on mieszka w Leeds.", tr: "Kardeşim, o Leeds’te yaşıyor.", id: "Saudara laki-laki saya, dia tinggal di Leeds.", vi: "Anh trai tôi, anh ấy sống ở Leeds." } }
          - { level: C1, rule: { en: "In speech, a pronoun can come first and a noun clarify it afterwards.", uk: "У мовленні займенник може стояти першим, а іменник пояснює його згодом.", es: "En el habla, un pronombre puede ir primero y un sustantivo lo aclara después.", pt: "Na fala, um pronome pode vir primeiro e um substantivo o esclarece depois.", fr: "À l’oral, un pronom peut venir en premier et un nom le précise ensuite.", de: "In der gesprochenen Sprache kann ein Pronomen zuerst stehen, und ein Nomen erklärt es danach.", it: "Nel parlato, un pronome può venire per primo e un sostantivo lo chiarisce dopo.", pl: "W mowie zaimek może stać na początku, a rzeczownik wyjaśnia go potem.", tr: "Konuşmada bir zamir başa gelebilir ve bir isim onu sonradan açıklar.", id: "Dalam percakapan, kata ganti dapat berada di depan dan kata benda menjelaskannya kemudian.", vi: "Trong lời nói, đại từ có thể đứng đầu và danh từ làm rõ nó sau đó." }, ex: [{ target: She }, "'s nice, ", { target: your sister }, "."], tr: { uk: "Вона мила, твоя сестра.", es: "Es simpática, tu hermana.", pt: "Ela é legal, sua irmã.", fr: "Elle est gentille, ta sœur.", de: "Die ist nett, deine Schwester.", it: "È simpatica, tua sorella.", pl: "Jest miła, twoja siostra.", tr: "O çok iyi biri, kız kardeşin.", id: "Dia baik, adik perempuanmu.", vi: "Cô ấy dễ mến lắm, em gái bạn." } }
      - type: list
        items:
          - type: note
            level: C1
            text: { en: ["The passive and cleft sentences reorder a sentence too. See ", { link: Passive voice, to: en.sentence-building.passive-voice }, " and ", { link: Emphasis and cleft sentences, to: en.sentence-building.cleft-sentences }, "."], uk: ["Пасив і виділювальні конструкції теж змінюють порядок слів. Див. ", { link: "Пасивний стан", to: "en.sentence-building.passive-voice" }, " і ", { link: "Виділення та виділювальні конструкції", to: "en.sentence-building.cleft-sentences" }, "."], es: ["La voz pasiva y las oraciones hendidas también reordenan la oración. Ver ", { link: "La voz pasiva", to: "en.sentence-building.passive-voice" }, " y ", { link: "Énfasis y oraciones hendidas", to: "en.sentence-building.cleft-sentences" }, "."], pt: ["A voz passiva e as frases clivadas também reordenam a frase. Ver ", { link: "A voz passiva", to: "en.sentence-building.passive-voice" }, " e ", { link: "Ênfase e frases clivadas", to: "en.sentence-building.cleft-sentences" }, "."], fr: ["La voix passive et les phrases clivées réorganisent aussi la phrase. Voir ", { link: "Voix passive", to: "en.sentence-building.passive-voice" }, " et ", { link: "Mise en relief et phrases clivées", to: "en.sentence-building.cleft-sentences" }, "."], de: ["Auch das Passiv und Spaltsätze ordnen den Satz um. Siehe ", { link: "Das Passiv", to: "en.sentence-building.passive-voice" }, " und ", { link: "Hervorhebung und Spaltsätze", to: "en.sentence-building.cleft-sentences" }, "."], it: ["Anche la forma passiva e le frasi scisse riordinano la frase. Vedi ", { link: "Forma passiva", to: "en.sentence-building.passive-voice" }, " e ", { link: "Enfasi e frasi scisse", to: "en.sentence-building.cleft-sentences" }, "."], pl: ["Strona bierna i zdania rozszczepione też zmieniają szyk zdania. Zob. ", { link: "Strona bierna", to: "en.sentence-building.passive-voice" }, " i ", { link: "Uwypuklanie i zdania rozszczepione", to: "en.sentence-building.cleft-sentences" }, "."], tr: ["Edilgen çatı ve yarık cümleler de cümlenin sırasını değiştirir. Bkz. ", { link: "Edilgen çatı", to: "en.sentence-building.passive-voice" }, " ve ", { link: "Vurgu ve yarık cümleler", to: "en.sentence-building.cleft-sentences" }, "."], id: ["Kalimat pasif dan kalimat belah juga mengubah urutan kalimat. Lihat ", { link: "Kalimat pasif", to: "en.sentence-building.passive-voice" }, " dan ", { link: "Penekanan dan kalimat belah", to: "en.sentence-building.cleft-sentences" }, "."], vi: ["Câu bị động và câu chẻ cũng sắp xếp lại câu. Xem ", { link: "Câu bị động", to: "en.sentence-building.passive-voice" }, " và ", { link: "Nhấn mạnh và câu chẻ", to: "en.sentence-building.cleft-sentences" }, "."] }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: I went yesterday to London., right: ["I went ", { target: to London yesterday }, "."], rule: { en: place before time, uk: "місце перед часом", es: "el lugar antes del tiempo", pt: "lugar antes de tempo", fr: "le lieu avant le moment", de: "der Ort vor der Zeit", it: "il luogo prima del tempo", pl: "miejsce przed czasem", tr: "yer zamandan önce", id: "tempat sebelum waktu", vi: "nơi chốn trước thời gian" } }
          - { level: A1, wrong: I eat always breakfast., right: ["I ", { target: always eat }, " breakfast."], rule: { en: frequency adverbs go before the main verb, uk: "прислівники частотності стоять перед основним дієсловом", es: "los adverbios de frecuencia van antes del verbo principal", pt: "os advérbios de frequência vão antes do verbo principal", fr: "les adverbes de fréquence se placent avant le verbe principal", de: "Häufigkeitsadverbien stehen vor dem Hauptverb", it: "gli avverbi di frequenza vanno prima del verbo principale", pl: "przysłówki częstotliwości stoją przed czasownikiem głównym", tr: "sıklık zarfları ana fiilden önce gelir", id: "kata keterangan frekuensi diletakkan sebelum kata kerja utama", vi: "trạng từ chỉ tần suất đứng trước động từ chính" } }
          - { level: A1, wrong: She always is late., right: ["She ", { target: is always }, " late."], rule: { en: ["frequency adverbs go after ", { term: be }], uk: ["прислівники частотності стоять після ", { term: be }], es: ["los adverbios de frecuencia van después de ", { term: be }], pt: ["os advérbios de frequência vão depois de ", { term: "be" }], fr: ["les adverbes de fréquence se placent après ", { term: "be" }], de: ["Häufigkeitsadverbien stehen nach ", { term: "be" }], it: ["gli avverbi di frequenza vanno dopo ", { term: "be" }], pl: ["przysłówki częstotliwości stoją po ", { term: "be" }], tr: ["sıklık zarfları ", { term: "be" }, " fiilinden sonra gelir"], id: ["kata keterangan frekuensi diletakkan setelah ", { term: "be" }], vi: ["trạng từ chỉ tần suất đứng sau ", { term: "be" }] } }
          - { level: B2, wrong: She speaks fluently English., right: ["She speaks English ", { target: fluently }, "."], rule: { en: "the object follows the verb directly; the adverbial follows the object", uk: "додаток стоїть одразу після дієслова; обставина — після додатка", es: "el objeto va justo después del verbo; el complemento circunstancial va después del objeto", pt: "o objeto vem logo depois do verbo; o adjunto adverbial vem depois do objeto", fr: "le complément suit directement le verbe ; le complément circonstanciel vient après lui", de: "das Objekt steht direkt nach dem Verb; die Adverbiale steht nach dem Objekt", it: "il complemento oggetto segue direttamente il verbo; il complemento circostanziale segue il complemento oggetto", pl: "dopełnienie stoi tuż po czasowniku; okolicznik stoi po dopełnieniu", tr: "nesne doğrudan fiilin arkasından gelir; zarf tümleci nesneden sonra gelir", id: "objek berada tepat setelah kata kerja; keterangan berada setelah objek", vi: "tân ngữ đứng ngay sau động từ; trạng ngữ đứng sau tân ngữ" } }
          - { level: B2, wrong: She sang at the party last night beautifully., right: ["She sang ", { target: beautifully at the party last night }, "."], rule: { en: "manner comes before place and time", uk: "спосіб дії стоїть перед місцем і часом", es: "el modo va antes del lugar y del tiempo", pt: "o modo vem antes do lugar e do tempo", fr: "la manière vient avant le lieu et le moment", de: "die Art und Weise steht vor Ort und Zeit", it: "il modo viene prima del luogo e del tempo", pl: "sposób stoi przed miejscem i czasem", tr: "durum, yer ve zamandan önce gelir", id: "cara berada sebelum tempat dan waktu", vi: "cách thức đứng trước nơi chốn và thời gian" } }
          - { level: C1, wrong: That he left it surprised me., right: { alternatives: [[{ target: It }, " surprised me that he left."], [{ target: That he left }, " surprised me."]] }, rule: { en: "a clause subject takes no extra it", uk: "підмет-підрядне речення не потребує додаткового it", es: "un sujeto que es una oración no lleva un it adicional", pt: "um sujeito em forma de oração não leva um it a mais", fr: "un sujet qui est une proposition ne prend pas de it en plus", de: "ein Satzsubjekt bekommt kein zusätzliches it", it: "un soggetto che è una proposizione non prende un it in più", pl: "podmiot będący zdaniem nie dostaje dodatkowego it", tr: "cümle olan özneye fazladan it eklenmez", id: "subjek berupa klausa tidak diberi it tambahan", vi: "mệnh đề làm chủ ngữ không cần thêm it" } }
          - { level: A1, speakers: [uk], wrong: I like very much football., right: ["I like football ", { target: very much }, "."], rule: { uk: [{ term: very much }, " стоїть у кінці, після додатка; українською «дуже люблю футбол»"] } }
          - { level: A0, speakers: [es], wrong: I have a car red., right: ["I have a ", { target: red car }, "."], rule: { es: ["el adjetivo va antes del sustantivo: ", { term: a red car }, "; en español «un coche rojo»"] } }
          - { level: A1, speakers: [es], wrong: Always I get up early., right: ["I ", { target: always }, " get up early."], rule: { es: [{ term: always }, " va antes del verbo principal, no al principio de la oración"] } }
          - { level: A1, speakers: [es], wrong: I like very much football., right: ["I like football ", { target: very much }, "."], rule: { es: [{ term: very much }, " va al final, después del objeto; en español «me gusta mucho el fútbol»"] } }
