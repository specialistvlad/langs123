        rows:
          - { level: A1, adverb: always, position: { en: ["before the main verb, after ", { term: be }], uk: ["перед основним дієсловом, після ", { term: be }], es: ["antes del verbo principal, después de ", { term: be }], pt: ["antes do verbo principal, depois de ", { term: "be" }], fr: ["avant le verbe principal, après ", { term: "be" }], de: ["vor dem Hauptverb, nach ", { term: "be" }], it: ["prima del verbo principale, dopo ", { term: "be" }], pl: ["przed czasownikiem głównym, po ", { term: "be" }], tr: ["ana fiilden önce, ", { term: "be" }, " fiilinden sonra"], id: ["sebelum kata kerja utama, setelah ", { term: "be" }], vi: ["trước động từ chính, sau ", { term: "be" }] }, ex: { examples: [["I ", { target: always }, " eat breakfast."], ["She is ", { target: always }, " late."]] }, tr: { uk: { examples: ["Я завжди снідаю.", "Вона завжди запізнюється."] }, es: { examples: ["Siempre desayuno.", "Siempre llega tarde."] }, pt: { examples: ["Eu sempre tomo café da manhã.", "Ela está sempre atrasada."] }, fr: { examples: ["Je prends toujours le petit-déjeuner.", "Elle est toujours en retard."] }, de: { examples: ["Ich frühstücke immer.", "Sie kommt immer zu spät."] }, it: { examples: ["Faccio sempre colazione.", "È sempre in ritardo."] }, pl: { examples: ["Zawsze jem śniadanie.", "Ona zawsze się spóźnia."] }, tr: { examples: ["Her zaman kahvaltı yaparım.", "O her zaman geç kalır."] }, id: { examples: ["Saya selalu sarapan.", "Dia selalu terlambat."] }, vi: { examples: ["Tôi luôn ăn sáng.", "Cô ấy luôn đến muộn."] } } }
          - { level: A1, adverb: really, position: { en: before the main verb, uk: "перед основним дієсловом", es: "antes del verbo principal", pt: "antes do verbo principal", fr: "avant le verbe principal", de: "vor dem Hauptverb", it: "prima del verbo principale", pl: "przed czasownikiem głównym", tr: "ana fiilden önce", id: "sebelum kata kerja utama", vi: "trước động từ chính" }, ex: ["I ", { target: really }, " like jazz."], tr: { uk: "Мені справді подобається джаз.", es: "De verdad me gusta el jazz.", pt: "Eu realmente gosto de jazz.", fr: "J’aime vraiment le jazz.", de: "Ich mag Jazz wirklich.", it: "Il jazz mi piace davvero.", pl: "Naprawdę lubię jazz.", tr: "Caz müziğini gerçekten severim.", id: "Saya sungguh menyukai musik jazz.", vi: "Tôi thật sự thích nhạc jazz." } }
          - { level: A1, adverb: { alternatives: [very much, a lot] }, position: { en: "at the end, after the object", uk: "в кінці, після додатка", es: "al final, después del objeto", pt: "no fim, depois do objeto", fr: "à la fin, après le complément", de: "am Ende, nach dem Objekt", it: "alla fine, dopo il complemento oggetto", pl: "na końcu, po dopełnieniu", tr: "sonda, nesneden sonra", id: "di akhir, setelah objek", vi: "ở cuối câu, sau tân ngữ" }, ex: ["I like coffee ", { target: very much }, "."], tr: { uk: "Я дуже люблю каву.", es: "Me gusta mucho el café.", pt: "Eu gosto muito de café.", fr: "J’aime beaucoup le café.", de: "Ich mag Kaffee sehr.", it: "Mi piace molto il caffè.", pl: "Bardzo lubię kawę.", tr: "Kahveyi çok severim.", id: "Saya sangat suka kopi.", vi: "Tôi rất thích cà phê." } }
