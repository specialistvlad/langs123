        rows:
          - { level: B2, form: { en: "A noun", uk: "Іменник", es: "Un sustantivo", pt: "Um substantivo", fr: "Un nom", de: "Ein Nomen", it: "Un sostantivo", pl: "Rzeczownik", tr: "Bir isim", id: "Kata benda", vi: "Một danh từ" }, pattern: { pattern: [What, { slot: clause }, be, { slot: noun }] }, ex: [{ target: "What I need is" }, " a holiday."], tr: { uk: "Що мені справді потрібно — це відпустка.", es: "Lo que necesito son vacaciones.", pt: "O que eu preciso é de férias.", fr: "Ce dont j’ai besoin, c’est de vacances.", de: "Was ich brauche, ist Urlaub.", it: "Quello di cui ho bisogno è una vacanza.", pl: "To, czego potrzebuję, to urlop.", tr: "İhtiyacım olan şey bir tatil.", id: "Yang saya butuhkan adalah liburan.", vi: "Điều tôi cần là một kỳ nghỉ." } }
          - { level: B2, form: { en: "An action", uk: "Дія", es: "Una acción", pt: "Uma ação", fr: "Une action", de: "Eine Handlung", it: "Un'azione", pl: "Czynność", tr: "Bir eylem", id: "Suatu tindakan", vi: "Một hành động" }, pattern: { pattern: [What, { slot: subject }, { alternatives: [do, does, did] }, be, { slot: infinitive }] }, ex: [{ target: "What he did was" }, " ", { optional: to }, " leave early."], tr: { uk: "Він зробив ось що: пішов раніше.", es: "Lo que hizo fue irse temprano.", pt: "O que ele fez foi sair cedo.", fr: "Ce qu’il a fait, c’est partir tôt.", de: "Was er getan hat, war, früher zu gehen.", it: "Quello che ha fatto è stato andarsene presto.", pl: "Zrobił tak, że wyszedł wcześniej.", tr: "Yaptığı şey erken ayrılmaktı.", id: "Yang dia lakukan adalah pergi lebih awal.", vi: "Việc anh ấy làm là đi sớm." } }
          - { level: B2, form: { en: "A that-clause", uk: "Підрядне речення з that", es: "Una oración con that", pt: "Uma oração com that", fr: "Une proposition en that", de: "Ein that-Satz", it: "Una proposizione con that", pl: "Zdanie z that", tr: "that ile kurulan yan cümle", id: "Klausa that", vi: "Mệnh đề that" }, pattern: { pattern: [What, { slot: verb }, be, that, { slot: clause }] }, ex: [{ target: "What happened was that" }, " the bus broke down."], tr: { uk: "Сталося так, що автобус зламався.", es: "Lo que pasó fue que el autobús se descompuso.", pt: "O que aconteceu foi que o ônibus quebrou.", fr: "Ce qui s’est passé, c’est que le bus est tombé en panne.", de: "Was passiert ist, war, dass der Bus eine Panne hatte.", it: "Quello che è successo è che l'autobus si è guastato.", pl: "Stało się tak, że autobus się zepsuł.", tr: "Olan şey şuydu: otobüs bozuldu.", id: "Yang terjadi adalah busnya mogok.", vi: "Chuyện xảy ra là xe buýt bị hỏng." } }
          - { level: B2, form: { en: "Reversed order", uk: "Зворотний порядок", es: "Orden invertido", pt: "Ordem invertida", fr: "Ordre inversé", de: "Umgekehrte Reihenfolge", it: "Ordine invertito", pl: "Odwrócona kolejność", tr: "Ters sıra", id: "Urutan terbalik", vi: "Thứ tự đảo" }, pattern: { pattern: [{ slot: noun }, be, what, { slot: clause }] }, ex: [{ target: "A holiday is what" }, " I need."], tr: { uk: "Відпустка — ось що мені потрібно.", es: "Vacaciones es lo que necesito.", pt: "Férias é o que eu preciso.", fr: "Des vacances, voilà ce qu’il me faut.", de: "Urlaub ist das, was ich brauche.", it: "Una vacanza è quello di cui ho bisogno.", pl: "Urlop to to, czego potrzebuję.", tr: "Bir tatil, işte ihtiyacım olan şey.", id: "Liburan adalah yang saya butuhkan.", vi: "Một kỳ nghỉ là điều tôi cần." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The wh-clause is the subject, so be is usually singular, even before a plural focus.", uk: "Wh-речення — підмет, тому be зазвичай стоїть в однині, навіть перед фокусом у множині.", es: "La oración con wh- es el sujeto, así que be suele ir en singular, incluso ante un foco plural.", pt: "A oração com wh- é o sujeito, então be costuma ficar no singular, mesmo antes de um foco plural.", fr: "La proposition en wh- est le sujet, donc be reste en général au singulier, même devant un focus pluriel.", de: "Der wh-Satz ist das Subjekt, deshalb steht be meist im Singular, auch vor einem Fokus im Plural.", it: "La proposizione con wh- è il soggetto, quindi be sta di solito al singolare, anche davanti a un focus plurale.", pl: "Zdanie z wh- jest podmiotem, więc be zwykle stoi w liczbie pojedynczej, także przed fokusem w liczbie mnogiej.", tr: "wh- yan cümlesi öznedir; bu yüzden be, çoğul bir odaktan önce bile genellikle tekil kalır.", id: "Klausa wh- adalah subjek, jadi be biasanya tunggal, bahkan di depan fokus jamak.", vi: "Mệnh đề wh- là chủ ngữ, nên be thường ở số ít, kể cả trước một trọng tâm số nhiều." }
            ex: ["What I need ", { target: is }, " two weeks off."]
            tr: { uk: "Що мені потрібно — це два тижні відпустки.", es: "Lo que necesito son dos semanas libres.", pt: "O que eu preciso é de duas semanas de folga.", fr: "Ce dont j’ai besoin, c’est de deux semaines de congé.", de: "Was ich brauche, sind zwei Wochen Urlaub.", it: "Quello di cui ho bisogno sono due settimane di ferie.", pl: "To, czego potrzebuję, to dwa tygodnie wolnego.", tr: "İhtiyacım olan şey iki hafta izin.", id: "Yang saya butuhkan adalah cuti dua minggu.", vi: "Điều tôi cần là hai tuần nghỉ." }
          - type: rule
            level: B2
            text: { en: ["Without ", { term: do }, " in the clause, the infinitive keeps ", { term: to }, "."], uk: ["Якщо в підрядному реченні немає ", { term: "do" }, ", інфінітив зберігає ", { term: "to" }, "."], es: ["Sin ", { term: "do" }, " en la oración, el infinitivo conserva ", { term: "to" }, "."], pt: ["Sem ", { term: "do" }, " na oração, o infinitivo mantém ", { term: "to" }, "."], fr: ["Sans ", { term: "do" }, " dans la proposition, l’infinitif garde ", { term: "to" }, "."], de: ["Steht im Nebensatz kein ", { term: "do" }, ", behält der Infinitiv ", { term: "to" }, "."], it: ["Senza ", { term: "do" }, " nella proposizione, l'infinito mantiene ", { term: "to" }, "."], pl: ["Bez ", { term: "do" }, " w zdaniu bezokolicznik zachowuje ", { term: "to" }, "."], tr: ["Yan cümlede ", { term: "do" }, " yoksa mastar ", { term: "to" }, " sözcüğünü korur."], id: ["Tanpa ", { term: "do" }, " dalam klausa, infinitif tetap memakai ", { term: "to" }, "."], vi: ["Nếu trong mệnh đề không có ", { term: "do" }, ", động từ nguyên mẫu giữ ", { term: "to" }, "."] }
            ex: [{ target: "What I want is to" }, " sleep."]
            tr: { uk: "Що я хочу — це поспати.", es: "Lo que quiero es dormir.", pt: "O que eu quero é dormir.", fr: "Ce que je veux, c’est dormir.", de: "Was ich will, ist schlafen.", it: "Quello che voglio è dormire.", pl: "To, czego chcę, to spać.", tr: "İstediğim şey uyumak.", id: "Yang saya inginkan adalah tidur.", vi: "Điều tôi muốn là được ngủ." }

  - title: { en: "Frames: all, the thing, the reason", uk: "Формули: all, the thing, the reason", es: "Fórmulas: all, the thing, the reason", pt: "Fórmulas: all, the thing, the reason", fr: "Formules : all, the thing, the reason", de: "Formeln: all, the thing, the reason", it: "Formule: all, the thing, the reason", pl: "Formuły: all, the thing, the reason", tr: "Söz kalıpları: all, the thing, the reason", id: "Ungkapan: all, the thing, the reason", vi: "Khung câu: all, the thing, the reason" }
    role: own
    content:
      - type: usage
        columns:
          - { key: frame, label: { en: Frame, uk: "Формула", es: "Fórmula", pt: "Fórmula", fr: "Formule", de: "Formel", it: "Formula", pl: "Formuła", tr: "Söz kalıbı", id: "Ungkapan", vi: "Khung câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, frame: { pattern: [All, { slot: clause }, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }] }, ex: [{ target: "All I want is" }, " peace and quiet."], tr: { uk: "Усе, чого я хочу, — це спокій і тиша.", es: "Todo lo que quiero es paz y tranquilidad.", pt: "Tudo o que eu quero é paz e sossego.", fr: "Tout ce que je veux, c’est la paix et la tranquillité.", de: "Alles, was ich will, ist Ruhe und Frieden.", it: "Tutto ciò che voglio è pace e tranquillità.", pl: "Wszystko, czego chcę, to spokój i cisza.", tr: "Tek istediğim huzur ve sessizlik.", id: "Yang saya inginkan hanyalah ketenangan dan kedamaian.", vi: "Tất cả những gì tôi muốn là sự yên tĩnh." } }
          - { level: B2, frame: { pattern: [The thing, { optional: that }, { slot: clause }, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }] }, ex: [{ target: "The thing that annoys me is" }, " the noise."], tr: { uk: "Те, що мене дратує, — це шум.", es: "Lo que me molesta es el ruido.", pt: "O que me incomoda é o barulho.", fr: "Ce qui m’agace, c’est le bruit.", de: "Was mich stört, ist der Lärm.", it: "Quello che mi dà fastidio è il rumore.", pl: "To, co mnie irytuje, to hałas.", tr: "Beni rahatsız eden şey gürültü.", id: "Yang membuat saya kesal adalah kebisingannya.", vi: "Điều làm tôi khó chịu là tiếng ồn." } }
          - { level: B2, frame: { pattern: [The reason, { optional: why }, { slot: clause }, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }] }, ex: [{ target: "The reason I left was" }, " that the pay was low."], tr: { uk: "Причина, з якої я пішов, була в тому, що платня була низькою.", es: "La razón por la que me fui fue que el sueldo era bajo.", pt: "O motivo de eu ter saído foi que o salário era baixo.", fr: "La raison pour laquelle je suis parti, c’est que la paie était basse.", de: "Der Grund, warum ich gegangen bin, war, dass die Bezahlung niedrig war.", it: "Il motivo per cui me ne sono andato è che la paga era bassa.", pl: "Powód, dla którego odszedłem, był taki, że płaca była niska.", tr: "Ayrılma nedenim maaşın düşük olmasıydı.", id: "Alasan saya pergi adalah karena gajinya rendah.", vi: "Lý do tôi nghỉ việc là lương thấp." } }
          - { level: B2, frame: { pattern: [The place, { optional: where }, { slot: clause }, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }] }, ex: [{ target: "The place where we met was" }, " a small café."], tr: { uk: "Місце, де ми зустрілися, було невеликим кафе.", es: "El lugar donde nos conocimos fue un café pequeño.", pt: "O lugar onde nos conhecemos foi um café pequeno.", fr: "L’endroit où nous nous sommes rencontrés était un petit café.", de: "Der Ort, an dem wir uns getroffen haben, war ein kleines Café.", it: "Il posto in cui ci siamo conosciuti era un piccolo bar.", pl: "Miejscem, w którym się poznaliśmy, była mała kawiarnia.", tr: "Tanıştığımız yer küçük bir kafeydi.", id: "Tempat kami bertemu adalah sebuah kafe kecil.", vi: "Nơi chúng tôi gặp nhau là một quán cà phê nhỏ." } }
          - { level: B2, frame: { pattern: [The first thing, { slot: clause }, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }] }, ex: [{ target: "The first thing I do is" }, " make coffee."], tr: { uk: "Перше, що я роблю, — варю каву.", es: "Lo primero que hago es preparar café.", pt: "A primeira coisa que eu faço é preparar café.", fr: "La première chose que je fais, c’est préparer du café.", de: "Das Erste, was ich tue, ist Kaffee zu kochen.", it: "La prima cosa che faccio è preparare il caffè.", pl: "Pierwsze, co robię, to parzę kawę.", tr: "Yaptığım ilk şey kahve yapmaktır.", id: "Hal pertama yang saya lakukan adalah membuat kopi.", vi: "Việc đầu tiên tôi làm là pha cà phê." } }

  - title: { en: "Use: focus, correction and summing up", uk: "Вживання: фокус, виправлення й підсумок", es: "Uso: foco, corrección y resumen", pt: "Uso: foco, correção e resumo", fr: "Emploi : focus, correction et résumé", de: "Gebrauch: Fokus, Korrektur und Zusammenfassung", it: "Uso: focus, correzione e riepilogo", pl: "Użycie: fokus, poprawianie i podsumowanie", tr: "Kullanım: odak, düzeltme ve özetleme", id: "Penggunaan: fokus, koreksi, dan ringkasan", vi: "Cách dùng: trọng tâm, sửa lại và tóm tắt" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { en: "It-cleft: names the person or thing responsible", uk: "it-конструкція: називає особу або предмет, відповідальні за дію", es: "Hendida con it: nombra a la persona o cosa responsable", pt: "Clivada com it: nomeia a pessoa ou a coisa responsável", fr: "Clivée en it : nomme la personne ou la chose responsable", de: "it-Spaltsatz: nennt die verantwortliche Person oder Sache", it: "Scissa con it: nomina la persona o la cosa responsabile", pl: "Zdanie rozszczepione z it: wskazuje osobę lub rzecz odpowiedzialną", tr: "it ile yarık cümle: sorumlu kişiyi ya da şeyi adlandırır", id: "Kalimat belah dengan it: menyebut orang atau benda yang bertanggung jawab", vi: "Câu chẻ với it: nêu tên người hoặc vật chịu trách nhiệm" }, ex: [{ target: "It was the neighbours who" }, " complained."], tr: { uk: "Поскаржилися саме сусіди.", es: "Fueron los vecinos quienes se quejaron.", pt: "Foram os vizinhos que reclamaram.", fr: "Ce sont les voisins qui se sont plaints.", de: "Es waren die Nachbarn, die sich beschwert haben.", it: "Sono stati i vicini a lamentarsi.", pl: "To sąsiedzi się poskarżyli.", tr: "Şikâyet eden komşulardı.", id: "Para tetanggalah yang mengeluh.", vi: "Chính hàng xóm đã phàn nàn." } }
          - { level: B2, use: { en: "It-cleft: corrects a detail, often with a negative first", uk: "it-конструкція: виправляє деталь, часто спершу із запереченням", es: "Hendida con it: corrige un detalle, a menudo con una negación primero", pt: "Clivada com it: corrige um detalhe, muitas vezes começando com uma negação", fr: "Clivée en it : corrige un détail, souvent d’abord par une négation", de: "it-Spaltsatz: korrigiert ein Detail, oft zuerst mit einer Verneinung", it: "Scissa con it: corregge un dettaglio, spesso prima con una negazione", pl: "Zdanie rozszczepione z it: poprawia szczegół, często najpierw przeczeniem", tr: "it ile yarık cümle: bir ayrıntıyı düzeltir, çoğu zaman önce olumsuzla", id: "Kalimat belah dengan it: mengoreksi suatu detail, sering diawali bentuk negatif", vi: "Câu chẻ với it: sửa một chi tiết, thường bắt đầu bằng câu phủ định" }, ex: [{ target: "It wasn't the red one" }, " I wanted; ", { target: "it was the blue one" }, "."], tr: { uk: "Я хотів не червоний, а саме синій.", es: "No era el rojo el que quería; era el azul.", pt: "Não foi o vermelho que eu quis; foi o azul.", fr: "Ce n’est pas le rouge que je voulais ; c’est le bleu.", de: "Es war nicht der rote, den ich wollte; es war der blaue.", it: "Non era quello rosso che volevo; era quello blu.", pl: "Nie czerwony chciałem, tylko niebieski.", tr: "İstediğim kırmızı olan değildi; mavi olandı.", id: "Bukan yang merah yang saya inginkan; melainkan yang biru.", vi: "Không phải cái màu đỏ tôi muốn, mà là cái màu xanh." } }
          - { level: B2, use: { en: "Wh-cleft: says what you need, want or like, then names it", uk: "wh-конструкція: спершу каже, що потрібно, чого хочеться чи що подобається, а тоді називає це", es: "Seudohendida con wh-: dice qué necesitas, quieres o te gusta y luego lo nombra", pt: "Pseudoclivada com wh-: diz o que você precisa, quer ou gosta e depois nomeia isso", fr: "Pseudo-clivée en wh- : dit ce dont on a besoin, ce qu’on veut ou aime, puis le nomme", de: "wh-Spaltsatz: sagt, was man braucht, will oder mag, und nennt es dann", it: "Pseudoscissa con wh-: dice che cosa serve, si vuole o piace, poi lo nomina", pl: "Zdanie pseudorozszczepione z wh-: mówi, czego potrzebujesz, chcesz lub co lubisz, i dopiero to nazywa", tr: "wh- ile yarık cümle: neye ihtiyacın olduğunu, neyi istediğini ya da sevdiğini söyler, sonra onu adlandırır", id: "Kalimat belah dengan wh-: menyebut apa yang dibutuhkan, diinginkan, atau disukai, lalu menamainya", vi: "Câu chẻ với wh-: nói điều bạn cần, muốn hoặc thích, rồi mới gọi tên nó" }, ex: [{ target: "What I like most is" }, " the quiet."], tr: { uk: "Що мені подобається найбільше — це тиша.", es: "Lo que más me gusta es la tranquilidad.", pt: "O que eu mais gosto é do sossego.", fr: "Ce que j’aime le plus, c’est le calme.", de: "Was ich am meisten mag, ist die Ruhe.", it: "Quello che mi piace di più è la tranquillità.", pl: "To, co lubię najbardziej, to cisza.", tr: "En çok sevdiğim şey sessizlik.", id: "Yang paling saya sukai adalah ketenangannya.", vi: "Điều tôi thích nhất là sự yên tĩnh." } }
          - { level: B2, use: { en: "Wh-cleft: builds up to the point of a story", uk: "wh-конструкція: підводить до головного моменту розповіді", es: "Seudohendida con wh-: prepara el punto central de un relato", pt: "Pseudoclivada com wh-: prepara o ponto principal de uma história", fr: "Pseudo-clivée en wh- : amène le point fort d’un récit", de: "wh-Spaltsatz: führt zum Höhepunkt einer Geschichte hin", it: "Pseudoscissa con wh-: porta al punto chiave di un racconto", pl: "Zdanie pseudorozszczepione z wh-: prowadzi do sedna opowieści", tr: "wh- ile yarık cümle: bir hikâyenin can alıcı noktasına hazırlar", id: "Kalimat belah dengan wh-: membangun menuju inti sebuah cerita", vi: "Câu chẻ với wh-: dẫn tới điểm chính của một câu chuyện" }, ex: [{ target: "What happened next was that" }, " the lights went out."], tr: { uk: "Далі сталося таке: погасло світло.", es: "Lo que pasó después fue que se apagaron las luces.", pt: "O que aconteceu em seguida foi que as luzes se apagaram.", fr: "Ce qui s’est passé ensuite, c’est que les lumières se sont éteintes.", de: "Was dann passierte, war, dass das Licht ausging.", it: "Quello che è successo dopo è che le luci si sono spente.", pl: "Potem stało się tak, że zgasło światło.", tr: "Sonra olan şey ışıkların sönmesi oldu.", id: "Yang terjadi berikutnya adalah lampu padam.", vi: "Điều xảy ra tiếp theo là đèn tắt." } }
          - { level: B2, use: { en: "Reversed wh-cleft: sums up or agrees", uk: "Зворотна wh-конструкція: підсумовує або погоджується", es: "Seudohendida invertida: resume o expresa acuerdo", pt: "Pseudoclivada invertida: resume ou concorda", fr: "Pseudo-clivée inversée : résume ou approuve", de: "Umgekehrter wh-Spaltsatz: fasst zusammen oder stimmt zu", it: "Pseudoscissa inversa: riassume o conferma", pl: "Odwrócone zdanie z wh-: podsumowuje lub zgadza się", tr: "Ters wh- yarık cümlesi: özetler ya da onaylar", id: "Kalimat belah wh- terbalik: merangkum atau menyetujui", vi: "Câu chẻ với wh- đảo: tóm tắt hoặc đồng ý" }, ex: ["Yes, ", { target: "that's what" }, " I mean."], tr: { uk: "Так, саме це я й маю на увазі.", es: "Sí, eso es lo que quiero decir.", pt: "Sim, é isso que eu quero dizer.", fr: "Oui, c’est ce que je veux dire.", de: "Ja, genau das meine ich.", it: "Sì, è proprio quello che intendo.", pl: "Tak, właśnie to mam na myśli.", tr: "Evet, demek istediğim tam olarak bu.", id: "Ya, itulah yang saya maksud.", vi: "Đúng, đó là điều tôi muốn nói." } }

