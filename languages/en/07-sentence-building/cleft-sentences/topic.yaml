ọc." } }
          - { level: C2, frame: { en: { term: ["What is striking is", { gap: true }] }, uk: { term: ["What is striking is", { gap: true }] }, es: { term: ["What is striking is", { gap: true }] }, pt: { term: ["What is striking is", { gap: true }] }, fr: { term: ["What is striking is", { gap: true }] }, de: { term: ["What is striking is", { gap: true }] }, it: { term: ["What is striking is", { gap: true }] }, pl: { term: ["What is striking is", { gap: true }] }, tr: { term: ["What is striking is", { gap: true }] }, id: { term: ["What is striking is", { gap: true }] }, vi: { term: ["What is striking is", { gap: true }] } }, use: { en: "draws the reader to a notable fact", uk: "звертає увагу читача на помітний факт", es: "dirige la atención del lector a un hecho notable", pt: "chama a atenção do leitor para um fato notável", fr: "attire l’attention du lecteur sur un fait notable", de: "lenkt den Leser auf eine bemerkenswerte Tatsache", it: "attira il lettore su un fatto notevole", pl: "zwraca uwagę czytelnika na godny uwagi fakt", tr: "okurun dikkatini dikkate değer bir olguya çeker", id: "mengarahkan pembaca pada fakta yang menonjol", vi: "hướng người đọc tới một sự việc đáng chú ý" }, ex: [{ target: "What is striking is" }, " how little has changed."], tr: { uk: "Вражає те, як мало змінилося.", es: "Lo que llama la atención es lo poco que ha cambiado.", pt: "O que chama a atenção é o quão pouco mudou.", fr: "Ce qui frappe, c’est le peu de choses qui ont changé.", de: "Auffällig ist, wie wenig sich verändert hat.", it: "Ciò che colpisce è quanto poco sia cambiato.", pl: "Uderzające jest to, jak niewiele się zmieniło.", tr: "Dikkat çekici olan şey, ne kadar az şeyin değiştiği.", id: "Yang mencolok adalah betapa sedikitnya yang berubah.", vi: "Điều đáng chú ý là có rất ít thứ thay đổi." } }
