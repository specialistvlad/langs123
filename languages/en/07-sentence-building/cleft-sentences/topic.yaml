          - { level: B2, row: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" }, it: { ex: [{ target: "It was the red scarf that" }, " I lost."], tr: { uk: "Я загубив саме червоний шарф.", es: "Fue la bufanda roja la que perdí.", pt: "Foi o cachecol vermelho que eu perdi.", fr: "C’est l’écharpe rouge que j’ai perdue.", de: "Es war der rote Schal, den ich verloren habe.", it: "È la sciarpa rossa che ho perso.", pl: "To czerwony szalik zgubiłem.", tr: "Kırmızı atkıydı kaybettiğim.", id: "Syal merah itulah yang saya hilangkan.", vi: "Chính chiếc khăn quàng đỏ là thứ tôi đã làm mất." } }, wh: { ex: [{ target: "What I lost was" }, " the red scarf."], tr: { uk: "Що я загубив — це червоний шарф.", es: "Lo que perdí fue la bufanda roja.", pt: "O que eu perdi foi o cachecol vermelho.", fr: "Ce que j’ai perdu, c’est l’écharpe rouge.", de: "Was ich verloren habe, war der rote Schal.", it: "Quello che ho perso è la sciarpa rossa.", pl: "To, co zgubiłem, to czerwony szalik.", tr: "Kaybettiğim şey kırmızı atkıydı.", id: "Yang saya hilangkan adalah syal merah.", vi: "Thứ tôi đã làm mất là chiếc khăn quàng đỏ." } } }
          - { level: B2, row: { en: "A person as focus", uk: "Особа як фокус", es: "Una persona como foco", pt: "Uma pessoa como foco", fr: "Une personne comme focus", de: "Eine Person als Fokus", it: "Una persona come focus", pl: "Osoba jako fokus", tr: "Odak olarak bir kişi", id: "Orang sebagai fokus", vi: "Một người làm trọng tâm" }, it: { ex: [{ target: "It was Tom who" }, " broke it."], tr: { uk: "Саме Том це зламав.", es: "Fue Tom quien lo rompió.", pt: "Foi o Tom que quebrou isso.", fr: "C’est Tom qui l’a cassé.", de: "Es war Tom, der es kaputt gemacht hat.", it: "È stato Tom a romperlo.", pl: "To Tom to zepsuł.", tr: "Onu kıran Tom’du.", id: "Tomlah yang merusaknya.", vi: "Chính Tom đã làm hỏng nó." } }, wh: { ex: [{ target: "The person who broke it was" }, " Tom."], tr: { uk: "Той, хто це зламав, — Том.", es: "La persona que lo rompió fue Tom.", pt: "A pessoa que quebrou isso foi o Tom.", fr: "La personne qui l’a cassé, c’est Tom.", de: "Die Person, die es kaputt gemacht hat, war Tom.", it: "La persona che l'ha rotto è stato Tom.", pl: "Osobą, która to zepsuła, był Tom.", tr: "Onu kıran kişi Tom’du.", id: "Orang yang merusaknya adalah Tom.", vi: "Người làm hỏng nó là Tom." } } }

