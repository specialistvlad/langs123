        rows:
          - { level: C2, frame: { pattern: [The fact is, { optional: that }, { slot: clause }] }, use: { en: "states a plain truth against a belief or a hope", uk: "називає просту правду всупереч переконанню чи надії", es: "enuncia una verdad simple frente a una creencia o una esperanza", pt: "enuncia uma verdade simples contra uma crença ou uma esperança", fr: "énonce une vérité simple face à une croyance ou à un espoir", de: "stellt eine schlichte Wahrheit gegen eine Annahme oder eine Hoffnung", it: "enuncia una verità semplice contro una convinzione o una speranza", pl: "podaje prostą prawdę wbrew przekonaniu lub nadziei", tr: "bir inanca ya da umuda karşı yalın bir gerçeği söyler", id: "menyatakan kenyataan apa adanya yang berlawanan dengan keyakinan atau harapan", vi: "nêu một sự thật đơn giản trái với niềm tin hay hy vọng" }, ex: [{ target: "The fact is that" }, " nobody came."], tr: { uk: "Факт у тому, що ніхто не прийшов.", es: "El hecho es que nadie vino.", pt: "O fato é que ninguém veio.", fr: "Le fait est que personne n’est venu.", de: "Tatsache ist, dass niemand gekommen ist.", it: "Il fatto è che non è venuto nessuno.", pl: "Faktem jest, że nikt nie przyszedł.", tr: "Gerçek şu ki kimse gelmedi.", id: "Faktanya, tidak ada yang datang.", vi: "Sự thật là không ai đến." } }
          - { level: C2, frame: { pattern: [The trouble is, { optional: that }, { slot: clause }] }, use: { en: "names the difficulty", uk: "називає труднощі", es: "nombra la dificultad", pt: "nomeia a dificuldade", fr: "nomme la difficulté", de: "nennt die Schwierigkeit", it: "nomina la difficoltà", pl: "wskazuje trudność", tr: "güçlüğü adlandırır", id: "menyebut kesulitannya", vi: "nêu khó khăn" }, ex: [{ target: "The trouble is that" }, " the shop closes at five."], tr: { uk: "Проблема в тому, що крамниця зачиняється о п’ятій.", es: "El problema es que la tienda cierra a las cinco.", pt: "O problema é que a loja fecha às cinco.", fr: "Le problème, c’est que le magasin ferme à cinq heures.", de: "Das Problem ist, dass das Geschäft um fünf schließt.", it: "Il problema è che il negozio chiude alle cinque.", pl: "Kłopot w tym, że sklep zamykają o piątej.", tr: "Sorun şu ki dükkân beşte kapanıyor.", id: "Masalahnya, toko itu tutup pukul lima.", vi: "Vấn đề là cửa hàng đóng cửa lúc năm giờ." } }
          - { level: C2, frame: { pattern: [The point is, { optional: that }, { slot: clause }] }, use: { en: "returns to what matters", uk: "повертає до головного", es: "vuelve a lo que importa", pt: "volta ao que importa", fr: "revient à l’essentiel", de: "kehrt zum Wesentlichen zurück", it: "torna a ciò che conta", pl: "wraca do tego, co ważne", tr: "önemli olana geri döner", id: "kembali ke hal yang penting", vi: "quay lại điều quan trọng" }, ex: [{ target: "The point is that" }, " we have no time."], tr: { uk: "Річ у тому, що в нас немає часу.", es: "Lo importante es que no tenemos tiempo.", pt: "O ponto é que não temos tempo.", fr: "Ce qui compte, c’est que nous n’avons pas le temps.", de: "Der Punkt ist, dass wir keine Zeit haben.", it: "Il punto è che non abbiamo tempo.", pl: "Chodzi o to, że nie mamy czasu.", tr: "Mesele şu ki zamanımız yok.", id: "Intinya, kita tidak punya waktu.", vi: "Vấn đề là chúng ta không có thời gian." } }
          - { level: C2, frame: { pattern: [The thing is, { optional: that }, { slot: clause }] }, use: { en: "opens an excuse or a doubt in speech", uk: "у мовленні відкриває виправдання або сумнів", es: "abre una excusa o una duda al hablar", pt: "abre uma desculpa ou uma dúvida na fala", fr: "ouvre une excuse ou un doute à l’oral", de: "leitet in der gesprochenen Sprache eine Entschuldigung oder einen Zweifel ein", it: "apre una scusa o un dubbio nel parlato", pl: "w mowie otwiera wymówkę lub wątpliwość", tr: "konuşmada bir mazereti ya da kuşkuyu başlatır", id: "membuka alasan atau keraguan dalam percakapan", vi: "mở đầu một lời bào chữa hoặc nghi ngờ khi nói" }, ex: [{ target: "The thing is" }, ", I have no money with me."], tr: { uk: "Розумієш, у мене з собою немає грошей.", es: "Lo que pasa es que no traigo dinero.", pt: "É que eu não estou com dinheiro.", fr: "C’est que je n’ai pas d’argent sur moi.", de: "Die Sache ist die: Ich habe kein Geld dabei.", it: "La questione è che non ho soldi con me.", pl: "Rzecz w tym, że nie mam przy sobie pieniędzy.", tr: "Şey, yanımda hiç param yok.", id: "Begini, saya tidak membawa uang.", vi: "Là vì tôi không mang theo tiền." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["In speech ", { term: that }, " drops out and a short pause follows the frame."], uk: ["У мовленні ", { term: "that" }, " випадає, а після формули йде коротка пауза."], es: ["Al hablar, ", { term: "that" }, " se omite y tras la fórmula hay una pausa breve."], pt: ["Na fala, ", { term: "that" }, " some e uma pausa curta segue a fórmula."], fr: ["À l’oral, ", { term: "that" }, " tombe et une courte pause suit la formule."], de: ["In der gesprochenen Sprache fällt ", { term: "that" }, " weg, und nach der Formel folgt eine kurze Pause."], it: ["Nel parlato ", { term: "that" }, " cade e dopo la formula c'è una breve pausa."], pl: ["W mowie ", { term: "that" }, " odpada, a po formule następuje krótka pauza."], tr: ["Konuşmada ", { term: "that" }, " düşer ve kalıptan sonra kısa bir duraklama gelir."], id: ["Dalam percakapan, ", { term: "that" }, " dihilangkan dan jeda singkat mengikuti ungkapan itu."], vi: ["Khi nói, ", { term: "that" }, " được bỏ đi và có một quãng nghỉ ngắn sau khung câu."] }
            ex: [{ target: "The thing is" }, ", I'm late."]
            tr: { uk: "Розумієш, я запізнююся.", es: "Lo que pasa es que voy tarde.", pt: "É que eu estou atrasado.", fr: "C’est que je suis en retard.", de: "Die Sache ist die: Ich bin spät dran.", it: "La questione è che sono in ritardo.", pl: "Rzecz w tym, że się spóźniam.", tr: "Şey, geç kaldım.", id: "Begini, saya terlambat.", vi: "Là vì tôi bị muộn." }

