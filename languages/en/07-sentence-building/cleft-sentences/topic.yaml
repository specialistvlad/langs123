          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, features: { polarity: pos, interrogativity: decl }, form: { en: Statement, uk: "Ствердження", es: "Afirmación", pt: "Afirmação", fr: "Affirmation", de: "Aussage", it: "Affermazione", pl: "Twierdzenie", tr: "Olumlu", id: "Positif", vi: "Khẳng định" }, pattern: { pattern: [It, be, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }, that, { slot: clause }] }, ex: { ex: [{ target: "It was Tom that" }, " broke it."], tr: { uk: "Саме Том це зламав.", es: "Fue Tom quien lo rompió.", pt: "Foi o Tom que quebrou isso.", fr: "C’est Tom qui l’a cassé.", de: "Es war Tom, der es kaputt gemacht hat.", it: "È stato Tom a romperlo.", pl: "To Tom to zepsuł.", tr: "Onu kıran Tom’du.", id: "Tomlah yang merusaknya.", vi: "Chính Tom đã làm hỏng nó." } } }
          - { level: B2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative, uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, pattern: { pattern: [It, { alternatives: ["isn't", "wasn't"] }, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }, that, { slot: clause }] }, ex: { ex: [{ target: "It wasn't me that" }, " broke it."], tr: { uk: "Це зламав не я.", es: "No fui yo quien lo rompió.", pt: "Não fui eu que quebrei isso.", fr: "Ce n’est pas moi qui l’ai cassé.", de: "Ich war es nicht, der es kaputt gemacht hat.", it: "Non sono stato io a romperlo.", pl: "To nie ja to zepsułem.", tr: "Onu kıran ben değildim.", id: "Bukan saya yang merusaknya.", vi: "Không phải tôi làm hỏng nó." } } }
          - { level: B2, features: { polarity: pos, interrogativity: int }, form: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }, pattern: { pattern: [{ alternatives: [Is, Was] }, it, { slot: { en: focus, uk: "фокус", es: "foco", pt: "foco", fr: "focus", de: "Fokus", it: "focus", pl: "fokus", tr: "odak", id: "fokus", vi: "trọng tâm" } }, that, { slot: clause }] }, ex: { ex: [{ target: "Was it Tom that" }, " broke it?"], tr: { uk: "Це Том його зламав?", es: "¿Fue Tom quien lo rompió?", pt: "Foi o Tom que quebrou isso?", fr: "Est-ce Tom qui l’a cassé ?", de: "War es Tom, der es kaputt gemacht hat?", it: "È stato Tom a romperlo?", pl: "Czy to Tom to zepsuł?", tr: "Onu kıran Tom muydu?", id: "Apakah Tom yang merusaknya?", vi: "Có phải Tom làm hỏng nó không?" } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Be shows the time: ", { term: is }, " for now and general truths, ", { term: was }, " for the past, ", { term: will be }, " for the future."], uk: ["Be показує час: ", { term: "is" }, " — для теперішнього й загальних істин, ", { term: "was" }, " — для минулого, ", { term: "will be" }, " — для майбутнього."], es: ["Be marca el tiempo: ", { term: "is" }, " para el presente y verdades generales, ", { term: "was" }, " para el pasado, ", { term: "will be" }, " para el futuro."], pt: ["Be marca o tempo: ", { term: "is" }, " para o presente e verdades gerais, ", { term: "was" }, " para o passado, ", { term: "will be" }, " para o futuro."], fr: ["Be marque le temps : ", { term: "is" }, " pour le présent et les vérités générales, ", { term: "was" }, " pour le passé, ", { term: "will be" }, " pour le futur."], de: ["Be zeigt die Zeit: ", { term: "is" }, " für die Gegenwart und allgemeine Wahrheiten, ", { term: "was" }, " für die Vergangenheit, ", { term: "will be" }, " für die Zukunft."], it: ["Be indica il tempo: ", { term: "is" }, " per presente e verità generali, ", { term: "was" }, " per il passato, ", { term: "will be" }, " per il futuro."], pl: ["Be wskazuje czas: ", { term: "is" }, " dla teraźniejszości i prawd ogólnych, ", { term: "was" }, " dla przeszłości, ", { term: "will be" }, " dla przyszłości."], tr: ["Be zamanı gösterir: ", { term: "is" }, " şimdiki zaman ve genel doğrular için, ", { term: "was" }, " geçmiş için, ", { term: "will be" }, " gelecek için."], id: ["Be menunjukkan waktu: ", { term: "is" }, " untuk sekarang dan kebenaran umum, ", { term: "was" }, " untuk masa lalu, ", { term: "will be" }, " untuk masa depan."], vi: ["Be chỉ thời gian: ", { term: "is" }, " cho hiện tại và chân lý, ", { term: "was" }, " cho quá khứ, ", { term: "will be" }, " cho tương lai."] }
            ex: { examples: [["It ", { target: is }, " the manager who decides."], ["It ", { target: will be }, " Ana who tells him."]] }
            tr: { uk: { examples: ["Вирішує саме керівник.", "Йому скаже саме Ана."] }, es: { examples: ["Es el gerente quien decide.", "Será Ana quien se lo diga."] }, pt: { examples: ["É o gerente quem decide.", "Será a Ana que vai contar a ele."] }, fr: { examples: ["C’est le directeur qui décide.", "Ce sera Ana qui le lui dira."] }, de: { examples: ["Es ist der Chef, der entscheidet.", "Es wird Ana sein, die es ihm sagt."] }, it: { examples: ["È il direttore che decide.", "Sarà Ana a dirglielo."] }, pl: { examples: ["To kierownik decyduje.", "To Ana mu powie."] }, tr: { examples: ["Karar veren müdürdür.", "Ona söyleyecek olan Ana olacak."] }, id: { examples: ["Manajerlah yang memutuskan.", "Analah yang akan memberi tahu dia."] }, vi: { examples: ["Chính người quản lý là người quyết định.", "Chính Ana sẽ nói với anh ấy."] } }
          - type: rule
            level: B2
            text: { en: "The joiner stands for the focus inside the clause, so the clause repeats neither subject nor object.", uk: "Сполучне слово заступає фокус у підрядному реченні, тому речення не повторює ні підмета, ні додатка.", es: "El nexo ocupa el lugar del foco en la subordinada, así que esta no repite sujeto ni objeto.", pt: "O conector ocupa o lugar do foco dentro da oração, então ela não repete sujeito nem objeto.", fr: "Le mot de liaison remplace le focus dans la proposition, qui ne répète donc ni le sujet ni le complément.", de: "Das Anschlusswort steht im Nebensatz für den Fokus; der Satz wiederholt also weder Subjekt noch Objekt.", it: "Il collegamento sta al posto del focus nella proposizione, quindi questa non ripete soggetto né complemento.", pl: "Łącznik zastępuje fokus w zdaniu podrzędnym, więc zdanie nie powtarza ani podmiotu, ani dopełnienia.", tr: "Bağlayıcı yan cümlede odağın yerini tutar; bu yüzden cümlede ne özne ne de nesne tekrarlanır.", id: "Penghubung menggantikan fokus di dalam klausa, sehingga klausa tidak mengulang subjek maupun objek.", vi: "Từ nối thay cho trọng tâm trong mệnh đề, nên mệnh đề không lặp lại chủ ngữ hay tân ngữ." }
            ex: ["It was Tom ", { target: "who broke" }, " it."]
            tr: { uk: "Саме Том це зламав.", es: "Fue Tom quien lo rompió.", pt: "Foi o Tom que quebrou isso.", fr: "C’est Tom qui l’a cassé.", de: "Es war Tom, der es kaputt gemacht hat.", it: "È stato Tom a romperlo.", pl: "To Tom to zepsuł.", tr: "Onu kıran Tom’du.", id: "Tomlah yang merusaknya.", vi: "Chính Tom đã làm hỏng nó." }
          - type: rule
            level: B2
            text: { en: "A preposition stays with its noun in careful style, or goes to the end in speech.", uk: "У ретельному стилі прийменник стоїть біля свого іменника, а в мовленні може йти в кінець.", es: "Una preposición va con su sustantivo en estilo cuidado, o pasa al final al hablar.", pt: "Uma preposição fica junto do substantivo no estilo cuidado, ou vai para o fim na fala.", fr: "Une préposition reste avec son nom dans un style soigné, ou passe à la fin à l’oral.", de: "Eine Präposition bleibt im sorgfältigen Stil bei ihrem Nomen oder rückt in der Rede ans Ende.", it: "Una preposizione resta con il suo sostantivo nello stile curato, o va in fondo nel parlato.", pl: "Przyimek stoi przy swoim rzeczowniku w stylu starannym albo idzie na koniec w mowie.", tr: "Özenli üslupta edat ismiyle birlikte kalır, konuşmada ise sona gider.", id: "Dalam gaya yang cermat, preposisi tetap bersama kata bendanya; dalam percakapan, ia pindah ke akhir.", vi: "Trong văn phong chỉn chu, giới từ đứng cùng danh từ của nó; khi nói, nó chuyển xuống cuối." }
            ex: { equivalence: [["It was ", { target: "to Ana that" }, " I gave the key."], ["It was ", { target: "Ana that" }, " I gave the key ", { target: to }, "."]] }
            tr: { uk: "Саме Ані я дав ключ.", es: "Fue a Ana a quien le di la llave.", pt: "Foi para a Ana que eu dei a chave.", fr: "C’est à Ana que j’ai donné la clé.", de: "Es war Ana, der ich den Schlüssel gegeben habe.", it: "È ad Ana che ho dato la chiave.", pl: "To Ani dałem klucz.", tr: "Anahtarı verdiğim kişi Ana’ydı.", id: "Kepada Analah saya memberikan kunci itu.", vi: "Chính Ana là người tôi đã đưa chìa khóa." }
          - type: note
            level: B2
            text: { en: ["The clause after ", { term: who }, " or ", { term: that }, " works as a relative clause: see ", { link: Relative Clauses, to: en.sentence-building.relative-clauses }, "."], uk: ["Підрядне речення після ", { term: "who" }, " або ", { term: "that" }, " діє як означальне підрядне речення: див. ", { link: "Означальні підрядні речення", to: "en.sentence-building.relative-clauses" }, "."], es: ["La oración que sigue a ", { term: "who" }, " o ", { term: "that" }, " funciona como una oración de relativo: ver ", { link: "Oraciones de relativo", to: "en.sentence-building.relative-clauses" }, "."], pt: ["A oração depois de ", { term: "who" }, " ou ", { term: "that" }, " funciona como uma oração relativa: veja ", { link: "Orações relativas", to: "en.sentence-building.relative-clauses" }, "."], fr: ["La proposition après ", { term: "who" }, " ou ", { term: "that" }, " fonctionne comme une proposition relative : voir ", { link: "Propositions relatives", to: "en.sentence-building.relative-clauses" }, "."], de: ["Der Nebensatz nach ", { term: "who" }, " oder ", { term: "that" }, " funktioniert wie ein Relativsatz: siehe ", { link: "Relativsätze", to: "en.sentence-building.relative-clauses" }, "."], it: ["La proposizione dopo ", { term: "who" }, " o ", { term: "that" }, " funziona come una proposizione relativa: vedi ", { link: "Proposizioni relative", to: "en.sentence-building.relative-clauses" }, "."], pl: ["Zdanie po ", { term: "who" }, " lub ", { term: "that" }, " działa jak zdanie względne: zob. ", { link: "Zdania względne", to: "en.sentence-building.relative-clauses" }, "."], tr: [{ term: "who" }, " veya ", { term: "that" }, " sözcüğünden sonraki yan cümle bir ilgi cümlesi gibi işler: bkz. ", { link: "İlgi cümleleri", to: "en.sentence-building.relative-clauses" }, "."], id: ["Klausa setelah ", { term: "who" }, " atau ", { term: "that" }, " berfungsi sebagai klausa relatif: lihat ", { link: "Klausa relatif", to: "en.sentence-building.relative-clauses" }, "."], vi: ["Mệnh đề sau ", { term: "who" }, " hoặc ", { term: "that" }, " hoạt động như một mệnh đề quan hệ: xem ", { link: "Mệnh đề quan hệ", to: "en.sentence-building.relative-clauses" }, "."] }

  - title: { en: "Form: wh-cleft", uk: "Форма: wh-конструкція", es: "Forma: seudohendida con wh-", pt: "Forma: pseudoclivada com wh-", fr: "Forme : pseudo-clivée en wh-", de: "Form: wh-Spaltsatz", it: "Forma: pseudoscissa con wh-", pl: "Forma: zdanie pseudorozszczepione z wh-", tr: "Biçim: wh- ile yarık cümle", id: "Bentuk: kalimat belah dengan wh-", vi: "Dạng: câu chẻ với wh-" }
