          - { level: B2, focus: { en: "A thing as subject", uk: "Предмет як підмет", es: "Una cosa como sujeto", pt: "Uma coisa como sujeito", fr: "Une chose comme sujet", de: "Eine Sache als Subjekt", it: "Una cosa come soggetto", pl: "Rzecz jako podmiot", tr: "Özne olarak bir şey", id: "Benda sebagai subjek", vi: "Một vật làm chủ ngữ" }, joiner: { en: { term: that }, uk: { term: "that" }, es: { term: "that" }, pt: { term: "that" }, fr: { term: "that" }, de: { term: "that" }, it: { term: "that" }, pl: { term: "that" }, tr: { term: "that" }, id: { term: "that" }, vi: { term: "that" } }, ex: [{ target: "It was the wind that" }, " opened the door."], tr: { uk: "Двері відчинив саме вітер.", es: "Fue el viento el que abrió la puerta.", pt: "Foi o vento que abriu a porta.", fr: "C’est le vent qui a ouvert la porte.", de: "Es war der Wind, der die Tür geöffnet hat.", it: "È stato il vento ad aprire la porta.", pl: "To wiatr otworzył drzwi.", tr: "Kapıyı açan rüzgârdı.", id: "Anginlah yang membuka pintu itu.", vi: "Chính gió đã mở cánh cửa." } }
          - { level: B2, focus: { en: "An object", uk: "Додаток", es: "Un objeto", pt: "Um objeto", fr: "Un complément", de: "Ein Objekt", it: "Un complemento", pl: "Dopełnienie", tr: "Bir nesne", id: "Objek", vi: "Một tân ngữ" }, joiner: { en: [{ term: that }, ", or no joiner"], uk: [{ term: "that" }, " або без сполучного слова"], es: [{ term: "that" }, " o sin nexo"], pt: [{ term: "that" }, " ou sem conector"], fr: [{ term: "that" }, " ou sans mot de liaison"], de: [{ term: "that" }, " oder ohne Anschlusswort"], it: [{ term: "that" }, " o senza collegamento"], pl: [{ term: "that" }, " lub bez łącznika"], tr: [{ term: "that" }, " veya bağlayıcısız"], id: [{ term: "that" }, " atau tanpa penghubung"], vi: [{ term: "that" }, " hoặc không có từ nối"] }, ex: [{ target: "It was the blue bag that" }, " I bought."], tr: { uk: "Я купив саме синю сумку.", es: "Fue la bolsa azul la que compré.", pt: "Foi a bolsa azul que eu comprei.", fr: "C’est le sac bleu que j’ai acheté.", de: "Es war die blaue Tasche, die ich gekauft habe.", it: "È la borsa blu che ho comprato.", pl: "To niebieską torbę kupiłem.", tr: "Aldığım şey mavi çantaydı.", id: "Tas biru itulah yang saya beli.", vi: "Chính chiếc túi xanh là thứ tôi đã mua." } }
          - { level: B2, focus: { en: "A time word", uk: "Слово зі значенням часу", es: "Una palabra de tiempo", pt: "Uma palavra de tempo", fr: "Un mot de temps", de: "Eine Zeitangabe", it: "Un'indicazione di tempo", pl: "Określenie czasu", tr: "Bir zaman sözcüğü", id: "Kata keterangan waktu", vi: "Một từ chỉ thời gian" }, joiner: { en: { term: that }, uk: { term: "that" }, es: { term: "that" }, pt: { term: "that" }, fr: { term: "that" }, de: { term: "that" }, it: { term: "that" }, pl: { term: "that" }, tr: { term: "that" }, id: { term: "that" }, vi: { term: "that" } }, ex: [{ target: "It was yesterday that" }, " I saw her."], tr: { uk: "Я бачив її саме вчора.", es: "Fue ayer cuando la vi.", pt: "Foi ontem que eu a vi.", fr: "C’est hier que je l’ai vue.", de: "Es war gestern, als ich sie gesehen habe.", it: "È stato ieri che l'ho vista.", pl: "To wczoraj ją widziałem.", tr: "Onu gördüğüm gün dündü.", id: "Kemarinlah saya melihatnya.", vi: "Chính hôm qua tôi đã nhìn thấy cô ấy." } }
          - { level: B2, focus: { en: "A prepositional phrase", uk: "Прийменникова група", es: "Un grupo preposicional", pt: "Um sintagma preposicional", fr: "Un groupe prépositionnel", de: "Eine Präpositionalphrase", it: "Un sintagma preposizionale", pl: "Grupa przyimkowa", tr: "Bir edat öbeği", id: "Frasa preposisi", vi: "Một cụm giới từ" }, joiner: { en: { term: that }, uk: { term: "that" }, es: { term: "that" }, pt: { term: "that" }, fr: { term: "that" }, de: { term: "that" }, it: { term: "that" }, pl: { term: "that" }, tr: { term: "that" }, id: { term: "that" }, vi: { term: "that" } }, ex: [{ target: "It was in Paris that" }, " we met."], tr: { uk: "Ми зустрілися саме в Парижі.", es: "Fue en París donde nos conocimos.", pt: "Foi em Paris que nos conhecemos.", fr: "C’est à Paris que nous nous sommes rencontrés.", de: "Es war in Paris, wo wir uns getroffen haben.", it: "È a Parigi che ci siamo conosciuti.", pl: "To w Paryżu się poznaliśmy.", tr: "Tanıştığımız yer Paris’ti.", id: "Di Parislah kami bertemu.", vi: "Chính ở Paris chúng tôi đã gặp nhau." } }
