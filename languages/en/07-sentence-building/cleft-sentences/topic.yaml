          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, frame: { pattern: [All, { slot: clause }, be, { slot: infinitive }] }, ex: [{ target: "All you have to do is" }, " ", { optional: to }, " press the button."], tr: { uk: "Усе, що тобі потрібно зробити, — це натиснути кнопку.", es: "Todo lo que tienes que hacer es presionar el botón.", pt: "Tudo o que você precisa fazer é apertar o botão.", fr: "Tout ce que tu as à faire, c’est d’appuyer sur le bouton.", de: "Alles, was du tun musst, ist, den Knopf zu drücken.", it: "Tutto quello che devi fare è premere il pulsante.", pl: "Wszystko, co musisz zrobić, to nacisnąć przycisk.", tr: "Tek yapman gereken düğmeye basmak.", id: "Yang perlu kamu lakukan hanyalah menekan tombol.", vi: "Việc bạn cần làm chỉ là nhấn nút." } }
          - { level: C2, frame: { pattern: [The best thing to do, be, { slot: infinitive }] }, ex: [{ target: "The best thing to do is" }, " ", { optional: to }, " wait."], tr: { uk: "Найкраще, що можна зробити, — зачекати.", es: "Lo mejor que se puede hacer es esperar.", pt: "A melhor coisa a fazer é esperar.", fr: "Le mieux à faire, c’est d’attendre.", de: "Das Beste, was man tun kann, ist abzuwarten.", it: "La cosa migliore da fare è aspettare.", pl: "Najlepsze, co można zrobić, to poczekać.", tr: "Yapılacak en iyi şey beklemek.", id: "Hal terbaik yang bisa dilakukan adalah menunggu.", vi: "Điều tốt nhất nên làm là chờ." } }
          - { level: C2, frame: { pattern: [What, { slot: clause }, be, to have, { slot: past participle }] }, ex: [{ target: "What I'd hoped was to have" }, " finished by now."], tr: { uk: "Я сподівався вже закінчити до цього часу.", es: "Lo que esperaba era haber terminado ya.", pt: "O que eu esperava era já ter terminado.", fr: "Ce que j’espérais, c’était d’avoir déjà fini.", de: "Was ich gehofft hatte, war, bis jetzt fertig zu sein.", it: "Quello che speravo era di aver già finito.", pl: "Liczyłem na to, że już skończę.", tr: "Umduğum şey şimdiye kadar bitirmiş olmaktı.", id: "Yang saya harapkan adalah sudah selesai sekarang.", vi: "Điều tôi đã hy vọng là đến giờ đã làm xong." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["When the clause or the frame holds ", { term: do }, ", the focus infinitive is bare or has ", { term: to }, "."], uk: ["Коли в підрядному реченні чи формулі є ", { term: "do" }, ", інфінітив у фокусі буває без ", { term: "to" }, " або з ", { term: "to" }, "."], es: ["Cuando la oración o la fórmula contiene ", { term: "do" }, ", el infinitivo del foco va sin ", { term: "to" }, " o con ", { term: "to" }, "."], pt: ["Quando a oração ou a fórmula tem ", { term: "do" }, ", o infinitivo do foco fica sem ", { term: "to" }, " ou com ", { term: "to" }, "."], fr: ["Quand la proposition ou la formule contient ", { term: "do" }, ", l’infinitif du focus est sans ", { term: "to" }, " ou avec ", { term: "to" }, "."], de: ["Enthält der Satz oder die Formel ", { term: "do" }, ", steht der Fokus-Infinitiv ohne ", { term: "to" }, " oder mit ", { term: "to" }, "."], it: ["Quando la proposizione o la formula contiene ", { term: "do" }, ", l'infinito del focus è senza ", { term: "to" }, " o con ", { term: "to" }, "."], pl: ["Gdy zdanie lub formuła zawiera ", { term: "do" }, ", bezokolicznik w fokusie jest bez ", { term: "to" }, " lub z ", { term: "to" }, "."], tr: ["Yan cümle ya da kalıp ", { term: "do" }, " içerdiğinde, odaktaki mastar ", { term: "to" }, " olmadan ya da ", { term: "to" }, " ile kullanılır."], id: ["Bila klausa atau ungkapan memuat ", { term: "do" }, ", infinitif pada fokus muncul tanpa ", { term: "to" }, " atau dengan ", { term: "to" }, "."], vi: ["Nếu mệnh đề hoặc khung câu có ", { term: "do" }, ", nguyên mẫu ở trọng tâm có thể bỏ ", { term: "to" }, " hoặc giữ ", { term: "to" }, "."] }
            ex: { examples: [["All I did was ", { target: ask }, "."], ["All I did was ", { target: to ask }, "."]] }
            tr: { uk: "Я всього лише запитав.", es: "Solo pregunté.", pt: "Eu só perguntei.", fr: "Je n’ai fait que demander.", de: "Ich habe nur gefragt.", it: "Ho solo chiesto.", pl: "Ja tylko zapytałem.", tr: "Ben sadece sordum.", id: "Saya hanya bertanya.", vi: "Tôi chỉ hỏi thôi." }
          - type: rule
            level: C2
            text: { en: "A perfect infinitive in the focus looks back to a hope or plan that may not have been met.", uk: "Перфектний інфінітив у фокусі повертає до надії чи плану, які могли не здійснитися.", es: "Un infinitivo perfecto en el foco mira atrás a una esperanza o un plan que quizá no se cumplió.", pt: "Um infinitivo perfeito no foco olha para trás, para uma esperança ou um plano que talvez não se cumpriu.", fr: "Un infinitif passé en focus renvoie à un espoir ou à un projet peut-être resté sans suite.", de: "Ein Perfektinfinitiv im Fokus blickt auf eine Hoffnung oder einen Plan zurück, die vielleicht nicht erfüllt wurden.", it: "Un infinito perfetto nel focus guarda indietro a una speranza o a un piano forse non realizzati.", pl: "Bezokolicznik perfect w fokusie wraca do nadziei lub planu, które mogły się nie spełnić.", tr: "Odaktaki tamamlanmış mastar, gerçekleşmemiş olabilecek bir umuda ya da plana geri bakar.", id: "Infinitif perfect pada fokus menengok ke belakang pada harapan atau rencana yang mungkin tidak terpenuhi.", vi: "Nguyên thể hoàn thành ở trọng tâm nhìn lại một hy vọng hoặc kế hoạch có thể đã không thành." }

  - title: { en: Stance frames, uk: "Формули позиції", es: "Fórmulas de postura", pt: "Fórmulas de posicionamento", fr: "Formules de positionnement", de: "Formeln der Stellungnahme", it: "Formule di presa di posizione", pl: "Formuły stanowiska", tr: "Tutum kalıpları", id: "Ungkapan sikap", vi: "Khung câu nêu quan điểm" }
    role: own
    content:
