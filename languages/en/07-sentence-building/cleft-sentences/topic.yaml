        rows:
          - { level: C1, focus: { en: [{ term: only when }, " and a clause"], uk: [{ term: "only when" }, " і підрядне речення"], es: [{ term: "only when" }, " y una oración"], pt: [{ term: "only when" }, " e uma oração"], fr: [{ term: "only when" }, " et une proposition"], de: [{ term: "only when" }, " und ein Nebensatz"], it: [{ term: "only when" }, " e una proposizione"], pl: [{ term: "only when" }, " i zdanie podrzędne"], tr: [{ term: "only when" }, " ve bir yan cümle"], id: [{ term: "only when" }, " dan sebuah klausa"], vi: [{ term: "only when" }, " và một mệnh đề"] }, ex: [{ target: "It was only when she left that" }, " I realised."], tr: { uk: "Лише тоді, коли вона пішла, я це усвідомив.", es: "Fue solo cuando ella se fue cuando me di cuenta.", pt: "Foi só quando ela foi embora que eu percebi.", fr: "Ce n’est que lorsqu’elle est partie que j’ai compris.", de: "Erst als sie ging, wurde es mir klar.", it: "È stato solo quando se n'è andata che me ne sono reso conto.", pl: "Dopiero gdy odeszła, zdałem sobie z tego sprawę.", tr: "Ancak o gittiğinde fark ettim.", id: "Baru ketika dia pergi, saya menyadarinya.", vi: "Mãi đến khi cô ấy đi, tôi mới nhận ra." } }
          - { level: C1, focus: { en: [{ term: only after }, " and a time phrase"], uk: [{ term: "only after" }, " і вираз часу"], es: [{ term: "only after" }, " y una expresión de tiempo"], pt: [{ term: "only after" }, " e uma expressão de tempo"], fr: [{ term: "only after" }, " et une expression de temps"], de: [{ term: "only after" }, " und eine Zeitangabe"], it: [{ term: "only after" }, " e un'espressione di tempo"], pl: [{ term: "only after" }, " i określenie czasu"], tr: [{ term: "only after" }, " ve bir zaman ifadesi"], id: [{ term: "only after" }, " dan frasa waktu"], vi: [{ term: "only after" }, " và một cụm chỉ thời gian"] }, ex: [{ target: "It was only after dinner that" }, " he called."], tr: { uk: "Він зателефонував лише після вечері.", es: "Fue solo después de la cena cuando llamó.", pt: "Foi só depois do jantar que ele ligou.", fr: "Ce n’est qu’après le dîner qu’il a appelé.", de: "Erst nach dem Abendessen hat er angerufen.", it: "È stato solo dopo cena che ha telefonato.", pl: "Dopiero po kolacji zadzwonił.", tr: "Ancak akşam yemeğinden sonra aradı.", id: "Baru setelah makan malam dia menelepon.", vi: "Mãi sau bữa tối anh ấy mới gọi." } }
          - { level: C1, focus: { en: [{ term: not until }, " and a time or a clause"], uk: [{ term: "not until" }, " і вираз часу або підрядне речення"], es: [{ term: "not until" }, " y una expresión de tiempo o una oración"], pt: [{ term: "not until" }, " e uma expressão de tempo ou uma oração"], fr: [{ term: "not until" }, " et une expression de temps ou une proposition"], de: [{ term: "not until" }, " und eine Zeitangabe oder ein Nebensatz"], it: [{ term: "not until" }, " e un'espressione di tempo o una proposizione"], pl: [{ term: "not until" }, " i określenie czasu lub zdanie podrzędne"], tr: [{ term: "not until" }, " ve bir zaman ifadesi ya da yan cümle"], id: [{ term: "not until" }, " dan frasa waktu atau klausa"], vi: [{ term: "not until" }, " và một cụm chỉ thời gian hoặc một mệnh đề"] }, ex: [{ target: "It was not until midnight that" }, " the rain stopped."], tr: { uk: "Дощ припинився лише опівночі.", es: "No fue hasta medianoche cuando dejó de llover.", pt: "Foi só à meia-noite que a chuva parou.", fr: "Ce n’est qu’à minuit que la pluie s’est arrêtée.", de: "Erst um Mitternacht hörte der Regen auf.", it: "È stato solo a mezzanotte che la pioggia ha smesso.", pl: "Dopiero o północy przestało padać.", tr: "Yağmur ancak gece yarısı dindi.", id: "Hujan baru berhenti tengah malam.", vi: "Mãi đến nửa đêm trời mới tạnh mưa." } }
          - { level: C1, focus: { en: [{ term: because }, " and a clause"], uk: [{ term: "because" }, " і підрядне речення"], es: [{ term: "because" }, " y una oración"], pt: [{ term: "because" }, " e uma oração"], fr: [{ term: "because" }, " et une proposition"], de: [{ term: "because" }, " und ein Nebensatz"], it: [{ term: "because" }, " e una proposizione"], pl: [{ term: "because" }, " i zdanie podrzędne"], tr: [{ term: "because" }, " ve bir yan cümle"], id: [{ term: "because" }, " dan sebuah klausa"], vi: [{ term: "because" }, " và một mệnh đề"] }, ex: [{ target: "It was because he was ill that" }, " we cancelled."], tr: { uk: "Ми скасували саме тому, що він захворів.", es: "Fue porque él estaba enfermo por lo que cancelamos.", pt: "Foi porque ele estava doente que cancelamos.", fr: "C’est parce qu’il était malade que nous avons annulé.", de: "Wir haben abgesagt, und zwar weil er krank war.", it: "È stato perché era malato che abbiamo annullato.", pl: "To dlatego, że był chory, odwołaliśmy spotkanie.", tr: "İptal etmemizin nedeni onun hasta olmasıydı.", id: "Karena dia sakitlah kami membatalkannya.", vi: "Chính vì anh ấy bị ốm mà chúng tôi đã hủy." } }
          - { level: C1, focus: { en: "A phrase of manner, with a passive clause after that", uk: "Вираз способу дії з пасивним реченням після that", es: "Una expresión de modo, con una oración pasiva después de that", pt: "Uma expressão de modo, com uma oração passiva depois de that", fr: "Une expression de manière, avec une proposition passive après that", de: "Eine Angabe der Art und Weise, mit Passivsatz nach that", it: "Un'espressione di modo, con una proposizione passiva dopo that", pl: "Określenie sposobu, ze zdaniem w stronie biernej po that", tr: "Tarz bildiren bir ifade; that sonrasında edilgen bir cümle gelir", id: "Frasa cara, dengan klausa pasif setelah that", vi: "Một cụm chỉ cách thức, với mệnh đề bị động sau that" }, ex: [{ target: "It was by chance that" }, " the letter was found."], tr: { uk: "Лист знайшли цілком випадково.", es: "Fue por casualidad como se encontró la carta.", pt: "Foi por acaso que a carta foi encontrada.", fr: "C’est par hasard que la lettre a été trouvée.", de: "Es war Zufall, dass der Brief gefunden wurde.", it: "È stato per caso che la lettera è stata trovata.", pl: "To przez przypadek list został znaleziony.", tr: "Mektup tesadüfen bulundu.", id: "Surat itu ditemukan secara kebetulan.", vi: "Chỉ là tình cờ mà bức thư được tìm thấy." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["After ", { term: not until }, ", the verb is positive; ", { term: not }, " already makes the sentence negative."], uk: ["Після ", { term: "not until" }, " дієслово стоїть у ствердній формі: ", { term: "not" }, " уже робить речення заперечним."], es: ["Después de ", { term: "not until" }, ", el verbo va en afirmativo; ", { term: "not" }, " ya hace negativa la oración."], pt: ["Depois de ", { term: "not until" }, ", o verbo fica afirmativo; ", { term: "not" }, " já torna a frase negativa."], fr: ["Après ", { term: "not until" }, ", le verbe est affirmatif ; ", { term: "not" }, " rend déjà la phrase négative."], de: ["Nach ", { term: "not until" }, " steht das Verb positiv; ", { term: "not" }, " macht den Satz schon negativ."], it: ["Dopo ", { term: "not until" }, " il verbo è affermativo; ", { term: "not" }, " rende già negativa la frase."], pl: ["Po ", { term: "not until" }, " czasownik jest w formie twierdzącej; ", { term: "not" }, " już czyni zdanie przeczącym."], tr: [{ term: "not until" }, " sözcüğünden sonra fiil olumludur; ", { term: "not" }, " cümleyi zaten olumsuz yapar."], id: ["Setelah ", { term: "not until" }, ", kata kerja berbentuk positif; ", { term: "not" }, " sudah membuat kalimat negatif."], vi: ["Sau ", { term: "not until" }, ", động từ ở dạng khẳng định; ", { term: "not" }, " đã làm câu mang nghĩa phủ định."] }
            ex: ["It was not until May that the shop ", { target: opened }, "."]
            tr: { uk: "Крамниця відкрилася лише в травні.", es: "No fue hasta mayo cuando abrió la tienda.", pt: "Só em maio é que a loja abriu.", fr: "Ce n’est qu’en mai que le magasin a ouvert.", de: "Erst im Mai hat das Geschäft geöffnet.", it: "Solo a maggio il negozio ha aperto.", pl: "Sklep otwarto dopiero w maju.", tr: "Dükkân ancak mayısta açıldı.", id: "Toko itu baru buka pada bulan Mei.", vi: "Mãi đến tháng Năm cửa hàng mới mở." }
          - type: note
            level: C1
            text: { en: ["Passive clauses are in ", { link: Passive Voice, to: en.sentence-building.passive-voice }, "."], uk: ["Пасивні речення: див. ", { link: "Пасивний стан", to: "en.sentence-building.passive-voice" }, "."], es: ["Las oraciones pasivas: ver ", { link: "La voz pasiva", to: "en.sentence-building.passive-voice" }, "."], pt: ["Orações passivas: veja ", { link: "A voz passiva", to: "en.sentence-building.passive-voice" }, "."], fr: ["Les propositions passives : voir ", { link: "Voix passive", to: "en.sentence-building.passive-voice" }, "."], de: ["Passivsätze: siehe ", { link: "Das Passiv", to: "en.sentence-building.passive-voice" }, "."], it: ["Le proposizioni passive: vedi ", { link: "Forma passiva", to: "en.sentence-building.passive-voice" }, "."], pl: ["Zdania w stronie biernej: zob. ", { link: "Strona bierna", to: "en.sentence-building.passive-voice" }, "."], tr: ["Edilgen cümleler için bkz. ", { link: "Edilgen çatı", to: "en.sentence-building.passive-voice" }, "."], id: ["Klausa pasif: lihat ", { link: "Kalimat pasif", to: "en.sentence-building.passive-voice" }, "."], vi: ["Mệnh đề bị động: xem ", { link: "Câu bị động", to: "en.sentence-building.passive-voice" }, "."] }

  - title: { en: Explanatory clefts, uk: "Пояснювальні конструкції", es: "Hendidas explicativas", pt: "Clivadas explicativas", fr: "Clivées explicatives", de: "Erklärende Spaltsätze", it: "Scisse esplicative", pl: "Zdania rozszczepione wyjaśniające", tr: "Açıklayıcı yarık cümleler", id: "Kalimat belah penjelas", vi: "Câu chẻ giải thích" }
