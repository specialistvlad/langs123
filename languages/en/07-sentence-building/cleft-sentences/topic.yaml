nicht daran, dass ich sie nicht mag; es liegt daran, dass ich beschäftigt bin.", it: "Non è che non mi piaccia; è che sono occupato.", pl: "Nie chodzi o to, że jej nie lubię; chodzi o to, że jestem zajęty.", tr: "Ondan hoşlanmadığımdan değil, meşgul olduğumdan.", id: "Bukan karena saya tidak menyukainya, melainkan karena saya sibuk.", vi: "Không phải là tôi không thích cô ấy; chỉ là tôi đang bận." } }
          - { level: C1, form: { en: { term: ["What", { gap: true }, "was", { gap: true }] }, uk: { term: ["What", { gap: true }, "was", { gap: true }] }, es: { term: ["What", { gap: true }, "was", { gap: true }] }, pt: { term: ["What", { gap: true }, "was", { gap: true }] }, fr: { term: ["What", { gap: true }, "was", { gap: true }] }, de: { term: ["What", { gap: true }, "was", { gap: true }] }, it: { term: ["What", { gap: true }, "was", { gap: true }] }, pl: { term: ["What", { gap: true }, "was", { gap: true }] }, tr: { term: ["What", { gap: true }, "was", { gap: true }] }, id: { term: ["What", { gap: true }, "was", { gap: true }] }, vi: { term: ["What", { gap: true }, "was", { gap: true }] } }, use: { en: "names a strong feeling or effect", uk: "називає сильне почуття або враження", es: "nombra un sentimiento o efecto fuerte", pt: "nomeia um sentimento ou efeito forte", fr: "nomme un sentiment ou un effet fort", de: "nennt ein starkes Gefühl oder eine starke Wirkung", it: "nomina un sentimento o un effetto forte", pl: "nazywa silne uczucie lub skutek", tr: "güçlü bir duyguyu ya da etkiyi adlandırır", id: "menyebut perasaan atau dampak yang kuat", vi: "nêu một cảm xúc hoặc tác động mạnh" }, ex: [{ target: "What annoyed me most was" }, " the delay."], tr: { uk: "Найбільше мене роздратувала затримка.", es: "Lo que más me molestó fue el retraso.", pt: "O que mais me irritou foi o atraso.", fr: "Ce qui m’a le plus agacé, c’est le retard.", de: "Was mich am meisten geärgert hat, war die Verspätung.", it: "Quello che mi ha infastidito di più è stato il ritardo.", pl: "Najbardziej zirytowało mnie opóźnienie.", tr: "Beni en çok sinirlendiren şey gecikmeydi.", id: "Yang paling membuat saya kesal adalah keterlambatannya.", vi: "Điều làm tôi bực nhất là sự chậm trễ." } }
          - { level: C1, form: { en: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " with a question as focus"], uk: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " з питанням як фокусом"], es: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " con una pregunta como foco"], pt: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " com uma pergunta como foco"], fr: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " avec une question en focus"], de: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " mit einer Frage als Fokus"], it: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " con una domanda come focus"], pl: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " z pytaniem jako fokusem"], tr: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " ve odak olarak bir soru"], id: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " dengan pertanyaan sebagai fokus"], vi: [{ term: ["What", { gap: true }, "is", { gap: true }] }, " với một câu hỏi làm trọng tâm"] }, use: { en: "puts a question at the end", uk: "ставить питання наприкінці", es: "pone una pregunta al final", pt: "põe uma pergunta no fim", fr: "met une question à la fin", de: "stellt eine Frage ans Ende", it: "mette una domanda alla fine", pl: "umieszcza pytanie na końcu", tr: "soruyu sona koyar", id: "menaruh pertanyaan di akhir", vi: "đặt một câu hỏi ở cuối" }, ex: [{ target: "What I'd like to know is" }, " why nobody told me."], tr: { uk: "Що я хотів би знати — чому ніхто мені не сказав.", es: "Lo que me gustaría saber es por qué nadie me dijo.", pt: "O que eu gostaria de saber é por que ninguém me contou.", fr: "Ce que j’aimerais savoir, c’est pourquoi personne ne me l’a dit.", de: "Was ich gern wissen würde, ist, warum mir niemand etwas gesagt hat.", it: "Quello che vorrei sapere è perché nessuno me l'ha detto.", pl: "To, co chciałbym wiedzieć, to dlaczego nikt mi nie powiedział.", tr: "Bilmek istediğim şey, neden kimsenin bana söylemediği.", id: "Yang ingin saya ketahui adalah mengapa tidak ada yang memberi tahu saya.", vi: "Điều tôi muốn biết là tại sao không ai nói với tôi." } }

  - title: { en: "Clefts in questions and answers", uk: "Виділювальні конструкції в питаннях і відповідях", es: "Hendidas en preguntas y respuestas", pt: "Clivadas em perguntas e respostas", fr: "Clivées dans les questions et les réponses", de: "Spaltsätze in Fragen und Antworten", it: "Scisse in domande e risposte", pl: "Zdania rozszczepione w pytaniach i odpowiedziach", tr: "Soru ve cevaplarda yarık cümleler", id: "Kalimat belah dalam pertanyaan dan jawaban", vi: "Câu chẻ trong câu hỏi và câu trả lời" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, use: { en: "A cleft answers a question about the doer", uk: "Виділювальна конструкція відповідає на питання про виконавця дії", es: "Una hendida responde a una pregunta sobre quien hace la acción", pt: "Uma clivada responde a uma pergunta sobre quem faz a ação", fr: "Une clivée répond à une question sur l’auteur de l’action", de: "Ein Spaltsatz antwortet auf eine Frage nach dem Handelnden", it: "Una scissa risponde a una domanda su chi compie l'azione", pl: "Zdanie rozszczepione odpowiada na pytanie o sprawcę", tr: "Yarık cümle, eylemi yapana dair bir soruyu yanıtlar", id: "Kalimat belah menjawab pertanyaan tentang pelaku", vi: "Câu chẻ trả lời câu hỏi về người thực hiện hành động" }, ex: { exchange: ["Who broke the vase?", [{ target: "It was" }, " ", { stress: Tom }, "."]] }, tr: { uk: "Хто розбив вазу? — Це зробив Том.", es: "¿Quién rompió el jarrón? — Fue Tom.", pt: "Quem quebrou o vaso? — Foi o Tom.", fr: "Qui a cassé le vase ? — C’est Tom.", de: "Wer hat die Vase zerbrochen? — Es war Tom.", it: "Chi ha rotto il vaso? — È stato Tom.", pl: "Kto stłukł wazon? — To był Tom.", tr: "Vazoyu kim kırdı? — Tom kırdı.", id: "Siapa yang memecahkan vas itu? — Itu Tom.", vi: "Ai làm vỡ cái bình? — Là Tom." } }
          - { level: C1, use: { en: "A cleft answers a question about time or place", uk: "Виділювальна конструкція відповідає на питання про час або місце", es: "Una hendida responde a una pregunta sobre el tiempo o el lugar", pt: "Uma clivada responde a uma pergunta sobre tempo ou lugar", fr: "Une clivée répond à une question sur le moment ou le lieu", de: "Ein Spaltsatz antwortet auf eine Frage nach Zeit oder Ort", it: "Una scissa risponde a una domanda sul tempo o sul luogo", pl: "Zdanie rozszczepione odpowiada na pytanie o czas lub miejsce", tr: "Yarık cümle, zaman ya da yere dair bir soruyu yanıtlar", id: "Kalimat belah menjawab pertanyaan tentang waktu atau tempat", vi: "Câu chẻ trả lời câu hỏi về thời gian hoặc nơi chốn" }, ex: { exchange: ["Where did you meet?", [{ target: "It was" }, " in ", { stress: Paris }, "."]] }, tr: { uk: "Де ви познайомилися? — Саме в Парижі.", es: "¿Dónde se conocieron? — Fue en París.", pt: "Onde vocês se conheceram? — Foi em Paris.", fr: "Où vous êtes-vous rencontrés ? — C’est à Paris.", de: "Wo habt ihr euch getroffen? — Es war in Paris.", it: "Dove vi siete conosciuti? — È stato a Parigi.", pl: "Gdzie się poznaliście? — To było w Paryżu.", tr: "Nerede tanıştınız? — Tanıştığımız yer Paris’ti.", id: "Di mana kalian bertemu? — Di Paris.", vi: "Hai bạn gặp nhau ở đâu? — Là ở Paris." } }
          - { level: C1, use: { en: "A wh-cleft answers a question about wants", uk: "wh-конструкція відповідає на питання про бажання", es: "Una seudohendida con wh- responde a una pregunta sobre deseos", pt: "Uma pseudoclivada com wh- responde a uma pergunta sobre desejos", fr: "Une pseudo-clivée en wh- répond à une question sur les envies", de: "Ein wh-Spaltsatz antwortet auf eine Frage nach Wünschen", it: "Una pseudoscissa con wh- risponde a una domanda sui desideri", pl: "Zdanie z wh- odpowiada na pytanie o pragnienia", tr: "wh- ile yarık cümle, istekle ilgili bir soruyu yanıtlar", id: "Kalimat belah dengan wh- menjawab pertanyaan tentang keinginan", vi: "Câu chẻ với wh- trả lời câu hỏi về điều muốn" }, ex: { exchange: ["What do you want for your birthday?", [{ target: "What I'd really like is" }, " a quiet ", { stress: evening }, "."]] }, tr: { uk: "Що ти хочеш на день народження? — Що я справді хотів би — це тихий вечір.", es: "¿Qué quieres para tu cumpleaños? — Lo que de verdad me gustaría es una noche tranquila.", pt: "O que você quer de aniversário? — O que eu realmente gostaria é de uma noite tranquila.", fr: "Que veux-tu pour ton anniversaire ? — Ce qui me ferait vraiment plaisir, c’est une soirée tranquille.", de: "Was wünschst du dir zum Geburtstag? — Was ich mir wirklich wünsche, ist ein ruhiger Abend.", it: "Cosa vuoi per il tuo compleanno? — Quello che mi piacerebbe davvero è una serata tranquilla.", pl: "Czego chcesz na urodziny? — To, czego naprawdę bym chciał, to spokojny wieczór.", tr: "Doğum günün için ne istersin? — Gerçekten istediğim şey sakin bir akşam.", id: "Kamu mau apa untuk ulang tahunmu? — Yang benar-benar saya inginkan adalah malam yang tenang.", vi: "Bạn muốn gì cho sinh nhật? — Điều tôi thật sự muốn là một buổi tối yên tĩnh." } }
          - { level: C1, use: { en: "A question can itself be a cleft", uk: "Саме питання теж може бути виділювальною конструкцією", es: "Una pregunta también puede ser una hendida", pt: "Uma pergunta também pode ser uma clivada", fr: "Une question peut elle-même être une clivée", de: "Auch eine Frage kann ein Spaltsatz sein", it: "Anche una domanda può essere una scissa", pl: "Samo pytanie też może być zdaniem rozszczepionym", tr: "Bir soru da kendi başına yarık cümle olabilir", id: "Pertanyaan pun bisa berupa kalimat belah", vi: "Bản thân câu hỏi cũng có thể là câu chẻ" }, ex: { examples: [[{ target: "Who was it that" }, " called?"], [{ target: "What was it that" }, " you said?"]] }, tr: { uk: { examples: ["Хто ж це телефонував?", "Що ж ти сказав?"] }, es: { examples: ["¿Quién fue el que llamó?", "¿Qué fue lo que dijiste?"] }, pt: { examples: ["Quem foi que ligou?", "O que foi que você disse?"] }, fr: { examples: ["Qui est-ce qui a appelé ?", "Qu’est-ce que tu as dit ?"] }, de: { examples: ["Wer war es, der angerufen hat?", "Was war es, das du gesagt hast?"] }, it: { examples: ["Chi è stato a chiamare?", "Che cos'è che hai detto?"] }, pl: { examples: ["Kto to dzwonił?", "Co ty właściwie powiedziałeś?"] }, tr: { examples: ["Arayan kimdi?", "Söylediğin şey neydi?"] }, id: { examples: ["Siapa yang tadi menelepon?", "Apa yang tadi kamu katakan?"] }, vi: { examples: ["Ai là người đã gọi?", "Bạn vừa nói điều gì vậy?"] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The tonic syllable, the strongest stress, falls on the focus; the clause after it stays low.", uk: "Тонічний склад, найсильніший наголос, падає на фокус; речення після нього звучить нижче.", es: "La sílaba tónica, el acento más fuerte, cae en el foco; la oración que sigue queda baja.", pt: "A sílaba tônica, o acento mais forte, cai no foco; a oração depois dele fica em tom baixo.", fr: "La syllabe tonique, l’accent le plus fort, tombe sur le focus ; la proposition qui suit reste basse.", de: "Die Tonsilbe, die stärkste Betonung, liegt auf dem Fokus; der folgende Nebensatz bleibt tief.", it: "La sillaba tonica, l'accento più forte, cade sul focus; la proposizione che segue resta bassa.", pl: "Sylaba toniczna, najsilniejszy akcent, pada na fokus; następujące po niej zdanie brzmi niżej.", tr: "Ana vurgulu hece, yani en güçlü vurgu, odağa düşer; ondan sonraki yan cümle alçak kalır.", id: "Suku kata tonik, tekanan terkuat, jatuh pada fokus; klausa sesudahnya tetap rendah.", vi: "Âm tiết chính, nơi có trọng âm mạnh nhất, rơi vào trọng tâm; mệnh đề sau đó giữ giọng thấp." }
            ex: ["It was ", { stress: Tom }, " who broke it. ", { intonation: fall }]
            tr: { uk: "Саме Том це зламав.", es: "Fue Tom quien lo rompió.", pt: "Foi o Tom que quebrou isso.", fr: "C’est Tom qui l’a cassé.", de: "Es war Tom, der es kaputt gemacht hat.", it: "È stato Tom a romperlo.", pl: "To Tom to zepsuł.", tr: "Onu kıran Tom’du.", id: "Tomlah yang merusaknya.", vi: "Chính Tom đã làm hỏng nó." }

  - title: { en: "Infinitive and perfect clefts", uk: "Виділювальні конструкції з інфінітивом і перфектним інфінітивом", es: "Hendidas con infinitivo y con infinitivo perfecto", pt: "Clivadas com infinitivo e com infinitivo perfeito", fr: "Clivées avec infinitif et infinitif passé", de: "Spaltsätze mit Infinitiv und Perfektinfinitiv", it: "Scisse con infinito e infinito perfetto", pl: "Zdania rozszczepione z bezokolicznikiem i bezokolicznikiem perfect", tr: "Mastarlı ve tamamlanmış mastarlı yarık cümleler", id: "Kalimat belah dengan infinitif dan infinitif perfect", vi: "Câu chẻ với động từ nguyên mẫu và nguyên mẫu hoàn thành" }
    role: own
