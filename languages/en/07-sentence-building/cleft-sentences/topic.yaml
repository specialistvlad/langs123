        rows:
          - { level: B2, use: { en: "Contradicts a doubt or a denial", uk: "Спростовує сумнів або заперечення", es: "Contradice una duda o una negación", pt: "Contradiz uma dúvida ou uma negação", fr: "Contredit un doute ou un démenti", de: "Widerspricht einem Zweifel oder einer Verneinung", it: "Contraddice un dubbio o una negazione", pl: "Zaprzecza wątpliwości lub zaprzeczeniu", tr: "Bir şüpheyi ya da inkârı çürütür", id: "Membantah keraguan atau penyangkalan", vi: "Phản bác một sự nghi ngờ hoặc phủ nhận" }, ex: { exchange: ["You never help me.", ["I ", { target: do help }, " you!"]] }, tr: { uk: "Ти мені ніколи не допомагаєш. — Ще й як допомагаю!", es: "Nunca me ayudas. — ¡Sí te ayudo!", pt: "Você nunca me ajuda. — Ajudo, sim!", fr: "Tu ne m’aides jamais. — Mais si, je t’aide !", de: "Du hilfst mir nie. — Doch, ich helfe dir!", it: "Non mi aiuti mai. — Ti aiuto eccome!", pl: "Nigdy mi nie pomagasz. — Ależ pomagam!", tr: "Bana hiç yardım etmiyorsun. — Ediyorum ya!", id: "Kamu tidak pernah membantuku. — Aku memang membantumu!", vi: "Bạn không bao giờ giúp tôi. — Tôi có giúp bạn mà!" } }
          - { level: B2, use: { en: "Insists that something is true or did happen", uk: "Наполягає, що щось правда або справді сталося", es: "Insiste en que algo es verdad o sí ocurrió", pt: "Insiste que algo é verdade ou aconteceu mesmo", fr: "Insiste sur le fait que quelque chose est vrai ou a bien eu lieu", de: "Beharrt darauf, dass etwas wahr ist oder wirklich geschehen ist", it: "Insiste che qualcosa è vero o è successo davvero", pl: "Podkreśla, że coś jest prawdą lub rzeczywiście się stało", tr: "Bir şeyin doğru olduğunda ya da gerçekten olduğunda ısrar eder", id: "Menegaskan bahwa sesuatu benar atau memang terjadi", vi: "Khẳng định điều gì đó là đúng hoặc đã thực sự xảy ra" }, ex: ["I ", { target: did tell }, " you about the party."], tr: { uk: "Я таки розповідав тобі про вечірку.", es: "Sí te hablé de la fiesta.", pt: "Eu falei da festa para você, sim.", fr: "Je t’ai bien parlé de la fête.", de: "Ich habe dir sehr wohl von der Party erzählt.", it: "Ti ho parlato della festa, eccome.", pl: "Przecież mówiłem ci o imprezie.", tr: "Sana partiden bahsetmiştim ya.", id: "Saya memang sudah memberitahumu soal pesta itu.", vi: "Tôi có nói với bạn về bữa tiệc mà." } }
          - { level: B2, use: { en: "Agrees with a point, then adds a but", uk: "Погоджується з одним пунктом, а потім додає «але»", es: "Admite un punto y luego añade un pero", pt: "Concorda com um ponto e depois acrescenta um mas", fr: "Reconnaît un point, puis ajoute un « mais »", de: "Stimmt einem Punkt zu und fügt dann ein Aber hinzu", it: "Ammette un punto, poi aggiunge un ma", pl: "Przyznaje rację w jednej kwestii, a potem dodaje „ale”", tr: "Bir noktayı kabul eder, sonra bir ama ekler", id: "Mengakui satu hal, lalu menambahkan tetapi", vi: "Thừa nhận một điểm rồi thêm một ý với nhưng" }, ex: ["She ", { target: did apologise }, ", but it was too late."], tr: { uk: "Вона таки перепросила, але було вже пізно.", es: "Sí se disculpó, pero ya era tarde.", pt: "Ela pediu desculpas, sim, mas era tarde demais.", fr: "Elle s’est bien excusée, mais il était trop tard.", de: "Sie hat sich zwar entschuldigt, aber es war zu spät.", it: "Si è scusata, è vero, ma era troppo tardi.", pl: "Przeprosiła wprawdzie, ale było już za późno.", tr: "Özür diledi gerçi, ama çok geçti.", id: "Dia memang meminta maaf, tetapi sudah terlambat.", vi: "Cô ấy có xin lỗi, nhưng đã quá muộn." } }
          - { level: B2, use: { en: "Adds warmth to an invitation, a hope or a compliment", uk: "Додає теплоти запрошенню, надії або компліменту", es: "Da calidez a una invitación, un deseo o un cumplido", pt: "Dá calor a um convite, uma esperança ou um elogio", fr: "Donne de la chaleur à une invitation, à un souhait ou à un compliment", de: "Macht eine Einladung, einen Wunsch oder ein Kompliment herzlicher", it: "Dà calore a un invito, a una speranza o a un complimento", pl: "Dodaje serdeczności zaproszeniu, nadziei lub komplementowi", tr: "Bir davete, bir temenniye ya da bir iltifata sıcaklık katar", id: "Menambah kehangatan pada undangan, harapan, atau pujian", vi: "Thêm sự ấm áp cho lời mời, lời chúc hoặc lời khen" }, ex: { examples: [[{ target: Do have }, " some cake."], ["We ", { target: do hope }, " you can come."], ["I ", { target: do like }, " your garden."]] }, tr: { uk: { examples: ["Пригощайтеся ж тортом.", "Ми щиро сподіваємося, що ви зможете прийти.", "Мені дуже подобається ваш сад."] }, es: { examples: ["Por favor, sírvete un poco de pastel.", "Esperamos de verdad que puedas venir.", "Me gusta mucho tu jardín."] }, pt: { examples: ["Pegue um pedaço de bolo, por favor.", "Esperamos mesmo que você possa vir.", "Eu gosto muito do seu jardim."] }, fr: { examples: ["Prenez donc un peu de gâteau.", "Nous espérons vraiment que vous pourrez venir.", "J’aime vraiment votre jardin."] }, de: { examples: ["Nehmen Sie doch etwas Kuchen.", "Wir hoffen wirklich, dass Sie kommen können.", "Ihr Garten gefällt mir wirklich."] }, it: { examples: ["Prendi pure un po' di torta.", "Speriamo proprio che tu possa venire.", "Mi piace davvero il tuo giardino."] }, pl: { examples: ["Poczęstuj się, proszę, ciastem.", "Naprawdę mamy nadzieję, że możesz przyjść.", "Bardzo mi się podoba twój ogród."] }, tr: { examples: ["Lütfen biraz pasta al.", "Gelebilmeni gerçekten umuyoruz.", "Bahçeni gerçekten çok beğeniyorum."] }, id: { examples: ["Silakan makan kuenya.", "Kami sungguh berhar