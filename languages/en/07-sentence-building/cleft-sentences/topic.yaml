        columns:
          - { key: frame, label: { en: Frame, uk: "Формула", es: "Fórmula", pt: "Fórmula", fr: "Formule", de: "Formel", it: "Formula", pl: "Formuła", tr: "Söz kalıbı", id: "Ungkapan", vi: "Khung câu" } }
