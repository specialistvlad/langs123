          - { level: B2, features: { tense: pst }, form: { en: Past, uk: "Минулий", es: "Pasado", pt: "Passado", fr: "Passé", de: "Vergangenheit", it: "Passato", pl: "Przeszły", tr: "Geçmiş zaman", id: "Past", vi: "Quá khứ" }, pattern: { pattern: [did, { slot: base verb }] }, ex: { ex: ["She ", { target: did tell }, " me."], tr: { uk: "Вона таки сказала мені.", es: "Ella sí me lo dijo.", pt: "Ela me disse, sim.", fr: "Elle me l’a bien dit.", de: "Sie hat es mir wirklich gesagt.", it: "Me l'ha detto davvero.", pl: "Ona mi to naprawdę powiedziała.", tr: "O bana gerçekten söyledi.", id: "Dia memang memberitahuku.", vi: "Cô ấy có nói với tôi mà." } } }
          - { level: B2, features: { mood: imp }, form: { en: Imperative, uk: "Наказовий спосіб", es: "Imperativo", pt: "Imperativo", fr: "Impératif", de: "Imperativ", it: "Imperativo", pl: "Tryb rozkazujący", tr: "Emir kipi", id: "Kalimat perintah", vi: "Câu mệnh lệnh" }, pattern: { pattern: [do, { slot: base verb }] }, ex: { ex: { examples: [[{ target: Do sit }, " down."], [{ target: Do be }, " careful."]] }, tr: { uk: { examples: ["Прошу, сідайте.", "Будьте ж обережні."] }, es: { examples: ["Por favor, siéntate.", "Ten mucho cuidado."] }, pt: { examples: ["Sente-se, por favor.", "Tenha muito cuidado."] }, fr: { examples: ["Asseyez-vous donc.", "Faites bien attention."] }, de: { examples: ["Setz dich doch hin.", "Sei bitte vorsichtig."] }, it: { examples: ["Siediti pure.", "Stai molto attento."] }, pl: { examples: ["Proszę, usiądź.", "Bądź naprawdę ostrożny."] }, tr: { examples: ["Hadi otur.", "Lütfen dikkatli ol."] }, id: { examples: ["Duduklah.", "Berhati-hatilah."] }, vi: { examples: ["Cứ ngồi xuống đi.", "Nhớ cẩn thận nhé."] } } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["In statements, ", { term: be }, ", auxiliary ", { term: have }, " and modals take the stress themselves, not ", { term: do }, "."], uk: ["У ствердженнях наголос беруть на себе ", { term: "be" }, ", допоміжне ", { term: "have" }, " і модальні дієслова, а не ", { term: "do" }, "."], es: ["En las afirmaciones, ", { term: "be" }, ", el auxiliar ", { term: "have" }, " y los modales llevan el acento ellos mismos, no ", { term: "do" }, "."], pt: ["Nas afirmações, ", { term: "be" }, ", o auxiliar ", { term: "have" }, " e os modais recebem o acento eles mesmos, não ", { term: "do" }, "."], fr: ["Dans les affirmations, ", { term: "be" }, ", l’auxiliaire ", { term: "have" }, " et les modaux portent eux-mêmes l’accent, et non ", { term: "do" }, "."], de: ["In Aussagen tragen ", { term: "be" }, ", das Hilfsverb ", { term: "have" }, " und die Modalverben die Betonung selbst, nicht ", { term: "do" }, "."], it: ["Nelle affermazioni, ", { term: "be" }, ", l'ausiliare ", { term: "have" }, " e i modali prendono loro l'accento, non ", { term: "do" }, "."], pl: ["W zdaniach twierdzących akcent biorą na siebie ", { term: "be" }, ", pomocnicze ", { term: "have" }, " i czasowniki modalne, a nie ", { term: "do" }, "."], tr: ["Olumlu cümlelerde vurguyu ", { term: "be" }, ", yardımcı ", { term: "have" }, " ve modal fiiller kendileri alır, ", { term: "do" }, " almaz."], id: ["Dalam kalimat pernyataan, ", { term: "be" }, ", kata kerja bantu ", { term: "have" }, ", dan kata kerja modal sendiri yang menerima tekanan, bukan ", { term: "do" }, "."], vi: ["Câu khẳng định: ", { term: "be" }, ", trợ động từ ", { term: "have" }, " và động từ khuyết thiếu tự mang trọng âm, không phải ", { term: "do" }, "."] }
            ex: { examples: [["She ", { stress: is }, " late."], ["I ", { stress: have }, " finished."], ["He ", { stress: can }, " swim."]] }
            tr: { uk: { examples: ["Вона таки запізнилася.", "Я таки закінчив.", "Він таки вміє плавати."] }, es: { examples: ["Ella sí está atrasada.", "Sí terminé.", "Él sí sabe nadar."] }, pt: { examples: ["Ela está atrasada, sim.", "Eu terminei, sim.", "Ele sabe nadar, sim."] }, fr: { examples: ["Elle est bel et bien en retard.", "J’ai bel et bien fini.", "Il sait vraiment nager."] }, de: { examples: ["Sie ist wirklich spät dran.", "Ich bin wirklich fertig.", "Er kann wirklich schwimmen."] }, it: { examples: ["È davvero in ritardo.", "Ho davvero finito.", "Sa davvero nuotare."] }, pl: { examples: ["Ona rzeczywiście jest spóźniona.", "Naprawdę skończyłem.", "On naprawdę umie pływać."] }, tr: { examples: ["O gerçekten geç kaldı.", "Gerçekten bitirdim.", "O gerçekten yüzebiliyor."] }, id: { examples: ["Dia memang terlambat.", "Saya memang sudah selesai.", "Dia memang bisa berenang."] }, vi: { examples: ["Cô ấy đúng là đến muộn.", "Tôi đã xong thật rồi.", "Anh ấy biết bơi thật."] } }
          - type: rule
            level: B2
            text: { en: ["A negative or a question has ", { term: do }, " already; the stress on ", { term: do }, " gives the emphasis."], uk: ["У запереченні або питанні ", { term: "do" }, " уже є; наголос на ", { term: "do" }, " виражає підсилення."], es: ["Una negación o una pregunta ya lleva ", { term: "do" }, "; el acento en ", { term: "do" }, " da el énfasis."], pt: ["Uma negação ou uma pergunta já tem ", { term: "do" }, "; o acento em ", { term: "do" }, " dá a ênfase."], fr: ["Une négation ou une question contient déjà ", { term: "do" }, " ; l’accent sur ", { term: "do" }, " donne l’insistance."], de: ["Eine Verneinung oder eine Frage hat schon ", { term: "do" }, "; die Betonung auf ", { term: "do" }, " gibt den Nachdruck."], it: ["Una negazione o una domanda ha già ", { term: "do" }, "; l'accento su ", { term: "do" }, " dà l'enfasi."], pl: ["Przeczenie lub pytanie ma już ", { term: "do" }, "; akcent na ", { term: "do" }, " daje emfazę."], tr: ["Olumsuz cümlede ya da soruda ", { term: "do" }, " zaten vardır; ", { term: "do" }, " üzerindeki vurgu pekiştirmeyi sağlar."], id: ["Kalimat negatif atau pertanyaan sudah memuat ", { term: "do" }, "; tekanan pada ", { term: "do" }, " memberi penekanan."], vi: ["Câu phủ định hoặc câu hỏi đã có sẵn ", { term: "do" }, "; trọng âm đặt trên ", { term: "do" }, " tạo ra sự nhấn mạnh."] }
            ex: ["I ", { stress: did }, "n't take it."]
            tr: { uk: "Я його точно не брав.", es: "Yo no lo tomé.", pt: "Eu não peguei isso.", fr: "Je ne l’ai vraiment pas pris.", de: "Ich habe es wirklich nicht genommen.", it: "Non l'ho proprio preso.", pl: "Ja tego nie wziąłem.", tr: "Onu ben almadım.", id: "Saya benar-benar tidak mengambilnya.", vi: "Tôi đâu có lấy nó." }

