title: { en: Emphasis and Cleft Sentences, uk: "Виділення та виділювальні конструкції", es: "Énfasis y oraciones hendidas", pt: "Ênfase e frases clivadas", fr: "Mise en relief et phrases clivées", de: "Hervorhebung und Spaltsätze", it: "Enfasi e frasi scisse", pl: "Uwypuklanie i zdania rozszczepione", tr: "Vurgu ve yarık cümleler", id: "Penekanan dan kalimat belah", vi: "Nhấn mạnh và câu chẻ" }
summary:
  lead:
    en: ["Emphatic ", { term: do }, ", it-clefts and wh-clefts put one part of a sentence in focus."]
    uk: ["Підсильне ", { term: "do" }, ", it-конструкції та wh-конструкції ставлять одну частину речення у фокус."]
    es: ["El ", { term: "do" }, " enfático, las hendidas con it y las seudohendidas con wh- ponen en foco una parte de la oración."]
    pt: ["O ", { term: "do" }, " enfático, as clivadas com it e as pseudoclivadas com wh- põem em foco uma parte da frase."]
    fr: ["Le ", { term: "do" }, " emphatique, les clivées en it et les pseudo-clivées en wh- mettent en relief une partie de la phrase."]
    de: ["Das betonte ", { term: "do" }, ", it-Spaltsätze und wh-Spaltsätze rücken einen Satzteil in den Fokus."]
    it: ["Il ", { term: "do" }, " enfatico, le scisse con it e le pseudoscisse con wh- mettono a fuoco una parte della frase."]
    pl: ["Emfatyczne ", { term: "do" }, " oraz zdania z it i z wh- wyróżniają jedną część zdania."]
    tr: ["Vurgulu ", { term: "do" }, " ile it ve wh- ile kurulan yarık cümleler cümlenin bir bölümünü öne çıkarır."]
    id: ["Penekanan dengan ", { term: "do" }, ", kalimat belah dengan it, dan kalimat belah dengan wh- menyorot satu bagian kalimat."]
    vi: ["Dùng ", { term: "do" }, " nhấn mạnh, câu chẻ với it và câu chẻ với wh- làm nổi bật một phần của câu."]
  rule:
    en: "A cleft puts the focus after be and the rest of the sentence in a clause:"
    uk: "Виділювальна конструкція ставить фокус після be, а решту речення — у підрядне речення:"
    es: "Una hendida pone el foco después de be y el resto de la oración en una subordinada:"
    pt: "Uma clivada põe o foco depois de be e o resto da frase em uma oração:"
    fr: "Une clivée met le focus après be et le reste de la phrase dans une proposition :"
    de: "Ein Spaltsatz setzt den Fokus nach be und den Rest des Satzes in einen Nebensatz:"
    it: "Una scissa mette il focus dopo be e il resto della frase in una proposizione:"
    pl: "Zdanie rozszczepione stawia fokus po be, a resztę zdania w zdaniu podrzędnym:"
    tr: "Yarık cümle odağı be fiilinden sonra, cümlenin geri kalanını ise bir yan cümlede verir:"
    id: "Kalimat belah menaruh fokus setelah be dan sisa kalimat dalam sebuah klausa:"
    vi: "Câu chẻ đặt trọng tâm sau be và phần còn lại của câu trong một mệnh đề:"
  ex: { examples: [[{ target: "It was Tom who" }, " broke the window."], [{ target: "What I need is" }, " a holiday."]] }

