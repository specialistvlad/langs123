        - { level: C1, point: { en: Clause as focus, uk: "Речення як фокус", es: "Una oración como foco", pt: "Oração como foco", fr: "Proposition en focus", de: "Nebensatz als Fokus", it: "Proposizione come focus", pl: "Zdanie jako fokus", tr: "Odak olarak yan cümle", id: "Klausa sebagai fokus", vi: "Mệnh đề làm trọng tâm" }, rule: { en: ["the focus can be a clause: ", { term: only when }, ", ", { term: not until }, ", ", { term: because }], uk: ["фокусом може бути підрядне речення: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], es: ["el foco puede ser una subordinada: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], pt: ["o foco pode ser uma oração: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], fr: ["le focus peut être une proposition : ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], de: ["der Fokus kann ein Nebensatz sein: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], it: ["il focus può essere una proposizione: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], pl: ["fokusem może być zdanie podrzędne: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], tr: ["odak bir yan cümle olabilir: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], id: ["fokus boleh berupa klausa: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }], vi: ["trọng tâm có thể là một mệnh đề: ", { term: "only when" }, ", ", { term: "not until" }, ", ", { term: "because" }] }, ex: [{ target: "It was only when she left that" }, " I realised."], tr: { uk: "Лише тоді, коли вона пішла, я це усвідомив.", es: "Fue solo cuando ella se fue cuando me di cuenta.", pt: "Foi só quando ela foi embora que eu percebi.", fr: "Ce n’est que lorsqu’elle est partie que j’ai compris.", de: "Erst als sie ging, wurde es mir klar.", it: "È stato solo quando se n'è andata che me ne sono reso conto.", pl: "Dopiero gdy odeszła, zdałem sobie z tego sprawę.", tr: "Ancak o gittiğinde fark ettim.", id: "Baru ketika dia pergi, saya menyadarinya.", vi: "Mãi đến khi cô ấy đi, tôi mới nhận ra." } }
        - { level: C1, point: { en: Explanatory cleft, uk: "Пояснювальна конструкція", es: "Hendida explicativa", pt: "Clivada explicativa", fr: "Clivée explicative", de: "Erklärender Spaltsatz", it: "Scissa esplicativa", pl: "Zdanie rozszczepione wyjaśniające", tr: "Açıklayıcı yarık cümle", id: "Kalimat belah penjelas", vi: "Câu chẻ giải thích" }, rule: { en: "rejects one reason and gives the real one", uk: "відкидає одну причину й називає справжню", es: "rechaza una razón y da la verdadera", pt: "rejeita um motivo e dá o verdadeiro", fr: "écarte une raison et donne la vraie", de: "weist einen Grund zurück und nennt den wahren", it: "respinge un motivo e dà quello vero", pl: "odrzuca jeden powód i podaje prawdziwy", tr: "bir nedeni reddeder, gerçek nedeni söyler", id: "menolak satu alasan dan menyebut alasan yang sebenarnya", vi: "bác bỏ một lý do và nêu lý do thật" }, ex: [{ target: "It isn't that" }, " I don't like her; ", { target: "it's that" }, " I'm busy."], tr: { uk: "Річ не в тому, що вона мені не подобається; річ у тому, що я зайнятий.", es: "No es que ella no me guste; es que estoy ocupado.", pt: "Não é que eu não goste dela; é que estou ocupado.", fr: "Ce n’est pas que je ne l’aime pas ; c’est que je suis occupé.", de: "Es liegt nicht daran, dass ich sie nicht mag; es liegt daran, dass ich beschäftigt bin.", it: "Non è che non mi piaccia; è che sono occupato.", pl: "Nie chodzi o to, że jej nie lubię; chodzi o to, że jestem zajęty.", tr: "Ondan hoşlanmadığımdan değil, meşgul olduğumdan.", id: "Bukan karena saya tidak menyukainya, melainkan karena saya sibuk.", vi: "Không phải là tôi không thích cô ấy; chỉ là tôi đang bận." } }
        - { level: C1, point: { en: Answers, uk: "Відповіді", es: "Respuestas", pt: "Respostas", fr: "Réponses", de: "Antworten", it: "Risposte", pl: "Odpowiedzi", tr: "Cevaplar", id: "Jawaban", vi: "Câu trả lời" }, rule: { en: "a cleft answers a wh-question; the main stress falls on the focus", uk: "виділювальна конструкція відповідає на wh-питання; головний наголос падає на фокус", es: "una hendida responde a una pregunta con wh-; el acento principal cae en el foco", pt: "uma clivada responde a uma pergunta com wh-; o acento principal cai no foco", fr: "une clivée répond à une question en wh- ; l’accent principal tombe sur le focus", de: "ein Spaltsatz antwortet auf eine wh-Frage; die Hauptbetonung liegt auf dem Fokus", it: "una scissa risponde a una domanda con wh-; l'accento principale cade sul focus", pl: "zdanie rozszczepione odpowiada na pytanie z wh-; główny akcent pada na fokus", tr: "yarık cümle bir wh- sorusunu yanıtlar; ana vurgu odağa düşer", id: "kalimat belah menjawab pertanyaan wh-; tekanan utama jatuh pada fokus", vi: "câu chẻ trả lời câu hỏi Wh-; trọng âm chính rơi vào trọng tâm" }, ex: { exchange: ["Who broke it?", ["It was ", { stress: Tom }, "."]] }, tr: { uk: "Хто це зламав? — Це зламав Том.", es: "¿Quién lo rompió? — Fue Tom.", pt: "Quem quebrou isso? — Foi o Tom.", fr: "Qui l’a cassé ? — C’est Tom.", de: "Wer hat es kaputt gemacht? — Es war Tom.", it: "Chi l'ha rotto? — È stato Tom.", pl: "Kto to zepsuł? — To był Tom.", tr: "Bunu kim kırdı? — Tom kırdı.", id: "Siapa yang merusaknya? — Itu Tom.", vi: "Ai làm hỏng nó? — Là Tom." } }
        - { level: C2, point: { en: Infinitive focus, uk: "Інфінітив як фокус", es: "Infinitivo como foco", pt: "Infinitivo como foco", fr: "Infinitif en focus", de: "Infinitiv als Fokus", it: "Infinito come focus", pl: "Bezokolicznik jako fokus", tr: "Odak olarak mastar", id: "Infinitif sebagai fokus", vi: "Động từ nguyên mẫu làm trọng tâm" }, rule: { en: ["after a form of ", { term: do }, ", the focus is a bare or to-infinitive"], uk: ["після форми ", { term: "do" }, " фокус — інфінітив без to або з to"], es: ["tras una forma de ", { term: "do" }, ", el foco es un infinitivo sin to o con to"], pt: ["depois de uma forma de ", { term: "do" }, ", o foco é um infinitivo sem to ou com to"], fr: ["après une forme de ", { term: "do" }, ", le focus est un infinitif sans to ou avec to"], de: ["nach einer Form von ", { term: "do" }, " ist der Fokus ein Infinitiv ohne to oder ein to-Infinitiv"], it: ["dopo una forma di ", { term: "do" }, ", il focus è un infinito senza to o con to"], pl: ["po formie ", { term: "do" }, " fokusem jest bezokolicznik bez to lub z to"], tr: [{ term: "do" }, " fiilinin bir biçiminden sonra odak, to’suz mastar ya da to ile mastardır"], id: ["setelah bentuk ", { term: "do" }, ", fokusnya adalah infinitif tanpa to atau dengan to"], vi: ["sau một dạng của ", { term: "do" }, ", trọng tâm là động từ nguyên mẫu không to hoặc có to"] }, ex: [{ target: "All you have to do is" }, " ", { optional: to }, " press the button."], tr: { uk: "Усе, що тобі потрібно зробити, — це натиснути кнопку.", es: "Todo lo que tienes que hacer es presionar el botón.", pt: "Tudo o que você precisa fazer é apertar o botão.", fr: "Tout ce que tu as à faire, c’est d’appuyer sur le bouton.", de: "Alles, was du tun musst, ist, den Knopf zu drücken.", it: "Tutto quello che devi fare è premere il pulsante.", pl: "Wszystko, co musisz zrobić, to nacisnąć przycisk.", tr: "Tek yapman gereken düğmeye basmak.", id: "Yang perlu kamu lakukan hanyalah menekan tombol.", vi: "Việc bạn cần làm chỉ là nhấn nút." } }
        - { level: C2, point: { en: Stance frames, uk: "Формули позиції", es: "Fórmulas de postura", pt: "Fórmulas de posicionamento", fr: "Formules de positionnement", de: "Formeln der Stellungnahme", it: "Formule di presa di posizione", pl: "Formuły stanowiska", tr: "Tutum kalıpları", id: "Ungkapan sikap", vi: "Khung câu nêu quan điểm" }, rule: { en: [{ term: the fact is }, ", ", { term: the thing is }, " and similar frames open a statement"], uk: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " та подібні формули відкривають висловлювання"], es: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " y fórmulas parecidas abren una afirmación"], pt: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " e fórmulas parecidas abrem uma afirmação"], fr: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " et les formules semblables ouvrent une affirmation"], de: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " und ähnliche Formeln leiten eine Aussage ein"], it: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " e formule simili aprono un'affermazione"], pl: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " i podobne formuły otwierają wypowiedź"], tr: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " ve benzer kalıplar bir ifadeyi başlatır"], id: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " dan ungkapan serupa membuka sebuah pernyataan"], vi: [{ term: "the fact is" }, ", ", { term: "the thing is" }, " và các khung câu tương tự mở đầu một phát biểu"] }, ex: [{ target: "The trouble is that" }, " the shop closes at five."], tr: { uk: "Проблема в тому, що крамниця зачиняється о п’ятій.", es: "El problema es que la tienda cierra a las cinco.", pt: "O problema é que a loja fecha às cinco.", fr: "Le problème, c’est que le magasin ferme à cinq heures.", de: "Das Problem ist, dass das Geschäft um fünf schließt.", it: "Il problema è che il negozio chiude alle cinque.", pl: "Kłopot w tym, że sklep zamykają o piątej.", tr: "Sorun şu ki dükkân beşte kapanıyor.", id: "Masalahnya, toko itu tutup pukul lima.", vi: "Vấn đề là cửa hàng đóng cửa lúc năm giờ." } }
        - { level: C2, point: { en: Formal writing, uk: "Офіційний письмовий стиль", es: "Escritura formal", pt: "Escrita formal", fr: "Écrit formel", de: "Formelles Schreiben", it: "Scrittura formale", pl: "Pismo formalne", tr: "Resmî yazı", id: "Tulisan formal", vi: "Văn viết trang trọng" }, rule: { en: "formal clefts point back to a reason or a context", uk: "офіційні виділювальні конструкції відсилають до причини або контексту", es: "las hendidas formales remiten a una razón o a un contexto", pt: "as clivadas formais remetem a um motivo ou a um contexto", fr: "les clivées formelles renvoient à une raison ou à un contexte", de: "formale Spaltsätze verweisen auf einen Grund oder einen Kontext", it: "le scisse formali rimandano a un motivo o a un contesto", pl: "formalne zdania rozszczepione odsyłają do powodu lub kontekstu", tr: "resmî yarık cümleler bir nedene ya da bağlama gönderme yapar", id: "kalimat belah formal merujuk kembali pada alasan atau konteks", vi: "câu chẻ trang trọng nhắc lại một lý do hoặc một bối cảnh" }, ex: [{ target: "It is for this reason that" }, " the committee refused."], tr: { uk: "Саме з цієї причини комітет відмовив.", es: "Es por esta razón por la que el comité se negó.", pt: "É por essa razão que o comitê recusou.", fr: "C’est pour cette raison que le comité a refusé.", de: "Aus genau diesem Grund hat der Ausschuss abgelehnt.", it: "È per questo motivo che il comitato ha rifiutato.", pl: "To właśnie z tego powodu komisja odmówiła.", tr: "Komite işte bu nedenle reddetti.", id: "Karena alasan inilah komite menolak.", vi: "Chính vì lý do này mà ủy ban đã từ chối." } }
        - { level: C2, point: { en: Topic first, uk: "Тема на першому місці", es: "El tema primero", pt: "O tema primeiro", fr: "Le thème en premier", de: "Das Thema zuerst", it: "Il tema per primo", pl: "Temat na początku", tr: "Önce konu", id: "Topik lebih dulu", vi: "Chủ đề đứng trước" }, rule: { en: "the topic comes first, then a clause with its own subject", uk: "спершу йде тема, потім речення з власним підметом", es: "primero va el tema y luego una oración con su propio sujeto", pt: "primeiro vem o tema, depois uma oração com sujeito próprio", fr: "le thème vient d’abord, puis une proposition avec son propre sujet", de: "zuerst steht das Thema, dann ein Satz mit eigenem Subjekt", it: "prima viene il tema, poi una frase con un soggetto proprio", pl: "najpierw stoi temat, potem zdanie z własnym podmiotem", tr: "önce konu gelir, sonra kendi öznesi olan bir cümle", id: "topik datang lebih dulu, lalu klausa dengan subjeknya sendiri", vi: "chủ đề đứng trước, rồi đến một mệnh đề có chủ ngữ riêng" }, ex: [{ target: "As for Tom" }, ", he has gone home."], tr: { uk: "Що стосується Тома, він пішов додому.", es: "En cuanto a Tom, ya se fue a casa.", pt: "Quanto ao Tom, ele foi para casa.", fr: "Quant à Tom, il est rentré chez lui.", de: "Was Tom angeht, der ist nach Hause gegangen.", it: "Quanto a Tom, è andato a casa.", pl: "Jeśli chodzi o Toma, to on poszedł do domu.", tr: "Tom’a gelince, o eve gitti.", id: "Adapun Tom, dia sudah pulang.", vi: "Còn Tom thì anh ấy đã về nhà rồi." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: who }, " or ", { term: that }, " replaces the focus: no second subject or object"], uk: [{ term: "who" }, " або ", { term: "that" }, " заступає фокус: другого підмета чи додатка немає"], es: [{ term: "who" }, " o ", { term: "that" }, " sustituye al foco: no hay un segundo sujeto ni objeto"], pt: [{ term: "who" }, " ou ", { term: "that" }, " substitui o foco: não há segundo sujeito nem objeto"], fr: [{ term: "who" }, " ou ", { term: "that" }, " remplace le focus : pas de second sujet ni de second complément"], de: [{ term: "who" }, " oder ", { term: "that" }, " ersetzt den Fokus: kein zweites Subjekt und kein zweites Objekt"], it: [{ term: "who" }, " o ", { term: "that" }, " sostituisce il focus: niente secondo soggetto né secondo complemento"], pl: [{ term: "who" }, " lub ", { term: "that" }, " zastępuje fokus: nie ma drugiego podmiotu ani dopełnienia"], tr: [{ term: "who" }, " veya ", { term: "that" }, " odağın yerini tutar: ikinci bir özne ya da nesne gelmez"], id: [{ term: "who" }, " atau ", { term: "that" }, " menggantikan fokus: tidak ada subjek atau objek kedua"], vi: [{ term: "who" }, " hoặc ", { term: "that" }, " thay cho trọng tâm: không có chủ ngữ hay tân ngữ thứ hai"] }, ex: ["It was Ana ", { target: "that I met" }, "."], tr: { uk: "Саме Ану я зустрів.", es: "Fue a Ana a quien encontré.", pt: "Foi a Ana que eu encontrei.", fr: "C’est Ana que j’ai rencontrée.", de: "Es war Ana, die ich getroffen habe.", it: "È Ana che ho incontrato.", pl: "To Anę spotkałem.", tr: "Karşılaştığım kişi Ana’ydı.", id: "Analah yang saya temui.", vi: "Chính Ana là người tôi đã gặp." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A cleft sentence puts one part of a clause in focus, after a form of be.", uk: "Виділювальна конструкція ставить одну частину речення у фокус після форми be.", es: "Una hendida pone en foco una parte de la oración, después de una forma de be.", pt: "Uma clivada põe em foco uma parte da oração, depois de uma forma de be.", fr: "Une clivée met en focus une partie de la proposition, après une forme de be.", de: "Ein Spaltsatz rückt einen Teil des Satzes nach einer Form von be in den Fokus.", it: "Una scissa mette a fuoco una parte della frase, dopo una forma di be.", pl: "Zdanie rozszczepione stawia jedną część zdania w fokusie, po formie be.", tr: "Yarık cümle, be fiilinin bir biçiminden sonra cümlenin bir bölümünü odağa alır.", id: "Kalimat belah menaruh satu bagian klausa dalam fokus, setelah bentuk be.", vi: "Câu chẻ đặt một phần của mệnh đề vào trọng tâm, sau một dạng của be." }
            ex: [{ target: "It was the bus that" }, " I missed."]
            tr: { uk: "Саме на автобус я запізнився.", es: "Fue el autobús el que perdí.", pt: "Foi o ônibus que eu perdi.", fr: "C’est le bus que j’ai raté.", de: "Es war der Bus, den ich verpasst habe.", it: "È l'autobus che ho perso.", pl: "To autobus mi uciekł.", tr: "Kaçırdığım şey otobüstü.", id: "Yang saya lewatkan adalah bus.", vi: "Chính chuyến xe buýt là thứ tôi đã lỡ." }
          - type: rule
            level: B2
            text: { en: "The focus carries the new, corrected or contrasting information; the rest of the clause is known.", uk: "Фокус несе нову, виправлену або контрастну інформацію; решта речення вже відома.", es: "El foco lleva la información nueva, corregida o contrastiva; el resto de la oración ya se conoce.", pt: "O foco traz a informação nova, corrigida ou contrastiva; o resto da oração já é conhecido.", fr: "Le focus porte l’information nouvelle, corrigée ou contrastive ; le reste de la proposition est connu.", de: "Der Fokus trägt die neue, korrigierte oder gegensätzliche Information; der Rest des Satzes ist bekannt.", it: "Il focus porta l'informazione nuova, corretta o contrastiva; il resto della frase è già noto.", pl: "Fokus niesie informację nową, poprawioną lub kontrastową; reszta zdania jest znana.", tr: "Odak yeni, düzeltilmiş ya da karşıt bilgiyi taşır; cümlenin geri kalanı bilinen kısımdır.", id: "Fokus membawa informasi baru, yang dikoreksi, atau yang dikontraskan; sisa klausa sudah diketahui.", vi: "Trọng tâm mang thông tin mới, thông tin được sửa hoặc thông tin đối lập; phần còn lại đã biết." }
          - type: rule
            level: B2
            text: { en: ["Emphatic ", { term: do }, " stresses the verb; an it-cleft focuses one element; a wh-cleft leads up to the focus."], uk: ["Підсильне ", { term: "do" }, " підкреслює дієслово; it-конструкція виділяє один елемент; wh-конструкція підводить до фокуса."], es: ["El ", { term: "do" }, " enfático acentúa el verbo; la hendida con it destaca un elemento; la seudohendida con wh- conduce al foco."], pt: ["O ", { term: "do" }, " enfático destaca o verbo; a clivada com it focaliza um elemento; a pseudoclivada com wh- conduz ao foco."], fr: ["Le ", { term: "do" }, " emphatique accentue le verbe ; la clivée en it isole un élément ; la pseudo-clivée en wh- prépare le focus."], de: ["Das betonte ", { term: "do" }, " hebt das Verb hervor; ein it-Spaltsatz fokussiert ein Element; ein wh-Spaltsatz führt zum Fokus hin."], it: ["Il ", { term: "do" }, " enfatico accentua il verbo; la scissa con it isola un elemento; la pseudoscissa con wh- prepara il focus."], pl: ["Emfatyczne ", { term: "do" }, " akcentuje czasownik; zdanie z it wyróżnia jeden element; zdanie z wh- prowadzi do fokusu."], tr: ["Vurgulu ", { term: "do" }, " fiili vurgular; it ile yarık cümle bir ögeyi öne çıkarır; wh- ile yarık cümle odağa hazırlar."], id: ["Penekanan dengan ", { term: "do" }, " menegaskan kata kerja; kalimat belah dengan it menyorot satu unsur; kalimat belah dengan wh- mengarah ke fokus."], vi: ["Dùng ", { term: "do" }, " nhấn mạnh động từ; câu chẻ với it chọn một thành phần; câu chẻ với wh- dẫn tới trọng tâm."] }
          - type: note
            level: B2
            text: { en: ["The plain order of the sentence is in ", { link: Word Order, to: en.sentence-building.word-order }, "."], uk: ["Звичайний порядок слів у реченні: див. ", { link: "Порядок слів", to: "en.sentence-building.word-order" }, "."], es: ["El orden normal de la oración: ver ", { link: "El orden de las palabras", to: "en.sentence-building.word-order" }, "."], pt: ["A ordem normal da frase: veja ", { link: "Ordem das palavras", to: "en.sentence-building.word-order" }, "."], fr: ["L’ordre normal de la phrase : voir ", { link: "Ordre des mots", to: "en.sentence-building.word-order" }, "."], de: ["Die normale Satzstellung: siehe ", { link: "Wortstellung", to: "en.sentence-building.word-order" }, "."], it: ["L'ordine normale della frase: vedi ", { link: "L'ordine delle parole", to: "en.sentence-building.word-order" }, "."], pl: ["Zwykły szyk zdania: zob. ", { link: "Szyk zdania", to: "en.sentence-building.word-order" }, "."], tr: ["Cümlenin olağan sırası için bkz. ", { link: "Sözcük sırası", to: "en.sentence-building.word-order" }, "."], id: ["Urutan biasa dalam kalimat: lihat ", { link: "Urutan kata", to: "en.sentence-building.word-order" }, "."], vi: ["Trật tự thông thường của câu: xem ", { link: "Trật tự từ", to: "en.sentence-building.word-order" }, "."] }

