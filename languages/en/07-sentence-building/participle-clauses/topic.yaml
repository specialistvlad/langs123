        rows:
          - { level: B2, use: { en: "A passive meaning: something was done to the subject", uk: "Пасивне значення: з підметом щось зробили", es: "Sentido pasivo: algo le fue hecho al sujeto", pt: "Sentido passivo: algo foi feito ao sujeito", fr: "Sens passif : quelque chose a été fait au sujet", de: "Passive Bedeutung: dem Subjekt wurde etwas getan", it: "Significato passivo: qualcosa è stato fatto al soggetto", pl: "Znaczenie bierne: podmiot jest odbiorcą czynności", tr: "Edilgen anlam: özneye bir şey yapılmıştır", id: "Makna pasif: sesuatu dilakukan terhadap subjek", vi: "Nghĩa bị động: chủ ngữ chịu tác động của hành động" }, ex: [{ target: "Written in 1990" }, ", the book is still popular."], tr: { uk: "Написана 1990 року, книжка й досі популярна.", es: "Escrito en 1990, el libro sigue siendo popular.", pt: "Escrito em 1990, o livro continua popular.", fr: "Écrit en 1990, le livre reste populaire.", de: "Das 1990 geschriebene Buch ist immer noch beliebt.", it: "Scritto nel 1990, il libro è ancora popolare.", pl: "Napisana w 1990 roku, książka wciąż jest popularna.", tr: "1990’da yazılan kitap hâlâ popüler.", id: "Ditulis pada 1990, buku itu masih populer.", vi: "Được viết năm 1990, cuốn sách vẫn còn được yêu thích." } }
          - { level: B2, use: { en: "A feeling or reaction of the subject", uk: "Почуття або реакція підмета", es: "Un sentimiento o reacción del sujeto", pt: "Um sentimento ou reação do sujeito", fr: "Un sentiment ou une réaction du sujet", de: "Ein Gefühl oder eine Reaktion des Subjekts", it: "Un sentimento o una reazione del soggetto", pl: "Uczucie lub reakcja podmiotu", tr: "Öznenin bir duygusu ya da tepkisi", id: "Perasaan atau reaksi subjek", vi: "Cảm xúc hoặc phản ứng của chủ ngữ" }, ex: [{ target: "Surprised by the news" }, ", she sat down."], tr: { uk: "Здивована новиною, вона сіла.", es: "Sorprendida por la noticia, se sentó.", pt: "Surpresa com a notícia, ela se sentou.", fr: "Surprise par la nouvelle, elle s’est assise.", de: "Von der Nachricht überrascht, setzte sie sich.", it: "Sorpresa dalla notizia, si è seduta.", pl: "Zaskoczona wiadomością, usiadła.", tr: "Haberden şaşırıp oturdu.", id: "Terkejut oleh kabar itu, dia duduk.", vi: "Ngạc nhiên trước tin đó, cô ấy ngồi xuống." } }
          - { level: B2, use: { en: "A state, often with an adjective and its complement", uk: "Стан, часто з прикметником і його доповненням", es: "Un estado, a menudo con un adjetivo y su complemento", pt: "Um estado, muitas vezes com um adjetivo e seu complemento", fr: "Un état, souvent avec un adjectif et son complément", de: "Ein Zustand, oft mit Adjektiv und seiner Ergänzung", it: "Uno stato, spesso con un aggettivo e il suo complemento", pl: "Stan, często z przymiotnikiem i jego dopełnieniem", tr: "Bir durum; çoğunlukla bir sıfat ve tümleciyle", id: "Keadaan, sering dengan kata sifat dan pelengkapnya", vi: "Một trạng thái, thường gồm tính từ và bổ ngữ của nó" }, ex: [{ target: "Tired of waiting" }, ", he left."], tr: { uk: "Утомившись чекати, він пішов.", es: "Cansado de esperar, se fue.", pt: "Cansado de esperar, ele foi embora.", fr: "Fatigué d’attendre, il est parti.", de: "Müde vom Warten, ging er.", it: "Stanco di aspettare, se n'è andato.", pl: "Zmęczony czekaniem, wyszedł.", tr: "Beklemekten bıkıp gitti.", id: "Lelah menunggu, dia pergi.", vi: "Chán chờ đợi, anh ấy bỏ đi." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["The ", { slot: V-ed }, " participle names who feels; the ", { slot: V-ing }, " participle names what causes the feeling."], uk: ["Форма ", { slot: "V-ed" }, " називає того, хто відчуває; форма ", { slot: "V-ing" }, " — те, що викликає почуття."], es: ["El participio ", { slot: "V-ed" }, " nombra a quien siente; el participio ", { slot: "V-ing" }, " nombra lo que causa el sentimiento."], pt: ["O particípio ", { slot: "V-ed" }, " indica quem sente; o particípio ", { slot: "V-ing" }, " indica o que causa o sentimento."], fr: ["Le participe ", { slot: "V-ed" }, " désigne qui ressent ; le participe ", { slot: "V-ing" }, " désigne ce qui cause le sentiment."], de: ["Das Partizip ", { slot: "V-ed" }, " nennt, wer etwas fühlt; das Partizip ", { slot: "V-ing" }, " nennt, was das Gefühl auslöst."], it: ["Il participio ", { slot: "V-ed" }, " indica chi prova il sentimento; il participio ", { slot: "V-ing" }, " indica ciò che lo causa."], pl: ["Imiesłów ", { slot: "V-ed" }, " wskazuje, kto odczuwa; imiesłów ", { slot: "V-ing" }, " wskazuje, co wywołuje to uczucie."], tr: [{ slot: "V-ed" }, " ortacı hissedeni, ", { slot: "V-ing" }, " ortacı hissi uyandıranı bildirir."], id: ["Partisipel ", { slot: "V-ed" }, " menyebut siapa yang merasakan; partisipel ", { slot: "V-ing" }, " menyebut apa yang menyebabkan perasaan itu."], vi: ["Phân từ ", { slot: "V-ed" }, " nói ai là người cảm thấy; phân từ ", { slot: "V-ing" }, " nói điều gì gây ra cảm giác đó."] }

  - title: { en: The subject of the clause, uk: "Підмет зворота", es: "El sujeto de la oración", pt: "O sujeito da oração", fr: "Le sujet de la proposition", de: "Das Subjekt des Satzes", it: "Il soggetto della proposizione", pl: "Podmiot konstrukcji", tr: "Yantümcenin öznesi", id: "Subjek klausa", vi: "Chủ ngữ của mệnh đề" }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, rule: { en: "The doer is the subject of the main clause", uk: "Виконавець дії — підмет головного речення", es: "El agente es el sujeto de la oración principal", pt: "O agente é o sujeito da oração principal", fr: "L’agent est le sujet de la proposition principale", de: "Der Handelnde ist das Subjekt des Hauptsatzes", it: "L'agente è il soggetto della proposizione principale", pl: "Wykonawcą czynności jest podmiot zdania głównego", tr: "Eylemi yapan, ana cümlenin öznesidir", id: "Pelaku adalah subjek klausa utama", vi: "Người thực hiện hành động là chủ ngữ của mệnh đề chính" }, ex: [{ target: "Opening the box" }, ", ", { subj: Maria }, " found a note."], tr: { uk: "Відкривши коробку, Марія знайшла записку.", es: "Al abrir la caja, María encontró una nota.", pt: "Ao abrir a caixa, Maria encontrou um bilhete.", fr: "En ouvrant la boîte, Maria a trouvé un mot.", de: "Als Maria die Schachtel öffnete, fand sie eine Notiz.", it: "Aprendo la scatola, Maria ha trovato un biglietto.", pl: "Otwierając pudełko, Maria znalazła kartkę.", tr: "Kutuyu açarken Maria bir not buldu.", id: "Saat membuka kotak itu, Maria menemukan sebuah catatan.", vi: "Mở chiếc hộp ra, Maria thấy một tờ giấy nhắn." } }
          - { level: B2, rule: { en: "A passive participle describes that subject as the receiver", uk: "Пасивний дієприкметник описує цей підмет як того, на кого спрямована дія", es: "Un participio pasivo describe a ese sujeto como receptor", pt: "Um particípio passivo descreve esse sujeito como receptor", fr: "Un participe passif décrit ce sujet comme celui qui subit l’action", de: "Ein passives Partizip beschreibt dieses Subjekt als Empfänger", it: "Un participio passivo descrive quel soggetto come chi riceve l'azione", pl: "Imiesłów bierny opisuje ten podmiot jako odbiorcę czynności", tr: "Edilgen ortaç, o özneyi eylemden etkilenen olarak tanımlar", id: "Partisipel pasif menggambarkan subjek itu sebagai penerima tindakan", vi: "Phân từ bị động mô tả chủ ngữ đó là đối tượng chịu tác động" }, ex: [{ target: "Found in a drawer" }, ", ", { subj: "the key" }, " looked old."], tr: { uk: "Знайдений у шухляді, ключ виглядав старим.", es: "Encontrada en un cajón, la llave parecía vieja.", pt: "Encontrada em uma gaveta, a chave parecia velha.", fr: "Retrouvée dans un tiroir, la clé semblait vieille.", de: "In einer Schublade gefunden, wirkte der Schlüssel alt.", it: "Trovata in un cassetto, la chiave sembrava vecchia.", pl: "Znaleziony w szufladzie, klucz wyglądał na stary.", tr: "Çekmecede bulunan anahtar eski görünüyordu.", id: "Ditemukan di laci, kunci itu tampak tua.", vi: "Được tìm thấy trong ngăn kéo, chiếc chìa khóa trông đã cũ." } }
          - { level: B2, rule: { en: "Another doer needs a full clause", uk: "Інший виконавець потребує повного речення", es: "Otro agente necesita una oración completa", pt: "Outro agente exige uma oração completa", fr: "Un autre agent demande une proposition complète", de: "Ein anderer Handelnder braucht einen vollständigen Satz", it: "Un altro agente richiede una proposizione completa", pl: "Inny wykonawca wymaga pełnego zdania", tr: "Başka bir yapan için tam cümle gerekir", id: "Pelaku lain memerlukan klausa lengkap", vi: "Người thực hiện khác cần một mệnh đề đầy đủ" }, ex: "When we left the house, it began to rain.", tr: { uk: "Коли ми вийшли з дому, почався дощ.", es: "Cuando salimos de la casa, empezó a llover.", pt: "Quando saímos de casa, começou a chover.", fr: "Quand nous avons quitté la maison, il s’est mis à pleuvoir.", de: "Als wir das Haus verließen, begann es zu regnen.", it: "Quando siamo usciti di casa, ha cominciato a piovere.", pl: "Gdy wyszliśmy z domu, zaczęło padać.", tr: "Evden çıktığımızda yağmur başladı.", id: "Ketika kami meninggalkan rumah, hujan mulai turun.", vi: "Khi chúng tôi rời nhà, trời bắt đầu mưa." } }
          - { level: B2, rule: { en: "Or the doer becomes the main subject", uk: "Або виконавець стає підметом головного речення", es: "O el agente pasa a ser el sujeto principal", pt: "Ou o agente passa a ser o sujeito principal", fr: "Ou l’agent devient le sujet principal", de: "Oder der Handelnde wird zum Hauptsubjekt", it: "Oppure l'agente diventa il soggetto principale", pl: "Albo wykonawca staje się podmiotem głównym", tr: "Ya da yapan, ana özne olur", id: "Atau pelaku menjadi subjek utama", vi: "Hoặc người thực hiện trở thành chủ ngữ chính" }, ex: ["Walking down the road, ", { subj: he }, " was hit by a car."], tr: { uk: "Коли він ішов дорогою, його збила машина.", es: "Mientras caminaba por la calle, lo atropelló un auto.", pt: "Enquanto andava pela rua, ele foi atropelado por um carro.", fr: "Alors qu’il marchait sur la route, il a été renversé par une voiture.", de: "Als er die Straße entlangging, wurde er von einem Auto angefahren.", it: "Mentre camminava per la strada, è stato investito da un'auto.", pl: "Idąc drogą, został potrącony przez samochód.", tr: "Yolda yürürken bir araba tarafından çarpıldı.", id: "Saat berjalan di jalan, dia ditabrak mobil.", vi: "Đang đi trên đường, anh ấy bị ô tô đâm." } }

  - title: { en: Position and punctuation, uk: "Місце й розділові знаки", es: "Posición y puntuación", pt: "Posição e pontuação", fr: "Place et ponctuation", de: "Stellung und Zeichensetzung", it: "Posizione e punteggiatura", pl: "Miejsce i interpunkcja", tr: "Konum ve noktalama", id: "Posisi dan tanda baca", vi: "Vị trí và dấu câu" }
    role: own
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position, uk: "Місце", es: "Posición", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" } }
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, position: { en: "Before the main clause", uk: "Перед головним реченням", es: "Antes de la oración principal", pt: "Antes da oração principal", fr: "Avant la proposition principale", de: "Vor dem Hauptsatz", it: "Prima della proposizione principale", pl: "Przed zdaniem głównym", tr: "Ana cümleden önce", id: "Sebelum klausa utama", vi: "Trước mệnh đề chính" }, rule: { en: "a comma follows the clause", uk: "після звороту ставлять кому", es: "una coma sigue a la oración", pt: "uma vírgula vem depois da oração", fr: "une virgule suit la proposition", de: "nach dem Satz steht ein Komma", it: "una virgola segue la proposizione", pl: "po konstrukcji stawia się przecinek", tr: "yantümceden sonra virgül gelir", id: "koma mengikuti klausa", vi: "dấu phẩy đứng sau mệnh đề" }, ex: [{ target: "Feeling hungry" }, ", we stopped for lunch."], tr: { uk: "Відчуваючи голод, ми зупинилися пообідати.", es: "Con hambre, paramos a almorzar.", pt: "Com fome, paramos para almoçar.", fr: "Ayant faim, nous nous sommes arrêtés pour déjeuner.", de: "Hungrig geworden, hielten wir zum Mittagessen an.", it: "Sentendo fame, ci siamo fermati a pranzo.", pl: "Czując głód, zatrzymaliśmy się na lunch.", tr: "Acıkınca öğle yemeği için durduk.", id: "Merasa lapar, kami berhenti untuk makan siang.", vi: "Thấy đói, chúng tôi dừng lại ăn trưa." } }
          - { level: B2, position: { en: "Inside the main clause", uk: "Усередині головного речення", es: "Dentro de la oración principal", pt: "Dentro da oração principal", fr: "À l’intérieur de la proposition principale", de: "Innerhalb des Hauptsatzes", it: "Dentro la proposizione principale", pl: "Wewnątrz zdania głównego", tr: "Ana cümlenin içinde", id: "Di dalam klausa utama", vi: "Bên trong mệnh đề chính" }, rule: { en: "a comma stands on each side", uk: "кома стоїть з обох боків", es: "una coma a cada lado", pt: "uma vírgula de cada lado", fr: "une virgule de chaque côté", de: "auf jeder Seite steht ein Komma", it: "una virgola su ciascun lato", pl: "przecinek stoi z obu stron", tr: "iki yanda birer virgül bulunur", id: "koma di kedua sisi", vi: "có dấu phẩy ở mỗi bên" }, ex: ["Maria, ", { target: "feeling hungry" }, ", ordered soup."], tr: { uk: "Марія, відчуваючи голод, замовила суп.", es: "María, con hambre, pidió sopa.", pt: "Maria, com fome, pediu sopa.", fr: "Maria, ayant faim, a commandé une soupe.", de: "Maria, hungrig geworden, bestellte Suppe.", it: "Maria, sentendo fame, ha ordinato una zuppa.", pl: "Maria, czując głód, zamówiła zupę.", tr: "Maria, acıktığı için çorba söyledi.", id: "Maria, yang merasa lapar, memesan sup.", vi: "Maria, thấy đói, gọi một bát súp." } }
          - { level: B2, position: { en: "After the main clause, as a separate action or result", uk: "Після головного речення, як окрема дія або наслідок", es: "Después de la oración principal, como acción separada o resultado", pt: "Depois da oração principal, como ação separada ou resultado", fr: "Après la proposition principale, comme action distincte ou résultat", de: "Nach dem Hauptsatz, als eigene Handlung oder Folge", it: "Dopo la proposizione principale, come azione separata o conseguenza", pl: "Po zdaniu głównym, jako osobna czynność lub skutek", tr: "Ana cümleden sonra, ayrı bir eylem ya da sonuç olarak", id: "Setelah klausa utama, sebagai tindakan terpisah atau akibat", vi: "Sau mệnh đề chính, là một hành động riêng hoặc kết quả" }, rule: { en: "a comma comes before the clause", uk: "кома стоїть перед зворотом", es: "una coma va antes de la oración", pt: "uma vírgula vem antes da oração", fr: "une virgule précède la proposition", de: "vor dem Satz steht ein Komma", it: "una virgola precede la proposizione", pl: "przed konstrukcją stawia się przecinek", tr: "yantümceden önce virgül gelir", id: "koma diletakkan sebelum klausa", vi: "dấu phẩy đứng trước mệnh đề" }, ex: ["He dropped the plate, ", { target: breaking }, " it."], tr: { uk: "Він упустив тарілку й розбив її.", es: "Dejó caer el plato y lo rompió.", pt: "Ele deixou o prato cair e o quebrou.", fr: "Il a laissé tomber l’assiette et l’a cassée.", de: "Er ließ den Teller fallen und zerbrach ihn.", it: "Ha fatto cadere il piatto, rompendolo.", pl: "Upuścił talerz i go stłukł.", tr: "Tabağı düşürdü ve kırdı.", id: "Dia menjatuhkan piring itu hingga pecah.", vi: "Anh ấy làm rơi cái đĩa và làm vỡ nó." } }
          - { level: B2, position: { en: "After the main clause, closely linked to its verb", uk: "Після головного речення, тісно пов’язаний з його дієсловом", es: "Después de la oración principal, muy unida a su verbo", pt: "Depois da oração principal, ligada de perto ao verbo", fr: "Après la proposition principale, étroitement liée à son verbe", de: "Nach dem Hauptsatz, eng mit dessen Verb verbunden", it: "Dopo la proposizione principale, strettamente legata al suo verbo", pl: "Po zdaniu głównym, ściśle związana z jego czasownikiem", tr: "Ana cümleden sonra, fiile sıkı bağlı", id: "Setelah klausa utama, erat kaitannya dengan kata kerjanya", vi: "Sau mệnh đề chính, gắn chặt với động từ của nó" }, rule: { en: "no comma", uk: "без коми", es: "sin coma", pt: "sem vírgula", fr: "pas de virgule", de: "kein Komma", it: "nessuna virgola", pl: "bez przecinka", tr: "virgül konmaz", id: "tanpa koma", vi: "không có dấu phẩy" }, ex: ["She spent the evening ", { target: "watching films" }, "."], tr: { uk: "Вона провела вечір за переглядом фільмів.", es: "Pasó la noche viendo películas.", pt: "Ela passou a noite assistindo a filmes.", fr: "Elle a passé la soirée à regarder des films.", de: "Sie verbrachte den Abend damit, Filme zu sehen.", it: "Ha passato la serata guardando film.", pl: "Spędziła wieczór, oglądając filmy.", tr: "Akşamı film izleyerek geçirdi.", id: "Dia menghabiskan malam dengan menonton film.", vi: "Cô ấy dành cả buổi tối để xem phim." } }

  - title: { en: Clauses with their own subject, uk: "Звороти з власним підметом", es: "Oraciones con sujeto propio", pt: "Orações com sujeito próprio", fr: "Propositions à sujet propre", de: "Sätze mit eigenem Subjekt", it: "Proposizioni con soggetto proprio", pl: "Konstrukcje z własnym podmiotem", tr: "Kendi öznesi olan yantümceler", id: "Klausa dengan subjek sendiri", vi: "Mệnh đề có chủ ngữ riêng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, use: { en: [{ term: being }, " after a noun phrase: reason or time"], uk: [{ term: "being" }, " після іменникового словосполучення: причина або час"], es: [{ term: "being" }, " tras un grupo nominal: razón o tiempo"], pt: [{ term: "being" }, " depois de um sintagma nominal: razão ou tempo"], fr: [{ term: "being" }, " après un groupe nominal : raison ou temps"], de: [{ term: "being" }, " nach einer Nominalphrase: Grund oder Zeit"], it: [{ term: "being" }, " dopo un sintagma nominale: causa o tempo"], pl: [{ term: "being" }, " po grupie rzeczownikowej: przyczyna lub czas"], tr: [{ term: "being" }, " bir isim öbeğinden sonra: sebep ya da zaman"], id: [{ term: "being" }, " setelah frasa nomina: alasan atau waktu"], vi: [{ term: "being" }, " sau một cụm danh từ: lý do hoặc thời gian"] }, ex: [{ target: "The weather being fine" }, ", we went out."], tr: { uk: "Оскільки погода була гарна, ми вийшли гуляти.", es: "Como hacía buen tiempo, salimos.", pt: "Como o tempo estava bom, saímos.", fr: "Le temps étant beau, nous sommes sortis.", de: "Da das Wetter schön war, gingen wir hinaus.", it: "Essendo bel tempo, siamo usciti.", pl: "Ponieważ pogoda była ładna, wyszliśmy.", tr: "Hava güzel olduğu için dışarı çıktık.", id: "Karena cuacanya cerah, kami keluar.", vi: "Vì thời tiết đẹp nên chúng tôi ra ngoài." } }
          - { level: C1, use: { en: [{ term: "there being" }, ": reason"], uk: [{ term: "there being" }, ": причина"], es: [{ term: "there being" }, ": razón"], pt: [{ term: "there being" }, ": razão"], fr: [{ term: "there being" }, " : raison"], de: [{ term: "there being" }, ": Grund"], it: [{ term: "there being" }, ": causa"], pl: [{ term: "there being" }, ": przyczyna"], tr: [{ term: "there being" }, ": sebep"], id: [{ term: "there being" }, ": alasan"], vi: [{ term: "there being" }, ": lý do"] }, ex: [{ target: "There being no time left" }, ", we stopped."], tr: { uk: "Оскільки часу не лишилося, ми зупинилися.", es: "Como no quedaba tiempo, nos detuvimos.", pt: "Como não havia mais tempo, paramos.", fr: "Comme il ne restait plus de temps, nous nous sommes arrêtés.", de: "Da keine Zeit mehr blieb, hörten wir auf.", it: "Non essendoci più tempo, ci siamo fermati.", pl: "Ponieważ nie zostało już czasu, przestaliśmy.", tr: "Zaman kalmadığı için durduk.", id: "Karena sudah tidak ada waktu tersisa, kami berhenti.", vi: "Vì không còn thời gian nên chúng tôi dừng lại." } }
          - { level: C1, use: { en: [{ term: "it being" }, " with a day, a time or a condition"], uk: [{ term: "it being" }, " з днем, часом або станом"], es: [{ term: "it being" }, " con un día, una hora o una condición"], pt: [{ term: "it being" }, " com um dia, uma hora ou uma condição"], fr: [{ term: "it being" }, " avec un jour, une heure ou une condition"], de: [{ term: "it being" }, " mit einem Tag, einer Uhrzeit oder einem Zustand"], it: [{ term: "it being" }, " con un giorno, un'ora o una condizione"], pl: [{ term: "it being" }, " z dniem, godziną lub stanem rzeczy"], tr: [{ term: "it being" }, " ile bir gün, saat ya da durum"], id: [{ term: "it being" }, " dengan hari, waktu, atau keadaan"], vi: [{ term: "it being" }, " với một ngày, một giờ hoặc một tình trạng"] }, ex: [{ target: "It being Sunday" }, ", the shops were closed."], tr: { uk: "Оскільки була неділя, магазини були зачинені.", es: "Como era domingo, las tiendas estaban cerradas.", pt: "Como era domingo, as lojas estavam fechadas.", fr: "Comme c’était dimanche, les magasins étaient fermés.", de: "Da Sonntag war, waren die Geschäfte geschlossen.", it: "Essendo domenica, i negozi erano chiusi.", pl: "Ponieważ była niedziela, sklepy były zamknięte.", tr: "Pazar olduğu için dükkânlar kapalıydı.", id: "Karena hari itu Minggu, toko-toko tutup.", vi: "Vì hôm đó là Chủ nhật nên các cửa hàng đóng cửa." } }
          - { level: C1, use: { en: [{ term: having }, " and a past participle after a noun phrase: an earlier action"], uk: [{ term: "having" }, " і 3-тя форма після іменникового словосполучення: раніша дія"], es: [{ term: "having" }, " y participio pasado tras un grupo nominal: una acción anterior"], pt: [{ term: "having" }, " e particípio passado depois de um sintagma nominal: uma ação anterior"], fr: [{ term: "having" }, " et participe passé après un groupe nominal : une action antérieure"], de: [{ term: "having" }, " und Past Participle nach einer Nominalphrase: eine frühere Handlung"], it: [{ term: "having" }, " e participio passato dopo un sintagma nominale: un'azione anteriore"], pl: [{ term: "having" }, " i III forma po grupie rzeczownikowej: czynność wcześniejsza"], tr: [{ term: "having" }, " ve past participle, bir isim öbeğinden sonra: daha önceki eylem"], id: [{ term: "having" }, " dan past participle setelah frasa nomina: tindakan yang lebih dulu"], vi: [{ term: "having" }, " và quá khứ phân từ sau một cụm danh từ: hành động xảy ra trước"] }, ex: [{ target: "The guests having left" }, ", she tidied up."], tr: { uk: "Коли гості пішли, вона прибрала.", es: "Una vez que se fueron los invitados, ordenó.", pt: "Depois que os convidados foram embora, ela arrumou tudo.", fr: "Les invités étant partis, elle a rangé.", de: "Nachdem die Gäste gegangen waren, räumte sie auf.", it: "Andati via gli ospiti, ha rimesso in ordine.", pl: "Gdy goście wyszli, posprzątała.", tr: "Misafirler gidince ortalığı toparladı.", id: "Setelah para tamu pergi, dia merapikan rumah.", vi: "Khách đã về, cô ấy dọn dẹp." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The clause has a subject of its own, so the main clause may have a different one.", uk: "Зворот має власний підмет, тому в головному реченні може бути інший.", es: "La oración tiene sujeto propio, así que la oración principal puede tener otro distinto.", pt: "A oração tem sujeito próprio, por isso a oração principal pode ter outro.", fr: "La proposition a son propre sujet, donc la proposition principale peut en avoir un autre.", de: "Der Satz hat ein eigenes Subjekt, darum kann der Hauptsatz ein anderes haben.", it: "La proposizione ha un soggetto proprio, quindi la proposizione principale può averne uno diverso.", pl: "Konstrukcja ma własny podmiot, więc zdanie główne może mieć inny.", tr: "Yantümcenin kendi öznesi vardır, bu yüzden ana cümlenin öznesi farklı olabilir.", id: "Klausa ini punya subjek sendiri, jadi klausa utama boleh memakai subjek yang berbeda.", vi: "Mệnh đề có chủ ngữ riêng, nên mệnh đề chính có thể có chủ ngữ khác." }
          - type: rule
            level: C1
            text: { en: ["These clauses are formal; speech and plain writing use ", { term: because }, " or ", { term: as }, " instead."], uk: ["Ці звороти офіційні; у розмові й простому письмі вживають ", { term: "because" }, " або ", { term: "as" }, "."], es: ["Estas oraciones son formales; en la conversación y en la escritura sencilla se usa ", { term: "because" }, " o ", { term: "as" }, "."], pt: ["Essas orações são formais; na fala e na escrita simples usam-se ", { term: "because" }, " ou ", { term: "as" }, "."], fr: ["Ces propositions sont soutenues ; à l’oral et dans une écriture simple, on emploie ", { term: "because" }, " ou ", { term: "as" }, "."], de: ["Diese Sätze sind förmlich; in der Rede und in einfachem Schreibstil verwendet man stattdessen ", { term: "because" }, " oder ", { term: "as" }, "."], it: ["Queste proposizioni sono formali; nel parlato e nello scritto semplice si usano ", { term: "because" }, " o ", { term: "as" }, "."], pl: ["Te konstrukcje są formalne; w mowie i prostym piśmie używa się zamiast nich ", { term: "because" }, " lub ", { term: "as" }, "."], tr: ["Bu yantümceler resmîdir; konuşmada ve sade yazıda bunların yerine ", { term: "because" }, " ya da ", { term: "as" }, " kullanılır."], id: ["Klausa ini bersifat formal; dalam percakapan dan tulisan sederhana dipakai ", { term: "because" }, " atau ", { term: "as" }, "."], vi: ["Những mệnh đề này mang tính trang trọng; khi nói và trong văn viết đơn giản người ta dùng ", { term: "because" }, " hoặc ", { term: "as" }, "."] }
            ex: "As the weather was fine, we went out."
            tr: { uk: "Оскільки погода була гарна, ми вийшли гуляти.", es: "Como hacía buen tiempo, salimos.", pt: "Como o tempo estava bom, saímos.", fr: "Comme il faisait beau, nous sommes sortis.", de: "Da das Wetter schön war, gingen wir hinaus.", it: "Siccome il tempo era bello, siamo usciti.", pl: "Ponieważ pogoda była ładna, wyszliśmy.", tr: "Hava güzel olduğu için dışarı çıktık.", id: "Karena cuacanya cerah, kami keluar.", vi: "Vì thời tiết đẹp nên chúng tôi ra ngoài." }

  - title: { en: With and without a noun, uk: "Конструкції з with і without", es: "Construcciones con with y without", pt: "Construções com with e without", fr: "Constructions avec with et without", de: "Konstruktionen mit with und without", it: "Costruzioni con with e without", pl: "Konstrukcje z with i without", tr: "with ve without ile kurulan yapılar", id: "Konstruksi dengan with dan without", vi: "Cấu trúc với with và without" }
    role: own
