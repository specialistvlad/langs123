title: { en: Participle Clauses, uk: "Дієприкметникові звороти", es: "Oraciones de participio", pt: "Orações participiais", fr: "Propositions participiales", de: "Partizipialsätze", it: "Proposizioni participiali", pl: "Konstrukcje imiesłowowe", tr: "Ortaç yantümceleri", id: "Klausa partisipel", vi: "Mệnh đề phân từ" }
summary:
  lead:
    en: ["Participle clauses use ", { term: "-ing" }, ", ", { term: having }, " with a past participle, or a past participle alone, to give time, reason, result, condition and description."]
    uk: ["Дієприкметникові звороти з ", { term: "-ing" }, ", з ", { term: "having" }, " і 3-ю формою дієслова або лише з 3-ю формою виражають час, причину, наслідок, умову й опис."]
    es: ["Las oraciones de participio usan ", { term: "-ing" }, ", ", { term: "having" }, " con participio pasado, o solo el participio pasado, para dar tiempo, razón, resultado, condición y descripción."]
    pt: ["As orações participiais usam ", { term: "-ing" }, ", ", { term: "having" }, " com particípio passado, ou só o particípio passado, para dar tempo, razão, resultado, condição e descrição."]
    fr: ["Les propositions participiales (", { term: "-ing" }, ", ", { term: "having" }, " + participe passé ou participe passé seul) expriment temps, raison, résultat, condition et description."]
    de: ["Partizipialsätze verwenden ", { term: "-ing" }, ", ", { term: "having" }, " mit Past Participle oder nur das Past Participle für Zeit, Grund, Folge, Bedingung und Beschreibung."]
    it: ["Le proposizioni participiali usano ", { term: "-ing" }, ", ", { term: "having" }, " con participio passato, o il solo participio passato, per tempo, causa, conseguenza, condizione e descrizione."]
    pl: ["Konstrukcje imiesłowowe używają ", { term: "-ing" }, ", ", { term: "having" }, " z III formą czasownika lub samej III formy, by wyrazić czas, przyczynę, skutek, warunek i opis."]
    tr: ["Ortaç yantümceleri zaman, sebep, sonuç, koşul ve betimleme için ", { term: "-ing" }, ", ", { term: "having" }, " ile past participle ya da yalnız past participle kullanır."]
    id: ["Klausa partisipel memakai ", { term: "-ing" }, ", ", { term: "having" }, " dengan past participle, atau past participle saja, untuk menyatakan waktu, alasan, akibat, syarat, dan gambaran."]
    vi: ["Mệnh đề phân từ (", { term: "-ing" }, ", ", { term: "having" }, " + quá khứ phân từ, hoặc riêng quá khứ phân từ) nêu thời gian, lý do, kết quả, điều kiện."]
  rule:
    en: "Without a subject of its own, a participle clause takes the subject of the main clause:"
    uk: "Якщо дієприкметниковий зворот не має власного підмета, він бере підмет головного речення:"
    es: "Sin sujeto propio, una oración de participio toma el sujeto de la oración principal:"
    pt: "Sem sujeito próprio, a oração participial assume o sujeito da oração principal:"
    fr: "Sans sujet propre, la proposition participiale prend le sujet de la proposition principale :"
    de: "Ohne eigenes Subjekt übernimmt ein Partizipialsatz das Subjekt des Hauptsatzes:"
    it: "Senza un soggetto proprio, la proposizione participiale prende il soggetto della proposizione principale:"
    pl: "Bez własnego podmiotu konstrukcja imiesłowowa przejmuje podmiot zdania głównego:"
    tr: "Kendi öznesi yoksa ortaç yantümcesi ana cümlenin öznesini alır:"
    id: "Tanpa subjek sendiri, klausa partisipel memakai subjek klausa utama:"
    vi: "Không có chủ ngữ riêng, nó lấy chủ ngữ mệnh đề chính:"
  ex: { examples: [[{ target: "Opening the box" }, ", Maria found a note."], [{ target: "Having finished lunch" }, ", we left."]] }

