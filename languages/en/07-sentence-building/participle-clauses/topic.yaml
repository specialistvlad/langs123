        rows:
          - { level: C1, use: { en: "Condition: a past participle alone", uk: "Умова: лише 3-тя форма дієслова", es: "Condición: un participio pasado solo", pt: "Condição: só um particípio passado", fr: "Condition : un participe passé seul", de: "Bedingung: ein Past Participle allein", it: "Condizione: un participio passato da solo", pl: "Warunek: sama III forma czasownika", tr: "Koşul: tek başına bir past participle", id: "Syarat: past participle saja", vi: "Điều kiện: chỉ riêng quá khứ phân từ" }, ex: [{ target: "Used properly" }, ", the product is safe."], tr: { uk: "Якщо користуватися правильно, виріб безпечний.", es: "Usado correctamente, el producto es seguro.", pt: "Usado corretamente, o produto é seguro.", fr: "Utilisé correctement, le produit est sûr.", de: "Richtig verwendet, ist das Produkt sicher.", it: "Usato correttamente, il prodotto è sicuro.", pl: "Używany prawidłowo, produkt jest bezpieczny.", tr: "Doğru kullanıldığında ürün güvenlidir.", id: "Jika digunakan dengan benar, produk ini aman.", vi: "Nếu dùng đúng cách, sản phẩm này an toàn." } }
          - { level: C1, use: { en: ["Condition: ", { term: provided }, ", ", { term: providing }, ", ", { term: supposing }, " and ", { term: assuming }, " as conjunctions"], uk: ["Умова: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " і ", { term: "assuming" }, " як сполучники"], es: ["Condición: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " y ", { term: "assuming" }, " como conjunciones"], pt: ["Condição: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " e ", { term: "assuming" }, " como conjunções"], fr: ["Condition : ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " et ", { term: "assuming" }, " comme conjonctions"], de: ["Bedingung: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " und ", { term: "assuming" }, " als Konjunktionen"], it: ["Condizione: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " e ", { term: "assuming" }, " come congiunzioni"], pl: ["Warunek: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " i ", { term: "assuming" }, " jako spójniki"], tr: ["Koşul: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " ve ", { term: "assuming" }, " bağlaç olarak"], id: ["Syarat: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " dan ", { term: "assuming" }, " sebagai konjungsi"], vi: ["Điều kiện: ", { term: "provided" }, ", ", { term: "providing" }, ", ", { term: "supposing" }, " và ", { term: "assuming" }, " làm liên từ"] }, ex: { examples: [[{ target: Provided }, " ", { optional: that }, " you arrive early, you will get a seat."], [{ target: Assuming }, " the train is on time, we will arrive at six."]] }, tr: { uk: { examples: ["За умови, що ви прийдете рано, ви отримаєте місце.", "Якщо припустити, що потяг прибуде вчасно, ми приїдемо о шостій."] }, es: { examples: ["Siempre que llegues temprano, conseguirás un asiento.", "Suponiendo que el tren llegue a tiempo, llegaremos a las seis."] }, pt: { examples: ["Desde que você chegue cedo, conseguirá um lugar.", "Supondo que o trem chegue no horário, chegaremos às seis."] }, fr: { examples: ["À condition que vous arriviez tôt, vous aurez une place.", "En supposant que le train soit à l’heure, nous arriverons à six heures."] }, de: { examples: ["Vorausgesetzt, Sie kommen früh, bekommen Sie einen Platz.", "Angenommen, der Zug ist pünktlich, kommen wir um sechs an."] }, it: { examples: ["Purché tu arrivi presto, avrai un posto.", "Supponendo che il treno sia in orario, arriveremo alle sei."] }, pl: { examples: ["Pod warunkiem, że przyjdziesz wcześnie, dostaniesz miejsce.", "Zakładając, że pociąg będzie punktualnie, dojedziemy o szóstej."] }, tr: { examples: ["Erken gelmen şartıyla yer bulursun.", "Trenin zamanında olduğunu varsayarsak saat altıda varırız."] }, id: { examples: ["Asalkan kamu tiba lebih awal, kamu akan mendapat tempat duduk.", "Dengan asumsi kereta tepat waktu, kita akan tiba pukul enam."] }, vi: { examples: ["Miễn là bạn đến sớm, bạn sẽ có chỗ ngồi.", "Giả sử tàu đến đúng giờ, chúng ta sẽ tới nơi lúc sáu giờ."] } } }
          - { level: C1, use: { en: ["Concession: ", { term: although }, " or ", { term: though }, " and a participle"], uk: ["Допуст: ", { term: "although" }, " або ", { term: "though" }, " і дієприкметник"], es: ["Concesión: ", { term: "although" }, " o ", { term: "though" }, " y un participio"], pt: ["Concessão: ", { term: "although" }, " ou ", { term: "though" }, " e um particípio"], fr: ["Concession : ", { term: "although" }, " ou ", { term: "though" }, " et un participe"], de: ["Einräumung: ", { term: "although" }, " oder ", { term: "though" }, " und ein Partizip"], it: ["Concessione: ", { term: "although" }, " o ", { term: "though" }, " e un participio"], pl: ["Ustępstwo: ", { term: "although" }, " lub ", { term: "though" }, " i imiesłów"], tr: ["Ödün: ", { term: "although" }, " veya ", { term: "though" }, " ve bir ortaç"], id: ["Konsesi: ", { term: "although" }, " atau ", { term: "though" }, " dan partisipel"], vi: ["Nhượng bộ: ", { term: "although" }, " hoặc ", { term: "though" }, " và một phân từ"] }, ex: [{ target: "Though warned twice" }, ", he went anyway."], tr: { uk: "Хоча його двічі попередили, він усе одно пішов.", es: "Aunque lo advirtieron dos veces, fue de todos modos.", pt: "Embora avisado duas vezes, ele foi mesmo assim.", fr: "Bien qu’il ait été prévenu deux fois, il y est allé quand même.", de: "Obwohl er zweimal gewarnt worden war, ging er trotzdem.", it: "Pur essendo stato avvertito due volte, è andato lo stesso.", pl: "Choć dwukrotnie ostrzegany, i tak poszedł.", tr: "İki kez uyarılmasına rağmen yine de gitti.", id: "Meskipun sudah diperingatkan dua kali, dia tetap pergi.", vi: "Dù đã được cảnh báo hai lần, anh ấy vẫn đi." } }
          - { level: C1, use: { en: ["A basis for a statement: ", { term: given }, ", ", { term: considering }, ", ", { term: judging by }], uk: ["Підстава для твердження: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], es: ["La base de una afirmación: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], pt: ["A base de uma afirmação: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], fr: ["Le fondement d’une affirmation : ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], de: ["Grundlage einer Aussage: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], it: ["La base di un'affermazione: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], pl: ["Podstawa wypowiedzi: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], tr: ["Bir yargının dayanağı: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], id: ["Dasar suatu pernyataan: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }], vi: ["Cơ sở của một nhận định: ", { term: "given" }, ", ", { term: "considering" }, ", ", { term: "judging by" }] }, ex: { examples: [[{ target: "Given the circumstances" }, ", the result is fair."], [{ target: "Judging by the sky" }, ", it will rain."], [{ target: "Taking everything into account" }, ", we did well."]] }, tr: { uk: { examples: ["Зважаючи на обставини, результат справедливий.", "Судячи з неба, піде дощ.", "Якщо врахувати все, ми впоралися добре."] }, es: { examples: ["Dadas las circunstancias, el resultado es justo.", "A juzgar por el cielo, va a llover.", "Teniendo todo en cuenta, lo hicimos bien."] }, pt: { examples: ["Dadas as circunstâncias, o resultado é justo.", "A julgar pelo céu, vai chover.", "Levando tudo em conta, nos saímos bem."] }, fr: { examples: ["Vu les circonstances, le résultat est juste.", "À en juger par le ciel, il va pleuvoir.", "Tout bien considéré, nous nous en sommes bien sortis."] }, de: { examples: ["Angesichts der Umstände ist das Ergebnis gerecht.", "Dem Himmel nach zu urteilen, wird es regnen.", "Alles in allem haben wir uns gut geschlagen."] }, it: { examples: ["Date le circostanze, il risultato è giusto.", "A giudicare dal cielo, pioverà.", "Tutto considerato, siamo andati bene."] }, pl: { examples: ["Biorąc pod uwagę okoliczności, wynik jest sprawiedliwy.", "Sądząc po niebie, będzie padać.", "Wszystko razem wziąwszy, poszło nam dobrze."] }, tr: { examples: ["Koşullar göz önüne alındığında sonuç adildir.", "Gökyüzüne bakılırsa yağmur yağacak.", "Her şeyi hesaba katarsak iyi iş çıkardık."] }, id: { examples: ["Mengingat keadaannya, hasilnya adil.", "Melihat dari langit, akan turun hujan.", "Dengan memperhitungkan semuanya, kami sudah bekerja dengan baik."] }, vi: { examples: ["Xét theo hoàn cảnh, kết quả là công bằng.", "Nhìn bầu trời thì có vẻ sắp mưa.", "Cân nhắc mọi điều, chúng tôi đã làm tốt."] } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: [{ term: given }, ", ", { term: considering }, " and ", { term: judging by }, " name the speaker's basis, so no matching subject is needed."], uk: [{ term: "given" }, ", ", { term: "considering" }, " і ", { term: "judging by" }, " називають підставу мовця, тому збігу підметів не потрібно."], es: [{ term: "given" }, ", ", { term: "considering" }, " y ", { term: "judging by" }, " expresan la base de lo que dice el hablante, así que no hace falta un sujeto coincidente."], pt: [{ term: "given" }, ", ", { term: "considering" }, " e ", { term: "judging by" }, " indicam a base do que o falante diz, por isso não é preciso um sujeito igual."], fr: [{ term: "given" }, ", ", { term: "considering" }, " et ", { term: "judging by" }, " indiquent le fondement de ce que dit le locuteur, donc aucun sujet commun n’est nécessaire."], de: [{ term: "given" }, ", ", { term: "considering" }, " und ", { term: "judging by" }, " nennen die Grundlage der Aussage des Sprechers, darum braucht es kein übereinstimmendes Subjekt."], it: [{ term: "given" }, ", ", { term: "considering" }, " e ", { term: "judging by" }, " indicano la base di ciò che dice chi parla, quindi non serve un soggetto uguale."], pl: [{ term: "given" }, ", ", { term: "considering" }, " i ", { term: "judging by" }, " wskazują podstawę wypowiedzi mówiącego, więc nie trzeba zgodnego podmiotu."], tr: [{ term: "given" }, ", ", { term: "considering" }, " ve ", { term: "judging by" }, " konuşanın dayanağını bildirir, bu yüzden öznelerin uyuşması gerekmez."], id: [{ term: "given" }, ", ", { term: "considering" }, " dan ", { term: "judging by" }, " menyebut dasar pernyataan pembicara, jadi subjek tidak harus sama."], vi: [{ term: "given" }, ", ", { term: "considering" }, " và ", { term: "judging by" }, " nêu cơ sở nhận định của người nói, nên không cần chủ ngữ trùng khớp."] }

  - title: { en: "Use: result with thereby and thus", uk: "Вживання: наслідок із thereby і thus", es: "Uso: resultado con thereby y thus", pt: "Uso: resultado com thereby e thus", fr: "Emploi : résultat avec thereby et thus", de: "Gebrauch: Folge mit thereby und thus", it: "Uso: conseguenza con thereby e thus", pl: "Użycie: skutek z thereby i thus", tr: "Kullanım: thereby ve thus ile sonuç", id: "Penggunaan: akibat dengan thereby dan thus", vi: "Cách dùng: kết quả với thereby và thus" }
    role: use
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, pattern: { pattern: [thereby, { slot: V-ing }] }, use: { en: "a result, in a formal tone", uk: "наслідок, в офіційному стилі", es: "un resultado, en tono formal", pt: "um resultado, em tom formal", fr: "un résultat, sur un ton soutenu", de: "eine Folge, in förmlichem Ton", it: "una conseguenza, in tono formale", pl: "skutek, w tonie formalnym", tr: "resmî bir tonda sonuç", id: "akibat, dengan nada formal", vi: "một kết quả, giọng trang trọng" }, ex: ["Prices rose sharply, ", { target: "thereby forcing" }, " many shops to close."], tr: { uk: "Ціни різко зросли, через що багато магазинів змушені були закритися.", es: "Los precios subieron bruscamente, lo que obligó a muchas tiendas a cerrar.", pt: "Os preços subiram bruscamente, o que forçou muitas lojas a fechar.", fr: "Les prix ont fortement augmenté, obligeant ainsi de nombreux magasins à fermer.", de: "Die Preise stiegen stark, wodurch viele Geschäfte schließen mussten.", it: "I prezzi sono saliti bruscamente, costringendo così molti negozi a chiudere.", pl: "Ceny gwałtownie wzrosły, co zmusiło wiele sklepów do zamknięcia.", tr: "Fiyatlar keskin biçimde yükseldi ve bu yüzden birçok dükkân kapanmak zorunda kaldı.", id: "Harga naik tajam, sehingga banyak toko terpaksa tutup.", vi: "Giá tăng mạnh, do đó buộc nhiều cửa hàng phải đóng cửa." } }
          - { level: C1, pattern: { pattern: [thus, { slot: V-ing }] }, use: { en: "a result that follows in the argument", uk: "наслідок, що випливає з міркування", es: "un resultado que se sigue del argumento", pt: "um resultado que decorre do argumento", fr: "un résultat qui découle du raisonnement", de: "eine Folge, die sich aus der Argumentation ergibt", it: "una conseguenza che deriva dal ragionamento", pl: "skutek wynikający z toku rozumowania", tr: "akıl yürütmeden çıkan sonuç", id: "akibat yang mengalir dari argumen", vi: "một kết quả rút ra từ lập luận" }, ex: ["She paid early, ", { target: "thus avoiding" }, " the fee."], tr: { uk: "Вона заплатила заздалегідь, уникнувши таким чином комісії.", es: "Pagó antes, evitando así la tarifa.", pt: "Ela pagou antes, evitando assim a taxa.", fr: "Elle a payé d’avance, évitant ainsi les frais.", de: "Sie zahlte früh und vermied so die Gebühr.", it: "Ha pagato in anticipo, evitando così la commissione.", pl: "Zapłaciła wcześniej, unikając w ten sposób opłaty.", tr: "Erken ödedi ve böylece ücretten kaçındı.", id: "Dia membayar lebih awal, sehingga terhindar dari biaya.", vi: "Cô ấy trả tiền sớm, nhờ vậy tránh được khoản phí." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The clause follows a comma and names the effect of the whole main clause.", uk: "Зворот іде після коми й називає наслідок усього головного речення.", es: "La oración va después de una coma y expresa el efecto de toda la oración principal.", pt: "A oração vem depois de uma vírgula e indica o efeito de toda a oração principal.", fr: "La proposition suit une virgule et exprime l’effet de toute la proposition principale.", de: "Der Satz folgt nach einem Komma und nennt die Wirkung des ganzen Hauptsatzes.", it: "La proposizione segue una virgola e indica l'effetto dell'intera proposizione principale.", pl: "Konstrukcja następuje po przecinku i podaje skutek całego zdania głównego.", tr: "Yantümce virgülden sonra gelir ve ana cümlenin tamamının etkisini bildirir.", id: "Klausa ini muncul setelah koma dan menyatakan dampak dari seluruh klausa utama.", vi: "Mệnh đề đứng sau dấu phẩy và nêu tác động của cả mệnh đề chính." }
          - type: note
            level: C1
            text: { en: ["More result linkers are in ", { link: Conjunctions and Linkers, to: en.sentence-building.conjunctions-linkers }, "."], uk: ["Більше слів-зв’язків для наслідку: ", { link: "Сполучники та слова-зв’язки", to: "en.sentence-building.conjunctions-linkers" }, "."], es: ["Más conectores de resultado: ", { link: "Conjunciones y conectores", to: "en.sentence-building.conjunctions-linkers" }, "."], pt: ["Mais conectivos de resultado: ", { link: "Conjunções e conectivos", to: "en.sentence-building.conjunctions-linkers" }, "."], fr: ["Autres connecteurs de résultat : ", { link: "Conjonctions et connecteurs", to: "en.sentence-building.conjunctions-linkers" }, "."], de: ["Weitere Bindewörter der Folge: ", { link: "Konjunktionen und Bindewörter", to: "en.sentence-building.conjunctions-linkers" }, "."], it: ["Altri connettivi di conseguenza: ", { link: "Congiunzioni e connettivi", to: "en.sentence-building.conjunctions-linkers" }, "."], pl: ["Więcej słów łączących wyrażających skutek: ", { link: "Spójniki i słowa łączące", to: "en.sentence-building.conjunctions-linkers" }, "."], tr: ["Sonuç bildiren diğer bağlayıcılar: ", { link: "Bağlaçlar ve bağlayıcılar", to: "en.sentence-building.conjunctions-linkers" }, "."], id: ["Kata penghubung akibat lainnya: ", { link: "Konjungsi dan kata penghubung", to: "en.sentence-building.conjunctions-linkers" }, "."], vi: ["Thêm các từ nối chỉ kết quả: ", { link: "Liên từ và từ nối", to: "en.sentence-building.conjunctions-linkers" }, "."] }

  - title: { en: "Compare: full clause and participle clause", uk: "Порівняння: повне речення й дієприкметниковий зворот", es: "Comparación: oración completa y oración de participio", pt: "Comparação: oração completa e oração participial", fr: "Comparaison : proposition complète et proposition participiale", de: "Vergleich: vollständiger Satz und Partizipialsatz", it: "Confronto: proposizione completa e proposizione participiale", pl: "Porównanie: pełne zdanie i konstrukcja imiesłowowa", tr: "Karşılaştırma: tam cümle ve ortaç yantümcesi", id: "Perbandingan: klausa lengkap dan klausa partisipel", vi: "So sánh: mệnh đề đầy đủ và mệnh đề phân từ" }
    role: compare
