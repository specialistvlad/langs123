      - type: comparison
        columns:
          - { key: row, label: { en: Point, uk: "Аспект", es: "Aspecto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
          - { key: full, label: { en: Full clause, uk: "Повне речення", es: "Oración completa", pt: "Oração completa", fr: "Proposition complète", de: "Vollständiger Satz", it: "Proposizione completa", pl: "Pełne zdanie", tr: "Tam cümle", id: "Klausa lengkap", vi: "Mệnh đề đầy đủ" } }
          - { key: part, label: { en: Participle clause, uk: "Дієприкметниковий зворот", es: "Oración de participio", pt: "Oração participial", fr: "Proposition participiale", de: "Partizipialsatz", it: "Proposizione participiale", pl: "Konstrukcja imiesłowowa", tr: "Ortaç yantümcesi", id: "Klausa partisipel", vi: "Mệnh đề phân từ" } }
        rows:
          - { level: C1, row: { en: Time, uk: "Час", es: "Tiempo", pt: "Tempo", fr: "Temps", de: "Zeit", it: "Tempo", pl: "Czas", tr: "Zaman", id: "Waktu", vi: "Thời gian" }, full: { ex: "As she walked to work, she listened to music.", tr: { uk: "Поки вона йшла на роботу, вона слухала музику.", es: "Mientras caminaba al trabajo, escuchaba música.", pt: "Enquanto caminhava para o trabalho, ela ouvia música.", fr: "Pendant qu’elle allait au travail à pied, elle écoutait de la musique.", de: "Während sie zur Arbeit ging, hörte sie Musik.", it: "Mentre andava al lavoro, ascoltava musica.", pl: "Kiedy szła do pracy, słuchała muzyki.", tr: "İşe yürürken müzik dinliyordu.", id: "Saat berjalan ke tempat kerja, dia mendengarkan musik.", vi: "Khi đi bộ đến chỗ làm, cô ấy nghe nhạc." } }, part: { ex: [{ target: "Walking to work" }, ", she listened to music."], tr: { uk: "Ідучи на роботу, вона слухала музику.", es: "Caminando al trabajo, escuchaba música.", pt: "Caminhando para o trabalho, ela ouvia música.", fr: "En marchant vers son travail, elle écoutait de la musique.", de: "Auf dem Weg zur Arbeit hörte sie Musik.", it: "Camminando verso il lavoro, ascoltava musica.", pl: "Idąc do pracy, słuchała muzyki.", tr: "İşe yürürken müzik dinliyordu.", id: "Berjalan ke tempat kerja, dia mendengarkan musik.", vi: "Đi bộ đến chỗ làm, cô ấy nghe nhạc." } } }
          - { level: C1, row: { en: Reason, uk: "Причина", es: "Razón", pt: "Razão", fr: "Raison", de: "Grund", it: "Causa", pl: "Przyczyna", tr: "Sebep", id: "Alasan", vi: "Lý do" }, full: { ex: "Because he was ill, he stayed at home.", tr: { uk: "Оскільки він захворів, він залишився вдома.", es: "Como estaba enfermo, se quedó en casa.", pt: "Como estava doente, ele ficou em casa.", fr: "Comme il était malade, il est resté chez lui.", de: "Weil er krank war, blieb er zu Hause.", it: "Siccome era malato, è rimasto a casa.", pl: "Ponieważ był chory, został w domu.", tr: "Hasta olduğu için evde kaldı.", id: "Karena sakit, dia tinggal di rumah.", vi: "Vì bị ốm nên anh ấy ở nhà." } }, part: { ex: [{ target: "Being ill" }, ", he stayed at home."], tr: { uk: "Будучи хворим, він залишився вдома.", es: "Estando enfermo, se quedó en casa.", pt: "Estando doente, ele ficou em casa.", fr: "Étant malade, il est resté chez lui.", de: "Krank, blieb er zu Hause.", it: "Essendo malato, è rimasto a casa.", pl: "Będąc chorym, został w domu.", tr: "Hasta olunca evde kaldı.", id: "Karena sakit, dia tinggal di rumah.", vi: "Bị ốm, anh ấy ở nhà." } } }
          - { level: C1, row: { en: Active relative clause, uk: "Означальне речення, активний стан", es: "Oración de relativo activa", pt: "Oração relativa ativa", fr: "Proposition relative active", de: "Aktiver Relativsatz", it: "Proposizione relativa attiva", pl: "Zdanie względne w stronie czynnej", tr: "Etken ilgi cümlesi", id: "Klausa relatif aktif", vi: "Mệnh đề quan hệ chủ động" }, full: { ex: "The woman who is standing by the door is my aunt.", tr: { uk: "Жінка, яка стоїть біля дверей, — моя тітка.", es: "La mujer que está de pie junto a la puerta es mi tía.", pt: "A mulher que está em pé perto da porta é minha tia.", fr: "La femme qui se tient près de la porte est ma tante.", de: "Die Frau, die an der Tür steht, ist meine Tante.", it: "La donna che è in piedi vicino alla porta è mia zia.", pl: "Kobieta, która stoi przy drzwiach, jest moją ciocią.", tr: "Kapının yanında duran kadın teyzem.", id: "Perempuan yang berdiri di dekat pintu itu bibi saya.", vi: "Người phụ nữ đang đứng cạnh cửa là dì của tôi." } }, part: { ex: ["The woman ", { target: "standing by the door" }, " is my aunt."], tr: { uk: "Жінка, що стоїть біля дверей, — моя тітка.", es: "La mujer parada junto a la puerta es mi tía.", pt: "A mulher parada perto da porta é minha tia.", fr: "La femme se tenant près de la porte est ma tante.", de: "Die an der Tür stehende Frau ist meine Tante.", it: "La donna in piedi vicino alla porta è mia zia.", pl: "Kobieta stojąca przy drzwiach jest moją ciocią.", tr: "Kapının yanında duran kadın teyzem.", id: "Perempuan yang berdiri di dekat pintu itu bibi saya.", vi: "Người phụ nữ đứng cạnh cửa là dì của tôi." } } }
          - { level: C1, row: { en: Passive relative clause, uk: "Означальне речення, пасивний стан", es: "Oración de relativo pasiva", pt: "Oração relativa passiva", fr: "Proposition relative passive", de: "Passiver Relativsatz", it: "Proposizione relativa passiva", pl: "Zdanie względne w stronie biernej", tr: "Edilgen ilgi cümlesi", id: "Klausa relatif pasif", vi: "Mệnh đề quan hệ bị động" }, full: { ex: "The report that was written last year is online.", tr: { uk: "Звіт, який було написано торік, є в інтернеті.", es: "El informe que se escribió el año pasado está en línea.", pt: "O relatório que foi escrito no ano passado está on-line.", fr: "Le rapport qui a été rédigé l’an dernier est en ligne.", de: "Der Bericht, der letztes Jahr geschrieben wurde, ist online.", it: "Il rapporto che è stato scritto l'anno scorso è online.", pl: "Raport, który został napisany w zeszłym roku, jest dostępny online.", tr: "Geçen yıl yazılan rapor internette.", id: "Laporan yang ditulis tahun lalu ada di internet.", vi: "Bản báo cáo đã được viết năm ngoái có trên mạng." } }, part: { ex: ["The report ", { target: "written last year" }, " is online."], tr: { uk: "Звіт, написаний торік, є в інтернеті.", es: "El informe escrito el año pasado está en línea.", pt: "O relatório escrito no ano passado está on-line.", fr: "Le rapport rédigé l’an dernier est en ligne.", de: "Der letztes Jahr geschriebene Bericht ist online.", it: "Il rapporto scritto l'anno scorso è online.", pl: "Raport napisany w zeszłym roku jest dostępny online.", tr: "Geçen yıl yazılan rapor internette.", id: "Laporan yang ditulis tahun lalu ada di internet.", vi: "Bản báo cáo viết năm ngoái có trên mạng." } } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A participle clause names no conjunction, so context decides between time, reason and condition.", uk: "У дієприкметниковому звороті немає сполучника, тому між часом, причиною й умовою вирішує контекст.", es: "Una oración de participio no lleva conjunción, así que el contexto decide entre tiempo, razón y condición.", pt: "A oração participial não tem conjunção, então o contexto decide entre tempo, razão e condição.", fr: "Une proposition participiale n’a pas de conjonction, donc le contexte décide entre temps, raison et condition.", de: "Ein Partizipialsatz hat keine Konjunktion, darum entscheidet der Kontext zwischen Zeit, Grund und Bedingung.", it: "La proposizione participiale non ha congiunzione, quindi il contesto decide tra tempo, causa e condizione.", pl: "Konstrukcja imiesłowowa nie ma spójnika, więc o znaczeniu czasu, przyczyny lub warunku decyduje kontekst.", tr: "Ortaç yantümcesinde bağlaç yoktur, bu yüzden zaman, sebep ve koşul arasındaki ayrımı bağlam belirler.", id: "Klausa partisipel tidak memuat konjungsi, jadi konteks yang menentukan antara waktu, alasan, dan syarat.", vi: "Mệnh đề phân từ không có liên từ, nên ngữ cảnh quyết định đó là thời gian, lý do hay điều kiện." }

  - title: { en: "Compare: -ing and having", uk: "Порівняння: -ing і having", es: "Comparación: -ing y having", pt: "Comparação: -ing e having", fr: "Comparaison : -ing et having", de: "Vergleich: -ing und having", it: "Confronto: -ing e having", pl: "Porównanie: -ing i having", tr: "Karşılaştırma: -ing ve having", id: "Perbandingan: -ing dan having", vi: "So sánh: -ing và having" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: row, label: { en: Point, uk: "Аспект", es: "Aspecto", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
          - { key: ing, label: "Opening the door" }
          - { key: perf, label: "Having opened the door" }
        rows:
          - { level: C1, row: { en: Sequence, uk: "Послідовність", es: "Secuencia", pt: "Sequência", fr: "Ordre", de: "Reihenfolge", it: "Sequenza", pl: "Kolejność", tr: "Sıra", id: "Urutan", vi: "Trình tự" }, ing: { en: "the actions overlap or follow at once", uk: "дії збігаються або йдуть одна за одною відразу", es: "las acciones coinciden o se siguen de inmediato", pt: "as ações coincidem ou se seguem de imediato", fr: "les actions se chevauchent ou s’enchaînent aussitôt", de: "die Handlungen überschneiden sich oder folgen sofort aufeinander", it: "le azioni si sovrappongono o si susseguono subito", pl: "czynności nakładają się lub następują od razu po sobie", tr: "eylemler üst üste biner ya da hemen peş peşe gelir", id: "tindakan-tindakan itu tumpang tindih atau langsung berurutan", vi: "các hành động trùng nhau hoặc nối tiếp ngay" }, perf: { en: "the first action is finished before the second", uk: "перша дія завершилася до другої", es: "la primera acción termina antes de la segunda", pt: "a primeira ação termina antes da segunda", fr: "la première action est terminée avant la seconde", de: "die erste Handlung ist vor der zweiten abgeschlossen", it: "la prima azione è conclusa prima della seconda", pl: "pierwsza czynność kończy się przed drugą", tr: "birinci eylem ikincisinden önce tamamlanmıştır", id: "tindakan pertama selesai sebelum yang kedua", vi: "hành động thứ nhất đã xong trước hành động thứ hai" } }
          - { level: C1, row: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" }, ing: { ex: [{ target: "Opening the door" }, ", he saw a light."], tr: { uk: "Відчиняючи двері, він побачив світло.", es: "Al abrir la puerta, vio una luz.", pt: "Ao abrir a porta, ele viu uma luz.", fr: "En ouvrant la porte, il a vu une lumière.", de: "Beim Öffnen der Tür sah er ein Licht.", it: "Aprendo la porta, ha visto una luce.", pl: "Otwierając drzwi, zobaczył światło.", tr: "Kapıyı açarken bir ışık gördü.", id: "Saat membuka pintu, dia melihat cahaya.", vi: "Mở cửa ra, anh ấy thấy một ánh sáng." } }, perf: { ex: [{ target: "Having opened the door" }, ", he stepped inside."], tr: { uk: "Відчинивши двері, він ступив досередини.", es: "Habiendo abierto la puerta, entró.", pt: "Tendo aberto a porta, ele entrou.", fr: "Ayant ouvert la porte, il est entré.", de: "Nachdem er die Tür geöffnet hatte, trat er ein.", it: "Aperta la porta, è entrato.", pl: "Otworzywszy drzwi, wszedł do środka.", tr: "Kapıyı açtıktan sonra içeri girdi.", id: "Setelah membuka pintu, dia melangkah masuk.", vi: "Mở cửa xong, anh ấy bước vào trong." } } }

  - title: { en: Absolute constructions, uk: "Абсолютні конструкції", es: "Construcciones absolutas", pt: "Construções absolutas", fr: "Propositions absolues", de: "Absolute Konstruktionen", it: "Costruzioni assolute", pl: "Konstrukcje absolutne", tr: "Bağımsız yapılar", id: "Konstruksi absolut", vi: "Cụm tuyệt đối" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, use: { en: "A noun and -ing: a condition or circumstance", uk: ["Іменник і ", { term: "-ing" }, ": умова або обставина"], es: ["Un sustantivo y ", { term: "-ing" }, ": una condición o circunstancia"], pt: ["Um substantivo e ", { term: "-ing" }, ": uma condição ou circunstância"], fr: ["Un nom et ", { term: "-ing" }, " : une condition ou une circonstance"], de: ["Ein Nomen und ", { term: "-ing" }, ": eine Bedingung oder ein Umstand"], it: ["Un sostantivo e ", { term: "-ing" }, ": una condizione o una circostanza"], pl: ["Rzeczownik i ", { term: "-ing" }, ": warunek lub okoliczność"], tr: ["Bir isim ve ", { term: "-ing" }, ": koşul ya da durum"], id: ["Kata benda dan ", { term: "-ing" }, ": syarat atau keadaan"], vi: ["Một danh từ và ", { term: "-ing" }, ": điều kiện hoặc hoàn cảnh"] }, ex: { examples: [[{ target: "Weather permitting" }, ", we will eat outside."], [{ target: "Time allowing" }, ", we will visit the castle."]] }, tr: { uk: { examples: ["Якщо погода дозволить, ми обідатимемо надворі.", "Якщо вистачить часу, ми відвідаємо замок."] }, es: { examples: ["Si el clima lo permite, comeremos afuera.", "Si nos da el tiempo, visitaremos el castillo."] }, pt: { examples: ["Se o tempo permitir, vamos comer ao ar livre.", "Se der tempo, vamos visitar o castelo."] }, fr: { examples: ["Si le temps le permet, nous mangerons dehors.", "Si nous en avons le temps, nous visiterons le château."] }, de: { examples: ["Wenn das Wetter es erlaubt, essen wir draußen.", "Wenn die Zeit reicht, besichtigen wir die Burg."] }, it: { examples: ["Tempo permettendo, mangeremo fuori.", "Se avremo tempo, visiteremo il castello."] }, pl: { examples: ["Jeśli pogoda pozwoli, zjemy na dworze.", "Jeśli starczy czasu, zwiedzimy zamek."] }, tr: { examples: ["Hava izin verirse dışarıda yemek yiyeceğiz.", "Zaman yeterse kaleyi gezeceğiz."] }, id: { examples: ["Jika cuaca memungkinkan, kita akan makan di luar.", "Jika waktunya cukup, kita akan mengunjungi kastil."] }, vi: { examples: ["Nếu thời tiết cho phép, chúng ta sẽ ăn ngoài trời.", "Nếu đủ thời gian, chúng ta sẽ thăm lâu đài."] } } }
          - { level: C2, use: { en: "A noun and a past participle: a completed event", uk: "Іменник і 3-тя форма: завершена подія", es: "Un sustantivo y un participio pasado: un hecho terminado", pt: "Um substantivo e um particípio passado: um fato concluído", fr: "Un nom et un participe passé : un événement achevé", de: "Ein Nomen und ein Past Participle: ein abgeschlossenes Ereignis", it: "Un sostantivo e un participio passato: un evento concluso", pl: "Rzeczownik i III forma czasownika: zdarzenie zakończone", tr: "Bir isim ve bir past participle: tamamlanmış bir olay", id: "Kata benda dan past participle: peristiwa yang sudah selesai", vi: "Một danh từ và quá khứ phân từ: một sự việc đã hoàn tất" }, ex: [{ target: "Her work finished" }, ", she left."], tr: { uk: "Закінчивши роботу, вона пішла.", es: "Terminado su trabajo, se fue.", pt: "Terminado o trabalho, ela foi embora.", fr: "Son travail terminé, elle est partie.", de: "Nachdem ihre Arbeit erledigt war, ging sie.", it: "Finito il lavoro, se n'è andata.", pl: "Skończywszy pracę, wyszła.", tr: "İşi bittiğinde gitti.", id: "Setelah pekerjaannya selesai, dia pergi.", vi: "Xong việc, cô ấy ra về." } }
          - { level: C2, use: { en: ["A pronoun and a past participle: ", { term: that done }, ", ", { term: this said }], uk: ["Займенник і 3-тя форма: ", { term: "that done" }, ", ", { term: "this said" }], es: ["Un pronombre y un participio pasado: ", { term: "that done" }, ", ", { term: "this said" }], pt: ["Um pronome e um particípio passado: ", { term: "that done" }, ", ", { term: "this said" }], fr: ["Un pronom et un participe passé : ", { term: "that done" }, ", ", { term: "this said" }], de: ["Ein Pronomen und ein Past Participle: ", { term: "that done" }, ", ", { term: "this said" }], it: ["Un pronome e un participio passato: ", { term: "that done" }, ", ", { term: "this said" }], pl: ["Zaimek i III forma czasownika: ", { term: "that done" }, ", ", { term: "this said" }], tr: ["Bir zamir ve bir past participle: ", { term: "that done" }, ", ", { term: "this said" }], id: ["Kata ganti dan past participle: ", { term: "that done" }, ", ", { term: "this said" }], vi: ["Một đại từ và quá khứ phân từ: ", { term: "that done" }, ", ", { term: "this said" }] }, ex: [{ target: "That done" }, ", we went home."], tr: { uk: "Зробивши це, ми пішли додому.", es: "Hecho eso, nos fuimos a casa.", pt: "Feito isso, fomos para casa.", fr: "Cela fait, nous sommes rentrés.", de: "Danach gingen wir nach Hause.", it: "Fatto ciò, siamo tornati a casa.", pl: "Po tym wszystkim poszliśmy do domu.", tr: "Bu yapılınca eve gittik.", id: "Setelah itu selesai, kami pulang.", vi: "Xong việc đó, chúng tôi về nhà." } }
          - { level: C2, use: { en: "A fixed summing up", uk: "Стале підсумкове формулювання", es: "Un resumen fijo", pt: "Um resumo fixo", fr: "Une formule de bilan figée", de: "Eine feste Zusammenfassung", it: "Un riepilogo fisso", pl: "Stałe podsumowanie", tr: "Kalıplaşmış bir özet", id: "Ungkapan rangkuman yang tetap", vi: "Một cách tóm lược cố định" }, ex: [{ target: "All things considered" }, ", it was a good year."], tr: { uk: "Якщо все зважити, це був добрий рік.", es: "Considerándolo todo, fue un buen año.", pt: "Considerando tudo, foi um bom ano.", fr: "Tout bien considéré, ce fut une bonne année.", de: "Alles in allem war es ein gutes Jahr.", it: "Tutto considerato, è stato un buon anno.", pl: "Wszystko razem wziąwszy, był to dobry rok.", tr: "Her şey hesaba katılırsa iyi bir yıldı.", id: "Secara keseluruhan, itu tahun yang baik.", vi: "Xét tổng thể, đó là một năm tốt đẹp." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "An absolute construction usually opens the sentence and sets the scene for the main clause.", uk: "Абсолютна конструкція зазвичай відкриває речення й задає обставини для головного речення.", es: "Una construcción absoluta suele abrir la oración y plantea el escenario de la oración principal.", pt: "Uma construção absoluta geralmente abre a frase e define o cenário da oração principal.", fr: "Une proposition absolue ouvre en général la phrase et plante le décor de la proposition principale.", de: "Eine absolute Konstruktion steht meist am Satzanfang und gibt den Rahmen für den Hauptsatz vor.", it: "Una costruzione assoluta di solito apre la frase e crea la cornice per la proposizione principale.", pl: "Konstrukcja absolutna zwykle otwiera zdanie i ustala tło dla zdania głównego.", tr: "Bağımsız yapı genellikle cümleyi açar ve ana cümle için ortamı kurar.", id: "Konstruksi absolut biasanya membuka kalimat dan menjadi latar bagi klausa utama.", vi: "Cụm tuyệt đối thường mở đầu câu và dựng bối cảnh cho mệnh đề chính." }
          - type: rule
            level: C2
            text: { en: [{ term: being }, " drops out, so a noun can stand directly before an adjective or adverb."], uk: [{ term: "being" }, " випадає, тому іменник може стояти просто перед прикметником або прислівником."], es: [{ term: "being" }, " se omite, así que un sustantivo puede ir directamente antes de un adjetivo o adverbio."], pt: [{ term: "being" }, " cai, e assim um substantivo pode vir direto antes de um adjetivo ou advérbio."], fr: [{ term: "being" }, " tombe, donc un nom peut se placer directement devant un adjectif ou un adverbe."], de: [{ term: "being" }, " entfällt, darum kann ein Nomen direkt vor einem Adjektiv oder Adverb stehen."], it: [{ term: "being" }, " cade, quindi un sostantivo può stare direttamente prima di un aggettivo o di un avverbio."], pl: [{ term: "being" }, " odpada, więc rzeczownik może stać bezpośrednio przed przymiotnikiem lub przysłówkiem."], tr: [{ term: "being" }, " düşer, bu yüzden isim doğrudan bir sıfatın ya da zarfın önünde durabilir."], id: [{ term: "being" }, " dihilangkan, sehingga kata benda bisa langsung diikuti kata sifat atau kata keterangan."], vi: [{ term: "being" }, " được lược bỏ, nên danh từ có thể đứng thẳng trước tính từ hoặc trạng từ."] }
            ex: ["Dinner ", { optional: being }, " over, they went out."]
            tr: { uk: "Коли вечеря закінчилася, вони вийшли.", es: "Terminada la cena, salieron.", pt: "Terminado o jantar, eles saíram.", fr: "Le dîner terminé, ils sont sortis.", de: "Nachdem das Abendessen vorbei war, gingen sie aus.", it: "Finita la cena, sono usciti.", pl: "Gdy kolacja się skończyła, wyszli.", tr: "Akşam yemeği bitince dışarı çıktılar.", id: "Setelah makan malam selesai, mereka keluar.", vi: "Bữa tối xong, họ ra ngoài." }

  - title: { en: Fixed comment clauses, uk: "Стійкі вставні звороти", es: "Oraciones de comentario fijas", pt: "Orações de comentário fixas", fr: "Incises de commentaire figées", de: "Feste Kommentarsätze", it: "Proposizioni di commento fisse", pl: "Stałe wtrącenia komentujące", tr: "Kalıplaşmış yorum yantümceleri", id: "Klausa komentar tetap", vi: "Mệnh đề bình luận cố định" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Phrase, uk: "Вираз", es: "Expresión", pt: "Expressão", fr: "Expression", de: "Wendung", it: "Espressione", pl: "Wyrażenie", tr: "Kalıp", id: "Ungkapan", vi: "Cụm" } }
          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: Strictly speaking, use: { en: "to be exact", uk: "якщо бути точним", es: "para ser exactos", pt: "para ser exato", fr: "pour être exact", de: "um genau zu sein", it: "per essere precisi", pl: "żeby być dokładnym", tr: "tam olarak söylemek gerekirse", id: "agar tepat", vi: "nói cho chính xác" }, ex: [{ target: "Strictly speaking" }, ", a tomato is a fruit."], tr: { uk: "Власне кажучи, помідор — це фрукт.", es: "Estrictamente hablando, un tomate es una fruta.", pt: "A rigor, o tomate é uma fruta.", fr: "À proprement parler, la tomate est un fruit.", de: "Streng genommen ist eine Tomate eine Frucht.", it: "A rigor di termini, il pomodoro è un frutto.", pl: "Ściśle mówiąc, pomidor jest owocem.", tr: "Kesin konuşmak gerekirse domates bir meyvedir.", id: "Sebenarnya, tomat adalah buah.", vi: "Nói chính xác thì cà chua là một loại quả." } }
          - { level: C2, form: Frankly speaking, use: { en: "to be honest", uk: "якщо чесно", es: "para ser sinceros", pt: "para ser sincero", fr: "pour être franc", de: "um ehrlich zu sein", it: "per essere sinceri", pl: "szczerze mówiąc", tr: "dürüst olmak gerekirse", id: "jujur saja", vi: "nói thật" }, ex: [{ target: "Frankly speaking" }, ", I did not enjoy the film."], tr: { uk: "Якщо чесно, фільм мені не сподобався.", es: "Hablando con franqueza, la película no me gustó.", pt: "Falando francamente, não gostei do filme.", fr: "Franchement, je n’ai pas aimé le film.", de: "Offen gesagt, hat mir der Film nicht gefallen.", it: "Francamente, il film non mi è piaciuto.", pl: "Szczerze mówiąc, film mi się nie podobał.", tr: "Açık konuşmak gerekirse filmi sevmedim.", id: "Terus terang, saya tidak menikmati filmnya.", vi: "Nói thẳng ra, tôi không thích bộ phim này." } }
          - { level: C2, form: Generally speaking, use: { en: "in most cases", uk: "у більшості випадків", es: "en la mayoría de los casos", pt: "na maioria dos casos", fr: "dans la plupart des cas", de: "in den meisten Fällen", it: "nella maggior parte dei casi", pl: "w większości przypadków", tr: "çoğu durumda", id: "dalam sebagian besar kasus", vi: "trong phần lớn trường hợp" }, ex: [{ target: "Generally speaking" }, ", trains here run on time."], tr: { uk: "Загалом кажучи, потяги тут ходять за розкладом.", es: "En general, los trenes aquí son puntuales.", pt: "Em geral, os trens aqui são pontuais.", fr: "En général, les trains ici sont à l’heure.", de: "Im Allgemeinen fahren die Züge hier pünktlich.", it: "In generale, qui i treni sono puntuali.", pl: "Ogólnie mówiąc, pociągi tu jeżdżą punktualnie.", tr: "Genel olarak buradaki trenler zamanında çalışır.", id: "Secara umum, kereta di sini tepat waktu.", vi: "Nói chung, tàu ở đây chạy đúng giờ." } }
          - { level: C2, form: Putting it mildly, use: { en: "the truth is stronger", uk: "правда набагато різкіша", es: "la realidad es mucho más fuerte", pt: "a realidade é bem mais forte", fr: "la réalité est bien plus forte", de: "die Wahrheit ist deutlich stärker", it: "la realtà è molto più forte", pl: "prawda jest znacznie mocniejsza", tr: "gerçek bundan çok daha serttir", id: "kenyataannya jauh lebih keras", vi: "sự thật còn nặng nề hơn nhiều" }, ex: [{ target: "Putting it mildly" }, ", the service was slow."], tr: { uk: "М’яко кажучи, обслуговування було повільним.", es: "Por decirlo suavemente, el servicio fue lento.", pt: "Para dizer o mínimo, o serviço foi lento.", fr: "Au bas mot, le service était lent.", de: "Milde ausgedrückt, war der Service langsam.", it: "A dirla con delicatezza, il servizio è stato lento.", pl: "Łagodnie mówiąc, obsługa była powolna.", tr: "Hafif bir dille söylemek gerekirse servis yavaştı.", id: "Kalau boleh dikatakan halus, pelayanannya lambat.", vi: "Nói nhẹ nhàng thì dịch vụ khá chậm." } }
          - { level: C2, form: Needless to say, use: { en: "it is obvious", uk: "це очевидно", es: "es obvio", pt: "é óbvio", fr: "c’est évident", de: "es ist offensichtlich", it: "è ovvio", pl: "to oczywiste", tr: "belli olan şey", id: "sudah jelas", vi: "điều đó hiển nhiên" }, ex: [{ target: "Needless to say" }, ", we were delighted."], tr: { uk: "Зайве казати, ми були в захваті.", es: "No hace falta decir que estábamos encantados.", pt: "Nem é preciso dizer que ficamos encantados.", fr: "Inutile de dire que nous étions ravis.", de: "Unnötig zu sagen, dass wir begeistert waren.", it: "Inutile dire che eravamo entusiasti.", pl: "Nie trzeba mówić, że byliśmy zachwyceni.", tr: "Söylemeye gerek yok, çok memnun olduk.", id: "Tak perlu dikatakan, kami sangat senang.", vi: "Không cần nói cũng biết, chúng tôi rất vui." } }
          - { level: C2, form: Having said that, use: { en: "despite what I have just said", uk: "попри щойно сказане", es: "a pesar de lo que acabo de decir", pt: "apesar do que acabei de dizer", fr: "malgré ce que je viens de dire", de: "trotz dem, was ich gerade gesagt habe", it: "nonostante quello che ho appena detto", pl: "mimo tego, co przed chwilą powiedziałem", tr: "az önce söylediklerime rağmen", id: "meskipun yang baru saja saya katakan", vi: "bất chấp điều tôi vừa nói" }, ex: ["The hotel is old. ", { target: "Having said that" }, ", it is spotless."], tr: { uk: "Готель старий. Але, з іншого боку, він бездоганно чистий.", es: "El hotel es viejo. Dicho esto, está impecable.", pt: "O hotel é antigo. Dito isso, está impecável.", fr: "L’hôtel est vieux. Cela dit, il est impeccable.", de: "Das Hotel ist alt. Trotzdem ist es makellos sauber.", it: "L'albergo è vecchio. Detto questo, è impeccabile.", pl: "Hotel jest stary. Mimo to jest nieskazitelnie czysty.", tr: "Otel eski. Bununla birlikte tertemiz.", id: "Hotel itu tua. Meski begitu, hotel itu sangat bersih.", vi: "Khách sạn đã cũ. Tuy vậy, nó rất sạch sẽ." } }
          - { level: C2, form: Stated simply, use: { en: "in simple terms", uk: "простими словами", es: "en términos sencillos", pt: "em termos simples", fr: "en termes simples", de: "einfach gesagt", it: "in parole semplici", pl: "prostymi słowy", tr: "basit bir dille", id: "dengan kata sederhana", vi: "nói đơn giản" }, ex: [{ target: "Stated simply" }, ", the plan failed."], tr: { uk: "Простіше кажучи, план провалився.", es: "Dicho de forma sencilla, el plan fracasó.", pt: "Dito de forma simples, o plano fracassou.", fr: "En termes simples, le plan a échoué.", de: "Einfach gesagt, ist der Plan gescheitert.", it: "In parole semplici, il piano è fallito.", pl: "Mówiąc prosto, plan się nie powiódł.", tr: "Basitçe söylemek gerekirse plan başarısız oldu.", id: "Sederhananya, rencana itu gagal.", vi: "Nói đơn giản, kế hoạch đã thất bại." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A comment clause is set off by commas and can open or interrupt the sentence.", uk: "Вставний зворот виділяють комами; він може відкривати речення або переривати його.", es: "Una oración de comentario va entre comas y puede abrir la oración o interrumpirla.", pt: "A oração de comentário vem entre vírgulas e pode abrir a frase ou interrompê-la.", fr: "Une incise de commentaire est encadrée de virgules et peut ouvrir la phrase ou l’interrompre.", de: "Ein Kommentarsatz wird durch Kommas abgetrennt und kann den Satz eröffnen oder unterbrechen.", it: "La proposizione di commento è isolata da virgole e può aprire la frase o interromperla.", pl: "Wtrącenie komentujące oddziela się przecinkami; może otwierać zdanie lub je przerywać.", tr: "Yorum yantümcesi virgülle ayrılır ve cümleyi açabilir ya da araya girebilir.", id: "Klausa komentar dipisahkan koma dan dapat membuka atau menyela kalimat.", vi: "Mệnh đề bình luận được tách bằng dấu phẩy và có thể mở đầu hoặc chen vào giữa câu." }
            ex: ["Trains here are, ", { target: "generally speaking" }, ", on time."]
            tr: { uk: "Потяги тут, загалом кажучи, ходять за розкладом.", es: "Los trenes aquí son, en general, puntuales.", pt: "Os trens aqui são, em geral, pontuais.", fr: "Les trains ici sont, en général, à l’heure.", de: "Die Züge hier sind im Allgemeinen pünktlich.", it: "I treni qui sono, in generale, puntuali.", pl: "Pociągi są tu, ogólnie mówiąc, punktualne.", tr: "Buradaki trenler, genel olarak, zamanındadır.", id: "Kereta di sini, secara umum, tepat waktu.", vi: "Tàu ở đây, nói chung, chạy đúng giờ." }

  - title: { en: Participles after nouns and in chains, uk: "Дієприкметники після іменників і ланцюжки дієприкметників", es: "Participios tras sustantivos y en cadena", pt: "Particípios depois de substantivos e em cadeia", fr: "Participes après un nom et en série", de: "Partizipien nach Nomen und in Ketten", it: "Participi dopo i sostantivi e in serie", pl: "Imiesłowy po rzeczownikach i w ciągach", tr: "İsimlerden sonra ve zincir hâlinde ortaçlar", id: "Partisipel setelah kata benda dan dalam rangkaian", vi: "Phân từ sau danh từ và trong chuỗi" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, use: { en: "A past participle after a noun: a shortened passive relative clause", uk: "3-тя форма після іменника: скорочене пасивне означальне речення", es: "Un participio pasado tras un sustantivo: una oración de relativo pasiva abreviada", pt: "Um particípio passado depois de um substantivo: uma oração relativa passiva reduzida", fr: "Un participe passé après un nom : une relative passive abrégée", de: "Ein Past Participle nach einem Nomen: ein verkürzter passiver Relativsatz", it: "Un participio passato dopo un sostantivo: una proposizione relativa passiva ridotta", pl: "III forma czasownika po rzeczowniku: skrócone zdanie względne w stronie biernej", tr: "İsimden sonra gelen bir past participle: kısaltılmış edilgen ilgi cümlesi", id: "Past participle setelah kata benda: klausa relatif pasif yang diringkas", vi: "Quá khứ phân từ sau danh từ: mệnh đề quan hệ bị động rút gọn" }, ex: ["The report ", { target: "written by two experts" }, " is online."], tr: { uk: "Звіт, написаний двома експертами, є в інтернеті.", es: "El informe escrito por dos expertos está en línea.", pt: "O relatório escrito por dois especialistas está on-line.", fr: "Le rapport rédigé par deux experts est en ligne.", de: "Der von zwei Experten verfasste Bericht ist online.", it: "Il rapporto scritto da due esperti è online.", pl: "Raport napisany przez dwóch ekspertów jest dostępny online.", tr: "İki uzman tarafından yazılan rapor internette.", id: "Laporan yang ditulis oleh dua ahli ada di internet.", vi: "Bản báo cáo do hai chuyên gia viết có trên mạng." } }
          - { level: C2, use: { en: "An -ing form after a noun: a shortened active relative clause", uk: ["Форма ", { term: "-ing" }, " після іменника: скорочене активне означальне речення"], es: ["Una forma en ", { term: "-ing" }, " tras un sustantivo: una oración de relativo activa abreviada"], pt: ["Uma forma com ", { term: "-ing" }, " depois de um substantivo: uma oração relativa ativa reduzida"], fr: ["Une forme en ", { term: "-ing" }, " après un nom : une relative active abrégée"], de: ["Eine ", { term: "-ing" }, "-Form nach einem Nomen: ein verkürzter aktiver Relativsatz"], it: ["Una forma in ", { term: "-ing" }, " dopo un sostantivo: una proposizione relativa attiva ridotta"], pl: ["Forma ", { term: "-ing" }, " po rzeczowniku: skrócone zdanie względne w stronie czynnej"], tr: [{ term: "-ing" }, " biçimi, isimden sonra: kısaltılmış etken ilgi cümlesi"], id: ["Bentuk ", { term: "-ing" }, " setelah kata benda: klausa relatif aktif yang diringkas"], vi: ["Dạng ", { term: "-ing" }, " sau danh từ: mệnh đề quan hệ chủ động rút gọn"] }, ex: ["Residents ", { target: "living near the airport" }, " complain of noise."], tr: { uk: "Мешканці, які живуть біля аеропорту, скаржаться на шум.", es: "Los residentes que viven cerca del aeropuerto se quejan del ruido.", pt: "Os moradores que vivem perto do aeroporto reclamam do barulho.", fr: "Les habitants vivant près de l’aéroport se plaignent du bruit.", de: "Anwohner, die in der Nähe des Flughafens leben, beklagen sich über Lärm.", it: "I residenti che vivono vicino all'aeroporto si lamentano del rumore.", pl: "Mieszkańcy mieszkający w pobliżu lotniska skarżą się na hałas.", tr: "Havalimanı yakınında yaşayan sakinler gürültüden şikâyet ediyor.", id: "Warga yang tinggal dekat bandara mengeluh tentang kebisingan.", vi: "Cư dân sống gần sân bay phàn nàn về tiếng ồn." } }
          - { level: C2, use: { en: "A chain: each participle adds detail to the one before", uk: "Ланцюжок: кожен дієприкметник додає подробиці до попереднього", es: "Una cadena: cada participio añade detalles al anterior", pt: "Uma cadeia: cada particípio acrescenta detalhes ao anterior", fr: "Une série : chaque participe ajoute un détail au précédent", de: "Eine Kette: Jedes Partizip fügt dem vorigen Einzelheiten hinzu", it: "Una serie: ogni participio aggiunge dettagli al precedente", pl: "Ciąg: każdy imiesłów dodaje szczegółów do poprzedniego", tr: "Zincir: her ortaç bir öncekine ayrıntı ekler", id: "Rangkaian: setiap partisipel menambah rincian pada yang sebelumnya", vi: "Chuỗi: mỗi phân từ bổ sung chi tiết cho phân từ trước nó" }, ex: ["The problem ", { target: "posed by rising costs" }, ", ", { target: "compounded by falling demand" }, ", forced the firm to close."], tr: { uk: "Проблема, спричинена зростанням витрат і загострена падінням попиту, змусила фірму закритися.", es: "El problema planteado por el aumento de los costos, agravado por la caída de la demanda, obligó a la empresa a cerrar.", pt: "O problema causado pelo aumento dos custos, agravado pela queda na demanda, obrigou a empresa a fechar.", fr: "Le problème posé par la hausse des coûts, aggravé par la baisse de la demande, a forcé l’entreprise à fermer.", de: "Das durch steigende Kosten verursachte und durch sinkende Nachfrage verschärfte Problem zwang die Firma zur Schließung.", it: "Il problema posto dall'aumento dei costi, aggravato dal calo della domanda, ha costretto l'azienda a chiudere.", pl: "Problem wywołany rosnącymi kosztami i pogłębiony spadkiem popytu zmusił firmę do zamknięcia.", tr: "Artan maliyetlerin yarattığı ve düşen talebin daha da ağırlaştırdığı sorun, şirketi kapanmaya zorladı.", id: "Masalah yang ditimbulkan oleh kenaikan biaya, dan diperparah oleh turunnya permintaan, memaksa perusahaan itu tutup.", vi: "Vấn đề do chi phí tăng gây ra, lại bị làm trầm trọng thêm bởi nhu cầu giảm, đã buộc công ty phải đóng cửa." } }
          - { level: C2, use: { en: ["Several clauses joined by ", { term: and }, " before the main clause"], uk: ["Кілька зворотів, з’єднаних сполучником ", { term: "and" }, ", перед головним реченням"], es: ["Varias oraciones unidas por ", { term: "and" }, " antes de la oración principal"], pt: ["Várias orações unidas por ", { term: "and" }, " antes da oração principal"], fr: ["Plusieurs propositions reliées par ", { term: "and" }, " avant la proposition principale"], de: ["Mehrere durch ", { term: "and" }, " verbundene Sätze vor dem Hauptsatz"], it: ["Più proposizioni unite da ", { term: "and" }, " prima della proposizione principale"], pl: ["Kilka konstrukcji połączonych spójnikiem ", { term: "and" }, " przed zdaniem głównym"], tr: ["Ana cümleden önce ", { term: "and" }, " ile bağlanan birkaç yantümce"], id: ["Beberapa klausa yang dihubungkan ", { term: "and" }, " sebelum klausa utama"], vi: ["Nhiều mệnh đề nối bằng ", { term: "and" }, " đứng trước mệnh đề chính"] }, ex: [{ target: "Built in 1850 and restored in 1990" }, ", the house is now a museum."], tr: { uk: "Збудований 1850 року й відреставрований 1990-го, будинок тепер є музеєм.", es: "Construida en 1850 y restaurada en 1990, la casa es ahora un museo.", pt: "Construída em 1850 e restaurada em 1990, a casa é hoje um museu.", fr: "Construite en 1850 et restaurée en 1990, la maison est aujourd’hui un musée.", de: "1850 erbaut und 1990 restauriert, ist das Haus heute ein Museum.", it: "Costruita nel 1850 e restaurata nel 1990, la casa è oggi un museo.", pl: "Zbudowany w 1850 roku i odnowiony w 1990, dom jest dziś muzeum.", tr: "1850’de inşa edilip 1990’da restore edilen ev artık bir müze.", id: "Dibangun pada 1850 dan dipugar pada 1990, rumah itu kini menjadi museum.", vi: "Được xây năm 1850 và trùng tu năm 1990, ngôi nhà nay là một bảo tàng." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "Each participle in a chain describes the noun or clause just before it.", uk: "Кожен дієприкметник у ланцюжку описує іменник або речення, що стоїть безпосередньо перед ним.", es: "Cada participio de una cadena describe el sustantivo o la oración que tiene justo antes.", pt: "Cada particípio de uma cadeia descreve o substantivo ou a oração que vem logo antes dele.", fr: "Chaque participe d’une série décrit le nom ou la proposition qui le précède directement.", de: "Jedes Partizip in einer Kette beschreibt das Nomen oder den Satz unmittelbar davor.", it: "Ogni participio di una serie descrive il sostantivo o la proposizione che lo precede subito.", pl: "Każdy imiesłów w ciągu opisuje rzeczownik lub zdanie stojące tuż przed nim.", tr: "Zincirdeki her ortaç, hemen önündeki ismi ya da yantümceyi tanımlar.", id: "Setiap partisipel dalam rangkaian menjelaskan kata benda atau klausa tepat sebelumnya.", vi: "Mỗi phân từ trong chuỗi mô tả danh từ hoặc mệnh đề đứng ngay trước nó." }
          - type: rule
            level: C2
            text: { en: "News and academic writing pack information this way; speech uses separate sentences.", uk: "Новини й академічне письмо ущільнюють інформацію саме так; в усному мовленні вживають окремі речення.", es: "Las noticias y la escritura académica condensan la información así; en la conversación se usan oraciones separadas.", pt: "Notícias e textos acadêmicos condensam a informação assim; na fala usam-se frases separadas.", fr: "La presse et l’écrit universitaire condensent l’information ainsi ; à l’oral, on utilise des phrases séparées.", de: "Nachrichten und wissenschaftliche Texte verdichten Informationen so; gesprochen verwendet man getrennte Sätze.", it: "Notizie e scrittura accademica condensano le informazioni così; nel parlato si usano frasi separate.", pl: "Wiadomości i teksty naukowe zagęszczają informacje w ten sposób; w mowie używa się osobnych zdań.", tr: "Haberler ve akademik yazı bilgiyi bu şekilde yoğunlaştırır; konuşmada ayrı cümleler kullanılır.", id: "Berita dan tulisan akademik memadatkan informasi dengan cara ini; dalam percakapan dipakai kalimat terpisah.", vi: "Tin tức và văn học thuật nén thông tin theo cách này; khi nói người ta dùng các câu riêng." }
          - type: note
            level: C2
            text: { en: ["Relative clauses shortened to a participle are also in ", { link: Relative Clauses, to: en.sentence-building.relative-clauses }, "."], uk: ["Означальні речення, скорочені до дієприкметника, розглянуто також у темі ", { link: "Означальні підрядні речення", to: "en.sentence-building.relative-clauses" }, "."], es: ["Las oraciones de relativo reducidas a un participio también están en ", { link: "Oraciones de relativo", to: "en.sentence-building.relative-clauses" }, "."], pt: ["As orações relativas reduzidas a um particípio também estão em ", { link: "Orações relativas", to: "en.sentence-building.relative-clauses" }, "."], fr: ["Les relatives réduites à un participe figurent aussi dans ", { link: "Propositions relatives", to: "en.sentence-building.relative-clauses" }, "."], de: ["Auf ein Partizip verkürzte Relativsätze stehen auch in ", { link: "Relativsätze", to: "en.sentence-building.relative-clauses" }, "."], it: ["Le proposizioni relative ridotte a un participio sono trattate anche in ", { link: "Proposizioni relative", to: "en.sentence-building.relative-clauses" }, "."], pl: ["Zdania względne skrócone do imiesłowu omówiono także w temacie ", { link: "Zdania względne", to: "en.sentence-building.relative-clauses" }, "."], tr: ["Ortaca indirgenmiş ilgi cümleleri ", { link: "İlgi cümleleri", to: "en.sentence-building.relative-clauses" }, " konusunda da yer alır."], id: ["Klausa relatif yang diringkas menjadi partisipel juga dibahas di ", { link: "Klausa relatif", to: "en.sentence-building.relative-clauses" }, "."], vi: ["Mệnh đề quan hệ rút gọn thành phân từ cũng có trong ", { link: "Mệnh đề quan hệ", to: "en.sentence-building.relative-clauses" }, "."] }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "Walking down the road, a car hit him.", right: ["Walking down the road, ", { target: "he was hit by a car" }, "."], rule: { en: "the doer of the participle is the subject of the main clause", uk: "виконавець дії зворота — підмет головного речення", es: "el agente del participio es el sujeto de la oración principal", pt: "o agente do particípio é o sujeito da oração principal", fr: "l’agent du participe est le sujet de la proposition principale", de: "der Handelnde des Partizips ist das Subjekt des Hauptsatzes", it: "l'agente del participio è il soggetto della proposizione principale", pl: "wykonawcą czynności wyrażonej imiesłowem jest podmiot zdania głównego", tr: "ortacın öznesi, ana cümlenin öznesidir", id: "pelaku partisipel adalah subjek klausa utama", vi: "người thực hiện hành động của phân từ là chủ ngữ của mệnh đề chính" } }
          - { level: B2, wrong: "Written the letter, she posted it.", right: [{ target: "Having written" }, " the letter, she posted it."], rule: { en: ["an earlier active action takes ", { pattern: [having, { slot: past participle }] }], uk: ["раніша активна дія вимагає ", { pattern: ["having", { slot: "past participle" }] }], es: ["una acción activa anterior lleva ", { pattern: ["having", { slot: "past participle" }] }], pt: ["uma ação ativa anterior leva ", { pattern: ["having", { slot: "past participle" }] }], fr: ["une action active antérieure prend ", { pattern: ["having", { slot: "past participle" }] }], de: ["eine frühere aktive Handlung steht mit ", { pattern: ["having", { slot: "past participle" }] }], it: ["un'azione attiva anteriore prende ", { pattern: ["having", { slot: "past participle" }] }], pl: ["wcześniejsza czynność w stronie czynnej wymaga ", { pattern: ["having", { slot: "past participle" }] }], tr: ["daha önceki etken eylem ", { pattern: ["having", { slot: "past participle" }] }, " alır"], id: ["tindakan aktif yang lebih dulu memakai ", { pattern: ["having", { slot: "past participle" }] }], vi: ["hành động chủ động xảy ra trước dùng ", { pattern: ["having", { slot: "past participle" }] }] } }
          - { level: B2, wrong: "Surprising by the news, she sat down.", right: [{ target: Surprised }, " by the news, she sat down."], rule: { en: ["the person who feels takes ", { slot: V-ed }, ", not ", { slot: V-ing }], uk: ["той, хто відчуває, вимагає ", { slot: "V-ed" }, ", а не ", { slot: "V-ing" }], es: ["quien siente lleva ", { slot: "V-ed" }, ", no ", { slot: "V-ing" }], pt: ["quem sente leva ", { slot: "V-ed" }, ", não ", { slot: "V-ing" }], fr: ["celui qui ressent prend ", { slot: "V-ed" }, ", pas ", { slot: "V-ing" }], de: ["wer fühlt, steht mit ", { slot: "V-ed" }, ", nicht mit ", { slot: "V-ing" }], it: ["chi prova il sentimento prende ", { slot: "V-ed" }, ", non ", { slot: "V-ing" }], pl: ["osoba, która odczuwa, wymaga ", { slot: "V-ed" }, ", a nie ", { slot: "V-ing" }], tr: ["hisseden kişi ", { slot: "V-ed" }, " alır, ", { slot: "V-ing" }, " almaz"], id: ["orang yang merasakan memakai ", { slot: "V-ed" }, ", bukan ", { slot: "V-ing" }], vi: ["người cảm thấy dùng ", { slot: "V-ed" }, ", không dùng ", { slot: "V-ing" }] } }
          - { level: B2, wrong: "After to leave the house, she locked the door.", right: ["After ", { target: leaving }, " the house, she locked the door."], rule: { en: ["a conjunction or preposition takes ", { slot: V-ing }, ", never ", { term: to }, " and the base verb"], uk: ["після сполучника чи прийменника стоїть ", { slot: "V-ing" }, ", ніколи не ", { term: "to" }, " з початковою формою дієслова"], es: ["una conjunción o preposición lleva ", { slot: "V-ing" }, ", nunca ", { term: "to" }, " y la forma base"], pt: ["uma conjunção ou preposição leva ", { slot: "V-ing" }, ", nunca ", { term: "to" }, " e a forma base"], fr: ["une conjonction ou une préposition prend ", { slot: "V-ing" }, ", jamais ", { term: "to" }, " et la base verbale"], de: ["nach einer Konjunktion oder Präposition steht ", { slot: "V-ing" }, ", nie ", { term: "to" }, " und die Grundform"], it: ["una congiunzione o preposizione prende ", { slot: "V-ing" }, ", mai ", { term: "to" }, " e la forma base"], pl: ["po spójniku lub przyimku stoi ", { slot: "V-ing" }, ", nigdy ", { term: "to" }, " i forma podstawowa"], tr: ["bağlaç ya da edattan sonra ", { slot: "V-ing" }, " gelir, asla ", { term: "to" }, " ve yalın fiil gelmez"], id: ["konjungsi atau preposisi diikuti ", { slot: "V-ing" }, ", tidak pernah ", { term: "to" }, " dan kata kerja dasar"], vi: ["sau liên từ hoặc giới từ dùng ", { slot: "V-ing" }, ", không bao giờ dùng ", { term: "to" }, " và động từ nguyên mẫu"] } }
          - { level: C1, wrong: "The weather was fine, we went out.", right: ["The weather ", { target: being }, " fine, we went out."], rule: { en: "a comma cannot join two full clauses; the first takes being", uk: ["кома не може з’єднати два повні речення; перше вимагає ", { term: "being" }], es: ["una coma no puede unir dos oraciones completas; la primera lleva ", { term: "being" }], pt: ["uma vírgula não pode unir duas orações completas; a primeira leva ", { term: "being" }], fr: ["une virgule ne peut pas relier deux propositions complètes ; la première prend ", { term: "being" }], de: ["ein Komma kann zwei vollständige Sätze nicht verbinden; der erste steht mit ", { term: "being" }], it: ["una virgola non può unire due proposizioni complete; la prima prende ", { term: "being" }], pl: ["przecinek nie może łączyć dwóch pełnych zdań; pierwsze wymaga ", { term: "being" }], tr: ["virgül iki tam cümleyi bağlayamaz; birincisi ", { term: "being" }, " alır"], id: ["koma tidak dapat menyambung dua klausa lengkap; yang pertama memakai ", { term: "being" }], vi: ["một dấu phẩy không thể nối hai mệnh đề đầy đủ; mệnh đề đầu dùng ", { term: "being" }] } }
          - { level: C1, wrong: "She sat with her arms crossing.", right: ["She sat with her arms ", { target: crossed }, "."], rule: { en: "a noun that receives the action takes the past participle", uk: "іменник, на який спрямована дія, вимагає 3-ї форми дієслова", es: "un sustantivo que recibe la acción lleva el participio pasado", pt: "um substantivo que recebe a ação leva o particípio passado", fr: "un nom qui subit l’action prend le participe passé", de: "ein Nomen, das die Handlung erfährt, steht mit Past Participle", it: "un sostantivo che subisce l'azione prende il participio passato", pl: "rzeczownik będący odbiorcą czynności wymaga III formy czasownika", tr: "eylemden etkilenen isim past participle alır", id: "kata benda yang menerima tindakan memakai past participle", vi: "danh từ chịu hành động dùng quá khứ phân từ" } }
          - { level: C2, wrong: "Weather permitted, we will eat outside.", right: [{ target: "Weather permitting" }, ", we will eat outside."], rule: { en: "the fixed phrase keeps the -ing form", uk: ["стале сполучення зберігає форму ", { term: "-ing" }], es: ["la expresión fija conserva la forma en ", { term: "-ing" }], pt: ["a expressão fixa mantém a forma com ", { term: "-ing" }], fr: ["l’expression figée garde la forme en ", { term: "-ing" }], de: ["die feste Wendung behält die ", { term: "-ing" }, "-Form"], it: ["l'espressione fissa mantiene la forma in ", { term: "-ing" }], pl: ["stałe wyrażenie zachowuje formę ", { term: "-ing" }], tr: ["kalıplaşmış ifade ", { term: "-ing" }, " biçimini korur"], id: ["ungkapan tetap mempertahankan bentuk ", { term: "-ing" }], vi: ["cụm cố định giữ nguyên dạng ", { term: "-ing" }] } }
          - { level: C2, wrong: "Strictly spoken, a tomato is a fruit.", right: [{ target: "Strictly speaking" }, ", a tomato is a fruit."], rule: { en: "a comment clause keeps its fixed form", uk: "вставний зворот зберігає свою стійку форму", es: "una oración de comentario conserva su forma fija", pt: "uma oração de comentário mantém sua forma fixa", fr: "une incise de commentaire garde sa forme figée", de: "ein Kommentarsatz behält seine feste Form", it: "una proposizione di commento mantiene la sua forma fissa", pl: "wtrącenie komentujące zachowuje stałą formę", tr: "yorum yantümcesi kalıplaşmış biçimini korur", id: "klausa komentar mempertahankan bentuk tetapnya", vi: "mệnh đề bình luận giữ nguyên dạng cố định" } }
