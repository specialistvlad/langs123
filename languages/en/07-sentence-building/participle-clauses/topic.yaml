      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, pattern: { pattern: [with, { slot: noun }, { slot: V-ing }] }, use: { en: "an action in progress, a cause or a time", uk: "дія, що триває, причина або час", es: "una acción en curso, una causa o un momento", pt: "uma ação em andamento, uma causa ou um momento", fr: "une action en cours, une cause ou un moment", de: "eine laufende Handlung, eine Ursache oder ein Zeitpunkt", it: "un'azione in corso, una causa o un momento", pl: "czynność w toku, przyczyna lub czas", tr: "süren bir eylem, bir neden ya da bir zaman", id: "tindakan yang sedang berlangsung, sebab, atau waktu", vi: "hành động đang diễn ra, nguyên nhân hoặc thời điểm" }, ex: [{ target: "With the weather improving" }, ", we decided to walk."], tr: { uk: "Оскільки погода покращувалася, ми вирішили йти пішки.", es: "Como el tiempo iba mejorando, decidimos caminar.", pt: "Com o tempo melhorando, decidimos ir a pé.", fr: "Le temps s’améliorant, nous avons décidé de marcher.", de: "Da das Wetter besser wurde, beschlossen wir zu laufen.", it: "Con il tempo che migliorava, abbiamo deciso di andare a piedi.", pl: "Skoro pogoda się poprawiała, postanowiliśmy iść pieszo.", tr: "Hava düzeldiği için yürümeye karar verdik.", id: "Karena cuaca membaik, kami memutuskan untuk berjalan kaki.", vi: "Thời tiết đang tốt lên nên chúng tôi quyết định đi bộ." } }
          - { level: C1, pattern: { pattern: [with, { slot: noun }, { slot: past participle }] }, use: { en: "a position or state of the noun", uk: "положення або стан іменника", es: "una posición o estado del sustantivo", pt: "uma posição ou estado do substantivo", fr: "une position ou un état du nom", de: "eine Lage oder ein Zustand des Nomens", it: "una posizione o uno stato del sostantivo", pl: "położenie lub stan rzeczownika", tr: "ismin duruşu ya da durumu", id: "posisi atau keadaan kata benda", vi: "vị trí hoặc trạng thái của danh từ" }, ex: ["She sat ", { target: "with her arms crossed" }, "."], tr: { uk: "Вона сиділа, схрестивши руки.", es: "Se sentó con los brazos cruzados.", pt: "Ela sentou com os braços cruzados.", fr: "Elle était assise, les bras croisés.", de: "Sie saß mit verschränkten Armen da.", it: "Era seduta con le braccia incrociate.", pl: "Siedziała ze skrzyżowanymi rękami.", tr: "Kollarını kavuşturmuş hâlde oturdu.", id: "Dia duduk dengan tangan bersilang.", vi: "Cô ấy ngồi khoanh tay." } }
          - { level: C1, pattern: { pattern: [with, { slot: noun }, { alternatives: [{ slot: adjective }, { slot: adverb }] }] }, use: { en: "a state, a place or a detail in place", uk: "стан, місце або подробиця обстановки", es: "un estado, un lugar o un detalle de la escena", pt: "um estado, um lugar ou um detalhe da cena", fr: "un état, un lieu ou un détail de la scène", de: "ein Zustand, ein Ort oder ein Detail der Situation", it: "uno stato, un luogo o un dettaglio della scena", pl: "stan, miejsce lub szczegół sytuacji", tr: "bir durum, bir yer ya da ortamla ilgili bir ayrıntı", id: "keadaan, tempat, atau detail suasana", vi: "một trạng thái, một nơi chốn hoặc một chi tiết của bối cảnh" }, ex: { examples: [[{ target: "With the lights off" }, ", the room felt cold."], ["She slept ", { target: "with the window open" }, "."]] }, tr: { uk: { examples: ["З вимкненим світлом у кімнаті здавалося холодно.", "Вона спала при відчиненому вікні."] }, es: { examples: ["Con las luces apagadas, la habitación se sentía fría.", "Durmió con la ventana abierta."] }, pt: { examples: ["Com as luzes apagadas, o quarto parecia frio.", "Ela dormiu com a janela aberta."] }, fr: { examples: ["Les lumières éteintes, la pièce semblait froide.", "Elle a dormi la fenêtre ouverte."] }, de: { examples: ["Bei ausgeschaltetem Licht wirkte der Raum kalt.", "Sie schlief bei offenem Fenster."] }, it: { examples: ["Con le luci spente, la stanza sembrava fredda.", "Ha dormito con la finestra aperta."] }, pl: { examples: ["Przy zgaszonym świetle pokój wydawał się zimny.", "Spała przy otwartym oknie."] }, tr: { examples: ["Işıklar kapalıyken oda soğuk geldi.", "Pencere açık uyudu."] }, id: { examples: ["Dengan lampu dimatikan, ruangan terasa dingin.", "Dia tidur dengan jendela terbuka."] }, vi: { examples: ["Khi đèn tắt, căn phòng có cảm giác lạnh lẽo.", "Cô ấy ngủ khi cửa sổ mở."] } } }
          - { level: C1, pattern: { pattern: [without, { slot: noun }, { slot: V-ing }] }, use: { en: "something that does not happen", uk: "щось, що не відбувається", es: "algo que no ocurre", pt: "algo que não acontece", fr: "quelque chose qui n’a pas lieu", de: "etwas, das nicht geschieht", it: "qualcosa che non accade", pl: "coś, co się nie dzieje", tr: "gerçekleşmeyen bir şey", id: "sesuatu yang tidak terjadi", vi: "điều không xảy ra" }, ex: ["He left ", { target: "without anyone noticing" }, "."], tr: { uk: "Він пішов, і ніхто цього не помітив.", es: "Se fue sin que nadie lo notara.", pt: "Ele saiu sem que ninguém percebesse.", fr: "Il est parti sans que personne s’en aperçoive.", de: "Er ging, ohne dass es jemand bemerkte.", it: "Se n'è andato senza che nessuno se ne accorgesse.", pl: "Wyszedł, nie zauważony przez nikogo.", tr: "Kimse fark etmeden çıkıp gitti.", id: "Dia pergi tanpa ada yang menyadari.", vi: "Anh ấy rời đi mà không ai nhận ra." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The noun takes -ing when it acts and a past participle when it receives the action.", uk: ["Іменник стоїть із ", { term: "-ing" }, ", коли діє сам, і з 3-ю формою, коли дія спрямована на нього."], es: ["El sustantivo lleva ", { term: "-ing" }, " cuando actúa y participio pasado cuando recibe la acción."], pt: ["O substantivo leva ", { term: "-ing" }, " quando age e particípio passado quando recebe a ação."], fr: ["Le nom prend ", { term: "-ing" }, " quand il agit et le participe passé quand il subit l’action."], de: ["Das Nomen steht mit ", { term: "-ing" }, ", wenn es handelt, und mit Past Participle, wenn es die Handlung erfährt."], it: ["Il sostantivo prende ", { term: "-ing" }, " quando agisce e il participio passato quando subisce l'azione."], pl: ["Rzeczownik łączy się z ", { term: "-ing" }, ", gdy działa, i z III formą czasownika, gdy jest odbiorcą czynności."], tr: ["İsim eylemi yapıyorsa ", { term: "-ing" }, ", eylemden etkileniyorsa past participle alır."], id: ["Kata benda memakai ", { term: "-ing" }, " saat ia melakukan tindakan dan past participle saat ia menerima tindakan."], vi: ["Danh từ đi với ", { term: "-ing" }, " khi nó thực hiện hành động và với quá khứ phân từ khi nó chịu hành động."] }
            ex: { examples: [[{ target: "With the sun shining" }, ", we ate outside."], [{ target: "With the work finished" }, ", she went home."]] }
            tr: { uk: { examples: ["Коли світило сонце, ми їли надворі.", "Коли роботу було закінчено, вона пішла додому."] }, es: { examples: ["Con el sol brillando, comimos afuera.", "Con el trabajo terminado, se fue a casa."] }, pt: { examples: ["Com o sol brilhando, comemos ao ar livre.", "Com o trabalho terminado, ela foi para casa."] }, fr: { examples: ["Le soleil brillant, nous avons mangé dehors.", "Le travail terminé, elle est rentrée chez elle."] }, de: { examples: ["Bei scheinender Sonne aßen wir draußen.", "Nachdem die Arbeit erledigt war, ging sie nach Hause."] }, it: { examples: ["Con il sole che splendeva, abbiamo mangiato fuori.", "Con il lavoro finito, è tornata a casa."] }, pl: { examples: ["Gdy świeciło słońce, jedliśmy na dworze.", "Gdy praca była skończona, poszła do domu."] }, tr: { examples: ["Güneş parlarken dışarıda yemek yedik.", "İş bitince eve gitti."] }, id: { examples: ["Dengan matahari yang bersinar, kami makan di luar.", "Setelah pekerjaan selesai, dia pulang."] }, vi: { examples: ["Trời nắng đẹp, chúng tôi ăn ngoài trời.", "Xong việc, cô ấy về nhà."] } }

