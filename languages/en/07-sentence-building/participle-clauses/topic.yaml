          - { level: B2, use: { en: "Time: two actions at once", uk: "Час: дві дії одночасно", es: "Tiempo: dos acciones a la vez", pt: "Tempo: duas ações ao mesmo tempo", fr: "Temps : deux actions en même temps", de: "Zeit: zwei Handlungen gleichzeitig", it: "Tempo: due azioni nello stesso momento", pl: "Czas: dwie czynności naraz", tr: "Zaman: aynı anda iki eylem", id: "Waktu: dua tindakan sekaligus", vi: "Thời gian: hai hành động cùng lúc" }, ex: [{ target: "Walking down the street" }, ", I met Tom."], tr: { uk: "Ідучи вулицею, я зустрів Тома.", es: "Caminando por la calle, me encontré con Tom.", pt: "Andando pela rua, encontrei o Tom.", fr: "En descendant la rue, j’ai croisé Tom.", de: "Als ich die Straße entlangging, traf ich Tom.", it: "Camminando per la strada, ho incontrato Tom.", pl: "Idąc ulicą, spotkałem Toma.", tr: "Sokakta yürürken Tom’la karşılaştım.", id: "Saat berjalan di jalan, saya bertemu Tom.", vi: "Đang đi trên phố, tôi gặp Tom." } }
          - { level: B2, use: { en: "Time: one action straight after another", uk: "Час: одна дія відразу після іншої", es: "Tiempo: una acción justo después de otra", pt: "Tempo: uma ação logo depois de outra", fr: "Temps : une action tout de suite après une autre", de: "Zeit: eine Handlung gleich nach der anderen", it: "Tempo: un'azione subito dopo un'altra", pl: "Czas: jedna czynność zaraz po drugiej", tr: "Zaman: bir eylemin hemen ardından gelen başka eylem", id: "Waktu: satu tindakan langsung setelah tindakan lain", vi: "Thời gian: hành động này ngay sau hành động kia" }, ex: [{ target: "Taking out her key" }, ", she opened the door."], tr: { uk: "Вийнявши ключ, вона відчинила двері.", es: "Sacando la llave, abrió la puerta.", pt: "Tirando a chave, ela abriu a porta.", fr: "Sortant sa clé, elle a ouvert la porte.", de: "Sie holte den Schlüssel heraus und öffnete die Tür.", it: "Tirata fuori la chiave, ha aperto la porta.", pl: "Wyjąwszy klucz, otworzyła drzwi.", tr: "Anahtarını çıkarıp kapıyı açtı.", id: "Mengeluarkan kuncinya, dia membuka pintu.", vi: "Lấy chìa khóa ra, cô ấy mở cửa." } }
          - { level: B2, use: { en: Reason, uk: "Причина", es: "Razón", pt: "Razão", fr: "Raison", de: "Grund", it: "Causa", pl: "Przyczyna", tr: "Sebep", id: "Alasan", vi: "Lý do" }, ex: [{ target: "Feeling tired" }, ", she went to bed."], tr: { uk: "Відчуваючи втому, вона пішла спати.", es: "Sintiéndose cansada, se fue a la cama.", pt: "Sentindo-se cansada, ela foi dormir.", fr: "Se sentant fatiguée, elle est allée se coucher.", de: "Da sie sich müde fühlte, ging sie ins Bett.", it: "Sentendosi stanca, è andata a letto.", pl: "Czując zmęczenie, poszła spać.", tr: "Kendini yorgun hissettiği için yatağa gitti.", id: "Merasa lelah, dia pergi tidur.", vi: "Cảm thấy mệt, cô ấy đi ngủ." } }
          - { level: B2, use: { en: "An accompanying action after the main verb", uk: "Супутня дія після головного дієслова", es: "Una acción que acompaña, después del verbo principal", pt: "Uma ação que acompanha, depois do verbo principal", fr: "Une action qui accompagne, après le verbe principal", de: "Eine begleitende Handlung nach dem Hauptverb", it: "Un'azione che accompagna, dopo il verbo principale", pl: "Czynność towarzysząca po czasowniku głównym", tr: "Ana fiilden sonra gelen eşlik eden eylem", id: "Tindakan yang menyertai, setelah kata kerja utama", vi: "Hành động đi kèm, đứng sau động từ chính" }, ex: { examples: [["He sat there, ", { target: "staring at the wall" }, "."], ["She came in ", { target: "carrying a tray" }, "."]] }, tr: { uk: { examples: ["Він сидів там, дивлячись на стіну.", "Вона зайшла, несучи піднос."] }, es: { examples: ["Se quedó sentado allí, mirando la pared.", "Entró llevando una bandeja."] }, pt: { examples: ["Ele ficou sentado ali, olhando para a parede.", "Ela entrou carregando uma bandeja."] }, fr: { examples: ["Il était assis là, le regard fixé sur le mur.", "Elle est entrée en portant un plateau."] }, de: { examples: ["Er saß da und starrte die Wand an.", "Sie kam herein und trug ein Tablett."] }, it: { examples: ["Stava seduto lì, fissando il muro.", "È entrata portando un vassoio."] }, pl: { examples: ["Siedział tam, wpatrując się w ścianę.", "Weszła, niosąc tacę."] }, tr: { examples: ["Orada oturmuş, duvara bakıyordu.", "İçeri bir tepsi taşıyarak girdi."] }, id: { examples: ["Dia duduk di sana, menatap dinding.", "Dia masuk sambil membawa nampan."] }, vi: { examples: ["Anh ấy ngồi đó, nhìn chằm chằm vào bức tường.", "Cô ấy bước vào, tay bưng một cái khay."] } } }
          - { level: B2, use: { en: "Result: the consequence of the main action", uk: "Наслідок: те, що виходить із головної дії", es: "Resultado: la consecuencia de la acción principal", pt: "Resultado: a consequência da ação principal", fr: "Résultat : la conséquence de l’action principale", de: "Folge: das Ergebnis der Haupthandlung", it: "Conseguenza: l'effetto dell'azione principale", pl: "Skutek: konsekwencja czynności głównej", tr: "Sonuç: ana eylemin sonucu", id: "Akibat: dampak dari tindakan utama", vi: "Kết quả: hệ quả của hành động chính" }, ex: ["He dropped the plate, ", { target: breaking }, " it."], tr: { uk: "Він упустив тарілку й розбив її.", es: "Dejó caer el plato y lo rompió.", pt: "Ele deixou o prato cair e o quebrou.", fr: "Il a laissé tomber l’assiette et l’a cassée.", de: "Er ließ den Teller fallen und zerbrach ihn.", it: "Ha fatto cadere il piatto, rompendolo.", pl: "Upuścił talerz i go stłukł.", tr: "Tabağı düşürdü ve kırdı.", id: "Dia menjatuhkan piring itu hingga pecah.", vi: "Anh ấy làm rơi cái đĩa và làm vỡ nó." } }

  - title: { en: "Use: after a conjunction", uk: "Вживання: після сполучника", es: "Uso: después de una conjunción", pt: "Uso: depois de uma conjunção", fr: "Emploi : après une conjonction", de: "Gebrauch: nach einer Konjunktion", it: "Uso: dopo una congiunzione", pl: "Użycie: po spójniku", tr: "Kullanım: bağlaçtan sonra", id: "Penggunaan: setelah konjungsi", vi: "Cách dùng: sau liên từ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, word: { term: while }, use: { en: "two actions at the same time", uk: "дві дії одночасно", es: "dos acciones al mismo tiempo", pt: "duas ações ao mesmo tempo", fr: "deux actions en même temps", de: "zwei Handlungen gleichzeitig", it: "due azioni nello stesso momento", pl: "dwie czynności w tym samym czasie", tr: "aynı anda iki eylem", id: "dua tindakan pada waktu yang sama", vi: "hai hành động cùng lúc" }, ex: [{ target: "While waiting" }, " for the bus, I read the news."], tr: { uk: "Поки я чекав автобус, я читав новини.", es: "Mientras esperaba el autobús, leí las noticias.", pt: "Enquanto esperava o ônibus, li as notícias.", fr: "En attendant le bus, j’ai lu les nouvelles.", de: "Während ich auf den Bus wartete, las ich die Nachrichten.", it: "Mentre aspettavo l'autobus, ho letto le notizie.", pl: "Czekając na autobus, czytałem wiadomości.", tr: "Otobüsü beklerken haberleri okudum.", id: "Sambil menunggu bus, saya membaca berita.", vi: "Trong lúc chờ xe buýt, tôi đọc tin tức." } }
          - { level: B2, word: { term: when }, use: { en: "at the time of an action", uk: "у момент дії", es: "en el momento de una acción", pt: "no momento de uma ação", fr: "au moment d’une action", de: "zum Zeitpunkt einer Handlung", it: "nel momento di un'azione", pl: "w chwili wykonywania czynności", tr: "bir eylemin gerçekleştiği sırada", id: "pada saat suatu tindakan", vi: "vào lúc một hành động diễn ra" }, ex: [{ target: "When leaving" }, " the house, check the windows."], tr: { uk: "Виходячи з дому, перевірте вікна.", es: "Al salir de casa, revisa las ventanas.", pt: "Ao sair de casa, verifique as janelas.", fr: "En quittant la maison, vérifiez les fenêtres.", de: "Prüfen Sie beim Verlassen des Hauses die Fenster.", it: "Quando esci di casa, controlla le finestre.", pl: "Wychodząc z domu, sprawdź okna.", tr: "Evden çıkarken pencereleri kontrol et.", id: "Saat meninggalkan rumah, periksa jendela.", vi: "Khi rời khỏi nhà, hãy kiểm tra các cửa sổ." } }
          - { level: B2, word: { term: before }, use: { en: "an action that comes next", uk: "дія, що йде далі", es: "una acción que viene después", pt: "uma ação que vem depois", fr: "une action qui vient ensuite", de: "eine Handlung, die danach kommt", it: "un'azione che viene dopo", pl: "czynność, która następuje potem", tr: "sonra gelen eylem", id: "tindakan yang terjadi berikutnya", vi: "hành động xảy ra sau" }, ex: [{ target: "Before signing" }, ", read the contract."], tr: { uk: "Перш ніж підписувати, прочитайте договір.", es: "Antes de firmar, lee el contrato.", pt: "Antes de assinar, leia o contrato.", fr: "Avant de signer, lisez le contrat.", de: "Lesen Sie den Vertrag, bevor Sie unterschreiben.", it: "Prima di firmare, leggi il contratto.", pl: "Przed podpisaniem przeczytaj umowę.", tr: "İmzalamadan önce sözleşmeyi oku.", id: "Sebelum menandatangani, baca kontraknya.", vi: "Trước khi ký, hãy đọc hợp đồng." } }
          - { level: B2, word: { term: after }, use: { en: "an action that is over", uk: "дія, що вже закінчилася", es: "una acción que ya terminó", pt: "uma ação que já terminou", fr: "une action qui est terminée", de: "eine Handlung, die vorbei ist", it: "un'azione conclusa", pl: "czynność już zakończona", tr: "bitmiş bir eylem", id: "tindakan yang sudah selesai", vi: "hành động đã kết thúc" }, ex: [{ target: "After leaving" }, " school, she worked abroad."], tr: { uk: "Після закінчення школи вона працювала за кордоном.", es: "Después de terminar la escuela, trabajó en el extranjero.", pt: "Depois de sair da escola, ela trabalhou no exterior.", fr: "Après avoir quitté l’école, elle a travaillé à l’étranger.", de: "Nach der Schule arbeitete sie im Ausland.", it: "Dopo aver lasciato la scuola, ha lavorato all'estero.", pl: "Po skończeniu szkoły pracowała za granicą.", tr: "Okulu bitirdikten sonra yurt dışında çalıştı.", id: "Setelah lulus sekolah, dia bekerja di luar negeri.", vi: "Sau khi rời trường, cô ấy làm việc ở nước ngoài." } }
          - { level: B2, word: { term: since }, use: { en: "from a past event until now", uk: "від події в минулому й до сьогодні", es: "desde un hecho pasado hasta ahora", pt: "de um fato passado até agora", fr: "depuis un événement passé jusqu’à maintenant", de: "von einem vergangenen Ereignis bis jetzt", it: "da un fatto passato fino a ora", pl: "od zdarzenia z przeszłości do teraz", tr: "geçmişteki bir olaydan şimdiye kadar", id: "dari suatu peristiwa di masa lalu sampai sekarang", vi: "từ một sự việc trong quá khứ đến nay" }, ex: [{ target: "Since moving" }, " here, I have made many friends."], tr: { uk: "Відколи я переїхав сюди, у мене з’явилося багато друзів.", es: "Desde que me mudé aquí, he hecho muchos amigos.", pt: "Desde que me mudei para cá, fiz muitos amigos.", fr: "Depuis que j’ai emménagé ici, je me suis fait beaucoup d’amis.", de: "Seit ich hierher gezogen bin, habe ich viele Freunde gefunden.", it: "Da quando mi sono trasferito qui, ho fatto molti amici.", pl: "Odkąd się tu przeprowadziłem, poznałem wielu przyjaciół.", tr: "Buraya taşındığımdan beri çok arkadaş edindim.", id: "Sejak pindah ke sini, saya mendapat banyak teman.", vi: "Từ khi chuyển đến đây, tôi đã có nhiều bạn." } }
          - { level: B2, word: { term: on }, use: { en: "immediately after an event", uk: "відразу після події", es: "inmediatamente después de un hecho", pt: "imediatamente depois de um fato", fr: "immédiatement après un événement", de: "unmittelbar nach einem Ereignis", it: "subito dopo un evento", pl: "bezpośrednio po zdarzeniu", tr: "bir olaydan hemen sonra", id: "segera setelah suatu peristiwa", vi: "ngay sau một sự việc" }, ex: [{ target: "On arriving" }, ", we phoned our parents."], tr: { uk: "Щойно приїхавши, ми зателефонували батькам.", es: "Al llegar, llamamos a nuestros padres.", pt: "Ao chegar, ligamos para nossos pais.", fr: "En arrivant, nous avons appelé nos parents.", de: "Bei der Ankunft riefen wir unsere Eltern an.", it: "Appena arrivati, abbiamo telefonato ai nostri genitori.", pl: "Po przyjeździe zadzwoniliśmy do rodziców.", tr: "Varır varmaz ailemizi aradık.", id: "Begitu tiba, kami menelepon orang tua kami.", vi: "Vừa đến nơi, chúng tôi gọi điện cho bố mẹ." } }
          - { level: B2, word: { term: by }, use: { en: "the means of doing something", uk: "спосіб зробити щось", es: "el medio para hacer algo", pt: "o meio de fazer algo", fr: "le moyen de faire quelque chose", de: "das Mittel, etwas zu tun", it: "il mezzo per fare qualcosa", pl: "sposób zrobienia czegoś", tr: "bir şeyi yapma yolu", id: "cara melakukan sesuatu", vi: "cách để làm một việc gì đó" }, ex: [{ target: "By working" }, " hard, she passed the exam."], tr: { uk: "Наполегливо працюючи, вона склала іспит.", es: "Trabajando duro, aprobó el examen.", pt: "Trabalhando muito, ela passou no exame.", fr: "En travaillant dur, elle a réussi l’examen.", de: "Durch harte Arbeit bestand sie die Prüfung.", it: "Lavorando sodo, ha superato l'esame.", pl: "Ciężko pracując, zdała egzamin.", tr: "Çok çalışarak sınavı geçti.", id: "Dengan bekerja keras, dia lulus ujian.", vi: "Nhờ làm việc chăm chỉ, cô ấy đã đỗ kỳ thi." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: [{ term: before }, " and ", { term: after }, " already show the order, so the plain ", { slot: -ing }, " form is normal."], uk: [{ term: "before" }, " і ", { term: "after" }, " уже показують порядок дій, тому тут звичайно вживають просту форму ", { slot: "-ing" }, "."], es: [{ term: "before" }, " y ", { term: "after" }, " ya indican el orden, así que lo normal es la forma simple ", { slot: "-ing" }, "."], pt: [{ term: "before" }, " e ", { term: "after" }, " já indicam a ordem, por isso a forma simples ", { slot: "-ing" }, " é a normal."], fr: [{ term: "before" }, " et ", { term: "after" }, " indiquent déjà l’ordre, donc la forme simple ", { slot: "-ing" }, " est la norme."], de: [{ term: "before" }, " und ", { term: "after" }, " zeigen die Reihenfolge schon an, darum ist die einfache ", { slot: "-ing" }, "-Form normal."], it: [{ term: "before" }, " e ", { term: "after" }, " indicano già l'ordine, quindi la forma semplice ", { slot: "-ing" }, " è quella normale."], pl: [{ term: "before" }, " i ", { term: "after" }, " już wskazują kolejność, więc zwykła forma ", { slot: "-ing" }, " jest normą."], tr: [{ term: "before" }, " ve ", { term: "after" }, " sıralamayı zaten gösterir, bu yüzden yalın ", { slot: "-ing" }, " biçimi yeterlidir."], id: [{ term: "before" }, " dan ", { term: "after" }, " sudah menunjukkan urutan, jadi bentuk ", { slot: "-ing" }, " biasa sudah lazim."], vi: [{ term: "before" }, " và ", { term: "after" }, " đã cho biết thứ tự, nên dạng ", { slot: "-ing" }, " thông thường là bình thường."] }
            ex: ["After ", { target: eating }, ", we washed up."]
            tr: { uk: "Після їжі ми помили посуд.", es: "Después de comer, lavamos los platos.", pt: "Depois de comer, lavamos a louça.", fr: "Après avoir mangé, nous avons fait la vaisselle.", de: "Nach dem Essen spülten wir ab.", it: "Dopo aver mangiato, abbiamo lavato i piatti.", pl: "Po jedzeniu pozmywaliśmy.", tr: "Yemekten sonra bulaşıkları yıkadık.", id: "Setelah makan, kami mencuci piring.", vi: "Sau khi ăn, chúng tôi rửa bát." }
          - type: note
            level: B2
            text: { en: ["More linkers followed by ", { slot: -ing }, " are in ", { link: Conjunctions and Linkers, to: en.sentence-building.conjunctions-linkers }, "."], uk: ["Більше слів-зв’язків із ", { slot: "-ing" }, ": ", { link: "Сполучники та слова-зв’язки", to: "en.sentence-building.conjunctions-linkers" }, "."], es: ["Más conectores seguidos de ", { slot: "-ing" }, ": ", { link: "Conjunciones y conectores", to: "en.sentence-building.conjunctions-linkers" }, "."], pt: ["Mais conectivos seguidos de ", { slot: "-ing" }, ": ", { link: "Conjunções e conectivos", to: "en.sentence-building.conjunctions-linkers" }, "."], fr: ["Autres connecteurs suivis de ", { slot: "-ing" }, " : ", { link: "Conjonctions et connecteurs", to: "en.sentence-building.conjunctions-linkers" }, "."], de: ["Weitere Bindewörter mit ", { slot: "-ing" }, ": ", { link: "Konjunktionen und Bindewörter", to: "en.sentence-building.conjunctions-linkers" }, "."], it: ["Altri connettivi seguiti da ", { slot: "-ing" }, ": ", { link: "Congiunzioni e connettivi", to: "en.sentence-building.conjunctions-linkers" }, "."], pl: ["Więcej słów łączących z ", { slot: "-ing" }, ": ", { link: "Spójniki i słowa łączące", to: "en.sentence-building.conjunctions-linkers" }, "."], tr: [{ slot: "-ing" }, " ile kullanılan diğer bağlayıcılar: ", { link: "Bağlaçlar ve bağlayıcılar", to: "en.sentence-building.conjunctions-linkers" }, "."], id: ["Kata penghubung lain yang diikuti ", { slot: "-ing" }, ": ", { link: "Konjungsi dan kata penghubung", to: "en.sentence-building.conjunctions-linkers" }, "."], vi: ["Thêm các từ nối đi với ", { slot: "-ing" }, ": ", { link: "Liên từ và từ nối", to: "en.sentence-building.conjunctions-linkers" }, "."] }

