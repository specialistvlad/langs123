sise, les bras croisés.", "Les lumières éteintes, la pièce semblait froide."] }, de: { examples: ["Sie saß mit verschränkten Armen da.", "Bei ausgeschaltetem Licht wirkte der Raum kalt."] }, it: { examples: ["Era seduta con le braccia incrociate.", "Con le luci spente, la stanza sembrava fredda."] }, pl: { examples: ["Siedziała ze skrzyżowanymi rękami.", "Przy zgaszonym świetle pokój wydawał się zimny."] }, tr: { examples: ["Kollarını kavuşturmuş hâlde oturdu.", "Işıklar kapalıyken oda soğuk geldi."] }, id: { examples: ["Dia duduk dengan tangan bersilang.", "Dengan lampu dimatikan, ruangan terasa dingin."] }, vi: { examples: ["Cô ấy ngồi khoanh tay.", "Khi đèn tắt, căn phòng có cảm giác lạnh lẽo."] } } }
        - { level: C1, point: { en: Own subject, uk: "Власний підмет", es: "Sujeto propio", pt: "Sujeito próprio", fr: "Sujet propre", de: "Eigenes Subjekt", it: "Soggetto proprio", pl: "Własny podmiot", tr: "Kendi öznesi", id: "Subjek sendiri", vi: "Chủ ngữ riêng" }, rule: { en: [{ term: being }, " joins a subject of its own to the clause"], uk: [{ term: "being" }, " додає до звороту власний підмет"], es: [{ term: "being" }, " añade a la oración un sujeto propio"], pt: [{ term: "being" }, " dá à oração um sujeito próprio"], fr: [{ term: "being" }, " donne à la proposition un sujet propre"], de: [{ term: "being" }, " gibt dem Satz ein eigenes Subjekt"], it: [{ term: "being" }, " dà alla proposizione un soggetto proprio"], pl: [{ term: "being" }, " dodaje do konstrukcji własny podmiot"], tr: [{ term: "being" }, " yantümceye kendi öznesini ekler"], id: [{ term: "being" }, " menambahkan subjek sendiri pada klausa"], vi: [{ term: "being" }, " thêm một chủ ngữ riêng vào mệnh đề"] }, ex: [{ target: "It being Sunday" }, ", the shops were closed."], tr: { uk: "Оскільки була неділя, магазини були зачинені.", es: "Como era domingo, las tiendas estaban cerradas.", pt: "Como era domingo, as lojas estavam fechadas.", fr: "Comme c’était dimanche, les magasins étaient fermés.", de: "Da Sonntag war, waren die Geschäfte geschlossen.", it: "Essendo domenica, i negozi erano chiusi.", pl: "Ponieważ była niedziela, sklepy były zamknięte.", tr: "Pazar olduğu için dükkânlar kapalıydı.", id: "Karena hari itu Minggu, toko-toko tutup.", vi: "Vì hôm đó là Chủ nhật nên các cửa hàng đóng cửa." } }
        - { level: C1, point: { en: Condition and concession, uk: "Умова й допуст", es: "Condición y concesión", pt: "Condição e concessão", fr: "Condition et concession", de: "Bedingung und Einräumung", it: "Condizione e concessione", pl: "Warunek i ustępstwo", tr: "Koşul ve ödün", id: "Syarat dan konsesi", vi: "Điều kiện và nhượng bộ" }, rule: { en: ["a past participle, ", { term: provided }, ", ", { term: supposing }, " or ", { term: though }, " opens it"], uk: ["зворот відкриває 3-тя форма дієслова, ", { term: "provided" }, ", ", { term: "supposing" }, " або ", { term: "though" }], es: ["lo abre un participio pasado, ", { term: "provided" }, ", ", { term: "supposing" }, " o ", { term: "though" }], pt: ["ela começa com um particípio passado, ", { term: "provided" }, ", ", { term: "supposing" }, " ou ", { term: "though" }], fr: ["elle s’ouvre par un participe passé, ", { term: "provided" }, ", ", { term: "supposing" }, " ou ", { term: "though" }], de: ["er beginnt mit einem Past Participle, ", { term: "provided" }, ", ", { term: "supposing" }, " oder ", { term: "though" }], it: ["si apre con un participio passato, ", { term: "provided" }, ", ", { term: "supposing" }, " o ", { term: "though" }], pl: ["otwiera ją III forma czasownika, ", { term: "provided" }, ", ", { term: "supposing" }, " lub ", { term: "though" }], tr: ["başında past participle, ", { term: "provided" }, ", ", { term: "supposing" }, " veya ", { term: "though" }, " bulunur"], id: ["dibuka dengan past participle, ", { term: "provided" }, ", ", { term: "supposing" }, " atau ", { term: "though" }], vi: ["mở đầu bằng quá khứ phân từ, ", { term: "provided" }, ", ", { term: "supposing" }, " hoặc ", { term: "though" }] }, ex: { examples: [[{ target: "Used properly" }, ", the product is safe."], [{ target: "Though warned" }, ", he went anyway."]] }, tr: { uk: { examples: ["Якщо користуватися правильно, виріб безпечний.", "Хоча його попередили, він усе одно пішов."] }, es: { examples: ["Usado correctamente, el producto es seguro.", "Aunque lo advirtieron, fue de todos modos."] }, pt: { examples: ["Usado corretamente, o produto é seguro.", "Embora avisado, ele foi mesmo assim."] }, fr: { examples: ["Utilisé correctement, le produit est sûr.", "Bien qu’il ait été prévenu, il y est allé quand même."] }, de: { examples: ["Richtig verwendet, ist das Produkt sicher.", "Obwohl er gewarnt worden war, ging er trotzdem."] }, it: { examples: ["Usato correttamente, il prodotto è sicuro.", "Pur essendo stato avvertito, è andato lo stesso."] }, pl: { examples: ["Używany prawidłowo, produkt jest bezpieczny.", "Choć ostrzegany, i tak poszedł."] }, tr: { examples: ["Doğru kullanıldığında ürün güvenlidir.", "Uyarılmasına rağmen yine de gitti."] }, id: { examples: ["Jika digunakan dengan benar, produk ini aman.", "Meskipun sudah diperingatkan, dia tetap pergi."] }, vi: { examples: ["Nếu dùng đúng cách, sản phẩm này an toàn.", "Dù đã được cảnh báo, anh ấy vẫn đi."] } } }
        - { level: C1, point: { en: Result, uk: "Наслідок", es: "Resultado", pt: "Resultado", fr: "Résultat", de: "Folge", it: "Conseguenza", pl: "Skutek", tr: "Sonuç", id: "Akibat", vi: "Kết quả" }, rule: { en: [{ pattern: [thereby, { slot: V-ing }] }, " names the result of the whole main clause"], uk: [{ pattern: ["thereby", { slot: "V-ing" }] }, " називає наслідок усього головного речення"], es: [{ pattern: ["thereby", { slot: "V-ing" }] }, " expresa el resultado de toda la oración principal"], pt: [{ pattern: ["thereby", { slot: "V-ing" }] }, " indica o resultado de toda a oração principal"], fr: [{ pattern: ["thereby", { slot: "V-ing" }] }, " exprime le résultat de toute la proposition principale"], de: [{ pattern: ["thereby", { slot: "V-ing" }] }, " nennt die Folge des ganzen Hauptsatzes"], it: [{ pattern: ["thereby", { slot: "V-ing" }] }, " indica la conseguenza dell'intera proposizione principale"], pl: [{ pattern: ["thereby", { slot: "V-ing" }] }, " podaje skutek całego zdania głównego"], tr: [{ pattern: ["thereby", { slot: "V-ing" }] }, " ana cümlenin tamamının sonucunu bildirir"], id: [{ pattern: ["thereby", { slot: "V-ing" }] }, " menyatakan akibat dari seluruh klausa utama"], vi: [{ pattern: ["thereby", { slot: "V-ing" }] }, " nêu kết quả của cả mệnh đề chính"] }, ex: ["Prices rose, ", { target: "thereby forcing" }, " shops to close."], tr: { uk: "Ціни зросли, через що магазини змушені були закритися.", es: "Los precios subieron, lo que obligó a cerrar a las tiendas.", pt: "Os preços subiram, o que forçou as lojas a fechar.", fr: "Les prix ont augmenté, obligeant ainsi des magasins à fermer.", de: "Die Preise stiegen, wodurch Geschäfte schließen mussten.", it: "I prezzi sono saliti, costringendo così i negozi a chiudere.", pl: "Ceny wzrosły, co zmusiło sklepy do zamknięcia.", tr: "Fiyatlar yükseldi ve bu yüzden dükkânlar kapanmak zorunda kaldı.", id: "Harga naik, sehingga toko-toko terpaksa tutup.", vi: "Giá tăng, do đó buộc các cửa hàng phải đóng cửa." } }
        - { level: C2, point: { en: Absolute phrases, uk: "Абсолютні конструкції", es: "Construcciones absolutas", pt: "Construções absolutas", fr: "Propositions absolues", de: "Absolute Konstruktionen", it: "Costruzioni assolute", pl: "Konstrukcje absolutne", tr: "Bağımsız yapılar", id: "Konstruksi absolut", vi: "Cụm tuyệt đối" }, rule: { en: "a noun and a participle or adjective, with no verb, set the scene", uk: "іменник і дієприкметник або прикметник без дієслова задають обставини", es: "un sustantivo con un participio o un adjetivo, sin verbo, fijan las circunstancias", pt: "um substantivo com particípio ou adjetivo, sem verbo, define a circunstância", fr: "un nom et un participe ou un adjectif, sans verbe, posent les circonstances", de: "ein Nomen mit Partizip oder Adjektiv, ohne Verb, nennt die Umstände", it: "un sostantivo con participio o aggettivo, senza verbo, indica le circostanze", pl: "rzeczownik z imiesłowem lub przymiotnikiem, bez czasownika, podaje okoliczności", tr: "fiilsiz bir isim ve ortaç ya da sıfat, durumu belirler", id: "kata benda dengan partisipel atau kata sifat, tanpa kata kerja, menetapkan latar keadaan", vi: "một danh từ cùng phân từ hoặc tính từ, không có động từ, nêu hoàn cảnh" }, ex: { examples: [[{ target: "Weather permitting" }, ", we will eat outside."], [{ target: "Her work finished" }, ", she left."]] }, tr: { uk: { examples: ["Якщо погода дозволить, ми обідатимемо надворі.", "Закінчивши роботу, вона пішла."] }, es: { examples: ["Si el clima lo permite, comeremos afuera.", "Terminado su trabajo, se fue."] }, pt: { examples: ["Se o tempo permitir, vamos comer ao ar livre.", "Terminado o trabalho, ela foi embora."] }, fr: { examples: ["Si le temps le permet, nous mangerons dehors.", "Son travail terminé, elle est partie."] }, de: { examples: ["Wenn das Wetter es erlaubt, essen wir draußen.", "Nachdem ihre Arbeit erledigt war, ging sie."] }, it: { examples: ["Tempo permettendo, mangeremo fuori.", "Finito il lavoro, se n'è andata."] }, pl: { examples: ["Jeśli pogoda pozwoli, zjemy na dworze.", "Skończywszy pracę, wyszła."] }, tr: { examples: ["Hava izin verirse dışarıda yemek yiyeceğiz.", "İşi bittiğinde gitti."] }, id: { examples: ["Jika cuaca memungkinkan, kita akan makan di luar.", "Setelah pekerjaannya selesai, dia pergi."] }, vi: { examples: ["Nếu thời tiết cho phép, chúng ta sẽ ăn ngoài trời.", "Xong việc, cô ấy ra về."] } } }
        - { level: C2, point: { en: Comment clauses, uk: "Вставні звороти", es: "Oraciones de comentario", pt: "Orações de comentário", fr: "Incises de commentaire", de: "Kommentarsätze", it: "Proposizioni di commento", pl: "Wtrącenia komentujące", tr: "Yorum yantümceleri", id: "Klausa komentar", vi: "Mệnh đề bình luận" }, rule: { en: "fixed phrases comment on the sentence and keep their wording", uk: "стійкі вирази коментують речення й не змінюють своєї форми", es: "frases fijas comentan la oración y no cambian de forma", pt: "expressões fixas comentam a frase e mantêm a forma", fr: "des expressions figées commentent la phrase et gardent leur forme", de: "feste Wendungen kommentieren den Satz und behalten ihre Form", it: "espressioni fisse commentano la frase e mantengono la loro forma", pl: "stałe wyrażenia komentują zdanie i nie zmieniają formy", tr: "kalıplaşmış ifadeler cümleyi yorumlar ve biçimini korur", id: "ungkapan tetap mengomentari kalimat dan tidak berubah bentuk", vi: "cụm cố định bình luận về câu và giữ nguyên dạng" }, ex: [{ target: "Strictly speaking" }, ", a tomato is a fruit."], tr: { uk: "Власне кажучи, помідор — це фрукт.", es: "Estrictamente hablando, un tomate es una fruta.", pt: "A rigor, o tomate é uma fruta.", fr: "À proprement parler, la tomate est un fruit.", de: "Streng genommen ist eine Tomate eine Frucht.", it: "A rigor di termini, il pomodoro è un frutto.", pl: "Ściśle mówiąc, pomidor jest owocem.", tr: "Kesin konuşmak gerekirse domates bir meyvedir.", id: "Sebenarnya, tomat adalah buah.", vi: "Nói chính xác thì cà chua là một loại quả." } }
        - { level: C2, point: { en: After a noun, uk: "Після іменника", es: "Después de un sustantivo", pt: "Depois de um substantivo", fr: "Après un nom", de: "Nach einem Nomen", it: "Dopo un sostantivo", pl: "Po rzeczowniku", tr: "İsimden sonra", id: "Setelah kata benda", vi: "Sau danh từ" }, rule: { en: "a participle after a noun, or a chain of them, adds detail", uk: "дієприкметник після іменника або ланцюжок дієприкметників додає подробиці", es: "un participio tras un sustantivo, o una cadena de ellos, añade detalles", pt: "um particípio depois de um substantivo, ou uma cadeia deles, acrescenta detalhes", fr: "un participe après un nom, ou une série de participes, ajoute des précisions", de: "ein Partizip nach einem Nomen oder eine Kette davon fügt Einzelheiten hinzu", it: "un participio dopo un sostantivo, o una serie di participi, aggiunge dettagli", pl: "imiesłów po rzeczowniku lub ich ciąg dodaje szczegółów", tr: "isimden sonra gelen bir ortaç ya da ortaç zinciri ayrıntı ekler", id: "partisipel setelah kata benda, atau rangkaiannya, menambah rincian", vi: "một phân từ sau danh từ, hoặc một chuỗi phân từ, bổ sung chi tiết" }, ex: ["The problem ", { target: "posed by rising costs" }, ", ", { target: "compounded by falling demand" }, ", forced the firm to close."], tr: { uk: "Проблема, спричинена зростанням витрат і загострена падінням попиту, змусила фірму закритися.", es: "El problema planteado por el aumento de los costos, agravado por la caída de la demanda, obligó a la empresa a cerrar.", pt: "O problema causado pelo aumento dos custos, agravado pela queda na demanda, obrigou a empresa a fechar.", fr: "Le problème posé par la hausse des coûts, aggravé par la baisse de la demande, a forcé l’entreprise à fermer.", de: "Das durch steigende Kosten verursachte und durch sinkende Nachfrage verschärfte Problem zwang die Firma zur Schließung.", it: "Il problema posto dall'aumento dei costi, aggravato dal calo della domanda, ha costretto l'azienda a chiudere.", pl: "Problem wywołany rosnącymi kosztami i pogłębiony spadkiem popytu zmusił firmę do zamknięcia.", tr: "Artan maliyetlerin yarattığı ve düşen talebin daha da ağırlaştırdığı sorun, şirketi kapanmaya zorladı.", id: "Masalah yang ditimbulkan oleh kenaikan biaya, dan diperparah oleh turunnya permintaan, memaksa perusahaan itu tutup.", vi: "Vấn đề do chi phí tăng gây ra, lại bị làm trầm trọng thêm bởi nhu cầu giảm, đã buộc công ty phải đóng cửa." } }
        - { level: B2, point: { en: Subject, uk: "Підмет", es: "Sujeto", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }, rule: { en: "the clause shares the subject of the main clause", uk: "зворот має спільний підмет з головним реченням", es: "la oración comparte el sujeto de la oración principal", pt: "a oração compartilha o sujeito da oração principal", fr: "la proposition partage le sujet de la proposition principale", de: "der Satz teilt das Subjekt mit dem Hauptsatz", it: "la proposizione condivide il soggetto con la proposizione principale", pl: "konstrukcja ma wspólny podmiot ze zdaniem głównym", tr: "yantümce, ana cümlenin öznesini paylaşır", id: "klausa berbagi subjek dengan klausa utama", vi: "mệnh đề dùng chung chủ ngữ với mệnh đề chính" }, ex: [{ target: "Opening the box" }, ", ", { subj: Maria }, " found a note."], tr: { uk: "Відкривши коробку, Марія знайшла записку.", es: "Al abrir la caja, María encontró una nota.", pt: "Ao abrir a caixa, Maria encontrou um bilhete.", fr: "En ouvrant la boîte, Maria a trouvé un mot.", de: "Als Maria die Schachtel öffnete, fand sie eine Notiz.", it: "Aprendo la scatola, Maria ha trovato un biglietto.", pl: "Otwierając pudełko, Maria znalazła kartkę.", tr: "Kutuyu açarken Maria bir not buldu.", id: "Saat membuka kotak itu, Maria menemukan sebuah catatan.", vi: "Mở chiếc hộp ra, Maria thấy một tờ giấy nhắn." } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "a different doer needs a full clause or a new main subject", uk: "інший виконавець потребує повного речення або нового підмета в головному реченні", es: "otro agente necesita una oración completa o un nuevo sujeto principal", pt: "outro agente exige uma oração completa ou um novo sujeito principal", fr: "un autre agent demande une proposition complète ou un nouveau sujet principal", de: "ein anderer Handelnder braucht einen vollständigen Satz oder ein neues Hauptsubjekt", it: "un altro agente richiede una proposizione completa o un nuovo soggetto principale", pl: "inny wykonawca wymaga pełnego zdania lub nowego podmiotu głównego", tr: "başka bir yapan için tam cümle ya da yeni bir ana özne gerekir", id: "pelaku yang berbeda memerlukan klausa lengkap atau subjek utama yang baru", vi: "người thực hiện khác cần một mệnh đề đầy đủ hoặc một chủ ngữ chính mới" }, ex: ["Walking down the road, ", { target: "he was hit by a car" }, "."], tr: { uk: "Коли він ішов дорогою, його збила машина.", es: "Mientras caminaba por la calle, lo atropelló un auto.", pt: "Enquanto andava pela rua, ele foi atropelado por um carro.", fr: "Alors qu’il marchait sur la route, il a été renversé par une voiture.", de: "Als er die Straße entlangging, wurde er von einem Auto angefahren.", it: "Mentre camminava per la strada, è stato investito da un'auto.", pl: "Idąc drogą, został potrącony przez samochód.", tr: "Yolda yürürken bir araba tarafından çarpıldı.", id: "Saat berjalan di jalan, dia ditabrak mobil.", vi: "Đang đi trên đường, anh ấy bị ô tô đâm." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A participle clause replaces a full clause with a participle form and usually leaves out its subject.", uk: "Дієприкметниковий зворот замінює повне речення формою дієприкметника й зазвичай не має власного підмета.", es: "Una oración de participio sustituye una oración completa por una forma de participio y suele omitir su sujeto.", pt: "A oração participial substitui uma oração completa por uma forma de particípio e geralmente omite o sujeito.", fr: "Une proposition participiale remplace une proposition complète par une forme de participe et omet en général son sujet.", de: "Ein Partizipialsatz ersetzt einen vollständigen Satz durch eine Partizipform und lässt meist das Subjekt weg.", it: "La proposizione participiale sostituisce una proposizione completa con una forma participiale e di solito ne omette il soggetto.", pl: "Konstrukcja imiesłowowa zastępuje pełne zdanie formą imiesłowową i zwykle pomija jego podmiot.", tr: "Ortaç yantümcesi, tam bir cümlenin yerine bir ortaç biçimi koyar ve genellikle öznesini düşürür.", id: "Klausa partisipel menggantikan klausa lengkap dengan bentuk partisipel dan biasanya menghilangkan subjeknya.", vi: "Mệnh đề phân từ thay một mệnh đề đầy đủ bằng một dạng phân từ và thường bỏ chủ ngữ của nó." }
            ex: { equivalence: ["Because she felt tired, she went to bed.", [{ target: "Feeling tired" }, ", she went to bed."]] }
            tr: { uk: "Відчуваючи втому, вона пішла спати.", es: "Sintiéndose cansada, se fue a la cama.", pt: "Sentindo-se cansada, ela foi dormir.", fr: "Se sentant fatiguée, elle est allée se coucher.", de: "Da sie sich müde fühlte, ging sie ins Bett.", it: "Sentendosi stanca, è andata a letto.", pl: "Czując zmęczenie, poszła spać.", tr: "Kendini yorgun hissettiği için yatağa gitti.", id: "Merasa lelah, dia pergi tidur.", vi: "Cảm thấy mệt, cô ấy đi ngủ." }
          - type: rule
            level: B2
            text: { en: "Participle clauses are most common in writing; speech often uses a full clause instead.", uk: "Дієприкметникові звороти найчастіше трапляються в писемному мовленні; в усному частіше вживають повне речення.", es: "Las oraciones de participio son más comunes en la escritura; en la conversación suele usarse una oración completa.", pt: "As orações participiais são mais comuns na escrita; na fala costuma-se usar uma oração completa.", fr: "Les propositions participiales sont plus courantes à l’écrit ; à l’oral, on emploie souvent une proposition complète.", de: "Partizipialsätze sind in der Schriftsprache am häufigsten; gesprochen verwendet man oft einen vollständigen Satz.", it: "Le proposizioni participiali sono più comuni nello scritto; nel parlato si usa spesso una proposizione completa.", pl: "Konstrukcje imiesłowowe są najczęstsze w piśmie; w mowie często używa się pełnego zdania.", tr: "Ortaç yantümceleri en çok yazıda kullanılır; konuşmada çoğunlukla tam cümle tercih edilir.", id: "Klausa partisipel paling umum dalam tulisan; dalam percakapan sering dipakai klausa lengkap.", vi: "Mệnh đề phân từ phổ biến nhất trong văn viết; khi nói người ta thường dùng mệnh đề đầy đủ." }
          - type: note
            level: B2
