, the book is old."]] }, tr: { uk: { examples: ["Ідучи додому, я зустрів Тома.", "Пообідавши, ми пішли.", "Написана 1990 року, книжка вже стара."] }, es: { examples: ["Caminando a casa, me encontré con Tom.", "Tras terminar el almuerzo, nos fuimos.", "Escrito en 1990, el libro es antiguo."] }, pt: { examples: ["Andando para casa, encontrei o Tom.", "Depois de terminar o almoço, saímos.", "Escrito em 1990, o livro é antigo."] }, fr: { examples: ["En rentrant à pied, j’ai croisé Tom.", "Ayant fini de déjeuner, nous sommes partis.", "Écrit en 1990, le livre est ancien."] }, de: { examples: ["Auf dem Heimweg traf ich Tom.", "Nachdem wir zu Ende gegessen hatten, gingen wir.", "Das 1990 geschriebene Buch ist alt."] }, it: { examples: ["Camminando verso casa, ho incontrato Tom.", "Finito il pranzo, siamo andati via.", "Scritto nel 1990, il libro è vecchio."] }, pl: { examples: ["Idąc do domu, spotkałem Toma.", "Skończywszy lunch, wyszliśmy.", "Napisana w 1990 roku, książka jest stara."] }, tr: { examples: ["Eve yürürken Tom’la karşılaştım.", "Öğle yemeğini bitirince çıktık.", "1990’da yazılan kitap eskidir."] }, id: { examples: ["Saat berjalan pulang, saya bertemu Tom.", "Setelah selesai makan siang, kami pergi.", "Ditulis pada 1990, buku itu sudah tua."] }, vi: { examples: ["Trên đường đi bộ về nhà, tôi gặp Tom.", "Ăn trưa xong, chúng tôi ra về.", "Được viết năm 1990, cuốn sách đã cũ."] } } }
