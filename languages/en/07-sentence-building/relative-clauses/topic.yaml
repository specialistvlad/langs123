          - { level: B2, form: { pattern: [{ slot: noun }, { slot: past participle }] }, replaces: { en: "a passive clause: which was written, that is made", uk: "речення в пасивному стані: which was written, that is made", es: "una oración pasiva: which was written, that is made", pt: "uma oração passiva: which was written, that is made", fr: "une proposition à la voix passive : which was written, that is made", de: "ein Passivsatz: which was written, that is made", it: "una proposizione passiva: which was written, that is made", pl: "zdanie w stronie biernej: which was written, that is made", tr: "edilgen bir cümle: which was written, that is made", id: "klausa pasif: which was written, that is made", vi: "mệnh đề bị động: which was written, that is made" }, ex: { equivalence: [["The book ", { target: "written by Orwell" }, " is on the shelf."], "The book which was written by Orwell is on the shelf."] }, tr: { uk: { equivalence: ["Книга, написана Орвеллом, лежить на полиці.", "Книга, яка була написана Орвеллом, лежить на полиці."] }, es: { equivalence: ["El libro escrito por Orwell está en el estante.", "El libro que fue escrito por Orwell está en el estante."] }, pt: { equivalence: ["O livro escrito por Orwell está na estante.", "O livro que foi escrito por Orwell está na estante."] }, fr: { equivalence: ["Le livre écrit par Orwell est sur l’étagère.", "Le livre qui a été écrit par Orwell est sur l’étagère."] }, de: { equivalence: ["Das von Orwell geschriebene Buch steht im Regal.", "Das Buch, das von Orwell geschrieben wurde, steht im Regal."] }, it: { equivalence: ["Il libro scritto da Orwell è sullo scaffale.", "Il libro che è stato scritto da Orwell è sullo scaffale."] }, pl: { equivalence: ["Książka napisana przez Orwella stoi na półce.", "Książka, która została napisana przez Orwella, stoi na półce."] }, tr: { equivalence: ["Orwell’ın yazdığı kitap rafta.", "Orwell tarafından yazılmış olan kitap rafta."] }, id: { equivalence: ["Buku tulisan Orwell ada di rak.", "Buku yang ditulis oleh Orwell ada di rak."] }, vi: { equivalence: ["Cuốn sách do Orwell viết nằm trên giá sách.", "Cuốn sách được Orwell viết nằm trên giá sách."] } } }
          - { level: B2, form: { pattern: [{ slot: noun }, to, { slot: V }] }, replaces: { en: "a clause after first, last, only or a superlative", uk: "речення після first, last, only або найвищого ступеня", es: "una oración después de first, last, only o un superlativo", pt: "uma oração depois de first, last, only ou um superlativo", fr: "une proposition après first, last, only ou un superlatif", de: "ein Satz nach first, last, only oder einem Superlativ", it: "una proposizione dopo first, last, only o un superlativo", pl: "zdanie po first, last, only lub po stopniu najwyższym", tr: "first, last, only ya da bir üstünlük derecesinden sonra gelen cümle", id: "klausa setelah first, last, only atau superlatif", vi: "mệnh đề sau first, last, only hoặc một dạng so sánh nhất" }, ex: { examples: [["She was the first ", { target: "to arrive" }, "."], ["This is the best way ", { target: "to do it" }, "."]] }, tr: { uk: { examples: ["Вона була першою, хто прийшов.", "Це найкращий спосіб це зробити."] }, es: { examples: ["Ella fue la primera en llegar.", "Esta es la mejor manera de hacerlo."] }, pt: { examples: ["Ela foi a primeira a chegar.", "Esta é a melhor maneira de fazer isso."] }, fr: { examples: ["Elle a été la première à arriver.", "C’est la meilleure façon de le faire."] }, de: { examples: ["Sie war die Erste, die ankam.", "Das ist der beste Weg, es zu tun."] }, it: { examples: ["È stata la prima ad arrivare.", "Questo è il modo migliore per farlo."] }, pl: { examples: ["Przyszła jako pierwsza.", "To najlepszy sposób, żeby to zrobić."] }, tr: { examples: ["Gelen ilk kişi oydu.", "Bunu yapmanın en iyi yolu bu."] }, id: { examples: ["Dia orang pertama yang tiba.", "Ini cara terbaik untuk melakukannya."] }, vi: { examples: ["Cô ấy là người đến đầu tiên.", "Đây là cách tốt nhất để làm việc đó."] } } }
          - { level: B2, form: { pattern: [{ slot: noun }, { slot: adjective }] }, replaces: { en: "who is, who are", uk: "who is, who are", es: "who is, who are", pt: "who is, who are", fr: "who is, who are", de: "who is, who are", it: "who is, who are", pl: "who is, who are", tr: "who is, who are", id: "who is, who are", vi: "who is, who are" }, ex: { equivalence: [["The people ", { target: present }, " were happy."], "The people who were present were happy."] }, tr: { uk: { equivalence: ["Присутні люди були щасливі.", "Люди, які були присутні, були щасливі."] }, es: { equivalence: ["Las personas presentes estaban contentas.", "Las personas que estaban presentes estaban contentas."] }, pt: { equivalence: ["As pessoas presentes estavam felizes.", "As pessoas que estavam presentes estavam felizes."] }, fr: { equivalence: ["Les personnes présentes étaient heureuses.", "Les personnes qui étaient présentes étaient heureuses."] }, de: { equivalence: ["Die anwesenden Personen waren glücklich.", "Die Personen, die anwesend waren, waren glücklich."] }, it: { equivalence: ["Le persone presenti erano felici.", "Le persone che erano presenti erano felici."] }, pl: { equivalence: ["Obecne osoby były szczęśliwe.", "Osoby, które były obecne, były szczęśliwe."] }, tr: { equivalence: ["Orada bulunan insanlar mutluydu.", "Orada olan insanlar mutluydu."] }, id: { equivalence: ["Orang-orang yang hadir merasa senang.", "Orang-orang yang berada di tempat itu merasa senang."] }, vi: { equivalence: ["Những người có mặt đều vui.", "Những người đã có mặt đều vui."] } } }
          - { level: B2, form: { pattern: [{ slot: noun }, preposition, { slot: noun }] }, replaces: { en: "who has, who wears, which is", uk: "who has, who wears, which is", es: "who has, who wears, which is", pt: "who has, who wears, which is", fr: "who has, who wears, which is", de: "who has, who wears, which is", it: "who has, who wears, which is", pl: "who has, who wears, which is", tr: "who has, who wears, which is", id: "who has, who wears, which is", vi: "who has, who wears, which is" }, ex: { equivalence: [["The girl ", { target: "with the red hat" }, " is my sister."], "The girl who is wearing the red hat is my sister."] }, tr: { uk: { equivalence: ["Дівчина в червоному капелюсі — моя сестра.", "Дівчина, яка в червоному капелюсі, — моя сестра."] }, es: { equivalence: ["La chica del sombrero rojo es mi hermana.", "La chica que lleva puesto el sombrero rojo es mi hermana."] }, pt: { equivalence: ["A garota do chapéu vermelho é minha irmã.", "A garota que está usando o chapéu vermelho é minha irmã."] }, fr: { equivalence: ["La fille au chapeau rouge est ma sœur.", "La fille qui porte le chapeau rouge est ma sœur."] }, de: { equivalence: ["Das Mädchen mit dem roten Hut ist meine Schwester.", "Das Mädchen, das den roten Hut trägt, ist meine Schwester."] }, it: { equivalence: ["La ragazza con il cappello rosso è mia sorella.", "La ragazza che porta il cappello rosso è mia sorella."] }, pl: { equivalence: ["Dziewczyna w czerwonym kapeluszu to moja siostra.", "Dziewczyna, która ma na sobie czerwony kapelusz, to moja siostra."] }, tr: { equivalence: ["Kırmızı şapkalı kız kız kardeşim.", "Kırmızı şapka takan kız kız kardeşim."] }, id: { equivalence: ["Gadis bertopi merah itu saudari saya.", "Gadis yang memakai topi merah itu saudari saya."] }, vi: { equivalence: ["Cô gái đội mũ đỏ là chị gái của tôi.", "Cô gái đang đội chiếc mũ đỏ là chị gái của tôi."] } } }
