          - { level: B1, feature: { en: Leave out the object pronoun, uk: "Опущення займенника-додатка", es: "Omitir el pronombre objeto", pt: "Omitir o pronome objeto", fr: "Omettre le pronom complément", de: "Objektpronomen weglassen", it: "Omettere il pronome complemento", pl: "Pominięcie zaimka w roli dopełnienia", tr: "Nesne zamirini düşürme", id: "Menghilangkan kata ganti objek", vi: "Bỏ đại từ tân ngữ" }, defining: { en: possible, uk: "можливе", es: "posible", pt: "possível", fr: "possible", de: "möglich", it: "possibile", pl: "możliwe", tr: "olası", id: "mungkin", vi: "có thể" }, nondefining: { en: never, uk: "ніколи", es: "nunca", pt: "nunca", fr: "jamais", de: "nie", it: "mai", pl: "nigdy", tr: "asla", id: "tidak pernah", vi: "không bao giờ" } }
      - type: usage
        columns:
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, ex: ["Paris, ", { target: which }, " I visited in ", { date: May, value: "--05" }, ", is beautiful."], tr: { uk: "Париж, який я відвідав у травні, прекрасний.", es: "París, que visité en mayo, es hermoso.", pt: "Paris, que visitei em maio, é linda.", fr: "Paris, que j’ai visité en mai, est magnifique.", de: "Paris, das ich im Mai besucht habe, ist wunderschön.", it: "Parigi, che ho visitato a maggio, è bellissima.", pl: "Paryż, który odwiedziłem w maju, jest piękny.", tr: "Mayıs ayında ziyaret ettiğim Paris çok güzel.", id: "Paris, yang saya kunjungi bulan Mei, indah.", vi: "Paris, thành phố tôi đã ghé thăm vào tháng Năm, rất đẹp." } }
          - { level: B1, ex: ["Tom, ", { target: whose }, " brother is a chef, cooks well."], tr: { uk: "Том, чий брат — кухар, добре готує.", es: "Tom, cuyo hermano es cocinero, cocina bien.", pt: "Tom, cujo irmão é chef, cozinha bem.", fr: "Tom, dont le frère est cuisinier, cuisine bien.", de: "Tom, dessen Bruder Koch ist, kocht gut.", it: "Tom, il cui fratello è cuoco, cucina bene.", pl: "Tom, którego brat jest kucharzem, dobrze gotuje.", tr: "Kardeşi aşçı olan Tom iyi yemek yapar.", id: "Tom, yang kakaknya seorang koki, pandai memasak.", vi: "Tom, người có anh trai là đầu bếp, nấu ăn rất ngon." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: which }, " can refer to a whole clause:"]
              uk: [{ term: which }, " може стосуватися цілого речення:"]
              es: [{ term: which }, " puede referirse a toda una oración:"]
              pt: [{ term: "which" }, " pode se referir a toda uma oração:"]
              fr: [{ term: "which" }, " peut renvoyer à toute une proposition :"]
              de: [{ term: "which" }, " kann sich auf einen ganzen Satz beziehen:"]
              it: [{ term: "which" }, " può riferirsi a un'intera proposizione:"]
              pl: [{ term: "which" }, " może odnosić się do całego zdania:"]
              tr: [{ term: "which" }, " tüm bir cümleye de gönderme yapabilir:"]
              id: [{ term: "which" }, " dapat merujuk pada seluruh klausa:"]
              vi: [{ term: "which" }, " có thể chỉ cả một mệnh đề:"]
            ex: ["He passed the exam, ", { target: which }, " surprised everyone."]
            tr: { uk: "Він склав іспит, що всіх здивувало.", es: "Aprobó el examen, lo que sorprendió a todos.", pt: "Ele passou no exame, o que surpreendeu a todos.", fr: "Il a réussi l’examen, ce qui a surpris tout le monde.", de: "Er hat die Prüfung bestanden, was alle überraschte.", it: "Ha superato l'esame, il che ha sorpreso tutti.", pl: "Zdał egzamin, co wszystkich zaskoczyło.", tr: "Sınavı geçti, bu da herkesi şaşırttı.", id: "Dia lulus ujian, yang mengejutkan semua orang.", vi: "Anh ấy đã đỗ kỳ thi, điều này khiến mọi người ngạc nhiên." }

  - title: { en: "Form: preposition and relative pronoun", uk: "Форма: прийменник і відносний займенник", es: "Forma: preposición y pronombre relativo", pt: "Forma: preposição e pronome relativo", fr: "Forme : préposition et pronom relatif", de: "Form: Präposition und Relativpronomen", it: "Forma: preposizione e pronome relativo", pl: "Forma: przyimek i zaimek względny", tr: "Biçim: edat ve ilgi zamiri", id: "Bentuk: kata depan dan kata ganti relatif", vi: "Dạng: giới từ và đại từ quan hệ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Patrón", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu" } }
          - { key: refers, label: { en: Refers to, uk: "Стосується", es: "Se refiere a", pt: "Refere-se a", fr: "Désigne", de: "Bezieht sich auf", it: "Si riferisce a", pl: "Odnosi się do", tr: "Neyi belirtir", id: "Merujuk pada", vi: "Dùng để chỉ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [preposition, whom] }, refers: { en: people, uk: "людей", es: "personas", pt: "pessoas", fr: "personnes", de: "Personen", it: "persone", pl: "osoby", tr: "insanlar", id: "orang", vi: "người" }, ex: { examples: [["The woman ", { target: "to whom" }, " I spoke was kind."], ["The friends ", { target: "with whom" }, " I travelled live in Spain."]] }, tr: { uk: { examples: ["Жінка, з якою я розмовляв, була люб’язною.", "Друзі, з якими я подорожував, живуть в Іспанії."] }, es: { examples: ["La mujer con quien hablé fue amable.", "Los amigos con quienes viajé viven en España."] }, pt: { examples: ["A mulher com quem falei foi gentil.", "Os amigos com quem viajei moram na Espanha."] }, fr: { examples: ["La femme à qui j’ai parlé était gentille.", "Les amis avec qui j’ai voyagé habitent en Espagne."] }, de: { examples: ["Die Frau, mit der ich gesprochen habe, war freundlich.", "Die Freunde, mit denen ich gereist bin, wohnen in Spanien."] }, it: { examples: ["La donna con cui ho parlato è stata gentile.", "Gli amici con cui ho viaggiato vivono in Spagna."] }, pl: { examples: ["Kobieta, z którą rozmawiałem, była miła.", "Przyjaciele, z którymi podróżowałem, mieszkają w Hiszpanii."] }, tr: { examples: ["Konuştuğum kadın nazikti.", "Birlikte seyahat ettiğim arkadaşlar İspanya’da yaşıyor."] }, id: { examples: ["Perempuan yang saya ajak bicara itu ramah.", "Teman-teman yang bepergian bersama saya tinggal di Spanyol."] }, vi: { examples: ["Người phụ nữ mà tôi đã nói chuyện rất tốt bụng.", "Những người bạn mà tôi đã đi du lịch cùng sống ở Tây Ban Nha."] } } }
          - { level: B2, form: { pattern: [preposition, which] }, refers: { en: things, uk: "предметів", es: "cosas", pt: "coisas", fr: "choses", de: "Dinge", it: "cose", pl: "rzeczy", tr: "şeyler", id: "benda", vi: "vật" }, ex: { examples: [["The house ", { target: "in which" }, " he lives is old."], ["The pen ", { target: "with which" }, " she signed was gold."]] }, tr: { uk: { examples: ["Будинок, у якому він живе, старий.", "Ручка, якою вона підписала, була золотою."] }, es: { examples: ["La casa en la que vive es vieja.", "El bolígrafo con el que firmó era de oro."] }, pt: { examples: ["A casa em que ele mora é velha.", "A caneta com a qual ela assinou era de ouro."] }, fr: { examples: ["La maison dans laquelle il habite est vieille.", "Le stylo avec lequel elle a signé était en or."] }, de: { examples: ["Das Haus, in dem er wohnt, ist alt.", "Der Stift, mit dem sie unterschrieben hat, war aus Gold."] }, it: { examples: ["La casa in cui vive è vecchia.", "La penna con cui ha firmato era d'oro."] }, pl: { examples: ["Dom, w którym mieszka, jest stary.", "Długopis, którym podpisała, był złoty."] }, tr: { examples: ["Yaşadığı ev eski.", "İmzayı attığı kalem altından yapılmıştı."] }, id: { examples: ["Rumah tempat dia tinggal itu tua.", "Pulpen yang dia pakai untuk menandatangani itu terbuat dari emas."] }, vi: { examples: ["Ngôi nhà mà anh ấy đang sống đã cũ.", "Chiếc bút mà cô ấy dùng để ký làm bằng vàng."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Only ", { term: "whom" }, " and ", { term: "which" }, " can follow a preposition at the front; this order is formal."], uk: ["Лише ", { term: "whom" }, " і ", { term: "which" }, " можуть стояти після прийменника на початку; такий порядок слів формальний."], es: ["Solo ", { term: "whom" }, " y ", { term: "which" }, " pueden ir después de una preposición al principio; este orden es formal."], pt: ["Só ", { term: "whom" }, " e ", { term: "which" }, " podem vir depois de uma preposição no início; essa ordem é formal."], fr: ["Seuls ", { term: "whom" }, " et ", { term: "which" }, " peuvent suivre une préposition placée en tête ; cet ordre est soutenu."], de: ["Nur ", { term: "whom" }, " und ", { term: "which" }, " können einer vorangestellten Präposition folgen; diese Wortstellung ist förmlich."], it: ["Solo ", { term: "whom" }, " e ", { term: "which" }, " possono seguire una preposizione in testa; quest'ordine è formale."], pl: ["Po przyimku na początku mogą stać tylko ", { term: "whom" }, " i ", { term: "which" }, "; ten szyk jest formalny."], tr: ["Başa alınan bir edattan sonra yalnızca ", { term: "whom" }, " ve ", { term: "which" }, " gelebilir; bu sıra resmîdir."], id: ["Hanya ", { term: "whom" }, " dan ", { term: "which" }, " yang boleh mengikuti kata depan di depan; urutan ini formal."], vi: ["Chỉ ", { term: "whom" }, " và ", { term: "which" }, " có thể đứng sau giới từ đặt ở đầu; trật tự này trang trọng."] }
            ex: ["She has a car ", { target: "of which" }, " she is proud."]
            tr: { uk: "У неї є машина, якою вона пишається.", es: "Tiene un auto del que está orgullosa.", pt: "Ela tem um carro do qual se orgulha.", fr: "Elle a une voiture dont elle est fière.", de: "Sie hat ein Auto, auf das sie stolz ist.", it: "Ha un'auto di cui è orgogliosa.", pl: "Ma samochód, z którego jest dumna.", tr: "Gurur duyduğu bir arabası var.", id: "Dia punya mobil yang dia banggakan.", vi: "Cô ấy có một chiếc xe mà cô ấy tự hào." }

  - title: { en: "Form: quantifier and whom or which", uk: "Форма: кількісне слово і whom або which", es: "Forma: cuantificador y whom o which", pt: "Forma: quantificador e whom ou which", fr: "Forme : quantificateur et whom ou which", de: "Form: Mengenwort und whom oder which", it: "Forma: quantificatore e whom o which", pl: "Forma: określnik ilości i whom lub which", tr: "Biçim: miktar sözcüğü ve whom ya da which", id: "Bentuk: quantifier dan whom atau which", vi: "Dạng: lượng từ và whom hoặc which" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Patrón", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu" } }
          - { key: refers, label: { en: Refers to, uk: "Стосується", es: "Se refiere a", pt: "Refere-se a", fr: "Désigne", de: "Bezieht sich auf", it: "Si riferisce a", pl: "Odnosi się do", tr: "Neyi belirtir", id: "Merujuk pada", vi: "Dùng để chỉ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [{ alternatives: [some, many, all, none, both, neither, the majority] }, of, whom] }, refers: { en: people, uk: "людей", es: "personas", pt: "pessoas", fr: "personnes", de: "Personen", it: "persone", pl: "osoby", tr: "insanlar", id: "orang", vi: "người" }, ex: { examples: [["The guests, ", { target: "some of whom" }, " had travelled far, were tired."], ["She has two sons, ", { target: "both of whom" }, " live abroad."]] }, tr: { uk: { examples: ["Гості, дехто з яких приїхав здалеку, були втомлені.", "У неї двоє синів, обидва з яких живуть за кордоном."] }, es: { examples: ["Los invitados, algunos de los cuales habían viajado desde lejos, estaban cansados.", "Tiene dos hijos, los dos viven en el extranjero."] }, pt: { examples: ["Os convidados, alguns dos quais tinham viajado de longe, estavam cansados.", "Ela tem dois filhos, ambos moram no exterior."] }, fr: { examples: ["Les invités, dont certains avaient voyagé de loin, étaient fatigués.", "Elle a deux fils, qui vivent tous les deux à l’étranger."] }, de: { examples: ["Die Gäste, von denen einige weit gereist waren, waren müde.", "Sie hat zwei Söhne, die beide im Ausland leben."] }, it: { examples: ["Gli ospiti, alcuni dei quali avevano viaggiato da lontano, erano stanchi.", "Ha due figli, che vivono entrambi all'estero."] }, pl: { examples: ["Goście, z których niektórzy przyjechali z daleka, byli zmęczeni.", "Ma dwóch synów, którzy obaj mieszkają za granicą."] }, tr: { examples: ["Bazıları uzaktan gelen konuklar yorgundu.", "İkisi de yurt dışında yaşayan iki oğlu var."] }, id: { examples: ["Para tamu, yang sebagian di antaranya datang dari jauh, tampak lelah.", "Dia punya dua anak laki-laki, yang keduanya tinggal di luar negeri."] }, vi: { examples: ["Các vị khách, trong đó có vài người đã đi một quãng đường xa, đều mệt.", "Cô ấy có hai con trai, cả hai đều sống ở nước ngoài."] } } }
          - { level: B2, form: { pattern: [{ alternatives: [some, many, all, none, both, neither, the majority] }, of, which] }, refers: { en: things, uk: "предметів", es: "cosas", pt: "coisas", fr: "choses", de: "Dinge", it: "cose", pl: "rzeczy", tr: "şeyler", id: "benda", vi: "vật" }, ex: { examples: [["I bought two books, ", { target: "neither of which" }, " was cheap."], ["The shops, ", { target: "many of which" }, " were closed, looked empty."]] }, tr: { uk: { examples: ["Я купив дві книги, жодна з яких не була дешевою.", "Магазини, багато з яких були зачинені, виглядали порожніми."] }, es: { examples: ["Compré dos libros, ninguno de los cuales era barato.", "Las tiendas, muchas de las cuales estaban cerradas, se veían vacías."] }, pt: { examples: ["Comprei dois livros, nenhum dos quais era barato.", "As lojas, muitas das quais estavam fechadas, pareciam vazias."] }, fr: { examples: ["J’ai acheté deux livres, dont aucun n’était bon marché.", "Les magasins, dont beaucoup étaient fermés, semblaient vides."] }, de: { examples: ["Ich habe zwei Bücher gekauft, von denen keines billig war.", "Die Geschäfte, von denen viele geschlossen waren, wirkten leer."] }, it: { examples: ["Ho comprato due libri, nessuno dei quali era economico.", "I negozi, molti dei quali erano chiusi, sembravano vuoti."] }, pl: { examples: ["Kupiłem dwie książki, z których żadna nie była tania.", "Sklepy, z których wiele było zamkniętych, wyglądały na puste."] }, tr: { examples: ["İki kitap aldım ama hiçbiri ucuz değildi.", "Birçoğu kapalı olan dükkânlar boş görünüyordu."] }, id: { examples: ["Saya membeli dua buku, yang tidak satu pun murah.", "Toko-toko, yang banyak di antaranya tutup, tampak kosong."] }, vi: { examples: ["Tôi đã mua hai cuốn sách, không cuốn nào rẻ.", "Các cửa hàng, nhiều cửa hàng trong số đó đóng cửa, trông trống trải."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "These clauses are non-defining, so a comma comes before the quantifier.", uk: "Ці речення необмежувальні, тому перед кількісним словом стоїть кома.", es: "Estas oraciones son explicativas, así que va una coma antes del cuantificador.", pt: "Essas orações são explicativas, por isso há uma vírgula antes do quantificador.", fr: "Ces propositions sont explicatives, donc une virgule précède le quantificateur.", de: "Diese Relativsätze sind nicht notwendig, deshalb steht vor dem Mengenwort ein Komma.", it: "Queste proposizioni sono non restrittive, quindi c'è una virgola prima del quantificatore.", pl: "To zdania niedefiniujące, więc przed określnikiem ilości stoi przecinek.", tr: "Bu cümleler açıklayıcıdır; bu yüzden miktar sözcüğünden önce virgül gelir.", id: "Klausa ini tidak membatasi, jadi ada koma sebelum quantifier.", vi: "Đây là các mệnh đề không xác định, nên có dấu phẩy trước lượng từ." }
            ex: ["He has three cars, ", { target: "all of which" }, " are red."]
            tr: { uk: "У нього три машини, усі червоні.", es: "Tiene tres autos, todos ellos rojos.", pt: "Ele tem três carros, todos vermelhos.", fr: "Il a trois voitures, qui sont toutes rouges.", de: "Er hat drei Autos, die alle rot sind.", it: "Ha tre auto, tutte rosse.", pl: "Ma trzy samochody, wszystkie czerwone.", tr: "Üç arabası var, hepsi kırmızı.", id: "Dia punya tiga mobil, yang semuanya merah.", vi: "Anh ấy có ba chiếc xe, tất cả đều màu đỏ." }

  - title: { en: "Form: when, where, why and the way", uk: "Форма: when, where, why і the way", es: "Forma: when, where, why y the way", pt: "Forma: when, where, why e the way", fr: "Forme : when, where, why et the way", de: "Form: when, where, why und the way", it: "Forma: when, where, why e the way", pl: "Forma: when, where, why i the way", tr: "Biçim: when, where, why ve the way", id: "Bentuk: when, where, why dan the way", vi: "Dạng: when, where, why và the way" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: after, label: { en: After, uk: "Після", es: "Después de", pt: "Depois de", fr: "Après", de: "Nach", it: "Dopo", pl: "Po", tr: "Şundan sonra", id: "Setelah", vi: "Sau" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, word: when, after: { en: "a time noun: day, year, moment", uk: "іменник, що означає час: day, year, moment", es: "un sustantivo de tiempo: day, year, moment", pt: "um substantivo de tempo: day, year, moment", fr: "un nom de temps : day, year, moment", de: "ein Nomen der Zeit: day, year, moment", it: "un sostantivo di tempo: day, year, moment", pl: "rzeczownik określający czas: day, year, moment", tr: "zaman bildiren bir isim: day, year, moment", id: "kata benda waktu: day, year, moment", vi: "danh từ chỉ thời gian: day, year, moment" }, ex: ["I remember the day ", { optional: when }, " we met."], tr: { uk: "Я пам’ятаю день, коли ми познайомилися.", es: "Recuerdo el día en que nos conocimos.", pt: "Lembro do dia em que nos conhecemos.", fr: "Je me souviens du jour où nous nous sommes rencontrés.", de: "Ich erinnere mich an den Tag, an dem wir uns kennengelernt haben.", it: "Ricordo il giorno in cui ci siamo conosciuti.", pl: "Pamiętam dzień, w którym się poznaliśmy.", tr: "Tanıştığımız günü hatırlıyorum.", id: "Saya ingat hari ketika kami bertemu.", vi: "Tôi nhớ ngày chúng tôi gặp nhau." } }
