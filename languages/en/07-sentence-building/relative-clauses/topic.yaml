          - type: rule
            level: B1
            text:
              en: In everyday English the preposition goes to the end of the clause.
              uk: "У повсякденній англійській прийменник стоїть наприкінці підрядного речення."
              es: "En el inglés cotidiano la preposición va al final de la oración."
