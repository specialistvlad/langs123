          - { level: B2, form: which means, use: { en: "the result of the first clause", uk: "наслідок першого речення", es: "el resultado de la primera oración", pt: "o resultado da primeira oração", fr: "la conséquence de la première proposition", de: "die Folge des ersten Satzes", it: "il risultato della prima proposizione", pl: "skutek pierwszego zdania", tr: "birinci cümlenin sonucu", id: "akibat dari klausa pertama", vi: "kết quả của mệnh đề thứ nhất" }, ex: ["The shop is closed, ", { target: "which means" }, " we can't buy it."], tr: { uk: "Магазин зачинений, а це означає, що ми не можемо цього купити.", es: "La tienda está cerrada, lo que significa que no podemos comprarlo.", pt: "A loja está fechada, o que significa que não podemos comprá-lo.", fr: "Le magasin est fermé, ce qui signifie que nous ne pouvons pas l’acheter.", de: "Das Geschäft ist geschlossen, was bedeutet, dass wir es nicht kaufen können.", it: "Il negozio è chiuso, il che significa che non possiamo comprarlo.", pl: "Sklep jest zamknięty, co oznacza, że nie możemy tego kupić.", tr: "Dükkân kapalı, bu da onu alamayacağımız anlamına geliyor.", id: "Tokonya tutup, yang berarti kita tidak bisa membelinya.", vi: "Cửa hàng đóng cửa, nghĩa là chúng ta không thể mua nó." } }

