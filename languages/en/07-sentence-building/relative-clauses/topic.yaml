          - { level: C1, form: { pattern: [{ slot: noun }, to, { slot: V }, preposition] }, use: { en: "the noun is the object of the preposition", uk: "іменник — додаток прийменника", es: "el sustantivo es el objeto de la preposición", pt: "o substantivo é o objeto da preposição", fr: "le nom est le complément de la préposition", de: "das Nomen ist das Objekt der Präposition", it: "il sostantivo è il complemento della preposizione", pl: "rzeczownik jest dopełnieniem przyimka", tr: "isim, edatın nesnesidir", id: "kata benda adalah objek kata depan", vi: "danh từ là tân ngữ của giới từ" }, ex: { examples: [["I need a place ", { target: "to live in" }, "."], ["I need someone ", { target: "to talk to" }, "."]] }, tr: { uk: { examples: ["Мені потрібне місце, де жити.", "Мені потрібен хтось, з ким можна поговорити."] }, es: { examples: ["Necesito un lugar donde vivir.", "Necesito a alguien con quien hablar."] }, pt: { examples: ["Preciso de um lugar para morar.", "Preciso de alguém com quem conversar."] }, fr: { examples: ["J’ai besoin d’un endroit où habiter.", "J’ai besoin de quelqu’un à qui parler."] }, de: { examples: ["Ich brauche einen Ort zum Wohnen.", "Ich brauche jemanden zum Reden."] }, it: { examples: ["Ho bisogno di un posto in cui vivere.", "Ho bisogno di qualcuno con cui parlare."] }, pl: { examples: ["Potrzebuję miejsca, w którym będę mieszkać.", "Potrzebuję kogoś, z kim mógłbym porozmawiać."] }, tr: { examples: ["Yaşayacak bir yere ihtiyacım var.", "Konuşacak birine ihtiyacım var."] }, id: { examples: ["Saya butuh tempat untuk tinggal.", "Saya butuh seseorang untuk diajak bicara."] }, vi: { examples: ["Tôi cần một nơi để ở.", "Tôi cần một người để trò chuyện cùng."] } } }
          - { level: C1, form: { pattern: [{ slot: noun }, to, { slot: V }] }, use: { en: "the person or thing that the infinitive is about", uk: "особа чи предмет, до яких належить дія інфінітива", es: "la persona o cosa a la que se refiere el infinitivo", pt: "a pessoa ou coisa a que o infinitivo se refere", fr: "la personne ou la chose dont parle l’infinitif", de: "die Person oder Sache, auf die sich der Infinitiv bezieht", it: "la persona o la cosa a cui si riferisce l'infinito", pl: "osoba lub rzecz, której dotyczy bezokolicznik", tr: "mastarın ilgili olduğu kişi ya da şey", id: "orang atau benda yang dibicarakan oleh infinitif", vi: "người hoặc vật mà động từ nguyên mẫu nói đến" }, ex: ["She is the best person ", { target: "to ask" }, "."], tr: { uk: "Вона — найкраща людина, у якої можна спитати.", es: "Ella es la mejor persona a quien preguntar.", pt: "Ela é a melhor pessoa a quem perguntar.", fr: "Elle est la meilleure personne à qui s’adresser.", de: "Sie ist die beste Person, die man fragen kann.", it: "È la persona migliore a cui chiedere.", pl: "Ona jest najlepszą osobą, którą można zapytać.", tr: "Sorulacak en iyi kişi o.", id: "Dia orang terbaik untuk ditanyai.", vi: "Cô ấy là người tốt nhất để hỏi." } }
          - { level: C1, form: { pattern: [{ slot: noun }, { slot: subject }, { slot: V }, preposition] }, use: { en: "the preposition stays at the end of the clause", uk: "прийменник залишається наприкінці речення", es: "la preposición se queda al final de la oración", pt: "a preposição fica no fim da oração", fr: "la préposition reste à la fin de la proposition", de: "die Präposition bleibt am Ende des Satzes", it: "la preposizione resta alla fine della proposizione", pl: "przyimek zostaje na końcu zdania", tr: "edat cümlenin sonunda kalır", id: "kata depan tetap di akhir klausa", vi: "giới từ vẫn đứng ở cuối mệnh đề" }, ex: ["That is the person ", { target: "I'm waiting for" }, "."], tr: { uk: "Ось людина, на яку я чекаю.", es: "Esa es la persona a la que estoy esperando.", pt: "Essa é a pessoa que estou esperando.", fr: "C’est la personne que j’attends.", de: "Das ist die Person, auf die ich warte.", it: "Quella è la persona che sto aspettando.", pl: "To jest osoba, na którą czekam.", tr: "Beklediğim kişi o.", id: "Itulah orang yang saya tunggu.", vi: "Đó là người tôi đang chờ." } }
          - { level: C1, form: { pattern: [{ slot: noun }, { slot: subject }, phrasal verb] }, use: { en: "a phrasal verb keeps its particle and preposition together", uk: "фразове дієслово тримає частку й прийменник разом", es: "un phrasal verb mantiene juntas la partícula y la preposición", pt: "um phrasal verb mantém juntas a partícula e a preposição", fr: "un phrasal verb garde sa particule et sa préposition ensemble", de: "ein Phrasal Verb behält Partikel und Präposition zusammen", it: "un phrasal verb tiene insieme la particella e la preposizione", pl: "czasownik frazowy zachowuje przy sobie partykułę i przyimek", tr: "phrasal verb, parçacığını ve edatını bir arada tutar", id: "phrasal verb mempertahankan partikel dan kata depannya bersama", vi: "cụm động từ giữ tiểu từ và giới từ đi liền nhau" }, ex: ["This is the plan ", { target: "we came up with" }, "."], tr: { uk: "Це план, який ми придумали.", es: "Este es el plan que se nos ocurrió.", pt: "Este é o plano que bolamos.", fr: "Voilà le plan que nous avons imaginé.", de: "Das ist der Plan, den wir uns ausgedacht haben.", it: "Questo è il piano che abbiamo ideato.", pl: "To jest plan, który wymyśliliśmy.", tr: "Bu, bulduğumuz plan.", id: "Ini rencana yang kami buat.", vi: "Đây là kế hoạch mà chúng tôi nghĩ ra." } }

  - title: { en: "Form: extraposed relative clauses", uk: "Форма: означальні речення, винесені в кінець", es: "Forma: oraciones de relativo pospuestas", pt: "Forma: orações relativas deslocadas para o fim", fr: "Forme : propositions relatives rejetées en fin de phrase", de: "Form: ans Satzende gestellte Relativsätze", it: "Forma: proposizioni relative spostate in fondo", pl: "Forma: zdania względne przeniesione na koniec", tr: "Biçim: sona taşınan ilgi cümleleri", id: "Bentuk: klausa relatif yang dipindahkan ke akhir", vi: "Dạng: mệnh đề quan hệ chuyển xuống cuối câu" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { en: "after a short verb", uk: "після короткого дієслова", es: "después de un verbo corto", pt: "depois de um verbo curto", fr: "après un verbe court", de: "nach einem kurzen Verb", it: "dopo un verbo breve", pl: "po krótkim czasowniku", tr: "kısa bir fiilden sonra", id: "setelah kata kerja pendek", vi: "sau một động từ ngắn" }, use: { en: "the clause is long, so it moves to the end", uk: "речення довге, тому його переносять у кінець", es: "la oración es larga, por eso pasa al final", pt: "a oração é longa, por isso vai para o fim", fr: "la proposition est longue, elle passe donc à la fin", de: "der Satz ist lang, deshalb rückt er ans Ende", it: "la proposizione è lunga, perciò va in fondo", pl: "zdanie jest długie, więc przesuwa się na koniec", tr: "cümle uzundur, bu yüzden sona taşınır", id: "klausanya panjang, jadi dipindahkan ke akhir", vi: "mệnh đề dài nên được chuyển xuống cuối" }, ex: ["A man came in ", { target: "who looked ill" }, "."], tr: { uk: "Увійшов чоловік, який виглядав хворим.", es: "Entró un hombre que parecía enfermo.", pt: "Entrou um homem que parecia doente.", fr: "Un homme est entré, qui avait l’air malade.", de: "Ein Mann kam herein, der krank aussah.", it: "È entrato un uomo che sembrava malato.", pl: "Wszedł mężczyzna, który wyglądał na chorego.", tr: "Hasta görünen bir adam içeri girdi.", id: "Seorang pria masuk yang tampak sakit.", vi: "Một người đàn ông trông có vẻ ốm bước vào." } }
          - { level: C1, form: { en: "after a passive verb", uk: "після дієслова в пасиві", es: "después de un verbo pasivo", pt: "depois de um verbo passivo", fr: "après un verbe passif", de: "nach einem Passivverb", it: "dopo un verbo passivo", pl: "po czasowniku w stronie biernej", tr: "edilgen bir fiilden sonra", id: "setelah kata kerja pasif", vi: "sau một động từ bị động" }, use: { en: "the clause adds news about a new thing", uk: "речення повідомляє новину про щось нове", es: "la oración da información nueva sobre algo nuevo", pt: "a oração traz informação nova sobre algo novo", fr: "la proposition apporte une information nouvelle sur quelque chose de nouveau", de: "der Satz bringt Neues über eine neue Sache", it: "la proposizione dà un'informazione nuova su qualcosa di nuovo", pl: "zdanie podaje nową informację o czymś nowym", tr: "cümle yeni bir şey hakkında yeni bilgi verir", id: "klausa memberi kabar baru tentang hal yang baru", vi: "mệnh đề đưa ra thông tin mới về một điều mới" }, ex: ["A book has been published ", { target: "which explains this" }, "."], tr: { uk: "Вийшла книга, яка це пояснює.", es: "Se ha publicado un libro que explica esto.", pt: "Foi publicado um livro que explica isso.", fr: "Un livre a été publié qui explique cela.", de: "Es ist ein Buch erschienen, das dies erklärt.", it: "È stato pubblicato un libro che spiega questo.", pl: "Opublikowano książkę, która to wyjaśnia.", tr: "Bunu açıklayan bir kitap yayımlandı.", id: "Sebuah buku telah diterbitkan yang menjelaskan hal ini.", vi: "Một cuốn sách giải thích điều này vừa được xuất bản." } }
          - { level: C1, form: { en: "after the noun time", uk: "після іменника time", es: "después del sustantivo time", pt: "depois do substantivo time", fr: "après le nom time", de: "nach dem Nomen time", it: "dopo il sostantivo time", pl: "po rzeczowniku time", tr: "time isminden sonra", id: "setelah kata benda time", vi: "sau danh từ time" }, use: { en: "formal: the clause names the time", uk: "формальний стиль: речення називає час", es: "formal: la oración indica el momento", pt: "formal: a oração indica o momento", fr: "style soutenu : la proposition nomme le moment", de: "förmlich: der Satz nennt den Zeitpunkt", it: "formale: la proposizione indica il momento", pl: "styl formalny: zdanie wskazuje czas", tr: "resmî: cümle zamanı belirtir", id: "formal: klausa menyebutkan waktunya", vi: "trang trọng: mệnh đề nêu rõ thời điểm" }, ex: ["The time has come ", { target: "when we must act" }, "."], tr: { uk: "Настав час, коли ми повинні діяти.", es: "Ha llegado el momento en que debemos actuar.", pt: "Chegou a hora em que devemos agir.", fr: "Le moment est venu où nous devons agir.", de: "Die Zeit ist gekommen, in der wir handeln müssen.", it: "È venuto il momento in cui dobbiamo agire.", pl: "Nadszedł czas, w którym musimy działać.", tr: "Harekete geçmemiz gereken zaman geldi.", id: "Saatnya telah tiba ketika kita harus bertindak.", vi: "Đã đến lúc chúng ta phải hành động." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The relative clause moves to the end when the rest of the sentence is short.", uk: "Означальне речення переходить у кінець, коли решта речення коротка.", es: "La oración de relativo pasa al final cuando el resto de la oración es corta.", pt: "A oração relativa vai para o fim quando o resto da frase é curto.", fr: "La proposition relative passe à la fin quand le reste de la phrase est court.", de: "Der Relativsatz rückt ans Ende, wenn der Rest des Satzes kurz ist.", it: "La proposizione relativa va in fondo quando il resto della frase è breve.", pl: "Zdanie względne przesuwa się na koniec, gdy reszta zdania jest krótka.", tr: "Cümlenin geri kalanı kısaysa ilgi cümlesi sona taşınır.", id: "Klausa relatif dipindahkan ke akhir ketika bagian kalimat yang lain pendek.", vi: "Mệnh đề quan hệ chuyển xuống cuối khi phần còn lại của câu ngắn." }

  - title: { en: "Form: those who and anyone who", uk: "Форма: those who і anyone who", es: "Forma: those who y anyone who", pt: "Forma: those who e anyone who", fr: "Forme : those who et anyone who", de: "Form: those who und anyone who", it: "Forma: those who e anyone who", pl: "Forma: those who i anyone who", tr: "Biçim: those who ve anyone who", id: "Bentuk: those who dan anyone who", vi: "Dạng: those who và anyone who" }
