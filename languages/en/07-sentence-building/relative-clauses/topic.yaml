          - { level: B1, feature: { en: Commas, uk: "Коми", es: "Comas", pt: "Vírgulas", fr: "Virgules", de: "Kommas", it: "Virgole", pl: "Przecinki", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }, defining: { en: none, uk: "немає", es: "ninguna", pt: "nenhuma", fr: "aucune", de: "keine", it: "nessuna", pl: "brak", tr: "yok", id: "tidak ada", vi: "không có" }, nondefining: { en: "yes, and a pause in speech", uk: "є, а в мовленні — пауза", es: "sí, y una pausa al hablar", pt: "sim, e uma pausa na fala", fr: "oui, et une pause à l’oral", de: "ja, und eine Pause beim Sprechen", it: "sì, e una pausa nel parlato", pl: "tak, a w mowie — pauza", tr: "var, konuşmada da duraklama", id: "ya, dan ada jeda saat berbicara", vi: "có, và ngắt giọng khi nói" } }
