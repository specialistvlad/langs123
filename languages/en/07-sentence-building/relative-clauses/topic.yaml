        rows:
          - { level: C1, form: those who, refers: { en: "people in general, plural", uk: "люди загалом, множина", es: "las personas en general, plural", pt: "as pessoas em geral, plural", fr: "les gens en général, pluriel", de: "Menschen allgemein, Plural", it: "le persone in generale, plurale", pl: "ludzie w ogóle, liczba mnoga", tr: "genel olarak insanlar, çoğul", id: "orang pada umumnya, jamak", vi: "người nói chung, số nhiều" }, ex: [{ target: "Those who" }, " work hard usually succeed."], tr: { uk: "Ті, хто наполегливо працює, зазвичай досягають успіху.", es: "Quienes trabajan duro suelen tener éxito.", pt: "Quem trabalha duro costuma ter sucesso.", fr: "Ceux qui travaillent dur réussissent généralement.", de: "Diejenigen, die hart arbeiten, haben meistens Erfolg.", it: "Chi lavora sodo di solito ha successo.", pl: "Ci, którzy ciężko pracują, zwykle odnoszą sukces.", tr: "Çok çalışanlar genellikle başarılı olur.", id: "Mereka yang bekerja keras biasanya berhasil.", vi: "Những người làm việc chăm chỉ thường thành công." } }
          - { level: C1, form: { alternatives: [anyone who, everyone who, someone who] }, refers: { en: "a person or people with this quality", uk: "особа або люди з цією якістю", es: "una persona o personas con esta cualidad", pt: "uma pessoa ou pessoas com essa qualidade", fr: "une personne ou des personnes ayant cette qualité", de: "eine Person oder Personen mit dieser Eigenschaft", it: "una persona o più persone con questa qualità", pl: "osoba lub osoby o tej cesze", tr: "bu niteliğe sahip bir kişi ya da kişiler", id: "seseorang atau orang-orang dengan sifat ini", vi: "một người hoặc những người có đặc điểm này" }, ex: { examples: [[{ target: "Anyone who" }, " wants to join should sign here."], [{ target: "Everyone who" }, " came enjoyed it."]] }, tr: { uk: { examples: ["Кожен, хто хоче приєднатися, має розписатися тут.", "Усі, хто прийшов, залишилися задоволені."] }, es: { examples: ["Quien quiera unirse debe firmar aquí.", "Todos los que vinieron lo disfrutaron."] }, pt: { examples: ["Quem quiser participar deve assinar aqui.", "Todos que vieram gostaram."] }, fr: { examples: ["Quiconque veut participer doit signer ici.", "Tous ceux qui sont venus ont apprécié."] }, de: { examples: ["Wer mitmachen möchte, soll hier unterschreiben.", "Alle, die gekommen sind, hatten Spaß."] }, it: { examples: ["Chiunque voglia partecipare deve firmare qui.", "Tutti quelli che sono venuti si sono divertiti."] }, pl: { examples: ["Każdy, kto chce dołączyć, powinien się tu podpisać.", "Wszyscy, którzy przyszli, dobrze się bawili."] }, tr: { examples: ["Katılmak isteyen herkes buraya imza atmalı.", "Gelen herkes keyif aldı."] }, id: { examples: ["Siapa pun yang ingin bergabung harus menandatangani di sini.", "Semua orang yang datang menikmatinya."] }, vi: { examples: ["Ai muốn tham gia thì hãy ký tên ở đây.", "Mọi người đã đến đều thích."] } } }
          - { level: C1, form: all who, refers: { en: "every person in a group, in formal style", uk: "кожна особа в групі, формальний стиль", es: "cada persona de un grupo, en estilo formal", pt: "cada pessoa de um grupo, em estilo formal", fr: "chaque personne d’un groupe, en style soutenu", de: "jede Person in einer Gruppe, im förmlichen Stil", it: "ogni persona di un gruppo, in stile formale", pl: "każda osoba w grupie, w stylu formalnym", tr: "bir gruptaki herkes; resmî üslupta", id: "setiap orang dalam kelompok, dalam gaya formal", vi: "mọi người trong một nhóm, theo văn phong trang trọng" }, ex: [{ target: "All who" }, " enter must sign in."], tr: { uk: "Усі, хто входить, повинні зареєструватися.", es: "Todos los que entren deben registrarse.", pt: "Todos que entrarem devem se registrar.", fr: "Tous ceux qui entrent doivent s’inscrire.", de: "Alle, die eintreten, müssen sich eintragen.", it: "Tutti coloro che entrano devono registrarsi.", pl: "Wszyscy wchodzący muszą się wpisać.", tr: "İçeri giren herkes kayıt yaptırmalı.", id: "Semua yang masuk harus mendaftar.", vi: "Tất cả những ai vào đều phải đăng ký." } }
          - { level: C1, form: he who, refers: { en: "anyone, in proverbs and old style", uk: "будь-хто, у прислів’ях і застарілому стилі", es: "cualquiera, en refranes y en estilo antiguo", pt: "qualquer pessoa, em provérbios e em estilo antigo", fr: "n’importe qui, dans les proverbes et le style ancien", de: "jeder, in Sprichwörtern und im alten Stil", it: "chiunque, nei proverbi e in stile antico", pl: "każdy, w przysłowiach i stylu staroświeckim", tr: "herhangi biri; atasözlerinde ve eski üslupta", id: "siapa saja, dalam peribahasa dan gaya lama", vi: "bất kỳ ai, trong tục ngữ và văn phong cổ" }, ex: [{ target: "He who" }, " hesitates is lost."], tr: { uk: "Хто вагається, той програє.", es: "Quien duda está perdido.", pt: "Quem hesita está perdido.", fr: "Qui hésite est perdu.", de: "Wer zögert, ist verloren.", it: "Chi esita è perduto.", pl: "Kto się waha, ten przegrywa.", tr: "Tereddüt eden kaybeder.", id: "Siapa yang ragu-ragu akan kalah.", vi: "Ai do dự là thua." } }

