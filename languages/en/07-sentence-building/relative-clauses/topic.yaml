      rows:
        - { level: B1, point: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }, rule: { en: [{ pattern: [{ slot: noun }, { alternatives: [{ term: who }, { term: which }, { term: that }] }, { slot: clause }] }, "; right after the noun"], uk: [{ pattern: [{ slot: noun }, { alternatives: [{ term: who }, { term: which }, { term: that }] }, { slot: clause }] }, "; одразу після іменника"], es: [{ pattern: [{ slot: noun }, { alternatives: [{ term: who }, { term: which }, { term: that }] }, { slot: clause }] }, "; justo después del sustantivo"], pt: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; logo depois do substantivo"], fr: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, " ; juste après le nom"], de: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; direkt nach dem Nomen"], it: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; subito dopo il sostantivo"], pl: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; zaraz po rzeczowniku"], tr: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; isimden hemen sonra gelir"], id: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; tepat setelah kata benda"], vi: [{ pattern: [{ slot: "noun" }, { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, { slot: "clause" }] }, "; đứng ngay sau danh từ"] }, ex: ["The woman ", { target: who lives next door }, " is a nurse."], tr: { uk: "Жінка, яка живе по сусідству, — медсестра.", es: "La mujer que vive al lado es enfermera.", pt: "A mulher que mora ao lado é enfermeira.", fr: "La femme qui habite à côté est infirmière.", de: "Die Frau, die nebenan wohnt, ist Krankenschwester.", it: "La donna che abita accanto è un'infermiera.", pl: "Kobieta, która mieszka obok, jest pielęgniarką.", tr: "Yan dairede oturan kadın hemşiredir.", id: "Perempuan yang tinggal di sebelah adalah perawat.", vi: "Người phụ nữ sống cạnh nhà là y tá." } }
        - { level: B1, point: "who, which", rule: { en: [{ term: who }, " for people, ", { term: which }, " for things"], uk: [{ term: who }, " для людей, ", { term: which }, " для предметів"], es: [{ term: who }, " para personas, ", { term: which }, " para cosas"], pt: [{ term: "who" }, " para pessoas, ", { term: "which" }, " para coisas"], fr: [{ term: "who" }, " pour les personnes, ", { term: "which" }, " pour les choses"], de: [{ term: "who" }, " für Personen, ", { term: "which" }, " für Dinge"], it: [{ term: "who" }, " per le persone, ", { term: "which" }, " per le cose"], pl: [{ term: "who" }, " dla osób, ", { term: "which" }, " dla rzeczy"], tr: [{ term: "who" }, " insanlar için, ", { term: "which" }, " şeyler için"], id: [{ term: "who" }, " untuk orang, ", { term: "which" }, " untuk benda"], vi: [{ term: "who" }, " cho người, ", { term: "which" }, " cho vật"] }, ex: { examples: [["The woman ", { target: who }, " lives next door is a nurse."], ["The book ", { target: which }, " I bought was cheap."]] }, tr: { uk: { examples: ["Жінка, яка живе по сусідству, — медсестра.", "Книга, яку я купив, була дешевою."] }, es: { examples: ["La mujer que vive al lado es enfermera.", "El libro que compré era barato."] }, pt: { examples: ["A mulher que mora ao lado é enfermeira.", "O livro que comprei era barato."] }, fr: { examples: ["La femme qui habite à côté est infirmière.", "Le livre que j’ai acheté était bon marché."] }, de: { examples: ["Die Frau, die nebenan wohnt, ist Krankenschwester.", "Das Buch, das ich gekauft habe, war billig."] }, it: { examples: ["La donna che abita accanto è un'infermiera.", "Il libro che ho comprato era economico."] }, pl: { examples: ["Kobieta, która mieszka obok, jest pielęgniarką.", "Książka, którą kupiłem, była tania."] }, tr: { examples: ["Yan dairede oturan kadın hemşiredir.", "Aldığım kitap ucuzdu."] }, id: { examples: ["Perempuan yang tinggal di sebelah adalah perawat.", "Buku yang saya beli itu murah."] }, vi: { examples: ["Người phụ nữ sống cạnh nhà là y tá.", "Cuốn sách tôi đã mua rất rẻ."] } } }
        - { level: B1, point: that, rule: { en: "people or things, in defining clauses only", uk: "люди або предмети, лише в обмежувальних реченнях", es: "personas o cosas, solo en oraciones especificativas", pt: "pessoas ou coisas, só em orações restritivas", fr: "personnes ou choses, seulement dans les propositions déterminatives", de: "Personen oder Dinge, nur in notwendigen Relativsätzen", it: "persone o cose, solo nelle proposizioni restrittive", pl: "osoby lub rzeczy, tylko w zdaniach definiujących", tr: "insanlar veya şeyler; yalnızca belirleyici cümlelerde", id: "orang atau benda, hanya dalam klausa yang membatasi", vi: "người hoặc vật, chỉ trong mệnh đề xác định" }, ex: ["The film ", { target: that }, " we saw was long."], tr: { uk: "Фільм, який ми дивилися, був довгим.", es: "La película que vimos era larga.", pt: "O filme que vimos era longo.", fr: "Le film que nous avons vu était long.", de: "Der Film, den wir gesehen haben, war lang.", it: "Il film che abbiamo visto era lungo.", pl: "Film, który oglądaliśmy, był długi.", tr: "İzlediğimiz film uzundu.", id: "Film yang kami tonton itu panjang.", vi: "Bộ phim chúng tôi đã xem rất dài." } }
        - { level: B1, point: whose, rule: { en: possession; a noun follows, uk: "належність; далі йде іменник", es: "posesión; le sigue un sustantivo", pt: "posse; é seguido de um substantivo", fr: "possession ; un nom suit", de: "Besitz; ein Nomen folgt", it: "possesso; segue un sostantivo", pl: "przynależność; dalej następuje rzeczownik", tr: "sahiplik; ardından isim gelir", id: "kepemilikan; diikuti kata benda", vi: "sự sở hữu; theo sau là danh từ" }, ex: ["The man ", { target: whose }, " car was stolen called the police."], tr: { uk: "Чоловік, чию машину вкрали, викликав поліцію.", es: "El hombre cuyo auto fue robado llamó a la policía.", pt: "O homem cujo carro foi roubado chamou a polícia.", fr: "L’homme dont la voiture a été volée a appelé la police.", de: "Der Mann, dessen Auto gestohlen wurde, rief die Polizei.", it: "L'uomo la cui auto è stata rubata ha chiamato la polizia.", pl: "Mężczyzna, którego samochód skradziono, zadzwonił na policję.", tr: "Arabası çalınan adam polisi aradı.", id: "Pria yang mobilnya dicuri itu menelepon polisi.", vi: "Người đàn ông có chiếc xe bị đánh cắp đã gọi cảnh sát." } }
        - { level: B1, point: where, rule: { en: places, uk: "місця", es: "lugares", pt: "lugares", fr: "lieux", de: "Orte", it: "luoghi", pl: "miejsca", tr: "yerler", id: "tempat", vi: "nơi chốn" }, ex: ["The café ", { target: where }, " we met has closed."], tr: { uk: "Кафе, де ми зустрілися, закрилося.", es: "El café donde nos encontramos ha cerrado.", pt: "O café onde nos encontramos fechou.", fr: "Le café où nous nous sommes rencontrés a fermé.", de: "Das Café, in dem wir uns getroffen haben, hat geschlossen.", it: "Il bar dove ci siamo incontrati ha chiuso.", pl: "Kawiarnia, w której się spotkaliśmy, została zamknięta.", tr: "Tanıştığımız kafe kapandı.", id: "Kafe tempat kami bertemu itu sudah tutup.", vi: "Quán cà phê nơi chúng tôi gặp nhau đã đóng cửa." } }
        - { level: B1, point: { en: Subject pronoun, uk: "Займенник-підмет", es: "Pronombre sujeto", pt: "Pronome sujeito", fr: "Pronom sujet", de: "Subjektpronomen", it: "Pronome soggetto", pl: "Zaimek w roli podmiotu", tr: "Özne zamiri", id: "Kata ganti subjek", vi: "Đại từ chủ ngữ" }, rule: { en: "stays: a verb follows", uk: "не опускається: далі йде дієслово", es: "no se omite: sigue un verbo", pt: "não se omite: vem um verbo depois", fr: "reste : un verbe suit", de: "bleibt stehen: ein Verb folgt", it: "non si omette: segue un verbo", pl: "zostaje: dalej następuje czasownik", tr: "düşmez: ardından fiil gelir", id: "tetap ada: diikuti kata kerja", vi: "không được bỏ: theo sau là động từ" }, ex: ["The girl ", { target: who speaks }, " French is my cousin."], tr: { uk: "Дівчина, яка розмовляє французькою, — моя двоюрідна сестра.", es: "La chica que habla francés es mi prima.", pt: "A garota que fala francês é minha prima.", fr: "La fille qui parle français est ma cousine.", de: "Das Mädchen, das Französisch spricht, ist meine Cousine.", it: "La ragazza che parla francese è mia cugina.", pl: "Dziewczyna, która mówi po francusku, jest moją kuzynką.", tr: "Fransızca konuşan kız kuzenim.", id: "Gadis yang berbicara bahasa Prancis itu sepupu saya.", vi: "Cô gái nói tiếng Pháp là em họ của tôi." } }
        - { level: B1, point: { en: Object pronoun, uk: "Займенник-додаток", es: "Pronombre objeto", pt: "Pronome objeto", fr: "Pronom complément", de: "Objektpronomen", it: "Pronome complemento", pl: "Zaimek w roli dopełnienia", tr: "Nesne zamiri", id: "Kata ganti objek", vi: "Đại từ tân ngữ" }, rule: { en: can be left out in a defining clause only, uk: "можна опустити лише в обмежувальному реченні", es: "se puede omitir solo en una oración especificativa", pt: "pode ser omitido só em uma oração restritiva", fr: "peut être omis seulement dans une proposition déterminative", de: "kann nur in einem notwendigen Relativsatz entfallen", it: "si può omettere solo in una proposizione restrittiva", pl: "można pominąć tylko w zdaniu definiującym", tr: "yalnızca belirleyici cümlede düşebilir", id: "boleh dihilangkan, hanya dalam klausa yang membatasi", vi: "chỉ có thể bỏ trong mệnh đề xác định" }, ex: ["The film ", { target: I saw }, " was long."], tr: { uk: "Фільм, який я бачив, був довгим.", es: "La película que vi era larga.", pt: "O filme que vi era longo.", fr: "Le film que j’ai vu était long.", de: "Der Film, den ich gesehen habe, war lang.", it: "Il film che ho visto era lungo.", pl: "Film, który widziałem, był długi.", tr: "Gördüğüm film uzundu.", id: "Film yang saya tonton itu panjang.", vi: "Bộ phim tôi đã xem rất dài." } }
        - { level: B1, point: { en: Defining, uk: "Обмежувальні", es: "Especificativas", pt: "Restritivas", fr: "Déterminatives", de: "Notwendige Relativsätze", it: "Restrittive", pl: "Definiujące", tr: "Belirleyici", id: "Membatasi", vi: "Xác định" }, rule: { en: says which one; no commas, uk: "указує, який саме; без ком", es: "indica cuál; sin comas", pt: "diz qual; sem vírgulas", fr: "précise lequel ; pas de virgules", de: "sagt, welcher gemeint ist; keine Kommas", it: "indica quale; senza virgole", pl: "wskazuje, o którą osobę lub rzecz chodzi; bez przecinków", tr: "hangisi olduğunu belirtir; virgül yok", id: "menyebutkan yang mana; tanpa koma", vi: "cho biết là người hay vật nào; không có dấu phẩy" }, ex: ["The man ", { target: who called }, " is my uncle."], tr: { uk: "Чоловік, який телефонував, — мій дядько.", es: "El hombre que llamó es mi tío.", pt: "O homem que ligou é meu tio.", fr: "L’homme qui a appelé est mon oncle.", de: "Der Mann, der angerufen hat, ist mein Onkel.", it: "L'uomo che ha chiamato è mio zio.", pl: "Mężczyzna, który dzwonił, jest moim wujkiem.", tr: "Arayan adam amcam.", id: "Pria yang menelepon itu paman saya.", vi: "Người đàn ông đã gọi điện là chú của tôi." } }
        - { level: B1, point: { en: Non-defining, uk: "Необмежувальні", es: "Explicativas", pt: "Explicativas", fr: "Explicatives", de: "Nicht notwendige Relativsätze", it: "Non restrittive", pl: "Niedefiniujące", tr: "Açıklayıcı", id: "Tidak membatasi", vi: "Không xác định" }, rule: { en: ["extra information in commas; ", { alternatives: [{ term: who }, { term: which }, { term: whose }, { term: where }] }], uk: ["додаткова інформація між комами; ", { alternatives: [{ term: who }, { term: which }, { term: whose }, { term: where }] }], es: ["información extra entre comas; ", { alternatives: [{ term: who }, { term: which }, { term: whose }, { term: where }] }], pt: ["informação extra entre vírgulas; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], fr: ["information supplémentaire entre virgules ; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], de: ["zusätzliche Information zwischen Kommas; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], it: ["informazione aggiuntiva tra virgole; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], pl: ["dodatkowa informacja w przecinkach; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], tr: ["ek bilgi, virgüllerle ayrılır; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], id: ["informasi tambahan di antara koma; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }], vi: ["thông tin thêm nằm giữa các dấu phẩy; ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "whose" }, { term: "where" }] }] }, ex: ["Paris, ", { target: which }, " I visited in ", { date: May, value: "--05" }, ", is beautiful."], tr: { uk: "Париж, який я відвідав у травні, прекрасний.", es: "París, que visité en mayo, es hermoso.", pt: "Paris, que visitei em maio, é linda.", fr: "Paris, que j’ai visité en mai, est magnifique.", de: "Paris, das ich im Mai besucht habe, ist wunderschön.", it: "Parigi, che ho visitato a maggio, è bellissima.", pl: "Paryż, który odwiedziłem w maju, jest piękny.", tr: "Mayıs ayında ziyaret ettiğim Paris çok güzel.", id: "Paris, yang saya kunjungi bulan Mei, indah.", vi: "Paris, thành phố tôi đã ghé thăm vào tháng Năm, rất đẹp." } }
        - { level: B2, point: { en: Fronted preposition }, rule: { en: ["the preposition comes before ", { alternatives: [{ term: "whom" }, { term: "which" }] }, "; formal"] }, ex: ["The woman ", { target: "to whom" }, " I spoke was kind."] }
        - { level: C1, point: { en: Infinitive clause }, rule: { en: [{ pattern: [{ slot: noun }, to, { slot: V }] }, "; the preposition stays at the end"] }, ex: ["I need someone ", { target: "to talk to" }, "."] }
        - { level: C2, point: { en: Formal relatives }, rule: { en: [{ alternatives: [{ term: "whereby" }, { term: "wherein" }, { term: "whereupon" }] }, " in formal and legal English"] }, ex: ["They set up a system ", { target: whereby }, " tickets are sold online."] }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: where }, " already includes the preposition"], uk: [{ term: where }, " уже містить прийменник"], es: [{ term: where }, " ya incluye la preposición"], pt: [{ term: "where" }, " já inclui a preposição"], fr: [{ term: "where" }, " contient déjà la préposition"], de: [{ term: "where" }, " enthält die Präposition bereits"], it: [{ term: "where" }, " include già la preposizione"], pl: [{ term: "where" }, " już zawiera przyimek"], tr: [{ term: "where" }, " sözcüğü edatı zaten içerir"], id: [{ term: "where" }, " sudah mencakup kata depan"], vi: [{ term: "where" }, " đã bao gồm giới từ"] }, ex: ["The house ", { target: where I live }, " is old."], tr: { uk: "Будинок, у якому я живу, старий.", es: "La casa donde vivo es vieja.", pt: "A casa onde moro é velha.", fr: "La maison où j’habite est vieille.", de: "Das Haus, in dem ich wohne, ist alt.", it: "La casa dove abito è vecchia.", pl: "Dom, w którym mieszkam, jest stary.", tr: "Yaşadığım ev eski.", id: "Rumah tempat saya tinggal itu sudah tua.", vi: "Ngôi nhà tôi đang sống đã cũ." } }

sections:
  - title: { en: "Form: relative pronouns", uk: "Форма: відносні займенники", es: "Forma: pronombres relativos", pt: "Forma: pronomes relativos", fr: "Forme : pronoms relatifs", de: "Form: Relativpronomen", it: "Forma: pronomi relativi", pl: "Forma: zaimki względne", tr: "Biçim: ilgi zamirleri", id: "Bentuk: kata ganti relatif", vi: "Dạng: đại từ quan hệ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pronoun, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: refers, label: { en: Refers to, uk: "Стосується", es: "Se refiere a", pt: "Refere-se a", fr: "Désigne", de: "Bezieht sich auf", it: "Si riferisce a", pl: "Odnosi się do", tr: "Neyi belirtir", id: "Merujuk pada", vi: "Dùng để chỉ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, pronoun: who, refers: { en: people, uk: "людей", es: "personas", pt: "pessoas", fr: "personnes", de: "Personen", it: "persone", pl: "osoby", tr: "insanlar", id: "orang", vi: "người" }, ex: ["The woman ", { target: who }, " lives next door is a nurse."], tr: { uk: "Жінка, яка живе по сусідству, — медсестра.", es: "La mujer que vive al lado es enfermera.", pt: "A mulher que mora ao lado é enfermeira.", fr: "La femme qui habite à côté est infirmière.", de: "Die Frau, die nebenan wohnt, ist Krankenschwester.", it: "La donna che abita accanto è un'infermiera.", pl: "Kobieta, która mieszka obok, jest pielęgniarką.", tr: "Yan dairede oturan kadın hemşiredir.", id: "Perempuan yang tinggal di sebelah adalah perawat.", vi: "Người phụ nữ sống cạnh nhà là y tá." } }
          - { level: B1, pronoun: which, refers: { en: things, uk: "предметів", es: "cosas", pt: "coisas", fr: "choses", de: "Dinge", it: "cose", pl: "rzeczy", tr: "şeyler", id: "benda", vi: "vật" }, ex: ["The book ", { target: which }, " I bought was cheap."], tr: { uk: "Книга, яку я купив, була дешевою.", es: "El libro que compré era barato.", pt: "O livro que comprei era barato.", fr: "Le livre que j’ai acheté était bon marché.", de: "Das Buch, das ich gekauft habe, war billig.", it: "Il libro che ho comprato era economico.", pl: "Książka, którą kupiłem, była tania.", tr: "Aldığım kitap ucuzdu.", id: "Buku yang saya beli itu murah.", vi: "Cuốn sách tôi đã mua rất rẻ." } }
          - { level: B1, pronoun: that, refers: { en: people or things (defining clauses), uk: "людей або предметів (обмежувальні речення)", es: "personas o cosas (oraciones especificativas)", pt: "pessoas ou coisas (orações restritivas)", fr: "personnes ou choses (propositions déterminatives)", de: "Personen oder Dinge (notwendige Relativsätze)", it: "persone o cose (proposizioni restrittive)", pl: "osoby lub rzeczy (zdania definiujące)", tr: "insanlar veya şeyler (belirleyici cümleler)", id: "orang atau benda (klausa yang membatasi)", vi: "người hoặc vật (mệnh đề xác định)" }, ex: ["The film ", { target: that }, " we saw was long."], tr: { uk: "Фільм, який ми дивилися, був довгим.", es: "La película que vimos era larga.", pt: "O filme que vimos era longo.", fr: "Le film que nous avons vu était long.", de: "Der Film, den wir gesehen haben, war lang.", it: "Il film che abbiamo visto era lungo.", pl: "Film, który oglądaliśmy, był długi.", tr: "İzlediğimiz film uzundu.", id: "Film yang kami tonton itu panjang.", vi: "Bộ phim chúng tôi đã xem rất dài." } }
          - { level: B1, pronoun: whose, refers: { en: possession, uk: "належності", es: "posesión", pt: "posse", fr: "possession", de: "Besitz", it: "possesso", pl: "przynależność", tr: "sahiplik", id: "kepemilikan", vi: "sự sở hữu" }, ex: ["The man ", { target: whose }, " car was stolen called the police."], tr: { uk: "Чоловік, чию машину вкрали, викликав поліцію.", es: "El hombre cuyo auto fue robado llamó a la policía.", pt: "O homem cujo carro foi roubado chamou a polícia.", fr: "L’homme dont la voiture a été volée a appelé la police.", de: "Der Mann, dessen Auto gestohlen wurde, rief die Polizei.", it: "L'uomo la cui auto è stata rubata ha chiamato la polizia.", pl: "Mężczyzna, którego samochód skradziono, zadzwonił na policję.", tr: "Arabası çalınan adam polisi aradı.", id: "Pria yang mobilnya dicuri itu menelepon polisi.", vi: "Người đàn ông có chiếc xe bị đánh cắp đã gọi cảnh sát." } }
          - { level: B1, pronoun: where, refers: { en: places, uk: "місць", es: "lugares", pt: "lugares", fr: "lieux", de: "Orte", it: "luoghi", pl: "miejsca", tr: "yerler", id: "tempat", vi: "nơi chốn" }, ex: ["The café ", { target: where }, " we met has closed."], tr: { uk: "Кафе, де ми зустрілися, закрилося.", es: "El café donde nos encontramos ha cerrado.", pt: "O café onde nos encontramos fechou.", fr: "Le café où nous nous sommes rencontrés a fermé.", de: "Das Café, in dem wir uns getroffen haben, hat geschlossen.", it: "Il bar dove ci siamo incontrati ha chiuso.", pl: "Kawiarnia, w której się spotkaliśmy, została zamknięta.", tr: "Tanıştığımız kafe kapandı.", id: "Kafe tempat kami bertemu itu sudah tutup.", vi: "Quán cà phê nơi chúng tôi gặp nhau đã đóng cửa." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: A relative clause comes straight after the noun it describes.
              uk: "Означальне підрядне речення стоїть одразу після іменника, який воно описує."
              es: "La oración de relativo va justo después del sustantivo que describe."
              pt: "A oração relativa vem logo depois do substantivo que descreve."
              fr: "Une proposition relative suit directement le nom qu’elle décrit."
              de: "Ein Relativsatz steht direkt nach dem Nomen, das er beschreibt."
              it: "La proposizione relativa segue subito il sostantivo che descrive."
              pl: "Zdanie względne stoi zaraz po rzeczowniku, który opisuje."
              tr: "İlgi cümlesi, tanımladığı isimden hemen sonra gelir."
              id: "Klausa relatif diletakkan langsung setelah kata benda yang dijelaskannya."
              vi: "Mệnh đề quan hệ đứng ngay sau danh từ mà nó mô tả."
          - type: rule
            level: B1
            text:
              en: [{ term: whose }, " is followed by a noun: ", { term: whose car }, ", ", { term: whose idea }, "."]
              uk: [{ term: whose }, " після нього йде іменник: ", { term: whose car }, ", ", { term: whose idea }, "."]
              es: [{ term: whose }, " va seguido de un sustantivo: ", { term: whose car }, ", ", { term: whose idea }, "."]
              pt: [{ term: "whose" }, " é seguido de um substantivo: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              fr: [{ term: "whose" }, " est suivi d’un nom : ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              de: [{ term: "whose" }, " steht vor einem Nomen: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              it: [{ term: "whose" }, " è seguito da un sostantivo: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              pl: [{ term: "whose" }, " wymaga po sobie rzeczownika: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              tr: [{ term: "whose" }, " sözcüğünden sonra isim gelir: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              id: [{ term: "whose" }, " diikuti kata benda: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
              vi: [{ term: "whose" }, " theo sau là một danh từ: ", { term: "whose car" }, ", ", { term: "whose idea" }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: where }, " includes the preposition: ", { term: the house where I live }, "."]
              uk: [{ term: where }, " містить прийменник: ", { term: the house where I live }, "."]
              es: [{ term: where }, " incluye la preposición: ", { term: the house where I live }, "."]
              pt: [{ term: "where" }, " inclui a preposição: ", { term: "the house where I live" }, "."]
              fr: [{ term: "where" }, " contient la préposition : ", { term: "the house where I live" }, "."]
              de: [{ term: "where" }, " enthält die Präposition: ", { term: "the house where I live" }, "."]
              it: [{ term: "where" }, " include la preposizione: ", { term: "the house where I live" }, "."]
              pl: [{ term: "where" }, " zawiera przyimek: ", { term: "the house where I live" }, "."]
              tr: [{ term: "where" }, " sözcüğü edatı içerir: ", { term: "the house where I live" }, "."]
              id: [{ term: "where" }, " sudah mencakup kata depan: ", { term: "the house where I live" }, "."]
              vi: [{ term: "where" }, " đã bao gồm giới từ: ", { term: "the house where I live" }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: whom }, " is the formal object form: ", { term: The man whom I met }, ". Everyday English uses ", { term: who }, " or no pronoun."]
              uk: [{ term: whom }, " — формальна форма додатка: ", { term: The man whom I met }, ". У повсякденній англійській вживають ", { term: who }, " або взагалі обходяться без займенника."]
              es: [{ term: whom }, " es la forma formal del objeto: ", { term: The man whom I met }, ". El inglés cotidiano usa ", { term: who }, " o ningún pronombre."]
              pt: [{ term: "whom" }, " é a forma formal do objeto: ", { term: "The man whom I met" }, ". O inglês do dia a dia usa ", { term: "who" }, " ou nenhum pronome."]
              fr: [{ term: "whom" }, " est la forme complément soutenue : ", { term: "The man whom I met" }, ". L’anglais courant emploie ", { term: "who" }, " ou aucun pronom."]
              de: [{ term: "whom" }, " ist die förmliche Objektform: ", { term: "The man whom I met" }, ". Im Alltagsenglisch steht ", { term: "who" }, " oder kein Pronomen."]
              it: [{ term: "whom" }, " è la forma formale del complemento: ", { term: "The man whom I met" }, ". L'inglese quotidiano usa ", { term: "who" }, " o nessun pronome."]
              pl: [{ term: "whom" }, " to formalna forma dopełnienia: ", { term: "The man whom I met" }, ". W codziennej angielszczyźnie używa się ", { term: "who" }, " albo pomija zaimek."]
              tr: [{ term: "whom" }, " nesne olarak kullanılan resmî biçimdir: ", { term: "The man whom I met" }, ". Günlük İngilizcede ", { term: "who" }, " ya da zamirsiz biçim kullanılır."]
              id: [{ term: "whom" }, " adalah bentuk objek yang formal: ", { term: "The man whom I met" }, ". Bahasa Inggris sehari-hari memakai ", { term: "who" }, " atau tanpa kata ganti."]
              vi: [{ term: "whom" }, " là dạng tân ngữ trang trọng: ", { term: "The man whom I met" }, ". Tiếng Anh hằng ngày dùng ", { term: "who" }, " hoặc không dùng đại từ."]

  - title: { en: "Form: defining clauses", uk: "Форма: обмежувальні речення (defining)", es: "Forma: oraciones especificativas (defining)", pt: "Forma: orações restritivas (defining)", fr: "Forme : propositions déterminatives (defining)", de: "Form: notwendige Relativsätze", it: "Forma: proposizioni restrittive (defining)", pl: "Forma: zdania definiujące (defining)", tr: "Biçim: belirleyici cümleler (defining)", id: "Bentuk: klausa yang membatasi (defining)", vi: "Dạng: mệnh đề xác định (defining)" }
    role: form
    content:
      - type: prose
        level: B1
        text:
          en: A defining clause says which person or thing. It has no commas.
          uk: "Обмежувальне підрядне речення вказує, про яку саме особу чи про який предмет ідеться. В англійській мові воно не виділяється комами."
          es: "Una oración especificativa dice de qué persona o cosa se habla. No lleva comas."
          pt: "Uma oração restritiva diz de que pessoa ou coisa se fala. Não leva vírgulas."
          fr: "Une proposition déterminative précise de quelle personne ou de quelle chose il s’agit. Elle ne prend pas de virgules."
          de: "Ein notwendiger Relativsatz sagt, welche Person oder Sache gemeint ist. Er hat keine Kommas."
          it: "Una proposizione restrittiva dice di quale persona o cosa si parla. Non ha virgole."
          pl: "Zdanie definiujące wskazuje, o którą osobę lub rzecz chodzi. W angielskim nie oddziela się go przecinkami."
          tr: "Belirleyici cümle, hangi kişi ya da şeyden söz edildiğini belirtir. Virgül kullanılmaz."
          id: "Klausa yang membatasi menyebutkan orang atau benda yang dimaksud. Klausa ini tidak memakai koma."
          vi: "Mệnh đề xác định cho biết là người hay vật nào. Không có dấu phẩy."
        ex: ["The man ", { target: who called }, " is my uncle."]
        tr: { uk: "Чоловік, який телефонував, — мій дядько.", es: "El hombre que llamó es mi tío.", pt: "O homem que ligou é meu tio.", fr: "L’homme qui a appelé est mon oncle.", de: "Der Mann, der angerufen hat, ist mein Onkel.", it: "L'uomo che ha chiamato è mio zio.", pl: "Mężczyzna, który dzwonił, jest moim wujkiem.", tr: "Arayan adam amcam.", id: "Pria yang menelepon itu paman saya.", vi: "Người đàn ông đã gọi điện là chú của tôi." }
      - type: comparison
        columns:
          - { key: role, label: { en: The pronoun is, uk: "Роль займенника", es: "El pronombre es", pt: "O pronome é", fr: "Le pronom est", de: "Das Pronomen ist", it: "Il pronome è", pl: "Zaimek jest", tr: "Zamirin görevi", id: "Kata gantinya adalah", vi: "Đại từ là" } }
          - { key: with, label: { en: With pronoun, uk: "З займенником", es: "Con pronombre", pt: "Com pronome", fr: "Avec pronom", de: "Mit Pronomen", it: "Con il pronome", pl: "Z zaimkiem", tr: "Zamirle", id: "Dengan kata ganti", vi: "Có đại từ" } }
          - { key: without, label: { en: Without pronoun, uk: "Без займенника", es: "Sin pronombre", pt: "Sem pronome", fr: "Sans pronom", de: "Ohne Pronomen", it: "Senza il pronome", pl: "Bez zaimka", tr: "Zamirsiz", id: "Tanpa kata ganti", vi: "Không có đại từ" } }
        rows:
          - { level: B1, role: { en: subject (verb follows), uk: "підмет (далі йде дієслово)", es: "sujeto (sigue un verbo)", pt: "sujeito (vem um verbo depois)", fr: "sujet (un verbe suit)", de: "Subjekt (ein Verb folgt)", it: "soggetto (segue un verbo)", pl: "podmiotem (dalej następuje czasownik)", tr: "özne (ardından fiil gelir)", id: "subjek (diikuti kata kerja)", vi: "chủ ngữ (theo sau là động từ)" }, with: { ex: ["The girl ", { target: who speaks }, " French is my cousin."], tr: { uk: "Дівчина, яка розмовляє французькою, — моя двоюрідна сестра.", es: "La chica que habla francés es mi prima.", pt: "A garota que fala francês é minha prima.", fr: "La fille qui parle français est ma cousine.", de: "Das Mädchen, das Französisch spricht, ist meine Cousine.", it: "La ragazza che parla francese è mia cugina.", pl: "Dziewczyna, która mówi po francusku, jest moją kuzynką.", tr: "Fransızca konuşan kız kuzenim.", id: "Gadis yang berbicara bahasa Prancis itu sepupu saya.", vi: "Cô gái nói tiếng Pháp là em họ của tôi." } } }
          - { level: B1, role: { en: object (subject follows), uk: "додаток (далі йде підмет)", es: "objeto (sigue un sujeto)", pt: "objeto (vem um sujeito depois)", fr: "complément (un sujet suit)", de: "Objekt (ein Subjekt folgt)", it: "complemento (segue un soggetto)", pl: "dopełnieniem (dalej następuje podmiot)", tr: "nesne (ardından özne gelir)", id: "objek (diikuti subjek)", vi: "tân ngữ (theo sau là chủ ngữ)" }, with: { ex: ["The film ", { target: that I saw }, " was long."], tr: { uk: "Фільм, який я бачив, був довгим.", es: "La película que vi era larga.", pt: "O filme que eu vi era longo.", fr: "Le film que j’ai vu était long.", de: "Der Film, den ich gesehen habe, war lang.", it: "Il film che ho visto era lungo.", pl: "Film, który widziałem, był długi.", tr: "Gördüğüm film uzundu.", id: "Film yang saya tonton itu panjang.", vi: "Bộ phim tôi đã xem rất dài." } }, without: { ex: ["The film ", { target: I saw }, " was long."], tr: { uk: "Фільм, який я бачив, був довгим.", es: "La película que vi era larga.", pt: "O filme que eu vi era longo.", fr: "Le film que j’ai vu était long.", de: "Der Film, den ich gesehen habe, war lang.", it: "Il film che ho visto era lungo.", pl: "Film, który widziałem, był długi.", tr: "Gördüğüm film uzundu.", id: "Film yang saya tonton itu panjang.", vi: "Bộ phim tôi đã xem rất dài." } } }
          - { level: B1, role: { en: object of a preposition, uk: "додаток прийменника", es: "objeto de una preposición", pt: "objeto de uma preposição", fr: "complément d’une préposition", de: "Objekt einer Präposition", it: "complemento di una preposizione", pl: "dopełnieniem przyimka", tr: "edatın nesnesi", id: "objek kata depan", vi: "tân ngữ của giới từ" }, with: { ex: ["The man ", { target: who I spoke to }, " was kind."], tr: { uk: "Чоловік, з яким я розмовляв, був добрим.", es: "El hombre con quien hablé era amable.", pt: "O homem com quem falei era simpático.", fr: "L’homme à qui j’ai parlé était gentil.", de: "Der Mann, mit dem ich gesprochen habe, war freundlich.", it: "L'uomo con cui ho parlato era gentile.", pl: "Mężczyzna, z którym rozmawiałem, był miły.", tr: "Konuştuğum adam nazikti.", id: "Pria yang saya ajak bicara itu ramah.", vi: "Người đàn ông tôi đã nói chuyện cùng rất tốt bụng." } }, without: { ex: ["The man ", { target: I spoke to }, " was kind."], tr: { uk: "Чоловік, з яким я розмовляв, був добрим.", es: "El hombre con quien hablé era amable.", pt: "O homem com quem falei era simpático.", fr: "L’homme à qui j’ai parlé était gentil.", de: "Der Mann, mit dem ich gesprochen habe, war freundlich.", it: "L'uomo con cui ho parlato era gentile.", pl: "Mężczyzna, z którym rozmawiałem, był miły.", tr: "Konuştuğum adam nazikti.", id: "Pria yang saya ajak bicara itu ramah.", vi: "Người đàn ông tôi đã nói chuyện cùng rất tốt bụng." } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A subject pronoun stays: ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " is followed by a verb."]
              uk: ["Займенник-підмет не опускається: після ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " іде дієслово."]
              es: ["El pronombre sujeto no se omite: ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " va seguido de un verbo."]
              pt: ["O pronome sujeito não se omite: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " é seguido de um verbo."]
              fr: ["Un pronom sujet reste : ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " est suivi d’un verbe."]
              de: ["Ein Subjektpronomen bleibt stehen: auf ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " folgt ein Verb."]
              it: ["Un pronome soggetto non si omette: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " è seguito da un verbo."]
              pl: ["Zaimek w roli podmiotu zostaje: po ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " następuje czasownik."]
              tr: ["Özne zamiri düşmez: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " sözcüğünden sonra fiil gelir."]
              id: ["Kata ganti subjek tetap ada: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " diikuti kata kerja."]
              vi: ["Đại từ chủ ngữ phải giữ lại: sau ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " là động từ."]
          - type: rule
            level: B1
            text:
              en: ["An object pronoun can be left out: ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " is followed by a subject."]
              uk: ["Займенник-додаток можна опустити: після ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " іде підмет."]
              es: ["El pronombre objeto se puede omitir: ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " va seguido de un sujeto."]
              pt: ["O pronome objeto pode ser omitido: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " é seguido de um sujeito."]
              fr: ["Un pronom complément peut être omis : ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " est suivi d’un sujet."]
              de: ["Ein Objektpronomen kann entfallen: auf ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " folgt ein Subjekt."]
              it: ["Un pronome complemento si può omettere: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " è seguito da un soggetto."]
              pl: ["Zaimek w roli dopełnienia można pominąć: po ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " następuje podmiot."]
              tr: ["Nesne zamiri düşebilir: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " sözcüğünden sonra özne gelir."]
              id: ["Kata ganti objek boleh dihilangkan: ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " diikuti subjek."]
              vi: ["Đại từ tân ngữ có thể bỏ: sau ", { alternatives: [{ term: "who" }, { term: "which" }, { term: "that" }] }, " là chủ ngữ."]
          - type: rule
            level: B1
            text:
              en: In everyday English the preposition goes to the end of the clause.
              uk: "У повсякденній англійській прийменник стоїть наприкінці підрядного речення."
              es: "En el inglés cotidiano la preposición va al final de la oración."
              pt: "No inglês do dia a dia, a preposição vai para o fim da oração."
              fr: "En anglais courant, la préposition passe à la fin de la proposition."
              de: "Im Alltagsenglisch steht die Präposition am Ende des Relativsatzes."
              it: "Nell'inglese quotidiano la preposizione va alla fine della proposizione."
              pl: "W codziennej angielszczyźnie przyimek stoi na końcu zdania względnego."
              tr: "Günlük İngilizcede edat, yan cümlenin sonuna gelir."
              id: "Dalam bahasa Inggris sehari-hari, kata depan diletakkan di akhir klausa."
              vi: "Trong tiếng Anh hằng ngày, giới từ đứng ở cuối mệnh đề."

  - title: { en: "Form: non-defining clauses", uk: "Форма: необмежувальні речення (non-defining)", es: "Forma: oraciones explicativas (non-defining)", pt: "Forma: orações explicativas (non-defining)", fr: "Forme : propositions explicatives (non-defining)", de: "Form: nicht notwendige Relativsätze", it: "Forma: proposizioni non restrittive (non-defining)", pl: "Forma: zdania niedefiniujące (non-defining)", tr: "Biçim: açıklayıcı cümleler (non-defining)", id: "Bentuk: klausa yang tidak membatasi (non-defining)", vi: "Dạng: mệnh đề không xác định (non-defining)" }
    role: form
    content:
      - type: prose
        level: B1
        text:
          en: A non-defining clause adds extra information. Commas separate it from the rest.
          uk: "Необмежувальне підрядне речення додає додаткову інформацію. Від решти речення його відокремлюють комами."
          es: "Una oración explicativa añade información extra. Se separa del resto con comas."
          pt: "Uma oração explicativa acrescenta informação extra. É separada do resto por vírgulas."
          fr: "Une proposition explicative ajoute une information supplémentaire. Des virgules la séparent du reste."
          de: "Ein nicht notwendiger Relativsatz fügt zusätzliche Information hinzu. Kommas trennen ihn vom Rest."
          it: "Una proposizione non restrittiva aggiunge informazioni extra. Le virgole la separano dal resto."
          pl: "Zdanie niedefiniujące dodaje dodatkową informację. Od reszty zdania oddzielają je przecinki."
          tr: "Açıklayıcı cümle ek bilgi verir. Cümlenin geri kalanından virgülle ayrılır."
          id: "Klausa yang tidak membatasi menambahkan informasi tambahan. Klausa ini dipisahkan dari bagian kalimat lainnya dengan koma."
          vi: "Mệnh đề không xác định bổ sung thông tin thêm. Dấu phẩy tách nó khỏi phần còn lại."
        ex: ["My uncle, ", { target: who lives in Leeds }, ", is a doctor."]
        tr: { uk: "Мій дядько, який живе в Лідсі, — лікар.", es: "Mi tío, que vive en Leeds, es médico.", pt: "Meu tio, que mora em Leeds, é médico.", fr: "Mon oncle, qui habite à Leeds, est médecin.", de: "Mein Onkel, der in Leeds wohnt, ist Arzt.", it: "Mio zio, che vive a Leeds, è medico.", pl: "Mój wujek, który mieszka w Leeds, jest lekarzem.", tr: "Leeds’te yaşayan amcam doktor.", id: "Paman saya, yang tinggal di Leeds, adalah dokter.", vi: "Chú tôi, người sống ở Leeds, là bác sĩ." }
      - type: comparison
        columns:
          - { key: feature, label: { en: Feature, uk: "Ознака", es: "Característica", pt: "Característica", fr: "Caractéristique", de: "Merkmal", it: "Caratteristica", pl: "Cecha", tr: "Özellik", id: "Ciri", vi: "Đặc điểm" } }
          - { key: defining, label: { en: Defining, uk: "Обмежувальні", es: "Especificativas", pt: "Restritivas", fr: "Déterminatives", de: "Notwendige Relativsätze", it: "Restrittive", pl: "Definiujące", tr: "Belirleyici", id: "Membatasi", vi: "Xác định" } }
          - { key: nondefining, label: { en: Non-defining, uk: "Необмежувальні", es: "Explicativas", pt: "Explicativas", fr: "Explicatives", de: "Nicht notwendige Relativsätze", it: "Non restrittive", pl: "Niedefiniujące", tr: "Açıklayıcı", id: "Tidak membatasi", vi: "Không xác định" } }
        rows:
          - { level: B1, feature: { en: Information, uk: "Інформація", es: "Información", pt: "Informação", fr: "Information", de: "Information", it: "Informazione", pl: "Informacja", tr: "Bilgi", id: "Informasi", vi: "Thông tin" }, defining: { en: says which one, uk: "указує, який саме", es: "indica cuál", pt: "diz qual", fr: "précise lequel", de: "sagt, welcher gemeint ist", it: "indica quale", pl: "wskazuje, o który chodzi", tr: "hangisi olduğunu belirtir", id: "menyebutkan yang mana", vi: "cho biết là người hay vật nào" }, nondefining: { en: "extra, can be removed", uk: "додаткова, її можна прибрати", es: "extra, se puede quitar", pt: "extra, pode ser removida", fr: "supplémentaire, peut être supprimée", de: "zusätzlich, kann entfallen", it: "extra, si può togliere", pl: "dodatkowa, można ją usunąć", tr: "ek bilgi, çıkarılabilir", id: "tambahan, bisa dihilangkan", vi: "thông tin thêm, có thể bỏ đi" } }
          - { level: B1, feature: { en: Commas, uk: "Коми", es: "Comas", pt: "Vírgulas", fr: "Virgules", de: "Kommas", it: "Virgole", pl: "Przecinki", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }, defining: { en: none, uk: "немає", es: "ninguna", pt: "nenhuma", fr: "aucune", de: "keine", it: "nessuna", pl: "brak", tr: "yok", id: "tidak ada", vi: "không có" }, nondefining: { en: "yes, and a pause in speech", uk: "є, а в мовленні — пауза", es: "sí, y una pausa al hablar", pt: "sim, e uma pausa na fala", fr: "oui, et une pause à l’oral", de: "ja, und eine Pause beim Sprechen", it: "sì, e una pausa nel parlato", pl: "tak, a w mowie — pauza", tr: "var, konuşmada da duraklama", id: "ya, dan ada jeda saat berbicara", vi: "có, và ngắt giọng khi nói" } }
          - { level: B1, feature: { en: Pronouns, uk: "Займенники", es: "Pronombres", pt: "Pronomes", fr: "Pronoms", de: "Pronomen", it: "Pronomi", pl: "Zaimki", tr: "Zamirler", id: "Kata ganti", vi: "Đại từ" }, defining: { alternatives: [who, which, that] }, nondefining: { alternatives: [who, which, whose, where] } }
          - { level: B1, feature: { en: Leave out the object pronoun, uk: "Опущення займенника-додатка", es: "Omitir el pronombre objeto", pt: "Omitir o pronome objeto", fr: "Omettre le pronom complément", de: "Objektpronomen weglassen", it: "Omettere il pronome complemento", pl: "Pominięcie zaimka w roli dopełnienia", tr: "Nesne zamirini düşürme", id: "Menghilangkan kata ganti objek", vi: "Bỏ đại từ tân ngữ" }, defining: { en: possible, uk: "можливе", es: "posible", pt: "possível", fr: "possible", de: "möglich", it: "possibile", pl: "możliwe", tr: "olası", id: "mungkin", vi: "có thể" }, nondefining: { en: never, uk: "ніколи", es: "nunca", pt: "nunca", fr: "jamais", de: "nie", it: "mai", pl: "nigdy", tr: "asla", id: "tidak pernah", vi: "không bao giờ" } }
      - type: usage
        columns:
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, ex: ["Paris, ", { target: which }, " I visited in ", { date: May, value: "--05" }, ", is beautiful."], tr: { uk: "Париж, який я відвідав у травні, прекрасний.", es: "París, que visité en mayo, es hermoso.", pt: "Paris, que visitei em maio, é linda.", fr: "Paris, que j’ai visité en mai, est magnifique.", de: "Paris, das ich im Mai besucht habe, ist wunderschön.", it: "Parigi, che ho visitato a maggio, è bellissima.", pl: "Paryż, który odwiedziłem w maju, jest piękny.", tr: "Mayıs ayında ziyaret ettiğim Paris çok güzel.", id: "Paris, yang saya kunjungi bulan Mei, indah.", vi: "Paris, thành phố tôi đã ghé thăm vào tháng Năm, rất đẹp." } }
          - { level: B1, ex: ["Tom, ", { target: whose }, " brother is a chef, cooks well."], tr: { uk: "Том, чий брат — кухар, добре готує.", es: "Tom, cuyo hermano es cocinero, cocina bien.", pt: "Tom, cujo irmão é chef, cozinha bem.", fr: "Tom, dont le frère est cuisinier, cuisine bien.", de: "Tom, dessen Bruder Koch ist, kocht gut.", it: "Tom, il cui fratello è cuoco, cucina bene.", pl: "Tom, którego brat jest kucharzem, dobrze gotuje.", tr: "Kardeşi aşçı olan Tom iyi yemek yapar.", id: "Tom, yang kakaknya seorang koki, pandai memasak.", vi: "Tom, người có anh trai là đầu bếp, nấu ăn rất ngon." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: which }, " can refer to a whole clause:"]
              uk: [{ term: which }, " може стосуватися цілого речення:"]
              es: [{ term: which }, " puede referirse a toda una oración:"]
              pt: [{ term: "which" }, " pode se referir a toda uma oração:"]
              fr: [{ term: "which" }, " peut renvoyer à toute une proposition :"]
              de: [{ term: "which" }, " kann sich auf einen ganzen Satz beziehen:"]
              it: [{ term: "which" }, " può riferirsi a un'intera proposizione:"]
              pl: [{ term: "which" }, " może odnosić się do całego zdania:"]
              tr: [{ term: "which" }, " tüm bir cümleye de gönderme yapabilir:"]
              id: [{ term: "which" }, " dapat merujuk pada seluruh klausa:"]
              vi: [{ term: "which" }, " có thể chỉ cả một mệnh đề:"]
            ex: ["He passed the exam, ", { target: which }, " surprised everyone."]
            tr: { uk: "Він склав іспит, що всіх здивувало.", es: "Aprobó el examen, lo que sorprendió a todos.", pt: "Ele passou no exame, o que surpreendeu a todos.", fr: "Il a réussi l’examen, ce qui a surpris tout le monde.", de: "Er hat die Prüfung bestanden, was alle überraschte.", it: "Ha superato l'esame, il che ha sorpreso tutti.", pl: "Zdał egzamin, co wszystkich zaskoczyło.", tr: "Sınavı geçti, bu da herkesi şaşırttı.", id: "Dia lulus ujian, yang mengejutkan semua orang.", vi: "Anh ấy đã đỗ kỳ thi, điều này khiến mọi người ngạc nhiên." }

  - title: { en: "Form: preposition and relative pronoun" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern } }
          - { key: refers, label: { en: Refers to } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: { pattern: [preposition, whom] }, refers: { en: people }, ex: { examples: [["The woman ", { target: "to whom" }, " I spoke was kind."], ["The friends ", { target: "with whom" }, " I travelled live in Spain."]] } }
          - { level: B2, form: { pattern: [preposition, which] }, refers: { en: things }, ex: { examples: [["The house ", { target: "in which" }, " he lives is old."], ["The pen ", { target: "with which" }, " she signed was gold."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["Only ", { term: "whom" }, " and ", { term: "which" }, " can follow a preposition at the front; this order is formal."] }
            ex: ["She has a car ", { target: "of which" }, " she is proud."]

  - title: { en: "Form: quantifier and whom or which" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern } }
          - { key: refers, label: { en: Refers to } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: { pattern: [{ alternatives: [some, many, all, none, both, neither, the majority] }, of, whom] }, refers: { en: people }, ex: { examples: [["The guests, ", { target: "some of whom" }, " had travelled far, were tired."], ["She has two sons, ", { target: "both of whom" }, " live abroad."]] } }
          - { level: B2, form: { pattern: [{ alternatives: [some, many, all, none, both, neither, the majority] }, of, which] }, refers: { en: things }, ex: { examples: [["I bought two books, ", { target: "neither of which" }, " was cheap."], ["The shops, ", { target: "many of which" }, " were closed, looked empty."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "These clauses are non-defining, so a comma comes before the quantifier." }
            ex: ["He has three cars, ", { target: "all of which" }, " are red."]

  - title: { en: "Form: when, where, why and the way" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: after, label: { en: After } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, word: when, after: { en: "a time noun: day, year, moment" }, ex: ["I remember the day ", { optional: when }, " we met."] }
          - { level: B2, word: where, after: { en: "a place, or a case, situation or point" }, ex: ["There are cases ", { target: where }, " this fails."] }
          - { level: B2, word: why, after: { en: "the noun reason" }, ex: ["That is the reason ", { optional: why }, " he left."] }
          - { level: B2, word: "the way", after: { en: "how something is done" }, ex: ["I like the way ", { optional: "in which" }, " she explains things."] }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["After a time noun or ", { term: "reason" }, ", ", { term: "that" }, " can replace ", { term: "when" }, " and ", { term: "why" }, "."] }
            ex: ["That was the year ", { target: that }, " she moved."]

  - title: { en: "Form: that after all, only and superlatives" }
    role: form
    content:
      - type: usage
        columns:
          - { key: after, label: { en: After } }
          - { key: pronoun, label: { en: Pronoun } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, after: { alternatives: [all, everything, nothing, something, little, much] }, pronoun: that, ex: { examples: [["Everything ", { target: that }, " she said was true."], ["All ", { target: that }, " I know is this."]] } }
          - { level: B2, after: { alternatives: [only, first, last, a superlative] }, pronoun: that, ex: { examples: [["It is the only book ", { target: that }, " I own."], ["It is the best film ", { target: that }, " I have seen."]] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["In these clauses ", { term: "that" }, " is usual and ", { term: "which" }, " is rare."] }

  - title: { en: "Form: which for a whole clause" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: which is why, use: { en: "the first clause is the reason for the second" }, ex: ["She was ill, ", { target: "which is why" }, " she stayed home."] }
          - { level: B2, form: in which case, use: { en: "if the first clause is true" }, ex: ["It may rain, ", { target: "in which case" }, " we'll stay in."] }
          - { level: B2, form: which means, use: { en: "the result of the first clause" }, ex: ["The shop is closed, ", { target: "which means" }, " we can't buy it."] }

  - title: { en: "Form: reduced relative clauses" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: replaces, label: { en: Replaces } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B2, form: { pattern: [{ slot: noun }, { slot: -ing }] }, replaces: { en: "an active clause: who is standing, who stands" }, ex: { equivalence: [["The man ", { target: "standing at the door" }, " is my uncle."], "The man who is standing at the door is my uncle."] } }
          - { level: B2, form: { pattern: [{ slot: noun }, { slot: past participle }] }, replaces: { en: "a passive clause: which was written, that is made" }, ex: { equivalence: [["The book ", { target: "written by Orwell" }, " is on the shelf."], "The book which was written by Orwell is on the shelf."] } }
          - { level: B2, form: { pattern: [{ slot: noun }, to, { slot: V }] }, replaces: { en: "a clause after first, last, only or a superlative" }, ex: { examples: [["She was the first ", { target: "to arrive" }, "."], ["This is the best way ", { target: "to do it" }, "."]] } }
          - { level: B2, form: { pattern: [{ slot: noun }, { slot: adjective }] }, replaces: { en: "who is, who are" }, ex: { equivalence: [["The people ", { target: present }, " were happy."], "The people who were present were happy."] } }
          - { level: B2, form: { pattern: [{ slot: noun }, preposition, { slot: noun }] }, replaces: { en: "who has, who wears, which is" }, ex: { equivalence: [["The girl ", { target: "with the red hat" }, " is my sister."], "The girl who is wearing the red hat is my sister."] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["A reduced clause leaves out the relative pronoun and the verb ", { term: "be" }, "."] }

  - title: { en: "Form: as as a relative pronoun" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, form: { pattern: [as, { slot: clause }] }, use: { en: "comments on the whole main clause, after it or before it" }, ex: { examples: [["He was late, ", { target: "as is often the case" }, "."], [{ target: "As we have seen" }, ", the plan failed."]] } }
          - { level: C1, form: { pattern: [such, { slot: noun }, as] }, use: { en: "things of the kind that follows" }, ex: ["He lent me ", { target: "such books as" }, " he had."] }
          - { level: C1, form: { pattern: [the same, { slot: noun }, as] }, use: { en: "identical or very similar" }, ex: ["She has ", { target: "the same bag as" }, " I have."] }
          - { level: C1, form: { pattern: [as many, { slot: noun }, as] }, use: { en: "an amount equal to the need" }, ex: ["Take ", { target: "as many books as" }, " you need."] }

  - title: { en: "Form: relative clauses with infinitives" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, form: { pattern: [{ slot: noun }, to, { slot: V }, preposition] }, use: { en: "the noun is the object of the preposition" }, ex: { examples: [["I need a place ", { target: "to live in" }, "."], ["I need someone ", { target: "to talk to" }, "."]] } }
          - { level: C1, form: { pattern: [{ slot: noun }, to, { slot: V }] }, use: { en: "the person or thing that the infinitive is about" }, ex: ["She is the best person ", { target: "to ask" }, "."] }
          - { level: C1, form: { pattern: [{ slot: noun }, { slot: subject }, { slot: V }, preposition] }, use: { en: "the preposition stays at the end of the clause" }, ex: ["That is the person ", { target: "I'm waiting for" }, "."] }
          - { level: C1, form: { pattern: [{ slot: noun }, { slot: subject }, phrasal verb] }, use: { en: "a phrasal verb keeps its particle and preposition together" }, ex: ["This is the plan ", { target: "we came up with" }, "."] }

  - title: { en: "Form: extraposed relative clauses" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, form: { en: "after a short verb" }, use: { en: "the clause is long, so it moves to the end" }, ex: ["A man came in ", { target: "who looked ill" }, "."] }
          - { level: C1, form: { en: "after a passive verb" }, use: { en: "the clause adds news about a new thing" }, ex: ["A book has been published ", { target: "which explains this" }, "."] }
          - { level: C1, form: { en: "after the noun time" }, use: { en: "formal: the clause names the time" }, ex: ["The time has come ", { target: "when we must act" }, "."] }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "The relative clause moves to the end when the rest of the sentence is short." }

  - title: { en: "Form: those who and anyone who" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: refers, label: { en: Refers to } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, form: those who, refers: { en: "people in general, plural" }, ex: [{ target: "Those who" }, " work hard usually succeed."] }
          - { level: C1, form: { alternatives: [anyone who, everyone who, someone who] }, refers: { en: "a person or people with this quality" }, ex: { examples: [[{ target: "Anyone who" }, " wants to join should sign here."], [{ target: "Everyone who" }, " came enjoyed it."]] } }
          - { level: C1, form: all who, refers: { en: "every person in a group, in formal style" }, ex: [{ target: "All who" }, " enter must sign in."] }
          - { level: C1, form: he who, refers: { en: "anyone, in proverbs and old style" }, ex: [{ target: "He who" }, " hesitates is lost."] }

  - title: { en: "Punctuation: non-defining clauses" }
    role: own
    content:
      - type: usage
        columns:
          - { key: mark, label: { en: Mark } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C1, mark: commas, use: { en: "a pair around a clause in the middle of the sentence" }, ex: ["My sister, ", { target: "who lives in Leeds" }, ", is a nurse."] }
          - { level: C1, mark: commas, use: { en: "one comma before a clause at the end" }, ex: ["I called my sister, ", { target: "who lives in Leeds" }, "."] }
          - { level: C1, mark: dashes, use: { en: "a stronger break, in informal or dramatic writing" }, ex: ["My sister – ", { target: "who lives in Leeds" }, " – is a nurse."] }

  - title: { en: "Formal relative adverbs" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: means, label: { en: Means } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, form: whereby, means: { en: "by which" }, ex: ["They set up a system ", { target: whereby }, " tickets are sold online."] }
          - { level: C2, form: wherein, means: { en: "in which" }, ex: ["The report, ", { target: wherein }, " the terms are set out, is online."] }
          - { level: C2, form: whereupon, means: { en: "after which, and then" }, ex: ["He objected, ", { target: whereupon }, " she left."] }
          - { level: C2, form: thereof, means: { en: "of it or of that; formal and legal" }, ex: ["The terms ", { target: thereof }, " are set out below."] }
          - { level: C2, form: in respect of which, means: { en: "concerning" }, ex: ["It is a sum ", { target: "in respect of which" }, " tax is due."] }
          - { level: C2, form: the extent to which, means: { en: "how far" }, ex: ["We discussed ", { target: "the extent to which" }, " they cooperate."] }
          - { level: C2, form: the basis on which, means: { en: "the grounds of a decision" }, ex: ["They explained ", { target: "the basis on which" }, " the prize is awarded."] }
          - { level: C2, form: the manner in which, means: { en: "the way something is done" }, ex: ["I admired ", { target: "the manner in which" }, " she handled it."] }

  - title: { en: "Form: whose and of which" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, form: { pattern: [whose, { slot: noun }] }, use: { en: "people and things; the usual choice" }, ex: ["A company ", { target: "whose founder" }, " left is struggling."] }
          - { level: C2, form: { pattern: [the, { slot: noun }, of which] }, use: { en: "things; formal, in a non-defining clause" }, ex: ["The company, ", { target: "the founder of which" }, " left, is struggling."] }
          - { level: C2, form: { pattern: [preposition, whose, { slot: noun }] }, use: { en: "formal: the preposition stands first" }, ex: ["She is the woman ", { target: "in whose house" }, " we stayed."] }

  - title: { en: "Form: hypothetical antecedents" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: C2, form: { pattern: [{ slot: noun }, who, would, { slot: V }] }, use: { en: "a person who is imagined or typical, and not a known one" }, ex: ["I need a friend ", { target: "who would tell" }, " me the truth."] }
          - { level: C2, form: { pattern: [{ slot: noun }, that, { slot: past }] }, use: { en: "a wished-for thing, with the past tense of an unreal condition" }, ex: ["I'd like a job ", { target: "that paid" }, " more."] }
          - { level: C2, form: { pattern: [{ slot: noun }, that, were] }, use: { en: "formal: the subjunctive were" }, ex: ["I wish I had a house ", { target: "that were" }, " nearer the sea."] }

