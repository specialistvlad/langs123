          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: { pattern: [whose, { slot: noun }] }, use: { en: "people and things; the usual choice", uk: "люди й предмети; звичайний вибір", es: "personas y cosas; la opción habitual", pt: "pessoas e coisas; a escolha habitual", fr: "personnes et choses ; le choix habituel", de: "Personen und Dinge; die übliche Wahl", it: "persone e cose; la scelta abituale", pl: "osoby i rzeczy; zwykły wybór", tr: "insanlar ve şeyler; olağan tercih", id: "orang dan benda; pilihan yang biasa", vi: "người và vật; lựa chọn thông thường" }, ex: ["A company ", { target: "whose founder" }, " left is struggling."], tr: { uk: "Компанія, засновник якої пішов, переживає труднощі.", es: "Una empresa cuyo fundador se fue está en dificultades.", pt: "Uma empresa cujo fundador saiu está em dificuldades.", fr: "Une entreprise dont le fondateur est parti est en difficulté.", de: "Ein Unternehmen, dessen Gründer gegangen ist, steckt in Schwierigkeiten.", it: "Un'azienda il cui fondatore se n'è andato è in difficoltà.", pl: "Firma, której założyciel odszedł, ma problemy.", tr: "Kurucusu ayrılan şirket zor durumda.", id: "Perusahaan yang pendirinya sudah pergi sedang kesulitan.", vi: "Công ty có người sáng lập đã rời đi đang gặp khó khăn." } }
          - { level: C2, form: { pattern: [the, { slot: noun }, of which] }, use: { en: "things; formal, in a non-defining clause", uk: "предмети; формальний стиль, у необмежувальному реченні", es: "cosas; formal, en una oración explicativa", pt: "coisas; formal, em uma oração explicativa", fr: "choses ; style soutenu, dans une proposition explicative", de: "Dinge; förmlich, in einem nicht notwendigen Relativsatz", it: "cose; formale, in una proposizione non restrittiva", pl: "rzeczy; styl formalny, w zdaniu niedefiniującym", tr: "şeyler; resmî, açıklayıcı bir cümlede", id: "benda; formal, dalam klausa yang tidak membatasi", vi: "vật; trang trọng, trong mệnh đề không xác định" }, ex: ["The company, ", { target: "the founder of which" }, " left, is struggling."], tr: { uk: "Ця компанія, засновник якої пішов, переживає труднощі.", es: "La empresa, cuyo fundador se fue, está en dificultades.", pt: "A empresa, cujo fundador saiu, está em dificuldades.", fr: "L’entreprise, dont le fondateur est parti, est en difficulté.", de: "Das Unternehmen, dessen Gründer gegangen ist, steckt in Schwierigkeiten.", it: "L'azienda, il cui fondatore se n'è andato, è in difficoltà.", pl: "Ta firma, której założyciel odszedł, ma problemy.", tr: "Kurucusu ayrılmış olan şirket zor durumda.", id: "Perusahaan itu, yang pendirinya sudah pergi, sedang kesulitan.", vi: "Công ty, mà người sáng lập đã rời đi, đang gặp khó khăn." } }
          - { level: C2, form: { pattern: [preposition, whose, { slot: noun }] }, use: { en: "formal: the preposition stands first", uk: "формальний стиль: прийменник стоїть першим", es: "formal: la preposición va primero", pt: "formal: a preposição vem primeiro", fr: "style soutenu : la préposition vient en premier", de: "förmlich: die Präposition steht zuerst", it: "formale: la preposizione viene per prima", pl: "styl formalny: przyimek stoi na początku", tr: "resmî: edat en başta gelir", id: "formal: kata depan berada di depan", vi: "trang trọng: giới từ đứng đầu" }, ex: ["She is the woman ", { target: "in whose house" }, " we stayed."], tr: { uk: "Вона — жінка, у чиєму домі ми зупинялися.", es: "Ella es la mujer en cuya casa nos quedamos.", pt: "Ela é a mulher em cuja casa ficamos.", fr: "C’est la femme chez qui nous avons séjourné.", de: "Sie ist die Frau, in deren Haus wir übernachtet haben.", it: "È la donna in casa della quale abbiamo alloggiato.", pl: "To kobieta, w której domu się zatrzymaliśmy.", tr: "Evinde kaldığımız kadın o.", id: "Dialah perempuan yang rumahnya kami tinggali.", vi: "Cô ấy là người phụ nữ mà chúng tôi đã ở nhà." } }

