  - title: { en: "Form: defining clauses", uk: "Форма: обмежувальні речення (defining)", es: "Forma: oraciones especificativas (defining)", pt: "Forma: orações restritivas (defining)", fr: "Forme : propositions déterminatives (defining)", de: "Form: notwendige Relativsätze", it: "Forma: proposizioni restrittive (defining)", pl: "Forma: zdania definiujące (defining)", tr: "Biçim: belirleyici cümleler (defining)", id: "Bentuk: klausa yang membatasi (defining)", vi: "Dạng: mệnh đề xác định (defining)" }
    role: form
    content:
      - type: prose
        level: B1
        text:
          en: A defining clause says which person or thing. It has no commas.
          uk: "Обмежувальне підрядне речення вказує, про яку саме особу чи про який предмет ідеться. В англійській мові воно не виділяється комами."
          es: "Una oración especificativa dice de qué persona o cosa se habla. No lleva comas."
          pt: "Uma oração restritiva diz de que pessoa ou coisa se fala. Não leva vírgulas."
          fr: "Une proposition déterminative précise de quelle personne ou de quelle chose il s’agit. Elle ne prend pas de virgules."
          de: "Ein notwendiger Relativsatz sagt, welche Person oder Sache gemeint ist. Er hat keine Kommas."
          it: "Una proposizione restrittiva dice di quale persona o cosa si parla. Non ha virgole."
          pl: "Zdanie definiujące wskazuje, o którą osobę lub rzecz chodzi. W angielskim nie oddziela się go przecinkami."
          tr: "Belirleyici cümle, hangi kişi ya da şeyden söz edildiğini belirtir. Virgül kullanılmaz."
          id: "Klausa yang membatasi menyebutkan orang atau benda yang dimaksud. Klausa ini tidak memakai koma."
          vi: "Mệnh đề xác định cho biết là người hay vật nào. Không có dấu phẩy."
        ex: ["The man ", { target: who called }, " is my uncle."]
        tr: { uk: "Чоловік, який телефонував, — мій дядько.", es: "El hombre que llamó es mi tío.", pt: "O homem que ligou é meu tio.", fr: "L’homme qui a appelé est mon oncle.", de: "Der Mann, der angerufen hat, ist mein Onkel.", it: "L'uomo che ha chiamato è mio zio.", pl: "Mężczyzna, który dzwonił, jest moim wujkiem.", tr: "Arayan adam amcam.", id: "Pria yang menelepon itu paman saya.", vi: "Người đàn ông đã gọi điện là chú của tôi." }
      - type: comparison
        columns:
          - { key: role, label: { en: The pronoun is, uk: "Роль займенника", es: "El pronombre es", pt: "O pronome é", fr: "Le pronom est", de: "Das Pronomen ist", it: "Il pronome è", pl: "Zaimek jest", tr: "Zamirin görevi", id: "Kata gantinya adalah", vi: "Đại từ là" } }
          - { key: with, label: { en: With pronoun, uk: "З займенником", es: "Con pronombre", pt: "Com pronome", fr: "Avec pronom", de: "Mit Pronomen", it: "Con il pronome", pl: "Z zaimkiem", tr: "Zamirle", id: "Dengan kata ganti", vi: "Có đại từ" } }
          - { key: without, label: { en: Without pronoun, uk: "Без займенника", es: "Sin pronombre", pt: "Sem pronome", fr: "Sans pronom", de: "Ohne Pronomen", it: "Senza il pronome", pl: "Bez zaimka", tr: "Zamirsiz", id: "Tanpa kata ganti", vi: "Không có đại từ" } }
        rows:
          - { level: B1, role: { en: subject (verb follows), uk: "підмет (далі йде дієслово)", es: "sujeto (sigue un verbo)", pt: "sujeito (vem um verbo depois)", fr: "sujet (un verbe suit)", de: "Subjekt (ein Verb folgt)", it: "soggetto (segue un verbo)", pl: "podmiotem (dalej następuje czasownik)", tr: "özne (ardından fiil gelir)", id: "subjek (diikuti kata kerja)", vi: "chủ ngữ (theo sau là động từ)" }, with: { ex: ["The girl ", { target: who speaks }, " French is my cousin."], tr: { uk: "Дівчина, яка розмовляє французькою, — моя двоюрідна сестра.", es: "La chica que habla francés es mi prima.", pt: "A garota que fala francês é minha prima.", fr: "La fille qui parle français est ma cousine.", de: "Das Mädchen, das Französisch spricht, ist meine Cousine.", it: "La ragazza che parla francese è mia cugina.", pl: "Dziewczyna, która mówi po francusku, jest moją kuzynką.", tr: "Fransızca konuşan kız kuzenim.", id: "Gadis yang berbicara bahasa Prancis itu sepupu saya.", vi: "Cô gái nói tiếng Pháp là em họ của tôi." } } }
          - { level: B1, role: { en: object (subject follows), uk: "додаток (далі йде підмет)", es: "objeto (sigue un sujeto)", pt: "objeto (vem um sujeito depois)", fr: "complément (un sujet suit)", de: "Objekt (ein Subjekt folgt)", it: "complemento (segue un soggetto)", pl: "dopełnieniem (dalej następuje podmiot)", tr: "nesne (ardından özne gelir)", id: "objek (diikuti subjek)", vi: "tân ngữ (theo sau là chủ ngữ)" }, with: { ex: ["The film ", { target: that I saw }, " was long."], tr: { uk: "Фільм, який я бачив, був довгим.", es: "La película que vi era larga.", pt: "O filme que eu vi era longo.", fr: "Le film que j’ai vu était long.", de: "Der Film, den ich gesehen habe, war lang.", it: "Il film che ho visto era lungo.", pl: "Film, który widziałem, był długi.", tr: "Gördüğüm film uzundu.", id: "Film yang saya tonton itu panjang.", vi: "Bộ phim tôi đã xem rất dài." } }, without: { ex: ["The film ", { target: I saw }, " was long."], tr: { uk: "Фільм, який я бачив, був довгим.", es: "La película que vi era larga.", pt: "O filme que eu vi era longo.", fr: "Le film que j’ai vu était long.", de: "Der Film, den ich gesehen habe, war lang.", it: "Il film che ho visto era lungo.", pl: "Film, który widziałem, był długi.", tr: "Gördüğüm film uzundu.", id: "Film yang saya tonton itu panjang.", vi: "Bộ phim tôi đã xem rất dài." } } }
          - { level: B1, role: { en: object of a preposition, uk: "додаток прийменника", es: "objeto de una preposición", pt: "objeto de uma preposição", fr: "complément d’une préposition", de: "Objekt einer Präposition", it: "complemento di una preposizione", pl: "dopełnieniem przyimka", tr: "edatın nesnesi", id: "objek kata depan", vi: "tân ngữ của giới từ" }, with: { ex: ["The man ", { target: who I spoke to }, " was kind."], tr: { uk: "Чоловік, з яким я розмовляв, був добрим.", es: "El hombre con quien hablé era amable.", pt: "O homem com quem falei era simpático.", fr: "L’homme à qui j’ai parlé était gentil.", de: "Der Mann, mit dem ich gesprochen habe, war freundlich.", it: "L'uomo con cui ho parlato era gentile.", pl: "Mężczyzna, z którym rozmawiałem, był miły.", tr: "Konuştuğum adam nazikti.", id: "Pria yang saya ajak bicara itu ramah.", vi: "Người đàn ông tôi đã nói chuyện cùng rất tốt bụng." } }, without: { ex: ["The man ", { target: I spoke to }, " was kind."], tr: { uk: "Чоловік, з яким я розмовляв, був добрим.", es: "El hombre con quien hablé era amable.", pt: "O homem com quem falei era simpático.", fr: "L’homme à qui j’ai parlé était gentil.", de: "Der Mann, mit dem ich gesprochen habe, war freundlich.", it: "L'uomo con cui ho parlato era gentile.", pl: "Mężczyzna, z którym rozmawiałem, był miły.", tr: "Konuştuğum adam nazikti.", id: "Pria yang saya ajak bicara itu ramah.", vi: "Người đàn ông tôi đã nói chuyện cùng rất tốt bụng." } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A subject pronoun stays: ", { alternatives: [{ term: who }, { term: which }, { term: that }] }, " is followed by a verb."]
