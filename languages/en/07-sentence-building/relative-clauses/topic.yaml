        rows:
          - { level: C1, mark: { en: commas, uk: "коми", es: "comas", pt: "vírgulas", fr: "virgules", de: "Kommas", it: "virgole", pl: "przecinki", tr: "virgüller", id: "koma", vi: "dấu phẩy" }, use: { en: "a pair around a clause in the middle of the sentence", uk: "дві коми навколо підрядного речення всередині речення", es: "un par de comas alrededor de una oración en medio de la frase", pt: "um par de vírgulas ao redor de uma oração no meio da frase", fr: "une paire de virgules autour d’une proposition au milieu de la phrase", de: "ein Kommapaar um einen Satz in der Mitte des Satzes", it: "una coppia di virgole intorno a una proposizione a metà frase", pl: "para przecinków wokół zdania w środku wypowiedzenia", tr: "cümlenin ortasındaki bir yan cümlenin iki yanında bir çift virgül", id: "sepasang koma di sekeliling klausa di tengah kalimat", vi: "một cặp dấu phẩy quanh mệnh đề ở giữa câu" }, ex: ["My sister, ", { target: "who lives in Leeds" }, ", is a nurse."], tr: { uk: "Моя сестра, яка живе в Лідсі, — медсестра.", es: "Mi hermana, que vive en Leeds, es enfermera.", pt: "Minha irmã, que mora em Leeds, é enfermeira.", fr: "Ma sœur, qui habite à Leeds, est infirmière.", de: "Meine Schwester, die in Leeds wohnt, ist Krankenschwester.", it: "Mia sorella, che vive a Leeds, è infermiera.", pl: "Moja siostra, która mieszka w Leeds, jest pielęgniarką.", tr: "Leeds’te yaşayan kız kardeşim hemşire.", id: "Saudari saya, yang tinggal di Leeds, adalah perawat.", vi: "Chị gái tôi, người sống ở Leeds, là y tá." } }
          - { level: C1, mark: { en: commas, uk: "коми", es: "comas", pt: "vírgulas", fr: "virgules", de: "Kommas", it: "virgole", pl: "przecinki", tr: "virgüller", id: "koma", vi: "dấu phẩy" }, use: { en: "one comma before a clause at the end", uk: "одна кома перед підрядним реченням у кінці", es: "una coma antes de una oración al final", pt: "uma vírgula antes de uma oração no fim", fr: "une virgule avant une proposition en fin de phrase", de: "ein Komma vor einem Satz am Ende", it: "una virgola prima di una proposizione in fondo", pl: "jeden przecinek przed zdaniem na końcu", tr: "sondaki bir yan cümleden önce tek virgül", id: "satu koma sebelum klausa di akhir", vi: "một dấu phẩy trước mệnh đề ở cuối câu" }, ex: ["I called my sister, ", { target: "who lives in Leeds" }, "."], tr: { uk: "Я зателефонував сестрі, яка живе в Лідсі.", es: "Llamé a mi hermana, que vive en Leeds.", pt: "Liguei para minha irmã, que mora em Leeds.", fr: "J’ai appelé ma sœur, qui habite à Leeds.", de: "Ich habe meine Schwester angerufen, die in Leeds wohnt.", it: "Ho chiamato mia sorella, che vive a Leeds.", pl: "Zadzwoniłem do siostry, która mieszka w Leeds.", tr: "Leeds’te yaşayan kız kardeşimi aradım.", id: "Saya menelepon saudari saya, yang tinggal di Leeds.", vi: "Tôi đã gọi cho chị gái, người sống ở Leeds." } }
          - { level: C1, mark: { en: dashes, uk: "тире", es: "rayas", pt: "travessões", fr: "tirets", de: "Gedankenstriche", it: "lineette", pl: "myślniki", tr: "tireler", id: "tanda pisah", vi: "dấu gạch ngang" }, use: { en: "a stronger break, in informal or dramatic writing", uk: "сильніша пауза, у неформальному або драматичному тексті", es: "una pausa más fuerte, en textos informales o dramáticos", pt: "uma pausa mais forte, em textos informais ou dramáticos", fr: "une coupure plus forte, dans un texte familier ou dramatique", de: "ein stärkerer Einschnitt, in informellen oder dramatischen Texten", it: "una pausa più forte, in testi informali o drammatici", pl: "mocniejsza przerwa, w tekście nieformalnym lub dramatycznym", tr: "daha güçlü bir ara; resmî olmayan ya da dramatik yazıda", id: "jeda yang lebih kuat, dalam tulisan informal atau dramatis", vi: "ngắt mạnh hơn, trong văn viết thân mật hoặc kịch tính" }, ex: ["My sister – ", { target: "who lives in Leeds" }, " – is a nurse."], tr: { uk: "Моя сестра — яка живе в Лідсі — медсестра.", es: "Mi hermana —que vive en Leeds— es enfermera.", pt: "Minha irmã – que mora em Leeds – é enfermeira.", fr: "Ma sœur – qui habite à Leeds – est infirmière.", de: "Meine Schwester – die in Leeds wohnt – ist Krankenschwester.", it: "Mia sorella – che vive a Leeds – è infermiera.", pl: "Moja siostra – która mieszka w Leeds – jest pielęgniarką.", tr: "Kız kardeşim – Leeds’te yaşıyor – hemşire.", id: "Saudari saya – yang tinggal di Leeds – adalah perawat.", vi: "Chị gái tôi – người sống ở Leeds – là y tá." } }

  - title: { en: "Formal relative adverbs", uk: "Формальні відносні прислівники", es: "Adverbios relativos formales", pt: "Advérbios relativos formais", fr: "Adverbes relatifs soutenus", de: "Förmliche Relativadverbien", it: "Avverbi relativi formali", pl: "Formalne przysłówki względne", tr: "Resmî ilgi zarfları", id: "Adverbia relatif formal", vi: "Phó từ quan hệ trang trọng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: means, label: { en: Means, uk: "Значення", es: "Significa", pt: "Significa", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlamı", id: "Artinya", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: whereby, means: { en: "by which", uk: "за допомогою якого", es: "mediante el cual", pt: "pelo qual", fr: "par lequel", de: "durch den, die oder das", it: "mediante il quale", pl: "za pomocą którego", tr: "bu yolla", id: "yang dengannya", vi: "theo đó" }, ex: ["They set up a system ", { target: whereby }, " tickets are sold online."], tr: { uk: "Вони створили систему, за якою квитки продаються онлайн.", es: "Crearon un sistema por el cual los boletos se venden en línea.", pt: "Eles criaram um sistema pelo qual os ingressos são vendidos on-line.", fr: "Ils ont mis en place un système par lequel les billets sont vendus en ligne.", de: "Sie richteten ein System ein, wonach die Tickets online verkauft werden.", it: "Hanno creato un sistema per cui i biglietti si vendono online.", pl: "Stworzyli system, w którym bilety są sprzedawane online.", tr: "Biletlerin internetten satıldığı bir sistem kurdular.", id: "Mereka membuat sistem yang membuat tiket dijual secara daring.", vi: "Họ lập ra một hệ thống theo đó vé được bán trực tuyến." } }
          - { level: C2, form: wherein, means: { en: "in which", uk: "у якому", es: "en el cual", pt: "no qual", fr: "dans lequel", de: "in dem oder in der", it: "nel quale", pl: "w którym", tr: "bunun içinde", id: "di dalamnya", vi: "trong đó" }, ex: ["The report, ", { target: wherein }, " the terms are set out, is online."], tr: { uk: "Звіт, у якому викладено умови, є в мережі.", es: "El informe, en el cual se exponen los términos, está en línea.", pt: "O relatório, no qual os termos são apresentados, está on-line.", fr: "Le rapport, dans lequel les conditions sont exposées, est en ligne.", de: "Der Bericht, in dem die Bedingungen dargelegt sind, ist online.", it: "Il rapporto, nel quale sono esposti i termini, è online.", pl: "Raport, w którym przedstawiono warunki, jest dostępny online.", tr: "Koşulların belirtildiği rapor internette.", id: "Laporan itu, yang memuat ketentuannya, tersedia daring.", vi: "Báo cáo, trong đó nêu rõ các điều khoản, có trên mạng." } }
          - { level: C2, form: whereupon, means: { en: "after which, and then", uk: "після чого, а потім", es: "después de lo cual, y entonces", pt: "depois do que, e então", fr: "après quoi, et alors", de: "woraufhin, und dann", it: "dopodiché, e allora", pl: "po czym, a potem", tr: "bunun üzerine, ve sonra", id: "setelah itu, dan kemudian", vi: "sau đó, và rồi" }, ex: ["He objected, ", { target: whereupon }, " she left."], tr: { uk: "Він заперечив, після чого вона пішла.", es: "Él se opuso, tras lo cual ella se fue.", pt: "Ele protestou, depois do que ela saiu.", fr: "Il a protesté, sur quoi elle est partie.", de: "Er protestierte, woraufhin sie ging.", it: "Lui protestò, dopodiché lei se ne andò.", pl: "Zaprotestował, po czym ona wyszła.", tr: "İtiraz etti, bunun üzerine kadın çıktı.", id: "Pria itu keberatan, setelah itu perempuan itu pergi.", vi: "Anh ấy phản đối, ngay sau đó cô ấy bỏ đi." } }
          - { level: C2, form: thereof, means: { en: "of it or of that; formal and legal", uk: "цього або того; формальне й юридичне слово", es: "de ello o de eso; formal y jurídico", pt: "disso ou dele; formal e jurídico", fr: "de cela ; soutenu et juridique", de: "davon oder dessen; förmlich und juristisch", it: "di esso o di ciò; formale e giuridico", pl: "tego lub jego; formalne i prawnicze", tr: "bunun; resmî ve hukuki", id: "dari itu atau darinya; formal dan hukum", vi: "của nó hoặc của điều đó; trang trọng và pháp lý" }, ex: ["The terms ", { target: thereof }, " are set out below."], tr: { uk: "Умови цього викладено нижче.", es: "Los términos del mismo se exponen a continuación.", pt: "Os termos do mesmo estão descritos abaixo.", fr: "Les conditions de celui-ci sont exposées ci-dessous.", de: "Die Bedingungen hierzu sind unten aufgeführt.", it: "I termini relativi sono esposti di seguito.", pl: "Jego warunki przedstawiono poniżej.", tr: "Bunun koşulları aşağıda belirtilmiştir.", id: "Ketentuannya diuraikan di bawah ini.", vi: "Các điều khoản của nó được nêu dưới đây." } }
          - { level: C2, form: in respect of which, means: { en: "concerning", uk: "щодо", es: "con respecto a", pt: "a respeito de", fr: "concernant", de: "bezüglich", it: "riguardo a", pl: "w odniesieniu do", tr: "ile ilgili", id: "mengenai", vi: "liên quan đến" }, ex: ["It is a sum ", { target: "in respect of which" }, " tax is due."], tr: { uk: "Це сума, щодо якої сплачується податок.", es: "Es una suma respecto de la cual se debe pagar impuesto.", pt: "É uma quantia sobre a qual é devido imposto.", fr: "C’est une somme au titre de laquelle l’impôt est dû.", de: "Es ist ein Betrag, für den Steuer fällig ist.", it: "È una somma per la quale è dovuta l'imposta.", pl: "To kwota, od której należy zapłacić podatek.", tr: "Bu, vergisi ödenmesi gereken bir tutar.", id: "Ini adalah jumlah yang atasnya terutang pajak.", vi: "Đây là khoản tiền phải nộp thuế." } }
          - { level: C2, form: the extent to which, means: { en: "how far", uk: "наскільки", es: "hasta qué punto", pt: "até que ponto", fr: "jusqu’où", de: "inwieweit", it: "fino a che punto", pl: "w jakim stopniu", tr: "ne ölçüde", id: "sejauh mana", vi: "đến mức nào" }, ex: ["We discussed ", { target: "the extent to which" }, " they cooperate."], tr: { uk: "Ми обговорили, наскільки вони співпрацюють.", es: "Hablamos de hasta qué punto cooperan.", pt: "Discutimos até que ponto eles cooperam.", fr: "Nous avons discuté de la mesure dans laquelle ils coopèrent.", de: "Wir haben besprochen, inwieweit sie zusammenarbeiten.", it: "Abbiamo discusso fino a che punto collaborano.", pl: "Omówiliśmy, w jakim stopniu współpracują.", tr: "Ne ölçüde iş birliği yaptıklarını konuştuk.", id: "Kami membahas sejauh mana mereka bekerja sama.", vi: "Chúng tôi đã bàn xem họ hợp tác ở mức độ nào." } }
          - { level: C2, form: the basis on which, means: { en: "the grounds of a decision", uk: "підстави рішення", es: "los fundamentos de una decisión", pt: "os fundamentos de uma decisão", fr: "les motifs d’une décision", de: "die Gründe einer Entscheidung", it: "i motivi di una decisione", pl: "podstawy decyzji", tr: "bir kararın dayanağı", id: "dasar suatu keputusan", vi: "căn cứ của một quyết định" }, ex: ["They explained ", { target: "the basis on which" }, " the prize is awarded."], tr: { uk: "Вони пояснили, на якій підставі присуджують нагороду.", es: "Explicaron el fundamento con el que se otorga el premio.", pt: "Eles explicaram o fundamento com base no qual o prêmio é concedido.", fr: "Ils ont expliqué sur quelle base le prix est attribué.", de: "Sie erklärten, auf welcher Grundlage der Preis vergeben wird.", it: "Hanno spiegato in base a quali criteri viene assegnato il premio.", pl: "Wyjaśnili, na jakiej podstawie przyznaje się nagrodę.", tr: "Ödülün hangi gerekçeyle verildiğini açıkladılar.", id: "Mereka menjelaskan dasar pemberian hadiah itu.", vi: "Họ giải thích căn cứ để trao giải thưởng." } }
          - { level: C2, form: the manner in which, means: { en: "the way something is done", uk: "спосіб, у який щось робиться", es: "la manera en que se hace algo", pt: "a maneira como algo é feito", fr: "la manière dont quelque chose est fait", de: "die Art, wie etwas gemacht wird", it: "il modo in cui si fa qualcosa", pl: "sposób, w jaki coś się robi", tr: "bir şeyin yapılış biçimi", id: "cara sesuatu dilakukan", vi: "cách thức làm một việc" }, ex: ["I admired ", { target: "the manner in which" }, " she handled it."], tr: { uk: "Я захоплювався тим, як вона з цим упоралася.", es: "Admiré la manera en que lo manejó.", pt: "Admirei a maneira como ela lidou com isso.", fr: "J’ai admiré la manière dont elle s’en est occupée.", de: "Ich bewunderte die Art, wie sie damit umging.", it: "Ho ammirato il modo in cui l'ha gestito.", pl: "Podziwiałem sposób, w jaki sobie z tym poradziła.", tr: "Bunu ele alış biçimine hayran kaldım.", id: "Saya kagum pada cara dia menanganinya.", vi: "Tôi ngưỡng mộ cách cô ấy xử lý việc đó." } }

  - title: { en: "Form: whose and of which", uk: "Форма: whose і of which", es: "Forma: whose y of which", pt: "Forma: whose e of which", fr: "Forme : whose et of which", de: "Form: whose und of which", it: "Forma: whose e of which", pl: "Forma: whose i of which", tr: "Biçim: whose ve of which", id: "Bentuk: whose dan of which", vi: "Dạng: whose và of which" }
