          - { level: C1, form: { pattern: [such, { slot: noun }, as] }, use: { en: "things of the kind that follows", uk: "речі того роду, що названий далі", es: "cosas del tipo que se menciona a continuación", pt: "coisas do tipo que vem a seguir", fr: "des choses du genre qui suit", de: "Dinge der Art, die danach genannt wird", it: "cose del tipo che segue", pl: "rzeczy takiego rodzaju, jaki następuje dalej", tr: "ardından gelen türden şeyler", id: "benda-benda dari jenis yang disebutkan berikutnya", vi: "những thứ thuộc loại được nêu tiếp theo" }, ex: ["He lent me ", { target: "such books as" }, " he had."], tr: { uk: "Він позичив мені такі книжки, які в нього були.", es: "Me prestó los libros que tenía.", pt: "Ele me emprestou os livros que tinha.", fr: "Il m’a prêté les livres qu’il avait.", de: "Er hat mir die Bücher geliehen, die er hatte.", it: "Mi ha prestato i libri che aveva.", pl: "Pożyczył mi takie książki, jakie miał.", tr: "Bana elindeki kitapları ödünç verdi.", id: "Dia meminjamkan saya buku-buku yang dia punya.", vi: "Anh ấy cho tôi mượn những cuốn sách mà anh ấy có." } }
