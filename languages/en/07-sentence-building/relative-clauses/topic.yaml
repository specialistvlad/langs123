          - { level: B2, word: why, after: { en: "the noun reason", uk: "іменник reason", es: "el sustantivo reason", pt: "o substantivo reason", fr: "le nom reason", de: "das Nomen reason", it: "il sostantivo reason", pl: "rzeczownik reason", tr: "reason ismi", id: "kata benda reason", vi: "danh từ reason" }, ex: ["That is the reason ", { optional: why }, " he left."], tr: { uk: "Це причина, чому він пішов.", es: "Esa es la razón por la que se fue.", pt: "Essa é a razão pela qual ele foi embora.", fr: "C’est la raison pour laquelle il est parti.", de: "Das ist der Grund, warum er gegangen ist.", it: "Questo è il motivo per cui se n'è andato.", pl: "To jest powód, dla którego wyszedł.", tr: "Gitmesinin nedeni bu.", id: "Itulah alasan dia pergi.", vi: "Đó là lý do anh ấy rời đi." } }
