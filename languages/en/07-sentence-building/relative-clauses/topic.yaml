          - { level: C1, form: { pattern: [as many, { slot: noun }, as] }, use: { en: "an amount equal to the need", uk: "кількість, що дорівнює потребі", es: "una cantidad igual a la necesaria", pt: "uma quantidade igual à necessária", fr: "une quantité égale au besoin", de: "eine Menge, die dem Bedarf entspricht", it: "una quantità pari al bisogno", pl: "ilość równa potrzebie", tr: "ihtiyaca eşit bir miktar", id: "jumlah yang sama dengan kebutuhan", vi: "số lượng bằng với nhu cầu" }, ex: ["Take ", { target: "as many books as" }, " you need."], tr: { uk: "Бери стільки книжок, скільки тобі потрібно.", es: "Toma todos los libros que necesites.", pt: "Pegue quantos livros precisar.", fr: "Prends autant de livres qu’il t’en faut.", de: "Nimm so viele Bücher, wie du brauchst.", it: "Prendi quanti libri ti servono.", pl: "Weź tyle książek, ile potrzebujesz.", tr: "İhtiyacın kadar kitap al.", id: "Ambil buku sebanyak yang kamu butuhkan.", vi: "Hãy lấy bao nhiêu sách tùy bạn cần." } }

