title: { en: Relative Clauses, uk: Означальні підрядні речення, es: Oraciones de relativo, pt: "Orações relativas", fr: "Propositions relatives", de: "Relativsätze", it: "Proposizioni relative", pl: "Zdania względne", tr: "İlgi cümleleri", id: "Klausa relatif", vi: "Mệnh đề quan hệ" }
summary:
  lead:
    en: ["Relative clauses add information about a noun with ", { term: who }, " for people, ", { term: which }, " for things, ", { term: that }, ", ", { term: whose }, " and ", { term: where }, "."]
    uk: ["Означальні підрядні речення додають інформацію про іменник за допомогою ", { term: who }, " для людей, ", { term: which }, " для предметів, ", { term: that }, ", ", { term: whose }, " і ", { term: where }, "."]
    es: ["Las oraciones de relativo añaden información sobre un sustantivo con ", { term: who }, " para personas, ", { term: which }, " para cosas, ", { term: that }, ", ", { term: whose }, " y ", { term: where }, "."]
    pt: ["As orações relativas acrescentam informação sobre um substantivo com ", { term: "who" }, " para pessoas, ", { term: "which" }, " para coisas, ", { term: "that" }, ", ", { term: "whose" }, " e ", { term: "where" }, "."]
    fr: ["Les propositions relatives ajoutent une information sur un nom avec ", { term: "who" }, " pour les personnes, ", { term: "which" }, " pour les choses, ", { term: "that" }, ", ", { term: "whose" }, " et ", { term: "where" }, "."]
    de: ["Relativsätze ergänzen Informationen zu einem Nomen mit ", { term: "who" }, " für Personen, ", { term: "which" }, " für Dinge, ", { term: "that" }, ", ", { term: "whose" }, " und ", { term: "where" }, "."]
    it: ["Le proposizioni relative aggiungono informazioni su un sostantivo con ", { term: "who" }, " per le persone, ", { term: "which" }, " per le cose, ", { term: "that" }, ", ", { term: "whose" }, " e ", { term: "where" }, "."]
    pl: ["Zdania względne dodają informację o rzeczowniku za pomocą ", { term: "who" }, " dla osób, ", { term: "which" }, " dla rzeczy, ", { term: "that" }, ", ", { term: "whose" }, " i ", { term: "where" }, "."]
    tr: ["İlgi cümleleri bir isim hakkında ek bilgi verir: insanlar için ", { term: "who" }, ", şeyler için ", { term: "which" }, "; ayrıca ", { term: "that" }, ", ", { term: "whose" }, " ve ", { term: "where" }, "."]
    id: ["Klausa relatif menambahkan informasi tentang kata benda dengan ", { term: "who" }, " untuk orang, ", { term: "which" }, " untuk benda, ", { term: "that" }, ", ", { term: "whose" }, " dan ", { term: "where" }, "."]
    vi: ["Mệnh đề quan hệ bổ sung thông tin cho danh từ bằng ", { term: "who" }, " cho người, ", { term: "which" }, " cho vật, ", { term: "that" }, ", ", { term: "whose" }, " và ", { term: "where" }, "."]
  rule:
    en: [{ term: Who }, ", ", { term: which }, " and ", { term: that }, " replace the noun and the clause has no second pronoun:"]
    uk: [{ term: Who }, ", ", { term: which }, " і ", { term: that }, " замінюють іменник, тож у підрядному реченні немає другого займенника:"]
    es: [{ term: Who }, ", ", { term: which }, " y ", { term: that }, " sustituyen al sustantivo y la oración no lleva un segundo pronombre:"]
    pt: [{ term: "Who" }, ", ", { term: "which" }, " e ", { term: "that" }, " substituem o substantivo e a oração não leva um segundo pronome:"]
    fr: [{ term: "Who" }, ", ", { term: "which" }, " et ", { term: "that" }, " remplacent le nom et la proposition n’a pas de second pronom :"]
    de: [{ term: "Who" }, ", ", { term: "which" }, " und ", { term: "that" }, " ersetzen das Nomen, und der Satz enthält kein zweites Pronomen:"]
    it: [{ term: "Who" }, ", ", { term: "which" }, " e ", { term: "that" }, " sostituiscono il sostantivo e la proposizione non ha un secondo pronome:"]
    pl: [{ term: "Who" }, ", ", { term: "which" }, " i ", { term: "that" }, " zastępują rzeczownik, więc w zdaniu względnym nie ma drugiego zaimka:"]
    tr: [{ term: "Who" }, ", ", { term: "which" }, " ve ", { term: "that" }, " ismin yerini tutar; cümlede ikinci bir zamir bulunmaz:"]
    id: [{ term: "Who" }, ", ", { term: "which" }, " dan ", { term: "that" }, " menggantikan kata benda, dan klausa tidak memakai kata ganti kedua:"]
    vi: [{ term: "Who" }, ", ", { term: "which" }, " và ", { term: "that" }, " thay thế danh từ, nên mệnh đề không có đại từ thứ hai:"]
  ex: ["The woman ", { target: who }, " lives here is my aunt."]

