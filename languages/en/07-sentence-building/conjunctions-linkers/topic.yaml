    vi: ["Từ nối liên kết các ý: ", { term: "and" }, " thêm ý, ", { term: "but" }, " chỉ sự đối lập, ", { term: "or" }, " đưa ra lựa chọn, ", { term: "because" }, " nêu lý do và ", { term: "so" }, " nêu kết quả."]
  rule:
    en: ["A comma comes before ", { term: but }, " and ", { term: so }, " between two clauses:"]
    uk: ["Між двома частинами речення перед ", { term: but }, " і ", { term: so }, " ставлять кому:"]
    es: ["Entre dos oraciones, antes de ", { term: but }, " y ", { term: so }, " va una coma:"]
    pt: ["Entre duas orações, antes de ", { term: "but" }, " e ", { term: "so" }, " vai uma vírgula:"]
    fr: ["Entre deux propositions, une virgule précède ", { term: "but" }, " et ", { term: "so" }, " :"]
    de: ["Zwischen zwei Teilsätzen steht vor ", { term: "but" }, " und ", { term: "so" }, " ein Komma:"]
    it: ["Tra due proposizioni, prima di ", { term: "but" }, " e ", { term: "so" }, " va una virgola:"]
    pl: ["Między dwiema częściami zdania przed ", { term: "but" }, " i ", { term: "so" }, " stawia się przecinek:"]
    tr: ["İki cümle arasında ", { term: "but" }, " ve ", { term: "so" }, " sözcüklerinden önce virgül gelir:"]
    id: ["Koma diletakkan sebelum ", { term: "but" }, " dan ", { term: "so" }, " di antara dua klausa:"]
    vi: ["Giữa hai mệnh đề, dấu phẩy đứng trước ", { term: "but" }, " và ", { term: "so" }, ":"]
  ex: { examples: [I was tired, [{ target: so }, " I left."]] }

