    pl: ["Słowa łączące spajają myśli: ", { term: "and" }, " dodaje, ", { term: "but" }, " przeciwstawia, ", { term: "or" }, " daje wybór, ", { term: "because" }, " podaje przyczynę, a ", { term: "so" }, " — skutek."]
    tr: ["Bağlayıcılar düşünceleri birleştirir: ", { term: "and" }, " ekler, ", { term: "but" }, " karşıtlık kurar, ", { term: "or" }, " seçenek sunar, ", { term: "because" }, " sebebi, ", { term: "so" }, " sonucu bildirir."]
