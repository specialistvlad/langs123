        rows:
          - { level: C2, linker: { term: admittedly }, use: { en: "grants a point against your own argument", uk: "визнає аргумент, що суперечить власному", es: "concede un punto en contra de tu propio argumento", pt: "concede um ponto contra o seu próprio argumento", fr: "concède un point contre son propre argument", de: "räumt einen Punkt gegen das eigene Argument ein", it: "concede un punto contro il proprio argomento", pl: "przyznaje rację punktowi przeciw własnemu argumentowi", tr: "kendi savına karşı bir noktayı kabul eder", id: "mengakui poin yang menentang argumen sendiri", vi: "thừa nhận một điểm chống lại lập luận của chính mình" }, ex: [{ target: Admittedly }, ", the film is long, but it is worth it."], tr: { uk: "Щоправда, фільм довгий, але він вартий того.", es: "Es cierto que la película es larga, pero vale la pena.", pt: "É verdade que o filme é longo, mas vale a pena.", fr: "Certes, le film est long, mais il en vaut la peine.", de: "Zugegeben, der Film ist lang, aber er lohnt sich.", it: "Certo, il film è lungo, ma ne vale la pena.", pl: "Co prawda film jest długi, ale warto.", tr: "Doğrusu film uzun, ama buna değer.", id: "Memang, filmnya panjang, tetapi layak ditonton.", vi: "Đúng là bộ phim dài, nhưng nó đáng xem." } }
          - { level: C2, linker: { term: granted }, use: { en: "accepts a point before replying", uk: "приймає аргумент, перш ніж відповісти", es: "acepta un punto antes de responder", pt: "aceita um ponto antes de responder", fr: "accepte un point avant de répondre", de: "akzeptiert einen Punkt, bevor man antwortet", it: "accetta un punto prima di rispondere", pl: "przyjmuje argument, zanim padnie odpowiedź", tr: "karşılık vermeden önce bir noktayı kabul eder", id: "menerima suatu poin sebelum menanggapi", vi: "chấp nhận một điểm trước khi đáp lại" }, ex: [{ target: Granted }, ", the plan is risky, but it may work."], tr: { uk: "Припустимо, план ризикований, але він може спрацювати.", es: "De acuerdo, el plan es arriesgado, pero puede funcionar.", pt: "Admito que o plano é arriscado, mas pode funcionar.", fr: "Soit, le plan est risqué, mais il peut marcher.", de: "Gewiss, der Plan ist riskant, aber er könnte funktionieren.", it: "D'accordo, il piano è rischioso, ma potrebbe funzionare.", pl: "Niech będzie, plan jest ryzykowny, ale może się udać.", tr: "Kabul, plan riskli, ama işe yarayabilir.", id: "Baiklah, rencana itu berisiko, tetapi mungkin berhasil.", vi: "Đành thừa nhận, kế hoạch này rủi ro, nhưng có thể thành công." } }
          - { level: C2, linker: { term: arguably }, use: { en: "can be argued; goes before the word it qualifies", uk: "можна стверджувати; стоїть перед словом, яке уточнює", es: "se puede argumentar; va antes de la palabra que matiza", pt: "pode-se argumentar; vem antes da palavra que ele qualifica", fr: "on peut soutenir que ; se place avant le mot qu’il nuance", de: "man kann argumentieren; steht vor dem Wort, das es einschränkt", it: "si può sostenere; va prima della parola che qualifica", pl: "można twierdzić; stoi przed słowem, które określa", tr: "savunulabilir ki; nitelediği sözcüğün önüne gelir", id: "dapat dikatakan; diletakkan sebelum kata yang diterangkan", vi: "có thể cho rằng; đứng trước từ mà nó bổ nghĩa" }, ex: ["She is ", { target: arguably }, " the best player in the team."], tr: { uk: "Вона, можна сказати, найкраща гравчиня в команді.", es: "Es posiblemente la mejor jugadora del equipo.", pt: "Ela é possivelmente a melhor jogadora do time.", fr: "Elle est sans doute la meilleure joueuse de l’équipe.", de: "Sie ist wohl die beste Spielerin im Team.", it: "È probabilmente la miglior giocatrice della squadra.", pl: "Jest bodaj najlepszą zawodniczką w drużynie.", tr: "O, belki de takımın en iyi oyuncusudur.", id: "Dia boleh dibilang pemain terbaik di tim itu.", vi: "Cô ấy có thể nói là cầu thủ giỏi nhất đội." } }
          - { level: C2, linker: { alternatives: [{ term: whereas }, { term: while }] }, use: { en: "whereas only contrasts; while may also mean at the same time", uk: "whereas лише протиставляє; while може означати й одночасність", es: "whereas solo contrasta; while también puede significar al mismo tiempo", pt: "whereas só contrasta; while também pode significar ao mesmo tempo", fr: "whereas ne fait que marquer l’opposition ; while peut aussi signifier en même temps", de: "whereas drückt nur einen Gegensatz aus; while kann auch gleichzeitig bedeuten", it: "whereas contrappone soltanto; while può anche significare nello stesso tempo", pl: "whereas tylko przeciwstawia; while może też znaczyć jednocześnie", tr: "whereas yalnızca karşıtlık kurar; while aynı zamanda anlamına da gelebilir", id: "whereas hanya menyatakan pertentangan; while juga bisa berarti pada saat yang sama", vi: "whereas chỉ để đối lập; while còn có thể có nghĩa là đồng thời" }, ex: ["Wages rose in the north, ", { target: whereas }, " they fell in the south."], tr: { uk: "На півночі зарплати зросли, тоді як на півдні — впали.", es: "Los salarios subieron en el norte, mientras que bajaron en el sur.", pt: "Os salários subiram no norte, ao passo que caíram no sul.", fr: "Les salaires ont augmenté dans le nord, alors qu’ils ont baissé dans le sud.", de: "Im Norden stiegen die Löhne, wohingegen sie im Süden sanken.", it: "Al nord gli stipendi sono saliti, mentre al sud sono scesi.", pl: "Na północy płace wzrosły, podczas gdy na południu spadły.", tr: "Kuzeyde ücretler arttı, oysa güneyde düştü.", id: "Upah naik di utara, sedangkan di selatan upah turun.", vi: "Tiền lương tăng ở miền bắc, trong khi giảm ở miền nam." } }

