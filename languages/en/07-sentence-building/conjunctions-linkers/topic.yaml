              tr: [{ term: "even though" }, ", ", { term: "although" }, " sözcüğünün daha güçlü biçimidir:"]
              id: [{ term: "even though" }, " adalah ", { term: "although" }, " yang lebih kuat:"]
              vi: [{ term: "even though" }, " mạnh hơn ", { term: "although" }, ":"]
            ex: [{ target: Even though }, " I was tired, I went out."]
            tr: { uk: "Незважаючи на те, що я втомився, я вийшов.", es: "A pesar de que estaba cansado, salí.", pt: "Mesmo estando cansado, eu saí.", fr: "Même si j’étais fatigué, je suis sorti.", de: "Obwohl ich müde war, bin ich trotzdem ausgegangen.", it: "Nonostante fossi stanco, sono uscito.", pl: "Mimo że byłem zmęczony, wyszedłem.", tr: "Yorgun olmama rağmen dışarı çıktım.", id: "Walaupun saya lelah, saya tetap keluar.", vi: "Dù tôi mệt, tôi vẫn ra ngoài." }
          - type: rule
            level: B1
            text:
              en: [{ term: however }, " usually starts a new sentence and is followed by a comma."]
