              pt: [{ term: ["either ", { gap: true }, " or"] }, " e ", { term: ["neither ", { gap: true }, " nor"] }, " levam o verbo que concorda com o sujeito mais próximo."]
              fr: [{ term: ["either ", { gap: true }, " or"] }, " et ", { term: ["neither ", { gap: true }, " nor"] }, " prennent le verbe qui s’accorde avec le sujet le plus proche."]
              de: ["Bei ", { term: ["either ", { gap: true }, " or"] }, " und ", { term: ["neither ", { gap: true }, " nor"] }, " richtet sich das Verb nach dem näheren Subjekt."]
              it: [{ term: ["either ", { gap: true }, " or"] }, " e ", { term: ["neither ", { gap: true }, " nor"] }, " vogliono il verbo concordato con il soggetto più vicino."]
              pl: [{ term: ["either ", { gap: true }, " or"] }, " i ", { term: ["neither ", { gap: true }, " nor"] }, " wymagają czasownika zgodnego z bliższym podmiotem."]
              tr: [{ term: ["either ", { gap: true }, " or"] }, " ve ", { term: ["neither ", { gap: true }, " nor"] }, " ile fiil, kendisine en yakın özneye uyar."]
              id: [{ term: ["either ", { gap: true }, " or"] }, " dan ", { term: ["neither ", { gap: true }, " nor"] }, " memakai kata kerja yang sesuai dengan subjek terdekat."]
              vi: [{ term: ["either ", { gap: true }, " or"] }, " và ", { term: ["neither ", { gap: true }, " nor"] }, " dùng động từ hòa hợp với chủ ngữ gần nhất."]
            ex: [{ target: Neither }, " the teacher ", { target: nor }, " the students ", { target: were }, " ready."]
            tr: { uk: "Ні вчитель, ні учні не були готові.", es: "Ni el profesor ni los estudiantes estaban listos.", pt: "Nem o professor nem os alunos estavam prontos.", fr: "Ni le professeur ni les élèves n’étaient prêts.", de: "Weder der Lehrer noch die Schüler waren bereit.", it: "Né l'insegnante né gli studenti erano pronti.", pl: "Ani nauczyciel, ani uczniowie nie byli gotowi.", tr: "Ne öğretmen ne de öğrenciler hazırdı.", id: "Baik guru maupun para siswa belum siap.", vi: "Cả giáo viên lẫn học sinh đều chưa sẵn sàng." }

  - title: { en: "Contrast: although, however, while", uk: "Протиставлення: although, however, while", es: "Contraste: although, however, while", pt: "Contraste: although, however, while", fr: "Opposition : although, however, while", de: "Gegensatz: although, however, while", it: "Contrasto: although, however, while", pl: "Przeciwstawienie: although, however, while", tr: "Karşıtlık: although, however, while", id: "Pertentangan: although, however, while", vi: "Đối lập: although, however, while" }
