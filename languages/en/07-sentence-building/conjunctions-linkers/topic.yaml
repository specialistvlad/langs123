summary:
  lead:
    en: ["Linkers join ideas: ", { term: and }, " adds, ", { term: but }, " contrasts, ", { term: or }, " offers a choice, ", { term: because }, " gives a reason and ", { term: so }, " gives a result."]
    uk: ["Слова-зв’язки поєднують думки: ", { term: and }, " додає, ", { term: but }, " протиставляє, ", { term: or }, " дає вибір, ", { term: because }, " називає причину, а ", { term: so }, " — наслідок."]
