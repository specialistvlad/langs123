              it: [{ term: "because" }, " è seguito da una proposizione: un soggetto e un verbo."]
              pl: [{ term: "because" }, " wymaga po sobie zdania: podmiotu i czasownika."]
              tr: [{ term: "because" }, " sonrasında bir cümle gelir: özne ve fiil."]
