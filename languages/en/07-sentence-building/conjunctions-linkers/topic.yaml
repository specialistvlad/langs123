      rows:
        - { level: A1, point: "and, or", rule: { en: [{ term: and }, " adds an idea, ", { term: or }, " gives a choice; usually no comma before them"], uk: [{ term: and }, " додає думку, ", { term: or }, " дає вибір; перед ними зазвичай немає коми"], es: [{ term: and }, " suma una idea, ", { term: or }, " ofrece una opción; normalmente sin coma delante"], pt: [{ term: "and" }, " soma uma ideia, ", { term: "or" }, " oferece uma opção; normalmente sem vírgula antes"], fr: [{ term: "and" }, " ajoute une idée, ", { term: "or" }, " propose un choix ; en général pas de virgule devant"], de: [{ term: "and" }, " fügt einen Gedanken hinzu, ", { term: "or" }, " bietet eine Wahl; meist kein Komma davor"], it: [{ term: "and" }, " aggiunge un'idea, ", { term: "or" }, " offre una scelta; di solito senza virgola prima"], pl: [{ term: "and" }, " dodaje myśl, ", { term: "or" }, " daje wybór; przed nimi zwykle nie ma przecinka"], tr: [{ term: "and" }, " bir düşünce ekler, ", { term: "or" }, " seçenek sunar; öncesinde genellikle virgül yoktur"], id: [{ term: "and" }, " menambahkan gagasan, ", { term: "or" }, " memberi pilihan; biasanya tanpa koma di depannya"], vi: [{ term: "and" }, " thêm một ý, ", { term: "or" }, " đưa ra lựa chọn; thường không có dấu phẩy trước chúng"] }, ex: { examples: [["I like tea ", { target: and }, " coffee."], ["Do you want tea ", { target: or }, " coffee?"]] }, tr: { uk: { examples: ["Я люблю чай і каву.", "Ти хочеш чаю чи кави?"] }, es: { examples: ["Me gustan el té y el café.", "¿Quieres té o café?"] }, pt: { examples: ["Eu gosto de chá e de café.", "Você quer chá ou café?"] }, fr: { examples: ["J’aime le thé et le café.", "Veux-tu du thé ou du café ?"] }, de: { examples: ["Ich mag Tee und Kaffee.", "Möchtest du Tee oder Kaffee?"] }, it: { examples: ["Mi piacciono il tè e il caffè.", "Vuoi il tè o il caffè?"] }, pl: { examples: ["Lubię herbatę i kawę.", "Chcesz herbatę czy kawę?"] }, tr: { examples: ["Çayı ve kahveyi severim.", "Çay mı kahve mi istersin?"] }, id: { examples: ["Saya suka teh dan kopi.", "Kamu mau teh atau kopi?"] }, vi: { examples: ["Tôi thích trà và cà phê.", "Bạn muốn trà hay cà phê?"] } } }
        - { level: A1, point: "but, so", rule: { en: [{ term: but }, " contrasts, ", { term: so }, " gives a result; usually a comma before them"], uk: [{ term: but }, " протиставляє, ", { term: so }, " називає наслідок; перед ними зазвичай ставлять кому"], es: [{ term: but }, " contrasta, ", { term: so }, " da un resultado; normalmente con coma delante"], pt: [{ term: "but" }, " contrasta, ", { term: "so" }, " dá um resultado; normalmente com vírgula antes"], fr: [{ term: "but" }, " marque l’opposition, ", { term: "so" }, " donne un résultat ; en général une virgule devant"], de: [{ term: "but" }, " drückt einen Gegensatz aus, ", { term: "so" }, " nennt eine Folge; meist ein Komma davor"], it: [{ term: "but" }, " contrappone, ", { term: "so" }, " indica la conseguenza; di solito con la virgola prima"], pl: [{ term: "but" }, " przeciwstawia, ", { term: "so" }, " podaje skutek; przed nimi zwykle stawia się przecinek"], tr: [{ term: "but" }, " karşıtlık kurar, ", { term: "so" }, " sonucu bildirir; öncesinde genellikle virgül gelir"], id: [{ term: "but" }, " menyatakan pertentangan, ", { term: "so" }, " menyatakan akibat; biasanya ada koma di depannya"], vi: [{ term: "but" }, " chỉ sự đối lập, ", { term: "so" }, " nêu kết quả; thường có dấu phẩy trước chúng"] }, ex: { examples: [["I like tea, ", { target: but }, " I don't like coffee."], ["I'm tired, ", { target: so }, " I go to bed."]] }, tr: { uk: { examples: ["Я люблю чай, але не люблю каву.", "Я втомився, тому йду спати."] }, es: { examples: ["Me gusta el té, pero no me gusta el café.", "Estoy cansado, así que me voy a la cama."] }, pt: { examples: ["Eu gosto de chá, mas não gosto de café.", "Estou cansado, por isso vou para a cama."] }, fr: { examples: ["J’aime le thé, mais je n’aime pas le café.", "Je suis fatigué, donc je vais me coucher."] }, de: { examples: ["Ich mag Tee, aber ich mag keinen Kaffee.", "Ich bin müde, also gehe ich ins Bett."] }, it: { examples: ["Mi piace il tè, ma non mi piace il caffè.", "Sono stanco, quindi vado a letto."] }, pl: { examples: ["Lubię herbatę, ale nie lubię kawy.", "Jestem zmęczony, więc idę spać."] }, tr: { examples: ["Çayı severim, ama kahveyi sevmem.", "Yorgunum, bu yüzden yatmaya gidiyorum."] }, id: { examples: ["Saya suka teh, tetapi saya tidak suka kopi.", "Saya lelah, jadi saya pergi tidur."] }, vi: { examples: ["Tôi thích trà, nhưng tôi không thích cà phê.", "Tôi mệt, nên tôi đi ngủ."] } } }
        - { level: A1, point: because, rule: { en: gives the reason; a clause follows, uk: "називає причину; далі йде речення", es: "da la razón; sigue una oración", pt: "dá a razão; segue uma oração", fr: "donne la raison ; une proposition suit", de: "nennt den Grund; es folgt ein Teilsatz", it: "indica la causa; segue una proposizione", pl: "podaje przyczynę; dalej następuje zdanie", tr: "sebebi bildirir; ardından bir cümle gelir", id: "memberi alasan; diikuti klausa", vi: "nêu lý do; theo sau là một mệnh đề" }, ex: ["I'm tired ", { target: because }, " I work late."], tr: { uk: "Я втомився, бо пізно працюю.", es: "Estoy cansado porque trabajo hasta tarde.", pt: "Estou cansado porque trabalho até tarde.", fr: "Je suis fatigué parce que je travaille tard.", de: "Ich bin müde, weil ich lange arbeite.", it: "Sono stanco perché lavoro fino a tardi.", pl: "Jestem zmęczony, bo pracuję do późna.", tr: "Geç saate kadar çalıştığım için yorgunum.", id: "Saya lelah karena saya bekerja sampai larut.", vi: "Tôi mệt vì tôi làm việc muộn." } }
        - { level: A2, point: "when, before, after", rule: { en: a time clause; the present simple talks about the future, uk: "підрядне речення часу; Present Simple говорить про майбутнє", es: "una oración de tiempo; el presente simple habla del futuro", pt: "uma oração de tempo; o presente simples fala do futuro", fr: "une proposition de temps ; le présent simple parle du futur", de: "ein Zeitsatz; das Simple Present spricht über die Zukunft", it: "una proposizione temporale; il present simple parla del futuro", pl: "zdanie podrzędne czasu; Present Simple mówi o przyszłości", tr: "bir zaman cümlesi; Simple Present geleceği anlatır", id: "klausa waktu; simple present membicarakan masa depan", vi: "mệnh đề chỉ thời gian; hiện tại đơn nói về tương lai" }, ex: [{ target: When }, " I arrive, I'll call you."], tr: { uk: "Коли я приїду, я тобі зателефоную.", es: "Cuando llegue, te llamaré.", pt: "Quando eu chegar, eu te ligo.", fr: "Quand j’arriverai, je t’appellerai.", de: "Wenn ich ankomme, rufe ich dich an.", it: "Quando arrivo, ti chiamo.", pl: "Kiedy przyjadę, zadzwonię do ciebie.", tr: "Geldiğimde seni ararım.", id: "Ketika saya tiba, saya akan meneleponmu.", vi: "Khi tôi đến, tôi sẽ gọi cho bạn." } }
        - { level: A2, point: "also, too", rule: { en: [{ term: also }, " goes before the main verb and after ", { term: be }, "; ", { term: too }, " goes at the end"], uk: [{ term: also }, " стоїть перед основним дієсловом і після ", { term: be }, "; ", { term: too }, " — у кінці"], es: [{ term: also }, " va antes del verbo principal y después de ", { term: be }, "; ", { term: too }, " va al final"], pt: [{ term: "also" }, " vai antes do verbo principal e depois de ", { term: "be" }, "; ", { term: "too" }, " vai no fim"], fr: [{ term: "also" }, " se place avant le verbe principal et après ", { term: "be" }, " ; ", { term: "too" }, " se place à la fin"], de: [{ term: "also" }, " steht vor dem Hauptverb und nach ", { term: "be" }, "; ", { term: "too" }, " steht am Ende"], it: [{ term: "also" }, " va prima del verbo principale e dopo ", { term: "be" }, "; ", { term: "too" }, " va alla fine"], pl: [{ term: "also" }, " stoi przed czasownikiem głównym i po ", { term: "be" }, "; ", { term: "too" }, " stoi na końcu"], tr: [{ term: "also" }, " ana fiilden önce ve ", { term: "be" }, " fiilinden sonra gelir; ", { term: "too" }, " sonda gelir"], id: [{ term: "also" }, " diletakkan sebelum kata kerja utama dan setelah ", { term: "be" }, "; ", { term: "too" }, " diletakkan di akhir"], vi: [{ term: "also" }, " đứng trước động từ chính và sau ", { term: "be" }, "; ", { term: "too" }, " đứng cuối câu"] }, ex: { examples: [["I ", { target: also }, " speak French."], ["I speak French ", { target: too }, "."]] }, tr: { uk: { examples: ["Я також розмовляю французькою.", "Я розмовляю французькою теж."] }, es: { examples: ["También hablo francés.", "Hablo francés también."] }, pt: { examples: ["Eu também falo francês.", "Eu falo francês também."] }, fr: { examples: ["Je parle aussi français.", "Je parle français aussi."] }, de: { examples: ["Ich spreche auch Französisch.", "Französisch spreche ich auch."] }, it: { examples: ["Parlo anche francese.", "Parlo francese pure."] }, pl: { examples: ["Mówię również po francusku.", "Mówię po francusku także."] }, tr: { examples: ["Ayrıca Fransızca konuşurum.", "Ben de Fransızca konuşurum."] }, id: { examples: ["Saya juga berbicara bahasa Prancis.", "Saya berbicara bahasa Prancis juga."] }, vi: { examples: ["Tôi cũng nói tiếng Pháp.", "Tôi nói tiếng Pháp nữa."] } } }
        - { level: B1, point: however, rule: { en: starts a new sentence; a comma follows, uk: "починає нове речення; далі йде кома", es: "abre una oración nueva; sigue una coma", pt: "abre uma frase nova; segue uma vírgula", fr: "ouvre une nouvelle phrase ; une virgule suit", de: "beginnt einen neuen Satz; es folgt ein Komma", it: "apre una frase nuova; segue una virgola", pl: "zaczyna nowe zdanie; dalej następuje przecinek", tr: "yeni bir cümleyi başlatır; ardından virgül gelir", id: "membuka kalimat baru; diikuti koma", vi: "mở đầu một câu mới; theo sau là dấu phẩy" }, ex: ["It was raining. ", { target: However }, ", we went out."], tr: { uk: "Йшов дощ. Проте ми вийшли.", es: "Llovía. Sin embargo, salimos.", pt: "Estava chovendo. No entanto, nós saímos.", fr: "Il pleuvait. Pourtant, nous sommes sortis.", de: "Es regnete. Trotzdem sind wir ausgegangen.", it: "Pioveva. Tuttavia, siamo usciti.", pl: "Padało. Mimo to wyszliśmy.", tr: "Yağmur yağıyordu. Ancak dışarı çıktık.", id: "Hari hujan. Namun, kami tetap keluar.", vi: "Trời đang mưa. Tuy nhiên, chúng tôi vẫn ra ngoài." } }
        - { level: B1, point: so that, rule: { en: gives a purpose; a clause follows, uk: "називає мету; далі йде речення", es: "da la finalidad; sigue una oración", pt: "dá a finalidade; segue uma oração", fr: "donne le but ; une proposition suit", de: "nennt den Zweck; es folgt ein Teilsatz", it: "indica lo scopo; segue una proposizione", pl: "podaje cel; dalej następuje zdanie", tr: "amacı bildirir; ardından bir cümle gelir", id: "menyatakan tujuan; diikuti klausa", vi: "nêu mục đích; theo sau là một mệnh đề" }, ex: ["I left early ", { target: so that }, " I could catch the bus."], tr: { uk: "Я вийшов раніше, щоб устигнути на автобус.", es: "Salí temprano para alcanzar el autobús.", pt: "Eu saí cedo para pegar o ônibus.", fr: "Je suis parti tôt pour attraper le bus.", de: "Ich bin früh gegangen, damit ich den Bus erreichen konnte.", it: "Sono uscito presto per prendere l'autobus.", pl: "Wyszedłem wcześniej, żeby zdążyć na autobus.", tr: "Otobüse yetişmek için erken çıktım.", id: "Saya berangkat lebih awal agar bisa mengejar bus.", vi: "Tôi đi sớm để có thể bắt kịp xe buýt." } }
        - { level: B1, point: unless, rule: { en: [{ term: unless }, " means ", { term: ["if ", { gap: true }, " not"] }], uk: [{ term: unless }, " означає ", { term: ["if ", { gap: true }, " not"] }], es: [{ term: unless }, " significa ", { term: ["if ", { gap: true }, " not"] }], pt: [{ term: "unless" }, " significa ", { term: ["if ", { gap: true }, " not"] }], fr: [{ term: "unless" }, " signifie ", { term: ["if ", { gap: true }, " not"] }], de: [{ term: "unless" }, " bedeutet ", { term: ["if ", { gap: true }, " not"] }], it: [{ term: "unless" }, " significa ", { term: ["if ", { gap: true }, " not"] }], pl: [{ term: "unless" }, " znaczy ", { term: ["if ", { gap: true }, " not"] }], tr: [{ term: "unless" }, ", ", { term: ["if ", { gap: true }, " not"] }, " anlamına gelir"], id: [{ term: "unless" }, " berarti ", { term: ["if ", { gap: true }, " not"] }], vi: [{ term: "unless" }, " nghĩa là ", { term: ["if ", { gap: true }, " not"] }] }, ex: ["We stay in ", { target: unless }, " it stops raining."], tr: { uk: "Ми залишаємося вдома, якщо дощ не припиниться.", es: "Nos quedamos en casa a menos que deje de llover.", pt: "Nós ficamos em casa, a menos que a chuva pare.", fr: "Nous restons à la maison à moins qu’il ne cesse de pleuvoir.", de: "Wir bleiben zu Hause, es sei denn, es hört auf zu regnen.", it: "Restiamo a casa a meno che non smetta di piovere.", pl: "Zostajemy w domu, chyba że przestanie padać.", tr: "Yağmur dinmezse evde kalırız.", id: "Kami tinggal di rumah kecuali hujan berhenti.", vi: "Chúng tôi ở nhà trừ khi trời tạnh mưa." } }
        - { level: B2, point: { en: ["despite, ", { term: in spite of }], uk: ["despite, ", { term: "in spite of" }], es: ["despite, ", { term: "in spite of" }], pt: ["despite, ", { term: "in spite of" }], fr: ["despite, ", { term: "in spite of" }], de: ["despite, ", { term: "in spite of" }], it: ["despite, ", { term: "in spite of" }], pl: ["despite, ", { term: "in spite of" }], tr: ["despite, ", { term: "in spite of" }], id: ["despite, ", { term: "in spite of" }], vi: ["despite, ", { term: "in spite of" }] }, rule: { en: ["a noun or an -ing form follows; ", { term: despite the fact that }, " takes a clause"], uk: ["після нього йде іменник або форма на -ing; ", { term: "despite the fact that" }, " вимагає речення"], es: ["va seguido de un sustantivo o de una forma en -ing; ", { term: "despite the fact that" }, " lleva una oración"], pt: ["é seguido de um substantivo ou de uma forma em -ing; ", { term: "despite the fact that" }, " leva uma oração"], fr: ["est suivi d’un nom ou d’une forme en -ing ; ", { term: "despite the fact that" }, " prend une proposition"], de: ["danach folgt ein Nomen oder eine -ing-Form; ", { term: "despite the fact that" }, " verlangt einen Teilsatz"], it: ["è seguito da un sostantivo o da una forma in -ing; ", { term: "despite the fact that" }, " regge una proposizione"], pl: ["po nim następuje rzeczownik lub forma z -ing; ", { term: "despite the fact that" }, " wymaga zdania"], tr: ["ardından bir isim veya -ing biçimi gelir; ", { term: "despite the fact that" }, " bir cümle alır"], id: ["diikuti kata benda atau bentuk -ing; ", { term: "despite the fact that" }, " diikuti klausa"], vi: ["theo sau là một danh từ hoặc một dạng -ing; ", { term: "despite the fact that" }, " đi với một mệnh đề"] }, ex: [{ target: Despite }, " the rain, we went out."], tr: { uk: "Незважаючи на дощ, ми вийшли.", es: "A pesar de la lluvia, salimos.", pt: "Apesar da chuva, nós saímos.", fr: "Malgré la pluie, nous sommes sortis.", de: "Trotz des Regens sind wir ausgegangen.", it: "Nonostante la pioggia, siamo usciti.", pl: "Mimo deszczu wyszliśmy.", tr: "Yağmura rağmen dışarı çıktık.", id: "Meskipun hujan, kami tetap keluar.", vi: "Bất chấp trời mưa, chúng tôi vẫn ra ngoài." } }
        - { level: B2, point: { en: Linking adverbs, uk: "Сполучні прислівники", es: "Adverbios conectores", pt: "Advérbios conectivos", fr: "Adverbes de liaison", de: "Konjunktionaladverbien", it: "Avverbi connettivi", pl: "Przysłówki łączące", tr: "Bağlayıcı zarflar", id: "Kata keterangan penghubung", vi: "Trạng từ nối" }, rule: { en: "full stop or semicolon before, comma after", uk: "крапка або крапка з комою перед, кома після", es: "punto o punto y coma antes, coma después", pt: "ponto final ou ponto e vírgula antes, vírgula depois", fr: "un point ou un point-virgule avant, une virgule après", de: "davor ein Punkt oder Semikolon, danach ein Komma", it: "punto o punto e virgola prima, virgola dopo", pl: "przed nim kropka lub średnik, po nim przecinek", tr: "öncesinde nokta ya da noktalı virgül, sonrasında virgül", id: "titik atau titik koma di depan, koma di belakang", vi: "trước là dấu chấm hoặc dấu chấm phẩy, sau là dấu phẩy" }, ex: ["It was late", { target: "; however," }, " we stayed."], tr: { uk: "Було пізно; проте ми залишилися.", es: "Era tarde; sin embargo, nos quedamos.", pt: "Estava tarde; no entanto, nós ficamos.", fr: "Il était tard ; pourtant, nous sommes restés.", de: "Es war spät; trotzdem sind wir geblieben.", it: "Era tardi; tuttavia, siamo rimasti.", pl: "Było późno; mimo to zostaliśmy.", tr: "Geç olmuştu; ancak kaldık.", id: "Hari sudah larut; namun, kami tetap tinggal.", vi: "Đã muộn; tuy nhiên, chúng tôi vẫn ở lại." } }
        - { level: C1, point: { en: Fronted concession, uk: "Допустовість із виносом на початок", es: "Concesión con elemento adelantado", pt: "Concessão com elemento antecipado", fr: "Concession avec mise en tête", de: "Konzession mit vorangestelltem Wort", it: "Concessione con elemento anticipato", pl: "Przyzwolenie z członem na początku zdania", tr: "Başa alınan ögeyle ödün", id: "Konsesi dengan unsur di awal kalimat", vi: "Nhượng bộ với thành phần đảo lên đầu câu" }, rule: { en: [{ term: though }, " or ", { term: as }, " follows the adjective that starts the sentence"], uk: [{ term: "though" }, " або ", { term: "as" }, " стоїть після прикметника, яким починається речення"], es: [{ term: "though" }, " o ", { term: "as" }, " va después del adjetivo que abre la oración"], pt: [{ term: "though" }, " ou ", { term: "as" }, " vem depois do adjetivo que abre a frase"], fr: [{ term: "though" }, " ou ", { term: "as" }, " suit l’adjectif qui ouvre la phrase"], de: [{ term: "though" }, " oder ", { term: "as" }, " steht nach dem Adjektiv, das den Satz eröffnet"], it: [{ term: "though" }, " o ", { term: "as" }, " segue l'aggettivo che apre la frase"], pl: [{ term: "though" }, " lub ", { term: "as" }, " stoi po przymiotniku, który otwiera zdanie"], tr: [{ term: "though" }, " veya ", { term: "as" }, " cümleyi başlatan sıfattan sonra gelir"], id: [{ term: "though" }, " atau ", { term: "as" }, " diletakkan setelah kata sifat yang membuka kalimat"], vi: [{ term: "though" }, " hoặc ", { term: "as" }, " đứng sau tính từ mở đầu câu"] }, ex: [{ target: Young though he was }, ", he led the team."], tr: { uk: "Хоч він і був молодий, він очолював команду.", es: "Aunque era joven, dirigió al equipo.", pt: "Embora fosse jovem, ele liderou a equipe.", fr: "Tout jeune qu’il était, il dirigeait l’équipe.", de: "So jung er auch war, er führte das Team.", it: "Per quanto fosse giovane, guidava la squadra.", pl: "Choć był młody, prowadził drużynę.", tr: "Genç olmasına rağmen takımı o yönetti.", id: "Meskipun masih muda, dia memimpin tim itu.", vi: "Dù còn trẻ, anh ấy vẫn dẫn dắt đội." } }
        - { level: C2, point: { en: Learned linkers, uk: "Книжні слова-зв’язки", es: "Conectores cultos", pt: "Conectivos eruditos", fr: "Connecteurs savants", de: "Gehobene Bindewörter", it: "Connettivi colti", pl: "Książkowe słowa łączące", tr: "Yüksek üslup bağlayıcıları", id: "Kata penghubung tingkat tinggi", vi: "Từ nối văn chương" }, rule: { en: [{ term: notwithstanding }, ", ", { term: albeit }, " and ", { term: lest }, " belong to formal writing"], uk: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " і ", { term: "lest" }, " належать до формального письма"], es: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " y ", { term: "lest" }, " pertenecen a la escritura formal"], pt: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " e ", { term: "lest" }, " pertencem à escrita formal"], fr: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " et ", { term: "lest" }, " appartiennent à l’écrit soutenu"], de: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " und ", { term: "lest" }, " gehören zur formellen Schriftsprache"], it: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " e ", { term: "lest" }, " appartengono alla scrittura formale"], pl: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " i ", { term: "lest" }, " należą do pisma formalnego"], tr: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " ve ", { term: "lest" }, " resmî yazıya aittir"], id: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " dan ", { term: "lest" }, " termasuk tulisan formal"], vi: [{ term: "notwithstanding" }, ", ", { term: "albeit" }, " và ", { term: "lest" }, " thuộc về văn viết trang trọng"] }, ex: ["He agreed, ", { target: albeit reluctantly }, "."], tr: { uk: "Він погодився, хоч і неохоче.", es: "Aceptó, aunque de mala gana.", pt: "Ele concordou, ainda que a contragosto.", fr: "Il a accepté, quoique à contrecœur.", de: "Er stimmte zu, wenn auch widerwillig.", it: "Ha accettato, seppure con riluttanza.", pl: "Zgodził się, choć niechętnie.", tr: "İstemeyerek de olsa kabul etti.", id: "Dia setuju, walaupun dengan enggan.", vi: "Anh ấy đồng ý, tuy không sẵn lòng." } }
        - { level: A2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: because of }, " is followed by a noun"], uk: [{ term: because of }, " вимагає після себе іменника"], es: [{ term: because of }, " va seguido de un sustantivo"], pt: [{ term: "because of" }, " é seguido de um substantivo"], fr: [{ term: "because of" }, " est suivi d’un nom"], de: ["Auf ", { term: "because of" }, " folgt ein Nomen"], it: [{ term: "because of" }, " è seguito da un sostantivo"], pl: [{ term: "because of" }, " wymaga po sobie rzeczownika"], tr: [{ term: "because of" }, " sonrasında isim gelir"], id: [{ term: "because of" }, " diikuti kata benda"], vi: [{ term: "because of" }, " theo sau là một danh từ"] }, ex: ["We stayed in ", { target: because of }, " the rain."], tr: { uk: "Ми залишилися вдома через дощ.", es: "Nos quedamos en casa por la lluvia.", pt: "Nós ficamos em casa por causa da chuva.", fr: "Nous sommes restés à la maison à cause de la pluie.", de: "Wir sind wegen des Regens zu Hause geblieben.", it: "Siamo rimasti a casa a causa della pioggia.", pl: "Zostaliśmy w domu z powodu deszczu.", tr: "Yağmur yüzünden evde kaldık.", id: "Kami tinggal di rumah karena hujan.", vi: "Chúng tôi ở nhà vì trời mưa." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: although }, " joins two clauses and replaces ", { term: but }], uk: [{ term: although }, " поєднує дві частини речення й замінює ", { term: but }], es: [{ term: although }, " une dos oraciones y sustituye a ", { term: but }], pt: [{ term: "although" }, " une duas orações e substitui ", { term: "but" }], fr: [{ term: "although" }, " relie deux propositions et remplace ", { term: "but" }], de: [{ term: "although" }, " verbindet zwei Teilsätze und ersetzt ", { term: "but" }], it: [{ term: "although" }, " unisce due proposizioni e sostituisce ", { term: "but" }], pl: [{ term: "although" }, " łączy dwie części zdania i zastępuje ", { term: "but" }], tr: [{ term: "although" }, " iki cümleyi birleştirir ve ", { term: "but" }, " yerine geçer"], id: [{ term: "although" }, " menghubungkan dua klausa dan menggantikan ", { term: "but" }], vi: [{ term: "although" }, " nối hai mệnh đề và thay cho ", { term: "but" }] }, ex: [{ target: Although }, " it was raining, we went out."], tr: { uk: "Хоча йшов дощ, ми вийшли.", es: "Aunque llovía, salimos.", pt: "Embora estivesse chovendo, nós saímos.", fr: "Bien qu’il pleuve, nous sommes sortis.", de: "Obwohl es regnete, sind wir ausgegangen.", it: "Anche se pioveva, siamo usciti.", pl: "Chociaż padał deszcz, wyszliśmy.", tr: "Yağmur yağsa da dışarı çıktık.", id: "Meskipun hujan turun, kami keluar.", vi: "Mặc dù trời đang mưa, chúng tôi vẫn ra ngoài." } }

sections:
  - title: { en: "Basic linkers: and, but, or, because, so", uk: "Основні слова-зв’язки: and, but, or, because, so", es: "Conectores básicos: and, but, or, because, so", pt: "Conectivos básicos: and, but, or, because, so", fr: "Connecteurs de base : and, but, or, because, so", de: "Grundlegende Bindewörter: and, but, or, because, so", it: "Connettivi di base: and, but, or, because, so", pl: "Podstawowe słowa łączące: and, but, or, because, so", tr: "Temel bağlayıcılar: and, but, or, because, so", id: "Kata penghubung dasar: and, but, or, because, so", vi: "Từ nối cơ bản: and, but, or, because, so" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, linker: and, use: { en: adds an idea, uk: "додає думку", es: "suma una idea", pt: "soma uma ideia", fr: "ajoute une idée", de: "fügt einen Gedanken hinzu", it: "aggiunge un'idea", pl: "dodaje myśl", tr: "bir düşünce ekler", id: "menambahkan gagasan", vi: "thêm một ý" }, ex: ["I like tea ", { target: and }, " coffee."], tr: { uk: "Я люблю чай і каву.", es: "Me gustan el té y el café.", pt: "Eu gosto de chá e de café.", fr: "J’aime le thé et le café.", de: "Ich mag Tee und Kaffee.", it: "Mi piacciono il tè e il caffè.", pl: "Lubię herbatę i kawę.", tr: "Çayı ve kahveyi severim.", id: "Saya suka teh dan kopi.", vi: "Tôi thích trà và cà phê." } }
          - { level: A1, linker: but, use: { en: shows a contrast, uk: "показує протиставлення", es: "muestra un contraste", pt: "mostra um contraste", fr: "marque l’opposition", de: "zeigt einen Gegensatz", it: "indica un contrasto", pl: "pokazuje przeciwstawienie", tr: "karşıtlık gösterir", id: "menyatakan pertentangan", vi: "chỉ sự đối lập" }, ex: ["I like tea, ", { target: but }, " I don't like coffee."], tr: { uk: "Я люблю чай, але не люблю каву.", es: "Me gusta el té, pero no me gusta el café.", pt: "Eu gosto de chá, mas não gosto de café.", fr: "J’aime le thé, mais je n’aime pas le café.", de: "Ich mag Tee, aber ich mag keinen Kaffee.", it: "Mi piace il tè, ma non mi piace il caffè.", pl: "Lubię herbatę, ale nie lubię kawy.", tr: "Çayı severim ama kahveyi sevmem.", id: "Saya suka teh, tetapi saya tidak suka kopi.", vi: "Tôi thích trà, nhưng tôi không thích cà phê." } }
          - { level: A1, linker: or, use: { en: gives a choice, uk: "дає вибір", es: "ofrece una opción", pt: "oferece uma opção", fr: "propose un choix", de: "bietet eine Wahl", it: "offre una scelta", pl: "daje wybór", tr: "seçenek sunar", id: "memberi pilihan", vi: "đưa ra lựa chọn" }, ex: ["Do you want tea ", { target: or }, " coffee?"], tr: { uk: "Ти хочеш чаю чи кави?", es: "¿Quieres té o café?", pt: "Você quer chá ou café?", fr: "Veux-tu du thé ou du café ?", de: "Möchtest du Tee oder Kaffee?", it: "Vuoi il tè o il caffè?", pl: "Chcesz herbatę czy kawę?", tr: "Çay mı kahve mi istersin?", id: "Kamu mau teh atau kopi?", vi: "Bạn muốn trà hay cà phê?" } }
          - { level: A1, linker: because, use: { en: gives the reason, uk: "називає причину", es: "da la razón", pt: "dá a razão", fr: "donne la raison", de: "nennt den Grund", it: "indica la causa", pl: "podaje przyczynę", tr: "sebebi bildirir", id: "memberi alasan", vi: "nêu lý do" }, ex: ["I'm tired ", { target: because }, " I work late."], tr: { uk: "Я втомився, бо пізно працюю.", es: "Estoy cansado porque trabajo hasta tarde.", pt: "Estou cansado porque trabalho até tarde.", fr: "Je suis fatigué parce que je travaille tard.", de: "Ich bin müde, weil ich lange arbeite.", it: "Sono stanco perché lavoro fino a tardi.", pl: "Jestem zmęczony, bo pracuję do późna.", tr: "Geç saate kadar çalıştığım için yorgunum.", id: "Saya lelah karena saya bekerja sampai larut.", vi: "Tôi mệt vì tôi làm việc muộn." } }
          - { level: A1, linker: so, use: { en: gives the result, uk: "називає наслідок", es: "da el resultado", pt: "dá o resultado", fr: "donne le résultat", de: "nennt die Folge", it: "indica la conseguenza", pl: "podaje skutek", tr: "sonucu bildirir", id: "menyatakan akibat", vi: "nêu kết quả" }, ex: ["I'm tired, ", { target: so }, " I go to bed."], tr: { uk: "Я втомився, тому йду спати.", es: "Estoy cansado, así que me voy a la cama.", pt: "Estou cansado, por isso vou para a cama.", fr: "Je suis fatigué, donc je vais me coucher.", de: "Ich bin müde, also gehe ich ins Bett.", it: "Sono stanco, quindi vado a letto.", pl: "Jestem zmęczony, więc idę spać.", tr: "Yorgunum, bu yüzden yatmaya gidiyorum.", id: "Saya lelah, jadi saya pergi tidur.", vi: "Tôi mệt, nên tôi đi ngủ." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Between two full clauses, ", { term: but }, " and ", { term: so }, " usually take a comma before them:"]
              uk: ["Між двома повними реченнями перед ", { term: but }, " і ", { term: so }, " зазвичай ставлять кому:"]
              es: ["Entre dos oraciones completas, ", { term: but }, " y ", { term: so }, " suelen llevar coma delante:"]
              pt: ["Entre duas orações completas, ", { term: "but" }, " e ", { term: "so" }, " costumam levar vírgula antes:"]
              fr: ["Entre deux propositions complètes, ", { term: "but" }, " et ", { term: "so" }, " sont en général précédés d’une virgule :"]
              de: ["Zwischen zwei vollständigen Teilsätzen steht vor ", { term: "but" }, " und ", { term: "so" }, " meist ein Komma:"]
              it: ["Tra due proposizioni complete, ", { term: "but" }, " e ", { term: "so" }, " di solito prendono la virgola prima:"]
              pl: ["Między dwoma pełnymi zdaniami przed ", { term: "but" }, " i ", { term: "so" }, " zwykle stawia się przecinek:"]
