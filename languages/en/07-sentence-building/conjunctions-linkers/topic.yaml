          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, pattern: { pattern: [{ alternatives: [{ slot: adjective }, { slot: adverb }] }, { alternatives: [though, as] }, { slot: subject }, { slot: verb }] }, use: { en: "although, with the adjective or adverb first for emphasis", uk: "although; прикметник або прислівник стоїть першим для підсилення", es: "although; con el adjetivo o el adverbio al principio para dar énfasis", pt: "although; com o adjetivo ou o advérbio na frente para dar ênfase", fr: "although ; avec l’adjectif ou l’adverbe en tête pour insister", de: "although; mit dem Adjektiv oder Adverb an erster Stelle zur Betonung", it: "although; con l'aggettivo o l'avverbio all'inizio per enfasi", pl: "although; przymiotnik lub przysłówek na początku dla podkreślenia", tr: "although anlamında; vurgu için sıfat ya da zarf başa alınır", id: "although; dengan kata sifat atau kata keterangan di depan untuk penekanan", vi: "although; với tính từ hoặc trạng từ đứng đầu để nhấn mạnh" }, ex: { examples: [[{ target: Young though he was }, ", he led the team."], [{ target: Hard as it is }, " to believe, it is true."]] }, tr: { uk: { examples: ["Хоч він і був молодий, він очолював команду.", "Як би важко не було повірити, це правда."] }, es: { examples: ["Aunque era joven, dirigió al equipo.", "Por difícil que sea de creer, es verdad."] }, pt: { examples: ["Embora fosse jovem, ele liderou a equipe.", "Por mais difícil que seja de acreditar, é verdade."] }, fr: { examples: ["Tout jeune qu’il était, il dirigeait l’équipe.", "Aussi difficile que cela soit à croire, c’est vrai."] }, de: { examples: ["So jung er auch war, er führte das Team.", "So schwer es zu glauben ist, es ist wahr."] }, it: { examples: ["Per quanto fosse giovane, guidava la squadra.", "Per quanto sia difficile da credere, è vero."] }, pl: { examples: ["Choć był młody, prowadził drużynę.", "Choć trudno w to uwierzyć, to prawda."] }, tr: { examples: ["Genç olmasına rağmen takımı o yönetti.", "İnanması ne kadar zor olsa da bu doğru."] }, id: { examples: ["Meskipun masih muda, dia memimpin tim itu.", "Meskipun sulit dipercaya, ini benar."] }, vi: { examples: ["Dù còn trẻ, anh ấy vẫn dẫn dắt đội.", "Dù khó tin đến đâu, đó vẫn là sự thật."] } } }
          - { level: C1, pattern: { pattern: [{ slot: base verb }, as, { slot: subject }, might] }, use: { en: "however hard the effort", uk: "як би сильно не старатися", es: "por más que se intente", pt: "por mais que se tente", fr: "si fort que soit l’effort", de: "wie sehr man sich auch bemüht", it: "per quanto ci si sforzi", pl: "choćby się bardzo starać", tr: "ne kadar çaba gösterilirse gösterilsin", id: "sekeras apa pun usahanya", vi: "dù cố gắng đến đâu" }, ex: [{ target: Try as he might }, ", he could not open it."], tr: { uk: "Як би він не старався, він не зміг це відкрити.", es: "Por más que lo intentó, no pudo abrirlo.", pt: "Por mais que tentasse, ele não conseguiu abri-lo.", fr: "Il a eu beau essayer, il n’a pas pu l’ouvrir.", de: "So sehr er es auch versuchte, er konnte es nicht öffnen.", it: "Per quanto ci provasse, non è riuscito ad aprirlo.", pl: "Choćby się bardzo starał, nie zdołał tego otworzyć.", tr: "Ne kadar denese de onu açamadı.", id: "Sekeras apa pun dia mencoba, dia tidak bisa membukanya.", vi: "Dù cố gắng đến mấy, anh ấy cũng không thể mở nó ra." } }
          - { level: C1, pattern: { pattern: [much as, { slot: clause }] }, use: { en: "although, with a strong feeling or wish", uk: "although; із сильним почуттям або бажанням", es: "although; con un sentimiento o un deseo fuerte", pt: "although; com um sentimento ou desejo forte", fr: "although ; avec un sentiment ou un désir fort", de: "although; mit starkem Gefühl oder Wunsch", it: "although; con un sentimento o un desiderio forte", pl: "although; z silnym uczuciem lub życzeniem", tr: "although anlamında; güçlü bir duygu ya da istekle", id: "although; dengan perasaan atau keinginan yang kuat", vi: "although; kèm cảm xúc hoặc mong muốn mạnh" }, ex: [{ target: Much as I admire her }, ", I disagree."], tr: { uk: "Як би я нею не захоплювався, я з нею не згоден.", es: "Por mucho que la admire, no estoy de acuerdo.", pt: "Por mais que eu a admire, discordo.", fr: "Même si je l’admire beaucoup, je ne suis pas d’accord.", de: "So sehr ich sie auch bewundere, ich bin anderer Meinung.", it: "Per quanto la ammiri, non sono d'accordo.", pl: "Choć bardzo ją podziwiam, nie zgadzam się z nią.", tr: "Onu çok takdir etsem de aynı fikirde değilim.", id: "Meskipun saya sangat mengaguminya, saya tidak setuju.", vi: "Dù tôi rất ngưỡng mộ cô ấy, tôi vẫn không đồng ý." } }
          - { level: C1, pattern: { pattern: [however, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { slot: subject }, { slot: verb }] }, use: { en: "no matter how much", uk: "як би сильно не", es: "por mucho que", pt: "por mais que", fr: "peu importe à quel point", de: "egal wie sehr", it: "non importa quanto", pl: "bez względu na to, jak bardzo", tr: "ne kadar olursa olsun", id: "sekeras apa pun", vi: "dù có đến mức nào" }, ex: [{ target: However hard she tried }, ", she could not win."], tr: { uk: "Як би вона не старалася, їй не вдалося виграти.", es: "Por más que se esforzó, no pudo ganar.", pt: "Por mais que ela se esforçasse, não conseguiu ganhar.", fr: "Peu importe ses efforts, elle n’a pas pu gagner.", de: "Wie sehr sie sich auch anstrengte, sie konnte nicht gewinnen.", it: "Per quanto si sforzasse, non è riuscita a vincere.", pl: "Jakkolwiek bardzo się starała, nie mogła wygrać.", tr: "Ne kadar çabalarsa çabalasın kazanamadı.", id: "Sekeras apa pun usahanya, dia tidak bisa menang.", vi: "Dù cô ấy đã cố gắng đến đâu, cô ấy cũng không thể thắng." } }
          - { level: C1, pattern: { alternatives: [{ pattern: [whatever, { slot: clause }] }, { pattern: [no matter, { slot: wh-word }, { slot: clause }] }] }, use: { en: "every possibility makes no difference", uk: "жодна можливість нічого не змінює", es: "ninguna posibilidad cambia nada", pt: "nenhuma possibilidade muda nada", fr: "aucune possibilité n’y change rien", de: "keine Möglichkeit ändert etwas", it: "nessuna possibilità cambia nulla", pl: "żadna możliwość niczego nie zmienia", tr: "hangi ihtimal olursa olsun fark etmez", id: "semua kemungkinan tidak mengubah apa pun", vi: "mọi khả năng đều không thay đổi gì" }, ex: { examples: [[{ target: Whatever you say }, ", I'll go."], [{ target: No matter who calls }, ", don't answer."]] }, tr: { uk: { examples: ["Що б ти не казав, я піду.", "Хто б не дзвонив, не відповідай."] }, es: { examples: ["Digas lo que digas, iré.", "No importa quién llame, no contestes."] }, pt: { examples: ["Diga o que disser, eu vou.", "Não importa quem ligue, não atenda."] }, fr: { examples: ["Quoi que tu dises, j’irai.", "Peu importe qui appelle, ne réponds pas."] }, de: { examples: ["Was auch immer du sagst, ich gehe.", "Egal wer anruft, geh nicht ran."] }, it: { examples: ["Qualunque cosa tu dica, andrò.", "Non importa chi chiami, non rispondere."] }, pl: { examples: ["Cokolwiek powiesz, pójdę.", "Bez względu na to, kto dzwoni, nie odbieraj."] }, tr: { examples: ["Ne dersen de gideceğim.", "Kim ararsa arasın, açma."] }, id: { examples: ["Apa pun yang kamu katakan, saya akan pergi.", "Siapa pun yang menelepon, jangan dijawab."] }, vi: { examples: ["Dù bạn nói gì, tôi vẫn sẽ đi.", "Bất kể ai gọi, đừng nghe máy."] } } }
          - { level: C1, pattern: { pattern: [for all, { slot: noun }] }, use: { en: "despite", uk: "попри", es: "a pesar de", pt: "apesar de", fr: "malgré", de: "trotz", it: "nonostante", pl: "mimo", tr: "rağmen", id: "terlepas dari", vi: "bất chấp" }, ex: [{ target: For all his wealth }, ", he is unhappy."], tr: { uk: "Попри все своє багатство, він нещасний.", es: "A pesar de toda su riqueza, es infeliz.", pt: "Apesar de toda a sua riqueza, ele é infeliz.", fr: "Malgré toute sa richesse, il est malheureux.", de: "Bei all seinem Reichtum ist er unglücklich.", it: "Nonostante tutta la sua ricchezza, è infelice.", pl: "Mimo całego swojego bogactwa jest nieszczęśliwy.", tr: "Bütün zenginliğine rağmen mutsuz.", id: "Terlepas dari semua kekayaannya, dia tidak bahagia.", vi: "Bất chấp mọi của cải, ông ấy vẫn không hạnh phúc." } }

  - title: { en: Formal written linkers, uk: "Формальні письмові слова-зв’язки", es: "Conectores formales de la lengua escrita", pt: "Conectivos formais da escrita", fr: "Connecteurs soutenus de l’écrit", de: "Formelle Bindewörter der Schriftsprache", it: "Connettivi formali dello scritto", pl: "Formalne słowa łączące w piśmie", tr: "Yazıda kullanılan resmî bağlayıcılar", id: "Kata penghubung formal untuk tulisan", vi: "Từ nối trang trọng trong văn viết" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, linker: { term: hence }, use: { en: "for this reason; often before a noun", uk: "з цієї причини; часто перед іменником", es: "por esta razón; suele ir antes de un sustantivo", pt: "por essa razão; costuma vir antes de um substantivo", fr: "pour cette raison ; souvent devant un nom", de: "aus diesem Grund; oft vor einem Nomen", it: "per questa ragione; spesso prima di un sostantivo", pl: "z tego powodu; często przed rzeczownikiem", tr: "bu nedenle; çoğunlukla bir isimden önce", id: "karena alasan ini; sering di depan kata benda", vi: "vì lý do này; thường đứng trước danh từ" }, ex: ["The road is closed; ", { target: hence }, " the delay."], tr: { uk: "Дорогу закрито; звідси затримка.", es: "La carretera está cerrada; de ahí el retraso.", pt: "A estrada está fechada; daí o atraso.", fr: "La route est fermée ; d’où le retard.", de: "Die Straße ist gesperrt; daher die Verspätung.", it: "La strada è chiusa; da qui il ritardo.", pl: "Droga jest zamknięta; stąd opóźnienie.", tr: "Yol kapalı; gecikmenin nedeni bu.", id: "Jalan itu ditutup; karena itulah terjadi keterlambatan.", vi: "Con đường bị đóng; do đó mới có sự chậm trễ." } }
          - { level: C1, linker: { pattern: [thus, { slot: V-ing }] }, use: { en: "and so, in this way", uk: "і так, у такий спосіб", es: "y así, de este modo", pt: "e assim, desse modo", fr: "et ainsi, de cette façon", de: "und so, auf diese Weise", it: "e così, in questo modo", pl: "i tak, w ten sposób", tr: "ve böylece, bu yolla", id: "dan dengan begitu, dengan cara ini", vi: "và như vậy, theo cách này" }, ex: ["The firm cut costs, ", { target: thus saving }, " jobs."], tr: { uk: "Фірма скоротила витрати, зберігши таким чином робочі місця.", es: "La empresa redujo costos, salvando así empleos.", pt: "A empresa cortou custos, preservando assim empregos.", fr: "L’entreprise a réduit ses coûts, sauvant ainsi des emplois.", de: "Die Firma senkte die Kosten und sicherte so Arbeitsplätze.", it: "L'azienda ha ridotto i costi, salvando così dei posti di lavoro.", pl: "Firma obniżyła koszty, ratując w ten sposób miejsca pracy.", tr: "Şirket maliyetleri düşürdü ve böylece iş yerlerini korudu.", id: "Perusahaan itu memangkas biaya, sehingga menyelamatkan lapangan kerja.", vi: "Công ty cắt giảm chi phí, nhờ đó giữ được việc làm." } }
          - { level: C1, linker: { pattern: [thereby, { slot: V-ing }] }, use: { en: "by that means", uk: "тим самим", es: "con ello, por ese medio", pt: "com isso, por esse meio", fr: "par ce moyen", de: "dadurch, auf diesem Weg", it: "con ciò, in quel modo", pl: "tym samym, za pomocą tego", tr: "bu yolla", id: "dengan cara itu", vi: "bằng cách đó" }, ex: ["She signed the form, ", { target: thereby accepting }, " the terms."], tr: { uk: "Вона підписала форму, тим самим прийнявши умови.", es: "Firmó el formulario, aceptando con ello las condiciones.", pt: "Ela assinou o formulário, aceitando com isso os termos.", fr: "Elle a signé le formulaire, acceptant par là même les conditions.", de: "Sie unterschrieb das Formular und akzeptierte dadurch die Bedingungen.", it: "Ha firmato il modulo, accettando così le condizioni.", pl: "Podpisała formularz, tym samym akceptując warunki.", tr: "Formu imzaladı ve bu yolla şartları kabul etmiş oldu.", id: "Dia menandatangani formulir itu, dengan begitu menerima persyaratannya.", vi: "Cô ấy ký vào biểu mẫu, qua đó chấp nhận các điều khoản." } }
          - { level: C1, linker: { term: whereby }, use: { en: "by which; describes a system or an agreement", uk: "за яким; описує систему або угоду", es: "mediante el cual; describe un sistema o un acuerdo", pt: "pelo qual; descreve um sistema ou um acordo", fr: "par lequel ; décrit un système ou un accord", de: "wodurch; beschreibt ein System oder eine Vereinbarung", it: "per cui; descrive un sistema o un accordo", pl: "według którego; opisuje system lub umowę", tr: "bunun aracılığıyla; bir sistemi ya da anlaşmayı tanımlar", id: "yang dengannya; menjelaskan suatu sistem atau kesepakatan", vi: "nhờ đó; mô tả một hệ thống hoặc một thỏa thuận" }, ex: ["a system ", { target: whereby }, " citizens can vote online"], tr: { uk: "система, за якою громадяни можуть голосувати онлайн", es: "un sistema mediante el cual los ciudadanos pueden votar en línea", pt: "um sistema pelo qual os cidadãos podem votar pela internet", fr: "un système par lequel les citoyens peuvent voter en ligne", de: "ein System, bei dem die Bürger online abstimmen können", it: "un sistema per cui i cittadini possono votare online", pl: "system, według którego obywatele mogą głosować online", tr: "vatandaşların internetten oy kullanabildiği bir sistem", id: "sistem yang memungkinkan warga memberikan suara secara daring", vi: "một hệ thống mà nhờ đó công dân có thể bỏ phiếu trực tuyến" } }
          - { level: C1, linker: { term: accordingly }, use: { en: "in a way that suits the facts; as a result", uk: "відповідно до фактів; у результаті", es: "de manera adecuada a los hechos; como resultado", pt: "de modo adequado aos fatos; como resultado", fr: "d’une façon adaptée aux faits ; en conséquence", de: "den Tatsachen entsprechend; als Folge", it: "in modo adatto ai fatti; di conseguenza", pl: "zgodnie z faktami; w rezultacie", tr: "olgulara uygun biçimde; sonuç olarak", id: "sesuai dengan fakta; akibatnya", vi: "phù hợp với tình hình; do đó" }, ex: ["The rules changed, and we acted ", { target: accordingly }, "."], tr: { uk: "Правила змінилися, і ми діяли відповідно.", es: "Las reglas cambiaron y actuamos en consecuencia.", pt: "As regras mudaram, e agimos de acordo.", fr: "Les règles ont changé et nous avons agi en conséquence.", de: "Die Regeln änderten sich, und wir handelten entsprechend.", it: "Le regole sono cambiate e noi abbiamo agito di conseguenza.", pl: "Zasady się zmieniły, a my postąpiliśmy odpowiednio.", tr: "Kurallar değişti ve biz de buna göre hareket ettik.", id: "Aturannya berubah, dan kami bertindak sesuai dengan itu.", vi: "Quy tắc đã thay đổi, và chúng tôi hành động cho phù hợp." } }
          - { level: C1, linker: { term: whilst }, use: { en: "while; formal, British", uk: "while; формальне, британська англійська", es: "while; formal, inglés británico", pt: "while; formal, inglês britânico", fr: "while ; soutenu, anglais britannique", de: "while; formell, britisches Englisch", it: "while; formale, inglese britannico", pl: "while; formalne, brytyjski angielski", tr: "while; resmî, İngiliz İngilizcesi", id: "while; formal, Bahasa Inggris Britania", vi: "while; trang trọng, tiếng Anh Anh" }, ex: [{ variant: { target: Whilst }, variety: en-GB }, " ", { variant: { target: While }, variety: en-US }, " I agree, I have doubts."], tr: { uk: "Хоча я погоджуюся, у мене є сумніви.", es: "Aunque estoy de acuerdo, tengo mis dudas.", pt: "Embora eu concorde, tenho dúvidas.", fr: "Tout en étant d’accord, j’ai des doutes.", de: "Ich stimme zwar zu, habe aber Zweifel.", it: "Pur essendo d'accordo, ho dei dubbi.", pl: "Chociaż się zgadzam, mam wątpliwości.", tr: "Katılsam da şüphelerim var.", id: "Meskipun saya setuju, saya punya keraguan.", vi: "Mặc dù tôi đồng ý, tôi vẫn còn nghi ngờ." } }
          - { level: C1, linker: { alternatives: [{ term: insofar as }, { term: to the extent that }] }, use: { en: "limits a statement", uk: "обмежує твердження", es: "limita una afirmación", pt: "limita uma afirmação", fr: "limite une affirmation", de: "schränkt eine Aussage ein", it: "limita un'affermazione", pl: "ogranicza twierdzenie", tr: "bir ifadeyi sınırlar", id: "membatasi suatu pernyataan", vi: "giới hạn một nhận định" }, ex: ["The report is useful ", { target: insofar as }, " it gives figures."], tr: { uk: "Звіт корисний настільки, наскільки в ньому є цифри.", es: "El informe es útil en la medida en que ofrece cifras.", pt: "O relatório é útil na medida em que apresenta números.", fr: "Le rapport est utile dans la mesure où il donne des chiffres.", de: "Der Bericht ist insofern nützlich, als er Zahlen liefert.", it: "Il rapporto è utile nella misura in cui fornisce cifre.", pl: "Raport jest użyteczny w takim stopniu, w jakim podaje liczby.", tr: "Rapor, rakamlar verdiği ölçüde yararlıdır.", id: "Laporan itu berguna sejauh memberikan angka.", vi: "Bản báo cáo chỉ hữu ích trong chừng mực nó đưa ra số liệu." } }
          - { level: C1, linker: { term: in that }, use: { en: "because, in this respect", uk: "тому що; у цьому відношенні", es: "porque; en este aspecto", pt: "porque; neste aspecto", fr: "parce que ; sur ce point", de: "weil; in dieser Hinsicht", it: "perché; sotto questo aspetto", pl: "ponieważ; pod tym względem", tr: "çünkü; bu bakımdan", id: "karena; dalam hal ini", vi: "bởi vì; ở khía cạnh này" }, ex: ["The plan is risky ", { target: in that }, " it relies on one supplier."], tr: { uk: "План ризикований тим, що залежить від одного постачальника.", es: "El plan es arriesgado en el sentido de que depende de un solo proveedor.", pt: "O plano é arriscado no sentido de que depende de um único fornecedor.", fr: "Le plan est risqué en ce qu’il dépend d’un seul fournisseur.", de: "Der Plan ist dadurch riskant, dass er von einem einzigen Lieferanten abhängt.", it: "Il piano è rischioso in quanto dipende da un solo fornitore.", pl: "Plan jest ryzykowny, ponieważ opiera się na jednym dostawcy.", tr: "Plan, tek bir tedarikçiye dayandığı için risklidir.", id: "Rencana itu berisiko karena bergantung pada satu pemasok.", vi: "Kế hoạch này rủi ro ở chỗ nó dựa vào một nhà cung cấp duy nhất." } }
          - { level: C1, linker: { term: with the result that }, use: { en: "a result stated as a fact", uk: "наслідок, поданий як факт", es: "un resultado presentado como un hecho", pt: "um resultado apresentado como um fato", fr: "un résultat énoncé comme un fait", de: "eine Folge, als Tatsache dargestellt", it: "una conseguenza presentata come un fatto", pl: "skutek podany jako fakt", tr: "bir olgu olarak belirtilen sonuç", id: "akibat yang dinyatakan sebagai fakta", vi: "một kết quả được nêu như một sự thật" }, ex: ["Prices rose, ", { target: with the result that }, " fewer people bought."], tr: { uk: "Ціни зросли, у результаті чого купувати стали менше людей.", es: "Los precios subieron, con el resultado de que compró menos gente.", pt: "Os preços subiram, com o resultado de que menos pessoas compraram.", fr: "Les prix ont augmenté, avec pour résultat que moins de gens ont acheté.", de: "Die Preise stiegen, mit dem Ergebnis, dass weniger Leute kauften.", it: "I prezzi sono saliti, con il risultato che meno persone hanno comprato.", pl: "Ceny wzrosły, w wyniku czego mniej osób kupowało.", tr: "Fiyatlar yükseldi ve bunun sonucunda daha az insan satın aldı.", id: "Harga naik, dengan akibat lebih sedikit orang yang membeli.", vi: "Giá tăng, kết quả là ít người mua hơn." } }
          - { level: C1, linker: { term: so much so that }, use: { en: "to such a degree that", uk: "до такого ступеня, що", es: "hasta tal punto que", pt: "a tal ponto que", fr: "à un tel point que", de: "in einem solchen Maß, dass", it: "a tal punto che", pl: "do tego stopnia, że", tr: "o dereceye kadar ki", id: "sampai sedemikian rupa sehingga", vi: "đến mức mà" }, ex: ["He was ill, ", { target: so much so that }, " he could not work."], tr: { uk: "Він хворів, і то настільки, що не міг працювати.", es: "Estaba enfermo, hasta tal punto que no podía trabajar.", pt: "Ele estava doente, a tal ponto que não podia trabalhar.", fr: "Il était malade, à tel point qu’il ne pouvait pas travailler.", de: "Er war krank, und zwar so sehr, dass er nicht arbeiten konnte.", it: "Era malato, a tal punto che non poteva lavorare.", pl: "Był chory, do tego stopnia, że nie mógł pracować.", tr: "Hastaydı, hem de o kadar ki çalışamıyordu.", id: "Dia sakit, sampai-sampai tidak bisa bekerja.", vi: "Anh ấy ốm, đến mức không thể làm việc." } }
          - { level: C1, linker: { term: such that }, use: { en: "of a kind or size that", uk: "такого роду чи розміру, що", es: "de tal naturaleza o tamaño que", pt: "de tal natureza ou tamanho que", fr: "d’une nature ou d’une ampleur telle que", de: "von einer Art oder Größe, dass", it: "di una natura o di una misura tale che", pl: "takiego rodzaju lub rozmiaru, że", tr: "öyle bir türde ya da büyüklükte ki", id: "sedemikian rupa atau sebesar itu sehingga", vi: "thuộc loại hoặc cỡ đến mức" }, ex: ["The damage was ", { target: such that }, " the shop had to close."], tr: { uk: "Збитки були такі, що магазин довелося закрити.", es: "El daño fue tal que la tienda tuvo que cerrar.", pt: "O dano foi tal que a loja teve de fechar.", fr: "Les dégâts étaient tels que le magasin a dû fermer.", de: "Der Schaden war so groß, dass das Geschäft schließen musste.", it: "Il danno è stato tale che il negozio ha dovuto chiudere.", pl: "Szkody były takie, że sklep musiał się zamknąć.", tr: "Hasar öyleydi ki dükkân kapanmak zorunda kaldı.", id: "Kerusakannya sedemikian rupa sehingga toko itu harus tutup.", vi: "Thiệt hại lớn đến mức cửa hàng phải đóng cửa." } }

  - title: { en: Referring in writing, uk: "Відсилання в письмовому тексті", es: "Remisiones en un texto escrito", pt: "Remissões em um texto escrito", fr: "Renvois dans un texte écrit", de: "Rückverweise im Text", it: "Rimandi in un testo scritto", pl: "Odsyłanie w tekście pisanym", tr: "Yazıda gönderme", id: "Merujuk dalam tulisan", vi: "Quy chiếu trong văn viết" }
    role: own
