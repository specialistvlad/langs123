            ex: ["I was tired, ", { target: so }, " I left."]
            tr: { uk: "Я втомився, тому пішов.", es: "Estaba cansado, así que me fui.", pt: "Eu estava cansado, por isso fui embora.", fr: "J’étais fatigué, donc je suis parti.", de: "Ich war müde, also bin ich gegangen.", it: "Ero stanco, quindi sono andato via.", pl: "Byłem zmęczony, więc wyszedłem.", tr: "Yorgundum, bu yüzden ayrıldım.", id: "Saya lelah, jadi saya pergi.", vi: "Tôi mệt, nên tôi đã về." }
          - type: rule
            level: A1
            text:
              en: [{ term: and }, ", ", { term: or }, " and ", { term: because }, " usually have no comma before them."]
              uk: ["Перед ", { term: and }, ", ", { term: or }, " і ", { term: because }, " зазвичай коми немає."]
              es: ["Delante de ", { term: and }, ", ", { term: or }, " y ", { term: because }, " normalmente no hay coma."]
              pt: ["Antes de ", { term: "and" }, ", ", { term: "or" }, " e ", { term: "because" }, " normalmente não há vírgula."]
