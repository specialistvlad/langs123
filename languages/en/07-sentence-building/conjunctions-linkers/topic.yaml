        rows:
          - { level: B2, position: { en: "start of a sentence", uk: "початок речення", es: "al inicio de la oración", pt: "no início da frase", fr: "en début de phrase", de: "am Satzanfang", it: "all'inizio della frase", pl: "początek zdania", tr: "cümle başı", id: "awal kalimat", vi: "đầu câu" }, rule: { en: "a comma after the adverb", uk: "кома після прислівника", es: "coma después del adverbio", pt: "vírgula depois do advérbio", fr: "une virgule après l’adverbe", de: "ein Komma nach dem Adverb", it: "virgola dopo l'avverbio", pl: "przecinek po przysłówku", tr: "zarftan sonra virgül", id: "koma setelah kata keterangan", vi: "dấu phẩy sau trạng từ" }, ex: ["It was late. ", { target: However }, ", we stayed."], tr: { uk: "Було пізно. Проте ми залишилися.", es: "Era tarde. Sin embargo, nos quedamos.", pt: "Estava tarde. No entanto, nós ficamos.", fr: "Il était tard. Pourtant, nous sommes restés.", de: "Es war spät. Trotzdem sind wir geblieben.", it: "Era tardi. Tuttavia, siamo rimasti.", pl: "Było późno. Mimo to zostaliśmy.", tr: "Geç olmuştu. Ancak kaldık.", id: "Hari sudah larut. Namun, kami tetap tinggal.", vi: "Đã muộn. Tuy nhiên, chúng tôi vẫn ở lại." } }
          - { level: B2, position: { en: "after a semicolon", uk: "після крапки з комою", es: "después de un punto y coma", pt: "depois de um ponto e vírgula", fr: "après un point-virgule", de: "nach einem Semikolon", it: "dopo un punto e virgola", pl: "po średniku", tr: "noktalı virgülden sonra", id: "setelah titik koma", vi: "sau dấu chấm phẩy" }, rule: { en: "a semicolon before, a comma after", uk: "крапка з комою перед, кома після", es: "punto y coma antes, coma después", pt: "ponto e vírgula antes, vírgula depois", fr: "un point-virgule avant, une virgule après", de: "ein Semikolon davor, ein Komma danach", it: "punto e virgola prima, virgola dopo", pl: "średnik przed, przecinek po", tr: "öncesinde noktalı virgül, sonrasında virgül", id: "titik koma di depan, koma di belakang", vi: "dấu chấm phẩy đứng trước, dấu phẩy đứng sau" }, ex: ["It was late", { target: "; however," }, " we stayed."], tr: { uk: "Було пізно; проте ми залишилися.", es: "Era tarde; sin embargo, nos quedamos.", pt: "Estava tarde; no entanto, nós ficamos.", fr: "Il était tard ; pourtant, nous sommes restés.", de: "Es war spät; trotzdem sind wir geblieben.", it: "Era tardi; tuttavia, siamo rimasti.", pl: "Było późno; mimo to zostaliśmy.", tr: "Geç olmuştu; ancak kaldık.", id: "Hari sudah larut; namun, kami tetap tinggal.", vi: "Đã muộn; tuy nhiên, chúng tôi vẫn ở lại." } }
          - { level: B2, position: { en: "in the middle", uk: "посередині речення", es: "en medio de la oración", pt: "no meio da frase", fr: "au milieu de la phrase", de: "in der Satzmitte", it: "in mezzo alla frase", pl: "w środku zdania", tr: "cümle ortası", id: "di tengah kalimat", vi: "giữa câu" }, rule: { en: "a comma on each side", uk: "кома з кожного боку", es: "una coma a cada lado", pt: "uma vírgula de cada lado", fr: "une virgule de chaque côté", de: "ein Komma auf jeder Seite", it: "una virgola per lato", pl: "przecinek z każdej strony", tr: "iki yanında da virgül", id: "koma di kedua sisi", vi: "dấu phẩy ở cả hai bên" }, ex: ["We stayed", { target: ", however," }, " until ten."], tr: { uk: "Ми, проте, залишилися до десятої.", es: "Nos quedamos, sin embargo, hasta las diez.", pt: "Nós ficamos, no entanto, até as dez.", fr: "Nous sommes restés, pourtant, jusqu’à dix heures.", de: "Wir sind jedoch bis zehn geblieben.", it: "Siamo rimasti, tuttavia, fino alle dieci.", pl: "Zostaliśmy jednak do dziesiątej.", tr: "Yine de saat ona kadar kaldık.", id: "Kami, bagaimanapun, tinggal sampai pukul sepuluh.", vi: "Chúng tôi, tuy nhiên, đã ở lại đến mười giờ." } }
          - { level: B2, position: { en: "at the end", uk: "кінець речення", es: "al final de la oración", pt: "no fim da frase", fr: "en fin de phrase", de: "am Satzende", it: "alla fine della frase", pl: "koniec zdania", tr: "cümle sonu", id: "akhir kalimat", vi: "cuối câu" }, rule: { en: "a comma before the adverb", uk: "кома перед прислівником", es: "coma antes del adverbio", pt: "vírgula antes do advérbio", fr: "une virgule avant l’adverbe", de: "ein Komma vor dem Adverb", it: "virgola prima dell'avverbio", pl: "przecinek przed przysłówkiem", tr: "zarftan önce virgül", id: "koma sebelum kata keterangan", vi: "dấu phẩy trước trạng từ" }, ex: ["We stayed until ten", { target: ", however" }, "."], tr: { uk: "Ми залишилися до десятої, проте.", es: "Nos quedamos hasta las diez, sin embargo.", pt: "Nós ficamos até as dez, no entanto.", fr: "Nous sommes restés jusqu’à dix heures, pourtant.", de: "Wir sind bis zehn geblieben, allerdings.", it: "Siamo rimasti fino alle dieci, tuttavia.", pl: "Zostaliśmy do dziesiątej, jednak.", tr: "Ona kadar kaldık, ancak.", id: "Kami tinggal sampai pukul sepuluh, bagaimanapun.", vi: "Chúng tôi ở lại đến mười giờ, tuy nhiên." } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: Two clauses joined by a linking adverb need a full stop or a semicolon between them.
              uk: "Дві частини речення, поєднані сполучним прислівником, розділяють крапкою або крапкою з комою."
              es: "Dos oraciones unidas por un adverbio conector necesitan un punto o un punto y coma entre ellas."
              pt: "Duas orações unidas por um advérbio conectivo precisam de um ponto final ou de um ponto e vírgula entre elas."
              fr: "Deux propositions reliées par un adverbe de liaison sont séparées par un point ou un point-virgule."
              de: "Zwei Teilsätze, die ein Konjunktionaladverb verbindet, brauchen dazwischen einen Punkt oder ein Semikolon."
              it: "Due proposizioni unite da un avverbio connettivo hanno bisogno di un punto o di un punto e virgola tra loro."
              pl: "Dwie części zdania połączone przysłówkiem łączącym oddziela kropka lub średnik."
              tr: "Bağlayıcı zarfla birleştirilen iki cümlenin arasına nokta ya da noktalı virgül konur."
              id: "Dua klausa yang dihubungkan oleh kata keterangan penghubung memerlukan titik atau titik koma di antaranya."
              vi: "Hai mệnh đề nối bằng trạng từ nối cần có dấu chấm hoặc dấu chấm phẩy ở giữa."
            ex: ["It rained", { target: "; nevertheless," }, " we went out."]
            tr: { uk: "Йшов дощ; проте ми вийшли.", es: "Llovió; no obstante, salimos.", pt: "Choveu; no entanto, saímos.", fr: "Il a plu ; néanmoins, nous sommes sortis.", de: "Es regnete; trotzdem gingen wir hinaus.", it: "Ha piovuto; ciononostante, siamo usciti.", pl: "Padało; niemniej jednak wyszliśmy.", tr: "Yağmur yağdı; yine de dışarı çıktık.", id: "Hujan turun; meskipun demikian, kami keluar.", vi: "Trời mưa; dù vậy, chúng tôi vẫn ra ngoài." }
  - title: { en: Fronted concession, uk: "Допустовість із виносом на початок", es: "Concesión con elemento adelantado", pt: "Concessão com elemento antecipado", fr: "Concession avec mise en tête", de: "Konzession mit vorangestelltem Wort", it: "Concessione con elemento anticipato", pl: "Przyzwolenie z członem na początku zdania", tr: "Başa alınan ögeyle ödün", id: "Konsesi dengan unsur di awal kalimat", vi: "Nhượng bộ với thành phần đảo lên đầu câu" }
