          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, word: { alternatives: [{ term: the former }, { term: the latter }] }, use: { en: "the first, the second of two things just named", uk: "перше й друге з двох щойно названих", es: "el primero y el segundo de dos cosas recién nombradas", pt: "o primeiro e o segundo de duas coisas recém-citadas", fr: "le premier et le second de deux éléments qu’on vient de nommer", de: "das erste und das zweite von zwei eben genannten Dingen", it: "il primo e il secondo di due cose appena nominate", pl: "pierwsza i druga z dwóch rzeczy, które właśnie wymieniono", tr: "az önce adı geçen iki şeyin birincisi ve ikincisi", id: "yang pertama dan yang kedua dari dua hal yang baru disebut", vi: "cái thứ nhất và cái thứ hai trong hai điều vừa nêu" }, ex: ["Ana and Luis applied; ", { target: the former }, " was accepted, ", { target: the latter }, " was not."], tr: { uk: "Ана й Луїс подали заявки; першу прийняли, а другого — ні.", es: "Ana y Luis presentaron su solicitud; la primera fue aceptada, el segundo no.", pt: "Ana e Luis se candidataram; a primeira foi aceita, o segundo não.", fr: "Ana et Luis ont posé leur candidature ; la première a été acceptée, le second ne l’a pas été.", de: "Ana und Luis haben sich beworben; Erstere wurde angenommen, Letzterer nicht.", it: "Ana e Luis si sono candidati; la prima è stata accettata, il secondo no.", pl: "Ana i Luis złożyli podania; pierwsza została przyjęta, drugi nie.", tr: "Ana ile Luis başvurdu; birincisi kabul edildi, ikincisi edilmedi.", id: "Ana dan Luis melamar; yang pertama diterima, yang terakhir tidak.", vi: "Ana và Luis đã nộp đơn; người trước được nhận, người sau thì không." } }
          - { level: C1, word: { alternatives: [{ term: the above }, { term: the following }] }, use: { en: "what was written before, what comes next", uk: "те, що написано раніше, і те, що йде далі", es: "lo escrito antes y lo que viene después", pt: "o que foi escrito antes e o que vem a seguir", fr: "ce qui a été écrit avant et ce qui suit", de: "was vorher geschrieben wurde und was als Nächstes kommt", it: "ciò che è stato scritto prima e ciò che viene dopo", pl: "to, co napisano wcześniej, i to, co następuje", tr: "daha önce yazılanlar ve sonra gelenler", id: "yang tertulis sebelumnya dan yang menyusul", vi: "điều đã viết trước đó và điều sắp tới" }, ex: ["Please read ", { target: the following }, " instructions."], tr: { uk: "Будь ласка, прочитайте наведені нижче інструкції.", es: "Por favor, lea las siguientes instrucciones.", pt: "Por favor, leia as instruções a seguir.", fr: "Veuillez lire les instructions suivantes.", de: "Bitte lesen Sie die folgenden Anweisungen.", it: "Si prega di leggere le seguenti istruzioni.", pl: "Proszę przeczytać poniższe instrukcje.", tr: "Lütfen aşağıdaki talimatları okuyun.", id: "Harap baca petunjuk berikut.", vi: "Vui lòng đọc các hướng dẫn sau." } }
          - { level: C1, word: { term: respectively }, use: { en: "in the same order as the items before", uk: "в тому самому порядку, що й попередні елементи", es: "en el mismo orden que los elementos anteriores", pt: "na mesma ordem dos itens anteriores", fr: "dans le même ordre que les éléments précédents", de: "in derselben Reihenfolge wie die vorher genannten Glieder", it: "nello stesso ordine degli elementi precedenti", pl: "w tej samej kolejności co wcześniejsze elementy", tr: "önceki öğelerle aynı sırada", id: "dalam urutan yang sama dengan unsur sebelumnya", vi: "theo cùng thứ tự với các mục trước" }, ex: ["Ana and Luis are 25 and 30, ", { target: respectively }, "."], tr: { uk: "Ані та Луїсу — 25 і 30 років відповідно.", es: "Ana y Luis tienen 25 y 30 años, respectivamente.", pt: "Ana e Luis têm 25 e 30 anos, respectivamente.", fr: "Ana et Luis ont respectivement 25 et 30 ans.", de: "Ana und Luis sind 25 beziehungsweise 30 Jahre alt.", it: "Ana e Luis hanno rispettivamente 25 e 30 anni.", pl: "Ana i Luis mają odpowiednio 25 i 30 lat.", tr: "Ana ve Luis sırasıyla 25 ve 30 yaşındadır.", id: "Ana dan Luis masing-masing berusia 25 dan 30 tahun.", vi: "Ana và Luis lần lượt 25 và 30 tuổi." } }
          - { level: C1, word: { alternatives: [{ term: as mentioned }, { term: as stated }] }, use: { en: "refers to an earlier point", uk: "відсилає до попередньої думки", es: "remite a un punto anterior", pt: "remete a um ponto anterior", fr: "renvoie à un point antérieur", de: "verweist auf einen früheren Punkt", it: "rimanda a un punto precedente", pl: "odsyła do wcześniejszej kwestii", tr: "daha önceki bir noktaya gönderme yapar", id: "merujuk pada poin sebelumnya", vi: "quy chiếu đến một ý đã nêu trước đó" }, ex: [{ target: As mentioned }, " above, the results vary."], tr: { uk: "Як зазначено вище, результати різняться.", es: "Como se mencionó anteriormente, los resultados varían.", pt: "Como mencionado acima, os resultados variam.", fr: "Comme mentionné ci-dessus, les résultats varient.", de: "Wie oben erwähnt, unterscheiden sich die Ergebnisse.", it: "Come accennato sopra, i risultati variano.", pl: "Jak wspomniano powyżej, wyniki się różnią.", tr: "Yukarıda belirtildiği gibi, sonuçlar değişir.", id: "Seperti disebutkan di atas, hasilnya beragam.", vi: "Như đã đề cập ở trên, các kết quả khác nhau." } }
  - title: { en: Learned linkers, uk: "Книжні слова-зв’язки", es: "Conectores cultos", pt: "Conectivos eruditos", fr: "Connecteurs savants", de: "Gehobene Bindewörter", it: "Connettivi colti", pl: "Książkowe słowa łączące", tr: "Yüksek üslup bağlayıcıları", id: "Kata penghubung tingkat tinggi", vi: "Từ nối văn chương" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, linker: { term: notwithstanding }, use: { en: "despite; before or after its noun", uk: "попри; перед своїм іменником або після нього", es: "a pesar de; antes o después de su sustantivo", pt: "apesar de; antes ou depois do seu substantivo", fr: "malgré ; avant ou après son nom", de: "trotz; vor oder nach seinem Nomen", it: "nonostante; prima o dopo il suo sostantivo", pl: "mimo; przed rzeczownikiem lub po nim", tr: "rağmen; isminden önce ya da sonra gelir", id: "meskipun; sebelum atau sesudah kata bendanya", vi: "bất chấp; đứng trước hoặc sau danh từ của nó" }, ex: { examples: [[{ target: Notwithstanding }, " the delay, the event went ahead."], ["The delay ", { target: notwithstanding }, ", the event went ahead."]] }, tr: { uk: { examples: ["Попри затримку, захід відбувся.", "Затримці всупереч, захід відбувся."] }, es: { examples: ["No obstante el retraso, el evento siguió adelante.", "El evento, pese al retraso, siguió adelante."] }, pt: { examples: ["Apesar do atraso, o evento seguiu em frente.", "O evento, não obstante o atraso, seguiu em frente."] }, fr: { examples: ["Malgré le retard, l’événement a eu lieu.", "Le retard nonobstant, l’événement a eu lieu."] }, de: { examples: ["Ungeachtet der Verzögerung fand die Veranstaltung statt.", "Der Verzögerung ungeachtet fand die Veranstaltung statt."] }, it: { examples: ["Nonostante il ritardo, l'evento si è svolto.", "Il ritardo nonostante, l'evento si è svolto."] }, pl: { examples: ["Mimo opóźnienia impreza się odbyła.", "Opóźnieniu wbrew, impreza się odbyła."] }, tr: { examples: ["Gecikmeye rağmen etkinlik yapıldı.", "Gecikmeye karşın etkinlik yapıldı."] }, id: { examples: ["Terlepas dari keterlambatan itu, acara tetap berlangsung.", "Acara tetap berlangsung, terlepas dari keterlambatan itu."] }, vi: { examples: ["Bất chấp sự chậm trễ, sự kiện vẫn diễn ra.", "Sự kiện vẫn diễn ra, bất chấp sự chậm trễ."] } } }
          - { level: C2, linker: { pattern: [albeit, { alternatives: [{ slot: adjective }, { slot: adverb }, { slot: noun }] }] }, use: { en: "although it is; with a short phrase only", uk: "хоча це є; лише з короткою фразою", es: "aunque sea; solo con una frase breve", pt: "embora seja; só com uma expressão curta", fr: "même si c’est ; seulement avec un court groupe de mots", de: "wenn auch; nur mit einer kurzen Wendung", it: "anche se è; solo con un breve sintagma", pl: "choć jest; tylko z krótką frazą", tr: "olsa da; yalnızca kısa bir öbekle", id: "walaupun itu; hanya dengan frasa pendek", vi: "mặc dù là; chỉ đi với một cụm ngắn" }, ex: { examples: [["She gave a clear, ", { target: albeit brief }, ", answer."], ["He agreed, ", { target: albeit reluctantly }, "."]] }, tr: { uk: { examples: ["Вона дала чітку, хоч і коротку, відповідь.", "Він погодився, хоч і неохоче."] }, es: { examples: ["Dio una respuesta clara, aunque breve.", "Aceptó, aunque de mala gana."] }, pt: { examples: ["Ela deu uma resposta clara, embora breve.", "Ele concordou, ainda que a contragosto."] }, fr: { examples: ["Elle a donné une réponse claire, quoique brève.", "Il a accepté, quoique à contrecœur."] }, de: { examples: ["Sie gab eine klare, wenn auch kurze Antwort.", "Er stimmte zu, wenn auch widerwillig."] }, it: { examples: ["Ha dato una risposta chiara, anche se breve.", "Ha accettato, seppure con riluttanza."] }, pl: { examples: ["Udzieliła jasnej, choć krótkiej odpowiedzi.", "Zgodził się, choć niechętnie."] }, tr: { examples: ["Kısa da olsa net bir cevap verdi.", "İstemeyerek de olsa kabul etti."] }, id: { examples: ["Dia memberi jawaban yang jelas, walaupun singkat.", "Dia setuju, walaupun dengan enggan."] }, vi: { examples: ["Cô ấy đưa ra một câu trả lời rõ ràng, tuy ngắn.", "Anh ấy đồng ý, tuy không sẵn lòng."] } } }
          - { level: C2, linker: { term: inasmuch as }, use: { en: "in that, to the extent that; very formal", uk: "тим, що; настільки, наскільки; дуже формальне", es: "en tanto que, en la medida en que; muy formal", pt: "na medida em que, visto que; muito formal", fr: "dans la mesure où, en ce que ; très soutenu", de: "insofern als, soweit; sehr formell", it: "in quanto, nella misura in cui; molto formale", pl: "ponieważ, w takim stopniu, w jakim; bardzo formalne", tr: "ölçüde, bu bakımdan; çok resmî", id: "dalam hal, sejauh; sangat formal", vi: "ở chỗ, trong chừng mực; rất trang trọng" }, ex: ["The law is unfair ", { target: inasmuch as }, " it protects only the rich."], tr: { uk: "Закон несправедливий тим, що захищає лише багатих.", es: "La ley es injusta en tanto que protege solo a los ricos.", pt: "A lei é injusta na medida em que protege apenas os ricos.", fr: "La loi est injuste en ce qu’elle ne protège que les riches.", de: "Das Gesetz ist insofern ungerecht, als es nur die Reichen schützt.", it: "La legge è ingiusta in quanto protegge solo i ricchi.", pl: "Prawo jest niesprawiedliwe, ponieważ chroni wyłącznie bogatych.", tr: "Yasa yalnızca zenginleri koruması bakımından adaletsizdir.", id: "Hukum itu tidak adil karena hanya melindungi orang kaya.", vi: "Đạo luật này bất công ở chỗ nó chỉ bảo vệ người giàu." } }
          - { level: C2, linker: { term: whereupon }, use: { en: "and then, immediately after which", uk: "і тоді, відразу після чого", es: "y entonces, inmediatamente después de lo cual", pt: "e então, logo depois do que", fr: "et alors, immédiatement après quoi", de: "und dann, unmittelbar danach", it: "e allora, subito dopo di che", pl: "i wtedy, zaraz po czym", tr: "ve ardından, hemen sonrasında", id: "dan kemudian, segera setelah itu", vi: "và rồi, ngay sau đó" }, ex: ["He raised his glass, ", { target: whereupon }, " everyone stood."], tr: { uk: "Він підняв келих, після чого всі підвелися.", es: "Levantó su copa, tras lo cual todos se pusieron de pie.", pt: "Ele ergueu o copo, após o que todos se levantaram.", fr: "Il a levé son verre, sur quoi tout le monde s’est levé.", de: "Er hob sein Glas, woraufhin alle aufstanden.", it: "Ha alzato il bicchiere, al che tutti si sono alzati.", pl: "Podniósł kieliszek, po czym wszyscy wstali.", tr: "Kadehini kaldırdı, bunun üzerine herkes ayağa kalktı.", id: "Dia mengangkat gelasnya, lalu semua orang berdiri.", vi: "Ông ấy nâng ly, ngay sau đó mọi người đứng dậy." } }
          - { level: C2, linker: { pattern: [lest, { slot: subject }, { alternatives: [{ slot: base verb }, should] }] }, use: { en: "for fear that; already negative", uk: "зі страху, що; уже містить заперечення", es: "por miedo a que; ya es negativo", pt: "por receio de que; já é negativo", fr: "de peur que ; déjà négatif", de: "aus Furcht, dass; schon verneint", it: "per timore che; già negativo", pl: "z obawy, że; samo jest już przeczące", tr: "korkusuyla; zaten olumsuzdur", id: "karena takut bahwa; sudah bermakna negatif", vi: "vì sợ rằng; vốn đã mang nghĩa phủ định" }, ex: ["She spoke quietly ", { target: lest }, " she ", { target: wake }, " the baby."], tr: { uk: "Вона говорила тихо, щоб не розбудити дитину.", es: "Habló en voz baja, no fuera a despertar al bebé.", pt: "Ela falou baixinho para não acordar o bebê.", fr: "Elle parlait doucement de peur de réveiller le bébé.", de: "Sie sprach leise, damit sie das Baby nicht weckte.", it: "Ha parlato sottovoce per timore di svegliare il bambino.", pl: "Mówiła cicho, aby nie obudzić dziecka.", tr: "Bebeği uyandırmaktan korktuğu için sessiz konuştu.", id: "Dia berbicara pelan agar jangan sampai membangunkan bayi itu.", vi: "Cô ấy nói khẽ, vì sợ đánh thức em bé." } }

  - title: { en: Stance connectors, uk: "Слова-зв’язки для вираження позиції", es: "Conectores de postura", pt: "Conectivos de posicionamento", fr: "Connecteurs de prise de position", de: "Bindewörter der Stellungnahme", it: "Connettivi di posizione", pl: "Słowa łączące wyrażające stanowisko", tr: "Tutum bildiren bağlayıcılar", id: "Kata penghubung sikap", vi: "Từ nối thể hiện lập trường" }
