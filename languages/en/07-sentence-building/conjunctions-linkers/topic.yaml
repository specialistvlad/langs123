          - { level: B1, linker: however, pattern: "sentence. However, sentence", ex: ["It was raining. ", { target: However }, ", we went out."], tr: { uk: "Йшов дощ. Проте ми вийшли.", es: "Llovía. Sin embargo, salimos.", pt: "Estava chovendo. No entanto, nós saímos.", fr: "Il pleuvait. Pourtant, nous sommes sortis.", de: "Es regnete. Trotzdem sind wir ausgegangen.", it: "Pioveva. Tuttavia, siamo usciti.", pl: "Padało. Mimo to wyszliśmy.", tr: "Yağmur yağıyordu. Ancak dışarı çıktık.", id: "Hari hujan. Namun, kami tetap keluar.", vi: "Trời đang mưa. Tuy nhiên, chúng tôi vẫn ra ngoài." } }
          - { level: B1, linker: while, pattern: [{ pattern: [while, { slot: clause }] }, ", ", { slot: clause }], ex: [{ target: While }, " I like tea, my wife prefers coffee."], tr: { uk: "Тоді як я люблю чай, моя дружина віддає перевагу каві.", es: "Mientras que a mí me gusta el té, mi esposa prefiere el café.", pt: "Enquanto eu gosto de chá, minha esposa prefere café.", fr: "Alors que j’aime le thé, ma femme préfère le café.", de: "Während ich Tee mag, bevorzugt meine Frau Kaffee.", it: "Mentre a me piace il tè, mia moglie preferisce il caffè.", pl: "Podczas gdy ja lubię herbatę, moja żona woli kawę.", tr: "Ben çayı severken karım kahveyi tercih ediyor.", id: "Sementara saya suka teh, istri saya lebih suka kopi.", vi: "Trong khi tôi thích trà, vợ tôi lại thích cà phê." } }
      - type: list
