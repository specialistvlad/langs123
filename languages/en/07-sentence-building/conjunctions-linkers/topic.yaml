            tr: { uk: "Ми залишилися вдома через дощ.", es: "Nos quedamos en casa por la lluvia.", pt: "Nós ficamos em casa por causa da chuva.", fr: "Nous sommes restés à la maison à cause de la pluie.", de: "Wir sind wegen des Regens zu Hause geblieben.", it: "Siamo rimasti a casa a causa della pioggia.", pl: "Zostaliśmy w domu z powodu deszczu.", tr: "Yağmur yüzünden evde kaldık.", id: "Kami tinggal di rumah karena hujan.", vi: "Chúng tôi ở nhà vì trời mưa." }

  - title: { en: "Time linkers: when, before, after, then", uk: "Слова-зв’язки часу: when, before, after, then", es: "Conectores de tiempo: when, before, after, then", pt: "Conectivos de tempo: when, before, after, then", fr: "Connecteurs de temps : when, before, after, then", de: "Zeitliche Bindewörter: when, before, after, then", it: "Connettivi di tempo: when, before, after, then", pl: "Słowa łączące czasu: when, before, after, then", tr: "Zaman bağlayıcıları: when, before, after, then", id: "Kata penghubung waktu: when, before, after, then", vi: "Từ nối chỉ thời gian: when, before, after, then" }
    role: own
