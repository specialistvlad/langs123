              de: ["Vor ", { term: "and" }, ", ", { term: "or" }, " und ", { term: "because" }, " steht meist kein Komma."]
              it: ["Prima di ", { term: "and" }, ", ", { term: "or" }, " e ", { term: "because" }, " di solito non c'è la virgola."]
              pl: ["Przed ", { term: "and" }, ", ", { term: "or" }, " i ", { term: "because" }, " zwykle nie ma przecinka."]
              tr: [{ term: "and" }, ", ", { term: "or" }, " ve ", { term: "because" }, " öncesinde genellikle virgül yoktur."]
              id: [{ term: "and" }, ", ", { term: "or" }, ", dan ", { term: "because" }, " biasanya tidak didahului koma."]
              vi: [{ term: "and" }, ", ", { term: "or" }, " và ", { term: "because" }, " thường không có dấu phẩy đứng trước."]
          - type: rule
            level: A1
            text:
              en: [{ term: because }, " is followed by a clause: a subject and a verb."]
              uk: [{ term: because }, " вимагає після себе речення: підмета й дієслова."]
