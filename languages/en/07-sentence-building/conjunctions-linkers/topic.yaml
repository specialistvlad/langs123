              pl: [{ term: "although" }, " łączy dwie części w jednym zdaniu i zastępuje ", { term: "but" }, "."]
              tr: [{ term: "although" }, " tek cümlede iki yan cümleyi birleştirir ve ", { term: "but" }, " yerine geçer."]
              id: [{ term: "although" }, " menghubungkan dua klausa dalam satu kalimat dan menggantikan ", { term: "but" }, "."]
              vi: [{ term: "although" }, " nối hai mệnh đề trong một câu và thay cho ", { term: "but" }, "."]
          - type: rule
