        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, linker: { pattern: [to, { slot: base verb }] }, use: { en: "purpose, with the same subject", uk: "мета, коли підмет той самий", es: "finalidad, con el mismo sujeto", pt: "finalidade, com o mesmo sujeito", fr: "but, avec le même sujet", de: "Zweck, mit demselben Subjekt", it: "scopo, con lo stesso soggetto", pl: "cel, przy tym samym podmiocie", tr: "amaç, özne aynıyken", id: "tujuan, dengan subjek yang sama", vi: "mục đích, khi chủ ngữ giống nhau" }, ex: ["I'm saving money ", { target: to buy }, " a car."], tr: { uk: "Я відкладаю гроші, щоб купити машину.", es: "Estoy ahorrando dinero para comprar un auto.", pt: "Estou economizando dinheiro para comprar um carro.", fr: "J’économise de l’argent pour acheter une voiture.", de: "Ich spare Geld, um ein Auto zu kaufen.", it: "Sto risparmiando soldi per comprare una macchina.", pl: "Odkładam pieniądze, żeby kupić samochód.", tr: "Araba almak için para biriktiriyorum.", id: "Saya menabung untuk membeli mobil.", vi: "Tôi đang tiết kiệm tiền để mua một chiếc ô tô." } }
          - { level: B2, linker: { pattern: [{ alternatives: [in order to, so as to] }, { slot: base verb }] }, use: { en: "purpose, more formal", uk: "мета, формальніше", es: "finalidad, más formal", pt: "finalidade, mais formal", fr: "but, plus soutenu", de: "Zweck, formeller", it: "scopo, più formale", pl: "cel, bardziej formalnie", tr: "amaç, daha resmî", id: "tujuan, lebih formal", vi: "mục đích, trang trọng hơn" }, ex: { examples: [["She left early ", { target: in order to avoid }, " the traffic."], ["We use less paper ", { target: so as to save }, " trees."]] }, tr: { uk: { examples: ["Вона вийшла раніше, щоб уникнути заторів.", "Ми використовуємо менше паперу, щоб зберегти дерева."] }, es: { examples: ["Salió temprano para evitar el tráfico.", "Usamos menos papel para salvar los árboles."] }, pt: { examples: ["Ela saiu cedo para evitar o trânsito.", "Usamos menos papel para salvar as árvores."] }, fr: { examples: ["Elle est partie tôt afin d’éviter les embouteillages.", "Nous utilisons moins de papier afin de sauver les arbres."] }, de: { examples: ["Sie ist früh gegangen, um den Verkehr zu vermeiden.", "Wir verbrauchen weniger Papier, um Bäume zu schützen."] }, it: { examples: ["È uscita presto per evitare il traffico.", "Usiamo meno carta per salvare gli alberi."] }, pl: { examples: ["Wyszła wcześniej, aby uniknąć korków.", "Zużywamy mniej papieru, aby chronić drzewa."] }, tr: { examples: ["Trafikten kaçınmak için erken çıktı.", "Ağaçları korumak için daha az kâğıt kullanıyoruz."] }, id: { examples: ["Dia berangkat lebih awal agar terhindar dari kemacetan.", "Kami memakai lebih sedikit kertas demi menyelamatkan pohon."] }, vi: { examples: ["Cô ấy đi sớm để tránh kẹt xe.", "Chúng tôi dùng ít giấy hơn để cứu cây xanh."] } } }
          - { level: B2, linker: { pattern: [{ alternatives: [so as not to, in order not to] }, { slot: base verb }] }, use: { en: "purpose that avoids something", uk: "мета — уникнути чогось", es: "finalidad que evita algo", pt: "finalidade que evita algo", fr: "but d’éviter quelque chose", de: "Zweck, etwas zu vermeiden", it: "scopo che evita qualcosa", pl: "cel polegający na uniknięciu czegoś", tr: "bir şeyden kaçınma amacı", id: "tujuan untuk menghindari sesuatu", vi: "mục đích tránh một điều gì đó" }, ex: ["Speak quietly ", { target: so as not to wake }, " the baby."], tr: { uk: "Говори тихо, щоб не розбудити дитину.", es: "Habla en voz baja para no despertar al bebé.", pt: "Fale baixo para não acordar o bebê.", fr: "Parle doucement pour ne pas réveiller le bébé.", de: "Sprich leise, um das Baby nicht zu wecken.", it: "Parla piano per non svegliare il bambino.", pl: "Mów cicho, żeby nie obudzić dziecka.", tr: "Bebeği uyandırmamak için sessiz konuş.", id: "Bicaralah pelan-pelan agar tidak membangunkan bayi.", vi: "Hãy nói khẽ để không đánh thức em bé." } }
          - { level: B2, linker: { pattern: [so that, { slot: subject }, { alternatives: [can, could, will, would] }, { slot: base verb }] }, use: { en: "purpose, with a new subject or a modal", uk: "мета, з новим підметом або модальним дієсловом", es: "finalidad, con un sujeto nuevo o un verbo modal", pt: "finalidade, com um sujeito novo ou um verbo modal", fr: "but, avec un nouveau sujet ou un modal", de: "Zweck, mit neuem Subjekt oder einem Modalverb", it: "scopo, con un nuovo soggetto o un verbo modale", pl: "cel, z nowym podmiotem lub czasownikiem modalnym", tr: "amaç, yeni bir özneyle ya da bir kip fiiliyle", id: "tujuan, dengan subjek baru atau kata kerja modal", vi: "mục đích, với chủ ngữ mới hoặc động từ khuyết thiếu" }, ex: { examples: [["I'm speaking slowly ", { target: so that }, " everyone ", { target: can }, " understand."], ["He spoke slowly ", { target: so that }, " we ", { target: could }, " follow."]] }, tr: { uk: { examples: ["Я говорю повільно, щоб усі могли зрозуміти.", "Він говорив повільно, щоб ми могли стежити за думкою."] }, es: { examples: ["Hablo despacio para que todos puedan entender.", "Habló despacio para que pudiéramos seguirlo."] }, pt: { examples: ["Estou falando devagar para que todos possam entender.", "Ele falou devagar para que pudéssemos acompanhar."] }, fr: { examples: ["Je parle lentement pour que tout le monde puisse comprendre.", "Il a parlé lentement pour que nous puissions suivre."] }, de: { examples: ["Ich spreche langsam, damit alle verstehen können.", "Er sprach langsam, damit wir folgen konnten."] }, it: { examples: ["Parlo lentamente perché tutti possano capire.", "Ha parlato lentamente perché potessimo seguirlo."] }, pl: { examples: ["Mówię powoli, żeby wszyscy mogli zrozumieć.", "Mówił powoli, żebyśmy mogli nadążyć."] }, tr: { examples: ["Herkes anlayabilsin diye yavaş konuşuyorum.", "Takip edebilelim diye yavaş konuştu."] }, id: { examples: ["Saya berbicara pelan-pelan agar semua orang bisa mengerti.", "Dia berbicara pelan-pelan supaya kami bisa mengikuti."] }, vi: { examples: ["Tôi đang nói chậm để mọi người có thể hiểu.", "Anh ấy nói chậm để chúng tôi có thể theo kịp."] } } }
          - { level: B2, linker: { pattern: [in order that, { slot: subject }, { alternatives: [may, might, can, could] }, { slot: base verb }] }, use: { en: "purpose, formal", uk: "мета, формальне", es: "finalidad, formal", pt: "finalidade, formal", fr: "but, soutenu", de: "Zweck, formell", it: "scopo, formale", pl: "cel, formalnie", tr: "amaç, resmî", id: "tujuan, formal", vi: "mục đích, trang trọng" }, ex: ["The rules changed ", { target: in order that }, " everyone ", { target: might }, " take part."], tr: { uk: "Правила змінили, щоб кожен міг узяти участь.", es: "Se cambiaron las reglas para que todos pudieran participar.", pt: "As regras mudaram para que todos pudessem participar.", fr: "Les règles ont changé afin que tout le monde puisse participer.", de: "Die Regeln wurden geändert, damit sich jeder beteiligen konnte.", it: "Le regole sono cambiate affinché tutti potessero partecipare.", pl: "Zasady zmieniono, aby wszyscy mogli wziąć udział.", tr: "Kurallar, herkes katılabilsin diye değiştirildi.", id: "Aturannya diubah supaya semua orang dapat ikut serta.", vi: "Các quy tắc được thay đổi để mọi người đều có thể tham gia." } }
          - { level: B2, linker: { pattern: [for, { slot: V-ing }] }, use: { en: "what a thing is used for", uk: "для чого використовують річ", es: "para qué sirve una cosa", pt: "para que serve uma coisa", fr: "à quoi sert une chose", de: "wofür man etwas benutzt", it: "a che cosa serve una cosa", pl: "do czego służy rzecz", tr: "bir şeyin ne için kullanıldığı", id: "untuk apa suatu benda dipakai", vi: "một vật dùng để làm gì" }, ex: ["This knife is ", { target: for cutting }, " bread."], tr: { uk: "Цей ніж призначений для нарізання хліба.", es: "Este cuchillo sirve para cortar pan.", pt: "Esta faca serve para cortar pão.", fr: "Ce couteau sert à couper le pain.", de: "Dieses Messer ist zum Brotschneiden da.", it: "Questo coltello serve per tagliare il pane.", pl: "Ten nóż służy do krojenia chleba.", tr: "Bu bıçak ekmek kesmek içindir.", id: "Pisau ini untuk memotong roti.", vi: "Con dao này dùng để cắt bánh mì." } }

  - title: { en: "Sequence, example, summary", uk: "Послідовність, приклад, підсумок", es: "Secuencia, ejemplo, resumen", pt: "Sequência, exemplo, resumo", fr: "Succession, exemple, résumé", de: "Reihenfolge, Beispiel, Zusammenfassung", it: "Sequenza, esempio, riepilogo", pl: "Kolejność, przykład, podsumowanie", tr: "Sıra, örnek, özet", id: "Urutan, contoh, ringkasan", vi: "Trình tự, ví dụ, tóm tắt" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, linker: { alternatives: [{ term: to begin with }, { term: firstly }] }, use: { en: "opens a list of points", uk: "відкриває перелік пунктів", es: "abre una lista de puntos", pt: "abre uma lista de pontos", fr: "ouvre une liste de points", de: "eröffnet eine Aufzählung von Punkten", it: "apre un elenco di punti", pl: "otwiera listę argumentów", tr: "bir madde listesini açar", id: "membuka daftar poin", vi: "mở đầu một danh sách các ý" }, ex: [{ target: To begin with }, ", the room is too small."], tr: { uk: "По-перше, кімната надто мала.", es: "Para empezar, la habitación es demasiado pequeña.", pt: "Para começar, o quarto é pequeno demais.", fr: "Pour commencer, la pièce est trop petite.", de: "Zunächst einmal ist das Zimmer zu klein.", it: "Per cominciare, la stanza è troppo piccola.", pl: "Na początek pokój jest za mały.", tr: "Öncelikle, oda çok küçük.", id: "Pertama-tama, kamarnya terlalu kecil.", vi: "Trước hết, căn phòng quá nhỏ." } }
          - { level: B2, linker: { alternatives: [{ term: meanwhile }, { term: at the same time }] }, use: { en: "while something else happens", uk: "поки відбувається щось інше", es: "mientras ocurre otra cosa", pt: "enquanto outra coisa acontece", fr: "pendant qu’autre chose se passe", de: "während etwas anderes geschieht", it: "mentre accade un'altra cosa", pl: "gdy dzieje się coś innego", tr: "başka bir şey olurken", id: "sementara hal lain terjadi", vi: "trong lúc một việc khác diễn ra" }, ex: ["Cook the rice. ", { target: Meanwhile }, ", chop the onions."], tr: { uk: "Звари рис. Тим часом наріж цибулю.", es: "Cocina el arroz. Mientras tanto, pica las cebollas.", pt: "Cozinhe o arroz. Enquanto isso, pique as cebolas.", fr: "Fais cuire le riz. Pendant ce temps, coupe les oignons.", de: "Koch den Reis. Schneide in der Zwischenzeit die Zwiebeln.", it: "Cuoci il riso. Nel frattempo, taglia le cipolle.", pl: "Ugotuj ryż. W międzyczasie pokrój cebulę.", tr: "Pilavı pişir. Bu arada soğanları doğra.", id: "Masaklah nasinya. Sementara itu, cincanglah bawang bombainya.", vi: "Hãy nấu cơm. Trong lúc đó, hãy thái hành." } }
          - { level: B2, linker: { term: subsequently }, use: { en: "later; formal", uk: "пізніше; формальне", es: "más tarde; formal", pt: "mais tarde; formal", fr: "plus tard ; soutenu", de: "später; formell", it: "più tardi; formale", pl: "później; formalnie", tr: "daha sonra; resmî", id: "kemudian; formal", vi: "sau đó; trang trọng" }, ex: ["He joined the army and ", { target: subsequently }, " became a general."], tr: { uk: "Він вступив до армії, а згодом став генералом.", es: "Se unió al ejército y posteriormente llegó a ser general.", pt: "Ele entrou para o exército e, posteriormente, tornou-se general.", fr: "Il s’est engagé dans l’armée et est ensuite devenu général.", de: "Er trat in die Armee ein und wurde später General.", it: "Si è arruolato nell'esercito e in seguito è diventato generale.", pl: "Wstąpił do wojska, a następnie został generałem.", tr: "Orduya katıldı ve daha sonra general oldu.", id: "Dia masuk militer dan kemudian menjadi jenderal.", vi: "Ông ấy nhập ngũ và sau đó trở thành tướng." } }
          - { level: B2, linker: { alternatives: [{ term: as soon as }, { term: the moment }, { term: once }] }, use: { en: "immediately after; the present simple for the future", uk: "відразу після; Present Simple для майбутнього", es: "inmediatamente después; presente simple para el futuro", pt: "logo depois; presente simples para o futuro", fr: "tout de suite après ; présent simple pour le futur", de: "unmittelbar danach; Simple Present für die Zukunft", it: "subito dopo; present simple per il futuro", pl: "zaraz po; Present Simple dla przyszłości", tr: "hemen ardından; gelecek için Simple Present", id: "segera setelah; simple present untuk masa depan", vi: "ngay sau khi; hiện tại đơn cho tương lai" }, ex: ["I'll call you ", { target: as soon as }, " I arrive."], tr: { uk: "Я зателефоную тобі, щойно приїду.", es: "Te llamaré tan pronto como llegue.", pt: "Eu te ligo assim que chegar.", fr: "Je t’appellerai dès que j’arriverai.", de: "Ich rufe dich an, sobald ich ankomme.", it: "Ti chiamo appena arrivo.", pl: "Zadzwonię do ciebie, jak tylko dojadę.", tr: "Varır varmaz seni ararım.", id: "Saya akan meneleponmu begitu saya tiba.", vi: "Tôi sẽ gọi cho bạn ngay khi tôi đến." } }
          - { level: B2, linker: { term: by the time }, use: { en: "not later than; already done by then", uk: "не пізніше ніж; до того часу вже зроблено", es: "a más tardar; para entonces ya está hecho", pt: "o mais tardar; até então já está feito", fr: "au plus tard ; déjà fait à ce moment-là", de: "spätestens dann; bis dahin schon geschehen", it: "al più tardi; a quel punto già fatto", pl: "nie później niż; do tej pory już zrobione", tr: "en geç o zamana kadar; o zamana dek çoktan yapılmış", id: "paling lambat saat itu; pada saat itu sudah terjadi", vi: "chậm nhất là lúc đó; đến lúc đó đã xong" }, ex: [{ target: By the time }, " we arrived, the film had started."], tr: { uk: "Коли ми приїхали, фільм уже почався.", es: "Para cuando llegamos, la película ya había empezado.", pt: "Quando chegamos, o filme já tinha começado.", fr: "Quand nous sommes arrivés, le film avait déjà commencé.", de: "Als wir ankamen, hatte der Film schon begonnen.", it: "Quando siamo arrivati, il film era già iniziato.", pl: "Zanim dotarliśmy, film już się zaczął.", tr: "Biz vardığımızda film çoktan başlamıştı.", id: "Pada saat kami tiba, film itu sudah mulai.", vi: "Đến lúc chúng tôi tới nơi, bộ phim đã bắt đầu." } }
          - { level: B2, linker: { term: until }, use: { en: "up to that time", uk: "аж до того часу", es: "hasta ese momento", pt: "até aquele momento", fr: "jusqu’à ce moment-là", de: "bis zu diesem Zeitpunkt", it: "fino a quel momento", pl: "aż do tego czasu", tr: "o ana kadar", id: "sampai saat itu", vi: "cho đến lúc đó" }, ex: ["Wait here ", { target: until }, " I come back."], tr: { uk: "Чекай тут, поки я не повернуся.", es: "Espera aquí hasta que vuelva.", pt: "Espere aqui até eu voltar.", fr: "Attends ici jusqu’à ce que je revienne.", de: "Warte hier, bis ich zurückkomme.", it: "Aspetta qui finché non torno.", pl: "Poczekaj tu, aż wrócę.", tr: "Ben dönene kadar burada bekle.", id: "Tunggu di sini sampai saya kembali.", vi: "Hãy đợi ở đây cho đến khi tôi quay lại." } }
          - { level: B2, linker: { term: for instance }, use: { en: "introduces an example in a new sentence", uk: "вводить приклад у новому реченні", es: "introduce un ejemplo en una oración nueva", pt: "introduz um exemplo em uma frase nova", fr: "introduit un exemple dans une nouvelle phrase", de: "leitet ein Beispiel in einem neuen Satz ein", it: "introduce un esempio in una nuova frase", pl: "wprowadza przykład w nowym zdaniu", tr: "yeni bir cümlede örnek verir", id: "memperkenalkan contoh dalam kalimat baru", vi: "đưa ra ví dụ trong một câu mới" }, ex: ["Many cities are crowded. ", { target: For instance }, ", Tokyo has millions of commuters."], tr: { uk: "Багато міст переповнені. Наприклад, у Токіо мільйони людей щодня їздять на роботу.", es: "Muchas ciudades están abarrotadas. Por ejemplo, Tokio tiene millones de personas que viajan a diario al trabajo.", pt: "Muitas cidades são lotadas. Por exemplo, Tóquio tem milhões de pessoas que se deslocam diariamente para o trabalho.", fr: "Beaucoup de villes sont surpeuplées. Par exemple, Tokyo compte des millions de banlieusards.", de: "Viele Städte sind überfüllt. Tokio zum Beispiel hat Millionen von Pendlern.", it: "Molte città sono affollate. Per esempio, Tokyo ha milioni di pendolari.", pl: "Wiele miast jest zatłoczonych. Na przykład w Tokio są miliony osób dojeżdżających do pracy.", tr: "Pek çok şehir kalabalıktır. Örneğin Tokyo'da milyonlarca işe gidip gelen insan var.", id: "Banyak kota padat. Misalnya, Tokyo memiliki jutaan komuter.", vi: "Nhiều thành phố rất đông đúc. Chẳng hạn, Tokyo có hàng triệu người đi làm hằng ngày." } }
          - { level: B2, linker: { pattern: [such as, { slot: noun }] }, use: { en: "introduces examples inside a sentence", uk: "вводить приклади всередині речення", es: "introduce ejemplos dentro de la oración", pt: "introduz exemplos dentro da frase", fr: "introduit des exemples à l’intérieur de la phrase", de: "leitet Beispiele innerhalb eines Satzes ein", it: "introduce esempi all'interno della frase", pl: "wprowadza przykłady wewnątrz zdania", tr: "örnekleri cümlenin içinde verir", id: "memperkenalkan contoh di dalam kalimat", vi: "đưa ra ví dụ ngay trong câu" }, ex: ["I like fruit ", { target: such as }, " apples and pears."], tr: { uk: "Я люблю фрукти, як-от яблука й груші.", es: "Me gustan las frutas como las manzanas y las peras.", pt: "Eu gosto de frutas como maçãs e peras.", fr: "J’aime les fruits comme les pommes et les poires.", de: "Ich mag Obst wie Äpfel und Birnen.", it: "Mi piace la frutta come le mele e le pere.", pl: "Lubię owoce, takie jak jabłka i gruszki.", tr: "Elma ve armut gibi meyveleri severim.", id: "Saya suka buah seperti apel dan pir.", vi: "Tôi thích trái cây như táo và lê." } }
          - { level: B2, linker: { term: namely }, use: { en: "names the exact items", uk: "називає саме ці предмети", es: "nombra los elementos exactos", pt: "nomeia os itens exatos", fr: "nomme les éléments précis", de: "nennt die genauen Glieder", it: "nomina gli elementi esatti", pl: "wymienia dokładne elementy", tr: "tam olarak hangi öğeler olduğunu söyler", id: "menyebut unsur yang tepat", vi: "nêu tên chính xác các đối tượng" }, ex: ["Two students failed, ", { target: namely }, " Tom and Ana."], tr: { uk: "Двоє студентів не склали іспит, а саме Том і Ана.", es: "Dos estudiantes reprobaron, a saber, Tom y Ana.", pt: "Dois alunos foram reprovados, a saber, Tom e Ana.", fr: "Deux étudiants ont échoué, à savoir Tom et Ana.", de: "Zwei Studenten sind durchgefallen, nämlich Tom und Ana.", it: "Due studenti sono stati bocciati, ovvero Tom e Ana.", pl: "Dwóch studentów nie zdało, a mianowicie Tom i Ana.", tr: "İki öğrenci kaldı, yani Tom ile Ana.", id: "Dua mahasiswa tidak lulus, yaitu Tom dan Ana.", vi: "Hai sinh viên trượt, cụ thể là Tom và Ana." } }
          - { level: B2, linker: { term: in particular }, use: { en: "especially", uk: "особливо", es: "especialmente", pt: "especialmente", fr: "surtout", de: "besonders", it: "soprattutto", pl: "zwłaszcza", tr: "özellikle", id: "terutama", vi: "đặc biệt là" }, ex: ["I love Italian food, ", { target: in particular }, " pasta."], tr: { uk: "Я обожнюю італійську кухню, особливо пасту.", es: "Me encanta la comida italiana, en particular la pasta.", pt: "Eu adoro comida italiana, em particular massas.", fr: "J’adore la cuisine italienne, en particulier les pâtes.", de: "Ich liebe die italienische Küche, besonders Pasta.", it: "Adoro la cucina italiana, in particolare la pasta.", pl: "Uwielbiam kuchnię włoską, w szczególności makaron.", tr: "İtalyan yemeğine bayılırım, özellikle de makarnaya.", id: "Saya suka masakan Italia, terutama pasta.", vi: "Tôi rất thích món Ý, đặc biệt là mì ống." } }
          - { level: B2, linker: { alternatives: [{ term: to sum up }, { term: in conclusion }] }, use: { en: "closes a text or a talk", uk: "завершує текст або виступ", es: "cierra un texto o una charla", pt: "encerra um texto ou uma fala", fr: "clôt un texte ou un exposé", de: "schließt einen Text oder einen Vortrag ab", it: "chiude un testo o un discorso", pl: "zamyka tekst lub wystąpienie", tr: "bir metni ya da konuşmayı bitirir", id: "menutup tulisan atau pidato", vi: "kết thúc một bài viết hoặc bài nói" }, ex: [{ target: To sum up }, ", the plan is cheap and quick."], tr: { uk: "Підсумовуючи, план дешевий і швидкий.", es: "En resumen, el plan es barato y rápido.", pt: "Resumindo, o plano é barato e rápido.", fr: "En résumé, le projet est bon marché et rapide.", de: "Zusammenfassend ist der Plan günstig und schnell.", it: "In sintesi, il piano è economico e rapido.", pl: "Podsumowując, plan jest tani i szybki.", tr: "Özetle, plan ucuz ve hızlıdır.", id: "Kesimpulannya, rencana itu murah dan cepat.", vi: "Tóm lại, kế hoạch này vừa rẻ vừa nhanh." } }
          - { level: B2, linker: { term: on the whole }, use: { en: "in general", uk: "загалом", es: "en general", pt: "em geral", fr: "en général", de: "im Allgemeinen", it: "in generale", pl: "ogólnie", tr: "genel olarak", id: "secara umum", vi: "nhìn chung" }, ex: [{ target: On the whole }, ", the trip was a success."], tr: { uk: "Загалом поїздка була вдалою.", es: "En general, el viaje fue un éxito.", pt: "No geral, a viagem foi um sucesso.", fr: "Dans l’ensemble, le voyage a été une réussite.", de: "Im Großen und Ganzen war die Reise ein Erfolg.", it: "Nel complesso, il viaggio è stato un successo.", pl: "Ogólnie rzecz biorąc, podróż była udana.", tr: "Genel olarak gezi başarılı geçti.", id: "Secara keseluruhan, perjalanan itu sukses.", vi: "Nhìn chung, chuyến đi đã thành công." } }
          - { level: B2, linker: { term: in short }, use: { en: "in a few words", uk: "коротко кажучи", es: "en pocas palabras", pt: "em poucas palavras", fr: "en quelques mots", de: "in wenigen Worten", it: "in poche parole", pl: "w kilku słowach", tr: "birkaç sözcükle", id: "dalam beberapa kata", vi: "nói ngắn gọn" }, ex: [{ target: In short }, ", we need more time."], tr: { uk: "Коротко кажучи, нам потрібно більше часу.", es: "En pocas palabras, necesitamos más tiempo.", pt: "Em resumo, precisamos de mais tempo.", fr: "Bref, il nous faut plus de temps.", de: "Kurz gesagt, wir brauchen mehr Zeit.", it: "In breve, ci serve più tempo.", pl: "Krótko mówiąc, potrzebujemy więcej czasu.", tr: "Kısacası, daha fazla zamana ihtiyacımız var.", id: "Singkatnya, kita butuh lebih banyak waktu.", vi: "Nói ngắn gọn, chúng ta cần thêm thời gian." } }

  - title: { en: Position of linking adverbs, uk: "Місце сполучних прислівників", es: "Posición de los adverbios conectores", pt: "Posição dos advérbios conectivos", fr: "Place des adverbes de liaison", de: "Stellung der Konjunktionaladverbien", it: "Posizione degli avverbi connettivi", pl: "Miejsce przysłówków łączących", tr: "Bağlayıcı zarfların konumu", id: "Posisi kata keterangan penghubung", vi: "Vị trí của trạng từ nối" }
