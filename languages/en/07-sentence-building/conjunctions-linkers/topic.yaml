  - title: { en: Purpose, uk: "Мета", es: "Finalidad", pt: "Finalidade", fr: "Finalité", de: "Zweck", it: "Scopo", pl: "Cel", tr: "Amaç", id: "Tujuan", vi: "Mục đích" }
    role: own
    content:
