        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, linker: { pattern: [so, { alternatives: [{ slot: adjective }, { slot: adverb }] }, that, { slot: clause }] }, use: { en: "result of a high degree", uk: "наслідок високого ступеня", es: "resultado de un grado alto", pt: "resultado de um grau alto", fr: "résultat d’un degré élevé", de: "Folge eines hohen Grades", it: "conseguenza di un grado elevato", pl: "skutek wysokiego stopnia", tr: "yüksek derecenin sonucu", id: "akibat dari tingkat yang tinggi", vi: "kết quả của một mức độ cao" }, ex: ["The box was ", { target: so heavy that }, " I couldn't lift it."], tr: { uk: "Коробка була така важка, що я не зміг її підняти.", es: "La caja era tan pesada que no pude levantarla.", pt: "A caixa era tão pesada que eu não consegui levantá-la.", fr: "La boîte était si lourde que je n’ai pas pu la soulever.", de: "Die Kiste war so schwer, dass ich sie nicht heben konnte.", it: "La scatola era così pesante che non sono riuscito a sollevarla.", pl: "Pudło było tak ciężkie, że nie mogłem go podnieść.", tr: "Kutu o kadar ağırdı ki onu kaldıramadım.", id: "Kotak itu begitu berat sehingga saya tidak bisa mengangkatnya.", vi: "Cái hộp nặng đến mức tôi không nhấc nổi." } }
          - { level: B2, linker: { pattern: [such, { optional: a }, { slot: adjective }, { slot: noun }, that, { slot: clause }] }, use: { en: "result of a quality of a noun", uk: "наслідок якості іменника", es: "resultado de una cualidad del sustantivo", pt: "resultado de uma qualidade do substantivo", fr: "résultat d’une qualité du nom", de: "Folge einer Eigenschaft des Nomens", it: "conseguenza di una qualità del sostantivo", pl: "skutek cechy rzeczownika", tr: "ismin bir niteliğinin sonucu", id: "akibat dari sifat kata benda", vi: "kết quả của một tính chất của danh từ" }, ex: ["It was ", { target: such a long day that }, " I fell asleep at once."], tr: { uk: "Це був такий довгий день, що я одразу заснув.", es: "Fue un día tan largo que me quedé dormido enseguida.", pt: "Foi um dia tão longo que eu adormeci na hora.", fr: "Ce fut une journée si longue que je me suis endormi aussitôt.", de: "Es war ein so langer Tag, dass ich sofort eingeschlafen bin.", it: "È stata una giornata così lunga che mi sono addormentato subito.", pl: "To był tak długi dzień, że od razu zasnąłem.", tr: "O kadar uzun bir gündü ki hemen uyuyakaldım.", id: "Hari itu begitu panjang sehingga saya langsung tertidur.", vi: "Đó là một ngày dài đến mức tôi ngủ thiếp đi ngay." } }
          - { level: B2, linker: { alternatives: [{ term: therefore }, { term: consequently }] }, use: { en: "result in a new sentence; formal", uk: "наслідок у новому реченні; формальне", es: "resultado en una oración nueva; formal", pt: "resultado em uma frase nova; formal", fr: "résultat dans une nouvelle phrase ; soutenu", de: "Folge in einem neuen Satz; formell", it: "conseguenza in una nuova frase; formale", pl: "skutek w nowym zdaniu; formalne", tr: "yeni bir cümlede sonuç; resmî", id: "akibat dalam kalimat baru; formal", vi: "kết quả trong một câu mới; trang trọng" }, ex: ["The road was closed. ", { target: Therefore }, ", we took the train."], tr: { uk: "Дорогу було закрито. Тому ми поїхали потягом.", es: "La carretera estaba cerrada. Por lo tanto, tomamos el tren.", pt: "A estrada estava fechada. Portanto, pegamos o trem.", fr: "La route était fermée. Par conséquent, nous avons pris le train.", de: "Die Straße war gesperrt. Deshalb haben wir den Zug genommen.", it: "La strada era chiusa. Pertanto, abbiamo preso il treno.", pl: "Droga była zamknięta. Dlatego pojechaliśmy pociągiem.", tr: "Yol kapalıydı. Bu nedenle trene bindik.", id: "Jalan itu ditutup. Oleh karena itu, kami naik kereta.", vi: "Con đường bị đóng. Vì vậy, chúng tôi đi tàu hỏa." } }
          - { level: B2, linker: { term: as a result }, use: { en: "result of what was just said", uk: "наслідок того, що щойно сказано", es: "resultado de lo que se acaba de decir", pt: "resultado do que acabou de ser dito", fr: "résultat de ce qui vient d’être dit", de: "Folge des eben Gesagten", it: "conseguenza di quanto appena detto", pl: "skutek tego, co właśnie powiedziano", tr: "az önce söylenenin sonucu", id: "akibat dari hal yang baru disebutkan", vi: "kết quả của điều vừa nói" }, ex: ["It rained all week. ", { target: As a result }, ", the river flooded."], tr: { uk: "Цілий тиждень ішов дощ. У підсумку річка вийшла з берегів.", es: "Llovió toda la semana. Como resultado, el río se desbordó.", pt: "Choveu a semana toda. Como resultado, o rio transbordou.", fr: "Il a plu toute la semaine. En conséquence, la rivière a débordé.", de: "Es hat die ganze Woche geregnet. Infolgedessen trat der Fluss über die Ufer.", it: "Ha piovuto tutta la settimana. Di conseguenza, il fiume è esondato.", pl: "Padało przez cały tydzień. W rezultacie rzeka wystąpiła z brzegów.", tr: "Bütün hafta yağmur yağdı. Sonuç olarak nehir taştı.", id: "Hujan turun sepanjang minggu. Akibatnya, sungai meluap.", vi: "Trời mưa suốt cả tuần. Kết quả là con sông bị lũ tràn." } }
          - { level: B2, linker: { term: thus }, use: { en: "in this way, as a result; formal", uk: "таким чином, у результаті; формальне", es: "de este modo, como resultado; formal", pt: "desse modo, como resultado; formal", fr: "ainsi, en conséquence ; soutenu", de: "auf diese Weise, als Folge; formell", it: "in questo modo, di conseguenza; formale", pl: "w ten sposób, w rezultacie; formalne", tr: "bu şekilde, sonuç olarak; resmî", id: "dengan cara ini, akibatnya; formal", vi: "theo cách này, do đó; trang trọng" }, ex: ["The two firms joined. ", { target: Thus }, ", a new company was born."], tr: { uk: "Дві фірми об’єдналися. Так з’явилася нова компанія.", es: "Las dos empresas se unieron. Así nació una nueva compañía.", pt: "As duas empresas se uniram. Assim, nasceu uma nova companhia.", fr: "Les deux entreprises ont fusionné. Ainsi est née une nouvelle société.", de: "Die beiden Firmen schlossen sich zusammen. So entstand ein neues Unternehmen.", it: "Le due aziende si sono unite. Così è nata una nuova società.", pl: "Dwie firmy połączyły się. Tak powstała nowa spółka.", tr: "İki firma birleşti. Böylece yeni bir şirket doğdu.", id: "Kedua perusahaan itu bergabung. Dengan demikian, lahirlah perusahaan baru.", vi: "Hai công ty hợp nhất. Như vậy, một công ty mới ra đời." } }
          - { level: B2, linker: { term: for this reason }, use: { en: "names the earlier fact as the cause", uk: "називає попередній факт причиною", es: "nombra el hecho anterior como causa", pt: "nomeia o fato anterior como causa", fr: "désigne le fait précédent comme la cause", de: "nennt die vorherige Tatsache als Ursache", it: "indica il fatto precedente come causa", pl: "wskazuje wcześniejszy fakt jako przyczynę", tr: "önceki olguyu neden olarak gösterir", id: "menyebut fakta sebelumnya sebagai penyebab", vi: "gọi sự việc trước đó là nguyên nhân" }, ex: ["The roads were icy. ", { target: For this reason }, ", the school closed."], tr: { uk: "Дороги вкрилися кригою. З цієї причини школу закрили.", es: "Las carreteras estaban heladas. Por esta razón, la escuela cerró.", pt: "As estradas estavam congeladas. Por essa razão, a escola fechou.", fr: "Les routes étaient verglacées. Pour cette raison, l’école a fermé.", de: "Die Straßen waren vereist. Aus diesem Grund wurde die Schule geschlossen.", it: "Le strade erano ghiacciate. Per questo motivo, la scuola ha chiuso.", pl: "Drogi były oblodzone. Z tego powodu szkołę zamknięto.", tr: "Yollar buz tutmuştu. Bu nedenle okul kapandı.", id: "Jalanan licin karena es. Karena alasan ini, sekolah ditutup.", vi: "Đường bị đóng băng. Vì lý do này, trường học đóng cửa." } }

  - title: { en: Reason, uk: "Причина", es: "Razón", pt: "Razão", fr: "Raison", de: "Grund", it: "Causa", pl: "Przyczyna", tr: "Sebep", id: "Alasan", vi: "Lý do" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, linker: { alternatives: [{ term: since }, { term: as }] }, use: { en: "a reason the reader already knows; often first", uk: "причина, яку читач уже знає; часто на початку", es: "una razón que el lector ya conoce; suele ir primero", pt: "uma razão que o leitor já conhece; costuma vir primeiro", fr: "une raison que le lecteur connaît déjà ; souvent en tête", de: "ein Grund, den der Leser schon kennt; steht oft am Anfang", it: "una causa che il lettore già conosce; spesso all'inizio", pl: "przyczyna, którą czytelnik już zna; często na początku", tr: "okurun zaten bildiği bir sebep; çoğunlukla başta", id: "alasan yang sudah diketahui pembaca; sering di awal", vi: "lý do người đọc đã biết; thường đứng đầu câu" }, ex: { examples: [[{ target: Since }, " it was raining, we stayed in."], [{ target: As }, " she was tired, she went to bed."]] }, tr: { uk: { examples: ["Оскільки йшов дощ, ми залишилися вдома.", "Оскільки вона була втомлена, вона пішла спати."] }, es: { examples: ["Como llovía, nos quedamos en casa.", "Como estaba cansada, se fue a la cama."] }, pt: { examples: ["Como estava chovendo, nós ficamos em casa.", "Como ela estava cansada, foi para a cama."] }, fr: { examples: ["Comme il pleuvait, nous sommes restés à la maison.", "Puisqu’elle était fatiguée, elle est allée se coucher."] }, de: { examples: ["Da es regnete, blieben wir zu Hause.", "Da sie müde war, ging sie ins Bett."] }, it: { examples: ["Dato che pioveva, siamo rimasti a casa.", "Siccome era stanca, è andata a letto."] }, pl: { examples: ["Ponieważ padał deszcz, zostaliśmy w domu.", "Skoro była zmęczona, poszła spać."] }, tr: { examples: ["Yağmur yağdığı için evde kaldık.", "Yorgun olduğundan yatmaya gitti."] }, id: { examples: ["Karena hujan turun, kami tinggal di rumah.", "Berhubung dia lelah, dia pergi tidur."] }, vi: { examples: ["Vì trời mưa nên chúng tôi ở nhà.", "Do cô ấy mệt nên cô ấy đi ngủ."] } } }
          - { level: B2, linker: { pattern: [due to, { slot: noun }] }, use: { en: "because of; often after be", uk: "через; часто після be", es: "a causa de; suele ir después de be", pt: "por causa de; costuma vir depois de be", fr: "à cause de ; souvent après be", de: "wegen; steht oft nach be", it: "a causa di; spesso dopo be", pl: "z powodu; często po be", tr: "yüzünden; çoğunlukla be fiilinden sonra", id: "karena; sering setelah be", vi: "vì; thường đứng sau be" }, ex: ["The delay was ", { target: due to }, " heavy snow."], tr: { uk: "Затримка сталася через сильний снігопад.", es: "El retraso se debió a las fuertes nevadas.", pt: "O atraso foi devido à neve forte.", fr: "Le retard était dû à de fortes chutes de neige.", de: "Die Verspätung war auf starken Schneefall zurückzuführen.", it: "Il ritardo era dovuto a una forte nevicata.", pl: "Opóźnienie wynikało z obfitych opadów śniegu.", tr: "Gecikme yoğun kar yağışından kaynaklanıyordu.", id: "Keterlambatan itu disebabkan oleh salju lebat.", vi: "Sự chậm trễ là do tuyết rơi dày." } }
          - { level: B2, linker: { pattern: [{ alternatives: [owing to, on account of] }, { slot: noun }] }, use: { en: "because of; formal", uk: "через; формальне", es: "a causa de; formal", pt: "por causa de; formal", fr: "à cause de ; soutenu", de: "wegen; formell", it: "a causa di; formale", pl: "z powodu; formalne", tr: "yüzünden; resmî", id: "karena; formal", vi: "vì; trang trọng" }, ex: { examples: [[{ target: Owing to }, " heavy snow, the flight was cancelled."], ["He retired early ", { target: on account of }, " his health."]] }, tr: { uk: { examples: ["Через сильний снігопад рейс скасували.", "Він достроково пішов на пенсію через стан здоров’я."] }, es: { examples: ["Debido a las fuertes nevadas, el vuelo fue cancelado.", "Se jubiló pronto por motivos de salud."] }, pt: { examples: ["Devido à neve forte, o voo foi cancelado.", "Ele se aposentou cedo por motivo de saúde."] }, fr: { examples: ["En raison de fortes chutes de neige, le vol a été annulé.", "Il a pris sa retraite tôt pour des raisons de santé."] }, de: { examples: ["Aufgrund starken Schneefalls wurde der Flug gestrichen.", "Er ging aus gesundheitlichen Gründen früh in den Ruhestand."] }, it: { examples: ["A causa di una forte nevicata, il volo è stato cancellato.", "È andato in pensione presto per motivi di salute."] }, pl: { examples: ["Z powodu obfitych opadów śniegu lot odwołano.", "Przeszedł wcześnie na emeryturę ze względu na zdrowie."] }, tr: { examples: ["Yoğun kar yağışı nedeniyle uçuş iptal edildi.", "Sağlık sorunları nedeniyle erken emekli oldu."] }, id: { examples: ["Karena salju lebat, penerbangan itu dibatalkan.", "Dia pensiun lebih awal karena kesehatannya."] }, vi: { examples: ["Do tuyết rơi dày, chuyến bay bị hủy.", "Ông ấy nghỉ hưu sớm vì lý do sức khỏe."] } } }
          - { level: B2, linker: { pattern: [in view of, { slot: noun }] }, use: { en: "taking this into account", uk: "з огляду на це", es: "teniendo esto en cuenta", pt: "levando isso em conta", fr: "compte tenu de cela", de: "unter Berücksichtigung dessen", it: "tenendo conto di questo", pl: "biorąc to pod uwagę", tr: "bunu göz önünde bulundurarak", id: "dengan mempertimbangkan hal ini", vi: "xét đến điều này" }, ex: [{ target: In view of }, " the delay, we have changed the plan."], tr: { uk: "З огляду на затримку ми змінили план.", es: "En vista del retraso, hemos cambiado el plan.", pt: "Em vista do atraso, mudamos o plano.", fr: "Compte tenu du retard, nous avons changé le plan.", de: "Angesichts der Verspätung haben wir den Plan geändert.", it: "In considerazione del ritardo, abbiamo cambiato il piano.", pl: "Ze względu na opóźnienie zmieniliśmy plan.", tr: "Gecikmeyi göz önünde bulundurarak planı değiştirdik.", id: "Mengingat adanya keterlambatan, kami mengubah rencana.", vi: "Xét đến sự chậm trễ, chúng tôi đã đổi kế hoạch." } }
          - { level: B2, linker: { pattern: [{ alternatives: [given that, seeing that] }, { slot: clause }] }, use: { en: "since this is a known fact", uk: "оскільки це відомий факт", es: "puesto que esto es un hecho conocido", pt: "já que isso é um fato conhecido", fr: "puisque c’est un fait connu", de: "da dies eine bekannte Tatsache ist", it: "dato che è un fatto noto", pl: "skoro jest to znany fakt", tr: "bu bilinen bir olgu olduğundan", id: "karena ini fakta yang sudah diketahui", vi: "vì đây là một sự thật đã biết" }, ex: [{ target: Given that }, " prices are rising, we should buy now."], tr: { uk: "Зважаючи на те, що ціни зростають, нам слід купити зараз.", es: "Dado que los precios están subiendo, deberíamos comprar ahora.", pt: "Dado que os preços estão subindo, devemos comprar agora.", fr: "Étant donné que les prix augmentent, nous devrions acheter maintenant.", de: "Da die Preise steigen, sollten wir jetzt kaufen.", it: "Dato che i prezzi stanno salendo, dovremmo comprare adesso.", pl: "Skoro ceny rosną, powinniśmy kupić teraz.", tr: "Fiyatlar arttığına göre şimdi almalıyız.", id: "Mengingat harga terus naik, kita sebaiknya membeli sekarang.", vi: "Vì giá cả đang tăng, chúng ta nên mua ngay bây giờ." } }
