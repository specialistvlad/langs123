              pl: [{ term: "however" }, " zwykle zaczyna nowe zdanie, a po nim stawia się przecinek."]
              tr: [{ term: "however" }, " genellikle yeni bir cümleyi başlatır ve ardından virgül gelir."]
              id: [{ term: "however" }, " biasanya membuka kalimat baru dan diikuti koma."]
              vi: [{ term: "however" }, " thường mở đầu một câu mới và theo sau là dấu phẩy."]
