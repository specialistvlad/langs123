            ex: ["I read ", { target: while }, " I eat."]
            tr: { uk: "Я читаю, поки їм.", es: "Leo mientras como.", pt: "Eu leio enquanto como.", fr: "Je lis pendant que je mange.", de: "Ich lese, während ich esse.", it: "Leggo mentre mangio.", pl: "Czytam, kiedy jem.", tr: "Yemek yerken kitap okurum.", id: "Saya membaca sambil makan.", vi: "Tôi vừa đọc sách vừa ăn." }

  - title: { en: Contrast and concession, uk: "Протиставлення й допустовість", es: "Contraste y concesión", pt: "Contraste e concessão", fr: "Opposition et concession", de: "Gegensatz und Konzession", it: "Contrasto e concessione", pl: "Przeciwstawienie i przyzwolenie", tr: "Karşıtlık ve ödün", id: "Pertentangan dan konsesi", vi: "Đối lập và nhượng bộ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, linker: { term: though }, use: { en: "like although; also at the end of a sentence, informal", uk: "як although; також у кінці речення, неформальне", es: "como although; también al final de la oración, informal", pt: "como although; também no fim da frase, informal", fr: "comme although ; aussi en fin de phrase, familier", de: "wie although; auch am Satzende, informell", it: "come although; anche a fine frase, informale", pl: "jak although; także na końcu zdania, nieformalne", tr: "although gibi; cümle sonunda da kullanılır, gayriresmî", id: "seperti although; juga di akhir kalimat, informal", vi: "giống although; cũng đứng cuối câu, thân mật" }, ex: { examples: [[{ target: Though }, " it was late, we kept walking."], ["The food was good. The service was slow, ", { target: though }, "."]] }, tr: { uk: { examples: ["Хоча було пізно, ми й далі йшли.", "Їжа була смачна. Обслуговування, щоправда, було повільне."] }, es: { examples: ["Aunque era tarde, seguimos caminando.", "La comida estaba buena. El servicio fue lento, eso sí."] }, pt: { examples: ["Embora fosse tarde, continuamos andando.", "A comida estava boa. O serviço foi lento, porém."] }, fr: { examples: ["Même s’il était tard, nous avons continué à marcher.", "La nourriture était bonne. Le service était lent, par contre."] }, de: { examples: ["Obwohl es spät war, gingen wir weiter.", "Das Essen war gut. Der Service war allerdings langsam."] }, it: { examples: ["Anche se era tardi, abbiamo continuato a camminare.", "Il cibo era buono. Il servizio era lento, però."] }, pl: { examples: ["Chociaż było późno, szliśmy dalej.", "Jedzenie było dobre. Obsługa była jednak wolna."] }, tr: { examples: ["Geç olmasına rağmen yürümeye devam ettik.", "Yemek güzeldi. Servis yavaştı ama."] }, id: { examples: ["Meskipun sudah larut, kami terus berjalan.", "Makanannya enak. Pelayanannya lambat, sih."] }, vi: { examples: ["Dù đã muộn, chúng tôi vẫn tiếp tục đi bộ.", "Đồ ăn ngon. Phục vụ thì chậm, tuy vậy."] } } }
          - { level: B2, linker: { pattern: [{ alternatives: [despite, in spite of] }, { alternatives: [{ slot: noun }, { slot: V-ing }] }] }, use: { en: "contrast with a noun or an -ing form", uk: "протиставлення з іменником або формою на -ing", es: "contraste con un sustantivo o una forma en -ing", pt: "contraste com um substantivo ou uma forma em -ing", fr: "opposition avec un nom ou une forme en -ing", de: "Gegensatz mit einem Nomen oder einer -ing-Form", it: "contrasto con un sostantivo o una forma in -ing", pl: "przeciwstawienie z rzeczownikiem lub formą z -ing", tr: "isim veya -ing biçimiyle karşıtlık", id: "pertentangan dengan kata benda atau bentuk -ing", vi: "đối lập với một danh từ hoặc một dạng -ing" }, ex: { examples: [[{ target: Despite }, " the rain, we went out."], ["She came ", { target: in spite of }, " feeling ill."]] }, tr: { uk: { examples: ["Незважаючи на дощ, ми вийшли.", "Вона прийшла, хоча почувалася хворою."] }, es: { examples: ["A pesar de la lluvia, salimos.", "Vino a pesar de sentirse mal."] }, pt: { examples: ["Apesar da chuva, nós saímos.", "Ela veio apesar de se sentir mal."] }, fr: { examples: ["Malgré la pluie, nous sommes sortis.", "Elle est venue, bien qu’elle se sente mal."] }, de: { examples: ["Trotz des Regens sind wir ausgegangen.", "Sie kam, obwohl sie sich krank fühlte."] }, it: { examples: ["Nonostante la pioggia, siamo usciti.", "È venuta nonostante si sentisse male."] }, pl: { examples: ["Mimo deszczu wyszliśmy.", "Przyszła, mimo że źle się czuła."] }, tr: { examples: ["Yağmura rağmen dışarı çıktık.", "Kendini hasta hissetmesine rağmen geldi."] }, id: { examples: ["Meskipun hujan, kami tetap keluar.", "Dia datang walaupun merasa tidak enak badan."] }, vi: { examples: ["Bất chấp trời mưa, chúng tôi vẫn ra ngoài.", "Cô ấy vẫn đến dù thấy không khỏe."] } } }
          - { level: B2, linker: { pattern: [{ alternatives: [despite, in spite of] }, the fact that, { slot: clause }] }, use: { en: "contrast with a clause", uk: "протиставлення з реченням", es: "contraste con una oración", pt: "contraste com uma oração", fr: "opposition avec une proposition", de: "Gegensatz mit einem Teilsatz", it: "contrasto con una proposizione", pl: "przeciwstawienie ze zdaniem", tr: "bir cümleyle karşıtlık", id: "pertentangan dengan klausa", vi: "đối lập với một mệnh đề" }, ex: ["We went out ", { target: despite the fact that }, " it was raining."], tr: { uk: "Ми вийшли, незважаючи на те, що йшов дощ.", es: "Salimos a pesar de que llovía.", pt: "Nós saímos apesar de estar chovendo.", fr: "Nous sommes sortis malgré le fait qu’il pleuvait.", de: "Wir sind ausgegangen, obwohl es regnete.", it: "Siamo usciti nonostante piovesse.", pl: "Wyszliśmy mimo tego, że padał deszcz.", tr: "Yağmur yağıyor olmasına rağmen dışarı çıktık.", id: "Kami keluar meskipun hujan sedang turun.", vi: "Chúng tôi ra ngoài mặc dù trời đang mưa." } }
          - { level: B2, linker: { term: whereas }, use: { en: "contrasts two facts; formal", uk: "протиставляє два факти; формальне", es: "contrasta dos hechos; formal", pt: "contrasta dois fatos; formal", fr: "oppose deux faits ; soutenu", de: "stellt zwei Tatsachen gegenüber; formell", it: "contrappone due fatti; formale", pl: "przeciwstawia dwa fakty; formalne", tr: "iki olguyu karşılaştırır; resmî", id: "mempertentangkan dua fakta; formal", vi: "đối chiếu hai sự việc; trang trọng" }, ex: ["Tom likes hiking, ", { target: whereas }, " his brother prefers swimming."], tr: { uk: "Том любить походи, тоді як його брат віддає перевагу плаванню.", es: "A Tom le gusta el senderismo, mientras que su hermano prefiere la natación.", pt: "O Tom gosta de fazer trilha, ao passo que o irmão dele prefere nadar.", fr: "Tom aime la randonnée, alors que son frère préfère la natation.", de: "Tom wandert gern, wohingegen sein Bruder lieber schwimmt.", it: "A Tom piace fare escursioni, mentre suo fratello preferisce nuotare.", pl: "Tom lubi wędrówki, podczas gdy jego brat woli pływanie.", tr: "Tom yürüyüş yapmayı sever, oysa kardeşi yüzmeyi tercih eder.", id: "Tom suka mendaki, sedangkan saudara laki-lakinya lebih suka berenang.", vi: "Tom thích đi bộ đường dài, trong khi anh trai anh ấy thích bơi lội hơn." } }
          - { level: B2, linker: { alternatives: [{ term: nevertheless }, { term: nonetheless }] }, use: { en: "contrast with the sentence before; formal", uk: "протиставлення до попереднього речення; формальне", es: "contraste con la oración anterior; formal", pt: "contraste com a frase anterior; formal", fr: "opposition avec la phrase précédente ; soutenu", de: "Gegensatz zum vorigen Satz; formell", it: "contrasto con la frase precedente; formale", pl: "przeciwstawienie do poprzedniego zdania; formalne", tr: "önceki cümleyle karşıtlık; resmî", id: "pertentangan dengan kalimat sebelumnya; formal", vi: "đối lập với câu trước; trang trọng" }, ex: ["The road was closed. ", { target: Nevertheless }, ", we arrived on time."], tr: { uk: "Дорогу було закрито. Утім ми приїхали вчасно.", es: "La carretera estaba cerrada. No obstante, llegamos a tiempo.", pt: "A estrada estava fechada. Mesmo assim, chegamos a tempo.", fr: "La route était fermée. Néanmoins, nous sommes arrivés à l’heure.", de: "Die Straße war gesperrt. Dennoch sind wir pünktlich angekommen.", it: "La strada era chiusa. Ciononostante, siamo arrivati in orario.", pl: "Droga była zamknięta. Niemniej jednak dotarliśmy na czas.", tr: "Yol kapalıydı. Yine de zamanında vardık.", id: "Jalan itu ditutup. Meskipun demikian, kami tiba tepat waktu.", vi: "Con đường bị đóng. Dù vậy, chúng tôi vẫn đến đúng giờ." } }
          - { level: B2, linker: { alternatives: [{ term: even so }, { term: still }] }, use: { en: "in spite of that; a short comment", uk: "попри це; короткий коментар", es: "a pesar de eso; un comentario breve", pt: "apesar disso; um comentário breve", fr: "malgré cela ; un bref commentaire", de: "trotzdem; ein kurzer Kommentar", it: "nonostante ciò; un breve commento", pl: "mimo to; krótki komentarz", tr: "buna rağmen; kısa bir yorum", id: "meskipun begitu; komentar singkat", vi: "dù vậy; một nhận xét ngắn" }, ex: { examples: [["It was cheap. ", { target: Even so }, ", I didn't buy it."], ["It's late. ", { target: Still }, ", we could try."]] }, tr: { uk: { examples: ["Було дешево. І все ж я цього не купив.", "Уже пізно. Все ж таки можна спробувати."] }, es: { examples: ["Era barato. Aun así, no lo compré.", "Es tarde. De todos modos, podríamos intentarlo."] }, pt: { examples: ["Era barato. Mesmo assim, não comprei.", "Está tarde. Ainda assim, podemos tentar."] }, fr: { examples: ["C’était bon marché. Malgré tout, je ne l’ai pas acheté.", "Il est tard. Quand même, on pourrait essayer."] }, de: { examples: ["Es war billig. Trotzdem habe ich es nicht gekauft.", "Es ist spät. Dennoch könnten wir es versuchen."] }, it: { examples: ["Costava poco. Ciò nonostante, non l'ho comprato.", "È tardi. Comunque, potremmo provare."] }, pl: { examples: ["Było tanie. Mimo to tego nie kupiłem.", "Jest późno. A jednak możemy spróbować."] }, tr: { examples: ["Ucuzdu. Buna rağmen almadım.", "Geç oldu. Yine de deneyebiliriz."] }, id: { examples: ["Harganya murah. Meskipun begitu, saya tidak membelinya.", "Sudah malam. Tetap saja, kita bisa mencoba."] }, vi: { examples: ["Nó rẻ. Dù vậy, tôi vẫn không mua.", "Đã muộn rồi. Dù sao, chúng ta cũng có thể thử."] } } }
          - { level: B2, linker: { term: yet }, use: { en: "but, with a note of surprise", uk: "але, із відтінком здивування", es: "pero, con un matiz de sorpresa", pt: "mas, com um tom de surpresa", fr: "mais, avec une nuance de surprise", de: "aber, mit einem Hauch von Überraschung", it: "ma, con una nota di sorpresa", pl: "ale, z nutą zaskoczenia", tr: "ama, şaşkınlık tonuyla", id: "tetapi, dengan nuansa keheranan", vi: "nhưng, kèm sắc thái ngạc nhiên" }, ex: ["She is rich, ", { target: yet }, " she is unhappy."], tr: { uk: "Вона багата, і все ж нещасна.", es: "Es rica y, aun así, es infeliz.", pt: "Ela é rica, mas mesmo assim é infeliz.", fr: "Elle est riche, et pourtant elle est malheureuse.", de: "Sie ist reich und doch unglücklich.", it: "È ricca, eppure è infelice.", pl: "Jest bogata, a jednak nieszczęśliwa.", tr: "Zengin, yine de mutsuz.", id: "Dia kaya, namun dia tidak bahagia.", vi: "Cô ấy giàu có, vậy mà lại không hạnh phúc." } }
          - { level: B2, linker: { alternatives: [{ term: on the other hand }, { term: in contrast }] }, use: { en: "gives the opposite side or a different case", uk: "дає протилежний бік або інший випадок", es: "presenta el lado opuesto o un caso distinto", pt: "apresenta o lado oposto ou um caso diferente", fr: "donne l’autre côté ou un cas différent", de: "zeigt die Gegenseite oder einen anderen Fall", it: "presenta il lato opposto o un caso diverso", pl: "podaje drugą stronę lub inny przypadek", tr: "karşı yanı ya da farklı bir durumu verir", id: "memberi sisi yang berlawanan atau kasus yang berbeda", vi: "đưa ra mặt đối lập hoặc một trường hợp khác" }, ex: { examples: [["Cars are fast. ", { target: On the other hand }, ", they pollute."], ["Last year was dry. ", { target: In contrast }, ", this year has been wet."]] }, tr: { uk: { examples: ["Автомобілі швидкі. З іншого боку, вони забруднюють довкілля.", "Минулий рік був сухим. Натомість цей рік був вологим."] }, es: { examples: ["Los autos son rápidos. Por otro lado, contaminan.", "El año pasado fue seco. En cambio, este año ha sido lluvioso."] }, pt: { examples: ["Os carros são rápidos. Por outro lado, poluem.", "O ano passado foi seco. Em contraste, este ano tem sido chuvoso."] }, fr: { examples: ["Les voitures sont rapides. D’un autre côté, elles polluent.", "L’année dernière a été sèche. En revanche, cette année a été pluvieuse."] }, de: { examples: ["Autos sind schnell. Andererseits verschmutzen sie die Umwelt.", "Letztes Jahr war trocken. Im Gegensatz dazu war dieses Jahr nass."] }, it: { examples: ["Le auto sono veloci. D'altra parte, inquinano.", "L'anno scorso è stato secco. Per contro, quest'anno è stato piovoso."] }, pl: { examples: ["Samochody są szybkie. Z drugiej strony zanieczyszczają środowisko.", "Zeszły rok był suchy. Natomiast ten rok jest mokry."] }, tr: { examples: ["Arabalar hızlıdır. Öte yandan çevreyi kirletirler.", "Geçen yıl kurak geçti. Buna karşılık bu yıl yağışlı geçti."] }, id: { examples: ["Mobil itu cepat. Di sisi lain, mobil mencemari lingkungan.", "Tahun lalu kering. Sebaliknya, tahun ini basah."] }, vi: { examples: ["Ô tô chạy nhanh. Mặt khác, chúng gây ô nhiễm.", "Năm ngoái khô hạn. Ngược lại, năm nay lại nhiều mưa."] } } }
          - { level: B2, linker: { term: on the contrary }, use: { en: "rejects the sentence before", uk: "відкидає попереднє речення", es: "rechaza la oración anterior", pt: "rejeita a frase anterior", fr: "rejette la phrase précédente", de: "weist den vorigen Satz zurück", it: "respinge la frase precedente", pl: "odrzuca poprzednie zdanie", tr: "önceki cümleyi reddeder", id: "menolak kalimat sebelumnya", vi: "bác bỏ câu trước" }, ex: ["It wasn't boring. ", { target: On the contrary }, ", it was fascinating."], tr: { uk: "Було не нудно. Навпаки, було захопливо.", es: "No fue aburrido. Al contrario, fue fascinante.", pt: "Não foi chato. Pelo contrário, foi fascinante.", fr: "Ce n’était pas ennuyeux. Au contraire, c’était fascinant.", de: "Es war nicht langweilig. Im Gegenteil, es war faszinierend.", it: "Non è stato noioso. Al contrario, è stato affascinante.", pl: "Nie było nudno. Wręcz przeciwnie, było fascynujące.", tr: "Sıkıcı değildi. Tam tersine, büyüleyiciydi.", id: "Itu tidak membosankan. Justru sebaliknya, itu sangat memukau.", vi: "Nó không hề chán. Trái lại, nó rất hấp dẫn." } }

  - title: { en: Result, uk: "Наслідок", es: "Resultado", pt: "Resultado", fr: "Résultat", de: "Folge", it: "Conseguenza", pl: "Skutek", tr: "Sonuç", id: "Akibat", vi: "Kết quả" }
    role: own
    content:
