title: { en: Conjunctions and Linkers, uk: Сполучники та слова-зв’язки, es: Conjunciones y conectores, pt: "Conjunções e conectivos", fr: "Conjonctions et connecteurs", de: "Konjunktionen und Bindewörter", it: "Congiunzioni e connettivi", pl: "Spójniki i słowa łączące", tr: "Bağlaçlar ve bağlayıcılar", id: "Konjungsi dan kata penghubung", vi: "Liên từ và từ nối" }
summary:
  lead:
    en: ["Linkers join ideas: ", { term: and }, " adds, ", { term: but }, " contrasts, ", { term: or }, " offers a choice, ", { term: because }, " gives a reason and ", { term: so }, " gives a result."]
    uk: ["Слова-зв’язки поєднують думки: ", { term: and }, " додає, ", { term: but }, " протиставляє, ", { term: or }, " дає вибір, ", { term: because }, " називає причину, а ", { term: so }, " — наслідок."]
    es: ["Los conectores unen ideas: ", { term: and }, " suma, ", { term: but }, " contrasta, ", { term: or }, " ofrece una opción, ", { term: because }, " da una razón y ", { term: so }, " da un resultado."]
    pt: ["Os conectivos unem ideias: ", { term: "and" }, " soma, ", { term: "but" }, " contrasta, ", { term: "or" }, " oferece uma opção, ", { term: "because" }, " dá uma razão e ", { term: "so" }, " dá um resultado."]
