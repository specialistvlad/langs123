          - { level: B2, linker: { alternatives: [{ term: moreover }, { term: furthermore }] }, use: { en: "adds a stronger point; formal writing", uk: "додає сильніший аргумент; формальне письмо", es: "añade un argumento más fuerte; escritura formal", pt: "acrescenta um argumento mais forte; escrita formal", fr: "ajoute un argument plus fort ; écrit soutenu", de: "fügt ein stärkeres Argument hinzu; formelles Schreiben", it: "aggiunge un argomento più forte; scrittura formale", pl: "dodaje mocniejszy argument; pismo formalne", tr: "daha güçlü bir argüman ekler; resmî yazı", id: "menambahkan poin yang lebih kuat; tulisan formal", vi: "thêm một ý mạnh hơn; văn viết trang trọng" }, ex: ["The plan is cheap. ", { target: Moreover }, ", it is quick."], tr: { uk: "План дешевий. Більше того, він швидкий.", es: "El plan es barato. Además, es rápido.", pt: "O plano é barato. Além disso, é rápido.", fr: "Le projet est bon marché. De plus, il est rapide.", de: "Der Plan ist günstig. Außerdem ist er schnell.", it: "Il piano è economico. Inoltre, è rapido.", pl: "Plan jest tani. Ponadto jest szybki.", tr: "Plan ucuz. Dahası, hızlı da.", id: "Rencana itu murah. Lagi pula, rencana itu cepat.", vi: "Kế hoạch này rẻ. Hơn nữa, nó còn nhanh." } }
          - { level: B2, linker: { term: besides }, use: { en: "adds a further reason; informal", uk: "додає ще одну причину; неформальне", es: "añade otra razón; informal", pt: "acrescenta outra razão; informal", fr: "ajoute une raison de plus ; familier", de: "fügt einen weiteren Grund hinzu; informell", it: "aggiunge un'altra ragione; informale", pl: "dodaje kolejny powód; nieformalne", tr: "bir sebep daha ekler; gayriresmî", id: "menambahkan alasan lain; informal", vi: "thêm một lý do nữa; thân mật" }, ex: ["I don't want to go. ", { target: Besides }, ", it's too late."], tr: { uk: "Я не хочу йти. До того ж уже пізно.", es: "No quiero ir. Además, ya es demasiado tarde.", pt: "Não quero ir. Além do mais, já é tarde demais.", fr: "Je n’ai pas envie d’y aller. En plus, il est trop tard.", de: "Ich will nicht hingehen. Außerdem ist es zu spät.", it: "Non voglio andare. Inoltre, è troppo tardi.", pl: "Nie chcę iść. Poza tym jest za późno.", tr: "Gitmek istemiyorum. Zaten çok geç oldu.", id: "Saya tidak mau pergi. Lagi pula, sudah terlalu malam.", vi: "Tôi không muốn đi. Vả lại, đã quá muộn rồi." } }
          - { level: B2, linker: { term: what is more }, use: { en: "adds a surprising extra point", uk: "додає несподівану додаткову деталь", es: "añade un dato extra sorprendente", pt: "acrescenta um dado extra surpreendente", fr: "ajoute un élément supplémentaire surprenant", de: "fügt einen überraschenden weiteren Punkt hinzu", it: "aggiunge un dato in più sorprendente", pl: "dodaje zaskakujący dodatkowy argument", tr: "şaşırtıcı bir ek bilgi ekler", id: "menambahkan poin tambahan yang mengejutkan", vi: "thêm một ý bổ sung gây bất ngờ" }, ex: ["He won the race. ", { target: What is more }, ", he broke the record."], tr: { uk: "Він виграв забіг. Мало того, він побив рекорд.", es: "Ganó la carrera. Es más, batió el récord.", pt: "Ele ganhou a corrida. E mais: ele bateu o recorde.", fr: "Il a gagné la course. Qui plus est, il a battu le record.", de: "Er hat das Rennen gewonnen. Mehr noch, er hat den Rekord gebrochen.", it: "Ha vinto la gara. Per di più, ha battuto il record.", pl: "Wygrał wyścig. Co więcej, pobił rekord.", tr: "Yarışı kazandı. Üstelik rekoru da kırdı.", id: "Dia memenangkan lomba itu. Terlebih lagi, dia memecahkan rekor.", vi: "Anh ấy thắng cuộc đua. Hơn thế nữa, anh ấy còn phá kỷ lục." } }
          - { level: B2, linker: { pattern: [apart from, { alternatives: [{ slot: noun }, { slot: V-ing }] }] }, use: { en: "except for, or in addition to", uk: "крім; або на додачу до", es: "excepto, o además de", pt: "exceto, ou além de", fr: "sauf, ou en plus de", de: "außer, oder zusätzlich zu", it: "tranne, oppure oltre a", pl: "z wyjątkiem lub oprócz", tr: "dışında ya da ayrıca", id: "kecuali, atau selain", vi: "ngoại trừ, hoặc ngoài ... ra" }, ex: { examples: [[{ target: Apart from }, " Tom, everyone came."], [{ target: Apart from }, " being cheap, it is quick."]] }, tr: { uk: { examples: ["Крім Тома, прийшли всі.", "Окрім того що воно дешеве, воно ще й швидке."] }, es: { examples: ["Aparte de Tom, todos vinieron.", "Además de ser barato, es rápido."] }, pt: { examples: ["Exceto o Tom, todos vieram.", "Além de ser barato, é rápido."] }, fr: { examples: ["À part Tom, tout le monde est venu.", "En plus d’être bon marché, il est rapide."] }, de: { examples: ["Außer Tom sind alle gekommen.", "Abgesehen davon, dass es günstig ist, ist es auch schnell."] }, it: { examples: ["Tranne Tom, sono venuti tutti.", "Oltre a essere economico, è rapido."] }, pl: { examples: ["Oprócz Toma przyszli wszyscy.", "Oprócz tego, że jest tani, jest też szybki."] }, tr: { examples: ["Tom dışında herkes geldi.", "Ucuz olmasının yanı sıra hızlı da."] }, id: { examples: ["Kecuali Tom, semua orang datang.", "Selain murah, ini juga cepat."] }, vi: { examples: ["Ngoài Tom ra, mọi người đều đến.", "Ngoài việc rẻ ra, nó còn nhanh."] } } }
          - { level: B2, linker: { term: ["not only ", { gap: true }, " but also"] }, use: { en: "adds a second point of equal weight", uk: "додає другу думку такої самої ваги", es: "añade un segundo punto de igual peso", pt: "acrescenta um segundo ponto de igual peso", fr: "ajoute un second point de même poids", de: "fügt einen zweiten gleichwertigen Punkt hinzu", it: "aggiunge un secondo punto di pari peso", pl: "dodaje drugą, równie ważną myśl", tr: "eşit ağırlıkta ikinci bir düşünce ekler", id: "menambahkan poin kedua yang sama pentingnya", vi: "thêm ý thứ hai có sức nặng ngang bằng" }, ex: ["She is ", { target: not only }, " clever ", { target: but also }, " kind."], tr: { uk: "Вона не лише розумна, а й добра.", es: "No solo es inteligente, sino también amable.", pt: "Ela não é só inteligente, mas também gentil.", fr: "Elle n’est pas seulement intelligente, mais aussi gentille.", de: "Sie ist nicht nur klug, sondern auch freundlich.", it: "Non è solo intelligente, ma anche gentile.", pl: "Jest nie tylko mądra, ale także miła.", tr: "Sadece akıllı değil, aynı zamanda naziktir.", id: "Dia tidak hanya pintar, tetapi juga baik hati.", vi: "Cô ấy không chỉ thông minh mà còn tốt bụng." } }
          - { level: B2, linker: { term: ["both ", { gap: true }, " and"] }, use: { en: "joins two items, with a plural verb", uk: "поєднує два предмети; дієслово у множині", es: "une dos elementos, con verbo en plural", pt: "une dois elementos, com verbo no plural", fr: "relie deux éléments, avec un verbe au pluriel", de: "verbindet zwei Glieder, mit einem Verb im Plural", it: "unisce due elementi, con il verbo al plurale", pl: "łączy dwa elementy, z czasownikiem w liczbie mnogiej", tr: "iki öğeyi bağlar; fiil çoğul olur", id: "menyatukan dua unsur, dengan kata kerja jamak", vi: "nối hai thành phần, với động từ ở số nhiều" }, ex: [{ target: Both }, " Ana ", { target: and }, " Luis are here."], tr: { uk: "І Ана, і Луїс тут.", es: "Tanto Ana como Luis están aquí.", pt: "Tanto Ana quanto Luis estão aqui.", fr: "Ana et Luis sont tous les deux ici.", de: "Sowohl Ana als auch Luis sind hier.", it: "Sia Ana sia Luis sono qui.", pl: "Zarówno Ana, jak i Luis są tutaj.", tr: "Hem Ana hem de Luis burada.", id: "Baik Ana maupun Luis ada di sini.", vi: "Cả Ana lẫn Luis đều ở đây." } }
          - { level: B2, linker: { term: ["either ", { gap: true }, " or"] }, use: { en: "offers one of two choices", uk: "дає один із двох варіантів", es: "ofrece una de dos opciones", pt: "oferece uma de duas opções", fr: "propose l’un des deux choix", de: "bietet eine von zwei Möglichkeiten", it: "offre una di due scelte", pl: "daje jedną z dwóch możliwości", tr: "iki seçenekten birini sunar", id: "menawarkan salah satu dari dua pilihan", vi: "đưa ra một trong hai lựa chọn" }, ex: ["You can have ", { target: either }, " tea ", { target: or }, " coffee."], tr: { uk: "Можна взяти або чай, або каву.", es: "Puedes tomar o bien té, o bien café.", pt: "Você pode tomar ou chá ou café.", fr: "Tu peux prendre soit du thé, soit du café.", de: "Du kannst entweder Tee oder Kaffee haben.", it: "Puoi prendere o il tè o il caffè.", pl: "Możesz wypić albo herbatę, albo kawę.", tr: "Ya çay ya da kahve alabilirsin.", id: "Kamu boleh minum teh atau kopi.", vi: "Bạn có thể uống trà hoặc cà phê." } }
          - { level: B2, linker: { term: ["neither ", { gap: true }, " nor"] }, use: { en: "denies both items", uk: "заперечує обидва предмети", es: "niega los dos elementos", pt: "nega os dois elementos", fr: "nie les deux éléments", de: "verneint beide Glieder", it: "nega entrambi gli elementi", pl: "zaprzecza obu elementom", tr: "her iki öğeyi de olumsuzlar", id: "menyangkal kedua unsur", vi: "phủ định cả hai thành phần" }, ex: [{ target: Neither }, " Tom ", { target: nor }, " Ana came."], tr: { uk: "Ні Том, ні Ана не прийшли.", es: "Ni Tom ni Ana vinieron.", pt: "Nem Tom nem Ana vieram.", fr: "Ni Tom ni Ana ne sont venus.", de: "Weder Tom noch Ana ist gekommen.", it: "Né Tom né Ana sono venuti.", pl: "Ani Tom, ani Ana nie przyszli.", tr: "Ne Tom ne de Ana geldi.", id: "Baik Tom maupun Ana tidak datang.", vi: "Cả Tom lẫn Ana đều không đến." } }
          - { level: B2, linker: { term: ["whether ", { gap: true }, " or"] }, use: { en: "two possibilities in an indirect question", uk: "дві можливості в непрямому питанні", es: "dos posibilidades en una pregunta indirecta", pt: "duas possibilidades em uma pergunta indireta", fr: "deux possibilités dans une question indirecte", de: "zwei Möglichkeiten in einer indirekten Frage", it: "due possibilità in una domanda indiretta", pl: "dwie możliwości w pytaniu pośrednim", tr: "dolaylı soruda iki olasılık", id: "dua kemungkinan dalam pertanyaan tak langsung", vi: "hai khả năng trong câu hỏi gián tiếp" }, ex: ["I don't know ", { target: whether }, " he will come ", { target: or }, " stay at home."], tr: { uk: "Не знаю, чи він прийде, чи залишиться вдома.", es: "No sé si vendrá o se quedará en casa.", pt: "Não sei se ele vem ou fica em casa.", fr: "Je ne sais pas s’il viendra ou s’il restera à la maison.", de: "Ich weiß nicht, ob er kommt oder zu Hause bleibt.", it: "Non so se verrà o resterà a casa.", pl: "Nie wiem, czy przyjdzie, czy zostanie w domu.", tr: "Gelecek mi yoksa evde mi kalacak, bilmiyorum.", id: "Saya tidak tahu apakah dia akan datang atau tinggal di rumah.", vi: "Tôi không biết anh ấy sẽ đến hay ở nhà." } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: [{ term: ["either ", { gap: true }, " or"] }, " and ", { term: ["neither ", { gap: true }, " nor"] }, " take the verb that agrees with the nearer subject."]
              uk: [{ term: ["either ", { gap: true }, " or"] }, " і ", { term: ["neither ", { gap: true }, " nor"] }, " вимагають дієслова, що узгоджується з ближчим підметом."]
