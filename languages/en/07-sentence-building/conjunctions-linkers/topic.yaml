          - { key: linker, label: { en: Linker, uk: "Слово-зв’язка", es: "Conector", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, linker: when, pattern: { pattern: [when, { slot: clause }] }, ex: [{ target: When }, " I get home, I cook."], tr: { uk: "Коли я приходжу додому, я готую.", es: "Cuando llego a casa, cocino.", pt: "Quando chego em casa, eu cozinho.", fr: "Quand je rentre à la maison, je cuisine.", de: "Wenn ich nach Hause komme, koche ich.", it: "Quando torno a casa, cucino.", pl: "Kiedy wracam do domu, gotuję.", tr: "Eve geldiğimde yemek yaparım.", id: "Ketika saya sampai di rumah, saya memasak.", vi: "Khi về đến nhà, tôi nấu ăn." } }
          - { level: A2, linker: before, pattern: { pattern: [before, { slot: clause }] }, ex: ["I wash my hands ", { target: before }, " I eat."], tr: { uk: "Я мию руки, перш ніж їсти.", es: "Me lavo las manos antes de comer.", pt: "Eu lavo as mãos antes de comer.", fr: "Je me lave les mains avant de manger.", de: "Ich wasche mir die Hände, bevor ich esse.", it: "Mi lavo le mani prima di mangiare.", pl: "Myję ręce, zanim zjem.", tr: "Yemek yemeden önce ellerimi yıkarım.", id: "Saya mencuci tangan sebelum makan.", vi: "Tôi rửa tay trước khi ăn." } }
          - { level: A2, linker: after, pattern: { pattern: [after, { slot: clause }] }, ex: ["We go home ", { target: after }, " the film ends."], tr: { uk: "Ми йдемо додому після того, як закінчується фільм.", es: "Nos vamos a casa después de que termina la película.", pt: "Nós vamos para casa depois que o filme termina.", fr: "Nous rentrons après la fin du film.", de: "Wir gehen nach Hause, nachdem der Film zu Ende ist.", it: "Torniamo a casa dopo che finisce il film.", pl: "Idziemy do domu po tym, jak film się skończy.", tr: "Film bittikten sonra eve gideriz.", id: "Kami pulang setelah film selesai.", vi: "Chúng tôi về nhà sau khi bộ phim kết thúc." } }
          - { level: A2, linker: then, pattern: [{ slot: clause }, ", ", { pattern: [then, { slot: clause }] }], ex: ["I had lunch, ", { target: then }, " I went home."], tr: { uk: "Я пообідав, потім пішов додому.", es: "Almorcé, luego me fui a casa.", pt: "Eu almocei, depois fui para casa.", fr: "J’ai déjeuné, puis je suis rentré à la maison.", de: "Ich habe zu Mittag gegessen, dann bin ich nach Hause gegangen.", it: "Ho pranzato, poi sono tornato a casa.", pl: "Zjadłem obiad, potem poszedłem do domu.", tr: "Öğle yemeği yedim, sonra eve gittim.", id: "Saya makan siang, lalu saya pulang.", vi: "Tôi ăn trưa, rồi tôi về nhà." } }
