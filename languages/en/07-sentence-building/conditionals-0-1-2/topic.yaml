# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.conditionals-0-1-2
lang: en
kind: grammar
tags: [conditionals, if, unless]
concepts: [conditionals]
related: [en.sentence-building.conjunctions-linkers, en.tenses.simple-tenses, en.tenses.future-forms, en.modals.would]
status: { en: draft, uk: draft, es: draft }
translated: { uk: "9802e3 5205aa 13b3a8 a67846 98347a b75e26 8edc02 52204a 090d3a 5b95bc", es: "9802e3 5205aa 13b3a8 a67846 98347a b75e26 8edc02 52204a 090d3a 5b95bc" }

title: { en: "Conditionals: Zero, First and Second", uk: "Умовні речення: нульовий, перший і другий тип", es: "Condicionales: cero, primero y segundo" }
summary:
  lead:
    en: "If-sentences for facts (zero), real possibilities (first) and imagined situations (second)."
    uk: ["Речення з ", { term: if }, " для фактів (нульовий тип), реальних можливостей (перший) і уявних ситуацій (другий)."]
    es: ["Oraciones con ", { term: if }, " para hechos (cero), posibilidades reales (primero) y situaciones imaginadas (segundo)."]
  rule:
    en: ["After ", { term: if }, " the verb is in the present simple, even for the future:"]
    uk: ["Після ", { term: if }, " дієслово стоїть у Present Simple, навіть коли йдеться про майбутнє:"]
    es: ["Después de ", { term: if }, " el verbo va en presente simple, incluso para el futuro:"]
  ex: { examples: [["If it ", { target: rains }], we'll stay in.] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A2, point: { en: "Zero: facts", uk: "Нульовий: факти", es: "Cero: hechos" }, rule: [{ pattern: [if, { slot: present }] }, ", ", { slot: present }], ex: ["If you ", { target: mix }, " blue and yellow, you ", { target: get }, " green."], tr: { uk: "Якщо змішати синій і жовтий, отримаєш зелений.", es: "Si mezclas azul y amarillo, obtienes verde." } }
        - { level: A2, point: { en: "First: real possibilities", uk: "Перший: реальні можливості", es: "Primero: posibilidades reales" }, rule: [{ pattern: [if, { slot: present }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: study }, ", you'", { target: ll pass }, "."], tr: { uk: "Якщо ти вчитимешся, то складеш іспит.", es: "Si estudias, aprobarás." } }
        - { level: B1, point: { en: "Second: unreal situations", uk: "Другий: нереальні ситуації", es: "Segundo: situaciones irreales" }, rule: [{ pattern: [if, { slot: past simple }] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If I ", { target: won }, " the lottery, I'", { target: d buy }, " a house."], tr: { uk: "Якби я виграв у лотерею, я купив би будинок.", es: "Si ganara la lotería, compraría una casa." } }
        - { level: A2, point: { en: The if-clause, uk: ["Підрядне речення з ", { term: if }], es: ["La oración con ", { term: if }] }, rule: { en: "present simple, also for the future", uk: "Present Simple, також для майбутнього", es: "presente simple, también para el futuro" }, ex: ["If it ", { target: rains }, ", we'll stay in."], tr: { uk: "Якщо піде дощ, ми залишимося вдома.", es: "Si llueve, nos quedaremos en casa." } }
        - { level: A2, point: { en: Order, uk: "Порядок", es: "Orden" }, rule: { en: "if-clause first: comma; if-clause second: no comma", uk: ["підрядне з ", { term: if }, " на початку: кома; в кінці: без коми"], es: ["la oración con ", { term: if }, " al principio: coma; al final: sin coma"] }, ex: { examples: [[{ target: If it rains }, ", we'll stay in."], ["We'll stay in ", { target: if it rains }, "."]] }, tr: { uk: { examples: ["Якщо піде дощ, ми залишимося вдома.", "Ми залишимося вдома, якщо піде дощ."] }, es: { examples: ["Si llueve, nos quedaremos en casa.", "Nos quedaremos en casa si llueve."] } } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ term: were }, " for every person, also in advice"], uk: [{ term: were }, " для всіх осіб, також у порадах"], es: [{ term: were }, " para todas las personas, también en consejos"] }, ex: ["If I ", { target: were }, " you, I'", { target: d take }, " the train."], tr: { uk: "Якби я був на твоєму місці, я поїхав би потягом.", es: "Si yo fuera tú, tomaría el tren." } }
        - { level: B1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ term: unless }, " means ", { term: ["if ", { gap: true }, " not"] }, "; the verb is affirmative"], uk: [{ term: unless }, " означає ", { term: ["if ", { gap: true }, " not"] }, "; дієслово стверджувальне"], es: [{ term: unless }, " significa ", { term: ["if ", { gap: true }, " not"] }, "; el verbo es afirmativo"] }, ex: [{ target: Unless }, " you hurry, you'll miss the bus."], tr: { uk: "Якщо не поспішиш, не встигнеш на автобус.", es: "A menos que te des prisa, perderás el autobús." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: Zero and first conditionals talk about real situations. The second talks about imagined ones.
              uk: "Нульовий і перший тип описують реальні ситуації. Другий тип описує уявні."
              es: "El condicional cero y el primero hablan de situaciones reales. El segundo habla de situaciones imaginadas."

  - title: { en: "Form: zero and first", uk: "Форма: нульовий і перший тип", es: "Forma: cero y primero" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, type: { en: Zero, uk: "Нульовий", es: "Cero" }, pattern: [{ pattern: [if, { slot: present }] }, ", ", { slot: present }], ex: ["If you ", { target: mix }, " blue and yellow, you ", { target: get }, " green."], tr: { uk: "Якщо змішати синій і жовтий, отримаєш зелений.", es: "Si mezclas azul y amarillo, obtienes verde." } }
          - { level: A2, type: { en: First, uk: "Перший", es: "Primero" }, pattern: [{ pattern: [if, { slot: present }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: study }, ", you'", { target: ll pass }, "."], tr: { uk: "Якщо ти вчитимешся, то складеш іспит.", es: "Si estudias, aprobarás." } }
          - { level: A2, type: { en: First (negative), uk: "Перший (заперечення)", es: "Primero (negación)" }, pattern: [{ pattern: [if, { alternatives: [don't, doesn't] }, { slot: V }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: don't hurry }, ", you'", { target: ll miss }, " the bus."], tr: { uk: "Якщо ти не поспішиш, то запізнишся на автобус.", es: "Si no te das prisa, perderás el autobús." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The if-clause uses the present simple, also for the future."
              uk: ["Підрядне речення з ", { term: if }, " стоїть у Present Simple, також коли йдеться про майбутнє."]
              es: ["La oración con ", { term: if }, " va en presente simple, también para el futuro."]
          - type: rule
            level: A2
            text:
              en: ["The first conditional main clause can also use ", { term: can }, ", ", { term: may }, " or an imperative:"]
              uk: ["У головному реченні першого типу можуть стояти також ", { term: can }, ", ", { term: may }, " або наказовий спосіб:"]
              es: ["La oración principal del primer condicional también puede llevar ", { term: can }, ", ", { term: may }, " o un imperativo:"]
            ex: ["If you feel ill, ", { target: call }, " me."]
            tr: { uk: "Якщо тобі стане погано, зателефонуй мені.", es: "Si te sientes mal, llámame." }

  - title: { en: "Form: second", uk: "Форма: другий тип", es: "Forma: segundo" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: B1, type: { en: Second, uk: "Другий", es: "Segundo" }, pattern: [{ pattern: [if, { slot: past simple }] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If I ", { target: won }, " the lottery, I'", { target: d buy }, " a house."], tr: { uk: "Якби я виграв у лотерею, я купив би будинок.", es: "Si ganara la lotería, compraría una casa." } }
          - { level: B1, type: { en: Second (negative), uk: "Другий (заперечення)", es: "Segundo (negación)" }, pattern: [{ pattern: [if, didn't, { slot: V }] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If I ", { target: didn't have }, " to work, I'", { target: d travel }, "."], tr: { uk: "Якби мені не треба було працювати, я б подорожував.", es: "Si no tuviera que trabajar, viajaría." } }
          - { level: B1, type: { en: ["Second with ", { term: be }], uk: ["Другий із ", { term: be }], es: ["Segundo con ", { term: be }] }, pattern: [{ pattern: [if, were] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If it ", { target: were }, " sunny, we'", { target: d go }, " out."], tr: { uk: "Якби була сонячна погода, ми б пішли гуляти.", es: "Si hiciera sol, saldríamos." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The past simple in the if-clause refers to the present or the future.
              uk: ["Past Simple у підрядному реченні з ", { term: if }, " стосується теперішнього або майбутнього."]
              es: ["El pasado simple en la oración con ", { term: if }, " se refiere al presente o al futuro."]
          - type: rule
            level: B1
            text:
              en: [{ term: were }, " works for every person: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " is common in informal speech."]
              uk: [{ term: were }, " вживається з усіма особами: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " поширене в неформальному мовленні."]
              es: [{ term: were }, " se usa con todas las personas: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " es común en el habla informal."]
          - type: rule
            level: B1
            text:
              en: ["The main clause can also use ", { term: could }, " or ", { term: might }, ":"]
              uk: ["У головному реченні можуть стояти також ", { term: could }, " або ", { term: might }, ":"]
              es: ["La oración principal también puede llevar ", { term: could }, " o ", { term: might }, ":"]
            ex: ["If I had time, I ", { target: could }, " help."]
            tr: { uk: "Якби в мене був час, я міг би допомогти.", es: "Si tuviera tiempo, podría ayudar." }

  - title: { en: Order of the clauses, uk: "Порядок частин речення", es: "Orden de las dos oraciones" }
    role: own
    content:
      - type: usage
        columns:
          - { key: order, label: { en: Order, uk: "Порядок", es: "Orden" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, order: { en: "if-clause first: comma", uk: ["підрядне з ", { term: if }, " на початку: кома"], es: ["la oración con ", { term: if }, " al principio: coma"] }, ex: [{ target: If it rains }, ", we'll stay in."], tr: { uk: "Якщо піде дощ, ми залишимося вдома.", es: "Si llueve, nos quedaremos en casa." } }
          - { level: A2, order: { en: "if-clause second: no comma", uk: ["підрядне з ", { term: if }, " в кінці: без коми"], es: ["la oración con ", { term: if }, " al final: sin coma"] }, ex: ["We'll stay in ", { target: if it rains }, "."], tr: { uk: "Ми залишимося вдома, якщо піде дощ.", es: "Nos quedaremos en casa si llueve." } }

  - title: { en: Use, uk: "Вживання", es: "Uso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A2, use: { en: Facts and general truths (zero), uk: "Факти й загальні істини (нульовий тип)", es: "Hechos y verdades generales (cero)" }, ex: ["If you ", { target: press }, " this button, the door ", { target: opens }, "."], tr: { uk: "Якщо натиснути цю кнопку, двері відчиняються.", es: "Si presionas este botón, la puerta se abre." } }
          - { level: A2, use: { en: Real possibilities in the future (first), uk: "Реальні можливості в майбутньому (перший тип)", es: "Posibilidades reales en el futuro (primero)" }, ex: ["If I ", { target: see }, " Ana, I'", { target: ll tell }, " her."], tr: { uk: "Якщо я побачу Ану, я їй скажу.", es: "Si veo a Ana, se lo diré." } }
          - { level: B1, use: { en: Unreal or unlikely situations (second), uk: "Нереальні або малоймовірні ситуації (другий тип)", es: "Situaciones irreales o poco probables (segundo)" }, ex: ["If I ", { target: were }, " a bird, I'", { target: d fly }, " to Spain."], tr: { uk: "Якби я був птахом, я полетів би до Іспанії.", es: "Si yo fuera un pájaro, volaría a España." } }
          - { level: B1, use: { en: ["Advice: ", { term: If I were you }, " (second)"], uk: ["Порада: ", { term: If I were you }, " (другий тип)"], es: ["Consejo: ", { term: If I were you }, " (segundo)"] }, ex: ["If I ", { target: were }, " you, I'", { target: d take }, " the train."], tr: { uk: "Якби я був на твоєму місці, я поїхав би потягом.", es: "Si yo fuera tú, tomaría el tren." } }

  - title: { en: Unless, uk: "Unless", es: "Unless" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: unless }, " means ", { term: ["if ", { gap: true }, " not"] }, ". It takes an affirmative verb:"]
              uk: [{ term: unless }, " означає ", { term: ["if ", { gap: true }, " not"] }, ". Дієслово після нього стверджувальне:"]
              es: [{ term: unless }, " significa ", { term: ["if ", { gap: true }, " not"] }, ". Lleva un verbo afirmativo:"]
            ex: { equivalence: [[{ target: Unless }, " you hurry, you'll miss the bus."], ["If you ", { target: don't }, " hurry, you'll miss the bus."]] }
            tr: { uk: "Якщо не поспішиш, не встигнеш на автобус.", es: "A menos que te des prisa, perderás el autobús." }
          - type: note
            level: B1
            text:
              en: [{ term: unless }, " goes with the zero and first conditionals. See ", { link: Conjunctions and Linkers, to: en.sentence-building.conjunctions-linkers }, "."]
              uk: [{ term: unless }, " вживається з нульовим і першим типом. Див. ", { link: "Сполучники та слова-зв’язки", to: en.sentence-building.conjunctions-linkers }, "."]
              es: [{ term: unless }, " se usa con el condicional cero y el primero. Ver ", { link: "Conjunciones y conectores", to: en.sentence-building.conjunctions-linkers }, "."]

  - title: { en: "Compare: first and second conditional", uk: "Порівняння: перший і другий тип", es: "Comparación: primer y segundo condicional" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: first, label: { en: First conditional, uk: "Перший тип", es: "Primer condicional" } }
          - { key: second, label: { en: Second conditional, uk: "Другий тип", es: "Segundo condicional" } }
        rows:
          - { level: B1, first: { en: "real, possible", uk: "реальна, можлива", es: "real, posible" }, second: { en: "imagined, unlikely", uk: "уявна, малоймовірна", es: "imaginada, poco probable" } }
          - { level: B1, first: { ex: ["If I ", { target: win }, ", I'", { target: ll buy }, " a car."], tr: { uk: "Якщо я виграю, я куплю машину.", es: "Si gano, compraré un auto." } }, second: { ex: ["If I ", { target: won }, ", I'", { target: d buy }, " a car."], tr: { uk: "Якби я виграв, я купив би машину.", es: "Si ganara, compraría un auto." } } }
          - { level: B1, first: { ex: ["If we ", { target: have }, " time, we'", { target: ll visit }, " you."], tr: { uk: "Якщо в нас буде час, ми тебе провідаємо.", es: "Si tenemos tiempo, te visitaremos." } }, second: { ex: ["If we ", { target: had }, " time, we'", { target: d visit }, " you."], tr: { uk: "Якби в нас був час, ми б тебе провідали.", es: "Si tuviéramos tiempo, te visitaríamos." } } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The speaker chooses by how likely the situation seems.
              uk: "Мовець обирає тип залежно від того, наскільки ймовірною здається ситуація."
              es: "El hablante elige según lo probable que parezca la situación."

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "If I am you, I would go.", right: ["If I ", { target: were }, " you, I'd go."], rule: { en: ["advice uses ", { term: If I were you }], uk: ["для порад уживають ", { term: If I were you }], es: ["los consejos usan ", { term: If I were you }] } }
          - { level: B1, wrong: "If I win the lottery, I would buy a house.", right: ["If I ", { target: won }, " the lottery, I ", { target: would }, " buy a house."], rule: { en: ["match the pair: ", { pattern: [{ slot: present }, { term: will }] }, " or ", { pattern: [{ slot: past }, { term: would }] }], uk: ["поєднуйте пару: ", { pattern: [{ slot: present }, { term: will }] }, " або ", { pattern: [{ slot: past }, { term: would }] }], es: ["combina la pareja: ", { pattern: [{ slot: present }, { term: will }] }, " o ", { pattern: [{ slot: past }, { term: would }] }] } }
          - { level: A2, wrong: If it rains we'll stay in., right: [{ target: "If it rains," }, " we'll stay in."], rule: { en: comma after an if-clause at the start, uk: ["кома після підрядного речення з ", { term: if }, " на початку"], es: ["coma después de la oración con ", { term: if }, " al principio"] } }
          - { level: B1, wrong: "Unless you don't hurry, you'll miss the bus.", right: [{ target: Unless }, " you hurry, you'll miss the bus."], rule: { en: [{ term: unless }, " already means ", { term: ["if ", { gap: true }, " not"] }], uk: [{ term: unless }, " уже означає ", { term: ["if ", { gap: true }, " not"] }], es: [{ term: unless }, " ya significa ", { term: ["if ", { gap: true }, " not"] }] } }
          - { level: A2, wrong: "If she come, I'll call you.", right: ["If she ", { target: comes }, ", I'll call you."], rule: { en: { takes: [{ alternatives: [{ term: she }, { term: he }, { term: it }] }, V-s in the if-clause] }, uk: { takes: [{ alternatives: [{ term: she }, { term: he }, { term: it }] }, ["V-s у підрядному реченні з ", { term: if }]] }, es: { takes: [{ alternatives: [{ term: she }, { term: he }, { term: it }] }, ["V-s en la oración con ", { term: if }]] } } }
          - { level: A2, speakers: [uk], wrong: "If it will rain, we'll stay in.", right: ["If it ", { target: rains }, ", we'll stay in."], rule: { uk: ["після ", { term: if }, " стоїть теперішній час: «якщо буде дощ» — це ", { term: if it rains }] } }
