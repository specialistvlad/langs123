          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: { pattern: [in the event that, { slot: clause }] }, use: { en: "if this happens; notices and contracts", uk: "якщо це станеться; оголошення та договори", es: "si esto ocurre; avisos y contratos", pt: "se isso acontecer; avisos e contratos", fr: "si cela arrive ; avis et contrats", de: "wenn dies eintritt; Hinweise und Verträge", it: "se questo accade; avvisi e contratti", pl: "jeśli to nastąpi; ogłoszenia i umowy", tr: "bu olursa; duyurular ve sözleşmeler", id: "jika hal ini terjadi; pengumuman dan kontrak", vi: "nếu điều này xảy ra; thông báo và hợp đồng" }, ex: [{ target: In the event that }, " you cannot attend, please tell us."], tr: { uk: "Якщо ви не зможете бути присутніми, будь ласка, повідомте нам.", es: "En caso de que no pueda asistir, por favor avísenos.", pt: "Caso você não possa comparecer, por favor nos avise.", fr: "Au cas où vous ne pourriez pas venir, veuillez nous en informer.", de: "Falls Sie nicht teilnehmen können, teilen Sie uns dies bitte mit.", it: "Qualora non possa partecipare, la preghiamo di informarci.", pl: "Jeśli nie będą mogli państwo uczestniczyć, prosimy o poinformowanie nas.", tr: "Katılamamanız durumunda lütfen bize bildirin.", id: "Jika Anda tidak dapat hadir, mohon beri tahu kami.", vi: "Trong trường hợp quý vị không thể tham dự, xin vui lòng báo cho chúng tôi." } }
          - { level: C2, form: { pattern: [on the proviso that, { slot: clause }] }, use: { en: "only if; a stated condition", uk: "лише якщо; чітко названа умова", es: "solo si; una condición expresa", pt: "somente se; uma condição declarada", fr: "seulement si ; une condition énoncée", de: "nur wenn; eine ausdrücklich genannte Bedingung", it: "solo se; una condizione dichiarata", pl: "tylko jeśli; wyraźnie podany warunek", tr: "ancak koşul gerçekleşirse; açıkça belirtilmiş bir koşul", id: "hanya jika; syarat yang dinyatakan", vi: "chỉ khi; một điều kiện được nêu rõ" }, ex: ["He lent the money ", { target: on the proviso that }, " it was repaid by May."], tr: { uk: "Він позичив гроші за умови, що їх повернуть до травня.", es: "Prestó el dinero con la condición de que se devolviera antes de mayo.", pt: "Ele emprestou o dinheiro com a condição de que fosse devolvido até maio.", fr: "Il a prêté l’argent à condition qu’il soit remboursé avant mai.", de: "Er lieh das Geld unter der Bedingung, dass es bis Mai zurückgezahlt wurde.", it: "Ha prestato il denaro a condizione che venisse restituito entro maggio.", pl: "Pożyczył pieniądze pod warunkiem, że zostaną zwrócone do maja.", tr: "Parayı Mayıs’a kadar geri ödenmesi koşuluyla ödünç verdi.", id: "Dia meminjamkan uang itu dengan syarat dikembalikan paling lambat bulan Mei.", vi: "Anh ấy cho vay tiền với điều kiện phải trả lại trước tháng Năm." } }
          - { level: C2, form: { pattern: [on the understanding that, { slot: clause }] }, use: { en: "if it is agreed that", uk: "якщо погоджено, що", es: "si se acuerda que", pt: "se ficar combinado que", fr: "s’il est convenu que", de: "wenn vereinbart ist, dass", it: "se si è concordato che", pl: "jeśli uzgodniono, że", tr: "şu konuda anlaşılırsa", id: "jika disepakati bahwa", vi: "nếu đã thỏa thuận rằng" }, ex: ["You may use the room ", { target: on the understanding that }, " you leave it tidy."], tr: { uk: "Ви можете користуватися кімнатою за умови, що залишите її чистою.", es: "Puede usar la sala con el entendimiento de que la deje ordenada.", pt: "Você pode usar a sala, entendendo-se que a deixará arrumada.", fr: "Vous pouvez utiliser la salle, étant entendu que vous la laisserez en ordre.", de: "Sie dürfen den Raum nutzen, mit der Maßgabe, dass Sie ihn ordentlich hinterlassen.", it: "Può usare la stanza, a patto che la lasci in ordine.", pl: "Mogą państwo korzystać z sali, przy założeniu, że zostawią ją w porządku.", tr: "Odayı derli toplu bırakmanız koşuluyla kullanabilirsiniz.", id: "Anda boleh memakai ruangan ini dengan pengertian bahwa Anda meninggalkannya dalam keadaan rapi.", vi: "Quý vị có thể sử dụng phòng với điều kiện là phải để lại phòng gọn gàng." } }
          - { level: C2, form: { pattern: [provided always that, { slot: clause }] }, use: { en: "legal: adds a limit to a rule", uk: "юридично: додає обмеження до правила", es: "jurídico: añade un límite a una regla", pt: "jurídico: acrescenta um limite a uma regra", fr: "juridique : ajoute une limite à une règle", de: "juristisch: fügt einer Regel eine Grenze hinzu", it: "giuridico: aggiunge un limite a una regola", pl: "prawniczy: dodaje ograniczenie do reguły", tr: "hukuki: bir kurala sınır ekler", id: "hukum: menambahkan batas pada suatu aturan", vi: "pháp lý: thêm một giới hạn cho quy tắc" }, ex: ["The tenant may sublet, ", { target: provided always that }, " the owner agrees in writing."], tr: { uk: "Орендар може здавати житло в піднайм, за умови, що власник письмово погодиться.", es: "El arrendatario puede subarrendar, siempre y cuando el propietario lo autorice por escrito.", pt: "O locatário pode sublocar, desde que o proprietário concorde por escrito.", fr: "Le locataire peut sous-louer, à condition que le propriétaire donne son accord par écrit.", de: "Der Mieter darf untervermieten, sofern der Eigentümer schriftlich zustimmt.", it: "L'inquilino può subaffittare, purché il proprietario acconsenta per iscritto.", pl: "Najemca może podnająć lokal, pod warunkiem że właściciel wyrazi zgodę na piśmie.", tr: "Kiracı, ev sahibinin yazılı onay vermesi koşuluyla evi alt kiraya verebilir.", id: "Penyewa boleh menyewakan kembali, dengan ketentuan pemilik menyetujuinya secara tertulis.", vi: "Người thuê có thể cho thuê lại, miễn là chủ sở hữu đồng ý bằng văn bản." } }
          - { level: C2, form: { pattern: [granted that, { slot: clause }] }, use: { en: "accepting a point before disagreeing", uk: "визнати аргумент, перш ніж заперечити", es: "aceptar un argumento antes de discrepar", pt: "aceitar um argumento antes de discordar", fr: "concéder un point avant de nuancer", de: "einen Punkt zugestehen, bevor man widerspricht", it: "ammettere un punto prima di dissentire", pl: "przyznać rację, zanim się zaprzeczy", tr: "karşı çıkmadan önce bir noktayı kabul etmek", id: "mengakui suatu hal sebelum tidak setuju", vi: "thừa nhận một điểm trước khi phản đối" }, ex: [{ target: Granted that }, " the plan is risky, it may still work."], tr: { uk: "Припустімо, що план ризикований, але він усе ж може спрацювати.", es: "Concedido que el plan es arriesgado, aun así puede funcionar.", pt: "Admitindo que o plano é arriscado, ele ainda pode funcionar.", fr: "Certes, le plan est risqué, mais il peut quand même réussir.", de: "Zugegeben, der Plan ist riskant, aber er kann trotzdem funktionieren.", it: "Ammesso che il piano sia rischioso, potrebbe comunque funzionare.", pl: "Zgoda, plan jest ryzykowny, ale mimo to może się udać.", tr: "Plan riskli olsa da yine de işe yarayabilir.", id: "Memang rencana itu berisiko, tetapi mungkin saja berhasil.", vi: "Đành là kế hoạch này nhiều rủi ro, nhưng nó vẫn có thể thành công." } }
      - type: list
