      rows:
        - { level: A2, point: { en: "Zero: facts", uk: "Нульовий: факти", es: "Cero: hechos", pt: "Zero: fatos", fr: "Type 0 : les faits", de: "Typ 0: Tatsachen", it: "Zero: fatti", pl: "Zerowy: fakty", tr: "Sıfırıncı: gerçekler", id: "Zero: fakta", vi: "Loại 0: sự thật" }, rule: [{ pattern: [if, { slot: present }] }, ", ", { slot: present }], ex: ["If you ", { target: mix }, " blue and yellow, you ", { target: get }, " green."], tr: { uk: "Якщо змішати синій і жовтий, отримаєш зелений.", es: "Si mezclas azul y amarillo, obtienes verde.", pt: "Se você mistura azul e amarelo, obtém verde.", fr: "Si on mélange du bleu et du jaune, on obtient du vert.", de: "Wenn du Blau und Gelb mischst, bekommst du Grün.", it: "Se mescoli il blu e il giallo, ottieni il verde.", pl: "Jeśli zmieszasz niebieski i żółty, otrzymasz zielony.", tr: "Maviyle sarıyı karıştırırsan yeşil elde edersin.", id: "Kalau kamu mencampur biru dan kuning, hasilnya hijau.", vi: "Nếu bạn trộn màu xanh dương với màu vàng, bạn được màu xanh lá." } }
        - { level: A2, point: { en: "First: real possibilities", uk: "Перший: реальні можливості", es: "Primero: posibilidades reales", pt: "Primeira: possibilidades reais", fr: "Type 1 : possibilités réelles", de: "Typ 1: reale Möglichkeiten", it: "Primo: possibilità reali", pl: "Pierwszy: realne możliwości", tr: "Birinci: gerçek olasılıklar", id: "First: kemungkinan nyata", vi: "Loại 1: khả năng có thật" }, rule: [{ pattern: [if, { slot: present }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: study }, ", you'", { target: ll pass }, "."], tr: { uk: "Якщо ти вчитимешся, то складеш іспит.", es: "Si estudias, aprobarás.", pt: "Se você estudar, vai passar.", fr: "Si tu étudies, tu réussiras.", de: "Wenn du lernst, wirst du bestehen.", it: "Se studi, passerai l'esame.", pl: "Jeśli będziesz się uczyć, zdasz.", tr: "Çalışırsan sınavı geçersin.", id: "Kalau kamu belajar, kamu akan lulus.", vi: "Nếu bạn học, bạn sẽ đỗ." } }
        - { level: B1, point: { en: "Second: unreal situations", uk: "Другий: нереальні ситуації", es: "Segundo: situaciones irreales", pt: "Segunda: situações irreais", fr: "Type 2 : situations irréelles", de: "Typ 2: irreale Situationen", it: "Secondo: situazioni irreali", pl: "Drugi: sytuacje nierealne", tr: "İkinci: gerçek dışı durumlar", id: "Second: situasi tidak nyata", vi: "Loại 2: tình huống không có thật" }, rule: [{ pattern: [if, { slot: past simple }] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If I ", { target: won }, " the lottery, I'", { target: d buy }, " a house."], tr: { uk: "Якби я виграв у лотерею, я купив би будинок.", es: "Si ganara la lotería, compraría una casa.", pt: "Se eu ganhasse na loteria, compraria uma casa.", fr: "Si je gagnais au loto, j’achèterais une maison.", de: "Wenn ich im Lotto gewänne, würde ich ein Haus kaufen.", it: "Se vincessi alla lotteria, comprerei una casa.", pl: "Gdybym wygrał na loterii, kupiłbym dom.", tr: "Piyangoyu kazansam bir ev alırdım.", id: "Seandainya saya menang lotre, saya akan membeli rumah.", vi: "Giá mà tôi trúng xổ số, tôi sẽ mua một căn nhà." } }
        - { level: B2, point: { en: "Third: unreal past", uk: "Третій: нереальне минуле", es: "Tercero: pasado irreal", pt: "Terceira: passado irreal", fr: "Type 3 : passé irréel", de: "Typ 3: irreale Vergangenheit", it: "Terzo: passato irreale", pl: "Trzeci: nierealna przeszłość", tr: "Üçüncü: gerçek dışı geçmiş", id: "Third: masa lalu tidak nyata", vi: "Loại 3: quá khứ không có thật" }, rule: [{ pattern: [if, had, { slot: past participle }] }, ", ", { pattern: [would have, { slot: past participle }] }], ex: ["If I ", { target: had known }, ", I ", { target: would have called }, "."], tr: { uk: "Якби я знав, я б зателефонував.", es: "Si lo hubiera sabido, habría llamado.", pt: "Se eu tivesse sabido, teria ligado.", fr: "Si j’avais su, j’aurais appelé.", de: "Wenn ich es gewusst hätte, hätte ich angerufen.", it: "Se l'avessi saputo, avrei chiamato.", pl: "Gdybym wiedział, zadzwoniłbym.", tr: "Bilseydim arardım.", id: "Seandainya saya tahu, saya pasti sudah menelepon.", vi: "Giá mà tôi đã biết, tôi đã gọi rồi." } }
        - { level: B2, point: { en: Mixed, uk: "Змішаний", es: "Mixto", pt: "Mista", fr: "Mixte", de: "Gemischt", it: "Misto", pl: "Mieszany", tr: "Karma", id: "Mixed", vi: "Hỗn hợp" }, rule: { en: "a past condition with a present result, or the reverse", uk: "минула умова з теперішнім результатом або навпаки", es: "una condición pasada con un resultado presente, o al revés", pt: "uma condição passada com resultado presente, ou o contrário", fr: "une condition passée avec un résultat présent, ou l’inverse", de: "eine vergangene Bedingung mit gegenwärtigem Ergebnis oder umgekehrt", it: "una condizione passata con un risultato presente, o il contrario", pl: "warunek przeszły ze skutkiem teraźniejszym lub odwrotnie", tr: "geçmişteki bir koşul ve şimdiki bir sonuç, ya da tersi", id: "syarat di masa lalu dengan hasil di masa kini, atau sebaliknya", vi: "điều kiện ở quá khứ với kết quả ở hiện tại, hoặc ngược lại" }, ex: ["If I ", { target: had taken }, " the job, I ", { target: would be }, " rich now."], tr: { uk: "Якби я прийняв ту роботу, зараз я був би багатим.", es: "Si hubiera aceptado el trabajo, ahora sería rico.", pt: "Se eu tivesse aceitado o emprego, hoje eu seria rico.", fr: "Si j’avais accepté ce travail, je serais riche maintenant.", de: "Wenn ich die Stelle angenommen hätte, wäre ich jetzt reich.", it: "Se avessi accettato il lavoro, ora sarei ricco.", pl: "Gdybym przyjął tę pracę, byłbym teraz bogaty.", tr: "O işi kabul etseydim şimdi zengin olurdum.", id: "Seandainya dulu saya menerima pekerjaan itu, sekarang saya sudah kaya.", vi: "Nếu tôi đã nhận công việc đó, bây giờ tôi đã giàu rồi." } }
        - { level: A2, point: { en: The if-clause, uk: ["Підрядне речення з ", { term: if }], es: ["La oración con ", { term: if }], pt: ["A oração com ", { term: "if" }], fr: ["La proposition avec ", { term: "if" }], de: ["Der ", { term: "if" }, "-Satz"], it: ["La proposizione con ", { term: "if" }], pl: ["Zdanie podrzędne z ", { term: "if" }], tr: [{ term: "if" }, " cümleciği"], id: ["Klausa ", { term: "if" }], vi: ["Mệnh đề ", { term: "if" }] }, rule: { en: "present simple, also for the future", uk: "Present Simple, також для майбутнього", es: "presente simple, también para el futuro", pt: "presente simples, também para o futuro", fr: "présent simple, aussi pour le futur", de: "Simple Present, auch für die Zukunft", it: "present simple, anche per il futuro", pl: "Present Simple, także dla przyszłości", tr: "Simple Present, gelecek için de", id: "Simple Present, juga untuk masa depan", vi: "hiện tại đơn, kể cả khi nói về tương lai" }, ex: ["If it ", { target: rains }, ", we'll stay in."], tr: { uk: "Якщо піде дощ, ми залишимося вдома.", es: "Si llueve, nos quedaremos en casa.", pt: "Se chover, vamos ficar em casa.", fr: "S’il pleut, nous resterons à la maison.", de: "Wenn es regnet, bleiben wir zu Hause.", it: "Se piove, resteremo a casa.", pl: "Jeśli będzie padać, zostaniemy w domu.", tr: "Yağmur yağarsa, evde kalırız.", id: "Kalau hujan, kami akan tinggal di rumah.", vi: "Nếu trời mưa, chúng tôi sẽ ở nhà." } }
        - { level: A2, point: { en: Order, uk: "Порядок", es: "Orden", pt: "Ordem", fr: "Ordre", de: "Reihenfolge", it: "Ordine", pl: "Kolejność", tr: "Sıra", id: "Urutan", vi: "Thứ tự" }, rule: { en: "if-clause first: comma; if-clause second: no comma", uk: ["підрядне з ", { term: if }, " на початку: кома; в кінці: без коми"], es: ["la oración con ", { term: if }, " al principio: coma; al final: sin coma"], pt: ["a oração com ", { term: "if" }, " no início: vírgula; no fim: sem vírgula"], fr: ["proposition avec ", { term: "if" }, " en premier : virgule ; en second : pas de virgule"], de: ["der ", { term: "if" }, "-Satz am Anfang: Komma; am Ende: kein Komma"], it: ["proposizione con ", { term: "if" }, " all'inizio: virgola; alla fine: senza virgola"], pl: ["zdanie z ", { term: "if" }, " na początku: przecinek; na końcu: bez przecinka"], tr: [{ term: "if" }, " cümleciği başta: virgül; sonda: virgül yok"], id: ["klausa ", { term: "if" }, " di awal: pakai koma; di akhir: tanpa koma"], vi: ["mệnh đề ", { term: "if" }, " đứng trước: có dấu phẩy; đứng sau: không có dấu phẩy"] }, ex: { examples: [[{ target: If it rains }, ", we'll stay in."], ["We'll stay in ", { target: if it rains }, "."]] }, tr: { uk: { examples: ["Якщо піде дощ, ми залишимося вдома.", "Ми залишимося вдома, якщо піде дощ."] }, es: { examples: ["Si llueve, nos quedaremos en casa.", "Nos quedaremos en casa si llueve."] }, pt: { examples: ["Se chover, vamos ficar em casa.", "Vamos ficar em casa se chover."] }, fr: { examples: ["S’il pleut, nous resterons à la maison.", "Nous resterons à la maison s’il pleut."] }, de: { examples: ["Wenn es regnet, bleiben wir zu Hause.", "Wir bleiben zu Hause, wenn es regnet."] }, it: { examples: ["Se piove, resteremo a casa.", "Resteremo a casa se piove."] }, pl: { examples: ["Jeśli będzie padać, zostaniemy w domu.", "Zostaniemy w domu, jeśli będzie padać."] }, tr: { examples: ["Yağmur yağarsa, evde kalırız.", "Evde kalırız yağmur yağarsa."] }, id: { examples: ["Kalau hujan, kami akan tinggal di rumah.", "Kami akan tinggal di rumah kalau hujan."] }, vi: { examples: ["Nếu trời mưa, chúng tôi sẽ ở nhà.", "Chúng tôi sẽ ở nhà nếu trời mưa."] } } }
