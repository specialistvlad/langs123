n, kami akan tinggal di rumah.", "Kami akan tinggal di rumah kalau hujan."] }, vi: { examples: ["Nếu trời mưa, chúng tôi sẽ ở nhà.", "Chúng tôi sẽ ở nhà nếu trời mưa."] } } }
