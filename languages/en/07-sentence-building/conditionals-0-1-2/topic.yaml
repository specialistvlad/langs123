          - { level: B1, first: { ex: ["If we ", { target: have }, " time, we'", { target: ll visit }, " you."], tr: { uk: "Якщо в нас буде час, ми тебе провідаємо.", es: "Si tenemos tiempo, te visitaremos.", pt: "Se tivermos tempo, vamos visitar você.", fr: "Si nous avons le temps, nous te rendrons visite.", de: "Wenn wir Zeit haben, besuchen wir dich.", it: "Se abbiamo tempo, verremo a trovarti.", pl: "Jeśli będziemy mieć czas, odwiedzimy cię.", tr: "Zamanımız olursa seni ziyaret ederiz.", id: "Kalau kami punya waktu, kami akan mengunjungimu.", vi: "Nếu chúng tôi có thời gian, chúng tôi sẽ đến thăm bạn." } }, second: { ex: ["If we ", { target: had }, " time, we'", { target: d visit }, " you."], tr: { uk: "Якби в нас був час, ми б тебе провідали.", es: "Si tuviéramos tiempo, te visitaríamos.", pt: "Se tivéssemos tempo, visitaríamos você.", fr: "Si nous avions le temps, nous te rendrions visite.", de: "Wenn wir Zeit hätten, würden wir dich besuchen.", it: "Se avessimo tempo, verremmo a trovarti.", pl: "Gdybyśmy mieli czas, odwiedzilibyśmy cię.", tr: "Zamanımız olsa seni ziyaret ederdik.", id: "Seandainya kami punya waktu, kami akan mengunjungimu.", vi: "Giá mà chúng tôi có thời gian, chúng tôi sẽ đến thăm bạn." } } }
      - type: list
