        rows:
          - { level: B2, type: { en: "Past condition, present result", uk: "Минула умова, теперішній результат", es: "Condición pasada, resultado presente", pt: "Condição passada, resultado presente", fr: "Condition passée, résultat présent", de: "Vergangene Bedingung, gegenwärtiges Ergebnis", it: "Condizione passata, risultato presente", pl: "Warunek przeszły, skutek teraźniejszy", tr: "Geçmişte koşul, şimdi sonuç", id: "Syarat masa lalu, hasil masa kini", vi: "Điều kiện ở quá khứ, kết quả ở hiện tại" }, pattern: [{ pattern: [if, had, { slot: past participle }] }, ", ", { pattern: [would, { slot: V }] }], ex: ["If I ", { target: had taken }, " the job, I ", { target: would be }, " rich now."], tr: { uk: "Якби я прийняв ту роботу, зараз я був би багатим.", es: "Si hubiera aceptado el trabajo, ahora sería rico.", pt: "Se eu tivesse aceitado o emprego, hoje eu seria rico.", fr: "Si j’avais accepté ce travail, je serais riche maintenant.", de: "Wenn ich die Stelle angenommen hätte, wäre ich jetzt reich.", it: "Se avessi accettato il lavoro, ora sarei ricco.", pl: "Gdybym przyjął tę pracę, byłbym teraz bogaty.", tr: "O işi kabul etseydim şimdi zengin olurdum.", id: "Seandainya dulu saya menerima pekerjaan itu, sekarang saya sudah kaya.", vi: "Nếu tôi đã nhận công việc đó, bây giờ tôi đã giàu rồi." } }
