          - { level: B2, use: { en: Relief that something did not happen (third), uk: "Полегшення, що щось не сталося (третій тип)", es: "Alivio porque algo no ocurrió (tercero)", pt: "Alívio por algo não ter acontecido (terceira)", fr: "Soulagement que quelque chose ne soit pas arrivé (type 3)", de: "Erleichterung, dass etwas nicht geschehen ist (Typ 3)", it: "Sollievo perché qualcosa non è accaduto (terzo)", pl: "Ulga, że coś się nie wydarzyło (typ trzeci)", tr: "Bir şeyin olmamasına duyulan rahatlama (üçüncü tip)", id: "Lega karena sesuatu tidak terjadi (third)", vi: "Nhẹ nhõm vì điều gì đó đã không xảy ra (loại 3)" }, ex: ["If we ", { target: had missed }, " the last train, we ", { target: would have been }, " stuck."], tr: { uk: "Якби ми запізнилися на останній потяг, ми застрягли б.", es: "Si hubiéramos perdido el último tren, nos habríamos quedado varados.", pt: "Se tivéssemos perdido o último trem, teríamos ficado encalhados.", fr: "Si nous avions raté le dernier train, nous aurions été coincés.", de: "Wenn wir den letzten Zug verpasst hätten, wären wir gestrandet.", it: "Se avessimo perso l'ultimo treno, saremmo rimasti bloccati.", pl: "Gdybyśmy spóźnili się na ostatni pociąg, utknęlibyśmy.", tr: "Son treni kaçırsaydık mahsur kalırdık.", id: "Seandainya kami ketinggalan kereta terakhir, kami pasti terjebak.", vi: "Nếu chúng tôi đã lỡ chuyến tàu cuối, chúng tôi đã bị kẹt lại." } }

  - title: { en: Unless, uk: "Unless", es: "Unless", pt: "Unless", fr: "Unless", de: "Unless", it: "Unless", pl: "Unless", tr: "Unless", id: "Unless", vi: "Unless" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: unless }, " means ", { term: ["if ", { gap: true }, " not"] }, ". It takes an affirmative verb:"]
              uk: [{ term: unless }, " означає ", { term: ["if ", { gap: true }, " not"] }, ". Дієслово після нього стверджувальне:"]
              es: [{ term: unless }, " significa ", { term: ["if ", { gap: true }, " not"] }, ". Lleva un verbo afirmativo:"]
              pt: [{ term: "unless" }, " significa ", { term: ["if ", { gap: true }, " not"] }, ". Leva um verbo afirmativo:"]
              fr: [{ term: "unless" }, " signifie ", { term: ["if ", { gap: true }, " not"] }, ". Il est suivi d’un verbe à la forme affirmative :"]
              de: [{ term: "unless" }, " bedeutet ", { term: ["if ", { gap: true }, " not"] }, ". Danach steht ein bejahtes Verb:"]
              it: [{ term: "unless" }, " significa ", { term: ["if ", { gap: true }, " not"] }, ". Il verbo che segue è affermativo:"]
              pl: [{ term: "unless" }, " znaczy ", { term: ["if ", { gap: true }, " not"] }, ". Po nim stoi czasownik w formie twierdzącej:"]
              tr: [{ term: "unless" }, " ", { term: ["if ", { gap: true }, " not"] }, " anlamına gelir. Ardından olumlu fiil gelir:"]
              id: [{ term: "unless" }, " berarti ", { term: ["if ", { gap: true }, " not"] }, ". Kata kerja sesudahnya positif:"]
              vi: [{ term: "unless" }, " nghĩa là ", { term: ["if ", { gap: true }, " not"] }, ". Động từ ở dạng khẳng định:"]
            ex: { equivalence: [[{ target: Unless }, " you hurry, you'll miss the bus."], ["If you ", { target: don't }, " hurry, you'll miss the bus."]] }
            tr: { uk: "Якщо не поспішиш, не встигнеш на автобус.", es: "A menos que te des prisa, perderás el autobús.", pt: "A menos que você se apresse, vai perder o ônibus.", fr: "Sauf si tu te dépêches, tu rateras le bus.", de: "Wenn du dich nicht beeilst, verpasst du den Bus.", it: "A meno che tu non ti sbrighi, perderai l'autobus.", pl: "Jeśli się nie pospieszysz, spóźnisz się na autobus.", tr: "Acele etmezsen otobüsü kaçırırsın.", id: "Kalau kamu tidak bergegas, kamu akan ketinggalan bus.", vi: "Trừ khi bạn nhanh lên, bạn sẽ lỡ xe buýt." }
          - type: note
            level: B1
            text:
              en: [{ term: unless }, " goes with the zero and first conditionals. See ", { link: Conjunctions and Linkers, to: en.sentence-building.conjunctions-linkers }, "."]
              uk: [{ term: unless }, " вживається з нульовим і першим типом. Див. ", { link: "Сполучники та слова-зв’язки", to: en.sentence-building.conjunctions-linkers }, "."]
              es: [{ term: unless }, " se usa con el condicional cero y el primero. Ver ", { link: "Conjunciones y conectores", to: en.sentence-building.conjunctions-linkers }, "."]
              pt: [{ term: "unless" }, " é usado com a condicional zero e a primeira. Ver ", { link: "Conjunções e conectivos", to: "en.sentence-building.conjunctions-linkers" }, "."]
              fr: [{ term: "unless" }, " s’emploie avec les types 0 et 1. Voir ", { link: "Conjonctions et connecteurs", to: "en.sentence-building.conjunctions-linkers" }, "."]
              de: [{ term: "unless" }, " steht bei Typ 0 und Typ 1. Siehe ", { link: "Konjunktionen und Bindewörter", to: "en.sentence-building.conjunctions-linkers" }, "."]
              it: [{ term: "unless" }, " si usa con i tipi zero e primo. Vedi ", { link: "Congiunzioni e connettivi", to: "en.sentence-building.conjunctions-linkers" }, "."]
              pl: [{ term: "unless" }, " występuje w typie zerowym i pierwszym. Zob. ", { link: "Spójniki i słowa łączące", to: "en.sentence-building.conjunctions-linkers" }, "."]
              tr: [{ term: "unless" }, " sıfırıncı ve birinci tipte kullanılır. Bkz. ", { link: "Bağlaçlar ve bağlayıcılar", to: "en.sentence-building.conjunctions-linkers" }, "."]
              id: [{ term: "unless" }, " dipakai dengan zero dan first conditional. Lihat ", { link: "Konjungsi dan kata penghubung", to: "en.sentence-building.conjunctions-linkers" }, "."]
              vi: [{ term: "unless" }, " đi với câu điều kiện loại 0 và loại 1. Xem ", { link: "Liên từ và từ nối", to: "en.sentence-building.conjunctions-linkers" }, "."]

  - title: { en: Other words for if, uk: "Інші слова замість if", es: "Otras palabras para if", pt: "Outras palavras para if", fr: "Autres mots pour if", de: "Andere Wörter für if", it: "Altre parole per if", pl: "Inne słowa zamiast if", tr: "if yerine kullanılan başka sözcükler", id: "Kata lain untuk if", vi: "Các từ khác thay cho if" }
