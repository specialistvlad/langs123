              it: [{ term: "otherwise" }, " e ", { term: "or else" }, " aprono una nuova proposizione dopo un punto, un punto e virgola o una virgola."]
              pl: [{ term: "otherwise" }, " i ", { term: "or else" }, " otwierają nowe zdanie po kropce, średniku lub przecinku."]
              tr: [{ term: "otherwise" }, " ve ", { term: "or else" }, " noktadan, noktalı virgülden ya da virgülden sonra yeni bir cümle başlatır."]
              id: [{ term: "otherwise" }, " dan ", { term: "or else" }, " membuka klausa baru setelah titik, titik koma, atau koma."]
              vi: [{ term: "otherwise" }, " và ", { term: "or else" }, " mở đầu một mệnh đề mới sau dấu chấm, dấu chấm phẩy hoặc dấu phẩy."]
