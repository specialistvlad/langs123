  - title: { en: Formal and legal conditions, uk: "Офіційні й юридичні умови", es: "Condiciones formales y jurídicas", pt: "Condições formais e jurídicas", fr: "Conditions formelles et juridiques", de: "Formelle und juristische Bedingungen", it: "Condizioni formali e giuridiche", pl: "Warunki formalne i prawne", tr: "Resmî ve hukuki koşullar", id: "Syarat formal dan hukum", vi: "Điều kiện trang trọng và pháp lý" }
