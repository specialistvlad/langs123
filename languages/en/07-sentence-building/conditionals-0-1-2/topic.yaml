    es: ["Oraciones con ", { term: if }, " para hechos (cero), posibilidades reales (primero) y situaciones imaginadas (segundo)."]
    pt: ["Frases com ", { term: "if" }, " para fatos (zero), possibilidades reais (primeira) e situações imaginadas (segunda)."]
    fr: ["Phrases avec ", { term: "if" }, " pour les faits (type 0), les possibilités réelles (type 1) et les situations imaginées (type 2)."]
    de: ["Sätze mit ", { term: "if" }, " für Tatsachen (Typ 0), reale Möglichkeiten (Typ 1) und vorgestellte Situationen (Typ 2)."]
    it: ["Frasi con ", { term: "if" }, " per fatti (zero), possibilità reali (primo) e situazioni immaginate (secondo)."]
    pl: ["Zdania z ", { term: "if" }, " dla faktów (typ zerowy), realnych możliwości (pierwszy) i sytuacji wyobrażonych (drugi)."]
    tr: ["Gerçekler (sıfırıncı tip), gerçek olasılıklar (birinci tip) ve hayali durumlar (ikinci tip) için ", { term: "if" }, " cümleleri."]
    id: ["Kalimat dengan ", { term: "if" }, " untuk fakta (zero), kemungkinan nyata (first), dan situasi khayalan (second)."]
    vi: ["Câu với ", { term: "if" }, " cho sự thật (loại 0), khả năng có thật (loại 1) và tình huống tưởng tượng (loại 2)."]
  rule:
    en: ["After ", { term: if }, " the verb is in the present simple, even for the future:"]
    uk: ["Після ", { term: if }, " дієслово стоїть у Present Simple, навіть коли йдеться про майбутнє:"]
    es: ["Después de ", { term: if }, " el verbo va en presente simple, incluso para el futuro:"]
    pt: ["Depois de ", { term: "if" }, ", o verbo fica no presente simples, mesmo para o futuro:"]
    fr: ["Après ", { term: "if" }, " le verbe est au présent simple, même pour le futur :"]
    de: ["Nach ", { term: "if" }, " steht das Verb im Simple Present, auch für die Zukunft:"]
    it: ["Dopo ", { term: "if" }, " il verbo è al present simple, anche per il futuro:"]
    pl: ["Po ", { term: "if" }, " czasownik stoi w Present Simple, nawet gdy mowa o przyszłości:"]
    tr: ["Gelecekten söz ederken bile ", { term: "if" }, " sonrasında fiil Simple Present biçimindedir:"]
    id: ["Setelah ", { term: "if" }, ", kata kerja memakai Simple Present, bahkan untuk masa depan:"]
    vi: ["Sau ", { term: "if" }, ", động từ ở hiện tại đơn, kể cả khi nói về tương lai:"]
  ex: { examples: [["If it ", { target: rains }], we'll stay in.] }

