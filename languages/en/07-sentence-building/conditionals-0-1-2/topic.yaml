  - title: { en: Special if-clauses, uk: "Особливі підрядні речення з if", es: "Oraciones especiales con if", pt: "Orações especiais com if", fr: "Propositions spéciales avec if", de: "Besondere if-Sätze", it: "Proposizioni speciali con if", pl: "Szczególne zdania z if", tr: "Özel if cümlecikleri", id: "Klausa if khusus", vi: "Mệnh đề if đặc biệt" }
