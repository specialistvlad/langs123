            text:
              en: The speaker chooses by how likely the situation seems.
              uk: "Мовець обирає тип залежно від того, наскільки ймовірною здається ситуація."
              es: "El hablante elige según lo probable que parezca la situación."
              pt: "Quem fala escolhe conforme o quanto a situação parece provável."
              fr: "Le locuteur choisit selon la probabilité que la situation lui semble avoir."
              de: "Man wählt danach, wie wahrscheinlich die Situation erscheint."
