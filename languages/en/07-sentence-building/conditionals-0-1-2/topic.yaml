      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The past simple in the if-clause refers to the present or the future.
              uk: ["Past Simple у підрядному реченні з ", { term: if }, " стосується теперішнього або майбутнього."]
              es: ["El pasado simple en la oración con ", { term: if }, " se refiere al presente o al futuro."]
              pt: ["O passado simples na oração com ", { term: "if" }, " refere-se ao presente ou ao futuro."]
              fr: ["Le prétérit simple dans la proposition avec ", { term: "if" }, " renvoie au présent ou au futur."]
              de: ["Das Simple Past im ", { term: "if" }, "-Satz bezieht sich auf die Gegenwart oder die Zukunft."]
              it: ["Il past simple nella proposizione con ", { term: "if" }, " si riferisce al presente o al futuro."]
              pl: ["Past Simple w zdaniu z ", { term: "if" }, " odnosi się do teraźniejszości lub przyszłości."]
              tr: [{ term: "if" }, " cümleciğindeki Simple Past, şimdiyi veya geleceği ifade eder."]
