          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [if, you, { alternatives: [will, would] }, { slot: base verb }] }, use: { en: "polite request; would is more formal", uk: "ввічливе прохання; would офіційніше", es: "petición cortés; would es más formal", pt: "pedido educado; would é mais formal", fr: "demande polie ; would est plus soutenu", de: "höfliche Bitte; would ist förmlicher", it: "richiesta cortese; would è più formale", pl: "uprzejma prośba; would jest bardziej formalne", tr: "nazik rica; would daha resmîdir", id: "permintaan sopan; would lebih formal", vi: "lời đề nghị lịch sự; would trang trọng hơn" }, ex: { examples: [["If you ", { target: would follow }, " me, I'll show you the room."], ["If you ", { target: will wait }, " here, the doctor will see you."]] }, tr: { uk: { examples: ["Якщо ви підете за мною, я покажу вам кімнату.", "Якщо ви зачекаєте тут, лікар вас прийме."] }, es: { examples: ["Si me hace el favor de seguirme, le mostraré la habitación.", "Si tiene la amabilidad de esperar aquí, el doctor lo atenderá."] }, pt: { examples: ["Se o senhor puder me acompanhar, eu lhe mostro o quarto.", "Se o senhor esperar aqui, o médico vai atendê-lo."] }, fr: { examples: ["Si vous voulez bien me suivre, je vous montrerai la chambre.", "Si vous voulez bien patienter ici, le docteur vous recevra."] }, de: { examples: ["Wenn Sie mir bitte folgen würden, zeige ich Ihnen das Zimmer.", "Wenn Sie bitte hier warten, empfängt Sie der Arzt."] }, it: { examples: ["Se vuole seguirmi, le mostrerò la stanza.", "Se vuole attendere qui, il dottore la riceverà."] }, pl: { examples: ["Jeśli zechce pan pójść za mną, pokażę panu pokój.", "Jeśli zechce pan tu zaczekać, lekarz pana przyjmie."] }, tr: { examples: ["Beni takip ederseniz size odayı göstereceğim.", "Burada beklerseniz doktor sizi kabul edecek."] }, id: { examples: ["Jika Anda berkenan mengikuti saya, saya akan menunjukkan kamarnya.", "Jika Anda berkenan menunggu di sini, dokter akan menemui Anda."] }, vi: { examples: ["Nếu quý vị vui lòng đi theo tôi, tôi sẽ chỉ phòng cho quý vị.", "Nếu quý vị vui lòng đợi ở đây, bác sĩ sẽ gặp quý vị."] } } }
          - { level: B2, form: { pattern: [if, { slot: subject }, { alternatives: [have, has] }, { slot: past participle }] }, use: { en: "an action finished before the main clause", uk: "дія, завершена до головної дії", es: "una acción terminada antes de la oración principal", pt: "uma ação concluída antes da oração principal", fr: "une action terminée avant la proposition principale", de: "eine Handlung, die vor dem Hauptsatz abgeschlossen ist", it: "un'azione conclusa prima della proposizione principale", pl: "czynność zakończona przed zdarzeniem z zdania głównego", tr: "ana cümleden önce tamamlanmış bir eylem", id: "tindakan yang selesai sebelum klausa utama", vi: "hành động đã xong trước mệnh đề chính" }, ex: ["If you", { target: "'ve finished" }, ", we can go."], tr: { uk: "Якщо ти закінчив, можемо йти.", es: "Si ya terminaste, podemos irnos.", pt: "Se você já terminou, podemos ir.", fr: "Si tu as terminé, nous pouvons partir.", de: "Wenn du fertig bist, können wir gehen.", it: "Se hai finito, possiamo andare.", pl: "Jeśli skończyłeś, możemy iść.", tr: "İşin bittiyse gidebiliriz.", id: "Kalau kamu sudah selesai, kita bisa pergi.", vi: "Nếu bạn đã xong, chúng ta có thể đi." } }
          - { level: B2, form: { pattern: [if, { slot: subject }, { alternatives: [am, is, are] }, { slot: V-ing }] }, use: { en: "an action in progress or a plan", uk: "дія, що триває, або план", es: "una acción en curso o un plan", pt: "uma ação em andamento ou um plano", fr: "une action en cours ou un projet", de: "eine laufende Handlung oder ein Plan", it: "un'azione in corso o un piano", pl: "czynność w toku lub plan", tr: "devam eden bir eylem ya da bir plan", id: "tindakan yang sedang berlangsung atau sebuah rencana", vi: "hành động đang diễn ra hoặc một kế hoạch" }, ex: ["If you", { target: "'re going" }, " out, buy some milk."], tr: { uk: "Якщо ти виходиш, купи молока.", es: "Si vas a salir, compra leche.", pt: "Se você vai sair, compre leite.", fr: "Si tu sors, achète du lait.", de: "Wenn du rausgehst, kauf bitte Milch.", it: "Se esci, compra del latte.", pl: "Jeśli wychodzisz, kup mleko.", tr: "Dışarı çıkıyorsan biraz süt al.", id: "Kalau kamu mau keluar, belilah susu.", vi: "Nếu bạn ra ngoài, hãy mua ít sữa." } }
          - { level: B2, form: ["if ", { slot: adjective }], use: { en: "short for if it is possible, necessary and so on", uk: "скорочення від if it is possible, necessary тощо", es: "abreviatura de if it is possible, necessary, etc.", pt: "forma curta de if it is possible, necessary e assim por diante", fr: "forme abrégée de if it is possible, necessary, etc.", de: "Kurzform von if it is possible, necessary usw.", it: "forma breve di if it is possible, necessary e così via", pl: "skrót od if it is possible, necessary itd.", tr: "if it is possible, necessary vb. yapılarının kısa hâli", id: "bentuk singkat dari if it is possible, necessary, dan seterusnya", vi: "dạng rút gọn của if it is possible, necessary, v.v." }, ex: { examples: [["Call me back, ", { target: if possible }, "."], ["Bring a pen, ", { target: if necessary }, "."]] }, tr: { uk: { examples: ["Передзвони мені, якщо можливо.", "Візьми ручку, якщо потрібно."] }, es: { examples: ["Devuélveme la llamada, si es posible.", "Trae un bolígrafo, si es necesario."] }, pt: { examples: ["Me ligue de volta, se possível.", "Traga uma caneta, se necessário."] }, fr: { examples: ["Rappelle-moi, si possible.", "Apporte un stylo, si nécessaire."] }, de: { examples: ["Ruf mich zurück, wenn möglich.", "Bring einen Stift mit, falls nötig."] }, it: { examples: ["Richiamami, se possibile.", "Porta una penna, se necessario."] }, pl: { examples: ["Oddzwoń do mnie, jeśli to możliwe.", "Przynieś długopis, jeśli to konieczne."] }, tr: { examples: ["Mümkünse beni geri ara.", "Gerekirse bir kalem getir."] }, id: { examples: ["Telepon saya kembali, jika memungkinkan.", "Bawalah pulpen, jika perlu."] }, vi: { examples: ["Gọi lại cho tôi, nếu có thể.", "Mang theo một cây bút, nếu cần."] } } }
          - { level: B2, form: { alternatives: [{ term: if so }, { term: if not }] }, use: { en: "refers back to the last statement or question", uk: "відсилає до попереднього твердження чи питання", es: "remite a la última afirmación o pregunta", pt: "remete à última afirmação ou pergunta", fr: "renvoie à la dernière affirmation ou question", de: "bezieht sich auf die letzte Aussage oder Frage", it: "rimanda all'ultima affermazione o domanda", pl: "odnosi się do ostatniego zdania lub pytania", tr: "son ifadeye ya da soruya geri gönderme yapar", id: "merujuk kembali ke pernyataan atau pertanyaan terakhir", vi: "nhắc lại câu nói hoặc câu hỏi vừa rồi" }, ex: { examples: [["Are you free tonight? ", { target: If so }, ", join us."], ["Is it raining? ", { target: If not }, ", let's walk."]] }, tr: { uk: { examples: ["Ти вільний сьогодні ввечері? Якщо так, приєднуйся до нас.", "Іде дощ? Якщо ні, давай пройдемося."] }, es: { examples: ["¿Estás libre esta noche? Si es así, únete a nosotros.", "¿Está lloviendo? Si no, caminemos."] }, pt: { examples: ["Você está livre hoje à noite? Se sim, junte-se a nós.", "Está chovendo? Se não, vamos caminhar."] }, fr: { examples: ["Tu es libre ce soir ? Si oui, rejoins-nous.", "Il pleut ? Sinon, allons marcher."] }, de: { examples: ["Hast du heute Abend Zeit? Wenn ja, komm doch mit.", "Regnet es? Wenn nicht, lass uns zu Fuß gehen."] }, it: { examples: ["Sei libero stasera? Se sì, unisciti a noi.", "Piove? Se no, andiamo a piedi."] }, pl: { examples: ["Jesteś dziś wieczorem wolny? Jeśli tak, dołącz do nas.", "Pada deszcz? Jeśli nie, chodźmy pieszo."] }, tr: { examples: ["Bu akşam boş musun? Öyleyse bize katıl.", "Yağmur yağıyor mu? Yağmıyorsa yürüyelim."] }, id: { examples: ["Apakah kamu senggang malam ini? Kalau iya, bergabunglah dengan kami.", "Apakah sedang hujan? Kalau tidak, ayo kita jalan kaki."] }, vi: { examples: ["Tối nay bạn rảnh không? Nếu rảnh, hãy tham gia với chúng tôi.", "Trời có đang mưa không? Nếu không, chúng ta đi bộ nhé."] } } }
          - { level: C1, form: { alternatives: [{ term: if any }, { term: if ever }, { term: if at all }] }, use: { en: "limits a claim: perhaps none, perhaps very few", uk: "обмежує твердження: можливо жодного, можливо дуже мало", es: "limita una afirmación: quizá ninguno, quizá muy pocos", pt: "limita uma afirmação: talvez nenhum, talvez muito poucos", fr: "limite une affirmation : peut-être aucun, peut-être très peu", de: "schränkt eine Aussage ein: vielleicht keine, vielleicht sehr wenige", it: "limita un'affermazione: forse nessuno, forse pochissimi", pl: "ogranicza twierdzenie: może żadnych, może bardzo niewiele", tr: "bir iddiayı sınırlar: belki hiç, belki çok az", id: "membatasi pernyataan: mungkin tidak ada, mungkin sangat sedikit", vi: "hạn chế một nhận định: có thể không có, có thể rất ít" }, ex: { examples: [["There are few mistakes, ", { target: if any }, "."], ["She rarely, ", { target: if ever }, ", complains."]] }, tr: { uk: { examples: ["Помилок мало, якщо вони взагалі є.", "Вона рідко, якщо взагалі, скаржиться."] }, es: { examples: ["Hay pocos errores, si es que hay alguno.", "Rara vez, si acaso, se queja."] }, pt: { examples: ["Há poucos erros, se é que há algum.", "Ela raramente, se é que alguma vez, reclama."] }, fr: { examples: ["Il y a peu d’erreurs, s’il y en a.", "Elle se plaint rarement, voire jamais."] }, de: { examples: ["Es gibt wenige Fehler, wenn überhaupt welche.", "Sie beschwert sich selten, wenn überhaupt."] }, it: { examples: ["Ci sono pochi errori, se ce ne sono.", "Raramente, se mai, si lamenta."] }, pl: { examples: ["Jest niewiele błędów, jeśli w ogóle jakieś są.", "Rzadko, jeśli w ogóle, narzeka."] }, tr: { examples: ["Hata çok az, hatta belki hiç yok.", "Çok nadiren şikâyet eder, hatta hiç etmez."] }, id: { examples: ["Kesalahannya sedikit, kalaupun ada.", "Dia jarang, kalaupun pernah, mengeluh."] }, vi: { examples: ["Có rất ít lỗi, nếu có.", "Cô ấy hiếm khi, nếu có, phàn nàn."] } } }

  - title: { en: Inverted conditionals, uk: "Умовні речення з інверсією", es: "Condicionales con inversión", pt: "Condicionais com inversão", fr: "Phrases conditionnelles avec inversion", de: "Bedingungssätze mit Inversion", it: "Periodo ipotetico con inversione", pl: "Zdania warunkowe z inwersją", tr: "Devrik koşul cümleleri", id: "Conditional dengan inversi", vi: "Câu điều kiện đảo ngữ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: replaces, label: { en: Replaces, uk: "Замінює", es: "Sustituye a", pt: "Substitui", fr: "Remplace", de: "Ersetzt", it: "Sostituisce", pl: "Zastępuje", tr: "Yerine geçer", id: "Menggantikan", vi: "Thay cho" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [Had, { slot: subject }, { slot: past participle }] }, replaces: { pattern: [if, { slot: subject }, had, { slot: past participle }] }, ex: [{ target: Had I known }, ", I would have called."], tr: { uk: "Якби я знав, я б зателефонував.", es: "De haberlo sabido, habría llamado.", pt: "Tivesse eu sabido, teria ligado.", fr: "Si j’avais su, j’aurais appelé.", de: "Hätte ich das gewusst, hätte ich angerufen.", it: "Se l'avessi saputo, avrei chiamato.", pl: "Gdybym wiedział, zadzwoniłbym.", tr: "Bilseydim arardım.", id: "Seandainya saya tahu, saya pasti sudah menelepon.", vi: "Giá mà tôi đã biết, tôi đã gọi rồi." } }
          - { level: C1, form: { pattern: [Were, { slot: subject }] }, replaces: { pattern: [if, { slot: subject }, were] }, ex: [{ target: Were I }, " you, I would wait."], tr: { uk: "Якби я був тобою, я б зачекав.", es: "Si yo fuera tú, esperaría.", pt: "Se eu fosse você, esperaria.", fr: "Si j’étais toi, j’attendrais.", de: "Wäre ich du, würde ich warten.", it: "Se fossi in te, aspetterei.", pl: "Gdybym był tobą, poczekałbym.", tr: "Senin yerinde olsam beklerdim.", id: "Seandainya saya jadi kamu, saya akan menunggu.", vi: "Nếu tôi là bạn, tôi sẽ chờ." } }
          - { level: C1, form: { pattern: [Should, { slot: subject }, { slot: base verb }] }, replaces: { pattern: [if, { slot: subject }, should, { slot: base verb }] }, ex: [{ target: Should you need }, " help, call me."], tr: { uk: "Якщо тобі раптом знадобиться допомога, зателефонуй мені.", es: "Si llegaras a necesitar ayuda, llámame.", pt: "Caso você precise de ajuda, me ligue.", fr: "Si jamais tu as besoin d’aide, appelle-moi.", de: "Solltest du Hilfe brauchen, ruf mich an.", it: "Se dovessi aver bisogno di aiuto, chiamami.", pl: "Gdybyś potrzebował pomocy, zadzwoń do mnie.", tr: "Yardıma ihtiyacın olursa beni ara.", id: "Jika kamu sampai membutuhkan bantuan, hubungi saya.", vi: "Nếu bạn có cần giúp đỡ, hãy gọi cho tôi." } }
          - { level: C1, form: { pattern: [Had, { slot: subject }, not, { slot: past participle }] }, replaces: { pattern: [if, { slot: subject }, hadn't, { slot: past participle }] }, ex: [{ target: Had they not left }, " early, they would have missed the train."], tr: { uk: "Якби вони не виїхали рано, то спізнилися б на потяг.", es: "De no haber salido temprano, habrían perdido el tren.", pt: "Se não tivessem saído cedo, teriam perdido o trem.", fr: "S’ils n’étaient pas partis tôt, ils auraient raté le train.", de: "Wären sie nicht früh losgefahren, hätten sie den Zug verpasst.", it: "Se non fossero partiti presto, avrebbero perso il treno.", pl: "Gdyby nie wyjechali wcześnie, spóźniliby się na pociąg.", tr: "Erken çıkmasalardı treni kaçırırlardı.", id: "Seandainya mereka tidak berangkat lebih awal, mereka pasti ketinggalan kereta.", vi: "Nếu họ không đi sớm, họ đã lỡ chuyến tàu." } }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              en: [{ term: had }, ", ", { term: were }, " and ", { term: should }, " alone open an inverted conditional, and the clause drops ", { term: if }, "."]
              uk: [{ term: "had" }, ", ", { term: "were" }, " і ", { term: "should" }, " самі відкривають умовне речення з інверсією, і ", { term: "if" }, " зникає."]
              es: [{ term: "had" }, ", ", { term: "were" }, " y ", { term: "should" }, " por sí solos abren un condicional invertido, y la oración ya no lleva ", { term: "if" }, "."]
              pt: [{ term: "had" }, ", ", { term: "were" }, " e ", { term: "should" }, " sozinhos abrem uma condicional invertida, e a oração perde o ", { term: "if" }, "."]
              fr: [{ term: "had" }, ", ", { term: "were" }, " et ", { term: "should" }, " ouvrent à eux seuls une phrase conditionnelle avec inversion, et la proposition n’a plus de ", { term: "if" }, "."]
              de: [{ term: "had" }, ", ", { term: "were" }, " und ", { term: "should" }, " allein eröffnen einen Bedingungssatz mit Inversion, und das ", { term: "if" }, " entfällt."]
              it: [{ term: "had" }, ", ", { term: "were" }, " e ", { term: "should" }, " da soli aprono un periodo ipotetico con inversione, e la proposizione perde ", { term: "if" }, "."]
              pl: [{ term: "had" }, ", ", { term: "were" }, " i ", { term: "should" }, " same otwierają zdanie warunkowe z inwersją, a ", { term: "if" }, " znika."]
              tr: [{ term: "had" }, ", ", { term: "were" }, " ve ", { term: "should" }, " tek başına devrik bir koşul cümlesi başlatır ve cümlecikten ", { term: "if" }, " düşer."]
              id: [{ term: "had" }, ", ", { term: "were" }, " dan ", { term: "should" }, " saja membuka conditional dengan inversi, dan klausa itu tidak memakai ", { term: "if" }, "."]
              vi: [{ term: "had" }, ", ", { term: "were" }, " và ", { term: "should" }, " một mình mở đầu câu điều kiện đảo ngữ, và mệnh đề bỏ ", { term: "if" }, "."]
          - type: rule
            level: C1
            text:
              en: Inverted conditionals belong to formal speech and writing.
              uk: "Умовні речення з інверсією належать до офіційного мовлення й письма."
              es: "Los condicionales invertidos pertenecen al habla y a la escritura formales."
              pt: "As condicionais invertidas pertencem à fala e à escrita formais."
              fr: "Les phrases conditionnelles avec inversion relèvent de l’oral et de l’écrit soutenus."
              de: "Bedingungssätze mit Inversion gehören zur förmlichen Sprache und Schrift."
              it: "Il periodo ipotetico con inversione appartiene al parlato e allo scritto formali."
              pl: "Zdania warunkowe z inwersją należą do mowy i pisma formalnego."
              tr: "Devrik koşul cümleleri resmî konuşma ve yazıya aittir."
              id: "Conditional dengan inversi termasuk ragam lisan dan tulisan formal."
              vi: "Câu điều kiện đảo ngữ thuộc văn nói và văn viết trang trọng."
            ex: { equivalence: [[{ target: Had I known }, ", I would have called."], ["If I ", { target: had known }, ", I would have called."]] }
            tr: { uk: "Якби я знав, я б зателефонував.", es: "De haberlo sabido, habría llamado.", pt: "Tivesse eu sabido, teria ligado.", fr: "Si j’avais su, j’aurais appelé.", de: "Hätte ich das gewusst, hätte ich angerufen.", it: "Se l'avessi saputo, avrei chiamato.", pl: "Gdybym wiedział, zadzwoniłbym.", tr: "Bilseydim arardım.", id: "Seandainya saya tahu, saya pasti sudah menelepon.", vi: "Giá mà tôi đã biết, tôi đã gọi rồi." }

  - title: { en: "If it weren't for, but for and without", uk: "If it weren't for, but for і without", es: "If it weren't for, but for y without", pt: "If it weren't for, but for e without", fr: "If it weren't for, but for et without", de: "If it weren't for, but for und without", it: "If it weren't for, but for e without", pl: "If it weren't for, but for i without", tr: "If it weren't for, but for ve without", id: "If it weren't for, but for, dan without", vi: "If it weren't for, but for và without" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Phrase, uk: "Вираз", es: "Expresión", pt: "Expressão", fr: "Expression", de: "Wendung", it: "Espressione", pl: "Wyrażenie", tr: "İfade", id: "Ungkapan", vi: "Cụm từ" } }
          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [if it weren't for, { slot: noun }] }, use: { en: "present: without this cause or help", uk: "теперішній час: без цієї причини чи допомоги", es: "presente: sin esta causa o ayuda", pt: "presente: sem esta causa ou ajuda", fr: "présent : sans cette cause ou cette aide", de: "Gegenwart: ohne diese Ursache oder Hilfe", it: "presente: senza questa causa o questo aiuto", pl: "teraźniejszość: bez tej przyczyny lub pomocy", tr: "şimdi: bu neden ya da yardım olmasaydı", id: "masa kini: tanpa penyebab atau bantuan ini", vi: "hiện tại: nếu không có nguyên nhân hay sự giúp đỡ này" }, ex: [{ target: "If it weren't for" }, " the traffic, we would be there by now."], tr: { uk: "Якби не затори, ми вже були б там.", es: "Si no fuera por el tráfico, ya estaríamos allí.", pt: "Se não fosse o trânsito, já estaríamos lá.", fr: "Sans les embouteillages, nous y serions déjà.", de: "Wenn der Verkehr nicht wäre, wären wir längst dort.", it: "Se non fosse per il traffico, saremmo già arrivati.", pl: "Gdyby nie korki, bylibyśmy już na miejscu.", tr: "Trafik olmasaydı şimdiye kadar orada olurduk.", id: "Seandainya tidak ada kemacetan, kita pasti sudah sampai di sana.", vi: "Nếu không vì kẹt xe, giờ này chúng ta đã đến đó rồi." } }
          - { level: C1, form: { pattern: [if it hadn't been for, { slot: noun }] }, use: { en: "past: without this cause or help", uk: "минулий час: без цієї причини чи допомоги", es: "pasado: sin esta causa o ayuda", pt: "passado: sem esta causa ou ajuda", fr: "passé : sans cette cause ou cette aide", de: "Vergangenheit: ohne diese Ursache oder Hilfe", it: "passato: senza questa causa o questo aiuto", pl: "przeszłość: bez tej przyczyny lub pomocy", tr: "geçmiş: bu neden ya da yardım olmasaydı", id: "masa lalu: tanpa penyebab atau bantuan ini", vi: "quá khứ: nếu không có nguyên nhân hay sự giúp đỡ này" }, ex: [{ target: "If it hadn't been for" }, " your map, we would have got lost."], tr: { uk: "Якби не твоя карта, ми б заблукали.", es: "Si no hubiera sido por tu mapa, nos habríamos perdido.", pt: "Se não fosse pelo seu mapa, nós teríamos nos perdido.", fr: "Sans ta carte, nous nous serions perdus.", de: "Ohne deine Karte hätten wir uns verlaufen.", it: "Se non fosse stato per la tua mappa, ci saremmo persi.", pl: "Gdyby nie twoja mapa, zgubilibyśmy się.", tr: "Haritan olmasaydı kaybolurduk.", id: "Seandainya bukan karena petamu, kita pasti sudah tersesat.", vi: "Nếu không có bản đồ của bạn, chúng ta đã bị lạc rồi." } }
          - { level: C1, form: { pattern: [but for, { slot: noun }] }, use: { en: "formal: present or past", uk: "офіційно: теперішній або минулий час", es: "formal: presente o pasado", pt: "formal: presente ou passado", fr: "soutenu : présent ou passé", de: "förmlich: Gegenwart oder Vergangenheit", it: "formale: presente o passato", pl: "formalnie: teraźniejszość lub przeszłość", tr: "resmî: şimdi ya da geçmiş", id: "formal: masa kini atau masa lalu", vi: "trang trọng: hiện tại hoặc quá khứ" }, ex: [{ target: But for }, " the storm, we would have arrived on time."], tr: { uk: "Якби не буря, ми приїхали б вчасно.", es: "De no haber sido por la tormenta, habríamos llegado a tiempo.", pt: "Não fosse a tempestade, teríamos chegado a tempo.", fr: "Sans la tempête, nous serions arrivés à l’heure.", de: "Ohne den Sturm wären wir pünktlich angekommen.", it: "Se non fosse stato per la tempesta, saremmo arrivati in orario.", pl: "Gdyby nie burza, dotarlibyśmy na czas.", tr: "Fırtına olmasaydı zamanında varırdık.", id: "Seandainya bukan karena badai, kami pasti tiba tepat waktu.", vi: "Nếu không có cơn bão, chúng tôi đã đến đúng giờ." } }
          - { level: C1, form: { pattern: [without, { alternatives: [{ slot: noun }, { slot: V-ing }] }] }, use: { en: "if there were no, if you do not have", uk: "якби не було; якщо в тебе немає", es: "si no hubiera; si no tienes", pt: "se não houvesse; se você não tem", fr: "s’il n’y avait pas ; si tu n’as pas", de: "wenn es kein … gäbe; wenn du kein … hast", it: "se non ci fosse; se non hai", pl: "gdyby nie było; jeśli nie masz", tr: "olmasaydı; elinde yoksa", id: "seandainya tidak ada; jika kamu tidak punya", vi: "nếu không có; nếu bạn không có" }, ex: { examples: [[{ target: Without }, " a ticket, you can't get in."], [{ target: Without }, " your help, I would have failed."]] }, tr: { uk: { examples: ["Без квитка ти не потрапиш досередини.", "Без твоєї допомоги я б зазнав невдачі."] }, es: { examples: ["Sin un boleto, no puedes entrar.", "Sin tu ayuda, habría fracasado."] }, pt: { examples: ["Sem ingresso, você não pode entrar.", "Sem a sua ajuda, eu teria fracassado."] }, fr: { examples: ["Sans billet, tu ne peux pas entrer.", "Sans ton aide, j’aurais échoué."] }, de: { examples: ["Ohne Eintrittskarte kommst du nicht hinein.", "Ohne deine Hilfe wäre ich gescheitert."] }, it: { examples: ["Senza biglietto, non puoi entrare.", "Senza il tuo aiuto, avrei fallito."] }, pl: { examples: ["Bez biletu nie możesz wejść.", "Bez twojej pomocy poniósłbym porażkę."] }, tr: { examples: ["Biletsiz giremezsin.", "Yardımın olmasaydı başarısız olurdum."] }, id: { examples: ["Tanpa tiket, kamu tidak bisa masuk.", "Tanpa bantuanmu, saya pasti sudah gagal."] }, vi: { examples: ["Không có vé, bạn không thể vào.", "Nếu không có sự giúp đỡ của bạn, tôi đã thất bại."] } } }
          - { level: C1, form: { pattern: [with, { slot: noun }] }, use: { en: "if there is, if we have", uk: "якщо є; якщо в нас є", es: "si hay; si tenemos", pt: "se há; se temos", fr: "s’il y a ; si nous avons", de: "wenn es … gibt; wenn wir … haben", it: "se c'è; se abbiamo", pl: "jeśli jest; jeśli mamy", tr: "varsa; elimizde varsa", id: "jika ada; jika kita punya", vi: "nếu có; nếu chúng ta có" }, ex: { examples: [[{ target: With }, " a bit of luck, we'll win."], [{ target: With }, " more time, I could do better."]] }, tr: { uk: { examples: ["З невеликою удачею ми переможемо.", "Маючи більше часу, я міг би зробити краще."] }, es: { examples: ["Con un poco de suerte, ganaremos.", "Con más tiempo, podría hacerlo mejor."] }, pt: { examples: ["Com um pouco de sorte, vamos ganhar.", "Com mais tempo, eu poderia fazer melhor."] }, fr: { examples: ["Avec un peu de chance, nous gagnerons.", "Avec plus de temps, je pourrais faire mieux."] }, de: { examples: ["Mit etwas Glück gewinnen wir.", "Mit mehr Zeit könnte ich es besser machen."] }, it: { examples: ["Con un po' di fortuna, vinceremo.", "Con più tempo, potrei fare meglio."] }, pl: { examples: ["Przy odrobinie szczęścia wygramy.", "Przy większej ilości czasu mógłbym zrobić to lepiej."] }, tr: { examples: ["Biraz şansla kazanırız.", "Daha çok zamanım olsa daha iyisini yapabilirdim."] }, id: { examples: ["Dengan sedikit keberuntungan, kita akan menang.", "Dengan waktu lebih banyak, saya bisa melakukannya dengan lebih baik."] }, vi: { examples: ["Chỉ cần một chút may mắn, chúng ta sẽ thắng.", "Nếu có nhiều thời gian hơn, tôi có thể làm tốt hơn."] } } }
          - { level: C1, form: { pattern: [{ alternatives: [in the event of, in case of] }, { slot: noun }] }, use: { en: "if there is; notices and rules", uk: "якщо станеться; оголошення й правила", es: "si hay; avisos y normas", pt: "se houver; avisos e regras", fr: "s’il y a ; avis et règlements", de: "wenn es … gibt; Hinweise und Regeln", it: "se c'è; avvisi e regolamenti", pl: "jeśli wystąpi; ogłoszenia i regulaminy", tr: "olursa; duyurular ve kurallar", id: "jika terjadi; pengumuman dan peraturan", vi: "nếu xảy ra; thông báo và quy định" }, ex: { examples: [[{ target: In the event of }, " fire, use the stairs."], [{ target: In case of }, " fire, break the glass."]] }, tr: { uk: { examples: ["У разі пожежі користуйтеся сходами.", "У разі пожежі розбийте скло."] }, es: { examples: ["En caso de incendio, use las escaleras.", "En caso de incendio, rompa el vidrio."] }, pt: { examples: ["Em caso de incêndio, use as escadas.", "Em caso de incêndio, quebre o vidro."] }, fr: { examples: ["En cas d’incendie, utilisez les escaliers.", "En cas d’incendie, brisez la vitre."] }, de: { examples: ["Benutzen Sie im Brandfall die Treppe.", "Schlagen Sie im Brandfall die Scheibe ein."] }, it: { examples: ["In caso di incendio, usare le scale.", "In caso di incendio, rompere il vetro."] }, pl: { examples: ["W razie pożaru korzystaj ze schodów.", "W razie pożaru stłucz szybę."] }, tr: { examples: ["Yangın durumunda merdivenleri kullanın.", "Yangın durumunda camı kırın."] }, id: { examples: ["Jika terjadi kebakaran, gunakan tangga.", "Jika terjadi kebakaran, pecahkan kacanya."] }, vi: { examples: ["Khi có hỏa hoạn, hãy dùng cầu thang.", "Khi có hỏa hoạn, hãy đập vỡ kính."] } } }
          - { level: C1, form: { pattern: [given that, { slot: clause }] }, use: { en: "since this is so; a condition taken as a fact", uk: "оскільки це так; умова, яку сприймають як факт", es: "dado que es así; una condición que se toma como un hecho", pt: "já que é assim; uma condição tomada como fato", fr: "puisqu’il en est ainsi ; une condition tenue pour un fait", de: "da es so ist; eine Bedingung, die als Tatsache gilt", it: "dato che è così; una condizione presa come un fatto", pl: "skoro tak jest; warunek traktowany jak fakt", tr: "madem öyle; gerçek kabul edilen bir koşul", id: "karena memang demikian; syarat yang dianggap sebagai fakta", vi: "vì sự việc là như vậy; một điều kiện được coi là sự thật" }, ex: [{ target: Given that }, " it is late, we should go."], tr: { uk: "Зважаючи на пізню годину, нам пора йти.", es: "Dado que es tarde, deberíamos irnos.", pt: "Dado que já é tarde, devemos ir.", fr: "Étant donné qu’il est tard, nous devrions partir.", de: "Da es spät ist, sollten wir gehen.", it: "Dato che è tardi, dovremmo andare.", pl: "Skoro jest późno, powinniśmy iść.", tr: "Geç olduğuna göre gitmeliyiz.", id: "Mengingat hari sudah larut, sebaiknya kita pergi.", vi: "Vì đã muộn, chúng ta nên đi thôi." } }

  - title: { en: "Remote possibility: were to and should", uk: "Віддалена можливість: were to і should", es: "Posibilidad remota: were to y should", pt: "Possibilidade remota: were to e should", fr: "Possibilité lointaine : were to et should", de: "Entfernte Möglichkeit: were to und should", it: "Possibilità remota: were to e should", pl: "Odległa możliwość: were to i should", tr: "Uzak olasılık: were to ve should", id: "Kemungkinan yang jauh: were to dan should", vi: "Khả năng xa vời: were to và should" }
