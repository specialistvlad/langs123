sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: Zero and first conditionals talk about real situations. The second talks about imagined ones.
              uk: "Нульовий і перший тип описують реальні ситуації. Другий тип описує уявні."
              es: "El condicional cero y el primero hablan de situaciones reales. El segundo habla de situaciones imaginadas."
              pt: "As condicionais zero e primeira falam de situações reais. A segunda fala de situações imaginadas."
              fr: "Les types 0 et 1 parlent de situations réelles. Le type 2 parle de situations imaginées."
              de: "Typ 0 und Typ 1 beschreiben reale Situationen. Typ 2 beschreibt vorgestellte Situationen."
              it: "I tipi zero e primo parlano di situazioni reali. Il secondo parla di situazioni immaginate."
              pl: "Typ zerowy i pierwszy opisują sytuacje realne. Typ drugi opisuje sytuacje wyobrażone."
              tr: "Sıfırıncı ve birinci tip gerçek durumlardan söz eder. İkinci tip hayali durumlardan söz eder."
              id: "Zero dan first conditional membicarakan situasi nyata. Second conditional membicarakan situasi khayalan."
              vi: "Câu điều kiện loại 0 và loại 1 nói về tình huống có thật. Loại 2 nói về tình huống tưởng tượng."
          - type: rule
            level: B2
            text:
              en: The third conditional imagines a past that did not happen. Mixed conditionals join a past and a present.
              uk: "Третій тип уявляє минуле, якого не було. Змішані умовні речення поєднують минуле й теперішнє."
              es: "El tercer condicional imagina un pasado que no ocurrió. Los condicionales mixtos unen un pasado y un presente."
              pt: "A terceira condicional imagina um passado que não aconteceu. As condicionais mistas unem um passado e um presente."
              fr: "Le type 3 imagine un passé qui n’a pas eu lieu. Les types mixtes relient un passé et un présent."
              de: "Typ 3 stellt sich eine Vergangenheit vor, die nicht stattgefunden hat. Gemischte Bedingungssätze verbinden Vergangenheit und Gegenwart."
              it: "Il terzo tipo immagina un passato che non è avvenuto. I periodi ipotetici misti uniscono un passato e un presente."
              pl: "Typ trzeci wyobraża sobie przeszłość, która się nie wydarzyła. Zdania mieszane łączą przeszłość z teraźniejszością."
              tr: "Üçüncü tip, gerçekleşmemiş bir geçmişi hayal eder. Karma koşul cümleleri geçmişi ve şimdiyi birleştirir."
              id: "Third conditional membayangkan masa lalu yang tidak terjadi. Mixed conditional menggabungkan masa lalu dan masa kini."
              vi: "Câu điều kiện loại 3 tưởng tượng một quá khứ đã không xảy ra. Câu điều kiện hỗn hợp nối quá khứ với hiện tại."

  - title: { en: "Form: zero and first", uk: "Форма: нульовий і перший тип", es: "Forma: cero y primero", pt: "Forma: zero e primeira", fr: "Forme : types 0 et 1", de: "Form: Typ 0 und Typ 1", it: "Forma: zero e primo", pl: "Forma: typ zerowy i pierwszy", tr: "Biçim: sıfırıncı ve birinci tip", id: "Bentuk: zero dan first", vi: "Dạng: loại 0 và loại 1" }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo", pt: "Tipo", fr: "Type", de: "Typ", it: "Tipo", pl: "Typ", tr: "Tür", id: "Jenis", vi: "Loại" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, type: { en: Zero, uk: "Нульовий", es: "Cero", pt: "Zero", fr: "Type 0", de: "Typ 0", it: "Zero", pl: "Zerowy", tr: "Sıfırıncı", id: "Zero", vi: "Loại 0" }, pattern: [{ pattern: [if, { slot: present }] }, ", ", { slot: present }], ex: ["If you ", { target: mix }, " blue and yellow, you ", { target: get }, " green."], tr: { uk: "Якщо змішати синій і жовтий, отримаєш зелений.", es: "Si mezclas azul y amarillo, obtienes verde.", pt: "Se você mistura azul e amarelo, obtém verde.", fr: "Si on mélange du bleu et du jaune, on obtient du vert.", de: "Wenn du Blau und Gelb mischst, bekommst du Grün.", it: "Se mescoli il blu e il giallo, ottieni il verde.", pl: "Jeśli zmieszasz niebieski i żółty, otrzymasz zielony.", tr: "Maviyle sarıyı karıştırırsan yeşil elde edersin.", id: "Kalau kamu mencampur biru dan kuning, hasilnya hijau.", vi: "Nếu bạn trộn màu xanh dương với màu vàng, bạn được màu xanh lá." } }
          - { level: A2, type: { en: First, uk: "Перший", es: "Primero", pt: "Primeira", fr: "Type 1", de: "Typ 1", it: "Primo", pl: "Pierwszy", tr: "Birinci", id: "First", vi: "Loại 1" }, pattern: [{ pattern: [if, { slot: present }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: study }, ", you'", { target: ll pass }, "."], tr: { uk: "Якщо ти вчитимешся, то складеш іспит.", es: "Si estudias, aprobarás.", pt: "Se você estudar, vai passar.", fr: "Si tu étudies, tu réussiras.", de: "Wenn du lernst, wirst du bestehen.", it: "Se studi, passerai l'esame.", pl: "Jeśli będziesz się uczyć, zdasz.", tr: "Çalışırsan sınavı geçersin.", id: "Kalau kamu belajar, kamu akan lulus.", vi: "Nếu bạn học, bạn sẽ đỗ." } }
          - { level: A2, type: { en: First (negative), uk: "Перший (заперечення)", es: "Primero (negación)", pt: "Primeira (negação)", fr: "Type 1 (négation)", de: "Typ 1 (Verneinung)", it: "Primo (negazione)", pl: "Pierwszy (przeczenie)", tr: "Birinci (olumsuz)", id: "First (negatif)", vi: "Loại 1 (phủ định)" }, pattern: [{ pattern: [if, { alternatives: [don't, doesn't] }, { slot: V }] }, ", ", { pattern: [will, { slot: V }] }], ex: ["If you ", { target: don't hurry }, ", you'", { target: ll miss }, " the bus."], tr: { uk: "Якщо ти не поспішиш, то запізнишся на автобус.", es: "Si no te das prisa, perderás el autobús.", pt: "Se você não se apressar, vai perder o ônibus.", fr: "Si tu ne te dépêches pas, tu rateras le bus.", de: "Wenn du dich nicht beeilst, verpasst du den Bus.", it: "Se non ti sbrighi, perderai l'autobus.", pl: "Jeśli się nie pospieszysz, spóźnisz się na autobus.", tr: "Acele etmezsen otobüsü kaçırırsın.", id: "Kalau kamu tidak bergegas, kamu akan ketinggalan bus.", vi: "Nếu bạn không nhanh lên, bạn sẽ lỡ xe buýt." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The if-clause uses the present simple, also for the future."
              uk: ["Підрядне речення з ", { term: if }, " стоїть у Present Simple, також коли йдеться про майбутнє."]
              es: ["La oración con ", { term: if }, " va en presente simple, también para el futuro."]
              pt: ["A oração com ", { term: "if" }, " fica no presente simples, também para o futuro."]
              fr: ["La proposition avec ", { term: "if" }, " est au présent simple, aussi pour le futur."]
              de: ["Der ", { term: "if" }, "-Satz steht im Simple Present, auch für die Zukunft."]
              it: ["La proposizione con ", { term: "if" }, " è al present simple, anche per il futuro."]
              pl: ["Zdanie podrzędne z ", { term: "if" }, " stoi w Present Simple, także gdy mowa o przyszłości."]
              tr: [{ term: "if" }, " cümleciğinde gelecek için de Simple Present kullanılır."]
              id: ["Klausa ", { term: "if" }, " memakai Simple Present, juga untuk masa depan."]
              vi: ["Mệnh đề ", { term: "if" }, " dùng hiện tại đơn, kể cả khi nói về tương lai."]
          - type: rule
            level: A2
            text:
              en: ["The first conditional main clause can also use ", { term: can }, ", ", { term: may }, " or an imperative:"]
              uk: ["У головному реченні першого типу можуть стояти також ", { term: can }, ", ", { term: may }, " або наказовий спосіб:"]
              es: ["La oración principal del primer condicional también puede llevar ", { term: can }, ", ", { term: may }, " o un imperativo:"]
              pt: ["A oração principal da primeira condicional também pode ter ", { term: "can" }, ", ", { term: "may" }, " ou um imperativo:"]
              fr: ["La proposition principale du type 1 peut aussi contenir ", { term: "can" }, ", ", { term: "may" }, " ou un impératif :"]
              de: ["Der Hauptsatz von Typ 1 kann auch ", { term: "can" }, ", ", { term: "may" }, " oder einen Imperativ enthalten:"]
              it: ["La proposizione principale del primo tipo può avere anche ", { term: "can" }, ", ", { term: "may" }, " o un imperativo:"]
              pl: ["W zdaniu głównym typu pierwszego mogą stać także ", { term: "can" }, ", ", { term: "may" }, " lub tryb rozkazujący:"]
              tr: ["Birinci tipte ana cümlede ", { term: "can" }, ", ", { term: "may" }, " veya emir kipi de kullanılabilir:"]
              id: ["Klausa utama pada first conditional juga dapat memakai ", { term: "can" }, ", ", { term: "may" }, " atau kalimat perintah:"]
              vi: ["Mệnh đề chính của câu điều kiện loại 1 cũng có thể dùng ", { term: "can" }, ", ", { term: "may" }, " hoặc câu mệnh lệnh:"]
            ex: ["If you feel ill, ", { target: call }, " me."]
            tr: { uk: "Якщо тобі стане погано, зателефонуй мені.", es: "Si te sientes mal, llámame.", pt: "Se você se sentir mal, me ligue.", fr: "Si tu te sens mal, appelle-moi.", de: "Wenn du dich krank fühlst, ruf mich an.", it: "Se ti senti male, chiamami.", pl: "Jeśli źle się poczujesz, zadzwoń do mnie.", tr: "Kendini kötü hissedersen beni ara.", id: "Kalau kamu merasa tidak enak badan, telepon saya.", vi: "Nếu bạn thấy không khỏe, hãy gọi cho tôi." }

  - title: { en: "Form: second", uk: "Форма: другий тип", es: "Forma: segundo", pt: "Forma: segunda", fr: "Forme : type 2", de: "Form: Typ 2", it: "Forma: secondo", pl: "Forma: typ drugi", tr: "Biçim: ikinci tip", id: "Bentuk: second", vi: "Dạng: loại 2" }
    role: form
    content:
