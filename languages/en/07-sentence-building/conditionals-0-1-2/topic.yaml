        rows:
          - { level: C2, form: { pattern: [Were it not for, { slot: noun }] }, use: { en: "formal: if it weren't for", uk: "офіційно: if it weren't for", es: "formal: if it weren't for", pt: "formal: if it weren't for", fr: "soutenu : if it weren't for", de: "förmlich: if it weren't for", it: "formale: if it weren't for", pl: "formalnie: if it weren't for", tr: "resmî: if it weren't for", id: "formal: if it weren't for", vi: "trang trọng: if it weren't for" }, ex: [{ target: Were it not for }, " the noise, this would be a perfect house."], tr: { uk: "Якби не шум, це був би ідеальний будинок.", es: "De no ser por el ruido, esta sería una casa perfecta.", pt: "Não fosse o barulho, esta seria uma casa perfeita.", fr: "Sans le bruit, ce serait une maison parfaite.", de: "Wäre da nicht der Lärm, wäre dies ein perfektes Haus.", it: "Se non fosse per il rumore, questa sarebbe una casa perfetta.", pl: "Gdyby nie hałas, to byłby idealny dom.", tr: "Gürültü olmasaydı burası mükemmel bir ev olurdu.", id: "Seandainya tidak ada kebisingan, ini akan menjadi rumah yang sempurna.", vi: "Nếu không có tiếng ồn, đây sẽ là một ngôi nhà hoàn hảo." } }
          - { level: C2, form: { pattern: [Had it not been for, { slot: noun }] }, use: { en: "formal: if it hadn't been for", uk: "офіційно: if it hadn't been for", es: "formal: if it hadn't been for", pt: "formal: if it hadn't been for", fr: "soutenu : if it hadn't been for", de: "förmlich: if it hadn't been for", it: "formale: if it hadn't been for", pl: "formalnie: if it hadn't been for", tr: "resmî: if it hadn't been for", id: "formal: if it hadn't been for", vi: "trang trọng: if it hadn't been for" }, ex: [{ target: Had it not been for }, " his advice, we would have failed."], tr: { uk: "Якби не його порада, ми б зазнали невдачі.", es: "De no haber sido por su consejo, habríamos fracasado.", pt: "Não fosse o conselho dele, teríamos fracassado.", fr: "Sans ses conseils, nous aurions échoué.", de: "Hätte es seinen Rat nicht gegeben, wären wir gescheitert.", it: "Se non fosse stato per il suo consiglio, avremmo fallito.", pl: "Gdyby nie jego rada, ponieślibyśmy porażkę.", tr: "Onun tavsiyesi olmasaydı başarısız olurduk.", id: "Seandainya bukan karena nasihatnya, kami pasti sudah gagal.", vi: "Nếu không có lời khuyên của anh ấy, chúng tôi đã thất bại." } }
          - { level: C2, form: { pattern: [Were, { slot: subject }, to, { slot: base verb }] }, use: { en: "formal: if it were to", uk: "офіційно: if it were to", es: "formal: if it were to", pt: "formal: if it were to", fr: "soutenu : if it were to", de: "förmlich: if it were to", it: "formale: if it were to", pl: "formalnie: if it were to", tr: "resmî: if it were to", id: "formal: if it were to", vi: "trang trọng: if it were to" }, ex: [{ target: Were it to rain }, ", the match would move indoors."], tr: { uk: "Якби раптом пішов дощ, матч перенесли б у приміщення.", es: "Si llegara a llover, el partido se jugaría bajo techo.", pt: "Se viesse a chover, a partida seria transferida para um local coberto.", fr: "S’il venait à pleuvoir, le match serait déplacé en salle.", de: "Sollte es regnen, würde das Spiel nach drinnen verlegt.", it: "Se dovesse piovere, la partita si sposterebbe al coperto.", pl: "Gdyby zaczęło padać, mecz zostałby przeniesiony do hali.", tr: "Yağmur yağacak olsa maç kapalı alana alınırdı.", id: "Seandainya sampai hujan, pertandingan akan dipindahkan ke dalam ruangan.", vi: "Nếu trời có mưa, trận đấu sẽ được chuyển vào trong nhà." } }
          - { level: C2, form: { pattern: [Even were, { slot: subject }, to, { slot: base verb }] }, use: { en: "concession: even if it were to", uk: "поступка: even if it were to", es: "concesión: even if it were to", pt: "concessão: even if it were to", fr: "concession : even if it were to", de: "Einräumung: even if it were to", it: "concessione: even if it were to", pl: "ustępstwo: even if it were to", tr: "taviz: even if it were to", id: "konsesi: even if it were to", vi: "nhượng bộ: even if it were to" }, ex: [{ target: Even were he to resign }, ", the problem would remain."], tr: { uk: "Навіть якби він пішов у відставку, проблема залишилася б.", es: "Aun si él renunciara, el problema seguiría.", pt: "Mesmo que ele renunciasse, o problema continuaria.", fr: "Même s’il devait démissionner, le problème subsisterait.", de: "Selbst wenn er zurückträte, bliebe das Problem bestehen.", it: "Anche se si dimettesse, il problema rimarrebbe.", pl: "Nawet gdyby zrezygnował, problem by pozostał.", tr: "İstifa etse bile sorun devam ederdi.", id: "Walaupun dia mengundurkan diri, masalahnya tetap ada.", vi: "Dù anh ấy có từ chức, vấn đề vẫn còn đó." } }

