          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, word: { alternatives: [{ term: as long as }, { term: so long as }] }, use: { en: "only if", uk: "лише якщо", es: "solo si", pt: "somente se", fr: "seulement si", de: "nur wenn", it: "solo se", pl: "tylko jeśli", tr: "ancak koşul gerçekleşirse", id: "hanya jika", vi: "chỉ khi" }, ex: ["You can stay ", { target: as long as }, " you are quiet."], tr: { uk: "Ти можеш залишитися, якщо поводитимешся тихо.", es: "Puedes quedarte siempre que guardes silencio.", pt: "Você pode ficar desde que fique quieto.", fr: "Tu peux rester à condition d’être silencieux.", de: "Du kannst bleiben, solange du leise bist.", it: "Puoi restare purché tu stia zitto.", pl: "Możesz zostać, pod warunkiem że będziesz cicho.", tr: "Sessiz olduğun sürece kalabilirsin.", id: "Kamu boleh tinggal asalkan kamu diam.", vi: "Bạn có thể ở lại miễn là bạn giữ yên lặng." } }
          - { level: B2, word: { alternatives: [[{ term: provided }, " ", { optional: that }], [{ term: providing }, " ", { optional: that }]] }, use: { en: "only if; a little more formal", uk: "лише якщо; трохи офіційніше", es: "solo si; un poco más formal", pt: "somente se; um pouco mais formal", fr: "seulement si ; un peu plus soutenu", de: "nur wenn; etwas förmlicher", it: "solo se; un po' più formale", pl: "tylko jeśli; nieco bardziej formalnie", tr: "ancak koşul gerçekleşirse; biraz daha resmî", id: "hanya jika; sedikit lebih formal", vi: "chỉ khi; trang trọng hơn một chút" }, ex: ["We'll start ", { target: provided that }, " everyone is here."], tr: { uk: "Ми почнемо за умови, що всі будуть на місці.", es: "Empezaremos siempre y cuando estén todos aquí.", pt: "Começaremos desde que todos estejam aqui.", fr: "Nous commencerons à condition que tout le monde soit là.", de: "Wir fangen an, vorausgesetzt, alle sind da.", it: "Cominceremo a condizione che siano tutti presenti.", pl: "Zaczniemy, pod warunkiem że wszyscy będą obecni.", tr: "Herkes burada olmak koşuluyla başlayacağız.", id: "Kita akan mulai asalkan semua orang sudah hadir.", vi: "Chúng ta sẽ bắt đầu với điều kiện mọi người có mặt." } }
          - { level: C1, word: { term: on condition that }, use: { en: "only if; a term that has been agreed", uk: "лише якщо; умова, про яку домовилися", es: "solo si; una condición acordada", pt: "somente se; uma condição combinada", fr: "seulement si ; une condition convenue", de: "nur wenn; eine vereinbarte Bedingung", it: "solo se; una condizione concordata", pl: "tylko jeśli; warunek, na który się zgodzono", tr: "ancak koşul gerçekleşirse; üzerinde anlaşılmış bir koşul", id: "hanya jika; syarat yang sudah disepakati", vi: "chỉ khi; một điều kiện đã được thỏa thuận" }, ex: ["She agreed to talk ", { target: on condition that }, " her name stayed secret."], tr: { uk: "Вона погодилася поговорити за умови, що її ім’я залишиться таємним.", es: "Aceptó hablar con la condición de que su nombre siguiera siendo secreto.", pt: "Ela concordou em falar sob a condição de que seu nome permanecesse em segredo.", fr: "Elle a accepté de parler à condition que son nom reste secret.", de: "Sie willigte ein zu sprechen, unter der Bedingung, dass ihr Name geheim blieb.", it: "Ha accettato di parlare a condizione che il suo nome restasse segreto.", pl: "Zgodziła się mówić pod warunkiem, że jej nazwisko pozostanie tajemnicą.", tr: "Adının gizli kalması koşuluyla konuşmayı kabul etti.", id: "Dia setuju berbicara dengan syarat namanya tetap dirahasiakan.", vi: "Cô ấy đồng ý nói chuyện với điều kiện tên của cô được giữ bí mật." } }
          - { level: B2, word: { alternatives: [{ term: supposing }, { term: assuming }] }, use: { en: "imagine that, or take as true", uk: "уявити, що; або вважати правдою", es: "imaginar que, o dar por cierto", pt: "imaginar que, ou dar como verdadeiro", fr: "imaginer que, ou tenir pour vrai", de: "sich vorstellen, dass; oder als wahr annehmen", it: "immaginare che, o dare per vero", pl: "wyobrazić sobie, że; albo przyjąć za prawdę", tr: "farz etmek ya da doğru kabul etmek", id: "membayangkan bahwa, atau menganggap benar", vi: "tưởng tượng rằng, hoặc coi là đúng" }, ex: { examples: [[{ target: Supposing }, " you lost your passport, what would you do?"], [{ target: Assuming }, " the shop is open, we can buy it today."]] }, tr: { uk: { examples: ["Припустімо, що ти загубив паспорт, що б ти зробив?", "Якщо припустити, що магазин відчинений, ми можемо купити це сьогодні."] }, es: { examples: ["Supón que perdieras tu pasaporte, ¿qué harías?", "Suponiendo que la tienda esté abierta, podemos comprarlo hoy."] }, pt: { examples: ["Suponha que você perdesse o passaporte, o que faria?", "Supondo que a loja esteja aberta, podemos comprar hoje."] }, fr: { examples: ["Supposons que tu perdes ton passeport : que ferais-tu ?", "En supposant que le magasin soit ouvert, nous pouvons l’acheter aujourd’hui."] }, de: { examples: ["Angenommen, du würdest deinen Pass verlieren, was würdest du tun?", "Angenommen, der Laden ist offen, können wir es heute kaufen."] }, it: { examples: ["Supponendo che tu perda il passaporto, che cosa faresti?", "Supponendo che il negozio sia aperto, possiamo comprarlo oggi."] }, pl: { examples: ["Załóżmy, że zgubisz paszport. Co byś zrobił?", "Zakładając, że sklep jest otwarty, możemy to kupić dzisiaj."] }, tr: { examples: ["Diyelim ki pasaportunu kaybettin, ne yapardın?", "Mağazanın açık olduğunu varsayarsak bunu bugün alabiliriz."] }, id: { examples: ["Seandainya kamu kehilangan paspor, apa yang akan kamu lakukan?", "Dengan anggapan toko itu buka, kita bisa membelinya hari ini."] }, vi: { examples: ["Giả sử bạn làm mất hộ chiếu, bạn sẽ làm gì?", "Giả sử cửa hàng đang mở cửa, hôm nay chúng ta có thể mua nó."] } } }
          - { level: B2, word: { term: even if }, use: { en: "the result is the same in any case", uk: "результат той самий за будь-яких обставин", es: "el resultado es el mismo en cualquier caso", pt: "o resultado é o mesmo em qualquer caso", fr: "le résultat est le même dans tous les cas", de: "das Ergebnis ist in jedem Fall dasselbe", it: "il risultato è lo stesso in ogni caso", pl: "wynik jest ten sam w każdym przypadku", tr: "sonuç her durumda aynıdır", id: "hasilnya sama dalam setiap keadaan", vi: "kết quả vẫn như nhau trong mọi trường hợp" }, ex: ["I'll go ", { target: even if }, " it rains."], tr: { uk: "Я піду, навіть якщо піде дощ.", es: "Iré aunque llueva.", pt: "Eu vou mesmo que chova.", fr: "J’irai même s’il pleut.", de: "Ich gehe, auch wenn es regnet.", it: "Andrò anche se piove.", pl: "Pójdę, nawet jeśli będzie padać.", tr: "Yağmur yağsa bile giderim.", id: "Saya akan pergi walaupun hujan.", vi: "Tôi vẫn sẽ đi dù trời có mưa." } }
          - { level: B2, word: { term: only if }, use: { en: "and in no other case", uk: "і в жодному іншому випадку", es: "y en ningún otro caso", pt: "e em nenhum outro caso", fr: "et dans aucun autre cas", de: "und in keinem anderen Fall", it: "e in nessun altro caso", pl: "i w żadnym innym przypadku", tr: "ve başka hiçbir durumda değil", id: "dan tidak dalam keadaan lain", vi: "và không trong trường hợp nào khác" }, ex: ["You can leave ", { target: only if }, " you have finished."], tr: { uk: "Ти можеш піти лише тоді, коли закінчиш.", es: "Solo puedes irte si has terminado.", pt: "Você só pode sair se tiver terminado.", fr: "Tu peux partir seulement si tu as terminé.", de: "Du darfst nur gehen, wenn du fertig bist.", it: "Puoi andare solo se hai finito.", pl: "Możesz wyjść tylko wtedy, gdy skończysz.", tr: "Ancak işini bitirdiysen gidebilirsin.", id: "Kamu boleh pergi hanya jika kamu sudah selesai.", vi: "Bạn chỉ được đi nếu bạn đã làm xong." } }
          - { level: B2, word: { term: in case }, use: { en: "as a precaution, because it may happen", uk: "про всяк випадок, бо це може статися", es: "por precaución, porque puede ocurrir", pt: "por precaução, porque pode acontecer", fr: "par précaution, parce que cela peut arriver", de: "als Vorsichtsmaßnahme, weil es passieren kann", it: "per precauzione, perché può succedere", pl: "na wszelki wypadek, bo to może się zdarzyć", tr: "önlem olarak, çünkü olabilir", id: "sebagai tindakan berjaga-jaga, karena hal itu mungkin terjadi", vi: "để phòng xa, vì điều đó có thể xảy ra" }, ex: ["Take a coat ", { target: in case }, " it gets cold."], tr: { uk: "Візьми пальто на випадок, якщо похолодає.", es: "Lleva un abrigo por si hace frío.", pt: "Leve um casaco, caso esfrie.", fr: "Prends un manteau au cas où il ferait froid.", de: "Nimm einen Mantel mit, für den Fall, dass es kalt wird.", it: "Prendi un cappotto, nel caso faccia freddo.", pl: "Weź płaszcz na wypadek, gdyby się ochłodziło.", tr: "Hava soğursa diye bir mont al.", id: "Bawalah mantel untuk berjaga-jaga kalau cuaca menjadi dingin.", vi: "Hãy mang theo áo khoác phòng khi trời trở lạnh." } }
          - { level: B2, word: { alternatives: [{ term: otherwise }, { term: or else }] }, use: { en: "if not; the result of the opposite", uk: "якщо ні; результат протилежного", es: "si no; el resultado de lo contrario", pt: "se não; o resultado do contrário", fr: "sinon ; le résultat du contraire", de: "wenn nicht; das Ergebnis des Gegenteils", it: "altrimenti; il risultato del contrario", pl: "jeśli nie; skutek odwrotnej sytuacji", tr: "aksi halde; tersinin sonucu", id: "kalau tidak; akibat dari kebalikannya", vi: "nếu không; kết quả của điều ngược lại" }, ex: { examples: [["Hurry up. ", { target: Otherwise }, ", we'll miss the train."], ["Be quiet, ", { target: or else }, " you'll wake the baby."]] }, tr: { uk: { examples: ["Поспішай. Інакше ми запізнимося на потяг.", "Тихіше, а то розбудиш малюка."] }, es: { examples: ["Date prisa. Si no, perderemos el tren.", "Guarda silencio, o despertarás al bebé."] }, pt: { examples: ["Ande logo. Senão, vamos perder o trem.", "Fique quieto, senão você vai acordar o bebê."] }, fr: { examples: ["Dépêche-toi. Sinon, nous raterons le train.", "Sois silencieux, sinon tu vas réveiller le bébé."] }, de: { examples: ["Beeil dich. Sonst verpassen wir den Zug.", "Sei leise, sonst weckst du das Baby auf."] }, it: { examples: ["Sbrigati. Altrimenti perderemo il treno.", "Fai silenzio, altrimenti sveglierai il bambino."] }, pl: { examples: ["Pospiesz się. W przeciwnym razie spóźnimy się na pociąg.", "Bądź cicho, bo obudzisz dziecko."] }, tr: { examples: ["Acele et. Yoksa treni kaçıracağız.", "Sessiz ol, yoksa bebeği uyandırırsın."] }, id: { examples: ["Cepatlah. Kalau tidak, kita akan ketinggalan kereta.", "Diamlah, kalau tidak kamu akan membangunkan bayinya."] }, vi: { examples: ["Nhanh lên. Nếu không, chúng ta sẽ lỡ chuyến tàu.", "Im lặng đi, nếu không bạn sẽ đánh thức em bé."] } } }
          - { level: B2, word: { term: if only }, use: { en: "a strong wish or regret", uk: "сильне бажання або жаль", es: "un deseo fuerte o un arrepentimiento", pt: "um forte desejo ou arrependimento", fr: "un vif souhait ou un regret", de: "ein starker Wunsch oder Bedauern", it: "un forte desiderio o rimpianto", pl: "silne pragnienie lub żal", tr: "güçlü bir istek ya da pişmanlık", id: "keinginan kuat atau penyesalan", vi: "mong ước mạnh mẽ hoặc sự nuối tiếc" }, ex: { examples: [[{ target: If only }, " I had more time."], [{ target: If only }, " I had listened."]] }, tr: { uk: { examples: ["Якби ж у мене було більше часу.", "Якби ж я послухав."] }, es: { examples: ["Ojalá tuviera más tiempo.", "Ojalá hubiera escuchado."] }, pt: { examples: ["Se ao menos eu tivesse mais tempo.", "Se ao menos eu tivesse escutado."] }, fr: { examples: ["Si seulement j’avais plus de temps.", "Si seulement j’avais écouté."] }, de: { examples: ["Hätte ich nur mehr Zeit.", "Hätte ich nur zugehört."] }, it: { examples: ["Se solo avessi più tempo.", "Se solo avessi ascoltato."] }, pl: { examples: ["Gdybym tylko miał więcej czasu.", "Gdybym tylko posłuchał."] }, tr: { examples: ["Keşke daha çok zamanım olsa.", "Keşke dinleseydim."] }, id: { examples: ["Andai saja saya punya lebih banyak waktu.", "Andai saja saya mendengarkan."] }, vi: { examples: ["Giá mà tôi có nhiều thời gian hơn.", "Giá mà tôi đã nghe lời."] } } }
          - { level: C2, word: { alternatives: [{ term: if only for }, { term: if only to }] }, use: { en: "even if for this one reason alone", uk: "навіть якщо лише з цієї однієї причини", es: "aunque sea solo por esta razón", pt: "nem que seja só por este motivo", fr: "ne serait-ce que pour cette seule raison", de: "und sei es nur aus diesem einen Grund", it: "anche solo per questo unico motivo", pl: "choćby tylko z tego jednego powodu", tr: "yalnızca bu tek neden için bile olsa", id: "walaupun hanya karena satu alasan ini", vi: "dù chỉ vì lý do duy nhất này" }, ex: { examples: [["Stay a little longer, ", { target: if only for }, " an hour."], ["Call her, ", { target: if only to }, " say sorry."]] }, tr: { uk: { examples: ["Побудь ще трохи, хоча б годину.", "Зателефонуй їй, хоча б щоб вибачитися."] }, es: { examples: ["Quédate un poco más, aunque sea una hora.", "Llámala, aunque sea para pedirle perdón."] }, pt: { examples: ["Fique um pouco mais, nem que seja por uma hora.", "Ligue para ela, nem que seja para pedir desculpas."] }, fr: { examples: ["Reste encore un peu, ne serait-ce qu’une heure.", "Appelle-la, ne serait-ce que pour t’excuser."] }, de: { examples: ["Bleib noch ein bisschen, und sei es nur für eine Stunde.", "Ruf sie an, und sei es nur, um dich zu entschuldigen."] }, it: { examples: ["Resta ancora un po', anche solo per un'ora.", "Chiamala, anche solo per scusarti."] }, pl: { examples: ["Zostań jeszcze trochę, choćby na godzinę.", "Zadzwoń do niej, choćby tylko po to, żeby przeprosić."] }, tr: { examples: ["Biraz daha kal, bir saat için bile olsa.", "Onu ara, sırf özür dilemek için bile olsa."] }, id: { examples: ["Tinggallah sebentar lagi, walaupun hanya satu jam.", "Telepon dia, walaupun hanya untuk meminta maaf."] }, vi: { examples: ["Ở lại thêm một chút nữa, dù chỉ một tiếng.", "Hãy gọi cho cô ấy, dù chỉ để xin lỗi."] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              en: [{ term: as long as }, " and ", { term: provided that }, " take a present form for the future."]
              uk: [{ term: "as long as" }, " і ", { term: "provided that" }, " вимагають теперішньої форми для майбутнього."]
              es: [{ term: "as long as" }, " y ", { term: "provided that" }, " llevan una forma de presente para el futuro."]
              pt: [{ term: "as long as" }, " e ", { term: "provided that" }, " levam uma forma do presente para o futuro."]
              fr: [{ term: "as long as" }, " et ", { term: "provided that" }, " prennent une forme du présent pour le futur."]
              de: [{ term: "as long as" }, " und ", { term: "provided that" }, " verlangen eine Präsensform für die Zukunft."]
