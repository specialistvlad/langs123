              vi: ["Quá khứ đơn trong mệnh đề ", { term: "if" }, " nói về hiện tại hoặc tương lai."]
          - type: rule
            level: B1
            text:
              en: [{ term: were }, " works for every person: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " is common in informal speech."]
              uk: [{ term: were }, " вживається з усіма особами: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " поширене в неформальному мовленні."]
              es: [{ term: were }, " se usa con todas las personas: ", { term: "If he were here, he'd help" }, ". ", { term: was }, " es común en el habla informal."]
              pt: [{ term: "were" }, " vale para todas as pessoas: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " é comum na fala informal."]
              fr: [{ term: "were" }, " s’emploie avec toutes les personnes : ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " est courant dans la langue familière."]
              de: [{ term: "were" }, " gilt für alle Personen: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " ist in der Umgangssprache üblich."]
              it: [{ term: "were" }, " vale per tutte le persone: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " è comune nel parlato informale."]
              pl: [{ term: "were" }, " pasuje do wszystkich osób: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " jest częste w mowie nieformalnej."]
              tr: [{ term: "were" }, " tüm kişilerle kullanılır: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " resmî olmayan konuşmada yaygındır."]
              id: [{ term: "were" }, " dipakai untuk semua orang: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " umum dipakai dalam percakapan informal."]
              vi: [{ term: "were" }, " dùng cho mọi ngôi: ", { term: "If he were here, he'd help" }, ". ", { term: "was" }, " phổ biến trong văn nói thân mật."]
          - type: rule
            level: B1
            text:
              en: ["The main clause can also use ", { term: could }, " or ", { term: might }, ":"]
              uk: ["У головному реченні можуть стояти також ", { term: could }, " або ", { term: might }, ":"]
              es: ["La oración principal también puede llevar ", { term: could }, " o ", { term: might }, ":"]
              pt: ["A oração principal também pode ter ", { term: "could" }, " ou ", { term: "might" }, ":"]
              fr: ["La proposition principale peut aussi contenir ", { term: "could" }, " ou ", { term: "might" }, " :"]
              de: ["Der Hauptsatz kann auch ", { term: "could" }, " oder ", { term: "might" }, " enthalten:"]
              it: ["La proposizione principale può avere anche ", { term: "could" }, " o ", { term: "might" }, ":"]
              pl: ["W zdaniu głównym mogą stać także ", { term: "could" }, " lub ", { term: "might" }, ":"]
              tr: ["Ana cümlede ", { term: "could" }, " veya ", { term: "might" }, " da kullanılabilir:"]
              id: ["Klausa utama juga dapat memakai ", { term: "could" }, " atau ", { term: "might" }, ":"]
              vi: ["Mệnh đề chính cũng có thể dùng ", { term: "could" }, " hoặc ", { term: "might" }, ":"]
            ex: ["If I had time, I ", { target: could }, " help."]
            tr: { uk: "Якби в мене був час, я міг би допомогти.", es: "Si tuviera tiempo, podría ayudar.", pt: "Se eu tivesse tempo, poderia ajudar.", fr: "Si j’avais le temps, je pourrais aider.", de: "Wenn ich Zeit hätte, könnte ich helfen.", it: "Se avessi tempo, potrei aiutare.", pl: "Gdybym miał czas, mógłbym pomóc.", tr: "Zamanım olsa yardım edebilirdim.", id: "Seandainya saya punya waktu, saya bisa membantu.", vi: "Nếu tôi có thời gian, tôi có thể giúp." }

