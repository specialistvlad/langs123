              vi: [{ term: "as long as" }, " và ", { term: "provided that" }, " dùng dạng hiện tại để nói về tương lai."]
            ex: ["We'll stay ", { target: as long as }, " you ", { target: need }, " us."]
            tr: { uk: "Ми залишимося, поки ми вам потрібні.", es: "Nos quedaremos mientras nos necesiten.", pt: "Vamos ficar enquanto vocês precisarem de nós.", fr: "Nous resterons tant que vous aurez besoin de nous.", de: "Wir bleiben, solange ihr uns braucht.", it: "Resteremo finché avrete bisogno di noi.", pl: "Zostaniemy, dopóki będziecie nas potrzebować.", tr: "Bize ihtiyacınız olduğu sürece kalacağız.", id: "Kami akan tinggal selama kalian membutuhkan kami.", vi: "Chúng tôi sẽ ở lại chừng nào các bạn còn cần chúng tôi." }
          - type: rule
            level: B2
            text:
              en: [{ term: otherwise }, " and ", { term: or else }, " start a new clause after a full stop, a semicolon or a comma."]
