          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [if, { slot: subject }, were to, { slot: base verb }] }, use: { en: "an unlikely or purely imagined event", uk: "малоймовірна або суто уявна подія", es: "un hecho poco probable o puramente imaginado", pt: "um evento improvável ou puramente imaginado", fr: "un événement peu probable ou purement imaginé", de: "ein unwahrscheinliches oder rein vorgestelltes Ereignis", it: "un evento improbabile o puramente immaginato", pl: "zdarzenie mało prawdopodobne lub czysto wyobrażone", tr: "olası olmayan ya da tamamen hayal edilen bir olay", id: "peristiwa yang kecil kemungkinannya atau murni khayalan", vi: "một sự việc khó xảy ra hoặc hoàn toàn do tưởng tượng" }, ex: { examples: [["If you ", { target: were to win }, ", what would you do?"], ["If the plan ", { target: were to fail }, ", we would start again."]] }, tr: { uk: { examples: ["Якби ти раптом виграв, що б ти зробив?", "Якби план раптом провалився, ми почали б спочатку."] }, es: { examples: ["Si llegaras a ganar, ¿qué harías?", "Si el plan llegara a fracasar, empezaríamos de nuevo."] }, pt: { examples: ["Se você viesse a ganhar, o que faria?", "Se o plano viesse a fracassar, começaríamos de novo."] }, fr: { examples: ["Si tu venais à gagner, que ferais-tu ?", "Si le plan venait à échouer, nous recommencerions."] }, de: { examples: ["Falls du gewinnen solltest, was würdest du tun?", "Falls der Plan scheitern sollte, würden wir von vorn anfangen."] }, it: { examples: ["Se dovessi vincere, che cosa faresti?", "Se il piano dovesse fallire, ricominceremmo da capo."] }, pl: { examples: ["Gdybyś miał wygrać, co byś zrobił?", "Gdyby plan miał się nie udać, zaczęlibyśmy od nowa."] }, tr: { examples: ["Kazanacak olsan ne yapardın?", "Plan başarısız olacak olsa baştan başlardık."] }, id: { examples: ["Seandainya kamu sampai menang, apa yang akan kamu lakukan?", "Seandainya rencana itu sampai gagal, kita akan memulai lagi."] }, vi: { examples: ["Nếu bạn có thắng, bạn sẽ làm gì?", "Nếu kế hoạch có thất bại, chúng ta sẽ bắt đầu lại."] } } }
          - { level: C1, form: { pattern: [if, { slot: subject }, should, { slot: base verb }] }, use: { en: "an unlikely event; the main clause often gives an instruction", uk: "малоймовірна подія; головне речення часто містить вказівку", es: "un hecho poco probable; la oración principal suele dar una instrucción", pt: "um evento improvável; a oração principal costuma dar uma instrução", fr: "un événement peu probable ; la proposition principale donne souvent une consigne", de: "ein unwahrscheinliches Ereignis; der Hauptsatz enthält oft eine Anweisung", it: "un evento improbabile; la proposizione principale dà spesso un'istruzione", pl: "zdarzenie mało prawdopodobne; zdanie główne często zawiera polecenie", tr: "olası olmayan bir olay; ana cümle çoğu zaman bir talimat verir", id: "peristiwa yang kecil kemungkinannya; klausa utama sering berisi instruksi", vi: "một sự việc khó xảy ra; mệnh đề chính thường đưa ra chỉ dẫn" }, ex: { examples: [["If anyone ", { target: should call }, ", take a message."], ["If you ", { target: should change }, " your mind, tell me."]] }, tr: { uk: { examples: ["Якщо раптом хтось зателефонує, запишіть повідомлення.", "Якщо ти раптом передумаєш, скажи мені."] }, es: { examples: ["Si llegara a llamar alguien, toma nota del mensaje.", "Si llegaras a cambiar de opinión, dímelo."] }, pt: { examples: ["Se alguém por acaso ligar, anote o recado.", "Se você por acaso mudar de ideia, me avise."] }, fr: { examples: ["Si jamais quelqu’un appelle, prends un message.", "Si jamais tu changes d’avis, dis-le-moi."] }, de: { examples: ["Falls jemand anrufen sollte, nimm eine Nachricht entgegen.", "Falls du es dir anders überlegen solltest, sag mir Bescheid."] }, it: { examples: ["Se dovesse telefonare qualcuno, prendi un messaggio.", "Se dovessi cambiare idea, dimmelo."] }, pl: { examples: ["Gdyby ktoś zadzwonił, zapisz wiadomość.", "Gdybyś zmienił zdanie, powiedz mi."] }, tr: { examples: ["Biri arayacak olursa not al.", "Fikrini değiştirirsen bana söyle."] }, id: { examples: ["Jika ada yang sampai menelepon, catat pesannya.", "Jika kamu sampai berubah pikiran, beri tahu saya."] }, vi: { examples: ["Nếu có ai gọi đến, hãy ghi lại lời nhắn.", "Nếu bạn có đổi ý, hãy nói với tôi."] } } }
