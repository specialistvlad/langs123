title: { en: Questions and negatives, uk: Питання та заперечення, es: Preguntas y negaciones, pt: "Perguntas e negações", fr: "Questions et négations", de: "Fragen und Verneinung", it: "Domande e negazioni", pl: "Pytania i przeczenia", tr: "Sorular ve olumsuz cümleler", id: "Pertanyaan dan kalimat negatif", vi: "Câu hỏi và câu phủ định" }
summary:
  lead:
    en: ["Yes/no questions, wh-questions, short answers and negatives, with ", { term: be }, ", modals and every other verb."]
    uk: ["Загальні та спеціальні питання, короткі відповіді й заперечення з ", { term: be }, ", модальними й усіма іншими дієсловами."]
    es: ["Preguntas de sí o no y con palabra interrogativa, respuestas cortas y negaciones con ", { term: be }, ", verbos modales y los demás verbos."]
    pt: ["Perguntas de sim ou não e com palavra interrogativa, respostas curtas e negações com ", { term: "be" }, ", verbos modais e os demais verbos."]
    fr: ["Questions fermées, questions en wh-, réponses courtes et négations, avec ", { term: "be" }, ", les modaux et tous les autres verbes."]
    de: ["Ja-Nein-Fragen, W-Fragen, Kurzantworten und Verneinung mit ", { term: "be" }, ", Modalverben und allen anderen Verben."]
    it: ["Domande sì o no, domande con wh-, risposte brevi e negazioni, con ", { term: "be" }, ", i verbi modali e tutti gli altri verbi."]
    pl: ["Pytania ogólne i szczegółowe, krótkie odpowiedzi oraz przeczenia z ", { term: "be" }, ", czasownikami modalnymi i wszystkimi innymi czasownikami."]
    tr: ["Evet/hayır soruları, wh- soruları, kısa cevaplar ve olumsuz cümleler; ", { term: "be" }, ", modal fiiller ve diğer tüm fiillerle."]
    id: ["Pertanyaan ya atau tidak, pertanyaan wh-, jawaban singkat, dan kalimat negatif, dengan ", { term: "be" }, ", kata kerja modal, dan kata kerja lain."]
    vi: ["Câu hỏi, câu trả lời ngắn và câu phủ định với ", { term: "be" }, ", động từ khuyết thiếu và động từ thường."]
  rule:
    en: [{ term: Be }, " and modals invert or take ", { term: not }, "; other verbs use ", { term: do }, ", ", { term: does }, " or ", { term: did }, " with the base verb:"]
    uk: [{ term: Be }, " і модальні дієслова стають перед підметом або беруть ", { term: not }, "; інші дієслова вживають ", { term: do }, ", ", { term: does }, " чи ", { term: did }, " з початковою формою:"]
    es: [{ term: Be }, " y los verbos modales van antes del sujeto o llevan ", { term: not }, "; los demás verbos usan ", { term: do }, ", ", { term: does }, " o ", { term: did }, " con la forma base:"]
    pt: [{ term: "Be" }, " e os verbos modais vão antes do sujeito ou levam ", { term: "not" }, "; os demais verbos usam ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }, " com a forma base:"]
    fr: [{ term: "Be" }, " et les modaux s’inversent ou prennent ", { term: "not" }, " ; les autres verbes emploient ", { term: "do" }, ", ", { term: "does" }, " ou ", { term: "did" }, " avec la base verbale :"]
    de: [{ term: "Be" }, " und Modalverben stehen vor dem Subjekt oder nehmen ", { term: "not" }, "; andere Verben nehmen ", { term: "do" }, ", ", { term: "does" }, " oder ", { term: "did" }, " mit der Grundform:"]
    it: [{ term: "Be" }, " e i verbi modali vanno prima del soggetto o prendono ", { term: "not" }, "; gli altri verbi usano ", { term: "do" }, ", ", { term: "does" }, " o ", { term: "did" }, " con la forma base:"]
    pl: [{ term: "Be" }, " i czasowniki modalne stają przed podmiotem lub przyjmują ", { term: "not" }, "; pozostałe czasowniki używają ", { term: "do" }, ", ", { term: "does" }, " lub ", { term: "did" }, " z formą podstawową:"]
    tr: [{ term: "Be" }, " ve modal fiiller öznenin önüne geçer ya da ", { term: "not" }, " alır; diğer fiiller yalın fiille birlikte ", { term: "do" }, ", ", { term: "does" }, " veya ", { term: "did" }, " kullanır:"]
    id: [{ term: "Be" }, " dan kata kerja modal mendahului subjek atau diikuti ", { term: "not" }, "; kata kerja lain memakai ", { term: "do" }, ", ", { term: "does" }, ", atau ", { term: "did" }, " dengan kata kerja dasar:"]
    vi: [{ term: "Be" }, " và động từ khuyết thiếu đứng trước chủ ngữ hoặc có ", { term: "not" }, "; động từ thường dùng ", { term: "do" }, ", ", { term: "does" }, ", ", { term: "did" }, " với động từ nguyên mẫu:"]
  ex: [{ target: Do }, " you ", { target: like }, " tea?"]

