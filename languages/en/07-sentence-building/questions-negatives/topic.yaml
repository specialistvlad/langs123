              fr: [{ term: "be" }, " et ", { term: "can" }, ", ", { term: "will" }, ", ", { term: "should" }, ", ", { term: "must" }, " n’ont pas besoin de ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
