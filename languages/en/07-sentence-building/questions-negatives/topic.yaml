  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: be }, " and modal verbs invert with the subject or take ", { term: not }, ". Other verbs use ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: [{ term: be }, " і модальні дієслова міняються місцями з підметом або беруть ", { term: not }, ". Інші дієслова вживають ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: [{ term: be }, " y los verbos modales se invierten con el sujeto o llevan ", { term: not }, ". Los demás verbos usan ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              pt: [{ term: "be" }, " e os verbos modais vão antes do sujeito ou levam ", { term: "not" }, ". Os demais verbos usam ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              fr: [{ term: "be" }, " et les verbes modaux s’inversent avec le sujet ou prennent ", { term: "not" }, ". Les autres verbes emploient ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              de: [{ term: "be" }, " und Modalverben stehen vor dem Subjekt oder nehmen ", { term: "not" }, ". Andere Verben nehmen ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              it: [{ term: "be" }, " e i verbi modali vanno prima del soggetto o prendono ", { term: "not" }, ". Gli altri verbi usano ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              pl: [{ term: "be" }, " i czasowniki modalne stają przed podmiotem lub przyjmują ", { term: "not" }, ". Pozostałe czasowniki używają ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              tr: [{ term: "be" }, " ve modal fiiller özneyle yer değiştirir ya da ", { term: "not" }, " alır. Diğer fiiller ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " kullanır."]
              id: [{ term: "be" }, " dan kata kerja modal bertukar tempat dengan subjek atau diikuti ", { term: "not" }, ". Kata kerja lain memakai ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              vi: [{ term: "be" }, " và động từ khuyết thiếu đổi chỗ với chủ ngữ hoặc đi với ", { term: "not" }, ". Động từ thường dùng ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
          - type: rule
            level: A1
            text:
              en: Every question and negative sentence has a subject.
              uk: "Кожне питання й заперечне речення має підмет."
              es: "Toda pregunta y toda oración negativa tiene sujeto."
              pt: "Toda pergunta e toda frase negativa tem sujeito."
              fr: "Toute question et toute phrase négative a un sujet."
              de: "Jede Frage und jeder verneinte Satz hat ein Subjekt."
              it: "Ogni domanda e ogni frase negativa ha un soggetto."
              pl: "Każde pytanie i każde zdanie przeczące ma podmiot."
              tr: "Her soru ve olumsuz cümlenin bir öznesi vardır."
              id: "Setiap pertanyaan dan kalimat negatif memiliki subjek."
              vi: "Câu hỏi và câu phủ định nào cũng có chủ ngữ."

