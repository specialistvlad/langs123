          - { key: means, label: { en: It means, uk: "Що означає", es: "Significa", pt: "Significa", fr: "Sens", de: "Bedeutet", it: "Significa", pl: "Znaczy", tr: "Anlamı", id: "Artinya", vi: "Có nghĩa là" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, form: not bad, means: { en: "quite good, sometimes very good", uk: "досить добре, інколи дуже добре", es: "bastante bueno, a veces muy bueno", pt: "bastante bom, às vezes muito bom", fr: "plutôt bon, parfois très bon", de: "ziemlich gut, manchmal sehr gut", it: "abbastanza buono, a volte molto buono", pl: "całkiem dobry, czasem bardzo dobry", tr: "oldukça iyi, bazen çok iyi", id: "cukup bagus, kadang sangat bagus", vi: "khá tốt, đôi khi rất tốt" }, ex: ["The soup is ", { target: "not bad" }, "."], tr: { uk: "Суп непоганий.", es: "La sopa no está mal.", pt: "A sopa não está ruim.", fr: "La soupe n’est pas mauvaise.", de: "Die Suppe ist nicht schlecht.", it: "La zuppa non è male.", pl: "Zupa jest niezła.", tr: "Çorba fena değil.", id: "Supnya lumayan.", vi: "Món súp không tệ." } }
          - { level: C2, form: not unlike, means: { en: "similar to", uk: "схожий на", es: "parecido a", pt: "parecido com", fr: "semblable à", de: "ähnlich wie", it: "simile a", pl: "podobny do", tr: "benzer", id: "mirip dengan", vi: "giống với" }, ex: ["Her style is ", { target: "not unlike" }, " her mother's."], tr: { uk: "Її стиль чимось схожий на мамин.", es: "Su estilo se parece bastante al de su madre.", pt: "O estilo dela não é diferente do da mãe.", fr: "Son style n’est pas sans rappeler celui de sa mère.", de: "Ihr Stil ist dem ihrer Mutter nicht unähnlich.", it: "Il suo stile non è dissimile da quello di sua madre.", pl: "Jej styl nie jest niepodobny do stylu jej matki.", tr: "Tarzı annesininkine benziyor sayılır.", id: "Gayanya tidak berbeda dari gaya ibunya.", vi: "Phong cách của cô ấy không khác phong cách của mẹ cô ấy." } }
          - { level: C2, form: not a little, means: { en: "very", uk: "дуже", es: "muy", pt: "muito", fr: "très", de: "sehr", it: "molto", pl: "bardzo", tr: "çok", id: "sangat", vi: "rất" }, ex: ["I was ", { target: "not a little" }, " surprised."], tr: { uk: "Я був неабияк здивований.", es: "Me sorprendió muchísimo.", pt: "Fiquei muito surpreso.", fr: "J’ai été fort surpris.", de: "Ich war nicht wenig überrascht.", it: "Sono rimasto non poco sorpreso.", pl: "Byłem niemało zdziwiony.", tr: "Hiç de az şaşırmadım.", id: "Saya tidak sedikit terkejut.", vi: "Tôi đã ngạc nhiên không ít." } }
          - { level: C2, form: no small achievement, means: { en: "a great achievement", uk: "велике досягнення", es: "un gran logro", pt: "uma grande conquista", fr: "une grande réussite", de: "eine große Leistung", it: "un grande risultato", pl: "wielkie osiągnięcie", tr: "büyük bir başarı", id: "pencapaian yang besar", vi: "một thành tích lớn" }, ex: ["Finishing in a week was ", { target: "no small achievement" }, "."], tr: { uk: "Закінчити за тиждень — це чималий здобуток.", es: "Terminar en una semana no fue poca cosa.", pt: "Terminar em uma semana não foi pouca coisa.", fr: "Finir en une semaine n’était pas une mince affaire.", de: "In einer Woche fertig zu werden, war keine kleine Leistung.", it: "Finire in una settimana non è stato un risultato da poco.", pl: "Skończenie w tydzień to nie lada osiągnięcie.", tr: "Bir haftada bitirmek küçümsenecek bir başarı değildi.", id: "Menyelesaikannya dalam seminggu bukan pencapaian yang kecil.", vi: "Hoàn thành trong một tuần không phải là thành tích nhỏ." } }
          - { level: C2, form: not without, means: { en: "with some", uk: "з певним", es: "con algún", pt: "com algum", fr: "avec un certain", de: "mit einigem", it: "con qualche", pl: "z pewnym", tr: "bir miktar", id: "dengan sedikit", vi: "có một chút" }, ex: ["The plan is ", { target: "not without" }, " risk."], tr: { uk: "Цей план не позбавлений ризику.", es: "El plan no está exento de riesgos.", pt: "O plano não é isento de riscos.", fr: "Le plan n’est pas sans risque.", de: "Der Plan ist nicht ohne Risiko.", it: "Il piano non è privo di rischi.", pl: "Plan nie jest pozbawiony ryzyka.", tr: "Planın riski yok değil.", id: "Rencana itu bukannya tanpa risiko.", vi: "Kế hoạch này không phải là không có rủi ro." } }
          - { level: C2, form: not infrequently, means: { en: "often", uk: "часто", es: "a menudo", pt: "com frequência", fr: "souvent", de: "oft", it: "spesso", pl: "często", tr: "sık sık", id: "sering", vi: "thường xuyên" }, ex: ["Delays happen ", { target: "not infrequently" }, "."], tr: { uk: "Затримки трапляються нерідко.", es: "Los retrasos no son infrecuentes.", pt: "Os atrasos não são raros.", fr: "Les retards ne sont pas rares.", de: "Verspätungen kommen nicht selten vor.", it: "I ritardi non sono rari.", pl: "Opóźnienia zdarzają się nierzadko.", tr: "Gecikmeler nadir değildir.", id: "Keterlambatan bukan hal yang jarang terjadi.", vi: "Sự chậm trễ không phải là hiếm." } }
          - { level: C2, form: hardly unexpected, means: { en: "quite expected", uk: "цілком очікуваний", es: "bastante esperado", pt: "bastante esperado", fr: "tout à fait attendu", de: "durchaus erwartet", it: "del tutto atteso", pl: "całkiem oczekiwany", tr: "oldukça beklenen", id: "cukup diharapkan", vi: "hoàn toàn nằm trong dự đoán" }, ex: ["The result was ", { target: "hardly unexpected" }, "."], tr: { uk: "Результат був аж ніяк не несподіваним.", es: "El resultado no fue nada inesperado.", pt: "O resultado não foi nada inesperado.", fr: "Le résultat n’avait rien d’inattendu.", de: "Das Ergebnis war kaum überraschend.", it: "Il risultato non era certo inatteso.", pl: "Wynik był raczej oczekiwany.", tr: "Sonuç hiç de beklenmedik değildi.", id: "Hasilnya hampir tidak mengejutkan.", vi: "Kết quả hầu như không bất ngờ." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "A negative joined to an opposite word states a fact mildly; the effect is formal or ironic.", uk: "Заперечення разом зі словом протилежного значення подає факт стримано; ефект офіційний або іронічний.", es: "Una negación unida a una palabra de sentido opuesto expone un hecho con suavidad; el efecto es formal o irónico.", pt: "Uma negação ligada a uma palavra de sentido oposto afirma um fato com suavidade; o efeito é formal ou irônico.", fr: "Une négation jointe à un mot de sens contraire énonce un fait avec modération ; l’effet est soutenu ou ironique.", de: "Eine Verneinung mit einem Gegenwort nennt eine Tatsache zurückhaltend; die Wirkung ist förmlich oder ironisch.", it: "Una negazione unita a una parola di significato opposto enuncia un fatto con moderazione; l'effetto è formale o ironico.", pl: "Przeczenie połączone ze słowem o przeciwnym znaczeniu przedstawia fakt łagodnie; efekt jest formalny lub ironiczny.", tr: "Zıt anlamlı bir sözcükle birleşen olumsuzluk bir olguyu yumuşak biçimde bildirir; etki resmî ya da alaycıdır.", id: "Negasi yang digabung dengan kata berlawanan menyatakan fakta dengan halus; efeknya formal atau ironis.", vi: "Phủ định ghép với từ trái nghĩa nêu sự việc nhẹ nhàng; hiệu quả trang trọng hoặc mỉa mai." }

  - title: { en: "Scope of negation", uk: "Сфера дії заперечення", es: "Alcance de la negación", pt: "Alcance da negação", fr: "Portée de la négation", de: "Reichweite der Verneinung", it: "Ambito della negazione", pl: "Zakres przeczenia", tr: "Olumsuzluğun kapsamı", id: "Cakupan negasi", vi: "Phạm vi của phủ định" }
    role: own
    content:
      - type: usage
        columns:
          - { key: quantity, label: { en: Word, uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: partial, label: { en: "Some, not all", uk: "Частина, не всі", es: "Algunos, no todos", pt: "Alguns, não todos", fr: "Certains, pas tous", de: "Einige, nicht alle", it: "Alcuni, non tutti", pl: "Niektóre, nie wszystkie", tr: "Bazıları, hepsi değil", id: "Sebagian, bukan semua", vi: "Một số, không phải tất cả" } }
          - { key: total, label: { en: None, uk: "Жоден", es: "Ninguno", pt: "Nenhum", fr: "Aucun", de: "Keiner", it: "Nessuno", pl: "Żaden", tr: "Hiçbiri", id: "Tidak ada", vi: "Không có" } }
        rows:
          - { level: C2, quantity: all, partial: { ex: [{ target: "Not all" }, " the guests came."], tr: { uk: "Не всі гості прийшли.", es: "No todos los invitados vinieron.", pt: "Nem todos os convidados vieram.", fr: "Tous les invités ne sont pas venus.", de: "Nicht alle Gäste sind gekommen.", it: "Non tutti gli ospiti sono venuti.", pl: "Nie wszyscy goście przyszli.", tr: "Misafirlerin hepsi gelmedi.", id: "Tidak semua tamu datang.", vi: "Không phải tất cả khách đều đến." } }, total: { ex: [{ target: None }, " of the guests came."], tr: { uk: "Жоден із гостей не прийшов.", es: "Ninguno de los invitados vino.", pt: "Nenhum dos convidados veio.", fr: "Aucun des invités n’est venu.", de: "Keiner der Gäste ist gekommen.", it: "Nessuno degli ospiti è venuto.", pl: "Żaden z gości nie przyszedł.", tr: "Misafirlerin hiçbiri gelmedi.", id: "Tidak ada tamu yang datang.", vi: "Không vị khách nào đến." } } }
          - { level: C2, quantity: both, partial: { ex: [{ target: "Not both" }, " of them are right."], tr: { uk: "Не обидва вони мають рацію.", es: "No los dos tienen razón.", pt: "Nem os dois estão certos.", fr: "Ils n’ont pas tous les deux raison.", de: "Nicht beide haben recht.", it: "Non hanno ragione entrambi.", pl: "Nie obaj mają rację.", tr: "İkisi birden haklı değil.", id: "Tidak keduanya benar.", vi: "Không phải cả hai đều đúng." } }, total: { ex: [{ target: Neither }, " of them is right."], tr: { uk: "Жоден із них не має рації.", es: "Ninguno de los dos tiene razón.", pt: "Nenhum dos dois está certo.", fr: "Aucun des deux n’a raison.", de: "Keiner von beiden hat recht.", it: "Nessuno dei due ha ragione.", pl: "Żaden z nich nie ma racji.", tr: "İkisi de haksız.", id: "Tidak satu pun dari mereka benar.", vi: "Cả hai đều không đúng." } } }
          - { level: C2, quantity: always, partial: { ex: ["She is ", { target: "not always" }, " late."], tr: { uk: "Вона не завжди запізнюється.", es: "No siempre llega tarde.", pt: "Ela nem sempre se atrasa.", fr: "Elle n’est pas toujours en retard.", de: "Sie kommt nicht immer zu spät.", it: "Non è sempre in ritardo.", pl: "Nie zawsze się spóźnia.", tr: "Her zaman geç kalmaz.", id: "Dia tidak selalu terlambat.", vi: "Cô ấy không phải lúc nào cũng đến muộn." } }, total: { ex: ["She is ", { target: never }, " late."], tr: { uk: "Вона ніколи не запізнюється.", es: "Nunca llega tarde.", pt: "Ela nunca se atrasa.", fr: "Elle n’est jamais en retard.", de: "Sie kommt nie zu spät.", it: "Non è mai in ritardo.", pl: "Nigdy się nie spóźnia.", tr: "Hiçbir zaman geç kalmaz.", id: "Dia tidak pernah terlambat.", vi: "Cô ấy không bao giờ đến muộn." } } }
          - { level: C2, quantity: everyone, partial: { ex: [{ target: "Not everyone" }, " agreed."], tr: { uk: "Не всі погодилися.", es: "No todos estuvieron de acuerdo.", pt: "Nem todos concordaram.", fr: "Tout le monde n’était pas d’accord.", de: "Nicht alle waren einverstanden.", it: "Non tutti erano d'accordo.", pl: "Nie wszyscy się zgodzili.", tr: "Herkes aynı fikirde değildi.", id: "Tidak semua orang setuju.", vi: "Không phải ai cũng đồng ý." } }, total: { ex: [{ target: "No one" }, " agreed."], tr: { uk: "Ніхто не погодився.", es: "Nadie estuvo de acuerdo.", pt: "Ninguém concordou.", fr: "Personne n’était d’accord.", de: "Niemand war einverstanden.", it: "Nessuno era d'accordo.", pl: "Nikt się nie zgodził.", tr: "Hiç kimse aynı fikirde değildi.", id: "Tidak ada yang setuju.", vi: "Không ai đồng ý." } } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: "In standard English two negatives cancel each other, and the sentence is positive.", uk: "У стандартній англійській два заперечення скасовують одне одного, і речення стає ствердним.", es: "En el inglés estándar dos negaciones se anulan entre sí, y la oración es afirmativa.", pt: "No inglês padrão, duas negações se anulam, e a frase é afirmativa.", fr: "En anglais standard, deux négations s’annulent, et la phrase est affirmative.", de: "Im Standardenglisch heben zwei Verneinungen einander auf, und der Satz ist positiv.", it: "Nell'inglese standard due negazioni si annullano e la frase è affermativa.", pl: "W standardowej angielszczyźnie dwa przeczenia znoszą się nawzajem, a zdanie jest twierdzące.", tr: "Standart İngilizcede iki olumsuzluk birbirini götürür ve cümle olumlu olur.", id: "Dalam bahasa Inggris standar, dua negasi saling meniadakan, dan kalimatnya menjadi positif.", vi: "Trong tiếng Anh chuẩn, hai phủ định triệt tiêu nhau và câu trở thành khẳng định." }
            ex: { equivalence: [["I ", { target: "can't not" }, " go."], "I have to go."] }
            tr: { uk: { equivalence: ["Я не можу не піти.", "Я мушу йти."] }, es: { equivalence: ["No puedo no ir.", "Tengo que ir."] }, pt: { equivalence: ["Não posso não ir.", "Eu tenho que ir."] }, fr: { equivalence: ["Je ne peux pas ne pas y aller.", "Je dois y aller."] }, de: { equivalence: ["Ich kann nicht nicht gehen.", "Ich muss gehen."] }, it: { equivalence: ["Non posso non andare.", "Devo andare."] }, pl: { equivalence: ["Nie mogę nie iść.", "Muszę iść."] }, tr: { equivalence: ["Gitmemek elimde değil.", "Gitmek zorundayım."] }, id: { equivalence: ["Saya tidak bisa tidak pergi.", "Saya harus pergi."] }, vi: { equivalence: ["Tôi không thể không đi.", "Tôi phải đi."] } }
          - type: rule
            level: C2
            text: { en: ["Emphasis adds a word such as ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " to one negative."], uk: ["Для підсилення до одного заперечення додають слово на кшталт ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, "."], es: ["Para enfatizar, se añade una palabra como ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " a una sola negación."], pt: ["Para dar ênfase, acrescenta-se uma palavra como ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " a uma única negação."], fr: ["Pour insister, on ajoute un mot comme ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " à une seule négation."], de: ["Zur Betonung tritt ein Wort wie ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " zu einer einzigen Verneinung."], it: ["Per enfatizzare si aggiunge una parola come ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " a un'unica negazione."], pl: ["Dla podkreślenia dodaje się do jednego przeczenia słowo takie jak ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, "."], tr: ["Vurgulamak için tek bir olumsuzluğa ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " gibi bir sözcük eklenir."], id: ["Untuk menekankan, satu negasi ditambah kata seperti ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, "."], vi: ["Để nhấn mạnh, thêm một từ như ", { alternatives: [{ term: "at all" }, { term: "whatsoever" }] }, " vào một phủ định duy nhất."] }
            ex: ["I have no time ", { target: whatsoever }, "."]
            tr: { uk: "У мене зовсім немає часу.", es: "No tengo nada de tiempo.", pt: "Não tenho tempo nenhum.", fr: "Je n’ai absolument pas le temps.", de: "Ich habe überhaupt keine Zeit.", it: "Non ho assolutamente tempo.", pl: "Nie mam absolutnie czasu.", tr: "Hiç vaktim yok.", id: "Saya sama sekali tidak punya waktu.", vi: "Tôi hoàn toàn không có thời gian." }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: [{ alternatives: [{ term: any }, { term: ever }, { term: "at all" }] }, " need a negative setting: a negative, a question, an if clause or a comparison."], uk: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " вимагають контексту заперечного типу: заперечення, питання, підрядного речення з if або порівняння."], es: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " necesitan un contexto negativo: una negación, una pregunta, una oración con if o una comparación."], pt: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " precisam de um contexto negativo: uma negação, uma pergunta, uma oração com if ou uma comparação."], fr: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " demandent un contexte négatif : une négation, une question, une proposition en if ou une comparaison."], de: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " brauchen einen negativen Zusammenhang: eine Verneinung, eine Frage, einen if-Satz oder einen Vergleich."], it: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " richiedono un contesto negativo: una negazione, una domanda, una proposizione con if o un confronto."], pl: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " wymagają kontekstu negatywnego: przeczenia, pytania, zdania z if lub porównania."], tr: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " için olumsuz bir bağlam gerekir: olumsuz cümle, soru, if cümleciği ya da karşılaştırma."], id: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " memerlukan konteks negatif: kalimat negatif, pertanyaan, klausa if, atau perbandingan."], vi: [{ alternatives: [{ term: "any" }, { term: "ever" }, { term: "at all" }] }, " cần một ngữ cảnh phủ định: câu phủ định, câu hỏi, mệnh đề if hoặc phép so sánh."] }
      - type: usage
        columns:
          - { key: context, label: { en: Setting, uk: "Контекст", es: "Contexto", pt: "Contexto", fr: "Contexte", de: "Zusammenhang", it: "Contesto", pl: "Kontekst", tr: "Bağlam", id: "Konteks", vi: "Ngữ cảnh" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C2, context: { en: "a negative", uk: "заперечення", es: "una negación", pt: "uma negação", fr: "une négation", de: "eine Verneinung", it: "una negazione", pl: "przeczenie", tr: "olumsuz cümle", id: "kalimat negatif", vi: "câu phủ định" }, ex: { examples: [["She doesn't have ", { target: any }, " friends here."], ["It didn't help ", { target: "at all" }, "."]] }, tr: { uk: { examples: ["У неї тут немає жодних друзів.", "Це зовсім не допомогло."] }, es: { examples: ["No tiene ningún amigo aquí.", "No ayudó en absoluto."] }, pt: { examples: ["Ela não tem nenhum amigo aqui.", "Isso não ajudou em nada."] }, fr: { examples: ["Elle n’a aucun ami ici.", "Cela n’a servi à rien."] }, de: { examples: ["Sie hat hier keine Freunde.", "Es hat überhaupt nicht geholfen."] }, it: { examples: ["Qui non ha nessun amico.", "Non è servito per niente."] }, pl: { examples: ["Nie ma tu żadnych przyjaciół.", "To wcale nie pomogło."] }, tr: { examples: ["Burada hiç arkadaşı yok.", "Hiç yardımı olmadı."] }, id: { examples: ["Dia tidak punya teman di sini.", "Itu sama sekali tidak membantu."] }, vi: { examples: ["Cô ấy không có người bạn nào ở đây.", "Điều đó không giúp ích gì cả."] } } }
          - { level: C2, context: { en: "a question", uk: "питання", es: "una pregunta", pt: "uma pergunta", fr: "une question", de: "eine Frage", it: "una domanda", pl: "pytanie", tr: "soru", id: "pertanyaan", vi: "câu hỏi" }, ex: { examples: [["Have you ", { target: ever }, " been to Rome?"], ["Do you have ", { target: any }, " questions?"]] }, tr: { uk: { examples: ["Ти коли-небудь був у Римі?", "У вас є якісь запитання?"] }, es: { examples: ["¿Alguna vez has estado en Roma?", "¿Tienen alguna pregunta?"] }, pt: { examples: ["Você já esteve em Roma?", "Vocês têm alguma pergunta?"] }, fr: { examples: ["As-tu déjà été à Rome ?", "Avez-vous des questions ?"] }, de: { examples: ["Warst du schon einmal in Rom?", "Haben Sie Fragen?"] }, it: { examples: ["Sei mai stato a Roma?", "Avete domande?"] }, pl: { examples: ["Czy kiedykolwiek byłeś w Rzymie?", "Czy macie jakieś pytania?"] }, tr: { examples: ["Hiç Roma’ya gittin mi?", "Sorunuz var mı?"] }, id: { examples: ["Apakah kamu pernah ke Roma?", "Apakah ada pertanyaan?"] }, vi: { examples: ["Bạn đã bao giờ đến Rome chưa?", "Bạn có câu hỏi nào không?"] } } }
