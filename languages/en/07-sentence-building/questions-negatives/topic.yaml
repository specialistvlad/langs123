              pt: ["Para ", { alternatives: [{ term: "do" }, { term: "does" }] }, ", ver ", { link: "Presente simples", to: "en.tenses.simple-tenses" }, "."]
              fr: ["Pour ", { alternatives: [{ term: "do" }, { term: "does" }] }, ", voir ", { link: "Présent simple", to: "en.tenses.simple-tenses" }, "."]
              de: ["Zu ", { alternatives: [{ term: "do" }, { term: "does" }] }, " siehe ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              it: ["Per ", { alternatives: [{ term: "do" }, { term: "does" }] }, ", vedi ", { link: "Present simple", to: "en.tenses.simple-tenses" }, "."]
              pl: ["O ", { alternatives: [{ term: "do" }, { term: "does" }] }, " zob. ", { link: "Present Simple", to: "en.tenses.simple-tenses" }, "."]
              tr: [{ alternatives: [{ term: "do" }, { term: "does" }] }, " için bkz. ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              id: ["Untuk ", { alternatives: [{ term: "do" }, { term: "does" }] }, " lihat ", { link: "Simple Present", to: "en.tenses.simple-tenses" }, "."]
              vi: ["Về ", { alternatives: [{ term: "do" }, { term: "does" }] }, " xem ", { link: "Hiện tại đơn", to: "en.tenses.simple-tenses" }, "."]

