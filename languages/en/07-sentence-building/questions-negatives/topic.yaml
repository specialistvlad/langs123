              es: ["Cuando la palabra interrogativa es el sujeto, la pregunta no lleva ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              pt: ["Quando a palavra interrogativa é o sujeito, a pergunta não leva ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              fr: ["Quand le mot interrogatif est le sujet, la question n’a pas de ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              de: ["Wenn das Fragewort das Subjekt ist, hat die Frage kein ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              it: ["Quando la parola interrogativa è il soggetto, la domanda non ha ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              pl: ["Gdy słowo pytające jest podmiotem, pytanie nie zawiera ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              tr: ["Soru sözcüğü özne olduğunda soruda ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, " bulunmaz."]
              id: ["Jika kata tanya adalah subjek, pertanyaan tidak memakai ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              vi: ["Khi từ để hỏi là chủ ngữ, câu hỏi không có ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
          - type: rule
            level: A1
            text:
              en: "The verb takes the tense directly:"
              uk: "Дієслово саме стоїть у потрібному часі:"
              es: "El verbo toma el tiempo verbal directamente:"
              pt: "O verbo recebe o tempo verbal diretamente:"
              fr: "Le verbe prend directement le temps :"
              de: "Das Verb steht direkt in der Zeitform:"
              it: "Il verbo prende direttamente il tempo verbale:"
              pl: "Czasownik przyjmuje formę czasu bezpośrednio:"
              tr: "Fiil zamanı doğrudan alır:"
              id: "Kata kerja langsung mengikuti tense:"
              vi: "Động từ tự chia theo thì:"
            ex: { examples: [[{ target: Who lives }, " here?"], [{ target: Who lived }, " here?"]] }
            tr: { uk: { examples: ["Хто тут живе?", "Хто тут жив?"] }, es: { examples: ["¿Quién vive aquí?", "¿Quién vivió aquí?"] }, pt: { examples: ["Quem mora aqui?", "Quem morou aqui?"] }, fr: { examples: ["Qui habite ici ?", "Qui a habité ici ?"] }, de: { examples: ["Wer wohnt hier?", "Wer hat hier gewohnt?"] }, it: { examples: ["Chi vive qui?", "Chi ha vissuto qui?"] }, pl: { examples: ["Kto tu mieszka?", "Kto tu mieszkał?"] }, tr: { examples: ["Burada kim yaşıyor?", "Burada kim yaşadı?"] }, id: { examples: ["Siapa yang tinggal di sini?", "Siapa yang dulu tinggal di sini?"] }, vi: { examples: ["Ai sống ở đây?", "Ai đã sống ở đây?"] } }

  - title: { en: "Form: short answers", uk: "Форма: короткі відповіді", es: "Forma: respuestas cortas", pt: "Forma: respostas curtas", fr: "Forme : réponses courtes", de: "Form: Kurzantworten", it: "Forma: risposte brevi", pl: "Forma: krótkie odpowiedzi", tr: "Biçim: kısa cevaplar", id: "Bentuk: jawaban singkat", vi: "Dạng: câu trả lời ngắn" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: question, label: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: "yes", label: { en: "Yes", uk: "Так", es: "Sí", pt: "Sim", fr: "Oui", de: "Ja", it: "Sì", pl: "Tak", tr: "Evet", id: "Ya", vi: "Có" }, features: { polarity: pos } }
          - { key: "no", label: { en: "No", uk: "Ні", es: "No", pt: "Não", fr: "Non", de: "Nein", it: "No", pl: "Nie", tr: "Hayır", id: "Tidak", vi: "Không" }, features: { polarity: neg } }
        rows:
          - { level: A1, question: Are you tired?, "yes": ["Yes, I ", { target: am }, "."], "no": ["No, I'", { target: m not }, "."] }
          - { level: A1, question: Can she swim?, "yes": ["Yes, she ", { target: can }, "."], "no": ["No, she ", { target: can't }, "."] }
          - { level: A1, question: Did he call?, "yes": ["Yes, he ", { target: did }, "."], "no": ["No, he ", { target: didn't }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A short answer repeats the ", { term: be }, ", modal or auxiliary verb from the question."]
              uk: ["Коротка відповідь повторює дієслово ", { term: be }, ", модальне чи допоміжне дієслово з питання."]
              es: ["La respuesta corta repite el verbo ", { term: be }, ", el modal o el auxiliar de la pregunta."]
              pt: ["A resposta curta repete o verbo ", { term: "be" }, ", o modal ou o auxiliar da pergunta."]
              fr: ["Une réponse courte reprend ", { term: "be" }, ", le modal ou l’auxiliaire de la question."]
              de: ["Die Kurzantwort wiederholt ", { term: "be" }, ", das Modalverb oder das Hilfsverb aus der Frage."]
              it: ["La risposta breve ripete il verbo ", { term: "be" }, ", il verbo modale o l'ausiliare della domanda."]
              pl: ["Krótka odpowiedź powtarza ", { term: "be" }, ", czasownik modalny lub pomocniczy z pytania."]
              tr: ["Kısa cevapta sorudaki ", { term: "be" }, ", modal ya da yardımcı fiil tekrarlanır."]
              id: ["Jawaban singkat mengulang ", { term: "be" }, ", kata kerja modal, atau kata kerja bantu dari pertanyaan."]
              vi: ["Câu trả lời ngắn lặp lại ", { term: "be" }, ", động từ khuyết thiếu hoặc trợ động từ trong câu hỏi."]
          - type: rule
            level: A1
            text:
              en: "A positive short answer keeps the full form:"
              uk: "Стверджувальна коротка відповідь має повну форму:"
              es: "La respuesta corta afirmativa conserva la forma completa:"
              pt: "A resposta curta afirmativa mantém a forma completa:"
              fr: "Une réponse courte affirmative garde la forme pleine :"
              de: "Eine bejahende Kurzantwort bleibt in der Langform:"
              it: "Una risposta breve affermativa mantiene la forma estesa:"
              pl: "Krótka odpowiedź twierdząca zachowuje formę pełną:"
              tr: "Olumlu kısa cevap tam biçimi korur:"
              id: "Jawaban singkat positif memakai bentuk lengkap:"
              vi: "Câu trả lời ngắn khẳng định giữ dạng đầy đủ:"
            ex: ["Yes, I ", { target: am }, "."]
            tr: { uk: "Так, втомився.", es: "Sí, lo estoy.", pt: "Sim, estou.", fr: "Oui, je le suis.", de: "Ja, bin ich.", it: "Sì, lo sono.", pl: "Tak, jestem.", tr: "Evet, öyleyim.", id: "Ya, benar.", vi: "Có, tôi mệt." }
          - type: note
            level: A1
            text:
              en: ["For ", { alternatives: [{ term: do }, { term: does }] }, " see ", { link: Present Simple, to: en.tenses.simple-tenses }, "."]
              uk: ["Про ", { alternatives: [{ term: do }, { term: does }] }, " див. ", { link: "Present Simple", to: en.tenses.simple-tenses }, "."]
