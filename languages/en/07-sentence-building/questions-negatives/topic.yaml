  - title: { en: "Form: negative contractions", uk: "Форма: скорочені форми заперечення", es: "Forma: contracciones negativas", pt: "Forma: contrações negativas", fr: "Forme : contractions négatives", de: "Form: verneinte Kurzformen", it: "Forma: contrazioni negative", pl: "Forma: skrócone formy przeczące", tr: "Biçim: olumsuz kısaltmalar", id: "Bentuk: kontraksi negatif", vi: "Dạng: các dạng phủ định rút gọn" }
