              fr: "À l’oral et dans les messages, on emploie les formes contractées. Les formes pleines ajoutent de l’insistance :"
              de: "Gesprochene Sprache und Nachrichten verwenden die Kurzformen. Die Langformen verleihen Nachdruck:"
              it: "Nel parlato e nei messaggi si usano le forme contratte. Le forme estese aggiungono enfasi:"
              pl: "W mowie i w wiadomościach używa się form skróconych. Formy pełne dodają nacisku:"
              tr: "Konuşmada ve mesajlarda kısa biçimler kullanılır. Tam biçimler vurgu katar:"
              id: "Percakapan dan pesan memakai bentuk singkat. Bentuk lengkap menambah penekanan:"
              vi: "Văn nói và tin nhắn dùng dạng rút gọn. Dạng đầy đủ nhấn mạnh hơn:"
