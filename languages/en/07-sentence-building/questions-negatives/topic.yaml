          - type: rule
            level: B2
            text: { en: [{ term: "Yes" }, " answers a positive fact and ", { term: "no" }, " a negative fact, whatever the form of the question."], uk: [{ term: "Yes" }, " відповідає на ствердний факт, а ", { term: "no" }, " — на заперечний, незалежно від форми питання."], es: [{ term: "Yes" }, " responde a un hecho afirmativo y ", { term: "no" }, " a un hecho negativo, sea cual sea la forma de la pregunta."], pt: [{ term: "Yes" }, " responde a um fato afirmativo e ", { term: "no" }, " a um fato negativo, qualquer que seja a forma da pergunta."], fr: [{ term: "Yes" }, " répond à un fait positif et ", { term: "no" }, " à un fait négatif, quelle que soit la forme de la question."], de: [{ term: "Yes" }, " antwortet auf eine bejahte Tatsache und ", { term: "no" }, " auf eine verneinte, unabhängig von der Form der Frage."], it: [{ term: "Yes" }, " risponde a un fatto positivo e ", { term: "no" }, " a un fatto negativo, qualunque sia la forma della domanda."], pl: [{ term: "Yes" }, " odpowiada na fakt pozytywny, a ", { term: "no" }, " na negatywny, bez względu na formę pytania."], tr: [{ term: "Yes" }, " olumlu bir duruma, ", { term: "no" }, " olumsuz bir duruma verilen cevaptır; sorunun biçimi fark etmez."], id: [{ term: "Yes" }, " menjawab fakta positif dan ", { term: "no" }, " menjawab fakta negatif, apa pun bentuk pertanyaannya."], vi: [{ term: "Yes" }, " trả lời sự việc khẳng định, ", { term: "no" }, " trả lời sự việc phủ định, dù câu hỏi dạng nào."] }
            ex: { exchange: ["Don't you like it?", ["No, I ", { target: "don't" }, "."]] }
            tr: { uk: { exchange: ["Тобі це не подобається?", "Ні, не подобається."] }, es: { exchange: ["¿No te gusta?", "No, no me gusta."] }, pt: { exchange: ["Você não gosta?", "Não, não gosto."] }, fr: { exchange: ["Ça ne te plaît pas ?", "Non, ça ne me plaît pas."] }, de: { exchange: ["Gefällt es dir nicht?", "Nein, es gefällt mir nicht."] }, it: { exchange: ["Non ti piace?", "No, non mi piace."] }, pl: { exchange: ["Nie podoba ci się?", "Nie, nie podoba mi się."] }, tr: { exchange: ["Beğenmedin mi?", "Hayır, beğenmedim."] }, id: { exchange: ["Apakah kamu tidak suka?", "Tidak, saya tidak suka."] }, vi: { exchange: ["Bạn không thích à?", "Không, tôi không thích."] } }

  - title: { en: "Form: questions with prepositions", uk: "Форма: питання з прийменниками", es: "Forma: preguntas con preposiciones", pt: "Forma: perguntas com preposições", fr: "Forme : questions avec prépositions", de: "Form: Fragen mit Präpositionen", it: "Forma: domande con preposizioni", pl: "Forma: pytania z przyimkami", tr: "Biçim: edatlı sorular", id: "Bentuk: pertanyaan dengan kata depan", vi: "Dạng: câu hỏi có giới từ" }
