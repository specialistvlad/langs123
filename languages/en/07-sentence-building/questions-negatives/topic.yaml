          - { level: C1, form: { pattern: [not, to, { slot: V }] }, use: { en: "after verbs that take the infinitive", uk: "після дієслів, що вимагають інфінітива", es: "después de verbos que llevan infinitivo", pt: "depois de verbos que levam infinitivo", fr: "après les verbes suivis de l’infinitif", de: "nach Verben, die den Infinitiv verlangen", it: "dopo i verbi che reggono l'infinito", pl: "po czasownikach łączących się z bezokolicznikiem", tr: "mastar alan fiillerden sonra", id: "setelah kata kerja yang diikuti infinitif", vi: "sau các động từ đi với động từ nguyên mẫu" }, ex: ["She told me ", { target: "not to worry" }, "."], tr: { uk: "Вона сказала мені не хвилюватися.", es: "Me dijo que no me preocupara.", pt: "Ela me disse para não me preocupar.", fr: "Elle m’a dit de ne pas m’inquiéter.", de: "Sie sagte mir, ich solle mir keine Sorgen machen.", it: "Mi ha detto di non preoccuparmi.", pl: "Powiedziała mi, żebym się nie martwił.", tr: "Bana endişelenmememi söyledi.", id: "Dia menyuruh saya agar tidak khawatir.", vi: "Cô ấy bảo tôi đừng lo." } }
          - { level: C1, form: { pattern: [not, { slot: -ing }] }, use: { en: "after verbs that take -ing, and in a clause of reason", uk: "після дієслів, що вимагають форми на -ing, і в обставинній частині причини", es: "después de verbos que llevan -ing y en una cláusula de causa", pt: "depois de verbos que levam -ing e em uma oração de causa", fr: "après les verbes suivis de -ing, et dans une proposition de cause", de: "nach Verben mit -ing und in einem Begründungssatz", it: "dopo i verbi che reggono -ing e in una proposizione causale", pl: "po czasownikach łączących się z -ing i w zdaniu przyczynowym", tr: "-ing alan fiillerden sonra ve neden bildiren yan cümlede", id: "setelah kata kerja yang diikuti -ing, dan dalam klausa sebab", vi: "sau các động từ đi với -ing, và trong mệnh đề chỉ lý do" }, ex: { examples: [["I regret ", { target: "not telling" }, " you."], [{ target: "Not knowing" }, " the way, we asked."]] }, tr: { uk: { examples: ["Шкодую, що не сказав тобі.", "Не знаючи дороги, ми запитали."] }, es: { examples: ["Lamento no habértelo dicho.", "Al no saber el camino, preguntamos."] }, pt: { examples: ["Eu me arrependo de não ter contado a você.", "Não sabendo o caminho, perguntamos."] }, fr: { examples: ["Je regrette de ne pas te l’avoir dit.", "Ne connaissant pas le chemin, nous avons demandé."] }, de: { examples: ["Ich bedauere, es dir nicht gesagt zu haben.", "Da wir den Weg nicht kannten, fragten wir."] }, it: { examples: ["Mi dispiace di non avertelo detto.", "Non conoscendo la strada, abbiamo chiesto."] }, pl: { examples: ["Żałuję, że ci nie powiedziałem.", "Nie znając drogi, zapytaliśmy."] }, tr: { examples: ["Sana söylemediğim için pişmanım.", "Yolu bilmediğimiz için sorduk."] }, id: { examples: ["Saya menyesal tidak memberi tahu kamu.", "Karena tidak tahu jalan, kami bertanya."] }, vi: { examples: ["Tôi hối tiếc vì đã không nói với bạn.", "Vì không biết đường, chúng tôi đã hỏi."] } } }
          - { level: C1, form: { pattern: [not having, { slot: past participle }] }, use: { en: "an earlier action as the reason", uk: "попередня дія як причина", es: "una acción anterior como causa", pt: "uma ação anterior como motivo", fr: "une action antérieure comme cause", de: "eine frühere Handlung als Grund", it: "un'azione precedente come causa", pl: "wcześniejsza czynność jako przyczyna", tr: "neden olarak daha önceki bir eylem", id: "tindakan sebelumnya sebagai alasan", vi: "hành động xảy ra trước, làm lý do" }, ex: [{ target: "Not having eaten" }, " all day, he was hungry."], tr: { uk: "Оскільки він нічого не їв увесь день, він був голодний.", es: "Como no había comido en todo el día, tenía hambre.", pt: "Como não tinha comido o dia todo, ele estava com fome.", fr: "N’ayant rien mangé de la journée, il avait faim.", de: "Da er den ganzen Tag nichts gegessen hatte, hatte er Hunger.", it: "Non avendo mangiato tutto il giorno, aveva fame.", pl: "Ponieważ nic nie jadł przez cały dzień, był głodny.", tr: "Bütün gün bir şey yemediği için acıkmıştı.", id: "Karena belum makan seharian, dia lapar.", vi: "Vì cả ngày chưa ăn gì, anh ấy rất đói." } }
          - { level: C1, form: { pattern: [without, { slot: -ing }] }, use: { en: "the action that is left out", uk: "дія, якої не відбулося", es: "la acción que se omite", pt: "a ação que fica de fora", fr: "l’action qui est omise", de: "die Handlung, die ausbleibt", it: "l'azione che viene omessa", pl: "pominięta czynność", tr: "yapılmayan eylem", id: "tindakan yang tidak dilakukan", vi: "hành động bị bỏ qua" }, ex: ["She left ", { target: "without saying" }, " goodbye."], tr: { uk: "Вона пішла, не попрощавшись.", es: "Se fue sin despedirse.", pt: "Ela foi embora sem se despedir.", fr: "Elle est partie sans dire au revoir.", de: "Sie ging, ohne sich zu verabschieden.", it: "Se n'è andata senza salutare.", pl: "Wyszła bez pożegnania.", tr: "Veda etmeden gitti.", id: "Dia pergi tanpa mengucapkan selamat tinggal.", vi: "Cô ấy rời đi mà không chào tạm biệt." } }

  - title: { en: "Negation for focus", uk: "Заперечення для підсилення", es: "Negación para dar énfasis", pt: "Negação para dar ênfase", fr: "Négation pour mettre en relief", de: "Verneinung zur Hervorhebung", it: "Negazione per dare risalto", pl: "Przeczenie dla podkreślenia", tr: "Vurgu için olumsuzluk", id: "Negasi untuk penekanan", vi: "Phủ định để nhấn mạnh" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: shows, label: { en: Shows, uk: "Що виражає", es: "Expresa", pt: "Expressa", fr: "Exprime", de: "Drückt aus", it: "Esprime", pl: "Wyraża", tr: "Ne anlatır", id: "Menyatakan", vi: "Thể hiện" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: ["not ", { gap: true }, " until"], shows: { en: "only at that point, and not before", uk: "лише з того моменту, а не раніше", es: "solo en ese momento y no antes", pt: "só nesse momento, e não antes", fr: "seulement à ce moment-là, et pas avant", de: "erst zu diesem Zeitpunkt und nicht früher", it: "solo da quel momento e non prima", pl: "dopiero w tym momencie, a nie wcześniej", tr: "ancak o anda, daha önce değil", id: "baru pada saat itu, tidak sebelumnya", vi: "chỉ đến lúc đó, không phải trước đó" }, ex: ["She didn't arrive ", { target: until }, " noon."], tr: { uk: "Вона прийшла лише опівдні.", es: "No llegó hasta el mediodía.", pt: "Ela só chegou ao meio-dia.", fr: "Elle n’est arrivée qu’à midi.", de: "Sie kam erst mittags an.", it: "È arrivata solo a mezzogiorno.", pl: "Przyjechała dopiero w południe.", tr: "Öğlene kadar gelmedi.", id: "Dia baru tiba saat tengah hari.", vi: "Mãi đến trưa cô ấy mới đến." } }
          - { level: C1, form: ["not only ", { gap: true }, " but also"], shows: { en: "adds a second point; at the start, the auxiliary comes before the subject", uk: "додає другий пункт; на початку речення допоміжне дієслово стоїть перед підметом", es: "añade un segundo punto; al inicio, el auxiliar va antes del sujeto", pt: "acrescenta um segundo ponto; no início, o auxiliar vem antes do sujeito", fr: "ajoute un deuxième point ; en tête de phrase, l’auxiliaire précède le sujet", de: "fügt einen zweiten Punkt hinzu; am Satzanfang steht das Hilfsverb vor dem Subjekt", it: "aggiunge un secondo punto; a inizio frase l'ausiliare precede il soggetto", pl: "dodaje drugi punkt; na początku zdania czasownik pomocniczy stoi przed podmiotem", tr: "ikinci bir noktayı ekler; başta olduğunda yardımcı fiil öznenin önüne geçer", id: "menambah poin kedua; di awal kalimat, kata kerja bantu mendahului subjek", vi: "thêm ý thứ hai; ở đầu câu, trợ động từ đứng trước chủ ngữ" }, ex: [{ target: "Not only did" }, " she win, she also set a record."], tr: { uk: "Вона не лише перемогла, а й установила рекорд.", es: "No solo ganó, sino que además batió un récord.", pt: "Ela não só venceu, como também bateu um recorde.", fr: "Non seulement elle a gagné, mais elle a aussi battu un record.", de: "Sie hat nicht nur gewonnen, sondern auch einen Rekord aufgestellt.", it: "Non solo ha vinto, ma ha anche stabilito un record.", pl: "Nie tylko wygrała, lecz także ustanowiła rekord.", tr: "Yalnızca kazanmakla kalmadı, rekor da kırdı.", id: "Dia tidak hanya menang, tetapi juga memecahkan rekor.", vi: "Cô ấy không chỉ thắng mà còn lập kỷ lục." } }
          - { level: C1, form: ["no sooner ", { gap: true }, " than"], shows: { en: ["one thing right after another; at the start, ", { term: "had" }, " comes before the subject"], uk: ["одна подія відразу за іншою; на початку речення ", { term: "had" }, " стоїть перед підметом"], es: ["una cosa justo después de otra; al inicio, ", { term: "had" }, " va antes del sujeto"], pt: ["uma coisa logo depois da outra; no início, ", { term: "had" }, " vem antes do sujeito"], fr: ["une chose juste après l’autre ; en tête de phrase, ", { term: "had" }, " précède le sujet"], de: ["eine Handlung unmittelbar nach der anderen; am Satzanfang steht ", { term: "had" }, " vor dem Subjekt"], it: ["una cosa subito dopo l'altra; a inizio frase ", { term: "had" }, " precede il soggetto"], pl: ["jedno zdarzenie zaraz po drugim; na początku zdania ", { term: "had" }, " stoi przed podmiotem"], tr: ["bir olay ötekinin hemen ardından gelir; başta olduğunda ", { term: "had" }, " öznenin önüne geçer"], id: ["satu hal terjadi tepat setelah hal lain; di awal kalimat, ", { term: "had" }, " mendahului subjek"], vi: ["việc này xảy ra ngay sau việc kia; ở đầu câu, ", { term: "had" }, " đứng trước chủ ngữ"] }, ex: [{ target: "No sooner had" }, " we sat down than the phone rang."], tr: { uk: "Щойно ми сіли, як задзвонив телефон.", es: "Apenas nos sentamos, sonó el teléfono.", pt: "Mal nos sentamos, o telefone tocou.", fr: "À peine étions-nous assis que le téléphone a sonné.", de: "Kaum hatten wir uns gesetzt, da klingelte das Telefon.", it: "Appena ci siamo seduti, ha squillato il telefono.", pl: "Ledwo usiedliśmy, zadzwonił telefon.", tr: "Daha oturmuştuk ki telefon çaldı.", id: "Begitu kami duduk, telepon berdering.", vi: "Chúng tôi vừa ngồi xuống thì điện thoại reo." } }
          - { level: C1, form: nowhere, shows: { en: "no place at all; at the start, the auxiliary comes before the subject", uk: "жодного місця; на початку речення допоміжне дієслово стоїть перед підметом", es: "ningún lugar; al inicio, el auxiliar va antes del sujeto", pt: "nenhum lugar; no início, o auxiliar vem antes do sujeito", fr: "aucun endroit ; en tête de phrase, l’auxiliaire précède le sujet", de: "überhaupt kein Ort; am Satzanfang steht das Hilfsverb vor dem Subjekt", it: "nessun luogo; a inizio frase l'ausiliare precede il soggetto", pl: "żadne miejsce; na początku zdania czasownik pomocniczy stoi przed podmiotem", tr: "hiçbir yer; başta olduğunda yardımcı fiil öznenin önüne geçer", id: "tidak ada tempat sama sekali; di awal kalimat, kata kerja bantu mendahului subjek", vi: "không có nơi nào; ở đầu câu, trợ động từ đứng trước chủ ngữ" }, ex: [{ target: "Nowhere else is" }, " the air so clean."], tr: { uk: "Ніде більше повітря не буває таким чистим.", es: "En ningún otro lugar el aire es tan limpio.", pt: "Em nenhum outro lugar o ar é tão limpo.", fr: "Nulle part ailleurs l’air n’est aussi pur.", de: "Nirgendwo sonst ist die Luft so sauber.", it: "In nessun altro luogo l'aria è così pulita.", pl: "Nigdzie indziej powietrze nie jest tak czyste.", tr: "Başka hiçbir yerde hava bu kadar temiz değildir.", id: "Tidak ada tempat lain yang udaranya sebersih ini.", vi: "Không nơi nào khác có không khí trong lành như vậy." } }
          - { level: C1, form: { pattern: [not a, { slot: noun }] }, shows: { en: "none at all, stronger than not any", uk: "жодного, сильніше за not any", es: "ninguno en absoluto, más fuerte que not any", pt: "nenhum, mais forte que not any", fr: "pas un seul, plus fort que not any", de: "nicht ein einziger, stärker als not any", it: "nemmeno uno, più forte di not any", pl: "ani jeden, mocniejsze niż not any", tr: "tek bir tane bile yok, not any’den güçlü", id: "tidak satu pun, lebih kuat daripada not any", vi: "không một cái nào, mạnh hơn not any" }, ex: { examples: [["He didn't say ", { target: "a word" }, "."], [{ target: "Not a soul" }, " was there."]] }, tr: { uk: { examples: ["Він не сказав жодного слова.", "Там не було ні душі."] }, es: { examples: ["No dijo ni una palabra.", "No había ni un alma."] }, pt: { examples: ["Ele não disse uma palavra.", "Não havia uma alma ali."] }, fr: { examples: ["Il n’a pas dit un mot.", "Il n’y avait pas âme qui vive."] }, de: { examples: ["Er sagte kein einziges Wort.", "Keine Menschenseele war da."] }, it: { examples: ["Non ha detto una parola.", "Non c'era un'anima."] }, pl: { examples: ["Nie powiedział ani słowa.", "Nie było tam żywej duszy."] }, tr: { examples: ["Tek kelime etmedi.", "Orada kimsecikler yoktu."] }, id: { examples: ["Dia tidak mengatakan sepatah kata pun.", "Tidak ada satu orang pun di sana."] }, vi: { examples: ["Anh ấy không nói một lời nào.", "Không có một bóng người ở đó."] } } }
          - { level: C1, form: { pattern: [no, { slot: noun }] }, shows: { en: ["the opposite of the noun: ", { term: "no fool" }, " means clever"], uk: ["протилежність іменника: ", { term: "no fool" }, " означає «розумний»"], es: ["lo contrario del sustantivo: ", { term: "no fool" }, " significa «listo»"], pt: ["o oposto do substantivo: ", { term: "no fool" }, " significa “esperto”"], fr: ["le contraire du nom : ", { term: "no fool" }, " veut dire « malin »"], de: ["das Gegenteil des Nomens: ", { term: "no fool" }, " bedeutet „klug“"], it: ["il contrario del sostantivo: ", { term: "no fool" }, " significa «intelligente»"], pl: ["przeciwieństwo rzeczownika: ", { term: "no fool" }, " znaczy „mądry”"], tr: ["isimin tersi: ", { term: "no fool" }, " “akıllı” demektir"], id: ["kebalikan dari kata bendanya: ", { term: "no fool" }, " berarti “pintar”"], vi: ["trái nghĩa với danh từ: ", { term: "no fool" }, " nghĩa là “thông minh”"] }, ex: { examples: [["He's ", { target: "no fool" }, "."], [{ target: "No idea" }, "."]] }, tr: { uk: { examples: ["Він не дурень.", "Гадки не маю."] }, es: { examples: ["No es ningún tonto.", "Ni idea."] }, pt: { examples: ["Ele não é nenhum bobo.", "Não faço ideia."] }, fr: { examples: ["Ce n’est pas un imbécile.", "Aucune idée."] }, de: { examples: ["Er ist kein Dummkopf.", "Keine Ahnung."] }, it: { examples: ["Non è affatto uno sciocco.", "Nessuna idea."] }, pl: { examples: ["On nie jest głupi.", "Nie mam pojęcia."] }, tr: { examples: ["O hiç de aptal değil.", "Hiç fikrim yok."] }, id: { examples: ["Dia bukan orang bodoh.", "Tidak tahu."] }, vi: { examples: ["Anh ấy không phải kẻ ngốc.", "Không biết nữa."] } } }
          - { level: C1, form: not nearly, shows: { en: "far less than", uk: "набагато менше, ніж", es: "mucho menos que", pt: "muito menos que", fr: "bien moins que", de: "bei Weitem nicht so viel wie", it: "molto meno di", pl: "o wiele mniej niż", tr: "çok daha az", id: "jauh lebih sedikit daripada", vi: "kém xa so với" }, ex: ["It's ", { target: "not nearly" }, " as hot as yesterday."], tr: { uk: "Сьогодні далеко не так жарко, як учора.", es: "Hace mucho menos calor que ayer.", pt: "Está longe de ser tão quente quanto ontem.", fr: "Il fait bien moins chaud qu’hier.", de: "Es ist bei Weitem nicht so heiß wie gestern.", it: "Non fa nemmeno lontanamente così caldo come ieri.", pl: "Jest o wiele chłodniej niż wczoraj.", tr: "Dünkü kadar sıcak olmaktan çok uzak.", id: "Hari ini jauh tidak sepanas kemarin.", vi: "Hôm nay không nóng bằng hôm qua đâu." } }
          - { level: C1, form: none too, shows: { en: "not at all, with a touch of irony", uk: "зовсім не, з відтінком іронії", es: "para nada, con un toque de ironía", pt: "nada, com um toque de ironia", fr: "pas du tout, avec une pointe d’ironie", de: "ganz und gar nicht, mit einem Hauch Ironie", it: "per niente, con un tocco di ironia", pl: "wcale nie, z nutą ironii", tr: "hiç değil, hafif bir alaycılıkla", id: "sama sekali tidak, dengan sentuhan ironi", vi: "hoàn toàn không, kèm chút mỉa mai" }, ex: ["She was ", { target: "none too" }, " pleased."], tr: { uk: "Вона була зовсім не рада.", es: "No estaba nada contenta.", pt: "Ela não estava nada contente.", fr: "Elle n’était guère contente.", de: "Sie war alles andere als erfreut.", it: "Non era per niente contenta.", pl: "Wcale nie była zadowolona.", tr: "Hiç de memnun değildi.", id: "Dia sama sekali tidak senang.", vi: "Cô ấy chẳng vui chút nào." } }
          - { level: C1, form: not that, shows: { en: "says that a possible point does not matter", uk: "каже, що можливий закид не має значення", es: "dice que un posible punto no importa", pt: "diz que um possível ponto não importa", fr: "indique qu’un point éventuel n’a pas d’importance", de: "sagt, dass ein möglicher Einwand keine Rolle spielt", it: "dice che un possibile punto non conta", pl: "mówi, że możliwy zarzut nie ma znaczenia", tr: "olası bir noktanın önemli olmadığını söyler", id: "menyatakan bahwa kemungkinan suatu hal tidak penting", vi: "nói rằng một điểm có thể nêu ra không quan trọng" }, ex: ["He's late again. ", { target: "Not that" }, " I mind."], tr: { uk: "Він знову запізнюється. Не те щоб мене це хвилювало.", es: "Otra vez llega tarde. No es que me importe.", pt: "Ele está atrasado de novo. Não que eu me importe.", fr: "Il est encore en retard. Non que cela me dérange.", de: "Er kommt schon wieder zu spät. Nicht dass es mich stört.", it: "È di nuovo in ritardo. Non che mi dispiaccia.", pl: "Znowu się spóźnia. Nie żeby mi to przeszkadzało.", tr: "Yine geç kaldı. Rahatsız olduğumdan değil ama.", id: "Dia terlambat lagi. Bukannya saya keberatan.", vi: "Anh ấy lại đến muộn. Không phải là tôi phiền lòng." } }

  - title: { en: "Understatement by negation", uk: "Применшення через заперечення", es: "Atenuación mediante la negación", pt: "Atenuação por meio da negação", fr: "Litote : atténuer par la négation", de: "Untertreibung durch Verneinung", it: "Attenuazione con la negazione", pl: "Niedopowiedzenie przez przeczenie", tr: "Olumsuzlukla yumuşatma", id: "Pelunakan makna dengan negasi", vi: "Nói giảm bằng phủ định" }
