        rows:
          - { level: B2, form: { pattern: [{ slot: wh-word }, { slot: helper }, { slot: subject }, { slot: V }, preposition] }, style: { en: everyday, uk: "повсякденний", es: "cotidiano", pt: "cotidiano", fr: "courant", de: "alltagssprachlich", it: "quotidiano", pl: "potoczny", tr: "günlük", id: "sehari-hari", vi: "thông thường" }, ex: ["Who are you talking ", { target: to }, "?"], tr: { uk: "З ким ти розмовляєш?", es: "¿Con quién hablas?", pt: "Com quem você está falando?", fr: "À qui parles-tu ?", de: "Mit wem sprichst du?", it: "Con chi stai parlando?", pl: "Z kim rozmawiasz?", tr: "Kiminle konuşuyorsun?", id: "Kamu sedang berbicara dengan siapa?", vi: "Bạn đang nói chuyện với ai?" } }
          - { level: B2, form: { pattern: [what, { slot: helper }, { slot: subject }, for] }, style: { en: everyday, uk: "повсякденний", es: "cotidiano", pt: "cotidiano", fr: "courant", de: "alltagssprachlich", it: "quotidiano", pl: "potoczny", tr: "günlük", id: "sehari-hari", vi: "thông thường" }, ex: ["What is this button ", { target: for }, "?"], tr: { uk: "Для чого ця кнопка?", es: "¿Para qué sirve este botón?", pt: "Para que serve este botão?", fr: "À quoi sert ce bouton ?", de: "Wofür ist dieser Knopf?", it: "A che cosa serve questo pulsante?", pl: "Do czego służy ten przycisk?", tr: "Bu düğme ne işe yarıyor?", id: "Tombol ini untuk apa?", vi: "Nút này dùng để làm gì?" } }
          - { level: B2, form: { pattern: [preposition, whom, { slot: helper }, { slot: subject }, { slot: V }] }, style: { en: formal, uk: "офіційний", es: "formal", pt: "formal", fr: "soutenu", de: "förmlich", it: "formale", pl: "formalny", tr: "resmî", id: "formal", vi: "trang trọng" }, ex: [{ target: "To whom" }, " are you speaking?"], tr: { uk: "До кого ви звертаєтеся?", es: "¿A quién se dirige usted?", pt: "A quem o senhor está se dirigindo?", fr: "À qui vous adressez-vous ?", de: "Mit wem sprechen Sie?", it: "A chi si sta rivolgendo?", pl: "Do kogo Pan się zwraca?", tr: "Kime hitap ediyorsunuz?", id: "Kepada siapa Anda berbicara?", vi: "Quý vị đang nói chuyện với ai?" } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: ["A preposition at the front takes ", { term: "whom" }, "; everyday questions use ", { term: "who" }, " and leave the preposition at the end."], uk: ["Прийменник на початку вимагає ", { term: "whom" }, "; у повсякденних питаннях вживають ", { term: "who" }, ", а прийменник лишають у кінці."], es: ["Una preposición al inicio exige ", { term: "whom" }, "; las preguntas cotidianas usan ", { term: "who" }, " y dejan la preposición al final."], pt: ["Uma preposição no início exige ", { term: "whom" }, "; as perguntas cotidianas usam ", { term: "who" }, " e deixam a preposição no fim."], fr: ["Une préposition en tête appelle ", { term: "whom" }, " ; les questions courantes emploient ", { term: "who" }, " et rejettent la préposition à la fin."], de: ["Steht die Präposition am Anfang, folgt ", { term: "whom" }, "; im Alltag steht ", { term: "who" }, " und die Präposition am Ende."], it: ["Una preposizione all'inizio vuole ", { term: "whom" }, "; le domande quotidiane usano ", { term: "who" }, " e lasciano la preposizione in fondo."], pl: ["Przyimek na początku wymaga ", { term: "whom" }, "; w pytaniach potocznych używa się ", { term: "who" }, ", a przyimek zostaje na końcu."], tr: ["Başta duran edat ", { term: "whom" }, " ister; günlük sorularda ", { term: "who" }, " kullanılır ve edat sonda kalır."], id: ["Kata depan di awal memakai ", { term: "whom" }, "; pertanyaan sehari-hari memakai ", { term: "who" }, " dan kata depan tetap di akhir."], vi: ["Giới từ đứng đầu đi với ", { term: "whom" }, "; câu hỏi thông thường dùng ", { term: "who" }, " và để giới từ ở cuối."] }
            ex: { examples: [[{ target: "With whom" }, " did you go?"], [{ target: "Who" }, " did you go ", { target: "with" }, "?"]] }
            tr: { uk: { examples: ["З ким ти ходив?", "З ким ти ходив?"] }, es: { examples: ["¿Con quién fuiste?", "¿Con quién fuiste?"] }, pt: { examples: ["Com quem você foi?", "Com quem você foi?"] }, fr: { examples: ["Avec qui y es-tu allé ?", "Avec qui y es-tu allé ?"] }, de: { examples: ["Mit wem bist du gegangen?", "Mit wem bist du gegangen?"] }, it: { examples: ["Con chi sei andato?", "Con chi sei andato?"] }, pl: { examples: ["Z kim poszedłeś?", "Z kim poszedłeś?"] }, tr: { examples: ["Kiminle gittin?", "Kiminle gittin?"] }, id: { examples: ["Kamu pergi dengan siapa?", "Kamu pergi dengan siapa?"] }, vi: { examples: ["Bạn đã đi với ai?", "Bạn đã đi với ai?"] } }

  - title: { en: "Form: emphatic wh-questions", uk: "Форма: підсилені спеціальні питання", es: "Forma: preguntas enfáticas con palabra interrogativa", pt: "Forma: perguntas enfáticas com palavra interrogativa", fr: "Forme : questions en wh- emphatiques", de: "Form: nachdrückliche W-Fragen", it: "Forma: domande con wh- enfatiche", pl: "Forma: wzmocnione pytania szczegółowe", tr: "Biçim: vurgulu wh- soruları", id: "Bentuk: pertanyaan wh- yang ditekankan", vi: "Dạng: câu hỏi Wh- nhấn mạnh" }
    role: form
