              it: [{ term: "be" }, " e ", { term: "can" }, ", ", { term: "will" }, ", ", { term: "should" }, ", ", { term: "must" }, " non richiedono ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
              pl: [{ term: "be" }, " i ", { term: "can" }, ", ", { term: "will" }, ", ", { term: "should" }, ", ", { term: "must" }, " nie potrzebują ", { alternatives: [{ term: "do" }, { term: "does" }, { term: "did" }] }, "."]
