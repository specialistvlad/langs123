          - { level: C2, context: { en: "a comparison", uk: "порівняння", es: "una comparación", pt: "uma comparação", fr: "une comparaison", de: "ein Vergleich", it: "un confronto", pl: "porównanie", tr: "karşılaştırma", id: "perbandingan", vi: "phép so sánh" }, ex: ["She sings better than ", { target: anyone }, " I know."], tr: { uk: "Вона співає краще за будь-кого, кого я знаю.", es: "Canta mejor que cualquiera que conozco.", pt: "Ela canta melhor do que qualquer pessoa que eu conheço.", fr: "Elle chante mieux que tous ceux que je connais.", de: "Sie singt besser als jeder, den ich kenne.", it: "Canta meglio di chiunque io conosca.", pl: "Śpiewa lepiej niż ktokolwiek, kogo znam.", tr: "Tanıdığım herkesten daha iyi şarkı söyler.", id: "Dia menyanyi lebih baik daripada siapa pun yang saya kenal.", vi: "Cô ấy hát hay hơn bất kỳ ai tôi biết." } }
