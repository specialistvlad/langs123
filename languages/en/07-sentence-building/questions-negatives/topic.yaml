id: en.sentence-building.questions-negatives
lang: en
kind: grammar
tags: [questions, negatives, wh-questions, auxiliaries]
concepts: [questions-negatives]
related: [en.sentence-building.word-order, en.tenses.simple-tenses, en.verbs.to-be, en.modals.can-could, en.sentence-building.question-tags]
status: { en: draft, uk: draft, es: draft }
translated: { uk: "2c72c7 bea31b 533bb7 9ec55b 6efacd 0d4320 7ec2b7 56efbb 059a09 730986 d73725", es: "2c72c7 bea31b 533bb7 9ec55b 6efacd 0d4320 7ec2b7 56efbb 059a09 730986 d73725" }

title: { en: Questions and negatives, uk: Питання та заперечення, es: Preguntas y negaciones }
summary:
  lead:
    en: ["Yes/no questions, wh-questions, short answers and negatives, with ", { term: be }, ", modals and every other verb."]
    uk: ["Загальні та спеціальні питання, короткі відповіді й заперечення з ", { term: be }, ", модальними й усіма іншими дієсловами."]
    es: ["Preguntas de sí o no y con palabra interrogativa, respuestas cortas y negaciones con ", { term: be }, ", verbos modales y los demás verbos."]
  rule:
    en: [{ term: Be }, " and modals invert or take ", { term: not }, "; other verbs use ", { term: do }, ", ", { term: does }, " or ", { term: did }, " with the base verb:"]
    uk: [{ term: Be }, " і модальні дієслова стають перед підметом або беруть ", { term: not }, "; інші дієслова вживають ", { term: do }, ", ", { term: does }, " чи ", { term: did }, " з початковою формою:"]
    es: [{ term: Be }, " y los verbos modales van antes del sujeto o llevan ", { term: not }, "; los demás verbos usan ", { term: do }, ", ", { term: does }, " o ", { term: did }, " con la forma base:"]
  ex: [{ target: Do }, " you ", { target: like }, " tea?"]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A1, point: { en: ["Negative: ", { term: be }, ", modals"], uk: ["Заперечення: ", { term: be }, ", модальні дієслова"], es: ["Negación: ", { term: be }, " y verbos modales"] }, rule: { pattern: [{ slot: subject }, { alternatives: [be, modal] }, not] }, ex: { examples: [["They ", { target: are not }, " at home."], ["He ", { target: can't }, " drive."]] }, tr: { uk: { examples: ["Вони не вдома.", "Він не вміє водити."] }, es: { examples: ["No están en casa.", "Él no sabe conducir."] } } }
        - { level: A1, point: { en: ["Question: ", { term: be }, ", modals"], uk: ["Питання: ", { term: be }, ", модальні дієслова"], es: ["Pregunta: ", { term: be }, " y verbos modales"] }, rule: { pattern: [{ alternatives: [be, modal] }, { slot: subject }] }, ex: { examples: [[{ target: Are }, " they at home?"], [{ target: Can }, " he drive?"]] }, tr: { uk: { examples: ["Вони вдома?", "Він уміє водити?"] }, es: { examples: ["¿Están en casa?", "¿Él sabe conducir?"] } } }
        - { level: A1, point: { en: "Negative: other verbs", uk: "Заперечення: інші дієслова", es: "Negación: otros verbos" }, rule: { pattern: [{ slot: subject }, { alternatives: [don't, doesn't, didn't] }, { slot: base verb }] }, ex: ["He ", { target: doesn't like }, " jazz."], tr: { uk: "Він не любить джаз.", es: "A él no le gusta el jazz." } }
        - { level: A1, point: { en: "Question: other verbs", uk: "Питання: інші дієслова", es: "Pregunta: otros verbos" }, rule: { pattern: [{ alternatives: [do, does, did] }, { slot: subject }, { slot: base verb }] }, ex: [{ target: Did }, " you ", { target: call }, " her?"], tr: { uk: "Ти їй дзвонив?", es: "¿La llamaste?" } }
        - { level: A1, point: "do, does, did", rule: { en: [{ takes: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, { term: do }] }, ", ", { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] }, ", ", { takes: [past, { term: did }] }], uk: [{ takes: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, { term: do }] }, ", ", { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] }, ", ", { takes: ["минулий час", { term: did }] }], es: [{ takes: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, { term: do }] }, ", ", { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] }, ", ", { takes: ["pasado", { term: did }] }] }, ex: [{ target: Do }, " you ", { target: like }, " jazz?"], tr: { uk: "Ти любиш джаз?", es: "¿Te gusta el jazz?" } }
        - { level: A1, point: { en: Wh-question, uk: "Спеціальне питання", es: "Pregunta con palabra interrogativa" }, rule: { pattern: [{ slot: wh-word }, { slot: { en: auxiliary, uk: "допоміжне дієслово", es: "auxiliar" } }, { slot: subject }, { slot: base verb }] }, ex: { examples: [[{ target: Where do }, " you ", { target: live }, "?"], [{ target: Where are }, " you from?"]] }, tr: { uk: { examples: ["Де ти живеш?", "Звідки ти?"] }, es: { examples: ["¿Dónde vives?", "¿De dónde eres?"] } } }
        - { level: A1, point: { en: Subject question, uk: "Питання до підмета", es: "Pregunta sobre el sujeto" }, rule: { en: ["no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "; the verb takes the tense"], uk: ["без ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "; дієслово саме стоїть у потрібному часі"], es: ["sin ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "; el verbo lleva el tiempo verbal"] }, ex: [{ target: Who called }, " you?"], tr: { uk: "Хто тобі дзвонив?", es: "¿Quién te llamó?" } }
        - { level: A1, point: { en: Short answer, uk: "Коротка відповідь", es: "Respuesta corta" }, rule: { en: ["repeat the ", { term: be }, ", modal or auxiliary verb"], uk: ["повтори ", { term: be }, ", модальне чи допоміжне дієслово"], es: ["repite ", { term: be }, ", el verbo modal o el auxiliar"] }, ex: { examples: [["Yes, she ", { target: can }, "."], ["No, she ", { target: can't }, "."]] }, tr: { uk: { examples: ["Так, вона вміє.", "Ні, вона не вміє."] }, es: { examples: ["Sí, ella sabe.", "No, ella no sabe."] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: ["after ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " the verb is the base form"], uk: ["після ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " дієслово стоїть у початковій формі"], es: ["después de ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " el verbo va en forma base"] }, ex: ["Did you ", { target: go }, "?"], tr: { uk: "Ти ходив?", es: "¿Fuiste?" } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: be }, " and modal verbs invert with the subject or take ", { term: not }, ". Other verbs use ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: [{ term: be }, " і модальні дієслова міняються місцями з підметом або беруть ", { term: not }, ". Інші дієслова вживають ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: [{ term: be }, " y los verbos modales se invierten con el sujeto o llevan ", { term: not }, ". Los demás verbos usan ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
          - type: rule
            level: A1
            text:
              en: Every question and negative sentence has a subject.
              uk: "Кожне питання й заперечне речення має підмет."
              es: "Toda pregunta y toda oración negativa tiene sujeto."

  - title: { en: "Form: be and modals", uk: "Форма: be і модальні дієслова", es: "Forma: be y los verbos modales" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative, uk: "Заперечення", es: "Negación" }, pattern: { pattern: [{ slot: subject }, { alternatives: [be, modal] }, not] }, ex: { examples: [["They ", { target: are not }, " at home."], ["He ", { target: can't }, " drive."]] } }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question, uk: "Питання", es: "Pregunta" }, pattern: { pattern: [{ alternatives: [be, modal] }, { slot: subject }] }, ex: { examples: [[{ target: Are }, " they at home?"], [{ target: Can }, " he drive?"]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: be }, " and ", { term: can }, ", ", { term: will }, ", ", { term: should }, ", ", { term: must }, " need no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: [{ term: be }, " і ", { term: can }, ", ", { term: will }, ", ", { term: should }, ", ", { term: must }, " не потребують ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: [{ term: be }, " y ", { term: can }, ", ", { term: will }, ", ", { term: should }, ", ", { term: must }, " no necesitan ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: am not }, " has the short form ", { term: I'm not }, ": ", { term: I'm not ready }, "."]
              uk: [{ term: am not }, " має скорочену форму ", { term: I'm not }, ": ", { term: I'm not ready }, "."]
              es: [{ term: am not }, " tiene la forma contraída ", { term: I'm not }, ": ", { term: I'm not ready }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: have got }, " inverts too:"]
              uk: [{ term: have got }, " теж ставиться перед підметом:"]
              es: [{ term: have got }, " también se coloca antes del sujeto:"]
            ex: [{ target: Have }, " you ", { target: got }, " a pen?"]
            tr: { uk: "У тебе є ручка?", es: "¿Tienes un bolígrafo?" }

  - title: { en: "Form: do, does and did", uk: "Форма: do, does і did", es: "Forma: do, does y did" }
    role: form
    content:
      - type: usage
        columns:
          - { key: aux, label: { en: Auxiliary, uk: "Допоміжне дієслово", es: "Verbo auxiliar" } }
          - { key: use, label: { en: Subject and tense, uk: "Підмет і час", es: "Sujeto y tiempo verbal" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, aux: { alternatives: [do, don't] }, use: { en: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, ", present"], uk: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, ", теперішній час"], es: [{ alternatives: [{ term: I }, { term: you }, { term: we }, { term: they }] }, ", presente"] }, ex: [{ target: Do }, " you ", { target: like }, " jazz?"], tr: { uk: "Ти любиш джаз?", es: "¿Te gusta el jazz?" } }
          - { level: A1, aux: { alternatives: [does, doesn't] }, use: { en: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, ", present"], uk: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, ", теперішній час"], es: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, ", presente"] }, ex: ["He ", { target: doesn't like }, " jazz."], tr: { uk: "Він не любить джаз.", es: "A él no le gusta el jazz." } }
          - { level: A1, aux: { alternatives: [did, didn't] }, use: { en: "every subject, past", uk: "будь-який підмет, минулий час", es: "cualquier sujeto, pasado" }, ex: [{ target: Did }, " you ", { target: call }, " her?"], tr: { uk: "Ти їй дзвонив?", es: "¿La llamaste?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The negative order is ", { pattern: [{ slot: subject }, { alternatives: [{ term: don't }, { term: doesn't }, { term: didn't }] }, { slot: base verb }] }, ":"]
              uk: ["Порядок слів у запереченні такий: ", { pattern: [{ slot: subject }, { alternatives: [{ term: don't }, { term: doesn't }, { term: didn't }] }, { slot: base verb }] }, ":"]
              es: ["El orden en la negación es ", { pattern: [{ slot: subject }, { alternatives: [{ term: don't }, { term: doesn't }, { term: didn't }] }, { slot: base verb }] }, ":"]
            ex: ["We ", { target: didn't see }, " him."]
            tr: { uk: "Ми його не бачили.", es: "No lo vimos." }
          - type: rule
            level: A1
            text:
              en: ["The question order is ", { pattern: [{ alternatives: [{ term: do }, { term: does }, { term: did }] }, { slot: subject }, { slot: base verb }] }, ":"]
              uk: ["Порядок слів у питанні такий: ", { pattern: [{ alternatives: [{ term: do }, { term: does }, { term: did }] }, { slot: subject }, { slot: base verb }] }, ":"]
              es: ["El orden en la pregunta es ", { pattern: [{ alternatives: [{ term: do }, { term: does }, { term: did }] }, { slot: subject }, { slot: base verb }] }, ":"]
            ex: [{ target: Does }, " she ", { target: work }, " here?"]
            tr: { uk: "Вона тут працює?", es: "¿Ella trabaja aquí?" }
          - type: rule
            level: A1
            text:
              en: ["After ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " the verb is in the base form:"]
              uk: ["Після ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " дієслово стоїть у початковій формі:"]
              es: ["Después de ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " el verbo va en la forma base:"]
            ex: ["Did you ", { target: call }, "?"]
            tr: { uk: "Ти дзвонив?", es: "¿Llamaste?" }
          - type: rule
            level: A1
            text:
              en: The auxiliary carries the tense and the person; the main verb stays unchanged.
              uk: "Допоміжне дієслово виражає час і особу; основне дієслово не змінюється."
              es: "El auxiliar expresa el tiempo verbal y la persona; el verbo principal no cambia."
          - type: note
            level: A1
            text:
              en: ["Present tables: ", { link: Present Simple, to: en.tenses.simple-tenses }, ". Past: ", { link: Past simple, to: en.tenses.simple-tenses }, "."]
              uk: ["Таблиці теперішнього часу: ", { link: "Present Simple", to: en.tenses.simple-tenses }, ". Минулий час: ", { link: "Past Simple", to: en.tenses.simple-tenses }, "."]
              es: ["Tablas del presente: ", { link: "Presente simple", to: en.tenses.simple-tenses }, ". Pasado: ", { link: "Pasado simple", to: en.tenses.simple-tenses }, "."]
          - type: rule
            level: A1
            text:
              en: "A negative sentence takes one negative word:"
              uk: "В англійському запереченні вживають лише одне заперечне слово:"
              es: "En inglés, una oración negativa lleva una sola palabra negativa:"
            ex: { examples: [["I ", { target: don't }, " know ", { target: anything }, "."], ["I know ", { target: nothing }, "."]] }
            tr: { uk: { examples: ["Я нічого не знаю.", "Я нічого не знаю."] }, es: { examples: ["No sé nada.", "No sé nada."] } }

  - title: { en: "Form: negative contractions", uk: "Форма: скорочені форми заперечення", es: "Forma: contracciones negativas" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: full, label: { en: Full form, uk: "Повна форма", es: "Forma completa" }, features: { contraction: full } }
          - { key: short, label: { en: Short form, uk: "Скорочена форма", es: "Forma contraída" }, features: { contraction: short } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, full: is not, short: isn't, ex: ["It ", { target: isn't }, " cold."] }
          - { level: A1, full: are not, short: aren't, ex: ["They ", { target: aren't }, " here."] }
          - { level: A1, full: [{ alternatives: [was, were] }, " not"], short: { alternatives: [wasn't, weren't] }, ex: ["We ", { target: weren't }, " late."] }
          - { level: A1, full: [{ alternatives: [do, does, did] }, " not"], short: { alternatives: [don't, doesn't, didn't] }, ex: ["She ", { target: doesn't }, " know."] }
          - { level: A1, full: cannot, short: can't, ex: ["I ", { target: can't }, " see."] }
          - { level: A1, full: will not, short: won't, ex: ["It ", { target: won't }, " work."] }
          - { level: A1, full: [{ alternatives: [should, must, could, would] }, " not"], short: { alternatives: [shouldn't, mustn't, couldn't, wouldn't] }, ex: ["You ", { target: shouldn't }, " go."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Speech and messages use the short forms. The full forms add emphasis:"
              uk: "У мовленні та повідомленнях вживають скорочені форми. Повні форми підсилюють висловлення:"
              es: "En el habla y en los mensajes se usan las formas contraídas. Las formas completas añaden énfasis:"
            ex: ["I do ", { target: not }, " agree."]
            tr: { uk: "Я не погоджуюся.", es: "No estoy de acuerdo." }

  - title: { en: "Form: wh-questions", uk: "Форма: спеціальні питання", es: "Forma: preguntas con palabra interrogativa" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Wh-word, uk: "Питальне слово", es: "Palabra interrogativa" } }
          - { key: asks, label: { en: Asks about, uk: "Про що питає", es: "Pregunta por" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, word: what, asks: { en: a thing, uk: "річ", es: "una cosa" }, ex: [{ target: What }, " do you want?"], tr: { uk: "Що ти хочеш?", es: "¿Qué quieres?" } }
          - { level: A1, word: where, asks: { en: a place, uk: "місце", es: "un lugar" }, ex: [{ target: Where }, " does he live?"], tr: { uk: "Де він живе?", es: "¿Dónde vive él?" } }
          - { level: A1, word: when, asks: { en: a time, uk: "час", es: "un momento" }, ex: [{ target: When }, " is the party?"], tr: { uk: "Коли вечірка?", es: "¿Cuándo es la fiesta?" } }
          - { level: A1, word: who, asks: { en: a person, uk: "особа", es: "una persona" }, ex: [{ target: Who }, " did you meet?"], tr: { uk: "Кого ти зустрів?", es: "¿A quién conociste?" } }
          - { level: A1, word: why, asks: { en: a reason, uk: "причина", es: "una razón" }, ex: [{ target: Why }, " are you late?"], tr: { uk: "Чому ти запізнився?", es: "¿Por qué llegas tarde?" } }
          - { level: A1, word: how, asks: { en: a way, uk: "спосіб", es: "un modo" }, ex: [{ target: How }, " do you get to work?"], tr: { uk: "Як ти добираєшся на роботу?", es: "¿Cómo llegas al trabajo?" } }
          - { level: A1, word: which, asks: { en: a choice, uk: "вибір", es: "una elección" }, ex: [{ target: Which }, " bag is yours?"], tr: { uk: "Яка сумка твоя?", es: "¿Cuál es tu bolso?" } }
          - { level: A1, word: whose, asks: { en: an owner, uk: "власник", es: "un dueño" }, ex: [{ target: Whose }, " keys are these?"], tr: { uk: "Чиї це ключі?", es: "¿De quién son estas llaves?" } }
          - { level: A1, word: how much, asks: { en: an amount or a price, uk: "кількість або ціна", es: "una cantidad o un precio" }, ex: [{ target: How much }, " is this?"], tr: { uk: "Скільки це коштує?", es: "¿Cuánto cuesta esto?" } }
          - { level: A1, word: how many, asks: { en: a number, uk: "число", es: "un número" }, ex: [{ target: How many }, " brothers have you got?"], tr: { uk: "Скільки в тебе братів?", es: "¿Cuántos hermanos tienes?" } }
          - { level: A1, word: how often, asks: { en: frequency, uk: "частота", es: "la frecuencia" }, ex: [{ target: How often }, " do you swim?"], tr: { uk: "Як часто ти плаваєш?", es: "¿Con qué frecuencia nadas?" } }
          - { level: A1, word: how old, asks: { en: age, uk: "вік", es: "la edad" }, ex: [{ target: How old }, " is your sister?"], tr: { uk: "Скільки років твоїй сестрі?", es: "¿Cuántos años tiene tu hermana?" } }
          - { level: A1, word: how long, asks: { en: a length of time, uk: "тривалість", es: "una duración" }, ex: [{ target: How long }, " is the film?"], tr: { uk: "Скільки триває фільм?", es: "¿Cuánto dura la película?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The order is ", { pattern: [{ slot: wh-word }, auxiliary, { slot: subject }, { slot: base verb }] }, ":"]
              uk: ["Порядок слів такий: ", { pattern: [{ slot: wh-word }, "допоміжне дієслово", { slot: subject }, { slot: base verb }] }, ":"]
              es: ["El orden es ", { pattern: [{ slot: wh-word }, "verbo auxiliar", { slot: subject }, { slot: base verb }] }, ":"]
            ex: [{ target: Where do }, " you ", { target: live }, "?"]
            tr: { uk: "Де ти живеш?", es: "¿Dónde vives?" }
          - type: rule
            level: A1
            text:
              en: ["With ", { term: be }, " the order is ", { pattern: [{ slot: wh-word }, { term: be }, { slot: subject }] }, ":"]
              uk: ["З ", { term: be }, " порядок слів такий: ", { pattern: [{ slot: wh-word }, { term: be }, { slot: subject }] }, ":"]
              es: ["Con ", { term: be }, " el orden es ", { pattern: [{ slot: wh-word }, { term: be }, { slot: subject }] }, ":"]
            ex: [{ target: Where are }, " you from?"]
            tr: { uk: "Звідки ти?", es: "¿De dónde eres?" }
          - type: rule
            level: A1
            text:
              en: [{ term: which }, " and ", { term: whose }, " can take a noun:"]
              uk: [{ term: which }, " і ", { term: whose }, " можуть стояти з іменником:"]
              es: [{ term: which }, " y ", { term: whose }, " pueden llevar un sustantivo:"]
            ex: [{ target: Which colour }, " do you like?"]
            tr: { uk: "Який колір тобі подобається?", es: "¿Qué color te gusta?" }
          - type: rule
            level: A1
            text:
              en: [{ term: how many }, " takes a plural noun, ", { term: how much }, " an uncountable noun: ", { examples: [{ term: How many eggs? }, { term: How much milk? }] }]
              uk: [{ term: how many }, " вживається з іменником у множині, ", { term: how much }, " — з незлічуваним іменником: ", { examples: [{ term: How many eggs? }, { term: How much milk? }] }]
              es: [{ term: how many }, " lleva un sustantivo en plural, ", { term: how much }, " un sustantivo incontable: ", { examples: [{ term: How many eggs? }, { term: How much milk? }] }]

  - title: { en: "Form: subject questions", uk: "Форма: питання до підмета", es: "Forma: preguntas sobre el sujeto" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Question word, uk: "Питальне слово", es: "Palabra interrogativa" } }
          - { key: pattern, label: { en: Pattern, uk: "Схема", es: "Estructura" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, word: who, pattern: { pattern: [who, { slot: verb }] }, ex: [{ target: Who called }, " you?"], tr: { uk: "Хто тобі дзвонив?", es: "¿Quién te llamó?" } }
          - { level: A1, word: what, pattern: { pattern: [what, { slot: verb }] }, ex: [{ target: What happens }, " next?"], tr: { uk: "Що станеться далі?", es: "¿Qué pasa después?" } }
          - { level: A1, word: { alternatives: [which, how many] }, pattern: { pattern: [{ alternatives: [which, how many] }, { slot: noun }, { slot: verb }] }, ex: [{ target: How many people came }, "?"], tr: { uk: "Скільки людей прийшло?", es: "¿Cuántas personas vinieron?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["When the question word is the subject, the question has no ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              uk: ["Коли питальне слово є підметом, у питанні немає ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
              es: ["Cuando la palabra interrogativa es el sujeto, la pregunta no lleva ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
          - type: rule
            level: A1
            text:
              en: "The verb takes the tense directly:"
              uk: "Дієслово саме стоїть у потрібному часі:"
              es: "El verbo toma el tiempo verbal directamente:"
            ex: { examples: [[{ target: Who lives }, " here?"], [{ target: Who lived }, " here?"]] }
            tr: { uk: { examples: ["Хто тут живе?", "Хто тут жив?"] }, es: { examples: ["¿Quién vive aquí?", "¿Quién vivió aquí?"] } }

  - title: { en: "Form: short answers", uk: "Форма: короткі відповіді", es: "Forma: respuestas cortas" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: question, label: { en: Question, uk: "Питання", es: "Pregunta" } }
          - { key: "yes", label: { en: "Yes", uk: "Так", es: "Sí" }, features: { polarity: pos } }
          - { key: "no", label: { en: "No", uk: "Ні", es: "No" }, features: { polarity: neg } }
        rows:
          - { level: A1, question: Are you tired?, "yes": ["Yes, I ", { target: am }, "."], "no": ["No, I'", { target: m not }, "."] }
          - { level: A1, question: Can she swim?, "yes": ["Yes, she ", { target: can }, "."], "no": ["No, she ", { target: can't }, "."] }
          - { level: A1, question: Did he call?, "yes": ["Yes, he ", { target: did }, "."], "no": ["No, he ", { target: didn't }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A short answer repeats the ", { term: be }, ", modal or auxiliary verb from the question."]
              uk: ["Коротка відповідь повторює дієслово ", { term: be }, ", модальне чи допоміжне дієслово з питання."]
              es: ["La respuesta corta repite el verbo ", { term: be }, ", el modal o el auxiliar de la pregunta."]
          - type: rule
            level: A1
            text:
              en: "A positive short answer keeps the full form:"
              uk: "Стверджувальна коротка відповідь має повну форму:"
              es: "La respuesta corta afirmativa conserva la forma completa:"
            ex: ["Yes, I ", { target: am }, "."]
            tr: { uk: "Так, втомився.", es: "Sí, lo estoy." }
          - type: note
            level: A1
            text:
              en: ["For ", { alternatives: [{ term: do }, { term: does }] }, " see ", { link: Present Simple, to: en.tenses.simple-tenses }, "."]
              uk: ["Про ", { alternatives: [{ term: do }, { term: does }] }, " див. ", { link: "Present Simple", to: en.tenses.simple-tenses }, "."]
              es: ["Para ", { alternatives: [{ term: do }, { term: does }] }, ", ver ", { link: "Presente simple", to: en.tenses.simple-tenses }, "."]

  - title: { en: "Pronunciation: question intonation", uk: "Вимова: інтонація питання", es: "Pronunciación: entonación de las preguntas" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question, uk: "Питання", es: "Pregunta" } }
          - { key: tune, label: { en: Voice, uk: "Інтонація", es: "Entonación" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, question: { alternatives: ["yes", "no"] }, tune: { en: rises at the end, uk: "підвищується в кінці", es: "sube al final" }, ex: ["Do you like tea? ", { intonation: rise }], tr: { uk: "Ти любиш чай?", es: "¿Te gusta el té?" } }
          - { level: A1, question: wh-, tune: { en: falls at the end, uk: "знижується в кінці", es: "baja al final" }, ex: ["Where do you live? ", { intonation: fall }], tr: { uk: "Де ти живеш?", es: "¿Dónde vives?" } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Did you went?, right: ["Did you ", { target: go }, "?"], rule: { en: ["after ", { term: did }, " the verb is in the base form"], uk: ["після ", { term: did }, " дієслово стоїть у початковій формі"], es: ["después de ", { term: did }, " el verbo va en forma base"] } }
          - { level: A1, wrong: Who did call you?, right: [{ target: Who called }, " you?"], rule: { en: ["a subject question has no ", { term: did }], uk: ["у питанні до підмета немає ", { term: did }], es: ["una pregunta sobre el sujeto no lleva ", { term: did }] } }
          - { level: A1, wrong: Do she like tea?, right: [{ target: Does }, " she like tea?"], rule: { en: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] }, uk: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] }, es: { takes: [{ alternatives: [{ term: he }, { term: she }, { term: it }] }, { term: does }] } } }
          - { level: A1, speakers: [uk], wrong: You like coffee?, right: [{ target: Do }, " you like coffee?"], rule: { uk: ["Питання починається з допоміжного дієслова ", { term: do }, ", ", { term: does }, " чи ", { term: did }, "; українське «Ти любиш каву?» будується без нього"] } }
          - { level: A1, speakers: [uk], wrong: Where you live?, right: ["Where ", { target: do }, " you live?"], rule: { uk: ["Після питального слова потрібне допоміжне дієслово ", { term: do }, ", ", { term: does }, " чи ", { term: did }, "; українське «Де ти живеш?» обходиться без нього"] } }
          - { level: A1, speakers: [uk], wrong: I don't know nothing., right: ["I don't know ", { target: anything }, "."], rule: { uk: ["В англійському реченні одне заперечення: ", { term: don't know anything }, " або ", { term: know nothing }, "; українське «нічого не знаю» має два"] } }
          - { level: A1, speakers: [es], wrong: What means this word?, right: ["What ", { target: does }, " this word ", { target: mean }, "?"], rule: { es: ["Cuando ", { term: what }, " es el objeto, la pregunta lleva ", { term: do }, " o ", { term: does }, " y el verbo va en forma base"] } }
          - { level: A1, speakers: [es], wrong: I no like jazz., right: ["I ", { target: don't }, " like jazz."], rule: { es: ["La negación lleva el auxiliar ", { term: don't }, ", ", { term: doesn't }, " o ", { term: didn't }, " delante del verbo en forma base; en español basta «no»"] } }
          - { level: A1, speakers: [es], wrong: I don't know nothing., right: ["I don't know ", { target: anything }, "."], rule: { es: ["En inglés la oración lleva una sola negación: ", { term: don't know anything }, " o ", { term: know nothing }, "; en español «no sé nada» lleva dos"] } }
