        rows:
          - { level: B2, form: { pattern: [{ slot: wh-word }, { alternatives: [on earth, in the world] }] }, shows: { en: "strong surprise or annoyance", uk: "сильне здивування або роздратування", es: "fuerte sorpresa o enfado", pt: "forte surpresa ou irritação", fr: "forte surprise ou agacement", de: "starke Überraschung oder Verärgerung", it: "forte sorpresa o irritazione", pl: "silne zdziwienie lub irytacja", tr: "güçlü şaşkınlık ya da sinirlenme", id: "keheranan atau kekesalan yang kuat", vi: "ngạc nhiên mạnh hoặc bực bội" }, ex: { examples: [["What ", { target: "on earth" }, " are you doing?"], ["Why ", { target: "in the world" }, " did you leave?"]] }, tr: { uk: { examples: ["Що це ти робиш?", "Чому ти взагалі пішов?"] }, es: { examples: ["¿Qué rayos estás haciendo?", "¿Por qué rayos te fuiste?"] }, pt: { examples: ["O que diabos você está fazendo?", "Por que diabos você foi embora?"] }, fr: { examples: ["Mais que fais-tu donc ?", "Pourquoi diable es-tu parti ?"] }, de: { examples: ["Was um alles in der Welt machst du da?", "Warum um alles in der Welt bist du gegangen?"] }, it: { examples: ["Che cosa diavolo stai facendo?", "Perché mai te ne sei andato?"] }, pl: { examples: ["Co ty u licha robisz?", "Dlaczego w ogóle wyszedłeś?"] }, tr: { examples: ["Sen ne yapıyorsun yahu?", "Ne diye gittin ki?"] }, id: { examples: ["Sebenarnya apa yang sedang kamu lakukan?", "Sebenarnya kenapa kamu pergi?"] }, vi: { examples: ["Rốt cuộc bạn đang làm gì vậy?", "Rốt cuộc tại sao bạn bỏ đi?"] } } }
          - { level: B2, form: { pattern: [{ slot: wh-word }, ever] }, shows: { en: "surprise", uk: "здивування", es: "sorpresa", pt: "surpresa", fr: "surprise", de: "Überraschung", it: "sorpresa", pl: "zdziwienie", tr: "şaşkınlık", id: "keheranan", vi: "sự ngạc nhiên" }, ex: { examples: [["How ", { target: ever }, " did you find us?"], ["Who ", { target: ever }, " said that?"]] }, tr: { uk: { examples: ["Як ти нас узагалі знайшов?", "Хто взагалі таке сказав?"] }, es: { examples: ["¿Cómo es que nos encontraste?", "¿Quién pudo haber dicho eso?"] }, pt: { examples: ["Como você conseguiu nos encontrar?", "Quem foi que disse isso?"] }, fr: { examples: ["Comment nous as-tu donc trouvés ?", "Qui a bien pu dire ça ?"] }, de: { examples: ["Wie hast du uns bloß gefunden?", "Wer hat das bloß gesagt?"] }, it: { examples: ["Come hai fatto mai a trovarci?", "Chi mai ha detto una cosa simile?"] }, pl: { examples: ["Jak ty nas w ogóle znalazłeś?", "Kto w ogóle tak powiedział?"] }, tr: { examples: ["Bizi nasıl buldun yahu?", "Bunu kim söylemiş acaba?"] }, id: { examples: ["Bagaimana kamu bisa menemukan kami?", "Siapa gerangan yang bilang begitu?"] }, vi: { examples: ["Làm sao bạn tìm được chúng tôi vậy?", "Ai đã nói điều đó vậy?"] } } }
          - { level: B2, form: { pattern: [{ slot: subject }, { slot: verb }, { slot: wh-word }] }, shows: { en: "an echo question: surprise, or a request to say it again", uk: "ехо-питання: здивування або прохання повторити", es: "una pregunta eco: sorpresa o petición de repetir", pt: "uma pergunta eco: surpresa ou pedido para repetir", fr: "une question écho : surprise ou demande de répéter", de: "eine Echofrage: Überraschung oder Bitte um Wiederholung", it: "una domanda eco: sorpresa o richiesta di ripetere", pl: "pytanie echo: zdziwienie lub prośba o powtórzenie", tr: "yankı soru: şaşkınlık ya da yinelenmesi için rica", id: "pertanyaan gema: keheranan atau permintaan untuk mengulang", vi: "câu hỏi lặp lại: ngạc nhiên hoặc nhờ nói lại" }, ex: { exchange: ["I quit my job.", ["You did ", { target: what }, "? ", { intonation: rise }]] }, tr: { uk: { exchange: ["Я звільнився з роботи.", "Ти що зробив?"] }, es: { exchange: ["Renuncié a mi trabajo.", "¿Hiciste qué?"] }, pt: { exchange: ["Eu pedi demissão.", "Você fez o quê?"] }, fr: { exchange: ["J’ai quitté mon travail.", "Tu as fait quoi ?"] }, de: { exchange: ["Ich habe gekündigt.", "Du hast was getan?"] }, it: { exchange: ["Ho lasciato il lavoro.", "Hai fatto cosa?"] }, pl: { exchange: ["Rzuciłem pracę.", "Co zrobiłeś?"] }, tr: { exchange: ["İşimden ayrıldım.", "Ne yaptın?"] }, id: { exchange: ["Saya berhenti dari pekerjaan saya.", "Kamu melakukan apa?"] }, vi: { exchange: ["Tôi đã nghỉ việc.", "Bạn đã làm gì cơ?"] } } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "The emphatic phrase follows the wh-word, and the question keeps its usual word order.", uk: "Підсилювальний зворот іде після питального слова, а питання зберігає звичайний порядок слів.", es: "La frase enfática va después de la palabra interrogativa y la pregunta conserva su orden habitual.", pt: "A expressão enfática vem depois da palavra interrogativa, e a pergunta mantém a ordem habitual.", fr: "L’expression emphatique suit le mot interrogatif, et la question garde son ordre habituel.", de: "Der Zusatz mit Nachdruck folgt auf das Fragewort, und die Frage behält ihre übliche Wortstellung.", it: "L'espressione enfatica segue la parola interrogativa e la domanda mantiene il suo ordine abituale.", pl: "Wyrażenie wzmacniające stoi po słowie pytającym, a pytanie zachowuje zwykły szyk.", tr: "Vurgu ifadesi soru sözcüğünden sonra gelir; sorunun sözcük sırası değişmez.", id: "Frasa penekanan mengikuti kata tanya, dan pertanyaan tetap memakai urutan biasa.", vi: "Cụm nhấn mạnh đứng sau từ để hỏi, và câu hỏi giữ trật tự từ thông thường." }
            ex: ["Where ", { target: "in the world" }, " did you put it?"]
            tr: { uk: "Куди ти це взагалі поклав?", es: "¿Dónde diablos lo pusiste?", pt: "Onde diabos você colocou isso?", fr: "Où diable l’as-tu mis ?", de: "Wo um alles in der Welt hast du es hingelegt?", it: "Dove diavolo l'hai messo?", pl: "Gdzie ty to u licha położyłeś?", tr: "Onu nereye koydun yahu?", id: "Di mana sebenarnya kamu menaruhnya?", vi: "Rốt cuộc bạn để nó ở đâu vậy?" }

