          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, form: { pattern: [How come, { slot: clause }] }, use: { en: "asks the reason, with surprise; the clause keeps statement order", uk: "питає про причину зі здивуванням; після нього порядок слів як у розповідному реченні", es: "pregunta la razón con sorpresa; la oración sigue el orden de una afirmación", pt: "pergunta o motivo com surpresa; a oração segue a ordem de uma afirmação", fr: "demande la raison avec surprise ; la proposition suit l’ordre d’une phrase affirmative", de: "fragt mit Überraschung nach dem Grund; der Satz behält die Wortstellung des Aussagesatzes", it: "chiede il motivo con sorpresa; la frase mantiene l'ordine affermativo", pl: "pyta o przyczynę ze zdziwieniem; zdanie ma szyk oznajmujący", tr: "şaşkınlıkla nedeni sorar; cümle düz cümle sırasını korur", id: "menanyakan alasan dengan heran; klausa memakai urutan kalimat pernyataan", vi: "hỏi lý do với vẻ ngạc nhiên; mệnh đề giữ trật tự như câu trần thuật" }, ex: [{ target: "How come" }, " you're late?"], tr: { uk: "Чого це ти запізнився?", es: "¿Cómo es que llegas tarde?", pt: "Como assim você está atrasado?", fr: "Comment se fait-il que tu sois en retard ?", de: "Wieso kommst du zu spät?", it: "Com'è che sei in ritardo?", pl: "Jak to się stało, że się spóźniłeś?", tr: "Nasıl oldu da geç kaldın?", id: "Kok kamu bisa terlambat?", vi: "Sao bạn lại đến muộn thế?" } }
          - { level: B2, form: { pattern: [What if, { slot: clause }] }, use: { en: "asks about a possibility or a risk", uk: "питає про можливість або ризик", es: "pregunta por una posibilidad o un riesgo", pt: "pergunta sobre uma possibilidade ou um risco", fr: "interroge sur une possibilité ou un risque", de: "fragt nach einer Möglichkeit oder einem Risiko", it: "chiede di una possibilità o di un rischio", pl: "pyta o możliwość lub ryzyko", tr: "bir olasılığı ya da riski sorar", id: "menanyakan kemungkinan atau risiko", vi: "hỏi về một khả năng hoặc một rủi ro" }, ex: [{ target: "What if" }, " it rains?"], tr: { uk: "А що, як піде дощ?", es: "¿Y si llueve?", pt: "E se chover?", fr: "Et s’il pleut ?", de: "Was ist, wenn es regnet?", it: "E se piove?", pl: "A co, jeśli będzie padać?", tr: "Ya yağmur yağarsa?", id: "Bagaimana kalau hujan?", vi: "Nếu trời mưa thì sao?" } }
          - { level: B2, form: { pattern: [{ alternatives: [What about, How about] }, { alternatives: [{ slot: noun }, { slot: -ing }] }] }, use: { en: "a suggestion or an offer", uk: "ідея чи пропозиція", es: "una sugerencia o un ofrecimiento", pt: "uma sugestão ou uma oferta", fr: "une suggestion ou une offre", de: "ein Vorschlag oder ein Angebot", it: "un suggerimento o un'offerta", pl: "propozycja lub oferta", tr: "bir öneri ya da teklif", id: "saran atau tawaran", vi: "một gợi ý hoặc một lời đề nghị" }, ex: { examples: [[{ target: "How about" }, " going for a walk?"], [{ target: "What about" }, " Tom?"]] }, tr: { uk: { examples: ["Може, підемо на прогулянку?", "А як щодо Тома?"] }, es: { examples: ["¿Y si vamos a dar un paseo?", "¿Y Tom?"] }, pt: { examples: ["Que tal darmos um passeio?", "E o Tom?"] }, fr: { examples: ["Et si on allait se promener ?", "Et Tom ?"] }, de: { examples: ["Wie wäre es mit einem Spaziergang?", "Und was ist mit Tom?"] }, it: { examples: ["Che ne dici di fare una passeggiata?", "E Tom?"] }, pl: { examples: ["Może pójdziemy na spacer?", "A co z Tomem?"] }, tr: { examples: ["Yürüyüşe çıksak nasıl olur?", "Peki ya Tom?"] }, id: { examples: ["Bagaimana kalau kita jalan-jalan?", "Bagaimana dengan Tom?"] }, vi: { examples: ["Đi dạo một chút thì sao?", "Còn Tom thì sao?"] } } }
          - { level: B2, form: { pattern: [Why not, { slot: V }] }, use: { en: "a suggestion", uk: "пропозиція", es: "una sugerencia", pt: "uma sugestão", fr: "une suggestion", de: "ein Vorschlag", it: "un suggerimento", pl: "propozycja", tr: "bir öneri", id: "saran", vi: "một gợi ý" }, ex: [{ target: "Why not" }, " ask her?"], tr: { uk: "Чому б не спитати її?", es: "¿Por qué no le preguntas?", pt: "Por que não perguntar a ela?", fr: "Pourquoi ne pas lui demander ?", de: "Warum fragst du sie nicht?", it: "Perché non glielo chiedi?", pl: "Dlaczego jej nie zapytać?", tr: "Neden ona sormuyorsun?", id: "Kenapa tidak bertanya padanya?", vi: "Sao không hỏi cô ấy?" } }
          - { level: B2, form: { pattern: [{ slot: helper }, { slot: subject }, option, or, option] }, use: { en: "a choice: the voice rises on the first option and falls on the last", uk: "вибір: голос підвищується на першому варіанті й знижується на останньому", es: "una elección: la voz sube en la primera opción y baja en la última", pt: "uma escolha: a voz sobe na primeira opção e desce na última", fr: "un choix : la voix monte sur la première option et descend sur la dernière", de: "eine Auswahl: die Stimme steigt bei der ersten Möglichkeit und fällt bei der letzten", it: "una scelta: la voce sale sulla prima opzione e scende sull'ultima", pl: "wybór: głos wznosi się na pierwszej opcji i opada na ostatniej", tr: "bir seçim: ses ilk seçenekte yükselir, sonuncuda alçalır", id: "pilihan: suara naik pada pilihan pertama dan turun pada yang terakhir", vi: "sự lựa chọn: giọng lên ở phương án đầu và xuống ở phương án cuối" }, ex: ["Is it ", { target: red }, " ", { intonation: rise }, "or ", { target: blue }, "? ", { intonation: fall }], tr: { uk: "Це червоне чи синє?", es: "¿Es rojo o azul?", pt: "É vermelho ou azul?", fr: "Est-ce rouge ou bleu ?", de: "Ist es rot oder blau?", it: "È rosso o blu?", pl: "Czy to jest czerwone, czy niebieskie?", tr: "Kırmızı mı, mavi mi?", id: "Apakah itu merah atau biru?", vi: "Nó màu đỏ hay màu xanh?" } }
          - { level: B2, form: { pattern: [{ slot: wh-word }, { slot: verb }, { slot: wh-word }] }, use: { en: "asks about several parts at once", uk: "питає про кілька частин одночасно", es: "pregunta por varias partes a la vez", pt: "pergunta sobre várias partes ao mesmo tempo", fr: "interroge sur plusieurs éléments à la fois", de: "fragt mehrere Satzteile auf einmal", it: "chiede di più parti insieme", pl: "pyta o kilka elementów naraz", tr: "aynı anda birkaç öğeyi sorar", id: "menanyakan beberapa bagian sekaligus", vi: "hỏi về nhiều thành phần cùng lúc" }, ex: { examples: [[{ target: Who }, " said ", { target: what }, " to ", { target: whom }, "?"], [{ target: Who }, " bought ", { target: what }, "?"]] }, tr: { uk: { examples: ["Хто що кому сказав?", "Хто що купив?"] }, es: { examples: ["¿Quién le dijo qué a quién?", "¿Quién compró qué?"] }, pt: { examples: ["Quem disse o quê a quem?", "Quem comprou o quê?"] }, fr: { examples: ["Qui a dit quoi à qui ?", "Qui a acheté quoi ?"] }, de: { examples: ["Wer hat wem was gesagt?", "Wer hat was gekauft?"] }, it: { examples: ["Chi ha detto che cosa a chi?", "Chi ha comprato che cosa?"] }, pl: { examples: ["Kto co komu powiedział?", "Kto co kupił?"] }, tr: { examples: ["Kim kime ne söyledi?", "Kim ne aldı?"] }, id: { examples: ["Siapa mengatakan apa kepada siapa?", "Siapa membeli apa?"] }, vi: { examples: ["Ai đã nói gì với ai?", "Ai đã mua gì?"] } } }

  - title: { en: "Polite and formal questions", uk: "Ввічливі й офіційні питання", es: "Preguntas corteses y formales", pt: "Perguntas educadas e formais", fr: "Questions polies et soutenues", de: "Höfliche und förmliche Fragen", it: "Domande cortesi e formali", pl: "Pytania uprzejme i oficjalne", tr: "Nazik ve resmî sorular", id: "Pertanyaan sopan dan formal", vi: "Câu hỏi lịch sự và trang trọng" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: ["Might I ask ", { gap: true }, "?"], use: { en: "a formal request for information", uk: "офіційне прохання повідомити інформацію", es: "una petición formal de información", pt: "um pedido formal de informação", fr: "une demande de renseignement soutenue", de: "eine förmliche Bitte um Auskunft", it: "una richiesta formale di informazioni", pl: "oficjalna prośba o informację", tr: "bilgi için resmî bir rica", id: "permintaan informasi secara formal", vi: "yêu cầu thông tin một cách trang trọng" }, ex: [{ target: "Might I ask" }, " who is calling?"], tr: { uk: "Дозвольте запитати, хто телефонує?", es: "¿Podría preguntar quién llama?", pt: "Posso perguntar quem está ligando?", fr: "Puis-je vous demander qui est à l’appareil ?", de: "Darf ich fragen, wer am Apparat ist?", it: "Posso chiedere chi parla?", pl: "Czy mogę zapytać, kto dzwoni?", tr: "Kimin aradığını sorabilir miyim?", id: "Bolehkah saya bertanya siapa yang menelepon?", vi: "Xin phép cho tôi hỏi ai đang gọi ạ?" } }
          - { level: C1, form: ["Would you be so kind as to ", { gap: true }, "?"], use: { en: "a formal request for action", uk: "офіційне прохання щось зробити", es: "una petición formal para que alguien haga algo", pt: "um pedido formal para que alguém faça algo", fr: "une demande d’action soutenue", de: "eine förmliche Bitte um eine Handlung", it: "una richiesta formale di fare qualcosa", pl: "oficjalna prośba o wykonanie czynności", tr: "bir işin yapılması için resmî rica", id: "permintaan tindakan secara formal", vi: "yêu cầu ai đó làm gì một cách trang trọng" }, ex: [{ target: "Would you be so kind as to" }, " close the window?"], tr: { uk: "Чи не були б ви такі люб’язні зачинити вікно?", es: "¿Sería tan amable de cerrar la ventana?", pt: "Teria a gentileza de fechar a janela?", fr: "Auriez-vous l’obligeance de fermer la fenêtre ?", de: "Wären Sie so freundlich, das Fenster zu schließen?", it: "Sarebbe così gentile da chiudere la finestra?", pl: "Czy byłby Pan tak uprzejmy i zamknął okno?", tr: "Pencereyi kapatma nezaketini gösterir misiniz?", id: "Maukah Anda berbaik hati menutup jendela?", vi: "Xin vui lòng đóng giúp cửa sổ được không ạ?" } }
          - { level: C1, form: ["Do you happen to know ", { gap: true }, "?"], use: { en: "a tentative question: the speaker does not assume you know", uk: "обережне питання: мовець не вважає, що співрозмовник знає", es: "una pregunta cautelosa: no supone que la otra persona lo sepa", pt: "uma pergunta cautelosa: não supõe que a outra pessoa saiba", fr: "une question prudente : elle ne suppose pas que l’autre le sache", de: "eine vorsichtige Frage: sie setzt nicht voraus, dass der andere es weiß", it: "una domanda cauta: non dà per scontato che l'altro lo sappia", pl: "ostrożne pytanie: nie zakłada, że rozmówca to wie", tr: "çekingen bir soru: karşıdakinin bildiğini varsaymaz", id: "pertanyaan yang hati-hati: tidak menganggap lawan bicara tahu", vi: "câu hỏi dè dặt: không cho rằng người nghe biết" }, ex: [{ target: "Do you happen to know" }, " where the station is?"], tr: { uk: "Ви, часом, не знаєте, де вокзал?", es: "¿Por casualidad sabe dónde queda la estación?", pt: "Por acaso você sabe onde fica a estação?", fr: "Savez-vous par hasard où se trouve la gare ?", de: "Wissen Sie zufällig, wo der Bahnhof ist?", it: "Per caso sa dov'è la stazione?", pl: "Czy wie Pan może, gdzie jest dworzec?", tr: "Garın nerede olduğunu bilir misiniz acaba?", id: "Apakah Anda kebetulan tahu di mana stasiunnya?", vi: "Bạn có tình cờ biết nhà ga ở đâu không?" } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "After these frames a wh-clause keeps statement order, with no inverted auxiliary.", uk: "Після цих зворотів підрядна частина з питальним словом має порядок слів розповідного речення, без перестановки допоміжного дієслова.", es: "Después de estas fórmulas, la cláusula con palabra interrogativa sigue el orden de una afirmación, sin auxiliar invertido.", pt: "Depois dessas fórmulas, a oração com palavra interrogativa segue a ordem de uma afirmação, sem auxiliar invertido.", fr: "Après ces formules, la proposition en wh- suit l’ordre d’une phrase affirmative, sans inversion de l’auxiliaire.", de: "Nach diesen Formeln behält der W-Nebensatz die Wortstellung des Aussagesatzes, ohne vorangestelltes Hilfsverb.", it: "Dopo queste formule la proposizione con wh- mantiene l'ordine della frase affermativa, senza ausiliare invertito.", pl: "Po tych zwrotach zdanie z wyrazem pytającym ma szyk oznajmujący, bez przestawionego czasownika pomocniczego.", tr: "Bu kalıplardan sonra wh- sözcüklü yan cümle düz cümle sırasını korur; yardımcı fiil öne geçmez.", id: "Setelah pola ini, klausa wh- memakai urutan kalimat pernyataan, tanpa kata kerja bantu yang dibalik.", vi: "Sau các cấu trúc này, mệnh đề wh- giữ trật tự như câu trần thuật, không đảo trợ động từ." }
            ex: [{ target: "Might I ask" }, " what time the shop opens?"]
            tr: { uk: "Дозвольте запитати, о котрій відкривається магазин?", es: "¿Podría preguntar a qué hora abre la tienda?", pt: "Posso perguntar a que horas a loja abre?", fr: "Puis-je vous demander à quelle heure ouvre le magasin ?", de: "Darf ich fragen, wann das Geschäft öffnet?", it: "Posso chiedere a che ora apre il negozio?", pl: "Czy mogę zapytać, o której otwierają sklep?", tr: "Mağazanın saat kaçta açıldığını sorabilir miyim?", id: "Bolehkah saya bertanya jam berapa toko buka?", vi: "Xin phép cho tôi hỏi mấy giờ cửa hàng mở cửa ạ?" }

  - title: { en: "Rhetorical and statement questions", uk: "Риторичні питання та питання у формі твердження", es: "Preguntas retóricas y preguntas en forma de afirmación", pt: "Perguntas retóricas e perguntas em forma de afirmação", fr: "Questions rhétoriques et questions à forme affirmative", de: "Rhetorische Fragen und Aussagefragen", it: "Domande retoriche e domande in forma di affermazione", pl: "Pytania retoryczne i pytania w formie twierdzenia", tr: "Retorik sorular ve düz cümle biçimli sorular", id: "Pertanyaan retoris dan pertanyaan berbentuk pernyataan", vi: "Câu hỏi tu từ và câu hỏi có dạng câu trần thuật" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Question, uk: "Питання", es: "Pregunta", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: means, label: { en: It means, uk: "Що означає", es: "Significa", pt: "Significa", fr: "Sens", de: "Bedeutet", it: "Significa", pl: "Znaczy", tr: "Anlamı", id: "Artinya", vi: "Có nghĩa là" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { en: "a statement with a rising voice", uk: "розповідне речення з висхідною інтонацією", es: "una afirmación con la voz ascendente", pt: "uma afirmação com a voz ascendente", fr: "une phrase affirmative à intonation montante", de: "ein Aussagesatz mit steigender Stimme", it: "una frase affermativa con la voce che sale", pl: "zdanie oznajmujące z rosnącą intonacją", tr: "yükselen sesle söylenen düz cümle", id: "kalimat pernyataan dengan suara naik", vi: "câu trần thuật với giọng lên cao" }, means: { en: "a check, or surprise", uk: "перепитування або здивування", es: "una comprobación o sorpresa", pt: "uma confirmação ou surpresa", fr: "une vérification ou de la surprise", de: "eine Rückfrage oder Überraschung", it: "una conferma o sorpresa", pl: "upewnienie się lub zdziwienie", tr: "doğrulama isteği ya da şaşkınlık", id: "pengecekan atau keheranan", vi: "để xác nhận lại hoặc thể hiện sự ngạc nhiên" }, ex: [{ target: "You're leaving?" }, " ", { intonation: rise }], tr: { uk: "Ти йдеш?", es: "¿Te vas?", pt: "Você está indo embora?", fr: "Tu t’en vas ?", de: "Du gehst?", it: "Te ne vai?", pl: "Wychodzisz?", tr: "Gidiyor musun?", id: "Kamu pergi?", vi: "Bạn đi rồi à?" } }
          - { level: C1, form: "Who cares?", means: { en: "nobody cares", uk: "нікому немає діла", es: "a nadie le importa", pt: "ninguém se importa", fr: "personne ne s’en soucie", de: "es interessiert niemanden", it: "a nessuno importa", pl: "nikogo to nie obchodzi", tr: "kimsenin umurunda değil", id: "tidak ada yang peduli", vi: "chẳng ai quan tâm" }, ex: ["It's only a game. ", { target: "Who cares?" }], tr: { uk: "Це лише гра. Кого це обходить?", es: "Es solo un juego. ¿A quién le importa?", pt: "É só um jogo. Quem se importa?", fr: "Ce n’est qu’un jeu. Qui s’en soucie ?", de: "Es ist nur ein Spiel. Wen kümmert das?", it: "È solo un gioco. Chi se ne importa?", pl: "To tylko gra. Kogo to obchodzi?", tr: "Sadece bir oyun. Kimin umurunda?", id: "Ini hanya permainan. Siapa yang peduli?", vi: "Chỉ là một trò chơi thôi. Ai quan tâm chứ?" } }
          - { level: C1, form: "Why bother?", means: { en: "there is no reason to try", uk: "немає сенсу намагатися", es: "no hay razón para intentarlo", pt: "não há motivo para tentar", fr: "il n’y a aucune raison d’essayer", de: "es gibt keinen Grund, es zu versuchen", it: "non c'è motivo di provarci", pl: "nie ma powodu, żeby próbować", tr: "denemek için bir neden yok", id: "tidak ada alasan untuk mencoba", vi: "không có lý do gì để cố gắng" }, ex: ["It never works. ", { target: "Why bother?" }], tr: { uk: "Це ніколи не працює. Навіщо морочитися?", es: "Nunca funciona. ¿Para qué molestarse?", pt: "Nunca funciona. Para que se dar ao trabalho?", fr: "Ça ne marche jamais. À quoi bon ?", de: "Es funktioniert nie. Wozu die Mühe?", it: "Non funziona mai. Perché perdere tempo?", pl: "To nigdy nie działa. Po co się trudzić?", tr: "Hiç işe yaramıyor. Boşuna uğraşmaya ne gerek var?", id: "Ini tidak pernah berhasil. Buat apa repot-repot?", vi: "Nó không bao giờ có tác dụng. Làm gì mất công?" } }
          - { level: C1, form: "What difference does it make?", means: { en: "it makes no difference", uk: "це нічого не змінює", es: "no cambia nada", pt: "não faz diferença", fr: "cela ne change rien", de: "es macht keinen Unterschied", it: "non fa nessuna differenza", pl: "to nie robi różnicy", tr: "fark etmez", id: "tidak ada bedanya", vi: "không có gì khác biệt" }, ex: ["We'll be late either way. ", { target: "What difference does it make?" }], tr: { uk: "Ми запізнимося в будь-якому разі. Яка різниця?", es: "Llegaremos tarde de todos modos. ¿Qué más da?", pt: "Vamos nos atrasar de qualquer jeito. Que diferença faz?", fr: "Nous serons en retard de toute façon. Quelle différence cela fait-il ?", de: "Wir kommen sowieso zu spät. Was macht das für einen Unterschied?", it: "Faremo tardi comunque. Che differenza fa?", pl: "I tak się spóźnimy. Jaka to różnica?", tr: "Zaten geç kalacağız. Ne fark eder?", id: "Kita akan terlambat bagaimanapun juga. Apa bedanya?", vi: "Dù sao chúng ta cũng sẽ đến muộn. Có khác gì đâu?" } }

  - title: { en: "Negation: forms", uk: "Заперечення: форми", es: "Negación: formas", pt: "Negação: formas", fr: "Négation : formes", de: "Verneinung: Formen", it: "Negazione: forme", pl: "Przeczenie: formy", tr: "Olumsuzluk: biçimler", id: "Negasi: bentuk", vi: "Phủ định: các dạng" }
    role: form
    content:
