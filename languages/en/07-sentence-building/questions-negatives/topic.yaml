          - { level: B2, form: ["Haven't you ", { gap: true }, "?"], shows: { en: "surprise that something has not happened", uk: "здивування, що щось іще не сталося", es: "sorpresa porque algo no ha ocurrido", pt: "surpresa porque algo ainda não aconteceu", fr: "surprise devant ce qui ne s’est pas encore produit", de: "Überraschung, dass etwas noch nicht geschehen ist", it: "sorpresa che qualcosa non sia ancora successo", pl: "zdziwienie, że coś jeszcze się nie stało", tr: "bir şeyin henüz olmamasına şaşırma", id: "keheranan karena sesuatu belum terjadi", vi: "ngạc nhiên vì điều gì đó chưa xảy ra" }, ex: [{ target: "Haven't you" }, " finished yet?"], tr: { uk: "Невже ти ще не закінчив?", es: "¿Todavía no terminaste?", pt: "Você ainda não terminou?", fr: "N’as-tu pas encore fini ?", de: "Bist du noch nicht fertig?", it: "Non hai ancora finito?", pl: "Czy jeszcze nie skończyłeś?", tr: "Hâlâ bitirmedin mi?", id: "Apakah kamu belum selesai juga?", vi: "Bạn vẫn chưa xong à?" } }
