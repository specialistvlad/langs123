            tr: { uk: "Я не погоджуюся.", es: "No estoy de acuerdo.", pt: "Eu não concordo.", fr: "Je ne suis pas d’accord.", de: "Ich bin damit nicht einverstanden.", it: "Non sono d'accordo.", pl: "Nie zgadzam się.", tr: "Katılmıyorum.", id: "Saya tidak setuju.", vi: "Tôi không đồng ý." }

