            ger: { ex: [{ target: Singing the anthem }, " is a tradition."], tr: { uk: "Співати гімн — це традиція.", es: "Cantar el himno es una tradición.", pt: "Cantar o hino é uma tradição.", fr: "Chanter l’hymne est une tradition.", de: "Die Hymne zu singen ist eine Tradition.", it: "Cantare l'inno è una tradizione.", pl: "Śpiewanie hymnu jest tradycją.", tr: "Marşı söylemek bir gelenektir.", id: "Menyanyikan lagu kebangsaan adalah tradisi.", vi: "Hát quốc ca là một truyền thống." } }
            noun: { ex: ["The ", { target: singing of the anthem }, " is a tradition."], tr: { uk: "Виконання гімну — це традиція.", es: "El canto del himno es una tradición.", pt: "O canto do hino é uma tradição.", fr: "Le chant de l’hymne est une tradition.", de: "Das Singen der Hymne ist eine Tradition.", it: "Il canto dell'inno è una tradizione.", pl: "Śpiewanie hymnu to tradycja.", tr: "Marşın söylenmesi bir gelenektir.", id: "Pelantunan lagu kebangsaan adalah tradisi.", vi: "Việc hát quốc ca là một truyền thống." } }
          - level: C1
            ger: { ex: [{ target: Painting portraits quickly }, " takes skill."], tr: { uk: "Швидко малювати портрети вимагає майстерності.", es: "Pintar retratos rápido requiere habilidad.", pt: "Pintar retratos rapidamente exige habilidade.", fr: "Peindre des portraits rapidement demande du talent.", de: "Porträts schnell zu malen erfordert Geschick.", it: "Dipingere ritratti velocemente richiede abilità.", pl: "Szybkie malowanie portretów wymaga umiejętności.", tr: "Portreleri hızlı çizmek beceri ister.", id: "Melukis potret dengan cepat membutuhkan keterampilan.", vi: "Vẽ chân dung nhanh đòi hỏi kỹ năng." } }
            noun: { ex: ["Her ", { target: quick painting of portraits }, " impressed us."], tr: { uk: "Її швидке малювання портретів вразило нас.", es: "Su rápida pintura de retratos nos impresionó.", pt: "Sua pintura rápida de retratos nos impressionou.", fr: "Sa peinture rapide de portraits nous a impressionnés.", de: "Ihr schnelles Malen von Porträts beeindruckte uns.", it: "La sua rapida pittura di ritratti ci ha colpito.", pl: "Jej szybkie malowanie portretów zrobiło na nas wrażenie.", tr: "Portreleri hızlı çizişi bizi etkiledi.", id: "Lukisan potretnya yang cepat membuat kami terkesan.", vi: "Việc cô ấy vẽ chân dung nhanh khiến chúng tôi ấn tượng." } }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "A possessive before the -ing form is formal; speech uses the object form:", uk: "Присвійна форма перед -ing — формальна; у мовленні вживають об’єктну форму:", es: "Un posesivo antes de la forma en -ing es formal; en el habla se usa la forma de objeto:", pt: "Um possessivo antes da forma em -ing é formal; na fala usa-se a forma de objeto:", fr: "Un possessif devant la forme en -ing est soutenu ; à l’oral, on emploie la forme complément :", de: "Ein Possessiv vor der -ing-Form ist formell; in der gesprochenen Sprache steht die Objektform:", it: "Un possessivo prima della forma in -ing è formale; nel parlato si usa la forma complemento:", pl: "Forma dzierżawcza przed formą na -ing jest formalna; w mowie używa się formy dopełnienia:", tr: "-ing biçiminden önce iyelik biçimi resmîdir; konuşmada nesne biçimi kullanılır:", id: "Bentuk kepemilikan sebelum bentuk -ing bersifat formal; dalam percakapan dipakai bentuk objek:", vi: "Dạng sở hữu trước dạng -ing mang tính trang trọng; trong lời nói người ta dùng dạng tân ngữ:" }
            ex: { contrast: [["Do you mind ", { target: my opening }, " the window?"], ["Do you mind ", { target: me opening }, " the window?"]] }
            tr: { uk: { contrast: ["Ви не заперечуватимете, якщо я відчиню вікно?", "Ти не проти, якщо я відчиню вікно?"] }, es: { contrast: ["¿Le importa que abra la ventana?", "¿Te importa que abra la ventana?"] }, pt: { contrast: ["O senhor se importa que eu abra a janela?", "Você se importa se eu abrir a janela?"] }, fr: { contrast: ["Cela vous dérange-t-il que j’ouvre la fenêtre ?", "Ça te dérange que j’ouvre la fenêtre ?"] }, de: { contrast: ["Haben Sie etwas dagegen, dass ich das Fenster öffne?", "Hast du was dagegen, dass ich das Fenster öffne?"] }, it: { contrast: ["Le dispiace se apro la finestra?", "Ti dispiace se apro la finestra?"] }, pl: { contrast: ["Czy będzie Państwu przeszkadzać, że otworzę okno?", "Przeszkadza ci, że otworzę okno?"] }, tr: { contrast: ["Pencereyi açmamın bir sakıncası var mı?", "Pencereyi açsam sorun olur mu?"] }, id: { contrast: ["Apakah Anda keberatan jika saya membuka jendela?", "Kamu keberatan kalau aku buka jendelanya?"] }, vi: { contrast: ["Ông bà có phiền nếu tôi mở cửa sổ không?", "Bạn có phiền nếu mình mở cửa sổ không?"] } }
          - type: note
            level: C1
            text: { en: ["Verbs followed by -ing: ", { link: Gerund vs Infinitive, to: en.verbs.gerund-vs-infinitive }, "."], uk: ["Дієслова, після яких стоїть -ing: ", { link: "Герундій чи інфінітив", to: "en.verbs.gerund-vs-infinitive" }, "."], es: ["Verbos seguidos de -ing: ", { link: "Gerundio o infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], pt: ["Verbos seguidos de -ing: ", { link: "Gerúndio ou infinitivo", to: "en.verbs.gerund-vs-infinitive" }, "."], fr: ["Verbes suivis de -ing : ", { link: "Forme en -ing ou infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], de: ["Verben mit folgendem -ing: ", { link: "Gerund oder Infinitiv", to: "en.verbs.gerund-vs-infinitive" }, "."], it: ["Verbi seguiti da -ing: ", { link: "Gerundio o infinito", to: "en.verbs.gerund-vs-infinitive" }, "."], pl: ["Czasowniki, po których występuje -ing: ", { link: "Gerund czy bezokolicznik", to: "en.verbs.gerund-vs-infinitive" }, "."], tr: ["-ing alan fiiller: ", { link: "Gerund mu, mastar mı", to: "en.verbs.gerund-vs-infinitive" }, "."], id: ["Kata kerja yang diikuti -ing: ", { link: "Gerund atau infinitif", to: "en.verbs.gerund-vs-infinitive" }, "."], vi: ["Các động từ theo sau bởi -ing: ", { link: "Danh động từ hay động từ nguyên mẫu", to: "en.verbs.gerund-vs-infinitive" }, "."] }

  - title: { en: Complex noun phrases in academic prose, uk: "Складні іменникові словосполучення в науковому тексті", es: "Grupos nominales complejos en la prosa académica", pt: "Sintagmas nominais complexos na prosa acadêmica", fr: "Groupes nominaux complexes dans la prose universitaire", de: "Komplexe Nominalphrasen in wissenschaftlichen Texten", it: "Sintagmi nominali complessi nella prosa accademica", pl: "Złożone grupy rzeczownikowe w prozie naukowej", tr: "Akademik yazıda karmaşık isim öbekleri", id: "Frasa nomina kompleks dalam prosa akademik", vi: "Cụm danh từ phức trong văn học thuật" }
    role: own
    content:
      - type: usage
        columns:
          - { key: device, label: { en: Device, uk: "Засіб", es: "Recurso", pt: "Recurso", fr: "Procédé", de: "Mittel", it: "Strumento", pl: "Środek", tr: "Yöntem", id: "Cara", vi: "Cách" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            device: { en: heavy postmodification, uk: "розгорнуте означення після іменника", es: "mucha modificación tras el sustantivo", pt: "muita modificação depois do substantivo", fr: "forte modification après le nom", de: "starke Nachstellung von Attributen", it: "forte modificazione dopo il sostantivo", pl: "rozbudowane określenia po rzeczowniku", tr: "isimden sonra yoğun niteleme", id: "pewatas panjang setelah kata benda", vi: "nhiều từ bổ nghĩa đứng sau danh từ" }
            ex: ["the ", { target: impact }, " of rising prices on the spending of families in rural areas"]
            tr: { uk: "вплив зростання цін на витрати сімей у сільській місцевості", es: "el efecto del aumento de los precios en el gasto de las familias de zonas rurales", pt: "o impacto do aumento dos preços nos gastos das famílias em áreas rurais", fr: "l’effet de la hausse des prix sur les dépenses des familles en zone rurale", de: "die Auswirkung steigender Preise auf die Ausgaben von Familien in ländlichen Gebieten", it: "l'impatto dell'aumento dei prezzi sulla spesa delle famiglie nelle aree rurali", pl: "wpływ rosnących cen na wydatki rodzin na obszarach wiejskich", tr: "artan fiyatların kırsal bölgelerdeki ailelerin harcamaları üzerindeki etkisi", id: "dampak kenaikan harga terhadap pengeluaran keluarga di daerah pedesaan", vi: "tác động của giá cả tăng lên đối với chi tiêu của các gia đình ở vùng nông thôn" }
          - level: C1
            device: { en: apposition for definition, uk: "прикладка для визначення", es: "aposición para definir", pt: "aposto para definir", fr: "apposition pour définir", de: "Apposition zur Definition", it: "apposizione per definire", pl: "apozycja definiująca", tr: "tanımlamak için apozisyon", id: "aposisi untuk mendefinisikan", vi: "đồng vị ngữ để định nghĩa" }
            ex: ["Inflation", { target: ", the general rise in prices," }, " reduces what people can buy."]
            tr: { uk: "Інфляція, загальне зростання цін, зменшує те, що люди можуть купити.", es: "La inflación, el aumento general de los precios, reduce lo que la gente puede comprar.", pt: "A inflação, o aumento geral dos preços, reduz o que as pessoas podem comprar.", fr: "L’inflation, la hausse générale des prix, réduit ce que les gens peuvent acheter.", de: "Die Inflation, der allgemeine Anstieg der Preise, verringert, was Menschen kaufen können.", it: "L'inflazione, l'aumento generale dei prezzi, riduce ciò che le persone possono comprare.", pl: "Inflacja, czyli ogólny wzrost cen, zmniejsza to, co ludzie mogą kupić.", tr: "Enflasyon, yani fiyatlardaki genel artış, insanların satın alabileceği şeyleri azaltır.", id: "Inflasi, kenaikan harga secara umum, mengurangi apa yang bisa dibeli orang.", vi: "Lạm phát, tức sự tăng giá chung, làm giảm những gì mọi người có thể mua." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: "Find the head noun first, then read each phrase as detail about it.", uk: "Спершу знайдіть головний іменник, а потім читайте кожну частину як подробицю про нього.", es: "Primero busca el sustantivo núcleo y luego lee cada frase como un detalle sobre él.", pt: "Primeiro encontre o substantivo núcleo e depois leia cada trecho como um detalhe sobre ele.", fr: "Trouve d’abord le nom noyau, puis lis chaque groupe comme un détail sur lui.", de: "Such zuerst das Kernnomen und lies dann jede Wortgruppe als Angabe dazu.", it: "Trova prima il sostantivo principale, poi leggi ogni sintagma come un dettaglio su di esso.", pl: "Najpierw znajdź rzeczownik nadrzędny, potem czytaj każdą grupę jako szczegół o nim.", tr: "Önce ana ismi bul, sonra her öbeği onunla ilgili bir ayrıntı olarak oku.", id: "Temukan kata benda inti lebih dahulu, lalu baca setiap frasa sebagai detail tentangnya.", vi: "Hãy tìm danh từ trung tâm trước, rồi đọc mỗi cụm như một chi tiết về nó." }
          - type: rule
            level: C1
            text: { en: "Break a chain of of-phrases with a noun modifier or a possessive:", uk: "Розірвіть ланцюжок із груп з of за допомогою іменника-означення або присвійної форми:", es: "Rompe una cadena de grupos con of con un modificador nominal o un posesivo:", pt: "Quebre uma cadeia de sintagmas com of com um modificador nominal ou um possessivo:", fr: "Casse une chaîne de groupes en of avec un nom modificateur ou un possessif :", de: "Unterbrich eine Kette von of-Phrasen mit einem Nomen als Attribut oder einem Possessiv:", it: "Spezza una catena di sintagmi con of con un modificatore nominale o un possessivo:", pl: "Przerwij łańcuch grup z of, używając rzeczownika w roli określenia lub formy dzierżawczej:", tr: "Bir of öbekleri zincirini isim niteleyici ya da iyelik biçimiyle kır:", id: "Pecahkan rangkaian frasa of dengan pewatas berupa kata benda atau bentuk kepemilikan:", vi: "Hãy cắt chuỗi các cụm of bằng danh từ bổ nghĩa hoặc dạng sở hữu:" }
            ex: { contrast: ["the analysis of the results of the study of the market", ["the analysis of the ", { target: market study }, " results"]] }
            tr: { uk: { contrast: ["аналіз результатів дослідження ринку", "аналіз результатів ринкового дослідження"] }, es: { contrast: ["el análisis de los resultados del estudio del mercado", "el análisis de los resultados del estudio de mercado"] }, pt: { contrast: ["a análise dos resultados do estudo do mercado", "a análise dos resultados do estudo de mercado"] }, fr: { contrast: ["l’analyse des résultats de l’étude du marché", "l’analyse des résultats de l’étude de marché"] }, de: { contrast: ["die Analyse der Ergebnisse der Untersuchung des Marktes", "die Analyse der Marktstudienergebnisse"] }, it: { contrast: ["l'analisi dei risultati dello studio del mercato", "l'analisi dei risultati dello studio di mercato"] }, pl: { contrast: ["analiza wyników badania rynku", "analiza wyników badania rynkowego"] }, tr: { contrast: ["pazar araştırmasının sonuçlarının analizi", "pazar araştırması sonuçları analizi"] }, id: { contrast: ["analisis terhadap hasil dari studi tentang pasar", "analisis hasil studi pasar"] }, vi: { contrast: ["phân tích kết quả của nghiên cứu về thị trường", "phân tích kết quả nghiên cứu thị trường"] } }

  - title: { en: Summary and shell nouns, uk: "Узагальнювальні іменники та іменники-оболонки (shell nouns)", es: "Sustantivos de resumen y sustantivos encapsuladores (shell nouns)", pt: "Substantivos de resumo e substantivos encapsuladores (shell nouns)", fr: "Noms de reprise et noms-enveloppes (shell nouns)", de: "Zusammenfassende Nomen und Hüllnomen (shell nouns)", it: "Sostantivi riassuntivi e sostantivi contenitore (shell nouns)", pl: "Rzeczowniki podsumowujące i rzeczowniki-powłoki (shell nouns)", tr: "Özetleyici isimler ve kabuk isimler (shell nouns)", id: "Nomina perangkum dan nomina cangkang (shell nouns)", vi: "Danh từ tóm tắt và danh từ vỏ (shell nouns)" }
    role: own
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type, uk: "Тип", es: "Tipo", pt: "Tipo", fr: "Type", de: "Typ", it: "Tipo", pl: "Typ", tr: "Tür", id: "Jenis", vi: "Loại" } }
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            type: { en: summary noun, uk: "узагальнювальний іменник", es: "sustantivo de resumen", pt: "substantivo de resumo", fr: "nom de reprise", de: "zusammenfassendes Nomen", it: "sostantivo riassuntivo", pl: "rzeczownik podsumowujący", tr: "özetleyici isim", id: "nomina perangkum", vi: "danh từ tóm tắt" }
            form: { pattern: [{ alternatives: [this, that, such a] }, { slot: noun }] }
            ex: { examples: [["The council raised parking fees. ", { target: This decision }, " upset drivers."], ["She answers every email within an hour. ", { target: Such an approach }, " builds trust."]] }
            tr: { uk: { examples: ["Міська рада підвищила плату за паркування. Це рішення обурило водіїв.", "Вона відповідає на кожен лист протягом години. Такий підхід зміцнює довіру."] }, es: { examples: ["El concejo municipal subió las tarifas de estacionamiento. Esta decisión molestó a los conductores.", "Ella responde cada correo en menos de una hora. Un enfoque así genera confianza."] }, pt: { examples: ["A prefeitura aumentou as tarifas de estacionamento. Essa decisão irritou os motoristas.", "Ela responde a cada e-mail em até uma hora. Uma abordagem assim gera confiança."] }, fr: { examples: ["Le conseil municipal a augmenté les tarifs de stationnement. Cette décision a mécontenté les automobilistes.", "Elle répond à chaque e-mail en moins d’une heure. Une telle approche inspire confiance."] }, de: { examples: ["Der Stadtrat hat die Parkgebühren erhöht. Diese Entscheidung verärgerte die Autofahrer.", "Sie beantwortet jede E-Mail innerhalb einer Stunde. Ein solches Vorgehen schafft Vertrauen."] }, it: { examples: ["Il consiglio comunale ha aumentato le tariffe dei parcheggi. Questa decisione ha irritato gli automobilisti.", "Risponde a ogni e-mail entro un'ora. Un approccio simile crea fiducia."] }, pl: { examples: ["Rada miasta podniosła opłaty za parkowanie. Ta decyzja zdenerwowała kierowców.", "Odpowiada na każdy e-mail w ciągu godziny. Takie podejście buduje zaufanie."] }, tr: { examples: ["Belediye meclisi otopark ücretlerini artırdı. Bu karar sürücüleri kızdırdı.", "Her e-postayı bir saat içinde yanıtlıyor. Böyle bir yaklaşım güven oluşturur."] }, id: { examples: ["Dewan kota menaikkan tarif parkir. Keputusan ini membuat para pengemudi kesal.", "Dia membalas setiap email dalam waktu satu jam. Pendekatan seperti itu membangun kepercayaan."] }, vi: { examples: ["Hội đồng thành phố đã tăng phí đỗ xe. Quyết định này khiến các tài xế bực bội.", "Cô ấy trả lời mọi email trong vòng một giờ. Cách làm như vậy tạo dựng lòng tin."] } }
          - level: C1
            type: { en: shell noun with a clause, uk: "іменник-оболонка з підрядним реченням", es: "sustantivo encapsulador con una oración", pt: "substantivo encapsulador com uma oração", fr: "nom-enveloppe avec une proposition", de: "Hüllnomen mit einem Satz", it: "sostantivo contenitore con una proposizione", pl: "rzeczownik-powłoka ze zdaniem", tr: "cümle alan kabuk isim", id: "nomina cangkang dengan klausa", vi: "danh từ vỏ đi với mệnh đề" }
            form: { pattern: [{ slot: noun }, that, { slot: clause }] }
            ex: ["The ", { target: fact that prices rose }, " surprised no one."]
            tr: { uk: "Той факт, що ціни зросли, нікого не здивував.", es: "El hecho de que los precios subieran no sorprendió a nadie.", pt: "O fato de os preços terem subido não surpreendeu ninguém.", fr: "Le fait que les prix aient augmenté n’a surpris personne.", de: "Dass die Preise gestiegen sind, überraschte niemanden.", it: "Il fatto che i prezzi siano saliti non ha sorpreso nessuno.", pl: "Fakt, że ceny wzrosły, nikogo nie zaskoczył.", tr: "Fiyatların yükselmiş olması kimseyi şaşırtmadı.", id: "Fakta bahwa harga naik tidak mengejutkan siapa pun.", vi: "Việc giá tăng không làm ai ngạc nhiên." }
          - level: C1
            type: { en: shell noun with a preposition, uk: "іменник-оболонка з прийменником", es: "sustantivo encapsulador con una preposición", pt: "substantivo encapsulador com uma preposição", fr: "nom-enveloppe avec une préposition", de: "Hüllnomen mit einer Präposition", it: "sostantivo contenitore con una preposizione", pl: "rzeczownik-powłoka z przyimkiem", tr: "edat alan kabuk isim", id: "nomina cangkang dengan preposisi", vi: "danh từ vỏ đi với giới từ" }
            form: { pattern: [the problem, with, { slot: noun }] }
            ex: ["The ", { target: problem with }, " this plan is the cost."]
            tr: { uk: "Проблема цього плану — вартість.", es: "El problema de este plan es el costo.", pt: "O problema desse plano é o custo.", fr: "Le problème de ce plan, c’est le coût.", de: "Das Problem an diesem Plan sind die Kosten.", it: "Il problema di questo piano è il costo.", pl: "Problem z tym planem to koszt.", tr: "Bu planın sorunu maliyet.", id: "Masalah dengan rencana ini adalah biayanya.", vi: "Vấn đề của kế hoạch này là chi phí." }
          - level: C1
            type: { en: shell noun with a wh-word, uk: "іменник-оболонка з питальним словом", es: "sustantivo encapsulador con una palabra interrogativa", pt: "substantivo encapsulador com uma palavra interrogativa", fr: "nom-enveloppe avec un mot interrogatif", de: "Hüllnomen mit einem Fragewort", it: "sostantivo contenitore con una parola interrogativa", pl: "rzeczownik-powłoka z zaimkiem pytajnym", tr: "soru sözcüğü alan kabuk isim", id: "nomina cangkang dengan kata tanya", vi: "danh từ vỏ đi với từ để hỏi" }
            form: { pattern: [the reason, why, { slot: clause }] }
            ex: ["The ", { target: reason why }, " prices rose is unclear."]
            tr: { uk: "Причина зростання цін незрозуміла.", es: "La razón por la que subieron los precios no está clara.", pt: "A razão pela qual os preços subiram não está clara.", fr: "La raison pour laquelle les prix ont augmenté n’est pas claire.", de: "Der Grund, warum die Preise gestiegen sind, ist unklar.", it: "Il motivo per cui i prezzi sono saliti non è chiaro.", pl: "Powód wzrostu cen jest niejasny.", tr: "Fiyatların neden yükseldiği belirsiz.", id: "Alasan harga naik tidak jelas.", vi: "Lý do giá tăng chưa rõ ràng." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { en: ["Shell nouns such as ", { term: fact }, ", ", { term: idea }, ", ", { term: problem }, ", ", { term: reason }, " and ", { term: claim }, " get their content from the clause around them."], uk: ["Іменники-оболонки, як-от ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " і ", { term: "claim" }, ", отримують зміст від речення навколо себе."], es: ["Los sustantivos encapsuladores, como ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " y ", { term: "claim" }, ", toman su contenido de la oración que los rodea."], pt: ["Substantivos encapsuladores como ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " e ", { term: "claim" }, " recebem seu conteúdo da oração ao redor."], fr: ["Les noms-enveloppes comme ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " et ", { term: "claim" }, " tirent leur contenu de la proposition qui les entoure."], de: ["Hüllnomen wie ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " und ", { term: "claim" }, " erhalten ihren Inhalt aus dem Satz um sie herum."], it: ["I sostantivi contenitore come ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " e ", { term: "claim" }, " prendono il loro contenuto dalla proposizione che li circonda."], pl: ["Rzeczowniki-powłoki, takie jak ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " i ", { term: "claim" }, ", biorą swoją treść ze zdania wokół nich."], tr: [{ term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " ve ", { term: "claim" }, " gibi kabuk isimler, içeriğini çevresindeki cümleden alır."], id: ["Nomina cangkang seperti ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " dan ", { term: "claim" }, " mengambil isinya dari klausa di sekitarnya."], vi: ["Các danh từ vỏ như ", { term: "fact" }, ", ", { term: "idea" }, ", ", { term: "problem" }, ", ", { term: "reason" }, " và ", { term: "claim" }, " lấy nội dung từ mệnh đề xung quanh."] }

  - title: { en: "Compare: verb style and noun style", uk: "Порівняння: дієслівний і іменниковий стиль", es: "Comparación: estilo verbal y estilo nominal", pt: "Comparação: estilo verbal e estilo nominal", fr: "Comparaison : style verbal et style nominal", de: "Vergleich: Verbalstil und Nominalstil", it: "Confronto: stile verbale e stile nominale", pl: "Porównanie: styl czasownikowy i styl rzeczownikowy", tr: "Karşılaştırma: fiil üslubu ve isim üslubu", id: "Perbandingan: gaya verbal dan gaya nominal", vi: "So sánh: lối viết dùng động từ và lối viết dùng danh từ" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: verbal, label: { en: Verb style, uk: "Дієслівний стиль", es: "Estilo verbal", pt: "Estilo verbal", fr: "Style verbal", de: "Verbalstil", it: "Stile verbale", pl: "Styl czasownikowy", tr: "Fiil üslubu", id: "Gaya verbal", vi: "Lối viết dùng động từ" } }
          - { key: nominal, label: { en: Noun style, uk: "Іменниковий стиль", es: "Estilo nominal", pt: "Estilo nominal", fr: "Style nominal", de: "Nominalstil", it: "Stile nominale", pl: "Styl rzeczownikowy", tr: "İsim üslubu", id: "Gaya nominal", vi: "Lối viết dùng danh từ" } }
        rows:
          - level: C1
            verbal: { en: "speech and plain writing; people act", uk: "мовлення й простий текст; діють люди", es: "habla y escritura sencilla; las personas actúan", pt: "fala e escrita simples; as pessoas agem", fr: "oral et écrit simple ; les personnes agissent", de: "gesprochene Sprache und schlichtes Schreiben; Menschen handeln", it: "parlato e scrittura semplice; le persone agiscono", pl: "mowa i prosty tekst; działają ludzie", tr: "konuşma ve sade yazı; eylemi insanlar yapar", id: "percakapan dan tulisan sederhana; orang yang bertindak", vi: "lời nói và văn viết giản dị; con người hành động" }
            nominal: { en: "academic and official writing; processes are things", uk: "науковий та офіційний текст; процеси стають предметами", es: "escritura académica y oficial; los procesos son cosas", pt: "escrita acadêmica e oficial; os processos viram coisas", fr: "écrit universitaire et officiel ; les processus deviennent des choses", de: "wissenschaftliches und amtliches Schreiben; Vorgänge werden zu Dingen", it: "scrittura accademica e ufficiale; i processi diventano cose", pl: "tekst naukowy i urzędowy; procesy stają się rzeczami", tr: "akademik ve resmî yazı; süreçler birer nesneye dönüşür", id: "tulisan akademik dan resmi; proses menjadi benda", vi: "văn viết học thuật và hành chính; quá trình trở thành sự vật" }
          - level: C1
            verbal: { ex: ["We ", { variant: { target: analysed }, variety: en-GB }, " ", { variant: analyzed, variety: en-US }, " the data."], tr: { uk: "Ми проаналізували дані.", es: "Analizamos los datos.", pt: "Analisamos os dados.", fr: "Nous avons analysé les données.", de: "Wir haben die Daten analysiert.", it: "Abbiamo analizzato i dati.", pl: "Przeanalizowaliśmy dane.", tr: "Verileri analiz ettik.", id: "Kami menganalisis datanya.", vi: "Chúng tôi đã phân tích dữ liệu." } }
            nominal: { ex: ["An ", { target: analysis of the data }, " was performed."], tr: { uk: "Було проведено аналіз даних.", es: "Se realizó un análisis de los datos.", pt: "Foi realizada uma análise dos dados.", fr: "Une analyse des données a été réalisée.", de: "Eine Analyse der Daten wurde durchgeführt.", it: "È stata effettuata un'analisi dei dati.", pl: "Przeprowadzono analizę danych.", tr: "Verilerin bir analizi yapıldı.", id: "Analisis terhadap data telah dilakukan.", vi: "Một bản phân tích dữ liệu đã được thực hiện." } }
          - level: C1
            verbal: { ex: ["Many people ", { target: worry }, " about the cost."], tr: { uk: "Багато людей хвилюються через вартість.", es: "Mucha gente se preocupa por el costo.", pt: "Muita gente se preocupa com o custo.", fr: "Beaucoup de gens s’inquiètent du coût.", de: "Viele Menschen machen sich Sorgen um die Kosten.", it: "Molte persone si preoccupano per il costo.", pl: "Wiele osób martwi się kosztem.", tr: "Birçok kişi maliyet konusunda endişeleniyor.", id: "Banyak orang khawatir tentang biayanya.", vi: "Nhiều người lo lắng về chi phí." } }
            nominal: { ex: ["The cost is a source of ", { target: widespread concern }, "."], tr: { uk: "Вартість викликає широке занепокоєння.", es: "El costo es motivo de una preocupación generalizada.", pt: "O custo é motivo de preocupação generalizada.", fr: "Le coût est une source d’inquiétude généralisée.", de: "Die Kosten sind Anlass weitverbreiteter Besorgnis.", it: "Il costo è fonte di diffusa preoccupazione.", pl: "Koszt jest źródłem powszechnego niepokoju.", tr: "Maliyet, yaygın bir endişe kaynağıdır.", id: "Biaya menjadi sumber kekhawatiran yang meluas.", vi: "Chi phí là nguồn gây lo ngại rộng rãi." } }
          - level: C1
            verbal: { ex: ["She ", { target: applied for }, " the job in May."], tr: { uk: "Вона подала заявку на цю посаду в травні.", es: "Ella solicitó el puesto en mayo.", pt: "Ela se candidatou à vaga em maio.", fr: "Elle a postulé à ce poste en mai.", de: "Sie hat sich im Mai auf die Stelle beworben.", it: "Ha fatto domanda per il posto a maggio.", pl: "Złożyła podanie o tę pracę w maju.", tr: "Mayıs ayında işe başvurdu.", id: "Dia melamar pekerjaan itu pada bulan Mei.", vi: "Cô ấy đã nộp đơn xin việc vào tháng Năm." } }
            nominal: { ex: ["Her ", { target: application for }, " the job was received in May."], tr: { uk: "Її заявку на цю посаду отримали в травні.", es: "Su solicitud para el puesto se recibió en mayo.", pt: "A candidatura dela à vaga foi recebida em maio.", fr: "Sa candidature à ce poste a été reçue en mai.", de: "Ihre Bewerbung auf die Stelle ging im Mai ein.", it: "La sua domanda per il posto è stata ricevuta a maggio.", pl: "Jej podanie o tę pracę wpłynęło w maju.", tr: "İşe başvurusu Mayıs ayında alındı.", id: "Lamarannya untuk pekerjaan itu diterima pada bulan Mei.", vi: "Đơn xin việc của cô ấy được nhận vào tháng Năm." } }

  - title: { en: Dense noun phrases in headlines and specialist prose, uk: "Щільні іменникові словосполучення в заголовках і фаховому тексті", es: "Grupos nominales densos en titulares y en textos especializados", pt: "Sintagmas nominais densos em manchetes e em textos especializados", fr: "Groupes nominaux denses dans les titres et les textes spécialisés", de: "Dichte Nominalphrasen in Schlagzeilen und Fachtexten", it: "Sintagmi nominali densi nei titoli e nei testi specialistici", pl: "Gęste grupy rzeczownikowe w nagłówkach i tekstach specjalistycznych", tr: "Başlıklarda ve uzmanlık yazılarında yoğun isim öbekleri", id: "Frasa nomina padat dalam judul berita dan tulisan spesialis", vi: "Cụm danh từ dày đặc trong tiêu đề báo và văn bản chuyên ngành" }
    role: own
    content:
      - type: usage
        columns:
          - { key: device, label: { en: Device, uk: "Засіб", es: "Recurso", pt: "Recurso", fr: "Procédé", de: "Mittel", it: "Strumento", pl: "Środek", tr: "Yöntem", id: "Cara", vi: "Cách" } }
          - { key: rule, label: { en: Reading, uk: "Прочитання", es: "Lectura", pt: "Leitura", fr: "Lecture", de: "Lesart", it: "Lettura", pl: "Odczytanie", tr: "Okuma", id: "Cara baca", vi: "Cách đọc" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            device: { en: noun stack, uk: "ланцюжок іменників", es: "cadena de sustantivos", pt: "cadeia de substantivos", fr: "chaîne de noms", de: "Nomenkette", it: "catena di sostantivi", pl: "łańcuch rzeczowników", tr: "isim zinciri", id: "rangkaian kata benda", vi: "chuỗi danh từ" }
            rule: { en: "the last noun is the head; the others modify it", uk: "останній іменник — головний, решта його визначають", es: "el último sustantivo es el núcleo; los demás lo modifican", pt: "o último substantivo é o núcleo; os outros o modificam", fr: "le dernier nom est le noyau ; les autres le modifient", de: "das letzte Nomen ist der Kern; die anderen bestimmen es näher", it: "l'ultimo sostantivo è il principale; gli altri lo modificano", pl: "ostatni rzeczownik jest nadrzędny; pozostałe go określają", tr: "son isim ana isimdir; diğerleri onu niteler", id: "kata benda terakhir adalah inti; yang lain menjadi pewatasnya", vi: "danh từ cuối là danh từ trung tâm; các danh từ còn lại bổ nghĩa cho nó" }
            ex: ["Oil price rise ", { target: fears }]
            tr: { uk: "побоювання через зростання цін на нафту", es: "temores por la subida del precio del petróleo", pt: "temores com a alta do preço do petróleo", fr: "craintes d’une hausse du prix du pétrole", de: "Befürchtungen wegen steigender Ölpreise", it: "timori per l'aumento del prezzo del petrolio", pl: "obawy przed wzrostem cen ropy", tr: "petrol fiyatlarındaki artış endişeleri", id: "kekhawatiran atas kenaikan harga minyak", vi: "nỗi lo về việc giá dầu tăng" }
          - level: C2
            device: { en: unpacking, uk: "розгортання", es: "desglose", pt: "desdobramento", fr: "décomposition", de: "Auflösung", it: "scomposizione", pl: "rozwijanie", tr: "açımlama", id: "pembongkaran", vi: "giải mã" }
            rule: { en: "turn each noun into a phrase, from the head backwards", uk: "перетворіть кожен іменник на словосполучення, рухаючись від головного іменника назад", es: "convierte cada sustantivo en un grupo, desde el núcleo hacia atrás", pt: "transforme cada substantivo em um sintagma, do núcleo para trás", fr: "transforme chaque nom en groupe, du noyau vers l’arrière", de: "mach aus jedem Nomen eine Wortgruppe, vom Kern aus rückwärts", it: "trasforma ogni sostantivo in un sintagma, dal principale all'indietro", pl: "zamień każdy rzeczownik na wyrażenie, zaczynając od nadrzędnego i idąc wstecz", tr: "her ismi bir öbeğe çevir, ana isimden geriye doğru", id: "ubah setiap kata benda menjadi frasa, dari kata benda inti mundur ke depan", vi: "biến mỗi danh từ thành một cụm, đi từ danh từ trung tâm ngược về trước" }
            ex: { equivalence: ["City council parking fee plan protest", "a protest over the city council's plan for parking fees"] }
            tr: { uk: "протест проти плану міської ради щодо плати за паркування", es: "protesta por el plan del concejo municipal sobre las tarifas de estacionamiento", pt: "protesto contra o plano da prefeitura para as tarifas de estacionamento", fr: "protestation contre le projet du conseil municipal sur les tarifs de stationnement", de: "Protest gegen den Plan des Stadtrats zu den Parkgebühren", it: "protesta contro il piano del consiglio comunale sulle tariffe dei parcheggi", pl: "protest przeciwko planowi rady miasta w sprawie opłat za parkowanie", tr: "belediye meclisinin otopark ücreti planına karşı protesto", id: "protes terhadap rencana dewan kota soal tarif parkir", vi: "cuộc phản đối kế hoạch về phí đỗ xe của hội đồng thành phố" }
          - level: C2
            device: { en: hyphen, uk: "дефіс", es: "guion", pt: "hífen", fr: "trait d’union", de: "Bindestrich", it: "trattino", pl: "łącznik", tr: "kısa çizgi", id: "tanda hubung", vi: "dấu gạch nối" }
            rule: { en: "joins words into one modifier", uk: "об’єднує слова в одне означення", es: "une palabras en un solo modificador", pt: "une palavras em um só modificador", fr: "réunit des mots en un seul modificateur", de: "verbindet Wörter zu einem Attribut", it: "unisce parole in un solo modificatore", pl: "łączy wyrazy w jedno określenie", tr: "sözcükleri tek bir niteleyicide birleştirir", id: "menggabungkan kata menjadi satu pewatas", vi: "nối các từ thành một từ bổ nghĩa duy nhất" }
            ex: { contrast: [["a ", { target: little-used }, " car"], ["a little ", { target: used }, " car"]] }
            tr: { uk: { contrast: ["автомобіль, яким рідко користуються", "трохи вживаний автомобіль"] }, es: { contrast: ["un auto casi sin uso", "un auto un poco usado"] }, pt: { contrast: ["um carro quase sem uso", "um carro um pouco usado"] }, fr: { contrast: ["une voiture peu utilisée", "une voiture un peu usagée"] }, de: { contrast: ["ein selten gefahrenes Auto", "ein etwas gebrauchtes Auto"] }, it: { contrast: ["un'auto usata di rado", "un'auto un po' usata"] }, pl: { contrast: ["rzadko używany samochód", "trochę używany samochód"] }, tr: { contrast: ["az kullanılmış bir araba", "biraz kullanılmış bir araba"] }, id: { contrast: ["mobil yang jarang dipakai", "mobil yang agak bekas"] }, vi: { contrast: ["một chiếc xe ít khi được dùng", "một chiếc xe đã dùng chút ít"] } }
          - level: C2
            device: { en: comma, uk: "кома", es: "coma", pt: "vírgula", fr: "virgule", de: "Komma", it: "virgola", pl: "przecinek", tr: "virgül", id: "koma", vi: "dấu phẩy" }
            rule: { en: "separates modifiers of equal weight", uk: "розділяє означення однакової ваги", es: "separa modificadores del mismo peso", pt: "separa modificadores de igual peso", fr: "sépare des modificateurs de même poids", de: "trennt gleichrangige Attribute", it: "separa modificatori di pari peso", pl: "oddziela równorzędne określenia", tr: "eşit ağırlıktaki niteleyicileri ayırır", id: "memisahkan pewatas yang setara", vi: "ngăn cách các từ bổ nghĩa ngang hàng" }
            ex: ["a ", { target: "quiet, reliable" }, " engine"]
            tr: { uk: "тихий, надійний двигун", es: "un motor silencioso y confiable", pt: "um motor silencioso e confiável", fr: "un moteur silencieux et fiable", de: "ein leiser, zuverlässiger Motor", it: "un motore silenzioso e affidabile", pl: "cichy, niezawodny silnik", tr: "sessiz, güvenilir bir motor", id: "mesin yang tenang dan andal", vi: "một động cơ êm và đáng tin cậy" }

  - title: { en: Grammatical metaphor, uk: "Граматична метафора", es: "La metáfora gramatical", pt: "A metáfora gramatical", fr: "La métaphore grammaticale", de: "Grammatische Metapher", it: "La metafora grammaticale", pl: "Metafora gramatyczna", tr: "Dil bilgisel metafor", id: "Metafora gramatikal", vi: "Ẩn dụ ngữ pháp" }
