            tr: { uk: "Ціна квитків зросла.", es: "El precio de los boletos ha subido.", pt: "O preço dos ingressos subiu.", fr: "Le prix des billets a augmenté.", de: "Der Preis der Karten ist gestiegen.", it: "Il prezzo dei biglietti è salito.", pl: "Cena biletów wzrosła.", tr: "Biletlerin fiyatı yükseldi.", id: "Harga tiket telah naik.", vi: "Giá vé đã tăng." }
          - type: note
            level: B2
            text: { en: ["A relative clause also follows the noun: ", { link: Relative clauses, to: en.sentence-building.relative-clauses }, "."], uk: ["Означальне підрядне речення також стоїть після іменника: ", { link: "Означальні підрядні речення", to: "en.sentence-building.relative-clauses" }, "."], es: ["Una oración de relativo también va después del sustantivo: ", { link: "Oraciones de relativo", to: "en.sentence-building.relative-clauses" }, "."], pt: ["Uma oração relativa também vem depois do substantivo: ", { link: "Orações relativas", to: "en.sentence-building.relative-clauses" }, "."], fr: ["Une proposition relative suit aussi le nom : ", { link: "Propositions relatives", to: "en.sentence-building.relative-clauses" }, "."], de: ["Auch ein Relativsatz folgt dem Nomen: ", { link: "Relativsätze", to: "en.sentence-building.relative-clauses" }, "."], it: ["Anche una proposizione relativa segue il sostantivo: ", { link: "Proposizioni relative", to: "en.sentence-building.relative-clauses" }, "."], pl: ["Zdanie względne również stoi po rzeczowniku: ", { link: "Zdania względne", to: "en.sentence-building.relative-clauses" }, "."], tr: ["İlgi cümlesi de isimden sonra gelir: ", { link: "İlgi cümleleri", to: "en.sentence-building.relative-clauses" }, "."], id: ["Klausa relatif juga berada setelah kata benda: ", { link: "Klausa relatif", to: "en.sentence-building.relative-clauses" }, "."], vi: ["Mệnh đề quan hệ cũng đứng sau danh từ: ", { link: "Mệnh đề quan hệ", to: "en.sentence-building.relative-clauses" }, "."] }

  - title: { en: Modification before the noun, uk: "Означення перед іменником", es: "La modificación antes del sustantivo", pt: "A modificação antes do substantivo", fr: "La modification avant le nom", de: "Attribute vor dem Nomen", it: "La modificazione prima del sostantivo", pl: "Określenia przed rzeczownikiem", tr: "İsimden önce gelen niteleyiciler", id: "Pewatas sebelum kata benda", vi: "Từ bổ nghĩa đứng trước danh từ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Modifier, uk: "Означення", es: "Modificador", pt: "Modificador", fr: "Modificateur", de: "Attribut", it: "Modificatore", pl: "Określenie", tr: "Niteleyici", id: "Pewatas", vi: "Từ bổ nghĩa" } }
          - { key: form, label: { en: Form, uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            type: { en: noun modifier, uk: "іменник-означення", es: "modificador nominal", pt: "modificador nominal", fr: "nom modificateur", de: "Nomen als Attribut", it: "modificatore nominale", pl: "rzeczownik w roli określenia", tr: "isim niteleyici", id: "pewatas berupa kata benda", vi: "danh từ bổ nghĩa" }
            form: { pattern: [{ slot: singular noun }, { slot: noun }] }
            ex: { examples: [["a ", { target: bus }, " ticket"], ["a ", { target: tennis }, " ball"]] }
            tr: { uk: { examples: ["автобусний квиток", "тенісний м’яч"] }, es: { examples: ["un boleto de autobús", "una pelota de tenis"] }, pt: { examples: ["uma passagem de ônibus", "uma bola de tênis"] }, fr: { examples: ["un ticket de bus", "une balle de tennis"] }, de: { examples: ["ein Busticket", "ein Tennisball"] }, it: { examples: ["un biglietto dell'autobus", "una pallina da tennis"] }, pl: { examples: ["bilet autobusowy", "piłka tenisowa"] }, tr: { examples: ["bir otobüs bileti", "bir tenis topu"] }, id: { examples: ["tiket bus", "bola tenis"] }, vi: { examples: ["một vé xe buýt", "một quả bóng tennis"] } }
          - level: B2
            type: { en: number and unit, uk: "число й одиниця виміру", es: "número y unidad", pt: "número e unidade", fr: "nombre et unité", de: "Zahl und Einheit", it: "numero e unità", pl: "liczba i jednostka", tr: "sayı ve birim", id: "bilangan dan satuan", vi: "số và đơn vị" }
            form: { pattern: [{ slot: number }, { slot: hyphen }, { slot: singular noun }, { slot: noun }] }
            ex: { examples: [["a ", { target: ten-minute }, " walk"], ["a ", { target: two-hour }, " drive"]] }
            tr: { uk: { examples: ["десятихвилинна прогулянка", "двогодинна поїздка"] }, es: { examples: ["una caminata de diez minutos", "un viaje en auto de dos horas"] }, pt: { examples: ["uma caminhada de dez minutos", "uma viagem de carro de duas horas"] }, fr: { examples: ["une marche de dix minutes", "un trajet en voiture de deux heures"] }, de: { examples: ["ein zehnminütiger Spaziergang", "eine zweistündige Autofahrt"] }, it: { examples: ["una camminata di dieci minuti", "un viaggio in auto di due ore"] }, pl: { examples: ["dziesięciominutowy spacer", "dwugodzinna podróż samochodem"] }, tr: { examples: ["on dakikalık bir yürüyüş", "iki saatlik bir araba yolculuğu"] }, id: { examples: ["jalan kaki sepuluh menit", "perjalanan dua jam dengan mobil"] }, vi: { examples: ["một cuộc đi bộ mười phút", "một chuyến lái xe hai tiếng"] } }
          - level: B2
            type: { en: "-ing adjective", uk: "прикметник на -ing", es: "adjetivo en -ing", pt: "adjetivo em -ing", fr: "adjectif en -ing", de: "Adjektiv auf -ing", it: "aggettivo in -ing", pl: "przymiotnik na -ing", tr: "-ing ile biten sıfat", id: "kata sifat berakhiran -ing", vi: "tính từ dạng -ing" }
            form: { pattern: [{ slot: V-ing }, { slot: noun }] }
            ex: { examples: [["a ", { target: barking }, " dog"], ["a ", { target: sleeping }, " baby"]] }
            tr: { uk: { examples: ["собака, що гавкає", "немовля, яке спить"] }, es: { examples: ["un perro que ladra", "un bebé que duerme"] }, pt: { examples: ["um cachorro latindo", "um bebê dormindo"] }, fr: { examples: ["un chien qui aboie", "un bébé qui dort"] }, de: { examples: ["ein bellender Hund", "ein schlafendes Baby"] }, it: { examples: ["un cane che abbaia", "un bambino che dorme"] }, pl: { examples: ["szczekający pies", "śpiące dziecko"] }, tr: { examples: ["havlayan bir köpek", "uyuyan bir bebek"] }, id: { examples: ["anjing yang menggonggong", "bayi yang sedang tidur"] }, vi: { examples: ["một con chó đang sủa", "một em bé đang ngủ"] } }
          - level: B2
            type: { en: "-ed adjective", uk: "прикметник на -ed", es: "adjetivo en -ed", pt: "adjetivo em -ed", fr: "adjectif en -ed", de: "Adjektiv auf -ed", it: "aggettivo in -ed", pl: "przymiotnik na -ed", tr: "-ed ile biten sıfat", id: "kata sifat berakhiran -ed", vi: "tính từ dạng -ed" }
            form: { pattern: [{ slot: V-ed }, { slot: noun }] }
            ex: { examples: [["a ", { target: broken }, " window"], ["a ", { target: closed }, " door"]] }
            tr: { uk: { examples: ["розбите вікно", "зачинені двері"] }, es: { examples: ["una ventana rota", "una puerta cerrada"] }, pt: { examples: ["uma janela quebrada", "uma porta fechada"] }, fr: { examples: ["une fenêtre cassée", "une porte fermée"] }, de: { examples: ["ein kaputtes Fenster", "eine geschlossene Tür"] }, it: { examples: ["una finestra rotta", "una porta chiusa"] }, pl: { examples: ["wybite okno", "zamknięte drzwi"] }, tr: { examples: ["kırık bir pencere", "kapalı bir kapı"] }, id: { examples: ["jendela yang pecah", "pintu yang tertutup"] }, vi: { examples: ["một cái cửa sổ vỡ", "một cánh cửa đóng"] } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { en: "A noun modifier is singular, even before a plural head noun:", uk: "Іменник-означення стоїть в однині, навіть перед головним іменником у множині:", es: "El modificador nominal va en singular, incluso delante de un sustantivo núcleo plural:", pt: "O modificador nominal fica no singular, mesmo antes de um substantivo núcleo no plural:", fr: "Le nom modificateur reste au singulier, même devant un nom noyau pluriel :", de: "Ein Nomen als Attribut steht im Singular, auch vor einem Kernnomen im Plural:", it: "Il modificatore nominale è singolare, anche davanti a un sostantivo principale plurale:", pl: "Rzeczownik w roli określenia stoi w liczbie pojedynczej, nawet przed rzeczownikiem nadrzędnym w liczbie mnogiej:", tr: "İsim niteleyici, çoğul bir ana isimden önce bile tekildir:", id: "Pewatas berupa kata benda berbentuk tunggal, bahkan sebelum kata benda inti jamak:", vi: "Danh từ bổ nghĩa ở số ít, kể cả trước danh từ trung tâm số nhiều:" }
            ex: ["two ", { target: bus }, " tickets"]
            tr: { uk: "два автобусні квитки", es: "dos boletos de autobús", pt: "duas passagens de ônibus", fr: "deux tickets de bus", de: "zwei Bustickets", it: "due biglietti dell'autobus", pl: "dwa bilety autobusowe", tr: "iki otobüs bileti", id: "dua tiket bus", vi: "hai vé xe buýt" }
          - type: rule
            level: B2
            text: { en: "Three modifiers is the practical limit before the head noun; put further detail after it:", uk: "Три означення — практична межа перед головним іменником; решту подробиць додайте після нього:", es: "Tres modificadores son el límite práctico antes del sustantivo núcleo; el resto del detalle va después:", pt: "Três modificadores são o limite prático antes do substantivo núcleo; o resto do detalhe vai depois:", fr: "Trois modificateurs sont la limite pratique avant le nom noyau ; les autres détails se placent après :", de: "Drei Attribute sind die praktische Grenze vor dem Kernnomen; weitere Angaben stehen danach:", it: "Tre modificatori sono il limite pratico prima del sostantivo principale; gli altri dettagli vanno dopo:", pl: "Trzy określenia to praktyczna granica przed rzeczownikiem nadrzędnym; dalsze szczegóły dodaj po nim:", tr: "Ana isimden önce üç niteleyici pratik sınırdır; ek ayrıntıyı ondan sonra ver:", id: "Tiga pewatas adalah batas praktis sebelum kata benda inti; letakkan detail tambahan sesudahnya:", vi: "Tối đa ba từ bổ nghĩa nên đứng trước danh từ trung tâm; chi tiết thêm đặt sau nó:" }
            ex: ["a small old wooden table ", { target: with a drawer }]
            tr: { uk: "маленький старий дерев’яний стіл із шухлядою", es: "una mesa de madera pequeña y vieja con un cajón", pt: "uma mesa de madeira pequena e velha com uma gaveta", fr: "une petite vieille table en bois avec un tiroir", de: "ein kleiner alter Holztisch mit einer Schublade", it: "un piccolo vecchio tavolo di legno con un cassetto", pl: "mały stary drewniany stół z szufladą", tr: "çekmeceli, küçük, eski, ahşap bir masa", id: "meja kayu kecil tua dengan satu laci", vi: "một chiếc bàn gỗ nhỏ cũ có ngăn kéo" }

  - title: { en: Pronouns and adjectives as heads, uk: "Займенники й прикметники як головні слова", es: "Pronombres y adjetivos como núcleo", pt: "Pronomes e adjetivos como núcleo", fr: "Pronoms et adjectifs comme noyau", de: "Pronomen und Adjektive als Kern", it: "Pronomi e aggettivi come elemento principale", pl: "Zaimki i przymiotniki jako człon nadrzędny", tr: "Ana öğe olarak zamirler ve sıfatlar", id: "Pronomina dan kata sifat sebagai inti", vi: "Đại từ và tính từ làm thành phần chính" }
    role: own
    content:
      - type: usage
        columns:
          - { key: head, label: { en: Head, uk: "Головне слово", es: "Núcleo", pt: "Núcleo", fr: "Noyau", de: "Kern", it: "Elemento principale", pl: "Człon nadrzędny", tr: "Ana öğe", id: "Inti", vi: "Thành phần chính" } }
          - { key: use, label: { en: Meaning, uk: "Значення", es: "Significado", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            head: { pattern: [the, { slot: adjective }] }
            use: { en: "a group of people; the verb is plural", uk: "група людей; дієслово у множині", es: "un grupo de personas; el verbo va en plural", pt: "um grupo de pessoas; o verbo fica no plural", fr: "un groupe de personnes ; le verbe est au pluriel", de: "eine Gruppe von Personen; das Verb steht im Plural", it: "un gruppo di persone; il verbo è al plurale", pl: "grupa osób; czasownik w liczbie mnogiej", tr: "bir insan grubu; fiil çoğuldur", id: "sekelompok orang; kata kerjanya jamak", vi: "một nhóm người; động từ ở số nhiều" }
            ex: [{ target: The injured }, " were treated quickly."]
            tr: { uk: "Пораненим швидко надали допомогу.", es: "Los heridos fueron atendidos rápidamente.", pt: "Os feridos foram atendidos rapidamente.", fr: "Les blessés ont été pris en charge rapidement.", de: "Die Verletzten wurden schnell versorgt.", it: "I feriti sono stati curati rapidamente.", pl: "Rannych szybko opatrzono.", tr: "Yaralılara hemen müdahale edildi.", id: "Para korban luka segera ditangani.", vi: "Những người bị thương được chăm sóc nhanh chóng." }
          - level: B2
            head: { alternatives: [one, ones] }
            use: { en: a countable noun already named, uk: "злічуваний іменник, який уже названо", es: "un sustantivo contable ya mencionado", pt: "um substantivo contável já mencionado", fr: "un nom dénombrable déjà mentionné", de: "ein zählbares Nomen, das schon genannt wurde", it: "un sostantivo numerabile già nominato", pl: "policzalny rzeczownik, który już padł", tr: "daha önce anılmış sayılabilir bir isim", id: "kata benda terhitung yang sudah disebut", vi: "danh từ đếm được đã nhắc đến" }
            ex: { examples: [["I like the blue ", { target: one }, "."], ["Which ", { target: ones }, " are yours?"]] }
            tr: { uk: { examples: ["Мені подобається синій.", "Які з них твої?"] }, es: { examples: ["Me gusta el azul.", "¿Cuáles son los tuyos?"] }, pt: { examples: ["Eu gosto do azul.", "Quais são os seus?"] }, fr: { examples: ["J’aime le bleu.", "Lesquels sont les tiens ?"] }, de: { examples: ["Ich mag den blauen.", "Welche sind deine?"] }, it: { examples: ["Mi piace quello blu.", "Quali sono i tuoi?"] }, pl: { examples: ["Podoba mi się niebieski.", "Które są twoje?"] }, tr: { examples: ["Mavi olanı seviyorum.", "Hangileri senin?"] }, id: { examples: ["Saya suka yang biru.", "Yang mana milik kamu?"] }, vi: { examples: ["Tôi thích cái màu xanh.", "Những cái nào là của bạn?"] } }
          - level: B2
            head: those who
            use: { en: people who, uk: "люди, які", es: "las personas que", pt: "as pessoas que", fr: "les personnes qui", de: "Personen, die", it: "le persone che", pl: "osoby, które", tr: "olan kişiler", id: "orang-orang yang", vi: "những người mà" }
            ex: [{ target: Those who }, " arrive early get the best seats."]
            tr: { uk: "Ті, хто приходить рано, отримують найкращі місця.", es: "Quienes llegan temprano consiguen los mejores asientos.", pt: "Quem chega cedo consegue os melhores lugares.", fr: "Ceux qui arrivent tôt obtiennent les meilleures places.", de: "Wer früh kommt, bekommt die besten Plätze.", it: "Chi arriva presto ottiene i posti migliori.", pl: "Ci, którzy przychodzą wcześnie, dostają najlepsze miejsca.", tr: "Erken gelenler en iyi koltukları alır.", id: "Mereka yang datang lebih awal mendapat tempat duduk terbaik.", vi: "Những người đến sớm sẽ có chỗ ngồi tốt nhất." }
          - level: B2
            head: { alternatives: [mine, yours, hers, ours] }
            use: { en: the owner and the thing in one word, uk: "власник і річ в одному слові", es: "el poseedor y la cosa en una sola palabra", pt: "o possuidor e a coisa em uma só palavra", fr: "le possesseur et la chose en un seul mot", de: "Besitzer und Sache in einem Wort", it: "il possessore e la cosa in una sola parola", pl: "właściciel i rzecz w jednym słowie", tr: "sahip ve şey tek sözcükte", id: "pemilik dan benda dalam satu kata", vi: "người sở hữu và vật sở hữu trong một từ" }
            ex: ["This seat is ", { target: mine }, "."]
            tr: { uk: "Це місце моє.", es: "Este asiento es mío.", pt: "Este lugar é meu.", fr: "Cette place est à moi.", de: "Dieser Platz gehört mir.", it: "Questo posto è mio.", pl: "To miejsce jest moje.", tr: "Bu koltuk benim.", id: "Kursi ini milik saya.", vi: "Chỗ ngồi này là của tôi." }
          - level: B2
            head: { alternatives: [some, many, none] }
            use: { en: a quantifier without its noun, uk: "слово кількості без іменника", es: "un cuantificador sin su sustantivo", pt: "um quantificador sem o substantivo", fr: "un quantificateur sans son nom", de: "ein Mengenwort ohne sein Nomen", it: "un quantificatore senza il suo sostantivo", pl: "określnik ilości bez rzeczownika", tr: "ismi olmayan bir miktar sözcüğü", id: "quantifier tanpa kata bendanya", vi: "lượng từ không có danh từ đi kèm" }
            ex: [{ target: Many }, " were late."]
            tr: { uk: "Багато хто запізнився.", es: "Muchos llegaron tarde.", pt: "Muitos se atrasaram.", fr: "Beaucoup étaient en retard.", de: "Viele kamen zu spät.", it: "Molti erano in ritardo.", pl: "Wielu się spóźniło.", tr: "Birçoğu geç kaldı.", id: "Banyak yang terlambat.", vi: "Nhiều người đã đến muộn." }
          - level: B2
            head: the same
            use: { en: something already mentioned, uk: "те, що вже згадано", es: "algo ya mencionado", pt: "algo já mencionado", fr: "quelque chose déjà mentionné", de: "etwas schon Erwähntes", it: "qualcosa già menzionato", pl: "coś, o czym już wspomniano", tr: "daha önce anılmış bir şey", id: "sesuatu yang sudah disebut", vi: "điều đã nhắc đến" }
            ex: ["I'll have ", { target: the same }, "."]
            tr: { uk: "Я візьму те саме.", es: "Yo quiero lo mismo.", pt: "Eu quero o mesmo.", fr: "Je prendrai la même chose.", de: "Ich nehme dasselbe.", it: "Prendo lo stesso.", pl: "Poproszę to samo.", tr: "Ben de aynısını alayım.", id: "Saya pesan yang sama.", vi: "Tôi sẽ dùng món giống vậy." }

  - title: { en: "Form: nominalisation", uk: "Форма: номіналізація", es: "Forma: la nominalización", pt: "Forma: a nominalização", fr: "Forme : la nominalisation", de: "Form: die Nominalisierung", it: "Forma: la nominalizzazione", pl: "Forma: nominalizacja", tr: "Biçim: isimleştirme", id: "Bentuk: nominalisasi", vi: "Dạng: danh từ hóa" }
