title: { en: Noun Phrases and Nominalisation, uk: "Іменникові словосполучення й номіналізація", es: "El grupo nominal y la nominalización", pt: "O sintagma nominal e a nominalização", fr: "Le groupe nominal et la nominalisation", de: "Nominalphrasen und Nominalisierung", it: "Il sintagma nominale e la nominalizzazione", pl: "Grupa rzeczownikowa i nominalizacja", tr: "İsim öbekleri ve isimleştirme", id: "Frasa nomina dan nominalisasi", vi: "Cụm danh từ và danh từ hóa" }
summary:
  lead:
    en: Noun phrases are built round a head noun with determiners, modifiers and complements, and nominalisation turns verbs and clauses into nouns.
    uk: "Іменникове словосполучення будується навколо головного іменника з детермінативами й означеннями, а номіналізація перетворює дієслова та речення на іменники."
    es: "El grupo nominal se organiza en torno a un sustantivo núcleo con determinantes y modificadores; la nominalización convierte verbos y oraciones en sustantivos."
    pt: "O sintagma nominal gira em torno de um substantivo núcleo com determinantes e modificadores; a nominalização transforma verbos e orações em substantivos."
    fr: "Le groupe nominal s’organise autour d’un nom noyau avec déterminants et modificateurs ; la nominalisation transforme verbes et propositions en noms."
    de: "Eine Nominalphrase baut sich um ein Kernnomen auf, mit Begleitern, Attributen und Ergänzungen; die Nominalisierung macht aus Verben und Sätzen Nomen."
    it: "Il sintagma nominale ruota attorno a un sostantivo principale con determinanti e modificatori; la nominalizzazione trasforma verbi e proposizioni in sostantivi."
    pl: "Grupa rzeczownikowa powstaje wokół rzeczownika nadrzędnego z określnikami i określeniami, a nominalizacja zamienia czasowniki i zdania w rzeczowniki."
    tr: "İsim öbeği, bir ana isim çevresinde belirleyiciler, niteleyiciler ve tümleçlerle kurulur; isimleştirme ise fiilleri ve cümleleri isme çevirir."
    id: "Frasa nomina dibangun di sekitar kata benda inti dengan determiner, pewatas, dan komplemen, dan nominalisasi mengubah kata kerja dan klausa menjadi kata benda."
    vi: "Cụm danh từ xoay quanh danh từ trung tâm; danh từ hóa biến động từ và mệnh đề thành danh từ."
  rule:
    en: "Short modifiers go before the head noun and long ones after it:"
    uk: "Короткі означення стоять перед головним іменником, а довгі — після нього:"
    es: "Los modificadores cortos van antes del sustantivo núcleo y los largos después:"
    pt: "Os modificadores curtos vêm antes do substantivo núcleo e os longos, depois:"
    fr: "Les modificateurs courts se placent avant le nom noyau et les longs après :"
    de: "Kurze Attribute stehen vor dem Kernnomen, lange danach:"
    it: "I modificatori brevi vanno prima del sostantivo principale, quelli lunghi dopo:"
    pl: "Krótkie określenia stoją przed rzeczownikiem nadrzędnym, a długie po nim:"
    tr: "Kısa niteleyiciler ana isimden önce, uzun olanlar ondan sonra gelir:"
    id: "Pewatas pendek berada sebelum kata benda inti dan yang panjang sesudahnya:"
    vi: "Từ bổ nghĩa ngắn đứng trước danh từ trung tâm, từ bổ nghĩa dài đứng sau:"
  ex: ["a ", { target: small }, " house ", { target: with a view of the park }, "."]

