            nominal: { ex: ["The ", { target: increase in demand }, " led to a ", { target: rise in prices }, "."], tr: { uk: "Зростання попиту призвело до підвищення цін.", es: "El aumento de la demanda provocó una subida de los precios.", pt: "O aumento da demanda levou a uma alta dos preços.", fr: "La hausse de la demande a entraîné une augmentation des prix.", de: "Der Anstieg der Nachfrage führte zu einem Preisanstieg.", it: "L'aumento della domanda ha portato a un aumento dei prezzi.", pl: "Wzrost popytu doprowadził do wzrostu cen.", tr: "Talepteki artış, fiyatlarda bir yükselişe yol açtı.", id: "Kenaikan permintaan menyebabkan naiknya harga.", vi: "Sự tăng lên của nhu cầu dẫn đến việc giá cả tăng." } }
          - level: C2
            verbal: { ex: ["Because the team ", { target: trained harder }, ", it ", { target: improved }, "."], tr: { uk: "Оскільки команда тренувалася наполегливіше, вона покращилася.", es: "Como el equipo entrenó con más empeño, mejoró.", pt: "Como a equipe treinou mais, ela melhorou.", fr: "Comme l’équipe s’est entraînée plus dur, elle s’est améliorée.", de: "Weil die Mannschaft härter trainierte, wurde sie besser.", it: "Poiché la squadra si è allenata di più, è migliorata.", pl: "Ponieważ drużyna trenowała ciężej, poprawiła się.", tr: "Takım daha sıkı çalıştığı için gelişti.", id: "Karena tim itu berlatih lebih keras, mereka menjadi lebih baik.", vi: "Vì đội tập luyện chăm chỉ hơn nên đã tiến bộ." } }
            nominal: { ex: ["The team's ", { target: harder training }, " led to its ", { target: improvement }, "."], tr: { uk: "Наполегливіше тренування команди призвело до її покращення.", es: "El entrenamiento más intenso del equipo condujo a su mejora.", pt: "O treino mais intenso da equipe levou à sua melhora.", fr: "L’entraînement plus intensif de l’équipe a conduit à son amélioration.", de: "Das härtere Training der Mannschaft führte zu ihrer Verbesserung.", it: "Il più duro allenamento della squadra ha portato al suo miglioramento.", pl: "Cięższy trening drużyny doprowadził do jej poprawy.", tr: "Takımın daha sıkı antrenmanı gelişmesine yol açtı.", id: "Latihan tim yang lebih keras menyebabkan peningkatannya.", vi: "Việc đội tập luyện chăm chỉ hơn dẫn đến sự tiến bộ của đội." } }
          - level: C2
            verbal: { ex: ["If people ", { target: save }, " more, banks can lend more."], tr: { uk: "Якщо люди заощаджують більше, банки можуть більше кредитувати.", es: "Si la gente ahorra más, los bancos pueden prestar más.", pt: "Se as pessoas poupam mais, os bancos podem emprestar mais.", fr: "Si les gens épargnent davantage, les banques peuvent prêter davantage.", de: "Wenn die Leute mehr sparen, können die Banken mehr verleihen.", it: "Se le persone risparmiano di più, le banche possono prestare di più.", pl: "Jeśli ludzie oszczędzają więcej, banki mogą pożyczać więcej.", tr: "İnsanlar daha çok tasarruf ederse bankalar daha çok borç verebilir.", id: "Jika orang menabung lebih banyak, bank dapat meminjamkan lebih banyak.", vi: "Nếu mọi người tiết kiệm nhiều hơn, ngân hàng có thể cho vay nhiều hơn." } }
            nominal: { ex: ["Higher ", { target: savings }, " allow banks to lend more."], tr: { uk: "Вищі заощадження дають змогу банкам більше кредитувати.", es: "Un mayor ahorro permite a los bancos prestar más.", pt: "Uma poupança maior permite que os bancos emprestem mais.", fr: "Une épargne plus élevée permet aux banques de prêter davantage.", de: "Höhere Ersparnisse erlauben es den Banken, mehr zu verleihen.", it: "Un risparmio maggiore permette alle banche di prestare di più.", pl: "Wyższe oszczędności pozwalają bankom pożyczać więcej.", tr: "Daha yüksek tasarruflar bankaların daha çok borç vermesine imkân tanır.", id: "Tabungan yang lebih besar memungkinkan bank meminjamkan lebih banyak.", vi: "Khoản tiết kiệm cao hơn cho phép ngân hàng cho vay nhiều hơn." } }
      - type: list
        items:
          - type: rule
            level: C2
            text: { en: ["A noun phrase replaces the clause; a verb such as ", { term: lead to }, " replaces the conjunction."], uk: ["Іменникове словосполучення замінює підрядне речення, а дієслово на кшталт ", { term: "lead to" }, " замінює сполучник."], es: ["Un grupo nominal sustituye a la oración; un verbo como ", { term: "lead to" }, " sustituye a la conjunción."], pt: ["Um sintagma nominal substitui a oração; um verbo como ", { term: "lead to" }, " substitui a conjunção."], fr: ["Un groupe nominal remplace la proposition ; un verbe comme ", { term: "lead to" }, " remplace la conjonction."], de: ["Eine Nominalphrase ersetzt den Satz; ein Verb wie ", { term: "lead to" }, " ersetzt die Konjunktion."], it: ["Un sintagma nominale sostituisce la proposizione; un verbo come ", { term: "lead to" }, " sostituisce la congiunzione."], pl: ["Grupa rzeczownikowa zastępuje zdanie, a czasownik taki jak ", { term: "lead to" }, " zastępuje spójnik."], tr: ["İsim öbeği cümlenin yerini alır; ", { term: "lead to" }, " gibi bir fiil bağlacın yerini alır."], id: ["Frasa nomina menggantikan klausa; kata kerja seperti ", { term: "lead to" }, " menggantikan konjungsi."], vi: ["Một cụm danh từ thay cho mệnh đề; một động từ như ", { term: "lead to" }, " thay cho liên từ."] }
          - type: rule
            level: C2
            text: { en: "Revise noun style into verb style when the nouns hide who does what.", uk: "Перепишіть іменниковий стиль на дієслівний, коли іменники приховують, хто що робить.", es: "Reescribe el estilo nominal en estilo verbal cuando los sustantivos ocultan quién hace qué.", pt: "Reescreva o estilo nominal em estilo verbal quando os substantivos escondem quem faz o quê.", fr: "Réécris le style nominal en style verbal quand les noms cachent qui fait quoi.", de: "Schreib den Nominalstil in Verbalstil um, wenn die Nomen verbergen, wer was tut.", it: "Riscrivi lo stile nominale in stile verbale quando i sostantivi nascondono chi fa cosa.", pl: "Zamień styl rzeczownikowy na czasownikowy, gdy rzeczowniki ukrywają, kto co robi.", tr: "İsimler kimin ne yaptığını gizlediğinde isim üslubunu fiil üslubuna çevir.", id: "Ubah gaya nominal menjadi gaya verbal ketika kata benda menyembunyikan siapa melakukan apa.", vi: "Hãy chuyển lối viết dùng danh từ sang dùng động từ khi danh từ che giấu ai làm gì." }

  - title: { en: Of and an abstract noun, uk: "Of та абстрактний іменник", es: "Of y un sustantivo abstracto", pt: "Of e um substantivo abstrato", fr: "Of et un nom abstrait", de: "Of und ein abstraktes Nomen", it: "Of e un sostantivo astratto", pl: "Of i rzeczownik abstrakcyjny", tr: "Of ve soyut bir isim", id: "Of dan kata benda abstrak", vi: "Of và danh từ trừu tượng" }
