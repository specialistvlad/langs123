          - { key: change, label: { en: Change, uk: "Зміна", es: "Cambio", pt: "Mudança", fr: "Changement", de: "Änderung", it: "Cambiamento", pl: "Zmiana", tr: "Değişim", id: "Perubahan", vi: "Biến đổi" } }
