        - { level: C1, point: { en: Nominalisation, uk: "Номіналізація", es: "Nominalización", pt: "Nominalização", fr: "Nominalisation", de: "Nominalisierung", it: "Nominalizzazione", pl: "Nominalizacja", tr: "İsimleştirme", id: "Nominalisasi", vi: "Danh từ hóa" }, rule: { en: "a noun names the action; its object follows with of", uk: "іменник називає дію, а її об’єкт додається через of", es: "un sustantivo nombra la acción; su objeto va después, con of", pt: "um substantivo nomeia a ação; o objeto dela vem depois, com of", fr: "un nom désigne l’action ; son complément suit avec of", de: "ein Nomen benennt die Handlung; ihr Objekt folgt mit of", it: "un sostantivo indica l'azione; il suo oggetto segue con of", pl: "rzeczownik nazywa czynność; jej dopełnienie następuje po of", tr: "isim eylemi adlandırır; nesnesi of ile sonra gelir", id: "kata benda menamai tindakan; objeknya mengikuti dengan of", vi: "danh từ gọi tên hành động; tân ngữ của nó theo sau với of" }, ex: { mapping: ["They destroyed the city.", ["the ", { target: destruction }, " of the city"]] }, tr: { uk: { mapping: ["Вони зруйнували місто.", "руйнування міста"] }, es: { mapping: ["Destruyeron la ciudad.", "la destrucción de la ciudad"] }, pt: { mapping: ["Eles destruíram a cidade.", "a destruição da cidade"] }, fr: { mapping: ["Ils ont détruit la ville.", "la destruction de la ville"] }, de: { mapping: ["Sie zerstörten die Stadt.", "die Zerstörung der Stadt"] }, it: { mapping: ["Hanno distrutto la città.", "la distruzione della città"] }, pl: { mapping: ["Zniszczyli miasto.", "zniszczenie miasta"] }, tr: { mapping: ["Şehri yok ettiler.", "şehrin yok edilmesi"] }, id: { mapping: ["Mereka menghancurkan kota itu.", "penghancuran kota itu"] }, vi: { mapping: ["Họ đã phá hủy thành phố.", "sự phá hủy thành phố"] } } }
        - { level: C1, point: { en: Light verb, uk: "Опорне дієслово", es: "Verbo de apoyo", pt: "Verbo de suporte", fr: "Verbe support", de: "Funktionsverb", it: "Verbo supporto", pl: "Czasownik funkcyjny", tr: "Destek fiili", id: "Verba pendukung", vi: "Động từ hỗ trợ" }, rule: { en: "a general verb carries the action of the noun", uk: "загальне дієслово передає дію, названу іменником", es: "un verbo general expresa la acción del sustantivo", pt: "um verbo geral expressa a ação do substantivo", fr: "un verbe général porte l’action du nom", de: "ein allgemeines Verb trägt die Handlung des Nomens", it: "un verbo generico porta l'azione del sostantivo", pl: "ogólny czasownik niesie czynność rzeczownika", tr: "genel bir fiil, isimdeki eylemi taşır", id: "kata kerja umum membawa tindakan dari kata benda", vi: "một động từ chung mang hành động của danh từ" }, ex: { examples: [[{ target: make }, " a decision"], [{ target: carry out }, " an analysis"]] }, tr: { uk: { examples: ["ухвалити рішення", "провести аналіз"] }, es: { examples: ["tomar una decisión", "realizar un análisis"] }, pt: { examples: ["tomar uma decisão", "realizar uma análise"] }, fr: { examples: ["prendre une décision", "effectuer une analyse"] }, de: { examples: ["eine Entscheidung treffen", "eine Analyse durchführen"] }, it: { examples: ["prendere una decisione", "svolgere un'analisi"] }, pl: { examples: ["podjąć decyzję", "przeprowadzić analizę"] }, tr: { examples: ["karar vermek", "analiz yapmak"] }, id: { examples: ["membuat keputusan", "melakukan analisis"] }, vi: { examples: ["đưa ra quyết định", "thực hiện một phân tích"] } } }
        - { level: C1, point: { en: Shell noun, uk: "Іменник-оболонка (shell noun)", es: "Sustantivo encapsulador (shell noun)", pt: "Substantivo encapsulador (shell noun)", fr: "Nom-enveloppe (shell noun)", de: "Hüllnomen (shell noun)", it: "Sostantivo contenitore (shell noun)", pl: "Rzeczownik-powłoka (shell noun)", tr: "Kabuk isim (shell noun)", id: "Nomina cangkang (shell noun)", vi: "Danh từ vỏ (shell noun)" }, rule: { en: "a noun sums up an earlier clause", uk: "іменник підсумовує попереднє речення", es: "un sustantivo resume una oración anterior", pt: "um substantivo resume uma oração anterior", fr: "un nom résume une proposition précédente", de: "ein Nomen fasst einen früheren Satz zusammen", it: "un sostantivo riassume una proposizione precedente", pl: "rzeczownik podsumowuje wcześniejsze zdanie", tr: "bir isim, önceki bir cümleyi özetler", id: "kata benda merangkum klausa sebelumnya", vi: "một danh từ tóm tắt mệnh đề đã nêu trước đó" }, ex: ["The company cut prices. ", { target: This move }, " surprised its rivals."], tr: { uk: "Компанія знизила ціни. Цей крок здивував її конкурентів.", es: "La empresa bajó los precios. Esta medida sorprendió a sus rivales.", pt: "A empresa reduziu os preços. Essa medida surpreendeu seus concorrentes.", fr: "L’entreprise a baissé ses prix. Cette décision a surpris ses concurrents.", de: "Die Firma senkte die Preise. Dieser Schritt überraschte die Konkurrenz.", it: "L'azienda ha abbassato i prezzi. Questa mossa ha sorpreso i concorrenti.", pl: "Firma obniżyła ceny. Ten krok zaskoczył konkurencję.", tr: "Şirket fiyatları düşürdü. Bu hamle rakiplerini şaşırttı.", id: "Perusahaan itu menurunkan harga. Langkah ini mengejutkan para pesaingnya.", vi: "Công ty đã giảm giá. Động thái này khiến các đối thủ bất ngờ." } }
        - { level: C1, point: { en: Register, uk: "Регістр", es: "Registro", pt: "Registro", fr: "Registre", de: "Register", it: "Registro", pl: "Rejestr", tr: "Üslup", id: "Ragam bahasa", vi: "Văn phong" }, rule: { en: "verbs in speech, nouns in formal and academic writing", uk: "дієслова — у мовленні, іменники — у формальному й науковому письмі", es: "verbos en la lengua hablada, sustantivos en la escritura formal y académica", pt: "verbos na fala, substantivos na escrita formal e acadêmica", fr: "des verbes à l’oral, des noms dans l’écrit formel et universitaire", de: "Verben in der gesprochenen Sprache, Nomen in formellen und wissenschaftlichen Texten", it: "verbi nel parlato, sostantivi nella scrittura formale e accademica", pl: "czasowniki w mowie, rzeczowniki w piśmie formalnym i naukowym", tr: "konuşmada fiiller, resmî ve akademik yazıda isimler", id: "kata kerja dalam percakapan, kata benda dalam tulisan formal dan akademik", vi: "động từ trong lời nói, danh từ trong văn viết trang trọng và học thuật" }, ex: { contrast: [["We ", { variant: { target: analysed }, variety: en-GB }, " ", { variant: analyzed, variety: en-US }, " the data."], ["An ", { target: analysis of the data }, " was performed."]] }, tr: { uk: { contrast: ["Ми проаналізували дані.", "Було проведено аналіз даних."] }, es: { contrast: ["Analizamos los datos.", "Se realizó un análisis de los datos."] }, pt: { contrast: ["Analisamos os dados.", "Foi realizada uma análise dos dados."] }, fr: { contrast: ["Nous avons analysé les données.", "Une analyse des données a été réalisée."] }, de: { contrast: ["Wir haben die Daten analysiert.", "Eine Analyse der Daten wurde durchgeführt."] }, it: { contrast: ["Abbiamo analizzato i dati.", "È stata effettuata un'analisi dei dati."] }, pl: { contrast: ["Przeanalizowaliśmy dane.", "Przeprowadzono analizę danych."] }, tr: { contrast: ["Verileri analiz ettik.", "Verilerin bir analizi yapıldı."] }, id: { contrast: ["Kami menganalisis datanya.", "Analisis terhadap data telah dilakukan."] }, vi: { contrast: ["Chúng tôi đã phân tích dữ liệu.", "Một bản phân tích dữ liệu đã được thực hiện."] } } }
        - { level: C2, point: { en: Headline stack, uk: "Ланцюжок у заголовках", es: "Cadena en los titulares", pt: "Cadeia nas manchetes", fr: "Chaîne dans les titres", de: "Kette in Schlagzeilen", it: "Catena nei titoli", pl: "Łańcuch w nagłówkach", tr: "Başlıklarda isim zinciri", id: "Rangkaian dalam judul berita", vi: "Chuỗi trong tiêu đề" }, rule: { en: "the last noun is the head; the others modify", uk: "останній іменник — головний, решта його визначають", es: "el último sustantivo es el núcleo; los demás lo modifican", pt: "o último substantivo é o núcleo; os outros o modificam", fr: "le dernier nom est le noyau ; les autres le modifient", de: "das letzte Nomen ist der Kern; die anderen bestimmen es näher", it: "l'ultimo sostantivo è il principale; gli altri lo modificano", pl: "ostatni rzeczownik jest nadrzędny; pozostałe go określają", tr: "son isim ana isimdir; diğerleri onu niteler", id: "kata benda terakhir adalah inti; yang lain menjadi pewatasnya", vi: "danh từ cuối là danh từ trung tâm; các danh từ còn lại bổ nghĩa cho nó" }, ex: ["Government job cuts plan ", { target: row }], tr: { uk: "суперечка навколо урядового плану скорочення робочих місць", es: "polémica por el plan del gobierno para recortar empleos", pt: "polêmica por causa do plano do governo de cortar empregos", fr: "polémique autour du plan du gouvernement de suppression d’emplois", de: "Streit um den Regierungsplan zum Stellenabbau", it: "polemica sul piano del governo per tagliare i posti di lavoro", pl: "spór o rządowy plan redukcji miejsc pracy", tr: "hükümetin iş kesintisi planı tartışması", id: "polemik rencana pemerintah memangkas lapangan kerja", vi: "tranh cãi về kế hoạch cắt giảm việc làm của chính phủ" } }
        - { level: C2, point: { en: Of and a noun, uk: "Of і іменник", es: "Of y un sustantivo", pt: "Of e um substantivo", fr: "Of et un nom", de: "Of und ein Nomen", it: "Of e un sostantivo", pl: "Of i rzeczownik", tr: "Of ve bir isim", id: "Of dan kata benda", vi: "Of và một danh từ" }, rule: { en: "of and an abstract noun do the work of an adjective", uk: "of і абстрактний іменник виконують роль прикметника", es: "of y un sustantivo abstracto hacen el trabajo de un adjetivo", pt: "of e um substantivo abstrato fazem o papel de um adjetivo", fr: "of et un nom abstrait jouent le rôle d’un adjectif", de: "of und ein abstraktes Nomen übernehmen die Aufgabe eines Adjektivs", it: "of e un sostantivo astratto fanno il lavoro di un aggettivo", pl: "of i rzeczownik abstrakcyjny pełnią funkcję przymiotnika", tr: "of ve soyut bir isim, sıfat işi görür", id: "of dan kata benda abstrak berfungsi seperti kata sifat", vi: "of và một danh từ trừu tượng đóng vai trò của tính từ" }, ex: { examples: [["a man ", { target: of means }], ["a matter ", { target: of urgency }]] }, tr: { uk: { examples: ["заможна людина", "термінова справа"] }, es: { examples: ["un hombre acaudalado", "un asunto urgente"] }, pt: { examples: ["um homem abastado", "um assunto urgente"] }, fr: { examples: ["un homme fortuné", "une affaire urgente"] }, de: { examples: ["ein wohlhabender Mann", "eine dringende Angelegenheit"] }, it: { examples: ["un uomo benestante", "una questione urgente"] }, pl: { examples: ["zamożny mężczyzna", "pilna sprawa"] }, tr: { examples: ["varlıklı bir adam", "acil bir mesele"] }, id: { examples: ["pria berada", "hal yang mendesak"] }, vi: { examples: ["một người đàn ông giàu có", "một vấn đề cấp bách"] } } }
        - { level: B2, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: "the unit stays singular before a noun", uk: "одиниця виміру лишається в однині перед іменником", es: "la unidad queda en singular delante de un sustantivo", pt: "a unidade fica no singular antes de um substantivo", fr: "l’unité reste au singulier devant un nom", de: "die Einheit bleibt vor einem Nomen im Singular", it: "l'unità resta al singolare davanti a un sostantivo", pl: "jednostka pozostaje w liczbie pojedynczej przed rzeczownikiem", tr: "birim, bir isimden önce tekil kalır", id: "satuan tetap tunggal sebelum kata benda", vi: "đơn vị giữ ở số ít trước một danh từ" }, ex: ["a ", { target: five-day }, " course"], tr: { uk: "п’ятиденний курс", es: "un curso de cinco días", pt: "um curso de cinco dias", fr: "un cours de cinq jours", de: "ein fünftägiger Kurs", it: "un corso di cinque giorni", pl: "pięciodniowy kurs", tr: "beş günlük bir kurs", id: "kursus lima hari", vi: "một khóa học năm ngày" } }

sections:
  - title: { en: "Form: the slots of a noun phrase", uk: "Форма: позиції в іменниковому словосполученні", es: "Forma: las posiciones del grupo nominal", pt: "Forma: as posições do sintagma nominal", fr: "Forme : les positions du groupe nominal", de: "Form: die Positionen in der Nominalphrase", it: "Forma: le posizioni del sintagma nominale", pl: "Forma: miejsca w grupie rzeczownikowej", tr: "Biçim: isim öbeğinin konumları", id: "Bentuk: posisi dalam frasa nomina", vi: "Dạng: các vị trí trong cụm danh từ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: slot, label: { en: Slot, uk: "Позиція", es: "Posición", pt: "Posição", fr: "Position", de: "Position", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" } }
          - { key: words, label: { en: Words, uk: "Слова", es: "Palabras", pt: "Palavras", fr: "Mots", de: "Wörter", it: "Parole", pl: "Wyrazy", tr: "Sözcükler", id: "Kata", vi: "Từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            slot: { en: predeterminer, uk: "передетермінатив", es: "predeterminante", pt: "predeterminante", fr: "prédéterminant", de: "Vorbegleiter", it: "predeterminante", pl: "przedokreślnik", tr: "ön belirleyici", id: "predeterminer", vi: "từ đứng trước từ hạn định" }
            words: { alternatives: [all, both, half, double, such, what, quite] }
            ex: { examples: [[{ target: both }, " my brothers"], [{ target: such }, " a big house"], [{ target: quite }, " a long walk"]] }
            tr: { uk: { examples: ["обидва мої брати", "такий великий будинок", "досить довга прогулянка"] }, es: { examples: ["ambos hermanos míos", "una casa tan grande", "un paseo bastante largo"] }, pt: { examples: ["ambos os meus irmãos", "uma casa tão grande", "uma caminhada bem longa"] }, fr: { examples: ["mes deux frères", "une si grande maison", "une assez longue promenade"] }, de: { examples: ["meine beiden Brüder", "so ein großes Haus", "ein ziemlich langer Spaziergang"] }, it: { examples: ["entrambi i miei fratelli", "una casa così grande", "una passeggiata abbastanza lunga"] }, pl: { examples: ["obaj moi bracia", "tak duży dom", "dość długi spacer"] }, tr: { examples: ["her iki kardeşim", "bu kadar büyük bir ev", "oldukça uzun bir yürüyüş"] }, id: { examples: ["kedua saudara laki-laki saya", "rumah sebesar itu", "jalan kaki yang cukup panjang"] }, vi: { examples: ["cả hai anh em trai của tôi", "một ngôi nhà to đến thế", "một chuyến đi bộ khá dài"] } }
          - level: B2
            slot: { en: determiner, uk: "детермінатив", es: "determinante", pt: "determinante", fr: "déterminant", de: "Begleiter", it: "determinante", pl: "określnik", tr: "belirleyici", id: "determiner", vi: "từ hạn định" }
            words: { alternatives: [the, a, this, my, some, no, each, every] }
            ex: { examples: [["both ", { target: my }, " brothers"], ["such ", { target: a }, " big house"]] }
            tr: { uk: { examples: ["обидва мої брати", "такий великий будинок"] }, es: { examples: ["ambos hermanos míos", "una casa tan grande"] }, pt: { examples: ["ambos os meus irmãos", "uma casa tão grande"] }, fr: { examples: ["mes deux frères", "une si grande maison"] }, de: { examples: ["meine beiden Brüder", "so ein großes Haus"] }, it: { examples: ["entrambi i miei fratelli", "una casa così grande"] }, pl: { examples: ["obaj moi bracia", "tak duży dom"] }, tr: { examples: ["her iki kardeşim", "bu kadar büyük bir ev"] }, id: { examples: ["kedua saudara laki-laki saya", "rumah sebesar itu"] }, vi: { examples: ["cả hai anh em trai của tôi", "một ngôi nhà to đến thế"] } }
          - level: B2
            slot: { en: ordinal and number, uk: "порядковий і кількісний числівник", es: "ordinal y número", pt: "ordinal e número", fr: "ordinal et nombre", de: "Ordnungszahl und Zahl", it: "ordinale e numero", pl: "liczebnik porządkowy i główny", tr: "sıra sayısı ve sayı", id: "ordinal dan bilangan", vi: "số thứ tự và số đếm" }
            words: { alternatives: [first, second, last, next, other, two, ten] }
            ex: { examples: [["the ", { target: first }, " day"], ["my ", { target: two }, " sisters"]] }
            tr: { uk: { examples: ["перший день", "мої дві сестри"] }, es: { examples: ["el primer día", "mis dos hermanas"] }, pt: { examples: ["o primeiro dia", "minhas duas irmãs"] }, fr: { examples: ["le premier jour", "mes deux sœurs"] }, de: { examples: ["der erste Tag", "meine zwei Schwestern"] }, it: { examples: ["il primo giorno", "le mie due sorelle"] }, pl: { examples: ["pierwszy dzień", "moje dwie siostry"] }, tr: { examples: ["ilk gün", "iki kız kardeşim"] }, id: { examples: ["hari pertama", "dua saudari saya"] }, vi: { examples: ["ngày đầu tiên", "hai chị em gái của tôi"] } }
          - level: B2
            slot: { en: other quantifier, uk: "інше слово кількості", es: "otro cuantificador", pt: "outro quantificador", fr: "autre quantificateur", de: "anderes Mengenwort", it: "altro quantificatore", pl: "inny określnik ilości", tr: "diğer miktar sözcüğü", id: "quantifier lain", vi: "lượng từ khác" }
            words: { alternatives: [many, few, several, much, little] }
            ex: { examples: [["her ", { target: many }, " cousins"], ["the ", { target: few }, " tickets left"]] }
            tr: { uk: { examples: ["її численні кузени", "ті кілька квитків, що лишилися"] }, es: { examples: ["sus muchos primos", "los pocos boletos que quedan"] }, pt: { examples: ["seus muitos primos", "os poucos ingressos que restam"] }, fr: { examples: ["ses nombreux cousins", "les rares billets restants"] }, de: { examples: ["ihre vielen Cousins", "die wenigen übrigen Karten"] }, it: { examples: ["i suoi molti cugini", "i pochi biglietti rimasti"] }, pl: { examples: ["jej liczni kuzyni", "te nieliczne pozostałe bilety"] }, tr: { examples: ["onun pek çok kuzeni", "kalan birkaç bilet"] }, id: { examples: ["sepupu-sepupunya yang banyak", "sedikit tiket yang tersisa"] }, vi: { examples: ["rất nhiều anh chị em họ của cô ấy", "vài tấm vé còn lại"] } }
          - level: B2
            slot: { en: adjective, uk: "прикметник", es: "adjetivo", pt: "adjetivo", fr: "adjectif", de: "Adjektiv", it: "aggettivo", pl: "przymiotnik", tr: "sıfat", id: "kata sifat", vi: "tính từ" }
            words: { en: "any number, in the usual order", uk: "будь-яка кількість, у звичному порядку", es: "cualquier cantidad, en el orden habitual", pt: "qualquer quantidade, na ordem habitual", fr: "n’importe quel nombre, dans l’ordre habituel", de: "beliebig viele, in der üblichen Reihenfolge", it: "un numero qualsiasi, nell'ordine abituale", pl: "dowolna liczba, w zwykłej kolejności", tr: "herhangi bir sayıda, olağan sırayla", id: "jumlah berapa pun, dalam urutan yang lazim", vi: "bao nhiêu cũng được, theo trật tự thông thường" }
            ex: ["a ", { target: lovely old }, " house"]
            tr: { uk: "чудовий старий будинок", es: "una casa vieja y preciosa", pt: "uma casa velha e adorável", fr: "une belle vieille maison", de: "ein schönes altes Haus", it: "una bella vecchia casa", pl: "śliczny stary dom", tr: "güzel eski bir ev", id: "rumah tua yang indah", vi: "một ngôi nhà cũ xinh xắn" }
          - level: B2
            slot: { en: noun modifier, uk: "іменник-означення", es: "modificador nominal", pt: "modificador nominal", fr: "nom modificateur", de: "Nomen als Attribut", it: "modificatore nominale", pl: "rzeczownik w roli określenia", tr: "isim niteleyici", id: "pewatas berupa kata benda", vi: "danh từ bổ nghĩa" }
            words: { en: "a noun that classifies the head", uk: "іменник, що визначає вид головного іменника", es: "un sustantivo que clasifica al núcleo", pt: "um substantivo que classifica o núcleo", fr: "un nom qui classe le noyau", de: "ein Nomen, das das Kernnomen einordnet", it: "un sostantivo che classifica quello principale", pl: "rzeczownik, który klasyfikuje rzeczownik nadrzędny", tr: "ana ismi sınıflandıran bir isim", id: "kata benda yang menggolongkan kata benda inti", vi: "danh từ phân loại danh từ trung tâm" }
            ex: ["a ", { target: kitchen }, " table"]
