            text: { en: "The verb agrees with the head noun, however long the modifier:", uk: "Дієслово узгоджується з головним іменником, якою б довгою не була означальна частина:", es: "El verbo concuerda con el sustantivo núcleo, por largo que sea el modificador:", pt: "O verbo concorda com o substantivo núcleo, por mais longo que seja o modificador:", fr: "Le verbe s’accorde avec le nom noyau, aussi long que soit le modificateur :", de: "Das Verb richtet sich nach dem Kernnomen, wie lang das Attribut auch ist:", it: "Il verbo concorda con il sostantivo principale, per quanto lungo sia il modificatore:", pl: "Czasownik zgadza się z rzeczownikiem nadrzędnym, choćby określenie było bardzo długie:", tr: "Fiil, niteleyici ne kadar uzun olursa olsun ana isimle uyum sağlar:", id: "Kata kerja sesuai dengan kata benda inti, sepanjang apa pun pewatasnya:", vi: "Động từ hòa hợp với danh từ trung tâm, dù từ bổ nghĩa dài đến đâu:" }
