              es: [{ pattern: [{ alternatives: [{ term: this }, { term: that }] }, { slot: singular noun }, { term: is }] }, "; ", { pattern: [{ alternatives: [{ term: these }, { term: those }] }, { slot: plural noun }, { term: are }] }, "."]
