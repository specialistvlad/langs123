        rows:
          - level: C1
            form: { pattern: [{ alternatives: [{ term: this }, { term: these }] }, { slot: noun }] }
            rule: { en: names the idea that came before, uk: "називає ідею, що була раніше", es: "nombra la idea que se ha dicho antes", pt: "nomeia a ideia que veio antes", fr: "nomme l’idée qui précède", de: "benennt die Idee, die davor kam", it: "nomina l'idea appena espressa", pl: "nazywa myśl, która pojawiła się wcześniej", tr: "daha önce gelen düşünceyi adlandırır", id: "menamai gagasan yang disebut sebelumnya", vi: "gọi tên ý tưởng đã nói trước đó" }
            ex: { examples: [["The firm lost money. ", { target: This development }, " worried everyone."], ["The tests were repeated. ", { target: These results }, " were the same."]] }
            tr: { uk: { examples: ["Фірма втратила гроші. Ця подія стурбувала всіх.", "Тести повторили. Ці результати були однаковими."] }, es: { examples: ["La empresa perdió dinero. Esta evolución preocupó a todos.", "Repitieron las pruebas. Estos resultados fueron los mismos."] }, pt: { examples: ["A empresa perdeu dinheiro. Esse desdobramento preocupou todos.", "Os testes foram repetidos. Esses resultados foram os mesmos."] }, fr: { examples: ["L’entreprise a perdu de l’argent. Cette évolution a inquiété tout le monde.", "Les tests ont été refaits. Ces résultats étaient identiques."] }, de: { examples: ["Die Firma hat Geld verloren. Diese Entwicklung beunruhigte alle.", "Die Tests wurden wiederholt. Diese Ergebnisse waren dieselben."] }, it: { examples: ["L'azienda ha perso denaro. Questo sviluppo ha preoccupato tutti.", "I test sono stati ripetuti. Questi risultati erano gli stessi."] }, pl: { examples: ["Firma straciła pieniądze. Ten rozwój wypadków zaniepokoił wszystkich.", "Testy powtórzono. Te wyniki były takie same."] }, tr: { examples: ["Şirket para kaybetti. Bu gelişme herkesi endişelendirdi.", "Testler tekrarlandı. Bu sonuçlar aynıydı."] }, id: { examples: ["Perusahaan itu rugi. Perkembangan ini mengkhawatirkan semua orang.", "Tes diulang. Hasil ini sama saja."] }, vi: { examples: ["Công ty bị thua lỗ. Diễn biến này khiến ai cũng lo.", "Các bài kiểm tra được làm lại. Những kết quả này vẫn giống nhau."] } }
          - level: C1
            form: { pattern: [{ term: such }, { alternatives: [{ term: a }, { term: an }] }, { slot: noun }] }
            rule: { en: names the kind of thing just described, uk: "називає щойно описаний вид речі", es: "nombra el tipo de cosa que se acaba de describir", pt: "nomeia o tipo de coisa que acabou de ser descrito", fr: "nomme le genre de chose qui vient d’être décrit", de: "benennt die Art von Sache, die gerade beschrieben wurde", it: "nomina il tipo di cosa appena descritto", pl: "nazywa rodzaj rzeczy, którą właśnie opisano", tr: "az önce anlatılan türden şeyi adlandırır", id: "menamai jenis hal yang baru saja diuraikan", vi: "gọi tên loại việc vừa được mô tả" }
            ex: ["She works hard. ", { target: Such an approach }, " pays off."]
            tr: { uk: "Вона наполегливо працює. Такий підхід окупається.", es: "Ella trabaja duro. Un enfoque así da resultados.", pt: "Ela trabalha duro. Uma postura assim compensa.", fr: "Elle travaille dur. Une telle approche porte ses fruits.", de: "Sie arbeitet hart. Ein solcher Ansatz zahlt sich aus.", it: "Lavora sodo. Un approccio simile dà i suoi frutti.", pl: "Ona ciężko pracuje. Takie podejście się opłaca.", tr: "Çok çalışıyor. Böyle bir yaklaşım meyvesini verir.", id: "Dia bekerja keras. Pendekatan seperti itu membuahkan hasil.", vi: "Cô ấy làm việc chăm chỉ. Cách tiếp cận như vậy sẽ có kết quả." }
          - level: C1
            form: { alternatives: [{ term: the former }, { term: the latter }] }
            rule: { en: "the first of two, the second of two", uk: "перший із двох, другий із двох", es: "el primero de dos, el segundo de dos", pt: "o primeiro de dois, o segundo de dois", fr: "le premier de deux, le second de deux", de: "der erste von zwei, der zweite von zwei", it: "il primo di due, il secondo di due", pl: "pierwszy z dwóch, drugi z dwóch", tr: "ikiden birincisi, ikiden ikincisi", id: "yang pertama dari dua, yang kedua dari dua", vi: "cái thứ nhất trong hai, cái thứ hai trong hai" }
            ex: ["Tom and Ana applied. ", { target: The former }, " got the job."]
            tr: { uk: "Том і Ана подали заявки. Перший отримав роботу.", es: "Tom y Ana se presentaron. El primero consiguió el puesto.", pt: "Tom e Ana se candidataram. O primeiro conseguiu a vaga.", fr: "Tom et Ana ont postulé. Le premier a eu le poste.", de: "Tom und Ana haben sich beworben. Ersterer bekam die Stelle.", it: "Tom e Ana si sono candidati. Il primo ha ottenuto il lavoro.", pl: "Tom i Ana złożyli podania. Ten pierwszy dostał pracę.", tr: "Tom ve Ana başvurdu. İlki işi aldı.", id: "Tom dan Ana melamar. Yang pertama mendapat pekerjaan itu.", vi: "Tom và Ana đã nộp đơn. Người trước được nhận việc." }
          - level: C1
            form: { term: the above }
            rule: { en: "what is written earlier, in formal writing", uk: "те, що написано раніше, у формальному письмі", es: "lo que se ha escrito antes, en textos formales", pt: "o que foi escrito antes, em textos formais", fr: "ce qui est écrit plus haut, dans un écrit formel", de: "das weiter oben Geschriebene, in formellen Texten", it: "ciò che è scritto prima, nella scrittura formale", pl: "to, co napisano wcześniej, w piśmie formalnym", tr: "resmî yazıda, daha önce yazılanlar", id: "apa yang ditulis sebelumnya, dalam tulisan formal", vi: "điều đã viết ở trên, trong văn bản trang trọng" }
            ex: ["Please check ", { target: the above }, " before you sign."]
            tr: { uk: "Перевірте, будь ласка, вищевикладене, перш ніж підписувати.", es: "Revise lo anterior antes de firmar, por favor.", pt: "Confira o que está acima antes de assinar.", fr: "Veuillez vérifier ce qui précède avant de signer.", de: "Bitte prüfen Sie das Obenstehende, bevor Sie unterschreiben.", it: "Controlli quanto sopra prima di firmare.", pl: "Proszę sprawdzić powyższe przed podpisaniem.", tr: "Lütfen imzalamadan önce yukarıdakileri kontrol edin.", id: "Mohon periksa hal di atas sebelum Anda menandatangani.", vi: "Vui lòng kiểm tra nội dung trên trước khi ký." }

