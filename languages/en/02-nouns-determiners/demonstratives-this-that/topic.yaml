          - { level: A0, form: { pattern: [{ slot: plural noun }], follows: true }, ex: [{ target: Those }, " shoes are nice."], tr: { uk: "Ті туфлі гарні.", es: "Esos zapatos son bonitos.", pt: "Aqueles sapatos são bonitos.", fr: "Ces chaussures sont jolies.", de: "Die Schuhe da sind schön.", it: "Quelle scarpe sono belle.", pl: "Te buty są ładne.", tr: "Şu ayakkabılar güzel.", id: "Sepatu itu bagus.", vi: "Những đôi giày kia đẹp." } }
          - { level: A0, form: { en: alone, uk: "окремо", es: "solo", pt: "sozinho", fr: "seul", de: "allein", it: "da sole", pl: "samodzielnie", tr: "tek başına", id: "berdiri sendiri", vi: "đứng một mình" }, ex: { examples: [[{ target: This }, " is my bag."], [{ target: Those }, " are my shoes."]] }, tr: { uk: { examples: ["Це моя сумка.", "То мої туфлі."] }, es: { examples: ["Este es mi bolso.", "Esos son mis zapatos."] }, pt: { examples: ["Esta é minha bolsa.", "Aqueles são meus sapatos."] }, fr: { examples: ["C’est mon sac.", "Ce sont mes chaussures."] }, de: { examples: ["Das ist meine Tasche.", "Das sind meine Schuhe."] }, it: { examples: ["Questa è la mia borsa.", "Quelle sono le mie scarpe."] }, pl: { examples: ["To jest moja torba.", "To są moje buty."] }, tr: { examples: ["Bu benim çantam.", "Şunlar benim ayakkabılarım."] }, id: { examples: ["Ini tas saya.", "Itu sepatu saya."] }, vi: { examples: ["Đây là túi của tôi.", "Kia là giày của tôi."] } } }
          - { level: A1, form: { pattern: [one], follows: true }, ex: ["I like ", { target: that one }, "."], tr: { uk: "Мені подобається той.", es: "Me gusta ese.", pt: "Gosto daquele.", fr: "J’aime celui-là.", de: "Ich mag das da.", it: "Mi piace quello.", pl: "Lubię tamten.", tr: "Şunu beğeniyorum.", id: "Saya suka yang itu.", vi: "Tôi thích cái kia." } }
      - type: list
