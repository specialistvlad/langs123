            ex: [{ target: This is }, " what I mean: we need more time."]
            tr: { uk: "Я маю на увазі ось що: нам потрібно більше часу.", es: "Esto es lo que quiero decir: necesitamos más tiempo.", pt: "É isto que eu quero dizer: precisamos de mais tempo.", fr: "Voilà ce que je veux dire : il nous faut plus de temps.", de: "Das meine ich: Wir brauchen mehr Zeit.", it: "Intendo questo: ci serve più tempo.", pl: "Chodzi mi o to: potrzebujemy więcej czasu.", tr: "Demek istediğim şu: daha fazla zamana ihtiyacımız var.", id: "Maksud saya begini: kita butuh lebih banyak waktu.", vi: "Ý tôi là thế này: chúng ta cần thêm thời gian." }
