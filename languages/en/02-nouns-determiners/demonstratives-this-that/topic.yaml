title: { en: "This, That, These, Those", uk: "Вказівні слова: this, that, these, those", es: "Demostrativos: this, that, these, those", pt: "Demonstrativos: this, that, these, those", fr: "Démonstratifs : this, that, these, those", de: "This, that, these, those", it: "Dimostrativi: this, that, these, those", pl: "Zaimki wskazujące: this, that, these, those", tr: "İşaret sözcükleri: this, that, these, those", id: "Kata tunjuk: this, that, these, those", vi: "Từ chỉ định: this, that, these, those" }
summary:
  lead:
    en: [{ term: This }, " and ", { term: these }, " point to things near you; ", { term: that }, " and ", { term: those }, " point to things far away, in the singular and the plural."]
    uk: [{ term: This }, " і ", { term: these }, " вказують на предмети поблизу, ", { term: that }, " і ", { term: those }, " — на предмети далеко, в однині та множині."]
    es: [{ term: This }, " y ", { term: these }, " señalan cosas cercanas; ", { term: that }, " y ", { term: those }, " señalan cosas lejanas, en singular y en plural."]
    pt: [{ term: "This" }, " e ", { term: "these" }, " indicam coisas próximas; ", { term: "that" }, " e ", { term: "those" }, " indicam coisas distantes, no singular e no plural."]
    fr: [{ term: "This" }, " et ", { term: "these" }, " désignent des choses proches ; ", { term: "that" }, " et ", { term: "those" }, " désignent des choses éloignées, au singulier et au pluriel."]
    de: [{ term: "This" }, " und ", { term: "these" }, " zeigen auf Dinge in der Nähe; ", { term: "that" }, " und ", { term: "those" }, " zeigen auf Dinge, die weiter weg sind, im Singular und im Plural."]
    it: [{ term: "This" }, " e ", { term: "these" }, " indicano cose vicine; ", { term: "that" }, " e ", { term: "those" }, " indicano cose lontane, al singolare e al plurale."]
    pl: [{ term: "This" }, " i ", { term: "these" }, " wskazują rzeczy bliskie; ", { term: "that" }, " i ", { term: "those" }, " wskazują rzeczy dalekie, w liczbie pojedynczej i mnogiej."]
    tr: [{ term: "This" }, " ve ", { term: "these" }, " yakındaki şeyleri, ", { term: "that" }, " ve ", { term: "those" }, " uzaktaki şeyleri gösterir; tekil ve çoğul için ayrı biçimler vardır."]
    id: [{ term: "This" }, " dan ", { term: "these" }, " menunjuk benda yang dekat; ", { term: "that" }, " dan ", { term: "those" }, " menunjuk benda yang jauh, dalam bentuk tunggal dan jamak."]
    vi: [{ term: "This" }, " và ", { term: "these" }, " chỉ những vật ở gần; ", { term: "that" }, " và ", { term: "those" }, " chỉ những vật ở xa, ở số ít và số nhiều."]
  rule:
    en: [{ term: These }, " and ", { term: those }, " go with plural nouns and ", { term: are }, ":"]
    uk: [{ term: These }, " і ", { term: those }, " стоять з іменниками в множині та з дієсловом ", { term: are }, ":"]
    es: [{ term: These }, " y ", { term: those }, " van con sustantivos plurales y con el verbo ", { term: are }, ":"]
    pt: [{ term: "These" }, " e ", { term: "those" }, " vão com substantivos no plural e com o verbo ", { term: "are" }, ":"]
    fr: [{ term: "These" }, " et ", { term: "those" }, " vont avec des noms pluriels et avec ", { term: "are" }, " :"]
    de: [{ term: "These" }, " und ", { term: "those" }, " stehen mit Nomen im Plural und mit ", { term: "are" }, ":"]
    it: [{ term: "These" }, " e ", { term: "those" }, " si usano con sostantivi plurali e con il verbo ", { term: "are" }, ":"]
    pl: [{ term: "These" }, " i ", { term: "those" }, " łączą się z rzeczownikami w liczbie mnogiej i z ", { term: "are" }, ":"]
    tr: [{ term: "These" }, " ve ", { term: "those" }, " çoğul isimlerle ve ", { term: "are" }, " ile kullanılır:"]
    id: [{ term: "These" }, " dan ", { term: "those" }, " dipakai dengan kata benda jamak dan dengan kata kerja ", { term: "are" }, ":"]
    vi: [{ term: "These" }, " và ", { term: "those" }, " đi với danh từ số nhiều và ", { term: "are" }, ":"]
  ex: { examples: [[{ target: These }, " are my keys."], [{ target: Those }, " shoes ", { target: are }, " nice."]] }

