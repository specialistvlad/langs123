            level: A0
            text:
              en: ["The four words never change for masculine or feminine: ", { term: this man }, ", ", { term: this woman }, "."]
              uk: ["Усі чотири слова не змінюються за родом: ", { term: this man }, ", ", { term: this woman }, "."]
              es: ["Las cuatro palabras no cambian según el género: ", { term: this man }, ", ", { term: this woman }, "."]
              pt: ["As quatro palavras não mudam para o masculino e o feminino: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              fr: ["Les quatre mots ne changent pas selon le genre : ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              de: ["Die vier Wörter ändern sich nicht nach dem Geschlecht: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              it: ["Le quattro parole non cambiano secondo il genere: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              pl: ["Te cztery słowa nie zmieniają się w zależności od rodzaju: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              tr: ["Dört sözcük de cinsiyete göre değişmez: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              id: ["Keempat kata ini tidak berubah menurut gender: ", { term: "this man" }, ", ", { term: "this woman" }, "."]
              vi: ["Cả bốn từ không đổi theo giống đực hay giống cái: ", { term: "this man" }, ", ", { term: "this woman" }, "."]

  - title: { en: "Form: before a noun or alone", uk: "Форма: перед іменником або окремо", es: "Forma: antes de un sustantivo o solo", pt: "Forma: antes de um substantivo ou sozinho", fr: "Forme : devant un nom ou seul", de: "Form: vor einem Nomen oder allein", it: "Forma: davanti a un sostantivo o da sole", pl: "Forma: przed rzeczownikiem lub samodzielnie", tr: "Biçim: bir isimden önce ya da tek başına", id: "Bentuk: sebelum kata benda atau berdiri sendiri", vi: "Dạng: trước danh từ hoặc đứng một mình" }
