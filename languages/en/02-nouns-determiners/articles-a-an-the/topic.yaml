    es: [{ term: A }, " y ", { term: an }, " acompañan a una cosa, ", { term: the }, " a algo que ambos conocen, y las cosas en general van sin artículo."]
    pt: [{ term: "A" }, " e ", { term: "an" }, " para uma coisa, ", { term: "the" }, " para algo que as duas pessoas conhecem, e nenhum artigo para as coisas em geral."]
    fr: [{ term: "A" }, " et ", { term: "an" }, " pour une chose, ", { term: "the" }, " pour une chose que les deux interlocuteurs connaissent, et pas d’article pour les choses en général."]
    de: [{ term: "A" }, " und ", { term: "an" }, " stehen bei einer Sache, ", { term: "the" }, " bei etwas, das beide kennen; Dinge im Allgemeinen stehen ohne Artikel."]
    it: [{ term: "A" }, " e ", { term: "an" }, " per una cosa sola, ", { term: "the" }, " per una cosa che entrambi conoscono, e nessun articolo per le cose in generale."]
    pl: [{ term: "A" }, " i ", { term: "an" }, " stoją przy jednej rzeczy, ", { term: "the" }, " przy rzeczy znanej obu rozmówcom, a rzeczy ogólne nie mają przedimka."]
