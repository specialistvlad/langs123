      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Articles are weak and unstressed: the stress falls on the noun."
              uk: "Артиклі слабкі й ненаголошені: наголос падає на іменник."
              es: "Los artículos son débiles y átonos: el acento cae en el sustantivo."
              pt: "Os artigos são fracos e átonos: o acento tônico cai no substantivo."
              fr: "Les articles sont faibles et inaccentués : l’accent tombe sur le nom."
              de: "Artikel sind schwach und unbetont: die Betonung liegt auf dem Nomen."
              it: "Gli articoli sono deboli e non accentati: l'accento cade sul sostantivo."
              pl: "Przedimki są słabe i nieakcentowane: akcent pada na rzeczownik."
              tr: "Artikeller zayıf ve vurgusuzdur: vurgu isme düşer."
              id: "Artikel bersifat lemah dan tidak bertekanan: tekanan jatuh pada kata benda."
              vi: "Mạo từ ở dạng yếu và không mang trọng âm: trọng âm rơi vào danh từ."

