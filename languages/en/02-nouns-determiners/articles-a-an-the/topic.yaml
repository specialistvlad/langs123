title: { en: "Articles: a, an, the", uk: "Артиклі: a, an, the", es: "Artículos: a, an, the", pt: "Artigos: a, an, the", fr: "Articles : a, an, the", de: "Artikel: a, an, the", it: "Articoli: a, an, the", pl: "Przedimki: a, an, the", tr: "Artikeller: a, an, the", id: "Artikel: a, an, the", vi: "Mạo từ: a, an, the" }
summary:
  lead:
    en: [{ term: A }, " and ", { term: an }, " for one thing, ", { term: the }, " for a thing both people know, and no article for things in general."]
