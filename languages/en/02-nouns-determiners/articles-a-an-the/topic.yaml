    pl: ["Wybór ", { term: "a" }, " lub ", { term: "an" }, " zależy od pierwszego dźwięku (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, "), a ogólne liczby mnogie i rzeczowniki niepoliczalne występują bez przedimka:"]
    tr: ["İlk ses ", { term: "a" }, " ya da ", { term: "an" }, " seçimini belirler (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, "); genel anlamlı çoğul ve sayılamayan isimlerde artikel kullanılmaz:"]
    id: ["Bunyi pertama menentukan ", { term: "a" }, " atau ", { term: "an" }, " (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, "), dan kata benda jamak umum serta kata benda tak terhitung tidak memakai artikel:"]
    vi: ["Âm đầu quyết định dùng ", { term: "a" }, " hay ", { term: "an" }, " (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, "); số nhiều chung và danh từ không đếm được không có mạo từ:"]
  ex: ["I like ", { target: dogs }, "."]

