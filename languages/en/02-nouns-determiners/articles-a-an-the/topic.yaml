title: { en: "Articles: a, an, the", uk: "Артиклі: a, an, the", es: "Artículos: a, an, the" }
summary:
  lead:
    en: [{ term: A }, " and ", { term: an }, " for one thing, ", { term: the }, " for a thing both people know, and no article for things in general."]
    uk: [{ term: A }, " і ", { term: an }, " вживаються з одним предметом, ", { term: the }, " — з предметом, відомим обом співрозмовникам, а для речей загалом артикль не потрібен."]
    es: [{ term: A }, " y ", { term: an }, " acompañan a una cosa, ", { term: the }, " a algo que ambos conocen, y las cosas en general van sin artículo."]
  rule:
    en: ["The first sound decides ", { term: a }, " or ", { term: an }, " (", { term: an }, " ", { term: hour }, ", ", { term: a }, " ", { term: university }, "), and general plurals and uncountable nouns take no article:"]
    uk: ["Вибір ", { term: a }, " чи ", { term: an }, " залежить від першого звука (", { term: an }, " ", { term: hour }, ", ", { term: a }, " ", { term: university }, "), а загальна множина й незлічувані іменники вживаються без артикля:"]
    es: ["El primer sonido decide entre ", { term: a }, " y ", { term: an }, " (", { term: an }, " ", { term: hour }, ", ", { term: a }, " ", { term: university }, "); los plurales generales y los incontables no llevan artículo:"]
  ex: ["I like ", { target: dogs }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A1, point: { en: Form, uk: "Форма", es: "Forma" }, rule: { en: [{ term: a }, " before a consonant sound, ", { term: an }, " before a vowel sound"], uk: [{ term: a }, " перед приголосним звуком, ", { term: an }, " перед голосним звуком"], es: [{ term: a }, " delante de un sonido consonántico, ", { term: an }, " delante de un sonido vocálico"] }, ex: { examples: [[{ target: a }, " book"], [{ target: an }, " apple"]] }, tr: { uk: { examples: ["книжка", "яблуко"] }, es: { examples: ["un libro", "una manzana"] } } }
        - { level: A1, point: { alternatives: [a, an] }, rule: { en: "one thing, a job, or a first mention", uk: "один предмет, професія або перша згадка", es: "una cosa, una profesión o una primera mención" }, ex: ["She's ", { target: a }, " doctor."], tr: { uk: "Вона лікарка.", es: "Ella es médica." } }
        - { level: A1, point: the, rule: { en: "a thing we both know, or already mentioned", uk: "предмет, відомий нам обом, або вже згаданий", es: "algo que ambos conocemos o que ya se mencionó" }, ex: ["There's a cat. ", { target: The }, " cat is black."], tr: { uk: "Там кіт. Цей кіт чорний.", es: "Hay un gato. El gato es negro." } }
        - { level: A1, point: the, rule: { en: "the only one; superlatives and ordinals", uk: "єдиний у своєму роді; найвищий ступінь і порядкові числівники", es: "el único; superlativos y ordinales" }, ex: { examples: [[{ target: the }, " sun"], [{ target: the }, " best"], [{ target: the }, " first time"]] }, tr: { uk: { examples: ["сонце", "найкращий", "перший раз"] }, es: { examples: ["el sol", "el mejor", "la primera vez"] } } }
        - { level: A2, point: the, rule: { en: "rivers, seas, oceans, mountain ranges", uk: "річки, моря, океани, гірські хребти", es: "ríos, mares, océanos, cordilleras" }, ex: { examples: [[{ target: the }, " Thames"], [{ target: the }, " Atlantic"], [{ target: the }, " Alps"]] }, tr: { uk: { examples: ["Темза", "Атлантичний океан", "Альпи"] }, es: { examples: ["el Támesis", "el Atlántico", "los Alpes"] } } }
        - { level: A2, point: the, rule: { en: ["countries with a plural name, ", { term: Kingdom }, " or ", { term: States }], uk: ["країни з назвою у множині, ", { term: Kingdom }, " або ", { term: States }], es: ["países con nombre plural, ", { term: Kingdom }, " o ", { term: States }] }, ex: { examples: [[{ target: the }, " UK"], [{ target: the }, " USA"], [{ target: the }, " Netherlands"]] }, tr: { uk: { examples: ["Велика Британія", "США", "Нідерланди"] }, es: { examples: ["el Reino Unido", "Estados Unidos", "los Países Bajos"] } } }
        - { level: B1, point: the, rule: { en: [{ pattern: [{ term: the }, { slot: adjective }] }, " means a group of people"], uk: [{ pattern: [{ term: the }, { slot: adjective }] }, " означає групу людей"], es: [{ pattern: [{ term: the }, { slot: adjective }] }, " designa a un grupo de personas"] }, ex: { examples: [[{ target: the }, " rich"], [{ target: the }, " young"]] }, tr: { uk: { examples: ["багаті", "молодь"] }, es: { examples: ["los ricos", "los jóvenes"] } } }
        - { level: A1, point: { en: No article, uk: "Без артикля", es: "Sin artículo" }, rule: { en: "plural and uncountable nouns in general; meals; names", uk: "іменники у множині й незлічувані загалом; прийоми їжі; імена", es: "plurales e incontables en general; comidas; nombres" }, ex: { examples: [["I like ", { target: dogs }, "."], ["We have ", { target: lunch }, " at two."]] }, tr: { uk: { examples: ["Я люблю собак.", "Ми обідаємо о другій."] }, es: { examples: ["Me gustan los perros.", "Almorzamos a las dos."] } } }
        - { level: A2, point: { en: No article, uk: "Без артикля", es: "Sin artículo" }, rule: { en: [{ term: home }, ", ", { term: work }, ", ", { term: school }, ", ", { term: bed }, "; transport after ", { term: by }], uk: [{ term: home }, ", ", { term: work }, ", ", { term: school }, ", ", { term: bed }, "; транспорт після ", { term: by }], es: [{ term: home }, ", ", { term: work }, ", ", { term: school }, ", ", { term: bed }, "; transporte después de ", { term: by }] }, ex: { examples: [["go ", { target: home }], ["at ", { target: work }], ["by ", { target: bus }]] }, tr: { uk: { examples: ["іти додому", "на роботі", "автобусом"] }, es: { examples: ["ir a casa", "en el trabajo", "en autobús"] } } }
        - { level: B1, point: { en: No article, uk: "Без артикля", es: "Sin artículo" }, rule: { en: [{ term: hospital }, ", ", { term: prison }, ", ", { term: church }, " for their purpose; ", { term: the }, " for the building"], uk: [{ term: hospital }, ", ", { term: prison }, ", ", { term: church }, ", коли важливе їхнє призначення; ", { term: the }, " для самої будівлі"], es: [{ term: hospital }, ", ", { term: prison }, ", ", { term: church }, " para su función; ", { term: the }, " para el edificio"] }, ex: ["He's in ", { target: hospital }, "."], tr: { uk: "Він лежить у лікарні.", es: "Está hospitalizado." } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: "the first sound decides, not the letter", uk: "вирішує перший звук, а не літера", es: "decide el primer sonido, no la letra" }, ex: { examples: [[{ target: a }, " university"], [{ target: an }, " hour"]] }, tr: { uk: { examples: ["університет", "година"] }, es: { examples: ["una universidad", "una hora"] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: "most countries take no article", uk: "більшість країн — без артикля", es: "la mayoría de los países no llevan artículo" }, ex: ["I live in ", { target: Spain }, "."], tr: { uk: "Я живу в Іспанії.", es: "Vivo en España." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: [{ alternatives: [{ term: a }, { term: an }] }, " go only with singular countable nouns. See ", { link: Countable and uncountable, to: en.nouns-determiners.countable-uncountable }, "."]
              uk: [{ alternatives: [{ term: a }, { term: an }] }, " вживаються лише зі злічуваними іменниками в однині. Див. ", { link: "Злічувані та незлічувані іменники", to: en.nouns-determiners.countable-uncountable }, "."]
              es: [{ alternatives: [{ term: a }, { term: an }] }, " solo se usan con sustantivos contables en singular. Ver ", { link: "Sustantivos contables e incontables", to: en.nouns-determiners.countable-uncountable }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: the }, " goes with all nouns: singular, plural and uncountable."]
              uk: [{ term: the }, " вживається з усіма іменниками: в однині, у множині й незлічуваними."]
              es: [{ term: the }, " va con todos los sustantivos: singulares, plurales e incontables."]

  - title: { en: "Form: a or an", uk: "Форма: a чи an", es: "Forma: a o an" }
    role: form
    content:
      - type: usage
        columns:
          - { key: before, label: { en: Next word starts with, uk: "Наступне слово починається з", es: "La palabra siguiente empieza con" } }
          - { key: article, label: { en: Article, uk: "Артикль", es: "Artículo" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, before: { en: a consonant sound, uk: "приголосного звука", es: "un sonido consonántico" }, article: a, ex: { examples: [[{ target: a }, " book"], [{ target: a }, " big apple"]] }, tr: { uk: { examples: ["книжка", "велике яблуко"] }, es: { examples: ["un libro", "una manzana grande"] } } }
          - { level: A1, before: { en: a vowel sound, uk: "голосного звука", es: "un sonido vocálico" }, article: an, ex: { examples: [[{ target: an }, " apple"], [{ target: an }, " old book"]] }, tr: { uk: { examples: ["яблуко", "стара книжка"] }, es: { examples: ["una manzana", "un libro viejo"] } } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The first sound decides, not the letter: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
              uk: ["Вирішує перший звук, а не літера: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
              es: ["Decide el primer sonido, no la letra: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
          - type: rule
            level: A1
            text:
              en: ["The article goes before the adjective, so the adjective decides: ", { term: an }, " ", { term: old car }, ", ", { term: a }, " ", { term: new car }, "."]
              uk: ["Артикль стоїть перед прикметником, тому вирішує прикметник: ", { term: an }, " ", { term: old car }, ", ", { term: a }, " ", { term: new car }, "."]
              es: ["El artículo va antes del adjetivo, así que decide el adjetivo: ", { term: an }, " ", { term: old car }, ", ", { term: a }, " ", { term: new car }, "."]

  - title: { en: "Pronunciation: a, an, the", uk: "Вимова: a, an, the", es: "Pronunciación: a, an, the" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, uk: "Слово", es: "Palabra" } }
          - { key: before, label: { en: Before, uk: "Перед", es: "Antes de" } }
          - { key: sound, label: { en: Sound, uk: "Звук", es: "Sonido" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, word: a, before: { en: consonant sound, uk: "приголосний звук", es: "sonido consonántico" }, sound: { ipa: ə }, ex: { ex: ["a book ", { ipa: ə ˈbʊk }], tr: { uk: "книжка", es: "un libro" } } }
          - { level: A1, word: an, before: { en: vowel sound, uk: "голосний звук", es: "sonido vocálico" }, sound: { ipa: ən }, ex: { ex: ["an egg ", { ipa: ən ˈeɡ }], tr: { uk: "яйце", es: "un huevo" } } }
          - { level: A1, word: the, before: { en: consonant sound, uk: "приголосний звук", es: "sonido consonántico" }, sound: { ipa: ðə }, ex: { ex: ["the book ", { ipa: ðə ˈbʊk }], tr: { uk: "книжка", es: "el libro" } } }
          - { level: A1, word: the, before: { en: vowel sound, uk: "голосний звук", es: "sonido vocálico" }, sound: { ipa: ði }, ex: { ex: ["the egg ", { ipa: ði ˈeɡ }], tr: { uk: "яйце", es: "el huevo" } } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Articles are weak and unstressed: the stress falls on the noun."
              uk: "Артиклі слабкі й ненаголошені: наголос падає на іменник."
              es: "Los artículos son débiles y átonos: el acento cae en el sustantivo."

  - title: { en: ["Use: ", { alternatives: [a, an] }], uk: ["Вживання: ", { alternatives: [a, an] }], es: ["Uso: ", { alternatives: [a, an] }] }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, use: { en: "one thing, any one", uk: "один предмет, будь-який", es: "una cosa, cualquiera" }, ex: ["I have ", { target: a }, " car."], tr: { uk: "У мене є машина.", es: "Tengo un coche." } }
          - { level: A1, use: { en: ["first mention; then ", { term: the }], uk: ["перша згадка; далі ", { term: the }], es: ["primera mención; después ", { term: the }] }, ex: ["There's ", { target: a }, " cat. ", { target: The }, " cat is black."], tr: { uk: "Там кіт. Цей кіт чорний.", es: "Hay un gato. El gato es negro." } }
          - { level: A1, use: { en: jobs, uk: "професії", es: "profesiones" }, ex: ["She's ", { target: a }, " doctor."], tr: { uk: "Вона лікарка.", es: "Ella es médica." } }
          - { level: A1, use: { en: what something is, uk: "що це таке", es: "qué es algo" }, ex: ["It's ", { target: an }, " orange."], tr: { uk: "Це апельсин.", es: "Es una naranja." } }
          - { level: A2, use: { en: ["rate: ", { term: per }], uk: ["частота й ціна: ", { term: per }], es: ["frecuencia y precio: ", { term: per }] }, ex: { examples: [["twice ", { target: a }, " week"], ["£3 ", { target: a }, " kilo"]] }, tr: { uk: { examples: ["двічі на тиждень", "3 фунти за кілограм"] }, es: { examples: ["dos veces por semana", "3 libras el kilo"] } } }
          - { level: A2, use: { en: ["exclamations with ", { term: what }], uk: ["вигуки з ", { term: what }], es: ["exclamaciones con ", { term: what }] }, ex: ["What ", { target: a }, " nice day!"], tr: { uk: "Який чудовий день!", es: "¡Qué día tan bonito!" } }

  - title: { en: "Use: the", uk: "Вживання: the", es: "Uso: the" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, use: { en: we both know which, uk: "ми обоє знаємо, який саме", es: "ambos sabemos cuál" }, ex: ["Close ", { target: the }, " door, please."], tr: { uk: "Зачини двері, будь ласка.", es: "Cierra la puerta, por favor." } }
          - { level: A1, use: { en: the only one, uk: "єдиний у своєму роді", es: "el único" }, ex: { examples: [[{ target: the }, " sun"], [{ target: the }, " world"]] }, tr: { uk: { examples: ["сонце", "світ"] }, es: { examples: ["el sol", "el mundo"] } } }
          - { level: A1, use: { en: superlatives and ordinals, uk: "найвищий ступінь порівняння й порядкові числівники", es: "superlativos y ordinales" }, ex: { examples: [[{ target: the }, " best"], [{ target: the }, " first time"]] }, tr: { uk: { examples: ["найкращий", "перший раз"] }, es: { examples: ["el mejor", "la primera vez"] } } }
          - { level: A2, use: { en: musical instruments, uk: "музичні інструменти", es: "instrumentos musicales" }, ex: ["She plays ", { target: the }, " piano. ", { variant: ["often ", { term: plays piano }], variety: en-US }], tr: { uk: "Вона грає на піаніно.", es: "Ella toca el piano." } }
          - { level: A2, use: { en: "rivers, seas, oceans, mountain ranges", uk: "річки, моря, океани, гірські хребти", es: "ríos, mares, océanos, cordilleras" }, ex: { examples: [[{ target: the }, " Thames"], [{ target: the }, " Atlantic"], [{ target: the }, " Alps"]] }, tr: { uk: { examples: ["Темза", "Атлантичний океан", "Альпи"] }, es: { examples: ["el Támesis", "el Atlántico", "los Alpes"] } } }
          - { level: A2, use: { en: ["countries with ", { term: Kingdom }, ", ", { term: States }, ", ", { term: Republic }, " or a plural name"], uk: ["країни зі словами ", { term: Kingdom }, ", ", { term: States }, ", ", { term: Republic }, " або з назвою у множині"], es: ["países con ", { term: Kingdom }, ", ", { term: States }, ", ", { term: Republic }, " o con nombre plural"] }, ex: { examples: [[{ target: the }, " UK"], [{ target: the }, " USA"], [{ target: the }, " Netherlands"]] }, tr: { uk: { examples: ["Велика Британія", "США", "Нідерланди"] }, es: { examples: ["el Reino Unido", "Estados Unidos", "los Países Bajos"] } } }
          - { level: B1, use: { en: [{ pattern: [{ term: the }, { slot: adjective }] }, ": a group of people"], uk: [{ pattern: [{ term: the }, { slot: adjective }] }, ": група людей"], es: [{ pattern: [{ term: the }, { slot: adjective }] }, ": un grupo de personas"] }, ex: { examples: [[{ target: the }, " rich"], [{ target: the }, " young"]] }, tr: { uk: { examples: ["багаті", "молодь"] }, es: { examples: ["los ricos", "los jóvenes"] } } }

  - title: { en: "Use: no article", uk: "Вживання: без артикля", es: "Uso: sin artículo" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, uk: "Вживання", es: "Uso" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, use: { en: plural nouns in general, uk: "іменники у множині загалом", es: "sustantivos plurales en general" }, ex: ["I like ", { target: dogs }, "."], tr: { uk: "Я люблю собак.", es: "Me gustan los perros." } }
          - { level: A1, use: { en: uncountable nouns in general, uk: "незлічувані іменники загалом", es: "sustantivos incontables en general" }, ex: { examples: [[{ target: Life }, " is hard."], ["I love ", { target: music }, "."]] }, tr: { uk: { examples: ["Життя важке.", "Я люблю музику."] }, es: { examples: ["La vida es dura.", "Me encanta la música."] } } }
          - { level: A1, use: { en: meals, uk: "прийоми їжі", es: "comidas" }, ex: ["We have ", { target: lunch }, " at two."], tr: { uk: "Ми обідаємо о другій.", es: "Almorzamos a las dos." } }
          - { level: A1, use: { en: "languages, school subjects, sports", uk: "мови, шкільні предмети, види спорту", es: "idiomas, asignaturas, deportes" }, ex: { examples: [["I speak ", { target: Spanish }, "."], ["I play ", { target: football }, "."]] }, tr: { uk: { examples: ["Я розмовляю іспанською.", "Я граю у футбол."] }, es: { examples: ["Hablo español.", "Juego al fútbol."] } } }
