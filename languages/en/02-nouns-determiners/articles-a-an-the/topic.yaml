          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, word: a, before: { en: consonant sound, uk: "приголосний звук", es: "sonido consonántico", pt: "som consonantal", fr: "son consonantique", de: "Konsonantlaut", it: "suono consonantico", pl: "dźwięk spółgłoskowy", tr: "ünsüz ses", id: "bunyi konsonan", vi: "âm phụ âm" }, sound: { ipa: ə }, ex: { ex: ["a book ", { ipa: ə ˈbʊk }], tr: { uk: "книжка", es: "un libro", pt: "um livro", fr: "un livre", de: "ein Buch", it: "un libro", pl: "książka", tr: "bir kitap", id: "sebuah buku", vi: "một cuốn sách" } } }
          - { level: A1, word: an, before: { en: vowel sound, uk: "голосний звук", es: "sonido vocálico", pt: "som vocálico", fr: "son vocalique", de: "Vokallaut", it: "suono vocalico", pl: "dźwięk samogłoskowy", tr: "ünlü ses", id: "bunyi vokal", vi: "âm nguyên âm" }, sound: { ipa: ən }, ex: { ex: ["an egg ", { ipa: ən ˈeɡ }], tr: { uk: "яйце", es: "un huevo", pt: "um ovo", fr: "un œuf", de: "ein Ei", it: "un uovo", pl: "jajko", tr: "bir yumurta", id: "sebutir telur", vi: "một quả trứng" } } }
