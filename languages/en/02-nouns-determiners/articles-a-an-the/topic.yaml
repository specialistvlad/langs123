          - { key: before, label: { en: Before, uk: "Перед", es: "Antes de", pt: "Antes de", fr: "Devant", de: "Vor", it: "Davanti a", pl: "Przed", tr: "Önünde", id: "Sebelum", vi: "Trước" } }
