sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: [{ alternatives: [{ term: a }, { term: an }] }, " go only with singular countable nouns. See ", { link: Countable and uncountable, to: en.nouns-determiners.countable-uncountable }, "."]
              uk: [{ alternatives: [{ term: a }, { term: an }] }, " вживаються лише зі злічуваними іменниками в однині. Див. ", { link: "Злічувані та незлічувані іменники", to: en.nouns-determiners.countable-uncountable }, "."]
              es: [{ alternatives: [{ term: a }, { term: an }] }, " solo se usan con sustantivos contables en singular. Ver ", { link: "Sustantivos contables e incontables", to: en.nouns-determiners.countable-uncountable }, "."]
              pt: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " só se usam com substantivos contáveis no singular. Ver ", { link: "Substantivos contáveis e incontáveis", to: "en.nouns-determiners.countable-uncountable" }, "."]
              fr: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " s’emploient seulement avec les noms dénombrables au singulier. Voir ", { link: "Noms dénombrables et indénombrables", to: "en.nouns-determiners.countable-uncountable" }, "."]
              de: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " stehen nur bei zählbaren Nomen im Singular. Siehe ", { link: "Zählbare und unzählbare Nomen", to: "en.nouns-determiners.countable-uncountable" }, "."]
              it: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " si usano solo con sostantivi numerabili singolari. Vedi ", { link: "Sostantivi numerabili e non numerabili", to: "en.nouns-determiners.countable-uncountable" }, "."]
              pl: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " występują tylko z rzeczownikami policzalnymi w liczbie pojedynczej. Zob. ", { link: "Rzeczowniki policzalne i niepoliczalne", to: "en.nouns-determiners.countable-uncountable" }, "."]
              tr: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " yalnızca tekil sayılabilir isimlerle kullanılır. Bkz. ", { link: "Sayılabilir ve sayılamayan isimler", to: "en.nouns-determiners.countable-uncountable" }, "."]
              id: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " hanya dipakai dengan kata benda terhitung tunggal. Lihat ", { link: "Kata benda terhitung dan tak terhitung", to: "en.nouns-determiners.countable-uncountable" }, "."]
              vi: [{ alternatives: [{ term: "a" }, { term: "an" }] }, " chỉ đi với danh từ đếm được số ít. Xem ", { link: "Danh từ đếm được và không đếm được", to: "en.nouns-determiners.countable-uncountable" }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: the }, " goes with all nouns: singular, plural and uncountable."]
              uk: [{ term: the }, " вживається з усіма іменниками: в однині, у множині й незлічуваними."]
              es: [{ term: the }, " va con todos los sustantivos: singulares, plurales e incontables."]
              pt: [{ term: "the" }, " vai com todos os substantivos: singulares, plurais e incontáveis."]
              fr: [{ term: "the" }, " s’emploie avec tous les noms : singuliers, pluriels et indénombrables."]
              de: [{ term: "the" }, " steht bei allen Nomen: im Singular, im Plural und bei unzählbaren."]
              it: [{ term: "the" }, " si usa con tutti i sostantivi: singolari, plurali e non numerabili."]
              pl: [{ term: "the" }, " łączy się ze wszystkimi rzeczownikami: w liczbie pojedynczej, mnogiej i niepoliczalnymi."]
              tr: [{ term: "the" }, " tüm isimlerle kullanılır: tekil, çoğul ve sayılamayan."]
              id: [{ term: "the" }, " dipakai dengan semua kata benda: tunggal, jamak, dan tak terhitung."]
              vi: [{ term: "the" }, " đi với mọi danh từ: số ít, số nhiều và không đếm được."]

  - title: { en: "Form: a or an", uk: "Форма: a чи an", es: "Forma: a o an", pt: "Forma: a ou an", fr: "Forme : a ou an", de: "Form: a oder an", it: "Forma: a o an", pl: "Forma: a czy an", tr: "Biçim: a ya da an", id: "Bentuk: a atau an", vi: "Dạng: a hay an" }
    role: form
    content:
      - type: usage
        columns:
          - { key: before, label: { en: Next word starts with, uk: "Наступне слово починається з", es: "La palabra siguiente empieza con", pt: "A palavra seguinte começa com", fr: "Le mot suivant commence par", de: "Das nächste Wort beginnt mit", it: "La parola seguente inizia con", pl: "Następne słowo zaczyna się od", tr: "Sonraki sözcük şununla başlar", id: "Kata berikutnya diawali", vi: "Từ tiếp theo bắt đầu bằng" } }
          - { key: article, label: { en: Article, uk: "Артикль", es: "Artículo", pt: "Artigo", fr: "Article", de: "Artikel", it: "Articolo", pl: "Przedimek", tr: "Artikel", id: "Artikel", vi: "Mạo từ" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, before: { en: a consonant sound, uk: "приголосного звука", es: "un sonido consonántico", pt: "um som consonantal", fr: "un son consonantique", de: "einem Konsonantlaut", it: "un suono consonantico", pl: "dźwięku spółgłoskowego", tr: "ünsüz sesle", id: "bunyi konsonan", vi: "âm phụ âm" }, article: a, ex: { examples: [[{ target: a }, " book"], [{ target: a }, " big apple"]] }, tr: { uk: { examples: ["книжка", "велике яблуко"] }, es: { examples: ["un libro", "una manzana grande"] }, pt: { examples: ["um livro", "uma maçã grande"] }, fr: { examples: ["un livre", "une grosse pomme"] }, de: { examples: ["ein Buch", "ein großer Apfel"] }, it: { examples: ["un libro", "una mela grande"] }, pl: { examples: ["książka", "duże jabłko"] }, tr: { examples: ["bir kitap", "büyük bir elma"] }, id: { examples: ["sebuah buku", "sebuah apel besar"] }, vi: { examples: ["một cuốn sách", "một quả táo to"] } } }
          - { level: A1, before: { en: a vowel sound, uk: "голосного звука", es: "un sonido vocálico", pt: "um som vocálico", fr: "un son vocalique", de: "einem Vokallaut", it: "un suono vocalico", pl: "dźwięku samogłoskowego", tr: "ünlü sesle", id: "bunyi vokal", vi: "âm nguyên âm" }, article: an, ex: { examples: [[{ target: an }, " apple"], [{ target: an }, " old book"]] }, tr: { uk: { examples: ["яблуко", "стара книжка"] }, es: { examples: ["una manzana", "un libro viejo"] }, pt: { examples: ["uma maçã", "um livro velho"] }, fr: { examples: ["une pomme", "un vieux livre"] }, de: { examples: ["ein Apfel", "ein altes Buch"] }, it: { examples: ["una mela", "un vecchio libro"] }, pl: { examples: ["jabłko", "stara książka"] }, tr: { examples: ["bir elma", "eski bir kitap"] }, id: { examples: ["sebuah apel", "sebuah buku tua"] }, vi: { examples: ["một quả táo", "một cuốn sách cũ"] } } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The first sound decides, not the letter: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
              uk: ["Вирішує перший звук, а не літера: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
              es: ["Decide el primer sonido, no la letra: ", { term: an }, " ", { term: hour }, " ", { ipa: ˈaʊə }, ", ", { term: a }, " ", { term: university }, " ", { ipa: juːnɪˈvɜːsəti }, "."]
              pt: ["O primeiro som decide, não a letra: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              fr: ["Le premier son décide, pas la lettre : ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              de: ["Der erste Laut entscheidet, nicht der Buchstabe: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              it: ["Decide il primo suono, non la lettera: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              pl: ["Decyduje pierwszy dźwięk, a nie litera: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              tr: ["Belirleyici olan harf değil, ilk sestir: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              id: ["Bunyi pertama yang menentukan, bukan hurufnya: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
              vi: ["Âm đầu quyết định, không phải chữ cái: ", { term: "an" }, " ", { term: "hour" }, " ", { ipa: "ˈaʊə" }, ", ", { term: "a" }, " ", { term: "university" }, " ", { ipa: "juːnɪˈvɜːsəti" }, "."]
          - type: rule
            level: A1
            text:
