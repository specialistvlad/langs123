    fr: ["Le premier son décide entre ", { term: "a" }, " et ", { term: "an" }, " (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, ") ; les pluriels généraux et les noms indénombrables n’ont pas d’article :"]
    de: ["Der erste Laut entscheidet zwischen ", { term: "a" }, " und ", { term: "an" }, " (", { term: "an" }, " ", { term: "hour" }, ", ", { term: "a" }, " ", { term: "university" }, "); allgemeine Plurale und unzählbare Nomen haben keinen Artikel:"]
