title: { en: Plurals, uk: Множина іменників, es: El plural, pt: "O plural", fr: "Le pluriel", de: "Plural", it: "Il plurale", pl: "Liczba mnoga", tr: "Tekil ve çoğul", id: "Bentuk jamak", vi: "Danh từ số nhiều" }
summary:
  lead:
    en: ["Most nouns add -s (", { term: books }, "), nouns ending in s, sh, ch or x add -es, and ", { pattern: [{ slot: consonant }, "y"] }, " becomes -ies."]
    uk: ["Більшість іменників додають -s (", { term: books }, "), іменники на s, sh, ch або x додають -es, а ", { pattern: [{ slot: consonant }, "y"] }, " перетворюється на -ies."]
    es: ["La mayoría de los sustantivos añaden -s (", { term: books }, "), los terminados en s, sh, ch o x añaden -es, y ", { pattern: [{ slot: consonant }, "y"] }, " pasa a -ies."]
    pt: ["A maioria dos substantivos recebe -s (", { term: "books" }, "), os terminados em s, sh, ch ou x recebem -es, e ", { pattern: [{ slot: "consonant" }, "y"] }, " passa a -ies."]
    fr: ["La plupart des noms prennent -s (", { term: "books" }, "), ceux en s, sh, ch ou x prennent -es, et ", { pattern: [{ slot: "consonant" }, "y"] }, " devient -ies."]
    de: ["Die meisten Nomen hängen -s an (", { term: "books" }, "), Nomen auf s, sh, ch oder x hängen -es an, und ", { pattern: [{ slot: "consonant" }, "y"] }, " wird zu -ies."]
    it: ["La maggior parte dei sostantivi aggiunge -s (", { term: "books" }, "), i sostantivi che finiscono in s, sh, ch o x aggiungono -es, e ", { pattern: [{ slot: "consonant" }, "y"] }, " diventa -ies."]
    pl: ["Większość rzeczowników dodaje -s (", { term: "books" }, "), rzeczowniki zakończone na s, sh, ch lub x dodają -es, a ", { pattern: [{ slot: "consonant" }, "y"] }, " zmienia się w -ies."]
    tr: ["Çoğu isim -s alır (", { term: "books" }, "), s, sh, ch ya da x ile biten isimler -es alır, ", { pattern: [{ slot: "consonant" }, "y"] }, " ise -ies olur."]
    id: ["Sebagian besar kata benda menambahkan -s (", { term: "books" }, "), kata benda yang berakhir dengan s, sh, ch, atau x menambahkan -es, dan ", { pattern: [{ slot: "consonant" }, "y"] }, " berubah menjadi -ies."]
    vi: ["Hầu hết danh từ thêm -s (", { term: "books" }, "), danh từ tận cùng bằng s, sh, ch, x thêm -es, và ", { pattern: [{ slot: "consonant" }, "y"] }, " thành -ies."]
  rule:
    en: ["Irregular plurals take no -s and ", { term: people }, " takes a plural verb:"]
    uk: ["Неправильні форми множини не мають -s, а ", { term: people }, " вживається з дієсловом у множині:"]
    es: ["Los plurales irregulares no llevan -s y ", { term: people }, " lleva el verbo en plural:"]
    pt: ["Os plurais irregulares não levam -s e ", { term: "people" }, " leva o verbo no plural:"]
    fr: ["Les pluriels irréguliers ne prennent pas -s et ", { term: "people" }, " se construit avec un verbe au pluriel :"]
    de: ["Unregelmäßige Plurale haben kein -s, und ", { term: "people" }, " steht mit einem Verb im Plural:"]
    it: ["I plurali irregolari non prendono -s e ", { term: "people" }, " vuole il verbo al plurale:"]
    pl: ["Nieregularne formy liczby mnogiej nie mają -s, a ", { term: "people" }, " łączy się z czasownikiem w liczbie mnogiej:"]
    tr: ["Düzensiz çoğullar -s almaz; ", { term: "people" }, " ise çoğul fiille kullanılır:"]
    id: ["Bentuk jamak tidak beraturan tidak memakai -s dan ", { term: "people" }, " diikuti kata kerja jamak:"]
    vi: ["Số nhiều bất quy tắc không có -s và ", { term: "people" }, " đi với động từ số nhiều:"]
  ex: { examples: [["three ", { target: children }], ["The ", { target: people are }, " nice."]] }

