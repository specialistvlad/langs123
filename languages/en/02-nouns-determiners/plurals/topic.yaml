        - { level: B2, point: { en: "Names, days, letters", uk: "Імена, дні, літери", es: "Nombres, días, letras", pt: "Nomes, dias, letras", fr: "Noms, jours, lettres", de: "Namen, Tage, Buchstaben", it: "Nomi, giorni, lettere", pl: "Imiona i nazwiska, dni, litery", tr: "Adlar, günler, harfler", id: "Nama, hari, huruf", vi: "Tên, thứ trong tuần, chữ cái" }, rule: { en: "add -s to names, days, abbreviations and decades", uk: "до імен, днів, абревіатур і десятиліть додається -s", es: "se añade -s a nombres, días, siglas y décadas", pt: "acrescenta-se -s a nomes, dias, siglas e décadas", fr: "on ajoute -s aux noms, aux jours, aux sigles et aux décennies", de: "an Namen, Tage, Abkürzungen und Jahrzehnte wird -s angehängt", it: "si aggiunge -s a nomi, giorni, sigle e decenni", pl: "do imion, nazwisk, dni, skrótów i dekad dodaje się -s", tr: "adlara, günlere, kısaltmalara ve on yıllara -s eklenir", id: "-s ditambahkan pada nama, hari, singkatan, dan dasawarsa", vi: "thêm -s vào tên, thứ, từ viết tắt và các thập niên" }, ex: { examples: [["the ", { target: Smiths }], { target: MPs }, ["the ", { target: 1990s }]] }, tr: { uk: { examples: ["родина Смітів", "депутати", "1990-ті"] }, es: { examples: ["los Smith", "diputados", "los años noventa"] }, pt: { examples: ["os Smith", "deputados", "os anos 1990"] }, fr: { examples: ["les Smith", "députés", "les années 1990"] }, de: { examples: ["die Smiths", "Abgeordnete", "die Neunzigerjahre"] }, it: { examples: ["i Smith", "deputati", "gli anni Novanta"] }, pl: { examples: ["państwo Smithowie", "posłowie", "lata dziewięćdziesiąte"] }, tr: { examples: ["Smith ailesi", "milletvekilleri", "1990’lar"] }, id: { examples: ["keluarga Smith", "anggota parlemen", "tahun 1990-an"] }, vi: { examples: ["gia đình Smith", "các nghị sĩ", "những năm 1990"] } } }
        - { level: A0, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: people }, " takes a plural verb"], uk: [{ term: people }, " вживається з дієсловом у множині"], es: [{ term: people }, " lleva el verbo en plural"], pt: [{ term: "people" }, " leva o verbo no plural"], fr: [{ term: "people" }, " se construit avec un verbe au pluriel"], de: [{ term: "people" }, " steht mit einem Verb im Plural"], it: [{ term: "people" }, " vuole il verbo al plurale"], pl: [{ term: "people" }, " łączy się z czasownikiem w liczbie mnogiej"], tr: [{ term: "people" }, " çoğul fiille kullanılır"], id: [{ term: "people" }, " diikuti kata kerja jamak"], vi: [{ term: "people" }, " đi với động từ số nhiều"] }, ex: ["The people ", { target: are }, " nice."], tr: { uk: "Ці люди приємні.", es: "La gente es amable.", pt: "As pessoas são simpáticas.", fr: "Les gens sont gentils.", de: "Die Leute sind nett.", it: "Le persone sono gentili.", pl: "Ludzie są mili.", tr: "İnsanlar nazik.", id: "Orang-orang itu ramah.", vi: "Những người đó rất tốt bụng." } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }, rule: { en: [{ term: sheep }, " and ", { term: fish }, " keep one form"], uk: [{ term: sheep }, " і ", { term: fish }, " не змінюють форму"], es: [{ term: sheep }, " y ", { term: fish }, " conservan una sola forma"], pt: [{ term: "sheep" }, " e ", { term: "fish" }, " mantêm uma só forma"], fr: [{ term: "sheep" }, " et ", { term: "fish" }, " gardent une seule forme"], de: [{ term: "sheep" }, " und ", { term: "fish" }, " behalten eine Form"], it: [{ term: "sheep" }, " e ", { term: "fish" }, " hanno una sola forma"], pl: [{ term: "sheep" }, " i ", { term: "fish" }, " mają jedną formę"], tr: [{ term: "sheep" }, " ve ", { term: "fish" }, " aynı biçimde kalır"], id: [{ term: "sheep" }, " dan ", { term: "fish" }, " tetap memakai satu bentuk"], vi: [{ term: "sheep" }, " và ", { term: "fish" }, " giữ nguyên một dạng"] }, ex: ["two ", { target: sheep }], tr: { uk: "дві вівці", es: "dos ovejas", pt: "duas ovelhas", fr: "deux moutons", de: "zwei Schafe", it: "due pecore", pl: "dwie owce", tr: "iki koyun", id: "dua domba", vi: "hai con cừu" } }

sections:

  - title: { en: "Form: regular plurals", uk: "Форма: правильна множина", es: "Forma: plurales regulares", pt: "Forma: plurais regulares", fr: "Forme : pluriels réguliers", de: "Form: regelmäßige Plurale", it: "Forma: plurali regolari", pl: "Forma: regularna liczba mnoga", tr: "Biçim: düzenli çoğullar", id: "Bentuk: jamak beraturan", vi: "Dạng: danh từ số nhiều có quy tắc" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: singular, label: { en: Singular, uk: "Однина", es: "Singular", pt: "Singular", fr: "Singulier", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }, features: { number: sg } }
          - { key: plural, label: { en: Plural, uk: "Множина", es: "Plural", pt: "Plural", fr: "Pluriel", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }, features: { number: pl } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, singular: a book, plural: [two book, { ending: s }], ex: ["I have two ", { target: books }, "."] }
          - { level: A0, singular: a car, plural: [three car, { ending: s }], ex: ["There are three ", { target: cars }, " here."] }
          - { level: A0, singular: an apple, plural: [apple, { ending: s }], ex: ["I like ", { target: apples }, "."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Most nouns add ", { term: "-s" }, " in the plural."]
              uk: ["Більшість іменників у множині додають ", { term: "-s" }, "."]
              es: ["La mayoría de los sustantivos añaden ", { term: "-s" }, " en el plural."]
              pt: ["A maioria dos substantivos recebe ", { term: "-s" }, " no plural."]
              fr: ["La plupart des noms prennent ", { term: "-s" }, " au pluriel."]
              de: ["Die meisten Nomen hängen im Plural ", { term: "-s" }, " an."]
              it: ["La maggior parte dei sostantivi aggiunge ", { term: "-s" }, " al plurale."]
              pl: ["Większość rzeczowników dodaje ", { term: "-s" }, " w liczbie mnogiej."]
              tr: ["Çoğu isim çoğulda ", { term: "-s" }, " alır."]
              id: ["Sebagian besar kata benda menambahkan ", { term: "-s" }, " pada bentuk jamak."]
              vi: ["Hầu hết danh từ thêm ", { term: "-s" }, " ở số nhiều."]
          - type: rule
            level: A0
            text:
              en: ["Adjectives stay the same: ", { mapping: [{ term: a red car }, { term: two red cars }] }, "."]
              uk: ["Прикметники не змінюються: ", { mapping: [{ term: a red car }, { term: two red cars }] }, "."]
              es: ["Los adjetivos no cambian: ", { mapping: [{ term: a red car }, { term: two red cars }] }, "."]
              pt: ["Os adjetivos não mudam: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              fr: ["Les adjectifs restent invariables : ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              de: ["Adjektive bleiben gleich: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              it: ["Gli aggettivi non cambiano: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              pl: ["Przymiotniki się nie zmieniają: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              tr: ["Sıfatlar değişmez: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              id: ["Kata sifat tidak berubah: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
              vi: ["Tính từ không thay đổi: ", { mapping: [{ term: "a red car" }, { term: "two red cars" }] }, "."]
          - type: rule
            level: A0
            text:
              en: "A plural subject takes a plural verb:"
              uk: "Підмет у множині вживається з дієсловом у множині:"
              es: "Un sujeto en plural lleva el verbo en plural:"
              pt: "Um sujeito no plural leva o verbo no plural:"
              fr: "Un sujet au pluriel prend un verbe au pluriel :"
              de: "Ein Subjekt im Plural steht mit einem Verb im Plural:"
              it: "Un soggetto plurale vuole il verbo al plurale:"
              pl: "Podmiot w liczbie mnogiej łączy się z czasownikiem w liczbie mnogiej:"
              tr: "Çoğul özne çoğul fiil alır:"
              id: "Subjek jamak diikuti kata kerja jamak:"
              vi: "Chủ ngữ số nhiều đi với động từ số nhiều:"
            ex: ["The books ", { target: are }, " new."]
            tr: { uk: "Книги нові.", es: "Los libros son nuevos.", pt: "Os livros são novos.", fr: "Les livres sont neufs.", de: "Die Bücher sind neu.", it: "I libri sono nuovi.", pl: "Książki są nowe.", tr: "Kitaplar yeni.", id: "Buku-buku itu baru.", vi: "Những quyển sách đó còn mới." }
          - type: note
            level: A0
            text:
              en: ["Uncountable nouns have no plural: see ", { link: Countable and uncountable nouns, to: en.nouns-determiners.countable-uncountable }, "."]
              uk: ["Незлічувані іменники не мають множини: див. ", { link: "Злічувані та незлічувані іменники", to: en.nouns-determiners.countable-uncountable }, "."]
              es: ["Los sustantivos incontables no tienen plural: ver ", { link: "Sustantivos contables e incontables", to: en.nouns-determiners.countable-uncountable }, "."]
              pt: ["Substantivos incontáveis não têm plural: ver ", { link: "Substantivos contáveis e incontáveis", to: "en.nouns-determiners.countable-uncountable" }, "."]
              fr: ["Les noms indénombrables n’ont pas de pluriel : voir ", { link: "Noms dénombrables et indénombrables", to: "en.nouns-determiners.countable-uncountable" }, "."]
              de: ["Unzählbare Nomen haben keinen Plural: siehe ", { link: "Zählbare und unzählbare Nomen", to: "en.nouns-determiners.countable-uncountable" }, "."]
              it: ["I sostantivi non numerabili non hanno il plurale: vedi ", { link: "Sostantivi numerabili e non numerabili", to: "en.nouns-determiners.countable-uncountable" }, "."]
              pl: ["Rzeczowniki niepoliczalne nie mają liczby mnogiej: zob. ", { link: "Rzeczowniki policzalne i niepoliczalne", to: "en.nouns-determiners.countable-uncountable" }, "."]
              tr: ["Sayılamayan isimlerin çoğulu yoktur: bkz. ", { link: "Sayılabilir ve sayılamayan isimler", to: "en.nouns-determiners.countable-uncountable" }, "."]
              id: ["Kata benda tak terhitung tidak memiliki bentuk jamak: lihat ", { link: "Kata benda terhitung dan tak terhitung", to: "en.nouns-determiners.countable-uncountable" }, "."]
              vi: ["Danh từ không đếm được không có số nhiều: xem ", { link: "Danh từ đếm được và không đếm được", to: "en.nouns-determiners.countable-uncountable" }, "."]

  - title: { en: "Spelling: -s and -es", uk: "Правопис: -s і -es", es: "Ortografía: -s y -es", pt: "Ortografia: -s e -es", fr: "Orthographe : -s et -es", de: "Schreibweise: -s und -es", it: "Ortografia: -s e -es", pl: "Pisownia: -s i -es", tr: "Yazım: -s ve -es", id: "Ejaan: -s dan -es", vi: "Chính tả: -s và -es" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: ending, label: { en: Noun ending, uk: "Закінчення іменника", es: "Terminación del sustantivo", pt: "Terminação do substantivo", fr: "Terminaison du nom", de: "Endung des Nomens", it: "Desinenza del sostantivo", pl: "Końcówka rzeczownika", tr: "İsmin sonu", id: "Akhiran kata benda", vi: "Đuôi danh từ" } }
          - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { en: Examples, uk: "Приклади", es: "Ejemplos", pt: "Exemplos", fr: "Exemples", de: "Beispiele", it: "Esempi", pl: "Przykłady", tr: "Örnekler", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, ending: { en: most nouns, uk: "більшість іменників", es: "la mayoría de los sustantivos", pt: "a maioria dos substantivos", fr: "la plupart des noms", de: "die meisten Nomen", it: "la maggior parte dei sostantivi", pl: "większość rzeczowników", tr: "çoğu isim", id: "sebagian besar kata benda", vi: "hầu hết danh từ" }, rule: { pattern: [{ ending: s }], follows: true }, ex: { examples: [{ mapping: [book, books] }, { mapping: [day, days] }] }, tr: { uk: { examples: ["книги", "дні"] }, es: { examples: ["libros", "días"] }, pt: { examples: ["livros", "dias"] }, fr: { examples: ["livres", "jours"] }, de: { examples: ["Bücher", "Tage"] }, it: { examples: ["libri", "giorni"] }, pl: { examples: ["książki", "dni"] }, tr: { examples: ["kitaplar", "günler"] }, id: { examples: ["buku-buku", "hari-hari"] }, vi: { examples: ["những quyển sách", "những ngày"] } } }
          - { level: A0, ending: "-s, -ss, -sh, -ch, -x, -z", rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [bus, buses] }, { mapping: [glass, glasses] }, { mapping: [dish, dishes] }, { mapping: [watch, watches] }, { mapping: [box, boxes] }] }, tr: { uk: { examples: ["автобуси", "склянки", "тарілки", "годинники", "коробки"] }, es: { examples: ["autobuses", "vasos", "platos", "relojes", "cajas"] }, pt: { examples: ["ônibus", "copos", "pratos", "relógios", "caixas"] }, fr: { examples: ["bus", "verres", "assiettes", "montres", "boîtes"] }, de: { examples: ["Busse", "Gläser", "Teller", "Uhren", "Kisten"] }, it: { examples: ["autobus", "bicchieri", "piatti", "orologi", "scatole"] }, pl: { examples: ["autobusy", "szklanki", "talerze", "zegarki", "pudełka"] }, tr: { examples: ["otobüsler", "bardaklar", "tabaklar", "kol saatleri", "kutular"] }, id: { examples: ["bus-bus", "gelas-gelas", "piring-piring", "arloji-arloji", "kotak-kotak"] }, vi: { examples: ["những chiếc xe buýt", "những chiếc ly", "những cái đĩa", "những chiếc đồng hồ", "những cái hộp"] } } }
