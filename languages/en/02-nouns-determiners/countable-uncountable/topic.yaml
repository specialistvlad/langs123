  - title: { en: Collective nouns }
    role: own
    content:
      - type: usage
        columns:
          - { key: noun, label: { en: Noun } }
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - level: B2
            noun: "team, family, government, committee, staff"
            verb: { en: "singular for the group, plural for its members" }
            ex: { contrast: [["The team ", { target: is }, " winning."], ["The team ", { target: are }, " arguing."]] }
          - level: B2
            noun: "police, people, cattle"
            verb: { en: always plural }
            ex: ["The police ", { target: are }, " here."]
      - type: list
        items:
          - type: note
            level: B2
            variety: en-US
            text: { en: "A collective noun takes a singular verb:" }
            ex: ["The team ", { target: is }, " arguing about the plan."]

