        - { level: A1, point: { en: Uncountable, uk: "Незлічувані", es: "Incontables", pt: "Incontáveis", fr: "Indénombrables", de: "Unzählbar", it: "Non numerabili", pl: "Niepoliczalne", tr: "Sayılamayan", id: "Tak terhitung", vi: "Không đếm được" }, rule: { en: ["masses, materials, ideas: no ", { alternatives: [{ term: a }, { term: an }] }, ", no plural"], uk: ["речовини, матеріали, ідеї: без ", { alternatives: [{ term: a }, { term: an }] }, ", без множини"], es: ["sustancias, materiales, ideas: sin ", { alternatives: [{ term: a }, { term: an }] }, ", sin plural"], pt: ["substâncias, materiais, ideias: sem ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", sem plural"], fr: ["masses, matières, idées : pas de ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", pas de pluriel"], de: ["Stoffe, Materialien, Ideen: kein ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", kein Plural"], it: ["sostanze, materiali, idee: senza ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", senza plurale"], pl: ["substancje, materiały, idee: bez ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", bez liczby mnogiej"], tr: ["maddeler, malzemeler, kavramlar: ", { alternatives: [{ term: "a" }, { term: "an" }] }, " almaz, çoğul olmaz"], id: ["zat, bahan, gagasan: tanpa ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", tanpa jamak"], vi: ["chất liệu, vật liệu, khái niệm: không có ", { alternatives: [{ term: "a" }, { term: "an" }] }, ", không có số nhiều"] }, ex: ["I like ", { target: music }, "."], tr: { uk: "Я люблю музику.", es: "Me gusta la música.", pt: "Eu gosto de música.", fr: "J’aime la musique.", de: "Ich mag Musik.", it: "Mi piace la musica.", pl: "Lubię muzykę.", tr: "Müziği severim.", id: "Saya suka musik.", vi: "Tôi thích âm nhạc." } }
        - { level: A1, point: { en: Verb, uk: "Дієслово", es: "Verbo", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" }, rule: { en: ["a singular verb, also for ", { term: news }], uk: ["дієслово в однині, також після ", { term: news }], es: ["verbo en singular, también con ", { term: news }], pt: ["verbo no singular, também com ", { term: "news" }], fr: ["verbe au singulier, aussi avec ", { term: "news" }], de: ["Verb im Singular, auch bei ", { term: "news" }], it: ["verbo al singolare, anche con ", { term: "news" }], pl: ["czasownik w liczbie pojedynczej, także po ", { term: "news" }], tr: ["tekil fiil, ", { term: "news" }, " için de"], id: ["kata kerja tunggal, juga untuk ", { term: "news" }], vi: ["động từ số ít, kể cả với ", { term: "news" }] }, ex: { examples: [["The water ", { target: is }, " cold."], ["The news ", { target: is }, " good."]] }, tr: { uk: { examples: ["Вода холодна.", "Новини хороші."] }, es: { examples: ["El agua está fría.", "Las noticias son buenas."] }, pt: { examples: ["A água está fria.", "As notícias são boas."] }, fr: { examples: ["L’eau est froide.", "Les nouvelles sont bonnes."] }, de: { examples: ["Das Wasser ist kalt.", "Die Nachrichten sind gut."] }, it: { examples: ["L'acqua è fredda.", "Le notizie sono buone."] }, pl: { examples: ["Woda jest zimna.", "Wiadomości są dobre."] }, tr: { examples: ["Su soğuk.", "Haberler iyi."] }, id: { examples: ["Airnya dingin.", "Beritanya bagus."] }, vi: { examples: ["Nước lạnh.", "Tin tức này tốt."] } } }
        - { level: A1, point: { en: Unit, uk: "Одиниця", es: "Unidad", pt: "Unidade", fr: "Unité", de: "Einheit", it: "Unità", pl: "Jednostka", tr: "Birim", id: "Satuan", vi: "Đơn vị" }, rule: { en: "count it with a unit; the unit takes the plural", uk: "лічіть за допомогою одиниці; одиниця стоїть у множині", es: "se cuenta con una unidad; la unidad va en plural", pt: "conta-se com uma unidade; a unidade fica no plural", fr: "se compte avec une unité ; l’unité se met au pluriel", de: "wird mit einer Einheit gezählt; die Einheit steht im Plural", it: "si conta con un'unità; l'unità va al plurale", pl: "liczy się za pomocą jednostki; jednostka stoi w liczbie mnogiej", tr: "bir birimle sayılır; birim çoğul alır", id: "dihitung dengan satuan; satuannya memakai bentuk jamak", vi: "đếm bằng một đơn vị; đơn vị ở số nhiều" }, ex: { examples: [["a ", { target: glass of }, " water"], ["a ", { target: piece of }, " advice"], ["two ", { target: cups of }, " coffee"]] }, tr: { uk: { examples: ["склянка води", "порада", "дві чашки кави"] }, es: { examples: ["un vaso de agua", "un consejo", "dos tazas de café"] }, pt: { examples: ["um copo de água", "um conselho", "duas xícaras de café"] }, fr: { examples: ["un verre d’eau", "un conseil", "deux tasses de café"] }, de: { examples: ["ein Glas Wasser", "ein Ratschlag", "zwei Tassen Kaffee"] }, it: { examples: ["un bicchiere d'acqua", "un consiglio", "due tazze di caffè"] }, pl: { examples: ["szklanka wody", "rada", "dwie filiżanki kawy"] }, tr: { examples: ["bir bardak su", "bir tavsiye", "iki fincan kahve"] }, id: { examples: ["segelas air", "satu nasihat", "dua cangkir kopi"] }, vi: { examples: ["một ly nước", "một lời khuyên", "hai tách cà phê"] } } }
        - { level: A2, point: { en: Groups of things, uk: "Групи предметів", es: "Grupos de cosas", pt: "Grupos de coisas", fr: "Groupes de choses", de: "Gruppen von Dingen", it: "Gruppi di cose", pl: "Grupy rzeczy", tr: "Nesne grupları", id: "Kelompok benda", vi: "Nhóm đồ vật" }, rule: { en: "groups of things are uncountable too", uk: "групи предметів теж незлічувані", es: "los grupos de cosas también son incontables", pt: "grupos de coisas também são incontáveis", fr: "les groupes de choses sont aussi indénombrables", de: "Gruppen von Dingen sind ebenfalls unzählbar", it: "anche i gruppi di cose sono non numerabili", pl: "grupy rzeczy też są niepoliczalne", tr: "nesne grupları da sayılamayan isimlerdir", id: "kelompok benda juga tak terhitung", vi: "nhóm đồ vật cũng không đếm được" }, ex: { examples: [{ target: furniture }, { target: luggage }, { target: homework }] }, tr: { uk: { examples: ["меблі", "багаж", "домашнє завдання"] }, es: { examples: ["el mobiliario", "el equipaje", "la tarea"] }, pt: { examples: ["mobília", "bagagem", "dever de casa"] }, fr: { examples: ["le mobilier", "les bagages", "les devoirs"] }, de: { examples: ["die Möbel", "das Gepäck", "die Hausaufgaben"] }, it: { examples: ["l'arredamento", "il bagaglio", "i compiti"] }, pl: { examples: ["meble", "bagaż", "praca domowa"] }, tr: { examples: ["mobilya", "bagaj", "ev ödevi"] }, id: { examples: ["perabot", "barang bawaan", "pekerjaan rumah"] }, vi: { examples: ["đồ nội thất", "hành lý", "bài tập về nhà"] } } }
