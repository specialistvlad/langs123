id: en.nouns-determiners.countable-uncountable
lang: en
kind: grammar
tags: [nouns, countable, uncountable]
concepts: [countability]
related: [en.nouns-determiners.plurals, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.quantifiers-some-any-much-many]
status: { en: draft, uk: draft, es: draft }
translated: { uk: "3e1627 77a3f9 180ac7 f2d5f2 110c5a 7fcccc 4be17b", es: "3e1627 77a3f9 180ac7 f2d5f2 110c5a 7fcccc 4be17b" }

title: { en: Countable and Uncountable Nouns, uk: Злічувані та незлічувані іменники, es: Sustantivos contables e incontables }
summary:
  lead:
    en: ["Countable nouns are counted one by one (", { term: a book }, ", ", { term: two books }, "); uncountable nouns are masses and ideas (", { term: water }, ", ", { term: advice }, ")."]
    uk: ["Злічувані іменники лічать поштучно (", { term: a book }, ", ", { term: two books }, "); незлічувані називають речовини й ідеї (", { term: water }, ", ", { term: advice }, ")."]
    es: ["Los sustantivos contables se cuentan uno por uno (", { term: a book }, ", ", { term: two books }, "); los incontables nombran sustancias e ideas (", { term: water }, ", ", { term: advice }, ")."]
  rule:
    en: ["Uncountable nouns take no ", { term: a }, " or ", { term: an }, ", no plural and a singular verb:"]
    uk: ["Незлічувані іменники не мають ", { term: a }, " чи ", { term: an }, ", не мають множини й вживаються з дієсловом в однині:"]
    es: ["Los sustantivos incontables no llevan ", { term: a }, " ni ", { term: an }, ", no tienen plural y llevan el verbo en singular:"]
  ex: ["The news ", { target: is }, " good."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, uk: "Аспект", es: "Aspecto" } }
        - { key: rule, label: { en: Rule, uk: "Правило", es: "Regla" } }
        - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
      rows:
        - { level: A1, point: { en: Countable, uk: "Злічувані", es: "Contables" }, rule: { en: [{ alternatives: [{ term: a }, { term: an }] }, " in the singular, -s in the plural"], uk: [{ alternatives: [{ term: a }, { term: an }] }, " в однині, -s у множині"], es: [{ alternatives: [{ term: a }, { term: an }] }, " en singular, -s en plural"] }, ex: { examples: [{ target: a book }, ["two ", { target: books }]] }, tr: { uk: { examples: ["книга", "дві книги"] }, es: { examples: ["un libro", "dos libros"] } } }
        - { level: A1, point: { en: Uncountable, uk: "Незлічувані", es: "Incontables" }, rule: { en: ["masses, materials, ideas: no ", { alternatives: [{ term: a }, { term: an }] }, ", no plural"], uk: ["речовини, матеріали, ідеї: без ", { alternatives: [{ term: a }, { term: an }] }, ", без множини"], es: ["sustancias, materiales, ideas: sin ", { alternatives: [{ term: a }, { term: an }] }, ", sin plural"] }, ex: ["I like ", { target: music }, "."], tr: { uk: "Я люблю музику.", es: "Me gusta la música." } }
        - { level: A1, point: { en: Verb, uk: "Дієслово", es: "Verbo" }, rule: { en: ["a singular verb, also for ", { term: news }], uk: ["дієслово в однині, також після ", { term: news }], es: ["verbo en singular, también con ", { term: news }] }, ex: { examples: [["The water ", { target: is }, " cold."], ["The news ", { target: is }, " good."]] }, tr: { uk: { examples: ["Вода холодна.", "Новини хороші."] }, es: { examples: ["El agua está fría.", "Las noticias son buenas."] } } }
        - { level: A1, point: { en: Unit, uk: "Одиниця", es: "Unidad" }, rule: { en: "count it with a unit; the unit takes the plural", uk: "лічіть за допомогою одиниці; одиниця стоїть у множині", es: "se cuenta con una unidad; la unidad va en plural" }, ex: { examples: [["a ", { target: glass of }, " water"], ["a ", { target: piece of }, " advice"], ["two ", { target: cups of }, " coffee"]] }, tr: { uk: { examples: ["склянка води", "порада", "дві чашки кави"] }, es: { examples: ["un vaso de agua", "un consejo", "dos tazas de café"] } } }
        - { level: A2, point: { en: Groups of things, uk: "Групи предметів", es: "Grupos de cosas" }, rule: { en: "groups of things are uncountable too", uk: "групи предметів теж незлічувані", es: "los grupos de cosas también son incontables" }, ex: { examples: [{ target: furniture }, { target: luggage }, { target: homework }] }, tr: { uk: { examples: ["меблі", "багаж", "домашнє завдання"] }, es: { examples: ["el mobiliario", "el equipaje", "la tarea"] } } }
        - { level: A2, point: { en: Both, uk: "Обидва типи", es: "Ambos tipos" }, rule: { en: "some nouns are both; the meaning changes", uk: "деякі іменники бувають обох типів; значення змінюється", es: "algunos sustantivos son de ambos tipos; el significado cambia" }, ex: { contrast: [["I like ", { target: coffee }, "."], ["Two ", { target: coffees }, ", please."]] }, tr: { uk: { examples: ["Я люблю каву.", "Дві кави, будь ласка."] }, es: { examples: ["Me gusta el café.", "Dos cafés, por favor."] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ term: advice }, " and ", { term: information }, ": ", { term: some }, ", or ", { term: a piece of }], uk: [{ term: advice }, " та ", { term: information }, ": ", { term: some }, " або ", { term: a piece of }], es: [{ term: advice }, " e ", { term: information }, ": ", { term: some }, " o ", { term: a piece of }] }, ex: { alternatives: [{ target: a piece of advice }, { target: some advice }] }, tr: { uk: { examples: ["одна порада", "кілька порад"] }, es: { examples: ["un consejo", "algún consejo"] } } }
        - { level: A1, point: { en: Trap, uk: "Пастка", es: "Trampa" }, rule: { en: [{ term: work }, " is uncountable; ", { term: a job }, " is countable"], uk: [{ term: work }, " — незлічуваний; ", { term: a job }, " — злічуваний"], es: [{ term: work }, " es incontable; ", { term: a job }, " es contable"] }, ex: ["She has a good ", { target: job }, "."], tr: { uk: "У неї хороша робота.", es: "Ella tiene un buen trabajo." } }

sections:
  - title: { en: Overview, uk: "Огляд", es: "Visión general" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A singular countable noun needs a word before it: ", { term: a book }, ", ", { term: the book }, ", ", { term: my book }, "."]
              uk: ["Злічуваний іменник в однині потребує перед собою слова: ", { term: a book }, ", ", { term: the book }, ", ", { term: my book }, "."]
              es: ["Un sustantivo contable en singular necesita una palabra delante: ", { term: a book }, ", ", { term: the book }, ", ", { term: my book }, "."]
          - type: note
            level: A1
            text:
              en: ["Articles: ", { link: "Articles: a, an, the", to: en.nouns-determiners.articles-a-an-the }, ". ", { alternatives: [{ term: How much }, { term: how many }] }, ": ", { link: Quantifiers, to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]
              uk: ["Артиклі: ", { link: "Артиклі: a, an, the", to: en.nouns-determiners.articles-a-an-the }, ". ", { alternatives: [{ term: How much }, { term: how many }] }, ": ", { link: "Кількісні слова: some, any, much, many", to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]
              es: ["Artículos: ", { link: "Artículos: a, an, the", to: en.nouns-determiners.articles-a-an-the }, ". ", { alternatives: [{ term: How much }, { term: how many }] }, ": ", { link: "Cuantificadores: some, any, much, many", to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]

  - title: { en: Common uncountable nouns, uk: "Поширені незлічувані іменники", es: "Sustantivos incontables frecuentes" }
    role: own
    content:
      - type: usage
        columns:
          - { key: group, label: { en: Group, uk: "Група", es: "Grupo" } }
          - { key: nouns, label: { en: Nouns, uk: "Іменники", es: "Sustantivos" } }
        rows:
          - { level: A1, group: { en: Food and drink, uk: "Їжа й напої", es: "Comida y bebida" }, nouns: "water, milk, coffee, tea, bread, rice, cheese, meat, sugar" }
          - { level: A1, group: { en: Materials, uk: "Матеріали", es: "Materiales" }, nouns: "wood, glass, paper, plastic, gold" }
          - { level: A1, group: { en: Ideas and information, uk: "Ідеї та інформація", es: "Ideas e información" }, nouns: "advice, information, news, help, music" }
          - { level: A1, group: { en: Others, uk: "Інше", es: "Otros" }, nouns: "money, weather, work" }
          - { level: A2, group: { en: Groups of things, uk: "Групи предметів", es: "Grupos de cosas" }, nouns: ["furniture, luggage ", { variant: baggage, variety: en-US }, ", equipment, homework, traffic"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: news }, " ends in -s but is uncountable:"]
              uk: [{ term: news }, " закінчується на -s, але є незлічуваним:"]
              es: [{ term: news }, " termina en -s, pero es incontable:"]
            ex: ["The news ", { target: is }, " good."]
            tr: { uk: "Новини хороші.", es: "Las noticias son buenas." }

  - title: { en: Counting uncountable nouns, uk: "Як лічити незлічувані іменники", es: "Cómo contar los sustantivos incontables" }
    role: own
    content:
      - type: usage
        columns:
          - { key: unit, label: { en: Unit, uk: "Одиниця", es: "Unidad" } }
          - { key: ex, label: { en: Example, uk: "Приклад", es: "Ejemplo" } }
        rows:
          - { level: A1, unit: a glass of, ex: ["a ", { target: glass of }, " water"], tr: { uk: "склянка води", es: "un vaso de agua" } }
          - { level: A1, unit: a cup of, ex: ["a ", { target: cup of }, " tea"], tr: { uk: "чашка чаю", es: "una taza de té" } }
          - { level: A1, unit: a bottle of, ex: ["two ", { target: bottles of }, " milk"], tr: { uk: "дві пляшки молока", es: "dos botellas de leche" } }
          - { level: A1, unit: a slice of, ex: ["a ", { target: slice of }, " cheese"], tr: { uk: "шматочок сиру", es: "una rebanada de queso" } }
          - { level: A1, unit: a kilo of, ex: ["a ", { target: kilo of }, " rice"], tr: { uk: "кілограм рису", es: "un kilo de arroz" } }
          - { level: A1, unit: a piece of, ex: { examples: [["a ", { target: piece of }, " cake"], advice, furniture] }, tr: { uk: { examples: ["шматок торта", "порада", "предмет меблів"] }, es: { examples: ["un trozo de pastel", "un consejo", "un mueble"] } } }
          - { level: A2, unit: a loaf of, ex: ["a ", { target: loaf of }, " bread"], tr: { uk: "буханець хліба", es: "una barra de pan" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The unit is countable and takes the plural: ", { term: two cups of coffee }, "."]
              uk: ["Одиниця є злічуваною й стоїть у множині: ", { term: two cups of coffee }, "."]
              es: ["La unidad es contable y va en plural: ", { term: two cups of coffee }, "."]

  - title: { en: Countable and uncountable meanings, uk: "Злічуване й незлічуване значення", es: "Significados contables e incontables" }
    role: own
    content:
      - type: prose
        level: A2
        text:
          en: Some nouns are both. The meaning changes.
          uk: "Деякі іменники бувають і злічуваними, і незлічуваними. Значення змінюється."
          es: "Algunos sustantivos son contables e incontables a la vez. El significado cambia."
      - type: comparison
        columns:
          - { key: uncountable, label: { en: Uncountable, uk: "Незлічуваний", es: "Incontable" }, features: { countability: mass } }
          - { key: countable, label: { en: Countable, uk: "Злічуваний", es: "Contable" }, features: { countability: count } }
        rows:
          - { level: A2, uncountable: { ex: ["I like ", { target: coffee }, "."], tr: { uk: "Я люблю каву.", es: "Me gusta el café." } }, countable: { ex: ["Two ", { target: coffees }, ", please."], tr: { uk: "Дві кави, будь ласка.", es: "Dos cafés, por favor." } } }
          - { level: A2, uncountable: { ex: ["She has long ", { target: hair }, "."], tr: { uk: "У неї довге волосся.", es: "Ella tiene el pelo largo." } }, countable: { ex: ["There's ", { target: a hair }, " in my soup."], tr: { uk: "У моєму супі волосина.", es: "Hay un pelo en mi sopa." } } }
          - { level: A2, uncountable: { ex: ["a sheet of ", { target: paper }], tr: { uk: "аркуш паперу", es: "una hoja de papel" } }, countable: { ex: ["I buy ", { target: a paper }, " every day."], tr: { uk: "Я щодня купую газету.", es: "Compro un periódico todos los días." } } }
          - { level: A2, uncountable: { ex: ["There's no ", { target: room }, " in the car."], tr: { uk: "У машині немає місця.", es: "No hay espacio en el auto." } }, countable: { ex: ["The flat has three ", { target: rooms }, "."], tr: { uk: "У квартирі три кімнати.", es: "El apartamento tiene tres habitaciones." } } }

  - title: { en: Typical errors, uk: "Типові помилки", es: "Errores frecuentes" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: an advice, right: { alternatives: [{ target: a piece of advice }, { target: some advice }] }, rule: { en: ["uncountable: no ", { alternatives: [{ term: a }, { term: an }] }], uk: ["незлічуваний: без ", { alternatives: [{ term: a }, { term: an }] }], es: ["incontable: sin ", { alternatives: [{ term: a }, { term: an }] }] } }
          - { level: A1, wrong: The news are good., right: ["The news ", { target: is }, " good."], rule: { en: { pattern: [{ term: news }, singular verb] }, uk: { pattern: [{ term: news }, "дієслово в однині"] }, es: { pattern: [{ term: news }, "verbo en singular"] } } }
          - { level: A2, wrong: a bread, right: { alternatives: [{ target: a loaf of bread }, { target: some bread }] }, rule: { en: count it with a unit, uk: "лічіть за допомогою одиниці", es: "se cuenta con una unidad" } }
          - { level: A1, wrong: She has a good work., right: ["She has a good ", { target: job }, "."], rule: { en: [{ term: work }, " is uncountable; ", { term: a job }, " is countable"], uk: [{ term: work }, " — незлічуваний, ", { term: a job }, " — злічуваний"], es: [{ term: work }, " es incontable; ", { term: a job }, " es contable"] } }
          - { level: A1, wrong: What a terrible weather!, right: ["What ", { target: terrible weather }, "!"], rule: { en: [{ term: weather }, ": no ", { alternatives: [{ term: a }, { term: an }] }], uk: [{ term: weather }, ": без ", { alternatives: [{ term: a }, { term: an }] }], es: [{ term: weather }, ": sin ", { alternatives: [{ term: a }, { term: an }] }] } }
          - { level: A2, speakers: [uk], wrong: I bought new furnitures., right: ["I bought new ", { target: furniture }, "."], rule: { uk: [{ term: furniture }, " незлічуване й не має множини, хоча українське «меблі» стоїть у множині"] } }
          - { level: A1, speakers: [uk], wrong: The money are on the table., right: ["The money ", { target: is }, " on the table."], rule: { uk: [{ term: money }, " незлічуване й має дієслово в однині, хоча «гроші» в українській — множина"] } }
          - { level: A1, speakers: [uk], wrong: She gave me two advices., right: ["She gave me ", { target: two pieces of advice }, "."], rule: { uk: [{ term: advice }, " не має множини: ", { term: two pieces of advice }, ", хоча українська «порада» злічувана"] } }
          - { level: A1, speakers: [es], wrong: She gave me two advices., right: ["She gave me ", { target: two pieces of advice }, "."], rule: { es: [{ term: advice }, " no tiene plural: ", { term: two pieces of advice }, ", aunque «consejo» es contable en español"] } }
          - { level: A1, speakers: [es], wrong: I need some informations., right: ["I need some ", { target: information }, "."], rule: { es: [{ term: information }, " es incontable y no lleva -s en inglés"] } }
          - { level: A2, speakers: [es], wrong: I lost my luggages., right: ["I lost my ", { target: luggage }, "."], rule: { es: [{ term: luggage }, " es incontable, aunque «equipaje» tiene plural en español"] } }
