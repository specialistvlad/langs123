        - { level: A2, point: { en: Both, uk: "Обидва типи", es: "Ambos tipos", pt: "Os dois tipos", fr: "Les deux", de: "Beides", it: "Entrambi i tipi", pl: "Oba typy", tr: "Her iki tür", id: "Keduanya", vi: "Cả hai loại" }, rule: { en: "some nouns are both; the meaning changes", uk: "деякі іменники бувають обох типів; значення змінюється", es: "algunos sustantivos son de ambos tipos; el significado cambia", pt: "alguns substantivos são dos dois tipos; o significado muda", fr: "certains noms sont des deux types ; le sens change", de: "einige Nomen sind beides; die Bedeutung ändert sich", it: "alcuni sostantivi sono di entrambi i tipi; il significato cambia", pl: "niektóre rzeczowniki należą do obu typów; znaczenie się zmienia", tr: "bazı isimler her iki türdendir; anlam değişir", id: "beberapa kata benda termasuk keduanya; artinya berubah", vi: "một số danh từ thuộc cả hai loại; nghĩa thay đổi" }, ex: { contrast: [["I like ", { target: coffee }, "."], ["Two ", { target: coffees }, ", please."]] }, tr: { uk: { examples: ["Я люблю каву.", "Дві кави, будь ласка."] }, es: { examples: ["Me gusta el café.", "Dos cafés, por favor."] }, pt: { examples: ["Eu gosto de café.", "Dois cafés, por favor."] }, fr: { examples: ["J’aime le café.", "Deux cafés, s’il vous plaît."] }, de: { examples: ["Ich mag Kaffee.", "Zwei Kaffee, bitte."] }, it: { examples: ["Mi piace il caffè.", "Due caffè, per favore."] }, pl: { examples: ["Lubię kawę.", "Dwie kawy, proszę."] }, tr: { examples: ["Kahveyi severim.", "İki kahve, lütfen."] }, id: { examples: ["Saya suka kopi.", "Dua kopi, tolong."] }, vi: { examples: ["Tôi thích cà phê.", "Cho tôi hai ly cà phê."] } } }
