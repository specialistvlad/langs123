title: { en: Countable and Uncountable Nouns, uk: Злічувані та незлічувані іменники, es: Sustantivos contables e incontables, pt: "Substantivos contáveis e incontáveis", fr: "Noms dénombrables et indénombrables", de: "Zählbare und unzählbare Nomen", it: "Sostantivi numerabili e non numerabili", pl: "Rzeczowniki policzalne i niepoliczalne", tr: "Sayılabilir ve sayılamayan isimler", id: "Kata benda terhitung dan tak terhitung", vi: "Danh từ đếm được và không đếm được" }
summary:
  lead:
    en: ["Countable nouns are counted one by one (", { term: a book }, ", ", { term: two books }, "); uncountable nouns are masses and ideas (", { term: water }, ", ", { term: advice }, ")."]
    uk: ["Злічувані іменники лічать поштучно (", { term: a book }, ", ", { term: two books }, "); незлічувані називають речовини й ідеї (", { term: water }, ", ", { term: advice }, ")."]
    es: ["Los sustantivos contables se cuentan uno por uno (", { term: a book }, ", ", { term: two books }, "); los incontables nombran sustancias e ideas (", { term: water }, ", ", { term: advice }, ")."]
    pt: ["Os substantivos contáveis são contados um a um (", { term: "a book" }, ", ", { term: "two books" }, "); os incontáveis nomeiam substâncias e ideias (", { term: "water" }, ", ", { term: "advice" }, ")."]
    fr: ["Les noms dénombrables se comptent un par un (", { term: "a book" }, ", ", { term: "two books" }, ") ; les noms indénombrables désignent des masses et des idées (", { term: "water" }, ", ", { term: "advice" }, ")."]
    de: ["Zählbare Nomen werden einzeln gezählt (", { term: "a book" }, ", ", { term: "two books" }, "); unzählbare Nomen sind Stoffe und Ideen (", { term: "water" }, ", ", { term: "advice" }, ")."]
    it: ["I sostantivi numerabili si contano uno per uno (", { term: "a book" }, ", ", { term: "two books" }, "); i non numerabili indicano sostanze e idee (", { term: "water" }, ", ", { term: "advice" }, ")."]
    pl: ["Rzeczowniki policzalne liczy się pojedynczo (", { term: "a book" }, ", ", { term: "two books" }, "); rzeczowniki niepoliczalne nazywają substancje i idee (", { term: "water" }, ", ", { term: "advice" }, ")."]
    tr: ["Sayılabilir isimler tek tek sayılır (", { term: "a book" }, ", ", { term: "two books" }, "); sayılamayan isimler madde ve kavramları adlandırır (", { term: "water" }, ", ", { term: "advice" }, ")."]
    id: ["Kata benda terhitung dihitung satu per satu (", { term: "a book" }, ", ", { term: "two books" }, "); kata benda tak terhitung berupa zat dan gagasan (", { term: "water" }, ", ", { term: "advice" }, ")."]
    vi: ["Danh từ đếm được đếm từng cái (", { term: "a book" }, ", ", { term: "two books" }, "); danh từ không đếm được chỉ chất liệu và khái niệm (", { term: "water" }, ", ", { term: "advice" }, ")."]
  rule:
    en: ["Uncountable nouns take no ", { term: a }, " or ", { term: an }, ", no plural and a singular verb:"]
    uk: ["Незлічувані іменники не мають ", { term: a }, " чи ", { term: an }, ", не мають множини й вживаються з дієсловом в однині:"]
    es: ["Los sustantivos incontables no llevan ", { term: a }, " ni ", { term: an }, ", no tienen plural y llevan el verbo en singular:"]
    pt: ["Os substantivos incontáveis não levam ", { term: "a" }, " nem ", { term: "an" }, ", não têm plural e levam o verbo no singular:"]
    fr: ["Les noms indénombrables n’ont ni ", { term: "a" }, " ni ", { term: "an" }, ", ni pluriel, et le verbe est au singulier :"]
    de: ["Unzählbare Nomen haben kein ", { term: "a" }, " oder ", { term: "an" }, ", keinen Plural und ein Verb im Singular:"]
    it: ["I sostantivi non numerabili non prendono ", { term: "a" }, " né ", { term: "an" }, ", non hanno il plurale e vogliono il verbo al singolare:"]
    pl: ["Rzeczowniki niepoliczalne nie mają ", { term: "a" }, " ani ", { term: "an" }, ", nie mają liczby mnogiej i łączą się z czasownikiem w liczbie pojedynczej:"]
    tr: ["Sayılamayan isimler ", { term: "a" }, " veya ", { term: "an" }, " almaz, çoğul olmaz ve tekil fiille kullanılır:"]
    id: ["Kata benda tak terhitung tidak memakai ", { term: "a" }, " atau ", { term: "an" }, ", tidak punya bentuk jamak, dan memakai kata kerja tunggal:"]
    vi: ["Danh từ không đếm được không dùng ", { term: "a" }, " hay ", { term: "an" }, ", không có số nhiều và đi với động từ số ít:"]
  ex: ["The news ", { target: is }, " good."]

