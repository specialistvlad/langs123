summary:
  lead:
    en: [{ pattern: [Noun, "'s"] }, " shows who something belongs to, and ' alone follows a plural in -s."]
    uk: [{ pattern: ["Іменник", "'s"] }, " показує, кому щось належить, а після множини на -s стоїть лише '."]
    es: [{ pattern: ["Sustantivo", "'s"] }, " indica a quién pertenece algo, y después de un plural en -s basta con '."]
    pt: [{ pattern: ["Substantivo", "'s"] }, " indica a quem algo pertence, e depois de um plural em -s basta '."]
    fr: [{ pattern: ["Nom", "'s"] }, " indique à qui appartient quelque chose, et après un pluriel en -s l’apostrophe seule suffit."]
    de: [{ pattern: ["Nomen", "'s"] }, " zeigt, wem etwas gehört, und nach einem Plural auf -s steht nur '."]
    it: [{ pattern: ["Sostantivo", "'s"] }, " indica a chi appartiene qualcosa, e dopo un plurale in -s basta '."]
    pl: [{ pattern: ["Rzeczownik", "'s"] }, " pokazuje, do kogo coś należy, a po liczbie mnogiej na -s stoi sam '."]
    tr: [{ pattern: ["İsim", "'s"] }, " bir şeyin kime ait olduğunu gösterir; -s ile biten bir çoğuldan sonra yalnızca ' gelir."]
    id: [{ pattern: ["Kata benda", "'s"] }, " menunjukkan milik siapa sesuatu, dan ' saja dipakai setelah bentuk jamak berakhiran -s."]
    vi: [{ pattern: ["Danh từ", "'s"] }, " cho biết vật thuộc về ai; sau danh từ số nhiều có đuôi -s chỉ cần dấu '."]
  rule:
    en: "The owner comes first and the thing after it takes no article:"
    uk: "Спочатку йде власник, а річ після нього стоїть без артикля:"
    es: "Primero va el poseedor y la cosa que sigue no lleva artículo:"
    pt: "Primeiro vem o possuidor, e a coisa que vem depois não leva artigo:"
    fr: "Le possesseur vient en premier et la chose qui suit ne prend pas d’article :"
    de: "Zuerst steht der Besitzer, und die folgende Sache hat keinen Artikel:"
    it: "Prima viene il possessore e la cosa che segue non prende l'articolo:"
    pl: "Najpierw stoi właściciel, a rzecz po nim nie ma przedimka:"
    tr: "Önce sahip gelir, ondan sonraki şey artikel almaz:"
    id: "Pemilik berada di depan dan benda yang mengikutinya tidak memakai artikel:"
    vi: "Người sở hữu đứng trước và vật đứng sau không có mạo từ:"
