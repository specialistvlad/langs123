# yaml-language-server: $schema=schema/levels.schema.json
# The level scale, lowest first. Every app names, describes and colours levels from this file.
# A level's colour is its hue on the OKLCH colour wheel: the levels run through the rainbow, red to
# violet. The tones (lightness and saturation) belong to the theme (apps/web/level-colours.ts), so a
# level keeps its hue in the light and the dark theme.

levels:
  - code: A0
    name: { en: Starter, uk: Стартовий, es: Inicial }
    description:
      en: recognise letters, numbers and a few fixed phrases
      uk: розпізнавати літери, числа й кілька сталих фраз
      es: reconocer letras, números y algunas frases hechas
    hue: 25 # red
  - code: A1
    name: { en: Beginner, uk: Початковий, es: Principiante }
    description:
      en: introduce themselves, ask and answer simple everyday questions
      uk: представитися, ставити прості побутові запитання й відповідати на них
      es: presentarse, hacer y responder preguntas sencillas de la vida diaria
    hue: 60 # orange
  - code: A2
    name: { en: Elementary, uk: Елементарний, es: Elemental }
    description:
      en: describe routines, past events and immediate needs
      uk: описувати розпорядок дня, минулі події та нагальні потреби
      es: describir rutinas, hechos pasados y necesidades inmediatas
    hue: 88 # yellow
  - code: B1
    name: { en: Intermediate, uk: Середній, es: Intermedio }
    description:
      en: handle travel situations, describe experiences, give reasons and opinions
      uk: давати раду в подорожах, описувати досвід, пояснювати причини й висловлювати думку
      es: desenvolverse en viajes, describir experiencias, dar razones y opiniones
    hue: 150 # green
  - code: B2
    name: { en: Upper intermediate, uk: Вище середнього, es: Intermedio alto }
    description:
      en: follow complex texts, talk fluently with native speakers and argue a point of view
      uk: розуміти складні тексти, вільно розмовляти з носіями мови й обстоювати свою думку
      es: entender textos complejos, hablar con fluidez con hablantes nativos y defender un punto de vista
    hue: 235 # blue
  - code: C1
    name: { en: Advanced, uk: Просунутий, es: Avanzado }
    description:
      en: understand long, demanding texts and use the language flexibly at work and in study
      uk: розуміти довгі складні тексти й гнучко користуватися мовою в роботі та навчанні
      es: entender textos largos y exigentes y usar la lengua con flexibilidad en el trabajo y los estudios
    hue: 275 # indigo
  - code: C2
    name: { en: Proficiency, uk: Вільне володіння, es: Maestría }
    description:
      en: understand virtually everything and express fine shades of meaning
      uk: розуміти майже все й передавати найтонші відтінки значення
      es: entender prácticamente todo y expresar matices finos de significado
    hue: 315 # violet
