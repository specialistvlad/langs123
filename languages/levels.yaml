# yaml-language-server: $schema=schema/levels.schema.json
# The level scale, lowest first. Every app names and describes levels from this file; their colours
# come from the design tokens (apps/web/tokens.json).

levels:
  - code: A0
    name: { en: Starter, uk: Стартовий, es: Inicial, pt: "Introdutório", fr: "Grand débutant", de: "Einstieg", it: "Iniziale", pl: "Startowy", tr: "Giriş", id: "Permulaan", vi: "Nhập môn", ja: "入門" }
    description:
      en: recognise letters, numbers and a few fixed phrases
      uk: розпізнавати літери, числа й кілька сталих фраз
      es: reconocer letras, números y algunas frases hechas
      pt: "reconhecer letras, números e algumas frases feitas"
      fr: "reconnaître les lettres, les nombres et quelques expressions toutes faites"
      de: "Buchstaben, Zahlen und einige feste Wendungen erkennen"
      it: "riconoscere lettere, numeri e alcune frasi fatte"
      pl: "rozpoznawać litery, liczby i kilka utartych zwrotów"
      tr: "harfleri, sayıları ve birkaç kalıp ifadeyi tanımak"
      id: "mengenali huruf, angka, dan beberapa frasa tetap"
      vi: "nhận biết chữ cái, số và một vài cụm cố định"
      ja: "文字、数字、いくつかの決まった表現がわかる"
  - code: A1
    name: { en: Beginner, uk: Початковий, es: Principiante, pt: "Iniciante", fr: "Débutant", de: "Anfänger", it: "Principiante", pl: "Początkujący", tr: "Başlangıç", id: "Pemula", vi: "Sơ cấp", ja: "初級" }
    description:
      en: introduce themselves, ask and answer simple everyday questions
      uk: представитися, ставити прості побутові запитання й відповідати на них
      es: presentarse, hacer y responder preguntas sencillas de la vida diaria
      pt: "se apresentar, fazer e responder perguntas simples do dia a dia"
      fr: "se présenter, poser des questions simples de la vie quotidienne et y répondre"
      de: "sich vorstellen, einfache Alltagsfragen stellen und beantworten"
      it: "presentarsi, fare semplici domande di vita quotidiana e rispondere"
      pl: "przedstawić się, zadawać proste pytania z życia codziennego i na nie odpowiadać"
      tr: "kendini tanıtmak, basit günlük sorular sormak ve bunlara cevap vermek"
      id: "memperkenalkan diri, menanyakan dan menjawab pertanyaan sederhana sehari-hari"
      vi: "tự giới thiệu, hỏi và trả lời những câu hỏi đơn giản trong đời sống hằng ngày"
      ja: "自己紹介をし、日常の簡単な質問をしたり答えたりできる"
  - code: A2
    name: { en: Elementary, uk: Елементарний, es: Elemental, pt: "Elementar", fr: "Élémentaire", de: "Grundstufe", it: "Elementare", pl: "Podstawowy", tr: "Temel", id: "Dasar", vi: "Cơ bản", ja: "初中級" }
    description:
      en: describe routines, past events and immediate needs
      uk: описувати розпорядок дня, минулі події та нагальні потреби
      es: describir rutinas, hechos pasados y necesidades inmediatas
      pt: "descrever rotinas, fatos passados e necessidades imediatas"
      fr: "décrire des habitudes, des événements passés et des besoins immédiats"
      de: "Tagesabläufe, vergangene Ereignisse und unmittelbare Bedürfnisse beschreiben"
      it: "descrivere la routine, fatti passati e bisogni immediati"
      pl: "opisywać codzienne czynności, wydarzenia z przeszłości i najpilniejsze potrzeby"
      tr: "günlük rutinleri, geçmiş olayları ve o anki ihtiyaçları anlatmak"
      id: "menggambarkan rutinitas, kejadian di masa lalu, dan kebutuhan yang mendesak"
      vi: "mô tả thói quen, sự kiện trong quá khứ và nhu cầu trước mắt"
      ja: "日々の習慣、過去の出来事、身近な必要について話せる"
  - code: B1
    name: { en: Intermediate, uk: Середній, es: Intermedio, pt: "Intermediário", fr: "Intermédiaire", de: "Mittelstufe", it: "Intermedio", pl: "Średnio zaawansowany", tr: "Orta", id: "Menengah", vi: "Trung cấp", ja: "中級" }
    description:
      en: handle travel situations, describe experiences, give reasons and opinions
      uk: давати раду в подорожах, описувати досвід, пояснювати причини й висловлювати думку
      es: desenvolverse en viajes, describir experiencias, dar razones y opiniones
      pt: "se virar em viagens, descrever experiências, dar motivos e opiniões"
      fr: "se débrouiller en voyage, décrire des expériences, donner des raisons et des opinions"
      de: "Reisesituationen bewältigen, Erfahrungen beschreiben, Gründe und Meinungen nennen"
      it: "cavarsela in viaggio, descrivere esperienze, spiegare ragioni e opinioni"
      pl: "radzić sobie w podróży, opisywać doświadczenia, podawać powody i wyrażać opinie"
      tr: "seyahat durumlarıyla başa çıkmak, deneyimleri anlatmak, gerekçe ve görüş bildirmek"
      id: "menghadapi situasi saat bepergian, menceritakan pengalaman, serta menyampaikan alasan dan pendapat"
      vi: "xử lý các tình huống khi đi du lịch, mô tả trải nghiệm, đưa ra lý do và ý kiến"
      ja: "旅先の場面に対応し、経験を語り、理由や意見を述べられる"
  - code: B2
    name: { en: Upper intermediate, uk: Вище середнього, es: Intermedio alto, pt: "Intermediário superior", fr: "Intermédiaire supérieur", de: "Obere Mittelstufe", it: "Intermedio superiore", pl: "Średnio zaawansowany wyższy", tr: "Orta üstü", id: "Menengah atas", vi: "Trung cấp cao", ja: "中上級" }
    description:
      en: follow complex texts, talk fluently with native speakers and argue a point of view
      uk: розуміти складні тексти, вільно розмовляти з носіями мови й обстоювати свою думку
      es: entender textos complejos, hablar con fluidez con hablantes nativos y defender un punto de vista
      pt: "entender textos complexos, conversar com fluência com falantes nativos e defender um ponto de vista"
      fr: "comprendre des textes complexes, parler avec aisance avec des locuteurs natifs et défendre un point de vue"
      de: "komplexe Texte verstehen, sich flüssig mit Menschen unterhalten, die die Sprache als Muttersprache sprechen, und einen Standpunkt vertreten"
      it: "seguire testi complessi, parlare con scioltezza con i madrelingua e sostenere un punto di vista"
      pl: "rozumieć złożone teksty, swobodnie rozmawiać z rodzimymi użytkownikami języka i uzasadniać swój punkt widzenia"
      tr: "karmaşık metinleri anlamak, anadili konuşurlarıyla akıcı konuşmak ve bir görüşü savunmak"
      id: "memahami teks yang kompleks, bercakap dengan lancar bersama penutur asli, dan mempertahankan sudut pandang"
      vi: "hiểu các văn bản phức tạp, trò chuyện trôi chảy với người bản ngữ và bảo vệ quan điểm của mình"
      ja: "複雑な文章を理解し、ネイティブスピーカーと流暢に話し、自分の見解を論じられる"
  - code: C1
    name: { en: Advanced, uk: Просунутий, es: Avanzado, pt: "Avançado", fr: "Avancé", de: "Fortgeschritten", it: "Avanzato", pl: "Zaawansowany", tr: "İleri", id: "Lanjut", vi: "Cao cấp", ja: "上級" }
    description:
      en: understand long, demanding texts and use the language flexibly at work and in study
      uk: розуміти довгі складні тексти й гнучко користуватися мовою в роботі та навчанні
      es: entender textos largos y exigentes y usar la lengua con flexibilidad en el trabajo y los estudios
      pt: "entender textos longos e exigentes e usar o idioma com flexibilidade no trabalho e nos estudos"
      fr: "comprendre des textes longs et exigeants et utiliser la langue avec souplesse au travail et dans les études"
      de: "lange, anspruchsvolle Texte verstehen und die Sprache im Beruf und im Studium flexibel einsetzen"
      it: "capire testi lunghi e impegnativi e usare la lingua con flessibilità nel lavoro e nello studio"
      pl: "rozumieć długie, wymagające teksty i elastycznie posługiwać się językiem w pracy i w nauce"
      tr: "uzun ve zorlu metinleri anlamak, dili iş ve eğitimde esnek biçimde kullanmak"
      id: "memahami teks panjang yang menuntut dan menggunakan bahasa secara luwes dalam pekerjaan dan studi"
      vi: "hiểu các văn bản dài, đòi hỏi cao và sử dụng ngôn ngữ linh hoạt trong công việc và học tập"
      ja: "長く難解な文章を理解し、仕事や学業で言語を柔軟に使える"
  - code: C2
    name: { en: Proficiency, uk: Вільне володіння, es: Maestría, pt: "Proficiência", fr: "Maîtrise", de: "Annähernd muttersprachlich", it: "Padronanza", pl: "Biegły", tr: "Ustalık", id: "Mahir", vi: "Thành thạo", ja: "熟達" }
    description:
      en: understand virtually everything and express fine shades of meaning
      uk: розуміти майже все й передавати найтонші відтінки значення
      es: entender prácticamente todo y expresar matices finos de significado
      pt: "entender praticamente tudo e expressar nuances sutis de significado"
      fr: "comprendre pratiquement tout et exprimer les nuances de sens les plus fines"
      de: "praktisch alles verstehen und feinste Bedeutungsnuancen ausdrücken"
      it: "capire praticamente tutto ed esprimere sfumature sottili di significato"
      pl: "rozumieć praktycznie wszystko i oddawać subtelne niuanse znaczenia"
      tr: "hemen hemen her şeyi anlamak ve anlamın ince tonlarını ifade etmek"
      id: "memahami hampir segalanya dan mengungkapkan nuansa makna yang halus"
      vi: "hiểu hầu như mọi thứ và diễn đạt những sắc thái ý nghĩa tinh tế"
      ja: "ほぼすべてを理解し、細かな意味の違いまで表現できる"
