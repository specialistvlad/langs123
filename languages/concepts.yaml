declension:
  title: { en: Declension, uk: Відмінювання, es: Declinación, pt: "Declinação", fr: "Déclinaison", de: "Deklination", it: "Declinazione", pl: "Deklinacja", tr: "Çekim", id: "Deklinasi", vi: "Biến cách" }
  description:
