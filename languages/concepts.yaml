    pt: "Duas preposições que dividem o «for» inglês: uma para causa e meio, outra para finalidade e destino."
    fr: "Deux prépositions qui se partagent « pour » : l’une pour la cause et le moyen, l’autre pour le but et la destination."
    de: "Zwei Präpositionen, die sich „für“ teilen: eine für Grund und Weg, eine für Zweck und Ziel."
    it: "Due preposizioni che si dividono «per»: una per causa e mezzo, l’altra per scopo e destinazione."
    pl: "Dwa przyimki dzielące znaczenie „dla/za”: jeden dla przyczyny i sposobu, drugi dla celu i przeznaczenia."
    tr: "«İçin» anlamını paylaşan iki edat: biri neden ve yol, diğeri amaç ve varış yeri için."
    id: "Dua preposisi yang berbagi makna «for»: satu untuk sebab dan cara, satu untuk tujuan dan arah."
    vi: "Hai giới từ chia nhau nghĩa «for»: một cho nguyên nhân và cách thức, một cho mục đích và đích đến."

cases:
  title: { en: Cases, uk: Відмінки, es: Casos, pt: "Casos", fr: "Cas", de: "Fälle", it: "Casi", pl: "Przypadki", tr: "Haller", id: "Kasus", vi: "Cách" }
