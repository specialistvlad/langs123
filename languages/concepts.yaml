  title: { en: Euphony, uk: Милозвучність, es: Eufonía, pt: "Eufonia", fr: "Euphonie", de: "Wohlklang", it: "Eufonia", pl: "Eufonia", tr: "Ses uyumu", id: "Eufoni", vi: "Hài âm" }
  description:
