    id: "Kata kerja bantu dengan infinitif atau gerundium untuk awal, akhir, pengulangan, dan kebiasaan."
    vi: "Trợ động từ đi với nguyên mẫu hoặc danh động từ cho bắt đầu, kết thúc, lặp lại và thói quen."

por-para:
  title: { en: Cause and purpose, uk: Причина й мета, es: Causa y finalidad, pt: "Causa e finalidade", fr: "Cause et but", de: "Grund und Zweck", it: "Causa e scopo", pl: "Przyczyna i cel", tr: "Neden ve amaç", id: "Sebab dan tujuan", vi: "Nguyên nhân và mục đích" }
  description:
    en: "Two prepositions that split “for”: one for cause and way, one for purpose and destination."
    uk: "Два прийменники, що ділять «для/за»: один для причини й шляху, інший для мети й призначення."
