  description:
    en: Word order and sentence patterns that add emphasis, such as inversion, repetition and rhetorical questions.
    uk: "Порядок слів і будова речень, що додають виразності, як-от інверсія, повтор і риторичне питання."
    es: "Orden de palabras y estructuras que dan énfasis, como la inversión, la repetición y la pregunta retórica."
    pt: "Ordem das palavras e estruturas que dão ênfase, como a inversão, a repetição e a pergunta retórica."
    fr: "L’ordre des mots et les tournures qui mettent en relief, comme l’inversion, la répétition et la question rhétorique."
    de: "Wortstellung und Satzmuster, die betonen, wie Inversion, Wiederholung und rhetorische Frage."
    it: "Ordine delle parole e strutture che danno enfasi, come l’inversione, la ripetizione e la domanda retorica."
    pl: "Szyk wyrazów i budowa zdań, które dodają wyrazistości, takie jak inwersja, powtórzenie i pytanie retoryczne."
    tr: "Devrik cümle, tekrar ve soru sorma sanatı gibi vurgu katan sözcük dizilişleri ve cümle kalıpları."
    id: "Urutan kata dan pola kalimat yang memberi penekanan, seperti inversi, pengulangan, dan pertanyaan retoris."
    vi: "Trật tự từ và kiểu câu tạo sự nhấn mạnh, như đảo ngữ, lặp lại và câu hỏi tu từ."

register:
  title: { en: Registers and styles, uk: Стилі мови, es: "Registros y estilos", pt: "Registros e estilos", fr: "Registres et styles", de: "Register und Stile", it: "Registri e stili", pl: "Style funkcjonalne", tr: "Dil üslupları", id: "Ragam bahasa", vi: "Phong cách ngôn ngữ" }
  description:
    en: How grammar and wording change from conversation to official, academic and literary text.
    uk: "Як граматика й слова змінюються від розмови до офіційного, наукового й художнього тексту."
    es: "Cómo cambian la gramática y las palabras de la conversación al texto oficial, académico y literario."
    pt: "Como a gramática e as palavras mudam da conversa ao texto oficial, acadêmico e literário."
    fr: "Comment la grammaire et les mots changent de la conversation au texte officiel, savant et littéraire."
    de: "Wie Grammatik und Wortwahl sich vom Gespräch zum amtlichen, wissenschaftlichen und literarischen Text ändern."
    it: "Come grammatica e parole cambiano dalla conversazione al testo ufficiale, accademico e letterario."
    pl: "Jak gramatyka i słownictwo zmieniają się od rozmowy do tekstu urzędowego, naukowego i literackiego."
    tr: "Dil bilgisi ve sözcük seçiminin konuşmadan resmî, bilimsel ve edebî metne nasıl değiştiği."
    id: "Bagaimana tata bahasa dan pilihan kata berubah dari percakapan ke teks resmi, ilmiah, dan sastra."
    vi: "Ngữ pháp và cách dùng từ thay đổi thế nào từ hội thoại sang văn bản hành chính, khoa học và văn chương."

intonation:
  title: { en: Intonation, uk: Інтонація, es: Entonación, pt: "Entonação", fr: "Intonation", de: "Intonation", it: "Intonazione", pl: "Intonacja", tr: "Tonlama", id: "Intonasi", vi: "Ngữ điệu" }
  description:
    en: How the voice rises and falls across a sentence to mark questions, statements and feelings.
    uk: "Як голос підвищується й понижується протягом речення, щоб позначити питання, ствердження й емоції."
    es: "Cómo sube y baja la voz a lo largo de la oración para marcar preguntas, afirmaciones y emociones."
    pt: "Como a voz sobe e desce ao longo da frase para marcar perguntas, afirmações e emoções."
    fr: "La façon dont la voix monte et descend dans la phrase pour marquer les questions, les affirmations et les émotions."
    de: "Wie die Stimme im Satz steigt und fällt, um Fragen, Aussagen und Gefühle zu kennzeichnen."
    it: "Come la voce sale e scende nella frase per segnalare domande, affermazioni ed emozioni."
    pl: "Jak głos unosi się i opada w zdaniu, by zaznaczyć pytania, oznajmienia i emocje."
    tr: "Sesin cümle boyunca yükselip alçalarak soruları, bildirmeleri ve duyguları nasıl belirttiği."
    id: "Bagaimana suara naik dan turun dalam kalimat untuk menandai pertanyaan, pernyataan, dan perasaan."
    vi: "Giọng lên xuống trong câu để đánh dấu câu hỏi, câu kể và cảm xúc."

appreciative-suffixes:
  title: { en: Diminutives and augmentatives, uk: Зменшувальні та збільшувальні суфікси, es: "Diminutivos y aumentativos", pt: "Diminutivos e aumentativos", fr: "Diminutifs et augmentatifs", de: "Verkleinerungs- und Vergrößerungsformen", it: "Diminutivi e accrescitivi", pl: "Zdrobnienia i zgrubienia", tr: "Küçültme ve büyütme ekleri", id: "Diminutif dan augmentatif", vi: "Hậu tố chỉ nhỏ và lớn" }
  description:
    en: Endings that make a word smaller or bigger, or add affection or scorn.
    uk: "Суфікси, що роблять слово меншим чи більшим або додають ніжності чи зневаги."
    es: "Terminaciones que hacen una palabra más pequeña o más grande, o le añaden cariño o desprecio."
    pt: "Terminações que tornam uma palavra menor ou maior, ou lhe dão carinho ou desprezo."
    fr: "Les terminaisons qui rendent un mot plus petit ou plus grand, ou y ajoutent de l’affection ou du mépris."
    de: "Endungen, die ein Wort kleiner oder größer machen oder ihm Zuneigung oder Geringschätzung geben."
    it: "Terminazioni che rendono una parola più piccola o più grande, o le danno affetto o disprezzo."
    pl: "Końcówki, które czynią wyraz mniejszym lub większym albo dodają mu czułości lub pogardy."
    tr: "Bir sözcüğü daha küçük ya da daha büyük yapan, ona sevgi ya da küçümseme katan ekler."
    id: "Akhiran yang membuat kata menjadi lebih kecil atau lebih besar, atau menambahkan kesan sayang atau meremehkan."
    vi: "Hậu tố làm từ nhỏ đi hoặc lớn lên, hoặc thêm sắc thái thân mật hay coi thường."

middle-voice:
  title: { en: Middle voice, uk: Середній стан, es: "Voz media", pt: "Voz média", fr: "Voix moyenne", de: "Mediale Verben", it: "Diatesi media", pl: "Strona medialna", tr: "Orta çatı", id: "Diatesis medial", vi: "Thể giữa" }
  description:
    en: Verbs that show an action happening to the subject itself or on its own, with no separate doer, as in the door opened.
    uk: "Дієслова, що показують дію, яка відбувається з самим підметом чи сама по собі, без окремого виконавця, як-от двері відчинилися."
    es: "Verbos que muestran una acción que le ocurre al propio sujeto o que sucede por sí sola, sin un agente aparte, como la puerta se abrió."
    pt: "Verbos que mostram uma ação que acontece com o próprio sujeito ou por si só, sem um agente à parte, como a porta abriu."
    fr: "Les verbes qui montrent une action qui arrive au sujet lui-même ou se produit toute seule, sans agent distinct, comme la porte s’est ouverte."
    de: "Verben, die eine Handlung zeigen, die dem Subjekt selbst geschieht oder von allein abläuft, ohne eigenen Handelnden, wie die Tür öffnete sich."
    it: "Verbi che mostrano un’azione che accade al soggetto stesso o da sola, senza un agente distinto, come la porta si è aperta."
    pl: "Czasowniki pokazujące czynność, która dotyczy samego podmiotu lub dzieje się sama, bez osobnego wykonawcy, jak drzwi się otworzyły."
    tr: "Öznenin kendisine olan ya da kendiliğinden gerçekleşen, ayrı bir yapanı olmayan eylemleri gösteren fiiller, kapı açıldı gibi."
    id: "Kata kerja yang menunjukkan tindakan yang terjadi pada subjek itu sendiri atau terjadi dengan sendirinya, tanpa pelaku terpisah, seperti pintu terbuka."
    vi: "Động từ chỉ hành động xảy ra với chính chủ ngữ hoặc tự xảy ra, không có người làm riêng, như cửa mở ra."

change-of-state:
  title: { en: Verbs of becoming, uk: Дієслова зміни стану, es: "Verbos de cambio", pt: "Verbos de mudança", fr: "Verbes de changement d’état", de: "Verben des Werdens", it: "Verbi di cambiamento", pl: "Czasowniki zmiany stanu", tr: "Olma ve dönüşme fiilleri", id: "Kata kerja perubahan keadaan", vi: "Động từ chỉ sự thay đổi trạng thái" }
  description:
    en: Verbs and phrases for becoming something or changing state, such as get tired, turn red and become a doctor.
    uk: "Дієслова й звороти для того, щоб стати кимось чи змінити стан, як-от втомитися, почервоніти й стати лікарем."
    es: "Verbos y expresiones para llegar a ser algo o cambiar de estado, como ponerse rojo, volverse loco y hacerse médico."
    pt: "Verbos e expressões para tornar-se algo ou mudar de estado, como ficar cansado, ficar vermelho e virar médico."
    fr: "Verbes et expressions pour devenir quelque chose ou changer d’état, comme se fatiguer, rougir et devenir médecin."
    de: "Verben und Wendungen, um etwas zu werden oder den Zustand zu wechseln, wie müde werden, erröten und Arzt werden."
    it: "Verbi ed espressioni per diventare qualcosa o cambiare stato, come stancarsi, arrossire e diventare medico."
    pl: "Czasowniki i wyrażenia oznaczające stawanie się kimś lub zmianę stanu, takie jak zmęczyć się, zaczerwienić się i zostać lekarzem."
    tr: "Bir şey olmayı ya da durum değiştirmeyi anlatan fiiller ve kalıplar, yorulmak, kızarmak ve doktor olmak gibi."
    id: "Kata kerja dan ungkapan untuk menjadi sesuatu atau berubah keadaan, seperti menjadi lelah, memerah, dan menjadi dokter."
    vi: "Động từ và cách nói để trở thành điều gì đó hoặc đổi trạng thái, như mệt đi, đỏ lên và trở thành bác sĩ."

future-perfect:
  title: { en: Future perfect, uk: Future Perfect, es: Futuro perfecto, pt: "Futuro perfeito", fr: "Futur antérieur", de: "Futur II", it: "Futuro anteriore", pl: "Future Perfect", tr: "Future Perfect", id: "Future perfect", vi: "Tương lai hoàn thành" }
  description:
    en: "Actions that will be finished before a later point in time, as in by Friday I will have finished."
    uk: "Дії, які завершаться до певного моменту в майбутньому, як-от до п’ятниці я закінчу."
    es: "Acciones que estarán terminadas antes de un momento futuro, como para el viernes habré terminado."
    pt: "Ações que estarão concluídas antes de um momento futuro, como até sexta-feira terei terminado."
    fr: "Les actions qui seront terminées avant un moment futur, comme d’ici vendredi j’aurai fini."
    de: "Handlungen, die bis zu einem späteren Zeitpunkt abgeschlossen sein werden, wie bis Freitag werde ich es geschafft haben."
    it: "Azioni che saranno concluse entro un momento futuro, come entro venerdì avrò finito."
    pl: "Czynności, które będą zakończone przed pewnym momentem w przyszłości, jak do piątku skończę."
    tr: "Gelecekteki bir ana kadar bitmiş olacak eylemler, cuma gününe kadar bitirmiş olacağım gibi."
    id: "Tindakan yang sudah selesai sebelum titik waktu tertentu di masa depan, seperti pada hari Jumat saya sudah selesai."
    vi: "Hành động sẽ hoàn tất trước một thời điểm trong tương lai, như đến thứ Sáu tôi sẽ làm xong."

sequence-of-tenses:
  title: { en: Sequence of tenses, uk: Узгодження часів, es: Concordancia de tiempos, pt: "Correlação dos tempos verbais", fr: "Concordance des temps", de: "Zeitenfolge", it: "Consecutio temporum", pl: "Następstwo czasów", tr: "Zaman uyumu", id: "Kesesuaian kala", vi: "Hòa hợp thì" }
  description:
    en: How the tense of a subordinate clause follows the tense of the main verb, for example after a past verb.
    uk: "Як час залежного речення відповідає часу головного дієслова, наприклад після дієслова в минулому."
    es: "Cómo el tiempo de la oración subordinada se ajusta al tiempo del verbo principal, por ejemplo después de un verbo en pasado."
    pt: "Como o tempo da oração subordinada se ajusta ao tempo do verbo principal, por exemplo depois de um verbo no passado."
    fr: "Comment le temps de la subordonnée s’accorde avec celui du verbe principal, par exemple après un verbe au passé."
    de: "Wie die Zeitform des Nebensatzes sich nach der Zeitform des Hauptverbs richtet, zum Beispiel nach einem Verb in der Vergangenheit."
    it: "Come il tempo della subordinata si adegua al tempo del verbo principale, per esempio dopo un verbo al passato."
    pl: "Jak czas zdania podrzędnego zależy od czasu czasownika głównego, na przykład po czasowniku w przeszłości."
    tr: "Yan cümlenin zamanının ana fiilin zamanına nasıl uyduğu, örneğin geçmiş zamanlı bir fiilden sonra."
    id: "Bagaimana kala anak kalimat menyesuaikan diri dengan kala kata kerja utama, misalnya setelah kata kerja lampau."
    vi: "Thì của mệnh đề phụ phụ thuộc vào thì của động từ chính như thế nào, ví dụ sau một động từ ở quá khứ."

governed-prepositions:
  title: { en: Words with fixed prepositions, uk: Слова з усталеним прийменником, es: "Palabras con preposición fija", pt: "Palavras com preposição fixa", fr: "Mots à préposition fixe", de: "Feste Präpositionen", it: "Parole con preposizione fissa", pl: "Stałe połączenia z przyimkami", tr: "Edat gerektiren sözcükler", id: "Kata dengan kata depan tetap", vi: "Từ đi kèm giới từ cố định" }
  description:
    en: Verbs, adjectives and nouns that need one particular preposition, such as depend on or think about.
    uk: "Дієслова, прикметники й іменники, які потребують певного прийменника, як-от залежати від чи думати про."
    es: "Verbos, adjetivos y sustantivos que exigen una preposición concreta, como depender de o pensar en."
    pt: "Verbos, adjetivos e substantivos que exigem uma preposição determinada, como depender de ou pensar em."
    fr: "Verbes, adjectifs et noms qui demandent une préposition précise, comme dépendre de ou penser à."
    de: "Verben, Adjektive und Nomen, die eine bestimmte Präposition verlangen, wie abhängen von oder denken an."
    it: "Verbi, aggettivi e nomi che richiedono una preposizione precisa, come dipendere da o pensare a."
    pl: "Czasowniki, przymiotniki i rzeczowniki wymagające konkretnego przyimka, takie jak zależeć od czy myśleć o."
    tr: "Belirli bir edatı ya da hâl ekini gerektiren fiiller, sıfatlar ve adlar."
    id: "Kata kerja, kata sifat, dan kata benda yang menuntut kata depan tertentu, seperti bergantung pada atau berpikir tentang."
    vi: "Động từ, tính từ và danh từ cần một giới từ nhất định, như phụ thuộc vào hay nghĩ về."

concession:
  title: { en: Concession, uk: Допустовість, es: "Concesión", pt: "Concessão", fr: "Concession", de: "Konzessivsätze", it: "Concessione", pl: "Przyzwolenie", tr: "Karşıtlık", id: "Konsesi", vi: "Nhượng bộ" }
  description:
    en: "Stating a fact despite another one that points the other way: although, even though, despite."
    uk: "Висловлення факту попри інший, що йому суперечить: хоча, попри, незважаючи на."
    es: "Expresar un hecho a pesar de otro que apunta en sentido contrario: aunque, a pesar de, pese a."
    pt: "Expressar um fato apesar de outro que aponta no sentido contrário: embora, apesar de, mesmo que."
    fr: "Exprimer un fait malgré un autre qui va en sens contraire : bien que, même si, malgré."
    de: "Eine Tatsache nennen, obwohl eine andere in die Gegenrichtung weist: obwohl, obgleich, trotz."
    it: "Esprimere un fatto nonostante un altro che va in senso opposto: sebbene, anche se, nonostante."
    pl: "Wyrażanie faktu mimo innego, który wskazuje coś przeciwnego: chociaż, mimo że, pomimo."
    tr: "Tersini gösteren başka bir olguya rağmen bir olguyu bildirmek: -e rağmen, -dığı hâlde, gerçi."
    id: "Menyatakan suatu fakta meskipun ada fakta lain yang berlawanan: meskipun, walaupun, kendati."
    vi: "Nêu một sự việc dù có sự việc khác đi theo hướng ngược lại: mặc dù, tuy, bất chấp."

cause:
  title: { en: Cause, uk: Причина, es: "Causa", pt: "Causa", fr: "Cause", de: "Ursache und Grund", it: "Causa", pl: "Przyczyna", tr: "Neden", id: "Sebab", vi: "Nguyên nhân" }
  description:
    en: "Giving the reason for something: because, since, as, due to."
    uk: "Пояснення причини: тому що, бо, оскільки, через."
    es: "Dar la razón de algo: porque, ya que, como, debido a."
    pt: "Dar a razão de algo: porque, já que, como, devido a."
    fr: "Donner la raison de quelque chose : parce que, puisque, comme, à cause de."
    de: "Den Grund für etwas nennen: weil, da, denn, wegen."
    it: "Dare il motivo di qualcosa: perché, poiché, siccome, a causa di."
    pl: "Podawanie przyczyny czegoś: ponieważ, bo, gdyż, z powodu."
    tr: "Bir şeyin nedenini söylemek: çünkü, -dığı için, yüzünden."
    id: "Menyebutkan alasan sesuatu: karena, sebab, lantaran, akibat."
    vi: "Nêu lý do của việc gì đó: vì, bởi vì, do, tại."

consequence:
  title: { en: Consequence, uk: Наслідок, es: "Consecuencia", pt: "Consequência", fr: "Conséquence", de: "Folge", it: "Conseguenza", pl: "Skutek", tr: "Sonuç", id: "Akibat", vi: "Kết quả" }
  description:
    en: "Giving the result of something: so, therefore, as a result, so much that."
    uk: "Вказування на наслідок чогось: тому, отже, внаслідок цього, так що."
    es: "Indicar el resultado de algo: así que, por eso, por lo tanto, tanto que."
    pt: "Indicar o resultado de algo: então, por isso, portanto, tanto que."
    fr: "Indiquer le résultat de quelque chose : donc, c’est pourquoi, par conséquent, si bien que."
    de: "Das Ergebnis von etwas nennen: also, deshalb, folglich, sodass."
    it: "Indicare il risultato di qualcosa: quindi, perciò, di conseguenza, tanto che."
    pl: "Wskazywanie skutku czegoś: więc, dlatego, w rezultacie, tak że."
    tr: "Bir şeyin sonucunu belirtmek: bu yüzden, dolayısıyla, öyle ki."
    id: "Menyatakan hasil dari sesuatu: jadi, oleh karena itu, akibatnya, sehingga."
    vi: "Nêu kết quả của việc gì đó: nên, vì vậy, do đó, đến mức."

agreement:
  title: { en: Agreement, uk: Узгодження, es: "Concordancia", pt: "Concordância", fr: "Accord", de: "Kongruenz", it: "Concordanza", pl: "Zgodność", tr: "Uyum", id: "Kesesuaian", vi: "Sự hòa hợp" }
  description:
    en: How words match in gender, number, case and person, such as an adjective with its noun or a verb with its subject.
    uk: "Як слова узгоджуються в роді, числі, відмінку й особі, наприклад прикметник з іменником чи дієслово з підметом."
    es: "Cómo concuerdan las palabras en género, número, caso y persona, por ejemplo el adjetivo con el sustantivo o el verbo con el sujeto."
    pt: "Como as palavras concordam em gênero, número, caso e pessoa, por exemplo o adjetivo com o substantivo ou o verbo com o sujeito."
    fr: "Comment les mots s’accordent en genre, en nombre, en cas et en personne, par exemple l’adjectif avec le nom ou le verbe avec son sujet."
    de: "Wie Wörter in Genus, Numerus, Kasus und Person übereinstimmen, zum Beispiel das Adjektiv mit dem Nomen oder das Verb mit dem Subjekt."
    it: "Come le parole concordano in genere, numero, caso e persona, per esempio l’aggettivo con il nome o il verbo con il soggetto."
    pl: "Jak wyrazy zgadzają się w rodzaju, liczbie, przypadku i osobie, na przykład przymiotnik z rzeczownikiem albo czasownik z podmiotem."
    tr: "Sözcüklerin cins, sayı, hâl ve kişi bakımından birbirine nasıl uyduğu, örneğin sıfatın adla ya da fiilin özneyle uyumu."
    id: "Bagaimana kata-kata sesuai dalam gender, jumlah, kasus, dan persona, misalnya kata sifat dengan kata bendanya atau kata kerja dengan subjeknya."
    vi: "Cách các từ khớp nhau về giống, số, cách và ngôi, như tính từ với danh từ hoặc động từ với chủ ngữ."

punctuation:
  title: { en: Punctuation, uk: Розділові знаки, es: "Puntuación", pt: "Pontuação", fr: "Ponctuation", de: "Zeichensetzung", it: "Punteggiatura", pl: "Interpunkcja", tr: "Noktalama", id: "Tanda baca", vi: "Dấu câu" }
  description:
    en: Commas, dashes, quotation marks and other marks, and the rules for where they go.
    uk: "Коми, тире, лапки й інші знаки та правила, де їх ставити."
    es: "Comas, rayas, comillas y otros signos, y las reglas de dónde se ponen."
    pt: "Vírgulas, travessões, aspas e outros sinais, e as regras de onde colocá-los."
    fr: "Virgules, tirets, guillemets et autres signes, et les règles qui disent où les placer."
    de: "Kommas, Gedankenstriche, Anführungszeichen und andere Zeichen sowie die Regeln, wo sie stehen."
    it: "Virgole, trattini, virgolette e altri segni, e le regole su dove metterli."
    pl: "Przecinki, myślniki, cudzysłowy i inne znaki oraz zasady, gdzie je stawiać."
    tr: "Virgül, tire, tırnak işareti ve öteki işaretler ile bunların nereye konacağını belirleyen kurallar."
    id: "Koma, tanda pisah, tanda kutip, dan tanda baca lain, beserta aturan penempatannya."
    vi: "Dấu phẩy, dấu gạch ngang, dấu ngoặc kép và các dấu khác, cùng quy tắc đặt chúng."

abbreviations:
  title: { en: Abbreviations, uk: Скорочення, es: "Abreviaturas", pt: "Abreviaturas", fr: "Abréviations", de: "Abkürzungen", it: "Abbreviazioni", pl: "Skróty", tr: "Kısaltmalar", id: "Singkatan", vi: "Từ viết tắt" }
  description:
    en: Shortened forms of words, titles and names, such as etc. and Dr., and how to write and read them.
    uk: "Скорочені форми слів, звань і назв, як-от тощо й проф., та як їх писати й читати."
    es: "Formas abreviadas de palabras, títulos y nombres, como etc. y Sr., y cómo escribirlas y leerlas."
    pt: "Formas abreviadas de palavras, títulos e nomes, como etc. e Sr., e como escrevê-las e lê-las."
    fr: "Les formes abrégées de mots, de titres et de noms, comme etc. et M., et la façon de les écrire et de les lire."
    de: "Verkürzte Formen von Wörtern, Titeln und Namen, wie usw. und Dr., und wie man sie schreibt und liest."
    it: "Forme abbreviate di parole, titoli e nomi, come ecc. e sig., e come si scrivono e si leggono."
    pl: "Skrócone formy wyrazów, tytułów i nazw, takie jak itd. i dr, oraz sposób ich pisania i czytania."
    tr: "Sözcüklerin, unvanların ve adların kısaltılmış biçimleri, vb. ve Dr. gibi, ve bunların nasıl yazılıp okunduğu."
    id: "Bentuk singkat kata, gelar, dan nama, seperti dst. dan Dr., serta cara menulis dan membacanya."
    vi: "Dạng rút gọn của từ, chức danh và tên, như v.v. và TS., cùng cách viết và đọc chúng."

connected-speech:
  title: { en: Connected speech, uk: Звуки в потоці мовлення, es: "Habla continua", pt: "Fala conectada", fr: "Chaîne parlée", de: "Sprechfluss", it: "Parlato continuo", pl: "Mowa ciągła", tr: "Bağlı konuşma", id: "Ujaran bersambung", vi: "Lời nói liền mạch" }
  description:
    en: "How sounds link, reduce and change in running speech: weak forms, linking, elision and assimilation."
    uk: "Як звуки сполучаються, редукуються й змінюються в потоці мовлення: ненаголошені форми, сполучення, випадіння й асиміляція."
    es: "Cómo se unen, se reducen y cambian los sonidos en el habla continua: formas débiles, enlaces, elisión y asimilación."
    pt: "Como os sons se ligam, se reduzem e mudam na fala contínua: formas fracas, ligação, elisão e assimilação."
    fr: "Comment les sons s’enchaînent, se réduisent et changent dans la parole continue : formes faibles, liaison, élision et assimilation."
    de: "Wie Laute im fließenden Sprechen verbunden, abgeschwächt und verändert werden: Schwachformen, Bindung, Elision und Assimilation."
    it: "Come i suoni si legano, si riducono e cambiano nel parlato continuo: forme deboli, legamenti, elisione e assimilazione."
    pl: "Jak dźwięki łączą się, redukują i zmieniają w mowie ciągłej: formy słabe, łączenie, elizja i asymilacja."
    tr: "Seslerin akıcı konuşmada nasıl bağlandığı, zayıfladığı ve değiştiği: zayıf biçimler, bağlama, ses düşmesi ve benzeşme."
    id: "Bagaimana bunyi bersambung, melemah, dan berubah dalam ujaran yang mengalir: bentuk lemah, penautan, elisi, dan asimilasi."
    vi: "Cách các âm nối, yếu đi và biến đổi trong lời nói liền mạch: dạng yếu, nối âm, lược âm và đồng hóa âm."

spelling:
  title: { en: Spelling, uk: Правопис, es: "Ortografía", pt: "Ortografia", fr: "Orthographe", de: "Rechtschreibung", it: "Ortografia", pl: "Ortografia", tr: "Yazım", id: "Ejaan", vi: "Chính tả" }
  description:
    en: "How words are spelled: letter patterns, doubled letters, silent letters and differences between varieties."
    uk: "Як пишуться слова: сполучення літер, подвоєні літери, літери, що не вимовляються, та відмінності між варіантами мови."
    es: "Cómo se escriben las palabras: patrones de letras, letras dobles, letras mudas y diferencias entre variedades."
    pt: "Como as palavras se escrevem: padrões de letras, letras dobradas, letras mudas e diferenças entre variedades."
    fr: "Comment les mots s’écrivent : combinaisons de lettres, lettres doubles, lettres muettes et différences entre variétés."
    de: "Wie Wörter geschrieben werden: Buchstabenmuster, Doppelbuchstaben, stumme Buchstaben und Unterschiede zwischen den Varietäten."
    it: "Come si scrivono le parole: schemi di lettere, doppie, lettere mute e differenze tra le varietà."
    pl: "Jak pisze się wyrazy: układy liter, podwojone litery, litery nieme i różnice między odmianami."
    tr: "Sözcüklerin nasıl yazıldığı: harf kalıpları, çift harfler, okunmayan harfler ve çeşitler arasındaki farklar."
    id: "Bagaimana kata dieja: pola huruf, huruf rangkap, huruf bisu, dan perbedaan antarragam."
    vi: "Cách viết đúng các từ: kiểu kết hợp chữ cái, chữ cái đôi, chữ cái câm và khác biệt giữa các biến thể."

clause-patterns:
  title: { en: Objects and complements, uk: Додатки й предикативи, es: "Complementos del verbo", pt: "Complementos do verbo", fr: "Compléments du verbe", de: "Ergänzungen des Verbs", it: "Complementi del verbo", pl: "Uzupełnienia czasownika", tr: "Fiilin tümleçleri", id: "Objek dan pelengkap", vi: "Tân ngữ và bổ ngữ" }
  description:
    en: "The objects and complements a verb takes: give someone something, make someone happy, put it somewhere."
    uk: "Додатки й предикативи, яких потребує дієслово: дати комусь щось, зробити когось щасливим, покласти щось кудись."
    es: "Los objetos y complementos que lleva un verbo: dar algo a alguien, hacer feliz a alguien, poner algo en un sitio."
    pt: "Os objetos e complementos que um verbo pede: dar algo a alguém, deixar alguém feliz, pôr algo em algum lugar."
    fr: "Les objets et compléments que prend un verbe : donner quelque chose à quelqu’un, rendre quelqu’un heureux, mettre quelque chose quelque part."
    de: "Die Objekte und Ergänzungen, die ein Verb verlangt: jemandem etwas geben, jemanden glücklich machen, etwas irgendwohin legen."
    it: "Gli oggetti e i complementi che un verbo richiede: dare qualcosa a qualcuno, rendere qualcuno felice, mettere qualcosa da qualche parte."
    pl: "Dopełnienia i uzupełnienia, których wymaga czasownik: dać komuś coś, uszczęśliwić kogoś, położyć coś gdzieś."
    tr: "Bir fiilin aldığı nesneler ve tümleçler: birine bir şey vermek, birini mutlu etmek, bir şeyi bir yere koymak."
    id: "Objek dan pelengkap yang diambil sebuah kata kerja: memberi seseorang sesuatu, membuat seseorang senang, menaruh sesuatu di suatu tempat."
    vi: "Tân ngữ và bổ ngữ mà một động từ đi kèm: đưa cho ai cái gì, làm ai vui, đặt cái gì ở đâu đó."

modal-perfect:
  title: { en: Modals in the past, uk: Модальні дієслова в минулому, es: "Modales en pasado", pt: "Modais no passado", fr: "Modaux au passé", de: "Modalverben der Vergangenheit", it: "Modali al passato", pl: "Czasowniki modalne w przeszłości", tr: "Geçmişte kip fiilleri", id: "Modal di masa lampau", vi: "Động từ khuyết thiếu ở quá khứ" }
  description:
    en: "A modal verb with a perfect form: deduction, criticism, regret and unneeded action in the past."
    uk: "Модальне дієслово з перфектною формою: припущення, докір, жаль і зайва дія в минулому."
    es: "Un verbo modal con forma de perfecto: deducción, crítica, lamento y acción innecesaria en el pasado."
    pt: "Um verbo modal com forma de perfeito: dedução, crítica, arrependimento e ação desnecessária no passado."
    fr: "Un verbe modal avec une forme composée : déduction, reproche, regret et action inutile dans le passé."
    de: "Ein Modalverb mit Perfektform: Schlussfolgerung, Kritik, Bedauern und unnötige Handlung in der Vergangenheit."
    it: "Un verbo modale con forma composta: deduzione, critica, rimpianto e azione inutile nel passato."
    pl: "Czasownik modalny z formą perfect: wnioskowanie, krytyka, żal i niepotrzebna czynność w przeszłości."
    tr: "Bir kip fiilinin bitmişlik biçimiyle kullanımı: çıkarım, eleştiri, pişmanlık ve geçmişte gereksiz yapılan eylem."
    id: "Kata kerja modal dengan bentuk perfek: dugaan, kritik, penyesalan, dan tindakan yang tidak perlu di masa lampau."
    vi: "Động từ khuyết thiếu với dạng hoàn thành: suy đoán, chê trách, nuối tiếc và hành động không cần thiết trong quá khứ."

semi-modals:
  title: { en: Semi-modal verbs, uk: Напівмодальні дієслова, es: "Verbos semimodales", pt: "Verbos semimodais", fr: "Semi-modaux", de: "Halbmodalverben", it: "Verbi semimodali", pl: "Czasowniki półmodalne", tr: "Yarı kip fiilleri", id: "Kata kerja semimodal", vi: "Động từ bán khuyết thiếu" }
  description:
    en: Verbs that work both as modals and as main verbs, such as need and dare.
    uk: "Дієслова, що виступають і як модальні, і як повнозначні, як-от need і dare."
    es: "Verbos que funcionan a la vez como modales y como verbos principales, como need y dare."
    pt: "Verbos que funcionam tanto como modais quanto como verbos principais, como need e dare."
    fr: "Verbes qui fonctionnent à la fois comme modaux et comme verbes pleins, comme need et dare."
    de: "Verben, die sowohl als Modalverben als auch als Vollverben funktionieren, wie need und dare."
    it: "Verbi che funzionano sia da modali sia da verbi principali, come need e dare."
    pl: "Czasowniki działające zarówno jak modalne, jak i jak czasowniki główne, na przykład need i dare."
    tr: "Hem kip fiili hem de ana fiil olarak çalışan fiiller, need ve dare gibi."
    id: "Kata kerja yang berfungsi sebagai modal sekaligus sebagai kata kerja utama, seperti need dan dare."
    vi: "Động từ vừa hoạt động như động từ khuyết thiếu vừa như động từ chính, như need và dare."

will-shall:
  title: { en: Will and shall, uk: Will і shall, es: Will y shall, pt: "Will e shall", fr: "Will et shall", de: "Will und shall", it: "Will e shall", pl: "Will i shall", tr: "Will ve shall", id: "Will dan shall", vi: "Will và shall" }
  description:
    en: "Will and shall beyond plain future: assumption, habit, willingness, refusal, offers and formal duty."
    uk: "Will і shall поза простим майбутнім: припущення, звичка, готовність, відмова, пропозиції й офіційний обов’язок."
    es: "Will y shall más allá del futuro simple: suposición, hábito, disposición, negativa, ofrecimientos y deber formal."
    pt: "Will e shall além do futuro simples: suposição, hábito, disposição, recusa, ofertas e dever formal."
    fr: "Will et shall au-delà du futur simple : supposition, habitude, bonne volonté, refus, offres et obligation formelle."
    de: "Will und shall über die reine Zukunft hinaus: Annahme, Gewohnheit, Bereitschaft, Weigerung, Angebote und förmliche Pflicht."
    it: "Will e shall oltre il semplice futuro: supposizione, abitudine, disponibilità, rifiuto, offerte e dovere formale."
    pl: "Will i shall poza zwykłą przyszłością: przypuszczenie, zwyczaj, gotowość, odmowa, propozycje i obowiązek formalny."
    tr: "Düz gelecek anlamının ötesinde will ve shall: varsayım, alışkanlık, isteklilik, ret, teklif ve resmî yükümlülük."
    id: "Will dan shall di luar makna masa depan biasa: dugaan, kebiasaan, kesediaan, penolakan, tawaran, dan kewajiban formal."
    vi: "Will và shall ngoài nghĩa tương lai thông thường: phỏng đoán, thói quen, sự sẵn lòng, từ chối, lời đề nghị và nghĩa vụ trang trọng."

wishes:
  title: { en: Wishes and unreal situations, uk: Бажання й нереальні ситуації, es: "Deseos y situaciones irreales", pt: "Desejos e situações irreais", fr: "Souhaits et situations irréelles", de: "Wünsche und irreale Situationen", it: "Desideri e situazioni irreali", pl: "Życzenia i sytuacje nierzeczywiste", tr: "Dilekler ve gerçek dışı durumlar", id: "Harapan dan situasi tidak nyata", vi: "Điều ước và tình huống không có thật" }
  description:
    en: "Wishes and unreal comparisons that use a past tense for a situation that is not real: wish, if only, as if, it's time."
    uk: "Бажання й нереальні порівняння, де минулий час передає ситуацію, якої немає насправді: wish, if only, as if, it’s time."
    es: "Deseos y comparaciones irreales que usan un tiempo pasado para una situación que no es real: wish, if only, as if, it’s time."
    pt: "Desejos e comparações irreais que usam um tempo passado para uma situação que não é real: wish, if only, as if, it’s time."
    fr: "Souhaits et comparaisons irréelles qui emploient un temps du passé pour une situation qui n’est pas réelle : wish, if only, as if, it’s time."
    de: "Wünsche und irreale Vergleiche, die für eine nicht wirkliche Situation eine Vergangenheitsform verwenden: wish, if only, as if, it’s time."
    it: "Desideri e paragoni irreali che usano un tempo passato per una situazione non reale: wish, if only, as if, it’s time."
    pl: "Życzenia i porównania nierzeczywiste, w których czas przeszły oznacza sytuację nieprawdziwą: wish, if only, as if, it’s time."
    tr: "Gerçek olmayan bir durum için geçmiş zaman kullanan dilekler ve gerçek dışı karşılaştırmalar: wish, if only, as if, it’s time."
    id: "Harapan dan perbandingan tidak nyata yang memakai kala lampau untuk keadaan yang tidak nyata: wish, if only, as if, it’s time."
    vi: "Điều ước và phép so sánh không có thật dùng thì quá khứ cho một tình huống không có thật: wish, if only, as if, it’s time."

noun-clauses:
  title: { en: Noun clauses, uk: Іменникові підрядні речення, es: "Oraciones sustantivas", pt: "Orações substantivas", fr: "Propositions complétives", de: "Subjekt- und Objektsätze", it: "Proposizioni completive", pl: "Zdania rzeczownikowe", tr: "Ad cümlecikleri", id: "Klausa nominal", vi: "Mệnh đề danh từ" }
  description:
    en: "Clauses that work as a subject, object or complement: that-clauses, wh-clauses, if/whether clauses."
    uk: "Підрядні речення в ролі підмета, додатка чи предикатива: з that, з питальними словами, з if або whether."
    es: "Oraciones que funcionan como sujeto, objeto o complemento: con that, con palabras interrogativas y con if o whether."
    pt: "Orações que funcionam como sujeito, objeto ou complemento: com that, com palavras interrogativas e com if ou whether."
    fr: "Propositions qui fonctionnent comme sujet, objet ou complément : avec that, avec un mot interrogatif et avec if ou whether."
    de: "Nebensätze als Subjekt, Objekt oder Ergänzung: mit that, mit Fragewörtern und mit if oder whether."
    it: "Frasi che funzionano da soggetto, oggetto o complemento: con that, con parole interrogative e con if o whether."
    pl: "Zdania pełniące funkcję podmiotu, dopełnienia lub orzecznika: z that, z zaimkami pytajnymi i z if lub whether."
    tr: "Özne, nesne ya da tümleç görevi gören cümlecikler: that ile, soru sözcükleriyle ve if ya da whether ile."
    id: "Klausa yang berfungsi sebagai subjek, objek, atau pelengkap: dengan that, dengan kata tanya, dan dengan if atau whether."
    vi: "Mệnh đề đóng vai trò chủ ngữ, tân ngữ hoặc bổ ngữ: với that, với từ để hỏi và với if hoặc whether."

emphasis:
  title: { en: Emphasis, uk: Виділення, es: "Énfasis", pt: "Ênfase", fr: "Mise en relief", de: "Hervorhebung", it: "Enfasi", pl: "Uwypuklanie", tr: "Vurgu", id: "Penekanan", vi: "Nhấn mạnh" }
  description:
    en: "Ways to put one part of a sentence in focus: emphatic do, cleft sentences, fronting."
    uk: "Способи виділити одну частину речення: підсильне do, виділювальні конструкції, винесення вперед."
    es: "Formas de poner en foco una parte de la oración: do enfático, oraciones hendidas, anteposición."
    pt: "Formas de pôr em foco uma parte da frase: do enfático, frases clivadas, anteposição."
    fr: "Façons de mettre en relief une partie de la phrase : do emphatique, phrases clivées, antéposition."
    de: "Möglichkeiten, einen Satzteil in den Fokus zu rücken: betontes do, Spaltsätze, Voranstellung."
    it: "Modi per mettere a fuoco una parte della frase: do enfatico, frasi scisse, anteposizione."
    pl: "Sposoby wyróżnienia jednej części zdania: emfatyczne do, zdania rozszczepione, przesunięcie na początek."
    tr: "Cümlenin bir bölümünü öne çıkarma yolları: vurgulu do, yarık cümleler, başa alma."
    id: "Cara menyorot satu bagian kalimat: do penekanan, kalimat belah, pemindahan ke depan."
    vi: "Các cách làm nổi bật một phần của câu: do nhấn mạnh, câu chẻ, đảo lên đầu câu."

inversion:
  title: { en: Inversion, uk: Інверсія, es: "Inversión", pt: "Inversão", fr: "Inversion", de: "Inversion", it: "Inversione", pl: "Inwersja", tr: "Devrik yapı", id: "Inversi", vi: "Đảo ngữ" }
  description:
    en: A verb or auxiliary placed before its subject for emphasis or in fixed patterns.
    uk: "Дієслово чи допоміжне дієслово перед підметом для виділення або у сталих зворотах."
    es: "Un verbo o auxiliar colocado delante de su sujeto para dar énfasis o en estructuras fijas."
    pt: "Um verbo ou auxiliar colocado antes do sujeito para dar ênfase ou em estruturas fixas."
    fr: "Un verbe ou un auxiliaire placé devant son sujet pour la mise en relief ou dans des tournures figées."
    de: "Ein Verb oder Hilfsverb vor dem Subjekt, zur Betonung oder in festen Mustern."
    it: "Un verbo o un ausiliare posto prima del soggetto per enfasi o in strutture fisse."
    pl: "Czasownik lub czasownik posiłkowy przed podmiotem dla podkreślenia albo w stałych konstrukcjach."
    tr: "Vurgu için ya da kalıplaşmış yapılarda öznenin önüne konan fiil veya yardımcı fiil."
    id: "Kata kerja atau kata kerja bantu yang diletakkan sebelum subjeknya untuk penekanan atau dalam pola tetap."
    vi: "Động từ hoặc trợ động từ đặt trước chủ ngữ để nhấn mạnh hoặc trong các mẫu cố định."

ellipsis:
  title: { en: Ellipsis, uk: Еліпсис, es: "Elipsis", pt: "Elipse", fr: "Ellipse", de: "Ellipse", it: "Ellissi", pl: "Elipsa", tr: "Eksiltme", id: "Elipsis", vi: "Tỉnh lược" }
  description:
    en: "Leaving words out or replacing them with a short form when the meaning is clear: so, not, do so, one."
    uk: "Пропуск слів або заміна їх короткою формою, коли зміст зрозумілий: so, not, do so, one."
    es: "Omitir palabras o sustituirlas por una forma breve cuando el sentido es claro: so, not, do so, one."
    pt: "Omitir palavras ou substituí-las por uma forma breve quando o sentido é claro: so, not, do so, one."
    fr: "Omettre des mots ou les remplacer par une forme brève quand le sens est clair : so, not, do so, one."
    de: "Wörter weglassen oder durch eine Kurzform ersetzen, wenn der Sinn klar ist: so, not, do so, one."
    it: "Omettere parole o sostituirle con una forma breve quando il senso è chiaro: so, not, do so, one."
    pl: "Pomijanie wyrazów lub zastępowanie ich krótką formą, gdy sens jest jasny: so, not, do so, one."
    tr: "Anlam açıkken sözcükleri düşürmek ya da kısa bir biçimle değiştirmek: so, not, do so, one."
    id: "Menghilangkan kata atau menggantinya dengan bentuk singkat ketika maknanya jelas: so, not, do so, one."
    vi: "Bỏ bớt từ hoặc thay bằng một dạng ngắn khi nghĩa đã rõ: so, not, do so, one."

discourse-markers:
  title: { en: Discourse markers, uk: Дискурсивні маркери, es: "Marcadores del discurso", pt: "Marcadores discursivos", fr: "Marqueurs discursifs", de: "Diskursmarker", it: "Segnali discorsivi", pl: "Markery dyskursu", tr: "Söylem belirteçleri", id: "Penanda wacana", vi: "Dấu hiệu diễn ngôn" }
  description:
    en: "Words and phrases that structure talk and show the speaker's attitude: well, anyway, I mean."
    uk: "Слова й звороти, що упорядковують розмову й показують ставлення мовця: ну, взагалі, тобто."
    es: "Palabras y expresiones que ordenan la conversación y muestran la actitud del hablante: bueno, en fin, o sea."
    pt: "Palavras e expressões que organizam a conversa e mostram a atitude de quem fala: bem, enfim, quer dizer."
    fr: "Mots et expressions qui structurent la conversation et montrent l’attitude de celui qui parle : bon, enfin, je veux dire."
    de: "Wörter und Wendungen, die das Gespräch gliedern und die Haltung des Sprechers zeigen: na ja, jedenfalls, ich meine."
    it: "Parole ed espressioni che organizzano il discorso e mostrano l’atteggiamento di chi parla: beh, comunque, cioè."
    pl: "Słowa i zwroty porządkujące rozmowę i pokazujące postawę mówiącego: no cóż, w każdym razie, to znaczy."
    tr: "Konuşmayı düzenleyen ve konuşanın tutumunu gösteren sözcükler ve söz öbekleri: neyse, her neyse, yani."
    id: "Kata dan frasa yang menata percakapan dan menunjukkan sikap pembicara: yah, pokoknya, maksud saya."
    vi: "Từ và cụm từ tổ chức lời nói và cho thấy thái độ của người nói: ừm, dù sao, ý tôi là."

noun-phrase:
  title: { en: Noun phrases, uk: Іменникові групи, es: "Sintagma nominal", pt: "Sintagma nominal", fr: "Groupe nominal", de: "Nominalgruppe", it: "Sintagma nominale", pl: "Grupa rzeczownikowa", tr: "Ad öbeği", id: "Frasa nomina", vi: "Cụm danh từ" }
  description:
    en: The structure of a noun with its determiners, modifiers and complements, and nouns used in place of verbs and clauses.
    uk: "Будова іменника з детермінативами, означеннями й доповненнями та іменники замість дієслів і підрядних речень."
    es: "La estructura de un sustantivo con sus determinantes, modificadores y complementos, y los sustantivos usados en lugar de verbos y oraciones."
    pt: "A estrutura de um substantivo com seus determinantes, modificadores e complementos, e os substantivos usados no lugar de verbos e orações."
    fr: "La structure d’un nom avec ses déterminants, ses modificateurs et ses compléments, et les noms employés à la place de verbes et de propositions."
    de: "Der Aufbau eines Nomens mit Artikelwörtern, Attributen und Ergänzungen sowie Nomen anstelle von Verben und Nebensätzen."
    it: "La struttura di un nome con i suoi determinanti, modificatori e complementi, e i nomi usati al posto di verbi e proposizioni."
    pl: "Budowa rzeczownika z określnikami, modyfikatorami i dopełnieniami oraz rzeczowniki użyte zamiast czasowników i zdań."
    tr: "Bir adın belirleyicileri, niteleyicileri ve tümleçleriyle yapısı ve fiillerin ve cümlelerin yerine kullanılan adlar."
    id: "Struktur kata benda beserta penentu, pewatas, dan pelengkapnya, serta kata benda yang dipakai sebagai pengganti kata kerja dan klausa."
    vi: "Cấu trúc của danh từ cùng các từ hạn định, từ bổ nghĩa và bổ ngữ, và danh từ dùng thay cho động từ và mệnh đề."

stance:
  title: { en: Speaker stance, uk: Позиція мовця, es: "Actitud del hablante", pt: "Atitude do falante", fr: "Position du locuteur", de: "Haltung des Sprechers", it: "Atteggiamento del parlante", pl: "Postawa mówiącego", tr: "Konuşanın tutumu", id: "Sikap pembicara", vi: "Thái độ của người nói" }
  description:
    en: "The speaker's attitude to what is said and how sure the speaker is: frankly, obviously, arguably."
    uk: "Ставлення мовця до сказаного й міра його впевненості: відверто кажучи, очевидно, мабуть."
    es: "La actitud del hablante ante lo que dice y su grado de seguridad: francamente, evidentemente, probablemente."
    pt: "A atitude de quem fala diante do que diz e o quanto tem certeza: francamente, obviamente, provavelmente."
    fr: "L’attitude du locuteur envers ce qu’il dit et son degré de certitude : franchement, évidemment, sans doute."
    de: "Die Haltung des Sprechers zum Gesagten und wie sicher er sich ist: ehrlich gesagt, offensichtlich, wohl."
    it: "L’atteggiamento di chi parla verso ciò che dice e il suo grado di sicurezza: francamente, ovviamente, probabilmente."
    pl: "Postawa mówiącego wobec tego, co mówi, i pewność, z jaką to mówi: szczerze mówiąc, oczywiście, być może."
    tr: "Konuşanın söylediğine karşı tutumu ve ne kadar emin olduğu: açıkçası, belli ki, muhtemelen."
    id: "Sikap pembicara terhadap apa yang dikatakan dan seberapa yakin dia: terus terang, jelas, barangkali."
    vi: "Thái độ của người nói với điều mình nói và mức độ chắc chắn: thành thật mà nói, rõ ràng, có lẽ."
