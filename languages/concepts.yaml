# yaml-language-server: $schema=schema/concepts.schema.json
# Language-neutral keys that pair topics across languages. Topics list them in `concepts`.

alphabet:
  title: { en: Alphabet, uk: Алфавіт, es: Alfabeto }
  description:
    en: The letters and their names.
    uk: "Літери та їхні назви."
    es: "Las letras y sus nombres."

pronunciation:
  title: { en: Pronunciation, uk: Вимова, es: Pronunciación }
  description:
    en: The sounds of a language, how to write them in IPA, and word stress.
    uk: "Звуки мови, їх запис у МФА та наголос у словах."
    es: "Los sonidos de una lengua, cómo escribirlos en AFI y el acento de las palabras."

present-tense:
  title: { en: Present tense, uk: Теперішній час, es: Presente }
  description:
    en: "Present-time verb forms: habits, facts, states."
    uk: "Форми дієслова для теперішнього: звички, факти, стани."
    es: "Formas verbales del presente: hábitos, hechos, estados."

numbers:
  title: { en: Numbers, uk: Числа, es: Números }
  description:
    en: Cardinal and ordinal numbers, how to say and write them.
    uk: "Кількісні та порядкові числівники: як їх вимовляти й записувати."
    es: "Números cardinales y ordinales: cómo decirlos y escribirlos."

dates:
  title: { en: Dates, uk: Дати, es: Fechas }
  description:
    en: Days of the week, months, and how to say and write dates and years.
    uk: "Дні тижня, місяці, а також як вимовляти й записувати дати й роки."
    es: "Los días de la semana, los meses y cómo decir y escribir fechas y años."

telling-time:
  title: { en: Telling the time, uk: Котра година, es: La hora }
  description:
    en: How to ask for and say the time.
    uk: "Як запитати, котра година, і як її назвати."
    es: "Cómo preguntar y decir la hora."

number:
  title: { en: Singular and plural, uk: Однина та множина, es: Singular y plural }
  description:
    en: How nouns change from singular to plural.
    uk: "Як іменники змінюються з однини на множину."
    es: "Cómo pasan los sustantivos del singular al plural."

articles:
  title: { en: Articles, uk: Артиклі, es: Artículos }
  description:
    en: Definite and indefinite articles and when to use them.
    uk: "Означений і неозначений артиклі та коли їх уживати."
    es: "Los artículos determinados e indeterminados y cuándo usarlos."

countability:
  title: { en: Countable and uncountable nouns, uk: Злічувані та незлічувані іменники, es: Sustantivos contables e incontables }
  description:
    en: Nouns that can be counted and nouns that cannot.
    uk: "Іменники, які можна порахувати, і ті, які не можна."
    es: "Sustantivos que se pueden contar y sustantivos que no."

quantifiers:
  title: { en: Quantifiers, uk: Кількісні слова, es: Cuantificadores }
  description:
    en: Words that say how much or how many.
    uk: "Слова, що кажуть, скільки чогось."
    es: "Palabras que dicen cuánto o cuántos."

demonstratives:
  title: { en: Demonstratives, uk: Вказівні слова, es: Demostrativos }
  description:
    en: Words that point to things near or far.
    uk: "Слова, що вказують на близьке чи далеке."
    es: "Palabras que señalan cosas cercanas o lejanas."

possession:
  title: { en: Possession, uk: Присвійність, es: Posesión }
  description:
    en: How to say who something belongs to.
    uk: "Як сказати, кому щось належить."
    es: "Cómo decir a quién pertenece algo."

pronouns:
  title: { en: Personal pronouns, uk: Особові займенники, es: Pronombres personales }
  description:
    en: "Words for people and things: subject, object and possessive forms."
    uk: "Слова для людей і речей: форми підмета, додатка та присвійні."
    es: "Palabras para personas y cosas: formas de sujeto, de objeto y posesivas."

indefinite-pronouns:
  title: { en: Indefinite pronouns, uk: Неозначені займенники, es: Pronombres indefinidos }
  description:
    en: "Words for a person, thing or place that is unknown or general: somebody, nothing."
    uk: "Слова для невідомої чи загальної особи, речі або місця: somebody, nothing."
    es: "Palabras para una persona, cosa o lugar desconocido o general: somebody, nothing."

be:
  title: { en: The verb to be, uk: Дієслово to be, es: El verbo to be }
  description:
    en: "The verb that links a subject to a description, a place or an identity."
    uk: "Дієслово, що поєднує підмет з описом, місцем чи тотожністю."
    es: "El verbo que une un sujeto con una descripción, un lugar o una identidad."

have:
  title: { en: The verb have, uk: Дієслово have, es: El verbo have }
  description:
    en: "Possession, family, features and fixed expressions with have."
    uk: "Володіння, родина, риси та сталі вирази з have."
    es: "Posesión, familia, rasgos y expresiones fijas con have."

existence:
  title: { en: Existence, uk: Наявність, es: Existencia }
  description:
    en: "How to say that something exists or is in a place: there is, there are."
    uk: "Як сказати, що щось існує або є в певному місці: there is, there are."
    es: "Cómo decir que algo existe o está en un lugar: there is, there are."

imperative:
  title: { en: Imperative, uk: Наказовий спосіб, es: Imperativo }
  description:
    en: Orders, instructions, invitations and warnings.
    uk: "Накази, інструкції, запрошення й застереження."
    es: "Órdenes, instrucciones, invitaciones y advertencias."

irregular-verbs:
  title: { en: Irregular verbs, uk: Неправильні дієслова, es: Verbos irregulares }
  description:
    en: Verbs whose forms do not follow the regular pattern.
    uk: "Дієслова, форми яких не утворюються за правилом."
    es: "Verbos cuyas formas no siguen el patrón regular."

continuous:
  title: { en: Continuous aspect, uk: Тривалий вид, es: Aspecto continuo }
  description:
    en: "Actions in progress at a moment: be + -ing."
    uk: "Дії, що відбуваються в певний момент: be + -ing."
    es: "Acciones en curso en un momento: be + -ing."

past-tense:
  title: { en: Past tense, uk: Минулий час, es: Pasado }
  description:
    en: Verb forms for finished actions and past situations.
    uk: "Форми дієслова для завершених дій і минулих ситуацій."
    es: "Formas verbales para acciones terminadas y situaciones pasadas."

present-perfect:
  title: { en: Present perfect, uk: Present Perfect, es: Presente perfecto }
  description:
    en: "have + past participle: past actions connected to the present."
    uk: "have + дієприкметник минулого часу: минулі дії, пов’язані з теперішнім."
    es: "have + participio pasado: acciones pasadas relacionadas con el presente."

past-perfect:
  title: { en: Past perfect, uk: Past Perfect, es: Pasado perfecto }
  description:
    en: An action before another past action.
    uk: "Дія, що сталася раніше за іншу минулу дію."
    es: "Una acción anterior a otra acción pasada."

past-habits:
  title: { en: Past habits, uk: Минулі звички, es: Hábitos del pasado }
  description:
    en: Repeated actions and states in the past that are over now.
    uk: "Повторювані дії та стани в минулому, яких тепер уже немає."
    es: "Acciones repetidas y estados del pasado que ya terminaron."

future:
  title: { en: Future, uk: Майбутнє, es: Futuro }
  description:
    en: Plans, predictions, decisions and arrangements.
    uk: "Плани, прогнози, рішення й домовленості."
    es: "Planes, predicciones, decisiones y citas acordadas."

tenses:
  title: { en: Tense system, uk: Система часів, es: Sistema de tiempos }
  description:
    en: All tenses side by side, with their main uses.
    uk: "Усі часи поруч, з їхніми основними вживаннями."
    es: "Todos los tiempos lado a lado, con sus usos principales."

ability:
  title: { en: Ability and permission, uk: Уміння та дозвіл, es: Capacidad y permiso }
  description:
    en: "Saying what someone can do and asking for permission."
    uk: "Як сказати, що хтось уміє, і як попросити дозволу."
    es: "Decir lo que alguien puede hacer y pedir permiso."

obligation:
  title: { en: Obligation, uk: Обов’язок, es: Obligación }
  description:
    en: Rules, necessity and what is not necessary.
    uk: "Правила, необхідність і те, що не обов’язкове."
    es: "Reglas, necesidad y lo que no es necesario."

advice:
  title: { en: Advice, uk: Порада, es: Consejo }
  description:
    en: Giving and asking for advice and opinions.
    uk: "Як давати поради й питати поради та думки."
    es: "Dar y pedir consejos y opiniones."

possibility:
  title: { en: Possibility, uk: Можливість, es: Posibilidad }
  description:
    en: How sure we are that something is true or will happen.
    uk: "Наскільки ми впевнені, що щось правда або станеться."
    es: "Lo seguros que estamos de que algo es verdad o va a pasar."

conditional-mood:
  title: { en: Conditional mood, uk: Умовний спосіб, es: Modo condicional }
  description:
    en: "Imagined situations, polite requests and offers: would."
    uk: "Уявні ситуації, ввічливі прохання та пропозиції: would."
    es: "Situaciones imaginadas, peticiones y ofrecimientos corteses: would."

word-order:
  title: { en: Word order, uk: Порядок слів, es: Orden de las palabras }
  description:
    en: The order of subject, verb, object and other parts of the sentence.
    uk: "Порядок підмета, присудка, додатка та інших членів речення."
    es: "El orden del sujeto, el verbo, el objeto y las demás partes de la oración."

questions-negatives:
  title: { en: Questions and negatives, uk: Питання та заперечення, es: Preguntas y negaciones }
  description:
    en: How to make questions and negative sentences.
    uk: "Як утворювати питальні та заперечні речення."
    es: "Cómo formar preguntas y oraciones negativas."

linkers:
  title: { en: Linkers, uk: Слова-зв’язки, es: Conectores }
  description:
    en: "Words that join ideas: and, but, because, so, although."
    uk: "Слова, що поєднують думки: and, but, because, so, although."
    es: "Palabras que unen ideas: and, but, because, so, although."

conditionals:
  title: { en: Conditional sentences, uk: Умовні речення, es: Oraciones condicionales }
  description:
    en: "if-sentences: real, possible and imagined conditions."
    uk: "Речення з if: реальні, можливі й уявні умови."
    es: "Oraciones con if: condiciones reales, posibles e imaginadas."

relative-clauses:
  title: { en: Relative clauses, uk: Означальні підрядні речення, es: Oraciones de relativo }
  description:
    en: "Clauses that describe a noun: who, which, that, where."
    uk: "Підрядні речення, що описують іменник: who, which, that, where."
    es: "Oraciones que describen un sustantivo: who, which, that, where."

passive:
  title: { en: Passive voice, uk: Пасивний стан, es: Voz pasiva }
  description:
    en: Sentences that focus on the action or the thing affected, not the doer.
    uk: "Речення, у центрі яких дія або предмет, на який вона спрямована, а не виконавець."
    es: "Oraciones que se centran en la acción o en lo afectado, no en quien la realiza."

reported-speech:
  title: { en: Reported speech, uk: Непряма мова, es: Estilo indirecto }
  description:
    en: How to report what someone said or asked.
    uk: "Як переказати, що хтось сказав або запитав."
    es: "Cómo contar lo que alguien dijo o preguntó."

verb-patterns:
  title: { en: Verb patterns, uk: Моделі дієслів, es: Patrones verbales }
  description:
    en: "The form of a verb after another verb: -ing or to + infinitive."
    uk: "Форма дієслова після іншого дієслова: -ing або to + інфінітив."
    es: "La forma de un verbo después de otro verbo: -ing o to + infinitivo."

question-tags:
  title: { en: Question tags, uk: Розділові питання, es: Preguntas coletilla }
  description:
    en: "Short questions at the end of a sentence: isn't it?, don't you?"
    uk: "Короткі питання наприкінці речення: isn't it?, don't you?"
    es: "Preguntas cortas al final de una oración: isn't it?, don't you?"

adjectives:
  title: { en: Adjectives, uk: Прикметники, es: Adjetivos }
  description:
    en: The form and position of adjectives.
    uk: "Форма та місце прикметників."
    es: "La forma y la posición de los adjetivos."

comparison:
  title: { en: Comparison, uk: Порівняння, es: Comparación }
  description:
    en: Comparatives and superlatives.
    uk: "Вищий і найвищий ступені порівняння."
    es: "Comparativos y superlativos."

adverbs:
  title: { en: Adverbs, uk: Прислівники, es: Adverbios }
  description:
    en: Words that say how, how often, when and where.
    uk: "Слова, що кажуть як, як часто, коли й де."
    es: "Palabras que dicen cómo, con qué frecuencia, cuándo y dónde."

degree:
  title: { en: Degree, uk: Міра, es: Grado }
  description:
    en: "How much of a quality: too, enough, so, such, very."
    uk: "Наскільки виражена ознака: too, enough, so, such, very."
    es: "Cuánto de una cualidad: too, enough, so, such, very."

prepositions-time:
  title: { en: Prepositions of time, uk: Прийменники часу, es: Preposiciones de tiempo }
  description:
    en: Prepositions before times, days, dates and periods.
    uk: "Прийменники перед годинами, днями, датами й періодами."
    es: "Preposiciones delante de horas, días, fechas y periodos."

prepositions-place:
  title: { en: Prepositions of place and movement, uk: Прийменники місця й руху, es: Preposiciones de lugar y movimiento }
  description:
    en: Where something is and where it goes.
    uk: "Де щось є і куди воно рухається."
    es: "Dónde está algo y adónde va."

phrasal-verbs:
  title: { en: Phrasal verbs, uk: Фразові дієслова, es: Phrasal verbs }
  description:
    en: "Verb + particle with its own meaning: get up, look for."
    uk: "Дієслово + частка з власним значенням: get up, look for."
    es: "Verbo + partícula con un significado propio: get up, look for."

reflexive:
  title: { en: Reflexive forms, uk: Зворотні форми, es: Formas reflexivas }
  description:
    en: "Actions that return to the subject: myself, themselves."
    uk: "Дії, що повертаються до підмета: myself, themselves."
    es: "Acciones que vuelven al sujeto: myself, themselves."
