  title: { en: Verbs of motion, uk: Дієслова руху, es: Verbos de movimiento, pt: "Verbos de movimento", fr: "Verbes de mouvement", de: "Verben der Bewegung", it: "Verbi di moto", pl: "Czasowniki ruchu", tr: "Hareket fiilleri", id: "Kata kerja gerak", vi: "Động từ chuyển động" }
