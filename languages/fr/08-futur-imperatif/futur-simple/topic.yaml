              de: ["Das ", { term: "r" }, " vor der Endung hört man immer: ", { term: "je parlerai" }, " ", { ipa: "ʒə paʁləʁe" }, "."]
              it: ["La ", { term: "r" }, " prima della desinenza si sente sempre: ", { term: "je parlerai" }, " ", { ipa: "ʒə paʁləʁe" }, "."]
              pl: [{ term: "r" }, " przed końcówką zawsze słychać: ", { term: "je parlerai" }, " ", { ipa: "ʒə paʁləʁe" }, "."]
