sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              fr: "Le futur simple est un seul mot : l’infinitif et une terminaison."
              en: "The futur simple is a single word: the infinitive and an ending."
              uk: "Futur simple — це одне слово: інфінітив із закінченням."
              es: "El futur simple es una sola palabra: el infinitivo y una terminación."
              pt: "O futur simple é uma só palavra: o infinitivo e uma terminação."
              de: "Das futur simple ist ein einziges Wort: der Infinitiv und eine Endung."
              it: "Il futur simple è una sola parola: l’infinito e una desinenza."
              pl: "Futur simple to jedno słowo: bezokolicznik i końcówka."
              tr: "Futur simple tek bir sözcüktür: mastar ve bir ek."
              id: "Futur simple adalah satu kata: infinitif dan sebuah akhiran."
              vi: "Futur simple là một từ duy nhất: động từ nguyên mẫu cộng một đuôi."
            ex: { examples: [["Je ", { target: "chanterai" }, "."], ["Ils ", { target: "finiront" }, " demain."]] }
            tr: { en: { examples: ["I'll sing.", "They'll finish tomorrow."] }, uk: { examples: ["Я заспіваю.", "Вони закінчать завтра."] }, es: { examples: ["Cantaré.", "Terminarán mañana."] }, pt: { examples: ["Eu cantarei.", "Eles terminarão amanhã."] }, de: { examples: ["Ich werde singen.", "Sie werden morgen fertig."] }, it: { examples: ["Canterò.", "Finiranno domani."] }, pl: { examples: ["Zaśpiewam.", "Skończą jutro."] }, tr: { examples: ["Şarkı söyleyeceğim.", "Yarın bitirecekler."] }, id: { examples: ["Aku akan bernyanyi.", "Mereka akan selesai besok."] }, vi: { examples: ["Tôi sẽ hát.", "Ngày mai họ sẽ xong."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: "Il sert aux prévisions, aux promesses et à l’avenir plus lointain."
              en: "It serves for predictions, promises and the more distant future."
              uk: "Його вживають для прогнозів, обіцянок і віддаленішого майбутнього."
              es: "Sirve para predicciones, promesas y un futuro más lejano."
              pt: "Serve para previsões, promessas e um futuro mais distante."
              de: "Es dient für Vorhersagen, Versprechen und die fernere Zukunft."
              it: "Serve per previsioni, promesse e un futuro più lontano."
              pl: "Służy do prognoz, obietnic i dalszej przyszłości."
              tr: "Tahminler, sözler ve daha uzak gelecek için kullanılır."
              id: "Dipakai untuk ramalan, janji, dan masa depan yang lebih jauh."
              vi: "Nó dùng cho dự báo, lời hứa và tương lai xa hơn."
            ex: { examples: [["Demain, il ", { target: "fera" }, " beau."], ["Je t’", { target: "aiderai" }, "."]] }
            tr: { en: { examples: ["Tomorrow the weather will be fine.", "I'll help you."] }, uk: { examples: ["Завтра буде гарна погода.", "Я тобі допоможу."] }, es: { examples: ["Mañana hará buen tiempo.", "Te ayudaré."] }, pt: { examples: ["Amanhã fará tempo bom.", "Eu ajudarei você."] }, de: { examples: ["Morgen wird das Wetter schön.", "Ich helfe dir."] }, it: { examples: ["Domani farà bel tempo.", "Ti aiuterò."] }, pl: { examples: ["Jutro będzie ładna pogoda.", "Pomogę ci."] }, tr: { examples: ["Yarın hava güzel olacak.", "Sana yardım edeceğim."] }, id: { examples: ["Besok cuacanya akan cerah.", "Aku akan membantumu."] }, vi: { examples: ["Ngày mai trời sẽ đẹp.", "Tôi sẽ giúp bạn."] } }
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour un projet proche, la langue de tous les jours préfère le futur proche : ", { link: "Le futur proche : je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              en: ["For a near plan, everyday speech prefers the futur proche: ", { link: "Near Future: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              uk: ["Для близького плану щоденне мовлення віддає перевагу futur proche: ", { link: "Близьке майбутнє: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              es: ["Para un plan cercano, la lengua de todos los días prefiere el futur proche: ", { link: "El futuro próximo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              pt: ["Para um plano próximo, a fala do dia a dia prefere o futur proche: ", { link: "O futuro próximo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              de: ["Für einen nahen Plan bevorzugt die Alltagssprache das futur proche: ", { link: "Die Nahzukunft: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              it: ["Per un progetto vicino, la lingua di tutti i giorni preferisce il futur proche: ", { link: "Il futuro prossimo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              pl: ["Dla bliskiego planu mowa codzienna woli futur proche: ", { link: "Bliska przyszłość: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              tr: ["Yakın bir plan için günlük konuşma futur proche’u yeğler: ", { link: "Yakın gelecek: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              id: ["Untuk rencana dekat, bahasa sehari-hari lebih suka futur proche: ", { link: "Masa depan dekat: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              vi: ["Với dự định gần, lời nói hằng ngày thích dùng futur proche hơn: ", { link: "Tương lai gần: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Les formes du présent de ces verbes : ", { link: "Le présent : les verbes irréguliers", to: fr.present.present-irreguliers }, "."]
              en: ["The present forms of these verbs: ", { link: "Present Tense: Irregular Verbs", to: fr.present.present-irreguliers }, "."]
              uk: ["Форми теперішнього часу цих дієслів: ", { link: "Теперішній час: неправильні дієслова", to: fr.present.present-irreguliers }, "."]
              es: ["Las formas del presente de estos verbos: ", { link: "El presente: los verbos irregulares", to: fr.present.present-irreguliers }, "."]
              pt: ["As formas do presente destes verbos: ", { link: "O presente: os verbos irregulares", to: fr.present.present-irreguliers }, "."]
              de: ["Die Präsensformen dieser Verben: ", { link: "Das Präsens: unregelmäßige Verben", to: fr.present.present-irreguliers }, "."]
              it: ["Le forme del presente di questi verbi: ", { link: "Il presente: i verbi irregolari", to: fr.present.present-irreguliers }, "."]
              pl: ["Formy czasu teraźniejszego tych czasowników: ", { link: "Czas teraźniejszy: czasowniki nieregularne", to: fr.present.present-irreguliers }, "."]
              tr: ["Bu fiillerin şimdiki zaman biçimleri: ", { link: "Şimdiki zaman: düzensiz fiiller", to: fr.present.present-irreguliers }, "."]
              id: ["Bentuk present kata kerja ini: ", { link: "Presens: kata kerja tidak beraturan", to: fr.present.present-irreguliers }, "."]
              vi: ["Các dạng hiện tại của những động từ này: ", { link: "Thì hiện tại: động từ bất quy tắc", to: fr.present.present-irreguliers }, "."]
