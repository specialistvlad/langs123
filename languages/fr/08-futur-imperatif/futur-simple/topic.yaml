            ex: { examples: [["Elle ", { target: "attendra" }, " ici."], ["Je ", { target: "répondrai" }, " demain."]] }
            tr: { en: { examples: ["She'll wait here.", "I'll answer tomorrow."] }, uk: { examples: ["Вона чекатиме тут.", "Я відповім завтра."] }, es: { examples: ["Esperará aquí.", "Responderé mañana."] }, pt: { examples: ["Ela esperará aqui.", "Eu responderei amanhã."] }, de: { examples: ["Sie wartet hier.", "Ich antworte morgen."] }, it: { examples: ["Aspetterà qui.", "Risponderò domani."] }, pl: { examples: ["Poczeka tutaj.", "Odpowiem jutro."] }, tr: { examples: ["O burada bekleyecek.", "Yarın cevap vereceğim."] }, id: { examples: ["Dia akan menunggu di sini.", "Aku akan menjawab besok."] }, vi: { examples: ["Cô ấy sẽ đợi ở đây.", "Ngày mai tôi sẽ trả lời."] } }
          - type: "rule"
