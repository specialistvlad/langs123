              id: [{ term: "Y" }, " dan ", { term: "en" }, " juga berada di depan infinitif."]
              vi: [{ term: "Y" }, " và ", { term: "en" }, " cũng đứng trước động từ nguyên mẫu."]
            ex: { examples: [["Je vais ", { target: "y" }, " aller demain."], ["Il va ", { target: "en" }, " prendre deux."]] }
            tr: { en: { examples: ["I'm going to go there tomorrow.", "He's going to take two of them."] }, uk: { examples: ["Завтра я туди піду.", "Він візьме два."] }, es: { examples: ["Mañana voy a ir allí.", "Va a tomar dos."] }, pt: { examples: ["Amanhã eu vou lá.", "Ele vai pegar dois."] }, de: { examples: ["Morgen werde ich dorthin gehen.", "Er wird zwei nehmen."] }, it: { examples: ["Domani ci vado.", "Ne prende due."] }, pl: { examples: ["Jutro tam pójdę.", "On weźmie dwa."] }, tr: { examples: ["Yarın oraya gideceğim.", "O iki tane alacak."] }, id: { examples: ["Besok aku akan pergi ke sana.", "Dia akan mengambil dua."] }, vi: { examples: ["Ngày mai tôi sẽ đến đó.", "Anh ấy sẽ lấy hai cái."] } }
          - type: "note"
