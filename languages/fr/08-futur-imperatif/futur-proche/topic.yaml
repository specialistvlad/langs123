title:
  fr: "Le futur proche : je vais manger"
  en: "Near Future: je vais manger"
  uk: "Близьке майбутнє: je vais manger"
  es: "El futuro próximo: je vais manger"
  pt: "O futuro próximo: je vais manger"
  de: "Die Nahzukunft: je vais manger"
  it: "Il futuro prossimo: je vais manger"
  pl: "Bliska przyszłość: je vais manger"
  tr: "Yakın gelecek: je vais manger"
  id: "Masa depan dekat: je vais manger"
  vi: "Tương lai gần: je vais manger"
summary:
  lead:
    fr: ["Le futur proche se forme avec le présent d’", { term: "aller" }, " et un infinitif : il dit un projet ou ce qui va arriver bientôt."]
    en: ["The near future is the present of ", { term: "aller" }, " plus an infinitive: it names a plan or what is about to happen."]
    uk: ["Близьке майбутнє — це теперішній час ", { term: "aller" }, " та інфінітив: воно називає план або те, що скоро станеться."]
    es: ["El futuro próximo es el presente de ", { term: "aller" }, " más un infinitivo: expresa un plan o lo que está a punto de pasar."]
    pt: ["O futuro próximo é o presente de ", { term: "aller" }, " mais um infinitivo: diz um plano ou o que está prestes a acontecer."]
    de: ["Die Nahzukunft besteht aus dem Präsens von ", { term: "aller" }, " und einem Infinitiv: Sie nennt einen Plan oder etwas, das bald geschieht."]
    it: ["Il futuro prossimo è il presente di ", { term: "aller" }, " più un infinito: dice un progetto o ciò che sta per accadere."]
    pl: ["Bliska przyszłość to czas teraźniejszy ", { term: "aller" }, " i bezokolicznik: wyraża plan lub to, co zaraz się stanie."]
    tr: ["Yakın gelecek, ", { term: "aller" }, " fiilinin şimdiki zamanı ile bir mastardan oluşur: bir planı ya da yakında olacak şeyi anlatır."]
    id: ["Futur proche dibentuk dari present ", { term: "aller" }, " dan infinitif: menyatakan rencana atau hal yang akan segera terjadi."]
    vi: ["Tương lai gần gồm hiện tại của ", { term: "aller" }, " và một động từ nguyên mẫu: diễn tả một dự định hoặc điều sắp xảy ra."]
  rule:
    fr: ["Seul ", { term: "aller" }, " change ; l’infinitif reste tel quel :"]
    en: ["Only ", { term: "aller" }, " changes; the infinitive stays as it is:"]
    uk: ["Змінюється лише ", { term: "aller" }, "; інфінітив залишається незмінним:"]
    es: ["Solo cambia ", { term: "aller" }, "; el infinitivo se queda como está:"]
    pt: ["Só ", { term: "aller" }, " muda; o infinitivo fica como está:"]
    de: ["Nur ", { term: "aller" }, " verändert sich; der Infinitiv bleibt unverändert:"]
    it: ["Cambia solo ", { term: "aller" }, "; l’infinito resta com’è:"]
    pl: ["Zmienia się tylko ", { term: "aller" }, "; bezokolicznik pozostaje bez zmian:"]
    tr: ["Yalnızca ", { term: "aller" }, " çekimlenir; mastar olduğu gibi kalır:"]
    id: ["Hanya ", { term: "aller" }, " yang berubah; infinitif tetap seperti adanya:"]
    vi: ["Chỉ ", { term: "aller" }, " thay đổi; động từ nguyên mẫu giữ nguyên:"]
  ex: { examples: [["Je ", { target: "vais manger" }, " ici."], ["Tu ", { target: "vas venir" }, " ?"]] }
