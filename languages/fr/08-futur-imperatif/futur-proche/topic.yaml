              id: ["Dalam kalimat negatif, pronomina tetap di depan infinitif: ", { term: "ne" }, " … ", { term: "pas" }, " mengapit ", { term: "aller" }, "."]
              vi: ["Trong câu phủ định, đại từ vẫn đứng trước động từ nguyên mẫu: ", { term: "ne" }, " … ", { term: "pas" }, " bao quanh ", { term: "aller" }, "."]
            ex: ["Je ", { target: "ne vais pas" }, " ", { target: "le" }, " dire."]
            tr: { en: "I'm not going to say it.", uk: "Я цього не скажу.", es: "No lo voy a decir.", pt: "Eu não vou dizer isso.", de: "Ich werde es nicht sagen.", it: "Non lo dico.", pl: "Nie powiem tego.", tr: "Bunu söylemeyeceğim.", id: "Aku tidak akan mengatakannya.", vi: "Tôi sẽ không nói điều đó." }
          - type: "rule"
            level: "A2"
            text:
