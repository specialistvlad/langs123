              it: ["In una frase negativa il pronome resta davanti all’infinito: ", { term: "ne" }, " … ", { term: "pas" }, " circonda ", { term: "aller" }, "."]
              pl: ["W zdaniu przeczącym zaimek zostaje przed bezokolicznikiem: ", { term: "ne" }, " … ", { term: "pas" }, " otacza ", { term: "aller" }, "."]
