        items:
          - type: "rule"
            level: "A2"
            text:
              fr: ["Un pronom complément se place devant l’infinitif, jamais devant ", { term: "aller" }, "."]
              en: ["An object pronoun goes before the infinitive, never before ", { term: "aller" }, "."]
              uk: ["Займенник-доповнення стоїть перед інфінітивом, ніколи перед ", { term: "aller" }, "."]
              es: ["Un pronombre complemento va delante del infinitivo, nunca delante de ", { term: "aller" }, "."]
              pt: ["Um pronome complemento vai antes do infinitivo, nunca antes de ", { term: "aller" }, "."]
              de: ["Ein Objektpronomen steht vor dem Infinitiv, nie vor ", { term: "aller" }, "."]
              it: ["Un pronome complemento va davanti all’infinito, mai davanti a ", { term: "aller" }, "."]
              pl: ["Zaimek dopełnieniowy stoi przed bezokolicznikiem, nigdy przed ", { term: "aller" }, "."]
              tr: ["Nesne zamiri mastarın önüne gelir, asla ", { term: "aller" }, " fiilinin önüne değil."]
              id: ["Pronomina objek berada di depan infinitif, tidak pernah di depan ", { term: "aller" }, "."]
              vi: ["Đại từ bổ ngữ đứng trước động từ nguyên mẫu, không bao giờ trước ", { term: "aller" }, "."]
            ex: { examples: [["Je vais ", { target: "le" }, " faire."], ["Elle va ", { target: "m’" }, "appeler."]] }
            tr: { en: { examples: ["I'm going to do it.", "She's going to call me."] }, uk: { examples: ["Я це зроблю.", "Вона мені зателефонує."] }, es: { examples: ["Voy a hacerlo.", "Ella me va a llamar."] }, pt: { examples: ["Eu vou fazê-lo.", "Ela vai me ligar."] }, de: { examples: ["Ich werde es machen.", "Sie wird mich anrufen."] }, it: { examples: ["Lo faccio.", "Lei mi chiamerà."] }, pl: { examples: ["Zrobię to.", "Ona do mnie zadzwoni."] }, tr: { examples: ["Bunu yapacağım.", "O beni arayacak."] }, id: { examples: ["Aku akan melakukannya.", "Dia akan menelepon aku."] }, vi: { examples: ["Tôi sẽ làm việc đó.", "Cô ấy sẽ gọi cho tôi."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: "Un verbe pronominal garde son pronom devant l’infinitif, accordé avec le sujet."
              en: "A pronominal verb keeps its pronoun before the infinitive, agreeing with the subject."
              uk: "Зворотне дієслово зберігає свій займенник перед інфінітивом, узгоджений з підметом."
              es: "Un verbo pronominal conserva su pronombre delante del infinitivo, concordado con el sujeto."
              pt: "Um verbo pronominal mantém seu pronome antes do infinitivo, concordando com o sujeito."
              de: "Ein reflexives Verb behält sein Pronomen vor dem Infinitiv, passend zum Subjekt."
              it: "Un verbo pronominale mantiene il suo pronome davanti all’infinito, accordato al soggetto."
              pl: "Czasownik zwrotny zachowuje zaimek przed bezokolicznikiem, zgodny z podmiotem."
              tr: "Dönüşlü fiil, zamirini mastarın önünde özneye uygun biçimde korur."
              id: "Kata kerja refleksif mempertahankan pronominanya di depan infinitif, sesuai dengan subjek."
              vi: "Động từ phản thân giữ đại từ của nó trước động từ nguyên mẫu, hợp với chủ ngữ."
            ex: { examples: [["Je vais ", { target: "me" }, " lever tôt."], ["Nous allons ", { target: "nous" }, " reposer."]] }
            tr: { en: { examples: ["I'm going to get up early.", "We're going to rest."] }, uk: { examples: ["Я встану рано.", "Ми відпочинемо."] }, es: { examples: ["Voy a levantarme temprano.", "Vamos a descansar."] }, pt: { examples: ["Eu vou me levantar cedo.", "Nós vamos descansar."] }, de: { examples: ["Ich werde früh aufstehen.", "Wir werden uns ausruhen."] }, it: { examples: ["Mi alzo presto.", "Ci riposiamo."] }, pl: { examples: ["Wstanę wcześnie.", "Odpoczniemy."] }, tr: { examples: ["Erken kalkacağım.", "Dinleneceğiz."] }, id: { examples: ["Aku akan bangun pagi.", "Kami akan beristirahat."] }, vi: { examples: ["Tôi sẽ dậy sớm.", "Chúng tôi sẽ nghỉ ngơi."] } }
          - type: "rule"
            level: "A2"
            text:
