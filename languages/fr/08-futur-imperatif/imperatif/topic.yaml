            tr: { en: { examples: ["Come here.", "Let's eat together.", "Come here."] }, uk: { examples: ["Іди сюди.", "Поїмо разом.", "Ідіть сюди."] }, es: { examples: ["Ven aquí.", "Comamos juntos.", "Vengan aquí."] }, pt: { examples: ["Venha aqui.", "Vamos comer juntos.", "Venham aqui."] }, de: { examples: ["Komm her.", "Essen wir zusammen.", "Kommen Sie her."] }, it: { examples: ["Vieni qui.", "Mangiamo insieme.", "Venite qui."] }, pl: { examples: ["Chodź tu.", "Zjedzmy razem.", "Chodźcie tutaj."] }, tr: { examples: ["Buraya gel.", "Birlikte yiyelim.", "Buraya gelin."] }, id: { examples: ["Kemarilah.", "Ayo kita makan bersama.", "Datanglah kemari."] }, vi: { examples: ["Lại đây.", "Chúng ta cùng ăn nhé.", "Mời lại đây."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le verbe se dit sans pronom sujet : la terminaison montre à qui on parle."
