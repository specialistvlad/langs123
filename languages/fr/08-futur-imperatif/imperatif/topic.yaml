              pl: "Czasownik stoi bez zaimka podmiotowego: końcówka pokazuje, do kogo się mówi."
              tr: "Fiil özne zamiri olmadan söylenir: ek, kime seslenildiğini gösterir."
              id: "Kata kerja berdiri tanpa pronomina subjek: akhiran menunjukkan siapa yang diajak bicara."
              vi: "Động từ đứng không có đại từ chủ ngữ: đuôi động từ cho biết ta nói với ai."
