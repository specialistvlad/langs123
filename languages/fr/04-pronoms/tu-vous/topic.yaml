              uk: ["У французькій є два способи звернутися до однієї особи: ", { term: "tu" }, " і ", { term: "vous" }, "."]
              es: ["El francés tiene dos formas de dirigirse a una persona: ", { term: "tu" }, " y ", { term: "vous" }, "."]
              pt: ["O francês tem duas maneiras de se dirigir a uma pessoa: ", { term: "tu" }, " e ", { term: "vous" }, "."]
              de: ["Das Französische hat zwei Anredeformen für eine Person: ", { term: "tu" }, " und ", { term: "vous" }, "."]
              it: ["Il francese ha due modi di rivolgersi a una persona: ", { term: "tu" }, " e ", { term: "vous" }, "."]
              pl: ["Francuski ma dwie formy zwracania się do jednej osoby: ", { term: "tu" }, " i ", { term: "vous" }, "."]
              tr: ["Fransızcada tek bir kişiye seslenmenin iki yolu vardır: ", { term: "tu" }, " ve ", { term: "vous" }, "."]
              id: ["Bahasa Prancis punya dua cara menyapa satu orang: ", { term: "tu" }, " dan ", { term: "vous" }, "."]
              vi: ["Tiếng Pháp có hai cách xưng hô với một người: ", { term: "tu" }, " và ", { term: "vous" }, "."]
            ex: { examples: [[{ target: "Tu" }, " es prêt ?"], [{ target: "Vous" }, " êtes prêt ?"]] }
            tr: { en: { examples: ["Are you ready?", "Are you ready? (polite)"] }, uk: { examples: ["Ти готовий?", "Ви готові? (ввічливо)"] }, es: { examples: ["¿Estás listo?", "¿Está listo? (de usted)"] }, pt: { examples: ["Você está pronto?", "O senhor está pronto?"] }, de: { examples: ["Bist du fertig?", "Sind Sie fertig?"] }, it: { examples: ["Sei pronto?", "È pronto?"] }, pl: { examples: ["Jesteś gotowy?", "Czy pan jest gotowy?"] }, tr: { examples: ["Hazır mısın?", "Hazır mısınız?"] }, id: { examples: ["Apakah kamu siap?", "Apakah Anda siap?"] }, vi: { examples: ["Bạn sẵn sàng chưa?", "Ông sẵn sàng chưa ạ?"] } }
