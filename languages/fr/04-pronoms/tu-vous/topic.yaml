              fr: [{ term: "Vous" }, " s’emploie aussi pour plusieurs personnes ; ", { term: "tu" }, " n’a pas de pluriel."]
              en: [{ term: "Vous" }, " is also used for several people; ", { term: "tu" }, " has no plural."]
              uk: [{ term: "Vous" }, " вживається й для кількох осіб; ", { term: "tu" }, " не має множини."]
              es: [{ term: "Vous" }, " también se usa para varias personas; ", { term: "tu" }, " no tiene plural."]
              pt: [{ term: "Vous" }, " também se usa para várias pessoas; ", { term: "tu" }, " não tem plural."]
              de: [{ term: "Vous" }, " steht auch für mehrere Personen; ", { term: "tu" }, " hat keinen Plural."]
              it: [{ term: "Vous" }, " si usa anche per più persone; ", { term: "tu" }, " non ha plurale."]
              pl: [{ term: "Vous" }, " używa się też wobec kilku osób; ", { term: "tu" }, " nie ma liczby mnogiej."]
              tr: [{ term: "Vous" }, " birden çok kişi için de kullanılır; ", { term: "tu" }, "’nün çoğulu yoktur."]
              id: [{ term: "Vous" }, " juga dipakai untuk beberapa orang; ", { term: "tu" }, " tidak punya bentuk jamak."]
              vi: [{ term: "Vous" }, " cũng dùng cho nhiều người; ", { term: "tu" }, " không có số nhiều."]
            ex: { examples: [["Léa, ", { target: "tu" }, " viens ?"], ["Léa et Paul, ", { target: "vous" }, " venez ?"]] }
            tr: { en: { examples: ["Léa, are you coming?", "Léa and Paul, are you coming?"] }, uk: { examples: ["Леа, ти йдеш?", "Леа й Поль, ви йдете?"] }, es: { examples: ["Léa, ¿vienes?", "Léa y Paul, ¿vienen?"] }, pt: { examples: ["Léa, você vem?", "Léa e Paul, vocês vêm?"] }, de: { examples: ["Léa, kommst du?", "Léa und Paul, kommt ihr?"] }, it: { examples: ["Léa, vieni?", "Léa e Paul, venite?"] }, pl: { examples: ["Léa, idziesz?", "Léa i Paul, idziecie?"] }, tr: { examples: ["Léa, geliyor musun?", "Léa ile Paul, geliyor musunuz?"] }, id: { examples: ["Léa, kamu ikut?", "Léa dan Paul, kalian ikut?"] }, vi: { examples: ["Léa, bạn đi không?", "Léa và Paul, hai bạn đi không?"] } }
          - type: "note"
