    id: [{ term: "Tu" }, " menyapa satu orang yang akrab; ", { term: "vous" }, " menyapa satu orang dengan sopan atau beberapa orang."]
    vi: [{ term: "Tu" }, " xưng hô với một người thân quen; ", { term: "vous" }, " xưng hô lịch sự với một người hoặc với nhiều người."]
