            pl: ["po czasowniku, z łącznikiem; ", { term: "me" }, " zmienia się w ", { term: "moi" }]
            tr: ["fiilden sonra, tire ile; ", { term: "me" }, ", ", { term: "moi" }, " olur"]
            id: ["sesudah kata kerja, dengan tanda hubung; ", { term: "me" }, " menjadi ", { term: "moi" }]
            vi: ["sau động từ, có dấu gạch nối; ", { term: "me" }, " thành ", { term: "moi" }]
          ex: { examples: [["Regarde-", { target: "le" }, "."], ["Donne-", { target: "moi" }, " le sel."]] }
          tr: { en: { examples: ["Look at him.", "Give me the salt."] }, uk: { examples: ["Подивися на нього.", "Дай мені сіль."] }, es: { examples: ["Míralo.", "Dame la sal."] }, pt: { examples: ["Olhe para ele.", "Me passe o sal."] }, de: { examples: ["Sieh ihn an.", "Gib mir das Salz."] }, it: { examples: ["Guardalo.", "Dammi il sale."] }, pl: { examples: ["Spójrz na niego.", "Daj mi sól."] }, tr: { examples: ["Ona bak.", "Bana tuzu ver."] }, id: { examples: ["Lihat dia.", "Berikan garam itu kepadaku."] }, vi: { examples: ["Hãy nhìn anh ấy.", "Đưa muối cho tôi."] } }
        - level: "A2"
          point:
            fr: "Impératif négatif"
            en: "Negative imperative"
            uk: "Заперечний наказовий спосіб"
            es: "Imperativo negativo"
            pt: "Imperativo negativo"
            de: "Verneinter Imperativ"
            it: "Imperativo negativo"
            pl: "Tryb rozkazujący przeczący"
            tr: "Olumsuz emir"
            id: "Imperatif negatif"
            vi: "Mệnh lệnh phủ định"
          rule:
            fr: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, " : le pronom revient devant le verbe"]
            en: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": the pronoun is back before the verb"]
            uk: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": займенник знову стоїть перед дієсловом"]
            es: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": el pronombre vuelve delante del verbo"]
            pt: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": o pronome volta para antes do verbo"]
            de: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": das Pronomen steht wieder vor dem Verb"]
            it: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": il pronome torna prima del verbo"]
            pl: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": zaimek wraca przed czasownik"]
            tr: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": zamir yine fiilin önüne geçer"]
            id: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": pronomina kembali ke depan kata kerja"]
            vi: [{ pattern: [{ term: "ne" }, { alternatives: [{ term: "me" }, { term: "le" }, { term: "lui" }] }, { slot: "verb" }, { term: "pas" }] }, ": đại từ trở lại trước động từ"]
          ex: ["Ne ", { target: "le" }, " regarde pas !"]
          tr: { en: "Don't look at him!", uk: "Не дивися на нього!", es: "¡No lo mires!", pt: "Não olhe para ele!", de: "Sieh ihn nicht an!", it: "Non guardarlo!", pl: "Nie patrz na niego!", tr: "Ona bakma!", id: "Jangan lihat dia!", vi: "Đừng nhìn anh ấy!" }
        - level: "A2"
          point: { fr: "Accord", en: "Agreement", uk: "Узгодження", es: "Concordancia", pt: "Concordância", de: "Angleichung", it: "Concordanza", pl: "Zgoda", tr: "Uyum", id: "Penyesuaian", vi: "Hòa hợp" }
          rule:
            fr: ["au passé composé, le participe s’accorde avec ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " placé devant"]
            en: ["in the passé composé, the participle agrees with a preceding ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }]
            uk: ["у passé composé дієприкметник узгоджується з ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " перед ним"]
            es: ["en el passé composé, el participio concuerda con ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " antepuesto"]
            pt: ["no passé composé, o particípio concorda com ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " colocado antes"]
            de: ["im passé composé richtet sich das Partizip nach vorangestelltem ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }]
            it: ["nel passé composé, il participio concorda con ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " che lo precede"]
            pl: ["w passé composé imiesłów zgadza się z poprzedzającym ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }]
            tr: ["passé composé’de ortaç, önündeki ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " ile uyum gösterir"]
            id: ["pada passé composé, participe menyesuaikan dengan ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " di depannya"]
            vi: ["trong passé composé, phân từ hòa hợp với ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " đứng trước"]
          ex: ["Marie ? Je l’ai ", { target: "vue" }, "."]
          tr: { en: "Marie? I saw her.", uk: "Марі? Я бачив її.", es: "¿Marie? La vi.", pt: "A Marie? Eu a vi.", de: "Marie? Ich habe sie gesehen.", it: "Marie? L’ho vista.", pl: "Marie? Widziałem ją.", tr: "Marie mi? Onu gördüm.", id: "Marie? Aku melihatnya.", vi: "Marie ư? Tôi đã thấy cô ấy." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: ["jamais après le verbe, sauf à l’impératif affirmatif : ", { term: "je le vois" }]
            en: ["never after the verb, except in the affirmative imperative: ", { term: "je le vois" }]
            uk: ["ніколи після дієслова, крім стверджувального наказового способу: ", { term: "je le vois" }]
            es: ["nunca detrás del verbo, salvo en el imperativo afirmativo: ", { term: "je le vois" }]
            pt: ["nunca depois do verbo, exceto no imperativo afirmativo: ", { term: "je le vois" }]
            de: ["nie nach dem Verb, außer im bejahten Imperativ: ", { term: "je le vois" }]
            it: ["mai dopo il verbo, tranne nell’imperativo affermativo: ", { term: "je le vois" }]
            pl: ["nigdy po czasowniku, poza trybem rozkazującym twierdzącym: ", { term: "je le vois" }]
            tr: ["olumlu emir dışında asla fiilden sonra gelmez: ", { term: "je le vois" }]
            id: ["tidak pernah sesudah kata kerja, kecuali imperatif afirmatif: ", { term: "je le vois" }]
            vi: ["không bao giờ đứng sau động từ, trừ mệnh lệnh khẳng định: ", { term: "je le vois" }]
          ex: ["Je ", { target: "le" }, " vois."]
          tr: { en: "I see him.", uk: "Я бачу його.", es: "Lo veo.", pt: "Eu o vejo.", de: "Ich sehe ihn.", it: "Lo vedo.", pl: "Widzę go.", tr: "Onu görüyorum.", id: "Aku melihatnya.", vi: "Tôi thấy anh ấy." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: [{ term: "leur" }, " ne prend jamais de -s"]
            en: [{ term: "leur" }, " never takes an -s"]
            uk: [{ term: "leur" }, " ніколи не має -s"]
            es: [{ term: "leur" }, " nunca lleva -s"]
            pt: [{ term: "leur" }, " nunca leva -s"]
            de: [{ term: "leur" }, " bekommt nie ein -s"]
            it: [{ term: "leur" }, " non prende mai -s"]
            pl: [{ term: "leur" }, " nigdy nie ma -s"]
            tr: [{ term: "leur" }, " asla -s almaz"]
            id: [{ term: "leur" }, " tidak pernah diberi -s"]
            vi: [{ term: "leur" }, " không bao giờ thêm -s"]
          ex: ["Je ", { target: "leur" }, " parle."]
          tr: { en: "I talk to them.", uk: "Я розмовляю з ними.", es: "Les hablo.", pt: "Eu falo com eles.", de: "Ich spreche mit ihnen.", it: "Parlo loro.", pl: "Rozmawiam z nimi.", tr: "Onlarla konuşuyorum.", id: "Aku berbicara dengan mereka.", vi: "Tôi nói chuyện với họ." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Un pronom complément remplace un nom déjà connu et évite de le répéter."
              en: "An object pronoun replaces a noun already known and avoids repeating it."
              uk: "Займенник-додаток замінює вже відомий іменник і дозволяє не повторювати його."
              es: "El pronombre complemento sustituye a un nombre ya conocido y evita repetirlo."
              pt: "O pronome complemento substitui um substantivo já conhecido e evita repeti-lo."
              de: "Das Objektpronomen ersetzt ein bereits bekanntes Nomen und vermeidet seine Wiederholung."
              it: "Il pronome complemento sostituisce un nome già noto ed evita di ripeterlo."
              pl: "Zaimek dopełnieniowy zastępuje znany już rzeczownik i pozwala go nie powtarzać."
              tr: "Nesne zamiri, daha önce bilinen bir ismin yerini tutar ve onu tekrarlamaktan kaçınmayı sağlar."
              id: "Pronomina objek menggantikan kata benda yang sudah diketahui dan menghindari pengulangannya."
              vi: "Đại từ bổ ngữ thay cho một danh từ đã biết và tránh phải lặp lại nó."
            ex: { exchange: ["Tu connais Paul ?", ["Oui, je ", { target: "le" }, " connais."]] }
            tr: { en: { exchange: ["Do you know Paul?", "Yes, I know him."] }, uk: { exchange: ["Ти знаєш Поля?", "Так, я його знаю."] }, es: { exchange: ["¿Conoces a Paul?", "Sí, lo conozco."] }, pt: { exchange: ["Você conhece o Paul?", "Sim, eu o conheço."] }, de: { exchange: ["Kennst du Paul?", "Ja, ich kenne ihn."] }, it: { exchange: ["Conosci Paul?", "Sì, lo conosco."] }, pl: { exchange: ["Znasz Paula?", "Tak, znam go."] }, tr: { exchange: ["Paul’ü tanıyor musun?", "Evet, onu tanıyorum."] }, id: { exchange: ["Kamu kenal Paul?", "Ya, aku mengenalnya."] }, vi: { exchange: ["Bạn có quen Paul không?", "Có, tôi quen anh ấy."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["À la 3e personne, ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " remplacent un complément direct ; ", { term: "lui" }, " et ", { term: "leur" }, " remplacent une personne introduite par ", { term: "à" }, "."]
              en: ["In the 3rd person, ", { term: "le" }, ", ", { term: "la" }, " and ", { term: "les" }, " replace a direct object; ", { term: "lui" }, " and ", { term: "leur" }, " replace a person introduced by ", { term: "à" }, "."]
              uk: ["У 3-й особі ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " замінюють прямий додаток, а ", { term: "lui" }, " і ", { term: "leur" }, " замінюють особу, введену прийменником ", { term: "à" }, "."]
              es: ["En la 3.ª persona, ", { term: "le" }, ", ", { term: "la" }, " y ", { term: "les" }, " sustituyen al complemento directo; ", { term: "lui" }, " y ", { term: "leur" }, " sustituyen a una persona introducida por ", { term: "à" }, "."]
              pt: ["Na 3ª pessoa, ", { term: "le" }, ", ", { term: "la" }, " e ", { term: "les" }, " substituem o objeto direto; ", { term: "lui" }, " e ", { term: "leur" }, " substituem uma pessoa introduzida por ", { term: "à" }, "."]
              de: ["In der 3. Person ersetzen ", { term: "le" }, ", ", { term: "la" }, " und ", { term: "les" }, " ein direktes Objekt; ", { term: "lui" }, " und ", { term: "leur" }, " ersetzen eine Person, die mit ", { term: "à" }, " angeschlossen wird."]
              it: ["Alla 3ª persona, ", { term: "le" }, ", ", { term: "la" }, " e ", { term: "les" }, " sostituiscono il complemento diretto; ", { term: "lui" }, " e ", { term: "leur" }, " sostituiscono una persona introdotta da ", { term: "à" }, "."]
              pl: ["W 3. osobie ", { term: "le" }, ", ", { term: "la" }, " i ", { term: "les" }, " zastępują dopełnienie bliższe, a ", { term: "lui" }, " i ", { term: "leur" }, " zastępują osobę wprowadzoną przez ", { term: "à" }, "."]
              tr: ["3. kişide ", { term: "le" }, ", ", { term: "la" }, " ve ", { term: "les" }, " doğrudan nesnenin yerini tutar; ", { term: "lui" }, " ve ", { term: "leur" }, " ise ", { term: "à" }, " ile bağlanan kişinin yerini tutar."]
              id: ["Pada orang ketiga, ", { term: "le" }, ", ", { term: "la" }, ", dan ", { term: "les" }, " menggantikan objek langsung; ", { term: "lui" }, " dan ", { term: "leur" }, " menggantikan orang yang diawali ", { term: "à" }, "."]
              vi: ["Ở ngôi thứ ba, ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "les" }, " thay cho bổ ngữ trực tiếp; ", { term: "lui" }, " và ", { term: "leur" }, " thay cho người đi sau ", { term: "à" }, "."]
            ex: { examples: [["Je ", { target: "la" }, " vois."], ["Je ", { target: "lui" }, " parle."]] }
            tr: { en: { examples: ["I see her.", "I speak to her."] }, uk: { examples: ["Я бачу її.", "Я розмовляю з нею."] }, es: { examples: ["La veo.", "Le hablo."] }, pt: { examples: ["Eu a vejo.", "Eu falo com ela."] }, de: { examples: ["Ich sehe sie.", "Ich spreche mit ihr."] }, it: { examples: ["La vedo.", "Le parlo."] }, pl: { examples: ["Widzę ją.", "Rozmawiam z nią."] }, tr: { examples: ["Onu görüyorum.", "Onunla konuşuyorum."] }, id: { examples: ["Aku melihatnya.", "Aku berbicara dengannya."] }, vi: { examples: ["Tôi thấy cô ấy.", "Tôi nói chuyện với cô ấy."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le pronom se place devant le verbe ; l’impératif affirmatif est la seule exception : il le place après."
              en: "The pronoun goes before the verb; the affirmative imperative is the one exception: it puts the pronoun after."
              uk: "Займенник стоїть перед дієсловом; єдиний виняток — стверджувальний наказовий спосіб, де він іде після дієслова."
              es: "El pronombre va delante del verbo; la única excepción es el imperativo afirmativo, que lo coloca detrás."
              pt: "O pronome vai antes do verbo; a única exceção é o imperativo afirmativo, que o coloca depois."
              de: "Das Pronomen steht vor dem Verb; die einzige Ausnahme ist der bejahte Imperativ, der es nachstellt."
              it: "Il pronome sta prima del verbo; l’unica eccezione è l’imperativo affermativo, che lo mette dopo."
              pl: "Zaimek stoi przed czasownikiem; jedyny wyjątek to tryb rozkazujący twierdzący, w którym stoi po czasowniku."
              tr: "Zamir fiilin önünde yer alır; tek istisna olumlu emir kipidir, orada zamir fiilden sonra gelir."
              id: "Pronomina diletakkan sebelum kata kerja; satu-satunya pengecualian adalah imperatif afirmatif, yang menaruhnya sesudah kata kerja."
              vi: "Đại từ đứng trước động từ; ngoại lệ duy nhất là mệnh lệnh khẳng định, nơi đại từ đứng sau động từ."
            ex: { examples: [["Je ", { target: "te" }, " comprends."], ["Écoute-", { target: "moi" }, "."]] }
            tr: { en: { examples: ["I understand you.", "Listen to me."] }, uk: { examples: ["Я розумію тебе.", "Послухай мене."] }, es: { examples: ["Te entiendo.", "Escúchame."] }, pt: { examples: ["Eu te entendo.", "Me escute."] }, de: { examples: ["Ich verstehe dich.", "Hör mir zu."] }, it: { examples: ["Ti capisco.", "Ascoltami."] }, pl: { examples: ["Rozumiem cię.", "Posłuchaj mnie."] }, tr: { examples: ["Seni anlıyorum.", "Beni dinle."] }, id: { examples: ["Aku mengerti kamu.", "Dengarkan aku."] }, vi: { examples: ["Tôi hiểu bạn.", "Hãy nghe tôi."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "moi" }, " et ", { term: "toi" }, " après une préposition, voir ", { link: "Les pronoms toniques", to: "fr.pronoms.pronoms-toniques" }, "."]
              en: ["For ", { term: "moi" }, " and ", { term: "toi" }, " after a preposition, see ", { link: "Stressed Pronouns", to: fr.pronoms.pronoms-toniques }, "."]
              uk: ["Про ", { term: "moi" }, ", ", { term: "toi" }, " після прийменника — див. ", { link: "Наголошені займенники", to: "fr.pronoms.pronoms-toniques" }, "."]
              es: ["Para ", { term: "moi" }, " y ", { term: "toi" }, " tras una preposición, ver ", { link: "Los pronombres tónicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              pt: ["Para ", { term: "moi" }, " e ", { term: "toi" }, " depois de preposição, veja ", { link: "Os pronomes tônicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              de: ["Zu ", { term: "moi" }, " und ", { term: "toi" }, " nach einer Präposition siehe ", { link: "Die betonten Pronomen", to: "fr.pronoms.pronoms-toniques" }, "."]
              it: ["Per ", { term: "moi" }, " e ", { term: "toi" }, " dopo una preposizione, vedi ", { link: "I pronomi tonici", to: "fr.pronoms.pronoms-toniques" }, "."]
              pl: ["O ", { term: "moi" }, " i ", { term: "toi" }, " po przyimku — zob. ", { link: "Zaimki akcentowane", to: "fr.pronoms.pronoms-toniques" }, "."]
              tr: ["Edattan sonra ", { term: "moi" }, " ve ", { term: "toi" }, " için bkz. ", { link: "Vurgulu zamirler", to: "fr.pronoms.pronoms-toniques" }, "."]
              id: ["Untuk ", { term: "moi" }, " dan ", { term: "toi" }, " setelah preposisi, lihat ", { link: "Pronomina tonik", to: "fr.pronoms.pronoms-toniques" }, "."]
              vi: ["Về ", { term: "moi" }, " và ", { term: "toi" }, " sau giới từ, xem ", { link: "Đại từ nhấn mạnh", to: "fr.pronoms.pronoms-toniques" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour remplacer un lieu ou un complément avec ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), voir ", { link: "Y et en", to: "fr.pronoms.y-en" }, "."]
              en: ["To replace a place or a phrase with ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), see ", { link: "The Pronouns y and en", to: fr.pronoms.y-en }, "."]
              uk: ["Як замінити місце чи словосполучення з ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), — див. ", { link: "Y та en", to: "fr.pronoms.y-en" }, "."]
              es: ["Para sustituir un lugar o un complemento con ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), ver ", { link: "Y y en", to: "fr.pronoms.y-en" }, "."]
              pt: ["Para substituir um lugar ou um complemento com ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), veja ", { link: "Y e en", to: "fr.pronoms.y-en" }, "."]
              de: ["Wie man einen Ort oder eine Ergänzung mit ", { term: "de" }, " ersetzt (", { term: "y" }, ", ", { term: "en" }, "), steht in ", { link: "Y und en", to: "fr.pronoms.y-en" }, "."]
              it: ["Per sostituire un luogo o un complemento con ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, "), vedi ", { link: "Y e en", to: "fr.pronoms.y-en" }, "."]
              pl: ["O zastępowaniu miejsca lub dopełnienia z ", { term: "de" }, " (", { term: "y" }, ", ", { term: "en" }, ") — zob. ", { link: "Y i en", to: "fr.pronoms.y-en" }, "."]
