              es: [{ term: "Y" }, " y ", { term: "en" }, " sustituyen también una cosa: ", { term: "à" }, " y una cosa dan ", { term: "y" }, ", ", { term: "de" }, " y una cosa dan ", { term: "en" }, "."]
              pt: [{ term: "Y" }, " e ", { term: "en" }, " substituem também uma coisa: ", { term: "à" }, " e uma coisa dão ", { term: "y" }, ", ", { term: "de" }, " e uma coisa dão ", { term: "en" }, "."]
              de: [{ term: "Y" }, " und ", { term: "en" }, " ersetzen auch eine Sache: ", { term: "à" }, " und eine Sache ergeben ", { term: "y" }, ", ", { term: "de" }, " und eine Sache ergeben ", { term: "en" }, "."]
              it: [{ term: "Y" }, " e ", { term: "en" }, " sostituiscono anche una cosa: ", { term: "à" }, " e una cosa danno ", { term: "y" }, ", ", { term: "de" }, " e una cosa danno ", { term: "en" }, "."]
              pl: [{ term: "Y" }, " i ", { term: "en" }, " zastępują też rzecz: ", { term: "à" }, " i rzecz dają ", { term: "y" }, ", ", { term: "de" }, " i rzecz dają ", { term: "en" }, "."]
