          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "En" }, " remplace un nom avec ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " ou un nombre ; le nombre reste après le verbe."]
              en: [{ term: "En" }, " replaces a noun with ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " or a number; the number stays after the verb."]
              uk: [{ term: "En" }, " замінює іменник з ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " або з числом; числівник залишається після дієслова."]
