            ex: { examples: [[{ target: "Allons-y" }, " !"], ["On ", { target: "y" }, " va !"], ["Vas-", { target: "y" }, " !"]] }
            tr: { en: { examples: ["Let's go!", "Off we go!", "Go on!"] }, uk: { examples: ["Ходімо!", "Ідемо!", "Іди!"] }, es: { examples: ["¡Vamos!", "¡Nos vamos!", "¡Ve!"] }, pt: { examples: ["Vamos!", "Vamos lá!", "Vá!"] }, de: { examples: ["Los geht’s!", "Wir gehen!", "Geh schon!"] }, it: { examples: ["Andiamo!", "Si va!", "Vai!"] }, pl: { examples: ["Chodźmy!", "Idziemy!", "Idź!"] }, tr: { examples: ["Haydi gidelim!", "Gidiyoruz!", "Git!"] }, id: { examples: ["Ayo pergi!", "Kita berangkat!", "Pergilah!"] }, vi: { examples: ["Đi thôi!", "Chúng ta đi nào!", "Đi đi!"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Y" }, " remplace un lieu introduit par ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " ou ", { term: "sur" }, "."]
