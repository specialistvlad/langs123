              it: [{ term: "En" }, " sostituisce un nome con ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " o un numero; il numero resta dopo il verbo."]
              pl: [{ term: "En" }, " zastępuje rzeczownik z ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " lub liczebnikiem; liczebnik zostaje po czasowniku."]
              tr: [{ term: "En" }, ", ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " ya da bir sayıyla gelen ismin yerini tutar; sayı fiilden sonra kalır."]
              id: [{ term: "En" }, " menggantikan kata benda dengan ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, ", atau angka; angka tetap sesudah kata kerja."]
              vi: [{ term: "En" }, " thay cho danh từ đi với ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "des" }, " hoặc một số; con số ở lại sau động từ."]
            ex: { examples: [["Tu veux du thé ? ‖ Oui, j’", { target: "en" }, " veux."], ["Tu as des frères ? ‖ J’", { target: "en" }, " ai deux."]] }
            tr: { en: { examples: ["Do you want some tea? ‖ Yes, I want some.", "Do you have brothers? ‖ I have two."] }, uk: { examples: ["Хочеш чаю? ‖ Так, хочу.", "У тебе є брати? ‖ У мене двоє."] }, es: { examples: ["¿Quieres té? ‖ Sí, quiero.", "¿Tienes hermanos? ‖ Tengo dos."] }, pt: { examples: ["Você quer chá? ‖ Sim, quero.", "Você tem irmãos? ‖ Tenho dois."] }, de: { examples: ["Möchtest du Tee? ‖ Ja, gern.", "Hast du Brüder? ‖ Ich habe zwei."] }, it: { examples: ["Vuoi del tè? ‖ Sì, ne voglio.", "Hai fratelli? ‖ Ne ho due."] }, pl: { examples: ["Chcesz herbaty? ‖ Tak, chcę.", "Masz braci? ‖ Mam dwóch."] }, tr: { examples: ["Çay ister misin? ‖ Evet, istiyorum.", "Erkek kardeşin var mı? ‖ İki tane var."] }, id: { examples: ["Apakah kamu mau teh? ‖ Ya, aku mau.", "Apakah kamu punya saudara laki-laki? ‖ Aku punya dua."] }, vi: { examples: ["Bạn có muốn uống trà không? ‖ Có, tôi muốn.", "Bạn có anh em trai không? ‖ Tôi có hai người."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: [{ term: "Y" }, " et ", { term: "en" }, " remplacent aussi une chose : ", { term: "à" }, " et une chose donnent ", { term: "y" }, ", ", { term: "de" }, " et une chose donnent ", { term: "en" }, "."]
              en: [{ term: "Y" }, " and ", { term: "en" }, " also replace a thing: ", { term: "à" }, " and a thing give ", { term: "y" }, ", ", { term: "de" }, " and a thing give ", { term: "en" }, "."]
