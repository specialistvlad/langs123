              pt: [{ term: "Y" }, " substitui um lugar introduzido por ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " ou ", { term: "sur" }, "."]
              de: [{ term: "Y" }, " ersetzt einen Ort mit ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " oder ", { term: "sur" }, "."]
              it: [{ term: "Y" }, " sostituisce un luogo introdotto da ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " o ", { term: "sur" }, "."]
              pl: [{ term: "Y" }, " zastępuje miejsce wprowadzone przez ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " lub ", { term: "sur" }, "."]
              tr: [{ term: "Y" }, ", ", { term: "à" }, ", ", { term: "en" }, ", ", { term: "dans" }, ", ", { term: "chez" }, " ya da ", { term: "sur" }, " ile bağlanan bir yerin yerini tutar."]
