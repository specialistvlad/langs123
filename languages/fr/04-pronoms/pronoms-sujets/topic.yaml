              es: [{ term: "je" }, ": la persona que habla"]
              pt: [{ term: "je" }, ": quem fala"]
              de: [{ term: "je" }, ": die sprechende Person"]
              it: [{ term: "je" }, ": la persona che parla"]
              pl: [{ term: "je" }, ": osoba mówiąca"]
              tr: [{ term: "je" }, ": konuşan kişi"]
              id: [{ term: "je" }, ": orang yang berbicara"]
