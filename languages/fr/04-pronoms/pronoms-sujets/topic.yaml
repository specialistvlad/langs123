            tr: { en: { examples: ["My name is Léa.", "I'm French."] }, uk: { examples: ["Мене звати Леа.", "Я француз."] }, es: { examples: ["Me llamo Léa.", "Soy francés."] }, pt: { examples: ["Meu nome é Léa.", "Eu sou francês."] }, de: { examples: ["Ich heiße Léa.", "Ich bin Franzose."] }, it: { examples: ["Mi chiamo Léa.", "Sono francese."] }, pl: { examples: ["Nazywam się Léa.", "Jestem Francuzem."] }, tr: { examples: ["Adım Léa.", "Fransızım."] }, id: { examples: ["Namaku Léa.", "Aku orang Prancis."] }, vi: { examples: ["Tôi tên là Léa.", "Tôi là người Pháp."] } }
          - level: "A0"
            use:
              fr: [{ term: "tu" }, " : une personne qu’on tutoie"]
