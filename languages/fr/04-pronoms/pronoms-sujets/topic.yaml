            pl: "czasownik nigdy nie występuje bez zaimka podmiotowego"
            tr: "fiil asla özne zamiri olmadan kullanılmaz"
            id: "kata kerja tidak pernah berdiri tanpa pronomina subjek"
            vi: "động từ không bao giờ đứng thiếu đại từ chủ ngữ"
          ex: [{ target: "Il" }, " est à Paris."]
          tr: { en: "He is in Paris.", uk: "Він у Парижі.", es: "Está en París.", pt: "Ele está em Paris.", de: "Er ist in Paris.", it: "È a Parigi.", pl: "Jest w Paryżu.", tr: "Paris’te.", id: "Dia ada di Paris.", vi: "Anh ấy ở Paris." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: "Le verbe conjugué a toujours un sujet : un pronom ou un nom."
              en: "A conjugated verb always has a subject: a pronoun or a noun."
              uk: "Дієслово в особовій формі завжди має підмет: займенник або іменник."
              es: "El verbo conjugado siempre tiene un sujeto: un pronombre o un nombre."
              pt: "O verbo conjugado sempre tem um sujeito: um pronome ou um substantivo."
              de: "Das konjugierte Verb hat immer ein Subjekt: ein Pronomen oder ein Nomen."
              it: "Il verbo coniugato ha sempre un soggetto: un pronome o un nome."
              pl: "Czasownik w formie osobowej zawsze ma podmiot: zaimek lub rzeczownik."
              tr: "Çekimli fiilin her zaman bir öznesi vardır: bir zamir ya da bir isim."
              id: "Kata kerja yang dikonjugasikan selalu punya subjek: pronomina atau kata benda."
              vi: "Động từ đã chia luôn có chủ ngữ: một đại từ hoặc một danh từ."
            ex: { examples: [[{ target: "Je" }, " parle."], [{ target: "Léa" }, " parle."]] }
            tr: { en: { examples: ["I speak.", "Léa speaks."] }, uk: { examples: ["Я говорю.", "Леа говорить."] }, es: { examples: ["Hablo.", "Léa habla."] }, pt: { examples: ["Eu falo.", "A Léa fala."] }, de: { examples: ["Ich spreche.", "Léa spricht."] }, it: { examples: ["Parlo.", "Léa parla."] }, pl: { examples: ["Mówię.", "Léa mówi."] }, tr: { examples: ["Konuşuyorum.", "Léa konuşuyor."] }, id: { examples: ["Aku berbicara.", "Léa berbicara."] }, vi: { examples: ["Tôi nói.", "Léa nói."] } }
          - type: "rule"
            level: "A0"
            text:
              fr: "Le pronom sujet se place devant le verbe."
              en: "The subject pronoun comes before the verb."
              uk: "Підметовий займенник стоїть перед дієсловом."
              es: "El pronombre sujeto va delante del verbo."
              pt: "O pronome sujeito vem antes do verbo."
              de: "Das Subjektpronomen steht vor dem Verb."
              it: "Il pronome soggetto sta davanti al verbo."
              pl: "Zaimek podmiotowy stoi przed czasownikiem."
              tr: "Özne zamiri fiilin önüne gelir."
              id: "Pronomina subjek diletakkan sebelum kata kerja."
              vi: "Đại từ chủ ngữ đứng trước động từ."
            ex: { examples: [[{ target: "Nous" }, " habitons à Lyon."], [{ target: "Ils" }, " arrivent."]] }
            tr: { en: { examples: ["We live in Lyon.", "They are arriving."] }, uk: { examples: ["Ми живемо в Ліоні.", "Вони приходять."] }, es: { examples: ["Vivimos en Lyon.", "Llegan."] }, pt: { examples: ["Nós moramos em Lyon.", "Eles estão chegando."] }, de: { examples: ["Wir wohnen in Lyon.", "Sie kommen an."] }, it: { examples: ["Abitiamo a Lione.", "Arrivano."] }, pl: { examples: ["Mieszkamy w Lyonie.", "Przychodzą."] }, tr: { examples: ["Lyon’da yaşıyoruz.", "Geliyorlar."] }, id: { examples: ["Kami tinggal di Lyon.", "Mereka tiba."] }, vi: { examples: ["Chúng tôi sống ở Lyon.", "Họ đến."] } }
          - type: "note"
            level: "A0"
            text:
              fr: ["Pour choisir entre tu et vous, voir ", { link: "Tu et vous", to: "fr.pronoms.tu-vous" }, "."]
              en: ["To choose between tu and vous, see ", { link: "Forms of Address: tu and vous", to: fr.pronoms.tu-vous }, "."]
              uk: ["Про вибір між tu і vous — у темі ", { link: "Tu та vous", to: "fr.pronoms.tu-vous" }, "."]
              es: ["Para elegir entre tu y vous, véase ", { link: "Tu y vous", to: "fr.pronoms.tu-vous" }, "."]
              pt: ["Para escolher entre tu e vous, veja ", { link: "Tu e vous", to: "fr.pronoms.tu-vous" }, "."]
              de: ["Zur Wahl zwischen tu und vous siehe ", { link: "Tu und vous", to: "fr.pronoms.tu-vous" }, "."]
              it: ["Per scegliere tra tu e vous, vedi ", { link: "Tu e vous", to: "fr.pronoms.tu-vous" }, "."]
              pl: ["O wyborze między tu i vous — zob. ", { link: "Tu i vous", to: "fr.pronoms.tu-vous" }, "."]
              tr: ["tu ile vous arasındaki seçim için bkz. ", { link: "Tu ve vous", to: "fr.pronoms.tu-vous" }, "."]
              id: ["Untuk memilih antara tu dan vous, lihat ", { link: "Tu dan vous", to: "fr.pronoms.tu-vous" }, "."]
              vi: ["Về việc chọn giữa tu và vous, xem ", { link: "Tu và vous", to: "fr.pronoms.tu-vous" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Dans une question avec inversion, le pronom suit le verbe : voir ", { link: "Les questions", to: "fr.phrase.questions" }, "."]
              en: ["In a question with inversion, the pronoun follows the verb: see ", { link: "Questions", to: "fr.phrase.questions" }, "."]
              uk: ["У питанні з інверсією займенник стоїть після дієслова: див. ", { link: "Питання", to: "fr.phrase.questions" }, "."]
              es: ["En una pregunta con inversión, el pronombre va detrás del verbo: véase ", { link: "Las preguntas", to: "fr.phrase.questions" }, "."]
              pt: ["Numa pergunta com inversão, o pronome vem depois do verbo: veja ", { link: "As perguntas", to: "fr.phrase.questions" }, "."]
              de: ["In einer Frage mit Inversion folgt das Pronomen dem Verb: siehe ", { link: "Fragen", to: "fr.phrase.questions" }, "."]
              it: ["In una domanda con inversione, il pronome segue il verbo: vedi ", { link: "Le domande", to: "fr.phrase.questions" }, "."]
              pl: ["W pytaniu z inwersją zaimek stoi po czasowniku: zob. ", { link: "Pytania", to: "fr.phrase.questions" }, "."]
              tr: ["Devrik soruda zamir fiilin ardından gelir: bkz. ", { link: "Soru cümleleri", to: "fr.phrase.questions" }, "."]
              id: ["Dalam pertanyaan dengan inversi, pronomina mengikuti kata kerja: lihat ", { link: "Kalimat tanya", to: "fr.phrase.questions" }, "."]
              vi: ["Trong câu hỏi đảo ngữ, đại từ đứng sau động từ: xem ", { link: "Câu hỏi", to: "fr.phrase.questions" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour insister sur la personne (moi, je…), voir ", { link: "Les pronoms toniques", to: "fr.pronoms.pronoms-toniques" }, "."]
              en: ["To stress the person (moi, je…), see ", { link: "Stressed Pronouns", to: fr.pronoms.pronoms-toniques }, "."]
              uk: ["Щоб наголосити на особі (moi, je…), див. ", { link: "Наголошені займенники", to: "fr.pronoms.pronoms-toniques" }, "."]
              es: ["Para destacar a la persona (moi, je…), véase ", { link: "Los pronombres tónicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              pt: ["Para enfatizar a pessoa (moi, je…), veja ", { link: "Os pronomes tônicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              de: ["Zur Betonung der Person (moi, je…) siehe ", { link: "Die betonten Pronomen", to: "fr.pronoms.pronoms-toniques" }, "."]
              it: ["Per mettere in rilievo la persona (moi, je…), vedi ", { link: "I pronomi tonici", to: "fr.pronoms.pronoms-toniques" }, "."]
              pl: ["O podkreślaniu osoby (moi, je…) — zob. ", { link: "Zaimki akcentowane", to: "fr.pronoms.pronoms-toniques" }, "."]
              tr: ["Kişiyi vurgulamak için (moi, je…) bkz. ", { link: "Vurgulu zamirler", to: "fr.pronoms.pronoms-toniques" }, "."]
              id: ["Untuk menekankan orangnya (moi, je…), lihat ", { link: "Pronomina tonik", to: "fr.pronoms.pronoms-toniques" }, "."]
              vi: ["Để nhấn mạnh người nói (moi, je…), xem ", { link: "Đại từ nhấn mạnh", to: "fr.pronoms.pronoms-toniques" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Les pronoms qui suivent ou précèdent le verbe comme compléments : voir ", { link: "Les pronoms compléments", to: "fr.pronoms.pronoms-complements" }, "."]
              en: ["The pronouns that stand with the verb as objects: see ", { link: "Object Pronouns", to: fr.pronoms.pronoms-complements }, "."]
              uk: ["Займенники, що стоять при дієслові як додатки: див. ", { link: "Займенники-додатки", to: "fr.pronoms.pronoms-complements" }, "."]
              es: ["Los pronombres que acompañan al verbo como complementos: véase ", { link: "Los pronombres complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pt: ["Os pronomes que acompanham o verbo como complementos: veja ", { link: "Os pronomes complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              de: ["Die Pronomen, die als Objekte beim Verb stehen: siehe ", { link: "Die Objektpronomen", to: "fr.pronoms.pronoms-complements" }, "."]
              it: ["I pronomi che accompagnano il verbo come complementi: vedi ", { link: "I pronomi complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pl: ["Zaimki, które towarzyszą czasownikowi jako dopełnienia: zob. ", { link: "Zaimki dopełnieniowe", to: fr.pronoms.pronoms-complements }, "."]
              tr: ["Fiilin yanında nesne olarak duran zamirler için bkz. ", { link: "Nesne zamirleri", to: "fr.pronoms.pronoms-complements" }, "."]
              id: ["Pronomina yang menyertai kata kerja sebagai objek: lihat ", { link: "Pronomina objek", to: "fr.pronoms.pronoms-complements" }, "."]
              vi: ["Các đại từ đi với động từ làm bổ ngữ: xem ", { link: "Đại từ bổ ngữ", to: "fr.pronoms.pronoms-complements" }, "."]
  - title:
      fr: "Forme : les pronoms sujets"
      en: "Form: the subject pronouns"
      uk: "Форма: підметові займенники"
      es: "Forma: los pronombres sujeto"
      pt: "Forma: os pronomes sujeito"
      de: "Form: die Subjektpronomen"
      it: "Forma: i pronomi soggetto"
      pl: "Forma: zaimki podmiotowe"
      tr: "Biçim: özne zamirleri"
      id: "Bentuk: pronomina subjek"
      vi: "Dạng: đại từ chủ ngữ"
    role: "form"
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - key: "sg"
            label: { fr: "Singulier", en: "Singular", uk: "Однина", es: "Singular", pt: "Singular", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }
            features: { number: "sg" }
          - key: "pl"
            label: { fr: "Pluriel", en: "Plural", uk: "Множина", es: "Plural", pt: "Plural", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }
            features: { number: "pl" }
        rows:
          - { level: "A0", features: { person: 1 }, person: "1", sg: { alternatives: ["je", "j’"] }, pl: "nous" }
          - { level: "A0", features: { person: 2 }, person: "2", sg: "tu", pl: "vous" }
          - { level: "A0", features: { person: 3 }, person: "3", sg: { alternatives: ["il", "elle"] }, pl: { alternatives: ["ils", "elles"] } }
          - { level: "A1", features: { person: 3 }, person: "3", sg: "on" }
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: ["Devant une voyelle ou un h muet, ", { term: "je" }, " devient ", { term: "j’" }, "."]
              en: ["Before a vowel or a silent h, ", { term: "je" }, " becomes ", { term: "j’" }, "."]
              uk: ["Перед голосною або німим h ", { term: "je" }, " стає ", { term: "j’" }, "."]
              es: ["Ante vocal o h muda, ", { term: "je" }, " pasa a ", { term: "j’" }, "."]
              pt: ["Antes de vogal ou h mudo, ", { term: "je" }, " vira ", { term: "j’" }, "."]
              de: ["Vor einem Vokal oder stummen h wird ", { term: "je" }, " zu ", { term: "j’" }, "."]
              it: ["Davanti a vocale o h muta, ", { term: "je" }, " diventa ", { term: "j’" }, "."]
              pl: ["Przed samogłoską lub niemym h ", { term: "je" }, " zmienia się w ", { term: "j’" }, "."]
              tr: ["Ünlüden ya da sessiz h’den önce ", { term: "je" }, ", ", { term: "j’" }, " olur."]
              id: ["Sebelum vokal atau h bisu, ", { term: "je" }, " menjadi ", { term: "j’" }, "."]
              vi: ["Trước nguyên âm hoặc h câm, ", { term: "je" }, " thành ", { term: "j’" }, "."]
            ex: { examples: [[{ target: "J’" }, "aime le café."], [{ target: "J’" }, "habite à Nice."], [{ target: "Je" }, " parle."]] }
            tr: { en: { examples: ["I like coffee.", "I live in Nice.", "I speak."] }, uk: { examples: ["Я люблю каву.", "Я живу в Ніцці.", "Я говорю."] }, es: { examples: ["Me gusta el café.", "Vivo en Niza.", "Hablo."] }, pt: { examples: ["Eu gosto de café.", "Eu moro em Nice.", "Eu falo."] }, de: { examples: ["Ich mag Kaffee.", "Ich wohne in Nizza.", "Ich spreche."] }, it: { examples: ["Mi piace il caffè.", "Abito a Nizza.", "Parlo."] }, pl: { examples: ["Lubię kawę.", "Mieszkam w Nicei.", "Mówię."] }, tr: { examples: ["Kahveyi severim.", "Nice’te yaşıyorum.", "Konuşuyorum."] }, id: { examples: ["Aku suka kopi.", "Aku tinggal di Nice.", "Aku berbicara."] }, vi: { examples: ["Tôi thích cà phê.", "Tôi sống ở Nice.", "Tôi nói."] } }
          - type: "rule"
            level: "A0"
            text:
              fr: [{ term: "Il" }, " et ", { term: "elle" }, " existent pour un seul sujet ; ", { term: "ils" }, " et ", { term: "elles" }, " pour plusieurs."]
              en: [{ term: "Il" }, " and ", { term: "elle" }, " stand for one subject; ", { term: "ils" }, " and ", { term: "elles" }, " for several."]
              uk: [{ term: "Il" }, " і ", { term: "elle" }, " стосуються одного підмета; ", { term: "ils" }, " і ", { term: "elles" }, " — кількох."]
              es: [{ term: "Il" }, " y ", { term: "elle" }, " se usan para un solo sujeto; ", { term: "ils" }, " y ", { term: "elles" }, ", para varios."]
              pt: [{ term: "Il" }, " e ", { term: "elle" }, " valem para um só sujeito; ", { term: "ils" }, " e ", { term: "elles" }, ", para vários."]
              de: [{ term: "Il" }, " und ", { term: "elle" }, " stehen für ein Subjekt; ", { term: "ils" }, " und ", { term: "elles" }, " für mehrere."]
              it: [{ term: "Il" }, " ed ", { term: "elle" }, " valgono per un solo soggetto; ", { term: "ils" }, " ed ", { term: "elles" }, " per più soggetti."]
              pl: [{ term: "Il" }, " i ", { term: "elle" }, " dotyczą jednego podmiotu; ", { term: "ils" }, " i ", { term: "elles" }, " — kilku."]
              tr: [{ term: "Il" }, " ve ", { term: "elle" }, " tek özne için, ", { term: "ils" }, " ve ", { term: "elles" }, " birden çok özne içindir."]
              id: [{ term: "Il" }, " dan ", { term: "elle" }, " untuk satu subjek; ", { term: "ils" }, " dan ", { term: "elles" }, " untuk beberapa subjek."]
              vi: [{ term: "Il" }, " và ", { term: "elle" }, " dùng cho một chủ ngữ; ", { term: "ils" }, " và ", { term: "elles" }, " cho nhiều chủ ngữ."]
            ex: { examples: [[{ target: "Elle" }, " travaille."], [{ target: "Elles" }, " travaillent."]] }
            tr: { en: { examples: ["She is working.", "They are working."] }, uk: { examples: ["Вона працює.", "Вони працюють."] }, es: { examples: ["Ella trabaja.", "Ellas trabajan."] }, pt: { examples: ["Ela trabalha.", "Elas trabalham."] }, de: { examples: ["Sie arbeitet.", "Sie arbeiten."] }, it: { examples: ["Lei lavora.", "Loro lavorano."] }, pl: { examples: ["Ona pracuje.", "One pracują."] }, tr: { examples: ["O çalışıyor.", "Onlar çalışıyor."] }, id: { examples: ["Dia bekerja.", "Mereka bekerja."] }, vi: { examples: ["Cô ấy làm việc.", "Họ làm việc."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les élisions et les liaisons, voir ", { link: "La liaison et l’élision", to: fr.bases.liaison-elision }, "."]
              en: ["For elisions and liaisons, see ", { link: "Liaison and Elision", to: fr.bases.liaison-elision }, "."]
              uk: ["Про елізії та зв’язування див. ", { link: "Ліазон та елізія", to: fr.bases.liaison-elision }, "."]
              es: ["Para las elisiones y los enlaces, véase ", { link: "La liaison y la elisión", to: fr.bases.liaison-elision }, "."]
              pt: ["Para elisões e ligações, veja ", { link: "A liaison e a elisão", to: fr.bases.liaison-elision }, "."]
              de: ["Zu Elisionen und Liaisons siehe ", { link: "Liaison und Elision", to: "fr.bases.liaison-elision" }, "."]
              it: ["Per elisioni e legamenti, vedi ", { link: "La liaison e l'elisione", to: fr.bases.liaison-elision }, "."]
              pl: ["O elizjach i liaison — zob. ", { link: "Liaison i elizja", to: "fr.bases.liaison-elision" }, "."]
              tr: ["Ünlü düşmesi ve bağlama için bkz. ", { link: "Liaison ve ünlü düşmesi", to: fr.bases.liaison-elision }, "."]
              id: ["Untuk elisi dan liaison, lihat ", { link: "Liaison dan elisi", to: "fr.bases.liaison-elision" }, "."]
              vi: ["Về lược âm và nối âm, xem ", { link: "Nối âm và lược âm", to: "fr.bases.liaison-elision" }, "."]
  - title:
      fr: "Emploi : qui désigne quel pronom"
      en: "Use: who each pronoun stands for"
