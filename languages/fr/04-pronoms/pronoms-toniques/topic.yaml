            pt: ["um substantivo ou pronome + ", { term: "et" }, " + pronome tônico"]
            de: ["ein Nomen oder Pronomen + ", { term: "et" }, " + betontes Pronomen"]
            it: ["un nome o pronome + ", { term: "et" }, " + pronome tonico"]
            pl: ["rzeczownik lub zaimek + ", { term: "et" }, " + zaimek akcentowany"]
            tr: ["bir isim ya da zamir + ", { term: "et" }, " + vurgulu zamir"]
            id: ["kata benda atau pronomina + ", { term: "et" }, " + pronomina tonik"]
            vi: ["danh từ hoặc đại từ + ", { term: "et" }, " + đại từ nhấn mạnh"]
          ex: ["Léa et ", { target: "moi" }, ", nous sommes amis."]
          tr: { en: "Léa and I are friends.", uk: "Ми з Леа друзі.", es: "Léa y yo somos amigos.", pt: "Eu e a Léa somos amigos.", de: "Léa und ich sind Freunde.", it: "Léa e io siamo amici.", pl: "Léa i ja jesteśmy przyjaciółmi.", tr: "Léa ve ben arkadaşız.", id: "Léa dan aku berteman.", vi: "Léa và tôi là bạn." }
        - level: "A2"
          point: { fr: "Après à", en: "After à", uk: "Після à", es: "Tras à", pt: "Depois de à", de: "Nach à", it: "Dopo à", pl: "Po à", tr: "à’dan sonra", id: "Setelah à", vi: "Sau à" }
          rule:
            fr: [{ term: "être à" }, " + pronom tonique dit à qui est une chose"]
            en: [{ term: "être à" }, " + stressed pronoun says whose a thing is"]
            uk: [{ term: "être à" }, " + наголошений займенник вказує, кому належить річ"]
            es: [{ term: "être à" }, " + pronombre tónico dice de quién es una cosa"]
            pt: [{ term: "être à" }, " + pronome tônico diz de quem é uma coisa"]
            de: [{ term: "être à" }, " + betontes Pronomen sagt, wem etwas gehört"]
            it: [{ term: "être à" }, " + pronome tonico dice di chi è una cosa"]
            pl: [{ term: "être à" }, " + zaimek akcentowany mówi, do kogo coś należy"]
            tr: [{ term: "être à" }, " + vurgulu zamir bir şeyin kimin olduğunu söyler"]
            id: [{ term: "être à" }, " + pronomina tonik menyatakan milik siapa suatu benda"]
            vi: [{ term: "être à" }, " + đại từ nhấn mạnh cho biết đồ vật của ai"]
          ex: ["Ce stylo est à ", { target: "moi" }, "."]
          tr: { en: "This pen is mine.", uk: "Ця ручка моя.", es: "Este bolígrafo es mío.", pt: "Esta caneta é minha.", de: "Dieser Stift gehört mir.", it: "Questa penna è mia.", pl: "Ten długopis jest mój.", tr: "Bu kalem benim.", id: "Pulpen ini milikku.", vi: "Cây bút này là của tôi." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: ["jamais ", { term: "je" }, " ni ", { term: "tu" }, " après une préposition ou ", { term: "c’est" }]
            en: ["never ", { term: "je" }, " or ", { term: "tu" }, " after a preposition or ", { term: "c’est" }]
            uk: ["ніколи ", { term: "je" }, " чи ", { term: "tu" }, " після прийменника або ", { term: "c’est" }]
            es: ["nunca ", { term: "je" }, " ni ", { term: "tu" }, " tras una preposición o ", { term: "c’est" }]
            pt: ["nunca ", { term: "je" }, " ou ", { term: "tu" }, " depois de preposição ou ", { term: "c’est" }]
            de: ["nie ", { term: "je" }, " oder ", { term: "tu" }, " nach einer Präposition oder ", { term: "c’est" }]
            it: ["mai ", { term: "je" }, " o ", { term: "tu" }, " dopo una preposizione o ", { term: "c’est" }]
            pl: ["nigdy ", { term: "je" }, " ani ", { term: "tu" }, " po przyimku lub ", { term: "c’est" }]
            tr: ["edattan ya da ", { term: "c’est" }, "’den sonra asla ", { term: "je" }, " ya da ", { term: "tu" }, " gelmez"]
            id: ["tidak pernah ", { term: "je" }, " atau ", { term: "tu" }, " setelah preposisi atau ", { term: "c’est" }]
            vi: ["không bao giờ dùng ", { term: "je" }, " hay ", { term: "tu" }, " sau giới từ hoặc ", { term: "c’est" }]
          ex: ["Viens avec ", { target: "moi" }, "."]
          tr: { en: "Come with me.", uk: "Іди зі мною.", es: "Ven conmigo.", pt: "Venha comigo.", de: "Komm mit mir.", it: "Vieni con me.", pl: "Chodź ze mną.", tr: "Benimle gel.", id: "Ikut aku.", vi: "Đi với tôi." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le pronom tonique se place là où le pronom sujet ne peut pas se placer seul : après une préposition, après ", { term: "c’est" }, ", en réponse."]
              en: ["The stressed pronoun stands where a subject pronoun cannot stand alone: after a preposition, after ", { term: "c’est" }, ", in an answer."]
              uk: ["Наголошений займенник стоїть там, де підметовий не може стояти сам: після прийменника, після ", { term: "c’est" }, ", у відповіді."]
              es: ["El pronombre tónico aparece donde el pronombre sujeto no puede ir solo: tras una preposición, tras ", { term: "c’est" }, ", en una respuesta."]
              pt: ["O pronome tônico aparece onde o pronome sujeito não pode ficar sozinho: depois de preposição, depois de ", { term: "c’est" }, ", numa resposta."]
              de: ["Das betonte Pronomen steht dort, wo das Subjektpronomen nicht allein stehen kann: nach einer Präposition, nach ", { term: "c’est" }, ", in einer Antwort."]
              it: ["Il pronome tonico sta dove il pronome soggetto non può stare da solo: dopo una preposizione, dopo ", { term: "c’est" }, ", in una risposta."]
              pl: ["Zaimek akcentowany stoi tam, gdzie zaimek podmiotowy nie może stać sam: po przyimku, po ", { term: "c’est" }, ", w odpowiedzi."]
              tr: ["Vurgulu zamir, özne zamirinin tek başına duramadığı yerde durur: edattan sonra, ", { term: "c’est" }, "’den sonra, bir cevapta."]
              id: ["Pronomina tonik berdiri di tempat pronomina subjek tidak bisa berdiri sendiri: setelah preposisi, setelah ", { term: "c’est" }, ", dalam jawaban."]
              vi: ["Đại từ nhấn mạnh đứng ở chỗ đại từ chủ ngữ không thể đứng một mình: sau giới từ, sau ", { term: "c’est" }, ", trong câu trả lời."]
            ex: { examples: [["Je viens avec ", { target: "toi" }, "."], [{ target: "C’est moi" }, "."]] }
            tr: { en: { examples: ["I'm coming with you.", "It's me."] }, uk: { examples: ["Я йду з тобою.", "Це я."] }, es: { examples: ["Voy contigo.", "Soy yo."] }, pt: { examples: ["Eu vou com você.", "Sou eu."] }, de: { examples: ["Ich komme mit dir.", "Ich bin’s."] }, it: { examples: ["Vengo con te.", "Sono io."] }, pl: { examples: ["Idę z tobą.", "To ja."] }, tr: { examples: ["Seninle geliyorum.", "Benim."] }, id: { examples: ["Aku ikut denganmu.", "Ini aku."] }, vi: { examples: ["Tôi đi với bạn.", "Là tôi đây."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le pronom tonique ne remplace pas le pronom sujet devant le verbe."
              en: "The stressed pronoun does not replace the subject pronoun before the verb."
              uk: "Наголошений займенник не замінює підметовий перед дієсловом."
              es: "El pronombre tónico no sustituye al pronombre sujeto delante del verbo."
              pt: "O pronome tônico não substitui o pronome sujeito diante do verbo."
              de: "Das betonte Pronomen ersetzt das Subjektpronomen vor dem Verb nicht."
              it: "Il pronome tonico non sostituisce il pronome soggetto davanti al verbo."
              pl: "Zaimek akcentowany nie zastępuje zaimka podmiotowego przed czasownikiem."
              tr: "Vurgulu zamir, fiilin önündeki özne zamirinin yerini tutmaz."
              id: "Pronomina tonik tidak menggantikan pronomina subjek di depan kata kerja."
              vi: "Đại từ nhấn mạnh không thay đại từ chủ ngữ trước động từ."
            ex: [{ target: "Moi" }, ", ", { target: "je" }, " parle français."]
            tr: { en: "I speak French.", uk: "Я, наприклад, говорю французькою.", es: "Yo hablo francés.", pt: "Eu falo francês.", de: "Ich spreche Französisch.", it: "Io parlo francese.", pl: "Ja mówię po francusku.", tr: "Ben Fransızca konuşuyorum.", id: "Aku sih berbicara bahasa Prancis.", vi: "Tôi thì nói tiếng Pháp." }
          - type: "note"
            level: "A1"
            text:
              fr: ["Les pronoms sujets : voir ", { link: "Les pronoms sujets", to: "fr.pronoms.pronoms-sujets" }, "."]
              en: ["The subject pronouns: see ", { link: "Subject Pronouns", to: fr.pronoms.pronoms-sujets }, "."]
              uk: ["Підметові займенники: див. ", { link: "Підметові займенники", to: "fr.pronoms.pronoms-sujets" }, "."]
              es: ["Los pronombres sujeto: véase ", { link: "Los pronombres sujeto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pt: ["Os pronomes sujeito: veja ", { link: "Os pronomes sujeito", to: "fr.pronoms.pronoms-sujets" }, "."]
              de: ["Die Subjektpronomen: siehe ", { link: "Die Subjektpronomen", to: "fr.pronoms.pronoms-sujets" }, "."]
              it: ["I pronomi soggetto: vedi ", { link: "I pronomi soggetto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pl: ["Zaimki podmiotowe: zob. ", { link: "Zaimki podmiotowe", to: "fr.pronoms.pronoms-sujets" }, "."]
              tr: ["Özne zamirleri için bkz. ", { link: "Özne zamirleri", to: "fr.pronoms.pronoms-sujets" }, "."]
              id: ["Pronomina subjek: lihat ", { link: "Pronomina subjek", to: "fr.pronoms.pronoms-sujets" }, "."]
              vi: ["Các đại từ chủ ngữ: xem ", { link: "Đại từ chủ ngữ", to: "fr.pronoms.pronoms-sujets" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Les pronoms compléments, comme lui, me, te : voir ", { link: "Les pronoms compléments", to: "fr.pronoms.pronoms-complements" }, "."]
              en: ["Object pronouns such as lui, me, te: see ", { link: "Object Pronouns", to: fr.pronoms.pronoms-complements }, "."]
              uk: ["Займенники-додатки, як-от lui, me, te: див. ", { link: "Займенники-додатки", to: "fr.pronoms.pronoms-complements" }, "."]
              es: ["Los pronombres complemento, como lui, me, te: véase ", { link: "Los pronombres complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pt: ["Os pronomes complemento, como lui, me, te: veja ", { link: "Os pronomes complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              de: ["Objektpronomen wie lui, me, te: siehe ", { link: "Die Objektpronomen", to: "fr.pronoms.pronoms-complements" }, "."]
              it: ["I pronomi complemento, come lui, me, te: vedi ", { link: "I pronomi complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pl: ["Zaimki dopełnienia, takie jak lui, me, te: zob. ", { link: "Zaimki dopełnieniowe", to: fr.pronoms.pronoms-complements }, "."]
              tr: ["lui, me, te gibi nesne zamirleri için bkz. ", { link: "Nesne zamirleri", to: "fr.pronoms.pronoms-complements" }, "."]
              id: ["Pronomina objek seperti lui, me, te: lihat ", { link: "Pronomina objek", to: "fr.pronoms.pronoms-complements" }, "."]
              vi: ["Các đại từ bổ ngữ như lui, me, te: xem ", { link: "Đại từ bổ ngữ", to: "fr.pronoms.pronoms-complements" }, "."]
  - title:
      fr: "Forme : les pronoms toniques"
      en: "Form: the stressed pronouns"
      uk: "Форма: наголошені займенники"
      es: "Forma: los pronombres tónicos"
      pt: "Forma: os pronomes tônicos"
      de: "Form: die betonten Pronomen"
      it: "Forma: i pronomi tonici"
      pl: "Forma: zaimki akcentowane"
      tr: "Biçim: vurgulu zamirler"
      id: "Bentuk: pronomina tonik"
      vi: "Dạng: đại từ nhấn mạnh"
    role: "form"
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - key: "sg"
            label: { fr: "Singulier", en: "Singular", uk: "Однина", es: "Singular", pt: "Singular", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }
            features: { number: "sg" }
          - key: "pl"
            label: { fr: "Pluriel", en: "Plural", uk: "Множина", es: "Plural", pt: "Plural", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }
            features: { number: "pl" }
        rows:
          - { level: "A1", features: { person: 1 }, person: "1", sg: { target: "moi" }, pl: { target: "nous" } }
          - { level: "A1", features: { person: 2 }, person: "2", sg: { target: "toi" }, pl: { target: "vous" } }
          - { level: "A1", features: { person: 3 }, person: "3", sg: { alternatives: [{ target: "lui" }, { target: "elle" }] }, pl: { alternatives: [{ target: "eux" }, { target: "elles" }] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " et ", { term: "elles" }, " ont la même forme que le pronom sujet."]
              en: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " and ", { term: "elles" }, " have the same form as the subject pronoun."]
              uk: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " і ", { term: "elles" }, " мають ту саму форму, що й підметовий займенник."]
              es: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " y ", { term: "elles" }, " tienen la misma forma que el pronombre sujeto."]
              pt: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " e ", { term: "elles" }, " têm a mesma forma do pronome sujeito."]
              de: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " und ", { term: "elles" }, " haben dieselbe Form wie das Subjektpronomen."]
              it: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " ed ", { term: "elles" }, " hanno la stessa forma del pronome soggetto."]
              pl: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " i ", { term: "elles" }, " mają tę samą formę co zaimek podmiotowy."]
              tr: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " ve ", { term: "elles" }, ", özne zamiriyle aynı biçimdedir."]
              id: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, ", dan ", { term: "elles" }, " berbentuk sama dengan pronomina subjek."]
              vi: [{ term: "Nous" }, ", ", { term: "vous" }, ", ", { term: "elle" }, " và ", { term: "elles" }, " có dạng giống đại từ chủ ngữ."]
            ex: { examples: [["Il habite chez ", { target: "nous" }, "."], ["Je pars sans ", { target: "elles" }, "."]] }
            tr: { en: { examples: ["He lives with us.", "I'm leaving without them."] }, uk: { examples: ["Він живе в нас.", "Я їду без них."] }, es: { examples: ["Vive con nosotros.", "Me voy sin ellas."] }, pt: { examples: ["Ele mora conosco.", "Eu vou embora sem elas."] }, de: { examples: ["Er wohnt bei uns.", "Ich gehe ohne sie."] }, it: { examples: ["Abita da noi.", "Parto senza di loro."] }, pl: { examples: ["Mieszka u nas.", "Wyjeżdżam bez nich."] }, tr: { examples: ["Bizimle yaşıyor.", "Onlarsız gidiyorum."] }, id: { examples: ["Dia tinggal bersama kami.", "Aku pergi tanpa mereka."] }, vi: { examples: ["Anh ấy sống với chúng tôi.", "Tôi đi mà không có họ."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Lui" }, " remplace ", { term: "il" }, " et ", { term: "eux" }, " remplace ", { term: "ils" }, " ; ", { term: "eux" }, " désigne des hommes ou un groupe mixte."]
              en: [{ term: "Lui" }, " stands for ", { term: "il" }, " and ", { term: "eux" }, " for ", { term: "ils" }, "; ", { term: "eux" }, " means men or a mixed group."]
              uk: [{ term: "Lui" }, " відповідає ", { term: "il" }, ", а ", { term: "eux" }, " — ", { term: "ils" }, "; ", { term: "eux" }, " означає чоловіків або змішану групу."]
              es: [{ term: "Lui" }, " corresponde a ", { term: "il" }, " y ", { term: "eux" }, " a ", { term: "ils" }, "; ", { term: "eux" }, " designa hombres o un grupo mixto."]
              pt: [{ term: "Lui" }, " corresponde a ", { term: "il" }, " e ", { term: "eux" }, " a ", { term: "ils" }, "; ", { term: "eux" }, " designa homens ou um grupo misto."]
              de: [{ term: "Lui" }, " entspricht ", { term: "il" }, " und ", { term: "eux" }, " entspricht ", { term: "ils" }, "; ", { term: "eux" }, " steht für Männer oder eine gemischte Gruppe."]
              it: [{ term: "Lui" }, " corrisponde a ", { term: "il" }, " ed ", { term: "eux" }, " a ", { term: "ils" }, "; ", { term: "eux" }, " indica uomini o un gruppo misto."]
              pl: [{ term: "Lui" }, " odpowiada ", { term: "il" }, ", a ", { term: "eux" }, " odpowiada ", { term: "ils" }, "; ", { term: "eux" }, " oznacza mężczyzn lub grupę mieszaną."]
              tr: [{ term: "Lui" }, ", ", { term: "il" }, "’in; ", { term: "eux" }, ", ", { term: "ils" }, "’in karşılığıdır; ", { term: "eux" }, " erkekleri ya da karma grubu gösterir."]
              id: [{ term: "Lui" }, " sepadan dengan ", { term: "il" }, " dan ", { term: "eux" }, " dengan ", { term: "ils" }, "; ", { term: "eux" }, " untuk laki-laki atau kelompok campuran."]
              vi: [{ term: "Lui" }, " ứng với ", { term: "il" }, " và ", { term: "eux" }, " ứng với ", { term: "ils" }, "; ", { term: "eux" }, " chỉ đàn ông hoặc nhóm hỗn hợp."]
            ex: { examples: [["Marc est là : c’est ", { target: "lui" }, "."], ["Paul et Léa sont là : c’est pour ", { target: "eux" }, "."]] }
            tr: { en: { examples: ["Marc is here: it's him.", "Paul and Léa are here: it's for them."] }, uk: { examples: ["Марк тут: це він.", "Поль і Леа тут: це для них."] }, es: { examples: ["Marc está aquí: es él.", "Paul y Léa están aquí: es para ellos."] }, pt: { examples: ["O Marc está aqui: é ele.", "O Paul e a Léa estão aqui: é para eles."] }, de: { examples: ["Marc ist da: Er ist es.", "Paul und Léa sind da: Es ist für sie."] }, it: { examples: ["Marc è qui: è lui.", "Paul e Léa sono qui: è per loro."] }, pl: { examples: ["Marc jest tutaj: to on.", "Paul i Léa są tutaj: to dla nich."] }, tr: { examples: ["Marc burada: o.", "Paul ile Léa burada: onlar için."] }, id: { examples: ["Marc ada di sini: itu dia.", "Paul dan Léa ada di sini: ini untuk mereka."] }, vi: { examples: ["Marc ở đây: là anh ấy.", "Paul và Léa ở đây: là cho họ."] } }
          - type: "note"
            level: "A2"
            text:
              fr: [{ term: "lui" }, " sert aussi de pronom complément : voir ", { link: "Les pronoms compléments", to: "fr.pronoms.pronoms-complements" }, "."]
              en: [{ term: "lui" }, " also serves as an object pronoun: see ", { link: "Object Pronouns", to: fr.pronoms.pronoms-complements }, "."]
              uk: [{ term: "lui" }, " служить також займенником-додатком: див. ", { link: "Займенники-додатки", to: "fr.pronoms.pronoms-complements" }, "."]
              es: [{ term: "lui" }, " también es pronombre complemento: véase ", { link: "Los pronombres complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pt: [{ term: "lui" }, " também é pronome complemento: veja ", { link: "Os pronomes complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              de: [{ term: "lui" }, " ist auch Objektpronomen: siehe ", { link: "Die Objektpronomen", to: "fr.pronoms.pronoms-complements" }, "."]
              it: [{ term: "lui" }, " è anche pronome complemento: vedi ", { link: "I pronomi complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pl: [{ term: "lui" }, " jest też zaimkiem dopełnienia: zob. ", { link: "Zaimki dopełnieniowe", to: fr.pronoms.pronoms-complements }, "."]
              tr: [{ term: "lui" }, " aynı zamanda nesne zamiridir: bkz. ", { link: "Nesne zamirleri", to: "fr.pronoms.pronoms-complements" }, "."]
