sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Pour comparer, on met ", { term: "plus" }, ", ", { term: "moins" }, " ou ", { term: "aussi" }, " devant l’adjectif, puis ", { term: "que" }, " et le second terme."]
              en: ["To compare, put ", { term: "plus" }, ", ", { term: "moins" }, " or ", { term: "aussi" }, " before the adjective, then ", { term: "que" }, " and the second term."]
              uk: ["Щоб порівняти, перед прикметником ставлять ", { term: "plus" }, ", ", { term: "moins" }, " або ", { term: "aussi" }, ", потім ", { term: "que" }, " і другий член порівняння."]
              es: ["Para comparar, se pone ", { term: "plus" }, ", ", { term: "moins" }, " o ", { term: "aussi" }, " delante del adjetivo, luego ", { term: "que" }, " y el segundo término."]
              pt: ["Para comparar, coloca-se ", { term: "plus" }, ", ", { term: "moins" }, " ou ", { term: "aussi" }, " antes do adjetivo, depois ", { term: "que" }, " e o segundo termo."]
              de: ["Zum Vergleichen steht ", { term: "plus" }, ", ", { term: "moins" }, " oder ", { term: "aussi" }, " vor dem Adjektiv, danach ", { term: "que" }, " und der zweite Vergleichspunkt."]
              it: ["Per confrontare si mette ", { term: "plus" }, ", ", { term: "moins" }, " o ", { term: "aussi" }, " davanti all’aggettivo, poi ", { term: "que" }, " e il secondo termine."]
              pl: ["Aby porównać, przed przymiotnikiem stawia się ", { term: "plus" }, ", ", { term: "moins" }, " lub ", { term: "aussi" }, ", potem ", { term: "que" }, " i drugi człon porównania."]
              tr: ["Karşılaştırmak için sıfatın önüne ", { term: "plus" }, ", ", { term: "moins" }, " ya da ", { term: "aussi" }, " konur; sonra ", { term: "que" }, " ve ikinci öğe gelir."]
              id: ["Untuk membandingkan, letakkan ", { term: "plus" }, ", ", { term: "moins" }, ", atau ", { term: "aussi" }, " sebelum kata sifat, lalu ", { term: "que" }, " dan pembanding kedua."]
              vi: ["Để so sánh, đặt ", { term: "plus" }, ", ", { term: "moins" }, " hoặc ", { term: "aussi" }, " trước tính từ, rồi đến ", { term: "que" }, " và vế thứ hai."]
            ex: { examples: [["Paul est ", { target: "plus petit que" }, " Léa."], ["Léa est ", { target: "aussi grande que" }, " Marc."]] }
            tr: { en: { examples: ["Paul is smaller than Léa.", "Léa is as tall as Marc."] }, uk: { examples: ["Пол нижчий за Леа.", "Леа така ж висока, як Марк."] }, es: { examples: ["Paul es más bajo que Léa.", "Léa es tan alta como Marc."] }, pt: { examples: ["O Paul é mais baixo que a Léa.", "A Léa é tão alta quanto o Marc."] }, de: { examples: ["Paul ist kleiner als Léa.", "Léa ist so groß wie Marc."] }, it: { examples: ["Paul è più basso di Léa.", "Léa è alta quanto Marc."] }, pl: { examples: ["Paul jest niższy od Léi.", "Léa jest tak wysoka jak Marc."] }, tr: { examples: ["Paul, Léa’dan daha kısa.", "Léa, Marc kadar uzun."] }, id: { examples: ["Paul lebih pendek daripada Léa.", "Léa setinggi Marc."] }, vi: { examples: ["Paul thấp hơn Léa.", "Léa cao bằng Marc."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le superlatif ajoute l’article : ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              en: ["The superlative adds the article: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              uk: ["Найвищий ступінь додає артикль: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              es: ["El superlativo añade el artículo: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              pt: ["O superlativo acrescenta o artigo: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              de: ["Der Superlativ fügt den Artikel hinzu: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              it: ["Il superlativo aggiunge l’articolo: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              pl: ["Stopień najwyższy dodaje przedimek: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              tr: ["Üstünlük derecesi tanımlık ekler: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              id: ["Superlatif menambahkan artikel: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
              vi: ["So sánh nhất thêm mạo từ: ", { term: "le plus" }, ", ", { term: "la moins" }, ", ", { term: "les plus" }, "."]
            ex: { examples: [["Paul est ", { target: "le plus petit" }, "."], ["Ces sacs sont ", { target: "les moins chers" }, "."]] }
            tr: { en: { examples: ["Paul is the smallest.", "These bags are the cheapest."] }, uk: { examples: ["Пол найнижчий.", "Ці сумки найдешевші."] }, es: { examples: ["Paul es el más bajo.", "Estos bolsos son los más baratos."] }, pt: { examples: ["O Paul é o mais baixo.", "Estas bolsas são as mais baratas."] }, de: { examples: ["Paul ist der Kleinste.", "Diese Taschen sind die billigsten."] }, it: { examples: ["Paul è il più basso.", "Queste borse sono le meno care."] }, pl: { examples: ["Paul jest najniższy.", "Te torby są najtańsze."] }, tr: { examples: ["Paul en kısa olan.", "Bu çantalar en ucuz olanlar."] }, id: { examples: ["Paul yang paling pendek.", "Tas-tas ini yang paling murah."] }, vi: { examples: ["Paul thấp nhất.", "Những chiếc túi này rẻ nhất."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "La comparaison porte sur une qualité (adjectif), une manière (adverbe), une quantité (nom) ou une action (verbe)."
              en: "A comparison can concern a quality (adjective), a manner (adverb), an amount (noun) or an action (verb)."
              uk: "Порівняння може стосуватися якості (прикметник), способу (прислівник), кількості (іменник) або дії (дієслово)."
              es: "La comparación puede referirse a una cualidad (adjetivo), una manera (adverbio), una cantidad (nombre) o una acción (verbo)."
              pt: "A comparação pode ser de uma qualidade (adjetivo), uma maneira (advérbio), uma quantidade (substantivo) ou uma ação (verbo)."
              de: "Der Vergleich kann eine Eigenschaft (Adjektiv), eine Art und Weise (Adverb), eine Menge (Nomen) oder eine Handlung (Verb) betreffen."
              it: "Il confronto può riguardare una qualità (aggettivo), un modo (avverbio), una quantità (nome) o un’azione (verbo)."
              pl: "Porównanie może dotyczyć cechy (przymiotnik), sposobu (przysłówek), ilości (rzeczownik) lub czynności (czasownik)."
              tr: "Karşılaştırma bir niteliği (sıfat), bir biçimi (zarf), bir miktarı (isim) ya da bir eylemi (fiil) kapsayabilir."
              id: "Perbandingan dapat menyangkut sifat (kata sifat), cara (adverbia), jumlah (kata benda), atau tindakan (kata kerja)."
              vi: "Sự so sánh có thể nói về tính chất (tính từ), cách thức (trạng từ), số lượng (danh từ) hoặc hành động (động từ)."
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour l’accord et la place de l’adjectif, voir ", { link: "Les adjectifs", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              en: ["For the agreement and position of the adjective, see ", { link: "Adjectives", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              uk: ["Про узгодження й місце прикметника — див. ", { link: "Прикметники", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              es: ["Para la concordancia y la posición del adjetivo, ver ", { link: "Los adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pt: ["Para a concordância e a posição do adjetivo, veja ", { link: "Os adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              de: ["Zu Angleichung und Stellung des Adjektivs siehe ", { link: "Die Adjektive", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              it: ["Per la concordanza e la posizione dell’aggettivo, vedi ", { link: "Gli aggettivi", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pl: ["O zgodności i miejscu przymiotnika — zob. ", { link: "Przymiotniki", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              tr: ["Sıfatın uyumu ve yeri için bkz. ", { link: "Sıfatlar", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              id: ["Untuk kesesuaian dan posisi kata sifat, lihat ", { link: "Kata sifat", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              vi: ["Về sự hòa hợp và vị trí của tính từ, xem ", { link: "Tính từ", to: "fr.adjectif-adverbe.adjectifs" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour les adverbes comme ", { term: "vite" }, " et ", { term: "bien" }, ", voir ", { link: "Les adverbes", to: "fr.adjectif-adverbe.adverbes" }, "."]
              en: ["For adverbs such as ", { term: "vite" }, " and ", { term: "bien" }, ", see ", { link: "Adverbs", to: "fr.adjectif-adverbe.adverbes" }, "."]
              uk: ["Про прислівники на кшталт ", { term: "vite" }, " і ", { term: "bien" }, " — див. ", { link: "Прислівники", to: "fr.adjectif-adverbe.adverbes" }, "."]
              es: ["Para los adverbios como ", { term: "vite" }, " y ", { term: "bien" }, ", ver ", { link: "Los adverbios", to: "fr.adjectif-adverbe.adverbes" }, "."]
              pt: ["Para advérbios como ", { term: "vite" }, " e ", { term: "bien" }, ", veja ", { link: "Os advérbios", to: "fr.adjectif-adverbe.adverbes" }, "."]
              de: ["Zu Adverbien wie ", { term: "vite" }, " und ", { term: "bien" }, " siehe ", { link: "Die Adverbien", to: "fr.adjectif-adverbe.adverbes" }, "."]
              it: ["Per gli avverbi come ", { term: "vite" }, " e ", { term: "bien" }, ", vedi ", { link: "Gli avverbi", to: "fr.adjectif-adverbe.adverbes" }, "."]
              pl: ["O przysłówkach takich jak ", { term: "vite" }, " i ", { term: "bien" }, " — zob. ", { link: "Przysłówki", to: "fr.adjectif-adverbe.adverbes" }, "."]
