              uk: ["Коли другий член порівняння зрозумілий, ", { term: "que" }, " і цей член випадають."]
              es: ["Cuando el segundo término es claro, ", { term: "que" }, " y ese término desaparecen."]
              pt: ["Quando o segundo termo é claro, ", { term: "que" }, " e esse termo desaparecem."]
              de: ["Ist der zweite Vergleichspunkt klar, fallen ", { term: "que" }, " und dieser Punkt weg."]
