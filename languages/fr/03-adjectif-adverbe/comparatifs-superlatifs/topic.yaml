              es: ["Para los pronombres tónicos, ver ", { link: "Los pronombres tónicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              pt: ["Para os pronomes tônicos, veja ", { link: "Os pronomes tônicos", to: "fr.pronoms.pronoms-toniques" }, "."]
