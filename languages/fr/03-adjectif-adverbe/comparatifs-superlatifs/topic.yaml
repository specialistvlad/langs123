            ex: { examples: [["Tu es plus petit que ", { target: "moi" }, "."], ["Je suis moins fort que ", { target: "lui" }, "."]] }
            tr: { en: { examples: ["You are smaller than me.", "I'm weaker than him."] }, uk: { examples: ["Ти нижчий за мене.", "Я слабший за нього."] }, es: { examples: ["Eres más bajo que yo.", "Soy menos fuerte que él."] }, pt: { examples: ["Você é mais baixo que eu.", "Eu sou menos forte que ele."] }, de: { examples: ["Du bist kleiner als ich.", "Ich bin weniger stark als er."] }, it: { examples: ["Sei più basso di me.", "Sono meno forte di lui."] }, pl: { examples: ["Jesteś niższy ode mnie.", "Jestem słabszy od niego."] }, tr: { examples: ["Sen benden daha kısasın.", "Ben ondan daha az güçlüyüm."] }, id: { examples: ["Kamu lebih pendek daripada aku.", "Aku kurang kuat daripada dia."] }, vi: { examples: ["Bạn thấp hơn tôi.", "Tôi yếu hơn anh ấy."] } }
          - type: "note"
