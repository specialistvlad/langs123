            text:
              fr: "L’adjectif s’accorde avec le sujet, pas avec le second terme."
              en: "The adjective agrees with the subject, not with the second term."
              uk: "Прикметник узгоджується з підметом, а не з другим членом порівняння."
              es: "El adjetivo concuerda con el sujeto, no con el segundo término."
              pt: "O adjetivo concorda com o sujeito, não com o segundo termo."
              de: "Das Adjektiv richtet sich nach dem Subjekt, nicht nach dem zweiten Vergleichspunkt."
              it: "L’aggettivo concorda con il soggetto, non con il secondo termine."
              pl: "Przymiotnik zgadza się z podmiotem, a nie z drugim członem porównania."
              tr: "Sıfat özneye uyar, ikinci öğeye değil."
              id: "Kata sifat menyesuaikan diri dengan subjek, bukan dengan pembanding kedua."
              vi: "Tính từ hòa hợp với chủ ngữ, không phải với vế thứ hai."
            ex: { examples: [["Léa est ", { target: "plus grande" }, " que Paul."], ["Paul est ", { target: "plus petit" }, " que Léa."]] }
            tr: { en: { examples: ["Léa is taller than Paul.", "Paul is smaller than Léa."] }, uk: { examples: ["Леа вища за Пола.", "Пол нижчий за Леа."] }, es: { examples: ["Léa es más alta que Paul.", "Paul es más bajo que Léa."] }, pt: { examples: ["A Léa é mais alta que o Paul.", "O Paul é mais baixo que a Léa."] }, de: { examples: ["Léa ist größer als Paul.", "Paul ist kleiner als Léa."] }, it: { examples: ["Léa è più alta di Paul.", "Paul è più basso di Léa."] }, pl: { examples: ["Léa jest wyższa od Paula.", "Paul jest niższy od Léi."] }, tr: { examples: ["Léa, Paul’dan daha uzun.", "Paul, Léa’dan daha kısa."] }, id: { examples: ["Léa lebih tinggi daripada Paul.", "Paul lebih pendek daripada Léa."] }, vi: { examples: ["Léa cao hơn Paul.", "Paul thấp hơn Léa."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Après ", { term: "que" }, ", on met un pronom tonique : ", { term: "moi" }, ", ", { term: "toi" }, ", ", { term: "lui" }, ", ", { term: "elle" }, "."]
              en: ["After ", { term: "que" }, " comes a stressed pronoun: ", { term: "moi" }, ", ", { term: "toi" }, ", ", { term: "lui" }, ", ", { term: "elle" }, "."]
              uk: ["Після ", { term: "que" }, " стоїть наголошений займенник: ", { term: "moi" }, ", ", { term: "toi" }, ", ", { term: "lui" }, ", ", { term: "elle" }, "."]
              es: ["Después de ", { term: "que" }, " va un pronombre tónico: ", { term: "moi" }, ", ", { term: "toi" }, ", ", { term: "lui" }, ", ", { term: "elle" }, "."]
