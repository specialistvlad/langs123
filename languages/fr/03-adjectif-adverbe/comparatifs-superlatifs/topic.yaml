              it: ["Per i pronomi tonici, vedi ", { link: "I pronomi tonici", to: "fr.pronoms.pronoms-toniques" }, "."]
              pl: ["O zaimkach akcentowanych — zob. ", { link: "Zaimki akcentowane", to: "fr.pronoms.pronoms-toniques" }, "."]
              tr: ["Vurgulu zamirler için bkz. ", { link: "Vurgulu zamirler", to: "fr.pronoms.pronoms-toniques" }, "."]
