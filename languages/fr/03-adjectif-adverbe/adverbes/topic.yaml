summary:
  lead:
    fr: "Les adverbes complètent un verbe, un adjectif ou un autre adverbe et ne changent jamais de forme ; la plupart se placent après le verbe."
    en: "Adverbs add to a verb, an adjective or another adverb and never change form; most come right after the verb."
    uk: "Прислівники уточнюють дієслово, прикметник або інший прислівник і ніколи не змінюються; більшість стоїть одразу після дієслова."
    es: "Los adverbios complementan un verbo, un adjetivo u otro adverbio y nunca cambian de forma; la mayoría va justo después del verbo."
    pt: "Os advérbios complementam um verbo, um adjetivo ou outro advérbio e nunca mudam de forma; a maioria vem logo depois do verbo."
    de: "Adverbien ergänzen ein Verb, ein Adjektiv oder ein anderes Adverb und ändern nie ihre Form; die meisten stehen direkt nach dem Verb."
    it: "Gli avverbi completano un verbo, un aggettivo o un altro avverbio e non cambiano mai forma; la maggior parte segue subito il verbo."
    pl: "Przysłówki dopełniają czasownik, przymiotnik lub inny przysłówek i nigdy nie zmieniają formy; większość stoi zaraz po czasowniku."
    tr: "Zarflar bir fiili, sıfatı ya da başka bir zarfı tamamlar ve biçim değiştirmez; çoğu fiilin hemen ardından gelir."
    id: "Adverbia melengkapi kata kerja, kata sifat, atau adverbia lain dan tidak pernah berubah bentuk; kebanyakan berada tepat setelah kata kerja."
    vi: "Trạng từ bổ nghĩa cho động từ, tính từ hoặc trạng từ khác và không bao giờ đổi dạng; phần lớn đứng ngay sau động từ."
  rule:
    fr: "L’adverbe se place juste après le verbe, avant son complément :"
    en: "The adverb goes right after the verb, before its object:"
    uk: "Прислівник стоїть одразу після дієслова, перед додатком:"
    es: "El adverbio va justo después del verbo, antes del complemento:"
    pt: "O advérbio vem logo depois do verbo, antes do complemento:"
    de: "Das Adverb steht direkt nach dem Verb, vor dem Objekt:"
    it: "L’avverbio sta subito dopo il verbo, prima del complemento:"
    pl: "Przysłówek stoi zaraz po czasowniku, przed dopełnieniem:"
    tr: "Zarf, fiilin hemen ardından, nesneden önce gelir:"
    id: "Adverbia berada tepat setelah kata kerja, sebelum objeknya:"
    vi: "Trạng từ đứng ngay sau động từ, trước tân ngữ:"
  ex: { examples: [["Je parle ", { target: "bien" }, " français."], ["J’aime ", { target: "beaucoup" }, " le café."]] }
