            vi: [{ term: "très" }, " không đi với động từ: dùng ", { term: "beaucoup" }]
          ex: ["J’aime ", { target: "beaucoup" }, " le café."]
          tr: { en: "I like coffee a lot.", uk: "Я дуже люблю каву.", es: "Me gusta mucho el café.", pt: "Eu gosto muito de café.", de: "Ich mag Kaffee sehr.", it: "Mi piace molto il caffè.", pl: "Bardzo lubię kawę.", tr: "Kahveyi çok severim.", id: "Aku sangat suka kopi.", vi: "Tôi rất thích cà phê." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "L’adverbe complète un verbe, un adjectif ou un autre adverbe."
              en: "An adverb adds to a verb, an adjective or another adverb."
              uk: "Прислівник уточнює дієслово, прикметник або інший прислівник."
              es: "El adverbio complementa un verbo, un adjetivo u otro adverbio."
              pt: "O advérbio complementa um verbo, um adjetivo ou outro advérbio."
              de: "Das Adverb ergänzt ein Verb, ein Adjektiv oder ein anderes Adverb."
              it: "L’avverbio completa un verbo, un aggettivo o un altro avverbio."
              pl: "Przysłówek dopełnia czasownik, przymiotnik lub inny przysłówek."
              tr: "Zarf bir fiili, bir sıfatı ya da başka bir zarfı tamamlar."
              id: "Adverbia melengkapi kata kerja, kata sifat, atau adverbia lain."
              vi: "Trạng từ bổ nghĩa cho động từ, tính từ hoặc trạng từ khác."
            ex: { examples: [["Elle chante ", { target: "bien" }, "."], ["Il est ", { target: "très" }, " grand."], ["Elle parle ", { target: "très" }, " bien."]] }
            tr: { en: { examples: ["She sings well.", "He is very tall.", "She speaks very well."] }, uk: { examples: ["Вона добре співає.", "Він дуже високий.", "Вона дуже добре говорить."] }, es: { examples: ["Ella canta bien.", "Él es muy alto.", "Ella habla muy bien."] }, pt: { examples: ["Ela canta bem.", "Ele é muito alto.", "Ela fala muito bem."] }, de: { examples: ["Sie singt gut.", "Er ist sehr groß.", "Sie spricht sehr gut."] }, it: { examples: ["Lei canta bene.", "Lui è molto alto.", "Lei parla molto bene."] }, pl: { examples: ["Ona dobrze śpiewa.", "On jest bardzo wysoki.", "Ona mówi bardzo dobrze."] }, tr: { examples: ["O iyi şarkı söyler.", "O çok uzun.", "O çok iyi konuşur."] }, id: { examples: ["Dia bernyanyi dengan baik.", "Dia sangat tinggi.", "Dia berbicara dengan sangat baik."] }, vi: { examples: ["Cô ấy hát hay.", "Anh ấy rất cao.", "Cô ấy nói rất giỏi."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "L’adverbe ne change jamais de forme."
              en: "An adverb never changes form."
              uk: "Прислівник ніколи не змінює форму."
              es: "El adverbio nunca cambia de forma."
              pt: "O advérbio nunca muda de forma."
              de: "Das Adverb ändert nie seine Form."
              it: "L’avverbio non cambia mai forma."
              pl: "Przysłówek nigdy nie zmienia formy."
              tr: "Zarf hiçbir zaman biçim değiştirmez."
              id: "Adverbia tidak pernah berubah bentuk."
              vi: "Trạng từ không bao giờ đổi dạng."
            ex: { examples: [["Il parle ", { target: "bien" }, "."], ["Elles parlent ", { target: "bien" }, "."]] }
            tr: { en: { examples: ["He speaks well.", "They speak well."] }, uk: { examples: ["Він добре говорить.", "Вони добре говорять."] }, es: { examples: ["Él habla bien.", "Ellas hablan bien."] }, pt: { examples: ["Ele fala bem.", "Elas falam bem."] }, de: { examples: ["Er spricht gut.", "Sie sprechen gut."] }, it: { examples: ["Lui parla bene.", "Loro parlano bene."] }, pl: { examples: ["On dobrze mówi.", "One dobrze mówią."] }, tr: { examples: ["O iyi konuşur.", "Onlar iyi konuşur."] }, id: { examples: ["Dia berbicara dengan baik.", "Mereka berbicara dengan baik."] }, vi: { examples: ["Anh ấy nói giỏi.", "Họ nói giỏi."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Les adjectifs, eux, s’accordent : voir ", { link: "Les adjectifs", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              en: ["Adjectives do agree: see ", { link: "Adjectives", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              uk: ["Прикметники, навпаки, узгоджуються: див. ", { link: "Прикметники", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              es: ["Los adjetivos sí concuerdan: ver ", { link: "Los adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pt: ["Os adjetivos concordam: veja ", { link: "Os adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              de: ["Adjektive werden dagegen angeglichen: siehe ", { link: "Die Adjektive", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              it: ["Gli aggettivi invece concordano: vedi ", { link: "Gli aggettivi", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pl: ["Przymiotniki natomiast się zgadzają — zob. ", { link: "Przymiotniki", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              tr: ["Sıfatlar ise uyum gösterir: bkz. ", { link: "Sıfatlar", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              id: ["Kata sifat justru menyesuaikan diri: lihat ", { link: "Kata sifat", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              vi: ["Còn tính từ thì hòa hợp: xem ", { link: "Tính từ", to: "fr.adjectif-adverbe.adjectifs" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour ", { term: "plus vite" }, " et ", { term: "mieux" }, ", voir ", { link: "Comparatifs et superlatifs", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              en: ["For ", { term: "plus vite" }, " and ", { term: "mieux" }, ", see ", { link: "Comparatives and Superlatives", to: fr.adjectif-adverbe.comparatifs-superlatifs }, "."]
              uk: ["Про ", { term: "plus vite" }, " і ", { term: "mieux" }, " — див. ", { link: "Вищий і найвищий ступінь", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              es: ["Para ", { term: "plus vite" }, " y ", { term: "mieux" }, ", ver ", { link: "Comparativos y superlativos", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              pt: ["Para ", { term: "plus vite" }, " e ", { term: "mieux" }, ", veja ", { link: "Comparativos e superlativos", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              de: ["Zu ", { term: "plus vite" }, " und ", { term: "mieux" }, " siehe ", { link: "Komparativ und Superlativ", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              it: ["Per ", { term: "plus vite" }, " e ", { term: "mieux" }, ", vedi ", { link: "Comparativi e superlativi", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              pl: ["O ", { term: "plus vite" }, " i ", { term: "mieux" }, " — zob. ", { link: "Stopień wyższy i najwyższy", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              tr: [{ term: "plus vite" }, " ve ", { term: "mieux" }, " için bkz. ", { link: "Karşılaştırma ve üstünlük", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              id: ["Untuk ", { term: "plus vite" }, " dan ", { term: "mieux" }, ", lihat ", { link: "Komparatif dan superlatif", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
              vi: ["Về ", { term: "plus vite" }, " và ", { term: "mieux" }, ", xem ", { link: "So sánh hơn và so sánh nhất", to: "fr.adjectif-adverbe.comparatifs-superlatifs" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour ", { term: "jamais" }, ", ", { term: "plus" }, " et ", { term: "pas encore" }, ", voir ", { link: "La négation", to: "fr.phrase.negation" }, "."]
              en: ["For ", { term: "jamais" }, ", ", { term: "plus" }, " and ", { term: "pas encore" }, ", see ", { link: "Negation", to: "fr.phrase.negation" }, "."]
              uk: ["Про ", { term: "jamais" }, ", ", { term: "plus" }, " і ", { term: "pas encore" }, " — див. ", { link: "Заперечення", to: "fr.phrase.negation" }, "."]
              es: ["Para ", { term: "jamais" }, ", ", { term: "plus" }, " y ", { term: "pas encore" }, ", ver ", { link: "La negación", to: "fr.phrase.negation" }, "."]
              pt: ["Para ", { term: "jamais" }, ", ", { term: "plus" }, " e ", { term: "pas encore" }, ", veja ", { link: "A negação", to: "fr.phrase.negation" }, "."]
              de: ["Zu ", { term: "jamais" }, ", ", { term: "plus" }, " und ", { term: "pas encore" }, " siehe ", { link: "Die Verneinung", to: "fr.phrase.negation" }, "."]
              it: ["Per ", { term: "jamais" }, ", ", { term: "plus" }, " e ", { term: "pas encore" }, ", vedi ", { link: "La negazione", to: "fr.phrase.negation" }, "."]
              pl: ["O ", { term: "jamais" }, ", ", { term: "plus" }, " i ", { term: "pas encore" }, " — zob. ", { link: "Przeczenie", to: "fr.phrase.negation" }, "."]
              tr: [{ term: "jamais" }, ", ", { term: "plus" }, " ve ", { term: "pas encore" }, " için bkz. ", { link: "Olumsuzluk", to: "fr.phrase.negation" }, "."]
              id: ["Untuk ", { term: "jamais" }, ", ", { term: "plus" }, ", dan ", { term: "pas encore" }, ", lihat ", { link: "Negasi", to: "fr.phrase.negation" }, "."]
              vi: ["Về ", { term: "jamais" }, ", ", { term: "plus" }, " và ", { term: "pas encore" }, ", xem ", { link: "Phủ định", to: "fr.phrase.negation" }, "."]
