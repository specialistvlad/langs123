            vi: [{ alternatives: [{ mapping: [{ term: "beau" }, { term: "bel" }] }, { mapping: [{ term: "nouveau" }, { term: "nouvel" }] }, { mapping: [{ term: "vieux" }, { term: "vieil" }] }] }, " trước nguyên âm"]
