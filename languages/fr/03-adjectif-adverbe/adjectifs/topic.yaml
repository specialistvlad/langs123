sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "L’adjectif s’accorde en genre et en nombre avec le nom qu’il décrit."
              en: "An adjective agrees in gender and number with the noun it describes."
              uk: "Прикметник узгоджується в роді й числі з іменником, який він описує."
              es: "El adjetivo concuerda en género y número con el nombre al que describe."
              pt: "O adjetivo concorda em gênero e número com o substantivo que descreve."
              de: "Das Adjektiv richtet sich in Genus und Numerus nach dem Nomen, das es beschreibt."
              it: "L’aggettivo concorda in genere e numero con il nome che descrive."
              pl: "Przymiotnik zgadza się w rodzaju i liczbie z rzeczownikiem, który opisuje."
              tr: "Sıfat, tanımladığı ismin cinsine ve sayısına uyar."
              id: "Kata sifat menyesuaikan gender dan jumlah kata benda yang diterangkannya."
              vi: "Tính từ hòa hợp về giống và số với danh từ mà nó miêu tả."
            ex: { examples: [["Le livre est ", { target: "petit" }, "."], ["La maison est ", { target: "petite" }, "."]] }
            tr: { en: { examples: ["The book is small.", "The house is small."] }, uk: { examples: ["Книжка маленька.", "Будинок маленький."] }, es: { examples: ["El libro es pequeño.", "La casa es pequeña."] }, pt: { examples: ["O livro é pequeno.", "A casa é pequena."] }, de: { examples: ["Das Buch ist klein.", "Das Haus ist klein."] }, it: { examples: ["Il libro è piccolo.", "La casa è piccola."] }, pl: { examples: ["Książka jest mała.", "Dom jest mały."] }, tr: { examples: ["Kitap küçük.", "Ev küçük."] }, id: { examples: ["Buku itu kecil.", "Rumah itu kecil."] }, vi: { examples: ["Quyển sách nhỏ.", "Ngôi nhà nhỏ."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["L’accord se fait aussi après ", { term: "être" }, ", avec le sujet."]
              en: ["The agreement also holds after ", { term: "être" }, ", with the subject."]
              uk: ["Узгодження діє і після ", { term: "être" }, ": з підметом."]
              es: ["La concordancia se da también tras ", { term: "être" }, ", con el sujeto."]
              pt: ["A concordância vale também depois de ", { term: "être" }, ", com o sujeito."]
              de: ["Die Angleichung gilt auch nach ", { term: "être" }, ", und zwar an das Subjekt."]
              it: ["La concordanza vale anche dopo ", { term: "être" }, ", con il soggetto."]
              pl: ["Zgodność obowiązuje także po ", { term: "être" }, ", z podmiotem."]
              tr: ["Uyum ", { term: "être" }, " fiilinden sonra da geçerlidir; özneye uyulur."]
              id: ["Kesesuaian juga berlaku setelah ", { term: "être" }, ", mengikuti subjek."]
              vi: ["Sự hòa hợp cũng áp dụng sau ", { term: "être" }, ", theo chủ ngữ."]
            ex: { examples: [["Léa est ", { target: "contente" }, "."], ["Les enfants sont ", { target: "contents" }, "."]] }
            tr: { en: { examples: ["Léa is happy.", "The children are happy."] }, uk: { examples: ["Леа задоволена.", "Діти задоволені."] }, es: { examples: ["Léa está contenta.", "Los niños están contentos."] }, pt: { examples: ["A Léa está contente.", "As crianças estão contentes."] }, de: { examples: ["Léa ist zufrieden.", "Die Kinder sind zufrieden."] }, it: { examples: ["Léa è contenta.", "I bambini sono contenti."] }, pl: { examples: ["Léa jest zadowolona.", "Dzieci są zadowolone."] }, tr: { examples: ["Léa memnun.", "Çocuklar memnun."] }, id: { examples: ["Léa senang.", "Anak-anak senang."] }, vi: { examples: ["Léa vui.", "Bọn trẻ vui."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Pour des noms de genres différents, l’adjectif se met au masculin pluriel."
              en: "For nouns of different genders, the adjective takes the masculine plural."
              uk: "Для іменників різного роду прикметник стоїть у чоловічому роді множини."
              es: "Con nombres de géneros distintos, el adjetivo va en masculino plural."
              pt: "Com substantivos de gêneros diferentes, o adjetivo vai no masculino plural."
              de: "Bei Nomen verschiedenen Geschlechts steht das Adjektiv im Maskulinum Plural."
              it: "Con nomi di genere diverso, l’aggettivo va al maschile plurale."
              pl: "Przy rzeczownikach różnego rodzaju przymiotnik ma formę męską liczby mnogiej."
              tr: "Farklı cinsten isimlerde sıfat eril çoğul olur."
              id: "Untuk kata benda yang gendernya berbeda, kata sifat memakai maskulin jamak."
              vi: "Với danh từ khác giống, tính từ dùng giống đực số nhiều."
            ex: { examples: [["Léa et Paul sont ", { target: "français" }, "."], ["Un frère et une sœur ", { target: "blonds" }, "."]] }
            tr: { en: { examples: ["Léa and Paul are French.", "A blond brother and sister."] }, uk: { examples: ["Леа й Пол французи.", "Брат і сестра блондини."] }, es: { examples: ["Léa y Paul son franceses.", "Un hermano y una hermana rubios."] }, pt: { examples: ["Léa e Paul são franceses.", "Um irmão e uma irmã loiros."] }, de: { examples: ["Léa und Paul sind Franzosen.", "Ein Bruder und eine Schwester, beide blond."] }, it: { examples: ["Léa e Paul sono francesi.", "Un fratello e una sorella biondi."] }, pl: { examples: ["Léa i Paul są Francuzami.", "Brat i siostra, oboje blondyni."] }, tr: { examples: ["Léa ile Paul Fransız.", "Sarışın bir erkek ve kız kardeş."] }, id: { examples: ["Léa dan Paul orang Prancis.", "Kakak beradik berambut pirang."] }, vi: { examples: ["Léa và Paul là người Pháp.", "Anh em trai gái đều tóc vàng."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour le genre des noms, voir ", { link: "Le genre des noms", to: fr.nom-determinants.genre }, "."]
              en: ["For the gender of nouns, see ", { link: "Noun Gender", to: fr.nom-determinants.genre }, "."]
              uk: ["Про рід іменників — див. ", { link: "Рід іменників", to: fr.nom-determinants.genre }, "."]
              es: ["Para el género de los nombres, ver ", { link: "El género de los sustantivos", to: fr.nom-determinants.genre }, "."]
              pt: ["Para o gênero dos substantivos, veja ", { link: "O gênero dos substantivos", to: fr.nom-determinants.genre }, "."]
              de: ["Zum Genus der Nomen siehe ", { link: "Das Genus der Nomen", to: fr.nom-determinants.genre }, "."]
              it: ["Per il genere dei nomi, vedi ", { link: "Il genere dei nomi", to: fr.nom-determinants.genre }, "."]
              pl: ["O rodzaju rzeczowników — zob. ", { link: "Rodzaj rzeczowników", to: fr.nom-determinants.genre }, "."]
              tr: ["İsimlerin cinsi için bkz. ", { link: "İsimlerin cinsiyeti", to: fr.nom-determinants.genre }, "."]
              id: ["Untuk gender kata benda, lihat ", { link: "Gender kata benda", to: fr.nom-determinants.genre }, "."]
              vi: ["Về giống của danh từ, xem ", { link: "Giống của danh từ", to: fr.nom-determinants.genre }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour le pluriel des noms, voir ", { link: "Le pluriel des noms", to: fr.nom-determinants.pluriel }, "."]
              en: ["For the plural of nouns, see ", { link: "Plurals", to: fr.nom-determinants.pluriel }, "."]
              uk: ["Про множину іменників — див. ", { link: "Множина іменників", to: fr.nom-determinants.pluriel }, "."]
              es: ["Para el plural de los nombres, ver ", { link: "El plural de los sustantivos", to: fr.nom-determinants.pluriel }, "."]
              pt: ["Para o plural dos substantivos, veja ", { link: "O plural dos substantivos", to: fr.nom-determinants.pluriel }, "."]
              de: ["Zum Plural der Nomen siehe ", { link: "Der Plural der Nomen", to: fr.nom-determinants.pluriel }, "."]
              it: ["Per il plurale dei nomi, vedi ", { link: "Il plurale dei nomi", to: fr.nom-determinants.pluriel }, "."]
              pl: ["O liczbie mnogiej rzeczowników — zob. ", { link: "Liczba mnoga rzeczowników", to: fr.nom-determinants.pluriel }, "."]
              tr: ["İsimlerin çoğulu için bkz. ", { link: "İsimlerin çoğulu", to: fr.nom-determinants.pluriel }, "."]
              id: ["Untuk jamak kata benda, lihat ", { link: "Bentuk jamak kata benda", to: fr.nom-determinants.pluriel }, "."]
              vi: ["Về số nhiều của danh từ, xem ", { link: "Số nhiều của danh từ", to: fr.nom-determinants.pluriel }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "c’est" }, " et ", { term: "il est" }, " devant un adjectif, voir ", { link: "C’est et il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              en: ["For ", { term: "c’est" }, " and ", { term: "il est" }, " before an adjective, see ", { link: "C’est and Il est", to: fr.etre-avoir.c-est-il-est }, "."]
              uk: ["Про ", { term: "c’est" }, " і ", { term: "il est" }, " перед прикметником — див. ", { link: "C’est та il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              es: ["Para ", { term: "c’est" }, " e ", { term: "il est" }, " ante un adjetivo, ver ", { link: "C’est y il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              pt: ["Para ", { term: "c’est" }, " e ", { term: "il est" }, " diante de um adjetivo, veja ", { link: "C’est e il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              de: ["Zu ", { term: "c’est" }, " und ", { term: "il est" }, " vor einem Adjektiv siehe ", { link: "C’est und il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              it: ["Per ", { term: "c’est" }, " e ", { term: "il est" }, " davanti a un aggettivo, vedi ", { link: "C’est e il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              pl: ["O ", { term: "c’est" }, " i ", { term: "il est" }, " przed przymiotnikiem — zob. ", { link: "C’est i il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              tr: ["Sıfatın önündeki ", { term: "c’est" }, " ve ", { term: "il est" }, " için bkz. ", { link: "C’est ve il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              id: ["Untuk ", { term: "c’est" }, " dan ", { term: "il est" }, " di depan kata sifat, lihat ", { link: "C’est dan il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              vi: ["Về ", { term: "c’est" }, " và ", { term: "il est" }, " trước tính từ, xem ", { link: "C’est và il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: [{ term: "Très" }, ", ", { term: "trop" }, " et ", { term: "assez" }, " renforcent l’adjectif : voir ", { link: "Les adverbes", to: "fr.adjectif-adverbe.adverbes" }, "."]
              en: [{ term: "Très" }, ", ", { term: "trop" }, " and ", { term: "assez" }, " modify an adjective: see ", { link: "Adverbs", to: "fr.adjectif-adverbe.adverbes" }, "."]
              uk: [{ term: "Très" }, ", ", { term: "trop" }, " і ", { term: "assez" }, " підсилюють прикметник: див. ", { link: "Прислівники", to: "fr.adjectif-adverbe.adverbes" }, "."]
              es: [{ term: "Très" }, ", ", { term: "trop" }, " y ", { term: "assez" }, " modifican al adjetivo: ver ", { link: "Los adverbios", to: "fr.adjectif-adverbe.adverbes" }, "."]
              pt: [{ term: "Très" }, ", ", { term: "trop" }, " e ", { term: "assez" }, " modificam o adjetivo: veja ", { link: "Os advérbios", to: "fr.adjectif-adverbe.adverbes" }, "."]
              de: [{ term: "Très" }, ", ", { term: "trop" }, " und ", { term: "assez" }, " bestimmen das Adjektiv näher: siehe ", { link: "Die Adverbien", to: "fr.adjectif-adverbe.adverbes" }, "."]
              it: [{ term: "Très" }, ", ", { term: "trop" }, " e ", { term: "assez" }, " modificano l’aggettivo: vedi ", { link: "Gli avverbi", to: "fr.adjectif-adverbe.adverbes" }, "."]
              pl: [{ term: "Très" }, ", ", { term: "trop" }, " i ", { term: "assez" }, " wzmacniają przymiotnik — zob. ", { link: "Przysłówki", to: "fr.adjectif-adverbe.adverbes" }, "."]
              tr: [{ term: "Très" }, ", ", { term: "trop" }, " ve ", { term: "assez" }, " sıfatı pekiştirir: bkz. ", { link: "Zarflar", to: "fr.adjectif-adverbe.adverbes" }, "."]
              id: [{ term: "Très" }, ", ", { term: "trop" }, ", dan ", { term: "assez" }, " menguatkan kata sifat: lihat ", { link: "Adverbia", to: "fr.adjectif-adverbe.adverbes" }, "."]
