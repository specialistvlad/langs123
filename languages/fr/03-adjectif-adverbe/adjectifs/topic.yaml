summary:
  lead:
    fr: "L’adjectif s’accorde en genre et en nombre avec le nom et se place le plus souvent après lui ; quelques adjectifs courts se placent avant."
    en: "An adjective agrees with its noun in gender and number and usually follows it; a few short adjectives come before."
    uk: "Прикметник узгоджується з іменником у роді й числі та здебільшого стоїть після нього; кілька коротких прикметників стоять перед ним."
    es: "El adjetivo concuerda con el nombre en género y número y suele ir detrás; unos pocos adjetivos cortos van delante."
    pt: "O adjetivo concorda com o substantivo em gênero e número e costuma vir depois dele; alguns adjetivos curtos vêm antes."
    de: "Das Adjektiv richtet sich in Genus und Numerus nach dem Nomen und steht meist hinter ihm; einige kurze Adjektive stehen davor."
    it: "L’aggettivo concorda con il nome in genere e numero e di solito lo segue; pochi aggettivi brevi lo precedono."
    pl: "Przymiotnik zgadza się z rzeczownikiem w rodzaju i liczbie i zwykle stoi po nim; kilka krótkich przymiotników stoi przed nim."
    tr: "Sıfat, ismin cinsine ve sayısına uyar ve çoğunlukla isimden sonra gelir; birkaç kısa sıfat isimden önce gelir."
    id: "Kata sifat menyesuaikan gender dan jumlah kata bendanya dan biasanya mengikutinya; beberapa kata sifat pendek mendahuluinya."
    vi: "Tính từ hòa hợp với danh từ về giống và số, thường đứng sau danh từ; vài tính từ ngắn đứng trước."
  rule:
    fr: ["Le féminin ajoute le plus souvent ", { ending: "e" }, " et le pluriel ", { ending: "s" }, " :"]
    en: ["The feminine usually adds ", { ending: "e" }, " and the plural ", { ending: "s" }, ":"]
    uk: ["Жіночий рід здебільшого додає ", { ending: "e" }, ", а множина — ", { ending: "s" }, ":"]
    es: ["El femenino suele añadir ", { ending: "e" }, " y el plural ", { ending: "s" }, ":"]
    pt: ["O feminino geralmente acrescenta ", { ending: "e" }, " e o plural ", { ending: "s" }, ":"]
    de: ["Das Femininum hängt meist ", { ending: "e" }, " an und der Plural ", { ending: "s" }, ":"]
    it: ["Il femminile di solito aggiunge ", { ending: "e" }, " e il plurale ", { ending: "s" }, ":"]
    pl: ["Rodzaj żeński zwykle dodaje ", { ending: "e" }, ", a liczba mnoga ", { ending: "s" }, ":"]
    tr: ["Dişil çoğunlukla ", { ending: "e" }, ", çoğul ise ", { ending: "s" }, " ekler:"]
    id: ["Bentuk feminin biasanya menambah ", { ending: "e" }, " dan jamak menambah ", { ending: "s" }, ":"]
    vi: ["Giống cái thường thêm ", { ending: "e" }, " và số nhiều thêm ", { ending: "s" }, ":"]
  ex: { examples: [["un ami ", { target: "français" }], ["une amie ", { target: "française" }], ["des amies ", { target: "françaises" }]] }
