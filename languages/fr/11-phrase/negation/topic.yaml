sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: ["La négation a deux parties : ", { term: "ne" }, " devant le verbe et un mot négatif après lui."]
              en: ["Negation has two parts: ", { term: "ne" }, " before the verb and a negative word after it."]
              uk: ["Заперечення має дві частини: ", { term: "ne" }, " перед дієсловом і заперечне слово після нього."]
              es: ["La negación tiene dos partes: ", { term: "ne" }, " delante del verbo y una palabra negativa detrás."]
              pt: ["A negação tem duas partes: ", { term: "ne" }, " antes do verbo e uma palavra negativa depois dele."]
              de: ["Die Verneinung hat zwei Teile: ", { term: "ne" }, " vor dem Verb und ein Verneinungswort danach."]
              it: ["La negazione ha due parti: ", { term: "ne" }, " davanti al verbo e una parola negativa dopo."]
              pl: ["Przeczenie ma dwie części: ", { term: "ne" }, " przed czasownikiem i słowo przeczące po nim."]
              tr: ["Olumsuzluk iki parçalıdır: fiilin önünde ", { term: "ne" }, ", arkasında olumsuz bir sözcük."]
              id: ["Negasi terdiri dari dua bagian: ", { term: "ne" }, " di depan kata kerja dan kata negatif setelahnya."]
              vi: ["Phủ định gồm hai phần: ", { term: "ne" }, " trước động từ và một từ phủ định sau nó."]
            ex: { examples: [["Je ", { target: "ne" }, " parle ", { target: "pas" }, "."], ["Tu ", { target: "n’" }, "aimes ", { target: "pas" }, " ça."]] }
            tr: { en: { examples: ["I don't speak.", "You don't like that."] }, uk: { examples: ["Я не розмовляю.", "Тобі це не подобається."] }, es: { examples: ["No hablo.", "No te gusta eso."] }, pt: { examples: ["Eu não falo.", "Você não gosta disso."] }, de: { examples: ["Ich spreche nicht.", "Du magst das nicht."] }, it: { examples: ["Non parlo.", "Non ti piace."] }, pl: { examples: ["Nie mówię.", "Nie lubisz tego."] }, tr: { examples: ["Konuşmuyorum.", "Bunu sevmiyorsun."] }, id: { examples: ["Aku tidak berbicara.", "Kamu tidak suka itu."] }, vi: { examples: ["Tôi không nói.", "Bạn không thích cái đó."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Pas" }, " ne s’ajoute pas à ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " ou ", { term: "personne" }, "."]
              en: [{ term: "Pas" }, " is never added to ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " or ", { term: "personne" }, "."]
              uk: [{ term: "Pas" }, " не додається до ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " чи ", { term: "personne" }, "."]
              es: [{ term: "Pas" }, " no se añade a ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " ni ", { term: "personne" }, "."]
              pt: [{ term: "Pas" }, " não se acrescenta a ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " nem ", { term: "personne" }, "."]
              de: [{ term: "Pas" }, " tritt nicht zu ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " oder ", { term: "personne" }, " hinzu."]
              it: [{ term: "Pas" }, " non si aggiunge a ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " o ", { term: "personne" }, "."]
              pl: [{ term: "Pas" }, " nie dodaje się do ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " ani ", { term: "personne" }, "."]
              tr: [{ term: "pas" }, ", ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " ya da ", { term: "personne" }, " ile birlikte kullanılmaz."]
              id: [{ term: "Pas" }, " tidak ditambahkan pada ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, ", atau ", { term: "personne" }, "."]
              vi: [{ term: "Pas" }, " không được thêm vào ", { term: "jamais" }, ", ", { term: "plus" }, ", ", { term: "rien" }, " hay ", { term: "personne" }, "."]
            ex: { examples: [["Je ne mange ", { target: "jamais" }, " de viande."], ["Il ne dit ", { target: "rien" }, "."]] }
            tr: { en: { examples: ["I never eat meat.", "He says nothing."] }, uk: { examples: ["Я ніколи не їм м’яса.", "Він нічого не каже."] }, es: { examples: ["Nunca como carne.", "No dice nada."] }, pt: { examples: ["Eu nunca como carne.", "Ele não diz nada."] }, de: { examples: ["Ich esse nie Fleisch.", "Er sagt nichts."] }, it: { examples: ["Non mangio mai carne.", "Non dice niente."] }, pl: { examples: ["Nigdy nie jem mięsa.", "On nic nie mówi."] }, tr: { examples: ["Hiç et yemem.", "O hiçbir şey söylemez."] }, id: { examples: ["Aku tidak pernah makan daging.", "Dia tidak mengatakan apa-apa."] }, vi: { examples: ["Tôi không bao giờ ăn thịt.", "Anh ấy không nói gì."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour répondre à une phrase négative par « moi non plus », voir ", { link: "Les pronoms toniques", to: "fr.pronoms.pronoms-toniques" }, "."]
              en: ["To reply to a negative sentence with “me neither” (moi non plus), see ", { link: "Stressed Pronouns", to: fr.pronoms.pronoms-toniques }, "."]
              uk: ["Про відповідь на заперечне речення «я теж ні» (moi non plus) — див. ", { link: "Наголошені займенники", to: "fr.pronoms.pronoms-toniques" }, "."]
              es: ["Para responder a una frase negativa con «yo tampoco» (moi non plus), ver ", { link: "Los pronombres tónicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              pt: ["Para responder a uma frase negativa com «eu também não» (moi non plus), veja ", { link: "Os pronomes tônicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              de: ["Zur Antwort auf einen verneinten Satz mit „ich auch nicht“ (moi non plus) siehe ", { link: "Die betonten Pronomen", to: "fr.pronoms.pronoms-toniques" }, "."]
              it: ["Per rispondere a una frase negativa con «neanch'io» (moi non plus), vedi ", { link: "I pronomi tonici", to: "fr.pronoms.pronoms-toniques" }, "."]
              pl: ["O odpowiedzi na zdanie przeczące „ja też nie” (moi non plus) — zob. ", { link: "Zaimki akcentowane", to: "fr.pronoms.pronoms-toniques" }, "."]
              tr: ["Olumsuz bir cümleye “ben de değil” (moi non plus) diye karşılık vermek için bkz. ", { link: "Vurgulu zamirler", to: "fr.pronoms.pronoms-toniques" }, "."]
              id: ["Untuk menjawab kalimat negatif dengan “saya juga tidak” (moi non plus), lihat ", { link: "Pronomina tonik", to: "fr.pronoms.pronoms-toniques" }, "."]
              vi: ["Về cách đáp lại câu phủ định bằng “tôi cũng không” (moi non plus), xem ", { link: "Đại từ nhấn mạnh", to: "fr.pronoms.pronoms-toniques" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour les questions, voir ", { link: "Les questions", to: "fr.phrase.questions" }, "."]
              en: ["For questions, see ", { link: "Questions", to: "fr.phrase.questions" }, "."]
              uk: ["Про питання — див. ", { link: "Питання", to: "fr.phrase.questions" }, "."]
              es: ["Para las preguntas, ver ", { link: "Las preguntas", to: "fr.phrase.questions" }, "."]
              pt: ["Para as perguntas, veja ", { link: "As perguntas", to: "fr.phrase.questions" }, "."]
              de: ["Zu den Fragen siehe ", { link: "Fragen", to: "fr.phrase.questions" }, "."]
              it: ["Per le domande, vedi ", { link: "Le domande", to: "fr.phrase.questions" }, "."]
              pl: ["O pytaniach — zob. ", { link: "Pytania", to: "fr.phrase.questions" }, "."]
              tr: ["Sorular için bkz. ", { link: "Soru cümleleri", to: "fr.phrase.questions" }, "."]
              id: ["Untuk pertanyaan, lihat ", { link: "Kalimat tanya", to: "fr.phrase.questions" }, "."]
              vi: ["Về câu hỏi, xem ", { link: "Câu hỏi", to: "fr.phrase.questions" }, "."]
  - title:
      fr: "Forme : ne … pas"
      en: "Form: ne … pas"
      uk: "Форма: ne … pas"
      es: "Forma: ne … pas"
      pt: "Forma: ne … pas"
      de: "Form: ne … pas"
      it: "Forma: ne … pas"
      pl: "Forma: ne … pas"
      tr: "Biçim: ne … pas"
      id: "Bentuk: ne … pas"
      vi: "Dạng: ne … pas"
    role: "form"
    content:
      - type: "usage"
        columns:
          - { key: "form", label: { fr: "Forme", en: "Form", uk: "Форма", es: "Forma", pt: "Forma", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: "ex", label: { fr: "Exemple", en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            form: { pattern: [{ slot: "subject" }, { term: "ne" }, { slot: "verb" }, { term: "pas" }] }
            ex: { examples: [["Je ", { target: "ne parle pas" }, " anglais."], ["Ils ", { target: "ne travaillent pas" }, "."]] }
            tr: { en: { examples: ["I don't speak English.", "They aren't working."] }, uk: { examples: ["Я не розмовляю англійською.", "Вони не працюють."] }, es: { examples: ["No hablo inglés.", "No trabajan."] }, pt: { examples: ["Eu não falo inglês.", "Eles não trabalham."] }, de: { examples: ["Ich spreche kein Englisch.", "Sie arbeiten nicht."] }, it: { examples: ["Non parlo inglese.", "Non lavorano."] }, pl: { examples: ["Nie mówię po angielsku.", "Oni nie pracują."] }, tr: { examples: ["İngilizce konuşmuyorum.", "Çalışmıyorlar."] }, id: { examples: ["Aku tidak berbicara bahasa Inggris.", "Mereka tidak bekerja."] }, vi: { examples: ["Tôi không nói tiếng Anh.", "Họ không làm việc."] } }
          - level: "A1"
            form: { pattern: [{ slot: "subject" }, { term: "n’" }, { slot: "verb" }, { term: "pas" }] }
            ex: { examples: [["Elle ", { target: "n’aime pas" }, " le café."], ["Nous ", { target: "n’habitons pas" }, " ici."]] }
            tr: { en: { examples: ["She doesn't like coffee.", "We don't live here."] }, uk: { examples: ["Вона не любить каву.", "Ми тут не живемо."] }, es: { examples: ["No le gusta el café.", "No vivimos aquí."] }, pt: { examples: ["Ela não gosta de café.", "Nós não moramos aqui."] }, de: { examples: ["Sie mag keinen Kaffee.", "Wir wohnen nicht hier."] }, it: { examples: ["Non le piace il caffè.", "Non abitiamo qui."] }, pl: { examples: ["Ona nie lubi kawy.", "Nie mieszkamy tutaj."] }, tr: { examples: ["Kahveyi sevmez.", "Burada oturmuyoruz."] }, id: { examples: ["Dia tidak suka kopi.", "Kami tidak tinggal di sini."] }, vi: { examples: ["Cô ấy không thích cà phê.", "Chúng tôi không sống ở đây."] } }
          - level: "A1"
            form: { pattern: [{ slot: "subject" }, { term: "ne" }, { slot: "verb" }, { term: "pas" }, { slot: "infinitive" }] }
            ex: { examples: [["Je ", { target: "ne veux pas" }, " partir."], ["Il ", { target: "ne peut pas" }, " venir."]] }
            tr: { en: { examples: ["I don't want to leave.", "He can't come."] }, uk: { examples: ["Я не хочу йти.", "Він не може прийти."] }, es: { examples: ["No quiero irme.", "No puede venir."] }, pt: { examples: ["Eu não quero ir embora.", "Ele não pode vir."] }, de: { examples: ["Ich will nicht gehen.", "Er kann nicht kommen."] }, it: { examples: ["Non voglio partire.", "Non può venire."] }, pl: { examples: ["Nie chcę wyjść.", "On nie może przyjść."] }, tr: { examples: ["Gitmek istemiyorum.", "O gelemez."] }, id: { examples: ["Aku tidak mau pergi.", "Dia tidak bisa datang."] }, vi: { examples: ["Tôi không muốn đi.", "Anh ấy không thể đến."] } }
          - level: "A1"
            form: { pattern: [{ slot: "subject" }, { term: "ne" }, { slot: "helper" }, { term: "pas" }, { slot: "past participle" }] }
            ex: { examples: [["Je ", { target: "n’ai pas" }, " mangé."], ["Elle ", { target: "n’est pas" }, " venue."]] }
            tr: { en: { examples: ["I haven't eaten.", "She hasn't come."] }, uk: { examples: ["Я не їв.", "Вона не прийшла."] }, es: { examples: ["No he comido.", "No ha venido."] }, pt: { examples: ["Eu não comi.", "Ela não veio."] }, de: { examples: ["Ich habe nicht gegessen.", "Sie ist nicht gekommen."] }, it: { examples: ["Non ho mangiato.", "Non è venuta."] }, pl: { examples: ["Nie jadłem.", "Ona nie przyszła."] }, tr: { examples: ["Yemek yemedim.", "O gelmedi."] }, id: { examples: ["Aku belum makan.", "Dia belum datang."] }, vi: { examples: ["Tôi chưa ăn.", "Cô ấy chưa đến."] } }
          - level: "A2"
            form: { pattern: [{ term: "ne pas" }, { slot: "infinitive" }] }
            ex: { examples: [["Je préfère ", { target: "ne pas" }, " sortir."], ["Il décide de ", { target: "ne pas" }, " partir."]] }
            tr: { en: { examples: ["I prefer not to go out.", "He decides not to leave."] }, uk: { examples: ["Я волію не виходити.", "Він вирішує не їхати."] }, es: { examples: ["Prefiero no salir.", "Decide no irse."] }, pt: { examples: ["Prefiro não sair.", "Ele decide não ir embora."] }, de: { examples: ["Ich gehe lieber nicht aus.", "Er beschließt, nicht zu gehen."] }, it: { examples: ["Preferisco non uscire.", "Decide di non partire."] }, pl: { examples: ["Wolę nie wychodzić.", "Postanawia nie wyjeżdżać."] }, tr: { examples: ["Dışarı çıkmamayı tercih ederim.", "Gitmemeye karar verir."] }, id: { examples: ["Aku lebih suka tidak keluar.", "Dia memutuskan untuk tidak pergi."] }, vi: { examples: ["Tôi thích không ra ngoài hơn.", "Anh ấy quyết định không đi."] } }
      - type: "list"
        items:
          - type: "note"
            level: "A2"
            text:
              fr: ["Un pronom complément se place entre ", { term: "ne" }, " et le verbe : voir ", { link: "Les pronoms compléments", to: "fr.pronoms.pronoms-complements" }, "."]
              en: ["An object pronoun goes between ", { term: "ne" }, " and the verb: see ", { link: "Object Pronouns", to: fr.pronoms.pronoms-complements }, "."]
              uk: ["Займенник-додаток стоїть між ", { term: "ne" }, " і дієсловом: див. ", { link: "Займенники-додатки", to: "fr.pronoms.pronoms-complements" }, "."]
              es: ["Un pronombre complemento va entre ", { term: "ne" }, " y el verbo: ver ", { link: "Los pronombres complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pt: ["Um pronome complemento fica entre ", { term: "ne" }, " e o verbo: veja ", { link: "Os pronomes complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              de: ["Ein Objektpronomen steht zwischen ", { term: "ne" }, " und dem Verb: siehe ", { link: "Die Objektpronomen", to: "fr.pronoms.pronoms-complements" }, "."]
              it: ["Un pronome complemento sta tra ", { term: "ne" }, " e il verbo: vedi ", { link: "I pronomi complemento", to: "fr.pronoms.pronoms-complements" }, "."]
