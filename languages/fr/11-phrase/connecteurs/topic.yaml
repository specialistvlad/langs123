            id: [{ term: "si" }, " + present, lalu futur atau imperatif"]
            vi: [{ term: "si" }, " + hiện tại, sau đó là tương lai hoặc mệnh lệnh"]
          ex: ["Si tu ", { target: "viens" }, " demain, je serai content."]
          tr: { en: "If you come tomorrow, I'll be happy.", uk: "Якщо ти прийдеш завтра, я буду радий.", es: "Si vienes mañana, estaré contento.", pt: "Se você vier amanhã, ficarei contente.", de: "Wenn du morgen kommst, freue ich mich.", it: "Se vieni domani, sarò contento.", pl: "Jeśli przyjdziesz jutro, będę zadowolony.", tr: "Yarın gelirsen sevinirim.", id: "Kalau kamu datang besok, aku akan senang.", vi: "Nếu ngày mai bạn đến, tôi sẽ vui." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: [{ term: "si" }, " devient ", { term: "s’" }, " devant ", { term: "il" }, " et ", { term: "ils" }, " seulement"]
            en: [{ term: "si" }, " becomes ", { term: "s’" }, " before ", { term: "il" }, " and ", { term: "ils" }, " only"]
            uk: [{ term: "si" }, " стає ", { term: "s’" }, " лише перед ", { term: "il" }, " та ", { term: "ils" }]
            es: [{ term: "si" }, " pasa a ", { term: "s’" }, " solo ante ", { term: "il" }, " e ", { term: "ils" }]
            pt: [{ term: "si" }, " vira ", { term: "s’" }, " só antes de ", { term: "il" }, " e ", { term: "ils" }]
            de: [{ term: "si" }, " wird nur vor ", { term: "il" }, " und ", { term: "ils" }, " zu ", { term: "s’" }]
            it: [{ term: "si" }, " diventa ", { term: "s’" }, " solo davanti a ", { term: "il" }, " e ", { term: "ils" }]
            pl: [{ term: "si" }, " zmienia się w ", { term: "s’" }, " tylko przed ", { term: "il" }, " i ", { term: "ils" }]
            tr: [{ term: "si" }, " yalnızca ", { term: "il" }, " ve ", { term: "ils" }, " önünde ", { term: "s’" }, " olur"]
            id: [{ term: "si" }, " menjadi ", { term: "s’" }, " hanya sebelum ", { term: "il" }, " dan ", { term: "ils" }]
            vi: [{ term: "si" }, " chỉ thành ", { term: "s’" }, " trước ", { term: "il" }, " và ", { term: "ils" }]
          ex: [{ target: "S’" }, "il pleut, je reste ici."]
          tr: { en: "If it rains, I'm staying here.", uk: "Якщо піде дощ, я лишуся тут.", es: "Si llueve, me quedo aquí.", pt: "Se chover, eu fico aqui.", de: "Wenn es regnet, bleibe ich hier.", it: "Se piove, resto qui.", pl: "Jeśli będzie padać, zostanę tutaj.", tr: "Yağmur yağarsa burada kalırım.", id: "Kalau hujan, aku tinggal di sini.", vi: "Nếu trời mưa, tôi ở lại đây." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Un connecteur relie deux mots ou deux phrases."
              en: "A linking word joins two words or two sentences."
              uk: "Сполучне слово з’єднує два слова або два речення."
              es: "Un conector une dos palabras o dos oraciones."
              pt: "Um conectivo liga duas palavras ou duas frases."
              de: "Ein Bindewort verbindet zwei Wörter oder zwei Sätze."
              it: "Un connettivo unisce due parole o due frasi."
              pl: "Słowo łączące spaja dwa wyrazy lub dwa zdania."
              tr: "Bir bağlaç iki sözcüğü ya da iki cümleyi birleştirir."
              id: "Kata penghubung menyambung dua kata atau dua kalimat."
              vi: "Từ nối liên kết hai từ hoặc hai câu."
            ex: { examples: [["Léa ", { target: "et" }, " Paul sont amis."], ["J’ai faim, ", { target: "mais" }, " il n’y a plus de pain."]] }
            tr: { en: { examples: ["Léa and Paul are friends.", "I'm hungry, but there is no more bread."] }, uk: { examples: ["Леа і Поль — друзі.", "Я голодний, але хліба більше немає."] }, es: { examples: ["Léa y Paul son amigos.", "Tengo hambre, pero ya no hay pan."] }, pt: { examples: ["A Léa e o Paul são amigos.", "Estou com fome, mas não tem mais pão."] }, de: { examples: ["Léa und Paul sind Freunde.", "Ich habe Hunger, aber es gibt kein Brot mehr."] }, it: { examples: ["Léa e Paul sono amici.", "Ho fame, ma non c'è più pane."] }, pl: { examples: ["Léa i Paul są przyjaciółmi.", "Jestem głodny, ale nie ma już chleba."] }, tr: { examples: ["Léa ile Paul arkadaştır.", "Açım ama ekmek kalmadı."] }, id: { examples: ["Léa dan Paul berteman.", "Aku lapar, tetapi rotinya sudah habis."] }, vi: { examples: ["Léa và Paul là bạn.", "Tôi đói, nhưng hết bánh mì rồi."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "pourquoi" }, " et sa réponse ", { term: "parce que" }, " dans une question, voir ", { link: "Les questions", to: "fr.phrase.questions" }, "."]
              en: ["For ", { term: "pourquoi" }, " and its answer ", { term: "parce que" }, " in a question, see ", { link: "Questions", to: "fr.phrase.questions" }, "."]
              uk: ["Про ", { term: "pourquoi" }, " і відповідь ", { term: "parce que" }, " у питанні — див. ", { link: "Питання", to: "fr.phrase.questions" }, "."]
              es: ["Para ", { term: "pourquoi" }, " y su respuesta ", { term: "parce que" }, " en una pregunta, ver ", { link: "Las preguntas", to: "fr.phrase.questions" }, "."]
              pt: ["Para ", { term: "pourquoi" }, " e a resposta ", { term: "parce que" }, " em uma pergunta, veja ", { link: "As perguntas", to: "fr.phrase.questions" }, "."]
              de: ["Zu ", { term: "pourquoi" }, " und der Antwort ", { term: "parce que" }, " in einer Frage siehe ", { link: "Fragen", to: "fr.phrase.questions" }, "."]
              it: ["Per ", { term: "pourquoi" }, " e la risposta ", { term: "parce que" }, " in una domanda, vedi ", { link: "Le domande", to: "fr.phrase.questions" }, "."]
              pl: ["O ", { term: "pourquoi" }, " i odpowiedzi ", { term: "parce que" }, " w pytaniu — zob. ", { link: "Pytania", to: "fr.phrase.questions" }, "."]
              tr: ["Soruda ", { term: "pourquoi" }, " ve cevabı ", { term: "parce que" }, " için bkz. ", { link: "Soru cümleleri", to: "fr.phrase.questions" }, "."]
              id: ["Untuk ", { term: "pourquoi" }, " dan jawabannya ", { term: "parce que" }, " dalam pertanyaan, lihat ", { link: "Kalimat tanya", to: "fr.phrase.questions" }, "."]
              vi: ["Về ", { term: "pourquoi" }, " và câu trả lời ", { term: "parce que" }, " trong câu hỏi, xem ", { link: "Câu hỏi", to: "fr.phrase.questions" }, "."]
  - title:
      fr: "Ajouter, choisir, opposer : et, ou, mais"
      en: "Adding, choosing, contrasting: et, ou, mais"
      uk: "Додавання, вибір, протиставлення: et, ou, mais"
      es: "Sumar, elegir, oponer: et, ou, mais"
      pt: "Somar, escolher, opor: et, ou, mais"
      de: "Hinzufügen, wählen, entgegensetzen: et, ou, mais"
      it: "Aggiungere, scegliere, opporre: et, ou, mais"
      pl: "Dodawanie, wybór, przeciwstawienie: et, ou, mais"
      tr: "Eklemek, seçenek sunmak, karşıtlık kurmak: et, ou, mais"
      id: "Menambah, memilih, mempertentangkan: et, ou, mais"
      vi: "Thêm vào, lựa chọn, đối lập: et, ou, mais"
    role: "own"
    content:
      - type: "usage"
        columns:
          - key: "word"
            label: { fr: "Connecteur", en: "Linker", uk: "Сполучне слово", es: "Conector", pt: "Conectivo", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlaç", id: "Penghubung", vi: "Từ nối" }
          - { key: "role", label: { fr: "Sens", en: "Meaning", uk: "Значення", es: "Significado", pt: "Significado", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Ý nghĩa" } }
          - { key: "ex", label: { fr: "Exemple", en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            word: { target: "et" }
            role: { fr: "ajoute", en: "adds", uk: "додає", es: "suma", pt: "soma", de: "fügt hinzu", it: "aggiunge", pl: "dodaje", tr: "ekler", id: "menambah", vi: "thêm vào" }
            ex: { examples: [["Paul ", { target: "et" }, " Léa sont amis."], ["J’ai un frère ", { target: "et" }, " une sœur."]] }
            tr: { en: { examples: ["Paul and Léa are friends.", "I have a brother and a sister."] }, uk: { examples: ["Поль і Леа — друзі.", "У мене є брат і сестра."] }, es: { examples: ["Paul y Léa son amigos.", "Tengo un hermano y una hermana."] }, pt: { examples: ["O Paul e a Léa são amigos.", "Eu tenho um irmão e uma irmã."] }, de: { examples: ["Paul und Léa sind Freunde.", "Ich habe einen Bruder und eine Schwester."] }, it: { examples: ["Paul e Léa sono amici.", "Ho un fratello e una sorella."] }, pl: { examples: ["Paul i Léa są przyjaciółmi.", "Mam brata i siostrę."] }, tr: { examples: ["Paul ile Léa arkadaştır.", "Bir erkek bir kız kardeşim var."] }, id: { examples: ["Paul dan Léa berteman.", "Aku punya satu saudara laki-laki dan satu saudara perempuan."] }, vi: { examples: ["Paul và Léa là bạn.", "Tôi có một anh trai và một chị gái."] } }
          - level: "A1"
            word: { target: "ou" }
            role:
              fr: "propose un choix"
              en: "gives a choice"
              uk: "пропонує вибір"
              es: "ofrece una elección"
              pt: "oferece uma escolha"
              de: "bietet eine Wahl"
              it: "offre una scelta"
              pl: "daje wybór"
              tr: "seçenek sunar"
              id: "menawarkan pilihan"
              vi: "đưa ra lựa chọn"
            ex: { examples: [["Tu veux du thé ", { target: "ou" }, " du café ?"], ["On part lundi ", { target: "ou" }, " mardi ?"]] }
            tr: { en: { examples: ["Do you want tea or coffee?", "Are we leaving on Monday or Tuesday?"] }, uk: { examples: ["Ти хочеш чаю чи кави?", "Ми їдемо в понеділок чи у вівторок?"] }, es: { examples: ["¿Quieres té o café?", "¿Salimos el lunes o el martes?"] }, pt: { examples: ["Você quer chá ou café?", "A gente sai na segunda ou na terça?"] }, de: { examples: ["Möchtest du Tee oder Kaffee?", "Fahren wir Montag oder Dienstag?"] }, it: { examples: ["Vuoi tè o caffè?", "Partiamo lunedì o martedì?"] }, pl: { examples: ["Chcesz herbatę czy kawę?", "Wyjeżdżamy w poniedziałek czy we wtorek?"] }, tr: { examples: ["Çay mı kahve mi istersin?", "Pazartesi mi salı mı gidiyoruz?"] }, id: { examples: ["Kamu mau teh atau kopi?", "Kita berangkat hari Senin atau Selasa?"] }, vi: { examples: ["Bạn muốn trà hay cà phê?", "Chúng ta đi thứ Hai hay thứ Ba?"] } }
          - level: "A1"
            word: { target: "mais" }
            role:
              fr: "oppose deux idées"
              en: "contrasts two ideas"
              uk: "протиставляє дві думки"
              es: "opone dos ideas"
              pt: "opõe duas ideias"
              de: "setzt zwei Gedanken entgegen"
              it: "contrappone due idee"
              pl: "przeciwstawia dwie myśli"
              tr: "iki düşünceyi karşılaştırır"
              id: "mempertentangkan dua gagasan"
              vi: "đối lập hai ý"
            ex: { examples: [["Je suis fatigué, ", { target: "mais" }, " content."], ["J’aime le thé, ", { target: "mais" }, " je préfère le café."]] }
            tr: { en: { examples: ["I'm tired, but happy.", "I like tea, but I prefer coffee."] }, uk: { examples: ["Я втомлений, але задоволений.", "Я люблю чай, але віддаю перевагу каві."] }, es: { examples: ["Estoy cansado, pero contento.", "Me gusta el té, pero prefiero el café."] }, pt: { examples: ["Estou cansado, mas contente.", "Eu gosto de chá, mas prefiro café."] }, de: { examples: ["Ich bin müde, aber zufrieden.", "Ich mag Tee, aber ich mag Kaffee lieber."] }, it: { examples: ["Sono stanco, ma contento.", "Mi piace il tè, ma preferisco il caffè."] }, pl: { examples: ["Jestem zmęczony, ale zadowolony.", "Lubię herbatę, ale wolę kawę."] }, tr: { examples: ["Yorgunum ama mutluyum.", "Çayı severim ama kahveyi tercih ederim."] }, id: { examples: ["Aku lelah, tetapi senang.", "Aku suka teh, tetapi aku lebih suka kopi."] }, vi: { examples: ["Tôi mệt nhưng vui.", "Tôi thích trà, nhưng tôi thích cà phê hơn."] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Après ", { term: "et" }, ", ", { term: "ou" }, " et ", { term: "mais" }, ", on répète l’article et la préposition."]
              en: ["After ", { term: "et" }, ", ", { term: "ou" }, " and ", { term: "mais" }, ", the article and the preposition are repeated."]
              uk: ["Після ", { term: "et" }, ", ", { term: "ou" }, " і ", { term: "mais" }, " артикль і прийменник повторюють."]
              es: ["Tras ", { term: "et" }, ", ", { term: "ou" }, " y ", { term: "mais" }, ", se repiten el artículo y la preposición."]
              pt: ["Depois de ", { term: "et" }, ", ", { term: "ou" }, " e ", { term: "mais" }, ", repetem-se o artigo e a preposição."]
              de: ["Nach ", { term: "et" }, ", ", { term: "ou" }, " und ", { term: "mais" }, " werden Artikel und Präposition wiederholt."]
              it: ["Dopo ", { term: "et" }, ", ", { term: "ou" }, " e ", { term: "mais" }, ", si ripetono l'articolo e la preposizione."]
              pl: ["Po ", { term: "et" }, ", ", { term: "ou" }, " i ", { term: "mais" }, " powtarza się przedimek i przyimek."]
              tr: [{ term: "et" }, ", ", { term: "ou" }, " ve ", { term: "mais" }, " sonrasında artikel ve edat tekrarlanır."]
              id: ["Setelah ", { term: "et" }, ", ", { term: "ou" }, ", dan ", { term: "mais" }, ", artikel dan preposisi diulang."]
              vi: ["Sau ", { term: "et" }, ", ", { term: "ou" }, " và ", { term: "mais" }, ", mạo từ và giới từ được lặp lại."]
            ex: { examples: [["Elle a un chat ", { target: "et" }, " ", { target: "un" }, " chien."], ["Je parle ", { target: "à" }, " Paul ", { target: "et" }, " ", { target: "à" }, " Léa."]] }
            tr: { en: { examples: ["She has a cat and a dog.", "I talk to Paul and Léa."] }, uk: { examples: ["У неї є кіт і собака.", "Я розмовляю з Полем і Леа."] }, es: { examples: ["Tiene un gato y un perro.", "Hablo con Paul y con Léa."] }, pt: { examples: ["Ela tem um gato e um cachorro.", "Eu falo com o Paul e com a Léa."] }, de: { examples: ["Sie hat eine Katze und einen Hund.", "Ich spreche mit Paul und mit Léa."] }, it: { examples: ["Ha un gatto e un cane.", "Parlo a Paul e a Léa."] }, pl: { examples: ["Ona ma kota i psa.", "Rozmawiam z Paulem i z Léą."] }, tr: { examples: ["Bir kedisi ve bir köpeği var.", "Paul’le ve Léa’yla konuşuyorum."] }, id: { examples: ["Dia punya seekor kucing dan seekor anjing.", "Aku berbicara dengan Paul dan dengan Léa."] }, vi: { examples: ["Cô ấy có một con mèo và một con chó.", "Tôi nói chuyện với Paul và với Léa."] } }
  - title:
      fr: "La cause et la conséquence : parce que, car, donc, alors"
      en: "Cause and result: parce que, car, donc, alors"
      uk: "Причина й наслідок: parce que, car, donc, alors"
      es: "La causa y la consecuencia: parce que, car, donc, alors"
      pt: "A causa e a consequência: parce que, car, donc, alors"
      de: "Grund und Folge: parce que, car, donc, alors"
      it: "La causa e la conseguenza: parce que, car, donc, alors"
      pl: "Przyczyna i skutek: parce que, car, donc, alors"
      tr: "Neden ve sonuç: parce que, car, donc, alors"
      id: "Sebab dan akibat: parce que, car, donc, alors"
      vi: "Nguyên nhân và kết quả: parce que, car, donc, alors"
    role: "own"
    content:
      - type: "usage"
        columns:
          - key: "word"
            label: { fr: "Connecteur", en: "Linker", uk: "Сполучне слово", es: "Conector", pt: "Conectivo", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlaç", id: "Penghubung", vi: "Từ nối" }
          - { key: "role", label: { fr: "Sens", en: "Meaning", uk: "Значення", es: "Significado", pt: "Significado", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Ý nghĩa" } }
          - { key: "ex", label: { fr: "Exemple", en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            word: { target: "parce que" }
            role:
              fr: "donne la cause"
              en: "gives the cause"
              uk: "вказує причину"
              es: "da la causa"
              pt: "dá a causa"
              de: "nennt den Grund"
              it: "dà la causa"
              pl: "podaje przyczynę"
              tr: "nedeni verir"
              id: "memberi sebab"
              vi: "nêu nguyên nhân"
            ex: { examples: [["Je dors ", { target: "parce que" }, " je suis fatigué."], ["Je reste ici ", { target: "parce qu’" }, "il pleut."]] }
            tr: { en: { examples: ["I'm sleeping because I'm tired.", "I'm staying here because it's raining."] }, uk: { examples: ["Я сплю, бо я втомлений.", "Я лишаюся тут, бо йде дощ."] }, es: { examples: ["Duermo porque estoy cansado.", "Me quedo aquí porque llueve."] }, pt: { examples: ["Eu durmo porque estou cansado.", "Eu fico aqui porque está chovendo."] }, de: { examples: ["Ich schlafe, weil ich müde bin.", "Ich bleibe hier, weil es regnet."] }, it: { examples: ["Dormo perché sono stanco.", "Resto qui perché piove."] }, pl: { examples: ["Śpię, bo jestem zmęczony.", "Zostaję tutaj, bo pada deszcz."] }, tr: { examples: ["Yorgun olduğum için uyuyorum.", "Yağmur yağdığı için burada kalıyorum."] }, id: { examples: ["Aku tidur karena aku lelah.", "Aku tinggal di sini karena hujan."] }, vi: { examples: ["Tôi ngủ vì tôi mệt.", "Tôi ở lại đây vì trời mưa."] } }
          - level: "A1"
            word: { target: "donc" }
            role:
              fr: "donne la conséquence"
              en: "gives the result"
              uk: "вказує наслідок"
              es: "da la consecuencia"
              pt: "dá a consequência"
              de: "nennt die Folge"
              it: "dà la conseguenza"
              pl: "podaje skutek"
              tr: "sonucu verir"
              id: "memberi akibat"
              vi: "nêu kết quả"
            ex: { examples: [["Il pleut, ", { target: "donc" }, " je reste ici."], ["Tu as faim, ", { target: "donc" }, " tu manges."]] }
            tr: { en: { examples: ["It's raining, so I'm staying here.", "You're hungry, so you eat."] }, uk: { examples: ["Йде дощ, тому я лишаюся тут.", "Ти голодний, тому ти їси."] }, es: { examples: ["Llueve, así que me quedo aquí.", "Tienes hambre, así que comes."] }, pt: { examples: ["Está chovendo, então eu fico aqui.", "Você está com fome, então você come."] }, de: { examples: ["Es regnet, also bleibe ich hier.", "Du hast Hunger, also isst du."] }, it: { examples: ["Piove, quindi resto qui.", "Hai fame, quindi mangi."] }, pl: { examples: ["Pada deszcz, więc zostaję tutaj.", "Jesteś głodny, więc jesz."] }, tr: { examples: ["Yağmur yağıyor, bu yüzden burada kalıyorum.", "Açsın, bu yüzden yiyorsun."] }, id: { examples: ["Hujan, jadi aku tinggal di sini.", "Kamu lapar, jadi kamu makan."] }, vi: { examples: ["Trời mưa, nên tôi ở lại đây.", "Bạn đói, nên bạn ăn."] } }
          - level: "A1"
            word: { target: "alors" }
            role:
              fr: "donne la conséquence, à l’oral"
              en: "gives the result, in speech"
              uk: "вказує наслідок у мовленні"
              es: "da la consecuencia, al hablar"
              pt: "dá a consequência, na fala"
              de: "nennt die Folge, mündlich"
              it: "dà la conseguenza, nel parlato"
              pl: "podaje skutek w mowie"
              tr: "konuşmada sonucu verir"
