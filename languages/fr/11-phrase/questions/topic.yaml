              en: ["Before a vowel, ", { term: "est-ce que" }, " becomes ", { term: "est-ce qu’" }, "."]
              uk: ["Перед голосною ", { term: "est-ce que" }, " стає ", { term: "est-ce qu’" }, "."]
              es: ["Ante vocal, ", { term: "est-ce que" }, " pasa a ", { term: "est-ce qu’" }, "."]
              pt: ["Antes de vogal, ", { term: "est-ce que" }, " vira ", { term: "est-ce qu’" }, "."]
              de: ["Vor einem Vokal wird ", { term: "est-ce que" }, " zu ", { term: "est-ce qu’" }, "."]
              it: ["Davanti a vocale, ", { term: "est-ce que" }, " diventa ", { term: "est-ce qu’" }, "."]
              pl: ["Przed samogłoską ", { term: "est-ce que" }, " zmienia się w ", { term: "est-ce qu’" }, "."]
              tr: ["Ünlüden önce ", { term: "est-ce que" }, ", ", { term: "est-ce qu’" }, " olur."]
              id: ["Sebelum vokal, ", { term: "est-ce que" }, " menjadi ", { term: "est-ce qu’" }, "."]
              vi: ["Trước nguyên âm, ", { term: "est-ce que" }, " thành ", { term: "est-ce qu’" }, "."]
            ex: { examples: [[{ target: "Est-ce qu’" }, "il pleut ?"], [{ target: "Est-ce qu’" }, "elles sont là ?"]] }
            tr: { en: { examples: ["Is it raining?", "Are they here?"] }, uk: { examples: ["Іде дощ?", "Вони тут?"] }, es: { examples: ["¿Llueve?", "¿Están aquí?"] }, pt: { examples: ["Está chovendo?", "Elas estão aqui?"] }, de: { examples: ["Regnet es?", "Sind sie da?"] }, it: { examples: ["Piove?", "Sono qui?"] }, pl: { examples: ["Pada deszcz?", "Czy one tu są?"] }, tr: { examples: ["Yağmur yağıyor mu?", "Onlar burada mı?"] }, id: { examples: ["Apakah hujan?", "Apakah mereka ada di sini?"] }, vi: { examples: ["Trời có mưa không?", "Họ có ở đây không?"] } }
          - type: "rule"
