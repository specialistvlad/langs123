            ex: { examples: [["Tu ", { target: "parles" }, " français ?"], ["Vous ", { target: "êtes" }, " étudiante ?"]] }
            tr: { en: { examples: ["Do you speak French?", "Are you a student?"] }, uk: { examples: ["Ти говориш французькою?", "Ви студентка?"] }, es: { examples: ["¿Hablas francés?", "¿Es usted estudiante?"] }, pt: { examples: ["Você fala francês?", "A senhora é estudante?"] }, de: { examples: ["Sprichst du Französisch?", "Sind Sie Studentin?"] }, it: { examples: ["Parli francese?", "Lei è studentessa?"] }, pl: { examples: ["Czy mówisz po francusku?", "Czy pani jest studentką?"] }, tr: { examples: ["Fransızca konuşuyor musun?", "Öğrenci misiniz?"] }, id: { examples: ["Apakah kamu berbicara bahasa Prancis?", "Apakah Anda seorang mahasiswi?"] }, vi: { examples: ["Bạn có nói tiếng Pháp không?", "Chị là sinh viên à?"] } }
          - level: "A1"
