            ex: { examples: [[{ target: "Habitez-vous" }, " ici ?"], [{ target: "Aimes-tu" }, " le café ?"]] }
            tr: { en: { examples: ["Do you live here?", "Do you like coffee?"] }, uk: { examples: ["Ви тут живете?", "Ти любиш каву?"] }, es: { examples: ["¿Vive usted aquí?", "¿Te gusta el café?"] }, pt: { examples: ["O senhor mora aqui?", "Você gosta de café?"] }, de: { examples: ["Wohnen Sie hier?", "Magst du Kaffee?"] }, it: { examples: ["Abita qui?", "Ti piace il caffè?"] }, pl: { examples: ["Czy pan mieszka tutaj?", "Lubisz kawę?"] }, tr: { examples: ["Burada mı oturuyorsunuz?", "Kahveyi sever misin?"] }, id: { examples: ["Apakah Anda tinggal di sini?", "Apakah kamu suka kopi?"] }, vi: { examples: ["Ông có sống ở đây không?", "Bạn có thích cà phê không?"] } }
          - level: "A2"
