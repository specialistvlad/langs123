summary:
  lead:
    fr: ["Une question fermée se pose par l’intonation, avec ", { term: "est-ce que" }, " ou par inversion ; les mots interrogatifs demandent une information."]
    en: ["A yes-no question uses intonation, ", { term: "est-ce que" }, " or inversion; question words ask for information."]
    uk: ["Загальне питання ставлять інтонацією, через ", { term: "est-ce que" }, " або інверсією; питальні слова запитують про конкретне."]
    es: ["La pregunta de sí o no se forma con la entonación, con ", { term: "est-ce que" }, " o con inversión; los interrogativos piden una información."]
    pt: ["A pergunta de sim ou não se faz com a entonação, com ", { term: "est-ce que" }, " ou com inversão; os interrogativos pedem uma informação."]
    de: ["Eine Ja-Nein-Frage entsteht durch Intonation, mit ", { term: "est-ce que" }, " oder durch Inversion; Fragewörter erfragen eine Information."]
    it: ["La domanda chiusa si forma con l'intonazione, con ", { term: "est-ce que" }, " o con l'inversione; le parole interrogative chiedono un'informazione."]
    pl: ["Pytanie rozstrzygnięcia tworzy się intonacją, przez ", { term: "est-ce que" }, " albo inwersję; słowa pytające dopytują o informację."]
    tr: ["Evet-hayır sorusu tonlamayla, ", { term: "est-ce que" }, " ile ya da devrik sırayla kurulur; soru sözcükleri bilgi sorar."]
    id: ["Pertanyaan ya-tidak dibentuk dengan intonasi, ", { term: "est-ce que" }, ", atau inversi; kata tanya menanyakan informasi."]
    vi: ["Câu hỏi có/không được tạo bằng ngữ điệu, bằng ", { term: "est-ce que" }, " hoặc bằng đảo ngữ; các từ nghi vấn hỏi về thông tin."]
  rule:
    fr: [{ term: "Est-ce que" }, " se place devant la phrase, qui garde son ordre :"]
    en: [{ term: "Est-ce que" }, " goes before the sentence, which keeps its word order:"]
    uk: [{ term: "Est-ce que" }, " стоїть перед реченням, яке зберігає свій порядок слів:"]
    es: [{ term: "Est-ce que" }, " va delante de la oración, que conserva su orden:"]
    pt: [{ term: "Est-ce que" }, " vem antes da frase, que mantém a sua ordem:"]
    de: [{ term: "Est-ce que" }, " steht vor dem Satz, der seine Wortstellung behält:"]
    it: [{ term: "Est-ce que" }, " sta davanti alla frase, che mantiene il suo ordine:"]
    pl: [{ term: "Est-ce que" }, " stoi przed zdaniem, które zachowuje swój szyk:"]
    tr: [{ term: "Est-ce que" }, " cümlenin önüne gelir, cümle kendi sırasını korur:"]
    id: [{ term: "Est-ce que" }, " diletakkan di depan kalimat, yang urutan katanya tetap:"]
    vi: [{ term: "Est-ce que" }, " đứng trước câu, và câu giữ nguyên trật tự từ:"]
