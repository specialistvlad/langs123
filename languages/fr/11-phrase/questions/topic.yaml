          tr: { en: "How many brothers do you have?", uk: "Скільки в тебе братів?", es: "¿Cuántos hermanos tienes?", pt: "Quantos irmãos você tem?", de: "Wie viele Brüder hast du?", it: "Quanti fratelli hai?", pl: "Ilu masz braci?", tr: "Kaç erkek kardeşin var?", id: "Kamu punya berapa saudara laki-laki?", vi: "Bạn có mấy anh em trai?" }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: ["Une question fermée se pose de trois façons : l’intonation, ", { term: "est-ce que" }, " ou l’inversion."]
              en: ["A yes-no question has three forms: intonation, ", { term: "est-ce que" }, " or inversion."]
              uk: ["Загальне питання має три способи: інтонація, ", { term: "est-ce que" }, " або інверсія."]
              es: ["La pregunta de sí o no se forma de tres maneras: entonación, ", { term: "est-ce que" }, " o inversión."]
              pt: ["A pergunta de sim ou não se faz de três modos: entonação, ", { term: "est-ce que" }, " ou inversão."]
              de: ["Eine Ja-Nein-Frage hat drei Formen: Intonation, ", { term: "est-ce que" }, " oder Inversion."]
              it: ["La domanda chiusa si fa in tre modi: intonazione, ", { term: "est-ce que" }, " o inversione."]
              pl: ["Pytanie rozstrzygnięcia tworzy się na trzy sposoby: intonacją, przez ", { term: "est-ce que" }, " albo inwersję."]
              tr: ["Evet-hayır sorusu üç yolla kurulur: tonlama, ", { term: "est-ce que" }, " ya da devrik sıra."]
              id: ["Pertanyaan ya-tidak dibentuk dengan tiga cara: intonasi, ", { term: "est-ce que" }, ", atau inversi."]
              vi: ["Câu hỏi có/không có ba cách: ngữ điệu, ", { term: "est-ce que" }, " hoặc đảo ngữ."]
            ex: { examples: ["Tu parles français ?", "Est-ce que tu parles français ?", "Parles-tu français ?"] }
            tr: { en: { examples: ["Do you speak French?", "Do you speak French?", "Do you speak French?"] }, uk: { examples: ["Ти говориш французькою?", "Ти говориш французькою?", "Ти говориш французькою?"] }, es: { examples: ["¿Hablas francés?", "¿Hablas francés?", "¿Hablas francés?"] }, pt: { examples: ["Você fala francês?", "Você fala francês?", "Você fala francês?"] }, de: { examples: ["Sprichst du Französisch?", "Sprichst du Französisch?", "Sprichst du Französisch?"] }, it: { examples: ["Parli francese?", "Parli francese?", "Parli francese?"] }, pl: { examples: ["Czy mówisz po francusku?", "Czy mówisz po francusku?", "Czy mówisz po francusku?"] }, tr: { examples: ["Fransızca konuşuyor musun?", "Fransızca konuşuyor musun?", "Fransızca konuşuyor musun?"] }, id: { examples: ["Apakah kamu berbicara bahasa Prancis?", "Apakah kamu berbicara bahasa Prancis?", "Apakah kamu berbicara bahasa Prancis?"] }, vi: { examples: ["Bạn có nói tiếng Pháp không?", "Bạn có nói tiếng Pháp không?", "Bạn có nói tiếng Pháp không?"] } }
          - type: "rule"
            level: "A0"
            text:
              fr: ["Une question fermée appelle la réponse ", { term: "oui" }, " ou ", { term: "non" }, "."]
              en: ["A yes-no question calls for the answer ", { term: "oui" }, " or ", { term: "non" }, "."]
              uk: ["На загальне питання відповідають ", { term: "oui" }, " або ", { term: "non" }, "."]
              es: ["La pregunta de sí o no se contesta con ", { term: "oui" }, " o ", { term: "non" }, "."]
              pt: ["A pergunta de sim ou não se responde com ", { term: "oui" }, " ou ", { term: "non" }, "."]
              de: ["Auf eine Ja-Nein-Frage antwortet man mit ", { term: "oui" }, " oder ", { term: "non" }, "."]
              it: ["Alla domanda chiusa si risponde con ", { term: "oui" }, " o ", { term: "non" }, "."]
              pl: ["Na pytanie rozstrzygnięcia odpowiada się ", { term: "oui" }, " lub ", { term: "non" }, "."]
              tr: ["Evet-hayır sorusuna ", { term: "oui" }, " ya da ", { term: "non" }, " ile cevap verilir."]
              id: ["Pertanyaan ya-tidak dijawab dengan ", { term: "oui" }, " atau ", { term: "non" }, "."]
              vi: ["Câu hỏi có/không được trả lời bằng ", { term: "oui" }, " hoặc ", { term: "non" }, "."]
            ex: { exchange: ["Vous êtes français ?", "Non, je suis belge."] }
            tr: { en: "Are you French? — No, I'm Belgian.", uk: "Ви француз? — Ні, я бельгієць.", es: "¿Es usted francés? — No, soy belga.", pt: "O senhor é francês? — Não, sou belga.", de: "Sind Sie Franzose? — Nein, ich bin Belgier.", it: "Lei è francese? — No, sono belga.", pl: "Czy pan jest Francuzem? — Nie, jestem Belgiem.", tr: "Fransız mısınız? — Hayır, Belçikalıyım.", id: "Apakah Anda orang Prancis? — Bukan, saya orang Belgia.", vi: "Ông là người Pháp à? — Không, tôi là người Bỉ." }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour répondre ", { term: "si" }, " à une question négative, voir ", { link: "La négation", to: "fr.phrase.negation" }, "."]
              en: ["To answer ", { term: "si" }, " to a negative question, see ", { link: "Negation", to: "fr.phrase.negation" }, "."]
              uk: ["Про відповідь ", { term: "si" }, " на заперечне питання — див. ", { link: "Заперечення", to: "fr.phrase.negation" }, "."]
              es: ["Para contestar ", { term: "si" }, " a una pregunta negativa, ver ", { link: "La negación", to: "fr.phrase.negation" }, "."]
              pt: ["Para responder ", { term: "si" }, " a uma pergunta negativa, veja ", { link: "A negação", to: "fr.phrase.negation" }, "."]
              de: ["Zur Antwort ", { term: "si" }, " auf eine verneinte Frage siehe ", { link: "Die Verneinung", to: "fr.phrase.negation" }, "."]
              it: ["Per rispondere ", { term: "si" }, " a una domanda negativa, vedi ", { link: "La negazione", to: "fr.phrase.negation" }, "."]
              pl: ["O odpowiedzi ", { term: "si" }, " na pytanie przeczące — zob. ", { link: "Przeczenie", to: "fr.phrase.negation" }, "."]
              tr: ["Olumsuz bir soruya ", { term: "si" }, " ile cevap vermek için bkz. ", { link: "Olumsuzluk", to: "fr.phrase.negation" }, "."]
              id: ["Untuk menjawab ", { term: "si" }, " pada pertanyaan negatif, lihat ", { link: "Negasi", to: "fr.phrase.negation" }, "."]
              vi: ["Về cách trả lời ", { term: "si" }, " cho câu hỏi phủ định, xem ", { link: "Phủ định", to: "fr.phrase.negation" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Au passé composé, l’inversion garde l’auxiliaire et le pronom ensemble : voir ", { link: "Le passé composé : j’ai mangé", to: fr.passe.passe-compose }, "."]
              en: ["In the passé composé, inversion keeps the auxiliary and the pronoun together: see ", { link: "Passé Composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              uk: ["У passé composé при інверсії допоміжне дієслово та займенник стоять разом: див. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              es: ["En el passé composé, la inversión junta el auxiliar y el pronombre: ver ", { link: "El passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pt: ["No passé composé, a inversão mantém o auxiliar e o pronome juntos: veja ", { link: "O passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              de: ["Im passé composé stehen bei der Inversion Hilfsverb und Pronomen zusammen: siehe ", { link: "Das Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              it: ["Nel passé composé, l'inversione tiene insieme l'ausiliare e il pronome: vedi ", { link: "Il passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pl: ["W passé composé przy inwersji czasownik posiłkowy i zaimek stoją razem: zob. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              tr: ["Passé composé’da devrik sırada yardımcı fiil ve zamir birlikte durur: bkz. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              id: ["Dalam passé composé, pada inversi kata kerja bantu dan pronomina tetap berdampingan: lihat ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              vi: ["Ở passé composé, khi đảo ngữ trợ động từ và đại từ đứng cùng nhau: xem ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
  - title:
      fr: "Forme : la question fermée"
