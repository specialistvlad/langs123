              es: ["Con ", { term: "je" }, ", se usa ", { term: "est-ce que" }, ": invertir ", { term: "je" }, " es raro."]
              pt: ["Com ", { term: "je" }, ", usa-se ", { term: "est-ce que" }, ": a inversão de ", { term: "je" }, " é rara."]
              de: ["Mit ", { term: "je" }, " nimmt man ", { term: "est-ce que" }, ": Die Inversion von ", { term: "je" }, " ist selten."]
              it: ["Con ", { term: "je" }, " si usa ", { term: "est-ce que" }, ": l'inversione di ", { term: "je" }, " è rara."]
              pl: ["Z ", { term: "je" }, " używa się ", { term: "est-ce que" }, ": inwersja ", { term: "je" }, " jest rzadka."]
              tr: [{ term: "je" }, " ile ", { term: "est-ce que" }, " kullanılır: ", { term: "je" }, " ile devrik sıra seyrektir."]
              id: ["Dengan ", { term: "je" }, ", pakai ", { term: "est-ce que" }, ": inversi ", { term: "je" }, " jarang dipakai."]
