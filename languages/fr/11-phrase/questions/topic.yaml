              pl: ["Gdy podmiotem jest rzeczownik, używa się ", { term: "est-ce que" }, " albo zachowuje szyk zdania oznajmującego."]
              tr: ["Özne bir isimse ", { term: "est-ce que" }, " kullanılır ya da olumlu cümlenin sırası korunur."]
              id: ["Jika subjeknya kata benda, pakai ", { term: "est-ce que" }, " atau pertahankan urutan kalimat pernyataan."]
              vi: ["Khi chủ ngữ là danh từ, dùng ", { term: "est-ce que" }, " hoặc giữ trật tự của câu khẳng định."]
            ex: { examples: [[{ target: "Est-ce que" }, " Marie parle anglais ?"], ["Léa ", { target: "habite" }, " ici ?"]] }
            tr: { en: { examples: ["Does Marie speak English?", "Does Léa live here?"] }, uk: { examples: ["Марі говорить англійською?", "Леа тут живе?"] }, es: { examples: ["¿Marie habla inglés?", "¿Léa vive aquí?"] }, pt: { examples: ["A Marie fala inglês?", "A Léa mora aqui?"] }, de: { examples: ["Spricht Marie Englisch?", "Wohnt Léa hier?"] }, it: { examples: ["Marie parla inglese?", "Léa abita qui?"] }, pl: { examples: ["Czy Marie mówi po angielsku?", "Czy Léa tu mieszka?"] }, tr: { examples: ["Marie İngilizce konuşuyor mu?", "Léa burada mı oturuyor?"] }, id: { examples: ["Apakah Marie berbicara bahasa Inggris?", "Apakah Léa tinggal di sini?"] }, vi: { examples: ["Marie có nói tiếng Anh không?", "Léa có sống ở đây không?"] } }
          - type: "rule"
