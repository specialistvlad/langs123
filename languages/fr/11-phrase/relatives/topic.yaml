summary:
  lead:
    fr: ["Les pronoms relatifs ", { term: "qui" }, ", ", { term: "que" }, " et ", { term: "où" }, " relient un nom à la proposition qui le décrit : sujet, objet ou lieu."]
    en: ["The relative pronouns ", { term: "qui" }, ", ", { term: "que" }, " and ", { term: "où" }, " link a noun to the clause that describes it: subject, object or place."]
    uk: ["Відносні займенники ", { term: "qui" }, ", ", { term: "que" }, " та ", { term: "où" }, " з’єднують іменник із підрядною частиною, що його описує: підмет, додаток або місце."]
    es: ["Los pronombres relativos ", { term: "qui" }, ", ", { term: "que" }, " y ", { term: "où" }, " unen un nombre con la oración que lo describe: sujeto, objeto o lugar."]
    pt: ["Os pronomes relativos ", { term: "qui" }, ", ", { term: "que" }, " e ", { term: "où" }, " ligam um substantivo à oração que o descreve: sujeito, objeto ou lugar."]
    de: ["Die Relativpronomen ", { term: "qui" }, ", ", { term: "que" }, " und ", { term: "où" }, " verbinden ein Nomen mit dem Nebensatz, der es beschreibt: Subjekt, Objekt oder Ort."]
    it: ["I pronomi relativi ", { term: "qui" }, ", ", { term: "que" }, " e ", { term: "où" }, " legano un nome alla proposizione che lo descrive: soggetto, oggetto o luogo."]
    pl: ["Zaimki względne ", { term: "qui" }, ", ", { term: "que" }, " i ", { term: "où" }, " łączą rzeczownik ze zdaniem, które go opisuje: podmiot, dopełnienie lub miejsce."]
    tr: ["İlgi zamirleri ", { term: "qui" }, ", ", { term: "que" }, " ve ", { term: "où" }, " bir ismi onu anlatan cümleye bağlar: özne, nesne ya da yer."]
    id: ["Pronomina relatif ", { term: "qui" }, ", ", { term: "que" }, ", dan ", { term: "où" }, " menghubungkan kata benda dengan klausa yang menjelaskannya: subjek, objek, atau tempat."]
    vi: ["Đại từ quan hệ ", { term: "qui" }, ", ", { term: "que" }, " và ", { term: "où" }, " nối một danh từ với mệnh đề mô tả nó: chủ ngữ, tân ngữ hoặc nơi chốn."]
  rule:
    fr: [{ term: "Qui" }, " est suivi d’un verbe ; ", { term: "que" }, " est suivi d’un sujet et d’un verbe :"]
    en: [{ term: "Qui" }, " is followed by a verb; ", { term: "que" }, " is followed by a subject and a verb:"]
    uk: ["Після ", { term: "qui" }, " стоїть дієслово; після ", { term: "que" }, " — підмет і дієслово:"]
    es: ["Tras ", { term: "qui" }, " viene un verbo; tras ", { term: "que" }, ", un sujeto y un verbo:"]
    pt: ["Depois de ", { term: "qui" }, " vem um verbo; depois de ", { term: "que" }, ", um sujeito e um verbo:"]
    de: ["Nach ", { term: "qui" }, " steht ein Verb; nach ", { term: "que" }, " ein Subjekt und ein Verb:"]
    it: ["Dopo ", { term: "qui" }, " viene un verbo; dopo ", { term: "que" }, ", un soggetto e un verbo:"]
    pl: ["Po ", { term: "qui" }, " następuje czasownik; po ", { term: "que" }, " — podmiot i czasownik:"]
    tr: [{ term: "Qui" }, " sonrasında bir fiil, ", { term: "que" }, " sonrasında bir özne ve bir fiil gelir:"]
    id: ["Setelah ", { term: "qui" }, " ada kata kerja; setelah ", { term: "que" }, " ada subjek dan kata kerja:"]
    vi: ["Sau ", { term: "qui" }, " là một động từ; sau ", { term: "que" }, " là một chủ ngữ và một động từ:"]
  ex: { examples: [["Un ami ", { target: "qui" }, " parle."], ["Un ami ", { target: "que" }, " j’aime."]] }
