sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              fr: "Un pronom relatif relie un nom à une proposition qui le décrit."
              en: "A relative pronoun links a noun to a clause that describes it."
              uk: "Відносний займенник з’єднує іменник із підрядною частиною, що його описує."
              es: "Un pronombre relativo une un nombre con una oración que lo describe."
              pt: "Um pronome relativo liga um substantivo a uma oração que o descreve."
              de: "Ein Relativpronomen verbindet ein Nomen mit einem Nebensatz, der es beschreibt."
              it: "Un pronome relativo lega un nome a una proposizione che lo descrive."
              pl: "Zaimek względny łączy rzeczownik ze zdaniem, które go opisuje."
              tr: "Bir ilgi zamiri, bir ismi onu anlatan cümleye bağlar."
              id: "Pronomina relatif menghubungkan kata benda dengan klausa yang menjelaskannya."
              vi: "Đại từ quan hệ nối một danh từ với mệnh đề mô tả nó."
            ex: { examples: [["J’ai un ami ", { target: "qui" }, " habite à Paris."], ["C’est la ville ", { target: "où" }, " je travaille."]] }
            tr: { en: { examples: ["I have a friend who lives in Paris.", "It's the city where I work."] }, uk: { examples: ["У мене є друг, який живе в Парижі.", "Це місто, де я працюю."] }, es: { examples: ["Tengo un amigo que vive en París.", "Es la ciudad donde trabajo."] }, pt: { examples: ["Eu tenho um amigo que mora em Paris.", "É a cidade onde eu trabalho."] }, de: { examples: ["Ich habe einen Freund, der in Paris wohnt.", "Das ist die Stadt, in der ich arbeite."] }, it: { examples: ["Ho un amico che abita a Parigi.", "È la città dove lavoro."] }, pl: { examples: ["Mam przyjaciela, który mieszka w Paryżu.", "To miasto, w którym pracuję."] }, tr: { examples: ["Paris’te yaşayan bir arkadaşım var.", "Çalıştığım şehir burası."] }, id: { examples: ["Aku punya teman yang tinggal di Paris.", "Itu kota tempat aku bekerja."] }, vi: { examples: ["Tôi có một người bạn sống ở Paris.", "Đó là thành phố nơi tôi làm việc."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: "Le pronom relatif se place juste après le nom qu’il décrit."
              en: "The relative pronoun comes right after the noun it describes."
              uk: "Відносний займенник стоїть одразу після іменника, який він описує."
              es: "El pronombre relativo va justo después del nombre que describe."
              pt: "O pronome relativo vem logo depois do substantivo que descreve."
              de: "Das Relativpronomen steht direkt nach dem Nomen, das es beschreibt."
              it: "Il pronome relativo sta subito dopo il nome che descrive."
              pl: "Zaimek względny stoi zaraz po rzeczowniku, który opisuje."
              tr: "İlgi zamiri, anlattığı ismin hemen arkasına gelir."
              id: "Pronomina relatif diletakkan tepat setelah kata benda yang dijelaskannya."
