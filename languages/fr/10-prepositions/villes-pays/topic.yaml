sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Le nom du lieu décide de la préposition : une ville, un pays féminin, un pays masculin ou un pays pluriel."
              en: "The kind of place sets the preposition: a city, a feminine country, a masculine country or a plural country."
              uk: "Вид місця визначає прийменник: місто, країна жіночого роду, чоловічого роду чи країна в множині."
              es: "El tipo de lugar fija la preposición: una ciudad, un país femenino, un país masculino o un país plural."
              pt: "O tipo de lugar define a preposição: uma cidade, um país feminino, um país masculino ou um país plural."
              de: "Die Art des Ortes bestimmt die Präposition: eine Stadt, ein feminines Land, ein maskulines Land oder ein Pluralland."
              it: "Il tipo di luogo fissa la preposizione: una città, un paese femminile, un paese maschile o un paese plurale."
              pl: "Rodzaj miejsca określa przyimek: miasto, kraj rodzaju żeńskiego, męskiego albo kraj w liczbie mnogiej."
              tr: "Yerin türü edatı belirler: şehir, dişil ülke, eril ülke ya da çoğul ülke."
              id: "Jenis tempat menentukan kata depan: kota, negara feminin, negara maskulin, atau negara jamak."
              vi: "Loại địa danh quyết định giới từ: thành phố, nước giống cái, nước giống đực hoặc nước số nhiều."
            ex: { examples: [["J’habite ", { target: "à" }, " Paris."], ["J’habite ", { target: "en" }, " Italie."], ["J’habite ", { target: "au" }, " Brésil."], ["J’habite ", { target: "aux" }, " Pays-Bas."]] }
            tr: { en: { examples: ["I live in Paris.", "I live in Italy.", "I live in Brazil.", "I live in the Netherlands."] }, uk: { examples: ["Я живу в Парижі.", "Я живу в Італії.", "Я живу в Бразилії.", "Я живу в Нідерландах."] }, es: { examples: ["Vivo en París.", "Vivo en Italia.", "Vivo en Brasil.", "Vivo en los Países Bajos."] }, pt: { examples: ["Eu moro em Paris.", "Eu moro na Itália.", "Eu moro no Brasil.", "Eu moro nos Países Baixos."] }, de: { examples: ["Ich wohne in Paris.", "Ich wohne in Italien.", "Ich wohne in Brasilien.", "Ich wohne in den Niederlanden."] }, it: { examples: ["Abito a Parigi.", "Abito in Italia.", "Abito in Brasile.", "Abito nei Paesi Bassi."] }, pl: { examples: ["Mieszkam w Paryżu.", "Mieszkam we Włoszech.", "Mieszkam w Brazylii.", "Mieszkam w Holandii."] }, tr: { examples: ["Paris’te yaşıyorum.", "İtalya’da yaşıyorum.", "Brezilya’da yaşıyorum.", "Hollanda’da yaşıyorum."] }, id: { examples: ["Aku tinggal di Paris.", "Aku tinggal di Italia.", "Aku tinggal di Brasil.", "Aku tinggal di Belanda."] }, vi: { examples: ["Tôi sống ở Paris.", "Tôi sống ở Ý.", "Tôi sống ở Brazil.", "Tôi sống ở Hà Lan."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["La même préposition suit ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " et ", { term: "voyager" }, "."]
              en: ["The same preposition follows ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " and ", { term: "voyager" }, "."]
              uk: ["Той самий прийменник стоїть після ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " і ", { term: "voyager" }, "."]
              es: ["La misma preposición sigue a ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " y ", { term: "voyager" }, "."]
              pt: ["A mesma preposição acompanha ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " e ", { term: "voyager" }, "."]
              de: ["Dieselbe Präposition steht nach ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " und ", { term: "voyager" }, "."]
              it: ["La stessa preposizione segue ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " e ", { term: "voyager" }, "."]
              pl: ["Ten sam przyimek występuje po ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " i ", { term: "voyager" }, "."]
              tr: ["Aynı edat ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " ve ", { term: "voyager" }, " ile kullanılır."]
              id: ["Kata depan yang sama mengikuti ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, ", dan ", { term: "voyager" }, "."]
              vi: ["Cùng một giới từ đứng sau ", { term: "habiter" }, ", ", { term: "vivre" }, ", ", { term: "être" }, ", ", { term: "aller" }, " và ", { term: "voyager" }, "."]
            ex: { examples: [["Je suis ", { target: "en" }, " Chine."], ["Je vais ", { target: "en" }, " Chine."]] }
            tr: { en: { examples: ["I’m in China.", "I’m going to China."] }, uk: { examples: ["Я в Китаї.", "Я їду до Китаю."] }, es: { examples: ["Estoy en China.", "Voy a China."] }, pt: { examples: ["Eu estou na China.", "Eu vou para a China."] }, de: { examples: ["Ich bin in China.", "Ich fahre nach China."] }, it: { examples: ["Sono in Cina.", "Vado in Cina."] }, pl: { examples: ["Jestem w Chinach.", "Jadę do Chin."] }, tr: { examples: ["Çin’deyim.", "Çin’e gidiyorum."] }, id: { examples: ["Aku di Tiongkok.", "Aku pergi ke Tiongkok."] }, vi: { examples: ["Tôi ở Trung Quốc.", "Tôi đi Trung Quốc."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Pour dire d’où l’on vient, on emploie ", { term: "de" }, " après ", { term: "venir" }, ", ", { term: "être" }, " et ", { term: "partir" }, "."]
              en: ["To say where you come from, use ", { term: "de" }, " after ", { term: "venir" }, ", ", { term: "être" }, " and ", { term: "partir" }, "."]
              uk: ["Щоб сказати, звідки ти, вживають ", { term: "de" }, " після ", { term: "venir" }, ", ", { term: "être" }, " і ", { term: "partir" }, "."]
              es: ["Para decir de dónde vienes, se usa ", { term: "de" }, " tras ", { term: "venir" }, ", ", { term: "être" }, " y ", { term: "partir" }, "."]
              pt: ["Para dizer de onde se vem, usa-se ", { term: "de" }, " depois de ", { term: "venir" }, ", ", { term: "être" }, " e ", { term: "partir" }, "."]
              de: ["Um zu sagen, woher man kommt, steht ", { term: "de" }, " nach ", { term: "venir" }, ", ", { term: "être" }, " und ", { term: "partir" }, "."]
              it: ["Per dire da dove si viene, si usa ", { term: "de" }, " dopo ", { term: "venir" }, ", ", { term: "être" }, " e ", { term: "partir" }, "."]
              pl: ["Aby powiedzieć, skąd ktoś pochodzi, używa się ", { term: "de" }, " po ", { term: "venir" }, ", ", { term: "être" }, " i ", { term: "partir" }, "."]
              tr: ["Nereden geldiğini söylemek için ", { term: "venir" }, ", ", { term: "être" }, " ve ", { term: "partir" }, " fiillerinden sonra ", { term: "de" }, " kullanılır."]
              id: ["Untuk menyatakan asal, dipakai ", { term: "de" }, " setelah ", { term: "venir" }, ", ", { term: "être" }, ", dan ", { term: "partir" }, "."]
              vi: ["Để nói mình đến từ đâu, dùng ", { term: "de" }, " sau ", { term: "venir" }, ", ", { term: "être" }, " và ", { term: "partir" }, "."]
            ex: { examples: [["Je viens ", { target: "de" }, " Lyon."], ["Elle est ", { target: "de" }, " Nice."], ["Il part ", { target: "de" }, " Paris."]] }
            tr: { en: { examples: ["I come from Lyon.", "She’s from Nice.", "He’s leaving from Paris."] }, uk: { examples: ["Я родом із Ліона.", "Вона з Ніцци.", "Він вирушає з Парижа."] }, es: { examples: ["Vengo de Lyon.", "Ella es de Niza.", "Él sale de París."] }, pt: { examples: ["Eu venho de Lyon.", "Ela é de Nice.", "Ele parte de Paris."] }, de: { examples: ["Ich komme aus Lyon.", "Sie ist aus Nizza.", "Er fährt von Paris ab."] }, it: { examples: ["Vengo da Lione.", "Lei è di Nizza.", "Lui parte da Parigi."] }, pl: { examples: ["Pochodzę z Lyonu.", "Ona jest z Nicei.", "On wyjeżdża z Paryża."] }, tr: { examples: ["Lyon’danım.", "O, Nice’li.", "O, Paris’ten ayrılıyor."] }, id: { examples: ["Aku berasal dari Lyon.", "Dia dari Nice.", "Dia berangkat dari Paris."] }, vi: { examples: ["Tôi đến từ Lyon.", "Cô ấy là người Nice.", "Anh ấy khởi hành từ Paris."] } }
          - type: "note"
            level: "A1"
            text:
              fr: [{ term: "à" }, " et ", { term: "de" }, " se contractent avec ", { term: "le" }, " et ", { term: "les" }, " : ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: [{ term: "à" }, " and ", { term: "de" }, " contract with ", { term: "le" }, " and ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". See ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: [{ term: "à" }, " і ", { term: "de" }, " зливаються з ", { term: "le" }, " і ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: [{ term: "à" }, " y ", { term: "de" }, " se contraen con ", { term: "le" }, " y ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Véase ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: [{ term: "à" }, " e ", { term: "de" }, " se contraem com ", { term: "le" }, " e ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: [{ term: "à" }, " und ", { term: "de" }, " verschmelzen mit ", { term: "le" }, " und ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: [{ term: "à" }, " e ", { term: "de" }, " si fondono con ", { term: "le" }, " e ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: [{ term: "à" }, " i ", { term: "de" }, " zlewają się z ", { term: "le" }, " i ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: [{ term: "à" }, " ve ", { term: "de" }, ", ", { term: "le" }, " ve ", { term: "les" }, " ile kaynaşır: ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: [{ term: "à" }, " dan ", { term: "de" }, " menyatu dengan ", { term: "le" }, " dan ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: [{ term: "à" }, " và ", { term: "de" }, " kết hợp với ", { term: "le" }, " và ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ", ", { term: "du" }, ", ", { term: "des" }, ". Xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les autres lieux (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), voir ", { link: "Les prépositions de lieu", to: "fr.prepositions.prepositions-lieu" }, "."]
              en: ["For other places (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), see ", { link: "Prepositions of Place", to: fr.prepositions.prepositions-lieu }, "."]
              uk: ["Про інші місця (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, ") див. ", { link: "Прийменники місця", to: "fr.prepositions.prepositions-lieu" }, "."]
              es: ["Para otros lugares (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), véase ", { link: "Las preposiciones de lugar", to: "fr.prepositions.prepositions-lieu" }, "."]
              pt: ["Para outros lugares (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), veja ", { link: "As preposições de lugar", to: "fr.prepositions.prepositions-lieu" }, "."]
              de: ["Zu anderen Orten (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, ") siehe ", { link: "Die Ortspräpositionen", to: "fr.prepositions.prepositions-lieu" }, "."]
              it: ["Per altri luoghi (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), vedi ", { link: "Le preposizioni di luogo", to: "fr.prepositions.prepositions-lieu" }, "."]
              pl: ["O innych miejscach (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, ") zob. ", { link: "Przyimki miejsca", to: "fr.prepositions.prepositions-lieu" }, "."]
              tr: ["Diğer yerler (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, ") için bkz. ", { link: "Yer edatları", to: "fr.prepositions.prepositions-lieu" }, "."]
              id: ["Untuk tempat lain (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), lihat ", { link: "Kata depan tempat", to: "fr.prepositions.prepositions-lieu" }, "."]
              vi: ["Về các nơi khác (", { term: "à la maison" }, ", ", { term: "chez" }, ", ", { term: "dans" }, "), xem ", { link: "Giới từ chỉ nơi chốn", to: "fr.prepositions.prepositions-lieu" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les formes de ", { term: "aller" }, " et de ", { term: "venir" }, ", voir ", { link: "Le présent : les verbes irréguliers", to: fr.present.present-irreguliers }, "."]
              en: ["For the forms of ", { term: "aller" }, " and ", { term: "venir" }, ", see ", { link: "Present Tense: Irregular Verbs", to: fr.present.present-irreguliers }, "."]
              uk: ["Про форми ", { term: "aller" }, " і ", { term: "venir" }, " див. ", { link: "Теперішній час: неправильні дієслова", to: fr.present.present-irreguliers }, "."]
              es: ["Para las formas de ", { term: "aller" }, " y ", { term: "venir" }, ", véase ", { link: "El presente: los verbos irregulares", to: fr.present.present-irreguliers }, "."]
              pt: ["Para as formas de ", { term: "aller" }, " e ", { term: "venir" }, ", veja ", { link: "O presente: os verbos irregulares", to: fr.present.present-irreguliers }, "."]
              de: ["Zu den Formen von ", { term: "aller" }, " und ", { term: "venir" }, " siehe ", { link: "Das Präsens: unregelmäßige Verben", to: fr.present.present-irreguliers }, "."]
              it: ["Per le forme di ", { term: "aller" }, " e ", { term: "venir" }, ", vedi ", { link: "Il presente: i verbi irregolari", to: fr.present.present-irreguliers }, "."]
              pl: ["O formach ", { term: "aller" }, " i ", { term: "venir" }, " zob. ", { link: "Czas teraźniejszy: czasowniki nieregularne", to: fr.present.present-irreguliers }, "."]
              tr: [{ term: "aller" }, " ve ", { term: "venir" }, " fiillerinin biçimleri için bkz. ", { link: "Şimdiki zaman: düzensiz fiiller", to: fr.present.present-irreguliers }, "."]
              id: ["Untuk bentuk ", { term: "aller" }, " dan ", { term: "venir" }, ", lihat ", { link: "Presens: kata kerja tidak beraturan", to: fr.present.present-irreguliers }, "."]
              vi: ["Về các dạng của ", { term: "aller" }, " và ", { term: "venir" }, ", xem ", { link: "Thì hiện tại: động từ bất quy tắc", to: fr.present.present-irreguliers }, "."]
