sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "La préposition dépend du mot de temps : une heure, un jour, un mois, une saison ou une année."
              en: "The preposition depends on the time word: an hour, a day, a month, a season or a year."
              uk: "Прийменник залежить від слова, що позначає час: година, день, місяць, пора року чи рік."
              es: "La preposición depende de la palabra de tiempo: una hora, un día, un mes, una estación o un año."
              pt: "A preposição depende da palavra de tempo: uma hora, um dia, um mês, uma estação ou um ano."
              de: "Die Präposition hängt vom Zeitwort ab: einer Uhrzeit, einem Tag, einem Monat, einer Jahreszeit oder einem Jahr."
              it: "La preposizione dipende dalla parola di tempo: un’ora, un giorno, un mese, una stagione o un anno."
              pl: "Przyimek zależy od słowa oznaczającego czas: godziny, dnia, miesiąca, pory roku lub roku."
              tr: "Edat, zaman sözcüğüne bağlıdır: saat, gün, ay, mevsim ya da yıl."
              id: "Kata depan bergantung pada kata waktunya: jam, hari, bulan, musim, atau tahun."
              vi: "Giới từ phụ thuộc vào từ chỉ thời gian: giờ, ngày, tháng, mùa hoặc năm."
            ex: { examples: [["Je me lève ", { target: "à" }, " sept heures."], ["Elle travaille ", { target: "le" }, " lundi."], ["Nous partons ", { target: "en" }, " juillet."]] }
            tr: { en: { examples: ["I get up at seven.", "She works on Mondays.", "We’re leaving in July."] }, uk: { examples: ["Я встаю о сьомій.", "Вона працює по понеділках.", "Ми їдемо в липні."] }, es: { examples: ["Me levanto a las siete.", "Ella trabaja los lunes.", "Nos vamos en julio."] }, pt: { examples: ["Eu me levanto às sete.", "Ela trabalha às segundas-feiras.", "Nós partimos em julho."] }, de: { examples: ["Ich stehe um sieben Uhr auf.", "Sie arbeitet montags.", "Wir fahren im Juli ab."] }, it: { examples: ["Mi alzo alle sette.", "Lei lavora il lunedì.", "Partiamo a luglio."] }, pl: { examples: ["Wstaję o siódmej.", "Ona pracuje w poniedziałki.", "Wyjeżdżamy w lipcu."] }, tr: { examples: ["Saat yedide kalkarım.", "O, pazartesi günleri çalışıyor.", "Temmuzda gidiyoruz."] }, id: { examples: ["Aku bangun pukul tujuh.", "Dia bekerja setiap hari Senin.", "Kami berangkat pada bulan Juli."] }, vi: { examples: ["Tôi dậy lúc bảy giờ.", "Cô ấy làm việc vào thứ Hai hằng tuần.", "Chúng tôi đi vào tháng Bảy."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Une durée se dit avec ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " ou ", { term: "depuis" }, ", devant le nombre."]
              en: ["A length of time takes ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " or ", { term: "depuis" }, ", before the number."]
              uk: ["Тривалість передають через ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " або ", { term: "depuis" }, " перед числом."]
              es: ["Una duración se dice con ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " o ", { term: "depuis" }, ", delante del número."]
              pt: ["Uma duração se diz com ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " ou ", { term: "depuis" }, ", antes do número."]
              de: ["Eine Zeitdauer steht mit ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " oder ", { term: "depuis" }, " vor der Zahl."]
              it: ["Una durata si dice con ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " o ", { term: "depuis" }, ", davanti al numero."]
              pl: ["Czas trwania wyraża się przez ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " lub ", { term: "depuis" }, " przed liczbą."]
              tr: ["Süre, sayının önünde ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " ya da ", { term: "depuis" }, " ile söylenir."]
              id: ["Durasi dinyatakan dengan ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, ", atau ", { term: "depuis" }, " sebelum angkanya."]
              vi: ["Khoảng thời gian dùng ", { term: "pendant" }, ", ", { term: "dans" }, ", ", { term: "il y a" }, " hoặc ", { term: "depuis" }, " trước con số."]
            ex: { examples: [["Je dors ", { target: "pendant" }, " huit heures."], ["Le train part ", { target: "dans" }, " dix minutes."]] }
            tr: { en: { examples: ["I sleep for eight hours.", "The train leaves in ten minutes."] }, uk: { examples: ["Я сплю вісім годин.", "Потяг відправляється за десять хвилин."] }, es: { examples: ["Duermo ocho horas.", "El tren sale dentro de diez minutos."] }, pt: { examples: ["Eu durmo oito horas.", "O trem parte em dez minutos."] }, de: { examples: ["Ich schlafe acht Stunden.", "Der Zug fährt in zehn Minuten ab."] }, it: { examples: ["Dormo otto ore.", "Il treno parte tra dieci minuti."] }, pl: { examples: ["Śpię osiem godzin.", "Pociąg odjeżdża za dziesięć minut."] }, tr: { examples: ["Sekiz saat uyuyorum.", "Tren on dakikaya kalkıyor."] }, id: { examples: ["Aku tidur selama delapan jam.", "Kereta berangkat sepuluh menit lagi."] }, vi: { examples: ["Tôi ngủ tám tiếng.", "Chuyến tàu khởi hành sau mười phút nữa."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour dire l’heure, voir ", { link: "L’heure", to: "fr.bases.heure" }, "."]
              en: ["To tell the time, see ", { link: "Telling the Time", to: fr.bases.heure }, "."]
              uk: ["Про те, як називати час, див. ", { link: "Котра година", to: fr.bases.heure }, "."]
              es: ["Para decir la hora, véase ", { link: "La hora", to: "fr.bases.heure" }, "."]
              pt: ["Para dizer as horas, veja ", { link: "As horas", to: "fr.bases.heure" }, "."]
              de: ["Zum Sagen der Uhrzeit siehe ", { link: "Die Uhrzeit", to: "fr.bases.heure" }, "."]
              it: ["Per dire l’ora, vedi ", { link: "Dire l’ora", to: fr.bases.heure }, "."]
              pl: ["O podawaniu godziny zob. ", { link: "Podawanie godziny", to: fr.bases.heure }, "."]
              tr: ["Saati söylemek için bkz. ", { link: "Saati söyleme", to: fr.bases.heure }, "."]
              id: ["Untuk menyebutkan jam, lihat ", { link: "Menyebutkan jam", to: fr.bases.heure }, "."]
              vi: ["Về cách nói giờ, xem ", { link: "Nói giờ", to: fr.bases.heure }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les jours, les mois et les dates, voir ", { link: "Jours, mois et dates", to: fr.bases.jours-mois-dates }, "."]
              en: ["For days, months and dates, see ", { link: "Days, Months and Dates", to: fr.bases.jours-mois-dates }, "."]
              uk: ["Про дні, місяці й дати див. ", { link: "Дні, місяці та дати", to: fr.bases.jours-mois-dates }, "."]
              es: ["Para los días, los meses y las fechas, véase ", { link: "Días, meses y fechas", to: "fr.bases.jours-mois-dates" }, "."]
              pt: ["Para os dias, os meses e as datas, veja ", { link: "Dias, meses e datas", to: "fr.bases.jours-mois-dates" }, "."]
              de: ["Zu Tagen, Monaten und Datum siehe ", { link: "Tage, Monate und Datumsangaben", to: fr.bases.jours-mois-dates }, "."]
              it: ["Per i giorni, i mesi e le date, vedi ", { link: "Giorni, mesi e date", to: "fr.bases.jours-mois-dates" }, "."]
              pl: ["O dniach, miesiącach i datach zob. ", { link: "Dni, miesiące i daty", to: "fr.bases.jours-mois-dates" }, "."]
              tr: ["Günler, aylar ve tarihler için bkz. ", { link: "Günler, aylar ve tarihler", to: "fr.bases.jours-mois-dates" }, "."]
              id: ["Untuk hari, bulan, dan tanggal, lihat ", { link: "Hari, bulan, dan tanggal", to: "fr.bases.jours-mois-dates" }, "."]
              vi: ["Về ngày, tháng và ngày tháng, xem ", { link: "Thứ, tháng và ngày", to: fr.bases.jours-mois-dates }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: [{ term: "Il y a" }, " + durée est différent de ", { term: "il y a" }, " + nom, qui dit qu’une chose existe. Voir ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              en: [{ term: "Il y a" }, " + a length of time differs from ", { term: "il y a" }, " + noun, which says something exists. See ", { link: "There Is: il y a", to: fr.etre-avoir.il-y-a }, "."]
              uk: [{ term: "Il y a" }, " + тривалість відрізняється від ", { term: "il y a" }, " + іменник, що означає «є, існує». Див. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              es: [{ term: "Il y a" }, " + duración es distinto de ", { term: "il y a" }, " + nombre, que dice que algo existe. Véase ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pt: [{ term: "Il y a" }, " + duração é diferente de ", { term: "il y a" }, " + substantivo, que diz que algo existe. Veja ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              de: [{ term: "Il y a" }, " + Zeitdauer ist etwas anderes als ", { term: "il y a" }, " + Nomen, das ein Vorhandensein ausdrückt. Siehe ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              it: [{ term: "Il y a" }, " + durata è diverso da ", { term: "il y a" }, " + nome, che dice che qualcosa esiste. Vedi ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pl: [{ term: "Il y a" }, " + czas trwania różni się od ", { term: "il y a" }, " + rzeczownik, które oznacza istnienie. Zob. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              tr: [{ term: "Il y a" }, " + süre, bir şeyin var olduğunu söyleyen ", { term: "il y a" }, " + isim yapısından farklıdır. Bkz. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              id: [{ term: "Il y a" }, " + durasi berbeda dari ", { term: "il y a" }, " + kata benda yang menyatakan sesuatu ada. Lihat ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              vi: [{ term: "Il y a" }, " + khoảng thời gian khác với ", { term: "il y a" }, " + danh từ, cấu trúc nói một vật tồn tại. Xem ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
