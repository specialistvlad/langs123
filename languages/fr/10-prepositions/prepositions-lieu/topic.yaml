sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Une préposition de lieu se place devant un nom et dit où il se trouve."
              en: "A preposition of place stands before a noun and says where it is."
              uk: "Прийменник місця стоїть перед іменником і вказує, де той перебуває."
              es: "Una preposición de lugar va delante de un nombre e indica dónde está."
              pt: "Uma preposição de lugar vem antes de um substantivo e diz onde ele está."
              de: "Eine Ortspräposition steht vor einem Nomen und sagt, wo es sich befindet."
              it: "Una preposizione di luogo sta davanti a un nome e dice dove si trova."
              pl: "Przyimek miejsca stoi przed rzeczownikiem i mówi, gdzie on się znajduje."
              tr: "Yer edatı bir ismin önünde durur ve onun nerede olduğunu söyler."
              id: "Kata depan tempat berdiri sebelum kata benda dan menyatakan di mana benda itu berada."
              vi: "Giới từ chỉ nơi chốn đứng trước danh từ và cho biết vật ở đâu."
            ex: { examples: [["Le chat est ", { target: "sur" }, " la table."], ["Le sac est ", { target: "sous" }, " la chaise."]] }
            tr: { en: { examples: ["The cat is on the table.", "The bag is under the chair."] }, uk: { examples: ["Кіт на столі.", "Сумка під стільцем."] }, es: { examples: ["El gato está sobre la mesa.", "La bolsa está debajo de la silla."] }, pt: { examples: ["O gato está em cima da mesa.", "A bolsa está debaixo da cadeira."] }, de: { examples: ["Die Katze ist auf dem Tisch.", "Die Tasche ist unter dem Stuhl."] }, it: { examples: ["Il gatto è sul tavolo.", "La borsa è sotto la sedia."] }, pl: { examples: ["Kot jest na stole.", "Torba jest pod krzesłem."] }, tr: { examples: ["Kedi masanın üzerinde.", "Çanta sandalyenin altında."] }, id: { examples: ["Kucing itu ada di atas meja.", "Tas itu ada di bawah kursi."] }, vi: { examples: ["Con mèo ở trên bàn.", "Cái túi ở dưới ghế."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "La préposition ne change pas, ni au féminin ni au pluriel."
              en: "The preposition never changes, in the feminine or the plural."
              uk: "Прийменник не змінюється ні в жіночому роді, ні в множині."
              es: "La preposición no cambia, ni en femenino ni en plural."
              pt: "A preposição não muda, nem no feminino nem no plural."
              de: "Die Präposition ändert sich nie, weder im Femininum noch im Plural."
              it: "La preposizione non cambia, né al femminile né al plurale."
              pl: "Przyimek się nie zmienia, ani w rodzaju żeńskim, ani w liczbie mnogiej."
              tr: "Edat değişmez; dişil ya da çoğul isimlerle de aynı kalır."
              id: "Kata depan tidak berubah, baik untuk feminin maupun jamak."
              vi: "Giới từ không đổi, dù danh từ giống cái hay số nhiều."
            ex: { examples: [["Le chat est ", { target: "sur" }, " le lit."], ["Le chat est ", { target: "sur" }, " la table."], ["Les chats sont ", { target: "sur" }, " les chaises."]] }
            tr: { en: { examples: ["The cat is on the bed.", "The cat is on the table.", "The cats are on the chairs."] }, uk: { examples: ["Кіт на ліжку.", "Кіт на столі.", "Коти на стільцях."] }, es: { examples: ["El gato está sobre la cama.", "El gato está sobre la mesa.", "Los gatos están sobre las sillas."] }, pt: { examples: ["O gato está em cima da cama.", "O gato está em cima da mesa.", "Os gatos estão em cima das cadeiras."] }, de: { examples: ["Die Katze liegt auf dem Bett.", "Die Katze sitzt auf dem Tisch.", "Die Katzen sitzen auf den Stühlen."] }, it: { examples: ["Il gatto è sul letto.", "Il gatto è sul tavolo.", "I gatti sono sulle sedie."] }, pl: { examples: ["Kot jest na łóżku.", "Kot jest na stole.", "Koty są na krzesłach."] }, tr: { examples: ["Kedi yatağın üzerinde.", "Kedi masanın üzerinde.", "Kediler sandalyelerin üzerinde."] }, id: { examples: ["Kucing itu ada di atas tempat tidur.", "Kucing itu ada di atas meja.", "Kucing-kucing itu ada di atas kursi."] }, vi: { examples: ["Con mèo ở trên giường.", "Con mèo ở trên bàn.", "Những con mèo ở trên các cái ghế."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["La même préposition suit ", { term: "être" }, " (où on est) et ", { term: "aller" }, " (où on va)."]
              en: ["The same preposition follows ", { term: "être" }, " (where you are) and ", { term: "aller" }, " (where you go)."]
              uk: ["Той самий прийменник стоїть після ", { term: "être" }, " (де ти є) і після ", { term: "aller" }, " (куди йдеш)."]
              es: ["La misma preposición sigue a ", { term: "être" }, " (dónde estás) y a ", { term: "aller" }, " (adónde vas)."]
              pt: ["A mesma preposição acompanha ", { term: "être" }, " (onde se está) e ", { term: "aller" }, " (para onde se vai)."]
              de: ["Dieselbe Präposition steht nach ", { term: "être" }, " (wo man ist) und nach ", { term: "aller" }, " (wohin man geht)."]
              it: ["La stessa preposizione segue ", { term: "être" }, " (dove si è) e ", { term: "aller" }, " (dove si va)."]
              pl: ["Ten sam przyimek występuje po ", { term: "être" }, " (gdzie ktoś jest) i po ", { term: "aller" }, " (dokąd idzie)."]
              tr: ["Aynı edat hem ", { term: "être" }, " (nerede olduğun) hem ", { term: "aller" }, " (nereye gittiğin) ile kullanılır."]
              id: ["Kata depan yang sama mengikuti ", { term: "être" }, " (di mana kita berada) dan ", { term: "aller" }, " (ke mana kita pergi)."]
              vi: ["Cùng một giới từ đứng sau ", { term: "être" }, " (đang ở đâu) và ", { term: "aller" }, " (đi đến đâu)."]
            ex: { examples: [["Je suis ", { target: "à" }, " la gare."], ["Je vais ", { target: "à" }, " la gare."]] }
            tr: { en: { examples: ["I’m at the station.", "I’m going to the station."] }, uk: { examples: ["Я на вокзалі.", "Я йду на вокзал."] }, es: { examples: ["Estoy en la estación.", "Voy a la estación."] }, pt: { examples: ["Eu estou na estação.", "Eu vou à estação."] }, de: { examples: ["Ich bin am Bahnhof.", "Ich gehe zum Bahnhof."] }, it: { examples: ["Sono alla stazione.", "Vado alla stazione."] }, pl: { examples: ["Jestem na dworcu.", "Idę na dworzec."] }, tr: { examples: ["İstasyondayım.", "İstasyona gidiyorum."] }, id: { examples: ["Aku di stasiun.", "Aku pergi ke stasiun."] }, vi: { examples: ["Tôi ở nhà ga.", "Tôi đi đến nhà ga."] } }
          - type: "note"
            level: "A1"
            text:
              fr: [{ term: "à" }, " se contracte avec ", { term: "le" }, " et ", { term: "les" }, " : ", { term: "au" }, ", ", { term: "aux" }, ". Voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: [{ term: "à" }, " contracts with ", { term: "le" }, " and ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". See ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: [{ term: "à" }, " зливається з ", { term: "le" }, " і ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: [{ term: "à" }, " se contrae con ", { term: "le" }, " y ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Véase ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: [{ term: "à" }, " se contrai com ", { term: "le" }, " e ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: [{ term: "à" }, " verschmilzt mit ", { term: "le" }, " und ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: [{ term: "à" }, " si fonde con ", { term: "le" }, " e ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: [{ term: "à" }, " zlewa się z ", { term: "le" }, " i ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: [{ term: "à" }, ", ", { term: "le" }, " ve ", { term: "les" }, " ile kaynaşır: ", { term: "au" }, ", ", { term: "aux" }, ". Bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: [{ term: "à" }, " menyatu dengan ", { term: "le" }, " dan ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: [{ term: "à" }, " kết hợp với ", { term: "le" }, " và ", { term: "les" }, ": ", { term: "au" }, ", ", { term: "aux" }, ". Xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
            ex: { examples: [["Il est ", { target: "au" }, " café."], ["Elle est ", { target: "aux" }, " toilettes."]] }
            tr: { en: { examples: ["He’s at the café.", "She’s in the toilets."] }, uk: { examples: ["Він у кафе.", "Вона в туалеті."] }, es: { examples: ["Está en el café.", "Ella está en los servicios."] }, pt: { examples: ["Ele está no café.", "Ela está no banheiro."] }, de: { examples: ["Er ist im Café.", "Sie ist auf der Toilette."] }, it: { examples: ["È al bar.", "Lei è in bagno."] }, pl: { examples: ["Jest w kawiarni.", "Ona jest w toalecie."] }, tr: { examples: ["Kafede.", "O tuvalette."] }, id: { examples: ["Dia ada di kafe.", "Dia ada di toilet."] }, vi: { examples: ["Anh ấy ở quán cà phê.", "Cô ấy ở trong nhà vệ sinh."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les villes et les pays (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), voir ", { link: "Villes et pays", to: "fr.prepositions.villes-pays" }, "."]
              en: ["For cities and countries (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), see ", { link: "Cities and Countries", to: fr.prepositions.villes-pays }, "."]
              uk: ["Про міста й країни (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, ") див. ", { link: "Міста й країни", to: "fr.prepositions.villes-pays" }, "."]
              es: ["Para ciudades y países (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), véase ", { link: "Ciudades y países", to: "fr.prepositions.villes-pays" }, "."]
              pt: ["Para cidades e países (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), veja ", { link: "Cidades e países", to: "fr.prepositions.villes-pays" }, "."]
              de: ["Zu Städten und Ländern (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, ") siehe ", { link: "Städte und Länder", to: "fr.prepositions.villes-pays" }, "."]
              it: ["Per città e paesi (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), vedi ", { link: "Città e paesi", to: "fr.prepositions.villes-pays" }, "."]
              pl: ["O miastach i krajach (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, ") zob. ", { link: "Miasta i kraje", to: "fr.prepositions.villes-pays" }, "."]
              tr: ["Şehirler ve ülkeler (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, ") için bkz. ", { link: "Şehirler ve ülkeler", to: "fr.prepositions.villes-pays" }, "."]
              id: ["Untuk kota dan negara (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), lihat ", { link: "Kota dan negara", to: "fr.prepositions.villes-pays" }, "."]
              vi: ["Về thành phố và quốc gia (", { term: "à Paris" }, ", ", { term: "en France" }, ", ", { term: "au Canada" }, "), xem ", { link: "Thành phố và quốc gia", to: "fr.prepositions.villes-pays" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour dire qu’une chose existe quelque part, voir ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              en: ["To say that something exists somewhere, see ", { link: "There Is: il y a", to: fr.etre-avoir.il-y-a }, "."]
              uk: ["Про те, що щось десь існує, див. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              es: ["Para decir que algo existe en algún sitio, véase ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pt: ["Para dizer que algo existe em algum lugar, veja ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              de: ["Um zu sagen, dass etwas irgendwo vorhanden ist, siehe ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              it: ["Per dire che qualcosa esiste da qualche parte, vedi ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pl: ["Aby powiedzieć, że coś gdzieś istnieje, zob. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              tr: ["Bir şeyin bir yerde var olduğunu söylemek için bkz. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              id: ["Untuk menyatakan bahwa sesuatu ada di suatu tempat, lihat ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              vi: ["Để nói một vật tồn tại ở đâu đó, xem ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour remplacer ", { term: "à" }, " ou ", { term: "dans" }, " + lieu par un pronom, voir ", { link: "Y et en", to: fr.pronoms.y-en }, "."]
              en: ["To replace ", { term: "à" }, " or ", { term: "dans" }, " + place with a pronoun, see ", { link: "The Pronouns y and en", to: fr.pronoms.y-en }, "."]
              uk: ["Щоб замінити ", { term: "à" }, " або ", { term: "dans" }, " + місце займенником, див. ", { link: "Y та en", to: fr.pronoms.y-en }, "."]
              es: ["Para sustituir ", { term: "à" }, " o ", { term: "dans" }, " + lugar por un pronombre, véase ", { link: "Y y en", to: fr.pronoms.y-en }, "."]
              pt: ["Para substituir ", { term: "à" }, " ou ", { term: "dans" }, " + lugar por um pronome, veja ", { link: "Y e en", to: fr.pronoms.y-en }, "."]
              de: ["Um ", { term: "à" }, " oder ", { term: "dans" }, " + Ort durch ein Pronomen zu ersetzen, siehe ", { link: "Y und en", to: fr.pronoms.y-en }, "."]
              it: ["Per sostituire ", { term: "à" }, " o ", { term: "dans" }, " + luogo con un pronome, vedi ", { link: "Y e en", to: fr.pronoms.y-en }, "."]
              pl: ["Aby zastąpić ", { term: "à" }, " lub ", { term: "dans" }, " + miejsce zaimkiem, zob. ", { link: "Y i en", to: fr.pronoms.y-en }, "."]
              tr: [{ term: "à" }, " ya da ", { term: "dans" }, " + yer ifadesini bir zamirle değiştirmek için bkz. ", { link: "Y ve en", to: fr.pronoms.y-en }, "."]
              id: ["Untuk mengganti ", { term: "à" }, " atau ", { term: "dans" }, " + tempat dengan pronomina, lihat ", { link: "Y dan en", to: fr.pronoms.y-en }, "."]
              vi: ["Để thay ", { term: "à" }, " hoặc ", { term: "dans" }, " + nơi chốn bằng đại từ, xem ", { link: "Y và en", to: fr.pronoms.y-en }, "."]
