          - { level: "A1", features: { person: 3, number: "pl" }, person: { alternatives: ["ils", "elles"] }, v0: { target: "peuvent" }, v1: { target: "veulent" }, v2: { target: "doivent" } }
      - type: "list"
        items:
          - type: "rule"
