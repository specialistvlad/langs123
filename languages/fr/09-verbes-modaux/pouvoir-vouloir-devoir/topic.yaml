              uk: ["В однині ", { term: "pouvoir" }, " і ", { term: "vouloir" }, " дають ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " — ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              es: ["En singular, ", { term: "pouvoir" }, " y ", { term: "vouloir" }, " hacen ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " hace ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              pt: ["No singular, ", { term: "pouvoir" }, " e ", { term: "vouloir" }, " fazem ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " faz ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              de: ["Im Singular bilden ", { term: "pouvoir" }, " und ", { term: "vouloir" }, " ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " bildet ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              it: ["Al singolare, ", { term: "pouvoir" }, " e ", { term: "vouloir" }, " fanno ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " fa ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              pl: ["W liczbie pojedynczej ", { term: "pouvoir" }, " i ", { term: "vouloir" }, " mają ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " ma ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
              tr: ["Tekilde ", { term: "pouvoir" }, " ve ", { term: "vouloir" }, " ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, " alır."]
              id: ["Pada tunggal, ", { term: "pouvoir" }, " dan ", { term: "vouloir" }, " menjadi ", { term: "-x" }, ", ", { term: "-x" }, ", ", { term: "-t" }, "; ", { term: "devoir" }, " menjadi ", { term: "-s" }, ", ", { term: "-s" }, ", ", { term: "-t" }, "."]
