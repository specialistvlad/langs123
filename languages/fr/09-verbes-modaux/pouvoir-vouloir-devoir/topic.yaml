sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " et ", { term: "savoir" }, " sont suivis d’un infinitif, sans ", { term: "à" }, " ni ", { term: "de" }, "."]
              en: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " and ", { term: "savoir" }, " are followed by an infinitive, with no ", { term: "à" }, " or ", { term: "de" }, "."]
              uk: ["Після ", { term: "pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " і ", { term: "savoir" }, " стоїть інфінітив, без ", { term: "à" }, " чи ", { term: "de" }, "."]
              es: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " y ", { term: "savoir" }, " van seguidos de un infinitivo, sin ", { term: "à" }, " ni ", { term: "de" }, "."]
              pt: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " e ", { term: "savoir" }, " são seguidos de um infinitivo, sem ", { term: "à" }, " nem ", { term: "de" }, "."]
              de: ["Nach ", { term: "pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " und ", { term: "savoir" }, " steht ein Infinitiv, ohne ", { term: "à" }, " oder ", { term: "de" }, "."]
              it: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " e ", { term: "savoir" }, " sono seguiti da un infinito, senza ", { term: "à" }, " né ", { term: "de" }, "."]
              pl: ["Po ", { term: "pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " i ", { term: "savoir" }, " następuje bezokolicznik, bez ", { term: "à" }, " ani ", { term: "de" }, "."]
              tr: [{ term: "Pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " ve ", { term: "savoir" }, " fiillerinden sonra ", { term: "à" }, " ya da ", { term: "de" }, " olmadan mastar gelir."]
              id: ["Setelah ", { term: "pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, ", dan ", { term: "savoir" }, " datang infinitif, tanpa ", { term: "à" }, " atau ", { term: "de" }, "."]
              vi: ["Sau ", { term: "pouvoir" }, ", ", { term: "vouloir" }, ", ", { term: "devoir" }, " và ", { term: "savoir" }, " là động từ nguyên mẫu, không có ", { term: "à" }, " hay ", { term: "de" }, "."]
            ex: { examples: [["Je ", { target: "peux" }, " venir à huit heures."], ["Tu ", { target: "veux" }, " manger ?"]] }
            tr: { en: { examples: ["I can come at eight.", "Do you want to eat?"] }, uk: { examples: ["Я можу прийти о восьмій.", "Ти хочеш їсти?"] }, es: { examples: ["Puedo venir a las ocho.", "¿Quieres comer?"] }, pt: { examples: ["Eu posso vir às oito.", "Você quer comer?"] }, de: { examples: ["Ich kann um acht Uhr kommen.", "Willst du essen?"] }, it: { examples: ["Posso venire alle otto.", "Vuoi mangiare?"] }, pl: { examples: ["Mogę przyjść o ósmej.", "Chcesz jeść?"] }, tr: { examples: ["Saat sekizde gelebilirim.", "Yemek yemek ister misin?"] }, id: { examples: ["Aku bisa datang pukul delapan.", "Apakah kamu mau makan?"] }, vi: { examples: ["Tôi có thể đến lúc tám giờ.", "Bạn muốn ăn không?"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le verbe modal prend la personne du sujet ; l’infinitif ne change pas."
              en: "The modal verb takes the person of the subject; the infinitive does not change."
              uk: "Модальне дієслово бере особу підмета; інфінітив не змінюється."
              es: "El verbo modal toma la persona del sujeto; el infinitivo no cambia."
              pt: "O verbo modal toma a pessoa do sujeito; o infinitivo não muda."
              de: "Das Modalverb richtet sich nach der Person des Subjekts; der Infinitiv bleibt gleich."
              it: "Il verbo modale prende la persona del soggetto; l’infinito non cambia."
              pl: "Czasownik modalny przyjmuje osobę podmiotu; bezokolicznik się nie zmienia."
              tr: "Kip fiili öznenin kişisini alır; mastar değişmez."
              id: "Kata kerja modal mengikuti persona subjek; infinitif tidak berubah."
              vi: "Động từ khuyết thiếu theo ngôi của chủ ngữ; động từ nguyên mẫu không đổi."
            ex: { examples: [["Nous ", { target: "devons" }, " partir."], ["Ils ", { target: "veulent" }, " partir."]] }
            tr: { en: { examples: ["We have to leave.", "They want to leave."] }, uk: { examples: ["Нам треба йти.", "Вони хочуть піти."] }, es: { examples: ["Debemos irnos.", "Quieren irse."] }, pt: { examples: ["Nós devemos ir embora.", "Eles querem ir embora."] }, de: { examples: ["Wir müssen gehen.", "Sie wollen gehen."] }, it: { examples: ["Dobbiamo partire.", "Vogliono partire."] }, pl: { examples: ["Musimy iść.", "Oni chcą iść."] }, tr: { examples: ["Gitmemiz gerekiyor.", "Onlar gitmek istiyor."] }, id: { examples: ["Kami harus pergi.", "Mereka ingin pergi."] }, vi: { examples: ["Chúng tôi phải đi.", "Họ muốn đi."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour la conjugaison de ", { term: "savoir" }, ", voir ", { link: "Le présent : les verbes irréguliers", to: "fr.present.present-irreguliers" }, "."]
              en: ["For the conjugation of ", { term: "savoir" }, ", see ", { link: "Present Tense: Irregular Verbs", to: fr.present.present-irreguliers }, "."]
              uk: ["Про відмінювання ", { term: "savoir" }, " — див. ", { link: "Теперішній час: неправильні дієслова", to: "fr.present.present-irreguliers" }, "."]
              es: ["Para la conjugación de ", { term: "savoir" }, ", ver ", { link: "El presente: los verbos irregulares", to: "fr.present.present-irreguliers" }, "."]
              pt: ["Para a conjugação de ", { term: "savoir" }, ", veja ", { link: "O presente: os verbos irregulares", to: "fr.present.present-irreguliers" }, "."]
              de: ["Zur Konjugation von ", { term: "savoir" }, " siehe ", { link: "Das Präsens: unregelmäßige Verben", to: "fr.present.present-irreguliers" }, "."]
              it: ["Per la coniugazione di ", { term: "savoir" }, ", vedi ", { link: "Il presente: i verbi irregolari", to: "fr.present.present-irreguliers" }, "."]
              pl: ["O odmianie ", { term: "savoir" }, " — zob. ", { link: "Czas teraźniejszy: czasowniki nieregularne", to: "fr.present.present-irreguliers" }, "."]
              tr: [{ term: "savoir" }, " fiilinin çekimi için bkz. ", { link: "Şimdiki zaman: düzensiz fiiller", to: "fr.present.present-irreguliers" }, "."]
              id: ["Untuk konjugasi ", { term: "savoir" }, ", lihat ", { link: "Presens: kata kerja tidak beraturan", to: "fr.present.present-irreguliers" }, "."]
              vi: ["Về cách chia ", { term: "savoir" }, ", xem ", { link: "Thì hiện tại: động từ bất quy tắc", to: "fr.present.present-irreguliers" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "aller" }, " + infinitif, voir ", { link: "Le futur proche : je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              en: ["For ", { term: "aller" }, " + infinitive, see ", { link: "Near Future: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              uk: ["Про ", { term: "aller" }, " + інфінітив — див. ", { link: "Близьке майбутнє: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              es: ["Para ", { term: "aller" }, " + infinitivo, ver ", { link: "El futuro próximo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              pt: ["Para ", { term: "aller" }, " + infinitivo, veja ", { link: "O futuro próximo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              de: ["Zu ", { term: "aller" }, " + Infinitiv siehe ", { link: "Die Nahzukunft: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              it: ["Per ", { term: "aller" }, " + infinito, vedi ", { link: "Il futuro prossimo: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              pl: ["O ", { term: "aller" }, " + bezokolicznik — zob. ", { link: "Bliska przyszłość: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              tr: [{ term: "aller" }, " + mastar için bkz. ", { link: "Yakın gelecek: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              id: ["Untuk ", { term: "aller" }, " + infinitif, lihat ", { link: "Masa depan dekat: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
              vi: ["Về ", { term: "aller" }, " + động từ nguyên mẫu, xem ", { link: "Tương lai gần: je vais manger", to: fr.futur-imperatif.futur-proche }, "."]
  - title:
      fr: "Forme : le présent"
      en: "Form: the present"
