sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Ces verbes changent de radical : on apprend leurs formes par cœur, en groupes de verbes qui se ressemblent."
              en: "These verbs change their stem: learn their forms by heart, in groups of verbs that look alike."
              uk: "Ці дієслова змінюють основу: їхні форми вчать напам’ять, групами схожих дієслів."
              es: "Estos verbos cambian de raíz: sus formas se aprenden de memoria, en grupos de verbos parecidos."
              pt: "Estes verbos mudam de radical: suas formas se aprendem de cor, em grupos de verbos parecidos."
              de: "Diese Verben wechseln den Stamm: Man lernt ihre Formen auswendig, in Gruppen ähnlicher Verben."
              it: "Questi verbi cambiano radice: le loro forme si imparano a memoria, in gruppi di verbi simili."
              pl: "Te czasowniki zmieniają temat: ich formy uczy się na pamięć, grupami podobnych czasowników."
              tr: "Bu fiillerde kök değişir: biçimleri ezbere, birbirine benzeyen gruplar hâlinde öğrenilir."
              id: "Kata kerja ini mengubah akarnya: bentuknya dihafalkan, dalam kelompok kata kerja yang mirip."
              vi: "Những động từ này đổi gốc từ: cần học thuộc các dạng, theo từng nhóm động từ giống nhau."
            ex: { examples: [["Je ", { target: "vais" }, " au marché."], ["Ils ", { target: "font" }, " du sport."]] }
            tr: { en: { examples: ["I go to the market.", "They play sport."] }, uk: { examples: ["Я йду на ринок.", "Вони займаються спортом."] }, es: { examples: ["Voy al mercado.", "Hacen deporte."] }, pt: { examples: ["Eu vou ao mercado.", "Eles fazem esporte."] }, de: { examples: ["Ich gehe auf den Markt.", "Sie treiben Sport."] }, it: { examples: ["Vado al mercato.", "Fanno sport."] }, pl: { examples: ["Idę na targ.", "Oni uprawiają sport."] }, tr: { examples: ["Pazara gidiyorum.", "Onlar spor yapıyor."] }, id: { examples: ["Aku pergi ke pasar.", "Mereka berolahraga."] }, vi: { examples: ["Tôi đi chợ.", "Họ chơi thể thao."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Presque toujours, ", { term: "nous" }, " prend ", { term: "-ons" }, ", ", { term: "vous" }, " prend ", { term: "-ez" }, " et ", { term: "ils" }, " prend ", { term: "-ent" }, "."]
              en: ["Almost always, ", { term: "nous" }, " takes ", { term: "-ons" }, ", ", { term: "vous" }, " takes ", { term: "-ez" }, " and ", { term: "ils" }, " takes ", { term: "-ent" }, "."]
              uk: ["Майже завжди ", { term: "nous" }, " бере ", { term: "-ons" }, ", ", { term: "vous" }, " — ", { term: "-ez" }, ", а ", { term: "ils" }, " — ", { term: "-ent" }, "."]
              es: ["Casi siempre, ", { term: "nous" }, " lleva ", { term: "-ons" }, ", ", { term: "vous" }, " lleva ", { term: "-ez" }, " y ", { term: "ils" }, " lleva ", { term: "-ent" }, "."]
              pt: ["Quase sempre, ", { term: "nous" }, " leva ", { term: "-ons" }, ", ", { term: "vous" }, " leva ", { term: "-ez" }, " e ", { term: "ils" }, " leva ", { term: "-ent" }, "."]
              de: ["Fast immer hat ", { term: "nous" }, " ", { term: "-ons" }, ", ", { term: "vous" }, " ", { term: "-ez" }, " und ", { term: "ils" }, " ", { term: "-ent" }, "."]
              it: ["Quasi sempre, ", { term: "nous" }, " prende ", { term: "-ons" }, ", ", { term: "vous" }, " prende ", { term: "-ez" }, " e ", { term: "ils" }, " prende ", { term: "-ent" }, "."]
