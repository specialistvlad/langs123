      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              fr: "Avec une partie du corps, on emploie l’article, pas le possessif : le pronom dit déjà à qui elle est."
              en: "With a part of the body, French uses the article, not the possessive: the pronoun already says whose it is."
              uk: "З частиною тіла вживають артикль, а не присвійний займенник: займенник уже вказує, чия вона."
              es: "Con una parte del cuerpo se usa el artículo, no el posesivo: el pronombre ya dice de quién es."
              pt: "Com uma parte do corpo usa-se o artigo, não o possessivo: o pronome já diz de quem é."
              de: "Bei einem Körperteil steht der Artikel, nicht das Possessiv: Das Pronomen sagt schon, wem es gehört."
              it: "Con una parte del corpo si usa l’articolo, non il possessivo: il pronome dice già di chi è."
              pl: "Przy części ciała używa się przedimka, nie zaimka dzierżawczego: zaimek już mówi, czyja ona jest."
              tr: "Vücut bölümünde iyelik sözcüğü değil tanımlık kullanılır: zamir zaten kimin olduğunu söyler."
              id: "Dengan bagian tubuh dipakai artikel, bukan kata milik: kata ganti sudah menunjukkan milik siapa."
              vi: "Với bộ phận cơ thể, dùng mạo từ chứ không dùng từ sở hữu: đại từ đã cho biết của ai."
            ex: { examples: [["Je me lave ", { target: "les" }, " mains."], ["Elle se brosse ", { target: "les" }, " dents."]] }
            tr: { en: { examples: ["I wash my hands.", "She brushes her teeth."] }, uk: { examples: ["Я мию руки.", "Вона чистить зуби."] }, es: { examples: ["Me lavo las manos.", "Ella se cepilla los dientes."] }, pt: { examples: ["Eu lavo as mãos.", "Ela escova os dentes."] }, de: { examples: ["Ich wasche mir die Hände.", "Sie putzt sich die Zähne."] }, it: { examples: ["Mi lavo le mani.", "Lei si lava i denti."] }, pl: { examples: ["Myję ręce.", "Ona myje zęby."] }, tr: { examples: ["Ellerimi yıkıyorum.", "O dişlerini fırçalıyor."] }, id: { examples: ["Aku mencuci tangan.", "Dia menyikat gigi."] }, vi: { examples: ["Tôi rửa tay.", "Cô ấy đánh răng."] } }
