summary:
  lead:
    fr: ["Un verbe pronominal se conjugue avec un pronom qui reprend le sujet : ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    en: ["A pronominal verb is conjugated with a pronoun that repeats the subject: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    uk: ["Зворотне дієслово відмінюється із займенником, що повторює підмет: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    es: ["Un verbo pronominal se conjuga con un pronombre que repite el sujeto: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    pt: ["Um verbo pronominal se conjuga com um pronome que repete o sujeito: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    de: ["Ein reflexives Verb wird mit einem Pronomen konjugiert, das das Subjekt wieder aufnimmt: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    it: ["Un verbo pronominale si coniuga con un pronome che riprende il soggetto: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    pl: ["Czasownik zwrotny odmienia się z zaimkiem, który powtarza podmiot: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    tr: ["Dönüşlü fiil, özneyi yineleyen bir zamirle çekimlenir: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    id: ["Kata kerja refleksif dikonjugasikan dengan kata ganti yang mengulang subjek: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
    vi: ["Động từ phản thân chia cùng một đại từ nhắc lại chủ ngữ: ", { term: "je me lève" }, ", ", { term: "tu t’appelles" }, ", ", { term: "ils se parlent" }, "."]
  rule:
    fr: "Le pronom suit le sujet et se place juste avant le verbe :"
    en: "The pronoun follows the subject and stands right before the verb:"
    uk: "Займенник іде за підметом і стоїть просто перед дієсловом:"
    es: "El pronombre sigue al sujeto y va justo antes del verbo:"
    pt: "O pronome vem depois do sujeito e fica logo antes do verbo:"
    de: "Das Pronomen folgt dem Subjekt und steht direkt vor dem Verb:"
    it: "Il pronome segue il soggetto e sta subito prima del verbo:"
    pl: "Zaimek stoi po podmiocie, tuż przed czasownikiem:"
    tr: "Zamir özneden sonra gelir ve doğrudan fiilin önünde durur:"
    id: "Kata ganti mengikuti subjek dan berdiri tepat sebelum kata kerja:"
    vi: "Đại từ đứng sau chủ ngữ và ngay trước động từ:"
