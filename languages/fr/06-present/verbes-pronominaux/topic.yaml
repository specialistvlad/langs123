          point: { fr: "Réciproque", en: "Reciprocal", uk: "Взаємне", es: "Recíproco", pt: "Recíproco", de: "Reziprok", it: "Reciproco", pl: "Wzajemne", tr: "Karşılıklı", id: "Resiprokal", vi: "Tương hỗ" }
          rule:
            fr: ["avec un sujet pluriel, ", { term: "se" }, " veut dire « l’un l’autre »"]
            en: ["with a plural subject, ", { term: "se" }, " means “each other”"]
            uk: ["з множинним підметом ", { term: "se" }, " означає «один одного»"]
            es: ["con sujeto plural, ", { term: "se" }, " significa «el uno al otro»"]
            pt: ["com sujeito plural, ", { term: "se" }, " quer dizer «um ao outro»"]
            de: ["mit Subjekt im Plural bedeutet ", { term: "se" }, " „einander“"]
            it: ["con un soggetto plurale, ", { term: "se" }, " significa «l’un l’altro»"]
            pl: ["przy podmiocie w liczbie mnogiej ", { term: "se" }, " znaczy „siebie nawzajem”"]
            tr: ["çoğul öznede ", { term: "se" }, " “birbirini” anlamına gelir"]
            id: ["dengan subjek jamak, ", { term: "se" }, " berarti “satu sama lain”"]
            vi: ["với chủ ngữ số nhiều, ", { term: "se" }, " có nghĩa là “nhau”"]
          ex: ["Nous ", { target: "nous" }, " voyons le lundi."]
          tr: { en: "We see each other on Mondays.", uk: "Ми бачимося по понеділках.", es: "Nos vemos los lunes.", pt: "Nós nos vemos às segundas.", de: "Wir sehen uns montags.", it: "Ci vediamo il lunedì.", pl: "Widzimy się w poniedziałki.", tr: "Pazartesi günleri görüşüyoruz.", id: "Kami bertemu pada hari Senin.", vi: "Chúng tôi gặp nhau vào thứ Hai." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: ["ne pas oublier le pronom : ", { term: "je me lève" }]
            en: ["do not forget the pronoun: ", { term: "je me lève" }]
            uk: ["не забувайте про займенник: ", { term: "je me lève" }]
            es: ["no olvides el pronombre: ", { term: "je me lève" }]
            pt: ["não esqueça o pronome: ", { term: "je me lève" }]
            de: ["das Pronomen nicht vergessen: ", { term: "je me lève" }]
            it: ["non dimenticare il pronome: ", { term: "je me lève" }]
            pl: ["nie pomijaj zaimka: ", { term: "je me lève" }]
            tr: ["zamiri unutma: ", { term: "je me lève" }]
            id: ["jangan lupa kata ganti: ", { term: "je me lève" }]
            vi: ["đừng quên đại từ: ", { term: "je me lève" }]
          ex: ["Je ", { target: "me" }, " lève à sept heures."]
          tr: { en: "I get up at seven.", uk: "Я встаю о сьомій.", es: "Me levanto a las siete.", pt: "Eu me levanto às sete.", de: "Ich stehe um sieben Uhr auf.", it: "Mi alzo alle sette.", pl: "Wstaję o siódmej.", tr: "Saat yedide kalkarım.", id: "Aku bangun pukul tujuh.", vi: "Tôi dậy lúc bảy giờ." }
        - level: "A2"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: "une partie du corps prend l’article, pas le possessif"
            en: "a part of the body takes the article, not the possessive"
            uk: "частина тіла бере артикль, а не присвійний займенник"
            es: "una parte del cuerpo lleva artículo, no posesivo"
            pt: "uma parte do corpo leva artigo, não possessivo"
            de: "ein Körperteil steht mit Artikel, nicht mit Possessiv"
            it: "una parte del corpo vuole l’articolo, non il possessivo"
            pl: "część ciała ma przedimek, a nie zaimek dzierżawczy"
            tr: "vücut bölümü tanımlıkla gelir, iyelik sözcüğüyle değil"
            id: "bagian tubuh memakai artikel, bukan kata milik"
            vi: "bộ phận cơ thể đi với mạo từ, không dùng từ sở hữu"
          ex: ["Je me lave ", { target: "les" }, " mains."]
          tr: { en: "I wash my hands.", uk: "Я мию руки.", es: "Me lavo las manos.", pt: "Eu lavo as mãos.", de: "Ich wasche mir die Hände.", it: "Mi lavo le mani.", pl: "Myję ręce.", tr: "Ellerimi yıkıyorum.", id: "Aku mencuci tangan.", vi: "Tôi rửa tay." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["À l’infinitif, un verbe pronominal commence par ", { term: "se" }, " ou ", { term: "s’" }, " : ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              en: ["In the infinitive, a pronominal verb starts with ", { term: "se" }, " or ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              uk: ["В інфінітиві зворотне дієслово починається з ", { term: "se" }, " або ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              es: ["En infinitivo, un verbo pronominal empieza por ", { term: "se" }, " o ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              pt: ["No infinitivo, um verbo pronominal começa por ", { term: "se" }, " ou ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              de: ["Im Infinitiv beginnt ein reflexives Verb mit ", { term: "se" }, " oder ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              it: ["All’infinito, un verbo pronominale comincia con ", { term: "se" }, " o ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              pl: ["W bezokoliczniku czasownik zwrotny zaczyna się od ", { term: "se" }, " lub ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              tr: ["Mastarda dönüşlü fiil ", { term: "se" }, " ya da ", { term: "s’" }, " ile başlar: ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              id: ["Dalam bentuk infinitif, kata kerja refleksif diawali ", { term: "se" }, " atau ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
              vi: ["Ở dạng nguyên mẫu, động từ phản thân bắt đầu bằng ", { term: "se" }, " hoặc ", { term: "s’" }, ": ", { term: "se lever" }, ", ", { term: "s’appeler" }, "."]
            ex: { examples: [["Je ", { target: "me lève" }, " à sept heures."], ["Je ", { target: "m’appelle" }, " Léa."]] }
            tr: { en: { examples: ["I get up at seven.", "My name is Léa."] }, uk: { examples: ["Я встаю о сьомій.", "Мене звати Леа."] }, es: { examples: ["Me levanto a las siete.", "Me llamo Léa."] }, pt: { examples: ["Eu me levanto às sete.", "Eu me chamo Léa."] }, de: { examples: ["Ich stehe um sieben Uhr auf.", "Ich heiße Léa."] }, it: { examples: ["Mi alzo alle sette.", "Mi chiamo Léa."] }, pl: { examples: ["Wstaję o siódmej.", "Nazywam się Léa."] }, tr: { examples: ["Saat yedide kalkarım.", "Adım Léa."] }, id: { examples: ["Aku bangun pukul tujuh.", "Namaku Léa."] }, vi: { examples: ["Tôi dậy lúc bảy giờ.", "Tôi tên là Léa."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le pronom change avec le sujet et se place avant le verbe conjugué."
              en: "The pronoun changes with the subject and stands before the conjugated verb."
              uk: "Займенник змінюється разом з підметом і стоїть перед дієсловом у особовій формі."
              es: "El pronombre cambia con el sujeto y va antes del verbo conjugado."
              pt: "O pronome muda com o sujeito e fica antes do verbo conjugado."
              de: "Das Pronomen wechselt mit dem Subjekt und steht vor dem konjugierten Verb."
              it: "Il pronome cambia con il soggetto e sta prima del verbo coniugato."
              pl: "Zaimek zmienia się wraz z podmiotem i stoi przed czasownikiem w formie osobowej."
              tr: "Zamir özneyle birlikte değişir ve çekimli fiilin önünde durur."
              id: "Kata ganti berubah sesuai subjek dan berdiri sebelum kata kerja yang dikonjugasikan."
              vi: "Đại từ thay đổi theo chủ ngữ và đứng trước động từ đã chia."
            ex: { examples: [["Tu ", { target: "te" }, " lèves tôt."], ["Nous ", { target: "nous" }, " couchons tard."]] }
            tr: { en: { examples: ["You get up early.", "We go to bed late."] }, uk: { examples: ["Ти рано встаєш.", "Ми лягаємо пізно."] }, es: { examples: ["Te levantas temprano.", "Nos acostamos tarde."] }, pt: { examples: ["Você se levanta cedo.", "Nós nos deitamos tarde."] }, de: { examples: ["Du stehst früh auf.", "Wir gehen spät schlafen."] }, it: { examples: ["Ti alzi presto.", "Ci corichiamo tardi."] }, pl: { examples: ["Wstajesz wcześnie.", "Kładziemy się późno spać."] }, tr: { examples: ["Erken kalkarsın.", "Geç yatıyoruz."] }, id: { examples: ["Kamu bangun pagi-pagi.", "Kami tidur larut malam."] }, vi: { examples: ["Bạn dậy sớm.", "Chúng tôi đi ngủ muộn."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["À l’impératif affirmatif, le pronom suit le verbe : ", { term: "lève-toi" }, ". Voir ", { link: "L’impératif : parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              en: ["In the affirmative imperative, the pronoun follows the verb: ", { term: "lève-toi" }, ". See ", { link: "Imperative: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              uk: ["У ствердному наказовому способі займенник іде після дієслова: ", { term: "lève-toi" }, ". Див. ", { link: "Наказовий спосіб: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              es: ["En el imperativo afirmativo, el pronombre sigue al verbo: ", { term: "lève-toi" }, ". Ver ", { link: "El imperativo: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              pt: ["No imperativo afirmativo, o pronome vem depois do verbo: ", { term: "lève-toi" }, ". Veja ", { link: "O imperativo: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              de: ["Im bejahten Imperativ folgt das Pronomen dem Verb: ", { term: "lève-toi" }, ". Siehe ", { link: "Der Imperativ: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              it: ["All’imperativo affermativo, il pronome segue il verbo: ", { term: "lève-toi" }, ". Vedi ", { link: "L’imperativo: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              pl: ["W trybie rozkazującym twierdzącym zaimek stoi po czasowniku: ", { term: "lève-toi" }, ". Zob. ", { link: "Tryb rozkazujący: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              tr: ["Olumlu emirde zamir fiilin ardından gelir: ", { term: "lève-toi" }, ". Bkz. ", { link: "Emir kipi: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              id: ["Pada imperatif positif, kata ganti mengikuti kata kerja: ", { term: "lève-toi" }, ". Lihat ", { link: "Imperatif: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
              vi: ["Ở mệnh lệnh khẳng định, đại từ đứng sau động từ: ", { term: "lève-toi" }, ". Xem ", { link: "Thể mệnh lệnh: parle, parlons, parlez", to: fr.futur-imperatif.imperatif }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Au passé composé, les verbes pronominaux prennent ", { term: "être" }, " : voir ", { link: "Le passé composé : j’ai mangé", to: fr.passe.passe-compose }, "."]
              en: ["In the passé composé, pronominal verbs take ", { term: "être" }, ": see ", { link: "Passé Composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              uk: ["У passé composé зворотні дієслова беруть ", { term: "être" }, ": див. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              es: ["En el passé composé, los verbos pronominales llevan ", { term: "être" }, ": ver ", { link: "El passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pt: ["No passé composé, os verbos pronominais levam ", { term: "être" }, ": veja ", { link: "O passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              de: ["Im passé composé stehen reflexive Verben mit ", { term: "être" }, ": siehe ", { link: "Das Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              it: ["Al passé composé, i verbi pronominali vogliono ", { term: "être" }, ": vedi ", { link: "Il passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pl: ["W passé composé czasowniki zwrotne łączą się z ", { term: "être" }, ": zob. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              tr: ["Passé composé’de dönüşlü fiiller ", { term: "être" }, " alır: bkz. ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              id: ["Dalam passé composé, kata kerja refleksif memakai ", { term: "être" }, ": lihat ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              vi: ["Ở passé composé, động từ phản thân dùng ", { term: "être" }, ": xem ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
  - title:
      fr: "Forme : le présent"
      en: "Form: the present"
      uk: "Форма: теперішній час"
      es: "Forma: el presente"
      pt: "Forma: o presente"
      de: "Form: das Präsens"
      it: "Forma: il presente"
      pl: "Forma: czas teraźniejszy"
      tr: "Biçim: şimdiki zaman"
      id: "Bentuk: presens"
      vi: "Dạng: thì hiện tại"
    role: "form"
    features: { tense: "prs" }
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: "v0", label: "se lever" }
          - { key: "v1", label: "s’appeler" }
          - { key: "v2", label: "s’habiller" }
        rows:
          - { level: "A1", features: { person: 1, number: "sg" }, person: "je", v0: [{ target: "me" }, " lève"], v1: [{ target: "m’" }, "appelle"], v2: [{ target: "m’" }, "habille"] }
          - { level: "A1", features: { person: 2, number: "sg", politeness: "infm" }, person: "tu", v0: [{ target: "te" }, " lèves"], v1: [{ target: "t’" }, "appelles"], v2: [{ target: "t’" }, "habilles"] }
          - level: "A1"
            features: { person: 3, number: "sg" }
            person: { alternatives: ["il", "elle", "on"] }
            v0: [{ target: "se" }, " lève"]
            v1: [{ target: "s’" }, "appelle"]
            v2: [{ target: "s’" }, "habille"]
          - { level: "A1", features: { person: 1, number: "pl" }, person: "nous", v0: [{ target: "nous" }, " levons"], v1: [{ target: "nous" }, " appelons"], v2: [{ target: "nous" }, " habillons"] }
          - level: "A1"
            features: [{ person: 2, number: "pl" }, { person: 2, number: "sg", politeness: "form" }]
            person: "vous"
            v0: [{ target: "vous" }, " levez"]
            v1: [{ target: "vous" }, " appelez"]
            v2: [{ target: "vous" }, " habillez"]
          - level: "A1"
            features: { person: 3, number: "pl" }
            person: { alternatives: ["ils", "elles"] }
            v0: [{ target: "se" }, " lèvent"]
            v1: [{ target: "s’" }, "appellent"]
            v2: [{ target: "s’" }, "habillent"]
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le pronom reprend le sujet : ", { term: "me" }, " avec ", { term: "je" }, ", ", { term: "te" }, " avec ", { term: "tu" }, ", ", { term: "se" }, " avec ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", puis ", { term: "nous" }, " et ", { term: "vous" }, "."]
              en: ["The pronoun repeats the subject: ", { term: "me" }, " with ", { term: "je" }, ", ", { term: "te" }, " with ", { term: "tu" }, ", ", { term: "se" }, " with ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", then ", { term: "nous" }, " and ", { term: "vous" }, "."]
              uk: ["Займенник повторює підмет: ", { term: "me" }, " з ", { term: "je" }, ", ", { term: "te" }, " з ", { term: "tu" }, ", ", { term: "se" }, " з ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", далі ", { term: "nous" }, " і ", { term: "vous" }, "."]
              es: ["El pronombre repite el sujeto: ", { term: "me" }, " con ", { term: "je" }, ", ", { term: "te" }, " con ", { term: "tu" }, ", ", { term: "se" }, " con ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", y ", { term: "nous" }, " y ", { term: "vous" }, "."]
              pt: ["O pronome repete o sujeito: ", { term: "me" }, " com ", { term: "je" }, ", ", { term: "te" }, " com ", { term: "tu" }, ", ", { term: "se" }, " com ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", e ", { term: "nous" }, " e ", { term: "vous" }, "."]
              de: ["Das Pronomen nimmt das Subjekt auf: ", { term: "me" }, " bei ", { term: "je" }, ", ", { term: "te" }, " bei ", { term: "tu" }, ", ", { term: "se" }, " bei ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", dazu ", { term: "nous" }, " und ", { term: "vous" }, "."]
              it: ["Il pronome riprende il soggetto: ", { term: "me" }, " con ", { term: "je" }, ", ", { term: "te" }, " con ", { term: "tu" }, ", ", { term: "se" }, " con ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", poi ", { term: "nous" }, " e ", { term: "vous" }, "."]
              pl: ["Zaimek powtarza podmiot: ", { term: "me" }, " z ", { term: "je" }, ", ", { term: "te" }, " z ", { term: "tu" }, ", ", { term: "se" }, " z ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", a także ", { term: "nous" }, " i ", { term: "vous" }, "."]
              tr: ["Zamir özneyi yineler: ", { term: "je" }, " ile ", { term: "me" }, ", ", { term: "tu" }, " ile ", { term: "te" }, ", ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, " ile ", { term: "se" }, ", ayrıca ", { term: "nous" }, " ve ", { term: "vous" }, "."]
              id: ["Kata ganti mengulang subjek: ", { term: "me" }, " dengan ", { term: "je" }, ", ", { term: "te" }, " dengan ", { term: "tu" }, ", ", { term: "se" }, " dengan ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", lalu ", { term: "nous" }, " dan ", { term: "vous" }, "."]
              vi: ["Đại từ nhắc lại chủ ngữ: ", { term: "me" }, " với ", { term: "je" }, ", ", { term: "te" }, " với ", { term: "tu" }, ", ", { term: "se" }, " với ", { term: "il" }, ", ", { term: "elle" }, ", ", { term: "on" }, ", ", { term: "ils" }, ", ", { term: "elles" }, ", rồi ", { term: "nous" }, " và ", { term: "vous" }, "."]
            ex: { examples: [["Je ", { target: "me" }, " lave."], ["Tu ", { target: "te" }, " laves."], ["Elles ", { target: "se" }, " lavent."]] }
