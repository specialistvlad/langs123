              it: ["Nel parlato, ", { term: "on" }, " sostituisce ", { term: "nous" }, " e prende la forma di ", { term: "il" }, ": vedi ", { link: "I pronomi soggetto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pl: ["W mowie ", { term: "on" }, " zastępuje ", { term: "nous" }, " i przyjmuje formę ", { term: "il" }, ": zob. ", { link: "Zaimki podmiotowe", to: "fr.pronoms.pronoms-sujets" }, "."]
