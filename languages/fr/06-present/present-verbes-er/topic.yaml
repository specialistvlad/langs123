            tr: { en: { examples: ["He is eating an apple.", "What are you watching?"] }, uk: { examples: ["Він їсть яблуко.", "Що ти дивишся?"] }, es: { examples: ["Está comiendo una manzana.", "¿Qué miras?"] }, pt: { examples: ["Ele está comendo uma maçã.", "O que você está olhando?"] }, de: { examples: ["Er isst einen Apfel.", "Was schaust du an?"] }, it: { examples: ["Sta mangiando una mela.", "Che cosa guardi?"] }, pl: { examples: ["Je jabłko.", "Na co patrzysz?"] }, tr: { examples: ["Elma yiyor.", "Neye bakıyorsun?"] }, id: { examples: ["Dia sedang makan apel.", "Kamu sedang melihat apa?"] }, vi: { examples: ["Anh ấy đang ăn một quả táo.", "Bạn đang nhìn gì vậy?"] } }
          - level: "A1"
