              tr: [{ term: "-e" }, ", ", { term: "-es" }, " ve ", { term: "-ent" }, " okunmaz: ", { term: "parle" }, ", ", { term: "parles" }, " ve ", { term: "parlent" }, " aynı duyulur."]
