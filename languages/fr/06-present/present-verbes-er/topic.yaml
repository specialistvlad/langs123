              en: ["In these four types of verb, the stem changes with ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " and ", { term: "ils" }, "; with ", { term: "nous" }, " and ", { term: "vous" }, " it stays that of the infinitive."]
              uk: ["У цих чотирьох типах дієслів основа змінюється з ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " та ", { term: "ils" }, "; з ", { term: "nous" }, " і ", { term: "vous" }, " лишається основа інфінітива."]
              es: ["En estos cuatro tipos de verbos, la raíz cambia con ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " e ", { term: "ils" }, "; con ", { term: "nous" }, " y ", { term: "vous" }, " queda la del infinitivo."]
              pt: ["Nestes quatro tipos de verbos, o radical muda com ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " e ", { term: "ils" }, "; com ", { term: "nous" }, " e ", { term: "vous" }, " fica o do infinitivo."]
              de: ["Bei diesen vier Verbtypen ändert sich der Stamm bei ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " und ", { term: "ils" }, "; bei ", { term: "nous" }, " und ", { term: "vous" }, " bleibt der Stamm des Infinitivs."]
              it: ["In questi quattro tipi di verbi la radice cambia con ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " e ", { term: "ils" }, "; con ", { term: "nous" }, " e ", { term: "vous" }, " resta quella dell’infinito."]
              pl: ["W tych czterech typach czasowników temat zmienia się przy ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " i ", { term: "ils" }, "; przy ", { term: "nous" }, " i ", { term: "vous" }, " zostaje temat bezokolicznika."]
              tr: ["Bu dört fiil türünde kök ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " ve ", { term: "ils" }, " ile değişir; ", { term: "nous" }, " ve ", { term: "vous" }, " ile mastarın kökü kalır."]
              id: ["Pada keempat jenis kata kerja ini, akar berubah pada ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, ", dan ", { term: "ils" }, "; pada ", { term: "nous" }, " dan ", { term: "vous" }, " akar infinitif tetap."]
              vi: ["Ở bốn kiểu động từ này, gốc từ đổi ở ", { term: "je" }, ", ", { term: "tu" }, ", ", { term: "il" }, " và ", { term: "ils" }, "; ở ", { term: "nous" }, " và ", { term: "vous" }, " gốc của động từ nguyên mẫu được giữ."]
            ex: { examples: [["Elle ", { target: "lève" }, " la main."], ["Nous ", { target: "levons" }, " la main."]] }
            tr: { en: { examples: ["She raises her hand.", "We raise our hands."] }, uk: { examples: ["Вона піднімає руку.", "Ми піднімаємо руку."] }, es: { examples: ["Ella levanta la mano.", "Levantamos la mano."] }, pt: { examples: ["Ela levanta a mão.", "Nós levantamos a mão."] }, de: { examples: ["Sie hebt die Hand.", "Wir heben die Hand."] }, it: { examples: ["Lei alza la mano.", "Alziamo la mano."] }, pl: { examples: ["Ona podnosi rękę.", "Podnosimy rękę."] }, tr: { examples: ["O elini kaldırıyor.", "Elimizi kaldırıyoruz."] }, id: { examples: ["Dia mengangkat tangan.", "Kami mengangkat tangan."] }, vi: { examples: ["Cô ấy giơ tay.", "Chúng tôi giơ tay."] } }
