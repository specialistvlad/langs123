            tr: { en: { examples: ["Tomorrow we arrive at noon.", "She starts on Monday."] }, uk: { examples: ["Завтра ми приїжджаємо опівдні.", "Вона починає в понеділок."] }, es: { examples: ["Mañana llegamos a mediodía.", "Ella empieza el lunes."] }, pt: { examples: ["Amanhã nós chegamos ao meio-dia.", "Ela começa na segunda."] }, de: { examples: ["Morgen kommen wir mittags an.", "Sie fängt am Montag an."] }, it: { examples: ["Domani arriviamo a mezzogiorno.", "Lei comincia lunedì."] }, pl: { examples: ["Jutro przyjeżdżamy w południe.", "Ona zaczyna w poniedziałek."] }, tr: { examples: ["Yarın öğlen varıyoruz.", "O pazartesi başlıyor."] }, id: { examples: ["Besok kami tiba tengah hari.", "Dia mulai hari Senin."] }, vi: { examples: ["Ngày mai chúng tôi đến vào buổi trưa.", "Cô ấy bắt đầu vào thứ Hai."] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Le français a un seul présent : il dit l’habitude comme l’action en cours, sans forme en -ing."
              en: "French has one present: it says habits and actions in progress alike, with no -ing form."
              uk: "У французькій мові один теперішній час: він передає і звичку, і дію, що триває, без окремої форми."
              es: "El francés tiene un solo presente: expresa el hábito y la acción en curso, sin forma de gerundio."
              pt: "O francês tem um só presente: diz o hábito e a ação em curso, sem forma de gerúndio."
              de: "Das Französische hat ein einziges Präsens: Es drückt Gewohnheit und laufende Handlung aus, ohne eigene Verlaufsform."
              it: "Il francese ha un solo presente: dice l’abitudine e l’azione in corso, senza forma di gerundio."
              pl: "Francuski ma jeden czas teraźniejszy: wyraża zwyczaj i czynność trwającą, bez osobnej formy ciągłej."
              tr: "Fransızcada tek bir şimdiki zaman vardır: alışkanlığı da süren eylemi de anlatır, ayrı bir sürerlik biçimi yoktur."
              id: "Bahasa Prancis hanya punya satu presens: untuk kebiasaan maupun tindakan yang sedang berlangsung, tanpa bentuk -ing."
              vi: "Tiếng Pháp chỉ có một thì hiện tại: diễn tả cả thói quen lẫn hành động đang diễn ra, không có dạng tiếp diễn."
            ex: { examples: [["Je ", { target: "mange" }, " souvent ici."], ["Je ", { target: "mange" }, " maintenant."]] }
            tr: { en: { examples: ["I often eat here.", "I'm eating now."] }, uk: { examples: ["Я часто їм тут.", "Я зараз їм."] }, es: { examples: ["Como aquí a menudo.", "Ahora estoy comiendo."] }, pt: { examples: ["Eu como aqui com frequência.", "Agora estou comendo."] }, de: { examples: ["Ich esse oft hier.", "Ich esse gerade."] }, it: { examples: ["Mangio spesso qui.", "Adesso sto mangiando."] }, pl: { examples: ["Często tu jem.", "Teraz jem."] }, tr: { examples: ["Burada sık sık yemek yerim.", "Şimdi yemek yiyorum."] }, id: { examples: ["Aku sering makan di sini.", "Sekarang aku sedang makan."] }, vi: { examples: ["Tôi thường ăn ở đây.", "Bây giờ tôi đang ăn."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: ["Pour insister sur l’action en cours, on dit ", { term: "être en train de" }, " + infinitif."]
              en: ["To stress an action in progress, say ", { term: "être en train de" }, " + infinitive."]
              uk: ["Щоб підкреслити дію, що триває, кажуть ", { term: "être en train de" }, " + інфінітив."]
              es: ["Para insistir en la acción en curso, se dice ", { term: "être en train de" }, " + infinitivo."]
              pt: ["Para insistir na ação em curso, diz-se ", { term: "être en train de" }, " + infinitivo."]
              de: ["Um die laufende Handlung zu betonen, sagt man ", { term: "être en train de" }, " + Infinitiv."]
              it: ["Per sottolineare l’azione in corso, si dice ", { term: "être en train de" }, " + infinito."]
              pl: ["Aby podkreślić czynność trwającą, mówi się ", { term: "être en train de" }, " + bezokolicznik."]
              tr: ["Süren eylemi vurgulamak için ", { term: "être en train de" }, " + mastar kullanılır."]
              id: ["Untuk menekankan tindakan yang sedang berlangsung, dipakai ", { term: "être en train de" }, " + infinitif."]
              vi: ["Để nhấn mạnh hành động đang diễn ra, dùng ", { term: "être en train de" }, " + động từ nguyên mẫu."]
            ex: ["Je suis ", { target: "en train de" }, " cuisiner."]
            tr: { en: "I'm in the middle of cooking.", uk: "Я саме готую.", es: "Estoy cocinando.", pt: "Estou cozinhando agora.", de: "Ich bin gerade beim Kochen.", it: "Sto cucinando.", pl: "Właśnie gotuję.", tr: "Şu anda yemek pişirmekteyim.", id: "Aku sedang memasak.", vi: "Tôi đang nấu ăn." }
