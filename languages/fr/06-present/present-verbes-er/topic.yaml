              vi: ["Trong lời nói, ", { term: "on" }, " thay cho ", { term: "nous" }, " và dùng dạng của ", { term: "il" }, ": xem ", { link: "Đại từ chủ ngữ", to: "fr.pronoms.pronoms-sujets" }, "."]
