            tr: { en: { examples: ["I live in Lyon.", "He hates the cold."] }, uk: { examples: ["Я живу в Ліоні.", "Він терпіти не може холод."] }, es: { examples: ["Vivo en Lyon.", "Odia el frío."] }, pt: { examples: ["Eu moro em Lyon.", "Ele detesta o frio."] }, de: { examples: ["Ich wohne in Lyon.", "Er hasst die Kälte."] }, it: { examples: ["Abito a Lione.", "Detesta il freddo."] }, pl: { examples: ["Mieszkam w Lyonie.", "Nie znosi zimna."] }, tr: { examples: ["Lyon’da yaşıyorum.", "Soğuktan nefret ediyor."] }, id: { examples: ["Aku tinggal di Lyon.", "Dia benci cuaca dingin."] }, vi: { examples: ["Tôi sống ở Lyon.", "Anh ấy ghét trời lạnh."] } }
          - level: "A1"
            use:
              fr: "Ce qui se passe maintenant"
              en: "What is happening now"
              uk: "Те, що відбувається зараз"
