              fr: "Une habitude"
              en: "A habit"
              uk: "Звичка"
              es: "Un hábito"
              pt: "Um hábito"
              de: "Eine Gewohnheit"
              it: "Un’abitudine"
              pl: "Zwyczaj"
              tr: "Bir alışkanlık"
              id: "Kebiasaan"
              vi: "Một thói quen"
            ex: { examples: [["Elle ", { target: "travaille" }, " le samedi."], ["Nous ", { target: "dînons" }, " à huit heures."]] }
            tr: { en: { examples: ["She works on Saturdays.", "We have dinner at eight."] }, uk: { examples: ["Вона працює по суботах.", "Ми вечеряємо о восьмій."] }, es: { examples: ["Ella trabaja los sábados.", "Cenamos a las ocho."] }, pt: { examples: ["Ela trabalha aos sábados.", "Nós jantamos às oito."] }, de: { examples: ["Sie arbeitet samstags.", "Wir essen um acht Uhr zu Abend."] }, it: { examples: ["Lei lavora il sabato.", "Ceniamo alle otto."] }, pl: { examples: ["Ona pracuje w soboty.", "Jemy kolację o ósmej."] }, tr: { examples: ["O cumartesi günleri çalışıyor.", "Akşam yemeğini sekizde yiyoruz."] }, id: { examples: ["Dia bekerja pada hari Sabtu.", "Kami makan malam pukul delapan."] }, vi: { examples: ["Cô ấy làm việc vào thứ Bảy.", "Chúng tôi ăn tối lúc tám giờ."] } }
          - level: "A2"
