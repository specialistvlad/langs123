            text:
              fr: [{ term: "-e" }, ", ", { term: "-es" }, " et ", { term: "-ent" }, " ne se prononcent pas : ", { term: "parle" }, ", ", { term: "parles" }, " et ", { term: "parlent" }, " sonnent pareil."]
