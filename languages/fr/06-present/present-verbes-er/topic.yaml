sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Les verbes en ", { term: "-er" }, " sont les plus nombreux : on enlève ", { term: "-er" }, " et on ajoute les terminaisons du présent."]
              en: ["Verbs in ", { term: "-er" }, " are the largest group: drop ", { term: "-er" }, " and add the present endings."]
              uk: ["Дієслова на ", { term: "-er" }, " — найчисленніша група: відкидаємо ", { term: "-er" }, " і додаємо закінчення теперішнього часу."]
              es: ["Los verbos en ", { term: "-er" }, " son los más numerosos: se quita ", { term: "-er" }, " y se añaden las terminaciones del presente."]
              pt: ["Os verbos em ", { term: "-er" }, " são os mais numerosos: tira-se ", { term: "-er" }, " e juntam-se as terminações do presente."]
              de: ["Verben auf ", { term: "-er" }, " sind die größte Gruppe: Man streicht ", { term: "-er" }, " und hängt die Endungen des Präsens an."]
              it: ["I verbi in ", { term: "-er" }, " sono i più numerosi: si toglie ", { term: "-er" }, " e si aggiungono le desinenze del presente."]
              pl: ["Czasowniki na ", { term: "-er" }, " to największa grupa: odrzuca się ", { term: "-er" }, " i dodaje końcówki czasu teraźniejszego."]
              tr: [{ term: "-er" }, " ile biten fiiller en kalabalık gruptur: ", { term: "-er" }, " atılır, şimdiki zaman ekleri eklenir."]
              id: ["Kata kerja berakhiran ", { term: "-er" }, " adalah kelompok terbesar: buang ", { term: "-er" }, ", lalu tambahkan akhiran presens."]
              vi: ["Động từ đuôi ", { term: "-er" }, " là nhóm lớn nhất: bỏ ", { term: "-er" }, " và thêm đuôi của thì hiện tại."]
            ex: { examples: [["Je ", { target: "parle" }, " français."], ["Nous ", { target: "habitons" }, " à Lyon."]] }
            tr: { en: { examples: ["I speak French.", "We live in Lyon."] }, uk: { examples: ["Я розмовляю французькою.", "Ми живемо в Ліоні."] }, es: { examples: ["Hablo francés.", "Vivimos en Lyon."] }, pt: { examples: ["Eu falo francês.", "Nós moramos em Lyon."] }, de: { examples: ["Ich spreche Französisch.", "Wir wohnen in Lyon."] }, it: { examples: ["Parlo francese.", "Abitiamo a Lione."] }, pl: { examples: ["Mówię po francusku.", "Mieszkamy w Lyonie."] }, tr: { examples: ["Fransızca konuşuyorum.", "Lyon’da yaşıyoruz."] }, id: { examples: ["Aku berbicara bahasa Prancis.", "Kami tinggal di Lyon."] }, vi: { examples: ["Tôi nói tiếng Pháp.", "Chúng tôi sống ở Lyon."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le radical reste le même à toutes les personnes ; seule la terminaison change."
              en: "The stem stays the same for every person; only the ending changes."
              uk: "Основа однакова в усіх особах; змінюється лише закінчення."
              es: "La raíz es la misma en todas las personas; solo cambia la terminación."
              pt: "O radical é o mesmo em todas as pessoas; só a terminação muda."
              de: "Der Stamm bleibt in allen Personen gleich; nur die Endung ändert sich."
              it: "La radice resta la stessa in tutte le persone; cambia solo la desinenza."
              pl: "Temat jest taki sam we wszystkich osobach; zmienia się tylko końcówka."
              tr: "Kök her kişide aynı kalır; yalnızca ek değişir."
              id: "Akar kata sama untuk semua persona; hanya akhirannya yang berubah."
              vi: "Gốc từ giống nhau ở mọi ngôi; chỉ có đuôi thay đổi."
            ex: { examples: [["Tu ", { target: "aimes" }, " le café."], ["Ils ", { target: "aiment" }, " le café."]] }
            tr: { en: { examples: ["You like coffee.", "They like coffee."] }, uk: { examples: ["Ти любиш каву.", "Вони люблять каву."] }, es: { examples: ["Te gusta el café.", "Les gusta el café."] }, pt: { examples: ["Você gosta de café.", "Eles gostam de café."] }, de: { examples: ["Du magst Kaffee.", "Sie mögen Kaffee."] }, it: { examples: ["Ti piace il caffè.", "A loro piace il caffè."] }, pl: { examples: ["Lubisz kawę.", "Oni lubią kawę."] }, tr: { examples: ["Kahveyi seversin.", "Onlar kahveyi sever."] }, id: { examples: ["Kamu suka kopi.", "Mereka suka kopi."] }, vi: { examples: ["Bạn thích cà phê.", "Họ thích cà phê."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Les quelques changements d’orthographe suivent des règles : voir la section Orthographe."
              en: "The few spelling changes follow rules: see the Spelling section."
              uk: "Кілька змін у написанні підпорядковуються правилам: див. розділ про правопис."
              es: "Los pocos cambios de ortografía siguen reglas: ver la sección de ortografía."
              pt: "As poucas mudanças de ortografia seguem regras: veja a seção de ortografia."
              de: "Die wenigen Schreibänderungen folgen Regeln: siehe den Abschnitt Rechtschreibung."
              it: "I pochi cambiamenti ortografici seguono regole: vedi la sezione sull’ortografia."
              pl: "Nieliczne zmiany pisowni mają swoje reguły: zob. sekcję o pisowni."
              tr: "Birkaç yazım değişikliği kurallara uyar: Yazım bölümüne bakın."
              id: "Beberapa perubahan ejaan mengikuti aturan: lihat bagian ejaan."
              vi: "Một vài thay đổi chính tả tuân theo quy tắc: xem phần chính tả."
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les pronoms sujets, voir ", { link: "Les pronoms sujets", to: "fr.pronoms.pronoms-sujets" }, "."]
              en: ["For the subject pronouns, see ", { link: "Subject Pronouns", to: fr.pronoms.pronoms-sujets }, "."]
              uk: ["Про підметові займенники — див. ", { link: "Підметові займенники", to: "fr.pronoms.pronoms-sujets" }, "."]
              es: ["Para los pronombres sujeto, ver ", { link: "Los pronombres sujeto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pt: ["Para os pronomes sujeito, veja ", { link: "Os pronomes sujeito", to: "fr.pronoms.pronoms-sujets" }, "."]
              de: ["Zu den Subjektpronomen siehe ", { link: "Die Subjektpronomen", to: "fr.pronoms.pronoms-sujets" }, "."]
              it: ["Per i pronomi soggetto, vedi ", { link: "I pronomi soggetto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pl: ["O zaimkach podmiotowych — zob. ", { link: "Zaimki podmiotowe", to: "fr.pronoms.pronoms-sujets" }, "."]
              tr: ["Özne zamirleri için bkz. ", { link: "Özne zamirleri", to: "fr.pronoms.pronoms-sujets" }, "."]
              id: ["Untuk pronomina subjek, lihat ", { link: "Pronomina subjek", to: "fr.pronoms.pronoms-sujets" }, "."]
              vi: ["Về đại từ chủ ngữ, xem ", { link: "Đại từ chủ ngữ", to: "fr.pronoms.pronoms-sujets" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "aller" }, " et les autres verbes irréguliers, voir ", { link: "Le présent : les verbes irréguliers", to: "fr.present.present-irreguliers" }, "."]
              en: ["For ", { term: "aller" }, " and the other irregular verbs, see ", { link: "Present Tense: Irregular Verbs", to: fr.present.present-irreguliers }, "."]
              uk: ["Про ", { term: "aller" }, " та інші неправильні дієслова — див. ", { link: "Теперішній час: неправильні дієслова", to: "fr.present.present-irreguliers" }, "."]
              es: ["Para ", { term: "aller" }, " y los demás verbos irregulares, ver ", { link: "El presente: los verbos irregulares", to: "fr.present.present-irreguliers" }, "."]
              pt: ["Para ", { term: "aller" }, " e os outros verbos irregulares, veja ", { link: "O presente: os verbos irregulares", to: "fr.present.present-irreguliers" }, "."]
              de: ["Zu ", { term: "aller" }, " und den übrigen unregelmäßigen Verben siehe ", { link: "Das Präsens: unregelmäßige Verben", to: "fr.present.present-irreguliers" }, "."]
              it: ["Per ", { term: "aller" }, " e gli altri verbi irregolari, vedi ", { link: "Il presente: i verbi irregolari", to: "fr.present.present-irreguliers" }, "."]
              pl: ["O ", { term: "aller" }, " i pozostałych czasownikach nieregularnych — zob. ", { link: "Czas teraźniejszy: czasowniki nieregularne", to: "fr.present.present-irreguliers" }, "."]
              tr: [{ term: "aller" }, " ve öbür düzensiz fiiller için bkz. ", { link: "Şimdiki zaman: düzensiz fiiller", to: "fr.present.present-irreguliers" }, "."]
              id: ["Untuk ", { term: "aller" }, " dan kata kerja tidak beraturan lainnya, lihat ", { link: "Presens: kata kerja tidak beraturan", to: "fr.present.present-irreguliers" }, "."]
              vi: ["Về ", { term: "aller" }, " và các động từ bất quy tắc khác, xem ", { link: "Thì hiện tại: động từ bất quy tắc", to: "fr.present.present-irreguliers" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour la négation, voir ", { link: "La négation", to: "fr.phrase.negation" }, " ; pour les questions, voir ", { link: "Les questions", to: "fr.phrase.questions" }, "."]
              en: ["For negation, see ", { link: "Negation", to: "fr.phrase.negation" }, "; for questions, see ", { link: "Questions", to: "fr.phrase.questions" }, "."]
              uk: ["Про заперечення — див. ", { link: "Заперечення", to: "fr.phrase.negation" }, "; про питання — див. ", { link: "Питання", to: "fr.phrase.questions" }, "."]
              es: ["Para la negación, ver ", { link: "La negación", to: "fr.phrase.negation" }, "; para las preguntas, ver ", { link: "Las preguntas", to: "fr.phrase.questions" }, "."]
              pt: ["Para a negação, veja ", { link: "A negação", to: "fr.phrase.negation" }, "; para as perguntas, veja ", { link: "As perguntas", to: "fr.phrase.questions" }, "."]
              de: ["Zur Verneinung siehe ", { link: "Die Verneinung", to: "fr.phrase.negation" }, "; zu den Fragen siehe ", { link: "Fragen", to: "fr.phrase.questions" }, "."]
              it: ["Per la negazione, vedi ", { link: "La negazione", to: "fr.phrase.negation" }, "; per le domande, vedi ", { link: "Le domande", to: "fr.phrase.questions" }, "."]
              pl: ["O przeczeniu — zob. ", { link: "Przeczenie", to: "fr.phrase.negation" }, "; o pytaniach — zob. ", { link: "Pytania", to: "fr.phrase.questions" }, "."]
              tr: ["Olumsuzluk için bkz. ", { link: "Olumsuzluk", to: "fr.phrase.negation" }, "; sorular için bkz. ", { link: "Soru cümleleri", to: "fr.phrase.questions" }, "."]
              id: ["Untuk negasi, lihat ", { link: "Negasi", to: "fr.phrase.negation" }, "; untuk pertanyaan, lihat ", { link: "Kalimat tanya", to: "fr.phrase.questions" }, "."]
              vi: ["Về phủ định, xem ", { link: "Phủ định", to: "fr.phrase.negation" }, "; về câu hỏi, xem ", { link: "Câu hỏi", to: "fr.phrase.questions" }, "."]
  - title:
      fr: "Forme : les terminaisons du présent"
      en: "Form: the present endings"
      uk: "Форма: закінчення теперішнього часу"
      es: "Forma: las terminaciones del presente"
      pt: "Forma: as terminações do presente"
      de: "Form: die Endungen des Präsens"
      it: "Forma: le desinenze del presente"
      pl: "Forma: końcówki czasu teraźniejszego"
      tr: "Biçim: şimdiki zaman ekleri"
      id: "Bentuk: akhiran presens"
      vi: "Dạng: đuôi của thì hiện tại"
    role: "form"
    features: { tense: "prs" }
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: "parler", label: "parler" }
          - { key: "aimer", label: "aimer" }
          - { key: "habiter", label: "habiter" }
        rows:
          - { level: "A1", features: { person: 1, number: "sg" }, person: { alternatives: ["je", "j’"] }, parler: ["parl", { ending: "e" }], aimer: ["aim", { ending: "e" }], habiter: ["habit", { ending: "e" }] }
          - { level: "A1", features: { person: 2, number: "sg", politeness: "infm" }, person: "tu", parler: ["parl", { ending: "es" }], aimer: ["aim", { ending: "es" }], habiter: ["habit", { ending: "es" }] }
          - level: "A1"
            features: { person: 3, number: "sg" }
            person: { alternatives: ["il", "elle", "on"] }
            parler: ["parl", { ending: "e" }]
            aimer: ["aim", { ending: "e" }]
            habiter: ["habit", { ending: "e" }]
          - { level: "A1", features: { person: 1, number: "pl" }, person: "nous", parler: ["parl", { ending: "ons" }], aimer: ["aim", { ending: "ons" }], habiter: ["habit", { ending: "ons" }] }
          - level: "A1"
            features: [{ person: 2, number: "pl" }, { person: 2, number: "sg", politeness: "form" }]
            person: "vous"
            parler: ["parl", { ending: "ez" }]
            aimer: ["aim", { ending: "ez" }]
            habiter: ["habit", { ending: "ez" }]
          - level: "A1"
            features: { person: 3, number: "pl" }
            person: { alternatives: ["ils", "elles"] }
            parler: ["parl", { ending: "ent" }]
            aimer: ["aim", { ending: "ent" }]
            habiter: ["habit", { ending: "ent" }]
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
