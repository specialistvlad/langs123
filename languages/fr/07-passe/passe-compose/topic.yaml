            vi: [{ term: "ne" }, " … ", { term: "pas" }, " bao quanh trợ động từ"]
          ex: ["Je ", { target: "n’ai pas mangé" }, "."]
          tr: { en: "I didn't eat.", uk: "Я не їв.", es: "No comí.", pt: "Eu não comi.", de: "Ich habe nicht gegessen.", it: "Non ho mangiato.", pl: "Nie jadłem.", tr: "Yemedim.", id: "Aku tidak makan.", vi: "Tôi đã không ăn." }
        - level: "A1"
          point: { fr: "Question", en: "Question", uk: "Питання", es: "Pregunta", pt: "Pergunta", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }
          rule:
            fr: ["intonation ou ", { term: "est-ce que" }, " devant la phrase"]
            en: ["intonation or ", { term: "est-ce que" }, " before the sentence"]
            uk: ["інтонація або ", { term: "est-ce que" }, " перед реченням"]
            es: ["entonación o ", { term: "est-ce que" }, " delante de la oración"]
            pt: ["entonação ou ", { term: "est-ce que" }, " antes da frase"]
            de: ["Intonation oder ", { term: "est-ce que" }, " vor dem Satz"]
            it: ["intonazione o ", { term: "est-ce que" }, " prima della frase"]
            pl: ["intonacja albo ", { term: "est-ce que" }, " przed zdaniem"]
            tr: ["tonlama ya da cümlenin önünde ", { term: "est-ce que" }]
            id: ["intonasi atau ", { term: "est-ce que" }, " di depan kalimat"]
            vi: ["ngữ điệu hoặc ", { term: "est-ce que" }, " trước câu"]
          ex: [{ target: "Est-ce que" }, " tu as fini ?"]
          tr: { en: "Have you finished?", uk: "Ти закінчив?", es: "¿Has terminado?", pt: "Você terminou?", de: "Bist du fertig?", it: "Hai finito?", pl: "Skończyłeś?", tr: "Bitirdin mi?", id: "Apakah kamu sudah selesai?", vi: "Bạn xong chưa?" }
        - level: "A2"
          point:
            fr: "Accord avec être"
            en: "Agreement with être"
            uk: "Узгодження з être"
            es: "Concordancia con être"
            pt: "Concordância com être"
            de: "Angleichung mit être"
            it: "Accordo con être"
            pl: "Zgoda z être"
            tr: "être ile uyum"
            id: "Kesesuaian dengan être"
            vi: "Hòa hợp với être"
          rule:
            fr: ["avec ", { term: "être" }, ", le participe s’accorde avec le sujet"]
            en: ["with ", { term: "être" }, ", the participle agrees with the subject"]
            uk: ["з ", { term: "être" }, " дієприкметник узгоджується з підметом"]
            es: ["con ", { term: "être" }, ", el participio concuerda con el sujeto"]
            pt: ["com ", { term: "être" }, ", o particípio concorda com o sujeito"]
            de: ["mit ", { term: "être" }, " richtet sich das Partizip nach dem Subjekt"]
            it: ["con ", { term: "être" }, ", il participio concorda con il soggetto"]
            pl: ["z ", { term: "être" }, " imiesłów zgadza się z podmiotem"]
            tr: [{ term: "être" }, " ile ortaç özneyle uyum sağlar"]
            id: ["dengan ", { term: "être" }, ", partisip menyesuaikan diri dengan subjek"]
            vi: ["với ", { term: "être" }, ", quá khứ phân từ hòa hợp với chủ ngữ"]
          ex: ["Elles sont ", { target: "parties" }, "."]
          tr: { en: "They left.", uk: "Вони пішли.", es: "Se fueron.", pt: "Elas saíram.", de: "Sie sind gegangen.", it: "Sono partite.", pl: "Wyszły.", tr: "Onlar gitti.", id: "Mereka pergi.", vi: "Họ đã đi." }
        - level: "A2"
          point:
            fr: "Verbes pronominaux"
            en: "Reflexive verbs"
            uk: "Зворотні дієслова"
            es: "Verbos pronominales"
            pt: "Verbos pronominais"
            de: "Reflexive Verben"
            it: "Verbi pronominali"
            pl: "Czasowniki zwrotne"
            tr: "Dönüşlü fiiller"
            id: "Kata kerja refleksif"
            vi: "Động từ phản thân"
          rule:
            fr: ["toujours ", { term: "être" }, ", avec le pronom devant l’auxiliaire"]
            en: ["always ", { term: "être" }, ", with the pronoun before the auxiliary"]
            uk: ["завжди ", { term: "être" }, ", займенник стоїть перед допоміжним дієсловом"]
            es: ["siempre ", { term: "être" }, ", con el pronombre delante del auxiliar"]
            pt: ["sempre ", { term: "être" }, ", com o pronome antes do auxiliar"]
            de: ["immer ", { term: "être" }, ", das Pronomen steht vor dem Hilfsverb"]
            it: ["sempre ", { term: "être" }, ", con il pronome davanti all’ausiliare"]
            pl: ["zawsze ", { term: "être" }, ", zaimek stoi przed czasownikiem posiłkowym"]
            tr: ["her zaman ", { term: "être" }, ", zamir yardımcı fiilin önünde"]
            id: ["selalu ", { term: "être" }, ", dengan pronomina di depan kata kerja bantu"]
            vi: ["luôn là ", { term: "être" }, ", đại từ đứng trước trợ động từ"]
          ex: ["Je ", { target: "me suis levé" }, " tôt."]
          tr: { en: "I got up early.", uk: "Я встав рано.", es: "Me levanté temprano.", pt: "Eu me levantei cedo.", de: "Ich bin früh aufgestanden.", it: "Mi sono alzato presto.", pl: "Wstałem wcześnie.", tr: "Erken kalktım.", id: "Aku bangun pagi-pagi.", vi: "Tôi đã dậy sớm." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: ["après l’auxiliaire, le participe en ", { term: "-é" }, ", pas l’infinitif en ", { term: "-er" }]
            en: ["after the auxiliary, the participle in ", { term: "-é" }, ", not the infinitive in ", { term: "-er" }]
            uk: ["після допоміжного дієслова — дієприкметник на ", { term: "-é" }, ", а не інфінітив на ", { term: "-er" }]
            es: ["tras el auxiliar, el participio en ", { term: "-é" }, ", no el infinitivo en ", { term: "-er" }]
            pt: ["depois do auxiliar, o particípio em ", { term: "-é" }, ", não o infinitivo em ", { term: "-er" }]
            de: ["nach dem Hilfsverb steht das Partizip auf ", { term: "-é" }, ", nicht der Infinitiv auf ", { term: "-er" }]
            it: ["dopo l’ausiliare, il participio in ", { term: "-é" }, ", non l’infinito in ", { term: "-er" }]
            pl: ["po czasowniku posiłkowym stoi imiesłów na ", { term: "-é" }, ", nie bezokolicznik na ", { term: "-er" }]
            tr: ["yardımcı fiilden sonra ", { term: "-er" }, " mastarı değil, ", { term: "-é" }, " ortacı gelir"]
            id: ["setelah kata kerja bantu, partisip ", { term: "-é" }, ", bukan infinitif ", { term: "-er" }]
            vi: ["sau trợ động từ là quá khứ phân từ ", { term: "-é" }, ", không phải động từ nguyên mẫu ", { term: "-er" }]
          ex: ["J’ai ", { target: "mangé" }, " une pizza."]
          tr: { en: "I ate a pizza.", uk: "Я з’їв піцу.", es: "Comí una pizza.", pt: "Eu comi uma pizza.", de: "Ich habe eine Pizza gegessen.", it: "Ho mangiato una pizza.", pl: "Zjadłem pizzę.", tr: "Bir pizza yedim.", id: "Aku makan sebuah pizza.", vi: "Tôi đã ăn một cái pizza." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: [{ term: "aller" }, " prend ", { term: "être" }, ", pas ", { term: "avoir" }]
            en: [{ term: "aller" }, " takes ", { term: "être" }, ", not ", { term: "avoir" }]
            uk: [{ term: "aller" }, " бере ", { term: "être" }, ", а не ", { term: "avoir" }]
            es: [{ term: "aller" }, " lleva ", { term: "être" }, ", no ", { term: "avoir" }]
            pt: [{ term: "aller" }, " leva ", { term: "être" }, ", não ", { term: "avoir" }]
            de: [{ term: "aller" }, " steht mit ", { term: "être" }, ", nicht mit ", { term: "avoir" }]
            it: [{ term: "aller" }, " vuole ", { term: "être" }, ", non ", { term: "avoir" }]
            pl: [{ term: "aller" }, " łączy się z ", { term: "être" }, ", nie z ", { term: "avoir" }]
            tr: [{ term: "aller" }, " ", { term: "être" }, " alır, ", { term: "avoir" }, " değil"]
            id: [{ term: "aller" }, " memakai ", { term: "être" }, ", bukan ", { term: "avoir" }]
            vi: [{ term: "aller" }, " đi với ", { term: "être" }, ", không phải ", { term: "avoir" }]
          ex: ["Je ", { target: "suis allé" }, " au marché."]
          tr: { en: "I went to the market.", uk: "Я ходив на ринок.", es: "Fui al mercado.", pt: "Eu fui ao mercado.", de: "Ich bin auf den Markt gegangen.", it: "Sono andato al mercato.", pl: "Poszedłem na targ.", tr: "Pazara gittim.", id: "Aku pergi ke pasar.", vi: "Tôi đã đi chợ." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le passé composé a deux parties : l’auxiliaire ", { term: "avoir" }, " ou ", { term: "être" }, " au présent, puis le participe passé."]
              en: ["The passé composé has two parts: the auxiliary ", { term: "avoir" }, " or ", { term: "être" }, " in the present, then the past participle."]
              uk: ["Passé composé має дві частини: допоміжне дієслово ", { term: "avoir" }, " або ", { term: "être" }, " у теперішньому часі й дієприкметник минулого часу."]
              es: ["El passé composé tiene dos partes: el auxiliar ", { term: "avoir" }, " o ", { term: "être" }, " en presente y, después, el participio."]
              pt: ["O passé composé tem duas partes: o auxiliar ", { term: "avoir" }, " ou ", { term: "être" }, " no presente e, depois, o particípio."]
              de: ["Das Passé composé hat zwei Teile: das Hilfsverb ", { term: "avoir" }, " oder ", { term: "être" }, " im Präsens und danach das Partizip Perfekt."]
              it: ["Il passé composé ha due parti: l’ausiliare ", { term: "avoir" }, " o ", { term: "être" }, " al presente e poi il participio passato."]
              pl: ["Passé composé ma dwie części: czasownik posiłkowy ", { term: "avoir" }, " lub ", { term: "être" }, " w czasie teraźniejszym i imiesłów przeszły."]
              tr: ["Passé composé iki parçadan oluşur: şimdiki zamanda ", { term: "avoir" }, " ya da ", { term: "être" }, " yardımcı fiili ve ardından geçmiş zaman ortacı."]
              id: ["Passé composé terdiri atas dua bagian: kata kerja bantu ", { term: "avoir" }, " atau ", { term: "être" }, " dalam presens, lalu partisip lampau."]
              vi: ["Passé composé gồm hai phần: trợ động từ ", { term: "avoir" }, " hoặc ", { term: "être" }, " ở hiện tại, rồi đến quá khứ phân từ."]
            ex: { examples: [["Nous ", { target: "avons mangé" }, " ensemble."], ["Ils ", { target: "sont partis" }, "."]] }
            tr: { en: { examples: ["We ate together.", "They left."] }, uk: { examples: ["Ми разом поїли.", "Вони пішли."] }, es: { examples: ["Comimos juntos.", "Se fueron."] }, pt: { examples: ["Nós comemos juntos.", "Eles saíram."] }, de: { examples: ["Wir haben zusammen gegessen.", "Sie sind gegangen."] }, it: { examples: ["Abbiamo mangiato insieme.", "Sono partiti."] }, pl: { examples: ["Zjedliśmy razem.", "Wyszli."] }, tr: { examples: ["Birlikte yedik.", "Gittiler."] }, id: { examples: ["Kami makan bersama.", "Mereka pergi."] }, vi: { examples: ["Chúng tôi đã ăn cùng nhau.", "Họ đã đi."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Seul l’auxiliaire change avec la personne ; le participe garde sa forme."
              en: "Only the auxiliary changes with the person; the participle keeps its form."
              uk: "З особою змінюється лише допоміжне дієслово; дієприкметник зберігає свою форму."
              es: "Solo el auxiliar cambia con la persona; el participio mantiene su forma."
              pt: "Só o auxiliar muda com a pessoa; o particípio mantém a sua forma."
              de: "Nur das Hilfsverb ändert sich mit der Person; das Partizip behält seine Form."
              it: "Cambia solo l’ausiliare con la persona; il participio mantiene la sua forma."
              pl: "Z osobą zmienia się tylko czasownik posiłkowy; imiesłów zachowuje swoją formę."
              tr: "Kişiye göre yalnızca yardımcı fiil değişir; ortaç biçimini korur."
              id: "Hanya kata kerja bantu yang berubah menurut orang; partisip tetap bentuknya."
              vi: "Chỉ trợ động từ đổi theo ngôi; quá khứ phân từ giữ nguyên dạng."
            ex: { examples: [["J’", { target: "ai fini" }, "."], ["Tu ", { target: "as fini" }, "."], ["Nous ", { target: "avons fini" }, "."]] }
            tr: { en: { examples: ["I finished.", "You finished.", "We finished."] }, uk: { examples: ["Я закінчив.", "Ти закінчив.", "Ми закінчили."] }, es: { examples: ["Terminé.", "Terminaste.", "Terminamos."] }, pt: { examples: ["Eu terminei.", "Você terminou.", "Nós terminamos."] }, de: { examples: ["Ich bin fertig geworden.", "Du bist fertig geworden.", "Wir sind fertig geworden."] }, it: { examples: ["Ho finito.", "Hai finito.", "Abbiamo finito."] }, pl: { examples: ["Skończyłem.", "Skończyłeś.", "Skończyliśmy."] }, tr: { examples: ["Bitirdim.", "Bitirdin.", "Bitirdik."] }, id: { examples: ["Aku selesai.", "Kamu selesai.", "Kami selesai."] }, vi: { examples: ["Tôi đã xong.", "Bạn đã xong.", "Chúng tôi đã xong."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Les formes de ", { term: "avoir" }, " et de ", { term: "être" }, " au présent : ", { link: "Être et avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              en: ["The present forms of ", { term: "avoir" }, " and ", { term: "être" }, ": ", { link: "Être and avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              uk: ["Форми ", { term: "avoir" }, " та ", { term: "être" }, " в теперішньому часі: ", { link: "Être і avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              es: ["Las formas de ", { term: "avoir" }, " y ", { term: "être" }, " en presente: ", { link: "Être y avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              pt: ["As formas de ", { term: "avoir" }, " e ", { term: "être" }, " no presente: ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              de: ["Die Präsensformen von ", { term: "avoir" }, " und ", { term: "être" }, ": ", { link: "Être und avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              it: ["Le forme di ", { term: "avoir" }, " e ", { term: "être" }, " al presente: ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              pl: ["Formy czasu teraźniejszego ", { term: "avoir" }, " i ", { term: "être" }, ": ", { link: "Être i avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              tr: [{ term: "avoir" }, " ve ", { term: "être" }, " fiillerinin şimdiki zaman biçimleri: ", { link: "Être ve avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              id: ["Bentuk presens ", { term: "avoir" }, " dan ", { term: "être" }, ": ", { link: "Être dan avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              vi: ["Các dạng hiện tại của ", { term: "avoir" }, " và ", { term: "être" }, ": ", { link: "Être và avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour décrire comment étaient les choses, le passé utilise l’imparfait : ", { link: "L’imparfait : je parlais", to: fr.passe.imparfait }, "."]
              en: ["To describe how things were, the past uses the imparfait: ", { link: "Imperfect: je parlais", to: fr.passe.imparfait }, "."]
              uk: ["Щоб описати, якими були речі, минуле вживає imparfait: ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              es: ["Para describir cómo eran las cosas, el pasado usa el imparfait: ", { link: "El imparfait: je parlais", to: fr.passe.imparfait }, "."]
              pt: ["Para descrever como as coisas eram, o passado usa o imparfait: ", { link: "O imparfait: je parlais", to: fr.passe.imparfait }, "."]
              de: ["Um zu beschreiben, wie die Dinge waren, nutzt die Vergangenheit das Imparfait: ", { link: "Das Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              it: ["Per descrivere com’erano le cose, il passato usa l’imparfait: ", { link: "L’imparfait: je parlais", to: fr.passe.imparfait }, "."]
              pl: ["Do opisu tego, jakie rzeczy były, przeszłość używa imparfait: ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              tr: ["Şeylerin nasıl olduğunu betimlemek için geçmiş imparfait kullanır: ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              id: ["Untuk menggambarkan keadaan, masa lampau memakai imparfait: ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              vi: ["Để tả sự việc đã như thế nào, quá khứ dùng imparfait: ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Le choix entre les deux temps du passé : ", { link: "Passé composé ou imparfait ?", to: fr.passe.passe-compose-imparfait }, "."]
              en: ["The choice between the two past tenses: ", { link: "Passé Composé or Imperfect", to: fr.passe.passe-compose-imparfait }, "."]
              uk: ["Вибір між двома минулими часами: ", { link: "Passé composé чи imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              es: ["La elección entre los dos tiempos del pasado: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pt: ["A escolha entre os dois tempos do passado: ", { link: "Passé composé ou imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              de: ["Die Wahl zwischen den beiden Vergangenheitszeiten: ", { link: "Passé composé oder Imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              it: ["La scelta tra i due tempi del passato: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pl: ["Wybór między dwoma czasami przeszłymi: ", { link: "Passé composé czy imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              tr: ["İki geçmiş zaman arasındaki seçim: ", { link: "Passé composé mı, imparfait mı?", to: "fr.passe.passe-compose-imparfait" }, "."]
              id: ["Pilihan antara kedua tense lampau: ", { link: "Passé composé atau imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              vi: ["Cách chọn giữa hai thì quá khứ: ", { link: "Passé composé hay imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Les pronoms compléments se placent devant l’auxiliaire : ", { link: "Les pronoms compléments", to: "fr.pronoms.pronoms-complements" }, "."]
              en: ["Object pronouns stand before the auxiliary: ", { link: "Object Pronouns", to: fr.pronoms.pronoms-complements }, "."]
              uk: ["Займенники-додатки стоять перед допоміжним дієсловом: ", { link: "Займенники-додатки", to: "fr.pronoms.pronoms-complements" }, "."]
              es: ["Los pronombres complemento van delante del auxiliar: ", { link: "Los pronombres complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pt: ["Os pronomes complemento ficam antes do auxiliar: ", { link: "Os pronomes complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              de: ["Die Objektpronomen stehen vor dem Hilfsverb: ", { link: "Die Objektpronomen", to: "fr.pronoms.pronoms-complements" }, "."]
              it: ["I pronomi complemento stanno davanti all’ausiliare: ", { link: "I pronomi complemento", to: "fr.pronoms.pronoms-complements" }, "."]
              pl: ["Zaimki dopełnieniowe stoją przed czasownikiem posiłkowym: ", { link: "Zaimki dopełnieniowe", to: "fr.pronoms.pronoms-complements" }, "."]
              tr: ["Nesne zamirleri yardımcı fiilin önünde durur: ", { link: "Nesne zamirleri", to: "fr.pronoms.pronoms-complements" }, "."]
              id: ["Pronomina objek berada di depan kata kerja bantu: ", { link: "Pronomina objek", to: "fr.pronoms.pronoms-complements" }, "."]
