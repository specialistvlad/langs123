summary:
  lead:
    fr: ["Le passé composé associe ", { term: "avoir" }, " ou ", { term: "être" }, " à un participe passé pour dire ce qui s’est passé : ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    en: ["The passé composé joins ", { term: "avoir" }, " or ", { term: "être" }, " to a past participle to say what happened: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    uk: ["Passé composé поєднує ", { term: "avoir" }, " або ", { term: "être" }, " з дієприкметником минулого часу й розповідає, що сталося: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    es: ["El passé composé une ", { term: "avoir" }, " o ", { term: "être" }, " con un participio y cuenta lo que pasó: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    pt: ["O passé composé junta ", { term: "avoir" }, " ou ", { term: "être" }, " a um particípio e conta o que aconteceu: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    de: ["Das Passé composé verbindet ", { term: "avoir" }, " oder ", { term: "être" }, " mit dem Partizip Perfekt und sagt, was passiert ist: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    it: ["Il passé composé unisce ", { term: "avoir" }, " o ", { term: "être" }, " a un participio passato e dice che cosa è successo: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    pl: ["Passé composé łączy ", { term: "avoir" }, " lub ", { term: "être" }, " z imiesłowem przeszłym i mówi, co się wydarzyło: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    tr: ["Passé composé, ne olduğunu anlatmak için ", { term: "avoir" }, " ya da ", { term: "être" }, " ile geçmiş zaman ortacını birleştirir: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    id: ["Passé composé menggabungkan ", { term: "avoir" }, " atau ", { term: "être" }, " dengan partisip lampau untuk menyatakan apa yang terjadi: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
    vi: ["Passé composé ghép ", { term: "avoir" }, " hoặc ", { term: "être" }, " với quá khứ phân từ để nói điều đã xảy ra: ", { term: "j’ai mangé" }, ", ", { term: "je suis parti" }, "."]
  rule:
    fr: ["Presque tous les verbes prennent ", { term: "avoir" }, " ; une courte liste prend ", { term: "être" }, " :"]
    en: ["Almost every verb takes ", { term: "avoir" }, "; a short list of verbs takes ", { term: "être" }, ":"]
    uk: ["Майже всі дієслова беруть ", { term: "avoir" }, "; короткий список дієслів бере ", { term: "être" }, ":"]
    es: ["Casi todos los verbos llevan ", { term: "avoir" }, "; una lista corta lleva ", { term: "être" }, ":"]
    pt: ["Quase todos os verbos levam ", { term: "avoir" }, "; uma lista curta leva ", { term: "être" }, ":"]
    de: ["Fast alle Verben stehen mit ", { term: "avoir" }, "; eine kurze Liste steht mit ", { term: "être" }, ":"]
    it: ["Quasi tutti i verbi vogliono ", { term: "avoir" }, "; un breve elenco vuole ", { term: "être" }, ":"]
    pl: ["Prawie wszystkie czasowniki łączą się z ", { term: "avoir" }, "; krótka lista łączy się z ", { term: "être" }, ":"]
    tr: ["Fiillerin hemen hepsi ", { term: "avoir" }, " alır; kısa bir liste ", { term: "être" }, " alır:"]
    id: ["Hampir semua kata kerja memakai ", { term: "avoir" }, "; satu daftar pendek memakai ", { term: "être" }, ":"]
    vi: ["Hầu hết động từ đi với ", { term: "avoir" }, "; một danh sách ngắn đi với ", { term: "être" }, ":"]
  ex: { examples: [["J’", { target: "ai mangé" }, " ici."], ["Je ", { target: "suis allé" }, " là-bas."]] }
