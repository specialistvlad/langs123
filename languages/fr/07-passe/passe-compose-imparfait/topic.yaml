              uk: "обставини, без видимого кінця"
              es: "el fondo, sin final a la vista"
              pt: "o pano de fundo, sem fim à vista"
              de: "der Hintergrund, ohne absehbares Ende"
              it: "lo sfondo, senza una fine in vista"
              pl: "tło, bez widocznego końca"
              tr: "arka plan, sonu görünmeden"
              id: "latar, tanpa akhir yang terlihat"
              vi: "bối cảnh, không thấy điểm kết thúc"
          - level: "A2"
            pc:
              ex: ["J’", { target: "ai habité" }, " deux ans à Lyon."]
              tr: { en: "I lived in Lyon for two years.", uk: "Я два роки жив у Ліоні.", es: "Viví dos años en Lyon.", pt: "Eu morei dois anos em Lyon.", de: "Ich habe zwei Jahre in Lyon gewohnt.", it: "Ho abitato due anni a Lione.", pl: "Mieszkałem w Lyonie dwa lata.", tr: "Lyon’da iki yıl yaşadım.", id: "Aku tinggal dua tahun di Lyon.", vi: "Tôi đã sống ở Lyon hai năm." }
