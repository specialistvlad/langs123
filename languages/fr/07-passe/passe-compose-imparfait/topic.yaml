              uk: "період із тривалістю, що вже минув"
              es: "un período con su duración, ya terminado"
              pt: "um período com sua duração, já terminado"
              de: "ein Zeitraum mit genannter Dauer, der vorbei ist"
              it: "un periodo con la sua durata, ormai concluso"
              pl: "okres z podaną długością, już zakończony"
              tr: "süresi belirtilen, artık sona ermiş bir dönem"
              id: "periode dengan lamanya yang sudah berakhir"
              vi: "một khoảng thời gian có nêu độ dài, nay đã kết thúc"
            imp:
