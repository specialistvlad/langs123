sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              fr: "Les deux temps montrent le même passé sous deux angles : le passé composé voit l’événement en entier, l’imparfait le voit se dérouler."
              en: "The two tenses show the same past from two sides: the passé composé sees the whole event, the imparfait sees it going on."
              uk: "Два часи показують те саме минуле з двох боків: passé composé бачить подію цілком, imparfait — у її перебігу."
              es: "Los dos tiempos muestran el mismo pasado desde dos lados: el passé composé ve el hecho entero; el imparfait, su desarrollo."
              pt: "Os dois tempos mostram o mesmo passado por dois lados: o passé composé vê o fato inteiro; o imparfait o vê em andamento."
              de: "Die beiden Zeiten zeigen dieselbe Vergangenheit von zwei Seiten: Das Passé composé sieht das ganze Ereignis, das Imparfait sieht es im Verlauf."
              it: "I due tempi mostrano lo stesso passato da due lati: il passé composé vede il fatto intero, l’imparfait lo vede mentre si svolge."
              pl: "Te dwa czasy pokazują tę samą przeszłość z dwóch stron: passé composé widzi całe zdarzenie, imparfait widzi je w trakcie."
              tr: "İki zaman aynı geçmişi iki yönden gösterir: passé composé olayı bütün olarak, imparfait ise sürerken görür."
              id: "Kedua tense menunjukkan masa lalu yang sama dari dua sisi: passé composé melihat seluruh kejadian, imparfait melihatnya sedang berlangsung."
              vi: "Hai thì cho thấy cùng một quá khứ từ hai phía: passé composé nhìn toàn bộ sự việc, imparfait nhìn nó đang diễn ra."
            ex: { examples: [["Hier, il ", { target: "a plu" }, " toute la journée."], ["Hier, il ", { target: "pleuvait" }, " quand je suis sorti."]] }
            tr: { en: { examples: ["Yesterday it rained all day.", "Yesterday it was raining when I went out."] }, uk: { examples: ["Учора цілий день ішов дощ.", "Учора, коли я вийшов, ішов дощ."] }, es: { examples: ["Ayer llovió todo el día.", "Ayer llovía cuando salí."] }, pt: { examples: ["Ontem choveu o dia todo.", "Ontem estava chovendo quando eu saí."] }, de: { examples: ["Gestern hat es den ganzen Tag geregnet.", "Gestern regnete es, als ich hinausging."] }, it: { examples: ["Ieri è piovuto tutto il giorno.", "Ieri pioveva quando sono uscito."] }, pl: { examples: ["Wczoraj padało cały dzień.", "Wczoraj padało, kiedy wychodziłem."] }, tr: { examples: ["Dün bütün gün yağmur yağdı.", "Dün dışarı çıktığımda yağmur yağıyordu."] }, id: { examples: ["Kemarin hujan sepanjang hari.", "Kemarin hujan sedang turun ketika aku keluar."] }, vi: { examples: ["Hôm qua trời mưa cả ngày.", "Hôm qua, khi tôi ra ngoài thì trời đang mưa."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: ["Un mot de temps aide, mais le sens décide : ", { term: "hier" }, " va avec les deux temps."]
              en: ["A time word helps, but the meaning decides: ", { term: "hier" }, " goes with both tenses."]
              uk: ["Слово часу допомагає, але вирішує зміст: ", { term: "hier" }, " вживається з обома часами."]
              es: ["La palabra de tiempo ayuda, pero decide el sentido: ", { term: "hier" }, " va con los dos tiempos."]
              pt: ["A palavra de tempo ajuda, mas o sentido decide: ", { term: "hier" }, " combina com os dois tempos."]
              de: ["Die Zeitangabe hilft, aber der Sinn entscheidet: ", { term: "hier" }, " passt zu beiden Zeiten."]
              it: ["La parola di tempo aiuta, ma decide il senso: ", { term: "hier" }, " va con entrambi i tempi."]
              pl: ["Słowo określające czas pomaga, ale rozstrzyga sens: ", { term: "hier" }, " pasuje do obu czasów."]
              tr: ["Zaman sözcüğü yardımcı olur ama anlam belirler: ", { term: "hier" }, " iki zamanla da kullanılır."]
              id: ["Kata keterangan waktu membantu, tetapi maknalah yang menentukan: ", { term: "hier" }, " cocok dengan kedua tense."]
              vi: ["Từ chỉ thời gian giúp ích, nhưng ý nghĩa mới quyết định: ", { term: "hier" }, " đi được với cả hai thì."]
            ex: { examples: [[{ signal: "Hier" }, ", j’", { target: "ai travaillé" }, "."], [{ signal: "Hier" }, ", je ", { target: "travaillais" }, " quand tu as appelé."]] }
            tr: { en: { examples: ["I worked yesterday.", "Yesterday I was working when you called."] }, uk: { examples: ["Учора я працював.", "Учора я працював, коли ти зателефонував."] }, es: { examples: ["Ayer trabajé.", "Ayer trabajaba cuando llamaste."] }, pt: { examples: ["Ontem eu trabalhei.", "Ontem eu trabalhava quando você ligou."] }, de: { examples: ["Gestern habe ich gearbeitet.", "Gestern arbeitete ich, als du angerufen hast."] }, it: { examples: ["Ieri ho lavorato.", "Ieri lavoravo quando hai chiamato."] }, pl: { examples: ["Wczoraj pracowałem.", "Wczoraj pracowałem, kiedy zadzwoniłeś."] }, tr: { examples: ["Dün çalıştım.", "Dün sen aradığında çalışıyordum."] }, id: { examples: ["Kemarin aku bekerja.", "Kemarin aku sedang bekerja ketika kamu menelepon."] }, vi: { examples: ["Hôm qua tôi đã làm việc.", "Hôm qua tôi đang làm việc thì bạn gọi."] } }
          - type: "note"
            level: "A2"
            text:
              fr: ["Les formes : ", { link: "Le passé composé : j’ai mangé", to: fr.passe.passe-compose }, " et ", { link: "L’imparfait : je parlais", to: fr.passe.imparfait }, "."]
              en: ["The forms: ", { link: "Passé Composé: j’ai mangé", to: fr.passe.passe-compose }, " and ", { link: "Imperfect: je parlais", to: fr.passe.imparfait }, "."]
              uk: ["Форми: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " і ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              es: ["Las formas: ", { link: "El passé composé: j’ai mangé", to: fr.passe.passe-compose }, " y ", { link: "El imparfait: je parlais", to: fr.passe.imparfait }, "."]
              pt: ["As formas: ", { link: "O passé composé: j’ai mangé", to: fr.passe.passe-compose }, " e ", { link: "O imparfait: je parlais", to: fr.passe.imparfait }, "."]
              de: ["Die Formen: ", { link: "Das Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " und ", { link: "Das Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              it: ["Le forme: ", { link: "Il passé composé: j’ai mangé", to: fr.passe.passe-compose }, " e ", { link: "L’imparfait: je parlais", to: fr.passe.imparfait }, "."]
              pl: ["Formy: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " i ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              tr: ["Biçimler: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " ve ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              id: ["Bentuknya: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " dan ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
              vi: ["Các dạng: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, " và ", { link: "Imparfait: je parlais", to: fr.passe.imparfait }, "."]
