              uk: "один раз або конкретну кількість разів"
              es: "una vez, o un número concreto de veces"
              pt: "uma vez, ou um número definido de vezes"
              de: "einmal oder eine genannte Anzahl von Malen"
              it: "una volta, o un numero preciso di volte"
              pl: "jeden raz lub podaną liczbę razy"
              tr: "bir kez ya da belirli sayıda kez"
              id: "sekali, atau beberapa kali dengan jumlah yang disebutkan"
              vi: "một lần, hoặc một số lần được nêu rõ"
            imp:
              fr: "une habitude, sans nombre de fois"
              en: "a habit, with no number"
              uk: "звичка, без кількості разів"
              es: "un hábito, sin número de veces"
              pt: "um hábito, sem número de vezes"
              de: "eine Gewohnheit, ohne Zahl"
              it: "un’abitudine, senza numero di volte"
              pl: "zwyczaj, bez podanej liczby razy"
              tr: "alışkanlık, sayı belirtilmeden"
              id: "kebiasaan, tanpa jumlah kali"
              vi: "một thói quen, không nêu số lần"
          - level: "A2"
            pc:
              ex: ["L’été dernier, je ", { target: "suis allé" }, " trois fois à la plage."]
              tr: { en: "Last summer I went to the beach three times.", uk: "Минулого літа я тричі їздив на пляж.", es: "El verano pasado fui tres veces a la playa.", pt: "No verão passado, fui três vezes à praia.", de: "Letzten Sommer bin ich dreimal an den Strand gefahren.", it: "L’estate scorsa sono andato tre volte in spiaggia.", pl: "Zeszłego lata byłem na plaży trzy razy.", tr: "Geçen yaz üç kez plaja gittim.", id: "Musim panas lalu aku pergi ke pantai tiga kali.", vi: "Mùa hè năm ngoái tôi đã ra bãi biển ba lần." }
            imp:
              ex: ["Chaque été, j’", { target: "allais" }, " à la plage."]
              tr: { en: "I went to the beach every summer.", uk: "Щоліта я їздив на пляж.", es: "Cada verano iba a la playa.", pt: "Todo verão eu ia à praia.", de: "Jeden Sommer fuhr ich an den Strand.", it: "Ogni estate andavo in spiaggia.", pl: "Co lato chodziłem na plażę.", tr: "Her yaz plaja giderdim.", id: "Setiap musim panas aku biasa pergi ke pantai.", vi: "Mùa hè nào tôi cũng ra bãi biển." }
          - level: "A2"
