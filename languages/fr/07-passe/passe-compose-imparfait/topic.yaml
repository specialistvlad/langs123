              tr: { en: "I had a pizza last night.", uk: "Учора ввечері я з’їв піцу.", es: "Anoche comí una pizza.", pt: "Ontem à noite eu comi uma pizza.", de: "Gestern Abend habe ich eine Pizza gegessen.", it: "Ieri sera ho mangiato una pizza.", pl: "Wczoraj wieczorem zjadłem pizzę.", tr: "Dün akşam pizza yedim.", id: "Tadi malam aku makan pizza.", vi: "Tối qua tôi đã ăn một cái pizza." }
            imp:
              ex: ["La pizza ", { target: "était" }, " délicieuse."]
              tr: { en: "The pizza was delicious.", uk: "Піца була дуже смачна.", es: "La pizza estaba deliciosa.", pt: "A pizza estava deliciosa.", de: "Die Pizza war köstlich.", it: "La pizza era squisita.", pl: "Pizza była pyszna.", tr: "Pizza çok lezzetliydi.", id: "Pizzanya enak sekali.", vi: "Cái pizza rất ngon." }
          - level: "A2"
