              id: "kejadian yang sudah selesai: apa yang terjadi"
              vi: "sự việc đã kết thúc: điều đã xảy ra"
            imp:
              fr: "le décor : comment étaient les choses"
              en: "the scene: how things were"
              uk: "обставини: як усе було"
              es: "el escenario: cómo eran las cosas"
              pt: "o cenário: como as coisas eram"
