summary:
  lead:
    fr: ["Le passé composé raconte les événements finis, et l’imparfait décrit le décor autour : ", { term: "il pleuvait quand je suis sorti" }, "."]
    en: ["The passé composé tells finished events, and the imparfait describes the scene around them: ", { term: "il pleuvait quand je suis sorti" }, "."]
    uk: ["Passé composé розповідає про завершені події, а imparfait описує обставини навколо них: ", { term: "il pleuvait quand je suis sorti" }, "."]
    es: ["El passé composé cuenta los hechos terminados, y el imparfait describe el escenario que los rodea: ", { term: "il pleuvait quand je suis sorti" }, "."]
    pt: ["O passé composé conta os fatos concluídos, e o imparfait descreve o cenário em volta deles: ", { term: "il pleuvait quand je suis sorti" }, "."]
    de: ["Das Passé composé erzählt abgeschlossene Ereignisse, das Imparfait beschreibt den Hintergrund dazu: ", { term: "il pleuvait quand je suis sorti" }, "."]
    it: ["Il passé composé racconta i fatti conclusi, l’imparfait descrive lo sfondo che li circonda: ", { term: "il pleuvait quand je suis sorti" }, "."]
    pl: ["Passé composé opowiada o zdarzeniach zakończonych, a imparfait opisuje tło, na którym się dzieją: ", { term: "il pleuvait quand je suis sorti" }, "."]
    tr: ["Passé composé bitmiş olayları anlatır, imparfait onları çevreleyen arka planı betimler: ", { term: "il pleuvait quand je suis sorti" }, "."]
    id: ["Passé composé menceritakan kejadian yang sudah selesai, sedangkan imparfait menggambarkan latar di sekitarnya: ", { term: "il pleuvait quand je suis sorti" }, "."]
    vi: ["Passé composé kể các sự việc đã kết thúc, còn imparfait tả bối cảnh xung quanh chúng: ", { term: "il pleuvait quand je suis sorti" }, "."]
  rule:
    fr: "L’événement qui interrompt se met au passé composé, et l’action en cours à l’imparfait :"
    en: "The event that breaks in takes the passé composé, and the action going on takes the imparfait:"
    uk: "Подія, що перериває іншу, стоїть у passé composé, а дія, що триває, — в imparfait:"
    es: "El hecho que interrumpe lleva el passé composé, y la acción en curso, el imparfait:"
    pt: "O fato que interrompe leva o passé composé, e a ação em andamento leva o imparfait:"
    de: "Das unterbrechende Ereignis steht im Passé composé, die laufende Handlung im Imparfait:"
    it: "Il fatto che interrompe vuole il passé composé, e l’azione in corso l’imparfait:"
    pl: "Zdarzenie, które przerywa, stoi w passé composé, a czynność w toku w imparfait:"
    tr: "Kesen olay passé composé ile, süren eylem imparfait ile söylenir:"
    id: "Kejadian yang memotong memakai passé composé, dan tindakan yang sedang berlangsung memakai imparfait:"
    vi: "Sự việc cắt ngang dùng passé composé, còn hành động đang diễn ra dùng imparfait:"
  ex: ["Je ", { target: "dormais" }, " quand le téléphone ", { target: "a sonné" }, "."]
