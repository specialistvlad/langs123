    role: "signals"
    features: { tense: "pst", aspect: "ipfv" }
    content:
      - type: "usage"
        columns:
          - key: "marker"
            label:
              fr: "Mot-clé"
              en: "Time word"
              uk: "Слово-маркер"
              es: "Expresión de tiempo"
              pt: "Palavra indicadora"
              de: "Signalwort"
              it: "Parola spia"
              pl: "Słowo sygnalne"
              tr: "Anahtar sözcük"
              id: "Kata penanda"
              vi: "Từ chỉ thời gian"
          - { key: "ex", label: { fr: "Exemple", en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A2"
            marker: "avant, autrefois, à cette époque"
            ex: [{ signal: "Avant" }, ", j’", { target: "habitais" }, " à Nice."]
            tr: { en: "I used to live in Nice.", uk: "Раніше я жив у Ніцці.", es: "Antes vivía en Niza.", pt: "Antes eu morava em Nice.", de: "Früher wohnte ich in Nizza.", it: "Prima abitavo a Nizza.", pl: "Wcześniej mieszkałem w Nicei.", tr: "Eskiden Nice’te yaşardım.", id: "Dulu aku tinggal di Nice.", vi: "Trước đây tôi sống ở Nice." }
          - level: "A2"
            marker: "quand j’étais petit, quand j’avais dix ans"
            ex: [{ signal: "Quand j’étais petit" }, ", je ", { target: "jouais" }, " au foot."]
            tr: { en: "When I was little, I played football.", uk: "Коли я був малим, я грав у футбол.", es: "Cuando era pequeño, jugaba al fútbol.", pt: "Quando eu era pequeno, jogava futebol.", de: "Als ich klein war, spielte ich Fußball.", it: "Quando ero piccolo, giocavo a calcio.", pl: "Kiedy byłem mały, grałem w piłkę nożną.", tr: "Küçükken futbol oynardım.", id: "Waktu kecil, aku bermain sepak bola.", vi: "Hồi nhỏ tôi chơi bóng đá." }
          - level: "A2"
            marker: "toujours, souvent, d’habitude, tous les jours"
            ex: [{ signal: "D’habitude" }, ", nous ", { target: "mangions" }, " à sept heures."]
            tr: { en: "Usually we ate at seven.", uk: "Зазвичай ми їли о сьомій.", es: "Normalmente comíamos a las siete.", pt: "Normalmente nós comíamos às sete.", de: "Normalerweise aßen wir um sieben Uhr.", it: "Di solito mangiavamo alle sette.", pl: "Zwykle jedliśmy o siódmej.", tr: "Genellikle yedide yerdik.", id: "Biasanya kami makan pukul tujuh.", vi: "Thường thì chúng tôi ăn lúc bảy giờ." }
          - level: "A2"
            marker: "le lundi, le soir, chaque été"
            ex: [{ signal: "Le soir" }, ", elle ", { target: "lisait" }, " un livre."]
            tr: { en: "In the evening she read a book.", uk: "Увечері вона читала книжку.", es: "Por la noche leía un libro.", pt: "À noite ela lia um livro.", de: "Abends las sie ein Buch.", it: "La sera leggeva un libro.", pl: "Wieczorem czytała książkę.", tr: "Akşamları kitap okurdu.", id: "Setiap malam dia membaca buku.", vi: "Buổi tối cô ấy thường đọc sách." }
      - type: "list"
        items:
          - type: "note"
            level: "A2"
            text:
              fr: ["Un mot de temps ne suffit pas pour choisir le temps du passé : ", { link: "Passé composé ou imparfait ?", to: fr.passe.passe-compose-imparfait }, "."]
              en: ["A time word alone does not choose the past tense: ", { link: "Passé Composé or Imperfect", to: fr.passe.passe-compose-imparfait }, "."]
              uk: ["Саме слово часу не визначає минулий час: ", { link: "Passé composé чи imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              es: ["La palabra de tiempo sola no decide el tiempo del pasado: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pt: ["A palavra de tempo sozinha não decide o tempo do passado: ", { link: "Passé composé ou imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              de: ["Die Zeitangabe allein entscheidet nicht über die Vergangenheitszeit: ", { link: "Passé composé oder Imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              it: ["La parola di tempo da sola non decide il tempo del passato: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pl: ["Samo słowo określające czas nie rozstrzyga o czasie przeszłym: ", { link: "Passé composé czy imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              tr: ["Zaman sözcüğü tek başına geçmiş zamanı belirlemez: ", { link: "Passé composé mı, imparfait mı?", to: "fr.passe.passe-compose-imparfait" }, "."]
              id: ["Kata keterangan waktu saja tidak menentukan tense lampau: ", { link: "Passé composé atau imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              vi: ["Riêng từ chỉ thời gian chưa quyết định được thì quá khứ: ", { link: "Passé composé hay imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
