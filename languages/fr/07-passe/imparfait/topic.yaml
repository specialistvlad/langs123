          tr: { en: "I used to live in Nice.", uk: "Раніше я жив у Ніцці.", es: "Antes vivía en Niza.", pt: "Antes eu morava em Nice.", de: "Früher wohnte ich in Nizza.", it: "Prima abitavo a Nizza.", pl: "Wcześniej mieszkałem w Nicei.", tr: "Eskiden Nice’te yaşardım.", id: "Dulu aku tinggal di Nice.", vi: "Trước đây tôi sống ở Nice." }
        - level: "A2"
