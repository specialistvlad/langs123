sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              fr: "L’imparfait décrit le décor : comment étaient les personnes, les lieux et le temps."
              en: "The imparfait describes the scene: how people, places and the weather were."
              uk: "Imparfait описує обставини: якими були люди, місця й погода."
              es: "El imparfait describe el escenario: cómo eran las personas, los lugares y el tiempo."
              pt: "O imparfait descreve o cenário: como eram as pessoas, os lugares e o tempo."
              de: "Das Imparfait beschreibt den Hintergrund: wie Menschen, Orte und das Wetter waren."
              it: "L’imparfait descrive lo sfondo: com’erano le persone, i luoghi e il tempo."
              pl: "Imparfait opisuje tło: jacy byli ludzie, jakie były miejsca i pogoda."
              tr: "Imparfait arka planı betimler: insanların, yerlerin ve havanın nasıl olduğunu."
              id: "Imparfait menggambarkan latar: bagaimana orang, tempat, dan cuaca saat itu."
              vi: "Imparfait tả bối cảnh: người, nơi chốn và thời tiết đã như thế nào."
            ex: ["Il ", { target: "faisait" }, " beau et la maison ", { target: "était" }, " calme."]
            tr: { en: "The weather was fine and the house was quiet.", uk: "Була гарна погода, і в будинку було тихо.", es: "Hacía buen tiempo y la casa estaba tranquila.", pt: "Fazia bom tempo e a casa estava calma.", de: "Das Wetter war schön und das Haus war ruhig.", it: "Faceva bel tempo e la casa era tranquilla.", pl: "Była ładna pogoda, a dom był cichy.", tr: "Hava güzeldi ve ev sessizdi.", id: "Cuacanya cerah dan rumah itu tenang.", vi: "Trời đẹp và ngôi nhà yên tĩnh." }
          - type: "rule"
            level: "A2"
            text:
              fr: "Il dit aussi ce qu’on faisait d’habitude, sans compter les fois."
              en: "It also tells what people did regularly, without counting the times."
              uk: "Він також розповідає, що робили зазвичай, не рахуючи разів."
              es: "También cuenta lo que se hacía habitualmente, sin contar las veces."
              pt: "Também conta o que se fazia habitualmente, sem contar as vezes."
              de: "Er sagt auch, was man üblicherweise tat, ohne die Male zu zählen."
              it: "Dice anche ciò che si faceva abitualmente, senza contare le volte."
              pl: "Mówi też o tym, co robiło się zwykle, bez liczenia razy."
              tr: "Ayrıca alışkanlıkla yapılanı, kaç kez olduğunu saymadan anlatır."
              id: "Imparfait juga menceritakan apa yang biasa dilakukan, tanpa menghitung jumlah kalinya."
              vi: "Nó cũng kể điều thường làm, không đếm số lần."
            ex: ["Le dimanche, nous ", { target: "mangions" }, " chez ma grand-mère."]
            tr: { en: "On Sundays we ate at my grandmother's.", uk: "У неділю ми обідали в моєї бабусі.", es: "Los domingos comíamos en casa de mi abuela.", pt: "Aos domingos, nós almoçávamos na casa da minha avó.", de: "Sonntags aßen wir bei meiner Großmutter.", it: "La domenica mangiavamo da mia nonna.", pl: "W niedziele jedliśmy obiad u mojej babci.", tr: "Pazar günleri büyükannemde yemek yerdik.", id: "Setiap hari Minggu kami makan di rumah nenekku.", vi: "Chủ nhật nào chúng tôi cũng ăn ở nhà bà tôi." }
          - type: "rule"
            level: "A2"
            text:
              fr: "Il montre une action en cours : on ne voit ni son début ni sa fin."
              en: "It shows an action in progress: neither its start nor its end is in view."
              uk: "Він показує дію в процесі: ні початку, ні кінця не видно."
              es: "Muestra una acción en curso: no se ve ni su principio ni su final."
              pt: "Mostra uma ação em andamento: não se vê nem o começo nem o fim."
              de: "Er zeigt eine Handlung im Verlauf: Weder Anfang noch Ende sind im Blick."
              it: "Mostra un’azione in corso: non se ne vede né l’inizio né la fine."
              pl: "Pokazuje czynność w toku: nie widać ani jej początku, ani końca."
              tr: "Süren bir eylemi gösterir: ne başlangıcı ne de sonu görünür."
              id: "Imparfait menunjukkan tindakan yang sedang berlangsung: awal dan akhirnya tidak terlihat."
              vi: "Nó cho thấy một hành động đang diễn ra: không thấy lúc bắt đầu lẫn lúc kết thúc."
            ex: ["Je ", { target: "lisais" }, " dans ma chambre."]
            tr: { en: "I was reading in my room.", uk: "Я читав у своїй кімнаті.", es: "Leía en mi habitación.", pt: "Eu lia no meu quarto.", de: "Ich las in meinem Zimmer.", it: "Leggevo nella mia camera.", pl: "Czytałem w swoim pokoju.", tr: "Odamda okuyordum.", id: "Aku sedang membaca di kamarku.", vi: "Tôi đang đọc sách trong phòng." }
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour un événement fini, le passé utilise le passé composé : ", { link: "Le passé composé : j’ai mangé", to: fr.passe.passe-compose }, "."]
              en: ["For a finished event, the past uses the passé composé: ", { link: "Passé Composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              uk: ["Для завершеної події минуле вживає passé composé: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              es: ["Para un hecho terminado, el pasado usa el passé composé: ", { link: "El passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pt: ["Para um fato concluído, o passado usa o passé composé: ", { link: "O passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              de: ["Für ein abgeschlossenes Ereignis nutzt die Vergangenheit das Passé composé: ", { link: "Das Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              it: ["Per un fatto concluso, il passato usa il passé composé: ", { link: "Il passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              pl: ["Do zakończonego zdarzenia przeszłość używa passé composé: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              tr: ["Bitmiş bir olay için geçmiş passé composé kullanır: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              id: ["Untuk kejadian yang sudah selesai, masa lampau memakai passé composé: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
              vi: ["Với một sự việc đã kết thúc, quá khứ dùng passé composé: ", { link: "Passé composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Le choix entre les deux temps du passé : ", { link: "Passé composé ou imparfait ?", to: fr.passe.passe-compose-imparfait }, "."]
              en: ["The choice between the two past tenses: ", { link: "Passé Composé or Imperfect", to: fr.passe.passe-compose-imparfait }, "."]
              uk: ["Вибір між двома минулими часами: ", { link: "Passé composé чи imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              es: ["La elección entre los dos tiempos del pasado: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pt: ["A escolha entre os dois tempos do passado: ", { link: "Passé composé ou imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              de: ["Die Wahl zwischen den beiden Vergangenheitszeiten: ", { link: "Passé composé oder Imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              it: ["La scelta tra i due tempi del passato: ", { link: "Passé composé o imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              pl: ["Wybór między dwoma czasami przeszłymi: ", { link: "Passé composé czy imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              tr: ["İki geçmiş zaman arasındaki seçim: ", { link: "Passé composé mı, imparfait mı?", to: "fr.passe.passe-compose-imparfait" }, "."]
              id: ["Pilihan antara kedua tense lampau: ", { link: "Passé composé atau imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
              vi: ["Cách chọn giữa hai thì quá khứ: ", { link: "Passé composé hay imparfait", to: "fr.passe.passe-compose-imparfait" }, "."]
  - title:
      fr: "Forme : les terminaisons"
      en: "Form: the endings"
      uk: "Форма: закінчення"
      es: "Forma: las terminaciones"
      pt: "Forma: as terminações"
      de: "Form: die Endungen"
      it: "Forma: le desinenze"
      pl: "Forma: końcówki"
      tr: "Biçim: ekler"
      id: "Bentuk: akhiran"
      vi: "Dạng: đuôi động từ"
    role: "form"
    features: { tense: "pst", aspect: "ipfv" }
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: "parler", label: "parler" }
          - { key: "finir", label: "finir" }
          - { key: "faire", label: "faire" }
        rows:
          - level: "A2"
            features: { person: 1, number: "sg" }
            person: { alternatives: ["je", "j’"] }
            parler: { target: ["parl", { ending: "ais" }] }
            finir: { target: ["finiss", { ending: "ais" }] }
            faire: { target: ["fais", { ending: "ais" }] }
          - level: "A2"
            features: { person: 2, number: "sg", politeness: "infm" }
            person: "tu"
            parler: { target: ["parl", { ending: "ais" }] }
            finir: { target: ["finiss", { ending: "ais" }] }
            faire: { target: ["fais", { ending: "ais" }] }
          - level: "A2"
            features: { person: 3, number: "sg" }
            person: { alternatives: ["il", "elle", "on"] }
            parler: { target: ["parl", { ending: "ait" }] }
            finir: { target: ["finiss", { ending: "ait" }] }
            faire: { target: ["fais", { ending: "ait" }] }
          - level: "A2"
            features: { person: 1, number: "pl" }
