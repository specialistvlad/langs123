summary:
  lead:
    fr: ["L’imparfait décrit comment étaient les choses et ce qu’on faisait d’habitude : ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    en: ["The imparfait describes how things were and what used to happen: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    uk: ["Imparfait описує, якими були речі і що зазвичай відбувалося: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    es: ["El imparfait describe cómo eran las cosas y lo que ocurría habitualmente: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    pt: ["O imparfait descreve como as coisas eram e o que acontecia habitualmente: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    de: ["Das Imparfait beschreibt, wie die Dinge waren und was üblicherweise geschah: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    it: ["L’imparfait descrive com’erano le cose e che cosa accadeva abitualmente: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    pl: ["Imparfait opisuje, jakie rzeczy były i co zwykle się działo: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    tr: ["Imparfait, şeylerin nasıl olduğunu ve alışkanlıkla neler olduğunu anlatır: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    id: ["Imparfait menggambarkan keadaan di masa lalu dan apa yang biasa terjadi: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
    vi: ["Imparfait miêu tả sự việc đã như thế nào và điều thường xảy ra: ", { term: "j’étais" }, ", ", { term: "je parlais" }, ", ", { term: "il faisait" }, "."]
  rule:
    fr: ["Le radical est celui de ", { term: "nous" }, " au présent, sans ", { term: "-ons" }, " ; seul ", { term: "être" }, " fait exception :"]
    en: ["The stem is the ", { term: "nous" }, " form of the present without ", { term: "-ons" }, "; only ", { term: "être" }, " is an exception:"]
    uk: ["Основу беруть із форми ", { term: "nous" }, " теперішнього часу без ", { term: "-ons" }, "; виняток лише ", { term: "être" }, ":"]
    es: ["La raíz es la forma de ", { term: "nous" }, " del presente sin ", { term: "-ons" }, "; solo ", { term: "être" }, " es excepción:"]
    pt: ["O radical é a forma de ", { term: "nous" }, " do presente sem ", { term: "-ons" }, "; só ", { term: "être" }, " é exceção:"]
    de: ["Der Stamm ist die ", { term: "nous" }, "-Form des Präsens ohne ", { term: "-ons" }, "; nur ", { term: "être" }, " ist eine Ausnahme:"]
    it: ["La radice è la forma di ", { term: "nous" }, " del presente senza ", { term: "-ons" }, "; solo ", { term: "être" }, " fa eccezione:"]
    pl: ["Temat to forma ", { term: "nous" }, " czasu teraźniejszego bez ", { term: "-ons" }, "; wyjątkiem jest tylko ", { term: "être" }, ":"]
    tr: ["Gövde, şimdiki zamanda ", { term: "nous" }, " biçiminden ", { term: "-ons" }, " atılarak bulunur; tek istisna ", { term: "être" }, ":"]
    id: ["Batang kata diambil dari bentuk ", { term: "nous" }, " presens tanpa ", { term: "-ons" }, "; hanya ", { term: "être" }, " yang pengecualian:"]
    vi: ["Gốc từ lấy ở dạng ", { term: "nous" }, " của thì hiện tại bỏ ", { term: "-ons" }, "; chỉ ", { term: "être" }, " là ngoại lệ:"]
  ex: { examples: [["Je ", { target: "parlais" }, " avec Léa."], ["J’", { target: "étais" }, " content."]] }
