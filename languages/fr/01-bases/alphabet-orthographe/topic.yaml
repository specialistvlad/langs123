summary:
  lead:
    fr: "Les 26 lettres de l’alphabet français avec leurs noms, les accents et la cédille qui s’écrivent sur elles, et la façon d’épeler un mot."
    en: "The 26 letters of the French alphabet with their names, the accents and the cedilla written on them, and how to spell a word aloud."
    uk: "Французький алфавіт із 26 літер та їхніми назвами, значки над літерами й під літерою ç, а також спосіб назвати слово по літерах."
    es: "Las 26 letras del alfabeto francés con sus nombres, los acentos y la cedilla que se escriben sobre ellas, y cómo deletrear una palabra."
    pt: "As 26 letras do alfabeto francês com seus nomes, os acentos e a cedilha escritos sobre elas e o modo de soletrar uma palavra."
    de: "Die 26 Buchstaben des französischen Alphabets mit ihren Namen, die Akzente und die Cedille auf ihnen und das Buchstabieren eines Wortes."
    it: "Le 26 lettere dell'alfabeto francese con i loro nomi, gli accenti e la cediglia che si scrivono su di esse, e il modo di sillabare una parola."
    pl: "Alfabet francuski z 26 literami i ich nazwami, akcenty i cedylla, które się przy nich pisze, oraz sposób literowania wyrazu."
    tr: "Fransız alfabesinin 26 harfi ve adları, harflerin üstüne yazılan aksanlar ile cedilla ve bir sözcüğü harf harf söyleme."
    id: "Alfabet Prancis dengan 26 huruf beserta namanya, aksen dan cedilla yang ditulis pada huruf, serta cara mengeja sebuah kata."
    vi: "Bảng chữ cái tiếng Pháp gồm 26 chữ cái cùng tên của chúng, các dấu và dấu cédille viết trên chữ, và cách đánh vần một từ."
  rule:
    fr: "Un accent fait partie du mot et distingue parfois deux mots :"
    en: "An accent is part of the word and sometimes tells two words apart:"
    uk: "Значок над літерою — частина слова й інколи розрізняє два слова:"
    es: "Un acento forma parte de la palabra y a veces distingue dos palabras:"
    pt: "Um acento faz parte da palavra e às vezes distingue duas palavras:"
    de: "Ein Akzent gehört zum Wort und unterscheidet manchmal zwei Wörter:"
    it: "Un accento fa parte della parola e a volte distingue due parole:"
    pl: "Akcent jest częścią wyrazu i czasem odróżnia dwa wyrazy:"
    tr: "Aksan sözcüğün bir parçasıdır ve bazen iki sözcüğü birbirinden ayırır:"
    id: "Aksen adalah bagian dari kata dan kadang membedakan dua kata:"
    vi: "Dấu là một phần của từ và đôi khi phân biệt hai từ:"
  ex: { examples: [{ target: "ou" }, { target: "où" }] }
