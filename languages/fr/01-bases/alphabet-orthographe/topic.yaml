sections:
  - title: { fr: "L’alphabet", en: "The alphabet", uk: "Алфавіт", es: "El alfabeto", pt: "O alfabeto", de: "Das Alphabet", it: "L'alfabeto", pl: "Alfabet", tr: "Alfabe", id: "Alfabet", vi: "Bảng chữ cái" }
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: ["L’alphabet compte 26 lettres : six voyelles, ", { letter: "a, e, i, o, u, y" }, ", et vingt consonnes."]
              en: ["The alphabet has 26 letters: six vowels, ", { letter: "a, e, i, o, u, y" }, ", and twenty consonants."]
              uk: ["В алфавіті 26 літер: шість голосних, ", { letter: "a, e, i, o, u, y" }, ", і двадцять приголосних."]
              es: ["El alfabeto tiene 26 letras: seis vocales, ", { letter: "a, e, i, o, u, y" }, ", y veinte consonantes."]
              pt: ["O alfabeto tem 26 letras: seis vogais, ", { letter: "a, e, i, o, u, y" }, ", e vinte consoantes."]
              de: ["Das Alphabet hat 26 Buchstaben: sechs Vokale, ", { letter: "a, e, i, o, u, y" }, ", und zwanzig Konsonanten."]
              it: ["L'alfabeto ha 26 lettere: sei vocali, ", { letter: "a, e, i, o, u, y" }, ", e venti consonanti."]
              pl: ["Alfabet ma 26 liter: sześć samogłosek, ", { letter: "a, e, i, o, u, y" }, ", i dwadzieścia spółgłosek."]
              tr: ["Alfabede 26 harf vardır: altı ünlü, ", { letter: "a, e, i, o, u, y" }, ", ve yirmi ünsüz."]
              id: ["Alfabet ini terdiri atas 26 huruf: enam vokal, ", { letter: "a, e, i, o, u, y" }, ", dan dua puluh konsonan."]
              vi: ["Bảng chữ cái có 26 chữ: sáu nguyên âm, ", { letter: "a, e, i, o, u, y" }, ", và hai mươi phụ âm."]
            ex: { examples: [[{ target: "a" }, "mi"], [{ target: "y" }, "aourt"]] }
            tr: { en: { examples: ["friend", "yoghurt"] }, uk: { examples: ["друг", "йогурт"] }, es: { examples: ["amigo", "yogur"] }, pt: { examples: ["amigo", "iogurte"] }, de: { examples: ["Freund", "Joghurt"] }, it: { examples: ["amico", "yogurt"] }, pl: { examples: ["przyjaciel", "jogurt"] }, tr: { examples: ["arkadaş", "yoğurt"] }, id: { examples: ["teman", "yoghurt"] }, vi: { examples: ["bạn bè", "sữa chua"] } }
