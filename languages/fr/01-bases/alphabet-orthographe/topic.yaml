          - type: "note"
            level: "A1"
            text:
              fr: ["Les lettres ", { letter: "k" }, " et ", { letter: "w" }, " sont rares : elles se trouvent dans des mots venus d’autres langues."]
              en: ["The letters ", { letter: "k" }, " and ", { letter: "w" }, " are rare: they appear in words borrowed from other languages."]
              uk: ["Літери ", { letter: "k" }, " і ", { letter: "w" }, " трапляються рідко: вони є в словах, запозичених з інших мов."]
