              pt: ["A vogal nasal continua nasal depois de ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, ", mas passa a oral depois de ", { term: "bon" }, "."]
              de: ["Der Nasalvokal bleibt nach ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, " nasal, wird aber nach ", { term: "bon" }, " oral."]
              it: ["La vocale nasale resta nasale dopo ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, ", ma diventa orale dopo ", { term: "bon" }, "."]
              pl: ["Samogłoska nosowa pozostaje nosowa po ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, ", ale po ", { term: "bon" }, " staje się ustna."]
