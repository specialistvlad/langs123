    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Une consonne toujours prononcée à la fin d’un mot passe à la syllabe suivante quand le mot suivant commence par une voyelle."
              en: "A consonant that is always pronounced at the end of a word moves to the next syllable when the next word starts with a vowel."
              uk: "Приголосна, що завжди вимовляється наприкінці слова, переходить до наступного складу, якщо наступне слово починається з голосної."
              es: "Una consonante que siempre se pronuncia al final de una palabra pasa a la sílaba siguiente cuando la palabra siguiente empieza por vocal."
              pt: "Uma consoante sempre pronunciada no fim de uma palavra passa para a sílaba seguinte quando a palavra seguinte começa por vogal."
              de: "Ein immer gesprochener Konsonant am Wortende rutscht in die nächste Silbe, wenn das folgende Wort mit einem Vokal beginnt."
              it: "Una consonante sempre pronunciata alla fine di una parola passa alla sillaba seguente quando la parola successiva inizia con una vocale."
              pl: "Zawsze wymawiana spółgłoska na końcu wyrazu przechodzi do następnej sylaby, gdy następny wyraz zaczyna się samogłoską."
              tr: "Bir sözcüğün sonunda her zaman okunan ünsüz, sonraki sözcük ünlüyle başlıyorsa sonraki heceye geçer."
              id: "Konsonan di akhir kata yang selalu dilafalkan berpindah ke suku kata berikutnya bila kata berikutnya diawali vokal."
              vi: "Phụ âm cuối từ luôn được đọc sẽ chuyển sang âm tiết kế tiếp khi từ sau bắt đầu bằng nguyên âm."
            ex: { examples: [["elle aime ", { ipa: "ɛ.lɛm" }], ["une amie ", { ipa: "y.na.mi" }], ["quelle heure ", { ipa: "kɛ.lœʁ" }]] }
            tr: { en: { examples: ["she loves", "a friend (woman)", "what time"] }, uk: { examples: ["вона любить", "подруга", "котра година"] }, es: { examples: ["ella ama", "una amiga", "qué hora"] }, pt: { examples: ["ela ama", "uma amiga", "que horas"] }, de: { examples: ["sie liebt", "eine Freundin", "wie viel Uhr"] }, it: { examples: ["lei ama", "un'amica", "che ora"] }, pl: { examples: ["ona kocha", "przyjaciółka", "która godzina"] }, tr: { examples: ["o seviyor", "bir kız arkadaş", "saat kaç"] }, id: { examples: ["dia mencintai", "seorang teman perempuan", "jam berapa"] }, vi: { examples: ["cô ấy yêu", "một người bạn gái", "mấy giờ"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "La voix continue sans arrêt devant la voyelle : la gorge reste ouverte entre les deux mots."
              en: "The voice carries on into the vowel: the throat stays open between the two words."
              uk: "Голос триває без перерви перед голосною: горло між двома словами лишається відкритим."
              es: "La voz continúa sin pausa ante la vocal: la garganta queda abierta entre las dos palabras."
              pt: "A voz continua sem pausa diante da vogal: a garganta fica aberta entre as duas palavras."
              de: "Die Stimme läuft vor dem Vokal ohne Absetzen weiter: Die Kehle bleibt zwischen den beiden Wörtern offen."
              it: "La voce continua senza interruzione davanti alla vocale: la gola resta aperta tra le due parole."
              pl: "Głos płynie bez przerwy przed samogłoską: gardło pozostaje otwarte między dwoma wyrazami."
              tr: "Ses ünlüden önce kesintisiz sürer: iki sözcük arasında gırtlak açık kalır."
              id: "Suara berlanjut tanpa jeda sebelum vokal: tenggorokan tetap terbuka di antara dua kata."
              vi: "Giọng liền mạch trước nguyên âm: cổ họng vẫn mở giữa hai từ."
            ex: ["Il a un ami. ", { ipa: "i.la.œ̃.na.mi" }]
            tr: { en: "He has a friend.", uk: "У нього є друг.", es: "Tiene un amigo.", pt: "Ele tem um amigo.", de: "Er hat einen Freund.", it: "Ha un amico.", pl: "Ma przyjaciela.", tr: "Bir arkadaşı var.", id: "Dia punya seorang teman.", vi: "Anh ấy có một người bạn." }
