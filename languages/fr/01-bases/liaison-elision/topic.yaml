  - title:
      fr: "La liaison : les consonnes"
      en: "Liaison: the consonants"
      uk: "Ліазон: приголосні"
      es: "La liaison: las consonantes"
      pt: "A liaison: as consoantes"
      de: "Die Liaison: die Konsonanten"
      it: "La liaison: le consonanti"
      pl: "Liaison: spółgłoski"
      tr: "Liaison: ünsüzler"
      id: "Liaison: konsonan"
      vi: "Nối âm: các phụ âm"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "La liaison fait entendre, devant une voyelle ou un h muet, la consonne finale d’un mot qui reste muette ailleurs."
              en: "Liaison makes the final consonant of a word heard before a vowel or a mute h, where it stays silent elsewhere."
              uk: "Ліазон робить чутною кінцеву приголосну слова перед голосною або німим h, а в інших позиціях вона німа."
              es: "La liaison hace oír, ante una vocal o una h muda, la consonante final de una palabra que en otros casos es muda."
              pt: "A liaison faz ouvir, diante de vogal ou de h mudo, a consoante final de uma palavra que nos outros casos é muda."
              de: "Die Liaison macht den Endkonsonanten eines Wortes vor einem Vokal oder stummen h hörbar, der sonst stumm bleibt."
              it: "La liaison fa sentire, davanti a una vocale o a una h muta, la consonante finale di una parola che altrove resta muta."
              pl: "Liaison sprawia, że przed samogłoską lub niemym h słychać końcową spółgłoskę wyrazu, która w innych miejscach jest niema."
              tr: "Liaison, bir sözcüğün başka yerde okunmayan son ünsüzünü ünlüden ya da sessiz h’den önce duyulur kılar."
              id: "Liaison membuat konsonan akhir sebuah kata terdengar sebelum vokal atau h bisu, padahal di tempat lain konsonan itu bisu."
              vi: "Nối âm làm cho phụ âm cuối của một từ, vốn câm ở chỗ khác, được đọc trước nguyên âm hoặc h câm."
            ex: { examples: [["le", { target: "s" }, " amis ", { ipa: "lezami" }], ["vou", { target: "s" }, " êtes ", { ipa: "vuzɛt" }]] }
            tr: { en: { examples: ["the friends", "you are"] }, uk: { examples: ["друзі", "ви є"] }, es: { examples: ["los amigos", "ustedes son"] }, pt: { examples: ["os amigos", "vocês são"] }, de: { examples: ["die Freunde", "ihr seid"] }, it: { examples: ["gli amici", "voi siete"] }, pl: { examples: ["przyjaciele", "jesteście"] }, tr: { examples: ["arkadaşlar", "siz -siniz"] }, id: { examples: ["teman-teman itu", "kalian adalah"] }, vi: { examples: ["những người bạn", "các bạn là"] } }
