              fr: ["La voyelle nasale reste nasale après ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, ", mais devient orale après ", { term: "bon" }, "."]
              en: ["The nasal vowel stays nasal after ", { term: "un" }, ", ", { term: "mon" }, ", ", { term: "en" }, ", but becomes oral after ", { term: "bon" }, "."]
