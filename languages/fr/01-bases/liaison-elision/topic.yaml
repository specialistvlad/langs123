    uk: ["Перед голосною або німим h слова ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "je" }, ", ", { term: "ne" }, ", ", { term: "de" }, " і ", { term: "ce" }, " втрачають голосну:"]
    es: ["Ante una vocal o una h muda, ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "je" }, ", ", { term: "ne" }, ", ", { term: "de" }, " y ", { term: "ce" }, " pierden su vocal:"]
