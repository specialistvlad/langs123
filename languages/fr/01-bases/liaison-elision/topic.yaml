title:
  fr: "La liaison et l’élision"
  en: "Liaison and Elision"
  uk: "Ліазон та елізія"
  es: "La liaison y la elisión"
  pt: "A liaison e a elisão"
  de: "Liaison und Elision"
  it: "La liaison e l'elisione"
  pl: "Liaison i elizja"
  tr: "Liaison ve ünlü düşmesi"
  id: "Liaison dan elisi"
  vi: "Nối âm và lược âm"
summary:
  lead:
    fr: "L’élision remplace la voyelle d’un petit mot par une apostrophe devant une voyelle ; la liaison fait entendre une consonne muette devant une voyelle."
    en: "Elision replaces the vowel of a short word with an apostrophe before a vowel; liaison makes a silent consonant heard before a vowel."
    uk: "Елізія замінює голосну короткого слова апострофом перед голосною; ліазон робить чутною німу приголосну перед голосною."
    es: "La elisión sustituye la vocal de una palabra corta por un apóstrofo ante una vocal; la liaison hace oír una consonante muda ante una vocal."
    pt: "A elisão troca a vogal de uma palavra curta por um apóstrofo diante de vogal; a liaison faz ouvir uma consoante muda diante de vogal."
    de: "Die Elision ersetzt den Vokal eines kurzen Wortes vor einem Vokal durch einen Apostroph; die Liaison macht einen stummen Konsonanten vor einem Vokal hörbar."
    it: "L'elisione sostituisce la vocale di una parola breve con un apostrofo davanti a una vocale; la liaison fa sentire una consonante muta davanti a una vocale."
    pl: "Elizja zastępuje samogłoskę krótkiego wyrazu apostrofem przed samogłoską; liaison sprawia, że niema spółgłoska jest słyszalna przed samogłoską."
    tr: "Ünlü düşmesi, ünlüden önce kısa bir sözcüğün ünlüsünü kesme işaretiyle değiştirir; liaison, sessiz bir ünsüzü ünlüden önce duyulur kılar."
    id: "Elisi mengganti vokal kata pendek dengan apostrof sebelum vokal; liaison membuat konsonan bisu terdengar sebelum vokal."
    vi: "Lược âm thay nguyên âm của một từ ngắn bằng dấu nháy trước nguyên âm; nối âm làm cho phụ âm câm được đọc trước nguyên âm."
  rule:
