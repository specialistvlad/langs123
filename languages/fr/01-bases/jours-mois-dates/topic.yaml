            tr: { en: "Sunday", uk: "неділя", es: "domingo", pt: "domingo", de: "Sonntag", it: "domenica", pl: "niedziela", tr: "pazar", id: "Minggu", vi: "chủ nhật" }
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: "Les jours de la semaine et les mois s’écrivent sans majuscule."
              en: "Days of the week and months are written with no capital letter."
              uk: "Назви днів тижня й місяців пишуть без великої літери."
              es: "Los días de la semana y los meses se escriben sin mayúscula."
              pt: "Os dias da semana e os meses escrevem-se sem maiúscula."
              de: "Wochentage und Monate werden kleingeschrieben."
              it: "I giorni della settimana e i mesi si scrivono senza maiuscola."
              pl: "Nazwy dni tygodnia i miesięcy pisze się małą literą."
              tr: "Haftanın günleri ve aylar büyük harfle başlamaz."
              id: "Nama hari dan bulan ditulis tanpa huruf kapital."
              vi: "Tên các ngày trong tuần và các tháng được viết không viết hoa."
            ex: { examples: [["Je pars ", { target: "lundi" }, "."], ["Je pars en ", { target: "juillet" }, "."]] }
            tr: { en: { examples: ["I'm leaving on Monday.", "I'm leaving in July."] }, uk: { examples: ["Я їду в понеділок.", "Я їду в липні."] }, es: { examples: ["Me voy el lunes.", "Me voy en julio."] }, pt: { examples: ["Eu viajo na segunda-feira.", "Eu viajo em julho."] }, de: { examples: ["Ich fahre am Montag ab.", "Ich fahre im Juli ab."] }, it: { examples: ["Parto lunedì.", "Parto a luglio."] }, pl: { examples: ["Wyjeżdżam w poniedziałek.", "Wyjeżdżam w lipcu."] }, tr: { examples: ["Pazartesi günü gidiyorum.", "Temmuzda gidiyorum."] }, id: { examples: ["Saya berangkat hari Senin.", "Saya berangkat pada bulan Juli."] }, vi: { examples: ["Tôi đi vào thứ hai.", "Tôi đi vào tháng bảy."] } }
          - type: "rule"
            level: "A0"
            text:
              fr: ["On demande le jour avec ", { term: "Quel jour sommes-nous ?" }, " et on répond avec ", { term: "nous sommes" }, "."]
              en: ["Ask the day with ", { term: "Quel jour sommes-nous ?" }, " and answer with ", { term: "nous sommes" }, "."]
              uk: ["День запитують ", { term: "Quel jour sommes-nous ?" }, ", а відповідають ", { term: "nous sommes" }, "."]
              es: ["El día se pregunta con ", { term: "Quel jour sommes-nous ?" }, " y se responde con ", { term: "nous sommes" }, "."]
              pt: ["O dia pergunta-se com ", { term: "Quel jour sommes-nous ?" }, " e responde-se com ", { term: "nous sommes" }, "."]
              de: ["Den Tag erfragt man mit ", { term: "Quel jour sommes-nous ?" }, " und antwortet mit ", { term: "nous sommes" }, "."]
              it: ["Il giorno si chiede con ", { term: "Quel jour sommes-nous ?" }, " e si risponde con ", { term: "nous sommes" }, "."]
              pl: ["O dzień pyta się ", { term: "Quel jour sommes-nous ?" }, ", a odpowiada ", { term: "nous sommes" }, "."]
              tr: ["Gün ", { term: "Quel jour sommes-nous ?" }, " ile sorulur, ", { term: "nous sommes" }, " ile cevaplanır."]
              id: ["Hari ditanyakan dengan ", { term: "Quel jour sommes-nous ?" }, " dan dijawab dengan ", { term: "nous sommes" }, "."]
              vi: ["Hỏi thứ bằng ", { term: "Quel jour sommes-nous ?" }, " và trả lời bằng ", { term: "nous sommes" }, "."]
            ex: { exchange: ["Quel jour sommes-nous ?", ["Nous sommes ", { weekday: { target: "jeudi" }, value: 4 }, "."]] }
            tr: { en: "What day is it? — It's Thursday.", uk: "Який сьогодні день? — Четвер.", es: "¿Qué día es hoy? — Es jueves.", pt: "Que dia é hoje? — É quinta-feira.", de: "Welcher Tag ist heute? — Donnerstag.", it: "Che giorno è oggi? — È giovedì.", pl: "Jaki dziś dzień? — Czwartek.", tr: "Bugün günlerden ne? — Perşembe.", id: "Hari ini hari apa? — Hari Kamis.", vi: "Hôm nay là thứ mấy? — Thứ năm." }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "lundi" }, " nomme un seul lundi ; ", { term: "le lundi" }, " nomme chaque lundi."]
              en: [{ term: "lundi" }, " names one Monday; ", { term: "le lundi" }, " names every Monday."]
              uk: [{ term: "lundi" }, " називає один певний понеділок; ", { term: "le lundi" }, " — кожен понеділок."]
              es: [{ term: "lundi" }, " nombra un solo lunes; ", { term: "le lundi" }, " nombra todos los lunes."]
              pt: [{ term: "lundi" }, " nomeia uma só segunda-feira; ", { term: "le lundi" }, " nomeia todas as segundas-feiras."]
              de: [{ term: "lundi" }, " nennt einen einzelnen Montag; ", { term: "le lundi" }, " nennt jeden Montag."]
              it: [{ term: "lundi" }, " indica un solo lunedì; ", { term: "le lundi" }, " indica ogni lunedì."]
              pl: [{ term: "lundi" }, " oznacza jeden poniedziałek; ", { term: "le lundi" }, " oznacza każdy poniedziałek."]
              tr: [{ term: "lundi" }, " tek bir pazartesiyi, ", { term: "le lundi" }, " her pazartesiyi anlatır."]
              id: [{ term: "lundi" }, " menyebut satu hari Senin; ", { term: "le lundi" }, " menyebut setiap hari Senin."]
              vi: [{ term: "lundi" }, " chỉ một ngày thứ hai; ", { term: "le lundi" }, " chỉ mọi ngày thứ hai."]
            ex: { examples: [["Je pars ", { weekday: { target: "lundi" }, value: 1 }, "."], [{ weekday: { target: "Le lundi" }, value: 1 }, ", je travaille."]] }
            tr: { en: { examples: ["I'm leaving on Monday.", "On Mondays, I work."] }, uk: { examples: ["Я їду в понеділок.", "По понеділках я працюю."] }, es: { examples: ["Me voy el lunes.", "Los lunes trabajo."] }, pt: { examples: ["Eu viajo na segunda-feira.", "Às segundas-feiras eu trabalho."] }, de: { examples: ["Ich fahre am Montag ab.", "Montags arbeite ich."] }, it: { examples: ["Parto lunedì.", "Il lunedì lavoro."] }, pl: { examples: ["Wyjeżdżam w poniedziałek.", "W poniedziałki pracuję."] }, tr: { examples: ["Pazartesi günü gidiyorum.", "Pazartesileri çalışıyorum."] }, id: { examples: ["Saya berangkat hari Senin.", "Setiap hari Senin saya bekerja."] }, vi: { examples: ["Thứ hai tôi đi.", "Thứ hai nào tôi cũng làm việc."] } }
          - type: "rule"
            level: "A2"
            text:
              fr: ["Au pluriel, les jours prennent un s : ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              en: ["In the plural, days take an s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              uk: ["У множині назви днів мають s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              es: ["En plural, los días llevan s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              pt: ["No plural, os dias levam s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              de: ["Im Plural nehmen die Wochentage ein s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              it: ["Al plurale i giorni prendono la s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              pl: ["W liczbie mnogiej nazwy dni mają s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              tr: ["Çoğulda gün adları s alır: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              id: ["Dalam bentuk jamak, nama hari memakai s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
              vi: ["Ở số nhiều, tên các thứ có s: ", { term: "les lundis" }, ", ", { term: "les samedis" }, "."]
            ex: ["Tous les ", { target: "lundis" }, ", je nage."]
            tr: { en: "Every Monday I swim.", uk: "Щопонеділка я плаваю.", es: "Todos los lunes nado.", pt: "Todas as segundas-feiras eu nado.", de: "Jeden Montag schwimme ich.", it: "Ogni lunedì nuoto.", pl: "W każdy poniedziałek pływam.", tr: "Her pazartesi yüzüyorum.", id: "Setiap hari Senin saya berenang.", vi: "Thứ hai nào tôi cũng đi bơi." }
          - type: "note"
            level: "A1"
            variety: "fr-FR"
            text:
              fr: ["Le samedi et le dimanche forment le ", { term: "week-end" }, "."]
              en: ["Saturday and Sunday make up the ", { term: "week-end" }, "."]
              uk: ["Субота й неділя разом становлять ", { term: "week-end" }, "."]
              es: ["El sábado y el domingo forman el ", { term: "week-end" }, "."]
              pt: ["O sábado e o domingo formam o ", { term: "week-end" }, "."]
              de: ["Samstag und Sonntag bilden das ", { term: "week-end" }, "."]
              it: ["Il sabato e la domenica formano il ", { term: "week-end" }, "."]
              pl: ["Sobota i niedziela tworzą ", { term: "week-end" }, "."]
              tr: ["Cumartesi ile pazar ", { term: "week-end" }, " oluşturur."]
              id: ["Sabtu dan Minggu membentuk ", { term: "week-end" }, "."]
              vi: ["Thứ bảy và chủ nhật tạo thành ", { term: "week-end" }, "."]
            ex: ["Ce ", { target: "week-end" }, ", je suis chez moi."]
            tr: { en: "This weekend, I'm at home.", uk: "Цими вихідними я вдома.", es: "Este fin de semana estoy en casa.", pt: "Neste fim de semana estou em casa.", de: "Dieses Wochenende bin ich zu Hause.", it: "Questo fine settimana sono a casa.", pl: "W ten weekend jestem w domu.", tr: "Bu hafta sonu evdeyim.", id: "Akhir pekan ini saya di rumah.", vi: "Cuối tuần này tôi ở nhà." }
          - type: "note"
            level: "A1"
            variety: "fr-CA"
            text:
              fr: ["Au Québec, on dit ", { term: "la fin de semaine" }, ", au féminin."]
              en: ["In Québec, people say ", { term: "la fin de semaine" }, ", a feminine noun."]
              uk: ["У Квебеку кажуть ", { term: "la fin de semaine" }, ", жіночого роду."]
              es: ["En Quebec se dice ", { term: "la fin de semaine" }, ", en femenino."]
              pt: ["No Quebec diz-se ", { term: "la fin de semaine" }, ", no feminino."]
              de: ["In Québec sagt man ", { term: "la fin de semaine" }, ", ein weibliches Nomen."]
              it: ["In Québec si dice ", { term: "la fin de semaine" }, ", al femminile."]
              pl: ["W Quebecu mówi się ", { term: "la fin de semaine" }, ", w rodzaju żeńskim."]
              tr: ["Québec’te ", { term: "la fin de semaine" }, " denir; dişil bir addır."]
              id: ["Di Québec orang berkata ", { term: "la fin de semaine" }, ", kata benda feminin."]
              vi: ["Ở Québec người ta nói ", { term: "la fin de semaine" }, ", danh từ giống cái."]
            ex: ["Cette ", { target: "fin de semaine" }, ", je suis chez moi."]
            tr: { en: "This weekend, I'm at home.", uk: "Цими вихідними я вдома.", es: "Este fin de semana estoy en casa.", pt: "Neste fim de semana estou em casa.", de: "Dieses Wochenende bin ich zu Hause.", it: "Questo fine settimana sono a casa.", pl: "W ten weekend jestem w domu.", tr: "Bu hafta sonu evdeyim.", id: "Akhir pekan ini saya di rumah.", vi: "Cuối tuần này tôi ở nhà." }
  - title: { fr: "Les mois", en: "Months", uk: "Місяці", es: "Los meses", pt: "Os meses", de: "Die Monate", it: "I mesi", pl: "Miesiące", tr: "Aylar", id: "Bulan", vi: "Các tháng" }
