            short: "ven."
            tr: { en: "Friday", uk: "п’ятниця", es: "viernes", pt: "sexta-feira", de: "Freitag", it: "venerdì", pl: "piątek", tr: "cuma", id: "Jumat", vi: "thứ sáu" }
          - level: "A0"
