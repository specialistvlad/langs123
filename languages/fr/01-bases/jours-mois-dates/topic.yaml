              pt: ["A data pergunta-se com ", { term: "Quelle est la date ?" }, " e responde-se com ", { term: "c’est" }, " ou ", { term: "nous sommes" }, "."]
              de: ["Das Datum erfragt man mit ", { term: "Quelle est la date ?" }, " und antwortet mit ", { term: "c’est" }, " oder ", { term: "nous sommes" }, "."]
              it: ["La data si chiede con ", { term: "Quelle est la date ?" }, " e si risponde con ", { term: "c’est" }, " o ", { term: "nous sommes" }, "."]
