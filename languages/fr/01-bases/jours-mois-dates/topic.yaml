      - type: "inventory"
        set: "days"
        columns:
          - { key: "day", label: { fr: "Jour", en: "Day", uk: "День", es: "Día", pt: "Dia", de: "Tag", it: "Giorno", pl: "Dzień", tr: "Gün", id: "Hari", vi: "Thứ" } }
          - key: "short"
            label: { fr: "Abréviation", en: "Short form", uk: "Скорочення", es: "Abreviatura", pt: "Abreviatura", de: "Abkürzung", it: "Abbreviazione", pl: "Skrót", tr: "Kısaltma", id: "Singkatan", vi: "Viết tắt" }
        rows:
