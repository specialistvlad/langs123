            tr: { en: "Tuesday", uk: "вівторок", es: "martes", pt: "terça-feira", de: "Dienstag", it: "martedì", pl: "wtorek", tr: "salı", id: "Selasa", vi: "thứ ba" }
          - level: "A0"
