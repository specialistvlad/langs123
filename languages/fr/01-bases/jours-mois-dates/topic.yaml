            short: "sam."
            tr: { en: "Saturday", uk: "субота", es: "sábado", pt: "sábado", de: "Samstag", it: "sabato", pl: "sobota", tr: "cumartesi", id: "Sabtu", vi: "thứ bảy" }
          - level: "A0"
