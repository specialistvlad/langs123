            ex: { exchange: ["Quelle est la date aujourd’hui ?", ["Nous sommes ", { date: { target: "le quatorze juillet" }, value: "--07-14" }, "."]] }
            tr: { en: "What's the date today? — It's 14 July.", uk: "Яке сьогодні число? — 14 липня.", es: "¿A qué fecha estamos hoy? — Estamos a 14 de julio.", pt: "Que dia é hoje? — É 14 de julho.", de: "Der Wievielte ist heute? — Der 14. Juli.", it: "Che data è oggi? — È il 14 luglio.", pl: "Którego dziś mamy? — Czternastego lipca.", tr: "Bugün ayın kaçı? — 14 Temmuz.", id: "Hari ini tanggal berapa? — Tanggal 14 Juli.", vi: "Hôm nay là ngày bao nhiêu? — Ngày 14 tháng 7." }
