  - title:
      fr: "L’accent et le rythme"
      en: "Stress and rhythm"
      uk: "Наголос і ритм"
      es: "El acento y el ritmo"
      pt: "O acento e o ritmo"
      de: "Betonung und Rhythmus"
      it: "L'accento e il ritmo"
      pl: "Akcent i rytm"
      tr: "Vurgu ve ritim"
      id: "Tekanan dan irama"
      vi: "Trọng âm và nhịp điệu"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "L’accent tombe sur la dernière syllabe prononcée du mot."
              en: "The stress falls on the last pronounced syllable of the word."
              uk: "Наголос падає на останній вимовлений склад слова."
              es: "El acento recae en la última sílaba pronunciada de la palabra."
              pt: "O acento recai na última sílaba pronunciada da palavra."
              de: "Die Betonung liegt auf der letzten gesprochenen Silbe des Wortes."
              it: "L'accento cade sull'ultima sillaba pronunciata della parola."
              pl: "Akcent pada na ostatnią wymawianą sylabę wyrazu."
              tr: "Vurgu sözcüğün okunan son hecesine düşer."
              id: "Tekanan jatuh pada suku kata terakhir yang dilafalkan dalam kata."
              vi: "Trọng âm rơi vào âm tiết cuối được đọc của từ."
            ex: { examples: [["choco", { stress: "lat" }], ["ba", { stress: "na" }, "ne"], ["ca", { stress: "fé" }]] }
            tr: { en: { examples: ["chocolate", "banana", "coffee"] }, uk: { examples: ["шоколад", "банан", "кава"] }, es: { examples: ["chocolate", "plátano", "café"] }, pt: { examples: ["chocolate", "banana", "café"] }, de: { examples: ["Schokolade", "Banane", "Kaffee"] }, it: { examples: ["cioccolato", "banana", "caffè"] }, pl: { examples: ["czekolada", "banan", "kawa"] }, tr: { examples: ["çikolata", "muz", "kahve"] }, id: { examples: ["cokelat", "pisang", "kopi"] }, vi: { examples: ["sô-cô-la", "quả chuối", "cà phê"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Dans un groupe de mots, seule la dernière syllabe est accentuée."
              en: "In a group of words, only the last syllable is stressed."
              uk: "У групі слів наголошується лише останній склад."
              es: "En un grupo de palabras, solo se acentúa la última sílaba."
              pt: "Num grupo de palavras, só a última sílaba é acentuada."
              de: "In einer Wortgruppe wird nur die letzte Silbe betont."
              it: "In un gruppo di parole, è accentata solo l'ultima sillaba."
              pl: "W grupie wyrazów akcentowana jest tylko ostatnia sylaba."
              tr: "Bir sözcük grubunda yalnızca son hece vurgulanır."
              id: "Dalam sekelompok kata, hanya suku kata terakhir yang ditekankan."
              vi: "Trong một nhóm từ, chỉ âm tiết cuối được nhấn."
            ex: ["Je voudrais un ca", { stress: "fé" }, ", s’il vous ", { stress: "plaît" }, "."]
            tr: { en: "I'd like a coffee, please.", uk: "Я хотів би каву, будь ласка.", es: "Quisiera un café, por favor.", pt: "Eu queria um café, por favor.", de: "Ich möchte einen Kaffee, bitte.", it: "Vorrei un caffè, per favore.", pl: "Poproszę kawę.", tr: "Bir kahve istiyorum, lütfen.", id: "Saya mau kopi, tolong.", vi: "Tôi muốn một ly cà phê, làm ơn." }
          - type: "rule"
            level: "A1"
            text:
              fr: "Les autres syllabes ont presque la même force et la même durée."
              en: "The other syllables have almost the same force and length."
              uk: "Інші склади майже однакові за силою й тривалістю."
              es: "Las demás sílabas tienen casi la misma fuerza y duración."
              pt: "As outras sílabas têm quase a mesma força e duração."
              de: "Die übrigen Silben haben fast dieselbe Stärke und Länge."
              it: "Le altre sillabe hanno quasi la stessa forza e durata."
              pl: "Pozostałe sylaby mają prawie tę samą siłę i długość."
              tr: "Diğer heceler hemen hemen aynı güçte ve uzunluktadır."
              id: "Suku kata lainnya hampir sama kuat dan sama panjang."
              vi: "Các âm tiết còn lại có độ mạnh và độ dài gần bằng nhau."
          - type: "rule"
            level: "A2"
            text:
              fr: ["Une syllabe se termine souvent par une voyelle : on coupe ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              en: ["A syllable often ends in a vowel: the words are cut ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              uk: ["Склад часто закінчується голосною: слова ділять так — ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              es: ["Una sílaba suele terminar en vocal: las palabras se cortan ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              pt: ["Uma sílaba geralmente termina em vogal: as palavras se dividem ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              de: ["Eine Silbe endet oft auf einen Vokal: Man trennt ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              it: ["Una sillaba termina spesso con una vocale: le parole si dividono ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              pl: ["Sylaba często kończy się samogłoską: wyrazy dzieli się ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              tr: ["Bir hece çoğu kez ünlüyle biter: sözcükler ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, " diye bölünür."]
              id: ["Suku kata sering berakhir dengan vokal: kata dipenggal ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
              vi: ["Một âm tiết thường kết thúc bằng nguyên âm: từ được tách ", { term: "ba-na-ne" }, ", ", { term: "a-mi" }, "."]
