          tr: { en: "French? It's easy.", uk: "Французька? Це легко.", es: "¿El francés? Es fácil.", pt: "O francês? É fácil.", de: "Französisch? Das ist leicht.", it: "Il francese? È facile.", pl: "Francuski? To łatwe.", tr: "Fransızca mı? Kolay.", id: "Bahasa Prancis? Mudah.", vi: "Tiếng Pháp ư? Dễ thôi." }
