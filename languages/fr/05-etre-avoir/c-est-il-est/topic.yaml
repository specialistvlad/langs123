sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "C’est" }, " présente quelqu’un ou quelque chose : un prénom ou un nom avec un article."]
              en: [{ term: "C’est" }, " introduces someone or something: a first name, or a noun with an article."]
              uk: [{ term: "C’est" }, " представляє когось або щось: ім’я або іменник з артиклем."]
              es: [{ term: "C’est" }, " presenta a alguien o algo: un nombre propio o un nombre con artículo."]
              pt: [{ term: "C’est" }, " apresenta alguém ou algo: um prenome ou um substantivo com artigo."]
              de: [{ term: "C’est" }, " stellt jemanden oder etwas vor: einen Vornamen oder ein Nomen mit Artikel."]
              it: [{ term: "C’est" }, " presenta qualcuno o qualcosa: un nome proprio o un nome con articolo."]
              pl: [{ term: "C’est" }, " przedstawia kogoś lub coś: imię albo rzeczownik z rodzajnikiem."]
              tr: [{ term: "C’est" }, " birini ya da bir şeyi tanıtır: bir ad ya da artikelli bir isim."]
              id: [{ term: "C’est" }, " memperkenalkan seseorang atau sesuatu: sebuah nama atau kata benda dengan artikel."]
              vi: [{ term: "C’est" }, " giới thiệu ai đó hoặc vật gì: một tên riêng hoặc một danh từ có mạo từ."]
            ex: { examples: [[{ target: "C’est" }, " Léa."], [{ target: "C’est" }, " un livre."]] }
            tr: { en: { examples: ["It's Léa.", "It's a book."] }, uk: { examples: ["Це Леа.", "Це книжка."] }, es: { examples: ["Es Léa.", "Es un libro."] }, pt: { examples: ["É a Léa.", "É um livro."] }, de: { examples: ["Das ist Léa.", "Das ist ein Buch."] }, it: { examples: ["È Léa.", "È un libro."] }, pl: { examples: ["To jest Léa.", "To jest książka."] }, tr: { examples: ["Bu Léa.", "Bu bir kitap."] }, id: { examples: ["Ini Léa.", "Ini sebuah buku."] }, vi: { examples: ["Đây là Léa.", "Đây là một quyển sách."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Il est" }, " et ", { term: "elle est" }, " parlent de quelqu’un ou de quelque chose déjà nommé : ils le décrivent."]
              en: [{ term: "Il est" }, " and ", { term: "elle est" }, " speak of someone or something already named: they describe it."]
              uk: [{ term: "Il est" }, " і ", { term: "elle est" }, " говорять про когось або щось уже назване: вони його описують."]
              es: [{ term: "Il est" }, " y ", { term: "elle est" }, " hablan de alguien o algo ya nombrado: lo describen."]
              pt: [{ term: "Il est" }, " e ", { term: "elle est" }, " falam de alguém ou algo já nomeado: descrevem-no."]
              de: [{ term: "Il est" }, " und ", { term: "elle est" }, " sprechen von jemandem oder etwas schon Genanntem: Sie beschreiben es."]
              it: [{ term: "Il est" }, " e ", { term: "elle est" }, " parlano di qualcuno o qualcosa già nominato: lo descrivono."]
              pl: [{ term: "Il est" }, " i ", { term: "elle est" }, " mówią o kimś lub czymś, co już nazwano: opisują to."]
              tr: [{ term: "Il est" }, " ve ", { term: "elle est" }, ", adı daha önce verilmiş birini ya da bir şeyi anlatır."]
              id: [{ term: "Il est" }, " dan ", { term: "elle est" }, " berbicara tentang seseorang atau sesuatu yang sudah disebut: keduanya menggambarkannya."]
              vi: [{ term: "Il est" }, " và ", { term: "elle est" }, " nói về ai đó hoặc vật gì đã được nhắc tên: chúng miêu tả nó."]
            ex: { examples: [["Mon frère ? ", { target: "Il est" }, " grand."], ["Ma sœur ? ", { target: "Elle est" }, " médecin."]] }
            tr: { en: { examples: ["My brother? He is tall.", "My sister? She is a doctor."] }, uk: { examples: ["Мій брат? Він високий.", "Моя сестра? Вона лікарка."] }, es: { examples: ["¿Mi hermano? Es alto.", "¿Mi hermana? Es médica."] }, pt: { examples: ["Meu irmão? Ele é alto.", "Minha irmã? Ela é médica."] }, de: { examples: ["Mein Bruder? Er ist groß.", "Meine Schwester? Sie ist Ärztin."] }, it: { examples: ["Mio fratello? È alto.", "Mia sorella? È medico."] }, pl: { examples: ["Mój brat? Jest wysoki.", "Moja siostra? Jest lekarką."] }, tr: { examples: ["Kardeşim mi? Uzun boylu.", "Ablam mı? Doktor."] }, id: { examples: ["Kakakku? Dia tinggi.", "Adik perempuanku? Dia dokter."] }, vi: { examples: ["Anh trai tôi ư? Anh ấy cao.", "Chị gái tôi ư? Chị ấy là bác sĩ."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le choix dépend du mot qui suit : un article, un possessif ou un démonstratif appelle ", { term: "c’est" }, " ; un métier ou un adjectif seul appelle ", { term: "il est" }, "."]
              en: ["The choice depends on the next word: an article, a possessive or a demonstrative calls for ", { term: "c’est" }, "; a job or an adjective alone calls for ", { term: "il est" }, "."]
              uk: ["Вибір залежить від наступного слова: артикль, присвійне чи вказівне слово вимагає ", { term: "c’est" }, "; сама професія чи прикметник — ", { term: "il est" }, "."]
              es: ["La elección depende de la palabra siguiente: un artículo, un posesivo o un demostrativo pide ", { term: "c’est" }, "; una profesión o un adjetivo solos piden ", { term: "il est" }, "."]
              pt: ["A escolha depende da palavra seguinte: um artigo, um possessivo ou um demonstrativo pede ", { term: "c’est" }, "; uma profissão ou um adjetivo sozinhos pedem ", { term: "il est" }, "."]
              de: ["Die Wahl hängt vom nächsten Wort ab: Ein Artikel, ein Possessivum oder ein Demonstrativum verlangt ", { term: "c’est" }, "; ein Beruf oder ein Adjektiv allein verlangt ", { term: "il est" }, "."]
              it: ["La scelta dipende dalla parola che segue: un articolo, un possessivo o un dimostrativo vuole ", { term: "c’est" }, "; una professione o un aggettivo da soli vogliono ", { term: "il est" }, "."]
              pl: ["Wybór zależy od następnego słowa: rodzajnik, zaimek dzierżawczy lub wskazujący wymaga ", { term: "c’est" }, "; sam zawód lub przymiotnik wymaga ", { term: "il est" }, "."]
              tr: ["Seçim sonraki sözcüğe bağlıdır: artikel, iyelik ya da işaret sözcüğü ", { term: "c’est" }, " ister; yalnız bir meslek ya da sıfat ", { term: "il est" }, " ister."]
              id: ["Pilihan bergantung pada kata berikutnya: artikel, kata kepemilikan, atau kata tunjuk memakai ", { term: "c’est" }, "; pekerjaan atau kata sifat saja memakai ", { term: "il est" }, "."]
              vi: ["Lựa chọn phụ thuộc vào từ đứng sau: mạo từ, từ sở hữu hoặc từ chỉ định dùng ", { term: "c’est" }, "; nghề nghiệp hoặc tính từ đứng một mình dùng ", { term: "il est" }, "."]
            ex: { examples: [[{ target: "C’est" }, " ma sœur."], [{ target: "Elle est" }, " médecin."]] }
            tr: { en: { examples: ["This is my sister.", "She is a doctor."] }, uk: { examples: ["Це моя сестра.", "Вона лікарка."] }, es: { examples: ["Es mi hermana.", "Es médica."] }, pt: { examples: ["É minha irmã.", "Ela é médica."] }, de: { examples: ["Das ist meine Schwester.", "Sie ist Ärztin."] }, it: { examples: ["È mia sorella.", "È medico."] }, pl: { examples: ["To moja siostra.", "Jest lekarką."] }, tr: { examples: ["Bu ablam.", "O doktor."] }, id: { examples: ["Ini kakakku.", "Dia dokter."] }, vi: { examples: ["Đây là chị gái tôi.", "Chị ấy là bác sĩ."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les formes d’", { term: "être" }, ", voir ", { link: "Être et avoir", to: "fr.etre-avoir.etre-avoir" }, " ; pour ", { term: "c’est moi" }, ", ", { term: "c’est toi" }, ", voir ", { link: "Les pronoms toniques", to: "fr.pronoms.pronoms-toniques" }, "."]
              en: ["For the forms of ", { term: "être" }, ", see ", { link: "Être and avoir", to: "fr.etre-avoir.etre-avoir" }, "; for ", { term: "c’est moi" }, " and ", { term: "c’est toi" }, ", see ", { link: "Stressed Pronouns", to: fr.pronoms.pronoms-toniques }, "."]
              uk: ["Про форми ", { term: "être" }, " — див. ", { link: "Être і avoir", to: "fr.etre-avoir.etre-avoir" }, "; про ", { term: "c’est moi" }, ", ", { term: "c’est toi" }, " — див. ", { link: "Наголошені займенники", to: "fr.pronoms.pronoms-toniques" }, "."]
              es: ["Para las formas de ", { term: "être" }, ", ver ", { link: "Être y avoir", to: "fr.etre-avoir.etre-avoir" }, "; para ", { term: "c’est moi" }, " y ", { term: "c’est toi" }, ", ver ", { link: "Los pronombres tónicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              pt: ["Para as formas de ", { term: "être" }, ", veja ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "; para ", { term: "c’est moi" }, " e ", { term: "c’est toi" }, ", veja ", { link: "Os pronomes tônicos", to: "fr.pronoms.pronoms-toniques" }, "."]
              de: ["Zu den Formen von ", { term: "être" }, " siehe ", { link: "Être und avoir", to: "fr.etre-avoir.etre-avoir" }, "; zu ", { term: "c’est moi" }, " und ", { term: "c’est toi" }, " siehe ", { link: "Die betonten Pronomen", to: "fr.pronoms.pronoms-toniques" }, "."]
              it: ["Per le forme di ", { term: "être" }, ", vedi ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "; per ", { term: "c’est moi" }, " e ", { term: "c’est toi" }, ", vedi ", { link: "I pronomi tonici", to: "fr.pronoms.pronoms-toniques" }, "."]
              pl: ["O formach ", { term: "être" }, " — zob. ", { link: "Être i avoir", to: "fr.etre-avoir.etre-avoir" }, "; o ", { term: "c’est moi" }, " i ", { term: "c’est toi" }, " — zob. ", { link: "Zaimki akcentowane", to: "fr.pronoms.pronoms-toniques" }, "."]
              tr: [{ term: "être" }, " biçimleri için bkz. ", { link: "Être ve avoir", to: "fr.etre-avoir.etre-avoir" }, "; ", { term: "c’est moi" }, " ve ", { term: "c’est toi" }, " için bkz. ", { link: "Vurgulu zamirler", to: "fr.pronoms.pronoms-toniques" }, "."]
              id: ["Untuk bentuk ", { term: "être" }, ", lihat ", { link: "Être dan avoir", to: "fr.etre-avoir.etre-avoir" }, "; untuk ", { term: "c’est moi" }, " dan ", { term: "c’est toi" }, ", lihat ", { link: "Pronomina tonik", to: "fr.pronoms.pronoms-toniques" }, "."]
              vi: ["Về các dạng của ", { term: "être" }, ", xem ", { link: "Être và avoir", to: "fr.etre-avoir.etre-avoir" }, "; về ", { term: "c’est moi" }, " và ", { term: "c’est toi" }, ", xem ", { link: "Đại từ nhấn mạnh", to: "fr.pronoms.pronoms-toniques" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour l’accord des adjectifs, voir ", { link: "Les adjectifs", to: "fr.adjectif-adverbe.adjectifs" }, " ; pour dire qu’une chose existe quelque part, voir ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
