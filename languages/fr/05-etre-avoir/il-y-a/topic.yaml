    uk: [{ term: "Il y a" }, " повідомляє, що річ або особа існує чи є десь, в однині й у множині."]
    es: [{ term: "Il y a" }, " dice que una cosa o una persona existe o está en algún lugar, en singular y en plural."]
    pt: [{ term: "Il y a" }, " diz que uma coisa ou uma pessoa existe ou está em algum lugar, no singular e no plural."]
    de: [{ term: "Il y a" }, " sagt, dass es etwas oder jemanden irgendwo gibt, im Singular wie im Plural."]
    it: [{ term: "Il y a" }, " dice che una cosa o una persona esiste o si trova da qualche parte, al singolare e al plurale."]
    pl: [{ term: "Il y a" }, " mówi, że rzecz lub osoba istnieje albo znajduje się w jakimś miejscu, w liczbie pojedynczej i mnogiej."]
    tr: [{ term: "Il y a" }, ", bir şeyin ya da kişinin bir yerde var olduğunu söyler; tekil ve çoğul için aynıdır."]
    id: [{ term: "Il y a" }, " menyatakan bahwa suatu benda atau orang ada di suatu tempat, baik tunggal maupun jamak."]
    vi: [{ term: "Il y a" }, " cho biết một vật hoặc một người có ở đâu đó, cả số ít lẫn số nhiều."]
