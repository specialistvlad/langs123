            it: [{ term: "il n’y a" }, " ", { alternatives: [{ term: "plus de" }, { term: "rien" }, { term: "personne" }] }]
            pl: [{ term: "il n’y a" }, " ", { alternatives: [{ term: "plus de" }, { term: "rien" }, { term: "personne" }] }]
            tr: [{ term: "il n’y a" }, " ", { alternatives: [{ term: "plus de" }, { term: "rien" }, { term: "personne" }] }]
            id: [{ term: "il n’y a" }, " ", { alternatives: [{ term: "plus de" }, { term: "rien" }, { term: "personne" }] }]
            vi: [{ term: "il n’y a" }, " ", { alternatives: [{ term: "plus de" }, { term: "rien" }, { term: "personne" }] }]
          ex: { examples: [[{ target: "Il n’y a" }, " personne ici."], [{ target: "Il n’y a plus de" }, " pain."]] }
          tr: { en: { examples: ["There is nobody here.", "There is no bread left."] }, uk: { examples: ["Тут нікого немає.", "Хліба більше немає."] }, es: { examples: ["No hay nadie aquí.", "Ya no hay pan."] }, pt: { examples: ["Não tem ninguém aqui.", "Não tem mais pão."] }, de: { examples: ["Hier ist niemand.", "Es gibt kein Brot mehr."] }, it: { examples: ["Qui non c’è nessuno.", "Non c’è più pane."] }, pl: { examples: ["Nikogo tu nie ma.", "Nie ma już chleba."] }, tr: { examples: ["Burada kimse yok.", "Ekmek kalmadı."] }, id: { examples: ["Tidak ada orang di sini.", "Roti sudah habis."] }, vi: { examples: ["Ở đây không có ai.", "Hết bánh mì rồi."] } }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: ["après ", { term: "il y a" }, ", pas de ", { term: "le" }, " ni de ", { term: "la" }, " : on dit où est une chose connue avec ", { term: "être" }]
            en: ["no ", { term: "le" }, " or ", { term: "la" }, " after ", { term: "il y a" }, ": a known thing is placed with ", { term: "être" }]
            uk: ["після ", { term: "il y a" }, " не ставлять ", { term: "le" }, " чи ", { term: "la" }, ": де знаходиться відома річ, кажуть через ", { term: "être" }]
            es: ["tras ", { term: "il y a" }, " no van ", { term: "le" }, " ni ", { term: "la" }, ": la cosa conocida se sitúa con ", { term: "être" }]
            pt: ["depois de ", { term: "il y a" }, " não entram ", { term: "le" }, " nem ", { term: "la" }, ": a coisa conhecida se situa com ", { term: "être" }]
            de: ["nach ", { term: "il y a" }, " stehen weder ", { term: "le" }, " noch ", { term: "la" }, ": etwas Bekanntes verortet man mit ", { term: "être" }]
            it: ["dopo ", { term: "il y a" }, " non vanno ", { term: "le" }, " né ", { term: "la" }, ": la cosa nota si colloca con ", { term: "être" }]
            pl: ["po ", { term: "il y a" }, " nie stawia się ", { term: "le" }, " ani ", { term: "la" }, ": znaną rzecz lokalizuje się czasownikiem ", { term: "être" }]
            tr: [{ term: "il y a" }, " sonrasında ", { term: "le" }, " ya da ", { term: "la" }, " gelmez; bilinen şeyin yeri ", { term: "être" }, " ile söylenir"]
            id: ["setelah ", { term: "il y a" }, " tidak ada ", { term: "le" }, " atau ", { term: "la" }, ": letak benda yang sudah dikenal dinyatakan dengan ", { term: "être" }]
            vi: ["sau ", { term: "il y a" }, " không có ", { term: "le" }, " hay ", { term: "la" }, ": vị trí của vật đã biết nói bằng ", { term: "être" }]
          ex: ["Le chat ", { target: "est" }, " dans la cuisine."]
          tr: { en: "The cat is in the kitchen.", uk: "Кіт на кухні.", es: "El gato está en la cocina.", pt: "O gato está na cozinha.", de: "Die Katze ist in der Küche.", it: "Il gatto è in cucina.", pl: "Kot jest w kuchni.", tr: "Kedi mutfakta.", id: "Kucingnya ada di dapur.", vi: "Con mèo ở trong bếp." }
        - level: "A1"
          point: { fr: "Piège", en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            fr: [{ term: "il y a" }, " veut dire « il existe » ; ", { term: "il a" }, " veut dire « il possède »"]
            en: [{ term: "il y a" }, " means “there is”; ", { term: "il a" }, " means “he has”"]
            uk: [{ term: "il y a" }, " означає «є»; ", { term: "il a" }, " означає «він має»"]
            es: [{ term: "il y a" }, " significa «hay»; ", { term: "il a" }, " significa «él tiene»"]
            pt: [{ term: "il y a" }, " significa «há»; ", { term: "il a" }, " significa «ele tem»"]
            de: [{ term: "il y a" }, " heißt „es gibt“; ", { term: "il a" }, " heißt „er hat“"]
            it: [{ term: "il y a" }, " significa «c’è»; ", { term: "il a" }, " significa «lui ha»"]
            pl: [{ term: "il y a" }, " znaczy „jest”; ", { term: "il a" }, " znaczy „on ma”"]
            tr: [{ term: "il y a" }, " “var” demektir; ", { term: "il a" }, " “onun var” demektir"]
            id: [{ term: "il y a" }, " berarti “ada”; ", { term: "il a" }, " berarti “dia punya”"]
            vi: [{ term: "il y a" }, " nghĩa là “có”; ", { term: "il a" }, " nghĩa là “anh ấy có”"]
          ex: ["Il ", { target: "y a" }, " un parc près d’ici."]
          tr: { en: "There is a park near here.", uk: "Поблизу є парк.", es: "Hay un parque cerca de aquí.", pt: "Há um parque perto daqui.", de: "Hier in der Nähe gibt es einen Park.", it: "Qui vicino c’è un parco.", pl: "Niedaleko stąd jest park.", tr: "Buraya yakın bir park var.", id: "Ada taman di dekat sini.", vi: "Gần đây có một công viên." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Il y a" }, " dit qu’une chose ou une personne existe ou se trouve quelque part."]
              en: [{ term: "Il y a" }, " says that a thing or a person exists or is somewhere: “there is”, “there are”."]
              uk: [{ term: "Il y a" }, " каже, що якась річ чи особа існує або є в певному місці."]
              es: [{ term: "Il y a" }, " dice que una cosa o una persona existe o está en algún lugar: es el «hay» del francés."]
              pt: [{ term: "Il y a" }, " diz que uma coisa ou uma pessoa existe ou está em algum lugar: é o «há» do francês."]
              de: [{ term: "Il y a" }, " sagt, dass es etwas oder jemanden irgendwo gibt: Es entspricht „es gibt“."]
              it: [{ term: "Il y a" }, " dice che una cosa o una persona esiste o si trova da qualche parte: corrisponde a «c’è» e «ci sono»."]
              pl: [{ term: "Il y a" }, " mówi, że jakaś rzecz lub osoba istnieje albo znajduje się w jakimś miejscu: odpowiada polskiemu „jest” i „są”."]
              tr: [{ term: "Il y a" }, ", bir şeyin ya da kişinin bir yerde var olduğunu söyler: Türkçedeki “var” gibidir."]
              id: [{ term: "Il y a" }, " menyatakan bahwa suatu benda atau orang ada di suatu tempat: sepadan dengan “ada”."]
              vi: [{ term: "Il y a" }, " cho biết một vật hoặc một người có mặt ở đâu đó: tương đương “có”."]
            ex: [{ target: "Il y a" }, " un chat dans le jardin."]
            tr: { en: "There is a cat in the garden.", uk: "У саду є кіт.", es: "Hay un gato en el jardín.", pt: "Há um gato no jardim.", de: "Im Garten ist eine Katze.", it: "C’è un gatto in giardino.", pl: "W ogrodzie jest kot.", tr: "Bahçede bir kedi var.", id: "Ada seekor kucing di kebun.", vi: "Trong vườn có một con mèo." }
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Il y a" }, " ne change pas : il sert pour une chose comme pour plusieurs."]
              en: [{ term: "Il y a" }, " never changes: it serves for one thing and for several."]
              uk: [{ term: "Il y a" }, " не змінюється: його вживають і для однієї речі, і для кількох."]
              es: [{ term: "Il y a" }, " no cambia: sirve para una cosa y para varias."]
              pt: [{ term: "Il y a" }, " não muda: serve para uma coisa e para várias."]
              de: [{ term: "Il y a" }, " verändert sich nicht: Es steht für eine Sache wie für mehrere."]
              it: [{ term: "Il y a" }, " non cambia: vale per una cosa e per più cose."]
              pl: [{ term: "Il y a" }, " się nie zmienia: stosuje się go do jednej rzeczy i do wielu."]
              tr: [{ term: "Il y a" }, " değişmez: bir şey için de, birkaç şey için de aynı kalır."]
              id: [{ term: "Il y a" }, " tidak berubah: dipakai untuk satu benda maupun beberapa benda."]
              vi: [{ term: "Il y a" }, " không đổi: dùng cho một vật cũng như nhiều vật."]
            ex: { examples: [[{ target: "Il y a" }, " un livre sur la table."], [{ target: "Il y a" }, " deux livres sur la table."]] }
            tr: { en: { examples: ["There is a book on the table.", "There are two books on the table."] }, uk: { examples: ["На столі є книжка.", "На столі є дві книжки."] }, es: { examples: ["Hay un libro sobre la mesa.", "Hay dos libros sobre la mesa."] }, pt: { examples: ["Há um livro sobre a mesa.", "Há dois livros sobre a mesa."] }, de: { examples: ["Auf dem Tisch liegt ein Buch.", "Auf dem Tisch liegen zwei Bücher."] }, it: { examples: ["C’è un libro sul tavolo.", "Ci sono due libri sul tavolo."] }, pl: { examples: ["Na stole jest książka.", "Na stole są dwie książki."] }, tr: { examples: ["Masanın üstünde bir kitap var.", "Masanın üstünde iki kitap var."] }, id: { examples: ["Ada satu buku di atas meja.", "Ada dua buku di atas meja."] }, vi: { examples: ["Trên bàn có một quyển sách.", "Trên bàn có hai quyển sách."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Après ", { term: "il y a" }, " vient un nom avec ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " ou un nombre."]
              en: ["After ", { term: "il y a" }, " comes a noun with ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " or a number."]
              uk: ["Після ", { term: "il y a" }, " стоїть іменник з ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " або з числом."]
              es: ["Después de ", { term: "il y a" }, " viene un nombre con ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " o un número."]
              pt: ["Depois de ", { term: "il y a" }, " vem um substantivo com ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " ou um número."]
              de: ["Nach ", { term: "il y a" }, " steht ein Nomen mit ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " oder einer Zahl."]
              it: ["Dopo ", { term: "il y a" }, " viene un nome con ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " o un numero."]
              pl: ["Po ", { term: "il y a" }, " następuje rzeczownik z ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " lub liczebnikiem."]
              tr: [{ term: "Il y a" }, " sonrasında ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " ya da bir sayıyla birlikte bir isim gelir."]
              id: ["Setelah ", { term: "il y a" }, " datang kata benda dengan ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, ", atau angka."]
              vi: ["Sau ", { term: "il y a" }, " là danh từ đi với ", { term: "un" }, ", ", { term: "une" }, ", ", { term: "des" }, " hoặc một số."]
            ex: { examples: [["Il y a ", { target: "une" }, " banque."], ["Il y a ", { target: "des" }, " enfants."], ["Il y a ", { target: "trois" }, " chaises."]] }
            tr: { en: { examples: ["There is a bank.", "There are children.", "There are three chairs."] }, uk: { examples: ["Є банк.", "Є діти.", "Є три стільці."] }, es: { examples: ["Hay un banco.", "Hay niños.", "Hay tres sillas."] }, pt: { examples: ["Há um banco.", "Há crianças.", "Há três cadeiras."] }, de: { examples: ["Es gibt eine Bank.", "Es sind Kinder da.", "Es gibt drei Stühle."] }, it: { examples: ["C’è una banca.", "Ci sono dei bambini.", "Ci sono tre sedie."] }, pl: { examples: ["Jest bank.", "Są dzieci.", "Są trzy krzesła."] }, tr: { examples: ["Bir banka var.", "Çocuklar var.", "Üç sandalye var."] }, id: { examples: ["Ada sebuah bank.", "Ada anak-anak.", "Ada tiga kursi."] }, vi: { examples: ["Có một ngân hàng.", "Có trẻ em.", "Có ba cái ghế."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Pour une quantité, ", { term: "il y a" }, " prend ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " ou ", { term: "beaucoup de" }, "."]
              en: ["For a quantity, ", { term: "il y a" }, " takes ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " or ", { term: "beaucoup de" }, "."]
              uk: ["Для кількості після ", { term: "il y a" }, " ставлять ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " або ", { term: "beaucoup de" }, "."]
              es: ["Para una cantidad, ", { term: "il y a" }, " lleva ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " o ", { term: "beaucoup de" }, "."]
              pt: ["Para uma quantidade, ", { term: "il y a" }, " leva ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " ou ", { term: "beaucoup de" }, "."]
              de: ["Für eine Menge steht nach ", { term: "il y a" }, " ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " oder ", { term: "beaucoup de" }, "."]
              it: ["Per una quantità, ", { term: "il y a" }, " prende ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " o ", { term: "beaucoup de" }, "."]
              pl: ["Dla ilości po ", { term: "il y a" }, " stawia się ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " lub ", { term: "beaucoup de" }, "."]
              tr: ["Miktar için ", { term: "il y a" }, " ile ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " ya da ", { term: "beaucoup de" }, " kullanılır."]
              id: ["Untuk jumlah, ", { term: "il y a" }, " dipakai dengan ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ", atau ", { term: "beaucoup de" }, "."]
              vi: ["Với một lượng, ", { term: "il y a" }, " đi với ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " hoặc ", { term: "beaucoup de" }, "."]
            ex: { examples: [["Il y a ", { target: "du" }, " pain."], ["Il y a ", { target: "de la" }, " soupe."], ["Il y a ", { target: "beaucoup de" }, " bruit."]] }
            tr: { en: { examples: ["There is some bread.", "There is some soup.", "There is a lot of noise."] }, uk: { examples: ["Є хліб.", "Є суп.", "Дуже шумно."] }, es: { examples: ["Hay pan.", "Hay sopa.", "Hay mucho ruido."] }, pt: { examples: ["Tem pão.", "Tem sopa.", "Tem muito barulho."] }, de: { examples: ["Es gibt Brot.", "Es gibt Suppe.", "Es ist sehr laut."] }, it: { examples: ["C’è del pane.", "C’è della zuppa.", "C’è molto rumore."] }, pl: { examples: ["Jest chleb.", "Jest zupa.", "Jest dużo hałasu."] }, tr: { examples: ["Ekmek var.", "Çorba var.", "Çok gürültü var."] }, id: { examples: ["Ada roti.", "Ada sup.", "Ada banyak kebisingan."] }, vi: { examples: ["Có bánh mì.", "Có súp.", "Có nhiều tiếng ồn."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les articles partitifs et les quantités, voir ", { link: "Les partitifs et les quantités", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              en: ["For the partitive articles and quantities, see ", { link: "Partitives and Quantities", to: fr.nom-determinants.partitifs-quantites }, "."]
              uk: ["Про партитивні артиклі й кількість — див. ", { link: "Партитивні артиклі й кількість", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              es: ["Para los partitivos y las cantidades, ver ", { link: "Partitivos y cantidades", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              pt: ["Para os partitivos e as quantidades, veja ", { link: "Partitivos e quantidades", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              de: ["Zu den Teilungsartikeln und Mengen siehe ", { link: "Teilungsartikel und Mengen", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              it: ["Per i partitivi e le quantità, vedi ", { link: "Partitivi e quantità", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              pl: ["O partytywach i ilościach — zob. ", { link: "Partytywy i ilości", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              tr: ["Bölme artikelleri ve miktarlar için bkz. ", { link: "Bölme artikelleri ve miktarlar", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              id: ["Untuk artikel partitif dan jumlah, lihat ", { link: "Partitif dan jumlah", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              vi: ["Về mạo từ bộ phận và lượng từ, xem ", { link: "Mạo từ bộ phận và lượng từ", to: "fr.nom-determinants.partitifs-quantites" }, "."]
          - type: "rule"
            level: "A1"
            text:
              fr: ["Un nom précis (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") ne suit pas ", { term: "il y a" }, " : on dit où il est avec ", { term: "être" }, "."]
              en: ["A specific noun (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") does not follow ", { term: "il y a" }, ": its place is said with ", { term: "être" }, "."]
              uk: ["Означений іменник (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") не стоїть після ", { term: "il y a" }, ": де він, кажуть через ", { term: "être" }, "."]
              es: ["Un nombre concreto (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") no va tras ", { term: "il y a" }, ": su lugar se dice con ", { term: "être" }, "."]
              pt: ["Um substantivo determinado (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") não vem depois de ", { term: "il y a" }, ": seu lugar se diz com ", { term: "être" }, "."]
              de: ["Ein bestimmtes Nomen (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") steht nicht nach ", { term: "il y a" }, ": Seinen Ort sagt man mit ", { term: "être" }, "."]
              it: ["Un nome determinato (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") non segue ", { term: "il y a" }, ": il suo luogo si dice con ", { term: "être" }, "."]
              pl: ["Określony rzeczownik (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") nie występuje po ", { term: "il y a" }, ": jego miejsce podaje się czasownikiem ", { term: "être" }, "."]
              tr: ["Belirli bir isim (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") ", { term: "il y a" }, " ile kullanılmaz; yeri ", { term: "être" }, " ile söylenir."]
              id: ["Kata benda yang tentu (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") tidak mengikuti ", { term: "il y a" }, ": letaknya dinyatakan dengan ", { term: "être" }, "."]
              vi: ["Danh từ xác định (", { term: "le" }, ", ", { term: "la" }, ", ", { term: "mon" }, ") không đứng sau ", { term: "il y a" }, ": vị trí của nó nói bằng ", { term: "être" }, "."]
            ex: { examples: [["Le chat ", { target: "est" }, " dans le jardin."], ["Mon sac ", { target: "est" }, " sur la chaise."]] }
            tr: { en: { examples: ["The cat is in the garden.", "My bag is on the chair."] }, uk: { examples: ["Кіт у саду.", "Моя сумка на стільці."] }, es: { examples: ["El gato está en el jardín.", "Mi bolso está en la silla."] }, pt: { examples: ["O gato está no jardim.", "Minha bolsa está na cadeira."] }, de: { examples: ["Die Katze ist im Garten.", "Meine Tasche ist auf dem Stuhl."] }, it: { examples: ["Il gatto è in giardino.", "La mia borsa è sulla sedia."] }, pl: { examples: ["Kot jest w ogrodzie.", "Moja torba jest na krześle."] }, tr: { examples: ["Kedi bahçede.", "Çantam sandalyenin üstünde."] }, id: { examples: ["Kucingnya ada di kebun.", "Tasku ada di atas kursi."] }, vi: { examples: ["Con mèo ở trong vườn.", "Túi của tôi ở trên ghế."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "être" }, " et le lieu d’une chose connue, voir ", { link: "Être et avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              en: ["For ", { term: "être" }, " and the place of a known thing, see ", { link: "Être and avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
