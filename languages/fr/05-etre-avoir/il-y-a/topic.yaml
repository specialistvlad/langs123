        rows:
          - level: "A1"
            wrong: "Il a un parc près d’ici."
            right: ["Il ", { target: "y" }, " a un parc près d’ici."]
            rule:
              fr: ["« there is » se dit ", { term: "il y a" }, " ; ", { term: "il a" }, " veut dire « il possède »"]
              en: ["“there is” is said ", { term: "il y a" }, "; ", { term: "il a" }, " means “he has”"]
              uk: ["«є» передають через ", { term: "il y a" }, "; ", { term: "il a" }, " означає «він має»"]
              es: ["«hay» se dice ", { term: "il y a" }, "; ", { term: "il a" }, " significa «él tiene»"]
              pt: ["«há» se diz ", { term: "il y a" }, "; ", { term: "il a" }, " significa «ele tem»"]
              de: ["„es gibt“ sagt man ", { term: "il y a" }, "; ", { term: "il a" }, " heißt „er hat“"]
              it: ["«c’è» si dice ", { term: "il y a" }, "; ", { term: "il a" }, " significa «lui ha»"]
              pl: ["„jest” wyraża się przez ", { term: "il y a" }, "; ", { term: "il a" }, " znaczy „on ma”"]
              tr: ["“var” ", { term: "il y a" }, " ile söylenir; ", { term: "il a" }, " “onun var” demektir"]
              id: ["“ada” dinyatakan dengan ", { term: "il y a" }, "; ", { term: "il a" }, " berarti “dia punya”"]
              vi: ["“có” diễn đạt bằng ", { term: "il y a" }, "; ", { term: "il a" }, " nghĩa là “anh ấy có”"]
          - level: "A1"
            speakers: ["en", "it", "pl"]
            wrong: "Il y ont des enfants dans le jardin."
            right: ["Il y ", { target: "a" }, " des enfants dans le jardin."]
            rule:
              en: [{ term: "il y a" }, " never takes a plural form; English “there are” has one, French does not"]
              it: [{ term: "il y a" }, " non ha forma plurale; l’italiano «ci sono» ce l’ha, il francese no"]
              pl: [{ term: "il y a" }, " nie ma liczby mnogiej; polskie „są” ją ma, francuskie nie"]
          - level: "A1"
            speakers: ["en"]
            wrong: "Il est un chat dans le jardin."
            right: ["Il ", { target: "y a" }, " un chat dans le jardin."]
            rule: { en: ["“there is” is ", { term: "il y a" }, ", not ", { term: "il est" }, "; ", { term: "il est" }, " describes someone or something known"] }
          - level: "A1"
            wrong: "Il y a le chat dans la cuisine."
            right: [{ target: "Le chat est" }, " dans la cuisine."]
            rule:
              fr: ["avec un nom précis (", { term: "le" }, ", ", { term: "la" }, "), on dit où il est avec ", { term: "être" }]
              en: ["with a specific noun (", { term: "le" }, ", ", { term: "la" }, "), the place is said with ", { term: "être" }]
              uk: ["з означеним іменником (", { term: "le" }, ", ", { term: "la" }, ") місце передають через ", { term: "être" }]
              es: ["con un nombre concreto (", { term: "le" }, ", ", { term: "la" }, "), el lugar se dice con ", { term: "être" }]
              pt: ["com um substantivo determinado (", { term: "le" }, ", ", { term: "la" }, "), o lugar se diz com ", { term: "être" }]
              de: ["bei einem bestimmten Nomen (", { term: "le" }, ", ", { term: "la" }, ") gibt man den Ort mit ", { term: "être" }, " an"]
              it: ["con un nome determinato (", { term: "le" }, ", ", { term: "la" }, "), il luogo si dice con ", { term: "être" }]
              pl: ["przy określonym rzeczowniku (", { term: "le" }, ", ", { term: "la" }, ") miejsce podaje się czasownikiem ", { term: "être" }]
              tr: ["belirli bir isimle (", { term: "le" }, ", ", { term: "la" }, ") yer ", { term: "être" }, " ile söylenir"]
              id: ["dengan kata benda tentu (", { term: "le" }, ", ", { term: "la" }, "), letak dinyatakan dengan ", { term: "être" }]
              vi: ["với danh từ xác định (", { term: "le" }, ", ", { term: "la" }, "), vị trí nói bằng ", { term: "être" }]
          - level: "A1"
            wrong: "Il n’y a pas des chaises."
            right: ["Il n’y a pas ", { target: "de" }, " chaises."]
            rule:
              fr: { takes: [{ term: "des" }, { term: "de" }] }
              en: { takes: [{ term: "des" }, { term: "de" }] }
              uk: { takes: [{ term: "des" }, { term: "de" }] }
              es: { takes: [{ term: "des" }, { term: "de" }] }
              pt: { takes: [{ term: "des" }, { term: "de" }] }
              de: { takes: [{ term: "des" }, { term: "de" }] }
              it: { takes: [{ term: "des" }, { term: "de" }] }
              pl: { takes: [{ term: "des" }, { term: "de" }] }
              tr: { takes: [{ term: "des" }, { term: "de" }] }
              id: { takes: [{ term: "des" }, { term: "de" }] }
              vi: { takes: [{ term: "des" }, { term: "de" }] }
          - level: "A2"
            wrong: "Y a-il une pharmacie ?"
            right: ["Y a", { target: "-t-" }, "il une pharmacie ?"]
            rule:
              fr: ["entre deux voyelles, on écrit ", { term: "-t-" }, " : ", { term: "y a-t-il" }]
              en: ["between two vowels, ", { term: "-t-" }, " is written: ", { term: "y a-t-il" }]
              uk: ["між двома голосними пишуть ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              es: ["entre dos vocales se escribe ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              pt: ["entre duas vogais escreve-se ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              de: ["zwischen zwei Vokalen schreibt man ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              it: ["tra due vocali si scrive ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              pl: ["między dwiema samogłoskami pisze się ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              tr: ["iki ünlü arasına ", { term: "-t-" }, " yazılır: ", { term: "y a-t-il" }]
              id: ["di antara dua vokal ditulis ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
              vi: ["giữa hai nguyên âm viết ", { term: "-t-" }, ": ", { term: "y a-t-il" }]
          - level: "A2"
            wrong: "Est-ce qu’il y a-t-il un bus ?"
            right: [{ target: "Est-ce qu’il y a" }, " un bus ?"]
            rule:
              fr: ["un seul marqueur de question : ", { term: "est-ce qu’" }, " ou l’inversion"]
              en: ["one question marker only: ", { term: "est-ce qu’" }, " or inversion"]
              uk: ["лише один показник питання: ", { term: "est-ce qu’" }, " або інверсія"]
              es: ["un solo marcador de pregunta: ", { term: "est-ce qu’" }, " o la inversión"]
              pt: ["um só marcador de pergunta: ", { term: "est-ce qu’" }, " ou a inversão"]
              de: ["nur eine Frageform: ", { term: "est-ce qu’" }, " oder Inversion"]
              it: ["un solo segnale di domanda: ", { term: "est-ce qu’" }, " o l’inversione"]
              pl: ["tylko jeden wykładnik pytania: ", { term: "est-ce qu’" }, " albo inwersja"]
              tr: ["tek bir soru işareti kullanılır: ", { term: "est-ce qu’" }, " ya da devrik sıra"]
              id: ["hanya satu penanda tanya: ", { term: "est-ce qu’" }, " atau inversi"]
              vi: ["chỉ dùng một dấu hiệu hỏi: ", { term: "est-ce qu’" }, " hoặc đảo ngữ"]
