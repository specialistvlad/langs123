              pt: ["Para ", { term: "être" }, " e o lugar de algo conhecido, veja ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              de: ["Zu ", { term: "être" }, " und dem Ort von etwas Bekanntem siehe ", { link: "Être und avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              it: ["Per ", { term: "être" }, " e il luogo di qualcosa di noto, vedi ", { link: "Être e avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              pl: ["O ", { term: "être" }, " i miejscu znanej rzeczy — zob. ", { link: "Être i avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              tr: [{ term: "Être" }, " ve bilinen bir şeyin yeri için bkz. ", { link: "Être ve avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              id: ["Untuk ", { term: "être" }, " dan letak benda yang sudah dikenal, lihat ", { link: "Être dan avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
              vi: ["Về ", { term: "être" }, " và vị trí của vật đã biết, xem ", { link: "Être và avoir", to: "fr.etre-avoir.etre-avoir" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: [{ term: "Il y a" }, " + durée veut dire aussi « il y a deux ans » : voir ", { link: "Les prépositions de temps", to: "fr.prepositions.prepositions-temps" }, "."]
              en: [{ term: "Il y a" }, " + a length of time also means “two years ago”: see ", { link: "Prepositions of Time", to: fr.prepositions.prepositions-temps }, "."]
              uk: [{ term: "Il y a" }, " + проміжок часу означає також «два роки тому»: див. ", { link: "Прийменники часу", to: "fr.prepositions.prepositions-temps" }, "."]
              es: [{ term: "Il y a" }, " + una duración significa también «hace dos años»: ver ", { link: "Las preposiciones de tiempo", to: "fr.prepositions.prepositions-temps" }, "."]
              pt: [{ term: "Il y a" }, " + uma duração significa também «há dois anos»: veja ", { link: "As preposições de tempo", to: "fr.prepositions.prepositions-temps" }, "."]
              de: [{ term: "Il y a" }, " + Zeitspanne heißt auch „vor zwei Jahren“: siehe ", { link: "Die Zeitpräpositionen", to: "fr.prepositions.prepositions-temps" }, "."]
              it: [{ term: "Il y a" }, " + una durata significa anche «due anni fa»: vedi ", { link: "Le preposizioni di tempo", to: "fr.prepositions.prepositions-temps" }, "."]
              pl: [{ term: "Il y a" }, " + okres czasu znaczy też „dwa lata temu”: zob. ", { link: "Przyimki czasu", to: "fr.prepositions.prepositions-temps" }, "."]
              tr: [{ term: "Il y a" }, " + süre “iki yıl önce” anlamına da gelir: bkz. ", { link: "Zaman edatları", to: "fr.prepositions.prepositions-temps" }, "."]
              id: [{ term: "Il y a" }, " + jangka waktu juga berarti “dua tahun yang lalu”: lihat ", { link: "Kata depan waktu", to: "fr.prepositions.prepositions-temps" }, "."]
              vi: [{ term: "Il y a" }, " + khoảng thời gian còn nghĩa là “hai năm trước”: xem ", { link: "Giới từ chỉ thời gian", to: "fr.prepositions.prepositions-temps" }, "."]
          - type: "note"
            level: "A2"
            text:
              fr: ["Pour répondre sans répéter le nom (", { term: "il y en a trois" }, "), voir ", { link: "Y et en", to: "fr.pronoms.y-en" }, "."]
              en: ["To answer without repeating the noun (", { term: "il y en a trois" }, "), see ", { link: "The Pronouns y and en", to: fr.pronoms.y-en }, "."]
              uk: ["Як відповісти, не повторюючи іменник (", { term: "il y en a trois" }, "), — див. ", { link: "Y та en", to: "fr.pronoms.y-en" }, "."]
              es: ["Para responder sin repetir el nombre (", { term: "il y en a trois" }, "), ver ", { link: "Y y en", to: "fr.pronoms.y-en" }, "."]
              pt: ["Para responder sem repetir o substantivo (", { term: "il y en a trois" }, "), veja ", { link: "Y e en", to: "fr.pronoms.y-en" }, "."]
              de: ["Wie man antwortet, ohne das Nomen zu wiederholen (", { term: "il y en a trois" }, "), steht in ", { link: "Y und en", to: "fr.pronoms.y-en" }, "."]
              it: ["Per rispondere senza ripetere il nome (", { term: "il y en a trois" }, "), vedi ", { link: "Y e en", to: "fr.pronoms.y-en" }, "."]
              pl: ["O odpowiadaniu bez powtarzania rzeczownika (", { term: "il y en a trois" }, ") — zob. ", { link: "Y i en", to: "fr.pronoms.y-en" }, "."]
              tr: ["İsmi tekrarlamadan cevap vermek için (", { term: "il y en a trois" }, ") bkz. ", { link: "Y ve en", to: "fr.pronoms.y-en" }, "."]
              id: ["Untuk menjawab tanpa mengulang kata benda (", { term: "il y en a trois" }, "), lihat ", { link: "Y dan en", to: "fr.pronoms.y-en" }, "."]
              vi: ["Cách trả lời mà không lặp lại danh từ (", { term: "il y en a trois" }, "): xem ", { link: "Y và en", to: "fr.pronoms.y-en" }, "."]
