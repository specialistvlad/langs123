              id: ["Sebelum ", { term: "y" }, ", ", { term: "ne" }, " menjadi ", { term: "n’" }, ": ", { term: "il n’y a pas" }, "."]
              vi: ["Trước ", { term: "y" }, ", ", { term: "ne" }, " thành ", { term: "n’" }, ": ", { term: "il n’y a pas" }, "."]
            ex: [{ target: "Il n’y" }, " a pas de lait."]
