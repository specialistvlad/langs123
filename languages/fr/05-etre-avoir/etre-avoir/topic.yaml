          ex: ["J’ai ", { target: "très" }, " faim."]
          tr: { en: "I'm very hungry.", uk: "Я дуже голодний.", es: "Tengo mucha hambre.", pt: "Eu estou com muita fome.", de: "Ich habe großen Hunger.", it: "Ho molta fame.", pl: "Jestem bardzo głodny.", tr: "Çok acıktım.", id: "Aku sangat lapar.", vi: "Tôi rất đói." }
sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              fr: [{ term: "Être" }, " et ", { term: "avoir" }, " sont irréguliers : on apprend leurs formes par cœur."]
              en: [{ term: "Être" }, " and ", { term: "avoir" }, " are irregular: learn their forms by heart."]
              uk: [{ term: "Être" }, " та ", { term: "avoir" }, " — неправильні дієслова: їхні форми треба вивчити напам’ять."]
              es: [{ term: "Être" }, " y ", { term: "avoir" }, " son irregulares: sus formas se aprenden de memoria."]
              pt: [{ term: "Être" }, " e ", { term: "avoir" }, " são irregulares: suas formas se aprendem de cor."]
              de: [{ term: "Être" }, " und ", { term: "avoir" }, " sind unregelmäßig: Man lernt ihre Formen auswendig."]
              it: [{ term: "Être" }, " e ", { term: "avoir" }, " sono irregolari: le loro forme si imparano a memoria."]
              pl: [{ term: "Être" }, " i ", { term: "avoir" }, " są czasownikami nieregularnymi: ich formy trzeba znać na pamięć."]
              tr: [{ term: "Être" }, " ve ", { term: "avoir" }, " düzensizdir: biçimleri ezbere öğrenilir."]
              id: [{ term: "Être" }, " dan ", { term: "avoir" }, " tidak beraturan: bentuknya dihafalkan."]
              vi: [{ term: "Être" }, " và ", { term: "avoir" }, " là động từ bất quy tắc: cần học thuộc các dạng của chúng."]
            ex: { examples: [["Je ", { target: "suis" }, " Léa."], ["J’", { target: "ai" }, " vingt ans."]] }
            tr: { en: { examples: ["I'm Léa.", "I'm twenty."] }, uk: { examples: ["Я Леа.", "Мені двадцять років."] }, es: { examples: ["Soy Léa.", "Tengo veinte años."] }, pt: { examples: ["Eu sou a Léa.", "Eu tenho vinte anos."] }, de: { examples: ["Ich bin Léa.", "Ich bin zwanzig Jahre alt."] }, it: { examples: ["Sono Léa.", "Ho vent'anni."] }, pl: { examples: ["Jestem Léa.", "Mam dwadzieścia lat."] }, tr: { examples: ["Ben Léa’yım.", "Yirmi yaşındayım."] }, id: { examples: ["Aku Léa.", "Usiaku dua puluh tahun."] }, vi: { examples: ["Tôi là Léa.", "Tôi hai mươi tuổi."] } }
          - type: "rule"
            level: "A0"
            text:
              fr: "Le verbe a toujours un sujet exprimé : un pronom ou un nom."
              en: "The verb always has a stated subject: a pronoun or a noun."
              uk: "Дієслово завжди має виражений підмет: займенник або іменник."
              es: "El verbo siempre lleva un sujeto expreso: un pronombre o un nombre."
              pt: "O verbo sempre tem um sujeito expresso: um pronome ou um substantivo."
              de: "Das Verb hat immer ein ausgedrücktes Subjekt: ein Pronomen oder ein Nomen."
              it: "Il verbo ha sempre un soggetto espresso: un pronome o un nome."
              pl: "Czasownik zawsze ma wyrażony podmiot: zaimek lub rzeczownik."
              tr: "Fiilin her zaman belirtilmiş bir öznesi vardır: bir zamir ya da bir isim."
              id: "Kata kerja selalu memiliki subjek yang disebutkan: pronomina atau kata benda."
              vi: "Động từ luôn có chủ ngữ được nêu ra: một đại từ hoặc một danh từ."
            ex: { examples: [["Nous ", { target: "sommes" }, " amis."], ["Léa ", { target: "a" }, " un chat."]] }
            tr: { en: { examples: ["We're friends.", "Léa has a cat."] }, uk: { examples: ["Ми друзі.", "У Леа є кіт."] }, es: { examples: ["Somos amigos.", "Léa tiene un gato."] }, pt: { examples: ["Somos amigos.", "A Léa tem um gato."] }, de: { examples: ["Wir sind Freunde.", "Léa hat eine Katze."] }, it: { examples: ["Siamo amici.", "Léa ha un gatto."] }, pl: { examples: ["Jesteśmy przyjaciółmi.", "Léa ma kota."] }, tr: { examples: ["Biz arkadaşız.", "Léa’nın bir kedisi var."] }, id: { examples: ["Kami berteman.", "Léa punya seekor kucing."] }, vi: { examples: ["Chúng tôi là bạn.", "Léa có một con mèo."] } }
          - type: "note"
            level: "A0"
            text:
              fr: ["Pour les pronoms sujets, voir ", { link: "Les pronoms sujets", to: "fr.pronoms.pronoms-sujets" }, "."]
              en: ["For the subject pronouns, see ", { link: "Subject Pronouns", to: fr.pronoms.pronoms-sujets }, "."]
              uk: ["Про підметові займенники — див. ", { link: "Підметові займенники", to: "fr.pronoms.pronoms-sujets" }, "."]
              es: ["Para los pronombres sujeto, ver ", { link: "Los pronombres sujeto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pt: ["Para os pronomes sujeito, veja ", { link: "Os pronomes sujeito", to: "fr.pronoms.pronoms-sujets" }, "."]
              de: ["Zu den Subjektpronomen siehe ", { link: "Die Subjektpronomen", to: "fr.pronoms.pronoms-sujets" }, "."]
              it: ["Per i pronomi soggetto, vedi ", { link: "I pronomi soggetto", to: "fr.pronoms.pronoms-sujets" }, "."]
              pl: ["O zaimkach podmiotowych — zob. ", { link: "Zaimki podmiotowe", to: "fr.pronoms.pronoms-sujets" }, "."]
              tr: ["Özne zamirleri için bkz. ", { link: "Özne zamirleri", to: "fr.pronoms.pronoms-sujets" }, "."]
              id: ["Untuk pronomina subjek, lihat ", { link: "Pronomina subjek", to: "fr.pronoms.pronoms-sujets" }, "."]
              vi: ["Về đại từ chủ ngữ, xem ", { link: "Đại từ chủ ngữ", to: "fr.pronoms.pronoms-sujets" }, "."]
          - type: "rule"
            level: "A1"
            text:
              fr: [{ term: "Être" }, " dit ce qu’est quelqu’un ou quelque chose ; ", { term: "avoir" }, " dit ce qu’il possède ou ressent."]
              en: [{ term: "Être" }, " says what someone or something is; ", { term: "avoir" }, " says what they have or feel."]
              uk: [{ term: "Être" }, " вказує, ким чи чим є хтось або щось; ", { term: "avoir" }, " — що в нього є або що він відчуває."]
              es: [{ term: "Être" }, " dice qué es alguien o algo; ", { term: "avoir" }, " dice qué posee o qué siente."]
              pt: [{ term: "Être" }, " diz o que alguém ou algo é; ", { term: "avoir" }, " diz o que tem ou sente."]
              de: [{ term: "Être" }, " sagt, was jemand oder etwas ist; ", { term: "avoir" }, " sagt, was er hat oder spürt."]
              it: [{ term: "Être" }, " dice che cosa è qualcuno o qualcosa; ", { term: "avoir" }, " dice che cosa possiede o prova."]
              pl: [{ term: "Être" }, " mówi, kim lub czym ktoś jest; ", { term: "avoir" }, " mówi, co ktoś ma lub czuje."]
              tr: [{ term: "Être" }, " birinin ya da bir şeyin ne olduğunu; ", { term: "avoir" }, " ise neye sahip olduğunu ya da ne hissettiğini söyler."]
              id: [{ term: "Être" }, " menyatakan apa atau siapa seseorang atau sesuatu; ", { term: "avoir" }, " menyatakan apa yang dimiliki atau dirasakan."]
              vi: [{ term: "Être" }, " cho biết ai đó hay vật gì là gì; ", { term: "avoir" }, " cho biết có gì hoặc cảm thấy gì."]
            ex: { examples: [["Elle ", { target: "est" }, " française."], ["Elle ", { target: "a" }, " faim."]] }
            tr: { en: { examples: ["She is French.", "She is hungry."] }, uk: { examples: ["Вона француженка.", "Вона голодна."] }, es: { examples: ["Ella es francesa.", "Ella tiene hambre."] }, pt: { examples: ["Ela é francesa.", "Ela está com fome."] }, de: { examples: ["Sie ist Französin.", "Sie hat Hunger."] }, it: { examples: ["Lei è francese.", "Ha fame."] }, pl: { examples: ["Ona jest Francuzką.", "Jest głodna."] }, tr: { examples: ["O Fransız.", "Acıkmış."] }, id: { examples: ["Dia orang Prancis.", "Dia lapar."] }, vi: { examples: ["Cô ấy là người Pháp.", "Cô ấy đói."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour présenter quelqu’un ou quelque chose, voir ", { link: "C’est et il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              en: ["To introduce someone or something, see ", { link: "C’est and Il est", to: fr.etre-avoir.c-est-il-est }, "."]
              uk: ["Як представити когось або щось — див. ", { link: "C’est та il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              es: ["Para presentar a alguien o algo, ver ", { link: "C’est y il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              pt: ["Para apresentar alguém ou algo, veja ", { link: "C’est e il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              de: ["Wie man jemanden oder etwas vorstellt, steht in ", { link: "C’est und il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              it: ["Per presentare qualcuno o qualcosa, vedi ", { link: "C’est e il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              pl: ["O przedstawianiu kogoś lub czegoś — zob. ", { link: "C’est i il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              tr: ["Birini ya da bir şeyi tanıtmak için bkz. ", { link: "C’est ve il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              id: ["Untuk memperkenalkan seseorang atau sesuatu, lihat ", { link: "C’est dan il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
              vi: ["Cách giới thiệu ai đó hoặc vật gì: xem ", { link: "C’est và il est", to: "fr.etre-avoir.c-est-il-est" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour dire qu’une chose existe quelque part, voir ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              en: ["To say that something exists somewhere, see ", { link: "There Is: il y a", to: fr.etre-avoir.il-y-a }, "."]
              uk: ["Як сказати, що щось є десь, — див. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              es: ["Para decir que algo existe en un lugar, ver ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pt: ["Para dizer que algo existe em algum lugar, veja ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              de: ["Wie man sagt, dass etwas irgendwo existiert, steht in ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              it: ["Per dire che qualcosa esiste in un luogo, vedi ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              pl: ["O tym, jak powiedzieć, że coś gdzieś jest — zob. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              tr: ["Bir şeyin bir yerde bulunduğunu söylemek için bkz. ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              id: ["Untuk menyatakan bahwa sesuatu ada di suatu tempat, lihat ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
              vi: ["Cách nói rằng có một thứ ở đâu đó: xem ", { link: "Il y a", to: "fr.etre-avoir.il-y-a" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: [{ term: "Être" }, " et ", { term: "avoir" }, " servent aussi d’auxiliaires au passé composé : ", { link: "Le passé composé : j’ai mangé", to: fr.passe.passe-compose }, "."]
              en: [{ term: "Être" }, " and ", { term: "avoir" }, " also serve as helper verbs in the passé composé: ", { link: "Passé Composé: j’ai mangé", to: fr.passe.passe-compose }, "."]
