          ex: [{ target: "A-t-il" }, " faim ?"]
          tr: { en: "Is he hungry?", uk: "Він голодний?", es: "¿Tiene hambre?", pt: "Ele está com fome?", de: "Hat er Hunger?", it: "Ha fame?", pl: "Czy jest głodny?", tr: "Acıktı mı?", id: "Apakah dia lapar?", vi: "Anh ấy có đói không?" }
        - level: "A1"
