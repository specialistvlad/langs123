            tr: [{ term: "faim" }, ", ", { term: "chaud" }, ", ", { term: "froid" }, " ", { term: "très" }, " ya da ", { term: "trop" }, " ile pekiştirilir"]
            id: [{ term: "faim" }, ", ", { term: "chaud" }, ", ", { term: "froid" }, " diperkuat dengan ", { term: "très" }, " atau ", { term: "trop" }]
