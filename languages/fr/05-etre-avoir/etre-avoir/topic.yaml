          ex: ["Je ", { target: "ne suis pas" }, " prêt."]
          tr: { en: "I'm not ready.", uk: "Я не готовий.", es: "No estoy listo.", pt: "Eu não estou pronto.", de: "Ich bin nicht fertig.", it: "Non sono pronto.", pl: "Nie jestem gotowy.", tr: "Hazır değilim.", id: "Aku belum siap.", vi: "Tôi chưa sẵn sàng." }
