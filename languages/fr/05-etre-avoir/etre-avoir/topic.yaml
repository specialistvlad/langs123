            vi: ["tuổi đi với ", { term: "avoir" }, ", không bao giờ với ", { term: "être" }]
          ex: ["Il ", { target: "a" }, " vingt ans."]
          tr: { en: "He is twenty.", uk: "Йому двадцять років.", es: "Él tiene veinte años.", pt: "Ele tem vinte anos.", de: "Er ist zwanzig Jahre alt.", it: "Ha vent'anni.", pl: "On ma dwadzieścia lat.", tr: "O yirmi yaşında.", id: "Dia berusia dua puluh tahun.", vi: "Anh ấy hai mươi tuổi." }
