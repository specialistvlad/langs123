summary:
  lead:
    fr: [{ term: "Être" }, " dit qui on est, d’où on vient et comment on est ; ", { term: "avoir" }, " dit ce qu’on a, son âge et ses besoins."]
    en: [{ term: "Être" }, " says who someone is, where they are from and what they are like; ", { term: "avoir" }, " says what someone has, their age and their needs."]
    uk: [{ term: "Être" }, " каже, ким хтось є, звідки він і який він; ", { term: "avoir" }, " — що в нього є, скільки йому років і чого він потребує."]
    es: [{ term: "Être" }, " dice quién es alguien, de dónde viene y cómo es; ", { term: "avoir" }, " dice qué tiene, qué edad tiene y qué necesita."]
    pt: [{ term: "Être" }, " diz quem alguém é, de onde vem e como é; ", { term: "avoir" }, " diz o que alguém tem, a idade e as necessidades."]
    de: [{ term: "Être" }, " sagt, wer jemand ist, woher er kommt und wie er ist; ", { term: "avoir" }, " sagt, was jemand hat, wie alt er ist und was er braucht."]
    it: [{ term: "Être" }, " dice chi è qualcuno, di dove viene e com'è; ", { term: "avoir" }, " dice che cosa ha, quanti anni ha e di che cosa ha bisogno."]
    pl: [{ term: "Être" }, " mówi, kim ktoś jest, skąd pochodzi i jaki jest; ", { term: "avoir" }, " mówi, co ktoś ma, ile ma lat i czego potrzebuje."]
    tr: [{ term: "Être" }, " birinin kim olduğunu, nereden geldiğini ve nasıl biri olduğunu; ", { term: "avoir" }, " ise neyi olduğunu, yaşını ve ihtiyaçlarını anlatır."]
    id: [{ term: "Être" }, " menyatakan siapa seseorang, dari mana asalnya, dan seperti apa dia; ", { term: "avoir" }, " menyatakan apa yang dimiliki, usianya, dan kebutuhannya."]
    vi: [{ term: "Être" }, " cho biết ai đó là ai, đến từ đâu và như thế nào; ", { term: "avoir" }, " cho biết ai đó có gì, bao nhiêu tuổi và cần gì."]
  rule:
    fr: ["L’âge, la faim et la soif se disent avec ", { term: "avoir" }, ", pas avec ", { term: "être" }, " :"]
    en: ["Age, hunger and thirst take ", { term: "avoir" }, ", not ", { term: "être" }, ":"]
    uk: ["Вік, голод і спрагу передають дієсловом ", { term: "avoir" }, ", а не ", { term: "être" }, ":"]
    es: ["La edad, el hambre y la sed se dicen con ", { term: "avoir" }, ", no con ", { term: "être" }, ":"]
    pt: ["A idade, a fome e a sede se dizem com ", { term: "avoir" }, ", não com ", { term: "être" }, ":"]
    de: ["Alter, Hunger und Durst stehen mit ", { term: "avoir" }, ", nicht mit ", { term: "être" }, ":"]
    it: ["L'età, la fame e la sete si dicono con ", { term: "avoir" }, ", non con ", { term: "être" }, ":"]
    pl: ["Wiek, głód i pragnienie wyraża się czasownikiem ", { term: "avoir" }, ", a nie ", { term: "être" }, ":"]
    tr: ["Yaş, açlık ve susuzluk ", { term: "avoir" }, " ile söylenir, ", { term: "être" }, " ile değil:"]
    id: ["Usia, rasa lapar, dan rasa haus dinyatakan dengan ", { term: "avoir" }, ", bukan ", { term: "être" }, ":"]
    vi: ["Tuổi, cơn đói và cơn khát được diễn đạt bằng ", { term: "avoir" }, ", không phải ", { term: "être" }, ":"]
  ex: { examples: [["J’", { target: "ai" }, " vingt ans."], ["Elle ", { target: "a" }, " faim."]] }
