          tr: { en: "She doesn't have a car.", uk: "У неї немає машини.", es: "Ella no tiene coche.", pt: "Ela não tem carro.", de: "Sie hat kein Auto.", it: "Non ha la macchina.", pl: "Ona nie ma samochodu.", tr: "Onun arabası yok.", id: "Dia tidak punya mobil.", vi: "Cô ấy không có xe hơi." }
        - level: "A0"
