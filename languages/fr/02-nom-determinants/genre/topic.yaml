sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Tout nom est masculin ou féminin, les noms de choses aussi."
              en: "Every noun is masculine or feminine, nouns for things too."
              uk: "Кожен іменник чоловічого або жіночого роду, назви речей також."
              es: "Todo sustantivo es masculino o femenino, también los de cosas."
              pt: "Todo substantivo é masculino ou feminino, também os de coisas."
              de: "Jedes Nomen ist männlich oder weiblich, auch Nomen für Dinge."
              it: "Ogni sostantivo è maschile o femminile, anche quelli che indicano cose."
              pl: "Każdy rzeczownik jest rodzaju męskiego lub żeńskiego, także nazwy rzeczy."
              tr: "Her isim erildir ya da dişildir, eşya adları da."
              id: "Setiap kata benda bergender maskulin atau feminin, termasuk nama benda."
              vi: "Mọi danh từ đều thuộc giống đực hoặc giống cái, kể cả danh từ chỉ đồ vật."
            ex: { examples: [[{ target: "le" }, " stylo"], [{ target: "la" }, " clé"]] }
            tr: { en: { examples: ["the pen", "the key"] }, uk: { examples: ["ручка", "ключ"] }, es: { examples: ["el bolígrafo", "la llave"] }, pt: { examples: ["a caneta", "a chave"] }, de: { examples: ["der Stift", "der Schlüssel"] }, it: { examples: ["la penna", "la chiave"] }, pl: { examples: ["długopis", "klucz"] }, tr: { examples: ["kalem", "anahtar"] }, id: { examples: ["pulpen", "kunci"] }, vi: { examples: ["cây bút", "chìa khóa"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "On apprend chaque nom avec son article, qui montre le genre."
              en: "Learn each noun with its article, which shows the gender."
              uk: "Кожен іменник вивчають з артиклем: він показує рід."
              es: "Cada sustantivo se aprende con su artículo, que muestra el género."
              pt: "Cada substantivo se aprende com o seu artigo, que mostra o gênero."
              de: "Man lernt jedes Nomen mit seinem Artikel, der das Genus zeigt."
              it: "Si impara ogni sostantivo con il suo articolo, che mostra il genere."
              pl: "Każdy rzeczownik uczy się razem z przedimkiem, który pokazuje rodzaj."
              tr: "Her isim, cinsiyeti gösteren artikeliyle birlikte öğrenilir."
              id: "Pelajari setiap kata benda bersama artikelnya, yang menunjukkan gendernya."
              vi: "Học mỗi danh từ cùng mạo từ của nó, vì mạo từ cho biết giống."
            ex: { examples: [[{ target: "un" }, " livre"], [{ target: "une" }, " table"]] }
            tr: { en: { examples: ["a book", "a table"] }, uk: { examples: ["книга", "стіл"] }, es: { examples: ["un libro", "una mesa"] }, pt: { examples: ["um livro", "uma mesa"] }, de: { examples: ["ein Buch", "ein Tisch"] }, it: { examples: ["un libro", "un tavolo"] }, pl: { examples: ["książka", "stół"] }, tr: { examples: ["bir kitap", "bir masa"] }, id: { examples: ["sebuah buku", "sebuah meja"] }, vi: { examples: ["một quyển sách", "một cái bàn"] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Les mots qui accompagnent le nom prennent son genre : l’article, l’adjectif, le possessif, le démonstratif."
              en: "The words that go with the noun take its gender: the article, the adjective, the possessive, the demonstrative."
              uk: "Слова біля іменника набувають його роду: артикль, прикметник, присвійне й вказівне слово."
              es: "Las palabras que acompañan al sustantivo toman su género: el artículo, el adjetivo, el posesivo y el demostrativo."
              pt: "As palavras que acompanham o substantivo tomam o seu gênero: o artigo, o adjetivo, o possessivo e o demonstrativo."
              de: "Die Wörter beim Nomen übernehmen sein Genus: Artikel, Adjektiv, Possessivbegleiter und Demonstrativbegleiter."
              it: "Le parole che accompagnano il sostantivo prendono il suo genere: l'articolo, l'aggettivo, il possessivo e il dimostrativo."
              pl: "Słowa towarzyszące rzeczownikowi przyjmują jego rodzaj: przedimek, przymiotnik, zaimek dzierżawczy i wskazujący."
              tr: "İsmin yanındaki sözcükler onun cinsiyetini alır: artikel, sıfat, iyelik ve işaret sözcükleri."
              id: "Kata yang menyertai kata benda mengikuti gendernya: artikel, kata sifat, posesif, dan demonstratif."
              vi: "Các từ đi kèm danh từ theo giống của nó: mạo từ, tính từ, từ sở hữu và từ chỉ định."
            ex: { examples: [[{ target: "un" }, " ", { target: "petit" }, " livre"], [{ target: "une" }, " ", { target: "petite" }, " table"]] }
            tr: { en: { examples: ["a small book", "a small table"] }, uk: { examples: ["маленька книжка", "маленький стіл"] }, es: { examples: ["un libro pequeño", "una mesa pequeña"] }, pt: { examples: ["um livro pequeno", "uma mesa pequena"] }, de: { examples: ["ein kleines Buch", "ein kleiner Tisch"] }, it: { examples: ["un libro piccolo", "un tavolo piccolo"] }, pl: { examples: ["mała książka", "mały stół"] }, tr: { examples: ["küçük bir kitap", "küçük bir masa"] }, id: { examples: ["buku kecil", "meja kecil"] }, vi: { examples: ["một quyển sách nhỏ", "một cái bàn nhỏ"] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Les formes des articles : voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: ["The forms of the articles: see ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: ["Форми артиклів: див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: ["Las formas de los artículos: ver ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: ["As formas dos artigos: veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: ["Die Formen der Artikel: siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: ["Le forme degli articoli: vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: ["Formy przedimków: zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: ["Artikellerin biçimleri için bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: ["Bentuk artikel: lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: ["Các dạng mạo từ: xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["L’accord de l’adjectif avec le nom : voir ", { link: "Les adjectifs", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              en: ["How the adjective agrees with the noun: see ", { link: "Adjectives", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              uk: ["Як прикметник узгоджується з іменником: див. ", { link: "Прикметники", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              es: ["La concordancia del adjetivo con el sustantivo: ver ", { link: "Los adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pt: ["A concordância do adjetivo com o substantivo: veja ", { link: "Os adjetivos", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              de: ["Die Angleichung des Adjektivs an das Nomen: siehe ", { link: "Die Adjektive", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              it: ["L'accordo dell'aggettivo con il sostantivo: vedi ", { link: "Gli aggettivi", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              pl: ["Zgodność przymiotnika z rzeczownikiem: zob. ", { link: "Przymiotniki", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              tr: ["Sıfatın isimle uyumu için bkz. ", { link: "Sıfatlar", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              id: ["Penyesuaian kata sifat dengan kata benda: lihat ", { link: "Kata sifat", to: "fr.adjectif-adverbe.adjectifs" }, "."]
              vi: ["Sự hòa hợp của tính từ với danh từ: xem ", { link: "Tính từ", to: "fr.adjectif-adverbe.adjectifs" }, "."]
