            label: { fr: "Féminin", en: "Feminine", uk: "Жіночий рід", es: "Femenino", pt: "Feminino", de: "Femininum", it: "Femminile", pl: "Rodzaj żeński", tr: "Dişil", id: "Feminin", vi: "Giống cái" }
            features: { gender: "fem" }
        rows:
          - { level: "A1", masc: ["ami ", { ipa: "ami" }], fem: ["amie ", { ipa: "ami" }] }
          - { level: "A1", masc: ["étudiant ", { ipa: "etydjɑ̃" }], fem: ["étudiante ", { ipa: "etydjɑ̃t" }] }
          - { level: "A1", masc: ["client ", { ipa: "klijɑ̃" }], fem: ["cliente ", { ipa: "klijɑ̃t" }] }
          - { level: "A2", masc: ["voisin ", { ipa: "vwazɛ̃" }], fem: ["voisine ", { ipa: "vwazin" }] }
          - { level: "A2", masc: ["chanteur ", { ipa: "ʃɑ̃tœʁ" }], fem: ["chanteuse ", { ipa: "ʃɑ̃tøz" }] }
          - { level: "A2", masc: ["acteur ", { ipa: "aktœʁ" }], fem: ["actrice ", { ipa: "aktʁis" }] }
          - { level: "A2", masc: ["musicien ", { ipa: "myzisjɛ̃" }], fem: ["musicienne ", { ipa: "myzisjɛn" }] }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le ", { term: "-e" }, " final est muet, mais la consonne qui le précède se prononce : ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              en: ["The final ", { term: "-e" }, " is silent, but the consonant before it is heard: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              uk: ["Кінцеве ", { term: "-e" }, " не вимовляється, але приголосна перед ним звучить: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              es: ["La ", { term: "-e" }, " final es muda, pero se pronuncia la consonante anterior: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              pt: ["O ", { term: "-e" }, " final é mudo, mas a consoante anterior é pronunciada: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              de: ["Das ", { term: "-e" }, " am Ende bleibt stumm, aber der Konsonant davor wird gesprochen: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              it: ["La ", { term: "-e" }, " finale è muta, ma la consonante che la precede si pronuncia: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              pl: ["Końcowe ", { term: "-e" }, " jest nieme, ale poprzedzająca je spółgłoska jest wymawiana: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              tr: ["Sondaki ", { term: "-e" }, " okunmaz, ama önündeki ünsüz okunur: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              id: [{ term: "-e" }, " di akhir tidak dibaca, tetapi konsonan sebelumnya dilafalkan: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
              vi: ["Chữ ", { term: "-e" }, " cuối không đọc, nhưng phụ âm đứng trước nó được đọc ra: ", { term: "étudiant" }, " ", { ipa: "etydjɑ̃" }, ", ", { term: "étudiante" }, " ", { ipa: "etydjɑ̃t" }, "."]
          - type: "rule"
            level: "A1"
            text:
              fr: ["Quand le nom finit déjà par une voyelle, le féminin se prononce comme le masculin : ", { term: "ami" }, ", ", { term: "amie" }, "."]
              en: ["When the noun already ends in a vowel, the feminine sounds like the masculine: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              uk: ["Якщо іменник уже закінчується на голосну, жіноча форма звучить так само, як чоловіча: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              es: ["Cuando el sustantivo ya termina en vocal, el femenino suena igual que el masculino: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              pt: ["Quando o substantivo já termina em vogal, o feminino soa como o masculino: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              de: ["Endet das Nomen schon auf einen Vokal, klingt das Femininum wie das Maskulinum: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              it: ["Quando il sostantivo termina già con una vocale, il femminile suona come il maschile: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              pl: ["Gdy rzeczownik kończy się już samogłoską, forma żeńska brzmi tak samo jak męska: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              tr: ["İsim zaten ünlüyle bitiyorsa dişil biçim eril biçimle aynı okunur: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              id: ["Jika kata benda sudah berakhir dengan vokal, bentuk feminin terdengar sama dengan maskulin: ", { term: "ami" }, ", ", { term: "amie" }, "."]
              vi: ["Khi danh từ đã tận cùng bằng nguyên âm, dạng giống cái đọc giống dạng giống đực: ", { term: "ami" }, ", ", { term: "amie" }, "."]
          - type: "rule"
            level: "A2"
            text:
              fr: ["Une voyelle nasale perd sa nasalité au féminin : ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              en: ["A nasal vowel loses its nasality in the feminine: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              uk: ["Носова голосна у жіночій формі втрачає носовість: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              es: ["Una vocal nasal pierde su nasalidad en femenino: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              pt: ["Uma vogal nasal perde a nasalidade no feminino: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              de: ["Ein Nasalvokal verliert im Femininum seine Nasalität: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              it: ["Una vocale nasale perde la nasalità al femminile: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              pl: ["Samogłoska nosowa traci w formie żeńskiej nosowość: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              tr: ["Geniz ünlüsü dişil biçimde genizsiliğini kaybeder: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              id: ["Vokal sengau kehilangan kesengauannya pada bentuk feminin: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
              vi: ["Nguyên âm mũi mất âm mũi ở giống cái: ", { term: "voisin" }, " ", { ipa: "vwazɛ̃" }, ", ", { term: "voisine" }, " ", { ipa: "vwazin" }, "."]
          - type: "note"
            level: "A1"
            text:
