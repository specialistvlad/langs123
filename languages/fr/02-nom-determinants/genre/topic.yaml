    fr: ["Tout nom est masculin ou féminin : on apprend chaque nom avec son article, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    en: ["Every noun is masculine or feminine: learn each noun with its article, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    uk: ["Кожен іменник чоловічого або жіночого роду: його вивчають разом з артиклем, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    es: ["Todo sustantivo es masculino o femenino: cada uno se aprende con su artículo, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    pt: ["Todo substantivo é masculino ou feminino: cada um se aprende com o seu artigo, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    de: ["Jedes Nomen ist männlich oder weiblich: Man lernt es mit seinem Artikel, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    it: ["Ogni sostantivo è maschile o femminile: si impara con il suo articolo, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    pl: ["Każdy rzeczownik jest rodzaju męskiego lub żeńskiego: uczy się go razem z przedimkiem, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    tr: ["Her isim erildir ya da dişildir: her isim artikeliyle birlikte öğrenilir, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    id: ["Setiap kata benda bergender maskulin atau feminin: pelajari bersama artikelnya, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
    vi: ["Mọi danh từ đều thuộc giống đực hoặc giống cái: hãy học danh từ cùng mạo từ của nó, ", { term: "le livre" }, ", ", { term: "la table" }, "."]
  rule:
    fr: "L’article et l’adjectif prennent le genre du nom :"
    en: "The article and the adjective take the gender of the noun:"
