    role: "pronunciation"
    content:
      - type: "paradigm"
        columns:
          - key: "masc"
            label: { fr: "Masculin", en: "Masculine", uk: "Чоловічий рід", es: "Masculino", pt: "Masculino", de: "Maskulinum", it: "Maschile", pl: "Rodzaj męski", tr: "Eril", id: "Maskulin", vi: "Giống đực" }
            features: { gender: "masc" }
