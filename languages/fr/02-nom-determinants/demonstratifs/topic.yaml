sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Le démonstratif prend la place de l’article : un seul mot devant le nom."
              en: "The demonstrative takes the place of the article: one word before the noun."
              uk: "Вказівне слово займає місце артикля: перед іменником стоїть лише одне слово."
              es: "El demostrativo ocupa el lugar del artículo: una sola palabra ante el nombre."
              pt: "O demonstrativo ocupa o lugar do artigo: uma só palavra antes do substantivo."
              de: "Das Demonstrativum steht anstelle des Artikels: nur ein Wort vor dem Nomen."
              it: "Il dimostrativo prende il posto dell'articolo: una sola parola davanti al nome."
              pl: "Zaimek wskazujący zajmuje miejsce przedimka: przed rzeczownikiem stoi tylko jedno słowo."
              tr: "İşaret sözcüğü artikelin yerini alır: ismin önünde tek bir sözcük durur."
              id: "Kata tunjuk menggantikan artikel: hanya satu kata di depan kata benda."
              vi: "Từ chỉ định thay chỗ của mạo từ: chỉ có một từ đứng trước danh từ."
            ex: { examples: [[{ target: "Ce" }, " chat dort."], [{ target: "Ces" }, " chats dorment."]] }
            tr: { en: { examples: ["This cat is asleep.", "These cats are asleep."] }, uk: { examples: ["Цей кіт спить.", "Ці коти сплять."] }, es: { examples: ["Este gato duerme.", "Estos gatos duermen."] }, pt: { examples: ["Este gato dorme.", "Estes gatos dormem."] }, de: { examples: ["Diese Katze schläft.", "Diese Katzen schlafen."] }, it: { examples: ["Questo gatto dorme.", "Questi gatti dormono."] }, pl: { examples: ["Ten kot śpi.", "Te koty śpią."] }, tr: { examples: ["Bu kedi uyuyor.", "Bu kediler uyuyor."] }, id: { examples: ["Kucing ini tidur.", "Kucing-kucing ini tidur."] }, vi: { examples: ["Con mèo này đang ngủ.", "Những con mèo này đang ngủ."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Un seul mot dit « ce » ou « cette » pour le proche et pour le lointain ; ", { term: "-ci" }, " et ", { term: "-là" }, " précisent la distance."]
              en: ["One word covers “this” and “that”; ", { term: "-ci" }, " and ", { term: "-là" }, " tell the distance."]
              uk: ["Одне слово означає і «цей», і «той»; відстань уточнюють ", { term: "-ci" }, " і ", { term: "-là" }, "."]
              es: ["Una sola palabra vale para «este» y «ese»; ", { term: "-ci" }, " y ", { term: "-là" }, " precisan la distancia."]
              pt: ["Uma só palavra vale para «este» e «esse»; ", { term: "-ci" }, " e ", { term: "-là" }, " precisam a distância."]
              de: ["Ein Wort steht für „dieser“ und „jener“; ", { term: "-ci" }, " und ", { term: "-là" }, " geben die Entfernung an."]
              it: ["Una sola parola vale per «questo» e «quello»; ", { term: "-ci" }, " e ", { term: "-là" }, " precisano la distanza."]
              pl: ["Jedno słowo oznacza i „ten”, i „tamten”; odległość określają ", { term: "-ci" }, " i ", { term: "-là" }, "."]
              tr: ["Tek bir sözcük hem “bu” hem “şu/o” anlamına gelir; ", { term: "-ci" }, " ve ", { term: "-là" }, " uzaklığı belirtir."]
              id: ["Satu kata berarti “ini” sekaligus “itu”; ", { term: "-ci" }, " dan ", { term: "-là" }, " menentukan jaraknya."]
              vi: ["Một từ vừa là “này” vừa là “kia”; ", { term: "-ci" }, " và ", { term: "-là" }, " chỉ rõ khoảng cách."]
            ex: { examples: [["Prends ", { target: "ce" }, " livre, ici."], ["Regarde ", { target: "ce" }, " livre, là-bas."]] }
            tr: { en: { examples: ["Take this book here.", "Look at that book over there."] }, uk: { examples: ["Візьми цю книжку тут.", "Подивись на ту книжку там."] }, es: { examples: ["Toma este libro, aquí.", "Mira ese libro, allá."] }, pt: { examples: ["Pegue este livro, aqui.", "Olhe aquele livro, lá."] }, de: { examples: ["Nimm dieses Buch hier.", "Sieh dir jenes Buch dort an."] }, it: { examples: ["Prendi questo libro, qui.", "Guarda quel libro, laggiù."] }, pl: { examples: ["Weź tę książkę, tutaj.", "Spójrz na tamtą książkę, tam."] }, tr: { examples: ["Bu kitabı al, burada.", "Şu kitaba bak, orada."] }, id: { examples: ["Ambil buku ini, di sini.", "Lihat buku itu, di sana."] }, vi: { examples: ["Cầm quyển sách này, ở đây.", "Nhìn quyển sách kia, ở đằng đó."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les articles que le démonstratif remplace, voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: ["For the articles the demonstrative replaces, see ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: ["Про артиклі, які замінює вказівне слово, — див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: ["Para los artículos que sustituye el demostrativo, ver ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: ["Para os artigos que o demonstrativo substitui, veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: ["Zu den Artikeln, die das Demonstrativum ersetzt, siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: ["Per gli articoli che il dimostrativo sostituisce, vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: ["O przedimkach, które zastępuje zaimek wskazujący — zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: ["İşaret sözcüğünün yerini aldığı artikeller için bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: ["Untuk artikel yang digantikan kata tunjuk, lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: ["Về các mạo từ mà từ chỉ định thay thế: xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
