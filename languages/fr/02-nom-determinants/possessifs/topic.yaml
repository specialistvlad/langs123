          tr: { en: "I've lost my bag.", uk: "Я загубив свою сумку.", es: "He perdido mi bolso.", pt: "Eu perdi minha bolsa.", de: "Ich habe meine Tasche verloren.", it: "Ho perso la mia borsa.", pl: "Zgubiłem swoją torbę.", tr: "Çantamı kaybettim.", id: "Aku kehilangan tasku.", vi: "Tôi làm mất túi của tôi." }
        - level: "A1"
