sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Le possessif s’accorde en genre et en nombre avec le nom possédé, jamais avec le possesseur."
              en: "The possessive agrees in gender and number with the thing owned, never with the owner."
              uk: "Присвійне слово узгоджується в роді й числі з назвою речі, ніколи з власником."
              es: "El posesivo concuerda en género y número con lo poseído, nunca con el poseedor."
              pt: "O possessivo concorda em gênero e número com o que é possuído, nunca com o possuidor."
              de: "Der Possessivbegleiter richtet sich in Genus und Numerus nach dem Besitz, nie nach dem Besitzer."
              it: "Il possessivo concorda in genere e numero con la cosa posseduta, mai con il possessore."
              pl: "Zaimek dzierżawczy zgadza się w rodzaju i liczbie z rzeczą posiadaną, nigdy z właścicielem."
              tr: "İyelik sözcüğü cinsiyet ve sayıda sahibe değil, sahip olunan şeye uyar."
              id: "Kata ganti kepemilikan menyesuaikan gender dan jumlah dengan benda yang dimiliki, tidak pernah dengan pemiliknya."
              vi: "Tính từ sở hữu hòa hợp về giống và số với vật được sở hữu, không bao giờ với người sở hữu."
            ex: { examples: [[{ target: "Mon" }, " frère."], [{ target: "Ma" }, " sœur."], [{ target: "Mes" }, " parents."]] }
            tr: { en: { examples: ["My brother.", "My sister.", "My parents."] }, uk: { examples: ["Мій брат.", "Моя сестра.", "Мої батьки."] }, es: { examples: ["Mi hermano.", "Mi hermana.", "Mis padres."] }, pt: { examples: ["Meu irmão.", "Minha irmã.", "Meus pais."] }, de: { examples: ["Mein Bruder.", "Meine Schwester.", "Meine Eltern."] }, it: { examples: ["Mio fratello.", "Mia sorella.", "I miei genitori."] }, pl: { examples: ["Mój brat.", "Moja siostra.", "Moi rodzice."] }, tr: { examples: ["Kardeşim (erkek).", "Kız kardeşim.", "Anne babam."] }, id: { examples: ["Kakak laki-lakiku.", "Adik perempuanku.", "Orang tuaku."] }, vi: { examples: ["Anh trai tôi.", "Chị gái tôi.", "Bố mẹ tôi."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "Le possessif remplace l’article : un seul mot devant le nom."
              en: "The possessive replaces the article: one word before the noun."
              uk: "Присвійне слово замінює артикль: перед іменником стоїть лише одне слово."
              es: "El posesivo sustituye al artículo: una sola palabra ante el nombre."
              pt: "O possessivo substitui o artigo: uma só palavra antes do substantivo."
              de: "Der Possessivbegleiter ersetzt den Artikel: nur ein Wort vor dem Nomen."
              it: "Il possessivo sostituisce l'articolo: una sola parola davanti al nome."
              pl: "Zaimek dzierżawczy zastępuje przedimek: przed rzeczownikiem stoi tylko jedno słowo."
              tr: "İyelik sözcüğü artikelin yerini alır: ismin önünde tek bir sözcük durur."
              id: "Kata ganti kepemilikan menggantikan artikel: hanya satu kata di depan kata benda."
              vi: "Tính từ sở hữu thay mạo từ: chỉ có một từ đứng trước danh từ."
            ex: { examples: [["J’ai perdu ", { target: "mon" }, " sac."], ["Elle aime ", { target: "sa" }, " ville."]] }
            tr: { en: { examples: ["I've lost my bag.", "She loves her city."] }, uk: { examples: ["Я загубив свою сумку.", "Вона любить своє місто."] }, es: { examples: ["He perdido mi bolso.", "Ella ama su ciudad."] }, pt: { examples: ["Eu perdi minha bolsa.", "Ela ama a cidade dela."] }, de: { examples: ["Ich habe meine Tasche verloren.", "Sie liebt ihre Stadt."] }, it: { examples: ["Ho perso la mia borsa.", "Lei ama la sua città."] }, pl: { examples: ["Zgubiłem swoją torbę.", "Ona kocha swoje miasto."] }, tr: { examples: ["Çantamı kaybettim.", "O şehrini seviyor."] }, id: { examples: ["Aku kehilangan tasku.", "Dia mencintai kotanya."] }, vi: { examples: ["Tôi làm mất túi của tôi.", "Cô ấy yêu thành phố của cô ấy."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour les articles que le possessif remplace, voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: ["For the articles the possessive replaces, see ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: ["Про артиклі, які замінює присвійне слово, — див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: ["Para los artículos que sustituye el posesivo, ver ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: ["Para os artigos que o possessivo substitui, veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: ["Zu den Artikeln, die der Possessivbegleiter ersetzt, siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: ["Per gli articoli che il possessivo sostituisce, vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: ["O przedimkach, które zastępuje zaimek dzierżawczy — zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: ["İyelik sözcüğünün yerini aldığı artikeller için bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: ["Untuk artikel yang digantikan kata ganti kepemilikan, lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: ["Về các mạo từ mà tính từ sở hữu thay thế: xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
  - title:
      fr: "Forme : les possessifs"
      en: "Form: the possessives"
      uk: "Форма: присвійні слова"
      es: "Forma: los posesivos"
      pt: "Forma: os possessivos"
      de: "Form: die Possessivbegleiter"
      it: "Forma: i possessivi"
      pl: "Forma: zaimki dzierżawcze"
      tr: "Biçim: iyelik sözcükleri"
      id: "Bentuk: kata ganti kepemilikan"
      vi: "Dạng: tính từ sở hữu"
    role: "form"
    content:
      - type: "paradigm"
        columns:
          - { key: "person", label: { fr: "Personne", en: "Person", uk: "Особа", es: "Persona", pt: "Pessoa", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - key: "masc"
            label: { fr: "masculin", en: "masculine", uk: "чоловічий рід", es: "masculino", pt: "masculino", de: "maskulin", it: "maschile", pl: "rodzaj męski", tr: "eril", id: "maskulin", vi: "giống đực" }
            features: { gender: "masc", number: "sg" }
          - key: "fem"
            label: { fr: "féminin", en: "feminine", uk: "жіночий рід", es: "femenino", pt: "feminino", de: "feminin", it: "femminile", pl: "rodzaj żeński", tr: "dişil", id: "feminin", vi: "giống cái" }
            features: { gender: "fem", number: "sg" }
          - key: "pl"
            label: { fr: "pluriel", en: "plural", uk: "множина", es: "plural", pt: "plural", de: "Plural", it: "plurale", pl: "liczba mnoga", tr: "çoğul", id: "jamak", vi: "số nhiều" }
            features: { number: "pl" }
        rows:
          - { level: "A1", features: { person: 1, number: "sg" }, person: "je", masc: { target: "mon" }, fem: { target: "ma" }, pl: { target: "mes" } }
          - { level: "A1", features: { person: 2, number: "sg", politeness: "infm" }, person: "tu", masc: { target: "ton" }, fem: { target: "ta" }, pl: { target: "tes" } }
          - { level: "A1", features: { person: 3, number: "sg" }, person: { alternatives: ["il", "elle", "on"] }, masc: { target: "son" }, fem: { target: "sa" }, pl: { target: "ses" } }
          - { level: "A1", features: { person: 1, number: "pl" }, person: "nous", masc: { target: "notre" }, fem: { target: "notre" }, pl: { target: "nos" } }
          - { level: "A1", features: [{ person: 2, number: "pl" }, { person: 2, number: "sg", politeness: "form" }], person: "vous", masc: { target: "votre" }, fem: { target: "votre" }, pl: { target: "vos" } }
          - { level: "A1", features: { person: 3, number: "pl" }, person: { alternatives: ["ils", "elles"] }, masc: { target: "leur" }, fem: { target: "leur" }, pl: { target: "leurs" } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Devant une voyelle ou un h muet, ", { term: "mon" }, ", ", { term: "ton" }, " et ", { term: "son" }, " remplacent ", { term: "ma" }, ", ", { term: "ta" }, " et ", { term: "sa" }, "."]
              en: ["Before a vowel or a mute h, ", { term: "mon" }, ", ", { term: "ton" }, " and ", { term: "son" }, " replace ", { term: "ma" }, ", ", { term: "ta" }, " and ", { term: "sa" }, "."]
