sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: ["Le partitif (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") dit une quantité qu’on ne compte pas ; ", { term: "un" }, " et ", { term: "une" }, " comptent une chose."]
              en: ["The partitive (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") names an amount that is not counted; ", { term: "un" }, " and ", { term: "une" }, " count one thing."]
              uk: ["Партитивний артикль (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") називає кількість, яку не рахують; ", { term: "un" }, " і ", { term: "une" }, " рахують один предмет."]
              es: ["El partitivo (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") nombra una cantidad que no se cuenta; ", { term: "un" }, " y ", { term: "une" }, " cuentan una cosa."]
              pt: ["O partitivo (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") nomeia uma quantidade que não se conta; ", { term: "un" }, " e ", { term: "une" }, " contam uma coisa."]
              de: ["Der Teilungsartikel (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") nennt eine Menge, die man nicht zählt; ", { term: "un" }, " und ", { term: "une" }, " zählen eine Sache."]
              it: ["Il partitivo (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") indica una quantità che non si conta; ", { term: "un" }, " e ", { term: "une" }, " contano una cosa."]
              pl: ["Przedimek częściowy (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") nazywa ilość, której się nie liczy; ", { term: "un" }, " i ", { term: "une" }, " liczą jedną rzecz."]
              tr: ["Bölme artikeli (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") sayılmayan bir miktarı gösterir; ", { term: "un" }, " ve ", { term: "une" }, " tek bir şeyi sayar."]
              id: ["Artikel partitif (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") menyebut jumlah yang tidak dihitung; ", { term: "un" }, " dan ", { term: "une" }, " menghitung satu benda."]
              vi: ["Mạo từ bộ phận (", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, ") nêu một lượng không đếm; ", { term: "un" }, " và ", { term: "une" }, " đếm một vật."]
            ex: { examples: [["Je mange ", { target: "du" }, " riz."], ["Je mange ", { target: "une" }, " pomme."]] }
            tr: { en: { examples: ["I eat rice.", "I eat an apple."] }, uk: { examples: ["Я їм рис.", "Я їм яблуко."] }, es: { examples: ["Como arroz.", "Como una manzana."] }, pt: { examples: ["Eu como arroz.", "Eu como uma maçã."] }, de: { examples: ["Ich esse Reis.", "Ich esse einen Apfel."] }, it: { examples: ["Mangio riso.", "Mangio una mela."] }, pl: { examples: ["Jem ryż.", "Jem jabłko."] }, tr: { examples: ["Pirinç yiyorum.", "Bir elma yiyorum."] }, id: { examples: ["Aku makan nasi.", "Aku makan sebuah apel."] }, vi: { examples: ["Tôi ăn cơm.", "Tôi ăn một quả táo."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: ["Après un mot de quantité ou une mesure, on met ", { term: "de" }, " (", { term: "d’" }, " devant une voyelle) et le nom reste sans article."]
              en: ["After a quantity word or a measure comes ", { term: "de" }, " (", { term: "d’" }, " before a vowel), and the noun has no article."]
              uk: ["Після слова кількості чи міри стоїть ", { term: "de" }, " (", { term: "d’" }, " перед голосною), а іменник лишається без артикля."]
              es: ["Tras una palabra de cantidad o una medida va ", { term: "de" }, " (", { term: "d’" }, " ante vocal) y el nombre queda sin artículo."]
              pt: ["Depois de uma palavra de quantidade ou de uma medida vem ", { term: "de" }, " (", { term: "d’" }, " antes de vogal) e o substantivo fica sem artigo."]
              de: ["Nach einem Mengenwort oder einer Maßangabe steht ", { term: "de" }, " (", { term: "d’" }, " vor Vokal), und das Nomen bleibt ohne Artikel."]
              it: ["Dopo una parola di quantità o una misura si mette ", { term: "de" }, " (", { term: "d’" }, " davanti a vocale) e il nome resta senza articolo."]
              pl: ["Po słowie oznaczającym ilość lub miarę stoi ", { term: "de" }, " (", { term: "d’" }, " przed samogłoską), a rzeczownik zostaje bez przedimka."]
              tr: ["Miktar sözcüğünden ya da ölçü biriminden sonra ", { term: "de" }, " gelir (ünlüden önce ", { term: "d’" }, "); isim artikelsiz kalır."]
              id: ["Setelah kata jumlah atau satuan ukuran dipakai ", { term: "de" }, " (", { term: "d’" }, " sebelum vokal), dan kata benda tidak memakai artikel."]
              vi: ["Sau từ chỉ lượng hoặc đơn vị đo là ", { term: "de" }, " (", { term: "d’" }, " trước nguyên âm), và danh từ không có mạo từ."]
            ex: { examples: [["Elle mange ", { target: "beaucoup de" }, " fruits."], ["Un litre ", { target: "d’" }, "eau."]] }
            tr: { en: { examples: ["She eats a lot of fruit.", "A litre of water."] }, uk: { examples: ["Вона їсть багато фруктів.", "Літр води."] }, es: { examples: ["Ella come muchas frutas.", "Un litro de agua."] }, pt: { examples: ["Ela come muitas frutas.", "Um litro de água."] }, de: { examples: ["Sie isst viel Obst.", "Ein Liter Wasser."] }, it: { examples: ["Lei mangia molta frutta.", "Un litro d'acqua."] }, pl: { examples: ["Ona je dużo owoców.", "Litr wody."] }, tr: { examples: ["O çok meyve yiyor.", "Bir litre su."] }, id: { examples: ["Dia makan banyak buah.", "Satu liter air."] }, vi: { examples: ["Cô ấy ăn nhiều trái cây.", "Một lít nước."] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " et ", { term: "des" }, ", voir ", { link: "Les articles", to: "fr.nom-determinants.articles" }, "."]
              en: ["For ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " and ", { term: "des" }, ", see ", { link: "Articles", to: "fr.nom-determinants.articles" }, "."]
              uk: ["Про ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " і ", { term: "des" }, " — див. ", { link: "Артиклі", to: "fr.nom-determinants.articles" }, "."]
              es: ["Para ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " y ", { term: "des" }, ", ver ", { link: "Los artículos", to: "fr.nom-determinants.articles" }, "."]
              pt: ["Para ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " e ", { term: "des" }, ", veja ", { link: "Os artigos", to: "fr.nom-determinants.articles" }, "."]
              de: ["Zu ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " und ", { term: "des" }, " siehe ", { link: "Die Artikel", to: "fr.nom-determinants.articles" }, "."]
              it: ["Per ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " e ", { term: "des" }, ", vedi ", { link: "Gli articoli", to: "fr.nom-determinants.articles" }, "."]
              pl: ["O ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " i ", { term: "des" }, " — zob. ", { link: "Przedimki", to: "fr.nom-determinants.articles" }, "."]
              tr: [{ term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " ve ", { term: "des" }, " için bkz. ", { link: "Artikeller", to: "fr.nom-determinants.articles" }, "."]
              id: ["Untuk ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, ", dan ", { term: "des" }, ", lihat ", { link: "Artikel", to: "fr.nom-determinants.articles" }, "."]
              vi: ["Về ", { term: "le" }, ", ", { term: "la" }, ", ", { term: "un" }, ", ", { term: "une" }, " và ", { term: "des" }, ": xem ", { link: "Mạo từ", to: "fr.nom-determinants.articles" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour savoir si un nom est masculin ou féminin, voir ", { link: "Le genre des noms", to: fr.nom-determinants.genre }, "."]
              en: ["To tell whether a noun is masculine or feminine, see ", { link: "Noun Gender", to: fr.nom-determinants.genre }, "."]
              uk: ["Як визначити рід іменника — див. ", { link: "Рід іменників", to: fr.nom-determinants.genre }, "."]
              es: ["Para saber si un nombre es masculino o femenino, ver ", { link: "El género de los sustantivos", to: fr.nom-determinants.genre }, "."]
              pt: ["Para saber se um substantivo é masculino ou feminino, veja ", { link: "O gênero dos substantivos", to: fr.nom-determinants.genre }, "."]
              de: ["Ob ein Nomen maskulin oder feminin ist, steht in ", { link: "Das Genus der Nomen", to: fr.nom-determinants.genre }, "."]
              it: ["Per sapere se un nome è maschile o femminile, vedi ", { link: "Il genere dei nomi", to: fr.nom-determinants.genre }, "."]
              pl: ["O tym, jak rozpoznać rodzaj rzeczownika — zob. ", { link: "Rodzaj rzeczowników", to: fr.nom-determinants.genre }, "."]
              tr: ["Bir ismin eril mi dişil mi olduğunu anlamak için bkz. ", { link: "İsimlerin cinsiyeti", to: fr.nom-determinants.genre }, "."]
              id: ["Untuk mengetahui apakah sebuah kata benda maskulin atau feminin, lihat ", { link: "Gender kata benda", to: fr.nom-determinants.genre }, "."]
              vi: ["Cách biết một danh từ là giống đực hay giống cái: xem ", { link: "Giống của danh từ", to: fr.nom-determinants.genre }, "."]
