sections:
  - title:
      fr: "Vue d’ensemble"
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              fr: "Le nom s’emploie presque toujours avec un article."
              en: "A noun almost always comes with an article."
              uk: "Іменник майже завжди вживається з артиклем."
              es: "El sustantivo casi siempre va con artículo."
              pt: "O substantivo quase sempre vem com artigo."
              de: "Das Nomen steht fast immer mit einem Artikel."
              it: "Il sostantivo si usa quasi sempre con un articolo."
              pl: "Rzeczownik prawie zawsze występuje z przedimkiem."
              tr: "İsim neredeyse her zaman bir artikelle kullanılır."
              id: "Kata benda hampir selalu dipakai dengan artikel."
              vi: "Danh từ hầu như luôn đi kèm mạo từ."
            ex: { examples: [[{ target: "Le" }, " stylo est rouge."], ["J’ai ", { target: "une" }, " gomme."]] }
            tr: { en: { examples: ["The pen is red.", "I have an eraser."] }, uk: { examples: ["Ручка червона.", "У мене є гумка."] }, es: { examples: ["El bolígrafo es rojo.", "Tengo una goma."] }, pt: { examples: ["A caneta é vermelha.", "Eu tenho uma borracha."] }, de: { examples: ["Der Stift ist rot.", "Ich habe einen Radiergummi."] }, it: { examples: ["La penna è rossa.", "Ho una gomma."] }, pl: { examples: ["Długopis jest czerwony.", "Mam gumkę."] }, tr: { examples: ["Kalem kırmızı.", "Bir silgim var."] }, id: { examples: ["Pulpennya merah.", "Aku punya penghapus."] }, vi: { examples: ["Cây bút màu đỏ.", "Tôi có một cục tẩy."] } }
          - type: "rule"
            level: "A1"
            text:
              fr: "L’article s’accorde avec le nom en genre et en nombre."
              en: "The article agrees with the noun in gender and number."
              uk: "Артикль узгоджується з іменником у роді й числі."
              es: "El artículo concuerda con el sustantivo en género y número."
              pt: "O artigo concorda com o substantivo em gênero e número."
              de: "Der Artikel richtet sich nach dem Nomen in Genus und Numerus."
              it: "L'articolo concorda con il sostantivo in genere e numero."
              pl: "Przedimek zgadza się z rzeczownikiem w rodzaju i liczbie."
              tr: "Artikel, isimle cinsiyet ve sayıda uyum sağlar."
              id: "Artikel menyesuaikan diri dengan kata benda dalam gender dan jumlah."
              vi: "Mạo từ hòa hợp với danh từ về giống và số."
            ex: { examples: [[{ target: "le" }, " livre"], [{ target: "la" }, " table"], [{ target: "les" }, " livres"]] }
            tr: { en: { examples: ["the book", "the table", "the books"] }, uk: { examples: ["книга", "стіл", "книги"] }, es: { examples: ["el libro", "la mesa", "los libros"] }, pt: { examples: ["o livro", "a mesa", "os livros"] }, de: { examples: ["das Buch", "der Tisch", "die Bücher"] }, it: { examples: ["il libro", "il tavolo", "i libri"] }, pl: { examples: ["książka", "stół", "książki"] }, tr: { examples: ["kitap", "masa", "kitaplar"] }, id: { examples: ["buku", "meja", "buku-buku"] }, vi: { examples: ["quyển sách", "cái bàn", "những quyển sách"] } }
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour le genre des noms, voir ", { link: "Le genre des noms", to: "fr.nom-determinants.genre" }, "."]
              en: ["For the gender of nouns, see ", { link: "Noun Gender", to: fr.nom-determinants.genre }, "."]
              uk: ["Про рід іменників див. ", { link: "Рід іменників", to: "fr.nom-determinants.genre" }, "."]
              es: ["Para el género de los sustantivos, ver ", { link: "El género de los sustantivos", to: "fr.nom-determinants.genre" }, "."]
              pt: ["Para o gênero dos substantivos, veja ", { link: "O gênero dos substantivos", to: "fr.nom-determinants.genre" }, "."]
              de: ["Zum Genus der Nomen siehe ", { link: "Das Genus der Nomen", to: "fr.nom-determinants.genre" }, "."]
              it: ["Per il genere dei nomi, vedi ", { link: "Il genere dei nomi", to: "fr.nom-determinants.genre" }, "."]
              pl: ["O rodzaju rzeczowników zob. ", { link: "Rodzaj rzeczowników", to: "fr.nom-determinants.genre" }, "."]
              tr: ["İsimlerin cinsiyeti için bkz. ", { link: "İsimlerin cinsiyeti", to: "fr.nom-determinants.genre" }, "."]
              id: ["Untuk gender kata benda, lihat ", { link: "Gender kata benda", to: "fr.nom-determinants.genre" }, "."]
              vi: ["Về giống của danh từ, xem ", { link: "Giống của danh từ", to: "fr.nom-determinants.genre" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: ["Pour le pluriel des noms, voir ", { link: "Le pluriel des noms", to: "fr.nom-determinants.pluriel" }, "."]
              en: ["For the plural of nouns, see ", { link: "Plurals", to: fr.nom-determinants.pluriel }, "."]
              uk: ["Про множину іменників див. ", { link: "Множина іменників", to: "fr.nom-determinants.pluriel" }, "."]
              es: ["Para el plural de los sustantivos, ver ", { link: "El plural de los sustantivos", to: "fr.nom-determinants.pluriel" }, "."]
              pt: ["Para o plural dos substantivos, veja ", { link: "O plural dos substantivos", to: "fr.nom-determinants.pluriel" }, "."]
              de: ["Zum Plural der Nomen siehe ", { link: "Der Plural der Nomen", to: "fr.nom-determinants.pluriel" }, "."]
              it: ["Per il plurale dei nomi, vedi ", { link: "Il plurale dei nomi", to: "fr.nom-determinants.pluriel" }, "."]
              pl: ["O liczbie mnogiej rzeczowników zob. ", { link: "Liczba mnoga rzeczowników", to: "fr.nom-determinants.pluriel" }, "."]
              tr: ["İsimlerin çoğulu için bkz. ", { link: "İsimlerin çoğulu", to: "fr.nom-determinants.pluriel" }, "."]
              id: ["Untuk bentuk jamak kata benda, lihat ", { link: "Bentuk jamak kata benda", to: "fr.nom-determinants.pluriel" }, "."]
              vi: ["Về số nhiều của danh từ, xem ", { link: "Số nhiều của danh từ", to: "fr.nom-determinants.pluriel" }, "."]
          - type: "note"
            level: "A1"
            text:
              fr: [{ term: "du" }, ", ", { term: "de la" }, " et ", { term: "de l’" }, " pour une quantité, et ", { term: "pas de" }, " : voir ", { link: "Les partitifs et les quantités", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              en: [{ term: "du" }, ", ", { term: "de la" }, " and ", { term: "de l’" }, " for an amount, and ", { term: "pas de" }, ": see ", { link: "Partitives and Quantities", to: fr.nom-determinants.partitifs-quantites }, "."]
              uk: [{ term: "du" }, ", ", { term: "de la" }, " і ", { term: "de l’" }, " для кількості та ", { term: "pas de" }, ": див. ", { link: "Партитивні артиклі й кількість", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              es: [{ term: "du" }, ", ", { term: "de la" }, " y ", { term: "de l’" }, " para una cantidad, y ", { term: "pas de" }, ": ver ", { link: "Partitivos y cantidades", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              pt: [{ term: "du" }, ", ", { term: "de la" }, " e ", { term: "de l’" }, " para uma quantidade, e ", { term: "pas de" }, ": veja ", { link: "Partitivos e quantidades", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              de: [{ term: "du" }, ", ", { term: "de la" }, " und ", { term: "de l’" }, " für eine Menge sowie ", { term: "pas de" }, ": siehe ", { link: "Teilungsartikel und Mengen", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              it: [{ term: "du" }, ", ", { term: "de la" }, " e ", { term: "de l’" }, " per una quantità, e ", { term: "pas de" }, ": vedi ", { link: "Partitivi e quantità", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              pl: [{ term: "du" }, ", ", { term: "de la" }, " i ", { term: "de l’" }, " dla ilości oraz ", { term: "pas de" }, ": zob. ", { link: "Partytywy i ilości", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              tr: ["Miktar için ", { term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " ve ", { term: "pas de" }, ": bkz. ", { link: "Bölme artikelleri ve miktarlar", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              id: [{ term: "du" }, ", ", { term: "de la" }, ", dan ", { term: "de l’" }, " untuk jumlah, serta ", { term: "pas de" }, ": lihat ", { link: "Partitif dan jumlah", to: "fr.nom-determinants.partitifs-quantites" }, "."]
              vi: [{ term: "du" }, ", ", { term: "de la" }, ", ", { term: "de l’" }, " chỉ lượng và ", { term: "pas de" }, ": xem ", { link: "Mạo từ bộ phận và lượng từ", to: "fr.nom-determinants.partitifs-quantites" }, "."]
