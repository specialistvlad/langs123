# yaml-language-server: $schema=schema/interface.schema.json
# The wording every app built on the library shares, in each explanation language: the web app reads it,
# and the export carries it whole as `interface` in library.json (CONVENTIONS.md §2).
# Placeholders take values from the app: {name}, {n}, {total}; {name:lower} lowercases the value.

