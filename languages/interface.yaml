    fr: "Les cours sont expliqués dans la première langue de votre liste. Si un cours ne la propose pas, la suivante est utilisée."
    de: "Kurse werden in der ersten Sprache deiner Liste erklärt. Hat ein Kurs sie nicht, wird die nächste verwendet."
    it: "I corsi sono spiegati nella prima lingua del tuo elenco. Se un corso non ce l’ha, si usa la successiva."
    pl: "Kursy są wyjaśniane w pierwszym języku z twojej listy. Jeśli kursu nie ma w tym języku, używany jest następny."
