  trackIntro:
    en: Topics by category. Choose your level to hide what comes later.
    uk: "Теми за категоріями. Оберіть свій рівень, щоб приховати те, що йде далі."
    es: "Temas por categoría. Elige tu nivel para ocultar lo que viene después."
    pt: "Tópicos por categoria. Escolha seu nível para ocultar o que vem depois."
    fr: "Thèmes par catégorie. Choisissez votre niveau pour masquer la suite."
    de: "Themen nach Kategorien. Wähle dein Niveau, um Späteres auszublenden."
    it: "Argomenti per categoria. Scegli il tuo livello per nascondere ciò che viene dopo."
    pl: "Tematy według kategorii. Wybierz swój poziom, aby ukryć to, co pojawia się później."
    tr: "Konular kategorilere göre. Sonra gelenleri gizlemek için seviyenizi seçin."
    id: "Topik menurut kategori. Pilih tingkat untuk menyembunyikan materi yang datang sesudahnya."
    vi: "Các chủ đề theo chuyên mục. Chọn trình độ để ẩn những nội dung ở trình độ cao hơn."
    ja: "カテゴリー別のトピックです。レベルを選ぶと、その先の内容が非表示になります。"
  pathIntro:
    en: Topics in study order, level by level; a topic comes back at each level where it grows. Choose your level to hide what comes later.
    uk: "Теми в порядку вивчення, рівень за рівнем; тема повертається на кожному рівні, де вона розширюється. Оберіть свій рівень, щоб приховати те, що йде далі."
    es: "Temas en orden de estudio, nivel por nivel; un tema vuelve en cada nivel en el que se amplía. Elige tu nivel para ocultar lo que viene después."
    pt: "Tópicos em ordem de estudo, nível por nível; um tópico volta em cada nível em que se amplia. Escolha seu nível para ocultar o que vem depois."
    fr: "Thèmes dans l’ordre d’étude, niveau par niveau ; un thème revient à chaque niveau où il s’enrichit. Choisissez votre niveau pour masquer la suite."
    de: "Themen in der Reihenfolge des Lernens, Niveau für Niveau; ein Thema kehrt auf jedem Niveau wieder, auf dem es sich erweitert. Wähle dein Niveau, um Späteres auszublenden."
    it: "Argomenti in ordine di studio, livello per livello; un argomento ritorna a ogni livello in cui si amplia. Scegli il tuo livello per nascondere ciò che viene dopo."
    pl: "Tematy w kolejności nauki, poziom po poziomie; temat wraca na każdym poziomie, na którym się rozszerza. Wybierz swój poziom, aby ukryć to, co pojawia się później."
    tr: "Konular öğrenme sırasına göre, seviye seviye; bir konu genişlediği her seviyede yeniden gelir. Sonra gelenleri gizlemek için seviyenizi seçin."
    id: "Topik dalam urutan belajar, tingkat demi tingkat; sebuah topik muncul kembali di setiap tingkat tempat topik itu berkembang. Pilih tingkat untuk menyembunyikan materi yang datang sesudahnya."
    vi: "Các chủ đề theo thứ tự học, từng trình độ một; một chủ đề quay lại ở mỗi trình độ mà nó được mở rộng. Chọn trình độ để ẩn những nội dung ở trình độ cao hơn."
    ja: "学習順に並べたトピックです。レベルごとに、内容が広がるたびに同じトピックが再び登場します。レベルを選ぶと、その先の内容が非表示になります。"

