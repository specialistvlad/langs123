# yaml-language-server: $schema=schema/interface.schema.json
# Interface wording every app shares, in each explanation language.
# Placeholders take values from the app: {name}, {n}, {total}; {name:lower} lowercases the value.

text:
  # Home
  homeTitle:
    en: "{site} — {languages}, {from} to {to}"
    uk: "{site} — {languages}, від {from} до {to}"
    es: "{site} — {languages}, de {from} a {to}"
  homeDescription:
    en: "Reference guides and cheatsheets for learners of {languages} from {from} to {to}, explained {explain}."
    uk: "Довідник і шпаргалки з мов: {languages:lower}, від {from} до {to}; мови пояснень: {explain}."
    es: "Guías de referencia y guías rápidas para estudiantes de {languages:lower} de {from} a {to}, explicadas {explain}."
  tagline:
    en: "{languages}, {from}–{to}, explained {explain}."
    uk: "{languages}, {from}–{to}; мови пояснень: {explain}."
    es: "{languages}, {from}–{to}, explicado {explain}."
  explainedIn:
    en: "in {name}"
    uk: "{name:lower}"
    es: "en {name:lower}"
  written:
    en: "{n} of {total} topics written"
    uk: "{n} з {total} тем написано"
    es: "{n} de {total} temas escritos"

  # A track: one language being learned, explained in one language
  track:
    en: "Learn {name}"
    uk: "{name} мова"
    es: "Aprende {name:lower}"
  explained:
    en: "explained in {name}"
    uk: "пояснення українською"
    es: "explicado en español"
  index:
    en: Index
    uk: "Зміст"
    es: "Índice"
  chooseLanguage:
    en: Choose language
    uk: "Оберіть мову"
    es: "Elige el idioma"
  trackIntro:
    en: Topics by category. Choose your level to hide what comes later.
    uk: "Теми за категоріями. Оберіть свій рівень, щоб приховати те, що йде далі."
    es: "Temas por categoría. Elige tu nivel para ocultar lo que viene después."
  pathIntro:
    en: Topics in study order, level by level; a topic comes back at each level where it grows. Choose your level to hide what comes later.
    uk: "Теми в порядку вивчення, рівень за рівнем; тема повертається на кожному рівні, де вона розширюється. Оберіть свій рівень, щоб приховати те, що йде далі."
    es: "Temas en orden de estudio, nivel por nivel; un tema vuelve en cada nivel en el que se amplía. Elige tu nivel para ocultar lo que viene después."

  # Controls
  grouping:
    en: Grouping
    uk: "Групування"
    es: "Agrupar"
  byLevel:
    en: By level
    uk: "За рівнем"
    es: "Por nivel"
  categories:
    en: Categories
    uk: "Категорії"
    es: "Categorías"
  read:
    en: Read in
    uk: "Мова"
    es: "Leer en"
  level:
    en: Level
    uk: "Рівень"
    es: "Nivel"
  view:
    en: View
    uk: "Вигляд"
    es: "Vista"
  extended:
    en: Extended
    uk: "Розгорнуто"
    es: "Completa"
  upTo:
    en: Up to
    uk: "До"
    es: "Hasta"

  # A topic
  onThisPage:
    en: On this page
    uk: "На цій сторінці"
    es: "En esta página"
  filterEmpty:
    en: "No information at the current level. This view starts at {level}: choose {level} or a higher level."
    uk: "На поточному рівні тут нічого немає. Цей вигляд починається з рівня {level}: оберіть {level} або вищий рівень."
    es: "No hay información en el nivel actual. Esta vista empieza en {level}: elige {level} o un nivel superior."
  showLevel:
    en: "Show {level}"
    uk: "Показати {level}"
    es: "Mostrar {level}"
  upNext:
    en: Up next
    uk: "Що далі"
    es: "A continuación"
  previous:
    en: Previous
    uk: "Попередня"
    es: "Anterior"
  next:
    en: Next
    uk: "Наступна"
    es: "Siguiente"
  startOver:
    en: Start over
    uk: "Почати спочатку"
    es: "Empezar de nuevo"
  ruleColumn:
    en: Rule
    uk: "Правило"
    es: "Regla"

  # Topic content: names the renderer writes from the data (CONVENTIONS.md §12)
  varietyUs:
    en: US
    uk: "амер."
    es: "EE. UU."
  varietyGb:
    en: British
    uk: "брит."
    es: "Reino Unido"
  slotAux:
    en: Helper
    uk: "Доп."
    es: "Aux."
  slotSubj:
    en: Subject
    uk: "Підмет"
    es: "Sujeto"
  slotVerb:
    en: Verb
    uk: "Дієслово"
    es: "Verbo"
  slotRest:
    en: Rest
    uk: "Решта"
    es: "Resto"
  groupQuestion:
    en: Question
    uk: "Питання"
    es: "Pregunta"
  groupStatement:
    en: Statement
    uk: "Ствердження"
    es: "Afirmación"
  groupNegative:
    en: Negative
    uk: "Заперечення"
    es: "Negación"

  # Cheatsheets
  sheets:
    en: Cheatsheets
    uk: "Шпаргалки"
    es: "Guías rápidas"
  sheet:
    en: Cheatsheet
    uk: "Шпаргалка"
    es: "Guía rápida"
  sheetsIntro:
    en: A level sheet holds the cheatsheets of that level's topics; a progressive sheet holds every topic up to its level.
    uk: "Шпаргалка рівня містить шпаргалки тем цього рівня; накопичувальна шпаргалка містить усі теми до її рівня включно."
    es: "Una guía de nivel reúne las guías rápidas de los temas de ese nivel; una guía progresiva reúne todos los temas hasta su nivel."
  levels:
    en: Levels
    uk: "Рівні"
    es: "Niveles"
  progressive:
    en: Progressive
    uk: "Накопичувальні"
    es: "Progresivas"
  sections:
    en: Sections
    uk: "Розділи"
    es: "Secciones"
  topics:
    en: Topics
    uk: "Теми"
    es: "Temas"

  # Missing page
  notFound:
    en: Page not found
    uk: "Сторінку не знайдено"
    es: "Página no encontrada"
  backHome:
    en: Go to the home page
    uk: "На головну сторінку"
    es: "Ir a la página de inicio"

  # Credits: one page, linked from every page's top bar
  credits:
    en: Credits
    uk: "Автори"
    es: "Créditos"
  creditsDescription:
    en: "Who writes {site}, the licences of its content and code, and how to credit it."
    uk: "Хто пише {site}, ліцензії його вмісту й коду та як зазначати авторство."
    es: "Quién escribe {site}, las licencias de su contenido y su código, y cómo citarlo."
  creditsAuthors:
    en: "The content of {site} is written by {credit}."
    uk: "Вміст {site} пишуть автори спільноти: {credit}."
    es: "El contenido de {site} lo escriben sus colaboradores: {credit}."
  licences:
    en: Licences
    uk: "Ліцензії"
    es: "Licencias"
  contentLicence:
    en: "The content (topics, cheatsheets, curriculum and wording)"
    uk: "Вміст (теми, шпаргалки, навчальний план і тексти)"
    es: "El contenido (temas, guías rápidas, plan de estudios y textos)"
  codeLicence:
    en: The code
    uk: "Код"
    es: "El código"
  howToCredit:
    en: How to credit
    uk: "Як зазначати авторство"
    es: "Cómo citar"
  creditIntro:
    en: "Anyone may copy, adapt and sell the content, in print, on the web and in apps, with this credit:"
    uk: "Будь-хто може копіювати, адаптувати й продавати вміст — у друці, в інтернеті та в застосунках — із таким зазначенням авторства:"
    es: "Cualquiera puede copiar, adaptar y vender el contenido, en papel, en la web y en aplicaciones, con este crédito:"
  creditChanges:
    en: "A changed version names its changes, for example “adapted from {site}”."
    uk: "Змінена версія називає свої зміни, наприклад «адаптовано з {site}»."
    es: "Una versión modificada indica sus cambios, por ejemplo «adaptado de {site}»."
  contribute:
    en: Contribute
    uk: "Долучитися"
    es: "Colaborar"
  sourceLink:
    en: The content and code on GitHub
    uk: "Вміст і код на GitHub"
    es: "El contenido y el código en GitHub"
  reportMistake:
    en: Report a mistake
    uk: "Повідомити про помилку"
    es: "Informar de un error"
  contributing:
    en: How to contribute
    uk: "Як долучитися"
    es: "Cómo colaborar"
  nameNote:
    en: "The name {site} and its logo stay with the project, outside both licences."
    uk: "Назва {site} і її логотип належать проєкту й не підпадають під жодну з ліцензій."
    es: "El nombre {site} y su logotipo pertenecen al proyecto y quedan fuera de ambas licencias."

# The name of each slot code a pattern names (CONVENTIONS.md §12). V, V-s, V-ing, V-ed and -ing render as written.
slots:
  subject: { en: subject, uk: підмет, es: sujeto }
  verb: { en: verb, uk: дієслово, es: verbo }
  base verb: { en: base verb, uk: початкова форма, es: forma base }
  noun: { en: noun, uk: іменник, es: sustantivo }
  plural noun: { en: plural noun, uk: іменник у множині, es: sustantivo en plural }
  singular noun: { en: singular noun, uk: іменник в однині, es: sustantivo en singular }
  uncountable noun: { en: uncountable noun, uk: незлічуваний іменник, es: sustantivo incontable }
  adjective: { en: adjective, uk: прикметник, es: adjetivo }
  adverb: { en: adverb, uk: прислівник, es: adverbio }
  comparative: { en: comparative, uk: вищий ступінь, es: comparativo }
  superlative: { en: superlative, uk: найвищий ступінь, es: superlativo }
  wh-word: { en: wh-word, uk: питальне слово, es: palabra interrogativa }
  person: { en: person, uk: когось, es: alguien }
  clause: { en: clause, uk: речення, es: oración }
  past participle: { en: past participle, uk: 3-тя форма дієслова, es: participio pasado }
  infinitive: { en: infinitive, uk: інфінітив, es: infinitivo }
  present: { en: present, uk: теперішній час, es: presente }
  past: { en: past, uk: минулий час, es: pasado }
  past simple: { en: past simple, uk: Past Simple, es: pasado simple }
  number: { en: number, uk: число, es: número }
  unit: { en: unit, uk: одиниця, es: unidad }
  hyphen: { en: hyphen, uk: дефіс, es: guion }
  result: { en: result, uk: результат, es: resultado }
  agent: { en: agent, uk: виконавець дії, es: agente }
  helper: { en: helper, uk: допоміжне дієслово, es: auxiliar }
  consonant: { en: consonant, uk: приголосний, es: consonante }
  vowel: { en: vowel, uk: голосний, es: vocal }
  the time: { en: the time, uk: година, es: la hora }
  day: { en: day, uk: день, es: día }
  date: { en: date, uk: дата, es: fecha }
  month: { en: month, uk: місяць, es: mes }
  year: { en: year, uk: рік, es: año }
