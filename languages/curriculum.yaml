  - code: es
    enabled: true
    slug: spanish
    name: { en: Spanish, uk: Іспанська, es: Español, pt: "Espanhol", fr: "Espagnol", de: "Spanisch", it: "Spagnolo", pl: "Hiszpański", tr: "İspanyolca", id: "Bahasa Spanyol", vi: "Tiếng Tây Ban Nha" }
    # Written for English and Spanish readers. Latin American Spanish is the default variety; a reader
    # switches to Spain, and an element tagged es-ES or es-419 shows only in its variety.
    explain: [en, es]
    varieties: [es-419, es-ES]
    sections:
      - dir: 01-fundamentos
        title: { en: "Foundations", es: "Fundamentos" }
        topics:
          - { slug: alfabeto-ortografia, title: { en: "The Alphabet and Spelling", es: "El alfabeto y la ortografía" } }
