# yaml-language-server: $schema=schema/curriculum.schema.json
# Every planned topic of every language being learned: sections group the topics by category,
# and the path orders them for study, level by level.

languages:
  - code: en
    enabled: true
    slug: english
    flag: 🇬🇧
    name: { en: English, uk: Англійська, es: Inglés, pt: "Inglês", fr: "Anglais", de: "Englisch", it: "Inglese", pl: "Angielski", tr: "İngilizce", id: "Bahasa Inggris", vi: "Tiếng Anh" }
