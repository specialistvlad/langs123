              pt: ["Mais sobre as duas: ", { link: "Perguntas e negação", to: es.oracion.preguntas-negacion }, "."]
              fr: ["Plus sur les deux : ", { link: "Questions et négation", to: es.oracion.preguntas-negacion }, "."]
              de: ["Mehr zu beidem: ", { link: "Fragen und Verneinung", to: es.oracion.preguntas-negacion }, "."]
              it: ["Di più su entrambe: ", { link: "Domande e negazione", to: es.oracion.preguntas-negacion }, "."]
              pl: ["Więcej o obu: ", { link: "Pytania i przeczenie", to: es.oracion.preguntas-negacion }, "."]
              tr: ["İkisi hakkında daha fazlası: ", { link: "Sorular ve olumsuzluk", to: es.oracion.preguntas-negacion }, "."]
              id: ["Selengkapnya tentang keduanya: ", { link: "Pertanyaan dan negasi", to: es.oracion.preguntas-negacion }, "."]
