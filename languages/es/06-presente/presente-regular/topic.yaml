title: { en: "Present Tense: Regular Verbs", es: "El presente: verbos regulares", uk: "Теперішній час: правильні дієслова", pt: "O presente: verbos regulares", fr: "Le présent : verbes réguliers", de: "Das Präsens: regelmäßige Verben", it: "Il presente: verbi regolari", pl: "Czas teraźniejszy: czasowniki regularne", tr: "Şimdiki zaman: düzenli fiiller", id: "Presente: kata kerja beraturan", vi: "Thì hiện tại: động từ có quy tắc" }
summary:
  lead:
    en: ["Regular verbs in ", { term: "-ar" }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " drop the infinitive ending and add one ending per person: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    es: ["Los verbos regulares en ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " cambian la terminación del infinitivo por una para cada persona: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    uk: ["Правильні дієслова на ", { term: "-ar" }, ", ", { term: "-er" }, " та ", { term: "-ir" }, " відкидають закінчення інфінітива й додають закінчення для кожної особи: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    pt: ["Os verbos regulares em ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " trocam a terminação do infinitivo por uma terminação para cada pessoa: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    fr: ["Les verbes réguliers en ", { term: "-ar" }, ", ", { term: "-er" }, " et ", { term: "-ir" }, " remplacent la terminaison de l’infinitif par une terminaison pour chaque personne : ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    de: ["Regelmäßige Verben auf ", { term: "-ar" }, ", ", { term: "-er" }, " und ", { term: "-ir" }, " ersetzen die Infinitivendung durch eine eigene Endung für jede Person: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    it: ["I verbi regolari in ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " sostituiscono la desinenza dell'infinito con una desinenza per ogni persona: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    pl: ["Czasowniki regularne na ", { term: "-ar" }, ", ", { term: "-er" }, " i ", { term: "-ir" }, " zamieniają końcówkę bezokolicznika na osobną końcówkę dla każdej osoby: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    tr: ["Mastarı ", { term: "-ar" }, ", ", { term: "-er" }, " veya ", { term: "-ir" }, " ile biten düzenli fiiller mastar ekini atar ve her kişi için ayrı bir ek alır: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    id: ["Kata kerja beraturan berakhiran ", { term: "-ar" }, ", ", { term: "-er" }, " dan ", { term: "-ir" }, " membuang akhiran infinitif dan menambahkan satu akhiran untuk setiap persona: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    vi: ["Động từ có quy tắc tận cùng bằng ", { term: "-ar" }, ", ", { term: "-er" }, " và ", { term: "-ir" }, " bỏ đuôi nguyên mẫu và thêm một đuôi riêng cho mỗi ngôi: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
  rule:
    en: "Each person has its own ending, so the subject pronoun usually drops:"
    es: "Cada persona tiene su propia terminación, por eso el pronombre sujeto suele omitirse:"
    uk: "Кожна особа має своє закінчення, тому особовий займенник у ролі підмета зазвичай опускають:"
    pt: "Cada pessoa tem a sua própria terminação, por isso o pronome sujeito costuma ser omitido:"
    fr: "Chaque personne a sa propre terminaison ; le pronom sujet s’omet donc le plus souvent :"
    de: "Jede Person hat ihre eigene Endung, deshalb entfällt das Subjektpronomen meist:"
    it: "Ogni persona ha la sua desinenza, perciò il pronome soggetto di solito si omette:"
    pl: "Każda osoba ma własną końcówkę, więc zaimek osobowy w roli podmiotu zwykle się pomija:"
    tr: "Her kişinin kendi eki vardır; bu yüzden özne zamiri çoğunlukla söylenmez:"
    id: "Setiap persona punya akhirannya sendiri, jadi kata ganti subjek biasanya dihilangkan:"
    vi: "Mỗi ngôi có đuôi riêng, nên đại từ chủ ngữ thường được lược bỏ:"
  ex: { examples: [[{ target: Hablo }, " español."], ["¿", { target: Vives }, " en Lima?"]] }

