              uk: "В однині та з ellos наголос падає на основу:"
              pt: "A sílaba tônica cai no radical no singular e com ellos:"
              fr: "L’accent tonique tombe sur le radical au singulier et avec ellos :"
              de: "Im Singular und bei ellos liegt die Betonung auf dem Stamm:"
              it: "L'accento cade sulla radice al singolare e con ellos:"
              pl: "W liczbie pojedynczej i przy ellos akcent pada na temat:"
              tr: "Tekilde ve ellos ile vurgu kökün üzerine düşer:"
              id: "Pada bentuk tunggal dan pada ellos, tekanan jatuh pada akar kata:"
              vi: "Ở số ít và với ellos, trọng âm rơi vào gốc động từ:"
