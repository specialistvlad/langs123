          - { level: A1, form: { pattern: [{ slot: wh-word }, { slot: verb }] }, ex: ["¿Dónde ", { target: trabajas }, "?"], tr: { en: Where do you work?, uk: "Де ти працюєш?", pt: "Onde você trabalha?", fr: "Où travailles-tu ?", de: "Wo arbeitest du?", it: "Dove lavori?", pl: "Gdzie pracujesz?", tr: "Nerede çalışıyorsun?", id: "Kamu bekerja di mana?", vi: "Bạn làm việc ở đâu?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A question keeps the words of the statement; ¿ and ? frame it, and the voice rises at the end."
              es: "Una pregunta mantiene las palabras de la afirmación; ¿ y ? la enmarcan, y la voz sube al final."
              uk: "Питання зберігає слова стверджувального речення; його обрамлюють ¿ і ?, а наприкінці голос підвищується."
              pt: "Uma pergunta mantém as palavras da afirmação; ¿ e ? a enquadram, e a voz sobe no final."
              fr: "Une question garde les mots de l’affirmation ; ¿ et ? l’encadrent, et la voix monte à la fin."
              de: "Eine Frage behält die Wörter der Aussage; ¿ und ? rahmen sie ein, und die Stimme steigt am Ende."
              it: "Una domanda mantiene le parole dell'affermazione; ¿ e ? la racchiudono, e la voce sale alla fine."
              pl: "Pytanie zachowuje słowa zdania twierdzącego; obejmują je znaki ¿ i ?, a na końcu głos się podnosi."
              tr: "Soru, olumlu cümlenin sözcüklerini korur; ¿ ve ? onu çevreler ve ses sonda yükselir."
              id: "Pertanyaan mempertahankan kata-kata kalimat pernyataan; ¿ dan ? mengapitnya, dan nada naik di akhir."
              vi: "Câu hỏi giữ nguyên các từ của câu khẳng định; ¿ và ? đặt ở hai đầu, và giọng lên cao ở cuối câu."
