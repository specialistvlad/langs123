          - { level: A1, use: { en: Facts and states, es: Hechos y estados, uk: Факти та стани, pt: "Fatos e estados", fr: "Faits et états", de: "Tatsachen und Zustände", it: "Fatti e stati", pl: "Fakty i stany", tr: "Gerçekler ve durumlar", id: "Fakta dan keadaan", vi: "Sự thật và trạng thái" }, ex: ["Mi hermana ", { target: vive }, " en Bogotá."], tr: { en: My sister lives in Bogotá., uk: "Моя сестра живе в Боготі.", pt: "Minha irmã mora em Bogotá.", fr: "Ma sœur habite à Bogotá.", de: "Meine Schwester wohnt in Bogotá.", it: "Mia sorella abita a Bogotá.", pl: "Moja siostra mieszka w Bogocie.", tr: "Kız kardeşim Bogotá'da yaşıyor.", id: "Saudara perempuan saya tinggal di Bogotá.", vi: "Chị gái tôi sống ở Bogotá." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The present also names an action in progress, where English uses -ing:"
              es: "El presente también expresa una acción en curso:"
              uk: "Теперішній час також позначає дію, що триває зараз, — як і в українській:"
              pt: "O presente também expressa uma ação em andamento:"
              fr: "Le présent exprime aussi une action en cours :"
              de: "Das Präsens drückt auch eine laufende Handlung aus:"
              it: "Il presente esprime anche un'azione in corso:"
              pl: "Czas teraźniejszy oznacza też czynność, która właśnie trwa:"
              tr: "Şimdiki zaman, sürmekte olan bir eylemi de anlatır:"
              id: "Presente juga menyatakan tindakan yang sedang berlangsung:"
              vi: "Thì hiện tại cũng diễn tả một hành động đang diễn ra:"
            ex: { exchange: [["¿Qué ", { target: lees }, "?"], [{ target: Leo }, " una novela."]] }
            tr: { en: { exchange: [What are you reading?, "I'm reading a novel."] }, uk: { exchange: ["Що ти читаєш?", "Читаю роман."] }, pt: { exchange: ["O que você está lendo?", "Estou lendo um romance."] }, fr: { exchange: ["Qu’est-ce que tu lis ?", "Je lis un roman."] }, de: { exchange: ["Was liest du gerade?", "Ich lese einen Roman."] }, it: { exchange: ["Che cosa stai leggendo?", "Sto leggendo un romanzo."] }, pl: { exchange: ["Co czytasz?", "Czytam powieść."] }, tr: { exchange: ["Ne okuyorsun?", "Bir roman okuyorum."] }, id: { exchange: ["Kamu sedang membaca apa?", "Saya sedang membaca novel."] }, vi: { exchange: ["Bạn đang đọc gì vậy?", "Tôi đang đọc một cuốn tiểu thuyết."] } }

  - title: { es: "Valores del presente: orden y relato", en: "Uses of the present: orders and narration", uk: "Вживання теперішнього часу: наказ і розповідь", pt: "Valores do presente: ordem e relato", fr: "Valeurs du présent : ordre et récit", de: "Verwendungen des Präsens: Anweisung und Erzählung", it: "Valori del presente: ordine e racconto", pl: "Zastosowania czasu teraźniejszego: polecenie i opowieść", tr: "Şimdiki zamanın kullanımları: emir ve anlatı", id: "Penggunaan presente: perintah dan penceritaan", vi: "Các cách dùng của thì hiện tại: mệnh lệnh và kể chuyện" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Valor, en: "Use", uk: "Вживання", pt: "Valor", fr: "Valeur", de: "Verwendung", it: "Valore", pl: "Zastosowanie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "Instrucción: los pasos de un camino o de un proceso", en: "Instruction: the steps of a route or a process", uk: "Інструкція: кроки маршруту чи процесу", pt: "Instrução: os passos de um caminho ou de um processo", fr: "Instruction : les étapes d’un itinéraire ou d’un processus", de: "Anweisung: die Schritte eines Wegs oder eines Vorgangs", it: "Istruzione: i passaggi di un percorso o di un processo", pl: "Instrukcja: kroki trasy lub procesu", tr: "Talimat: bir yolun ya da bir sürecin adımları", id: "Instruksi: langkah-langkah suatu rute atau proses", vi: "Chỉ dẫn: các bước của một lộ trình hoặc một quy trình" }
            ex: { examples: [[{ target: Giras }, " a la derecha y ", { target: ves }, " la farmacia."], ["Primero ", { target: abres }, " el archivo y después ", { target: pulsas }, " «Guardar»."]] }
            tr: { en: { examples: ["You turn right and you see the pharmacy.", "First you open the file, then you click “Save”."] }, uk: { examples: ["Повертаєш праворуч — і бачиш аптеку.", "Спочатку відкриваєш файл, а потім натискаєш «Зберегти»."] }, pt: { examples: ["Você vira à direita e vê a farmácia.", "Primeiro você abre o arquivo e depois clica em “Salvar”."] }, fr: { examples: ["Tu tournes à droite et tu vois la pharmacie.", "D’abord, tu ouvres le fichier, puis tu cliques sur « Enregistrer »."] }, de: { examples: ["Du biegst rechts ab und siehst die Apotheke.", "Zuerst öffnest du die Datei, dann klickst du auf „Speichern“."] }, it: { examples: ["Giri a destra e vedi la farmacia.", "Prima apri il file e poi clicchi su «Salva»."] }, pl: { examples: ["Skręcasz w prawo i widzisz aptekę.", "Najpierw otwierasz plik, a potem klikasz „Zapisz”."] }, tr: { examples: ["Sağa dönersin ve eczaneyi görürsün.", "Önce dosyayı açarsın, sonra “Kaydet”e tıklarsın."] }, id: { examples: ["Kamu berbelok ke kanan dan melihat apotek.", "Pertama kamu membuka berkas, lalu menekan “Simpan”."] }, vi: { examples: ["Bạn rẽ phải và thấy hiệu thuốc.", "Trước tiên bạn mở tệp, sau đó nhấn “Lưu”."] } }
          - level: B2
            use: { es: "Anécdota: un hecho pasado reciente, contado como actual", en: "Anecdote: a recent past event, told as if it were happening now", uk: "Розповідь: нещодавня минула подія, подана як теперішня", pt: "Anedota: um fato passado recente, contado como atual", fr: "Anecdote : un fait passé récent, raconté comme actuel", de: "Erzählung: ein kürzlich vergangenes Ereignis, als gegenwärtig erzählt", it: "Aneddoto: un fatto passato recente, raccontato come attuale", pl: "Anegdota: niedawne wydarzenie z przeszłości opowiedziane jako teraźniejsze", tr: "Anekdot: yakın geçmişteki bir olay, şimdiki zamanmış gibi anlatılır", id: "Anekdot: peristiwa lampau yang baru terjadi, diceritakan seolah-olah sedang terjadi", vi: "Chuyện kể: một sự việc vừa xảy ra trong quá khứ, được kể như đang diễn ra" }
            ex: { examples: [[{ signal: Ayer }, " ", { target: llego }, " a casa y ", { target: no encuentro }, " las llaves."], [{ signal: Anoche }, " ", { target: llamo }, " a mi hermana para felicitarla y ", { target: me dice }, " que ya lo sabe."]] }
            tr: { en: { examples: ["Yesterday I get home and I can't find my keys.", "Last night I call my sister to congratulate her and she tells me she already knows."] }, uk: { examples: ["Учора приходжу додому — і не можу знайти ключі.", "Минулого вечора дзвоню сестрі, щоб привітати її, а вона мені каже, що вже знає."] }, pt: { examples: ["Ontem eu chego em casa e não acho as chaves.", "Ontem à noite eu ligo para minha irmã para dar os parabéns e ela me diz que já sabe."] }, fr: { examples: ["Hier, j’arrive à la maison et je ne trouve pas mes clés.", "Hier soir, j’appelle ma sœur pour la féliciter et elle me dit qu’elle le sait déjà."] }, de: { examples: ["Gestern komme ich nach Hause und finde meine Schlüssel nicht.", "Gestern Abend rufe ich meine Schwester an, um ihr zu gratulieren, und sie sagt mir, dass sie es schon weiß."] }, it: { examples: ["Ieri arrivo a casa e non trovo le chiavi.", "Ieri sera chiamo mia sorella per farle gli auguri e lei mi dice che lo sa già."] }, pl: { examples: ["Wczoraj wracam do domu i nie mogę znaleźć kluczy.", "Wczoraj wieczorem dzwonię do siostry, żeby jej pogratulować, a ona mówi mi, że już wie."] }, tr: { examples: ["Dün eve geliyorum ve anahtarlarımı bulamıyorum.", "Dün akşam kız kardeşimi tebrik etmek için arıyorum, o da bana zaten bildiğini söylüyor."] }, id: { examples: ["Kemarin saya sampai di rumah dan tidak menemukan kunci saya.", "Tadi malam saya menelepon saudara perempuan saya untuk mengucapkan selamat, dan dia bilang dia sudah tahu."] }, vi: { examples: ["Hôm qua tôi về đến nhà và không tìm thấy chìa khóa.", "Tối qua tôi gọi cho chị gái để chúc mừng, và chị nói rằng chị đã biết rồi."] } }
          - level: C1
            use: { es: "Presente histórico: un hecho de la historia, contado como actual", en: "Historical present: a fact from history, told as current", uk: "Історичне теперішнє: історична подія, подана як теперішня", pt: "Presente histórico: um fato da história, contado como atual", fr: "Présent historique : un fait de l’histoire, raconté comme actuel", de: "Historisches Präsens: ein geschichtliches Ereignis, als gegenwärtig erzählt", it: "Presente storico: un fatto della storia, raccontato come attuale", pl: "Czas teraźniejszy historyczny: wydarzenie z historii opowiedziane jako bieżące", tr: "Tarihî şimdiki zaman: tarihteki bir olay, şimdiki zamanmış gibi anlatılır", id: "Presente histórico: peristiwa sejarah, diceritakan seolah-olah sedang terjadi", vi: "Hiện tại lịch sử: một sự kiện lịch sử được kể như đang diễn ra" }
            ex: { examples: [["En ", { date: "1605", value: "1605" }, " Cervantes ", { target: publica }, " la primera parte del Quijote."], ["En ", { date: "1989", value: "1989" }, " ", { target: cae }, " el muro de Berlín."]] }
            tr: { en: { examples: ["In 1605, Cervantes publishes the first part of Don Quixote.", "In 1989, the Berlin Wall falls."] }, uk: { examples: ["У 1605 році Сервантес видає першу частину «Дон Кіхота».", "У 1989 році падає Берлінський мур."] }, pt: { examples: ["Em 1605, Cervantes publica a primeira parte do Quixote.", "Em 1989, cai o Muro de Berlim."] }, fr: { examples: ["En 1605, Cervantès publie la première partie du Quichotte.", "En 1989, le mur de Berlin tombe."] }, de: { examples: ["1605 veröffentlicht Cervantes den ersten Teil des Don Quijote.", "1989 fällt die Berliner Mauer."] }, it: { examples: ["Nel 1605 Cervantes pubblica la prima parte del Don Chisciotte.", "Nel 1989 cade il muro di Berlino."] }, pl: { examples: ["W 1605 roku Cervantes publikuje pierwszą część „Don Kichota”.", "W 1989 roku upada mur berliński."] }, tr: { examples: ["1605’te Cervantes “Don Kişot”un ilk bölümünü yayımlar.", "1989’da Berlin Duvarı yıkılır."] }, id: { examples: ["Pada tahun 1605, Cervantes menerbitkan bagian pertama Don Quixote.", "Pada tahun 1989, Tembok Berlin runtuh."] }, vi: { examples: ["Năm 1605, Cervantes xuất bản phần đầu của Don Quixote.", "Năm 1989, bức tường Berlin sụp đổ."] } }
          - level: C2
            use: { es: "Presente volitivo: rechazo o prohibición del hablante, ahora", en: "Volitional present: the speaker's refusal or ban, now", uk: "Волітивне теперішнє: відмова або заборона мовця зараз", pt: "Presente volitivo: recusa ou proibição do falante, agora", fr: "Présent volitif : refus ou interdiction du locuteur, à l’instant", de: "Volitives Präsens: Ablehnung oder Verbot des Sprechers, jetzt", it: "Presente volitivo: rifiuto o divieto di chi parla, ora", pl: "Czas teraźniejszy wolitywny: odmowa lub zakaz mówiącego, w tej chwili", tr: "İstek bildiren şimdiki zaman: konuşanın o anda reddetmesi ya da yasaklaması", id: "Presente volitivo: penolakan atau larangan dari pembicara, saat ini", vi: "Hiện tại ý chí: sự từ chối hoặc cấm đoán của người nói, ngay lúc này" }
            ex: ["¡Eso ", { target: no te lo permito }, "!"]
            tr: { en: "I won't allow that!", uk: "Цього я тобі не дозволю!", pt: "Isso eu não permito!", fr: "Ça, je ne te le permets pas !", de: "Das erlaube ich dir nicht!", it: "Questo non te lo permetto!", pl: "Tego ci nie pozwalam!", tr: "Buna izin vermiyorum!", id: "Itu tidak saya izinkan!", vi: "Chuyện đó tôi không cho phép!" }
          - level: C2
            use: { es: "Presente volitivo: orden para más tarde", en: "Volitional present: an order for later", uk: "Волітивне теперішнє: наказ на потім", pt: "Presente volitivo: ordem para mais tarde", fr: "Présent volitif : ordre pour plus tard", de: "Volitives Präsens: Anordnung für später", it: "Presente volitivo: ordine per più tardi", pl: "Czas teraźniejszy wolitywny: polecenie na później", tr: "İstek bildiren şimdiki zaman: daha sonrası için emir", id: "Presente volitivo: perintah untuk nanti", vi: "Hiện tại ý chí: mệnh lệnh cho lúc sau" }
            ex: [{ signal: Mañana mismo }, " me ", { target: devuelves }, " el dinero."]
            tr: { en: "You give me the money back tomorrow, no later.", uk: "Уже завтра повернеш мені гроші.", pt: "Amanhã mesmo você me devolve o dinheiro.", fr: "Dès demain, tu me rends l’argent.", de: "Gleich morgen gibst du mir das Geld zurück.", it: "Domani stesso mi restituisci i soldi.", pl: "Jutro oddajesz mi pieniądze, bez zwłoki.", tr: "Yarın mutlaka parayı bana geri verirsin.", id: "Besok juga kamu mengembalikan uangku.", vi: "Ngay ngày mai, bạn trả lại tiền cho tôi." }
          - level: C2
            use: { es: "Presente volitivo: amenaza", en: "Volitional present: a threat", uk: "Волітивне теперішнє: погроза", pt: "Presente volitivo: ameaça", fr: "Présent volitif : menace", de: "Volitives Präsens: Drohung", it: "Presente volitivo: minaccia", pl: "Czas teraźniejszy wolitywny: groźba", tr: "İstek bildiren şimdiki zaman: tehdit", id: "Presente volitivo: ancaman", vi: "Hiện tại ý chí: lời đe dọa" }
            ex: ["Una palabra más y ", { target: te echo }, "."]
            tr: { en: "One more word and I'll throw you out.", uk: "Ще слово — і я тебе виставлю.", pt: "Mais uma palavra e eu te ponho para fora.", fr: "Un mot de plus et je te mets dehors.", de: "Noch ein Wort, und ich werfe dich raus.", it: "Ancora una parola e ti butto fuori.", pl: "Jeszcze jedno słowo, a cię wyrzucę.", tr: "Bir kelime daha edersen seni kovarım.", id: "Satu kata lagi dan saya usir kamu.", vi: "Thêm một lời nữa là tôi đuổi bạn ra ngoài." }
          - level: C2
            use: { es: "Presente analítico: pie de foto, que describe lo que muestra la imagen", en: "Analytic present: a photo caption, which describes what the image shows", uk: "Аналітичне теперішнє: підпис до фотографії, що описує зображене", pt: "Presente analítico: legenda de foto, que descreve o que a imagem mostra", fr: "Présent analytique : légende de photo, qui décrit ce que montre l’image", de: "Analytisches Präsens: Bildunterschrift, die beschreibt, was das Bild zeigt", it: "Presente analitico: didascalia di una foto, che descrive ciò che mostra l’immagine", pl: "Czas teraźniejszy analityczny: podpis pod zdjęciem, który opisuje to, co pokazuje obraz", tr: "Çözümleyici şimdiki zaman: görselin gösterdiğini anlatan fotoğraf altyazısı", id: "Presente analítico: keterangan foto yang menggambarkan apa yang ditampilkan gambar", vi: "Hiện tại mô tả: chú thích ảnh, mô tả điều bức ảnh cho thấy" }
            ex: ["La alcaldesa ", { target: corta }, " la cinta en la inauguración del puente."]
            tr: { en: "The mayor cuts the ribbon at the opening of the bridge.", uk: "Міська голова перерізає стрічку на відкритті мосту.", pt: "A prefeita corta a fita na inauguração da ponte.", fr: "La maire coupe le ruban lors de l’inauguration du pont.", de: "Die Bürgermeisterin durchschneidet bei der Einweihung der Brücke das Band.", it: "La sindaca taglia il nastro all’inaugurazione del ponte.", pl: "Burmistrzyni przecina wstęgę podczas otwarcia mostu.", tr: "Belediye başkanı köprünün açılışında kurdeleyi keser.", id: "Wali kota memotong pita pada peresmian jembatan.", vi: "Bà thị trưởng cắt băng khánh thành cây cầu." }

  - title: { en: Signal words, es: Marcadores, uk: "Слова-маркери", pt: "Palavras indicadoras", fr: "Mots-clés", de: "Signalwörter", it: "Parole spia", pl: "Słowa sygnalne", tr: "Anahtar sözcükler", id: "Kata penanda", vi: "Dấu hiệu nhận biết" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Word, es: Palabra, uk: Слово, pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, signal: ahora, ex: [{ signal: Ahora }, " ", { target: estudio }, " en casa."], tr: { en: "I'm studying at home now.", uk: "Зараз я вчуся вдома.", pt: "Agora estou estudando em casa.", fr: "Maintenant, j’étudie à la maison.", de: "Jetzt lerne ich zu Hause.", it: "Adesso studio a casa.", pl: "Teraz uczę się w domu.", tr: "Şimdi evde ders çalışıyorum.", id: "Sekarang saya sedang belajar di rumah.", vi: "Bây giờ tôi đang học ở nhà." } }
          - { level: A1, signal: siempre, ex: [{ signal: Siempre }, " ", { target: llego }, " tarde."], tr: { en: I always arrive late., uk: "Я завжди спізнююся.", pt: "Eu sempre chego tarde.", fr: "J’arrive toujours en retard.", de: "Ich komme immer zu spät.", it: "Arrivo sempre in ritardo.", pl: "Zawsze się spóźniam.", tr: "Hep geç kalıyorum.", id: "Saya selalu datang terlambat.", vi: "Tôi luôn đến muộn." } }
          - { level: A1, signal: todos los días, ex: [{ signal: Todos los días }, " ", { target: desayuno }, " con mi familia."], tr: { en: I have breakfast with my family every day., uk: "Щодня я снідаю з родиною.", pt: "Todos os dias eu tomo café da manhã com minha família.", fr: "Tous les jours, je prends le petit-déjeuner avec ma famille.", de: "Jeden Tag frühstücke ich mit meiner Familie.", it: "Ogni giorno faccio colazione con la mia famiglia.", pl: "Codziennie jem śniadanie z rodziną.", tr: "Her gün ailemle kahvaltı yapıyorum.", id: "Setiap hari saya sarapan bersama keluarga saya.", vi: "Ngày nào tôi cũng ăn sáng với gia đình." } }
