# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.presente.presente-regular
lang: es
kind: grammar
tags: [verbs, present, regular]
concepts: [present-tense]
related: [es.presente.presente-irregular, es.presente.verbos-reflexivos, es.presente.estar-gerundio, es.ser-estar-hay-gustar.ser-estar, es.pronombres.pronombres-sujeto, es.oracion.preguntas-negacion]
status: { en: draft, es: draft, uk: draft }
translated: { en: "a66f87 bca585 b60384 f03fc2 ac79d6 82650b 2e425e 476036 93ccd5", uk: "a66f87 bca585 b60384 f03fc2 ac79d6 82650b 2e425e 476036 93ccd5" }

title: { en: "Present Tense: Regular Verbs", es: "El presente: verbos regulares", uk: "Теперішній час: правильні дієслова" }
summary:
  lead:
    en: ["Regular verbs in ", { term: "-ar" }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " drop the infinitive ending and add one ending per person: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    es: ["Los verbos regulares en ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " cambian la terminación del infinitivo por una para cada persona: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
    uk: ["Правильні дієслова на ", { term: "-ar" }, ", ", { term: "-er" }, " та ", { term: "-ir" }, " відкидають закінчення інфінітива й додають закінчення для кожної особи: ", { term: hablo }, ", ", { term: comes }, ", ", { term: vive }, "."]
  rule:
    en: "Each person has its own ending, so the subject pronoun usually drops:"
    es: "Cada persona tiene su propia terminación, por eso el pronombre sujeto suele omitirse:"
    uk: "Кожна особа має своє закінчення, тому особовий займенник-підмет зазвичай опускають:"
  ex: { examples: [[{ target: Hablo }, " español."], ["¿", { target: Vives }, " en Lima?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A1
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: hablar }, ": ", { alternatives: [{ term: hablo }, { term: hablas }, { term: habla }, { term: hablamos }, { term: hablan }] }]
            es: [{ term: hablar }, ": ", { alternatives: [{ term: hablo }, { term: hablas }, { term: habla }, { term: hablamos }, { term: hablan }] }]
            uk: [{ term: hablar }, ": ", { alternatives: [{ term: hablo }, { term: hablas }, { term: habla }, { term: hablamos }, { term: hablan }] }]
          ex: [{ target: Hablo }, " español."]
          tr: { en: I speak Spanish., uk: "Я розмовляю іспанською." }
        - level: A1
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: comer }, ": ", { alternatives: [{ term: como }, { term: comes }, { term: come }, { term: comemos }, { term: comen }] }]
            es: [{ term: comer }, ": ", { alternatives: [{ term: como }, { term: comes }, { term: come }, { term: comemos }, { term: comen }] }]
            uk: [{ term: comer }, ": ", { alternatives: [{ term: como }, { term: comes }, { term: come }, { term: comemos }, { term: comen }] }]
          ex: ["¿Qué ", { target: comes }, "?"]
          tr: { en: What do you eat?, uk: "Що ти їси?" }
        - level: A1
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: vivir }, ": ", { alternatives: [{ term: vivo }, { term: vives }, { term: vive }, { term: vivimos }, { term: viven }] }]
            es: [{ term: vivir }, ": ", { alternatives: [{ term: vivo }, { term: vives }, { term: vive }, { term: vivimos }, { term: viven }] }]
            uk: [{ term: vivir }, ": ", { alternatives: [{ term: vivo }, { term: vives }, { term: vive }, { term: vivimos }, { term: viven }] }]
          ex: ["Mis padres ", { target: viven }, " en Lima."]
          tr: { en: My parents live in Lima., uk: "Мої батьки живуть у Лімі." }
        - level: A1
          variety: es-ES
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }]
            uk: [{ term: vosotros }, ": ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }]
          ex: ["¿Dónde ", { target: vivís }, "?"]
          tr: { en: Where do you live?, uk: "Де ви живете?" }
        - level: A1
          point: { en: Person, es: Persona, uk: Особа }
          rule:
            en: "the ending names the person; the pronoun usually drops"
            es: "la terminación indica la persona; el pronombre suele omitirse"
            uk: "закінчення вказує на особу; займенник зазвичай опускають"
          ex: [{ target: Vivo }, " en Quito."]
          tr: { en: I live in Quito., uk: "Я живу в Кіто." }
        - level: A1
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "what happens now, habits and facts"
            es: "lo que pasa ahora, los hábitos y los hechos"
            uk: "те, що відбувається зараз, звички й факти"
          ex: ["Todos los días ", { target: camino }, " al trabajo."]
          tr: { en: I walk to work every day., uk: "Щодня я ходжу на роботу пішки." }
        - level: A1
          point: { en: Negative, es: Negación, uk: Заперечення }
          rule:
            en: [{ term: "no" }, " goes before the verb"]
            es: [{ term: "no" }, " va delante del verbo"]
            uk: [{ term: "no" }, " ставлять перед дієсловом"]
          ex: [{ target: No como }, " carne."]
          tr: { en: "I don't eat meat.", uk: "Я не їм м’яса." }
        - level: A1
          point: { en: Question, es: Pregunta, uk: Питання }
          rule:
            en: "the same words, between ¿ and ?, with a rising voice"
            es: "las mismas palabras, entre ¿ y ?, con la voz que sube"
            uk: "ті самі слова між ¿ і ?, з підвищенням голосу"
          ex: ["¿", { target: Hablas }, " inglés?"]
          tr: { en: Do you speak English?, uk: "Ти розмовляєш англійською?" }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: [{ term: usted }, " takes the forms of ", { term: él }, " and ", { term: ella }]
            es: [{ term: usted }, " lleva las formas de ", { term: él }, " y ", { term: ella }]
            uk: [{ term: usted }, " вживається з формами ", { term: él }, " та ", { term: ella }]
          ex: ["¿", { target: Habla }, " usted inglés?"]
          tr: { en: Do you speak English?, uk: "Ви розмовляєте англійською?" }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: [{ term: "-er" }, " and ", { term: "-ir" }, " differ with ", { term: nosotros }]
            es: [{ term: "-er" }, " e ", { term: "-ir" }, " se distinguen con ", { term: nosotros }]
            uk: [{ term: "-er" }, " та ", { term: "-ir" }, " розрізняються з ", { term: nosotros }]
          ex: { examples: [[{ target: Comemos }, " aquí."], [{ target: Vivimos }, " aquí."]] }
          tr: { en: { examples: [We eat here., We live here.] }, uk: { examples: ["Ми їмо тут.", "Ми живемо тут."] } }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Every infinitive ends in ", { term: "-ar" }, ", ", { term: "-er" }, " or ", { term: "-ir" }, "; the stem is the part before it: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              es: ["Todo infinitivo termina en ", { term: "-ar" }, ", ", { term: "-er" }, " o ", { term: "-ir" }, "; la raíz es la parte anterior: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              uk: ["Кожен інфінітив закінчується на ", { term: "-ar" }, ", ", { term: "-er" }, " або ", { term: "-ir" }, "; основа — це частина перед закінченням: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
          - type: rule
            level: A1
            text:
              en: "A regular verb keeps its stem and adds an ending for each person."
              es: "Un verbo regular mantiene la raíz y añade una terminación para cada persona."
              uk: "Правильне дієслово зберігає основу й додає закінчення для кожної особи."
          - type: rule
            level: A1
            text:
              en: "The ending names the person, so the subject pronoun usually drops:"
              es: "La terminación indica la persona, por eso el pronombre sujeto suele omitirse:"
              uk: "Закінчення вказує на особу, тому займенник-підмет зазвичай опускають:"
            ex: [{ target: Trabajo }, " en un banco."]
            tr: { en: I work in a bank., uk: "Я працюю в банку." }
          - type: note
            level: A1
            text:
              en: ["The pronouns themselves: ", { link: Subject Pronouns, to: es.pronombres.pronombres-sujeto }, "."]
              es: ["Los pronombres: ", { link: Los pronombres sujeto, to: es.pronombres.pronombres-sujeto }, "."]
              uk: ["Самі займенники: ", { link: "Особові займенники-підмети", to: es.pronombres.pronombres-sujeto }, "."]
          - type: note
            level: A1
            text:
              en: ["Verbs that change their stem: ", { link: "Present Tense: Irregular Verbs", to: es.presente.presente-irregular }, "."]
              es: ["Los verbos que cambian la raíz: ", { link: "El presente: verbos irregulares", to: es.presente.presente-irregular }, "."]
              uk: ["Дієслова, що змінюють основу: ", { link: "Теперішній час: неправильні дієслова", to: es.presente.presente-irregular }, "."]

  - title: { en: "Form: -ar, -er and -ir", es: "Forma: -ar, -er e -ir", uk: "Форма: -ar, -er та -ir" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, ar: ["habl", { ending: o }], er: ["com", { ending: o }], ir: ["viv", { ending: o }] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["habl", { ending: as }], er: ["com", { ending: es }], ir: ["viv", { ending: es }] }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["habl", { ending: a }], er: ["com", { ending: e }], ir: ["viv", { ending: e }] }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["habl", { ending: amos }], er: ["com", { ending: emos }], ir: ["viv", { ending: imos }] }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["habl", { ending: áis }], er: ["com", { ending: éis }], ir: ["viv", { ending: ís }] }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["habl", { ending: an }], er: ["com", { ending: en }], ir: ["viv", { ending: en }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " share their endings, except with ", { term: nosotros }, ": ", { term: comemos }, ", ", { term: vivimos }, "."]
              es: ["Los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, " comparten las terminaciones, salvo con ", { term: nosotros }, ": ", { term: comemos }, ", ", { term: vivimos }, "."]
              uk: ["Дієслова на ", { term: "-er" }, " та ", { term: "-ir" }, " мають спільні закінчення, крім форми ", { term: nosotros }, ": ", { term: comemos }, ", ", { term: vivimos }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: usted }, " takes the forms of ", { term: él }, " and ", { term: ella }, ", and ", { term: ustedes }, " those of ", { term: ellos }, ":"]
              es: [{ term: usted }, " lleva las formas de ", { term: él }, " y ", { term: ella }, ", y ", { term: ustedes }, ", las de ", { term: ellos }, ":"]
              uk: [{ term: usted }, " вживається з формами ", { term: él }, " та ", { term: ella }, ", а ", { term: ustedes }, " — з формами ", { term: ellos }, ":"]
            ex: ["¿", { target: Trabaja }, " usted aquí?"]
            tr: { en: Do you work here?, uk: "Ви тут працюєте?" }
          - type: note
            level: A1
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
              uk: [{ term: ustedes }, " — це множина і від ", { term: tú }, ", і від ", { term: usted }, ":"]
            ex: ["¿Ustedes ", { target: viven }, " cerca?"]
            tr: { en: Do you live nearby?, uk: "Ви живете поблизу?" }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " is the informal plural, and its endings carry a written accent: ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }, "."]
              es: [{ term: vosotros }, " es el plural informal, y sus terminaciones llevan tilde: ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }, "."]
              uk: [{ term: vosotros }, " — неофіційна множина, і його закінчення мають графічний наголос: ", { alternatives: [{ term: habláis }, { term: coméis }, { term: vivís }] }, "."]
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["In Argentina and Uruguay, ", { term: vos }, " takes the place of ", { term: tú }, ", with its own forms: ", { alternatives: [{ term: vos hablás }, { term: vos comés }, { term: vos vivís }] }, "."]
              es: ["En Argentina y Uruguay, ", { term: vos }, " ocupa el lugar de ", { term: tú }, ", con sus propias formas: ", { alternatives: [{ term: vos hablás }, { term: vos comés }, { term: vos vivís }] }, "."]
              uk: ["В Аргентині та Уругваї замість ", { term: tú }, " кажуть ", { term: vos }, ", і він має власні форми: ", { alternatives: [{ term: vos hablás }, { term: vos comés }, { term: vos vivís }] }, "."]

  - title: { en: "Pronunciation: stress", es: "Pronunciación: el acento", uk: "Вимова: наголос" }
    role: pronunciation
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The stress falls on the stem in the singular and with ellos:"
              es: "El acento cae en la raíz en el singular y con ellos:"
              uk: "В однині та з ellos наголос падає на основу:"
            ex: { examples: [[{ stress: ha }, "blo"], [{ stress: co }, "men"]] }
            tr: { en: { examples: [I speak, they eat] }, uk: { examples: ["я говорю", "вони їдять"] } }
          - type: rule
            level: A1
            text:
              en: ["With ", { term: nosotros }, ", the stress moves to the ending:"]
              es: ["Con ", { term: nosotros }, ", el acento pasa a la terminación:"]
              uk: ["З ", { term: nosotros }, " наголос переходить на закінчення:"]
            ex: { examples: [["ha", { stress: bla }, "mos"], ["vi", { stress: vi }, "mos"]] }
            tr: { en: { examples: [we speak, we live] }, uk: { examples: ["ми говоримо", "ми живемо"] } }

  - title: { en: "Form: negatives and questions", es: "Forma: negación y preguntas", uk: "Форма: заперечення та питання" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: Форма } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, form: { pattern: [{ term: "no" }, { slot: verb }] }, ex: [{ target: No hablo }, " francés."], tr: { en: "I don't speak French.", uk: "Я не розмовляю французькою." } }
          - { level: A1, form: { en: Yes or no question, es: Pregunta de sí o no, uk: Загальне питання (так чи ні) }, ex: ["¿", { target: Hablas }, " inglés?"], tr: { en: Do you speak English?, uk: "Ти розмовляєш англійською?" } }
          - { level: A1, form: { pattern: [{ slot: wh-word }, { slot: verb }] }, ex: ["¿Dónde ", { target: trabajas }, "?"], tr: { en: Where do you work?, uk: "Де ти працюєш?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A question keeps the words of the statement; ¿ and ? frame it, and the voice rises at the end."
              es: "Una pregunta mantiene las palabras de la afirmación; ¿ y ? la enmarcan, y la voz sube al final."
              uk: "Питання зберігає слова стверджувального речення; його обрамлюють ¿ і ?, а наприкінці голос підвищується."
          - type: note
            level: A1
            text:
              en: ["More on both: ", { link: Questions and Negatives, to: es.oracion.preguntas-negacion }, "."]
              es: ["Más sobre las dos: ", { link: Preguntas y negación, to: es.oracion.preguntas-negacion }, "."]
              uk: ["Більше про обидва: ", { link: "Питання і заперечення", to: es.oracion.preguntas-negacion }, "."]

  - title: { en: Use, es: Uso, uk: Ужиток }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Ужиток } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, use: { en: What happens now, es: Lo que pasa ahora, uk: "Те, що відбувається зараз" }, ex: ["Ahora ", { target: leo }, " un libro."], tr: { en: "I'm reading a book now.", uk: "Зараз я читаю книжку." } }
          - { level: A1, use: { en: Habits, es: Hábitos, uk: Звички }, ex: ["Todos los días ", { target: camino }, " al trabajo."], tr: { en: I walk to work every day., uk: "Щодня я ходжу на роботу пішки." } }
          - { level: A1, use: { en: Facts and states, es: Hechos y estados, uk: Факти та стани }, ex: ["Mi hermana ", { target: vive }, " en Bogotá."], tr: { en: My sister lives in Bogotá., uk: "Моя сестра живе в Боготі." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The present also names an action in progress, where English uses -ing:"
              es: "El presente también expresa una acción en curso:"
              uk: "Теперішній час також називає дію, що триває зараз, — як і в українській:"
            ex: { exchange: [["¿Qué ", { target: lees }, "?"], [{ target: Leo }, " una novela."]] }
            tr: { en: { exchange: [What are you reading?, "I'm reading a novel."] }, uk: { exchange: ["Що ти читаєш?", "Читаю роман."] } }

  - title: { en: Signal words, es: Marcadores, uk: Слова-сигнали }
    role: signals
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Word, es: Palabra, uk: Слово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, signal: ahora, ex: [{ signal: Ahora }, " ", { target: estudio }, " en casa."], tr: { en: "I'm studying at home now.", uk: "Зараз я вчуся вдома." } }
          - { level: A1, signal: siempre, ex: [{ signal: Siempre }, " ", { target: llego }, " tarde."], tr: { en: I always arrive late., uk: "Я завжди спізнююся." } }
          - { level: A1, signal: todos los días, ex: [{ signal: Todos los días }, " ", { target: desayuno }, " con mi familia."], tr: { en: I have breakfast with my family every day., uk: "Щодня я снідаю з родиною." } }
          - { level: A1, signal: a veces, ex: [{ signal: A veces }, " ", { target: cocinamos }, " juntos."], tr: { en: Sometimes we cook together., uk: "Іноді ми готуємо разом." } }
          - { level: A1, signal: los domingos, ex: [{ signal: Los domingos }, " ", { target: visitamos }, " a mis abuelos."], tr: { en: On Sundays we visit my grandparents., uk: "По неділях ми провідуємо дідуся й бабусю." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Yo habla español., right: ["Yo ", { target: hablo }, " español."], rule: { en: [{ term: yo }, " takes ", { term: "-o" }], es: [{ term: yo }, " lleva ", { term: "-o" }], uk: [{ term: yo }, " має закінчення ", { term: "-o" }] } }
