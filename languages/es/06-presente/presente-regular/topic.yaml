sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Every infinitive ends in ", { term: "-ar" }, ", ", { term: "-er" }, " or ", { term: "-ir" }, "; the stem is the part before it: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              es: ["Todo infinitivo termina en ", { term: "-ar" }, ", ", { term: "-er" }, " o ", { term: "-ir" }, "; la raíz es la parte anterior: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              uk: ["Кожен інфінітив закінчується на ", { term: "-ar" }, ", ", { term: "-er" }, " або ", { term: "-ir" }, "; основа — це частина перед закінченням: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              pt: ["Todo infinitivo termina em ", { term: "-ar" }, ", ", { term: "-er" }, " ou ", { term: "-ir" }, "; o radical é a parte que vem antes: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              fr: ["Tout infinitif se termine en ", { term: "-ar" }, ", ", { term: "-er" }, " ou ", { term: "-ir" }, " ; le radical est la partie qui précède : ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              de: ["Jeder Infinitiv endet auf ", { term: "-ar" }, ", ", { term: "-er" }, " oder ", { term: "-ir" }, "; der Stamm ist der Teil davor: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              it: ["Ogni infinito termina in ", { term: "-ar" }, ", ", { term: "-er" }, " o ", { term: "-ir" }, "; la radice è la parte che precede: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              pl: ["Każdy bezokolicznik kończy się na ", { term: "-ar" }, ", ", { term: "-er" }, " lub ", { term: "-ir" }, "; temat to część przed końcówką: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              tr: ["Her mastar ", { term: "-ar" }, ", ", { term: "-er" }, " veya ", { term: "-ir" }, " ile biter; kök, bundan önceki kısımdır: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              id: ["Setiap infinitif berakhiran ", { term: "-ar" }, ", ", { term: "-er" }, " atau ", { term: "-ir" }, "; akar kata adalah bagian sebelum akhiran itu: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
              vi: ["Mọi động từ nguyên mẫu đều tận cùng bằng ", { term: "-ar" }, ", ", { term: "-er" }, " hoặc ", { term: "-ir" }, "; gốc động từ là phần đứng trước: ", { mapping: [{ term: hablar }, { term: "habl-" }] }, "."]
          - type: rule
            level: A1
            text:
              en: "A regular verb keeps its stem and adds an ending for each person."
              es: "Un verbo regular mantiene la raíz y añade una terminación para cada persona."
              uk: "Правильне дієслово зберігає основу й додає закінчення для кожної особи."
              pt: "Um verbo regular mantém o radical e acrescenta uma terminação para cada pessoa."
              fr: "Un verbe régulier garde son radical et ajoute une terminaison pour chaque personne."
              de: "Ein regelmäßiges Verb behält seinen Stamm und hängt für jede Person eine Endung an."
              it: "Un verbo regolare mantiene la radice e aggiunge una desinenza per ogni persona."
              pl: "Czasownik regularny zachowuje temat i dodaje końcówkę dla każdej osoby."
              tr: "Düzenli fiil kökünü korur ve her kişi için bir ek alır."
              id: "Kata kerja beraturan mempertahankan akar katanya dan menambahkan satu akhiran untuk setiap persona."
              vi: "Động từ có quy tắc giữ nguyên gốc và thêm một đuôi cho mỗi ngôi."
          - type: rule
            level: A1
            text:
              en: "The ending names the person, so the subject pronoun usually drops:"
              es: "La terminación indica la persona, por eso el pronombre sujeto suele omitirse:"
              uk: "Закінчення вказує на особу, тому займенник у ролі підмета зазвичай опускають:"
              pt: "A terminação indica a pessoa, por isso o pronome sujeito costuma ser omitido:"
              fr: "La terminaison indique la personne ; le pronom sujet s’omet donc le plus souvent :"
              de: "Die Endung zeigt die Person an, deshalb entfällt das Subjektpronomen meist:"
              it: "La desinenza indica la persona, perciò il pronome soggetto di solito si omette:"
              pl: "Końcówka wskazuje osobę, więc zaimek osobowy w roli podmiotu zwykle się pomija:"
              tr: "Ek kişiyi gösterir; bu yüzden özne zamiri çoğunlukla söylenmez:"
              id: "Akhiran menunjukkan persona, jadi kata ganti subjek biasanya dihilangkan:"
              vi: "Đuôi cho biết ngôi, nên đại từ chủ ngữ thường được lược bỏ:"
            ex: [{ target: Trabajo }, " en un banco."]
            tr: { en: I work in a bank., uk: "Я працюю в банку.", pt: "Eu trabalho em um banco.", fr: "Je travaille dans une banque.", de: "Ich arbeite in einer Bank.", it: "Lavoro in una banca.", pl: "Pracuję w banku.", tr: "Bir bankada çalışıyorum.", id: "Saya bekerja di bank.", vi: "Tôi làm việc ở một ngân hàng." }
          - type: note
            level: A1
            text:
              en: ["The pronouns themselves: ", { link: Subject Pronouns, to: es.pronombres.pronombres-sujeto }, "."]
              es: ["Los pronombres: ", { link: Los pronombres sujeto, to: es.pronombres.pronombres-sujeto }, "."]
              uk: ["Самі займенники: ", { link: "Особові займенники в ролі підмета", to: es.pronombres.pronombres-sujeto }, "."]
              pt: ["Os pronomes: ", { link: "Os pronomes sujeito", to: es.pronombres.pronombres-sujeto }, "."]
              fr: ["Les pronoms : ", { link: "Les pronoms sujets", to: es.pronombres.pronombres-sujeto }, "."]
              de: ["Die Pronomen: ", { link: "Subjektpronomen", to: es.pronombres.pronombres-sujeto }, "."]
              it: ["I pronomi: ", { link: "I pronomi soggetto", to: es.pronombres.pronombres-sujeto }, "."]
              pl: ["Same zaimki: ", { link: "Zaimki osobowe w roli podmiotu", to: es.pronombres.pronombres-sujeto }, "."]
              tr: ["Zamirlerin kendisi: ", { link: "Özne olarak kişi zamirleri", to: es.pronombres.pronombres-sujeto }, "."]
              id: ["Kata gantinya sendiri: ", { link: "Kata ganti subjek", to: es.pronombres.pronombres-sujeto }, "."]
              vi: ["Bản thân các đại từ: ", { link: "Đại từ làm chủ ngữ", to: es.pronombres.pronombres-sujeto }, "."]
          - type: note
            level: A1
            text:
              en: ["Verbs that change their stem: ", { link: "Present Tense: Irregular Verbs", to: es.presente.presente-irregular }, "."]
              es: ["Los verbos que cambian la raíz: ", { link: "El presente: verbos irregulares", to: es.presente.presente-irregular }, "."]
              uk: ["Дієслова, що змінюють основу: ", { link: "Теперішній час: неправильні дієслова", to: es.presente.presente-irregular }, "."]
              pt: ["Os verbos que mudam o radical: ", { link: "O presente: verbos irregulares", to: es.presente.presente-irregular }, "."]
              fr: ["Les verbes qui changent de radical : ", { link: "Le présent : verbes irréguliers", to: es.presente.presente-irregular }, "."]
              de: ["Verben, die ihren Stamm verändern: ", { link: "Das Präsens: unregelmäßige Verben", to: es.presente.presente-irregular }, "."]
              it: ["I verbi che cambiano radice: ", { link: "Il presente: verbi irregolari", to: es.presente.presente-irregular }, "."]
              pl: ["Czasowniki, które zmieniają temat: ", { link: "Czas teraźniejszy: czasowniki nieregularne", to: es.presente.presente-irregular }, "."]
              tr: ["Kökü değişen fiiller: ", { link: "Presente: düzensiz fiiller", to: es.presente.presente-irregular }, "."]
              id: ["Kata kerja yang akar katanya berubah: ", { link: "Presente: kata kerja tidak beraturan", to: es.presente.presente-irregular }, "."]
              vi: ["Các động từ đổi gốc: ", { link: "Thì hiện tại: động từ bất quy tắc", to: es.presente.presente-irregular }, "."]
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["Як і в українській, особу видно із закінчення, тому займенник зазвичай пропускають: ", { term: hablo }, " — «розмовляю»."]

  - title: { en: "Form: -ar, -er and -ir", es: "Forma: -ar, -er e -ir", uk: "Форма: -ar, -er та -ir", pt: "Forma: -ar, -er e -ir", fr: "Forme : -ar, -er et -ir", de: "Form: -ar, -er und -ir", it: "Forma: -ar, -er e -ir", pl: "Forma: -ar, -er i -ir", tr: "Biçim: -ar, -er ve -ir", id: "Bentuk: -ar, -er dan -ir", vi: "Dạng: -ar, -er và -ir" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа, pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Persona", vi: "Ngôi" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, ar: ["habl", { ending: o }], er: ["com", { ending: o }], ir: ["viv", { ending: o }] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["habl", { ending: as }], er: ["com", { ending: es }], ir: ["viv", { ending: es }] }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["habl", { ending: a }], er: ["com", { ending: e }], ir: ["viv", { ending: e }] }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["habl", { ending: amos }], er: ["com", { ending: emos }], ir: ["viv", { ending: imos }] }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["habl", { ending: áis }], er: ["com", { ending: éis }], ir: ["viv", { ending: ís }] }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["habl", { ending: an }], er: ["com", { ending: en }], ir: ["viv", { ending: en }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " share their endings, except with ", { term: nosotros }, ": ", { term: comemos }, ", ", { term: vivimos }, "."]
