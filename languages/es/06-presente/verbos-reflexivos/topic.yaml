summary:
  lead:
    en: ["Reflexive verbs carry ", { term: se }, " in the infinitive and a pronoun that matches the subject: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    es: ["Los verbos reflexivos llevan ", { term: se }, " en el infinitivo y un pronombre que concuerda con el sujeto: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    uk: ["Зворотні дієслова мають ", { term: se }, " в інфінітиві та займенник, що відповідає підмету: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    pt: ["Os verbos reflexivos levam ", { term: se }, " no infinitivo e um pronome que concorda com o sujeito: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    fr: ["Les verbes pronominaux portent ", { term: se }, " à l’infinitif et un pronom qui s’accorde avec le sujet : ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    de: ["Reflexive Verben tragen im Infinitiv ", { term: se }, " und ein Pronomen, das zum Subjekt passt: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    it: ["I verbi riflessivi hanno ", { term: se }, " all'infinito e un pronome che concorda con il soggetto: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    pl: ["Czasowniki zwrotne mają w bezokoliczniku ", { term: se }, " oraz zaimek zgodny z podmiotem: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    tr: ["Dönüşlü fiillerin mastarında ", { term: se }, " bulunur; ayrıca özneye uyan bir zamir alırlar: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    id: ["Kata kerja refleksif memakai ", { term: se }, " pada infinitif dan kata ganti yang cocok dengan subjek: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    vi: ["Động từ phản thân có ", { term: se }, " ở dạng nguyên mẫu và một đại từ khớp với chủ ngữ: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
  rule:
    en: "The pronoun matches the subject and goes before the verb:"
    es: "El pronombre concuerda con el sujeto y va delante del verbo:"
    uk: "Займенник відповідає підмету й стоїть перед дієсловом:"
    pt: "O pronome concorda com o sujeito e vem antes do verbo:"
    fr: "Le pronom s’accorde avec le sujet et se place devant le verbe :"
    de: "Das Pronomen passt zum Subjekt und steht vor dem Verb:"
    it: "Il pronome concorda con il soggetto e va davanti al verbo:"
    pl: "Zaimek zgadza się z podmiotem i stoi przed czasownikiem:"
    tr: "Zamir özneye uyar ve fiilden önce gelir:"
    id: "Kata ganti cocok dengan subjek dan diletakkan sebelum kata kerja:"
    vi: "Đại từ khớp với chủ ngữ và đứng trước động từ:"
