id: es.presente.verbos-reflexivos
lang: es
kind: grammar
tags: [verbs, pronouns, reflexive, present]
concepts: [reflexive]
related: [es.presente.presente-regular, es.presente.presente-irregular, es.pronombres.objeto-directo, es.pronombres.combinacion-pronombres, es.futuro-condicional.ir-a-infinitivo]
status: { en: draft, es: draft, uk: draft }
translated: { en: "3b4ba0 df03fc 205273 91f75f 83b6d1 cb883c d5b0ae 08ccc3 dcf649 431e42", uk: "3b4ba0 df03fc 205273 91f75f 83b6d1 cb883c d5b0ae 08ccc3 dcf649 431e42" }

title: { en: Reflexive Verbs, es: Los verbos reflexivos, uk: Зворотні дієслова }
summary:
  lead:
    en: ["Reflexive verbs carry ", { term: se }, " in the infinitive and a pronoun that matches the subject: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    es: ["Los verbos reflexivos llevan ", { term: se }, " en el infinitivo y un pronombre que concuerda con el sujeto: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
    uk: ["Зворотні дієслова мають ", { term: se }, " в інфінітиві та займенник, що відповідає підмету: ", { term: me levanto }, ", ", { term: te duchas }, ", ", { term: se llama }, "."]
  rule:
    en: "The pronoun matches the subject and goes before the verb:"
    es: "El pronombre concuerda con el sujeto y va delante del verbo:"
    uk: "Займенник відповідає підмету й стоїть перед дієсловом:"
  ex: { examples: [[{ target: Me llamo }, " Ana."], ["¿Cómo ", { target: te llamas }, "?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A1
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: ["a pronoun for each person: ", { alternatives: [{ term: me }, { term: te }, { term: se }, { term: nos }] }]
            es: ["un pronombre para cada persona: ", { alternatives: [{ term: me }, { term: te }, { term: se }, { term: nos }] }]
            uk: ["займенник для кожної особи: ", { alternatives: [{ term: me }, { term: te }, { term: se }, { term: nos }] }]
          ex: [{ target: Me lavo }, " los dientes."]
          tr: { en: I brush my teeth., uk: "Я чищу зуби." }
        - level: A1
          variety: es-ES
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: vosotros }, ": ", { term: os }]
            es: [{ term: vosotros }, ": ", { term: os }]
            uk: [{ term: vosotros }, ": ", { term: os }]
          ex: ["¿A qué hora ", { target: os levantáis }, "?"]
          tr: { en: What time do you get up?, uk: "О котрій ви встаєте?" }
        - level: A1
          point: { en: Daily routine, es: La rutina, uk: Розпорядок дня }
          rule:
            en: "getting up, washing, showering, combing your hair"
            es: { alternatives: [{ term: levantarse }, { term: lavarse }, { term: ducharse }, { term: peinarse }] }
            uk: "вставати, вмиватися, приймати душ, зачісуватися"
          ex: [{ target: Me levanto }, " a las siete."]
          tr: { en: I get up at seven., uk: "Я встаю о сьомій." }
        - level: A1
          point: { en: Names, es: El nombre, uk: Ім’я }
          rule:
            en: [{ term: llamarse }, ": what someone is called"]
            es: [{ term: llamarse }, ": cómo se llama alguien"]
            uk: [{ term: llamarse }, ": як когось звати"]
          ex: [{ target: Me llamo }, " Lucía."]
          tr: { en: My name is Lucía., uk: "Мене звати Лусія." }
        - level: A2
          point: { en: With an infinitive, es: Con infinitivo, uk: З інфінітивом }
          rule:
            en: "the pronoun joins the infinitive, or goes before the conjugated verb"
            es: "el pronombre se une al infinitivo, o va delante del verbo conjugado"
            uk: "займенник приєднується до інфінітива або стоїть перед дієсловом в особовій формі"
          ex: { examples: [["Quiero ", { target: levantarme }, " temprano."], [{ target: Me }, " quiero levantar temprano."]] }
          tr: { en: { examples: [I want to get up early., I want to get up early.] }, uk: { examples: ["Я хочу встати рано.", "Я хочу встати рано."] } }
        - level: A2
          point: { en: Body and clothes, es: Cuerpo y ropa, uk: Тіло та одяг }
          rule:
            en: [{ term: el }, ", ", { term: la }, ", not a possessive"]
            es: [{ term: el }, ", ", { term: la }, ", sin posesivo"]
            uk: [{ term: el }, ", ", { term: la }, ", а не присвійний займенник"]
          ex: [{ target: Me lavo }, " las manos."]
          tr: { en: I wash my hands., uk: "Я мию руки." }
        - level: A2
          point: { en: New meaning, es: Otro significado, uk: Нове значення }
          rule:
            en: [{ term: ir }, " is to go; ", { term: irse }, " is to leave"]
            es: [{ term: ir }, " es desplazarse; ", { term: irse }, " es marcharse"]
            uk: [{ term: ir }, " — іти; ", { term: irse }, " — іти геть, вирушати"]
          ex: ["Ya ", { target: me voy }, "."]
          tr: { en: "I'm off now.", uk: "Ну, я пішов." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["the pronoun stays even with ", { term: yo }]
            es: ["el pronombre se mantiene también con ", { term: yo }]
            uk: ["займенник лишається навіть із ", { term: yo }]
          ex: ["Yo ", { target: me levanto }, " temprano."]
          tr: { en: I get up early., uk: "Я встаю рано." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["without ", { term: se }, ", the action falls on something else"]
            es: ["sin ", { term: se }, ", la acción recae sobre otra cosa"]
            uk: ["без ", { term: se }, " дія спрямована на щось інше"]
          ex: { examples: [[{ target: Lavo }, " los platos."], [{ target: Me lavo }, "."]] }
          tr: { en: { examples: [I wash the dishes., I have a wash.] }, uk: { examples: ["Я мию посуд.", "Я вмиваюся."] } }
        - level: B1
          point: { en: Each other, es: Valor recíproco, uk: Взаємна дія }
          rule:
            en: ["in the plural, ", { alternatives: [{ term: nos }, { term: se }] }, " can mean “each other”"]
            es: ["en plural, ", { alternatives: [{ term: nos }, { term: se }] }, " pueden indicar una acción mutua"]
            uk: ["у множині ", { alternatives: [{ term: nos }, { term: se }] }, " можуть означати «один одного»"]
          ex: ["Ana y Luis ", { target: se quieren }, " mucho."]
          tr: { en: Ana and Luis love each other very much., uk: "Ана й Луїс дуже кохають одне одного." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A reflexive verb names an action the subject does to itself."
              es: "Un verbo reflexivo expresa una acción que el sujeto hace sobre sí mismo."
              uk: "Зворотне дієслово називає дію, яку підмет спрямовує на себе."
          - type: rule
            level: A1
            text:
              en: ["Its infinitive ends in ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              es: ["Su infinitivo termina en ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              uk: ["Його інфінітив закінчується на ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
          - type: rule
            level: A1
            text:
              en: "The verb takes its usual forms, and a pronoun for the person goes before it."
              es: "El verbo lleva sus formas de siempre, y delante va un pronombre de la persona."
              uk: "Дієслово має звичайні форми, а перед ним стоїть займенник відповідної особи."
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["Many reflexive verbs need no “myself” in English: ", { term: me levanto }, " is “I get up”."]
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["Багато зворотних дієслів відповідають українським на «-ся»: ", { term: me lavo }, " — «я миюся». Але не всі: ", { term: me levanto }, " — «я встаю», а ", { term: estudio }, " — «я навчаюся»."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: levantarse, label: levantarse }
          - { key: llamarse, label: llamarse }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, levantarse: [{ target: me }, " levanto"], llamarse: [{ target: me }, " llamo"] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, levantarse: [{ target: te }, " levantas"], llamarse: [{ target: te }, " llamas"] }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, levantarse: [{ target: se }, " levanta"], llamarse: [{ target: se }, " llama"] }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, levantarse: [{ target: nos }, " levantamos"], llamarse: [{ target: nos }, " llamamos"] }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, levantarse: [{ target: os }, " levantáis"], llamarse: [{ target: os }, " llamáis"] }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, levantarse: [{ target: se }, " levantan"], llamarse: [{ target: se }, " llaman"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: se }, " serves ", { term: él }, ", ", { term: ella }, " and ", { term: usted }, ", and their plurals."]
              es: [{ term: se }, " sirve para ", { term: él }, ", ", { term: ella }, " y ", { term: usted }, ", y para sus plurales."]
              uk: [{ term: se }, " вживається з ", { term: él }, ", ", { term: ella }, " та ", { term: usted }, " і з їхньою множиною."]
          - type: note
            level: A1
            variety: es-419
            text:
              en: [{ term: ustedes }, " takes ", { term: se }, ", in formal and informal address:"]
              es: [{ term: ustedes }, " lleva ", { term: se }, ", también en el trato informal:"]
              uk: [{ term: ustedes }, " вживається з ", { term: se }, " і в офіційному, і в неофіційному звертанні:"]
            ex: ["¿A qué hora ", { target: se levantan }, " ustedes?"]
            tr: { en: What time do you get up?, uk: "О котрій ви встаєте?" }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " takes ", { term: os }, ":"]
              es: [{ term: vosotros }, " lleva ", { term: os }, ":"]
              uk: [{ term: vosotros }, " вживається з ", { term: os }, ":"]
            ex: ["¿Cómo ", { target: os llamáis }, "?"]
            tr: { en: What are your names?, uk: "Як вас звати?" }
          - type: rule
            level: A2
            text:
              en: "A stem change stays as in the present:"
              es: "El cambio en la raíz se mantiene, como en el presente:"
              uk: "Зміна в основі зберігається, як у теперішньому часі:"
            ex: [{ target: Me acuesto }, " tarde."]
            tr: { en: I go to bed late., uk: "Я пізно лягаю спати." }

  - title: { en: "Use: the daily routine", es: "Uso: la rutina diaria", uk: "Ужиток: розпорядок дня" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, verb: despertarse, ex: [{ target: Me despierto }, " a las seis."], tr: { en: I wake up at six., uk: "Я прокидаюся о шостій." } }
          - { level: A1, verb: levantarse, ex: [{ target: Me levanto }, " a las siete."], tr: { en: I get up at seven., uk: "Я встаю о сьомій." } }
          - { level: A1, verb: ducharse, ex: [{ target: Me ducho }, " por la mañana."], tr: { en: I have a shower in the morning., uk: "Я приймаю душ уранці." } }
          - { level: A2, verb: acostarse, ex: [{ target: Nos acostamos }, " tarde."], tr: { en: We go to bed late., uk: "Ми пізно лягаємо спати." } }
          - { level: A1, verb: llamarse, ex: ["Mi hermana ", { target: se llama }, " Elena."], tr: { en: My sister's name is Elena., uk: "Мою сестру звати Олена." } }
          - { level: A2, verb: vestirse, ex: [{ target: Me visto }, " rápido."], tr: { en: I get dressed quickly., uk: "Я швидко одягаюся." } }

  - title: { en: "Form: with an infinitive", es: "Forma: con infinitivo", uk: "Форма: з інфінітивом" }
    role: form
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "With an infinitive, the pronoun joins its end, or goes before the conjugated verb:"
              es: "Con un infinitivo, el pronombre se une a su final, o va delante del verbo conjugado:"
              uk: "З інфінітивом займенник приєднується до його кінця або стоїть перед дієсловом в особовій формі:"
            ex: { examples: [["Quiero ", { target: acostarme }, " temprano."], [{ target: Me }, " quiero acostar temprano."]] }
            tr: { en: { examples: [I want to go to bed early., I want to go to bed early.] }, uk: { examples: ["Я хочу рано лягти спати.", "Я хочу рано лягти спати."] } }
          - type: rule
            level: A2
            text:
              en: "The joined pronoun still matches the subject:"
              es: "El pronombre unido sigue concordando con el sujeto:"
              uk: "Приєднаний займенник так само відповідає підмету:"
            ex: ["Vamos a ", { target: sentarnos }, "."]
            tr: { en: "We're going to sit down.", uk: "Сядьмо." }
          - type: note
            level: A2
            text:
              en: ["A reflexive pronoun with an object pronoun: ", { link: Two Pronouns Together, to: es.pronombres.combinacion-pronombres }, "."]
              es: ["Un pronombre reflexivo con otro pronombre: ", { link: La combinación de pronombres, to: es.pronombres.combinacion-pronombres }, "."]
              uk: ["Зворотний займенник разом з іншим займенником: ", { link: "Два займенники разом: se lo", to: es.pronombres.combinacion-pronombres }, "."]

  - title: { en: Body and clothes, es: El cuerpo y la ropa, uk: Тіло та одяг }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["With body parts and clothes, a reflexive verb takes ", { alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }, ", not a possessive:"]
              es: ["Con las partes del cuerpo y la ropa, un verbo reflexivo lleva ", { alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }, ", no un posesivo:"]
              uk: ["З частинами тіла та одягом зворотне дієслово вживається з ", { alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }, ", а не з присвійним займенником:"]
            ex: [{ target: Me lavo }, " las manos."]
            tr: { en: I wash my hands., uk: "Я мию руки." }
          - type: rule
            level: A2
            text:
              en: [{ term: ponerse }, " is to put on, and ", { term: quitarse }, " to take off:"]
              es: [{ term: ponerse }, " es vestirse con algo, y ", { term: quitarse }, ", lo contrario:"]
              uk: [{ term: ponerse }, " — одягати, а ", { term: quitarse }, " — знімати:"]
            ex: { examples: [[{ target: Se pone }, " el abrigo."], [{ target: Se quita }, " los zapatos."]] }
            tr: { en: { examples: [She puts her coat on., He takes his shoes off.] }, uk: { examples: ["Вона одягає пальто.", "Він знімає черевики."] } }

  - title: { en: "Use: each other", es: "Uso: el valor recíproco", uk: "Ужиток: один одного" }
    role: use
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["In the plural, ", { alternatives: [{ term: nos }, { term: se }] }, " can say that two or more people do the action to each other:"]
              es: ["En plural, ", { alternatives: [{ term: nos }, { term: se }] }, " pueden indicar que dos o más personas hacen la acción una a la otra:"]
              uk: ["У множині ", { alternatives: [{ term: nos }, { term: se }] }, " можуть означати, що двоє чи більше людей роблять дію одне щодо одного:"]
            ex: { examples: [["Ana y Luis ", { target: se quieren }, " mucho."], [{ target: Nos vemos }, " todos los viernes."]] }
            tr: { en: { examples: [Ana and Luis love each other very much., We see each other every Friday.] }, uk: { examples: ["Ана й Луїс дуже кохають одне одного.", "Ми бачимося щоп’ятниці."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: el uno al otro }, " makes the meaning clear:"]
              es: [{ term: el uno al otro }, " aclara el sentido:"]
              uk: [{ term: el uno al otro }, " робить значення однозначним:"]
            ex: ["Los hermanos ", { target: se ayudan el uno al otro }, "."]
            tr: { en: The brothers help each other., uk: "Брати допомагають один одному." }
          - type: note
            level: B1
            variety: es-ES
            text:
              en: ["With ", { term: vosotros }, ", the pronoun is ", { term: os }, ":"]
              es: ["Con ", { term: vosotros }, ", el pronombre es ", { term: os }, ":"]
              uk: ["З ", { term: vosotros }, " займенник — ", { term: os }, ":"]
            ex: ["¿", { target: Os conocéis }, "?"]
            tr: { en: Do you know each other?, uk: "Ви знайомі?" }

  - title: { en: "Compare: with and without se", es: "Comparación: con se y sin se", uk: "Порівняння: із se і без se" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: plain, label: { en: Without se, es: Sin se, uk: Без se } }
          - { key: refl, label: { en: With se, es: Con se, uk: Із se } }
        rows:
          - level: A1
            plain: { ex: [{ target: Lavo }, " los platos."], tr: { en: I wash the dishes., uk: "Я мию посуд." } }
            refl: { ex: [{ target: Me lavo }, "."], tr: { en: I have a wash., uk: "Я вмиваюся." } }
          - level: A1
            plain: { ex: [{ target: Llamo }, " a mi madre."], tr: { en: I call my mother., uk: "Я телефоную мамі." } }
            refl: { ex: [{ target: Me llamo }, " Ana."], tr: { en: My name is Ana., uk: "Мене звати Ана." } }
          - level: A2
            plain: { ex: [{ target: Voy }, " a Lima."], tr: { en: "I'm going to Lima.", uk: "Я їду до Ліми." } }
            refl: { ex: [{ target: Me voy }, "."], tr: { en: "I'm leaving.", uk: "Я йду." } }
          - level: A2
            plain: { ex: [{ target: Duermo }, " ocho horas."], tr: { en: I sleep for eight hours., uk: "Я сплю вісім годин." } }
            refl: { ex: [{ target: Me duermo }, " en el sofá."], tr: { en: I fall asleep on the sofa., uk: "Я засинаю на дивані." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Llamo Ana., right: [{ target: Me llamo }, " Ana."], rule: { en: ["a name takes ", { term: llamarse }, ": ", { term: me llamo }], es: ["el nombre lleva ", { term: llamarse }, ": ", { term: me llamo }], uk: ["ім’я називають через ", { term: llamarse }, ": ", { term: me llamo }] } }
          - { level: A1, wrong: Yo se levanto a las siete., right: ["Yo ", { target: me levanto }, " a las siete."], rule: { en: ["the pronoun matches the subject: ", { term: yo me }], es: ["el pronombre concuerda con el sujeto: ", { term: yo me }], uk: ["займенник відповідає підмету: ", { term: yo me }] } }
          - { level: A1, wrong: Nosotros se acostamos tarde., right: ["Nosotros ", { target: nos acostamos }, " tarde."], rule: { en: [{ term: nosotros }, " takes ", { term: nos }], es: [{ term: nosotros }, " lleva ", { term: nos }], uk: [{ term: nosotros }, " вживається з ", { term: nos }] } }
          - { level: A2, wrong: Me lavo mis manos., right: ["Me lavo ", { target: las }, " manos."], rule: { en: ["body parts take ", { term: el }, " or ", { term: la }, ", not a possessive"], es: ["las partes del cuerpo llevan ", { term: el }, " o ", { term: la }, ", no un posesivo"], uk: ["частини тіла вживаються з ", { term: el }, " або ", { term: la }, ", а не з присвійним займенником"] } }
          - { level: A2, wrong: Quiero me acostar., right: ["Quiero ", { target: acostarme }, "."], rule: { en: ["the pronoun joins the infinitive, or goes before ", { term: quiero }], es: ["el pronombre se une al infinitivo, o va delante de ", { term: quiero }], uk: ["займенник приєднується до інфінітива або стоїть перед ", { term: quiero }] } }
