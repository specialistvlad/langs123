            id: ["pada bentuk jamak, ", { alternatives: [{ term: nos }, { term: se }] }, " dapat menyatakan tindakan timbal balik"]
            vi: ["ở số nhiều, ", { alternatives: [{ term: nos }, { term: se }] }, " có thể diễn tả hành động qua lại"]
          ex: ["Ana y Luis ", { target: se quieren }, " mucho."]
          tr: { en: Ana and Luis love each other very much., uk: "Ана й Луїс дуже люблять одне одного.", pt: "Ana e Luis se amam muito.", fr: "Ana et Luis s’aiment beaucoup.", de: "Ana und Luis lieben sich sehr.", it: "Ana e Luis si vogliono molto bene.", pl: "Ana i Luis bardzo się kochają.", tr: "Ana ile Luis birbirini çok seviyor.", id: "Ana dan Luis sangat saling menyayangi.", vi: "Ana và Luis rất yêu thương nhau." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A reflexive verb names an action the subject does to itself."
              es: "Un verbo reflexivo expresa una acción que el sujeto hace sobre sí mismo."
              uk: "Зворотне дієслово позначає дію, яку підмет спрямовує на себе."
              pt: "Um verbo reflexivo expressa uma ação que o sujeito faz sobre si mesmo."
              fr: "Un verbe pronominal exprime une action que le sujet fait sur lui-même."
              de: "Ein reflexives Verb drückt eine Handlung aus, die das Subjekt an sich selbst ausführt."
              it: "Un verbo riflessivo esprime un'azione che il soggetto compie su se stesso."
              pl: "Czasownik zwrotny wyraża czynność, którą podmiot wykonuje na sobie samym."
              tr: "Dönüşlü fiil, öznenin kendi üzerine yaptığı bir eylemi anlatır."
              id: "Kata kerja refleksif menyatakan tindakan yang dilakukan subjek pada dirinya sendiri."
              vi: "Động từ phản thân diễn tả hành động mà chủ ngữ làm cho chính mình."
          - type: rule
            level: A1
            text:
              en: ["Its infinitive ends in ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              es: ["Su infinitivo termina en ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              uk: ["Його інфінітив закінчується на ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              pt: ["O seu infinitivo termina em ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              fr: ["Son infinitif se termine par ", { term: se }, " : ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              de: ["Sein Infinitiv endet auf ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              it: ["Il suo infinito termina in ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              pl: ["Jego bezokolicznik kończy się na ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              tr: ["Mastarı ", { term: se }, " ile biter: ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              id: ["Infinitifnya berakhiran ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
              vi: ["Dạng nguyên mẫu của nó tận cùng bằng ", { term: se }, ": ", { alternatives: [{ term: levantarse }, { term: llamarse }, { term: ducharse }] }, "."]
          - type: rule
            level: A1
            text:
              en: "The verb takes its usual forms, and a pronoun for the person goes before it."
              es: "El verbo lleva sus formas de siempre, y delante va un pronombre de la persona."
              uk: "Дієслово має звичайні форми, а перед ним стоїть займенник відповідної особи."
              pt: "O verbo mantém as suas formas de sempre, e antes dele vem um pronome da pessoa."
              fr: "Le verbe garde ses formes habituelles, et un pronom de la personne se place devant lui."
              de: "Das Verb hat seine gewohnten Formen, und davor steht ein Pronomen der jeweiligen Person."
              it: "Il verbo ha le sue forme di sempre, e davanti va un pronome della persona."
              pl: "Czasownik ma swoje zwykłe formy, a przed nim stoi zaimek odpowiedniej osoby."
              tr: "Fiil her zamanki biçimlerini alır; önüne o kişiye uygun bir zamir gelir."
              id: "Kata kerja memakai bentuk biasanya, dan di depannya ada kata ganti untuk persona itu."
              vi: "Động từ giữ các dạng chia thông thường, và đứng trước nó là đại từ của ngôi tương ứng."
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["Many reflexive verbs need no “myself” in English: ", { term: me levanto }, " is “I get up”."]
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["Багато зворотних дієслів відповідають українським на «-ся»: ", { term: me lavo }, " — «я миюся». Але не всі: ", { term: me levanto }, " — «я встаю», а ", { term: estudio }, " — «я навчаюся»."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники", pt: "Forma: os pronomes", fr: "Forme : les pronoms", de: "Form: die Pronomen", it: "Forma: i pronomi", pl: "Forma: zaimki", tr: "Biçim: zamirler", id: "Bentuk: kata ganti", vi: "Dạng: các đại từ" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа, pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Persona", vi: "Ngôi" } }
          - { key: levantarse, label: levantarse }
          - { key: llamarse, label: llamarse }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, levantarse: [{ target: me }, " levanto"], llamarse: [{ target: me }, " llamo"] }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, levantarse: [{ target: te }, " levantas"], llamarse: [{ target: te }, " llamas"] }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, levantarse: [{ target: se }, " levanta"], llamarse: [{ target: se }, " llama"] }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, levantarse: [{ target: nos }, " levantamos"], llamarse: [{ target: nos }, " llamamos"] }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, levantarse: [{ target: os }, " levantáis"], llamarse: [{ target: os }, " llamáis"] }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, levantarse: [{ target: se }, " levantan"], llamarse: [{ target: se }, " llaman"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: se }, " serves ", { term: él }, ", ", { term: ella }, " and ", { term: usted }, ", and their plurals."]
              es: [{ term: se }, " sirve para ", { term: él }, ", ", { term: ella }, " y ", { term: usted }, ", y para sus plurales."]
              uk: [{ term: se }, " вживається з ", { term: él }, ", ", { term: ella }, " та ", { term: usted }, " і з їхньою множиною."]
              pt: [{ term: se }, " serve para ", { term: él }, ", ", { term: ella }, " e ", { term: usted }, ", e para os seus plurais."]
              fr: [{ term: se }, " sert pour ", { term: él }, ", ", { term: ella }, " et ", { term: usted }, ", ainsi que pour leurs pluriels."]
              de: [{ term: se }, " gilt für ", { term: él }, ", ", { term: ella }, " und ", { term: usted }, " sowie für ihre Pluralformen."]
              it: [{ term: se }, " vale per ", { term: él }, ", ", { term: ella }, " e ", { term: usted }, ", e per i loro plurali."]
              pl: [{ term: se }, " służy do ", { term: él }, ", ", { term: ella }, " i ", { term: usted }, " oraz do ich liczby mnogiej."]
              tr: [{ term: se }, ", ", { term: él }, ", ", { term: ella }, " ve ", { term: usted }, " ile bunların çoğulları için kullanılır."]
              id: [{ term: se }, " dipakai untuk ", { term: él }, ", ", { term: ella }, " dan ", { term: usted }, ", serta untuk bentuk jamaknya."]
              vi: [{ term: se }, " dùng cho ", { term: él }, ", ", { term: ella }, " và ", { term: usted }, ", cũng như cho số nhiều của chúng."]
          - type: note
            level: A1
            variety: es-419
            text:
              en: [{ term: ustedes }, " takes ", { term: se }, ", in formal and informal address:"]
              es: [{ term: ustedes }, " lleva ", { term: se }, ", también en el trato informal:"]
              uk: [{ term: ustedes }, " вживається з ", { term: se }, " і в офіційному, і в неофіційному звертанні:"]
              pt: [{ term: ustedes }, " leva ", { term: se }, ", também no tratamento informal:"]
              fr: [{ term: ustedes }, " prend ", { term: se }, ", aussi dans un échange informel :"]
              de: [{ term: ustedes }, " steht mit ", { term: se }, ", auch in der informellen Anrede:"]
              it: [{ term: ustedes }, " vuole ", { term: se }, ", anche nel trattamento informale:"]
              pl: [{ term: ustedes }, " łączy się z ", { term: se }, ", także w nieformalnym zwracaniu się:"]
              tr: [{ term: ustedes }, " ile ", { term: se }, " kullanılır; resmî olmayan hitapta da böyledir:"]
              id: [{ term: ustedes }, " memakai ", { term: se }, ", juga dalam sapaan tidak formal:"]
              vi: [{ term: ustedes }, " đi với ", { term: se }, ", cả khi xưng hô thân mật:"]
            ex: ["¿A qué hora ", { target: se levantan }, " ustedes?"]
            tr: { en: What time do you get up?, uk: "О котрій ви встаєте?", pt: "A que horas vocês se levantam?", fr: "À quelle heure vous levez-vous ?", de: "Um wie viel Uhr steht ihr auf?", it: "A che ora vi alzate?", pl: "O której wstajecie?", tr: "Saat kaçta kalkıyorsunuz?", id: "Kalian bangun jam berapa?", vi: "Các bạn dậy lúc mấy giờ?" }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " takes ", { term: os }, ":"]
              es: [{ term: vosotros }, " lleva ", { term: os }, ":"]
              uk: [{ term: vosotros }, " вживається з ", { term: os }, ":"]
              pt: [{ term: vosotros }, " leva ", { term: os }, ":"]
              fr: [{ term: vosotros }, " prend ", { term: os }, " :"]
              de: [{ term: vosotros }, " steht mit ", { term: os }, ":"]
              it: [{ term: vosotros }, " vuole ", { term: os }, ":"]
              pl: [{ term: vosotros }, " łączy się z ", { term: os }, ":"]
              tr: [{ term: vosotros }, " ile ", { term: os }, " kullanılır:"]
              id: [{ term: vosotros }, " memakai ", { term: os }, ":"]
              vi: [{ term: vosotros }, " đi với ", { term: os }, ":"]
            ex: ["¿Cómo ", { target: os llamáis }, "?"]
            tr: { en: What are your names?, uk: "Як вас звати?", pt: "Como vocês se chamam?", fr: "Comment vous appelez-vous ?", de: "Wie heißt ihr?", it: "Come vi chiamate?", pl: "Jak macie na imię?", tr: "Adlarınız ne?", id: "Siapa nama kalian?", vi: "Tên các bạn là gì?" }
          - type: rule
            level: A2
            text:
              en: "A stem change stays as in the present:"
              es: "El cambio en la raíz se mantiene, como en el presente:"
              uk: "Зміна в основі зберігається, як у теперішньому часі:"
              pt: "A mudança no radical se mantém, como no presente:"
              fr: "Le changement de radical se maintient, comme au présent :"
              de: "Der Stammwechsel bleibt erhalten, wie im Präsens:"
              it: "Il cambio di radice resta, come al presente:"
              pl: "Zmiana tematu zostaje, tak jak w czasie teraźniejszym:"
              tr: "Kök değişikliği şimdiki zamandaki gibi korunur:"
              id: "Perubahan akar kata tetap ada, seperti pada presente:"
              vi: "Sự đổi gốc động từ được giữ nguyên, như ở thì hiện tại:"
            ex: [{ target: Me acuesto }, " tarde."]
            tr: { en: I go to bed late., uk: "Я пізно лягаю спати.", pt: "Eu vou dormir tarde.", fr: "Je me couche tard.", de: "Ich gehe spät ins Bett.", it: "Vado a letto tardi.", pl: "Kładę się późno spać.", tr: "Geç yatıyorum.", id: "Saya tidur larut malam.", vi: "Tôi đi ngủ muộn." }

  - title: { en: "Use: the daily routine", es: "Uso: la rutina diaria", uk: "Ужиток: розпорядок дня", pt: "Uso: a rotina diária", fr: "Emploi : la routine quotidienne", de: "Gebrauch: der Tagesablauf", it: "Uso: la routine quotidiana", pl: "Użycie: plan dnia", tr: "Kullanım: günlük rutin", id: "Penggunaan: rutinitas harian", vi: "Cách dùng: sinh hoạt hằng ngày" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, verb: despertarse, ex: [{ target: Me despierto }, " a las seis."], tr: { en: I wake up at six., uk: "Я прокидаюся о шостій.", pt: "Eu acordo às seis.", fr: "Je me réveille à six heures.", de: "Ich wache um sechs Uhr auf.", it: "Mi sveglio alle sei.", pl: "Budzę się o szóstej.", tr: "Saat altıda uyanıyorum.", id: "Saya bangun tidur pukul enam.", vi: "Tôi thức dậy lúc sáu giờ." } }
          - { level: A1, verb: levantarse, ex: [{ target: Me levanto }, " a las siete."], tr: { en: I get up at seven., uk: "Я встаю о сьомій.", pt: "Eu me levanto às sete.", fr: "Je me lève à sept heures.", de: "Ich stehe um sieben Uhr auf.", it: "Mi alzo alle sette.", pl: "Wstaję o siódmej.", tr: "Saat yedide kalkıyorum.", id: "Saya bangun dari tempat tidur pukul tujuh.", vi: "Tôi ra khỏi giường lúc bảy giờ." } }
          - { level: A1, verb: ducharse, ex: [{ target: Me ducho }, " por la mañana."], tr: { en: I have a shower in the morning., uk: "Я приймаю душ уранці.", pt: "Eu tomo banho de manhã.", fr: "Je prends une douche le matin.", de: "Ich dusche morgens.", it: "Faccio la doccia la mattina.", pl: "Rano biorę prysznic.", tr: "Sabahları duş alıyorum.", id: "Saya mandi di pagi hari.", vi: "Buổi sáng tôi tắm." } }
          - { level: A2, verb: acostarse, ex: [{ target: Nos acostamos }, " tarde."], tr: { en: We go to bed late., uk: "Ми пізно лягаємо спати.", pt: "Nós vamos dormir tarde.", fr: "Nous nous couchons tard.", de: "Wir gehen spät ins Bett.", it: "Andiamo a letto tardi.", pl: "Kładziemy się późno spać.", tr: "Geç yatıyoruz.", id: "Kami tidur larut malam.", vi: "Chúng tôi đi ngủ muộn." } }
          - { level: A1, verb: llamarse, ex: ["Mi hermana ", { target: se llama }, " Elena."], tr: { en: My sister's name is Elena., uk: "Мою сестру звати Елена.", pt: "Minha irmã se chama Elena.", fr: "Ma sœur s’appelle Elena.", de: "Meine Schwester heißt Elena.", it: "Mia sorella si chiama Elena.", pl: "Moja siostra ma na imię Elena.", tr: "Kız kardeşimin adı Elena.", id: "Nama saudara perempuan saya Elena.", vi: "Chị gái tôi tên là Elena." } }
          - { level: A2, verb: vestirse, ex: [{ target: Me visto }, " rápido."], tr: { en: I get dressed quickly., uk: "Я швидко одягаюся.", pt: "Eu me visto rápido.", fr: "Je m’habille vite.", de: "Ich ziehe mich schnell an.", it: "Mi vesto in fretta.", pl: "Ubieram się szybko.", tr: "Çabuk giyiniyorum.", id: "Saya berpakaian dengan cepat.", vi: "Tôi mặc quần áo nhanh." } }

  - title: { en: "Form: with an infinitive", es: "Forma: con infinitivo", uk: "Форма: з інфінітивом", pt: "Forma: com infinitivo", fr: "Forme : avec un infinitif", de: "Form: mit Infinitiv", it: "Forma: con l'infinito", pl: "Forma: z bezokolicznikiem", tr: "Biçim: mastarla", id: "Bentuk: dengan infinitif", vi: "Dạng: với động từ nguyên mẫu" }
    role: form
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "With an infinitive, the pronoun joins its end, or goes before the conjugated verb:"
              es: "Con un infinitivo, el pronombre se une a su final, o va delante del verbo conjugado:"
              uk: "З інфінітивом займенник приєднується до його кінця або стоїть перед дієсловом в особовій формі:"
              pt: "Com um infinitivo, o pronome se junta ao final dele, ou vem antes do verbo conjugado:"
              fr: "Avec un infinitif, le pronom se joint à sa fin ou se place devant le verbe conjugué :"
              de: "Bei einem Infinitiv wird das Pronomen an sein Ende gehängt oder steht vor dem konjugierten Verb:"
              it: "Con un infinito, il pronome si unisce alla sua fine, oppure va davanti al verbo coniugato:"
              pl: "Przy bezokoliczniku zaimek łączy się z jego końcem albo stoi przed czasownikiem w formie osobowej:"
              tr: "Mastarla birlikte zamir, mastarın sonuna eklenir ya da çekimli fiilin önüne gelir:"
              id: "Dengan infinitif, kata ganti digabung di akhirnya, atau diletakkan sebelum kata kerja yang dikonjugasi:"
              vi: "Với động từ nguyên mẫu, đại từ gắn vào cuối nó, hoặc đứng trước động từ đã chia:"
            ex: { examples: [["Quiero ", { target: acostarme }, " temprano."], [{ target: Me }, " quiero acostar temprano."]] }
            tr: { en: { examples: [I want to go to bed early., I want to go to bed early.] }, uk: { examples: ["Я хочу рано лягти спати.", "Я хочу рано лягти спати."] }, pt: { examples: ["Quero ir dormir cedo.", "Quero ir dormir cedo."] }, fr: { examples: ["Je veux me coucher tôt.", "Je veux me coucher tôt."] }, de: { examples: ["Ich will früh ins Bett gehen.", "Ich will früh ins Bett gehen."] }, it: { examples: ["Voglio andare a letto presto.", "Voglio andare a letto presto."] }, pl: { examples: ["Chcę wcześnie położyć się spać.", "Chcę wcześnie położyć się spać."] }, tr: { examples: ["Erken yatmak istiyorum.", "Erken yatmak istiyorum."] }, id: { examples: ["Saya ingin tidur lebih awal.", "Saya ingin tidur lebih awal."] }, vi: { examples: ["Tôi muốn đi ngủ sớm.", "Tôi muốn đi ngủ sớm."] } }
          - type: rule
            level: A2
            text:
              en: "The joined pronoun still matches the subject:"
              es: "El pronombre unido sigue concordando con el sujeto:"
              uk: "Приєднаний займенник так само відповідає підмету:"
              pt: "O pronome junto continua concordando com o sujeito:"
              fr: "Le pronom joint s’accorde toujours avec le sujet :"
              de: "Das angehängte Pronomen passt weiterhin zum Subjekt:"
              it: "Il pronome unito concorda ancora con il soggetto:"
              pl: "Dołączony zaimek nadal zgadza się z podmiotem:"
              tr: "Eklenen zamir yine özneye uyar:"
              id: "Kata ganti yang digabung tetap cocok dengan subjek:"
              vi: "Đại từ gắn vào vẫn khớp với chủ ngữ:"
            ex: ["Vamos a ", { target: sentarnos }, "."]
            tr: { en: "We're going to sit down.", uk: "Сядьмо.", pt: "Vamos nos sentar.", fr: "Asseyons-nous.", de: "Setzen wir uns.", it: "Sediamoci.", pl: "Usiądźmy.", tr: "Oturalım.", id: "Ayo kita duduk.", vi: "Chúng ta ngồi xuống nhé." }
          - type: note
            level: A2
            text:
              en: ["A reflexive pronoun with an object pronoun: ", { link: Two Pronouns Together, to: es.pronombres.combinacion-pronombres }, "."]
              es: ["Un pronombre reflexivo con otro pronombre: ", { link: La combinación de pronombres, to: es.pronombres.combinacion-pronombres }, "."]
              uk: ["Зворотний займенник разом з іншим займенником: ", { link: "Два займенники разом: se lo", to: es.pronombres.combinacion-pronombres }, "."]
              pt: ["Um pronome reflexivo com outro pronome: ", { link: "A combinação de pronomes", to: es.pronombres.combinacion-pronombres }, "."]
              fr: ["Un pronom réfléchi avec un autre pronom : ", { link: "La combinaison des pronoms", to: es.pronombres.combinacion-pronombres }, "."]
