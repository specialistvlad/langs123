title: { en: "Present Tense: Irregular Verbs", es: "El presente: verbos irregulares", uk: "Теперішній час: неправильні дієслова", pt: "O presente: verbos irregulares", fr: "Le présent : verbes irréguliers", de: "Das Präsens: unregelmäßige Verben", it: "Il presente: verbi irregolari", pl: "Czas teraźniejszy: czasowniki nieregularne", tr: "Presente: düzensiz fiiller", id: "Presente: kata kerja tidak beraturan", vi: "Thì hiện tại: động từ bất quy tắc" }
summary:
  lead:
    en: ["Some verbs change the vowel of their stem (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), some change only ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), and ", { term: ir }, " is irregular throughout."]
    es: ["Unos verbos cambian la vocal de la raíz (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), otros solo la forma de ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), e ", { term: ir }, " es irregular en todo."]
    uk: ["Одні дієслова змінюють голосний в основі (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), інші — лише форму ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), а ", { term: ir }, " неправильне в усіх формах."]
    pt: ["Alguns verbos mudam a vogal do radical (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), outros mudam só a forma de ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), e ", { term: ir }, " é irregular em todas as formas."]
    fr: ["Certains verbes changent la voyelle du radical (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), d’autres seulement la forme de ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), et ", { term: ir }, " est irrégulier partout."]
    de: ["Manche Verben ändern den Vokal des Stamms (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), andere nur die Form von ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), und ", { term: ir }, " ist durchgehend unregelmäßig."]
    it: ["Alcuni verbi cambiano la vocale della radice (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), altri solo la forma di ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), e ", { term: ir }, " è irregolare in tutte le forme."]
    pl: ["Niektóre czasowniki zmieniają samogłoskę tematu (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), inne tylko formę ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), a ", { term: ir }, " jest nieregularny we wszystkich formach."]
    tr: ["Bazı fiillerde kökteki ünlü değişir (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), bazılarında yalnızca ", { term: yo }, " biçimi değişir (", { term: hago }, ", ", { term: conozco }, "), ", { term: ir }, " ise bütün biçimlerde düzensizdir."]
    id: ["Sebagian kata kerja mengubah vokal akar kata (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), sebagian hanya bentuk ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), dan ", { term: ir }, " tidak beraturan di semua bentuk."]
    vi: ["Một số động từ đổi nguyên âm ở gốc từ (", { term: quiero }, ", ", { term: puedo }, ", ", { term: pido }, "), một số khác chỉ đổi dạng ", { term: yo }, " (", { term: hago }, ", ", { term: conozco }, "), còn ", { term: ir }, " bất quy tắc ở mọi dạng."]
  rule:
    en: ["The stem vowel changes only where the stress falls on it, so ", { term: nosotros }, " keeps it:"]
    es: ["La vocal de la raíz cambia solo cuando lleva el acento, por eso ", { term: nosotros }, " la conserva:"]
    uk: ["Голосний основи змінюється лише під наголосом, тож ", { term: nosotros }, " його зберігає:"]
    pt: ["A vogal do radical muda só quando leva o acento, por isso ", { term: nosotros }, " a conserva:"]
    fr: ["La voyelle du radical ne change que sous l’accent, donc ", { term: nosotros }, " la garde :"]
    de: ["Der Stammvokal ändert sich nur unter der Betonung, deshalb behält ", { term: nosotros }, " ihn:"]
    it: ["La vocale della radice cambia solo quando porta l’accento, perciò ", { term: nosotros }, " la conserva:"]
    pl: ["Samogłoska tematu zmienia się tylko pod akcentem, dlatego ", { term: nosotros }, " ją zachowuje:"]
    tr: ["Kökteki ünlü yalnızca vurgu aldığında değişir, bu yüzden ", { term: nosotros }, " onu korur:"]
    id: ["Vokal akar kata berubah hanya jika menerima tekanan, karena itu ", { term: nosotros }, " mempertahankannya:"]
    vi: ["Nguyên âm ở gốc từ chỉ đổi khi mang trọng âm, nên ", { term: nosotros }, " giữ nguyên nó:"]
  ex: { examples: [[{ target: Quiero }, " café."], [{ target: Queremos }, " café."]] }

