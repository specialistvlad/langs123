            text:
              en: [{ term: decir }, " takes ", { term: digo }, " and changes ", { term: e }, " to ", { term: i }, ": ", { alternatives: [{ term: digo }, { term: dices }, { term: dice }, { term: decimos }, { term: dicen }] }, "."]
              es: [{ term: decir }, " lleva ", { term: digo }, " y cambia ", { term: e }, " por ", { term: i }, ": ", { alternatives: [{ term: digo }, { term: dices }, { term: dice }, { term: decimos }, { term: dicen }] }, "."]
              uk: [{ term: decir }, " має ", { term: digo }, " і змінює ", { term: e }, " на ", { term: i }, ": ", { alternatives: [{ term: digo }, { term: dices }, { term: dice }, { term: decimos }, { term: dicen }] }, "."]
