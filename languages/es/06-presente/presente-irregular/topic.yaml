              uk: ["Більшість дієслів на ", { term: "-ecer" }, ", ", { term: "-ocer" }, " та ", { term: "-ucir" }, " мають у формі ", { term: yo }, " закінчення ", { term: "-zco" }, ": ", { alternatives: [{ term: parezco }, { term: conozco }, { term: conduzco }] }, "."]
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: tener, label: tener }
          - { key: venir, label: venir }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, tener: ["ten", { letter: g }, "o"], venir: ["ven", { letter: g }, "o"] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, tener: ["t", { letter: ie }, "nes"], venir: ["v", { letter: ie }, "nes"] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, tener: ["t", { letter: ie }, "ne"], venir: ["v", { letter: ie }, "ne"] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, tener: tenemos, venir: venimos }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, tener: tenéis, venir: venís }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, tener: ["t", { letter: ie }, "nen"], venir: ["v", { letter: ie }, "nen"] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tener }, " and ", { term: venir }, " take ", { term: "-go" }, " in ", { term: yo }, " and ", { term: ie }, " in the other stressed forms:"]
              es: [{ term: tener }, " y ", { term: venir }, " llevan ", { term: "-go" }, " en ", { term: yo }, " e ", { term: ie }, " en las demás formas tónicas:"]
              uk: [{ term: tener }, " та ", { term: venir }, " мають ", { term: "-go" }, " у формі ", { term: yo }, " та ", { term: ie }, " в інших наголошених формах:"]
