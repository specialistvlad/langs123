              uk: ["Дієслова на ", { term: "-uir" }, " додають ", { term: "y" }, " перед закінченням, що починається на ", { term: a }, ", ", { term: e }, " або ", { term: o }, ": ", { alternatives: [{ term: construyo }, { term: construyes }, { term: construye }, { term: construyen }] }, "; ", { term: nosotros }, " зберігає форму ", { term: construimos }, "."]
            ex: [{ target: Construyen }, " un hotel."]
            tr: { en: "They're building a hotel.", uk: "Вони будують готель." }
          - type: rule
            level: A2
            text:
              en: [{ term: seguir }, " drops the ", { term: u }, " in ", { term: yo }, ", ", { term: sigo }, ", and ", { term: elegir }, " writes ", { term: j }, ", ", { term: elijo }, ", to keep the sound:"]
              es: [{ term: seguir }, " pierde la ", { term: u }, " en ", { term: yo }, ", ", { term: sigo }, ", y ", { term: elegir }, " escribe ", { term: j }, ", ", { term: elijo }, ", para mantener el sonido:"]
              uk: [{ term: seguir }, " втрачає ", { term: u }, " у формі ", { term: yo }, ", ", { term: sigo }, ", а ", { term: elegir }, " пише ", { term: j }, ", ", { term: elijo }, ", щоб зберегти звук:"]
            ex: [{ target: Elijo }, " el rojo."]
            tr: { en: "I'll take the red one.", uk: "Я беру червоний." }

