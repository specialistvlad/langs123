            level: A2
            text:
              en: ["Verbs in ", { term: "-uir" }, " add ", { term: "y" }, " before an ending that starts with ", { term: a }, ", ", { term: e }, " or ", { term: o }, ": ", { alternatives: [{ term: construyo }, { term: construyes }, { term: construye }, { term: construyen }] }, "; ", { term: nosotros }, " keeps ", { term: construimos }, "."]
