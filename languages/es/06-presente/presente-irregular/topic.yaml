              pl: [{ term: ir }, " jest nieregularny we wszystkich osobach: ", { alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, "."]
              tr: [{ term: ir }, " fiili bütün kişilerde düzensizdir: ", { alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, "."]
              id: [{ term: ir }, " tidak beraturan pada semua orang: ", { alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, "."]
              vi: [{ term: ir }, " bất quy tắc ở mọi ngôi: ", { alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, "."]
            ex: [{ target: Voy }, " a clase."]
            tr: { en: "I'm going to class.", uk: "Я йду на заняття.", pt: "Vou para a aula.", fr: "Je vais en cours.", de: "Ich gehe zum Unterricht.", it: "Vado a lezione.", pl: "Idę na zajęcia.", tr: "Derse gidiyorum.", id: "Saya pergi ke kelas.", vi: "Tôi đến lớp." }
          - type: rule
            level: A2
            text:
              en: "An irregular verb takes the regular endings; its stem changes."
              es: "Un verbo irregular lleva las terminaciones regulares; lo que cambia es la raíz."
              uk: "Неправильне дієслово бере правильні закінчення; змінюється його основа."
              pt: "Um verbo irregular leva as terminações regulares; o que muda é o radical."
              fr: "Un verbe irrégulier garde les terminaisons régulières ; c’est le radical qui change."
              de: "Ein unregelmäßiges Verb hat die regelmäßigen Endungen; geändert wird der Stamm."
              it: "Un verbo irregolare ha le desinenze regolari; ciò che cambia è la radice."
              pl: "Czasownik nieregularny ma regularne końcówki; zmienia się jego temat."
              tr: "Düzensiz bir fiil düzenli ekleri alır; değişen köktür."
              id: "Kata kerja tidak beraturan memakai akhiran yang beraturan; yang berubah adalah akar katanya."
              vi: "Động từ bất quy tắc dùng đuôi chia theo quy tắc; thứ thay đổi là gốc từ."
          - type: rule
            level: A2
            text:
              en: "A stem-changing verb changes the last vowel of its stem where the stress falls on it."
              es: "Un verbo con cambio vocálico cambia la última vocal de la raíz cuando lleva el acento."
              uk: "Дієслово зі зміною основи змінює останній голосний основи, коли на нього падає наголос."
              pt: "Um verbo com mudança vocálica muda a última vogal do radical quando ela leva o acento."
              fr: "Un verbe à changement vocalique modifie la dernière voyelle du radical quand elle porte l’accent."
              de: "Ein Verb mit Stammvokalwechsel ändert den letzten Vokal des Stamms, wenn er betont ist."
              it: "Un verbo con cambio vocalico modifica l’ultima vocale della radice quando porta l’accento."
              pl: "Czasownik ze zmianą samogłoski zmienia ostatnią samogłoskę tematu, gdy pada na nią akcent."
              tr: "Ünlüsü değişen fiil, kökünün son ünlüsünü vurgu üzerine düştüğünde değiştirir."
              id: "Kata kerja dengan perubahan vokal mengubah vokal terakhir akar katanya saat vokal itu bertekanan."
              vi: "Động từ đổi nguyên âm thay nguyên âm cuối của gốc từ khi nó mang trọng âm."
          - type: rule
            level: A2
