              es: ["Otros dos verbos irregulares en todo: ", { link: Ser y estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              uk: ["Ще два дієслова, неправильні в усіх формах: ", { link: "Ser і estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
