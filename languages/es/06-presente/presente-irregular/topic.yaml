          - { level: A2, use: { en: Sleepiness and fear, es: El sueño y el miedo, uk: Сонливість і страх }, ex: { examples: [[{ target: Tengo sueño }, "."], [{ target: Tengo miedo }, "."]] }, tr: { en: { examples: ["I'm sleepy.", "I'm scared."] }, uk: { examples: ["Я хочу спати.", "Мені страшно."] } } }
