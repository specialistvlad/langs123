          - type: rule
            level: A2
            text:
              en: ["Most verbs in ", { term: "-ecer" }, ", ", { term: "-ocer" }, " and ", { term: "-ucir" }, " take ", { term: "-zco" }, " in ", { term: yo }, ": ", { alternatives: [{ term: parezco }, { term: conozco }, { term: conduzco }] }, "."]
