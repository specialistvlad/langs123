id: es.presente.estar-gerundio
lang: es
kind: grammar
tags: [verbs, present, gerund, progressive]
concepts: [continuous]
related: [es.presente.presente-regular, es.ser-estar-hay-gustar.ser-estar, es.imperativo-perifrasis.perifrasis-aspectuales, es.presente.verbos-reflexivos, es.futuro-condicional.ir-a-infinitivo]
status: { en: draft, es: draft, uk: draft }
translated: { en: "fcf9d9 1b4b5d 2dd003 7991c6 6fb998 21e3ce 8a5623 4fe999 bca8fe bfe0e2", uk: "fcf9d9 1b4b5d 2dd003 7991c6 6fb998 21e3ce 8a5623 4fe999 bca8fe bfe0e2" }

title: { en: "Present Continuous: estoy comiendo", es: "Estar con gerundio: estoy comiendo", uk: "Estar з герундієм: estoy comiendo" }
summary:
  lead:
    en: [{ term: Estar }, " with a gerund in ", { term: "-ando" }, " or ", { term: "-iendo" }, " describes an action in progress right now: ", { term: estoy comiendo }, "."]
    es: [{ term: Estar }, " con un gerundio en ", { term: "-ando" }, " o ", { term: "-iendo" }, " expresa una acción en curso en este momento: ", { term: estoy comiendo }, "."]
    uk: [{ term: Estar }, " з герундієм на ", { term: "-ando" }, " або ", { term: "-iendo" }, " описує дію, що триває саме зараз: ", { term: estoy comiendo }, "."]
  rule:
    en: ["Verbs in ", { term: "-ar" }, " take ", { term: "-ando" }, ", and verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " take ", { term: "-iendo" }, ":"]
    es: ["Los verbos en ", { term: "-ar" }, " llevan ", { term: "-ando" }, ", y los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, ", ", { term: "-iendo" }, ":"]
    uk: ["Дієслова на ", { term: "-ar" }, " беруть ", { term: "-ando" }, ", а дієслова на ", { term: "-er" }, " та ", { term: "-ir" }, " — ", { term: "-iendo" }, ":"]
  ex: { examples: [["Ana ", { target: está hablando }, " por teléfono."], ["Los niños ", { target: están comiendo }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: герундій } }] }
            es: { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: герундій } }] }
            uk: { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: герундій } }] }
          ex: [{ target: Estoy trabajando }, "."]
          tr: { en: "I'm working.", uk: "Я працюю." }
        - level: A2
          point: { en: Gerund, es: Gerundio, uk: Герундій }
          rule:
            en: { mapping: [{ term: hablar }, { term: hablando }] }
            es: { mapping: [{ term: hablar }, { term: hablando }] }
            uk: { mapping: [{ term: hablar }, { term: hablando }] }
          ex: ["Ana ", { target: está hablando }, " por teléfono."]
          tr: { en: Ana is on the phone., uk: "Ана розмовляє телефоном." }
        - level: A2
          point: { en: Gerund, es: Gerundio, uk: Герундій }
          rule:
            en: [{ mapping: [{ term: comer }, { term: comiendo }] }, ", ", { mapping: [{ term: vivir }, { term: viviendo }] }]
            es: [{ mapping: [{ term: comer }, { term: comiendo }] }, ", ", { mapping: [{ term: vivir }, { term: viviendo }] }]
            uk: [{ mapping: [{ term: comer }, { term: comiendo }] }, ", ", { mapping: [{ term: vivir }, { term: viviendo }] }]
          ex: [{ target: Estamos comiendo }, "."]
          tr: { en: "We're eating.", uk: "Ми їмо." }
        - level: A2
          point: { en: Gerund, es: Gerundio, uk: Герундій }
          rule:
            en: [{ mapping: [{ term: leer }, { term: leyendo }] }, ", ", { mapping: [{ term: oír }, { term: oyendo }] }]
            es: [{ mapping: [{ term: leer }, { term: leyendo }] }, ", ", { mapping: [{ term: oír }, { term: oyendo }] }]
            uk: [{ mapping: [{ term: leer }, { term: leyendo }] }, ", ", { mapping: [{ term: oír }, { term: oyendo }] }]
          ex: [{ target: Estoy leyendo }, " un libro."]
          tr: { en: "I'm reading a book.", uk: "Я читаю книжку." }
        - level: A2
          point: { en: Gerund, es: Gerundio, uk: Герундій }
          rule:
            en: [{ mapping: [{ term: dormir }, { term: durmiendo }] }, ", ", { mapping: [{ term: decir }, { term: diciendo }] }]
            es: [{ mapping: [{ term: dormir }, { term: durmiendo }] }, ", ", { mapping: [{ term: decir }, { term: diciendo }] }]
            uk: [{ mapping: [{ term: dormir }, { term: durmiendo }] }, ", ", { mapping: [{ term: decir }, { term: diciendo }] }]
          ex: ["El bebé ", { target: está durmiendo }, "."]
          tr: { en: The baby is sleeping., uk: "Малюк спить." }
        - level: A2
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "an action in progress now"
            es: "una acción en curso ahora"
            uk: "дія, що триває зараз"
          ex: ["¿Qué ", { target: estás haciendo }, "?"]
          tr: { en: What are you doing?, uk: "Що ти робиш?" }
        - level: A2
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "a situation for a limited time"
            es: "una situación por un tiempo limitado"
            uk: "ситуація на обмежений час"
          ex: ["Este año ", { target: estoy estudiando }, " inglés."]
          tr: { en: "I'm studying English this year.", uk: "Цього року я вчу англійську." }
        - level: A2
          point: { en: Pronouns, es: Pronombres, uk: Займенники }
          rule:
            en: ["before ", { term: estar }, ", or joined to the gerund"]
            es: ["delante de ", { term: estar }, ", o unido al gerundio"]
            uk: ["перед ", { term: estar }, " або приєднані до герундія"]
          ex: { examples: [[{ target: Me estoy vistiendo }, "."], [{ target: Estoy vistiéndome }, "."]] }
          tr: { en: { examples: ["I'm getting dressed.", "I'm getting dressed."] }, uk: { examples: ["Я одягаюся.", "Я одягаюся."] } }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: "routines take the present"
            es: "las rutinas llevan el presente"
            uk: "для звичних дій — теперішній час"
          ex: ["Todos los días ", { target: trabajo }, " ocho horas."]
          tr: { en: I work eight hours every day., uk: "Щодня я працюю вісім годин." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["plans take the present or ", { term: ir a }]
            es: ["los planes llevan el presente o ", { term: ir a }]
            uk: ["для планів — теперішній час або ", { term: ir a }]
          ex: ["Mañana ", { target: salgo }, " para Lima."]
          tr: { en: "I'm leaving for Lima tomorrow.", uk: "Завтра я їду до Ліми." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: estar }, " in the present with a gerund names an action in progress now:"]
              es: [{ term: estar }, " en presente con un gerundio expresa una acción en curso ahora:"]
              uk: [{ term: estar }, " у теперішньому часі з герундієм називає дію, що триває зараз:"]
            ex: [{ target: Estoy cocinando }, "."]
            tr: { en: "I'm cooking.", uk: "Я готую їсти." }
          - type: rule
            level: A2
            text:
              en: ["The gerund never changes; only ", { term: estar }, " changes with the person."]
              es: ["El gerundio no cambia nunca; solo ", { term: estar }, " cambia con la persona."]
              uk: ["Герундій ніколи не змінюється; за особами змінюється лише ", { term: estar }, "."]
          - type: note
            level: A2
            text:
              en: ["The forms of ", { term: estar }, ": ", { link: Ser and Estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Las formas de ", { term: estar }, ": ", { link: Ser y estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              uk: ["Форми ", { term: estar }, ": ", { link: "Ser і estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
          - type: note
            level: A2
            text:
              en: ["Other verbs with a gerund, such as ", { term: seguir }, ": ", { link: Verb Phrases, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              es: ["Otros verbos con gerundio, como ", { term: seguir }, ": ", { link: Las perífrasis, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              uk: ["Інші дієслова з герундієм, як-от ", { term: seguir }, ": ", { link: Дієслівні перифрази, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]

  - title: { en: "Form: estar with the gerund", es: "Forma: estar con gerundio", uk: "Форма: estar з герундієм" }
    role: form
    features: { tense: prs, aspect: prog }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: pos, label: { en: Statement, es: Afirmación, uk: Ствердження } }
          - { key: neg, label: { en: Negative, es: Negación, uk: Заперечення } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, pos: [{ aux: estoy }, " ", { target: trabajando }], neg: ["no ", { aux: estoy }, " ", { target: trabajando }] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, pos: [{ aux: estás }, " ", { target: trabajando }], neg: ["no ", { aux: estás }, " ", { target: trabajando }] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, pos: [{ aux: está }, " ", { target: trabajando }], neg: ["no ", { aux: está }, " ", { target: trabajando }] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, pos: [{ aux: estamos }, " ", { target: trabajando }], neg: ["no ", { aux: estamos }, " ", { target: trabajando }] }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, pos: [{ aux: estáis }, " ", { target: trabajando }], neg: ["no ", { aux: estáis }, " ", { target: trabajando }] }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, pos: [{ aux: están }, " ", { target: trabajando }], neg: ["no ", { aux: están }, " ", { target: trabajando }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A question keeps the same words between ¿ and ?:"
              es: "Una pregunta mantiene las mismas palabras entre ¿ y ?:"
              uk: "У питанні ті самі слова стоять між ¿ і ?:"
            ex: ["¿", { target: Estás trabajando }, "?"]
            tr: { en: Are you working?, uk: "Ти працюєш?" }

  - title: { en: "Form: the gerund", es: "Forma: el gerundio", uk: "Форма: герундій" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: Форма } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, form: { mapping: [{ term: "-ar" }, { term: "-ando" }] }, ex: ["Pedro ", { target: está estudiando }, "."], tr: { en: Pedro is studying., uk: "Педро вчиться." } }
          - { level: A2, form: { mapping: [{ term: "-er" }, { term: "-iendo" }] }, ex: ["¿", { target: Estás bebiendo }, " agua?"], tr: { en: Are you drinking water?, uk: "Ти п’єш воду?" } }
          - { level: A2, form: { mapping: [{ term: "-ir" }, { term: "-iendo" }] }, ex: [{ target: Estamos escribiendo }, " un correo."], tr: { en: "We're writing an email.", uk: "Ми пишемо листа." } }
          - { level: A2, form: { mapping: [{ term: leer }, { term: leyendo }] }, ex: ["Papá ", { target: está leyendo }, " el periódico."], tr: { en: Dad is reading the newspaper., uk: "Тато читає газету." } }
          - { level: A2, form: { mapping: [{ term: oír }, { term: oyendo }] }, ex: ["¿Me ", { target: estás oyendo }, "?"], tr: { en: Can you hear me?, uk: "Ти мене чуєш?" } }
          - { level: A2, form: { mapping: [{ term: decir }, { term: diciendo }] }, ex: ["¿Qué ", { target: estás diciendo }, "?"], tr: { en: What are you saying?, uk: "Що ти кажеш?" } }
          - { level: A2, form: { mapping: [{ term: dormir }, { term: durmiendo }] }, ex: ["El bebé ", { target: está durmiendo }, "."], tr: { en: The baby is sleeping., uk: "Малюк спить." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["After a vowel, ", { term: "-iendo" }, " becomes ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              es: ["Detrás de vocal, ", { term: "-iendo" }, " pasa a ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              uk: ["Після голосного ", { term: "-iendo" }, " стає ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: "-ir" }, " that change their stem in the present take ", { term: i }, " or ", { term: u }, " in the gerund: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
              es: ["Los verbos en ", { term: "-ir" }, " que cambian la raíz en presente llevan ", { term: i }, " o ", { term: u }, " en el gerundio: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
              uk: ["Дієслова на ", { term: "-ir" }, ", що змінюють основу в теперішньому часі, мають у герундії ", { term: i }, " або ", { term: u }, ": ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]

  - title: { en: Use, es: Uso, uk: Ужиток }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Ужиток } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, use: { en: An action at this moment, es: Una acción en este momento, uk: Дія в цю мить }, ex: ["Ahora no puedo: ", { target: estoy comiendo }, "."], tr: { en: "I can't right now: I'm eating.", uk: "Зараз не можу: я їм." } }
          - { level: A2, use: { en: A question about now, es: Una pregunta sobre ahora, uk: "Питання про те, що відбувається зараз" }, ex: ["¿Qué ", { target: estás haciendo }, "?"], tr: { en: What are you doing?, uk: "Що ти робиш?" } }
          - { level: A2, use: { en: A situation for a limited time, es: Una situación por un tiempo limitado, uk: Ситуація на обмежений час }, ex: ["Este año ", { target: estoy estudiando }, " inglés."], tr: { en: "I'm studying English this year.", uk: "Цього року я вчу англійську." } }
          - { level: A2, use: { en: Something that is changing, es: Algo que está cambiando, uk: "Те, що змінюється" }, ex: ["Los precios ", { target: están subiendo }, "."], tr: { en: Prices are going up., uk: "Ціни зростають." } }

  - title: { en: Signal words, es: Marcadores, uk: Слова-сигнали }
    role: signals
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Word, es: Palabra, uk: Слово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, signal: ahora mismo, ex: [{ signal: Ahora mismo }, " ", { target: está durmiendo }, "."], tr: { en: "She's sleeping right now.", uk: "Вона саме зараз спить." } }
          - { level: A2, signal: en este momento, ex: [{ signal: En este momento }, " ", { target: estamos cenando }, "."], tr: { en: "We're having dinner at the moment.", uk: "Зараз ми вечеряємо." } }
          - { level: A2, signal: estos días, ex: [{ signal: Estos días }, " ", { target: estoy trabajando }, " mucho."], tr: { en: "I'm working a lot these days.", uk: "Цими днями я багато працюю." } }

  - title: { en: Pronouns with the gerund, es: Los pronombres con gerundio, uk: Займенники з герундієм }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A pronoun goes before ", { term: estar }, ", or joins the end of the gerund:"]
              es: ["Un pronombre va delante de ", { term: estar }, ", o se une al final del gerundio:"]
              uk: ["Займенник ставлять перед ", { term: estar }, " або приєднують у кінці герундія:"]
            ex: { examples: [[{ target: Me estoy vistiendo }, "."], [{ target: Estoy vistiéndome }, "."]] }
            tr: { en: { examples: ["I'm getting dressed.", "I'm getting dressed."] }, uk: { examples: ["Я одягаюся.", "Я одягаюся."] } }
          - type: rule
            level: A2
            text:
              en: "A joined pronoun adds a written accent to the stressed vowel of the gerund:"
              es: "Un pronombre unido añade tilde a la vocal tónica del gerundio:"
              uk: "Приєднаний займенник додає графічний наголос на наголошений голосний герундія:"
            ex: ["Estoy ", { target: leyéndolo }, "."]
            tr: { en: "I'm reading it.", uk: "Я це читаю." }

  - title: { en: "Compare: the present and estar with the gerund", es: "Comparación: el presente y estar con gerundio", uk: "Порівняння: теперішній час та estar з герундієм" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: present, label: { en: Present, es: Presente, uk: Теперішній час } }
          - { key: progressive, label: { en: Estar with the gerund, es: Estar con gerundio, uk: Estar з герундієм } }
        rows:
          - { level: A2, present: { en: habits and facts, es: hábitos y hechos, uk: звички та факти }, progressive: { en: an action in progress now, es: una acción en curso ahora, uk: "дія, що триває зараз" } }
          - level: A2
            present: { ex: [{ target: Trabajo }, " en casa."], tr: { en: I work at home., uk: "Я працюю вдома." } }
            progressive: { ex: ["Hoy ", { target: estoy trabajando }, " en casa."], tr: { en: "I'm working at home today.", uk: "Сьогодні я працюю вдома." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The present can also name what happens now; the gerund stresses that it is in progress:"
              es: "El presente también puede expresar lo que pasa ahora; el gerundio subraya que está en curso:"
              uk: "Теперішній час теж може називати те, що відбувається зараз; герундій підкреслює, що дія триває:"
            ex: { exchange: [["¿Qué ", { target: haces }, "?"], [{ target: Leo }, " un libro."]] }
            tr: { en: { exchange: [What are you doing?, "I'm reading a book."] }, uk: { exchange: ["Що ти робиш?", "Читаю книжку."] } }
          - type: rule
            level: A2
            text:
              en: ["A plan for the future takes the present or ", { term: ir a }, ", never ", { term: estar }, " with the gerund:"]
              es: ["Un plan para el futuro lleva el presente o ", { term: ir a }, ", nunca ", { term: estar }, " con gerundio:"]
              uk: ["План на майбутнє вимагає теперішнього часу або ", { term: ir a }, ", ніколи не ", { term: estar }, " з герундієм:"]
            ex: ["Mañana ", { target: salgo }, " para Lima."]
            tr: { en: "I'm leaving for Lima tomorrow.", uk: "Завтра я їду до Ліми." }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Estoy hablo por teléfono., right: ["Estoy ", { target: hablando }, " por teléfono."], rule: { en: [{ term: estar }, " takes the gerund: ", { term: hablando }], es: [{ term: estar }, " lleva el gerundio: ", { term: hablando }], uk: [{ term: estar }, " вживається з герундієм: ", { term: hablando }] } }
          - { level: A2, wrong: Soy comiendo., right: [{ target: Estoy }, " comiendo."], rule: { en: ["the gerund takes ", { term: estar }, ", never ", { term: ser }], es: ["el gerundio lleva ", { term: estar }, ", nunca ", { term: ser }], uk: ["з герундієм уживають ", { term: estar }, ", ніколи не ", { term: ser }] } }
          - { level: A2, wrong: Estoy comendo., right: ["Estoy ", { target: comiendo }, "."], rule: { en: ["verbs in ", { term: "-er" }, " take ", { term: "-iendo" }], es: ["los verbos en ", { term: "-er" }, " llevan ", { term: "-iendo" }], uk: ["дієслова на ", { term: "-er" }, " мають ", { term: "-iendo" }] } }
