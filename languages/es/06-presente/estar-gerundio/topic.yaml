      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The present can also name what happens now; the gerund stresses that it is in progress:"
              es: "El presente también puede expresar lo que pasa ahora; el gerundio subraya que está en curso:"
              uk: "Теперішній час теж може називати те, що відбувається зараз; герундій підкреслює, що дія триває:"
              pt: "O presente também pode expressar o que acontece agora; o gerúndio destaca que a ação está em andamento:"
              fr: "Le présent peut aussi exprimer ce qui se passe maintenant ; le gérondif souligne que l’action est en cours :"
              de: "Das Präsens kann auch ausdrücken, was jetzt geschieht; das Gerundium betont, dass es gerade abläuft:"
              it: "Il presente può esprimere anche ciò che accade adesso; il gerundio sottolinea che l’azione è in corso:"
              pl: "Czas teraźniejszy może też wyrażać to, co dzieje się teraz; gerundio podkreśla, że czynność trwa:"
              tr: "Presente de şu anda olanı anlatabilir; gerundio eylemin sürmekte olduğunu vurgular:"
              id: "Presente juga dapat menyatakan apa yang terjadi sekarang; gerundio menekankan bahwa tindakan itu sedang berlangsung:"
              vi: "Thì hiện tại cũng có thể diễn tả điều đang xảy ra bây giờ; gerundio nhấn mạnh rằng hành động đang diễn ra:"
            ex: { exchange: [["¿Qué ", { target: haces }, "?"], [{ target: Leo }, " un libro."]] }
            tr: { en: { exchange: [What are you doing?, "I'm reading a book."] }, uk: { exchange: ["Що ти робиш?", "Читаю книжку."] }, pt: { exchange: ["O que você está fazendo?", "Estou lendo um livro."] }, fr: { exchange: ["Qu’est-ce que tu fais ?", "Je lis un livre."] }, de: { exchange: ["Was machst du gerade?", "Ich lese ein Buch."] }, it: { exchange: ["Che cosa fai?", "Leggo un libro."] }, pl: { exchange: ["Co robisz?", "Czytam książkę."] }, tr: { exchange: ["Ne yapıyorsun?", "Bir kitap okuyorum."] }, id: { exchange: ["Apa yang sedang kamu lakukan?", "Saya sedang membaca buku."] }, vi: { exchange: ["Bạn đang làm gì vậy?", "Tôi đang đọc sách."] } }
          - type: rule
            level: A2
            text:
              en: ["A plan for the future takes the present or ", { term: ir a }, ", never ", { term: estar }, " with the gerund:"]
              es: ["Un plan para el futuro lleva el presente o ", { term: ir a }, ", nunca ", { term: estar }, " con gerundio:"]
              uk: ["План на майбутнє вимагає теперішнього часу або ", { term: ir a }, ", ніколи не ", { term: estar }, " з герундієм:"]
              pt: ["Um plano para o futuro leva o presente ou ", { term: ir a }, ", nunca ", { term: estar }, " com gerúndio:"]
              fr: ["Un projet d’avenir se dit au présent ou avec ", { term: ir a }, ", jamais avec ", { term: estar }, " et le gérondif :"]
              de: ["Ein Plan für die Zukunft steht im Präsens oder mit ", { term: ir a }, ", nie mit ", { term: estar }, " und Gerundium:"]
              it: ["Un progetto per il futuro vuole il presente o ", { term: ir a }, ", mai ", { term: estar }, " con il gerundio:"]
              pl: ["Plan na przyszłość wyraża czas teraźniejszy lub ", { term: ir a }, ", nigdy ", { term: estar }, " z gerundio:"]
              tr: ["Gelecekle ilgili bir plan presente veya ", { term: ir a }, " ile söylenir; ", { term: estar }, " ile gerundio kullanılmaz:"]
              id: ["Rencana masa depan memakai presente atau ", { term: ir a }, ", tidak pernah ", { term: estar }, " dengan gerundio:"]
              vi: ["Kế hoạch trong tương lai dùng thì hiện tại hoặc ", { term: ir a }, ", không bao giờ dùng ", { term: estar }, " với gerundio:"]
            ex: ["Mañana ", { target: salgo }, " para Lima."]
            tr: { en: "I'm leaving for Lima tomorrow.", uk: "Завтра я їду до Ліми.", pt: "Amanhã parto para Lima.", fr: "Demain, je pars pour Lima.", de: "Morgen fahre ich nach Lima.", it: "Domani parto per Lima.", pl: "Jutro wyjeżdżam do Limy.", tr: "Yarın Lima’ya gidiyorum.", id: "Besok saya berangkat ke Lima.", vi: "Ngày mai tôi đi Lima." }

