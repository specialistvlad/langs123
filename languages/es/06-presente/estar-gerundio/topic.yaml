sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: estar }, " in the present with a gerund names an action in progress now:"]
              es: [{ term: estar }, " en presente con un gerundio expresa una acción en curso ahora:"]
              uk: [{ term: estar }, " у теперішньому часі з герундієм позначає дію, що триває зараз:"]
              pt: [{ term: estar }, " no presente com um gerúndio expressa uma ação em andamento agora:"]
              fr: [{ term: estar }, " au présent avec un gérondif exprime une action en cours maintenant :"]
              de: [{ term: estar }, " im Präsens mit einem Gerundium drückt eine Handlung aus, die gerade abläuft:"]
              it: [{ term: estar }, " al presente con un gerundio esprime un’azione in corso adesso:"]
              pl: [{ term: estar }, " w czasie teraźniejszym z gerundio wyraża czynność trwającą teraz:"]
              tr: [{ term: estar }, " fiilinin presente çekimi ve bir gerundio, şu anda süren bir eylemi anlatır:"]
              id: [{ term: estar }, " dalam presente dengan gerundio menyatakan tindakan yang sedang berlangsung sekarang:"]
              vi: [{ term: estar }, " ở thì hiện tại cùng với gerundio diễn tả hành động đang diễn ra bây giờ:"]
            ex: [{ target: Estoy cocinando }, "."]
            tr: { en: "I'm cooking.", uk: "Я готую їсти.", pt: "Estou cozinhando.", fr: "Je suis en train de cuisiner.", de: "Ich koche gerade.", it: "Sto cucinando.", pl: "Gotuję.", tr: "Yemek yapıyorum.", id: "Saya sedang memasak.", vi: "Tôi đang nấu ăn." }
          - type: rule
            level: A2
            text:
              en: ["The gerund never changes; only ", { term: estar }, " changes with the person."]
              es: ["El gerundio no cambia nunca; solo ", { term: estar }, " cambia con la persona."]
              uk: ["Герундій ніколи не змінюється; за особами змінюється лише ", { term: estar }, "."]
              pt: ["O gerúndio nunca muda; só ", { term: estar }, " muda com a pessoa."]
              fr: ["Le gérondif ne change jamais ; seul ", { term: estar }, " change selon la personne."]
              de: ["Das Gerundium ändert sich nie; nur ", { term: estar }, " ändert sich mit der Person."]
              it: ["Il gerundio non cambia mai; cambia solo ", { term: estar }, " con la persona."]
              pl: ["Gerundio nigdy się nie zmienia; zmienia się tylko ", { term: estar }, " w zależności od osoby."]
              tr: ["Gerundio hiç değişmez; kişiye göre yalnızca ", { term: estar }, " değişir."]
              id: ["Gerundio tidak pernah berubah; hanya ", { term: estar }, " yang berubah menurut orang."]
              vi: ["Gerundio không bao giờ thay đổi; chỉ ", { term: estar }, " thay đổi theo ngôi."]
          - type: note
            level: A2
            text:
              en: ["The forms of ", { term: estar }, ": ", { link: Ser and Estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Las formas de ", { term: estar }, ": ", { link: Ser y estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              uk: ["Форми ", { term: estar }, ": ", { link: "Ser і estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              pt: ["As formas de ", { term: estar }, ": ", { link: "Ser e estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              fr: ["Les formes de ", { term: estar }, " : ", { link: "Ser et estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              de: ["Die Formen von ", { term: estar }, ": ", { link: "Ser und estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              it: ["Le forme di ", { term: estar }, ": ", { link: "Ser e estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              pl: ["Formy ", { term: estar }, ": ", { link: "Ser i estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              tr: [{ term: estar }, " fiilinin çekimleri: ", { link: "Ser ve estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              id: ["Bentuk-bentuk ", { term: estar }, ": ", { link: "Ser dan estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              vi: ["Các dạng của ", { term: estar }, ": ", { link: "Ser và estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
          - type: note
            level: A2
            text:
              en: ["Other verbs with a gerund, such as ", { term: seguir }, ": ", { link: Verb Phrases, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              es: ["Otros verbos con gerundio, como ", { term: seguir }, ": ", { link: Las perífrasis, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              uk: ["Інші дієслова з герундієм, як-от ", { term: seguir }, ": ", { link: Дієслівні перифрази, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              pt: ["Outros verbos com gerúndio, como ", { term: seguir }, ": ", { link: "As perífrases verbais", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              fr: ["D’autres verbes avec un gérondif, comme ", { term: seguir }, " : ", { link: "Les périphrases verbales", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              de: ["Andere Verben mit Gerundium, etwa ", { term: seguir }, ": ", { link: "Verbalperiphrasen", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              it: ["Altri verbi con il gerundio, come ", { term: seguir }, ": ", { link: "Le perifrasi verbali", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              pl: ["Inne czasowniki z gerundio, jak ", { term: seguir }, ": ", { link: "Peryfrazy czasownikowe", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              tr: ["Gerundio alan diğer fiiller, örneğin ", { term: seguir }, ": ", { link: "Fiil öbekleri", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              id: ["Kata kerja lain dengan gerundio, seperti ", { term: seguir }, ": ", { link: "Perifrasis verbal", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              vi: ["Các động từ khác đi với gerundio, như ", { term: seguir }, ": ", { link: "Các cụm động từ", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["В українській немає окремої тривалої форми: «я читаю» — це і ", { term: leo }, ", і ", { term: estoy leyendo }, ". ", { term: Estoy leyendo }, " кажуть лише про те, що відбувається саме зараз."]

  - title: { en: "Form: estar with the gerund", es: "Forma: estar con gerundio", uk: "Форма: estar з герундієм", pt: "Forma: estar com gerúndio", fr: "Forme : estar avec le gérondif", de: "Form: estar mit Gerundium", it: "Forma: estar con il gerundio", pl: "Forma: estar z gerundio", tr: "Biçim: estar ile gerundio", id: "Bentuk: estar dengan gerundio", vi: "Dạng: estar với gerundio" }
