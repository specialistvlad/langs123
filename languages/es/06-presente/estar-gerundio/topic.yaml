# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.presente.estar-gerundio
lang: es
kind: grammar
tags: [verbs, present, gerund, progressive]
concepts: [continuous]
related: [es.presente.presente-regular, es.ser-estar-hay-gustar.ser-estar, es.imperativo-perifrasis.perifrasis-aspectuales, es.presente.verbos-reflexivos, es.futuro-condicional.ir-a-infinitivo]
status: { en: draft, es: draft }
translated: { es: "41c9cf 7fc6ce a2c86f 5790a5 8e5a2b 2bcd9b 31b59c 653a8c 6f2d27 b8b524" }

title: { en: "Present Continuous: estoy comiendo", es: "Estar con gerundio: estoy comiendo" }
summary:
  lead:
    en: [{ term: Estar }, " with a gerund in ", { term: "-ando" }, " or ", { term: "-iendo" }, " describes an action in progress right now: ", { term: estoy comiendo }, "."]
    es: [{ term: Estar }, " con un gerundio en ", { term: "-ando" }, " o ", { term: "-iendo" }, " expresa una acción en curso en este momento: ", { term: estoy comiendo }, "."]
  rule:
    en: ["Verbs in ", { term: "-ar" }, " take ", { term: "-ando" }, ", and verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " take ", { term: "-iendo" }, ":"]
    es: ["Los verbos en ", { term: "-ar" }, " llevan ", { term: "-ando" }, ", y los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, ", ", { term: "-iendo" }, ":"]
  ex: { examples: [["Ana ", { target: está hablando }, " por teléfono."], ["Los niños ", { target: están comiendo }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio } }] }
            es: { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio } }] }
          ex: [{ target: Estoy trabajando }, "."]
          tr: { en: "I'm working." }
        - level: A2
          point: { en: Gerund, es: Gerundio }
          rule:
            en: { mapping: [{ term: hablar }, { term: hablando }] }
            es: { mapping: [{ term: hablar }, { term: hablando }] }
          ex: ["Ana ", { target: está hablando }, " por teléfono."]
          tr: { en: Ana is on the phone. }
        - level: A2
          point: { en: Gerund, es: Gerundio }
          rule:
            en: [{ mapping: [{ term: comer }, { term: comiendo }] }, ", ", { mapping: [{ term: vivir }, { term: viviendo }] }]
            es: [{ mapping: [{ term: comer }, { term: comiendo }] }, ", ", { mapping: [{ term: vivir }, { term: viviendo }] }]
          ex: [{ target: Estamos comiendo }, "."]
          tr: { en: "We're eating." }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: "an action in progress now"
            es: "una acción en curso ahora"
          ex: ["¿Qué ", { target: estás haciendo }, "?"]
          tr: { en: What are you doing? }
        - level: A2
          point: { en: Gerund, es: Gerundio }
          rule:
            en: [{ mapping: [{ term: leer }, { term: leyendo }] }, ", ", { mapping: [{ term: oír }, { term: oyendo }] }]
            es: [{ mapping: [{ term: leer }, { term: leyendo }] }, ", ", { mapping: [{ term: oír }, { term: oyendo }] }]
          ex: [{ target: Estoy leyendo }, " un libro."]
          tr: { en: "I'm reading a book." }
        - level: A2
          point: { en: Gerund, es: Gerundio }
          rule:
            en: [{ mapping: [{ term: dormir }, { term: durmiendo }] }, ", ", { mapping: [{ term: decir }, { term: diciendo }] }]
            es: [{ mapping: [{ term: dormir }, { term: durmiendo }] }, ", ", { mapping: [{ term: decir }, { term: diciendo }] }]
          ex: ["El bebé ", { target: está durmiendo }, "."]
          tr: { en: The baby is sleeping. }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: "a situation for a limited time"
            es: "una situación por un tiempo limitado"
          ex: ["Este año ", { target: estoy estudiando }, " inglés."]
          tr: { en: "I'm studying English this year." }
        - level: A2
          point: { en: Pronouns, es: Pronombres }
          rule:
            en: ["before ", { term: estar }, ", or joined to the gerund"]
            es: ["delante de ", { term: estar }, ", o unido al gerundio"]
          ex: { examples: [[{ target: Me estoy vistiendo }, "."], [{ target: Estoy vistiéndome }, "."]] }
          tr: { en: { examples: ["I'm getting dressed.", "I'm getting dressed."] } }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: "routines take the present"
            es: "las rutinas llevan el presente"
          ex: ["Todos los días ", { target: trabajo }, " ocho horas."]
          tr: { en: I work eight hours every day. }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: ["plans take the present or ", { term: ir a }]
            es: ["los planes llevan el presente o ", { term: ir a }]
          ex: ["Mañana ", { target: salgo }, " para Lima."]
          tr: { en: "I'm leaving for Lima tomorrow." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: estar }, " in the present with a gerund names an action in progress now:"]
              es: [{ term: estar }, " en presente con un gerundio expresa una acción en curso ahora:"]
            ex: [{ target: Estoy cocinando }, "."]
            tr: { en: "I'm cooking." }
          - type: rule
            level: A2
            text:
              en: ["The gerund never changes; only ", { term: estar }, " changes with the person."]
              es: ["El gerundio no cambia nunca; solo ", { term: estar }, " cambia con la persona."]
          - type: note
            level: A2
            text:
              en: ["The forms of ", { term: estar }, ": ", { link: Ser and Estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Las formas de ", { term: estar }, ": ", { link: Ser y estar, to: es.ser-estar-hay-gustar.ser-estar }, "."]
          - type: note
            level: A2
            text:
              en: ["Other verbs with a gerund, such as ", { term: seguir }, ": ", { link: Verb Phrases, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              es: ["Otros verbos con gerundio, como ", { term: seguir }, ": ", { link: Las perífrasis, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]

  - title: { en: "Form: estar with the gerund", es: "Forma: estar con gerundio" }
    role: form
    features: { tense: prs, aspect: prog }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: pos, label: { en: Statement, es: Afirmación } }
          - { key: neg, label: { en: Negative, es: Negación } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, pos: [{ aux: estoy }, " ", { target: trabajando }], neg: ["no ", { aux: estoy }, " ", { target: trabajando }] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, pos: [{ aux: estás }, " ", { target: trabajando }], neg: ["no ", { aux: estás }, " ", { target: trabajando }] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, pos: [{ aux: está }, " ", { target: trabajando }], neg: ["no ", { aux: está }, " ", { target: trabajando }] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, pos: [{ aux: estamos }, " ", { target: trabajando }], neg: ["no ", { aux: estamos }, " ", { target: trabajando }] }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, pos: [{ aux: estáis }, " ", { target: trabajando }], neg: ["no ", { aux: estáis }, " ", { target: trabajando }] }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, pos: [{ aux: están }, " ", { target: trabajando }], neg: ["no ", { aux: están }, " ", { target: trabajando }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A question keeps the same words between ¿ and ?:"
              es: "Una pregunta mantiene las mismas palabras entre ¿ y ?:"
            ex: ["¿", { target: Estás trabajando }, "?"]
            tr: { en: Are you working? }

  - title: { en: "Form: the gerund", es: "Forma: el gerundio" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, form: { mapping: [{ term: "-ar" }, { term: "-ando" }] }, ex: ["Pedro ", { target: está estudiando }, "."], tr: { en: Pedro is studying. } }
          - { level: A2, form: { mapping: [{ term: "-er" }, { term: "-iendo" }] }, ex: ["¿", { target: Estás bebiendo }, " agua?"], tr: { en: Are you drinking water? } }
          - { level: A2, form: { mapping: [{ term: "-ir" }, { term: "-iendo" }] }, ex: [{ target: Estamos escribiendo }, " un correo."], tr: { en: "We're writing an email." } }
          - { level: A2, form: { mapping: [{ term: leer }, { term: leyendo }] }, ex: ["Papá ", { target: está leyendo }, " el periódico."], tr: { en: Dad is reading the newspaper. } }
          - { level: A2, form: { mapping: [{ term: oír }, { term: oyendo }] }, ex: ["¿Me ", { target: estás oyendo }, "?"], tr: { en: Can you hear me? } }
          - { level: A2, form: { mapping: [{ term: decir }, { term: diciendo }] }, ex: ["¿Qué ", { target: estás diciendo }, "?"], tr: { en: What are you saying? } }
          - { level: A2, form: { mapping: [{ term: dormir }, { term: durmiendo }] }, ex: ["El bebé ", { target: está durmiendo }, "."], tr: { en: The baby is sleeping. } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["After a vowel, ", { term: "-iendo" }, " becomes ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              es: ["Detrás de vocal, ", { term: "-iendo" }, " pasa a ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: "-ir" }, " that change their stem in the present take ", { term: i }, " or ", { term: u }, " in the gerund: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
              es: ["Los verbos en ", { term: "-ir" }, " que cambian la raíz en presente llevan ", { term: i }, " o ", { term: u }, " en el gerundio: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]

  - title: { en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: An action at this moment, es: Una acción en este momento }, ex: ["Ahora no puedo: ", { target: estoy comiendo }, "."], tr: { en: "I can't right now: I'm eating." } }
          - { level: A2, use: { en: A question about now, es: Una pregunta sobre ahora }, ex: ["¿Qué ", { target: estás haciendo }, "?"], tr: { en: What are you doing? } }
          - { level: A2, use: { en: A situation for a limited time, es: Una situación por un tiempo limitado }, ex: ["Este año ", { target: estoy estudiando }, " inglés."], tr: { en: "I'm studying English this year." } }
          - { level: A2, use: { en: Something that is changing, es: Algo que está cambiando }, ex: ["Los precios ", { target: están subiendo }, "."], tr: { en: Prices are going up. } }

  - title: { en: Signal words, es: Marcadores }
    role: signals
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Word, es: Palabra } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, signal: ahora mismo, ex: [{ signal: Ahora mismo }, " ", { target: está durmiendo }, "."], tr: { en: "She's sleeping right now." } }
          - { level: A2, signal: en este momento, ex: [{ signal: En este momento }, " ", { target: estamos cenando }, "."], tr: { en: "We're having dinner at the moment." } }
          - { level: A2, signal: estos días, ex: [{ signal: Estos días }, " ", { target: estoy trabajando }, " mucho."], tr: { en: "I'm working a lot these days." } }

  - title: { en: Pronouns with the gerund, es: Los pronombres con gerundio }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A pronoun goes before ", { term: estar }, ", or joins the end of the gerund:"]
              es: ["Un pronombre va delante de ", { term: estar }, ", o se une al final del gerundio:"]
            ex: { examples: [[{ target: Me estoy vistiendo }, "."], [{ target: Estoy vistiéndome }, "."]] }
            tr: { en: { examples: ["I'm getting dressed.", "I'm getting dressed."] } }
          - type: rule
            level: A2
            text:
              en: "A joined pronoun adds a written accent to the stressed vowel of the gerund:"
              es: "Un pronombre unido añade tilde a la vocal tónica del gerundio:"
            ex: ["Estoy ", { target: leyéndolo }, "."]
            tr: { en: "I'm reading it." }

  - title: { en: "Compare: the present and estar with the gerund", es: "Comparación: el presente y estar con gerundio" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: present, label: { en: Present, es: Presente } }
          - { key: progressive, label: { en: Estar with the gerund, es: Estar con gerundio } }
        rows:
          - { level: A2, present: { en: habits and facts, es: hábitos y hechos }, progressive: { en: an action in progress now, es: una acción en curso ahora } }
          - level: A2
            present: { ex: [{ target: Trabajo }, " en casa."], tr: { en: I work at home. } }
            progressive: { ex: ["Hoy ", { target: estoy trabajando }, " en casa."], tr: { en: "I'm working at home today." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The present can also name what happens now; the gerund stresses that it is in progress:"
              es: "El presente también puede expresar lo que pasa ahora; el gerundio subraya que está en curso:"
            ex: { exchange: [["¿Qué ", { target: haces }, "?"], [{ target: Leo }, " un libro."]] }
            tr: { en: { exchange: [What are you doing?, "I'm reading a book."] } }
          - type: rule
            level: A2
            text:
              en: ["A plan for the future takes the present or ", { term: ir a }, ", never ", { term: estar }, " with the gerund:"]
              es: ["Un plan para el futuro lleva el presente o ", { term: ir a }, ", nunca ", { term: estar }, " con gerundio:"]
            ex: ["Mañana ", { target: salgo }, " para Lima."]
            tr: { en: "I'm leaving for Lima tomorrow." }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Estoy hablo por teléfono., right: ["Estoy ", { target: hablando }, " por teléfono."], rule: { en: [{ term: estar }, " takes the gerund: ", { term: hablando }], es: [{ term: estar }, " lleva el gerundio: ", { term: hablando }] } }
          - { level: A2, wrong: Soy comiendo., right: [{ target: Estoy }, " comiendo."], rule: { en: ["the gerund takes ", { term: estar }, ", never ", { term: ser }], es: ["el gerundio lleva ", { term: estar }, ", nunca ", { term: ser }] } }
          - { level: A2, wrong: Estoy comendo., right: ["Estoy ", { target: comiendo }, "."], rule: { en: ["verbs in ", { term: "-er" }, " take ", { term: "-iendo" }], es: ["los verbos en ", { term: "-er" }, " llevan ", { term: "-iendo" }] } }
          - { level: A2, wrong: Está leiendo., right: ["Está ", { target: leyendo }, "."], rule: { en: ["after a vowel, ", { term: "-iendo" }, " becomes ", { term: "-yendo" }], es: ["detrás de vocal, ", { term: "-iendo" }, " pasa a ", { term: "-yendo" }] } }
          - { level: A2, speakers: [en], wrong: Todos los días estoy trabajando ocho horas., right: ["Todos los días ", { target: trabajo }, " ocho horas."], rule: { en: ["routines take the present, not ", { term: estar }, " with the gerund"] } }
          - { level: A2, speakers: [en], wrong: Estoy saliendo mañana., right: [{ target: Salgo }, " mañana."], rule: { en: ["future plans take the present or ", { term: ir a }, ", not the gerund"] } }
