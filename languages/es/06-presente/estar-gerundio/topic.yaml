          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, form: { mapping: [{ term: "-ar" }, { term: "-ando" }] }, ex: ["Pedro ", { target: está estudiando }, "."], tr: { en: Pedro is studying., uk: "Педро вчиться.", pt: "O Pedro está estudando.", fr: "Pedro est en train d’étudier.", de: "Pedro lernt gerade.", it: "Pedro sta studiando.", pl: "Pedro się uczy.", tr: "Pedro ders çalışıyor.", id: "Pedro sedang belajar.", vi: "Pedro đang học." } }
          - { level: A2, form: { mapping: [{ term: "-er" }, { term: "-iendo" }] }, ex: ["¿", { target: Estás bebiendo }, " agua?"], tr: { en: Are you drinking water?, uk: "Ти п’єш воду?", pt: "Você está bebendo água?", fr: "Tu es en train de boire de l’eau ?", de: "Trinkst du gerade Wasser?", it: "Stai bevendo acqua?", pl: "Pijesz wodę?", tr: "Su mu içiyorsun?", id: "Kamu sedang minum air?", vi: "Bạn đang uống nước à?" } }
          - { level: A2, form: { mapping: [{ term: "-ir" }, { term: "-iendo" }] }, ex: [{ target: Estamos escribiendo }, " un correo."], tr: { en: "We're writing an email.", uk: "Ми пишемо листа.", pt: "Estamos escrevendo um e-mail.", fr: "Nous sommes en train d’écrire un e-mail.", de: "Wir schreiben gerade eine E-Mail.", it: "Stiamo scrivendo un’e-mail.", pl: "Piszemy e-mail.", tr: "Bir e-posta yazıyoruz.", id: "Kami sedang menulis email.", vi: "Chúng tôi đang viết email." } }
          - { level: A2, form: { mapping: [{ term: leer }, { term: leyendo }] }, ex: ["Papá ", { target: está leyendo }, " el periódico."], tr: { en: Dad is reading the newspaper., uk: "Тато читає газету.", pt: "O papai está lendo o jornal.", fr: "Papa est en train de lire le journal.", de: "Papa liest gerade die Zeitung.", it: "Papà sta leggendo il giornale.", pl: "Tata czyta gazetę.", tr: "Babam gazete okuyor.", id: "Ayah sedang membaca koran.", vi: "Bố đang đọc báo." } }
          - { level: A2, form: { mapping: [{ term: oír }, { term: oyendo }] }, ex: ["¿Me ", { target: estás oyendo }, "?"], tr: { en: Can you hear me?, uk: "Ти мене чуєш?", pt: "Você está me ouvindo?", fr: "Tu m’entends ?", de: "Hörst du mich?", it: "Mi senti?", pl: "Słyszysz mnie?", tr: "Beni duyuyor musun?", id: "Kamu bisa mendengarku?", vi: "Bạn có nghe thấy tôi không?" } }
          - { level: A2, form: { mapping: [{ term: decir }, { term: diciendo }] }, ex: ["¿Qué ", { target: estás diciendo }, "?"], tr: { en: What are you saying?, uk: "Що ти кажеш?", pt: "O que você está dizendo?", fr: "Qu’est-ce que tu dis ?", de: "Was sagst du da?", it: "Che cosa stai dicendo?", pl: "Co mówisz?", tr: "Ne diyorsun?", id: "Apa yang kamu katakan?", vi: "Bạn đang nói gì vậy?" } }
          - { level: A2, form: { mapping: [{ term: dormir }, { term: durmiendo }] }, ex: ["El bebé ", { target: está durmiendo }, "."], tr: { en: The baby is sleeping., uk: "Малюк спить.", pt: "O bebê está dormindo.", fr: "Le bébé dort.", de: "Das Baby schläft.", it: "Il bebè sta dormendo.", pl: "Niemowlę śpi.", tr: "Bebek uyuyor.", id: "Bayi sedang tidur.", vi: "Em bé đang ngủ." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["After a vowel, ", { term: "-iendo" }, " becomes ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              es: ["Detrás de vocal, ", { term: "-iendo" }, " pasa a ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              uk: ["Після голосного ", { term: "-iendo" }, " стає ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              pt: ["Depois de vogal, ", { term: "-iendo" }, " passa a ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              fr: ["Après une voyelle, ", { term: "-iendo" }, " devient ", { term: "-yendo" }, " : ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              de: ["Nach einem Vokal wird ", { term: "-iendo" }, " zu ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              it: ["Dopo una vocale, ", { term: "-iendo" }, " diventa ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              pl: ["Po samogłosce ", { term: "-iendo" }, " zmienia się w ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              tr: ["Ünlüden sonra ", { term: "-iendo" }, " yerine ", { term: "-yendo" }, " yazılır: ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              id: ["Setelah vokal, ", { term: "-iendo" }, " berubah menjadi ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
              vi: ["Sau nguyên âm, ", { term: "-iendo" }, " đổi thành ", { term: "-yendo" }, ": ", { alternatives: [{ term: leyendo }, { term: oyendo }, { term: trayendo }, { term: construyendo }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: "-ir" }, " that change their stem in the present take ", { term: i }, " or ", { term: u }, " in the gerund: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
              es: ["Los verbos en ", { term: "-ir" }, " que cambian la raíz en presente llevan ", { term: i }, " o ", { term: u }, " en el gerundio: ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
              uk: ["Дієслова на ", { term: "-ir" }, ", що змінюють основу в теперішньому часі, мають у герундії ", { term: i }, " або ", { term: u }, ": ", { alternatives: [{ term: pidiendo }, { term: diciendo }, { term: durmiendo }] }, "."]
