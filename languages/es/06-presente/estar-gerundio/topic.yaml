            tr: { en: Are you working?, uk: "Ти працюєш?", pt: "Você está trabalhando?", fr: "Tu es en train de travailler ?", de: "Arbeitest du gerade?", it: "Stai lavorando?", pl: "Pracujesz?", tr: "Çalışıyor musun?", id: "Kamu sedang bekerja?", vi: "Bạn đang làm việc à?" }

  - title: { en: "Form: the gerund", es: "Forma: el gerundio", uk: "Форма: герундій", pt: "Forma: o gerúndio", fr: "Forme : le gérondif", de: "Form: das Gerundium", it: "Forma: il gerundio", pl: "Forma: gerundio", tr: "Biçim: gerundio", id: "Bentuk: gerundio", vi: "Dạng: gerundio" }
    role: form
