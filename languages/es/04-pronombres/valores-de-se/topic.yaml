              fr: ["Le datif et les paires comme ", { term: "se lo" }, " : voir ", { link: "Pronoms COI", to: "es.pronombres.objeto-indirecto" }, " et ", { link: "Deux pronoms ensemble : se lo", to: "es.pronombres.combinacion-pronombres" }, "."]
              de: ["Der Dativ und Paare wie ", { term: "se lo" }, ": siehe ", { link: "Indirekte Objektpronomen", to: "es.pronombres.objeto-indirecto" }, " und ", { link: "Zwei Pronomen zusammen: se lo", to: "es.pronombres.combinacion-pronombres" }, "."]
