title: { es: "Los valores de se: se me cayó, se comió, se abrió", en: "Uses of se: Involuntary, Aspectual and Middle", uk: "Значення se: se me cayó, se comió, se abrió", pt: "Os valores de se: se me cayó, se comió, se abrió", fr: "Les valeurs de se : se me cayó, se comió, se abrió", de: "Die Funktionen von se: se me cayó, se comió, se abrió", it: "I valori di se: se me cayó, se comió, se abrió", pl: "Funkcje se: se me cayó, se comió, se abrió", tr: "Se’nin kullanımları: se me cayó, se comió, se abrió", id: "Fungsi se: se me cayó, se comió, se abrió", vi: "Các giá trị của se: se me cayó, se comió, se abrió" }
summary:
  lead:
    es: ["Con el pronombre ", { term: se }, ", el verbo expresa un hecho sin agente, no querido o completo: ", { term: se abrió }, ", ", { term: se me cayó }, ", ", { term: se comió }, "."]
    en: ["With the pronoun ", { term: "se" }, ", the verb expresses an event with no agent, an unintended event or a completed one: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    uk: ["Із займенником ", { term: "se" }, " дієслово виражає подію без виконавця, ненавмисну або завершену: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    pt: ["Com o pronome ", { term: "se" }, ", o verbo expressa um fato sem agente, não intencional ou completo: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    fr: ["Avec le pronom ", { term: "se" }, ", le verbe exprime un fait sans agent, involontaire ou accompli : ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    de: ["Mit dem Pronomen ", { term: "se" }, " drückt das Verb ein Geschehen ohne Handelnden aus, ein unbeabsichtigtes oder ein abgeschlossenes: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    it: ["Con il pronome ", { term: "se" }, " il verbo esprime un fatto senza agente, non voluto o compiuto: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    pl: ["Z zaimkiem ", { term: "se" }, " czasownik wyraża zdarzenie bez wykonawcy, niezamierzone lub zakończone: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    tr: ["Fiil, ", { term: "se" }, " zamiriyle yapanı olmayan, istenmeden olan ya da tamamlanmış bir olayı anlatır: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    id: ["Dengan kata ganti ", { term: "se" }, ", kata kerja menyatakan kejadian tanpa pelaku, tidak disengaja, atau tuntas: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
    vi: ["Với đại từ ", { term: "se" }, ", động từ nói về sự việc không có người làm, không chủ ý hoặc đã xong: ", { term: "se abrió" }, ", ", { term: "se me cayó" }, ", ", { term: "se comió" }, "."]
  rule:
    es: "El verbo concuerda con la cosa que cambia, no con la persona afectada:"
    en: "The verb agrees with the thing that changes, not with the person affected:"
    uk: "Дієслово узгоджується з річчю, що змінюється, а не з людиною, якої це стосується:"
    pt: "O verbo concorda com a coisa que muda, não com a pessoa afetada:"
    fr: "Le verbe s’accorde avec la chose qui change, et non avec la personne concernée :"
    de: "Das Verb richtet sich nach der Sache, die sich verändert, nicht nach der betroffenen Person:"
    it: "Il verbo concorda con la cosa che cambia, non con la persona coinvolta:"
    pl: "Czasownik zgadza się z rzeczą, która się zmienia, a nie z osobą, której to dotyczy:"
    tr: "Fiil, değişen şeyle uyum sağlar; etkilenen kişiyle değil:"
    id: "Kata kerja mengikuti benda yang berubah, bukan orang yang terkena:"
    vi: "Động từ hợp với vật thay đổi, không hợp với người bị ảnh hưởng:"
  ex: { examples: [[{ target: Se rompieron }, " los vasos."], [{ target: Se me cayeron }, " los platos."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: Voz media, en: "Middle voice", uk: "Середній стан", pt: "Voz média", fr: "Voix moyenne", de: "Mediale Verben", it: "Diatesi media", pl: "Strona medialna", tr: "Orta çatı", id: "Diatesis medial", vi: "Thể giữa" }
          rule:
            es: [{ pattern: [{ term: se }, { slot: verb }] }, ": el hecho le ocurre al sujeto, sin agente"]
            en: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": the event happens to the subject, with no agent"]
            uk: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": подія відбувається з підметом, без виконавця"]
            pt: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": o fato acontece com o sujeito, sem agente"]
            fr: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, " : le fait arrive au sujet, sans agent"]
            de: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": Das Geschehen widerfährt dem Subjekt, ohne Handelnden"]
            it: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": il fatto accade al soggetto, senza agente"]
            pl: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": zdarzenie dotyczy podmiotu, bez wykonawcy"]
            tr: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": olay öznenin başına gelir, ortada yapan yoktur"]
            id: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": kejadian menimpa subjek, tanpa pelaku"]
            vi: [{ pattern: [{ term: "se" }, { slot: "verb" }] }, ": sự việc xảy ra với chủ ngữ, không có người làm"]
          ex: [{ target: Se abrió }, " la ventana."]
          tr: { en: "The window opened.", uk: "Вікно відчинилося.", pt: "A janela abriu.", fr: "La fenêtre s’est ouverte.", de: "Das Fenster ging auf.", it: "La finestra si è aperta.", pl: "Okno się otworzyło.", tr: "Pencere açıldı.", id: "Jendelanya terbuka.", vi: "Cửa sổ mở ra." }
        - level: B2
          point: { es: Hecho no querido, en: "Unintended event", uk: "Ненавмисна подія", pt: "Fato não intencional", fr: "Fait involontaire", de: "Unbeabsichtigtes Geschehen", it: "Fatto non voluto", pl: "Zdarzenie niezamierzone", tr: "İstenmeden olan olay", id: "Kejadian tidak disengaja", vi: "Sự việc không chủ ý" }
          rule:
            es: ["la persona afectada va en dativo: ", { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }]
            en: ["the person affected takes the dative: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            uk: ["людина, якої це стосується, стоїть у давальному відмінку: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            pt: ["a pessoa afetada aparece no dativo: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            fr: ["la personne concernée se met au datif : ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            de: ["die betroffene Person steht im Dativ: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            it: ["la persona coinvolta va al dativo: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            pl: ["osoba, której to dotyczy, występuje w celowniku: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            tr: ["etkilenen kişi yönelme hâlinde olur: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            id: ["orang yang terkena memakai datif: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
            vi: ["người bị ảnh hưởng đứng ở tặng cách: ", { alternatives: [{ term: "me" }, { term: "te" }, { term: "le" }, { term: "nos" }, { term: "les" }] }]
          ex: [{ target: Se nos acabó }, " el tiempo."]
          tr: { en: "We ran out of time.", uk: "У нас закінчився час.", pt: "Nosso tempo acabou.", fr: "Nous n’avons plus de temps.", de: "Uns ist die Zeit ausgegangen.", it: "Ci è finito il tempo.", pl: "Skończył nam się czas.", tr: "Zamanımız bitti.", id: "Waktu kami habis.", vi: "Chúng tôi hết thời gian." }
        - level: B2
          point: { es: Concordancia, en: "Agreement", uk: "Узгодження", pt: "Concordância", fr: "Accord", de: "Kongruenz", it: "Concordanza", pl: "Zgodność", tr: "Uyum", id: "Kesesuaian", vi: "Sự hòa hợp" }
          rule:
            es: "el verbo concuerda con la cosa, no con la persona"
            en: "the verb agrees with the thing, not with the person"
            uk: "дієслово узгоджується з річчю, а не з людиною"
            pt: "o verbo concorda com a coisa, não com a pessoa"
            fr: "le verbe s’accorde avec la chose, et non avec la personne"
            de: "das Verb richtet sich nach der Sache, nicht nach der Person"
            it: "il verbo concorda con la cosa, non con la persona"
            pl: "czasownik zgadza się z rzeczą, a nie z osobą"
            tr: "fiil, kişiyle değil, şeyle uyum sağlar"
            id: "kata kerja mengikuti bendanya, bukan orangnya"
            vi: "động từ hợp với vật, không hợp với người"
          ex: [{ target: Se me perdieron }, " las llaves."]
          tr: { en: "I lost my keys.", uk: "У мене загубилися ключі.", pt: "Minhas chaves sumiram.", fr: "J’ai perdu mes clés.", de: "Mir sind die Schlüssel verloren gegangen.", it: "Mi si sono perse le chiavi.", pl: "Zgubiły mi się klucze.", tr: "Anahtarlarım kayboldu.", id: "Kunci-kunci saya hilang.", vi: "Các chìa khóa của tôi bị mất." }
        - level: B2
          point: { alternatives: [ir, irse] }
          rule:
            es: [{ term: irse }, " marca la salida del lugar; ", { term: ir }, ", el destino"]
            en: [{ term: "irse" }, " marks leaving a place; ", { term: "ir" }, ", the destination"]
            uk: [{ term: "irse" }, " позначає виїзд із місця; ", { term: "ir" }, " — місце призначення"]
            pt: [{ term: "irse" }, " marca a saída do lugar; ", { term: "ir" }, ", o destino"]
            fr: [{ term: "irse" }, " marque le départ d’un lieu ; ", { term: "ir" }, ", la destination"]
            de: [{ term: "irse" }, " markiert das Verlassen eines Ortes; ", { term: "ir" }, ", das Ziel"]
            it: [{ term: "irse" }, " segna l'uscita da un luogo; ", { term: "ir" }, ", la destinazione"]
            pl: [{ term: "irse" }, " oznacza wyjście z miejsca; ", { term: "ir" }, " — cel"]
            tr: [{ term: "irse" }, " bir yerden ayrılmayı, ", { term: "ir" }, " ise varış noktasını gösterir"]
            id: [{ term: "irse" }, " menandai kepergian dari suatu tempat; ", { term: "ir" }, ", tujuannya"]
            vi: [{ term: "irse" }, " đánh dấu việc rời khỏi một nơi; ", { term: "ir" }, ", nơi đến"]
          ex: { examples: [[{ target: Me voy }, " de aquí."], [{ target: Voy }, " a casa de Ana."]] }
          tr: { en: { examples: ["I'm leaving here.", "I'm going to Ana's house."] }, uk: { examples: ["Я йду звідси.", "Я йду до Ани."] }, pt: { examples: ["Estou indo embora daqui.", "Vou à casa da Ana."] }, fr: { examples: ["Je m’en vais d’ici.", "Je vais chez Ana."] }, de: { examples: ["Ich gehe von hier weg.", "Ich gehe zu Ana."] }, it: { examples: ["Me ne vado da qui.", "Vado a casa di Ana."] }, pl: { examples: ["Wychodzę stąd.", "Idę do Any."] }, tr: { examples: ["Buradan gidiyorum.", "Ana’nın evine gidiyorum."] }, id: { examples: ["Saya pergi dari sini.", "Saya pergi ke rumah Ana."] }, vi: { examples: ["Tôi rời khỏi đây.", "Tôi đến nhà Ana."] } }
        - level: C1
          point: { es: Pronominales, en: "Pronominal verbs", uk: "Прономінальні дієслова", pt: "Verbos pronominais", fr: "Verbes pronominaux", de: "Pronominale Verben", it: "Verbi pronominali", pl: "Czasowniki pronominalne", tr: "Pronominal fiiller", id: "Kata kerja pronominal", vi: "Động từ pronominal" }
          rule:
            es: ["el verbo lleva ", { term: se }, " y una preposición fija"]
            en: ["the verb takes ", { term: "se" }, " and a fixed preposition"]
            uk: ["дієслово вживається з ", { term: "se" }, " і сталим прийменником"]
            pt: ["o verbo leva ", { term: "se" }, " e uma preposição fixa"]
            fr: ["le verbe prend ", { term: "se" }, " et une préposition fixe"]
            de: ["das Verb steht mit ", { term: "se" }, " und einer festen Präposition"]
            it: ["il verbo vuole ", { term: "se" }, " e una preposizione fissa"]
            pl: ["czasownik łączy się z ", { term: "se" }, " i stałym przyimkiem"]
            tr: ["fiil, ", { term: "se" }, " ve sabit bir edat alır"]
            id: ["kata kerja memakai ", { term: "se" }, " dan kata depan yang tetap"]
            vi: ["động từ đi với ", { term: "se" }, " và một giới từ cố định"]
          ex: [{ target: Me acuerdo de }, " tu casa."]
          tr: { en: "I remember your house.", uk: "Я пам’ятаю твій дім.", pt: "Eu me lembro da sua casa.", fr: "Je me souviens de ta maison.", de: "Ich erinnere mich an dein Haus.", it: "Mi ricordo di casa tua.", pl: "Pamiętam twój dom.", tr: "Evini hatırlıyorum.", id: "Saya ingat rumahmu.", vi: "Tôi nhớ nhà bạn." }
        - level: C1
          point: { es: Se aspectual, en: "Aspectual se", uk: "Аспектуальне se", pt: "Se aspectual", fr: "Se aspectuel", de: "Aspektuelles se", it: "Se aspettuale", pl: "Se aspektowe", tr: "Görünüş bildiren se", id: "Se aspektual", vi: "Se chỉ thể" }
          rule:
            es: "el objeto, delimitado, se consume entero"
            en: "the delimited object is used up entirely"
            uk: "окреслений додаток вичерпується повністю"
            pt: "o objeto, delimitado, é consumido por inteiro"
            fr: "l’objet, délimité, est consommé en entier"
            de: "das abgegrenzte Objekt wird ganz verbraucht"
            it: "l'oggetto, delimitato, viene consumato per intero"
            pl: "określone dopełnienie zostaje zużyte w całości"
            tr: "belirli nesne tamamen tüketilir"
            id: "objek yang dibatasi dihabiskan seluruhnya"
            vi: "đối tượng được xác định rõ được dùng hết hoàn toàn"
          ex: ["Felipe ", { target: se comió }, " un pollo él solo."]
          tr: { en: "Felipe ate a whole chicken all by himself.", uk: "Феліпе сам з’їв цілу курку.", pt: "Felipe comeu um frango inteiro sozinho.", fr: "Felipe a mangé un poulet entier à lui tout seul.", de: "Felipe hat ein ganzes Hähnchen ganz allein aufgegessen.", it: "Felipe si è mangiato un pollo intero da solo.", pl: "Felipe sam zjadł całego kurczaka.", tr: "Felipe koca bir tavuğu tek başına yedi.", id: "Felipe menghabiskan seekor ayam sendirian.", vi: "Felipe ăn hết một con gà một mình." }
        - level: C1
          point: { es: Posesión, en: "Possession", uk: "Присвійність", pt: "Posse", fr: "Possession", de: "Besitz", it: "Possesso", pl: "Posiadanie", tr: "Sahiplik", id: "Kepemilikan", vi: "Sở hữu" }
          rule:
            es: "el dativo nombra al dueño; la parte del cuerpo lleva artículo"
            en: "the dative names the owner; the body part takes an article"
            uk: "давальний відмінок називає власника; частина тіла має артикль"
            pt: "o dativo nomeia o dono; a parte do corpo leva artigo"
            fr: "le datif nomme le possesseur ; la partie du corps prend l’article"
            de: "der Dativ nennt den Besitzer; der Körperteil steht mit Artikel"
            it: "il dativo nomina il proprietario; la parte del corpo vuole l'articolo"
            pl: "celownik wskazuje właściciela; część ciała ma przedimek"
            tr: "yönelme hâli sahibi gösterir; vücut bölümü artikel alır"
            id: "datif menyebut pemiliknya; bagian tubuh memakai artikel"
            vi: "tặng cách nêu người sở hữu; bộ phận cơ thể đi với mạo từ"
          ex: [{ target: Se le cerraban }, " los ojos."]
          tr: { en: "His eyes were closing.", uk: "У нього заплющувалися очі.", pt: "Os olhos dele se fechavam.", fr: "Ses yeux se fermaient.", de: "Ihm fielen die Augen zu.", it: "Gli si chiudevano gli occhi.", pl: "Zamykały mu się oczy.", tr: "Gözleri kapanıyordu.", id: "Matanya terpejam.", vi: "Mắt anh ấy cứ díu lại." }
        - level: C2
          point: { es: Dativo posesivo, en: "Possessive dative", uk: "Присвійний давальний", pt: "Dativo possessivo", fr: "Datif possessif", de: "Possessiver Dativ", it: "Dativo possessivo", pl: "Celownik dzierżawczy", tr: "İyelik bildiren yönelme hâli", id: "Datif posesif", vi: "Tặng cách sở hữu" }
          rule:
            es: "artículo o, para enfatizar, posesivo; con partes del cuerpo, solo artículo"
            en: "an article or, for emphasis, a possessive; with body parts, only an article"
            uk: "артикль або, для наголосу, присвійне слово; з частинами тіла — лише артикль"
            pt: "artigo ou, para enfatizar, possessivo; com partes do corpo, só artigo"
            fr: "l’article ou, pour insister, le possessif ; avec les parties du corps, seulement l’article"
            de: "Artikel oder, zur Betonung, Possessivum; bei Körperteilen nur der Artikel"
            it: "articolo o, per enfatizzare, possessivo; con le parti del corpo, solo l'articolo"
            pl: "przedimek lub, dla podkreślenia, zaimek dzierżawczy; przy częściach ciała tylko przedimek"
            tr: "artikel ya da vurgu için iyelik sözcüğü; vücut bölümlerinde yalnızca artikel"
            id: "artikel atau, untuk penegasan, posesif; pada bagian tubuh hanya artikel"
            vi: "mạo từ hoặc, để nhấn mạnh, từ sở hữu; với bộ phận cơ thể chỉ dùng mạo từ"
          ex: { contrast: [["Se hace ", { target: la }, " cama."], ["Se hace ", { target: su }, " cama."]] }
