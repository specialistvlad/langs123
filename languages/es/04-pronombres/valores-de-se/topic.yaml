              de: ["Das Reflexivpassiv und das unpersönliche ", { term: "se" }, ": siehe ", { link: "Indirekte Rede und Passiv mit se", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
              it: ["Il passivo riflessivo e il ", { term: "se" }, " impersonale: vedi ", { link: "Discorso indiretto e passivo con se", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
              pl: ["Bierne i bezosobowe użycie ", { term: "se" }, ": zob. ", { link: "Mowa zależna i strona bierna z se", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
              tr: ["Dönüşlü edilgen yapı ve kişisiz ", { term: "se" }, ": bkz. ", { link: "Dolaylı anlatım ve se ile edilgen yapı", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
              id: ["Pasif refleksif dan ", { term: "se" }, " impersonal: lihat ", { link: "Kalimat tak langsung dan pasif dengan se", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
              vi: ["Câu bị động phản thân và ", { term: "se" }, " vô nhân xưng: xem ", { link: "Câu gián tiếp và câu bị động với se", to: "es.oracion.estilo-indirecto-pasiva" }, "."]
          - type: note
