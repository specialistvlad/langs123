      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: "El pronombre concuerda con el sujeto y subraya que el objeto se consume entero:"
              en: "The pronoun agrees with the subject and stresses that the object is used up entirely:"
              uk: "Займенник узгоджується з підметом і підкреслює, що предмет дії вичерпано повністю:"
              pt: "O pronome concorda com o sujeito e destaca que o objeto é consumido por inteiro:"
              fr: "Le pronom s’accorde avec le sujet et souligne que l’objet est consommé en entier :"
              de: "Das Pronomen richtet sich nach dem Subjekt und betont, dass das Objekt ganz verbraucht wird:"
              it: "Il pronome concorda con il soggetto e sottolinea che l'oggetto viene consumato per intero:"
              pl: "Zaimek zgadza się z podmiotem i podkreśla, że dopełnienie zostaje zużyte w całości:"
              tr: "Zamir özneyle uyum sağlar ve nesnenin tamamen tüketildiğini vurgular:"
              id: "Pronomina mengikuti subjek dan menegaskan bahwa objeknya dihabiskan seluruhnya:"
              vi: "Đại từ hợp với chủ ngữ và nhấn mạnh rằng đối tượng được dùng hết hoàn toàn:"
            ex: { examples: [["Felipe ", { target: se comió }, " un pollo él solo."], [{ target: Me bebí }, " toda la botella."]] }
            tr: { en: { examples: ["Felipe ate a whole chicken all by himself.", "I drank the whole bottle."] }, uk: { examples: ["Феліпе сам з’їв цілу курку.", "Я випив усю пляшку."] }, pt: { examples: ["Felipe comeu um frango inteiro sozinho.", "Bebi a garrafa toda."] }, fr: { examples: ["Felipe a mangé un poulet entier à lui tout seul.", "J’ai bu toute la bouteille."] }, de: { examples: ["Felipe hat ein ganzes Hähnchen ganz allein aufgegessen.", "Ich habe die ganze Flasche ausgetrunken."] }, it: { examples: ["Felipe si è mangiato un pollo intero da solo.", "Mi sono bevuto tutta la bottiglia."] }, pl: { examples: ["Felipe sam zjadł całego kurczaka.", "Wypiłem całą butelkę."] }, tr: { examples: ["Felipe koca bir tavuğu tek başına yedi.", "Şişenin hepsini içtim."] }, id: { examples: ["Felipe menghabiskan seekor ayam sendirian.", "Saya meminum habis seluruh botol itu."] }, vi: { examples: ["Felipe ăn hết một con gà một mình.", "Tôi uống hết cả chai."] } }
          - type: rule
            level: C1
            text:
              es: "El objeto va delimitado: artículo, posesivo, demostrativo o numeral:"
              en: "The object is delimited: an article, a possessive, a demonstrative or a numeral:"
              uk: "Предмет дії окреслений: артикль, присвійний займенник, вказівний займенник або числівник:"
              pt: "O objeto é delimitado: artigo, possessivo, demonstrativo ou numeral:"
              fr: "L’objet est délimité : article, possessif, démonstratif ou numéral :"
              de: "Das Objekt ist abgegrenzt: Artikel, Possessivum, Demonstrativum oder Zahlwort:"
              it: "L'oggetto è delimitato: articolo, possessivo, dimostrativo o numerale:"
              pl: "Dopełnienie jest określone: przedimek, zaimek dzierżawczy, zaimek wskazujący lub liczebnik:"
              tr: "Nesne belirlidir: artikel, iyelik sözcüğü, işaret sözcüğü ya da sayı sözcüğü:"
              id: "Objeknya dibatasi: artikel, posesif, kata tunjuk, atau numeralia:"
              vi: "Đối tượng được xác định rõ: mạo từ, từ sở hữu, từ chỉ định hoặc số từ:"
            ex: { examples: [["Se bebió ", { target: el }, " agua."], ["Se bebió ", { target: tu }, " agua."], ["Se bebió ", { target: tres }, " vasos."]] }
            tr: { en: { examples: ["He drank the water.", "He drank your water.", "He drank three glasses."] }, uk: { examples: ["Він випив воду.", "Він випив твою воду.", "Він випив три склянки."] }, pt: { examples: ["Ele bebeu a água.", "Ele bebeu a sua água.", "Ele bebeu três copos."] }, fr: { examples: ["Il a bu l’eau.", "Il a bu ton eau.", "Il a bu trois verres."] }, de: { examples: ["Er hat das Wasser getrunken.", "Er hat dein Wasser getrunken.", "Er hat drei Gläser getrunken."] }, it: { examples: ["Si è bevuto l'acqua.", "Si è bevuto la tua acqua.", "Si è bevuto tre bicchieri."] }, pl: { examples: ["Wypił wodę.", "Wypił twoją wodę.", "Wypił trzy szklanki."] }, tr: { examples: ["Suyu içti.", "Senin suyunu içti.", "Üç bardak içti."] }, id: { examples: ["Dia meminum airnya.", "Dia meminum airmu.", "Dia meminum tiga gelas."] }, vi: { examples: ["Anh ấy uống hết nước.", "Anh ấy uống hết nước của bạn.", "Anh ấy uống hết ba cốc."] } }
          - type: rule
            level: C1
            text:
              es: "Sin el pronombre, la oración es correcta y no subraya el consumo completo:"
              en: "Without the pronoun, the sentence is correct and does not stress that everything was consumed:"
              uk: "Без займенника речення правильне, але не підкреслює, що все спожито:"
              pt: "Sem o pronome, a oração está correta e não destaca que tudo foi consumido:"
              fr: "Sans le pronom, la phrase est correcte et ne souligne pas que tout a été consommé :"
              de: "Ohne das Pronomen ist der Satz richtig und betont nicht, dass alles verbraucht wurde:"
              it: "Senza il pronome, la frase è corretta e non sottolinea che tutto è stato consumato:"
              pl: "Bez zaimka zdanie jest poprawne i nie podkreśla, że wszystko zostało zużyte:"
              tr: "Zamir olmadan cümle doğrudur ve her şeyin tüketildiğini vurgulamaz:"
              id: "Tanpa pronomina, kalimatnya benar dan tidak menegaskan bahwa semuanya dihabiskan:"
              vi: "Không có đại từ, câu vẫn đúng nhưng không nhấn mạnh rằng đã dùng hết:"
            ex: { contrast: [["Felipe ", { target: comió }, " un pollo."], ["Felipe ", { target: se comió }, " un pollo."]] }
            tr: { en: { contrast: ["Felipe ate a chicken.", "Felipe ate a whole chicken."] }, uk: { contrast: ["Феліпе з’їв курку.", "Феліпе з’їв цілу курку."] }, pt: { contrast: ["Felipe comeu um frango.", "Felipe comeu um frango inteiro."] }, fr: { contrast: ["Felipe a mangé un poulet.", "Felipe a mangé tout un poulet."] }, de: { contrast: ["Felipe hat ein Hähnchen gegessen.", "Felipe hat ein ganzes Hähnchen aufgegessen."] }, it: { contrast: ["Felipe ha mangiato un pollo.", "Felipe si è mangiato un pollo intero."] }, pl: { contrast: ["Felipe zjadł kurczaka.", "Felipe zjadł całego kurczaka."] }, tr: { contrast: ["Felipe bir tavuk yedi.", "Felipe koca bir tavuğu yedi."] }, id: { contrast: ["Felipe makan seekor ayam.", "Felipe menghabiskan seekor ayam."] }, vi: { contrast: ["Felipe ăn một con gà.", "Felipe ăn hết một con gà."] } }

