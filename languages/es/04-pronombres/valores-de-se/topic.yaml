            tr: { en: { examples: ["I dropped the plates.", "I burned the rice."] }, uk: { examples: ["У мене випали тарілки.", "У мене підгорів рис."] }, pt: { examples: ["Os pratos caíram da minha mão.", "Meu arroz queimou."] }, fr: { examples: ["J’ai laissé tomber les assiettes.", "Mon riz a brûlé."] }, de: { examples: ["Mir sind die Teller heruntergefallen.", "Mir ist der Reis angebrannt."] }, it: { examples: ["Mi sono caduti i piatti.", "Mi si è bruciato il riso."] }, pl: { examples: ["Wypadły mi talerze.", "Przypalił mi się ryż."] }, tr: { examples: ["Tabaklar elimden düştü.", "Pilavım yandı."] }, id: { examples: ["Piring-piringku jatuh.", "Nasiku gosong."] }, vi: { examples: ["Mấy cái đĩa tuột khỏi tay tôi.", "Cơm của tôi bị cháy."] } }
