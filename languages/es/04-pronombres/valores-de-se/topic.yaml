            tr: { en: { examples: ["I lost my key.", "I lost my keys."] }, uk: { examples: ["У мене загубився ключ.", "У мене загубилися ключі."] }, pt: { examples: ["Minha chave sumiu.", "Minhas chaves sumiram."] }, fr: { examples: ["J’ai perdu ma clé.", "J’ai perdu mes clés."] }, de: { examples: ["Mir ist der Schlüssel verloren gegangen.", "Mir sind die Schlüssel verloren gegangen."] }, it: { examples: ["Mi si è persa la chiave.", "Mi si sono perse le chiavi."] }, pl: { examples: ["Zgubił mi się klucz.", "Zgubiły mi się klucze."] }, tr: { examples: ["Anahtarım kayboldu.", "Anahtarlarım kayboldu."] }, id: { examples: ["Kunci saya hilang.", "Kunci-kunci saya hilang."] }, vi: { examples: ["Chìa khóa của tôi bị mất.", "Các chìa khóa của tôi bị mất."] } }
          - type: rule
            level: B2
            text:
              es: [{ pattern: [{ term: a }, { slot: person }] }, " nombra o resalta a quien le ocurre:"]
