              id: ["Datif dan pasangan seperti ", { term: "se lo" }, ": lihat ", { link: "Kata ganti objek tak langsung", to: "es.pronombres.objeto-indirecto" }, " dan ", { link: "Dua kata ganti sekaligus: se lo", to: "es.pronombres.combinacion-pronombres" }, "."]
              vi: ["Tặng cách và các cặp như ", { term: "se lo" }, ": xem ", { link: "Đại từ tân ngữ gián tiếp", to: "es.pronombres.objeto-indirecto" }, " và ", { link: "Hai đại từ đi cùng nhau: se lo", to: "es.pronombres.combinacion-pronombres" }, "."]

