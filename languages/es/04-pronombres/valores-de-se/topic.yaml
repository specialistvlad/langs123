              pl: ["Celownik i pary takie jak ", { term: "se lo" }, ": zob. ", { link: "Zaimki dopełnienia dalszego", to: "es.pronombres.objeto-indirecto" }, " i ", { link: "Dwa zaimki razem: se lo", to: "es.pronombres.combinacion-pronombres" }, "."]
