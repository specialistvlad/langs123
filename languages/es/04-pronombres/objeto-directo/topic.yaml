sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The direct object receives the action of the verb: what or whom."
              es: "El objeto directo recibe la acción del verbo: qué o a quién."
              uk: "Прямий додаток — це те, на що спрямована дія дієслова: що або кого."
              pt: "O objeto direto recebe a ação do verbo: o quê ou quem."
              fr: "Le COD reçoit l’action du verbe : quoi ou qui."
              de: "Das direkte Objekt empfängt die Handlung des Verbs: was oder wen."
              it: "Il complemento diretto riceve l’azione del verbo: che cosa o chi."
              pl: "Dopełnienie bliższe przyjmuje czynność czasownika: co lub kogo."
              tr: "Doğrudan nesne fiilin eylemini alır: neyi ya da kimi."
              id: "Objek langsung menerima tindakan kata kerja: apa atau siapa."
              vi: "Tân ngữ trực tiếp nhận hành động của động từ: cái gì hoặc ai."
            ex: ["Compro ", { target: el pan }, "."]
            tr: { en: "I'm buying the bread.", uk: "Я купую хліб.", pt: "Estou comprando o pão.", fr: "J’achète le pain.", de: "Ich kaufe das Brot.", it: "Compro il pane.", pl: "Kupuję chleb.", tr: "Ekmek alıyorum.", id: "Saya membeli roti.", vi: "Tôi mua bánh mì." }
          - type: rule
            level: A2
            text:
              en: "A pronoun replaces a direct object that is already known:"
              es: "Un pronombre sustituye a un objeto directo ya conocido:"
              uk: "Займенник замінює вже відомий прямий додаток:"
              pt: "Um pronome substitui um objeto direto já conhecido:"
              fr: "Un pronom remplace un COD déjà connu :"
              de: "Ein Pronomen ersetzt ein schon bekanntes direktes Objekt:"
              it: "Un pronome sostituisce un complemento diretto già noto:"
              pl: "Zaimek zastępuje dopełnienie bliższe, które już znamy:"
              tr: "Zamir, zaten bilinen bir doğrudan nesnenin yerini tutar:"
              id: "Kata ganti menggantikan objek langsung yang sudah diketahui:"
              vi: "Đại từ thay cho tân ngữ trực tiếp đã biết:"
            ex: ["¿El pan? ", { target: Lo }, " compro yo."]
            tr: { en: "The bread? I'll buy it.", uk: "Хліб? Я його куплю.", pt: "O pão? Eu compro.", fr: "Le pain ? C’est moi qui l’achète.", de: "Das Brot? Ich kaufe es.", it: "Il pane? Lo compro io.", pl: "Chleb? Ja go kupię.", tr: "Ekmek mi? Onu ben alırım.", id: "Rotinya? Saya yang membelinya.", vi: "Bánh mì à? Tôi sẽ mua nó." }
          - type: note
            level: A2
            text:
              en: ["Pronouns for “to whom” or “for whom”: ", { link: "Indirect Object Pronouns", to: es.pronombres.objeto-indirecto }, "."]
              es: ["Los pronombres de “a quién” o “para quién”: ", { link: "El objeto indirecto", to: es.pronombres.objeto-indirecto }, "."]
              uk: ["Займенники для «кому» чи «для кого»: ", { link: "Займенники непрямого додатка", to: es.pronombres.objeto-indirecto }, "."]
              pt: ["Os pronomes de “a quem” ou “para quem”: ", { link: "Pronomes de objeto indireto", to: es.pronombres.objeto-indirecto }, "."]
              fr: ["Les pronoms de « à qui » ou « pour qui » : ", { link: "Pronoms COI", to: es.pronombres.objeto-indirecto }, "."]
              de: ["Die Pronomen für „wem“ oder „für wen“: ", { link: "Indirekte Objektpronomen", to: es.pronombres.objeto-indirecto }, "."]
              it: ["I pronomi di «a chi» o «per chi»: ", { link: "Pronomi complemento indiretto", to: es.pronombres.objeto-indirecto }, "."]
              pl: ["Zaimki odpowiadające na „komu” lub „dla kogo”: ", { link: "Zaimki dopełnienia dalszego", to: es.pronombres.objeto-indirecto }, "."]
              tr: ["“Kime” ya da “kimin için” sorularının zamirleri: ", { link: "Dolaylı nesne zamirleri", to: es.pronombres.objeto-indirecto }, "."]
              id: ["Kata ganti untuk “kepada siapa” atau “untuk siapa”: ", { link: "Kata ganti objek tak langsung", to: es.pronombres.objeto-indirecto }, "."]
              vi: ["Các đại từ cho “cho ai” hoặc “vì ai”: ", { link: "Đại từ tân ngữ gián tiếp", to: es.pronombres.objeto-indirecto }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники", pt: "Forma: os pronomes", fr: "Forme : les pronoms", de: "Form: die Pronomen", it: "Forma: i pronomi", pl: "Forma: zaimki", tr: "Biçim: zamirler", id: "Bentuk: kata ganti", vi: "Dạng: các đại từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto, uk: "Підмет", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" } }
          - { key: object, label: { en: Direct object, es: Objeto directo, uk: "Прямий додаток", pt: "Objeto direto", fr: "COD", de: "Direktes Objekt", it: "Complemento diretto", pl: "Dopełnienie bliższe", tr: "Doğrudan nesne", id: "Objek langsung", vi: "Tân ngữ trực tiếp" } }
        rows:
          - { level: A2, features: { person: 1, number: sg, case: acc }, subject: yo, object: { target: me } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm, case: acc }, subject: tú, object: { target: te } }
          - { level: A2, features: [{ person: 3, number: sg, gender: masc, case: acc }, { person: 2, number: sg, politeness: form, gender: masc, case: acc }], subject: { alternatives: [él, usted] }, object: { target: lo } }
          - { level: A2, features: [{ person: 3, number: sg, gender: fem, case: acc }, { person: 2, number: sg, politeness: form, gender: fem, case: acc }], subject: { alternatives: [ella, usted] }, object: { target: la } }
          - { level: A2, features: { person: 1, number: pl, case: acc }, subject: { alternatives: [nosotros, nosotras] }, object: { target: nos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm, case: acc }, subject: { alternatives: [vosotros, vosotras] }, object: { target: os } }
          - { level: A2, features: [{ person: 3, number: pl, gender: masc, case: acc }, { person: 2, number: pl, gender: masc, case: acc }], subject: { alternatives: [ellos, ustedes] }, object: { target: los } }
          - { level: A2, features: [{ person: 3, number: pl, gender: fem, case: acc }, { person: 2, number: pl, gender: fem, case: acc }], subject: { alternatives: [ellas, ustedes] }, object: { target: las } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " take the gender and number of the noun they replace:"]
              es: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " toman el género y el número del sustantivo que sustituyen:"]
              uk: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " мають рід і число іменника, який замінюють:"]
              pt: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " tomam o gênero e o número do substantivo que substituem:"]
              fr: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " prennent le genre et le nombre du nom qu’ils remplacent :"]
              de: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " übernehmen Genus und Numerus des Nomens, das sie ersetzen:"]
              it: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " prendono il genere e il numero del nome che sostituiscono:"]
              pl: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " przyjmują rodzaj i liczbę rzeczownika, który zastępują:"]
              tr: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " yerini tuttukları adın cinsiyetini ve sayısını alır:"]
              id: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " mengikuti gender dan jumlah nomina yang digantikannya:"]
              vi: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " theo giống và số của danh từ mà chúng thay thế:"]
            ex: { examples: [["¿Los zapatos? ", { target: Los }, " compro hoy."], ["¿Las llaves? ", { target: Las }, " tengo yo."]] }
            tr: { en: { examples: ["The shoes? I'm buying them today.", "The keys? I've got them."] }, uk: { examples: ["Черевики? Куплю їх сьогодні.", "Ключі? Вони в мене."] }, pt: { examples: ["Os sapatos? Eu compro hoje.", "As chaves? Estão comigo."] }, fr: { examples: ["Les chaussures ? Je les achète aujourd’hui.", "Les clés ? C’est moi qui les ai."] }, de: { examples: ["Die Schuhe? Ich kaufe sie heute.", "Die Schlüssel? Ich habe sie."] }, it: { examples: ["Le scarpe? Le compro oggi.", "Le chiavi? Le ho io."] }, pl: { examples: ["Buty? Kupię je dzisiaj.", "Klucze? Mam je ja."] }, tr: { examples: ["Ayakkabılar mı? Onları bugün alıyorum.", "Anahtarlar mı? Bende."] }, id: { examples: ["Sepatunya? Saya beli hari ini.", "Kuncinya? Ada pada saya."] }, vi: { examples: ["Đôi giày à? Hôm nay tôi mua chúng.", "Chìa khóa à? Tôi giữ chúng."] } }
          - type: rule
            level: A2
            text:
              en: "A noun with no article, or with an indefinite one, takes no pronoun in the answer:"
              es: "Un sustantivo sin artículo, o con un indefinido, no lleva pronombre en la respuesta:"
              uk: "Іменник без артикля або з неозначеним артиклем у відповіді займенником не замінюють:"
              pt: "Um substantivo sem artigo, ou com um indefinido, não leva pronome na resposta:"
              fr: "Un nom sans article, ou avec un indéfini, ne prend pas de pronom dans la réponse :"
              de: "Ein Nomen ohne Artikel oder mit unbestimmtem Artikel bekommt in der Antwort kein Pronomen:"
              it: "Un nome senza articolo, o con un indefinito, non prende il pronome nella risposta:"
              pl: "Rzeczownik bez rodzajnika lub z nieokreślonym nie ma w odpowiedzi zaimka:"
              tr: "Tanımlık almayan ya da belgisiz bir sözcükle gelen ad, cevapta zamir almaz:"
              id: "Nomina tanpa artikel, atau dengan kata penentu tak tentu, tidak memakai kata ganti dalam jawaban:"
              vi: "Danh từ không có mạo từ, hoặc có từ bất định, không dùng đại từ trong câu trả lời:"
            ex: { exchange: ["¿Tienes hermanos?", ["Sí, ", { target: tengo }, " dos."]] }
            tr: { en: { exchange: [Have you got any brothers or sisters?, "Yes, I have two."] }, uk: { exchange: ["У тебе є брати чи сестри?", "Так, двоє."] }, pt: { exchange: ["Você tem irmãos?", "Sim, tenho dois."] }, fr: { exchange: ["Tu as des frères et sœurs ?", "Oui, j’en ai deux."] }, de: { exchange: ["Hast du Geschwister?", "Ja, ich habe zwei."] }, it: { exchange: ["Hai fratelli o sorelle?", "Sì, ne ho due."] }, pl: { exchange: ["Masz rodzeństwo?", "Tak, mam dwoje."] }, tr: { exchange: ["Kardeşin var mı?", "Evet, iki tane var."] }, id: { exchange: ["Kamu punya saudara?", "Ya, saya punya dua."] }, vi: { exchange: ["Bạn có anh chị em không?", "Có, tôi có hai."] } }
          - type: rule
            level: B2
            text:
              es: [{ term: lo }, " sustituye al atributo de ", { term: ser }, " o de ", { term: estar }, " y no cambia de género ni de número:"]
              en: [{ term: lo }, " replaces the subject complement of ", { term: ser }, " or ", { term: estar }, " and does not change for gender or number:"]
              uk: [{ term: lo }, " замінює іменну частину присудка після ", { term: ser }, " чи ", { term: estar }, " і не змінюється за родом і числом:"]
              pt: [{ term: lo }, " substitui o predicativo de ", { term: ser }, " ou de ", { term: estar }, " e não muda de gênero nem de número:"]
              fr: [{ term: lo }, " remplace l’attribut de ", { term: ser }, " ou de ", { term: estar }, " et ne change ni de genre ni de nombre :"]
              de: [{ term: lo }, " ersetzt das Prädikativ von ", { term: ser }, " oder ", { term: estar }, " und ändert weder Genus noch Numerus:"]
              it: [{ term: lo }, " sostituisce il predicativo di ", { term: ser }, " o di ", { term: estar }, " e non cambia né di genere né di numero:"]
              pl: [{ term: lo }, " zastępuje orzecznik przy ", { term: ser }, " lub ", { term: estar }, " i nie zmienia rodzaju ani liczby:"]
              tr: [{ term: lo }, ", ", { term: ser }, " ya da ", { term: estar }, " fiilinin ad veya sıfat yüklemini karşılar; cinsiyet ve sayı değiştirmez:"]
              id: [{ term: lo }, " menggantikan pelengkap subjek ", { term: ser }, " atau ", { term: estar }, " dan tidak berubah menurut gender maupun jumlah:"]
              vi: [{ term: lo }, " thay cho vị ngữ của ", { term: ser }, " hoặc ", { term: estar }, " và không đổi theo giống hay số:"]
            ex: { examples: [{ exchange: ["¿Eres médico?", ["Sí, ", { target: lo }, " soy."]] }, { exchange: ["¿Son médicas?", ["Sí, ", { target: lo }, " son."]] }] }
            tr: { en: { examples: [{ exchange: ["Are you a doctor?", "Yes, I am."] }, { exchange: ["Are they doctors?", "Yes, they are."] }] }, uk: { examples: [{ exchange: ["Ти лікар?", "Так, лікар."] }, { exchange: ["Вони лікарки?", "Так, лікарки."] }] }, pt: { examples: [{ exchange: ["Você é médico?", "Sou, sim."] }, { exchange: ["Elas são médicas?", "São, sim."] }] }, fr: { examples: [{ exchange: ["Tu es médecin ?", "Oui, je le suis."] }, { exchange: ["Elles sont médecins ?", "Oui, elles le sont."] }] }, de: { examples: [{ exchange: ["Bist du Arzt?", "Ja, das bin ich."] }, { exchange: ["Sind sie Ärztinnen?", "Ja, das sind sie."] }] }, it: { examples: [{ exchange: ["Sei medico?", "Sì, lo sono."] }, { exchange: ["Sono dottoresse?", "Sì, lo sono."] }] }, pl: { examples: [{ exchange: ["Jesteś lekarzem?", "Tak, jestem."] }, { exchange: ["Czy one są lekarkami?", "Tak, są."] }] }, tr: { examples: [{ exchange: ["Doktor musun?", "Evet, doktorum."] }, { exchange: ["Onlar doktor mu?", "Evet, doktorlar."] }] }, id: { examples: [{ exchange: ["Apakah kamu dokter?", "Ya, saya dokter."] }, { exchange: ["Apakah mereka dokter?", "Ya, mereka dokter."] }] }, vi: { examples: [{ exchange: ["Bạn là bác sĩ à?", "Vâng, tôi là bác sĩ."] }, { exchange: ["Họ là bác sĩ à?", "Vâng, họ là bác sĩ."] }] } }

  - title: { es: Cuándo aparece el pronombre, en: "When the pronoun appears", uk: "Коли з’являється займенник", pt: "Quando o pronome aparece", fr: "Quand le pronom apparaît", de: "Wann das Pronomen steht", it: "Quando compare il pronome", pl: "Kiedy pojawia się zaimek", tr: "Zamir ne zaman görünür", id: "Kapan kata ganti muncul", vi: "Khi nào có đại từ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, use: { es: ["Con ", { term: a }, " y un pronombre tónico, el pronombre átono aparece siempre"], en: ["With ", { term: a }, " and a stressed pronoun, the unstressed pronoun always appears"], uk: ["З ", { term: a }, " і наголошеним займенником ненаголошений займенник стоїть завжди"], pt: ["Com ", { term: a }, " e um pronome tônico, o pronome átono aparece sempre"], fr: ["Avec ", { term: a }, " et un pronom tonique, le pronom atone est toujours présent"], de: ["Mit ", { term: a }, " und einem betonten Pronomen steht das unbetonte Pronomen immer"], it: ["Con ", { term: a }, " e un pronome tonico, il pronome atono compare sempre"], pl: ["Z ", { term: a }, " i zaimkiem akcentowanym zaimek nieakcentowany pojawia się zawsze"], tr: [{ term: a }, " ve vurgulu bir zamirle birlikte vurgusuz zamir her zaman görünür"], id: ["Dengan ", { term: a }, " dan kata ganti bertekanan, kata ganti tanpa tekanan selalu muncul"], vi: ["Với ", { term: a }, " và đại từ có trọng âm, đại từ không có trọng âm luôn xuất hiện"] }, ex: ["Quiero ", { target: verla }, " a ella, no a ti."], tr: { en: "I want to see her, not you.", uk: "Я хочу побачити її, а не тебе.", pt: "Quero vê-la, não você.", fr: "Je veux la voir, elle, pas toi.", de: "Ich will sie sehen, nicht dich.", it: "Voglio vedere lei, non te.", pl: "Chcę zobaczyć ją, a nie ciebie.", tr: "Seni değil, onu görmek istiyorum.", id: "Saya ingin melihat dia, bukan kamu.", vi: "Tôi muốn gặp cô ấy, không phải bạn." } }
