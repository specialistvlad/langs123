          - { level: A2, use: { en: "With a gerund: attached, or before the whole phrase", es: "Con gerundio: unido, o delante de todo el grupo", uk: "З герундієм: приєднується або стоїть перед усією групою", pt: "Com gerúndio: unido, ou antes de todo o grupo", fr: "Avec un gérondif : collé au verbe, ou devant tout le groupe", de: "Mit Gerundium: angehängt, oder vor die ganze Gruppe", it: "Con il gerundio: attaccato, oppure davanti a tutto il gruppo", pl: "Z gerundium: dołączony albo przed całą grupą", tr: "Gerundio ile: eklenir ya da bütün öbeğin önüne gelir", id: "Dengan gerundio: melekat, atau di depan seluruh frasa", vi: "Với gerundio: gắn vào, hoặc đứng trước cả cụm" }, ex: { equivalence: [["Estoy ", { target: leyéndolo }], [{ target: Lo }, " estoy leyendo"]] }, tr: { en: "I'm reading it.", uk: "Я це читаю.", pt: "Estou lendo isso.", fr: "Je suis en train de le lire.", de: "Ich lese es gerade.", it: "Lo sto leggendo.", pl: "Właśnie to czytam.", tr: "Onu okuyorum.", id: "Saya sedang membacanya.", vi: "Tôi đang đọc nó." } }
          - { level: A2, use: { en: Attached to an affirmative command, es: Unido al imperativo afirmativo, uk: "Приєднується до стверджувальної наказової форми", pt: "Unido ao imperativo afirmativo", fr: "Collé à l’impératif affirmatif", de: "An den bejahten Imperativ angehängt", it: "Attaccato all’imperativo affermativo", pl: "Dołączony do trybu rozkazującego w zdaniu twierdzącym", tr: "Olumlu emir kipine eklenir", id: "Melekat pada imperatif afirmatif", vi: "Gắn vào câu mệnh lệnh khẳng định" }, ex: [{ target: Cómpralo }, "."], tr: { en: Buy it., uk: "Купи його.", pt: "Compre isso.", fr: "Achète-le.", de: "Kauf es.", it: "Compralo.", pl: "Kup to.", tr: "Onu al.", id: "Belilah.", vi: "Hãy mua nó." } }
          - { level: B2, use: { es: ["Con un verbo reflexivo en la perífrasis: ", { term: se }, " va antes de ", { term: lo }], en: ["With a reflexive verb in a verb phrase: ", { term: se }, " goes before ", { term: lo }], uk: ["З зворотним дієсловом у перифразі: ", { term: se }, " стоїть перед ", { term: lo }], pt: ["Com um verbo reflexivo na perífrase: ", { term: se }, " vem antes de ", { term: lo }], fr: ["Avec un verbe pronominal dans la périphrase : ", { term: se }, " se place avant ", { term: lo }], de: ["Mit einem reflexiven Verb in der Periphrase: ", { term: se }, " steht vor ", { term: lo }], it: ["Con un verbo riflessivo nella perifrasi: ", { term: se }, " va prima di ", { term: lo }], pl: ["Z czasownikiem zwrotnym w peryfrazie: ", { term: se }, " stoi przed ", { term: lo }], tr: ["Perifrazdaki dönüşlü fiilde: ", { term: se }, ", ", { term: lo }, " öğesinden önce gelir"], id: ["Dengan kata kerja refleksif dalam perifrasis: ", { term: se }, " berada sebelum ", { term: lo }], vi: ["Với động từ phản thân trong cụm động từ: ", { term: se }, " đứng trước ", { term: lo }] }, ex: { equivalence: [["Se pone a ", { target: leerlo }], [{ target: "Se lo" }, " pone a leer"]] }, tr: { en: "He starts reading it.", uk: "Він береться його читати.", pt: "Ele começa a ler isso.", fr: "Il se met à le lire.", de: "Er fängt an, es zu lesen.", it: "Si mette a leggerlo.", pl: "Zaczyna to czytać.", tr: "Onu okumaya başlıyor.", id: "Dia mulai membacanya.", vi: "Anh ấy bắt đầu đọc nó." } }
          - { level: B2, use: { es: "Con un verbo de permiso: el pronombre va detrás del infinitivo, delante del verbo de permiso o en la subordinada con «que»", en: "With a verb of permission: the pronoun goes after the infinitive, before the permission verb, or in the subordinate clause with “que”", uk: "З дієсловом дозволу: займенник стоїть після інфінітива, перед дієсловом дозволу або в підрядному реченні з «que»", pt: "Com um verbo de permissão: o pronome vai depois do infinitivo, antes do verbo de permissão ou na oração subordinada com “que”", fr: "Avec un verbe de permission : le pronom se place après l’infinitif, devant le verbe de permission ou dans la subordonnée avec « que »", de: "Bei einem Verb der Erlaubnis: Das Pronomen steht hinter dem Infinitiv, vor dem Erlaubnisverb oder im Nebensatz mit „que“", it: "Con un verbo di permesso: il pronome va dopo l’infinito, davanti al verbo di permesso o nella subordinata con «que»", pl: "Przy czasowniku zezwalania zaimek stoi po bezokoliczniku, przed czasownikiem zezwalania albo w zdaniu podrzędnym z „que”", tr: "İzin fiilinde zamir mastardan sonra, izin fiilinden önce ya da “que” ile kurulan yan cümlede bulunur", id: "Dengan kata kerja izin: kata ganti berada setelah infinitif, sebelum kata kerja izin, atau dalam anak kalimat dengan “que”", vi: "Với động từ cho phép: đại từ đứng sau động từ nguyên mẫu, trước động từ cho phép hoặc trong mệnh đề phụ với “que”" }, ex: { equivalence: [["Te permito ", { target: repetirlo }], [{ target: "Te lo" }, " permito repetir"], ["Te permito que ", { target: lo }, " repitas"]] }, tr: { en: "I allow you to repeat it.", uk: "Дозволяю тобі це повторити.", pt: "Eu te permito repetir isso.", fr: "Je te permets de le répéter.", de: "Ich erlaube dir, es zu wiederholen.", it: "Ti permetto di ripeterlo.", pl: "Pozwalam ci to powtórzyć.", tr: "Bunu tekrar etmene izin veriyorum.", id: "Saya mengizinkanmu mengulanginya.", vi: "Tôi cho phép bạn nhắc lại điều đó." } }
          - { level: C1, use: { es: "Con un verbo de percepción, el pronombre del infinitivo va con cualquiera de los dos verbos", en: "With a perception verb, the pronoun of the infinitive goes with either verb", uk: "З дієсловом сприйняття займенник інфінітива стоїть при будь-якому з двох дієслів", pt: "Com um verbo de percepção, o pronome do infinitivo vai com qualquer um dos dois verbos", fr: "Avec un verbe de perception, le pronom de l’infinitif se place avec l’un ou l’autre des deux verbes", de: "Bei einem Wahrnehmungsverb steht das Pronomen des Infinitivs bei einem der beiden Verben", it: "Con un verbo di percezione, il pronome dell’infinito sta con l’uno o con l’altro dei due verbi", pl: "Przy czasowniku percepcji zaimek bezokolicznika stoi przy każdym z dwóch czasowników", tr: "Algı fiilinde mastarın zamiri iki fiilden herhangi biriyle birlikte gelebilir", id: "Dengan kata kerja persepsi, kata ganti infinitif menyertai salah satu dari kedua kata kerja", vi: "Với động từ tri giác, đại từ của động từ nguyên mẫu đi với một trong hai động từ" }, ex: { equivalence: [[{ target: Lo }, " he visto hacer"], ["He visto ", { target: hacerlo }]] }, tr: { en: "I've seen it done.", uk: "Я бачив, як це роблять.", pt: "Eu já vi isso sendo feito.", fr: "Je l’ai vu faire.", de: "Ich habe gesehen, wie man es macht.", it: "L’ho visto fare.", pl: "Widziałem, jak to się robi.", tr: "Bunun yapıldığını gördüm.", id: "Saya pernah melihat hal itu dilakukan.", vi: "Tôi từng thấy người ta làm việc đó." } }
          - { level: C1, use: { es: "Con un verbo de percepción, el pronombre que es sujeto del infinitivo va delante del verbo de percepción", en: "With a perception verb, the pronoun that is the subject of the infinitive goes before the perception verb", uk: "З дієсловом сприйняття займенник, що є підметом інфінітива, стоїть перед дієсловом сприйняття", pt: "Com um verbo de percepção, o pronome que é sujeito do infinitivo vai antes do verbo de percepção", fr: "Avec un verbe de perception, le pronom qui est le sujet de l’infinitif se place devant le verbe de perception", de: "Bei einem Wahrnehmungsverb steht das Pronomen, das Subjekt des Infinitivs ist, vor dem Wahrnehmungsverb", it: "Con un verbo di percezione, il pronome che è soggetto dell’infinito va davanti al verbo di percezione", pl: "Przy czasowniku percepcji zaimek będący podmiotem bezokolicznika stoi przed czasownikiem percepcji", tr: "Algı fiilinde mastarın öznesi olan zamir, algı fiilinin önüne gelir", id: "Dengan kata kerja persepsi, kata ganti yang menjadi subjek infinitif berada sebelum kata kerja persepsi", vi: "Với động từ tri giác, đại từ là chủ ngữ của động từ nguyên mẫu đứng trước động từ tri giác" }, ex: [{ target: Lo }, " he visto robar."], tr: { en: "I've seen him steal.", uk: "Я бачив, як він краде.", pt: "Eu já o vi roubar.", fr: "Je l’ai vu voler.", de: "Ich habe ihn stehlen sehen.", it: "L’ho visto rubare.", pl: "Widziałem, jak kradnie.", tr: "Onu çalarken gördüm.", id: "Saya pernah melihat dia mencuri.", vi: "Tôi đã thấy anh ta ăn trộm." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A gerund or a command with a pronoun attached keeps its stress, so it takes a written accent:"
              es: "El gerundio o el imperativo con un pronombre unido mantiene su acento y lleva tilde:"
              uk: "Герундій чи наказова форма з приєднаним займенником зберігає свій наголос, тому отримує знак наголосу:"
              pt: "O gerúndio ou o imperativo com um pronome unido mantém a sílaba tônica, por isso leva acento gráfico:"
              fr: "Un gérondif ou un impératif avec un pronom collé garde sa syllabe accentuée, donc il prend un accent écrit :"
              de: "Ein Gerundium oder ein Imperativ mit angehängtem Pronomen behält seine Betonung und bekommt deshalb einen Akzent:"
              it: "Il gerundio o l’imperativo con un pronome attaccato mantiene l’accento, quindi porta l’accento scritto:"
              pl: "gerundio lub tryb rozkazujący z dołączonym zaimkiem zachowuje akcent, dlatego dostaje akcent graficzny:"
              tr: "Zamir eklenmiş gerundio ya da emir kipi vurgusunu korur, bu yüzden vurgu işareti alır:"
              id: "Gerundio atau imperatif dengan kata ganti yang melekat mempertahankan tekanannya, jadi diberi tanda aksen:"
              vi: "Gerundio hoặc câu mệnh lệnh có đại từ gắn vào giữ nguyên trọng âm, nên có dấu trọng âm:"
            ex: { examples: [{ target: leyéndolo }, { target: cómpralo }] }
            tr: { en: { examples: [reading it, buy it] }, uk: { examples: ["читаючи це", "купи це"] }, pt: { examples: ["lendo isso", "compre isso"] }, fr: { examples: ["en le lisant", "achète-le"] }, de: { examples: ["es lesend", "kauf es"] }, it: { examples: ["leggendolo", "compralo"] }, pl: { examples: ["czytając to", "kup to"] }, tr: { examples: ["onu okuyarak", "onu al"] }, id: { examples: ["sambil membacanya", "belilah"] }, vi: { examples: ["đang đọc nó", "hãy mua nó"] } }
