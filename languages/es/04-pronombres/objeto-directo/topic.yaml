        rows:
          - { level: C1, phrase: arreglárselas, meaning: { es: salir adelante, en: "to get by", uk: "давати собі раду", pt: "se virar", fr: "s’en sortir", de: "zurechtkommen", it: "cavarsela", pl: "dawać sobie radę", tr: "idare etmek", id: "bisa mengatasi masalah", vi: "xoay xở được" }, ex: ["Siempre ", { target: se las arregla }, " con poco dinero."], tr: { en: "He always gets by on little money.", uk: "Він завжди дає собі раду з малими грошима.", pt: "Ele sempre se vira com pouco dinheiro.", fr: "Il s’en sort toujours avec peu d’argent.", de: "Er kommt immer mit wenig Geld zurecht.", it: "Se la cava sempre con pochi soldi.", pl: "Zawsze daje sobie radę z małą ilością pieniędzy.", tr: "Az parayla hep idare eder.", id: "Dia selalu bisa mengatasi masalah dengan uang sedikit.", vi: "Anh ấy luôn xoay xở được với ít tiền." } }
          - { level: C1, phrase: fastidiarla, meaning: { es: equivocarse y estropear algo, en: "to make a mistake and spoil something", uk: "помилитися й усе зіпсувати", pt: "errar e estragar algo", fr: "se tromper et tout gâcher", de: "einen Fehler machen und etwas verderben", it: "sbagliare e rovinare qualcosa", pl: "pomylić się i coś zepsuć", tr: "hata yapıp bir şeyi bozmak", id: "berbuat salah dan merusak sesuatu", vi: "mắc lỗi và làm hỏng việc" }, ex: ["Si llegas tarde, ", { target: la fastidias }, "."], tr: { en: "If you arrive late, you'll mess it up.", uk: "Якщо спізнишся, усе зіпсуєш.", pt: "Se você chegar tarde, vai estragar tudo.", fr: "Si tu arrives en retard, tu gâches tout.", de: "Wenn du zu spät kommst, vermasselst du es.", it: "Se arrivi tardi, rovini tutto.", pl: "Jeśli się spóźnisz, wszystko zepsujesz.", tr: "Geç kalırsan her şeyi berbat edersin.", id: "Kalau kamu datang terlambat, kamu merusak semuanya.", vi: "Nếu bạn đến muộn, bạn sẽ làm hỏng hết." } }
          - { level: C1, phrase: tomarla con, meaning: { es: criticar o castigar a alguien sin motivo, en: "to criticise or punish someone for no reason", uk: "критикувати чи карати когось без причини", pt: "criticar ou castigar alguém sem motivo", fr: "critiquer ou punir quelqu’un sans raison", de: "jemanden ohne Grund kritisieren oder bestrafen", it: "criticare o punire qualcuno senza motivo", pl: "krytykować lub karać kogoś bez powodu", tr: "birini sebepsiz yere eleştirmek ya da cezalandırmak", id: "mengkritik atau menghukum seseorang tanpa alasan", vi: "chỉ trích hoặc phạt ai đó vô cớ" }, ex: ["El jefe ", { target: la ha tomado }, " conmigo."], tr: { en: "The boss has it in for me.", uk: "Начальник на мене визвірився.", pt: "O chefe pegou no meu pé.", fr: "Le patron s’en prend à moi.", de: "Der Chef hat es auf mich abgesehen.", it: "Il capo ce l’ha con me.", pl: "Szef się na mnie uwziął.", tr: "Patron bana sebepsiz yere çattı.", id: "Bos terus-menerus menyalahkan saya tanpa alasan.", vi: "Sếp cứ nhằm vào tôi." } }

