          tr: { en: "I've seen it done.", uk: "Я бачив, як це роблять.", pt: "Eu já vi isso sendo feito.", fr: "Je l’ai vu faire.", de: "Ich habe gesehen, wie man es macht.", it: "L’ho visto fare.", pl: "Widziałem, jak to się robi.", tr: "Bunun yapıldığını gördüm.", id: "Saya pernah melihat hal itu dilakukan.", vi: "Tôi từng thấy người ta làm việc đó." }
        - level: A2
