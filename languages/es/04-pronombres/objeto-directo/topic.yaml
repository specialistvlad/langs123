          - { level: B2, use: { es: "Con un uso intransitivo del verbo, el objeto no se nombra y no hay pronombre", en: "When the verb is used intransitively, the object is not named and there is no pronoun", uk: "Коли дієслово вжито неперехідно, додаток не називають і займенника немає", pt: "Com um uso intransitivo do verbo, o objeto não é nomeado e não há pronome", fr: "Quand le verbe est employé de façon intransitive, le COD n’est pas nommé et il n’y a pas de pronom", de: "Bei intransitivem Gebrauch des Verbs wird das Objekt nicht genannt und es gibt kein Pronomen", it: "Con un uso intransitivo del verbo, il complemento non è espresso e non c’è il pronome", pl: "Gdy czasownik jest użyty nieprzechodnio, dopełnienia się nie wymienia i zaimka nie ma", tr: "Fiil geçişsiz kullanıldığında nesne söylenmez ve zamir olmaz", id: "Jika kata kerja dipakai secara intransitif, objek tidak disebut dan tidak ada kata ganti", vi: "Khi động từ dùng như nội động từ, tân ngữ không được nêu và không có đại từ" }, ex: { exchange: ["¿Bebió alcohol?", ["No, no ", { target: bebió }, "."]] }, tr: { en: { exchange: ["Did he drink alcohol?", "No, he didn't drink."] }, uk: { exchange: ["Він пив алкоголь?", "Ні, не пив."] }, pt: { exchange: ["Ele bebeu álcool?", "Não, não bebeu."] }, fr: { exchange: ["Il a bu de l’alcool ?", "Non, il n’a pas bu."] }, de: { exchange: ["Hat er Alkohol getrunken?", "Nein, er hat nichts getrunken."] }, it: { exchange: ["Ha bevuto alcol?", "No, non ha bevuto."] }, pl: { exchange: ["Czy pił alkohol?", "Nie, nie pił."] }, tr: { exchange: ["Alkol içti mi?", "Hayır, içmedi."] }, id: { exchange: ["Apakah dia minum alkohol?", "Tidak, dia tidak minum."] }, vi: { exchange: ["Anh ấy có uống rượu không?", "Không, anh ấy không uống."] } } }
          - { level: C1, use: { es: "Sin pronombre, una parte del conjunto; con pronombre, todo el conjunto", en: "Without a pronoun, part of the set; with a pronoun, the whole set", uk: "Без займенника — частина цілого; із займенником — усе ціле", pt: "Sem pronome, uma parte do conjunto; com pronome, o conjunto inteiro", fr: "Sans pronom, une partie de l’ensemble ; avec pronom, tout l’ensemble", de: "Ohne Pronomen ein Teil der Menge; mit Pronomen die ganze Menge", it: "Senza pronome, una parte dell’insieme; con il pronome, tutto l’insieme", pl: "Bez zaimka mowa o części zbioru; z zaimkiem o całym zbiorze", tr: "Zamirsiz: kümenin bir kısmı; zamirli: kümenin tamamı", id: "Tanpa kata ganti, sebagian dari keseluruhan; dengan kata ganti, seluruhnya", vi: "Không có đại từ là một phần của cả tập hợp; có đại từ là cả tập hợp" }, ex: { examples: [["Hay bombones: ", { target: toma }, "."], ["Hay bombones: ", { target: tómalos }, "."]] }, tr: { en: { examples: ["There are chocolates: have some.", "There are chocolates: have them all."] }, uk: { examples: ["Є цукерки: візьми собі.", "Є цукерки: візьми їх усі."] }, pt: { examples: ["Tem bombons: pega alguns.", "Tem bombons: pega todos eles."] }, fr: { examples: ["Il y a des chocolats : prends-en.", "Il y a des chocolats : prends-les."] }, de: { examples: ["Es gibt Pralinen: nimm dir welche.", "Es gibt Pralinen: nimm sie alle."] }, it: { examples: ["Ci sono dei cioccolatini: prendine.", "Ci sono dei cioccolatini: prendili."] }, pl: { examples: ["Są czekoladki: weź sobie.", "Są czekoladki: weź je wszystkie."] }, tr: { examples: ["Çikolatalar var: al.", "Çikolatalar var: hepsini al."] }, id: { examples: ["Ada cokelat: ambillah beberapa.", "Ada cokelat: ambillah semuanya."] }, vi: { examples: ["Có sô-cô-la đây: lấy đi.", "Có sô-cô-la đây: lấy hết đi."] } } }
          - { level: C1, use: { es: "Con dos verbos transitivos que comparten el objeto, el pronombre del segundo es opcional", en: "With two transitive verbs that share the object, the pronoun of the second is optional", uk: "Коли два перехідні дієслова мають спільний додаток, займенник при другому необов’язковий", pt: "Com dois verbos transitivos que compartilham o objeto, o pronome do segundo é opcional", fr: "Avec deux verbes transitifs qui partagent le COD, le pronom du second est facultatif", de: "Bei zwei transitiven Verben mit gemeinsamem Objekt ist das Pronomen beim zweiten fakultativ", it: "Con due verbi transitivi che condividono il complemento, il pronome del secondo è facoltativo", pl: "Gdy dwa czasowniki przechodnie mają wspólne dopełnienie, zaimek przy drugim jest opcjonalny", tr: "Aynı nesneyi paylaşan iki geçişli fiilde ikincinin zamiri isteğe bağlıdır", id: "Dengan dua kata kerja transitif yang berbagi objek, kata ganti pada kata kerja kedua bersifat opsional", vi: "Với hai ngoại động từ dùng chung tân ngữ, đại từ của động từ thứ hai là tùy chọn" }, ex: ["Trae papel si ", { target: [{ optional: lo }, " tienen"] }, "."], tr: { en: "Bring some paper if they have it.", uk: "Принеси папір, якщо він у них є.", pt: "Traga papel, se eles tiverem.", fr: "Apporte du papier s’ils en ont.", de: "Bring Papier mit, falls sie welches haben.", it: "Porta della carta, se ce l’hanno.", pl: "Przynieś papier, jeśli go mają.", tr: "Kâğıt getir, eğer varsa.", id: "Bawa kertas kalau mereka punya.", vi: "Mang giấy đến nếu họ có." } }
          - { level: C1, use: { es: ["Con ", { term: haber }, ": ", { term: los hay }, " equivale a ", { term: hay algunos }], en: ["With ", { term: haber }, ": ", { term: los hay }, " means ", { term: hay algunos }], uk: ["З ", { term: haber }, ": ", { term: los hay }, " означає ", { term: hay algunos }], pt: ["Com ", { term: haber }, ": ", { term: los hay }, " equivale a ", { term: hay algunos }], fr: ["Avec ", { term: haber }, " : ", { term: los hay }, " équivaut à ", { term: hay algunos }], de: ["Mit ", { term: haber }, ": ", { term: los hay }, " entspricht ", { term: hay algunos }], it: ["Con ", { term: haber }, ": ", { term: los hay }, " equivale a ", { term: hay algunos }], pl: ["Z ", { term: haber }, ": ", { term: los hay }, " odpowiada ", { term: hay algunos }], tr: [{ term: haber }, " ile: ", { term: los hay }, ", ", { term: hay algunos }, " anlamına gelir"], id: ["Dengan ", { term: haber }, ": ", { term: los hay }, " sama dengan ", { term: hay algunos }], vi: ["Với ", { term: haber }, ": ", { term: los hay }, " tương đương ", { term: hay algunos }] }, ex: ["Muchos opinan igual, pero ", { target: los hay }, " que piensan lo contrario."], tr: { en: "Many people think the same, but there are some who think the opposite.", uk: "Багато хто думає так само, але є й такі, що думають навпаки.", pt: "Muitos pensam igual, mas há os que pensam o contrário.", fr: "Beaucoup pensent de même, mais il y en a qui pensent le contraire.", de: "Viele denken genauso, aber es gibt auch welche, die das Gegenteil denken.", it: "Molti la pensano allo stesso modo, ma ce ne sono che pensano il contrario.", pl: "Wielu myśli tak samo, ale są i tacy, którzy myślą odwrotnie.", tr: "Birçok kişi aynı şeyi düşünüyor, ama tersini düşünenler de var.", id: "Banyak orang berpendapat sama, tetapi ada juga yang berpikir sebaliknya.", vi: "Nhiều người nghĩ giống nhau, nhưng cũng có người nghĩ ngược lại." } }
