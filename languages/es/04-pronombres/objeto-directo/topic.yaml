id: es.pronombres.objeto-directo
lang: es
kind: grammar
tags: [pronouns, object, personal a, lo, la]
concepts: [object-pronouns, pronouns]
related: [es.pronombres.objeto-indirecto, es.pronombres.combinacion-pronombres, es.pronombres.pronombres-sujeto, es.pronombres.tu-usted-vosotros-ustedes]
status: { en: draft, es: draft, uk: draft }
translated: { en: "83a7d7 7a8368 0ddd9d 627da4 26044a 1ad694 d4e8a9 ef9573", uk: "83a7d7 7a8368 0ddd9d 627da4 26044a 1ad694 d4e8a9 ef9573" }

title: { en: Direct Object Pronouns and Personal a, es: El objeto directo y la a personal, uk: "Займенники прямого додатка й особове a" }
summary:
  lead:
    en: [{ term: Lo }, ", ", { term: la }, ", ", { term: los }, " and ", { term: las }, " replace a direct object, and a specific person as direct object takes ", { term: a }, "."]
    es: [{ term: Lo }, ", ", { term: la }, ", ", { term: los }, " y ", { term: las }, " sustituyen al objeto directo, y una persona concreta como objeto directo lleva ", { term: a }, "."]
    uk: [{ term: Lo }, ", ", { term: la }, ", ", { term: los }, " і ", { term: las }, " замінюють прямий додаток, а конкретна особа в ролі прямого додатка вимагає ", { term: a }, "."]
  rule:
    en: "The pronoun goes before a conjugated verb:"
    es: "El pronombre va delante del verbo conjugado:"
    uk: "Займенник стоїть перед дієсловом в особовій формі:"
  ex: { examples: [["¿El pan? ", { target: Lo }, " compro yo."], ["¿Y Ana? ", { target: La }, " veo mañana."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: { alternatives: [{ term: me }, { term: te }, { term: lo }, { term: la }, { term: nos }, { term: los }, { term: las }] }
            es: { alternatives: [{ term: me }, { term: te }, { term: lo }, { term: la }, { term: nos }, { term: los }, { term: las }] }
            uk: { alternatives: [{ term: me }, { term: te }, { term: lo }, { term: la }, { term: nos }, { term: los }, { term: las }] }
          ex: [{ target: Te }, " quiero."]
          tr: { en: I love you., uk: "Я тебе кохаю." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: os }, " for ", { term: vosotros }]
            es: [{ term: os }, " para ", { term: vosotros }]
            uk: [{ term: os }, " для ", { term: vosotros }]
          ex: [{ target: Os }, " espero en casa."]
          tr: { en: "I'll wait for you at home.", uk: "Чекаю вас удома." }
        - level: A2
          point: { en: Gender and number, es: Género y número, uk: "Рід і число" }
          rule:
            en: "the pronoun takes the gender and number of the noun"
            es: "el pronombre toma el género y el número del sustantivo"
            uk: "займенник має рід і число іменника"
          ex: ["¿La sopa? ", { target: La }, " hago yo."]
          tr: { en: "The soup? I'll make it.", uk: "Суп? Я його зварю." }
        - level: A2
          point: { en: Position, es: Posición, uk: "Місце" }
          rule:
            en: "before a conjugated verb"
            es: "delante del verbo conjugado"
            uk: "перед дієсловом в особовій формі"
          ex: [{ target: Lo }, " compro hoy."]
          tr: { en: "I'm buying it today.", uk: "Куплю його сьогодні." }
        - level: A2
          point: { en: Position, es: Posición, uk: "Місце" }
          rule:
            en: "attached to an infinitive or a gerund, or before the whole phrase"
            es: "unido al infinitivo o al gerundio, o delante de todo el grupo"
            uk: "приєднується до інфінітива чи герундія або стоїть перед усією групою"
          ex: { equivalence: [["Voy a ", { target: comprarlo }], [{ target: Lo }, " voy a comprar"]] }
          tr: { en: "I'm going to buy it.", uk: "Збираюся його купити." }
        - level: A2
          point: { en: Personal a, es: A personal, uk: "Особове a" }
          rule:
            en: [{ term: a }, " before a specific person or a pet"]
            es: [{ term: a }, " delante de una persona concreta o una mascota"]
            uk: [{ term: a }, " перед конкретною людиною чи домашньою твариною"]
          ex: ["Veo ", { target: a }, " María."]
          tr: { en: I can see María., uk: "Я бачу Марію." }
        - level: B1
          point: { en: Personal a, es: A personal, uk: "Особове a" }
          rule:
            en: [{ term: a }, " before ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }]
            es: [{ term: a }, " delante de ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }]
            uk: [{ term: a }, " перед ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }]
          ex: ["No conozco ", { target: a }, " nadie."]
          tr: { en: "I don't know anybody.", uk: "Я нікого не знаю." }
        - level: A2
          point: { en: An idea, es: Una idea, uk: "Ціла думка" }
          rule:
            en: [{ term: lo }, " replaces an idea or a whole sentence"]
            es: [{ term: lo }, " sustituye a una idea o a una frase entera"]
            uk: [{ term: lo }, " замінює думку чи ціле речення"]
          ex: ["No ", { target: lo }, " sé."]
          tr: { en: "I don't know.", uk: "Не знаю." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: tener }, " takes no ", { term: a }, ", even before people"]
            es: [{ term: tener }, " no lleva ", { term: a }, ", ni siquiera con personas"]
            uk: ["після ", { term: tener }, " немає ", { term: a }, ", навіть перед людьми"]
          ex: [{ target: Tengo dos }, " hermanos."]
          tr: { en: I have two brothers., uk: "У мене два брати." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: { mapping: [{ term: a el }, { term: al }] }
            es: { mapping: [{ term: a el }, { term: al }] }
            uk: { mapping: [{ term: a el }, { term: al }] }
          ex: ["Llamo ", { target: al }, " médico."]
          tr: { en: "I'm calling the doctor.", uk: "Я дзвоню лікареві." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The direct object receives the action of the verb: what or whom."
              es: "El objeto directo recibe la acción del verbo: qué o a quién."
              uk: "Прямий додаток — це те, на що спрямована дія дієслова: що або кого."
            ex: ["Compro ", { target: el pan }, "."]
            tr: { en: "I'm buying the bread.", uk: "Я купую хліб." }
          - type: rule
            level: A2
            text:
              en: "A pronoun replaces a direct object that is already known:"
              es: "Un pronombre sustituye a un objeto directo ya conocido:"
              uk: "Займенник замінює вже відомий прямий додаток:"
            ex: ["¿El pan? ", { target: Lo }, " compro yo."]
            tr: { en: "The bread? I'll buy it.", uk: "Хліб? Я його куплю." }
          - type: note
            level: A2
            text:
              en: ["Pronouns for “to whom” or “for whom”: ", { link: "Indirect Object Pronouns", to: es.pronombres.objeto-indirecto }, "."]
              es: ["Los pronombres de “a quién” o “para quién”: ", { link: "El objeto indirecto", to: es.pronombres.objeto-indirecto }, "."]
              uk: ["Займенники для «кому» чи «для кого»: ", { link: "Займенники непрямого додатка", to: es.pronombres.objeto-indirecto }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto, uk: "Підмет" } }
          - { key: object, label: { en: Direct object, es: Objeto directo, uk: "Прямий додаток" } }
        rows:
          - { level: A2, features: { person: 1, number: sg, case: acc }, subject: yo, object: { target: me } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm, case: acc }, subject: tú, object: { target: te } }
          - { level: A2, features: [{ person: 3, number: sg, gender: masc, case: acc }, { person: 2, number: sg, politeness: form, gender: masc, case: acc }], subject: { alternatives: [él, usted] }, object: { target: lo } }
          - { level: A2, features: [{ person: 3, number: sg, gender: fem, case: acc }, { person: 2, number: sg, politeness: form, gender: fem, case: acc }], subject: { alternatives: [ella, usted] }, object: { target: la } }
          - { level: A2, features: { person: 1, number: pl, case: acc }, subject: { alternatives: [nosotros, nosotras] }, object: { target: nos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm, case: acc }, subject: { alternatives: [vosotros, vosotras] }, object: { target: os } }
          - { level: A2, features: [{ person: 3, number: pl, gender: masc, case: acc }, { person: 2, number: pl, gender: masc, case: acc }], subject: { alternatives: [ellos, ustedes] }, object: { target: los } }
          - { level: A2, features: [{ person: 3, number: pl, gender: fem, case: acc }, { person: 2, number: pl, gender: fem, case: acc }], subject: { alternatives: [ellas, ustedes] }, object: { target: las } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " take the gender and number of the noun they replace:"]
              es: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " toman el género y el número del sustantivo que sustituyen:"]
              uk: [{ alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " мають рід і число іменника, який замінюють:"]
            ex: { examples: [["¿Los zapatos? ", { target: Los }, " compro hoy."], ["¿Las llaves? ", { target: Las }, " tengo yo."]] }
            tr: { en: { examples: ["The shoes? I'm buying them today.", "The keys? I've got them."] }, uk: { examples: ["Черевики? Куплю їх сьогодні.", "Ключі? Вони в мене."] } }
          - type: rule
            level: A2
            text:
              en: "A noun with no article, or with an indefinite one, takes no pronoun in the answer:"
              es: "Un sustantivo sin artículo, o con un indefinido, no lleva pronombre en la respuesta:"
              uk: "Іменник без артикля або з неозначеним артиклем у відповіді займенником не замінюють:"
            ex: { exchange: ["¿Tienes hermanos?", ["Sí, ", { target: tengo }, " dos."]] }
            tr: { en: { exchange: [Have you got any brothers or sisters?, "Yes, I have two."] }, uk: { exchange: ["У тебе є брати чи сестри?", "Так, двоє."] } }
  - title: { en: Where the pronoun goes, es: Dónde va el pronombre, uk: "Де стоїть займенник" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Position, es: Posición, uk: "Місце" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: Before a conjugated verb, es: Delante del verbo conjugado, uk: "Перед дієсловом в особовій формі" }, ex: [{ target: Lo }, " compro hoy."], tr: { en: "I'm buying it today.", uk: "Куплю його сьогодні." } }
          - { level: A2, use: { en: ["Between ", { term: "no" }, " and the verb"], es: ["Entre ", { term: "no" }, " y el verbo"], uk: ["Між ", { term: "no" }, " і дієсловом"] }, ex: ["No ", { target: la }, " conozco."], tr: { en: "I don't know her.", uk: "Я її не знаю." } }
          - { level: A2, use: { en: "With an infinitive: attached, or before the whole phrase", es: "Con infinitivo: unido, o delante de todo el grupo", uk: "З інфінітивом: приєднується або стоїть перед усією групою" }, ex: { equivalence: [["Voy a ", { target: comprarlo }], [{ target: Lo }, " voy a comprar"]] }, tr: { en: "I'm going to buy it.", uk: "Збираюся його купити." } }
          - { level: A2, use: { en: "With a gerund: attached, or before the whole phrase", es: "Con gerundio: unido, o delante de todo el grupo", uk: "З герундієм: приєднується або стоїть перед усією групою" }, ex: { equivalence: [["Estoy ", { target: leyéndolo }], [{ target: Lo }, " estoy leyendo"]] }, tr: { en: "I'm reading it.", uk: "Я це читаю." } }
          - { level: A2, use: { en: Attached to an affirmative command, es: Unido al imperativo afirmativo, uk: "Приєднується до стверджувальної наказової форми" }, ex: [{ target: Cómpralo }, "."], tr: { en: Buy it., uk: "Купи його." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A gerund or a command with a pronoun attached keeps its stress, so it takes a written accent:"
              es: "El gerundio o el imperativo con un pronombre unido mantiene su acento y lleva tilde:"
              uk: "Герундій чи наказова форма з приєднаним займенником зберігає свій наголос, тому отримує графічний наголос:"
            ex: { examples: [{ target: leyéndolo }, { target: cómpralo }] }
            tr: { en: { examples: [reading it, buy it] }, uk: { examples: ["читаючи це", "купи це"] } }

  - title: { en: The personal a, es: La a personal, uk: "Особове a" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: [{ term: a }, ": a specific person"], es: [{ term: a }, ": una persona concreta"], uk: [{ term: a }, ": конкретна людина"] }, ex: ["Veo ", { target: a }, " María."], tr: { en: I can see María., uk: "Я бачу Марію." } }
          - { level: A2, use: { en: [{ term: a }, ": a pet"], es: [{ term: a }, ": una mascota"], uk: [{ term: a }, ": домашня тварина"] }, ex: ["Paseo ", { target: a }, " mi perro."], tr: { en: I walk my dog., uk: "Я вигулюю свого собаку." } }
          - level: B1
            use: { en: [{ term: a }, ": ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }], es: [{ term: a }, ": ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }], uk: [{ term: a }, ": ", { alternatives: [{ term: quién }, { term: alguien }, { term: nadie }] }] }
            ex: { examples: [["¿", { target: A }, " quién buscas?"], ["No conozco ", { target: a }, " nadie."]] }
            tr: { en: { examples: [Who are you looking for?, "I don't know anyone."] }, uk: { examples: ["Кого ти шукаєш?", "Я нікого не знаю."] } }
          - { level: A2, use: { en: ["No ", { term: a }, ": a thing"], es: ["Sin ", { term: a }, ": una cosa"], uk: ["Без ", { term: a }, ": річ"] }, ex: ["Veo ", { target: la casa }, "."], tr: { en: I can see the house., uk: "Я бачу будинок." } }
          - { level: A2, use: { en: ["No ", { term: a }, ": ", { term: tener }], es: ["Sin ", { term: a }, ": ", { term: tener }], uk: ["Без ", { term: a }, ": ", { term: tener }] }, ex: [{ target: Tengo dos }, " hermanos."], tr: { en: I have two brothers., uk: "У мене два брати." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: a }, " and ", { term: el }, " join into ", { term: al }, ":"]
              es: [{ term: a }, " y ", { term: el }, " se unen en ", { term: al }, ":"]
              uk: [{ term: a }, " і ", { term: el }, " зливаються в ", { term: al }, ":"]
            ex: ["Llamo ", { target: al }, " médico."]
            tr: { en: "I'm calling the doctor.", uk: "Я дзвоню лікареві." }

  - title: { en: Lo for an idea, es: Lo para una idea, uk: "Lo для цілої думки" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: lo }, " replaces an idea or a whole sentence:"]
              es: [{ term: lo }, " sustituye a una idea o a una frase entera:"]
              uk: [{ term: lo }, " замінює думку чи ціле речення:"]
            ex: { exchange: ["¿Sabes dónde vive Ana?", ["No, no ", { target: lo }, " sé."]] }
            tr: { en: { exchange: [Do you know where Ana lives?, "No, I don't know."] }, uk: { exchange: ["Знаєш, де живе Ана?", "Ні, не знаю."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: lo }, " also replaces an adjective after ", { term: estar }, ":"]
              es: [{ term: lo }, " también sustituye a un adjetivo después de ", { term: estar }, ":"]
              uk: [{ term: lo }, " також замінює прикметник після ", { term: estar }, ":"]
            ex: { exchange: ["¿Estás cansada?", ["Sí, ", { target: lo }, " estoy."]] }
            tr: { en: { exchange: [Are you tired?, "Yes, I am."] }, uk: { exchange: ["Ти втомилася?", "Так, утомилася."] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Compro lo hoy., right: [{ target: Lo }, " compro hoy."], rule: { en: "the pronoun goes before a conjugated verb", es: "el pronombre va delante del verbo conjugado", uk: "займенник стоїть перед дієсловом в особовій формі" } }
          - { level: A2, wrong: Voy a lo comprar., right: ["Voy a ", { target: comprarlo }, "."], rule: { en: "the pronoun joins the infinitive or goes before the whole phrase", es: "el pronombre se une al infinitivo o va delante de todo el grupo", uk: "займенник приєднується до інфінітива або стоїть перед усією групою" } }
          - { level: A2, wrong: "¿La sopa? Lo hago yo.", right: ["¿La sopa? ", { target: La }, " hago yo."], rule: { en: ["the pronoun takes the gender of the noun: ", { term: la sopa }], es: ["el pronombre toma el género del sustantivo: ", { term: la sopa }], uk: ["займенник має рід іменника: ", { term: la sopa }] } }
          - { level: A2, speakers: [uk], wrong: "¿La leche? Lo compro yo.", right: ["¿La leche? ", { target: La }, " compro yo."], rule: { uk: ["рід іспанського іменника не завжди збігається з українським: ", { term: la leche }, " — жіночого роду, тож ", { term: la }] } }
          - { level: A2, wrong: Veo María., right: ["Veo ", { target: a }, " María."], rule: { en: ["a specific person takes ", { term: a }], es: ["una persona concreta lleva ", { term: a }], uk: ["конкретна людина вимагає ", { term: a }] } }
          - { level: A2, wrong: Tengo a dos hermanos., right: [{ target: Tengo dos }, " hermanos."], rule: { en: [{ term: tener }, " takes no ", { term: a }], es: [{ term: tener }, " no lleva ", { term: a }], uk: ["після ", { term: tener }, " немає ", { term: a }] } }
          - { level: A2, speakers: [en, uk], wrong: Veo él., right: [{ target: Lo }, " veo."], rule: { en: ["“him” as a direct object is ", { term: lo }, ", before the verb"], uk: ["«його» в ролі прямого додатка — це ", { term: lo }, ", і він стоїть перед дієсловом"] } }
