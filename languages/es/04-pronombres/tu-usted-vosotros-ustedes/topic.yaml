title: { en: "Forms of Address: tú, usted, vosotros, ustedes", es: "Tú, usted, vosotros, ustedes", uk: "Форми звертання: tú, usted, vosotros, ustedes", pt: "Formas de tratamento: tú, usted, vosotros, ustedes", fr: "Formes d’adresse : tú, usted, vosotros, ustedes", de: "Anredeformen: tú, usted, vosotros, ustedes", it: "Forme di cortesia: tú, usted, vosotros, ustedes", pl: "Formy zwracania się: tú, usted, vosotros, ustedes", tr: "Hitap biçimleri: tú, usted, vosotros, ustedes", id: "Bentuk sapaan: tú, usted, vosotros, ustedes", vi: "Cách xưng hô: tú, usted, vosotros, ustedes" }
summary:
  lead:
    en: ["Spanish has a familiar “you”, ", { term: tú }, ", and a formal one, ", { term: usted }, ", each with its plural."]
    es: ["El español tiene un tratamiento de confianza, ", { term: tú }, ", y otro formal, ", { term: usted }, ", cada uno con su plural."]
    uk: ["В іспанській є звертання на «ти», ", { term: tú }, ", і ввічливе звертання, ", { term: usted }, ", кожне зі своєю множиною."]
    pt: ["O espanhol tem um tratamento informal, ", { term: "tú" }, ", e outro formal, ", { term: "usted" }, ", cada um com seu plural."]
    fr: ["L’espagnol a une forme de tutoiement, ", { term: "tú" }, ", et une forme de vouvoiement, ", { term: "usted" }, ", chacune avec son pluriel."]
    de: ["Das Spanische hat eine vertraute Anrede, ", { term: "tú" }, ", und eine höfliche, ", { term: "usted" }, ", jeweils mit eigenem Plural."]
    it: ["Lo spagnolo ha una forma di confidenza, ", { term: "tú" }, ", e una di cortesia, ", { term: "usted" }, ", ciascuna con il suo plurale."]
    pl: ["Hiszpański ma zwrot na „ty”, ", { term: "tú" }, ", i zwrot grzecznościowy, ", { term: "usted" }, ", każdy ze swoją liczbą mnogą."]
    tr: ["İspanyolcada samimi bir hitap, ", { term: "tú" }, ", ve resmî bir hitap, ", { term: "usted" }, ", vardır; ikisinin de çoğulu vardır."]
    id: ["Bahasa Spanyol punya sapaan akrab, ", { term: "tú" }, ", dan sapaan formal, ", { term: "usted" }, ", masing-masing dengan bentuk jamaknya."]
    vi: ["Tiếng Tây Ban Nha có cách xưng hô thân mật, ", { term: "tú" }, ", và cách xưng hô lịch sự, ", { term: "usted" }, ", mỗi cách đều có dạng số nhiều."]
  rule:
    en: [{ term: Usted }, " and ", { term: ustedes }, " take the verb forms of ", { term: él }, " and ", { term: ellos }, ":"]
    es: [{ term: Usted }, " y ", { term: ustedes }, " llevan las formas del verbo de ", { term: él }, " y ", { term: ellos }, ":"]
