# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pronombres.tu-usted-vosotros-ustedes
lang: es
kind: grammar
tags: [pronouns, address, formality, tú, usted]
concepts: [address, pronouns]
related: [es.pronombres.pronombres-sujeto, es.pronombres.objeto-directo, es.pronombres.objeto-indirecto, es.sustantivo-determinantes.posesivos, es.ser-estar-hay-gustar.ser-estar]
status: { en: draft, es: draft }
translated: { es: "1e7b63 1c34aa 3a571f 8b0d55 fe9fc6 d92e65 366352" }

title: { en: "Forms of Address: tú, usted, vosotros, ustedes", es: "Tú, usted, vosotros, ustedes" }
summary:
  lead:
    en: ["Spanish has a familiar “you”, ", { term: tú }, ", and a formal one, ", { term: usted }, ", each with its plural."]
    es: ["El español tiene un tratamiento de confianza, ", { term: tú }, ", y otro formal, ", { term: usted }, ", cada uno con su plural."]
  rule:
    en: [{ term: Usted }, " and ", { term: ustedes }, " take the verb forms of ", { term: él }, " and ", { term: ellos }, ":"]
    es: [{ term: Usted }, " y ", { term: ustedes }, " llevan las formas del verbo de ", { term: él }, " y ", { term: ellos }, ":"]
  ex: { examples: [["¿Cómo ", { target: está }, " usted?"], ["¿Cómo ", { target: están }, " ustedes?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: tú
          rule:
            en: "one person you know well: friends, family, children"
            es: "una persona de confianza: amigos, familia, niños"
          ex: ["¿", { target: Tienes }, " hambre?"]
          tr: { en: Are you hungry? }
        - level: A1
          point: usted
          rule:
            en: "one person, formally: strangers, older people, customers"
            es: "una persona, con respeto: desconocidos, mayores, clientes"
          ex: ["¿", { target: Tiene }, " usted hora?"]
          tr: { en: Do you have the time? }
        - level: A1
          variety: es-419
          point: ustedes
          rule:
            en: "any group: friends or strangers"
            es: "cualquier grupo: amigos o desconocidos"
          ex: ["Chicos, ¿", { target: tienen }, " hambre?"]
          tr: { en: "Guys, are you hungry?" }
        - level: A1
          variety: es-ES
          point: vosotros
          rule:
            en: "a group you know well"
            es: "un grupo de confianza"
          ex: ["Chicos, ¿", { target: tenéis }, " hambre?"]
          tr: { en: "Guys, are you hungry?" }
        - level: A1
          variety: es-ES
          point: ustedes
          rule:
            en: "a group, formally"
            es: "un grupo, con respeto"
          ex: ["¿Qué ", { target: desean }, ", señores?"]
          tr: { en: What would you like? }
        - level: A2
          point: { en: Possessive, es: Posesivo }
          rule:
            en: [{ term: usted }, " and ", { term: ustedes }, " take ", { term: su }, " for “your”"]
            es: [{ term: usted }, " y ", { term: ustedes }, " llevan ", { term: su }]
          ex: ["¿Es ", { target: su }, " maleta, señor?"]
          tr: { en: "Is this your suitcase, sir?" }
        - level: A2
          point: { en: Object, es: Objeto }
          rule:
            en: [{ term: usted }, " takes ", { term: lo }, ", ", { term: la }, " and ", { term: le }, ", like ", { term: él }, " and ", { term: ella }]
            es: [{ term: usted }, " lleva ", { term: lo }, ", ", { term: la }, " y ", { term: le }, ", como ", { term: él }, " y ", { term: ella }]
          ex: ["Señora, ", { target: la }, " llamo mañana."]
          tr: { en: "Madam, I'll call you tomorrow." }
        - level: A2
          variety: es-419
          point: vos
          rule:
            en: ["replaces ", { term: tú }, " in Argentina, Uruguay and Central America"]
            es: ["sustituye a ", { term: tú }, " en Argentina, Uruguay y Centroamérica"]
          ex: ["¿Vos ", { target: tenés }, " tiempo?"]
          tr: { en: Do you have time? }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: usted }, " takes the verb form of ", { term: él }, ", never of ", { term: tú }]
            es: [{ term: usted }, " lleva la forma de ", { term: él }, ", nunca la de ", { term: tú }]
          ex: ["¿Usted ", { target: es }, " de aquí?"]
          tr: { en: Are you from here? }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Spanish has a familiar “you” and a formal one, in the singular and in the plural."
              es: "El español tiene un tratamiento de confianza y otro formal, en singular y en plural."
          - type: note
            level: A1
            text:
              en: ["The other subject pronouns: ", { link: "Subject Pronouns", to: es.pronombres.pronombres-sujeto }, "."]
              es: ["Los demás pronombres sujeto: ", { link: "Los pronombres sujeto", to: es.pronombres.pronombres-sujeto }, "."]

  - title: { en: "Form: the four forms", es: "Forma: las cuatro formas" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: hablar, label: hablar }
          - { key: ser, label: ser }
        rows:
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, form: { target: tú }, hablar: { target: hablas }, ser: { target: eres } }
          - { level: A1, features: { person: 2, number: sg, politeness: form }, form: { target: usted }, hablar: { target: habla }, ser: { target: es } }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, form: { alternatives: [{ target: vosotros }, { target: vosotras }] }, hablar: { target: habláis }, ser: { target: sois } }
          - { level: A1, features: { person: 2, number: pl }, form: { target: ustedes }, hablar: { target: hablan }, ser: { target: son } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: usted }, " and ", { term: ustedes }, " take the verb forms of ", { term: él }, " and ", { term: ellos }, ":"]
              es: [{ term: usted }, " y ", { term: ustedes }, " llevan las formas del verbo de ", { term: él }, " y ", { term: ellos }, ":"]
            ex: { examples: [["¿Usted ", { target: es }, " de aquí?"], ["¿Ustedes ", { target: son }, " de aquí?"]] }
            tr: { en: { examples: [Are you from here?, Are you all from here?] } }
          - type: note
            level: A2
            text:
              en: ["In writing, ", { term: usted }, " and ", { term: ustedes }, " are often shortened to ", { term: Ud. }, " and ", { term: Uds. }, "."]
              es: ["Por escrito, ", { term: usted }, " y ", { term: ustedes }, " se abrevian a menudo en ", { term: Ud. }, " y ", { term: Uds. }, "."]

  - title: { en: "Use: who gets which form", es: "Uso: quién recibe cada forma" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: [{ term: tú }, ": friends, family, children, people your age"], es: [{ term: tú }, ": amigos, familia, niños, gente de tu edad"] }, ex: ["¿Cómo ", { target: estás }, ", Marta?"], tr: { en: "How are you, Marta?" } }
          - { level: A1, use: { en: [{ term: usted }, ": strangers, older people, customers, officials"], es: [{ term: usted }, ": desconocidos, mayores, clientes, funcionarios"] }, ex: ["¿Cómo ", { target: está }, ", señora?"], tr: { en: "How are you, madam?" } }
          - { level: A1, variety: es-419, use: { en: [{ term: ustedes }, ": any group, friends or strangers"], es: [{ term: ustedes }, ": cualquier grupo, amigos o desconocidos"] }, ex: ["¿Cómo ", { target: están }, ", chicos?"], tr: { en: "How are you, guys?" } }
          - { level: A1, variety: es-ES, use: { en: [{ term: vosotros }, ": a group of friends or family"], es: [{ term: vosotros }, ": un grupo de amigos o familia"] }, ex: ["¿Cómo ", { target: estáis }, ", chicos?"], tr: { en: "How are you, guys?" } }
          - { level: A1, variety: es-ES, use: { en: [{ term: ustedes }, ": a group of strangers, formally"], es: [{ term: ustedes }, ": un grupo de desconocidos, con respeto"] }, ex: ["¿Qué ", { target: desean }, ", señores?"], tr: { en: What would you like? } }
      - type: list
        items:
          - type: note
            level: A1
            variety: es-ES
            text:
              en: ["In Spain, ", { term: tú }, " is common with strangers of your own age, in shops and at work."]
              es: ["En España, ", { term: tú }, " es habitual con desconocidos de tu edad, en las tiendas y en el trabajo."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Colombia and Costa Rica, ", { term: usted }, " is common even among family and friends."]
              es: ["En Colombia y Costa Rica, ", { term: usted }, " es habitual incluso entre familiares y amigos."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Argentina, Uruguay and Central America, ", { term: vos }, " replaces ", { term: tú }, ", with its own present forms:"]
              es: ["En Argentina, Uruguay y Centroamérica, ", { term: vos }, " sustituye a ", { term: tú }, ", con sus propias formas de presente:"]
            ex: { examples: [["¿Vos ", { target: tenés }, " tiempo?"], ["Vos ", { target: sos }, " de acá."]] }
            tr: { en: { examples: [Do you have time?, "You're from here."] } }
          - type: rule
            level: A2
            text:
              en: ["The verb ", { term: tutear }, " means to address someone as ", { term: tú }, ":"]
              es: ["El verbo ", { term: tutear }, " significa tratar a alguien de ", { term: tú }, ":"]
            ex: ["¿Nos ", { target: tuteamos }, "?"]
            tr: { en: Shall we use tú? }

  - title: { en: "Usted with other words", es: "Usted con otras palabras" }
    role: own
    content:
      - type: usage
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, point: { en: ["Possessive: ", { term: su }, ", ", { term: sus }], es: ["Posesivo: ", { term: su }, ", ", { term: sus }] }, ex: ["¿Es ", { target: su }, " maleta, señor?"], tr: { en: "Is this your suitcase, sir?" } }
          - { level: A2, point: { en: ["Direct object: ", { term: lo }, ", ", { term: la }], es: ["Objeto directo: ", { term: lo }, ", ", { term: la }] }, ex: ["Señora, ", { target: la }, " llamo mañana."], tr: { en: "Madam, I'll call you tomorrow." } }
          - { level: A2, point: { en: ["Indirect object: ", { term: le }], es: ["Objeto indirecto: ", { term: le }] }, ex: ["Señor, ¿", { target: le }, " traigo la cuenta?"], tr: { en: "Sir, shall I bring you the bill?" } }
          - { level: A2, point: { en: ["Plural: ", { term: su }, ", ", { term: les }], es: ["Plural: ", { term: su }, ", ", { term: les }] }, ex: ["Señores, ", { target: les }, " traigo la carta."], tr: { en: "I'll bring you the menu." } }
          - { level: A2, point: { en: After a preposition, es: Después de preposición }, ex: ["Esto es para ", { target: usted }, "."], tr: { en: This is for you. } }
          - { level: A2, variety: es-ES, point: { en: [{ term: vosotros }, ": ", { term: vuestro }, ", ", { term: os }], es: [{ term: vosotros }, ": ", { term: vuestro }, ", ", { term: os }] }, ex: ["Chicos, ", { target: os }, " llamo mañana."], tr: { en: "Guys, I'll call you tomorrow." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: su }, " means “your” for ", { term: usted }, ", and also “his”, “her” and “their”: the context tells which."]
              es: [{ term: su }, " vale para ", { term: usted }, ", y también para ", { term: él }, ", ", { term: ella }, " y ", { term: ellos }, ": el contexto lo aclara."]

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: "¿Usted eres de aquí?", right: ["¿Usted ", { target: es }, " de aquí?"], rule: { en: [{ term: usted }, " takes the verb form of ", { term: él }], es: [{ term: usted }, " lleva la forma del verbo de ", { term: él }] } }
          - { level: A2, wrong: "¿Usted tiene tu pasaporte?", right: ["¿Usted tiene ", { target: su }, " pasaporte?"], rule: { en: [{ term: usted }, " takes ", { term: su }], es: [{ term: usted }, " lleva ", { term: su }] } }
          - { level: A2, wrong: "Señora, te llamo mañana.", right: ["Señora, ", { target: la }, " llamo mañana."], rule: { en: [{ term: usted }, " takes ", { term: lo }, " or ", { term: la }, ", like ", { term: él }, " and ", { term: ella }], es: [{ term: usted }, " lleva ", { term: lo }, " o ", { term: la }, ", como ", { term: él }, " y ", { term: ella }] } }
