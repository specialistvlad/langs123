sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Spanish has a familiar “you” and a formal one, in the singular and in the plural."
              es: "El español tiene un tratamiento de confianza y otro formal, en singular y en plural."
              uk: "В іспанській є звертання на «ти» і ввічливе звертання — в однині й у множині."
              pt: "O espanhol tem um tratamento informal e outro formal, no singular e no plural."
              fr: "L’espagnol a une forme de tutoiement et une de vouvoiement, au singulier et au pluriel."
              de: "Das Spanische hat eine vertraute und eine höfliche Anrede, im Singular und im Plural."
              it: "Lo spagnolo ha una forma di confidenza e una di cortesia, al singolare e al plurale."
              pl: "Hiszpański ma zwrot na „ty” i zwrot grzecznościowy, w liczbie pojedynczej i mnogiej."
