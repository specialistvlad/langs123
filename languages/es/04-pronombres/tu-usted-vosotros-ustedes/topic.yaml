    pt: [{ term: "Usted" }, " e ", { term: "ustedes" }, " usam as formas do verbo de ", { term: "él" }, " e ", { term: "ellos" }, ":"]
    fr: [{ term: "Usted" }, " et ", { term: "ustedes" }, " prennent les formes du verbe de ", { term: "él" }, " et ", { term: "ellos" }, " :"]
    de: [{ term: "Usted" }, " und ", { term: "ustedes" }, " haben die Verbformen von ", { term: "él" }, " und ", { term: "ellos" }, ":"]
    it: [{ term: "Usted" }, " e ", { term: "ustedes" }, " hanno le forme verbali di ", { term: "él" }, " e ", { term: "ellos" }, ":"]
    pl: [{ term: "Usted" }, " i ", { term: "ustedes" }, " mają formy czasownika takie jak ", { term: "él" }, " i ", { term: "ellos" }, ":"]
    tr: [{ term: "Usted" }, " ve ", { term: "ustedes" }, ", fiil çekiminde ", { term: "él" }, " ve ", { term: "ellos" }, " ile aynı biçimleri alır:"]
    id: [{ term: "Usted" }, " dan ", { term: "ustedes" }, " memakai bentuk kata kerja seperti ", { term: "él" }, " dan ", { term: "ellos" }, ":"]
    vi: [{ term: "Usted" }, " và ", { term: "ustedes" }, " dùng dạng động từ giống như ", { term: "él" }, " và ", { term: "ellos" }, ":"]
