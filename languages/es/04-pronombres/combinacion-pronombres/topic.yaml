          ex: [{ target: Se me }, " perdió la llave."]
          tr: { en: "I lost the key.", uk: "Я загубив ключ.", pt: "Eu perdi a chave.", fr: "J’ai perdu la clé.", de: "Mir ist der Schlüssel verloren gegangen.", it: "Ho perso la chiave.", pl: "Zgubiłem klucz.", tr: "Anahtarı kaybettim.", id: "Kunci saya hilang.", vi: "Tôi làm mất chìa khóa." }
