          rule: { es: ["el objeto indirecto pasa a ", { term: a }, " y un pronombre tónico"], en: ["the indirect object becomes ", { term: "a" }, " plus a stressed pronoun"], uk: ["непрямий додаток переходить у ", { term: "a" }, " з наголошеним займенником"], pt: ["o objeto indireto passa a ", { term: "a" }, " e um pronome tônico"], fr: ["le COI passe à ", { term: "a" }, " et un pronom tonique"], de: ["das indirekte Objekt wird zu ", { term: "a" }, " und einem betonten Pronomen"], it: ["il complemento indiretto passa a ", { term: "a" }, " con un pronome tonico"], pl: ["dopełnienie dalsze przechodzi na ", { term: "a" }, " z zaimkiem akcentowanym"], tr: ["dolaylı nesne ", { term: "a" }, " ve vurgulu bir zamirle ifade edilir"], id: ["objek tak langsung berubah menjadi ", { term: "a" }, " dan kata ganti bertekanan"], vi: ["tân ngữ gián tiếp chuyển thành ", { term: "a" }, " và một đại từ nhấn"] }
          ex: ["Me entregaron ", { target: a él }, "."]
          tr: { en: "They handed me over to him.", uk: "Мене передали йому.", pt: "Me entregaram a ele.", fr: "On m’a remis à lui.", de: "Man hat mich ihm übergeben.", it: "Mi hanno consegnato a lui.", pl: "Oddano mnie jemu.", tr: "Beni ona teslim ettiler.", id: "Saya diserahkan kepadanya.", vi: "Họ giao tôi cho anh ấy." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: le }, " never stands before ", { term: lo }, ": it is always ", { term: se lo }]
            es: [{ term: le }, " nunca va delante de ", { term: lo }, ": siempre es ", { term: se lo }]
            uk: [{ term: le }, " ніколи не стоїть перед ", { term: lo }, ": завжди ", { term: se lo }]
            pt: [{ term: le }, " nunca vem antes de ", { term: lo }, ": é sempre ", { term: se lo }]
            fr: [{ term: le }, " ne se met jamais devant ", { term: lo }, " : on dit toujours ", { term: se lo }]
            de: [{ term: le }, " steht nie vor ", { term: lo }, ": Es heißt immer ", { term: se lo }]
            it: [{ term: le }, " non sta mai davanti a ", { term: lo }, ": è sempre ", { term: se lo }]
            pl: [{ term: le }, " nigdy nie stoi przed ", { term: lo }, ": zawsze jest ", { term: se lo }]
            tr: [{ term: le }, " asla ", { term: lo }, " önünde durmaz: her zaman ", { term: se lo }, " olur"]
            id: [{ term: le }, " tidak pernah berada di depan ", { term: lo }, ": selalu ", { term: se lo }]
            vi: [{ term: le }, " không bao giờ đứng trước ", { term: lo }, ": luôn là ", { term: se lo }]
          ex: [{ target: Se lo }, " explico."]
          tr: { en: "I'll explain it to him.", uk: "Я йому це поясню.", pt: "Eu explico isso para ele.", fr: "Je le lui explique.", de: "Ich erkläre es ihm.", it: "Glielo spiego.", pl: "Wyjaśnię mu to.", tr: "Ona açıklarım.", id: "Saya jelaskan itu kepadanya.", vi: "Tôi giải thích điều đó cho anh ấy." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A sentence can carry two object pronouns: the indirect one, to whom, and the direct one, what."
              es: "Una frase puede llevar dos pronombres de objeto: el indirecto, a quién, y el directo, qué."
              uk: "У реченні може бути два займенники-додатки: непрямий — кому, і прямий — що."
              pt: "Uma frase pode ter dois pronomes de objeto: o indireto, a quem, e o direto, o quê."
              fr: "Une phrase peut contenir deux pronoms compléments : l’indirect, à qui, et le direct, quoi."
              de: "Ein Satz kann zwei Objektpronomen enthalten: das indirekte, wem, und das direkte, was."
              it: "Una frase può avere due pronomi complemento: quello indiretto, a chi, e quello diretto, che cosa."
              pl: "Zdanie może mieć dwa zaimki dopełnienia: zaimek dopełnienia dalszego, komu, i bliższego, co."
              tr: "Bir cümlede iki nesne zamiri olabilir: dolaylı olan, kime, ve doğrudan olan, neyi."
              id: "Satu kalimat dapat memuat dua kata ganti objek: yang tak langsung, kepada siapa, dan yang langsung, apa."
              vi: "Một câu có thể có hai đại từ tân ngữ: đại từ gián tiếp, cho ai, và đại từ trực tiếp, cái gì."
            ex: ["¿El libro? ", { target: Se lo }, " doy a Ana."]
            tr: { en: "The book? I'm giving it to Ana.", uk: "Книжку? Я даю її Ані.", pt: "O livro? Estou dando para a Ana.", fr: "Le livre ? Je le donne à Ana.", de: "Das Buch? Ich gebe es Ana.", it: "Il libro? Lo do ad Ana.", pl: "Książka? Daję ją Ani.", tr: "Kitap mı? Onu Ana’ya veriyorum.", id: "Bukunya? Saya berikan kepada Ana.", vi: "Quyển sách à? Tôi đưa nó cho Ana." }
          - type: note
            level: A2
            text:
              en: ["Each pronoun alone: ", { link: "Direct Object Pronouns", to: es.pronombres.objeto-directo }, " and ", { link: "Indirect Object Pronouns", to: es.pronombres.objeto-indirecto }, "."]
              es: ["Cada pronombre por separado: ", { link: "El objeto directo", to: es.pronombres.objeto-directo }, " y ", { link: "El objeto indirecto", to: es.pronombres.objeto-indirecto }, "."]
              uk: ["Кожен займенник окремо: ", { link: "Займенники прямого додатка", to: es.pronombres.objeto-directo }, " і ", { link: "Займенники непрямого додатка", to: es.pronombres.objeto-indirecto }, "."]
              pt: ["Cada pronome separadamente: ", { link: "Pronomes de objeto direto", to: es.pronombres.objeto-directo }, " e ", { link: "Pronomes de objeto indireto", to: es.pronombres.objeto-indirecto }, "."]
              fr: ["Chaque pronom seul : ", { link: "Pronoms COD", to: es.pronombres.objeto-directo }, " et ", { link: "Pronoms COI", to: es.pronombres.objeto-indirecto }, "."]
              de: ["Jedes Pronomen einzeln: ", { link: "Direkte Objektpronomen", to: es.pronombres.objeto-directo }, " und ", { link: "Indirekte Objektpronomen", to: es.pronombres.objeto-indirecto }, "."]
              it: ["Ogni pronome da solo: ", { link: "Pronomi complemento diretto", to: es.pronombres.objeto-directo }, " e ", { link: "Pronomi complemento indiretto", to: es.pronombres.objeto-indirecto }, "."]
              pl: ["Każdy zaimek osobno: ", { link: "Zaimki dopełnienia bliższego", to: es.pronombres.objeto-directo }, " i ", { link: "Zaimki dopełnienia dalszego", to: es.pronombres.objeto-indirecto }, "."]
              tr: ["Her zamir ayrı ayrı: ", { link: "Doğrudan nesne zamirleri", to: es.pronombres.objeto-directo }, " ve ", { link: "Dolaylı nesne zamirleri", to: es.pronombres.objeto-indirecto }, "."]
              id: ["Masing-masing kata ganti: ", { link: "Kata ganti objek langsung", to: es.pronombres.objeto-directo }, " dan ", { link: "Kata ganti objek tak langsung", to: es.pronombres.objeto-indirecto }, "."]
              vi: ["Từng đại từ riêng lẻ: ", { link: "Đại từ tân ngữ trực tiếp", to: es.pronombres.objeto-directo }, " và ", { link: "Đại từ tân ngữ gián tiếp", to: es.pronombres.objeto-indirecto }, "."]

  - title: { en: "Form: the pairs", es: "Forma: las combinaciones", uk: "Форма: пари займенників", pt: "Forma: as combinações", fr: "Forme : les combinaisons", de: "Form: die Kombinationen", it: "Forma: le combinazioni", pl: "Forma: połączenia", tr: "Biçim: birleşimler", id: "Bentuk: kombinasi", vi: "Dạng: các tổ hợp" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: indirect, label: { en: Indirect object, es: Objeto indirecto, uk: "Непрямий додаток", pt: "Objeto indireto", fr: "COI", de: "Indirektes Objekt", it: "Complemento indiretto", pl: "Dopełnienie dalsze", tr: "Dolaylı nesne", id: "Objek tak langsung", vi: "Tân ngữ gián tiếp" } }
          - { key: sg, label: { alternatives: [lo, la] } }
          - { key: pl, label: { alternatives: [los, las] } }
        rows:
          - { level: B1, features: { person: 1, number: sg }, indirect: me, sg: { alternatives: [{ target: me lo }, { target: me la }] }, pl: { alternatives: [{ target: me los }, { target: me las }] } }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, indirect: te, sg: { alternatives: [{ target: te lo }, { target: te la }] }, pl: { alternatives: [{ target: te los }, { target: te las }] } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], indirect: le, sg: { alternatives: [{ target: se lo }, { target: se la }] }, pl: { alternatives: [{ target: se los }, { target: se las }] } }
          - { level: B1, features: { person: 1, number: pl }, indirect: nos, sg: { alternatives: [{ target: nos lo }, { target: nos la }] }, pl: { alternatives: [{ target: nos los }, { target: nos las }] } }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, indirect: os, sg: { alternatives: [{ target: os lo }, { target: os la }] }, pl: { alternatives: [{ target: os los }, { target: os las }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], indirect: les, sg: { alternatives: [{ target: se lo }, { target: se la }] }, pl: { alternatives: [{ target: se los }, { target: se las }] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The indirect pronoun always comes first:"
              es: "El pronombre indirecto siempre va primero:"
              uk: "Непрямий займенник завжди стоїть першим:"
              pt: "O pronome indireto vem sempre primeiro:"
              fr: "Le pronom indirect vient toujours en premier :"
              de: "Das indirekte Pronomen steht immer zuerst:"
              it: "Il pronome indiretto viene sempre per primo:"
              pl: "Zaimek dopełnienia dalszego stoi zawsze na pierwszym miejscu:"
              tr: "Dolaylı nesne zamiri her zaman önce gelir:"
              id: "Kata ganti tak langsung selalu datang lebih dulu:"
              vi: "Đại từ gián tiếp luôn đứng trước:"
            ex: ["¿", { target: Me lo }, " prestas?"]
            tr: { en: Will you lend it to me?, uk: "Позичиш мені?", pt: "Você me empresta?", fr: "Tu me le prêtes ?", de: "Leihst du es mir?", it: "Me lo presti?", pl: "Pożyczysz mi to?", tr: "Bana ödünç verir misin?", id: "Bisakah kamu meminjamkannya kepada saya?", vi: "Bạn cho tôi mượn nhé?" }
          - type: rule
            level: A2
            text:
              en: [{ term: le }, " and ", { term: les }, " become ", { term: se }, " before ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              es: [{ term: le }, " y ", { term: les }, " se convierten en ", { term: se }, " delante de ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              uk: [{ term: le }, " і ", { term: les }, " перед ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " стають ", { term: se }, ":"]
              pt: [{ term: le }, " e ", { term: les }, " se transformam em ", { term: se }, " diante de ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              fr: [{ term: le }, " et ", { term: les }, " deviennent ", { term: se }, " devant ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " :"]
              de: [{ term: le }, " und ", { term: les }, " werden zu ", { term: se }, " vor ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              it: [{ term: le }, " e ", { term: les }, " diventano ", { term: se }, " davanti a ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              pl: [{ term: le }, " i ", { term: les }, " zmieniają się w ", { term: se }, " przed ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              tr: [{ term: le }, " ve ", { term: les }, ", ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, " önünde ", { term: se }, " olur:"]
              id: [{ term: le }, " dan ", { term: les }, " menjadi ", { term: se }, " di depan ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
              vi: [{ term: le }, " và ", { term: les }, " đổi thành ", { term: se }, " trước ", { alternatives: [{ term: lo }, { term: la }, { term: los }, { term: las }] }, ":"]
            ex: ["¿El regalo? ", { target: Se lo }, " doy a mi madre."]
            tr: { en: "The present? I'm giving it to my mother.", uk: "Подарунок? Я дарую його мамі.", pt: "O presente? Estou dando para minha mãe.", fr: "Le cadeau ? Je le donne à ma mère.", de: "Das Geschenk? Ich gebe es meiner Mutter.", it: "Il regalo? Lo do a mia madre.", pl: "Prezent? Daję go mojej mamie.", tr: "Hediye mi? Onu anneme veriyorum.", id: "Hadiahnya? Saya berikan kepada ibu saya.", vi: "Món quà à? Tôi tặng nó cho mẹ tôi." }
          - type: rule
            level: A2
            text:
              en: [{ term: se }, " can stand for ", { term: le }, " or ", { term: les }, ", so ", { pattern: [{ term: a }, { slot: person }] }, " often follows to make it clear:"]
              es: [{ term: se }, " puede valer por ", { term: le }, " o por ", { term: les }, ", así que a menudo sigue ", { pattern: [{ term: a }, { slot: person }] }, " para aclararlo:"]
              uk: [{ term: se }, " може означати і ", { term: le }, ", і ", { term: les }, ", тому для ясності часто додають ", { pattern: [{ term: a }, { slot: person }] }, ":"]
              pt: [{ term: se }, " pode valer por ", { term: le }, " ou ", { term: les }, ", por isso muitas vezes se acrescenta ", { pattern: [{ term: a }, { slot: person }] }, " para deixar claro:"]
              fr: [{ term: se }, " peut remplacer ", { term: le }, " ou ", { term: les }, ", donc on ajoute souvent ", { pattern: [{ term: a }, { slot: person }] }, " pour préciser :"]
              de: [{ term: se }, " kann für ", { term: le }, " oder ", { term: les }, " stehen, deshalb folgt oft ", { pattern: [{ term: a }, { slot: person }] }, " zur Klärung:"]
              it: [{ term: se }, " può sostituire ", { term: le }, " o ", { term: les }, ", perciò spesso segue ", { pattern: [{ term: a }, { slot: person }] }, " per chiarire:"]
              pl: [{ term: se }, " może zastępować ", { term: le }, " albo ", { term: les }, ", dlatego często dodaje się ", { pattern: [{ term: a }, { slot: person }] }, " dla jasności:"]
              tr: [{ term: se }, " hem ", { term: le }, " hem de ", { term: les }, " yerine geçebilir, bu yüzden açıklık için çoğu zaman ", { pattern: [{ term: a }, { slot: person }] }, " eklenir:"]
              id: [{ term: se }, " dapat mewakili ", { term: le }, " atau ", { term: les }, ", jadi sering ditambahkan ", { pattern: [{ term: a }, { slot: person }] }, " supaya jelas:"]
              vi: [{ term: se }, " có thể thay cho ", { term: le }, " hoặc ", { term: les }, ", nên thường thêm ", { pattern: [{ term: a }, { slot: person }] }, " để làm rõ:"]
            ex: { examples: [[{ target: Se lo }, " digo ", { target: a ella }, "."], [{ target: Se lo }, " digo ", { target: a ellos }, "."]] }
            tr: { en: { examples: ["I'll tell her.", "I'll tell them."] }, uk: { examples: ["Я скажу їй.", "Я скажу їм."] }, pt: { examples: ["Eu digo isso a ela.", "Eu digo isso a eles."] }, fr: { examples: ["Je le lui dis.", "Je le leur dis."] }, de: { examples: ["Ich sage es ihr.", "Ich sage es ihnen."] }, it: { examples: ["Lo dico a lei.", "Lo dico a loro."] }, pl: { examples: ["Powiem jej to.", "Powiem im to."] }, tr: { examples: ["Ona söylerim.", "Onlara söylerim."] }, id: { examples: ["Saya katakan itu kepadanya.", "Saya katakan itu kepada mereka."] }, vi: { examples: ["Tôi nói điều đó với cô ấy.", "Tôi nói điều đó với họ."] } }
          - type: note
            level: B1
            variety: es-419
            text:
              en: ["“I told them” is ", { term: se lo dije }, " in writing. Informal Latin American speech also marks the plural receiver on the second pronoun, and you will hear ", { term: se los dije }, "."]
              es: ["“Se lo dije a ellos” se escribe ", { term: se lo dije }, ". En el habla informal de Latinoamérica el plural del receptor también se marca en el segundo pronombre, y se oye ", { term: se los dije }, "."]
              uk: ["«Я сказав їм це» на письмі — ", { term: se lo dije }, ". У неформальному мовленні Латинської Америки множину адресата позначають і на другому займеннику, тож можна почути ", { term: se los dije }, "."]
              pt: ["“Eu disse isso a eles” se escreve ", { term: se lo dije }, ". Na fala informal da América Latina, o plural de quem recebe também aparece no segundo pronome, e se ouve ", { term: se los dije }, "."]
              fr: ["« Je le leur ai dit » s’écrit ", { term: se lo dije }, ". Dans la langue familière d’Amérique latine, le pluriel du destinataire se marque aussi sur le second pronom, et on entend ", { term: se los dije }, "."]
              de: ["„Ich habe es ihnen gesagt“ schreibt man ", { term: se lo dije }, ". In der informellen Umgangssprache Lateinamerikas wird die Mehrzahl des Empfängers auch am zweiten Pronomen markiert, und man hört ", { term: se los dije }, "."]
              it: ["«L’ho detto a loro» si scrive ", { term: se lo dije }, ". Nel parlato informale dell’America Latina il plurale di chi riceve si segna anche sul secondo pronome, e si sente ", { term: se los dije }, "."]
              pl: ["„Powiedziałem im to” zapisuje się ", { term: se lo dije }, ". W nieformalnej mowie Ameryki Łacińskiej liczbę mnogą odbiorcy zaznacza się też na drugim zaimku, więc słychać ", { term: se los dije }, "."]
              tr: ["“Onlara söyledim” yazıda ", { term: se lo dije }, " olur. Latin Amerika’nın gündelik konuşmasında alıcının çoğulu ikinci zamirde de gösterilir ve ", { term: se los dije }, " duyulur."]
              id: ["“Saya sudah mengatakannya kepada mereka” ditulis ", { term: se lo dije }, ". Dalam percakapan informal Amerika Latin, bentuk jamak penerima juga ditandai pada kata ganti kedua, sehingga terdengar ", { term: se los dije }, "."]
              vi: ["“Tôi đã nói điều đó với họ” được viết là ", { term: se lo dije }, ". Trong lời nói thân mật ở châu Mỹ Latinh, số nhiều của người nhận còn được đánh dấu trên đại từ thứ hai, nên có thể nghe thấy ", { term: se los dije }, "."]

  - title: { en: Where the pronouns go, es: Dónde van los pronombres, uk: "Де стоять займенники", pt: "Onde ficam os pronomes", fr: "Où se placent les pronoms", de: "Wo die Pronomen stehen", it: "Dove vanno i pronomi", pl: "Gdzie stoją zaimki", tr: "Zamirler nereye gelir", id: "Letak kata ganti", vi: "Vị trí của các đại từ" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Position, es: Posición, uk: "Місце", pt: "Posição", fr: "Place", de: "Stellung", it: "Posizione", pl: "Miejsce", tr: "Yer", id: "Posisi", vi: "Vị trí" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, use: { en: "Both before a conjugated verb, side by side", es: "Los dos delante del verbo conjugado, juntos", uk: "Обидва перед дієсловом в особовій формі, поруч", pt: "Os dois antes do verbo conjugado, juntos", fr: "Les deux devant le verbe conjugué, côte à côte", de: "Beide vor dem konjugierten Verb, nebeneinander", it: "Entrambi davanti al verbo coniugato, uno accanto all’altro", pl: "Oba przed czasownikiem w formie osobowej, obok siebie", tr: "İkisi de çekimli fiilin önünde, yan yana", id: "Keduanya di depan kata kerja yang sudah dikonjugasi, berdampingan", vi: "Cả hai đứng trước động từ đã chia, liền nhau" }, ex: [{ target: Te lo }, " traigo mañana."], tr: { en: "I'll bring it to you tomorrow.", uk: "Принесу тобі це завтра.", pt: "Eu te trago isso amanhã.", fr: "Je te l’apporte demain.", de: "Ich bringe es dir morgen.", it: "Te lo porto domani.", pl: "Przyniosę ci to jutro.", tr: "Yarın sana getiririm.", id: "Besok saya bawakan untukmu.", vi: "Ngày mai tôi mang nó đến cho bạn." } }
          - { level: A2, use: { en: [{ term: "no" }, " before both"], es: [{ term: "no" }, " delante de los dos"], uk: [{ term: "no" }, " перед обома"], pt: [{ term: "no" }, " antes dos dois"], fr: [{ term: "no" }, " devant les deux"], de: [{ term: "no" }, " vor beiden"], it: [{ term: "no" }, " davanti a entrambi"], pl: [{ term: "no" }, " przed oboma"], tr: [{ term: "no" }, " ikisinin de önünde"], id: [{ term: "no" }, " di depan keduanya"], vi: [{ term: "no" }, " đứng trước cả hai"] }, ex: ["No ", { target: se lo }, " digo."], tr: { en: "I'm not telling him.", uk: "Я йому цього не скажу.", pt: "Eu não digo isso a ele.", fr: "Je ne le lui dis pas.", de: "Ich sage es ihm nicht.", it: "Non glielo dico.", pl: "Nie powiem mu tego.", tr: "Ona söylemiyorum.", id: "Saya tidak mengatakannya kepadanya.", vi: "Tôi không nói điều đó với anh ấy." } }
          - { level: B1, use: { en: "With an infinitive: both attached, or both before the phrase", es: "Con infinitivo: los dos unidos, o los dos delante", uk: "З інфінітивом: обидва приєднуються або обидва стоять перед групою", pt: "Com infinitivo: os dois unidos, ou os dois antes do grupo", fr: "Avec un infinitif : les deux collés au verbe, ou les deux devant le groupe", de: "Mit Infinitiv: beide angehängt, oder beide vor die Gruppe", it: "Con l’infinito: entrambi attaccati, oppure entrambi davanti al gruppo", pl: "Z bezokolicznikiem: oba dołączone albo oba przed całą grupą", tr: "Mastarla: ikisi de eklenir ya da ikisi de öbeğin önüne gelir", id: "Dengan infinitif: keduanya melekat, atau keduanya di depan frasa", vi: "Với động từ nguyên mẫu: cả hai gắn vào, hoặc cả hai đứng trước cả cụm" }, ex: { equivalence: [["Voy a ", { target: dártelo }], [{ target: Te lo }, " voy a dar"]] }, tr: { en: "I'm going to give it to you.", uk: "Я тобі це дам.", pt: "Vou dar isso a você.", fr: "Je vais te le donner.", de: "Ich werde es dir geben.", it: "Te lo darò.", pl: "Dam ci to.", tr: "Onu sana vereceğim.", id: "Saya akan memberikannya kepadamu.", vi: "Tôi sẽ đưa cái đó cho bạn." } }
