summary:
  lead:
    en: ["With two object pronouns, the indirect one comes first: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    es: ["Con dos pronombres de objeto, el indirecto va primero: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    uk: ["Коли займенників-додатків два, першим стоїть непрямий: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    pt: ["Com dois pronomes de objeto, o indireto vem primeiro: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    fr: ["Avec deux pronoms compléments, l’indirect vient en premier : ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    de: ["Bei zwei Objektpronomen steht das indirekte zuerst: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    it: ["Con due pronomi complemento, quello indiretto viene per primo: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    pl: ["Przy dwóch zaimkach dopełnienia najpierw stoi zaimek dopełnienia dalszego: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    tr: ["İki nesne zamiri birlikte geldiğinde dolaylı olan önce gelir: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    id: ["Dengan dua kata ganti objek, yang tak langsung datang lebih dulu: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
    vi: ["Khi có hai đại từ tân ngữ, đại từ gián tiếp đứng trước: ", { term: me lo }, ", ", { term: te la }, ", ", { term: nos los }, "."]
