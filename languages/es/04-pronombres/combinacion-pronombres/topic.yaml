            uk: "обидва приєднуються до інфінітива чи герундія або обидва стоять перед групою"
            pt: "os dois unidos ao infinitivo ou ao gerúndio, ou os dois antes do grupo"
            fr: "les deux collés à l’infinitif ou au gérondif, ou les deux devant le groupe"
            de: "beide an den Infinitiv oder das Gerundium angehängt, oder beide vor die Gruppe"
            it: "entrambi attaccati all’infinito o al gerundio, oppure entrambi davanti al gruppo"
            pl: "oba dołączone do bezokolicznika lub gerundium albo oba przed całą grupą"
            tr: "ikisi de mastara veya gerundio’ya eklenir ya da ikisi de öbeğin önüne gelir"
            id: "keduanya melekat pada infinitif atau gerundio, atau keduanya di depan frasa"
            vi: "cả hai gắn vào động từ nguyên mẫu hoặc gerundio, hoặc cả hai đứng trước cả cụm"
          ex: { equivalence: [["Voy a ", { target: dártelo }], [{ target: Te lo }, " voy a dar"]] }
          tr: { en: "I'm going to give it to you.", uk: "Я тобі це дам.", pt: "Vou dar isso a você.", fr: "Je vais te le donner.", de: "Ich werde es dir geben.", it: "Te lo darò.", pl: "Dam ci to.", tr: "Onu sana vereceğim.", id: "Saya akan memberikannya kepadamu.", vi: "Tôi sẽ đưa cái đó cho bạn." }
        - level: B1
          point: { en: Command, es: Imperativo, uk: "Наказова форма", pt: "Imperativo", fr: "Impératif", de: "Imperativ", it: "Imperativo", pl: "Tryb rozkazujący", tr: "Emir kipi", id: "Imperatif", vi: "Mệnh lệnh" }
          rule:
            en: "both attached to an affirmative command"
            es: "los dos unidos al imperativo afirmativo"
            uk: "обидва приєднуються до стверджувальної наказової форми"
            pt: "os dois unidos ao imperativo afirmativo"
            fr: "les deux collés à l’impératif affirmatif"
            de: "beide an den bejahten Imperativ angehängt"
            it: "entrambi attaccati all’imperativo affermativo"
            pl: "oba dołączone do trybu rozkazującego w zdaniu twierdzącym"
            tr: "ikisi de olumlu emir kipine eklenir"
            id: "keduanya melekat pada imperatif afirmatif"
            vi: "cả hai gắn vào câu mệnh lệnh khẳng định"
          ex: [{ target: Dámelo }, "."]
          tr: { en: Give it to me., uk: "Дай мені це.", pt: "Me dá isso.", fr: "Donne-le-moi.", de: "Gib es mir.", it: "Dammelo.", pl: "Daj mi to.", tr: "Onu bana ver.", id: "Berikan itu kepada saya.", vi: "Đưa nó cho tôi." }
        - level: B1
          point: { en: Accent, es: Tilde, uk: "Графічний наголос", pt: "Acento gráfico", fr: "Accent écrit", de: "Akzentzeichen", it: "Accento scritto", pl: "Akcent graficzny", tr: "Vurgu işareti", id: "Tanda aksen", vi: "Dấu trọng âm" }
          rule:
            en: "the verb keeps its stress, so it takes a written accent"
            es: "el verbo mantiene su acento, así que lleva tilde"
            uk: "дієслово зберігає свій наголос, тому отримує знак наголосу"
            pt: "o verbo mantém a sílaba tônica, por isso leva acento gráfico"
            fr: "le verbe garde sa syllabe accentuée, donc il prend un accent écrit"
            de: "das Verb behält seine Betonung, daher bekommt es einen Akzent"
            it: "il verbo mantiene l’accento, quindi porta l’accento scritto"
            pl: "czasownik zachowuje swój akcent, dlatego dostaje akcent graficzny"
            tr: "fiil vurgusunu korur, bu yüzden vurgu işareti alır"
            id: "kata kerja mempertahankan tekanannya, jadi diberi tanda aksen"
            vi: "động từ giữ nguyên trọng âm, nên có dấu trọng âm"
          ex: { examples: [{ target: dártelo }, { target: dándoselo }] }
          tr: { en: { examples: [to give it to you, giving it to him] }, uk: { examples: ["дати тобі це", "даючи йому це"] }, pt: { examples: ["dar isso a você", "dando isso a ele"] }, fr: { examples: ["te le donner", "en le lui donnant"] }, de: { examples: ["es dir zu geben", "es ihm gebend"] }, it: { examples: ["dartelo", "dandoglielo"] }, pl: { examples: ["dać ci to", "dając mu to"] }, tr: { examples: ["onu sana vermek", "onu ona vererek"] }, id: { examples: ["memberikannya kepadamu", "sambil memberikannya kepadanya"] }, vi: { examples: ["đưa nó cho bạn", "đang đưa nó cho anh ấy"] } }
        - level: B2
