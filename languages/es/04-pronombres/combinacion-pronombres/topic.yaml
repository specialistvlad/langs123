      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The two pronouns stay together: both before the verb, or both attached to it."
              es: "Los dos pronombres van juntos: los dos delante del verbo, o los dos unidos a él."
              uk: "Два займенники не розлучаються: обидва перед дієсловом або обидва приєднані до нього."
              pt: "Os dois pronomes ficam juntos: os dois antes do verbo, ou os dois unidos a ele."
              fr: "Les deux pronoms restent ensemble : les deux devant le verbe, ou les deux collés au verbe."
              de: "Die beiden Pronomen bleiben zusammen: beide vor dem Verb oder beide an das Verb angehängt."
              it: "I due pronomi restano uniti: entrambi davanti al verbo, oppure entrambi attaccati al verbo."
              pl: "Dwa zaimki zawsze stoją razem: oba przed czasownikiem albo oba dołączone do niego."
              tr: "İki zamir birlikte kalır: ikisi de fiilin önünde ya da ikisi de fiile eklenir."
              id: "Kedua kata ganti tetap bersama: keduanya di depan kata kerja, atau keduanya melekat padanya."
              vi: "Hai đại từ luôn đi cùng nhau: cả hai đứng trước động từ, hoặc cả hai gắn vào động từ."
          - type: rule
            level: B1
            text:
              en: "A verb with two pronouns attached keeps its stress, so it takes a written accent:"
              es: "El verbo con dos pronombres unidos mantiene su acento, así que lleva tilde:"
              uk: "Дієслово з двома приєднаними займенниками зберігає свій наголос, тому отримує знак наголосу:"
              pt: "O verbo com dois pronomes unidos mantém a sílaba tônica, por isso leva acento gráfico:"
              fr: "Le verbe avec deux pronoms collés garde sa syllabe accentuée, donc il prend un accent écrit :"
              de: "Ein Verb mit zwei angehängten Pronomen behält seine Betonung und bekommt deshalb einen Akzent:"
              it: "Il verbo con due pronomi attaccati mantiene l’accento, quindi porta l’accento scritto:"
              pl: "Czasownik z dwoma dołączonymi zaimkami zachowuje swój akcent, dlatego dostaje akcent graficzny:"
              tr: "İki zamir eklenmiş fiil vurgusunu korur, bu yüzden vurgu işareti alır:"
              id: "Kata kerja dengan dua kata ganti yang melekat mempertahankan tekanannya, jadi diberi tanda aksen:"
              vi: "Động từ có hai đại từ gắn vào giữ nguyên trọng âm, nên có dấu trọng âm:"
            ex: { examples: [{ target: dártelo }, { target: dándoselo }, { target: dígamelo }] }
            tr: { en: { examples: [to give it to you, giving it to him, tell it to me] }, uk: { examples: ["дати тобі це", "даючи йому це", "скажіть мені це"] }, pt: { examples: ["dar isso a você", "dando isso a ele", "diga isso para mim"] }, fr: { examples: ["te le donner", "en le lui donnant", "dites-le-moi"] }, de: { examples: ["es dir zu geben", "es ihm gebend", "sagen Sie es mir"] }, it: { examples: ["dartelo", "dandoglielo", "me lo dica"] }, pl: { examples: ["dać ci to", "dając mu to", "proszę mi to powiedzieć"] }, tr: { examples: ["onu sana vermek", "onu ona vererek", "onu bana söyleyin"] }, id: { examples: ["memberikannya kepadamu", "sambil memberikannya kepadanya", "katakan itu kepada saya"] }, vi: { examples: ["đưa nó cho bạn", "đang đưa nó cho anh ấy", "hãy nói điều đó với tôi"] } }

