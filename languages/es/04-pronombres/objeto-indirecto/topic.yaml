# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pronombres.objeto-indirecto
lang: es
kind: grammar
tags: [pronouns, object, indirect object, le, les]
concepts: [object-pronouns, pronouns]
related: [es.pronombres.objeto-directo, es.pronombres.combinacion-pronombres, es.pronombres.pronombres-preposicion, es.ser-estar-hay-gustar.gustar]
status: { en: draft, es: draft, uk: draft }
translated: { en: "e1196a 2accfb 99a392 a395fd 2c9429 7083aa 78b461 c23843", uk: "e1196a 2accfb 99a392 a395fd 2c9429 7083aa 78b461 c23843" }

title: { en: Indirect Object Pronouns, es: El objeto indirecto, uk: "Займенники непрямого додатка" }
summary:
  lead:
    en: [{ term: Me }, ", ", { term: te }, ", ", { term: le }, ", ", { term: nos }, " and ", { term: les }, " name the person who receives something or for whom something is done."]
    es: [{ term: Me }, ", ", { term: te }, ", ", { term: le }, ", ", { term: nos }, " y ", { term: les }, " indican la persona que recibe algo o para quien se hace algo."]
    uk: [{ term: Me }, ", ", { term: te }, ", ", { term: le }, ", ", { term: nos }, " і ", { term: les }, " позначають людину, яка щось отримує або для якої щось роблять."]
  rule:
    en: [{ term: Le }, " and ", { term: les }, " usually stay even when the person is named with ", { term: a }, ":"]
    es: [{ term: Le }, " y ", { term: les }, " suelen aparecer aunque la persona se nombre con ", { term: a }, ":"]
    uk: [{ term: Le }, " і ", { term: les }, " зазвичай лишаються, навіть коли людину названо з ", { term: a }, ":"]
  ex: { examples: [[{ target: Le }, " doy el libro a María."], [{ target: Les }, " escribo a mis padres."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }
            es: { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }
            uk: { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }
          ex: [{ target: Te }, " mando un mensaje."]
          tr: { en: "I'll send you a message.", uk: "Надішлю тобі повідомлення." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: os }, " for ", { term: vosotros }]
            es: [{ term: os }, " para ", { term: vosotros }]
            uk: [{ term: os }, " для ", { term: vosotros }]
          ex: [{ target: Os }, " traigo un regalo."]
          tr: { en: "I'm bringing you a present.", uk: "Я привезу вам подарунок." }
        - level: A2
          point: { en: Meaning, es: Significado, uk: "Значення" }
          rule:
            en: "the person who receives something: to whom, for whom"
            es: "la persona que recibe algo: a quién, para quién"
            uk: "людина, яка щось отримує: кому, для кого"
          ex: [{ target: Le }, " compro flores a mi madre."]
          tr: { en: "I'm buying my mother flowers.", uk: "Я купую мамі квіти." }
        - level: A2
          point: { en: No gender, es: Sin género, uk: "Без роду" }
          rule:
            en: [{ term: le }, " serves a man, a woman and ", { term: usted }]
            es: [{ term: le }, " sirve para un hombre, una mujer y ", { term: usted }]
            uk: [{ term: le }, " годиться для чоловіка, жінки й ", { term: usted }]
          ex: [{ target: Le }, " escribo a Ana."]
          tr: { en: "I'm writing to Ana.", uk: "Я пишу Ані." }
        - level: A2
          point: { en: Doubling, es: Duplicación, uk: "Подвоєння" }
          rule:
            en: [{ term: le }, " or ", { term: les }, " stays beside ", { pattern: [{ term: a }, { slot: person }] }]
            es: [{ term: le }, " o ", { term: les }, " aparece junto a ", { pattern: [{ term: a }, { slot: person }] }]
            uk: [{ term: le }, " або ", { term: les }, " стоїть поряд із ", { pattern: [{ term: a }, { slot: person }] }]
          ex: [{ target: Les }, " escribo a mis padres."]
          tr: { en: I write to my parents., uk: "Я пишу батькам." }
        - level: A2
          point: { en: Clarity, es: Claridad, uk: "Ясність" }
          rule:
            en: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, " make ", { term: le }, " clear"]
            es: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, " aclaran a quién se refiere ", { term: le }]
            uk: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, " уточнюють, кого означає ", { term: le }]
          ex: [{ target: Le }, " escribo ", { target: a ella }, ", no a él."]
          tr: { en: "I'm writing to her, not to him.", uk: "Я пишу їй, а не йому." }
        - level: A2
          point: { en: Position, es: Posición, uk: "Місце" }
          rule:
            en: "like the direct object: before the conjugated verb, or attached"
            es: "como el objeto directo: delante del verbo conjugado, o unido"
            uk: "як і прямий додаток: перед дієсловом в особовій формі або приєднується"
          ex: { equivalence: [["Voy a ", { target: escribirle }], [{ target: Le }, " voy a escribir"]] }
          tr: { en: "I'm going to write to him.", uk: "Збираюся йому написати." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: preguntar }, " takes an indirect object: ", { term: le }]
            es: [{ term: preguntar }, " lleva objeto indirecto: ", { term: le }]
            uk: [{ term: preguntar }, " вимагає непрямого додатка: ", { term: le }]
          ex: [{ target: Le }, " pregunto a Juan."]
          tr: { en: "I'm asking Juan.", uk: "Я питаю Хуана." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The indirect object is the person who receives something, or for whom something is done."
              es: "El objeto indirecto es la persona que recibe algo, o para quien se hace algo."
              uk: "Непрямий додаток — це людина, яка щось отримує або для якої щось роблять."
            ex: ["Doy el libro ", { target: a Ana }, "."]
            tr: { en: I give the book to Ana., uk: "Я даю книжку Ані." }
          - type: note
            level: A2
            text:
              en: ["The pronouns for what or whom the verb acts on: ", { link: "Direct Object Pronouns", to: es.pronombres.objeto-directo }, "."]
              es: ["Los pronombres de qué o a quién: ", { link: "El objeto directo", to: es.pronombres.objeto-directo }, "."]
              uk: ["Займенники для того, на що чи на кого спрямована дія: ", { link: "Займенники прямого додатка", to: es.pronombres.objeto-directo }, "."]
          - type: note
            level: A2
            text:
              en: ["Verbs such as ", { term: gustar }, " name the person with these pronouns: ", { link: "Gustar and Similar Verbs", to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["Verbos como ", { term: gustar }, " nombran a la persona con estos pronombres: ", { link: "Gustar y verbos similares", to: es.ser-estar-hay-gustar.gustar }, "."]
              uk: ["Із дієсловами на кшталт ", { term: gustar }, " людину позначають цими займенниками: ", { link: "Gustar і подібні дієслова", to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto, uk: "Підмет" } }
          - { key: object, label: { en: Indirect object, es: Objeto indirecto, uk: "Непрямий додаток" } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, subject: yo, object: { target: me } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, subject: tú, object: { target: te } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], subject: { alternatives: [él, ella, usted] }, object: { target: le } }
          - { level: A2, features: { person: 1, number: pl }, subject: { alternatives: [nosotros, nosotras] }, object: { target: nos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, subject: { alternatives: [vosotros, vosotras] }, object: { target: os } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], subject: { alternatives: [ellos, ellas, ustedes] }, object: { target: les } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: le }, " and ", { term: les }, " have no gender: the same form serves a man and a woman."]
              es: [{ term: le }, " y ", { term: les }, " no tienen género: la misma forma sirve para un hombre y para una mujer."]
              uk: [{ term: le }, " і ", { term: les }, " не мають роду: та сама форма годиться для чоловіка й для жінки."]
            ex: { examples: [[{ target: Le }, " escribo a Pedro."], [{ target: Le }, " escribo a Ana."]] }
            tr: { en: { examples: ["I'm writing to Pedro.", "I'm writing to Ana."] }, uk: { examples: ["Я пишу Педрові.", "Я пишу Ані."] } }
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " have the same form as the direct object pronouns."]
              es: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " tienen la misma forma que los pronombres de objeto directo."]
              uk: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " мають ту саму форму, що й займенники прямого додатка."]

  - title: { en: Le and the person with a, es: Le y la persona con a, uk: "Le і особа з a" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: "The pronoun alone, when the person is known", es: "El pronombre solo, cuando la persona ya se conoce", uk: "Сам займенник, коли людина вже відома" }, ex: [{ target: Le }, " doy las llaves."], tr: { en: "I'm giving her the keys.", uk: "Я даю їй ключі." } }
          - { level: A2, use: { en: ["The pronoun with ", { pattern: [{ term: a }, { slot: person }] }, ": usually both"], es: ["El pronombre con ", { pattern: [{ term: a }, { slot: person }] }, ": normalmente los dos"], uk: ["Займенник разом із ", { pattern: [{ term: a }, { slot: person }] }, ": зазвичай обидва"] }, ex: [{ target: Le }, " doy las llaves ", { target: a Marta }, "."], tr: { en: "I'm giving Marta the keys.", uk: "Я даю Марті ключі." } }
          - { level: A2, use: { en: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, ": to make ", { term: le }, " clear"], es: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, ": para aclarar ", { term: le }], uk: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, ": щоб уточнити ", { term: le }] }, ex: [{ target: Le }, " escribo ", { target: a ella }, ", no a él."], tr: { en: "I'm writing to her, not to him.", uk: "Я пишу їй, а не йому." } }
          - { level: A2, use: { en: [{ alternatives: [{ term: a mí }, { term: a ti }] }, ": for emphasis or contrast"], es: [{ alternatives: [{ term: a mí }, { term: a ti }] }, ": para dar énfasis o contrastar"], uk: [{ alternatives: [{ term: a mí }, { term: a ti }] }, ": для наголосу чи протиставлення"] }, ex: [{ target: A mí }, " no me cuenta nada."], tr: { en: "He doesn't tell me anything.", uk: "Мені він нічого не розповідає." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["With ", { alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " and the rest, the pronoun ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " is always there too:"]
              es: ["Con ", { alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " y los demás, el pronombre ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " aparece siempre:"]
              uk: ["З ", { alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " та іншими займенник ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " теж стоїть завжди:"]
            ex: [{ target: Le }, " pregunto a él."]
            tr: { en: "I'm asking him.", uk: "Я питаю його." }

  - title: { en: Where the pronoun goes, es: Dónde va el pronombre, uk: "Де стоїть займенник" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Position, es: Posición, uk: "Місце" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: Before a conjugated verb, es: Delante del verbo conjugado, uk: "Перед дієсловом в особовій формі" }, ex: [{ target: Te }, " mando un mensaje."], tr: { en: "I'll send you a message.", uk: "Надішлю тобі повідомлення." } }
          - { level: A2, use: { en: "With an infinitive: attached, or before the whole phrase", es: "Con infinitivo: unido, o delante de todo el grupo", uk: "З інфінітивом: приєднується або стоїть перед усією групою" }, ex: { equivalence: [["Voy a ", { target: escribirle }], [{ target: Le }, " voy a escribir"]] }, tr: { en: "I'm going to write to him.", uk: "Збираюся йому написати." } }
          - { level: A2, use: { en: "With a gerund: attached, or before the whole phrase", es: "Con gerundio: unido, o delante de todo el grupo", uk: "З герундієм: приєднується або стоїть перед усією групою" }, ex: { equivalence: [["Estoy ", { target: explicándole }, " el problema"], [{ target: Le }, " estoy explicando el problema"]] }, tr: { en: "I'm explaining the problem to her.", uk: "Я пояснюю їй проблему." } }
          - { level: A2, use: { en: Attached to an affirmative command, es: Unido al imperativo afirmativo, uk: "Приєднується до стверджувальної наказової форми" }, ex: [{ target: Dime }, " la verdad."], tr: { en: Tell me the truth., uk: "Скажи мені правду." } }

  - title: { en: Verbs with an indirect object, es: Verbos con objeto indirecto, uk: "Дієслова з непрямим додатком" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: "Дієслово" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, verb: dar, ex: [{ target: Le }, " doy un regalo a mi hermano."], tr: { en: "I'm giving my brother a present.", uk: "Я даю братові подарунок." } }
          - { level: A2, verb: decir, ex: ["Siempre ", { target: les }, " digo la verdad."], tr: { en: I always tell them the truth., uk: "Я завжди кажу їм правду." } }
          - { level: A2, verb: escribir, ex: [{ target: Te }, " escribo mañana."], tr: { en: "I'll write to you tomorrow.", uk: "Напишу тобі завтра." } }
          - { level: A2, verb: preguntar, ex: [{ target: Le }, " pregunto a Juan."], tr: { en: "I'm asking Juan.", uk: "Я питаю Хуана." } }
          - { level: A2, verb: regalar, ex: ["¿Qué ", { target: le }, " regalas a tu madre?"], tr: { en: What are you giving your mother?, uk: "Що ти даруєш мамі?" } }
          - { level: A2, verb: explicar, ex: ["La profesora ", { target: nos }, " explica la regla."], tr: { en: The teacher explains the rule to us., uk: "Учителька пояснює нам правило." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Doy le el libro., right: [{ target: Le }, " doy el libro."], rule: { en: "the pronoun goes before a conjugated verb", es: "el pronombre va delante del verbo conjugado", uk: "займенник стоїть перед дієсловом в особовій формі" } }
          - { level: A2, wrong: La escribo a Ana., right: [{ target: Le }, " escribo a Ana."], rule: { en: ["a woman as indirect object takes ", { term: le }, " too"], es: ["una mujer como objeto indirecto también lleva ", { term: le }], uk: ["жінка в ролі непрямого додатка — теж ", { term: le }] } }
          - { level: A2, wrong: Lo pregunto a Juan., right: [{ target: Le }, " pregunto a Juan."], rule: { en: [{ term: preguntar }, " takes an indirect object: ", { term: le }], es: [{ term: preguntar }, " lleva objeto indirecto: ", { term: le }], uk: [{ term: preguntar }, " вимагає непрямого додатка: ", { term: le }, ", хоча українською «питаю його»"] } }
          - { level: A2, wrong: Escribo a él., right: [{ target: Le }, " escribo a él."], rule: { en: [{ term: a él }, " needs ", { term: le }, " too"], es: [{ term: a él }, " también necesita ", { term: le }], uk: [{ term: a él }, " теж потребує ", { term: le }] } }
          - { level: A2, speakers: [en, uk], wrong: Doy María el libro., right: ["Le doy el libro ", { target: a María }, "."], rule: { en: ["the person takes ", { term: a }, ": “give María the book” is ", { term: dar el libro a María }], uk: ["той, хто отримує, — з ", { term: a }, ": «дати Марії книжку» — це ", { term: dar el libro a María }] } }
