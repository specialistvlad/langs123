          - { level: B2, use: { es: "Delante del verbo conjugado, si solo depende de él y no del infinitivo", en: "Before the conjugated verb, when it depends on that verb alone and not on the infinitive", uk: "Перед дієсловом в особовій формі, якщо займенник залежить лише від нього, а не від інфінітива", pt: "Antes do verbo conjugado, se depende só dele e não do infinitivo", fr: "Devant le verbe conjugué, s’il ne dépend que de lui et non de l’infinitif", de: "Vor dem konjugierten Verb, wenn es nur von ihm abhängt und nicht vom Infinitiv", it: "Davanti al verbo coniugato, se dipende solo da esso e non dall’infinito", pl: "Przed czasownikiem w formie osobowej, jeśli zależy tylko od niego, a nie od bezokolicznika", tr: "Zamir yalnız çekimli fiile bağlıysa, mastara bağlı değilse, çekimli fiilin önünde", id: "Di depan kata kerja yang sudah dikonjugasi, jika hanya bergantung padanya dan bukan pada infinitif", vi: "Trước động từ đã chia, nếu đại từ chỉ phụ thuộc vào nó chứ không phụ thuộc vào động từ nguyên mẫu" }, ex: [{ target: Te }, " recomiendo venir."], tr: { en: "I recommend that you come.", uk: "Раджу тобі прийти.", pt: "Eu recomendo que você venha.", fr: "Je te recommande de venir.", de: "Ich empfehle dir zu kommen.", it: "Ti consiglio di venire.", pl: "Radzę ci przyjść.", tr: "Sana gelmeni öneriyorum.", id: "Saya menyarankanmu datang.", vi: "Tôi khuyên bạn nên đến." } }

