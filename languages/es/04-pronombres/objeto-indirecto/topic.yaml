          tr: { en: "That matter is of great interest.", uk: "Ця справа викликає великий інтерес.", pt: "Esse assunto interessa muito.", fr: "Cette affaire intéresse beaucoup.", de: "Diese Angelegenheit ist von großem Interesse.", it: "Questo argomento interessa moltissimo.", pl: "Ta sprawa bardzo interesuje.", tr: "Bu konu çok ilgi çekiyor.", id: "Masalah itu sangat menarik minat.", vi: "Vấn đề này rất được quan tâm." }
        - level: C2
          point: { es: Dativo ético, en: "Ethical dative", uk: "Етичний давальний", pt: "Dativo ético", fr: "Datif éthique", de: "Dativus ethicus", it: "Dativo etico", pl: "Celownik etyczny", tr: "Etik datif", id: "Datif etis", vi: "Dativo ético" }
          rule: { es: [{ term: me }, " muestra el interés del hablante, que no recibe nada"], en: [{ term: me }, " shows the speaker's interest; the speaker receives nothing"], uk: [{ term: me }, " виражає зацікавленість мовця, який нічого не отримує"], pt: [{ term: me }, " mostra o interesse do falante, que não recebe nada"], fr: [{ term: me }, " montre l’intérêt du locuteur, qui ne reçoit rien"], de: [{ term: me }, " zeigt die Anteilnahme des Sprechers, der nichts erhält"], it: [{ term: me }, " mostra l’interesse di chi parla, che non riceve nulla"], pl: [{ term: me }, " pokazuje zaangażowanie mówiącego, który niczego nie otrzymuje"], tr: [{ term: me }, " konuşanın ilgisini gösterir; konuşan hiçbir şey almaz"], id: [{ term: me }, " menunjukkan kepedulian penutur, yang tidak menerima apa pun"], vi: [{ term: me }, " cho thấy sự quan tâm của người nói, người không nhận gì cả"] }
          ex: ["El niño no ", { target: me }, " duerme bien."]
          tr: { en: "The boy isn't sleeping well.", uk: "Хлопчик погано спить.", pt: "O menino não dorme bem.", fr: "Le petit ne dort pas bien.", de: "Der Junge schläft nicht gut.", it: "Il bambino non mi dorme bene.", pl: "Chłopiec źle śpi.", tr: "Çocuk iyi uyumuyor.", id: "Anak itu tidurnya tidak nyenyak.", vi: "Thằng bé ngủ không ngon." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
