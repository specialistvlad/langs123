        rows:
          - { level: A2, use: { en: "The pronoun alone, when the person is known", es: "El pronombre solo, cuando la persona ya se conoce", uk: "Сам займенник, коли людина вже відома", pt: "O pronome sozinho, quando a pessoa já é conhecida", fr: "Le pronom seul, quand la personne est connue", de: "Das Pronomen allein, wenn die Person bekannt ist", it: "Il pronome da solo, quando la persona è già nota", pl: "Sam zaimek, gdy osoba jest już znana", tr: "Kişi biliniyorsa yalnız zamir", id: "Kata ganti saja, ketika orangnya sudah diketahui", vi: "Chỉ đại từ, khi đã biết người đó" }, ex: [{ target: Le }, " doy las llaves."], tr: { en: "I'm giving her the keys.", uk: "Я даю їй ключі.", pt: "Estou dando as chaves para ela.", fr: "Je lui donne les clés.", de: "Ich gebe ihr die Schlüssel.", it: "Le do le chiavi.", pl: "Daję jej klucze.", tr: "Ona anahtarları veriyorum.", id: "Saya memberikan kunci itu kepadanya.", vi: "Tôi đưa chìa khóa cho cô ấy." } }
