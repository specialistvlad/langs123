# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pronombres.objeto-indirecto
lang: es
kind: grammar
tags: [pronouns, object, indirect object, le, les]
concepts: [object-pronouns, pronouns]
related: [es.pronombres.objeto-directo, es.pronombres.combinacion-pronombres, es.pronombres.pronombres-preposicion, es.ser-estar-hay-gustar.gustar]
status: { en: draft, es: draft }
translated: { es: "069632 790a58 dd274a b2f683 6b1dba b0134e 0ab38c 345aef" }

title: { en: Indirect Object Pronouns, es: El objeto indirecto }
summary:
  lead:
    en: [{ term: Me }, ", ", { term: te }, ", ", { term: le }, ", ", { term: nos }, " and ", { term: les }, " name the person who receives something or for whom something is done."]
    es: [{ term: Me }, ", ", { term: te }, ", ", { term: le }, ", ", { term: nos }, " y ", { term: les }, " indican la persona que recibe algo o para quien se hace algo."]
  rule:
    en: [{ term: Le }, " and ", { term: les }, " usually stay even when the person is named with ", { term: a }, ":"]
    es: [{ term: Le }, " y ", { term: les }, " suelen aparecer aunque la persona se nombre con ", { term: a }, ":"]
  ex: { examples: [[{ target: Le }, " doy el libro a María."], [{ target: Les }, " escribo a mis padres."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }
            es: { alternatives: [{ term: me }, { term: te }, { term: le }, { term: nos }, { term: les }] }
          ex: [{ target: Te }, " mando un mensaje."]
          tr: { en: "I'll send you a message." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: os }, " for ", { term: vosotros }]
            es: [{ term: os }, " para ", { term: vosotros }]
          ex: [{ target: Os }, " traigo un regalo."]
          tr: { en: "I'm bringing you a present." }
        - level: A2
          point: { en: Meaning, es: Significado }
          rule:
            en: "the person who receives something: to whom, for whom"
            es: "la persona que recibe algo: a quién, para quién"
          ex: [{ target: Le }, " compro flores a mi madre."]
          tr: { en: "I'm buying my mother flowers." }
        - level: A2
          point: { en: No gender, es: Sin género }
          rule:
            en: [{ term: le }, " serves a man, a woman and ", { term: usted }]
            es: [{ term: le }, " sirve para un hombre, una mujer y ", { term: usted }]
          ex: [{ target: Le }, " escribo a Ana."]
          tr: { en: "I'm writing to Ana." }
        - level: A2
          point: { en: Doubling, es: Duplicación }
          rule:
            en: [{ term: le }, " or ", { term: les }, " stays beside ", { pattern: [{ term: a }, { slot: person }] }]
            es: [{ term: le }, " o ", { term: les }, " aparece junto a ", { pattern: [{ term: a }, { slot: person }] }]
          ex: [{ target: Les }, " escribo a mis padres."]
          tr: { en: I write to my parents. }
        - level: A2
          point: { en: Clarity, es: Claridad }
          rule:
            en: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, " make ", { term: le }, " clear"]
            es: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, " aclaran a quién se refiere ", { term: le }]
          ex: [{ target: Le }, " escribo ", { target: a ella }, ", no a él."]
          tr: { en: "I'm writing to her, not to him." }
        - level: A2
          point: { en: Position, es: Posición }
          rule:
            en: "like the direct object: before the conjugated verb, or attached"
            es: "como el objeto directo: delante del verbo conjugado, o unido"
          ex: { equivalence: [["Voy a ", { target: escribirle }], [{ target: Le }, " voy a escribir"]] }
          tr: { en: "I'm going to write to him." }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: preguntar }, " takes an indirect object: ", { term: le }]
            es: [{ term: preguntar }, " lleva objeto indirecto: ", { term: le }]
          ex: [{ target: Le }, " pregunto a Juan."]
          tr: { en: "I'm asking Juan." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The indirect object is the person who receives something, or for whom something is done."
              es: "El objeto indirecto es la persona que recibe algo, o para quien se hace algo."
            ex: ["Doy el libro ", { target: a Ana }, "."]
            tr: { en: I give the book to Ana. }
          - type: note
            level: A2
            text:
              en: ["The pronouns for what or whom the verb acts on: ", { link: "Direct Object Pronouns", to: es.pronombres.objeto-directo }, "."]
              es: ["Los pronombres de qué o a quién: ", { link: "El objeto directo", to: es.pronombres.objeto-directo }, "."]
          - type: note
            level: A2
            text:
              en: ["Verbs such as ", { term: gustar }, " name the person with these pronouns: ", { link: "Gustar and Similar Verbs", to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["Verbos como ", { term: gustar }, " nombran a la persona con estos pronombres: ", { link: "Gustar y verbos similares", to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto } }
          - { key: object, label: { en: Indirect object, es: Objeto indirecto } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, subject: yo, object: { target: me } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, subject: tú, object: { target: te } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], subject: { alternatives: [él, ella, usted] }, object: { target: le } }
          - { level: A2, features: { person: 1, number: pl }, subject: { alternatives: [nosotros, nosotras] }, object: { target: nos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, subject: { alternatives: [vosotros, vosotras] }, object: { target: os } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], subject: { alternatives: [ellos, ellas, ustedes] }, object: { target: les } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: le }, " and ", { term: les }, " have no gender: the same form serves a man and a woman."]
              es: [{ term: le }, " y ", { term: les }, " no tienen género: la misma forma sirve para un hombre y para una mujer."]
            ex: { examples: [[{ target: Le }, " escribo a Pedro."], [{ target: Le }, " escribo a Ana."]] }
            tr: { en: { examples: ["I'm writing to Pedro.", "I'm writing to Ana."] } }
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " have the same form as the direct object pronouns."]
              es: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " tienen la misma forma que los pronombres de objeto directo."]

  - title: { en: Le and the person with a, es: Le y la persona con a }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: "The pronoun alone, when the person is known", es: "El pronombre solo, cuando la persona ya se conoce" }, ex: [{ target: Le }, " doy las llaves."], tr: { en: "I'm giving her the keys." } }
          - { level: A2, use: { en: ["The pronoun with ", { pattern: [{ term: a }, { slot: person }] }, ": usually both"], es: ["El pronombre con ", { pattern: [{ term: a }, { slot: person }] }, ": normalmente los dos"] }, ex: [{ target: Le }, " doy las llaves ", { target: a Marta }, "."], tr: { en: "I'm giving Marta the keys." } }
          - { level: A2, use: { en: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, ": to make ", { term: le }, " clear"], es: [{ alternatives: [{ term: a él }, { term: a ella }, { term: a usted }] }, ": para aclarar ", { term: le }] }, ex: [{ target: Le }, " escribo ", { target: a ella }, ", no a él."], tr: { en: "I'm writing to her, not to him." } }
          - { level: A2, use: { en: [{ alternatives: [{ term: a mí }, { term: a ti }] }, ": for emphasis or contrast"], es: [{ alternatives: [{ term: a mí }, { term: a ti }] }, ": para dar énfasis o contrastar"] }, ex: [{ target: A mí }, " no me dice nada."], tr: { en: "He doesn't tell me anything." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["With ", { alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " and the rest, the pronoun ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " is always there too:"]
              es: ["Con ", { alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " y los demás, el pronombre ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " aparece siempre:"]
            ex: [{ target: Le }, " pregunto a él."]
            tr: { en: "I'm asking him." }

  - title: { en: Where the pronoun goes, es: Dónde va el pronombre }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Position, es: Posición } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: Before a conjugated verb, es: Delante del verbo conjugado }, ex: [{ target: Te }, " mando un mensaje."], tr: { en: "I'll send you a message." } }
          - { level: A2, use: { en: "With an infinitive: attached, or before the whole phrase", es: "Con infinitivo: unido, o delante de todo el grupo" }, ex: { equivalence: [["Voy a ", { target: escribirle }], [{ target: Le }, " voy a escribir"]] }, tr: { en: "I'm going to write to him." } }
          - { level: A2, use: { en: "With a gerund: attached, or before the whole phrase", es: "Con gerundio: unido, o delante de todo el grupo" }, ex: { equivalence: [["Estoy ", { target: explicándole }, " el problema"], [{ target: Le }, " estoy explicando el problema"]] }, tr: { en: "I'm explaining the problem to her." } }
          - { level: A2, use: { en: Attached to an affirmative command, es: Unido al imperativo afirmativo }, ex: [{ target: Dime }, " la verdad."], tr: { en: Tell me the truth. } }

  - title: { en: Verbs with an indirect object, es: Verbos con objeto indirecto }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, verb: dar, ex: [{ target: Le }, " doy un regalo a mi hermano."], tr: { en: "I'm giving my brother a present." } }
          - { level: A2, verb: decir, ex: ["Siempre ", { target: les }, " digo la verdad."], tr: { en: I always tell them the truth. } }
          - { level: A2, verb: escribir, ex: [{ target: Te }, " escribo mañana."], tr: { en: "I'll write to you tomorrow." } }
          - { level: A2, verb: preguntar, ex: [{ target: Le }, " pregunto a Juan."], tr: { en: "I'm asking Juan." } }
          - { level: A2, verb: regalar, ex: ["¿Qué ", { target: le }, " regalas a tu madre?"], tr: { en: What are you giving your mother? } }
          - { level: A2, verb: explicar, ex: ["La profesora ", { target: nos }, " explica la regla."], tr: { en: The teacher explains the rule to us. } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Doy le el libro., right: [{ target: Le }, " doy el libro."], rule: { en: "the pronoun goes before a conjugated verb", es: "el pronombre va delante del verbo conjugado" } }
          - { level: A2, wrong: La escribo a Ana., right: [{ target: Le }, " escribo a Ana."], rule: { en: ["a woman as indirect object takes ", { term: le }, " too"], es: ["una mujer como objeto indirecto también lleva ", { term: le }] } }
          - { level: A2, wrong: Lo pregunto a Juan., right: [{ target: Le }, " pregunto a Juan."], rule: { en: [{ term: preguntar }, " takes an indirect object: ", { term: le }], es: [{ term: preguntar }, " lleva objeto indirecto: ", { term: le }] } }
          - { level: A2, wrong: Escribo a él., right: [{ target: Le }, " escribo a él."], rule: { en: [{ term: a él }, " needs ", { term: le }, " too"], es: [{ term: a él }, " también necesita ", { term: le }] } }
          - { level: A2, speakers: [en], wrong: Doy María el libro., right: ["Le doy el libro ", { target: a María }, "."], rule: { en: ["the person takes ", { term: a }, ": “give María the book” is ", { term: dar el libro a María }] } }
