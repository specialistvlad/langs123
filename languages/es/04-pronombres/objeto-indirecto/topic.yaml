          ex: [{ target: Le }, " pregunto a Juan."]
          tr: { en: "I'm asking Juan.", uk: "Я питаю Хуана.", pt: "Estou perguntando ao Juan.", fr: "Je demande à Juan.", de: "Ich frage Juan.", it: "Chiedo a Juan.", pl: "Pytam Juana.", tr: "Juan’a soruyorum.", id: "Saya bertanya kepada Juan.", vi: "Tôi hỏi Juan." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The indirect object is the person who receives something, or for whom something is done."
              es: "El objeto indirecto es la persona que recibe algo, o para quien se hace algo."
              uk: "Непрямий додаток — це людина, яка щось отримує або для якої щось роблять."
              pt: "O objeto indireto é a pessoa que recebe algo, ou para quem algo é feito."
              fr: "Le COI est la personne qui reçoit quelque chose, ou pour qui l’on fait quelque chose."
              de: "Das indirekte Objekt ist die Person, die etwas erhält oder für die etwas getan wird."
              it: "Il complemento indiretto è la persona che riceve qualcosa, o per cui si fa qualcosa."
              pl: "Dopełnienie dalsze to osoba, która coś otrzymuje lub dla której coś się robi."
              tr: "Dolaylı nesne, bir şeyi alan ya da bir şeyin kendisi için yapıldığı kişidir."
              id: "Objek tak langsung adalah orang yang menerima sesuatu, atau untuk siapa sesuatu dilakukan."
              vi: "Tân ngữ gián tiếp là người nhận một thứ gì đó, hoặc người được làm gì đó cho."
            ex: ["Doy el libro ", { target: a Ana }, "."]
            tr: { en: I give the book to Ana., uk: "Я даю книжку Ані.", pt: "Eu dou o livro para a Ana.", fr: "Je donne le livre à Ana.", de: "Ich gebe Ana das Buch.", it: "Do il libro ad Ana.", pl: "Daję książkę Ani.", tr: "Kitabı Ana’ya veriyorum.", id: "Saya memberikan buku itu kepada Ana.", vi: "Tôi đưa quyển sách cho Ana." }
          - type: note
            level: A2
            text:
              en: ["The pronouns for what or whom the verb acts on: ", { link: "Direct Object Pronouns", to: es.pronombres.objeto-directo }, "."]
              es: ["Los pronombres de qué o a quién: ", { link: "El objeto directo", to: es.pronombres.objeto-directo }, "."]
              uk: ["Займенники для того, на що чи на кого спрямована дія: ", { link: "Займенники прямого додатка", to: es.pronombres.objeto-directo }, "."]
              pt: ["Os pronomes de o quê ou quem: ", { link: "Pronomes de objeto direto", to: es.pronombres.objeto-directo }, "."]
              fr: ["Les pronoms de quoi ou de qui : ", { link: "Pronoms COD", to: es.pronombres.objeto-directo }, "."]
              de: ["Die Pronomen für das, worauf sich das Verb richtet: ", { link: "Direkte Objektpronomen", to: es.pronombres.objeto-directo }, "."]
              it: ["I pronomi di che cosa o chi: ", { link: "Pronomi complemento diretto", to: es.pronombres.objeto-directo }, "."]
              pl: ["Zaimki dla tego, na co lub na kogo działa czasownik: ", { link: "Zaimki dopełnienia bliższego", to: es.pronombres.objeto-directo }, "."]
              tr: ["Fiilin etkilediği şey ya da kişi için zamirler: ", { link: "Doğrudan nesne zamirleri", to: es.pronombres.objeto-directo }, "."]
              id: ["Kata ganti untuk apa atau siapa yang dikenai tindakan kata kerja: ", { link: "Kata ganti objek langsung", to: es.pronombres.objeto-directo }, "."]
              vi: ["Các đại từ cho cái gì hoặc ai chịu tác động của động từ: ", { link: "Đại từ tân ngữ trực tiếp", to: es.pronombres.objeto-directo }, "."]
          - type: note
            level: A2
            text:
              en: ["Verbs such as ", { term: gustar }, " name the person with these pronouns: ", { link: "Gustar and Similar Verbs", to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["Verbos como ", { term: gustar }, " nombran a la persona con estos pronombres: ", { link: "Gustar y verbos similares", to: es.ser-estar-hay-gustar.gustar }, "."]
              uk: ["Із дієсловами на кшталт ", { term: gustar }, " людину позначають цими займенниками: ", { link: "Gustar і подібні дієслова", to: es.ser-estar-hay-gustar.gustar }, "."]
              pt: ["Verbos como ", { term: gustar }, " indicam a pessoa com estes pronomes: ", { link: "Gustar e verbos parecidos", to: es.ser-estar-hay-gustar.gustar }, "."]
              fr: ["Des verbes comme ", { term: gustar }, " désignent la personne avec ces pronoms : ", { link: "Gustar et les verbes semblables", to: es.ser-estar-hay-gustar.gustar }, "."]
              de: ["Bei Verben wie ", { term: gustar }, " steht die Person mit diesen Pronomen: ", { link: "Gustar und ähnliche Verben", to: es.ser-estar-hay-gustar.gustar }, "."]
              it: ["Con verbi come ", { term: gustar }, " la persona si indica con questi pronomi: ", { link: "Gustar e i verbi simili", to: es.ser-estar-hay-gustar.gustar }, "."]
              pl: ["Przy czasownikach takich jak ", { term: gustar }, " osobę wskazują te zaimki: ", { link: "Gustar i podobne czasowniki", to: es.ser-estar-hay-gustar.gustar }, "."]
              tr: [{ term: gustar }, " gibi fiillerde kişi bu zamirlerle gösterilir: ", { link: "Gustar ve benzer fiiller", to: es.ser-estar-hay-gustar.gustar }, "."]
              id: ["Kata kerja seperti ", { term: gustar }, " menyebut orangnya dengan kata ganti ini: ", { link: "Gustar dan kata kerja serupa", to: es.ser-estar-hay-gustar.gustar }, "."]
              vi: ["Với các động từ như ", { term: gustar }, " người được nêu bằng những đại từ này: ", { link: "Gustar và các động từ tương tự", to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники", pt: "Forma: os pronomes", fr: "Forme : les pronoms", de: "Form: die Pronomen", it: "Forma: i pronomi", pl: "Forma: zaimki", tr: "Biçim: zamirler", id: "Bentuk: kata ganti", vi: "Dạng: các đại từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto, uk: "Підмет", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" } }
          - { key: object, label: { en: Indirect object, es: Objeto indirecto, uk: "Непрямий додаток", pt: "Objeto indireto", fr: "COI", de: "Indirektes Objekt", it: "Complemento indiretto", pl: "Dopełnienie dalsze", tr: "Dolaylı nesne", id: "Objek tak langsung", vi: "Tân ngữ gián tiếp" } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, subject: yo, object: { target: me } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, subject: tú, object: { target: te } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], subject: { alternatives: [él, ella, usted] }, object: { target: le } }
          - { level: A2, features: { person: 1, number: pl }, subject: { alternatives: [nosotros, nosotras] }, object: { target: nos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, subject: { alternatives: [vosotros, vosotras] }, object: { target: os } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], subject: { alternatives: [ellos, ellas, ustedes] }, object: { target: les } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: le }, " and ", { term: les }, " have no gender: the same form serves a man and a woman."]
              es: [{ term: le }, " y ", { term: les }, " no tienen género: la misma forma sirve para un hombre y para una mujer."]
              uk: [{ term: le }, " і ", { term: les }, " не мають роду: та сама форма годиться для чоловіка й для жінки."]
              pt: [{ term: le }, " e ", { term: les }, " não têm gênero: a mesma forma serve para um homem e para uma mulher."]
              fr: [{ term: le }, " et ", { term: les }, " n’ont pas de genre : la même forme sert pour un homme et pour une femme."]
              de: [{ term: le }, " und ", { term: les }, " haben kein Genus: Dieselbe Form gilt für einen Mann und für eine Frau."]
              it: [{ term: le }, " e ", { term: les }, " non hanno genere: la stessa forma vale per un uomo e per una donna."]
              pl: [{ term: le }, " i ", { term: les }, " nie mają rodzaju: ta sama forma służy mężczyźnie i kobiecie."]
              tr: [{ term: le }, " ve ", { term: les }, " cinsiyet taşımaz: aynı biçim erkek için de kadın için de kullanılır."]
              id: [{ term: le }, " dan ", { term: les }, " tidak punya gender: bentuk yang sama dipakai untuk laki-laki dan perempuan."]
              vi: [{ term: le }, " và ", { term: les }, " không phân giống: cùng một dạng dùng cho cả nam và nữ."]
            ex: { examples: [[{ target: Le }, " escribo a Pedro."], [{ target: Le }, " escribo a Ana."]] }
            tr: { en: { examples: ["I'm writing to Pedro.", "I'm writing to Ana."] }, uk: { examples: ["Я пишу Педрові.", "Я пишу Ані."] }, pt: { examples: ["Estou escrevendo para o Pedro.", "Estou escrevendo para a Ana."] }, fr: { examples: ["J’écris à Pedro.", "J’écris à Ana."] }, de: { examples: ["Ich schreibe Pedro.", "Ich schreibe Ana."] }, it: { examples: ["Scrivo a Pedro.", "Scrivo ad Ana."] }, pl: { examples: ["Piszę do Pedra.", "Piszę do Any."] }, tr: { examples: ["Pedro’ya yazıyorum.", "Ana’ya yazıyorum."] }, id: { examples: ["Saya menulis kepada Pedro.", "Saya menulis kepada Ana."] }, vi: { examples: ["Tôi viết cho Pedro.", "Tôi viết cho Ana."] } }
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " have the same form as the direct object pronouns."]
              es: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " tienen la misma forma que los pronombres de objeto directo."]
              uk: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " мають ту саму форму, що й займенники прямого додатка."]
              pt: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " têm a mesma forma que os pronomes de objeto direto."]
              fr: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " ont la même forme que les pronoms COD."]
              de: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " haben dieselbe Form wie die direkten Objektpronomen."]
              it: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " hanno la stessa forma dei pronomi complemento diretto."]
              pl: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " mają taką samą formę jak zaimki dopełnienia bliższego."]
              tr: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " doğrudan nesne zamirleriyle aynı biçimdedir."]
              id: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " berbentuk sama dengan kata ganti objek langsung."]
              vi: [{ alternatives: [{ term: me }, { term: te }, { term: nos }] }, " có dạng giống đại từ tân ngữ trực tiếp."]

  - title: { en: Le and the person with a, es: Le y la persona con a, uk: "Le і особа з a", pt: "Le e a pessoa com a", fr: "Le et la personne avec a", de: "Le und die Person mit a", it: "Le e la persona con a", pl: "Le i osoba z a", tr: "Le ve a ile gelen kişi", id: "Le dan orang dengan a", vi: "Le và người đi với a" }
