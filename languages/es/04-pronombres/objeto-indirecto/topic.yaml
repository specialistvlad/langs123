          - { level: C1, variety: es-419, kind: { es: "En el habla informal, el plural del objeto indirecto se marca en el segundo pronombre", en: "In informal speech, the plural of the indirect object is marked on the second pronoun", uk: "У розмовному мовленні множину непрямого додатка виражає другий займенник", pt: "Na fala informal, o plural do objeto indireto se marca no segundo pronome", fr: "À l’oral familier, le pluriel du COI se marque sur le second pronom", de: "In der Umgangssprache wird der Plural des indirekten Objekts am zweiten Pronomen markiert", it: "Nel parlato informale, il plurale del complemento indiretto si marca sul secondo pronome", pl: "W mowie potocznej liczbę mnogą dopełnienia dalszego zaznacza drugi zaimek", tr: "Gündelik konuşmada dolaylı nesnenin çoğulu ikinci zamirde belirtilir", id: "Dalam bahasa sehari-hari, bentuk jamak objek tak langsung ditandai pada kata ganti kedua", vi: "Trong khẩu ngữ, số nhiều của tân ngữ gián tiếp được đánh dấu ở đại từ thứ hai" }, ex: { examples: [["Se ", { target: los }, " di el libro a ellos."], ["Se ", { target: las }, " dije la verdad a ellas."]] }, tr: { en: { examples: ["I gave them the book.", "I told them the truth."] }, uk: { examples: ["Я дав їм книжку.", "Я сказав їм правду."] }, pt: { examples: ["Eu dei o livro para eles.", "Eu disse a verdade para elas."] }, fr: { examples: ["Je leur ai donné le livre.", "Je leur ai dit la vérité."] }, de: { examples: ["Ich habe ihnen das Buch gegeben.", "Ich habe ihnen die Wahrheit gesagt."] }, it: { examples: ["Ho dato loro il libro.", "Ho detto loro la verità."] }, pl: { examples: ["Dałem im książkę.", "Powiedziałem im prawdę."] }, tr: { examples: ["Kitabı onlara verdim.", "Gerçeği onlara söyledim."] }, id: { examples: ["Saya memberikan buku itu kepada mereka.", "Saya mengatakan yang sebenarnya kepada mereka."] }, vi: { examples: ["Tôi đưa quyển sách cho họ.", "Tôi nói sự thật với họ."] } } }
          - { level: C2, kind: { es: "Dativo ético: el pronombre muestra el interés del hablante, que no recibe nada", en: "Ethical dative: the pronoun shows the speaker's interest, though the speaker receives nothing", uk: "Етичний давальний: займенник виражає зацікавленість мовця, який нічого не отримує", pt: "Dativo ético: o pronome mostra o interesse do falante, que não recebe nada", fr: "Datif éthique : le pronom montre l’intérêt du locuteur, qui ne reçoit rien", de: "Dativus ethicus: Das Pronomen zeigt die Anteilnahme des Sprechers, der nichts erhält", it: "Dativo etico: il pronome mostra l’interesse di chi parla, che non riceve nulla", pl: "Celownik etyczny: zaimek pokazuje zaangażowanie mówiącego, który niczego nie otrzymuje", tr: "Etik datif: zamir konuşanın ilgisini gösterir; konuşan hiçbir şey almaz", id: "Datif etis: kata ganti menunjukkan kepedulian penutur, yang tidak menerima apa pun", vi: "Dativo ético: đại từ cho thấy sự quan tâm của người nói, người không nhận gì cả" }, ex: { examples: [["El niño no ", { target: me }, " duerme bien."], ["Este niño no ", { target: me }, " come."]] }, tr: { en: { examples: ["The boy isn't sleeping well.", "This boy won't eat."] }, uk: { examples: ["Хлопчик погано спить.", "Цей хлопчик не їсть."] }, pt: { examples: ["O menino não dorme bem.", "Esse menino não come."] }, fr: { examples: ["Le petit ne dort pas bien.", "Ce petit ne mange pas."] }, de: { examples: ["Der Junge schläft nicht gut.", "Dieser Junge isst nicht."] }, it: { examples: ["Il bambino non mi dorme bene.", "Questo bambino non mi mangia."] }, pl: { examples: ["Chłopiec źle śpi.", "Ten chłopiec nic nie je."] }, tr: { examples: ["Çocuk iyi uyumuyor.", "Bu çocuk yemek yemiyor."] }, id: { examples: ["Anak itu tidurnya tidak nyenyak.", "Anak ini tidak mau makan."] }, vi: { examples: ["Thằng bé ngủ không ngon.", "Thằng bé này không chịu ăn."] } } }
          - { level: C2, kind: { es: "Dativo de interés: el pronombre añade la implicación del hablante en lo que hace", en: "Dative of interest: the pronoun adds the speaker's involvement in what they do", uk: "Давальний інтересу: займенник додає причетність мовця до того, що він робить", pt: "Dativo de interesse: o pronome acrescenta o envolvimento do falante no que ele faz", fr: "Datif d’intérêt : le pronom ajoute l’implication du locuteur dans ce qu’il fait", de: "Interessendativ: Das Pronomen zeigt, wie sehr der Sprecher an seinem Tun beteiligt ist", it: "Dativo di interesse: il pronome aggiunge il coinvolgimento di chi parla in ciò che fa", pl: "Celownik zainteresowania: zaimek dodaje zaangażowanie mówiącego w to, co robi", tr: "İlgi datifi: zamir, konuşanın yaptığı işe ilgisini ve katılımını ekler", id: "Datif kepentingan: kata ganti menambahkan keterlibatan penutur dalam apa yang dilakukannya", vi: "Dativo de interés: đại từ thêm sự gắn bó của người nói với việc mình làm" }, ex: ["Estos exámenes ", { target: "me los" }, " corrijo en un santiamén."], tr: { en: "I'll mark these exams in no time.", uk: "Ці іспити я перевірю в одну мить.", pt: "Essas provas eu corrijo num instante.", fr: "Ces copies, je les corrige en un clin d’œil.", de: "Diese Klausuren korrigiere ich im Handumdrehen.", it: "Questi compiti li correggo in un baleno.", pl: "Te egzaminy sprawdzę w mgnieniu oka.", tr: "Bu sınavları göz açıp kapayıncaya kadar düzeltirim.", id: "Ujian-ujian ini akan saya koreksi dalam sekejap.", vi: "Mấy bài thi này tôi chấm trong nháy mắt." } }
          - { level: C2, kind: { es: "Frase fija de indignación", en: "Set phrase of indignation", uk: "Сталий вираз обурення", pt: "Expressão fixa de indignação", fr: "Expression figée d’indignation", de: "Feste Wendung der Empörung", it: "Espressione fissa di indignazione", pl: "Utarty zwrot wyrażający oburzenie", tr: "Öfkeyi anlatan kalıp ifade", id: "Ungkapan tetap untuk kemarahan", vi: "Cụm cố định thể hiện sự phẫn nộ" }, ex: ["¡No ", { target: te }, " fastidia!"], tr: { en: "Well, that's the limit!", uk: "Ну це вже занадто!", pt: "Era só o que faltava!", fr: "Non mais dis donc !", de: "Das ist ja wohl die Höhe!", it: "Ma guarda un po’!", pl: "No tego już za wiele!", tr: "Bu da fazla artık!", id: "Keterlaluan sekali!", vi: "Thật quá đáng!" } }
          - { level: C2, kind: { es: "Frase fija de amenaza", en: "Set phrase of threat", uk: "Сталий вираз погрози", pt: "Expressão fixa de ameaça", fr: "Expression figée de menace", de: "Feste Wendung der Drohung", it: "Espressione fissa di minaccia", pl: "Utarty zwrot wyrażający groźbę", tr: "Tehdit bildiren kalıp ifade", id: "Ungkapan tetap untuk ancaman", vi: "Cụm cố định thể hiện lời đe dọa" }, ex: ["¡", { target: "Me las" }, " pagarás!"], tr: { en: "You'll pay for this!", uk: "Ти мені за це заплатиш!", pt: "Você vai me pagar!", fr: "Tu me le paieras !", de: "Das wirst du mir büßen!", it: "Me la pagherai!", pl: "Drogo za to zapłacisz!", tr: "Bunun hesabını vereceksin!", id: "Kamu akan membayarnya!", vi: "Bạn sẽ phải trả giá!" } }

