          - { level: C2, use: { es: "Con un numeral o un cuantificador: el pronombre va delante", en: "With a numeral or a quantifier: the pronoun goes first", uk: "З числівником чи словом кількості: займенник стоїть попереду", pt: "Com um numeral ou um quantificador: o pronome vai na frente", fr: "Avec un numéral ou un quantificateur : le pronom se place devant", de: "Mit einem Zahlwort oder Mengenwort: Das Pronomen steht davor", it: "Con un numerale o un quantificatore: il pronome va davanti", pl: "Z liczebnikiem lub określnikiem ilości: zaimek stoi na początku", tr: "Sayı sözcüğü ya da miktar sözcüğüyle: zamir öne gelir", id: "Dengan numeralia atau kata penunjuk jumlah: kata ganti berada di depan", vi: "Với số từ hoặc lượng từ: đại từ đứng trước" }, ex: { examples: [[{ target: Nosotros dos }, " viajamos juntos."], [{ target: Ellos tres }, " llegaron tarde."]] }, tr: { en: { examples: ["The two of us travel together.", "The three of them arrived late."] }, uk: { examples: ["Ми удвох подорожуємо разом.", "Вони втрьох прийшли пізно."] }, pt: { examples: ["Nós dois viajamos juntos.", "Os três chegaram atrasados."] }, fr: { examples: ["Nous voyageons ensemble, tous les deux.", "Ils sont arrivés en retard, tous les trois."] }, de: { examples: ["Wir beide reisen zusammen.", "Die drei kamen zu spät."] }, it: { examples: ["Noi due viaggiamo insieme.", "Loro tre sono arrivati tardi."] }, pl: { examples: ["My dwoje podróżujemy razem.", "Ta trójka przyjechała spóźniona."] }, tr: { examples: ["Biz ikimiz birlikte seyahat ediyoruz.", "Onlar üçü geç geldi."] }, id: { examples: ["Kami berdua bepergian bersama.", "Mereka bertiga datang terlambat."] }, vi: { examples: ["Hai chúng tôi đi du lịch cùng nhau.", "Ba người họ đến muộn."] } } }
