          - { level: C2, use: { es: "Reduplicación con un infinitivo: en persona o sin ayuda", en: "Doubling with an infinitive: in person or without help", uk: "Подвоєння з інфінітивом: особисто чи без допомоги", pt: "Reduplicação com um infinitivo: em pessoa ou sem ajuda", fr: "Redoublement avec un infinitif : en personne ou sans aide", de: "Verdopplung mit einem Infinitiv: persönlich oder ohne Hilfe", it: "Raddoppiamento con un infinito: di persona o senza aiuto", pl: "Podwojenie z bezokolicznikiem: osobiście lub bez pomocy", tr: "Mastarla yineleme: bizzat ya da yardımsız", id: "Pengulangan dengan infinitif: secara langsung atau tanpa bantuan", vi: "Lặp lại với động từ nguyên mẫu: đích thân hoặc không cần giúp" }, ex: { examples: [["Mi abuelo quiere hablar ", { target: él }, "."], ["Mi abuelo no puede vestirse ", { target: él }, "."]] }, tr: { en: { examples: ["My grandfather wants to speak himself.", "My grandfather can't dress himself."] }, uk: { examples: ["Мій дід хоче говорити сам.", "Мій дід не може одягнутися сам."] }, pt: { examples: ["O meu avô quer falar ele mesmo.", "O meu avô não consegue se vestir sozinho."] }, fr: { examples: ["Mon grand-père veut parler lui-même.", "Mon grand-père ne peut pas s’habiller tout seul."] }, de: { examples: ["Mein Großvater will selbst sprechen.", "Mein Großvater kann sich nicht allein anziehen."] }, it: { examples: ["Mio nonno vuole parlare lui.", "Mio nonno non riesce a vestirsi da solo."] }, pl: { examples: ["Mój dziadek chce mówić osobiście.", "Mój dziadek nie potrafi sam się ubrać."] }, tr: { examples: ["Dedem bizzat konuşmak istiyor.", "Dedem kendi başına giyinemiyor."] }, id: { examples: ["Kakek saya ingin berbicara sendiri.", "Kakek saya tidak bisa berpakaian sendiri."] }, vi: { examples: ["Ông tôi muốn đích thân nói.", "Ông tôi không thể tự mặc quần áo."] } } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The weather, the time and “it” as a subject take no pronoun: the verb stands alone."
              es: "El tiempo, la hora y otras frases sin sujeto personal no llevan pronombre: el verbo va solo."
              uk: "Речення про погоду, час та інші речення без особового підмета не мають займенника: дієслово стоїть саме."
              pt: "O clima, as horas e outras frases sem sujeito pessoal não levam pronome: o verbo fica sozinho."
              fr: "La météo, l’heure et les autres phrases sans sujet personnel n’ont pas de pronom : le verbe s’emploie seul."
              de: "Wetter, Uhrzeit und andere Sätze ohne persönliches Subjekt haben kein Pronomen: Das Verb steht allein."
              it: "Il tempo atmosferico, l'ora e altre frasi senza soggetto personale non hanno il pronome: il verbo sta da solo."
              pl: "Pogoda, godzina i inne zdania bez osobowego podmiotu nie mają zaimka: czasownik stoi sam."
              tr: "Hava durumu, saat ve kişisel öznesi olmayan diğer cümlelerde zamir kullanılmaz: fiil tek başına durur."
              id: "Cuaca, waktu, dan kalimat lain tanpa subjek orang tidak memakai kata ganti: kata kerja berdiri sendiri."
              vi: "Thời tiết, giờ giấc và các câu khác không có chủ ngữ chỉ người thì không dùng đại từ: động từ đứng một mình."
            ex: { examples: [[{ target: Llueve }, "."], [{ target: Es }, " tarde."]] }
            tr: { en: { examples: ["It's raining.", "It's late."] }, uk: { examples: ["Іде дощ.", "Уже пізно."] }, pt: { examples: ["Está chovendo.", "Já é tarde."] }, fr: { examples: ["Il pleut.", "Il est tard."] }, de: { examples: ["Es regnet.", "Es ist spät."] }, it: { examples: ["Piove.", "È tardi."] }, pl: { examples: ["Pada deszcz.", "Jest późno."] }, tr: { examples: ["Yağmur yağıyor.", "Geç oldu."] }, id: { examples: ["Sedang hujan.", "Sudah larut."] }, vi: { examples: ["Trời đang mưa.", "Muộn rồi."] } }

