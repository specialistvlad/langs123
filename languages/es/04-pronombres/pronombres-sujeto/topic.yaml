            level: A2
            text:
              en: "The weather, the time and “it” as a subject take no pronoun: the verb stands alone."
              es: "El tiempo, la hora y otras frases sin sujeto personal no llevan pronombre: el verbo va solo."
              uk: "Речення про погоду, час та інші речення без особового підмета не мають займенника: дієслово стоїть саме."
              pt: "O clima, as horas e outras frases sem sujeito pessoal não levam pronome: o verbo fica sozinho."
              fr: "La météo, l’heure et les autres phrases sans sujet personnel n’ont pas de pronom : le verbe s’emploie seul."
              de: "Wetter, Uhrzeit und andere Sätze ohne persönliches Subjekt haben kein Pronomen: Das Verb steht allein."
              it: "Il tempo atmosferico, l'ora e altre frasi senza soggetto personale non hanno il pronome: il verbo sta da solo."
              pl: "Pogoda, godzina i inne zdania bez osobowego podmiotu nie mają zaimka: czasownik stoi sam."
              tr: "Hava durumu, saat ve kişisel öznesi olmayan diğer cümlelerde zamir kullanılmaz: fiil tek başına durur."
              id: "Cuaca, waktu, dan kalimat lain tanpa subjek orang tidak memakai kata ganti: kata kerja berdiri sendiri."
              vi: "Thời tiết, giờ giấc và các câu khác không có chủ ngữ chỉ người thì không dùng đại từ: động từ đứng một mình."
            ex: { examples: [[{ target: Llueve }, "."], [{ target: Es }, " tarde."]] }
            tr: { en: { examples: ["It's raining.", "It's late."] }, uk: { examples: ["Іде дощ.", "Уже пізно."] }, pt: { examples: ["Está chovendo.", "Já é tarde."] }, fr: { examples: ["Il pleut.", "Il est tard."] }, de: { examples: ["Es regnet.", "Es ist spät."] }, it: { examples: ["Piove.", "È tardi."] }, pl: { examples: ["Pada deszcz.", "Jest późno."] }, tr: { examples: ["Yağmur yağıyor.", "Geç oldu."] }, id: { examples: ["Sedang hujan.", "Sudah larut."] }, vi: { examples: ["Trời đang mưa.", "Muộn rồi."] } }

