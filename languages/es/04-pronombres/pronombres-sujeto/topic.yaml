# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pronombres.pronombres-sujeto
lang: es
kind: grammar
tags: [pronouns, subject, persons]
concepts: [pronouns]
related: [es.pronombres.tu-usted-vosotros-ustedes, es.pronombres.pronombres-preposicion, es.pronombres.objeto-directo, es.ser-estar-hay-gustar.ser-estar, es.presente.presente-regular]
status: { en: draft, es: draft, uk: draft }
translated: { en: "1f7fbf 9f94bd cd6c4b 0b6a1e b17adf dd9abf", uk: "1f7fbf 9f94bd cd6c4b 0b6a1e b17adf dd9abf" }

title: { en: Subject Pronouns, es: Los pronombres sujeto, uk: "Особові займенники-підмети" }
summary:
  lead:
    en: ["Subject pronouns name who acts: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
    es: ["Los pronombres sujeto dicen quién actúa: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
    uk: ["Займенники-підмети називають, хто діє: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
  rule:
    en: "The verb ending already names the person, so the pronoun drops unless it marks a contrast:"
    es: "La terminación del verbo ya indica la persona, así que el pronombre se omite si no marca un contraste:"
    uk: "Закінчення дієслова вже називає особу, тому займенник опускають, якщо він не протиставляє людей:"
  ex: { examples: [[{ target: Trabajo }, " en un banco."], [{ target: Yo }, " trabajo y ", { target: él }, " estudia."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: { en: Singular, es: Singular, uk: "Однина" }
          rule:
            en: { alternatives: [{ term: yo }, { term: tú }, { term: él }, { term: ella }, { term: usted }] }
            es: { alternatives: [{ term: yo }, { term: tú }, { term: él }, { term: ella }, { term: usted }] }
            uk: { alternatives: [{ term: yo }, { term: tú }, { term: él }, { term: ella }, { term: usted }] }
          ex: ["¿", { target: Tú }, " eres Pablo?"]
          tr: { en: Are you Pablo?, uk: "Ти Пабло?" }
        - level: A0
          point: { en: Plural, es: Plural, uk: "Множина" }
          rule:
            en: { alternatives: [{ term: nosotros }, { term: nosotras }, { term: ellos }, { term: ellas }, { term: ustedes }] }
            es: { alternatives: [{ term: nosotros }, { term: nosotras }, { term: ellos }, { term: ellas }, { term: ustedes }] }
            uk: { alternatives: [{ term: nosotros }, { term: nosotras }, { term: ellos }, { term: ellas }, { term: ustedes }] }
          ex: [{ target: Ellos }, " son mis padres."]
          tr: { en: They're my parents., uk: "Вони мої батьки." }
        - level: A0
          variety: es-419
          point: { en: Plural “you”, es: Tú y usted en plural, uk: "«Ви» до кількох людей" }
          rule:
            en: [{ term: ustedes }, " for any group: friends or strangers"]
            es: [{ term: ustedes }, " para cualquier grupo: amigos o desconocidos"]
            uk: [{ term: ustedes }, " для будь-якої групи: друзів чи незнайомих"]
          ex: ["¿", { target: Ustedes }, " son hermanos?"]
          tr: { en: Are you brothers?, uk: "Ви брати?" }
        - level: A0
          variety: es-ES
          point: { en: Plural “you”, es: Tú y usted en plural, uk: "«Ви» до кількох людей" }
          rule:
            en: [{ alternatives: [{ term: vosotros }, { term: vosotras }] }, " for friends and family, ", { term: ustedes }, " for strangers"]
            es: [{ alternatives: [{ term: vosotros }, { term: vosotras }] }, " en confianza, ", { term: ustedes }, " con desconocidos"]
            uk: [{ alternatives: [{ term: vosotros }, { term: vosotras }] }, " для друзів і рідних, ", { term: ustedes }, " для незнайомих"]
          ex: ["¿", { target: Vosotros }, " sois hermanos?"]
          tr: { en: Are you brothers?, uk: "Ви брати?" }
        - level: A1
          point: { en: Usted, es: Usted, uk: "Usted" }
          rule:
            en: ["formal “you”: it takes the verb form of ", { term: él }]
            es: ["tratamiento formal: lleva la forma del verbo de ", { term: él }]
            uk: ["ввічливе «Ви» до однієї людини: дієслово стоїть у формі, як з ", { term: él }]
          ex: ["¿", { target: Usted habla }, " inglés?"]
          tr: { en: Do you speak English?, uk: "Ви розмовляєте англійською?" }
        - level: A1
          point: { en: No pronoun, es: Sin pronombre, uk: "Без займенника" }
          rule:
            en: "the verb ending names the person, so the pronoun drops"
            es: "la terminación del verbo indica la persona y el pronombre se omite"
            uk: "закінчення дієслова називає особу, тому займенник опускають"
          ex: [{ target: Vivo }, " en Lima."]
          tr: { en: I live in Lima., uk: "Я живу в Лімі." }
        - level: A1
          point: { en: Contrast, es: Contraste, uk: "Протиставлення" }
          rule:
            en: "the pronoun stays to set two people apart"
            es: "el pronombre aparece para distinguir a dos personas"
            uk: "займенник лишається, щоб розрізнити двох людей"
          ex: [{ target: Yo }, " trabajo y ", { target: tú }, " estudias."]
          tr: { en: I work and you study., uk: "Я працюю, а ти навчаєшся." }
        - level: A1
          point: { en: Mixed group, es: Grupo mixto, uk: "Змішана група" }
          rule:
            en: ["men and women together take ", { term: nosotros }, " or ", { term: ellos }]
            es: ["hombres y mujeres juntos llevan ", { term: nosotros }, " o ", { term: ellos }]
            uk: ["чоловіки й жінки разом — це ", { term: nosotros }, " або ", { term: ellos }]
          ex: ["¿Ana y Pedro? ", { target: Ellos }, " también son de Chile."]
          tr: { en: Ana and Pedro? They're from Chile too., uk: "Ана і Педро? Вони теж із Чилі." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "“it” as a subject has no pronoun: the verb stands alone"
            es: "el tiempo y la hora no llevan pronombre: el verbo va solo"
            uk: "у реченнях про погоду й час займенника-підмета немає: дієслово стоїть саме"
          ex: [{ target: Llueve }, "."]
          tr: { en: "It's raining.", uk: "Іде дощ." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "A subject pronoun names who does the action: the speaker, the listener or someone else."
              es: "El pronombre sujeto dice quién hace la acción: quien habla, quien escucha u otra persona."
              uk: "Займенник-підмет називає, хто виконує дію: той, хто говорить, той, хто слухає, або хтось інший."
            ex: [{ target: Ella }, " es médica."]
            tr: { en: "She's a doctor.", uk: "Вона лікарка." }
          - type: note
            level: A1
            text:
              en: ["Choosing between ", { term: tú }, ", ", { term: usted }, " and their plurals: ", { link: "Forms of Address", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              es: ["Cómo elegir entre ", { term: tú }, ", ", { term: usted }, " y sus plurales: ", { link: "Tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              uk: ["Як вибрати між ", { term: tú }, ", ", { term: usted }, " та їхніми формами множини: ", { link: "Форми звертання", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
          - type: note
            level: A1
            text:
              en: ["After a preposition, the pronouns take other forms: ", { link: "Pronouns after Prepositions", to: es.pronombres.pronombres-preposicion }, "."]
              es: ["Después de una preposición, los pronombres cambian de forma: ", { link: "Pronombres con preposición", to: es.pronombres.pronombres-preposicion }, "."]
              uk: ["Після прийменника займенники мають інші форми: ", { link: "Займенники після прийменників", to: es.pronombres.pronombres-preposicion }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: pronoun, label: { en: Pronoun, es: Pronombre, uk: "Займенник" } }
          - { key: refers, label: { en: Refers to, es: Se refiere a, uk: "Кого означає" } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, pronoun: { target: yo }, refers: { en: the speaker, es: quien habla, uk: "того, хто говорить" } }
          - { level: A0, features: { person: 2, number: sg, politeness: infm }, pronoun: { target: tú }, refers: { en: one listener you know well, es: una persona de confianza que escucha, uk: "одного співрозмовника, з яким ви на «ти»" } }
          - { level: A0, features: { person: 2, number: sg, politeness: form }, pronoun: { target: usted }, refers: { en: "one listener, formally", es: "una persona que escucha, con respeto", uk: "одного співрозмовника, ввічливо, на «Ви»" } }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, pronoun: { target: él }, refers: { en: a man or a boy, es: un hombre o un niño, uk: "чоловіка або хлопця" } }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, pronoun: { target: ella }, refers: { en: a woman or a girl, es: una mujer o una niña, uk: "жінку або дівчину" } }
          - { level: A0, features: { person: 1, number: pl, gender: masc }, pronoun: { target: nosotros }, refers: { en: the speaker and others, es: quien habla y otras personas, uk: "того, хто говорить, та інших" } }
          - { level: A0, features: { person: 1, number: pl, gender: fem }, pronoun: { target: nosotras }, refers: { en: the speaker and other women, es: quien habla y otras mujeres, uk: "ту, що говорить, та інших жінок" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: infm, gender: masc }, pronoun: { target: vosotros }, refers: { en: listeners you know well, es: personas de confianza que escuchan, uk: "кількох співрозмовників, з якими ви на «ти»" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: infm, gender: fem }, pronoun: { target: vosotras }, refers: { en: women you know well, es: mujeres de confianza que escuchan, uk: "кількох співрозмовниць, з якими ви на «ти»" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: form }, pronoun: { target: ustedes }, refers: { en: "listeners, formally", es: "personas que escuchan, con respeto", uk: "кількох співрозмовників, ввічливо" } }
          - { level: A0, variety: es-419, features: { person: 2, number: pl }, pronoun: { target: ustedes }, refers: { en: any group of listeners, es: cualquier grupo que escucha, uk: "будь-яку групу співрозмовників" } }
          - { level: A0, features: { person: 3, number: pl, gender: masc }, pronoun: { target: ellos }, refers: { en: "men, or men and women", es: "hombres, u hombres y mujeres", uk: "чоловіків або чоловіків і жінок разом" } }
          - { level: A0, features: { person: 3, number: pl, gender: fem }, pronoun: { target: ellas }, refers: { en: women only, es: solo mujeres, uk: "лише жінок" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: usted }, " and ", { term: ustedes }, " take the verb forms of ", { term: él }, " and ", { term: ellos }, ":"]
              es: [{ term: usted }, " y ", { term: ustedes }, " llevan las formas del verbo de ", { term: él }, " y ", { term: ellos }, ":"]
              uk: [{ term: usted }, " і ", { term: ustedes }, " мають ті самі форми дієслова, що й ", { term: él }, " і ", { term: ellos }, ":"]
            ex: { examples: [["¿", { target: Usted vive }, " aquí?"], [{ target: Ustedes trabajan }, " mucho."]] }
            tr: { en: { examples: [Do you live here?, You work a lot.] }, uk: { examples: ["Ви тут живете?", "Ви багато працюєте."] } }
          - type: rule
            level: A1
            text:
              en: ["A group of men and women takes the masculine forms ", { term: nosotros }, " and ", { term: ellos }, ":"]
              es: ["Un grupo de hombres y mujeres lleva las formas masculinas ", { term: nosotros }, " y ", { term: ellos }, ":"]
              uk: ["Група чоловіків і жінок має форми чоловічого роду ", { term: nosotros }, " і ", { term: ellos }, ":"]
            ex: ["¿Ana y Pedro? ", { target: Ellos }, " también son de Chile."]
            tr: { en: Ana and Pedro? They're from Chile too., uk: "Ана і Педро? Вони теж із Чилі." }
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["In Argentina, Uruguay and much of Central America, ", { term: vos }, " takes the place of ", { term: tú }, "."]
              es: ["En Argentina, Uruguay y buena parte de Centroamérica, ", { term: vos }, " ocupa el lugar de ", { term: tú }, "."]
              uk: ["В Аргентині, Уругваї та більшій частині Центральної Америки замість ", { term: tú }, " кажуть ", { term: vos }, "."]

  - title: { en: When the pronoun appears, es: Cuándo aparece el pronombre, uk: "Коли займенник потрібен" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, use: { en: "No pronoun: the verb ending names the person", es: "Sin pronombre: la terminación del verbo indica la persona", uk: "Без займенника: закінчення дієслова називає особу" }, ex: [{ target: Hablo }, " español."], tr: { en: I speak Spanish., uk: "Я розмовляю іспанською." } }
          - { level: A1, use: { en: Contrast between two people, es: Contraste entre dos personas, uk: "Протиставлення двох людей" }, ex: [{ target: Yo }, " trabajo y ", { target: tú }, " estudias."], tr: { en: I work and you study., uk: "Я працюю, а ти навчаєшся." } }
          - { level: A2, use: { en: ["To make the person clear, when ", { term: él }, ", ", { term: ella }, " and ", { term: usted }, " share a verb form"], es: ["Para aclarar la persona, cuando ", { term: él }, ", ", { term: ella }, " y ", { term: usted }, " comparten la forma del verbo"], uk: ["Щоб уточнити особу, коли ", { term: él }, ", ", { term: ella }, " і ", { term: usted }, " мають однакову форму дієслова"] }, ex: ["¿", { target: Usted }, " es el profesor?"], tr: { en: Are you the teacher?, uk: "Ви вчитель?" } }
          - level: A2
            use: { en: A short answer without a verb, es: Una respuesta corta sin verbo, uk: "Коротка відповідь без дієслова" }
            ex: { exchange: ["¿Quién habla inglés?", [{ target: Yo }, "."]] }
            tr: { en: { exchange: [Who speaks English?, I do.] }, uk: { exchange: ["Хто розмовляє англійською?", "Я."] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The weather, the time and “it” as a subject take no pronoun: the verb stands alone."
              es: "El tiempo, la hora y otras frases sin sujeto personal no llevan pronombre: el verbo va solo."
              uk: "Речення про погоду, час та інші речення без особового підмета не мають займенника: дієслово стоїть саме."
            ex: { examples: [[{ target: Llueve }, "."], [{ target: Es }, " tarde."]] }
            tr: { en: { examples: ["It's raining.", "It's late."] }, uk: { examples: ["Іде дощ.", "Уже пізно."] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: "¿Tú es Pablo?", right: ["¿Tú ", { target: eres }, " Pablo?"], rule: { en: [{ term: tú }, " takes its own verb form: ", { term: eres }], es: [{ term: tú }, " lleva su propia forma del verbo: ", { term: eres }], uk: [{ term: tú }, " має власну форму дієслова: ", { term: eres }] } }
          - { level: A1, wrong: "¿Usted hablas inglés?", right: ["¿Usted ", { target: habla }, " inglés?"], rule: { en: [{ term: usted }, " takes the verb form of ", { term: él }], es: [{ term: usted }, " lleva la forma del verbo de ", { term: él }], uk: [{ term: usted }, " має форму дієслова, як з ", { term: él }] } }
          - { level: A1, speakers: [uk], wrong: "Señor, ¿ustedes son el profesor?", right: ["Señor, ¿", { target: usted es }, " el profesor?"], rule: { uk: ["ввічливе «Ви» до однієї людини — це ", { term: usted }, " з дієсловом в однині, а не множина, як в українській"] } }
          - { level: A1, wrong: Ellas son mis padres., right: [{ target: Ellos }, " son mis padres."], rule: { en: "a mother and a father together take the masculine form", es: "una madre y un padre juntos llevan la forma masculina", uk: "мама й тато разом — це форма чоловічого роду" } }
          - { level: A2, speakers: [en, uk], wrong: "¿Quién es? Es yo.", right: ["¿Quién es? ", { target: Soy yo }, "."], rule: { en: ["“it's me” is ", { term: soy yo }, ": the verb agrees with ", { term: yo }], uk: ["«це я» — ", { term: soy yo }, ": дієслово узгоджується з ", { term: yo }] } }
