          tr: { en: Ana and Pedro? They're from Chile too., uk: "Ана і Педро? Вони теж із Чилі.", pt: "Ana e Pedro? Eles também são do Chile.", fr: "Ana et Pedro ? Ils sont aussi du Chili.", de: "Ana und Pedro? Die kommen auch aus Chile.", it: "Ana e Pedro? Anche loro sono del Cile.", pl: "Ana i Pedro? Oni też są z Chile.", tr: "Ana ile Pedro mu? Onlar da Şili’li.", id: "Ana dan Pedro? Mereka juga dari Chili.", vi: "Ana và Pedro à? Họ cũng là người Chile." }
        - level: B2
          point: { es: Subjuntivo, en: "Subjunctive", uk: "Суб’юнктив", pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" }
          rule: { es: [{ term: yo }, " y ", { term: él }, " comparten forma: el pronombre aclara quién actúa"], en: [{ term: yo }, " and ", { term: él }, " share a form: the pronoun makes clear who acts"], uk: [{ term: yo }, " і ", { term: él }, " мають однакову форму: займенник уточнює, хто діє"], pt: [{ term: yo }, " e ", { term: él }, " compartilham a forma: o pronome esclarece quem age"], fr: [{ term: yo }, " et ", { term: él }, " ont la même forme : le pronom précise qui agit"], de: [{ term: yo }, " und ", { term: él }, " haben dieselbe Form: Das Pronomen macht klar, wer handelt"], it: [{ term: yo }, " e ", { term: él }, " condividono la forma: il pronome chiarisce chi agisce"], pl: [{ term: yo }, " i ", { term: él }, " mają tę samą formę: zaimek wyjaśnia, kto działa"], tr: [{ term: yo }, " ile ", { term: él }, " aynı biçimi paylaşır: zamir kimin eylemde bulunduğunu açıklar"], id: [{ term: yo }, " dan ", { term: él }, " memakai bentuk yang sama: kata ganti memperjelas siapa yang bertindak"], vi: [{ term: yo }, " và ", { term: él }, " có chung một dạng: đại từ làm rõ ai là người hành động"] }
          ex: ["Dudo que ", { target: él }, " lo haga."]
          tr: { en: "I doubt that he'll do it.", uk: "Сумніваюся, що він це зробить.", pt: "Duvido que ele faça isso.", fr: "Je doute qu’il le fasse.", de: "Ich bezweifle, dass er es tut.", it: "Dubito che lo faccia lui.", pl: "Wątpię, żeby on to zrobił.", tr: "Onun bunu yapacağından şüpheliyim.", id: "Saya ragu bahwa dia akan melakukannya.", vi: "Tôi nghi ngờ anh ấy sẽ làm việc đó." }
        - level: C1
          point: { es: Ello, en: "Ello", uk: "Ello", pt: "Ello", fr: "Ello", de: "Ello", it: "Ello", pl: "Ello", tr: "Ello", id: "Ello", vi: "Ello" }
          rule: { es: "pronombre neutro: retoma una idea, no un sustantivo", en: "neuter pronoun: it picks up an idea, not a noun", uk: "займенник середнього роду: відсилає до думки, а не до іменника", pt: "pronome neutro: retoma uma ideia, não um substantivo", fr: "pronom neutre : il reprend une idée, non un nom", de: "neutrales Pronomen: greift einen Gedanken auf, kein Nomen", it: "pronome neutro: riprende un’idea, non un sostantivo", pl: "zaimek nijaki: wraca do myśli, a nie do rzeczownika", tr: "nötr zamir: bir ismi değil, bir düşünceyi anar", id: "kata ganti netral: merujuk kembali pada satu gagasan, bukan pada kata benda", vi: "đại từ trung tính: nhắc lại một ý, không nhắc lại một danh từ" }
          ex: ["Llegó tarde y ", { target: ello }, " me molestó."]
          tr: { en: "He arrived late, and that annoyed me.", uk: "Він запізнився, і це мене роздратувало.", pt: "Ele chegou tarde, e isso me incomodou.", fr: "Il est arrivé en retard, et cela m’a gêné.", de: "Er kam zu spät, und das hat mich gestört.", it: "È arrivato tardi e ciò mi ha dato fastidio.", pl: "Spóźnił się, a to mnie zirytowało.", tr: "Geç geldi ve bu beni rahatsız etti.", id: "Dia datang terlambat, dan hal itu mengganggu saya.", vi: "Anh ấy đến muộn và điều đó làm tôi khó chịu." }
        - level: C2
          point: { es: Énfasis, en: "Emphasis", uk: "Наголос", pt: "Ênfase", fr: "Insistance", de: "Betonung", it: "Enfasi", pl: "Podkreślenie", tr: "Vurgu", id: "Penekanan", vi: "Nhấn mạnh" }
          rule: { es: ["el pronombre refuerza una protesta, una orden o ", { term: solo }], en: ["the pronoun strengthens a protest, a command or ", { term: solo }], uk: ["займенник підсилює протест, наказ або ", { term: solo }], pt: ["o pronome reforça um protesto, uma ordem ou ", { term: solo }], fr: ["le pronom renforce une protestation, un ordre ou ", { term: solo }], de: ["das Pronomen verstärkt einen Protest, einen Befehl oder ", { term: solo }], it: ["il pronome rafforza una protesta, un ordine o ", { term: solo }], pl: ["zaimek wzmacnia protest, polecenie lub ", { term: solo }], tr: ["zamir bir itirazı, bir emri ya da ", { term: solo }, " sözcüğünü pekiştirir"], id: ["kata ganti menguatkan protes, perintah, atau ", { term: solo }], vi: ["đại từ nhấn mạnh một lời phản đối, một mệnh lệnh hoặc ", { term: solo }] }
          ex: ["¡Si ", { target: yo }, " no le he hecho nada!"]
          tr: { en: "But I haven't done anything to him!", uk: "Та я ж йому нічого не зробив!", pt: "Mas eu não fiz nada a ele!", fr: "Mais moi, je ne lui ai rien fait !", de: "Ich habe ihm doch gar nichts getan!", it: "Ma io non gli ho fatto niente!", pl: "Przecież ja mu nic nie zrobiłem!", tr: "Ama ben ona bir şey yapmadım ki!", id: "Padahal saya tidak berbuat apa-apa kepadanya!", vi: "Tôi có làm gì anh ấy đâu!" }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "“it” as a subject has no pronoun: the verb stands alone"
            es: "el tiempo y la hora no llevan pronombre: el verbo va solo"
            uk: "у реченнях про погоду й час займенника в ролі підмета немає: дієслово стоїть саме"
            pt: "o clima e as horas não levam pronome: o verbo fica sozinho"
            fr: "la météo et l’heure n’ont pas de pronom : le verbe s’emploie seul"
            de: "bei Wetter und Uhrzeit steht kein Pronomen: das Verb steht allein"
            it: "il meteo e l'ora non hanno il pronome: il verbo sta da solo"
            pl: "przy pogodzie i godzinie nie ma zaimka: czasownik stoi sam"
            tr: "hava durumu ve saatte zamir kullanılmaz: fiil tek başına durur"
            id: "untuk cuaca dan waktu tidak ada kata ganti: kata kerja berdiri sendiri"
            vi: "khi nói về thời tiết và giờ giấc thì không có đại từ: động từ đứng một mình"
          ex: [{ target: Llueve }, "."]
          tr: { en: "It's raining.", uk: "Іде дощ.", pt: "Está chovendo.", fr: "Il pleut.", de: "Es regnet.", it: "Piove.", pl: "Pada deszcz.", tr: "Yağmur yağıyor.", id: "Sedang hujan.", vi: "Trời đang mưa." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "A subject pronoun names who does the action: the speaker, the listener or someone else."
              es: "El pronombre sujeto dice quién hace la acción: quien habla, quien escucha u otra persona."
              uk: "Займенник у ролі підмета вказує, хто виконує дію: той, хто говорить, той, хто слухає, або хтось інший."
              pt: "O pronome sujeito diz quem faz a ação: quem fala, quem escuta ou outra pessoa."
              fr: "Le pronom sujet indique qui fait l’action : la personne qui parle, celle qui écoute ou une autre."
              de: "Das Subjektpronomen sagt, wer die Handlung ausführt: die sprechende Person, die zuhörende oder eine andere."
              it: "Il pronome soggetto dice chi compie l'azione: chi parla, chi ascolta o un'altra persona."
              pl: "Zaimek w roli podmiotu mówi, kto wykonuje czynność: osoba mówiąca, osoba słuchająca lub ktoś inny."
              tr: "Özne zamiri eylemi kimin yaptığını gösterir: konuşan kişi, dinleyen kişi ya da başka biri."
              id: "Kata ganti subjek menunjukkan siapa yang melakukan tindakan: pembicara, pendengar, atau orang lain."
              vi: "Đại từ chủ ngữ cho biết ai thực hiện hành động: người nói, người nghe hoặc một người khác."
            ex: [{ target: Ella }, " es médica."]
            tr: { en: "She's a doctor.", uk: "Вона лікарка.", pt: "Ela é médica.", fr: "Elle est médecin.", de: "Sie ist Ärztin.", it: "Lei è una dottoressa.", pl: "Ona jest lekarką.", tr: "O bir doktor.", id: "Dia seorang dokter.", vi: "Cô ấy là bác sĩ." }
          - type: note
            level: A1
            text:
              en: ["Choosing between ", { term: tú }, ", ", { term: usted }, " and their plurals: ", { link: "Forms of Address", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              es: ["Cómo elegir entre ", { term: tú }, ", ", { term: usted }, " y sus plurales: ", { link: "Tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              uk: ["Як вибрати між ", { term: tú }, ", ", { term: usted }, " та їхніми формами множини: ", { link: "Форми звертання", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              pt: ["Como escolher entre ", { term: "tú" }, ", ", { term: "usted" }, " e seus plurais: ", { link: "Formas de tratamento: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              fr: ["Comment choisir entre ", { term: "tú" }, ", ", { term: "usted" }, " et leurs pluriels : ", { link: "Formes d’adresse : tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              de: ["Wie man zwischen ", { term: "tú" }, ", ", { term: "usted" }, " und ihren Pluralformen wählt: ", { link: "Anredeformen: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              it: ["Come scegliere tra ", { term: "tú" }, ", ", { term: "usted" }, " e i loro plurali: ", { link: "Forme di cortesia: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              pl: ["Jak wybierać między ", { term: "tú" }, ", ", { term: "usted" }, " i ich formami liczby mnogiej: ", { link: "Formy zwracania się: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              tr: [{ term: "tú" }, ", ", { term: "usted" }, " ve çoğul biçimleri arasında seçim: ", { link: "Hitap biçimleri: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              id: ["Cara memilih antara ", { term: "tú" }, ", ", { term: "usted" }, ", dan bentuk jamaknya: ", { link: "Bentuk sapaan: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              vi: ["Cách chọn giữa ", { term: "tú" }, ", ", { term: "usted" }, " và các dạng số nhiều của chúng: ", { link: "Cách xưng hô: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
          - type: note
            level: A1
            text:
              en: ["After a preposition, the pronouns take other forms: ", { link: "Pronouns after Prepositions", to: es.pronombres.pronombres-preposicion }, "."]
              es: ["Después de una preposición, los pronombres cambian de forma: ", { link: "Pronombres con preposición", to: es.pronombres.pronombres-preposicion }, "."]
              uk: ["Після прийменника займенники мають інші форми: ", { link: "Займенники після прийменників", to: es.pronombres.pronombres-preposicion }, "."]
              pt: ["Depois de uma preposição, os pronomes mudam de forma: ", { link: "Pronomes depois de preposição", to: es.pronombres.pronombres-preposicion }, "."]
              fr: ["Après une préposition, les pronoms changent de forme : ", { link: "Pronoms après une préposition", to: es.pronombres.pronombres-preposicion }, "."]
              de: ["Nach einer Präposition ändern die Pronomen ihre Form: ", { link: "Pronomen nach Präpositionen", to: es.pronombres.pronombres-preposicion }, "."]
              it: ["Dopo una preposizione, i pronomi cambiano forma: ", { link: "Pronomi dopo le preposizioni", to: es.pronombres.pronombres-preposicion }, "."]
              pl: ["Po przyimku zaimki zmieniają formę: ", { link: "Zaimki po przyimkach", to: es.pronombres.pronombres-preposicion }, "."]
              tr: ["Edattan sonra zamirler başka bir biçim alır: ", { link: "Edatlardan sonra zamirler", to: es.pronombres.pronombres-preposicion }, "."]
              id: ["Setelah kata depan, kata ganti berubah bentuk: ", { link: "Kata ganti setelah kata depan", to: es.pronombres.pronombres-preposicion }, "."]
              vi: ["Sau giới từ, đại từ đổi sang dạng khác: ", { link: "Đại từ sau giới từ", to: es.pronombres.pronombres-preposicion }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники", pt: "Forma: os pronomes", fr: "Forme : les pronoms", de: "Form: die Pronomen", it: "Forma: i pronomi", pl: "Forma: zaimki", tr: "Biçim: zamirler", id: "Bentuk: kata ganti", vi: "Dạng: các đại từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: pronoun, label: { en: Pronoun, es: Pronombre, uk: "Займенник", pt: "Pronome", fr: "Pronom", de: "Pronomen", it: "Pronome", pl: "Zaimek", tr: "Zamir", id: "Kata ganti", vi: "Đại từ" } }
          - { key: refers, label: { en: Refers to, es: Se refiere a, uk: "Кого означає", pt: "Refere-se a", fr: "Désigne", de: "Bezieht sich auf", it: "Si riferisce a", pl: "Odnosi się do", tr: "Neyi belirtir", id: "Merujuk pada", vi: "Dùng để chỉ" } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, pronoun: { target: yo }, refers: { en: the speaker, es: quien habla, uk: "того, хто говорить", pt: "quem fala", fr: "la personne qui parle", de: "die sprechende Person", it: "chi parla", pl: "osoby mówiącej", tr: "konuşan kişiyi", id: "pembicara", vi: "người nói" } }
          - { level: A0, features: { person: 2, number: sg, politeness: infm }, pronoun: { target: tú }, refers: { en: one listener you know well, es: una persona de confianza que escucha, uk: "одного співрозмовника, з яким ви на «ти»", pt: "uma pessoa próxima que ouve", fr: "une personne que l’on tutoie", de: "eine Person, die man duzt", it: "una persona a cui si dà del tu", pl: "osoby, z którą jesteś na „ty”", tr: "“sen” diye hitap ettiğiniz tek kişiyi", id: "satu orang yang akrab, disapa dengan “kamu”", vi: "một người nghe mà bạn quen thân" } }
          - { level: A0, features: { person: 2, number: sg, politeness: form }, pronoun: { target: usted }, refers: { en: "one listener, formally", es: "una persona que escucha, con respeto", uk: "одного співрозмовника, ввічливо, на «Ви»", pt: "uma pessoa que ouve, de modo formal", fr: "une personne que l’on vouvoie", de: "eine Person, die man siezt", it: "una persona a cui si dà del Lei", pl: "osoby, do której zwracasz się per „pan” lub „pani”", tr: "“siz” diye hitap ettiğiniz tek kişiyi, saygıyla", id: "satu orang yang disapa secara formal", vi: "một người nghe, nói một cách lịch sự" } }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, pronoun: { target: él }, refers: { en: a man or a boy, es: un hombre o un niño, uk: "чоловіка або хлопця", pt: "um homem ou um menino", fr: "un homme ou un garçon", de: "einen Mann oder einen Jungen", it: "un uomo o un ragazzo", pl: "mężczyzny lub chłopca", tr: "bir erkeği ya da erkek çocuğu", id: "seorang pria atau anak laki-laki", vi: "một người đàn ông hoặc một cậu bé" } }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, pronoun: { target: ella }, refers: { en: a woman or a girl, es: una mujer o una niña, uk: "жінку або дівчину", pt: "uma mulher ou uma menina", fr: "une femme ou une fille", de: "eine Frau oder ein Mädchen", it: "una donna o una ragazza", pl: "kobiety lub dziewczynki", tr: "bir kadını ya da kız çocuğu", id: "seorang wanita atau anak perempuan", vi: "một người phụ nữ hoặc một cô bé" } }
          - { level: A0, features: { person: 1, number: pl, gender: masc }, pronoun: { target: nosotros }, refers: { en: the speaker and others, es: quien habla y otras personas, uk: "того, хто говорить, та інших", pt: "quem fala e outras pessoas", fr: "la personne qui parle et d’autres personnes", de: "die sprechende Person und andere", it: "chi parla e altre persone", pl: "osoby mówiącej i innych osób", tr: "konuşan kişiyi ve başkalarını", id: "pembicara dan orang lain", vi: "người nói và những người khác" } }
          - { level: A0, features: { person: 1, number: pl, gender: fem }, pronoun: { target: nosotras }, refers: { en: the speaker and other women, es: quien habla y otras mujeres, uk: "ту, що говорить, та інших жінок", pt: "quem fala e outras mulheres", fr: "la personne qui parle et d’autres femmes", de: "die sprechende Person und andere Frauen", it: "chi parla e altre donne", pl: "osoby mówiącej i innych kobiet", tr: "konuşan kişiyi ve diğer kadınları", id: "pembicara dan wanita lain", vi: "người nói và những phụ nữ khác" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: infm, gender: masc }, pronoun: { target: vosotros }, refers: { en: listeners you know well, es: personas de confianza que escuchan, uk: "кількох співрозмовників, з якими ви на «ти»", pt: "pessoas próximas que ouvem", fr: "des personnes que l’on tutoie", de: "mehrere Personen, die man duzt", it: "più persone a cui si dà del tu", pl: "osób, z którymi jesteś na „ty”", tr: "yakın olduğunuz birkaç kişiyi", id: "beberapa pendengar yang akrab", vi: "nhiều người nghe mà bạn quen thân" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: infm, gender: fem }, pronoun: { target: vosotras }, refers: { en: women you know well, es: mujeres de confianza que escuchan, uk: "кількох співрозмовниць, з якими ви на «ти»", pt: "mulheres próximas que ouvem", fr: "des femmes que l’on tutoie", de: "mehrere Frauen, die man duzt", it: "più donne a cui si dà del tu", pl: "kobiet, z którymi jesteś na „ty”", tr: "yakın olduğunuz birkaç kadını", id: "beberapa wanita yang akrab", vi: "nhiều phụ nữ mà bạn quen thân" } }
          - { level: A0, variety: es-ES, features: { person: 2, number: pl, politeness: form }, pronoun: { target: ustedes }, refers: { en: "listeners, formally", es: "personas que escuchan, con respeto", uk: "кількох співрозмовників, ввічливо", pt: "pessoas que ouvem, de modo formal", fr: "des personnes que l’on vouvoie", de: "mehrere Personen, die man siezt", it: "più persone, in modo formale", pl: "osób, do których zwracasz się per „państwo”", tr: "birkaç kişiyi, saygıyla", id: "beberapa pendengar, secara formal", vi: "nhiều người nghe, nói một cách lịch sự" } }
