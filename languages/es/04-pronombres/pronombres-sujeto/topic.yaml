          - { level: C1, use: { es: "Cláusula de infinitivo o de gerundio con sujeto propio: el pronombre va detrás del verbo", en: "A clause with an infinitive or a gerund and its own subject: the pronoun goes after the verb", uk: "Конструкція з інфінітивом чи герундієм і власним підметом: займенник стоїть після дієслова", pt: "Oração de infinitivo ou de gerúndio com sujeito próprio: o pronome vai depois do verbo", fr: "Proposition à l’infinitif ou au gérondif avec son propre sujet : le pronom se place après le verbe", de: "Satz mit Infinitiv oder Gerundium und eigenem Subjekt: Das Pronomen steht hinter dem Verb", it: "Proposizione all’infinito o al gerundio con soggetto proprio: il pronome va dopo il verbo", pl: "Zdanie z bezokolicznikiem lub gerundium z własnym podmiotem: zaimek stoi po czasowniku", tr: "Kendi öznesi olan mastarlı ya da gerundio’lu yan cümlede zamir fiilden sonra gelir", id: "Klausa infinitif atau gerundio dengan subjek sendiri: kata ganti berada setelah kata kerja", vi: "Mệnh đề dùng động từ nguyên mẫu hoặc gerundio có chủ ngữ riêng: đại từ đứng sau động từ" }, ex: { examples: [["Al llegar ", { target: él }, ", todos se callaron."], ["Estando ", { target: ella }, " enferma, no salimos."]] }, tr: { en: { examples: ["When he arrived, everyone fell silent.", "As she was ill, we didn't go out."] }, uk: { examples: ["Коли він прийшов, усі замовкли.", "Оскільки вона хвора, ми не вийшли."] }, pt: { examples: ["Quando ele chegou, todos se calaram.", "Estando ela doente, não saímos."] }, fr: { examples: ["Quand il est arrivé, tout le monde s’est tu.", "Comme elle était malade, nous ne sommes pas sortis."] }, de: { examples: ["Als er ankam, verstummten alle.", "Weil sie krank war, sind wir nicht ausgegangen."] }, it: { examples: ["Quando arrivò lui, tutti tacquero.", "Essendo lei malata, non siamo usciti."] }, pl: { examples: ["Gdy on przyszedł, wszyscy umilkli.", "Skoro ona była chora, nie wyszliśmy."] }, tr: { examples: ["O gelince herkes sustu.", "O hasta olduğu için dışarı çıkmadık."] }, id: { examples: ["Ketika dia tiba, semua orang diam.", "Karena dia sakit, kami tidak keluar."] }, vi: { examples: ["Khi anh ấy đến, mọi người đều im lặng.", "Vì cô ấy bị ốm, chúng tôi không ra ngoài."] } } }
