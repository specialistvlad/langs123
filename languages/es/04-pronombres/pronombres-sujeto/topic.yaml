title: { en: Subject Pronouns, es: Los pronombres sujeto, uk: "Особові займенники в ролі підмета", pt: "Os pronomes sujeito", fr: "Les pronoms sujets", de: "Subjektpronomen", it: "I pronomi soggetto", pl: "Zaimki osobowe w roli podmiotu", tr: "Özne olarak kişi zamirleri", id: "Kata ganti subjek", vi: "Đại từ làm chủ ngữ" }
summary:
  lead:
    en: ["Subject pronouns name who acts: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
    es: ["Los pronombres sujeto dicen quién actúa: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
    uk: ["Займенники в ролі підмета вказують, хто діє: ", { term: yo }, ", ", { term: tú }, ", ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }, "."]
    pt: ["Os pronomes sujeito dizem quem faz a ação: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    fr: ["Les pronoms sujets indiquent qui agit : ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    de: ["Subjektpronomen sagen, wer handelt: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    it: ["I pronomi soggetto dicono chi compie l'azione: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    pl: ["Zaimki w roli podmiotu mówią, kto działa: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    tr: ["Özne zamirleri eylemi kimin yaptığını gösterir: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    id: ["Kata ganti subjek menunjukkan siapa yang bertindak: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
    vi: ["Đại từ chủ ngữ cho biết ai là người thực hiện hành động: ", { term: "yo" }, ", ", { term: "tú" }, ", ", { term: "él" }, ", ", { term: "ella" }, ", ", { term: "usted" }, ", ", { term: "nosotros" }, ", ", { term: "ellos" }, ", ", { term: "ustedes" }, "."]
  rule:
    en: "The verb ending already names the person, so the pronoun drops unless it marks a contrast:"
    es: "La terminación del verbo ya indica la persona, así que el pronombre se omite si no marca un contraste:"
    uk: "Закінчення дієслова вже вказує на особу, тому займенник опускають, якщо він не протиставляє людей:"
    pt: "A terminação do verbo já indica a pessoa, então o pronome é omitido, a não ser que marque um contraste:"
    fr: "La terminaison du verbe indique déjà la personne ; le pronom disparaît donc, sauf s’il marque un contraste :"
    de: "Die Verbendung nennt schon die Person, darum entfällt das Pronomen, außer es setzt einen Kontrast:"
    it: "La desinenza del verbo indica già la persona, quindi il pronome si omette, a meno che non segni un contrasto:"
    pl: "Końcówka czasownika wskazuje już osobę, więc zaimek się pomija, chyba że zaznacza kontrast:"
    tr: "Fiil eki kişiyi zaten gösterir; bu yüzden zamir, bir karşıtlık belirtmedikçe söylenmez:"
    id: "Akhiran kata kerja sudah menunjukkan orangnya, jadi kata ganti dihilangkan kecuali untuk menandai kontras:"
    vi: "Đuôi động từ đã cho biết ngôi, nên đại từ được bỏ đi, trừ khi cần tạo sự tương phản:"
  ex: { examples: [[{ target: Trabajo }, " en un banco."], [{ target: Yo }, " trabajo y ", { target: él }, " estudia."]] }

