id: es.pronombres.pronombres-preposicion
lang: es
kind: grammar
tags: [pronouns, prepositions, conmigo, contigo]
concepts: [pronouns]
related: [es.pronombres.pronombres-sujeto, es.pronombres.objeto-indirecto, es.ser-estar-hay-gustar.gustar, es.preposiciones.preposiciones-basicas]
status: { en: draft, es: draft, uk: draft }
translated: { en: "f46a80 77ff13 241858 8e7e9e 399535 c3c128 350c4a f46b3e", uk: "f46a80 77ff13 241858 8e7e9e 399535 c3c128 350c4a f46b3e" }

title: { en: "Pronouns after Prepositions: mí, ti, conmigo", es: "Pronombres con preposición: mí, ti, conmigo", uk: "Займенники після прийменників: mí, ti, conmigo" }
summary:
  lead:
    en: ["After a preposition, ", { term: yo }, " and ", { term: tú }, " become ", { term: mí }, " and ", { term: ti }, ", and the other persons keep their subject forms."]
    es: ["Después de preposición, ", { term: yo }, " y ", { term: tú }, " pasan a ", { term: mí }, " y ", { term: ti }, ", y las demás personas mantienen su forma de sujeto."]
    uk: ["Після прийменника ", { term: yo }, " і ", { term: tú }, " стають ", { term: mí }, " і ", { term: ti }, ", а решта осіб зберігає форму підмета."]
  rule:
    en: [{ term: Con }, " joins ", { term: mí }, " and ", { term: ti }, " into ", { term: conmigo }, " and ", { term: contigo }, ":"]
    es: [{ term: Con }, " se une a ", { term: mí }, " y a ", { term: ti }, " en ", { term: conmigo }, " y ", { term: contigo }, ":"]
    uk: [{ term: Con }, " зливається з ", { term: mí }, " і ", { term: ti }, " у ", { term: conmigo }, " і ", { term: contigo }, ":"]
  ex: { examples: [["¿Vienes ", { target: conmigo }, "?"], ["Quiero hablar ", { target: contigo }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ mapping: [{ term: yo }, { term: mí }] }, ", ", { mapping: [{ term: tú }, { term: ti }] }]
            es: [{ mapping: [{ term: yo }, { term: mí }] }, ", ", { mapping: [{ term: tú }, { term: ti }] }]
            uk: [{ mapping: [{ term: yo }, { term: mí }] }, ", ", { mapping: [{ term: tú }, { term: ti }] }]
          ex: ["Este café es para ", { target: mí }, "."]
          tr: { en: This coffee is for me., uk: "Ця кава для мене." }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["the rest as subject forms: ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }]
            es: ["las demás como formas de sujeto: ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }]
            uk: ["решта — як форми підмета: ", { term: él }, ", ", { term: ella }, ", ", { term: usted }, ", ", { term: nosotros }, ", ", { term: ellos }, ", ", { term: ustedes }]
          ex: ["Hablo con ", { target: ella }, "."]
          tr: { en: "I'm talking to her.", uk: "Я розмовляю з нею." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vosotros }, " and ", { term: vosotras }, " keep their form"]
            es: [{ term: vosotros }, " y ", { term: vosotras }, " mantienen su forma"]
            uk: [{ term: vosotros }, " і ", { term: vosotras }, " зберігають свою форму"]
          ex: ["Es para ", { target: vosotros }, "."]
          tr: { en: "It's for you.", uk: "Це для вас." }
        - level: A2
          variety: es-419
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vos }, " keeps its form: ", { term: para vos }, ", ", { term: con vos }]
            es: [{ term: vos }, " mantiene su forma: ", { term: para vos }, ", ", { term: con vos }]
            uk: [{ term: vos }, " зберігає свою форму: ", { term: para vos }, ", ", { term: con vos }]
          ex: ["Esto es para ", { target: vos }, "."]
          tr: { en: This is for you., uk: "Це для тебе." }
        - level: A2
          point: con
          rule:
            en: [{ term: conmigo }, " and ", { term: contigo }, " for “with me” and “with you” (", { term: tú }, ")"]
            es: [{ term: conmigo }, " y ", { term: contigo }, " para ", { term: yo }, " y ", { term: tú }]
            uk: [{ term: conmigo }, " і ", { term: contigo }, " — «зі мною» і «з тобою» (", { term: tú }, ")"]
          ex: ["¿Vienes ", { target: conmigo }, "?"]
          tr: { en: Are you coming with me?, uk: "Ти йдеш зі мною?" }
        - level: B1
          point: { en: Subject forms, es: Formas de sujeto, uk: "Форми підмета" }
          rule:
            en: [{ alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " take ", { term: yo }, " and ", { term: tú }]
            es: [{ alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " llevan ", { term: yo }, " y ", { term: tú }]
            uk: ["після ", { alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " стоять ", { term: yo }, " і ", { term: tú }]
          ex: ["Entre ", { target: tú }, " y ", { target: yo }, "."]
          tr: { en: Between you and me., uk: "Між тобою і мною." }
        - level: A2
          point: { en: Emphasis, es: Énfasis, uk: "Наголос" }
          rule:
            en: [{ alternatives: [{ term: a mí }, { term: a ti }] }, " go with ", { alternatives: [{ term: me }, { term: te }] }, " to stress the person"]
            es: [{ alternatives: [{ term: a mí }, { term: a ti }] }, " acompañan a ", { alternatives: [{ term: me }, { term: te }] }, " para destacar a la persona"]
            uk: [{ alternatives: [{ term: a mí }, { term: a ti }] }, " разом із ", { alternatives: [{ term: me }, { term: te }] }, " виділяють особу"]
          ex: [{ target: A mí }, " me encanta."]
          tr: { en: I love it., uk: "Мені це дуже подобається." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: mí }, " takes a written accent; ", { term: ti }, " never does"]
            es: [{ term: mí }, " lleva tilde; ", { term: ti }, ", nunca"]
            uk: [{ term: mí }, " має графічний наголос, ", { term: ti }, " — ніколи"]
          ex: ["Esto es para ", { target: ti }, "."]
          tr: { en: This is for you., uk: "Це для тебе." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A pronoun after a preposition such as ", { alternatives: [{ term: a }, { term: de }, { term: con }, { term: para }, { term: sin }] }, " takes its prepositional form."]
              es: ["Un pronombre después de una preposición como ", { alternatives: [{ term: a }, { term: de }, { term: con }, { term: para }, { term: sin }] }, " toma su forma preposicional."]
              uk: ["Займенник після прийменника на кшталт ", { alternatives: [{ term: a }, { term: de }, { term: con }, { term: para }, { term: sin }] }, " має прийменникову форму."]
            ex: ["Vivo cerca de ", { target: ellos }, "."]
            tr: { en: I live near them., uk: "Я живу поруч із ними." }
          - type: note
            level: A2
            text:
              en: ["The forms before the verb: ", { link: "Subject Pronouns", to: es.pronombres.pronombres-sujeto }, "."]
              es: ["Las formas que van delante del verbo: ", { link: "Los pronombres sujeto", to: es.pronombres.pronombres-sujeto }, "."]
              uk: ["Форми перед дієсловом: ", { link: "Особові займенники-підмети", to: es.pronombres.pronombres-sujeto }, "."]

  - title: { en: "Form: the pronouns", es: "Forma: los pronombres", uk: "Форма: займенники" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto, uk: "Підмет" } }
          - { key: prep, label: { en: After a preposition, es: Después de preposición, uk: "Після прийменника" } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, subject: yo, prep: { target: mí } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, subject: tú, prep: { target: ti } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], subject: { alternatives: [él, ella, usted] }, prep: { alternatives: [{ target: él }, { target: ella }, { target: usted }] } }
          - { level: A2, features: { person: 1, number: pl }, subject: { alternatives: [nosotros, nosotras] }, prep: { alternatives: [{ target: nosotros }, { target: nosotras }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, subject: { alternatives: [vosotros, vosotras] }, prep: { alternatives: [{ target: vosotros }, { target: vosotras }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], subject: { alternatives: [ellos, ellas, ustedes] }, prep: { alternatives: [{ target: ellos }, { target: ellas }, { target: ustedes }] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: mí }, " takes a written accent, unlike the possessive ", { term: mi }, "; ", { term: ti }, " never takes one:"]
              es: [{ term: mí }, " lleva tilde, a diferencia del posesivo ", { term: mi }, "; ", { term: ti }, " nunca la lleva:"]
              uk: [{ term: mí }, " має графічний наголос, на відміну від присвійного ", { term: mi }, "; ", { term: ti }, " його ніколи не має:"]
            ex: ["Este regalo es para ", { target: mí }, " y ese es para ", { target: ti }, "."]
            tr: { en: This present is for me and that one is for you., uk: "Цей подарунок для мене, а той — для тебе." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["Where ", { term: vos }, " replaces ", { term: tú }, ", it keeps its form after a preposition:"]
              es: ["Donde ", { term: vos }, " sustituye a ", { term: tú }, ", mantiene su forma después de preposición:"]
              uk: ["Там, де ", { term: vos }, " замінює ", { term: tú }, ", після прийменника він зберігає свою форму:"]
            ex: ["Esto es para ", { target: vos }, "."]
            tr: { en: This is for you., uk: "Це для тебе." }

  - title: { en: "Con: conmigo, contigo", es: "Con: conmigo, contigo", uk: "Con: conmigo, contigo" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: ["“With me”: ", { term: conmigo }], es: ["Primera persona: ", { term: conmigo }], uk: ["«Зі мною»: ", { term: conmigo }] }, ex: ["¿Vienes ", { target: conmigo }, "?"], tr: { en: Are you coming with me?, uk: "Ти йдеш зі мною?" } }
          - { level: A2, use: { en: ["“With you”: ", { term: contigo }], es: ["Segunda persona: ", { term: contigo }], uk: ["«З тобою»: ", { term: contigo }] }, ex: ["Quiero hablar ", { target: contigo }, "."], tr: { en: I want to talk to you., uk: "Я хочу з тобою поговорити." } }
          - { level: A2, use: { en: "Every other person: no change", es: "Las demás personas: sin cambio", uk: "Усі інші особи: без змін" }, ex: ["Salgo ", { target: con ellos }, "."], tr: { en: "I'm going out with them.", uk: "Я йду гуляти з ними." } }

  - title: { en: Prepositions with yo and tú, es: Preposiciones con yo y tú, uk: "Прийменники з yo і tú" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " take the subject forms ", { term: yo }, " and ", { term: tú }, ":"]
              es: [{ alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " llevan las formas de sujeto ", { term: yo }, " y ", { term: tú }, ":"]
              uk: ["Після ", { alternatives: [{ term: entre }, { term: según }, { term: excepto }] }, " стоять форми підмета ", { term: yo }, " і ", { term: tú }, ":"]
            ex: { examples: [["Entre ", { target: tú }, " y ", { target: yo }, "."], ["Según ", { target: tú }, ", es fácil."]] }
            tr: { en: { examples: [Between you and me., "According to you, it's easy."] }, uk: { examples: ["Між тобою і мною.", "На твою думку, це легко."] } }

  - title: { en: "A mí, a ti for emphasis", es: "A mí, a ti para dar énfasis", uk: "A mí, a ti для наголосу" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " and the rest go with ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " to stress the person or set up a contrast:"]
              es: [{ alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " y los demás acompañan a ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " para destacar a la persona o contrastar:"]
              uk: [{ alternatives: [{ term: a mí }, { term: a ti }, { term: a él }] }, " та інші разом із ", { alternatives: [{ term: me }, { term: te }, { term: le }] }, " виділяють особу або протиставляють:"]
            ex: { examples: [[{ target: A mí }, " me encanta."], [{ target: A ti }, " te toca."]] }
            tr: { en: { examples: [I love it., "It's your turn."] }, uk: { examples: ["Мені це дуже подобається.", "Твоя черга."] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Es para yo., right: ["Es para ", { target: mí }, "."], rule: { en: [{ term: yo }, " becomes ", { term: mí }, " after a preposition"], es: [{ term: yo }, " pasa a ", { term: mí }, " después de preposición"], uk: ["після прийменника ", { term: yo }, " стає ", { term: mí }] } }
          - { level: A2, wrong: "¿Vienes con mí?", right: ["¿Vienes ", { target: conmigo }, "?"], rule: { en: ["“with me” is ", { term: conmigo }], es: ["con la primera persona se dice ", { term: conmigo }], uk: ["«зі мною» — це ", { term: conmigo }] } }
          - { level: A2, wrong: Es para tí., right: ["Es para ", { target: ti }, "."], rule: { en: [{ term: ti }, " has no written accent"], es: [{ term: ti }, " no lleva tilde"], uk: [{ term: ti }, " не має графічного наголосу"] } }
          - { level: B1, wrong: Entre mí y ti., right: ["Entre ", { target: tú }, " y ", { target: yo }, "."], rule: { en: [{ term: entre }, " takes ", { term: yo }, " and ", { term: tú }], es: [{ term: entre }, " lleva ", { term: yo }, " y ", { term: tú }], uk: ["після ", { term: entre }, " стоять ", { term: yo }, " і ", { term: tú }] } }
