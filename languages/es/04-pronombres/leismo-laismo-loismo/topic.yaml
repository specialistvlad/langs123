            text: { es: "Un verbo intransitivo pone a la persona en el complemento indirecto: le o les, de hombre o de mujer.", en: "An intransitive verb puts the person in the indirect object: le or les, for a man or a woman.", uk: "Неперехідне дієслово ставить особу в непрямий додаток: le або les, і для чоловіка, і для жінки.", pt: "Um verbo intransitivo põe a pessoa no objeto indireto: le ou les, de homem ou de mulher.", fr: "Un verbe intransitif met la personne au COI : le ou les, pour un homme comme pour une femme.", de: "Ein intransitives Verb setzt die Person ins indirekte Objekt: le oder les, für Mann und Frau.", it: "Un verbo intransitivo mette la persona nel complemento indiretto: le o les, di uomo o di donna.", pl: "Czasownik nieprzechodni umieszcza osobę w dopełnieniu dalszym: le lub les, mężczyznę i kobietę.", tr: "Geçişsiz bir fiil kişiyi dolaylı nesneye yerleştirir: le ya da les, erkek de olsa kadın da olsa.", id: "Kata kerja tak transitif menempatkan orang sebagai objek tak langsung: le atau les, untuk laki-laki maupun perempuan.", vi: "Động từ nội động đặt người vào vị trí tân ngữ gián tiếp: le hoặc les, cho cả nam lẫn nữ." }
            ex: ["A mis padres ", { target: les }, " telefoneo los domingos."]
            tr: { en: "I phone my parents on Sundays.", uk: "Батькам я телефоную щонеділі.", pt: "Eu ligo para meus pais aos domingos.", fr: "Je téléphone à mes parents le dimanche.", de: "Meine Eltern rufe ich sonntags an.", it: "Telefono ai miei genitori la domenica.", pl: "Do rodziców dzwonię w niedziele.", tr: "Anne babamı pazar günleri arıyorum.", id: "Saya menelepon orang tua saya pada hari Minggu.", vi: "Tôi gọi điện cho bố mẹ vào các ngày Chủ nhật." }

