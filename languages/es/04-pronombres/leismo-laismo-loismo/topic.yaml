            text: { es: "En el habla popular, le queda fijo ante un complemento indirecto plural; la lengua culta concuerda en número.", en: "In popular speech, le stays fixed before a plural indirect object; educated usage agrees in number.", uk: "У народній мові le лишається незмінним перед множинним непрямим додатком; літературна мова узгоджує його за числом.", pt: "Na fala popular, le fica fixo diante de um objeto indireto plural; a língua culta concorda em número.", fr: "Dans la langue populaire, le reste invariable devant un COI pluriel ; la langue soignée s’accorde en nombre.", de: "In der Volkssprache bleibt le vor einem indirekten Objekt im Plural unverändert; die Standardsprache gleicht sich in der Zahl an.", it: "Nel parlato popolare, le resta invariato davanti a un complemento indiretto plurale; la lingua colta concorda nel numero.", pl: "W mowie potocznej le pozostaje niezmienne przed dopełnieniem dalszym w liczbie mnogiej; język wykształconych użytkowników zgadza się w liczbie.", tr: "Halk dilinde le, çoğul dolaylı nesnenin önünde sabit kalır; standart dil sayıda uyum sağlar.", id: "Dalam bahasa lisan awam, le tetap sama di depan objek tak langsung jamak; bahasa baku menyesuaikan jumlah.", vi: "Trong khẩu ngữ bình dân, le giữ nguyên trước tân ngữ gián tiếp số nhiều; ngôn ngữ chuẩn mực hòa hợp về số." }

