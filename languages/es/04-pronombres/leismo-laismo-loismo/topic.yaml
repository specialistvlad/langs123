    de: [{ term: "Lo" }, ", ", { term: "la" }, " und ", { term: "le" }, " richten sich nach der Funktion des Objekts; Leísmo bei männlichen Personen ist zugelassen, Laísmo und Loísmo nicht."]
    it: [{ term: "Lo" }, ", ", { term: "la" }, " e ", { term: "le" }, " seguono la funzione del complemento; il leísmo con persona maschile è ammesso, il laísmo e il loísmo no."]
    pl: [{ term: "Lo" }, ", ", { term: "la" }, " i ", { term: "le" }, " zależą od funkcji dopełnienia; leísmo przy osobie płci męskiej jest dopuszczalne, laísmo i loísmo nie."]
    tr: [{ term: "Lo" }, ", ", { term: "la" }, " ve ", { term: "le" }, ", nesnenin işlevine göre seçilir; erkek kişide leísmo kabul edilir, laísmo ve loísmo kabul edilmez."]
    id: [{ term: "Lo" }, ", ", { term: "la" }, ", dan ", { term: "le" }, " mengikuti fungsi objek; leísmo untuk orang laki-laki diterima, laísmo dan loísmo tidak."]
    vi: [{ term: "Lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " theo chức năng tân ngữ; leísmo với nam giới được chấp nhận, laísmo và loísmo thì không."]
  rule:
    es: [{ term: Lo }, " y ", { term: la }, " sustituyen al complemento directo; ", { term: le }, ", al indirecto, de hombre o de mujer:"]
    en: [{ term: "Lo" }, " and ", { term: "la" }, " replace the direct object; ", { term: "le" }, " replaces the indirect object, of a man or a woman:"]
