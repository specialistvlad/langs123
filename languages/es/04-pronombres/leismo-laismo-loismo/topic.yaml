    pt: [{ term: "Lo" }, " e ", { term: "la" }, " substituem o objeto direto; ", { term: "le" }, ", o indireto, de homem ou de mulher:"]
    fr: [{ term: "Lo" }, " et ", { term: "la" }, " remplacent le COD ; ", { term: "le" }, " remplace le COI, d’un homme ou d’une femme :"]
    de: [{ term: "Lo" }, " und ", { term: "la" }, " ersetzen das direkte Objekt, ", { term: "le" }, " das indirekte, für einen Mann wie für eine Frau:"]
    it: [{ term: "Lo" }, " e ", { term: "la" }, " sostituiscono il complemento diretto; ", { term: "le" }, ", quello indiretto, di uomo o di donna:"]
    pl: [{ term: "Lo" }, " i ", { term: "la" }, " zastępują dopełnienie bliższe, a ", { term: "le" }, " — dalsze, zarówno mężczyzny, jak i kobiety:"]
    tr: [{ term: "Lo" }, " ve ", { term: "la" }, " doğrudan nesnenin, ", { term: "le" }, " ise erkek ya da kadın için dolaylı nesnenin yerini tutar:"]
    id: [{ term: "Lo" }, " dan ", { term: "la" }, " menggantikan objek langsung; ", { term: "le" }, " menggantikan objek tak langsung, baik laki-laki maupun perempuan:"]
