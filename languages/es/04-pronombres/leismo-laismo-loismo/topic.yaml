            ex: { ex: ["A Luis ", { target: le }, " vimos ayer."], tr: { en: "We saw Luis yesterday.", uk: "Луїса ми бачили вчора.", pt: "Vimos o Luis ontem.", fr: "Nous avons vu Luis hier.", de: "Wir haben Luis gestern gesehen.", it: "Abbiamo visto Luis ieri.", pl: "Widzieliśmy wczoraj Luisa.", tr: "Luis'i dün gördük.", id: "Kami melihat Luis kemarin.", vi: "Hôm qua chúng tôi gặp Luis." } }
          - level: C1
