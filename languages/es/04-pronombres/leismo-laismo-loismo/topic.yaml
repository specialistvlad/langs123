          tr: { en: "I read the book you lent me.", uk: "Книжку, яку ти мені позичив, я прочитав.", pt: "O livro que você me emprestou, eu li.", fr: "Le livre que tu m’as prêté, je l’ai lu.", de: "Das Buch, das du mir geliehen hast, habe ich gelesen.", it: "Il libro che mi hai prestato l'ho letto.", pl: "Książkę, którą mi pożyczyłeś, przeczytałem.", tr: "Bana ödünç verdiğin kitabı okudum.", id: "Buku yang kamu pinjamkan kepada saya sudah saya baca.", vi: "Cuốn sách bạn cho tôi mượn, tôi đã đọc rồi." }

