            text: { es: "Un verbo con dos construcciones cambia de pronombre según tenga o no un complemento directo de cosa.", en: "A verb with two constructions changes pronoun depending on whether it has a direct object that is a thing.", uk: "Дієслово з двома конструкціями змінює займенник залежно від того, чи має воно прямий додаток-річ.", pt: "Um verbo com duas construções muda de pronome conforme tenha ou não um objeto direto de coisa.", fr: "Un verbe à deux constructions change de pronom selon qu’il a ou non un COD de chose.", de: "Ein Verb mit zwei Konstruktionen wechselt das Pronomen, je nachdem, ob es ein direktes Objekt in Form einer Sache hat oder nicht.", it: "Un verbo con due costruzioni cambia pronome a seconda che abbia o no un complemento diretto di cosa.", pl: "Czasownik o dwóch konstrukcjach zmienia zaimek zależnie od tego, czy ma dopełnienie bliższe w postaci rzeczy.", tr: "İki yapısı olan bir fiilin zamiri, doğrudan nesnesinin bir nesne olup olmamasına göre değişir.", id: "Kata kerja dengan dua konstruksi berganti kata ganti, tergantung ada atau tidaknya objek langsung berupa benda.", vi: "Một động từ có hai cấu trúc đổi đại từ tùy theo có tân ngữ trực tiếp là đồ vật hay không." }

