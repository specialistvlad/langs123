            text: { es: "El pronombre sigue a la función, no al género: el complemento indirecto es siempre le o les.", en: "The pronoun follows the function, not the gender: the indirect object is always le or les.", uk: "Займенник залежить від функції, а не від роду: непрямий додаток — завжди le або les.", pt: "O pronome segue a função, não o gênero: o objeto indireto é sempre le ou les.", fr: "Le pronom suit la fonction, pas le genre : le COI est toujours le ou les.", de: "Das Pronomen richtet sich nach der Funktion, nicht nach dem Genus: Das indirekte Objekt ist immer le oder les.", it: "Il pronome segue la funzione, non il genere: il complemento indiretto è sempre le o les.", pl: "Zaimek zależy od funkcji, nie od rodzaju: dopełnienie dalsze to zawsze le lub les.", tr: "Zamir cinsiyete değil işleve uyar: dolaylı nesne her zaman le ya da les'tir.", id: "Kata ganti mengikuti fungsi, bukan gender: objek tak langsung selalu le atau les.", vi: "Đại từ theo chức năng, không theo giống: tân ngữ gián tiếp luôn là le hoặc les." }
