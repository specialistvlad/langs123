            text: { es: "En España, el leísmo de persona masculina es frecuente y está admitido:", en: "In Spain, leísmo with a male person is common and accepted:", uk: "В Іспанії leísmo щодо чоловіка поширене й допускається:", pt: "Na Espanha, o leísmo com pessoa masculina é frequente e admitido:", fr: "En Espagne, le leísmo avec une personne masculine est fréquent et admis :", de: "In Spanien ist Leísmo bei männlichen Personen häufig und zugelassen:", it: "In Spagna il leísmo con persona maschile è frequente e ammesso:", pl: "W Hiszpanii leísmo przy osobie płci męskiej jest częste i dopuszczalne:", tr: "İspanya'da erkek kişide leísmo yaygındır ve kabul edilir:", id: "Di Spanyol, leísmo untuk orang laki-laki umum terjadi dan diterima:", vi: "Ở Tây Ban Nha, leísmo với người nam là phổ biến và được chấp nhận:" }
            ex: ["A mi tío ", { target: le }, " veo los domingos."]
            tr: { en: "I see my uncle on Sundays.", uk: "Свого дядька я бачу по неділях.", pt: "Eu vejo meu tio aos domingos.", fr: "Je vois mon oncle le dimanche.", de: "Meinen Onkel sehe ich sonntags.", it: "Vedo mio zio la domenica.", pl: "Wujka widuję w niedziele.", tr: "Amcamı pazar günleri görüyorum.", id: "Saya bertemu paman saya pada hari Minggu.", vi: "Tôi gặp chú tôi vào các ngày Chủ nhật." }
          - type: note
            level: B2
            variety: es-419
            text: { es: ["En América, ", { term: lo }, " es la forma habitual para un hombre como complemento directo:"], en: ["In Latin America, ", { term: "lo" }, " is the usual form for a man as direct object:"], uk: ["У Латинській Америці ", { term: "lo" }, " — звична форма для чоловіка в ролі прямого додатка:"], pt: ["Na América Latina, ", { term: "lo" }, " é a forma habitual para um homem como objeto direto:"], fr: ["En Amérique latine, ", { term: "lo" }, " est la forme habituelle pour un homme en COD :"], de: ["In Lateinamerika ist ", { term: "lo" }, " die übliche Form für einen Mann als direktes Objekt:"], it: ["In America Latina ", { term: "lo" }, " è la forma abituale per un uomo come complemento diretto:"], pl: ["W Ameryce Łacińskiej ", { term: "lo" }, " to zwykła forma dla mężczyzny w roli dopełnienia bliższego:"], tr: ["Latin Amerika'da doğrudan nesne olan bir erkek için ", { term: "lo" }, " olağan biçimdir:"], id: ["Di Amerika Latin, ", { term: "lo" }, " adalah bentuk yang lazim untuk laki-laki sebagai objek langsung:"], vi: ["Ở Mỹ Latinh, ", { term: "lo" }, " là dạng thông thường cho một người nam làm tân ngữ trực tiếp:"] }
            ex: ["A mi tío ", { target: lo }, " veo los domingos."]
            tr: { en: "I see my uncle on Sundays.", uk: "Свого дядька я бачу по неділях.", pt: "Eu vejo meu tio aos domingos.", fr: "Je vois mon oncle le dimanche.", de: "Meinen Onkel sehe ich sonntags.", it: "Vedo mio zio la domenica.", pl: "Wujka widuję w niedziele.", tr: "Amcamı pazar günleri görüyorum.", id: "Saya bertemu paman saya pada hari Minggu.", vi: "Tôi gặp chú tôi vào các ngày Chủ nhật." }
          - type: note
            level: B2
            variety: es-419
            text: { es: ["El leísmo con ", { term: se }, " aparece en el Caribe, el sur de Colombia, la costa del Ecuador y Bolivia:"], en: ["Leísmo with ", { term: "se" }, " appears in the Caribbean, southern Colombia, the coast of Ecuador and Bolivia:"], uk: ["Leísmo з ", { term: "se" }, " трапляється в Карибському регіоні, на півдні Колумбії, на узбережжі Еквадору та в Болівії:"], pt: ["O leísmo com ", { term: "se" }, " aparece no Caribe, no sul da Colômbia, na costa do Equador e na Bolívia:"], fr: ["Le leísmo avec ", { term: "se" }, " apparaît dans les Caraïbes, dans le sud de la Colombie, sur la côte de l’Équateur et en Bolivie :"], de: ["Leísmo mit ", { term: "se" }, " tritt in der Karibik, im Süden Kolumbiens, an der Küste Ecuadors und in Bolivien auf:"], it: ["Il leísmo con ", { term: "se" }, " compare nei Caraibi, nel sud della Colombia, sulla costa dell'Ecuador e in Bolivia:"], pl: ["Leísmo z ", { term: "se" }, " występuje na Karaibach, w południowej Kolumbii, na wybrzeżu Ekwadoru i w Boliwii:"], tr: [{ term: "se" }, " ile leísmo Karayipler'de, Kolombiya'nın güneyinde, Ekvador kıyısında ve Bolivya'da görülür:"], id: ["Leísmo dengan ", { term: "se" }, " muncul di Karibia, Kolombia selatan, pesisir Ekuador, dan Bolivia:"], vi: ["Leísmo với ", { term: "se" }, " xuất hiện ở vùng Caribe, miền nam Colombia, bờ biển Ecuador và Bolivia:"] }
            ex: ["A los niños ", { target: se les }, " educa en casa."]
            tr: { en: "Children are brought up at home.", uk: "Дітей виховують удома.", pt: "As crianças são educadas em casa.", fr: "Les enfants sont éduqués à la maison.", de: "Die Kinder werden zu Hause erzogen.", it: "I bambini vengono educati a casa.", pl: "Dzieci są wychowywane w domu.", tr: "Çocuklar evde eğitilir.", id: "Anak-anak dididik di rumah.", vi: "Trẻ em được giáo dục tại nhà." }

