  - title: { es: "Suficiente para: como para", en: "Enough to: como para", uk: "Достатньо, щоб: como para", pt: "Suficiente para: como para", fr: "Assez pour : como para", de: "Genug, um zu: como para", it: "Abbastanza per: como para", pl: "Wystarczająco, żeby: como para", tr: "Yetecek kadar: como para", id: "Cukup untuk: como para", vi: "Đủ để: como para" }
