title: { es: "Las oraciones consecutivas: tan… que, de modo que, de ahí que", en: "Result Clauses: tan… que, de modo que, de ahí que", uk: "Наслідкові підрядні речення: tan… que, de modo que, de ahí que", pt: "As orações consecutivas: tan… que, de modo que, de ahí que", fr: "Les propositions consécutives : tan… que, de modo que, de ahí que", de: "Die Konsekutivsätze: tan… que, de modo que, de ahí que", it: "Le proposizioni consecutive: tan… que, de modo que, de ahí que", pl: "Zdania skutkowe: tan… que, de modo que, de ahí que", tr: "Sonuç cümleleri: tan… que, de modo que, de ahí que", id: "Klausa akibat: tan… que, de modo que, de ahí que", vi: "Mệnh đề kết quả: tan… que, de modo que, de ahí que" }
summary:
  lead:
    es: ["Las consecutivas dicen el resultado de lo anterior con un conector, como ", { term: "de modo que" }, ", o con ", { term: ["tan ", { gap: true }, " que"] }, "."]
    en: ["Result clauses give the outcome with a linker, such as ", { term: "de modo que" }, ", or with ", { term: ["tan ", { gap: true }, " que"] }, "."]
    uk: ["Наслідкові речення називають результат сказаного раніше за допомогою сполучного слова, як-от ", { term: "de modo que" }, ", або через ", { term: ["tan ", { gap: true }, " que"] }, "."]
    pt: ["As consecutivas dizem o resultado do que veio antes com um conectivo, como ", { term: "de modo que" }, ", ou com ", { term: ["tan ", { gap: true }, " que"] }, "."]
    fr: ["Les consécutives disent le résultat de ce qui précède avec un connecteur, comme ", { term: "de modo que" }, ", ou avec ", { term: ["tan ", { gap: true }, " que"] }, "."]
    de: ["Konsekutivsätze nennen das Ergebnis des Vorherigen mit einem Bindewort wie ", { term: "de modo que" }, " oder mit ", { term: ["tan ", { gap: true }, " que"] }, "."]
    it: ["Le consecutive dicono il risultato di ciò che precede con un connettivo, come ", { term: "de modo que" }, ", o con ", { term: ["tan ", { gap: true }, " que"] }, "."]
    pl: ["Zdania skutkowe podają wynik tego, co było wcześniej, za pomocą słowa łączącego, np. ", { term: "de modo que" }, ", albo przez ", { term: ["tan ", { gap: true }, " que"] }, "."]
    tr: ["Sonuç cümleleri, önceki durumun sonucunu ", { term: "de modo que" }, " gibi bir bağlayıcıyla ya da ", { term: ["tan ", { gap: true }, " que"] }, " yapısıyla bildirir."]
    id: ["Klausa akibat menyatakan hasil dari hal sebelumnya dengan kata penghubung, seperti ", { term: "de modo que" }, ", atau dengan ", { term: ["tan ", { gap: true }, " que"] }, "."]
    vi: ["Mệnh đề kết quả nêu kết quả bằng một từ nối, như ", { term: "de modo que" }, ", hoặc bằng ", { term: ["tan ", { gap: true }, " que"] }, "."]
  rule:
    es: ["El adjetivo y el adverbio llevan ", { term: tan }, "; el sustantivo y el verbo, ", { term: tanto }, "; ", { term: que }, " abre la consecuencia:"]
    en: ["An adjective and an adverb take ", { term: "tan" }, "; a noun and a verb take ", { term: "tanto" }, "; ", { term: "que" }, " opens the result:"]
    uk: ["Прикметник і прислівник беруть ", { term: "tan" }, "; іменник і дієслово — ", { term: "tanto" }, "; ", { term: "que" }, " відкриває наслідок:"]
    pt: ["O adjetivo e o advérbio levam ", { term: "tan" }, "; o substantivo e o verbo, ", { term: "tanto" }, "; ", { term: "que" }, " abre a consequência:"]
    fr: ["L’adjectif et l’adverbe prennent ", { term: "tan" }, " ; le nom et le verbe, ", { term: "tanto" }, " ; ", { term: "que" }, " ouvre la conséquence :"]
    de: ["Adjektiv und Adverb stehen mit ", { term: "tan" }, "; Nomen und Verb mit ", { term: "tanto" }, "; ", { term: "que" }, " leitet die Folge ein:"]
    it: ["L'aggettivo e l'avverbio vogliono ", { term: "tan" }, "; il sostantivo e il verbo, ", { term: "tanto" }, "; ", { term: "que" }, " apre la conseguenza:"]
    pl: ["Przymiotnik i przysłówek biorą ", { term: "tan" }, "; rzeczownik i czasownik — ", { term: "tanto" }, "; ", { term: "que" }, " otwiera skutek:"]
    tr: ["Sıfat ve zarf ", { term: "tan" }, " alır; isim ve fiil ", { term: "tanto" }, " alır; ", { term: "que" }, " sonucu başlatır:"]
    id: ["Kata sifat dan kata keterangan memakai ", { term: "tan" }, "; kata benda dan kata kerja memakai ", { term: "tanto" }, "; ", { term: "que" }, " membuka akibatnya:"]
    vi: ["Tính từ, trạng từ đi với ", { term: "tan" }, "; danh từ, động từ đi với ", { term: "tanto" }, "; ", { term: "que" }, " mở đầu kết quả:"]
  ex: { examples: [["Es ", { target: "tan alto que" }, " no cabe."], ["Estudia ", { target: "tanto que" }, " no duerme."]] }

