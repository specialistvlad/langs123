          tr: { en: "I missed the train, so I arrived late.", uk: "Я не встиг на потяг, тож приїхав пізно.", pt: "Perdi o trem, então cheguei tarde.", fr: "J’ai raté le train, si bien que je suis arrivé en retard.", de: "Ich habe den Zug verpasst, sodass ich zu spät kam.", it: "Ho perso il treno, quindi sono arrivato tardi.", pl: "Nie zdążyłem na pociąg, więc przyjechałem późno.", tr: "Treni kaçırdım, bu yüzden geç kaldım.", id: "Saya ketinggalan kereta, sehingga saya datang terlambat.", vi: "Tôi lỡ chuyến tàu nên đến muộn." }
        - level: B2
