          rule: { es: [{ term: tanto }, " va detrás del verbo y no cambia"], en: [{ term: "tanto" }, " goes after the verb and does not change"], uk: [{ term: "tanto" }, " стоїть після дієслова й не змінюється"], pt: [{ term: "tanto" }, " vai depois do verbo e não muda"], fr: [{ term: "tanto" }, " se place après le verbe et ne change pas"], de: [{ term: "tanto" }, " steht nach dem Verb und verändert sich nicht"], it: [{ term: "tanto" }, " sta dopo il verbo e non cambia"], pl: [{ term: "tanto" }, " stoi po czasowniku i się nie zmienia"], tr: [{ term: "tanto" }, " fiilden sonra gelir ve değişmez"], id: [{ term: "tanto" }, " berada setelah kata kerja dan tidak berubah"], vi: [{ term: "tanto" }, " đứng sau động từ và không thay đổi"] }
          ex: ["Estudia ", { target: "tanto que" }, " no tiene tiempo para nada."]
          tr: { en: "She studies so much that she has no time for anything.", uk: "Вона так багато вчиться, що ні на що не має часу.", pt: "Ela estuda tanto que não tem tempo para nada.", fr: "Elle étudie tellement qu’elle n’a le temps de rien faire.", de: "Sie lernt so viel, dass sie für nichts anderes Zeit hat.", it: "Studia così tanto che non ha tempo per nient'altro.", pl: "Uczy się tak dużo, że nie ma na nic czasu.", tr: "O kadar çok çalışıyor ki hiçbir şeye vakti kalmıyor.", id: "Dia belajar begitu banyak sampai tidak punya waktu untuk apa pun.", vi: "Cô ấy học nhiều đến mức không có thời gian cho việc gì khác." }
        - level: B2
