          rule: { es: [{ term: tan }, " delante de adjetivo o adverbio, y luego ", { term: que }], en: [{ term: "tan" }, " before an adjective or adverb, then ", { term: "que" }], uk: [{ term: "tan" }, " перед прикметником або прислівником, далі ", { term: "que" }], pt: [{ term: "tan" }, " diante de adjetivo ou advérbio, e depois ", { term: "que" }], fr: [{ term: "tan" }, " devant un adjectif ou un adverbe, puis ", { term: "que" }], de: [{ term: "tan" }, " steht vor einem Adjektiv oder Adverb, danach ", { term: "que" }], it: [{ term: "tan" }, " davanti ad aggettivo o avverbio, poi ", { term: "que" }], pl: [{ term: "tan" }, " przed przymiotnikiem lub przysłówkiem, potem ", { term: "que" }], tr: [{ term: "tan" }, " sıfatın veya zarfın önünde gelir, ardından ", { term: "que" }], id: [{ term: "tan" }, " di depan kata sifat atau kata keterangan, lalu ", { term: "que" }], vi: [{ term: "tan" }, " đứng trước tính từ hoặc trạng từ, rồi đến ", { term: "que" }] }
          ex: ["Es ", { target: "tan alto que" }, " no cabe en la cama."]
          tr: { en: "He is so tall that he doesn't fit in the bed.", uk: "Він такий високий, що не вміщається на ліжку.", pt: "Ele é tão alto que não cabe na cama.", fr: "Il est si grand qu’il ne tient pas dans le lit.", de: "Er ist so groß, dass er nicht ins Bett passt.", it: "È così alto che non ci sta nel letto.", pl: "Jest tak wysoki, że nie mieści się w łóżku.", tr: "O kadar uzun ki yatağa sığmıyor.", id: "Dia begitu tinggi sampai tidak muat di tempat tidur.", vi: "Anh ấy cao đến mức không vừa giường." }
        - level: B2
