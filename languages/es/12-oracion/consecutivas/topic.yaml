              pt: ["Com o mesmo sujeito vai o infinitivo; com outro sujeito, ", { term: "como para que" }, " e o subjuntivo."]
              fr: ["Avec le même sujet, on met l’infinitif ; avec un autre sujet, ", { term: "como para que" }, " et le subjonctif."]
              de: ["Bei gleichem Subjekt steht der Infinitiv; bei anderem Subjekt ", { term: "como para que" }, " mit dem Konjunktiv."]
              it: ["Con lo stesso soggetto va l'infinito; con un altro soggetto, ", { term: "como para que" }, " e il congiuntivo."]
              pl: ["Przy tym samym podmiocie stoi bezokolicznik; przy innym podmiocie — ", { term: "como para que" }, " i tryb łączący."]
              tr: ["Özne aynıysa mastar kullanılır; özne farklıysa ", { term: "como para que" }, " ve dilek kipi kullanılır."]
              id: ["Dengan subjek yang sama dipakai infinitif; dengan subjek lain, ", { term: "como para que" }, " dan subjungtif."]
              vi: ["Khi chủ ngữ giống nhau dùng nguyên mẫu; khi chủ ngữ khác, dùng ", { term: "como para que" }, " và thức giả định."]

