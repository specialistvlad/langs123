          rule: { es: [{ term: tanto }, " concuerda con el sustantivo"], en: [{ term: "tanto" }, " agrees with the noun"], uk: [{ term: "tanto" }, " узгоджується з іменником"], pt: [{ term: "tanto" }, " concorda com o substantivo"], fr: [{ term: "tanto" }, " s’accorde avec le nom"], de: [{ term: "tanto" }, " richtet sich nach dem Nomen"], it: [{ term: "tanto" }, " concorda con il sostantivo"], pl: [{ term: "tanto" }, " zgadza się z rzeczownikiem"], tr: [{ term: "tanto" }, " isimle uyum sağlar"], id: [{ term: "tanto" }, " menyesuaikan diri dengan kata benda"], vi: [{ term: "tanto" }, " hòa hợp với danh từ"] }
          ex: ["Tenía ", { target: "tantas dudas que" }, " no pudo decidir."]
          tr: { en: "She had so many doubts that she couldn't decide.", uk: "У неї було стільки сумнівів, що вона не змогла вирішити.", pt: "Ela tinha tantas dúvidas que não conseguiu decidir.", fr: "Elle avait tant de doutes qu’elle n’a pas pu décider.", de: "Sie hatte so viele Zweifel, dass sie sich nicht entscheiden konnte.", it: "Aveva così tanti dubbi che non è riuscita a decidere.", pl: "Miała tyle wątpliwości, że nie mogła się zdecydować.", tr: "O kadar çok kuşkusu vardı ki karar veremedi.", id: "Dia punya begitu banyak keraguan sampai tidak bisa memutuskan.", vi: "Cô ấy có nhiều nghi ngờ đến mức không thể quyết định." }
        - level: B2
