          rule: { es: ["un conector introduce la consecuencia: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], en: ["a linker introduces the result: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], uk: ["сполучне слово вводить наслідок: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], pt: ["um conectivo introduz a consequência: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], fr: ["un connecteur introduit la conséquence : ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], de: ["ein Bindewort leitet die Folge ein: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], it: ["un connettivo introduce la conseguenza: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], pl: ["słowo łączące wprowadza skutek: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], tr: ["sonucu bir bağlayıcı bildirir: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], id: ["kata penghubung memperkenalkan akibat: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }], vi: ["một từ nối đưa vào kết quả: ", { term: "de modo que" }, ", ", { term: "por lo tanto" }] }
