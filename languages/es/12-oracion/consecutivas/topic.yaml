            ex: ["No soy ", { target: "tan ingenuo como para" }, " creerlo."]
            tr: { en: "I'm not naive enough to believe it.", uk: "Я не настільки наївний, щоб у це повірити.", pt: "Não sou ingênuo a ponto de acreditar nisso.", fr: "Je ne suis pas assez naïf pour le croire.", de: "Ich bin nicht so naiv, das zu glauben.", it: "Non sono così ingenuo da crederci.", pl: "Nie jestem aż tak naiwny, żeby w to uwierzyć.", tr: "Buna inanacak kadar saf değilim.", id: "Saya tidak sepolos itu sampai mempercayainya.", vi: "Tôi không ngây thơ đến mức tin điều đó." }
          - level: C1
            pattern: { pattern: [{ term: demasiado }, { slot: adjective }, { alternatives: [como para, para] }, { slot: infinitive }] }
            ex: { examples: [["Estaba ", { target: "demasiado cansado como para" }, " seguir."], ["Estaba ", { target: "demasiado cansado para" }, " seguir."]] }
            tr: { en: { examples: ["He was too tired to go on.", "He was too tired to go on."] }, uk: { examples: ["Він був надто втомлений, щоб іти далі.", "Він був надто втомлений, щоб іти далі."] }, pt: { examples: ["Ele estava cansado demais para continuar.", "Ele estava cansado demais para continuar."] }, fr: { examples: ["Il était trop fatigué pour continuer.", "Il était trop fatigué pour continuer."] }, de: { examples: ["Er war zu müde, um weiterzumachen.", "Er war zu müde, um weiterzumachen."] }, it: { examples: ["Era troppo stanco per continuare.", "Era troppo stanco per continuare."] }, pl: { examples: ["Był zbyt zmęczony, żeby iść dalej.", "Był zbyt zmęczony, żeby iść dalej."] }, tr: { examples: ["Devam edemeyecek kadar yorgundu.", "Devam edemeyecek kadar yorgundu."] }, id: { examples: ["Dia terlalu lelah untuk melanjutkan.", "Dia terlalu lelah untuk melanjutkan."] }, vi: { examples: ["Anh ấy quá mệt để tiếp tục.", "Anh ấy quá mệt để tiếp tục."] } }
          - level: C1
            pattern: { pattern: [{ term: "como para que" }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }] }
            ex: ["La mesa es lo bastante grande ", { target: "como para que" }, " cenemos todos."]
            tr: { en: "The table is big enough for all of us to have dinner.", uk: "Стіл достатньо великий, щоб ми всі повечеряли.", pt: "A mesa é grande o bastante para jantarmos todos.", fr: "La table est assez grande pour que nous dînions tous.", de: "Der Tisch ist groß genug, dass wir alle essen können.", it: "Il tavolo è abbastanza grande perché possiamo cenare tutti.", pl: "Stół jest wystarczająco duży, żebyśmy wszyscy mogli zjeść kolację.", tr: "Masa hepimizin yemek yiyebileceği kadar büyük.", id: "Mejanya cukup besar untuk kita makan malam bersama.", vi: "Cái bàn đủ lớn để tất cả chúng ta ăn tối." }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: ["Con el mismo sujeto va el infinitivo; con otro sujeto, ", { term: "como para que" }, " y el subjuntivo."]
              en: ["With the same subject, use the infinitive; with a different subject, ", { term: "como para que" }, " and the subjunctive."]
