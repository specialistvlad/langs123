            tr: { en: "He is so stingy that he won't even buy you a coffee.", uk: "Він такий скнара, що навіть кави не поставить.", pt: "Ele é tão mão de vaca que nem um café paga.", fr: "Il est si radin qu’il n’offre même pas un café.", de: "Er ist so geizig, dass er nicht einmal einen Kaffee ausgibt.", it: "È così tirchio che non offre nemmeno un caffè.", pl: "Jest tak skąpy, że nie postawi nawet kawy.", tr: "O kadar cimri ki bir kahve bile ısmarlamıyor.", id: "Dia begitu pelit sampai secangkir kopi pun tidak mau mentraktir.", vi: "Anh ấy keo kiệt đến mức không mời nổi một ly cà phê." }
          - level: C1
            pattern: { pattern: [{ term: si }, { slot: verb }, { slot: adjective }, { term: que }] }
            register: { es: coloquial, en: "colloquial", uk: "розмовний", pt: "coloquial", fr: "familier", de: "umgangssprachlich", it: "colloquiale", pl: "potoczny", tr: "günlük dilde", id: "sehari-hari", vi: "thông tục" }
            ex: ["¡", { target: "Si será despistado que" }, " se olvidó de su propia boda!"]
            tr: { en: "He is so absent-minded that he forgot his own wedding!", uk: "Який же він неуважний — забув навіть про власне весілля!", pt: "Como ele é distraído: esqueceu até do próprio casamento!", fr: "Qu’est-ce qu’il est distrait : il a oublié son propre mariage !", de: "Wie zerstreut er ist: Er hat seine eigene Hochzeit vergessen!", it: "Ma quanto è distratto: si è dimenticato del suo stesso matrimonio!", pl: "Jaki on roztargniony: zapomniał o własnym ślubie!", tr: "Ne kadar dalgınmış ki kendi düğününü bile unutmuş!", id: "Betapa pelupanya dia sampai lupa pada pernikahannya sendiri!", vi: "Anh ấy đãng trí đến mức quên cả đám cưới của chính mình!" }
          - level: C2
            pattern: { pattern: [{ alternatives: [de un, de una] }, { slot: noun }, { term: tal }, { term: que }] }
            register: { es: literario, en: "literary", uk: "літературний", pt: "literário", fr: "littéraire", de: "literarisch", it: "letterario", pl: "literacki", tr: "edebî", id: "sastra", vi: "văn chương" }
            ex: ["Era ", { target: "de una amabilidad tal que" }, " todos la querían."]
            tr: { en: "She was so kind that everybody loved her.", uk: "Вона була настільки привітною, що її любили всі.", pt: "Ela era de uma amabilidade tal que todos gostavam dela.", fr: "Elle était d’une amabilité telle que tout le monde l’aimait.", de: "Sie war von einer solchen Freundlichkeit, dass alle sie mochten.", it: "Era di una gentilezza tale che tutti le volevano bene.", pl: "Była tak uprzejma, że wszyscy ją lubili.", tr: "O kadar nazikti ki herkes onu severdi.", id: "Dia begitu ramah sampai semua orang menyukainya.", vi: "Cô ấy tử tế đến mức ai cũng quý mến." }
          - level: C2
            pattern: { pattern: [{ term: así }, { slot: verb }, { slot: noun }, { term: que }] }
            register: { es: literario, en: "literary", uk: "літературний", pt: "literário", fr: "littéraire", de: "literarisch", it: "letterario", pl: "literacki", tr: "edebî", id: "sastra", vi: "văn chương" }
            ex: [{ target: "Así fue su enfado que" }, " nadie se atrevió a hablar."]
            tr: { en: "So great was his anger that nobody dared to speak.", uk: "Такою була його злість, що ніхто не наважився заговорити.", pt: "Tamanha foi a sua raiva que ninguém se atreveu a falar.", fr: "Telle fut sa colère que personne n’osa parler.", de: "So groß war sein Zorn, dass sich niemand zu sprechen traute.", it: "Tale fu la sua rabbia che nessuno osò parlare.", pl: "Tak wielki był jego gniew, że nikt nie ośmielił się odezwać.", tr: "Öfkesi öyle büyüktü ki kimse konuşmaya cesaret edemedi.", id: "Begitu besar amarahnya sampai tak seorang pun berani bicara.", vi: "Cơn giận của ông ấy lớn đến mức không ai dám nói." }
          - level: C2
            pattern: { pattern: [{ term: "una de" }, { slot: plural noun }, { term: que }] }
            register: { es: coloquial, en: "colloquial", uk: "розмовний", pt: "coloquial", fr: "familier", de: "umgangssprachlich", it: "colloquiale", pl: "potoczny", tr: "günlük dilde", id: "sehari-hari", vi: "thông tục" }
            ex: ["Había ", { target: "una de coches que" }, " no se podía cruzar."]
            tr: { en: "There were so many cars that you couldn't cross.", uk: "Було стільки машин, що не можна було перейти.", pt: "Havia tantos carros que não dava para atravessar.", fr: "Il y avait tellement de voitures qu’on ne pouvait pas traverser.", de: "Es gab so viele Autos, dass man nicht über die Straße kam.", it: "C'erano tante di quelle macchine che non si poteva attraversare.", pl: "Było tyle samochodów, że nie dało się przejść.", tr: "O kadar çok araba vardı ki karşıya geçilmiyordu.", id: "Ada banyak sekali mobil sampai tidak bisa menyeberang.", vi: "Xe nhiều vô kể đến mức không sao băng qua đường được." }
          - level: C2
            pattern: { pattern: [{ slot: clause }, { term: "como que" }, { slot: clause }] }
            register: { es: coloquial, en: "colloquial", uk: "розмовний", pt: "coloquial", fr: "familier", de: "umgangssprachlich", it: "colloquiale", pl: "potoczny", tr: "günlük dilde", id: "sehari-hari", vi: "thông tục" }
            ex: ["Hace un calor ", { target: "como que" }, " no se puede ni respirar."]
            tr: { en: "It's so hot that you can't even breathe.", uk: "Така спека, що навіть дихати неможливо.", pt: "Está um calor que nem dá para respirar.", fr: "Il fait une chaleur à ne même plus pouvoir respirer.", de: "Es ist so heiß, dass man kaum atmen kann.", it: "Fa un caldo che non si riesce nemmeno a respirare.", pl: "Jest taki upał, że nie da się nawet oddychać.", tr: "Öyle bir sıcak var ki nefes bile alınmıyor.", id: "Panasnya sampai-sampai kita tidak bisa bernapas.", vi: "Nóng đến mức thở cũng không nổi." }
          - level: C2
            pattern: { pattern: [{ term: de }, { alternatives: [el, la, los, las] }, { slot: noun }, { term: que }, { slot: verb }] }
            register: { es: coloquial, en: "colloquial", uk: "розмовний", pt: "coloquial", fr: "familier", de: "umgangssprachlich", it: "colloquiale", pl: "potoczny", tr: "günlük dilde", id: "sehari-hari", vi: "thông tục" }
            ex: ["No podía hablar ", { target: "de la risa que" }, " tenía."]
            tr: { en: "She couldn't speak, she was laughing so much.", uk: "Вона не могла говорити, так сміялася.", pt: "Ela não conseguia falar de tanto rir.", fr: "Elle ne pouvait plus parler tellement elle riait.", de: "Sie konnte vor Lachen nicht sprechen.", it: "Non riusciva a parlare dalle risate.", pl: "Nie mogła mówić ze śmiechu.", tr: "Gülmekten konuşamıyordu.", id: "Dia tidak bisa bicara karena tertawa terus.", vi: "Cô ấy cười đến mức không nói được." }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: ["Tras una afirmación, ", { term: ["tan ", { gap: true }, " que"] }, " y ", { term: ["tanto ", { gap: true }, " que"] }, " llevan indicativo."]
              en: ["After an affirmative statement, ", { term: ["tan ", { gap: true }, " que"] }, " and ", { term: ["tanto ", { gap: true }, " que"] }, " take the indicative."]
              uk: ["Після ствердження ", { term: ["tan ", { gap: true }, " que"] }, " і ", { term: ["tanto ", { gap: true }, " que"] }, " вживаються з дійсним способом."]
              pt: ["Depois de uma afirmação, ", { term: ["tan ", { gap: true }, " que"] }, " e ", { term: ["tanto ", { gap: true }, " que"] }, " levam indicativo."]
              fr: ["Après une affirmation, ", { term: ["tan ", { gap: true }, " que"] }, " et ", { term: ["tanto ", { gap: true }, " que"] }, " prennent l’indicatif."]
              de: ["Nach einer Aussage stehen ", { term: ["tan ", { gap: true }, " que"] }, " und ", { term: ["tanto ", { gap: true }, " que"] }, " mit dem Indikativ."]
              it: ["Dopo un'affermazione, ", { term: ["tan ", { gap: true }, " que"] }, " e ", { term: ["tanto ", { gap: true }, " que"] }, " vogliono l'indicativo."]
              pl: ["Po zdaniu twierdzącym ", { term: ["tan ", { gap: true }, " que"] }, " i ", { term: ["tanto ", { gap: true }, " que"] }, " łączą się z trybem oznajmującym."]
              tr: ["Olumlu bir cümleden sonra ", { term: ["tan ", { gap: true }, " que"] }, " ve ", { term: ["tanto ", { gap: true }, " que"] }, " bildirme kipi alır."]
              id: ["Setelah pernyataan positif, ", { term: ["tan ", { gap: true }, " que"] }, " dan ", { term: ["tanto ", { gap: true }, " que"] }, " memakai indikatif."]
              vi: ["Sau một câu khẳng định, ", { term: ["tan ", { gap: true }, " que"] }, " và ", { term: ["tanto ", { gap: true }, " que"] }, " đi với thức chỉ định."]
            ex: ["Corre tan rápido que nadie lo ", { target: alcanza }, "."]
            tr: { en: "He runs so fast that nobody catches him.", uk: "Він бігає так швидко, що ніхто його не наздожене.", pt: "Ele corre tão rápido que ninguém o alcança.", fr: "Il court si vite que personne ne le rattrape.", de: "Er rennt so schnell, dass ihn niemand einholt.", it: "Corre così veloce che nessuno lo raggiunge.", pl: "Biega tak szybko, że nikt go nie dogoni.", tr: "O kadar hızlı koşuyor ki kimse ona yetişemiyor.", id: "Dia berlari begitu cepat sampai tidak ada yang bisa menyusulnya.", vi: "Anh ấy chạy nhanh đến mức không ai đuổi kịp." }

  - title: { es: "Consecuencia entre oraciones: registro culto", en: "Result between sentences: educated register", uk: "Наслідок між реченнями: книжний стиль", pt: "Consequência entre orações: registro culto", fr: "Conséquence entre phrases : registre soutenu", de: "Folge zwischen Sätzen: gehobene Sprache", it: "Conseguenza tra frasi: registro colto", pl: "Skutek między zdaniami: styl wysoki", tr: "Cümleler arasında sonuç: yüksek üslup", id: "Akibat antarkalimat: ragam bahasa tinggi", vi: "Kết quả giữa các câu: văn phong trang trọng" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { es: Conector, en: "Linker", uk: "Сполучник", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: mood, label: { es: Modo, en: "Mood", uk: "Спосіб", pt: "Modo", fr: "Mode", de: "Modus", it: "Modo", pl: "Tryb", tr: "Kip", id: "Modus", vi: "Thức" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            linker: luego
            mood: { es: indicativo, en: "indicative", uk: "дійсний спосіб", pt: "indicativo", fr: "indicatif", de: "Indikativ", it: "indicativo", pl: "tryb oznajmujący", tr: "bildirme kipi", id: "indikatif", vi: "thức chỉ định" }
            ex: ["Las luces están apagadas; ", { target: luego }, " no hay nadie."]
            tr: { en: "The lights are off; therefore nobody is there.", uk: "Світло вимкнене, отже, нікого немає.", pt: "As luzes estão apagadas; logo, não há ninguém.", fr: "Les lumières sont éteintes ; donc il n’y a personne.", de: "Die Lichter sind aus; also ist niemand da.", it: "Le luci sono spente; dunque non c'è nessuno.", pl: "Światła są zgaszone, a zatem nikogo nie ma.", tr: "Işıklar kapalı; demek ki kimse yok.", id: "Lampunya mati; jadi, tidak ada orang.", vi: "Đèn đã tắt; vậy là không có ai." }
          - level: C1
            linker: { alternatives: [pues, así pues] }
            mood: { es: indicativo, en: "indicative", uk: "дійсний спосіб", pt: "indicativo", fr: "indicatif", de: "Indikativ", it: "indicativo", pl: "tryb oznajmujący", tr: "bildirme kipi", id: "indikatif", vi: "thức chỉ định" }
            ex: { examples: [["Dices que no te interesa; ", { target: pues }, " no insistiré."], ["No hay billetes; ", { target: "así pues" }, ", iremos en tren."]] }
            tr: { en: { examples: ["You say you're not interested; well then, I won't insist.", "There are no tickets; so we'll go by train."] }, uk: { examples: ["Ти кажеш, що тебе це не цікавить; що ж, не наполягатиму.", "Квитків немає, отже поїдемо потягом."] }, pt: { examples: ["Você diz que não se interessa; pois então não insistirei.", "Não há passagens; portanto, iremos de trem."] }, fr: { examples: ["Tu dis que ça ne t’intéresse pas ; alors je n’insisterai pas.", "Il n’y a plus de billets ; nous irons donc en train."] }, de: { examples: ["Du sagst, es interessiert dich nicht; dann dränge ich nicht weiter.", "Es gibt keine Fahrkarten; also fahren wir mit dem Zug."] }, it: { examples: ["Dici che non ti interessa; allora non insisterò.", "Non ci sono biglietti; quindi andremo in treno."] }, pl: { examples: ["Mówisz, że cię to nie interesuje; no to nie będę nalegać.", "Nie ma biletów, zatem pojedziemy pociągiem."] }, tr: { examples: ["İlgilenmediğini söylüyorsun; o hâlde ısrar etmeyeceğim.", "Bilet yok; öyleyse trenle gideceğiz."] }, id: { examples: ["Katamu kamu tidak tertarik; kalau begitu, aku tidak akan memaksa.", "Tiket habis; jadi, kami akan naik kereta."] }, vi: { examples: ["Bạn nói là bạn không quan tâm; vậy thì tôi sẽ không nài nữa.", "Hết vé; vậy nên chúng tôi sẽ đi bằng tàu."] } }
          - level: C1
            linker: de ahí que
            mood: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" }
            ex: ["El puente está cerrado; ", { target: "de ahí que" }, " haya tanto tráfico."]
            tr: { en: "The bridge is closed; that's why there is so much traffic.", uk: "Міст закрито, тому на дорозі стільки машин.", pt: "A ponte está fechada; por isso há tanto trânsito.", fr: "Le pont est fermé ; d’où toute cette circulation.", de: "Die Brücke ist gesperrt; daher der viele Verkehr.", it: "Il ponte è chiuso; da qui tutto questo traffico.", pl: "Most jest zamknięty; stąd taki duży ruch.", tr: "Köprü kapalı; bu yüzden trafik çok yoğun.", id: "Jembatan ditutup; itulah sebabnya lalu lintas begitu padat.", vi: "Cây cầu đang đóng; vì thế giao thông mới đông như vậy." }
          - level: C1
            linker: { pattern: [{ term: "de ahí" }, { slot: noun }] }
            ex: ["Tiene mucho miedo; ", { target: "de ahí" }, " su silencio."]
            tr: { en: "He is very afraid; hence his silence.", uk: "Йому дуже страшно; звідси його мовчання.", pt: "Ele tem muito medo; daí o seu silêncio.", fr: "Il a très peur ; d’où son silence.", de: "Er hat große Angst; daher sein Schweigen.", it: "Ha molta paura; da qui il suo silenzio.", pl: "Bardzo się boi; stąd jego milczenie.", tr: "Çok korkuyor; sessizliği bundan.", id: "Dia sangat takut; karena itulah dia diam.", vi: "Anh ấy rất sợ; vì thế anh ấy im lặng." }
          - level: C1
            linker: { alternatives: [consecuentemente, consiguientemente] }
            mood: { es: indicativo, en: "indicative", uk: "дійсний спосіб", pt: "indicativo", fr: "indicatif", de: "Indikativ", it: "indicativo", pl: "tryb oznajmujący", tr: "bildirme kipi", id: "indikatif", vi: "thức chỉ định" }
            ex: ["Pagó tarde; ", { target: consecuentemente }, ", le cobraron un recargo."]
            tr: { en: "He paid late; consequently, he was charged a surcharge.", uk: "Він заплатив із запізненням; відповідно, з нього стягнули доплату.", pt: "Ele pagou tarde; consequentemente, cobraram-lhe uma taxa extra.", fr: "Il a payé en retard ; en conséquence, on lui a facturé un supplément.", de: "Er zahlte zu spät; folglich wurde ihm ein Aufschlag berechnet.", it: "Ha pagato in ritardo; di conseguenza gli hanno addebitato una maggiorazione.", pl: "Zapłacił z opóźnieniem; w konsekwencji naliczono mu dopłatę.", tr: "Geç ödedi; bunun sonucunda kendisinden ek ücret alındı.", id: "Dia membayar terlambat; akibatnya, dia dikenai biaya tambahan.", vi: "Anh ấy trả tiền muộn; do đó, anh ấy bị tính thêm phụ phí." }
          - level: C2
            linker: { alternatives: [de suerte que, de tal suerte que] }
            mood: { es: indicativo o subjuntivo, en: "indicative or subjunctive", uk: "дійсний спосіб або суб’юнктив", pt: "indicativo ou subjuntivo", fr: "indicatif ou subjonctif", de: "Indikativ oder Konjunktiv", it: "indicativo o congiuntivo", pl: "tryb oznajmujący lub łączący", tr: "bildirme kipi veya dilek kipi", id: "indikatif atau subjungtif", vi: "thức chỉ định hoặc thức giả định" }
            ex: { examples: [["Habló ", { target: "de tal suerte que" }, " nadie dudó de él."], ["Organizó la fiesta ", { target: "de suerte que" }, " todos se divirtieran."]] }
            tr: { en: { examples: ["He spoke in such a way that nobody doubted him.", "She organised the party so that everyone would have fun."] }, uk: { examples: ["Він говорив так, що ніхто в ньому не сумнівався.", "Вона організувала вечірку так, щоб усі розважилися."] }, pt: { examples: ["Ele falou de tal modo que ninguém duvidou dele.", "Ela organizou a festa de modo que todos se divertissem."] }, fr: { examples: ["Il a parlé de telle sorte que personne n’a douté de lui.", "Elle a organisé la fête de façon que tout le monde s’amuse."] }, de: { examples: ["Er sprach so, dass niemand an ihm zweifelte.", "Sie organisierte das Fest so, dass sich alle amüsierten."] }, it: { examples: ["Parlò in modo tale che nessuno dubitò di lui.", "Organizzò la festa in modo che tutti si divertissero."] }, pl: { examples: ["Mówił tak, że nikt w niego nie wątpił.", "Zorganizowała przyjęcie tak, żeby wszyscy się dobrze bawili."] }, tr: { examples: ["Öyle konuştu ki kimse ondan şüphe etmedi.", "Herkes eğlensin diye partiyi öyle düzenledi."] }, id: { examples: ["Dia berbicara sedemikian rupa sehingga tak seorang pun meragukannya.", "Dia mengatur pesta itu sedemikian rupa agar semua orang bersenang-senang."] }, vi: { examples: ["Anh ấy nói theo cách khiến không ai nghi ngờ anh ấy.", "Cô ấy tổ chức bữa tiệc sao cho mọi người đều vui."] } }
          - level: C2
            linker: conque
            mood: { es: indicativo o imperativo, en: "indicative or imperative", uk: "дійсний спосіб або наказовий спосіб", pt: "indicativo ou imperativo", fr: "indicatif ou impératif", de: "Indikativ oder Imperativ", it: "indicativo o imperativo", pl: "tryb oznajmujący lub rozkazujący", tr: "bildirme kipi veya emir kipi", id: "indikatif atau kalimat perintah", vi: "thức chỉ định hoặc thức mệnh lệnh" }
            ex: { examples: [["Ya no tengo dinero, ", { target: conque }, " no podré ir."], ["Ya hemos hablado bastante, ", { target: conque }, " vete a dormir."]] }
            tr: { en: { examples: ["I have no money left, so I won't be able to go.", "We've talked enough, so go to sleep."] }, uk: { examples: ["У мене більше немає грошей, тож я не зможу піти.", "Ми вже достатньо поговорили, тож іди спати."] }, pt: { examples: ["Já não tenho dinheiro, então não poderei ir.", "Já conversamos bastante, então vá dormir."] }, fr: { examples: ["Je n’ai plus d’argent, alors je ne pourrai pas y aller.", "Nous avons assez parlé, alors va dormir."] }, de: { examples: ["Ich habe kein Geld mehr, also kann ich nicht hingehen.", "Wir haben genug geredet, also geh jetzt schlafen."] }, it: { examples: ["Non ho più soldi, quindi non potrò andare.", "Abbiamo parlato abbastanza, quindi vai a dormire."] }, pl: { examples: ["Nie mam już pieniędzy, więc nie będę mógł pójść.", "Dość już rozmawialiśmy, więc idź spać."] }, tr: { examples: ["Param kalmadı, o yüzden gidemeyeceğim.", "Yeterince konuştuk, o yüzden git uyu."] }, id: { examples: ["Uangku sudah habis, jadi aku tidak bisa pergi.", "Kita sudah cukup bicara, jadi pergilah tidur."] }, vi: { examples: ["Tôi hết tiền rồi, nên tôi sẽ không đi được.", "Chúng ta nói chuyện đủ rồi, nên đi ngủ đi."] } }
