          rule: { es: "indicativo para la consecuencia, subjuntivo para la finalidad", en: "indicative for the result, subjunctive for the purpose", uk: "дійсний спосіб для наслідку, суб’юнктив для мети", pt: "indicativo para a consequência, subjuntivo para a finalidade", fr: "indicatif pour la conséquence, subjonctif pour le but", de: "Indikativ für die Folge, Konjunktiv für den Zweck", it: "indicativo per la conseguenza, congiuntivo per la finalità", pl: "tryb oznajmujący dla skutku, tryb łączący dla celu", tr: "sonuç için bildirme kipi, amaç için dilek kipi", id: "indikatif untuk akibat, subjungtif untuk tujuan", vi: "thức chỉ định cho kết quả, thức giả định cho mục đích" }
          ex: { examples: [["Perdí el tren, de modo que ", { target: llegué }, " tarde."], ["Habla de modo que te ", { target: entiendan }, "."]] }
          tr: { en: { examples: ["I missed the train, so I arrived late.", "Speak so that they understand you."] }, uk: { examples: ["Я не встиг на потяг, тож приїхав пізно.", "Говори так, щоб тебе розуміли."] }, pt: { examples: ["Perdi o trem, então cheguei tarde.", "Fale de modo que entendam você."] }, fr: { examples: ["J’ai raté le train, si bien que je suis arrivé en retard.", "Parle de façon à ce qu’on te comprenne."] }, de: { examples: ["Ich habe den Zug verpasst, sodass ich zu spät kam.", "Sprich so, dass man dich versteht."] }, it: { examples: ["Ho perso il treno, quindi sono arrivato tardi.", "Parla in modo che ti capiscano."] }, pl: { examples: ["Nie zdążyłem na pociąg, więc przyjechałem późno.", "Mów tak, żeby cię zrozumiano."] }, tr: { examples: ["Treni kaçırdım, bu yüzden geç kaldım.", "İnsanlar seni anlasın diye konuş."] }, id: { examples: ["Saya ketinggalan kereta, sehingga saya datang terlambat.", "Bicaralah supaya mereka mengerti kamu."] }, vi: { examples: ["Tôi lỡ chuyến tàu nên đến muộn.", "Hãy nói sao cho người ta hiểu bạn."] } }
        - level: C1
          point: { es: Registro culto, en: "Educated register", uk: "Книжний стиль", pt: "Registro culto", fr: "Registre soutenu", de: "Gehobene Sprache", it: "Registro colto", pl: "Styl wysoki", tr: "Yüksek üslup", id: "Ragam bahasa tinggi", vi: "Văn phong trang trọng" }
          rule: { es: [{ term: luego }, ", ", { term: "así pues" }, " y ", { term: consecuentemente }, " unen dos oraciones"], en: [{ term: "luego" }, ", ", { term: "así pues" }, " and ", { term: "consecuentemente" }, " join two sentences"], uk: [{ term: "luego" }, ", ", { term: "así pues" }, " і ", { term: "consecuentemente" }, " поєднують два речення"], pt: [{ term: "luego" }, ", ", { term: "así pues" }, " e ", { term: "consecuentemente" }, " unem duas orações"], fr: [{ term: "luego" }, ", ", { term: "así pues" }, " et ", { term: "consecuentemente" }, " relient deux phrases"], de: [{ term: "luego" }, ", ", { term: "así pues" }, " und ", { term: "consecuentemente" }, " verbinden zwei Sätze"], it: [{ term: "luego" }, ", ", { term: "así pues" }, " e ", { term: "consecuentemente" }, " uniscono due frasi"], pl: [{ term: "luego" }, ", ", { term: "así pues" }, " i ", { term: "consecuentemente" }, " łączą dwa zdania"], tr: [{ term: "luego" }, ", ", { term: "así pues" }, " ve ", { term: "consecuentemente" }, " iki cümleyi birbirine bağlar"], id: [{ term: "luego" }, ", ", { term: "así pues" }, " dan ", { term: "consecuentemente" }, " menghubungkan dua kalimat"], vi: [{ term: "luego" }, ", ", { term: "así pues" }, " và ", { term: "consecuentemente" }, " nối hai câu với nhau"] }
          ex: ["No hay billetes; ", { target: "así pues" }, ", iremos en tren."]
          tr: { en: "There are no tickets; so we'll go by train.", uk: "Квитків немає, отже поїдемо потягом.", pt: "Não há passagens; portanto, iremos de trem.", fr: "Il n’y a plus de billets ; nous irons donc en train.", de: "Es gibt keine Fahrkarten; also fahren wir mit dem Zug.", it: "Non ci sono biglietti; quindi andremo in treno.", pl: "Nie ma biletów, zatem pojedziemy pociągiem.", tr: "Bilet yok; öyleyse trenle gideceğiz.", id: "Tiket habis; jadi, kami akan naik kereta.", vi: "Hết vé; vậy nên chúng tôi sẽ đi bằng tàu." }
        - level: C1
          point: { es: Subjuntivo, en: "Subjunctive", uk: "Суб’юнктив", pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" }
          rule: { es: [{ term: "de ahí que" }, " lleva subjuntivo"], en: [{ term: "de ahí que" }, " takes the subjunctive"], uk: [{ term: "de ahí que" }, " вимагає суб’юнктива"], pt: [{ term: "de ahí que" }, " leva subjuntivo"], fr: [{ term: "de ahí que" }, " demande le subjonctif"], de: [{ term: "de ahí que" }, " steht mit Konjunktiv"], it: [{ term: "de ahí que" }, " vuole il congiuntivo"], pl: [{ term: "de ahí que" }, " łączy się z trybem łączącym"], tr: [{ term: "de ahí que" }, " dilek kipi ister"], id: [{ term: "de ahí que" }, " memakai subjungtif"], vi: [{ term: "de ahí que" }, " đi với thức giả định"] }
          ex: ["El puente está cerrado; ", { target: "de ahí que" }, " haya tanto tráfico."]
          tr: { en: "The bridge is closed; that's why there is so much traffic.", uk: "Міст закрито, тому на дорозі стільки машин.", pt: "A ponte está fechada; por isso há tanto trânsito.", fr: "Le pont est fermé ; d’où toute cette circulation.", de: "Die Brücke ist gesperrt; daher der viele Verkehr.", it: "Il ponte è chiuso; da qui tutto questo traffico.", pl: "Most jest zamknięty; stąd taki duży ruch.", tr: "Köprü kapalı; bu yüzden trafik çok yoğun.", id: "Jembatan ditutup; itulah sebabnya lalu lintas begitu padat.", vi: "Cây cầu đang đóng; vì thế giao thông mới đông như vậy." }
        - level: C1
          point: { es: Intensidad culta, en: "Educated intensifier", uk: "Книжне підсилення", pt: "Intensidade culta", fr: "Intensité soutenue", de: "Gehobene Verstärkung", it: "Intensità colta", pl: "Wzmocnienie w stylu wysokim", tr: "Yüksek üslupta vurgulama", id: "Penekanan ragam tinggi", vi: "Nhấn mạnh trang trọng" }
          rule: { es: [{ term: tal }, " va delante del sustantivo, sin artículo"], en: [{ term: "tal" }, " goes before the noun, with no article"], uk: [{ term: "tal" }, " стоїть перед іменником, без артикля"], pt: [{ term: "tal" }, " vai diante do substantivo, sem artigo"], fr: [{ term: "tal" }, " se place devant le nom, sans article"], de: [{ term: "tal" }, " steht vor dem Nomen, ohne Artikel"], it: [{ term: "tal" }, " sta davanti al sostantivo, senza articolo"], pl: [{ term: "tal" }, " stoi przed rzeczownikiem, bez przedimka"], tr: [{ term: "tal" }, " isimden önce gelir, artikel almaz"], id: [{ term: "tal" }, " berada di depan kata benda, tanpa artikel"], vi: [{ term: "tal" }, " đứng trước danh từ, không có mạo từ"] }
          ex: ["Tenía ", { target: "tal prisa que" }, " olvidó las llaves."]
          tr: { en: "He was in such a hurry that he forgot his keys.", uk: "Він так поспішав, що забув ключі.", pt: "Ele estava com tanta pressa que esqueceu as chaves.", fr: "Il était si pressé qu’il a oublié ses clés.", de: "Er hatte es so eilig, dass er die Schlüssel vergaß.", it: "Aveva tanta fretta che dimenticò le chiavi.", pl: "Tak się spieszył, że zapomniał kluczy.", tr: "O kadar acelesi vardı ki anahtarlarını unuttu.", id: "Dia begitu terburu-buru sampai lupa kuncinya.", vi: "Anh ấy vội đến mức quên cả chìa khóa." }
        - level: C1
          point: { es: Suficiente para, en: "Enough to", uk: "Достатньо, щоб", pt: "Suficiente para", fr: "Assez pour", de: "Genug, um zu", it: "Abbastanza per", pl: "Wystarczająco, żeby", tr: "Yetecek kadar", id: "Cukup untuk", vi: "Đủ để" }
          rule: { es: [{ term: "como para" }, " lleva infinitivo tras lo bastante o tanto"], en: [{ term: "como para" }, " takes an infinitive after lo bastante or tanto"], uk: [{ term: "como para" }, " вживається з інфінітивом після lo bastante або tanto"], pt: [{ term: "como para" }, " leva infinitivo depois de lo bastante ou tanto"], fr: [{ term: "como para" }, " prend l’infinitif après lo bastante ou tanto"], de: [{ term: "como para" }, " steht mit Infinitiv nach lo bastante oder tanto"], it: [{ term: "como para" }, " vuole l'infinito dopo lo bastante o tanto"], pl: [{ term: "como para" }, " łączy się z bezokolicznikiem po lo bastante lub tanto"], tr: [{ term: "como para" }, " lo bastante veya tanto sonrasında mastar alır"], id: [{ term: "como para" }, " memakai infinitif setelah lo bastante atau tanto"], vi: [{ term: "como para" }, " đi với nguyên mẫu sau lo bastante hoặc tanto"] }
          ex: ["Eres lo bastante mayor ", { target: "como para" }, " decidir solo."]
          tr: { en: "You are old enough to decide on your own.", uk: "Ти досить дорослий, щоб вирішувати сам.", pt: "Você já tem idade para decidir sozinho.", fr: "Tu es assez grand pour décider tout seul.", de: "Du bist alt genug, um allein zu entscheiden.", it: "Sei abbastanza grande da decidere da solo.", pl: "Jesteś wystarczająco dorosły, żeby decydować sam.", tr: "Kendi başına karar verecek yaştasın.", id: "Kamu sudah cukup dewasa untuk memutuskan sendiri.", vi: "Bạn đã đủ lớn để tự quyết định." }
        - level: C2
          point: { es: Registro literario, en: "Literary register", uk: "Літературний стиль", pt: "Registro literário", fr: "Registre littéraire", de: "Literarische Sprache", it: "Registro letterario", pl: "Styl literacki", tr: "Edebî üslup", id: "Ragam sastra", vi: "Văn phong văn chương" }
          rule: { es: [{ term: "de suerte que" }, " admite indicativo y subjuntivo"], en: [{ term: "de suerte que" }, " allows the indicative and the subjunctive"], uk: [{ term: "de suerte que" }, " допускає дійсний спосіб і суб’юнктив"], pt: [{ term: "de suerte que" }, " admite indicativo e subjuntivo"], fr: [{ term: "de suerte que" }, " admet l’indicatif et le subjonctif"], de: [{ term: "de suerte que" }, " lässt Indikativ und Konjunktiv zu"], it: [{ term: "de suerte que" }, " ammette indicativo e congiuntivo"], pl: [{ term: "de suerte que" }, " dopuszcza tryb oznajmujący i łączący"], tr: [{ term: "de suerte que" }, " hem bildirme kipini hem dilek kipini kabul eder"], id: [{ term: "de suerte que" }, " bisa memakai indikatif dan subjungtif"], vi: [{ term: "de suerte que" }, " dùng được với cả thức chỉ định và thức giả định"] }
          ex: ["Habló ", { target: "de tal suerte que" }, " nadie dudó de él."]
          tr: { en: "He spoke in such a way that nobody doubted him.", uk: "Він говорив так, що ніхто в ньому не сумнівався.", pt: "Ele falou de tal modo que ninguém duvidou dele.", fr: "Il a parlé de telle sorte que personne n’a douté de lui.", de: "Er sprach so, dass niemand an ihm zweifelte.", it: "Parlò in modo tale che nessuno dubitò di lui.", pl: "Mówił tak, że nikt w niego nie wątpił.", tr: "Öyle konuştu ki kimse ondan şüphe etmedi.", id: "Dia berbicara sedemikian rupa sehingga tak seorang pun meragukannya.", vi: "Anh ấy nói theo cách khiến không ai nghi ngờ anh ấy." }
        - level: C2
          point: { es: Coloquial, en: "Colloquial", uk: "Розмовний стиль", pt: "Coloquial", fr: "Familier", de: "Umgangssprache", it: "Colloquiale", pl: "Język potoczny", tr: "Günlük dil", id: "Bahasa lisan", vi: "Khẩu ngữ" }
          rule: { es: [{ term: ["una de ", { gap: true }, " que"] }, " intensifica un sustantivo plural"], en: [{ term: ["una de ", { gap: true }, " que"] }, " intensifies a plural noun"], uk: [{ term: ["una de ", { gap: true }, " que"] }, " підсилює іменник у множині"], pt: [{ term: ["una de ", { gap: true }, " que"] }, " intensifica um substantivo no plural"], fr: [{ term: ["una de ", { gap: true }, " que"] }, " renforce un nom au pluriel"], de: [{ term: ["una de ", { gap: true }, " que"] }, " verstärkt ein Nomen im Plural"], it: [{ term: ["una de ", { gap: true }, " que"] }, " intensifica un sostantivo plurale"], pl: [{ term: ["una de ", { gap: true }, " que"] }, " wzmacnia rzeczownik w liczbie mnogiej"], tr: [{ term: ["una de ", { gap: true }, " que"] }, " çoğul bir ismi pekiştirir"], id: [{ term: ["una de ", { gap: true }, " que"] }, " menekankan kata benda jamak"], vi: [{ term: ["una de ", { gap: true }, " que"] }, " nhấn mạnh một danh từ số nhiều"] }
          ex: ["Había ", { target: "una de coches que" }, " no se podía cruzar."]
          tr: { en: "There were so many cars that you couldn't cross.", uk: "Було стільки машин, що не можна було перейти.", pt: "Havia tantos carros que não dava para atravessar.", fr: "Il y avait tellement de voitures qu’on ne pouvait pas traverser.", de: "Es gab so viele Autos, dass man nicht über die Straße kam.", it: "C'erano tante di quelle macchine che non si poteva attraversare.", pl: "Było tyle samochodów, że nie dało się przejść.", tr: "O kadar çok araba vardı ki karşıya geçilmiyordu.", id: "Ada banyak sekali mobil sampai tidak bisa menyeberang.", vi: "Xe nhiều vô kể đến mức không sao băng qua đường được." }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: [{ term: tan }, " anuncia la consecuencia; ", { term: muy }, " solo intensifica"], en: [{ term: "tan" }, " announces the result; ", { term: "muy" }, " only intensifies"], uk: [{ term: "tan" }, " вводить наслідок; ", { term: "muy" }, " лише підсилює"], pt: [{ term: "tan" }, " anuncia a consequência; ", { term: "muy" }, " só intensifica"], fr: [{ term: "tan" }, " annonce la conséquence ; ", { term: "muy" }, " ne fait qu’intensifier"], de: [{ term: "tan" }, " kündigt die Folge an; ", { term: "muy" }, " verstärkt nur"], it: [{ term: "tan" }, " annuncia la conseguenza; ", { term: "muy" }, " intensifica soltanto"], pl: [{ term: "tan" }, " zapowiada skutek; ", { term: "muy" }, " tylko wzmacnia"], tr: [{ term: "tan" }, " sonucu haber verir; ", { term: "muy" }, " yalnızca pekiştirir"], id: [{ term: "tan" }, " mengumumkan akibat; ", { term: "muy" }, " hanya menekankan"], vi: [{ term: "tan" }, " báo trước kết quả; ", { term: "muy" }, " chỉ nhấn mạnh"] }
          ex: ["Está ", { target: tan }, " cansado que se duerme de pie."]
          tr: { en: "He is so tired that he falls asleep standing up.", uk: "Він такий втомлений, що засинає стоячи.", pt: "Ele está tão cansado que dorme em pé.", fr: "Il est si fatigué qu’il s’endort debout.", de: "Er ist so müde, dass er im Stehen einschläft.", it: "È così stanco che si addormenta in piedi.", pl: "Jest tak zmęczony, że zasypia na stojąco.", tr: "O kadar yorgun ki ayakta uyuyor.", id: "Dia begitu lelah sampai tertidur sambil berdiri.", vi: "Anh ấy mệt đến mức ngủ gật ngay khi đang đứng." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Una oración consecutiva dice el resultado de lo que se acaba de decir."
              en: "A result clause states the outcome of what was just said."
              uk: "Наслідкове речення називає результат того, що щойно сказано."
              pt: "Uma oração consecutiva diz o resultado do que acabou de ser dito."
              fr: "Une proposition consécutive dit le résultat de ce qui vient d’être dit."
              de: "Ein Konsekutivsatz nennt das Ergebnis dessen, was gerade gesagt wurde."
              it: "Una proposizione consecutiva dice il risultato di ciò che è appena stato detto."
              pl: "Zdanie skutkowe podaje wynik tego, co właśnie zostało powiedziane."
              tr: "Sonuç cümlesi, az önce söylenenin sonucunu bildirir."
              id: "Klausa akibat menyatakan hasil dari apa yang baru saja dikatakan."
              vi: "Mệnh đề kết quả nêu kết quả của điều vừa được nói."
            ex: ["Hacía frío, ", { target: "de modo que" }, " cerramos las ventanas."]
            tr: { en: "It was cold, so we closed the windows.", uk: "Було холодно, тож ми зачинили вікна.", pt: "Fazia frio, então fechamos as janelas.", fr: "Il faisait froid, si bien que nous avons fermé les fenêtres.", de: "Es war kalt, sodass wir die Fenster schlossen.", it: "Faceva freddo, quindi abbiamo chiuso le finestre.", pl: "Było zimno, więc zamknęliśmy okna.", tr: "Hava soğuktu, bu yüzden pencereleri kapattık.", id: "Cuacanya dingin, jadi kami menutup jendela.", vi: "Trời lạnh nên chúng tôi đóng cửa sổ." }
          - type: rule
            level: B2
            text:
              es: ["Un conector enlaza dos oraciones, o ", { term: tan }, " y ", { term: tanto }, " anuncian una oración con ", { term: que }, "."]
              en: ["A linker joins two sentences, or ", { term: "tan" }, " and ", { term: "tanto" }, " announce a clause with ", { term: "que" }, "."]
              uk: ["Сполучне слово з’єднує два речення, або ", { term: "tan" }, " і ", { term: "tanto" }, " вводять речення з ", { term: "que" }, "."]
              pt: ["Um conectivo liga duas orações, ou ", { term: "tan" }, " e ", { term: "tanto" }, " anunciam uma oração com ", { term: "que" }, "."]
              fr: ["Un connecteur relie deux phrases, ou bien ", { term: "tan" }, " et ", { term: "tanto" }, " annoncent une proposition en ", { term: "que" }, "."]
              de: ["Ein Bindewort verbindet zwei Sätze, oder ", { term: "tan" }, " und ", { term: "tanto" }, " kündigen einen Satz mit ", { term: "que" }, " an."]
              it: ["Un connettivo unisce due frasi, oppure ", { term: "tan" }, " e ", { term: "tanto" }, " annunciano una frase con ", { term: "que" }, "."]
              pl: ["Słowo łączące spaja dwa zdania, albo ", { term: "tan" }, " i ", { term: "tanto" }, " zapowiadają zdanie z ", { term: "que" }, "."]
              tr: ["Bir bağlayıcı iki cümleyi birleştirir ya da ", { term: "tan" }, " ve ", { term: "tanto" }, ", ", { term: "que" }, " ile kurulan bir cümleyi haber verir."]
              id: ["Kata penghubung menyambung dua kalimat, atau ", { term: "tan" }, " dan ", { term: "tanto" }, " mengumumkan klausa dengan ", { term: "que" }, "."]
              vi: ["Một từ nối nối hai câu, hoặc ", { term: "tan" }, " và ", { term: "tanto" }, " báo trước một mệnh đề với ", { term: "que" }, "."]
            ex: ["Llovía ", { target: "tanto que" }, " nos quedamos en casa."]
            tr: { en: "It rained so much that we stayed at home.", uk: "Дощ ішов так сильно, що ми лишилися вдома.", pt: "Chovia tanto que ficamos em casa.", fr: "Il pleuvait tellement que nous sommes restés à la maison.", de: "Es regnete so stark, dass wir zu Hause blieben.", it: "Pioveva così tanto che siamo rimasti a casa.", pl: "Padało tak mocno, że zostaliśmy w domu.", tr: "O kadar çok yağmur yağıyordu ki evde kaldık.", id: "Hujan turun begitu deras sampai kami tinggal di rumah.", vi: "Trời mưa nhiều đến mức chúng tôi ở nhà." }
          - type: note
            level: B2
            text:
              es: ["Los conectores de consecuencia básicos, ", { term: "por eso" }, " y ", { term: "así que" }, ": ", { link: Los conectores, to: es.oracion.conectores }, "."]
              en: ["The basic result linkers, ", { term: "por eso" }, " and ", { term: "así que" }, ": ", { link: "Linkers", to: "es.oracion.conectores" }, "."]
              uk: ["Основні сполучні слова наслідку, ", { term: "por eso" }, " і ", { term: "así que" }, ": ", { link: "Сполучні слова", to: "es.oracion.conectores" }, "."]
              pt: ["Os conectivos de consequência básicos, ", { term: "por eso" }, " e ", { term: "así que" }, ": ", { link: "Os conectivos", to: "es.oracion.conectores" }, "."]
              fr: ["Les connecteurs de conséquence de base, ", { term: "por eso" }, " et ", { term: "así que" }, " : ", { link: "Les connecteurs", to: "es.oracion.conectores" }, "."]
              de: ["Die einfachen Bindewörter der Folge, ", { term: "por eso" }, " und ", { term: "así que" }, ": ", { link: "Die Bindewörter", to: "es.oracion.conectores" }, "."]
              it: ["I connettivi di conseguenza di base, ", { term: "por eso" }, " e ", { term: "así que" }, ": ", { link: "I connettivi", to: "es.oracion.conectores" }, "."]
              pl: ["Podstawowe słowa łączące skutek, ", { term: "por eso" }, " i ", { term: "así que" }, ": ", { link: "Słowa łączące", to: "es.oracion.conectores" }, "."]
              tr: ["Temel sonuç bağlayıcıları, ", { term: "por eso" }, " ve ", { term: "así que" }, ": ", { link: "Bağlayıcılar", to: "es.oracion.conectores" }, "."]
              id: ["Kata penghubung akibat dasar, ", { term: "por eso" }, " dan ", { term: "así que" }, ": ", { link: "Kata penghubung", to: "es.oracion.conectores" }, "."]
              vi: ["Các từ nối chỉ kết quả cơ bản, ", { term: "por eso" }, " và ", { term: "así que" }, ": ", { link: "Từ nối", to: "es.oracion.conectores" }, "."]

  - title: { es: Consecuencia entre dos oraciones, en: "Result between two sentences", uk: "Наслідок між двома реченнями", pt: "Consequência entre duas orações", fr: "Conséquence entre deux phrases", de: "Folge zwischen zwei Sätzen", it: "Conseguenza tra due frasi", pl: "Skutek między dwoma zdaniami", tr: "İki cümle arasında sonuç", id: "Akibat antara dua kalimat", vi: "Kết quả giữa hai câu" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { es: Conector, en: "Linker", uk: "Сполучник", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: register, label: { es: Registro, en: "Register", uk: "Стиль", pt: "Registro", fr: "Registre", de: "Sprachebene", it: "Registro", pl: "Styl", tr: "Üslup", id: "Ragam bahasa", vi: "Phong cách" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            linker: { alternatives: [de manera que, de modo que, de forma que] }
            register: { es: neutro, en: "neutral", uk: "нейтральний", pt: "neutro", fr: "neutre", de: "neutral", it: "neutro", pl: "neutralny", tr: "nötr", id: "netral", vi: "trung tính" }
            ex: ["Perdí el tren, ", { target: "de modo que" }, " llegué tarde."]
            tr: { en: "I missed the train, so I arrived late.", uk: "Я не встиг на потяг, тож приїхав пізно.", pt: "Perdi o trem, então cheguei tarde.", fr: "J’ai raté le train, si bien que je suis arrivé en retard.", de: "Ich habe den Zug verpasst, sodass ich zu spät kam.", it: "Ho perso il treno, quindi sono arrivato tardi.", pl: "Nie zdążyłem na pociąg, więc przyjechałem późno.", tr: "Treni kaçırdım, bu yüzden geç kaldım.", id: "Saya ketinggalan kereta, sehingga saya datang terlambat.", vi: "Tôi lỡ chuyến tàu nên đến muộn." }
          - level: B2
            linker: { alternatives: [con lo que, por lo que] }
            register: { es: neutro, en: "neutral", uk: "нейтральний", pt: "neutro", fr: "neutre", de: "neutral", it: "neutro", pl: "neutralny", tr: "nötr", id: "netral", vi: "trung tính" }
            ex: ["Había demasiada gente, ", { target: "por lo que" }, " decidimos no entrar."]
            tr: { en: "There were too many people, so we decided not to go in.", uk: "Було забагато людей, тому ми вирішили не заходити.", pt: "Havia gente demais, por isso decidimos não entrar.", fr: "Il y avait trop de monde, c’est pourquoi nous avons décidé de ne pas entrer.", de: "Es waren zu viele Leute da, deshalb beschlossen wir, nicht hineinzugehen.", it: "C'era troppa gente, perciò abbiamo deciso di non entrare.", pl: "Było za dużo ludzi, więc postanowiliśmy nie wchodzić.", tr: "Çok kalabalıktı, bu yüzden içeri girmemeye karar verdik.", id: "Orangnya terlalu banyak, jadi kami memutuskan tidak masuk.", vi: "Có quá đông người, nên chúng tôi quyết định không vào." }
          - level: B2
            linker: ["por ", { optional: lo }, " tanto"]
            register: { es: neutro, en: "neutral", uk: "нейтральний", pt: "neutro", fr: "neutre", de: "neutral", it: "neutro", pl: "neutralny", tr: "nötr", id: "netral", vi: "trung tính" }
            ex: ["Los vuelos están llenos. ", { target: "Por lo tanto" }, ", iremos en tren."]
            tr: { en: "The flights are full. Therefore, we'll go by train.", uk: "Усі рейси заповнені. Тому ми поїдемо потягом.", pt: "Os voos estão lotados. Portanto, iremos de trem.", fr: "Les vols sont complets. Par conséquent, nous irons en train.", de: "Die Flüge sind ausgebucht. Deshalb fahren wir mit dem Zug.", it: "I voli sono pieni. Quindi andremo in treno.", pl: "Loty są zapełnione. Dlatego pojedziemy pociągiem.", tr: "Uçuşlar dolu. Bu nedenle trenle gideceğiz.", id: "Penerbangannya penuh. Karena itu, kami akan naik kereta.", vi: "Các chuyến bay đã hết chỗ. Vì vậy, chúng tôi sẽ đi bằng tàu." }
          - level: B2
            linker: { alternatives: [en consecuencia, por consiguiente] }
            register: { es: formal, en: "formal", uk: "офіційний", pt: "formal", fr: "formel", de: "formell", it: "formale", pl: "oficjalny", tr: "resmî", id: "formal", vi: "trang trọng" }
            ex: ["No hubo acuerdo. ", { target: "Por consiguiente" }, ", se aplazó la votación."]
