          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, linker: cuando, use: { en: "with the present, what usually happens", es: "con presente, lo que suele pasar", uk: "з теперішнім часом — те, що зазвичай стається", pt: "com presente, o que costuma acontecer", fr: "avec le présent, ce qui arrive d’habitude", de: "mit Präsens, was meistens passiert", it: "con il presente, ciò che di solito succede", pl: "z czasem teraźniejszym, to, co zwykle się dzieje", tr: "şimdiki zamanla, genellikle olanlar", id: "dengan present, yang biasanya terjadi", vi: "đi với thì hiện tại, điều thường xảy ra" }, ex: [{ target: Cuando }, " llueve, me quedo en casa."], tr: { en: "When it rains, I stay at home.", uk: "Коли йде дощ, я сиджу вдома.", pt: "Quando chove, fico em casa.", fr: "Quand il pleut, je reste à la maison.", de: "Wenn es regnet, bleibe ich zu Hause.", it: "Quando piove, resto a casa.", pl: "Kiedy pada, zostaję w domu.", tr: "Yağmur yağdığında evde kalırım.", id: "Ketika hujan, saya tinggal di rumah.", vi: "Khi trời mưa, tôi ở nhà." } }
          - { level: A2, linker: { pattern: [antes de, { slot: infinitive }] }, use: { en: the earlier action, es: la acción anterior, uk: "попередня дія", pt: "a ação anterior", fr: "l’action antérieure", de: "die frühere Handlung", it: "l'azione precedente", pl: "wcześniejsza czynność", tr: "önce olan eylem", id: "tindakan yang lebih dulu", vi: "hành động xảy ra trước" }, ex: ["Me lavo los dientes ", { target: antes de acostarme }, "."], tr: { en: "I brush my teeth before going to bed.", uk: "Я чищу зуби перед тим, як лягти спати.", pt: "Escovo os dentes antes de me deitar.", fr: "Je me brosse les dents avant de me coucher.", de: "Ich putze mir die Zähne, bevor ich ins Bett gehe.", it: "Mi lavo i denti prima di andare a letto.", pl: "Myję zęby przed pójściem spać.", tr: "Yatmadan önce dişlerimi fırçalarım.", id: "Saya menyikat gigi sebelum tidur.", vi: "Tôi đánh răng trước khi đi ngủ." } }
          - { level: A2, linker: { pattern: [después de, { slot: infinitive }] }, use: { en: the later action, es: la acción posterior, uk: "наступна дія", pt: "a ação posterior", fr: "l’action postérieure", de: "die spätere Handlung", it: "l'azione successiva", pl: "późniejsza czynność", tr: "sonra olan eylem", id: "tindakan yang lebih akhir", vi: "hành động xảy ra sau" }, ex: ["A veces doy un paseo ", { target: después de cenar }, "."], tr: { en: "Sometimes I go for a walk after dinner.", uk: "Іноді я гуляю після вечері.", pt: "Às vezes dou um passeio depois de jantar.", fr: "Parfois, je fais une promenade après dîner.", de: "Manchmal gehe ich nach dem Abendessen spazieren.", it: "A volte faccio una passeggiata dopo cena.", pl: "Czasem spaceruję po kolacji.", tr: "Bazen akşam yemeğinden sonra yürüyüşe çıkarım.", id: "Kadang-kadang saya berjalan-jalan setelah makan malam.", vi: "Thỉnh thoảng tôi đi dạo sau bữa tối." } }
          - level: A2
            linker: { alternatives: [primero, luego, después] }
            use: { en: "the order of actions: first, then, after that", es: "el orden de las acciones: lo primero, lo siguiente, lo último", uk: "порядок дій: спочатку, потім, після цього", pt: "a ordem das ações: o primeiro, o seguinte, o último", fr: "l’ordre des actions : d’abord, ensuite, enfin", de: "die Reihenfolge der Handlungen: zuerst, dann, zuletzt", it: "l'ordine delle azioni: prima, poi, infine", pl: "kolejność czynności: najpierw, potem, na końcu", tr: "eylemlerin sırası: ilk, sonraki, son", id: "urutan tindakan: pertama, berikutnya, terakhir", vi: "thứ tự các hành động: đầu tiên, tiếp theo, cuối cùng" }
            ex: [{ target: Primero }, " desayuno, ", { target: luego }, " me ducho y ", { target: después }, " salgo."]
            tr: { en: "First I have breakfast, then I have a shower and after that I go out.", uk: "Спочатку я снідаю, потім приймаю душ, а після цього виходжу.", pt: "Primeiro tomo café da manhã, depois tomo banho e em seguida saio.", fr: "D’abord je prends mon petit-déjeuner, ensuite je me douche et après je sors.", de: "Zuerst frühstücke ich, dann dusche ich und danach gehe ich aus dem Haus.", it: "Prima faccio colazione, poi mi faccio la doccia e dopo esco.", pl: "Najpierw jem śniadanie, potem biorę prysznic, a potem wychodzę.", tr: "Önce kahvaltı ederim, sonra duş alırım, ondan sonra çıkarım.", id: "Pertama saya sarapan, lalu mandi, dan setelah itu saya keluar.", vi: "Trước tiên tôi ăn sáng, sau đó tôi tắm và rồi tôi ra ngoài." }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: antes de }, " and ", { term: después de }, " take the infinitive when both actions have the same subject."]
              es: [{ term: antes de }, " y ", { term: después de }, " llevan infinitivo cuando las dos acciones tienen el mismo sujeto."]
              uk: [{ term: "antes de" }, " і ", { term: "después de" }, " вживаються з інфінітивом, коли в обох дій той самий підмет."]
              pt: [{ term: "antes de" }, " e ", { term: "después de" }, " levam infinitivo quando as duas ações têm o mesmo sujeito."]
              fr: [{ term: "antes de" }, " et ", { term: "después de" }, " prennent l’infinitif quand les deux actions ont le même sujet."]
              de: [{ term: "antes de" }, " und ", { term: "después de" }, " stehen mit dem Infinitiv, wenn beide Handlungen dasselbe Subjekt haben."]
              it: [{ term: "antes de" }, " e ", { term: "después de" }, " vogliono l'infinito quando le due azioni hanno lo stesso soggetto."]
              pl: [{ term: "antes de" }, " i ", { term: "después de" }, " łączą się z bezokolicznikiem, gdy obie czynności mają ten sam podmiot."]
              tr: [{ term: "antes de" }, " ve ", { term: "después de" }, ", iki eylemin öznesi aynıysa mastarla kullanılır."]
              id: [{ term: "antes de" }, " dan ", { term: "después de" }, " memakai infinitif kalau kedua tindakan punya subjek yang sama."]
              vi: [{ term: "antes de" }, " và ", { term: "después de" }, " đi với động từ nguyên mẫu khi hai hành động có cùng chủ ngữ."]
          - type: note
            level: B1
            text:
              en: [{ term: cuando }, " about the future takes the subjunctive: ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: [{ term: cuando }, " referido al futuro lleva subjuntivo: ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              uk: [{ term: "cuando" }, " про майбутнє вимагає суб’юнктива: ", { link: "Суб’юнктив після cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              pt: [{ term: "cuando" }, " referido ao futuro leva subjuntivo: ", { link: "O subjuntivo com cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              fr: [{ term: "cuando" }, " à propos du futur prend le subjonctif : ", { link: "Le subjonctif avec cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              de: [{ term: "cuando" }, " mit Zukunftsbezug verlangt den Konjunktiv: ", { link: "Der Konjunktiv nach cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              it: [{ term: "cuando" }, " riferito al futuro vuole il congiuntivo: ", { link: "Il congiuntivo con cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              pl: [{ term: "cuando" }, " odnoszące się do przyszłości wymaga trybu łączącego: ", { link: "Tryb łączący z cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              tr: [{ term: "cuando" }, " gelecekten söz ediyorsa dilek kipi ister: ", { link: "cuando, para que, antes de que ile dilek kipi", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              id: [{ term: "cuando" }, " untuk masa depan memakai subjungtif: ", { link: "Subjungtif dengan cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]
              vi: [{ term: "cuando" }, " nói về tương lai đi với thức giả định: ", { link: "Thức giả định với cuando, para que, antes de que", to: "es.subjuntivo.subjuntivo-cuando-para-que" }, "."]

  - title: { es: "Coordinación: sino, ni… ni, no obstante" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { es: Conector } }
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            linker: sino
            use: { es: "tras una negación, corrige con una palabra o un grupo" }
            ex: { examples: [["No quiero té, ", { target: sino }, " café."], ["No es antipático, ", { target: sino }, " tímido."]] }
          - level: B2
            linker: sino que
            use: { es: "tras una negación, corrige con una oración de verbo conjugado" }
            ex: ["No me llamó, ", { target: sino que }, " me escribió."]
          - level: B2
            linker: no obstante
            use: { es: ["contrasta como ", { term: sin embargo }, ", en un registro formal"] }
            ex: ["Es un buen plan; ", { target: no obstante }, ", es caro."]
          - level: B2
            linker: ["ni ", { gap: true }, " ni"]
            use: { es: ["niega dos hechos; delante del verbo va sin ", { term: no }] }
            ex: [{ target: Ni }, " me escribió ", { target: ni }, " me llamó."]
          - level: C1
            linker: asíndeton
            use: { es: "sin conector: el ritmo une las oraciones" }
            ex: { target: "Entré, saludé, me senté." }
          - level: C1
            linker: polisíndeton
            use: { es: "con el mismo conector repetido: insistencia o lentitud" }
            ex: ["Cantó ", { target: y }, " bailó ", { target: y }, " lloró toda la noche."]
          - level: C2
            linker: mas
            use: { es: ["adversativo literario, como ", { term: pero }, "; sin tilde"] }
            ex: ["Quise ayudar, ", { target: mas }, " no pude."]
          - level: C2
            linker: ["ahora ", { gap: true }, " ahora"]
            use: { es: "distributivo: alterna dos estados" }
            ex: [{ target: Ahora }, " ríe, ", { target: ahora }, " llora."]
          - level: C2
            linker: ["ya ", { gap: true }, " ya"]
            use: { es: "distributivo: alterna dos acciones" }
            ex: [{ target: Ya }, " canta, ", { target: ya }, " baila."]

  - title: { es: Adverbios que enlazan }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverb, label: { es: Adverbio } }
          - { key: sense, label: { es: Valor } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            adverb: así
            sense: { es: "añade una consecuencia: de este modo" }
            ex: ["Llámame antes, ", { target: así }, " llegamos juntos."]
          - level: B2
            adverb: { alternatives: [precisamente, justamente] }
            sense: { es: "confirman lo dicho y siguen con ello" }
            ex: { examples: [[{ target: Precisamente }, " iba a llamarte."], [{ target: Justamente }, " hablábamos de ti."]] }
          - level: B2
            adverb: a propósito
            sense: { es: "abre un paréntesis: un tema nuevo que viene a cuento" }
            ex: [{ target: A propósito }, ", ¿vienes mañana?"]
          - level: C1
            adverb: { alternatives: [solo que, únicamente que] }
            sense: { es: "añaden una pega que restringe lo dicho" }
            ex: { examples: [["Me gusta la casa, ", { target: solo que }, " es muy cara."], ["Es simpático, ", { target: únicamente que }, " habla demasiado."]] }
          - level: C1
            adverb: { pattern: [contrariamente a lo que, { slot: clause }] }
            sense: { es: "opone un hecho a lo que se creía" }
            ex: [{ target: Contrariamente a lo que dicen }, ", aquí llueve poco."]
          - level: C1
            adverb: { alternatives: [también, tampoco] }
            sense: { es: "en una comparación, el segundo término iguala al primero" }
            ex: { examples: [["Si tu padre habla tres idiomas, tu madre ", { target: también }, "."], ["Si Ana canta bien, Rosa ", { target: tampoco }, " se queda atrás."]] }
          - level: C1
            adverb: ahora
            sense: { es: "abre un tema nuevo" }
            ex: [{ target: Ahora }, ", hablemos del precio."]
          - level: C1
            adverb: ahora bien
            sense: { es: "matiza lo que se acaba de afirmar" }
            ex: ["Es un buen plan. ", { target: Ahora bien }, ", no es barato."]
          - level: C2
            adverb: { alternatives: [puramente, meramente, exclusivamente] }
            sense: { es: "limitan el hecho a una sola razón" }
            ex: { examples: [["Lo hice ", { target: puramente }, " por curiosidad."], ["Lo dijo ", { target: meramente }, " por cortesía."]] }

