            en: [{ alternatives: [{ term: primero }, { term: luego }, { term: después }] }, " put actions in order"]
            es: [{ alternatives: [{ term: primero }, { term: luego }, { term: después }] }, " ordenan las acciones"]
            uk: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " упорядковують дії"]
            pt: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " ordenam as ações"]
            fr: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " ordonnent les actions"]
            de: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " ordnen die Handlungen"]
            it: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " mettono in ordine le azioni"]
            pl: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " porządkują czynności"]
            tr: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " eylemleri sıraya koyar"]
            id: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " mengurutkan tindakan"]
            vi: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " sắp xếp thứ tự các hành động"]
          ex: [{ target: Primero }, " desayuno, ", { target: luego }, " me ducho y ", { target: después }, " salgo."]
          tr: { en: "First I have breakfast, then I have a shower and after that I go out.", uk: "Спочатку я снідаю, потім приймаю душ, а після цього виходжу.", pt: "Primeiro tomo café da manhã, depois tomo banho e em seguida saio.", fr: "D’abord je prends mon petit-déjeuner, ensuite je me douche et après je sors.", de: "Zuerst frühstücke ich, dann dusche ich und danach gehe ich aus dem Haus.", it: "Prima faccio colazione, poi mi faccio la doccia e dopo esco.", pl: "Najpierw jem śniadanie, potem biorę prysznic, a potem wychodzę.", tr: "Önce kahvaltı ederim, sonra duş alırım, ondan sonra çıkarım.", id: "Pertama saya sarapan, lalu mandi, dan setelah itu saya keluar.", vi: "Trước tiên tôi ăn sáng, sau đó tôi tắm và rồi tôi ra ngoài." }
        - level: B1
          point: { en: Reason first, es: Causa primero, uk: "Спершу причина", pt: "Primeiro a causa", fr: "La cause en premier", de: "Grund zuerst", it: "Prima la causa", pl: "Najpierw przyczyna", tr: "Önce neden", id: "Alasan lebih dulu", vi: "Nguyên nhân trước" }
          rule:
            en: [{ term: como }, " gives the reason before the main clause"]
            es: [{ term: como }, " da la causa delante de la oración principal"]
            uk: [{ term: "como" }, " вводить причину перед головним реченням"]
            pt: [{ term: "como" }, " dá a causa antes da oração principal"]
            fr: [{ term: "como" }, " donne la cause avant la proposition principale"]
            de: [{ term: "como" }, " nennt den Grund vor dem Hauptsatz"]
            it: [{ term: "como" }, " indica la causa prima della frase principale"]
            pl: [{ term: "como" }, " podaje przyczynę przed zdaniem głównym"]
            tr: [{ term: "como" }, " nedeni ana cümlenin önünde bildirir"]
            id: [{ term: "como" }, " memberi alasan sebelum klausa utama"]
            vi: [{ term: "como" }, " nêu nguyên nhân trước mệnh đề chính"]
          ex: [{ target: Como }, " no venías, empecé a cenar."]
          tr: { en: "As you weren't coming, I started dinner.", uk: "Оскільки ти не приходив, я почав вечеряти.", pt: "Como você não vinha, comecei a jantar.", fr: "Comme tu ne venais pas, j’ai commencé à dîner.", de: "Da du nicht kamst, habe ich mit dem Abendessen angefangen.", it: "Siccome non venivi, ho cominciato a cenare.", pl: "Skoro nie przychodziłeś, zacząłem jeść kolację.", tr: "Gelmediğin için akşam yemeğine başladım.", id: "Karena kamu tidak datang, saya mulai makan malam.", vi: "Vì bạn không đến, tôi bắt đầu ăn tối." }
        - level: B1
          point: { en: Contrast, es: Contraste, uk: "Протиставлення", pt: "Contraste", fr: "Opposition", de: "Gegensatz", it: "Contrasto", pl: "Przeciwstawienie", tr: "Karşıtlık", id: "Pertentangan", vi: "Đối lập" }
          rule:
            en: [{ alternatives: [{ term: aunque }, { term: sin embargo }] }, ": a fact that goes against the other"]
            es: [{ alternatives: [{ term: aunque }, { term: sin embargo }] }, ": un hecho que va en contra del otro"]
            uk: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": факт, що суперечить іншому"]
            pt: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": um fato que contraria o outro"]
            fr: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, " : un fait qui va à l’encontre de l’autre"]
            de: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": eine Tatsache, die der anderen entgegensteht"]
            it: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": un fatto che va contro l'altro"]
            pl: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": fakt, który przeczy drugiemu"]
            tr: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": diğerine ters düşen bir olgu"]
            id: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": satu fakta yang berlawanan dengan yang lain"]
            vi: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": một sự việc đi ngược với sự việc kia"]
          ex: ["Lo entiendo todo, ", { target: aunque }, " no hablo bien."]
          tr: { en: "I understand everything, although I don't speak well.", uk: "Я все розумію, хоча говорю погано.", pt: "Entendo tudo, embora não fale bem.", fr: "Je comprends tout, bien que je ne parle pas bien.", de: "Ich verstehe alles, obwohl ich nicht gut spreche.", it: "Capisco tutto, anche se non parlo bene.", pl: "Wszystko rozumiem, chociaż nie mówię dobrze.", tr: "Her şeyi anlıyorum, iyi konuşmasam da.", id: "Saya mengerti semuanya, meskipun saya tidak bicara dengan baik.", vi: "Tôi hiểu hết, mặc dù tôi nói không giỏi." }
        - level: B1
          point: { en: Result, es: Consecuencia, uk: "Наслідок", pt: "Consequência", fr: "Conséquence", de: "Folge", it: "Conseguenza", pl: "Skutek", tr: "Sonuç", id: "Akibat", vi: "Kết quả" }
          rule:
            en: [{ term: así que }, " joins the result to the cause"]
            es: [{ term: así que }, " une la consecuencia a la causa"]
            uk: [{ term: "así que" }, " приєднує наслідок до причини"]
            pt: [{ term: "así que" }, " liga a consequência à causa"]
            fr: [{ term: "así que" }, " rattache la conséquence à la cause"]
            de: [{ term: "así que" }, " verbindet die Folge mit dem Grund"]
            it: [{ term: "así que" }, " collega la conseguenza alla causa"]
            pl: [{ term: "así que" }, " łączy skutek z przyczyną"]
            tr: [{ term: "así que" }, " sonucu nedene bağlar"]
            id: [{ term: "así que" }, " menghubungkan akibat dengan sebabnya"]
            vi: [{ term: "así que" }, " nối kết quả với nguyên nhân"]
          ex: ["No había entradas, ", { target: así que }, " no la vimos."]
          tr: { en: "There were no tickets left, so we didn't see it.", uk: "Квитків не було, тож ми його не подивилися.", pt: "Não havia ingressos, então não assistimos.", fr: "Il n’y avait plus de billets, alors nous ne l’avons pas vu.", de: "Es gab keine Karten mehr, also haben wir es nicht gesehen.", it: "Non c'erano più biglietti, quindi non l'abbiamo visto.", pl: "Nie było biletów, więc tego nie obejrzeliśmy.", tr: "Bilet kalmamıştı, bu yüzden izleyemedik.", id: "Tiketnya sudah habis, jadi kami tidak menontonnya.", vi: "Hết vé rồi, nên chúng tôi không xem được." }
        - level: B2
          point: { es: Corrección }
          rule: { es: [{ term: sino }, " corrige lo que una negación ha negado"] }
          ex: ["No quiero té, ", { target: sino }, " café."]
        - level: B2
          point: { es: Dos negaciones }
          rule: { es: [{ term: ["ni ", { gap: true }, " ni"] }, " delante del verbo va sin ", { term: no }] }
          ex: [{ target: Ni }, " me escribió ", { target: ni }, " me llamó."]
        - level: C1
          point: { es: Matiz }
          rule: { es: [{ term: ahora bien }, " matiza lo que se acaba de afirmar"] }
          ex: ["Es un buen plan. ", { target: Ahora bien }, ", no es barato."]
        - level: C2
          point: { es: Registro literario }
          rule: { es: [{ term: mas }, " equivale a ", { term: pero }, " y no lleva tilde"] }
          ex: ["Quise ayudar, ", { target: mas }, " no pude."]

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A linker joins two words or two clauses and shows how they relate: adding, choice, contrast, reason, result or time."
              es: "Un conector une dos palabras o dos oraciones y muestra su relación: suma, elección, contraste, causa, consecuencia o tiempo."
              uk: "Сполучник поєднує два слова або два речення і показує зв’язок між ними: додавання, вибір, протиставлення, причину, наслідок чи час."
              pt: "Um conectivo une duas palavras ou duas orações e mostra a relação entre elas: soma, escolha, contraste, causa, consequência ou tempo."
              fr: "Un connecteur relie deux mots ou deux propositions et montre leur relation : addition, choix, opposition, cause, conséquence ou temps."
              de: "Ein Bindewort verbindet zwei Wörter oder zwei Sätze und zeigt ihr Verhältnis: Hinzufügung, Wahl, Gegensatz, Grund, Folge oder Zeit."
              it: "Un connettivo unisce due parole o due frasi e mostra il loro rapporto: aggiunta, scelta, contrasto, causa, conseguenza o tempo."
              pl: "Słowo łączące spaja dwa wyrazy lub dwa zdania i pokazuje ich relację: dodawanie, wybór, przeciwstawienie, przyczynę, skutek lub czas."
              tr: "Bağlayıcı iki sözcüğü ya da iki cümleyi bağlar ve aralarındaki ilişkiyi gösterir: ekleme, seçim, karşıtlık, neden, sonuç ya da zaman."
              id: "Kata penghubung menyambung dua kata atau dua klausa dan menunjukkan hubungan keduanya: penambahan, pilihan, pertentangan, alasan, akibat, atau waktu."
              vi: "Từ nối nối hai từ hoặc hai mệnh đề và cho thấy mối quan hệ giữa chúng: thêm vào, lựa chọn, đối lập, nguyên nhân, kết quả hoặc thời gian."
          - type: rule
            level: A1
            text:
              en: ["A comma goes before ", { term: pero }, ", never before ", { term: y }, " in a simple list:"]
              es: ["Delante de ", { term: pero }, " va coma, y nunca delante de ", { term: y }, " en una enumeración simple:"]
              uk: ["Перед ", { term: "pero" }, " ставлять кому, а перед ", { term: "y" }, " у простому переліку — ніколи:"]
              pt: ["Antes de ", { term: "pero" }, " vai vírgula, e nunca antes de ", { term: "y" }, " numa enumeração simples:"]
              fr: ["Une virgule précède ", { term: "pero" }, ", mais jamais ", { term: "y" }, " dans une énumération simple :"]
              de: ["Vor ", { term: "pero" }, " steht ein Komma, vor ", { term: "y" }, " in einer einfachen Aufzählung nie:"]
              it: ["Prima di ", { term: "pero" }, " si mette la virgola, mai prima di ", { term: "y" }, " in un semplice elenco:"]
              pl: ["Przed ", { term: "pero" }, " stawia się przecinek, a przed ", { term: "y" }, " w prostym wyliczeniu nigdy:"]
              tr: [{ term: "pero" }, " öncesinde virgül konur; basit bir sıralamada ", { term: "y" }, " öncesinde asla konmaz:"]
              id: ["Sebelum ", { term: "pero" }, " ada koma, dan tidak pernah sebelum ", { term: "y" }, " dalam daftar sederhana:"]
              vi: ["Trước ", { term: "pero" }, " có dấu phẩy, còn trước ", { term: "y" }, " trong một danh sách đơn giản thì không bao giờ có:"]
            ex: ["Tengo un hermano ", { target: y }, " una hermana, ", { target: pero }, " no tengo primos."]
            tr: { en: "I've got a brother and a sister, but I haven't got any cousins.", uk: "У мене є брат і сестра, але немає двоюрідних братів і сестер.", pt: "Tenho um irmão e uma irmã, mas não tenho primos.", fr: "J’ai un frère et une sœur, mais je n’ai pas de cousins.", de: "Ich habe einen Bruder und eine Schwester, aber keine Cousins und Cousinen.", it: "Ho un fratello e una sorella, ma non ho cugini.", pl: "Mam brata i siostrę, ale nie mam kuzynów.", tr: "Bir erkek kardeşim ve bir kız kardeşim var ama kuzenim yok.", id: "Saya punya seorang saudara laki-laki dan seorang saudara perempuan, tetapi saya tidak punya sepupu.", vi: "Tôi có một anh trai và một chị gái, nhưng tôi không có anh chị em họ." }

  - title: { en: "Use: adding and choosing", es: "Uso: suma y elección", uk: "Вживання: додавання і вибір", pt: "Uso: soma e escolha", fr: "Emploi : addition et choix", de: "Gebrauch: Hinzufügen und Auswählen", it: "Uso: aggiunta e scelta", pl: "Użycie: dodawanie i wybór", tr: "Kullanım: ekleme ve seçim", id: "Penggunaan: penambahan dan pilihan", vi: "Cách dùng: thêm vào và lựa chọn" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: "Сполучник", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, linker: y, use: { en: adding, es: suma, uk: "додавання", pt: "soma", fr: "addition", de: "Hinzufügen", it: "aggiunta", pl: "dodawanie", tr: "ekleme", id: "penambahan", vi: "thêm vào" }, ex: ["Soy americana ", { target: y }, " vivo en Los Ángeles."], tr: { en: "I'm American and I live in Los Angeles.", uk: "Я американка і живу в Лос-Анджелесі.", pt: "Sou americana e moro em Los Angeles.", fr: "Je suis américaine et j’habite à Los Angeles.", de: "Ich bin Amerikanerin und wohne in Los Angeles.", it: "Sono americana e vivo a Los Angeles.", pl: "Jestem Amerykanką i mieszkam w Los Angeles.", tr: "Amerikalıyım ve Los Angeles’ta yaşıyorum.", id: "Saya orang Amerika dan tinggal di Los Angeles.", vi: "Tôi là người Mỹ và sống ở Los Angeles." } }
          - { level: A1, linker: o, use: { en: a choice, es: una elección, uk: "вибір", pt: "uma escolha", fr: "un choix", de: "eine Wahl", it: "una scelta", pl: "wybór", tr: "bir seçim", id: "pilihan", vi: "một lựa chọn" }, ex: ["¿Eres americano ", { target: o }, " inglés?"], tr: { en: "Are you American or English?", uk: "Ти американець чи англієць?", pt: "Você é americano ou inglês?", fr: "Tu es américain ou anglais ?", de: "Bist du Amerikaner oder Engländer?", it: "Sei americano o inglese?", pl: "Jesteś Amerykaninem czy Anglikiem?", tr: "Amerikalı mısın, İngiliz mi?", id: "Kamu orang Amerika atau Inggris?", vi: "Bạn là người Mỹ hay người Anh?" } }
          - { level: A1, linker: ni, use: { en: adding after a negative, es: suma tras una negación, uk: "додавання після заперечення", pt: "soma depois de uma negação", fr: "addition après une négation", de: "Hinzufügen nach einer Verneinung", it: "aggiunta dopo una negazione", pl: "dodawanie po przeczeniu", tr: "olumsuzluktan sonra ekleme", id: "penambahan setelah negasi", vi: "thêm vào sau phủ định" }, ex: ["No me gusta el otoño ", { target: ni }, " el invierno."], tr: { en: "I don't like autumn or winter.", uk: "Я не люблю ні осені, ні зими.", pt: "Não gosto do outono nem do inverno.", fr: "Je n’aime ni l’automne ni l’hiver.", de: "Ich mag weder den Herbst noch den Winter.", it: "Non mi piace né l'autunno né l'inverno.", pl: "Nie lubię ani jesieni, ani zimy.", tr: "Sonbaharı da kışı da sevmem.", id: "Saya tidak suka musim gugur maupun musim dingin.", vi: "Tôi không thích mùa thu cũng không thích mùa đông." } }
          - { level: A2, linker: e, use: { en: "y before i, hi", es: "y delante de i, hi", uk: "y перед i, hi", pt: "y antes de i, hi", fr: "y devant i, hi", de: "y vor i, hi", it: "y davanti a i, hi", pl: "y przed i, hi", tr: "i, hi öncesinde y", id: "y sebelum i, hi", vi: "y trước i, hi" }, ex: ["Quiero verte ", { target: e }, " ir a tu casa."], tr: { en: "I want to see you and go to your house.", uk: "Я хочу тебе побачити і прийти до тебе додому.", pt: "Quero te ver e ir à sua casa.", fr: "Je veux te voir et aller chez toi.", de: "Ich möchte dich sehen und zu dir nach Hause gehen.", it: "Voglio vederti e andare a casa tua.", pl: "Chcę cię zobaczyć i pójść do ciebie do domu.", tr: "Seni görmek ve evine gelmek istiyorum.", id: "Saya ingin bertemu denganmu dan pergi ke rumahmu.", vi: "Tôi muốn gặp bạn và đến nhà bạn." } }
          - { level: A2, linker: u, use: { en: "o before o, ho", es: "o delante de o, ho", uk: "o перед o, ho", pt: "o antes de o, ho", fr: "o devant o, ho", de: "o vor o, ho", it: "o davanti a o, ho", pl: "o przed o, ho", tr: "o, ho öncesinde o", id: "o sebelum o, ho", vi: "o trước o, ho" }, ex: ["Compra siete ", { target: u }, " ocho botellas de leche."], tr: { en: "Buy seven or eight bottles of milk.", uk: "Купи сім або вісім пляшок молока.", pt: "Compre sete ou oito garrafas de leite.", fr: "Achète sept ou huit bouteilles de lait.", de: "Kauf sieben oder acht Flaschen Milch.", it: "Compra sette o otto bottiglie di latte.", pl: "Kup siedem lub osiem butelek mleka.", tr: "Yedi ya da sekiz şişe süt al.", id: "Belilah tujuh atau delapan botol susu.", vi: "Hãy mua bảy hoặc tám chai sữa." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: y }, " becomes ", { term: e }, " before a word that starts with the sound ", { letter: i }, ": ", { alternatives: [{ term: padre e hijo }, { term: inglés e italiano }] }, "."]
              es: [{ term: y }, " pasa a ", { term: e }, " delante de una palabra que empieza por el sonido ", { letter: i }, ": ", { alternatives: [{ term: padre e hijo }, { term: inglés e italiano }] }, "."]
              uk: [{ term: "y" }, " стає ", { term: "e" }, " перед словом, що починається зі звука ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              pt: [{ term: "y" }, " passa a ", { term: "e" }, " antes de uma palavra que começa com o som ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              fr: [{ term: "y" }, " devient ", { term: "e" }, " devant un mot qui commence par le son ", { letter: "i" }, " : ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              de: [{ term: "y" }, " wird zu ", { term: "e" }, " vor einem Wort, das mit dem Laut ", { letter: "i" }, " beginnt: ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              it: [{ term: "y" }, " diventa ", { term: "e" }, " davanti a una parola che comincia con il suono ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              pl: [{ term: "y" }, " zmienia się w ", { term: "e" }, " przed wyrazem zaczynającym się od dźwięku ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              tr: [{ term: "y" }, ", ", { letter: "i" }, " sesiyle başlayan bir sözcüğün önünde ", { term: "e" }, " olur: ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              id: [{ term: "y" }, " menjadi ", { term: "e" }, " sebelum kata yang diawali bunyi ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
              vi: [{ term: "y" }, " đổi thành ", { term: "e" }, " trước từ bắt đầu bằng âm ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
          - type: rule
            level: A2
            text:
