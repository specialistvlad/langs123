title: { en: Linkers, es: Los conectores, uk: "Сполучні слова", pt: "Os conectivos", fr: "Les connecteurs", de: "Die Bindewörter", it: "I connettivi", pl: "Słowa łączące", tr: "Bağlayıcılar", id: "Kata penghubung", vi: "Từ nối" }
summary:
  lead:
    en: ["Linkers join ideas: ", { term: y }, " adds, ", { term: o }, " offers a choice, ", { term: pero }, " contrasts, ", { term: porque }, " gives a reason and ", { term: por eso }, " a result."]
    es: ["Los conectores unen ideas: ", { term: y }, " suma, ", { term: o }, " ofrece una elección, ", { term: pero }, " contrasta, ", { term: porque }, " da una causa y ", { term: por eso }, ", una consecuencia."]
    uk: ["Сполучні слова поєднують думки: ", { term: "y" }, " додає, ", { term: "o" }, " пропонує вибір, ", { term: "pero" }, " протиставляє, ", { term: "porque" }, " вводить причину, а ", { term: "por eso" }, " — наслідок."]
    pt: ["Os conectivos unem ideias: ", { term: "y" }, " soma, ", { term: "o" }, " oferece uma escolha, ", { term: "pero" }, " contrasta, ", { term: "porque" }, " dá uma causa e ", { term: "por eso" }, ", uma consequência."]
    fr: ["Les connecteurs relient des idées : ", { term: "y" }, " ajoute, ", { term: "o" }, " propose un choix, ", { term: "pero" }, " oppose, ", { term: "porque" }, " donne une cause et ", { term: "por eso" }, " une conséquence."]
    de: ["Bindewörter verbinden Gedanken: ", { term: "y" }, " fügt hinzu, ", { term: "o" }, " bietet eine Wahl, ", { term: "pero" }, " setzt einen Gegensatz, ", { term: "porque" }, " nennt einen Grund und ", { term: "por eso" }, " eine Folge."]
    it: ["I connettivi uniscono le idee: ", { term: "y" }, " aggiunge, ", { term: "o" }, " offre una scelta, ", { term: "pero" }, " contrappone, ", { term: "porque" }, " indica la causa e ", { term: "por eso" }, " la conseguenza."]
    pl: ["Słowa łączące spajają myśli: ", { term: "y" }, " dodaje, ", { term: "o" }, " daje wybór, ", { term: "pero" }, " przeciwstawia, ", { term: "porque" }, " podaje przyczynę, a ", { term: "por eso" }, " skutek."]
    tr: ["Bağlayıcılar fikirleri birbirine bağlar: ", { term: "y" }, " ekler, ", { term: "o" }, " seçenek sunar, ", { term: "pero" }, " karşıtlık kurar, ", { term: "porque" }, " neden, ", { term: "por eso" }, " ise sonuç bildirir."]
    id: ["Kata penghubung menyambung gagasan: ", { term: "y" }, " menambah, ", { term: "o" }, " menawarkan pilihan, ", { term: "pero" }, " mempertentangkan, ", { term: "porque" }, " memberi alasan, dan ", { term: "por eso" }, " memberi akibat."]
    vi: ["Từ nối liên kết các ý: ", { term: "y" }, " thêm vào, ", { term: "o" }, " đưa ra lựa chọn, ", { term: "pero" }, " đối lập, ", { term: "porque" }, " nêu nguyên nhân, còn ", { term: "por eso" }, " nêu kết quả."]
  rule:
    en: ["The reason follows the main clause with ", { term: porque }, ", or comes first with ", { term: como }, ":"]
    es: ["La causa va detrás de la oración principal con ", { term: porque }, ", o delante con ", { term: como }, ":"]
    uk: ["Причина стоїть після головного речення з ", { term: "porque" }, " або перед ним з ", { term: "como" }, ":"]
    pt: ["A causa vem depois da oração principal com ", { term: "porque" }, ", ou antes dela com ", { term: "como" }, ":"]
    fr: ["La cause suit la proposition principale avec ", { term: "porque" }, ", ou la précède avec ", { term: "como" }, " :"]
    de: ["Der Grund steht mit ", { term: "porque" }, " nach dem Hauptsatz oder mit ", { term: "como" }, " davor:"]
    it: ["La causa segue la frase principale con ", { term: "porque" }, ", oppure la precede con ", { term: "como" }, ":"]
    pl: ["Przyczyna stoi po zdaniu głównym z ", { term: "porque" }, " albo przed nim z ", { term: "como" }, ":"]
    tr: ["Neden, ", { term: "porque" }, " ile ana cümlenin arkasına, ", { term: "como" }, " ile önüne gelir:"]
    id: ["Alasan berada setelah klausa utama dengan ", { term: "porque" }, ", atau sebelumnya dengan ", { term: "como" }, ":"]
    vi: ["Nguyên nhân đứng sau mệnh đề chính với ", { term: "porque" }, ", hoặc đứng trước nó với ", { term: "como" }, ":"]
  ex: { examples: [["No salgo ", { target: porque }, " llueve."], [{ target: Como }, " llueve, no salgo."]] }

