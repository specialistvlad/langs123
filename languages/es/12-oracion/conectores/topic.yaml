id: es.oracion.conectores
lang: es
kind: grammar
tags: [linkers, conjunctions, sentence]
concepts: [linkers]
related: [es.oracion.condicionales, es.oracion.relativas, es.oracion.preguntas-negacion, es.subjuntivo.subjuntivo-cuando-para-que]
status: { en: draft, es: draft, uk: draft }
translated: { en: "7dd70b 992a2c 3b92eb 7c28cd 5ed794 a805f7 b9ee63 1ddb33 66c6f8", uk: "7dd70b 992a2c 3b92eb 7c28cd 5ed794 a805f7 b9ee63 1ddb33 66c6f8" }

title: { en: Linkers, es: Los conectores, uk: "Сполучні слова" }
summary:
  lead:
    en: ["Linkers join ideas: ", { term: y }, " adds, ", { term: o }, " offers a choice, ", { term: pero }, " contrasts, ", { term: porque }, " gives a reason and ", { term: por eso }, " a result."]
    es: ["Los conectores unen ideas: ", { term: y }, " suma, ", { term: o }, " ofrece una elección, ", { term: pero }, " contrasta, ", { term: porque }, " da una causa y ", { term: por eso }, ", una consecuencia."]
    uk: ["Сполучні слова поєднують думки: ", { term: "y" }, " додає, ", { term: "o" }, " пропонує вибір, ", { term: "pero" }, " протиставляє, ", { term: "porque" }, " вводить причину, а ", { term: "por eso" }, " — наслідок."]
  rule:
    en: ["The reason follows the main clause with ", { term: porque }, ", or comes first with ", { term: como }, ":"]
    es: ["La causa va detrás de la oración principal con ", { term: porque }, ", o delante con ", { term: como }, ":"]
    uk: ["Причина стоїть після головного речення з ", { term: "porque" }, " або перед ним з ", { term: "como" }, ":"]
  ex: { examples: [["No salgo ", { target: porque }, " llueve."], [{ target: Como }, " llueve, no salgo."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: { en: Adding, es: Suma, uk: "Додавання" }
          rule:
            en: [{ term: y }, " joins two words or two clauses"]
            es: [{ term: y }, " une dos palabras o dos oraciones"]
            uk: [{ term: "y" }, " поєднує два слова або два речення"]
          ex: ["Soy americana ", { target: y }, " vivo en Los Ángeles."]
          tr: { en: "I'm American and I live in Los Angeles.", uk: "Я американка і живу в Лос-Анджелесі." }
        - level: A1
          point: { en: Choice, es: Elección, uk: "Вибір" }
          rule:
            en: [{ term: o }, " offers a choice"]
            es: [{ term: o }, " ofrece una elección"]
            uk: [{ term: "o" }, " пропонує вибір"]
          ex: ["¿Eres americano ", { target: o }, " inglés?"]
          tr: { en: "Are you American or English?", uk: "Ти американець чи англієць?" }
        - level: A1
          point: { en: Contrast, es: Contraste, uk: "Протиставлення" }
          rule:
            en: [{ term: pero }, " sets two facts against each other, after a comma"]
            es: [{ term: pero }, " opone dos hechos, detrás de una coma"]
            uk: [{ term: "pero" }, " протиставляє два факти, після коми"]
          ex: ["Soy alemán, ", { target: pero }, " vivo en Suiza."]
          tr: { en: "I'm German, but I live in Switzerland.", uk: "Я німець, але живу у Швейцарії." }
        - level: A1
          point: { en: Negative, es: Negación, uk: "Заперечення" }
          rule:
            en: ["after a negative, ", { term: ni }, " adds the next item"]
            es: ["tras una negación, ", { term: ni }, " añade el siguiente elemento"]
            uk: ["після заперечення ", { term: "ni" }, " додає наступний елемент"]
          ex: ["No me gusta el otoño ", { target: ni }, " el invierno."]
          tr: { en: "I don't like autumn or winter.", uk: "Я не люблю ні осені, ні зими." }
        - level: A1
          point: { en: Reason, es: Causa, uk: "Причина" }
          rule:
            en: [{ term: porque }, " gives a reason, after the main clause"]
            es: [{ term: porque }, " da una causa, detrás de la oración principal"]
            uk: [{ term: "porque" }, " вводить причину, після головного речення"]
          ex: ["Estoy en España ", { target: porque }, " me gusta."]
          tr: { en: "I'm in Spain because I like it.", uk: "Я в Іспанії, бо мені тут подобається." }
        - level: A2
          point: { en: Spelling, es: Ortografía, uk: "Правопис" }
          rule:
            en: [{ mapping: [{ term: y }, { term: e }] }, " before ", { letter: i }, ", ", { mapping: [{ term: o }, { term: u }] }, " before ", { letter: o }]
            es: [{ mapping: [{ term: y }, { term: e }] }, " delante de ", { letter: i }, ", ", { mapping: [{ term: o }, { term: u }] }, " delante de ", { letter: o }]
            uk: [{ mapping: [{ term: "y" }, { term: "e" }] }, " перед ", { letter: "i" }, ", ", { mapping: [{ term: "o" }, { term: "u" }] }, " перед ", { letter: "o" }]
          ex: { examples: [["padre ", { target: e }, " hijo"], ["siete ", { target: u }, " ocho"]] }
          tr: { en: { examples: ["father and son", "seven or eight"] }, uk: { examples: ["батько і син", "сім або вісім"] } }
        - level: A2
          point: { en: Result, es: Consecuencia, uk: "Наслідок" }
          rule:
            en: [{ term: por eso }, " opens the result"]
            es: [{ term: por eso }, " introduce la consecuencia"]
            uk: [{ term: "por eso" }, " вводить наслідок"]
          ex: ["Está enfermo. ", { target: Por eso }, " no ha venido."]
          tr: { en: "He's ill. That's why he hasn't come.", uk: "Він хворий. Тому й не прийшов." }
        - level: A2
          point: { en: Time, es: Tiempo, uk: "Час" }
          rule:
            en: [{ term: cuando }, " with the present for what usually happens"]
            es: [{ term: cuando }, " con presente para lo que suele pasar"]
            uk: [{ term: "cuando" }, " з теперішнім часом — про те, що зазвичай стається"]
          ex: [{ target: Cuando }, " llueve, me quedo en casa."]
          tr: { en: "When it rains, I stay at home.", uk: "Коли йде дощ, я сиджу вдома." }
        - level: A2
          point: { en: Order, es: Orden, uk: "Порядок" }
          rule:
            en: [{ alternatives: [{ term: primero }, { term: luego }, { term: después }] }, " put actions in order"]
            es: [{ alternatives: [{ term: primero }, { term: luego }, { term: después }] }, " ordenan las acciones"]
            uk: [{ alternatives: [{ term: "primero" }, { term: "luego" }, { term: "después" }] }, " упорядковують дії"]
          ex: [{ target: Primero }, " desayuno, ", { target: luego }, " me ducho y ", { target: después }, " salgo."]
          tr: { en: "First I have breakfast, then I have a shower and after that I go out.", uk: "Спочатку я снідаю, потім приймаю душ, а після цього виходжу." }
        - level: B1
          point: { en: Reason first, es: Causa primero, uk: "Спершу причина" }
          rule:
            en: [{ term: como }, " gives the reason before the main clause"]
            es: [{ term: como }, " da la causa delante de la oración principal"]
            uk: [{ term: "como" }, " вводить причину перед головним реченням"]
          ex: [{ target: Como }, " no venías, empecé a cenar."]
          tr: { en: "As you weren't coming, I started dinner.", uk: "Оскільки ти не приходив, я почав вечеряти." }
        - level: B1
          point: { en: Contrast, es: Contraste, uk: "Протиставлення" }
          rule:
            en: [{ alternatives: [{ term: aunque }, { term: sin embargo }] }, ": a fact that goes against the other"]
            es: [{ alternatives: [{ term: aunque }, { term: sin embargo }] }, ": un hecho que va en contra del otro"]
            uk: [{ alternatives: [{ term: "aunque" }, { term: "sin embargo" }] }, ": факт, що суперечить іншому"]
          ex: ["Lo entiendo todo, ", { target: aunque }, " no hablo bien."]
          tr: { en: "I understand everything, although I don't speak well.", uk: "Я все розумію, хоча говорю погано." }
        - level: B1
          point: { en: Result, es: Consecuencia, uk: "Наслідок" }
          rule:
            en: [{ term: así que }, " joins the result to the cause"]
            es: [{ term: así que }, " une la consecuencia a la causa"]
            uk: [{ term: "así que" }, " приєднує наслідок до причини"]
          ex: ["No había entradas, ", { target: así que }, " no la vimos."]
          tr: { en: "There were no tickets left, so we didn't see it.", uk: "Квитків не було, тож ми його не подивилися." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A linker joins two words or two clauses and shows how they relate: adding, choice, contrast, reason, result or time."
              es: "Un conector une dos palabras o dos oraciones y muestra su relación: suma, elección, contraste, causa, consecuencia o tiempo."
              uk: "Сполучник поєднує два слова або два речення і показує зв’язок між ними: додавання, вибір, протиставлення, причину, наслідок чи час."
          - type: rule
            level: A1
            text:
              en: ["A comma goes before ", { term: pero }, ", never before ", { term: y }, " in a simple list:"]
              es: ["Delante de ", { term: pero }, " va coma, y nunca delante de ", { term: y }, " en una enumeración simple:"]
              uk: ["Перед ", { term: "pero" }, " ставлять кому, а перед ", { term: "y" }, " у простому переліку — ніколи:"]
            ex: ["Tengo un hermano ", { target: y }, " una hermana, ", { target: pero }, " no tengo primos."]
            tr: { en: "I've got a brother and a sister, but I haven't got any cousins.", uk: "У мене є брат і сестра, але немає двоюрідних братів і сестер." }

  - title: { en: "Use: adding and choosing", es: "Uso: suma y elección", uk: "Вживання: додавання і вибір" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: "Сполучник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, linker: y, use: { en: adding, es: suma, uk: "додавання" }, ex: ["Soy americana ", { target: y }, " vivo en Los Ángeles."], tr: { en: "I'm American and I live in Los Angeles.", uk: "Я американка і живу в Лос-Анджелесі." } }
          - { level: A1, linker: o, use: { en: a choice, es: una elección, uk: "вибір" }, ex: ["¿Eres americano ", { target: o }, " inglés?"], tr: { en: "Are you American or English?", uk: "Ти американець чи англієць?" } }
          - { level: A1, linker: ni, use: { en: adding after a negative, es: suma tras una negación, uk: "додавання після заперечення" }, ex: ["No me gusta el otoño ", { target: ni }, " el invierno."], tr: { en: "I don't like autumn or winter.", uk: "Я не люблю ні осені, ні зими." } }
          - { level: A2, linker: e, use: { en: "y before i, hi", es: "y delante de i, hi", uk: "y перед i, hi" }, ex: ["Quiero verte ", { target: e }, " ir a tu casa."], tr: { en: "I want to see you and go to your house.", uk: "Я хочу тебе побачити і прийти до тебе додому." } }
          - { level: A2, linker: u, use: { en: "o before o, ho", es: "o delante de o, ho", uk: "o перед o, ho" }, ex: ["Compra siete ", { target: u }, " ocho botellas de leche."], tr: { en: "Buy seven or eight bottles of milk.", uk: "Купи сім або вісім пляшок молока." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: y }, " becomes ", { term: e }, " before a word that starts with the sound ", { letter: i }, ": ", { alternatives: [{ term: padre e hijo }, { term: inglés e italiano }] }, "."]
              es: [{ term: y }, " pasa a ", { term: e }, " delante de una palabra que empieza por el sonido ", { letter: i }, ": ", { alternatives: [{ term: padre e hijo }, { term: inglés e italiano }] }, "."]
              uk: [{ term: "y" }, " стає ", { term: "e" }, " перед словом, що починається зі звука ", { letter: "i" }, ": ", { alternatives: [{ term: "padre e hijo" }, { term: "inglés e italiano" }] }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: o }, " becomes ", { term: u }, " before a word that starts with the sound ", { letter: o }, ": ", { alternatives: [{ term: siete u ocho }, { term: mujer u hombre }] }, "."]
              es: [{ term: o }, " pasa a ", { term: u }, " delante de una palabra que empieza por el sonido ", { letter: o }, ": ", { alternatives: [{ term: siete u ocho }, { term: mujer u hombre }] }, "."]
              uk: [{ term: "o" }, " стає ", { term: "u" }, " перед словом, що починається зі звука ", { letter: "o" }, ": ", { alternatives: [{ term: "siete u ocho" }, { term: "mujer u hombre" }] }, "."]
          - type: note
            level: A2
            text:
              en: [{ term: y }, " stays before ", { letter: hie }, ", which sounds like ", { letter: ye }, ": ", { term: agua y hielo }, "."]
              es: [{ term: y }, " se mantiene delante de ", { letter: hie }, ", que suena como ", { letter: ye }, ": ", { term: agua y hielo }, "."]
              uk: [{ term: "y" }, " лишається перед ", { letter: "hie" }, ", що звучить як ", { letter: "ye" }, ": ", { term: "agua y hielo" }, "."]

  - title: { en: "Use: contrast", es: "Uso: contraste", uk: "Вживання: протиставлення" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: "Сполучник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, linker: pero, use: { en: two facts set against each other, es: dos hechos opuestos, uk: "два протилежні факти" }, ex: ["Soy alemán, ", { target: pero }, " vivo en Suiza."], tr: { en: "I'm German, but I live in Switzerland.", uk: "Я німець, але живу у Швейцарії." } }
          - { level: B1, linker: aunque, use: { en: "a fact that goes against the other, in the same sentence", es: "un hecho que va en contra del otro, en la misma oración", uk: "факт, що суперечить іншому, в тому самому реченні" }, ex: ["Lo entiendo todo, ", { target: aunque }, " no hablo bien."], tr: { en: "I understand everything, although I don't speak well.", uk: "Я все розумію, хоча говорю погано." } }
          - { level: B1, linker: sin embargo, use: { en: "the contrast at the start of a new sentence or clause", es: "el contraste al principio de una nueva oración", uk: "протиставлення на початку нового речення" }, ex: ["Acepté; ", { target: sin embargo }, ", no estaba seguro."], tr: { en: "I accepted; however, I wasn't sure.", uk: "Я погодився; однак певності в мене не було." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: aunque }, " with the indicative states a real fact, like ", { term: pero }, "."]
              es: [{ term: aunque }, " con indicativo presenta un hecho real, como ", { term: pero }, "."]
              uk: [{ term: "aunque" }, " з дійсним способом повідомляє реальний факт, як і ", { term: "pero" }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: sin embargo }, " sits between commas, or after a semicolon or a full stop."]
              es: [{ term: sin embargo }, " va entre comas, o detrás de punto y coma o de punto."]
              uk: [{ term: "sin embargo" }, " виділяють комами або ставлять після крапки з комою чи крапки."]
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українською можна сказати ", { l1: "хоча я втомився, але йду на роботу" }, "; іспанською після ", { term: aunque }, " слово ", { term: pero }, " не вживають: ", { term: "Aunque estoy cansado, voy al trabajo." }]

  - title: { en: "Use: reason and result", es: "Uso: causa y consecuencia", uk: "Вживання: причина і наслідок" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: "Сполучник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, linker: porque, use: { en: "the reason, after the main clause", es: "la causa, detrás de la oración principal", uk: "причина, після головного речення" }, ex: ["Estoy en España ", { target: porque }, " me gusta."], tr: { en: "I'm in Spain because I like it.", uk: "Я в Іспанії, бо мені тут подобається." } }
          - { level: B1, linker: como, use: { en: "the reason, before the main clause", es: "la causa, delante de la oración principal", uk: "причина, перед головним реченням" }, ex: [{ target: Como }, " no venías, empecé a cenar."], tr: { en: "As you weren't coming, I started dinner.", uk: "Оскільки ти не приходив, я почав вечеряти." } }
          - { level: A2, linker: por eso, use: { en: the result, es: la consecuencia, uk: "наслідок" }, ex: ["Está enfermo. ", { target: Por eso }, " no ha venido."], tr: { en: "He's ill. That's why he hasn't come.", uk: "Він хворий. Тому й не прийшов." } }
          - { level: A2, linker: entonces, use: { en: what follows from what was said, es: lo que se deduce de lo dicho, uk: "висновок зі сказаного" }, ex: [{ target: Entonces }, " quedamos mañana, ¿no?"], tr: { en: "So we'll meet tomorrow, then?", uk: "То зустрічаємося завтра, так?" } }
          - { level: B1, linker: así que, use: { en: "the result, in the same sentence", es: "la consecuencia, en la misma oración", uk: "наслідок у тому самому реченні" }, ex: ["No había entradas, ", { target: así que }, " no la vimos."], tr: { en: "There were no tickets left, so we didn't see it.", uk: "Квитків не було, тож ми його не подивилися." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: porque }, " is one word and answers; ", { term: por qué }, " is two words and asks:"]
              es: [{ term: porque }, " es una palabra y responde; ", { term: por qué }, " son dos palabras y pregunta:"]
              uk: [{ term: "porque" }, " — одне слово, і воно відповідає; ", { term: "por qué" }, " — два слова, і вони запитують:"]
            ex: { exchange: [["¿", { target: Por qué }, " estudias español?"], [{ target: Porque }, " me gusta."]] }
            tr: { en: { exchange: ["Why are you studying Spanish?", "Because I like it."] }, uk: { exchange: ["Чому ти вивчаєш іспанську?", "Бо мені подобається."] } }

  - title: { en: "Use: time", es: "Uso: tiempo", uk: "Вживання: час" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: "Сполучник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, linker: cuando, use: { en: "with the present, what usually happens", es: "con presente, lo que suele pasar", uk: "з теперішнім часом — те, що зазвичай стається" }, ex: [{ target: Cuando }, " llueve, me quedo en casa."], tr: { en: "When it rains, I stay at home.", uk: "Коли йде дощ, я сиджу вдома." } }
          - { level: A2, linker: { pattern: [antes de, { slot: infinitive }] }, use: { en: the earlier action, es: la acción anterior, uk: "попередня дія" }, ex: ["Me lavo los dientes ", { target: antes de acostarme }, "."], tr: { en: "I brush my teeth before going to bed.", uk: "Я чищу зуби перед тим, як лягти спати." } }
          - { level: A2, linker: { pattern: [después de, { slot: infinitive }] }, use: { en: the later action, es: la acción posterior, uk: "наступна дія" }, ex: ["A veces doy un paseo ", { target: después de cenar }, "."], tr: { en: "Sometimes I go for a walk after dinner.", uk: "Іноді я гуляю після вечері." } }
          - level: A2
            linker: { alternatives: [primero, luego, después] }
            use: { en: "the order of actions: first, then, after that", es: "el orden de las acciones: lo primero, lo siguiente, lo último", uk: "порядок дій: спочатку, потім, після цього" }
            ex: [{ target: Primero }, " desayuno, ", { target: luego }, " me ducho y ", { target: después }, " salgo."]
            tr: { en: "First I have breakfast, then I have a shower and after that I go out.", uk: "Спочатку я снідаю, потім приймаю душ, а після цього виходжу." }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: antes de }, " and ", { term: después de }, " take the infinitive when both actions have the same subject."]
              es: [{ term: antes de }, " y ", { term: después de }, " llevan infinitivo cuando las dos acciones tienen el mismo sujeto."]
              uk: [{ term: "antes de" }, " і ", { term: "después de" }, " вживаються з інфінітивом, коли в обох дій той самий підмет."]
          - type: note
            level: B1
            text:
              en: [{ term: cuando }, " about the future takes the subjunctive: ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: [{ term: cuando }, " referido al futuro lleva subjuntivo: ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
