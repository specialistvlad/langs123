      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Con un pronombre tónico, el verbo de la relativa concuerda con él en persona."
              en: "With a stressed pronoun, the verb of the relative clause agrees with it in person."
              uk: "Якщо антецедент — наголошений займенник, дієслово означального речення узгоджується з ним в особі."
              pt: "Com um pronome tônico, o verbo da oração relativa concorda com ele em pessoa."
              fr: "Avec un pronom tonique, le verbe de la relative s’accorde avec lui en personne."
              de: "Bei einem betonten Pronomen richtet sich das Verb des Relativsatzes in der Person nach ihm."
              it: "Con un pronome tonico, il verbo della relativa concorda con esso in persona."
              pl: "Przy zaimku akcentowanym czasownik zdania względnego zgadza się z nim w osobie."
              tr: "Vurgulu bir zamirle, ilgi cümlesinin fiili kişi bakımından onunla uyum sağlar."
              id: "Dengan kata ganti bertekanan, kata kerja klausa relatif sesuai dengannya dalam orang."
              vi: "Với đại từ nhấn mạnh, động từ của mệnh đề quan hệ hòa hợp với nó về ngôi."
            ex: { examples: [["Yo, ", { target: que }, " soy su mejor amigo, lo sé."], ["Tú, ", { target: que }, " te crees tan listo, ¿sabes la respuesta?"]] }
            tr: { en: { examples: ["I, who am his best friend, know it.", "You, who think you're so clever, do you know the answer?"] }, uk: { examples: ["Я, який є його найкращим другом, це знаю.", "Ти, який вважаєш себе таким розумним, знаєш відповідь?"] }, pt: { examples: ["Eu, que sou o melhor amigo dele, sei disso.", "Você, que se acha tão esperto, sabe a resposta?"] }, fr: { examples: ["Moi, qui suis son meilleur ami, je le sais.", "Toi, qui te crois si intelligent, connais-tu la réponse ?"] }, de: { examples: ["Ich, der ich sein bester Freund bin, weiß es.", "Du, der du dich für so klug hältst, kennst du die Antwort?"] }, it: { examples: ["Io, che sono il suo migliore amico, lo so.", "Tu, che ti credi così intelligente, sai la risposta?"] }, pl: { examples: ["Ja, który jestem jego najlepszym przyjacielem, to wiem.", "Ty, który uważasz się za takiego mądrego, znasz odpowiedź?"] }, tr: { examples: ["Onun en iyi arkadaşı olan ben bunu bilirim.", "Kendini bu kadar akıllı sanan sen, cevabı biliyor musun?"] }, id: { examples: ["Saya, yang adalah sahabat terbaiknya, tahu itu.", "Kamu, yang merasa begitu pintar, tahukah kamu jawabannya?"] }, vi: { examples: ["Tôi, người là bạn thân nhất của anh ấy, tôi biết điều đó.", "Bạn, người tự cho mình là thông minh như vậy, bạn có biết câu trả lời không?"] } }

