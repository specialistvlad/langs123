            ind: { ex: [{ target: Quien tiene }, " mi cartera, que me la devuelva."], tr: { en: "The one who has my wallet should give it back to me.", uk: "Той, хто взяв мій гаманець, нехай поверне його мені.", pt: "Quem tem a minha carteira que a devolva para mim.", fr: "Celui qui a mon portefeuille, qu’il me le rende.", de: "Wer meine Geldbörse hat, soll sie mir zurückgeben.", it: "Chi ha il mio portafoglio, me lo restituisca.", pl: "Kto ma mój portfel, niech mi go odda.", tr: "Cüzdanımı alan, bana geri versin.", id: "Siapa yang memegang dompet saya, kembalikanlah kepada saya.", vi: "Ai đang giữ ví của tôi thì hãy trả lại cho tôi." } }
            sbjv: { ex: [{ target: Quien tenga }, " mi cartera, que me la devuelva."], tr: { en: "Whoever may have my wallet should give it back to me.", uk: "Хто б не мав мій гаманець, нехай поверне його мені.", pt: "Quem tiver a minha carteira que a devolva para mim.", fr: "Quiconque aurait mon portefeuille, qu’il me le rende.", de: "Wer immer meine Geldbörse haben sollte, soll sie mir zurückgeben.", it: "Chiunque abbia il mio portafoglio, me lo restituisca.", pl: "Ktokolwiek ma mój portfel, niech mi go odda.", tr: "Cüzdanım her kimdeyse, bana geri versin.", id: "Siapa pun yang memegang dompet saya, kembalikanlah kepada saya.", vi: "Bất cứ ai đang giữ ví của tôi thì hãy trả lại cho tôi." } }
