            ind: { ex: ["Tengo un libro ", { target: que es }, " divertido."], tr: { en: "I have a book that is fun.", uk: "У мене є книжка, яка весела.", pt: "Tenho um livro que é divertido.", fr: "J’ai un livre qui est amusant.", de: "Ich habe ein Buch, das lustig ist.", it: "Ho un libro che è divertente.", pl: "Mam książkę, która jest zabawna.", tr: "Eğlenceli bir kitabım var.", id: "Saya punya buku yang menghibur.", vi: "Tôi có một cuốn sách vui." } }
            sbjv: { ex: ["Busco un libro ", { target: que sea }, " divertido."], tr: { en: "I'm looking for a book that's fun.", uk: "Я шукаю книжку, яка була б веселою.", pt: "Procuro um livro que seja divertido.", fr: "Je cherche un livre qui soit amusant.", de: "Ich suche ein Buch, das lustig ist.", it: "Cerco un libro che sia divertente.", pl: "Szukam książki, która byłaby zabawna.", tr: "Eğlenceli bir kitap arıyorum.", id: "Saya mencari buku yang menghibur.", vi: "Tôi đang tìm một cuốn sách vui." } }
          - level: B2
