            expl: { es: "un sustantivo común, un nombre propio o un pronombre tónico", en: "a common noun, a proper name or a stressed pronoun", uk: "загальний іменник, власна назва або наголошений займенник", pt: "um substantivo comum, um nome próprio ou um pronome tônico", fr: "un nom commun, un nom propre ou un pronom tonique", de: "ein Gattungsname, ein Eigenname oder ein betontes Pronomen", it: "un sostantivo comune, un nome proprio o un pronome tonico", pl: "rzeczownik pospolity, nazwa własna lub zaimek akcentowany", tr: "bir cins isim, bir özel ad ya da vurgulu bir zamir", id: "kata benda umum, nama diri, atau kata ganti bertekanan", vi: "một danh từ chung, một tên riêng hoặc một đại từ nhấn mạnh" }
