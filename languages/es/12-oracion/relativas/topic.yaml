            ex: { examples: [["Los chicos ", { target: de los que }, " te hablé son mis primos."], ["La casa ", { target: de la que }, " te hablé está en venta."]] }
          - level: B2
            use: { es: ["Sin antecedente: ", { term: el que }, " designa a cualquier persona o a una conocida"] }
            ex: { examples: [["Dejé mi dirección para ", { target: el que }, " quiera escribirme."], [{ target: El que }, " asistió ayer a la cena fue el menos indicado."]] }
          - level: B2
            use: { es: "Antecedente omitido: el artículo recoge un sustantivo ya dicho" }
            ex: ["Esta película es buena, pero ", { target: la que }, " vimos ayer fue mejor."]
          - level: B2
            use: { es: "Con infinitivo: preposición y artículo, sin comas" }
            ex: ["Busco una persona ", { target: con la que }, " compartir piso."]
          - level: B2
            use: { es: "Objeto directo de persona: con la preposición a o sin ella" }
            ex: { examples: [["La chica ", { target: a la que }, " vi ayer es mi vecina."], ["La chica ", { target: que }, " vi ayer es mi vecina."]] }
          - level: C1
            use: { es: ["Con el demostrativo: ", { term: aquellos que }] }
            ex: [{ target: Aquellos que }, " lo deseen pueden salir antes."]
          - level: C1
            use: { es: [{ term: quien }, " en explicativas; ", { term: que }, " es más habitual"] }
            ex: { examples: [["Los estudiantes, ", { target: quienes }, " habían hecho huelga, volvieron a clase."], ["Los estudiantes, ", { target: que }, " habían hecho huelga, volvieron a clase."]] }
          - level: C1
            use: { es: ["Valor general: ", { term: quien }, " y ", { term: el que }, " dicen ‘cualquiera que’"] }
            ex: { examples: [[{ target: Quien }, " habla así no tiene razón."], [{ target: El que }, " habla así no tiene razón."]] }
          - level: C1
            use: { es: "Con posesivo: el posesivo va detrás del sustantivo" }
            ex: ["La frase ", { target: mía que }, " acabas de copiar no es muy buena."]
          - level: C1
            use: { es: ["Con antecedente de primera persona: el verbo concuerda con ", { term: yo }, " o con ", { term: el que }] }
            ex: { examples: [["Yo, ", { target: el que }, " te apoyé en todo, merezco más respeto."], ["Yo, ", { target: el que }, " te apoyó en todo, merezco más respeto."]] }
          - level: C2
            use: { es: [{ term: con que }, " y ", { term: con el que }, " para el instrumento"] }
