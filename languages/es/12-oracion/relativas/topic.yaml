id: es.oracion.relativas
lang: es
kind: grammar
tags: [relative-clauses, que, quien, sentence]
concepts: [relative-clauses]
related: [es.oracion.conectores, es.oracion.preguntas-negacion, es.pronombres.objeto-directo, es.preposiciones.preposiciones-basicas]
status: { en: draft, es: draft, uk: draft }
translated: { en: "a3c4f9 078353 da5e37 7e3487 0b83c4 6e08a0 611c02 33c119", uk: "a3c4f9 078353 da5e37 7e3487 0b83c4 6e08a0 611c02 33c119" }

title: { en: Relative Clauses, es: Las oraciones de relativo, uk: "Означальні підрядні речення" }
summary:
  lead:
    en: ["A relative clause after ", { term: que }, " describes a noun: ", { term: la profesora que tengo }, "; ", { term: quien }, " follows a preposition for people."]
    es: ["Una oración de relativo con ", { term: que }, " describe un sustantivo: ", { term: la profesora que tengo }, "; ", { term: quien }, " sigue a una preposición para personas."]
    uk: ["Підрядне речення з ", { term: "que" }, " описує іменник: ", { term: "la profesora que tengo" }, "; ", { term: "quien" }, " стоїть після прийменника, коли йдеться про людей."]
  rule:
    en: ["The word ", { term: que }, " always joins the clause to its noun and never drops:"]
    es: ["La palabra ", { term: que }, " siempre une la oración a su sustantivo y nunca se omite:"]
    uk: ["Слово ", { term: "que" }, " завжди приєднує підрядне речення до іменника і ніколи не пропускається:"]
  ex: ["El libro ", { target: que }, " leo es muy bueno."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: { en: Subject, es: Sujeto, uk: "Підмет" }
          rule:
            en: [{ term: que }, " is the subject of the clause"]
            es: [{ term: que }, " es el sujeto de la oración"]
            uk: [{ term: "que" }, " — підмет підрядного речення"]
          ex: ["Tengo una amiga ", { target: que }, " vive en Lima."]
          tr: { en: "I've got a friend who lives in Lima.", uk: "У мене є подруга, яка живе в Лімі." }
        - level: A1
          point: { en: Object, es: Objeto, uk: "Додаток" }
          rule:
            en: [{ term: que }, " is the object of the clause"]
            es: [{ term: que }, " es el objeto de la oración"]
            uk: [{ term: "que" }, " — додаток підрядного речення"]
          ex: ["La profesora ", { target: que }, " tengo es muy buena."]
          tr: { en: "The teacher I've got is very good.", uk: "Викладачка, яка в мене є, дуже хороша." }
        - level: A2
          point: { en: Tense, es: Tiempo, uk: "Час" }
          rule:
            en: "the clause takes the tense it needs"
            es: "la oración lleva el tiempo que necesita"
            uk: "підрядне речення має той час, якого потребує"
          ex: ["El libro ", { target: que }, " compré ayer es muy bueno."]
          tr: { en: "The book I bought yesterday is very good.", uk: "Книжка, яку я купив учора, дуже хороша." }
        - level: B1
          point: { en: People, es: Personas, uk: "Люди" }
          rule:
            en: ["after a preposition, ", { term: quien }, " for people"]
            es: ["detrás de una preposición, ", { term: quien }, " para personas"]
            uk: ["після прийменника про людей — ", { term: "quien" }]
          ex: ["El chico ", { target: con quien }, " trabajo es de Chile."]
          tr: { en: "The boy I work with is from Chile.", uk: "Хлопець, з яким я працюю, з Чилі." }
        - level: B1
          point: { en: Places, es: Lugares, uk: "Місця" }
          rule:
            en: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": pointing to a place"]
            es: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": para señalar un lugar"]
            uk: [{ pattern: [{ alternatives: ["aquí", "allí"] }, "es donde"] }, ": щоб указати на місце"]
          ex: ["Allí es ", { target: donde }, " vivo."]
          tr: { en: "That's where I live.", uk: "Саме там я живу." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: que }, " never drops"]
            es: [{ term: que }, " nunca se omite"]
            uk: [{ term: "que" }, " ніколи не пропускається"]
          ex: ["El libro ", { target: que }, " leo es interesante."]
          tr: { en: "The book I'm reading is interesting.", uk: "Книжка, яку я читаю, цікава." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["right after a noun, people take ", { term: que }, ", not ", { term: quien }]
            es: ["justo detrás de un sustantivo, las personas llevan ", { term: que }, ", no ", { term: quien }]
            uk: ["одразу після іменника про людей кажуть ", { term: "que" }, ", а не ", { term: "quien" }]
          ex: ["El médico ", { target: que }, " vino ayer es muy simpático."]
          tr: { en: "The doctor who came yesterday is very nice.", uk: "Лікар, який приходив учора, дуже приємний." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A relative clause describes a noun and comes right after it."
              es: "Una oración de relativo describe un sustantivo y va justo detrás de él."
              uk: "Означальне підрядне речення описує іменник і стоїть одразу після нього."
          - type: rule
            level: A1
            text:
              en: [{ term: que }, " serves for people and things, and never changes:"]
              es: [{ term: que }, " sirve para personas y cosas, y no cambia nunca:"]
              uk: [{ term: "que" }, " вживають і для людей, і для речей, і воно ніколи не змінюється:"]
            ex: { examples: [["la amiga ", { target: que }, " viene conmigo"], ["un libro ", { target: que }, " lees"]] }
            tr: { en: { examples: ["the friend who's coming with me", "a book you're reading"] }, uk: { examples: ["подруга, яка йде зі мною", "книжка, яку ти читаєш"] } }
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["English can leave out ", { l1: that }, "; Spanish always says ", { term: que }, "."]
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["Українське ", { l1: "який" }, " змінюється за родом, числом і відмінком: ", { l1: "який, яка, яке, які, якого" }, "; ", { term: que }, " не змінюється ніколи."]

  - title: { en: "Form: que", es: "Forma: que", uk: "Форма: que" }
    role: form
    content:
      - type: usage
        columns:
          - { key: role, label: { en: Role, es: Función, uk: "Функція" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, role: { en: Subject, es: Sujeto, uk: "Підмет" }, ex: ["Vivo en una casa ", { target: que }, " tiene tres habitaciones."], tr: { en: "I live in a house that has three bedrooms.", uk: "Я живу в будинку, у якому три спальні." } }
          - { level: A1, role: { en: Object, es: Objeto, uk: "Додаток" }, ex: ["La profesora ", { target: que }, " tengo es muy buena."], tr: { en: "The teacher I've got is very good.", uk: "Викладачка, яка в мене є, дуже хороша." } }
          - { level: A2, role: { en: With the past, es: Con el pasado, uk: "З минулим часом" }, ex: ["El libro ", { target: que }, " compré ayer es muy bueno."], tr: { en: "The book I bought yesterday is very good.", uk: "Книжка, яку я купив учора, дуже хороша." } }
          - { level: A2, role: { en: With the future, es: Con el futuro, uk: "З майбутнім часом" }, ex: ["La película ", { target: que }, " vamos a ver es mexicana."], tr: { en: "The film we're going to see is Mexican.", uk: "Фільм, який ми збираємося дивитися, мексиканський." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: que }, " keeps the same form for every noun: ", { alternatives: [{ term: la casa que }, { term: los libros que }] }, "."]
              es: [{ term: que }, " tiene la misma forma con todos los sustantivos: ", { alternatives: [{ term: la casa que }, { term: los libros que }] }, "."]
              uk: [{ term: "que" }, " має ту саму форму з будь-яким іменником: ", { alternatives: [{ term: "la casa que" }, { term: "los libros que" }] }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: que }, " already stands for the noun, so no pronoun repeats it:"]
              es: [{ term: que }, " ya representa al sustantivo, así que ningún pronombre lo repite:"]
              uk: [{ term: "que" }, " уже заступає іменник, тож жоден займенник його не повторює:"]
            ex: ["El libro ", { target: que }, " compré es muy bueno."]
            tr: { en: "The book I bought is very good.", uk: "Книжка, яку я купив, дуже хороша." }

  - title: { en: "Form: quien", es: "Forma: quien", uk: "Форма: quien" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: B1, pattern: { pattern: [{ slot: { en: preposition, es: preposición, uk: "прийменник" } }, quien] }, ex: ["El chico ", { target: con quien }, " trabajo es de Chile."], tr: { en: "The boy I work with is from Chile.", uk: "Хлопець, з яким я працюю, з Чилі." } }
          - { level: B1, pattern: { pattern: [a, quien] }, ex: ["El chico ", { target: a quien }, " saludaste es mi primo."], tr: { en: "The boy you said hello to is my cousin.", uk: "Хлопець, з яким ти привітався, — мій двоюрідний брат." } }
          - { level: B1, pattern: { pattern: [{ slot: { en: preposition, es: preposición, uk: "прийменник" } }, quienes] }, ex: ["Los amigos ", { target: con quienes }, " viajo son muy divertidos."], tr: { en: "The friends I travel with are great fun.", uk: "Друзі, з якими я подорожую, дуже веселі." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: quien }, " refers to people only, and its plural is ", { term: quienes }, "."]
              es: [{ term: quien }, " se refiere solo a personas, y su plural es ", { term: quienes }, "."]
              uk: [{ term: "quien" }, " стосується лише людей, а його множина — ", { term: "quienes" }, "."]
          - type: rule
            level: B1
            text:
              en: ["Right after a noun, people take ", { term: que }, ", not ", { term: quien }, ":"]
              es: ["Justo detrás de un sustantivo, las personas llevan ", { term: que }, ", no ", { term: quien }, ":"]
              uk: ["Одразу після іменника про людей кажуть ", { term: "que" }, ", а не ", { term: "quien" }, ":"]
            ex: ["El médico ", { target: que }, " vino ayer es muy simpático."]
            tr: { en: "The doctor who came yesterday is very nice.", uk: "Лікар, який приходив учора, дуже приємний." }

  - title: { en: "Form: donde", es: "Forma: donde", uk: "Форма: donde" }
    role: form
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: donde }, " points to a place, often after ", { alternatives: [{ term: aquí es }, { term: allí es }] }, ":"]
              es: [{ term: donde }, " señala un lugar, a menudo detrás de ", { alternatives: [{ term: aquí es }, { term: allí es }] }, ":"]
              uk: [{ term: "donde" }, " вказує на місце, часто після ", { alternatives: [{ term: "aquí es" }, { term: "allí es" }] }, ":"]
            ex: { examples: [["Aquí es ", { target: donde }, " trabajo."], ["Allí es ", { target: donde }, " voy."]] }
            tr: { en: { examples: ["This is where I work.", "That's where I'm going."] }, uk: { examples: ["Саме тут я працюю.", "Саме туди я йду."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: donde }, " that joins has no accent; ", { term: dónde }, " that asks has one."]
              es: [{ term: donde }, " (relativo) no lleva tilde; ", { term: dónde }, " (interrogativo), sí."]
              uk: [{ term: "donde" }, ", що з’єднує частини речення, пишеться без знака наголосу; питальне ", { term: "dónde" }, " — зі знаком."]

  - title: { en: "Compare: que and quien", es: "Comparación: que y quien", uk: "Порівняння: que і quien" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: que, label: que }
          - { key: quien, label: quien }
        rows:
          - { level: B1, que: { en: "people and things, right after the noun", es: "personas y cosas, justo detrás del sustantivo", uk: "люди й речі, одразу після іменника" }, quien: { en: "people only, after a preposition", es: "solo personas, detrás de una preposición", uk: "лише люди, після прийменника" } }
          - level: B1
            que: { ex: ["el chico ", { target: que }, " trabaja aquí"], tr: { en: "the boy who works here", uk: "хлопець, який тут працює" } }
            quien: { ex: ["el chico ", { target: con quien }, " trabajo"], tr: { en: "the boy I work with", uk: "хлопець, з яким я працюю" } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, speakers: [en], wrong: "El libro leo es interesante.", right: ["El libro ", { target: que }, " leo es interesante."], rule: { en: [{ term: que }, " never drops"] } }
          - { level: A2, wrong: "El libro que lo compré es muy bueno.", right: ["El libro ", { target: que }, " compré es muy bueno."], rule: { en: [{ term: que }, " already stands for the noun"], es: [{ term: que }, " ya representa al sustantivo"], uk: [{ term: "que" }, " уже заступає іменник"] } }
          - { level: B1, wrong: "La profesora quien tengo es muy buena.", right: ["La profesora ", { target: que }, " tengo es muy buena."], rule: { en: ["right after a noun, ", { term: que }], es: ["justo detrás de un sustantivo, ", { term: que }], uk: ["одразу після іменника — ", { term: "que" }] } }
          - { level: B1, wrong: "El chico con que trabajo es de Chile.", right: ["El chico ", { target: con quien }, " trabajo es de Chile."], rule: { en: ["after a preposition, a person takes ", { term: quien }], es: ["detrás de una preposición, una persona lleva ", { term: quien }], uk: ["після прийменника про людину кажуть ", { term: "quien" }] } }
          - { level: B1, wrong: "Aquí es dónde trabajo.", right: ["Aquí es ", { target: donde }, " trabajo."], rule: { en: [{ term: donde }, " that joins has no accent"], es: [{ term: donde }, " (relativo) no lleva tilde"], uk: [{ term: "donde" }, ", що з’єднує частини речення, пишеться без знака наголосу"] } }
