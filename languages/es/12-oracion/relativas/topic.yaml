            expl: { es: "solo indicativo", en: "indicative only", uk: "лише дійсний спосіб", pt: "só indicativo", fr: "seulement l’indicatif", de: "nur Indikativ", it: "solo indicativo", pl: "tylko tryb oznajmujący", tr: "yalnızca haber kipi", id: "hanya indikatif", vi: "chỉ thức chỉ định" }
