            spec: { ex: ["La chica ", { target: que }, " vive aquí es mi vecina."], tr: { en: "The girl who lives here is my neighbour.", uk: "Дівчина, яка тут живе, — моя сусідка.", pt: "A moça que mora aqui é minha vizinha.", fr: "La fille qui habite ici est ma voisine.", de: "Das Mädchen, das hier wohnt, ist meine Nachbarin.", it: "La ragazza che abita qui è la mia vicina.", pl: "Dziewczyna, która tu mieszka, to moja sąsiadka.", tr: "Burada oturan kız komşum.", id: "Gadis yang tinggal di sini adalah tetangga saya.", vi: "Cô gái sống ở đây là hàng xóm của tôi." } }
            expl: { ex: ["Esa chica, ", { target: que }, " es mi vecina, es muy simpática."], tr: { en: "That girl, who is my neighbour, is very nice.", uk: "Та дівчина, яка є моєю сусідкою, дуже приємна.", pt: "Aquela moça, que é minha vizinha, é muito simpática.", fr: "Cette fille, qui est ma voisine, est très sympathique.", de: "Das Mädchen, das meine Nachbarin ist, ist sehr nett.", it: "Quella ragazza, che è la mia vicina, è molto simpatica.", pl: "Ta dziewczyna, która jest moją sąsiadką, jest bardzo sympatyczna.", tr: "Komşum olan o kız çok sevimli.", id: "Gadis itu, yang adalah tetangga saya, sangat ramah.", vi: "Cô gái ấy, người là hàng xóm của tôi, rất dễ mến." } }
          - level: B2
