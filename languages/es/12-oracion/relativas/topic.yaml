            use: { es: [{ term: que }, " enfático detrás de ", { term: vaya }, " y un sustantivo"], en: ["Emphatic ", { term: que }, " after ", { term: vaya }, " and a noun"], uk: ["Підсилювальне ", { term: que }, " після ", { term: vaya }, " та іменника"], pt: [{ term: que }, " enfático depois de ", { term: vaya }, " e um substantivo"], fr: [{ term: que }, " d’insistance après ", { term: vaya }, " et un nom"], de: ["Verstärkendes ", { term: que }, " nach ", { term: vaya }, " und einem Nomen"], it: [{ term: que }, " enfatico dopo ", { term: vaya }, " e un sostantivo"], pl: ["Wzmacniające ", { term: que }, " po ", { term: vaya }, " i rzeczowniku"], tr: [{ term: vaya }, " ve bir isimden sonra vurgulayıcı ", { term: que }], id: [{ term: que }, " emfatik setelah ", { term: vaya }, " dan sebuah kata benda"], vi: [{ term: que }, " nhấn mạnh sau ", { term: vaya }, " và một danh từ"] }
            ex: ["¡Vaya cara ", { target: que }, " tiene!"]
            tr: { en: "What a nerve he has!", uk: "Ну й нахаба ж він!", pt: "Que cara de pau ele tem!", fr: "Quel culot il a !", de: "Der hat vielleicht Nerven!", it: "Che faccia tosta che ha!", pl: "Ale ma tupet!", tr: "Ne yüzsüz adam!", id: "Wah, tebal sekali mukanya!", vi: "Anh ta đúng là mặt dày!" }
          - level: C2
            use: { es: "El artículo y de ponderan la cantidad", en: "The article and de intensify the quantity", uk: "Артикль і de підсилюють кількість", pt: "O artigo e de realçam a quantidade", fr: "L’article et de mettent la quantité en relief", de: "Der Artikel und de betonen die Menge", it: "L'articolo e de enfatizzano la quantità", pl: "Przedimek i de podkreślają ilość", tr: "Artikel ve de miktarı vurgular", id: "Artikel dan de menekankan jumlah", vi: "Mạo từ và de nhấn mạnh số lượng" }
            ex: { examples: [["¡", { target: La de veces que }, " te lo he dicho!"], ["¡", { target: La de líos que }, " nos ha metido ese!"]] }
            tr: { en: { examples: ["How many times I've told you!", "The trouble that guy has got us into!"] }, uk: { examples: ["Скільки разів я тобі це казав!", "Скільки неприємностей він нам завдав!"] }, pt: { examples: ["Quantas vezes eu já te disse isso!", "Quantas confusões esse aí nos arrumou!"] }, fr: { examples: ["Combien de fois je te l’ai dit !", "Dans quels ennuis il nous a mis, celui-là !"] }, de: { examples: ["Wie oft habe ich dir das schon gesagt!", "In was für Schwierigkeiten uns der gebracht hat!"] }, it: { examples: ["Quante volte te l'ho detto!", "Quanti guai ci ha combinato quello!"] }, pl: { examples: ["Ileż razy ci to mówiłem!", "W ileż kłopotów nas wpakował ten facet!"] }, tr: { examples: ["Sana kaç kere söyledim!", "Bu adam bize ne kadar dert açtı!"] }, id: { examples: ["Sudah berapa kali saya katakan padamu!", "Betapa banyak masalah yang dibuatnya untuk kita, orang itu!"] }, vi: { examples: ["Tôi đã nói với bạn bao nhiêu lần rồi!", "Hắn đã gây cho chúng ta biết bao rắc rối!"] } }
          - level: C2
            use: { es: [{ term: a saber }, " introduce una cantidad que se ignora"], en: [{ term: a saber }, " introduces a quantity nobody knows"], uk: [{ term: a saber }, " вводить кількість, якої ніхто не знає"], pt: [{ term: a saber }, " introduz uma quantidade que se ignora"], fr: [{ term: a saber }, " introduit une quantité que l’on ignore"], de: [{ term: a saber }, " leitet eine unbekannte Menge ein"], it: [{ term: a saber }, " introduce una quantità ignota"], pl: [{ term: a saber }, " wprowadza nieznaną ilość"], tr: [{ term: a saber }, " bilinmeyen bir miktarı getirir"], id: [{ term: a saber }, " memperkenalkan jumlah yang tidak diketahui"], vi: [{ term: a saber }, " đưa ra một số lượng không ai biết"] }
            ex: [{ target: A saber el dinero que }, " habrá pagado por eso."]
            tr: { en: "Heaven knows how much money he must have paid for that.", uk: "Бог знає, скільки грошей він за це заплатив.", pt: "Sabe-se lá quanto dinheiro ele pagou por isso.", fr: "Dieu sait combien d’argent il a dû payer pour ça.", de: "Wer weiß, wie viel Geld er dafür bezahlt haben mag.", it: "Chissà quanti soldi avrà pagato per questo.", pl: "Bóg raczy wiedzieć, ile pieniędzy za to zapłacił.", tr: "Bunun için kim bilir ne kadar para ödemiştir.", id: "Entah berapa banyak uang yang telah dia bayar untuk itu.", vi: "Chẳng biết anh ta đã trả bao nhiêu tiền cho việc đó." }
          - level: C2
            use: { es: "Relativa: describe el sustantivo", en: "Relative clause: describes the noun", uk: "Означальне речення: описує іменник", pt: "Relativa: descreve o substantivo", fr: "Relative : décrit le nom", de: "Relativsatz: beschreibt das Nomen", it: "Relativa: descrive il sostantivo", pl: "Zdanie względne: opisuje rzeczownik", tr: "İlgi cümlesi: ismi tanımlar", id: "Klausa relatif: menjelaskan kata benda", vi: "Mệnh đề quan hệ: mô tả danh từ" }
            ex: ["Lleva unas gafas ", { target: que }, " están viejas."]
            tr: { en: "He's wearing glasses that are old.", uk: "Він носить окуляри, які старі.", pt: "Ele usa uns óculos que estão velhos.", fr: "Il porte des lunettes qui sont vieilles.", de: "Er trägt eine Brille, die alt ist.", it: "Porta degli occhiali che sono vecchi.", pl: "Nosi okulary, które są stare.", tr: "Eski olan bir gözlük takıyor.", id: "Dia memakai kacamata yang sudah tua.", vi: "Anh ấy đeo một cặp kính cũ." }
          - level: C2
            use: { es: "Consecutiva: pondera el sustantivo con una consecuencia", en: "Consecutive clause: stresses the noun with a result", uk: "Наслідкове речення: підсилює іменник вказівкою на наслідок", pt: "Consecutiva: realça o substantivo com uma consequência", fr: "Consécutive : met le nom en relief par une conséquence", de: "Konsekutivsatz: hebt das Nomen durch eine Folge hervor", it: "Consecutiva: enfatizza il sostantivo con una conseguenza", pl: "Zdanie skutkowe: wzmacnia rzeczownik wskazaniem skutku", tr: "Sonuç cümlesi: ismi bir sonuçla vurgular", id: "Klausa konsekutif: menekankan kata benda dengan akibat", vi: "Mệnh đề kết quả: nhấn mạnh danh từ bằng một hệ quả" }
            ex: ["Tiene una cara ", { target: que }, " no te imaginas."]
            tr: { en: "He has a face you can't imagine.", uk: "У нього таке обличчя, що ти не уявляєш.", pt: "Ele tem uma cara que você nem imagina.", fr: "Il a une tête que tu n’imagines pas.", de: "Er hat ein Gesicht, wie du es dir nicht vorstellen kannst.", it: "Ha una faccia che non t'immagini.", pl: "Ma taką twarz, że sobie nie wyobrażasz.", tr: "Hayal edemeyeceğin bir yüzü var.", id: "Dia punya wajah yang tidak bisa kamu bayangkan.", vi: "Anh ta có một cái mặt mà bạn không thể tưởng tượng được." }
          - level: C2
