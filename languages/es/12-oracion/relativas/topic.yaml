title: { en: Relative Clauses, es: Las oraciones de relativo, uk: "Означальні підрядні речення", pt: "As orações relativas", fr: "Les propositions relatives", de: "Die Relativsätze", it: "Le proposizioni relative", pl: "Zdania względne", tr: "İlgi cümleleri", id: "Klausa relatif", vi: "Mệnh đề quan hệ" }
summary:
  lead:
    en: ["A relative clause after ", { term: que }, " describes a noun: ", { term: la profesora que tengo }, "; ", { term: quien }, " follows a preposition for people."]
    es: ["Una oración de relativo con ", { term: que }, " describe un sustantivo: ", { term: la profesora que tengo }, "; ", { term: quien }, " sigue a una preposición para personas."]
    uk: ["Підрядне речення з ", { term: "que" }, " описує іменник: ", { term: "la profesora que tengo" }, "; ", { term: "quien" }, " стоїть після прийменника, коли йдеться про людей."]
    pt: ["Uma oração relativa com ", { term: que }, " descreve um substantivo: ", { term: la profesora que tengo }, "; ", { term: quien }, " vem depois de uma preposição quando se trata de pessoas."]
    fr: ["Une proposition relative avec ", { term: que }, " décrit un nom : ", { term: la profesora que tengo }, " ; ", { term: quien }, " suit une préposition pour les personnes."]
    de: ["Ein Relativsatz mit ", { term: que }, " beschreibt ein Nomen: ", { term: la profesora que tengo }, "; ", { term: quien }, " steht für Personen nach einer Präposition."]
    it: ["Una proposizione relativa con ", { term: que }, " descrive un sostantivo: ", { term: la profesora que tengo }, "; ", { term: quien }, " segue una preposizione per le persone."]
    pl: ["Zdanie względne z ", { term: que }, " opisuje rzeczownik: ", { term: la profesora que tengo }, "; ", { term: quien }, " stoi po przyimku, gdy mowa o osobach."]
    tr: ["İlgi cümlesi, ", { term: que }, " ile bir ismi tanımlar: ", { term: la profesora que tengo }, "; kişiler için ", { term: quien }, " bir edattan sonra gelir."]
    id: ["Klausa relatif dengan ", { term: que }, " menjelaskan kata benda: ", { term: la profesora que tengo }, "; ", { term: quien }, " mengikuti kata depan untuk orang."]
    vi: ["Mệnh đề quan hệ với ", { term: que }, " mô tả một danh từ: ", { term: la profesora que tengo }, "; ", { term: quien }, " đứng sau giới từ khi nói về người."]
  rule:
    en: ["The word ", { term: que }, " always joins the clause to its noun and never drops:"]
    es: ["La palabra ", { term: que }, " siempre une la oración a su sustantivo y nunca se omite:"]
    uk: ["Слово ", { term: "que" }, " завжди приєднує підрядне речення до іменника і ніколи не пропускається:"]
    pt: ["A palavra ", { term: que }, " sempre liga a oração ao seu substantivo e nunca é omitida:"]
    fr: ["Le mot ", { term: que }, " relie toujours la proposition à son nom et ne s’omet jamais :"]
    de: ["Das Wort ", { term: que }, " verbindet den Satz immer mit seinem Nomen und entfällt nie:"]
    it: ["La parola ", { term: que }, " unisce sempre la proposizione al suo sostantivo e non si omette mai:"]
    pl: ["Słowo ", { term: que }, " zawsze łączy zdanie z jego rzeczownikiem i nigdy nie jest pomijane:"]
    tr: ["Cümleyi ismine her zaman ", { term: que }, " bağlar; bu sözcük asla düşmez:"]
    id: ["Kata ", { term: que }, " selalu menghubungkan klausa dengan kata bendanya dan tidak pernah dihilangkan:"]
    vi: ["Từ ", { term: que }, " luôn nối mệnh đề với danh từ của nó và không bao giờ được bỏ:"]
  ex: ["El libro ", { target: que }, " leo es muy bueno."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: A1
          point: { en: Subject, es: Sujeto, uk: "Підмет", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" }
          rule:
            en: [{ term: que }, " is the subject of the clause"]
            es: [{ term: que }, " es el sujeto de la oración"]
            uk: [{ term: "que" }, " — підмет підрядного речення"]
            pt: [{ term: que }, " é o sujeito da oração"]
            fr: [{ term: que }, " est le sujet de la proposition"]
            de: [{ term: que }, " ist das Subjekt des Satzes"]
            it: [{ term: que }, " è il soggetto della proposizione"]
            pl: [{ term: que }, " jest podmiotem zdania"]
            tr: [{ term: que }, " cümlenin öznesidir"]
            id: [{ term: que }, " adalah subjek klausa"]
            vi: [{ term: que }, " là chủ ngữ của mệnh đề"]
          ex: ["Tengo una amiga ", { target: que }, " vive en Lima."]
          tr: { en: "I've got a friend who lives in Lima.", uk: "У мене є подруга, яка живе в Лімі.", pt: "Tenho uma amiga que mora em Lima.", fr: "J’ai une amie qui habite à Lima.", de: "Ich habe eine Freundin, die in Lima wohnt.", it: "Ho un'amica che vive a Lima.", pl: "Mam przyjaciółkę, która mieszka w Limie.", tr: "Lima’da yaşayan bir arkadaşım var.", id: "Saya punya teman perempuan yang tinggal di Lima.", vi: "Tôi có một người bạn sống ở Lima." }
        - level: A1
          point: { en: Object, es: Objeto, uk: "Додаток", pt: "Objeto", fr: "Complément", de: "Objekt", it: "Complemento oggetto", pl: "Dopełnienie", tr: "Nesne", id: "Objek", vi: "Tân ngữ" }
          rule:
            en: [{ term: que }, " is the object of the clause"]
            es: [{ term: que }, " es el objeto de la oración"]
            uk: [{ term: "que" }, " — додаток підрядного речення"]
            pt: [{ term: que }, " é o objeto da oração"]
            fr: [{ term: que }, " est le complément de la proposition"]
            de: [{ term: que }, " ist das Objekt des Satzes"]
            it: [{ term: que }, " è il complemento oggetto della proposizione"]
            pl: [{ term: que }, " jest dopełnieniem zdania"]
            tr: [{ term: que }, " cümlenin nesnesidir"]
            id: [{ term: que }, " adalah objek klausa"]
            vi: [{ term: que }, " là tân ngữ của mệnh đề"]
          ex: ["La profesora ", { target: que }, " tengo es muy buena."]
          tr: { en: "The teacher I've got is very good.", uk: "Викладачка, яка в мене є, дуже хороша.", pt: "A professora que eu tenho é muito boa.", fr: "La professeure que j’ai est très bonne.", de: "Die Lehrerin, die ich habe, ist sehr gut.", it: "L'insegnante che ho è molto brava.", pl: "Nauczycielka, którą mam, jest bardzo dobra.", tr: "Sahip olduğum öğretmen çok iyi.", id: "Guru perempuan yang saya punya sangat baik.", vi: "Cô giáo mà tôi có rất giỏi." }
        - level: A2
          point: { en: Tense, es: Tiempo, uk: "Час", pt: "Tempo verbal", fr: "Temps verbal", de: "Zeitform", it: "Tempo verbale", pl: "Czas", tr: "Zaman", id: "Kala", vi: "Thì" }
          rule:
            en: "the clause takes the tense it needs"
            es: "la oración lleva el tiempo que necesita"
            uk: "підрядне речення має той час, якого потребує"
            pt: "a oração leva o tempo verbal de que precisa"
            fr: "la proposition prend le temps dont elle a besoin"
            de: "der Satz steht in der Zeitform, die er braucht"
            it: "la proposizione prende il tempo di cui ha bisogno"
            pl: "zdanie przyjmuje czas, którego potrzebuje"
            tr: "cümle ihtiyaç duyduğu zamanı alır"
            id: "klausa memakai kala yang diperlukan"
            vi: "mệnh đề dùng thì mà nó cần"
          ex: ["El libro ", { target: que }, " compré ayer es muy bueno."]
          tr: { en: "The book I bought yesterday is very good.", uk: "Книжка, яку я купив учора, дуже хороша.", pt: "O livro que comprei ontem é muito bom.", fr: "Le livre que j’ai acheté hier est très bon.", de: "Das Buch, das ich gestern gekauft habe, ist sehr gut.", it: "Il libro che ho comprato ieri è molto bello.", pl: "Książka, którą kupiłem wczoraj, jest bardzo dobra.", tr: "Dün aldığım kitap çok iyi.", id: "Buku yang saya beli kemarin sangat bagus.", vi: "Cuốn sách tôi mua hôm qua rất hay." }
        - level: B1
          point: { en: People, es: Personas, uk: "Люди", pt: "Pessoas", fr: "Personnes", de: "Personen", it: "Persone", pl: "Osoby", tr: "Kişiler", id: "Orang", vi: "Người" }
          rule:
            en: ["after a preposition, ", { term: quien }, " for people"]
            es: ["detrás de una preposición, ", { term: quien }, " para personas"]
            uk: ["після прийменника про людей — ", { term: "quien" }]
            pt: ["depois de uma preposição, ", { term: quien }, " para pessoas"]
            fr: ["après une préposition, ", { term: quien }, " pour les personnes"]
            de: ["nach einer Präposition ", { term: quien }, " für Personen"]
            it: ["dopo una preposizione, ", { term: quien }, " per le persone"]
            pl: ["po przyimku ", { term: quien }, " dla osób"]
            tr: ["edattan sonra kişiler için ", { term: quien }]
            id: ["setelah kata depan, ", { term: quien }, " untuk orang"]
            vi: ["sau giới từ, ", { term: quien }, " cho người"]
          ex: ["El chico ", { target: con quien }, " trabajo es de Chile."]
          tr: { en: "The boy I work with is from Chile.", uk: "Хлопець, з яким я працюю, з Чилі.", pt: "O rapaz com quem trabalho é do Chile.", fr: "Le garçon avec qui je travaille est chilien.", de: "Der Junge, mit dem ich arbeite, kommt aus Chile.", it: "Il ragazzo con cui lavoro è del Cile.", pl: "Chłopak, z którym pracuję, jest z Chile.", tr: "Birlikte çalıştığım çocuk Şilili.", id: "Anak laki-laki yang bekerja dengan saya berasal dari Chili.", vi: "Chàng trai mà tôi làm việc cùng đến từ Chile." }
        - level: B1
          point: { en: Places, es: Lugares, uk: "Місця", pt: "Lugares", fr: "Lieux", de: "Orte", it: "Luoghi", pl: "Miejsca", tr: "Yerler", id: "Tempat", vi: "Nơi chốn" }
          rule:
            en: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": pointing to a place"]
            es: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": para señalar un lugar"]
            uk: [{ pattern: [{ alternatives: ["aquí", "allí"] }, "es donde"] }, ": щоб указати на місце"]
            pt: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": para indicar um lugar"]
            fr: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, " : pour désigner un lieu"]
            de: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": um einen Ort zu bezeichnen"]
            it: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": per indicare un luogo"]
            pl: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": aby wskazać miejsce"]
            tr: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": bir yeri göstermek için"]
            id: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": untuk menunjuk sebuah tempat"]
            vi: [{ pattern: [{ alternatives: [aquí, allí] }, es donde] }, ": để chỉ một nơi chốn"]
          ex: ["Allí es ", { target: donde }, " vivo."]
          tr: { en: "That's where I live.", uk: "Саме там я живу.", pt: "É lá que eu moro.", fr: "C’est là que j’habite.", de: "Dort wohne ich.", it: "È lì che abito.", pl: "To tam mieszkam.", tr: "Yaşadığım yer orası.", id: "Di sanalah saya tinggal.", vi: "Đó là nơi tôi sống." }
        - level: B2
          point: { es: Explicativa }
          rule:
            es: "entre comas, añade un dato y lleva indicativo"
          ex: ["Esa chica, ", { target: que }, " es mi vecina, es muy simpática."]
        - level: B2
          point: { es: Modo }
          rule:
            es: "antecedente conocido, indicativo; desconocido o inexistente, subjuntivo"
          ex: ["Busco un libro ", { target: que sea }, " divertido."]
        - level: C1
          point: { es: Posesión }
          rule:
            es: [{ term: cuyo }, " concuerda con lo poseído"]
          ex: ["La chica ", { target: cuyos }, " padres viven en mi calle es argentina."]
        - level: C1
          point: { es: Toda la oración }
          rule:
            es: [{ term: lo cual }, " resume lo dicho antes"]
          ex: ["Me dijo que no, ", { target: lo cual }, " no me gustó nada."]
        - level: C2
          point: { es: Énfasis }
          rule:
            es: [{ term: que }, " enfático detrás del nombre ponderado"]
          ex: ["¡Vaya cara ", { target: que }, " tiene!"]
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: que }, " never drops"]
            es: [{ term: que }, " nunca se omite"]
            uk: [{ term: "que" }, " ніколи не пропускається"]
            pt: [{ term: que }, " nunca é omitido"]
            fr: [{ term: que }, " ne s’omet jamais"]
            de: [{ term: que }, " entfällt nie"]
            it: [{ term: que }, " non si omette mai"]
            pl: [{ term: que }, " nigdy nie jest pomijane"]
            tr: [{ term: que }, " asla düşmez"]
            id: [{ term: que }, " tidak pernah dihilangkan"]
            vi: [{ term: que }, " không bao giờ được bỏ"]
          ex: ["El libro ", { target: que }, " leo es interesante."]
          tr: { en: "The book I'm reading is interesting.", uk: "Книжка, яку я читаю, цікава.", pt: "O livro que leio é interessante.", fr: "Le livre que je lis est intéressant.", de: "Das Buch, das ich lese, ist interessant.", it: "Il libro che leggo è interessante.", pl: "Książka, którą czytam, jest ciekawa.", tr: "Okuduğum kitap ilginç.", id: "Buku yang saya baca itu menarik.", vi: "Cuốn sách tôi đọc rất thú vị." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["right after a noun, people take ", { term: que }, ", not ", { term: quien }]
            es: ["justo detrás de un sustantivo, las personas llevan ", { term: que }, ", no ", { term: quien }]
            uk: ["одразу після іменника про людей кажуть ", { term: "que" }, ", а не ", { term: "quien" }]
            pt: ["logo depois de um substantivo, as pessoas levam ", { term: que }, ", não ", { term: quien }]
            fr: ["juste après un nom, les personnes se disent avec ", { term: que }, ", non ", { term: quien }]
            de: ["direkt nach einem Nomen steht bei Personen ", { term: que }, ", nicht ", { term: quien }]
            it: ["subito dopo un sostantivo, le persone vogliono ", { term: que }, ", non ", { term: quien }]
            pl: ["tuż po rzeczowniku osoby wymagają ", { term: que }, ", a nie ", { term: quien }]
            tr: ["bir isimden hemen sonra kişiler için ", { term: que }, " kullanılır, ", { term: quien }, " değil"]
            id: ["tepat setelah kata benda, orang memakai ", { term: que }, ", bukan ", { term: quien }]
            vi: ["ngay sau danh từ, người dùng ", { term: que }, ", không phải ", { term: quien }]
          ex: ["El médico ", { target: que }, " vino ayer es muy simpático."]
          tr: { en: "The doctor who came yesterday is very nice.", uk: "Лікар, який приходив учора, дуже приємний.", pt: "O médico que veio ontem é muito simpático.", fr: "Le médecin qui est venu hier est très sympathique.", de: "Der Arzt, der gestern gekommen ist, ist sehr nett.", it: "Il medico che è venuto ieri è molto simpatico.", pl: "Lekarz, który przyszedł wczoraj, jest bardzo miły.", tr: "Dün gelen doktor çok sevimli.", id: "Dokter yang datang kemarin sangat ramah.", vi: "Bác sĩ đến hôm qua rất dễ mến." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A relative clause describes a noun and comes right after it."
              es: "Una oración de relativo describe un sustantivo y va justo detrás de él."
              uk: "Означальне підрядне речення описує іменник і стоїть одразу після нього."
              pt: "Uma oração relativa descreve um substantivo e vem logo depois dele."
              fr: "Une proposition relative décrit un nom et se place juste après lui."
              de: "Ein Relativsatz beschreibt ein Nomen und steht direkt hinter ihm."
              it: "Una proposizione relativa descrive un sostantivo e sta subito dopo di esso."
              pl: "Zdanie względne opisuje rzeczownik i stoi tuż po nim."
              tr: "İlgi cümlesi bir ismi tanımlar ve o ismin hemen arkasında yer alır."
              id: "Klausa relatif menjelaskan kata benda dan berada tepat setelahnya."
              vi: "Mệnh đề quan hệ mô tả một danh từ và đứng ngay sau nó."
          - type: rule
            level: A1
            text:
              en: [{ term: que }, " serves for people and things, and never changes:"]
              es: [{ term: que }, " sirve para personas y cosas, y no cambia nunca:"]
              uk: [{ term: "que" }, " вживають і для людей, і для речей, і воно ніколи не змінюється:"]
              pt: [{ term: que }, " serve para pessoas e coisas, e nunca muda:"]
              fr: [{ term: que }, " sert pour les personnes et les choses, et ne change jamais :"]
              de: [{ term: que }, " steht für Personen und Dinge und ändert sich nie:"]
              it: [{ term: que }, " vale per persone e cose, e non cambia mai:"]
              pl: [{ term: que }, " służy do osób i rzeczy i nigdy się nie zmienia:"]
              tr: [{ term: que }, " hem kişiler hem şeyler için kullanılır ve hiç değişmez:"]
              id: [{ term: que }, " dipakai untuk orang dan benda, dan tidak pernah berubah:"]
              vi: [{ term: que }, " dùng cho người và vật, và không bao giờ thay đổi:"]
            ex: { examples: [["la amiga ", { target: que }, " viene conmigo"], ["un libro ", { target: que }, " lees"]] }
            tr: { en: { examples: ["the friend who's coming with me", "a book you're reading"] }, uk: { examples: ["подруга, яка йде зі мною", "книжка, яку ти читаєш"] }, pt: { examples: ["a amiga que vem comigo", "um livro que você está lendo"] }, fr: { examples: ["l’amie qui vient avec moi", "un livre que tu lis"] }, de: { examples: ["die Freundin, die mit mir kommt", "ein Buch, das du liest"] }, it: { examples: ["l'amica che viene con me", "un libro che leggi"] }, pl: { examples: ["przyjaciółka, która idzie ze mną", "książka, którą czytasz"] }, tr: { examples: ["benimle gelen arkadaş", "okuduğun bir kitap"] }, id: { examples: ["teman perempuan yang datang bersama saya", "buku yang kamu baca"] }, vi: { examples: ["người bạn đi cùng tôi", "cuốn sách bạn đọc"] } }
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["English can leave out ", { l1: that }, "; Spanish always says ", { term: que }, "."]
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["Українське ", { l1: "який" }, " змінюється за родом, числом і відмінком: ", { l1: "який, яка, яке, які, якого" }, "; ", { term: que }, " не змінюється ніколи."]

