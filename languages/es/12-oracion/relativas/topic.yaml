            use: { es: "Yuxtapuesta: la relativa abre una oración nueva", en: "Juxtaposed: the relative clause opens a new sentence", uk: "Приєднана окремо: означальне речення відкриває нове речення", pt: "Justaposta: a relativa abre uma oração nova", fr: "Juxtaposée : la relative ouvre une nouvelle phrase", de: "Angefügt: Der Relativsatz eröffnet einen neuen Satz", it: "Giustapposta: la relativa apre una nuova frase", pl: "Zestawiona: zdanie względne otwiera nowe zdanie", tr: "Yan yana: ilgi cümlesi yeni bir cümle başlatır", id: "Disandingkan: klausa relatif membuka kalimat baru", vi: "Đặt cạnh nhau: mệnh đề quan hệ mở đầu một câu mới" }
            ex: ["Llamó Ana. ", { target: A la cual }, ", por cierto, le debes una respuesta."]
            tr: { en: "Ana called. By the way, you owe her a reply.", uk: "Телефонувала Ана. До речі, ти винен їй відповідь.", pt: "Ana ligou. A propósito, você deve uma resposta a ela.", fr: "Ana a appelé. À propos, tu lui dois une réponse.", de: "Ana hat angerufen. Übrigens schuldest du ihr eine Antwort.", it: "Ha chiamato Ana. A proposito, le devi una risposta.", pl: "Dzwoniła Ana. Przy okazji, jesteś jej winien odpowiedź.", tr: "Ana aradı. Bu arada, ona bir cevap borçlusun.", id: "Ana menelepon. Omong-omong, kamu berutang jawaban kepadanya.", vi: "Ana đã gọi. Nhân tiện, bạn nợ cô ấy một câu trả lời." }
          - level: C1
            use: { es: "Encadenadas: una relativa sigue a otra sin coma", en: "Chained: one relative clause follows another with no comma", uk: "Ланцюжок: одне означальне речення йде за іншим без коми", pt: "Encadeadas: uma relativa segue outra sem vírgula", fr: "Enchaînées : une relative suit une autre sans virgule", de: "Verkettet: Ein Relativsatz folgt ohne Komma auf einen anderen", it: "A catena: una relativa segue un'altra senza virgola", pl: "Łańcuch: jedno zdanie względne następuje po drugim bez przecinka", tr: "Zincirleme: bir ilgi cümlesi ötekini virgülsüz izler", id: "Berantai: satu klausa relatif mengikuti yang lain tanpa koma", vi: "Nối tiếp: một mệnh đề quan hệ theo sau mệnh đề khác không có dấu phẩy" }
            ex: ["Recuerdo la fiesta ", { target: en la que }, " nos conocimos ", { target: que }, " organizaron los estudiantes."]
            tr: { en: "I remember the party where we met that the students organised.", uk: "Пригадую вечірку, на якій ми познайомилися, яку організували студенти.", pt: "Lembro da festa em que nos conhecemos que os estudantes organizaram.", fr: "Je me souviens de la fête où nous nous sommes rencontrés que les étudiants avaient organisée.", de: "Ich erinnere mich an die Party, auf der wir uns kennengelernt haben und die die Studenten organisiert haben.", it: "Ricordo la festa in cui ci siamo conosciuti che hanno organizzato gli studenti.", pl: "Pamiętam imprezę, na której się poznaliśmy, którą zorganizowali studenci.", tr: "Öğrencilerin düzenlediği, tanıştığımız partiyi hatırlıyorum.", id: "Saya ingat pesta tempat kami bertemu yang diadakan oleh para mahasiswa.", vi: "Tôi nhớ bữa tiệc nơi chúng ta quen nhau, bữa tiệc mà các sinh viên đã tổ chức." }
          - level: C1
            use: { es: "Discontinua: el relativo depende del verbo de la segunda oración", en: "Discontinuous: the relative depends on the verb of the second clause", uk: "Розірвана: відносне слово залежить від дієслова другого речення", pt: "Descontínua: o relativo depende do verbo da segunda oração", fr: "Discontinue : le relatif dépend du verbe de la seconde proposition", de: "Unterbrochen: Das Relativwort hängt vom Verb des zweiten Satzes ab", it: "Discontinua: il relativo dipende dal verbo della seconda frase", pl: "Nieciągła: zaimek względny zależy od czasownika drugiego zdania", tr: "Kesintili: ilgi sözcüğü ikinci cümlenin fiiline bağlıdır", id: "Terputus: kata relatif bergantung pada kata kerja klausa kedua", vi: "Gián đoạn: từ quan hệ phụ thuộc vào động từ của mệnh đề thứ hai" }
            ex: ["Este es el informe ", { target: que }, " creo que nos pidió el jefe."]
            tr: { en: "This is the report that I think the boss asked us for.", uk: "Це звіт, який, здається, у нас просив начальник.", pt: "Este é o relatório que acho que o chefe nos pediu.", fr: "Voici le rapport que je crois que le chef nous a demandé.", de: "Das ist der Bericht, von dem ich glaube, dass der Chef ihn von uns verlangt hat.", it: "Questo è il rapporto che credo ci abbia chiesto il capo.", pl: "To jest raport, o który, jak sądzę, prosił nas szef.", tr: "Bu, sanırım patronun bizden istediği rapor.", id: "Ini laporan yang menurut saya diminta oleh atasan kepada kami.", vi: "Đây là bản báo cáo mà tôi nghĩ sếp đã yêu cầu chúng tôi." }
          - level: C1
            use: { es: "En el segundo término de una comparación", en: "In the second term of a comparison", uk: "У другій частині порівняння", pt: "No segundo termo de uma comparação", fr: "Dans le second terme d’une comparaison", de: "Im zweiten Glied eines Vergleichs", it: "Nel secondo termine di un paragone", pl: "W drugim członie porównania", tr: "Karşılaştırmanın ikinci ögesinde", id: "Pada unsur kedua suatu perbandingan", vi: "Ở vế thứ hai của một phép so sánh" }
            ex: { examples: [["Me he molestado por él más de ", { target: lo que }, " merecía."], ["Es más de ", { target: lo que }, " esperaba."]] }
            tr: { en: { examples: ["I've gone to more trouble for him than he deserved.", "It's more than I expected."] }, uk: { examples: ["Я клопотався через нього більше, ніж він заслуговував.", "Це більше, ніж я очікував."] }, pt: { examples: ["Eu me incomodei por ele mais do que ele merecia.", "É mais do que eu esperava."] }, fr: { examples: ["Je me suis donné du mal pour lui plus qu’il ne le méritait.", "C’est plus que ce que j’attendais."] }, de: { examples: ["Ich habe mir seinetwegen mehr Mühe gemacht, als er verdient hat.", "Es ist mehr, als ich erwartet hatte."] }, it: { examples: ["Mi sono dato da fare per lui più di quanto meritasse.", "È più di quanto mi aspettassi."] }, pl: { examples: ["Zadałem sobie dla niego więcej trudu, niż na to zasłużył.", "To więcej, niż się spodziewałem."] }, tr: { examples: ["Onun için hak ettiğinden fazla zahmete girdim.", "Beklediğimden fazla."] }, id: { examples: ["Saya sudah repot untuknya lebih dari yang pantas dia dapatkan.", "Ini lebih dari yang saya harapkan."] }, vi: { examples: ["Tôi đã bận tâm vì anh ấy nhiều hơn mức anh ấy xứng đáng.", "Nó nhiều hơn tôi mong đợi."] } }
          - level: C1
            use: { es: "El relativo se omite en la segunda oración coordinada", en: "The relative is left out in the second coordinated clause", uk: "У другому сурядному реченні відносне слово опускається", pt: "O relativo se omite na segunda oração coordenada", fr: "Le relatif est omis dans la seconde proposition coordonnée", de: "Das Relativwort entfällt im zweiten koordinierten Satz", it: "Il relativo si omette nella seconda frase coordinata", pl: "W drugim zdaniu współrzędnym zaimek względny się pomija", tr: "İkinci eş değerli cümlede ilgi sözcüğü düşer", id: "Kata relatif dihilangkan pada klausa koordinatif kedua", vi: "Từ quan hệ được lược bỏ ở mệnh đề đẳng lập thứ hai" }
            ex: ["Esa es la calle ", { target: donde }, " trabajo yo y vive mi hermana."]
            tr: { en: "That is the street where I work and my sister lives.", uk: "Це вулиця, де я працюю і живе моя сестра.", pt: "Essa é a rua onde eu trabalho e minha irmã mora.", fr: "C’est la rue où je travaille et où habite ma sœur.", de: "Das ist die Straße, wo ich arbeite und meine Schwester wohnt.", it: "Quella è la strada dove lavoro io e abita mia sorella.", pl: "To ulica, na której pracuję ja i mieszka moja siostra.", tr: "Bu, benim çalıştığım ve kız kardeşimin yaşadığı sokak.", id: "Itu jalan tempat saya bekerja dan saudara perempuan saya tinggal.", vi: "Đây là con phố nơi tôi làm việc và chị gái tôi sống." }
          - level: C2
            use: { es: "Un sustantivo resume lo anterior y lleva la relativa", en: "A noun sums up what came before and carries the relative clause", uk: "Іменник підсумовує сказане раніше і має при собі означальне речення", pt: "Um substantivo resume o anterior e leva a relativa", fr: "Un nom reprend ce qui précède et porte la relative", de: "Ein Nomen fasst das Vorige zusammen und trägt den Relativsatz", it: "Un sostantivo riassume quanto precede e regge la relativa", pl: "Rzeczownik podsumowuje wcześniejszą treść i niesie zdanie względne", tr: "Bir isim önceki içeriği özetler ve ilgi cümlesini taşır", id: "Sebuah kata benda merangkum hal sebelumnya dan memuat klausa relatif", vi: "Một danh từ tóm tắt điều trước đó và mang mệnh đề quan hệ" }
            ex: ["Hablamos de la crisis. Asunto ", { target: que }, " no nos afecta."]
            tr: { en: "We talked about the crisis. A matter that doesn't affect us.", uk: "Ми говорили про кризу. Питання, яке нас не стосується.", pt: "Falamos da crise. Assunto que não nos afeta.", fr: "Nous avons parlé de la crise. Sujet qui ne nous concerne pas.", de: "Wir sprachen über die Krise. Ein Thema, das uns nicht betrifft.", it: "Abbiamo parlato della crisi. Argomento che non ci riguarda.", pl: "Rozmawialiśmy o kryzysie. Sprawa, która nas nie dotyczy.", tr: "Krizden söz ettik. Bizi ilgilendirmeyen bir konu.", id: "Kami membahas krisis itu. Masalah yang tidak memengaruhi kami.", vi: "Chúng tôi nói về cuộc khủng hoảng. Một vấn đề không ảnh hưởng đến chúng tôi." }
          - level: C2
            use: { es: [{ term: Hecho lo cual }, " y ", { term: hecho esto }, " retoman lo ya dicho"], en: [{ term: Hecho lo cual }, " and ", { term: hecho esto }, " pick up what was already said"], uk: [{ term: Hecho lo cual }, " і ", { term: hecho esto }, " повертаються до сказаного"], pt: [{ term: Hecho lo cual }, " e ", { term: hecho esto }, " retomam o que já foi dito"], fr: [{ term: Hecho lo cual }, " et ", { term: hecho esto }, " reprennent ce qui a déjà été dit"], de: [{ term: Hecho lo cual }, " und ", { term: hecho esto }, " greifen das schon Gesagte wieder auf"], it: [{ term: Hecho lo cual }, " e ", { term: hecho esto }, " riprendono quanto già detto"], pl: [{ term: Hecho lo cual }, " i ", { term: hecho esto }, " wracają do tego, co już powiedziano"], tr: [{ term: Hecho lo cual }, " ve ", { term: hecho esto }, " daha önce söylenene geri döner"], id: [{ term: Hecho lo cual }, " dan ", { term: hecho esto }, " mengambil kembali hal yang sudah dikatakan"], vi: [{ term: Hecho lo cual }, " và ", { term: hecho esto }, " nhắc lại điều đã nói"] }
            ex: ["Terminamos el informe. ", { target: Hecho lo cual }, ", nos fuimos a casa."]
            tr: { en: "We finished the report. That done, we went home.", uk: "Ми закінчили звіт. Після цього ми пішли додому.", pt: "Terminamos o relatório. Feito isso, fomos para casa.", fr: "Nous avons terminé le rapport. Cela fait, nous sommes rentrés chez nous.", de: "Wir haben den Bericht beendet. Danach gingen wir nach Hause.", it: "Abbiamo finito la relazione. Fatto ciò, siamo andati a casa.", pl: "Skończyliśmy raport. Po czym poszliśmy do domu.", tr: "Raporu bitirdik. Bunun ardından eve gittik.", id: "Kami menyelesaikan laporan itu. Setelah itu, kami pulang.", vi: "Chúng tôi đã hoàn thành báo cáo. Xong việc đó, chúng tôi về nhà." }

  - title: { es: Relativas enfáticas e inespecíficas, en: "Emphatic and non-specific relatives", uk: "Підсилювальні й неозначені відносні конструкції", pt: "Relativas enfáticas e inespecíficas", fr: "Relatives emphatiques et non spécifiques", de: "Emphatische und unspezifische Relativsätze", it: "Relative enfatiche e non specifiche", pl: "Zdania względne wzmacniające i nieokreślone", tr: "Vurgulayıcı ve belirsiz ilgi yapıları", id: "Klausa relatif emfatik dan tidak spesifik", vi: "Mệnh đề quan hệ nhấn mạnh và không xác định" }
