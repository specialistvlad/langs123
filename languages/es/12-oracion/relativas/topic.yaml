            ind: { ex: ["Conozco a alguien ", { target: que habla }, " así."], tr: { en: "I know someone who speaks like that.", uk: "Я знаю когось, хто так говорить.", pt: "Conheço alguém que fala assim.", fr: "Je connais quelqu’un qui parle ainsi.", de: "Ich kenne jemanden, der so spricht.", it: "Conosco qualcuno che parla così.", pl: "Znam kogoś, kto tak mówi.", tr: "Böyle konuşan birini tanıyorum.", id: "Saya kenal seseorang yang berbicara seperti itu.", vi: "Tôi biết một người nói như vậy." } }
            sbjv: { ex: ["No conozco a nadie ", { target: que hable }, " así."], tr: { en: "I don't know anyone who speaks like that.", uk: "Я не знаю нікого, хто так говорить.", pt: "Não conheço ninguém que fale assim.", fr: "Je ne connais personne qui parle ainsi.", de: "Ich kenne niemanden, der so spricht.", it: "Non conosco nessuno che parli così.", pl: "Nie znam nikogo, kto tak mówi.", tr: "Böyle konuşan kimseyi tanımıyorum.", id: "Saya tidak kenal siapa pun yang berbicara seperti itu.", vi: "Tôi không biết ai nói như vậy." } }
          - level: B2
