sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A relative clause describes a noun and comes right after it."
              es: "Una oración de relativo describe un sustantivo y va justo detrás de él."
              uk: "Означальне підрядне речення описує іменник і стоїть одразу після нього."
              pt: "Uma oração relativa descreve um substantivo e vem logo depois dele."
              fr: "Une proposition relative décrit un nom et se place juste après lui."
              de: "Ein Relativsatz beschreibt ein Nomen und steht direkt hinter ihm."
              it: "Una proposizione relativa descrive un sostantivo e sta subito dopo di esso."
              pl: "Zdanie względne opisuje rzeczownik i stoi tuż po nim."
              tr: "İlgi cümlesi bir ismi tanımlar ve o ismin hemen arkasında yer alır."
              id: "Klausa relatif menjelaskan kata benda dan berada tepat setelahnya."
              vi: "Mệnh đề quan hệ mô tả một danh từ và đứng ngay sau nó."
          - type: rule
            level: A1
            text:
              en: [{ term: que }, " serves for people and things, and never changes:"]
              es: [{ term: que }, " sirve para personas y cosas, y no cambia nunca:"]
              uk: [{ term: "que" }, " вживають і для людей, і для речей, і воно ніколи не змінюється:"]
              pt: [{ term: que }, " serve para pessoas e coisas, e nunca muda:"]
              fr: [{ term: que }, " sert pour les personnes et les choses, et ne change jamais :"]
              de: [{ term: que }, " steht für Personen und Dinge und ändert sich nie:"]
              it: [{ term: que }, " vale per persone e cose, e non cambia mai:"]
              pl: [{ term: que }, " służy do osób i rzeczy i nigdy się nie zmienia:"]
              tr: [{ term: que }, " hem kişiler hem şeyler için kullanılır ve hiç değişmez:"]
              id: [{ term: que }, " dipakai untuk orang dan benda, dan tidak pernah berubah:"]
              vi: [{ term: que }, " dùng cho người và vật, và không bao giờ thay đổi:"]
            ex: { examples: [["la amiga ", { target: que }, " viene conmigo"], ["un libro ", { target: que }, " lees"]] }
            tr: { en: { examples: ["the friend who's coming with me", "a book you're reading"] }, uk: { examples: ["подруга, яка йде зі мною", "книжка, яку ти читаєш"] }, pt: { examples: ["a amiga que vem comigo", "um livro que você está lendo"] }, fr: { examples: ["l’amie qui vient avec moi", "un livre que tu lis"] }, de: { examples: ["die Freundin, die mit mir kommt", "ein Buch, das du liest"] }, it: { examples: ["l'amica che viene con me", "un libro che leggi"] }, pl: { examples: ["przyjaciółka, która idzie ze mną", "książka, którą czytasz"] }, tr: { examples: ["benimle gelen arkadaş", "okuduğun bir kitap"] }, id: { examples: ["teman perempuan yang datang bersama saya", "buku yang kamu baca"] }, vi: { examples: ["người bạn đi cùng tôi", "cuốn sách bạn đọc"] } }
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["English can leave out ", { l1: that }, "; Spanish always says ", { term: que }, "."]
