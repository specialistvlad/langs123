          - level: B2
            use: { es: "Coordinada con un adjetivo", en: "Coordinated with an adjective", uk: "Сурядно з прикметником", pt: "Coordenada com um adjetivo", fr: "Coordonnée à un adjectif", de: "Mit einem Adjektiv koordiniert", it: "Coordinata a un aggettivo", pl: "Współrzędna z przymiotnikiem", tr: "Bir sıfatla eş değerli bağlanmış", id: "Dikoordinasikan dengan kata sifat", vi: "Đẳng lập với một tính từ" }
