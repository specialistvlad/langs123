title: { es: "Las oraciones causales: porque, ya que, puesto que", en: "Causal Clauses: porque, ya que, puesto que", uk: "Причинові речення: porque, ya que, puesto que", pt: "As orações causais: porque, ya que, puesto que", fr: "Les propositions causales : porque, ya que, puesto que", de: "Die Kausalsätze: porque, ya que, puesto que", it: "Le proposizioni causali: porque, ya que, puesto que", pl: "Zdania przyczynowe: porque, ya que, puesto que", tr: "Neden cümleleri: porque, ya que, puesto que", id: "Klausa sebab: porque, ya que, puesto que", vi: "Mệnh đề nguyên nhân: porque, ya que, puesto que" }
summary:
  lead:
    es: ["Las oraciones causales dan la razón de un hecho o de lo que se dice con ", { term: porque }, ", ", { term: ya que }, ", ", { term: puesto que }, " y ", { term: debido a que }, "."]
    en: ["Causal clauses give the reason for a fact or for what is said with ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " and ", { term: "debido a que" }, "."]
    uk: ["Причинові речення називають причину факту або сказаного за допомогою ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " та ", { term: "debido a que" }, "."]
    pt: ["As orações causais dão a razão de um fato ou do que se diz com ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " e ", { term: "debido a que" }, "."]
    fr: ["Les propositions causales donnent la raison d’un fait ou de ce qu’on dit avec ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " et ", { term: "debido a que" }, "."]
    de: ["Kausalsätze nennen den Grund für eine Tatsache oder für das Gesagte mit ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " und ", { term: "debido a que" }, "."]
    it: ["Le proposizioni causali danno la ragione di un fatto o di ciò che si dice con ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " e ", { term: "debido a que" }, "."]
    pl: ["Zdania przyczynowe podają powód faktu albo tego, co się mówi, za pomocą ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " i ", { term: "debido a que" }, "."]
    tr: ["Neden cümleleri, bir olgunun ya da söylenenin nedenini ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, " ve ", { term: "debido a que" }, " ile bildirir."]
    id: ["Klausa sebab memberi alasan bagi suatu fakta atau bagi apa yang dikatakan dengan ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, ", dan ", { term: "debido a que" }, "."]
    vi: ["Mệnh đề nguyên nhân nêu lý do của sự việc hoặc lời nói: ", { term: "porque" }, ", ", { term: "ya que" }, ", ", { term: "puesto que" }, ", ", { term: "debido a que" }, "."]
  rule:
    es: ["La causa afirmada lleva indicativo, y ", { term: ya que }, " y ", { term: puesto que }, " la colocan delante o detrás:"]
    en: ["An asserted reason takes the indicative, and ", { term: "ya que" }, " and ", { term: "puesto que" }, " put it before or after the main clause:"]
    uk: ["Причина, подана як факт, вимагає дійсного способу, а ", { term: "ya que" }, " і ", { term: "puesto que" }, " ставлять її перед головним реченням або після нього:"]
    pt: ["A causa afirmada leva indicativo, e ", { term: "ya que" }, " e ", { term: "puesto que" }, " a colocam antes ou depois da oração principal:"]
    fr: ["La cause affirmée prend l’indicatif, et ", { term: "ya que" }, " et ", { term: "puesto que" }, " la placent avant ou après la proposition principale :"]
    de: ["Ein behaupteter Grund steht im Indikativ, und mit ", { term: "ya que" }, " und ", { term: "puesto que" }, " steht er vor oder nach dem Hauptsatz:"]
    it: ["La causa affermata vuole l'indicativo; ", { term: "ya que" }, " e ", { term: "puesto que" }, " la pongono prima o dopo la principale:"]
    pl: ["Przyczyna przedstawiona jako fakt wymaga trybu oznajmującego, a ", { term: "ya que" }, " i ", { term: "puesto que" }, " umieszczają ją przed zdaniem głównym lub po nim:"]
    tr: ["Olgu olarak bildirilen neden haber kipiyle kullanılır; ", { term: "ya que" }, " ve ", { term: "puesto que" }, " nedeni ana cümlenin önüne ya da arkasına yerleştirir:"]
    id: ["Alasan yang dinyatakan sebagai fakta memakai indikatif, dan ", { term: "ya que" }, " serta ", { term: "puesto que" }, " menempatkannya sebelum atau sesudah klausa utama:"]
    vi: ["Nguyên nhân được khẳng định đi với thức chỉ định; ", { term: "ya que" }, " và ", { term: "puesto que" }, " đặt trước hoặc sau mệnh đề chính:"]
  ex: [{ target: Ya que }, " vas al centro, compra pan."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: "Detrás de la principal", en: "After the main clause", uk: "Після головного речення", pt: "Depois da oração principal", fr: "Après la proposition principale", de: "Nach dem Hauptsatz", it: "Dopo la frase principale", pl: "Po zdaniu głównym", tr: "Ana cümlenin arkasında", id: "Setelah klausa utama", vi: "Sau mệnh đề chính" }
          rule: { es: [{ term: porque }, " y ", { term: debido a que }, " van detrás de la oración principal"], en: [{ term: "porque" }, " and ", { term: "debido a que" }, " come after the main clause"], uk: [{ term: "porque" }, " та ", { term: "debido a que" }, " стоять після головного речення"], pt: [{ term: "porque" }, " e ", { term: "debido a que" }, " vêm depois da oração principal"], fr: [{ term: "porque" }, " et ", { term: "debido a que" }, " se placent après la proposition principale"], de: [{ term: "porque" }, " und ", { term: "debido a que" }, " stehen nach dem Hauptsatz"], it: [{ term: "porque" }, " e ", { term: "debido a que" }, " stanno dopo la frase principale"], pl: [{ term: "porque" }, " i ", { term: "debido a que" }, " stoją po zdaniu głównym"], tr: [{ term: "porque" }, " ve ", { term: "debido a que" }, " ana cümlenin arkasına gelir"], id: [{ term: "porque" }, " dan ", { term: "debido a que" }, " berada setelah klausa utama"], vi: [{ term: "porque" }, " và ", { term: "debido a que" }, " đứng sau mệnh đề chính"] }
          ex: ["Salgo temprano ", { target: porque }, " mañana tengo examen."]
          tr: { en: "I'm leaving early because I have an exam tomorrow.", uk: "Я виходжу рано, бо завтра в мене іспит.", pt: "Saio cedo porque amanhã tenho prova.", fr: "Je pars tôt parce que j’ai un examen demain.", de: "Ich gehe früh los, weil ich morgen eine Prüfung habe.", it: "Esco presto perché domani ho un esame.", pl: "Wychodzę wcześnie, bo jutro mam egzamin.", tr: "Yarın sınavım olduğu için erken çıkıyorum.", id: "Saya berangkat lebih awal karena besok ada ujian.", vi: "Tôi đi sớm vì ngày mai tôi có bài kiểm tra." }
        - level: B2
          point: { es: "Delante o detrás", en: "Before or after", uk: "Перед чи після", pt: "Antes ou depois", fr: "Avant ou après", de: "Davor oder danach", it: "Prima o dopo", pl: "Przed lub po", tr: "Önde ya da arkada", id: "Sebelum atau sesudah", vi: "Trước hoặc sau" }
          rule: { es: [{ term: ya que }, " y ", { term: puesto que }, " presentan un hecho conocido"], en: [{ term: "ya que" }, " and ", { term: "puesto que" }, " present a known fact"], uk: [{ term: "ya que" }, " і ", { term: "puesto que" }, " подають відомий факт"], pt: [{ term: "ya que" }, " e ", { term: "puesto que" }, " apresentam um fato conhecido"], fr: [{ term: "ya que" }, " et ", { term: "puesto que" }, " présentent un fait connu"], de: [{ term: "ya que" }, " und ", { term: "puesto que" }, " stellen eine bekannte Tatsache dar"], it: [{ term: "ya que" }, " e ", { term: "puesto que" }, " presentano un fatto noto"], pl: [{ term: "ya que" }, " i ", { term: "puesto que" }, " przedstawiają znany fakt"], tr: [{ term: "ya que" }, " ve ", { term: "puesto que" }, " bilinen bir olguyu sunar"], id: [{ term: "ya que" }, " dan ", { term: "puesto que" }, " menyajikan fakta yang sudah diketahui"], vi: [{ term: "ya que" }, " và ", { term: "puesto que" }, " nêu một sự việc đã biết"] }
          ex: [{ target: Puesto que }, " nadie protestó, se aprobó el plan."]
          tr: { en: "Given that nobody objected, the plan was approved.", uk: "Зважаючи на те, що ніхто не заперечував, план затвердили.", pt: "Visto que ninguém protestou, o plano foi aprovado.", fr: "Étant donné que personne n’a protesté, le plan a été approuvé.", de: "Da niemand protestierte, wurde der Plan angenommen.", it: "Poiché nessuno ha protestato, il piano è stato approvato.", pl: "Ponieważ nikt nie zaprotestował, plan zatwierdzono.", tr: "Kimse itiraz etmediği için plan onaylandı.", id: "Mengingat tidak ada yang memprotes, rencana itu disetujui.", vi: "Do không ai phản đối nên kế hoạch được thông qua." }
        - level: B2
          point: { es: "Dos causas", en: "Two kinds of reason", uk: "Два види причини", pt: "Dois tipos de causa", fr: "Deux types de cause", de: "Zwei Arten von Gründen", it: "Due tipi di causa", pl: "Dwa rodzaje przyczyny", tr: "İki tür neden", id: "Dua jenis alasan", vi: "Hai loại nguyên nhân" }
          rule: { es: "sin coma, la causa del hecho; con coma, la de lo que se dice", en: "without a comma, the reason for the fact; with a comma, the reason for what is said", uk: "без коми — причина факту, з комою — причина того, що кажуть", pt: "sem vírgula, a causa do fato; com vírgula, a causa do que se diz", fr: "sans virgule, la cause du fait ; avec une virgule, celle de ce qu’on dit", de: "ohne Komma der Grund der Tatsache, mit Komma der Grund des Gesagten", it: "senza virgola, la causa del fatto; con la virgola, quella di ciò che si dice", pl: "bez przecinka — przyczyna faktu, z przecinkiem — przyczyna tego, co się mówi", tr: "virgülsüz olursa olgunun nedeni, virgüllü olursa söylenenin nedeni", id: "tanpa koma, alasan bagi fakta; dengan koma, alasan bagi apa yang dikatakan", vi: "không có dấu phẩy: nguyên nhân của sự việc; có dấu phẩy: nguyên nhân của điều được nói" }
          ex: { examples: [["Cierro la ventana ", { target: porque }, " hace frío."], ["Cierra la ventana, ", { target: porque }, " hace frío."]] }
          tr: { en: { examples: ["I'm closing the window because it's cold.", "Close the window, because it's cold."] }, uk: { examples: ["Я зачиняю вікно, бо холодно.", "Зачини вікно, бо холодно."] }, pt: { examples: ["Fecho a janela porque está frio.", "Fecha a janela, porque está frio."] }, fr: { examples: ["Je ferme la fenêtre parce qu’il fait froid.", "Ferme la fenêtre, parce qu’il fait froid."] }, de: { examples: ["Ich schließe das Fenster, weil es kalt ist.", "Mach das Fenster zu, denn es ist kalt."] }, it: { examples: ["Chiudo la finestra perché fa freddo.", "Chiudi la finestra, perché fa freddo."] }, pl: { examples: ["Zamykam okno, bo jest zimno.", "Zamknij okno, bo jest zimno."] }, tr: { examples: ["Hava soğuk olduğu için pencereyi kapatıyorum.", "Pencereyi kapat, çünkü hava soğuk."] }, id: { examples: ["Saya menutup jendela karena dingin.", "Tutup jendelanya, karena dingin."] }, vi: { examples: ["Tôi đóng cửa sổ vì trời lạnh.", "Đóng cửa sổ lại đi, vì trời lạnh."] } }
        - level: C1
          point: { es: "Más nexos", en: "More linkers", uk: "Інші сполучники", pt: "Mais conectivos", fr: "Autres connecteurs", de: "Weitere Bindewörter", it: "Altri connettivi", pl: "Inne słowa łączące", tr: "Diğer bağlayıcılar", id: "Kata penghubung lain", vi: "Thêm từ nối" }
          rule: { es: [{ term: gracias a que }, " da una causa favorable; ", { term: por culpa de que }, ", una desfavorable"], en: [{ term: "gracias a que" }, " gives a favorable reason; ", { term: "por culpa de que" }, ", an unfavorable one"], uk: [{ term: "gracias a que" }, " дає сприятливу причину, ", { term: "por culpa de que" }, " — несприятливу"], pt: [{ term: "gracias a que" }, " dá uma causa favorável; ", { term: "por culpa de que" }, ", uma desfavorável"], fr: [{ term: "gracias a que" }, " donne une cause favorable ; ", { term: "por culpa de que" }, ", une cause défavorable"], de: [{ term: "gracias a que" }, " nennt einen günstigen Grund, ", { term: "por culpa de que" }, " einen ungünstigen"], it: [{ term: "gracias a que" }, " dà una causa favorevole; ", { term: "por culpa de que" }, ", una sfavorevole"], pl: [{ term: "gracias a que" }, " podaje przyczynę korzystną, ", { term: "por culpa de que" }, " — niekorzystną"], tr: [{ term: "gracias a que" }, " olumlu, ", { term: "por culpa de que" }, " olumsuz bir neden bildirir"], id: [{ term: "gracias a que" }, " memberi sebab yang menguntungkan; ", { term: "por culpa de que" }, ", sebab yang merugikan"], vi: [{ term: "gracias a que" }, " nêu nguyên nhân thuận lợi; ", { term: "por culpa de que" }, " nêu nguyên nhân bất lợi"] }
          ex: { examples: [[{ target: Gracias a que }, " me avisaste, llegué a tiempo."], ["Perdimos el tren ", { target: por culpa de que }, " el taxi llegó tarde."]] }
          tr: { en: { examples: ["Thanks to your warning, I arrived on time.", "We missed the train because the taxi was late."] }, uk: { examples: ["Завдяки тому, що ти мене попередив, я прийшов вчасно.", "Ми не встигли на потяг через те, що таксі приїхало пізно."] }, pt: { examples: ["Graças ao seu aviso, cheguei a tempo.", "Perdemos o trem por culpa do táxi, que chegou atrasado."] }, fr: { examples: ["Grâce à ton avertissement, je suis arrivé à temps.", "Nous avons raté le train à cause du taxi, qui est arrivé en retard."] }, de: { examples: ["Dank deines Hinweises bin ich rechtzeitig angekommen.", "Wir haben den Zug wegen des verspäteten Taxis verpasst."] }, it: { examples: ["Grazie al tuo avviso, sono arrivato in tempo.", "Abbiamo perso il treno per colpa del taxi, arrivato in ritardo."] }, pl: { examples: ["Dzięki temu, że mnie uprzedziłeś, dotarłem na czas.", "Spóźniliśmy się na pociąg przez to, że taksówka przyjechała późno."] }, tr: { examples: ["Beni uyardığın sayesinde zamanında yetiştim.", "Treni, taksinin geç gelmesi yüzünden kaçırdık."] }, id: { examples: ["Berkat peringatanmu, saya tiba tepat waktu.", "Kami ketinggalan kereta gara-gara taksinya terlambat."] }, vi: { examples: ["Nhờ bạn báo cho tôi, tôi đã đến kịp giờ.", "Chúng tôi lỡ tàu tại taxi đến muộn."] } }
        - level: C1
          point: { es: "Causa enfática", en: "Emphatic reason", uk: "Наголошена причина", pt: "Causa enfática", fr: "Cause emphatique", de: "Betonter Grund", it: "Causa enfatica", pl: "Przyczyna uwydatniona", tr: "Vurgulu neden", id: "Alasan yang ditekankan", vi: "Nguyên nhân nhấn mạnh" }
          rule: { es: [{ term: porque }, " delante de la principal destaca la causa"], en: [{ term: "porque" }, " before the main clause stresses the reason"], uk: [{ term: "porque" }, " перед головним реченням виділяє причину"], pt: [{ term: "porque" }, " antes da oração principal destaca a causa"], fr: [{ term: "porque" }, " devant la proposition principale met la cause en relief"], de: [{ term: "porque" }, " vor dem Hauptsatz hebt den Grund hervor"], it: [{ term: "porque" }, " prima della frase principale mette in risalto la causa"], pl: [{ term: "porque" }, " przed zdaniem głównym uwypukla przyczynę"], tr: ["ana cümlenin önündeki ", { term: "porque" }, " nedeni öne çıkarır"], id: [{ term: "porque" }, " di depan klausa utama menonjolkan alasan"], vi: [{ term: "porque" }, " đặt trước mệnh đề chính làm nổi bật nguyên nhân"] }
          ex: [{ target: Porque }, " habla cuatro idiomas, lo contrataron."]
          tr: { en: "It was because he speaks four languages that they hired him.", uk: "Саме тому, що він говорить чотирма мовами, його й найняли.", pt: "Foi porque ele fala quatro idiomas que o contrataram.", fr: "C’est parce qu’il parle quatre langues qu’on l’a engagé.", de: "Gerade weil er vier Sprachen spricht, haben sie ihn eingestellt.", it: "È perché parla quattro lingue che l'hanno assunto.", pl: "Właśnie dlatego, że mówi czterema językami, go zatrudnili.", tr: "Onu işe almalarının nedeni, dört dil konuşmasıdır.", id: "Justru karena dia berbicara empat bahasa, dia diterima bekerja.", vi: "Chính vì nói được bốn thứ tiếng mà anh ấy được tuyển dụng." }
        - level: C1
          point: { es: "Negación", en: "Negation", uk: "Заперечення", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuzluk", id: "Negasi", vi: "Phủ định" }
          rule: { es: ["tras ", { term: no }, ", el indicativo niega el verbo y el subjuntivo, la causa"], en: ["after ", { term: "no" }, ", the indicative negates the verb and the subjunctive negates the reason"], uk: ["після ", { term: "no" }, " дійсний спосіб заперечує дієслово, а суб’юнктив — причину"], pt: ["depois de ", { term: "no" }, ", o indicativo nega o verbo e o subjuntivo, a causa"], fr: ["après ", { term: "no" }, ", l’indicatif nie le verbe et le subjonctif nie la cause"], de: ["nach ", { term: "no" }, " verneint der Indikativ das Verb, der Konjunktiv den Grund"], it: ["dopo ", { term: "no" }, ", l'indicativo nega il verbo e il congiuntivo la causa"], pl: ["po ", { term: "no" }, " tryb oznajmujący neguje czasownik, a tryb łączący — przyczynę"], tr: [{ term: "no" }, " sonrasında haber kipi fiili, dilek kipi nedeni olumsuzlar"], id: ["setelah ", { term: "no" }, ", indikatif menegasikan verba dan subjungtif menegasikan alasan"], vi: ["sau ", { term: "no" }, ", thức chỉ định phủ định động từ còn thức giả định phủ định nguyên nhân"] }
          ex: { contrast: [["No se va porque ", { target: llueve }, "."], ["No se va porque ", { target: llueva }, ", sino porque es tarde."]] }
          tr: { en: { contrast: ["He isn't leaving, because it's raining.", "He is leaving not because it's raining, but because it's late."] }, uk: { contrast: ["Він не йде, бо надворі дощ.", "Він іде не тому, що дощ, а тому, що вже пізно."] }, pt: { contrast: ["Ele não vai embora, porque está chovendo.", "Ele vai embora não porque está chovendo, mas porque é tarde."] }, fr: { contrast: ["Il ne part pas, parce qu’il pleut.", "Il part, non pas parce qu’il pleut, mais parce qu’il est tard."] }, de: { contrast: ["Er geht nicht weg, weil es regnet.", "Er geht nicht wegen des Regens, sondern weil es spät ist."] }, it: { contrast: ["Non se ne va, perché piove.", "Se ne va non perché piove, ma perché è tardi."] }, pl: { contrast: ["Nie wychodzi, bo pada deszcz.", "Wychodzi nie dlatego, że pada deszcz, tylko dlatego, że jest późno."] }, tr: { contrast: ["Yağmur yağdığı için gitmiyor.", "Yağmur yağdığı için değil, geç olduğu için gidiyor."] }, id: { contrast: ["Dia tidak pergi, karena hujan turun.", "Dia pergi bukan karena hujan, melainkan karena sudah larut."] }, vi: { contrast: ["Anh ấy không đi, vì trời đang mưa.", "Anh ấy đi không phải vì trời mưa mà vì đã muộn."] } }
        - level: C2
          point: { es: "Lengua hablada", en: "Spoken language", uk: "Усне мовлення", pt: "Língua falada", fr: "Langue parlée", de: "Gesprochene Sprache", it: "Lingua parlata", pl: "Język mówiony", tr: "Konuşma dili", id: "Bahasa lisan", vi: "Khẩu ngữ" }
          rule: { es: [{ term: que }, " da la causa detrás de una coma, en registro coloquial"], en: [{ term: "que" }, " gives the reason after a comma, in a colloquial register"], uk: [{ term: "que" }, " вводить причину після коми в розмовному стилі"], pt: [{ term: "que" }, " dá a causa depois de uma vírgula, em registro coloquial"], fr: [{ term: "que" }, " donne la cause après une virgule, en registre familier"], de: [{ term: "que" }, " nennt den Grund nach einem Komma, umgangssprachlich"], it: [{ term: "que" }, " indica la causa dopo una virgola, in registro colloquiale"], pl: [{ term: "que" }, " podaje przyczynę po przecinku, w stylu potocznym"], tr: [{ term: "que" }, ", virgülden sonra günlük konuşma dilinde nedeni bildirir"], id: [{ term: "que" }, " memberi alasan setelah koma, dalam ragam akrab"], vi: [{ term: "que" }, " nêu nguyên nhân sau dấu phẩy, trong văn nói thân mật"] }
          ex: ["Apúrate, ", { target: que }, " perdemos el tren."]
          tr: { en: "Hurry up, we'll miss the train.", uk: "Поспішай, бо запізнимося на потяг.", pt: "Anda logo, que a gente perde o trem.", fr: "Dépêche-toi, on va rater le train.", de: "Beeil dich, sonst verpassen wir den Zug.", it: "Sbrigati, che perdiamo il treno.", pl: "Pospiesz się, bo ucieknie nam pociąg.", tr: "Acele et, treni kaçıracağız.", id: "Cepat, soalnya kita bisa ketinggalan kereta.", vi: "Nhanh lên, không thì lỡ tàu đấy." }
        - level: C2
          point: { es: "Causa excesiva", en: "Excessive reason", uk: "Надмірна причина", pt: "Causa excessiva", fr: "Cause excessive", de: "Übermäßiger Grund", it: "Causa eccessiva", pl: "Przyczyna nadmierna", tr: "Aşırı neden", id: "Sebab yang berlebihan", vi: "Nguyên nhân quá mức" }
          rule: { es: [{ term: ["de tanto ", { gap: true }, " como"] }, " presenta la causa como excesiva"], en: [{ term: ["de tanto ", { gap: true }, " como"] }, " presents the reason as excessive"], uk: [{ term: ["de tanto ", { gap: true }, " como"] }, " подає причину як надмірну"], pt: [{ term: ["de tanto ", { gap: true }, " como"] }, " apresenta a causa como excessiva"], fr: [{ term: ["de tanto ", { gap: true }, " como"] }, " présente la cause comme excessive"], de: [{ term: ["de tanto ", { gap: true }, " como"] }, " stellt den Grund als übermäßig dar"], it: [{ term: ["de tanto ", { gap: true }, " como"] }, " presenta la causa come eccessiva"], pl: [{ term: ["de tanto ", { gap: true }, " como"] }, " przedstawia przyczynę jako nadmierną"], tr: [{ term: ["de tanto ", { gap: true }, " como"] }, " nedeni aşırı olarak sunar"], id: [{ term: ["de tanto ", { gap: true }, " como"] }, " menyajikan sebab sebagai sesuatu yang berlebihan"], vi: [{ term: ["de tanto ", { gap: true }, " como"] }, " trình bày nguyên nhân như một mức quá lớn"] }
          ex: ["No se veía el suelo ", { target: de tantas hojas como había }, "."]
          tr: { en: "There were so many leaves that you couldn't see the ground.", uk: "Через таку силу листя землі не було видно.", pt: "Não se via o chão de tantas folhas que havia.", fr: "On ne voyait pas le sol tant il y avait de feuilles.", de: "Man sah den Boden vor lauter Blättern nicht.", it: "Non si vedeva il suolo, c'erano tante foglie.", pl: "Nie było widać ziemi, tyle było liści.", tr: "O kadar çok yaprak vardı ki zemin görünmüyordu.", id: "Tanah tidak kelihatan saking banyaknya daun.", vi: "Không nhìn thấy mặt đất vì có quá nhiều lá." }
        - level: C2
          point: { es: Pregunta, en: "Question", uk: "Питання", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" }
          rule: { es: "la causa por la que se pregunta lleva subjuntivo", en: "the reason being asked about takes the subjunctive", uk: "причина, про яку питають, вимагає суб’юнктива", pt: "a causa sobre a qual se pergunta leva subjuntivo", fr: "la cause sur laquelle porte la question prend le subjonctif", de: "der erfragte Grund steht im Konjunktiv", it: "la causa su cui si domanda vuole il congiuntivo", pl: "przyczyna, o którą się pyta, wymaga trybu łączącego", tr: "sorgulanan neden dilek kipiyle kullanılır", id: "alasan yang ditanyakan memakai subjungtif", vi: "nguyên nhân được hỏi đi với thức giả định" }
          ex: ["¿Es que te callas ", { target: porque esté }, " tu jefe delante?"]
          tr: { en: "Are you keeping quiet because your boss is there?", uk: "Невже ти мовчиш через те, що поруч твій начальник?", pt: "Será que você se cala porque seu chefe está na frente?", fr: "Est-ce que tu te tais parce que ton chef est là ?", de: "Schweigst du etwa, weil dein Chef dabei ist?", it: "Stai zitto forse perché c'è il tuo capo?", pl: "Czy milczysz dlatego, że jest przy tobie szef?", tr: "Patronun yanında olduğu için mi susuyorsun?", id: "Apakah kamu diam karena atasanmu ada di depanmu?", vi: "Có phải bạn im lặng vì sếp đang ở trước mặt không?" }
        - level: B2
          point: { es: Trampa, en: Trap, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: "la causa afirmada lleva indicativo", en: "an asserted reason takes the indicative", uk: "причина, подана як факт, вимагає дійсного способу", pt: "a causa afirmada leva indicativo", fr: "la cause affirmée prend l’indicatif", de: "ein behaupteter Grund steht im Indikativ", it: "la causa affermata vuole l'indicativo", pl: "przyczyna przedstawiona jako fakt wymaga trybu oznajmującego", tr: "olgu olarak bildirilen neden haber kipiyle kullanılır", id: "alasan yang dinyatakan sebagai fakta memakai indikatif", vi: "nguyên nhân được khẳng định đi với thức chỉ định" }
          ex: ["Ya que ", { target: sabes }, " tanto, explícalo tú."]
          tr: { en: "Since you know so much, you explain it.", uk: "Оскільки ти так багато знаєш, поясни це ти.", pt: "Já que você sabe tanto, explique você.", fr: "Puisque tu en sais tant, explique-le toi-même.", de: "Da du so viel weißt, erklär du es.", it: "Visto che sai tanto, spiegalo tu.", pl: "Skoro tyle wiesz, to ty to wyjaśnij.", tr: "Madem bu kadar çok şey biliyorsun, sen anlat.", id: "Karena kamu tahu begitu banyak, jelaskan saja sendiri.", vi: "Đã biết nhiều như vậy thì bạn giải thích đi." }
        - level: B2
          point: { es: Trampa, en: Trap, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: [{ term: debido a que }, " lleva la preposición ", { term: a }], en: [{ term: "debido a que" }, " takes the preposition ", { term: "a" }], uk: [{ term: "debido a que" }, " має прийменник ", { term: "a" }], pt: [{ term: "debido a que" }, " leva a preposição ", { term: "a" }], fr: [{ term: "debido a que" }, " comporte la préposition ", { term: "a" }], de: [{ term: "debido a que" }, " enthält die Präposition ", { term: "a" }], it: [{ term: "debido a que" }, " contiene la preposizione ", { term: "a" }], pl: [{ term: "debido a que" }, " zawiera przyimek ", { term: "a" }], tr: [{ term: "debido a que" }, ", ", { term: "a" }, " edatını içerir"], id: [{ term: "debido a que" }, " memakai preposisi ", { term: "a" }], vi: [{ term: "debido a que" }, " có giới từ ", { term: "a" }] }
          ex: ["Se retrasó ", { target: debido a que }, " había niebla."]
          tr: { en: "He was delayed because there was fog.", uk: "Він затримався, бо був туман.", pt: "Ele se atrasou porque havia neblina.", fr: "Il a eu du retard parce qu’il y avait du brouillard.", de: "Er hatte Verspätung, weil Nebel war.", it: "Ha fatto ritardo perché c'era la nebbia.", pl: "Spóźnił się, bo była mgła.", tr: "Sis olduğu için gecikti.", id: "Dia terlambat karena ada kabut.", vi: "Anh ấy đến muộn vì có sương mù." }

sections:
  - title: { es: "Causa del enunciado y de la enunciación", en: "Reason for the fact and for the speech act", uk: "Причина факту і мовленнєвого акту", pt: "Causa do fato e do ato de fala", fr: "Cause du fait et de l’acte de parole", de: "Grund der Tatsache und des Sprechakts", it: "Causa del fatto e dell'atto linguistico", pl: "Przyczyna faktu i aktu mowy", tr: "Olgunun ve söz ediminin nedeni", id: "Sebab fakta dan tindak tutur", vi: "Nguyên nhân của sự việc và của hành động ngôn ngữ" }
    role: overview
    content:
      - type: comparison
        columns:
          - { key: kind, label: { es: Tipo, en: "Type", uk: "Тип", pt: "Tipo", fr: "Type", de: "Typ", it: "Tipo", pl: "Rodzaj", tr: "Tür", id: "Jenis", vi: "Loại" } }
          - { key: explains, label: { es: Explica, en: "Explains", uk: "Пояснює", pt: "Explica", fr: "Explique", de: "Erklärt", it: "Spiega", pl: "Wyjaśnia", tr: "Açıklar", id: "Menjelaskan", vi: "Giải thích" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            kind: { es: "Causa del enunciado", en: "Reason for the fact", uk: "Причина факту", pt: "Causa do fato", fr: "Cause du fait", de: "Grund der Tatsache", it: "Causa del fatto", pl: "Przyczyna faktu", tr: "Olgunun nedeni", id: "Sebab fakta", vi: "Nguyên nhân của sự việc" }
            explains: { es: "por qué ocurre lo que dice la oración principal", en: "why what the main clause says happens", uk: "чому відбувається те, про що йдеться в головному реченні", pt: "por que acontece o que diz a oração principal", fr: "pourquoi se produit ce que dit la proposition principale", de: "warum geschieht, was der Hauptsatz sagt", it: "perché accade ciò che dice la frase principale", pl: "dlaczego dzieje się to, o czym mówi zdanie główne", tr: "ana cümlenin söylediği şeyin neden olduğu", id: "mengapa hal yang dikatakan klausa utama terjadi", vi: "vì sao điều mà mệnh đề chính nói lại xảy ra" }
            ex: { examples: [["Cierro la ventana ", { target: porque }, " hace frío."], ["El vuelo se retrasó ", { target: debido a que }, " había niebla."]] }
            tr: { en: { examples: ["I'm closing the window because it's cold.", "The flight was delayed because there was fog."] }, uk: { examples: ["Я зачиняю вікно, бо холодно.", "Рейс затримали, бо був туман."] }, pt: { examples: ["Fecho a janela porque está frio.", "O voo atrasou porque havia neblina."] }, fr: { examples: ["Je ferme la fenêtre parce qu’il fait froid.", "Le vol a été retardé parce qu’il y avait du brouillard."] }, de: { examples: ["Ich schließe das Fenster, weil es kalt ist.", "Der Flug hatte Verspätung, weil Nebel herrschte."] }, it: { examples: ["Chiudo la finestra perché fa freddo.", "Il volo è stato ritardato perché c'era la nebbia."] }, pl: { examples: ["Zamykam okno, bo jest zimno.", "Lot się opóźnił, bo była mgła."] }, tr: { examples: ["Hava soğuk olduğu için pencereyi kapatıyorum.", "Sis olduğu için uçuş gecikti."] }, id: { examples: ["Saya menutup jendela karena dingin.", "Penerbangan itu tertunda karena ada kabut."] }, vi: { examples: ["Tôi đóng cửa sổ vì trời lạnh.", "Chuyến bay bị hoãn vì có sương mù."] } }
          - level: B2
            kind: { es: "Causa de la enunciación", en: "Reason for the speech act", uk: "Причина мовленнєвого акту", pt: "Causa do ato de fala", fr: "Cause de l’acte de parole", de: "Grund des Sprechakts", it: "Causa dell'atto linguistico", pl: "Przyczyna aktu mowy", tr: "Söz ediminin nedeni", id: "Sebab tindak tutur", vi: "Nguyên nhân của hành động ngôn ngữ" }
            explains: { es: "por qué se dice la oración principal: una orden, un consejo o una deducción", en: "why the main clause is said: an order, advice or a deduction", uk: "чому кажуть головне речення: наказ, пораду чи висновок", pt: "por que se diz a oração principal: uma ordem, um conselho ou uma dedução", fr: "pourquoi on dit la proposition principale : un ordre, un conseil ou une déduction", de: "warum der Hauptsatz gesagt wird: ein Befehl, ein Rat oder ein Schluss", it: "perché si dice la frase principale: un ordine, un consiglio o una deduzione", pl: "dlaczego mówi się zdanie główne: rozkaz, radę lub wniosek", tr: "ana cümlenin neden söylendiği: bir emir, bir öğüt ya da bir çıkarım", id: "mengapa klausa utama diucapkan: perintah, saran, atau kesimpulan", vi: "vì sao người ta nói mệnh đề chính: một mệnh lệnh, một lời khuyên hoặc một suy luận" }
            ex: { examples: [["Cierra la ventana, ", { target: porque }, " hace frío."], ["Ya llegaron, ", { target: porque }, " veo la luz encendida."]] }
            tr: { en: { examples: ["Close the window, because it's cold.", "They've arrived, because I can see the light on."] }, uk: { examples: ["Зачини вікно, бо холодно.", "Вони вже приїхали, бо я бачу, що світло горить."] }, pt: { examples: ["Fecha a janela, porque está frio.", "Eles já chegaram, porque estou vendo a luz acesa."] }, fr: { examples: ["Ferme la fenêtre, parce qu’il fait froid.", "Ils sont déjà arrivés, car je vois la lumière allumée."] }, de: { examples: ["Mach das Fenster zu, denn es ist kalt.", "Sie sind schon da, denn ich sehe, dass Licht brennt."] }, it: { examples: ["Chiudi la finestra, perché fa freddo.", "Sono già arrivati, perché vedo la luce accesa."] }, pl: { examples: ["Zamknij okno, bo jest zimno.", "Już przyjechali, bo widzę zapalone światło."] }, tr: { examples: ["Pencereyi kapat, çünkü hava soğuk.", "Gelmişler, çünkü ışığın yandığını görüyorum."] }, id: { examples: ["Tutup jendelanya, karena dingin.", "Mereka sudah tiba, karena saya melihat lampunya menyala."] }, vi: { examples: ["Đóng cửa sổ lại đi, vì trời lạnh.", "Họ đến rồi, vì tôi thấy đèn đang sáng."] } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "La causa afirmada es un hecho real, así que el verbo va en indicativo."
              en: "An asserted reason is a real fact, so the verb is in the indicative."
              uk: "Причина, подана як факт, є реальною, тому дієслово стоїть у дійсному способі."
              pt: "A causa afirmada é um fato real, por isso o verbo fica no indicativo."
              fr: "La cause affirmée est un fait réel, donc le verbe est à l’indicatif."
              de: "Der behauptete Grund ist eine reale Tatsache, deshalb steht das Verb im Indikativ."
              it: "La causa affermata è un fatto reale, quindi il verbo è all'indicativo."
              pl: "Przyczyna przedstawiona jako fakt jest rzeczywista, więc czasownik stoi w trybie oznajmującym."
              tr: "Bildirilen neden gerçek bir olgudur, bu yüzden fiil haber kipinde olur."
              id: "Alasan yang dinyatakan adalah fakta nyata, jadi verba berada dalam indikatif."
              vi: "Nguyên nhân được khẳng định là sự việc có thật, nên động từ ở thức chỉ định."
            ex: { examples: [["Se negó debido a que no le ", { target: habían avisado }, "."], ["Ya que ", { target: sabes }, " tanto, explícalo tú."]] }
            tr: { en: { examples: ["He refused because he hadn't been told.", "Since you know so much, you explain it."] }, uk: { examples: ["Він відмовився, бо йому не повідомили.", "Оскільки ти так багато знаєш, поясни це ти."] }, pt: { examples: ["Ele se recusou porque não o tinham avisado.", "Já que você sabe tanto, explique você."] }, fr: { examples: ["Il a refusé parce qu’on ne l’avait pas prévenu.", "Puisque tu en sais tant, explique-le toi-même."] }, de: { examples: ["Er lehnte ab, weil man ihn nicht benachrichtigt hatte.", "Da du so viel weißt, erklär du es."] }, it: { examples: ["Si è rifiutato perché non l'avevano avvisato.", "Visto che sai tanto, spiegalo tu."] }, pl: { examples: ["Odmówił, ponieważ nikt go nie uprzedził.", "Skoro tyle wiesz, to ty to wyjaśnij."] }, tr: { examples: ["Kendisine haber verilmediği için reddetti.", "Madem bu kadar çok şey biliyorsun, sen anlat."] }, id: { examples: ["Dia menolak karena tidak diberi tahu.", "Karena kamu tahu begitu banyak, jelaskan saja sendiri."] }, vi: { examples: ["Anh ấy từ chối vì không ai báo cho anh ấy.", "Đã biết nhiều như vậy thì bạn giải thích đi."] } }
          - type: rule
            level: B2
            text:
              es: "Una coma separa la causa de la enunciación; la causa del enunciado no la lleva."
              en: "A comma sets off the reason for the speech act; the reason for the fact takes none."
              uk: "Кома відокремлює причину мовленнєвого акту; причина факту коми не має."
              pt: "Uma vírgula separa a causa do ato de fala; a causa do fato não leva vírgula."
              fr: "Une virgule sépare la cause de l’acte de parole ; la cause du fait n’en prend pas."
              de: "Ein Komma trennt den Grund des Sprechakts ab; der Grund der Tatsache steht ohne Komma."
              it: "Una virgola separa la causa dell'atto linguistico; la causa del fatto non la vuole."
              pl: "Przecinek oddziela przyczynę aktu mowy; przyczyna faktu go nie ma."
              tr: "Söz ediminin nedeni virgülle ayrılır; olgunun nedeninden önce virgül konmaz."
              id: "Koma memisahkan sebab tindak tutur; sebab fakta tidak memakai koma."
              vi: "Dấu phẩy tách nguyên nhân của hành động ngôn ngữ; nguyên nhân của sự việc không có dấu phẩy."
          - type: rule
            level: B2
            text:
              es: "La causa antepuesta se separa de la oración principal con una coma."
              en: "A reason placed first is separated from the main clause by a comma."
              uk: "Причина на початку речення відокремлюється від головного речення комою."
              pt: "A causa colocada antes é separada da oração principal por uma vírgula."
              fr: "La cause placée en tête se sépare de la proposition principale par une virgule."
              de: "Der vorangestellte Grund wird durch ein Komma vom Hauptsatz getrennt."
              it: "La causa anteposta si separa dalla frase principale con una virgola."
              pl: "Przyczyna na początku zdania jest oddzielona od zdania głównego przecinkiem."
              tr: "Başa alınan neden, ana cümleden virgülle ayrılır."
              id: "Alasan yang diletakkan di depan dipisahkan dari klausa utama dengan koma."
              vi: "Nguyên nhân đặt lên trước được tách khỏi mệnh đề chính bằng dấu phẩy."
            ex: { examples: [[{ target: Puesto que }, " nadie protestó, se aprobó el plan."], [{ target: Ya que }, " vives cerca, pasa por mi casa."]] }
            tr: { en: { examples: ["Given that nobody objected, the plan was approved.", "Since you live nearby, drop by my house."] }, uk: { examples: ["Зважаючи на те, що ніхто не заперечував, план затвердили.", "Оскільки ти живеш поруч, заходь до мене."] }, pt: { examples: ["Visto que ninguém protestou, o plano foi aprovado.", "Já que você mora perto, passa lá em casa."] }, fr: { examples: ["Étant donné que personne n’a protesté, le plan a été approuvé.", "Puisque tu habites près d’ici, passe chez moi."] }, de: { examples: ["Da niemand protestierte, wurde der Plan angenommen.", "Da du in der Nähe wohnst, komm doch bei mir vorbei."] }, it: { examples: ["Poiché nessuno ha protestato, il piano è stato approvato.", "Visto che abiti vicino, passa da me."] }, pl: { examples: ["Ponieważ nikt nie zaprotestował, plan zatwierdzono.", "Skoro mieszkasz blisko, wpadnij do mnie."] }, tr: { examples: ["Kimse itiraz etmediği için plan onaylandı.", "Madem yakında oturuyorsun, bize uğra."] }, id: { examples: ["Mengingat tidak ada yang memprotes, rencana itu disetujui.", "Karena kamu tinggal dekat, mampirlah ke rumah saya."] }, vi: { examples: ["Do không ai phản đối nên kế hoạch được thông qua.", "Vì bạn sống gần đây, hãy ghé nhà tôi nhé."] } }

  - title: { es: Nexos, en: "Linkers", uk: "Сполучники", pt: "Conectivos", fr: "Connecteurs", de: "Bindewörter", it: "Connettivi", pl: "Słowa łączące", tr: "Bağlayıcılar", id: "Kata penghubung", vi: "Từ nối" }
    role: use
