          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            linker: porque
            use: { es: "detrás de la principal; en todos los registros", en: "after the main clause; in every register", uk: "після головного речення; в усіх стилях", pt: "depois da oração principal; em todos os registros", fr: "après la proposition principale ; dans tous les registres", de: "nach dem Hauptsatz; in allen Registern", it: "dopo la frase principale; in tutti i registri", pl: "po zdaniu głównym; we wszystkich stylach", tr: "ana cümlenin arkasında; her üslupta", id: "setelah klausa utama; dalam semua ragam", vi: "sau mệnh đề chính; trong mọi phong cách" }
            ex: ["Salgo temprano ", { target: porque }, " mañana tengo examen."]
            tr: { en: "I'm leaving early because I have an exam tomorrow.", uk: "Я виходжу рано, бо завтра в мене іспит.", pt: "Saio cedo porque amanhã tenho prova.", fr: "Je pars tôt parce que j’ai un examen demain.", de: "Ich gehe früh los, weil ich morgen eine Prüfung habe.", it: "Esco presto perché domani ho un esame.", pl: "Wychodzę wcześnie, bo jutro mam egzamin.", tr: "Yarın sınavım olduğu için erken çıkıyorum.", id: "Saya berangkat lebih awal karena besok ada ujian.", vi: "Tôi đi sớm vì ngày mai tôi có bài kiểm tra." }
          - level: B2
            linker: debido a que
            use: { es: "detrás de la principal; formal", en: "after the main clause; formal", uk: "після головного речення; офіційний стиль", pt: "depois da oração principal; formal", fr: "après la proposition principale ; soutenu", de: "nach dem Hauptsatz; förmlich", it: "dopo la frase principale; formale", pl: "po zdaniu głównym; styl formalny", tr: "ana cümlenin arkasında; resmî", id: "setelah klausa utama; formal", vi: "sau mệnh đề chính; trang trọng" }
            ex: ["El partido se suspendió ", { target: debido a que }, " llovía mucho."]
            tr: { en: "The match was called off because it was raining heavily.", uk: "Матч скасували, бо йшов сильний дощ.", pt: "O jogo foi suspenso porque chovia muito.", fr: "Le match a été suspendu parce qu’il pleuvait beaucoup.", de: "Das Spiel wurde abgesagt, weil es stark regnete.", it: "La partita è stata sospesa perché pioveva molto.", pl: "Mecz odwołano, ponieważ mocno padało.", tr: "Yağmur çok yağdığı için maç ertelendi.", id: "Pertandingan ditunda karena hujan deras.", vi: "Trận đấu bị hoãn vì trời mưa to." }
          - level: B2
            linker: ya que
            use: { es: "delante o detrás; un hecho conocido; neutro", en: "before or after; a known fact; neutral", uk: "перед головним реченням або після нього; відомий факт; нейтральний стиль", pt: "antes ou depois; um fato conhecido; neutro", fr: "avant ou après ; un fait connu ; neutre", de: "davor oder danach; bekannte Tatsache; neutral", it: "prima o dopo; un fatto noto; neutro", pl: "przed lub po; fakt znany; styl neutralny", tr: "önde ya da arkada; bilinen bir olgu; yansız", id: "sebelum atau sesudah; fakta yang sudah diketahui; netral", vi: "trước hoặc sau; sự việc đã biết; trung tính" }
            ex: { examples: [[{ target: Ya que }, " vives cerca, pasa por mi casa."], ["Pasa por mi casa, ", { target: ya que }, " vives cerca."]] }
            tr: { en: { examples: ["Since you live nearby, drop by my house.", "Drop by my house, since you live nearby."] }, uk: { examples: ["Оскільки ти живеш поруч, заходь до мене.", "Заходь до мене, оскільки ти живеш поруч."] }, pt: { examples: ["Já que você mora perto, passa lá em casa.", "Passa lá em casa, já que você mora perto."] }, fr: { examples: ["Puisque tu habites près d’ici, passe chez moi.", "Passe chez moi, puisque tu habites près d’ici."] }, de: { examples: ["Da du in der Nähe wohnst, komm doch bei mir vorbei.", "Komm doch bei mir vorbei, da du in der Nähe wohnst."] }, it: { examples: ["Visto che abiti vicino, passa da me.", "Passa da me, visto che abiti vicino."] }, pl: { examples: ["Skoro mieszkasz blisko, wpadnij do mnie.", "Wpadnij do mnie, skoro mieszkasz blisko."] }, tr: { examples: ["Madem yakında oturuyorsun, bize uğra.", "Bize uğra, madem yakında oturuyorsun."] }, id: { examples: ["Karena kamu tinggal dekat, mampirlah ke rumah saya.", "Mampirlah ke rumah saya, karena kamu tinggal dekat."] }, vi: { examples: ["Vì bạn sống gần đây, hãy ghé nhà tôi nhé.", "Hãy ghé nhà tôi nhé, vì bạn sống gần đây."] } }
          - level: B2
            linker: puesto que
            use: { es: "delante o detrás; un hecho conocido; más formal y escrito", en: "before or after; a known fact; more formal and written", uk: "перед головним реченням або після нього; відомий факт; офіційніший і книжний", pt: "antes ou depois; um fato conhecido; mais formal e escrito", fr: "avant ou après ; un fait connu ; plus soutenu et écrit", de: "davor oder danach; bekannte Tatsache; förmlicher und schriftsprachlich", it: "prima o dopo; un fatto noto; più formale e scritto", pl: "przed lub po; fakt znany; styl bardziej formalny, pisany", tr: "önde ya da arkada; bilinen bir olgu; daha resmî ve yazılı dile özgü", id: "sebelum atau sesudah; fakta yang sudah diketahui; lebih formal dan tulis", vi: "trước hoặc sau; sự việc đã biết; trang trọng hơn, dùng trong văn viết" }
            ex: { examples: [[{ target: Puesto que }, " nadie protestó, se aprobó el plan."], ["Se aprobó el plan, ", { target: puesto que }, " nadie protestó."]] }
            tr: { en: { examples: ["Given that nobody objected, the plan was approved.", "The plan was approved, given that nobody objected."] }, uk: { examples: ["Зважаючи на те, що ніхто не заперечував, план затвердили.", "План затвердили, зважаючи на те, що ніхто не заперечував."] }, pt: { examples: ["Visto que ninguém protestou, o plano foi aprovado.", "O plano foi aprovado, visto que ninguém protestou."] }, fr: { examples: ["Étant donné que personne n’a protesté, le plan a été approuvé.", "Le plan a été approuvé, étant donné que personne n’a protesté."] }, de: { examples: ["Da niemand protestierte, wurde der Plan angenommen.", "Der Plan wurde angenommen, da niemand protestierte."] }, it: { examples: ["Poiché nessuno ha protestato, il piano è stato approvato.", "Il piano è stato approvato, poiché nessuno ha protestato."] }, pl: { examples: ["Ponieważ nikt nie zaprotestował, plan zatwierdzono.", "Plan zatwierdzono, ponieważ nikt nie zaprotestował."] }, tr: { examples: ["Kimse itiraz etmediği için plan onaylandı.", "Plan onaylandı, çünkü kimse itiraz etmedi."] }, id: { examples: ["Mengingat tidak ada yang memprotes, rencana itu disetujui.", "Rencana itu disetujui, mengingat tidak ada yang memprotes."] }, vi: { examples: ["Do không ai phản đối nên kế hoạch được thông qua.", "Kế hoạch được thông qua, do không ai phản đối."] } }
          - level: C1
            linker: a causa de que
            use: { es: "delante o detrás; formal, en la lengua escrita", en: "before or after; formal, in written language", uk: "перед головним реченням або після нього; офіційний стиль, у писемній мові", pt: "antes ou depois; formal, na língua escrita", fr: "avant ou après ; soutenu, à l’écrit", de: "davor oder danach; förmlich, in der Schriftsprache", it: "prima o dopo; formale, nella lingua scritta", pl: "przed lub po; styl formalny, w języku pisanym", tr: "önde ya da arkada; resmî, yazı dilinde", id: "sebelum atau sesudah; formal, dalam bahasa tulis", vi: "trước hoặc sau; trang trọng, trong văn viết" }
            ex: { examples: [[{ target: A causa de que }, " nevó, cerraron la carretera."], ["Cerraron la carretera ", { target: a causa de que }, " nevó."]] }
            tr: { en: { examples: ["Because it snowed, they closed the road.", "They closed the road because it snowed."] }, uk: { examples: ["Через те, що випав сніг, дорогу закрили.", "Дорогу закрили через те, що випав сніг."] }, pt: { examples: ["Em razão da neve, fecharam a estrada.", "Fecharam a estrada em razão da neve."] }, fr: { examples: ["Du fait qu’il a neigé, la route a été fermée.", "La route a été fermée du fait qu’il a neigé."] }, de: { examples: ["Aufgrund des Schneefalls wurde die Straße gesperrt.", "Die Straße wurde aufgrund des Schneefalls gesperrt."] }, it: { examples: ["A causa della neve, hanno chiuso la strada.", "Hanno chiuso la strada a causa della neve."] }, pl: { examples: ["Z powodu opadów śniegu zamknięto drogę.", "Zamknięto drogę z powodu opadów śniegu."] }, tr: { examples: ["Kar yağdığı için yol kapatıldı.", "Yol, kar yağdığı için kapatıldı."] }, id: { examples: ["Disebabkan turun salju, jalan itu ditutup.", "Jalan itu ditutup disebabkan turun salju."] }, vi: { examples: ["Do tuyết rơi, con đường bị đóng.", "Con đường bị đóng do tuyết rơi."] } }
          - level: C1
            linker: gracias a que
            use: { es: "delante o detrás; una causa favorable", en: "before or after; a favorable reason", uk: "перед головним реченням або після нього; сприятлива причина", pt: "antes ou depois; uma causa favorável", fr: "avant ou après ; une cause favorable", de: "davor oder danach; ein günstiger Grund", it: "prima o dopo; una causa favorevole", pl: "przed lub po; przyczyna korzystna", tr: "önde ya da arkada; olumlu bir neden", id: "sebelum atau sesudah; sebab yang menguntungkan", vi: "trước hoặc sau; nguyên nhân thuận lợi" }
            ex: { examples: [[{ target: Gracias a que }, " me avisaste, llegué a tiempo."], ["Llegué a tiempo ", { target: gracias a que }, " me avisaste."]] }
            tr: { en: { examples: ["Thanks to your warning, I arrived on time.", "I arrived on time thanks to your warning."] }, uk: { examples: ["Завдяки тому, що ти мене попередив, я прийшов вчасно.", "Я прийшов вчасно завдяки тому, що ти мене попередив."] }, pt: { examples: ["Graças ao seu aviso, cheguei a tempo.", "Cheguei a tempo graças ao seu aviso."] }, fr: { examples: ["Grâce à ton avertissement, je suis arrivé à temps.", "Je suis arrivé à temps grâce à ton avertissement."] }, de: { examples: ["Dank deines Hinweises bin ich rechtzeitig angekommen.", "Ich bin rechtzeitig angekommen, dank deines Hinweises."] }, it: { examples: ["Grazie al tuo avviso, sono arrivato in tempo.", "Sono arrivato in tempo grazie al tuo avviso."] }, pl: { examples: ["Dzięki temu, że mnie uprzedziłeś, dotarłem na czas.", "Dotarłem na czas dzięki temu, że mnie uprzedziłeś."] }, tr: { examples: ["Beni uyardığın sayesinde zamanında yetiştim.", "Zamanında yetiştim, beni uyardığın sayesinde."] }, id: { examples: ["Berkat peringatanmu, saya tiba tepat waktu.", "Saya tiba tepat waktu berkat peringatanmu."] }, vi: { examples: ["Nhờ bạn báo cho tôi, tôi đã đến kịp giờ.", "Tôi đã đến kịp giờ nhờ bạn báo cho tôi."] } }
          - level: C1
            linker: por culpa de que
            use: { es: "delante o detrás; una causa desfavorable", en: "before or after; an unfavorable reason", uk: "перед головним реченням або після нього; несприятлива причина", pt: "antes ou depois; uma causa desfavorável", fr: "avant ou après ; une cause défavorable", de: "davor oder danach; ein ungünstiger Grund", it: "prima o dopo; una causa sfavorevole", pl: "przed lub po; przyczyna niekorzystna", tr: "önde ya da arkada; olumsuz bir neden", id: "sebelum atau sesudah; sebab yang merugikan", vi: "trước hoặc sau; nguyên nhân bất lợi" }
            ex: { examples: [[{ target: Por culpa de que }, " el taxi llegó tarde, perdimos el tren."], ["Perdimos el tren ", { target: por culpa de que }, " el taxi llegó tarde."]] }
            tr: { en: { examples: ["Because the taxi was late, we missed the train.", "We missed the train because the taxi was late."] }, uk: { examples: ["Через те, що таксі приїхало пізно, ми не встигли на потяг.", "Ми не встигли на потяг через те, що таксі приїхало пізно."] }, pt: { examples: ["Por culpa do táxi, que chegou atrasado, perdemos o trem.", "Perdemos o trem por culpa do táxi, que chegou atrasado."] }, fr: { examples: ["À cause du taxi, qui est arrivé en retard, nous avons raté le train.", "Nous avons raté le train à cause du taxi, qui est arrivé en retard."] }, de: { examples: ["Wegen des verspäteten Taxis haben wir den Zug verpasst.", "Wir haben den Zug wegen des verspäteten Taxis verpasst."] }, it: { examples: ["Per colpa del taxi, arrivato in ritardo, abbiamo perso il treno.", "Abbiamo perso il treno per colpa del taxi, arrivato in ritardo."] }, pl: { examples: ["Przez to, że taksówka przyjechała późno, spóźniliśmy się na pociąg.", "Spóźniliśmy się na pociąg przez to, że taksówka przyjechała późno."] }, tr: { examples: ["Taksinin geç gelmesi yüzünden treni kaçırdık.", "Treni, taksinin geç gelmesi yüzünden kaçırdık."] }, id: { examples: ["Gara-gara taksinya terlambat, kami ketinggalan kereta.", "Kami ketinggalan kereta gara-gara taksinya terlambat."] }, vi: { examples: ["Tại taxi đến muộn nên chúng tôi lỡ tàu.", "Chúng tôi lỡ tàu tại taxi đến muộn."] } }
          - level: C2
            linker: que
            use: { es: "detrás de la principal y de una coma; coloquial", en: "after the main clause and a comma; colloquial", uk: "після головного речення і коми; розмовний стиль", pt: "depois da oração principal e de uma vírgula; coloquial", fr: "après la proposition principale et une virgule ; familier", de: "nach dem Hauptsatz und einem Komma; umgangssprachlich", it: "dopo la frase principale e una virgola; colloquiale", pl: "po zdaniu głównym i przecinku; potoczny", tr: "ana cümleden ve virgülden sonra; günlük konuşma dili", id: "setelah klausa utama dan koma; akrab", vi: "sau mệnh đề chính và dấu phẩy; khẩu ngữ" }
            ex: ["Apúrate, ", { target: que }, " perdemos el tren."]
            tr: { en: "Hurry up, we'll miss the train.", uk: "Поспішай, бо запізнимося на потяг.", pt: "Anda logo, que a gente perde o trem.", fr: "Dépêche-toi, on va rater le train.", de: "Beeil dich, sonst verpassen wir den Zug.", it: "Sbrigati, che perdiamo il treno.", pl: "Pospiesz się, bo ucieknie nam pociąg.", tr: "Acele et, treni kaçıracağız.", id: "Cepat, soalnya kita bisa ketinggalan kereta.", vi: "Nhanh lên, không thì lỡ tàu đấy." }
          - level: C2
            linker: ["de tanto ", { gap: true }, " como"]
            use: { es: "detrás de la principal; la causa es excesiva y la principal dice su efecto", en: "after the main clause; the reason is excessive and the main clause states its effect", uk: "після головного речення; причина надмірна, а головне речення називає її наслідок", pt: "depois da oração principal; a causa é excessiva e a oração principal diz o seu efeito", fr: "après la proposition principale ; la cause est excessive et la principale en dit l’effet", de: "nach dem Hauptsatz; der Grund ist übermäßig, und der Hauptsatz nennt seine Wirkung", it: "dopo la frase principale; la causa è eccessiva e la principale ne dice l'effetto", pl: "po zdaniu głównym; przyczyna jest nadmierna, a zdanie główne podaje jej skutek", tr: "ana cümlenin arkasında; neden aşırıdır, ana cümle onun sonucunu bildirir", id: "setelah klausa utama; sebabnya berlebihan dan klausa utama menyatakan akibatnya", vi: "sau mệnh đề chính; nguyên nhân quá mức và mệnh đề chính nêu hệ quả của nó" }
            ex: ["No se veía el suelo ", { target: de tantas hojas como había }, "."]
            tr: { en: "There were so many leaves that you couldn't see the ground.", uk: "Через таку силу листя землі не було видно.", pt: "Não se via o chão de tantas folhas que havia.", fr: "On ne voyait pas le sol tant il y avait de feuilles.", de: "Man sah den Boden vor lauter Blättern nicht.", it: "Non si vedeva il suolo, c'erano tante foglie.", pl: "Nie było widać ziemi, tyle było liści.", tr: "O kadar çok yaprak vardı ki zemin görünmüyordu.", id: "Tanah tidak kelihatan saking banyaknya daun.", vi: "Không nhìn thấy mặt đất vì có quá nhiều lá." }

