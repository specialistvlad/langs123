title: { es: "Infinitivo, gerundio y participio", en: "Infinitive, Gerund and Participle", uk: "Інфінітив, герундій і дієприкметник", pt: "Infinitivo, gerúndio e particípio", fr: "Infinitif, gérondif et participe passé", de: "Infinitiv, Gerundium und Partizip", it: "Infinito, gerundio e participio", pl: "Bezokolicznik, gerundio i imiesłów", tr: "Mastar, gerundio ve participio", id: "Infinitif, gerundio, dan partisip", vi: "Nguyên mẫu, gerundio và quá khứ phân từ" }
summary:
  lead:
    es: ["El infinitivo, el gerundio y el participio expresan una acción sin persona propia y la sitúan respecto del verbo principal: ", { term: llegar }, ", ", { term: llegando }, ", ", { term: llegado }, "."]
    en: ["The infinitive, the gerund and the participle name an action with no person of its own and place it in relation to the main verb: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    uk: ["Інфінітив, герундій і дієприкметник виражають дію без власної особи й співвідносять її з головним дієсловом: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    pt: ["O infinitivo, o gerúndio e o particípio expressam uma ação sem pessoa própria e a situam em relação ao verbo principal: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    fr: ["L’infinitif, le gérondif et le participe passé expriment une action sans personne propre, située par rapport au verbe principal : ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    de: ["Infinitiv, Gerundium und Partizip drücken eine Handlung ohne eigene Person aus und setzen sie in Beziehung zum Hauptverb: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    it: ["L'infinito, il gerundio e il participio esprimono un'azione senza persona propria e la collocano rispetto al verbo principale: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    pl: ["Bezokolicznik, gerundio i imiesłów wyrażają czynność bez własnej osoby i odnoszą ją do czasownika głównego: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    tr: ["Mastar, gerundio ve participio kendi kişisi olmayan bir eylemi anlatır ve onu ana fiile göre konumlandırır: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    id: ["Infinitif, gerundio, dan partisip menyatakan tindakan tanpa persona sendiri dan menempatkannya terhadap kata kerja utama: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
    vi: ["Nguyên mẫu, gerundio và quá khứ phân từ diễn tả hành động không có ngôi riêng, gắn với động từ chính: ", { term: "llegar" }, ", ", { term: "llegando" }, ", ", { term: "llegado" }, "."]
  rule:
    es: ["Una acción posterior al verbo principal se expresa con ", { term: y }, " y un verbo conjugado:"]
    en: ["An action after the main verb takes ", { term: "y" }, " and a conjugated verb:"]
    uk: ["Дія, що відбувається після головного дієслова, виражається через ", { term: "y" }, " і відмінюване дієслово:"]
    pt: ["Uma ação posterior ao verbo principal se expressa com ", { term: "y" }, " e um verbo conjugado:"]
    fr: ["Une action postérieure au verbe principal s’exprime avec ", { term: "y" }, " et un verbe conjugué :"]
    de: ["Eine Handlung nach dem Hauptverb steht mit ", { term: "y" }, " und einem konjugierten Verb:"]
    it: ["Un'azione posteriore al verbo principale si esprime con ", { term: "y" }, " e un verbo coniugato:"]
    pl: ["Czynność późniejszą niż czynność czasownika głównego wyraża się za pomocą ", { term: "y" }, " i czasownika w formie osobowej:"]
    tr: ["Ana fiilden sonraki bir eylem ", { term: "y" }, " ve çekimli bir fiille anlatılır:"]
    id: ["Tindakan yang terjadi setelah kata kerja utama dinyatakan dengan ", { term: "y" }, " dan kata kerja yang dikonjugasi:"]
    vi: ["Hành động sau động từ chính dùng ", { term: "y" }, " và một động từ chia:"]
  ex: ["Abrí la puerta ", { target: "y me encontré" }, " con él."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: Infinitivo, en: "Infinitive", uk: "Інфінітив", pt: "Infinitivo", fr: "Infinitif", de: "Infinitiv", it: "Infinito", pl: "Bezokolicznik", tr: "Mastar", id: "Infinitif", vi: "Nguyên mẫu" }
          rule: { es: "el sujeto sobrentendido es el complemento del verbo principal", en: "the understood subject is the object of the main verb", uk: "підмет, що мається на увазі, — це додаток головного дієслова", pt: "o sujeito subentendido é o complemento do verbo principal", fr: "le sujet sous-entendu est le complément du verbe principal", de: "das mitgedachte Subjekt ist das Objekt des Hauptverbs", it: "il soggetto sottinteso è il complemento del verbo principale", pl: "domyślnym podmiotem jest dopełnienie czasownika głównego", tr: "örtük özne, ana fiilin nesnesidir", id: "subjek yang tersirat adalah objek dari kata kerja utama", vi: "chủ ngữ ngầm hiểu là tân ngữ của động từ chính" }
          ex: ["El profesor recomendó al estudiante ", { target: "trabajar más" }, "."]
          tr: { en: "The teacher advised the student to work harder.", uk: "Викладач порадив студентові працювати більше.", pt: "O professor recomendou ao estudante trabalhar mais.", fr: "Le professeur a recommandé à l’étudiant de travailler plus.", de: "Der Lehrer empfahl dem Studenten, mehr zu arbeiten.", it: "Il professore ha consigliato allo studente di lavorare di più.", pl: "Nauczyciel poradził studentowi, żeby więcej pracował.", tr: "Öğretmen öğrenciye daha çok çalışmasını önerdi.", id: "Guru menyarankan siswa itu bekerja lebih keras.", vi: "Thầy giáo khuyên học sinh làm việc chăm chỉ hơn." }
        - level: B2
          point: { pattern: [{ term: haber }, { slot: past participle }] }
          rule: { es: "acción anterior a la del verbo principal", en: "an action before that of the main verb", uk: "дія, що передує дії головного дієслова", pt: "ação anterior à do verbo principal", fr: "action antérieure à celle du verbe principal", de: "Handlung vor der des Hauptverbs", it: "azione anteriore a quella del verbo principale", pl: "czynność wcześniejsza niż czynność czasownika głównego", tr: "ana fiilin eyleminden önceki eylem", id: "tindakan yang terjadi sebelum tindakan kata kerja utama", vi: "hành động xảy ra trước hành động của động từ chính" }
          ex: ["El profesor le regañó por no ", { target: "haber estudiado" }, "."]
          tr: { en: "The teacher scolded him for not having studied.", uk: "Викладач насварив його за те, що він не вчився.", pt: "O professor o repreendeu por não ter estudado.", fr: "Le professeur l’a grondé de ne pas avoir étudié.", de: "Der Lehrer tadelte ihn, weil er nicht gelernt hatte.", it: "Il professore lo ha rimproverato per non aver studiato.", pl: "Nauczyciel zbeształ go za to, że się nie uczył.", tr: "Öğretmen, ders çalışmadığı için onu azarladı.", id: "Guru menegurnya karena tidak belajar.", vi: "Thầy giáo mắng cậu ấy vì đã không học bài." }
        - level: B2
          point: { es: Gerundio, en: "Gerund", uk: "Герундій", pt: "Gerúndio", fr: "Gérondif", de: "Gerundium", it: "Gerundio", pl: "Gerundio", tr: "Gerundio", id: "Gerundio", vi: "Gerundio" }
          rule: { es: "acción simultánea o anterior al verbo principal", en: "an action at the same time as, or before, that of the main verb", uk: "дія, що відбувається одночасно з дією головного дієслова або перед нею", pt: "ação simultânea ou anterior à do verbo principal", fr: "action simultanée ou antérieure à celle du verbe principal", de: "Handlung gleichzeitig mit oder vor der des Hauptverbs", it: "azione contemporanea o anteriore a quella del verbo principale", pl: "czynność jednoczesna z czynnością czasownika głównego lub wcześniejsza", tr: "ana fiille eş zamanlı ya da ondan önceki eylem", id: "tindakan yang bersamaan dengan atau sebelum tindakan kata kerja utama", vi: "hành động đồng thời hoặc xảy ra trước hành động của động từ chính" }
          ex: ["Me lo confesó ", { target: "yendo por la calle" }, "."]
          tr: { en: "He confessed it to me as he walked down the street.", uk: "Він зізнався мені в цьому, ідучи вулицею.", pt: "Ele me confessou isso caminhando pela rua.", fr: "Il me l’a avoué en marchant dans la rue.", de: "Er gestand es mir, als er die Straße entlangging.", it: "Me l'ha confessato camminando per strada.", pl: "Przyznał mi się do tego, idąc ulicą.", tr: "Bunu bana sokakta yürürken itiraf etti.", id: "Dia mengakuinya kepada saya sambil berjalan di jalan.", vi: "Anh ấy thú nhận điều đó với tôi khi đang đi trên đường." }
        - level: B2
          point: { es: Participio, en: "Participle", uk: "Дієприкметник", pt: "Particípio", fr: "Participe passé", de: "Partizip", it: "Participio", pl: "Imiesłów", tr: "Participio", id: "Partisip", vi: "Quá khứ phân từ" }
          rule: { es: "predicativo: concuerda con el nombre al que describe", en: "predicative: agrees with the noun it describes", uk: "предикативна ознака: узгоджується з іменником, який описує", pt: "predicativo: concorda com o substantivo que descreve", fr: "attribut : s’accorde avec le nom qu’il décrit", de: "Prädikativ: richtet sich nach dem Nomen, das es beschreibt", it: "predicativo: concorda con il sostantivo che descrive", pl: "dopowiedzenie: zgadza się z rzeczownikiem, który opisuje", tr: "niteleyen sıfat: nitelediği isimle uyum sağlar", id: "predikatif: menyesuaikan dengan kata benda yang dijelaskannya", vi: "tính từ miêu tả: hòa hợp với danh từ mà nó miêu tả" }
          ex: ["Encontré a Sara ", { target: cansada }, " por el esfuerzo."]
          tr: { en: "I found Sara tired from the effort.", uk: "Я застав Сару втомленою від зусиль.", pt: "Encontrei a Sara cansada pelo esforço.", fr: "J’ai trouvé Sara fatiguée par l’effort.", de: "Ich fand Sara müde von der Anstrengung vor.", it: "Ho trovato Sara stanca per lo sforzo.", pl: "Zastałem Sarę zmęczoną wysiłkiem.", tr: "Sara’yı çabadan yorgun buldum.", id: "Saya mendapati Sara lelah karena usaha itu.", vi: "Tôi thấy Sara mệt vì đã gắng sức." }
        - level: B2
          point: { es: Sucesión en el tiempo, en: "Succession in time", uk: "Послідовність у часі", pt: "Sucessão no tempo", fr: "Succession dans le temps", de: "Zeitliche Abfolge", it: "Successione nel tempo", pl: "Następstwo w czasie", tr: "Zamanda ardışıklık", id: "Urutan waktu", vi: "Trình tự thời gian" }
          rule: { es: [{ term: nada más }, " lleva infinitivo y ", { term: una vez }, ", participio"], en: [{ term: "nada más" }, " takes an infinitive and ", { term: "una vez" }, ", a participle"], uk: [{ term: "nada más" }, " вимагає інфінітива, а ", { term: "una vez" }, " — дієприкметника"], pt: [{ term: "nada más" }, " leva infinitivo e ", { term: "una vez" }, ", particípio"], fr: [{ term: "nada más" }, " se construit avec l’infinitif et ", { term: "una vez" }, " avec le participe passé"], de: [{ term: "nada más" }, " steht mit dem Infinitiv, ", { term: "una vez" }, " mit dem Partizip"], it: [{ term: "nada más" }, " vuole l'infinito e ", { term: "una vez" }, " il participio"], pl: [{ term: "nada más" }, " łączy się z bezokolicznikiem, a ", { term: "una vez" }, " z imiesłowem"], tr: [{ term: "nada más" }, " mastarla, ", { term: "una vez" }, " ise participio ile kullanılır"], id: [{ term: "nada más" }, " memakai infinitif dan ", { term: "una vez" }, " memakai partisip"], vi: [{ term: "nada más" }, " đi với nguyên mẫu còn ", { term: "una vez" }, " đi với quá khứ phân từ"] }
          ex: { examples: [[{ target: "Nada más llegar" }, ", nos pusimos a comer."], [{ target: "Una vez estudiado el problema" }, ", decidiremos."]] }
          tr: { en: { examples: ["As soon as we arrived, we started to eat.", "Once the problem has been studied, we will decide."] }, uk: { examples: ["Щойно ми приїхали, ми взялися їсти.", "Коли проблему буде вивчено, ми вирішимо."] }, pt: { examples: ["Assim que chegamos, nos pusemos a comer.", "Uma vez estudado o problema, decidiremos."] }, fr: { examples: ["Dès notre arrivée, nous nous sommes mis à manger.", "Une fois le problème étudié, nous déciderons."] }, de: { examples: ["Sobald wir angekommen waren, fingen wir an zu essen.", "Sobald das Problem untersucht ist, entscheiden wir."] }, it: { examples: ["Appena arrivati, ci siamo messi a mangiare.", "Una volta studiato il problema, decideremo."] }, pl: { examples: ["Zaraz po przyjeździe zabraliśmy się do jedzenia.", "Gdy problem zostanie przeanalizowany, zdecydujemy."] }, tr: { examples: ["Varır varmaz yemek yemeye koyulduk.", "Sorun incelendikten sonra karar vereceğiz."] }, id: { examples: ["Begitu tiba, kami langsung mulai makan.", "Setelah masalahnya dipelajari, kami akan memutuskan."] }, vi: { examples: ["Vừa đến nơi, chúng tôi bắt đầu ăn.", "Khi vấn đề đã được nghiên cứu xong, chúng tôi sẽ quyết định."] } }
        - level: C1
          point: { es: Infinitivo independiente, en: "Independent infinitive", uk: "Самостійний інфінітив", pt: "Infinitivo independente", fr: "Infinitif indépendant", de: "Selbstständiger Infinitiv", it: "Infinito indipendente", pl: "Bezokolicznik samodzielny", tr: "Bağımsız mastar", id: "Infinitif mandiri", vi: "Nguyên mẫu độc lập" }
          rule: { es: "deseo o rechazo en una exclamación o una pregunta", en: "wish or refusal in an exclamation or a question", uk: "бажання або відмова у вигуку чи запитанні", pt: "desejo ou recusa em uma exclamação ou pergunta", fr: "souhait ou refus dans une exclamation ou une question", de: "Wunsch oder Ablehnung in einem Ausruf oder einer Frage", it: "desiderio o rifiuto in un'esclamazione o in una domanda", pl: "życzenie lub odrzucenie w wykrzyknieniu albo pytaniu", tr: "ünlemde ya da soruda istek veya ret", id: "keinginan atau penolakan dalam seruan atau pertanyaan", vi: "mong muốn hoặc từ chối trong câu cảm thán hoặc câu hỏi" }
          ex: ["¡", { target: Descansar }, " tres meses!"]
          tr: { en: "I wish I could rest for three months!", uk: "Відпочити б три місяці!", pt: "Quem me dera descansar três meses!", fr: "Pouvoir se reposer trois mois !", de: "Könnte ich doch drei Monate lang ausruhen!", it: "Potessi riposare tre mesi!", pl: "Żeby tak odpocząć trzy miesiące!", tr: "Üç ay dinlenebilmek!", id: "Andai bisa beristirahat tiga bulan!", vi: "Giá mà được nghỉ ngơi ba tháng!" }
        - level: C1
          point: { es: Gerundio, en: "Gerund", uk: "Герундій", pt: "Gerúndio", fr: "Gérondif", de: "Gerundium", it: "Gerundio", pl: "Gerundio", tr: "Gerundio", id: "Gerundio", vi: "Gerundio" }
          rule: { es: "modo, tiempo o condición; también independiente", en: "manner, time or condition; also independent", uk: "спосіб, час або умова; також самостійний", pt: "modo, tempo ou condição; também independente", fr: "manière, temps ou condition ; aussi indépendant", de: "Art und Weise, Zeit oder Bedingung; auch selbstständig", it: "modo, tempo o condizione; anche indipendente", pl: "sposób, czas lub warunek; także samodzielny", tr: "biçim, zaman ya da koşul; bağımsız da olabilir", id: "cara, waktu, atau syarat; juga bisa mandiri", vi: "cách thức, thời gian hoặc điều kiện; cũng có thể độc lập" }
          ex: ["Me pidieron perdón ", { target: cantando }, "."]
          tr: { en: "They apologised to me by singing.", uk: "Вони попросили в мене вибачення, співаючи.", pt: "Pediram-me perdão cantando.", fr: "Ils m’ont demandé pardon en chantant.", de: "Sie baten mich singend um Verzeihung.", it: "Mi hanno chiesto scusa cantando.", pl: "Prosili mnie o wybaczenie, śpiewając.", tr: "Benden şarkı söyleyerek özür dilediler.", id: "Mereka meminta maaf kepada saya sambil bernyanyi.", vi: "Họ xin lỗi tôi bằng cách hát." }
        - level: C1
          point: { es: Participio absoluto, en: "Absolute participle", uk: "Абсолютний дієприкметник", pt: "Particípio absoluto", fr: "Participe absolu", de: "Absolutes Partizip", it: "Participio assoluto", pl: "Imiesłów absolutny", tr: "Mutlak participio", id: "Partisip absolut", vi: "Quá khứ phân từ tuyệt đối" }
          rule: { es: "el participio concuerda con su sujeto", en: "the participle agrees with its subject", uk: "дієприкметник узгоджується зі своїм підметом", pt: "o particípio concorda com o seu sujeito", fr: "le participe passé s’accorde avec son sujet", de: "das Partizip richtet sich nach seinem Subjekt", it: "il participio concorda con il suo soggetto", pl: "imiesłów zgadza się ze swoim podmiotem", tr: "participio kendi öznesiyle uyum sağlar", id: "partisip menyesuaikan dengan subjeknya", vi: "quá khứ phân từ hòa hợp với chủ ngữ của nó" }
          ex: [{ target: "Terminada la investigación" }, ", se cerró el caso."]
          tr: { en: "Once the investigation was over, the case was closed.", uk: "Після завершення розслідування справу закрили.", pt: "Terminada a investigação, o caso foi encerrado.", fr: "L’enquête terminée, l’affaire a été classée.", de: "Nach Abschluss der Untersuchung wurde der Fall geschlossen.", it: "Terminata l'indagine, il caso è stato chiuso.", pl: "Po zakończeniu śledztwa sprawę zamknięto.", tr: "Soruşturma tamamlanınca dava kapatıldı.", id: "Setelah penyelidikan selesai, kasus itu ditutup.", vi: "Cuộc điều tra kết thúc, vụ án được đóng lại." }
        - level: C1
          point: { es: Verbo de percepción, en: "Perception verb", uk: "Дієслово сприйняття", pt: "Verbo de percepção", fr: "Verbe de perception", de: "Wahrnehmungsverb", it: "Verbo di percezione", pl: "Czasownik percepcji", tr: "Algı fiili", id: "Kata kerja persepsi", vi: "Động từ tri giác" }
          rule: { es: "el infinitivo muestra la acción completa y el gerundio, en curso", en: "the infinitive shows the complete action and the gerund, the action in progress", uk: "інфінітив показує завершену дію, а герундій — дію, що триває", pt: "o infinitivo mostra a ação completa e o gerúndio, a ação em curso", fr: "l’infinitif montre l’action complète et le gérondif, l’action en cours", de: "der Infinitiv zeigt die vollständige Handlung, das Gerundium die laufende", it: "l'infinito mostra l'azione completa e il gerundio quella in corso", pl: "bezokolicznik pokazuje czynność zakończoną, a gerundio czynność trwającą", tr: "mastar eylemi bütünüyle, gerundio ise sürmekte olan eylemi gösterir", id: "infinitif menunjukkan tindakan yang utuh dan gerundio tindakan yang sedang berlangsung", vi: "nguyên mẫu cho thấy hành động trọn vẹn, còn gerundio cho thấy hành động đang diễn ra" }
          ex: { examples: [["La vi ", { target: bajar }, " del autobús."], ["La vi ", { target: bajando }, " del autobús."]] }
          tr: { en: { examples: ["I saw her get off the bus.", "I saw her getting off the bus."] }, uk: { examples: ["Я бачив, як вона зійшла з автобуса.", "Я бачив, як вона сходила з автобуса."] }, pt: { examples: ["Eu a vi descer do ônibus.", "Eu a vi descendo do ônibus."] }, fr: { examples: ["Je l’ai vue descendre du bus.", "Je l’ai vue en train de descendre du bus."] }, de: { examples: ["Ich sah sie aus dem Bus steigen.", "Ich sah sie gerade aus dem Bus steigen."] }, it: { examples: ["L'ho vista scendere dall'autobus.", "L'ho vista mentre scendeva dall'autobus."] }, pl: { examples: ["Widziałem, jak wysiadła z autobusu.", "Widziałem, jak wysiadała z autobusu."] }, tr: { examples: ["Onun otobüsten indiğini gördüm.", "Onun otobüsten inmekte olduğunu gördüm."] }, id: { examples: ["Saya melihatnya turun dari bus.", "Saya melihatnya sedang turun dari bus."] }, vi: { examples: ["Tôi đã thấy cô ấy xuống xe buýt.", "Tôi đã thấy cô ấy đang xuống xe buýt."] } }
        - level: C2
          point: { es: Gerundio, en: "Gerund", uk: "Герундій", pt: "Gerúndio", fr: "Gérondif", de: "Gerundium", it: "Gerundio", pl: "Gerundio", tr: "Gerundio", id: "Gerundio", vi: "Gerundio" }
          rule: { es: "causa y concesión", en: "cause and concession", uk: "причина й допустовість", pt: "causa e concessão", fr: "cause et concession", de: "Grund und Konzession", it: "causa e concessione", pl: "przyczyna i przyzwolenie", tr: "neden ve ödün", id: "sebab dan konsesi", vi: "nguyên nhân và nhượng bộ" }
          ex: [{ target: "Lloviendo y todo" }, " salió sin paraguas."]
          tr: { en: "Even with it raining, he went out without an umbrella.", uk: "Навіть попри дощ, він вийшов без парасольки.", pt: "Mesmo chovendo, saiu sem guarda-chuva.", fr: "Même s’il pleuvait, il est sorti sans parapluie.", de: "Obwohl es regnete, ging er ohne Regenschirm hinaus.", it: "Anche se pioveva, è uscito senza ombrello.", pl: "Mimo że padało, wyszedł bez parasola.", tr: "Yağmur yağmasına rağmen şemsiyesiz çıktı.", id: "Meskipun hujan, dia keluar tanpa payung.", vi: "Dù trời đang mưa, anh ấy vẫn ra ngoài mà không mang ô." }
        - level: C2
          point: { es: Participio con nexo, en: "Participle with a connector", uk: "Дієприкметник зі сполучником", pt: "Particípio com conector", fr: "Participe passé avec connecteur", de: "Partizip mit Konnektor", it: "Participio con connettivo", pl: "Imiesłów ze spójnikiem", tr: "Bağlayıcılı participio", id: "Partisip dengan penghubung", vi: "Quá khứ phân từ có từ nối" }
          rule: { es: [{ term: hasta }, " y ", { term: apenas }, " preceden al participio absoluto"], en: [{ term: "hasta" }, " and ", { term: "apenas" }, " come before the absolute participle"], uk: [{ term: "hasta" }, " і ", { term: "apenas" }, " стоять перед абсолютним дієприкметником"], pt: [{ term: "hasta" }, " e ", { term: "apenas" }, " precedem o particípio absoluto"], fr: [{ term: "hasta" }, " et ", { term: "apenas" }, " précèdent le participe absolu"], de: [{ term: "hasta" }, " und ", { term: "apenas" }, " stehen vor dem absoluten Partizip"], it: [{ term: "hasta" }, " e ", { term: "apenas" }, " precedono il participio assoluto"], pl: [{ term: "hasta" }, " i ", { term: "apenas" }, " stoją przed imiesłowem absolutnym"], tr: [{ term: "hasta" }, " ve ", { term: "apenas" }, " mutlak participio yapısından önce gelir"], id: [{ term: "hasta" }, " dan ", { term: "apenas" }, " mendahului partisip absolut"], vi: [{ term: "hasta" }, " và ", { term: "apenas" }, " đứng trước quá khứ phân từ tuyệt đối"] }
          ex: [{ target: "Hasta concluidas las tres horas" }, " no nos pudimos mover."]
          tr: { en: "Until the three hours were over, we could not move.", uk: "Доки не минуло три години, ми не могли поворухнутися.", pt: "Até que se completassem as três horas, não pudemos nos mover.", fr: "Jusqu’à la fin des trois heures, nous n’avons pas pu bouger.", de: "Bis die drei Stunden vorbei waren, konnten wir uns nicht bewegen.", it: "Fino al termine delle tre ore non siamo riusciti a muoverci.", pl: "Dopóki nie minęły trzy godziny, nie mogliśmy się ruszyć.", tr: "Üç saat dolana kadar kıpırdayamadık.", id: "Sampai tiga jam itu berlalu, kami tidak bisa bergerak.", vi: "Cho đến khi ba tiếng trôi qua, chúng tôi không thể nhúc nhích." }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: "la acción posterior lleva un verbo conjugado", en: "the later action takes a conjugated verb", uk: "подальша дія виражається відмінюваним дієсловом", pt: "a ação posterior leva um verbo conjugado", fr: "l’action postérieure prend un verbe conjugué", de: "die nachfolgende Handlung steht mit einem konjugierten Verb", it: "l'azione successiva vuole un verbo coniugato", pl: "czynność późniejsza wymaga czasownika w formie osobowej", tr: "sonraki eylem çekimli bir fiille kurulur", id: "tindakan yang terjadi kemudian memakai kata kerja yang dikonjugasi", vi: "hành động xảy ra sau dùng một động từ chia" }
          ex: ["Abrí la puerta ", { target: "y me encontré" }, " con él."]
          tr: { en: "I opened the door and ran into him.", uk: "Я відчинив двері й наткнувся на нього.", pt: "Abri a porta e dei de cara com ele.", fr: "J’ai ouvert la porte et je suis tombé sur lui.", de: "Ich öffnete die Tür und stand ihm plötzlich gegenüber.", it: "Ho aperto la porta e mi sono ritrovato davanti a lui.", pl: "Otworzyłem drzwi i natknąłem się na niego.", tr: "Kapıyı açtım ve onunla karşılaştım.", id: "Saya membuka pintu dan bertemu dengannya.", vi: "Tôi mở cửa và bắt gặp anh ấy." }

sections:
  - title: { es: "Infinitivo: sujeto, valor verbal y valor nominal", en: "Infinitive: subject, verbal value and nominal value", uk: "Інфінітив: підмет, дієслівне й іменне значення", pt: "Infinitivo: sujeito, valor verbal e valor nominal", fr: "L’infinitif : sujet, valeur verbale et valeur nominale", de: "Infinitiv: Subjekt, verbaler und nominaler Wert", it: "Infinito: soggetto, valore verbale e valore nominale", pl: "Bezokolicznik: podmiot, wartość czasownikowa i rzeczownikowa", tr: "Mastar: özne, fiil değeri ve isim değeri", id: "Infinitif: subjek, nilai verbal, dan nilai nominal", vi: "Nguyên mẫu: chủ ngữ, giá trị động từ và giá trị danh từ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { es: Estructura, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            form: { pattern: [{ slot: verb }, { slot: { es: complemento, en: "object", uk: "додаток", pt: "complemento", fr: "complément", de: "Objekt", it: "complemento", pl: "dopełnienie", tr: "nesne", id: "objek", vi: "tân ngữ" } }, { slot: infinitive }] }
            rule: { es: "El sujeto sobrentendido del infinitivo es el complemento del verbo principal.", en: "The understood subject of the infinitive is the object of the main verb.", uk: "Підмет інфінітива, що мається на увазі, — це додаток головного дієслова.", pt: "O sujeito subentendido do infinitivo é o complemento do verbo principal.", fr: "Le sujet sous-entendu de l’infinitif est le complément du verbe principal.", de: "Das mitgedachte Subjekt des Infinitivs ist das Objekt des Hauptverbs.", it: "Il soggetto sottinteso dell'infinito è il complemento del verbo principale.", pl: "Domyślnym podmiotem bezokolicznika jest dopełnienie czasownika głównego.", tr: "Mastarın örtük öznesi, ana fiilin nesnesidir.", id: "Subjek infinitif yang tersirat adalah objek dari kata kerja utama.", vi: "Chủ ngữ ngầm hiểu của nguyên mẫu là tân ngữ của động từ chính." }
            ex: { examples: [["El profesor recomendó al estudiante ", { target: "trabajar más" }, "."], ["Mi madre me prohibió ", { target: "salir de noche" }, "."]] }
            tr: { en: { examples: ["The teacher advised the student to work harder.", "My mother forbade me to go out at night."] }, uk: { examples: ["Викладач порадив студентові працювати більше.", "Мати заборонила мені виходити з дому вночі."] }, pt: { examples: ["O professor recomendou ao estudante trabalhar mais.", "Minha mãe me proibiu de sair à noite."] }, fr: { examples: ["Le professeur a recommandé à l’étudiant de travailler plus.", "Ma mère m’a interdit de sortir le soir."] }, de: { examples: ["Der Lehrer empfahl dem Studenten, mehr zu arbeiten.", "Meine Mutter verbot mir, abends auszugehen."] }, it: { examples: ["Il professore ha consigliato allo studente di lavorare di più.", "Mia madre mi ha proibito di uscire la sera."] }, pl: { examples: ["Nauczyciel poradził studentowi, żeby więcej pracował.", "Matka zabroniła mi wychodzić wieczorem."] }, tr: { examples: ["Öğretmen öğrenciye daha çok çalışmasını önerdi.", "Annem geceleri dışarı çıkmamı yasakladı."] }, id: { examples: ["Guru menyarankan siswa itu bekerja lebih keras.", "Ibu saya melarang saya keluar malam."] }, vi: { examples: ["Thầy giáo khuyên học sinh làm việc chăm chỉ hơn.", "Mẹ tôi cấm tôi đi ra ngoài vào ban đêm."] } }
          - level: B2
            form: { pattern: [{ term: haber }, { slot: past participle }] }
            rule: { es: "El infinitivo compuesto expresa una acción anterior a la del verbo principal.", en: "The perfect infinitive expresses an action before that of the main verb.", uk: "Перфектний інфінітив виражає дію, що передує дії головного дієслова.", pt: "O infinitivo composto expressa uma ação anterior à do verbo principal.", fr: "L’infinitif passé exprime une action antérieure à celle du verbe principal.", de: "Der Infinitiv Perfekt drückt eine Handlung vor der des Hauptverbs aus.", it: "L'infinito composto esprime un'azione anteriore a quella del verbo principale.", pl: "Bezokolicznik złożony wyraża czynność wcześniejszą niż czynność czasownika głównego.", tr: "Bileşik mastar, ana fiilden önce gerçekleşen bir eylemi anlatır.", id: "Infinitif majemuk menyatakan tindakan yang terjadi sebelum tindakan kata kerja utama.", vi: "Nguyên mẫu hoàn thành diễn tả hành động xảy ra trước hành động của động từ chính." }
            ex: { examples: [["El profesor le regañó por no ", { target: "haber estudiado" }, "."], ["Me alegro de ", { target: "haberte conocido" }, "."]] }
            tr: { en: { examples: ["The teacher scolded him for not having studied.", "I'm glad to have met you."] }, uk: { examples: ["Викладач насварив його за те, що він не вчився.", "Я радий, що з тобою познайомився."] }, pt: { examples: ["O professor o repreendeu por não ter estudado.", "Fico feliz por ter conhecido você."] }, fr: { examples: ["Le professeur l’a grondé de ne pas avoir étudié.", "Je suis content de t’avoir rencontré."] }, de: { examples: ["Der Lehrer tadelte ihn, weil er nicht gelernt hatte.", "Ich freue mich, dich kennengelernt zu haben."] }, it: { examples: ["Il professore lo ha rimproverato per non aver studiato.", "Sono contento di averti conosciuto."] }, pl: { examples: ["Nauczyciel zbeształ go za to, że się nie uczył.", "Cieszę się, że cię poznałem."] }, tr: { examples: ["Öğretmen, ders çalışmadığı için onu azarladı.", "Seninle tanıştığıma sevindim."] }, id: { examples: ["Guru menegurnya karena tidak belajar.", "Saya senang telah mengenalmu."] }, vi: { examples: ["Thầy giáo mắng cậu ấy vì đã không học bài.", "Tôi vui vì đã quen biết bạn."] } }
          - level: B2
            form: { es: Respuesta breve, en: "Short answer", uk: "Коротка відповідь", pt: "Resposta curta", fr: "Réponse brève", de: "Kurzantwort", it: "Risposta breve", pl: "Krótka odpowiedź", tr: "Kısa yanıt", id: "Jawaban singkat", vi: "Câu trả lời ngắn" }
            rule: { es: "La preposición que pide el verbo precede al infinitivo.", en: "The preposition that the verb requires comes before the infinitive.", uk: "Прийменник, якого вимагає дієслово, стоїть перед інфінітивом.", pt: "A preposição que o verbo pede vem antes do infinitivo.", fr: "La préposition que demande le verbe précède l’infinitif.", de: "Die Präposition, die das Verb verlangt, steht vor dem Infinitiv.", it: "La preposizione richiesta dal verbo precede l'infinito.", pl: "Przyimek, którego wymaga czasownik, stoi przed bezokolicznikiem.", tr: "Fiilin istediği edat mastardan önce gelir.", id: "Kata depan yang dituntut kata kerja berada di depan infinitif.", vi: "Giới từ mà động từ yêu cầu đứng trước nguyên mẫu." }
            ex: { exchange: ["¿Te ayudo?", ["Sí, ", { target: "a hacer" }, " este ejercicio."]] }
            tr: { en: { exchange: ["Shall I help you?", "Yes, to do this exercise."] }, uk: { exchange: ["Допомогти тобі?", "Так, виконати цю вправу."] }, pt: { exchange: ["Ajudo você?", "Sim, a fazer este exercício."] }, fr: { exchange: ["Je t’aide ?", "Oui, à faire cet exercice."] }, de: { exchange: ["Soll ich dir helfen?", "Ja, diese Übung zu machen."] }, it: { exchange: ["Ti aiuto?", "Sì, a fare questo esercizio."] }, pl: { exchange: ["Pomóc ci?", "Tak, w zrobieniu tego ćwiczenia."] }, tr: { exchange: ["Sana yardım edeyim mi?", "Evet, bu alıştırmayı yapmak için."] }, id: { exchange: ["Mau saya bantu?", "Ya, untuk mengerjakan latihan ini."] }, vi: { exchange: ["Để tôi giúp bạn nhé?", "Vâng, làm bài tập này."] } }
          - level: B2
            form: { pattern: [{ slot: verb }, { slot: { es: preposición, en: "preposition", uk: "прийменник", pt: "preposição", fr: "préposition", de: "Präposition", it: "preposizione", pl: "przyimek", tr: "edat", id: "kata depan", vi: "giới từ" } }, { slot: infinitive }] }
            rule: { es: "El infinitivo completa un verbo que pide preposición.", en: "The infinitive completes a verb that requires a preposition.", uk: "Інфінітив доповнює дієслово, яке вимагає прийменника.", pt: "O infinitivo completa um verbo que pede preposição.", fr: "L’infinitif complète un verbe qui demande une préposition.", de: "Der Infinitiv ergänzt ein Verb, das eine Präposition verlangt.", it: "L'infinito completa un verbo che richiede una preposizione.", pl: "Bezokolicznik uzupełnia czasownik, który wymaga przyimka.", tr: "Mastar, edat isteyen bir fiili tamamlar.", id: "Infinitif melengkapi kata kerja yang menuntut kata depan.", vi: "Nguyên mẫu bổ nghĩa cho động từ đòi giới từ." }
            ex: { examples: [["El director me invitó ", { target: "a salir" }, " de la sala."], ["Me niego ", { target: "a responder" }, "."]] }
            tr: { en: { examples: ["The director invited me to leave the room.", "I refuse to answer."] }, uk: { examples: ["Директор запропонував мені вийти із зали.", "Я відмовляюся відповідати."] }, pt: { examples: ["O diretor me convidou a sair da sala.", "Recuso-me a responder."] }, fr: { examples: ["Le directeur m’a invité à sortir de la salle.", "Je refuse de répondre."] }, de: { examples: ["Der Direktor forderte mich auf, den Saal zu verlassen.", "Ich weigere mich zu antworten."] }, it: { examples: ["Il direttore mi ha invitato a uscire dalla sala.", "Mi rifiuto di rispondere."] }, pl: { examples: ["Dyrektor poprosił, żebym wyszedł z sali.", "Odmawiam odpowiedzi."] }, tr: { examples: ["Müdür beni salondan çıkmaya davet etti.", "Cevap vermeyi reddediyorum."] }, id: { examples: ["Direktur mengajak saya keluar dari ruangan.", "Saya menolak menjawab."] }, vi: { examples: ["Giám đốc mời tôi ra khỏi phòng.", "Tôi từ chối trả lời."] } }
          - level: B2
            form: { pattern: [{ term: ser }, { slot: infinitive }] }
            rule: { es: "Con ser, el infinitivo hace de atributo.", en: "After ser, the infinitive is the subject complement.", uk: "Після ser інфінітив виконує роль іменної частини присудка.", pt: "Com ser, o infinitivo faz o papel de predicativo do sujeito.", fr: "Avec ser, l’infinitif joue le rôle d’attribut du sujet.", de: "Nach ser dient der Infinitiv als Prädikativ.", it: "Con ser, l'infinito fa da predicativo del soggetto.", pl: "Przy ser bezokolicznik pełni funkcję orzecznika.", tr: "Ser ile mastar, ad yüklemi olur.", id: "Dengan ser, infinitif berfungsi sebagai pelengkap subjek.", vi: "Với ser, nguyên mẫu làm vị ngữ." }
            ex: { examples: [["Eso es ", { target: bailar }, "."], ["Lo importante es ", { target: participar }, "."]] }
            tr: { en: { examples: ["That is dancing.", "The important thing is to take part."] }, uk: { examples: ["Це і є танці.", "Головне — брати участь."] }, pt: { examples: ["Isso é dançar.", "O importante é participar."] }, fr: { examples: ["Ça, c’est danser.", "L’important, c’est de participer."] }, de: { examples: ["Das ist Tanzen.", "Wichtig ist, teilzunehmen."] }, it: { examples: ["Questo è ballare.", "L'importante è partecipare."] }, pl: { examples: ["To jest taniec.", "Ważne jest, żeby uczestniczyć."] }, tr: { examples: ["İşte dans etmek bu.", "Önemli olan katılmaktır."] }, id: { examples: ["Itulah yang disebut menari.", "Yang penting adalah ikut serta."] }, vi: { examples: ["Đó mới là nhảy.", "Điều quan trọng là tham gia."] } }
          - level: B2
            variety: es-419
            form: { pattern: [{ slot: { es: preposición, en: "preposition", uk: "прийменник", pt: "preposição", fr: "préposition", de: "Präposition", it: "preposizione", pl: "przyimek", tr: "edat", id: "kata depan", vi: "giới từ" } }, { slot: subject }, { slot: infinitive }] }
            rule: { es: "En el Caribe, el sujeto precede al infinitivo tras una preposición.", en: "In the Caribbean, the subject comes before the infinitive after a preposition.", uk: "У Карибському регіоні підмет стоїть перед інфінітивом після прийменника.", pt: "No Caribe, o sujeito vem antes do infinitivo depois de uma preposição.", fr: "Dans les Caraïbes, le sujet précède l’infinitif après une préposition.", de: "In der Karibik steht das Subjekt nach einer Präposition vor dem Infinitiv.", it: "Nei Caraibi, dopo una preposizione il soggetto precede l'infinito.", pl: "W regionie Karaibów podmiot stoi przed bezokolicznikiem po przyimku.", tr: "Karayipler’de edattan sonra özne mastardan önce gelir.", id: "Di Karibia, subjek berada sebelum infinitif setelah kata depan.", vi: "Ở vùng Caribe, sau giới từ chủ ngữ đứng trước nguyên mẫu." }
            ex: { examples: [["Al ", { target: "yo llegar" }, ", ya habían cenado."], ["Con ", { target: "ella volver" }, ", todo cambió."], ["Sin ", { target: "tú querer" }, ", rompiste el plato."]] }
            tr: { en: { examples: ["When I arrived, they had already had dinner.", "When she came back, everything changed.", "You broke the plate without meaning to."] }, uk: { examples: ["Коли я прийшов, вони вже повечеряли.", "Коли вона повернулася, усе змінилося.", "Ти розбив тарілку ненавмисно."] }, pt: { examples: ["Quando eu cheguei, eles já tinham jantado.", "Quando ela voltou, tudo mudou.", "Sem querer, você quebrou o prato."] }, fr: { examples: ["Quand je suis arrivé, ils avaient déjà dîné.", "Quand elle est revenue, tout a changé.", "Sans le vouloir, tu as cassé l’assiette."] }, de: { examples: ["Als ich ankam, hatten sie schon zu Abend gegessen.", "Als sie zurückkam, änderte sich alles.", "Ohne es zu wollen, hast du den Teller zerbrochen."] }, it: { examples: ["Quando sono arrivato, avevano già cenato.", "Quando lei è tornata, tutto è cambiato.", "Senza volerlo, hai rotto il piatto."] }, pl: { examples: ["Kiedy przyszedłem, już zjedli kolację.", "Kiedy wróciła, wszystko się zmieniło.", "Stłukłeś talerz niechcący."] }, tr: { examples: ["Ben geldiğimde onlar akşam yemeğini yemişti bile.", "O geri dönünce her şey değişti.", "İstemeden tabağı kırdın."] }, id: { examples: ["Saat saya tiba, mereka sudah makan malam.", "Saat dia kembali, semuanya berubah.", "Tanpa sengaja, kamu memecahkan piringnya."] }, vi: { examples: ["Khi tôi đến, họ đã ăn tối rồi.", "Khi cô ấy quay lại, mọi thứ đã thay đổi.", "Bạn làm vỡ cái đĩa mà không cố ý."] } }
          - level: C1
            form: { es: Infinitivo independiente, en: "Independent infinitive", uk: "Самостійний інфінітив", pt: "Infinitivo independente", fr: "Infinitif indépendant", de: "Selbstständiger Infinitiv", it: "Infinito indipendente", pl: "Bezokolicznik samodzielny", tr: "Bağımsız mastar", id: "Infinitif mandiri", vi: "Nguyên mẫu độc lập" }
            rule: { es: "Una exclamación con infinitivo simple o compuesto expresa un deseo.", en: "An exclamation with a simple or perfect infinitive expresses a wish.", uk: "Вигук із простим або перфектним інфінітивом виражає бажання.", pt: "Uma exclamação com infinitivo simples ou composto expressa um desejo.", fr: "Une exclamation avec un infinitif simple ou passé exprime un souhait.", de: "Ein Ausruf mit einfachem Infinitiv oder Infinitiv Perfekt drückt einen Wunsch aus.", it: "Un'esclamazione con infinito semplice o composto esprime un desiderio.", pl: "Wykrzyknienie z bezokolicznikiem prostym lub złożonym wyraża życzenie.", tr: "Yalın ya da bileşik mastarla kurulan ünlem bir istek bildirir.", id: "Seruan dengan infinitif sederhana atau majemuk menyatakan keinginan.", vi: "Câu cảm thán có nguyên mẫu đơn hoặc nguyên mẫu hoàn thành diễn tả mong muốn." }
            ex: { examples: [["¡", { target: Descansar }, " tres meses!"], ["¡", { target: "Haber descansado" }, " tres meses!"]] }
            tr: { en: { examples: ["I wish I could rest for three months!", "I wish I had rested for three months!"] }, uk: { examples: ["Відпочити б три місяці!", "Якби ж я відпочив три місяці!"] }, pt: { examples: ["Quem me dera descansar três meses!", "Quem me dera ter descansado três meses!"] }, fr: { examples: ["Pouvoir se reposer trois mois !", "Avoir pu se reposer trois mois !"] }, de: { examples: ["Könnte ich doch drei Monate lang ausruhen!", "Hätte ich doch drei Monate lang ausgeruht!"] }, it: { examples: ["Potessi riposare tre mesi!", "Avessi riposato tre mesi!"] }, pl: { examples: ["Żeby tak odpocząć trzy miesiące!", "Gdybym tylko odpoczął trzy miesiące!"] }, tr: { examples: ["Üç ay dinlenebilmek!", "Üç ay dinlenmiş olsaydım!"] }, id: { examples: ["Andai bisa beristirahat tiga bulan!", "Andai saya sudah beristirahat tiga bulan!"] }, vi: { examples: ["Giá mà được nghỉ ngơi ba tháng!", "Giá mà đã được nghỉ ngơi ba tháng!"] } }
          - level: C1
            form: { es: Infinitivo independiente en pregunta, en: "Independent infinitive in a question", uk: "Самостійний інфінітив у запитанні", pt: "Infinitivo independente em pergunta", fr: "Infinitif indépendant dans une question", de: "Selbstständiger Infinitiv in der Frage", it: "Infinito indipendente nella domanda", pl: "Bezokolicznik samodzielny w pytaniu", tr: "Soruda bağımsız mastar", id: "Infinitif mandiri dalam pertanyaan", vi: "Nguyên mẫu độc lập trong câu hỏi" }
            rule: { es: "Una pregunta con infinitivo y sujeto expreso rechaza una idea.", en: "A question with an infinitive and an expressed subject rejects an idea.", uk: "Запитання з інфінітивом і явним підметом відкидає ідею.", pt: "Uma pergunta com infinitivo e sujeito expresso rejeita uma ideia.", fr: "Une question avec un infinitif et un sujet exprimé rejette une idée.", de: "Eine Frage mit Infinitiv und ausdrücklich genanntem Subjekt weist eine Idee zurück.", it: "Una domanda con infinito e soggetto espresso respinge un'idea.", pl: "Pytanie z bezokolicznikiem i wyrażonym podmiotem odrzuca pomysł.", tr: "Mastar ve açıkça belirtilmiş özne içeren bir soru, bir fikri reddeder.", id: "Pertanyaan dengan infinitif dan subjek yang disebutkan menolak suatu gagasan.", vi: "Câu hỏi có nguyên mẫu và chủ ngữ nêu rõ bác bỏ một ý kiến." }
            ex: ["¿", { target: "Decirle yo lo que pienso" }, "? Ni loco."]
            tr: { en: "Me, tell him what I think? No way.", uk: "Щоб я йому сказав, що думаю? Ні за що.", pt: "Eu dizer a ele o que penso? Nem louco.", fr: "Moi, lui dire ce que je pense ? Jamais de la vie.", de: "Ich soll ihm sagen, was ich denke? Niemals.", it: "Dirgli io quello che penso? Neanche per sogno.", pl: "Ja mam mu powiedzieć, co myślę? Nigdy w życiu.", tr: "Ona ne düşündüğümü ben mi söyleyeyim? Asla.", id: "Saya mengatakan padanya apa yang saya pikirkan? Mana mungkin.", vi: "Tôi mà nói cho anh ta biết tôi nghĩ gì ư? Đời nào." }
          - level: C1
            form: { pattern: [{ slot: { es: "nombre o adjetivo", en: "noun or adjective", uk: "іменник або прикметник", pt: "substantivo ou adjetivo", fr: "nom ou adjectif", de: "Nomen oder Adjektiv", it: "sostantivo o aggettivo", pl: "rzeczownik lub przymiotnik", tr: "isim ya da sıfat", id: "kata benda atau kata sifat", vi: "danh từ hoặc tính từ" } }, { slot: { es: preposición, en: "preposition", uk: "прийменник", pt: "preposição", fr: "préposition", de: "Präposition", it: "preposizione", pl: "przyimek", tr: "edat", id: "kata depan", vi: "giới từ" } }, { slot: infinitive }] }
            rule: { es: "El infinitivo completa a un nombre o a un adjetivo mediante una preposición.", en: "A noun or an adjective takes an infinitive through a preposition.", uk: "Інфінітив доповнює іменник або прикметник за допомогою прийменника.", pt: "O infinitivo completa um substantivo ou um adjetivo por meio de uma preposição.", fr: "L’infinitif complète un nom ou un adjectif au moyen d’une préposition.", de: "Der Infinitiv ergänzt ein Nomen oder ein Adjektiv mithilfe einer Präposition.", it: "L'infinito completa un sostantivo o un aggettivo tramite una preposizione.", pl: "Bezokolicznik uzupełnia rzeczownik lub przymiotnik za pomocą przyimka.", tr: "Mastar, bir isim ya da sıfatı edat aracılığıyla tamamlar.", id: "Infinitif melengkapi kata benda atau kata sifat melalui kata depan.", vi: "Nguyên mẫu bổ nghĩa cho danh từ hoặc tính từ thông qua giới từ." }
            ex: { examples: [["Tiene ganas ", { target: "de viajar" }, "."], ["Estoy cansado ", { target: "de esperar" }, "."]] }
            tr: { en: { examples: ["She feels like travelling.", "I'm tired of waiting."] }, uk: { examples: ["Їй хочеться подорожувати.", "Я втомився чекати."] }, pt: { examples: ["Ela está com vontade de viajar.", "Estou cansado de esperar."] }, fr: { examples: ["Elle a envie de voyager.", "J’en ai assez d’attendre."] }, de: { examples: ["Sie hat Lust zu reisen.", "Ich bin es leid zu warten."] }, it: { examples: ["Ha voglia di viaggiare.", "Sono stanco di aspettare."] }, pl: { examples: ["Ma ochotę podróżować.", "Mam dość czekania."] }, tr: { examples: ["Seyahat etmek istiyor.", "Beklemekten yoruldum."] }, id: { examples: ["Dia ingin sekali bepergian.", "Saya lelah menunggu."] }, vi: { examples: ["Cô ấy muốn đi du lịch.", "Tôi mệt vì phải chờ đợi."] } }
          - level: C1
            form: { pattern: [{ slot: { es: "antecedente indefinido", en: "indefinite antecedent", uk: "неозначений антецедент", pt: "antecedente indefinido", fr: "antécédent indéfini", de: "unbestimmtes Bezugswort", it: "antecedente indefinito", pl: "nieokreślony poprzednik", tr: "belirsiz öncül", id: "anteseden tak tentu", vi: "tiền ngữ không xác định" } }, { term: que }, { slot: infinitive }] }
            rule: { es: "En una oración de relativo, el infinitivo sigue a un antecedente indefinido.", en: "In a relative clause, the infinitive follows an indefinite antecedent.", uk: "В означальному підрядному реченні інфінітив іде за неозначеним антецедентом.", pt: "Em uma oração relativa, o infinitivo segue um antecedente indefinido.", fr: "Dans une proposition relative, l’infinitif suit un antécédent indéfini.", de: "In einem Relativsatz folgt der Infinitiv einem unbestimmten Bezugswort.", it: "In una proposizione relativa, l'infinito segue un antecedente indefinito.", pl: "W zdaniu względnym bezokolicznik następuje po nieokreślonym poprzedniku.", tr: "İlgi cümlesinde mastar, belirsiz bir öncülün ardından gelir.", id: "Dalam klausa relatif, infinitif mengikuti anteseden yang tak tentu.", vi: "Trong mệnh đề quan hệ, nguyên mẫu đi sau một tiền ngữ không xác định." }
            ex: { examples: [["Tengo un problema ", { target: "que resolver" }, "."], ["No tengo nada ", { target: "que decir" }, "."]] }
            tr: { en: { examples: ["I have a problem to solve.", "I have nothing to say."] }, uk: { examples: ["У мене є проблема, яку треба розв’язати.", "Мені нічого сказати."] }, pt: { examples: ["Tenho um problema para resolver.", "Não tenho nada a dizer."] }, fr: { examples: ["J’ai un problème à résoudre.", "Je n’ai rien à dire."] }, de: { examples: ["Ich habe ein Problem zu lösen.", "Ich habe nichts zu sagen."] }, it: { examples: ["Ho un problema da risolvere.", "Non ho niente da dire."] }, pl: { examples: ["Mam problem do rozwiązania.", "Nie mam nic do powiedzenia."] }, tr: { examples: ["Çözmem gereken bir sorunum var.", "Söyleyecek bir şeyim yok."] }, id: { examples: ["Saya punya masalah yang harus diselesaikan.", "Saya tidak punya apa-apa untuk dikatakan."] }, vi: { examples: ["Tôi có một vấn đề cần giải quyết.", "Tôi không có gì để nói."] } }
          - level: C1
            form: { pattern: [{ term: el }, { slot: infinitive }] }
            rule: { es: "Con artículo, el infinitivo hace de nombre y admite un complemento con de o un adverbio.", en: "With an article, the infinitive acts as a noun and takes a complement with de or an adverb.", uk: "З артиклем інфінітив виконує роль іменника й допускає додаток із de або прислівник.", pt: "Com artigo, o infinitivo faz o papel de substantivo e admite um complemento com de ou um advérbio.", fr: "Avec l’article, l’infinitif joue le rôle d’un nom et admet un complément avec de ou un adverbe.", de: "Mit Artikel wirkt der Infinitiv wie ein Nomen und nimmt eine Ergänzung mit de oder ein Adverb zu sich.", it: "Con l'articolo, l'infinito fa da sostantivo e ammette un complemento con de o un avverbio.", pl: "Z rodzajnikiem bezokolicznik działa jak rzeczownik i przyjmuje dopełnienie z de albo przysłówek.", tr: "Artikelle birlikte mastar isim görevi görür ve de ile bir tümleç ya da bir zarf alabilir.", id: "Dengan artikel, infinitif berfungsi sebagai kata benda dan boleh memiliki pelengkap dengan de atau kata keterangan.", vi: "Có mạo từ, nguyên mẫu đóng vai trò danh từ và có thể đi kèm bổ ngữ với de hoặc một trạng từ." }
            ex: { examples: [["El ", { target: cantar }, " de los pájaros me despierta."], ["El ", { target: "cantar bien" }, " es una ventaja."]] }
            tr: { en: { examples: ["The singing of the birds wakes me up.", "Singing well is an advantage."] }, uk: { examples: ["Спів птахів мене будить.", "Уміння добре співати — це перевага."] }, pt: { examples: ["O cantar dos pássaros me acorda.", "O cantar bem é uma vantagem."] }, fr: { examples: ["Le chant des oiseaux me réveille.", "Bien chanter est un avantage."] }, de: { examples: ["Das Singen der Vögel weckt mich.", "Gut singen zu können ist ein Vorteil."] }, it: { examples: ["Il cantare degli uccelli mi sveglia.", "Il cantare bene è un vantaggio."] }, pl: { examples: ["Śpiew ptaków mnie budzi.", "Dobry śpiew to zaleta."] }, tr: { examples: ["Kuşların şakıması beni uyandırıyor.", "İyi şarkı söylemek bir avantajdır."] }, id: { examples: ["Kicauan burung membangunkan saya.", "Bisa bernyanyi dengan baik adalah sebuah keuntungan."] }, vi: { examples: ["Tiếng hót của chim đánh thức tôi.", "Hát hay là một lợi thế."] } }
          - level: C1
            form: { es: Infinitivo lexicalizado, en: "Lexicalised infinitive", uk: "Лексикалізований інфінітив", pt: "Infinitivo lexicalizado", fr: "Infinitif lexicalisé", de: "Lexikalisierter Infinitiv", it: "Infinito lessicalizzato", pl: "Bezokolicznik zleksykalizowany", tr: "Sözcükleşmiş mastar", id: "Infinitif yang terleksikalisasi", vi: "Nguyên mẫu đã từ vựng hoá" }
            rule: { es: "Algunos infinitivos son nombres con plural y adjetivos.", en: "Some infinitives are nouns, with a plural and adjectives.", uk: "Деякі інфінітиви стали іменниками: мають множину й приймають прикметники.", pt: "Alguns infinitivos são substantivos, com plural e adjetivos.", fr: "Certains infinitifs sont des noms, avec un pluriel et des adjectifs.", de: "Manche Infinitive sind Nomen mit Plural und Adjektiven.", it: "Alcuni infiniti sono sostantivi, con plurale e aggettivi.", pl: "Niektóre bezokoliczniki są rzeczownikami z liczbą mnogą i przymiotnikami.", tr: "Bazı mastarlar çoğul alan ve sıfatlarla kullanılan isimlerdir.", id: "Beberapa infinitif adalah kata benda yang punya bentuk jamak dan kata sifat.", vi: "Một số nguyên mẫu là danh từ, có số nhiều và đi với tính từ." }
            ex: { examples: [["los ", { target: deberes }, " conyugales"], ["los ", { target: quehaceres }, " domésticos"]] }
            tr: { en: { examples: ["marital duties", "household chores"] }, uk: { examples: ["подружні обов’язки", "домашні клопоти"] }, pt: { examples: ["os deveres conjugais", "os afazeres domésticos"] }, fr: { examples: ["les devoirs conjugaux", "les tâches ménagères"] }, de: { examples: ["die ehelichen Pflichten", "die Hausarbeiten"] }, it: { examples: ["i doveri coniugali", "le faccende domestiche"] }, pl: { examples: ["obowiązki małżeńskie", "prace domowe"] }, tr: { examples: ["evlilik görevleri", "ev işleri"] }, id: { examples: ["kewajiban suami istri", "pekerjaan rumah tangga"] }, vi: { examples: ["bổn phận vợ chồng", "việc nhà"] } }
          - level: C2
            form: { es: Sujeto igual al complemento indirecto, en: "Subject equal to the indirect object", uk: "Підмет збігається з непрямим додатком", pt: "Sujeito igual ao complemento indireto", fr: "Sujet identique au COI", de: "Subjekt gleich dem indirekten Objekt", it: "Soggetto uguale al complemento indiretto", pl: "Podmiot taki sam jak dopełnienie dalsze", tr: "Özne dolaylı nesneyle aynı", id: "Subjek sama dengan objek tak langsung", vi: "Chủ ngữ trùng với tân ngữ gián tiếp" }
            rule: { es: "El complemento indirecto es el sujeto del infinitivo; el sujeto expreso es opcional.", en: "The indirect object is the subject of the infinitive; an expressed subject is optional.", uk: "Непрямий додаток є підметом інфінітива; виражений підмет необов’язковий.", pt: "O complemento indireto é o sujeito do infinitivo; o sujeito expresso é opcional.", fr: "Le COI est le sujet de l’infinitif ; le sujet exprimé est facultatif.", de: "Das indirekte Objekt ist das Subjekt des Infinitivs; ein ausdrücklich genanntes Subjekt ist optional.", it: "Il complemento indiretto è il soggetto dell'infinito; il soggetto espresso è facoltativo.", pl: "Dopełnienie dalsze jest podmiotem bezokolicznika; wyrażony podmiot jest opcjonalny.", tr: "Dolaylı nesne mastarın öznesidir; açıkça belirtilen özne isteğe bağlıdır.", id: "Objek tak langsung adalah subjek infinitif; subjek yang disebutkan bersifat opsional.", vi: "Tân ngữ gián tiếp là chủ ngữ của nguyên mẫu; chủ ngữ nêu rõ là tùy chọn." }
            ex: ["Me es difícil ", { optional: yo }, " ", { target: recomendarle }, " un libro bueno."]
            tr: { en: "It is hard for me to recommend a good book to him.", uk: "Мені важко порадити йому гарну книжку.", pt: "É difícil para mim recomendar um bom livro a ele.", fr: "Il m’est difficile de lui recommander un bon livre.", de: "Es fällt mir schwer, ihm ein gutes Buch zu empfehlen.", it: "Mi è difficile consigliargli un buon libro.", pl: "Trudno mi polecić mu dobrą książkę.", tr: "Ona iyi bir kitap önermek benim için zor.", id: "Sulit bagi saya merekomendasikan buku yang bagus kepadanya.", vi: "Tôi khó giới thiệu cho anh ấy một cuốn sách hay." }
          - level: C2
            form: { es: Infinitivo compuesto independiente, en: "Independent perfect infinitive", uk: "Самостійний перфектний інфінітив", pt: "Infinitivo composto independente", fr: "Infinitif passé indépendant", de: "Selbstständiger Infinitiv Perfekt", it: "Infinito composto indipendente", pl: "Bezokolicznik złożony samodzielny", tr: "Bağımsız bileşik mastar", id: "Infinitif majemuk mandiri", vi: "Nguyên mẫu hoàn thành độc lập" }
            rule: { es: "Con sujeto expreso, lamenta algo que no se hizo.", en: "With an expressed subject, it regrets something that was not done.", uk: "З виразним підметом він шкодує про те, чого не зробили.", pt: "Com sujeito expresso, lamenta algo que não foi feito.", fr: "Avec un sujet exprimé, il regrette ce qui n’a pas été fait.", de: "Mit ausdrücklichem Subjekt bedauert er etwas, das nicht getan wurde.", it: "Con il soggetto espresso, rimpiange qualcosa che non è stato fatto.", pl: "Z wyrażonym podmiotem wyraża żal z powodu czegoś, czego nie zrobiono.", tr: "Açıkça belirtilmiş özneyle, yapılmamış bir şeye hayıflanmayı anlatır.", id: "Dengan subjek yang disebutkan, bentuk ini menyesali sesuatu yang tidak dilakukan.", vi: "Có chủ ngữ nêu rõ, nó tiếc nuối điều đã không làm." }
            ex: ["¡", { target: "Haberte presentado" }, " tú antes!"]
            tr: { en: "If only you had introduced yourself earlier!", uk: "Якби ти встиг представитися раніше!", pt: "Quem dera você ter se apresentado antes!", fr: "Si seulement tu t’étais présenté plus tôt !", de: "Hättest du dich doch früher vorgestellt!", it: "Se solo ti fossi presentato prima!", pl: "Gdybyś tylko przedstawił się wcześniej!", tr: "Keşke kendini daha önce tanıtsaydın!", id: "Andai saja kamu memperkenalkan diri lebih awal!", vi: "Giá mà bạn đã tự giới thiệu sớm hơn!" }
          - level: C2
            form: { pattern: [{ term: el }, { slot: infinitive }, { slot: adverb }] }
            rule: { es: "El artículo con los complementos del verbo presenta la acción como un hecho.", en: "The article with the verb's complements presents the action as a fact.", uk: "Артикль із залежними словами дієслова подає дію як факт.", pt: "O artigo com os complementos do verbo apresenta a ação como um fato.", fr: "L’article avec les compléments du verbe présente l’action comme un fait.", de: "Der Artikel mit den Ergänzungen des Verbs stellt die Handlung als Tatsache dar.", it: "L'articolo con i complementi del verbo presenta l'azione come un fatto.", pl: "Rodzajnik wraz z dopełnieniami czasownika przedstawia czynność jako fakt.", tr: "Artikel ve fiilin tümleçleri eylemi bir olgu olarak sunar.", id: "Artikel bersama pelengkap kata kerja menyajikan tindakan sebagai fakta.", vi: "Mạo từ cùng các bổ ngữ của động từ trình bày hành động như một sự thật." }
            ex: [{ target: "El esperar angustiosamente" }, " durante horas la agotó."]
            tr: { en: "Waiting anxiously for hours wore her out.", uk: "Багатогодинне тривожне очікування виснажило її.", pt: "O esperar angustiado durante horas a esgotou.", fr: "L’attente angoissée pendant des heures l’a épuisée.", de: "Das stundenlange bange Warten erschöpfte sie.", it: "L'attendere angosciosamente per ore l'ha sfinita.", pl: "Wielogodzinne trwożne czekanie wyczerpało ją.", tr: "Saatlerce endişeyle beklemek onu bitirdi.", id: "Menunggu dengan cemas selama berjam-jam menguras tenaganya.", vi: "Việc chờ đợi lo lắng suốt nhiều giờ làm cô ấy kiệt sức." }
          - level: C2
            form: { es: Infinitivo por imperativo plural, en: "Infinitive for the plural imperative", uk: "Інфінітив замість наказового способу множини", pt: "Infinitivo no lugar do imperativo plural", fr: "Infinitif à la place de l’impératif pluriel", de: "Infinitiv statt Plural-Imperativ", it: "Infinito al posto dell'imperativo plurale", pl: "Bezokolicznik zamiast trybu rozkazującego w liczbie mnogiej", tr: "Çoğul emir yerine mastar", id: "Infinitif sebagai pengganti imperatif jamak", vi: "Nguyên mẫu thay cho dạng mệnh lệnh số nhiều" }
            rule: { es: "En la lengua informal, el infinitivo ocupa el lugar del imperativo plural.", en: "In informal speech, the infinitive takes the place of the plural imperative.", uk: "У розмовній мові інфінітив стоїть замість наказового способу множини.", pt: "Na língua informal, o infinitivo ocupa o lugar do imperativo plural.", fr: "Dans la langue familière, l’infinitif remplace l’impératif pluriel.", de: "In der Umgangssprache steht der Infinitiv anstelle des Plural-Imperativs.", it: "Nella lingua informale, l'infinito prende il posto dell'imperativo plurale.", pl: "W języku potocznym bezokolicznik zajmuje miejsce trybu rozkazującego w liczbie mnogiej.", tr: "Gündelik dilde mastar, çoğul emir kipinin yerini alır.", id: "Dalam bahasa informal, infinitif menggantikan imperatif jamak.", vi: "Trong văn nói thân mật, nguyên mẫu thay cho dạng mệnh lệnh số nhiều." }
            ex: [{ target: Seguir }, " todo ", { variant: recto, variety: es-ES }, " ", { variant: derecho, variety: es-419 }, " hasta la plaza."]
            tr: { en: "Keep going straight on to the square.", uk: "Йдіть прямо до площі.", pt: "Sigam em frente até a praça.", fr: "Continuez tout droit jusqu’à la place.", de: "Geradeaus weitergehen bis zum Platz.", it: "Proseguire dritto fino alla piazza.", pl: "Iść prosto aż do placu.", tr: "Meydana kadar dümdüz devam edin.", id: "Teruslah lurus sampai alun-alun.", vi: "Cứ đi thẳng đến quảng trường." }
          - level: C2
            variety: es-ES
            form: { es: Infinitivo por imperativo de vosotros, en: "Infinitive for the vosotros imperative", uk: "Інфінітив замість наказового способу для vosotros", pt: "Infinitivo no lugar do imperativo de vosotros", fr: "Infinitif à la place de l’impératif de vosotros", de: "Infinitiv statt vosotros-Imperativ", it: "Infinito al posto dell'imperativo di vosotros", pl: "Bezokolicznik zamiast trybu rozkazującego vosotros", tr: "vosotros emri yerine mastar", id: "Infinitif sebagai pengganti imperatif vosotros", vi: "Nguyên mẫu thay cho dạng mệnh lệnh của vosotros" }
            rule: { es: "En España, el infinitivo sustituye a la forma de vosotros y el pronombre lo sigue.", en: "In Spain, the infinitive replaces the vosotros form and the pronoun follows it.", uk: "В Іспанії інфінітив замінює форму vosotros, а займенник стоїть після нього.", pt: "Na Espanha, o infinitivo substitui a forma de vosotros e o pronome vem depois dele.", fr: "En Espagne, l’infinitif remplace la forme de vosotros et le pronom le suit.", de: "In Spanien ersetzt der Infinitiv die vosotros-Form, und das Pronomen folgt ihm.", it: "In Spagna, l'infinito sostituisce la forma di vosotros e il pronome lo segue.", pl: "W Hiszpanii bezokolicznik zastępuje formę vosotros, a zaimek idzie za nim.", tr: "İspanya’da mastar, vosotros biçiminin yerini alır ve zamir onu izler.", id: "Di Spanyol, infinitif menggantikan bentuk vosotros dan kata ganti mengikutinya.", vi: "Ở Tây Ban Nha, nguyên mẫu thay cho dạng vosotros và đại từ đi sau nó." }
            ex: { examples: [[{ target: Perdonarme }, ", por favor."], [{ target: Sentaros }, " ya, que empieza la película."]] }
            tr: { en: { examples: ["Forgive me, please.", "Sit down now, the film is starting."] }, uk: { examples: ["Пробачте мені, будь ласка.", "Сідайте вже, фільм починається."] }, pt: { examples: ["Perdoem-me, por favor.", "Sentem-se já, que o filme está começando."] }, fr: { examples: ["Pardonnez-moi, s’il vous plaît.", "Asseyez-vous maintenant, le film commence."] }, de: { examples: ["Verzeiht mir bitte.", "Setzt euch jetzt, der Film fängt an."] }, it: { examples: ["Perdonatemi, per favore.", "Sedetevi ora, che il film comincia."] }, pl: { examples: ["Wybaczcie mi, proszę.", "Siadajcie już, bo film się zaczyna."] }, tr: { examples: ["Beni bağışlayın, lütfen.", "Hemen oturun, film başlıyor."] }, id: { examples: ["Maafkan saya, tolong.", "Duduklah sekarang, filmnya sudah mulai."] }, vi: { examples: ["Xin các bạn tha lỗi cho tôi.", "Ngồi xuống đi, phim bắt đầu rồi."] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { es: ["Las preposiciones que piden los verbos, los nombres y los adjetivos: ", { link: "Verbos, adjetivos y nombres con preposición", to: es.preposiciones.regimen-preposicional }, "."], en: ["The prepositions that verbs, nouns and adjectives require: ", { link: "Verbs, Adjectives and Nouns with Fixed Prepositions", to: es.preposiciones.regimen-preposicional }, "."], uk: ["Прийменники, яких вимагають дієслова, іменники й прикметники: ", { link: "Дієслова, прикметники й іменники з прийменниками", to: es.preposiciones.regimen-preposicional }, "."], pt: ["As preposições que os verbos, os substantivos e os adjetivos pedem: ", { link: "Verbos, adjetivos e substantivos com preposição", to: es.preposiciones.regimen-preposicional }, "."], fr: ["Les prépositions que demandent les verbes, les noms et les adjectifs : ", { link: "Verbes, adjectifs et noms avec préposition", to: es.preposiciones.regimen-preposicional }, "."], de: ["Die Präpositionen, die Verben, Nomen und Adjektive verlangen: ", { link: "Verben, Adjektive und Nomen mit Präposition", to: es.preposiciones.regimen-preposicional }, "."], it: ["Le preposizioni richieste da verbi, sostantivi e aggettivi: ", { link: "Verbi, aggettivi e sostantivi con preposizione", to: es.preposiciones.regimen-preposicional }, "."], pl: ["Przyimki, których wymagają czasowniki, rzeczowniki i przymiotniki: ", { link: "Czasowniki, przymiotniki i rzeczowniki z przyimkiem", to: es.preposiciones.regimen-preposicional }, "."], tr: ["Fiillerin, isimlerin ve sıfatların istediği edatlar: ", { link: "Edatlı fiiller, sıfatlar ve isimler", to: es.preposiciones.regimen-preposicional }, "."], id: ["Kata depan yang dituntut oleh kata kerja, kata benda, dan kata sifat: ", { link: "Kata kerja, kata sifat, dan kata benda dengan kata depan", to: es.preposiciones.regimen-preposicional }, "."], vi: ["Các giới từ mà động từ, danh từ và tính từ yêu cầu: ", { link: "Động từ, tính từ và danh từ đi với giới từ", to: es.preposiciones.regimen-preposicional }, "."] }

  - title: { es: "Gerundio: tiempo y predicado", en: "Gerund: time and predicate", uk: "Герундій: час і предикат", pt: "Gerúndio: tempo e predicado", fr: "Gérondif : temps et prédicat", de: "Gerundium: Zeit und Prädikat", it: "Gerundio: tempo e predicato", pl: "Gerundio: czas i orzeczenie", tr: "Gerundio: zaman ve yüklem", id: "Gerundio: waktu dan predikat", vi: "Gerundio: thời gian và vị ngữ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "Simultaneidad: el gerundio ocurre a la vez que el verbo principal.", en: "Simultaneity: the gerund happens at the same time as the main verb.", uk: "Одночасність: герундій позначає дію, що відбувається водночас з головним дієсловом.", pt: "Simultaneidade: o gerúndio ocorre ao mesmo tempo que o verbo principal.", fr: "Simultanéité : le gérondif a lieu en même temps que le verbe principal.", de: "Gleichzeitigkeit: Das Gerundium geschieht zur selben Zeit wie das Hauptverb.", it: "Contemporaneità: il gerundio avviene nello stesso momento del verbo principale.", pl: "Jednoczesność: gerundio zachodzi w tym samym czasie co czasownik główny.", tr: "Eş zamanlılık: gerundio, ana fiille aynı anda gerçekleşir.", id: "Kesamaan waktu: gerundio terjadi bersamaan dengan kata kerja utama.", vi: "Đồng thời: gerundio xảy ra cùng lúc với động từ chính." }
            ex: { equivalence: [["Me lo confesó ", { target: "yendo por la calle" }, "."], ["Me lo confesó ", { target: "mientras íbamos por la calle" }, "."]] }
            tr: { en: { equivalence: ["He confessed it to me walking down the street.", "He confessed it to me while we were walking down the street."] }, uk: { equivalence: ["Він зізнався мені в цьому, ідучи вулицею.", "Він зізнався мені в цьому, коли ми йшли вулицею."] }, pt: { equivalence: ["Ele me confessou isso caminhando pela rua.", "Ele me confessou isso enquanto íamos pela rua."] }, fr: { equivalence: ["Il me l’a avoué en marchant dans la rue.", "Il me l’a avoué pendant que nous marchions dans la rue."] }, de: { equivalence: ["Er gestand es mir, als er die Straße entlangging.", "Er gestand es mir, während wir die Straße entlangliefen."] }, it: { equivalence: ["Me l'ha confessato camminando per strada.", "Me l'ha confessato mentre camminavamo per strada."] }, pl: { equivalence: ["Przyznał mi się do tego, idąc ulicą.", "Przyznał mi się do tego, gdy szliśmy ulicą."] }, tr: { equivalence: ["Bana bunu sokakta yürüyerek itiraf etti.", "Bunu bana, sokakta yürüdüğümüz sırada itiraf etti."] }, id: { equivalence: ["Dia mengakuinya kepada saya sambil berjalan di jalan.", "Dia mengakuinya kepada saya saat kami berjalan di jalan."] }, vi: { equivalence: ["Anh ấy thú nhận điều đó với tôi khi đang đi trên đường.", "Anh ấy thú nhận điều đó với tôi trong lúc chúng tôi đi trên đường."] } }
          - level: B2
            use: { es: "Anterioridad: el gerundio expresa un paso previo al verbo principal.", en: "Anteriority: the gerund expresses a step before the main verb.", uk: "Попередність: герундій виражає крок, що передує головному дієслову.", pt: "Anterioridade: o gerúndio expressa um passo prévio ao verbo principal.", fr: "Antériorité : le gérondif exprime une étape qui précède le verbe principal.", de: "Vorzeitigkeit: Das Gerundium drückt einen Schritt vor dem Hauptverb aus.", it: "Anteriorità: il gerundio esprime un passaggio precedente al verbo principale.", pl: "Uprzedniość: gerundio wyraża etap poprzedzający czasownik główny.", tr: "Öncelik: gerundio, ana fiilden önceki bir adımı anlatır.", id: "Keterdahuluan: gerundio menyatakan langkah sebelum kata kerja utama.", vi: "Xảy ra trước: gerundio diễn tả một bước đi trước động từ chính." }
            ex: [{ target: "Estudiando siempre como hoy" }, ", aprobarás."]
            tr: { en: "If you always study the way you did today, you will pass.", uk: "Якщо ти завжди вчитимешся, як сьогодні, ти складеш іспит.", pt: "Estudando sempre como hoje, você vai passar.", fr: "En étudiant toujours comme aujourd’hui, tu réussiras.", de: "Wenn du immer so lernst wie heute, wirst du bestehen.", it: "Studiando sempre come oggi, passerai.", pl: "Ucząc się zawsze tak jak dzisiaj, zdasz.", tr: "Hep bugünkü gibi çalışırsan sınavı geçersin.", id: "Dengan belajar selalu seperti hari ini, kamu akan lulus.", vi: "Nếu lúc nào cũng học như hôm nay, bạn sẽ đỗ." }
          - level: B2
            use: { es: ["Posterioridad: la acción posterior lleva ", { term: y }, " y un verbo conjugado."], en: ["Posteriority: a later action takes ", { term: "y" }, " and a conjugated verb."], uk: ["Наступність: подальша дія вимагає ", { term: "y" }, " і відмінюваного дієслова."], pt: ["Posterioridade: a ação posterior leva ", { term: "y" }, " e um verbo conjugado."], fr: ["Postériorité : l’action postérieure prend ", { term: "y" }, " et un verbe conjugué."], de: ["Nachzeitigkeit: Die spätere Handlung steht mit ", { term: "y" }, " und einem konjugierten Verb."], it: ["Posteriorità: l'azione successiva vuole ", { term: "y" }, " e un verbo coniugato."], pl: ["Następczość: czynność późniejsza wymaga ", { term: "y" }, " i czasownika w formie osobowej."], tr: ["Sonralık: sonraki eylem ", { term: "y" }, " ve çekimli bir fiille kurulur."], id: ["Keterkemudian: tindakan yang terjadi kemudian memakai ", { term: "y" }, " dan kata kerja yang dikonjugasi."], vi: ["Xảy ra sau: hành động xảy ra sau dùng ", { term: "y" }, " và một động từ chia."] }
            ex: ["Abrí la puerta ", { target: "y me encontré" }, " con él."]
            tr: { en: "I opened the door and ran into him.", uk: "Я відчинив двері й наткнувся на нього.", pt: "Abri a porta e dei de cara com ele.", fr: "J’ai ouvert la porte et je suis tombé sur lui.", de: "Ich öffnete die Tür und stand ihm plötzlich gegenüber.", it: "Ho aperto la porta e mi sono ritrovato davanti a lui.", pl: "Otworzyłem drzwi i natknąłem się na niego.", tr: "Kapıyı açtım ve onunla karşılaştım.", id: "Saya membuka pintu dan bertemu dengannya.", vi: "Tôi mở cửa và bắt gặp anh ấy." }
          - level: B2
            use: { es: "Predicativo del sujeto: el gerundio dice cómo actúa el sujeto.", en: "Predicative of the subject: the gerund says how the subject acts.", uk: "Предикативна ознака підмета: герундій показує, як діє підмет.", pt: "Predicativo do sujeito: o gerúndio diz como o sujeito age.", fr: "Attribut du sujet : le gérondif dit comment le sujet agit.", de: "Subjektsprädikativ: Das Gerundium sagt, wie das Subjekt handelt.", it: "Predicativo del soggetto: il gerundio dice come agisce il soggetto.", pl: "Dopowiedzenie podmiotu: gerundio mówi, jak działa podmiot.", tr: "Özneyi niteleyen sıfat: gerundio, öznenin nasıl davrandığını söyler.", id: "Predikatif subjek: gerundio menyatakan bagaimana subjek bertindak.", vi: "Tính từ miêu tả chủ ngữ: gerundio cho biết chủ ngữ hành động thế nào." }
            ex: ["Ella habló ", { target: tartamudeando }, "."]
            tr: { en: "She spoke, stammering.", uk: "Вона говорила, затинаючись.", pt: "Ela falou gaguejando.", fr: "Elle a parlé en bégayant.", de: "Sie sprach stotternd.", it: "Ha parlato balbettando.", pl: "Mówiła, jąkając się.", tr: "Kekeleyerek konuştu.", id: "Dia berbicara dengan tergagap.", vi: "Cô ấy nói lắp bắp." }
          - level: B2
            use: { es: "Predicativo del complemento directo: el gerundio describe al complemento durante la acción.", en: "Predicative of the direct object: the gerund describes the object during the action.", uk: "Предикативна ознака прямого додатка: герундій описує додаток під час дії.", pt: "Predicativo do objeto direto: o gerúndio descreve o complemento durante a ação.", fr: "Attribut de l’objet direct : le gérondif décrit le complément pendant l’action.", de: "Objektsprädikativ: Das Gerundium beschreibt das Objekt während der Handlung.", it: "Predicativo dell'oggetto diretto: il gerundio descrive il complemento durante l'azione.", pl: "Dopowiedzenie dopełnienia bliższego: gerundio opisuje dopełnienie w trakcie czynności.", tr: "Doğrudan nesneyi niteleyen sıfat: gerundio, eylem sırasında nesneyi betimler.", id: "Predikatif objek langsung: gerundio menggambarkan objek selama tindakan berlangsung.", vi: "Tính từ miêu tả tân ngữ trực tiếp: gerundio miêu tả tân ngữ trong lúc hành động diễn ra." }
            ex: { equivalence: [["Tengo todo el cuerpo ", { target: temblando }, "."], ["Tengo todo el cuerpo ", { target: "que me tiembla" }, "."], ["Tengo todo el cuerpo ", { target: tembloroso }, "."]] }
            tr: { en: { equivalence: ["My whole body is trembling.", "My whole body is shaking.", "My whole body is shaky."] }, uk: { equivalence: ["Усе тіло в мене тремтить.", "Усе тіло в мене аж дрижить.", "Усе тіло в мене у тремтінні."] }, pt: { equivalence: ["Estou com o corpo todo tremendo.", "Estou com o corpo todo que treme.", "Estou com o corpo todo trêmulo."] }, fr: { equivalence: ["J’ai tout le corps qui tremble.", "J’ai tout le corps en train de trembler.", "J’ai tout le corps tremblant."] }, de: { equivalence: ["Mein ganzer Körper zittert.", "Mein ganzer Körper bebt.", "Mein ganzer Körper ist zittrig."] }, it: { equivalence: ["Ho tutto il corpo che trema.", "Ho tutto il corpo che mi trema.", "Ho tutto il corpo tremante."] }, pl: { equivalence: ["Całe ciało mi się trzęsie.", "Całe ciało mi drży.", "Całe ciało mam drżące."] }, tr: { equivalence: ["Bütün vücudum titriyor.", "Bütün vücudum tir tir titriyor.", "Bütün vücudum titrek."] }, id: { equivalence: ["Seluruh tubuh saya gemetar.", "Seluruh tubuh saya bergetar.", "Seluruh tubuh saya gemetaran."] }, vi: { equivalence: ["Cả người tôi đang run.", "Cả người tôi run lên.", "Cả người tôi run rẩy."] } }
          - level: C1
            use: { es: "Gerundio independiente: en una exclamación o una pregunta expresa reproche, rechazo u orden.", en: "Independent gerund: in an exclamation or a question it expresses reproach, refusal or a command.", uk: "Самостійний герундій: у вигуку чи запитанні виражає докір, відмову або наказ.", pt: "Gerúndio independente: em uma exclamação ou pergunta, expressa reprovação, recusa ou ordem.", fr: "Gérondif indépendant : dans une exclamation ou une question, il exprime un reproche, un refus ou un ordre.", de: "Selbstständiges Gerundium: In einem Ausruf oder einer Frage drückt es Vorwurf, Ablehnung oder einen Befehl aus.", it: "Gerundio indipendente: in un'esclamazione o in una domanda esprime rimprovero, rifiuto o ordine.", pl: "Gerundio samodzielne: w wykrzyknieniu lub pytaniu wyraża wyrzut, odmowę albo polecenie.", tr: "Bağımsız gerundio: ünlemde ya da soruda sitem, ret veya emir bildirir.", id: "Gerundio mandiri: dalam seruan atau pertanyaan, ia menyatakan celaan, penolakan, atau perintah.", vi: "Gerundio độc lập: trong câu cảm thán hoặc câu hỏi, nó diễn tả sự trách móc, từ chối hoặc ra lệnh." }
            ex: { examples: [["¡Siempre ", { target: protestando }, " por todo!"], ["¿Yo ", { target: "pidiéndole perdón" }, "? Ni loco."], ["¡", { target: Andando }, " que es gerundio!"]] }
            tr: { en: { examples: ["Always complaining about everything!", "Me, apologising to him? No way.", "Let's get going, no dawdling!"] }, uk: { examples: ["Вічно всім невдоволений!", "Щоб я просив у нього вибачення? Ні за що.", "Рушаймо, годі стояти!"] }, pt: { examples: ["Sempre reclamando de tudo!", "Eu pedindo perdão a ele? Nem louco.", "Andando, vamos lá!"] }, fr: { examples: ["Toujours à râler pour tout !", "Moi, lui demander pardon ? Jamais de la vie.", "Allez, en route !"] }, de: { examples: ["Immer und überall meckern!", "Ich soll ihn um Verzeihung bitten? Niemals.", "Los, weitergehen!"] }, it: { examples: ["Sempre a lamentarsi di tutto!", "Io, chiedergli scusa? Neanche per sogno.", "Forza, in cammino!"] }, pl: { examples: ["Wiecznie na wszystko narzekasz!", "Ja mam go przepraszać? Nigdy w życiu.", "Ruszajmy, no już!"] }, tr: { examples: ["Hep her şeyden yakınıyor!", "Ben mi ondan özür dileyeceğim? Asla.", "Haydi, yürüyün!"] }, id: { examples: ["Selalu saja mengeluh tentang segalanya!", "Saya meminta maaf kepadanya? Mana mungkin.", "Ayo jalan, jangan bengong!"] }, vi: { examples: ["Lúc nào cũng phàn nàn về mọi thứ!", "Tôi mà đi xin lỗi anh ta ư? Đời nào.", "Đi thôi, đừng đứng đó nữa!"] } }
          - level: C1
            use: { es: "Predicativo de un grupo nominal: el gerundio describe una acción en curso del nombre.", en: "Predicative of a noun phrase: the gerund describes an action of the noun in progress.", uk: "Предикативна ознака іменникової групи: герундій описує дію іменника, що триває.", pt: "Predicativo de um grupo nominal: o gerúndio descreve uma ação em curso do substantivo.", fr: "Attribut d’un groupe nominal : le gérondif décrit une action en cours du nom.", de: "Prädikativ einer Nominalgruppe: Das Gerundium beschreibt eine laufende Handlung des Nomens.", it: "Predicativo di un gruppo nominale: il gerundio descrive un'azione in corso del sostantivo.", pl: "Dopowiedzenie grupy nominalnej: gerundio opisuje trwającą czynność rzeczownika.", tr: "İsim öbeğini niteleyen sıfat: gerundio, ismin süren bir eylemini betimler.", id: "Predikatif frasa nominal: gerundio menggambarkan tindakan kata benda yang sedang berlangsung.", vi: "Tính từ miêu tả cụm danh từ: gerundio miêu tả một hành động đang diễn ra của danh từ." }
            ex: ["Sus ojos ", { target: "mirándome con esa pena" }, " me conmovieron."]
            tr: { en: "Her eyes looking at me with such sorrow moved me.", uk: "Її очі, що дивилися на мене з таким смутком, зворушили мене.", pt: "Seus olhos me olhando com aquela tristeza me comoveram.", fr: "Ses yeux me regardant avec cette tristesse m’ont ému.", de: "Ihre Augen, die mich mit so viel Traurigkeit ansahen, rührten mich.", it: "I suoi occhi che mi guardavano con quella tristezza mi hanno commosso.", pl: "Jej oczy, patrzące na mnie z takim smutkiem, wzruszyły mnie.", tr: "Gözlerinin bana o hüzünle bakması beni duygulandırdı.", id: "Matanya yang menatap saya dengan kesedihan itu menyentuh hati saya.", vi: "Đôi mắt của cô ấy nhìn tôi với nỗi buồn ấy đã làm tôi xúc động." }
          - level: C1
            use: { es: "Complemento de modo: el gerundio dice cómo ocurre la acción.", en: "Adverbial of manner: the gerund says how the action happens.", uk: "Обставина способу дії: герундій показує, як відбувається дія.", pt: "Complemento de modo: o gerúndio diz como a ação ocorre.", fr: "Complément de manière : le gérondif dit comment l’action se déroule.", de: "Modalangabe: Das Gerundium sagt, wie die Handlung abläuft.", it: "Complemento di modo: il gerundio dice come avviene l'azione.", pl: "Okolicznik sposobu: gerundio mówi, jak przebiega czynność.", tr: "Biçim tümleci: gerundio, eylemin nasıl gerçekleştiğini söyler.", id: "Keterangan cara: gerundio menyatakan bagaimana tindakan itu terjadi.", vi: "Trạng ngữ chỉ cách thức: gerundio cho biết hành động diễn ra như thế nào." }
            ex: ["Me pidieron perdón ", { target: cantando }, "."]
            tr: { en: "They apologised to me by singing.", uk: "Вони попросили в мене вибачення, співаючи.", pt: "Pediram-me perdão cantando.", fr: "Ils m’ont demandé pardon en chantant.", de: "Sie baten mich singend um Verzeihung.", it: "Mi hanno chiesto scusa cantando.", pl: "Prosili mnie o wybaczenie, śpiewając.", tr: "Benden şarkı söyleyerek özür dilediler.", id: "Mereka meminta maaf kepada saya sambil bernyanyi.", vi: "Họ xin lỗi tôi bằng cách hát." }
          - level: C1
            use: { es: "Complemento de tiempo con sujeto propio: el sujeto va detrás del gerundio.", en: "Adverbial of time with its own subject: the subject goes after the gerund.", uk: "Обставина часу з власним підметом: підмет стоїть після герундія.", pt: "Complemento de tempo com sujeito próprio: o sujeito vai depois do gerúndio.", fr: "Complément de temps avec sujet propre : le sujet se place après le gérondif.", de: "Zeitangabe mit eigenem Subjekt: Das Subjekt steht hinter dem Gerundium.", it: "Complemento di tempo con soggetto proprio: il soggetto va dopo il gerundio.", pl: "Okolicznik czasu z własnym podmiotem: podmiot stoi za gerundio.", tr: "Kendi öznesi olan zaman tümleci: özne, gerundio biçiminin ardından gelir.", id: "Keterangan waktu dengan subjek sendiri: subjek berada setelah gerundio.", vi: "Trạng ngữ chỉ thời gian có chủ ngữ riêng: chủ ngữ đứng sau gerundio." }
            ex: [{ target: "Llegando yo" }, ", apareció él."]
            tr: { en: "When I arrived, he appeared.", uk: "Коли я приїхав, він з’явився.", pt: "Chegando eu, ele apareceu.", fr: "À mon arrivée, il est apparu.", de: "Als ich ankam, tauchte er auf.", it: "Arrivando io, è comparso lui.", pl: "Gdy ja przyszedłem, pojawił się on.", tr: "Ben gelirken o ortaya çıktı.", id: "Ketika saya tiba, dia muncul.", vi: "Khi tôi đến, anh ấy xuất hiện." }
          - level: C1
            use: { es: ["Condición: el gerundio equivale a una oración con ", { term: si }, "."], en: ["Condition: the gerund is equivalent to a clause with ", { term: "si" }, "."], uk: ["Умова: герундій відповідає реченню з ", { term: "si" }, "."], pt: ["Condição: o gerúndio equivale a uma oração com ", { term: "si" }, "."], fr: ["Condition : le gérondif équivaut à une proposition avec ", { term: "si" }, "."], de: ["Bedingung: Das Gerundium entspricht einem Satz mit ", { term: "si" }, "."], it: ["Condizione: il gerundio equivale a una proposizione con ", { term: "si" }, "."], pl: ["Warunek: gerundio odpowiada zdaniu z ", { term: "si" }, "."], tr: ["Koşul: gerundio, ", { term: "si" }, " ile kurulan bir cümleye denktir."], id: ["Syarat: gerundio setara dengan klausa dengan ", { term: "si" }, "."], vi: ["Điều kiện: gerundio tương đương một mệnh đề với ", { term: "si" }, "."] }
            ex: { equivalence: [[{ target: "Estudiando más" }, " lograrás aprobar."], [{ target: "Si estudias más" }, ", lograrás aprobar."]] }
            tr: { en: { equivalence: ["By studying more you will manage to pass.", "If you study more, you will manage to pass."] }, uk: { equivalence: ["Навчаючись більше, ти зможеш скласти іспит.", "Якщо ти вчитимешся більше, ти зможеш скласти іспит."] }, pt: { equivalence: ["Estudando mais, você conseguirá passar.", "Se você estudar mais, conseguirá passar."] }, fr: { equivalence: ["En étudiant plus, tu arriveras à réussir.", "Si tu étudies plus, tu arriveras à réussir."] }, de: { equivalence: ["Mit mehr Lernen wirst du die Prüfung bestehen.", "Wenn du mehr lernst, wirst du die Prüfung bestehen."] }, it: { equivalence: ["Studiando di più riuscirai a passare.", "Se studi di più, riuscirai a passare."] }, pl: { equivalence: ["Ucząc się więcej, uda ci się zdać.", "Jeśli będziesz się uczyć więcej, uda ci się zdać."] }, tr: { equivalence: ["Daha çok çalışarak sınavı geçebilirsin.", "Daha çok çalışırsan sınavı geçebilirsin."] }, id: { equivalence: ["Dengan belajar lebih banyak, kamu akan berhasil lulus.", "Kalau kamu belajar lebih banyak, kamu akan berhasil lulus."] }, vi: { equivalence: ["Học nhiều hơn, bạn sẽ đỗ được.", "Nếu bạn học nhiều hơn, bạn sẽ đỗ được."] } }
          - level: C2
            use: { es: ["Gerundio compuesto: ", { pattern: [{ term: habiendo }, { slot: past participle }] }, " expresa una acción anterior."], en: ["Perfect gerund: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " expresses an earlier action."], uk: ["Перфектний герундій: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " виражає попередню дію."], pt: ["Gerúndio composto: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " expressa uma ação anterior."], fr: ["Gérondif composé : ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " exprime une action antérieure."], de: ["Zusammengesetztes Gerundium: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " drückt eine vorzeitige Handlung aus."], it: ["Gerundio composto: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " esprime un'azione anteriore."], pl: ["Gerundio złożone: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " wyraża czynność wcześniejszą."], tr: ["Bileşik gerundio: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " daha önce gerçekleşmiş bir eylemi anlatır."], id: ["Gerundio majemuk: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " menyatakan tindakan yang lebih dulu."], vi: ["Gerundio hoàn thành: ", { pattern: [{ term: "habiendo" }, { slot: "past participle" }] }, " diễn tả một hành động xảy ra trước."] }
            ex: [{ target: "Habiendo terminado el informe" }, ", salió de la oficina."]
            tr: { en: "Having finished the report, she left the office.", uk: "Закінчивши звіт, вона вийшла з офісу.", pt: "Tendo terminado o relatório, saiu do escritório.", fr: "Ayant terminé le rapport, elle est sortie du bureau.", de: "Nachdem sie den Bericht beendet hatte, verließ sie das Büro.", it: "Avendo finito la relazione, uscì dall'ufficio.", pl: "Skończywszy raport, wyszła z biura.", tr: "Raporu bitirmiş olarak ofisten çıktı.", id: "Setelah menyelesaikan laporan itu, dia keluar dari kantor.", vi: "Sau khi hoàn thành bản báo cáo, cô ấy rời văn phòng." }
