  - title: { es: "Tiempo con formas no personales", en: "Time with non-finite forms", uk: "Час і неособові форми", pt: "Tempo com as formas nominais", fr: "Le temps avec les formes non personnelles", de: "Zeit mit infiniten Verbformen", it: "Il tempo con le forme non finite", pl: "Czas i formy nieosobowe", tr: "Kişisiz biçimlerle zaman", id: "Waktu dengan bentuk nonfinit", vi: "Thời gian với các dạng động từ không chia ngôi" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { es: Estructura, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            form: { pattern: [{ term: nada más }, { slot: infinitive }] }
            rule: { es: "Expresa una sucesión inmediata: la segunda acción sigue a la primera.", en: "It expresses immediate succession: the second action follows the first.", uk: "Виражає безпосередню послідовність: друга дія йде одразу за першою.", pt: "Expressa uma sucessão imediata: a segunda ação segue a primeira.", fr: "Exprime une succession immédiate : la seconde action suit la première.", de: "Drückt eine unmittelbare Abfolge aus: Die zweite Handlung folgt auf die erste.", it: "Esprime una successione immediata: la seconda azione segue la prima.", pl: "Wyraża bezpośrednie następstwo: druga czynność następuje po pierwszej.", tr: "Hemen ardından gelmeyi anlatır: ikinci eylem birincinin peşinden gelir.", id: "Menyatakan urutan yang langsung: tindakan kedua menyusul tindakan pertama.", vi: "Diễn tả sự nối tiếp ngay lập tức: hành động thứ hai theo sau hành động thứ nhất." }
            ex: [{ target: "Nada más llegar" }, ", nos pusimos a comer."]
            tr: { en: "As soon as we arrived, we started to eat.", uk: "Щойно ми приїхали, ми взялися їсти.", pt: "Assim que chegamos, nos pusemos a comer.", fr: "Dès notre arrivée, nous nous sommes mis à manger.", de: "Sobald wir angekommen waren, fingen wir an zu essen.", it: "Appena arrivati, ci siamo messi a mangiare.", pl: "Zaraz po przyjeździe zabraliśmy się do jedzenia.", tr: "Varır varmaz yemek yemeye koyulduk.", id: "Begitu tiba, kami langsung mulai makan.", vi: "Vừa đến nơi, chúng tôi bắt đầu ăn." }
          - level: B2
            form: { pattern: [{ term: una vez }, { slot: past participle }] }
            rule: { es: "Expresa una acción ya terminada; el participio concuerda con el nombre.", en: "It expresses an action already finished; the participle agrees with the noun.", uk: "Виражає дію, що вже завершилась; дієприкметник узгоджується з іменником.", pt: "Expressa uma ação já terminada; o particípio concorda com o substantivo.", fr: "Exprime une action déjà terminée ; le participe passé s’accorde avec le nom.", de: "Drückt eine bereits abgeschlossene Handlung aus; das Partizip richtet sich nach dem Nomen.", it: "Esprime un'azione già conclusa; il participio concorda con il sostantivo.", pl: "Wyraża czynność już zakończoną; imiesłów zgadza się z rzeczownikiem.", tr: "Tamamlanmış bir eylemi anlatır; participio isimle uyum sağlar.", id: "Menyatakan tindakan yang sudah selesai; partisip menyesuaikan dengan kata benda.", vi: "Diễn tả hành động đã hoàn tất; quá khứ phân từ hòa hợp với danh từ." }
            ex: [{ target: "Una vez estudiado el problema" }, ", decidiremos."]
            tr: { en: "Once the problem has been studied, we will decide.", uk: "Коли проблему буде вивчено, ми вирішимо.", pt: "Uma vez estudado o problema, decidiremos.", fr: "Une fois le problème étudié, nous déciderons.", de: "Sobald das Problem untersucht ist, entscheiden wir.", it: "Una volta studiato il problema, decideremo.", pl: "Gdy problem zostanie przeanalizowany, zdecydujemy.", tr: "Sorun incelendikten sonra karar vereceğiz.", id: "Setelah masalahnya dipelajari, kami akan memutuskan.", vi: "Khi vấn đề đã được nghiên cứu xong, chúng tôi sẽ quyết định." }
          - level: B2
            form: { pattern: [{ term: al }, { slot: infinitive }] }
            rule: { es: "El sujeto sobrentendido es el del verbo principal.", en: "The understood subject is that of the main verb.", uk: "Підмет, що мається на увазі, — це підмет головного дієслова.", pt: "O sujeito subentendido é o do verbo principal.", fr: "Le sujet sous-entendu est celui du verbe principal.", de: "Das mitgedachte Subjekt ist das des Hauptverbs.", it: "Il soggetto sottinteso è quello del verbo principale.", pl: "Domyślnym podmiotem jest podmiot czasownika głównego.", tr: "Örtük özne, ana fiilin öznesidir.", id: "Subjek yang tersirat adalah subjek kata kerja utama.", vi: "Chủ ngữ ngầm hiểu là chủ ngữ của động từ chính." }
            ex: [{ target: "Al saber la noticia" }, ", María me llamó."]
            tr: { en: "When she heard the news, María called me.", uk: "Дізнавшись новину, Марія подзвонила мені.", pt: "Ao saber da notícia, María me ligou.", fr: "En apprenant la nouvelle, María m’a appelé.", de: "Als María die Nachricht erfuhr, rief sie mich an.", it: "Appena saputa la notizia, María mi ha chiamato.", pl: "Gdy María usłyszała nowinę, zadzwoniła do mnie.", tr: "Haberi öğrenince María beni aradı.", id: "Begitu mengetahui kabar itu, María menelepon saya.", vi: "Khi biết tin, María đã gọi cho tôi." }
          - level: B2
            form: { pattern: [{ term: al }, { slot: infinitive }, { slot: subject }] }
            rule: { es: "Un sujeto distinto del principal va detrás del infinitivo.", en: "A subject different from the main one goes after the infinitive.", uk: "Підмет, відмінний від головного, стоїть після інфінітива.", pt: "Um sujeito diferente do principal vai depois do infinitivo.", fr: "Un sujet différent du sujet principal se place après l’infinitif.", de: "Ein anderes Subjekt als das des Hauptverbs steht hinter dem Infinitiv.", it: "Un soggetto diverso da quello principale va dopo l'infinito.", pl: "Podmiot inny niż główny stoi za bezokolicznikiem.", tr: "Ana fiilinkinden farklı bir özne mastardan sonra gelir.", id: "Subjek yang berbeda dari subjek utama berada setelah infinitif.", vi: "Chủ ngữ khác với chủ ngữ chính đứng sau nguyên mẫu." }
            ex: { equivalence: [[{ target: "Al saber la jefa la noticia" }, ", María me llamó."], ["María me llamó ", { target: "cuando la jefa supo la noticia" }, "."]] }
            tr: { en: { equivalence: ["Upon the boss hearing the news, María called me.", "María called me when the boss heard the news."] }, uk: { equivalence: ["Коли начальниця дізналася новину, Марія подзвонила мені.", "Марія подзвонила мені, коли начальниця дізналася новину."] }, pt: { equivalence: ["Ao saber a chefe da notícia, María me ligou.", "María me ligou quando a chefe soube da notícia."] }, fr: { equivalence: ["La patronne ayant appris la nouvelle, María m’a appelé.", "María m’a appelé quand la patronne a appris la nouvelle."] }, de: { equivalence: ["Als die Chefin die Nachricht erfuhr, rief María mich an.", "María rief mich an, als die Chefin die Nachricht erfuhr."] }, it: { equivalence: ["Una volta che la capa ha saputo la notizia, María mi ha chiamato.", "María mi ha chiamato quando la capa ha saputo la notizia."] }, pl: { equivalence: ["Gdy szefowa usłyszała nowinę, María zadzwoniła do mnie.", "María zadzwoniła do mnie, gdy szefowa usłyszała nowinę."] }, tr: { equivalence: ["Patron haberi öğrenince María beni aradı.", "María beni, patron haberi öğrendiğinde aradı."] }, id: { equivalence: ["Begitu atasan mengetahui kabar itu, María menelepon saya.", "María menelepon saya ketika atasan mengetahui kabar itu."] }, vi: { equivalence: ["Khi bà chủ biết tin, María đã gọi cho tôi.", "María đã gọi cho tôi khi bà chủ biết tin."] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { es: ["Las oraciones con ", { term: cuando }, " y subjuntivo: ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], en: ["Clauses with ", { term: "cuando" }, " and the subjunctive: ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], uk: ["Речення з ", { term: "cuando" }, " і суб’юнктивом: ", { link: "Суб’юнктив після cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], pt: ["As orações com ", { term: "cuando" }, " e subjuntivo: ", { link: "O subjuntivo com cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], fr: ["Les propositions avec ", { term: "cuando" }, " et le subjonctif : ", { link: "Le subjonctif avec cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], de: ["Die Sätze mit ", { term: "cuando" }, " und Konjunktiv: ", { link: "Der Konjunktiv nach cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], it: ["Le proposizioni con ", { term: "cuando" }, " e congiuntivo: ", { link: "Il congiuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], pl: ["Zdania z ", { term: "cuando" }, " i trybem łączącym: ", { link: "Tryb łączący z cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], tr: [{ term: "cuando" }, " ve dilek kipiyle kurulan cümleler: ", { link: "cuando, para que, antes de que ile dilek kipi", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], id: ["Klausa dengan ", { term: "cuando" }, " dan subjungtif: ", { link: "Subjungtif dengan cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."], vi: ["Các câu có ", { term: "cuando" }, " và thức giả định: ", { link: "Thức giả định với cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."] }

