            text: { es: ["Los participios irregulares: ", { link: "El pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], en: ["Irregular participles: ", { link: "Present Perfect", to: es.pasados.preterito-perfecto }, "."], uk: ["Неправильні дієприкметники: ", { link: "Перфект", to: es.pasados.preterito-perfecto }, "."], pt: ["Os particípios irregulares: ", { link: "O pretérito perfeito composto", to: es.pasados.preterito-perfecto }, "."], fr: ["Les participes passés irréguliers : ", { link: "Le passé composé", to: es.pasados.preterito-perfecto }, "."], de: ["Die unregelmäßigen Partizipien: ", { link: "Das Pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], it: ["I participi irregolari: ", { link: "Il pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], pl: ["Imiesłowy nieregularne: ", { link: "Pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], tr: ["Düzensiz participio biçimleri: ", { link: "Pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], id: ["Partisip tak beraturan: ", { link: "Pretérito perfecto", to: es.pasados.preterito-perfecto }, "."], vi: ["Các quá khứ phân từ bất quy tắc: ", { link: "Pretérito perfecto", to: es.pasados.preterito-perfecto }, "."] }
          - type: note
