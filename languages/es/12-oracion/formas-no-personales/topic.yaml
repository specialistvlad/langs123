            variety: es-419
            use: { es: "Diminutivo con valor adverbial: el gerundio en -ito expresa un modo suave o afectuoso.", en: "Diminutive with adverbial value: the gerund in -ito expresses a gentle or affectionate manner.", uk: "Зменшувальна форма з прислівниковим значенням: герундій із -ito виражає м’який або ласкавий спосіб дії.", pt: "Diminutivo com valor adverbial: o gerúndio em -ito expressa um modo suave ou carinhoso.", fr: "Diminutif à valeur adverbiale : le gérondif en -ito exprime une manière douce ou affectueuse.", de: "Verkleinerungsform mit adverbialem Wert: Das Gerundium auf -ito drückt eine sanfte oder liebevolle Art aus.", it: "Diminutivo con valore avverbiale: il gerundio in -ito esprime un modo dolce o affettuoso.", pl: "Zdrobnienie o znaczeniu przysłówkowym: gerundio z -ito wyraża łagodny lub czuły sposób.", tr: "Zarf değerinde küçültme: -ito ile biten gerundio, yumuşak ya da sevecen bir tavrı anlatır.", id: "Diminutif bernilai adverbia: gerundio berakhiran -ito menyatakan cara yang lembut atau penuh kasih.", vi: "Dạng chỉ sự nhỏ bé có giá trị trạng từ: gerundio có đuôi -ito diễn tả cách thức nhẹ nhàng hoặc trìu mến." }
            ex: { examples: [["Salió ", { target: callandito }, " de la casa."], ["Llegó ", { target: corriendito }, " a contarme todo."], ["Va ", { target: andandito }, " hasta la escuela."]] }
            tr: { en: { examples: ["She left the house nice and quietly.", "He came running up to tell me everything.", "He is walking along to school, taking his time."] }, uk: { examples: ["Вона тихенько вийшла з дому.", "Він прибіг до мене, щоб усе розповісти.", "Він потроху чимчикує до школи."] }, pt: { examples: ["Saiu de casa de mansinho.", "Chegou correndinho para me contar tudo.", "Vai andandinho até a escola."] }, fr: { examples: ["Elle est sortie de la maison tout doucement.", "Il est arrivé en courant pour tout me raconter.", "Il va à l’école en marchant tranquillement."] }, de: { examples: ["Sie verließ das Haus ganz leise.", "Er kam flink angerannt, um mir alles zu erzählen.", "Er geht gemütlich zur Schule."] }, it: { examples: ["È uscita di casa piano piano.", "È arrivato di corsa a raccontarmi tutto.", "Va a scuola con calma."] }, pl: { examples: ["Wyszła z domu cichutko.", "Przybiegł truchcikiem, żeby mi wszystko opowiedzieć.", "Idzie sobie powolutku do szkoły."] }, tr: { examples: ["Evden usul usul çıktı.", "Her şeyi anlatmak için koşa koşa geldi.", "Okula yürüye yürüye gidiyor."] }, id: { examples: ["Dia keluar dari rumah dengan diam-diam.", "Dia datang berlari kecil untuk menceritakan semuanya kepada saya.", "Dia berjalan pelan-pelan ke sekolah."] }, vi: { examples: ["Cô ấy lặng lẽ rời khỏi nhà.", "Anh ấy chạy lon ton đến kể hết cho tôi.", "Em ấy thong thả đi đến trường."] } }
          - level: C2
            use: { es: "Gerundio independiente en una pregunta o en un pie de foto: comenta una escena.", en: "Independent gerund in a question or in a photo caption: it comments on a scene.", uk: "Самостійний герундій у запитанні або в підписі до фото: коментує сцену.", pt: "Gerúndio independente em uma pergunta ou em uma legenda de foto: comenta uma cena.", fr: "Gérondif indépendant dans une question ou dans une légende de photo : il commente une scène.", de: "Selbstständiges Gerundium in einer Frage oder einer Bildunterschrift: Es kommentiert eine Szene.", it: "Gerundio indipendente in una domanda o in una didascalia: commenta una scena.", pl: "Gerundio samodzielne w pytaniu albo w podpisie pod zdjęciem: komentuje scenę.", tr: "Soruda ya da fotoğraf altı yazısında bağımsız gerundio: bir sahneyi yorumlar.", id: "Gerundio mandiri dalam pertanyaan atau keterangan foto: ia mengomentari suatu adegan.", vi: "Gerundio độc lập trong câu hỏi hoặc chú thích ảnh: nó bình luận về một cảnh." }
            ex: { examples: [["Vaya, ¿", { target: "paseando por aquí" }, ", eh?"], ["El presidente, ", { target: "saludando a los embajadores" }, "."]] }
            tr: { en: { examples: ["Well, strolling around here, are we?", "The president, greeting the ambassadors."] }, uk: { examples: ["Оце так, гуляємо тут, еге ж?", "Президент вітає послів."] }, pt: { examples: ["Ora, passeando por aqui, hein?", "O presidente cumprimentando os embaixadores."] }, fr: { examples: ["Tiens, on se promène par ici ?", "Le président saluant les ambassadeurs."] }, de: { examples: ["Na, hier unterwegs, was?", "Der Präsident beim Begrüßen der Botschafter."] }, it: { examples: ["Guarda, a spasso da queste parti, eh?", "Il presidente mentre saluta gli ambasciatori."] }, pl: { examples: ["No proszę, spacerujemy sobie tutaj, co?", "Prezydent witający ambasadorów."] }, tr: { examples: ["Vay, burada gezintiye çıkmışsınız, ha?", "Başkan, büyükelçileri selamlarken."] }, id: { examples: ["Wah, jalan-jalan di sini, ya?", "Presiden sedang menyapa para duta besar."] }, vi: { examples: ["Ồ, đi dạo quanh đây à?", "Tổng thống chào các đại sứ."] } }
          - level: C2
            use: { es: "Causa: el gerundio, a menudo negativo, explica el motivo de la acción principal.", en: "Cause: the gerund, often negative, explains the reason for the main action.", uk: "Причина: герундій, часто заперечний, пояснює мотив головної дії.", pt: "Causa: o gerúndio, muitas vezes negativo, explica o motivo da ação principal.", fr: "Cause : le gérondif, souvent négatif, explique le motif de l’action principale.", de: "Grund: Das Gerundium, oft verneint, erklärt den Anlass der Haupthandlung.", it: "Causa: il gerundio, spesso negativo, spiega il motivo dell'azione principale.", pl: "Przyczyna: gerundio, często przeczące, wyjaśnia powód czynności głównej.", tr: "Neden: gerundio, çoğu kez olumsuz biçimde, ana eylemin sebebini açıklar.", id: "Sebab: gerundio, yang sering negatif, menjelaskan alasan tindakan utama.", vi: "Nguyên nhân: gerundio, thường ở dạng phủ định, giải thích lý do của hành động chính." }
            ex: [{ target: "No teniendo qué comer" }, ", se puso a pedir por las calles."]
            tr: { en: "Having nothing to eat, he began begging in the streets.", uk: "Не маючи що їсти, він почав жебракувати на вулицях.", pt: "Não tendo o que comer, pôs-se a pedir pelas ruas.", fr: "N’ayant rien à manger, il s’est mis à mendier dans les rues.", de: "Da er nichts zu essen hatte, begann er, auf den Straßen zu betteln.", it: "Non avendo da mangiare, si mise a chiedere l'elemosina per le strade.", pl: "Nie mając co jeść, zaczął żebrać na ulicach.", tr: "Yiyecek bir şeyi olmadığı için sokaklarda dilenmeye başladı.", id: "Karena tidak punya makanan, dia mulai mengemis di jalanan.", vi: "Không có gì để ăn, anh ta bắt đầu đi xin ăn trên các con phố." }
          - level: C2
            use: { es: ["Concesión: el gerundio, con ", { term: y todo }, " o en forma compuesta, expresa un obstáculo que la acción supera."], en: ["Concession: the gerund, with ", { term: "y todo" }, " or in the perfect form, expresses an obstacle that the action overcomes."], uk: ["Допустовість: герундій із ", { term: "y todo" }, " або в перфектній формі виражає перешкоду, яку дія долає."], pt: ["Concessão: o gerúndio, com ", { term: "y todo" }, " ou em forma composta, expressa um obstáculo que a ação supera."], fr: ["Concession : le gérondif, avec ", { term: "y todo" }, " ou à la forme composée, exprime un obstacle que l’action surmonte."], de: ["Konzession: Das Gerundium drückt mit ", { term: "y todo" }, " oder in der zusammengesetzten Form ein Hindernis aus, das die Handlung überwindet."], it: ["Concessione: il gerundio, con ", { term: "y todo" }, " o in forma composta, esprime un ostacolo che l'azione supera."], pl: ["Przyzwolenie: gerundio z ", { term: "y todo" }, " lub w formie złożonej wyraża przeszkodę, którą czynność pokonuje."], tr: ["Ödün: ", { term: "y todo" }, " ile ya da bileşik biçimde kullanılan gerundio, eylemin aştığı bir engeli anlatır."], id: ["Konsesi: gerundio dengan ", { term: "y todo" }, " atau dalam bentuk majemuk menyatakan hambatan yang diatasi oleh tindakan itu."], vi: ["Nhượng bộ: gerundio, đi với ", { term: "y todo" }, " hoặc ở dạng hoàn thành, diễn tả một trở ngại mà hành động vượt qua."] }
            ex: { examples: [[{ target: "Lloviendo y todo" }, " salió sin paraguas."], [{ target: "Habiendo volado tanto" }, ", todavía le tiene miedo al avión."]] }
            tr: { en: { examples: ["Even with it raining, he went out without an umbrella.", "Having flown so much, he is still afraid of planes."] }, uk: { examples: ["Навіть попри дощ, він вийшов без парасольки.", "Стільки налітавшись, він усе ще боїться літаків."] }, pt: { examples: ["Mesmo chovendo, saiu sem guarda-chuva.", "Apesar de ter voado tanto, ainda tem medo de avião."] }, fr: { examples: ["Même s’il pleuvait, il est sorti sans parapluie.", "Malgré tous ses vols, il a encore peur de l’avion."] }, de: { examples: ["Obwohl es regnete, ging er ohne Regenschirm hinaus.", "Obwohl er so viel geflogen ist, hat er immer noch Angst vor dem Flugzeug."] }, it: { examples: ["Anche se pioveva, è uscito senza ombrello.", "Pur avendo volato tanto, ha ancora paura dell'aereo."] }, pl: { examples: ["Mimo że padało, wyszedł bez parasola.", "Choć tyle latał, nadal boi się samolotów."] }, tr: { examples: ["Yağmur yağmasına rağmen şemsiyesiz çıktı.", "Bu kadar çok uçmuş olmasına rağmen hâlâ uçaktan korkuyor."] }, id: { examples: ["Meskipun hujan, dia keluar tanpa payung.", "Meskipun sudah sering terbang, dia masih takut naik pesawat."] }, vi: { examples: ["Dù trời đang mưa, anh ấy vẫn ra ngoài mà không mang ô.", "Dù đã đi máy bay nhiều như vậy, anh ấy vẫn còn sợ máy bay."] } }
          - level: C2
            use: { es: "Condición con sujeto propio: el sujeto va detrás de estando.", en: "Condition with its own subject: the subject goes after estando.", uk: "Умова з власним підметом: підмет стоїть після estando.", pt: "Condição com sujeito próprio: o sujeito vai depois de estando.", fr: "Condition avec sujet propre : le sujet se place après estando.", de: "Bedingung mit eigenem Subjekt: Das Subjekt steht hinter estando.", it: "Condizione con soggetto proprio: il soggetto va dopo estando.", pl: "Warunek z własnym podmiotem: podmiot stoi po estando.", tr: "Kendi öznesi olan koşul: özne estando sözcüğünden sonra gelir.", id: "Syarat dengan subjek sendiri: subjek berada setelah estando.", vi: "Điều kiện có chủ ngữ riêng: chủ ngữ đứng sau estando." }
            ex: [{ target: "Estando yo" }, ", no se comportarán mal."]
            tr: { en: "As long as I'm there, they won't misbehave.", uk: "Поки я тут, вони погано себе не поводитимуть.", pt: "Estando eu presente, eles não se comportarão mal.", fr: "Tant que je suis là, ils ne se comporteront pas mal.", de: "Solange ich da bin, werden sie sich nicht schlecht benehmen.", it: "Se ci sono io, non si comporteranno male.", pl: "Jeśli ja tam będę, nie będą się źle zachowywać.", tr: "Ben oradayken kötü davranmazlar.", id: "Selama saya ada, mereka tidak akan berperilaku buruk.", vi: "Có tôi ở đó thì họ sẽ không cư xử tệ." }
          - level: C2
            use: { es: ["Gerundio lexicalizado: en la lengua coloquial admite ", { term: tan }, " como un adverbio."], en: ["Lexicalised gerund: in colloquial speech it accepts ", { term: "tan" }, " like an adverb."], uk: ["Лексикалізований герундій: у розмовній мові він допускає ", { term: "tan" }, " як прислівник."], pt: ["Gerúndio lexicalizado: na língua coloquial admite ", { term: "tan" }, " como um advérbio."], fr: ["Gérondif lexicalisé : dans la langue familière, il admet ", { term: "tan" }, " comme un adverbe."], de: ["Lexikalisiertes Gerundium: In der Umgangssprache nimmt es ", { term: "tan" }, " wie ein Adverb zu sich."], it: ["Gerundio lessicalizzato: nella lingua colloquiale ammette ", { term: "tan" }, " come un avverbio."], pl: ["Gerundio zleksykalizowane: w języku potocznym przyjmuje ", { term: "tan" }, " jak przysłówek."], tr: ["Sözcükleşmiş gerundio: gündelik dilde ", { term: "tan" }, " sözcüğünü bir zarf gibi alabilir."], id: ["Gerundio yang terleksikalisasi: dalam bahasa sehari-hari, ia menerima ", { term: "tan" }, " seperti kata keterangan."], vi: ["Gerundio đã từ vựng hoá: trong văn nói, nó nhận ", { term: "tan" }, " như một trạng từ."] }
            ex: ["Salió ", { target: "tan corriendo" }, " que dejó la puerta abierta."]
            tr: { en: "He left in such a rush that he left the door open.", uk: "Він так поспіхом вибіг, що залишив двері відчиненими.", pt: "Saiu tão correndo que deixou a porta aberta.", fr: "Il est sorti si vite qu’il a laissé la porte ouverte.", de: "Er rannte so schnell hinaus, dass er die Tür offen ließ.", it: "È uscito così di corsa che ha lasciato la porta aperta.", pl: "Wybiegł tak szybko, że zostawił drzwi otwarte.", tr: "O kadar koşarak çıktı ki kapıyı açık bıraktı.", id: "Dia keluar berlari begitu cepat sampai membiarkan pintunya terbuka.", vi: "Anh ấy chạy ra vội đến nỗi để cửa mở." }
      - type: list
        items:
          - type: note
            level: B2
            text: { es: ["La formación del gerundio: ", { link: "Estar con gerundio", to: es.presente.estar-gerundio }, "; las perífrasis con gerundio: ", { link: Perífrasis, to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], en: ["How the gerund is formed: ", { link: "Present Continuous", to: es.presente.estar-gerundio }, "; verb phrases with the gerund: ", { link: "Verb Phrases", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], uk: ["Утворення герундія: ", { link: "Estar з герундієм", to: es.presente.estar-gerundio }, "; перифрази з герундієм: ", { link: "Перифрази", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], pt: ["A formação do gerúndio: ", { link: "Estar com gerúndio", to: es.presente.estar-gerundio }, "; as perífrases com gerúndio: ", { link: "Perífrases verbais", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], fr: ["La formation du gérondif : ", { link: "Estar avec le gérondif", to: es.presente.estar-gerundio }, " ; les périphrases avec le gérondif : ", { link: "Périphrases verbales", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], de: ["Die Bildung des Gerundiums: ", { link: "Estar mit Gerundium", to: es.presente.estar-gerundio }, "; die Periphrasen mit Gerundium: ", { link: "Verbalperiphrasen", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], it: ["La formazione del gerundio: ", { link: "Estar con il gerundio", to: es.presente.estar-gerundio }, "; le perifrasi con il gerundio: ", { link: "Perifrasi verbali", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], pl: ["Tworzenie gerundio: ", { link: "Estar z gerundio", to: es.presente.estar-gerundio }, "; peryfrazy z gerundio: ", { link: "Peryfrazy czasownikowe", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], tr: ["Gerundio biçiminin oluşumu: ", { link: "Estar ile gerundio", to: es.presente.estar-gerundio }, "; gerundio ile kurulan perifrazlar: ", { link: "Fiil perifrazları", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], id: ["Pembentukan gerundio: ", { link: "Estar dengan gerundio", to: es.presente.estar-gerundio }, "; perifrasis dengan gerundio: ", { link: "Perifrasis verbal", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."], vi: ["Cách tạo gerundio: ", { link: "Estar với gerundio", to: es.presente.estar-gerundio }, "; các cụm động từ với gerundio: ", { link: "Cụm động từ", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."] }
          - type: note
            level: C2
            variety: es-419
            text: { es: ["Los diminutivos: ", { link: "Diminutivos y aumentativos", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], en: ["Diminutives: ", { link: "Diminutives and Augmentatives", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], uk: ["Зменшувальні форми: ", { link: "Зменшувальні та збільшувальні форми", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], pt: ["Os diminutivos: ", { link: "Diminutivos e aumentativos", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], fr: ["Les diminutifs : ", { link: "Diminutifs et augmentatifs", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], de: ["Die Verkleinerungsformen: ", { link: "Verkleinerung und Vergrößerung", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], it: ["I diminutivi: ", { link: "Diminutivi e accrescitivi", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], pl: ["Zdrobnienia: ", { link: "Zdrobnienia i zgrubienia", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], tr: ["Küçültme biçimleri: ", { link: "Küçültme ve büyütme", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], id: ["Diminutif: ", { link: "Diminutif dan augmentatif", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."], vi: ["Các dạng chỉ sự nhỏ bé: ", { link: "Dạng chỉ sự nhỏ bé và to lớn", to: es.sustantivo-determinantes.sufijos-apreciativos }, "."] }

  - title: { es: "Participio: predicativo y construcción absoluta", en: "Participle: predicative and absolute construction", uk: "Дієприкметник: предикативна ознака й абсолютна конструкція", pt: "Particípio: predicativo e construção absoluta", fr: "Participe passé : attribut et construction absolue", de: "Partizip: Prädikativ und absolute Konstruktion", it: "Participio: predicativo e costruzione assoluta", pl: "Imiesłów: dopowiedzenie i konstrukcja absolutna", tr: "Participio: niteleyen sıfat ve mutlak yapı", id: "Partisip: predikatif dan konstruksi absolut", vi: "Quá khứ phân từ: tính từ miêu tả và cấu trúc tuyệt đối" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "Predicativo del sujeto: el participio concuerda con el sujeto y admite complementos.", en: "Predicative of the subject: the participle agrees with the subject and takes complements.", uk: "Предикативна ознака підмета: дієприкметник узгоджується з підметом і приймає залежні слова.", pt: "Predicativo do sujeito: o particípio concorda com o sujeito e admite complementos.", fr: "Attribut du sujet : le participe passé s’accorde avec le sujet et admet des compléments.", de: "Subjektsprädikativ: Das Partizip richtet sich nach dem Subjekt und nimmt Ergänzungen zu sich.", it: "Predicativo del soggetto: il participio concorda con il soggetto e ammette complementi.", pl: "Dopowiedzenie podmiotu: imiesłów zgadza się z podmiotem i przyjmuje dopełnienia.", tr: "Özneyi niteleyen sıfat: participio özneyle uyum sağlar ve tümleç alabilir.", id: "Predikatif subjek: partisip menyesuaikan dengan subjek dan boleh memiliki pelengkap.", vi: "Tính từ miêu tả chủ ngữ: quá khứ phân từ hòa hợp với chủ ngữ và có thể đi kèm bổ ngữ." }
            ex: ["Me miró ", { target: "sorprendido de mi respuesta" }, "."]
            tr: { en: "He looked at me, surprised at my answer.", uk: "Він подивився на мене, здивований моєю відповіддю.", pt: "Ele me olhou surpreso com a minha resposta.", fr: "Il m’a regardé, surpris de ma réponse.", de: "Er sah mich überrascht von meiner Antwort an.", it: "Mi ha guardato sorpreso della mia risposta.", pl: "Spojrzał na mnie zaskoczony moją odpowiedzią.", tr: "Cevabıma şaşırmış bir halde bana baktı.", id: "Dia menatap saya, terkejut dengan jawaban saya.", vi: "Anh ấy nhìn tôi, ngạc nhiên trước câu trả lời của tôi." }
          - level: B2
            use: { es: "Predicativo del complemento directo: el participio concuerda con el complemento y admite complementos.", en: "Predicative of the direct object: the participle agrees with the object and takes complements.", uk: "Предикативна ознака прямого додатка: дієприкметник узгоджується з додатком і приймає залежні слова.", pt: "Predicativo do objeto direto: o particípio concorda com o complemento e admite complementos.", fr: "Attribut de l’objet direct : le participe passé s’accorde avec le complément et admet des compléments.", de: "Objektsprädikativ: Das Partizip richtet sich nach dem Objekt und nimmt Ergänzungen zu sich.", it: "Predicativo dell'oggetto diretto: il participio concorda con il complemento e ammette complementi.", pl: "Dopowiedzenie dopełnienia bliższego: imiesłów zgadza się z dopełnieniem i przyjmuje dopełnienia.", tr: "Doğrudan nesneyi niteleyen sıfat: participio nesneyle uyum sağlar ve tümleç alabilir.", id: "Predikatif objek langsung: partisip menyesuaikan dengan objek dan boleh memiliki pelengkap.", vi: "Tính từ miêu tả tân ngữ trực tiếp: quá khứ phân từ hòa hợp với tân ngữ và có thể đi kèm bổ ngữ." }
            ex: ["Encontré a Sara ", { target: "cansada por el esfuerzo" }, "."]
            tr: { en: "I found Sara tired from the effort.", uk: "Я застав Сару втомленою від зусиль.", pt: "Encontrei a Sara cansada pelo esforço.", fr: "J’ai trouvé Sara fatiguée par l’effort.", de: "Ich fand Sara müde von der Anstrengung vor.", it: "Ho trovato Sara stanca per lo sforzo.", pl: "Zastałem Sarę zmęczoną wysiłkiem.", tr: "Sara’yı çabadan yorgun buldum.", id: "Saya mendapati Sara lelah karena usaha itu.", vi: "Tôi thấy Sara mệt vì đã gắng sức." }
          - level: C1
            use: { es: "Participio independiente: en una exclamación o una pregunta expresa un estado.", en: "Independent participle: in an exclamation or a question it expresses a state.", uk: "Самостійний дієприкметник: у вигуку чи запитанні виражає стан.", pt: "Particípio independente: em uma exclamação ou pergunta, expressa um estado.", fr: "Participe passé indépendant : dans une exclamation ou une question, il exprime un état.", de: "Selbstständiges Partizip: In einem Ausruf oder einer Frage drückt es einen Zustand aus.", it: "Participio indipendente: in un'esclamazione o in una domanda esprime uno stato.", pl: "Imiesłów samodzielny: w wykrzyknieniu lub pytaniu wyraża stan.", tr: "Bağımsız participio: ünlemde ya da soruda bir durumu anlatır.", id: "Partisip mandiri: dalam seruan atau pertanyaan, ia menyatakan suatu keadaan.", vi: "Quá khứ phân từ độc lập: trong câu cảm thán hoặc câu hỏi, nó diễn tả một trạng thái." }
            ex: { examples: [["¡", { target: "Encerrada en estas cuatro paredes" }, "!"], ["¿", { target: Confundido }, "? No, estoy segurísimo."]] }
            tr: { en: { examples: ["Shut up within these four walls!", "Confused? No, I'm absolutely sure."] }, uk: { examples: ["Замкнена в цих чотирьох стінах!", "Розгублений? Ні, я цілком упевнений."] }, pt: { examples: ["Trancada entre estas quatro paredes!", "Confuso? Não, tenho certeza absoluta."] }, fr: { examples: ["Enfermée entre ces quatre murs !", "Confus ? Non, j’en suis absolument sûr."] }, de: { examples: ["Eingesperrt zwischen diesen vier Wänden!", "Verwirrt? Nein, ich bin mir ganz sicher."] }, it: { examples: ["Rinchiusa fra queste quattro mura!", "Confuso? No, sono sicurissimo."] }, pl: { examples: ["Zamknięta w czterech ścianach!", "Zmieszany? Nie, jestem pewien na sto procent."] }, tr: { examples: ["Bu dört duvar arasına kapatılmış!", "Kafam mı karışık? Hayır, çok eminim."] }, id: { examples: ["Terkurung di antara empat dinding ini!", "Bingung? Tidak, saya sangat yakin."] }, vi: { examples: ["Bị nhốt trong bốn bức tường này!", "Bối rối ư? Không, tôi hoàn toàn chắc chắn."] } }
          - level: C1
            use: { es: "Construcción absoluta: el participio concuerda con su sujeto y expresa tiempo o causa.", en: "Absolute construction: the participle agrees with its subject and expresses time or cause.", uk: "Абсолютна конструкція: дієприкметник узгоджується зі своїм підметом і виражає час або причину.", pt: "Construção absoluta: o particípio concorda com o seu sujeito e expressa tempo ou causa.", fr: "Construction absolue : le participe passé s’accorde avec son sujet et exprime le temps ou la cause.", de: "Absolute Konstruktion: Das Partizip richtet sich nach seinem Subjekt und drückt Zeit oder Grund aus.", it: "Costruzione assoluta: il participio concorda con il suo soggetto ed esprime tempo o causa.", pl: "Konstrukcja absolutna: imiesłów zgadza się ze swoim podmiotem i wyraża czas lub przyczynę.", tr: "Mutlak yapı: participio kendi öznesiyle uyum sağlar ve zaman ya da neden bildirir.", id: "Konstruksi absolut: partisip menyesuaikan dengan subjeknya dan menyatakan waktu atau sebab.", vi: "Cấu trúc tuyệt đối: quá khứ phân từ hòa hợp với chủ ngữ của nó và diễn tả thời gian hoặc nguyên nhân." }
            ex: [{ target: "Terminada la investigación" }, ", se cerró el caso."]
            tr: { en: "Once the investigation was over, the case was closed.", uk: "Після завершення розслідування справу закрили.", pt: "Terminada a investigação, o caso foi encerrado.", fr: "L’enquête terminée, l’affaire a été classée.", de: "Nach Abschluss der Untersuchung wurde der Fall geschlossen.", it: "Terminata l'indagine, il caso è stato chiuso.", pl: "Po zakończeniu śledztwa sprawę zamknięto.", tr: "Soruşturma tamamlanınca dava kapatıldı.", id: "Setelah penyelidikan selesai, kasus itu ditutup.", vi: "Cuộc điều tra kết thúc, vụ án được đóng lại." }
          - level: C2
            use: { es: ["Construcción absoluta con nexo: ", { term: hasta }, " y ", { term: apenas }, " precisan el momento."], en: ["Absolute construction with a connector: ", { term: "hasta" }, " and ", { term: "apenas" }, " pinpoint the moment."], uk: ["Абсолютна конструкція зі сполучником: ", { term: "hasta" }, " і ", { term: "apenas" }, " уточнюють момент."], pt: ["Construção absoluta com conector: ", { term: "hasta" }, " e ", { term: "apenas" }, " precisam o momento."], fr: ["Construction absolue avec connecteur : ", { term: "hasta" }, " et ", { term: "apenas" }, " précisent le moment."], de: ["Absolute Konstruktion mit Konnektor: ", { term: "hasta" }, " und ", { term: "apenas" }, " bestimmen den Zeitpunkt genauer."], it: ["Costruzione assoluta con connettivo: ", { term: "hasta" }, " e ", { term: "apenas" }, " precisano il momento."], pl: ["Konstrukcja absolutna ze spójnikiem: ", { term: "hasta" }, " i ", { term: "apenas" }, " precyzują moment."], tr: ["Bağlayıcılı mutlak yapı: ", { term: "hasta" }, " ve ", { term: "apenas" }, " anı belirginleştirir."], id: ["Konstruksi absolut dengan penghubung: ", { term: "hasta" }, " dan ", { term: "apenas" }, " menegaskan saatnya."], vi: ["Cấu trúc tuyệt đối có từ nối: ", { term: "hasta" }, " và ", { term: "apenas" }, " xác định rõ thời điểm."] }
            ex: { examples: [[{ target: "Hasta concluidas las tres horas" }, " no nos pudimos mover."], [{ target: "Apenas terminada la reunión" }, ", salimos corriendo."]] }
            tr: { en: { examples: ["Until the three hours were over, we could not move.", "As soon as the meeting was over, we rushed out."] }, uk: { examples: ["Доки не минуло три години, ми не могли поворухнутися.", "Щойно збори закінчилися, ми вибігли."] }, pt: { examples: ["Até que se completassem as três horas, não pudemos nos mover.", "Mal terminada a reunião, saímos correndo."] }, fr: { examples: ["Jusqu’à la fin des trois heures, nous n’avons pas pu bouger.", "À peine la réunion terminée, nous sommes sortis en courant."] }, de: { examples: ["Bis die drei Stunden vorbei waren, konnten wir uns nicht bewegen.", "Kaum war die Sitzung zu Ende, rannten wir hinaus."] }, it: { examples: ["Fino al termine delle tre ore non siamo riusciti a muoverci.", "Appena finita la riunione, siamo usciti di corsa."] }, pl: { examples: ["Dopóki nie minęły trzy godziny, nie mogliśmy się ruszyć.", "Ledwie zebranie się skończyło, wybiegliśmy."] }, tr: { examples: ["Üç saat dolana kadar kıpırdayamadık.", "Toplantı biter bitmez koşarak çıktık."] }, id: { examples: ["Sampai tiga jam itu berlalu, kami tidak bisa bergerak.", "Begitu rapat selesai, kami langsung berlari keluar."] }, vi: { examples: ["Cho đến khi ba tiếng trôi qua, chúng tôi không thể nhúc nhích.", "Vừa họp xong, chúng tôi chạy ra ngoài ngay."] } }
          - level: C2
            use: { es: ["En la lengua coloquial, ", { mapping: [{ term: -ado }, { term: -ao }] }, " pierde la ", { letter: d }, "."], en: ["In colloquial speech, ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " drops the ", { letter: "d" }, "."], uk: ["У розмовній мові у ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " випадає ", { letter: "d" }, "."], pt: ["Na língua coloquial, em ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " cai o ", { letter: "d" }, "."], fr: ["Dans la langue familière, ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " fait tomber le ", { letter: "d" }, "."], de: ["In der Umgangssprache verliert ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " das ", { letter: "d" }, "."], it: ["Nella lingua colloquiale, ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " perde la ", { letter: "d" }, "."], pl: ["W języku potocznym ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " traci ", { letter: "d" }, "."], tr: ["Gündelik dilde ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " dönüşümünde ", { letter: "d" }, " harfi düşer."], id: ["Dalam bahasa sehari-hari, ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " kehilangan ", { letter: "d" }, "."], vi: ["Trong văn nói, ", { mapping: [{ term: "-ado" }, { term: "-ao" }] }, " mất chữ ", { letter: "d" }, "."] }
            ex: ["Ya he ", { target: comprao }, " el pan."]
            tr: { en: "I've already bought the bread.", uk: "Я вже купив хліб.", pt: "Já comprei o pão.", fr: "J’ai déjà acheté le pain.", de: "Ich habe das Brot schon gekauft.", it: "Ho già comprato il pane.", pl: "Już kupiłem chleb.", tr: "Ekmeği çoktan aldım.", id: "Saya sudah membeli roti itu.", vi: "Tôi đã mua bánh mì rồi." }
      - type: list
