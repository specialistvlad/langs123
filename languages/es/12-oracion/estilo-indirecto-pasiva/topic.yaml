          rule: { es: [{ term: se }, " con verbo en singular y ", { term: a }, " delante de la persona"], en: [{ term: "se" }, " with a singular verb and ", { term: "a" }, " before the person"], uk: [{ term: "se" }, " з дієсловом в однині та ", { term: "a" }, " перед особою"], pt: [{ term: "se" }, " com verbo no singular e ", { term: "a" }, " diante da pessoa"], fr: [{ term: "se" }, " avec le verbe au singulier et ", { term: "a" }, " devant la personne"], de: [{ term: "se" }, " mit Verb im Singular und ", { term: "a" }, " vor der Person"], it: [{ term: "se" }, " con il verbo al singolare e ", { term: "a" }, " davanti alla persona"], pl: [{ term: "se" }, " z czasownikiem w liczbie pojedynczej i ", { term: "a" }, " przed osobą"], tr: [{ term: "se" }, " ile tekil fiil ve kişinin önünde ", { term: "a" }], id: [{ term: "se" }, " dengan kata kerja tunggal dan ", { term: "a" }, " di depan orangnya"], vi: [{ term: "se" }, " với động từ số ít và ", { term: "a" }, " trước người được nhắc đến"] }
          ex: [{ target: "Se saludó a" }, " los conferenciantes."]
          tr: { en: "The speakers were greeted.", uk: "Привітали доповідачів.", pt: "Cumprimentaram os palestrantes.", fr: "On a salué les conférenciers.", de: "Die Redner wurden begrüßt.", it: "I relatori sono stati salutati.", pl: "Powitano prelegentów.", tr: "Konuşmacılar selamlandı.", id: "Para pembicara disambut.", vi: "Người ta chào đón các diễn giả." }
        - level: C2
          point: { es: Voz media, en: "Middle voice", uk: "Медіальний стан", pt: "Voz média", fr: "Voix moyenne", de: "Mediale Konstruktion", it: "Forma media", pl: "Strona medialna", tr: "Orta çatı", id: "Diatesis medial", vi: "Thể trung gian" }
          rule: { es: ["con ciertos verbos el ", { term: se }, " es opcional"], en: ["with certain verbs, ", { term: "se" }, " is optional"], uk: ["з певними дієсловами ", { term: "se" }, " необов’язкове"], pt: ["com certos verbos o ", { term: "se" }, " é opcional"], fr: ["avec certains verbes, ", { term: "se" }, " est facultatif"], de: ["bei bestimmten Verben ist ", { term: "se" }, " optional"], it: ["con certi verbi ", { term: "se" }, " è facoltativo"], pl: ["przy niektórych czasownikach ", { term: "se" }, " jest opcjonalne"], tr: ["bazı fiillerde ", { term: "se" }, " isteğe bağlıdır"], id: ["pada beberapa kata kerja ", { term: "se" }, " bersifat opsional"], vi: ["với một số động từ, ", { term: "se" }, " là tùy chọn"] }
          ex: { examples: [["Esta ventana no ", { target: "se cierra" }, " bien."], ["Esta ventana no ", { target: cierra }, " bien."]] }
          tr: { en: { examples: ["This window doesn't close properly.", "This window doesn't close properly."] }, uk: { examples: ["Це вікно погано зачиняється.", "Це вікно погано зачиняється."] }, pt: { examples: ["Esta janela não fecha bem.", "Esta janela não fecha bem."] }, fr: { examples: ["Cette fenêtre ne ferme pas bien.", "Cette fenêtre ne ferme pas bien."] }, de: { examples: ["Dieses Fenster schließt nicht richtig.", "Dieses Fenster schließt nicht richtig."] }, it: { examples: ["Questa finestra non si chiude bene.", "Questa finestra non si chiude bene."] }, pl: { examples: ["To okno źle się zamyka.", "To okno źle się zamyka."] }, tr: { examples: ["Bu pencere iyi kapanmıyor.", "Bu pencere iyi kapanmıyor."] }, id: { examples: ["Jendela ini tidak bisa ditutup dengan baik.", "Jendela ini tidak bisa ditutup dengan baik."] }, vi: { examples: ["Cửa sổ này đóng không chặt.", "Cửa sổ này đóng không chặt."] } }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "pronouns and possessives change with the speaker"
            es: "los pronombres y los posesivos cambian con el hablante"
            uk: "займенники й присвійні займенники змінюються разом із мовцем"
            pt: "os pronomes e os possessivos mudam com o falante"
            fr: "les pronoms et les possessifs changent avec le locuteur"
            de: "Pronomen und Possessivbegleiter ändern sich mit dem Sprecher"
            it: "i pronomi e i possessivi cambiano con chi parla"
            pl: "zaimki i zaimki dzierżawcze zmieniają się wraz z mówiącym"
            tr: "zamirler ve iyelik sözcükleri konuşana göre değişir"
            id: "kata ganti dan kata milik berubah sesuai pembicara"
            vi: "đại từ và từ sở hữu thay đổi theo người nói"
          ex: { mapping: ["Mi casa es pequeña.", ["Dice que ", { target: su }, " casa es pequeña."]] }
          tr: { en: { mapping: ["My house is small.", "She says her house is small."] }, uk: { mapping: ["Мій будинок маленький.", "Вона каже, що її будинок маленький."] }, pt: { mapping: ["Minha casa é pequena.", "Ela diz que a casa dela é pequena."] }, fr: { mapping: ["Ma maison est petite.", "Elle dit que sa maison est petite."] }, de: { mapping: ["Mein Haus ist klein.", "Sie sagt, dass ihr Haus klein ist."] }, it: { mapping: ["La mia casa è piccola.", "Dice che la sua casa è piccola."] }, pl: { mapping: ["Mój dom jest mały.", "Mówi, że jej dom jest mały."] }, tr: { mapping: ["Evim küçük.", "Evinin küçük olduğunu söylüyor."] }, id: { mapping: ["Rumah saya kecil.", "Dia bilang rumahnya kecil."] }, vi: { mapping: ["Nhà của tôi nhỏ.", "Cô ấy nói nhà của cô ấy nhỏ."] } }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
