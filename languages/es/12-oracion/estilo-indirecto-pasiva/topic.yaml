            reported: { ex: ["Dice que ", { target: tiene }, " hambre."], tr: { en: "She says she's hungry.", uk: "Вона каже, що голодна.", pt: "Ela diz que está com fome.", fr: "Elle dit qu’elle a faim.", de: "Sie sagt, dass sie Hunger hat.", it: "Dice che ha fame.", pl: "Mówi, że jest głodna.", tr: "Aç olduğunu söylüyor.", id: "Dia bilang dia lapar.", vi: "Cô ấy nói rằng cô ấy đói." } }
