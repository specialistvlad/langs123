            reported: { ex: ["Pregunta ", { target: si }, " vienes."], tr: { en: "She's asking if you're coming.", uk: "Вона питає, чи ти прийдеш.", pt: "Ela pergunta se você vem.", fr: "Elle demande si tu viens.", de: "Sie fragt, ob du kommst.", it: "Chiede se vieni.", pl: "Pyta, czy przyjdziesz.", tr: "Geleceğini soruyor.", id: "Dia bertanya apakah kamu datang.", vi: "Cô ấy hỏi bạn có đến không." } }
          - level: B1
            said: { ex: "¿Dónde vives?", tr: { en: "Where do you live?", uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove abiti?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Di mana kamu tinggal?", vi: "Bạn sống ở đâu?" } }
            reported: { ex: ["Me preguntó ", { target: dónde }, " vivía."], tr: { en: "He asked me where I lived.", uk: "Він запитав мене, де я живу.", pt: "Ele me perguntou onde eu morava.", fr: "Il m’a demandé où j’habitais.", de: "Er hat mich gefragt, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytał mnie, gdzie mieszkam.", tr: "Nerede yaşadığımı sordu.", id: "Dia bertanya kepada saya di mana saya tinggal.", vi: "Anh ấy hỏi tôi sống ở đâu." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["After ", { term: dice que }, ", the tense stays; the person, the pronouns and the possessives change to fit the new speaker."]
              es: ["Detrás de ", { term: dice que }, ", el tiempo se mantiene; la persona, los pronombres y los posesivos cambian según el nuevo hablante."]
              uk: ["Після ", { term: "dice que" }, " час не змінюється; особа, займенники й присвійні займенники змінюються відповідно до нового мовця."]
              pt: ["Depois de ", { term: "dice que" }, " o tempo se mantém; a pessoa, os pronomes e os possessivos mudam conforme o novo falante."]
              fr: ["Après ", { term: "dice que" }, ", le temps reste le même ; la personne, les pronoms et les possessifs changent selon le nouveau locuteur."]
              de: ["Nach ", { term: "dice que" }, " bleibt die Zeitform; die Person, die Pronomen und die Possessivbegleiter ändern sich mit dem neuen Sprecher."]
              it: ["Dopo ", { term: "dice que" }, " il tempo resta uguale; la persona, i pronomi e i possessivi cambiano secondo il nuovo parlante."]
              pl: ["Po ", { term: "dice que" }, " czas się nie zmienia; osoba, zaimki i zaimki dzierżawcze zmieniają się zależnie od nowego mówiącego."]
              tr: [{ term: "dice que" }, " sonrasında zaman değişmez; kişi, zamirler ve iyelik sözcükleri yeni konuşana göre değişir."]
              id: ["Setelah ", { term: "dice que" }, ", tense tetap; orang, kata ganti, dan kata milik berubah sesuai pembicara yang baru."]
              vi: ["Sau ", { term: "dice que" }, " thì giữ nguyên; ngôi, đại từ và từ sở hữu thay đổi theo người nói mới."]
          - type: rule
            level: B1
            text:
              en: ["After ", { term: dijo que }, ", a present becomes the imperfect:"]
              es: ["Detrás de ", { term: dijo que }, ", el presente pasa a imperfecto:"]
              uk: ["Після ", { term: "dijo que" }, " теперішній час стає імперфектом:"]
              pt: ["Depois de ", { term: "dijo que" }, ", o presente passa ao pretérito imperfeito:"]
              fr: ["Après ", { term: "dijo que" }, ", le présent passe à l’imparfait :"]
              de: ["Nach ", { term: "dijo que" }, " wird das Präsens zum Imperfecto:"]
              it: ["Dopo ", { term: "dijo que" }, " il presente passa all'imperfetto:"]
              pl: ["Po ", { term: "dijo que" }, " czas teraźniejszy zmienia się w imperfecto:"]
              tr: [{ term: "dijo que" }, " sonrasında şimdiki zaman imperfecto olur:"]
              id: ["Setelah ", { term: "dijo que" }, ", present berubah menjadi imperfecto:"]
              vi: ["Sau ", { term: "dijo que" }, " thì hiện tại chuyển thành imperfecto:"]
            ex: { mapping: ["Estoy cansada.", ["Dijo que ", { target: estaba }, " cansada."]] }
            tr: { en: { mapping: ["I'm tired.", "She said she was tired."] }, uk: { mapping: ["Я втомлена.", "Вона сказала, що втомлена."] }, pt: { mapping: ["Estou cansada.", "Ela disse que estava cansada."] }, fr: { mapping: ["Je suis fatiguée.", "Elle a dit qu’elle était fatiguée."] }, de: { mapping: ["Ich bin müde.", "Sie sagte, dass sie müde war."] }, it: { mapping: ["Sono stanca.", "Ha detto che era stanca."] }, pl: { mapping: ["Jestem zmęczona.", "Powiedziała, że jest zmęczona."] }, tr: { mapping: ["Yorgunum.", "Yorgun olduğunu söyledi."] }, id: { mapping: ["Saya lelah.", "Dia bilang dia lelah."] }, vi: { mapping: ["Tôi mệt.", "Cô ấy nói rằng cô ấy mệt."] } }
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українська не змінює час у непрямій мові: ", { l1: "сказала, що втомлена" }, ". Іспанська після ", { term: "dijo que" }, " переводить теперішній час в імперфект: ", { term: "dijo que estaba cansada" }, "."]
          - type: rule
            level: B1
            text:
              en: ["An order becomes ", { term: que }, " with the present subjunctive:"]
              es: ["Una orden pasa a ", { term: que }, " con presente de subjuntivo:"]
              uk: ["Наказ стає реченням з ", { term: "que" }, " і теперішнім часом суб’юнктива:"]
              pt: ["Uma ordem passa a ", { term: "que" }, " com presente do subjuntivo:"]
              fr: ["Un ordre devient ", { term: "que" }, " avec le présent du subjonctif :"]
              de: ["Eine Aufforderung wird zu ", { term: "que" }, " mit dem Konjunktiv Präsens:"]
              it: ["Un ordine diventa ", { term: "que" }, " con il presente del congiuntivo:"]
              pl: ["Polecenie zamienia się w ", { term: "que" }, " z czasem teraźniejszym trybu łączącego:"]
              tr: ["Emir, ", { term: "que" }, " ile dilek kipinin şimdiki zamanına dönüşür:"]
              id: ["Perintah berubah menjadi ", { term: "que" }, " dengan present subjungtif:"]
              vi: ["Một mệnh lệnh chuyển thành ", { term: "que" }, " với thì hiện tại thức giả định:"]
            ex: { mapping: [{ target: Ven. }, ["Dice que ", { target: vengas }, "."]] }
            tr: { en: { mapping: ["Come.", "She says you should come."] }, uk: { mapping: ["Приходь.", "Вона каже, щоб ти прийшов."] }, pt: { mapping: ["Venha.", "Ela diz para você vir."] }, fr: { mapping: ["Viens.", "Elle te dit de venir."] }, de: { mapping: ["Komm.", "Sie sagt, du sollst kommen."] }, it: { mapping: ["Vieni.", "Dice di venire."] }, pl: { mapping: ["Przyjdź.", "Mówi, żebyś przyszedł."] }, tr: { mapping: ["Gel.", "Gelmeni söylüyor."] }, id: { mapping: ["Datanglah.", "Dia menyuruhmu datang."] }, vi: { mapping: ["Đến đây.", "Cô ấy bảo bạn đến."] } }
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українською наказ передаємо через ", { l1: "щоб" }, ": ", { l1: "каже, щоб ти прийшов" }, "; іспанською — ", { term: "que" }, " із суб’юнктивом: ", { term: "dice que vengas" }, "."]
          - type: rule
            level: B1
            text:
              en: ["A yes-no question takes ", { term: si }, "; a question word stays, with its accent."]
              es: ["Una pregunta de sí o no lleva ", { term: si }, "; el interrogativo se mantiene, con su tilde."]
              uk: ["Загальне питання вводить ", { term: "si" }, "; питальне слово лишається зі знаком наголосу."]
              pt: ["Uma pergunta de sim ou não leva ", { term: "si" }, "; a palavra interrogativa se mantém, com seu acento."]
              fr: ["Une question fermée prend ", { term: "si" }, " ; le mot interrogatif reste, avec son accent."]
              de: ["Eine Ja-Nein-Frage steht mit ", { term: "si" }, "; das Fragewort bleibt, mit seinem Akzent."]
              it: ["Una domanda di sì o no vuole ", { term: "si" }, "; la parola interrogativa resta, con il suo accento."]
              pl: ["Pytanie rozstrzygnięcia wprowadza ", { term: "si" }, "; słowo pytające zostaje ze swoim akcentem."]
              tr: ["Evet-hayır sorusu ", { term: "si" }, " ile kurulur; soru sözcüğü vurgu işaretiyle kalır."]
              id: ["Pertanyaan ya atau tidak memakai ", { term: "si" }, "; kata tanya tetap, dengan aksennya."]
              vi: ["Câu hỏi có/không dùng ", { term: "si" }, "; từ để hỏi giữ nguyên, kèm dấu của nó."]
          - type: note
            level: B1
            text:
              en: ["The forms of the subjunctive: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas del subjuntivo: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми суб’юнктива: ", { link: "Теперішній час суб’юнктива: форми", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              pt: ["As formas do subjuntivo: ", { link: "O presente do subjuntivo: formas", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              fr: ["Les formes du subjonctif : ", { link: "Le présent du subjonctif : formes", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              de: ["Die Formen des Konjunktivs: ", { link: "Der Konjunktiv Präsens: Formen", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              it: ["Le forme del congiuntivo: ", { link: "Il presente del congiuntivo: forme", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              pl: ["Formy trybu łączącego: ", { link: "Czas teraźniejszy trybu łączącego: formy", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              tr: ["Dilek kipinin biçimleri: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              id: ["Bentuk subjungtif: ", { link: "Presente subjungtif: bentuk", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              vi: ["Các dạng của thức giả định: ", { link: "Thì hiện tại thức giả định: các dạng", to: "es.subjuntivo.subjuntivo-formas" }, "."]

