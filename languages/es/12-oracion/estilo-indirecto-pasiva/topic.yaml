          rule: { es: [{ term: ser }, " con participio, la acción; ", { term: estar }, " con participio, el resultado"], en: [{ term: "ser" }, " with a participle, the action; ", { term: "estar" }, " with a participle, the result"], uk: [{ term: "ser" }, " з дієприкметником — дія; ", { term: "estar" }, " з дієприкметником — результат"], pt: [{ term: "ser" }, " com particípio, a ação; ", { term: "estar" }, " com particípio, o resultado"], fr: [{ term: "ser" }, " avec le participe, l’action ; ", { term: "estar" }, " avec le participe, le résultat"], de: [{ term: "ser" }, " mit Partizip, die Handlung; ", { term: "estar" }, " mit Partizip, das Ergebnis"], it: [{ term: "ser" }, " con il participio, l'azione; ", { term: "estar" }, " con il participio, il risultato"], pl: [{ term: "ser" }, " z imiesłowem — czynność; ", { term: "estar" }, " z imiesłowem — wynik"], tr: [{ term: "ser" }, " ile participio, eylem; ", { term: "estar" }, " ile participio, sonuç"], id: [{ term: "ser" }, " dengan partisip, tindakan; ", { term: "estar" }, " dengan partisip, hasil"], vi: [{ term: "ser" }, " với quá khứ phân từ, hành động; ", { term: "estar" }, " với quá khứ phân từ, kết quả"] }
          ex: { examples: [["Las puertas ", { target: "fueron abiertas" }, " a las diez."], ["Las puertas ", { target: "están abiertas" }, " desde las diez."]] }
