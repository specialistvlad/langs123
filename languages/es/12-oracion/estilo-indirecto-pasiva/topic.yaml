            uk: ["іменник у множині — дієслово в множині: ", { term: "se venden" }]
            pt: ["uma coisa no plural leva o verbo no plural: ", { term: "se venden" }]
            fr: ["une chose au pluriel veut le verbe au pluriel : ", { term: "se venden" }]
            de: ["eine Sache im Plural verlangt das Verb im Plural: ", { term: "se venden" }]
            it: ["una cosa al plurale vuole il verbo al plurale: ", { term: "se venden" }]
            pl: ["rzecz w liczbie mnogiej wymaga czasownika w liczbie mnogiej: ", { term: "se venden" }]
            tr: ["çoğul nesne çoğul fiil ister: ", { term: "se venden" }]
            id: ["benda jamak memakai kata kerja jamak: ", { term: "se venden" }]
