        - level: C1
          point: { es: Pasiva de resultado, en: "Passive of result", uk: "Пасив результату", pt: "Passiva de resultado", fr: "Passif de résultat", de: "Resultativpassiv", it: "Passivo di risultato", pl: "Strona bierna rezultatu", tr: "Sonuç bildiren edilgen yapı", id: "Pasif hasil", vi: "Bị động chỉ kết quả" }
          rule: { es: [{ term: estar }, " con participio no lleva agente con ", { term: por }], en: [{ term: "estar" }, " with a participle takes no agent with ", { term: "por" }], uk: [{ term: "estar" }, " з дієприкметником не має виконавця з ", { term: "por" }], pt: [{ term: "estar" }, " com particípio não leva agente com ", { term: "por" }], fr: [{ term: "estar" }, " avec le participe ne prend pas d’agent avec ", { term: "por" }], de: [{ term: "estar" }, " mit Partizip hat keinen Urheber mit ", { term: "por" }], it: [{ term: "estar" }, " con il participio non ha l'agente con ", { term: "por" }], pl: [{ term: "estar" }, " z imiesłowem nie ma wykonawcy z ", { term: "por" }], tr: [{ term: "estar" }, " ile participio, ", { term: "por" }, " ile bir yapıcı almaz"], id: [{ term: "estar" }, " dengan partisip tidak memakai pelaku dengan ", { term: "por" }], vi: [{ term: "estar" }, " với quá khứ phân từ không có tác nhân với ", { term: "por" }] }
          ex: ["La tienda ", { target: "estará cerrada" }, " el domingo."]
          tr: { en: "The shop will be closed on Sunday.", uk: "У неділю магазин буде зачинений.", pt: "A loja estará fechada no domingo.", fr: "Le magasin sera fermé dimanche.", de: "Das Geschäft ist am Sonntag geschlossen.", it: "Il negozio sarà chiuso domenica.", pl: "Sklep będzie zamknięty w niedzielę.", tr: "Mağaza pazar günü kapalı olacak.", id: "Toko itu akan tutup pada hari Minggu.", vi: "Cửa hàng sẽ đóng cửa vào Chủ nhật." }
        - level: C1
