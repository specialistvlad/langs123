            reported: { ex: ["Me dijo que ", { target: vivía }, " en Lima."], tr: { en: "He told me he lived in Lima.", uk: "Він сказав мені, що живе в Лімі.", pt: "Ele me disse que morava em Lima.", fr: "Il m’a dit qu’il habitait à Lima.", de: "Er hat mir gesagt, dass er in Lima wohnt.", it: "Mi ha detto che viveva a Lima.", pl: "Powiedział mi, że mieszka w Limie.", tr: "Bana Lima’da yaşadığını söyledi.", id: "Dia memberi tahu saya bahwa dia tinggal di Lima.", vi: "Anh ấy nói với tôi rằng anh ấy sống ở Lima." } }
          - level: B1
            said: { ex: { target: Siéntate. }, tr: { en: "Sit down.", uk: "Сідай.", pt: "Sente-se.", fr: "Assieds-toi.", de: "Setz dich.", it: "Siediti.", pl: "Usiądź.", tr: "Otur.", id: "Duduklah.", vi: "Ngồi xuống đi." } }
            reported: { ex: ["Dice que ", { target: te sientes }, "."], tr: { en: "She says you should sit down.", uk: "Вона каже, щоб ти сів.", pt: "Ela diz para você se sentar.", fr: "Elle te dit de t’asseoir.", de: "Sie sagt, du sollst dich setzen.", it: "Dice di sederti.", pl: "Mówi, żebyś usiadł.", tr: "Oturmanı söylüyor.", id: "Dia menyuruhmu duduk.", vi: "Cô ấy bảo bạn ngồi xuống." } }
          - level: B1
