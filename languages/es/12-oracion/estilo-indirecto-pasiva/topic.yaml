            text:
              en: ["After ", { term: dice que }, ", the tense stays; the person, the pronouns and the possessives change to fit the new speaker."]
              es: ["Detrás de ", { term: dice que }, ", el tiempo se mantiene; la persona, los pronombres y los posesivos cambian según el nuevo hablante."]
              uk: ["Після ", { term: "dice que" }, " час не змінюється; особа, займенники й присвійні займенники змінюються відповідно до нового мовця."]
              pt: ["Depois de ", { term: "dice que" }, " o tempo se mantém; a pessoa, os pronomes e os possessivos mudam conforme o novo falante."]
              fr: ["Après ", { term: "dice que" }, ", le temps reste le même ; la personne, les pronoms et les possessifs changent selon le nouveau locuteur."]
              de: ["Nach ", { term: "dice que" }, " bleibt die Zeitform; die Person, die Pronomen und die Possessivbegleiter ändern sich mit dem neuen Sprecher."]
              it: ["Dopo ", { term: "dice que" }, " il tempo resta uguale; la persona, i pronomi e i possessivi cambiano secondo il nuovo parlante."]
              pl: ["Po ", { term: "dice que" }, " czas się nie zmienia; osoba, zaimki i zaimki dzierżawcze zmieniają się zależnie od nowego mówiącego."]
              tr: [{ term: "dice que" }, " sonrasında zaman değişmez; kişi, zamirler ve iyelik sözcükleri yeni konuşana göre değişir."]
              id: ["Setelah ", { term: "dice que" }, ", tense tetap; orang, kata ganti, dan kata milik berubah sesuai pembicara yang baru."]
              vi: ["Sau ", { term: "dice que" }, " thì giữ nguyên; ngôi, đại từ và từ sở hữu thay đổi theo người nói mới."]
