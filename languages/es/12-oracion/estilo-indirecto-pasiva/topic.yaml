            text:
              en: "The verb agrees with the thing: singular for one, plural for several."
              es: "El verbo concuerda con la cosa: singular para una, plural para varias."
              uk: "Дієслово узгоджується з іменником: однина для одного, множина для кількох."
              pt: "O verbo concorda com a coisa: singular para uma, plural para várias."
              fr: "Le verbe s’accorde avec la chose : singulier pour une, pluriel pour plusieurs."
              de: "Das Verb richtet sich nach der Sache: Singular für eine, Plural für mehrere."
              it: "Il verbo concorda con la cosa: singolare per una, plurale per più di una."
              pl: "Czasownik zgadza się z rzeczą: liczba pojedyncza dla jednej, mnoga dla kilku."
              tr: "Fiil nesneyle uyum sağlar: biri için tekil, birkaçı için çoğul."
              id: "Kata kerja menyesuaikan dengan bendanya: tunggal untuk satu, jamak untuk beberapa."
              vi: "Động từ hòa hợp với danh từ chỉ vật: số ít cho một, số nhiều cho nhiều."
          - type: rule
            level: B1
            text:
              en: "With no thing named, the verb stays singular and speaks of people in general."
              es: "Sin una cosa nombrada, el verbo queda en singular y habla de la gente en general."
              uk: "Якщо іменника немає, дієслово лишається в однині й говорить про людей загалом."
              pt: "Sem uma coisa nomeada, o verbo fica no singular e fala das pessoas em geral."
              fr: "Sans chose nommée, le verbe reste au singulier et parle des gens en général."
              de: "Ist keine Sache genannt, bleibt das Verb im Singular und spricht von den Leuten im Allgemeinen."
              it: "Senza una cosa nominata, il verbo resta al singolare e parla della gente in generale."
              pl: "Gdy nie ma nazwanej rzeczy, czasownik zostaje w liczbie pojedynczej i mówi o ludziach w ogóle."
              tr: "Adı geçen bir nesne yoksa fiil tekil kalır ve genel olarak insanlardan söz eder."
              id: "Kalau tidak ada benda yang disebut, kata kerja tetap tunggal dan membicarakan orang pada umumnya."
              vi: "Khi không nêu danh từ chỉ vật, động từ ở số ít và nói về mọi người nói chung."
