          ex: ["Aquí ", { target: se hablan }, " tres idiomas."]
          tr: { en: "Three languages are spoken here.", uk: "Тут розмовляють трьома мовами.", pt: "Aqui se falam três idiomas.", fr: "Ici, on parle trois langues.", de: "Hier werden drei Sprachen gesprochen.", it: "Qui si parlano tre lingue.", pl: "Mówi się tu trzema językami.", tr: "Burada üç dil konuşulur.", id: "Di sini tiga bahasa digunakan.", vi: "Ở đây người ta nói ba thứ tiếng." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Reported speech passes on what someone said with a verb of saying and ", { term: que }, "."]
              es: ["El estilo indirecto transmite lo que alguien dijo con un verbo de lengua y ", { term: que }, "."]
              uk: ["Непряма мова передає сказане за допомогою дієслова мовлення і ", { term: "que" }, "."]
              pt: ["O discurso indireto transmite o que alguém disse com um verbo de dizer e ", { term: "que" }, "."]
              fr: ["Le discours indirect rapporte ce que quelqu’un a dit avec un verbe de parole et ", { term: "que" }, "."]
              de: ["Die indirekte Rede gibt wieder, was jemand gesagt hat, mit einem Verb des Sagens und ", { term: "que" }, "."]
              it: ["Il discorso indiretto riporta ciò che qualcuno ha detto con un verbo dichiarativo e ", { term: "que" }, "."]
              pl: ["Mowa zależna przekazuje to, co ktoś powiedział, za pomocą czasownika mówienia i ", { term: "que" }, "."]
              tr: ["Dolaylı anlatım, birinin söylediğini bir söyleme fiili ve ", { term: "que" }, " ile aktarır."]
              id: ["Kalimat tak langsung meneruskan apa yang dikatakan seseorang dengan kata kerja ujaran dan ", { term: "que" }, "."]
              vi: ["Câu gián tiếp thuật lại điều ai đó đã nói bằng một động từ nói năng và ", { term: "que" }, "."]
          - type: rule
            level: B1
            text:
              en: ["Passive ", { term: se }, " tells what is done without saying who does it."]
              es: ["La pasiva con ", { term: se }, " dice qué se hace sin decir quién lo hace."]
              uk: ["Пасив із ", { term: "se" }, " повідомляє, що робиться, не кажучи, хто це робить."]
              pt: ["A passiva com ", { term: "se" }, " diz o que se faz sem dizer quem o faz."]
              fr: ["Le passif avec ", { term: "se" }, " dit ce qui se fait sans dire qui le fait."]
              de: ["Das Passiv mit ", { term: "se" }, " sagt, was getan wird, ohne zu sagen, wer es tut."]
              it: ["Il passivo con ", { term: "se" }, " dice che cosa si fa senza dire chi lo fa."]
              pl: ["Strona bierna z ", { term: "se" }, " mówi, co się robi, bez wskazywania, kto to robi."]
              tr: [{ term: "se" }, " ile edilgen yapı, işi kimin yaptığını söylemeden ne yapıldığını anlatır."]
              id: ["Pasif dengan ", { term: "se" }, " menyebut apa yang dilakukan tanpa menyebut siapa yang melakukannya."]
              vi: ["Câu bị động với ", { term: "se" }, " nói điều gì được làm mà không nói ai làm."]

  - title: { en: "Form: reported speech", es: "Forma: estilo indirecto", uk: "Форма: непряма мова", pt: "Forma: discurso indireto", fr: "Forme : discours indirect", de: "Form: indirekte Rede", it: "Forma: discorso indiretto", pl: "Forma: mowa zależna", tr: "Biçim: dolaylı anlatım", id: "Bentuk: kalimat tak langsung", vi: "Dạng: câu gián tiếp" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: said, label: { en: Words said, es: Palabras dichas, uk: "Сказані слова", pt: "Palavras ditas", fr: "Paroles dites", de: "Gesagte Worte", it: "Parole dette", pl: "Słowa wypowiedziane", tr: "Söylenen sözler", id: "Kata-kata yang diucapkan", vi: "Lời nói gốc" } }
          - { key: reported, label: { en: Reported, es: Estilo indirecto, uk: "Непряма мова", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Câu gián tiếp" } }
        rows:
          - level: B1
            said: { ex: "Tengo hambre.", tr: { en: "I'm hungry.", uk: "Я голодна.", pt: "Estou com fome.", fr: "J’ai faim.", de: "Ich habe Hunger.", it: "Ho fame.", pl: "Jestem głodna.", tr: "Açım.", id: "Saya lapar.", vi: "Tôi đói." } }
            reported: { ex: ["Dice que ", { target: tiene }, " hambre."], tr: { en: "She says she's hungry.", uk: "Вона каже, що голодна.", pt: "Ela diz que está com fome.", fr: "Elle dit qu’elle a faim.", de: "Sie sagt, dass sie Hunger hat.", it: "Dice che ha fame.", pl: "Mówi, że jest głodna.", tr: "Aç olduğunu söylüyor.", id: "Dia bilang dia lapar.", vi: "Cô ấy nói rằng cô ấy đói." } }
          - level: B1
            said: { ex: "Vivo en Lima.", tr: { en: "I live in Lima.", uk: "Я живу в Лімі.", pt: "Moro em Lima.", fr: "J’habite à Lima.", de: "Ich wohne in Lima.", it: "Vivo a Lima.", pl: "Mieszkam w Limie.", tr: "Lima’da yaşıyorum.", id: "Saya tinggal di Lima.", vi: "Tôi sống ở Lima." } }
            reported: { ex: ["Me dijo que ", { target: vivía }, " en Lima."], tr: { en: "He told me he lived in Lima.", uk: "Він сказав мені, що живе в Лімі.", pt: "Ele me disse que morava em Lima.", fr: "Il m’a dit qu’il habitait à Lima.", de: "Er hat mir gesagt, dass er in Lima wohnt.", it: "Mi ha detto che viveva a Lima.", pl: "Powiedział mi, że mieszka w Limie.", tr: "Bana Lima’da yaşadığını söyledi.", id: "Dia memberi tahu saya bahwa dia tinggal di Lima.", vi: "Anh ấy nói với tôi rằng anh ấy sống ở Lima." } }
          - level: B1
            said: { ex: { target: Siéntate. }, tr: { en: "Sit down.", uk: "Сідай.", pt: "Sente-se.", fr: "Assieds-toi.", de: "Setz dich.", it: "Siediti.", pl: "Usiądź.", tr: "Otur.", id: "Duduklah.", vi: "Ngồi xuống đi." } }
            reported: { ex: ["Dice que ", { target: te sientes }, "."], tr: { en: "She says you should sit down.", uk: "Вона каже, щоб ти сів.", pt: "Ela diz para você se sentar.", fr: "Elle te dit de t’asseoir.", de: "Sie sagt, du sollst dich setzen.", it: "Dice di sederti.", pl: "Mówi, żebyś usiadł.", tr: "Oturmanı söylüyor.", id: "Dia menyuruhmu duduk.", vi: "Cô ấy bảo bạn ngồi xuống." } }
          - level: B1
            said: { ex: "¿Vienes?", tr: { en: "Are you coming?", uk: "Ти прийдеш?", pt: "Você vem?", fr: "Tu viens ?", de: "Kommst du?", it: "Vieni?", pl: "Przyjdziesz?", tr: "Geliyor musun?", id: "Kamu datang?", vi: "Bạn có đến không?" } }
            reported: { ex: ["Pregunta ", { target: si }, " vienes."], tr: { en: "She's asking if you're coming.", uk: "Вона питає, чи ти прийдеш.", pt: "Ela pergunta se você vem.", fr: "Elle demande si tu viens.", de: "Sie fragt, ob du kommst.", it: "Chiede se vieni.", pl: "Pyta, czy przyjdziesz.", tr: "Geleceğini soruyor.", id: "Dia bertanya apakah kamu datang.", vi: "Cô ấy hỏi bạn có đến không." } }
          - level: B1
            said: { ex: "¿Dónde vives?", tr: { en: "Where do you live?", uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove abiti?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Di mana kamu tinggal?", vi: "Bạn sống ở đâu?" } }
            reported: { ex: ["Me preguntó ", { target: dónde }, " vivía."], tr: { en: "He asked me where I lived.", uk: "Він запитав мене, де я живу.", pt: "Ele me perguntou onde eu morava.", fr: "Il m’a demandé où j’habitais.", de: "Er hat mich gefragt, wo ich wohne.", it: "Mi ha chiesto dove abitavo.", pl: "Zapytał mnie, gdzie mieszkam.", tr: "Nerede yaşadığımı sordu.", id: "Dia bertanya kepada saya di mana saya tinggal.", vi: "Anh ấy hỏi tôi sống ở đâu." } }
          - level: B2
            said: { ex: "Llegué tarde.", tr: { en: "I arrived late.", uk: "Я приїхав пізно.", pt: "Cheguei tarde.", fr: "Je suis arrivé en retard.", de: "Ich bin zu spät gekommen.", it: "Sono arrivato tardi.", pl: "Przyjechałem późno.", tr: "Geç geldim.", id: "Saya datang terlambat.", vi: "Tôi đến muộn." } }
            reported: { ex: ["Dijo que ", { target: "había llegado" }, " tarde."], tr: { en: "He said he had arrived late.", uk: "Він сказав, що приїхав пізно.", pt: "Ele disse que tinha chegado tarde.", fr: "Il a dit qu’il était arrivé en retard.", de: "Er sagte, dass er zu spät gekommen war.", it: "Ha detto che era arrivato tardi.", pl: "Powiedział, że przyjechał późno.", tr: "Geç geldiğini söyledi.", id: "Dia bilang dia sudah datang terlambat.", vi: "Anh ấy nói rằng anh ấy đã đến muộn." } }
          - level: B2
