title: { en: Reported Speech and Passive se, es: Estilo indirecto y pasiva con se, uk: "Непряма мова і пасив із se", pt: "Discurso indireto e passiva com se", fr: "Le discours indirect et le passif avec se", de: "Indirekte Rede und Passiv mit se", it: "Discorso indiretto e passivo con se", pl: "Mowa zależna i strona bierna z se", tr: "Dolaylı anlatım ve se ile edilgen yapı", id: "Kalimat tak langsung dan pasif dengan se", vi: "Câu gián tiếp và câu bị động với se" }
summary:
  lead:
    en: ["Reported speech passes on words with ", { term: decir que }, " and ", { term: preguntar si }, "; passive ", { term: se }, " leaves out who acts: ", { term: se venden casas }, "."]
    es: ["El estilo indirecto transmite palabras con ", { term: decir que }, " y ", { term: preguntar si }, "; la pasiva con ", { term: se }, " omite quién actúa: ", { term: se venden casas }, "."]
    uk: ["Непряма мова передає чужі слова за допомогою ", { term: "decir que" }, " і ", { term: "preguntar si" }, "; пасив із ", { term: "se" }, " не вказує, хто виконує дію: ", { term: "se venden casas" }, "."]
    pt: ["O discurso indireto transmite palavras com ", { term: "decir que" }, " e ", { term: "preguntar si" }, "; a passiva com ", { term: "se" }, " omite quem age: ", { term: "se venden casas" }, "."]
    fr: ["Le discours indirect rapporte des paroles avec ", { term: "decir que" }, " et ", { term: "preguntar si" }, " ; le passif avec ", { term: "se" }, " omet qui agit : ", { term: "se venden casas" }, "."]
    de: ["Die indirekte Rede gibt Worte mit ", { term: "decir que" }, " und ", { term: "preguntar si" }, " wieder; das Passiv mit ", { term: "se" }, " lässt offen, wer handelt: ", { term: "se venden casas" }, "."]
    it: ["Il discorso indiretto riporta le parole con ", { term: "decir que" }, " e ", { term: "preguntar si" }, "; il passivo con ", { term: "se" }, " omette chi agisce: ", { term: "se venden casas" }, "."]
    pl: ["Mowa zależna przekazuje słowa za pomocą ", { term: "decir que" }, " i ", { term: "preguntar si" }, "; strona bierna z ", { term: "se" }, " pomija wykonawcę: ", { term: "se venden casas" }, "."]
    tr: ["Dolaylı anlatım sözleri ", { term: "decir que" }, " ve ", { term: "preguntar si" }, " ile aktarır; ", { term: "se" }, " ile edilgen yapı işi kimin yaptığını söylemez: ", { term: "se venden casas" }, "."]
    id: ["Kalimat tak langsung meneruskan ucapan dengan ", { term: "decir que" }, " dan ", { term: "preguntar si" }, "; pasif dengan ", { term: "se" }, " tidak menyebut pelakunya: ", { term: "se venden casas" }, "."]
    vi: ["Câu gián tiếp thuật lại lời nói bằng ", { term: "decir que" }, " và ", { term: "preguntar si" }, "; câu bị động với ", { term: "se" }, " không nêu ai làm: ", { term: "se venden casas" }, "."]
  rule:
    en: ["After ", { term: dice que }, " the tense stays; after ", { term: dijo que }, ", a present becomes the imperfect:"]
    es: ["Detrás de ", { term: dice que }, " el tiempo se mantiene; detrás de ", { term: dijo que }, ", el presente pasa a imperfecto:"]
    uk: ["Після ", { term: "dice que" }, " час не змінюється; після ", { term: "dijo que" }, " теперішній час стає імперфектом:"]
    pt: ["Depois de ", { term: "dice que" }, " o tempo se mantém; depois de ", { term: "dijo que" }, ", o presente passa ao pretérito imperfeito:"]
    fr: ["Après ", { term: "dice que" }, " le temps reste le même ; après ", { term: "dijo que" }, ", le présent passe à l’imparfait :"]
    de: ["Nach ", { term: "dice que" }, " bleibt die Zeitform gleich; nach ", { term: "dijo que" }, " wird das Präsens zum Imperfecto:"]
    it: ["Dopo ", { term: "dice que" }, " il tempo resta uguale; dopo ", { term: "dijo que" }, " il presente passa all'imperfetto:"]
    pl: ["Po ", { term: "dice que" }, " czas się nie zmienia; po ", { term: "dijo que" }, " czas teraźniejszy zmienia się w imperfecto:"]
    tr: ["Zaman, ", { term: "dice que" }, " sonrasında değişmez; ", { term: "dijo que" }, " sonrasında şimdiki zaman imperfecto olur:"]
    id: ["Setelah ", { term: "dice que" }, " tense tetap sama; setelah ", { term: "dijo que" }, ", present berubah menjadi imperfecto:"]
    vi: ["Sau ", { term: "dice que" }, " thì giữ nguyên; sau ", { term: "dijo que" }, " thì hiện tại chuyển thành imperfecto:"]
  ex: { examples: [["Dice que ", { target: tiene }, " sueño."], ["Dijo que ", { target: tenía }, " sueño."]] }

