# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.oracion.estilo-indirecto-pasiva
lang: es
kind: grammar
tags: [reported-speech, passive, se, sentence]
concepts: [reported-speech, passive]
related: [es.pasados.preterito-imperfecto, es.subjuntivo.subjuntivo-formas, es.oracion.preguntas-negacion, es.presente.verbos-reflexivos]
status: { en: draft, es: draft, uk: draft }
translated: { en: "5f5f80 2f7e4c 8dd29a 9275a7 1a8f2a f60811 3f410d", uk: "5f5f80 2f7e4c 8dd29a 9275a7 1a8f2a f60811 3f410d" }

title: { en: Reported Speech and Passive se, es: Estilo indirecto y pasiva con se, uk: "Непряма мова і пасив із se" }
summary:
  lead:
    en: ["Reported speech passes on words with ", { term: decir que }, " and ", { term: preguntar si }, "; passive ", { term: se }, " leaves out who acts: ", { term: se venden casas }, "."]
    es: ["El estilo indirecto transmite palabras con ", { term: decir que }, " y ", { term: preguntar si }, "; la pasiva con ", { term: se }, " omite quién actúa: ", { term: se venden casas }, "."]
    uk: ["Непряма мова передає чужі слова за допомогою ", { term: "decir que" }, " і ", { term: "preguntar si" }, "; пасив із ", { term: "se" }, " не називає, хто виконує дію: ", { term: "se venden casas" }, "."]
  rule:
    en: ["After ", { term: dice que }, " the tense stays; after ", { term: dijo que }, ", a present becomes the imperfect:"]
    es: ["Detrás de ", { term: dice que }, " el tiempo se mantiene; detrás de ", { term: dijo que }, ", el presente pasa a imperfecto:"]
    uk: ["Після ", { term: "dice que" }, " час не змінюється; після ", { term: "dijo que" }, " теперішній час стає імперфектом:"]
  ex: { examples: [["Dice que ", { target: tiene }, " sueño."], ["Dijo que ", { target: tenía }, " sueño."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: B1
          point: { en: Reporting now, es: Transmitir ahora, uk: "Передавання зараз" }
          rule:
            en: [{ term: dice que }, ": the same tense, the person changes"]
            es: [{ term: dice que }, ": el mismo tiempo, cambia la persona"]
            uk: [{ term: "dice que" }, ": той самий час, змінюється особа"]
          ex: ["Dice que ", { target: tiene }, " hambre."]
          tr: { en: "She says she's hungry.", uk: "Вона каже, що голодна." }
        - level: B1
          point: { en: Reporting the past, es: Transmitir en pasado, uk: "Передавання в минулому" }
          rule:
            en: [{ term: dijo que }, ": a present becomes the imperfect"]
            es: [{ term: dijo que }, ": el presente pasa a imperfecto"]
            uk: [{ term: "dijo que" }, ": теперішній час стає імперфектом"]
          ex: ["Dijo que ", { target: tenía }, " sueño."]
          tr: { en: "He said he was sleepy.", uk: "Він сказав, що хоче спати." }
        - level: B1
          point: { en: Orders, es: Órdenes, uk: "Накази" }
          rule:
            en: [{ term: dice que }, " with the present subjunctive"]
            es: [{ term: dice que }, " con presente de subjuntivo"]
            uk: [{ term: "dice que" }, " з теперішнім часом суб’юнктива"]
          ex: ["Dice que ", { target: te sientes }, "."]
          tr: { en: "She says you should sit down.", uk: "Вона каже, щоб ти сів." }
        - level: B1
          point: { en: Questions, es: Preguntas, uk: "Питання" }
          rule:
            en: [{ term: si }, " for yes-no questions; question words stay, with their accent"]
            es: [{ term: si }, " para preguntas de sí o no; los interrogativos se mantienen, con tilde"]
            uk: [{ term: "si" }, " для запитань «так чи ні»; питальні слова лишаються зі знаком наголосу"]
          ex: { examples: [["Pregunta ", { target: si }, " vienes."], ["Me preguntó ", { target: dónde }, " vivía."]] }
          tr: { en: { examples: ["She's asking if you're coming.", "He asked me where I lived."] }, uk: { examples: ["Вона питає, чи ти прийдеш.", "Він запитав мене, де я живу."] } }
        - level: B1
          point: { en: Passive se, es: Pasiva con se, uk: "Пасив із se" }
          rule:
            en: [{ term: se }, " with the verb agreeing with the thing"]
            es: [{ term: se }, " con el verbo en concordancia con la cosa"]
            uk: [{ term: "se" }, " з дієсловом, що узгоджується з предметом"]
          ex: { examples: [{ target: Se vende casa. }, { target: Se venden casas. }] }
          tr: { en: { examples: ["House for sale.", "Houses for sale."] }, uk: { examples: ["Продається будинок.", "Продаються будинки."] } }
        - level: B1
          point: { en: Impersonal se, es: Se impersonal, uk: "Безособове se" }
          rule:
            en: [{ term: se }, " with a singular verb: people in general"]
            es: [{ term: se }, " con el verbo en singular: la gente en general"]
            uk: [{ term: "se" }, " з дієсловом в однині: люди загалом"]
          ex: ["En este restaurante ", { target: se come }, " muy bien."]
          tr: { en: "You eat very well in this restaurant.", uk: "У цьому ресторані дуже смачно годують." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "pronouns and possessives change with the speaker"
            es: "los pronombres y los posesivos cambian con el hablante"
            uk: "займенники й присвійні слова змінюються разом із мовцем"
          ex: { mapping: ["Mi casa es pequeña.", ["Dice que ", { target: su }, " casa es pequeña."]] }
          tr: { en: { mapping: ["My house is small.", "She says her house is small."] }, uk: { mapping: ["Мій будинок маленький.", "Вона каже, що її будинок маленький."] } }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["a plural thing takes a plural verb: ", { term: se venden }]
            es: ["una cosa en plural lleva el verbo en plural: ", { term: se venden }]
            uk: ["предмет у множині — дієслово в множині: ", { term: "se venden" }]
          ex: ["Aquí ", { target: se hablan }, " tres idiomas."]
          tr: { en: "Three languages are spoken here.", uk: "Тут розмовляють трьома мовами." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Reported speech passes on what someone said with a verb of saying and ", { term: que }, "."]
              es: ["El estilo indirecto transmite lo que alguien dijo con un verbo de lengua y ", { term: que }, "."]
              uk: ["Непряма мова передає сказане за допомогою дієслова мовлення і ", { term: "que" }, "."]
          - type: rule
            level: B1
            text:
              en: ["Passive ", { term: se }, " tells what is done without saying who does it."]
              es: ["La pasiva con ", { term: se }, " dice qué se hace sin decir quién lo hace."]
              uk: ["Пасив із ", { term: "se" }, " повідомляє, що робиться, не кажучи, хто це робить."]

  - title: { en: "Form: reported speech", es: "Forma: estilo indirecto", uk: "Форма: непряма мова" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: said, label: { en: Words said, es: Palabras dichas, uk: "Сказані слова" } }
          - { key: reported, label: { en: Reported, es: Estilo indirecto, uk: "Непряма мова" } }
        rows:
          - level: B1
            said: { ex: "Tengo hambre.", tr: { en: "I'm hungry.", uk: "Я голодна." } }
            reported: { ex: ["Dice que ", { target: tiene }, " hambre."], tr: { en: "She says she's hungry.", uk: "Вона каже, що голодна." } }
          - level: B1
            said: { ex: "Vivo en Lima.", tr: { en: "I live in Lima.", uk: "Я живу в Лімі." } }
            reported: { ex: ["Me dijo que ", { target: vivía }, " en Lima."], tr: { en: "He told me he lived in Lima.", uk: "Він сказав мені, що живе в Лімі." } }
          - level: B1
            said: { ex: { target: Siéntate. }, tr: { en: "Sit down.", uk: "Сідай." } }
            reported: { ex: ["Dice que ", { target: te sientes }, "."], tr: { en: "She says you should sit down.", uk: "Вона каже, щоб ти сів." } }
          - level: B1
            said: { ex: "¿Vienes?", tr: { en: "Are you coming?", uk: "Ти прийдеш?" } }
            reported: { ex: ["Pregunta ", { target: si }, " vienes."], tr: { en: "She's asking if you're coming.", uk: "Вона питає, чи ти прийдеш." } }
          - level: B1
            said: { ex: "¿Dónde vives?", tr: { en: "Where do you live?", uk: "Де ти живеш?" } }
            reported: { ex: ["Me preguntó ", { target: dónde }, " vivía."], tr: { en: "He asked me where I lived.", uk: "Він запитав мене, де я живу." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["After ", { term: dice que }, ", the tense stays; the person, the pronouns and the possessives change to fit the new speaker."]
              es: ["Detrás de ", { term: dice que }, ", el tiempo se mantiene; la persona, los pronombres y los posesivos cambian según el nuevo hablante."]
              uk: ["Після ", { term: "dice que" }, " час не змінюється; особа, займенники й присвійні слова змінюються відповідно до нового мовця."]
          - type: rule
            level: B1
            text:
              en: ["After ", { term: dijo que }, ", a present becomes the imperfect:"]
              es: ["Detrás de ", { term: dijo que }, ", el presente pasa a imperfecto:"]
              uk: ["Після ", { term: "dijo que" }, " теперішній час стає імперфектом:"]
            ex: { mapping: ["Estoy cansada.", ["Dijo que ", { target: estaba }, " cansada."]] }
            tr: { en: { mapping: ["I'm tired.", "She said she was tired."] }, uk: { mapping: ["Я втомлена.", "Вона сказала, що втомлена."] } }
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українська не змінює час у непрямій мові: ", { l1: "сказала, що втомлена" }, ". Іспанська після ", { term: "dijo que" }, " переводить теперішній час в імперфект: ", { term: "dijo que estaba cansada" }, "."]
          - type: rule
            level: B1
            text:
              en: ["An order becomes ", { term: que }, " with the present subjunctive:"]
              es: ["Una orden pasa a ", { term: que }, " con presente de subjuntivo:"]
              uk: ["Наказ стає реченням з ", { term: "que" }, " і теперішнім часом суб’юнктива:"]
            ex: { mapping: [{ target: Ven. }, ["Dice que ", { target: vengas }, "."]] }
            tr: { en: { mapping: ["Come.", "She says you should come."] }, uk: { mapping: ["Приходь.", "Вона каже, щоб ти прийшов."] } }
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українською наказ передаємо через ", { l1: "щоб" }, ": ", { l1: "каже, щоб ти прийшов" }, "; іспанською — ", { term: "que" }, " із суб’юнктивом: ", { term: "dice que vengas" }, "."]
          - type: rule
            level: B1
            text:
              en: ["A yes-no question takes ", { term: si }, "; a question word stays, with its accent."]
              es: ["Una pregunta de sí o no lleva ", { term: si }, "; el interrogativo se mantiene, con su tilde."]
              uk: ["Запитання «так чи ні» вводить ", { term: "si" }, "; питальне слово лишається зі знаком наголосу."]
          - type: note
            level: B1
            text:
              en: ["The forms of the subjunctive: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas del subjuntivo: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми суб’юнктива: ", { link: "Теперішній час суб’юнктива: форми", to: "es.subjuntivo.subjuntivo-formas" }, "."]

  - title: { en: "Form: passive and impersonal se", es: "Forma: pasiva e impersonal con se", uk: "Форма: пасивне й безособове se" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: B1, pattern: { pattern: [se, { slot: { en: singular verb, es: verbo en singular, uk: "дієслово в однині" } }, { slot: singular noun }] }, ex: { target: Se vende casa. }, tr: { en: "House for sale.", uk: "Продається будинок." } }
          - level: B1
            pattern: { pattern: [se, { slot: { en: plural verb, es: verbo en plural, uk: "дієслово в множині" } }, { slot: plural noun }] }
            ex: { examples: [{ target: Se venden casas. }, { target: Se alquilan bicicletas. }] }
            tr: { en: { examples: ["Houses for sale.", "Bikes for hire."] }, uk: { examples: ["Продаються будинки.", "Прокат велосипедів."] } }
          - level: B1
            pattern: { pattern: [se, { slot: { en: singular verb, es: verbo en singular, uk: "дієслово в однині" } }] }
            ex: { examples: [["En este restaurante ", { target: se come }, " muy bien."], ["¿Cómo ", { target: se dice }, " esto en español?"]] }
            tr: { en: { examples: ["You eat very well in this restaurant.", "How do you say this in Spanish?"] }, uk: { examples: ["У цьому ресторані дуже смачно годують.", "Як це сказати іспанською?"] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The verb agrees with the thing: singular for one, plural for several."
              es: "El verbo concuerda con la cosa: singular para una, plural para varias."
              uk: "Дієслово узгоджується з предметом: однина для одного, множина для кількох."
          - type: rule
            level: B1
            text:
              en: "With no thing named, the verb stays singular and speaks of people in general."
              es: "Sin una cosa nombrada, el verbo queda en singular y habla de la gente en general."
              uk: "Якщо предмет не названо, дієслово лишається в однині й говорить про людей загалом."
          - type: note
            level: B1
            text:
              en: ["Signs and adverts use it: ", { alternatives: [{ term: Se vende }, { term: Se alquila }, { term: Se busca }] }, "."]
              es: ["Los carteles y los anuncios lo usan: ", { alternatives: [{ term: Se vende }, { term: Se alquila }, { term: Se busca }] }, "."]
              uk: ["Так пишуть на вивісках і в оголошеннях: ", { alternatives: [{ term: "Se vende" }, { term: "Se alquila" }, { term: "Se busca" }] }, "."]

  - title: { en: "Compare: dice que with indicative and subjunctive", es: "Comparación: dice que con indicativo y subjuntivo", uk: "Порівняння: dice que з дійсним способом і суб’юнктивом" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: info, label: { en: Information, es: Información, uk: "Інформація" } }
          - { key: order, label: { en: Order, es: Orden, uk: "Наказ" } }
        rows:
          - { level: B1, info: { en: the indicative passes on a fact, es: el indicativo transmite un hecho, uk: "дійсний спосіб передає факт" }, order: { en: the subjunctive passes on an order, es: el subjuntivo transmite una orden, uk: "суб’юнктив передає наказ" } }
          - level: B1
            info: { ex: ["Dice que ", { target: viene }, "."], tr: { en: "She says she's coming.", uk: "Вона каже, що прийде." } }
            order: { ex: ["Dice que ", { target: vengas }, "."], tr: { en: "She says you should come.", uk: "Вона каже, щоб ти прийшов." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Dice tiene hambre.", right: ["Dice ", { target: que }, " tiene hambre."], rule: { en: [{ term: que }, " never drops after ", { term: decir }], es: [{ term: que }, " nunca se omite detrás de ", { term: decir }], uk: [{ term: "que" }, " ніколи не пропускається після ", { term: "decir" }] } }
          - { level: B1, speakers: [en], wrong: "Dijo a mí que vivía en Lima.", right: [{ target: Me dijo }, " que vivía en Lima."], rule: { en: ["the person told is a pronoun before the verb: ", { term: me dijo }] } }
          - { level: B1, wrong: "Mi madre dice que vienes a casa ya.", right: ["Mi madre dice que ", { target: vengas }, " a casa ya."], rule: { en: ["to pass on the order ", { term: ¡Ven a casa ya! }, ": the subjunctive"], es: ["para transmitir la orden ", { term: ¡Ven a casa ya! }, ": subjuntivo"], uk: ["щоб передати наказ ", { term: "¡Ven a casa ya!" }, ", потрібен суб’юнктив"] } }
          - { level: B1, wrong: "Me preguntó donde vivía.", right: ["Me preguntó ", { target: dónde }, " vivía."], rule: { en: "a reported question word keeps its accent", es: "el interrogativo transmitido mantiene la tilde", uk: "питальне слово в непрямому питанні зберігає знак наголосу" } }
          - { level: B1, wrong: "Se vende casas.", right: [{ target: Se venden }, " casas."], rule: { en: "the verb agrees with the thing", es: "el verbo concuerda con la cosa", uk: "дієслово узгоджується з предметом" } }
