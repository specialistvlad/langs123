              pl: ["Formy trybu łączącego: ", { link: "Czas teraźniejszy trybu łączącego: formy", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              tr: ["Dilek kipinin biçimleri: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              id: ["Bentuk subjungtif: ", { link: "Presente subjungtif: bentuk", to: "es.subjuntivo.subjuntivo-formas" }, "."]
              vi: ["Các dạng của thức giả định: ", { link: "Thì hiện tại thức giả định: các dạng", to: "es.subjuntivo.subjuntivo-formas" }, "."]
          - type: rule
            level: B2
            text:
              es: "Tras un verbo de lengua en pasado, el tiempo original retrocede: perfecto e indefinido a pluscuamperfecto, futuro a condicional."
              en: "After a past verb of saying, the tense moves back: perfect and preterite to past perfect, future to conditional."
              uk: "Після дієслова мовлення в минулому час зсувається назад: перфект і претерит — у плюсквамперфект, майбутній — в умовний спосіб."
              pt: "Depois de um verbo de dizer no passado, o tempo recua: os perfeitos passam ao mais-que-perfeito, o futuro ao condicional."
              fr: "Après un verbe de parole au passé, le temps recule : passé composé et prétérit deviennent plus-que-parfait, le futur conditionnel."
              de: "Nach einem Verb des Sagens in der Vergangenheit rückt die Zeitform zurück: Perfecto und Indefinido zum Plusquamperfekt, Futur zum Konditional."
              it: "Dopo un verbo dichiarativo al passato, il tempo retrocede: perfecto e indefinido passano al trapassato, il futuro al condizionale."
              pl: "Po czasowniku mówienia w czasie przeszłym czas cofa się: perfecto i indefinido zmieniają się w czas zaprzeszły, przyszły w warunkowy."
              tr: "Geçmişteki bir söyleme fiilinden sonra zaman geriye kayar: perfecto ve indefinido pluscuamperfecto olur, gelecek zaman koşul kipine dönüşür."
              id: "Setelah kata kerja ujaran di masa lalu, tense bergeser ke belakang: perfecto dan indefinido menjadi pluscuamperfecto, future menjadi kondisional."
              vi: "Sau động từ nói năng ở quá khứ, thì lùi về trước: perfecto và indefinido thành quá khứ hoàn thành, tương lai thành thức điều kiện."
          - type: rule
            level: B2
            text:
              es: "Tras un verbo de lengua en pasado, la orden y el presente de subjuntivo pasan a imperfecto de subjuntivo."
              en: "After a past verb of saying, the order and the present subjunctive become the imperfect subjunctive."
              uk: "Після дієслова мовлення в минулому наказ і теперішній час суб’юнктива переходять в імперфект суб’юнктива."
              pt: "Depois de um verbo de dizer no passado, a ordem e o presente do subjuntivo passam ao imperfeito do subjuntivo."
              fr: "Après un verbe de parole au passé, l’ordre et le présent du subjonctif passent à l’imparfait du subjonctif."
              de: "Nach einem Verb des Sagens in der Vergangenheit werden die Aufforderung und der Konjunktiv Präsens zum Konjunktiv Imperfecto."
              it: "Dopo un verbo dichiarativo al passato, l'ordine e il presente del congiuntivo passano all'imperfetto del congiuntivo."
              pl: "Po czasowniku mówienia w czasie przeszłym polecenie i czas teraźniejszy trybu łączącego zmieniają się w imperfecto trybu łączącego."
              tr: "Geçmişteki bir söyleme fiilinden sonra emir ve dilek kipinin şimdiki zamanı, dilek kipinin imperfecto biçimine dönüşür."
              id: "Setelah kata kerja ujaran di masa lalu, perintah dan presente subjungtif berubah menjadi imperfecto subjungtif."
              vi: "Sau động từ nói năng ở quá khứ, mệnh lệnh và thì hiện tại thức giả định chuyển thành imperfecto của thức giả định."
          - type: note
            level: B2
            text:
              es: ["Las formas: ", { link: El condicional compuesto, to: es.futuro-condicional.condicional-compuesto }, " y ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, "."]
              en: ["The forms: ", { link: "Conditional Perfect", to: "es.futuro-condicional.condicional-compuesto" }, " and ", { link: "Imperfect Subjunctive", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              uk: ["Форми: ", { link: "Умовний перфект", to: "es.futuro-condicional.condicional-compuesto" }, " і ", { link: "Імперфект суб’юнктива", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pt: ["As formas: ", { link: "O condicional composto", to: "es.futuro-condicional.condicional-compuesto" }, " e ", { link: "O imperfeito do subjuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              fr: ["Les formes : ", { link: "Le conditionnel passé", to: "es.futuro-condicional.condicional-compuesto" }, " et ", { link: "L’imparfait du subjonctif", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              de: ["Die Formen: ", { link: "Der Konditional II", to: "es.futuro-condicional.condicional-compuesto" }, " und ", { link: "Der Konjunktiv Imperfecto", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              it: ["Le forme: ", { link: "Il condizionale composto", to: "es.futuro-condicional.condicional-compuesto" }, " e ", { link: "L'imperfetto del congiuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pl: ["Formy: ", { link: "Tryb warunkowy przeszły", to: "es.futuro-condicional.condicional-compuesto" }, " i ", { link: "Imperfecto trybu łączącego", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              tr: ["Biçimler: ", { link: "Tamamlanmış koşul kipi", to: "es.futuro-condicional.condicional-compuesto" }, " ve ", { link: "Dilek kipinin imperfecto biçimi", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
