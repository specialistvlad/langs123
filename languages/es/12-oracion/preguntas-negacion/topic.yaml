              it: ["Un'esclamazione si apre con ", { letter: ¡ }, " e si chiude con ", { letter: "!" }, ", e ", { term: qué }, " porta l'accento scritto, come in una domanda:"]
              pl: ["Wykrzyknienie zaczyna się od ", { letter: ¡ }, " i kończy na ", { letter: "!" }, ", a ", { term: qué }, " ma akcent pisany, tak jak w pytaniu:"]
