          rule: { es: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repite lo que dijo el otro"], en: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repeats what the other person said"], uk: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " повторює те, що сказав співрозмовник"], pt: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repete o que o outro disse"], fr: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " reprend ce que l’autre a dit"], de: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " wiederholt, was der andere gesagt hat"], it: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " ripete ciò che ha detto l'altro"], pl: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " powtarza to, co powiedział rozmówca"], tr: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " karşıdakinin söylediğini yineler"], id: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " mengulang apa yang dikatakan orang lain"], vi: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " lặp lại điều người kia vừa nói"] }
          ex: ["¿", { target: Cómo que }, " no tienes tiempo?"]
