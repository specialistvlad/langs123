          rule: { es: "de función distinta, el segundo va al final", en: "with different functions, the second goes last", uk: "із різною функцією — друге стоїть у кінці", pt: "de função diferente, o segundo vai no fim", fr: "de fonction différente, le second se place à la fin", de: "mit verschiedener Funktion steht das zweite am Ende", it: "di funzione diversa, il secondo va in fondo", pl: "o różnych funkcjach drugi stoi na końcu", tr: "işlevleri farklıysa ikincisi sona gelir", id: "dengan fungsi berbeda, yang kedua berada di akhir", vi: "khác chức năng thì từ thứ hai đứng cuối" }
          ex: ["¿Quién te regaló eso ", { target: y por qué }, "?"]
          tr: { en: "Who gave you that, and why?", uk: "Хто тобі це подарував і чому?", pt: "Quem te deu isso e por quê?", fr: "Qui t’a offert ça, et pourquoi ?", de: "Wer hat dir das geschenkt, und warum?", it: "Chi te l'ha regalato e perché?", pl: "Kto ci to podarował i dlaczego?", tr: "Bunu sana kim hediye etti, neden?", id: "Siapa yang memberimu itu, dan mengapa?", vi: "Ai tặng bạn cái đó, và vì sao?" }
        - level: C2
