        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A2
            pattern: { pattern: [{ term: qué }, { slot: { en: adjective, es: adjetivo, uk: "прикметник", pt: "adjetivo", fr: "adjectif", de: "Adjektiv", it: "aggettivo", pl: "przymiotnik", tr: "sıfat", id: "kata sifat", vi: "tính từ" } }] }
            ex: { examples: [["¡", { target: Qué bonito }, "!"], ["¡", { target: Qué caro }, "!"]] }
            tr: { en: { examples: ["How beautiful!", "How expensive!"] }, uk: { examples: ["Як гарно!", "Як дорого!"] }, pt: { examples: ["Que bonito!", "Que caro!"] }, fr: { examples: ["Comme c’est beau !", "Comme c’est cher !"] }, de: { examples: ["Wie schön!", "Wie teuer!"] }, it: { examples: ["Che bello!", "Che caro!"] }, pl: { examples: ["Jak pięknie!", "Jak drogo!"] }, tr: { examples: ["Ne güzel!", "Ne pahalı!"] }, id: { examples: ["Indah sekali!", "Mahal sekali!"] }, vi: { examples: ["Đẹp quá!", "Đắt quá!"] } }
          - level: A2
            pattern: { pattern: [{ term: qué }, { slot: { en: adverb, es: adverbio, uk: "прислівник", pt: "advérbio", fr: "adverbe", de: "Adverb", it: "avverbio", pl: "przysłówek", tr: "zarf", id: "kata keterangan", vi: "trạng từ" } }] }
            ex: { examples: [["¡", { target: Qué bien }, "!"], ["¡", { target: Qué tarde }, "!"]] }
            tr: { en: { examples: ["Great!", "How late!"] }, uk: { examples: ["Чудово!", "Як пізно!"] }, pt: { examples: ["Que bom!", "Que tarde!"] }, fr: { examples: ["Super !", "Comme il est tard !"] }, de: { examples: ["Super!", "Wie spät!"] }, it: { examples: ["Che bello!", "Com'è tardi!"] }, pl: { examples: ["Świetnie!", "Jak późno!"] }, tr: { examples: ["Harika!", "Ne kadar geç!"] }, id: { examples: ["Bagus sekali!", "Sudah larut sekali!"] }, vi: { examples: ["Tuyệt quá!", "Muộn quá!"] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["An exclamation opens with ", { letter: ¡ }, " and closes with ", { letter: "!" }, ", and ", { term: qué }, " carries a written accent, as in a question:"]
              es: ["Una exclamación se abre con ", { letter: ¡ }, " y se cierra con ", { letter: "!" }, ", y ", { term: qué }, " lleva tilde, como en una pregunta:"]
              uk: ["Окличне речення починається знаком ", { letter: "¡" }, " і закінчується знаком ", { letter: "!" }, ", а ", { term: "qué" }, " пишеться зі знаком наголосу, як у питанні:"]
              pt: ["Uma exclamação se abre com ", { letter: ¡ }, " e se fecha com ", { letter: "!" }, ", e ", { term: qué }, " leva acento gráfico, como em uma pergunta:"]
              fr: ["Une exclamation s’ouvre avec ", { letter: ¡ }, " et se ferme avec ", { letter: "!" }, ", et ", { term: qué }, " porte un accent écrit, comme dans une question :"]
              de: ["Ein Ausruf beginnt mit ", { letter: ¡ }, " und endet mit ", { letter: "!" }, ", und ", { term: qué }, " trägt einen Akzent, wie in einer Frage:"]
              it: ["Un'esclamazione si apre con ", { letter: ¡ }, " e si chiude con ", { letter: "!" }, ", e ", { term: qué }, " porta l'accento scritto, come in una domanda:"]
              pl: ["Wykrzyknienie zaczyna się od ", { letter: ¡ }, " i kończy na ", { letter: "!" }, ", a ", { term: qué }, " ma akcent pisany, tak jak w pytaniu:"]
              tr: ["Ünlem ", { letter: ¡ }, " ile açılır, ", { letter: "!" }, " ile kapanır; ", { term: qué }, " de soruda olduğu gibi yazıda vurgu işareti taşır:"]
              id: ["Seruan dibuka dengan ", { letter: ¡ }, " dan ditutup dengan ", { letter: "!" }, ", dan ", { term: qué }, " memakai tanda aksen, seperti dalam pertanyaan:"]
              vi: ["Câu cảm thán mở đầu bằng ", { letter: ¡ }, " và kết thúc bằng ", { letter: "!" }, ", còn ", { term: qué }, " có dấu sắc, giống như trong câu hỏi:"]
            ex: { exchange: ["Mañana no trabajo.", ["¡", { target: Qué bien }, "!"]] }
            tr: { en: { exchange: ["I'm not working tomorrow.", "Great!"] }, uk: { exchange: ["Завтра я не працюю.", "Чудово!"] }, pt: { exchange: ["Amanhã não trabalho.", "Que bom!"] }, fr: { exchange: ["Demain, je ne travaille pas.", "Super !"] }, de: { exchange: ["Morgen arbeite ich nicht.", "Super!"] }, it: { exchange: ["Domani non lavoro.", "Che bello!"] }, pl: { exchange: ["Jutro nie pracuję.", "Świetnie!"] }, tr: { exchange: ["Yarın çalışmıyorum.", "Harika!"] }, id: { exchange: ["Besok saya tidak bekerja.", "Bagus sekali!"] }, vi: { exchange: ["Ngày mai tôi không làm việc.", "Tuyệt quá!"] } }

