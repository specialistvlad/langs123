            tr: [{ term: no }, " fiilden önce, ", { alternatives: [{ term: nunca }, { term: nada }, { term: nadie }] }, " fiilden sonra"]
            id: [{ term: no }, " di depan kata kerja, ", { alternatives: [{ term: nunca }, { term: nada }, { term: nadie }] }, " di belakangnya"]
            vi: [{ term: no }, " trước động từ, ", { alternatives: [{ term: nunca }, { term: nada }, { term: nadie }] }, " sau động từ"]
          ex: [{ target: No }, " he estado ", { target: nunca }, " en México."]
          tr: { en: "I've never been to Mexico.", uk: "Я ніколи не був у Мексиці.", pt: "Nunca estive no México.", fr: "Je n’ai jamais été au Mexique.", de: "Ich war noch nie in Mexiko.", it: "Non sono mai stato in Messico.", pl: "Nigdy nie byłem w Meksyku.", tr: "Meksika’ya hiç gitmedim.", id: "Saya belum pernah ke Meksiko.", vi: "Tôi chưa bao giờ đến Mexico." }
        - level: A2
          point: { en: Exclamations, es: Exclamaciones, uk: "Окличні речення", pt: "Exclamações", fr: "Exclamations", de: "Ausrufe", it: "Esclamazioni", pl: "Wykrzyknienia", tr: "Ünlemler", id: "Seruan", vi: "Câu cảm thán" }
          rule:
            en: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio } }] }, ", between ", { letter: ¡ }, " and ", { letter: "!" }]
            es: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio } }] }, ", entre ", { letter: ¡ }, " y ", { letter: "!" }]
            uk: [{ pattern: [{ term: "qué" }, { slot: { en: "adjective or adverb", es: "adjetivo o adverbio", uk: "прикметник або прислівник" } }] }, ", між ", { letter: "¡" }, " і ", { letter: "!" }]
            pt: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, pt: "adjetivo ou advérbio" } }] }, ", entre ", { letter: ¡ }, " e ", { letter: "!" }]
            fr: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, fr: "adjectif ou adverbe" } }] }, ", entre ", { letter: ¡ }, " et ", { letter: "!" }]
            de: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, de: "Adjektiv oder Adverb" } }] }, ", zwischen ", { letter: ¡ }, " und ", { letter: "!" }]
            it: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, it: "aggettivo o avverbio" } }] }, ", tra ", { letter: ¡ }, " e ", { letter: "!" }]
            pl: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, pl: "przymiotnik lub przysłówek" } }] }, ", między ", { letter: ¡ }, " i ", { letter: "!" }]
            tr: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, tr: "sıfat veya zarf" } }] }, ", ", { letter: ¡ }, " ile ", { letter: "!" }, " arasında"]
            id: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, id: "kata sifat atau kata keterangan" } }] }, ", di antara ", { letter: ¡ }, " dan ", { letter: "!" }]
            vi: [{ pattern: [{ term: qué }, { slot: { en: adjective or adverb, es: adjetivo o adverbio, vi: "tính từ hoặc trạng từ" } }] }, ", nằm giữa ", { letter: ¡ }, " và ", { letter: "!" }]
          ex: ["¡", { target: Qué bonito }, "!"]
          tr: { en: "How beautiful!", uk: "Як гарно!", pt: "Que bonito!", fr: "Comme c’est beau !", de: "Wie schön!", it: "Che bello!", pl: "Jak pięknie!", tr: "Ne güzel!", id: "Indah sekali!", vi: "Đẹp quá!" }
        - level: B1
          point: { en: Which, es: Cuál, uk: "Який", pt: "Qual", fr: "Quel", de: "Welcher", it: "Quale", pl: "Który", tr: "Hangisi", id: "Yang mana", vi: "Nào" }
          rule:
            en: [{ term: qué }, " before a noun, ", { term: cuál }, " alone"]
            es: [{ term: qué }, " delante de un sustantivo, ", { term: cuál }, " solo"]
            uk: [{ term: "qué" }, " перед іменником, ", { term: "cuál" }, " окремо"]
            pt: [{ term: qué }, " antes de um substantivo, ", { term: cuál }, " sozinho"]
            fr: [{ term: qué }, " devant un nom, ", { term: cuál }, " seul"]
            de: [{ term: qué }, " vor einem Nomen, ", { term: cuál }, " allein"]
            it: [{ term: qué }, " davanti a un sostantivo, ", { term: cuál }, " da solo"]
            pl: [{ term: qué }, " przed rzeczownikiem, ", { term: cuál }, " samodzielnie"]
            tr: [{ term: qué }, " bir isimden önce, ", { term: cuál }, " tek başına"]
            id: [{ term: qué }, " di depan kata benda, ", { term: cuál }, " sendirian"]
            vi: [{ term: qué }, " trước danh từ, ", { term: cuál }, " đứng một mình"]
          ex: { examples: [["¿", { target: Qué }, " libro quieres?"], ["¿", { target: Cuál }, " quieres?"]] }
          tr: { en: { examples: ["Which book do you want?", "Which one do you want?"] }, uk: { examples: ["Яку книжку ти хочеш?", "Яку ти хочеш?"] }, pt: { examples: ["Que livro você quer?", "Qual você quer?"] }, fr: { examples: ["Quel livre veux-tu ?", "Lequel veux-tu ?"] }, de: { examples: ["Welches Buch willst du?", "Welches willst du?"] }, it: { examples: ["Che libro vuoi?", "Quale vuoi?"] }, pl: { examples: ["Którą książkę chcesz?", "Którą chcesz?"] }, tr: { examples: ["Hangi kitabı istiyorsun?", "Hangisini istiyorsun?"] }, id: { examples: ["Kamu mau buku yang mana?", "Kamu mau yang mana?"] }, vi: { examples: ["Bạn muốn cuốn sách nào?", "Bạn muốn cuốn nào?"] } }
        - level: B2
          point: { es: Pregunta eco }
          rule: { es: "el interrogativo queda en el lugar del dato que se repite" }
          ex: ["¿Marta llegó ", { target: cuándo }, "?"]
        - level: B2
          point: { es: Exclamación con oración }
          rule: { es: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " valora un hecho"] }
          ex: ["¡", { target: Qué bien que }, " ya estés en casa!"]
        - level: C1
          point: { es: Dos interrogativos }
          rule: { es: "de función distinta, el segundo va al final" }
          ex: ["¿Quién te regaló eso ", { target: y por qué }, "?"]
        - level: C2
          point: { es: Sorpresa o reproche }
          rule: { es: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repite lo que dijo el otro"] }
          ex: ["¿", { target: Cómo que }, " no tienes tiempo?"]
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: nunca }, " before the verb takes no ", { term: no }]
            es: [{ term: nunca }, " delante del verbo no lleva ", { term: no }]
            uk: [{ term: "nunca" }, " перед дієсловом не потребує ", { term: "no" }]
            pt: [{ term: nunca }, " antes do verbo não leva ", { term: no }]
            fr: [{ term: nunca }, " devant le verbe ne prend pas ", { term: no }]
            de: [{ term: nunca }, " vor dem Verb steht ohne ", { term: no }]
            it: [{ term: nunca }, " davanti al verbo non vuole ", { term: no }]
            pl: [{ term: nunca }, " przed czasownikiem nie przyjmuje ", { term: no }]
            tr: [{ term: nunca }, " fiilden önce geliyorsa ", { term: no }, " almaz"]
            id: [{ term: nunca }, " di depan kata kerja tidak memakai ", { term: no }]
            vi: [{ term: nunca }, " đứng trước động từ thì không có ", { term: no }]
          ex: [{ target: Nunca }, " como carne."]
          tr: { en: "I never eat meat.", uk: "Я ніколи не їм м’яса.", pt: "Nunca como carne.", fr: "Je ne mange jamais de viande.", de: "Ich esse nie Fleisch.", it: "Non mangio mai carne.", pl: "Nigdy nie jem mięsa.", tr: "Hiç et yemem.", id: "Saya tidak pernah makan daging.", vi: "Tôi không bao giờ ăn thịt." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A question is marked at both ends: ", { letter: ¿ }, " at the start, ", { letter: "?" }, " at the end."]
              es: ["Una pregunta se marca en los dos extremos: ", { letter: ¿ }, " al principio, ", { letter: "?" }, " al final."]
              uk: ["Питання позначають з обох боків: ", { letter: "¿" }, " на початку, ", { letter: "?" }, " у кінці."]
              pt: ["Uma pergunta é marcada nas duas pontas: ", { letter: ¿ }, " no início, ", { letter: "?" }, " no fim."]
              fr: ["Une question est marquée aux deux extrémités : ", { letter: ¿ }, " au début, ", { letter: "?" }, " à la fin."]
              de: ["Eine Frage wird an beiden Enden markiert: ", { letter: ¿ }, " am Anfang, ", { letter: "?" }, " am Ende."]
              it: ["Una domanda è segnalata a entrambe le estremità: ", { letter: ¿ }, " all'inizio, ", { letter: "?" }, " alla fine."]
              pl: ["Pytanie jest oznaczone na obu końcach: ", { letter: ¿ }, " na początku, ", { letter: "?" }, " na końcu."]
              tr: ["Soru iki uçtan işaretlenir: başta ", { letter: ¿ }, ", sonda ", { letter: "?" }, "."]
              id: ["Pertanyaan ditandai di kedua ujungnya: ", { letter: ¿ }, " di awal, ", { letter: "?" }, " di akhir."]
              vi: ["Câu hỏi được đánh dấu ở cả hai đầu: ", { letter: ¿ }, " ở đầu, ", { letter: "?" }, " ở cuối."]
          - type: rule
            level: A1
            text:
              en: "In a yes-no question, the voice rises at the end:"
              es: "En una pregunta de sí o no, la entonación sube al final:"
              uk: "У загальному питанні інтонація в кінці підвищується:"
              pt: "Em uma pergunta de sim ou não, a entonação sobe no final:"
              fr: "Dans une question fermée, la voix monte à la fin :"
              de: "In einer Ja-Nein-Frage steigt die Stimme am Ende:"
              it: "In una domanda sì/no, l'intonazione sale alla fine:"
              pl: "W pytaniu rozstrzygnięcia intonacja na końcu rośnie:"
              tr: "Evet-hayır sorusunda ses sonda yükselir:"
              id: "Pada pertanyaan ya atau tidak, intonasi naik di akhir:"
              vi: "Trong câu hỏi có/không, ngữ điệu lên cao ở cuối:"
            ex: ["¿Tienes hermanos? ", { intonation: rise }]
            tr: { en: "Have you got any brothers or sisters?", uk: "У тебе є брати чи сестри?", pt: "Você tem irmãos?", fr: "As-tu des frères et sœurs ?", de: "Hast du Geschwister?", it: "Hai fratelli o sorelle?", pl: "Czy masz rodzeństwo?", tr: "Kardeşin var mı?", id: "Apakah kamu punya saudara?", vi: "Bạn có anh chị em không?" }
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["Spanish has no helper like English ", { l1: do }, ": the verb alone makes the question."]

  - title: { en: "Form: yes-no questions", es: "Forma: preguntas de sí o no", uk: "Форма: загальне питання", pt: "Forma: perguntas de sim ou não", fr: "Forme : questions fermées", de: "Form: Ja-Nein-Fragen", it: "Forma: domande sì/no", pl: "Forma: pytania rozstrzygnięcia", tr: "Biçim: evet-hayır soruları", id: "Bentuk: pertanyaan ya atau tidak", vi: "Dạng: câu hỏi có/không" }
    role: form
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question, es: Pregunta, uk: "Питання", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, question: { en: The order of a statement, es: El orden de una afirmación, uk: "Порядок слів розповідного речення", pt: "A ordem de uma afirmação", fr: "L’ordre d’une phrase affirmative", de: "Die Wortstellung einer Aussage", it: "L'ordine di un'affermazione", pl: "Szyk zdania oznajmującego", tr: "Olumlu cümlenin sözcük sırası", id: "Urutan kalimat pernyataan", vi: "Trật tự của câu khẳng định" }, ex: { target: ¿Hablas español? }, tr: { en: "Do you speak Spanish?", uk: "Ти говориш іспанською?", pt: "Você fala espanhol?", fr: "Parles-tu espagnol ?", de: "Sprichst du Spanisch?", it: "Parli spagnolo?", pl: "Czy mówisz po hiszpańsku?", tr: "İspanyolca konuşuyor musun?", id: "Apakah kamu berbicara bahasa Spanyol?", vi: "Bạn có nói tiếng Tây Ban Nha không?" } }
          - { level: A1, question: { en: With the subject first, es: Con el sujeto delante, uk: "З підметом на початку", pt: "Com o sujeito na frente", fr: "Avec le sujet devant", de: "Mit dem Subjekt am Anfang", it: "Con il soggetto davanti", pl: "Z podmiotem na początku", tr: "Özne başta", id: "Dengan subjek di depan", vi: "Có chủ ngữ đứng trước" }, ex: { target: ¿Ana vive aquí? }, tr: { en: "Does Ana live here?", uk: "Ана живе тут?", pt: "A Ana mora aqui?", fr: "Ana habite-t-elle ici ?", de: "Wohnt Ana hier?", it: "Ana abita qui?", pl: "Czy Ana mieszka tutaj?", tr: "Ana burada mı yaşıyor?", id: "Apakah Ana tinggal di sini?", vi: "Ana có sống ở đây không?" } }
          - level: A1
            question: { en: With the subject after the verb, es: Con el sujeto detrás del verbo, uk: "З підметом після дієслова", pt: "Com o sujeito depois do verbo", fr: "Avec le sujet après le verbe", de: "Mit dem Subjekt nach dem Verb", it: "Con il soggetto dopo il verbo", pl: "Z podmiotem po czasowniku", tr: "Özne fiilden sonra", id: "Dengan subjek setelah kata kerja", vi: "Có chủ ngữ đứng sau động từ" }
            ex: { examples: [{ target: ¿Vive Ana aquí? }, { target: ¿Habla usted inglés? }] }
            tr: { en: { examples: ["Does Ana live here?", "Do you speak English?"] }, uk: { examples: ["Ана живе тут?", "Ви говорите англійською?"] }, pt: { examples: ["A Ana mora aqui?", "O senhor fala inglês?"] }, fr: { examples: ["Ana habite-t-elle ici ?", "Parlez-vous anglais ?"] }, de: { examples: ["Wohnt Ana hier?", "Sprechen Sie Englisch?"] }, it: { examples: ["Ana abita qui?", "Parla inglese?"] }, pl: { examples: ["Czy Ana mieszka tutaj?", "Czy mówi pan po angielsku?"] }, tr: { examples: ["Ana burada mı yaşıyor?", "İngilizce konuşuyor musunuz?"] }, id: { examples: ["Apakah Ana tinggal di sini?", "Apakah Anda berbicara bahasa Inggris?"] }, vi: { examples: ["Ana có sống ở đây không?", "Anh/chị có nói tiếng Anh không?"] } }
          - level: A2
            question: { en: "Checking: ¿verdad?, ¿no?", es: "Para confirmar: ¿verdad?, ¿no?", uk: "Перепитування: ¿verdad?, ¿no?", pt: "Para confirmar: ¿verdad?, ¿no?", fr: "Pour confirmer : ¿verdad?, ¿no?", de: "Zur Bestätigung: ¿verdad?, ¿no?", it: "Per confermare: ¿verdad?, ¿no?", pl: "Potwierdzenie: ¿verdad?, ¿no?", tr: "Onaylamak için: ¿verdad?, ¿no?", id: "Untuk memastikan: ¿verdad?, ¿no?", vi: "Để xác nhận: ¿verdad?, ¿no?" }
            ex: { examples: [["Vives en Lima, ", { target: ¿verdad? }], ["Es tarde, ", { target: ¿no? }]] }
            tr: { en: { examples: ["You live in Lima, don't you?", "It's late, isn't it?"] }, uk: { examples: ["Ти живеш у Лімі, так?", "Уже пізно, правда?"] }, pt: { examples: ["Você mora em Lima, não é?", "Está tarde, não é?"] }, fr: { examples: ["Tu habites à Lima, n’est-ce pas ?", "Il est tard, non ?"] }, de: { examples: ["Du wohnst in Lima, oder?", "Es ist spät, nicht wahr?"] }, it: { examples: ["Vivi a Lima, vero?", "È tardi, no?"] }, pl: { examples: ["Mieszkasz w Limie, prawda?", "Jest późno, prawda?"] }, tr: { examples: ["Lima’da yaşıyorsun, değil mi?", "Geç oldu, değil mi?"] }, id: { examples: ["Kamu tinggal di Lima, kan?", "Sudah malam, ya?"] }, vi: { examples: ["Bạn sống ở Lima, đúng không?", "Muộn rồi, phải không?"] } }
          - { level: A2, question: { en: A choice between two, es: Una elección entre dos, uk: "Вибір між двома", pt: "Uma escolha entre duas", fr: "Un choix entre deux", de: "Eine Wahl zwischen zwei", it: "Una scelta tra due", pl: "Wybór między dwiema", tr: "İki arasında bir seçim", id: "Pilihan antara dua", vi: "Lựa chọn giữa hai" }, ex: ["¿Prefieres té ", { target: o }, " café?"], tr: { en: "Do you prefer tea or coffee?", uk: "Тобі більше подобається чай чи кава?", pt: "Você prefere chá ou café?", fr: "Préfères-tu le thé ou le café ?", de: "Trinkst du lieber Tee oder Kaffee?", it: "Preferisci il tè o il caffè?", pl: "Wolisz herbatę czy kawę?", tr: "Çay mı kahve mi tercih edersin?", id: "Kamu lebih suka teh atau kopi?", vi: "Bạn thích trà hay cà phê hơn?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The subject can stay out, go first, or follow the verb; the question means the same."
              es: "El sujeto puede omitirse, ir delante o ir detrás del verbo; la pregunta significa lo mismo."
              uk: "Підмет можна пропустити, поставити першим або після дієслова; значення питання від цього не змінюється."
              pt: "O sujeito pode ser omitido, ir antes ou depois do verbo; a pergunta significa o mesmo."
              fr: "Le sujet peut être omis, se placer devant ou derrière le verbe ; la question a le même sens."
              de: "Das Subjekt kann entfallen, vor dem Verb oder nach dem Verb stehen; die Frage bedeutet dasselbe."
              it: "Il soggetto può essere omesso, stare davanti o dopo il verbo; la domanda significa la stessa cosa."
              pl: "Podmiot można pominąć, postawić przed czasownikiem lub po nim; pytanie znaczy to samo."
              tr: "Özne düşebilir, fiilden önce ya da sonra gelebilir; soru aynı anlamı taşır."
              id: "Subjek boleh dihilangkan, diletakkan sebelum atau sesudah kata kerja; arti pertanyaannya sama."
              vi: "Chủ ngữ có thể bỏ, đứng trước hoặc sau động từ; câu hỏi vẫn có nghĩa như nhau."

  - title: { en: "Form: question words", es: "Forma: los interrogativos", uk: "Форма: питальні слова", pt: "Forma: os interrogativos", fr: "Forme : les mots interrogatifs", de: "Form: die Fragewörter", it: "Forma: le parole interrogative", pl: "Forma: zaimki pytajne", tr: "Biçim: soru sözcükleri", id: "Bentuk: kata tanya", vi: "Dạng: từ để hỏi" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: asks, label: { en: Asks about, es: Pregunta por, uk: "Про що питає", pt: "Pergunta por", fr: "Porte sur", de: "Fragt nach", it: "Chiede", pl: "Pyta o", tr: "Neyi sorar", id: "Menanyakan", vi: "Hỏi về" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, word: qué, asks: { en: things and actions, es: cosas y acciones, uk: "речі й дії", pt: "coisas e ações", fr: "les choses et les actions", de: "Dinge und Handlungen", it: "cose e azioni", pl: "rzeczy i czynności", tr: "şeyler ve eylemler", id: "benda dan tindakan", vi: "sự vật và hành động" }, ex: ["¿", { target: Qué }, " haces?"], tr: { en: "What are you doing?", uk: "Що ти робиш?", pt: "O que você faz?", fr: "Que fais-tu ?", de: "Was machst du?", it: "Che cosa fai?", pl: "Co robisz?", tr: "Ne yapıyorsun?", id: "Apa yang kamu lakukan?", vi: "Bạn đang làm gì?" } }
          - { level: A1, word: { alternatives: [quién, quiénes] }, asks: { en: people, es: personas, uk: "люди", pt: "pessoas", fr: "les personnes", de: "Personen", it: "persone", pl: "osoby", tr: "kişiler", id: "orang", vi: "người" }, ex: ["¿", { target: Quién }, " es esa chica?"], tr: { en: "Who is that girl?", uk: "Хто ця дівчина?", pt: "Quem é aquela garota?", fr: "Qui est cette fille ?", de: "Wer ist das Mädchen?", it: "Chi è quella ragazza?", pl: "Kim jest ta dziewczyna?", tr: "O kız kim?", id: "Siapa gadis itu?", vi: "Cô gái kia là ai?" } }
          - level: A1
            word: dónde
            asks: { en: places, es: lugares, uk: "місця", pt: "lugares", fr: "les lieux", de: "Orte", it: "luoghi", pl: "miejsca", tr: "yerler", id: "tempat", vi: "nơi chốn" }
            ex: { examples: [["¿", { target: Dónde }, " vives?"], ["¿De ", { target: dónde }, " eres?"]] }
            tr: { en: { examples: ["Where do you live?", "Where are you from?"] }, uk: { examples: ["Де ти живеш?", "Звідки ти?"] }, pt: { examples: ["Onde você mora?", "De onde você é?"] }, fr: { examples: ["Où habites-tu ?", "D’où viens-tu ?"] }, de: { examples: ["Wo wohnst du?", "Woher kommst du?"] }, it: { examples: ["Dove vivi?", "Di dove sei?"] }, pl: { examples: ["Gdzie mieszkasz?", "Skąd jesteś?"] }, tr: { examples: ["Nerede yaşıyorsun?", "Nerelisin?"] }, id: { examples: ["Di mana kamu tinggal?", "Kamu berasal dari mana?"] }, vi: { examples: ["Bạn sống ở đâu?", "Bạn đến từ đâu?"] } }
          - { level: A1, word: cómo, asks: { en: manner, es: el modo, uk: "спосіб", pt: "o modo", fr: "la manière", de: "die Art und Weise", it: "il modo", pl: "sposób", tr: "tarz", id: "cara", vi: "cách thức" }, ex: ["¿", { target: Cómo }, " te llamas?"], tr: { en: "What's your name?", uk: "Як тебе звати?", pt: "Como você se chama?", fr: "Comment t’appelles-tu ?", de: "Wie heißt du?", it: "Come ti chiami?", pl: "Jak masz na imię?", tr: "Adın ne?", id: "Siapa namamu?", vi: "Bạn tên là gì?" } }
          - { level: A1, word: { alternatives: [cuánto, cuánta, cuántos, cuántas] }, asks: { en: amount, es: la cantidad, uk: "кількість", pt: "a quantidade", fr: "la quantité", de: "die Menge", it: "la quantità", pl: "ilość", tr: "miktar", id: "jumlah", vi: "số lượng" }, ex: ["¿", { target: Cuántos }, " años tienes?"], tr: { en: "How old are you?", uk: "Скільки тобі років?", pt: "Quantos anos você tem?", fr: "Quel âge as-tu ?", de: "Wie alt bist du?", it: "Quanti anni hai?", pl: "Ile masz lat?", tr: "Kaç yaşındasın?", id: "Berapa umurmu?", vi: "Bạn bao nhiêu tuổi?" } }
          - { level: A1, word: por qué, asks: { en: the reason, es: la causa, uk: "причина", pt: "a causa", fr: "la cause", de: "die Ursache", it: "la causa", pl: "przyczyna", tr: "neden", id: "sebab", vi: "nguyên nhân" }, ex: ["¿", { target: Por qué }, " estudias español?"], tr: { en: "Why are you studying Spanish?", uk: "Чому ти вивчаєш іспанську?", pt: "Por que você estuda espanhol?", fr: "Pourquoi étudies-tu l’espagnol ?", de: "Warum lernst du Spanisch?", it: "Perché studi spagnolo?", pl: "Dlaczego uczysz się hiszpańskiego?", tr: "Neden İspanyolca öğreniyorsun?", id: "Mengapa kamu belajar bahasa Spanyol?", vi: "Tại sao bạn học tiếng Tây Ban Nha?" } }
          - { level: A2, word: cuándo, asks: { en: time, es: el tiempo, uk: "час", pt: "o tempo", fr: "le moment", de: "die Zeit", it: "il tempo", pl: "czas", tr: "zaman", id: "waktu", vi: "thời gian" }, ex: ["¿", { target: Cuándo }, " empiezas las vacaciones?"], tr: { en: "When do your holidays start?", uk: "Коли в тебе починається відпустка?", pt: "Quando começam suas férias?", fr: "Quand commencent tes vacances ?", de: "Wann beginnen deine Ferien?", it: "Quando iniziano le tue vacanze?", pl: "Kiedy zaczynasz urlop?", tr: "Tatilin ne zaman başlıyor?", id: "Kapan liburanmu dimulai?", vi: "Khi nào kỳ nghỉ của bạn bắt đầu?" } }
          - { level: B1, word: { alternatives: [cuál, cuáles] }, asks: { en: one of a known set, es: uno de un grupo conocido, uk: "один із відомого набору", pt: "um de um grupo conhecido", fr: "un parmi un groupe connu", de: "eines aus einer bekannten Gruppe", it: "uno di un gruppo conosciuto", pl: "jeden z znanego zbioru", tr: "bilinen bir gruptan biri", id: "salah satu dari kelompok yang sudah dikenal", vi: "một trong nhóm đã biết" }, ex: ["¿", { target: Cuál }, " prefieres?"], tr: { en: "Which one do you prefer?", uk: "Який тобі більше подобається?", pt: "Qual você prefere?", fr: "Lequel préfères-tu ?", de: "Welches magst du lieber?", it: "Quale preferisci?", pl: "Który wolisz?", tr: "Hangisini tercih edersin?", id: "Kamu lebih suka yang mana?", vi: "Bạn thích cái nào hơn?" } }
      - type: usage
        columns:
          - { key: structure, label: { es: Estructura } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            structure: { es: "pregunta eco: el interrogativo queda en el lugar del dato que se repite" }
            ex: { examples: [["¿Marta llegó ", { target: cuándo }, "?"], ["¿Tu hermano compró ", { target: qué }, "?"]] }
          - level: B2
            structure: { es: [{ pattern: [{ alternatives: [{ term: quién }, { term: cuántos }] }, { term: de }, { slot: plural noun }] }, ": se elige dentro de un grupo"] }
            ex: { examples: [["¿", { target: Quién de }, " tus primos vive en Quito?"], ["¿", { target: Cuántos de }, " tus vecinos tienen perro?"]] }
          - level: B2
            structure: { es: [{ term: quién }, " como sujeto admite entre él y el verbo la negación o un adverbio"] }
            ex: { examples: [["¿", { target: Quién no }, " sabe la respuesta?"], ["¿", { target: Quién a veces }, " cocina en tu casa?"]] }
          - level: B2
            structure: { es: "con los demás interrogativos, el sujeto va detrás del verbo" }
            ex: { examples: [["¿", { target: Dónde compra }, " el pan tu vecina?"], ["¿", { target: Cuándo llega }, " el tren?"]] }
          - level: B2
            structure: { es: [{ term: por qué }, " admite el sujeto delante del verbo"] }
            ex: ["¿", { target: Por qué tu hermana }, " no vino?"]
          - level: B2
            structure: { es: ["dos interrogativos de la misma función se coordinan con ", { term: y }] }
            ex: ["¿", { target: Dónde y cuándo }, " se conocieron tus padres?"]
          - level: C1
            structure: { es: "el grupo del que se elige puede ir lejos del interrogativo" }
            ex: { examples: [["¿Quién es médico ", { target: de entre los presentes }, "?"], ["¿Cuál prefieres ", { target: de todas estas camisas }, "?"]] }
          - level: C1
            structure: { es: "dos interrogativos de función distinta: el segundo va al final" }
            ex: { examples: [["¿Quién te regaló eso ", { target: y por qué }, "?"], ["¿Quién llamó ", { target: y para qué }, "?"]] }
          - level: C1
            structure: { es: "un tema abre la pregunta y un pronombre átono lo recoge" }
            ex: [{ target: Al jefe }, ", ¿", { target: le }, " avisaste de la reunión?"]
          - level: C2
            structure: { es: "varios interrogativos en una pregunta: la respuesta da un dato para cada uno" }
            ex: { examples: [["¿", { target: Quién trajo qué }, " a la fiesta?"], ["¿", { target: Quién pidió qué }, "?"]] }
          - level: C2
            structure: { es: "el interrogativo sale de una subordinada lejana y deja un hueco" }
            ex: { examples: [["¿", { target: Qué libro }, " dices que compró Ana?"], ["¿", { target: Qué plato }, " no sabes cómo preparar?"]] }
          - level: C2
            structure: { es: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repite con sorpresa o reproche lo que dijo el otro"] }
            ex: { examples: [["¿", { target: Cómo que }, " no tienes tiempo?"], ["¿", { target: Cómo que }, " ya te vas?"]] }
          - level: C2
            structure: { es: "pregunta retórica: el sentido es negativo y no espera respuesta" }
            ex: { examples: [{ target: ¿Quién va a creer esa historia? }, { target: ¿Pero es que alguien puede vivir con tan poco? }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every question word carries a written accent and opens its question."
              es: "Todo interrogativo lleva tilde y abre su pregunta."
              uk: "Кожне питальне слово пишеться зі знаком наголосу і стоїть на початку питання."
              pt: "Todo interrogativo leva acento gráfico e abre a sua pergunta."
              fr: "Tout mot interrogatif porte un accent écrit et ouvre sa question."
              de: "Jedes Fragewort trägt einen Akzent und eröffnet seine Frage."
              it: "Ogni parola interrogativa porta l'accento scritto e apre la sua domanda."
              pl: "Każdy zaimek pytajny ma akcent pisany i otwiera pytanie."
              tr: "Her soru sözcüğü yazıda vurgu işareti taşır ve sorusunu açar."
              id: "Setiap kata tanya memakai tanda aksen dan membuka pertanyaannya."
              vi: "Mọi từ để hỏi đều có dấu sắc và mở đầu câu hỏi của nó."
          - type: rule
            level: A1
            text:
              en: [{ term: cuánto }, " agrees with its noun: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              es: [{ term: cuánto }, " concuerda con su sustantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              uk: [{ term: "cuánto" }, " узгоджується зі своїм іменником: ", { alternatives: [{ term: "cuántos años" }, { term: "cuántas hermanas" }] }, "."]
              pt: [{ term: cuánto }, " concorda com o seu substantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              fr: [{ term: cuánto }, " s’accorde avec son nom : ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              de: [{ term: cuánto }, " richtet sich nach seinem Nomen: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              it: [{ term: cuánto }, " concorda con il suo sostantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              pl: [{ term: cuánto }, " zgadza się ze swoim rzeczownikiem: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              tr: [{ term: cuánto }, " isminle uyum sağlar: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              id: [{ term: cuánto }, " menyesuaikan dengan kata bendanya: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              vi: [{ term: cuánto }, " hòa hợp với danh từ của nó: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
          - type: rule
            level: A1
            text:
              en: "A preposition goes before the question word, at the start of the question:"
              es: "La preposición va delante del interrogativo, al principio de la pregunta:"
              uk: "Прийменник стоїть перед питальним словом, на початку питання:"
              pt: "A preposição vem antes da palavra interrogativa, no início da pergunta:"
              fr: "La préposition se place devant le mot interrogatif, au début de la question :"
              de: "Die Präposition steht vor dem Fragewort, am Anfang der Frage:"
              it: "La preposizione sta davanti alla parola interrogativa, all'inizio della domanda:"
              pl: "Przyimek stoi przed zaimkiem pytajnym, na początku pytania:"
              tr: "Edat, soru sözcüğünün önünde, sorunun başında yer alır:"
              id: "Kata depan berada sebelum kata tanya, di awal pertanyaan:"
              vi: "Giới từ đứng trước từ để hỏi, ở đầu câu hỏi:"
            ex: { examples: [["¿", { target: Con quién }, " trabajas?"], ["¿", { target: A quién }, " llamas?"]] }
            tr: { en: { examples: ["Who do you work with?", "Who are you calling?"] }, uk: { examples: ["З ким ти працюєш?", "Кому ти телефонуєш?"] }, pt: { examples: ["Com quem você trabalha?", "Para quem você está ligando?"] }, fr: { examples: ["Avec qui travailles-tu ?", "Qui appelles-tu ?"] }, de: { examples: ["Mit wem arbeitest du?", "Wen rufst du an?"] }, it: { examples: ["Con chi lavori?", "Chi chiami?"] }, pl: { examples: ["Z kim pracujesz?", "Do kogo dzwonisz?"] }, tr: { examples: ["Kiminle çalışıyorsun?", "Kimi arıyorsun?"] }, id: { examples: ["Dengan siapa kamu bekerja?", "Kamu menelepon siapa?"] }, vi: { examples: ["Bạn làm việc với ai?", "Bạn đang gọi cho ai?"] } }

  - title: { en: "Form: negatives", es: "Forma: la negación", uk: "Форма: заперечення", pt: "Forma: a negação", fr: "Forme : la négation", de: "Form: die Verneinung", it: "Forma: la negazione", pl: "Forma: przeczenie", tr: "Biçim: olumsuzluk", id: "Bentuk: negasi", vi: "Dạng: phủ định" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, pattern: { pattern: [no, { slot: verb }] }, ex: [{ target: No hablo }, " inglés."], tr: { en: "I don't speak English.", uk: "Я не говорю англійською.", pt: "Não falo inglês.", fr: "Je ne parle pas anglais.", de: "Ich spreche kein Englisch.", it: "Non parlo inglese.", pl: "Nie mówię po angielsku.", tr: "İngilizce konuşmuyorum.", id: "Saya tidak berbicara bahasa Inggris.", vi: "Tôi không nói tiếng Anh." } }
          - level: A1
            pattern: { pattern: [no, { slot: { en: pronoun, es: pronombre, uk: "займенник", pt: "pronome", fr: "pronom", de: "Pronomen", it: "pronome", pl: "zaimek", tr: "zamir", id: "kata ganti", vi: "đại từ" } }, { slot: verb }] }
            ex: { examples: [{ target: No lo sé. }, { target: No me gusta. }] }
            tr: { en: { examples: ["I don't know.", "I don't like it."] }, uk: { examples: ["Я не знаю.", "Мені не подобається."] }, pt: { examples: ["Não sei.", "Não gosto disso."] }, fr: { examples: ["Je ne sais pas.", "Ça ne me plaît pas."] }, de: { examples: ["Ich weiß es nicht.", "Es gefällt mir nicht."] }, it: { examples: ["Non lo so.", "Non mi piace."] }, pl: { examples: ["Nie wiem.", "Nie podoba mi się to."] }, tr: { examples: ["Bunu bilmiyorum.", "Bu hoşuma gitmiyor."] }, id: { examples: ["Saya tidak tahu.", "Saya tidak suka."] }, vi: { examples: ["Tôi không biết.", "Tôi không thích."] } }
          - level: A2
            pattern: { pattern: [no, { slot: verb }, { alternatives: [nunca, nada, nadie] }] }
            ex: { examples: [[{ target: No }, " quiero ", { target: nada }, "."], [{ target: No }, " veo a ", { target: nadie }, "."]] }
            tr: { en: { examples: ["I don't want anything.", "I can't see anybody."] }, uk: { examples: ["Я нічого не хочу.", "Я нікого не бачу."] }, pt: { examples: ["Não quero nada.", "Não vejo ninguém."] }, fr: { examples: ["Je ne veux rien.", "Je ne vois personne."] }, de: { examples: ["Ich will nichts.", "Ich sehe niemanden."] }, it: { examples: ["Non voglio niente.", "Non vedo nessuno."] }, pl: { examples: ["Niczego nie chcę.", "Nikogo nie widzę."] }, tr: { examples: ["Hiçbir şey istemiyorum.", "Kimseyi görmüyorum."] }, id: { examples: ["Saya tidak mau apa-apa.", "Saya tidak melihat siapa pun."] }, vi: { examples: ["Tôi không muốn gì cả.", "Tôi không thấy ai cả."] } }
          - { level: A2, pattern: { pattern: [nunca, { slot: verb }] }, ex: [{ target: Nunca }, " como carne."], tr: { en: "I never eat meat.", uk: "Я ніколи не їм м’яса.", pt: "Nunca como carne.", fr: "Je ne mange jamais de viande.", de: "Ich esse nie Fleisch.", it: "Non mangio mai carne.", pl: "Nigdy nie jem mięsa.", tr: "Hiç et yemem.", id: "Saya tidak pernah makan daging.", vi: "Tôi không bao giờ ăn thịt." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "In an answer, the first no answers the question and the second makes the verb negative:"
              es: "En una respuesta, el primer no responde a la pregunta y el segundo niega el verbo:"
              uk: "У відповіді перше no відповідає на питання, а друге заперечує дієслово:"
              pt: "Em uma resposta, o primeiro no responde à pergunta e o segundo nega o verbo:"
              fr: "Dans une réponse, le premier no répond à la question et le second nie le verbe :"
              de: "In einer Antwort beantwortet das erste no die Frage und das zweite verneint das Verb:"
              it: "In una risposta, il primo no risponde alla domanda e il secondo nega il verbo:"
              pl: "W odpowiedzi pierwsze no odpowiada na pytanie, a drugie neguje czasownik:"
              tr: "Cevapta ilk no soruyu yanıtlar, ikincisi fiili olumsuz yapar:"
              id: "Dalam jawaban, no pertama menjawab pertanyaan dan no kedua menegasikan kata kerja:"
              vi: "Trong câu trả lời, no đầu tiên trả lời câu hỏi và no thứ hai phủ định động từ:"
            ex: { exchange: ["¿Eres de aquí?", ["No, ", { target: no soy }, " de aquí."]] }
            tr: { en: { exchange: ["Are you from here?", "No, I'm not from here."] }, uk: { exchange: ["Ти звідси?", "Ні, я не звідси."] }, pt: { exchange: ["Você é daqui?", "Não, não sou daqui."] }, fr: { exchange: ["Tu es d’ici ?", "Non, je ne suis pas d’ici."] }, de: { exchange: ["Bist du von hier?", "Nein, ich bin nicht von hier."] }, it: { exchange: ["Sei di qui?", "No, non sono di qui."] }, pl: { exchange: ["Jesteś stąd?", "Nie, nie jestem stąd."] }, tr: { exchange: ["Buralı mısın?", "Hayır, buralı değilim."] }, id: { exchange: ["Apakah kamu orang sini?", "Bukan, saya bukan orang sini."] }, vi: { exchange: ["Bạn là người ở đây à?", "Không, tôi không phải người ở đây."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: no }, " goes before the pronouns in front of the verb."]
              es: [{ term: no }, " va delante de los pronombres que preceden al verbo."]
              uk: [{ term: "no" }, " стоїть перед займенниками, що передують дієслову."]
              pt: [{ term: no }, " vai antes dos pronomes que precedem o verbo."]
              fr: [{ term: no }, " se place devant les pronoms qui précèdent le verbe."]
              de: [{ term: no }, " steht vor den Pronomen, die vor dem Verb stehen."]
              it: [{ term: no }, " va davanti ai pronomi che precedono il verbo."]
              pl: [{ term: no }, " stoi przed zaimkami poprzedzającymi czasownik."]
              tr: [{ term: no }, " fiilin önündeki zamirlerin de önünde yer alır."]
              id: [{ term: no }, " berada di depan kata ganti yang mendahului kata kerja."]
              vi: [{ term: no }, " đứng trước các đại từ đứng trước động từ."]
          - type: rule
            level: A1
            text:
              en: [{ term: también }, " agrees with a statement, ", { term: tampoco }, " with a negative:"]
              es: [{ term: también }, " coincide con una afirmación, ", { term: tampoco }, ", con una negación:"]
              uk: [{ term: "también" }, " виражає згоду зі ствердженням, ", { term: "tampoco" }, " — із запереченням:"]
              pt: [{ term: también }, " concorda com uma afirmação, ", { term: tampoco }, " com uma negação:"]
              fr: [{ term: también }, " marque l’accord avec une phrase affirmative, ", { term: tampoco }, " avec une négation :"]
              de: [{ term: también }, " stimmt einer Aussage zu, ", { term: tampoco }, " einer Verneinung:"]
              it: [{ term: también }, " concorda con un'affermazione, ", { term: tampoco }, " con una negazione:"]
              pl: [{ term: también }, " zgadza się ze zdaniem twierdzącym, ", { term: tampoco }, " — z przeczeniem:"]
              tr: [{ term: también }, " olumlu bir cümleye katılır, ", { term: tampoco }, " olumsuz bir cümleye katılır:"]
              id: [{ term: también }, " menyetujui pernyataan, ", { term: tampoco }, " menyetujui negasi:"]
              vi: [{ term: también }, " đồng tình với câu khẳng định, ", { term: tampoco }, " đồng tình với câu phủ định:"]
            ex: { examples: [{ exchange: ["Soy de Chile.", ["Yo ", { target: también }, "."]] }, { exchange: ["No hablo francés.", ["Yo ", { target: tampoco }, "."]] }] }
            tr: { en: { examples: [{ exchange: ["I'm from Chile.", "So am I."] }, { exchange: ["I don't speak French.", "Neither do I."] }] }, uk: { examples: [{ exchange: ["Я з Чилі.", "Я теж."] }, { exchange: ["Я не говорю французькою.", "Я теж ні."] }] }, pt: { examples: [{ exchange: ["Sou do Chile.", "Eu também."] }, { exchange: ["Não falo francês.", "Eu também não."] }] }, fr: { examples: [{ exchange: ["Je viens du Chili.", "Moi aussi."] }, { exchange: ["Je ne parle pas français.", "Moi non plus."] }] }, de: { examples: [{ exchange: ["Ich komme aus Chile.", "Ich auch."] }, { exchange: ["Ich spreche kein Französisch.", "Ich auch nicht."] }] }, it: { examples: [{ exchange: ["Sono del Cile.", "Anch'io."] }, { exchange: ["Non parlo francese.", "Neanch'io."] }] }, pl: { examples: [{ exchange: ["Jestem z Chile.", "Ja też."] }, { exchange: ["Nie mówię po francusku.", "Ja też nie."] }] }, tr: { examples: [{ exchange: ["Şililiyim.", "Ben de."] }, { exchange: ["Fransızca konuşmuyorum.", "Ben de konuşmuyorum."] }] }, id: { examples: [{ exchange: ["Saya berasal dari Chili.", "Saya juga."] }, { exchange: ["Saya tidak berbicara bahasa Prancis.", "Saya juga tidak."] }] }, vi: { examples: [{ exchange: ["Tôi đến từ Chile.", "Tôi cũng vậy."] }, { exchange: ["Tôi không nói tiếng Pháp.", "Tôi cũng không."] }] } }
          - type: rule
            level: A2
            text:
              en: ["After the verb, ", { alternatives: [{ term: nunca }, { term: nada }, { term: nadie }] }, " need ", { term: no }, " before the verb; before the verb, they stand alone."]
