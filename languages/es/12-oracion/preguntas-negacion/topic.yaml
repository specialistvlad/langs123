          rule: { es: "el interrogativo queda en el lugar del dato que se repite", en: "the question word stays in the place of the repeated item", uk: "питальне слово лишається на місці повтореного елемента", pt: "o interrogativo fica no lugar do dado que se repete", fr: "le mot interrogatif reste à la place de l’élément répété", de: "das Fragewort bleibt an der Stelle der wiederholten Angabe", it: "la parola interrogativa resta al posto del dato ripetuto", pl: "zaimek pytajny zostaje na miejscu powtarzanej informacji", tr: "soru sözcüğü, yinelenen bilginin yerinde kalır", id: "kata tanya tetap berada di tempat informasi yang diulang", vi: "từ để hỏi giữ nguyên vị trí của thông tin được lặp lại" }
          ex: ["¿Marta llegó ", { target: cuándo }, "?"]
