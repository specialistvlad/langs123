            structure: { es: [{ term: por qué }, " admite el sujeto delante del verbo"], en: [{ term: por qué }, " allows the subject before the verb"], uk: [{ term: por qué }, " допускає підмет перед дієсловом"], pt: [{ term: por qué }, " admite o sujeito antes do verbo"], fr: [{ term: por qué }, " admet le sujet devant le verbe"], de: [{ term: por qué }, " lässt das Subjekt vor dem Verb zu"], it: [{ term: por qué }, " ammette il soggetto davanti al verbo"], pl: [{ term: por qué }, " dopuszcza podmiot przed czasownikiem"], tr: [{ term: por qué }, " özneyi fiilin önünde kabul eder"], id: [{ term: por qué }, " membolehkan subjek di depan kata kerja"], vi: [{ term: por qué }, " cho phép chủ ngữ đứng trước động từ"] }
            ex: ["¿", { target: Por qué tu hermana }, " no vino?"]
            tr: { en: "Why didn’t your sister come?", uk: "Чому твоя сестра не прийшла?", pt: "Por que sua irmã não veio?", fr: "Pourquoi ta sœur n’est-elle pas venue ?", de: "Warum ist deine Schwester nicht gekommen?", it: "Perché tua sorella non è venuta?", pl: "Dlaczego twoja siostra nie przyszła?", tr: "Kız kardeşin neden gelmedi?", id: "Mengapa saudarimu tidak datang?", vi: "Tại sao chị gái bạn không đến?" }
          - level: B2
            structure: { es: ["dos interrogativos de la misma función se coordinan con ", { term: y }], en: ["two question words with the same function are joined with ", { term: y }], uk: ["два питальні слова з однаковою функцією з’єднуються за допомогою ", { term: y }], pt: ["dois interrogativos da mesma função se coordenam com ", { term: y }], fr: ["deux mots interrogatifs de même fonction se coordonnent avec ", { term: y }], de: ["zwei Fragewörter mit gleicher Funktion werden mit ", { term: y }, " verbunden"], it: ["due parole interrogative con la stessa funzione si coordinano con ", { term: y }], pl: ["dwa zaimki pytajne o tej samej funkcji łączy się przez ", { term: y }], tr: ["işlevi aynı olan iki soru sözcüğü ", { term: y }, " ile bağlanır"], id: ["dua kata tanya dengan fungsi sama dihubungkan dengan ", { term: y }], vi: ["hai từ để hỏi cùng chức năng được nối bằng ", { term: y }] }
            ex: ["¿", { target: Dónde y cuándo }, " se conocieron tus padres?"]
            tr: { en: "Where and when did your parents meet?", uk: "Де і коли познайомилися твої батьки?", pt: "Onde e quando seus pais se conheceram?", fr: "Où et quand tes parents se sont-ils rencontrés ?", de: "Wo und wann haben sich deine Eltern kennengelernt?", it: "Dove e quando si sono conosciuti i tuoi genitori?", pl: "Gdzie i kiedy poznali się twoi rodzice?", tr: "Annen baban nerede ve ne zaman tanıştı?", id: "Di mana dan kapan orang tuamu bertemu?", vi: "Bố mẹ bạn gặp nhau ở đâu và khi nào?" }
          - level: C1
            structure: { es: "el grupo del que se elige puede ir lejos del interrogativo", en: "the group you choose from can be far from the question word", uk: "група, з якої вибирають, може стояти далеко від питального слова", pt: "o grupo do qual se escolhe pode ficar longe do interrogativo", fr: "le groupe dans lequel on choisit peut être loin du mot interrogatif", de: "die Gruppe, aus der man wählt, kann weit vom Fragewort entfernt stehen", it: "il gruppo da cui si sceglie può stare lontano dalla parola interrogativa", pl: "grupa, z której się wybiera, może stać daleko od zaimka pytajnego", tr: "seçim yapılan grup soru sözcüğünden uzakta olabilir", id: "kelompok tempat memilih dapat berada jauh dari kata tanya", vi: "nhóm mà ta chọn có thể đứng xa từ để hỏi" }
            ex: { examples: [["¿Quién es médico ", { target: de entre los presentes }, "?"], ["¿Cuál prefieres ", { target: de todas estas camisas }, "?"]] }
            tr: { en: { examples: ["Who among those present is a doctor?", "Which of all these shirts do you prefer?"] }, uk: { examples: ["Хто з присутніх лікар?", "Якій із цих сорочок ти віддаєш перевагу?"] }, pt: { examples: ["Quem entre os presentes é médico?", "Qual destas camisas você prefere?"] }, fr: { examples: ["Qui parmi les personnes présentes est médecin ?", "Laquelle de toutes ces chemises préfères-tu ?"] }, de: { examples: ["Wer von den Anwesenden ist Arzt?", "Welches von all diesen Hemden gefällt dir am besten?"] }, it: { examples: ["Chi tra i presenti è medico?", "Quale di tutte queste camicie preferisci?"] }, pl: { examples: ["Kto spośród obecnych jest lekarzem?", "Którą z tych wszystkich koszul wolisz?"] }, tr: { examples: ["Burada bulunanlar arasında doktor kim?", "Bu gömleklerin hepsinden hangisini tercih edersin?"] }, id: { examples: ["Siapa di antara yang hadir yang menjadi dokter?", "Dari semua kemeja ini, mana yang kamu suka?"] }, vi: { examples: ["Trong số những người có mặt, ai là bác sĩ?", "Trong tất cả những chiếc áo sơ mi này, bạn thích chiếc nào hơn?"] } }
          - level: C1
            structure: { es: "dos interrogativos de función distinta: el segundo va al final", en: "two question words with different functions: the second goes last", uk: "два питальні слова з різною функцією: друге стоїть у кінці", pt: "dois interrogativos de função diferente: o segundo vai no fim", fr: "deux mots interrogatifs de fonction différente : le second se place à la fin", de: "zwei Fragewörter mit verschiedener Funktion: Das zweite steht am Ende", it: "due parole interrogative di funzione diversa: il secondo va in fondo", pl: "dwa zaimki pytajne o różnych funkcjach: drugi stoi na końcu", tr: "işlevi farklı iki soru sözcüğü: ikincisi sona gelir", id: "dua kata tanya dengan fungsi berbeda: yang kedua berada di akhir", vi: "hai từ để hỏi khác chức năng: từ thứ hai đứng cuối" }
            ex: { examples: [["¿Quién te regaló eso ", { target: y por qué }, "?"], ["¿Quién llamó ", { target: y para qué }, "?"]] }
            tr: { en: { examples: ["Who gave you that, and why?", "Who called, and what for?"] }, uk: { examples: ["Хто тобі це подарував і чому?", "Хто дзвонив і навіщо?"] }, pt: { examples: ["Quem te deu isso e por quê?", "Quem ligou e para quê?"] }, fr: { examples: ["Qui t’a offert ça, et pourquoi ?", "Qui a appelé, et pour quoi faire ?"] }, de: { examples: ["Wer hat dir das geschenkt, und warum?", "Wer hat angerufen, und wozu?"] }, it: { examples: ["Chi te l'ha regalato e perché?", "Chi ha chiamato e per quale motivo?"] }, pl: { examples: ["Kto ci to podarował i dlaczego?", "Kto dzwonił i po co?"] }, tr: { examples: ["Bunu sana kim hediye etti, neden?", "Kim aradı, ne için?"] }, id: { examples: ["Siapa yang memberimu itu, dan mengapa?", "Siapa yang menelepon, dan untuk apa?"] }, vi: { examples: ["Ai tặng bạn cái đó, và vì sao?", "Ai đã gọi, và để làm gì?"] } }
          - level: C1
            structure: { es: "un tema abre la pregunta y un pronombre átono lo recoge", en: "a topic opens the question and an unstressed pronoun picks it up", uk: "тема відкриває питання, а ненаголошений займенник її підхоплює", pt: "um tema abre a pergunta e um pronome átono o retoma", fr: "un thème ouvre la question et un pronom atone le reprend", de: "ein Thema eröffnet die Frage und ein unbetontes Pronomen nimmt es auf", it: "un tema apre la domanda e un pronome atono lo riprende", pl: "temat otwiera pytanie, a zaimek nieakcentowany go podejmuje", tr: "bir konu soruyu açar, vurgusuz bir zamir onu yeniden anar", id: "sebuah topik membuka pertanyaan dan kata ganti tanpa tekanan merujuknya kembali", vi: "một chủ đề mở đầu câu hỏi và một đại từ không nhấn nhắc lại nó" }
            ex: [{ target: Al jefe }, ", ¿", { target: le }, " avisaste de la reunión?"]
            tr: { en: "The boss, did you tell him about the meeting?", uk: "А начальника ти попередив про зустріч?", pt: "E o chefe, você avisou sobre a reunião?", fr: "Le patron, tu l’as prévenu de la réunion ?", de: "Den Chef, hast du ihn über die Besprechung informiert?", it: "Il capo, l'hai avvisato della riunione?", pl: "Szefa uprzedziłeś o zebraniu?", tr: "Patronu toplantıdan haberdar ettin mi?", id: "Soal bos, apakah kamu sudah memberitahunya tentang rapat itu?", vi: "Sếp thì bạn đã báo về cuộc họp chưa?" }
          - level: C2
            structure: { es: "varios interrogativos en una pregunta: la respuesta da un dato para cada uno", en: "several question words in one question: the answer gives one item for each", uk: "кілька питальних слів в одному питанні: відповідь дає окремі дані для кожного", pt: "vários interrogativos em uma pergunta: a resposta dá um dado para cada um", fr: "plusieurs mots interrogatifs dans une question : la réponse donne une information pour chacun", de: "mehrere Fragewörter in einer Frage: Die Antwort nennt je eine Angabe für jedes", it: "più parole interrogative in una domanda: la risposta dà un dato per ciascuna", pl: "kilka zaimków pytajnych w jednym pytaniu: odpowiedź podaje informację dla każdego z nich", tr: "tek soruda birkaç soru sözcüğü: yanıt her biri için bir bilgi verir", id: "beberapa kata tanya dalam satu pertanyaan: jawabannya memberi satu informasi untuk masing-masing", vi: "nhiều từ để hỏi trong một câu: câu trả lời đưa ra một thông tin cho từng từ" }
            ex: { examples: [["¿", { target: Quién trajo qué }, " a la fiesta?"], ["¿", { target: Quién pidió qué }, "?"]] }
            tr: { en: { examples: ["Who brought what to the party?", "Who ordered what?"] }, uk: { examples: ["Хто що приніс на вечірку?", "Хто що замовив?"] }, pt: { examples: ["Quem trouxe o quê para a festa?", "Quem pediu o quê?"] }, fr: { examples: ["Qui a apporté quoi à la fête ?", "Qui a commandé quoi ?"] }, de: { examples: ["Wer hat was zur Party mitgebracht?", "Wer hat was bestellt?"] }, it: { examples: ["Chi ha portato cosa alla festa?", "Chi ha ordinato cosa?"] }, pl: { examples: ["Kto co przyniósł na imprezę?", "Kto co zamówił?"] }, tr: { examples: ["Partiye kim ne getirdi?", "Kim ne sipariş etti?"] }, id: { examples: ["Siapa membawa apa ke pesta?", "Siapa memesan apa?"] }, vi: { examples: ["Ai đã mang gì đến bữa tiệc?", "Ai đã gọi món gì?"] } }
          - level: C2
            structure: { es: "el interrogativo sale de una subordinada lejana y deja un hueco", en: "the question word comes from a distant subordinate clause and leaves a gap", uk: "питальне слово виходить із далекого підрядного речення й залишає прогалину", pt: "o interrogativo sai de uma subordinada distante e deixa uma lacuna", fr: "le mot interrogatif sort d’une subordonnée éloignée et laisse un vide", de: "das Fragewort stammt aus einem entfernten Nebensatz und hinterlässt eine Lücke", it: "la parola interrogativa esce da una subordinata lontana e lascia un vuoto", pl: "zaimek pytajny wychodzi z dalekiego zdania podrzędnego i zostawia lukę", tr: "soru sözcüğü uzaktaki bir yan cümleden çıkar ve bir boşluk bırakır", id: "kata tanya keluar dari anak kalimat yang jauh dan meninggalkan celah", vi: "từ để hỏi tách ra từ một mệnh đề phụ ở xa và để lại một chỗ trống" }
            ex: { examples: [["¿", { target: Qué libro }, " dices que compró Ana?"], ["¿", { target: Qué plato }, " no sabes cómo preparar?"]] }
            tr: { en: { examples: ["Which book do you say Ana bought?", "Which dish don’t you know how to prepare?"] }, uk: { examples: ["Яку книжку, кажеш, купила Ана?", "Яку страву ти не знаєш, як приготувати?"] }, pt: { examples: ["Que livro você diz que a Ana comprou?", "Que prato você não sabe como preparar?"] }, fr: { examples: ["Quel livre dis-tu qu’Ana a acheté ?", "Quel plat ne sais-tu pas comment préparer ?"] }, de: { examples: ["Welches Buch, sagst du, hat Ana gekauft?", "Welches Gericht weißt du nicht zuzubereiten?"] }, it: { examples: ["Quale libro dici che ha comprato Ana?", "Quale piatto non sai come preparare?"] }, pl: { examples: ["Jaką książkę, mówisz, kupiła Ana?", "Jakiego dania nie wiesz, jak przyrządzić?"] }, tr: { examples: ["Ana hangi kitabı aldı diyorsun?", "Hangi yemeği nasıl hazırlayacağını bilmiyorsun?"] }, id: { examples: ["Buku apa yang kamu bilang dibeli Ana?", "Hidangan apa yang kamu tidak tahu cara menyiapkannya?"] }, vi: { examples: ["Bạn nói Ana đã mua cuốn sách nào?", "Món nào bạn không biết cách nấu?"] } }
          - level: C2
            structure: { es: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repite con sorpresa o reproche lo que dijo el otro"], en: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repeats what the other person said, with surprise or reproach"], uk: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " повторює зі здивуванням чи докором те, що сказав співрозмовник"], pt: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " repete, com surpresa ou reprovação, o que o outro disse"], fr: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " reprend avec surprise ou reproche ce que l’autre a dit"], de: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " wiederholt mit Überraschung oder Vorwurf, was der andere gesagt hat"], it: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " ripete con sorpresa o rimprovero ciò che ha detto l'altro"], pl: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " powtarza ze zdziwieniem lub wyrzutem to, co powiedział rozmówca"], tr: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " karşıdakinin söylediğini şaşkınlıkla ya da sitemle yineler"], id: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " mengulang dengan keterkejutan atau teguran apa yang dikatakan orang lain"], vi: [{ term: ["¿Cómo que ", { gap: true }, "?"] }, " lặp lại với vẻ ngạc nhiên hoặc trách móc điều người kia vừa nói"] }
            ex: { examples: [["¿", { target: Cómo que }, " no tienes tiempo?"], ["¿", { target: Cómo que }, " ya te vas?"]] }
            tr: { en: { examples: ["What do you mean, you have no time?", "What do you mean, you’re leaving already?"] }, uk: { examples: ["Як це в тебе немає часу?", "Як це ти вже йдеш?"] }, pt: { examples: ["Como assim, você não tem tempo?", "Como assim, você já vai embora?"] }, fr: { examples: ["Comment ça, tu n’as pas le temps ?", "Comment ça, tu pars déjà ?"] }, de: { examples: ["Wie, du hast keine Zeit?", "Wie, du gehst schon?"] }, it: { examples: ["Come sarebbe a dire che non hai tempo?", "Come sarebbe a dire che te ne vai già?"] }, pl: { examples: ["Jak to, nie masz czasu?", "Jak to, już idziesz?"] }, tr: { examples: ["Nasıl yani, vaktin yok mu?", "Nasıl yani, şimdiden mi gidiyorsun?"] }, id: { examples: ["Maksudnya apa, kamu tidak punya waktu?", "Maksudnya apa, kamu sudah mau pergi?"] }, vi: { examples: ["Sao lại thế, bạn không có thời gian à?", "Sao lại thế, bạn đi ngay bây giờ à?"] } }
          - level: C2
            structure: { es: "pregunta retórica: el sentido es negativo y no espera respuesta", en: "rhetorical question: the meaning is negative and no answer is expected", uk: "риторичне питання: зміст негативний, відповіді не очікують", pt: "pergunta retórica: o sentido é negativo e não espera resposta", fr: "question rhétorique : le sens est négatif et elle n’attend pas de réponse", de: "rhetorische Frage: Der Sinn ist negativ, und es wird keine Antwort erwartet", it: "domanda retorica: il senso è negativo e non si aspetta risposta", pl: "pytanie retoryczne: sens jest przeczący i nie oczekuje odpowiedzi", tr: "retorik soru: anlamı olumsuzdur ve yanıt beklenmez", id: "pertanyaan retoris: maknanya negatif dan tidak mengharapkan jawaban", vi: "câu hỏi tu từ: nghĩa là phủ định và không mong đợi câu trả lời" }
            ex: { examples: [{ target: ¿Quién va a creer esa historia? }, { target: ¿Pero es que alguien puede vivir con tan poco? }] }
            tr: { en: { examples: ["Who is going to believe that story?", "But can anyone live on so little?"] }, uk: { examples: ["Хто повірить у цю історію?", "Та хіба хтось може обійтися таким малим?"] }, pt: { examples: ["Quem vai acreditar nessa história?", "Mas será que alguém consegue viver com tão pouco?"] }, fr: { examples: ["Qui va croire cette histoire ?", "Mais est-ce que quelqu’un peut vivre avec si peu ?"] }, de: { examples: ["Wer soll diese Geschichte glauben?", "Aber kann überhaupt jemand von so wenig leben?"] }, it: { examples: ["Chi crederà mai a questa storia?", "Ma è possibile che qualcuno viva con così poco?"] }, pl: { examples: ["Kto uwierzy w tę historię?", "Ale czy ktoś może żyć za tak mało?"] }, tr: { examples: ["Bu hikâyeye kim inanır?", "Ama biri bu kadar az şeyle yaşayabilir mi?"] }, id: { examples: ["Siapa yang akan percaya cerita itu?", "Tapi apakah ada orang yang bisa hidup dengan begitu sedikit?"] }, vi: { examples: ["Ai mà tin câu chuyện đó?", "Nhưng có ai sống nổi với ít ỏi như vậy không?"] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every question word carries a written accent and opens its question."
              es: "Todo interrogativo lleva tilde y abre su pregunta."
              uk: "Кожне питальне слово пишеться зі знаком наголосу і стоїть на початку питання."
              pt: "Todo interrogativo leva acento gráfico e abre a sua pergunta."
              fr: "Tout mot interrogatif porte un accent écrit et ouvre sa question."
              de: "Jedes Fragewort trägt einen Akzent und eröffnet seine Frage."
              it: "Ogni parola interrogativa porta l'accento scritto e apre la sua domanda."
              pl: "Każdy zaimek pytajny ma akcent pisany i otwiera pytanie."
              tr: "Her soru sözcüğü yazıda vurgu işareti taşır ve sorusunu açar."
              id: "Setiap kata tanya memakai tanda aksen dan membuka pertanyaannya."
              vi: "Mọi từ để hỏi đều có dấu sắc và mở đầu câu hỏi của nó."
          - type: rule
            level: A1
            text:
              en: [{ term: cuánto }, " agrees with its noun: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              es: [{ term: cuánto }, " concuerda con su sustantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              uk: [{ term: "cuánto" }, " узгоджується зі своїм іменником: ", { alternatives: [{ term: "cuántos años" }, { term: "cuántas hermanas" }] }, "."]
              pt: [{ term: cuánto }, " concorda com o seu substantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              fr: [{ term: cuánto }, " s’accorde avec son nom : ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              de: [{ term: cuánto }, " richtet sich nach seinem Nomen: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              it: [{ term: cuánto }, " concorda con il suo sostantivo: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              pl: [{ term: cuánto }, " zgadza się ze swoim rzeczownikiem: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              tr: [{ term: cuánto }, " isminle uyum sağlar: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              id: [{ term: cuánto }, " menyesuaikan dengan kata bendanya: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
              vi: [{ term: cuánto }, " hòa hợp với danh từ của nó: ", { alternatives: [{ term: cuántos años }, { term: cuántas hermanas }] }, "."]
          - type: rule
            level: A1
            text:
              en: "A preposition goes before the question word, at the start of the question:"
              es: "La preposición va delante del interrogativo, al principio de la pregunta:"
              uk: "Прийменник стоїть перед питальним словом, на початку питання:"
              pt: "A preposição vem antes da palavra interrogativa, no início da pergunta:"
              fr: "La préposition se place devant le mot interrogatif, au début de la question :"
              de: "Die Präposition steht vor dem Fragewort, am Anfang der Frage:"
              it: "La preposizione sta davanti alla parola interrogativa, all'inizio della domanda:"
              pl: "Przyimek stoi przed zaimkiem pytajnym, na początku pytania:"
              tr: "Edat, soru sözcüğünün önünde, sorunun başında yer alır:"
              id: "Kata depan berada sebelum kata tanya, di awal pertanyaan:"
              vi: "Giới từ đứng trước từ để hỏi, ở đầu câu hỏi:"
            ex: { examples: [["¿", { target: Con quién }, " trabajas?"], ["¿", { target: A quién }, " llamas?"]] }
