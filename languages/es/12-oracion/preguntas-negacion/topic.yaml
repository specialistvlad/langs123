          rule: { es: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " valora un hecho"], en: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " judges a fact"], uk: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " оцінює факт"], pt: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " avalia um fato"], fr: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " juge un fait"], de: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " bewertet eine Tatsache"], it: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " valuta un fatto"], pl: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " ocenia fakt"], tr: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " bir olguyu değerlendirir"], id: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " menilai suatu fakta"], vi: [{ pattern: [{ term: qué }, { alternatives: [{ slot: adjective }, { slot: adverb }] }, { term: que }, { slot: clause }] }, " đánh giá một sự việc"] }
          ex: ["¡", { target: Qué bien que }, " ya estés en casa!"]
          tr: { en: "How good that you’re home already!", uk: "Як добре, що ти вже вдома!", pt: "Que bom que você já está em casa!", fr: "Comme c’est bien que tu sois déjà à la maison !", de: "Wie schön, dass du schon zu Hause bist!", it: "Che bello che tu sia già a casa!", pl: "Jak dobrze, że już jesteś w domu!", tr: "İyi ki artık evdesin!", id: "Syukurlah kamu sudah ada di rumah!", vi: "Tốt quá, bạn đã ở nhà rồi!" }
