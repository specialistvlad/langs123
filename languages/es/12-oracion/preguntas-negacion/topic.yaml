sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A question is marked at both ends: ", { letter: ¿ }, " at the start, ", { letter: "?" }, " at the end."]
              es: ["Una pregunta se marca en los dos extremos: ", { letter: ¿ }, " al principio, ", { letter: "?" }, " al final."]
              uk: ["Питання позначають з обох боків: ", { letter: "¿" }, " на початку, ", { letter: "?" }, " у кінці."]
              pt: ["Uma pergunta é marcada nas duas pontas: ", { letter: ¿ }, " no início, ", { letter: "?" }, " no fim."]
              fr: ["Une question est marquée aux deux extrémités : ", { letter: ¿ }, " au début, ", { letter: "?" }, " à la fin."]
              de: ["Eine Frage wird an beiden Enden markiert: ", { letter: ¿ }, " am Anfang, ", { letter: "?" }, " am Ende."]
              it: ["Una domanda è segnalata a entrambe le estremità: ", { letter: ¿ }, " all'inizio, ", { letter: "?" }, " alla fine."]
              pl: ["Pytanie jest oznaczone na obu końcach: ", { letter: ¿ }, " na początku, ", { letter: "?" }, " na końcu."]
              tr: ["Soru iki uçtan işaretlenir: başta ", { letter: ¿ }, ", sonda ", { letter: "?" }, "."]
              id: ["Pertanyaan ditandai di kedua ujungnya: ", { letter: ¿ }, " di awal, ", { letter: "?" }, " di akhir."]
              vi: ["Câu hỏi được đánh dấu ở cả hai đầu: ", { letter: ¿ }, " ở đầu, ", { letter: "?" }, " ở cuối."]
          - type: rule
            level: A1
            text:
              en: "In a yes-no question, the voice rises at the end:"
              es: "En una pregunta de sí o no, la entonación sube al final:"
              uk: "У загальному питанні інтонація в кінці підвищується:"
              pt: "Em uma pergunta de sim ou não, a entonação sobe no final:"
              fr: "Dans une question fermée, la voix monte à la fin :"
              de: "In einer Ja-Nein-Frage steigt die Stimme am Ende:"
              it: "In una domanda sì/no, l'intonazione sale alla fine:"
              pl: "W pytaniu rozstrzygnięcia intonacja na końcu rośnie:"
              tr: "Evet-hayır sorusunda ses sonda yükselir:"
              id: "Pada pertanyaan ya atau tidak, intonasi naik di akhir:"
              vi: "Trong câu hỏi có/không, ngữ điệu lên cao ở cuối:"
            ex: ["¿Tienes hermanos? ", { intonation: rise }]
            tr: { en: "Have you got any brothers or sisters?", uk: "У тебе є брати чи сестри?", pt: "Você tem irmãos?", fr: "As-tu des frères et sœurs ?", de: "Hast du Geschwister?", it: "Hai fratelli o sorelle?", pl: "Czy masz rodzeństwo?", tr: "Kardeşin var mı?", id: "Apakah kamu punya saudara?", vi: "Bạn có anh chị em không?" }
          - type: note
            level: A1
            readers: [en]
            text:
              en: ["Spanish has no helper like English ", { l1: do }, ": the verb alone makes the question."]

  - title: { en: "Form: yes-no questions", es: "Forma: preguntas de sí o no", uk: "Форма: загальне питання", pt: "Forma: perguntas de sim ou não", fr: "Forme : questions fermées", de: "Form: Ja-Nein-Fragen", it: "Forma: domande sì/no", pl: "Forma: pytania rozstrzygnięcia", tr: "Biçim: evet-hayır soruları", id: "Bentuk: pertanyaan ya atau tidak", vi: "Dạng: câu hỏi có/không" }
    role: form
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question, es: Pregunta, uk: "Питання", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, question: { en: The order of a statement, es: El orden de una afirmación, uk: "Порядок слів розповідного речення", pt: "A ordem de uma afirmação", fr: "L’ordre d’une phrase affirmative", de: "Die Wortstellung einer Aussage", it: "L'ordine di un'affermazione", pl: "Szyk zdania oznajmującego", tr: "Olumlu cümlenin sözcük sırası", id: "Urutan kalimat pernyataan", vi: "Trật tự của câu khẳng định" }, ex: { target: ¿Hablas español? }, tr: { en: "Do you speak Spanish?", uk: "Ти говориш іспанською?", pt: "Você fala espanhol?", fr: "Parles-tu espagnol ?", de: "Sprichst du Spanisch?", it: "Parli spagnolo?", pl: "Czy mówisz po hiszpańsku?", tr: "İspanyolca konuşuyor musun?", id: "Apakah kamu berbicara bahasa Spanyol?", vi: "Bạn có nói tiếng Tây Ban Nha không?" } }
          - { level: A1, question: { en: With the subject first, es: Con el sujeto delante, uk: "З підметом на початку", pt: "Com o sujeito na frente", fr: "Avec le sujet devant", de: "Mit dem Subjekt am Anfang", it: "Con il soggetto davanti", pl: "Z podmiotem na początku", tr: "Özne başta", id: "Dengan subjek di depan", vi: "Có chủ ngữ đứng trước" }, ex: { target: ¿Ana vive aquí? }, tr: { en: "Does Ana live here?", uk: "Ана живе тут?", pt: "A Ana mora aqui?", fr: "Ana habite-t-elle ici ?", de: "Wohnt Ana hier?", it: "Ana abita qui?", pl: "Czy Ana mieszka tutaj?", tr: "Ana burada mı yaşıyor?", id: "Apakah Ana tinggal di sini?", vi: "Ana có sống ở đây không?" } }
          - level: A1
            question: { en: With the subject after the verb, es: Con el sujeto detrás del verbo, uk: "З підметом після дієслова", pt: "Com o sujeito depois do verbo", fr: "Avec le sujet après le verbe", de: "Mit dem Subjekt nach dem Verb", it: "Con il soggetto dopo il verbo", pl: "Z podmiotem po czasowniku", tr: "Özne fiilden sonra", id: "Dengan subjek setelah kata kerja", vi: "Có chủ ngữ đứng sau động từ" }
            ex: { examples: [{ target: ¿Vive Ana aquí? }, { target: ¿Habla usted inglés? }] }
