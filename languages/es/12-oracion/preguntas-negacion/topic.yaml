summary:
  lead:
    en: ["A question opens with ", { letter: ¿ }, " and closes with ", { letter: "?" }, ", and ", { term: no }, " before the verb makes a sentence negative."]
    es: ["Una pregunta se abre con ", { letter: ¿ }, " y se cierra con ", { letter: "?" }, ", y ", { term: no }, " delante del verbo hace negativa la oración."]
    uk: ["Питання починається знаком ", { letter: "¿" }, " і закінчується знаком ", { letter: "?" }, ", а ", { term: "no" }, " перед дієсловом робить речення заперечним."]
    pt: ["Uma pergunta se abre com ", { letter: ¿ }, " e se fecha com ", { letter: "?" }, ", e ", { term: no }, " antes do verbo torna a frase negativa."]
    fr: ["Une question s’ouvre avec ", { letter: ¿ }, " et se ferme avec ", { letter: "?" }, ", et ", { term: no }, " devant le verbe rend la phrase négative."]
    de: ["Eine Frage beginnt mit ", { letter: ¿ }, " und endet mit ", { letter: "?" }, ", und ", { term: no }, " vor dem Verb macht den Satz negativ."]
    it: ["Una domanda si apre con ", { letter: ¿ }, " e si chiude con ", { letter: "?" }, ", e ", { term: no }, " davanti al verbo rende negativa la frase."]
    pl: ["Pytanie zaczyna się od ", { letter: ¿ }, " i kończy na ", { letter: "?" }, ", a ", { term: no }, " przed czasownikiem tworzy zdanie przeczące."]
    tr: ["Bir soru ", { letter: ¿ }, " ile açılır, ", { letter: "?" }, " ile kapanır; fiilin önüne gelen ", { term: no }, " cümleyi olumsuz yapar."]
    id: ["Pertanyaan dibuka dengan ", { letter: ¿ }, " dan ditutup dengan ", { letter: "?" }, ", dan ", { term: no }, " di depan kata kerja membuat kalimat menjadi negatif."]
    vi: ["Câu hỏi mở đầu bằng ", { letter: ¿ }, " và kết thúc bằng ", { letter: "?" }, ", còn ", { term: no }, " đặt trước động từ làm câu trở nên phủ định."]
  rule:
    en: "A yes-no question keeps the word order of a statement; only the marks and the voice change:"
    es: "Una pregunta de sí o no mantiene el orden de una afirmación; solo cambian los signos y la entonación:"
    uk: "Загальне питання зберігає порядок слів розповідного речення; змінюються лише знаки та інтонація:"
    pt: "Uma pergunta de sim ou não mantém a ordem de uma afirmação; só mudam os sinais e a entonação:"
    fr: "Une question fermée garde l’ordre d’une phrase affirmative ; seuls les signes et l’intonation changent :"
    de: "Eine Ja-Nein-Frage behält die Wortstellung einer Aussage bei; nur die Zeichen und die Intonation ändern sich:"
    it: "Una domanda sì/no mantiene l'ordine di un'affermazione; cambiano solo i segni e l'intonazione:"
    pl: "Pytanie rozstrzygnięcia zachowuje szyk zdania oznajmującego; zmieniają się tylko znaki i intonacja:"
    tr: "Evet-hayır sorusu, olumlu cümlenin sözcük sırasını korur; yalnızca işaretler ve tonlama değişir:"
    id: "Pertanyaan ya atau tidak mempertahankan urutan kata kalimat pernyataan; hanya tanda dan intonasinya yang berubah:"
    vi: "Câu hỏi có/không giữ nguyên trật tự từ của câu khẳng định; chỉ có dấu câu và ngữ điệu thay đổi:"
  ex: { examples: ["Tienes hermanos.", { target: ¿Tienes hermanos? }] }

