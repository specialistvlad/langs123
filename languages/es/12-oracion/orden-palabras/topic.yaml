          - type: note
            level: B2
            text: { es: ["Las formas del pronombre átono: ver ", { link: El objeto directo y la a personal, to: es.pronombres.objeto-directo }, "."], en: ["The forms of the unstressed pronoun: see ", { link: "Direct Object Pronouns and Personal a", to: es.pronombres.objeto-directo }, "."], uk: ["Форми ненаголошеного займенника: див. ", { link: "Займенники прямого додатка й особове a", to: es.pronombres.objeto-directo }, "."], pt: ["As formas do pronome átono: veja ", { link: "Pronomes de objeto direto e o a pessoal", to: es.pronombres.objeto-directo }, "."], fr: ["Les formes du pronom atone : voir ", { link: "Pronoms COD et a personnel", to: es.pronombres.objeto-directo }, "."], de: ["Die Formen des unbetonten Pronomens: siehe ", { link: "Direkte Objektpronomen und das persönliche a", to: es.pronombres.objeto-directo }, "."], it: ["Le forme del pronome atono: vedi ", { link: "Pronomi complemento diretto e a personale", to: es.pronombres.objeto-directo }, "."], pl: ["Formy zaimka nieakcentowanego: zob. ", { link: "Zaimki dopełnienia bliższego i osobowe a", to: es.pronombres.objeto-directo }, "."], tr: ["Vurgusuz zamirin biçimleri: bkz. ", { link: "Doğrudan nesne zamirleri ve kişisel a", to: es.pronombres.objeto-directo }, "."], id: ["Bentuk kata ganti tanpa tekanan: lihat ", { link: "Kata ganti objek langsung dan a personal", to: es.pronombres.objeto-directo }, "."], vi: ["Các dạng của đại từ không nhấn: xem ", { link: "Đại từ tân ngữ trực tiếp và a chỉ người", to: es.pronombres.objeto-directo }, "."] }
          - type: note
            level: B2
            text: { es: ["El lugar del sujeto en las preguntas: ver ", { link: Preguntas y negación, to: es.oracion.preguntas-negacion }, "."], en: ["The place of the subject in questions: see ", { link: "Questions and Negatives", to: es.oracion.preguntas-negacion }, "."], uk: ["Місце підмета в питаннях: див. ", { link: "Питання і заперечення", to: es.oracion.preguntas-negacion }, "."], pt: ["O lugar do sujeito nas perguntas: veja ", { link: "Perguntas e negação", to: es.oracion.preguntas-negacion }, "."], fr: ["La place du sujet dans les questions : voir ", { link: "Questions et négation", to: es.oracion.preguntas-negacion }, "."], de: ["Die Stellung des Subjekts in Fragen: siehe ", { link: "Fragen und Verneinung", to: es.oracion.preguntas-negacion }, "."], it: ["Il posto del soggetto nelle domande: vedi ", { link: "Domande e negazione", to: es.oracion.preguntas-negacion }, "."], pl: ["Miejsce podmiotu w pytaniach: zob. ", { link: "Pytania i przeczenie", to: es.oracion.preguntas-negacion }, "."], tr: ["Öznenin sorulardaki yeri: bkz. ", { link: "Sorular ve olumsuzluk", to: es.oracion.preguntas-negacion }, "."], id: ["Posisi subjek dalam pertanyaan: lihat ", { link: "Pertanyaan dan negasi", to: es.oracion.preguntas-negacion }, "."], vi: ["Vị trí của chủ ngữ trong câu hỏi: xem ", { link: "Câu hỏi và phủ định", to: es.oracion.preguntas-negacion }, "."] }

  - title: { es: Foco, en: "Focus", uk: "Фокус", pt: "Foco", fr: "Focalisation", de: "Fokus", it: "Focalizzazione", pl: "Ognisko", tr: "Odak", id: "Fokus", vi: "Tiêu điểm" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { es: Patrón, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: meaning, label: { es: Valor, en: "Meaning", uk: "Значення", pt: "Valor", fr: "Valeur", de: "Bedeutung", it: "Valore", pl: "Znaczenie", tr: "Anlam", id: "Makna", vi: "Ý nghĩa" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            pattern: { es: "Objeto con acento de intensidad", en: "Object with emphatic stress", uk: "Додаток з емфатичним наголосом", pt: "Objeto com acento de intensidade", fr: "Objet avec accent d’intensité", de: "Objekt mit Intensitätsakzent", it: "Complemento con accento di intensità", pl: "Dopełnienie z akcentem emfatycznym", tr: "Vurgulu nesne", id: "Objek dengan tekanan penegas", vi: "Tân ngữ có trọng âm nhấn mạnh" }
            meaning: { es: "El objeto es el dato nuevo o el contraste, y no lleva pronombre átono.", en: "The object is the new information or the contrast, and takes no unstressed pronoun.", uk: "Додаток — це нова інформація або протиставлення, і ненаголошеного займенника немає.", pt: "O objeto é a informação nova ou o contraste, e não leva pronome átono.", fr: "L’objet est l’information nouvelle ou le contraste, et n’a pas de pronom atone.", de: "Das Objekt ist die neue Information oder der Kontrast und hat kein unbetontes Pronomen.", it: "Il complemento è l’informazione nuova o il contrasto, e non ha il pronome atono.", pl: "Dopełnienie to nowa informacja lub kontrast i nie ma zaimka nieakcentowanego.", tr: "Nesne yeni bilgiyi ya da karşıtlığı verir ve vurgusuz zamir almaz.", id: "Objek adalah informasi baru atau kontras, dan tidak memakai kata ganti tanpa tekanan.", vi: "Tân ngữ là thông tin mới hoặc sự đối lập, và không có đại từ không nhấn." }
            ex: { examples: [[{ target: "UNOS LIBROS" }, " quiere Juan."], [{ target: "UNA CASA" }, " busca mi hermana."]] }
            tr: { en: { examples: ["Juan wants BOOKS.", "My sister is looking for A HOUSE."] }, uk: { examples: ["Хуан хоче КНИЖКИ.", "Моя сестра шукає БУДИНОК."] }, pt: { examples: ["O Juan quer LIVROS.", "Minha irmã procura UMA CASA."] }, fr: { examples: ["Juan veut des LIVRES.", "Ma sœur cherche UNE MAISON."] }, de: { examples: ["Juan will BÜCHER.", "Meine Schwester sucht EIN HAUS."] }, it: { examples: ["Juan vuole dei LIBRI.", "Mia sorella cerca UNA CASA."] }, pl: { examples: ["Juan chce KSIĄŻEK.", "Moja siostra szuka DOMU."] }, tr: { examples: ["Juan KİTAP istiyor.", "Kız kardeşim EV arıyor."] }, id: { examples: ["Juan mau BUKU.", "Saudari saya mencari RUMAH."] }, vi: { examples: ["Juan muốn SÁCH.", "Chị gái tôi đang tìm MỘT CĂN NHÀ."] } }
          - level: C2
            pattern: { es: "Objeto con un verbo de deseo", en: "Object with a verb of wanting", uk: "Додаток із дієсловом бажання", pt: "Objeto com um verbo de desejo", fr: "Objet avec un verbe de désir", de: "Objekt mit einem Verb des Wünschens", it: "Complemento con un verbo di desiderio", pl: "Dopełnienie z czasownikiem pragnienia", tr: "İstek bildiren fiille nesne", id: "Objek dengan kata kerja keinginan", vi: "Tân ngữ với động từ chỉ mong muốn" }
            meaning: { es: "El objeto antepuesto expresa el deseo de algo que otro tiene.", en: "The fronted object expresses the wish for something another person has.", uk: "Додаток на початку речення виражає бажання мати те, що є в іншого.", pt: "O objeto antecipado expressa o desejo de algo que outra pessoa tem.", fr: "L’objet antéposé exprime le désir d’avoir ce qu’un autre possède.", de: "Das vorangestellte Objekt drückt den Wunsch nach etwas aus, das ein anderer hat.", it: "Il complemento anticipato esprime il desiderio di qualcosa che ha un altro.", pl: "Wysunięte dopełnienie wyraża chęć posiadania czegoś, co ma ktoś inny.", tr: "Öne alınan nesne, başkasında olan bir şeyi isteme dileğini anlatır.", id: "Objek yang didahulukan menyatakan keinginan atas sesuatu yang dimiliki orang lain.", vi: "Tân ngữ đưa lên đầu diễn tả mong muốn có thứ mà người khác có." }
            ex: { examples: [[{ target: "Ese sueldo" }, " quisiera yo."], [{ target: "Esa suerte" }, " quisiera yo."]] }
            tr: { en: { examples: ["I wish I had that salary.", "I wish I had that luck."] }, uk: { examples: ["Мені б таку зарплату.", "Мені б таке щастя."] }, pt: { examples: ["Esse salário eu queria ter.", "Essa sorte eu queria ter."] }, fr: { examples: ["Ce salaire, j’aimerais bien l’avoir.", "Cette chance, j’aimerais bien l’avoir."] }, de: { examples: ["So ein Gehalt hätte ich gern.", "So ein Glück hätte ich gern."] }, it: { examples: ["Vorrei avere io quello stipendio.", "Vorrei avere io quella fortuna."] }, pl: { examples: ["Takiej pensji to ja bym chciał.", "Takiego szczęścia to ja bym chciał."] }, tr: { examples: ["Keşke o maaşa ben sahip olsam.", "Keşke o şansa ben sahip olsam."] }, id: { examples: ["Saya ingin punya gaji seperti itu.", "Saya ingin punya keberuntungan seperti itu."] }, vi: { examples: ["Tôi ước gì có mức lương đó.", "Tôi ước gì có được may mắn đó."] } }
          - level: C2
            pattern: { es: "Cuantificador antepuesto", en: "Fronted quantifier", uk: "Слово кількості на початку речення", pt: "Quantificador antecipado", fr: "Quantificateur antéposé", de: "Vorangestelltes Mengenwort", it: "Quantificatore anticipato", pl: "Wysunięty określnik ilości", tr: "Öne alınan miktar sözcüğü", id: "Kata penunjuk jumlah yang didahulukan", vi: "Lượng từ đưa lên đầu" }
            meaning: { es: "Valora la cantidad, a menudo con reproche, y el sujeto va detrás.", en: "It evaluates the amount, often with reproach, and the subject comes after.", uk: "Оцінює кількість, часто з докором, а підмет стоїть після дієслова.", pt: "Avalia a quantidade, muitas vezes com reprovação, e o sujeito vai depois.", fr: "Il juge la quantité, souvent avec reproche, et le sujet vient après.", de: "Es bewertet die Menge, oft vorwurfsvoll, und das Subjekt folgt danach.", it: "Valuta la quantità, spesso con rimprovero, e il soggetto va dopo.", pl: "Ocenia ilość, często z wyrzutem, a podmiot stoi dalej.", tr: "Miktarı değerlendirir, çoğu zaman sitemle; özne sonra gelir.", id: "Menilai jumlah, sering dengan nada teguran, dan subjek berada di belakang.", vi: "Đánh giá số lượng, thường với ý trách móc, và chủ ngữ đứng sau." }
            ex: { examples: [[{ target: "Mucho pides" }, " tú."], [{ target: "Mucho hablas" }, " tú."]] }
            tr: { en: { examples: ["You ask for a lot.", "You talk a lot."] }, uk: { examples: ["Ти забагато просиш.", "Ти забагато говориш."] }, pt: { examples: ["Você pede demais.", "Você fala demais."] }, fr: { examples: ["Tu en demandes beaucoup.", "Tu parles beaucoup."] }, de: { examples: ["Du verlangst viel.", "Du redest viel."] }, it: { examples: ["Chiedi molto, tu.", "Parli molto, tu."] }, pl: { examples: ["Dużo wymagasz.", "Dużo mówisz."] }, tr: { examples: ["Çok şey istiyorsun.", "Çok konuşuyorsun."] }, id: { examples: ["Kamu banyak meminta.", "Kamu banyak bicara."] }, vi: { examples: ["Bạn đòi hỏi nhiều quá.", "Bạn nói nhiều quá."] } }
          - level: C2
            pattern: { pattern: [{ slot: adverb }, { slot: { es: pregunta, en: "question", uk: "питання", pt: "pergunta", fr: "question", de: "Frage", it: "domanda", pl: "pytanie", tr: "soru", id: "pertanyaan", vi: "câu hỏi" } }] }
            meaning: { es: "Un adverbio de lugar o de tiempo abre la pregunta y fija el marco.", en: "An adverb of place or time opens the question and sets the frame.", uk: "Прислівник місця або часу відкриває питання і задає рамку.", pt: "Um advérbio de lugar ou de tempo abre a pergunta e fixa o quadro.", fr: "Un adverbe de lieu ou de temps ouvre la question et pose le cadre.", de: "Ein Orts- oder Zeitadverb eröffnet die Frage und setzt den Rahmen.", it: "Un avverbio di luogo o di tempo apre la domanda e fissa la cornice.", pl: "Przysłówek miejsca lub czasu otwiera pytanie i ustala ramę.", tr: "Yer ya da zaman zarfı soruyu açar ve çerçeveyi belirler.", id: "Kata keterangan tempat atau waktu membuka pertanyaan dan menetapkan kerangka.", vi: "Trạng từ chỉ nơi chốn hoặc thời gian mở đầu câu hỏi và đặt khung." }
            ex: { examples: [[{ target: Aquí }, ", ¿vas a trabajar?"], [{ target: Mañana }, ", ¿te quedas en casa?"]] }
            tr: { en: { examples: ["Are you going to work here?", "Are you staying at home tomorrow?"] }, uk: { examples: ["Ти тут будеш працювати?", "Завтра ти залишишся вдома?"] }, pt: { examples: ["Aqui, você vai trabalhar?", "Amanhã, você fica em casa?"] }, fr: { examples: ["Ici, tu vas travailler ?", "Demain, tu restes à la maison ?"] }, de: { examples: ["Wirst du hier arbeiten?", "Bleibst du morgen zu Hause?"] }, it: { examples: ["Qui, lavorerai?", "Domani, resti a casa?"] }, pl: { examples: ["Tutaj będziesz pracować?", "Jutro zostajesz w domu?"] }, tr: { examples: ["Burada mı çalışacaksın?", "Yarın evde mi kalıyorsun?"] }, id: { examples: ["Kamu akan bekerja di sini?", "Besok kamu tinggal di rumah?"] }, vi: { examples: ["Bạn sẽ làm việc ở đây à?", "Ngày mai bạn ở nhà à?"] } }
      - type: list
        items:
          - type: note
            level: C2
            text: { es: "Las mayúsculas marcan el acento de intensidad del foco.", en: "Capital letters mark the emphatic stress of the focus.", uk: "Великі літери позначають емфатичний наголос фокусу.", pt: "As maiúsculas marcam o acento de intensidade do foco.", fr: "Les majuscules marquent l’accent d’intensité de l’élément focalisé.", de: "Großbuchstaben markieren den Intensitätsakzent des Fokus.", it: "Le maiuscole segnalano l’accento di intensità del focus.", pl: "Wielkie litery oznaczają akcent emfatyczny ogniska.", tr: "Büyük harfler odağın vurgusunu gösterir.", id: "Huruf kapital menandai tekanan penegas pada fokus.", vi: "Chữ in hoa đánh dấu trọng âm nhấn mạnh của tiêu điểm." }

  - title: { es: Orden enfático, en: "Emphatic order", uk: "Емфатичний порядок слів", pt: "Ordem enfática", fr: "Ordre emphatique", de: "Emphatische Wortstellung", it: "Ordine enfatico", pl: "Szyk emfatyczny", tr: "Vurgulu sıra", id: "Urutan penekanan", vi: "Trật tự nhấn mạnh" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { es: Patrón, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: meaning, label: { es: Valor, en: "Meaning", uk: "Значення", pt: "Valor", fr: "Valeur", de: "Bedeutung", it: "Valore", pl: "Znaczenie", tr: "Anlam", id: "Makna", vi: "Ý nghĩa" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            pattern: { pattern: [{ term: bonito }, { slot: noun }] }
            meaning: { es: "Ironía: la frase valora lo contrario de lo que dice.", en: "Irony: the sentence judges the opposite of what it says.", uk: "Іронія: речення оцінює протилежне тому, що говорить.", pt: "Ironia: a frase avalia o contrário do que diz.", fr: "Ironie : la phrase évalue le contraire de ce qu’elle dit.", de: "Ironie: Der Satz bewertet das Gegenteil von dem, was er sagt.", it: "Ironia: la frase valuta il contrario di ciò che dice.", pl: "Ironia: zdanie ocenia coś przeciwnego niż to, co mówi.", tr: "İroni: cümle söylediğinin tersini değerlendirir.", id: "Ironi: kalimat menilai kebalikan dari yang diucapkannya.", vi: "Mỉa mai: câu đánh giá điều ngược lại với những gì nó nói." }
            ex: ["En ", { target: "bonito lío" }, " me has metido."]
            tr: { en: "You’ve got me into a fine mess.", uk: "У гарну халепу ти мене втягнув.", pt: "Você me meteu numa bela encrenca.", fr: "Tu m’as mis dans un joli pétrin.", de: "In eine schöne Klemme hast du mich gebracht.", it: "Mi hai messo in un bel guaio.", pl: "Ładnie mnie wpakowałeś w kłopoty.", tr: "Beni güzel bir belaya soktun.", id: "Bagus sekali, kamu menjerumuskan saya ke dalam masalah.", vi: "Bạn đẩy tôi vào rắc rối hay ho đấy." }
          - level: C2
            pattern: { pattern: [{ term: vaya }, { slot: noun }, { optional: que }, { slot: clause }] }
            meaning: { es: "Admiración o crítica ante lo que nombra el sustantivo.", en: "Admiration or criticism of what the noun names.", uk: "Захоплення або критика щодо того, що називає іменник.", pt: "Admiração ou crítica diante do que o substantivo nomeia.", fr: "Admiration ou critique devant ce que désigne le nom.", de: "Bewunderung oder Kritik an dem, was das Nomen nennt.", it: "Ammirazione o critica per ciò che nomina il sostantivo.", pl: "Podziw lub krytyka wobec tego, co nazywa rzeczownik.", tr: "İsmin adlandırdığı şeye duyulan hayranlık ya da eleştiri.", id: "Kekaguman atau kritik terhadap hal yang disebut kata benda.", vi: "Sự ngưỡng mộ hoặc chê trách trước điều mà danh từ gọi tên." }
            ex: [{ target: "Vaya casa" }, " ", { optional: que }, " tiene tu tío."]
            tr: { en: "What a house your uncle has!", uk: "Який будинок у твого дядька!", pt: "Que casa seu tio tem!", fr: "Quelle maison il a, ton oncle !", de: "Was für ein Haus dein Onkel hat!", it: "Che casa ha tuo zio!", pl: "Ale dom ma twój wujek!", tr: "Amcanın ne evi varmış!", id: "Wah, rumah paman kamu itu!", vi: "Chú bạn có một ngôi nhà ghê thật!" }
          - level: C2
            pattern: { pattern: [{ term: menudo }, { slot: noun }, { slot: verb }] }
            meaning: { es: "Ponderación, para bien o para mal, de lo que nombra el sustantivo.", en: "A strong judgement, good or bad, of what the noun names.", uk: "Сильна оцінка, добра чи погана, того, що називає іменник.", pt: "Ponderação, para o bem ou para o mal, do que o substantivo nomeia.", fr: "Appréciation forte, en bien ou en mal, de ce que désigne le nom.", de: "Starke Bewertung, im Guten wie im Schlechten, dessen, was das Nomen nennt.", it: "Valutazione intensa, in bene o in male, di ciò che nomina il sostantivo.", pl: "Mocna ocena, dobra lub zła, tego, co nazywa rzeczownik.", tr: "İsmin adlandırdığı şeyin iyi ya da kötü yönde güçlü biçimde değerlendirilmesi.", id: "Penilaian yang kuat, baik atau buruk, terhadap hal yang disebut kata benda.", vi: "Sự đánh giá mạnh, tốt hay xấu, về điều mà danh từ gọi tên." }
            ex: [{ target: "Menudo reloj" }, " se compró tu primo."]
            tr: { en: "What a watch your cousin bought himself!", uk: "Який годинник собі купив твій двоюрідний брат!", pt: "Que relógio seu primo comprou!", fr: "Quelle montre ton cousin s’est achetée !", de: "Was für eine Uhr dein Cousin sich da gekauft hat!", it: "Che orologio si è comprato tuo cugino!", pl: "Jaki zegarek sobie kupił twój kuzyn!", tr: "Kuzenin kendine ne saat almış!", id: "Wah, jam tangan yang dibeli sepupumu!", vi: "Anh họ bạn mua một chiếc đồng hồ ra trò!" }
          - level: C2
            pattern: { pattern: [{ term: lo que }, { slot: clause }, { term: ser }, { slot: noun }] }
            meaning: { es: "El atributo, lo más importante, va al final tras el verbo ser.", en: "The complement, the key information, comes last after the verb ser.", uk: "Іменна частина присудка, найважливіше, стоїть у кінці після дієслова ser.", pt: "O predicativo, o mais importante, vai no fim, depois do verbo ser.", fr: "L’attribut, l’élément le plus important, se place à la fin après le verbe ser.", de: "Das Prädikativ, das Wichtigste, steht am Ende nach dem Verb ser.", it: "Il predicativo, la cosa più importante, va in fondo dopo il verbo ser.", pl: "Orzecznik, najważniejszy element, stoi na końcu po czasowniku ser.", tr: "Yüklem, yani en önemli öge, sonda ser fiilinden sonra gelir.", id: "Pelengkap, bagian terpenting, berada di akhir setelah kata kerja ser.", vi: "Bổ ngữ, phần quan trọng nhất, đứng ở cuối sau động từ ser." }
            ex: ["Lo que tú eres ", { target: es }, " un egoísta."]
            tr: { en: "What you are is a selfish person.", uk: "Ти просто егоїст.", pt: "O que você é é um egoísta.", fr: "Ce que tu es, c’est un égoïste.", de: "Was du bist, ist ein Egoist.", it: "Quello che sei è un egoista.", pl: "Jesteś po prostu egoistą.", tr: "Sen düpedüz bir bencilsin.", id: "Kamu ini benar-benar egois.", vi: "Bạn đúng là một kẻ ích kỷ." }
          - level: C2
            pattern: { pattern: [{ term: quien }, { slot: clause }, { term: ser }, { slot: person }] }
            meaning: { es: "El verbo ser concuerda con el pronombre que va al final.", en: "The verb ser agrees with the pronoun at the end.", uk: "Дієслово ser узгоджується із займенником у кінці.", pt: "O verbo ser concorda com o pronome que vai no fim.", fr: "Le verbe ser s’accorde avec le pronom placé à la fin.", de: "Das Verb ser richtet sich nach dem Pronomen am Ende.", it: "Il verbo ser concorda con il pronome in fondo.", pl: "Czasownik ser zgadza się z zaimkiem na końcu.", tr: "ser fiili, sondaki zamirle uyum sağlar.", id: "Kata kerja ser sesuai dengan kata ganti di akhir.", vi: "Động từ ser hòa hợp với đại từ ở cuối." }
            ex: ["Quien es un egoísta ", { target: eres }, " tú."]
            tr: { en: "The one who is selfish is you.", uk: "Егоїст — це ти.", pt: "Quem é egoísta é você.", fr: "Celui qui est égoïste, c’est toi.", de: "Wer ein Egoist ist, bist du.", it: "Chi è egoista sei tu.", pl: "Egoistą jesteś ty.", tr: "Bencil olan sensin.", id: "Orang yang egois itu kamu.", vi: "Người ích kỷ chính là bạn." }
          - level: C2
            pattern: { pattern: [{ term: ser }, { slot: { es: foco, en: "focus", uk: "фокус", pt: "foco", fr: "focalisation", de: "Fokus", it: "focalizzazione", pl: "ognisko", tr: "odak", id: "fokus", vi: "tiêu điểm" } }, { alternatives: [{ term: donde }, { term: cuando }, { term: como }] }, { slot: clause }] }
            meaning: { es: "El foco, con acento, va entre el verbo ser y el relativo.", en: "The focus, with stress, goes between the verb ser and the relative.", uk: "Фокус, з наголосом, стоїть між дієсловом ser і відносним словом.", pt: "O foco, com acento, vai entre o verbo ser e o relativo.", fr: "L’élément focalisé, accentué, se place entre le verbe ser et le relatif.", de: "Der Fokus steht mit Betonung zwischen dem Verb ser und dem Relativwort.", it: "Il focus, con l’accento, va tra il verbo ser e il relativo.", pl: "Ognisko, z akcentem, stoi między czasownikiem ser a wyrazem względnym.", tr: "Odak, vurgulu olarak, ser fiili ile ilgi sözcüğünün arasına gelir.", id: "Fokus, dengan tekanan, berada di antara kata kerja ser dan kata relatif.", vi: "Tiêu điểm, có trọng âm, đứng giữa động từ ser và từ quan hệ." }
            ex: { examples: [["Es ", { target: ALLÍ }, " donde te dije."], ["Fue ", { target: AYER }, " cuando llamó Luis."]] }
            tr: { en: { examples: ["It’s THERE where I told you.", "It was YESTERDAY when Luis called."] }, uk: { examples: ["Це саме ТАМ, де я тобі казав.", "Це було ВЧОРА, коли дзвонив Луїс."] }, pt: { examples: ["É LÁ onde eu te disse.", "Foi ONTEM que o Luis ligou."] }, fr: { examples: ["C’est LÀ, là où je t’ai dit.", "C’est HIER que Luis a appelé."] }, de: { examples: ["Es ist DORT, wo ich es dir gesagt habe.", "Es war GESTERN, als Luis anrief."] }, it: { examples: ["È LÌ, dove ti ho detto.", "È stato IERI che ha telefonato Luis."] }, pl: { examples: ["To TAM, gdzie ci powiedziałem.", "To było WCZORAJ, kiedy zadzwonił Luis."] }, tr: { examples: ["Sana söylediğim yer ORASI.", "Luis’in aradığı gün DÜNDÜ."] }, id: { examples: ["Tempatnya di SANA, seperti yang saya katakan.", "Luis menelepon KEMARIN."] }, vi: { examples: ["Chính Ở ĐÓ là nơi tôi đã nói với bạn.", "Chính HÔM QUA là lúc Luis gọi."] } }
          - level: C2
            pattern: { pattern: [{ term: el que }, { slot: { es: cuantificador, en: "quantifier", uk: "слово кількості", pt: "quantificador", fr: "quantificateur", de: "Mengenwort", it: "quantificatore", pl: "określnik ilości", tr: "miktar sözcüğü", id: "kata penunjuk jumlah", vi: "lượng từ" } }, { slot: noun }, { slot: verb }] }
            meaning: { es: "En un superlativo con relativo, el elemento cuantificado puede ir delante del verbo.", en: "In a superlative with a relative, the quantified element can go before the verb.", uk: "У найвищому ступені з відносним словом кількісно визначений елемент може стояти перед дієсловом.", pt: "Num superlativo com relativo, o elemento quantificado pode ir antes do verbo.", fr: "Dans un superlatif avec relatif, l’élément quantifié peut se placer avant le verbe.", de: "Bei einem Superlativ mit Relativsatz kann das quantifizierte Element vor dem Verb stehen.", it: "In un superlativo con relativo, l’elemento quantificato può andare prima del verbo.", pl: "W stopniu najwyższym z wyrazem względnym określany ilościowo element może stać przed czasownikiem.", tr: "İlgi sözcüklü bir üstünlük yapısında, miktarı belirtilen öge fiilin önüne gelebilir.", id: "Dalam superlatif dengan kata relatif, unsur yang dikuantifikasi dapat berada di depan kata kerja.", vi: "Trong so sánh nhất có từ quan hệ, thành phần được định lượng có thể đứng trước động từ." }
            ex: { equivalence: [["el cantante que ", { target: "más aplausos" }, " obtuvo"], ["el cantante que obtuvo ", { target: "más aplausos" }]] }
            tr: { en: { equivalence: ["the singer who got the most applause", "the singer who received the most applause"] }, uk: { equivalence: ["співак, який найбільше оплесків отримав", "співак, який отримав найбільше оплесків"] }, pt: { equivalence: ["o cantor que mais aplausos recebeu", "o cantor que recebeu mais aplausos"] }, fr: { equivalence: ["le chanteur qui a reçu le plus d’applaudissements", "le chanteur qui a obtenu le plus d’applaudissements"] }, de: { equivalence: ["der Sänger, der den meisten Applaus bekam", "der Sänger, der den meisten Applaus erhielt"] }, it: { equivalence: ["il cantante che più applausi ha ottenuto", "il cantante che ha ottenuto più applausi"] }, pl: { equivalence: ["piosenkarz, który najwięcej braw otrzymał", "piosenkarz, który otrzymał najwięcej braw"] }, tr: { equivalence: ["en çok alkışı alan şarkıcı", "en çok alkış alan şarkıcı"] }, id: { equivalence: ["penyanyi yang paling banyak mendapat tepuk tangan", "penyanyi yang mendapat paling banyak tepuk tangan"] }, vi: { equivalence: ["ca sĩ được nhiều tràng vỗ tay nhất", "ca sĩ nhận được nhiều tràng vỗ tay nhất"] } }
      - type: list
        items:
          - type: note
            level: C2
            text: { es: ["Las oraciones de relativo y el modo de la subordinada: ver ", { link: Las oraciones de relativo, to: es.oracion.relativas }, "."], en: ["Relative clauses and the mood of the subordinate clause: see ", { link: "Relative Clauses", to: es.oracion.relativas }, "."], uk: ["Означальні підрядні речення і спосіб підрядної частини: див. ", { link: "Означальні підрядні речення", to: es.oracion.relativas }, "."], pt: ["As orações relativas e o modo da subordinada: veja ", { link: "As orações relativas", to: es.oracion.relativas }, "."], fr: ["Les propositions relatives et le mode de la subordonnée : voir ", { link: "Les propositions relatives", to: es.oracion.relativas }, "."], de: ["Die Relativsätze und der Modus des Nebensatzes: siehe ", { link: "Die Relativsätze", to: es.oracion.relativas }, "."], it: ["Le proposizioni relative e il modo della subordinata: vedi ", { link: "Le proposizioni relative", to: es.oracion.relativas }, "."], pl: ["Zdania względne i tryb zdania podrzędnego: zob. ", { link: "Zdania względne", to: es.oracion.relativas }, "."], tr: ["İlgi cümleleri ve yan cümlenin kipi: bkz. ", { link: "İlgi cümleleri", to: es.oracion.relativas }, "."], id: ["Klausa relatif dan modus anak kalimat: lihat ", { link: "Klausa relatif", to: es.oracion.relativas }, "."], vi: ["Mệnh đề quan hệ và thức của mệnh đề phụ: xem ", { link: "Mệnh đề quan hệ", to: es.oracion.relativas }, "."] }

  - title: { es: Errores frecuentes, en: "Typical errors", uk: "Типові помилки", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
    role: errors
    content:
      - type: errors
        rows:
          - level: B2
            wrong: "Los libros tiene Juan."
            right: [{ target: "Los libros los tiene" }, " Juan."]
            rule: { es: "un objeto conocido antepuesto se recoge con el pronombre átono", en: "a known fronted object is picked up by the unstressed pronoun", uk: "відомий додаток на початку речення підхоплює ненаголошений займенник", pt: "um objeto conhecido antecipado é retomado pelo pronome átono", fr: "un objet connu antéposé est repris par le pronom atone", de: "ein bekanntes vorangestelltes Objekt wird durch das unbetonte Pronomen aufgenommen", it: "un complemento noto anticipato è ripreso dal pronome atono", pl: "znane dopełnienie wysunięte na początek podejmuje zaimek nieakcentowany", tr: "öne alınan bilinen nesne vurgusuz zamirle yeniden anılır", id: "objek yang sudah dikenal dan didahulukan dirujuk kembali oleh kata ganti tanpa tekanan", vi: "tân ngữ đã biết đưa lên đầu được đại từ không nhấn nhắc lại" }
          - level: B2
            wrong: "¿Qué regalo lo has comprado?"
            right: ["¿", { target: "Qué regalo has comprado" }, "?"]
            rule: { es: "con el objeto interrogativo delante, no hay pronombre átono", en: "with a question word as the object in front, there is no unstressed pronoun", uk: "коли питальний додаток стоїть попереду, ненаголошеного займенника немає", pt: "com o objeto interrogativo na frente, não há pronome átono", fr: "quand l’objet interrogatif est en tête, il n’y a pas de pronom atone", de: "steht das Fragewort als Objekt vorn, gibt es kein unbetontes Pronomen", it: "con il complemento interrogativo davanti, non c’è il pronome atono", pl: "gdy pytające dopełnienie stoi na początku, nie ma zaimka nieakcentowanego", tr: "soru sözcüğü olan nesne başta olduğunda vurgusuz zamir yoktur", id: "dengan objek berupa kata tanya di depan, tidak ada kata ganti tanpa tekanan", vi: "khi tân ngữ nghi vấn đứng đầu, không có đại từ không nhấn" }
          - level: B2
            wrong: "Trenes han llegado a la estación."
            right: [{ target: "Han llegado trenes" }, " a la estación."]
            rule: { es: "el sujeto sin determinante va detrás del verbo", en: "a subject without a determiner goes after the verb", uk: "підмет без детермінатива стоїть після дієслова", pt: "o sujeito sem determinante vai depois do verbo", fr: "le sujet sans déterminant se place après le verbe", de: "ein Subjekt ohne Begleiter steht nach dem Verb", it: "il soggetto senza determinante va dopo il verbo", pl: "podmiot bez określnika stoi po czasowniku", tr: "belirleyicisiz özne fiilden sonra gelir", id: "subjek tanpa determiner berada setelah kata kerja", vi: "chủ ngữ không có từ hạn định đứng sau động từ" }
          - level: B2
            wrong: "Se vende casas en este barrio."
            right: ["Se ", { target: venden }, " casas en este barrio."]
            rule: { es: "el verbo concuerda con el sujeto, también cuando va detrás", en: "the verb agrees with the subject, also when it comes after", uk: "дієслово узгоджується з підметом, навіть коли той стоїть після нього", pt: "o verbo concorda com o sujeito, também quando ele vai depois", fr: "le verbe s’accorde avec le sujet, même quand celui-ci se place après", de: "das Verb richtet sich nach dem Subjekt, auch wenn es nachgestellt ist", it: "il verbo concorda con il soggetto, anche quando va dopo", pl: "czasownik zgadza się z podmiotem także wtedy, gdy ten stoi po nim", tr: "fiil, özne arkadan gelse de özneyle uyum sağlar", id: "kata kerja sesuai dengan subjek, juga ketika subjek berada di belakang", vi: "động từ hòa hợp với chủ ngữ, cả khi chủ ngữ đứng sau" }
          - level: C1
            wrong: "María, Luis dijo, no sabe nada."
            right: ["María, ", { target: "dijo Luis" }, ", no sabe nada."]
            rule: { es: "en un inciso de cita, el verbo va delante del sujeto", en: "in a parenthetical inside a quotation, the verb comes before the subject", uk: "у вставній частині цитати дієслово стоїть перед підметом", pt: "num inciso de citação, o verbo vai antes do sujeito", fr: "dans une incise de citation, le verbe précède le sujet", de: "in einem Einschub bei einem Zitat steht das Verb vor dem Subjekt", it: "in un inciso di citazione, il verbo va prima del soggetto", pl: "we wtrąceniu w cytacie czasownik stoi przed podmiotem", tr: "alıntıdaki araya girmede fiil öznenin önünde gelir", id: "dalam sisipan kutipan, kata kerja berada di depan subjek", vi: "trong thành phần xen của lời trích, động từ đứng trước chủ ngữ" }
          - level: C1
            wrong: "A María, ¿has visto últimamente?"
            right: ["A María, ¿", { target: la }, " has visto últimamente?"]
            rule: { es: "el tema que abre la pregunta se recoge con el pronombre átono", en: "the topic that opens the question is picked up by the unstressed pronoun", uk: "тему, що відкриває питання, підхоплює ненаголошений займенник", pt: "o tema que abre a pergunta é retomado pelo pronome átono", fr: "le thème qui ouvre la question est repris par le pronom atone", de: "das Thema, das die Frage eröffnet, wird durch das unbetonte Pronomen aufgenommen", it: "il tema che apre la domanda è ripreso dal pronome atono", pl: "temat otwierający pytanie podejmuje zaimek nieakcentowany", tr: "soruyu açan konu vurgusuz zamirle yeniden anılır", id: "topik yang membuka pertanyaan dirujuk kembali oleh kata ganti tanpa tekanan", vi: "chủ đề mở đầu câu hỏi được đại từ không nhấn nhắc lại" }
          - level: C2
            wrong: "Lo que tú eres un egoísta."
            right: ["Lo que tú eres ", { target: es }, " un egoísta."]
            rule: { es: [{ term: ser }, " une el relativo y el atributo"], en: [{ term: ser }, " links the relative and the complement"], uk: [{ term: ser }, " поєднує відносне слово з іменною частиною присудка"], pt: [{ term: ser }, " une o relativo e o predicativo"], fr: [{ term: ser }, " relie le relatif et l’attribut"], de: [{ term: ser }, " verbindet das Relativwort und das Prädikativ"], it: [{ term: ser }, " unisce il relativo e il predicativo"], pl: [{ term: ser }, " łączy wyraz względny z orzecznikiem"], tr: [{ term: ser }, " ilgi sözcüğü ile ad ya da sıfat yüklemini birleştirir"], id: [{ term: ser }, " menghubungkan kata relatif dan pelengkap"], vi: [{ term: ser }, " nối từ quan hệ với bổ ngữ"] }
          - level: C2
            wrong: "Quien es un egoísta es tú."
            right: ["Quien es un egoísta ", { target: eres }, " tú."]
            rule: { es: [{ term: ser }, " concuerda con el pronombre del final"], en: [{ term: ser }, " agrees with the pronoun at the end"], uk: [{ term: ser }, " узгоджується із займенником у кінці"], pt: [{ term: ser }, " concorda com o pronome do final"], fr: [{ term: ser }, " s’accorde avec le pronom final"], de: [{ term: ser }, " richtet sich nach dem Pronomen am Ende"], it: [{ term: ser }, " concorda con il pronome finale"], pl: [{ term: ser }, " zgadza się z zaimkiem na końcu"], tr: [{ term: ser }, " sondaki zamirle uyum sağlar"], id: [{ term: ser }, " sesuai dengan kata ganti di akhir"], vi: [{ term: ser }, " hòa hợp với đại từ ở cuối"] }
