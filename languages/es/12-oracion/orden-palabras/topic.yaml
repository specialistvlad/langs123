          - level: C1
            order: { es: "Contraste o corrección", en: "Contrast or correction", uk: "Протиставлення або виправлення", pt: "Contraste ou correção", fr: "Contraste ou correction", de: "Kontrast oder Korrektur", it: "Contrasto o correzione", pl: "Kontrast lub sprostowanie", tr: "Karşıtlık veya düzeltme", id: "Kontras atau koreksi", vi: "Đối lập hoặc đính chính" }
            does: { es: "El objeto antepuesto, sin pronombre, se opone a otro.", en: "The fronted object, without a pronoun, is set against another.", uk: "Додаток на початку речення, без займенника, протиставляється іншому.", pt: "O objeto antecipado, sem pronome, se opõe a outro.", fr: "L’objet antéposé, sans pronom, s’oppose à un autre.", de: "Das vorangestellte Objekt steht ohne Pronomen im Gegensatz zu einem anderen.", it: "Il complemento anticipato, senza pronome, si contrappone a un altro.", pl: "Wysunięte dopełnienie, bez zaimka, przeciwstawia się innemu.", tr: "Öne alınan nesne zamirsiz olarak başka bir nesneyle karşıtlık kurar.", id: "Objek yang didahulukan, tanpa kata ganti, dikontraskan dengan objek lain.", vi: "Tân ngữ đưa lên đầu, không có đại từ, đối lập với một tân ngữ khác." }
            ex: { examples: [[{ target: "Este vestido" }, " he elegido, no aquel."], [{ target: "Esas botas" }, " quiero, no estas."]] }
            tr: { en: { examples: ["I chose this dress, not that one.", "I want those boots, not these."] }, uk: { examples: ["Цю сукню я вибрала, а не ту.", "Ті чоботи я хочу, а не ці."] }, pt: { examples: ["Este vestido eu escolhi, não aquele.", "Essas botas eu quero, não estas."] }, fr: { examples: ["C’est cette robe que j’ai choisie, pas celle-là.", "Ce sont ces bottes que je veux, pas celles-ci."] }, de: { examples: ["Dieses Kleid habe ich ausgesucht, nicht jenes.", "Die Stiefel dort will ich, nicht diese hier."] }, it: { examples: ["Ho scelto questo vestito, non quello.", "Voglio quegli stivali, non questi."] }, pl: { examples: ["Tę sukienkę wybrałam, nie tamtą.", "Tamte buty chcę, a nie te."] }, tr: { examples: ["Bu elbiseyi seçtim, şunu değil.", "Şu botları istiyorum, bunları değil."] }, id: { examples: ["Gaun ini yang saya pilih, bukan yang itu.", "Sepatu bot itu yang saya mau, bukan yang ini."] }, vi: { examples: ["Tôi chọn chiếc váy này, không phải chiếc kia.", "Tôi muốn đôi ủng đó, không phải đôi này."] } }
          - level: C1
            order: { es: "Tema indefinido", en: "Indefinite topic", uk: "Неозначена тема", pt: "Tema indefinido", fr: "Thème indéfini", de: "Unbestimmtes Thema", it: "Tema indefinito", pl: "Temat nieokreślony", tr: "Belgisiz konu", id: "Topik tak tentu", vi: "Chủ đề bất định" }
            does: { es: "Un objeto indefinido antepuesto no lleva pronombre ni pausa.", en: "A fronted indefinite object takes no pronoun and no pause.", uk: "Неозначений додаток на початку речення не має ні займенника, ні паузи.", pt: "Um objeto indefinido antecipado não leva pronome nem pausa.", fr: "Un objet indéfini antéposé n’a ni pronom ni pause.", de: "Ein vorangestelltes unbestimmtes Objekt hat weder Pronomen noch Pause.", it: "Un complemento indefinito anticipato non ha né pronome né pausa.", pl: "Wysunięte dopełnienie nieokreślone nie ma ani zaimka, ani pauzy.", tr: "Öne alınan belgisiz nesne ne zamir alır ne de duraklama.", id: "Objek tak tentu yang didahulukan tidak memakai kata ganti maupun jeda.", vi: "Tân ngữ bất định đưa lên đầu không có đại từ cũng không có chỗ ngắt." }
            ex: { examples: [[{ target: Discos }, " tienen a montones."], [{ target: Trabajo }, " tiene de sobra."]] }
