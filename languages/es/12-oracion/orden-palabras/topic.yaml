title: { es: "El orden de las palabras", en: "Word Order", uk: "Порядок слів", pt: "A ordem das palavras", fr: "L’ordre des mots", de: "Die Wortstellung", it: "L’ordine delle parole", pl: "Szyk wyrazów", tr: "Sözcük sırası", id: "Urutan kata", vi: "Trật tự từ" }
summary:
  lead:
    es: "El tema abre la oración y el dato nuevo va al final: el sujeto sin determinante sigue al verbo y el foco rompe el orden habitual."
    en: "A topic opens the sentence and the new information comes last: a subject without a determiner follows the verb, and focus breaks the usual order."
    uk: "Тема відкриває речення, а нова інформація стоїть у кінці: підмет без детермінатива йде після дієслова, а фокус порушує звичайний порядок."
    pt: "O tema abre a frase e a informação nova vem no fim: o sujeito sem determinante segue o verbo e o foco rompe a ordem habitual."
    fr: "Le thème ouvre la phrase et l’information nouvelle vient à la fin : le sujet sans déterminant suit le verbe et la focalisation rompt l’ordre habituel."
    de: "Das Thema eröffnet den Satz, die neue Information steht am Ende: Ein Subjekt ohne Begleiter folgt dem Verb, der Fokus durchbricht die übliche Reihenfolge."
    it: "Il tema apre la frase e l’informazione nuova va in fondo: il soggetto senza determinante segue il verbo e il focus rompe l’ordine abituale."
    pl: "Temat otwiera zdanie, a nowa informacja stoi na końcu: podmiot bez określnika idzie za czasownikiem, a ognisko łamie zwykły szyk."
    tr: "Konu cümleyi açar, yeni bilgi sona gelir: belirleyicisiz özne fiili izler, odak ise olağan sırayı bozar."
    id: "Topik membuka kalimat dan informasi baru berada di akhir: subjek tanpa determiner mengikuti kata kerja, dan fokus mengubah urutan yang biasa."
    vi: "Chủ đề mở đầu câu, thông tin mới đứng cuối: chủ ngữ không có từ hạn định theo sau động từ, còn tiêu điểm phá vỡ trật tự thường."
  rule:
    es: "Un objeto directo conocido que abre la oración se recoge con el pronombre átono:"
    en: "A known direct object that opens the sentence is picked up by the unstressed pronoun:"
    uk: "Відомий прямий додаток, що відкриває речення, підхоплює ненаголошений займенник:"
    pt: "Um objeto direto conhecido que abre a frase é retomado pelo pronome átono:"
    fr: "Un COD connu qui ouvre la phrase est repris par le pronom atone :"
    de: "Ein bekanntes direktes Objekt am Satzanfang wird durch das unbetonte Pronomen aufgenommen:"
    it: "Un complemento diretto noto che apre la frase è ripreso dal pronome atono:"
    pl: "Znane dopełnienie bliższe na początku zdania podejmuje zaimek nieakcentowany:"
    tr: "Cümleyi açan bilinen doğrudan nesne, vurgusuz zamirle yeniden anılır:"
    id: "Objek langsung yang sudah dikenal dan membuka kalimat dirujuk kembali oleh kata ganti tanpa tekanan:"
    vi: "Tân ngữ trực tiếp đã biết đứng đầu câu được đại từ không nhấn nhắc lại:"
  ex: ["Los libros ", { target: los }, " tiene Juan."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: Sujeto sin determinante, en: "Subject without a determiner", uk: "Підмет без детермінатива", pt: "Sujeito sem determinante", fr: "Sujet sans déterminant", de: "Subjekt ohne Begleiter", it: "Soggetto senza determinante", pl: "Podmiot bez określnika", tr: "Belirleyicisiz özne", id: "Subjek tanpa determiner", vi: "Chủ ngữ không có từ hạn định" }
          rule: { es: "va detrás del verbo", en: "goes after the verb", uk: "стоїть після дієслова", pt: "vai depois do verbo", fr: "se place après le verbe", de: "steht nach dem Verb", it: "va dopo il verbo", pl: "stoi po czasowniku", tr: "fiilden sonra gelir", id: "berada setelah kata kerja", vi: "đứng sau động từ" }
          ex: { examples: [[{ target: "Han llegado trenes" }, " a la estación."], ["Se ", { target: "venden casas" }, "."]] }
          tr: { en: { examples: ["Trains have arrived at the station.", "Houses are sold."] }, uk: { examples: ["На станцію прибули поїзди.", "Продаються будинки."] }, pt: { examples: ["Chegaram trens à estação.", "Vendem-se casas."] }, fr: { examples: ["Des trains sont arrivés en gare.", "On vend des maisons."] }, de: { examples: ["Am Bahnhof sind Züge angekommen.", "Häuser werden verkauft."] }, it: { examples: ["Sono arrivati dei treni alla stazione.", "Si vendono case."] }, pl: { examples: ["Na stację przyjechały pociągi.", "Sprzedaje się domy."] }, tr: { examples: ["İstasyona trenler geldi.", "Evler satılıyor."] }, id: { examples: ["Kereta-kereta sudah tiba di stasiun.", "Rumah dijual."] }, vi: { examples: ["Các chuyến tàu đã đến ga.", "Nhà được bán."] } }
        - level: B2
          point: { es: Objeto antepuesto, en: "Fronted object", uk: "Додаток на початку речення", pt: "Objeto antecipado", fr: "Objet antéposé", de: "Vorangestelltes Objekt", it: "Complemento anticipato", pl: "Dopełnienie wysunięte na początek", tr: "Öne alınan nesne", id: "Objek yang didahulukan", vi: "Tân ngữ đưa lên đầu" }
          rule: { es: "el pronombre átono recoge el tema conocido", en: "the unstressed pronoun picks up the known topic", uk: "ненаголошений займенник підхоплює відому тему", pt: "o pronome átono retoma o tema conhecido", fr: "le pronom atone reprend le thème connu", de: "das unbetonte Pronomen nimmt das bekannte Thema wieder auf", it: "il pronome atono riprende il tema noto", pl: "zaimek nieakcentowany podejmuje znany temat", tr: "vurgusuz zamir bilinen konuyu yeniden anar", id: "kata ganti tanpa tekanan merujuk kembali ke topik yang sudah dikenal", vi: "đại từ không nhấn nhắc lại chủ đề đã biết" }
          ex: ["Los libros ", { target: los }, " tiene Juan."]
          tr: { en: "Juan has the books.", uk: "Книжки має Хуан.", pt: "Os livros quem tem é o Juan.", fr: "Les livres, Juan les a.", de: "Die Bücher hat Juan.", it: "I libri li ha Juan.", pl: "Książki ma Juan.", tr: "Kitaplar Juan’da.", id: "Buku-buku itu dipegang Juan.", vi: "Những cuốn sách đó thì Juan có." }
        - level: B2
          point: { es: Palabra negativa, en: "Negative word", uk: "Заперечне слово", pt: "Palavra negativa", fr: "Mot négatif", de: "Verneinungswort", it: "Parola negativa", pl: "Słowo przeczące", tr: "Olumsuz sözcük", id: "Kata negatif", vi: "Từ phủ định" }
          rule: { es: "el pronombre átono sigue siendo obligatorio", en: "the unstressed pronoun is still required", uk: "ненаголошений займенник усе одно обов’язковий", pt: "o pronome átono continua obrigatório", fr: "le pronom atone reste obligatoire", de: "das unbetonte Pronomen bleibt Pflicht", it: "il pronome atono resta obbligatorio", pl: "zaimek nieakcentowany pozostaje obowiązkowy", tr: "vurgusuz zamir yine de zorunludur", id: "kata ganti tanpa tekanan tetap wajib", vi: "đại từ không nhấn vẫn bắt buộc" }
          ex: ["El alcohol ni ", { target: lo }, " prueba."]
          tr: { en: "He doesn’t even touch alcohol.", uk: "Алкоголю він навіть не куштує.", pt: "Álcool ele nem prova.", fr: "L’alcool, il n’y touche même pas.", de: "Alkohol rührt er nicht einmal an.", it: "L’alcol non lo tocca nemmeno.", pl: "Alkoholu nawet nie tyka.", tr: "Alkole dokunmaz bile.", id: "Alkohol pun tidak disentuhnya.", vi: "Rượu thì anh ấy còn không đụng tới." }
        - level: C1
          point: { es: Sujeto nuevo, en: "New subject", uk: "Новий підмет", pt: "Sujeito novo", fr: "Sujet nouveau", de: "Neues Subjekt", it: "Soggetto nuovo", pl: "Nowy podmiot", tr: "Yeni özne", id: "Subjek baru", vi: "Chủ ngữ mới" }
          rule: { es: "va al final de la oración", en: "goes at the end of the sentence", uk: "стоїть у кінці речення", pt: "vai no fim da frase", fr: "se place en fin de phrase", de: "steht am Satzende", it: "va in fondo alla frase", pl: "stoi na końcu zdania", tr: "cümlenin sonuna gelir", id: "berada di akhir kalimat", vi: "đứng ở cuối câu" }
          ex: [{ target: "Llega mañana Pedro" }, "."]
          tr: { en: "Pedro arrives tomorrow.", uk: "Завтра приїжджає Педро.", pt: "Amanhã chega o Pedro.", fr: "C’est Pedro qui arrive demain.", de: "Morgen kommt Pedro an.", it: "Domani arriva Pedro.", pl: "Jutro przyjeżdża Pedro.", tr: "Yarın Pedro geliyor.", id: "Besok Pedro yang tiba.", vi: "Ngày mai Pedro đến." }
        - level: C1
          point: { es: Tema sin determinante, en: "Topic without a determiner", uk: "Тема без детермінатива", pt: "Tema sem determinante", fr: "Thème sans déterminant", de: "Thema ohne Begleiter", it: "Tema senza determinante", pl: "Temat bez określnika", tr: "Belirleyicisiz konu", id: "Topik tanpa determiner", vi: "Chủ đề không có từ hạn định" }
          rule: { es: "un indefinido lo recoge detrás del verbo", en: "an indefinite picks it up after the verb", uk: "після дієслова її підхоплює неозначений займенник", pt: "um indefinido o retoma depois do verbo", fr: "un indéfini le reprend après le verbe", de: "ein Indefinitpronomen nimmt es hinter dem Verb auf", it: "un indefinito lo riprende dopo il verbo", pl: "zaimek nieokreślony podejmuje go po czasowniku", tr: "belgisiz bir sözcük onu fiilden sonra anar", id: "kata tak tentu merujuknya setelah kata kerja", vi: "một từ bất định nhắc lại nó sau động từ" }
          ex: ["Abrigo, ", { target: "tengo uno" }, " viejo."]
          tr: { en: "A coat? I have an old one.", uk: "Пальто? У мене є старе.", pt: "Casaco, eu tenho um velho.", fr: "Un manteau, j’en ai un vieux.", de: "Einen Mantel habe ich, einen alten.", it: "Cappotto, ne ho uno vecchio.", pl: "Płaszcz? Mam stary.", tr: "Palto mu? Eski bir tane var.", id: "Soal mantel, saya punya yang sudah tua.", vi: "Áo khoác thì tôi có một cái cũ." }
        - level: C1
          point: { es: Contraste o indefinido, en: "Contrast or indefinite", uk: "Протиставлення або неозначеність", pt: "Contraste ou indefinido", fr: "Contraste ou indéfini", de: "Kontrast oder Indefinitum", it: "Contrasto o indefinito", pl: "Kontrast lub nieokreśloność", tr: "Karşıtlık veya belgisiz", id: "Kontras atau tak tentu", vi: "Đối lập hoặc bất định" }
          rule: { es: "el objeto antepuesto no lleva pronombre", en: "the fronted object takes no pronoun", uk: "додаток на початку речення не має займенника", pt: "o objeto antecipado não leva pronome", fr: "l’objet antéposé n’est pas repris par un pronom", de: "das vorangestellte Objekt hat kein Pronomen", it: "il complemento anticipato non ha pronome", pl: "wysunięte dopełnienie nie ma zaimka", tr: "öne alınan nesne zamir almaz", id: "objek yang didahulukan tidak memakai kata ganti", vi: "tân ngữ đưa lên đầu không có đại từ" }
          ex: { examples: [[{ target: "Este vestido" }, " he elegido, no aquel."], [{ target: Discos }, " tienen a montones."]] }
          tr: { en: { examples: ["I chose this dress, not that one.", "They have loads of records."] }, uk: { examples: ["Цю сукню я вибрала, а не ту.", "Платівок у них купа."] }, pt: { examples: ["Este vestido eu escolhi, não aquele.", "Discos eles têm aos montes."] }, fr: { examples: ["C’est cette robe que j’ai choisie, pas celle-là.", "Des disques, ils en ont des tas."] }, de: { examples: ["Dieses Kleid habe ich ausgesucht, nicht jenes.", "Schallplatten haben sie haufenweise."] }, it: { examples: ["Ho scelto questo vestito, non quello.", "Dischi ne hanno a montagne."] }, pl: { examples: ["Tę sukienkę wybrałam, nie tamtą.", "Płyt mają mnóstwo."] }, tr: { examples: ["Bu elbiseyi seçtim, şunu değil.", "Onlarda bir sürü plak var."] }, id: { examples: ["Gaun ini yang saya pilih, bukan yang itu.", "Mereka punya banyak sekali piringan hitam."] }, vi: { examples: ["Tôi chọn chiếc váy này, không phải chiếc kia.", "Họ có cả đống đĩa hát."] } }
        - level: C1
          point: { es: Tema y pregunta, en: "Topic and question", uk: "Тема і питання", pt: "Tema e pergunta", fr: "Thème et question", de: "Thema und Frage", it: "Tema e domanda", pl: "Temat i pytanie", tr: "Konu ve soru", id: "Topik dan pertanyaan", vi: "Chủ đề và câu hỏi" }
          rule: { es: "el tema abre la pregunta y el pronombre lo recoge", en: "the topic opens the question and the pronoun picks it up", uk: "тема відкриває питання, а займенник її підхоплює", pt: "o tema abre a pergunta e o pronome o retoma", fr: "le thème ouvre la question et le pronom le reprend", de: "das Thema eröffnet die Frage und das Pronomen nimmt es auf", it: "il tema apre la domanda e il pronome lo riprende", pl: "temat otwiera pytanie, a zaimek go podejmuje", tr: "konu soruyu açar, zamir onu yeniden anar", id: "topik membuka pertanyaan dan kata ganti merujuknya kembali", vi: "chủ đề mở đầu câu hỏi và đại từ nhắc lại nó" }
          ex: ["A María, ¿", { target: la }, " has visto últimamente?"]
          tr: { en: "María, have you seen her lately?", uk: "Марію ти бачив останнім часом?", pt: "A Maria, você a viu ultimamente?", fr: "María, tu l’as vue dernièrement ?", de: "María, hast du sie in letzter Zeit gesehen?", it: "María, l’hai vista di recente?", pl: "Marię widziałeś ostatnio?", tr: "María’yı son zamanlarda gördün mü?", id: "María, kamu sudah melihatnya akhir-akhir ini?", vi: "María thì dạo này bạn có gặp cô ấy không?" }
        - level: C2
          point: { es: Foco, en: "Focus", uk: "Фокус", pt: "Foco", fr: "Focalisation", de: "Fokus", it: "Focalizzazione", pl: "Ognisko", tr: "Odak", id: "Fokus", vi: "Tiêu điểm" }
          rule: { es: "el objeto con acento va delante, sin pronombre", en: "the stressed object goes first, with no pronoun", uk: "додаток з наголосом стоїть попереду, без займенника", pt: "o objeto acentuado vai à frente, sem pronome", fr: "l’objet accentué se place en tête, sans pronom", de: "das betonte Objekt steht voran, ohne Pronomen", it: "il complemento con l’accento va davanti, senza pronome", pl: "akcentowane dopełnienie stoi na początku, bez zaimka", tr: "vurgulu nesne başa gelir, zamir olmadan", id: "objek bertekanan ditaruh di depan, tanpa kata ganti", vi: "tân ngữ có trọng âm đứng đầu, không có đại từ" }
          ex: [{ target: "UNOS LIBROS" }, " quiere Juan."]
          tr: { en: "Juan wants BOOKS.", uk: "Хуан хоче КНИЖКИ.", pt: "O Juan quer LIVROS.", fr: "Juan veut des LIVRES.", de: "Juan will BÜCHER.", it: "Juan vuole dei LIBRI.", pl: "Juan chce KSIĄŻEK.", tr: "Juan KİTAP istiyor.", id: "Juan mau BUKU.", vi: "Juan muốn SÁCH." }
        - level: C2
          point: { es: Orden enfático, en: "Emphatic order", uk: "Емфатичний порядок слів", pt: "Ordem enfática", fr: "Ordre emphatique", de: "Emphatische Wortstellung", it: "Ordine enfatico", pl: "Szyk emfatyczny", tr: "Vurgulu sıra", id: "Urutan penekanan", vi: "Trật tự nhấn mạnh" }
          rule: { es: [{ term: bonito }, ", ", { term: vaya }, " y ", { term: menudo }, " abren la frase"], en: [{ term: bonito }, ", ", { term: vaya }, " and ", { term: menudo }, " open the sentence"], uk: [{ term: bonito }, ", ", { term: vaya }, " і ", { term: menudo }, " відкривають речення"], pt: [{ term: bonito }, ", ", { term: vaya }, " e ", { term: menudo }, " abrem a frase"], fr: [{ term: bonito }, ", ", { term: vaya }, " et ", { term: menudo }, " ouvrent la phrase"], de: [{ term: bonito }, ", ", { term: vaya }, " und ", { term: menudo }, " eröffnen den Satz"], it: [{ term: bonito }, ", ", { term: vaya }, " e ", { term: menudo }, " aprono la frase"], pl: [{ term: bonito }, ", ", { term: vaya }, " i ", { term: menudo }, " otwierają zdanie"], tr: [{ term: bonito }, ", ", { term: vaya }, " ve ", { term: menudo }, " cümleyi açar"], id: [{ term: bonito }, ", ", { term: vaya }, " dan ", { term: menudo }, " membuka kalimat"], vi: [{ term: bonito }, ", ", { term: vaya }, " và ", { term: menudo }, " mở đầu câu"] }
          ex: [{ target: "Menudo reloj" }, " se compró tu primo."]
          tr: { en: "What a watch your cousin bought himself!", uk: "Який годинник собі купив твій двоюрідний брат!", pt: "Que relógio seu primo comprou!", fr: "Quelle montre ton cousin s’est achetée !", de: "Was für eine Uhr dein Cousin sich da gekauft hat!", it: "Che orologio si è comprato tuo cugino!", pl: "Jaki zegarek sobie kupił twój kuzyn!", tr: "Kuzenin kendine ne saat almış!", id: "Wah, jam tangan yang dibeli sepupumu!", vi: "Anh họ bạn mua một chiếc đồng hồ ra trò!" }
        - level: C2
          point: { es: Relativo enfático, en: "Emphatic relative", uk: "Емфатичне відносне слово", pt: "Relativo enfático", fr: "Relatif emphatique", de: "Emphatisches Relativwort", it: "Relativo enfatico", pl: "Wyraz względny w szyku emfatycznym", tr: "Vurgulu ilgi sözcüğü", id: "Kata relatif penekanan", vi: "Từ quan hệ nhấn mạnh" }
          rule: { es: [{ term: ser }, " une el relativo y el atributo"], en: [{ term: ser }, " links the relative and the complement"], uk: [{ term: ser }, " поєднує відносне слово з іменною частиною присудка"], pt: [{ term: ser }, " une o relativo e o predicativo"], fr: [{ term: ser }, " relie le relatif et l’attribut"], de: [{ term: ser }, " verbindet das Relativwort und das Prädikativ"], it: [{ term: ser }, " unisce il relativo e il predicativo"], pl: [{ term: ser }, " łączy wyraz względny z orzecznikiem"], tr: [{ term: ser }, " ilgi sözcüğü ile ad ya da sıfat yüklemini birleştirir"], id: [{ term: ser }, " menghubungkan kata relatif dan pelengkap"], vi: [{ term: ser }, " nối từ quan hệ với bổ ngữ"] }
          ex: ["Lo que tú eres ", { target: es }, " un egoísta."]
          tr: { en: "What you are is a selfish person.", uk: "Ти просто егоїст.", pt: "O que você é é um egoísta.", fr: "Ce que tu es, c’est un égoïste.", de: "Was du bist, ist ein Egoist.", it: "Quello che sei è un egoista.", pl: "Jesteś po prostu egoistą.", tr: "Sen düpedüz bir bencilsin.", id: "Kamu ini benar-benar egois.", vi: "Bạn đúng là một kẻ ích kỷ." }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: "con el objeto interrogativo delante, no hay pronombre", en: "with a question word as the object in front, there is no pronoun", uk: "коли питальний додаток стоїть попереду, займенника немає", pt: "com o objeto interrogativo na frente, não há pronome", fr: "quand l’objet interrogatif est en tête, il n’y a pas de pronom", de: "steht das Fragewort als Objekt vorn, gibt es kein Pronomen", it: "con il complemento interrogativo davanti, non c’è il pronome", pl: "gdy pytające dopełnienie stoi na początku, nie ma zaimka", tr: "soru sözcüğü olan nesne başta olduğunda zamir yoktur", id: "dengan objek berupa kata tanya di depan, tidak ada kata ganti", vi: "khi tân ngữ nghi vấn đứng đầu, không có đại từ" }
          ex: ["¿", { target: "Qué regalo has comprado" }, "?"]
          tr: { en: "What present have you bought?", uk: "Який подарунок ти купив?", pt: "Que presente você comprou?", fr: "Quel cadeau as-tu acheté ?", de: "Welches Geschenk hast du gekauft?", it: "Che regalo hai comprato?", pl: "Jaki prezent kupiłeś?", tr: "Hangi hediyeyi aldın?", id: "Hadiah apa yang kamu beli?", vi: "Bạn đã mua món quà nào?" }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: "en un inciso de cita, el verbo va delante del sujeto", en: "in a parenthetical inside a quotation, the verb comes before the subject", uk: "у вставній частині цитати дієслово стоїть перед підметом", pt: "num inciso de citação, o verbo vai antes do sujeito", fr: "dans une incise de citation, le verbe précède le sujet", de: "in einem Einschub bei einem Zitat steht das Verb vor dem Subjekt", it: "in un inciso di citazione, il verbo va prima del soggetto", pl: "we wtrąceniu w cytacie czasownik stoi przed podmiotem", tr: "alıntıdaki araya girmede fiil öznenin önünde gelir", id: "dalam sisipan kutipan, kata kerja berada di depan subjek", vi: "trong thành phần xen của lời trích, động từ đứng trước chủ ngữ" }
          ex: ["María, ", { target: "dijo Luis" }, ", no sabe nada."]
          tr: { en: "María, said Luis, knows nothing.", uk: "Марія, сказав Луїс, нічого не знає.", pt: "A Maria, disse o Luis, não sabe nada.", fr: "María, a dit Luis, ne sait rien.", de: "María, sagte Luis, weiß nichts.", it: "María, disse Luis, non sa niente.", pl: "María, powiedział Luis, nic nie wie.", tr: "María, dedi Luis, hiçbir şey bilmiyor.", id: "María, kata Luis, tidak tahu apa-apa.", vi: "María, Luis nói, không biết gì cả." }

sections:
  - title: { es: El sujeto detrás del verbo, en: "The subject after the verb", uk: "Підмет після дієслова", pt: "O sujeito depois do verbo", fr: "Le sujet après le verbe", de: "Das Subjekt nach dem Verb", it: "Il soggetto dopo il verbo", pl: "Podmiot po czasowniku", tr: "Fiilden sonra gelen özne", id: "Subjek setelah kata kerja", vi: "Chủ ngữ đứng sau động từ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: context, label: { es: Contexto, en: "Context", uk: "Контекст", pt: "Contexto", fr: "Contexte", de: "Kontext", it: "Contesto", pl: "Kontekst", tr: "Bağlam", id: "Konteks", vi: "Ngữ cảnh" } }
          - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            context: { es: "Sujeto sin determinante ni cuantificador", en: "Subject with no determiner or quantifier", uk: "Підмет без детермінатива й слова кількості", pt: "Sujeito sem determinante nem quantificador", fr: "Sujet sans déterminant ni quantificateur", de: "Subjekt ohne Begleiter und ohne Mengenwort", it: "Soggetto senza determinante né quantificatore", pl: "Podmiot bez określnika ani określnika ilości", tr: "Belirleyicisiz ve miktar sözcüksüz özne", id: "Subjek tanpa determiner atau kata penunjuk jumlah", vi: "Chủ ngữ không có từ hạn định và lượng từ" }
            rule: { es: "Va detrás del verbo.", en: "It goes after the verb.", uk: "Він стоїть після дієслова.", pt: "Vai depois do verbo.", fr: "Il se place après le verbe.", de: "Es steht nach dem Verb.", it: "Va dopo il verbo.", pl: "Stoi po czasowniku.", tr: "Fiilden sonra gelir.", id: "Berada setelah kata kerja.", vi: "Đứng sau động từ." }
            ex: { examples: [[{ target: "Han llegado trenes" }, " a la estación."], [{ target: "Faltan médicos" }, " en el hospital."]] }
            tr: { en: { examples: ["Trains have arrived at the station.", "The hospital is short of doctors."] }, uk: { examples: ["На станцію прибули поїзди.", "У лікарні бракує лікарів."] }, pt: { examples: ["Chegaram trens à estação.", "Faltam médicos no hospital."] }, fr: { examples: ["Des trains sont arrivés en gare.", "Il manque des médecins à l’hôpital."] }, de: { examples: ["Am Bahnhof sind Züge angekommen.", "Im Krankenhaus fehlen Ärzte."] }, it: { examples: ["Sono arrivati dei treni alla stazione.", "All’ospedale mancano medici."] }, pl: { examples: ["Na stację przyjechały pociągi.", "W szpitalu brakuje lekarzy."] }, tr: { examples: ["İstasyona trenler geldi.", "Hastanede doktor eksik."] }, id: { examples: ["Kereta-kereta sudah tiba di stasiun.", "Rumah sakit kekurangan dokter."] }, vi: { examples: ["Các chuyến tàu đã đến ga.", "Bệnh viện đang thiếu bác sĩ."] } }
          - level: B2
            context: { es: "Pasiva refleja con se", en: "Reflexive passive with se", uk: "Пасив із se", pt: "Passiva reflexa com se", fr: "Passif pronominal avec se", de: "Reflexivpassiv mit se", it: "Passivo riflessivo con se", pl: "Strona bierna z se", tr: "se ile edilgen yapı", id: "Pasif refleksif dengan se", vi: "Câu bị động phản thân với se" }
            rule: { es: "El sujeto sin determinante sigue al verbo, y el verbo concuerda con él.", en: "The subject without a determiner follows the verb, and the verb agrees with it.", uk: "Підмет без детермінатива стоїть після дієслова, і дієслово узгоджується з ним.", pt: "O sujeito sem determinante vem depois do verbo, e o verbo concorda com ele.", fr: "Le sujet sans déterminant suit le verbe, et le verbe s’accorde avec lui.", de: "Das Subjekt ohne Begleiter folgt dem Verb, und das Verb richtet sich nach ihm.", it: "Il soggetto senza determinante segue il verbo, e il verbo concorda con esso.", pl: "Podmiot bez określnika stoi po czasowniku, a czasownik zgadza się z nim.", tr: "Belirleyicisiz özne fiili izler ve fiil onunla uyum sağlar.", id: "Subjek tanpa determiner mengikuti kata kerja, dan kata kerja sesuai dengannya.", vi: "Chủ ngữ không có từ hạn định đứng sau động từ, và động từ hòa hợp với nó." }
            ex: { examples: [["Se ", { target: "venden casas" }, " en este barrio."], ["Se ", { target: "buscan cocineros" }, "."]] }
            tr: { en: { examples: ["Houses are sold in this neighbourhood.", "Cooks are wanted."] }, uk: { examples: ["У цьому районі продаються будинки.", "Шукають кухарів."] }, pt: { examples: ["Vendem-se casas neste bairro.", "Procuram-se cozinheiros."] }, fr: { examples: ["On vend des maisons dans ce quartier.", "On recherche des cuisiniers."] }, de: { examples: ["In diesem Viertel werden Häuser verkauft.", "Köche gesucht."] }, it: { examples: ["In questo quartiere si vendono case.", "Si cercano cuochi."] }, pl: { examples: ["W tej dzielnicy sprzedaje się domy.", "Poszukiwani kucharze."] }, tr: { examples: ["Bu mahallede evler satılıyor.", "Aşçılar aranıyor."] }, id: { examples: ["Rumah dijual di lingkungan ini.", "Dicari koki."] }, vi: { examples: ["Khu phố này có nhà bán.", "Cần tuyển đầu bếp."] } }
          - level: B2
            context: { es: "Sujeto con determinante o cuantificador", en: "Subject with a determiner or quantifier", uk: "Підмет із детермінативом або словом кількості", pt: "Sujeito com determinante ou quantificador", fr: "Sujet avec déterminant ou quantificateur", de: "Subjekt mit Begleiter oder Mengenwort", it: "Soggetto con determinante o quantificatore", pl: "Podmiot z określnikiem lub określnikiem ilości", tr: "Belirleyicili veya miktar sözcüklü özne", id: "Subjek dengan determiner atau kata penunjuk jumlah", vi: "Chủ ngữ có từ hạn định hoặc lượng từ" }
            rule: { es: "Va delante o detrás del verbo.", en: "It goes before or after the verb.", uk: "Він стоїть перед дієсловом або після нього.", pt: "Vai antes ou depois do verbo.", fr: "Il se place avant ou après le verbe.", de: "Es steht vor oder nach dem Verb.", it: "Va prima o dopo il verbo.", pl: "Stoi przed czasownikiem lub po nim.", tr: "Fiilden önce ya da sonra gelir.", id: "Berada sebelum atau sesudah kata kerja.", vi: "Đứng trước hoặc sau động từ." }
            ex: { examples: [[{ target: "Todos los trenes han llegado" }, "."], [{ target: "Han llegado todos los trenes" }, "."]] }
            tr: { en: { examples: ["All the trains have arrived.", "All the trains have arrived."] }, uk: { examples: ["Усі поїзди прибули.", "Прибули всі поїзди."] }, pt: { examples: ["Todos os trens chegaram.", "Chegaram todos os trens."] }, fr: { examples: ["Tous les trains sont arrivés.", "Tous les trains sont arrivés."] }, de: { examples: ["Alle Züge sind angekommen.", "Angekommen sind alle Züge."] }, it: { examples: ["Tutti i treni sono arrivati.", "Sono arrivati tutti i treni."] }, pl: { examples: ["Wszystkie pociągi przyjechały.", "Przyjechały wszystkie pociągi."] }, tr: { examples: ["Bütün trenler geldi.", "Bütün trenler geldi."] }, id: { examples: ["Semua kereta sudah tiba.", "Semua kereta sudah tiba."] }, vi: { examples: ["Tất cả các chuyến tàu đã đến.", "Tất cả các chuyến tàu đã đến."] } }
          - level: C1
            context: { es: "Sujeto que da el dato nuevo", en: "Subject that gives the new information", uk: "Підмет, що дає нову інформацію", pt: "Sujeito que dá a informação nova", fr: "Sujet qui apporte l’information nouvelle", de: "Subjekt, das die neue Information liefert", it: "Soggetto che dà l’informazione nuova", pl: "Podmiot, który podaje nową informację", tr: "Yeni bilgiyi veren özne", id: "Subjek yang memberi informasi baru", vi: "Chủ ngữ đưa ra thông tin mới" }
            rule: { es: "Va al final de la oración, detrás de los demás complementos.", en: "It goes at the end of the sentence, after the other complements.", uk: "Він стоїть у кінці речення, після інших другорядних членів.", pt: "Vai no fim da frase, depois dos demais complementos.", fr: "Il se place en fin de phrase, après les autres compléments.", de: "Es steht am Satzende, nach den übrigen Ergänzungen.", it: "Va in fondo alla frase, dopo gli altri complementi.", pl: "Stoi na końcu zdania, po pozostałych dopełnieniach i okolicznikach.", tr: "Cümlenin sonuna, diğer tümleçlerden sonra gelir.", id: "Berada di akhir kalimat, setelah pelengkap yang lain.", vi: "Đứng ở cuối câu, sau các thành phần bổ nghĩa khác." }
            ex: { exchange: ["¿Quién llega mañana?", [{ target: "Llega mañana Pedro" }, "."]] }
            tr: { en: { exchange: ["Who is arriving tomorrow?", "Pedro arrives tomorrow."] }, uk: { exchange: ["Хто приїжджає завтра?", "Завтра приїжджає Педро."] }, pt: { exchange: ["Quem chega amanhã?", "Amanhã chega o Pedro."] }, fr: { exchange: ["Qui arrive demain ?", "C’est Pedro qui arrive demain."] }, de: { exchange: ["Wer kommt morgen an?", "Morgen kommt Pedro an."] }, it: { exchange: ["Chi arriva domani?", "Domani arriva Pedro."] }, pl: { exchange: ["Kto przyjeżdża jutro?", "Jutro przyjeżdża Pedro."] }, tr: { exchange: ["Yarın kim geliyor?", "Yarın Pedro geliyor."] }, id: { exchange: ["Siapa yang tiba besok?", "Besok Pedro yang tiba."] }, vi: { exchange: ["Ngày mai ai đến?", "Ngày mai Pedro đến."] } }
          - level: C1
            context: { es: "Inciso de cita", en: "Parenthetical inside a quotation", uk: "Вставна частина в цитаті", pt: "Inciso de citação", fr: "Incise de citation", de: "Einschub bei einem Zitat", it: "Inciso di citazione", pl: "Wtrącenie w cytacie", tr: "Alıntıda araya girme", id: "Sisipan dalam kutipan", vi: "Thành phần xen trong lời trích" }
            rule: { es: "El verbo de habla va siempre delante del sujeto.", en: "The verb of speech always comes before the subject.", uk: "Дієслово мовлення завжди стоїть перед підметом.", pt: "O verbo de fala vem sempre antes do sujeito.", fr: "Le verbe de parole précède toujours le sujet.", de: "Das Verb des Sprechens steht immer vor dem Subjekt.", it: "Il verbo di dire va sempre prima del soggetto.", pl: "Czasownik mówienia stoi zawsze przed podmiotem.", tr: "Konuşma fiili her zaman öznenin önünde gelir.", id: "Kata kerja ujaran selalu berada di depan subjek.", vi: "Động từ nói luôn đứng trước chủ ngữ." }
            ex: { examples: [["María, ", { target: "dijo Luis" }, ", no sabe nada."], ["Esa casa, ", { target: "comentó mi tía" }, ", es muy cara."]] }
            tr: { en: { examples: ["María, said Luis, knows nothing.", "That house, my aunt remarked, is very expensive."] }, uk: { examples: ["Марія, сказав Луїс, нічого не знає.", "Той будинок, зауважила моя тітка, дуже дорогий."] }, pt: { examples: ["A Maria, disse o Luis, não sabe nada.", "Aquela casa, comentou minha tia, é muito cara."] }, fr: { examples: ["María, a dit Luis, ne sait rien.", "Cette maison, a remarqué ma tante, est très chère."] }, de: { examples: ["María, sagte Luis, weiß nichts.", "Dieses Haus, bemerkte meine Tante, ist sehr teuer."] }, it: { examples: ["María, disse Luis, non sa niente.", "Quella casa, commentò mia zia, è molto cara."] }, pl: { examples: ["María, powiedział Luis, nic nie wie.", "Ten dom, zauważyła moja ciotka, jest bardzo drogi."] }, tr: { examples: ["María, dedi Luis, hiçbir şey bilmiyor.", "O ev, dedi teyzem, çok pahalı."] }, id: { examples: ["María, kata Luis, tidak tahu apa-apa.", "Rumah itu, komentar bibiku, sangat mahal."] }, vi: { examples: ["María, Luis nói, không biết gì cả.", "Ngôi nhà đó, dì tôi nhận xét, rất đắt."] } }
          - level: C1
            variety: es-419
            context: { es: "Pregunta, en las Antillas, Panamá y Venezuela", en: "Question, in the Antilles, Panama and Venezuela", uk: "Питання на Антильських островах, у Панамі та Венесуелі", pt: "Pergunta, nas Antilhas, no Panamá e na Venezuela", fr: "Question, aux Antilles, au Panama et au Venezuela", de: "Frage, auf den Antillen, in Panama und Venezuela", it: "Domanda, nelle Antille, a Panama e in Venezuela", pl: "Pytanie na Antylach, w Panamie i Wenezueli", tr: "Antiller’de, Panama’da ve Venezuela’da soru", id: "Pertanyaan di Antilla, Panama, dan Venezuela", vi: "Câu hỏi ở quần đảo Antilles, Panama và Venezuela" }
            rule: { es: "El pronombre sujeto puede ir delante del verbo.", en: "The subject pronoun can go before the verb.", uk: "Займенник-підмет може стояти перед дієсловом.", pt: "O pronome sujeito pode ir antes do verbo.", fr: "Le pronom sujet peut se placer devant le verbe.", de: "Das Subjektpronomen kann vor dem Verb stehen.", it: "Il pronome soggetto può stare davanti al verbo.", pl: "Zaimek w roli podmiotu może stać przed czasownikiem.", tr: "Özne zamiri fiilin önüne gelebilir.", id: "Kata ganti subjek dapat berada di depan kata kerja.", vi: "Đại từ chủ ngữ có thể đứng trước động từ." }
            ex: { examples: [["¿", { target: "Qué tú dices" }, "?"], ["¿", { target: "Cómo tú te llamas" }, "?"]] }
            tr: { en: { examples: ["What are you saying?", "What is your name?"] }, uk: { examples: ["Що ти кажеш?", "Як тебе звати?"] }, pt: { examples: ["O que você está dizendo?", "Como você se chama?"] }, fr: { examples: ["Qu’est-ce que tu dis ?", "Comment tu t’appelles ?"] }, de: { examples: ["Was sagst du?", "Wie heißt du?"] }, it: { examples: ["Che cosa dici?", "Come ti chiami?"] }, pl: { examples: ["Co mówisz?", "Jak masz na imię?"] }, tr: { examples: ["Ne diyorsun?", "Adın ne?"] }, id: { examples: ["Kamu bilang apa?", "Siapa namamu?"] }, vi: { examples: ["Bạn nói gì?", "Bạn tên là gì?"] } }
      - type: list
        items:
          - type: note
            level: B2
            text: { es: ["Los determinantes y los cuantificadores del sujeto: ver ", { link: El artículo, to: es.sustantivo-determinantes.articulos }, "."], en: ["Determiners and quantifiers of the subject: see ", { link: "Articles", to: es.sustantivo-determinantes.articulos }, "."], uk: ["Детермінативи й слова кількості при підметі: див. ", { link: "Артиклі", to: es.sustantivo-determinantes.articulos }, "."], pt: ["Os determinantes e os quantificadores do sujeito: veja ", { link: "Artigos", to: es.sustantivo-determinantes.articulos }, "."], fr: ["Les déterminants et les quantificateurs du sujet : voir ", { link: "Articles", to: es.sustantivo-determinantes.articulos }, "."], de: ["Die Begleiter und Mengenwörter des Subjekts: siehe ", { link: "Artikel", to: es.sustantivo-determinantes.articulos }, "."], it: ["I determinanti e i quantificatori del soggetto: vedi ", { link: "Articoli", to: es.sustantivo-determinantes.articulos }, "."], pl: ["Określniki i określniki ilości przy podmiocie: zob. ", { link: "Przedimki", to: es.sustantivo-determinantes.articulos }, "."], tr: ["Öznenin belirleyicileri ve miktar sözcükleri: bkz. ", { link: "Artikeller", to: es.sustantivo-determinantes.articulos }, "."], id: ["Determiner dan kata penunjuk jumlah pada subjek: lihat ", { link: "Artikel", to: es.sustantivo-determinantes.articulos }, "."], vi: ["Từ hạn định và lượng từ của chủ ngữ: xem ", { link: "Mạo từ", to: es.sustantivo-determinantes.articulos }, "."] }

  - title: { es: Tema y pronombre átono, en: "Topic and unstressed pronoun", uk: "Тема й ненаголошений займенник", pt: "Tema e pronome átono", fr: "Thème et pronom atone", de: "Thema und unbetontes Pronomen", it: "Tema e pronome atono", pl: "Temat i zaimek nieakcentowany", tr: "Konu ve vurgusuz zamir", id: "Topik dan kata ganti tanpa tekanan", vi: "Chủ đề và đại từ không nhấn" }
    role: use
    content:
      - type: usage
        columns:
          - { key: order, label: { es: Orden, en: "Order", uk: "Порядок", pt: "Ordem", fr: "Ordre", de: "Reihenfolge", it: "Ordine", pl: "Kolejność", tr: "Sıra", id: "Urutan", vi: "Thứ tự" } }
          - { key: does, label: { es: Qué hace, en: "What it does", uk: "Що робить", pt: "O que faz", fr: "Ce qu’il fait", de: "Funktion", it: "Che cosa fa", pl: "Co robi", tr: "İşlevi", id: "Fungsinya", vi: "Chức năng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            order: { pattern: [{ slot: { es: objeto directo, en: "direct object", uk: "прямий додаток", pt: "objeto direto", fr: "COD", de: "direktes Objekt", it: "complemento diretto", pl: "dopełnienie bliższe", tr: "doğrudan nesne", id: "objek langsung", vi: "tân ngữ trực tiếp" } }, { slot: { es: pronombre átono, en: "unstressed pronoun", uk: "ненаголошений займенник", pt: "pronome átono", fr: "pronom atone", de: "unbetontes Pronomen", it: "pronome atono", pl: "zaimek nieakcentowany", tr: "vurgusuz zamir", id: "kata ganti tanpa tekanan", vi: "đại từ không nhấn" } }, { slot: verb }, { slot: subject }] }
            does: { es: "El objeto conocido abre la oración como tema, y el pronombre átono lo recoge.", en: "The known object opens the sentence as the topic, and the unstressed pronoun picks it up.", uk: "Відомий додаток відкриває речення як тема, а ненаголошений займенник його підхоплює.", pt: "O objeto conhecido abre a frase como tema, e o pronome átono o retoma.", fr: "L’objet connu ouvre la phrase comme thème, et le pronom atone le reprend.", de: "Das bekannte Objekt eröffnet den Satz als Thema, und das unbetonte Pronomen nimmt es wieder auf.", it: "Il complemento noto apre la frase come tema, e il pronome atono lo riprende.", pl: "Znane dopełnienie otwiera zdanie jako temat, a zaimek nieakcentowany je podejmuje.", tr: "Bilinen nesne cümleyi konu olarak açar, vurgusuz zamir de onu yeniden anar.", id: "Objek yang sudah dikenal membuka kalimat sebagai topik, dan kata ganti tanpa tekanan merujuknya kembali.", vi: "Tân ngữ đã biết mở đầu câu như một chủ đề, và đại từ không nhấn nhắc lại nó." }
            ex: { examples: [["Los libros ", { target: los }, " tiene Juan."], ["La llave ", { target: la }, " tengo yo."]] }
            tr: { en: { examples: ["Juan has the books.", "I have the key."] }, uk: { examples: ["Книжки має Хуан.", "Ключ у мене."] }, pt: { examples: ["Os livros quem tem é o Juan.", "A chave quem tem sou eu."] }, fr: { examples: ["Les livres, Juan les a.", "La clé, c’est moi qui l’ai."] }, de: { examples: ["Die Bücher hat Juan.", "Den Schlüssel habe ich."] }, it: { examples: ["I libri li ha Juan.", "La chiave ce l’ho io."] }, pl: { examples: ["Książki ma Juan.", "Klucz mam ja."] }, tr: { examples: ["Kitaplar Juan’da.", "Anahtar bende."] }, id: { examples: ["Buku-buku itu dipegang Juan.", "Kuncinya saya yang pegang."] }, vi: { examples: ["Những cuốn sách đó thì Juan có.", "Chìa khóa thì tôi giữ."] } }
          - level: B2
            order: { es: "Tema dicho aparte", en: "Topic said on its own", uk: "Тема, сказана окремо", pt: "Tema dito à parte", fr: "Thème dit à part", de: "Thema für sich gesagt", it: "Tema detto a parte", pl: "Temat wypowiedziany osobno", tr: "Ayrı söylenen konu", id: "Topik yang diucapkan terpisah", vi: "Chủ đề nói riêng ra" }
            does: { es: "El tema va solo, y la oración siguiente lo recoge con el pronombre átono.", en: "The topic stands alone, and the next sentence picks it up with the unstressed pronoun.", uk: "Тема стоїть окремо, а наступне речення підхоплює її ненаголошеним займенником.", pt: "O tema vem sozinho, e a frase seguinte o retoma com o pronome átono.", fr: "Le thème se dit seul, et la phrase suivante le reprend avec le pronom atone.", de: "Das Thema steht allein, und der nächste Satz nimmt es mit dem unbetonten Pronomen auf.", it: "Il tema sta da solo, e la frase successiva lo riprende con il pronome atono.", pl: "Temat stoi osobno, a następne zdanie podejmuje go zaimkiem nieakcentowanym.", tr: "Konu tek başına söylenir, sonraki cümle onu vurgusuz zamirle yeniden anar.", id: "Topik berdiri sendiri, dan kalimat berikutnya merujuknya dengan kata ganti tanpa tekanan.", vi: "Chủ đề đứng riêng, và câu sau nhắc lại nó bằng đại từ không nhấn." }
            ex: ["Mis ejercicios. No ", { target: los }, " veo."]
            tr: { en: "My exercises. I don’t see them.", uk: "Мої вправи. Я їх не бачу.", pt: "Meus exercícios. Não os vejo.", fr: "Mes exercices. Je ne les vois pas.", de: "Meine Übungen. Ich sehe sie nicht.", it: "I miei esercizi. Non li vedo.", pl: "Moje ćwiczenia. Nie widzę ich.", tr: "Alıştırmalarım. Onları göremiyorum.", id: "Latihan saya. Saya tidak melihatnya.", vi: "Bài tập của tôi. Tôi không thấy chúng." }
          - level: B2
            order: { es: ["Tema y ", { term: ni }, " o ", { term: nunca }], en: ["Topic and ", { term: ni }, " or ", { term: nunca }], uk: ["Тема і ", { term: ni }, " чи ", { term: nunca }], pt: ["Tema e ", { term: ni }, " ou ", { term: nunca }], fr: ["Thème et ", { term: ni }, " ou ", { term: nunca }], de: ["Thema und ", { term: ni }, " oder ", { term: nunca }], it: ["Tema e ", { term: ni }, " o ", { term: nunca }], pl: ["Temat i ", { term: ni }, " lub ", { term: nunca }], tr: ["Konu ve ", { term: ni }, " ya da ", { term: nunca }], id: ["Topik dan ", { term: ni }, " atau ", { term: nunca }], vi: ["Chủ đề và ", { term: ni }, " hoặc ", { term: nunca }] }
            does: { es: "Con una palabra negativa de foco, el pronombre átono sigue siendo obligatorio.", en: "With a negative word in focus, the unstressed pronoun is still required.", uk: "Із заперечним словом у фокусі ненаголошений займенник усе одно обов’язковий.", pt: "Com uma palavra negativa de foco, o pronome átono continua obrigatório.", fr: "Avec un mot négatif en position de focalisation, le pronom atone reste obligatoire.", de: "Mit einem verneinenden Fokuswort bleibt das unbetonte Pronomen Pflicht.", it: "Con una parola negativa in focus, il pronome atono resta obbligatorio.", pl: "Przy słowie przeczącym w ognisku zaimek nieakcentowany pozostaje obowiązkowy.", tr: "Odaktaki olumsuz sözcükle birlikte vurgusuz zamir yine zorunludur.", id: "Dengan kata negatif pada fokus, kata ganti tanpa tekanan tetap wajib.", vi: "Với từ phủ định ở tiêu điểm, đại từ không nhấn vẫn bắt buộc." }
            ex: { examples: [["El alcohol ni ", { target: lo }, " prueba."], ["Esa canción nunca ", { target: la }, " he cantado."]] }
            tr: { en: { examples: ["He doesn’t even touch alcohol.", "I have never sung that song."] }, uk: { examples: ["Алкоголю він навіть не куштує.", "Цієї пісні я ніколи не співав."] }, pt: { examples: ["Álcool ele nem prova.", "Essa música eu nunca cantei."] }, fr: { examples: ["L’alcool, il n’y touche même pas.", "Cette chanson, je ne l’ai jamais chantée."] }, de: { examples: ["Alkohol rührt er nicht einmal an.", "Dieses Lied habe ich nie gesungen."] }, it: { examples: ["L’alcol non lo tocca nemmeno.", "Quella canzone non l’ho mai cantata."] }, pl: { examples: ["Alkoholu nawet nie tyka.", "Tej piosenki nigdy nie śpiewałem."] }, tr: { examples: ["Alkole dokunmaz bile.", "O şarkıyı hiç söylemedim."] }, id: { examples: ["Alkohol pun tidak disentuhnya.", "Lagu itu tidak pernah saya nyanyikan."] }, vi: { examples: ["Rượu thì anh ấy còn không đụng tới.", "Bài hát đó tôi chưa bao giờ hát."] } }
          - level: B2
            order: { es: "Pregunta o exclamación con el objeto delante", en: "Question or exclamation with the object in front", uk: "Питання чи окличне речення з додатком на початку", pt: "Pergunta ou exclamação com o objeto na frente", fr: "Question ou exclamation avec l’objet en tête", de: "Frage oder Ausruf mit vorangestelltem Objekt", it: "Domanda o esclamazione con il complemento davanti", pl: "Pytanie lub wykrzyknienie z dopełnieniem na początku", tr: "Nesnenin başta olduğu soru veya ünlem", id: "Pertanyaan atau seruan dengan objek di depan", vi: "Câu hỏi hoặc câu cảm thán có tân ngữ đứng đầu" }
            does: { es: "El interrogativo o el exclamativo es el objeto, y no hay pronombre átono.", en: "The question or exclamation word is the object, and there is no unstressed pronoun.", uk: "Питальне чи окличне слово є додатком, і ненаголошеного займенника немає.", pt: "O interrogativo ou o exclamativo é o objeto, e não há pronome átono.", fr: "Le mot interrogatif ou exclamatif est l’objet, et il n’y a pas de pronom atone.", de: "Das Frage- oder Ausrufewort ist das Objekt, und es steht kein unbetontes Pronomen.", it: "La parola interrogativa o esclamativa è il complemento, e non c’è il pronome atono.", pl: "Wyraz pytający lub wykrzyknikowy jest dopełnieniem i nie ma zaimka nieakcentowanego.", tr: "Soru ya da ünlem sözcüğü nesnedir ve vurgusuz zamir yoktur.", id: "Kata tanya atau kata seru adalah objeknya, dan tidak ada kata ganti tanpa tekanan.", vi: "Từ để hỏi hoặc từ cảm thán là tân ngữ, và không có đại từ không nhấn." }
            ex: { examples: [["¿", { target: "Qué regalo has comprado" }, "?"], ["¡", { target: "Qué regalo has comprado" }, "!"]] }
            tr: { en: { examples: ["What present have you bought?", "What a present you have bought!"] }, uk: { examples: ["Який подарунок ти купив?", "Який подарунок ти купив!"] }, pt: { examples: ["Que presente você comprou?", "Que presente você comprou!"] }, fr: { examples: ["Quel cadeau as-tu acheté ?", "Quel cadeau tu as acheté !"] }, de: { examples: ["Welches Geschenk hast du gekauft?", "Was für ein Geschenk du gekauft hast!"] }, it: { examples: ["Che regalo hai comprato?", "Che regalo hai comprato!"] }, pl: { examples: ["Jaki prezent kupiłeś?", "Jaki prezent kupiłeś!"] }, tr: { examples: ["Hangi hediyeyi aldın?", "Ne hediye almışsın!"] }, id: { examples: ["Hadiah apa yang kamu beli?", "Wah, hadiah yang kamu beli!"] }, vi: { examples: ["Bạn đã mua món quà nào?", "Bạn đã mua quà gì thế!"] } }
          - level: C1
            order: { pattern: [{ slot: { es: nombre sin determinante, en: "noun without a determiner", uk: "іменник без детермінатива", pt: "substantivo sem determinante", fr: "nom sans déterminant", de: "Nomen ohne Begleiter", it: "sostantivo senza determinante", pl: "rzeczownik bez określnika", tr: "belirleyicisiz isim", id: "kata benda tanpa determiner", vi: "danh từ không có từ hạn định" } }, { slot: verb }, { slot: { es: indefinido, en: "indefinite", uk: "неозначений займенник", pt: "indefinido", fr: "indéfini", de: "Indefinitpronomen", it: "indefinito", pl: "zaimek nieokreślony", tr: "belgisiz sözcük", id: "kata tak tentu", vi: "từ bất định" } }] }
            does: { es: "Un nombre sin determinante abre la oración como tema, y un indefinido lo recoge.", en: "A noun without a determiner opens the sentence as the topic, and an indefinite picks it up.", uk: "Іменник без детермінатива відкриває речення як тема, а неозначений займенник його підхоплює.", pt: "Um substantivo sem determinante abre a frase como tema, e um indefinido o retoma.", fr: "Un nom sans déterminant ouvre la phrase comme thème, et un indéfini le reprend.", de: "Ein Nomen ohne Begleiter eröffnet den Satz als Thema, und ein Indefinitpronomen nimmt es auf.", it: "Un sostantivo senza determinante apre la frase come tema, e un indefinito lo riprende.", pl: "Rzeczownik bez określnika otwiera zdanie jako temat, a zaimek nieokreślony go podejmuje.", tr: "Belirleyicisiz bir isim cümleyi konu olarak açar, belgisiz bir sözcük de onu yeniden anar.", id: "Kata benda tanpa determiner membuka kalimat sebagai topik, dan kata tak tentu merujuknya kembali.", vi: "Danh từ không có từ hạn định mở đầu câu như một chủ đề, và một từ bất định nhắc lại nó." }
            ex: { examples: [["Abrigo, ", { target: "tengo uno" }, " viejo."], ["Libros, ", { target: "ya tengo bastantes" }, "."]] }
