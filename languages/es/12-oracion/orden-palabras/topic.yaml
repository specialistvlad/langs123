          - level: C1
            order: { es: "Tema y pregunta", en: "Topic and question", uk: "Тема і питання", pt: "Tema e pergunta", fr: "Thème et question", de: "Thema und Frage", it: "Tema e domanda", pl: "Temat i pytanie", tr: "Konu ve soru", id: "Topik dan pertanyaan", vi: "Chủ đề và câu hỏi" }
            does: { es: "El tema abre la pregunta, y el pronombre átono lo recoge dentro de ella.", en: "The topic opens the question, and the unstressed pronoun picks it up inside it.", uk: "Тема відкриває питання, а ненаголошений займенник підхоплює її всередині питання.", pt: "O tema abre a pergunta, e o pronome átono o retoma dentro dela.", fr: "Le thème ouvre la question, et le pronom atone le reprend à l’intérieur.", de: "Das Thema eröffnet die Frage, und das unbetonte Pronomen nimmt es in ihr wieder auf.", it: "Il tema apre la domanda, e il pronome atono lo riprende al suo interno.", pl: "Temat otwiera pytanie, a zaimek nieakcentowany podejmuje go wewnątrz pytania.", tr: "Konu soruyu açar, vurgusuz zamir de onu soru içinde yeniden anar.", id: "Topik membuka pertanyaan, dan kata ganti tanpa tekanan merujuknya kembali di dalam pertanyaan.", vi: "Chủ đề mở đầu câu hỏi, và đại từ không nhấn nhắc lại nó bên trong câu hỏi." }
