          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            pattern: { pattern: [{ term: con lo que }, { slot: { es: verbo en indicativo, en: "verb in the indicative", uk: "дієслово в дійсному способі", pt: "verbo no indicativo", fr: "verbe à l’indicatif", de: "Verb im Indikativ", it: "verbo all'indicativo", pl: "czasownik w trybie oznajmującym", tr: "haber kipinde fiil", id: "kata kerja dalam indikatif", vi: "động từ ở thức chỉ định" } }] }
            ex: { examples: [[{ target: "Con lo que" }, " llueve, ¿vas a salir?"], [{ target: "Con lo que" }, " estudió y suspendió el examen."]] }
            tr: { en: { examples: ["With all this rain, are you going out?", "For all he studied, he still failed the exam."] }, uk: { examples: ["Під таким дощем ти збираєшся виходити?", "Скільки він учив, а іспит усе одно завалив."] }, pt: { examples: ["Com a chuva que está caindo, você vai sair?", "Com tudo o que estudou, ainda assim foi reprovado no exame."] }, fr: { examples: ["Avec la pluie qu’il fait, tu vas sortir ?", "Avec tout ce qu’il a étudié, il a quand même raté l’examen."] }, de: { examples: ["Bei dem Regen willst du rausgehen?", "Bei allem, was er gelernt hat, ist er trotzdem durch die Prüfung gefallen."] }, it: { examples: ["Con tutta la pioggia che cade, esci lo stesso?", "Con tutto quello che ha studiato, è stato comunque bocciato all'esame."] }, pl: { examples: ["Przy takim deszczu zamierzasz wyjść?", "Tyle się uczył, a i tak oblał egzamin."] }, tr: { examples: ["Bu kadar yağmur yağarken dışarı mı çıkacaksın?", "Bu kadar çalışmasına rağmen sınavdan kaldı."] }, id: { examples: ["Dengan hujan sederas ini, kamu mau keluar?", "Dengan semua yang sudah dia pelajari, dia tetap gagal dalam ujian."] }, vi: { examples: ["Mưa nhiều thế này mà bạn vẫn định ra ngoài sao?", "Học nhiều như vậy mà anh ấy vẫn trượt kỳ thi."] } }
          - level: C1
            pattern: { pattern: [con, { alternatives: [el, la, lo] }, { slot: noun }, que, { slot: clause }] }
            ex: [{ target: "Con el frío que" }, " hace, sales sin abrigo."]
            tr: { en: "With how cold it is, you go out without a coat.", uk: "При такому холоді ти виходиш без куртки.", pt: "Com o frio que está fazendo, você sai sem casaco.", fr: "Avec le froid qu’il fait, tu sors sans manteau.", de: "Bei der Kälte gehst du ohne Mantel aus.", it: "Con il freddo che fa, esci senza cappotto.", pl: "Przy takim zimnie wychodzisz bez płaszcza.", tr: "Bu kadar soğukta paltosuz çıkıyorsun.", id: "Dengan udara sedingin ini, kamu keluar tanpa mantel.", vi: "Trời lạnh thế này mà bạn vẫn ra ngoài không mặc áo khoác." }
          - level: C1
            pattern: { pattern: [con, la de, { slot: plural noun }, que, { slot: clause }] }
            ex: [{ target: "Con la de zapatos que" }, " tienes, te pones los rotos."]
            tr: { en: "With all the shoes you have, you wear the broken ones.", uk: "Стільки в тебе взуття, а ти взуваєш порване.", pt: "Com tantos sapatos que você tem, ainda calça os furados.", fr: "Avec toutes les chaussures que tu as, tu mets celles qui sont trouées.", de: "Bei den vielen Schuhen, die du hast, ziehst du die kaputten an.", it: "Con tutte le scarpe che hai, metti quelle rotte.", pl: "Masz tyle butów, a zakładasz te zniszczone.", tr: "Bu kadar ayakkabın varken yırtık olanları giyiyorsun.", id: "Dengan sepatu sebanyak itu, kamu malah memakai yang rusak.", vi: "Có bao nhiêu là giày mà bạn lại đi đôi rách." }

