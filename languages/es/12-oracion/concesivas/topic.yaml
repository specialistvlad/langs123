            tr: { en: { examples: ["Even though my head hurts, I'm going to work.", "Although it's raining, I'm going to run."] }, uk: { examples: ["Хоча в мене болить голова, я йду на роботу.", "Хоча йде дощ, я піду бігати."] }, pt: { examples: ["Embora esteja com dor de cabeça, vou trabalhar.", "Embora esteja chovendo, vou correr."] }, fr: { examples: ["Même si j’ai mal à la tête, je vais travailler.", "Même s’il pleut, je vais courir."] }, de: { examples: ["Obwohl ich Kopfschmerzen habe, gehe ich arbeiten.", "Obwohl es regnet, gehe ich laufen."] }, it: { examples: ["Anche se mi fa male la testa, vado a lavorare.", "Anche se piove, vado a correre."] }, pl: { examples: ["Chociaż boli mnie głowa, idę do pracy.", "Chociaż pada, idę biegać."] }, tr: { examples: ["Başım ağrısa da işe gidiyorum.", "Yağmur yağıyor olmasına rağmen koşmaya gideceğim."] }, id: { examples: ["Meskipun kepala saya sakit, saya tetap pergi bekerja.", "Meskipun sedang hujan, saya akan berlari."] }, vi: { examples: ["Dù đầu tôi đau, tôi vẫn đi làm.", "Dù trời đang mưa, tôi vẫn sẽ đi chạy."] } }
          - level: B2
