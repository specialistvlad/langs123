            meaning: { es: "una hipótesis poco probable", en: "an unlikely hypothesis", uk: "малоймовірна гіпотеза", pt: "uma hipótese pouco provável", fr: "une hypothèse peu probable", de: "eine wenig wahrscheinliche Hypothese", it: "un'ipotesi poco probabile", pl: "mało prawdopodobna hipoteza", tr: "pek olası olmayan bir varsayım", id: "hipotesis yang kecil kemungkinannya", vi: "một giả thuyết ít có khả năng xảy ra" }
            ex: ["Aunque me lo ", { target: pidieras }, " mil veces, no lo haría."]
            tr: { en: "Even if you asked me a thousand times, I wouldn't do it.", uk: "Навіть якби ти просив мене тисячу разів, я б цього не зробив.", pt: "Mesmo que você me pedisse mil vezes, eu não faria isso.", fr: "Même si tu me le demandais mille fois, je ne le ferais pas.", de: "Auch wenn du mich tausendmal darum bitten würdest, würde ich es nicht tun.", it: "Anche se me lo chiedessi mille volte, non lo farei.", pl: "Nawet gdybyś prosił mnie tysiąc razy, nie zrobiłbym tego.", tr: "Benden bunu bin kez isteseydin de yapmazdım.", id: "Seandainya kamu memintanya seribu kali pun, saya tidak akan melakukannya.", vi: "Giả sử bạn có nhờ tôi cả nghìn lần, tôi cũng sẽ không làm." }
