            ex: { examples: [[{ target: "Venga quien venga" }, ", no abras."], [{ target: "Vayas donde vayas" }, ", te encontraré."], [{ target: "Sea como sea" }, ", lo termino hoy."]] }
            tr: { en: { examples: ["Whoever comes, don't open the door.", "Wherever you go, I'll find you.", "One way or another, I'm finishing it today."] }, uk: { examples: ["Хто б не прийшов, не відчиняй.", "Куди б ти не пішов, я тебе знайду.", "Так чи інакше, я закінчу це сьогодні."] }, pt: { examples: ["Venha quem vier, não abra.", "Aonde quer que você vá, eu vou te encontrar.", "Seja como for, eu termino isso hoje."] }, fr: { examples: ["Qui que ce soit qui vienne, n’ouvre pas.", "Où que tu ailles, je te retrouverai.", "Quoi qu’il en soit, je le termine aujourd’hui."] }, de: { examples: ["Wer auch kommt, mach nicht auf.", "Wohin du auch gehst, werde ich dich finden.", "Wie dem auch sei, mache ich es heute fertig."] }, it: { examples: ["Chiunque venga, non aprire.", "Ovunque tu vada, ti troverò.", "Comunque sia, lo finisco oggi."] }, pl: { examples: ["Ktokolwiek przyjdzie, nie otwieraj.", "Dokądkolwiek pójdziesz, znajdę cię.", "Tak czy inaczej, skończę to dzisiaj."] }, tr: { examples: ["Kim gelirse gelsin, açma.", "Nereye gidersen git seni bulacağım.", "Her ne olursa olsun bugün bitireceğim."] }, id: { examples: ["Siapa pun yang datang, jangan dibuka.", "Ke mana pun kamu pergi, saya akan menemukanmu.", "Bagaimanapun caranya, saya akan menyelesaikannya hari ini."] }, vi: { examples: ["Dù ai đến, bạn cũng đừng mở cửa.", "Dù bạn đi đâu, tôi cũng sẽ tìm thấy bạn.", "Dù thế nào đi nữa, hôm nay tôi cũng sẽ làm xong."] } }
          - level: C2
            pattern: { pattern: [{ term: ya }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }, { term: ya }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }] }
            ex: [{ target: "Ya llore, ya grite" }, ", no cambiaré de opinión."]
            tr: { en: "Whether she cries or shouts, I won't change my mind.", uk: "Плаче вона чи кричить, я не передумаю.", pt: "Quer ela chore, quer grite, não vou mudar de opinião.", fr: "Qu’elle pleure ou qu’elle crie, je ne changerai pas d’avis.", de: "Ob sie weint oder schreit, ändere ich meine Meinung nicht.", it: "Che pianga o che gridi, non cambierò idea.", pl: "Czy będzie płakać, czy krzyczeć, nie zmienię zdania.", tr: "İster ağlasın ister bağırsın fikrimi değiştirmeyeceğim.", id: "Entah dia menangis atau berteriak, saya tidak akan mengubah pendapat saya.", vi: "Dù cô ấy khóc hay la hét, tôi cũng sẽ không đổi ý." }
          - level: C2
            pattern: { pattern: [{ term: que }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }, { term: o que }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }] }
            ex: [{ target: "Que lo diga o que lo calle" }, ", me da igual."]
            tr: { en: "Whether he says it or keeps quiet, I don't care.", uk: "Скаже він це чи промовчить, мені байдуже.", pt: "Quer ele diga isso, quer fique calado, para mim tanto faz.", fr: "Qu’il le dise ou qu’il se taise, ça m’est égal.", de: "Ob er es sagt oder verschweigt, ist es mir egal.", it: "Che lo dica o che lo taccia, per me è lo stesso.", pl: "Czy to powie, czy zachowa dla siebie, jest mi to obojętne.", tr: "Söylese de söylemese de umurumda değil.", id: "Entah dia mengatakannya atau diam saja, saya tidak peduli.", vi: "Dù anh ấy nói ra hay giữ im lặng, tôi cũng không quan tâm." }

