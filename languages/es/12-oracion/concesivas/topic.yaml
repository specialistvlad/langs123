        rows:
          - level: B2
            linker: a pesar de que
            mood: { es: "indicativo para un hecho real; subjuntivo para una posibilidad", en: "indicative for a real fact; subjunctive for a possibility", uk: "дійсний спосіб для реального факту; суб’юнктив для можливості", pt: "indicativo para um fato real; subjuntivo para uma possibilidade", fr: "indicatif pour un fait réel ; subjonctif pour une possibilité", de: "Indikativ für eine reale Tatsache; Konjunktiv für eine Möglichkeit", it: "indicativo per un fatto reale; congiuntivo per una possibilità", pl: "tryb oznajmujący dla prawdziwego faktu; tryb łączący dla możliwości", tr: "gerçek bir olgu için haber kipi; bir olasılık için dilek kipi", id: "indikatif untuk fakta nyata; subjungtif untuk kemungkinan", vi: "thức chỉ định cho sự việc có thật; thức giả định cho một khả năng" }
