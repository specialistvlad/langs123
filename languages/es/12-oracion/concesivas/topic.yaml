            ex: [{ target: "Porque hables" }, " más fuerte, no tienes más razón."]
            tr: { en: "Just because you speak louder, you're not more right.", uk: "Те, що ти говориш голосніше, не робить тебе правим.", pt: "Só porque você fala mais alto, não tem mais razão.", fr: "Ce n’est pas parce que tu parles plus fort que tu as raison.", de: "Nur weil du lauter sprichst, hast du nicht mehr recht.", it: "Il fatto che tu parli più forte non ti dà ragione.", pl: "To, że mówisz głośniej, nie znaczy, że masz rację.", tr: "Daha yüksek sesle konuşman daha haklı olduğun anlamına gelmez.", id: "Hanya karena kamu bicara lebih keras, bukan berarti kamu lebih benar.", vi: "Chỉ vì bạn nói to hơn thì không có nghĩa là bạn đúng hơn." }
          - level: C2
            linker: por más que
            mood: { es: "subjuntivo, con una negativa firme en la principal", en: "subjunctive, with a firm refusal in the main clause", uk: "суб’юнктив, із рішучою відмовою в головному реченні", pt: "subjuntivo, com uma negativa firme na oração principal", fr: "subjonctif, avec un refus ferme dans la proposition principale", de: "Konjunktiv, mit einer festen Verneinung im Hauptsatz", it: "congiuntivo, con un rifiuto fermo nella frase principale", pl: "tryb łączący, ze stanowczą odmową w zdaniu głównym", tr: "dilek kipi; ana cümlede kesin bir ret bulunur", id: "subjungtif, dengan penolakan tegas di klausa utama", vi: "thức giả định, với lời từ chối dứt khoát ở mệnh đề chính" }
            ex: ["Por más que ", { target: insistas }, ", no pienso ir."]
            tr: { en: "However much you insist, I'm not going.", uk: "Скільки б ти не наполягав, я не піду.", pt: "Por mais que você insista, não penso em ir.", fr: "Tu as beau insister, je n’ai pas l’intention d’y aller.", de: "Du kannst noch so sehr darauf bestehen, ich denke nicht daran hinzugehen.", it: "Per quanto tu insista, non ho intenzione di andare.", pl: "Choćbyś nie wiem jak nalegał, nie zamierzam iść.", tr: "Ne kadar ısrar edersen et gitmeyi düşünmüyorum.", id: "Walaupun kamu terus mendesak, saya tidak berniat pergi.", vi: "Dù bạn có nài nỉ thế nào, tôi cũng không định đi." }
          - level: C2
            linker: a riesgo de que
            mood: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" }
            ex: [{ target: "A riesgo de que" }, " se enfade, voy a decírselo."]
            tr: { en: "Even at the risk of making him angry, I'm going to tell him.", uk: "Навіть ризикуючи його розсердити, я йому це скажу.", pt: "Mesmo correndo o risco de ele se zangar, vou contar a ele.", fr: "Au risque qu’il se fâche, je vais le lui dire.", de: "Auch auf die Gefahr hin, dass er sich ärgert, werde ich es ihm sagen.", it: "A rischio che si arrabbi, glielo dirò lo stesso.", pl: "Ryzykując, że się zdenerwuje, powiem mu to.", tr: "Kızma ihtimaline rağmen ona söyleyeceğim.", id: "Dengan risiko dia marah, saya akan tetap mengatakannya kepadanya.", vi: "Dù có nguy cơ anh ấy nổi giận, tôi vẫn sẽ nói với anh ấy." }
          - level: C2
            linker: { pattern: [tan, { slot: adjective }, como] }
            mood: { es: "indicativo; con tono de reproche", en: "indicative; with a tone of reproach", uk: "дійсний спосіб; із відтінком докору", pt: "indicativo; com tom de reprovação", fr: "indicatif ; sur un ton de reproche", de: "Indikativ; mit vorwurfsvollem Ton", it: "indicativo; con tono di rimprovero", pl: "tryb oznajmujący; z tonem wyrzutu", tr: "haber kipi; sitem tonuyla", id: "indikatif; dengan nada menyalahkan", vi: "thức chỉ định; với giọng trách móc" }
            ex: [{ target: "Tan cerca como" }, " vive y nunca nos visita."]
            tr: { en: "He lives so close, and yet he never visits us.", uk: "Живе так близько, а до нас ніколи не заходить.", pt: "Mora tão perto e nunca vem nos visitar.", fr: "Il habite si près, et il ne nous rend jamais visite.", de: "Er wohnt so nah und besucht uns trotzdem nie.", it: "Abita così vicino e non ci viene mai a trovare.", pl: "Mieszka tak blisko, a nigdy nas nie odwiedza.", tr: "Bu kadar yakında oturuyor, yine de bizi hiç ziyaret etmiyor.", id: "Dia tinggal sedekat itu, tetapi tidak pernah mengunjungi kami.", vi: "Anh ấy sống gần như vậy mà chẳng bao giờ đến thăm chúng tôi." }

