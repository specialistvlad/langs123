            meaning: { es: "una hipótesis dada como información nueva", en: "a hypothesis given as new information", uk: "гіпотеза, подана як нова інформація", pt: "uma hipótese dada como informação nova", fr: "une hypothèse donnée comme information nouvelle", de: "eine Hypothese, die als neue Information gegeben wird", it: "un'ipotesi data come informazione nuova", pl: "hipoteza podana jako nowa informacja", tr: "yeni bilgi olarak verilen bir varsayım", id: "hipotesis yang disampaikan sebagai informasi baru", vi: "một giả thuyết được đưa ra như thông tin mới" }
            ex: ["Aunque ", { target: viviría }, " mejor allí, prefiero quedarme aquí."]
            tr: { en: "Although I would live better there, I prefer to stay here.", uk: "Хоч там мені жилося б краще, я волію залишитися тут.", pt: "Embora eu fosse viver melhor lá, prefiro ficar aqui.", fr: "Je vivrais mieux là-bas, mais je préfère rester ici.", de: "Obwohl ich dort besser leben würde, bleibe ich lieber hier.", it: "Anche se lì vivrei meglio, preferisco restare qui.", pl: "Chociaż żyłbym tam lepiej, wolę zostać tutaj.", tr: "Orada daha iyi yaşayacak olsam da burada kalmayı tercih ederim.", id: "Meskipun saya akan hidup lebih baik di sana, saya lebih suka tinggal di sini.", vi: "Dù ở đó tôi sẽ sống tốt hơn, tôi vẫn thích ở lại đây hơn." }

