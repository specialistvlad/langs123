          - level: B2
            linker: a pesar de
            mood: { es: "sin verbo conjugado: sustantivo o infinitivo", en: "no conjugated verb: a noun or an infinitive", uk: "без дієслова в особовій формі: іменник або інфінітив", pt: "sem verbo conjugado: substantivo ou infinitivo", fr: "sans verbe conjugué : un nom ou un infinitif", de: "ohne konjugiertes Verb: Nomen oder Infinitiv", it: "senza verbo coniugato: sostantivo o infinito", pl: "bez formy osobowej czasownika: rzeczownik lub bezokolicznik", tr: "çekimli fiil yok: isim ya da mastar", id: "tanpa kata kerja terkonjugasi: kata benda atau infinitif", vi: "không có động từ chia: danh từ hoặc nguyên mẫu" }
            ex: { examples: [[{ target: "A pesar del" }, " frío, salimos."], [{ target: "A pesar de" }, " estar enfermo, fue a trabajar."]] }
            tr: { en: { examples: ["Despite the cold, we went out.", "Despite being ill, he went to work."] }, uk: { examples: ["Попри холод, ми вийшли на вулицю.", "Попри хворобу, він пішов на роботу."] }, pt: { examples: ["Apesar do frio, saímos.", "Apesar de estar doente, ele foi trabalhar."] }, fr: { examples: ["Malgré le froid, nous sommes sortis.", "Malgré sa maladie, il est allé travailler."] }, de: { examples: ["Trotz der Kälte sind wir ausgegangen.", "Trotz seiner Krankheit ging er arbeiten."] }, it: { examples: ["Nonostante il freddo, siamo usciti.", "Pur essendo malato, è andato a lavorare."] }, pl: { examples: ["Mimo zimna wyszliśmy.", "Mimo choroby poszedł do pracy."] }, tr: { examples: ["Soğuğa rağmen dışarı çıktık.", "Hasta olmasına rağmen işe gitti."] }, id: { examples: ["Terlepas dari udara yang dingin, kami tetap keluar.", "Walaupun sedang sakit, dia tetap pergi bekerja."] }, vi: { examples: ["Mặc cho trời lạnh, chúng tôi vẫn ra ngoài.", "Dù đang bị ốm, anh ấy vẫn đi làm."] } }
