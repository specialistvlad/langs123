          - level: B2
            features: { mood: sbjv }
            mood: { es: presente de subjuntivo, en: "present subjunctive", uk: "теперішній час суб’юнктива", pt: "presente do subjuntivo", fr: "subjonctif présent", de: "Konjunktiv Präsens", it: "congiuntivo presente", pl: "czas teraźniejszy trybu łączącego", tr: "dilek kipinin şimdiki zamanı", id: "presente subjungtif", vi: "thì hiện tại của thức giả định" }
            meaning: { es: "una posibilidad en el futuro", en: "a possibility in the future", uk: "можливість у майбутньому", pt: "uma possibilidade no futuro", fr: "une possibilité dans le futur", de: "eine Möglichkeit in der Zukunft", it: "una possibilità nel futuro", pl: "możliwość w przyszłości", tr: "gelecekte bir olasılık", id: "kemungkinan di masa depan", vi: "một khả năng trong tương lai" }
