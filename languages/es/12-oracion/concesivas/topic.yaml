          rule: { es: [{ term: si bien }, " y ", { term: aun cuando }, " abren un obstáculo en lengua formal"], en: [{ term: "si bien" }, " and ", { term: "aun cuando" }, " introduce an obstacle in formal language"], uk: [{ term: "si bien" }, " і ", { term: "aun cuando" }, " вводять перешкоду у формальному мовленні"], pt: [{ term: "si bien" }, " e ", { term: "aun cuando" }, " introduzem um obstáculo no registro formal"], fr: [{ term: "si bien" }, " et ", { term: "aun cuando" }, " introduisent un obstacle en langue soutenue"], de: [{ term: "si bien" }, " und ", { term: "aun cuando" }, " leiten ein Hindernis in der formellen Sprache ein"], it: [{ term: "si bien" }, " e ", { term: "aun cuando" }, " introducono un ostacolo nella lingua formale"], pl: [{ term: "si bien" }, " i ", { term: "aun cuando" }, " wprowadzają przeszkodę w języku formalnym"], tr: [{ term: "si bien" }, " ve ", { term: "aun cuando" }, " resmî dilde bir engeli belirtir"], id: [{ term: "si bien" }, " dan ", { term: "aun cuando" }, " memperkenalkan hambatan dalam bahasa formal"], vi: [{ term: "si bien" }, " và ", { term: "aun cuando" }, " nêu một trở ngại trong ngôn ngữ trang trọng"] }
          ex: [{ target: "Si bien" }, " lo sabía, no dijo nada."]
          tr: { en: "Although he knew it, he said nothing.", uk: "Хоча він це знав, він нічого не сказав.", pt: "Embora ele soubesse disso, não disse nada.", fr: "Bien qu’il le sache, il n’a rien dit.", de: "Obgleich er es wusste, sagte er nichts.", it: "Benché lo sapesse, non ha detto nulla.", pl: "Chociaż to wiedział, nic nie powiedział.", tr: "Bunu bilmesine rağmen hiçbir şey söylemedi.", id: "Meskipun dia mengetahuinya, dia tidak mengatakan apa-apa.", vi: "Tuy đã biết điều đó, anh ấy không nói gì." }
        - level: C1
          point: { es: Ponderativas, en: "Emphatic", uk: "Підсилювальні", pt: "Enfáticas", fr: "Emphatiques", de: "Nachdrücklich", it: "Enfatiche", pl: "Wzmacniające", tr: "Vurgulu", id: "Penegas", vi: "Nhấn mạnh" }
          rule: { es: [{ term: con lo que }, " con indicativo pondera la cantidad"], en: [{ term: "con lo que" }, " with the indicative stresses the amount"], uk: [{ term: "con lo que" }, " з дійсним способом підкреслює кількість"], pt: [{ term: "con lo que" }, " com indicativo destaca a quantidade"], fr: [{ term: "con lo que" }, " avec l’indicatif souligne la quantité"], de: [{ term: "con lo que" }, " mit Indikativ hebt die Menge hervor"], it: [{ term: "con lo que" }, " con l'indicativo sottolinea la quantità"], pl: [{ term: "con lo que" }, " z trybem oznajmującym podkreśla ilość"], tr: [{ term: "con lo que" }, " haber kipiyle kullanılınca miktarı vurgular"], id: [{ term: "con lo que" }, " dengan indikatif menekankan jumlah"], vi: [{ term: "con lo que" }, " với thức chỉ định nhấn mạnh số lượng"] }
          ex: [{ target: "Con lo que" }, " llueve, ¿vas a salir?"]
          tr: { en: "With all this rain, are you going out?", uk: "Під таким дощем ти збираєшся виходити?", pt: "Com a chuva que está caindo, você vai sair?", fr: "Avec la pluie qu’il fait, tu vas sortir ?", de: "Bei dem Regen willst du rausgehen?", it: "Con tutta la pioggia che cade, esci lo stesso?", pl: "Przy takim deszczu zamierzasz wyjść?", tr: "Bu kadar yağmur yağarken dışarı mı çıkacaksın?", id: "Dengan hujan sederas ini, kamu mau keluar?", vi: "Mưa nhiều thế này mà bạn vẫn định ra ngoài sao?" }
        - level: C2
          point: { es: Así con subjuntivo, en: [{ term: "Así" }, " with the subjunctive"], uk: [{ term: "Así" }, " із суб’юнктивом"], pt: [{ term: "Así" }, " com subjuntivo"], fr: [{ term: "Así" }, " avec le subjonctif"], de: [{ term: "Así" }, " mit Konjunktiv"], it: [{ term: "Así" }, " con il congiuntivo"], pl: [{ term: "Así" }, " z trybem łączącym"], tr: ["Dilek kipiyle ", { term: "así" }], id: [{ term: "Así" }, " dengan subjungtif"], vi: [{ term: "Así" }, " với thức giả định"] }
          rule: { es: [{ term: así }, " con subjuntivo equivale a ", { term: aunque }, " en el habla informal"], en: [{ term: "así" }, " with the subjunctive means the same as ", { term: "aunque" }, " in informal speech"], uk: [{ term: "así" }, " із суб’юнктивом дорівнює ", { term: "aunque" }, " у неформальному мовленні"], pt: [{ term: "así" }, " com subjuntivo equivale a ", { term: "aunque" }, " no registro informal"], fr: [{ term: "así" }, " avec le subjonctif équivaut à ", { term: "aunque" }, " dans le langage familier"], de: [{ term: "así" }, " mit Konjunktiv entspricht ", { term: "aunque" }, " in der Umgangssprache"], it: [{ term: "así" }, " con il congiuntivo equivale a ", { term: "aunque" }, " nel parlato informale"], pl: [{ term: "así" }, " z trybem łączącym odpowiada ", { term: "aunque" }, " w mowie potocznej"], tr: [{ term: "así" }, " dilek kipiyle gündelik dilde ", { term: "aunque" }, " ile aynı anlama gelir"], id: [{ term: "así" }, " dengan subjungtif sama dengan ", { term: "aunque" }, " dalam bahasa informal"], vi: [{ term: "así" }, " với thức giả định tương đương ", { term: "aunque" }, " trong lối nói thân mật"] }
          ex: ["No lo vendo, ", { target: "así me ofrezcan" }, " un millón."]
          tr: { en: "I won't sell it, even if they offer me a million.", uk: "Я цього не продам, навіть якщо мені запропонують мільйон.", pt: "Não vendo, nem que me ofereçam um milhão.", fr: "Je ne le vends pas, même si on m’offre un million.", de: "Ich verkaufe es nicht, selbst wenn man mir eine Million bietet.", it: "Non lo vendo, nemmeno se mi offrissero un milione.", pl: "Nie sprzedam tego, nawet jeśli zaproponują mi milion.", tr: "Bir milyon teklif etseler bile satmam.", id: "Saya tidak akan menjualnya, sekalipun mereka menawarkan satu juta.", vi: "Tôi không bán nó, dù người ta có trả một triệu." }
        - level: C2
          point: { es: Correlativas, en: "Correlative", uk: "Співвідносні", pt: "Correlativas", fr: "Corrélatives", de: "Korrelative", it: "Correlative", pl: "Korelatywne", tr: "Eşli yapılar", id: "Korelatif", vi: "Cặp tương quan" }
          rule: { es: "dos opciones con subjuntivo: da igual cuál se elija", en: "two options in the subjunctive: it does not matter which one is chosen", uk: "два варіанти в суб’юнктиві: байдуже, який із них вибрати", pt: "duas opções no subjuntivo: tanto faz qual se escolha", fr: "deux options au subjonctif : peu importe laquelle on choisit", de: "zwei Möglichkeiten im Konjunktiv: Es ist egal, welche man wählt", it: "due opzioni al congiuntivo: non importa quale si scelga", pl: "dwie opcje w trybie łączącym: nie ma znaczenia, którą się wybierze", tr: "dilek kipinde iki seçenek: hangisinin seçildiği fark etmez", id: "dua pilihan dalam subjungtif: pilihan mana pun tidak masalah", vi: "hai lựa chọn ở thức giả định: chọn cái nào cũng như nhau" }
          ex: [{ target: "Que lo diga o que lo calle" }, ", me da igual."]
          tr: { en: "Whether he says it or keeps quiet, I don't care.", uk: "Скаже він це чи промовчить, мені байдуже.", pt: "Quer ele diga isso, quer fique calado, para mim tanto faz.", fr: "Qu’il le dise ou qu’il se taise, ça m’est égal.", de: "Ob er es sagt oder verschweigt, ist es mir egal.", it: "Che lo dica o che lo taccia, per me è lo stesso.", pl: "Czy to powie, czy zachowa dla siebie, jest mi to obojętne.", tr: "Söylese de söylemese de umurumda değil.", id: "Entah dia mengatakannya atau diam saja, saya tidak peduli.", vi: "Dù anh ấy nói ra hay giữ im lặng, tôi cũng không quan tâm." }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: [{ term: aunque }, " ya contrasta: no lleva ", { term: pero }], en: [{ term: "aunque" }, " already contrasts: it takes no ", { term: "pero" }], uk: [{ term: "aunque" }, " уже виражає протиставлення: ", { term: "pero" }, " не потрібне"], pt: [{ term: "aunque" }, " já contrasta: não leva ", { term: "pero" }], fr: [{ term: "aunque" }, " marque déjà l’opposition : pas de ", { term: "pero" }], de: [{ term: "aunque" }, " drückt schon den Gegensatz aus: kein ", { term: "pero" }, " dazu"], it: [{ term: "aunque" }, " contrasta già: non vuole ", { term: "pero" }], pl: [{ term: "aunque" }, " już przeciwstawia: nie dodaje się ", { term: "pero" }], tr: [{ term: "aunque" }, " zaten karşıtlık bildirir: ", { term: "pero" }, " almaz"], id: [{ term: "aunque" }, " sudah menyatakan pertentangan: tidak memakai ", { term: "pero" }], vi: [{ term: "aunque" }, " đã diễn tả sự đối lập: không dùng thêm ", { term: "pero" }] }
          ex: [{ target: "Aunque llueve" }, ", salgo."]
          tr: { en: "Although it's raining, I go out.", uk: "Хоча йде дощ, я виходжу.", pt: "Embora esteja chovendo, eu saio.", fr: "Même s’il pleut, je sors.", de: "Obwohl es regnet, gehe ich aus.", it: "Anche se piove, esco.", pl: "Chociaż pada, wychodzę.", tr: "Yağmur yağsa da dışarı çıkıyorum.", id: "Meskipun hujan, saya tetap keluar.", vi: "Dù trời mưa, tôi vẫn ra ngoài." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Una oración concesiva expresa un obstáculo que no impide la acción de la oración principal."
              en: "A concessive clause names an obstacle that does not stop the action of the main clause."
              uk: "Допустове речення називає перешкоду, яка не заважає дії головного речення."
              pt: "Uma oração concessiva expressa um obstáculo que não impede a ação da oração principal."
              fr: "Une proposition concessive exprime un obstacle qui n’empêche pas l’action de la proposition principale."
              de: "Ein Konzessivsatz nennt ein Hindernis, das die Handlung des Hauptsatzes nicht verhindert."
              it: "Una proposizione concessiva esprime un ostacolo che non impedisce l'azione della frase principale."
              pl: "Zdanie przyzwalające wyraża przeszkodę, która nie powstrzymuje czynności zdania głównego."
              tr: "Ödün cümlesi, ana cümledeki eylemi durdurmayan bir engeli bildirir."
              id: "Klausa konsesif menyatakan hambatan yang tidak menghalangi tindakan dalam klausa utama."
              vi: "Mệnh đề nhượng bộ nêu một trở ngại không ngăn được hành động của mệnh đề chính."
            ex: ["Aunque ", { target: "estoy cansada" }, ", salgo con mis amigos."]
            tr: { en: "Although I'm tired, I go out with my friends.", uk: "Хоча я втомлена, я виходжу з друзями.", pt: "Embora eu esteja cansada, saio com meus amigos.", fr: "Même si je suis fatiguée, je sors avec mes amis.", de: "Obwohl ich müde bin, gehe ich mit meinen Freunden aus.", it: "Anche se sono stanca, esco con i miei amici.", pl: "Chociaż jestem zmęczona, wychodzę z przyjaciółmi.", tr: "Yorgun olsam da arkadaşlarımla dışarı çıkıyorum.", id: "Meskipun saya capek, saya tetap keluar bersama teman-teman.", vi: "Dù tôi mệt, tôi vẫn đi chơi với bạn bè." }
          - type: rule
            level: B2
            text:
              es: "Cualquiera de las dos partes puede ir primero; una coma sigue a la concesiva cuando abre la frase."
              en: "Either part can come first; a comma follows the concessive clause when it opens the sentence."
              uk: "Будь-яка частина може йти першою; кома стоїть після допустового речення, коли воно починає речення."
              pt: "Qualquer uma das duas partes pode vir primeiro; uma vírgula vem depois da concessiva quando ela abre a frase."
              fr: "L’une ou l’autre partie peut venir en premier ; une virgule suit la concessive quand elle ouvre la phrase."
              de: "Jeder der beiden Teile kann vorn stehen; ein Komma folgt auf den Konzessivsatz, wenn er den Satz eröffnet."
              it: "Ciascuna delle due parti può venire per prima; una virgola segue la concessiva quando apre il periodo."
              pl: "Każda z dwóch części może stać na początku; przecinek stoi po zdaniu przyzwalającym, gdy otwiera wypowiedzenie."
              tr: "İki bölümden biri başta olabilir; ödün cümlesi cümleyi açıyorsa arkasından virgül gelir."
              id: "Kedua bagian boleh muncul lebih dulu; tanda koma mengikuti klausa konsesif kalau klausa itu membuka kalimat."
              vi: "Phần nào cũng có thể đứng trước; dấu phẩy đứng sau mệnh đề nhượng bộ khi nó mở đầu câu."
            ex: { examples: [[{ target: "Aunque llueve" }, ", salgo."], ["Salgo ", { target: "aunque llueve" }, "."]] }
            tr: { en: { examples: ["Although it's raining, I go out.", "I go out although it's raining."] }, uk: { examples: ["Хоча йде дощ, я виходжу.", "Я виходжу, хоча йде дощ."] }, pt: { examples: ["Embora esteja chovendo, eu saio.", "Eu saio embora esteja chovendo."] }, fr: { examples: ["Même s’il pleut, je sors.", "Je sors même s’il pleut."] }, de: { examples: ["Obwohl es regnet, gehe ich aus.", "Ich gehe aus, obwohl es regnet."] }, it: { examples: ["Anche se piove, esco.", "Esco anche se piove."] }, pl: { examples: ["Chociaż pada, wychodzę.", "Wychodzę, chociaż pada."] }, tr: { examples: ["Yağmur yağsa da dışarı çıkıyorum.", "Dışarı çıkıyorum, yağmur yağsa da."] }, id: { examples: ["Meskipun hujan, saya keluar.", "Saya keluar meskipun hujan."] }, vi: { examples: ["Dù trời mưa, tôi vẫn ra ngoài.", "Tôi vẫn ra ngoài dù trời mưa."] } }
          - type: note
            level: B2
            text:
              es: [{ term: aunque }, " como conector de contraste: ", { link: Los conectores, to: es.oracion.conectores }, "; la condición con ", { term: si }, ": ", { link: Las oraciones condicionales, to: es.oracion.condicionales }, "."]
              en: [{ term: "aunque" }, " as a linker of contrast: ", { link: "Linkers", to: "es.oracion.conectores" }, "; the condition with ", { term: "si" }, ": ", { link: "Conditional Sentences", to: "es.oracion.condicionales" }, "."]
              uk: [{ term: "aunque" }, " як сполучник протиставлення: ", { link: "Сполучні слова", to: "es.oracion.conectores" }, "; умова з ", { term: "si" }, ": ", { link: "Умовні речення", to: "es.oracion.condicionales" }, "."]
              pt: [{ term: "aunque" }, " como conectivo de contraste: ", { link: "Os conectivos", to: "es.oracion.conectores" }, "; a condição com ", { term: "si" }, ": ", { link: "As orações condicionais", to: "es.oracion.condicionales" }, "."]
              fr: [{ term: "aunque" }, " comme connecteur d’opposition : ", { link: "Les connecteurs", to: "es.oracion.conectores" }, " ; la condition avec ", { term: "si" }, " : ", { link: "Les phrases conditionnelles", to: "es.oracion.condicionales" }, "."]
              de: [{ term: "aunque" }, " als Bindewort des Gegensatzes: ", { link: "Die Bindewörter", to: "es.oracion.conectores" }, "; die Bedingung mit ", { term: "si" }, ": ", { link: "Die Bedingungssätze", to: "es.oracion.condicionales" }, "."]
              it: [{ term: "aunque" }, " come connettivo di contrasto: ", { link: "I connettivi", to: "es.oracion.conectores" }, "; la condizione con ", { term: "si" }, ": ", { link: "Il periodo ipotetico", to: "es.oracion.condicionales" }, "."]
              pl: [{ term: "aunque" }, " jako słowo łączące przeciwstawienie: ", { link: "Słowa łączące", to: "es.oracion.conectores" }, "; warunek z ", { term: "si" }, ": ", { link: "Zdania warunkowe", to: "es.oracion.condicionales" }, "."]
              tr: [{ term: "aunque" }, " karşıtlık bağlayıcısı olarak: ", { link: "Bağlayıcılar", to: "es.oracion.conectores" }, "; ", { term: "si" }, " ile koşul: ", { link: "Koşul cümleleri", to: "es.oracion.condicionales" }, "."]
              id: [{ term: "aunque" }, " sebagai kata penghubung pertentangan: ", { link: "Kata penghubung", to: "es.oracion.conectores" }, "; syarat dengan ", { term: "si" }, ": ", { link: "Kalimat bersyarat", to: "es.oracion.condicionales" }, "."]
              vi: [{ term: "aunque" }, " là từ nối đối lập: ", { link: "Từ nối", to: "es.oracion.conectores" }, "; điều kiện với ", { term: "si" }, ": ", { link: "Câu điều kiện", to: "es.oracion.condicionales" }, "."]
          - type: note
            level: B2
            text:
              es: ["Las formas del subjuntivo: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, " y ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, "."]
              en: ["The subjunctive forms: ", { link: "Present Subjunctive: Forms", to: "es.subjuntivo.subjuntivo-formas" }, " and ", { link: "Imperfect Subjunctive", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              uk: ["Форми суб’юнктива: ", { link: "Теперішній час суб’юнктива: форми", to: "es.subjuntivo.subjuntivo-formas" }, " і ", { link: "Імперфект суб’юнктива", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pt: ["As formas do subjuntivo: ", { link: "O presente do subjuntivo: formas", to: "es.subjuntivo.subjuntivo-formas" }, " e ", { link: "O imperfeito do subjuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              fr: ["Les formes du subjonctif : ", { link: "Le présent du subjonctif : formes", to: "es.subjuntivo.subjuntivo-formas" }, " et ", { link: "L’imparfait du subjonctif", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              de: ["Die Formen des Konjunktivs: ", { link: "Der Konjunktiv Präsens: Formen", to: "es.subjuntivo.subjuntivo-formas" }, " und ", { link: "Konjunktiv Imperfecto", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              it: ["Le forme del congiuntivo: ", { link: "Il presente del congiuntivo: forme", to: "es.subjuntivo.subjuntivo-formas" }, " e ", { link: "L'imperfetto del congiuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pl: ["Formy trybu łączącego: ", { link: "Tryb łączący czasu teraźniejszego: formy", to: "es.subjuntivo.subjuntivo-formas" }, " i ", { link: "Imperfecto trybu łączącego", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              tr: ["Dilek kipinin biçimleri: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: "es.subjuntivo.subjuntivo-formas" }, " ve ", { link: "Dilek kipinin imperfecto biçimi", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              id: ["Bentuk-bentuk subjungtif: ", { link: "Presente subjungtif: bentuk", to: "es.subjuntivo.subjuntivo-formas" }, " dan ", { link: "Imperfecto subjungtif", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              vi: ["Các dạng của thức giả định: ", { link: "Thì hiện tại của thức giả định: các dạng", to: "es.subjuntivo.subjuntivo-formas" }, " và ", { link: "Imperfecto của thức giả định", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]

  - title: { es: Aunque con indicativo y con subjuntivo, en: "Aunque with the indicative and the subjunctive", uk: "Aunque з дійсним способом і з суб’юнктивом", pt: "Aunque com indicativo e com subjuntivo", fr: "Aunque avec l’indicatif et avec le subjonctif", de: "Aunque mit Indikativ und mit Konjunktiv", it: "Aunque con l'indicativo e con il congiuntivo", pl: "Aunque z trybem oznajmującym i z trybem łączącym", tr: "Aunque ile haber kipi ve dilek kipi", id: "Aunque dengan indikatif dan dengan subjungtif", vi: "Aunque với thức chỉ định và với thức giả định" }
    role: use
