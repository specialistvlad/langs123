            ex: { examples: [["Salió a correr ", { target: "aun cuando" }, " llovía mucho."], [{ target: "Aun cuando" }, " llueva, saldremos."]] }
            tr: { en: { examples: ["He went out running even when it was raining hard.", "Even when it rains, we'll go out."] }, uk: { examples: ["Він вийшов бігати, навіть коли сильно лило.", "Навіть коли піде дощ, ми вийдемо."] }, pt: { examples: ["Ele saiu para correr mesmo quando chovia muito.", "Mesmo quando chover, nós vamos sair."] }, fr: { examples: ["Il est sorti courir même s’il pleuvait beaucoup.", "Même quand il pleut, nous sortirons."] }, de: { examples: ["Er ging joggen, auch als es stark regnete.", "Auch wenn es regnet, gehen wir aus."] }, it: { examples: ["È uscito a correre anche quando pioveva molto.", "Anche quando piove, usciremo."] }, pl: { examples: ["Wyszedł pobiegać, nawet gdy mocno padało.", "Nawet gdy będzie padać, wyjdziemy."] }, tr: { examples: ["Yağmur çok şiddetli yağarken bile koşmaya çıktı.", "Yağmur yağsa da çıkacağız."] }, id: { examples: ["Dia keluar untuk berlari, bahkan ketika hujan deras.", "Bahkan ketika hujan, kami akan tetap keluar."] }, vi: { examples: ["Anh ấy vẫn ra ngoài chạy bộ, dù trời đang mưa rất to.", "Dù trời có mưa, chúng tôi vẫn sẽ ra ngoài."] } }
          - level: C1
            linker: si bien
            mood: { es: "indicativo; lengua formal", en: "indicative; formal language", uk: "дійсний спосіб; формальне мовлення", pt: "indicativo; registro formal", fr: "indicatif ; langue soutenue", de: "Indikativ; formelle Sprache", it: "indicativo; lingua formale", pl: "tryb oznajmujący; język formalny", tr: "haber kipi; resmî dil", id: "indikatif; bahasa formal", vi: "thức chỉ định; ngôn ngữ trang trọng" }
            ex: [{ target: "Si bien" }, " lo sabía, no dijo nada."]
            tr: { en: "Although he knew it, he said nothing.", uk: "Хоча він це знав, він нічого не сказав.", pt: "Embora ele soubesse disso, não disse nada.", fr: "Bien qu’il le sache, il n’a rien dit.", de: "Obgleich er es wusste, sagte er nichts.", it: "Benché lo sapesse, non ha detto nulla.", pl: "Chociaż to wiedział, nic nie powiedział.", tr: "Bunu bilmesine rağmen hiçbir şey söylemedi.", id: "Meskipun dia mengetahuinya, dia tidak mengatakan apa-apa.", vi: "Tuy đã biết điều đó, anh ấy không nói gì." }
          - level: C1
            linker: { alternatives: [incluso si, ni siquiera si] }
            mood: { es: "imperfecto de subjuntivo para una hipótesis", en: "imperfect subjunctive for a hypothesis", uk: "імперфект суб’юнктива для гіпотези", pt: "imperfeito do subjuntivo para uma hipótese", fr: "imparfait du subjonctif pour une hypothèse", de: "Konjunktiv Imperfecto für eine Hypothese", it: "imperfetto del congiuntivo per un'ipotesi", pl: "imperfecto trybu łączącego dla hipotezy", tr: "bir varsayım için dilek kipinin imperfecto zamanı", id: "imperfecto subjungtif untuk hipotesis", vi: "imperfecto của thức giả định cho một giả thuyết" }
            ex: { examples: [[{ target: "Incluso si" }, " me lo pidiera, no iría."], [{ target: "Ni siquiera si" }, " me lo pidiera, se lo diría."]] }
            tr: { en: { examples: ["Even if he asked me, I wouldn't go.", "Not even if he asked me would I tell him."] }, uk: { examples: ["Навіть якби він мене попросив, я б не пішов.", "Навіть якби він мене про це попросив, я б йому цього не сказав."] }, pt: { examples: ["Mesmo que ele me pedisse, eu não iria.", "Nem mesmo se ele me pedisse eu contaria a ele."] }, fr: { examples: ["Même s’il me le demandait, je n’irais pas.", "Pas même s’il me le demandait, je ne le lui dirais."] }, de: { examples: ["Selbst wenn er mich darum bitten würde, würde ich nicht gehen.", "Nicht einmal, wenn er mich darum bitten würde, würde ich es ihm sagen."] }, it: { examples: ["Anche se me lo chiedesse, non andrei.", "Nemmeno se me lo chiedesse, glielo direi."] }, pl: { examples: ["Nawet gdyby mnie poprosił, nie poszedłbym.", "Nie powiedziałbym mu tego, nawet gdyby mnie o to poprosił."] }, tr: { examples: ["Benden isteseydi bile gitmezdim.", "Rica etseydi bile ona söylemezdim."] }, id: { examples: ["Bahkan seandainya dia memintanya, saya tidak akan pergi.", "Sekalipun dia memintanya, saya tidak akan mengatakannya kepadanya."] }, vi: { examples: ["Dù anh ấy có nhờ tôi, tôi cũng sẽ không đi.", "Ngay cả khi anh ấy có nhờ, tôi cũng sẽ không nói cho anh ấy biết."] } }
