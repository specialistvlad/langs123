summary:
  lead:
    es: ["Las concesivas admiten un obstáculo sin cambiar el resultado: ", { term: aunque }, ", ", { term: a pesar de que }, " y ", { term: por más que }, "."]
    en: ["A concessive clause admits an obstacle without changing the result: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " and ", { term: "por más que" }, "."]
    uk: ["Допустове речення називає перешкоду, яка не змінює результату: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " і ", { term: "por más que" }, "."]
    pt: ["As concessivas admitem um obstáculo sem mudar o resultado: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " e ", { term: "por más que" }, "."]
    fr: ["Les concessives admettent un obstacle sans changer le résultat : ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " et ", { term: "por más que" }, "."]
    de: ["Konzessivsätze räumen ein Hindernis ein, ohne das Ergebnis zu ändern: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " und ", { term: "por más que" }, "."]
    it: ["Le concessive ammettono un ostacolo senza cambiare il risultato: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " e ", { term: "por más que" }, "."]
    pl: ["Zdania przyzwalające dopuszczają przeszkodę, która nie zmienia wyniku: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " i ", { term: "por más que" }, "."]
    tr: ["Ödün cümleleri bir engeli kabul eder ama sonucu değiştirmez: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, " ve ", { term: "por más que" }, "."]
    id: ["Klausa konsesif mengakui adanya hambatan tanpa mengubah hasil: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, ", dan ", { term: "por más que" }, "."]
    vi: ["Mệnh đề nhượng bộ nêu trở ngại, kết quả không đổi: ", { term: "aunque" }, ", ", { term: "a pesar de que" }, ", ", { term: "por más que" }, "."]
  rule:
    es: ["Con indicativo, ", { term: aunque }, " da un dato nuevo; con subjuntivo, un dato conocido o una posibilidad:"]
    en: ["With the indicative, ", { term: "aunque" }, " gives new information; with the subjunctive, a known fact or a possibility:"]
    uk: ["З дійсним способом ", { term: "aunque" }, " повідомляє нову інформацію; із суб’юнктивом — відомий факт або можливість:"]
    pt: ["Com o indicativo, ", { term: "aunque" }, " dá uma informação nova; com o subjuntivo, um fato conhecido ou uma possibilidade:"]
    fr: ["Avec l’indicatif, ", { term: "aunque" }, " donne une information nouvelle ; avec le subjonctif, un fait connu ou une possibilité :"]
    de: ["Mit dem Indikativ gibt ", { term: "aunque" }, " eine neue Information; mit dem Konjunktiv eine bekannte Tatsache oder eine Möglichkeit:"]
    it: ["Con l'indicativo, ", { term: "aunque" }, " dà un'informazione nuova; con il congiuntivo, un fatto noto o una possibilità:"]
    pl: ["Z trybem oznajmującym ", { term: "aunque" }, " podaje nową informację; z trybem łączącym — znany fakt lub możliwość:"]
    tr: ["Haber kipiyle ", { term: "aunque" }, " yeni bir bilgi verir; dilek kipiyle bilinen bir olguyu ya da bir olasılığı anlatır:"]
    id: ["Dengan indikatif, ", { term: "aunque" }, " memberi informasi baru; dengan subjungtif, fakta yang sudah diketahui atau kemungkinan:"]
    vi: ["Với thức chỉ định, ", { term: "aunque" }, " đưa thông tin mới; với thức giả định, điều đã biết hoặc khả năng:"]
  ex: { examples: [["Aunque ", { target: "está lloviendo" }, ", voy a correr."], ["Aunque ", { target: "esté lloviendo" }, ", voy a correr."]] }

