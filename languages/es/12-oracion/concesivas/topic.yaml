            meaning: { es: "un hecho real; información nueva para quien escucha", en: "a real fact; new information for the listener", uk: "реальний факт; нова інформація для того, хто слухає", pt: "um fato real; informação nova para quem escuta", fr: "un fait réel ; une information nouvelle pour celui qui écoute", de: "eine reale Tatsache; neue Information für den Zuhörer", it: "un fatto reale; un'informazione nuova per chi ascolta", pl: "prawdziwy fakt; nowa informacja dla słuchacza", tr: "gerçek bir olgu; dinleyen için yeni bir bilgi", id: "fakta nyata; informasi baru bagi pendengar", vi: "một sự việc có thật; thông tin mới đối với người nghe" }
