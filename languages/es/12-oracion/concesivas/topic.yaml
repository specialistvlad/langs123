            ex: { examples: [["Por más que ", { target: "lo intenté" }, ", no pude abrirla."], ["Por más que ", { target: "lo intente" }, ", no podrá abrirla."]] }
            tr: { en: { examples: ["However hard I tried, I couldn't open it.", "However hard he tries, he won't be able to open it."] }, uk: { examples: ["Хоч як я намагався, я не зміг її відкрити.", "Хоч як він намагатиметься, він не зможе її відкрити."] }, pt: { examples: ["Por mais que eu tentasse, não consegui abri-la.", "Por mais que ele tente, não vai conseguir abri-la."] }, fr: { examples: ["J’ai eu beau essayer, je n’ai pas pu l’ouvrir.", "Il aura beau essayer, il ne pourra pas l’ouvrir."] }, de: { examples: ["So sehr ich es auch versuchte, konnte ich sie nicht öffnen.", "So sehr er es auch versucht, wird er sie nicht öffnen können."] }, it: { examples: ["Per quanto ci abbia provato, non sono riuscito ad aprirla.", "Per quanto ci provi, non riuscirà ad aprirla."] }, pl: { examples: ["Choć bardzo się starałem, nie zdołałem jej otworzyć.", "Choćby bardzo się starał, nie zdoła jej otworzyć."] }, tr: { examples: ["Ne kadar denesem de onu açamadım.", "Ne kadar denerse denesin onu açamayacak."] }, id: { examples: ["Sekeras apa pun saya mencoba, saya tidak bisa membukanya.", "Sekeras apa pun dia mencoba, dia tidak akan bisa membukanya."] }, vi: { examples: ["Dù tôi đã cố gắng thế nào, tôi vẫn không thể mở nó ra.", "Dù anh ấy có cố gắng thế nào, anh ấy cũng sẽ không thể mở nó ra."] } }
