          rule: { es: "una hipótesis, con el condicional en la principal", en: "a hypothesis, with the conditional in the main clause", uk: "гіпотеза, з умовним способом у головному реченні", pt: "uma hipótese, com o condicional na oração principal", fr: "une hypothèse, avec le conditionnel dans la proposition principale", de: "eine Hypothese, mit dem Konditional im Hauptsatz", it: "un'ipotesi, con il condizionale nella frase principale", pl: "hipoteza, z trybem warunkowym w zdaniu głównym", tr: "bir varsayım; ana cümlede koşul kipi kullanılır", id: "hipotesis, dengan kondisional di klausa utama", vi: "một giả thuyết, với thức điều kiện ở mệnh đề chính" }
