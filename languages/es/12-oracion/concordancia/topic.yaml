          rule: { es: "plural si son dos cosas; singular si forman un bloque", en: "the adjective is plural for two things, singular when they form one unit", uk: "прикметник стоїть у множині, якщо речей дві, і в однині, якщо вони становлять єдине ціле", pt: "o adjetivo vai no plural se são duas coisas; no singular se formam um bloco", fr: "l’adjectif est au pluriel pour deux choses, au singulier si elles forment un bloc", de: "das Adjektiv steht im Plural bei zwei Dingen, im Singular, wenn sie eine Einheit bilden", it: "l'aggettivo è al plurale se le cose sono due, al singolare se formano un blocco", pl: "przymiotnik stoi w liczbie mnogiej przy dwóch rzeczach, a w pojedynczej, gdy tworzą całość", tr: "iki ayrı şey varsa sıfat çoğul, bir bütün oluşturuyorlarsa tekil olur", id: "kata sifat berbentuk jamak untuk dua hal, dan tunggal bila keduanya membentuk satu kesatuan", vi: "tính từ ở số nhiều nếu là hai sự vật, ở số ít nếu chúng tạo thành một khối" }
          ex: { examples: [["una conducta y unas palabras ", { target: inaceptables }], ["lengua y literatura ", { target: alemana }]] }
          tr: { en: { examples: ["unacceptable behaviour and words", "German language and literature"] }, uk: { examples: ["неприйнятна поведінка і слова", "німецька мова і література"] }, pt: { examples: ["uma conduta e umas palavras inaceitáveis", "língua e literatura alemã"] }, fr: { examples: ["un comportement et des propos inacceptables", "langue et littérature allemandes"] }, de: { examples: ["unzulässiges Verhalten und unzulässige Worte", "deutsche Sprache und Literatur"] }, it: { examples: ["una condotta e delle parole inaccettabili", "lingua e letteratura tedesca"] }, pl: { examples: ["niedopuszczalne zachowanie i słowa", "język i literatura niemiecka"] }, tr: { examples: ["kabul edilemez davranış ve sözler", "Alman dili ve edebiyatı"] }, id: { examples: ["perilaku dan ucapan yang tidak dapat diterima", "bahasa dan sastra Jerman"] }, vi: { examples: ["hành vi và lời nói không thể chấp nhận", "ngôn ngữ và văn học Đức"] } }
        - level: C2
          point: { es: "Adjetivo y dos nombres", en: "Adjective and two nouns", uk: "Прикметник і два іменники", pt: "Adjetivo e dois substantivos", fr: "Adjectif et deux noms", de: "Adjektiv und zwei Nomen", it: "Aggettivo e due sostantivi", pl: "Przymiotnik i dwa rzeczowniki", tr: "Sıfat ve iki isim", id: "Kata sifat dan dua kata benda", vi: "Tính từ và hai danh từ" }
          rule: { es: "delante, concuerda con el primero; detrás, va en plural", en: "before the nouns it agrees with the first; after them it is plural", uk: "перед іменниками узгоджується з першим, після них стоїть у множині", pt: "antes, concorda com o primeiro; depois, vai no plural", fr: "devant les noms, il s’accorde avec le premier ; après, il est au pluriel", de: "davor richtet es sich nach dem ersten, danach steht es im Plural", it: "davanti concorda con il primo; dopo va al plurale", pl: "przed rzeczownikami zgadza się z pierwszym, po nich stoi w liczbie mnogiej", tr: "isimlerden önce ilkiyle uyum sağlar, sonra gelirse çoğul olur", id: "di depan, mengikuti yang pertama; di belakang, berbentuk jamak", vi: "đứng trước thì hợp với danh từ đầu, đứng sau thì ở số nhiều" }
          ex: { examples: [["su ", { target: asombroso }, " talento y dedicación"], ["su talento y dedicación ", { target: asombrosos }]] }
          tr: { en: { examples: ["his astonishing talent and dedication", "his talent and dedication, both astonishing"] }, uk: { examples: ["його дивовижний талант і відданість", "його талант і відданість, обидва дивовижні"] }, pt: { examples: ["seu assombroso talento e dedicação", "seu talento e dedicação assombrosos"] }, fr: { examples: ["son étonnant talent et dévouement", "son talent et son dévouement étonnants"] }, de: { examples: ["sein erstaunliches Talent und Engagement", "sein Talent und sein Engagement, beide erstaunlich"] }, it: { examples: ["il suo straordinario talento e dedizione", "il suo talento e la sua dedizione straordinari"] }, pl: { examples: ["jego zadziwiający talent i oddanie", "jego talent i oddanie, zadziwiające"] }, tr: { examples: ["onun şaşırtıcı yeteneği ve adanmışlığı", "onun yeteneği ve adanmışlığı, şaşırtıcı"] }, id: { examples: ["bakat dan dedikasi luar biasanya", "bakat dan dedikasinya yang luar biasa"] }, vi: { examples: ["tài năng đáng kinh ngạc và sự cống hiến của anh ấy", "tài năng và sự cống hiến đáng kinh ngạc của anh ấy"] } }
        - level: C2
          point: { es: "Plural de modestia", en: "Plural of modesty", uk: "Множина скромності", pt: "Plural de modéstia", fr: "Pluriel de modestie", de: "Pluralis modestiae", it: "Plurale di modestia", pl: "Pluralis modestiae", tr: "Alçakgönüllülük çoğulu", id: "Jamak kerendahan hati", vi: "Số nhiều khiêm tốn" }
          rule: { es: "un solo hablante usa la primera persona del plural", en: "one speaker uses the first person plural", uk: "один мовець уживає першу особу множини", pt: "um único falante usa a primeira pessoa do plural", fr: "un seul locuteur emploie la première personne du pluriel", de: "ein einzelner Sprecher verwendet die erste Person Plural", it: "un solo parlante usa la prima persona plurale", pl: "jeden mówiący używa pierwszej osoby liczby mnogiej", tr: "tek bir kişi birinci çoğul kişiyi kullanır", id: "satu penutur memakai orang pertama jamak", vi: "một người nói dùng ngôi thứ nhất số nhiều" }
          ex: ["En este trabajo ", { target: analizamos }, " tres casos."]
          tr: { en: "In this paper we analyse three cases.", uk: "У цій роботі ми аналізуємо три випадки.", pt: "Neste trabalho, analisamos três casos.", fr: "Dans ce travail, nous analysons trois cas.", de: "In dieser Arbeit analysieren wir drei Fälle.", it: "In questo lavoro analizziamo tre casi.", pl: "W tej pracy analizujemy trzy przypadki.", tr: "Bu çalışmada üç vakayı inceliyoruz.", id: "Dalam karya tulis ini, kami menganalisis tiga kasus.", vi: "Trong bài viết này, chúng tôi phân tích ba trường hợp." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: [{ term: gente }, " y ", { term: familia }, " llevan el verbo en singular"], en: [{ term: "gente" }, " and ", { term: "familia" }, " take a singular verb"], uk: [{ term: "gente" }, " і ", { term: "familia" }, " вимагають дієслова в однині"], pt: [{ term: "gente" }, " e ", { term: "familia" }, " levam o verbo no singular"], fr: [{ term: "gente" }, " et ", { term: "familia" }, " prennent le verbe au singulier"], de: [{ term: "gente" }, " und ", { term: "familia" }, " verlangen das Verb im Singular"], it: [{ term: "gente" }, " e ", { term: "familia" }, " vogliono il verbo al singolare"], pl: [{ term: "gente" }, " i ", { term: "familia" }, " wymagają czasownika w liczbie pojedynczej"], tr: [{ term: "gente" }, " ve ", { term: "familia" }, " ile fiil tekil olur"], id: [{ term: "gente" }, " dan ", { term: "familia" }, " memakai kata kerja tunggal"], vi: [{ term: "gente" }, " và ", { term: "familia" }, " đi với động từ số ít"] }
          ex: ["La gente ", { target: piensa }, " que el precio es alto."]
          tr: { en: "People think the price is high.", uk: "Люди вважають, що ціна висока.", pt: "As pessoas acham que o preço é alto.", fr: "Les gens pensent que le prix est élevé.", de: "Die Leute finden, dass der Preis hoch ist.", it: "La gente pensa che il prezzo sia alto.", pl: "Ludzie uważają, że cena jest wysoka.", tr: "İnsanlar fiyatın yüksek olduğunu düşünüyor.", id: "Orang-orang berpikir bahwa harganya mahal.", vi: "Mọi người nghĩ rằng giá cao." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["tras ", { term: el grupo de }, ", el verbo va en singular"], en: ["after ", { term: "el grupo de" }, ", the verb is singular"], uk: ["після ", { term: "el grupo de" }, " дієслово стоїть в однині"], pt: ["depois de ", { term: "el grupo de" }, ", o verbo fica no singular"], fr: ["après ", { term: "el grupo de" }, ", le verbe est au singulier"], de: ["nach ", { term: "el grupo de" }, " steht das Verb im Singular"], it: ["dopo ", { term: "el grupo de" }, ", il verbo è al singolare"], pl: ["po ", { term: "el grupo de" }, " czasownik stoi w liczbie pojedynczej"], tr: [{ term: "el grupo de" }, " sonrasında fiil tekil olur"], id: ["setelah ", { term: "el grupo de" }, ", kata kerja berbentuk tunggal"], vi: ["sau ", { term: "el grupo de" }, ", động từ ở số ít"] }
          ex: ["El grupo de políticos ", { target: votó }, " a favor."]
          tr: { en: "The group of politicians voted in favour.", uk: "Група політиків проголосувала «за».", pt: "O grupo de políticos votou a favor.", fr: "Le groupe de politiciens a voté pour.", de: "Die Gruppe von Politikern stimmte dafür.", it: "Il gruppo di politici ha votato a favore.", pl: "Grupa polityków zagłosowała za.", tr: "Politikacı grubu lehte oy kullandı.", id: "Kelompok politikus itu memberikan suara setuju.", vi: "Nhóm chính trị gia đã bỏ phiếu thuận." }

sections:
  - title: { es: "Sujeto colectivo y enumeraciones", en: "Collective subjects and lists", uk: "Збірний підмет і переліки", pt: "Sujeito coletivo e enumerações", fr: "Sujet collectif et énumérations", de: "Kollektive Subjekte und Aufzählungen", it: "Soggetto collettivo ed elenchi", pl: "Podmiot zbiorowy i wyliczenia", tr: "Topluluk öznesi ve sıralamalar", id: "Subjek kolektif dan daftar", vi: "Chủ ngữ tập hợp và liệt kê" }
    role: own
    content:
      - type: usage
        columns:
          - { key: subject, label: { es: Sujeto, en: "Subject", uk: "Підмет", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" } }
          - { key: verb, label: { es: Verbo, en: "Verb", uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            subject: { pattern: [{ slot: { es: sustantivo colectivo, en: "collective noun", uk: "збірний іменник", pt: "substantivo coletivo", fr: "nom collectif", de: "Kollektivum", it: "sostantivo collettivo", pl: "rzeczownik zbiorowy", tr: "topluluk ismi", id: "kata benda kolektif", vi: "danh từ tập hợp" } }, { term: de }, { slot: plural noun }] }
            verb: { es: "singular o plural", en: "singular or plural", uk: "однина або множина", pt: "singular ou plural", fr: "singulier ou pluriel", de: "Singular oder Plural", it: "singolare o plurale", pl: "liczba pojedyncza lub mnoga", tr: "tekil ya da çoğul", id: "tunggal atau jamak", vi: "số ít hoặc số nhiều" }
            ex: { examples: [[{ target: Llegó }, " un grupo de turistas."], [{ target: Llegaron }, " un grupo de turistas."]] }
            tr: { en: { examples: ["A group of tourists arrived.", "A group of tourists arrived."] }, uk: { examples: ["Прибула група туристів.", "Прибула група туристів."] }, pt: { examples: ["Chegou um grupo de turistas.", "Chegou um grupo de turistas."] }, fr: { examples: ["Un groupe de touristes est arrivé.", "Un groupe de touristes est arrivé."] }, de: { examples: ["Eine Gruppe Touristen ist angekommen.", "Eine Gruppe Touristen ist angekommen."] }, it: { examples: ["È arrivato un gruppo di turisti.", "È arrivato un gruppo di turisti."] }, pl: { examples: ["Przyjechała grupa turystów.", "Przyjechała grupa turystów."] }, tr: { examples: ["Bir grup turist geldi.", "Bir grup turist geldi."] }, id: { examples: ["Sekelompok turis datang.", "Sekelompok turis datang."] }, vi: { examples: ["Một nhóm du khách đã đến.", "Một nhóm du khách đã đến."] } }
          - level: B2
            subject: { es: "una enumeración detrás del verbo", en: "a list after the verb", uk: "перелік після дієслова", pt: "uma enumeração depois do verbo", fr: "une énumération après le verbe", de: "eine Aufzählung nach dem Verb", it: "un elenco dopo il verbo", pl: "wyliczenie po czasowniku", tr: "fiilden sonra gelen sıralama", id: "daftar sesudah kata kerja", vi: "một chuỗi liệt kê sau động từ" }
            verb: { es: "singular, con el primer elemento", en: "singular, with the first item", uk: "однина, за першим елементом", pt: "singular, com o primeiro elemento", fr: "singulier, avec le premier élément", de: "Singular, nach dem ersten Glied", it: "singolare, con il primo elemento", pl: "liczba pojedyncza, zgodnie z pierwszym elementem", tr: "tekil, ilk öğeyle uyumlu", id: "tunggal, mengikuti unsur pertama", vi: "số ít, hợp với thành phần đầu tiên" }
            ex: ["Me ", { target: preocupa }, " el ruido, el tráfico y la contaminación."]
            tr: { en: "The noise, the traffic and the pollution worry me.", uk: "Мене турбують шум, рух на дорогах і забруднення.", pt: "Preocupam-me o barulho, o trânsito e a poluição.", fr: "Le bruit, la circulation et la pollution m’inquiètent.", de: "Der Lärm, der Verkehr und die Verschmutzung beunruhigen mich.", it: "Mi preoccupano il rumore, il traffico e l'inquinamento.", pl: "Martwią mnie hałas, ruch uliczny i zanieczyszczenie.", tr: "Gürültü, trafik ve kirlilik beni endişelendiriyor.", id: "Saya khawatir akan kebisingan, lalu lintas, dan polusi.", vi: "Tiếng ồn, giao thông và ô nhiễm làm tôi lo lắng." }
          - level: B2
            subject: { pattern: [{ slot: subject }, { term: o }, { slot: subject }] }
            verb: { es: "singular o plural", en: "singular or plural", uk: "однина або множина", pt: "singular ou plural", fr: "singulier ou pluriel", de: "Singular oder Plural", it: "singolare o plurale", pl: "liczba pojedyncza lub mnoga", tr: "tekil ya da çoğul", id: "tunggal atau jamak", vi: "số ít hoặc số nhiều" }
            ex: { examples: [[{ target: Vendrá }, " Ana o Luis."], [{ target: Vendrán }, " Ana o Luis."]] }
            tr: { en: { examples: ["Ana or Luis will come.", "Ana or Luis will come."] }, uk: { examples: ["Прийде Ана або Луїс.", "Прийде Ана або Луїс."] }, pt: { examples: ["Ana ou Luis virá.", "Ana ou Luis virá."] }, fr: { examples: ["Ana ou Luis viendra.", "Ana ou Luis viendra."] }, de: { examples: ["Ana oder Luis kommt.", "Ana oder Luis kommt."] }, it: { examples: ["Verrà Ana o Luis.", "Verrà Ana o Luis."] }, pl: { examples: ["Przyjdzie Ana lub Luis.", "Przyjdzie Ana lub Luis."] }, tr: { examples: ["Ana ya da Luis gelecek.", "Ana ya da Luis gelecek."] }, id: { examples: ["Ana atau Luis akan datang.", "Ana atau Luis akan datang."] }, vi: { examples: ["Ana hoặc Luis sẽ đến.", "Ana hoặc Luis sẽ đến."] } }
          - level: B2
            subject: { pattern: [{ term: ni }, { slot: subject }, { term: ni }, { slot: subject }] }
            verb: { es: "singular o plural", en: "singular or plural", uk: "однина або множина", pt: "singular ou plural", fr: "singulier ou pluriel", de: "Singular oder Plural", it: "singolare o plurale", pl: "liczba pojedyncza lub mnoga", tr: "tekil ya da çoğul", id: "tunggal atau jamak", vi: "số ít hoặc số nhiều" }
            ex: { examples: [["No ", { target: vendrá }, " ni Ana ni Luis."], ["No ", { target: vendrán }, " ni Ana ni Luis."]] }
            tr: { en: { examples: ["Neither Ana nor Luis will come.", "Neither Ana nor Luis will come."] }, uk: { examples: ["Не прийде ні Ана, ні Луїс.", "Не прийде ні Ана, ні Луїс."] }, pt: { examples: ["Nem Ana nem Luis virão.", "Nem Ana nem Luis virão."] }, fr: { examples: ["Ni Ana ni Luis ne viendront.", "Ni Ana ni Luis ne viendront."] }, de: { examples: ["Weder Ana noch Luis kommt.", "Weder Ana noch Luis kommt."] }, it: { examples: ["Non verrà né Ana né Luis.", "Non verrà né Ana né Luis."] }, pl: { examples: ["Nie przyjdzie ani Ana, ani Luis.", "Nie przyjdzie ani Ana, ani Luis."] }, tr: { examples: ["Ne Ana ne de Luis gelecek.", "Ne Ana ne de Luis gelecek."] }, id: { examples: ["Baik Ana maupun Luis tidak akan datang.", "Baik Ana maupun Luis tidak akan datang."] }, vi: { examples: ["Cả Ana lẫn Luis đều sẽ không đến.", "Cả Ana lẫn Luis đều sẽ không đến."] } }
          - level: B2
            subject: { es: "dos sustantivos con un solo sentido y un solo artículo", en: "two nouns with one meaning and one article", uk: "два іменники з одним значенням і одним артиклем", pt: "dois substantivos com um só sentido e um só artigo", fr: "deux noms avec un seul sens et un seul article", de: "zwei Nomen mit einer einzigen Bedeutung und einem Artikel", it: "due sostantivi con un solo senso e un solo articolo", pl: "dwa rzeczowniki o jednym znaczeniu z jednym przedimkiem", tr: "tek anlamlı ve tek artikelli iki isim", id: "dua kata benda dengan satu makna dan satu artikel", vi: "hai danh từ có một nghĩa chung và một mạo từ" }
            verb: { es: singular, en: "singular", uk: "однина", pt: "singular", fr: "singulier", de: "Singular", it: "singolare", pl: "liczba pojedyncza", tr: "tekil", id: "tunggal", vi: "số ít" }
            ex: ["La entrada y salida de coches ", { target: se controla }, " aquí."]
            tr: { en: "The entry and exit of cars is controlled here.", uk: "Тут контролюється в’їзд і виїзд автомобілів.", pt: "A entrada e saída de carros é controlada aqui.", fr: "L’entrée et la sortie des voitures sont contrôlées ici.", de: "Die Ein- und Ausfahrt von Autos wird hier kontrolliert.", it: "L'ingresso e l'uscita delle auto vengono controllati qui.", pl: "Wjazd i wyjazd samochodów są tu kontrolowane.", tr: "Araçların giriş ve çıkışı burada kontrol edilir.", id: "Keluar masuk mobil dikontrol di sini.", vi: "Việc xe ra vào được kiểm soát ở đây." }

  - title: { es: "Primera y segunda persona", en: "First and second person", uk: "Перша й друга особа", pt: "Primeira e segunda pessoa", fr: "Première et deuxième personne", de: "Erste und zweite Person", it: "Prima e seconda persona", pl: "Pierwsza i druga osoba", tr: "Birinci ve ikinci kişi", id: "Orang pertama dan kedua", vi: "Ngôi thứ nhất và ngôi thứ hai" }
    role: own
    content:
      - type: usage
        columns:
          - { key: subject, label: { es: Sujeto, en: "Subject", uk: "Підмет", pt: "Sujeito", fr: "Sujet", de: "Subjekt", it: "Soggetto", pl: "Podmiot", tr: "Özne", id: "Subjek", vi: "Chủ ngữ" } }
          - { key: verb, label: { es: Verbo, en: "Verb", uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            subject: { es: "un grupo que incluye al hablante", en: "a group that includes the speaker", uk: "група, до якої входить мовець", pt: "um grupo que inclui o falante", fr: "un groupe qui inclut le locuteur", de: "eine Gruppe, zu der der Sprecher gehört", it: "un gruppo che include chi parla", pl: "grupa, do której należy mówiący", tr: "konuşanı içeren bir grup", id: "kelompok yang mencakup penutur", vi: "một nhóm có cả người nói" }
            verb: { es: "primera persona del plural", en: "first person plural", uk: "перша особа множини", pt: "primeira pessoa do plural", fr: "première personne du pluriel", de: "erste Person Plural", it: "prima persona plurale", pl: "pierwsza osoba liczby mnogiej", tr: "birinci çoğul kişi", id: "orang pertama jamak", vi: "ngôi thứ nhất số nhiều" }
            ex: ["Los vecinos ", { target: pensamos }, " que el parque necesita luz."]
            tr: { en: "We neighbours think that the park needs lighting.", uk: "Ми, сусіди, вважаємо, що парку потрібне освітлення.", pt: "Nós, vizinhos, achamos que o parque precisa de iluminação.", fr: "Nous, les voisins, pensons que le parc a besoin d’éclairage.", de: "Wir Nachbarn finden, dass der Park Beleuchtung braucht.", it: "Noi vicini pensiamo che il parco abbia bisogno di illuminazione.", pl: "My, sąsiedzi, uważamy, że park potrzebuje oświetlenia.", tr: "Biz komşular parkın aydınlatmaya ihtiyacı olduğunu düşünüyoruz.", id: "Kami para tetangga berpikir bahwa taman butuh penerangan.", vi: "Chúng tôi, những người hàng xóm, nghĩ rằng công viên cần có đèn." }
