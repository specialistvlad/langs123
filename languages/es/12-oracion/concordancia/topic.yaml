title: { es: "La concordancia: la mayoría piensa o piensan", en: "Agreement: la mayoría piensa o piensan", uk: "Узгодження: la mayoría piensa o piensan", pt: "A concordância: la mayoría piensa o piensan", fr: "L’accord : la mayoría piensa o piensan", de: "Die Angleichung: la mayoría piensa o piensan", it: "La concordanza: la mayoría piensa o piensan", pl: "Zgodność: la mayoría piensa o piensan", tr: "Uyum: la mayoría piensa o piensan", id: "Kesesuaian: la mayoría piensa o piensan", vi: "Sự hòa hợp: la mayoría piensa o piensan" }
summary:
  lead:
    es: "El verbo concuerda con su sujeto en número y persona, y los sujetos colectivos, partitivos y coordinados admiten singular o plural."
    en: "A verb agrees with its subject in number and person, and collective, partitive and coordinated subjects take a singular or a plural verb."
    uk: "Дієслово узгоджується з підметом у числі й особі, а при збірному, партитивному чи складеному підметі можлива і однина, і множина."
    pt: "O verbo concorda com o sujeito em número e pessoa, e os sujeitos coletivos, partitivos e coordenados admitem singular ou plural."
    fr: "Le verbe s’accorde avec son sujet ; les sujets collectifs, partitifs et coordonnés admettent le singulier ou le pluriel."
    de: "Das Verb gleicht sich dem Subjekt in Numerus und Person an; bei kollektiven, partitiven und koordinierten Subjekten ist Singular oder Plural möglich."
    it: "Il verbo concorda con il soggetto in numero e persona; i soggetti collettivi, partitivi e coordinati ammettono singolare o plurale."
    pl: "Czasownik zgadza się z podmiotem w liczbie i osobie, a przy podmiotach zbiorowych, partytywnych i współrzędnych możliwa jest liczba pojedyncza lub mnoga."
    tr: "Fiil, özneyle sayı ve kişi bakımından uyum sağlar; topluluk bildiren, parça bildiren ve bağlaçla birleşen öznelerde tekil de çoğul da kullanılabilir."
    id: "Kata kerja menyesuaikan diri dengan subjeknya dalam jumlah dan orang; subjek kolektif, partitif, dan majemuk dapat berbentuk tunggal atau jamak."
    vi: "Động từ hợp với chủ ngữ về số và ngôi; chủ ngữ tập hợp hoặc ghép có thể ở hai dạng."
  rule:
    es: "Con un colectivo o un partitivo, el verbo va en singular o en plural:"
    en: "With a collective noun or a partitive, the verb is singular or plural:"
    uk: "Після збірного іменника чи партитивного виразу дієслово стоїть в однині або у множині:"
    pt: "Com um coletivo ou um partitivo, o verbo fica no singular ou no plural:"
    fr: "Avec un collectif ou un partitif, le verbe est au singulier ou au pluriel :"
    de: "Bei einem Kollektivum oder einem Partitiv steht das Verb im Singular oder im Plural:"
    it: "Con un collettivo o un partitivo, il verbo è al singolare o al plurale:"
    pl: "Przy rzeczowniku zbiorowym lub wyrażeniu partytywnym czasownik stoi w liczbie pojedynczej lub mnogiej:"
    tr: "Topluluk ismiyle veya parça bildiren ifadeyle fiil tekil ya da çoğul olur:"
    id: "Dengan kata benda kolektif atau partitif, kata kerja berbentuk tunggal atau jamak:"
    vi: "Danh từ tập hợp, từ chỉ một phần: động từ số ít hoặc số nhiều:"
  ex: { examples: [["La mayoría de los compañeros ", { target: piensa }, " igual."], ["La mayoría de los compañeros ", { target: piensan }, " igual."]] }

