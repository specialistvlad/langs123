          rule: { es: "partitivo y plural: el verbo concuerda con uno de los dos", en: "a partitive and a plural noun: the verb agrees with either one", uk: "партитивний вираз і іменник у множині: дієслово узгоджується з одним із них", pt: "partitivo e plural: o verbo concorda com um dos dois", fr: "partitif et pluriel : le verbe s’accorde avec l’un ou l’autre", de: "Partitiv und Plural: Das Verb richtet sich nach einem von beiden", it: "partitivo e plurale: il verbo concorda con uno dei due", pl: "wyrażenie partytywne i liczba mnoga: czasownik zgadza się z jednym z nich", tr: "parça bildiren ifade ve çoğul isim: fiil ikisinden biriyle uyum sağlar", id: "partitif dan jamak: kata kerja menyesuaikan diri dengan salah satunya", vi: "từ chỉ một phần và danh từ số nhiều: động từ hợp với một trong hai" }
