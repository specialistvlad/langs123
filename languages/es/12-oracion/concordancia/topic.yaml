          rule: { es: "concuerda con el sujeto", en: "it agrees with the subject", uk: "узгоджується з підметом", pt: "concorda com o sujeito", fr: "il s’accorde avec le sujet", de: "es gleicht sich dem Subjekt an", it: "concorda con il soggetto", pl: "zgadza się z podmiotem", tr: "özneyle uyum sağlar", id: "menyesuaikan diri dengan subjek", vi: "hòa hợp với chủ ngữ" }
