            use: { es: "El pluscuamperfecto de subjuntivo ocupa también el resultado, en lugar del condicional compuesto", en: "The past perfect subjunctive also fills the result, in place of the conditional perfect", uk: "Плюсквамперфект суб’юнктива стоїть і в наслідку замість умовного перфекта", pt: "O mais-que-perfeito do subjuntivo ocupa também o resultado, no lugar do condicional composto", fr: "Le plus-que-parfait du subjonctif occupe aussi le résultat, à la place du conditionnel passé", de: "Der Konjunktiv Plusquamperfekt steht auch im Ergebnis, anstelle des Konditionals II", it: "Il trapassato del congiuntivo occupa anche il risultato, al posto del condizionale composto", pl: "Pluscuamperfecto trybu łączącego występuje także w skutku, zamiast trybu warunkowego przeszłego", tr: "Dilek kipinin pluscuamperfecto zamanı sonuç bölümünde de yer alır ve tamamlanmış koşul kipinin yerini alır", id: "Pluscuamperfecto subjungtif juga mengisi bagian hasil, menggantikan kondisional sempurna", vi: "Pluscuamperfecto của thức giả định cũng đứng ở phần kết quả, thay cho thức điều kiện hoàn thành" }
            ex: ["Si me ", { target: hubiesen invitado }, ", ", { target: hubiera ido }, "."]
            tr: { en: "If they had invited me, I would have gone.", uk: "Якби мене запросили, я пішов би.", pt: "Se tivessem me convidado, eu teria ido.", fr: "Si l’on m’avait invité, j’y serais allé.", de: "Wenn man mich eingeladen hätte, wäre ich gegangen.", it: "Se mi avessero invitato, sarei andato.", pl: "Gdyby mnie zaprosili, poszedłbym.", tr: "Beni davet etseydiler giderdim.", id: "Seandainya mereka mengundang saya, saya pasti sudah pergi.", vi: "Nếu họ đã mời tôi, tôi đã đi rồi." }
