            use: { es: "Una condición pasada con un resultado en el futuro", en: "A past condition with a result in the future", uk: "Умова в минулому з наслідком у майбутньому", pt: "Uma condição passada com um resultado no futuro", fr: "Une condition passée avec un résultat dans le futur", de: "Eine Bedingung in der Vergangenheit mit einem Ergebnis in der Zukunft", it: "Una condizione passata con un risultato nel futuro", pl: "Warunek z przeszłości ze skutkiem w przyszłości", tr: "Geçmişteki bir koşul, sonucu ise gelecekte", id: "Syarat di masa lampau dengan hasil di masa depan", vi: "Điều kiện ở quá khứ với kết quả ở tương lai" }
            ex: ["Si ", { target: hubiera aprobado }, " el examen, el año próximo ", { target: empezaría }, " la universidad."]
            tr: { en: "If I had passed the exam, I would start university next year.", uk: "Якби я склав іспит, наступного року я вступив би до університету.", pt: "Se eu tivesse passado no exame, no ano que vem começaria a universidade.", fr: "Si j’avais réussi l’examen, je commencerais l’université l’année prochaine.", de: "Wenn ich die Prüfung bestanden hätte, würde ich nächstes Jahr mit dem Studium beginnen.", it: "Se avessi superato l'esame, l'anno prossimo comincerei l'università.", pl: "Gdybym zdał egzamin, w przyszłym roku zacząłbym studia.", tr: "Sınavı geçseydim gelecek yıl üniversiteye başlardım.", id: "Seandainya saya lulus ujian, tahun depan saya mulai kuliah.", vi: "Nếu tôi đã đậu kỳ thi, năm tới tôi sẽ vào đại học." }
          - level: C1
            pattern: { pattern: [si, { slot: { es: presente de indicativo, en: "present indicative", uk: "теперішній час дійсного способу", pt: "presente do indicativo", fr: "présent de l’indicatif", de: "Indikativ Präsens", it: "presente dell'indicativo", pl: "czas teraźniejszy trybu oznajmującego", tr: "haber kipinin şimdiki zamanı", id: "present indikatif", vi: "thì hiện tại của thức chỉ định" } }, { slot: { es: condicional compuesto, en: "conditional perfect", uk: "умовний перфект", pt: "condicional composto", fr: "conditionnel passé", de: "Konditional II", it: "condizionale composto", pl: "tryb warunkowy przeszły", tr: "tamamlanmış koşul kipi", id: "kondisional sempurna", vi: "thức điều kiện hoàn thành" } }] }
            use: { es: "En la lengua coloquial, el presente sustituye al pluscuamperfecto de subjuntivo", en: "In colloquial speech, the present replaces the past perfect subjunctive", uk: "У розмовній мові теперішній час замінює плюсквамперфект суб’юнктива", pt: "Na língua coloquial, o presente substitui o mais-que-perfeito do subjuntivo", fr: "Dans la langue familière, le présent remplace le plus-que-parfait du subjonctif", de: "In der Umgangssprache ersetzt das Präsens den Konjunktiv Plusquamperfekt", it: "Nella lingua colloquiale, il presente sostituisce il trapassato del congiuntivo", pl: "W języku potocznym czas teraźniejszy zastępuje pluscuamperfecto trybu łączącego", tr: "Gündelik dilde şimdiki zaman, dilek kipinin pluscuamperfecto zamanının yerini alır", id: "Dalam bahasa sehari-hari, present menggantikan pluscuamperfecto subjungtif", vi: "Trong văn nói, thì hiện tại thay cho pluscuamperfecto của thức giả định" }
            ex: ["Si ", { alternatives: [{ target: hubieras llegado }, { target: llegas }] }, " un minuto antes, ", { target: habrías visto }, " la escena entera."]
            tr: { en: "If you had arrived a minute earlier, you would have seen the whole scene.", uk: "Якби ти прийшов на хвилину раніше, ти побачив би всю сцену.", pt: "Se você tivesse chegado um minuto antes, teria visto a cena inteira.", fr: "Si tu étais arrivé une minute plus tôt, tu aurais vu toute la scène.", de: "Wenn du eine Minute früher gekommen wärst, hättest du die ganze Szene gesehen.", it: "Se fossi arrivato un minuto prima, avresti visto tutta la scena.", pl: "Gdybyś przyszedł minutę wcześniej, zobaczyłbyś całą scenę.", tr: "Bir dakika önce gelseydin bütün sahneyi görürdün.", id: "Seandainya kamu tiba semenit lebih awal, kamu pasti sudah melihat seluruh adegannya.", vi: "Nếu bạn đến sớm hơn một phút, bạn đã thấy trọn cảnh đó." }
          - level: C2
