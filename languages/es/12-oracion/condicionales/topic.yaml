            tr: [{ pattern: ["de", { slot: { es: infinitivo simple o compuesto, en: "simple or compound infinitive", uk: "простий або складений інфінітив", pt: "infinitivo simples ou composto", fr: "infinitif présent ou passé", de: "einfacher oder zusammengesetzter Infinitiv", it: "infinito semplice o composto", pl: "bezokolicznik prosty lub złożony", tr: "basit ya da birleşik mastar", id: "infinitif sederhana atau majemuk", vi: "động từ nguyên mẫu đơn hoặc hoàn thành" } }] }, " bir koşul bildirir"]
            id: [{ pattern: ["de", { slot: { es: infinitivo simple o compuesto, en: "simple or compound infinitive", uk: "простий або складений інфінітив", pt: "infinitivo simples ou composto", fr: "infinitif présent ou passé", de: "einfacher oder zusammengesetzter Infinitiv", it: "infinito semplice o composto", pl: "bezokolicznik prosty lub złożony", tr: "basit ya da birleşik mastar", id: "infinitif sederhana atau majemuk", vi: "động từ nguyên mẫu đơn hoặc hoàn thành" } }] }, " menyatakan syarat"]
            vi: [{ pattern: ["de", { slot: { es: infinitivo simple o compuesto, en: "simple or compound infinitive", uk: "простий або складений інфінітив", pt: "infinitivo simples ou composto", fr: "infinitif présent ou passé", de: "einfacher oder zusammengesetzter Infinitiv", it: "infinito semplice o composto", pl: "bezokolicznik prosty lub złożony", tr: "basit ya da birleşik mastar", id: "infinitif sederhana atau majemuk", vi: "động từ nguyên mẫu đơn hoặc hoàn thành" } }] }, " diễn đạt một điều kiện"]
