            use: { es: "Un deseo en suspenso: la oración se queda sin resultado", en: "A wish left hanging: the sentence has no result", uk: "Бажання без завершення: у реченні немає наслідку", pt: "Um desejo em suspenso: a oração fica sem resultado", fr: "Un souhait en suspens : la phrase reste sans résultat", de: "Ein offener Wunsch: dem Satz fehlt das Ergebnis", it: "Un desiderio in sospeso: la frase resta senza risultato", pl: "Życzenie w zawieszeniu: zdanie zostaje bez skutku", tr: "Havada kalan bir dilek: cümle sonuçsuz kalır", id: "Keinginan yang menggantung: kalimat tidak punya hasil", vi: "Mong ước bỏ lửng: câu không có phần kết quả" }
