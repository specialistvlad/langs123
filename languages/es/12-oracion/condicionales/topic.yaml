            tr: { en: { examples: ["If I won the lottery, I would buy a house.", "I would go with you, if you promised not to argue."] }, uk: { examples: ["Якби я виграв у лотерею, я купив би будинок.", "Я пішов би з тобою, якби ти пообіцяв не сперечатися."] }, pt: { examples: ["Se eu ganhasse na loteria, compraria uma casa.", "Eu iria com você, se você prometesse não discutir."] }, fr: { examples: ["Si je gagnais à la loterie, j’achèterais une maison.", "J’irais avec toi, si tu me promettais de ne pas discuter."] }, de: { examples: ["Wenn ich im Lotto gewönne, würde ich ein Haus kaufen.", "Ich würde mit dir gehen, wenn du mir versprechen würdest, nicht zu streiten."] }, it: { examples: ["Se vincessi alla lotteria, comprerei una casa.", "Verrei con te, se mi promettessi di non litigare."] }, pl: { examples: ["Gdybym wygrał na loterii, kupiłbym dom.", "Poszedłbym z tobą, gdybyś obiecał, że nie będziemy się kłócić."] }, tr: { examples: ["Piyangoyu kazansam bir ev alırdım.", "Tartışmayacağına söz verseydin seninle gelirdim."] }, id: { examples: ["Seandainya saya menang lotre, saya akan membeli rumah.", "Saya akan pergi bersamamu, seandainya kamu berjanji tidak bertengkar."] }, vi: { examples: ["Nếu tôi trúng xổ số, tôi sẽ mua một căn nhà.", "Tôi sẽ đi với bạn, nếu bạn hứa không cãi nhau."] } }
