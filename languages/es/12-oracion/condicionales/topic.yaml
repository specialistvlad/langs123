            vi: [{ pattern: ["si", { slot: "present" }] }, ", sau đó là thức mệnh lệnh"]
          ex: [{ target: Si puedes }, ", ", { target: ayúdame }, "."]
          tr: { en: "If you can, help me.", uk: "Якщо можеш, допоможи мені.", pt: "Se puder, me ajude.", fr: "Si tu peux, aide-moi.", de: "Wenn du kannst, hilf mir.", it: "Se puoi, aiutami.", pl: "Jeśli możesz, pomóż mi.", tr: "Mümkünse bana yardım et.", id: "Kalau bisa, tolong bantu saya.", vi: "Nếu bạn có thể, hãy giúp tôi." }
        - level: B2
          point: { es: Presente irreal, en: "Unreal present", uk: "Нереальне теперішнє", pt: "Presente irreal", fr: "Présent irréel", de: "Irreale Gegenwart", it: "Presente irreale", pl: "Nierzeczywista teraźniejszość", tr: "Gerçek dışı şimdiki zaman", id: "Present tidak nyata", vi: "Hiện tại không có thật" }
          rule:
            pattern: [si, { slot: { es: imperfecto de subjuntivo, en: "imperfect subjunctive", uk: "імперфект суб’юнктива", pt: "imperfeito do subjuntivo", fr: "imparfait du subjonctif", de: "Konjunktiv Imperfecto", it: "imperfetto del congiuntivo", pl: "imperfecto trybu łączącego", tr: "dilek kipinin imperfecto zamanı", id: "imperfecto subjungtif", vi: "imperfecto của thức giả định" } }, { slot: { es: condicional, en: "conditional", uk: "умовний спосіб", pt: "condicional", fr: "conditionnel", de: "Konditional", it: "condizionale", pl: "tryb warunkowy", tr: "koşul kipi", id: "kondisional", vi: "thức điều kiện" } }]
