title: { en: Conditional Sentences, es: Las oraciones condicionales, uk: "Умовні речення", pt: "As orações condicionais", fr: "Les phrases conditionnelles", de: "Die Bedingungssätze", it: "Il periodo ipotetico", pl: "Zdania warunkowe", tr: "Koşul cümleleri", id: "Kalimat bersyarat", vi: "Câu điều kiện" }
summary:
  lead:
    en: ["A conditional sentence puts the condition after ", { term: si }, " in the present, and the result in the present, the future or the imperative."]
    es: ["Una oración condicional pone la condición detrás de ", { term: si }, " en presente, y el resultado en presente, en futuro o en imperativo."]
    uk: ["Умовне речення ставить умову після ", { term: "si" }, " у теперішньому часі, а наслідок — у теперішньому часі, майбутньому або в наказовому способі."]
    pt: ["A oração condicional põe a condição depois de ", { term: "si" }, " no presente, e o resultado no presente, no futuro ou no imperativo."]
    fr: ["Une phrase conditionnelle met la condition après ", { term: "si" }, " au présent, et le résultat au présent, au futur ou à l’impératif."]
    de: ["Ein Bedingungssatz setzt die Bedingung nach ", { term: "si" }, " ins Präsens und das Ergebnis ins Präsens, ins Futur oder in den Imperativ."]
    it: ["Il periodo ipotetico mette la condizione dopo ", { term: "si" }, " al presente e il risultato al presente, al futuro o all'imperativo."]
    pl: ["Zdanie warunkowe stawia warunek po ", { term: "si" }, " w czasie teraźniejszym, a wynik w czasie teraźniejszym, przyszłym lub w trybie rozkazującym."]
    tr: ["Koşul cümlesi koşulu ", { term: "si" }, " sözcüğünden sonra şimdiki zamanda, sonucu ise şimdiki zamanda, gelecek zamanda ya da emir kipinde kurar."]
    id: ["Kalimat bersyarat menaruh syarat setelah ", { term: "si" }, " dalam present, dan hasilnya dalam present, future, atau kalimat perintah."]
    vi: ["Câu điều kiện đặt điều kiện sau ", { term: "si" }, " ở thì hiện tại, còn kết quả ở thì hiện tại, thì tương lai hoặc thức mệnh lệnh."]
  rule:
    en: ["After ", { term: si }, ", the verb stays in the present, even about the future:"]
    es: ["Detrás de ", { term: si }, ", el verbo va en presente, también para hablar del futuro:"]
    uk: ["Після ", { term: "si" }, " дієслово стоїть у теперішньому часі, навіть коли йдеться про майбутнє:"]
    pt: ["Depois de ", { term: "si" }, ", o verbo fica no presente, também para falar do futuro:"]
    fr: ["Après ", { term: "si" }, ", le verbe reste au présent, même pour parler du futur :"]
    de: ["Nach ", { term: "si" }, " steht das Verb im Präsens, auch wenn es um die Zukunft geht:"]
    it: ["Dopo ", { term: "si" }, " il verbo resta al presente, anche per parlare del futuro:"]
    pl: ["Po ", { term: "si" }, " czasownik stoi w czasie teraźniejszym, także gdy mowa o przyszłości:"]
    tr: ["Fiil, ", { term: "si" }, " sonrasında şimdiki zamanda kalır, gelecekten söz ederken bile:"]
    id: ["Setelah ", { term: "si" }, ", kata kerja tetap dalam present, juga untuk membicarakan masa depan:"]
    vi: ["Sau ", { term: "si" }, ", động từ ở thì hiện tại, kể cả khi nói về tương lai:"]
  ex: { examples: [[{ target: Si tengo }, " tiempo, voy."], [{ target: Si tengo }, " tiempo, iré."]] }

cheatsheet:
