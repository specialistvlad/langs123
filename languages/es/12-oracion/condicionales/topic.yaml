          - { level: A2, use: { en: Offers, es: Ofrecimientos, uk: "Пропозиції", pt: "Ofertas", fr: "Offres", de: "Angebote", it: "Offerte", pl: "Propozycje", tr: "Teklifler", id: "Tawaran", vi: "Lời đề nghị" }, ex: [{ target: Si quieres }, ", te ", { target: ayudo }, "."], tr: { en: "If you like, I'll help you.", uk: "Якщо хочеш, я тобі допоможу.", pt: "Se você quiser, eu te ajudo.", fr: "Si tu veux, je t’aide.", de: "Wenn du willst, helfe ich dir.", it: "Se vuoi, ti aiuto.", pl: "Jeśli chcesz, pomogę ci.", tr: "İstersen sana yardım ederim.", id: "Kalau kamu mau, saya bantu.", vi: "Nếu bạn muốn, tôi giúp bạn." } }
          - { level: B1, use: { en: A future condition, es: Una condición futura, uk: "Умова в майбутньому", pt: "Uma condição futura", fr: "Une condition future", de: "Eine Bedingung in der Zukunft", it: "Una condizione futura", pl: "Warunek w przyszłości", tr: "Gelecekle ilgili koşul", id: "Syarat di masa depan", vi: "Điều kiện ở tương lai" }, ex: [{ target: Si hace }, " sol mañana, ", { target: iremos }, " a la playa."], tr: { en: "If it's sunny tomorrow, we'll go to the beach.", uk: "Якщо завтра буде сонячно, ми підемо на пляж.", pt: "Se fizer sol amanhã, vamos à praia.", fr: "S’il fait beau demain, nous irons à la plage.", de: "Wenn morgen die Sonne scheint, gehen wir an den Strand.", it: "Se domani fa bel tempo, andremo in spiaggia.", pl: "Jeśli jutro będzie słonecznie, pojedziemy na plażę.", tr: "Yarın hava güneşliyse plaja gideriz.", id: "Kalau besok cerah, kita akan pergi ke pantai.", vi: "Nếu ngày mai trời nắng, chúng ta sẽ đi biển." } }
          - { level: B1, use: { en: Instructions, es: Instrucciones, uk: "Інструкції", pt: "Instruções", fr: "Instructions", de: "Anweisungen", it: "Istruzioni", pl: "Polecenia", tr: "Talimatlar", id: "Instruksi", vi: "Hướng dẫn" }, ex: [{ target: Si llegas }, " tarde, ", { target: llámame }, "."], tr: { en: "If you're late, call me.", uk: "Якщо запізнюєшся, подзвони мені.", pt: "Se você chegar tarde, me ligue.", fr: "Si tu arrives en retard, appelle-moi.", de: "Wenn du zu spät kommst, ruf mich an.", it: "Se arrivi tardi, chiamami.", pl: "Jeśli się spóźnisz, zadzwoń do mnie.", tr: "Geç kalırsan beni ara.", id: "Kalau kamu terlambat, telepon saya.", vi: "Nếu bạn đến muộn, hãy gọi cho tôi." } }

