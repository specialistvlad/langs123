            use: { es: "Una condición pasada con un resultado en el presente", en: "A past condition with a result in the present", uk: "Умова в минулому з наслідком у теперішньому", pt: "Uma condição passada com um resultado no presente", fr: "Une condition passée avec un résultat dans le présent", de: "Eine Bedingung in der Vergangenheit mit einem Ergebnis in der Gegenwart", it: "Una condizione passata con un risultato nel presente", pl: "Warunek z przeszłości ze skutkiem w teraźniejszości", tr: "Geçmişteki bir koşul, sonucu ise şimdiki zamanda", id: "Syarat di masa lampau dengan hasil di masa kini", vi: "Điều kiện ở quá khứ với kết quả ở hiện tại" }
            ex: ["Si ", { target: hubiera estudiado }, " medicina, ahora ", { target: sería }, " médico."]
            tr: { en: "If I had studied medicine, I would be a doctor now.", uk: "Якби я вивчився на лікаря, зараз був би лікарем.", pt: "Se eu tivesse estudado medicina, agora seria médico.", fr: "Si j’avais fait des études de médecine, je serais médecin maintenant.", de: "Wenn ich Medizin studiert hätte, wäre ich jetzt Arzt.", it: "Se avessi studiato medicina, ora sarei medico.", pl: "Gdybym studiował medycynę, byłbym teraz lekarzem.", tr: "Tıp okusaydım şimdi doktor olurdum.", id: "Seandainya dulu saya belajar kedokteran, sekarang saya jadi dokter.", vi: "Nếu tôi đã học y, bây giờ tôi đã là bác sĩ." }
