            use: { es: "Una condición necesaria: solo así se cumple el resultado", en: "A necessary condition: only then does the result hold", uk: "Необхідна умова: лише так настає наслідок", pt: "Uma condição necessária: só assim o resultado se cumpre", fr: "Une condition nécessaire : le résultat ne se réalise que dans ce cas", de: "Eine notwendige Bedingung: nur so tritt das Ergebnis ein", it: "Una condizione necessaria: solo così il risultato si realizza", pl: "Warunek konieczny: tylko wtedy skutek się spełnia", tr: "Gerekli bir koşul: sonuç yalnızca böyle gerçekleşir", id: "Syarat yang harus dipenuhi: hanya dengan begitu hasilnya terjadi", vi: "Điều kiện cần: chỉ như vậy thì kết quả mới xảy ra" }
            ex: { examples: [["Te presto el coche ", { target: siempre y cuando }, " lo ", { target: cuides }, "."], ["Voy a la fiesta ", { target: con tal de que }, " tú ", { target: vayas }, " también."]] }
            tr: { en: { examples: ["I'll lend you the car as long as you take care of it.", "I'll go to the party provided that you go too."] }, uk: { examples: ["Я позичу тобі машину за умови, що ти її берегтимеш.", "Я піду на вечірку за умови, що ти теж підеш."] }, pt: { examples: ["Eu te empresto o carro desde que você cuide dele.", "Vou à festa contanto que você vá também."] }, fr: { examples: ["Je te prête la voiture à condition que tu en prennes soin.", "Je vais à la fête à condition que tu y ailles aussi."] }, de: { examples: ["Ich leihe dir das Auto, sofern du gut darauf aufpasst.", "Ich gehe zur Party, vorausgesetzt, du kommst auch."] }, it: { examples: ["Ti presto la macchina a patto che tu la tratti bene.", "Vado alla festa a condizione che venga anche tu."] }, pl: { examples: ["Pożyczę ci samochód, pod warunkiem że będziesz o niego dbać.", "Pójdę na imprezę, pod warunkiem że ty też pójdziesz."] }, tr: { examples: ["Arabaya iyi bakman şartıyla sana ödünç veririm.", "Sen de gelirsen partiye giderim."] }, id: { examples: ["Saya meminjamkan mobil kepadamu asalkan kamu merawatnya.", "Saya pergi ke pesta asalkan kamu juga pergi."] }, vi: { examples: ["Tôi cho bạn mượn xe với điều kiện bạn giữ gìn nó.", "Tôi đến buổi tiệc với điều kiện bạn cũng đến."] } }
          - level: B2
