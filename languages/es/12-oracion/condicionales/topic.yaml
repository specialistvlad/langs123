          tr: { en: "Had I known, I would have told you.", uk: "Якби я про це знав, я б тебе попередив.", pt: "Se eu tivesse sabido, teria avisado você.", fr: "Si je l’avais su, je t’aurais prévenu.", de: "Hätte ich es gewusst, hätte ich dir Bescheid gesagt.", it: "Se l'avessi saputo, ti avrei avvisato.", pl: "Gdybym o tym wiedział, uprzedziłbym cię.", tr: "Bilseydim sana haber verirdim.", id: "Seandainya saya sudah tahu, saya pasti sudah memberi tahu kamu.", vi: "Nếu tôi đã biết, tôi đã báo cho bạn rồi." }
