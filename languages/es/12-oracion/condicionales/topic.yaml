            use: { es: "Una excepción a lo dicho, presentada como un hecho posible", en: "An exception to what was said, presented as a possible fact", uk: "Виняток зі сказаного, поданий як можливий факт", pt: "Uma exceção ao que foi dito, apresentada como um fato possível", fr: "Une exception à ce qui a été dit, présentée comme un fait possible", de: "Eine Ausnahme von dem Gesagten, als mögliche Tatsache dargestellt", it: "Un'eccezione a quanto detto, presentata come un fatto possibile", pl: "Wyjątek od tego, co powiedziano, przedstawiony jako możliwy fakt", tr: "Söylenene bir istisna, olası bir olgu olarak sunulur", id: "Pengecualian dari yang dikatakan, disajikan sebagai fakta yang mungkin", vi: "Ngoại lệ so với điều đã nói, được nêu như một sự việc có thể xảy ra" }
            ex: { examples: [["Salimos a las ocho, ", { target: salvo si }, " ", { target: hay }, " mucho tráfico."], ["Hacemos la excursión, ", { target: excepto si }, " ", { target: llueve }, "."]] }
            tr: { en: { examples: ["We leave at eight, unless there is a lot of traffic.", "We'll go on the trip, except if it rains."] }, uk: { examples: ["Виїжджаємо о восьмій, хіба що буде великий рух.", "Ми підемо в похід, хіба що піде дощ."] }, pt: { examples: ["Saímos às oito, a menos que haja muito trânsito.", "Fazemos o passeio, exceto se chover."] }, fr: { examples: ["Nous partons à huit heures, sauf s’il y a beaucoup de circulation.", "Nous faisons l’excursion, sauf s’il pleut."] }, de: { examples: ["Wir fahren um acht Uhr los, außer wenn viel Verkehr ist.", "Wir machen den Ausflug, außer wenn es regnet."] }, it: { examples: ["Partiamo alle otto, salvo se c'è molto traffico.", "Facciamo la gita, tranne se piove."] }, pl: { examples: ["Wyjeżdżamy o ósmej, chyba że będzie duży ruch.", "Jedziemy na wycieczkę, chyba że będzie padać."] }, tr: { examples: ["Trafik çok yoğun değilse sekizde çıkıyoruz.", "Yağmur yağmazsa geziyi yapıyoruz."] }, id: { examples: ["Kami berangkat pukul delapan, kecuali kalau lalu lintas padat.", "Kami berekreasi, kecuali kalau hujan."] }, vi: { examples: ["Chúng tôi xuất phát lúc tám giờ, trừ khi đường đông.", "Chúng tôi đi dã ngoại, trừ khi trời mưa."] } }
          - level: B2
            nexo: { pattern: [{ alternatives: [{ term: a no ser que }, { term: salvo que }] }, { slot: { es: subjuntivo, en: "subjunctive", uk: "суб’юнктив", pt: "subjuntivo", fr: "subjonctif", de: "Konjunktiv", it: "congiuntivo", pl: "tryb łączący", tr: "dilek kipi", id: "subjungtif", vi: "thức giả định" } }] }
            use: { es: "Una excepción a lo dicho, presentada como una hipótesis", en: "An exception to what was said, presented as a hypothesis", uk: "Виняток зі сказаного, поданий як гіпотеза", pt: "Uma exceção ao que foi dito, apresentada como uma hipótese", fr: "Une exception à ce qui a été dit, présentée comme une hypothèse", de: "Eine Ausnahme von dem Gesagten, als Hypothese dargestellt", it: "Un'eccezione a quanto detto, presentata come un'ipotesi", pl: "Wyjątek od tego, co powiedziano, przedstawiony jako hipoteza", tr: "Söylenene bir istisna, varsayım olarak sunulur", id: "Pengecualian dari yang dikatakan, disajikan sebagai hipotesis", vi: "Ngoại lệ so với điều đã nói, được nêu như một giả thuyết" }
