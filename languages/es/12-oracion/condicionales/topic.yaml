            use: { es: "Una condición remota que se plantea como posible: el presente sustituye al imperfecto de subjuntivo", en: "A remote condition put forward as possible: the present replaces the imperfect subjunctive", uk: "Віддалена умова, яку подають як можливу: теперішній час замінює імперфект суб’юнктива", pt: "Uma condição remota apresentada como possível: o presente substitui o imperfeito do subjuntivo", fr: "Une condition lointaine présentée comme possible : le présent remplace l’imparfait du subjonctif", de: "Eine entfernte Bedingung, die als möglich dargestellt wird: das Präsens ersetzt den Konjunktiv Imperfecto", it: "Una condizione remota presentata come possibile: il presente sostituisce l'imperfetto del congiuntivo", pl: "Odległy warunek przedstawiony jako możliwy: czas teraźniejszy zastępuje imperfecto trybu łączącego", tr: "Uzak bir koşul, olası gibi sunulur: şimdiki zaman, dilek kipinin imperfecto zamanının yerini alır", id: "Syarat yang jauh tetapi diajukan sebagai mungkin: present menggantikan imperfecto subjungtif", vi: "Điều kiện xa vời nhưng được đưa ra như có thể xảy ra: thì hiện tại thay cho imperfecto của thức giả định" }
