sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A conditional sentence has two parts: the condition with ", { term: si }, ", and the result."]
              es: ["Una oración condicional tiene dos partes: la condición con ", { term: si }, ", y el resultado."]
              uk: ["Умовне речення має дві частини: умову з ", { term: "si" }, " і наслідок."]
              pt: ["Uma oração condicional tem duas partes: a condição com ", { term: "si" }, " e o resultado."]
              fr: ["Une phrase conditionnelle a deux parties : la condition avec ", { term: "si" }, " et le résultat."]
              de: ["Ein Bedingungssatz hat zwei Teile: die Bedingung mit ", { term: "si" }, " und das Ergebnis."]
              it: ["Il periodo ipotetico ha due parti: la condizione con ", { term: "si" }, " e il risultato."]
              pl: ["Zdanie warunkowe ma dwie części: warunek z ", { term: "si" }, " i wynik."]
              tr: ["Koşul cümlesinin iki bölümü vardır: ", { term: "si" }, " ile kurulan koşul ve sonuç."]
              id: ["Kalimat bersyarat punya dua bagian: syarat dengan ", { term: "si" }, " dan hasilnya."]
              vi: ["Câu điều kiện có hai phần: điều kiện với ", { term: "si" }, " và kết quả."]
          - type: rule
            level: A2
            text:
              en: ["Either part can come first; a comma follows the ", { term: si }, " clause when it opens the sentence:"]
              es: ["Cualquiera de las dos partes puede ir primero; una coma sigue a la oración con ", { term: si }, " cuando abre la frase:"]
              uk: ["Будь-яка частина може йти першою; кома стоїть після частини з ", { term: "si" }, ", коли вона починає речення:"]
              pt: ["Qualquer uma das partes pode vir primeiro; uma vírgula vem depois da oração com ", { term: "si" }, " quando ela abre a frase:"]
              fr: ["L’une ou l’autre partie peut venir en premier ; une virgule suit la proposition en ", { term: "si" }, " quand elle ouvre la phrase :"]
              de: ["Jeder der beiden Teile kann vorn stehen; ein Komma folgt auf den Satz mit ", { term: "si" }, ", wenn er den Satz eröffnet:"]
              it: ["Ciascuna delle due parti può venire per prima; una virgola segue la frase con ", { term: "si" }, " quando apre il periodo:"]
              pl: ["Każda z dwóch części może stać na początku; przecinek stoi po zdaniu z ", { term: "si" }, ", gdy otwiera wypowiedzenie:"]
              tr: ["İki bölümden biri başta olabilir; ", { term: "si" }, " bölümü cümleyi açıyorsa arkasından virgül gelir:"]
              id: ["Kedua bagian boleh muncul lebih dulu; tanda koma mengikuti klausa dengan ", { term: "si" }, " kalau klausa itu membuka kalimat:"]
              vi: ["Phần nào cũng có thể đứng trước; dấu phẩy đứng sau mệnh đề có ", { term: "si" }, " khi nó mở đầu câu:"]
            ex: { examples: [[{ target: Si llueve }, ", no salgo."], ["No salgo ", { target: si llueve }, "."]] }
