          tr: { en: "If I eat a lot, I get a stomach ache.", uk: "Якщо я багато їм, у мене болить живіт.", pt: "Se eu como muito, meu estômago dói.", fr: "Si je mange beaucoup, j’ai mal à l’estomac.", de: "Wenn ich viel esse, tut mir der Magen weh.", it: "Se mangio molto, mi fa male lo stomaco.", pl: "Jeśli dużo jem, boli mnie żołądek.", tr: "Çok yersem midem ağrır.", id: "Kalau saya makan banyak, perut saya sakit.", vi: "Nếu tôi ăn nhiều, tôi bị đau dạ dày." }
        - level: A2
