            use: { es: "Un pasado irreal: lo que no ocurrió", en: "An unreal past: what did not happen", uk: "Нереальне минуле: те, чого не сталося", pt: "Um passado irreal: o que não aconteceu", fr: "Un passé irréel : ce qui n’a pas eu lieu", de: "Eine irreale Vergangenheit: was nicht geschehen ist", it: "Un passato irreale: ciò che non è accaduto", pl: "Nierzeczywista przeszłość: to, co się nie wydarzyło", tr: "Gerçek dışı bir geçmiş: olmayan şey", id: "Past yang tidak nyata: yang tidak terjadi", vi: "Quá khứ không có thật: điều đã không xảy ra" }
            ex: ["Si ", { target: hubiera salido }, " antes, ", { target: habría llegado }, " a tiempo."]
            tr: { en: "If I had left earlier, I would have arrived on time.", uk: "Якби я вийшов раніше, я приїхав би вчасно.", pt: "Se eu tivesse saído antes, teria chegado a tempo.", fr: "Si j’étais parti plus tôt, je serais arrivé à l’heure.", de: "Wenn ich früher losgegangen wäre, wäre ich rechtzeitig angekommen.", it: "Se fossi uscito prima, sarei arrivato in tempo.", pl: "Gdybym wyszedł wcześniej, dotarłbym na czas.", tr: "Daha erken çıksaydım zamanında varırdım.", id: "Seandainya saya berangkat lebih awal, saya pasti sudah sampai tepat waktu.", vi: "Nếu tôi đi sớm hơn, tôi đã đến đúng giờ." }
