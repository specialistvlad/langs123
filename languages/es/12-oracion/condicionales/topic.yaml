            tr: { en: "Oh, if only I could go back to that summer!", uk: "Ох, якби я міг повернутися в те літо!", pt: "Ai, se eu pudesse voltar àquele verão!", fr: "Ah, si je pouvais revenir à cet été-là !", de: "Ach, könnte ich doch in jenen Sommer zurück!", it: "Ah, se potessi tornare a quell'estate!", pl: "Ach, gdybym mógł wrócić do tamtego lata!", tr: "Ah, o yaza bir dönebilseydim!", id: "Ah, seandainya saya bisa kembali ke musim panas itu!", vi: "Ôi, giá mà tôi có thể quay lại mùa hè ấy!" }
          - level: C2
            pattern: { pattern: [si, { slot: { es: imperfecto de subjuntivo, en: "imperfect subjunctive", uk: "імперфект суб’юнктива", pt: "imperfeito do subjuntivo", fr: "imparfait du subjonctif", de: "Konjunktiv Imperfecto", it: "imperfetto del congiuntivo", pl: "imperfecto trybu łączącego", tr: "dilek kipinin imperfecto zamanı", id: "imperfecto subjungtif", vi: "imperfecto của thức giả định" } }, { slot: { es: imperfecto de indicativo, en: "imperfect indicative", uk: "імперфект дійсного способу", pt: "imperfeito do indicativo", fr: "imparfait de l’indicatif", de: "Indikativ Imperfecto", it: "imperfetto dell'indicativo", pl: "imperfecto trybu oznajmującego", tr: "haber kipinin imperfecto zamanı", id: "imperfecto indikatif", vi: "imperfecto của thức chỉ định" } }] }
            use: { es: "En la lengua coloquial, el imperfecto de indicativo sustituye al condicional en el resultado", en: "In colloquial speech, the imperfect indicative replaces the conditional in the result", uk: "У розмовній мові імперфект дійсного способу замінює умовний спосіб у наслідку", pt: "Na língua coloquial, o imperfeito do indicativo substitui o condicional no resultado", fr: "Dans la langue familière, l’imparfait de l’indicatif remplace le conditionnel dans le résultat", de: "In der Umgangssprache ersetzt der Indikativ Imperfecto im Ergebnis den Konditional", it: "Nella lingua colloquiale, l'imperfetto dell'indicativo sostituisce il condizionale nel risultato", pl: "W języku potocznym imperfecto trybu oznajmującego zastępuje tryb warunkowy w skutku", tr: "Gündelik dilde sonuç bölümünde haber kipinin imperfecto zamanı, koşul kipinin yerini alır", id: "Dalam bahasa sehari-hari, imperfecto indikatif menggantikan kondisional pada bagian hasil", vi: "Trong văn nói, imperfecto của thức chỉ định thay cho thức điều kiện ở phần kết quả" }
            ex: ["Si me lo ", { target: pidieras }, ", lo ", { target: hacía }, " ahora mismo."]
            tr: { en: "If you asked me, I'd do it right now.", uk: "Якби ти мене попросив, я зробив би це просто зараз.", pt: "Se você me pedisse, eu faria isso agora mesmo.", fr: "Si tu me le demandais, je le ferais tout de suite.", de: "Wenn du mich darum bitten würdest, würde ich es sofort tun.", it: "Se me lo chiedessi, lo farei subito.", pl: "Gdybyś mnie o to poprosił, zrobiłbym to od razu.", tr: "Benden istesen bunu hemen yapardım.", id: "Seandainya kamu memintanya, saya akan melakukannya sekarang juga.", vi: "Nếu bạn nhờ, tôi sẽ làm ngay bây giờ." }
          - level: C2
            pattern: { pattern: [si, { slot: { es: imperfecto de subjuntivo, en: "imperfect subjunctive", uk: "імперфект суб’юнктива", pt: "imperfeito do subjuntivo", fr: "imparfait du subjonctif", de: "Konjunktiv Imperfecto", it: "imperfetto del congiuntivo", pl: "imperfecto trybu łączącego", tr: "dilek kipinin imperfecto zamanı", id: "imperfecto subjungtif", vi: "imperfecto của thức giả định" } }, { slot: { es: imperfecto de subjuntivo, en: "imperfect subjunctive", uk: "імперфект суб’юнктива", pt: "imperfeito do subjuntivo", fr: "imparfait du subjonctif", de: "Konjunktiv Imperfecto", it: "imperfetto del congiuntivo", pl: "imperfecto trybu łączącego", tr: "dilek kipinin imperfecto zamanı", id: "imperfecto subjungtif", vi: "imperfecto của thức giả định" } }] }
            use: { es: "En la lengua literaria, el imperfecto de subjuntivo ocupa también el resultado, en -ra o en -se", en: "In literary language, the imperfect subjunctive also fills the result, in -ra or -se", uk: "У літературній мові імперфект суб’юнктива стоїть і в наслідку, у формі на -ra або -se", pt: "Na língua literária, o imperfeito do subjuntivo ocupa também o resultado, em -ra ou -se", fr: "Dans la langue littéraire, l’imparfait du subjonctif occupe aussi le résultat, en -ra ou en -se", de: "In der Literatursprache steht auch im Ergebnis der Konjunktiv Imperfecto, auf -ra oder -se", it: "Nella lingua letteraria, l'imperfetto del congiuntivo occupa anche il risultato, in -ra o in -se", pl: "W języku literackim imperfecto trybu łączącego występuje także w skutku, w formie na -ra lub -se", tr: "Edebî dilde sonuç bölümünde de dilek kipinin imperfecto zamanı yer alır, -ra ya da -se biçimiyle", id: "Dalam bahasa sastra, imperfecto subjungtif juga mengisi bagian hasil, dalam bentuk -ra atau -se", vi: "Trong văn chương, imperfecto của thức giả định cũng đứng ở phần kết quả, dạng -ra hoặc -se" }
            ex: ["Si ella me ", { target: hablase }, ", se ", { alternatives: [{ target: detuviera }, { target: detuviese }] }, " el tiempo."]
            tr: { en: "If she spoke to me, time would stand still.", uk: "Якби вона заговорила зі мною, час зупинився б.", pt: "Se ela falasse comigo, o tempo pararia.", fr: "Si elle me parlait, le temps s’arrêterait.", de: "Wenn sie mit mir spräche, bliebe die Zeit stehen.", it: "Se lei mi parlasse, il tempo si fermerebbe.", pl: "Gdyby do mnie przemówiła, czas by się zatrzymał.", tr: "Benimle konuşsaydı zaman dururdu.", id: "Seandainya dia berbicara kepadaku, waktu akan berhenti.", vi: "Nếu cô ấy nói với tôi, thời gian sẽ ngừng lại." }
          - level: C2
            pattern: { pattern: [si, { slot: { es: futuro de subjuntivo, en: "future subjunctive", uk: "майбутній час суб’юнктива", pt: "futuro do subjuntivo", fr: "futur du subjonctif", de: "Konjunktiv Futur", it: "futuro del congiuntivo", pl: "czas przyszły trybu łączącego", tr: "dilek kipinin gelecek zamanı", id: "future subjungtif", vi: "thì tương lai của thức giả định" } }, { slot: { es: futuro de indicativo, en: "future indicative", uk: "майбутній час дійсного способу", pt: "futuro do indicativo", fr: "futur de l’indicatif", de: "Indikativ Futur", it: "futuro dell'indicativo", pl: "czas przyszły trybu oznajmującego", tr: "haber kipinin gelecek zamanı", id: "future indikatif", vi: "thì tương lai của thức chỉ định" } }] }
            use: { es: ["En el estilo jurídico, la condición lleva futuro de subjuntivo: ", { link: "El futuro de subjuntivo", to: es.subjuntivo.subjuntivo-futuro }], en: ["In legal style, the condition takes the future subjunctive: ", { link: "Future Subjunctive", to: "es.subjuntivo.subjuntivo-futuro" }], uk: ["У юридичному стилі умова має майбутній час суб’юнктива: ", { link: "Майбутній час суб’юнктива", to: "es.subjuntivo.subjuntivo-futuro" }], pt: ["No estilo jurídico, a condição leva o futuro do subjuntivo: ", { link: "O futuro do subjuntivo", to: "es.subjuntivo.subjuntivo-futuro" }], fr: ["Dans le style juridique, la condition prend le futur du subjonctif : ", { link: "Le futur du subjonctif", to: "es.subjuntivo.subjuntivo-futuro" }], de: ["Im juristischen Stil steht in der Bedingung der Konjunktiv Futur: ", { link: "Der Konjunktiv Futur", to: "es.subjuntivo.subjuntivo-futuro" }], it: ["Nello stile giuridico, la condizione vuole il futuro del congiuntivo: ", { link: "Il futuro del congiuntivo", to: "es.subjuntivo.subjuntivo-futuro" }], pl: ["W stylu prawniczym warunek ma czas przyszły trybu łączącego: ", { link: "Tryb łączący czasu przyszłego", to: "es.subjuntivo.subjuntivo-futuro" }], tr: ["Hukuk dilinde koşulda dilek kipinin gelecek zamanı kullanılır: ", { link: "Dilek kipinin gelecek zamanı", to: "es.subjuntivo.subjuntivo-futuro" }], id: ["Dalam gaya hukum, syarat memakai future subjungtif: ", { link: "Futuro subjungtif", to: "es.subjuntivo.subjuntivo-futuro" }], vi: ["Trong văn phong pháp lý, điều kiện dùng thì tương lai của thức giả định: ", { link: "Thì tương lai của thức giả định", to: "es.subjuntivo.subjuntivo-futuro" }] }
            ex: ["Si el inquilino no ", { target: pagare }, " la renta, el contrato ", { target: quedará }, " anulado."]
            tr: { en: "If the tenant does not pay the rent, the contract will be void.", uk: "Якщо орендар не сплатить оренду, договір буде анульовано.", pt: "Se o inquilino não pagar o aluguel, o contrato ficará anulado.", fr: "Si le locataire ne paie pas le loyer, le contrat sera annulé.", de: "Sollte der Mieter die Miete nicht zahlen, wird der Vertrag aufgehoben.", it: "Se l'inquilino non pagherà l'affitto, il contratto sarà annullato.", pl: "Jeżeli najemca nie zapłaci czynszu, umowa zostanie unieważniona.", tr: "Kiracı kirayı ödemezse sözleşme geçersiz olur.", id: "Jika penyewa tidak membayar sewa, kontrak menjadi batal.", vi: "Nếu người thuê nhà không trả tiền thuê, hợp đồng sẽ bị hủy." }
      - type: list
        items:
          - type: note
            level: B2
            text:
              es: ["Las formas están en ", { link: "El imperfecto de subjuntivo: hablara, hablase", to: es.subjuntivo.subjuntivo-imperfecto }, " y en ", { link: "El condicional simple: comería", to: es.futuro-condicional.condicional-simple }, "."]
              en: ["The forms are in ", { link: "Imperfect Subjunctive: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " and in ", { link: "Conditional: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              uk: ["Форми наведено в темах: ", { link: "Імперфект суб’юнктива: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " та ", { link: "Умовний спосіб: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              pt: ["As formas estão em ", { link: "O imperfeito do subjuntivo: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " e em ", { link: "O condicional simples: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              fr: ["Les formes sont dans ", { link: "L’imparfait du subjonctif : hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " et dans ", { link: "Le conditionnel présent : comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              de: ["Die Formen stehen in ", { link: "Der Konjunktiv Imperfecto: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " und in ", { link: "Der Konditional I: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              it: ["Le forme sono in ", { link: "L'imperfetto del congiuntivo: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " e in ", { link: "Il condizionale semplice: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              pl: ["Formy opisano w tematach: ", { link: "Imperfecto trybu łączącego: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " oraz ", { link: "Tryb warunkowy: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              tr: ["Biçimler şu konularda yer alır: ", { link: "Dilek kipinin imperfecto biçimi: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " ve ", { link: "Basit koşul kipi: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              id: ["Bentuknya ada di ", { link: "Imperfecto subjungtif: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " dan di ", { link: "Kondisional sederhana: comería", to: "es.futuro-condicional.condicional-simple" }, "."]
              vi: ["Các dạng thức có trong ", { link: "Imperfecto của thức giả định: hablara, hablase", to: "es.subjuntivo.subjuntivo-imperfecto" }, " và ", { link: "Thức điều kiện đơn: comería", to: "es.futuro-condicional.condicional-simple" }, "."]

