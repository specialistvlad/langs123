            level: B2
            text:
              es: ["Las formas están en ", { link: "El perfecto y el pluscuamperfecto de subjuntivo: haya hablado, hubiera hablado", to: es.subjuntivo.subjuntivo-compuesto }, " y en ", { link: "El condicional compuesto: habría comido", to: es.futuro-condicional.condicional-compuesto }, "."]
              en: ["The forms are in ", { link: "Present Perfect and Past Perfect Subjunctive: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " and in ", { link: "Conditional Perfect: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              uk: ["Форми наведено в темах: ", { link: "Перфект і плюсквамперфект суб’юнктива: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " та ", { link: "Умовний перфект: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              pt: ["As formas estão em ", { link: "O pretérito perfeito composto e o mais-que-perfeito do subjuntivo: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " e em ", { link: "O condicional composto: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              fr: ["Les formes sont dans ", { link: "Le passé et le plus-que-parfait du subjonctif : haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " et dans ", { link: "Le conditionnel passé : habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              de: ["Die Formen stehen in ", { link: "Der Konjunktiv Perfekt und Plusquamperfekt: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " und in ", { link: "Der Konditional II: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              it: ["Le forme sono in ", { link: "Il passato e il trapassato del congiuntivo: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " e in ", { link: "Il condizionale composto: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              pl: ["Formy opisano w tematach: ", { link: "Perfecto i pluscuamperfecto w trybie łączącym: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " oraz ", { link: "Tryb warunkowy przeszły: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              tr: ["Biçimler şu konularda yer alır: ", { link: "Dilek kipinde perfecto ve pluscuamperfecto: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " ve ", { link: "Tamamlanmış koşul kipi: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              id: ["Bentuknya ada di ", { link: "Perfecto dan pluscuamperfecto subjungtif: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " dan di ", { link: "Kondisional sempurna: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]
              vi: ["Các dạng thức có trong ", { link: "Pretérito perfecto và quá khứ hoàn thành của thức giả định: haya hablado, hubiera hablado", to: "es.subjuntivo.subjuntivo-compuesto" }, " và ", { link: "Thức điều kiện hoàn thành: habría comido", to: "es.futuro-condicional.condicional-compuesto" }, "."]

