            pl: ["przecinek stoi po zdaniu z ", { term: "si" }, ", gdy jest pierwsze"]
            tr: [{ term: "si" }, " bölümü başta gelirse arkasından virgül gelir"]
            id: ["tanda koma mengikuti klausa dengan ", { term: "si" }, " kalau klausa itu di awal"]
            vi: ["dấu phẩy đứng sau mệnh đề có ", { term: "si" }, " khi nó đứng đầu câu"]
          ex: { examples: [[{ target: Si llueve }, ", no salgo."], ["No salgo ", { target: si llueve }, "."]] }
