            tr: { en: { examples: ["We'll walk, unless it rains.", "Tomorrow we get up early, unless you have another plan."] }, uk: { examples: ["Ми підемо пішки, хіба що піде дощ.", "Завтра встаємо рано, хіба що в тебе інші плани."] }, pt: { examples: ["Iremos a pé, a menos que chova.", "Amanhã acordamos cedo, a menos que você tenha outro plano."] }, fr: { examples: ["Nous irons à pied, à moins qu’il ne pleuve.", "Demain, nous nous levons tôt, sauf si tu as un autre projet."] }, de: { examples: ["Wir gehen zu Fuß, es sei denn, es regnet.", "Morgen stehen wir früh auf, es sei denn, du hast etwas anderes vor."] }, it: { examples: ["Andremo a piedi, a meno che non piova.", "Domani ci alziamo presto, salvo che tu abbia un altro programma."] }, pl: { examples: ["Pójdziemy pieszo, chyba że będzie padać.", "Jutro wstajemy wcześnie, chyba że masz inne plany."] }, tr: { examples: ["Yağmur yağmadıkça yürüyerek gideceğiz.", "Başka bir planın yoksa yarın erken kalkıyoruz."] }, id: { examples: ["Kita akan berjalan kaki, kecuali kalau hujan.", "Besok kita bangun pagi-pagi, kecuali kalau kamu punya rencana lain."] }, vi: { examples: ["Chúng ta sẽ đi bộ, trừ khi trời mưa.", "Ngày mai chúng ta dậy sớm, trừ khi bạn có kế hoạch khác."] } }
          - level: B2
            nexo: { pattern: [[{ term: por si }, " ", { optional: acaso }], { slot: { es: indicativo o imperfecto de subjuntivo, en: "indicative or imperfect subjunctive", uk: "дійсний спосіб або імперфект суб’юнктива", pt: "indicativo ou imperfeito do subjuntivo", fr: "indicatif ou imparfait du subjonctif", de: "Indikativ oder Konjunktiv Imperfecto", it: "indicativo o imperfetto del congiuntivo", pl: "tryb oznajmujący lub imperfecto trybu łączącego", tr: "haber kipi ya da dilek kipinin imperfecto zamanı", id: "indikatif atau imperfecto subjungtif", vi: "thức chỉ định hoặc imperfecto của thức giả định" } }] }
            use: { es: "Una precaución ante algo que quizá ocurra; el imperfecto de subjuntivo lo presenta como más remoto", en: "A precaution against something that may happen; the imperfect subjunctive presents it as more remote", uk: "Застереження на випадок того, що, можливо, станеться; імперфект суб’юнктива подає це як віддаленіше", pt: "Uma precaução diante de algo que talvez aconteça; o imperfeito do subjuntivo o apresenta como mais remoto", fr: "Une précaution face à ce qui pourrait arriver ; l’imparfait du subjonctif le présente comme plus lointain", de: "Eine Vorsichtsmaßnahme für den Fall, dass etwas eintritt; der Konjunktiv Imperfecto stellt es als unwahrscheinlicher dar", it: "Una precauzione di fronte a ciò che forse accadrà; l'imperfetto del congiuntivo lo presenta come più remoto", pl: "Środek ostrożności na wypadek czegoś, co może się zdarzyć; imperfecto trybu łączącego przedstawia to jako bardziej odległe", tr: "Olabilecek bir şeye karşı önlem; dilek kipinin imperfecto zamanı bunu daha uzak bir ihtimal olarak sunar", id: "Tindakan berjaga-jaga terhadap sesuatu yang mungkin terjadi; imperfecto subjungtif menyajikannya sebagai lebih jauh kemungkinannya", vi: "Biện pháp phòng ngừa cho điều có thể xảy ra; imperfecto của thức giả định cho thấy điều đó xa vời hơn" }
            ex: { examples: [["Llevo el paraguas ", { target: por si }, " ", { alternatives: [{ target: llueve }, { target: lloviera }] }, "."], ["Guarda el recibo ", { target: por si acaso }, " ", { target: tienes }, " que devolverlo."]] }
            tr: { en: { examples: ["I'm taking the umbrella in case it rains.", "Keep the receipt just in case you have to return it."] }, uk: { examples: ["Беру парасольку про всяк випадок, раптом піде дощ.", "Збережи чек про всяк випадок, якщо доведеться повертати."] }, pt: { examples: ["Levo o guarda-chuva caso chova.", "Guarde o recibo, por via das dúvidas, caso precise devolver."] }, fr: { examples: ["J’emporte le parapluie au cas où il pleuvrait.", "Garde le reçu au cas où tu devrais le rendre."] }, de: { examples: ["Ich nehme den Regenschirm mit, falls es regnet.", "Bewahre den Beleg auf, falls du es zurückgeben musst."] }, it: { examples: ["Prendo l'ombrello nel caso piova.", "Conserva lo scontrino, nel caso tu debba restituirlo."] }, pl: { examples: ["Biorę parasol na wypadek deszczu.", "Zachowaj paragon na wypadek, gdybyś musiał to zwrócić."] }, tr: { examples: ["Yağmur yağarsa diye şemsiyeyi yanıma alıyorum.", "Geri vermen gerekirse diye fişi sakla."] }, id: { examples: ["Saya membawa payung kalau-kalau hujan.", "Simpan struknya, siapa tahu kamu harus mengembalikannya."] }, vi: { examples: ["Tôi mang ô phòng khi trời mưa.", "Hãy giữ hóa đơn, phòng khi bạn phải trả lại hàng."] } }
          - level: C1
            nexo: { pattern: [{ term: menos si }, { slot: { es: indicativo, en: "indicative", uk: "дійсний спосіб", pt: "indicativo", fr: "indicatif", de: "Indikativ", it: "indicativo", pl: "tryb oznajmujący", tr: "haber kipi", id: "indikatif", vi: "thức chỉ định" } }] }
            use: { es: "Otro nexo de excepción, con indicativo", en: "Another linker of exception, with the indicative", uk: "Ще один сполучник винятку, з дійсним способом", pt: "Outro conectivo de exceção, com indicativo", fr: "Un autre connecteur d’exception, avec l’indicatif", de: "Ein weiteres Bindewort der Ausnahme, mit dem Indikativ", it: "Un altro connettivo di eccezione, con l'indicativo", pl: "Kolejne słowo łączące wyrażające wyjątek, z trybem oznajmującym", tr: "Haber kipiyle kullanılan başka bir istisna bağlayıcısı", id: "Kata penghubung pengecualian lain, dengan indikatif", vi: "Một từ nối chỉ ngoại lệ khác, đi với thức chỉ định" }
            ex: ["Puedes pedir lo que quieras, ", { target: menos si }, " ", { target: cuesta }, " demasiado."]
