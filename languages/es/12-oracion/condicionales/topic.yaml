            tr: { en: "If he has called, he will have left a message.", uk: "Якщо він телефонував, то, мабуть, залишив повідомлення.", pt: "Se ele ligou, deve ter deixado um recado.", fr: "S’il a appelé, il aura laissé un message.", de: "Wenn er angerufen hat, wird er wohl eine Nachricht hinterlassen haben.", it: "Se ha chiamato, avrà lasciato un messaggio.", pl: "Jeśli dzwonił, pewnie zostawił wiadomość.", tr: "Aradıysa mutlaka bir mesaj bırakmıştır.", id: "Kalau dia sudah menelepon, mungkin dia sudah meninggalkan pesan.", vi: "Nếu anh ấy đã gọi, chắc là anh ấy đã để lại tin nhắn." }
          - level: B2
            pattern: { pattern: [si, { slot: { es: pretérito indefinido, en: "preterite", uk: "претерит", pt: "pretérito perfeito simples", fr: "prétérit", de: "Indefinido", it: "indefinido", pl: "indefinido", tr: "indefinido", id: "indefinido", vi: "indefinido" } }, { slot: { es: condicional, en: "conditional", uk: "умовний спосіб", pt: "condicional", fr: "conditionnel", de: "Konditional", it: "condizionale", pl: "tryb warunkowy", tr: "koşul kipi", id: "kondisional", vi: "thức điều kiện" } }, { slot: { es: infinitivo compuesto, en: "compound infinitive", uk: "складений інфінітив", pt: "infinitivo composto", fr: "infinitif passé", de: "zusammengesetzter Infinitiv", it: "infinito composto", pl: "bezokolicznik złożony", tr: "birleşik mastar", id: "infinitif majemuk", vi: "động từ nguyên mẫu hoàn thành" } }] }
            use: { es: "Una condición sobre un hecho pasado, con un reproche o una obligación como resultado", en: "A condition about a past event, with a reproach or an obligation as the result", uk: "Умова щодо минулої події, з докором або обов’язком як наслідком", pt: "Uma condição sobre um fato passado, com uma reprovação ou uma obrigação como resultado", fr: "Une condition sur un fait passé, avec un reproche ou une obligation comme résultat", de: "Eine Bedingung über ein vergangenes Ereignis, mit einem Vorwurf oder einer Pflicht als Ergebnis", it: "Una condizione su un fatto passato, con un rimprovero o un obbligo come risultato", pl: "Warunek dotyczący zdarzenia z przeszłości, z wyrzutem lub obowiązkiem jako skutkiem", tr: "Geçmişteki bir olaya dair koşul, sonucu ise bir sitem ya da yükümlülük", id: "Syarat tentang peristiwa lampau, dengan teguran atau kewajiban sebagai hasil", vi: "Điều kiện về một việc đã xảy ra, với lời trách hoặc nghĩa vụ làm kết quả" }
            ex: ["Si de verdad ", { target: llegó }, " ayer, ", { target: tendría que haberme avisado }, "."]
            tr: { en: "If he really arrived yesterday, he should have told me.", uk: "Якщо він справді приїхав учора, він мав би мене попередити.", pt: "Se ele realmente chegou ontem, deveria ter me avisado.", fr: "S’il est vraiment arrivé hier, il aurait dû me prévenir.", de: "Wenn er wirklich gestern angekommen ist, hätte er mir Bescheid sagen müssen.", it: "Se è arrivato davvero ieri, avrebbe dovuto avvisarmi.", pl: "Jeśli naprawdę przyjechał wczoraj, powinien był mnie uprzedzić.", tr: "Gerçekten dün geldiyse bana haber vermesi gerekirdi.", id: "Kalau dia benar-benar tiba kemarin, seharusnya dia memberi tahu saya.", vi: "Nếu anh ấy thật sự đến hôm qua, lẽ ra anh ấy phải báo cho tôi." }
          - level: C2
            pattern: { pattern: [si, { slot: { es: pretérito indefinido, en: "preterite", uk: "претерит", pt: "pretérito perfeito simples", fr: "prétérit", de: "Indefinido", it: "indefinido", pl: "indefinido", tr: "indefinido", id: "indefinido", vi: "indefinido" } }, { slot: { es: imperfecto, en: "imperfect", uk: "імперфект", pt: "imperfeito", fr: "imparfait", de: "Imperfecto", it: "imperfetto", pl: "imperfecto", tr: "imperfecto", id: "imperfecto", vi: "imperfecto" } }] }
            use: { es: "Una deducción sobre un momento pasado: el imperfecto describe cómo era la situación", en: "A deduction about a moment in the past: the imperfect describes what the situation was like", uk: "Висновок про минулий момент: імперфект описує, яка тоді була ситуація", pt: "Uma dedução sobre um momento passado: o imperfeito descreve como era a situação", fr: "Une déduction sur un moment passé : l’imparfait décrit comment était la situation", de: "Eine Schlussfolgerung über einen vergangenen Zeitpunkt: das Imperfecto beschreibt, wie die Lage war", it: "Una deduzione su un momento passato: l'imperfetto descrive com'era la situazione", pl: "Wniosek o przeszłym momencie: imperfecto opisuje, jaka była sytuacja", tr: "Geçmişteki bir ana dair çıkarım: imperfecto durumun nasıl olduğunu anlatır", id: "Deduksi tentang saat di masa lampau: imperfecto menggambarkan keadaan waktu itu", vi: "Suy luận về một thời điểm trong quá khứ: imperfecto mô tả tình hình lúc đó" }
            ex: ["Si ", { target: terminó }, " a las ocho, no ", { target: tenía }, " mucho trabajo."]
            tr: { en: "If he finished at eight, he didn't have much work.", uk: "Якщо він закінчив о восьмій, роботи в нього було небагато.", pt: "Se ele terminou às oito, não tinha muito trabalho.", fr: "S’il a fini à huit heures, il n’avait pas beaucoup de travail.", de: "Wenn er um acht Uhr fertig war, hatte er nicht viel Arbeit.", it: "Se ha finito alle otto, non aveva molto lavoro.", pl: "Jeśli skończył o ósmej, nie miał dużo pracy.", tr: "Sekizde bitirdiyse çok işi yoktu.", id: "Kalau dia selesai pukul delapan, berarti pekerjaannya tidak banyak.", vi: "Nếu anh ấy xong lúc tám giờ thì anh ấy không có nhiều việc." }

  - title: { es: "Nexos de condición", en: "Linkers of condition", uk: "Сполучники умови", pt: "Conectivos de condição", fr: "Connecteurs de condition", de: "Bindewörter der Bedingung", it: "Connettivi di condizione", pl: "Słowa łączące warunek", tr: "Koşul bağlayıcıları", id: "Kata penghubung syarat", vi: "Từ nối chỉ điều kiện" }
