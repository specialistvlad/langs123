            use: { es: "En América, la lengua coloquial sustituye el condicional compuesto por tiempos del indicativo", en: "In the Americas, colloquial speech replaces the conditional perfect with indicative tenses", uk: "В Америці в розмовній мові умовний перфект замінюють часами дійсного способу", pt: "Na América, a língua coloquial substitui o condicional composto por tempos do indicativo", fr: "En Amérique, la langue familière remplace le conditionnel passé par des temps de l’indicatif", de: "In Amerika ersetzt die Umgangssprache den Konditional II durch Zeiten des Indikativs", it: "In America, la lingua colloquiale sostituisce il condizionale composto con tempi dell'indicativo", pl: "W Ameryce język potoczny zastępuje tryb warunkowy przeszły czasami trybu oznajmującego", tr: "Amerika’da gündelik dil, tamamlanmış koşul kipinin yerine haber kipinin zamanlarını kullanır", id: "Di Amerika, bahasa sehari-hari mengganti kondisional sempurna dengan kala indikatif", vi: "Ở châu Mỹ, văn nói thay thức điều kiện hoàn thành bằng các thì của thức chỉ định" }
            ex: { examples: [["Si ", { target: hubieras venido }, ", no ", { target: tenía }, " que hacerlo yo solo."], ["Si no ", { target: llamamos }, ", ", { target: íbamos a quedar }, " mal."]] }
            tr: { en: { examples: ["If you had come, I wouldn't have had to do it alone.", "If we hadn't called, we would have looked bad."] }, uk: { examples: ["Якби ти прийшов, мені не довелося б робити це самому.", "Якби ми не зателефонували, ми б зганьбилися."] }, pt: { examples: ["Se você tivesse vindo, eu não teria precisado fazer isso sozinho.", "Se não tivéssemos ligado, teríamos ficado mal."] }, fr: { examples: ["Si tu étais venu, je n’aurais pas eu à le faire seul.", "Si nous n’avions pas appelé, nous aurions fait mauvaise impression."] }, de: { examples: ["Wenn du gekommen wärst, hätte ich es nicht allein machen müssen.", "Wenn wir nicht angerufen hätten, hätten wir einen schlechten Eindruck gemacht."] }, it: { examples: ["Se fossi venuto, non avrei dovuto farlo da solo.", "Se non avessimo chiamato, avremmo fatto una brutta figura."] }, pl: { examples: ["Gdybyś przyszedł, nie musiałbym tego robić sam.", "Gdybyśmy nie zadzwonili, narobilibyśmy sobie wstydu."] }, tr: { examples: ["Gelseydin bunu tek başıma yapmam gerekmezdi.", "Aramasaydık kötü duruma düşerdik."] }, id: { examples: ["Seandainya kamu datang, saya tidak perlu melakukannya sendirian.", "Seandainya kami tidak menelepon, kami pasti sudah dianggap tidak sopan."] }, vi: { examples: ["Nếu bạn đã đến, tôi đã không phải tự làm một mình.", "Nếu chúng tôi không gọi, chúng tôi đã bị mất mặt."] } }
      - type: list
