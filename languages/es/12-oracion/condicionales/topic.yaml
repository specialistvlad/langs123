          tr: { en: "If Carlota comes, we'll go to the cinema.", uk: "Якщо прийде Карлота, ми підемо в кіно.", pt: "Se a Carlota vier, vamos ao cinema.", fr: "Si Carlota vient, nous irons au cinéma.", de: "Wenn Carlota kommt, gehen wir ins Kino.", it: "Se viene Carlota, andremo al cinema.", pl: "Jeśli przyjdzie Carlota, pójdziemy do kina.", tr: "Carlota gelirse sinemaya gideriz.", id: "Kalau Carlota datang, kita akan pergi ke bioskop.", vi: "Nếu Carlota đến, chúng ta sẽ đi xem phim." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A conditional sentence has two parts: the condition with ", { term: si }, ", and the result."]
              es: ["Una oración condicional tiene dos partes: la condición con ", { term: si }, ", y el resultado."]
              uk: ["Умовне речення має дві частини: умову з ", { term: "si" }, " і наслідок."]
              pt: ["Uma oração condicional tem duas partes: a condição com ", { term: "si" }, " e o resultado."]
              fr: ["Une phrase conditionnelle a deux parties : la condition avec ", { term: "si" }, " et le résultat."]
              de: ["Ein Bedingungssatz hat zwei Teile: die Bedingung mit ", { term: "si" }, " und das Ergebnis."]
              it: ["Il periodo ipotetico ha due parti: la condizione con ", { term: "si" }, " e il risultato."]
              pl: ["Zdanie warunkowe ma dwie części: warunek z ", { term: "si" }, " i wynik."]
              tr: ["Koşul cümlesinin iki bölümü vardır: ", { term: "si" }, " ile kurulan koşul ve sonuç."]
              id: ["Kalimat bersyarat punya dua bagian: syarat dengan ", { term: "si" }, " dan hasilnya."]
              vi: ["Câu điều kiện có hai phần: điều kiện với ", { term: "si" }, " và kết quả."]
          - type: rule
            level: A2
            text:
              en: ["Either part can come first; a comma follows the ", { term: si }, " clause when it opens the sentence:"]
              es: ["Cualquiera de las dos partes puede ir primero; una coma sigue a la oración con ", { term: si }, " cuando abre la frase:"]
              uk: ["Будь-яка частина може йти першою; кома стоїть після частини з ", { term: "si" }, ", коли вона починає речення:"]
              pt: ["Qualquer uma das partes pode vir primeiro; uma vírgula vem depois da oração com ", { term: "si" }, " quando ela abre a frase:"]
              fr: ["L’une ou l’autre partie peut venir en premier ; une virgule suit la proposition en ", { term: "si" }, " quand elle ouvre la phrase :"]
              de: ["Jeder der beiden Teile kann vorn stehen; ein Komma folgt auf den Satz mit ", { term: "si" }, ", wenn er den Satz eröffnet:"]
              it: ["Ciascuna delle due parti può venire per prima; una virgola segue la frase con ", { term: "si" }, " quando apre il periodo:"]
              pl: ["Każda z dwóch części może stać na początku; przecinek stoi po zdaniu z ", { term: "si" }, ", gdy otwiera wypowiedzenie:"]
              tr: ["İki bölümden biri başta olabilir; ", { term: "si" }, " bölümü cümleyi açıyorsa arkasından virgül gelir:"]
              id: ["Kedua bagian boleh muncul lebih dulu; tanda koma mengikuti klausa dengan ", { term: "si" }, " kalau klausa itu membuka kalimat:"]
              vi: ["Phần nào cũng có thể đứng trước; dấu phẩy đứng sau mệnh đề có ", { term: "si" }, " khi nó mở đầu câu:"]
            ex: { examples: [[{ target: Si llueve }, ", no salgo."], ["No salgo ", { target: si llueve }, "."]] }
            tr: { en: { examples: ["If it rains, I don't go out.", "I don't go out if it rains."] }, uk: { examples: ["Якщо йде дощ, я не виходжу.", "Я не виходжу, якщо йде дощ."] }, pt: { examples: ["Se chover, eu não saio.", "Eu não saio se chover."] }, fr: { examples: ["S’il pleut, je ne sors pas.", "Je ne sors pas s’il pleut."] }, de: { examples: ["Wenn es regnet, gehe ich nicht aus.", "Ich gehe nicht aus, wenn es regnet."] }, it: { examples: ["Se piove, non esco.", "Non esco se piove."] }, pl: { examples: ["Jeśli pada, nie wychodzę.", "Nie wychodzę, jeśli pada."] }, tr: { examples: ["Yağmur yağarsa dışarı çıkmam.", "Dışarı çıkmam, yağmur yağarsa."] }, id: { examples: ["Kalau hujan, saya tidak keluar.", "Saya tidak keluar kalau hujan."] }, vi: { examples: ["Nếu trời mưa, tôi không ra ngoài.", "Tôi không ra ngoài nếu trời mưa."] } }

  - title: { en: Form, es: Forma, uk: "Форма", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, pattern: { pattern: [si, { slot: present }, { slot: present }] }, ex: [{ target: Si quieres }, " ir al cine, ", { target: puedes }, " comprar la entrada por internet."], tr: { en: "If you want to go to the cinema, you can buy the ticket online.", uk: "Якщо хочеш піти в кіно, можеш купити квиток в інтернеті.", pt: "Se você quiser ir ao cinema, pode comprar o ingresso pela internet.", fr: "Si tu veux aller au cinéma, tu peux acheter ta place en ligne.", de: "Wenn du ins Kino gehen willst, kannst du die Karte im Internet kaufen.", it: "Se vuoi andare al cinema, puoi comprare il biglietto su internet.", pl: "Jeśli chcesz iść do kina, możesz kupić bilet przez internet.", tr: "Sinemaya gitmek istersen bileti internetten alabilirsin.", id: "Kalau kamu mau pergi ke bioskop, kamu bisa membeli tiketnya lewat internet.", vi: "Nếu bạn muốn đi xem phim, bạn có thể mua vé qua mạng." } }
          - { level: B1, pattern: { pattern: [si, { slot: present }, { slot: { en: future, es: futuro, uk: "майбутній час", pt: "futuro", fr: "futur", de: "Zukunft", it: "futuro", pl: "czas przyszły", tr: "gelecek zaman", id: "future", vi: "thì tương lai" } }] }, ex: [{ target: Si tengo }, " tiempo, ", { target: iré }, "."], tr: { en: "If I have time, I'll go.", uk: "Якщо матиму час, піду.", pt: "Se eu tiver tempo, eu vou.", fr: "Si j’ai le temps, j’irai.", de: "Wenn ich Zeit habe, gehe ich hin.", it: "Se ho tempo, ci andrò.", pl: "Jeśli będę mieć czas, pójdę.", tr: "Zamanım olursa giderim.", id: "Kalau saya punya waktu, saya akan pergi.", vi: "Nếu tôi có thời gian, tôi sẽ đi." } }
          - { level: B1, pattern: { pattern: [si, { slot: present }, { slot: { en: imperative, es: imperativo, uk: "наказовий спосіб", pt: "imperativo", fr: "impératif", de: "Imperativ", it: "imperativo", pl: "tryb rozkazujący", tr: "emir kipi", id: "perintah", vi: "thức mệnh lệnh" } }] }, ex: [{ target: Si tienes }, " frío, ", { target: cierra }, " la ventana."], tr: { en: "If you're cold, close the window.", uk: "Якщо тобі холодно, зачини вікно.", pt: "Se você estiver com frio, feche a janela.", fr: "Si tu as froid, ferme la fenêtre.", de: "Wenn dir kalt ist, mach das Fenster zu.", it: "Se hai freddo, chiudi la finestra.", pl: "Jeśli ci zimno, zamknij okno.", tr: "Üşüyorsan pencereyi kapat.", id: "Kalau kamu kedinginan, tutup jendelanya.", vi: "Nếu bạn thấy lạnh, hãy đóng cửa sổ lại." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["After ", { term: si }, ", the verb stays in the present, even when the condition is in the future:"]
              es: ["Detrás de ", { term: si }, ", el verbo va en presente, también cuando la condición está en el futuro:"]
              uk: ["Після ", { term: "si" }, " дієслово стоїть у теперішньому часі, навіть коли умова стосується майбутнього:"]
              pt: ["Depois de ", { term: "si" }, ", o verbo fica no presente, também quando a condição se refere ao futuro:"]
              fr: ["Après ", { term: "si" }, ", le verbe reste au présent, même quand la condition porte sur le futur :"]
              de: ["Nach ", { term: "si" }, " steht das Verb im Präsens, auch wenn die Bedingung in der Zukunft liegt:"]
              it: ["Dopo ", { term: "si" }, " il verbo resta al presente, anche quando la condizione riguarda il futuro:"]
              pl: ["Po ", { term: "si" }, " czasownik stoi w czasie teraźniejszym, także gdy warunek dotyczy przyszłości:"]
              tr: ["Koşul gelecekle ilgili olsa bile ", { term: "si" }, " sonrasında fiil şimdiki zamanda kalır:"]
              id: ["Setelah ", { term: "si" }, ", kata kerja tetap dalam present, juga ketika syaratnya ada di masa depan:"]
              vi: ["Sau ", { term: "si" }, ", động từ ở thì hiện tại, kể cả khi điều kiện thuộc về tương lai:"]
            ex: [{ target: Si viene }, " Carlota, iremos al cine."]
            tr: { en: "If Carlota comes, we'll go to the cinema.", uk: "Якщо прийде Карлота, ми підемо в кіно.", pt: "Se a Carlota vier, vamos ao cinema.", fr: "Si Carlota vient, nous irons au cinéma.", de: "Wenn Carlota kommt, gehen wir ins Kino.", it: "Se viene Carlota, andremo al cinema.", pl: "Jeśli przyjdzie Carlota, pójdziemy do kina.", tr: "Carlota gelirse sinemaya gideriz.", id: "Kalau Carlota datang, kita akan pergi ke bioskop.", vi: "Nếu Carlota đến, chúng ta sẽ đi xem phim." }

