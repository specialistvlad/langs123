# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.preposiciones.por-para
lang: es
kind: grammar
tags: [prepositions, por, para, purpose, cause]
concepts: [por-para]
related: [es.preposiciones.preposiciones-basicas, es.fundamentos.la-hora, es.oracion.estilo-indirecto-pasiva]
status: { en: draft, es: draft, uk: draft }
translated: { en: "bf18c0 2ccc8a 039c89 848b9d 960c5b 4d9b1e bc8e37", uk: "bf18c0 2ccc8a 039c89 848b9d 960c5b 4d9b1e bc8e37" }

title: { en: Por and Para, es: Por y para, uk: "Por і para" }
summary:
  lead:
    en: [{ term: Para }, " points to a goal, such as a purpose or a destination, and ", { term: por }, " to a cause, a route, a means or an exchange."]
    es: [{ term: Para }, " apunta a una meta, como una finalidad o un destino, y ", { term: por }, ", a una causa, un recorrido, un medio o un intercambio."]
    uk: [{ term: "Para" }, " вказує на мету — призначення чи пункт призначення, а ", { term: "por" }, " — на причину, шлях, засіб або обмін."]
  rule:
    en: [{ term: Para }, " with an infinitive gives a purpose, and ", { term: por }, " with a noun gives a cause:"]
    es: [{ term: Para }, " con infinitivo indica finalidad, y ", { term: por }, " con un sustantivo indica causa:"]
    uk: [{ term: "Para" }, " з інфінітивом виражає мету, а ", { term: "por" }, " з іменником — причину:"]
  ex: { examples: [["Estudio ", { target: para }, " aprender."], ["No salgo ", { target: por }, " la lluvia."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: { pattern: [para, { slot: infinitive }] }
          rule: { en: "purpose: in order to", es: "finalidad", uk: "мета: щоб" }
          ex: ["Estudio ", { target: para }, " aprender."]
          tr: { en: I study to learn., uk: "Я займаюся, щоб навчитися." }
        - level: A2
          point: para
          rule: { en: "destination: towards", es: "destino", uk: "напрямок: до, у" }
          ex: ["Salgo ", { target: para }, " Lima."]
          tr: { en: "I'm leaving for Lima.", uk: "Я їду до Ліми." }
        - level: A2
          point: para
          rule: { en: "recipient: who it is for", es: "destinatario", uk: "адресат: для кого" }
          ex: ["Este regalo es ", { target: para }, " ti."]
          tr: { en: This present is for you., uk: "Цей подарунок для тебе." }
        - level: A2
          point: para
          rule: { en: "deadline: by when", es: "plazo", uk: "строк: до якого часу" }
          ex: ["El trabajo es ", { target: para }, " el lunes."]
          tr: { en: The work is for Monday., uk: "Роботу треба зробити до понеділка." }
        - level: B1
          point: para mí
          rule: { en: "opinion: in my view", es: "opinión", uk: "думка: на мою думку" }
          ex: [{ target: Para mí }, ", es fácil."]
          tr: { en: "For me, it's easy.", uk: "Як на мене, це легко." }
        - level: A2
          point: por
          rule: { en: "cause: because of", es: "causa", uk: "причина: через" }
          ex: ["Gracias ", { target: por }, " todo."]
          tr: { en: Thanks for everything., uk: "Дякую за все." }
        - level: A2
          point: por
          rule: { en: "route: through, along, around", es: "recorrido o lugar aproximado", uk: "шлях: через, уздовж, по" }
          ex: ["Paseo ", { target: por }, " el parque."]
          tr: { en: I walk through the park., uk: "Я гуляю парком." }
        - level: A2
          point: por
          rule: { en: "means: by", es: "medio", uk: "засіб: по, за допомогою" }
          ex: ["Hablamos ", { target: por }, " teléfono."]
          tr: { en: We talk on the phone., uk: "Ми розмовляємо по телефону." }
        - level: A2
          point: por
          rule: { en: "exchange: in return for", es: "intercambio", uk: "обмін: в обмін на" }
          ex: ["Te cambio mi libro ", { target: por }, " tu revista."]
          tr: { en: "I'll swap my book for your magazine.", uk: "Я поміняю свою книжку на твій журнал." }
        - level: A1
          point: por
          rule: { en: a part of the day, es: parte del día, uk: "частина доби" }
          ex: ["Trabajo ", { target: por }, " la mañana."]
          tr: { en: I work in the morning., uk: "Я працюю вранці." }
        - level: A2
          point: por
          rule: { en: per, es: distribución, uk: "на, за (розподіл)" }
          ex: ["dos veces ", { target: por }, " semana"]
          tr: { en: twice a week, uk: "двічі на тиждень" }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: para }, " looks ahead to a goal: what for, where to, who for, by when."]
              es: [{ term: para }, " mira hacia una meta: para qué, hacia dónde, para quién, para cuándo."]
              uk: [{ term: "para" }, " вказує на мету: навіщо, куди, для кого, до якого часу."]
          - type: rule
            level: A2
            text:
              en: [{ term: por }, " looks back to a cause, or along a way: why, through where, by what means, in exchange for what."]
              es: [{ term: por }, " mira hacia una causa o a lo largo de un camino: por qué, por dónde, por qué medio, a cambio de qué."]
              uk: [{ term: "por" }, " вказує на причину або на шлях: чому, через що, яким способом, в обмін на що."]
          - type: note
            level: A2
            text:
              en: "English for can be either, so the meaning decides:"
              es: "Las dos pueden ir en la misma frase, con significados distintos:"
              uk: "Обидва прийменники можуть стояти в одному реченні, але мають різне значення:"
            ex: { examples: [["Trabajo ", { target: para }, " una empresa."], ["Trabajo ", { target: por }, " mi familia."]] }
            tr: { en: { examples: [I work for a company., I work for the sake of my family.] }, uk: { examples: ["Я працюю на компанію.", "Я працюю заради своєї сім’ї."] } }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українські прийменники не відповідають ", { term: por }, " і ", { term: para }, " один до одного: ", { l1: "дякую за" }, " — ", { term: "gracias por" }, ", ", { l1: "по телефону" }, " — ", { term: "por teléfono" }, ", ", { l1: "для тебе" }, " — ", { term: "para ti" }, ", ", { l1: "через дощ" }, " — ", { term: "por la lluvia" }, "."]

  - title: { en: "Use: para", es: "Uso: para", uk: "Вживання: para" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, use: { en: "purpose, with an infinitive", es: "finalidad, con infinitivo", uk: "мета, з інфінітивом" }, ex: ["Ahorro ", { target: para }, " viajar."], tr: { en: I save up to travel., uk: "Я заощаджую, щоб подорожувати." } }
          - { level: A1, use: { en: "what a thing is for", es: "para qué sirve una cosa", uk: "для чого річ" }, ex: ["El lápiz es ", { target: para }, " escribir."], tr: { en: The pencil is for writing., uk: "Олівець — щоб писати." } }
          - { level: A2, use: { en: destination, es: destino, uk: "напрямок, пункт призначення" }, ex: ["El tren sale ", { target: para }, " Madrid."], tr: { en: The train leaves for Madrid., uk: "Потяг відправляється до Мадрида." } }
          - { level: A2, use: { en: recipient, es: destinatario, uk: "адресат" }, ex: ["Las flores son ", { target: para }, " mi madre."], tr: { en: The flowers are for my mother., uk: "Квіти для моєї мами." } }
          - { level: A2, use: { en: deadline, es: plazo, uk: "строк" }, ex: ["Necesito el informe ", { target: para }, " el viernes."], tr: { en: I need the report by Friday., uk: "Мені потрібен звіт до п’ятниці." } }
          - { level: A2, use: { en: employer, es: "para quién se trabaja", uk: "роботодавець" }, ex: ["Trabajo ", { target: para }, " una empresa alemana."], tr: { en: I work for a German company., uk: "Я працюю в німецькій компанії." } }
          - { level: B1, use: { en: opinion, es: opinión, uk: "думка" }, ex: [{ target: Para mí }, ", el español es fácil."], tr: { en: "For me, Spanish is easy.", uk: "Як на мене, іспанська легка." } }
          - { level: B1, use: { en: "compared with what is expected", es: "comparación con lo esperable", uk: "порівняно з очікуваним" }, ex: ["Habla muy bien ", { target: para }, " su edad."], tr: { en: She speaks very well for her age., uk: "Як на свій вік, вона говорить дуже добре." } }

  - title: { en: "Use: por", es: "Uso: por", uk: "Вживання: por" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: "cause, reason", es: "causa, motivo", uk: "причина, підстава" }, ex: ["No salgo ", { target: por }, " la lluvia."], tr: { en: "I'm not going out because of the rain.", uk: "Я не виходжу через дощ." } }
          - { level: A2, use: { en: [{ term: gracias por }, ", ", { term: perdón por }], es: [{ term: gracias por }, ", ", { term: perdón por }], uk: [{ term: "gracias por" }, ", ", { term: "perdón por" }] }, ex: ["Gracias ", { target: por }, " la ayuda."], tr: { en: Thanks for the help., uk: "Дякую за допомогу." } }
          - { level: A2, use: { en: "through, along", es: "a través de, a lo largo de", uk: "через, уздовж" }, ex: ["Paseamos ", { target: por }, " la playa."], tr: { en: We walk along the beach., uk: "Ми гуляємо вздовж пляжу." } }
          - { level: A2, use: { en: somewhere around, es: lugar aproximado, uk: "десь поблизу" }, ex: ["¿Hay un banco ", { target: por }, " aquí?"], tr: { en: Is there a bank around here?, uk: "Тут поблизу є банк?" } }
          - { level: A1, use: { en: a part of the day, es: una parte del día, uk: "частина доби" }, ex: ["Estudio ", { target: por }, " la tarde."], tr: { en: I study in the afternoon., uk: "Я навчаюся вдень." } }
          - { level: A2, use: { en: means, es: medio, uk: "засіб" }, ex: ["Te mando las fotos ", { target: por }, " correo."], tr: { en: "I'll send you the photos by email.", uk: "Я надішлю тобі фото електронною поштою." } }
          - { level: A2, use: { en: "exchange, price", es: "intercambio, precio", uk: "обмін, ціна" }, ex: ["Te cambio mi libro ", { target: por }, " tu revista."], tr: { en: "I'll swap my book for your magazine.", uk: "Я поміняю свою книжку на твій журнал." } }
          - { level: A2, use: { en: per, es: distribución, uk: "на, за (розподіл)" }, ex: ["Voy al gimnasio dos veces ", { target: por }, " semana."], tr: { en: I go to the gym twice a week., uk: "Я ходжу в спортзал двічі на тиждень." } }
          - { level: A2, use: { en: "for the sake of, in place of", es: "en favor de, en lugar de", uk: "заради когось, замість когось" }, ex: ["Lo hago ", { target: por }, " ti."], tr: { en: "I'm doing it for you.", uk: "Я роблю це заради тебе." } }
      - type: list
        items:
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["To go and get something is ", { term: ir por }, ":"]
              es: ["Ir a buscar algo es ", { term: ir por }, ":"]
              uk: ["Піти по щось — це ", { term: "ir por" }, ":"]
            ex: ["Voy ", { target: por }, " pan."]
            tr: { en: "I'm going to get bread.", uk: "Я йду по хліб." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["To go and get something is ", { term: ir a por }, ":"]
              es: ["Ir a buscar algo es ", { term: ir a por }, ":"]
              uk: ["Піти по щось — це ", { term: "ir a por" }, ":"]
            ex: ["Voy ", { target: a por }, " pan."]
            tr: { en: "I'm going to get bread.", uk: "Я йду по хліб." }

  - title: { en: "Compare: por or para", es: "Comparación: por o para", uk: "Порівняння: por чи para" }
    role: compare
    content:
      - type: usage
        columns:
          - { key: sentence, label: { en: Sentence, es: Frase, uk: "Речення" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
        rows:
          - { level: B1, sentence: ["Lo hago ", { target: por }, " ti."], meaning: { en: "I do it for your sake, or in your place", es: "tú eres el motivo, o lo hago en tu lugar", uk: "я роблю це заради тебе або замість тебе" } }
          - { level: B1, sentence: ["Lo hago ", { target: para }, " ti."], meaning: { en: "I make it for you: you will get it", es: "tú vas a recibirlo", uk: "я роблю це для тебе: ти це отримаєш" } }
          - { level: B1, sentence: ["Paso ", { target: por }, " Madrid."], meaning: { en: I go through Madrid, es: Madrid está en mi camino, uk: "я їду через Мадрид" } }
          - { level: B1, sentence: ["Voy ", { target: para }, " Madrid."], meaning: { en: "I'm heading for Madrid", es: Madrid es mi destino, uk: "я їду до Мадрида" } }
          - { level: B1, sentence: ["Trabaja ", { target: por }, " su familia."], meaning: { en: She works to support her family, es: su familia es el motivo, uk: "вона працює, щоб утримувати сім’ю" } }
          - { level: B1, sentence: ["Trabaja ", { target: para }, " una empresa."], meaning: { en: A company employs her, es: una empresa la contrata, uk: "вона працює на компанію" } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Gracias para todo., right: ["Gracias ", { target: por }, " todo."], rule: { en: ["thanks take ", { term: por }], es: [{ term: gracias }, " lleva ", { term: por }], uk: [{ term: "gracias" }, " вживається з ", { term: "por" }, ": українське «дякую за» — це ", { term: "gracias por" }] } }
          - { level: A1, wrong: Estudio por aprender., right: ["Estudio ", { target: para }, " aprender."], rule: { en: ["a purpose takes ", { term: para }], es: ["la finalidad lleva ", { term: para }], uk: ["мета вимагає ", { term: "para" }] } }
          - { level: A2, wrong: Este regalo es por ti., right: ["Este regalo es ", { target: para }, " ti."], rule: { en: ["the person who receives it takes ", { term: para }], es: ["el destinatario lleva ", { term: para }], uk: ["той, хто отримує, вимагає ", { term: "para" }] } }
          - { level: A2, wrong: Paseo para el parque., right: ["Paseo ", { target: por }, " el parque."], rule: { en: ["moving through a place takes ", { term: por }], es: ["el recorrido lleva ", { term: por }], uk: ["рух через місце вимагає ", { term: "por" }] } }
          - { level: A2, wrong: Hablamos para teléfono., right: ["Hablamos ", { target: por }, " teléfono."], rule: { en: ["a means takes ", { term: por }], es: ["el medio lleva ", { term: por }], uk: ["засіб вимагає ", { term: "por" }] } }
          - { level: A2, wrong: Voy al gimnasio tres veces para semana., right: ["Voy al gimnasio tres veces ", { target: por }, " semana."], rule: { en: ["per is ", { term: por }], es: ["la distribución lleva ", { term: por }], uk: ["«на» в значенні розподілу — це ", { term: "por" }] } }
          - { level: A2, speakers: [en], wrong: Espero para mi amiga., right: ["Espero ", { target: a }, " mi amiga."], rule: { en: ["wait for is ", { term: esperar }, ", with ", { term: a }, " before a person"] } }
          - { level: A2, speakers: [en], wrong: Busco para mis llaves., right: ["Busco ", { target: mis llaves }, "."], rule: { en: ["look for is ", { term: buscar }, ", with no preposition"] } }
          - { level: A2, speakers: [uk], wrong: Pagué diez euros para el libro., right: ["Pagué diez euros ", { target: por }, " el libro."], rule: { uk: ["ціна вживається з ", { term: por }, ": «заплатив за книжку» — ", { term: "pagué por el libro" }] } }
