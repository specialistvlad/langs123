title: { en: Por and Para, es: Por y para, uk: "Por і para", pt: "Por e para", fr: "Por et para", de: "Por und para", it: "Por e para", pl: "Por i para", tr: "Por ve para", id: "Por dan para", vi: "Por và para" }
summary:
  lead:
    en: [{ term: Para }, " points to a goal, such as a purpose or a destination, and ", { term: por }, " to a cause, a route, a means or an exchange."]
    es: [{ term: Para }, " apunta a una meta, como una finalidad o un destino, y ", { term: por }, ", a una causa, un recorrido, un medio o un intercambio."]
    uk: [{ term: "Para" }, " вказує на мету — призначення чи пункт призначення, а ", { term: "por" }, " — на причину, шлях, засіб або обмін."]
    pt: [{ term: Para }, " indica uma meta, como uma finalidade ou um destino, e ", { term: por }, ", uma causa, um trajeto, um meio ou uma troca."]
    fr: [{ term: Para }, " indique un but, comme une finalité ou une destination, et ", { term: por }, " une cause, un trajet, un moyen ou un échange."]
    de: [{ term: Para }, " zeigt ein Ziel an, etwa einen Zweck oder ein Reiseziel, und ", { term: por }, " eine Ursache, einen Weg, ein Mittel oder einen Tausch."]
    it: [{ term: Para }, " indica una meta, come uno scopo o una destinazione, e ", { term: por }, " una causa, un percorso, un mezzo o uno scambio."]
    pl: [{ term: Para }, " wskazuje cel, na przykład zamiar lub miejsce docelowe, a ", { term: por }, " przyczynę, drogę, środek lub wymianę."]
    tr: [{ term: Para }, " bir hedefi, örneğin bir amacı ya da bir varış yerini; ", { term: por }, " ise bir nedeni, bir güzergâhı, bir aracı ya da bir değişimi gösterir."]
    id: [{ term: Para }, " menunjuk ke sebuah tujuan, misalnya maksud atau tempat yang dituju, dan ", { term: por }, " menunjuk ke sebab, rute, sarana, atau pertukaran."]
    vi: [{ term: Para }, " chỉ một đích, như mục đích hay nơi đến, còn ", { term: por }, " chỉ nguyên nhân, lộ trình, phương tiện hay sự trao đổi."]
  rule:
    en: [{ term: Para }, " with an infinitive gives a purpose, and ", { term: por }, " with a noun gives a cause:"]
    es: [{ term: Para }, " con infinitivo indica finalidad, y ", { term: por }, " con un sustantivo indica causa:"]
    uk: [{ term: "Para" }, " з інфінітивом виражає мету, а ", { term: "por" }, " з іменником — причину:"]
    pt: [{ term: Para }, " com infinitivo indica finalidade, e ", { term: por }, " com substantivo indica causa:"]
    fr: [{ term: Para }, " avec un infinitif exprime le but, et ", { term: por }, " avec un nom exprime la cause :"]
    de: [{ term: Para }, " mit Infinitiv nennt den Zweck, und ", { term: por }, " mit Nomen nennt die Ursache:"]
    it: [{ term: Para }, " con l'infinito indica lo scopo, e ", { term: por }, " con un sostantivo indica la causa:"]
    pl: [{ term: Para }, " z bezokolicznikiem wyraża cel, a ", { term: por }, " z rzeczownikiem wyraża przyczynę:"]
    tr: [{ term: Para }, " mastarla amacı, ", { term: por }, " ise bir isimle nedeni bildirir:"]
    id: [{ term: Para }, " dengan infinitif menyatakan tujuan, dan ", { term: por }, " dengan kata benda menyatakan sebab:"]
    vi: [{ term: Para }, " với động từ nguyên mẫu chỉ mục đích, còn ", { term: por }, " với danh từ chỉ nguyên nhân:"]
  ex: { examples: [["Estudio ", { target: para }, " aprender."], ["No salgo ", { target: por }, " la lluvia."]] }

