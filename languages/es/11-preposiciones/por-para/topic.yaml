sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: para }, " looks ahead to a goal: what for, where to, who for, by when."]
              es: [{ term: para }, " mira hacia una meta: para qué, hacia dónde, para quién, para cuándo."]
              uk: [{ term: "para" }, " вказує на мету: навіщо, куди, для кого, до якого часу."]
              pt: [{ term: para }, " olha para uma meta: para quê, para onde, para quem, para quando."]
              fr: [{ term: para }, " regarde vers un but : pour quoi faire, vers où, pour qui, pour quand."]
              de: [{ term: para }, " blickt auf ein Ziel: wozu, wohin, für wen, bis wann."]
              it: [{ term: para }, " guarda verso una meta: per quale scopo, verso dove, per chi, per quando."]
              pl: [{ term: para }, " wskazuje cel: po co, dokąd, dla kogo, na kiedy."]
              tr: [{ term: para }, " bir hedefe bakar: ne için, nereye, kim için, ne zamana kadar."]
              id: [{ term: para }, " menunjuk ke sebuah tujuan: untuk apa, ke mana, untuk siapa, untuk kapan."]
              vi: [{ term: para }, " hướng tới một đích: để làm gì, đi đâu, cho ai, đến khi nào."]
          - type: rule
            level: A2
            text:
              en: [{ term: por }, " looks back to a cause, or along a way: why, through where, by what means, in exchange for what."]
              es: [{ term: por }, " mira hacia una causa o a lo largo de un camino: por qué, por dónde, por qué medio, a cambio de qué."]
              uk: [{ term: "por" }, " вказує на причину або на шлях: чому, через що, яким способом, в обмін на що."]
              pt: [{ term: por }, " olha para uma causa ou ao longo de um caminho: por quê, por onde, por qual meio, em troca de quê."]
              fr: [{ term: por }, " regarde vers une cause ou le long d’un chemin : pourquoi, par où, par quel moyen, en échange de quoi."]
              de: [{ term: por }, " blickt auf eine Ursache oder entlang eines Weges: warum, wo entlang, womit, im Tausch wogegen."]
              it: [{ term: por }, " guarda a una causa o lungo un percorso: perché, per dove, con quale mezzo, in cambio di che cosa."]
              pl: [{ term: por }, " wskazuje przyczynę lub drogę: dlaczego, którędy, jakim środkiem, w zamian za co."]
              tr: [{ term: por }, " bir nedene ya da bir yol boyunca bakar: neden, nereden, hangi araçla, neyin karşılığında."]
              id: [{ term: por }, " menunjuk ke sebab atau menyusuri sebuah jalan: mengapa, lewat mana, dengan sarana apa, sebagai ganti apa."]
              vi: [{ term: por }, " hướng về nguyên nhân hoặc dọc theo một con đường: vì sao, đi qua đâu, bằng phương tiện nào, đổi lấy cái gì."]
          - type: note
            level: A2
            text:
              en: "English for can be either, so the meaning decides:"
              es: "Las dos pueden ir en la misma frase, con significados distintos:"
              uk: "Обидва прийменники можуть стояти в одному реченні, але мають різне значення:"
              pt: "As duas podem aparecer na mesma frase, com significados diferentes:"
              fr: "Les deux peuvent figurer dans la même phrase, avec des sens différents :"
              de: "Beide können im selben Satz stehen, mit verschiedener Bedeutung:"
              it: "Le due possono stare nella stessa frase, con significati diversi:"
              pl: "Oba mogą stać w jednym zdaniu, ale mają różne znaczenia:"
              tr: "İkisi de aynı cümlede bulunabilir, ama anlamları farklıdır:"
              id: "Keduanya bisa muncul dalam kalimat yang sama, dengan arti yang berbeda:"
              vi: "Cả hai có thể đứng trong cùng một câu, nhưng nghĩa khác nhau:"
            ex: { examples: [["Trabajo ", { target: para }, " una empresa."], ["Trabajo ", { target: por }, " mi familia."]] }
            tr: { en: { examples: [I work for a company., I work for the sake of my family.] }, uk: { examples: ["Я працюю на компанію.", "Я працюю заради своєї сім’ї."] }, pt: { examples: ["Trabalho para uma empresa.", "Trabalho pela minha família."] }, fr: { examples: ["Je travaille pour une entreprise.", "Je travaille pour le bien de ma famille."] }, de: { examples: ["Ich arbeite für eine Firma.", "Ich arbeite meiner Familie zuliebe."] }, it: { examples: ["Lavoro per un'azienda.", "Lavoro per la mia famiglia."] }, pl: { examples: ["Pracuję w firmie.", "Pracuję dla mojej rodziny."] }, tr: { examples: ["Bir şirkette çalışıyorum.", "Ailem uğruna çalışıyorum."] }, id: { examples: ["Saya bekerja untuk sebuah perusahaan.", "Saya bekerja demi keluarga saya."] }, vi: { examples: ["Tôi làm việc cho một công ty.", "Tôi làm việc vì gia đình mình."] } }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українські прийменники не відповідають ", { term: por }, " і ", { term: para }, " один до одного: ", { l1: "дякую за" }, " — ", { term: "gracias por" }, ", ", { l1: "по телефону" }, " — ", { term: "por teléfono" }, ", ", { l1: "для тебе" }, " — ", { term: "para ti" }, ", ", { l1: "через дощ" }, " — ", { term: "por la lluvia" }, "."]

  - title: { en: "Use: para", es: "Uso: para", uk: "Вживання: para", pt: "Uso: para", fr: "Emploi : para", de: "Gebrauch: para", it: "Uso: para", pl: "Użycie: para", tr: "Kullanım: para", id: "Penggunaan: para", vi: "Cách dùng: para" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
