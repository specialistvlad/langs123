# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.preposiciones.por-para
lang: es
kind: grammar
tags: [prepositions, por, para, purpose, cause]
concepts: [por-para]
related: [es.preposiciones.preposiciones-basicas, es.fundamentos.la-hora, es.oracion.estilo-indirecto-pasiva]
status: { en: draft, es: draft }
translated: { es: "9373f8 f9dd01 0425ec 47dea0 c2c6e3 406a40 71ebcc" }

title: { en: Por and Para, es: Por y para }
summary:
  lead:
    en: [{ term: Para }, " points to a goal, such as a purpose or a destination, and ", { term: por }, " to a cause, a route, a means or an exchange."]
    es: [{ term: Para }, " apunta a una meta, como una finalidad o un destino, y ", { term: por }, ", a una causa, un recorrido, un medio o un intercambio."]
  rule:
    en: [{ term: Para }, " with an infinitive gives a purpose, and ", { term: por }, " with a noun gives a cause:"]
    es: [{ term: Para }, " con infinitivo indica finalidad, y ", { term: por }, " con un nombre indica causa:"]
  ex: { examples: [["Estudio ", { target: para }, " aprender."], ["No salgo ", { target: por }, " la lluvia."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: { pattern: [para, { slot: infinitive }] }
          rule: { en: "purpose: in order to", es: "finalidad" }
          ex: ["Estudio ", { target: para }, " aprender."]
          tr: { en: I study to learn. }
        - level: A2
          point: para
          rule: { en: "destination: towards", es: "destino" }
          ex: ["Salgo ", { target: para }, " Lima."]
          tr: { en: "I'm leaving for Lima." }
        - level: A2
          point: para
          rule: { en: "recipient: who it is for", es: "destinatario" }
          ex: ["Este regalo es ", { target: para }, " ti."]
          tr: { en: This present is for you. }
        - level: A2
          point: para
          rule: { en: "deadline: by when", es: "plazo" }
          ex: ["El trabajo es ", { target: para }, " el lunes."]
          tr: { en: The work is for Monday. }
        - level: B1
          point: para mí
          rule: { en: "opinion: in my view", es: "opinión" }
          ex: [{ target: Para mí }, ", es fácil."]
          tr: { en: "For me, it's easy." }
        - level: A2
          point: por
          rule: { en: "cause: because of", es: "causa" }
          ex: ["Gracias ", { target: por }, " todo."]
          tr: { en: Thanks for everything. }
        - level: A2
          point: por
          rule: { en: "route: through, along, around", es: "recorrido o lugar aproximado" }
          ex: ["Paseo ", { target: por }, " el parque."]
          tr: { en: I walk through the park. }
        - level: A2
          point: por
          rule: { en: "means: by", es: "medio" }
          ex: ["Hablamos ", { target: por }, " teléfono."]
          tr: { en: We talk on the phone. }
        - level: A2
          point: por
          rule: { en: "exchange: in return for", es: "intercambio" }
          ex: ["Te cambio mi libro ", { target: por }, " tu revista."]
          tr: { en: "I'll swap my book for your magazine." }
        - level: A2
          point: por
          rule: { en: "a part of the day, and per", es: "parte del día y distribución" }
          ex: { examples: [["Trabajo ", { target: por }, " la mañana."], ["dos veces ", { target: por }, " semana"]] }
          tr: { en: { examples: [I work in the morning., twice a week] } }
        - level: B1
          point: por
          rule: { en: "the doer in the passive: by", es: "agente de la pasiva" }
          ex: ["La novela fue escrita ", { target: por }, " García Márquez."]
          tr: { en: The novel was written by García Márquez. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: para }, " looks ahead to a goal: what for, where to, who for, by when."]
              es: [{ term: para }, " mira hacia una meta: para qué, hacia dónde, para quién, para cuándo."]
          - type: rule
            level: A2
            text:
              en: [{ term: por }, " looks back to a cause, or along a way: why, through where, by what means, in exchange for what."]
              es: [{ term: por }, " mira hacia una causa o a lo largo de un camino: por qué, por dónde, por qué medio, a cambio de qué."]
          - type: note
            level: A2
            text:
              en: "English for can be either, so the meaning decides:"
              es: "Las dos pueden ir en la misma frase, con significados distintos:"
            ex: { examples: [["Trabajo ", { target: para }, " una empresa."], ["Trabajo ", { target: por }, " mi familia."]] }
            tr: { en: { examples: [I work for a company., I work for the sake of my family.] } }

  - title: { en: "Use: para", es: "Uso: para" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: "purpose, with an infinitive", es: "finalidad, con infinitivo" }, ex: ["Ahorro ", { target: para }, " viajar."], tr: { en: I save up to travel. } }
          - { level: A1, use: { en: "what a thing is for", es: "para qué sirve una cosa" }, ex: ["El lápiz es ", { target: para }, " escribir."], tr: { en: The pencil is for writing. } }
          - { level: A2, use: { en: destination, es: destino }, ex: ["El tren sale ", { target: para }, " Madrid."], tr: { en: The train leaves for Madrid. } }
          - { level: A2, use: { en: recipient, es: destinatario }, ex: ["Las flores son ", { target: para }, " mi madre."], tr: { en: The flowers are for my mother. } }
          - { level: A2, use: { en: deadline, es: plazo }, ex: ["Necesito el informe ", { target: para }, " el viernes."], tr: { en: I need the report by Friday. } }
          - { level: A2, use: { en: employer, es: "para quién se trabaja" }, ex: ["Trabajo ", { target: para }, " una empresa alemana."], tr: { en: I work for a German company. } }
          - { level: B1, use: { en: opinion, es: opinión }, ex: [{ target: Para mí }, ", el español es fácil."], tr: { en: "For me, Spanish is easy." } }
          - { level: B1, use: { en: "compared with what is expected", es: "comparación con lo esperable" }, ex: ["Habla muy bien ", { target: para }, " su edad."], tr: { en: She speaks very well for her age. } }

  - title: { en: "Use: por", es: "Uso: por" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: "cause, reason", es: "causa, motivo" }, ex: ["No salgo ", { target: por }, " la lluvia."], tr: { en: "I'm not going out because of the rain." } }
          - { level: A2, use: { en: [{ term: gracias por }, ", ", { term: perdón por }], es: [{ term: gracias por }, ", ", { term: perdón por }] }, ex: ["Gracias ", { target: por }, " la ayuda."], tr: { en: Thanks for the help. } }
          - { level: A2, use: { en: "through, along", es: "a través de, a lo largo de" }, ex: ["Paseamos ", { target: por }, " la playa."], tr: { en: We walk along the beach. } }
          - { level: A2, use: { en: somewhere around, es: lugar aproximado }, ex: ["¿Hay un banco ", { target: por }, " aquí?"], tr: { en: Is there a bank around here? } }
          - { level: A2, use: { en: a part of the day, es: una parte del día }, ex: ["Estudio ", { target: por }, " la tarde."], tr: { en: I study in the afternoon. } }
          - { level: A2, use: { en: means, es: medio }, ex: ["Te mando las fotos ", { target: por }, " correo."], tr: { en: "I'll send you the photos by email." } }
          - { level: A2, use: { en: "exchange, price", es: "intercambio, precio" }, ex: ["Te cambio mi libro ", { target: por }, " tu revista."], tr: { en: "I'll swap my book for your magazine." } }
          - { level: A2, use: { en: per, es: distribución }, ex: ["Voy al gimnasio dos veces ", { target: por }, " semana."], tr: { en: I go to the gym twice a week. } }
          - { level: A2, use: { en: "for the sake of, in place of", es: "en favor de, en lugar de" }, ex: ["Lo hago ", { target: por }, " ti."], tr: { en: "I'm doing it for you." } }
          - { level: B1, use: { en: the doer in the passive, es: agente de la pasiva }, ex: ["La novela fue escrita ", { target: por }, " García Márquez."], tr: { en: The novel was written by García Márquez. } }
      - type: list
        items:
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["To go and get something is ", { term: ir por }, ":"]
              es: ["Ir a buscar algo es ", { term: ir por }, ":"]
            ex: ["Voy ", { target: por }, " pan."]
            tr: { en: "I'm going to get bread." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["To go and get something is ", { term: ir a por }, ":"]
              es: ["Ir a buscar algo es ", { term: ir a por }, ":"]
            ex: ["Voy ", { target: a por }, " pan."]
            tr: { en: "I'm going to get bread." }

  - title: { en: "Compare: por or para", es: "Comparación: por o para" }
    role: compare
    content:
      - type: usage
        columns:
          - { key: sentence, label: { en: Sentence, es: Frase } }
          - { key: meaning, label: { en: Meaning, es: Significado } }
        rows:
          - { level: B1, sentence: ["Lo hago ", { target: por }, " ti."], meaning: { en: "I do it for your sake, or in your place", es: "tú eres el motivo, o lo hago en tu lugar" } }
          - { level: B1, sentence: ["Lo hago ", { target: para }, " ti."], meaning: { en: "I make it for you: you will get it", es: "tú vas a recibirlo" } }
          - { level: B1, sentence: ["Paso ", { target: por }, " Madrid."], meaning: { en: I go through Madrid, es: Madrid está en mi camino } }
          - { level: B1, sentence: ["Voy ", { target: para }, " Madrid."], meaning: { en: "I'm heading for Madrid", es: Madrid es mi destino } }
          - { level: B1, sentence: ["Trabaja ", { target: por }, " su familia."], meaning: { en: She works to support her family, es: su familia es el motivo } }
          - { level: B1, sentence: ["Trabaja ", { target: para }, " una empresa."], meaning: { en: A company employs her, es: una empresa la contrata } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Gracias para todo., right: ["Gracias ", { target: por }, " todo."], rule: { en: ["thanks take ", { term: por }], es: [{ term: gracias }, " lleva ", { term: por }] } }
          - { level: A1, wrong: Estudio por aprender., right: ["Estudio ", { target: para }, " aprender."], rule: { en: ["a purpose takes ", { term: para }], es: ["la finalidad lleva ", { term: para }] } }
          - { level: A2, wrong: Este regalo es por ti., right: ["Este regalo es ", { target: para }, " ti."], rule: { en: ["the person who receives it takes ", { term: para }], es: ["el destinatario lleva ", { term: para }] } }
          - { level: A2, wrong: Paseo para el parque., right: ["Paseo ", { target: por }, " el parque."], rule: { en: ["moving through a place takes ", { term: por }], es: ["el recorrido lleva ", { term: por }] } }
          - { level: A2, wrong: Hablamos para teléfono., right: ["Hablamos ", { target: por }, " teléfono."], rule: { en: ["a means takes ", { term: por }], es: ["el medio lleva ", { term: por }] } }
          - { level: A2, wrong: Voy al gimnasio tres veces para semana., right: ["Voy al gimnasio tres veces ", { target: por }, " semana."], rule: { en: ["per is ", { term: por }], es: ["la distribución lleva ", { term: por }] } }
          - { level: A2, speakers: [en], wrong: Espero para mi amiga., right: ["Espero ", { target: a }, " mi amiga."], rule: { en: ["wait for is ", { term: esperar }, ", with ", { term: a }, " before a person"] } }
          - { level: A2, speakers: [en], wrong: Busco para mis llaves., right: ["Busco ", { target: mis llaves }, "."], rule: { en: ["look for is ", { term: buscar }, ", with no preposition"] } }
