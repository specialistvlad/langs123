            text: { es: ["Sobre ", { term: lo }, ", ", { term: la }, ", ", { term: le }, " y la ", { term: a }, " personal: ver ", { link: "El objeto directo y la a personal", to: es.pronombres.objeto-directo }, "."], en: ["On ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " and the personal ", { term: "a" }, ": see ", { link: "Direct Object Pronouns and Personal a", to: es.pronombres.objeto-directo }, "."], uk: ["Про ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " та особове ", { term: "a" }, " див. ", { link: "Займенники прямого додатка й особове a", to: es.pronombres.objeto-directo }, "."], pt: ["Sobre ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " e o ", { term: "a" }, " pessoal: veja ", { link: "Pronomes de objeto direto e o a pessoal", to: es.pronombres.objeto-directo }, "."], fr: ["Sur ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " et le ", { term: "a" }, " personnel : voir ", { link: "Pronoms COD et a personnel", to: es.pronombres.objeto-directo }, "."], de: ["Zu ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " und dem persönlichen ", { term: "a" }, ": siehe ", { link: "Direkte Objektpronomen und das persönliche a", to: es.pronombres.objeto-directo }, "."], it: ["Su ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " e la ", { term: "a" }, " personale: vedi ", { link: "Pronomi complemento diretto e a personale", to: es.pronombres.objeto-directo }, "."], pl: ["O ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " i osobowym ", { term: "a" }, " zob. ", { link: "Zaimki dopełnienia bliższego i osobowe a", to: es.pronombres.objeto-directo }, "."], tr: [{ term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " ve kişisel ", { term: "a" }, " için bkz. ", { link: "Doğrudan nesne zamirleri ve kişisel a", to: es.pronombres.objeto-directo }, "."], id: ["Tentang ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, ", dan ", { term: "a" }, " personal: lihat ", { link: "Kata ganti objek langsung dan a personal", to: es.pronombres.objeto-directo }, "."], vi: ["Về ", { term: "lo" }, ", ", { term: "la" }, ", ", { term: "le" }, " và ", { term: "a" }, " chỉ người: xem ", { link: "Đại từ tân ngữ trực tiếp và a chỉ người", to: es.pronombres.objeto-directo }, "."] }

  - title: { es: Nombres y adjetivos con una cláusula, en: "Nouns and adjectives with a clause", uk: "Іменники й прикметники з підрядним реченням", pt: "Substantivos e adjetivos com uma oração", fr: "Noms et adjectifs avec une proposition", de: "Nomen und Adjektive mit einem Nebensatz", it: "Sostantivi e aggettivi con una proposizione", pl: "Rzeczowniki i przymiotniki ze zdaniem podrzędnym", tr: "Yan cümleli isimler ve sıfatlar", id: "Kata benda dan kata sifat dengan klausa", vi: "Danh từ và tính từ đi với mệnh đề" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { es: Estructura, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            form: { pattern: [{ slot: noun }, { term: de }, { slot: infinitive }] }
            rule: { es: "El nombre pide de ante un infinitivo del mismo sujeto.", en: ["The noun takes ", { term: "de" }, " before an infinitive with the same subject."], uk: ["Іменник вимагає ", { term: "de" }, " перед інфінітивом з тим самим підметом."], pt: ["O substantivo pede ", { term: "de" }, " antes de um infinitivo com o mesmo sujeito."], fr: ["Le nom demande ", { term: "de" }, " devant un infinitif de même sujet."], de: ["Das Nomen verlangt ", { term: "de" }, " vor einem Infinitiv mit demselben Subjekt."], it: ["Il sostantivo vuole ", { term: "de" }, " davanti a un infinito con lo stesso soggetto."], pl: ["Rzeczownik wymaga ", { term: "de" }, " przed bezokolicznikiem o tym samym podmiocie."], tr: ["İsim, aynı özneli bir mastarın önünde ", { term: "de" }, " ister."], id: ["Kata benda meminta ", { term: "de" }, " sebelum infinitif yang bersubjek sama."], vi: ["Danh từ đòi ", { term: "de" }, " trước động từ nguyên mẫu có cùng chủ ngữ."] }
            ex: ["Siento el deseo ", { target: "de volver" }, "."]
            tr: { en: "I feel the desire to return.", uk: "Я відчуваю бажання повернутися.", pt: "Sinto o desejo de voltar.", fr: "J’éprouve le désir de revenir.", de: "Ich spüre den Wunsch zurückzukehren.", it: "Sento il desiderio di tornare.", pl: "Czuję pragnienie powrotu.", tr: "Geri dönme isteği duyuyorum.", id: "Saya merasakan keinginan untuk kembali.", vi: "Tôi cảm thấy muốn quay lại." }
          - level: C1
            form: { pattern: [{ slot: noun }, { term: de }, { term: haber }, { slot: past participle }] }
            rule: { es: "El infinitivo compuesto presenta el hecho como cumplido.", en: "The compound infinitive presents the fact as completed.", uk: "Складений інфінітив подає подію як завершену.", pt: "O infinitivo composto apresenta o fato como cumprido.", fr: "L’infinitif composé présente le fait comme accompli.", de: "Der zusammengesetzte Infinitiv stellt das Geschehen als abgeschlossen dar.", it: "L'infinito composto presenta il fatto come compiuto.", pl: "Bezokolicznik złożony przedstawia fakt jako dokonany.", tr: "Bileşik mastar olguyu tamamlanmış gösterir.", id: "Infinitif majemuk menyajikan peristiwa sebagai sudah selesai.", vi: "Động từ nguyên mẫu hoàn thành trình bày sự việc như đã xảy ra xong." }
            ex: ["Me alegra la idea ", { target: "de habernos reunido" }, " otra vez."]
            tr: { en: "The idea of having got together again makes me happy.", uk: "Мене тішить думка, що ми знову зустрілися.", pt: "Me alegra a ideia de nos termos reunido outra vez.", fr: "L’idée de nous être retrouvés me réjouit.", de: "Der Gedanke, dass wir uns wieder getroffen haben, freut mich.", it: "Mi rallegra l'idea di esserci riuniti ancora.", pl: "Cieszy mnie myśl, że znów się spotkaliśmy.", tr: "Yeniden bir araya gelmiş olmamız fikri beni sevindiriyor.", id: "Saya senang dengan gagasan bahwa kita sudah berkumpul lagi.", vi: "Tôi vui khi nghĩ rằng chúng ta đã đoàn tụ lần nữa." }
          - level: C1
            form: { pattern: [{ slot: noun }, { term: a }, { slot: infinitive }] }
            rule: { es: ["Los nombres de miedo, como ", { term: temor }, ", admiten ", { term: a }, " ante el infinitivo."], en: ["Nouns of fear, such as ", { term: "temor" }, ", allow ", { term: "a" }, " before the infinitive."], uk: ["Іменники зі значенням страху, як-от ", { term: "temor" }, ", допускають ", { term: "a" }, " перед інфінітивом."], pt: ["Os substantivos de medo, como ", { term: "temor" }, ", admitem ", { term: "a" }, " antes do infinitivo."], fr: ["Les noms de peur, comme ", { term: "temor" }, ", admettent ", { term: "a" }, " devant l’infinitif."], de: ["Nomen der Furcht wie ", { term: "temor" }, " lassen ", { term: "a" }, " vor dem Infinitiv zu."], it: ["I sostantivi di paura, come ", { term: "temor" }, ", ammettono ", { term: "a" }, " davanti all'infinito."], pl: ["Rzeczowniki oznaczające lęk, takie jak ", { term: "temor" }, ", dopuszczają ", { term: "a" }, " przed bezokolicznikiem."], tr: [{ term: "temor" }, " gibi korku bildiren isimler, mastardan önce ", { term: "a" }, " alabilir."], id: ["Kata benda ketakutan, seperti ", { term: "temor" }, ", boleh memakai ", { term: "a" }, " sebelum infinitif."], vi: ["Các danh từ chỉ nỗi sợ, như ", { term: "temor" }, ", cho phép dùng ", { term: "a" }, " trước động từ nguyên mẫu."] }
            ex: ["Me paraliza el temor ", { target: "a perderte" }, "."]
            tr: { en: "The fear of losing you paralyses me.", uk: "Мене паралізує страх втратити тебе.", pt: "Me paralisa o medo de perder você.", fr: "La peur de te perdre me paralyse.", de: "Die Angst, dich zu verlieren, lähmt mich.", it: "Mi paralizza il timore di perderti.", pl: "Paraliżuje mnie lęk przed utratą ciebie.", tr: "Seni kaybetme korkusu beni felç ediyor.", id: "Ketakutan akan kehilanganmu melumpuhkan saya.", vi: "Nỗi sợ mất bạn làm tôi tê liệt." }
          - level: C1
            form: { pattern: [{ slot: noun }, { term: de que }, { slot: clause }] }
            rule: { es: "Con otro sujeto, la cláusula lleva de que y subjuntivo.", en: ["With a different subject, the clause takes ", { term: "de que" }, " and the subjunctive."], uk: ["З іншим підметом підрядне речення вимагає ", { term: "de que" }, " і суб’юнктива."], pt: ["Com outro sujeito, a oração leva ", { term: "de que" }, " e subjuntivo."], fr: ["Avec un autre sujet, la proposition prend ", { term: "de que" }, " et le subjonctif."], de: ["Bei einem anderen Subjekt steht der Nebensatz mit ", { term: "de que" }, " und dem Konjunktiv."], it: ["Con un altro soggetto, la proposizione vuole ", { term: "de que" }, " e il congiuntivo."], pl: ["Przy innym podmiocie zdanie podrzędne wymaga ", { term: "de que" }, " i trybu łączącego."], tr: ["Özne farklıysa yan cümle ", { term: "de que" }, " ve dilek kipiyle kurulur."], id: ["Dengan subjek lain, klausa memakai ", { term: "de que" }, " dan subjungtif."], vi: ["Khi chủ ngữ khác nhau, mệnh đề dùng ", { term: "de que" }, " và thức giả định."] }
            ex: ["Tengo el temor ", { target: "de que" }, " no llegue a tiempo."]
            tr: { en: "I fear that he won't arrive on time.", uk: "Я боюся, що він не встигне вчасно.", pt: "Tenho receio de que ele não chegue a tempo.", fr: "Je crains qu’il n’arrive pas à temps.", de: "Ich fürchte, dass er nicht rechtzeitig ankommt.", it: "Temo che non arrivi in tempo.", pl: "Obawiam się, że nie dotrze na czas.", tr: "Zamanında varamayacağından korkuyorum.", id: "Saya khawatir dia tidak tiba tepat waktu.", vi: "Tôi lo rằng anh ấy sẽ không đến kịp giờ." }
          - level: C1
            form: { pattern: [{ slot: adjective }, { term: de }, { slot: infinitive }] }
            rule: { es: ["Los adjetivos de deseo, como ", { term: deseoso }, ", piden ", { term: de }, " ante el infinitivo."], en: ["Adjectives of desire, such as ", { term: "deseoso" }, ", take ", { term: "de" }, " before the infinitive."], uk: ["Прикметники бажання, як-от ", { term: "deseoso" }, ", вимагають ", { term: "de" }, " перед інфінітивом."], pt: ["Os adjetivos de desejo, como ", { term: "deseoso" }, ", pedem ", { term: "de" }, " antes do infinitivo."], fr: ["Les adjectifs de désir, comme ", { term: "deseoso" }, ", demandent ", { term: "de" }, " devant l’infinitif."], de: ["Adjektive des Wunsches wie ", { term: "deseoso" }, " verlangen ", { term: "de" }, " vor dem Infinitiv."], it: ["Gli aggettivi di desiderio, come ", { term: "deseoso" }, ", vogliono ", { term: "de" }, " davanti all'infinito."], pl: ["Przymiotniki oznaczające pragnienie, takie jak ", { term: "deseoso" }, ", wymagają ", { term: "de" }, " przed bezokolicznikiem."], tr: [{ term: "deseoso" }, " gibi istek bildiren sıfatlar mastardan önce ", { term: "de" }, " ister."], id: ["Kata sifat keinginan, seperti ", { term: "deseoso" }, ", meminta ", { term: "de" }, " sebelum infinitif."], vi: ["Các tính từ chỉ ước muốn, như ", { term: "deseoso" }, ", đòi ", { term: "de" }, " trước động từ nguyên mẫu."] }
            ex: ["Estoy ", { target: "deseoso de" }, " verte."]
            tr: { en: "I'm eager to see you.", uk: "Я дуже хочу тебе побачити.", pt: "Estou ansioso para ver você.", fr: "J’ai hâte de te voir.", de: "Ich freue mich darauf, dich zu sehen.", it: "Non vedo l'ora di vederti.", pl: "Bardzo chcę cię zobaczyć.", tr: "Seni görmeyi çok istiyorum.", id: "Saya ingin sekali bertemu denganmu.", vi: "Tôi rất mong được gặp bạn." }
          - level: C1
            form: { pattern: [{ slot: adjective }, { term: a }, { slot: infinitive }] }
            rule: { es: [{ term: Decidido }, ", ", { term: dispuesto }, " y ", { term: acostumbrado }, " piden ", { term: a }, " ante el infinitivo."], en: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " and ", { term: "acostumbrado" }, " take ", { term: "a" }, " before the infinitive."], uk: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " та ", { term: "acostumbrado" }, " вимагають ", { term: "a" }, " перед інфінітивом."], pt: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " e ", { term: "acostumbrado" }, " pedem ", { term: "a" }, " antes do infinitivo."], fr: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " et ", { term: "acostumbrado" }, " demandent ", { term: "a" }, " devant l’infinitif."], de: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " und ", { term: "acostumbrado" }, " verlangen ", { term: "a" }, " vor dem Infinitiv."], it: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " e ", { term: "acostumbrado" }, " vogliono ", { term: "a" }, " davanti all'infinito."], pl: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " i ", { term: "acostumbrado" }, " wymagają ", { term: "a" }, " przed bezokolicznikiem."], tr: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " ve ", { term: "acostumbrado" }, " mastardan önce ", { term: "a" }, " ister."], id: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, ", dan ", { term: "acostumbrado" }, " meminta ", { term: "a" }, " sebelum infinitif."], vi: [{ term: "Decidido" }, ", ", { term: "dispuesto" }, " và ", { term: "acostumbrado" }, " đòi ", { term: "a" }, " trước động từ nguyên mẫu."] }
            ex: ["Está ", { target: "decidida a" }, " contarlo."]
            tr: { en: "She is determined to tell it.", uk: "Вона твердо вирішила це розповісти.", pt: "Ela está decidida a contar isso.", fr: "Elle est décidée à le raconter.", de: "Sie ist entschlossen, es zu erzählen.", it: "È decisa a raccontarlo.", pl: "Jest zdecydowana to opowiedzieć.", tr: "Bunu anlatmaya kararlı.", id: "Dia bertekad menceritakannya.", vi: "Cô ấy quyết tâm kể chuyện đó." }
          - level: C1
            form: { pattern: [{ slot: adjective }, { term: en }, { slot: { es: pregunta indirecta, en: "indirect question", uk: "непряме питання", pt: "pergunta indireta", fr: "interrogative indirecte", de: "indirekte Frage", it: "interrogativa indiretta", pl: "pytanie zależne", tr: "dolaylı soru", id: "pertanyaan tidak langsung", vi: "câu hỏi gián tiếp" } }] }
            rule: { es: "Ante una pregunta indirecta, el adjetivo conserva su preposición.", en: "Before an indirect question, the adjective keeps its preposition.", uk: "Перед непрямим питанням прикметник зберігає свій прийменник.", pt: "Diante de uma pergunta indireta, o adjetivo mantém a sua preposição.", fr: "Devant une interrogative indirecte, l’adjectif garde sa préposition.", de: "Vor einer indirekten Frage behält das Adjektiv seine Präposition.", it: "Davanti a un'interrogativa indiretta, l'aggettivo mantiene la sua preposizione.", pl: "Przed pytaniem zależnym przymiotnik zachowuje swój przyimek.", tr: "Dolaylı bir sorunun önünde sıfat edatını korur.", id: "Sebelum pertanyaan tidak langsung, kata sifat mempertahankan kata depannya.", vi: "Trước câu hỏi gián tiếp, tính từ giữ nguyên giới từ của nó." }
            ex: ["Estoy interesado ", { target: "en cómo" }, " es tu trabajo."]
            tr: { en: "I'm interested in what your job is like.", uk: "Мені цікаво, яка в тебе робота.", pt: "Estou interessado em saber como é o seu trabalho.", fr: "Ça m’intéresse de savoir comment est ton travail.", de: "Mich interessiert, wie deine Arbeit ist.", it: "Mi interessa sapere com'è il tuo lavoro.", pl: "Interesuje mnie, jaka jest twoja praca.", tr: "İşinin nasıl olduğuyla ilgileniyorum.", id: "Saya tertarik pada seperti apa pekerjaanmu.", vi: "Tôi quan tâm đến việc công việc của bạn như thế nào." }

  - title: { es: La preposición delante de que, en: "The preposition before que", uk: "Прийменник перед que", pt: "A preposição antes de que", fr: "La préposition devant que", de: "Die Präposition vor que", it: "La preposizione davanti a que", pl: "Przyimek przed que", tr: "que sözcüğünün önündeki edat", id: "Kata depan sebelum que", vi: "Giới từ trước que" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: with, label: { es: Con preposición, en: "With a preposition", uk: "З прийменником", pt: "Com preposição", fr: "Avec préposition", de: "Mit Präposition", it: "Con preposizione", pl: "Z przyimkiem", tr: "Edatlı", id: "Dengan kata depan", vi: "Có giới từ" } }
          - { key: without, label: { es: Sin preposición, en: "Without a preposition", uk: "Без прийменника", pt: "Sem preposição", fr: "Sans préposition", de: "Ohne Präposition", it: "Senza preposizione", pl: "Bez przyimka", tr: "Edatsız", id: "Tanpa kata depan", vi: "Không có giới từ" } }
        rows:
          - level: C1
            with: { ex: ["Me alegro ", { target: "de que" }, " hayas ido."], tr: { en: "I'm glad you went.", uk: "Я радий, що ти пішов.", pt: "Fico feliz que você tenha ido.", fr: "Je suis content que tu y sois allé.", de: "Ich freue mich, dass du gegangen bist.", it: "Sono contento che tu sia andato.", pl: "Cieszę się, że poszedłeś.", tr: "Gittiğine sevindim.", id: "Saya senang kamu sudah pergi.", vi: "Tôi mừng vì bạn đã đi." } }
            without: { ex: ["Celebro ", { target: que }, " hayas ido."], tr: { en: "I'm delighted you went.", uk: "Мене тішить, що ти пішов.", pt: "Fico contente que você tenha ido.", fr: "Je me réjouis que tu y sois allé.", de: "Ich begrüße es, dass du gegangen bist.", it: "Sono lieto che tu sia andato.", pl: "Dobrze, że poszedłeś.", tr: "Gitmiş olmana çok memnun oldum.", id: "Saya gembira kamu sudah pergi.", vi: "Tôi hoan nghênh việc bạn đã đi." } }
          - level: C1
            with: { ex: ["Me acuerdo ", { target: "de que" }, " cerraban a las diez."], tr: { en: "I remember that they used to close at ten.", uk: "Я пам’ятаю, що вони зачинялися о десятій.", pt: "Eu me lembro de que fechavam às dez.", fr: "Je me rappelle qu’ils fermaient à dix heures.", de: "Ich erinnere mich daran, dass sie um zehn schlossen.", it: "Mi ricordo che chiudevano alle dieci.", pl: "Przypominam sobie, że zamykali o dziesiątej.", tr: "Saat onda kapattıklarını hatırlıyorum.", id: "Saya ingat bahwa mereka tutup pukul sepuluh.", vi: "Tôi nhớ là họ đóng cửa lúc mười giờ." } }
            without: { ex: ["Recuerdo ", { target: que }, " cerraban a las diez."], tr: { en: "I recall that they used to close at ten.", uk: "Пригадую, що вони зачинялися о десятій.", pt: "Lembro que fechavam às dez.", fr: "Je me souviens qu’ils fermaient à dix heures.", de: "Ich weiß noch, dass sie um zehn schlossen.", it: "Ricordo che chiudevano alle dieci.", pl: "Pamiętam, że zamykali o dziesiątej.", tr: "Saat onda kapandıklarını anımsıyorum.", id: "Saya ingat mereka tutup pukul sepuluh.", vi: "Tôi nhớ họ đóng cửa lúc mười giờ." } }
          - level: C1
            with: { ex: ["Me di cuenta ", { target: "de que" }, " faltaba un libro."], tr: { en: "I realised that a book was missing.", uk: "Я зрозумів, що бракує однієї книжки.", pt: "Percebi que faltava um livro.", fr: "Je me suis rendu compte qu’il manquait un livre.", de: "Ich habe gemerkt, dass ein Buch fehlte.", it: "Mi sono accorto che mancava un libro.", pl: "Zdałem sobie sprawę, że brakuje jednej książki.", tr: "Bir kitabın eksik olduğunu fark ettim.", id: "Saya menyadari bahwa ada satu buku yang hilang.", vi: "Tôi nhận ra là thiếu một cuốn sách." } }
