title: { es: "Verbos, adjetivos y nombres con preposición: contar con, capaz de", en: "Verbs, Adjectives and Nouns with Fixed Prepositions", uk: "Дієслова, прикметники та іменники з прийменником: contar con, capaz de", pt: "Verbos, adjetivos e substantivos com preposição: contar con, capaz de", fr: "Verbes, adjectifs et noms avec préposition : contar con, capaz de", de: "Verben, Adjektive und Nomen mit Präposition: contar con, capaz de", it: "Verbi, aggettivi e sostantivi con preposizione: contar con, capaz de", pl: "Czasowniki, przymiotniki i rzeczowniki z przyimkiem: contar con, capaz de", tr: "Edatla kullanılan fiiller, sıfatlar ve isimler: contar con, capaz de", id: "Kata kerja, kata sifat, dan kata benda dengan kata depan: contar con, capaz de", vi: "Động từ, tính từ và danh từ đi với giới từ: contar con, capaz de" }
summary:
  lead:
    es: ["Verbos, adjetivos y nombres piden una preposición fija ante su complemento: ", { term: contar con }, ", ", { term: capaz de }, ", ", { term: la idea de }, "."]
    en: ["Verbs, adjectives and nouns call for a fixed preposition before their complement: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    uk: ["Дієслова, прикметники та іменники вимагають сталого прийменника перед своїм доповненням: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    pt: ["Verbos, adjetivos e substantivos pedem uma preposição fixa antes do seu complemento: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    fr: ["Verbes, adjectifs et noms demandent une préposition fixe devant leur complément : ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    de: ["Verben, Adjektive und Nomen verlangen vor ihrer Ergänzung eine feste Präposition: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    it: ["Verbi, aggettivi e sostantivi vogliono una preposizione fissa davanti al loro complemento: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    pl: ["Czasowniki, przymiotniki i rzeczowniki wymagają stałego przyimka przed swoim dopełnieniem: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    tr: ["Fiiller, sıfatlar ve isimler tümlecinin önünde sabit bir edat ister: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    id: ["Kata kerja, kata sifat, dan kata benda meminta kata depan tetap sebelum pelengkapnya: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
    vi: ["Động từ, tính từ và danh từ đòi giới từ cố định trước bổ ngữ: ", { term: "contar con" }, ", ", { term: "capaz de" }, ", ", { term: "la idea de" }, "."]
  rule:
    es: ["La preposición del verbo se mantiene ante ", { term: que }, ", y no se añade si el verbo no la pide:"]
    en: ["The verb's preposition stays before ", { term: "que" }, ", and none is added if the verb takes none:"]
    uk: ["Прийменник дієслова зберігається перед ", { term: "que" }, ", а якщо дієслово прийменника не вимагає, його не додають:"]
    pt: ["A preposição do verbo se mantém diante de ", { term: "que" }, ", e não se acrescenta nenhuma se o verbo não a pede:"]
    fr: ["La préposition du verbe reste devant ", { term: "que" }, ", et on n’en ajoute pas si le verbe n’en demande pas :"]
    de: ["Die Präposition des Verbs bleibt vor ", { term: "que" }, " erhalten, und es wird keine ergänzt, wenn das Verb keine verlangt:"]
    it: ["La preposizione del verbo resta davanti a ", { term: "que" }, ", e non se ne aggiunge se il verbo non la vuole:"]
    pl: ["Przyimek czasownika zostaje przed ", { term: "que" }, ", a jeśli czasownik go nie wymaga, nie dodaje się żadnego:"]
    tr: ["Fiilin edatı ", { term: "que" }, " öncesinde korunur; fiil edat istemiyorsa eklenmez:"]
    id: ["Kata depan kata kerja tetap ada sebelum ", { term: "que" }, ", dan tidak ditambahkan jika kata kerja tidak memintanya:"]
    vi: ["Giới từ của động từ giữ nguyên trước ", { term: "que" }, "; động từ không đòi thì không thêm:"]
  ex: { examples: [["Me alegro ", { target: "de que" }, " vengas."], ["Creo ", { target: que }, " vienes."]] }

cheatsheet:
