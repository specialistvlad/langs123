          tr: { en: { alternatives: ["Luisa is slow-witted.", "Luisa is slow of understanding."] }, uk: { alternatives: ["Луїза недалека розумом.", "Луїза має обмежений розум."] }, pt: { alternatives: ["Luisa é de pouca compreensão.", "Luisa tem um entendimento limitado."] }, fr: { alternatives: ["Luisa est lente à comprendre.", "Luisa a l’esprit court."] }, de: { alternatives: ["Luisa ist begriffsstutzig.", "Luisa hat einen beschränkten Verstand."] }, it: { alternatives: ["Luisa è corta di comprendonio.", "Luisa ha un comprendonio corto."] }, pl: { alternatives: ["Luisa jest niezbyt pojętna.", "Luisa ma ograniczony rozum."] }, tr: { alternatives: ["Luisa kıt anlayışlı.", "Luisa’nın anlayışı kıt."] }, id: { alternatives: ["Luisa lambat memahami.", "Luisa berpemahaman terbatas."] }, vi: { alternatives: ["Luisa hơi chậm hiểu.", "Luisa là người có trí hiểu hạn chế."] } }
        - level: C2
          point: { es: Complemento de cosa, en: "Thing as object", uk: "Додаток-річ", pt: "Complemento de coisa", fr: "Complément de chose", de: "Sache als Objekt", it: "Complemento di cosa", pl: "Dopełnienie rzeczowe", tr: "Nesne olarak şey", id: "Objek berupa benda", vi: "Tân ngữ là vật" }
          rule: { es: [{ term: contestar a }, " admite ", { term: la }, "; ", { term: referirse a }, ", no"], en: [{ term: "contestar a" }, " allows ", { term: "la" }, "; ", { term: "referirse a" }, " does not"], uk: [{ term: "contestar a" }, " допускає ", { term: "la" }, ", а ", { term: "referirse a" }, " — ні"], pt: [{ term: "contestar a" }, " admite ", { term: "la" }, "; ", { term: "referirse a" }, ", não"], fr: [{ term: "contestar a" }, " admet ", { term: "la" }, " ; ", { term: "referirse a" }, ", non"], de: [{ term: "contestar a" }, " lässt ", { term: "la" }, " zu, ", { term: "referirse a" }, " nicht"], it: [{ term: "contestar a" }, " ammette ", { term: "la" }, "; ", { term: "referirse a" }, ", no"], pl: [{ term: "contestar a" }, " dopuszcza ", { term: "la" }, ", ", { term: "referirse a" }, " nie"], tr: [{ term: "contestar a" }, " ile ", { term: "la" }, " kullanılabilir; ", { term: "referirse a" }, " ile kullanılamaz"], id: [{ term: "contestar a" }, " menerima ", { term: "la" }, "; ", { term: "referirse a" }, " tidak"], vi: [{ term: "contestar a" }, " cho phép dùng ", { term: "la" }, "; ", { term: "referirse a" }, " thì không"] }
          ex: { examples: [[{ target: La }, " contestó."], ["Se refirió ", { target: "a ella" }, "."]] }
          tr: { en: { examples: ["He answered it.", "He referred to it."] }, uk: { examples: ["Він відповів на це.", "Він послався на це."] }, pt: { examples: ["Ele a respondeu.", "Ele se referiu a ela."] }, fr: { examples: ["Il y a répondu.", "Il y a fait référence."] }, de: { examples: ["Er hat darauf geantwortet.", "Er hat sich darauf bezogen."] }, it: { examples: ["Vi ha risposto.", "Vi ha fatto riferimento."] }, pl: { examples: ["Odpowiedział na to.", "Odniósł się do tego."] }, tr: { examples: ["Ona cevap verdi.", "Ona atıfta bulundu."] }, id: { examples: ["Dia menjawabnya.", "Dia merujuk ke hal itu."] }, vi: { examples: ["Anh ấy đã trả lời điều đó.", "Anh ấy đã nhắc đến điều đó."] } }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["ante ", { term: que }, ", el verbo conserva su preposición"], en: ["before ", { term: "que" }, ", the verb keeps its preposition"], uk: ["перед ", { term: "que" }, " дієслово зберігає свій прийменник"], pt: ["diante de ", { term: "que" }, ", o verbo mantém a sua preposição"], fr: ["devant ", { term: "que" }, ", le verbe garde sa préposition"], de: ["vor ", { term: "que" }, " behält das Verb seine Präposition"], it: ["davanti a ", { term: "que" }, ", il verbo mantiene la sua preposizione"], pl: ["przed ", { term: "que" }, " czasownik zachowuje swój przyimek"], tr: [{ term: "que" }, " öncesinde fiil edatını korur"], id: ["sebelum ", { term: "que" }, ", kata kerja mempertahankan kata depannya"], vi: ["trước ", { term: "que" }, ", động từ giữ nguyên giới từ của nó"] }
          ex: ["Me alegro ", { target: "de que" }, " hayas ido."]
          tr: { en: "I'm glad you went.", uk: "Я радий, що ти пішов.", pt: "Fico feliz que você tenha ido.", fr: "Je suis content que tu y sois allé.", de: "Ich freue mich, dass du gegangen bist.", it: "Sono contento che tu sia andato.", pl: "Cieszę się, że poszedłeś.", tr: "Gittiğine sevindim.", id: "Saya senang kamu sudah pergi.", vi: "Tôi mừng vì bạn đã đi." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["si el verbo no pide preposición, no se añade ante ", { term: que }], en: ["if the verb takes no preposition, none is added before ", { term: "que" }], uk: ["якщо дієслово не вимагає прийменника, перед ", { term: "que" }, " його не додають"], pt: ["se o verbo não pede preposição, não se acrescenta nenhuma antes de ", { term: "que" }], fr: ["si le verbe ne demande pas de préposition, on n’en ajoute pas devant ", { term: "que" }], de: ["verlangt das Verb keine Präposition, wird vor ", { term: "que" }, " keine ergänzt"], it: ["se il verbo non vuole preposizione, non se ne aggiunge davanti a ", { term: "que" }], pl: ["jeśli czasownik nie wymaga przyimka, nie dodaje się go przed ", { term: "que" }], tr: ["fiil edat istemiyorsa ", { term: "que" }, " öncesine edat eklenmez"], id: ["jika kata kerja tidak meminta kata depan, tidak ada yang ditambahkan sebelum ", { term: "que" }], vi: ["nếu động từ không đòi giới từ thì không thêm giới từ trước ", { term: "que" }] }
          ex: ["Pienso ", { target: que }, " tienes razón."]
          tr: { en: "I think you're right.", uk: "Я думаю, що ти маєш рацію.", pt: "Acho que você tem razão.", fr: "Je pense que tu as raison.", de: "Ich denke, dass du recht hast.", it: "Penso che tu abbia ragione.", pl: "Myślę, że masz rację.", tr: "Bence haklısın.", id: "Saya pikir kamu benar.", vi: "Tôi nghĩ bạn đúng." }

sections:
  - title: { es: Verbos con preposición ante infinitivo o que, en: "Verbs with a preposition before an infinitive or que", uk: "Дієслова з прийменником перед інфінітивом або que", pt: "Verbos com preposição antes de infinitivo ou de que", fr: "Verbes avec préposition devant un infinitif ou que", de: "Verben mit Präposition vor Infinitiv oder que", it: "Verbi con preposizione davanti a infinito o que", pl: "Czasowniki z przyimkiem przed bezokolicznikiem lub que", tr: "Mastarın ya da que sözcüğünün önünde edat alan fiiller", id: "Kata kerja dengan kata depan sebelum infinitif atau que", vi: "Động từ có giới từ trước động từ nguyên mẫu hoặc que" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { es: Verbo, en: "Verb", uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: prep, label: { es: Preposición, en: "Preposition", uk: "Прийменник", pt: "Preposição", fr: "Préposition", de: "Präposition", it: "Preposizione", pl: "Przyimek", tr: "Edat", id: "Kata depan", vi: "Giới từ" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            verb: { term: decidirse }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["Al final me decidí ", { target: a }, " ir."]
            tr: { en: "In the end I decided to go.", uk: "Зрештою я наважився піти.", pt: "No fim, decidi ir.", fr: "Finalement, je me suis décidé à y aller.", de: "Am Ende habe ich mich entschieden hinzugehen.", it: "Alla fine mi sono deciso ad andare.", pl: "W końcu zdecydowałem się pójść.", tr: "Sonunda gitmeye karar verdim.", id: "Akhirnya saya memutuskan untuk pergi.", vi: "Cuối cùng tôi quyết định đi." }
          - level: B2
            verb: { term: negarse }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["Se negó ", { target: a }, " responder."]
            tr: { en: "He refused to answer.", uk: "Він відмовився відповідати.", pt: "Ele se recusou a responder.", fr: "Il a refusé de répondre.", de: "Er weigerte sich zu antworten.", it: "Si è rifiutato di rispondere.", pl: "Odmówił odpowiedzi.", tr: "Cevap vermeyi reddetti.", id: "Dia menolak menjawab.", vi: "Anh ấy từ chối trả lời." }
          - level: B2
            verb: { term: atreverse }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["No me atrevo ", { target: a }, " decir la verdad."]
            tr: { en: "I don't dare tell the truth.", uk: "Я не наважуюся сказати правду.", pt: "Não me atrevo a dizer a verdade.", fr: "Je n’ose pas dire la vérité.", de: "Ich traue mich nicht, die Wahrheit zu sagen.", it: "Non oso dire la verità.", pl: "Nie odważam się powiedzieć prawdy.", tr: "Gerçeği söylemeye cesaret edemiyorum.", id: "Saya tidak berani mengatakan yang sebenarnya.", vi: "Tôi không dám nói sự thật." }
          - level: B2
            verb: { term: animar }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["Mis amigos me animaron ", { target: a }, " viajar."]
            tr: { en: "My friends encouraged me to travel.", uk: "Мої друзі заохотили мене подорожувати.", pt: "Meus amigos me animaram a viajar.", fr: "Mes amis m’ont encouragé à voyager.", de: "Meine Freunde haben mich ermutigt zu reisen.", it: "I miei amici mi hanno incoraggiato a viaggiare.", pl: "Moi przyjaciele zachęcili mnie do podróży.", tr: "Arkadaşlarım beni seyahat etmeye teşvik etti.", id: "Teman-teman saya mendorong saya untuk bepergian.", vi: "Bạn bè khuyến khích tôi đi du lịch." }
          - level: B2
            verb: { term: ayudar }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["Mi tío me ayudó ", { target: a }, " mudarme."]
            tr: { en: "My uncle helped me move house.", uk: "Мій дядько допоміг мені переїхати.", pt: "Meu tio me ajudou a me mudar.", fr: "Mon oncle m’a aidé à déménager.", de: "Mein Onkel hat mir beim Umziehen geholfen.", it: "Mio zio mi ha aiutato a traslocare.", pl: "Mój wujek pomógł mi się przeprowadzić.", tr: "Amcam taşınmama yardım etti.", id: "Paman saya membantu saya pindah rumah.", vi: "Chú tôi giúp tôi chuyển nhà." }
          - level: B2
            verb: { term: aprender }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["Aprendí ", { target: a }, " nadar de niño."]
            tr: { en: "I learnt to swim as a child.", uk: "Я навчився плавати в дитинстві.", pt: "Aprendi a nadar quando criança.", fr: "J’ai appris à nager quand j’étais enfant.", de: "Ich habe als Kind schwimmen gelernt.", it: "Ho imparato a nuotare da bambino.", pl: "Nauczyłem się pływać jako dziecko.", tr: "Yüzmeyi çocukken öğrendim.", id: "Saya belajar berenang waktu kecil.", vi: "Tôi học bơi từ hồi nhỏ." }
          - level: B2
            verb: { term: empezar }
            prep: { pattern: [{ term: a }, { slot: infinitive }] }
            ex: ["De repente empezó ", { target: a }, " llover."]
            tr: { en: "Suddenly it began to rain.", uk: "Раптом почався дощ.", pt: "De repente começou a chover.", fr: "Soudain, il s’est mis à pleuvoir.", de: "Plötzlich fing es an zu regnen.", it: "All'improvviso ha cominciato a piovere.", pl: "Nagle zaczęło padać.", tr: "Birden yağmur yağmaya başladı.", id: "Tiba-tiba hujan mulai turun.", vi: "Đột nhiên trời bắt đầu mưa." }
          - level: B2
            verb: { term: contar }
            prep: { pattern: [{ term: con que }, { slot: clause }] }
            ex: ["Cuento ", { target: "con que" }, " vengas."]
            tr: { en: "I'm counting on you to come.", uk: "Я розраховую на твій прихід.", pt: "Conto que você venha.", fr: "Je compte sur toi pour venir.", de: "Ich zähle darauf, dass du kommst.", it: "Conto che tu venga.", pl: "Liczę na to, że przyjdziesz.", tr: "Gelmene güveniyorum.", id: "Saya mengandalkan kamu untuk datang.", vi: "Tôi trông cậy vào việc bạn đến." }
          - level: B2
            verb: { term: depender }
            prep: { pattern: [{ term: de que }, { slot: clause }] }
            ex: ["La excursión depende ", { target: "de que" }, " no llueva."]
            tr: { en: "The trip depends on it not raining.", uk: "Екскурсія залежить від того, чи не буде дощу.", pt: "O passeio depende de que não chova.", fr: "L’excursion dépend du fait qu’il ne pleuve pas.", de: "Der Ausflug hängt davon ab, dass es nicht regnet.", it: "La gita dipende dal fatto che non piova.", pl: "Wycieczka zależy od tego, czy nie będzie padać.", tr: "Gezi yağmur yağmamasına bağlı.", id: "Tamasya itu bergantung pada hujan tidak turun.", vi: "Chuyến dã ngoại phụ thuộc vào việc trời không mưa." }
          - level: B2
            verb: { term: insistir }
            prep: { pattern: [{ term: en que }, { slot: clause }] }
            ex: ["Insiste ", { target: "en que" }, " nos quedemos."]
            tr: { en: "He insists that we stay.", uk: "Він наполягає, щоб ми залишилися.", pt: "Ele insiste em que a gente fique.", fr: "Il insiste pour que nous restions.", de: "Er besteht darauf, dass wir bleiben.", it: "Insiste perché ci fermiamo.", pl: "Nalega, żebyśmy zostali.", tr: "Kalmamız konusunda ısrar ediyor.", id: "Dia berkeras agar kita tinggal.", vi: "Anh ấy khăng khăng muốn chúng tôi ở lại." }
          - level: B2
            verb: { term: confiar }
            prep: { pattern: [{ term: en que }, { slot: clause }] }
            ex: ["Confío ", { target: "en que" }, " todo salga bien."]
            tr: { en: "I trust that everything goes well.", uk: "Я вірю, що все буде добре.", pt: "Confio que tudo saia bem.", fr: "J’ai bon espoir que tout se passe bien.", de: "Ich vertraue darauf, dass alles gut geht.", it: "Confido che vada tutto bene.", pl: "Ufam, że wszystko pójdzie dobrze.", tr: "Her şeyin yolunda gideceğine güveniyorum.", id: "Saya percaya semuanya akan berjalan baik.", vi: "Tôi tin rằng mọi việc sẽ suôn sẻ." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: [{ term: Depender de que }, " lleva subjuntivo: la cláusula expresa una condición."], en: [{ term: "Depender de que" }, " takes the subjunctive: the clause expresses a condition."], uk: [{ term: "Depender de que" }, " вимагає суб’юнктива: підрядне речення виражає умову."], pt: [{ term: "Depender de que" }, " leva subjuntivo: a oração expressa uma condição."], fr: [{ term: "Depender de que" }, " prend le subjonctif : la proposition exprime une condition."], de: [{ term: "Depender de que" }, " steht mit dem Konjunktiv: Der Nebensatz nennt eine Bedingung."], it: [{ term: "Depender de que" }, " vuole il congiuntivo: la proposizione esprime una condizione."], pl: [{ term: "Depender de que" }, " wymaga trybu łączącego: zdanie podrzędne wyraża warunek."], tr: [{ term: "Depender de que" }, " dilek kipiyle kullanılır: yan cümle bir koşul bildirir."], id: [{ term: "Depender de que" }, " memakai subjungtif: klausa menyatakan syarat."], vi: [{ term: "Depender de que" }, " đi với thức giả định: mệnh đề diễn đạt một điều kiện."] }
            ex: ["Todo depende de que ", { target: haya }, " plazas."]
            tr: { en: "Everything depends on there being places.", uk: "Усе залежить від того, чи будуть місця.", pt: "Tudo depende de haver vagas.", fr: "Tout dépend de la présence de places libres.", de: "Alles hängt davon ab, dass es Plätze gibt.", it: "Tutto dipende dal fatto che ci siano posti.", pl: "Wszystko zależy od tego, czy będą miejsca.", tr: "Her şey yer olmasına bağlı.", id: "Semuanya bergantung pada apakah ada tempat.", vi: "Mọi thứ phụ thuộc vào việc có chỗ hay không." }
          - type: rule
            level: B2
            text: { es: [{ term: Insistir en que }, " lleva subjuntivo si pide algo, e indicativo si afirma algo."], en: [{ term: "Insistir en que" }, " takes the subjunctive if it asks for something, and the indicative if it states something."], uk: [{ term: "Insistir en que" }, " вимагає суб’юнктива, коли чогось просять, і дійсного способу, коли щось стверджують."], pt: [{ term: "Insistir en que" }, " leva subjuntivo se pede algo, e indicativo se afirma algo."], fr: [{ term: "Insistir en que" }, " prend le subjonctif s’il demande quelque chose, et l’indicatif s’il affirme quelque chose."], de: [{ term: "Insistir en que" }, " steht mit dem Konjunktiv, wenn es etwas verlangt, und mit dem Indikativ, wenn es etwas behauptet."], it: [{ term: "Insistir en que" }, " vuole il congiuntivo se chiede qualcosa, e l'indicativo se afferma qualcosa."], pl: [{ term: "Insistir en que" }, " wymaga trybu łączącego, gdy o coś prosi, a oznajmującego, gdy coś twierdzi."], tr: [{ term: "Insistir en que" }, " bir şey istendiğinde dilek kipiyle, bir şey bildirildiğinde haber kipiyle kullanılır."], id: [{ term: "Insistir en que" }, " memakai subjungtif jika meminta sesuatu, dan indikatif jika menyatakan sesuatu."], vi: [{ term: "Insistir en que" }, " đi với thức giả định nếu đòi hỏi điều gì, và thức chỉ định nếu khẳng định điều gì."] }
            ex: { examples: [["Insiste en que ", { target: vengamos }, "."], ["Insiste en que ", { target: tiene }, " razón."]] }
            tr: { en: { examples: ["He insists that we come.", "He insists that he is right."] }, uk: { examples: ["Він наполягає, щоб ми прийшли.", "Він наполягає, що має рацію."] }, pt: { examples: ["Ele insiste em que a gente venha.", "Ele insiste que tem razão."] }, fr: { examples: ["Il insiste pour que nous venions.", "Il soutient qu’il a raison."] }, de: { examples: ["Er besteht darauf, dass wir kommen.", "Er beharrt darauf, dass er recht hat."] }, it: { examples: ["Insiste perché veniamo.", "Insiste di avere ragione."] }, pl: { examples: ["Nalega, żebyśmy przyszli.", "Upiera się, że ma rację."] }, tr: { examples: ["Gelmemiz konusunda ısrar ediyor.", "Haklı olduğunda ısrar ediyor."] }, id: { examples: ["Dia berkeras agar kita datang.", "Dia berkeras bahwa dirinya benar."] }, vi: { examples: ["Anh ấy khăng khăng muốn chúng tôi đến.", "Anh ấy khăng khăng rằng mình đúng."] } }
          - type: rule
            level: B2
            text: { es: [{ term: Contar con que }, " y ", { term: confiar en que }, " llevan indicativo si prevén un hecho, y subjuntivo si expresan un deseo."], en: [{ term: "Contar con que" }, " and ", { term: "confiar en que" }, " take the indicative for an expected fact, the subjunctive for a wish."], uk: [{ term: "Contar con que" }, " і ", { term: "confiar en que" }, " вимагають дійсного способу для очікуваного факту, суб’юнктива — для бажання."], pt: [{ term: "Contar con que" }, " e ", { term: "confiar en que" }, " levam indicativo se preveem um fato, e subjuntivo se expressam um desejo."], fr: [{ term: "Contar con que" }, " et ", { term: "confiar en que" }, " prennent l’indicatif pour un fait attendu, le subjonctif pour un souhait."], de: [{ term: "Contar con que" }, " und ", { term: "confiar en que" }, " stehen mit dem Indikativ bei erwarteten Tatsachen, mit dem Konjunktiv bei Wünschen."], it: [{ term: "Contar con que" }, " e ", { term: "confiar en que" }, " vogliono l'indicativo per un fatto previsto, il congiuntivo per un desiderio."], pl: [{ term: "Contar con que" }, " i ", { term: "confiar en que" }, " wymagają trybu oznajmującego dla przewidywanego faktu, łączącego dla życzenia."], tr: [{ term: "Contar con que" }, " ve ", { term: "confiar en que" }, ", beklenen bir olguda haber kipiyle, bir istekte dilek kipiyle kullanılır."], id: [{ term: "Contar con que" }, " dan ", { term: "confiar en que" }, " memakai indikatif untuk fakta yang diperkirakan, subjungtif untuk harapan."], vi: [{ term: "Contar con que" }, " và ", { term: "confiar en que" }, " đi với thức chỉ định khi dự đoán, thức giả định khi mong muốn."] }
            ex: { examples: [["Cuento con que ", { target: vendrás }, "."], ["Cuento con que ", { target: vengas }, "."]] }
