            text: { es: "Ante un pronombre, la preposición se mantiene y el pronombre toma su forma tónica:", en: "Before a pronoun, the preposition stays and the pronoun takes its stressed form:", uk: "Перед займенником прийменник зберігається, а займенник набуває наголошеної форми:", pt: "Diante de um pronome, a preposição se mantém e o pronome toma a sua forma tônica:", fr: "Devant un pronom, la préposition reste et le pronom prend sa forme tonique :", de: "Vor einem Pronomen bleibt die Präposition, und das Pronomen nimmt seine betonte Form an:", it: "Davanti a un pronome, la preposizione resta e il pronome prende la sua forma tonica:", pl: "Przed zaimkiem przyimek zostaje, a zaimek przyjmuje formę akcentowaną:", tr: "Bir zamirin önünde edat korunur ve zamir vurgulu biçimini alır:", id: "Di depan kata ganti, kata depan tetap ada dan kata ganti memakai bentuk bertekanan:", vi: "Trước đại từ, giới từ được giữ lại và đại từ dùng dạng nhấn:" }
