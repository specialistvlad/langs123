          rule: { es: "la preposición forma parte del verbo", en: "the preposition is part of the verb", uk: "прийменник є частиною дієслова", pt: "a preposição faz parte do verbo", fr: "la préposition fait partie du verbe", de: "die Präposition gehört zum Verb", it: "la preposizione fa parte del verbo", pl: "przyimek jest częścią czasownika", tr: "edat fiilin bir parçasıdır", id: "kata depan menjadi bagian dari kata kerja", vi: "giới từ là một phần của động từ" }
