          rule: { es: "la preposición cambia el significado del verbo", en: "the preposition changes the meaning of the verb", uk: "прийменник змінює значення дієслова", pt: "a preposição muda o significado do verbo", fr: "la préposition change le sens du verbe", de: "die Präposition ändert die Bedeutung des Verbs", it: "la preposizione cambia il significato del verbo", pl: "przyimek zmienia znaczenie czasownika", tr: "edat, fiilin anlamını değiştirir", id: "kata depan mengubah arti kata kerja", vi: "giới từ làm đổi nghĩa của động từ" }
          ex: { examples: ["Cuento un chiste.", ["Cuento ", { target: con }, " mi hermano."]] }
          tr: { en: { examples: ["I tell a joke.", "I count on my brother."] }, uk: { examples: ["Я розповідаю анекдот.", "Я розраховую на свого брата."] }, pt: { examples: ["Conto uma piada.", "Conto com meu irmão."] }, fr: { examples: ["Je raconte une blague.", "Je compte sur mon frère."] }, de: { examples: ["Ich erzähle einen Witz.", "Ich verlasse mich auf meinen Bruder."] }, it: { examples: ["Racconto una barzelletta.", "Conto su mio fratello."] }, pl: { examples: ["Opowiadam dowcip.", "Liczę na mojego brata."] }, tr: { examples: ["Bir fıkra anlatıyorum.", "Erkek kardeşime güveniyorum."] }, id: { examples: ["Saya menceritakan sebuah lelucon.", "Saya mengandalkan saudara laki-laki saya."] }, vi: { examples: ["Tôi kể một câu chuyện cười.", "Tôi trông cậy vào anh trai tôi."] } }
        - level: B2
