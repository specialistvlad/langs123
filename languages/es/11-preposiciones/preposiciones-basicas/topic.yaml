# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.preposiciones.preposiciones-basicas
lang: es
kind: grammar
tags: [prepositions, place, movement, time]
concepts: [prepositions-place, prepositions-time]
related: [es.preposiciones.por-para, es.fundamentos.la-hora, es.fundamentos.dias-meses-fechas, es.pronombres.pronombres-preposicion]
status: { en: draft, es: draft }
translated: { es: "f89d02 f14bdf bbd6e3 452bb1 f45c41 ba2b6f 0664e2" }

title: { en: Prepositions of Place and Time, es: Preposiciones de lugar y tiempo }
summary:
  lead:
    en: ["The prepositions ", { term: en }, ", ", { term: a }, ", ", { term: de }, " and their partners place people, things and events: ", { term: en casa }, ", ", { term: a Lima }, ", ", { term: de nueve a cinco }, "."]
    es: ["Las preposiciones ", { term: en }, ", ", { term: a }, ", ", { term: de }, " y sus compañeras sitúan personas, cosas y hechos: ", { term: en casa }, ", ", { term: a Lima }, ", ", { term: de nueve a cinco }, "."]
  rule:
    en: ["Position takes ", { term: en }, ", and movement towards a place takes ", { term: a }, ":"]
    es: ["La posición lleva ", { term: en }, ", y el movimiento hacia un lugar, ", { term: a }, ":"]
  ex: { examples: [["Estoy ", { target: en }, " Lima."], ["Voy ", { target: a }, " Lima."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: en
          rule:
            en: "where something is: in, on, at"
            es: "dónde está algo"
          ex: ["El libro está ", { target: en }, " la mesa."]
          tr: { en: The book is on the table. }
        - level: A1
          point: a
          rule:
            en: "where something goes: to"
            es: "adónde va algo"
          ex: ["Voy ", { target: a }, " la playa."]
          tr: { en: "I'm going to the beach." }
        - level: A1
          point: de
          rule:
            en: "where something comes from, and whose it is"
            es: "de dónde viene algo, y de quién es"
          ex: ["Soy ", { target: de }, " Colombia."]
          tr: { en: "I'm from Colombia." }
        - level: A1
          point: { alternatives: [al, del] }
          rule: { examples: [{ equivalence: [{ pattern: [a, el] }, al] }, { equivalence: [{ pattern: [de, el] }, del] }] }
          ex: { examples: [["Voy ", { target: al }, " cine."], ["Salgo ", { target: del }, " trabajo."]] }
          tr: { en: { examples: ["I'm going to the cinema.", I leave work.] } }
        - level: A2
          point: { en: Position, es: Posición }
          rule: { alternatives: [encima de, debajo de, delante de, detrás de, enfrente de] }
          ex: ["El gato está ", { target: debajo de }, " la cama."]
          tr: { en: The cat is under the bed. }
        - level: A1
          point: { alternatives: [al lado de, cerca de, lejos de, entre] }
          rule:
            en: "next to, near, far from, between"
            es: "contigüidad, proximidad, distancia, posición en medio"
          ex: ["Vivo ", { target: cerca del }, " centro."]
          tr: { en: I live near the centre. }
        - level: A1
          point: { en: Time, es: Tiempo }
          rule:
            en: [{ term: a }, " a clock time; ", { term: en }, " a month, a season, a year"]
            es: [{ term: a }, " una hora; ", { term: en }, " un mes, una estación, un año"]
          ex: { examples: [[{ target: a }, " las tres"], [{ target: en }, " julio"]] }
          tr: { en: { examples: [at three, in July] } }
        - level: A1
          point: { en: Days, es: Días }
          rule:
            en: ["no preposition: ", { term: el lunes }, ", ", { term: el 5 de mayo }]
            es: ["sin preposición: ", { term: el lunes }, ", ", { term: el 5 de mayo }]
          ex: ["Te veo ", { target: el }, " lunes."]
          tr: { en: See you on Monday. }
        - level: A1
          point: ["de ", { gap: true }, " a"]
          rule:
            en: "from a start to an end in time"
            es: "un principio y un final en el tiempo"
          ex: ["Trabajo ", { target: de }, " nueve ", { target: a }, " cinco."]
          tr: { en: I work from nine to five. }
        - level: A2
          point: ["desde ", { gap: true }, " hasta"]
          rule:
            en: "from a start to an end, in time or space"
            es: "un principio y un final, en el tiempo o en el espacio"
          ex: ["Caminamos ", { target: desde }, " el parque ", { target: hasta }, " el río."]
          tr: { en: We walk from the park to the river. }
        - level: A2
          point: { en: Transport, es: Transporte }
          rule:
            en: [{ term: en }, " and the vehicle; ", { term: a pie }, " on foot"]
            es: [{ term: en }, " y el vehículo; ", { term: a pie }, " sin vehículo"]
          ex: { examples: [["Voy ", { target: en }, " tren."], ["Voy ", { target: a pie }, "."]] }
          tr: { en: { examples: [I go by train., I go on foot.] } }
        - level: A1
          point: { alternatives: [con, sin] }
          rule: { en: "with, without", es: "compañía o presencia, y su falta" }
          ex: ["Un café ", { target: con }, " leche y ", { target: sin }, " azúcar."]
          tr: { en: A coffee with milk and without sugar. }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: llegar }, " takes ", { term: a }, ": the place you reach"]
            es: [{ term: llegar }, " lleva ", { term: a }, ": el lugar al que se llega"]
          ex: ["Llego ", { target: a }, " Lima mañana."]
          tr: { en: I arrive in Lima tomorrow. }

sections:
  - title: { en: "Place: en, a, de", es: "Lugar: en, a, de" }
    role: use
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición } }
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, prep: { target: en }, use: { en: "where something is: in, on, at", es: dónde está algo }, ex: ["Estoy ", { target: en }, " casa."], tr: { en: "I'm at home." } }
          - { level: A1, prep: { target: en }, use: { en: inside something or on top of it, es: dentro de algo o encima }, ex: ["Las llaves están ", { target: en }, " la mesa."], tr: { en: The keys are on the table. } }
          - { level: A1, prep: { target: a }, use: { en: "where something goes: to", es: adónde va algo }, ex: ["Vamos ", { target: a }, " la playa."], tr: { en: "We're going to the beach." } }
          - { level: A1, prep: { target: de }, use: { en: "where something comes from: from", es: de dónde viene algo }, ex: ["Soy ", { target: de }, " Chile."], tr: { en: "I'm from Chile." } }
          - { level: A1, prep: { target: de }, use: { en: "whose it is, what it is made of or about", es: "posesión, materia o tema" }, ex: ["la casa ", { target: de }, " Ana"], tr: { en: "Ana's house" } }
          - { level: A2, prep: { target: { alternatives: [["de ", { gap: true }, " a"], ["desde ", { gap: true }, " hasta"]] } }, use: { en: from a starting point to an end point, es: un punto de partida y un punto final }, ex: ["Caminamos ", { target: desde }, " el parque ", { target: hasta }, " el río."], tr: { en: We walk from the park to the river. } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: a }, " and ", { term: el }, " join as ", { term: al }, ", and ", { term: de }, " and ", { term: el }, " as ", { term: del }, ":"]
              es: [{ term: a }, " y ", { term: el }, " se unen en ", { term: al }, ", y ", { term: de }, " y ", { term: el }, ", en ", { term: del }, ":"]
            ex: { examples: [["Voy ", { target: al }, " cine."], ["Salgo ", { target: del }, " trabajo."]] }
            tr: { en: { examples: ["I'm going to the cinema.", I leave work.] } }
          - type: rule
            level: A1
            text:
              en: ["Verbs of movement take ", { term: a }, " before the place they lead to:"]
              es: ["Los verbos de movimiento llevan ", { term: a }, " delante del lugar al que llevan:"]
            ex: ["Llego ", { target: a }, " Lima mañana."]
            tr: { en: I arrive in Lima tomorrow. }
          - type: note
            level: A2
            text:
              en: ["For ", { term: por }, " and ", { term: para }, ", see ", { link: Por and Para, to: es.preposiciones.por-para }, "."]
              es: ["Para ", { term: por }, " y ", { term: para }, ", ver ", { link: Por y para, to: es.preposiciones.por-para }, "."]

  - title: { en: Position, es: La posición }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición } }
          - { key: meaning, label: { en: Meaning, es: Significado } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, prep: { target: encima de }, meaning: { en: on top of, es: en la parte de arriba }, ex: ["El gato está ", { target: encima de }, " la mesa."], tr: { en: The cat is on the table. } }
          - { level: A2, prep: { target: debajo de }, meaning: { en: under, es: en la parte de abajo }, ex: ["Los zapatos están ", { target: debajo de }, " la cama."], tr: { en: The shoes are under the bed. } }
          - { level: A2, prep: { target: delante de }, meaning: { en: in front of, es: en la parte de adelante }, ex: ["Hay un árbol ", { target: delante de }, " la casa."], tr: { en: "There's a tree in front of the house." } }
          - { level: A2, prep: { target: detrás de }, meaning: { en: behind, es: en la parte de atrás }, ex: ["El jardín está ", { target: detrás de }, " la casa."], tr: { en: The garden is behind the house. } }
          - { level: A1, prep: { target: al lado de }, meaning: { en: next to, es: junto a algo }, ex: ["Vivo ", { target: al lado del }, " banco."], tr: { en: I live next to the bank. } }
          - { level: A2, prep: { target: enfrente de }, meaning: { en: opposite, es: "al otro lado, de frente" }, ex: ["La farmacia está ", { target: enfrente de }, " la escuela."], tr: { en: The pharmacy is opposite the school. } }
          - { level: A1, prep: { target: entre }, meaning: { en: between, es: en medio de dos cosas }, ex: ["La tienda está ", { target: entre }, " el banco y el café."], tr: { en: The shop is between the bank and the café. } }
          - { level: A1, prep: { target: cerca de }, meaning: { en: near, es: a poca distancia }, ex: ["Vivo ", { target: cerca del }, " centro."], tr: { en: I live near the centre. } }
          - { level: A1, prep: { target: lejos de }, meaning: { en: far from, es: a mucha distancia }, ex: ["La playa está ", { target: lejos de }, " aquí."], tr: { en: The beach is far from here. } }
          - { level: A2, prep: { target: dentro de }, meaning: { en: inside, es: en el interior }, ex: ["Las llaves están ", { target: dentro de }, " la caja."], tr: { en: The keys are inside the box. } }
          - { level: A2, prep: { target: fuera de }, meaning: { en: outside, es: en el exterior }, ex: ["Vive ", { target: fuera de }, " la ciudad."], tr: { en: She lives outside the city. } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["These phrases end in ", { term: de }, ", which joins ", { term: el }, " as ", { term: del }, ":"]
              es: ["Estas expresiones terminan en ", { term: de }, ", que se une a ", { term: el }, " en ", { term: del }, ":"]
            ex: ["La parada está ", { target: al lado del }, " banco."]
            tr: { en: The stop is next to the bank. }
          - type: rule
            level: A1
            text:
              en: [{ term: entre }, " takes two things joined by ", { term: y }, ", with no ", { term: de }, "."]
              es: [{ term: entre }, " lleva dos cosas unidas por ", { term: y }, ", sin ", { term: de }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["Without a noun after them, ", { term: adentro }, " and ", { term: afuera }, " are the usual forms:"]
              es: ["Sin un sustantivo detrás, ", { term: adentro }, " y ", { term: afuera }, " son las formas habituales:"]
            ex: ["Los niños juegan ", { target: afuera }, "."]
            tr: { en: The children are playing outside. }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["Without a noun after them, ", { term: dentro }, " and ", { term: fuera }, " are the usual forms:"]
              es: ["Sin un sustantivo detrás, ", { term: dentro }, " y ", { term: fuera }, " son las formas habituales:"]
            ex: ["Los niños juegan ", { target: fuera }, "."]
            tr: { en: The children are playing outside. }

  - title: { en: Time, es: El tiempo }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición } }
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, prep: { target: a }, use: { en: a clock time, es: una hora del reloj }, ex: ["La clase es ", { target: a }, " las diez."], tr: { en: The class is at ten. } }
          - { level: A1, prep: { target: en }, use: { en: "a month, a season, a year", es: "un mes, una estación, un año" }, ex: ["Mi cumpleaños es ", { target: en }, " junio."], tr: { en: My birthday is in June. } }
          - { level: A1, use: { en: ["a day or a date, with ", { term: el }], es: ["un día o una fecha, con ", { term: el }] }, ex: ["Llego ", { target: el }, " lunes."], tr: { en: I arrive on Monday. } }
          - { level: A1, prep: { target: ["de ", { gap: true }, " a"] }, use: { en: from one time to another, es: de un momento a otro }, ex: ["Trabajo ", { target: de }, " lunes ", { target: a }, " viernes."], tr: { en: I work from Monday to Friday. } }
          - { level: A2, prep: { target: desde }, use: { en: since a point in time, es: a partir de un momento }, ex: ["Vivo aquí ", { target: desde }, " 2020."], tr: { en: "I've lived here since 2020." } }
          - { level: A2, prep: { target: hasta }, use: { en: until, es: el límite final }, ex: ["Te espero ", { target: hasta }, " las ocho."], tr: { en: "I'll wait for you until eight." } }
          - { level: A2, prep: { target: { alternatives: [antes de, después de] } }, use: { en: "before, after", es: "anterioridad y posterioridad" }, ex: ["Leo ", { target: antes de }, " dormir."], tr: { en: I read before going to sleep. } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: antes de }, " and ", { term: después de }, " take a noun or an infinitive:"]
              es: [{ term: antes de }, " y ", { term: después de }, " llevan un sustantivo o un infinitivo:"]
            ex: { examples: [[{ target: después de }, " la cena"], [{ target: después de }, " comer"]] }
            tr: { en: { examples: [after dinner, after eating] } }
          - type: note
            level: A1
            text:
              en: ["For clock times, see ", { link: Telling the Time, to: es.fundamentos.la-hora }, "; for days and dates, ", { link: "Days, Months and Dates", to: es.fundamentos.dias-meses-fechas }, "."]
              es: ["Para la hora, ver ", { link: La hora, to: es.fundamentos.la-hora }, "; para los días y las fechas, ", { link: "Días, meses y fechas", to: es.fundamentos.dias-meses-fechas }, "."]

  - title: { en: "Transport and company", es: "Transporte y compañía" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición } }
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, prep: { target: en }, use: { en: a means of transport, es: un medio de transporte }, ex: ["Voy al trabajo ", { target: en }, " metro."], tr: { en: I go to work by underground. } }
          - { level: A2, prep: { target: a pie }, use: { en: on foot, es: sin vehículo }, ex: ["Voy a la escuela ", { target: a pie }, "."], tr: { en: I walk to school. } }
          - { level: A1, prep: { target: con }, use: { en: with, es: compañía o presencia }, ex: ["Vivo ", { target: con }, " mis padres."], tr: { en: I live with my parents. } }
          - { level: A1, prep: { target: sin }, use: { en: without, es: falta de algo }, ex: ["Un café ", { target: sin }, " azúcar, por favor."], tr: { en: "A coffee without sugar, please." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: con }, " joins ", { term: mí }, " as ", { term: conmigo }, " and ", { term: ti }, " as ", { term: contigo }, ":"]
              es: [{ term: con }, " se une a ", { term: mí }, " en ", { term: conmigo }, " y a ", { term: ti }, " en ", { term: contigo }, ":"]
            ex: ["¿Vienes ", { target: conmigo }, "?"]
            tr: { en: Are you coming with me? }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Voy en Madrid., right: ["Voy ", { target: a }, " Madrid."], rule: { en: ["movement towards a place takes ", { term: a }], es: ["el movimiento hacia un lugar lleva ", { term: a }] } }
          - { level: A1, wrong: Estoy a casa., right: ["Estoy ", { target: en }, " casa."], rule: { en: ["position takes ", { term: en }], es: ["la posición lleva ", { term: en }] } }
          - { level: A1, wrong: Voy a el cine., right: ["Voy ", { target: al }, " cine."], rule: { en: [{ term: a }, " and ", { term: el }, " join as ", { term: al }], es: [{ term: a }, " y ", { term: el }, " forman ", { term: al }] } }
          - { level: A1, wrong: Vengo de el trabajo., right: ["Vengo ", { target: del }, " trabajo."], rule: { en: [{ term: de }, " and ", { term: el }, " join as ", { term: del }], es: [{ term: de }, " y ", { term: el }, " forman ", { term: del }] } }
          - { level: A1, wrong: La tienda está al lado el banco., right: ["La tienda está ", { target: al lado del }, " banco."], rule: { en: [{ term: al lado de }, " keeps its ", { term: de }], es: [{ term: al lado de }, " mantiene su ", { term: de }] } }
          - { level: A1, wrong: Te veo en el lunes., right: ["Te veo ", { target: el }, " lunes."], rule: { en: a day takes no preposition, es: un día no lleva preposición } }
          - { level: A1, speakers: [en], wrong: Llego en Lima mañana., right: ["Llego ", { target: a }, " Lima mañana."], rule: { en: [{ term: llegar }, " takes ", { term: a }, ", where English says arrive in"] } }
          - { level: A2, speakers: [en], wrong: Voy en pie., right: ["Voy ", { target: a pie }, "."], rule: { en: ["on foot is ", { term: a pie }] } }
