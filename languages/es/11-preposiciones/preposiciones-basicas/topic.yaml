id: es.preposiciones.preposiciones-basicas
lang: es
kind: grammar
tags: [prepositions, place, movement, time]
concepts: [prepositions-place, prepositions-time]
related: [es.preposiciones.por-para, es.fundamentos.la-hora, es.fundamentos.dias-meses-fechas, es.pronombres.pronombres-preposicion]
status: { en: draft, es: draft, uk: draft }
translated: { en: "2f9054 c93840 0f2c35 568c7f e4c170 b0ee85 2cb1c3", uk: "2f9054 c93840 0f2c35 568c7f e4c170 b0ee85 2cb1c3" }

title: { en: Prepositions of Place and Time, es: Preposiciones de lugar y tiempo, uk: "Прийменники місця та часу" }
summary:
  lead:
    en: ["The prepositions ", { term: en }, ", ", { term: a }, ", ", { term: de }, " and their partners place people, things and events: ", { term: en casa }, ", ", { term: a Lima }, ", ", { term: de nueve a cinco }, "."]
    es: ["Las preposiciones ", { term: en }, ", ", { term: a }, ", ", { term: de }, " y sus compañeras sitúan personas, cosas y hechos: ", { term: en casa }, ", ", { term: a Lima }, ", ", { term: de nueve a cinco }, "."]
    uk: ["Прийменники ", { term: "en" }, ", ", { term: "a" }, ", ", { term: "de" }, " та їхні партнери вказують місце людей, речей і подій: ", { term: "en casa" }, ", ", { term: "a Lima" }, ", ", { term: "de nueve a cinco" }, "."]
  rule:
    en: ["Position takes ", { term: en }, ", and movement towards a place takes ", { term: a }, ":"]
    es: ["La posición lleva ", { term: en }, ", y el movimiento hacia un lugar, ", { term: a }, ":"]
    uk: ["Місце вимагає ", { term: "en" }, ", а рух до місця — ", { term: "a" }, ":"]
  ex: { examples: [["Estoy ", { target: en }, " Lima."], ["Voy ", { target: a }, " Lima."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: en
          rule:
            en: "where something is: in, on, at"
            es: "dónde está algo"
            uk: "де щось є: у, на, біля"
          ex: ["El libro está ", { target: en }, " la mesa."]
          tr: { en: The book is on the table., uk: "Книжка на столі." }
        - level: A1
          point: a
          rule:
            en: "where something goes: to"
            es: "adónde va algo"
            uk: "куди щось рухається: до, у, на"
          ex: ["Voy ", { target: a }, " la playa."]
          tr: { en: "I'm going to the beach.", uk: "Я йду на пляж." }
        - level: A1
          point: de
          rule:
            en: "where something comes from, and whose it is"
            es: "de dónde viene algo, y de quién es"
            uk: "звідки щось походить і чиє воно"
          ex: ["Soy ", { target: de }, " Colombia."]
          tr: { en: "I'm from Colombia.", uk: "Я з Колумбії." }
        - level: A1
          point: { alternatives: [al, del] }
          rule: { examples: [{ equivalence: [{ pattern: [a, el] }, al] }, { equivalence: [{ pattern: [de, el] }, del] }] }
          ex: { examples: [["Voy ", { target: al }, " cine."], ["Salgo ", { target: del }, " trabajo."]] }
          tr: { en: { examples: ["I'm going to the cinema.", I leave work.] }, uk: { examples: ["Я йду в кіно.", "Я виходжу з роботи."] } }
        - level: A2
          point: { en: Position, es: Posición, uk: "Місце" }
          rule: { alternatives: [encima de, debajo de, delante de, detrás de, enfrente de] }
          ex: ["El gato está ", { target: debajo de }, " la cama."]
          tr: { en: The cat is under the bed., uk: "Кіт під ліжком." }
        - level: A1
          point: { alternatives: [al lado de, cerca de, lejos de, entre] }
          rule:
            en: "next to, near, far from, between"
            es: "contigüidad, proximidad, distancia, posición en medio"
            uk: "поруч, близько, далеко, між"
          ex: ["Vivo ", { target: cerca del }, " centro."]
          tr: { en: I live near the centre., uk: "Я живу біля центру." }
        - level: A1
          point: { en: Time, es: Tiempo, uk: "Час" }
          rule:
            en: [{ term: a }, " a clock time; ", { term: en }, " a month, a season, a year"]
            es: [{ term: a }, " una hora; ", { term: en }, " un mes, una estación, un año"]
            uk: [{ term: "a" }, " — точний час; ", { term: "en" }, " — місяць, пора року, рік"]
          ex: { examples: [[{ target: a }, " las tres"], [{ target: en }, " julio"]] }
          tr: { en: { examples: [at three, in July] }, uk: { examples: ["о третій", "у липні"] } }
        - level: A1
          point: { en: Days, es: Días, uk: "Дні" }
          rule:
            en: ["no preposition: ", { term: el lunes }, ", ", { term: el 5 de mayo }]
            es: ["sin preposición: ", { term: el lunes }, ", ", { term: el 5 de mayo }]
            uk: ["без прийменника: ", { term: "el lunes" }, ", ", { term: "el 5 de mayo" }]
          ex: ["Te veo ", { target: el }, " lunes."]
          tr: { en: See you on Monday., uk: "Побачимося в понеділок." }
        - level: A1
          point: ["de ", { gap: true }, " a"]
          rule:
            en: "from a start to an end in time"
            es: "un principio y un final en el tiempo"
            uk: "від початку до кінця в часі"
          ex: ["Trabajo ", { target: de }, " nueve ", { target: a }, " cinco."]
          tr: { en: I work from nine to five., uk: "Я працюю з дев’ятої до п’ятої." }
        - level: A2
          point: ["desde ", { gap: true }, " hasta"]
          rule:
            en: "from a start to an end, in time or space"
            es: "un principio y un final, en el tiempo o en el espacio"
            uk: "від початку до кінця, у часі або просторі"
          ex: ["Caminamos ", { target: desde }, " el parque ", { target: hasta }, " el río."]
          tr: { en: We walk from the park to the river., uk: "Ми йдемо від парку до річки." }
        - level: A2
          point: { en: Transport, es: Transporte, uk: "Транспорт" }
          rule:
            en: [{ term: en }, " and the vehicle; ", { term: a pie }, " on foot"]
            es: [{ term: en }, " y el vehículo; ", { term: a pie }, " sin vehículo"]
            uk: [{ term: "en" }, " і транспортний засіб; ", { term: "a pie" }, " — пішки"]
          ex: { examples: [["Voy ", { target: en }, " tren."], ["Voy ", { target: a pie }, "."]] }
          tr: { en: { examples: [I go by train., I go on foot.] }, uk: { examples: ["Я їду потягом.", "Я йду пішки."] } }
        - level: A1
          point: { alternatives: [con, sin] }
          rule: { en: "with, without", es: "compañía o presencia, y su falta", uk: "з, без" }
          ex: ["Un café ", { target: con }, " leche y ", { target: sin }, " azúcar."]
          tr: { en: A coffee with milk and without sugar., uk: "Кава з молоком і без цукру." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: llegar }, " takes ", { term: a }, ": the place you reach"]
            es: [{ term: llegar }, " lleva ", { term: a }, ": el lugar al que se llega"]
            uk: [{ term: "llegar" }, " вимагає ", { term: "a" }, ": місце, куди прибувають"]
          ex: ["Llego ", { target: a }, " Lima mañana."]
          tr: { en: I arrive in Lima tomorrow., uk: "Завтра я приїжджаю до Ліми." }

sections:
  - title: { en: "Place: en, a, de", es: "Lugar: en, a, de", uk: "Місце: en, a, de" }
    role: use
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición, uk: "Прийменник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, prep: { target: en }, use: { en: "where something is: in, on, at", es: dónde está algo, uk: "де щось є: у, на, біля" }, ex: ["Estoy ", { target: en }, " casa."], tr: { en: "I'm at home.", uk: "Я вдома." } }
          - { level: A1, prep: { target: en }, use: { en: inside something or on top of it, es: dentro de algo o encima, uk: "усередині чогось або на чомусь" }, ex: ["Las llaves están ", { target: en }, " la mesa."], tr: { en: The keys are on the table., uk: "Ключі на столі." } }
          - { level: A1, prep: { target: a }, use: { en: "where something goes: to", es: adónde va algo, uk: "куди щось рухається: до, у, на" }, ex: ["Vamos ", { target: a }, " la playa."], tr: { en: "We're going to the beach.", uk: "Ми йдемо на пляж." } }
          - { level: A1, prep: { target: de }, use: { en: "where something comes from: from", es: de dónde viene algo, uk: "звідки щось походить: з, від" }, ex: ["Soy ", { target: de }, " Chile."], tr: { en: "I'm from Chile.", uk: "Я з Чилі." } }
          - { level: A1, prep: { target: de }, use: { en: "whose it is, what it is made of or about", es: "posesión, materia o tema", uk: "чиє це, з чого зроблене або про що" }, ex: ["la casa ", { target: de }, " Ana"], tr: { en: "Ana's house", uk: "дім Ани" } }
          - { level: A2, prep: { target: { alternatives: [["de ", { gap: true }, " a"], ["desde ", { gap: true }, " hasta"]] } }, use: { en: from a starting point to an end point, es: un punto de partida y un punto final, uk: "від початкової точки до кінцевої" }, ex: ["Caminamos ", { target: desde }, " el parque ", { target: hasta }, " el río."], tr: { en: We walk from the park to the river., uk: "Ми йдемо від парку до річки." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: a }, " and ", { term: el }, " join as ", { term: al }, ", and ", { term: de }, " and ", { term: el }, " as ", { term: del }, ":"]
              es: [{ term: a }, " y ", { term: el }, " se unen en ", { term: al }, ", y ", { term: de }, " y ", { term: el }, ", en ", { term: del }, ":"]
              uk: [{ term: "a" }, " і ", { term: "el" }, " зливаються в ", { term: "al" }, ", а ", { term: "de" }, " і ", { term: "el" }, " — у ", { term: "del" }, ":"]
            ex: { examples: [["Voy ", { target: al }, " cine."], ["Salgo ", { target: del }, " trabajo."]] }
            tr: { en: { examples: ["I'm going to the cinema.", I leave work.] }, uk: { examples: ["Я йду в кіно.", "Я виходжу з роботи."] } }
          - type: rule
            level: A1
            text:
              en: ["Verbs of movement take ", { term: a }, " before the place they lead to:"]
              es: ["Los verbos de movimiento llevan ", { term: a }, " delante del lugar al que llevan:"]
              uk: ["Дієслова руху вимагають ", { term: "a" }, " перед місцем, куди ведуть:"]
            ex: ["Llego ", { target: a }, " Lima mañana."]
            tr: { en: I arrive in Lima tomorrow., uk: "Завтра я приїжджаю до Ліми." }
          - type: note
            level: A2
            text:
              en: ["For ", { term: por }, " and ", { term: para }, ", see ", { link: Por and Para, to: es.preposiciones.por-para }, "."]
              es: ["Para ", { term: por }, " y ", { term: para }, ", ver ", { link: Por y para, to: es.preposiciones.por-para }, "."]
              uk: ["Про ", { term: "por" }, " і ", { term: "para" }, " див. ", { link: "Por і para", to: "es.preposiciones.por-para" }, "."]

  - title: { en: Position, es: La posición, uk: "Місце" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición, uk: "Прийменник" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, prep: { target: encima de }, meaning: { en: on top of, es: en la parte de arriba, uk: "на" }, ex: ["El gato está ", { target: encima de }, " la mesa."], tr: { en: The cat is on the table., uk: "Кіт на столі." } }
          - { level: A2, prep: { target: debajo de }, meaning: { en: under, es: en la parte de abajo, uk: "під" }, ex: ["Los zapatos están ", { target: debajo de }, " la cama."], tr: { en: The shoes are under the bed., uk: "Черевики під ліжком." } }
          - { level: A2, prep: { target: delante de }, meaning: { en: in front of, es: en la parte de adelante, uk: "перед" }, ex: ["Hay un árbol ", { target: delante de }, " la casa."], tr: { en: "There's a tree in front of the house.", uk: "Перед будинком є дерево." } }
          - { level: A2, prep: { target: detrás de }, meaning: { en: behind, es: en la parte de atrás, uk: "позаду" }, ex: ["El jardín está ", { target: detrás de }, " la casa."], tr: { en: The garden is behind the house., uk: "Сад позаду будинку." } }
          - { level: A1, prep: { target: al lado de }, meaning: { en: next to, es: junto a algo, uk: "поруч із" }, ex: ["Vivo ", { target: al lado del }, " banco."], tr: { en: I live next to the bank., uk: "Я живу поруч із банком." } }
          - { level: A2, prep: { target: enfrente de }, meaning: { en: opposite, es: "al otro lado, de frente", uk: "навпроти" }, ex: ["La farmacia está ", { target: enfrente de }, " la escuela."], tr: { en: The pharmacy is opposite the school., uk: "Аптека навпроти школи." } }
          - { level: A1, prep: { target: entre }, meaning: { en: between, es: en medio de dos cosas, uk: "між" }, ex: ["La tienda está ", { target: entre }, " el banco y el café."], tr: { en: The shop is between the bank and the café., uk: "Крамниця між банком і кав’ярнею." } }
          - { level: A1, prep: { target: cerca de }, meaning: { en: near, es: a poca distancia, uk: "біля, недалеко від" }, ex: ["Vivo ", { target: cerca del }, " centro."], tr: { en: I live near the centre., uk: "Я живу біля центру." } }
          - { level: A1, prep: { target: lejos de }, meaning: { en: far from, es: a mucha distancia, uk: "далеко від" }, ex: ["La playa está ", { target: lejos de }, " aquí."], tr: { en: The beach is far from here., uk: "Пляж далеко звідси." } }
          - { level: A2, prep: { target: dentro de }, meaning: { en: inside, es: en el interior, uk: "усередині" }, ex: ["Las llaves están ", { target: dentro de }, " la caja."], tr: { en: The keys are inside the box., uk: "Ключі всередині коробки." } }
          - { level: A2, prep: { target: fuera de }, meaning: { en: outside, es: en el exterior, uk: "зовні, поза" }, ex: ["Vive ", { target: fuera de }, " la ciudad."], tr: { en: She lives outside the city., uk: "Вона живе за містом." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["These phrases end in ", { term: de }, ", which joins ", { term: el }, " as ", { term: del }, ":"]
              es: ["Estas expresiones terminan en ", { term: de }, ", que se une a ", { term: el }, " en ", { term: del }, ":"]
              uk: ["Ці вирази закінчуються на ", { term: "de" }, ", що зливається з ", { term: "el" }, " у ", { term: "del" }, ":"]
            ex: ["La parada está ", { target: al lado del }, " banco."]
            tr: { en: The stop is next to the bank., uk: "Зупинка поруч із банком." }
          - type: rule
            level: A1
            text:
              en: [{ term: entre }, " takes two things joined by ", { term: y }, ", with no ", { term: de }, "."]
              es: [{ term: entre }, " lleva dos cosas unidas por ", { term: y }, ", sin ", { term: de }, "."]
              uk: [{ term: "entre" }, " вимагає двох речей, з’єднаних ", { term: "y" }, ", без ", { term: "de" }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["Without a noun after them, ", { term: adentro }, " and ", { term: afuera }, " are the usual forms:"]
              es: ["Sin un sustantivo detrás, ", { term: adentro }, " y ", { term: afuera }, " son las formas habituales:"]
              uk: ["Без іменника після них звичайні форми — ", { term: "adentro" }, " і ", { term: "afuera" }, ":"]
            ex: ["Los niños juegan ", { target: afuera }, "."]
            tr: { en: The children are playing outside., uk: "Діти граються надворі." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["Without a noun after them, ", { term: dentro }, " and ", { term: fuera }, " are the usual forms:"]
              es: ["Sin un sustantivo detrás, ", { term: dentro }, " y ", { term: fuera }, " son las formas habituales:"]
              uk: ["Без іменника після них звичайні форми — ", { term: "dentro" }, " і ", { term: "fuera" }, ":"]
            ex: ["Los niños juegan ", { target: fuera }, "."]
            tr: { en: The children are playing outside., uk: "Діти граються надворі." }

  - title: { en: Time, es: El tiempo, uk: "Час" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición, uk: "Прийменник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, prep: { target: a }, use: { en: a clock time, es: una hora del reloj, uk: "точний час" }, ex: ["La clase es ", { target: a }, " las diez."], tr: { en: The class is at ten., uk: "Заняття о десятій." } }
          - { level: A1, prep: { target: en }, use: { en: "a month, a season, a year", es: "un mes, una estación, un año", uk: "місяць, пора року, рік" }, ex: ["Mi cumpleaños es ", { target: en }, " junio."], tr: { en: My birthday is in June., uk: "Мій день народження в червні." } }
          - { level: A1, use: { en: ["a day or a date, with ", { term: el }], es: ["un día o una fecha, con ", { term: el }], uk: ["день або дата, з ", { term: "el" }] }, ex: ["Llego ", { target: el }, " lunes."], tr: { en: I arrive on Monday., uk: "Я приїжджаю в понеділок." } }
          - { level: A1, prep: { target: ["de ", { gap: true }, " a"] }, use: { en: from one time to another, es: de un momento a otro, uk: "від одного моменту до іншого" }, ex: ["Trabajo ", { target: de }, " lunes ", { target: a }, " viernes."], tr: { en: I work from Monday to Friday., uk: "Я працюю з понеділка по п’ятницю." } }
          - { level: A2, prep: { target: desde }, use: { en: since a point in time, es: a partir de un momento, uk: "з певного моменту" }, ex: ["Vivo aquí ", { target: desde }, " 2020."], tr: { en: "I've lived here since 2020.", uk: "Я живу тут із 2020 року." } }
          - { level: A2, prep: { target: hasta }, use: { en: until, es: el límite final, uk: "до (кінцева межа)" }, ex: ["Te espero ", { target: hasta }, " las ocho."], tr: { en: "I'll wait for you until eight.", uk: "Я чекатиму на тебе до восьмої." } }
          - { level: A2, prep: { target: { alternatives: [antes de, después de] } }, use: { en: "before, after", es: "anterioridad y posterioridad", uk: "до, після" }, ex: ["Leo ", { target: antes de }, " dormir."], tr: { en: I read before going to sleep., uk: "Я читаю перед сном." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: antes de }, " and ", { term: después de }, " take a noun or an infinitive:"]
              es: [{ term: antes de }, " y ", { term: después de }, " llevan un sustantivo o un infinitivo:"]
              uk: [{ term: "antes de" }, " і ", { term: "después de" }, " вимагають іменника або інфінітива:"]
            ex: { examples: [[{ target: después de }, " la cena"], [{ target: después de }, " comer"]] }
            tr: { en: { examples: [after dinner, after eating] }, uk: { examples: ["після вечері", "після їжі"] } }
          - type: note
            level: A1
            text:
              en: ["For clock times, see ", { link: Telling the Time, to: es.fundamentos.la-hora }, "; for days and dates, ", { link: "Days, Months and Dates", to: es.fundamentos.dias-meses-fechas }, "."]
              es: ["Para la hora, ver ", { link: La hora, to: es.fundamentos.la-hora }, "; para los días y las fechas, ", { link: "Días, meses y fechas", to: es.fundamentos.dias-meses-fechas }, "."]
              uk: ["Про час див. ", { link: "Котра година", to: "es.fundamentos.la-hora" }, "; про дні й дати — ", { link: "Дні, місяці та дати", to: "es.fundamentos.dias-meses-fechas" }, "."]

  - title: { en: "Transport and company", es: "Transporte y compañía", uk: "Транспорт і супровід" }
    role: own
    content:
      - type: usage
        columns:
          - { key: prep, label: { en: Preposition, es: Preposición, uk: "Прийменник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, prep: { target: en }, use: { en: a means of transport, es: un medio de transporte, uk: "транспортний засіб" }, ex: ["Voy al trabajo ", { target: en }, " metro."], tr: { en: I go to work by underground., uk: "Я їду на роботу на метро." } }
          - { level: A2, prep: { target: a pie }, use: { en: on foot, es: sin vehículo, uk: "пішки" }, ex: ["Voy a la escuela ", { target: a pie }, "."], tr: { en: I walk to school., uk: "Я ходжу до школи пішки." } }
