          - { level: B2, adverb: { alternatives: [{ target: inmediatamente }, { target: simultáneamente }] }, aspect: { es: "relación entre dos hechos", en: "relation between two events", uk: "зв’язок між двома подіями", pt: "relação entre dois fatos", fr: "relation entre deux faits", de: "Beziehung zwischen zwei Sachverhalten", it: "relazione tra due fatti", pl: "relacja między dwoma zdarzeniami", tr: "iki olay arasındaki ilişki", id: "hubungan antara dua peristiwa", vi: "quan hệ giữa hai sự việc" }, ex: { examples: [["Salió ", { target: inmediatamente }, " después de cenar."], ["Los dos corredores llegaron ", { target: simultáneamente }, "."]] }, tr: { en: { examples: ["He left immediately after dinner.", "The two runners arrived at the same time."] }, uk: { examples: ["Він пішов одразу після вечері.", "Обидва бігуни прибули одночасно."] }, pt: { examples: ["Ele saiu imediatamente depois do jantar.", "Os dois corredores chegaram simultaneamente."] }, fr: { examples: ["Il est parti immédiatement après le dîner.", "Les deux coureurs sont arrivés en même temps."] }, de: { examples: ["Er ging unmittelbar nach dem Abendessen.", "Die beiden Läufer kamen gleichzeitig an."] }, it: { examples: ["È uscito subito dopo cena.", "I due corridori sono arrivati contemporaneamente."] }, pl: { examples: ["Wyszedł natychmiast po kolacji.", "Obaj biegacze dotarli jednocześnie."] }, tr: { examples: ["Akşam yemeğinden hemen sonra çıktı.", "İki koşucu aynı anda geldi."] }, id: { examples: ["Dia pergi segera setelah makan malam.", "Kedua pelari itu tiba secara bersamaan."] }, vi: { examples: ["Anh ấy ra ngoài ngay sau bữa tối.", "Hai vận động viên chạy về đích cùng lúc."] } } }
          - { level: B2, adverb: { target: definitivamente }, aspect: { es: "resultativo: el hecho deja un estado final", en: "resultative: the event leaves a final state", uk: "результативний: подія залишає кінцевий стан", pt: "resultativo: o fato deixa um estado final", fr: "résultatif : le fait laisse un état final", de: "resultativ: der Sachverhalt hinterlässt einen Endzustand", it: "risultativo: il fatto lascia uno stato finale", pl: "rezultatywny: zdarzenie pozostawia stan końcowy", tr: "sonuç bildiren: olay son bir durum bırakır", id: "resultatif: peristiwa meninggalkan keadaan akhir", vi: "chỉ kết quả: sự việc để lại một trạng thái cuối cùng" }, ex: ["Se instaló ", { target: definitivamente }, " en Lima."], tr: { en: "He settled in Lima for good.", uk: "Він оселився в Лімі назавжди.", pt: "Ele se instalou definitivamente em Lima.", fr: "Il s’est installé définitivement à Lima.", de: "Er hat sich endgültig in Lima niedergelassen.", it: "Si è stabilito definitivamente a Lima.", pl: "Osiedlił się w Limie na stałe.", tr: "Lima'ya kalıcı olarak yerleşti.", id: "Dia menetap di Lima untuk selamanya.", vi: "Anh ấy đã định cư hẳn ở Lima." } }
          - { level: B2, adverb: { target: continuamente }, aspect: { es: "durativo: el hecho se prolonga", en: "durative: the event goes on", uk: "тривалий: подія триває", pt: "durativo: o fato se prolonga", fr: "duratif : le fait se prolonge", de: "durativ: der Sachverhalt dauert an", it: "durativo: il fatto si prolunga", pl: "durativny: zdarzenie trwa", tr: "süreklilik bildiren: olay uzar gider", id: "durativ: peristiwa berlangsung terus", vi: "chỉ sự kéo dài: sự việc kéo dài mãi" }, ex: ["El teléfono suena ", { target: continuamente }, "."], tr: { en: "The phone rings continuously.", uk: "Телефон дзвонить безперервно.", pt: "O telefone toca continuamente.", fr: "Le téléphone sonne sans arrêt.", de: "Das Telefon klingelt ununterbrochen.", it: "Il telefono squilla continuamente.", pl: "Telefon dzwoni bez przerwy.", tr: "Telefon durmadan çalıyor.", id: "Telepon berdering terus-menerus.", vi: "Điện thoại reo liên tục." } }
          - { level: B2, adverb: { target: instantáneamente }, aspect: { es: "puntual: el hecho dura un instante", en: "punctual: the event lasts an instant", uk: "миттєвий: подія триває лише мить", pt: "pontual: o fato dura um instante", fr: "ponctuel : le fait dure un instant", de: "punktuell: der Sachverhalt dauert einen Augenblick", it: "puntuale: il fatto dura un istante", pl: "punktualny: zdarzenie trwa chwilę", tr: "anlık: olay bir an sürer", id: "puntual: peristiwa hanya berlangsung sesaat", vi: "chỉ khoảnh khắc: sự việc chỉ kéo dài một chốc" }, ex: ["La luz se apagó ", { target: instantáneamente }, "."], tr: { en: "The light went out instantly.", uk: "Світло згасло миттєво.", pt: "A luz se apagou instantaneamente.", fr: "La lumière s’est éteinte instantanément.", de: "Das Licht ging sofort aus.", it: "La luce si è spenta all'istante.", pl: "Światło zgasło natychmiast.", tr: "Işık bir anda söndü.", id: "Lampu padam seketika.", vi: "Đèn tắt ngay lập tức." } }
