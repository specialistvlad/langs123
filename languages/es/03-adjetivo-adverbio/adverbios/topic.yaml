          - { level: C1, word: { target: por qué }, meaning: { es: "una sola unidad: pregunta por la causa", en: "one single unit: asks for the cause", uk: "одна одиниця: питає про причину", pt: "uma só unidade: pergunta pela causa", fr: "une seule unité : demande la cause", de: "eine einzige Einheit: fragt nach dem Grund", it: "un'unica unità: chiede la causa", pl: "jedna jednostka: pyta o przyczynę", tr: "tek birim: nedeni sorar", id: "satu unit: menanyakan sebab", vi: "một đơn vị duy nhất: hỏi về nguyên nhân" }, ex: { exchange: ["¿Por qué votas?", "Porque es mi derecho."] }, tr: { en: { exchange: ["Why do you vote?", "Because it's my right."] }, uk: { exchange: ["Чому ти голосуєш?", "Тому що це моє право."] }, pt: { exchange: ["Por que você vota?", "Porque é meu direito."] }, fr: { exchange: ["Pourquoi votes-tu ?", "Parce que c’est mon droit."] }, de: { exchange: ["Warum wählst du?", "Weil es mein Recht ist."] }, it: { exchange: ["Perché voti?", "Perché è un mio diritto."] }, pl: { exchange: ["Dlaczego głosujesz?", "Bo to moje prawo."] }, tr: { exchange: ["Neden oy veriyorsun?", "Çünkü bu benim hakkım."] }, id: { exchange: ["Mengapa kamu memilih?", "Karena itu hak saya."] }, vi: { exchange: ["Tại sao bạn bỏ phiếu?", "Vì đó là quyền của tôi."] } } }
          - { level: C1, word: { pattern: [por, qué] }, meaning: { es: "dos palabras: la preposición del verbo y el interrogativo", en: "two words: the preposition of the verb and the interrogative", uk: "два слова: прийменник дієслова й питальне слово", pt: "duas palavras: a preposição do verbo e o interrogativo", fr: "deux mots : la préposition du verbe et l’interrogatif", de: "zwei Wörter: die Präposition des Verbs und das Interrogativ", it: "due parole: la preposizione del verbo e l'interrogativo", pl: "dwa wyrazy: przyimek czasownika i zaimek pytający", tr: "iki sözcük: fiilin edatı ve soru sözcüğü", id: "dua kata: preposisi dari kata kerja dan kata tanya", vi: "hai từ: giới từ của động từ và từ để hỏi" }, ex: { exchange: ["¿Por qué votas?", "Por los verdes."] }, tr: { en: { exchange: ["Who do you vote for?", "For the Greens."] }, uk: { exchange: ["За кого ти голосуєш?", "За зелених."] }, pt: { exchange: ["Em quem você vota?", "Nos verdes."] }, fr: { exchange: ["Pour qui votes-tu ?", "Pour les Verts."] }, de: { exchange: ["Wen wählst du?", "Die Grünen."] }, it: { exchange: ["Per chi voti?", "Per i Verdi."] }, pl: { exchange: ["Na kogo głosujesz?", "Na Zielonych."] }, tr: { exchange: ["Kime oy veriyorsun?", "Yeşillere."] }, id: { exchange: ["Kamu memilih siapa?", "Partai Hijau."] }, vi: { exchange: ["Bạn bỏ phiếu cho ai?", "Cho đảng Xanh."] } } }
