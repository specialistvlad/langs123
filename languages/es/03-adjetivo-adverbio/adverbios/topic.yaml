id: es.adjetivo-adverbio.adverbios
lang: es
kind: grammar
tags: [adverbs, manner, frequency, place, time]
concepts: [adverbs]
related: [es.adjetivo-adverbio.adjetivo-concordancia, es.adjetivo-adverbio.comparativos-superlativos, es.sustantivo-determinantes.cuantificadores, es.oracion.preguntas-negacion]
status: { en: draft, es: draft, uk: draft }
translated: { en: "918460 7a8ac8 184349 fb521d 54b436 8fb343 bad656", uk: "918460 7a8ac8 184349 fb521d 54b436 8fb343 bad656" }

title: { en: Adverbs, es: Los adverbios, uk: "Прислівники" }
summary:
  lead:
    en: ["Adverbs say how, when, where and how much: ", { term: rápidamente }, ", ", { term: siempre }, ", ", { term: aquí }, ", ", { term: muy }, "; many end in ", { term: -mente }, "."]
    es: ["Los adverbios dicen cómo, cuándo, dónde y cuánto: ", { term: rápidamente }, ", ", { term: siempre }, ", ", { term: aquí }, ", ", { term: muy }, "; muchos terminan en ", { term: -mente }, "."]
    uk: ["Прислівники кажуть, як, коли, де і скільки: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; багато з них закінчуються на ", { term: "-mente" }, "."]
  rule:
    en: ["Before an adjective comes ", { term: muy }, ", and after a verb, ", { term: mucho }, ":"]
    es: ["Delante de un adjetivo va ", { term: muy }, ", y detrás de un verbo, ", { term: mucho }, ":"]
    uk: ["Перед прикметником вживається ", { term: "muy" }, ", а після дієслова — ", { term: "mucho" }, ":"]
  ex: { examples: [["Es ", { target: muy }, " caro."], ["Trabajo ", { target: mucho }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: { alternatives: [bien, mal] }
          rule:
            en: ["the adverbs of ", { term: bueno }, " and ", { term: malo }]
            es: ["los adverbios de ", { term: bueno }, " y ", { term: malo }]
            uk: ["прислівники від ", { term: "bueno" }, " і ", { term: "malo" }]
          ex: ["Hablas ", { target: bien }, " español."]
          tr: { en: You speak Spanish well., uk: "Ти добре розмовляєш іспанською." }
        - level: A1
          point: muy
          rule:
            en: "before an adjective or an adverb"
            es: "delante de un adjetivo o de un adverbio"
            uk: "перед прикметником або прислівником"
          ex: ["Es ", { target: muy }, " simpática."]
          tr: { en: "She's very nice.", uk: "Вона дуже приємна." }
        - level: A1
          point: mucho
          rule:
            en: "after a verb; as an adverb it never changes"
            es: "detrás de un verbo; como adverbio no cambia"
            uk: "після дієслова; як прислівник ніколи не змінюється"
          ex: ["Trabajo ", { target: mucho }, "."]
          tr: { en: I work a lot., uk: "Я багато працюю." }
        - level: A1
          point: { en: Place, es: Lugar, uk: "Місце" }
          rule:
            en: [{ alternatives: [{ term: aquí }, { term: ahí }, { term: allí }] }, ": here, there, over there"]
            es: [{ alternatives: [{ term: aquí }, { term: ahí }, { term: allí }] }, ": cerca de mí, cerca de ti, lejos"]
            uk: [{ alternatives: [{ term: "aquí" }, { term: "ahí" }, { term: "allí" }] }, ": тут, там (біля тебе), он там"]
          ex: ["El libro está ", { target: aquí }, "."]
          tr: { en: The book is here., uk: "Книжка тут." }
        - level: A1
          variety: es-419
          point: { alternatives: [acá, allá] }
          rule:
            en: ["very frequent in Latin America, above all in Mexico and the Southern Cone, beside ", { term: aquí }, " and ", { term: allí }]
            es: ["muy frecuentes en Latinoamérica, sobre todo en México y el Cono Sur, junto a ", { term: aquí }, " y ", { term: allí }]
            uk: ["дуже поширені в Латинській Америці, особливо в Мексиці та країнах Південного Конуса, поряд із ", { term: "aquí" }, " і ", { term: "allí" }]
          ex: ["Vivo ", { target: acá }, "."]
          tr: { en: I live here., uk: "Я живу тут." }
        - level: A1
          point: { en: Time, es: Tiempo, uk: "Час" }
          rule: { alternatives: [hoy, mañana, ahora, después] }
          ex: [{ target: Mañana }, " tengo clase."]
          tr: { en: Tomorrow I have class., uk: "Завтра в мене заняття." }
        - level: A1
          point: { en: Frequency, es: Frecuencia, uk: "Частотність" }
          rule: { alternatives: [siempre, normalmente, todos los días, a veces] }
          ex: [{ target: Siempre }, " desayuno en casa."]
          tr: { en: I always have breakfast at home., uk: "Я завжди снідаю вдома." }
        - level: A2
          point: nunca
          rule:
            en: ["before the verb, or after it with ", { term: "no" }, " in front"]
            es: ["delante del verbo, o detrás con ", { term: "no" }, " delante"]
            uk: ["перед дієсловом або після нього з ", { term: "no" }, " попереду"]
          ex: { examples: [[{ target: Nunca }, " bebo café."], [{ target: "No" }, " bebo café ", { target: nunca }, "."]] }
          tr: { en: { examples: [I never drink coffee., I never drink coffee.] }, uk: { examples: ["Я ніколи не п’ю кави.", "Я ніколи не п’ю кави."] } }
        - level: A1
          point: { alternatives: [también, tampoco] }
          rule:
            en: [{ term: también }, " agrees with a positive, ", { term: tampoco }, " with a negative"]
            es: [{ term: también }, " acompaña a una afirmación, ", { term: tampoco }, " a una negación"]
            uk: [{ term: "también" }, " погоджується зі ствердженням, ", { term: "tampoco" }, " — із запереченням"]
          ex: { exchange: ["No tengo hambre.", ["Yo ", { target: tampoco }, "."]] }
          tr: { en: { exchange: ["I'm not hungry.", Me neither.] }, uk: { exchange: ["Я не голодний.", "Я теж ні."] } }
        - level: A2
          point: -mente
          rule: { pattern: [{ slot: { en: feminine adjective, es: adjetivo femenino, uk: "прикметник жіночого роду" } }, "-mente"] }
          ex: { examples: [{ mapping: [lenta, { target: lentamente }] }, { mapping: [fácil, { target: fácilmente }] }] }
        - level: A2
          point: { alternatives: [ya, todavía] }
          rule:
            en: [{ term: ya }, ": already; ", { term: todavía }, ": still; ", { term: todavía no }, ": not yet"]
            es: [{ term: ya }, ": algo ha pasado; ", { term: todavía }, ": sigue igual; ", { term: todavía no }, ": aún no ha pasado"]
            uk: [{ term: "ya" }, ": уже; ", { term: "todavía" }, ": досі; ", { term: "todavía no" }, ": ще ні"]
          ex: [{ target: Todavía }, " vivo con mis padres."]
          tr: { en: I still live with my parents., uk: "Я досі живу з батьками." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "the adjective keeps its written accent before -mente"
            es: "el adjetivo mantiene su tilde delante de -mente"
            uk: "прикметник зберігає свій знак наголосу перед -mente"
          ex: { mapping: [rápida, { target: rápidamente }] }

sections:
  - title: { en: "Use: how and how much", es: "Uso: cómo y cuánto", uk: "Вживання: як і скільки" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, es: Adverbio, uk: "Прислівник" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, adverb: { target: bien }, use: { en: ["well: the adverb of ", { term: bueno }], es: ["el adverbio de ", { term: bueno }], uk: ["добре: прислівник від ", { term: "bueno" }] }, ex: ["Cocinas muy ", { target: bien }, "."], tr: { en: You cook very well., uk: "Ти дуже добре готуєш." } }
          - { level: A1, adverb: { target: mal }, use: { en: ["badly: the adverb of ", { term: malo }], es: ["el adverbio de ", { term: malo }], uk: ["погано: прислівник від ", { term: "malo" }] }, ex: ["Duermo ", { target: mal }, "."], tr: { en: I sleep badly., uk: "Я погано сплю." } }
          - { level: A1, adverb: { target: muy }, use: { en: "very, before an adjective or an adverb", es: "delante de un adjetivo o de un adverbio", uk: "дуже, перед прикметником або прислівником" }, ex: ["Estoy ", { target: muy }, " cansado."], tr: { en: "I'm very tired.", uk: "Я дуже втомився." } }
          - { level: A1, adverb: { target: mucho }, use: { en: "a lot, after a verb", es: "en gran cantidad, detrás de un verbo", uk: "багато, після дієслова" }, ex: ["Llueve ", { target: mucho }, "."], tr: { en: It rains a lot., uk: "Часто йде дощ." } }
          - { level: A1, adverb: { target: poco }, use: { en: "not much, after a verb", es: "en poca cantidad, detrás de un verbo", uk: "мало, після дієслова" }, ex: ["Como ", { target: poco }, "."], tr: { en: "I don't eat much.", uk: "Я їм небагато." } }
          - { level: A1, adverb: { target: bastante }, use: { en: "quite, fairly", es: "en cantidad suficiente o algo alta", uk: "досить, доволі" }, ex: ["Es ", { target: bastante }, " caro."], tr: { en: "It's quite expensive.", uk: "Це досить дорого." } }
          - { level: A2, adverb: { target: demasiado }, use: { en: "too, too much", es: "más de lo necesario", uk: "занадто, надто багато" }, ex: ["Hablas ", { target: demasiado }, "."], tr: { en: You talk too much., uk: "Ти говориш забагато." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: muy }, " goes before an adjective or an adverb, and ", { term: mucho }, " after a verb:"]
              es: [{ term: muy }, " va delante de un adjetivo o de un adverbio, y ", { term: mucho }, ", detrás de un verbo:"]
              uk: [{ term: "muy" }, " стоїть перед прикметником або прислівником, а ", { term: "mucho" }, " — після дієслова:"]
            ex: { examples: [["Es ", { target: muy }, " rico."], ["Me gusta ", { target: mucho }, "."]] }
            tr: { en: { examples: ["It's very tasty.", I like it a lot.] }, uk: { examples: ["Це дуже смачно.", "Мені це дуже подобається."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: mucho }, " after a verb never changes; before a noun it agrees with the noun:"]
              es: [{ term: mucho }, " detrás de un verbo no cambia; delante de un sustantivo concuerda con él:"]
              uk: [{ term: "mucho" }, " після дієслова ніколи не змінюється; перед іменником узгоджується з ним:"]
            ex: { examples: [["Leo ", { target: mucho }, "."], ["Leo ", { target: muchos }, " libros."]] }
            tr: { en: { examples: [I read a lot., I read many books.] }, uk: { examples: ["Я багато читаю.", "Я читаю багато книжок."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: mejor }, " and ", { term: peor }, " are also the comparatives of ", { term: bien }, " and ", { term: mal }, ":"]
              es: [{ term: mejor }, " y ", { term: peor }, " son también los comparativos de ", { term: bien }, " y ", { term: mal }, ":"]
              uk: [{ term: "mejor" }, " і ", { term: "peor" }, " — це також вищий ступінь від ", { term: "bien" }, " і ", { term: "mal" }, ":"]
            ex: ["Hoy me siento ", { target: mejor }, "."]
            tr: { en: Today I feel better., uk: "Сьогодні я почуваюся краще." }

  - title: { en: "Form: -mente", es: "Forma: -mente", uk: "Форма: -mente" }
    role: form
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Add ", { term: -mente }, " to the feminine form of the adjective:"]
              es: ["Se añade ", { term: -mente }, " a la forma femenina del adjetivo:"]
              uk: [{ term: "-mente" }, " додають до форми жіночого роду прикметника:"]
            ex: { examples: [{ mapping: [lenta, { target: lentamente }] }, { mapping: [tranquila, { target: tranquilamente }] }] }
          - type: rule
            level: A2
            text:
              en: ["An adjective with one form for both genders adds ", { term: -mente }, " as it is:"]
              es: ["Un adjetivo con una sola forma para los dos géneros añade ", { term: -mente }, " sin cambios:"]
              uk: ["Прикметник з однією формою для обох родів додає ", { term: "-mente" }, " без змін:"]
            ex: { examples: [{ mapping: [fácil, { target: fácilmente }] }, { mapping: [feliz, { target: felizmente }] }] }
          - type: rule
            level: A2
            text:
              en: "The adjective keeps its written accent:"
              es: "El adjetivo mantiene su tilde:"
              uk: "Прикметник зберігає свій знак наголосу:"
            ex: { mapping: [rápida, { target: rápidamente }] }
          - type: rule
            level: A2
            text:
              en: ["With two such adverbs in a row, only the last takes ", { term: -mente }, ":"]
              es: ["Con dos de estos adverbios seguidos, solo el último lleva ", { term: -mente }, ":"]
              uk: ["Коли два такі прислівники стоять поряд, ", { term: "-mente" }, " має лише останній:"]
            ex: ["Habla ", { target: clara y lentamente }, "."]
            tr: { en: She speaks clearly and slowly., uk: "Вона говорить чітко й повільно." }
          - type: note
            level: A2
            text:
              en: ["In everyday speech, some adjectives work as adverbs too: ", { term: rápido }, ", ", { term: claro }, ", ", { term: alto }, "."]
              es: ["En el habla diaria, algunos adjetivos funcionan también como adverbios: ", { term: rápido }, ", ", { term: claro }, ", ", { term: alto }, "."]
              uk: ["У повсякденному мовленні деякі прикметники вживаються і як прислівники: ", { term: "rápido" }, ", ", { term: "claro" }, ", ", { term: "alto" }, "."]
            ex: ["Habla más ", { target: rápido }, "."]
            tr: { en: Speak faster., uk: "Говори швидше." }

  - title: { en: "Use: place and time", es: "Uso: lugar y tiempo", uk: "Вживання: місце і час" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, es: Adverbio, uk: "Прислівник" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, adverb: { target: aquí }, meaning: { en: here, es: el lugar de quien habla, uk: "тут" }, ex: ["Vivo ", { target: aquí }, "."], tr: { en: I live here., uk: "Я живу тут." } }
          - { level: A1, adverb: { target: ahí }, meaning: { en: "there, near you", es: cerca de quien escucha, uk: "там, біля тебе" }, ex: ["Deja el libro ", { target: ahí }, "."], tr: { en: Leave the book there., uk: "Залиш книжку там." } }
          - { level: A1, adverb: { target: allí }, meaning: { en: over there, es: lejos de los dos, uk: "он там" }, ex: [{ target: Allí }, " está el museo."], tr: { en: The museum is over there., uk: "Музей он там." } }
          - { level: A1, variety: es-419, adverb: { target: acá }, meaning: { en: here, es: aquí, uk: "тут" }, ex: ["Mi casa está ", { target: acá }, "."], tr: { en: My house is here., uk: "Мій дім тут." } }
          - { level: A1, variety: es-419, adverb: { target: allá }, meaning: { en: over there, es: allí, uk: "он там" }, ex: [{ target: Allá }, " está el museo."], tr: { en: The museum is over there., uk: "Музей он там." } }
          - { level: A1, adverb: { target: hoy }, meaning: { en: today, es: este día, uk: "сьогодні" }, ex: [{ target: Hoy }, " es lunes."], tr: { en: Today is Monday., uk: "Сьогодні понеділок." } }
          - { level: A1, adverb: { target: mañana }, meaning: { en: tomorrow, es: el día después de hoy, uk: "завтра" }, ex: [{ target: Mañana }, " voy al médico."], tr: { en: "Tomorrow I'm going to the doctor.", uk: "Завтра я йду до лікаря." } }
          - { level: A1, adverb: { target: ahora }, meaning: { en: now, es: en este momento, uk: "зараз" }, ex: [{ target: Ahora }, " no puedo."], tr: { en: "I can't now.", uk: "Зараз я не можу." } }
          - { level: A1, adverb: { target: después }, meaning: { en: "later, afterwards", es: más tarde, uk: "пізніше, потім" }, ex: ["Te llamo ", { target: después }, "."], tr: { en: "I'll call you later.", uk: "Я подзвоню тобі пізніше." } }
          - { level: A2, adverb: { target: ayer }, meaning: { en: yesterday, es: el día antes de hoy, uk: "учора" }, ex: [{ target: Ayer }, " fui al cine."], tr: { en: Yesterday I went to the cinema., uk: "Учора я ходив у кіно." } }
          - { level: A2, adverb: { target: anoche }, meaning: { en: last night, es: la noche de ayer, uk: "учора ввечері" }, ex: ["¿Saliste ", { target: anoche }, "?"], tr: { en: Did you go out last night?, uk: "Ти вчора ввечері кудись ходив?" } }
          - { level: A2, adverb: { target: anteayer }, meaning: { en: the day before yesterday, es: el día antes de ayer, uk: "позавчора" }, ex: [{ target: Anteayer }, " llovió mucho."], tr: { en: It rained a lot the day before yesterday., uk: "Позавчора йшов сильний дощ." } }
          - { level: A2, adverb: { target: ya }, meaning: { en: already, es: algo ha pasado, uk: "уже" }, ex: [{ target: Ya }, " es tarde."], tr: { en: "It's already late.", uk: "Уже пізно." } }
          - { level: A2, adverb: { target: todavía }, meaning: { en: still, es: algo sigue igual, uk: "досі" }, ex: [{ target: Todavía }, " vivo con mis padres."], tr: { en: I still live with my parents., uk: "Я досі живу з батьками." } }
          - { level: A2, adverb: { target: todavía no }, meaning: { en: not yet, es: algo no ha pasado aún, uk: "ще ні" }, ex: [{ target: Todavía no }, " lo sé."], tr: { en: "I don't know yet.", uk: "Я ще не знаю." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: aquí }, " is near the speaker, ", { term: ahí }, " near the listener, and ", { term: allí }, " far from both."]
              es: [{ term: aquí }, " está cerca de quien habla, ", { term: ahí }, ", cerca de quien escucha, y ", { term: allí }, ", lejos de los dos."]
              uk: [{ term: "aquí" }, " — біля того, хто говорить, ", { term: "ahí" }, " — біля того, хто слухає, а ", { term: "allí" }, " — далеко від обох."]
          - type: note
            level: A1
            text:
              en: [{ term: mañana }, " is tomorrow; ", { term: la mañana }, " is the morning:"]
              es: [{ term: mañana }, " es el día siguiente; ", { term: la mañana }, " es la parte del día:"]
              uk: [{ term: "mañana" }, " — це «завтра»; ", { term: "la mañana" }, " — «ранок»:"]
            ex: [{ target: Mañana }, " por ", { target: la mañana }, " trabajo."]
            tr: { en: Tomorrow morning I work., uk: "Завтра вранці я працюю." }
          - type: rule
            level: A2
            text:
              en: [{ term: desde }, " gives the point where something started:"]
              es: [{ term: desde }, " indica el momento en que algo empezó:"]
              uk: [{ term: "desde" }, " позначає момент, коли щось почалося:"]
            ex: { examples: [["Vivo aquí ", { target: desde }, " 2020."], ["Te espero ", { target: desde }, " ayer."]] }
            tr: { en: { examples: ["I've lived here since 2020.", "I've been waiting for you since yesterday."] }, uk: { examples: ["Я живу тут із 2020 року.", "Я чекаю на тебе з учорашнього дня."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: desde hace }, " gives how long something has lasted; the verb stays in the present, where English uses the present perfect:"]
              es: [{ term: desde hace }, " indica cuánto tiempo dura algo; el verbo va en presente:"]
              uk: [{ term: "desde hace" }, " позначає, скільки часу щось триває; дієслово стоїть у теперішньому часі, як і в українській:"]
            ex: ["Estudio español ", { target: desde hace }, " dos años."]
            tr: { en: "I've been studying Spanish for two years.", uk: "Я вивчаю іспанську вже два роки." }
          - type: rule
            level: A2
            text:
              en: ["The same idea with ", { term: hace }, " first: ", { pattern: [{ term: hace }, { slot: { en: length of time, es: tiempo, uk: ["Та сама думка з ", { term: "hace" }, " на початку: ", { pattern: [{ term: "hace" }, { slot: { en: "length of time", es: "tiempo", uk: "проміжок часу" } }, { term: "que" }, { slot: { en: "present", es: "presente", uk: "теперішній час" } }] }, ":"] } }, { term: que }, { slot: { en: present, es: presente, uk: "проміжок часу" } }] }, ":"]
              es: ["La misma idea con ", { term: hace }, " delante: ", { pattern: [{ term: hace }, { slot: { en: length of time, es: tiempo, uk: "проміжок часу" } }, { term: que }, { slot: { en: present, es: presente, uk: "теперішній час" } }] }, ":"]
              uk: "теперішній час"
            ex: [{ target: Hace }, " dos años ", { target: que }, " estudio español."]
            tr: { en: "I've been studying Spanish for two years.", uk: "Я вивчаю іспанську вже два роки." }
          - type: note
            level: A2
            text:
              en: [{ term: hace }, " with a length of time and a past verb means “ago”:"]
              es: [{ term: hace }, " con una cantidad de tiempo y un verbo en pasado indica cuánto tiempo pasó:"]
              uk: [{ term: "hace" }, " з проміжком часу й дієсловом у минулому часі означає «тому»:"]
            ex: ["Llegué ", { target: hace }, " una semana."]
            tr: { en: I arrived a week ago., uk: "Я приїхав тиждень тому." }

  - title: { en: "Frequency and position", es: "Frecuencia y posición", uk: "Частотність і місце" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, es: Adverbio, uk: "Прислівник" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, adverb: { target: siempre }, meaning: { en: always, es: todas las veces, uk: "завжди" }, ex: [{ target: Siempre }, " desayuno en casa."], tr: { en: I always have breakfast at home., uk: "Я завжди снідаю вдома." } }
          - { level: A1, adverb: { target: normalmente }, meaning: { en: usually, es: casi siempre, uk: "зазвичай" }, ex: [{ target: Normalmente }, " ceno a las ocho."], tr: { en: I usually have dinner at eight., uk: "Я зазвичай вечеряю о восьмій." } }
          - { level: A1, adverb: { target: todos los días }, meaning: { en: every day, es: cada día, uk: "щодня" }, ex: [{ target: Todos los días }, " camino al trabajo."], tr: { en: I walk to work every day., uk: "Я щодня ходжу на роботу пішки." } }
          - { level: A1, adverb: { target: a veces }, meaning: { en: sometimes, es: algunas veces, uk: "іноді" }, ex: [{ target: A veces }, " cocino."], tr: { en: Sometimes I cook., uk: "Іноді я готую." } }
          - { level: A2, adverb: { target: nunca }, meaning: { en: never, es: ninguna vez, uk: "ніколи" }, ex: [{ target: Nunca }, " como carne."], tr: { en: I never eat meat., uk: "Я ніколи не їм м’яса." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: nunca }, " goes before the verb, or after it with ", { term: "no" }, " before the verb:"]
              es: [{ term: nunca }, " va delante del verbo, o detrás con ", { term: "no" }, " delante del verbo:"]
              uk: [{ term: "nunca" }, " стоїть перед дієсловом або після нього, якщо перед дієсловом є ", { term: "no" }, ":"]
            ex: { examples: [[{ target: Nunca }, " como carne."], [{ target: "No" }, " como carne ", { target: nunca }, "."]] }
            tr: { en: { examples: [I never eat meat., I never eat meat.] }, uk: { examples: ["Я ніколи не їм м’яса.", "Я ніколи не їм м’яса."] } }
          - type: rule
            level: A1
            text:
              en: "Adverbs of manner usually go right after the verb:"
              es: "Los adverbios de modo suelen ir justo detrás del verbo:"
              uk: "Прислівники способу дії зазвичай стоять одразу після дієслова:"
            ex: ["Habla ", { target: bien }, " inglés."]
            tr: { en: She speaks English well., uk: "Вона добре розмовляє англійською." }
          - type: rule
            level: A1
            text:
              en: [{ term: también }, " agrees with a positive statement:"]
              es: [{ term: también }, " acompaña a una afirmación:"]
              uk: [{ term: "también" }, " погоджується зі ствердженням:"]
            ex: { exchange: ["Tengo hambre.", ["Yo ", { target: también }, "."]] }
            tr: { en: { exchange: ["I'm hungry.", Me too.] }, uk: { exchange: ["Я голодний.", "Я теж."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: tampoco }, " agrees with a negative statement:"]
              es: [{ term: tampoco }, " acompaña a una negación:"]
              uk: [{ term: "tampoco" }, " погоджується з запереченням:"]
            ex: { exchange: ["No tengo hambre.", ["Yo ", { target: tampoco }, "."]] }
            tr: { en: { exchange: ["I'm not hungry.", Me neither.] }, uk: { exchange: ["Я не голодний.", "Я теж ні."] } }

