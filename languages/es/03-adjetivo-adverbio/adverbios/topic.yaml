          - { level: B2, adverb: { target: repentinamente }, aspect: { es: "incoativo: el hecho empieza", en: "inchoative: the event begins", uk: "початковий: подія починається", pt: "incoativo: o fato começa", fr: "inchoatif : le fait commence", de: "inchoativ: der Sachverhalt beginnt", it: "incoativo: il fatto inizia", pl: "inchoatywny: zdarzenie się zaczyna", tr: "başlangıç bildiren: olay başlar", id: "inkoatif: peristiwa dimulai", vi: "chỉ sự bắt đầu: sự việc bắt đầu" }, ex: [{ target: Repentinamente }, " empezó a llover."], tr: { en: "Suddenly it started to rain.", uk: "Раптово пішов дощ.", pt: "De repente começou a chover.", fr: "Soudain, il s’est mis à pleuvoir.", de: "Plötzlich begann es zu regnen.", it: "All'improvviso ha cominciato a piovere.", pl: "Nagle zaczęło padać.", tr: "Birdenbire yağmur yağmaya başladı.", id: "Tiba-tiba mulai hujan.", vi: "Đột nhiên trời bắt đầu mưa." } }
          - { level: B2, adverb: { target: anteriormente a }, aspect: { es: ["anterioridad a otro hecho, con ", { term: a }], en: ["occurring before another event, with ", { term: "a" }], uk: ["передує іншій події, з ", { term: "a" }], pt: ["anterioridade a outro fato, com ", { term: "a" }], fr: ["antériorité par rapport à un autre fait, avec ", { term: "a" }], de: ["Vorzeitigkeit gegenüber einem anderen Sachverhalt, mit ", { term: "a" }], it: ["anteriorità rispetto a un altro fatto, con ", { term: "a" }], pl: ["uprzedniość wobec innego zdarzenia, z ", { term: "a" }], tr: ["başka bir olaydan önce gelme, ", { term: "a" }, " ile"], id: ["mendahului peristiwa lain, dengan ", { term: "a" }], vi: ["xảy ra trước một sự việc khác, đi với ", { term: "a" }] }, ex: ["Eso ocurrió ", { target: anteriormente a }, " la reforma."], tr: { en: "That happened before the reform.", uk: "Це сталося до реформи.", pt: "Isso aconteceu anteriormente à reforma.", fr: "Cela s’est produit avant la réforme.", de: "Das geschah vor der Reform.", it: "Ciò è avvenuto prima della riforma.", pl: "To się stało przed reformą.", tr: "Bu, reformdan önce oldu.", id: "Hal itu terjadi sebelum reformasi.", vi: "Chuyện đó xảy ra trước cuộc cải cách." } }
          - { level: B2, adverb: { alternatives: [{ target: muy recientemente }, { target: poco antes }] }, aspect: { es: "con palabra de grado", en: "with a degree word", uk: "зі словом, що виражає ступінь", pt: "com palavra de grau", fr: "avec un mot de degré", de: "mit einem Gradwort", it: "con una parola di grado", pl: "ze słowem określającym stopień", tr: "derece sözcüğüyle", id: "dengan kata penanda tingkat", vi: "đi với từ chỉ mức độ" }, ex: { examples: [[{ target: Muy recientemente }, " cambiaron las normas."], ["Llegó ", { target: poco antes }, " de la cena."]] }, tr: { en: { examples: ["The rules changed very recently.", "He arrived shortly before dinner."] }, uk: { examples: ["Правила змінилися зовсім недавно.", "Він прийшов незадовго до вечері."] }, pt: { examples: ["As normas mudaram muito recentemente.", "Ele chegou pouco antes do jantar."] }, fr: { examples: ["Les règles ont changé très récemment.", "Il est arrivé peu avant le dîner."] }, de: { examples: ["Die Regeln haben sich ganz kürzlich geändert.", "Er kam kurz vor dem Abendessen an."] }, it: { examples: ["Le norme sono cambiate molto di recente.", "È arrivato poco prima di cena."] }, pl: { examples: ["Zasady zmieniły się całkiem niedawno.", "Przyszedł tuż przed kolacją."] }, tr: { examples: ["Kurallar çok yakın zamanda değişti.", "Akşam yemeğinden az önce geldi."] }, id: { examples: ["Aturannya baru saja berubah.", "Dia tiba sesaat sebelum makan malam."] }, vi: { examples: ["Quy định mới thay đổi rất gần đây.", "Anh ấy đến ngay trước bữa tối."] } } }
