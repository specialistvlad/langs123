summary:
  lead:
    en: ["Adverbs say how, when, where and how much: ", { term: rápidamente }, ", ", { term: siempre }, ", ", { term: aquí }, ", ", { term: muy }, "; many end in ", { term: -mente }, "."]
    es: ["Los adverbios dicen cómo, cuándo, dónde y cuánto: ", { term: rápidamente }, ", ", { term: siempre }, ", ", { term: aquí }, ", ", { term: muy }, "; muchos terminan en ", { term: -mente }, "."]
    uk: ["Прислівники вказують, як, коли, де і наскільки: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; багато з них закінчуються на ", { term: "-mente" }, "."]
    pt: ["Os advérbios dizem como, quando, onde e quanto: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; muitos terminam em ", { term: "-mente" }, "."]
    fr: ["Les adverbes disent comment, quand, où et combien : ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, " ; beaucoup se terminent en ", { term: "-mente" }, "."]
    de: ["Adverbien sagen, wie, wann, wo und wie viel: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; viele enden auf ", { term: "-mente" }, "."]
    it: ["Gli avverbi dicono come, quando, dove e quanto: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; molti terminano in ", { term: "-mente" }, "."]
    pl: ["Przysłówki mówią, jak, kiedy, gdzie i ile: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; wiele z nich kończy się na ", { term: "-mente" }, "."]
    tr: ["Zarflar nasıl, ne zaman, nerede ve ne kadar sorularına yanıt verir: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; birçoğu ", { term: "-mente" }, " ile biter."]
    id: ["Kata keterangan menjelaskan bagaimana, kapan, di mana, dan seberapa banyak: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; banyak yang berakhiran ", { term: "-mente" }, "."]
    vi: ["Trạng từ cho biết như thế nào, khi nào, ở đâu và bao nhiêu: ", { term: "rápidamente" }, ", ", { term: "siempre" }, ", ", { term: "aquí" }, ", ", { term: "muy" }, "; nhiều trạng từ tận cùng bằng ", { term: "-mente" }, "."]
  rule:
    en: ["Before an adjective comes ", { term: muy }, ", and after a verb, ", { term: mucho }, ":"]
    es: ["Delante de un adjetivo va ", { term: muy }, ", y detrás de un verbo, ", { term: mucho }, ":"]
    uk: ["Перед прикметником вживається ", { term: "muy" }, ", а після дієслова — ", { term: "mucho" }, ":"]
    pt: ["Antes de um adjetivo vem ", { term: "muy" }, ", e depois de um verbo, ", { term: "mucho" }, ":"]
    fr: ["Devant un adjectif, on met ", { term: "muy" }, ", et après un verbe, ", { term: "mucho" }, " :"]
    de: ["Vor einem Adjektiv steht ", { term: "muy" }, ", nach einem Verb ", { term: "mucho" }, ":"]
    it: ["Davanti a un aggettivo va ", { term: "muy" }, ", dopo un verbo va ", { term: "mucho" }, ":"]
    pl: ["Przed przymiotnikiem stoi ", { term: "muy" }, ", a po czasowniku — ", { term: "mucho" }, ":"]
    tr: ["Sıfattan önce ", { term: "muy" }, ", fiilden sonra ", { term: "mucho" }, " gelir:"]
    id: ["Di depan kata sifat dipakai ", { term: "muy" }, ", dan sesudah kata kerja dipakai ", { term: "mucho" }, ":"]
    vi: ["Trước tính từ dùng ", { term: "muy" }, ", sau động từ dùng ", { term: "mucho" }, ":"]
  ex: { examples: [["Es ", { target: muy }, " caro."], ["Trabajo ", { target: mucho }, "."]] }

