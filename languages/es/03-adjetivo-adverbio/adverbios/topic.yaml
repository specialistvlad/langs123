            fr: [{ term: "ya" }, " : déjà ; ", { term: "todavía" }, " : encore ; ", { term: "todavía no" }, " : pas encore"]
            de: [{ term: "ya" }, ": schon; ", { term: "todavía" }, ": noch; ", { term: "todavía no" }, ": noch nicht"]
            it: [{ term: "ya" }, ": già; ", { term: "todavía" }, ": ancora; ", { term: "todavía no" }, ": non ancora"]
            pl: [{ term: "ya" }, ": już; ", { term: "todavía" }, ": jeszcze, wciąż; ", { term: "todavía no" }, ": jeszcze nie"]
            tr: [{ term: "ya" }, ": çoktan, artık; ", { term: "todavía" }, ": hâlâ; ", { term: "todavía no" }, ": henüz değil"]
            id: [{ term: "ya" }, ": sudah; ", { term: "todavía" }, ": masih; ", { term: "todavía no" }, ": belum"]
            vi: [{ term: "ya" }, ": đã, rồi; ", { term: "todavía" }, ": vẫn; ", { term: "todavía no" }, ": chưa"]
          ex: [{ target: Todavía }, " vivo con mis padres."]
          tr: { en: I still live with my parents., uk: "Я досі живу з батьками.", pt: "Ainda moro com meus pais.", fr: "J’habite encore chez mes parents.", de: "Ich wohne noch bei meinen Eltern.", it: "Vivo ancora con i miei genitori.", pl: "Wciąż mieszkam z rodzicami.", tr: "Hâlâ ailemle yaşıyorum.", id: "Saya masih tinggal bersama orang tua saya.", vi: "Tôi vẫn sống với bố mẹ." }
        - level: B2
          point: { es: Valoración, en: "Evaluation", uk: "Оцінка", pt: "Avaliação", fr: "Appréciation", de: "Bewertung", it: "Valutazione", pl: "Ocena", tr: "Değerlendirme", id: "Penilaian", vi: "Đánh giá" }
          rule:
            es: ["un adverbio en ", { term: -mente }, " va aparte, entre comas, y valora todo el hecho"]
            en: ["an adverb in ", { term: "-mente" }, " stands apart, between commas, and judges the whole event"]
            uk: ["прислівник на ", { term: "-mente" }, " стоїть окремо, між комами, і оцінює всю подію"]
            pt: ["um advérbio em ", { term: "-mente" }, " fica à parte, entre vírgulas, e avalia todo o fato"]
            fr: ["un adverbe en ", { term: "-mente" }, " se place à part, entre virgules, et juge l’ensemble du fait"]
            de: ["ein Adverb auf ", { term: "-mente" }, " steht abgesetzt, zwischen Kommas, und bewertet den ganzen Sachverhalt"]
            it: ["un avverbio in ", { term: "-mente" }, " sta a parte, tra virgole, e valuta l'intero fatto"]
            pl: ["przysłówek na ", { term: "-mente" }, " stoi osobno, między przecinkami, i ocenia cały fakt"]
            tr: [{ term: "-mente" }, " ile biten zarf virgüllerle ayrı durur ve olayın tamamını değerlendirir"]
            id: ["kata keterangan berakhiran ", { term: "-mente" }, " berdiri terpisah, di antara koma, dan menilai seluruh peristiwa"]
            vi: ["trạng từ tận cùng bằng ", { term: "-mente" }, " đứng riêng, giữa hai dấu phẩy, và đánh giá cả sự việc"]
          ex: [{ target: Afortunadamente }, ", nadie salió herido."]
          tr: { en: "Fortunately, nobody was hurt.", uk: "На щастя, ніхто не постраждав.", pt: "Felizmente, ninguém saiu ferido.", fr: "Heureusement, personne n’a été blessé.", de: "Zum Glück wurde niemand verletzt.", it: "Per fortuna, nessuno è rimasto ferito.", pl: "Na szczęście nikt nie został ranny.", tr: "Neyse ki kimse yaralanmadı.", id: "Untungnya, tidak ada yang terluka.", vi: "May mắn là không ai bị thương." }
        - level: B2
          point: probablemente
          rule:
            es: "expresa duda; admite el subjuntivo imperfecto o pluscuamperfecto"
            en: "expresses doubt; allows the imperfect or past perfect subjunctive"
            uk: "виражає сумнів; допускає імперфект або плюсквамперфект суб’юнктива"
            pt: "expressa dúvida; admite o imperfeito ou o mais-que-perfeito do subjuntivo"
            fr: "exprime le doute ; admet l’imparfait ou le plus-que-parfait du subjonctif"
            de: "drückt Zweifel aus; lässt den Konjunktiv im Imperfecto oder im Plusquamperfekt zu"
            it: "esprime dubbio; ammette l'imperfetto o il trapassato del congiuntivo"
            pl: "wyraża wątpliwość; dopuszcza imperfecto lub pluscuamperfecto trybu łączącego"
            tr: "şüphe bildirir; dilek kipinin imperfecto veya pluscuamperfecto biçimini alabilir"
            id: "menyatakan keraguan; boleh diikuti subjungtif imperfecto atau pluscuamperfecto"
            vi: "diễn đạt sự nghi ngờ; cho phép thức giả định ở imperfecto hoặc quá khứ hoàn thành"
          ex: [{ target: Probablemente }, " no hubiera venido sin ti."]
          tr: { en: "I probably wouldn't have come without you.", uk: "Мабуть, я б не прийшов без тебе.", pt: "Provavelmente eu não teria vindo sem você.", fr: "Je ne serais probablement pas venu sans toi.", de: "Wahrscheinlich wäre ich ohne dich nicht gekommen.", it: "Probabilmente non sarei venuto senza di te.", pl: "Prawdopodobnie nie przyszedłbym bez ciebie.", tr: "Muhtemelen sensiz gelmezdim.", id: "Mungkin saya tidak akan datang tanpa kamu.", vi: "Có lẽ tôi đã không đến nếu không có bạn." }
        - level: C1
          point: técnicamente
          rule:
            es: "fija el punto de vista de lo que sigue"
            en: "sets the point of view of what follows"
            uk: "задає точку зору того, що йде далі"
            pt: "fixa o ponto de vista do que vem a seguir"
            fr: "fixe le point de vue de ce qui suit"
            de: "legt den Blickwinkel für das Folgende fest"
            it: "fissa il punto di vista di ciò che segue"
            pl: "ustala punkt widzenia tego, co następuje"
            tr: "sonrakinin bakış açısını belirler"
            id: "menetapkan sudut pandang untuk hal yang mengikutinya"
            vi: "xác định quan điểm cho phần theo sau"
          ex: [{ target: Técnicamente }, ", el contrato ya está firmado."]
          tr: { en: "Technically, the contract is already signed.", uk: "Технічно договір уже підписано.", pt: "Tecnicamente, o contrato já está assinado.", fr: "Techniquement, le contrat est déjà signé.", de: "Technisch gesehen ist der Vertrag schon unterschrieben.", it: "Tecnicamente, il contratto è già firmato.", pl: "Technicznie umowa jest już podpisana.", tr: "Teknik olarak sözleşme zaten imzalandı.", id: "Secara teknis, kontraknya sudah ditandatangani.", vi: "Về mặt kỹ thuật, hợp đồng đã được ký." }
        - level: C2
          point: { pattern: ["no", { slot: adverb }] }
          rule:
            es: "la negación puede recaer solo en el adverbio"
            en: "the negation can fall on the adverb alone"
            uk: "заперечення може стосуватися лише прислівника"
            pt: "a negação pode recair só sobre o advérbio"
            fr: "la négation peut porter sur l’adverbe seul"
            de: "die Verneinung kann sich allein auf das Adverb beziehen"
            it: "la negazione può riguardare solo l'avverbio"
            pl: "przeczenie może dotyczyć samego przysłówka"
            tr: "olumsuzluk yalnızca zarfı kapsayabilir"
            id: "negasi dapat mengenai kata keterangan saja"
            vi: "phủ định có thể chỉ tác động lên trạng từ"
          ex: ["No ", { target: necesariamente }, " tiene que ser el lunes."]
          tr: { en: "It doesn't necessarily have to be Monday.", uk: "Це не обов’язково має бути понеділок.", pt: "Não precisa ser necessariamente na segunda-feira.", fr: "Ce ne doit pas nécessairement être lundi.", de: "Es muss nicht unbedingt Montag sein.", it: "Non deve essere necessariamente lunedì.", pl: "To niekoniecznie musi być poniedziałek.", tr: "Pazartesi olması şart değil.", id: "Belum tentu harus hari Senin.", vi: "Không nhất thiết phải là thứ Hai." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "the adjective keeps its written accent before -mente"
            es: "el adjetivo mantiene su tilde delante de -mente"
            uk: "прикметник зберігає свій знак наголосу перед -mente"
            pt: "o adjetivo mantém o acento antes de -mente"
            fr: "l’adjectif garde son accent écrit devant -mente"
            de: "das Adjektiv behält seinen Akzent vor -mente"
            it: "l'aggettivo mantiene l'accento scritto davanti a -mente"
            pl: "przymiotnik zachowuje akcent pisany przed -mente"
            tr: "sıfat, -mente öncesinde vurgu işaretini korur"
            id: "kata sifat tetap memakai tanda aksen sebelum -mente"
            vi: "tính từ giữ dấu sắc trước -mente"
          ex: { mapping: [rápida, { target: rápidamente }] }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            es: [{ term: muy }, " no acompaña a los adverbios de frecuencia definida"]
            en: [{ term: "muy" }, " does not go with adverbs of definite frequency"]
            uk: [{ term: "muy" }, " не вживається з прислівниками визначеної частотності"]
            pt: [{ term: "muy" }, " não acompanha os advérbios de frequência definida"]
            fr: [{ term: "muy" }, " ne s’emploie pas avec les adverbes de fréquence définie"]
            de: [{ term: "muy" }, " steht nicht bei Adverbien der bestimmten Häufigkeit"]
            it: [{ term: "muy" }, " non accompagna gli avverbi di frequenza definita"]
            pl: [{ term: "muy" }, " nie łączy się z przysłówkami określonej częstotliwości"]
            tr: [{ term: "muy" }, ", belirli sıklık zarflarıyla kullanılmaz"]
            id: [{ term: "muy" }, " tidak dipakai dengan kata keterangan frekuensi tertentu"]
            vi: [{ term: "muy" }, " không đi với trạng từ chỉ tần suất xác định"]
          ex: ["Riego las plantas ", { target: diariamente }, "."]
          tr: { en: "I water the plants daily.", uk: "Я щодня поливаю рослини.", pt: "Rego as plantas diariamente.", fr: "J’arrose les plantes tous les jours.", de: "Ich gieße die Pflanzen täglich.", it: "Annaffio le piante ogni giorno.", pl: "Codziennie podlewam rośliny.", tr: "Bitkileri her gün sularım.", id: "Saya menyiram tanaman setiap hari.", vi: "Tôi tưới cây hằng ngày." }

sections:
  - title: { en: "Use: how and how much", es: "Uso: cómo y cuánto", uk: "Вживання: як і скільки", pt: "Uso: como e quanto", fr: "Emploi : comment et combien", de: "Gebrauch: wie und wie viel", it: "Uso: come e quanto", pl: "Użycie: jak i ile", tr: "Kullanım: nasıl ve ne kadar", id: "Penggunaan: bagaimana dan seberapa banyak", vi: "Cách dùng: như thế nào và bao nhiêu" }
    role: use
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb, es: Adverbio, uk: "Прислівник", pt: "Advérbio", fr: "Adverbe", de: "Adverb", it: "Avverbio", pl: "Przysłówek", tr: "Zarf", id: "Kata keterangan", vi: "Trạng từ" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, adverb: { target: bien }, use: { en: ["well: the adverb of ", { term: bueno }], es: ["el adverbio de ", { term: bueno }], uk: ["добре: прислівник від ", { term: "bueno" }], pt: ["bem: o advérbio de ", { term: "bueno" }], fr: ["bien : l’adverbe de ", { term: "bueno" }], de: ["gut: das Adverb zu ", { term: "bueno" }], it: ["bene: l'avverbio di ", { term: "bueno" }], pl: ["dobrze: przysłówek od ", { term: "bueno" }], tr: ["iyi: ", { term: "bueno" }, " sıfatının zarfı"], id: ["dengan baik: kata keterangan dari ", { term: "bueno" }], vi: ["tốt: trạng từ của ", { term: "bueno" }] }, ex: ["Cocinas muy ", { target: bien }, "."], tr: { en: You cook very well., uk: "Ти дуже добре готуєш.", pt: "Você cozinha muito bem.", fr: "Tu cuisines très bien.", de: "Du kochst sehr gut.", it: "Cucini molto bene.", pl: "Bardzo dobrze gotujesz.", tr: "Çok iyi yemek yapıyorsun.", id: "Kamu memasak dengan sangat baik.", vi: "Bạn nấu ăn rất giỏi." } }
          - { level: A1, adverb: { target: mal }, use: { en: ["badly: the adverb of ", { term: malo }], es: ["el adverbio de ", { term: malo }], uk: ["погано: прислівник від ", { term: "malo" }], pt: ["mal: o advérbio de ", { term: "malo" }], fr: ["mal : l’adverbe de ", { term: "malo" }], de: ["schlecht: das Adverb zu ", { term: "malo" }], it: ["male: l'avverbio di ", { term: "malo" }], pl: ["źle: przysłówek od ", { term: "malo" }], tr: ["kötü: ", { term: "malo" }, " sıfatının zarfı"], id: ["dengan buruk: kata keterangan dari ", { term: "malo" }], vi: ["tệ: trạng từ của ", { term: "malo" }] }, ex: ["Duermo ", { target: mal }, "."], tr: { en: I sleep badly., uk: "Я погано сплю.", pt: "Durmo mal.", fr: "Je dors mal.", de: "Ich schlafe schlecht.", it: "Dormo male.", pl: "Źle śpię.", tr: "Kötü uyuyorum.", id: "Saya tidur tidak nyenyak.", vi: "Tôi ngủ không ngon." } }
          - { level: A1, adverb: { target: muy }, use: { en: "very, before an adjective or an adverb", es: "delante de un adjetivo o de un adverbio", uk: "дуже, перед прикметником або прислівником", pt: "muito, antes de um adjetivo ou de um advérbio", fr: "très, devant un adjectif ou un adverbe", de: "sehr, vor einem Adjektiv oder Adverb", it: "molto, davanti a un aggettivo o a un avverbio", pl: "bardzo, przed przymiotnikiem lub przysłówkiem", tr: "çok, sıfattan veya zarftan önce", id: "sangat, di depan kata sifat atau kata keterangan", vi: "rất, trước tính từ hoặc trạng từ" }, ex: ["Estoy ", { target: muy }, " cansado."], tr: { en: "I'm very tired.", uk: "Я дуже втомився.", pt: "Estou muito cansado.", fr: "Je suis très fatigué.", de: "Ich bin sehr müde.", it: "Sono molto stanco.", pl: "Jestem bardzo zmęczony.", tr: "Çok yorgunum.", id: "Saya sangat lelah.", vi: "Tôi rất mệt." } }
          - { level: A1, adverb: { target: mucho }, use: { en: "a lot, after a verb", es: "en gran cantidad, detrás de un verbo", uk: "багато, після дієслова", pt: "muito, depois de um verbo", fr: "beaucoup, après un verbe", de: "viel, nach einem Verb", it: "molto, dopo un verbo", pl: "dużo, po czasowniku", tr: "çok, fiilden sonra", id: "banyak, sesudah kata kerja", vi: "nhiều, sau động từ" }, ex: ["Llueve ", { target: mucho }, "."], tr: { en: It rains a lot., uk: "Дощі йдуть часто й рясно.", pt: "Chove muito.", fr: "Il pleut beaucoup.", de: "Es regnet viel.", it: "Piove molto.", pl: "Pada dużo deszczu.", tr: "Çok yağmur yağıyor.", id: "Hujan turun dengan lebat.", vi: "Trời mưa nhiều." } }
          - { level: A1, adverb: { target: poco }, use: { en: "not much, after a verb", es: "en poca cantidad, detrás de un verbo", uk: "мало, після дієслова", pt: "pouco, depois de um verbo", fr: "peu, après un verbe", de: "wenig, nach einem Verb", it: "poco, dopo un verbo", pl: "mało, po czasowniku", tr: "az, fiilden sonra", id: "sedikit, sesudah kata kerja", vi: "ít, sau động từ" }, ex: ["Como ", { target: poco }, "."], tr: { en: "I don't eat much.", uk: "Я їм небагато.", pt: "Como pouco.", fr: "Je mange peu.", de: "Ich esse wenig.", it: "Mangio poco.", pl: "Jem mało.", tr: "Az yerim.", id: "Saya makan sedikit.", vi: "Tôi ăn ít." } }
          - { level: A1, adverb: { target: bastante }, use: { en: "quite, fairly", es: "en cantidad suficiente o algo alta", uk: "досить, доволі", pt: "bastante, razoavelmente", fr: "assez, plutôt", de: "ziemlich, ganz schön", it: "abbastanza, piuttosto", pl: "dość, całkiem", tr: "oldukça, epeyce", id: "cukup, lumayan", vi: "khá, tương đối" }, ex: ["Es ", { target: bastante }, " caro."], tr: { en: "It's quite expensive.", uk: "Це досить дорого.", pt: "É bastante caro.", fr: "C’est assez cher.", de: "Es ist ziemlich teuer.", it: "È abbastanza caro.", pl: "To dość drogie.", tr: "Oldukça pahalı.", id: "Ini cukup mahal.", vi: "Cái này khá đắt." } }
          - { level: A2, adverb: { target: demasiado }, use: { en: "too, too much", es: "más de lo necesario", uk: "занадто, надто багато", pt: "demais, excessivamente", fr: "trop", de: "zu, zu viel", it: "troppo", pl: "za, za dużo", tr: "fazla, çok fazla", id: "terlalu, terlalu banyak", vi: "quá, quá nhiều" }, ex: ["Hablas ", { target: demasiado }, "."], tr: { en: You talk too much., uk: "Ти говориш забагато.", pt: "Você fala demais.", fr: "Tu parles trop.", de: "Du redest zu viel.", it: "Parli troppo.", pl: "Za dużo mówisz.", tr: "Çok fazla konuşuyorsun.", id: "Kamu terlalu banyak bicara.", vi: "Bạn nói quá nhiều." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: muy }, " goes before an adjective or an adverb, and ", { term: mucho }, " after a verb:"]
              es: [{ term: muy }, " va delante de un adjetivo o de un adverbio, y ", { term: mucho }, ", detrás de un verbo:"]
              uk: [{ term: "muy" }, " стоїть перед прикметником або прислівником, а ", { term: "mucho" }, " — після дієслова:"]
              pt: [{ term: "muy" }, " vem antes de um adjetivo ou de um advérbio, e ", { term: "mucho" }, " depois de um verbo:"]
              fr: [{ term: "muy" }, " se place devant un adjectif ou un adverbe, et ", { term: "mucho" }, " après un verbe :"]
              de: [{ term: "muy" }, " steht vor einem Adjektiv oder Adverb und ", { term: "mucho" }, " nach einem Verb:"]
              it: [{ term: "muy" }, " va davanti a un aggettivo o a un avverbio, e ", { term: "mucho" }, " dopo un verbo:"]
              pl: [{ term: "muy" }, " stoi przed przymiotnikiem lub przysłówkiem, a ", { term: "mucho" }, " po czasowniku:"]
              tr: [{ term: "muy" }, " sıfattan veya zarftan önce, ", { term: "mucho" }, " ise fiilden sonra gelir:"]
              id: [{ term: "muy" }, " berada di depan kata sifat atau kata keterangan, dan ", { term: "mucho" }, " sesudah kata kerja:"]
              vi: [{ term: "muy" }, " đứng trước tính từ hoặc trạng từ, còn ", { term: "mucho" }, " đứng sau động từ:"]
            ex: { examples: [["Es ", { target: muy }, " rico."], ["Me gusta ", { target: mucho }, "."]] }
            tr: { en: { examples: ["It's very tasty.", I like it a lot.] }, uk: { examples: ["Це дуже смачно.", "Мені це дуже подобається."] }, pt: { examples: ["É muito gostoso.", "Eu gosto muito."] }, fr: { examples: ["C’est très bon.", "J’aime beaucoup."] }, de: { examples: ["Das schmeckt sehr gut.", "Es gefällt mir sehr."] }, it: { examples: ["È molto buono.", "Mi piace molto."] }, pl: { examples: ["To bardzo smaczne.", "Bardzo mi się podoba."] }, tr: { examples: ["Çok lezzetli.", "Çok hoşuma gidiyor."] }, id: { examples: ["Ini sangat enak.", "Saya sangat suka."] }, vi: { examples: ["Món này rất ngon.", "Tôi rất thích."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: mucho }, " after a verb never changes; before a noun it agrees with the noun:"]
              es: [{ term: mucho }, " detrás de un verbo no cambia; delante de un sustantivo concuerda con él:"]
              uk: [{ term: "mucho" }, " після дієслова ніколи не змінюється; перед іменником узгоджується з ним:"]
              pt: [{ term: "mucho" }, " depois de um verbo não muda; antes de um substantivo, concorda com ele:"]
              fr: [{ term: "mucho" }, " après un verbe ne change jamais ; devant un nom, il s’accorde avec lui :"]
              de: [{ term: "mucho" }, " nach einem Verb verändert sich nie; vor einem Nomen gleicht es sich ihm an:"]
              it: [{ term: "mucho" }, " dopo un verbo non cambia; davanti a un sostantivo concorda con esso:"]
              pl: [{ term: "mucho" }, " po czasowniku się nie zmienia; przed rzeczownikiem zgadza się z nim:"]
              tr: [{ term: "mucho" }, " fiilden sonra gelirse değişmez; isimden önce gelirse onunla uyum sağlar:"]
              id: [{ term: "mucho" }, " sesudah kata kerja tidak berubah; di depan kata benda, ia menyesuaikan diri dengan kata benda itu:"]
              vi: [{ term: "mucho" }, " sau động từ thì không thay đổi; trước danh từ thì hòa hợp với danh từ:"]
