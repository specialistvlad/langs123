              pt: [{ term: "bueno" }, " e ", { term: "malo" }, " perdem o -o antes de um substantivo masculino singular:"]
              fr: [{ term: "bueno" }, " et ", { term: "malo" }, " perdent le -o devant un nom masculin singulier :"]
              de: [{ term: "bueno" }, " und ", { term: "malo" }, " verlieren das -o vor einem maskulinen Nomen im Singular:"]
              it: [{ term: "bueno" }, " e ", { term: "malo" }, " perdono la -o davanti a un sostantivo maschile singolare:"]
