            tr: { en: { examples: [a great idea, a great country] }, uk: { examples: ["чудова ідея", "велика країна"] }, pt: { examples: ["uma grande ideia", "um grande país"] }, fr: { examples: ["une grande idée", "un grand pays"] }, de: { examples: ["eine großartige Idee", "ein großes Land"] }, it: { examples: ["una grande idea", "un grande paese"] }, pl: { examples: ["wspaniały pomysł", "wielki kraj"] }, tr: { examples: ["harika bir fikir", "büyük bir ülke"] }, id: { examples: ["ide yang hebat", "negara yang besar"] }, vi: { examples: ["một ý tưởng tuyệt vời", "một đất nước vĩ đại"] } }

