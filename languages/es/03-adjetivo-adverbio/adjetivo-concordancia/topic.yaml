            es: ["el plural es ", { term: -íes }]
          ex: { mapping: [carmesí, { target: carmesíes }] }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "the noun's gender decides, even when it ends in -a"
            es: "decide el género del sustantivo, aunque termine en -a"
            uk: "форму прикметника визначає рід іменника, навіть якщо він закінчується на -a"
            pt: "o gênero do substantivo decide, mesmo que ele termine em -a"
            fr: "le genre du nom décide, même s’il se termine en -a"
            de: "das Genus des Nomens entscheidet, auch wenn es auf -a endet"
            it: "decide il genere del sostantivo, anche se termina in -a"
            pl: "decyduje rodzaj rzeczownika, nawet gdy kończy się on na -a"
            tr: "isim -a ile bitse bile ismin cinsiyeti belirler"
            id: "gender kata benda yang menentukan, meskipun berakhiran -a"
            vi: "giống của danh từ quyết định, dù danh từ tận cùng bằng -a"
          ex: ["el mapa ", { target: nuevo }]
          tr: { en: the new map, uk: "нова мапа", pt: "o mapa novo", fr: "la nouvelle carte", de: "die neue Karte", it: "la nuova mappa", pl: "nowa mapa", tr: "yeni harita", id: "peta yang baru", vi: "bản đồ mới" }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "An adjective agrees with its noun in gender and number:"
              es: "El adjetivo concuerda con el sustantivo en género y número:"
              uk: "Прикметник узгоджується з іменником у роді й числі:"
              pt: "O adjetivo concorda com o substantivo em gênero e número:"
              fr: "L’adjectif s’accorde avec le nom en genre et en nombre :"
              de: "Das Adjektiv gleicht sich dem Nomen in Genus und Numerus an:"
              it: "L'aggettivo concorda con il sostantivo in genere e numero:"
              pl: "Przymiotnik zgadza się z rzeczownikiem w rodzaju i liczbie:"
              tr: "Sıfat, isimle cinsiyet ve sayıda uyum sağlar:"
              id: "Kata sifat menyesuaikan diri dengan kata benda dalam gender dan jumlah:"
              vi: "Tính từ hòa hợp với danh từ về giống và số:"
            ex: { examples: [["el gato ", { target: negro }], ["las gatas ", { target: negras }]] }
            tr: { en: { examples: [the black cat, the black cats] }, uk: { examples: ["чорний кіт", "чорні коти"] }, pt: { examples: ["o gato preto", "as gatas pretas"] }, fr: { examples: ["le chat noir", "les chattes noires"] }, de: { examples: ["der schwarze Kater", "die schwarzen Katzen"] }, it: { examples: ["il gatto nero", "le gatte nere"] }, pl: { examples: ["czarny kot", "czarne koty"] }, tr: { examples: ["kara kedi", "kara kediler"] }, id: { examples: ["kucing hitam", "kucing-kucing hitam"] }, vi: { examples: ["con mèo đen", "những con mèo đen"] } }
          - type: rule
            level: A1
            text:
              en: "Most adjectives go after the noun:"
              es: "La mayoría de los adjetivos van detrás del sustantivo:"
              uk: "Більшість прикметників стоїть після іменника:"
              pt: "A maioria dos adjetivos vem depois do substantivo:"
              fr: "La plupart des adjectifs se placent après le nom :"
              de: "Die meisten Adjektive stehen nach dem Nomen:"
              it: "La maggior parte degli aggettivi va dopo il sostantivo:"
              pl: "Większość przymiotników stoi po rzeczowniku:"
              tr: "Çoğu sıfat isimden sonra gelir:"
              id: "Kebanyakan kata sifat berada sesudah kata benda:"
              vi: "Phần lớn tính từ đứng sau danh từ:"
            ex: ["Tengo una casa ", { target: grande }, "."]
            tr: { en: I have a big house., uk: "У мене великий будинок.", pt: "Tenho uma casa grande.", fr: "J’ai une grande maison.", de: "Ich habe ein großes Haus.", it: "Ho una casa grande.", pl: "Mam duży dom.", tr: "Büyük bir evim var.", id: "Saya punya rumah besar.", vi: "Tôi có một ngôi nhà lớn." }
          - type: note
            level: A1
            text:
              en: ["The gender of the noun decides the form: see ", { link: Gender, to: es.sustantivo-determinantes.genero }, "."]
              es: ["El género del sustantivo decide la forma: ver ", { link: El género, to: es.sustantivo-determinantes.genero }, "."]
              uk: ["Форму визначає рід іменника: див. ", { link: "Рід", to: "es.sustantivo-determinantes.genero" }, "."]
              pt: ["O gênero do substantivo decide a forma: veja ", { link: "O gênero", to: "es.sustantivo-determinantes.genero" }, "."]
              fr: ["Le genre du nom décide de la forme : voir ", { link: "Le genre", to: "es.sustantivo-determinantes.genero" }, "."]
              de: ["Das Genus des Nomens bestimmt die Form: siehe ", { link: "Das Genus", to: "es.sustantivo-determinantes.genero" }, "."]
              it: ["Il genere del sostantivo decide la forma: vedi ", { link: "Il genere", to: "es.sustantivo-determinantes.genero" }, "."]
              pl: ["O formie decyduje rodzaj rzeczownika: zob. ", { link: "Rodzaj", to: "es.sustantivo-determinantes.genero" }, "."]
              tr: ["Biçimi isimin cinsiyeti belirler: bkz. ", { link: "Cinsiyet", to: "es.sustantivo-determinantes.genero" }, "."]
              id: ["Gender kata benda menentukan bentuknya: lihat ", { link: "Gender", to: "es.sustantivo-determinantes.genero" }, "."]
              vi: ["Giống của danh từ quyết định dạng của tính từ: xem ", { link: "Giống", to: "es.sustantivo-determinantes.genero" }, "."]

  - title: { en: "Form: agreement", es: "Forma: la concordancia", uk: "Форма: узгодження", pt: "Forma: a concordância", fr: "Forme : l’accord", de: "Form: die Angleichung", it: "Forma: la concordanza", pl: "Forma: zgodność", tr: "Biçim: uyum", id: "Bentuk: kesesuaian", vi: "Dạng: sự hòa hợp" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: type, label: { en: Adjective, es: Adjetivo, uk: "Прикметник", pt: "Adjetivo", fr: "Adjectif", de: "Adjektiv", it: "Aggettivo", pl: "Przymiotnik", tr: "Sıfat", id: "Kata sifat", vi: "Tính từ" } }
          - { key: sg, label: { en: Singular, es: Singular, uk: "Однина", pt: "Singular", fr: "Singulier", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: "Множина", pt: "Plural", fr: "Pluriel", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }, features: { number: pl } }
        rows:
          - { level: A1, features: { gender: masc }, type: { en: "-o, masculine", es: "-o, masculino", uk: "-o, чоловічий рід", pt: "-o, masculino", fr: "-o, masculin", de: "-o, maskulin", it: "-o, maschile", pl: "-o, rodzaj męski", tr: "-o, eril", id: "-o, maskulin", vi: "-o, giống đực" }, sg: { target: alto }, pl: { target: altos } }
          - { level: A1, features: { gender: fem }, type: { en: "-o, feminine", es: "-o, femenino", uk: "-o, жіночий рід", pt: "-o, feminino", fr: "-o, féminin", de: "-o, feminin", it: "-o, femminile", pl: "-o, rodzaj żeński", tr: "-o, dişil", id: "-o, feminin", vi: "-o, giống cái" }, sg: { target: alta }, pl: { target: altas } }
          - { level: A1, features: [{ gender: masc }, { gender: fem }], type: { en: "-e, both genders", es: "-e, los dos géneros", uk: "-e, обидва роди", pt: "-e, os dois gêneros", fr: "-e, les deux genres", de: "-e, beide Genera", it: "-e, i due generi", pl: "-e, oba rodzaje", tr: "-e, her iki cinsiyet", id: "-e, kedua gender", vi: "-e, cả hai giống" }, sg: { target: grande }, pl: { target: grandes } }
          - { level: A1, features: [{ gender: masc }, { gender: fem }], type: { en: "consonant, both genders", es: "consonante, los dos géneros", uk: "приголосна, обидва роди", pt: "consoante, os dois gêneros", fr: "consonne, les deux genres", de: "Konsonant, beide Genera", it: "consonante, i due generi", pl: "spółgłoska, oba rodzaje", tr: "ünsüz, her iki cinsiyet", id: "konsonan, kedua gender", vi: "phụ âm, cả hai giống" }, sg: { target: azul }, pl: { target: azules } }
          - { level: A2, features: [{ gender: masc }, { gender: fem }], type: { en: "-z, both genders", es: "-z, los dos géneros", uk: "-z, обидва роди", pt: "-z, os dois gêneros", fr: "-z, les deux genres", de: "-z, beide Genera", it: "-z, i due generi", pl: "-z, oba rodzaje", tr: "-z, her iki cinsiyet", id: "-z, kedua gender", vi: "-z, cả hai giống" }, sg: { target: feliz }, pl: { target: felices } }
          - { level: A1, features: { gender: masc }, type: { en: "nationality, masculine", es: "nacionalidad, masculino", uk: "національність, чоловічий рід", pt: "nacionalidade, masculino", fr: "nationalité, masculin", de: "Nationalität, maskulin", it: "nazionalità, maschile", pl: "narodowość, rodzaj męski", tr: "uyruk, eril", id: "kewarganegaraan, maskulin", vi: "quốc tịch, giống đực" }, sg: { target: español }, pl: { target: españoles } }
          - { level: A1, features: { gender: fem }, type: { en: "nationality, feminine", es: "nacionalidad, femenino", uk: "національність, жіночий рід", pt: "nacionalidade, feminino", fr: "nationalité, féminin", de: "Nationalität, feminin", it: "nazionalità, femminile", pl: "narodowość, rodzaj żeński", tr: "uyruk, dişil", id: "kewarganegaraan, feminin", vi: "quốc tịch, giống cái" }, sg: { target: española }, pl: { target: españolas } }
          - { level: B2, features: [{ gender: masc }, { gender: fem }], type: { es: "-a, los dos géneros" }, sg: { alternatives: [{ target: hipócrita }, { target: homicida }, { target: cosmopolita }] }, pl: { alternatives: [{ target: hipócritas }, { target: homicidas }, { target: cosmopolitas }] } }
          - { level: C1, features: [{ gender: masc }, { gender: fem }], type: { es: "color con sustantivo, invariable" }, sg: { alternatives: [{ target: verde botella }, { target: gris perla }, { target: azul turquesa }] }, pl: { alternatives: [{ target: verde botella }, { target: gris perla }, { target: azul turquesa }] } }
          - { level: C2, features: [{ gender: masc }, { gender: fem }], type: { es: "-ú, los dos géneros" }, sg: { target: bantú }, pl: { alternatives: [{ target: bantúes }, { target: bantús }] } }
          - { level: C2, features: [{ gender: masc }, { gender: fem }], type: { es: "-es, invariable" }, sg: { alternatives: [{ target: isósceles }, { target: rubiales }] }, pl: { alternatives: [{ target: isósceles }, { target: rubiales }] } }
          - { level: C2, features: [{ gender: masc }, { gender: fem }], type: { es: "-í, los dos géneros" }, sg: { alternatives: [{ target: carmesí }, { target: muladí }] }, pl: { alternatives: [{ target: carmesíes }, { target: muladíes }] } }
          - { level: C2, variety: es-419, features: { gender: masc }, type: { es: "-ista, masculino coloquial en -o" }, sg: { alternatives: [{ target: bromisto }, { target: cuentisto }] }, pl: { alternatives: [{ target: bromistos }, { target: cuentistos }] } }
      - type: usage
        columns:
          - { key: point, label: { es: Punto } }
          - { key: rule, label: { es: Regla } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            point: { es: ["Color aproximado: ", { term: -izo }, ", ", { term: -ento }, ", ", { term: -áceo }] }
            rule: { es: concuerda como un adjetivo en -o }
            ex: { examples: [["una pared ", { target: rojiza }], ["unos guantes ", { target: grisáceos }], ["hojas ", { target: amarillentas }]] }
          - level: B2
            point: { es: Predicativo del sujeto }
            rule: { es: concuerda con el sujeto }
            ex: ["Ana llegó ", { target: sudorosa }, "."]
          - level: B2
            point: { es: Predicativo del objeto }
            rule: { es: concuerda con el objeto directo }
            ex: ["Dejó ", { target: limpia }, " la cocina."]
          - level: C2
            point: { es: Color compuesto }
            rule: { es: se escribe en una palabra y concuerda como un adjetivo en -o }
            ex: { examples: [["una camiseta ", { target: rojiblanca }], ["unas banderas ", { target: blanquinegras }]] }
          - level: C2
            point: { es: Gentilicio poco frecuente en -o }
            rule: { es: tiene las cuatro formas del adjetivo en -o }
            ex: { examples: [["la ciudad ", { target: pucelana }], ["los vecinos ", { target: tinerfeños }]] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Adjectives in ", { term: -o }, " have four forms: ", { alternatives: [{ term: alto }, { term: alta }, { term: altos }, { term: altas }] }, "."]
              es: ["Los adjetivos en ", { term: -o }, " tienen cuatro formas: ", { alternatives: [{ term: alto }, { term: alta }, { term: altos }, { term: altas }] }, "."]
              uk: ["Прикметники на ", { term: "-o" }, " мають чотири форми: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              pt: ["Os adjetivos em ", { term: "-o" }, " têm quatro formas: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              fr: ["Les adjectifs en ", { term: "-o" }, " ont quatre formes : ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              de: ["Adjektive auf ", { term: "-o" }, " haben vier Formen: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              it: ["Gli aggettivi in ", { term: "-o" }, " hanno quattro forme: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              pl: ["Przymiotniki z końcówką ", { term: "-o" }, " mają cztery formy: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              tr: [{ term: "-o" }, " ile biten sıfatların dört biçimi vardır: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              id: ["Kata sifat berakhiran ", { term: "-o" }, " punya empat bentuk: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
              vi: ["Tính từ tận cùng bằng ", { term: "-o" }, " có bốn dạng: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
          - type: rule
            level: A1
            text:
              en: "Adjectives in -e or a consonant have one form for both genders:"
              es: "Los adjetivos en -e o en consonante tienen una sola forma para los dos géneros:"
              uk: "Прикметники на -e або на приголосну мають одну форму для обох родів:"
              pt: "Os adjetivos em -e ou em consoante têm uma só forma para os dois gêneros:"
              fr: "Les adjectifs en -e ou en consonne ont une seule forme pour les deux genres :"
              de: "Adjektive auf -e oder auf Konsonant haben für beide Genera nur eine Form:"
              it: "Gli aggettivi in -e o in consonante hanno una sola forma per i due generi:"
              pl: "Przymiotniki zakończone na -e lub na spółgłoskę mają jedną formę dla obu rodzajów:"
              tr: "-e veya ünsüzle biten sıfatların iki cinsiyet için tek biçimi vardır:"
              id: "Kata sifat berakhiran -e atau konsonan punya satu bentuk untuk kedua gender:"
              vi: "Tính từ tận cùng bằng -e hoặc phụ âm có một dạng chung cho cả hai giống:"
            ex: { examples: [["un examen ", { target: fácil }], ["una pregunta ", { target: fácil }]] }
            tr: { en: { examples: [an easy exam, an easy question] }, uk: { examples: ["легкий іспит", "легке питання"] }, pt: { examples: ["um exame fácil", "uma pergunta fácil"] }, fr: { examples: ["un examen facile", "une question facile"] }, de: { examples: ["eine leichte Prüfung", "eine leichte Frage"] }, it: { examples: ["un esame facile", "una domanda facile"] }, pl: { examples: ["łatwy egzamin", "łatwe pytanie"] }, tr: { examples: ["kolay bir sınav", "kolay bir soru"] }, id: { examples: ["ujian yang mudah", "pertanyaan yang mudah"] }, vi: { examples: ["một bài kiểm tra dễ", "một câu hỏi dễ"] } }
          - type: rule
            level: A1
            text:
              en: "The plural adds -s after a vowel and -es after a consonant:"
              es: "El plural añade -s detrás de vocal y -es detrás de consonante:"
              uk: "Множина додає -s після голосної та -es після приголосної:"
              pt: "O plural acrescenta -s depois de vogal e -es depois de consoante:"
              fr: "Le pluriel ajoute -s après une voyelle et -es après une consonne :"
              de: "Der Plural hängt nach Vokal -s und nach Konsonant -es an:"
              it: "Il plurale aggiunge -s dopo una vocale e -es dopo una consonante:"
              pl: "Liczba mnoga dodaje -s po samogłosce i -es po spółgłosce:"
              tr: "Çoğul, ünlüden sonra -s, ünsüzden sonra -es ekler:"
              id: "Bentuk jamak menambahkan -s setelah vokal dan -es setelah konsonan:"
              vi: "Số nhiều thêm -s sau nguyên âm và -es sau phụ âm:"
            ex: { examples: [{ mapping: [verde, { target: verdes }] }, { mapping: [azul, { target: azules }] }] }
          - type: rule
            level: A2
            text:
              en: [{ term: -z }, " changes to ", { term: -ces }, " in the plural:"]
              es: [{ term: -z }, " cambia a ", { term: -ces }, " en plural:"]
              uk: [{ term: "-z" }, " у множині змінюється на ", { term: "-ces" }, ":"]
              pt: [{ term: "-z" }, " muda para ", { term: "-ces" }, " no plural:"]
              fr: [{ term: "-z" }, " devient ", { term: "-ces" }, " au pluriel :"]
              de: [{ term: "-z" }, " wird im Plural zu ", { term: "-ces" }, ":"]
              it: [{ term: "-z" }, " cambia in ", { term: "-ces" }, " al plurale:"]
              pl: [{ term: "-z" }, " zmienia się w ", { term: "-ces" }, " w liczbie mnogiej:"]
              tr: [{ term: "-z" }, " çoğulda ", { term: "-ces" }, " olur:"]
              id: [{ term: "-z" }, " berubah menjadi ", { term: "-ces" }, " dalam bentuk jamak:"]
              vi: [{ term: "-z" }, " đổi thành ", { term: "-ces" }, " ở số nhiều:"]
            ex: { mapping: [feliz, { target: felices }] }
          - type: rule
            level: A1
            text:
              en: "Nationalities ending in a consonant add -a for the feminine, and a final accent drops:"
              es: "Las nacionalidades en consonante añaden -a para el femenino, y la tilde final desaparece:"
              uk: "Назви національностей на приголосну додають -a в жіночому роді, а кінцевий знак наголосу зникає:"
              pt: "As nacionalidades em consoante acrescentam -a no feminino, e o acento final desaparece:"
              fr: "Les nationalités en consonne ajoutent -a au féminin, et l’accent final disparaît :"
              de: "Nationalitäten auf Konsonant bekommen im Femininum -a, und der Akzent am Ende fällt weg:"
              it: "Le nazionalità in consonante aggiungono -a al femminile, e l'accento finale scompare:"
              pl: "Przymiotniki narodowości zakończone na spółgłoskę dodają -a w rodzaju żeńskim, a końcowy akcent znika:"
              tr: "Ünsüzle biten uyruk sıfatları dişilde -a alır ve sondaki vurgu işareti düşer:"
              id: "Kata sifat kewarganegaraan berakhiran konsonan menambahkan -a untuk feminin, dan tanda aksen di akhir hilang:"
              vi: "Tính từ quốc tịch tận cùng bằng phụ âm thêm -a ở giống cái, và dấu sắc ở cuối biến mất:"
            ex: { examples: [{ mapping: [inglés, { target: inglesa }] }, { mapping: [alemán, { target: alemana }] }] }
          - type: rule
            level: A2
            text:
              en: ["Adjectives in ", { term: -or }, " also add -a:"]
              es: ["Los adjetivos en ", { term: -or }, " también añaden -a:"]
              uk: ["Прикметники на ", { term: "-or" }, " теж додають -a:"]
              pt: ["Os adjetivos em ", { term: "-or" }, " também acrescentam -a:"]
              fr: ["Les adjectifs en ", { term: "-or" }, " ajoutent aussi -a :"]
              de: ["Adjektive auf ", { term: "-or" }, " hängen ebenfalls -a an:"]
              it: ["Anche gli aggettivi in ", { term: "-or" }, " aggiungono -a:"]
              pl: ["Przymiotniki z końcówką ", { term: "-or" }, " również dodają -a:"]
              tr: [{ term: "-or" }, " ile biten sıfatlar da -a alır:"]
              id: ["Kata sifat berakhiran ", { term: "-or" }, " juga menambahkan -a:"]
              vi: ["Tính từ tận cùng bằng ", { term: "-or" }, " cũng thêm -a:"]
            ex: ["Mi madre es muy ", { target: trabajadora }, "."]
            tr: { en: My mother is very hard-working., uk: "Моя мама дуже працьовита.", pt: "Minha mãe é muito trabalhadora.", fr: "Ma mère est très travailleuse.", de: "Meine Mutter ist sehr fleißig.", it: "Mia madre è molto laboriosa.", pl: "Moja mama jest bardzo pracowita.", tr: "Annem çok çalışkandır.", id: "Ibu saya sangat rajin.", vi: "Mẹ tôi rất chăm chỉ." }
          - type: rule
            level: A1
            text:
              en: "Masculine and feminine nouns together take the masculine plural:"
              es: "Sustantivos masculinos y femeninos juntos llevan el masculino plural:"
              uk: "Іменники чоловічого й жіночого роду разом вимагають множини чоловічого роду:"
              pt: "Substantivos masculinos e femininos juntos levam o masculino plural:"
              fr: "Des noms masculins et féminins ensemble prennent le masculin pluriel :"
              de: "Maskuline und feminine Nomen zusammen verlangen den maskulinen Plural:"
              it: "Sostantivi maschili e femminili insieme richiedono il maschile plurale:"
              pl: "Rzeczowniki rodzaju męskiego i żeńskiego razem wymagają męskiej liczby mnogiej:"
              tr: "Eril ve dişil isimler birlikte olunca eril çoğul biçim kullanılır:"
              id: "Kata benda maskulin dan feminin yang disebut bersama memakai bentuk maskulin jamak:"
              vi: "Danh từ giống đực và giống cái đi cùng nhau dùng dạng giống đực số nhiều:"
            ex: ["Juan y Ana son ", { target: simpáticos }, "."]
            tr: { en: Juan and Ana are nice., uk: "Хуан і Ана приємні.", pt: "Juan e Ana são simpáticos.", fr: "Juan et Ana sont sympathiques.", de: "Juan und Ana sind nett.", it: "Juan e Ana sono simpatici.", pl: "Juan i Ana są mili.", tr: "Juan ile Ana sempatik.", id: "Juan dan Ana ramah.", vi: "Juan và Ana rất dễ mến." }
          - type: rule
            level: A1
            text:
              en: "The noun's gender decides the form, even when the noun ends in -a:"
              es: "El género del sustantivo decide la forma, aunque el sustantivo termine en -a:"
              uk: "Форму визначає рід іменника, навіть якщо іменник закінчується на -a:"
              pt: "O gênero do substantivo decide a forma, mesmo que o substantivo termine em -a:"
              fr: "Le genre du nom décide de la forme, même si le nom se termine en -a :"
              de: "Das Genus des Nomens bestimmt die Form, auch wenn das Nomen auf -a endet:"
              it: "Il genere del sostantivo decide la forma, anche se il sostantivo termina in -a:"
              pl: "O formie decyduje rodzaj rzeczownika, nawet gdy rzeczownik kończy się na -a:"
              tr: "Biçimi isimin cinsiyeti belirler; isim -a ile bitse bile:"
              id: "Gender kata benda menentukan bentuknya, meskipun kata benda berakhiran -a:"
              vi: "Giống của danh từ quyết định dạng của tính từ, dù danh từ tận cùng bằng -a:"
            ex: { examples: [["el mapa ", { target: nuevo }], ["el día ", { target: bonito }]] }
            tr: { en: { examples: [the new map, the lovely day] }, uk: { examples: ["нова мапа", "чудовий день"] }, pt: { examples: ["o mapa novo", "o dia bonito"] }, fr: { examples: ["la nouvelle carte", "la belle journée"] }, de: { examples: ["die neue Karte", "der schöne Tag"] }, it: { examples: ["la nuova mappa", "la bella giornata"] }, pl: { examples: ["nowa mapa", "piękny dzień"] }, tr: { examples: ["yeni harita", "güzel gün"] }, id: { examples: ["peta yang baru", "hari yang indah"] }, vi: { examples: ["bản đồ mới", "ngày đẹp trời"] } }
          - type: note
            level: C1
            text:
              es: ["El predicativo del objeto con verbos de nombrar o de juicio: ver ", { link: El objeto directo y la a personal, to: es.pronombres.objeto-directo }, "."]

  - title: { es: Adjetivos relacionales }
    role: own
    content:
      - type: usage
        columns:
          - { key: type, label: { es: Tipo } }
          - { key: sense, label: { es: Sentido } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            type: { es: ["De pertenencia: ", { term: materno }, ", ", { term: municipal }] }
            sense: { es: "«de la madre», «del municipio»" }
            ex: ["unos cuidados ", { target: maternos }]
          - level: B2
            type: { es: ["De materia: ", { term: lácteo }, ", ", { term: solar }] }
            sense: { es: "«de leche», «del sol»" }
            ex: ["un producto ", { target: lácteo }]
          - level: B2
            type: { es: ["De ámbito: ", { term: bancario }, ", ", { term: ferroviario }] }
            sense: { es: "«del banco», «del ferrocarril»" }
