# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.adjetivo-adverbio.adjetivo-concordancia
lang: es
kind: grammar
tags: [adjectives, agreement, gender, number, position]
concepts: [adjectives]
related: [es.sustantivo-determinantes.genero, es.sustantivo-determinantes.plural, es.adjetivo-adverbio.comparativos-superlativos, es.ser-estar-hay-gustar.ser-estar]
status: { en: draft, es: draft, uk: draft }
translated: { en: "990192 470010 eba534 a0fe8b 40ea42 54cc62", uk: "990192 470010 eba534 a0fe8b 40ea42 54cc62" }

title: { en: "Adjectives: Agreement and Position", es: "El adjetivo: concordancia y posición", uk: "Прикметник: узгодження та місце" }
summary:
  lead:
    en: ["Adjectives agree with their noun in gender and number and usually follow it: ", { term: una casa blanca }, ", ", { term: unos libros nuevos }, "."]
    es: ["El adjetivo concuerda con el sustantivo en género y número y suele ir detrás: ", { term: una casa blanca }, ", ", { term: unos libros nuevos }, "."]
    uk: ["Прикметники узгоджуються з іменником у роді й числі та зазвичай стоять після нього: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
  rule:
    en: ["An adjective in ", { term: -o }, " changes to ", { alternatives: [{ term: -a }, { term: -os }, { term: -as }] }, " with its noun:"]
    es: ["Un adjetivo en ", { term: -o }, " cambia a ", { alternatives: [{ term: -a }, { term: -os }, { term: -as }] }, " según el sustantivo:"]
    uk: ["Прикметник на ", { term: "-o" }, " змінюється на ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " відповідно до іменника:"]
  ex: { examples: [["un chico ", { target: alto }], ["unas chicas ", { target: altas }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: { en: Ending in -o, es: Terminado en -o, uk: "Закінчення -o" }
          rule:
            en: ["four forms: ", { alternatives: [{ term: -o }, { term: -a }, { term: -os }, { term: -as }] }]
            es: ["cuatro formas: ", { alternatives: [{ term: -o }, { term: -a }, { term: -os }, { term: -as }] }]
            uk: ["чотири форми: ", { alternatives: [{ term: "-o" }, { term: "-a" }, { term: "-os" }, { term: "-as" }] }]
          ex: { examples: [["un libro ", { target: blanco }], ["unas casas ", { target: blancas }]] }
          tr: { en: { examples: [a white book, some white houses] }, uk: { examples: ["біла книжка", "білі будинки"] } }
        - level: A1
          point: { en: Ending in -e or a consonant, es: Terminado en -e o consonante, uk: "Закінчення -e або приголосна" }
          rule:
            en: "one form for both genders"
            es: "una sola forma para los dos géneros"
            uk: "одна форма для обох родів"
          ex: { examples: [["un examen ", { target: fácil }], ["una pregunta ", { target: fácil }]] }
          tr: { en: { examples: [an easy exam, an easy question] }, uk: { examples: ["легкий іспит", "легке питання"] } }
        - level: A1
          point: { en: Nationality, es: Nacionalidad, uk: "Національність" }
          rule:
            en: "a consonant ending adds -a for the feminine"
            es: "la terminación en consonante añade -a para el femenino"
            uk: "закінчення на приголосну додає -a в жіночому роді"
          ex: { examples: [["un chico ", { target: español }], ["una chica ", { target: española }]] }
          tr: { en: { examples: [a Spanish boy, a Spanish girl] }, uk: { examples: ["хлопець-іспанець", "дівчина-іспанка"] } }
        - level: A1
          point: { en: Plural, es: Plural, uk: "Множина" }
          rule:
            en: "-s after a vowel, -es after a consonant"
            es: "-s detrás de vocal, -es detrás de consonante"
            uk: "-s після голосної, -es після приголосної"
          ex: { examples: [{ mapping: [verde, { target: verdes }] }, { mapping: [azul, { target: azules }] }] }
        - level: A1
          point: { en: Position, es: Posición, uk: "Місце" }
          rule:
            en: "after the noun as a rule"
            es: "detrás del sustantivo por regla general"
            uk: "як правило, після іменника"
          ex: ["un vestido ", { target: rojo }]
          tr: { en: a red dress, uk: "червона сукня" }
        - level: A1
          point: { en: Mixed group, es: Grupo mixto, uk: "Змішана група" }
          rule:
            en: "masculine and feminine nouns together take the masculine plural"
            es: "sustantivos masculinos y femeninos juntos llevan el masculino plural"
            uk: "іменники чоловічого й жіночого роду разом вимагають множини чоловічого роду"
          ex: ["Juan y Ana son ", { target: simpáticos }, "."]
          tr: { en: Juan and Ana are nice., uk: "Хуан і Ана приємні." }
        - level: A2
          point: "-or"
          rule:
            en: "adds -a for the feminine"
            es: "añade -a para el femenino"
            uk: "додає -a в жіночому роді"
          ex: ["una mujer ", { target: trabajadora }]
          tr: { en: a hard-working woman, uk: "працьовита жінка" }
        - level: B1
          point: { alternatives: [buen, mal] }
          rule:
            en: [{ term: bueno }, " and ", { term: malo }, " drop -o before a masculine singular noun"]
            es: [{ term: bueno }, " y ", { term: malo }, " pierden la -o delante de un sustantivo masculino singular"]
            uk: [{ term: "bueno" }, " і ", { term: "malo" }, " втрачають -o перед іменником чоловічого роду в однині"]
          ex: { examples: [["un ", { target: buen }, " libro"], ["un ", { target: mal }, " día"]] }
          tr: { en: { examples: [a good book, a bad day] }, uk: { examples: ["добра книжка", "поганий день"] } }
        - level: B1
          point: gran
          rule:
            en: [{ term: grande }, " becomes ", { term: gran }, " before any singular noun and means great"]
            es: [{ term: grande }, " pasa a ", { term: gran }, " delante de cualquier sustantivo singular y significa importante"]
            uk: [{ term: "grande" }, " стає ", { term: "gran" }, " перед будь-яким іменником в однині й означає «великий, видатний»"]
          ex: { examples: [["una ", { target: gran }, " idea"], ["un ", { target: gran }, " país"]] }
          tr: { en: { examples: [a great idea, a great country] }, uk: { examples: ["чудова ідея", "велика країна"] } }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "the noun's gender decides, even when it ends in -a"
            es: "decide el género del sustantivo, aunque termine en -a"
            uk: "форму прикметника визначає рід іменника, навіть якщо він закінчується на -a"
          ex: ["el mapa ", { target: nuevo }]
          tr: { en: the new map, uk: "нова мапа" }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "An adjective agrees with its noun in gender and number:"
              es: "El adjetivo concuerda con el sustantivo en género y número:"
              uk: "Прикметник узгоджується з іменником у роді й числі:"
            ex: { examples: [["el gato ", { target: negro }], ["las gatas ", { target: negras }]] }
            tr: { en: { examples: [the black cat, the black cats] }, uk: { examples: ["чорний кіт", "чорні коти"] } }
          - type: rule
            level: A1
            text:
              en: "Most adjectives go after the noun:"
              es: "La mayoría de los adjetivos van detrás del sustantivo:"
              uk: "Більшість прикметників стоїть після іменника:"
            ex: ["Tengo una casa ", { target: grande }, "."]
            tr: { en: I have a big house., uk: "У мене великий будинок." }
          - type: note
            level: A1
            text:
              en: ["The gender of the noun decides the form: see ", { link: Gender, to: es.sustantivo-determinantes.genero }, "."]
              es: ["El género del sustantivo decide la forma: ver ", { link: El género, to: es.sustantivo-determinantes.genero }, "."]
              uk: ["Форму визначає рід іменника: див. ", { link: "Рід", to: "es.sustantivo-determinantes.genero" }, "."]

  - title: { en: "Form: agreement", es: "Forma: la concordancia", uk: "Форма: узгодження" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: type, label: { en: Adjective, es: Adjetivo, uk: "Прикметник" } }
          - { key: sg, label: { en: Singular, es: Singular, uk: "Однина" }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: "Множина" }, features: { number: pl } }
        rows:
          - { level: A1, features: { gender: masc }, type: { en: "-o, masculine", es: "-o, masculino", uk: "-o, чоловічий рід" }, sg: { target: alto }, pl: { target: altos } }
          - { level: A1, features: { gender: fem }, type: { en: "-o, feminine", es: "-o, femenino", uk: "-o, жіночий рід" }, sg: { target: alta }, pl: { target: altas } }
          - { level: A1, features: [{ gender: masc }, { gender: fem }], type: { en: "-e, both genders", es: "-e, los dos géneros", uk: "-e, обидва роди" }, sg: { target: grande }, pl: { target: grandes } }
          - { level: A1, features: [{ gender: masc }, { gender: fem }], type: { en: "consonant, both genders", es: "consonante, los dos géneros", uk: "приголосна, обидва роди" }, sg: { target: azul }, pl: { target: azules } }
          - { level: A2, features: [{ gender: masc }, { gender: fem }], type: { en: "-z, both genders", es: "-z, los dos géneros", uk: "-z, обидва роди" }, sg: { target: feliz }, pl: { target: felices } }
          - { level: A1, features: { gender: masc }, type: { en: "nationality, masculine", es: "nacionalidad, masculino", uk: "національність, чоловічий рід" }, sg: { target: español }, pl: { target: españoles } }
          - { level: A1, features: { gender: fem }, type: { en: "nationality, feminine", es: "nacionalidad, femenino", uk: "національність, жіночий рід" }, sg: { target: española }, pl: { target: españolas } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Adjectives in ", { term: -o }, " have four forms: ", { alternatives: [{ term: alto }, { term: alta }, { term: altos }, { term: altas }] }, "."]
              es: ["Los adjetivos en ", { term: -o }, " tienen cuatro formas: ", { alternatives: [{ term: alto }, { term: alta }, { term: altos }, { term: altas }] }, "."]
              uk: ["Прикметники на ", { term: "-o" }, " мають чотири форми: ", { alternatives: [{ term: "alto" }, { term: "alta" }, { term: "altos" }, { term: "altas" }] }, "."]
          - type: rule
            level: A1
            text:
              en: "Adjectives in -e or a consonant have one form for both genders:"
              es: "Los adjetivos en -e o en consonante tienen una sola forma para los dos géneros:"
              uk: "Прикметники на -e або на приголосну мають одну форму для обох родів:"
            ex: { examples: [["un examen ", { target: fácil }], ["una pregunta ", { target: fácil }]] }
            tr: { en: { examples: [an easy exam, an easy question] }, uk: { examples: ["легкий іспит", "легке питання"] } }
          - type: rule
            level: A1
            text:
              en: "The plural adds -s after a vowel and -es after a consonant:"
              es: "El plural añade -s detrás de vocal y -es detrás de consonante:"
              uk: "Множина додає -s після голосної та -es після приголосної:"
            ex: { examples: [{ mapping: [verde, { target: verdes }] }, { mapping: [azul, { target: azules }] }] }
          - type: rule
            level: A2
            text:
              en: [{ term: -z }, " changes to ", { term: -ces }, " in the plural:"]
              es: [{ term: -z }, " cambia a ", { term: -ces }, " en plural:"]
              uk: [{ term: "-z" }, " у множині змінюється на ", { term: "-ces" }, ":"]
            ex: { mapping: [feliz, { target: felices }] }
          - type: rule
            level: A1
            text:
              en: "Nationalities ending in a consonant add -a for the feminine, and a final accent drops:"
              es: "Las nacionalidades en consonante añaden -a para el femenino, y la tilde final desaparece:"
              uk: "Назви національностей на приголосну додають -a в жіночому роді, а кінцевий знак наголосу зникає:"
            ex: { examples: [{ mapping: [inglés, { target: inglesa }] }, { mapping: [alemán, { target: alemana }] }] }
          - type: rule
            level: A2
            text:
              en: ["Adjectives in ", { term: -or }, " also add -a:"]
              es: ["Los adjetivos en ", { term: -or }, " también añaden -a:"]
              uk: ["Прикметники на ", { term: "-or" }, " теж додають -a:"]
            ex: ["Mi madre es muy ", { target: trabajadora }, "."]
            tr: { en: My mother is very hard-working., uk: "Моя мама дуже працьовита." }
          - type: rule
            level: A1
            text:
              en: "Masculine and feminine nouns together take the masculine plural:"
              es: "Sustantivos masculinos y femeninos juntos llevan el masculino plural:"
              uk: "Іменники чоловічого й жіночого роду разом вимагають множини чоловічого роду:"
            ex: ["Juan y Ana son ", { target: simpáticos }, "."]
            tr: { en: Juan and Ana are nice., uk: "Хуан і Ана приємні." }
          - type: rule
            level: A1
            text:
              en: "The noun's gender decides the form, even when the noun ends in -a:"
              es: "El género del sustantivo decide la forma, aunque el sustantivo termine en -a:"
              uk: "Форму визначає рід іменника, навіть якщо іменник закінчується на -a:"
            ex: { examples: [["el mapa ", { target: nuevo }], ["el día ", { target: bonito }]] }
            tr: { en: { examples: [the new map, the lovely day] }, uk: { examples: ["нова мапа", "чудовий день"] } }

  - title: { en: Position, es: La posición, uk: "Місце" }
    role: use
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position, es: Posición, uk: "Місце" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, position: { en: after the noun, es: detrás del sustantivo, uk: "після іменника" }, use: { en: "the usual place: it tells this thing from others", es: "la posición habitual: distingue esta cosa de otras", uk: "звичайне місце: вирізняє цю річ з-поміж інших" }, ex: ["un vestido ", { target: rojo }], tr: { en: a red dress, uk: "червона сукня" } }
          - { level: B1, position: { en: before the noun, es: delante del sustantivo, uk: "перед іменником" }, use: { en: [{ term: buen }, ", ", { term: mal }, ", ", { term: gran }], es: [{ term: buen }, ", ", { term: mal }, ", ", { term: gran }], uk: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }] }, ex: ["Es un ", { target: buen }, " amigo."], tr: { en: "He's a good friend.", uk: "Він хороший друг." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: bueno }, " and ", { term: malo }, " drop -o before a masculine singular noun:"]
              es: [{ term: bueno }, " y ", { term: malo }, " pierden la -o delante de un sustantivo masculino singular:"]
              uk: [{ term: "bueno" }, " і ", { term: "malo" }, " втрачають -o перед іменником чоловічого роду в однині:"]
            ex: { examples: [["un ", { target: buen }, " día"], ["un ", { target: mal }, " momento"]] }
            tr: { en: { examples: [a good day, a bad moment] }, uk: { examples: ["добрий день", "поганий момент"] } }
          - type: rule
            level: B1
            text:
              en: [{ term: grande }, " becomes ", { term: gran }, " before a singular noun of either gender:"]
              es: [{ term: grande }, " pasa a ", { term: gran }, " delante de un sustantivo singular de cualquier género:"]
              uk: [{ term: "grande" }, " стає ", { term: "gran" }, " перед іменником в однині будь-якого роду:"]
            ex: { examples: [["una ", { target: gran }, " idea"], ["un ", { target: gran }, " país"]] }
            tr: { en: { examples: [a great idea, a great country] }, uk: { examples: ["чудова ідея", "велика країна"] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: una casa blanco, right: ["una casa ", { target: blanca }], rule: { en: the adjective agrees in gender, es: el adjetivo concuerda en género, uk: "прикметник узгоджується в роді" } }
          - { level: A1, wrong: los libros nuevo, right: ["los libros ", { target: nuevos }], rule: { en: the adjective agrees in number, es: el adjetivo concuerda en número, uk: "прикметник узгоджується в числі" } }
          - { level: A1, wrong: el mapa nueva, right: ["el mapa ", { target: nuevo }], rule: { en: [{ term: mapa }, " is masculine: the noun's gender decides"], es: [{ term: mapa }, " es masculino: decide el género del sustantivo"], uk: [{ term: "mapa" }, " — чоловічого роду: форму прикметника визначає рід іменника"] } }
          - { level: A1, wrong: Juan y Ana son simpáticas., right: ["Juan y Ana son ", { target: simpáticos }, "."], rule: { en: a mixed group takes the masculine plural, es: un grupo mixto lleva el masculino plural, uk: "змішана група вимагає множини чоловічого роду" } }
          - { level: A1, wrong: unas chicas inglésas, right: ["unas chicas ", { target: inglesas }], rule: { en: ["the accent of ", { term: inglés }, " drops when it adds an ending"], es: ["la tilde de ", { term: inglés }, " desaparece al añadir una terminación"], uk: ["знак наголосу в ", { term: "inglés" }, " зникає, коли додається закінчення"] } }
          - { level: A1, speakers: [en], wrong: un rojo vestido, right: ["un vestido ", { target: rojo }], rule: { en: "colours and most adjectives go after the noun" } }
          - { level: B1, wrong: un bueno libro, right: ["un ", { target: buen }, " libro"], rule: { en: [{ term: bueno }, " drops -o before a masculine singular noun"], es: [{ term: bueno }, " pierde la -o delante de un sustantivo masculino singular"], uk: [{ term: "bueno" }, " втрачає -o перед іменником чоловічого роду в однині"] } }
          - { level: B1, wrong: una grande idea, right: ["una ", { target: gran }, " idea"], rule: { en: [{ term: grande }, " becomes ", { term: gran }, " before a singular noun"], es: [{ term: grande }, " pasa a ", { term: gran }, " delante de un sustantivo singular"], uk: [{ term: "grande" }, " стає ", { term: "gran" }, " перед іменником в однині"] } }
          - { level: A1, speakers: [uk], wrong: una blanca casa, right: ["una casa ", { target: blanca }], rule: { uk: "прикметник зазвичай стоїть після іменника, хоча українською кажемо «білий будинок»" } }
          - { level: A2, speakers: [uk], wrong: un problema seria, right: ["un problema ", { target: serio }], rule: { uk: [{ term: problema }, " — чоловічого роду, тож і прикметник має форму чоловічого роду, хоча українською «серйозна проблема»"] } }
