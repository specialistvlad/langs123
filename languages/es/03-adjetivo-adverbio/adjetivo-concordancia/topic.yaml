title: { en: "Adjectives: Agreement and Position", es: "El adjetivo: concordancia y posición", uk: "Прикметник: узгодження та місце", pt: "O adjetivo: concordância e posição", fr: "L’adjectif : accord et position", de: "Das Adjektiv: Angleichung und Stellung", it: "L'aggettivo: concordanza e posizione", pl: "Przymiotnik: zgodność i pozycja", tr: "Sıfat: uyum ve konum", id: "Kata sifat: kesesuaian dan posisi", vi: "Tính từ: sự hòa hợp và vị trí" }
summary:
  lead:
    en: ["Adjectives agree with their noun in gender and number and usually follow it: ", { term: una casa blanca }, ", ", { term: unos libros nuevos }, "."]
    es: ["El adjetivo concuerda con el sustantivo en género y número y suele ir detrás: ", { term: una casa blanca }, ", ", { term: unos libros nuevos }, "."]
    uk: ["Прикметники узгоджуються з іменником у роді й числі та зазвичай стоять після нього: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    pt: ["O adjetivo concorda com o substantivo em gênero e número e costuma vir depois dele: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    fr: ["L’adjectif s’accorde avec le nom en genre et en nombre et se place d’ordinaire après lui : ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    de: ["Das Adjektiv gleicht sich dem Nomen in Genus und Numerus an und steht meist danach: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    it: ["L'aggettivo concorda con il sostantivo in genere e numero e di solito lo segue: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    pl: ["Przymiotnik zgadza się z rzeczownikiem w rodzaju i liczbie i zwykle stoi po nim: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    tr: ["Sıfat, isimle cinsiyet ve sayıda uyum sağlar ve genellikle isimden sonra gelir: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    id: ["Kata sifat menyesuaikan diri dengan kata benda dalam gender dan jumlah, dan biasanya berada sesudahnya: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
    vi: ["Tính từ hòa hợp với danh từ về giống và số, và thường đứng sau danh từ: ", { term: "una casa blanca" }, ", ", { term: "unos libros nuevos" }, "."]
  rule:
    en: ["An adjective in ", { term: -o }, " changes to ", { alternatives: [{ term: -a }, { term: -os }, { term: -as }] }, " with its noun:"]
    es: ["Un adjetivo en ", { term: -o }, " cambia a ", { alternatives: [{ term: -a }, { term: -os }, { term: -as }] }, " según el sustantivo:"]
    uk: ["Прикметник на ", { term: "-o" }, " змінюється на ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " відповідно до іменника:"]
    pt: ["Um adjetivo em ", { term: "-o" }, " muda para ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " conforme o substantivo:"]
    fr: ["Un adjectif en ", { term: "-o" }, " devient ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " selon le nom :"]
    de: ["Ein Adjektiv auf ", { term: "-o" }, " wird je nach Nomen zu ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, ":"]
    it: ["Un aggettivo in ", { term: "-o" }, " diventa ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " secondo il sostantivo:"]
    pl: ["Przymiotnik z końcówką ", { term: "-o" }, " zmienia się w ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " zależnie od rzeczownika:"]
    tr: ["Sıfat, ", { term: "-o" }, " ile bitiyorsa isme göre ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " biçimine geçer:"]
    id: ["Kata sifat berakhiran ", { term: "-o" }, " berubah menjadi ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " sesuai dengan kata bendanya:"]
    vi: ["Tính từ tận cùng bằng ", { term: "-o" }, " đổi thành ", { alternatives: [{ term: "-a" }, { term: "-os" }, { term: "-as" }] }, " theo danh từ:"]
  ex: { examples: [["un chico ", { target: alto }], ["unas chicas ", { target: altas }]] }

