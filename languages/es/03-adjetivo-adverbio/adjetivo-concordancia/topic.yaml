          - type: rule
            level: C1
            text:
              es: "Con sentido calificativo, el adjetivo admite grado:"
            ex: ["una cara muy ", { target: familiar }]

  - title: { en: Position, es: La posición, uk: "Місце", pt: "Posição", fr: "Position", de: "Stellung", it: "Posizione", pl: "Pozycja", tr: "Konum", id: "Posisi", vi: "Vị trí" }
