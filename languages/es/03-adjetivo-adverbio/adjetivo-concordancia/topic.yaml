          - { level: B1, position: { en: before the noun, es: delante del sustantivo, uk: "перед іменником", pt: "antes do substantivo", fr: "avant le nom", de: "vor dem Nomen", it: "prima del sostantivo", pl: "przed rzeczownikiem", tr: "isimden önce", id: "sebelum kata benda", vi: "trước danh từ" }, use: { en: [{ term: buen }, ", ", { term: mal }, ", ", { term: gran }], es: [{ term: buen }, ", ", { term: mal }, ", ", { term: gran }], uk: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], pt: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], fr: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], de: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], it: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], pl: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], tr: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], id: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }], vi: [{ term: "buen" }, ", ", { term: "mal" }, ", ", { term: "gran" }] }, ex: ["Es un ", { target: buen }, " amigo."], tr: { en: "He's a good friend.", uk: "Він хороший друг.", pt: "Ele é um bom amigo.", fr: "C’est un bon ami.", de: "Er ist ein guter Freund.", it: "È un buon amico.", pl: "To dobry przyjaciel.", tr: "O iyi bir arkadaş.", id: "Dia teman yang baik.", vi: "Anh ấy là một người bạn tốt." } }
          - level: B2
            position: { es: "delante del sustantivo, con énfasis" }
            use: { es: "el adjetivo destaca la cualidad con valor subjetivo" }
            ex: ["Tenemos un ", { target: grave }, " problema."]
          - level: B2
            position: { es: "delante o detrás, con otro sentido" }
            use: { es: ["con ", { term: viejo }, ": delante, «de hace tiempo»; detrás, «de edad avanzada»"] }
            ex: { examples: [["un ", { target: viejo }, " amigo"], ["un amigo ", { target: viejo }]] }
          - level: B2
            position: { es: "delante o detrás, con otro sentido" }
            use: { es: ["con ", { term: único }, ": delante, «solo uno»; detrás, «extraordinario»"] }
            ex: { examples: [["un ", { target: único }, " profesor"], ["un profesor ", { target: único }]] }
          - level: B2
            position: { es: "detrás del sustantivo, siempre" }
            use: { es: "lo piden los adjetivos relacionales" }
            ex: ["un producto ", { target: lácteo }]
          - level: C1
            position: { es: "delante del sustantivo, como cuantificador" }
            use: { es: ["con ", { term: raro }, " y ", { term: escaso }, ": «pocos»"] }
            ex: { examples: [["En ", { target: raros }, " casos hay retrasos."], ["Hay ", { target: escasas }, " plazas."]] }
          - level: C1
            position: { es: "delante del sustantivo, tras qué" }
            use: { es: "la exclamación pone el adjetivo junto a qué" }
            ex: ["¡Qué ", { target: bonito }, " paisaje!"]
          - level: C1
            position: { es: "al principio de la oración, aislado" }
            use: { es: "el predicativo aislado destaca el estado del sujeto" }
            ex: { examples: [[{ target: Satisfecha }, ", la directora cerró la reunión."], ["La directora cerró la reunión ", { target: satisfecha }, "."]] }
          - level: C2
            position: { es: "delante del sustantivo, en la lengua literaria" }
            use: { es: "el adjetivo evoca una cualidad conocida" }
            ex: ["la ", { target: oscura }, " noche"]
          - level: C2
            position: { es: "delante de un nombre de cantidad" }
            use: { es: ["con ", { term: buen }, " y ", { term: mal }, ": intensifican"] }
            ex: { examples: [["Se comió un ", { target: buen }, " plato de arroz."], ["No me queda ni un ", { target: mal }, " euro."]] }
          - level: C2
            position: { es: "delante del sustantivo, con ironía" }
            use: { es: "la valoración dice lo contrario de lo que piensa quien habla" }
            ex: { examples: [[{ target: Valiente }, " amigo eres."], [{ target: Bonita }, " forma de saludar."]] }
          - level: C2
            position: { es: "delante del sustantivo, en expresiones casi fijas" }
            use: { es: [{ term: pleno apogeo }, ", ", { term: altas instancias }, ", ", { term: buen gusto }, ", ", { term: mal gusto }] }
            ex: ["El festival está en ", { target: pleno }, " apogeo."]
          - level: C2
            position: { es: "al principio de la oración, varios adjetivos" }
            use: { es: "los adjetivos aislados destacan el estado de quien llega" }
            ex: [{ target: Impecables }, " y ", { target: serenos }, ", llegaron los músicos al concierto."]
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: bueno }, " and ", { term: malo }, " drop -o before a masculine singular noun:"]
