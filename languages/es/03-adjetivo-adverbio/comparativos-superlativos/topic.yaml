          - level: C1
            structure: { pattern: [{ alternatives: [más, menos] }, { slot: noun }, que, { slot: noun }] }
            use: { es: "dos objetos del mismo sujeto", en: "two kinds of things for the same subject", uk: "два види речей одного підмета", pt: "dois tipos de coisas do mesmo sujeito", fr: "deux sortes de choses pour le même sujet", de: "zwei Dinge desselben Subjekts", it: "due tipi di cose dello stesso soggetto", pl: "dwa rodzaje rzeczy tego samego podmiotu", tr: "aynı öznenin iki tür nesnesi", id: "dua jenis benda milik subjek yang sama", vi: "hai loại đồ vật của cùng một chủ ngữ" }
            ex: ["Tiene ", { target: más libros que }, " discos."]
            tr: { en: "He has more books than records.", uk: "У нього більше книжок, ніж платівок.", pt: "Ele tem mais livros do que discos.", fr: "Il a plus de livres que de disques.", de: "Er hat mehr Bücher als Schallplatten.", it: "Ha più libri che dischi.", pl: "Ma więcej książek niż płyt.", tr: "Plaktan çok kitabı var.", id: "Dia punya lebih banyak buku daripada piringan hitam.", vi: "Anh ấy có nhiều sách hơn đĩa nhạc." }
          - level: C1
            structure: { pattern: [{ slot: verb }, { alternatives: [más que, tanto como] }, { slot: verb }] }
            use: { es: "dos acciones del mismo sujeto", en: "two actions of the same subject", uk: "дві дії одного підмета", pt: "duas ações do mesmo sujeito", fr: "deux actions du même sujet", de: "zwei Handlungen desselben Subjekts", it: "due azioni dello stesso soggetto", pl: "dwie czynności tego samego podmiotu", tr: "aynı öznenin iki eylemi", id: "dua tindakan dari subjek yang sama", vi: "hai hành động của cùng một chủ ngữ" }
            ex: { examples: [["Come ", { target: más que }, " duerme."], ["Come ", { target: tanto como }, " duerme."]] }
            tr: { en: { examples: ["He eats more than he sleeps.", "He eats as much as he sleeps."] }, uk: { examples: ["Він їсть більше, ніж спить.", "Він їсть стільки ж, скільки спить."] }, pt: { examples: ["Ele come mais do que dorme.", "Ele come tanto quanto dorme."] }, fr: { examples: ["Il mange plus qu’il ne dort.", "Il mange autant qu’il dort."] }, de: { examples: ["Er isst mehr, als er schläft.", "Er isst genauso viel, wie er schläft."] }, it: { examples: ["Mangia più di quanto dorma.", "Mangia quanto dorme."] }, pl: { examples: ["Je więcej, niż śpi.", "Je tyle, ile śpi."] }, tr: { examples: ["Uyuduğundan çok yiyor.", "Ne kadar uyuyorsa o kadar yiyor."] }, id: { examples: ["Dia makan lebih banyak daripada tidur.", "Dia makan sebanyak dia tidur."] }, vi: { examples: ["Anh ấy ăn nhiều hơn ngủ.", "Anh ấy ăn nhiều như ngủ."] } }
          - level: C1
            structure: { pattern: [{ alternatives: [más, tan] }, { slot: adjective }, { alternatives: [que, como] }, { alternatives: [el que, los que] }] }
            use: { es: "el segundo término es una oración de relativo", en: "the second term is a relative clause", uk: "другий член порівняння — означальне підрядне речення", pt: "o segundo termo é uma oração relativa", fr: "le second terme est une proposition relative", de: "das zweite Vergleichsglied ist ein Relativsatz", it: "il secondo termine è una proposizione relativa", pl: "drugi człon porównania jest zdaniem względnym", tr: "ikinci terim bir ilgi cümlesidir", id: "unsur kedua berupa klausa relatif", vi: "vế thứ hai là một mệnh đề quan hệ" }
            ex: { examples: [["Es ", { target: más listo que los que }, " vinieron ayer."], ["Es ", { target: tan alto como el que más }, "."]] }
            tr: { en: { examples: ["He's smarter than the ones who came yesterday.", "He's as tall as the tallest."] }, uk: { examples: ["Він розумніший за тих, хто приходив учора.", "Він високий, як найвищі."] }, pt: { examples: ["Ele é mais esperto do que os que vieram ontem.", "Ele é tão alto quanto o mais alto."] }, fr: { examples: ["Il est plus malin que ceux qui sont venus hier.", "Il est aussi grand que le plus grand."] }, de: { examples: ["Er ist klüger als die, die gestern gekommen sind.", "Er ist so groß wie der Größte."] }, it: { examples: ["È più furbo di quelli che sono venuti ieri.", "È alto quanto il più alto."] }, pl: { examples: ["Jest mądrzejszy niż ci, którzy przyszli wczoraj.", "Jest tak wysoki jak najwyżsi."] }, tr: { examples: ["Dün gelenlerden daha zeki.", "En uzun boylular kadar uzun."] }, id: { examples: ["Dia lebih pintar daripada mereka yang datang kemarin.", "Dia setinggi yang tertinggi."] }, vi: { examples: ["Anh ấy thông minh hơn những người đến hôm qua.", "Anh ấy cao như người cao nhất."] } }
          - level: C1
            structure: { pattern: [tanto, como, { slot: clause }] }
            use: { es: "el segundo término es una oración con verbo conjugado", en: "the second term is a clause with a conjugated verb", uk: "другий член порівняння — речення з дієсловом в особовій формі", pt: "o segundo termo é uma oração com verbo conjugado", fr: "le second terme est une proposition avec un verbe conjugué", de: "das zweite Vergleichsglied ist ein Satz mit konjugiertem Verb", it: "il secondo termine è una frase con un verbo coniugato", pl: "drugi człon porównania jest zdaniem z czasownikiem w formie osobowej", tr: "ikinci terim çekimli fiilli bir cümledir", id: "unsur kedua berupa klausa dengan kata kerja yang sudah dikonjugasi", vi: "vế thứ hai là một mệnh đề có động từ đã chia" }
            ex: ["He comprado ", { target: tantos libros como }, " he podido."]
            tr: { en: "I've bought as many books as I could.", uk: "Я купив стільки книжок, скільки зміг.", pt: "Comprei tantos livros quanto pude.", fr: "J’ai acheté autant de livres que j’ai pu.", de: "Ich habe so viele Bücher gekauft, wie ich konnte.", it: "Ho comprato tanti libri quanti ho potuto.", pl: "Kupiłem tyle książek, ile mogłem.", tr: "Elimden geldiği kadar kitap aldım.", id: "Saya membeli buku sebanyak yang saya bisa.", vi: "Tôi đã mua nhiều sách hết mức có thể." }
          - level: C1
            structure: { pattern: [{ alternatives: [más, menos] }, de lo que, { slot: clause }] }
            use: { es: "cantidad no precisada", en: "indefinite amount", uk: "невизначена кількість", pt: "quantidade não precisada", fr: "quantité non précisée", de: "unbestimmte Menge", it: "quantità non precisata", pl: "ilość nieokreślona", tr: "belirsiz miktar", id: "jumlah yang tidak ditentukan", vi: "số lượng không xác định" }
            ex: { examples: [["Cuesta ", { target: más de lo que }, " esperaba."], ["No cuesta ", { target: más de lo que }, " me esperaba."]] }
            tr: { en: { examples: ["It costs more than I expected.", "It doesn't cost more than I expected."] }, uk: { examples: ["Це коштує більше, ніж я очікував.", "Це коштує не більше, ніж я очікував."] }, pt: { examples: ["Custa mais do que eu esperava.", "Não custa mais do que eu esperava."] }, fr: { examples: ["Ça coûte plus cher que je ne le pensais.", "Ça ne coûte pas plus cher que je ne le pensais."] }, de: { examples: ["Es kostet mehr, als ich erwartet hatte.", "Es kostet nicht mehr, als ich erwartet hatte."] }, it: { examples: ["Costa più di quanto mi aspettassi.", "Non costa più di quanto mi aspettassi."] }, pl: { examples: ["Kosztuje więcej, niż się spodziewałem.", "Nie kosztuje więcej, niż się spodziewałem."] }, tr: { examples: ["Beklediğimden daha pahalıya geliyor.", "Beklediğimden daha pahalıya gelmiyor."] }, id: { examples: ["Harganya lebih mahal daripada yang saya duga.", "Harganya tidak lebih mahal daripada yang saya duga."] }, vi: { examples: ["Giá cao hơn tôi nghĩ.", "Giá không cao hơn tôi nghĩ."] } }
          - level: C1
            structure: { pattern: [a lo, { slot: noun }] }
            use: { es: "manera: al estilo de una persona", en: "manner: in the style of a person", uk: "спосіб: у стилі певної людини", pt: "maneira: ao estilo de uma pessoa", fr: "manière : à la façon d’une personne", de: "Art und Weise: im Stil einer Person", it: "modo: alla maniera di una persona", pl: "sposób: w stylu jakiejś osoby", tr: "tarz: bir kişinin tarzında", id: "cara: bergaya seseorang", vi: "cách thức: theo phong cách của một người" }
            ex: ["Se viste ", { target: a lo }, " Charlie Chaplin."]
            tr: { en: "He dresses like Charlie Chaplin.", uk: "Він одягається, як Чарлі Чаплін.", pt: "Ele se veste à moda Charlie Chaplin.", fr: "Il s’habille à la Charlie Chaplin.", de: "Er kleidet sich wie Charlie Chaplin.", it: "Si veste alla Charlie Chaplin.", pl: "Ubiera się à la Charlie Chaplin.", tr: "Charlie Chaplin tarzında giyiniyor.", id: "Dia berpakaian ala Charlie Chaplin.", vi: "Anh ấy ăn mặc theo kiểu Charlie Chaplin." }
          - level: C1
            structure: { pattern: [igual que si, { slot: clause }] }
            use: { es: "manera: comparación irreal, con imperfecto de subjuntivo", en: "manner: unreal comparison, with the imperfect subjunctive", uk: "спосіб: нереальне порівняння, з імперфектом суб’юнктива", pt: "maneira: comparação irreal, com o pretérito imperfeito do subjuntivo", fr: "manière : comparaison irréelle, avec l’imparfait du subjonctif", de: "Art und Weise: irrealer Vergleich, mit dem Konjunktiv Imperfekt", it: "modo: confronto irreale, con l'imperfetto del congiuntivo", pl: "sposób: porównanie nierzeczywiste, z imperfecto trybu łączącego", tr: "tarz: gerçek dışı karşılaştırma, dilek kipinin imperfecto biçimiyle", id: "cara: perbandingan tidak nyata, dengan imperfecto subjungtif", vi: "cách thức: so sánh phi thực tế, với quá khứ chưa hoàn thành của thức giả định" }
            ex: ["Habla ", { target: igual que si }, " fuera el jefe."]
            tr: { en: "He talks as if he were the boss.", uk: "Він говорить так, ніби він начальник.", pt: "Ele fala como se fosse o chefe.", fr: "Il parle comme s’il était le patron.", de: "Er redet, als wäre er der Chef.", it: "Parla come se fosse il capo.", pl: "Mówi tak, jakby był szefem.", tr: "Patronmuş gibi konuşuyor.", id: "Dia bicara seolah-olah dia bosnya.", vi: "Anh ấy nói như thể mình là sếp." }
          - level: C2
            structure: { pattern: [{ slot: subject }, { alternatives: [tan, más, menos] }, { slot: adjective }, { alternatives: [como, que] }, { slot: subject }, { slot: adjective }] }
            use: { es: "el segundo término tiene su propio sujeto", en: "the second term has a subject of its own", uk: "другий член порівняння має власний підмет", pt: "o segundo termo tem sujeito próprio", fr: "le second terme a son propre sujet", de: "das zweite Vergleichsglied hat ein eigenes Subjekt", it: "il secondo termine ha un soggetto proprio", pl: "drugi człon porównania ma własny podmiot", tr: "ikinci terimin kendi öznesi vardır", id: "unsur kedua memiliki subjek sendiri", vi: "vế thứ hai có chủ ngữ riêng" }
            ex: { examples: [["Ella es ", { target: tan rápida como }, " yo lento."], ["Tiene ", { target: más libros que }, " yo discos."], ["Come ", { target: más que }, " yo duermo."]] }
            tr: { en: { examples: ["She is as fast as I am slow.", "He has more books than I have records.", "He eats more than I sleep."] }, uk: { examples: ["Вона така швидка, як я повільний.", "У нього більше книжок, ніж у мене платівок.", "Він їсть більше, ніж я сплю."] }, pt: { examples: ["Ela é tão rápida quanto eu sou lento.", "Ele tem mais livros do que eu tenho discos.", "Ele come mais do que eu durmo."] }, fr: { examples: ["Elle est aussi rapide que je suis lent.", "Il a plus de livres que moi de disques.", "Il mange plus que moi je ne dors."] }, de: { examples: ["Sie ist so schnell, wie ich langsam bin.", "Er hat mehr Bücher, als ich Schallplatten habe.", "Er isst mehr, als ich schlafe."] }, it: { examples: ["Lei è veloce quanto io sono lento.", "Ha più libri di quanti io abbia dischi.", "Mangia più di quanto dorma io."] }, pl: { examples: ["Ona jest tak szybka, jak ja jestem powolny.", "On ma więcej książek, niż ja mam płyt.", "On je więcej, niż ja śpię."] }, tr: { examples: ["O, benim yavaş olduğum kadar hızlı.", "Onun benim plak sayımdan daha çok kitabı var.", "Benim uyuduğumdan daha çok yiyor."] }, id: { examples: ["Dia secepat saya lambat.", "Dia punya lebih banyak buku daripada saya punya piringan hitam.", "Dia makan lebih banyak daripada saya tidur."] }, vi: { examples: ["Cô ấy nhanh bằng mức tôi chậm.", "Anh ấy có nhiều sách hơn số đĩa nhạc tôi có.", "Anh ấy ăn nhiều hơn tôi ngủ."] } }
          - level: C2
            structure: { pattern: [{ alternatives: [tan, tanto] }, { slot: noun }, cuanto] }
            use: { es: ["registro culto: ", { term: cuanto }, " sustituye a ", { term: como }], en: ["formal register: ", { term: "cuanto" }, " replaces ", { term: "como" }], uk: ["книжний стиль: ", { term: "cuanto" }, " замінює ", { term: "como" }], pt: ["registro culto: ", { term: "cuanto" }, " substitui ", { term: "como" }], fr: ["registre soutenu : ", { term: "cuanto" }, " remplace ", { term: "como" }], de: ["gehobener Stil: ", { term: "cuanto" }, " ersetzt ", { term: "como" }], it: ["registro colto: ", { term: "cuanto" }, " sostituisce ", { term: "como" }], pl: ["rejestr książkowy: ", { term: "cuanto" }, " zastępuje ", { term: "como" }], tr: ["kitabi dil: ", { term: "cuanto" }, ", ", { term: "como" }, " yerine kullanılır"], id: ["ragam formal: ", { term: "cuanto" }, " menggantikan ", { term: "como" }], vi: ["văn phong trang trọng: ", { term: "cuanto" }, " thay cho ", { term: "como" }] }
            ex: { examples: [["Es ", { target: tan sincero cuanto }, " listo."], ["Tiene ", { target: tantos libros cuantos }, " puedas imaginar."]] }
            tr: { en: { examples: ["He is as sincere as he is clever.", "He has as many books as you can imagine."] }, uk: { examples: ["Він такий щирий, як і розумний.", "У нього стільки книжок, скільки ти можеш уявити."] }, pt: { examples: ["Ele é tão sincero quanto esperto.", "Ele tem tantos livros quantos você possa imaginar."] }, fr: { examples: ["Il est aussi sincère qu’intelligent.", "Il a autant de livres que tu peux l’imaginer."] }, de: { examples: ["Er ist ebenso aufrichtig wie klug.", "Er hat so viele Bücher, wie du dir nur vorstellen kannst."] }, it: { examples: ["È tanto sincero quanto furbo.", "Ha tanti libri quanti puoi immaginare."] }, pl: { examples: ["Jest tak szczery, jak mądry.", "Ma tyle książek, ile możesz sobie wyobrazić."] }, tr: { examples: ["Zeki olduğu kadar dürüst.", "Hayal edebileceğin kadar çok kitabı var."] }, id: { examples: ["Dia sejujur dia pintar.", "Dia punya buku sebanyak yang bisa kamu bayangkan."] }, vi: { examples: ["Anh ấy chân thành bao nhiêu thì thông minh bấy nhiêu.", "Anh ấy có nhiều sách hết mức bạn có thể tưởng tượng."] } }
          - level: C2
            structure: { pattern: [como, { slot: clause }, así, { slot: clause }] }
            use: { es: "pares correlativos de la prosa literaria", en: "correlative pairs of literary prose", uk: "співвідносні пари літературної прози", pt: "pares correlativos da prosa literária", fr: "paires corrélatives de la prose littéraire", de: "korrelative Paare der literarischen Prosa", it: "coppie correlative della prosa letteraria", pl: "pary korelatywne prozy literackiej", tr: "edebi nesrin karşılıklı çiftleri", id: "pasangan korelatif dalam prosa sastra", vi: "các cặp tương quan trong văn xuôi văn chương" }
            ex: { examples: [[{ target: Como }, " el río busca el mar, ", { target: así }, " busco yo tu casa."], [{ target: Así como }, " la lluvia da vida, ", { target: así }, " también la quita."]] }
            tr: { en: { examples: ["As the river seeks the sea, so I seek your house.", "Just as the rain gives life, so it also takes it away."] }, uk: { examples: ["Як річка шукає море, так я шукаю твій дім.", "Як дощ дає життя, так він його й забирає."] }, pt: { examples: ["Assim como o rio busca o mar, assim eu busco a sua casa.", "Assim como a chuva dá vida, assim também a tira."] }, fr: { examples: ["Comme le fleuve cherche la mer, ainsi je cherche ta maison.", "Comme la pluie donne la vie, ainsi elle la reprend."] }, de: { examples: ["Wie der Fluss das Meer sucht, so suche ich dein Haus.", "Wie der Regen Leben schenkt, so nimmt er es auch wieder."] }, it: { examples: ["Come il fiume cerca il mare, così io cerco la tua casa.", "Come la pioggia dà la vita, così la toglie."] }, pl: { examples: ["Jak rzeka szuka morza, tak ja szukam twojego domu.", "Jak deszcz daje życie, tak je też odbiera."] }, tr: { examples: ["Nehir denizi aradığı gibi ben de senin evini arıyorum.", "Yağmur hayat verdiği gibi onu alır da."] }, id: { examples: ["Seperti sungai mencari laut, begitulah saya mencari rumahmu.", "Seperti hujan memberi kehidupan, begitu pula hujan mengambilnya."] }, vi: { examples: ["Như dòng sông tìm biển, tôi cũng tìm đến nhà bạn.", "Như mưa mang lại sự sống, mưa cũng lấy nó đi."] } }
          - level: C2
            structure: { pattern: [cual, { slot: noun }] }
            use: { es: ["comparación literaria con el valor de ", { term: como }], en: ["literary comparison with the meaning of ", { term: "como" }], uk: ["літературне порівняння зі значенням ", { term: "como" }], pt: ["comparação literária com o valor de ", { term: "como" }], fr: ["comparaison littéraire avec la valeur de ", { term: "como" }], de: ["literarischer Vergleich mit der Bedeutung von ", { term: "como" }], it: ["confronto letterario con il valore di ", { term: "como" }], pl: ["porównanie literackie o znaczeniu ", { term: "como" }], tr: [{ term: "como" }, " anlamında edebi karşılaştırma"], id: ["perbandingan sastra dengan makna ", { term: "como" }], vi: ["so sánh văn chương với nghĩa của ", { term: "como" }] }
            ex: [{ target: Cual }, " una sombra, entró en la sala."]
            tr: { en: "Like a shadow, he entered the room.", uk: "Мов тінь, він увійшов до зали.", pt: "Qual uma sombra, entrou na sala.", fr: "Telle une ombre, il entra dans la salle.", de: "Wie ein Schatten betrat er den Saal.", it: "Come un'ombra, entrò nella sala.", pl: "Niczym cień, wszedł do sali.", tr: "Bir gölge gibi salona girdi.", id: "Bagai bayangan, dia memasuki ruangan.", vi: "Như một cái bóng, anh ta bước vào phòng." }
          - level: C2
            structure: { pattern: [{ alternatives: [más, menos] }, { slot: clause }, cuanto, { alternatives: [más, menos] }, { slot: clause }] }
            use: { es: "progresión: una magnitud cambia con la otra", en: "progression: one quantity changes with the other", uk: "поступова залежність: одна величина змінюється разом з іншою", pt: "progressão: uma grandeza muda com a outra", fr: "progression : une grandeur varie avec l’autre", de: "Progression: Eine Größe verändert sich mit der anderen", it: "progressione: una grandezza cambia con l'altra", pl: "progresja: jedna wielkość zmienia się wraz z drugą", tr: "orantılı gelişim: bir nicelik diğeriyle birlikte değişir", id: "perkembangan: satu besaran berubah bersama besaran lain", vi: "diễn tiến: đại lượng này thay đổi theo đại lượng kia" }
            ex: { examples: [["Hará menos ", { target: cuanto más }, " le pidas."], ["Aprende más ", { target: cuanto menos }, " lo presionan."]] }
            tr: { en: { examples: ["The more you ask of him, the less he will do.", "The less they press him, the more he learns."] }, uk: { examples: ["Чим більше ти в нього просиш, тим менше він робитиме.", "Чим менше на нього тиснуть, тим більше він вчиться."] }, pt: { examples: ["Ele fará menos quanto mais você pedir.", "Ele aprende mais quanto menos o pressionam."] }, fr: { examples: ["Plus tu lui demandes, moins il fera.", "Moins on le presse, plus il apprend."] }, de: { examples: ["Je mehr du ihn bittest, desto weniger wird er tun.", "Je weniger man ihn drängt, desto mehr lernt er."] }, it: { examples: ["Più glielo chiedi, meno farà.", "Meno lo pressano, più impara."] }, pl: { examples: ["Im więcej od niego żądasz, tym mniej zrobi.", "Im mniej na niego naciskają, tym więcej się uczy."] }, tr: { examples: ["Ondan ne kadar çok isterseniz o kadar az yapar.", "Üzerine ne kadar az gidilirse o kadar çok öğrenir."] }, id: { examples: ["Semakin banyak kamu memintanya, semakin sedikit yang dia kerjakan.", "Semakin sedikit dia ditekan, semakin banyak dia belajar."] }, vi: { examples: ["Bạn càng nhờ nhiều, anh ấy càng làm ít.", "Càng ít bị ép, anh ấy càng học được nhiều."] } }
      - type: list
        items:
          - type: note
            level: C1
            text:
              es: ["Con ", { term: como si }, " el verbo va en imperfecto de subjuntivo: ver ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, "."]
              en: ["After ", { term: "como si" }, " the verb is in the imperfect subjunctive: see ", { link: "The imperfect subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, "."]
              uk: ["Після ", { term: "como si" }, " дієслово стоїть в імперфекті суб’юнктива: див. ", { link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, "."]
