            tr: { en: { examples: ["My house is three times bigger than yours.", "This car uses three times less than the other one."] }, uk: { examples: ["Мій дім утричі більший за твій.", "Ця машина витрачає втричі менше, ніж та."] }, pt: { examples: ["Minha casa é três vezes maior que a sua.", "Este carro gasta três vezes menos que o outro."] }, fr: { examples: ["Ma maison est trois fois plus grande que la tienne.", "Cette voiture consomme trois fois moins que l’autre."] }, de: { examples: ["Mein Haus ist dreimal so groß wie deins.", "Dieses Auto verbraucht dreimal weniger als das andere."] }, it: { examples: ["La mia casa è tre volte più grande della tua.", "Questa macchina consuma tre volte meno dell'altra."] }, pl: { examples: ["Mój dom jest trzy razy większy niż twój.", "Ten samochód zużywa trzy razy mniej niż tamten."] }, tr: { examples: ["Benim evim seninkinden üç kat büyük.", "Bu araba ötekinden üç kat az yakıyor."] }, id: { examples: ["Rumah saya tiga kali lebih besar daripada rumahmu.", "Mobil ini memakai bahan bakar tiga kali lebih sedikit daripada mobil yang lain."] }, vi: { examples: ["Nhà tôi lớn gấp ba lần nhà bạn.", "Chiếc xe này tốn nhiên liệu ít hơn chiếc kia ba lần."] } }
          - level: B2
