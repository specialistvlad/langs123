            tr: { en: { examples: ["He's the last of all.", "She's the first in the line."] }, uk: { examples: ["Він останній з усіх.", "Вона перша в черзі."] }, pt: { examples: ["Ele é o último de todos.", "Ela é a primeira da fila."] }, fr: { examples: ["C’est le dernier de tous.", "C’est la première de la file."] }, de: { examples: ["Er ist der Letzte von allen.", "Sie ist die Erste in der Reihe."] }, it: { examples: ["È l'ultimo di tutti.", "È la prima della fila."] }, pl: { examples: ["On jest ostatni ze wszystkich.", "Ona jest pierwsza w kolejce."] }, tr: { examples: ["Hepsinin sonuncusu o.", "Sıradaki ilk kişi o."] }, id: { examples: ["Dia yang terakhir dari semuanya.", "Dia yang pertama dalam antrean."] }, vi: { examples: ["Anh ấy là người cuối cùng trong tất cả.", "Cô ấy là người đầu tiên trong hàng."] } }
