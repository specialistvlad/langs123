# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.adjetivo-adverbio.comparativos-superlativos
lang: es
kind: grammar
tags: [adjectives, comparison, comparatives, superlatives]
concepts: [comparison]
related: [es.adjetivo-adverbio.adjetivo-concordancia, es.adjetivo-adverbio.adverbios, es.sustantivo-determinantes.cuantificadores]
status: { en: draft, es: draft, uk: draft }
translated: { en: "b62eab 66c144 b815b6 782281 b05849 ae2940 707f10 168e29", uk: "b62eab 66c144 b815b6 782281 b05849 ae2940 707f10 168e29" }

title: { en: Comparatives and Superlatives, es: Comparativos y superlativos, uk: "Вищий і найвищий ступені порівняння" }
summary:
  lead:
    en: ["Comparatives and superlatives compare people and things: ", { term: más alto que }, ", ", { term: tan alto como }, ", ", { term: el más alto }, ", ", { term: altísimo }, "."]
    es: ["Los comparativos y los superlativos comparan personas y cosas: ", { term: más alto que }, ", ", { term: tan alto como }, ", ", { term: el más alto }, ", ", { term: altísimo }, "."]
    uk: ["Ступені порівняння зіставляють людей і речі: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
  rule:
    en: ["Comparisons of more or less take ", { term: que }, ", and comparisons of equality take ", { term: como }, ":"]
    es: ["La comparación de superioridad o inferioridad lleva ", { term: que }, ", y la de igualdad, ", { term: como }, ":"]
    uk: ["Порівняння «більше» чи «менше» вимагає ", { term: "que" }, ", а порівняння рівності — ", { term: "como" }, ":"]
  ex: { examples: [["Ana es ", { target: más alta que }, " yo."], ["Ana es ", { target: tan alta como }, " yo."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { pattern: [más, { slot: adjective }, que] }
          rule: { en: "more … than", es: superioridad, uk: "більше … ніж" }
          ex: ["El avión es ", { target: más rápido que }, " el tren."]
          tr: { en: The plane is faster than the train., uk: "Літак швидший за потяг." }
        - level: A2
          point: { pattern: [menos, { slot: adjective }, que] }
          rule: { en: "less … than", es: inferioridad, uk: "менше … ніж" }
          ex: ["La fruta es ", { target: menos cara que }, " la carne."]
          tr: { en: Fruit is less expensive than meat., uk: "Фрукти дешевші за м’ясо." }
        - level: A2
          point: { pattern: [tan, { slot: adjective }, como] }
          rule: { en: "as … as", es: igualdad, uk: "такий же … як" }
          ex: ["Mi casa es ", { target: tan grande como }, " la tuya."]
          tr: { en: My house is as big as yours., uk: "Мій дім такий же великий, як твій." }
        - level: A2
          point: { alternatives: [mejor, peor] }
          rule:
            en: [{ term: mejor }, " and ", { term: peor }, " compare ", { term: bueno }, " and ", { term: malo }]
            es: [{ term: mejor }, " y ", { term: peor }, " comparan ", { term: bueno }, " y ", { term: malo }]
            uk: [{ term: "mejor" }, " і ", { term: "peor" }, " — порівняння від ", { term: "bueno" }, " і ", { term: "malo" }]
          ex: ["Este café es ", { target: mejor que }, " ese."]
          tr: { en: This coffee is better than that one., uk: "Ця кава краща за ту." }
        - level: A2
          point: { alternatives: [mayor, menor] }
          rule:
            en: "older and younger, for people"
            es: "más edad y menos edad, para personas"
            uk: "старший і молодший, про людей"
          ex: ["Mi hermano es ", { target: mayor que }, " yo."]
          tr: { en: My brother is older than me., uk: "Мій брат старший за мене." }
        - level: B1
          point: { en: Superlative, es: Superlativo, uk: "Найвищий ступінь" }
          rule:
            en: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група" } }] }
            es: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група" } }] }
            uk: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група" } }] }
          ex: ["Es ", { target: la más alta de }, " la clase."]
          tr: { en: "She's the tallest in the class.", uk: "Вона найвища в класі." }
        - level: B1
          point: -ísimo
          rule:
            en: ["very with more force: drop the last vowel and add ", { term: -ísimo }]
            es: ["muy con más fuerza: se quita la última vocal y se añade ", { term: -ísimo }]
            uk: ["«дуже» з більшою силою: відкиньте останню голосну й додайте ", { term: "-ísimo" }]
          ex: ["La comida está ", { target: buenísima }, "."]
          tr: { en: The food is really good., uk: "Їжа дуже-дуже смачна." }
        - level: B1
          point: más de
          rule:
            en: [{ term: más de }, " and ", { term: menos de }, " before a number"]
            es: [{ term: más de }, " y ", { term: menos de }, " delante de un número"]
            uk: [{ term: "más de" }, " і ", { term: "menos de" }, " перед числом"]
          ex: ["Hay ", { target: más de }, " cien personas."]
          tr: { en: There are more than a hundred people., uk: "Є понад сто людей." }
        - level: A2
          point: { pattern: [{ alternatives: [tanto, tanta, tantos, tantas] }, { slot: noun }, como] }
          rule:
            en: "as much or as many: it agrees with the noun"
            es: "igualdad con un sustantivo: concuerda con él"
            uk: "стільки ж: узгоджується з іменником"
          ex: ["No tengo ", { target: tantos }, " libros ", { target: como }, " tú."]
          tr: { en: "I don't have as many books as you.", uk: "У мене не так багато книжок, як у тебе." }
        - level: A2
          point: { pattern: [{ slot: verb }, tanto como] }
          rule:
            en: [{ term: tanto }, " after a verb never changes"]
            es: [{ term: tanto }, " detrás de un verbo no cambia"]
            uk: [{ term: "tanto" }, " після дієслова ніколи не змінюється"]
          ex: ["Trabajas ", { target: tanto como }, " yo."]
          tr: { en: You work as much as I do., uk: "Ти працюєш стільки ж, скільки я." }
        - level: B1
          point: { pattern: [igual de, { slot: adjective }, que] }
          rule: { en: just as, es: igualdad, uk: "так само, як" }
          ex: ["Es ", { target: igual de alto que }, " su padre."]
          tr: { en: "He's just as tall as his father.", uk: "Він такий же високий, як його батько." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["after ", { term: que }, " and ", { term: como }, ", the subject pronoun"]
            es: ["detrás de ", { term: que }, " y ", { term: como }, ", el pronombre sujeto"]
            uk: ["після ", { term: "que" }, " і ", { term: "como" }, " — особовий займенник у формі підмета"]
          ex: ["Eres más alto que ", { target: yo }, "."]
          tr: { en: You are taller than me., uk: "Ти вищий за мене." }

sections:
  - title: { en: "Form: comparatives", es: "Forma: los comparativos", uk: "Форма: вищий ступінь" }
    role: form
    content:
      - type: usage
        columns:
          - { key: comparison, label: { en: Comparison, es: Comparación, uk: "Порівняння" } }
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, comparison: { en: more, es: superioridad, uk: "більше" }, pattern: { pattern: [más, { slot: adjective }, que] }, ex: ["El avión es ", { target: más rápido que }, " el tren."], tr: { en: The plane is faster than the train., uk: "Літак швидший за потяг." } }
          - { level: A2, comparison: { en: less, es: inferioridad, uk: "менше" }, pattern: { pattern: [menos, { slot: adjective }, que] }, ex: ["La fruta es ", { target: menos cara que }, " la carne."], tr: { en: Fruit is less expensive than meat., uk: "Фрукти дешевші за м’ясо." } }
          - { level: A2, comparison: { en: equal, es: igualdad, uk: "рівність" }, pattern: { pattern: [tan, { slot: adjective }, como] }, ex: ["Ana es ", { target: tan alta como }, " su madre."], tr: { en: Ana is as tall as her mother., uk: "Ана така ж висока, як її мама." } }
          - { level: A2, comparison: { en: not equal, es: desigualdad, uk: "нерівність" }, pattern: { pattern: ["no", { slot: verb }, tan, { slot: adjective }, como] }, ex: ["El tren ", { target: no es tan rápido como }, " el avión."], tr: { en: "The train isn't as fast as the plane.", uk: "Потяг не такий швидкий, як літак." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The adjective agrees with the first noun:"
              es: "El adjetivo concuerda con el primer sustantivo:"
              uk: "Прикметник узгоджується з першим іменником:"
            ex: ["Las montañas son ", { target: más altas }, " que los edificios."]
            tr: { en: The mountains are higher than the buildings., uk: "Гори вищі за будинки." }
          - type: rule
            level: A2
            text:
              en: ["After ", { term: que }, " and ", { term: como }, ", a pronoun takes its subject form:"]
              es: ["Detrás de ", { term: que }, " y ", { term: como }, ", el pronombre va en su forma de sujeto:"]
              uk: ["Після ", { term: "que" }, " і ", { term: "como" }, " займенник стоїть у формі підмета:"]
            ex: { examples: [["Eres más alto que ", { target: yo }, "."], ["Canto tan mal como ", { target: tú }, "."]] }
            tr: { en: { examples: [You are taller than me., I sing as badly as you.] }, uk: { examples: ["Ти вищий за мене.", "Я співаю так само погано, як ти."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: más }, ", ", { term: menos }, " and ", { term: tan }, " also go before adverbs:"]
              es: [{ term: más }, ", ", { term: menos }, " y ", { term: tan }, " también van delante de adverbios:"]
              uk: [{ term: "más" }, ", ", { term: "menos" }, " і ", { term: "tan" }, " стоять також перед прислівниками:"]
            ex: ["Ana habla ", { target: más despacio que }, " Luis."]
            tr: { en: Ana speaks more slowly than Luis., uk: "Ана говорить повільніше, ніж Луїс." }
          - type: rule
            level: B1
            text:
              en: ["Before a number, ", { term: más de }, " and ", { term: menos de }, " replace ", { term: más que }, ":"]
              es: ["Delante de un número, ", { term: más de }, " y ", { term: menos de }, " sustituyen a ", { term: más que }, ":"]
              uk: ["Перед числом замість ", { term: "más que" }, " вживають ", { term: "más de" }, " і ", { term: "menos de" }, ":"]
            ex: ["Hay ", { target: más de }, " cien personas."]
            tr: { en: There are more than a hundred people., uk: "Є понад сто людей." }

  - title: { en: "Form: irregular", es: "Forma: los irregulares", uk: "Форма: неправильні" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: adjective, label: { en: Adjective, es: Adjetivo, uk: "Прикметник" }, features: { degree: pos } }
          - { key: comparative, label: { en: Comparative, es: Comparativo, uk: "Вищий ступінь" }, features: { degree: cmpr } }
          - { key: superlative, label: { en: Superlative, es: Superlativo, uk: "Найвищий ступінь" }, features: { degree: sprl } }
        rows:
          - { level: A2, adjective: bueno, comparative: { target: mejor }, superlative: ["el ", { target: mejor }] }
          - { level: A2, adjective: malo, comparative: { target: peor }, superlative: ["el ", { target: peor }] }
          - { level: A2, adjective: { en: [{ term: grande }, ", for age"], es: [{ term: grande }, ", para la edad"], uk: [{ term: "grande" }, ", про вік"] }, comparative: { target: mayor }, superlative: ["el ", { target: mayor }] }
          - { level: A2, adjective: { en: [{ term: pequeño }, ", for age"], es: [{ term: pequeño }, ", para la edad"], uk: [{ term: "pequeño" }, ", про вік"] }, comparative: { target: menor }, superlative: ["el ", { target: menor }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: mejor }, " and ", { term: peor }, " already mean more good and more bad:"]
              es: [{ term: mejor }, " y ", { term: peor }, " ya significan más bueno y más malo:"]
              uk: [{ term: "mejor" }, " і ", { term: "peor" }, " уже означають «кращий» і «гірший»:"]
            ex: ["Tu idea es ", { target: mejor }, " que la mía."]
            tr: { en: Your idea is better than mine., uk: "Твоя ідея краща за мою." }
          - type: rule
            level: A2
            text:
              en: [{ term: mayor }, " and ", { term: menor }, " compare the age of people; ", { term: más grande }, " compares size:"]
              es: [{ term: mayor }, " y ", { term: menor }, " comparan la edad de las personas; ", { term: más grande }, " compara el tamaño:"]
              uk: [{ term: "mayor" }, " і ", { term: "menor" }, " порівнюють вік людей; ", { term: "más grande" }, " порівнює розмір:"]
            ex: { examples: [["Mi hermana es ", { target: menor }, " que yo."], ["Mi casa es ", { target: más grande }, " que la tuya."]] }
            tr: { en: { examples: [My sister is younger than me., My house is bigger than yours.] }, uk: { examples: ["Моя сестра молодша за мене.", "Мій дім більший за твій."] } }
          - type: rule
            level: A2
            text:
              en: "These forms are the same for both genders and add -es in the plural:"
              es: "Estas formas son iguales para los dos géneros y añaden -es en plural:"
              uk: "Ці форми однакові для обох родів і в множині додають -es:"
            ex: ["Son mis hermanas ", { target: mayores }, "."]
            tr: { en: They are my older sisters., uk: "Це мої старші сестри." }

  - title: { en: Superlatives, es: Los superlativos, uk: "Найвищий ступінь" }
    role: form
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The superlative is ", { pattern: [{ alternatives: [el, la, los, las] }, { alternatives: [más, menos] }, { slot: adjective }] }, ":"]
              es: ["El superlativo es ", { pattern: [{ alternatives: [el, la, los, las] }, { alternatives: [más, menos] }, { slot: adjective }] }, ":"]
              uk: ["Найвищий ступінь — це ", { pattern: [{ alternatives: ["el", "la", "los", "las"] }, { alternatives: ["más", "menos"] }, { slot: "adjective" }] }, ":"]
            ex: ["Es ", { target: la más alta }, " de la clase."]
            tr: { en: "She's the tallest in the class.", uk: "Вона найвища в класі." }
          - type: rule
            level: B1
            text:
              en: [{ term: de }, " names the group, where English uses in or of:"]
              es: [{ term: de }, " introduce el grupo:"]
              uk: [{ term: "de" }, " позначає групу, як «у» в українській («найвища в класі»):"]
            ex: ["Es el río más largo ", { target: del }, " mundo."]
            tr: { en: "It's the longest river in the world.", uk: "Це найдовша річка у світі." }
          - type: rule
            level: B1
            text:
              en: ["The noun goes between the article and ", { term: más }, ":"]
              es: ["El sustantivo va entre el artículo y ", { term: más }, ":"]
              uk: ["Іменник стоїть між артиклем і ", { term: "más" }, ":"]
            ex: ["Es ", { target: la ciudad más grande }, " del país."]
            tr: { en: "It's the biggest city in the country.", uk: "Це найбільше місто країни." }
          - type: rule
            level: B1
            text:
              en: [{ alternatives: [{ term: el mejor }, { term: el peor }, { term: el mayor }, { term: el menor }] }, " take no ", { term: más }, ":"]
              es: [{ alternatives: [{ term: el mejor }, { term: el peor }, { term: el mayor }, { term: el menor }] }, " no llevan ", { term: más }, ":"]
              uk: [{ alternatives: [{ term: "el mejor" }, { term: "el peor" }, { term: "el mayor" }, { term: "el menor" }] }, " вживаються без ", { term: "más" }, ":"]
            ex: ["Es ", { target: el mejor }, " restaurante de la ciudad."]
            tr: { en: "It's the best restaurant in the city.", uk: "Це найкращий ресторан у місті." }

  - title: { en: "-ísimo: very, with more force", es: "-ísimo: muy, con más fuerza", uk: "-ísimo: «дуже», з більшою силою" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: -ísimo }, " says very with more force: drop the last vowel and add ", { term: -ísimo }, "; it agrees like any adjective:"]
              es: [{ term: -ísimo }, " dice muy con más fuerza: se quita la última vocal y se añade ", { term: -ísimo }, "; concuerda como cualquier adjetivo:"]
              uk: [{ term: "-ísimo" }, " означає «дуже» з більшою силою: відкиньте останню голосну й додайте ", { term: "-ísimo" }, "; узгоджується, як будь-який прикметник:"]
            ex: { examples: [["un libro ", { target: carísimo }], ["una película ", { target: buenísima }]] }
            tr: { en: { examples: [a really expensive book, a really good film] }, uk: { examples: ["дуже-дуже дорога книжка", "дуже-дуже хороший фільм"] } }
          - type: rule
            level: B1
            text:
              en: ["It says the same as ", { term: muy }, ", with more force:"]
              es: ["Dice lo mismo que ", { term: muy }, ", con más fuerza:"]
              uk: ["Воно означає те саме, що ", { term: "muy" }, ", але з більшою силою:"]
            ex: { equivalence: [muy caro, { target: carísimo }] }
          - type: rule
            level: B1
            text:
              en: ["After a consonant, ", { term: -ísimo }, " joins the whole word:"]
              es: ["Detrás de consonante, ", { term: -ísimo }, " se une a la palabra entera:"]
              uk: ["Після приголосної ", { term: "-ísimo" }, " приєднується до всього слова:"]
            ex: { mapping: [fácil, { target: facilísimo }] }
          - type: rule
            level: B1
            text:
              en: "The spelling changes to keep the sound:"
              es: "La ortografía cambia para mantener el sonido:"
              uk: "Написання змінюється, щоб зберегти звук:"
            ex: { examples: [{ mapping: [rico, { target: riquísimo }] }, { mapping: [largo, { target: larguísimo }] }, { mapping: [feliz, { target: felicísimo }] }] }

  - title: { en: "Use: nouns and verbs", es: "Uso: con sustantivos y verbos", uk: "Вживання: з іменниками й дієсловами" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: "a noun, more or less", es: "un sustantivo, más o menos", uk: "іменник: більше чи менше" }, pattern: { pattern: [{ alternatives: [más, menos] }, { slot: noun }, que] }, ex: ["Tengo ", { target: más }, " trabajo ", { target: que }, " tú."], tr: { en: I have more work than you., uk: "У мене більше роботи, ніж у тебе." } }
          - { level: A2, use: { en: "a noun, as much or as many", es: "un sustantivo, igualdad", uk: "іменник: стільки ж" }, pattern: { pattern: [{ alternatives: [tanto, tanta, tantos, tantas] }, { slot: noun }, como] }, ex: ["No tengo ", { target: tantos }, " amigos ", { target: como }, " tú."], tr: { en: "I don't have as many friends as you.", uk: "У мене не так багато друзів, як у тебе." } }
          - { level: A2, use: { en: "a verb", es: "un verbo", uk: "дієслово" }, pattern: { pattern: [{ slot: verb }, { alternatives: [más que, menos que, tanto como] }] }, ex: ["Trabajas ", { target: tanto como }, " yo."], tr: { en: You work as much as I do., uk: "Ти працюєш стільки ж, скільки я." } }
          - { level: B1, use: { en: "an adjective, just as", es: "un adjetivo, igualdad", uk: "прикметник: так само" }, pattern: { pattern: [igual de, { slot: adjective }, que] }, ex: ["Es ", { target: igual de alto que }, " su padre."], tr: { en: "He's just as tall as his father.", uk: "Він такий же високий, як його батько." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tanto }, " before a noun agrees with it; after a verb it stays ", { term: tanto }, "."]
              es: [{ term: tanto }, " delante de un sustantivo concuerda con él; detrás de un verbo no cambia."]
              uk: [{ term: "tanto" }, " перед іменником узгоджується з ним; після дієслова залишається ", { term: "tanto" }, "."]

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Es más alto como yo., right: ["Es más alto ", { target: que }, " yo."], rule: { en: [{ term: más }, " takes ", { term: que }], es: [{ term: más }, " lleva ", { term: que }], uk: [{ term: "más" }, " вимагає ", { term: "que" }] } }
