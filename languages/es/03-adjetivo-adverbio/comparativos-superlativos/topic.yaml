          - level: B2
            structure: { pattern: [la mitad, de, { slot: noun }, que] }
            use: { es: "parte", en: "fraction", uk: "частка", pt: "parte", fr: "fraction", de: "Bruchteil", it: "frazione", pl: "ułamek", tr: "kesir", id: "bagian", vi: "phần" }
            ex: ["Tengo ", { target: la mitad de }, " tiempo que tú."]
