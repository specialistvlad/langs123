            use: { es: "el adjetivo ya es superlativo: lleva solo el artículo", en: "the adjective is already a superlative: it takes only the article", uk: "прикметник уже має значення найвищого ступеня: потрібен лише артикль", pt: "o adjetivo já é superlativo: leva só o artigo", fr: "l’adjectif est déjà un superlatif : il prend seulement l’article", de: "das Adjektiv ist schon ein Superlativ: Es steht nur mit dem Artikel", it: "l'aggettivo è già un superlativo: vuole solo l'articolo", pl: "przymiotnik sam jest już stopniem najwyższym: potrzebuje tylko przedimka", tr: "sıfat zaten üstünlük derecesindedir: yalnızca artikel alır", id: "kata sifat itu sudah superlatif: cukup memakai artikel", vi: "tính từ đã là so sánh nhất: chỉ cần mạo từ" }
