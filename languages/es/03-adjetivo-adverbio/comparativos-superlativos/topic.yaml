              fr: ["Après ", { term: "que" }, " et ", { term: "como" }, ", le pronom prend sa forme sujet :"]
              de: ["Nach ", { term: "que" }, " und ", { term: "como" }, " steht das Pronomen in der Subjektform:"]
              it: ["Dopo ", { term: "que" }, " e ", { term: "como" }, " il pronome ha la forma del soggetto:"]
              pl: ["Po ", { term: "que" }, " i ", { term: "como" }, " zaimek stoi w mianowniku:"]
              tr: [{ term: "que" }, " ve ", { term: "como" }, " sonrasında zamir özne biçimini alır:"]
              id: ["Setelah ", { term: "que" }, " dan ", { term: "como" }, ", kata ganti memakai bentuk subjek:"]
              vi: ["Sau ", { term: "que" }, " và ", { term: "como" }, ", đại từ ở dạng chủ ngữ:"]
            ex: { examples: [["Eres más alto que ", { target: yo }, "."], ["Canto tan mal como ", { target: tú }, "."]] }
            tr: { en: { examples: [You are taller than me., I sing as badly as you.] }, uk: { examples: ["Ти вищий за мене.", "Я співаю так само погано, як ти."] }, pt: { examples: ["Você é mais alto que eu.", "Canto tão mal quanto você."] }, fr: { examples: ["Tu es plus grand que moi.", "Je chante aussi mal que toi."] }, de: { examples: ["Du bist größer als ich.", "Ich singe genauso schlecht wie du."] }, it: { examples: ["Sei più alto di me.", "Canto male quanto te."] }, pl: { examples: ["Jesteś wyższy ode mnie.", "Śpiewam tak samo źle jak ty."] }, tr: { examples: ["Sen benden daha uzunsun.", "Ben de senin kadar kötü şarkı söylüyorum."] }, id: { examples: ["Kamu lebih tinggi daripada saya.", "Saya bernyanyi sejelek kamu."] }, vi: { examples: ["Bạn cao hơn tôi.", "Tôi hát dở như bạn."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: más }, ", ", { term: menos }, " and ", { term: tan }, " also go before adverbs:"]
              es: [{ term: más }, ", ", { term: menos }, " y ", { term: tan }, " también van delante de adverbios:"]
              uk: [{ term: "más" }, ", ", { term: "menos" }, " і ", { term: "tan" }, " стоять також перед прислівниками:"]
              pt: [{ term: "más" }, ", ", { term: "menos" }, " e ", { term: "tan" }, " também vêm antes de advérbios:"]
              fr: [{ term: "más" }, ", ", { term: "menos" }, " et ", { term: "tan" }, " se placent aussi devant des adverbes :"]
              de: [{ term: "más" }, ", ", { term: "menos" }, " und ", { term: "tan" }, " stehen auch vor Adverbien:"]
              it: [{ term: "más" }, ", ", { term: "menos" }, " e ", { term: "tan" }, " vanno anche davanti agli avverbi:"]
              pl: [{ term: "más" }, ", ", { term: "menos" }, " i ", { term: "tan" }, " stoją też przed przysłówkami:"]
              tr: [{ term: "más" }, ", ", { term: "menos" }, " ve ", { term: "tan" }, " zarflardan önce de gelir:"]
              id: [{ term: "más" }, ", ", { term: "menos" }, " dan ", { term: "tan" }, " juga berada di depan kata keterangan:"]
              vi: [{ term: "más" }, ", ", { term: "menos" }, " và ", { term: "tan" }, " cũng đứng trước trạng từ:"]
            ex: ["Ana habla ", { target: más despacio que }, " Luis."]
            tr: { en: Ana speaks more slowly than Luis., uk: "Ана говорить повільніше, ніж Луїс.", pt: "Ana fala mais devagar que Luis.", fr: "Ana parle plus lentement que Luis.", de: "Ana spricht langsamer als Luis.", it: "Ana parla più lentamente di Luis.", pl: "Ana mówi wolniej niż Luis.", tr: "Ana, Luis'ten daha yavaş konuşuyor.", id: "Ana berbicara lebih pelan daripada Luis.", vi: "Ana nói chậm hơn Luis." }
          - type: rule
            level: B1
            text:
              en: ["Before a number, ", { term: más de }, " and ", { term: menos de }, " replace ", { term: más que }, ":"]
              es: ["Delante de un número, ", { term: más de }, " y ", { term: menos de }, " sustituyen a ", { term: más que }, ":"]
              uk: ["Перед числом замість ", { term: "más que" }, " вживають ", { term: "más de" }, " і ", { term: "menos de" }, ":"]
              pt: ["Antes de um número, ", { term: "más de" }, " e ", { term: "menos de" }, " substituem ", { term: "más que" }, ":"]
              fr: ["Devant un nombre, ", { term: "más de" }, " et ", { term: "menos de" }, " remplacent ", { term: "más que" }, " :"]
              de: ["Vor einer Zahl ersetzen ", { term: "más de" }, " und ", { term: "menos de" }, " die Form ", { term: "más que" }, ":"]
              it: ["Davanti a un numero, ", { term: "más de" }, " e ", { term: "menos de" }, " sostituiscono ", { term: "más que" }, ":"]
              pl: ["Przed liczbą ", { term: "más de" }, " i ", { term: "menos de" }, " zastępują ", { term: "más que" }, ":"]
              tr: ["Sayıdan önce ", { term: "más de" }, " ve ", { term: "menos de" }, " ifadeleri ", { term: "más que" }, " yerine kullanılır:"]
              id: ["Di depan angka, ", { term: "más de" }, " dan ", { term: "menos de" }, " menggantikan ", { term: "más que" }, ":"]
              vi: ["Trước một con số, ", { term: "más de" }, " và ", { term: "menos de" }, " thay cho ", { term: "más que" }, ":"]
            ex: ["Hay ", { target: más de }, " cien personas."]
            tr: { en: There are more than a hundred people., uk: "Є понад сто людей.", pt: "Há mais de cem pessoas.", fr: "Il y a plus de cent personnes.", de: "Es sind mehr als hundert Leute da.", it: "Ci sono più di cento persone.", pl: "Jest ponad sto osób.", tr: "Yüzden fazla kişi var.", id: "Ada lebih dari seratus orang.", vi: "Có hơn một trăm người." }

  - title: { en: "Form: irregular", es: "Forma: los irregulares", uk: "Форма: неправильні", pt: "Forma: os irregulares", fr: "Forme : les formes irrégulières", de: "Form: unregelmäßige Formen", it: "Forma: le forme irregolari", pl: "Forma: formy nieregularne", tr: "Biçim: düzensiz biçimler", id: "Bentuk: bentuk tidak beraturan", vi: "Dạng: bất quy tắc" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: adjective, label: { en: Adjective, es: Adjetivo, uk: "Прикметник", pt: "Adjetivo", fr: "Adjectif", de: "Adjektiv", it: "Aggettivo", pl: "Przymiotnik", tr: "Sıfat", id: "Kata sifat", vi: "Tính từ" }, features: { degree: pos } }
          - { key: comparative, label: { en: Comparative, es: Comparativo, uk: "Вищий ступінь", pt: "Comparativo", fr: "Comparatif", de: "Komparativ", it: "Comparativo", pl: "Stopień wyższy", tr: "Karşılaştırma derecesi", id: "Komparatif", vi: "So sánh hơn" }, features: { degree: cmpr } }
          - { key: superlative, label: { en: Superlative, es: Superlativo, uk: "Найвищий ступінь", pt: "Superlativo", fr: "Superlatif", de: "Superlativ", it: "Superlativo", pl: "Stopień najwyższy", tr: "Üstünlük derecesi", id: "Superlatif", vi: "So sánh nhất" }, features: { degree: sprl } }
        rows:
          - { level: A2, adjective: bueno, comparative: { target: mejor }, superlative: ["el ", { target: mejor }] }
          - { level: A2, adjective: malo, comparative: { target: peor }, superlative: ["el ", { target: peor }] }
          - { level: A2, adjective: { en: [{ term: grande }, ", for age"], es: [{ term: grande }, ", para la edad"], uk: [{ term: "grande" }, ", про вік"], pt: [{ term: "grande" }, ", para a idade"], fr: [{ term: "grande" }, ", pour l’âge"], de: [{ term: "grande" }, ", für das Alter"], it: [{ term: "grande" }, ", per l'età"], pl: [{ term: "grande" }, ", o wieku"], tr: [{ term: "grande" }, ", yaş için"], id: [{ term: "grande" }, ", untuk usia"], vi: [{ term: "grande" }, ", nói về tuổi"] }, comparative: { target: mayor }, superlative: ["el ", { target: mayor }] }
          - { level: A2, adjective: { en: [{ term: pequeño }, ", for age"], es: [{ term: pequeño }, ", para la edad"], uk: [{ term: "pequeño" }, ", про вік"], pt: [{ term: "pequeño" }, ", para a idade"], fr: [{ term: "pequeño" }, ", pour l’âge"], de: [{ term: "pequeño" }, ", für das Alter"], it: [{ term: "pequeño" }, ", per l'età"], pl: [{ term: "pequeño" }, ", o wieku"], tr: [{ term: "pequeño" }, ", yaş için"], id: [{ term: "pequeño" }, ", untuk usia"], vi: [{ term: "pequeño" }, ", nói về tuổi"] }, comparative: { target: menor }, superlative: ["el ", { target: menor }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: mejor }, " and ", { term: peor }, " already mean more good and more bad:"]
              es: [{ term: mejor }, " y ", { term: peor }, " ya significan más bueno y más malo:"]
              uk: [{ term: "mejor" }, " і ", { term: "peor" }, " уже означають «кращий» і «гірший»:"]
              pt: [{ term: "mejor" }, " e ", { term: "peor" }, " já significam “melhor” e “pior”:"]
              fr: [{ term: "mejor" }, " et ", { term: "peor" }, " signifient déjà « meilleur » et « pire » :"]
              de: [{ term: "mejor" }, " und ", { term: "peor" }, " bedeuten schon „besser“ und „schlechter“:"]
              it: [{ term: "mejor" }, " e ", { term: "peor" }, " significano già «migliore» e «peggiore»:"]
              pl: [{ term: "mejor" }, " i ", { term: "peor" }, " znaczą już „lepszy” i „gorszy”:"]
              tr: [{ term: "mejor" }, " ve ", { term: "peor" }, " zaten “daha iyi” ve “daha kötü” anlamına gelir:"]
              id: [{ term: "mejor" }, " dan ", { term: "peor" }, " sudah berarti “lebih baik” dan “lebih buruk”:"]
              vi: [{ term: "mejor" }, " và ", { term: "peor" }, " đã có nghĩa là “tốt hơn” và “tệ hơn”:"]
            ex: ["Tu idea es ", { target: mejor }, " que la mía."]
            tr: { en: Your idea is better than mine., uk: "Твоя ідея краща за мою.", pt: "Sua ideia é melhor que a minha.", fr: "Ton idée est meilleure que la mienne.", de: "Deine Idee ist besser als meine.", it: "La tua idea è migliore della mia.", pl: "Twój pomysł jest lepszy niż mój.", tr: "Senin fikrin benimkinden daha iyi.", id: "Idemu lebih baik daripada ideku.", vi: "Ý của bạn hay hơn ý của tôi." }
          - type: rule
            level: A2
            text:
              en: [{ term: mayor }, " and ", { term: menor }, " compare the age of people; ", { term: más grande }, " compares size:"]
              es: [{ term: mayor }, " y ", { term: menor }, " comparan la edad de las personas; ", { term: más grande }, " compara el tamaño:"]
              uk: [{ term: "mayor" }, " і ", { term: "menor" }, " порівнюють вік людей; ", { term: "más grande" }, " порівнює розмір:"]
              pt: [{ term: "mayor" }, " e ", { term: "menor" }, " comparam a idade das pessoas; ", { term: "más grande" }, " compara o tamanho:"]
              fr: [{ term: "mayor" }, " et ", { term: "menor" }, " comparent l’âge des personnes ; ", { term: "más grande" }, " compare la taille :"]
              de: [{ term: "mayor" }, " und ", { term: "menor" }, " vergleichen das Alter von Personen; ", { term: "más grande" }, " vergleicht die Größe:"]
              it: [{ term: "mayor" }, " e ", { term: "menor" }, " confrontano l'età delle persone; ", { term: "más grande" }, " confronta la dimensione:"]
              pl: [{ term: "mayor" }, " i ", { term: "menor" }, " porównują wiek osób; ", { term: "más grande" }, " porównuje rozmiar:"]
              tr: [{ term: "mayor" }, " ve ", { term: "menor" }, " insanların yaşını karşılaştırır; ", { term: "más grande" }, " ise büyüklüğü karşılaştırır:"]
              id: [{ term: "mayor" }, " dan ", { term: "menor" }, " membandingkan usia orang; ", { term: "más grande" }, " membandingkan ukuran:"]
