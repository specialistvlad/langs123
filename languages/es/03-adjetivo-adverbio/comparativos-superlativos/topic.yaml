        rows:
          - { level: A2, comparison: { en: more, es: superioridad, uk: "більше", pt: "mais", fr: "plus", de: "mehr", it: "più", pl: "więcej", tr: "daha fazla", id: "lebih", vi: "hơn" }, pattern: { pattern: [más, { slot: adjective }, que] }, ex: ["El avión es ", { target: más rápido que }, " el tren."], tr: { en: The plane is faster than the train., uk: "Літак швидший за потяг.", pt: "O avião é mais rápido que o trem.", fr: "L’avion est plus rapide que le train.", de: "Das Flugzeug ist schneller als der Zug.", it: "L'aereo è più veloce del treno.", pl: "Samolot jest szybszy niż pociąg.", tr: "Uçak trenden daha hızlı.", id: "Pesawat lebih cepat daripada kereta.", vi: "Máy bay nhanh hơn tàu hỏa." } }
          - { level: A2, comparison: { en: less, es: inferioridad, uk: "менше", pt: "menos", fr: "moins", de: "weniger", it: "meno", pl: "mniej", tr: "daha az", id: "kurang", vi: "kém" }, pattern: { pattern: [menos, { slot: adjective }, que] }, ex: ["La fruta es ", { target: menos cara que }, " la carne."], tr: { en: Fruit is less expensive than meat., uk: "Фрукти дешевші за м’ясо.", pt: "A fruta é menos cara que a carne.", fr: "Les fruits sont moins chers que la viande.", de: "Obst ist weniger teuer als Fleisch.", it: "La frutta è meno cara della carne.", pl: "Owoce są tańsze niż mięso.", tr: "Meyve etten daha ucuz.", id: "Buah lebih murah daripada daging.", vi: "Trái cây rẻ hơn thịt." } }
          - { level: A2, comparison: { en: equal, es: igualdad, uk: "рівність", pt: "igualdade", fr: "égalité", de: "gleich", it: "uguaglianza", pl: "równość", tr: "eşitlik", id: "sama", vi: "ngang bằng" }, pattern: { pattern: [tan, { slot: adjective }, como] }, ex: ["Ana es ", { target: tan alta como }, " su madre."], tr: { en: Ana is as tall as her mother., uk: "Ана така ж висока, як її мама.", pt: "Ana é tão alta quanto a mãe dela.", fr: "Ana est aussi grande que sa mère.", de: "Ana ist so groß wie ihre Mutter.", it: "Ana è alta come sua madre.", pl: "Ana jest tak wysoka jak jej mama.", tr: "Ana annesi kadar uzun.", id: "Ana setinggi ibunya.", vi: "Ana cao bằng mẹ." } }
          - { level: A2, comparison: { en: not equal, es: desigualdad, uk: "нерівність", pt: "desigualdade", fr: "inégalité", de: "ungleich", it: "disuguaglianza", pl: "nierówność", tr: "eşitsizlik", id: "tidak sama", vi: "không ngang bằng" }, pattern: { pattern: ["no", { slot: verb }, tan, { slot: adjective }, como] }, ex: ["El tren ", { target: no es tan rápido como }, " el avión."], tr: { en: "The train isn't as fast as the plane.", uk: "Потяг не такий швидкий, як літак.", pt: "O trem não é tão rápido quanto o avião.", fr: "Le train n’est pas aussi rapide que l’avion.", de: "Der Zug ist nicht so schnell wie das Flugzeug.", it: "Il treno non è veloce come l'aereo.", pl: "Pociąg nie jest tak szybki jak samolot.", tr: "Tren uçak kadar hızlı değil.", id: "Kereta tidak secepat pesawat.", vi: "Tàu hỏa không nhanh bằng máy bay." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The adjective agrees with the first noun:"
              es: "El adjetivo concuerda con el primer sustantivo:"
              uk: "Прикметник узгоджується з першим іменником:"
              pt: "O adjetivo concorda com o primeiro substantivo:"
              fr: "L’adjectif s’accorde avec le premier nom :"
              de: "Das Adjektiv gleicht sich dem ersten Nomen an:"
              it: "L'aggettivo concorda con il primo sostantivo:"
              pl: "Przymiotnik zgadza się z pierwszym rzeczownikiem:"
              tr: "Sıfat, ilk isimle uyum sağlar:"
              id: "Kata sifat menyesuaikan diri dengan kata benda pertama:"
              vi: "Tính từ hòa hợp với danh từ thứ nhất:"
            ex: ["Las montañas son ", { target: más altas }, " que los edificios."]
            tr: { en: The mountains are higher than the buildings., uk: "Гори вищі за будинки.", pt: "As montanhas são mais altas que os prédios.", fr: "Les montagnes sont plus hautes que les immeubles.", de: "Die Berge sind höher als die Gebäude.", it: "Le montagne sono più alte degli edifici.", pl: "Góry są wyższe niż budynki.", tr: "Dağlar binalardan daha yüksek.", id: "Gunung lebih tinggi daripada gedung.", vi: "Những ngọn núi cao hơn các tòa nhà." }
          - type: rule
            level: A2
            text:
              en: ["After ", { term: que }, " and ", { term: como }, ", a pronoun takes its subject form:"]
              es: ["Detrás de ", { term: que }, " y ", { term: como }, ", el pronombre va en su forma de sujeto:"]
              uk: ["Після ", { term: "que" }, " і ", { term: "como" }, " займенник стоїть у формі підмета:"]
