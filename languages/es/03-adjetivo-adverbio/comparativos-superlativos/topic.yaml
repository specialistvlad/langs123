            ex: { examples: [["Corre ", { target: más que ninguno }, "."], ["Corre ", { target: menos que cualquiera }, "."]] }
            tr: { en: { examples: ["He runs more than anybody.", "He runs less than anybody."] }, uk: { examples: ["Він бігає більше за будь-кого.", "Він бігає менше за будь-кого."] }, pt: { examples: ["Ele corre mais que qualquer um.", "Ele corre menos que qualquer um."] }, fr: { examples: ["Il court plus que personne.", "Il court moins que n’importe qui."] }, de: { examples: ["Er läuft mehr als jeder andere.", "Er läuft weniger als jeder andere."] }, it: { examples: ["Corre più di chiunque.", "Corre meno di chiunque."] }, pl: { examples: ["Biega więcej niż ktokolwiek.", "Biega mniej niż ktokolwiek."] }, tr: { examples: ["Herkesten çok koşuyor.", "Herkesten az koşuyor."] }, id: { examples: ["Dia berlari lebih banyak daripada siapa pun.", "Dia berlari lebih sedikit daripada siapa pun."] }, vi: { examples: ["Anh ấy chạy nhiều hơn bất cứ ai.", "Anh ấy chạy ít hơn bất cứ ai."] } }
