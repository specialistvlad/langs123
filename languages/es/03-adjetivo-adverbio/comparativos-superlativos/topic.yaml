title: { en: Comparatives and Superlatives, es: Comparativos y superlativos, uk: "Вищий і найвищий ступені порівняння", pt: "Comparativos e superlativos", fr: "Comparatifs et superlatifs", de: "Komparativ und Superlativ", it: "Comparativi e superlativi", pl: "Stopniowanie przymiotników", tr: "Karşılaştırma ve üstünlük dereceleri", id: "Komparatif dan superlatif", vi: "So sánh hơn và so sánh nhất" }
summary:
  lead:
    en: ["Comparatives and superlatives compare people and things: ", { term: más alto que }, ", ", { term: tan alto como }, ", ", { term: el más alto }, ", ", { term: altísimo }, "."]
    es: ["Los comparativos y los superlativos comparan personas y cosas: ", { term: más alto que }, ", ", { term: tan alto como }, ", ", { term: el más alto }, ", ", { term: altísimo }, "."]
    uk: ["Ступені порівняння зіставляють людей і речі: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    pt: ["Os comparativos e os superlativos comparam pessoas e coisas: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    fr: ["Les comparatifs et les superlatifs comparent des personnes et des choses : ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    de: ["Komparativ und Superlativ vergleichen Personen und Dinge: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    it: ["I comparativi e i superlativi mettono a confronto persone e cose: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    pl: ["Stopniowanie przymiotników służy do porównywania osób i rzeczy: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    tr: ["Karşılaştırma ve üstünlük dereceleri kişileri ve nesneleri kıyaslar: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    id: ["Komparatif dan superlatif dipakai untuk membandingkan orang dan benda: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
    vi: ["Dạng so sánh hơn và so sánh nhất dùng để so sánh người và vật: ", { term: "más alto que" }, ", ", { term: "tan alto como" }, ", ", { term: "el más alto" }, ", ", { term: "altísimo" }, "."]
  rule:
    en: ["Comparisons of more or less take ", { term: que }, ", and comparisons of equality take ", { term: como }, ":"]
    es: ["La comparación de superioridad o inferioridad lleva ", { term: que }, ", y la de igualdad, ", { term: como }, ":"]
    uk: ["Порівняння «більше» чи «менше» вимагає ", { term: "que" }, ", а порівняння рівності — ", { term: "como" }, ":"]
    pt: ["A comparação de superioridade ou inferioridade leva ", { term: "que" }, ", e a de igualdade, ", { term: "como" }, ":"]
    fr: ["La comparaison de supériorité ou d’infériorité se fait avec ", { term: "que" }, ", et celle d’égalité avec ", { term: "como" }, " :"]
    de: ["Der Vergleich von Mehr oder Weniger steht mit ", { term: "que" }, ", der Vergleich der Gleichheit mit ", { term: "como" }, ":"]
    it: ["Il confronto di maggioranza o di minoranza vuole ", { term: "que" }, ", quello di uguaglianza vuole ", { term: "como" }, ":"]
    pl: ["Porównanie „więcej” lub „mniej” wymaga ", { term: "que" }, ", a porównanie równości — ", { term: "como" }, ":"]
    tr: ["Fazlalık ya da eksiklik karşılaştırması ", { term: "que" }, " ile, eşitlik karşılaştırması ise ", { term: "como" }, " ile kurulur:"]
    id: ["Perbandingan “lebih” atau “kurang” memakai ", { term: "que" }, ", dan perbandingan kesamaan memakai ", { term: "como" }, ":"]
    vi: ["So sánh hơn hoặc kém dùng ", { term: "que" }, ", còn so sánh bằng dùng ", { term: "como" }, ":"]
  ex: { examples: [["Ana es ", { target: más alta que }, " yo."], ["Ana es ", { target: tan alta como }, " yo."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: A2
          point: { pattern: [más, { slot: adjective }, que] }
          rule: { en: "more … than", es: superioridad, uk: "більше … ніж", pt: "mais … do que", fr: "plus … que", de: "mehr … als", it: "più … di", pl: "bardziej … niż", tr: "-den daha …", id: "lebih … daripada", vi: "… hơn …" }
          ex: ["El avión es ", { target: más rápido que }, " el tren."]
          tr: { en: The plane is faster than the train., uk: "Літак швидший за потяг.", pt: "O avião é mais rápido que o trem.", fr: "L’avion est plus rapide que le train.", de: "Das Flugzeug ist schneller als der Zug.", it: "L'aereo è più veloce del treno.", pl: "Samolot jest szybszy niż pociąg.", tr: "Uçak trenden daha hızlı.", id: "Pesawat lebih cepat daripada kereta.", vi: "Máy bay nhanh hơn tàu hỏa." }
        - level: A2
          point: { pattern: [menos, { slot: adjective }, que] }
          rule: { en: "less … than", es: inferioridad, uk: "менше … ніж", pt: "menos … do que", fr: "moins … que", de: "weniger … als", it: "meno … di", pl: "mniej … niż", tr: "-den daha az …", id: "kurang … daripada", vi: "ít … hơn …" }
          ex: ["La fruta es ", { target: menos cara que }, " la carne."]
          tr: { en: Fruit is less expensive than meat., uk: "Фрукти дешевші за м’ясо.", pt: "A fruta é menos cara que a carne.", fr: "Les fruits sont moins chers que la viande.", de: "Obst ist weniger teuer als Fleisch.", it: "La frutta è meno cara della carne.", pl: "Owoce są tańsze niż mięso.", tr: "Meyve etten daha ucuz.", id: "Buah lebih murah daripada daging.", vi: "Trái cây rẻ hơn thịt." }
        - level: A2
          point: { pattern: [tan, { slot: adjective }, como] }
          rule: { en: "as … as", es: igualdad, uk: "такий же … як", pt: "tão … quanto", fr: "aussi … que", de: "so … wie", it: "così … come", pl: "tak … jak", tr: "… kadar …", id: "sama … dengan", vi: "… bằng …" }
          ex: ["Mi casa es ", { target: tan grande como }, " la tuya."]
          tr: { en: My house is as big as yours., uk: "Мій дім такий же великий, як твій.", pt: "Minha casa é tão grande quanto a sua.", fr: "Ma maison est aussi grande que la tienne.", de: "Mein Haus ist so groß wie deins.", it: "La mia casa è grande come la tua.", pl: "Mój dom jest tak duży jak twój.", tr: "Benim evim seninki kadar büyük.", id: "Rumah saya sebesar rumahmu.", vi: "Nhà tôi lớn bằng nhà bạn." }
        - level: A2
          point: { alternatives: [mejor, peor] }
          rule:
            en: [{ term: mejor }, " and ", { term: peor }, " compare ", { term: bueno }, " and ", { term: malo }]
            es: [{ term: mejor }, " y ", { term: peor }, " comparan ", { term: bueno }, " y ", { term: malo }]
            uk: [{ term: "mejor" }, " і ", { term: "peor" }, " — порівняння від ", { term: "bueno" }, " і ", { term: "malo" }]
            pt: [{ term: "mejor" }, " e ", { term: "peor" }, " são os comparativos de ", { term: "bueno" }, " e ", { term: "malo" }]
            fr: [{ term: "mejor" }, " et ", { term: "peor" }, " sont les comparatifs de ", { term: "bueno" }, " et ", { term: "malo" }]
            de: [{ term: "mejor" }, " und ", { term: "peor" }, " sind die Komparative von ", { term: "bueno" }, " und ", { term: "malo" }]
            it: [{ term: "mejor" }, " e ", { term: "peor" }, " sono i comparativi di ", { term: "bueno" }, " e ", { term: "malo" }]
            pl: [{ term: "mejor" }, " i ", { term: "peor" }, " to stopień wyższy od ", { term: "bueno" }, " i ", { term: "malo" }]
            tr: [{ term: "mejor" }, " ve ", { term: "peor" }, ", ", { term: "bueno" }, " ve ", { term: "malo" }, " sıfatlarının karşılaştırma derecesidir"]
            id: [{ term: "mejor" }, " dan ", { term: "peor" }, " adalah bentuk komparatif dari ", { term: "bueno" }, " dan ", { term: "malo" }]
            vi: [{ term: "mejor" }, " và ", { term: "peor" }, " là dạng so sánh hơn của ", { term: "bueno" }, " và ", { term: "malo" }]
          ex: ["Este café es ", { target: mejor que }, " ese."]
          tr: { en: This coffee is better than that one., uk: "Ця кава краща за ту.", pt: "Este café é melhor que aquele.", fr: "Ce café est meilleur que celui-là.", de: "Dieser Kaffee ist besser als jener.", it: "Questo caffè è migliore di quello.", pl: "Ta kawa jest lepsza niż tamta.", tr: "Bu kahve ondan daha iyi.", id: "Kopi ini lebih baik daripada kopi itu.", vi: "Cà phê này ngon hơn cà phê kia." }
        - level: A2
          point: { alternatives: [mayor, menor] }
          rule:
            en: "older and younger, for people"
            es: "más edad y menos edad, para personas"
            uk: "старший і молодший, про людей"
            pt: "mais velho e mais novo, para pessoas"
            fr: "plus âgé et plus jeune, pour les personnes"
            de: "älter und jünger, für Personen"
            it: "più anziano e più giovane, per le persone"
            pl: "starszy i młodszy, o ludziach"
            tr: "daha yaşlı ve daha genç, insanlar için"
            id: "lebih tua dan lebih muda, untuk orang"
            vi: "lớn tuổi hơn và nhỏ tuổi hơn, nói về người"
          ex: ["Mi hermano es ", { target: mayor que }, " yo."]
          tr: { en: My brother is older than me., uk: "Мій брат старший за мене.", pt: "Meu irmão é mais velho que eu.", fr: "Mon frère est plus âgé que moi.", de: "Mein Bruder ist älter als ich.", it: "Mio fratello è più grande di me.", pl: "Mój brat jest starszy ode mnie.", tr: "Ağabeyim benden büyük.", id: "Kakak laki-laki saya lebih tua daripada saya.", vi: "Anh trai tôi lớn tuổi hơn tôi." }
        - level: B1
          point: { en: Superlative, es: Superlativo, uk: "Найвищий ступінь", pt: "Superlativo", fr: "Superlatif", de: "Superlativ", it: "Superlativo", pl: "Stopień najwyższy", tr: "Üstünlük derecesi", id: "Superlatif", vi: "So sánh nhất" }
          rule:
            en: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            es: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            uk: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            pt: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            fr: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            de: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            it: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            pl: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            tr: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            id: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
            vi: { pattern: [{ alternatives: [el, la, los, las] }, más, { slot: adjective }, de, { slot: { en: group, es: grupo, uk: "група", pt: "grupo", fr: "groupe", de: "Gruppe", it: "gruppo", pl: "grupa", tr: "grup", id: "kelompok", vi: "nhóm" } }] }
          ex: ["Es ", { target: la más alta de }, " la clase."]
          tr: { en: "She's the tallest in the class.", uk: "Вона найвища в класі.", pt: "Ela é a mais alta da classe.", fr: "Elle est la plus grande de la classe.", de: "Sie ist die Größte in der Klasse.", it: "È la più alta della classe.", pl: "Ona jest najwyższa w klasie.", tr: "Sınıftaki en uzun boylu o.", id: "Dia yang tertinggi di kelas.", vi: "Cô ấy cao nhất lớp." }
        - level: B1
          point: -ísimo
          rule:
            en: ["very with more force: drop the last vowel and add ", { term: -ísimo }]
            es: ["muy con más fuerza: se quita la última vocal y se añade ", { term: -ísimo }]
            uk: ["«дуже» з більшою силою: відкиньте останню голосну й додайте ", { term: "-ísimo" }]
            pt: ["“muito” com mais força: tira-se a última vogal e acrescenta-se ", { term: "-ísimo" }]
            fr: ["« très » avec plus de force : on retire la dernière voyelle et on ajoute ", { term: "-ísimo" }]
            de: ["„sehr“ mit mehr Nachdruck: Der letzte Vokal fällt weg, dann hängt man ", { term: "-ísimo" }, " an"]
            it: ["«molto» con più forza: si toglie l'ultima vocale e si aggiunge ", { term: "-ísimo" }]
            pl: ["„bardzo” z większą siłą: odrzuca się ostatnią samogłoskę i dodaje ", { term: "-ísimo" }]
            tr: ["“çok” anlamını güçlendirir: son ünlü atılır ve ", { term: "-ísimo" }, " eklenir"]
            id: ["“sangat” yang lebih kuat: buang vokal terakhir, lalu tambahkan ", { term: "-ísimo" }]
            vi: ["“rất” mạnh hơn: bỏ nguyên âm cuối rồi thêm ", { term: "-ísimo" }]
          ex: ["La comida está ", { target: buenísima }, "."]
          tr: { en: The food is really good., uk: "Їжа дуже-дуже смачна.", pt: "A comida está muito boa.", fr: "La nourriture est vraiment très bonne.", de: "Das Essen ist richtig gut.", it: "Il cibo è buonissimo.", pl: "Jedzenie jest przepyszne.", tr: "Yemek çok ama çok güzel.", id: "Makanannya enak sekali.", vi: "Món ăn ngon vô cùng." }
        - level: B1
          point: más de
          rule:
            en: [{ term: más de }, " and ", { term: menos de }, " before a number"]
            es: [{ term: más de }, " y ", { term: menos de }, " delante de un número"]
            uk: [{ term: "más de" }, " і ", { term: "menos de" }, " перед числом"]
            pt: [{ term: "más de" }, " e ", { term: "menos de" }, " antes de um número"]
            fr: [{ term: "más de" }, " et ", { term: "menos de" }, " devant un nombre"]
            de: [{ term: "más de" }, " und ", { term: "menos de" }, " vor einer Zahl"]
            it: [{ term: "más de" }, " e ", { term: "menos de" }, " davanti a un numero"]
            pl: [{ term: "más de" }, " i ", { term: "menos de" }, " przed liczbą"]
            tr: [{ term: "más de" }, " ve ", { term: "menos de" }, " sayıdan önce kullanılır"]
            id: [{ term: "más de" }, " dan ", { term: "menos de" }, " di depan angka"]
            vi: [{ term: "más de" }, " và ", { term: "menos de" }, " trước một con số"]
          ex: ["Hay ", { target: más de }, " cien personas."]
          tr: { en: There are more than a hundred people., uk: "Є понад сто людей.", pt: "Há mais de cem pessoas.", fr: "Il y a plus de cent personnes.", de: "Es sind mehr als hundert Leute da.", it: "Ci sono più di cento persone.", pl: "Jest ponad sto osób.", tr: "Yüzden fazla kişi var.", id: "Ada lebih dari seratus orang.", vi: "Có hơn một trăm người." }
        - level: A2
          point: { pattern: [{ alternatives: [tanto, tanta, tantos, tantas] }, { slot: noun }, como] }
          rule:
            en: "as much or as many: it agrees with the noun"
            es: "igualdad con un sustantivo: concuerda con él"
            uk: "стільки ж: узгоджується з іменником"
            pt: "igualdade com um substantivo: concorda com ele"
            fr: "égalité avec un nom : il s’accorde avec lui"
            de: "Gleichheit bei einem Nomen: Es gleicht sich ihm an"
            it: "uguaglianza con un sostantivo: concorda con esso"
            pl: "równość przy rzeczowniku: zgadza się z nim"
            tr: "isimle eşitlik: isimle uyum sağlar"
            id: "kesamaan dengan kata benda: menyesuaikan diri dengan kata benda itu"
            vi: "ngang bằng với danh từ: hòa hợp với danh từ"
          ex: ["No tengo ", { target: tantos }, " libros ", { target: como }, " tú."]
          tr: { en: "I don't have as many books as you.", uk: "У мене не так багато книжок, як у тебе.", pt: "Não tenho tantos livros quanto você.", fr: "Je n’ai pas autant de livres que toi.", de: "Ich habe nicht so viele Bücher wie du.", it: "Non ho tanti libri quanto te.", pl: "Nie mam tylu książek co ty.", tr: "Senin kadar çok kitabım yok.", id: "Saya tidak punya buku sebanyak kamu.", vi: "Tôi không có nhiều sách như bạn." }
        - level: A2
          point: { pattern: [{ slot: verb }, tanto como] }
          rule:
            en: [{ term: tanto }, " after a verb never changes"]
            es: [{ term: tanto }, " detrás de un verbo no cambia"]
            uk: [{ term: "tanto" }, " після дієслова ніколи не змінюється"]
            pt: [{ term: "tanto" }, " depois de um verbo não muda"]
            fr: [{ term: "tanto" }, " après un verbe ne change jamais"]
            de: [{ term: "tanto" }, " nach einem Verb verändert sich nie"]
            it: [{ term: "tanto" }, " dopo un verbo non cambia"]
            pl: [{ term: "tanto" }, " po czasowniku się nie zmienia"]
            tr: [{ term: "tanto" }, " fiilden sonra gelirse değişmez"]
            id: [{ term: "tanto" }, " sesudah kata kerja tidak berubah"]
            vi: [{ term: "tanto" }, " sau động từ thì không thay đổi"]
          ex: ["Trabajas ", { target: tanto como }, " yo."]
          tr: { en: You work as much as I do., uk: "Ти працюєш стільки ж, скільки я.", pt: "Você trabalha tanto quanto eu.", fr: "Tu travailles autant que moi.", de: "Du arbeitest genauso viel wie ich.", it: "Lavori quanto me.", pl: "Pracujesz tyle co ja.", tr: "Sen de benim kadar çalışıyorsun.", id: "Kamu bekerja sebanyak saya.", vi: "Bạn làm việc nhiều như tôi." }
        - level: B1
          point: { pattern: [igual de, { slot: adjective }, que] }
          rule: { en: just as, es: igualdad, uk: "так само, як", pt: "exatamente como", fr: "tout aussi … que", de: "genauso … wie", it: "altrettanto … quanto", pl: "tak samo … jak", tr: "tam olarak … kadar", id: "sama … seperti", vi: "y như" }
          ex: ["Es ", { target: igual de alto que }, " su padre."]
          tr: { en: "He's just as tall as his father.", uk: "Він такий же високий, як його батько.", pt: "Ele é tão alto quanto o pai dele.", fr: "Il est aussi grand que son père.", de: "Er ist genauso groß wie sein Vater.", it: "È alto quanto suo padre.", pl: "Jest tak samo wysoki jak jego ojciec.", tr: "Babası kadar uzun.", id: "Dia setinggi ayahnya.", vi: "Anh ấy cao bằng bố mình." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["after ", { term: que }, " and ", { term: como }, ", the subject pronoun"]
            es: ["detrás de ", { term: que }, " y ", { term: como }, ", el pronombre sujeto"]
            uk: ["після ", { term: "que" }, " і ", { term: "como" }, " — особовий займенник у формі підмета"]
            pt: ["depois de ", { term: "que" }, " e ", { term: "como" }, ", o pronome sujeito"]
            fr: ["après ", { term: "que" }, " et ", { term: "como" }, ", le pronom sujet"]
            de: ["nach ", { term: "que" }, " und ", { term: "como" }, " steht das Subjektpronomen"]
            it: ["dopo ", { term: "que" }, " e ", { term: "como" }, ", il pronome soggetto"]
            pl: ["po ", { term: "que" }, " i ", { term: "como" }, " stoi zaimek w mianowniku"]
            tr: [{ term: "que" }, " ve ", { term: "como" }, " sonrasında özne zamiri kullanılır"]
            id: ["setelah ", { term: "que" }, " dan ", { term: "como" }, ", dipakai kata ganti subjek"]
            vi: ["sau ", { term: "que" }, " và ", { term: "como" }, " dùng đại từ chủ ngữ"]
          ex: ["Eres más alto que ", { target: yo }, "."]
          tr: { en: You are taller than me., uk: "Ти вищий за мене.", pt: "Você é mais alto que eu.", fr: "Tu es plus grand que moi.", de: "Du bist größer als ich.", it: "Sei più alto di me.", pl: "Jesteś wyższy ode mnie.", tr: "Sen benden daha uzunsun.", id: "Kamu lebih tinggi daripada saya.", vi: "Bạn cao hơn tôi." }

sections:
  - title: { en: "Form: comparatives", es: "Forma: los comparativos", uk: "Форма: вищий ступінь", pt: "Forma: os comparativos", fr: "Forme : les comparatifs", de: "Form: die Komparative", it: "Forma: i comparativi", pl: "Forma: stopień wyższy", tr: "Biçim: karşılaştırma dereceleri", id: "Bentuk: komparatif", vi: "Dạng: so sánh hơn" }
    role: form
    content:
      - type: usage
        columns:
          - { key: comparison, label: { en: Comparison, es: Comparación, uk: "Порівняння", pt: "Comparação", fr: "Comparaison", de: "Vergleich", it: "Confronto", pl: "Porównanie", tr: "Karşılaştırma", id: "Perbandingan", vi: "So sánh" } }
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
