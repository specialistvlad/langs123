          - { level: A2, use: { en: Directions, es: Indicaciones, uk: "Вказівки", pt: "Indicações", fr: "Indications", de: "Wegbeschreibungen", it: "Indicazioni", pl: "Wskazywanie drogi", tr: "Yol tarifi", id: "Petunjuk arah", vi: "Chỉ đường" }, ex: ["Sigue por esta calle y ", { target: gira }, " a la derecha."], tr: { en: "Go along this street and turn right.", uk: "Іди цією вулицею й поверни праворуч.", pt: "Siga por esta rua e vire à direita.", fr: "Continue sur cette rue et tourne à droite.", de: "Geh diese Straße entlang und biege rechts ab.", it: "Prosegui per questa strada e gira a destra.", pl: "Idź tą ulicą i skręć w prawo.", tr: "Bu caddeden devam et ve sağa dön.", id: "Lurus saja di jalan ini lalu belok kanan.", vi: "Cứ đi thẳng con đường này rồi rẽ phải." } }
