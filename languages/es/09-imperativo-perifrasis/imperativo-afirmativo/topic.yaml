sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tú }, ", ", { term: usted }, " and ", { term: ustedes }, " each have their own imperative form."]
              es: [{ term: tú }, ", ", { term: usted }, " y ", { term: ustedes }, " tienen cada uno su forma de imperativo."]
              uk: [{ term: "tú" }, ", ", { term: "usted" }, " і ", { term: "ustedes" }, " мають кожен свою форму наказового способу."]
              pt: [{ term: tú }, ", ", { term: usted }, " e ", { term: ustedes }, " têm, cada um, a sua forma de imperativo."]
              fr: [{ term: tú }, ", ", { term: usted }, " et ", { term: ustedes }, " ont chacun leur forme d’impératif."]
              de: [{ term: tú }, ", ", { term: usted }, " und ", { term: ustedes }, " haben jeweils eine eigene Imperativform."]
              it: [{ term: tú }, ", ", { term: usted }, " e ", { term: ustedes }, " hanno ciascuno la propria forma di imperativo."]
              pl: [{ term: tú }, ", ", { term: usted }, " i ", { term: ustedes }, " mają każdy własną formę trybu rozkazującego."]
              tr: [{ term: tú }, ", ", { term: usted }, " ve ", { term: ustedes }, " için ayrı ayrı emir kipi biçimleri vardır."]
              id: [{ term: tú }, ", ", { term: usted }, ", dan ", { term: ustedes }, " masing-masing punya bentuk kalimat perintah sendiri."]
              vi: [{ term: tú }, ", ", { term: usted }, " và ", { term: ustedes }, " mỗi ngôi có một dạng mệnh lệnh riêng."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українська ввічливо звертається до однієї людини формою множини: ", { l1: "Сідайте, будь ласка" }, ". Іспанська для ", { term: usted }, " бере форму однини: ", { term: "Siéntese, por favor" }, "."]
          - type: rule
            level: A2
            text:
              en: "The subject pronoun usually stays out: the form shows who is spoken to."
              es: "El pronombre sujeto suele quedar fuera: la forma indica a quién se habla."
              uk: "Займенник у ролі підмета зазвичай не вживають: форма показує, до кого звертаються."
              pt: "O pronome sujeito costuma ficar de fora: a forma mostra com quem se fala."
              fr: "Le pronom sujet reste le plus souvent absent : la forme indique à qui l’on parle."
              de: "Das Subjektpronomen fällt meist weg: Die Form zeigt, wer angesprochen wird."
              it: "Il pronome soggetto di solito si omette: la forma indica a chi si parla."
              pl: "Zaimek podmiotu zwykle się pomija: forma pokazuje, do kogo się mówi."
              tr: "Özne zamiri genellikle söylenmez: biçim, kime seslenildiğini gösterir."
              id: "Pronomina subjek biasanya dihilangkan: bentuknya menunjukkan siapa yang diajak bicara."
              vi: "Đại từ chủ ngữ thường được bỏ đi: dạng động từ cho biết đang nói với ai."
            ex: [{ target: Escucha }, ", por favor."]
            tr: { en: "Listen, please.", uk: "Послухай, будь ласка.", pt: "Escute, por favor.", fr: "Écoute, s’il te plaît.", de: "Hör bitte zu.", it: "Ascolta, per favore.", pl: "Posłuchaj, proszę.", tr: "Lütfen dinle.", id: "Tolong dengarkan.", vi: "Làm ơn nghe này." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
              uk: [{ term: "ustedes" }, " — це множина і для ", { term: "tú" }, ", і для ", { term: "usted" }, ":"]
              pt: [{ term: ustedes }, " é o plural de ", { term: tú }, " e de ", { term: usted }, ":"]
              fr: [{ term: ustedes }, " est le pluriel de ", { term: tú }, " et de ", { term: usted }, " :"]
              de: [{ term: ustedes }, " ist der Plural von ", { term: tú }, " und von ", { term: usted }, ":"]
              it: [{ term: ustedes }, " è il plurale di ", { term: tú }, " e di ", { term: usted }, ":"]
              pl: [{ term: ustedes }, " to liczba mnoga od ", { term: tú }, " i od ", { term: usted }, ":"]
              tr: [{ term: ustedes }, ", hem ", { term: tú }, " hem de ", { term: usted }, " için çoğul biçimdir:"]
              id: [{ term: ustedes }, " adalah bentuk jamak dari ", { term: tú }, " dan ", { term: usted }, ":"]
              vi: [{ term: ustedes }, " là số nhiều của cả ", { term: tú }, " lẫn ", { term: usted }, ":"]
            ex: [{ target: Pasen }, ", chicos."]
            tr: { en: "Come in, guys.", uk: "Заходьте, хлопці.", pt: "Entrem, pessoal.", fr: "Entrez, les gars.", de: "Kommt rein, Leute.", it: "Entrate, ragazzi.", pl: "Wejdźcie, chłopaki.", tr: "Girin, çocuklar.", id: "Masuklah, teman-teman.", vi: "Vào đi, các bạn." }
