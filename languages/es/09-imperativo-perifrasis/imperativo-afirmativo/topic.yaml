            ex: { examples: [[{ target: Pasa }, " y ", { target: siéntate }, "."], [{ target: Prueba }, " la sopa."]] }
            tr: { en: { examples: ["Come in and sit down.", "Try the soup."] }, uk: { examples: ["Заходь і сідай.", "Скуштуй суп."] }, pt: { examples: ["Entre e sente-se.", "Experimente a sopa."] }, fr: { examples: ["Entre et assieds-toi.", "Goûte la soupe."] }, de: { examples: ["Komm herein und setz dich.", "Probier die Suppe."] }, it: { examples: ["Entra e siediti.", "Assaggia la zuppa."] }, pl: { examples: ["Wejdź i usiądź.", "Spróbuj zupy."] }, tr: { examples: ["İçeri gir ve otur.", "Çorbayı dene."] }, id: { examples: ["Masuklah dan duduklah.", "Cobalah supnya."] }, vi: { examples: ["Mời vào và ngồi đi.", "Nếm thử món súp đi."] } }
