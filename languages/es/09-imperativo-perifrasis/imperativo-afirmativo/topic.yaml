            ex: { examples: [[{ target: Oye }, ", ¿tienes un lápiz?"], [{ target: Mira }, ", esta es mi casa."]] }
            tr: { en: { examples: ["Hey, have you got a pencil?", "Look, this is my house."] }, uk: { examples: ["Слухай, у тебе є олівець?", "Дивись, це мій дім."] }, pt: { examples: ["Ei, você tem um lápis?", "Olha, esta é a minha casa."] }, fr: { examples: ["Dis, tu as un crayon ?", "Regarde, c’est ma maison."] }, de: { examples: ["He, hast du einen Bleistift?", "Schau, das ist mein Haus."] }, it: { examples: ["Senti, hai una matita?", "Guarda, questa è casa mia."] }, pl: { examples: ["Słuchaj, masz ołówek?", "Patrz, to jest mój dom."] }, tr: { examples: ["Hey, kalemin var mı?", "Bak, burası benim evim."] }, id: { examples: ["Hei, kamu punya pensil?", "Lihat, ini rumahku."] }, vi: { examples: ["Này, bạn có bút chì không?", "Nhìn kìa, đây là nhà của tôi."] } }
          - level: A2
            use: { en: Apologising, es: Pedir disculpas, uk: "Перепросити", pt: "Pedir desculpas", fr: "S’excuser", de: "Sich entschuldigen", it: "Scusarsi", pl: "Przepraszanie", tr: "Özür dileme", id: "Meminta maaf", vi: "Xin lỗi" }
            ex: { examples: [[{ target: Perdona }, ", ¿qué hora es?"], [{ target: Perdone }, ", ¿dónde está la estación?"]] }
            tr: { en: { examples: ["Sorry, what time is it?", "Excuse me, where is the station?"] }, uk: { examples: ["Вибач, котра година?", "Перепрошую, де вокзал?"] }, pt: { examples: ["Desculpa, que horas são?", "Com licença, onde fica a estação?"] }, fr: { examples: ["Excuse-moi, quelle heure est-il ?", "Excusez-moi, où est la gare ?"] }, de: { examples: ["Entschuldige, wie spät ist es?", "Entschuldigen Sie, wo ist der Bahnhof?"] }, it: { examples: ["Scusa, che ore sono?", "Scusi, dov'è la stazione?"] }, pl: { examples: ["Przepraszam, która godzina?", "Przepraszam, gdzie jest dworzec?"] }, tr: { examples: ["Pardon, saat kaç?", "Affedersiniz, istasyon nerede?"] }, id: { examples: ["Maaf, jam berapa sekarang?", "Permisi, di mana stasiunnya?"] }, vi: { examples: ["Xin lỗi, mấy giờ rồi?", "Xin lỗi, nhà ga ở đâu ạ?"] } }
          - { level: A2, variety: es-ES, use: { en: Answering the phone, es: Contestar al teléfono, uk: "Відповісти на дзвінок", pt: "Atender o telefone", fr: "Répondre au téléphone", de: "Ans Telefon gehen", it: "Rispondere al telefono", pl: "Odbieranie telefonu", tr: "Telefonu açma", id: "Menjawab telepon", vi: "Nghe điện thoại" }, ex: { target: ¿Dígame? }, tr: { en: "Hello?", uk: "Алло?", pt: "Alô?", fr: "Allô ?", de: "Hallo?", it: "Pronto?", pl: "Halo?", tr: "Alo?", id: "Halo?", vi: "A lô?" } }
          - level: A2
            variety: es-419
            use: { en: "Answering the phone, with no imperative: ¿Bueno? in Mexico, ¿Aló? in the Andes and the Caribbean, ¿Hola? everywhere", es: "Contestar al teléfono, sin imperativo: ¿Bueno? en México, ¿Aló? en los Andes y el Caribe, ¿Hola? en todas partes", uk: "Відповісти на дзвінок без наказового способу: ¿Bueno? у Мексиці, ¿Aló? в Андах і на Карибах, ¿Hola? скрізь", pt: "Atender o telefone, sem imperativo: ¿Bueno? no México, ¿Aló? nos Andes e no Caribe, ¿Hola? em todo lugar", fr: "Répondre au téléphone, sans impératif : ¿Bueno? au Mexique, ¿Aló? dans les Andes et les Caraïbes, ¿Hola? partout", de: "Ans Telefon gehen, ohne Imperativ: ¿Bueno? in Mexiko, ¿Aló? in den Anden und in der Karibik, ¿Hola? überall", it: "Rispondere al telefono, senza imperativo: ¿Bueno? in Messico, ¿Aló? nelle Ande e ai Caraibi, ¿Hola? ovunque", pl: "Odbieranie telefonu, bez trybu rozkazującego: ¿Bueno? w Meksyku, ¿Aló? w Andach i na Karaibach, ¿Hola? wszędzie", tr: "Telefonu açma, emir kipi olmadan: Meksika'da ¿Bueno?, And ülkelerinde ve Karayipler'de ¿Aló?, her yerde ¿Hola?", id: "Menjawab telepon, tanpa kalimat perintah: ¿Bueno? di Meksiko, ¿Aló? di wilayah Andes dan Karibia, ¿Hola? di mana-mana", vi: "Nghe điện thoại, không dùng câu mệnh lệnh: ¿Bueno? ở Mexico, ¿Aló? ở vùng Andes và Caribe, ¿Hola? ở mọi nơi" }
