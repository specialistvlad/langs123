          tr: { en: "Go along this street and turn right.", uk: "Іди цією вулицею й поверни праворуч.", pt: "Siga por esta rua e vire à direita.", fr: "Continue sur cette rue et tourne à droite.", de: "Geh diese Straße entlang und biege rechts ab.", it: "Prosegui per questa strada e gira a destra.", pl: "Idź tą ulicą i skręć w prawo.", tr: "Bu caddeden devam et ve sağa dön.", id: "Lurus saja di jalan ini lalu belok kanan.", vi: "Cứ đi thẳng con đường này rồi rẽ phải." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
          rule:
            en: "invitations and offers"
            es: "invitaciones y ofrecimientos"
            uk: "запрошення та пропозиції"
            pt: "convites e ofertas"
            fr: "invitations et offres"
            de: "Einladungen und Angebote"
            it: "inviti e offerte"
            pl: "zaproszenia i propozycje"
            tr: "davetler ve teklifler"
            id: "ajakan dan tawaran"
            vi: "lời mời và lời đề nghị"
          ex: [{ target: Pasa }, " y ", { target: siéntate }, "."]
          tr: { en: "Come in and sit down.", uk: "Заходь і сідай.", pt: "Entre e sente-se.", fr: "Entre et assieds-toi.", de: "Komm herein und setz dich.", it: "Entra e siediti.", pl: "Wejdź i usiądź.", tr: "İçeri gir ve otur.", id: "Masuklah dan duduklah.", vi: "Mời vào và ngồi đi." }
        - level: A2
          point: { en: Fixed forms, es: Formas fijas, uk: "Сталі форми", pt: "Formas fixas", fr: "Formes figées", de: "Feste Wendungen", it: "Forme fisse", pl: "Formy utarte", tr: "Kalıplaşmış biçimler", id: "Bentuk tetap", vi: "Dạng cố định" }
          rule:
            en: [{ alternatives: [{ term: mira }, { term: oye }] }, " call for attention; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " say sorry"]
            es: [{ alternatives: [{ term: mira }, { term: oye }] }, " llaman la atención; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " piden disculpas"]
            uk: [{ alternatives: [{ term: "mira" }, { term: "oye" }] }, " привертають увагу; ", { alternatives: [{ term: "perdona" }, { term: "perdone" }] }, " — щоб перепросити"]
            pt: [{ alternatives: [{ term: mira }, { term: oye }] }, " chamam a atenção; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " pedem desculpas"]
            fr: [{ alternatives: [{ term: mira }, { term: oye }] }, " attirent l’attention ; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " servent à s’excuser"]
            de: [{ alternatives: [{ term: mira }, { term: oye }] }, " lenken die Aufmerksamkeit auf sich; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " dienen zum Entschuldigen"]
            it: [{ alternatives: [{ term: mira }, { term: oye }] }, " richiamano l'attenzione; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " servono a scusarsi"]
            pl: [{ alternatives: [{ term: mira }, { term: oye }] }, " zwracają uwagę; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " służą do przeprosin"]
            tr: [{ alternatives: [{ term: mira }, { term: oye }] }, " dikkat çeker; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " özür dilemek için kullanılır"]
            id: [{ alternatives: [{ term: mira }, { term: oye }] }, " menarik perhatian; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " dipakai untuk meminta maaf"]
            vi: [{ alternatives: [{ term: mira }, { term: oye }] }, " thu hút sự chú ý; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " dùng để xin lỗi"]
          ex: [{ target: Oye }, ", ¿tienes un lápiz?"]
          tr: { en: "Hey, have you got a pencil?", uk: "Слухай, у тебе є олівець?", pt: "Ei, você tem um lápis?", fr: "Dis, tu as un crayon ?", de: "He, hast du einen Bleistift?", it: "Senti, hai una matita?", pl: "Słuchaj, masz ołówek?", tr: "Hey, kalemin var mı?", id: "Hei, kamu punya pensil?", vi: "Này, bạn có bút chì không?" }
        - level: B2
          point: { es: Formas fijas }
          rule:
            es: [{ term: anda }, " anima, ", { term: vaya }, " sorprende y la orden repetida apremia"]
          ex: [{ target: Anda }, ", no te preocupes tanto."]
        - level: B2
          point: { es: Uso }
          rule:
            es: "un adverbio refuerza la orden; una fórmula de cortesía la atenúa"
          ex: { examples: [["Sal ", { target: inmediatamente }, "."], ["Sal, ", { target: si no te importa }, "."]] }
        - level: C1
          point: { es: Formas fijas }
          rule:
            es: [{ term: mira que }, " pondera una cualidad; ", { term: mira qué bien }, " es irónico"]
          ex: [{ target: Mira que }, " eres terco."]
        - level: C2
          point: { es: Formas fijas }
          rule:
            es: [{ term: toma }, " afirma con firmeza o con burla; ", { term: pero oye }, " reprocha"]
          ex: ["¡", { target: Toma }, "! Eso te pasa por presumido."]
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["the ", { term: tú }, " imperative has no final ", { letter: s }, ": ", { mapping: [{ term: hablas }, { term: habla }] }]
            es: ["el imperativo de ", { term: tú }, " no lleva ", { letter: s }, " final: ", { mapping: [{ term: hablas }, { term: habla }] }]
            uk: ["наказ для ", { term: "tú" }, " не має кінцевого ", { letter: "s" }, ": ", { mapping: [{ term: "hablas" }, { term: "habla" }] }]
            pt: ["o imperativo de ", { term: tú }, " não leva ", { letter: s }, " final: ", { mapping: [{ term: hablas }, { term: habla }] }]
            fr: ["l’impératif de ", { term: tú }, " ne prend pas de ", { letter: s }, " final : ", { mapping: [{ term: hablas }, { term: habla }] }]
            de: ["der Imperativ von ", { term: tú }, " hat kein ", { letter: s }, " am Ende: ", { mapping: [{ term: hablas }, { term: habla }] }]
            it: ["l'imperativo di ", { term: tú }, " non ha la ", { letter: s }, " finale: ", { mapping: [{ term: hablas }, { term: habla }] }]
            pl: ["tryb rozkazujący dla ", { term: tú }, " nie ma końcowego ", { letter: s }, ": ", { mapping: [{ term: hablas }, { term: habla }] }]
            tr: [{ term: tú }, " için emir kipinde sonda ", { letter: s }, " bulunmaz: ", { mapping: [{ term: hablas }, { term: habla }] }]
            id: ["kalimat perintah untuk ", { term: tú }, " tidak memakai ", { letter: s }, " di akhir: ", { mapping: [{ term: hablas }, { term: habla }] }]
            vi: ["dạng mệnh lệnh của ", { term: tú }, " không có ", { letter: s }, " ở cuối: ", { mapping: [{ term: hablas }, { term: habla }] }]
          ex: [{ target: Escucha }, ", por favor."]
          tr: { en: "Listen, please.", uk: "Послухай, будь ласка.", pt: "Escute, por favor.", fr: "Écoute, s’il te plaît.", de: "Hör bitte zu.", it: "Ascolta, per favore.", pl: "Posłuchaj, proszę.", tr: "Lütfen dinle.", id: "Tolong dengarkan.", vi: "Làm ơn nghe này." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tú }, ", ", { term: usted }, " and ", { term: ustedes }, " each have their own imperative form."]
              es: [{ term: tú }, ", ", { term: usted }, " y ", { term: ustedes }, " tienen cada uno su forma de imperativo."]
              uk: [{ term: "tú" }, ", ", { term: "usted" }, " і ", { term: "ustedes" }, " мають кожен свою форму наказового способу."]
              pt: [{ term: tú }, ", ", { term: usted }, " e ", { term: ustedes }, " têm, cada um, a sua forma de imperativo."]
              fr: [{ term: tú }, ", ", { term: usted }, " et ", { term: ustedes }, " ont chacun leur forme d’impératif."]
              de: [{ term: tú }, ", ", { term: usted }, " und ", { term: ustedes }, " haben jeweils eine eigene Imperativform."]
              it: [{ term: tú }, ", ", { term: usted }, " e ", { term: ustedes }, " hanno ciascuno la propria forma di imperativo."]
              pl: [{ term: tú }, ", ", { term: usted }, " i ", { term: ustedes }, " mają każdy własną formę trybu rozkazującego."]
              tr: [{ term: tú }, ", ", { term: usted }, " ve ", { term: ustedes }, " için ayrı ayrı emir kipi biçimleri vardır."]
              id: [{ term: tú }, ", ", { term: usted }, ", dan ", { term: ustedes }, " masing-masing punya bentuk kalimat perintah sendiri."]
              vi: [{ term: tú }, ", ", { term: usted }, " và ", { term: ustedes }, " mỗi ngôi có một dạng mệnh lệnh riêng."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українська ввічливо звертається до однієї людини формою множини: ", { l1: "Сідайте, будь ласка" }, ". Іспанська для ", { term: usted }, " бере форму однини: ", { term: "Siéntese, por favor" }, "."]
          - type: rule
            level: A2
            text:
              en: "The subject pronoun usually stays out: the form shows who is spoken to."
              es: "El pronombre sujeto suele quedar fuera: la forma indica a quién se habla."
              uk: "Займенник у ролі підмета зазвичай не вживають: форма показує, до кого звертаються."
              pt: "O pronome sujeito costuma ficar de fora: a forma mostra com quem se fala."
              fr: "Le pronom sujet reste le plus souvent absent : la forme indique à qui l’on parle."
              de: "Das Subjektpronomen fällt meist weg: Die Form zeigt, wer angesprochen wird."
              it: "Il pronome soggetto di solito si omette: la forma indica a chi si parla."
              pl: "Zaimek podmiotu zwykle się pomija: forma pokazuje, do kogo się mówi."
              tr: "Özne zamiri genellikle söylenmez: biçim, kime seslenildiğini gösterir."
              id: "Pronomina subjek biasanya dihilangkan: bentuknya menunjukkan siapa yang diajak bicara."
              vi: "Đại từ chủ ngữ thường được bỏ đi: dạng động từ cho biết đang nói với ai."
            ex: [{ target: Escucha }, ", por favor."]
            tr: { en: "Listen, please.", uk: "Послухай, будь ласка.", pt: "Escute, por favor.", fr: "Écoute, s’il te plaît.", de: "Hör bitte zu.", it: "Ascolta, per favore.", pl: "Posłuchaj, proszę.", tr: "Lütfen dinle.", id: "Tolong dengarkan.", vi: "Làm ơn nghe này." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
              uk: [{ term: "ustedes" }, " — це множина і для ", { term: "tú" }, ", і для ", { term: "usted" }, ":"]
              pt: [{ term: ustedes }, " é o plural de ", { term: tú }, " e de ", { term: usted }, ":"]
              fr: [{ term: ustedes }, " est le pluriel de ", { term: tú }, " et de ", { term: usted }, " :"]
              de: [{ term: ustedes }, " ist der Plural von ", { term: tú }, " und von ", { term: usted }, ":"]
              it: [{ term: ustedes }, " è il plurale di ", { term: tú }, " e di ", { term: usted }, ":"]
              pl: [{ term: ustedes }, " to liczba mnoga od ", { term: tú }, " i od ", { term: usted }, ":"]
              tr: [{ term: ustedes }, ", hem ", { term: tú }, " hem de ", { term: usted }, " için çoğul biçimdir:"]
              id: [{ term: ustedes }, " adalah bentuk jamak dari ", { term: tú }, " dan ", { term: usted }, ":"]
              vi: [{ term: ustedes }, " là số nhiều của cả ", { term: tú }, " lẫn ", { term: usted }, ":"]
            ex: [{ target: Pasen }, ", chicos."]
            tr: { en: "Come in, guys.", uk: "Заходьте, хлопці.", pt: "Entrem, pessoal.", fr: "Entrez, les gars.", de: "Kommt rein, Leute.", it: "Entrate, ragazzi.", pl: "Wejdźcie, chłopaki.", tr: "Girin, çocuklar.", id: "Masuklah, teman-teman.", vi: "Vào đi, các bạn." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: [{ term: vosotros }, " is the informal plural, and ", { term: ustedes }, " the formal one:"]
              es: [{ term: vosotros }, " es el plural informal, y ", { term: ustedes }, ", el formal:"]
              uk: [{ term: "vosotros" }, " — неформальна множина, а ", { term: "ustedes" }, " — формальна:"]
              pt: [{ term: vosotros }, " é o plural informal, e ", { term: ustedes }, ", o formal:"]
              fr: [{ term: vosotros }, " est le pluriel familier, et ", { term: ustedes }, ", le pluriel de politesse :"]
              de: [{ term: vosotros }, " ist der informelle Plural, ", { term: ustedes }, " der formelle:"]
              it: [{ term: vosotros }, " è il plurale informale e ", { term: ustedes }, " quello formale:"]
              pl: [{ term: vosotros }, " to nieformalna liczba mnoga, a ", { term: ustedes }, " — formalna:"]
              tr: [{ term: vosotros }, " resmî olmayan çoğuldur, ", { term: ustedes }, " ise resmî çoğuldur:"]
              id: [{ term: vosotros }, " adalah bentuk jamak tidak resmi, dan ", { term: ustedes }, " bentuk jamak resmi:"]
              vi: [{ term: vosotros }, " là số nhiều thân mật, còn ", { term: ustedes }, " là số nhiều trang trọng:"]
            ex: [{ target: Pasad }, ", chicos."]
            tr: { en: "Come in, guys.", uk: "Заходьте, хлопці.", pt: "Entrem, pessoal.", fr: "Entrez, les gars.", de: "Kommt rein, Leute.", it: "Entrate, ragazzi.", pl: "Wejdźcie, chłopaki.", tr: "Girin, çocuklar.", id: "Masuklah, teman-teman.", vi: "Vào đi, các bạn." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["Where people say ", { term: vos }, ", as in Argentina, Uruguay and Central America, the imperative stresses its last syllable: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              es: ["Donde se dice ", { term: vos }, ", como en Argentina, Uruguay y Centroamérica, el imperativo lleva el acento en la última sílaba: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              uk: ["Там, де кажуть ", { term: "vos" }, ", як в Аргентині, Уругваї та Центральній Америці, наголос у наказовому способі падає на останній склад: ", { alternatives: [{ term: "hablá" }, { term: "comé" }, { term: "escribí" }] }, "."]
              pt: ["Onde se diz ", { term: vos }, ", como na Argentina, no Uruguai e na América Central, o imperativo leva o acento na última sílaba: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              fr: ["Là où l’on dit ", { term: vos }, ", comme en Argentine, en Uruguay et en Amérique centrale, l’impératif porte l’accent sur la dernière syllabe : ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              de: ["Wo man ", { term: vos }, " sagt, etwa in Argentinien, Uruguay und Mittelamerika, wird der Imperativ auf der letzten Silbe betont: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              it: ["Dove si dice ", { term: vos }, ", come in Argentina, in Uruguay e in America centrale, l'imperativo ha l'accento sull'ultima sillaba: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              pl: ["Tam, gdzie mówi się ", { term: vos }, ", jak w Argentynie, Urugwaju i Ameryce Środkowej, tryb rozkazujący ma akcent na ostatniej sylabie: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              tr: ["Arjantin, Uruguay ve Orta Amerika gibi ", { term: vos }, " kullanılan yerlerde emir kipinin vurgusu son hecededir: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              id: ["Di tempat yang memakai ", { term: vos }, ", seperti Argentina, Uruguay, dan Amerika Tengah, tekanan pada bentuk perintah jatuh pada suku kata terakhir: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              vi: ["Ở những nơi dùng ", { term: vos }, ", như Argentina, Uruguay và Trung Mỹ, dạng mệnh lệnh có trọng âm ở âm tiết cuối: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
          - type: note
            level: A2
            text:
              en: ["When to say ", { term: tú }, " and when ", { term: usted }, ": ", { link: "Forms of Address: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              es: ["Cuándo decir ", { term: tú }, " y cuándo ", { term: usted }, ": ", { link: "Tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              uk: ["Коли казати ", { term: "tú" }, ", а коли ", { term: "usted" }, ": ", { link: "Форми звертання: tú, usted, vosotros, ustedes", to: "es.pronombres.tu-usted-vosotros-ustedes" }, "."]
              pt: ["Quando dizer ", { term: tú }, " e quando ", { term: usted }, ": ", { link: "Formas de tratamento: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              fr: ["Quand dire ", { term: tú }, " et quand ", { term: usted }, " : ", { link: "Formes d’adresse : tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              de: ["Wann man ", { term: tú }, " und wann ", { term: usted }, " sagt: ", { link: "Anredeformen: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              it: ["Quando dire ", { term: tú }, " e quando ", { term: usted }, ": ", { link: "Forme di cortesia: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              pl: ["Kiedy mówić ", { term: tú }, ", a kiedy ", { term: usted }, ": ", { link: "Formy zwracania się: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              tr: [{ term: tú }, " ne zaman, ", { term: usted }, " ne zaman kullanılır: ", { link: "Hitap biçimleri: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              id: ["Kapan memakai ", { term: tú }, " dan kapan ", { term: usted }, ": ", { link: "Bentuk sapaan: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              vi: ["Khi nào dùng ", { term: tú }, " và khi nào dùng ", { term: usted }, ": ", { link: "Cách xưng hô: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа", pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: escribir }
        rows:
          - { level: A2, features: { mood: imp, person: 2, number: sg, politeness: infm }, person: tú, ar: { target: habla }, er: { target: come }, ir: { target: escribe } }
          - { level: A2, features: { mood: imp, person: 2, number: sg, politeness: form }, person: usted, ar: { target: hable }, er: { target: coma }, ir: { target: escriba } }
          - { level: A2, variety: es-ES, features: { mood: imp, person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: hablad }, er: { target: comed }, ir: { target: escribid } }
          - { level: A2, features: { mood: imp, person: 2, number: pl }, person: ustedes, ar: { target: hablen }, er: { target: coman }, ir: { target: escriban } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The ", { term: tú }, " form is the ", { term: él }, " form of the present:"]
              es: ["La forma de ", { term: tú }, " es la forma de ", { term: él }, " del presente:"]
              uk: ["Форма для ", { term: "tú" }, " — це форма ", { term: "él" }, " теперішнього часу:"]
              pt: ["A forma de ", { term: tú }, " é a forma de ", { term: él }, " do presente:"]
              fr: ["La forme de ", { term: tú }, " est la forme de ", { term: él }, " au présent :"]
              de: ["Die ", { term: tú }, "-Form ist die ", { term: él }, "-Form des Präsens:"]
