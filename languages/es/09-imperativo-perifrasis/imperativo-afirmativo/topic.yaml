id: es.imperativo-perifrasis.imperativo-afirmativo
lang: es
kind: grammar
tags: [verbs, imperative, instructions]
concepts: [imperative]
related: [es.imperativo-perifrasis.imperativo-negativo, es.pronombres.tu-usted-vosotros-ustedes, es.pronombres.objeto-directo, es.pronombres.combinacion-pronombres, es.presente.presente-irregular, es.presente.verbos-reflexivos]
status: { en: draft, es: draft }
translated: { es: "ba92bb 89babf aed74c 5458a7 e62d5e 16ef14 711734 d7b170" }

title: { en: Imperative, es: El imperativo afirmativo }
summary:
  lead:
    en: ["The imperative gives instructions, directions and invitations: ", { term: habla }, " for ", { term: tú }, ", ", { term: hable }, " for ", { term: usted }, ", ", { term: hablen }, " for ", { term: ustedes }, "."]
    es: ["El imperativo da instrucciones, indicaciones e invitaciones: ", { term: habla }, " para ", { term: tú }, ", ", { term: hable }, " para ", { term: usted }, ", ", { term: hablen }, " para ", { term: ustedes }, "."]
  rule:
    en: "Object pronouns join the end of the verb, and a written accent keeps the stress in its place:"
    es: "Los pronombres de objeto se unen al final del verbo, y una tilde mantiene el acento en su sitio:"
  ex: { examples: [{ target: Cómpralo. }, [{ target: Siéntate }, ", por favor."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: tú }, ": the ", { term: él }, " form of the present"]
            es: [{ term: tú }, ": la forma de ", { term: él }, " del presente"]
          ex: [{ target: Habla }, " más despacio, por favor."]
          tr: { en: "Speak more slowly, please." }
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: usted }, ": ", { term: "-ar" }, " verbs end in ", { ending: e }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " verbs in ", { ending: a }]
            es: [{ term: usted }, ": los verbos en ", { term: "-ar" }, " terminan en ", { ending: e }, ", los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, ", en ", { ending: a }]
          ex: [{ target: Pase }, ", por favor."]
          tr: { en: "Come in, please." }
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: ustedes }, ": the ", { term: usted }, " form with ", { ending: n }]
            es: [{ term: ustedes }, ": la forma de ", { term: usted }, " con ", { ending: n }]
          ex: [{ target: Abran }, " los libros."]
          tr: { en: "Open your books." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vosotros }, ": the ", { letter: r }, " of the infinitive becomes ", { letter: d }]
            es: [{ term: vosotros }, ": la ", { letter: r }, " del infinitivo pasa a ", { letter: d }]
          ex: [{ target: Abrid }, " los libros."]
          tr: { en: "Open your books." }
        - level: A2
          point: { en: Irregular verbs, es: Verbos irregulares }
          rule:
            en: [{ term: tú }, ": ", { alternatives: [{ term: di }, { term: haz }, { term: pon }, { term: sal }, { term: ten }, { term: ven }, { term: ve }, { term: sé }] }]
            es: [{ term: tú }, ": ", { alternatives: [{ term: di }, { term: haz }, { term: pon }, { term: sal }, { term: ten }, { term: ven }, { term: ve }, { term: sé }] }]
          ex: [{ target: Ven }, " aquí."]
          tr: { en: "Come here." }
        - level: A2
          point: { en: Pronouns, es: Pronombres }
          rule:
            en: "object and reflexive pronouns join the end of the verb"
            es: "los pronombres de objeto y reflexivos se unen al final del verbo"
          ex: { examples: [{ target: Cómpralo. }, { target: Siéntate. }] }
          tr: { en: { examples: ["Buy it.", "Sit down."] } }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: "instructions, directions and requests"
            es: "instrucciones, indicaciones y peticiones"
          ex: ["Sigue por esta calle y ", { target: gira }, " a la derecha."]
          tr: { en: "Go along this street and turn right." }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: "invitations and offers"
            es: "invitaciones y ofrecimientos"
          ex: [{ target: Pasa }, " y ", { target: siéntate }, "."]
          tr: { en: "Come in and sit down." }
        - level: A2
          point: { en: Fixed forms, es: Formas fijas }
          rule:
            en: [{ alternatives: [{ term: mira }, { term: oye }] }, " call for attention; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " say sorry"]
            es: [{ alternatives: [{ term: mira }, { term: oye }] }, " llaman la atención; ", { alternatives: [{ term: perdona }, { term: perdone }] }, " piden disculpas"]
          ex: [{ target: Oye }, ", ¿tienes un lápiz?"]
          tr: { en: "Hey, have you got a pencil?" }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: ["the ", { term: tú }, " imperative has no final ", { letter: s }, ": ", { mapping: [{ term: hablas }, { term: habla }] }]
            es: ["el imperativo de ", { term: tú }, " no lleva ", { letter: s }, " final: ", { mapping: [{ term: hablas }, { term: habla }] }]
          ex: [{ target: Escucha }, ", por favor."]
          tr: { en: "Listen, please." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tú }, ", ", { term: usted }, " and ", { term: ustedes }, " each have their own imperative form."]
              es: [{ term: tú }, ", ", { term: usted }, " y ", { term: ustedes }, " tienen cada uno su forma de imperativo."]
          - type: rule
            level: A2
            text:
              en: "The subject pronoun usually stays out: the form shows who is spoken to."
              es: "El pronombre sujeto suele quedar fuera: la forma indica a quién se habla."
            ex: [{ target: Escucha }, ", por favor."]
            tr: { en: "Listen, please." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
            ex: [{ target: Pasen }, ", chicos."]
            tr: { en: "Come in, guys." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: [{ term: vosotros }, " is the informal plural, and ", { term: ustedes }, " the formal one:"]
              es: [{ term: vosotros }, " es el plural informal, y ", { term: ustedes }, ", el formal:"]
            ex: [{ target: Pasad }, ", chicos."]
            tr: { en: "Come in, guys." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["Where people say ", { term: vos }, ", as in Argentina, Uruguay and Central America, the imperative stresses its last syllable: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
              es: ["Donde se dice ", { term: vos }, ", como en Argentina, Uruguay y Centroamérica, el imperativo lleva el acento en la última sílaba: ", { alternatives: [{ term: hablá }, { term: comé }, { term: escribí }] }, "."]
          - type: note
            level: A2
            text:
              en: ["When to say ", { term: tú }, " and when ", { term: usted }, ": ", { link: "Forms of Address: tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]
              es: ["Cuándo decir ", { term: tú }, " y cuándo ", { term: usted }, ": ", { link: "Tú, usted, vosotros, ustedes", to: es.pronombres.tu-usted-vosotros-ustedes }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: escribir }
        rows:
          - { level: A2, features: { mood: imp, person: 2, number: sg, politeness: infm }, person: tú, ar: { target: habla }, er: { target: come }, ir: { target: escribe } }
          - { level: A2, features: { mood: imp, person: 2, number: sg, politeness: form }, person: usted, ar: { target: hable }, er: { target: coma }, ir: { target: escriba } }
          - { level: A2, variety: es-ES, features: { mood: imp, person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: hablad }, er: { target: comed }, ir: { target: escribid } }
          - { level: A2, features: { mood: imp, person: 2, number: pl }, person: ustedes, ar: { target: hablen }, er: { target: coman }, ir: { target: escriban } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The ", { term: tú }, " form is the ", { term: él }, " form of the present:"]
              es: ["La forma de ", { term: tú }, " es la forma de ", { term: él }, " del presente:"]
            ex: { examples: [[{ target: Habla }, " despacio."], [{ target: Escribe }, " tu nombre."]] }
            tr: { en: { examples: ["Speak slowly.", "Write your name."] } }
          - type: rule
            level: A2
            text:
              en: ["The ", { term: usted }, " form swaps the vowel of the ending: ", { term: "-ar" }, " verbs take ", { ending: e }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " verbs take ", { ending: a }, ":"]
              es: ["La forma de ", { term: usted }, " cambia la vocal de la terminación: los verbos en ", { term: "-ar" }, " llevan ", { ending: e }, ", los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, " llevan ", { ending: a }, ":"]
            ex: [{ target: Escriba }, " su nombre, por favor."]
            tr: { en: "Write your name, please." }
          - type: rule
            level: A2
            text:
              en: ["The ", { term: ustedes }, " form adds ", { ending: n }, " to the ", { term: usted }, " form:"]
              es: ["La forma de ", { term: ustedes }, " añade ", { ending: n }, " a la forma de ", { term: usted }, ":"]
            ex: [{ target: Escriban }, " su nombre, por favor."]
            tr: { en: "Write your names, please." }
          - type: rule
            level: A2
            variety: es-ES
            text:
              en: ["The ", { term: vosotros }, " form changes the ", { letter: r }, " of the infinitive to ", { letter: d }, ":"]
              es: ["La forma de ", { term: vosotros }, " cambia la ", { letter: r }, " del infinitivo por ", { letter: d }, ":"]
            ex: [{ target: Escribid }, " vuestro nombre."]
            tr: { en: "Write your names." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: tu, label: tú, features: { mood: imp, person: 2, number: sg, politeness: infm } }
          - { key: usted, label: usted, features: { mood: imp, person: 2, number: sg, politeness: form } }
          - { key: ustedes, label: ustedes, features: { mood: imp, person: 2, number: pl } }
        rows:
          - { level: A2, verb: decir, tu: { target: di }, usted: { target: diga }, ustedes: { target: digan } }
          - { level: A2, verb: hacer, tu: { target: haz }, usted: { target: haga }, ustedes: { target: hagan } }
          - { level: A2, verb: poner, tu: { target: pon }, usted: { target: ponga }, ustedes: { target: pongan } }
          - { level: A2, verb: salir, tu: { target: sal }, usted: { target: salga }, ustedes: { target: salgan } }
          - { level: A2, verb: tener, tu: { target: ten }, usted: { target: tenga }, ustedes: { target: tengan } }
          - { level: A2, verb: venir, tu: { target: ven }, usted: { target: venga }, ustedes: { target: vengan } }
          - { level: A2, verb: ir, tu: { target: ve }, usted: { target: vaya }, ustedes: { target: vayan } }
          - { level: A2, verb: ser, tu: { target: sé }, usted: { target: sea }, ustedes: { target: sean } }
      - type: paradigm
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: tu, label: tú, features: { mood: imp, person: 2, number: sg, politeness: infm } }
          - { key: usted, label: usted, features: { mood: imp, person: 2, number: sg, politeness: form } }
          - { key: ustedes, label: ustedes, features: { mood: imp, person: 2, number: pl } }
        rows:
          - { level: A2, verb: cerrar, tu: { target: cierra }, usted: { target: cierre }, ustedes: { target: cierren } }
          - { level: A2, verb: volver, tu: { target: vuelve }, usted: { target: vuelva }, ustedes: { target: vuelvan } }
          - { level: A2, verb: pedir, tu: { target: pide }, usted: { target: pida }, ustedes: { target: pidan } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The ", { term: usted }, " and ", { term: ustedes }, " forms come from the ", { term: yo }, " form of the present: ", { mapping: [{ term: tengo }, { term: tenga }] }, ", ", { mapping: [{ term: hago }, { term: haga }] }, "."]
              es: ["Las formas de ", { term: usted }, " y ", { term: ustedes }, " salen de la forma de ", { term: yo }, " del presente: ", { mapping: [{ term: tengo }, { term: tenga }] }, ", ", { mapping: [{ term: hago }, { term: haga }] }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: ir }, " and ", { term: ser }, " have forms of their own: ", { alternatives: [{ term: vaya }, { term: sea }] }, "."]
              es: [{ term: ir }, " y ", { term: ser }, " tienen formas propias: ", { alternatives: [{ term: vaya }, { term: sea }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["The vowel change of the present stays in the ", { term: tú }, ", ", { term: usted }, " and ", { term: ustedes }, " forms:"]
              es: ["El cambio de vocal del presente se mantiene en las formas de ", { term: tú }, ", ", { term: usted }, " y ", { term: ustedes }, ":"]
            ex: [{ target: Cierra }, " la puerta, por favor."]
            tr: { en: "Close the door, please." }
          - type: rule
            level: A2
            variety: es-ES
            text:
              en: ["The ", { term: vosotros }, " form stays regular: ", { alternatives: [{ term: decid }, { term: haced }, { term: id }] }, "."]
              es: ["La forma de ", { term: vosotros }, " es regular: ", { alternatives: [{ term: decid }, { term: haced }, { term: id }] }, "."]

  - title: { en: Pronouns after the imperative, es: Pronombres detrás del imperativo }
    role: own
    content:
      - type: usage
        columns:
          - { key: pronoun, label: { en: Pronoun, es: Pronombre } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - level: A2
            pronoun: { alternatives: [lo, la, los, las] }
            ex: { examples: [{ target: Cómpralo. }, [{ target: Ábrela }, ", por favor."]] }
            tr: { en: { examples: ["Buy it.", "Open it, please."] } }
          - level: A2
            pronoun: { alternatives: [me, te, le, nos, les] }
            ex: { examples: [[{ target: Dime }, " tu nombre."], [{ target: Escríbeme }, " pronto."]] }
            tr: { en: { examples: ["Tell me your name.", "Write to me soon."] } }
          - level: A2
            pronoun: { alternatives: [te, se] }
            ex: { examples: [{ target: Siéntate. }, [{ target: Siéntese }, ", por favor."]] }
            tr: { en: { examples: ["Sit down.", "Sit down, please."] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Object and reflexive pronouns join the end of the affirmative imperative, as one word."
              es: "Los pronombres de objeto y reflexivos se unen al final del imperativo afirmativo, en una sola palabra."
          - type: rule
            level: A2
            text:
              en: "The stress stays where it was, so when it falls three or more syllables from the end, it takes a written accent:"
              es: "El acento se queda donde estaba, así que cuando cae en la antepenúltima sílaba o antes, lleva tilde:"
            ex: { examples: [{ target: Cómpralo. }, { target: Levántate. }, { target: Escúchame. }] }
            tr: { en: { examples: ["Buy it.", "Get up.", "Listen to me."] } }
          - type: rule
            level: A2
            text:
              en: "A one-syllable form with one pronoun takes no written accent:"
              es: "Una forma de una sílaba con un pronombre no lleva tilde:"
            ex: { examples: [[{ target: Dame }, " la mano."], { target: Dime. }, { target: Hazlo. }] }
            tr: { en: { examples: ["Give me your hand.", "Tell me.", "Do it."] } }

  - title: { en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: Instructions, es: Instrucciones }, ex: [{ target: Abre }, " la ventana, por favor."], tr: { en: "Open the window, please." } }
          - { level: A2, use: { en: Directions, es: Indicaciones }, ex: ["Sigue por esta calle y ", { target: gira }, " a la derecha."], tr: { en: "Go along this street and turn right." } }
          - { level: A2, use: { en: Requests, es: Peticiones }, ex: [{ target: Ayúdame }, ", por favor."], tr: { en: "Help me, please." } }
          - level: A2
            use: { en: Invitations and offers, es: Invitaciones y ofrecimientos }
            ex: { examples: [[{ target: Pasa }, " y ", { target: siéntate }, "."], [{ target: Prueba }, " la sopa."]] }
            tr: { en: { examples: ["Come in and sit down.", "Try the soup."] } }
          - level: A2
            use: { en: Calling for attention, es: Llamar la atención }
            ex: { examples: [[{ target: Oye }, ", ¿tienes un lápiz?"], [{ target: Mira }, ", esta es mi casa."]] }
            tr: { en: { examples: ["Hey, have you got a pencil?", "Look, this is my house."] } }
          - level: A2
            use: { en: Apologising, es: Pedir disculpas }
            ex: { examples: [[{ target: Perdona }, ", ¿qué hora es?"], [{ target: Perdone }, ", ¿dónde está la estación?"]] }
            tr: { en: { examples: ["Sorry, what time is it?", "Excuse me, where is the station?"] } }
          - { level: A2, variety: es-ES, use: { en: Answering the phone, es: Contestar al teléfono }, ex: { target: ¿Dígame? }, tr: { en: "Hello?" } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: por favor }, " at the start or the end makes an order a request:"]
              es: [{ term: por favor }, " al principio o al final convierte una orden en una petición:"]
            ex: [{ target: Cierra }, " la puerta, por favor."]
            tr: { en: "Close the door, please." }
          - type: rule
            level: A2
            text:
              en: [{ term: perdona }, " and ", { term: oye }, " speak to ", { term: tú }, "; ", { term: perdone }, " and ", { term: oiga }, " speak to ", { term: usted }, "."]
              es: [{ term: perdona }, " y ", { term: oye }, " se dirigen a ", { term: tú }, "; ", { term: perdone }, " y ", { term: oiga }, ", a ", { term: usted }, "."]

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: "Hablas más despacio, por favor.", right: [{ target: Habla }, " más despacio, por favor."], rule: { en: ["the ", { term: tú }, " imperative has no final ", { letter: s }], es: ["el imperativo de ", { term: tú }, " no lleva ", { letter: s }, " final"] } }
          - { level: A2, wrong: "Hace la cama.", right: [{ target: Haz }, " la cama."], rule: { en: [{ term: hacer }, " has the short form ", { term: haz }], es: [{ term: hacer }, " tiene la forma corta ", { term: haz }] } }
          - { level: A2, wrong: "Me dice tu nombre.", right: [{ target: Dime }, " tu nombre."], rule: { en: "the pronoun joins the end of the verb", es: "el pronombre se une al final del verbo" } }
          - { level: A2, wrong: "Comprálo.", right: { target: Cómpralo. }, rule: { en: ["the stress stays on ", { term: com }, ": ", { term: cómpralo }], es: ["el acento sigue en ", { term: com }, ": ", { term: cómpralo }] } }
          - { level: A2, wrong: "Siéntate, señor García.", right: [{ target: Siéntese }, ", señor García."], rule: { en: [{ term: usted }, " takes the ", { term: usted }, " form"], es: [{ term: usted }, " lleva la forma de ", { term: usted }] } }
          - { level: A2, wrong: "Ve aquí, por favor.", right: [{ target: Ven }, " aquí, por favor."], rule: { en: [{ term: ven }, " comes from ", { term: venir }, ", ", { term: ve }, " from ", { term: ir }], es: [{ term: ven }, " viene de ", { term: venir }, ", ", { term: ve }, ", de ", { term: ir }] } }
