  - title: { en: Pronouns after the imperative, es: Pronombres detrás del imperativo, uk: "Займенники після наказового способу", pt: "Pronomes depois do imperativo", fr: "Pronoms après l’impératif", de: "Pronomen hinter dem Imperativ", it: "Pronomi dopo l'imperativo", pl: "Zaimki po formie rozkazującej", tr: "Emir kipinin arkasına gelen zamirler", id: "Kata ganti setelah kalimat perintah", vi: "Đại từ đứng sau dạng mệnh lệnh" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pronoun, label: { en: Pronoun, es: Pronombre, uk: "Займенник", pt: "Pronome", fr: "Pronom", de: "Pronomen", it: "Pronome", pl: "Zaimek", tr: "Zamir", id: "Kata ganti", vi: "Đại từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A2
            pronoun: { alternatives: [lo, la, los, las] }
            ex: { examples: [{ target: Cómpralo. }, [{ target: Ábrela }, ", por favor."]] }
            tr: { en: { examples: ["Buy it.", "Open it, please."] }, uk: { examples: ["Купи його.", "Відчини її, будь ласка."] }, pt: { examples: ["Compre isso.", "Abra isso, por favor."] }, fr: { examples: ["Achète-le.", "Ouvre-la, s’il te plaît."] }, de: { examples: ["Kauf es.", "Mach sie bitte auf."] }, it: { examples: ["Compralo.", "Aprila, per favore."] }, pl: { examples: ["Kup to.", "Otwórz to, proszę."] }, tr: { examples: ["Onu satın al.", "Lütfen onu aç."] }, id: { examples: ["Belilah itu.", "Tolong bukalah itu."] }, vi: { examples: ["Mua nó đi.", "Làm ơn mở nó ra."] } }
          - level: A2
            pronoun: { alternatives: [me, te, le, nos, les] }
            ex: { examples: [[{ target: Dime }, " tu nombre."], [{ target: Escríbeme }, " pronto."]] }
            tr: { en: { examples: ["Tell me your name.", "Write to me soon."] }, uk: { examples: ["Скажи мені своє ім’я.", "Напиши мені скоро."] }, pt: { examples: ["Me diga seu nome.", "Me escreva logo."] }, fr: { examples: ["Dis-moi ton nom.", "Écris-moi bientôt."] }, de: { examples: ["Sag mir deinen Namen.", "Schreib mir bald."] }, it: { examples: ["Dimmi il tuo nome.", "Scrivimi presto."] }, pl: { examples: ["Powiedz mi, jak masz na imię.", "Napisz do mnie wkrótce."] }, tr: { examples: ["Bana adını söyle.", "Bana en kısa zamanda yaz."] }, id: { examples: ["Katakan namamu kepadaku.", "Segera tulis kepadaku."] }, vi: { examples: ["Cho tôi biết tên của bạn.", "Sớm viết thư cho tôi nhé."] } }
          - level: A2
            pronoun: { alternatives: [te, se] }
            ex: { examples: [{ target: Siéntate. }, [{ target: Siéntese }, ", por favor."]] }
            tr: { en: { examples: ["Sit down.", "Sit down, please."] }, uk: { examples: ["Сідай.", "Сідайте, будь ласка."] }, pt: { examples: ["Sente-se.", "Sente-se, por favor."] }, fr: { examples: ["Assieds-toi.", "Asseyez-vous, s’il vous plaît."] }, de: { examples: ["Setz dich.", "Setzen Sie sich bitte."] }, it: { examples: ["Siediti.", "Si sieda, per favore."] }, pl: { examples: ["Usiądź.", "Proszę usiąść."] }, tr: { examples: ["Otur.", "Lütfen oturun."] }, id: { examples: ["Duduklah.", "Silakan duduk."] }, vi: { examples: ["Ngồi xuống đi.", "Xin mời ngồi."] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Object and reflexive pronouns join the end of the affirmative imperative, as one word."
              es: "Los pronombres de objeto y reflexivos se unen al final del imperativo afirmativo, en una sola palabra."
              uk: "Займенники-додатки та зворотні займенники приєднуються до кінця стверджувального наказу й пишуться разом із ним."
              pt: "Os pronomes de objeto e reflexivos se unem ao final do imperativo afirmativo, numa só palavra."
              fr: "Les pronoms compléments et réfléchis se joignent à la fin de l’impératif affirmatif, en un seul mot."
              de: "Objekt- und Reflexivpronomen hängen am Ende des bejahten Imperativs, in einem Wort."
              it: "I pronomi complemento e riflessivi si uniscono alla fine dell'imperativo affermativo, in una sola parola."
              pl: "Zaimki dopełnienia i zwrotne dołączają się do końca formy rozkazującej twierdzącej i tworzą z nią jedno słowo."
              tr: "Nesne ve dönüşlülük zamirleri olumlu emir kipinin sonuna eklenir ve tek sözcük olarak yazılır."
              id: "Kata ganti objek dan refleksif menempel di akhir kalimat perintah positif, ditulis sebagai satu kata."
              vi: "Đại từ tân ngữ và đại từ phản thân gắn vào cuối dạng mệnh lệnh khẳng định, viết liền thành một từ."
          - type: rule
            level: A2
            text:
              en: "The stress stays where it was, so when it falls three or more syllables from the end, it takes a written accent:"
              es: "El acento se queda donde estaba, así que cuando cae en la antepenúltima sílaba o antes, lleva tilde:"
              uk: "Наголос лишається на місці, тому коли він падає на третій склад від кінця або далі, ставлять знак наголосу:"
              pt: "A sílaba tônica fica onde estava, então, quando cai na antepenúltima sílaba ou antes, leva acento gráfico:"
              fr: "L’accent tonique reste en place, donc quand il tombe sur l’antépénultième syllabe ou avant, il prend un accent écrit :"
              de: "Die Betonung bleibt an ihrer Stelle; fällt sie auf die drittletzte Silbe oder weiter nach vorn, steht ein Akzentzeichen:"
              it: "L'accento resta dov'era, quindi quando cade sulla terzultima sillaba o prima, porta l'accento scritto:"
              pl: "Akcent zostaje na swoim miejscu, więc gdy pada na trzecią sylabę od końca lub dalej, pojawia się akcent graficzny:"
              tr: "Vurgu yerinde kalır; sondan üçüncü heceye ya da daha öne düşerse yazılı vurgu işareti konur:"
              id: "Tekanan tetap di tempatnya, jadi jika jatuh pada suku kata ketiga dari belakang atau lebih awal, ditulis tanda aksen:"
              vi: "Trọng âm giữ nguyên vị trí, nên khi rơi vào âm tiết thứ ba tính từ cuối hoặc xa hơn, phải viết dấu sắc:"
            ex: { examples: [{ target: Cómpralo. }, { target: Levántate. }, { target: Escúchame. }] }
            tr: { en: { examples: ["Buy it.", "Get up.", "Listen to me."] }, uk: { examples: ["Купи його.", "Вставай.", "Послухай мене."] }, pt: { examples: ["Compre isso.", "Levante-se.", "Me escute."] }, fr: { examples: ["Achète-le.", "Lève-toi.", "Écoute-moi."] }, de: { examples: ["Kauf es.", "Steh auf.", "Hör mir zu."] }, it: { examples: ["Compralo.", "Alzati.", "Ascoltami."] }, pl: { examples: ["Kup to.", "Wstań.", "Posłuchaj mnie."] }, tr: { examples: ["Onu satın al.", "Kalk.", "Beni dinle."] }, id: { examples: ["Belilah itu.", "Bangunlah.", "Dengarkan aku."] }, vi: { examples: ["Mua nó đi.", "Đứng dậy đi.", "Nghe tôi nói đi."] } }
          - type: rule
            level: A2
            text:
              en: "A one-syllable form with one pronoun takes no written accent:"
              es: "Una forma de una sílaba con un pronombre no lleva tilde:"
              uk: "Односкладова форма з одним займенником пишеться без знака наголосу:"
              pt: "Uma forma de uma sílaba com um pronome não leva acento gráfico:"
              fr: "Une forme d’une syllabe avec un pronom ne prend pas d’accent écrit :"
              de: "Eine einsilbige Form mit einem Pronomen bekommt kein Akzentzeichen:"
              it: "Una forma di una sillaba con un pronome non porta l'accento scritto:"
              pl: "Forma jednosylabowa z jednym zaimkiem nie ma akcentu graficznego:"
              tr: "Tek heceli bir biçim, tek zamirle birleştiğinde yazılı vurgu işareti almaz:"
              id: "Bentuk satu suku kata dengan satu kata ganti tidak diberi tanda aksen:"
              vi: "Dạng một âm tiết đi với một đại từ thì không viết dấu sắc:"
            ex: { examples: [[{ target: Dame }, " la mano."], { target: Dime. }, { target: Hazlo. }] }
            tr: { en: { examples: ["Give me your hand.", "Tell me.", "Do it."] }, uk: { examples: ["Дай мені руку.", "Скажи.", "Зроби це."] }, pt: { examples: ["Me dê a mão.", "Me diga.", "Faça isso."] }, fr: { examples: ["Donne-moi la main.", "Dis-moi.", "Fais-le."] }, de: { examples: ["Gib mir die Hand.", "Sag mir.", "Mach es."] }, it: { examples: ["Dammi la mano.", "Dimmi.", "Fallo."] }, pl: { examples: ["Daj mi rękę.", "Powiedz mi.", "Zrób to."] }, tr: { examples: ["Bana elini ver.", "Söyle bana.", "Onu yap."] }, id: { examples: ["Berikan tanganmu padaku.", "Katakan padaku.", "Lakukanlah itu."] }, vi: { examples: ["Đưa tay cho tôi.", "Nói cho tôi biết.", "Làm đi."] } }

