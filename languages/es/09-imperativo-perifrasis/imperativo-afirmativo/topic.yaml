title: { en: Affirmative Imperative, es: El imperativo afirmativo, uk: "Стверджувальний наказовий спосіб", pt: "O imperativo afirmativo", fr: "L’impératif affirmatif", de: "Der bejahte Imperativ", it: "L'imperativo affermativo", pl: "Twierdzący tryb rozkazujący", tr: "Olumlu emir kipi", id: "Kalimat perintah positif", vi: "Câu mệnh lệnh khẳng định" }
summary:
  lead:
    en: ["The imperative gives instructions, directions and invitations: ", { term: habla }, " for ", { term: tú }, ", ", { term: hable }, " for ", { term: usted }, ", ", { term: hablen }, " for ", { term: ustedes }, "."]
    es: ["El imperativo da instrucciones, indicaciones e invitaciones: ", { term: habla }, " para ", { term: tú }, ", ", { term: hable }, " para ", { term: usted }, ", ", { term: hablen }, " para ", { term: ustedes }, "."]
    uk: ["Наказовий спосіб дає інструкції, вказівки та запрошення: ", { term: "habla" }, " для ", { term: "tú" }, ", ", { term: "hable" }, " для ", { term: "usted" }, ", ", { term: "hablen" }, " для ", { term: "ustedes" }, "."]
    pt: ["O imperativo dá instruções, indicações e convites: ", { term: habla }, " para ", { term: tú }, ", ", { term: hable }, " para ", { term: usted }, ", ", { term: hablen }, " para ", { term: ustedes }, "."]
    fr: ["L’impératif donne des instructions, des indications et des invitations : ", { term: habla }, " pour ", { term: tú }, ", ", { term: hable }, " pour ", { term: usted }, ", ", { term: hablen }, " pour ", { term: ustedes }, "."]
    de: ["Der Imperativ gibt Anweisungen, Wegbeschreibungen und Einladungen: ", { term: habla }, " für ", { term: tú }, ", ", { term: hable }, " für ", { term: usted }, ", ", { term: hablen }, " für ", { term: ustedes }, "."]
    it: ["L'imperativo dà istruzioni, indicazioni e inviti: ", { term: habla }, " per ", { term: tú }, ", ", { term: hable }, " per ", { term: usted }, ", ", { term: hablen }, " per ", { term: ustedes }, "."]
    pl: ["Tryb rozkazujący wyraża polecenia, wskazówki i zaproszenia: ", { term: habla }, " dla ", { term: tú }, ", ", { term: hable }, " dla ", { term: usted }, ", ", { term: hablen }, " dla ", { term: ustedes }, "."]
    tr: ["Emir kipi talimat, yol tarifi ve davet verir: ", { term: tú }, " için ", { term: habla }, ", ", { term: usted }, " için ", { term: hable }, ", ", { term: ustedes }, " için ", { term: hablen }, "."]
    id: ["Kalimat perintah dipakai untuk instruksi, petunjuk arah, dan ajakan: ", { term: habla }, " untuk ", { term: tú }, ", ", { term: hable }, " untuk ", { term: usted }, ", ", { term: hablen }, " untuk ", { term: ustedes }, "."]
    vi: ["Câu mệnh lệnh dùng để hướng dẫn, chỉ đường và mời: ", { term: habla }, " cho ", { term: tú }, ", ", { term: hable }, " cho ", { term: usted }, ", ", { term: hablen }, " cho ", { term: ustedes }, "."]
  rule:
    en: "Object pronouns join the end of the verb, and a written accent keeps the stress in its place:"
    es: "Los pronombres de objeto se unen al final del verbo, y una tilde mantiene el acento en su sitio:"
    uk: "Займенники-додатки приєднуються до кінця дієслова, а знак наголосу тримає наголос на своєму місці:"
    pt: "Os pronomes de objeto se unem ao final do verbo, e um acento gráfico mantém a sílaba tônica no lugar:"
    fr: "Les pronoms compléments se joignent à la fin du verbe, et un accent écrit garde l’accent tonique à sa place :"
    de: "Objektpronomen werden an das Verbende angehängt, und ein Akzentzeichen hält die Betonung an ihrer Stelle:"
    it: "I pronomi complemento si uniscono alla fine del verbo, e un accento scritto mantiene l'accento al suo posto:"
    pl: "Zaimki dopełnienia łączą się z końcem czasownika, a akcent graficzny zachowuje akcent na swoim miejscu:"
    tr: "Nesne zamirleri fiilin sonuna eklenir ve yazılı vurgu işareti vurguyu yerinde tutar:"
    id: "Kata ganti objek menempel di akhir kata kerja, dan tanda aksen menjaga tekanan tetap di tempatnya:"
    vi: "Đại từ tân ngữ gắn vào cuối động từ, và dấu sắc giữ trọng âm ở nguyên vị trí:"
  ex: { examples: [{ target: Cómpralo. }, [{ target: Siéntate }, ", por favor."]] }

