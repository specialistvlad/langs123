  - title: { en: Pronouns with these verbs, es: Pronombres con estos verbos, uk: "Займенники з цими дієсловами", pt: "Pronomes com estes verbos", fr: "Les pronoms avec ces verbes", de: "Pronomen bei diesen Verben", it: "I pronomi con questi verbi", pl: "Zaimki z tymi czasownikami", tr: "Bu fiillerle zamirler", id: "Kata ganti dengan kata kerja ini", vi: "Đại từ với những động từ này" }
    role: own
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
