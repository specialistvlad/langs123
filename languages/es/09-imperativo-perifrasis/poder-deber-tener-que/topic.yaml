              tr: [{ term: "deber" }, ", ", { term: "-er" }, " ile biten düzenli bir fiildir: ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]
              id: [{ term: "deber" }, " adalah kata kerja beraturan berakhiran ", { term: "-er" }, ": ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]
              vi: [{ term: "deber" }, " là động từ có quy tắc tận cùng bằng ", { term: "-er" }, ": ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]

