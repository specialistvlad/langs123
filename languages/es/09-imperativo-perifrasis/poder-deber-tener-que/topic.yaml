      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: poder }, " changes ", { letter: o }, " to ", { letter: ue }, " when the stress falls on the stem: ", { alternatives: [{ term: puedo }, { term: puedes }, { term: pueden }] }, "."]
              es: [{ term: poder }, " cambia ", { letter: o }, " por ", { letter: ue }, " cuando el acento cae en la raíz: ", { alternatives: [{ term: puedo }, { term: puedes }, { term: pueden }] }, "."]
              uk: [{ term: "poder" }, " змінює ", { letter: "o" }, " на ", { letter: "ue" }, ", коли наголос падає на основу: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              pt: [{ term: "poder" }, " muda ", { letter: "o" }, " para ", { letter: "ue" }, " quando a sílaba tônica cai no radical: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              fr: [{ term: "poder" }, " change ", { letter: "o" }, " en ", { letter: "ue" }, " quand l’accent tombe sur le radical : ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              de: [{ term: "poder" }, " wechselt ", { letter: "o" }, " zu ", { letter: "ue" }, ", wenn die Betonung auf dem Stamm liegt: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              it: [{ term: "poder" }, " cambia ", { letter: "o" }, " in ", { letter: "ue" }, " quando l'accento cade sulla radice: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              pl: [{ term: "poder" }, " zmienia ", { letter: "o" }, " na ", { letter: "ue" }, ", gdy akcent pada na temat: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              tr: [{ term: "poder" }, " fiilinde vurgu gövdeye düştüğünde ", { letter: "o" }, " harfi ", { letter: "ue" }, " olur: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              id: [{ term: "poder" }, " mengubah ", { letter: "o" }, " menjadi ", { letter: "ue" }, " ketika tekanan jatuh pada akar kata: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
              vi: [{ term: "poder" }, " đổi ", { letter: "o" }, " thành ", { letter: "ue" }, " khi trọng âm rơi vào gốc từ: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: saber }, " is irregular only in the ", { term: yo }, " form: ", { term: sé }, ", with a written accent."]
              es: [{ term: saber }, " solo es irregular en la forma de ", { term: yo }, ": ", { term: sé }, ", con tilde."]
              uk: [{ term: "saber" }, " неправильне лише у формі ", { term: "yo" }, ": ", { term: "sé" }, ", зі знаком наголосу."]
              pt: [{ term: "saber" }, " é irregular só na forma de ", { term: "yo" }, ": ", { term: "sé" }, ", com acento gráfico."]
              fr: [{ term: "saber" }, " n’est irrégulier qu’à la forme de ", { term: "yo" }, " : ", { term: "sé" }, ", avec un accent écrit."]
              de: [{ term: "saber" }, " ist nur in der Form von ", { term: "yo" }, " unregelmäßig: ", { term: "sé" }, ", mit Akzent."]
              it: [{ term: "saber" }, " è irregolare solo nella forma di ", { term: "yo" }, ": ", { term: "sé" }, ", con l'accento scritto."]
              pl: [{ term: "saber" }, " jest nieregularny tylko w formie ", { term: "yo" }, ": ", { term: "sé" }, ", z akcentem graficznym."]
              tr: [{ term: "saber" }, " yalnızca ", { term: "yo" }, " biçiminde düzensizdir: ", { term: "sé" }, ", vurgu işaretiyle."]
              id: [{ term: "saber" }, " tidak beraturan hanya pada bentuk ", { term: "yo" }, ": ", { term: "sé" }, ", dengan tanda aksen."]
              vi: [{ term: "saber" }, " chỉ bất quy tắc ở dạng ", { term: "yo" }, ": ", { term: "sé" }, ", có dấu sắc."]
          - type: note
