              fr: [{ term: "deber" }, " est un verbe régulier en ", { term: "-er" }, " : ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]
              de: [{ term: "deber" }, " ist ein regelmäßiges Verb auf ", { term: "-er" }, ": ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]
              it: [{ term: "deber" }, " è un verbo regolare in ", { term: "-er" }, ": ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]
