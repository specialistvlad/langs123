title: { en: "Can, Must, Should: poder, saber, deber, tener que, hay que", es: "Poder, saber, deber, tener que, hay que", uk: "Модальні дієслова: poder, saber, deber, tener que, hay que", pt: "Verbos modais: poder, saber, deber, tener que, hay que", fr: "Verbes modaux : poder, saber, deber, tener que, hay que", de: "Modalverben: poder, saber, deber, tener que, hay que", it: "Verbi modali: poder, saber, deber, tener que, hay que", pl: "Czasowniki modalne: poder, saber, deber, tener que, hay que", tr: "Modal fiiller: poder, saber, deber, tener que, hay que", id: "Kata kerja modal: poder, saber, deber, tener que, hay que", vi: "Động từ khuyết thiếu: poder, saber, deber, tener que, hay que" }
summary:
  lead:
    en: [{ term: Poder }, " says what is possible or allowed, ", { term: saber }, " what someone has learned, ", { term: tener que }, " and ", { term: deber }, " what is necessary, ", { term: hay que }, " what everyone must do."]
    es: [{ term: Poder }, " dice qué es posible o está permitido, ", { term: saber }, ", qué se ha aprendido, ", { term: tener que }, " y ", { term: deber }, ", qué es necesario, ", { term: hay que }, ", qué debe hacer todo el mundo."]
    uk: [{ term: "Poder" }, " означає, що щось можливо або дозволено, ", { term: "saber" }, " — що хтось чогось навчився, ", { term: "tener que" }, " і ", { term: "deber" }, " — що щось потрібно, ", { term: "hay que" }, " — що мусять робити всі."]
    pt: [{ term: Poder }, " diz o que é possível ou permitido, ", { term: saber }, " o que alguém aprendeu, ", { term: tener que }, " e ", { term: deber }, " o que é necessário, ", { term: hay que }, " o que todos devem fazer."]
    fr: [{ term: Poder }, " dit ce qui est possible ou permis, ", { term: saber }, " ce que quelqu’un a appris, ", { term: tener que }, " et ", { term: deber }, " ce qui est nécessaire, ", { term: hay que }, " ce que chacun doit faire."]
    de: [{ term: Poder }, " sagt, was möglich oder erlaubt ist, ", { term: saber }, " was jemand gelernt hat, ", { term: tener que }, " und ", { term: deber }, " was nötig ist, ", { term: hay que }, " was alle tun müssen."]
    it: [{ term: Poder }, " dice ciò che è possibile o permesso, ", { term: saber }, " ciò che qualcuno ha imparato, ", { term: tener que }, " e ", { term: deber }, " ciò che è necessario, ", { term: hay que }, " ciò che tutti devono fare."]
    pl: [{ term: Poder }, " mówi, co jest możliwe lub dozwolone, ", { term: saber }, " czego ktoś się nauczył, ", { term: tener que }, " i ", { term: deber }, " co jest konieczne, ", { term: hay que }, " co muszą robić wszyscy."]
    tr: [{ term: Poder }, " mümkün ya da serbest olanı, ", { term: saber }, " birinin öğrendiğini, ", { term: tener que }, " ile ", { term: deber }, " gerekli olanı, ", { term: hay que }, " herkesin yapması gerekeni söyler."]
    id: [{ term: Poder }, " menyatakan yang mungkin atau diizinkan, ", { term: saber }, " yang telah dipelajari seseorang, ", { term: tener que }, " dan ", { term: deber }, " yang perlu, ", { term: hay que }, " yang harus dilakukan semua orang."]
    vi: [{ term: Poder }, " nói điều có thể hoặc được phép, ", { term: saber }, " điều ai đó đã học, ", { term: tener que }, " và ", { term: deber }, " điều cần thiết, ", { term: hay que }, " điều mọi người phải làm."]
  rule:
    en: "The first verb changes for the person, and the second stays in the infinitive:"
    es: "El primer verbo cambia según la persona, y el segundo queda en infinitivo:"
    uk: "Перше дієслово змінюється за особами, а друге лишається в інфінітиві:"
    pt: "O primeiro verbo muda conforme a pessoa, e o segundo fica no infinitivo:"
    fr: "Le premier verbe change selon la personne, le second reste à l’infinitif :"
    de: "Das erste Verb ändert sich mit der Person, das zweite bleibt im Infinitiv:"
    it: "Il primo verbo cambia con la persona, il secondo resta all'infinito:"
    pl: "Pierwszy czasownik zmienia się według osoby, drugi pozostaje w bezokoliczniku:"
    tr: "İlk fiil kişiye göre çekimlenir, ikincisi mastar kalır:"
    id: "Kata kerja pertama berubah menurut orangnya, yang kedua tetap infinitif:"
    vi: "Động từ đầu chia theo ngôi, động từ sau giữ nguyên mẫu:"
  ex: { examples: [[{ target: Puedo ir }, " mañana."], [{ target: Tenemos que trabajar }, "."]] }

