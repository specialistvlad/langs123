      - type: errors
        rows:
          - { level: A2, wrong: "Puedo nado.", right: [{ target: Puedo nadar }, "."], rule: { en: "the second verb is an infinitive", es: "el segundo verbo va en infinitivo", uk: "друге дієслово стоїть в інфінітиві" } }
          - { level: A2, speakers: [en], wrong: "No puedo cocinar: nunca aprendí.", right: [{ target: No sé cocinar }, ": nunca aprendí."], rule: { en: ["a skill never learned takes ", { term: no saber }] } }
          - { level: A2, wrong: "Tengo trabajar.", right: [{ target: Tengo que trabajar }, "."], rule: { en: [{ term: tener }, " takes ", { term: que }, " before the infinitive"], es: [{ term: tener }, " lleva ", { term: que }, " delante del infinitivo"], uk: [{ term: "tener" }, " вимагає ", { term: "que" }, " перед інфінітивом"] } }
          - { level: A2, wrong: "Lo hay que hacer.", right: [{ target: Hay que hacerlo }, "."], rule: { en: ["with ", { term: hay que }, ", the pronoun joins the infinitive"], es: ["con ", { term: hay que }, ", el pronombre se une al infinitivo"], uk: ["з ", { term: "hay que" }, " займенник приєднується до інфінітива"] } }
          - { level: B1, wrong: "No tienes que fumar aquí.", right: [{ target: No puedes fumar }, " aquí."], rule: { en: ["to forbid something: ", { term: no poder }, "; ", { term: no tener que }, " says it isn't necessary"], es: ["para prohibir algo: ", { term: no poder }, "; ", { term: no tener que }, " dice que no es necesario"], uk: ["щоб заборонити — ", { term: "no poder" }, "; ", { term: "no tener que" }, " означає «не обов’язково»"] } }
          - { level: B1, wrong: "Debes de estudiar más.", right: [{ target: Debes estudiar }, " más."], rule: { en: ["obligation takes ", { term: deber }, " with no ", { term: de }], es: ["la obligación lleva ", { term: deber }, " sin ", { term: de }], uk: ["обов’язок виражає ", { term: "deber" }, " без ", { term: "de" }] } }
