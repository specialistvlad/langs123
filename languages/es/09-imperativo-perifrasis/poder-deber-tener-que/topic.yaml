id: es.imperativo-perifrasis.poder-deber-tener-que
lang: es
kind: grammar
tags: [verbs, modals, infinitive, obligation]
concepts: [ability, obligation, advice, periphrases]
related: [es.imperativo-perifrasis.perifrasis-aspectuales, es.presente.presente-irregular, es.futuro-condicional.condicional-simple, es.pronombres.objeto-directo]
status: { en: draft, es: draft, uk: draft }
translated: { en: "6b084a 5475ac 193a80 6f3c22 745b25 f13b0e 66ed16 e875af 622b1b", uk: "6b084a 5475ac 193a80 6f3c22 745b25 f13b0e 66ed16 e875af 622b1b" }

title: { en: "Can, Must, Should: poder, saber, deber, tener que, hay que", es: "Poder, saber, deber, tener que, hay que", uk: "Модальні дієслова: poder, saber, deber, tener que, hay que" }
summary:
  lead:
    en: [{ term: Poder }, " says what is possible or allowed, ", { term: saber }, " what someone has learned, ", { term: tener que }, " and ", { term: deber }, " what is necessary, ", { term: hay que }, " what everyone must do."]
    es: [{ term: Poder }, " dice qué es posible o está permitido, ", { term: saber }, ", qué se ha aprendido, ", { term: tener que }, " y ", { term: deber }, ", qué es necesario, ", { term: hay que }, ", qué debe hacer todo el mundo."]
    uk: [{ term: "Poder" }, " означає, що щось можливо або дозволено, ", { term: "saber" }, " — що хтось чогось навчився, ", { term: "tener que" }, " і ", { term: "deber" }, " — що щось потрібно, ", { term: "hay que" }, " — що мусять робити всі."]
  rule:
    en: "The first verb changes for the person, and the second stays in the infinitive:"
    es: "El primer verbo cambia según la persona, y el segundo queda en infinitivo:"
    uk: "Перше дієслово змінюється за особами, а друге лишається в інфінітиві:"
  ex: { examples: [[{ target: Puedo ir }, " mañana."], [{ target: Tenemos que trabajar }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Permission, es: Permiso, uk: "Дозвіл" }
          rule:
            en: [{ pattern: [{ term: ¿Puedo }, { slot: infinitive }] }, ": asking if something is allowed"]
            es: [{ pattern: [{ term: ¿Puedo }, { slot: infinitive }] }, ": preguntar si algo está permitido"]
            uk: [{ pattern: [{ term: "¿Puedo" }, { slot: "infinitive" }] }, ": запитати, чи щось дозволено"]
          ex: ["¿", { target: Puedo abrir }, " la ventana?"]
          tr: { en: "Can I open the window?", uk: "Можна відчинити вікно?" }
        - level: A2
          point: { en: Requests, es: Peticiones, uk: "Прохання" }
          rule:
            en: [{ pattern: [{ term: ¿Puedes }, { slot: infinitive }] }, ": asking someone to do something"]
            es: [{ pattern: [{ term: ¿Puedes }, { slot: infinitive }] }, ": pedir a alguien que haga algo"]
            uk: [{ pattern: [{ term: "¿Puedes" }, { slot: "infinitive" }] }, ": попросити когось щось зробити"]
          ex: ["¿", { target: Puedes repetir }, ", por favor?"]
          tr: { en: "Can you repeat that, please?", uk: "Можеш повторити, будь ласка?" }
        - level: A2
          point: { en: Skills, es: Habilidades, uk: "Уміння" }
          rule:
            en: [{ pattern: [{ term: saber }, { slot: infinitive }] }, ": something someone has learned to do"]
            es: [{ pattern: [{ term: saber }, { slot: infinitive }] }, ": algo que alguien ha aprendido a hacer"]
            uk: [{ pattern: [{ term: "saber" }, { slot: "infinitive" }] }, ": те, що хтось навчився робити"]
          ex: [{ target: Sé nadar }, "."]
          tr: { en: "I can swim.", uk: "Я вмію плавати." }
        - level: A2
          point: { en: Ability now, es: Capacidad ahora, uk: "Можливість зараз" }
          rule:
            en: [{ term: poder }, ": whether someone is able to do something now"]
            es: [{ term: poder }, ": si alguien es capaz de hacer algo ahora"]
            uk: [{ term: "poder" }, ": чи може хтось щось зробити зараз"]
          ex: ["Hoy no ", { target: puedo salir }, "."]
          tr: { en: "I can't go out today.", uk: "Сьогодні я не можу вийти." }
        - level: A2
          point: { en: Obligation, es: Obligación, uk: "Необхідність" }
          rule:
            en: [{ pattern: [{ term: tener que }, { slot: infinitive }] }, ": what one person needs to do"]
            es: [{ pattern: [{ term: tener que }, { slot: infinitive }] }, ": lo que una persona necesita hacer"]
            uk: [{ pattern: [{ term: "tener que" }, { slot: "infinitive" }] }, ": те, що потрібно зробити конкретній людині"]
          ex: [{ target: Tengo que trabajar }, " el sábado."]
          tr: { en: "I have to work on Saturday.", uk: "У суботу мені треба працювати." }
        - level: A2
          point: { en: Obligation, es: Obligación, uk: "Необхідність" }
          rule:
            en: [{ pattern: [{ term: hay que }, { slot: infinitive }] }, ": what everyone needs to do, with no subject"]
            es: [{ pattern: [{ term: hay que }, { slot: infinitive }] }, ": lo que todos necesitan hacer, sin sujeto"]
            uk: [{ pattern: [{ term: "hay que" }, { slot: "infinitive" }] }, ": те, що потрібно робити всім, без підмета"]
          ex: [{ target: Hay que pagar }, " antes de entrar."]
          tr: { en: "You have to pay before going in.", uk: "Перед входом треба заплатити." }
        - level: A2
          point: { en: Pronouns, es: Pronombres, uk: "Займенники" }
          rule:
            en: "before the conjugated verb, or at the end of the infinitive"
            es: "delante del verbo conjugado, o al final del infinitivo"
            uk: "перед відмінюваним дієсловом або в кінці інфінітива"
          ex: { examples: [[{ target: Lo tengo que hacer }, "."], [{ target: Tengo que hacerlo }, "."]] }
          tr: { en: { examples: ["I have to do it.", "I have to do it."] }, uk: { examples: ["Я мушу це зробити.", "Я мушу це зробити."] } }
        - level: B1
          point: { en: Duty, es: Deber, uk: "Обов’язок" }
          rule:
            en: [{ pattern: [{ term: deber }, { slot: infinitive }] }, ": what is right or required"]
            es: [{ pattern: [{ term: deber }, { slot: infinitive }] }, ": lo que es correcto u obligatorio"]
            uk: [{ pattern: [{ term: "deber" }, { slot: "infinitive" }] }, ": те, що правильно або обов’язково"]
          ex: [{ target: Debes decir }, " la verdad."]
          tr: { en: "You must tell the truth.", uk: "Ти повинен казати правду." }
        - level: B1
          point: { en: Advice, es: Consejo, uk: "Порада" }
          rule:
            en: [{ pattern: [{ term: deberías }, { slot: infinitive }] }, ": a piece of advice"]
            es: [{ pattern: [{ term: deberías }, { slot: infinitive }] }, ": un consejo"]
            uk: [{ pattern: [{ term: "deberías" }, { slot: "infinitive" }] }, ": порада"]
          ex: [{ target: Deberías descansar }, "."]
          tr: { en: "You should rest.", uk: "Тобі варто відпочити." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: tener }, " takes ", { term: que }, " before the infinitive"]
            es: [{ term: tener }, " lleva ", { term: que }, " delante del infinitivo"]
            uk: [{ term: "tener" }, " вимагає ", { term: "que" }, " перед інфінітивом"]
          ex: [{ target: Tengo que irme }, "."]
          tr: { en: "I have to go.", uk: "Мені треба йти." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: no tener que }, ": not necessary; ", { term: no deber }, ": mustn't, as a duty or advice; ", { term: no poder }, ": not allowed"]
            es: [{ term: no tener que }, ": no es necesario; ", { term: no deber }, ": no está bien, como deber o consejo; ", { term: no poder }, ": no está permitido"]
            uk: [{ term: "no tener que" }, ": не обов’язково; ", { term: "no deber" }, ": не слід — як обов’язок чи порада; ", { term: "no poder" }, ": не дозволено"]
          ex: { examples: [[{ target: No tienes que venir }, "."], [{ target: No debes mentir }, "."], [{ target: No puedes fumar }, " aquí."]] }
          tr: { en: { examples: ["You don't have to come.", "You mustn't lie.", "You can't smoke here."] }, uk: { examples: ["Тобі не обов’язково приходити.", "Ти не повинен брехати.", "Тут не можна курити."] } }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "These verbs take an infinitive after them; only the first verb changes for the person:"
              es: "Estos verbos llevan un infinitivo detrás; solo el primer verbo cambia según la persona:"
              uk: "Після цих дієслів стоїть інфінітив; за особами змінюється лише перше дієслово:"
            ex: ["¿", { target: Puedes venir }, " mañana?"]
            tr: { en: "Can you come tomorrow?", uk: "Можеш прийти завтра?" }
          - type: rule
            level: A2
            text:
              en: [{ term: tener que }, " and ", { term: hay que }, " take ", { term: que }, " before the infinitive; ", { term: poder }, ", ", { term: saber }, " and ", { term: deber }, " take nothing."]
              es: [{ term: tener que }, " y ", { term: hay que }, " llevan ", { term: que }, " delante del infinitivo; ", { term: poder }, ", ", { term: saber }, " y ", { term: deber }, " no llevan nada."]
              uk: [{ term: "tener que" }, " і ", { term: "hay que" }, " вимагають ", { term: "que" }, " перед інфінітивом; ", { term: "poder" }, ", ", { term: "saber" }, " і ", { term: "deber" }, " — нічого."]
          - type: note
            level: A2
            text:
              en: ["Verbs that say when or how often something happens: ", { link: "Verb Phrases: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              es: ["Verbos que dicen cuándo o con qué frecuencia pasa algo: ", { link: "Perífrasis: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              uk: ["Дієслова, що вказують, коли або як часто щось відбувається: ", { link: "Перифрази: acabar de, volver a, soler", to: "es.imperativo-perifrasis.perifrasis-aspectuales" }, "."]

  - title: { en: "Form: poder and saber", es: "Forma: poder y saber", uk: "Форма: poder і saber" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: poder, label: poder }
          - { key: saber, label: saber }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, poder: { target: puedo }, saber: { target: sé } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, poder: { target: puedes }, saber: { target: sabes } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, poder: { target: puede }, saber: { target: sabe } }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, poder: { target: podemos }, saber: { target: sabemos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, poder: { target: podéis }, saber: { target: sabéis } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, poder: { target: pueden }, saber: { target: saben } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: poder }, " changes ", { letter: o }, " to ", { letter: ue }, " when the stress falls on the stem: ", { alternatives: [{ term: puedo }, { term: puedes }, { term: pueden }] }, "."]
              es: [{ term: poder }, " cambia ", { letter: o }, " por ", { letter: ue }, " cuando el acento cae en la raíz: ", { alternatives: [{ term: puedo }, { term: puedes }, { term: pueden }] }, "."]
              uk: [{ term: "poder" }, " змінює ", { letter: "o" }, " на ", { letter: "ue" }, ", коли наголос падає на основу: ", { alternatives: [{ term: "puedo" }, { term: "puedes" }, { term: "pueden" }] }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: saber }, " is irregular only in the ", { term: yo }, " form: ", { term: sé }, ", with a written accent."]
              es: [{ term: saber }, " solo es irregular en la forma de ", { term: yo }, ": ", { term: sé }, ", con tilde."]
              uk: [{ term: "saber" }, " неправильне лише у формі ", { term: "yo" }, ": ", { term: "sé" }, ", зі знаком наголосу."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українська теж розрізняє ці значення: ", { l1: "я вмію плавати" }, " — ", { term: "sé nadar" }, ", ", { l1: "сьогодні я не можу плавати" }, " — ", { term: "hoy no puedo nadar" }, "."]
          - type: note
            level: B1
            text:
              en: [{ term: deber }, " is a regular ", { term: "-er" }, " verb: ", { alternatives: [{ term: debo }, { term: debes }, { term: debe }] }, "."]
              es: [{ term: deber }, " es un verbo regular en ", { term: "-er" }, ": ", { alternatives: [{ term: debo }, { term: debes }, { term: debe }] }, "."]
              uk: [{ term: "deber" }, " — правильне дієслово на ", { term: "-er" }, ": ", { alternatives: [{ term: "debo" }, { term: "debes" }, { term: "debe" }] }, "."]

  - title: { en: "Use: poder and saber", es: "Uso: poder y saber", uk: "Вживання: poder і saber" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: Asking for permission, es: Pedir permiso, uk: "Попросити дозволу" }, ex: ["¿", { target: Puedo abrir }, " la ventana?"], tr: { en: "Can I open the window?", uk: "Можна відчинити вікно?" } }
          - level: A2
            use: { en: Asking someone to do something, es: Pedir a alguien que haga algo, uk: "Попросити когось щось зробити" }
            ex: { examples: [["¿", { target: Puedes repetir }, ", por favor?"], ["¿", { target: Puede hablar }, " más despacio?"]] }
            tr: { en: { examples: ["Can you repeat that, please?", "Could you speak more slowly?"] }, uk: { examples: ["Можеш повторити, будь ласка?", "Чи не могли б ви говорити повільніше?"] } }
          - level: A2
            use: { en: "A skill someone has learned: saber", es: "Una habilidad aprendida: saber", uk: "Набуте вміння: saber" }
            ex: { examples: [[{ target: Sé nadar }, "."], ["¿", { target: Sabes cocinar }, "?"]] }
            tr: { en: { examples: ["I can swim.", "Can you cook?"] }, uk: { examples: ["Я вмію плавати.", "Ти вмієш готувати?"] } }
          - { level: A2, use: { en: Being able to do something now, es: Poder hacer algo ahora, uk: "Змога зробити щось зараз" }, ex: ["Hoy no ", { target: puedo salir }, ": tengo mucho trabajo."], tr: { en: "I can't go out today: I've got a lot of work.", uk: "Сьогодні я не можу вийти: у мене багато роботи." } }
          - { level: B1, use: { en: Saying something is not allowed, es: Decir que algo no está permitido, uk: "Сказати, що щось не дозволено" }, ex: ["En el hospital ", { target: no puedes hablar }, " alto."], tr: { en: "You can't talk loudly in the hospital.", uk: "У лікарні не можна голосно розмовляти." } }
          - { level: B1, use: { en: Asking what is allowed in a place, es: Preguntar qué está permitido en un lugar, uk: "Запитати, що дозволено в певному місці" }, ex: ["¿", { target: Se puede fumar }, " aquí?"], tr: { en: "Is smoking allowed here?", uk: "Тут можна курити?" } }

  - title: { en: "Use: tener que, hay que, deber", es: "Uso: tener que, hay que, deber", uk: "Вживання: tener que, hay que, deber" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: "What one person needs to do: tener que", es: "Lo que una persona necesita hacer: tener que", uk: "Те, що потрібно зробити одній людині: tener que" }, ex: [{ target: Tengo que trabajar }, " el sábado."], tr: { en: "I have to work on Saturday.", uk: "У суботу мені треба працювати." } }
          - { level: A2, use: { en: "What everyone needs to do: hay que", es: "Lo que todos necesitan hacer: hay que", uk: "Те, що потрібно робити всім: hay que" }, ex: [{ target: Hay que pagar }, " antes de entrar."], tr: { en: "You have to pay before going in.", uk: "Перед входом треба заплатити." } }
          - level: A2
            use: { en: "What nobody needs to do, or, in a rule, what nobody should do: no hay que", es: "Lo que nadie necesita hacer o, en una norma, lo que nadie debe hacer: no hay que", uk: "Те, чого нікому не потрібно робити, або в правилах — чого ніхто не повинен робити: no hay que" }
            ex: { examples: [["Para estar en forma ", { target: no hay que hacer }, " mucho ejercicio."], [{ target: No hay que hablar }, " en el cine."]] }
            tr: { en: { examples: ["You don't need to do a lot of exercise to keep fit.", "You shouldn't talk in the cinema."] }, uk: { examples: ["Щоб бути у формі, не обов’язково багато тренуватися.", "У кіно не слід розмовляти."] } }
          - { level: A2, use: { en: "Something not necessary: no tener que", es: "Algo que no es necesario: no tener que", uk: "Щось необов’язкове: no tener que" }, ex: ["Mañana ", { target: no tengo que trabajar }, "."], tr: { en: "I don't have to work tomorrow.", uk: "Завтра мені не треба працювати." } }
          - level: B1
            use: { en: "What is right or required: deber", es: "Lo que es correcto u obligatorio: deber", uk: "Те, що правильно або обов’язково: deber" }
            ex: { examples: [[{ target: Debes decir }, " la verdad."], [{ target: No debes hablar }, " así."]] }
            tr: { en: { examples: ["You must tell the truth.", "You mustn't talk like that."] }, uk: { examples: ["Ти повинен казати правду.", "Ти не повинен так говорити."] } }
          - level: B1
            use: { en: "Advice: deberías", es: "Consejos: deberías", uk: "Поради: deberías" }
            ex: { examples: [[{ target: Deberías descansar }, "."], [{ target: Deberíamos hablar }, " con él."]] }
            tr: { en: { examples: ["You should rest.", "We should talk to him."] }, uk: { examples: ["Тобі варто відпочити.", "Нам варто з ним поговорити."] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: tener que }, " changes for the person; ", { term: hay que }, " never changes:"]
              es: [{ term: tener que }, " cambia según la persona; ", { term: hay que }, " no cambia nunca:"]
              uk: [{ term: "tener que" }, " змінюється за особами; ", { term: "hay que" }, " не змінюється ніколи:"]
            ex: { examples: [[{ target: Tenemos que salir }, " ya."], [{ target: Hay que salir }, " ya."]] }
            tr: { en: { examples: ["We have to leave now.", "It's time to leave."] }, uk: { examples: ["Нам треба вже йти.", "Треба вже йти."] } }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українське ", { l1: "я маю працювати" }, " іспанською — ", { term: "tengo que trabajar" }, ": між ", { term: tener }, " та інфінітивом завжди стоїть ", { term: que }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: no tener que }, " says something is not necessary; ", { term: no deber }, " says it is wrong, as a duty or a piece of advice; ", { term: no poder }, " says it is not allowed:"]
              es: [{ term: no tener que }, " dice que algo no es necesario; ", { term: no deber }, ", que no está bien, como deber o como consejo; ", { term: no poder }, ", que no está permitido:"]
              uk: [{ term: "no tener que" }, " означає, що щось не обов’язкове; ", { term: "no deber" }, " — що так робити не слід, як обов’язок чи порада; ", { term: "no poder" }, " — що це не дозволено:"]
            ex: { examples: [[{ target: No tienes que venir }, "."], [{ target: No debes mentir }, "."], [{ target: No puedes fumar }, " aquí."]] }
            tr: { en: { examples: ["You don't have to come.", "You mustn't lie.", "You can't smoke here."] }, uk: { examples: ["Тобі не обов’язково приходити.", "Ти не повинен брехати.", "Тут не можна курити."] } }
          - type: note
            level: B1
            text:
              en: [{ term: deberías }, " is the conditional of ", { term: deber }, ": ", { link: Conditional, to: es.futuro-condicional.condicional-simple }, "."]
              es: [{ term: deberías }, " es el condicional de ", { term: deber }, ": ", { link: El condicional simple, to: es.futuro-condicional.condicional-simple }, "."]
              uk: [{ term: "deberías" }, " — умовний спосіб від ", { term: "deber" }, ": ", { link: "Умовний спосіб: comería", to: "es.futuro-condicional.condicional-simple" }, "."]

  - title: { en: Pronouns with these verbs, es: Pronombres con estos verbos, uk: "Займенники з цими дієсловами" }
    role: own
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: "Дієслово" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - level: A2
            verb: poder
            ex: { examples: [[{ target: Lo puedo hacer }, "."], [{ target: Puedo hacerlo }, "."]] }
            tr: { en: { examples: ["I can do it.", "I can do it."] }, uk: { examples: ["Я можу це зробити.", "Я можу це зробити."] } }
          - level: A2
            verb: tener que
            ex: { examples: [[{ target: Me tengo que ir }, "."], [{ target: Tengo que irme }, "."]] }
            tr: { en: { examples: ["I have to go.", "I have to go."] }, uk: { examples: ["Мені треба йти.", "Мені треба йти."] } }
          - level: A2
            verb: hay que
            ex: [{ target: Hay que hacerlo }, " hoy."]
            tr: { en: "It has to be done today.", uk: "Це треба зробити сьогодні." }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A pronoun goes before the conjugated verb or joins the end of the infinitive; both mean the same."
              es: "El pronombre va delante del verbo conjugado o se une al final del infinitivo; las dos formas significan lo mismo."
              uk: "Займенник стоїть перед відмінюваним дієсловом або приєднується до кінця інфінітива; обидва варіанти означають те саме."
          - type: rule
            level: A2
            text:
              en: ["With ", { term: hay que }, ", the pronoun always joins the end of the infinitive."]
              es: ["Con ", { term: hay que }, ", el pronombre siempre se une al final del infinitivo."]
              uk: ["З ", { term: "hay que" }, " займенник завжди приєднується до кінця інфінітива."]

