        rows:
          - level: A2
            verb: poder
            ex: { examples: [[{ target: Lo puedo hacer }, "."], [{ target: Puedo hacerlo }, "."]] }
            tr: { en: { examples: ["I can do it.", "I can do it."] }, uk: { examples: ["Я можу це зробити.", "Я можу це зробити."] }, pt: { examples: ["Eu posso fazer isso.", "Eu posso fazer isso."] }, fr: { examples: ["Je peux le faire.", "Je peux le faire."] }, de: { examples: ["Ich kann es tun.", "Ich kann es tun."] }, it: { examples: ["Posso farlo.", "Posso farlo."] }, pl: { examples: ["Mogę to zrobić.", "Mogę to zrobić."] }, tr: { examples: ["Bunu yapabilirim.", "Bunu yapabilirim."] }, id: { examples: ["Saya bisa melakukannya.", "Saya bisa melakukannya."] }, vi: { examples: ["Tôi làm được việc đó.", "Tôi làm được việc đó."] } }
          - level: A2
            verb: tener que
            ex: { examples: [[{ target: Me tengo que ir }, "."], [{ target: Tengo que irme }, "."]] }
            tr: { en: { examples: ["I have to go.", "I have to go."] }, uk: { examples: ["Мені треба йти.", "Мені треба йти."] }, pt: { examples: ["Tenho que ir embora.", "Tenho que ir embora."] }, fr: { examples: ["Je dois partir.", "Je dois partir."] }, de: { examples: ["Ich muss gehen.", "Ich muss gehen."] }, it: { examples: ["Devo andare.", "Devo andare."] }, pl: { examples: ["Muszę iść.", "Muszę iść."] }, tr: { examples: ["Gitmem gerekiyor.", "Gitmem gerekiyor."] }, id: { examples: ["Saya harus pergi.", "Saya harus pergi."] }, vi: { examples: ["Tôi phải đi.", "Tôi phải đi."] } }
          - level: A2
            verb: hay que
            ex: [{ target: Hay que hacerlo }, " hoy."]
            tr: { en: "It has to be done today.", uk: "Це треба зробити сьогодні.", pt: "É preciso fazer isso hoje.", fr: "Il faut le faire aujourd’hui.", de: "Man muss es heute tun.", it: "Bisogna farlo oggi.", pl: "Trzeba to zrobić dzisiaj.", tr: "Bunun bugün yapılması gerekiyor.", id: "Hal itu harus dikerjakan hari ini.", vi: "Việc này phải làm hôm nay." }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A pronoun goes before the conjugated verb or joins the end of the infinitive; both mean the same."
              es: "El pronombre va delante del verbo conjugado o se une al final del infinitivo; las dos formas significan lo mismo."
              uk: "Займенник стоїть перед відмінюваним дієсловом або приєднується до кінця інфінітива; обидва варіанти означають те саме."
              pt: "O pronome vai antes do verbo conjugado ou se liga ao fim do infinitivo; as duas formas significam o mesmo."
              fr: "Le pronom se place devant le verbe conjugué ou se soude à la fin de l’infinitif ; les deux formes ont le même sens."
              de: "Ein Pronomen steht vor dem konjugierten Verb oder wird an den Infinitiv angehängt; beides bedeutet dasselbe."
              it: "Il pronome va prima del verbo coniugato oppure si unisce alla fine dell'infinito; le due forme hanno lo stesso significato."
              pl: "Zaimek stoi przed odmienionym czasownikiem albo dołącza się na końcu bezokolicznika; obie formy znaczą to samo."
              tr: "Zamir çekimli fiilin önüne gelir ya da mastarın sonuna eklenir; iki kullanım da aynı anlama gelir."
              id: "Kata ganti diletakkan sebelum kata kerja yang dikonjugasikan atau digabung di akhir infinitif; keduanya berarti sama."
              vi: "Đại từ đứng trước động từ đã chia hoặc gắn vào cuối động từ nguyên mẫu; hai cách có nghĩa như nhau."
          - type: rule
            level: A2
            text:
              en: ["With ", { term: hay que }, ", the pronoun always joins the end of the infinitive."]
              es: ["Con ", { term: hay que }, ", el pronombre siempre se une al final del infinitivo."]
              uk: ["З ", { term: "hay que" }, " займенник завжди приєднується до кінця інфінітива."]
              pt: ["Com ", { term: "hay que" }, ", o pronome sempre se liga ao fim do infinitivo."]
              fr: ["Avec ", { term: "hay que" }, ", le pronom se soude toujours à la fin de l’infinitif."]
              de: ["Bei ", { term: "hay que" }, " wird das Pronomen immer an den Infinitiv angehängt."]
              it: ["Con ", { term: "hay que" }, " il pronome si unisce sempre alla fine dell'infinito."]
              pl: ["Przy ", { term: "hay que" }, " zaimek zawsze dołącza się na końcu bezokolicznika."]
              tr: [{ term: "hay que" }, " ile zamir her zaman mastarın sonuna eklenir."]
              id: ["Dengan ", { term: "hay que" }, ", kata ganti selalu digabung di akhir infinitif."]
              vi: ["Với ", { term: "hay que" }, ", đại từ luôn gắn vào cuối động từ nguyên mẫu."]

