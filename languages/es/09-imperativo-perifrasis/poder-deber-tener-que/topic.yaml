          tr: { en: { examples: ["You don't have to come.", "You mustn't lie.", "You can't smoke here."] }, uk: { examples: ["Тобі не обов’язково приходити.", "Ти не повинен брехати.", "Тут не можна курити."] }, pt: { examples: ["Você não precisa vir.", "Você não deve mentir.", "Você não pode fumar aqui."] }, fr: { examples: ["Tu n’as pas besoin de venir.", "Tu ne dois pas mentir.", "Tu ne peux pas fumer ici."] }, de: { examples: ["Du musst nicht kommen.", "Du sollst nicht lügen.", "Hier darfst du nicht rauchen."] }, it: { examples: ["Non hai bisogno di venire.", "Non devi mentire.", "Qui non si può fumare."] }, pl: { examples: ["Nie musisz przychodzić.", "Nie powinieneś kłamać.", "Tu nie wolno palić."] }, tr: { examples: ["Gelmek zorunda değilsin.", "Yalan söylememelisin.", "Burada sigara içemezsin."] }, id: { examples: ["Kamu tidak perlu datang.", "Kamu tidak boleh berbohong.", "Di sini kamu tidak boleh merokok."] }, vi: { examples: ["Bạn không cần đến.", "Bạn không nên nói dối.", "Ở đây bạn không được hút thuốc."] } }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "These verbs take an infinitive after them; only the first verb changes for the person:"
              es: "Estos verbos llevan un infinitivo detrás; solo el primer verbo cambia según la persona:"
              uk: "Після цих дієслів стоїть інфінітив; за особами змінюється лише перше дієслово:"
              pt: "Estes verbos levam um infinitivo depois deles; só o primeiro verbo muda conforme a pessoa:"
              fr: "Ces verbes sont suivis d’un infinitif ; seul le premier verbe change selon la personne :"
              de: "Nach diesen Verben steht ein Infinitiv; nur das erste Verb ändert sich mit der Person:"
              it: "Questi verbi sono seguiti da un infinito; cambia solo il primo verbo, secondo la persona:"
              pl: "Po tych czasownikach stoi bezokolicznik; zmienia się tylko pierwszy czasownik, według osoby:"
              tr: "Bu fiillerden sonra mastar gelir; kişiye göre yalnızca ilk fiil değişir:"
              id: "Kata kerja ini diikuti infinitif; hanya kata kerja pertama yang berubah menurut orangnya:"
              vi: "Sau những động từ này là động từ nguyên mẫu; chỉ động từ thứ nhất thay đổi theo ngôi:"
            ex: ["¿", { target: Puedes venir }, " mañana?"]
            tr: { en: "Can you come tomorrow?", uk: "Можеш прийти завтра?", pt: "Você pode vir amanhã?", fr: "Peux-tu venir demain ?", de: "Kannst du morgen kommen?", it: "Puoi venire domani?", pl: "Możesz przyjść jutro?", tr: "Yarın gelebilir misin?", id: "Bisakah kamu datang besok?", vi: "Ngày mai bạn đến được không?" }
          - type: rule
            level: A2
            text:
              en: [{ term: tener que }, " and ", { term: hay que }, " take ", { term: que }, " before the infinitive; ", { term: poder }, ", ", { term: saber }, " and ", { term: deber }, " take nothing."]
              es: [{ term: tener que }, " y ", { term: hay que }, " llevan ", { term: que }, " delante del infinitivo; ", { term: poder }, ", ", { term: saber }, " y ", { term: deber }, " no llevan nada."]
              uk: [{ term: "tener que" }, " і ", { term: "hay que" }, " вимагають ", { term: "que" }, " перед інфінітивом; ", { term: "poder" }, ", ", { term: "saber" }, " і ", { term: "deber" }, " — нічого."]
              pt: [{ term: tener que }, " e ", { term: hay que }, " levam ", { term: que }, " antes do infinitivo; ", { term: poder }, ", ", { term: saber }, " e ", { term: deber }, " não levam nada."]
              fr: [{ term: tener que }, " et ", { term: hay que }, " prennent ", { term: que }, " devant l’infinitif ; ", { term: poder }, ", ", { term: saber }, " et ", { term: deber }, " ne prennent rien."]
              de: [{ term: tener que }, " und ", { term: hay que }, " haben ", { term: que }, " vor dem Infinitiv; ", { term: poder }, ", ", { term: saber }, " und ", { term: deber }, " haben nichts."]
              it: [{ term: tener que }, " e ", { term: hay que }, " vogliono ", { term: que }, " davanti all'infinito; ", { term: poder }, ", ", { term: saber }, " e ", { term: deber }, " non vogliono nulla."]
              pl: [{ term: tener que }, " i ", { term: hay que }, " mają ", { term: que }, " przed bezokolicznikiem; ", { term: poder }, ", ", { term: saber }, " i ", { term: deber }, " nie mają niczego."]
              tr: [{ term: tener que }, " ve ", { term: hay que }, " mastardan önce ", { term: que }, " alır; ", { term: poder }, ", ", { term: saber }, " ve ", { term: deber }, " hiçbir şey almaz."]
              id: [{ term: tener que }, " dan ", { term: hay que }, " memakai ", { term: que }, " sebelum infinitif; ", { term: poder }, ", ", { term: saber }, ", dan ", { term: deber }, " tidak memakai apa pun."]
              vi: [{ term: tener que }, " và ", { term: hay que }, " cần ", { term: que }, " trước động từ nguyên mẫu; ", { term: poder }, ", ", { term: saber }, " và ", { term: deber }, " không cần gì cả."]
          - type: note
            level: A2
            text:
              en: ["Verbs that say when or how often something happens: ", { link: "Verb Phrases: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              es: ["Verbos que dicen cuándo o con qué frecuencia pasa algo: ", { link: "Perífrasis: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              uk: ["Дієслова, що вказують, коли або як часто щось відбувається: ", { link: "Перифрази: acabar de, volver a, soler", to: "es.imperativo-perifrasis.perifrasis-aspectuales" }, "."]
              pt: ["Verbos que dizem quando ou com que frequência algo acontece: ", { link: "Perífrases verbais: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              fr: ["Des verbes qui disent quand ou à quelle fréquence quelque chose arrive : ", { link: "Périphrases verbales : acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              de: ["Verben, die sagen, wann oder wie oft etwas geschieht: ", { link: "Verbalperiphrasen: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              it: ["Verbi che dicono quando o con che frequenza accade qualcosa: ", { link: "Perifrasi verbali: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              pl: ["Czasowniki mówiące, kiedy lub jak często coś się dzieje: ", { link: "Peryfrazy czasownikowe: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              tr: ["Bir şeyin ne zaman ya da ne sıklıkla olduğunu söyleyen fiiller: ", { link: "Fiil perifrazları: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              id: ["Kata kerja yang menyatakan kapan atau seberapa sering sesuatu terjadi: ", { link: "Perifrasis verbal: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]
              vi: ["Những động từ cho biết khi nào hoặc bao lâu một lần việc gì xảy ra: ", { link: "Cụm động từ: acabar de, volver a, soler", to: es.imperativo-perifrasis.perifrasis-aspectuales }, "."]

  - title: { en: "Form: poder and saber", es: "Forma: poder y saber", uk: "Форма: poder і saber", pt: "Forma: poder e saber", fr: "Forme : poder et saber", de: "Form: poder und saber", it: "Forma: poder e saber", pl: "Forma: poder i saber", tr: "Biçim: poder ve saber", id: "Bentuk: poder dan saber", vi: "Dạng: poder và saber" }
