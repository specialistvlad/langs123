# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.imperativo-perifrasis.imperativo-negativo
lang: es
kind: grammar
tags: [verbs, imperative, subjunctive, negation]
concepts: [imperative, subjunctive]
related: [es.imperativo-perifrasis.imperativo-afirmativo, es.subjuntivo.subjuntivo-formas, es.pronombres.combinacion-pronombres, es.presente.verbos-reflexivos]
status: { en: draft, es: draft }
translated: { es: "5dfe3b 244304 ac56eb 7eac1b 2549c3 17221f 38909b 8b5732 9a18e1" }

title: { en: Negative Imperative, es: El imperativo negativo }
summary:
  lead:
    en: ["The negative imperative is ", { term: no }, " with the present subjunctive: ", { term: no hables }, ", ", { term: no comas }, ", ", { term: no hable }, ", ", { term: no hablen }, "."]
    es: ["El imperativo negativo es ", { term: no }, " con el presente de subjuntivo: ", { term: no hables }, ", ", { term: no comas }, ", ", { term: no hable }, ", ", { term: no hablen }, "."]
  rule:
    en: ["Pronouns go between ", { term: no }, " and the verb:"]
    es: ["Los pronombres van entre ", { term: no }, " y el verbo:"]
  ex: { examples: [[{ target: No lo toques }, "."], [{ target: No te vayas }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: tú }, ": ", { term: "-ar" }, " verbs end in ", { ending: es }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " verbs in ", { ending: as }]
            es: [{ term: tú }, ": los verbos en ", { term: "-ar" }, " terminan en ", { ending: es }, ", los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, ", en ", { ending: as }]
          ex: [{ target: No hables }, " tan alto."]
          tr: { en: "Don't speak so loudly." }
        - level: B1
          point: { en: Form, es: Forma }
          rule:
            en: [{ alternatives: [{ term: usted }, { term: ustedes }] }, ": the affirmative form after ", { term: no }]
            es: [{ alternatives: [{ term: usted }, { term: ustedes }] }, ": la forma afirmativa detrás de ", { term: no }]
          ex: [{ target: No fume }, " aquí, por favor."]
          tr: { en: "Please don't smoke here." }
        - level: B1
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vosotros }, ": ", { term: "-ar" }, " verbs end in ", { ending: éis }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " verbs in ", { ending: áis }]
            es: [{ term: vosotros }, ": los verbos en ", { term: "-ar" }, " terminan en ", { ending: éis }, ", los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, ", en ", { ending: áis }]
          ex: [{ target: No habléis }, " tan alto."]
          tr: { en: "Don't speak so loudly." }
        - level: B1
          point: { en: Irregular verbs, es: Verbos irregulares }
          rule:
            en: ["the stem of the ", { term: yo }, " form: ", { alternatives: [{ term: no digas }, { term: no hagas }, { term: no vengas }] }]
            es: ["la raíz de la forma de ", { term: yo }, ": ", { alternatives: [{ term: no digas }, { term: no hagas }, { term: no vengas }] }]
          ex: [{ target: No digas }, " eso."]
          tr: { en: "Don't say that." }
        - level: B1
          point: { en: Pronouns, es: Pronombres }
          rule:
            en: ["before the verb, after ", { term: no }]
            es: ["delante del verbo, detrás de ", { term: no }]
          ex: [{ target: No lo toques }, "."]
          tr: { en: "Don't touch it." }
        - level: B1
          point: { en: Use, es: Uso }
          rule:
            en: "prohibitions and warnings"
            es: "prohibiciones y advertencias"
          ex: [{ target: No toques }, " el horno: está caliente."]
          tr: { en: "Don't touch the oven: it's hot." }
        - level: B1
          point: { en: Use, es: Uso }
          rule:
            en: "advice and reassurance"
            es: "consejos y palabras de ánimo"
          ex: [{ target: No te preocupes }, "."]
          tr: { en: "Don't worry." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["the negative never takes the affirmative form: ", { mapping: [{ term: ven }, { term: no vengas }] }]
            es: ["el negativo nunca toma la forma afirmativa: ", { mapping: [{ term: ven }, { term: no vengas }] }]
          ex: [{ target: No vengas }, " tarde."]
          tr: { en: "Don't come late." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["the pronoun moves before the verb: ", { mapping: [{ term: siéntate }, { term: no te sientes }] }]
            es: ["el pronombre pasa delante del verbo: ", { mapping: [{ term: siéntate }, { term: no te sientes }] }]
          ex: [{ target: No te sientes }, " ahí."]
          tr: { en: "Don't sit there." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Every negative imperative is ", { term: no }, " with the present subjunctive."]
              es: ["Todo imperativo negativo es ", { term: no }, " con el presente de subjuntivo."]
          - type: rule
            level: B1
            text:
              en: ["The ", { term: usted }, " and ", { term: ustedes }, " forms stay as in the affirmative, after ", { term: no }, ":"]
              es: ["Las formas de ", { term: usted }, " y ", { term: ustedes }, " son las del afirmativo, detrás de ", { term: no }, ":"]
            ex: [{ target: No hable }, " tan rápido, por favor."]
            tr: { en: "Please don't speak so fast." }
          - type: note
            level: B1
            variety: es-419
            text:
              en: [{ term: ustedes }, " speaks to every group, friends included:"]
              es: [{ term: ustedes }, " se dirige a cualquier grupo, también a los amigos:"]
            ex: [{ target: No corran }, ", niños."]
            tr: { en: "Don't run, kids." }
          - type: note
            level: B1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " speaks to friends and family:"]
              es: [{ term: vosotros }, " se dirige a amigos y familia:"]
            ex: [{ target: No corráis }, ", niños."]
            tr: { en: "Don't run, kids." }
          - type: note
            level: B1
            text:
              en: ["The forms in full: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Todas las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: escribir }
        rows:
          - { level: B1, features: { mood: imp, polarity: neg, person: 2, number: sg, politeness: infm }, person: tú, ar: { target: no hables }, er: { target: no comas }, ir: { target: no escribas } }
          - { level: B1, features: { mood: imp, polarity: neg, person: 2, number: sg, politeness: form }, person: usted, ar: { target: no hable }, er: { target: no coma }, ir: { target: no escriba } }
          - { level: B1, variety: es-ES, features: { mood: imp, polarity: neg, person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: no habléis }, er: { target: no comáis }, ir: { target: no escribáis } }
          - { level: B1, features: { mood: imp, polarity: neg, person: 2, number: pl }, person: ustedes, ar: { target: no hablen }, er: { target: no coman }, ir: { target: no escriban } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: "-ar" }, " verbs take ", { letter: e }, " in the ending, ", { term: "-er" }, " and ", { term: "-ir" }, " verbs take ", { letter: a }, ":"]
              es: ["Los verbos en ", { term: "-ar" }, " llevan ", { letter: e }, " en la terminación, los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, " llevan ", { letter: a }, ":"]
            ex: { examples: [[{ target: No hables }, " tan alto."], [{ target: No comas }, " tan rápido."]] }
            tr: { en: { examples: ["Don't speak so loudly.", "Don't eat so fast."] } }
          - type: rule
            level: B1
            text:
              en: ["The ", { term: tú }, " form adds ", { ending: s }, " to the ", { term: usted }, " form: ", { mapping: [{ term: no hable }, { term: no hables }] }, "."]
              es: ["La forma de ", { term: tú }, " añade ", { ending: s }, " a la forma de ", { term: usted }, ": ", { mapping: [{ term: no hable }, { term: no hables }] }, "."]
          - type: rule
            level: B1
            variety: es-ES
            text:
              en: ["The ", { term: vosotros }, " form carries a written accent: ", { alternatives: [{ term: habléis }, { term: comáis }] }, ":"]
              es: ["La forma de ", { term: vosotros }, " lleva tilde: ", { alternatives: [{ term: habléis }, { term: comáis }] }, ":"]
            ex: [{ target: No escribáis }, " en el libro."]
            tr: { en: "Don't write in the book." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: pos, label: { en: Affirmative, es: Afirmativo }, features: { mood: imp, polarity: pos, person: 2, number: sg, politeness: infm } }
          - { key: neg, label: { en: Negative, es: Negativo }, features: { mood: imp, polarity: neg, person: 2, number: sg, politeness: infm } }
        rows:
          - { level: B1, verb: decir, pos: di, neg: { target: no digas } }
          - { level: B1, verb: hacer, pos: haz, neg: { target: no hagas } }
          - { level: B1, verb: poner, pos: pon, neg: { target: no pongas } }
          - { level: B1, verb: salir, pos: sal, neg: { target: no salgas } }
          - { level: B1, verb: tener, pos: ten, neg: { target: no tengas } }
          - { level: B1, verb: venir, pos: ven, neg: { target: no vengas } }
          - { level: B1, verb: ir, pos: ve, neg: { target: no vayas } }
          - { level: B1, verb: ser, pos: sé, neg: { target: no seas } }
          - { level: B1, verb: cerrar, pos: cierra, neg: { target: no cierres } }
          - { level: B1, verb: volver, pos: vuelve, neg: { target: no vuelvas } }
          - { level: B1, verb: pedir, pos: pide, neg: { target: no pidas } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The negative takes the stem of the ", { term: yo }, " form of the present: ", { mapping: [{ term: tengo }, { term: no tengas }] }, ", ", { mapping: [{ term: digo }, { term: no digas }] }, "."]
              es: ["El negativo toma la raíz de la forma de ", { term: yo }, " del presente: ", { mapping: [{ term: tengo }, { term: no tengas }] }, ", ", { mapping: [{ term: digo }, { term: no digas }] }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: ir }, " and ", { term: ser }, " have stems of their own: ", { alternatives: [{ term: no vayas }, { term: no seas }] }, "."]
              es: [{ term: ir }, " y ", { term: ser }, " tienen raíces propias: ", { alternatives: [{ term: no vayas }, { term: no seas }] }, "."]

  - title: { en: "Spelling: c, g and z", es: "Ortografía: c, g y z" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: change, label: { en: Change, es: Cambio } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, verb: { term: "-car" }, change: { mapping: [{ letter: c }, { letter: qu }] }, ex: [{ target: No toques }, " eso."], tr: { en: "Don't touch that." } }
          - { level: B1, verb: { term: "-gar" }, change: { mapping: [{ letter: g }, { letter: gu }] }, ex: [{ target: No llegues }, " tarde."], tr: { en: "Don't be late." } }
          - { level: B1, verb: { term: "-zar" }, change: { mapping: [{ letter: z }, { letter: c }] }, ex: [{ target: No empieces }, " sin mí."], tr: { en: "Don't start without me." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Before ", { letter: e }, ", the spelling changes so the verb keeps its sound."]
              es: ["Delante de ", { letter: e }, ", la ortografía cambia para que el verbo conserve su sonido."]

  - title: { en: Pronouns before the verb, es: Pronombres delante del verbo }
    role: own
    content:
      - type: comparison
        columns:
          - { key: pos, label: { en: Affirmative, es: Afirmativo } }
          - { key: neg, label: { en: Negative, es: Negativo } }
        rows:
          - level: B1
            pos: { ex: { target: Cómpralo. }, tr: { en: "Buy it." } }
            neg: { ex: [{ target: No lo compres }, "."], tr: { en: "Don't buy it." } }
          - level: B1
            pos: { ex: { target: Siéntate. }, tr: { en: "Sit down." } }
            neg: { ex: [{ target: No te sientes }, "."], tr: { en: "Don't sit down." } }
          - level: B1
            pos: { ex: { target: Dímelo. }, tr: { en: "Tell me it." } }
            neg: { ex: [{ target: No me lo digas }, "."], tr: { en: "Don't tell me that." } }
          - level: B1
            pos: { ex: [{ target: Levántense }, ", por favor."], tr: { en: "Stand up, please." } }
            neg: { ex: [{ target: No se levanten }, ", por favor."], tr: { en: "Please don't stand up." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["In the negative, pronouns leave the end of the verb and go between ", { term: no }, " and the verb."]
              es: ["En el negativo, los pronombres dejan el final del verbo y van entre ", { term: no }, " y el verbo."]
          - type: rule
            level: B1
            text:
              en: ["Two pronouns keep their order: ", { alternatives: [{ term: me lo }, { term: te lo }, { term: se lo }] }, "."]
              es: ["Dos pronombres mantienen su orden: ", { alternatives: [{ term: me lo }, { term: te lo }, { term: se lo }] }, "."]
          - type: note
            level: B1
            text:
              en: ["The written accent of the affirmative disappears in the negative: ", { mapping: [{ term: cómpralo }, { term: no lo compres }] }, "."]
              es: ["La tilde del afirmativo desaparece en el negativo: ", { mapping: [{ term: cómpralo }, { term: no lo compres }] }, "."]

  - title: { en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, use: { en: Prohibitions, es: Prohibiciones }, ex: [{ target: No fumes }, " aquí."], tr: { en: "Don't smoke here." } }
          - { level: B1, use: { en: Warnings, es: Advertencias }, ex: [{ target: No toques }, " el horno: está caliente."], tr: { en: "Don't touch the oven: it's hot." } }
          - { level: B1, use: { en: Advice, es: Consejos }, ex: [{ target: No bebas }, " café por la noche."], tr: { en: "Don't drink coffee at night." } }
          - level: B1
            use: { en: Reassurance, es: Palabras de ánimo }
            ex: { examples: [[{ target: No te preocupes }, "."], [{ target: No se preocupe }, "."]] }
            tr: { en: { examples: ["Don't worry.", "Don't worry."] } }
          - { level: B1, use: { en: Requests, es: Peticiones }, ex: [{ target: No hagas }, " ruido, por favor: el bebé duerme."], tr: { en: "Please don't make a noise: the baby is asleep." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Signs and instructions for everyone use ", { term: no }, " with the infinitive:"]
              es: ["Los carteles y las instrucciones para todos usan ", { term: no }, " con el infinitivo:"]
            ex: { examples: [{ target: No fumar. }, { target: No tocar. }] }
            tr: { en: { examples: ["No smoking.", "Do not touch."] } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "No habla tan alto.", right: [{ target: No hables }, " tan alto."], rule: { en: ["the negative takes the subjunctive: ", { term: no hables }], es: ["el negativo lleva subjuntivo: ", { term: no hables }] } }
          - { level: B1, wrong: "No ven tarde.", right: [{ target: No vengas }, " tarde."], rule: { en: ["the negative of ", { term: ven }, " is ", { term: no vengas }], es: ["el negativo de ", { term: ven }, " es ", { term: no vengas }] } }
          - { level: B1, wrong: "No tócalo.", right: [{ target: No lo toques }, "."], rule: { en: ["the pronoun goes after ", { term: no }, ", before the verb"], es: ["el pronombre va detrás de ", { term: no }, ", delante del verbo"] } }
          - { level: B1, wrong: "No te preocupas.", right: [{ target: No te preocupes }, "."], rule: { en: [{ term: preocuparse }, " takes ", { ending: e }, " in the negative"], es: [{ term: preocuparse }, " lleva ", { ending: e }, " en el negativo"] } }
          - { level: B1, wrong: "No preocupes.", right: [{ target: No te preocupes }, "."], rule: { en: ["the reflexive pronoun stays: ", { term: te }], es: ["el pronombre reflexivo se mantiene: ", { term: te }] } }
          - { level: B1, wrong: "No lleges tarde.", right: [{ target: No llegues }, " tarde."], rule: { en: ["before ", { letter: e }, ", ", { letter: g }, " becomes ", { letter: gu }], es: ["delante de ", { letter: e }, ", ", { letter: g }, " pasa a ", { letter: gu }] } }
