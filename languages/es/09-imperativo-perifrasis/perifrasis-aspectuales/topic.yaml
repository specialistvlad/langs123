title: { en: "Verb Phrases: acabar de, volver a, soler", es: "Perífrasis: acabar de, volver a, soler", uk: "Перифрази: acabar de, volver a, soler", pt: "Perífrases verbais: acabar de, volver a, soler", fr: "Périphrases verbales : acabar de, volver a, soler", de: "Verbalperiphrasen: acabar de, volver a, soler", it: "Perifrasi verbali: acabar de, volver a, soler", pl: "Peryfrazy czasownikowe: acabar de, volver a, soler", tr: "Fiil perifrazları: acabar de, volver a, soler", id: "Perifrasis verbal: acabar de, volver a, soler", vi: "Cụm động từ: acabar de, volver a, soler" }
summary:
  lead:
    en: ["Verb phrases say how an action goes: ", { term: acabar de }, " for something just done, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " and ", { term: soler }, "."]
    es: ["Las perífrasis dicen cómo transcurre una acción: ", { term: acabar de }, " para algo recién hecho, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " y ", { term: soler }, "."]
    uk: ["Перифрази показують, як перебігає дія: ", { term: "acabar de" }, " — щойно зроблене, а також ", { term: "empezar a" }, ", ", { term: "volver a" }, ", ", { term: "dejar de" }, ", ", { term: "seguir" }, " і ", { term: "soler" }, "."]
    pt: ["As perífrases verbais mostram como a ação se desenvolve: ", { term: acabar de }, " para algo recém-feito, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " e ", { term: soler }, "."]
    fr: ["Les périphrases verbales disent comment se déroule une action : ", { term: acabar de }, " pour ce qui vient d’être fait, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " et ", { term: soler }, "."]
    de: ["Verbalperiphrasen zeigen, wie eine Handlung verläuft: ", { term: acabar de }, " für gerade Geschehenes, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " und ", { term: soler }, "."]
    it: ["Le perifrasi verbali dicono come si svolge un'azione: ", { term: acabar de }, " per ciò che è appena successo, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " e ", { term: soler }, "."]
    pl: ["Peryfrazy czasownikowe pokazują, jak przebiega czynność: ", { term: acabar de }, " dla tego, co dopiero się stało, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " i ", { term: soler }, "."]
    tr: ["Fiil perifrazları eylemin nasıl ilerlediğini gösterir: az önce olmuş bir şey için ", { term: acabar de }, ", ayrıca ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " ve ", { term: soler }, "."]
    id: ["Perifrasis verbal menunjukkan jalannya suatu tindakan: ", { term: acabar de }, " untuk hal yang baru terjadi, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " dan ", { term: soler }, "."]
    vi: ["Cụm động từ cho biết hành động diễn ra thế nào: ", { term: acabar de }, " cho việc vừa xảy ra, ", { term: empezar a }, ", ", { term: volver a }, ", ", { term: dejar de }, ", ", { term: seguir }, " và ", { term: soler }, "."]
  rule:
    en: "The first verb changes and keeps its preposition; the second stays in the infinitive:"
    es: "El primer verbo cambia y mantiene su preposición; el segundo queda en infinitivo:"
    uk: "Перше дієслово змінюється і зберігає свій прийменник; друге лишається в інфінітиві:"
    pt: "O primeiro verbo muda e mantém a sua preposição; o segundo fica no infinitivo:"
    fr: "Le premier verbe change et garde sa préposition ; le second reste à l’infinitif :"
    de: "Das erste Verb verändert sich und behält seine Präposition; das zweite bleibt im Infinitiv:"
    it: "Il primo verbo cambia e mantiene la sua preposizione; il secondo resta all'infinito:"
    pl: "Pierwszy czasownik się zmienia i zachowuje swój przyimek; drugi pozostaje w bezokoliczniku:"
    tr: "İlk fiil değişir ve edatını korur; ikinci fiil mastar olarak kalır:"
    id: "Kata kerja pertama berubah dan mempertahankan kata depannya; yang kedua tetap berupa infinitif:"
    vi: "Động từ đầu biến đổi và giữ giới từ; động từ sau ở dạng nguyên mẫu:"
  ex: { examples: [[{ target: Acabo de llegar }, "."], [{ target: Vuelve a llover }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: form, label: { en: Form, es: Forma, uk: "Форма", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
        - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Ý nghĩa" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: A2
          form: { pattern: [acabar de, { slot: infinitive }] }
          meaning: { en: something that has just happened, es: algo que acaba de pasar, uk: "щось, що щойно сталося", pt: "algo que acabou de acontecer", fr: "quelque chose qui vient d’arriver", de: "etwas, das gerade geschehen ist", it: "qualcosa che è appena successo", pl: "coś, co dopiero się stało", tr: "az önce olmuş bir şey", id: "sesuatu yang baru saja terjadi", vi: "việc vừa mới xảy ra" }
          ex: [{ target: Acabo de llegar }, "."]
          tr: { en: "I've just arrived.", uk: "Я щойно прийшов.", pt: "Acabei de chegar.", fr: "Je viens d’arriver.", de: "Ich bin gerade angekommen.", it: "Sono appena arrivato.", pl: "Właśnie przyjechałem.", tr: "Yeni geldim.", id: "Aku baru saja tiba.", vi: "Tôi vừa mới đến." }
        - level: A2
          form: { pattern: [empezar a, { slot: infinitive }] }
          meaning: { en: the start of an action, es: el comienzo de una acción, uk: "початок дії", pt: "o início de uma ação", fr: "le début d’une action", de: "der Beginn einer Handlung", it: "l'inizio di un'azione", pl: "początek czynności", tr: "bir eylemin başlangıcı", id: "awal suatu tindakan", vi: "sự bắt đầu của một hành động" }
          ex: [{ target: Empiezo a trabajar }, " a las ocho."]
          tr: { en: "I start work at eight.", uk: "Я починаю працювати о восьмій.", pt: "Começo a trabalhar às oito.", fr: "Je commence à travailler à huit heures.", de: "Ich fange um acht Uhr an zu arbeiten.", it: "Comincio a lavorare alle otto.", pl: "Zaczynam pracę o ósmej.", tr: "Saat sekizde çalışmaya başlıyorum.", id: "Aku mulai bekerja pukul delapan.", vi: "Tôi bắt đầu làm việc lúc tám giờ." }
        - level: A2
          form: { pattern: [volver a, { slot: infinitive }] }
          meaning: { en: an action again, es: una acción otra vez, uk: "дія ще раз", pt: "uma ação outra vez", fr: "une action de nouveau", de: "eine Handlung noch einmal", it: "un'azione di nuovo", pl: "czynność jeszcze raz", tr: "bir eylemin yeniden yapılması", id: "tindakan yang terjadi lagi", vi: "hành động lặp lại lần nữa" }
          ex: [{ target: Vuelve a llover }, "."]
          tr: { en: "It's raining again.", uk: "Знову йде дощ.", pt: "Está chovendo de novo.", fr: "Il pleut de nouveau.", de: "Es regnet wieder.", it: "Piove di nuovo.", pl: "Znowu pada deszcz.", tr: "Yine yağmur yağıyor.", id: "Hujan turun lagi.", vi: "Trời lại mưa." }
        - level: B1
          form: { pattern: [dejar de, { slot: infinitive }] }
          meaning: { en: the end of a habit or an action, es: el final de un hábito o de una acción, uk: "кінець звички або дії", pt: "o fim de um hábito ou de uma ação", fr: "la fin d’une habitude ou d’une action", de: "das Ende einer Gewohnheit oder Handlung", it: "la fine di un'abitudine o di un'azione", pl: "koniec nawyku lub czynności", tr: "bir alışkanlığın ya da eylemin sonu", id: "berakhirnya kebiasaan atau tindakan", vi: "sự kết thúc của một thói quen hoặc hành động" }
          ex: [{ target: Dejé de fumar }, " el año pasado."]
          tr: { en: "I stopped smoking last year.", uk: "Торік я кинув курити.", pt: "Parei de fumar no ano passado.", fr: "J’ai arrêté de fumer l’année dernière.", de: "Ich habe letztes Jahr aufgehört zu rauchen.", it: "Ho smesso di fumare l'anno scorso.", pl: "Rzuciłem palenie w zeszłym roku.", tr: "Geçen yıl sigarayı bıraktım.", id: "Aku berhenti merokok tahun lalu.", vi: "Năm ngoái tôi đã bỏ hút thuốc." }
        - level: B1
          form: { pattern: [soler, { slot: infinitive }] }
          meaning: { en: a habit, es: un hábito, uk: "звичка", pt: "um hábito", fr: "une habitude", de: "eine Gewohnheit", it: "un'abitudine", pl: "nawyk", tr: "bir alışkanlık", id: "kebiasaan", vi: "một thói quen" }
          ex: [{ target: Suelo levantarme }, " temprano."]
          tr: { en: "I usually get up early.", uk: "Я зазвичай рано встаю.", pt: "Costumo acordar cedo.", fr: "J’ai l’habitude de me lever tôt.", de: "Normalerweise stehe ich früh auf.", it: "Di solito mi alzo presto.", pl: "Zwykle wstaję wcześnie.", tr: "Genellikle erken kalkarım.", id: "Biasanya aku bangun pagi.", vi: "Tôi thường dậy sớm." }
        - level: B1
          form: { pattern: [seguir, { slot: { en: gerund, es: gerundio, uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }
          meaning: { en: an action that goes on, es: una acción que continúa, uk: "дія, що триває", pt: "uma ação que continua", fr: "une action qui continue", de: "eine Handlung, die andauert", it: "un'azione che continua", pl: "czynność, która trwa", tr: "devam eden bir eylem", id: "tindakan yang terus berlangsung", vi: "hành động đang tiếp diễn" }
          ex: [{ target: Sigo viviendo }, " en Lima."]
          tr: { en: "I still live in Lima.", uk: "Я досі живу в Лімі.", pt: "Continuo morando em Lima.", fr: "J’habite toujours à Lima.", de: "Ich wohne immer noch in Lima.", it: "Vivo ancora a Lima.", pl: "Nadal mieszkam w Limie.", tr: "Hâlâ Lima'da yaşıyorum.", id: "Aku masih tinggal di Lima.", vi: "Tôi vẫn sống ở Lima." }
        - level: B1
          form: { pattern: [ponerse a, { slot: infinitive }] }
          meaning: { en: a sudden start, es: un comienzo repentino, uk: "раптовий початок", pt: "um início repentino", fr: "un début soudain", de: "ein plötzlicher Beginn", it: "un inizio improvviso", pl: "nagły początek", tr: "ani bir başlangıç", id: "awal yang tiba-tiba", vi: "sự bắt đầu đột ngột" }
          ex: ["El niño ", { target: se puso a llorar }, "."]
          tr: { en: "The child started crying.", uk: "Дитина розплакалася.", pt: "O menino começou a chorar.", fr: "L’enfant s’est mis à pleurer.", de: "Das Kind fing an zu weinen.", it: "Il bambino si è messo a piangere.", pl: "Dziecko zaczęło płakać.", tr: "Çocuk ağlamaya başladı.", id: "Anak itu mulai menangis.", vi: "Đứa trẻ bật khóc." }
        - level: B1
          form: { pattern: [estar a punto de, { slot: infinitive }] }
          meaning: { en: something about to happen, es: algo que va a pasar enseguida, uk: "щось, що ось-ось станеться", pt: "algo prestes a acontecer", fr: "quelque chose sur le point d’arriver", de: "etwas, das gleich geschieht", it: "qualcosa che sta per succedere", pl: "coś, co zaraz się stanie", tr: "az sonra olacak bir şey", id: "sesuatu yang akan segera terjadi", vi: "việc sắp xảy ra" }
          ex: ["El tren ", { target: está a punto de salir }, "."]
          tr: { en: "The train is about to leave.", uk: "Потяг ось-ось відправиться.", pt: "O trem está prestes a sair.", fr: "Le train est sur le point de partir.", de: "Der Zug fährt gleich ab.", it: "Il treno sta per partire.", pl: "Pociąg zaraz odjedzie.", tr: "Tren birazdan kalkacak.", id: "Kereta akan segera berangkat.", vi: "Tàu sắp chạy." }
        - level: B2
          form: { pattern: [llevar, { slot: { es: tiempo, en: "duration", uk: "тривалість", pt: "duração", fr: "durée", de: "Zeitdauer", it: "durata", pl: "okres", tr: "süre", id: "lama waktu", vi: "khoảng thời gian" } }, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }
          meaning: { es: el tiempo que dura una acción hasta ahora, en: "how long an action has lasted until now", uk: "скільки триває дія до цього часу", pt: "há quanto tempo uma ação dura até agora", fr: "depuis combien de temps une action dure jusqu’à maintenant", de: "wie lange eine Handlung bis jetzt dauert", it: "da quanto tempo un'azione dura fino a ora", pl: "jak długo czynność trwa do teraz", tr: "bir eylemin şimdiye kadar ne kadar sürdüğü", id: "berapa lama suatu tindakan berlangsung sampai sekarang", vi: "hành động đã kéo dài bao lâu cho đến nay" }
          ex: [{ target: Llevo dos años viviendo }, " en Quito."]
          tr: { en: "I've been living in Quito for two years.", uk: "Я живу в Кіто вже два роки.", pt: "Moro em Quito há dois anos.", fr: "Cela fait deux ans que j’habite à Quito.", de: "Ich wohne seit zwei Jahren in Quito.", it: "Vivo a Quito da due anni.", pl: "Mieszkam w Quito od dwóch lat.", tr: "İki yıldır Quito'da yaşıyorum.", id: "Aku sudah dua tahun tinggal di Quito.", vi: "Tôi sống ở Quito được hai năm rồi." }
        - level: C1
          form: { pattern: [acabar por, { slot: infinitive }] }
          meaning: { es: un final tras dudas o resistencia, en: "an end result after doubt or resistance", uk: "кінцевий результат після вагань або опору", pt: "um desfecho depois de dúvidas ou resistência", fr: "une issue après des doutes ou une résistance", de: "ein Ergebnis nach Zweifeln oder Widerstand", it: "un esito finale dopo dubbi o resistenze", pl: "ostateczny skutek po wahaniach lub oporze", tr: "kuşku ya da direnişten sonra varılan sonuç", id: "akhir yang terjadi setelah keraguan atau penolakan", vi: "kết cục sau những lần do dự hoặc phản đối" }
          ex: ["Después de dudar, ", { target: acabó por aceptar }, "."]
          tr: { en: "After hesitating, he ended up accepting.", uk: "Після вагань він таки погодився.", pt: "Depois de hesitar, acabou aceitando.", fr: "Après avoir hésité, il a fini par accepter.", de: "Nach langem Zögern hat er schließlich zugesagt.", it: "Dopo aver esitato, alla fine ha accettato.", pl: "Po wahaniach w końcu się zgodził.", tr: "Tereddüt ettikten sonra sonunda kabul etti.", id: "Setelah ragu, akhirnya dia menerima.", vi: "Sau khi do dự, cuối cùng anh ấy cũng đồng ý." }
        - level: C1
          form: { pattern: [ir, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }
          meaning: { es: una acción que avanza poco a poco, en: "an action that moves forward little by little", uk: "дія, що розвивається потроху", pt: "uma ação que avança aos poucos", fr: "une action qui avance peu à peu", de: "eine Handlung, die allmählich voranschreitet", it: "un'azione che avanza a poco a poco", pl: "czynność, która postępuje stopniowo", tr: "yavaş yavaş ilerleyen bir eylem", id: "tindakan yang maju sedikit demi sedikit", vi: "hành động tiến triển từng chút một" }
          ex: ["El enfermo ", { target: va mejorando }, "."]
          tr: { en: "The patient is gradually getting better.", uk: "Хворому потроху стає краще.", pt: "O doente vai melhorando.", fr: "Le malade va de mieux en mieux.", de: "Dem Kranken geht es nach und nach besser.", it: "Il malato migliora a poco a poco.", pl: "Choremu stopniowo się poprawia.", tr: "Hasta yavaş yavaş iyileşiyor.", id: "Pasien itu berangsur-angsur membaik.", vi: "Bệnh nhân đang dần khá lên." }
        - level: C1
          form: { pattern: [tener, { slot: past participle }] }
          meaning: { es: un resultado ya logrado, en: "a result already achieved", uk: "вже досягнутий результат", pt: "um resultado já alcançado", fr: "un résultat déjà obtenu", de: "ein bereits erreichtes Ergebnis", it: "un risultato già raggiunto", pl: "wynik już osiągnięty", tr: "önceden elde edilmiş bir sonuç", id: "hasil yang sudah tercapai", vi: "kết quả đã đạt được" }
          ex: [{ target: Tengo preparadas }, " las maletas."]
          tr: { en: "I have the suitcases ready.", uk: "Валізи в мене вже зібрані.", pt: "Já tenho as malas prontas.", fr: "J’ai les valises toutes prêtes.", de: "Die Koffer habe ich schon fertig gepackt.", it: "Ho le valigie già pronte.", pl: "Mam już spakowane walizki.", tr: "Bavullarım hazır.", id: "Koper-koper sudah kusiapkan.", vi: "Tôi đã chuẩn bị xong các va li." }
        - level: C2
          form: { pattern: [echar a, { slot: infinitive }] }
          meaning: { es: "perífrasis si el infinitivo cambia; locución si es fijo", en: "a verb phrase if the infinitive can change; a set phrase if it is fixed", uk: "перифраза, якщо інфінітив змінюється; сталий вираз, якщо він незмінний", pt: "perífrase se o infinitivo muda; locução se é fixo", fr: "périphrase si l’infinitif change ; locution s’il est fixe", de: "Periphrase, wenn der Infinitiv wechselt; feste Wendung, wenn er feststeht", it: "perifrasi se l'infinito cambia; locuzione se è fisso", pl: "peryfraza, gdy bezokolicznik się zmienia; utarty zwrot, gdy jest stały", tr: "mastar değişiyorsa perifraz; sabitse kalıp ifade", id: "perifrasis jika infinitifnya berganti; ungkapan tetap jika infinitifnya tetap", vi: "cụm động từ nếu động từ nguyên mẫu thay đổi; cụm cố định nếu nó cố định" }
          ex: { examples: [["El niño ", { target: echó a correr }, "."], ["La lluvia ", { target: echó a perder }, " la fiesta."]] }
          tr: { en: { examples: ["The boy broke into a run.", "The rain ruined the party."] }, uk: { examples: ["Хлопчик кинувся бігти.", "Дощ зіпсував свято."] }, pt: { examples: ["O menino saiu correndo.", "A chuva estragou a festa."] }, fr: { examples: ["L’enfant s’est mis à courir.", "La pluie a gâché la fête."] }, de: { examples: ["Der Junge rannte los.", "Der Regen hat das Fest verdorben."] }, it: { examples: ["Il bambino si è messo a correre.", "La pioggia ha rovinato la festa."] }, pl: { examples: ["Chłopiec rzucił się do biegu.", "Deszcz zepsuł przyjęcie."] }, tr: { examples: ["Çocuk koşmaya başladı.", "Yağmur partiyi mahvetti."] }, id: { examples: ["Anak itu mulai berlari.", "Hujan merusak pestanya."] }, vi: { examples: ["Cậu bé bắt đầu chạy.", "Cơn mưa làm hỏng bữa tiệc."] } }
        - level: A2
          form: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          meaning: { en: "the preposition stays: de, a", es: "la preposición se mantiene: de, a", uk: "прийменник зберігається: de, a", pt: "a preposição se mantém: de, a", fr: "la préposition reste : de, a", de: "die Präposition bleibt: de, a", it: "la preposizione resta: de, a", pl: "przyimek zostaje: de, a", tr: "edat kalır: de, a", id: "kata depan tetap ada: de, a", vi: "giới từ được giữ lại: de, a" }
          ex: [{ target: Empiezo a entender }, "."]
          tr: { en: "I'm beginning to understand.", uk: "Я починаю розуміти.", pt: "Estou começando a entender.", fr: "Je commence à comprendre.", de: "Ich fange an zu verstehen.", it: "Comincio a capire.", pl: "Zaczynam rozumieć.", tr: "Anlamaya başlıyorum.", id: "Aku mulai mengerti.", vi: "Tôi bắt đầu hiểu." }
        - level: B1
          form: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          meaning: { en: "seguir takes the gerund", es: "seguir lleva gerundio", uk: "seguir вимагає герундія", pt: "seguir leva gerúndio", fr: "seguir se construit avec le gérondif", de: "seguir steht mit dem Gerundium", it: "seguir vuole il gerundio", pl: "seguir łączy się z gerundium", tr: "seguir ulaçla kullanılır", id: "seguir memakai gerundio", vi: "seguir đi với gerundio" }
          ex: [{ target: Sigo estudiando }, "."]
          tr: { en: "I'm still studying.", uk: "Я досі вчуся.", pt: "Continuo estudando.", fr: "Je continue d’étudier.", de: "Ich lerne immer noch.", it: "Sto ancora studiando.", pl: "Nadal się uczę.", tr: "Hâlâ çalışıyorum.", id: "Aku masih belajar.", vi: "Tôi vẫn đang học." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A verb phrase is a conjugated verb, often a preposition, and an infinitive or a gerund."
              es: "Una perífrasis es un verbo conjugado, a menudo una preposición, y un infinitivo o un gerundio."
              uk: "Перифраза — це відмінюване дієслово, часто прийменник, та інфінітив або герундій."
              pt: "Uma perífrase verbal é um verbo conjugado, muitas vezes uma preposição, e um infinitivo ou um gerúndio."
              fr: "Une périphrase verbale est un verbe conjugué, souvent une préposition, et un infinitif ou un gérondif."
              de: "Eine Verbalperiphrase besteht aus einem konjugierten Verb, oft einer Präposition und einem Infinitiv oder Gerundium."
              it: "Una perifrasi verbale è un verbo coniugato, spesso una preposizione, e un infinito o un gerundio."
              pl: "Peryfraza czasownikowa to czasownik w formie osobowej, często przyimek oraz bezokolicznik lub gerundium."
              tr: "Fiil perifrazı, çekimli bir fiilden, çoğu zaman bir edattan ve bir mastardan ya da ulaçtan oluşur."
              id: "Perifrasis verbal terdiri atas kata kerja terkonjugasi, sering kata depan, dan infinitif atau gerundio."
              vi: "Cụm động từ gồm một động từ đã chia, thường có giới từ, và một động từ nguyên mẫu hoặc gerundio."
          - type: rule
            level: A2
            text:
              en: "The first verb carries the person and the tense; the infinitive never changes:"
              es: "El primer verbo lleva la persona y el tiempo; el infinitivo no cambia nunca:"
              uk: "Перше дієслово передає особу й час; інфінітив не змінюється ніколи:"
              pt: "O primeiro verbo traz a pessoa e o tempo; o infinitivo nunca muda:"
              fr: "Le premier verbe porte la personne et le temps ; l’infinitif ne change jamais :"
              de: "Das erste Verb trägt Person und Zeit; der Infinitiv ändert sich nie:"
              it: "Il primo verbo porta la persona e il tempo; l'infinito non cambia mai:"
              pl: "Pierwszy czasownik niesie osobę i czas; bezokolicznik nigdy się nie zmienia:"
              tr: "Kişiyi ve zamanı ilk fiil taşır; mastar hiçbir zaman değişmez:"
              id: "Kata kerja pertama menunjukkan orang dan tense; infinitif tidak pernah berubah:"
              vi: "Động từ đầu tiên mang ngôi và thì; động từ nguyên mẫu không bao giờ đổi:"
            ex: { examples: [[{ target: Acabo de comer }, "."], [{ target: Acabamos de comer }, "."]] }
            tr: { en: { examples: ["I've just eaten.", "We've just eaten."] }, uk: { examples: ["Я щойно поїв.", "Ми щойно поїли."] }, pt: { examples: ["Acabei de comer.", "Acabamos de comer."] }, fr: { examples: ["Je viens de manger.", "Nous venons de manger."] }, de: { examples: ["Ich habe gerade gegessen.", "Wir haben gerade gegessen."] }, it: { examples: ["Ho appena mangiato.", "Abbiamo appena mangiato."] }, pl: { examples: ["Właśnie zjadłem.", "Właśnie zjedliśmy."] }, tr: { examples: ["Yeni yemek yedim.", "Yeni yemek yedik."] }, id: { examples: ["Aku baru saja makan.", "Kami baru saja makan."] }, vi: { examples: ["Tôi vừa mới ăn xong.", "Chúng tôi vừa mới ăn xong."] } }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українська часто передає це прислівниками: ", { l1: "щойно прийшов" }, " — ", { term: "acabo de llegar" }, ", ", { l1: "знову пішов дощ" }, " — ", { term: "volvió a llover" }, "."]
          - type: rule
            level: A2
            text:
              en: "Pronouns go before the first verb or join the end of the infinitive:"
              es: "Los pronombres van delante del primer verbo o se unen al final del infinitivo:"
              uk: "Займенники стоять перед першим дієсловом або приєднуються до кінця інфінітива:"
              pt: "Os pronomes vão antes do primeiro verbo ou se unem ao final do infinitivo:"
              fr: "Les pronoms se placent devant le premier verbe ou se joignent à la fin de l’infinitif :"
              de: "Die Pronomen stehen vor dem ersten Verb oder hängen am Ende des Infinitivs:"
              it: "I pronomi stanno davanti al primo verbo o si uniscono alla fine dell'infinito:"
              pl: "Zaimki stoją przed pierwszym czasownikiem albo łączą się z końcem bezokolicznika:"
              tr: "Zamirler ilk fiilin önüne gelir ya da mastarın sonuna eklenir:"
              id: "Kata ganti berada sebelum kata kerja pertama atau menempel di akhir infinitif:"
              vi: "Đại từ đứng trước động từ thứ nhất hoặc gắn vào cuối động từ nguyên mẫu:"
            ex: { examples: [[{ target: La acabo de ver }, "."], [{ target: Acabo de verla }, "."]] }
            tr: { en: { examples: ["I've just seen her.", "I've just seen her."] }, uk: { examples: ["Я щойно її бачив.", "Я щойно її бачив."] }, pt: { examples: ["Acabei de vê-la.", "Acabei de vê-la."] }, fr: { examples: ["Je viens de la voir.", "Je viens de la voir."] }, de: { examples: ["Ich habe sie gerade gesehen.", "Ich habe sie gerade gesehen."] }, it: { examples: ["L'ho appena vista.", "L'ho appena vista."] }, pl: { examples: ["Właśnie ją widziałem.", "Właśnie ją widziałem."] }, tr: { examples: ["Onu az önce gördüm.", "Onu az önce gördüm."] }, id: { examples: ["Aku baru saja melihatnya.", "Aku baru saja melihatnya."] }, vi: { examples: ["Tôi vừa mới nhìn thấy cô ấy.", "Tôi vừa mới nhìn thấy cô ấy."] } }
          - type: note
            level: A2
            text:
              en: ["Verbs for ability and obligation: ", { link: "Can, Must, Should: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              es: ["Verbos de capacidad y obligación: ", { link: "Poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              uk: ["Дієслова можливості й обов’язку: ", { link: "Модальні дієслова: poder, saber, deber, tener que, hay que", to: "es.imperativo-perifrasis.poder-deber-tener-que" }, "."]
              pt: ["Verbos de capacidade e obrigação: ", { link: "Verbos modais: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              fr: ["Verbes de capacité et d’obligation : ", { link: "Verbes modaux : poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              de: ["Verben für Fähigkeit und Verpflichtung: ", { link: "Modalverben: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              it: ["Verbi di capacità e obbligo: ", { link: "Verbi modali: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              pl: ["Czasowniki zdolności i obowiązku: ", { link: "Czasowniki modalne: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              tr: ["Yeterlilik ve zorunluluk fiilleri: ", { link: "Modal fiiller: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              id: ["Kata kerja untuk kemampuan dan kewajiban: ", { link: "Kata kerja modal: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]
              vi: ["Động từ chỉ khả năng và nghĩa vụ: ", { link: "Động từ khuyết thiếu: poder, saber, deber, tener que, hay que", to: es.imperativo-perifrasis.poder-deber-tener-que }, "."]

  - title: { en: "Use: beginning and end", es: "Uso: comienzo y final", uk: "Вживання: початок і кінець", pt: "Uso: início e fim", fr: "Emploi : début et fin", de: "Gebrauch: Beginn und Ende", it: "Uso: inizio e fine", pl: "Użycie: początek i koniec", tr: "Kullanım: başlangıç ve bitiş", id: "Penggunaan: awal dan akhir", vi: "Cách dùng: bắt đầu và kết thúc" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: "Форма", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Ý nghĩa" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, form: { pattern: [empezar a, { slot: infinitive }] }, meaning: { en: the start of an action, es: el comienzo de una acción, uk: "початок дії", pt: "o início de uma ação", fr: "le début d’une action", de: "der Beginn einer Handlung", it: "l'inizio di un'azione", pl: "początek czynności", tr: "bir eylemin başlangıcı", id: "awal suatu tindakan", vi: "sự bắt đầu của một hành động" }, ex: ["Mañana ", { target: empiezo a estudiar }, " inglés."], tr: { en: "Tomorrow I start studying English.", uk: "Завтра я починаю вивчати англійську.", pt: "Amanhã começo a estudar inglês.", fr: "Demain, je commence à étudier l’anglais.", de: "Morgen fange ich an, Englisch zu lernen.", it: "Domani comincio a studiare inglese.", pl: "Jutro zaczynam uczyć się angielskiego.", tr: "Yarın İngilizce öğrenmeye başlıyorum.", id: "Besok aku mulai belajar bahasa Inggris.", vi: "Ngày mai tôi bắt đầu học tiếng Anh." } }
          - { level: B1, form: { pattern: [ponerse a, { slot: infinitive }] }, meaning: { en: a sudden start, es: un comienzo repentino, uk: "раптовий початок", pt: "um início repentino", fr: "un début soudain", de: "ein plötzlicher Beginn", it: "un inizio improvviso", pl: "nagły początek", tr: "ani bir başlangıç", id: "awal yang tiba-tiba", vi: "sự bắt đầu đột ngột" }, ex: ["De repente ", { target: se puso a llover }, "."], tr: { en: "Suddenly it started to rain.", uk: "Раптом пішов дощ.", pt: "De repente começou a chover.", fr: "Soudain, il s’est mis à pleuvoir.", de: "Plötzlich fing es an zu regnen.", it: "All'improvviso si è messo a piovere.", pl: "Nagle zaczęło padać.", tr: "Birden yağmur yağmaya başladı.", id: "Tiba-tiba hujan mulai turun.", vi: "Bỗng nhiên trời đổ mưa." } }
          - { level: B1, form: { pattern: [estar a punto de, { slot: infinitive }] }, meaning: { en: something about to happen, es: algo que va a pasar enseguida, uk: "щось, що ось-ось станеться", pt: "algo prestes a acontecer", fr: "quelque chose sur le point d’arriver", de: "etwas, das gleich geschieht", it: "qualcosa che sta per succedere", pl: "coś, co zaraz się stanie", tr: "az sonra olacak bir şey", id: "sesuatu yang akan segera terjadi", vi: "việc sắp xảy ra" }, ex: [{ target: Estoy a punto de salir }, ": te llamo luego."], tr: { en: "I'm about to go out: I'll call you later.", uk: "Я вже виходжу: передзвоню пізніше.", pt: "Estou prestes a sair: ligo para você depois.", fr: "Je suis sur le point de sortir : je t’appelle plus tard.", de: "Ich will gerade losgehen: Ich rufe dich später an.", it: "Sto per uscire: ti chiamo dopo.", pl: "Zaraz wychodzę: zadzwonię do ciebie później.", tr: "Tam çıkmak üzereyim: seni sonra ararım.", id: "Aku hampir keluar: nanti kutelepon.", vi: "Tôi sắp ra ngoài: lát nữa tôi gọi cho bạn." } }
          - level: A2
            form: { pattern: [acabar de, { slot: infinitive }] }
            meaning: { en: something that has just happened, es: algo que acaba de pasar, uk: "щось, що щойно сталося", pt: "algo que acabou de acontecer", fr: "quelque chose qui vient d’arriver", de: "etwas, das gerade geschehen ist", it: "qualcosa che è appena successo", pl: "coś, co dopiero się stało", tr: "az önce olmuş bir şey", id: "sesuatu yang baru saja terjadi", vi: "việc vừa mới xảy ra" }
            ex: { examples: [[{ target: Acabo de llegar }, "."], ["Ana ", { target: acaba de salir }, "."]] }
            tr: { en: { examples: ["I've just arrived.", "Ana has just gone out."] }, uk: { examples: ["Я щойно прийшов.", "Ана щойно вийшла."] }, pt: { examples: ["Acabei de chegar.", "Ana acabou de sair."] }, fr: { examples: ["Je viens d’arriver.", "Ana vient de sortir."] }, de: { examples: ["Ich bin gerade angekommen.", "Ana ist gerade hinausgegangen."] }, it: { examples: ["Sono appena arrivato.", "Ana è appena uscita."] }, pl: { examples: ["Właśnie przyjechałem.", "Ana właśnie wyszła."] }, tr: { examples: ["Yeni geldim.", "Ana az önce çıktı."] }, id: { examples: ["Aku baru saja tiba.", "Ana baru saja keluar."] }, vi: { examples: ["Tôi vừa mới đến.", "Ana vừa mới ra ngoài."] } }
          - { level: B1, form: { pattern: [dejar de, { slot: infinitive }] }, meaning: { en: the end of a habit or an action, es: el final de un hábito o de una acción, uk: "кінець звички або дії", pt: "o fim de um hábito ou de uma ação", fr: "la fin d’une habitude ou d’une action", de: "das Ende einer Gewohnheit oder Handlung", it: "la fine di un'abitudine o di un'azione", pl: "koniec nawyku lub czynności", tr: "bir alışkanlığın ya da eylemin sonu", id: "berakhirnya kebiasaan atau tindakan", vi: "sự kết thúc của một thói quen hoặc hành động" }, ex: [{ target: Dejé de fumar }, " el año pasado."], tr: { en: "I stopped smoking last year.", uk: "Торік я кинув курити.", pt: "Parei de fumar no ano passado.", fr: "J’ai arrêté de fumer l’année dernière.", de: "Ich habe letztes Jahr aufgehört zu rauchen.", it: "Ho smesso di fumare l'anno scorso.", pl: "Rzuciłem palenie w zeszłym roku.", tr: "Geçen yıl sigarayı bıraktım.", id: "Aku berhenti merokok tahun lalu.", vi: "Năm ngoái tôi đã bỏ hút thuốc." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: acabar de }, " in the present says something has just happened:"]
              es: [{ term: acabar de }, " en presente dice que algo acaba de pasar:"]
              uk: [{ term: "acabar de" }, " у теперішньому часі означає, що щось щойно сталося:"]
              pt: [{ term: acabar de }, " no presente diz que algo acabou de acontecer:"]
              fr: [{ term: acabar de }, " au présent dit que quelque chose vient d’arriver :"]
              de: [{ term: acabar de }, " im Präsens sagt, dass etwas gerade geschehen ist:"]
              it: [{ term: acabar de }, " al presente dice che qualcosa è appena successo:"]
              pl: [{ term: acabar de }, " w czasie teraźniejszym mówi, że coś dopiero się stało:"]
              tr: [{ term: acabar de }, " şimdiki zamanda, bir şeyin az önce olduğunu söyler:"]
              id: [{ term: acabar de }, " di tense presente menyatakan sesuatu baru saja terjadi:"]
              vi: [{ term: acabar de }, " ở thì hiện tại nói rằng việc gì đó vừa mới xảy ra:"]
            ex: ["La película ", { target: acaba de empezar }, "."]
            tr: { en: "The film has just started.", uk: "Фільм щойно почався.", pt: "O filme acabou de começar.", fr: "Le film vient de commencer.", de: "Der Film hat gerade angefangen.", it: "Il film è appena iniziato.", pl: "Film właśnie się zaczął.", tr: "Film az önce başladı.", id: "Filmnya baru saja mulai.", vi: "Bộ phim vừa mới bắt đầu." }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українське ", { l1: "починаю працювати" }, " не має прийменника, а іспанське має: ", { term: "empiezo a trabajar" }, "; так само ", { term: "acabo de" }, " і ", { term: "dejo de" }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In much of Latin America, ", { term: recién }, " with the preterite says the same:"]
              es: ["En gran parte de Latinoamérica, ", { term: recién }, " con el pretérito indefinido dice lo mismo:"]
              uk: ["У більшій частині Латинської Америки те саме передає ", { term: "recién" }, " з претеритом:"]
              pt: ["Em boa parte da América Latina, ", { term: recién }, " com o pretérito perfeito simples diz o mesmo:"]
              fr: ["Dans une grande partie de l’Amérique latine, ", { term: recién }, " avec le prétérit dit la même chose :"]
              de: ["In weiten Teilen Lateinamerikas sagt ", { term: recién }, " mit dem Pretérito indefinido dasselbe:"]
              it: ["In gran parte dell'America Latina, ", { term: recién }, " con il pretérito indefinido dice la stessa cosa:"]
