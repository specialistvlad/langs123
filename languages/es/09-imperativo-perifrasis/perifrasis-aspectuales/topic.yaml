          - { level: B2, form: { alternatives: [{ pattern: [no dejar de, { slot: infinitive }] }, { pattern: [no parar de, { slot: infinitive }] }] }, meaning: { es: una acción que continúa sin pausa, en: "an action that goes on without a break", uk: "дія, що триває без перерви", pt: "uma ação que continua sem pausa", fr: "une action qui continue sans pause", de: "eine Handlung, die ohne Pause weitergeht", it: "un'azione che continua senza pause", pl: "czynność, która trwa bez przerwy", tr: "ara vermeden süren bir eylem", id: "tindakan yang terus berlangsung tanpa jeda", vi: "hành động tiếp diễn không ngừng" }, ex: { examples: [["El bebé ", { target: no deja de llorar }, "."], ["El teléfono ", { target: no ha parado de sonar }, " esta mañana."]] }, tr: { en: { examples: ["The baby won't stop crying.", "The phone hasn't stopped ringing this morning."] }, uk: { examples: ["Дитина не перестає плакати.", "Телефон дзвонить без упину цілий ранок."] }, pt: { examples: ["O bebê não para de chorar.", "O telefone não parou de tocar esta manhã."] }, fr: { examples: ["Le bébé n’arrête pas de pleurer.", "Le téléphone n’a pas arrêté de sonner ce matin."] }, de: { examples: ["Das Baby hört nicht auf zu weinen.", "Das Telefon hat heute Morgen ununterbrochen geklingelt."] }, it: { examples: ["Il bambino non smette di piangere.", "Il telefono non ha smesso di suonare questa mattina."] }, pl: { examples: ["Niemowlę nie przestaje płakać.", "Telefon nie przestaje dzwonić od rana."] }, tr: { examples: ["Bebek ağlamayı bırakmıyor.", "Telefon bu sabah boyunca susmadı."] }, id: { examples: ["Bayi itu tidak berhenti menangis.", "Telepon tidak berhenti berdering pagi ini."] }, vi: { examples: ["Em bé khóc mãi không thôi.", "Sáng nay điện thoại reo không ngớt."] } } }

