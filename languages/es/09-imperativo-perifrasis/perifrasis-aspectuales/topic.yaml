          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: C1, form: { pattern: [ir, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }, meaning: { es: una acción que avanza poco a poco, en: "an action that moves forward little by little", uk: "дія, що розвивається потроху", pt: "uma ação que avança aos poucos", fr: "une action qui avance peu à peu", de: "eine Handlung, die allmählich voranschreitet", it: "un'azione che avanza a poco a poco", pl: "czynność, która postępuje stopniowo", tr: "yavaş yavaş ilerleyen bir eylem", id: "tindakan yang maju sedikit demi sedikit", vi: "hành động tiến triển từng chút một" }, ex: ["El enfermo ", { target: va mejorando }, " día a día."], tr: { en: "The patient is getting better day by day.", uk: "Хворому з кожним днем стає краще.", pt: "O doente vai melhorando dia a dia.", fr: "Le malade va mieux de jour en jour.", de: "Dem Kranken geht es von Tag zu Tag besser.", it: "Il malato migliora giorno dopo giorno.", pl: "Choremu z dnia na dzień jest lepiej.", tr: "Hasta gün geçtikçe iyileşiyor.", id: "Pasien itu membaik hari demi hari.", vi: "Bệnh nhân khá lên từng ngày." } }
          - { level: C1, form: { pattern: [venir, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }, meaning: { es: una acción que empezó antes y llega hasta ahora, en: "an action that began earlier and reaches now", uk: "дія, що почалася раніше й триває до цього часу", pt: "uma ação que começou antes e chega até agora", fr: "une action commencée plus tôt qui dure jusqu’à maintenant", de: "eine Handlung, die früher begann und bis jetzt reicht", it: "un'azione iniziata prima che arriva fino a ora", pl: "czynność, która zaczęła się wcześniej i trwa do teraz", tr: "daha önce başlayıp şimdiye kadar süren bir eylem", id: "tindakan yang dimulai lebih awal dan berlanjut sampai sekarang", vi: "hành động bắt đầu từ trước và kéo dài đến bây giờ" }, ex: [{ target: Viene repitiendo }, " lo mismo desde enero."], tr: { en: "He has been repeating the same thing since January.", uk: "Він повторює те саме від січня.", pt: "Ele vem repetindo a mesma coisa desde janeiro.", fr: "Il répète la même chose depuis janvier.", de: "Er wiederholt seit Januar immer dasselbe.", it: "Ripete la stessa cosa da gennaio.", pl: "Powtarza to samo od stycznia.", tr: "Ocak ayından beri aynı şeyi tekrarlıyor.", id: "Dia terus mengulang hal yang sama sejak Januari.", vi: "Từ tháng Một đến giờ anh ấy cứ lặp lại điều đó." } }
          - { level: C1, form: { pattern: [andar, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }, meaning: { es: una acción repetida o sin rumbo fijo, en: "a repeated action, or one with no fixed direction", uk: "дія, що повторюється або не має чіткої мети", pt: "uma ação repetida ou sem rumo fixo", fr: "une action répétée ou sans but précis", de: "eine wiederholte oder ziellose Handlung", it: "un'azione ripetuta o senza meta precisa", pl: "czynność powtarzana lub bez wyraźnego celu", tr: "tekrarlanan ya da belli bir yönü olmayan bir eylem", id: "tindakan yang berulang atau tanpa arah tetap", vi: "hành động lặp đi lặp lại hoặc không có hướng rõ ràng" }, ex: [{ target: Anda buscando }, " trabajo desde hace semanas."], tr: { en: "He has been looking for work for weeks.", uk: "Він уже кілька тижнів шукає роботу.", pt: "Anda procurando emprego há semanas.", fr: "Il cherche du travail depuis des semaines.", de: "Er sucht seit Wochen Arbeit.", it: "Cerca lavoro da settimane.", pl: "Szuka pracy od kilku tygodni.", tr: "Haftalardır iş arıyor.", id: "Dia sudah berminggu-minggu mencari pekerjaan.", vi: "Anh ấy đã tìm việc mấy tuần nay." } }
          - { level: C1, form: { pattern: [terminar, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundium", tr: "ulaç (gerundio)", id: "gerundio", vi: "gerundio" } }] }, meaning: { es: el final de un proceso, en: "the end of a process", uk: "кінець процесу", pt: "o fim de um processo", fr: "la fin d’un processus", de: "das Ende eines Prozesses", it: "la fine di un processo", pl: "koniec procesu", tr: "bir sürecin sonu", id: "akhir suatu proses", vi: "kết thúc của một quá trình" }, ex: ["Tras mucha presión, ", { target: terminó cediendo }, "."], tr: { en: "After a lot of pressure, he finally gave in.", uk: "Після сильного тиску він урешті поступився.", pt: "Depois de muita pressão, acabou cedendo.", fr: "Après beaucoup de pression, il a fini par céder.", de: "Nach viel Druck gab er schließlich nach.", it: "Dopo molte pressioni, alla fine ha ceduto.", pl: "Po silnym nacisku w końcu ustąpił.", tr: "Çok baskı gördükten sonra sonunda pes etti.", id: "Setelah banyak ditekan, akhirnya dia mengalah.", vi: "Sau nhiều áp lực, cuối cùng anh ấy cũng nhượng bộ." } }
          - { level: C1, form: { pattern: [tener, { slot: past participle }] }, meaning: { es: un resultado ya logrado, en: "a result already achieved", uk: "вже досягнутий результат", pt: "um resultado já alcançado", fr: "un résultat déjà obtenu", de: "ein bereits erreichtes Ergebnis", it: "un risultato già raggiunto", pl: "wynik już osiągnięty", tr: "önceden elde edilmiş bir sonuç", id: "hasil yang sudah tercapai", vi: "kết quả đã đạt được" }, ex: [{ target: Tengo preparadas }, " las maletas."], tr: { en: "I have the suitcases ready.", uk: "Валізи в мене вже зібрані.", pt: "Já tenho as malas prontas.", fr: "J’ai les valises toutes prêtes.", de: "Die Koffer habe ich schon fertig gepackt.", it: "Ho le valigie già pronte.", pl: "Mam już spakowane walizki.", tr: "Bavullarım hazır.", id: "Koper-koper sudah kusiapkan.", vi: "Tôi đã chuẩn bị xong các va li." } }
          - { level: C1, form: { pattern: [llevar, { slot: past participle }] }, meaning: { es: una cantidad acumulada, en: "an amount built up so far", uk: "накопичена кількість", pt: "uma quantidade acumulada", fr: "une quantité accumulée", de: "eine angesammelte Menge", it: "una quantità accumulata", pl: "nagromadzona ilość", tr: "birikmiş bir miktar", id: "jumlah yang sudah terkumpul", vi: "số lượng đã tích lũy" }, ex: [{ target: Llevo leídas }, " treinta páginas."], tr: { en: "I've read thirty pages so far.", uk: "Я вже прочитав тридцять сторінок.", pt: "Já li trinta páginas.", fr: "J’ai déjà lu trente pages.", de: "Ich habe schon dreißig Seiten gelesen.", it: "Ho già letto trenta pagine.", pl: "Przeczytałem już trzydzieści stron.", tr: "Şimdiye kadar otuz sayfa okudum.", id: "Aku sudah membaca tiga puluh halaman.", vi: "Tôi đã đọc được ba mươi trang." } }
          - { level: C1, form: { pattern: [dejar, { slot: past participle }] }, meaning: { es: un resultado que se deja hecho, en: "a result left done", uk: "результат, який залишають готовим", pt: "um resultado que se deixa pronto", fr: "un résultat qu’on laisse accompli", de: "ein Ergebnis, das man fertig hinterlässt", it: "un risultato che si lascia compiuto", pl: "wynik, który się zostawia gotowy", tr: "hazır bırakılan bir sonuç", id: "hasil yang ditinggalkan dalam keadaan selesai", vi: "kết quả được để lại trong tình trạng đã xong" }, ex: ["Mi madre ", { target: dejó preparada }, " la cena."], tr: { en: "My mother left dinner ready.", uk: "Мама залишила вечерю готовою.", pt: "Minha mãe deixou o jantar pronto.", fr: "Ma mère a laissé le dîner préparé.", de: "Meine Mutter hat das Abendessen fertig vorbereitet.", it: "Mia madre ha lasciato la cena pronta.", pl: "Mama zostawiła przygotowaną kolację.", tr: "Annem akşam yemeğini hazırlayıp bıraktı.", id: "Ibuku meninggalkan makan malam yang sudah siap.", vi: "Mẹ tôi đã để sẵn bữa tối." } }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: "El participio concuerda en género y número con el complemento directo:"
              en: "The participle agrees in gender and number with the direct object:"
              uk: "Дієприкметник узгоджується в роді й числі з прямим додатком:"
              pt: "O particípio concorda em gênero e número com o objeto direto:"
              fr: "Le participe s’accorde en genre et en nombre avec le complément d’objet direct :"
              de: "Das Partizip stimmt in Genus und Numerus mit dem direkten Objekt überein:"
              it: "Il participio concorda in genere e numero con il complemento diretto:"
              pl: "Imiesłów zgadza się w rodzaju i liczbie z dopełnieniem bliższym:"
              tr: "Participio, cinsiyet ve sayı bakımından doğrudan nesneyle uyum sağlar:"
              id: "Partisip sesuai dalam gender dan jumlah dengan objek langsung:"
              vi: "Quá khứ phân từ hòa hợp về giống và số với tân ngữ trực tiếp:"
            ex: { examples: [[{ target: Tengo escritas }, " tres cartas."], [{ target: Dejó anotado }, " el número."]] }
            tr: { en: { examples: ["I have three letters written.", "He left the number noted down."] }, uk: { examples: ["У мене написано три листи.", "Він записав номер."] }, pt: { examples: ["Tenho três cartas escritas.", "Deixou o número anotado."] }, fr: { examples: ["J’ai trois lettres écrites.", "Il a laissé le numéro noté."] }, de: { examples: ["Drei Briefe habe ich schon geschrieben.", "Er hat die Nummer aufgeschrieben."] }, it: { examples: ["Ho tre lettere già scritte.", "Ha lasciato il numero annotato."] }, pl: { examples: ["Mam napisane trzy listy.", "Zostawił zapisany numer."] }, tr: { examples: ["Üç mektup yazılmış durumda.", "Numarayı not alıp bıraktı."] }, id: { examples: ["Aku sudah menulis tiga surat.", "Dia meninggalkan nomor yang sudah dicatat."] }, vi: { examples: ["Tôi đã viết xong ba bức thư.", "Anh ấy đã ghi lại con số."] } }

