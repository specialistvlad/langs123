  - title: { es: Perífrasis y locuciones, en: "Verb phrases and set phrases", uk: "Перифрази й сталі вирази", pt: "Perífrases e locuções", fr: "Périphrases et locutions", de: "Periphrasen und feste Wendungen", it: "Perifrasi e locuzioni", pl: "Peryfrazy i utarte zwroty", tr: "Perifrazlar ve kalıp ifadeler", id: "Perifrasis dan ungkapan tetap", vi: "Cụm động từ và cụm cố định" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: periphrasis, label: { es: Perífrasis, en: "Verb phrase", uk: "Перифраза", pt: "Perífrase", fr: "Périphrase", de: "Periphrase", it: "Perifrasi", pl: "Peryfraza", tr: "Perifraz", id: "Perifrasis", vi: "Cụm động từ" } }
          - { key: idiom, label: { es: Locución o dos verbos, en: "Set phrase or two verbs", uk: "Сталий вираз або два дієслова", pt: "Locução ou dois verbos", fr: "Locution ou deux verbes", de: "Feste Wendung oder zwei Verben", it: "Locuzione o due verbi", pl: "Utarty zwrot lub dwa czasowniki", tr: "Kalıp ifade ya da iki fiil", id: "Ungkapan tetap atau dua kata kerja", vi: "Cụm cố định hoặc hai động từ" } }
          - { key: difference, label: { es: Diferencia, en: "Difference", uk: "Різниця", pt: "Diferença", fr: "Différence", de: "Unterschied", it: "Differenza", pl: "Różnica", tr: "Fark", id: "Perbedaan", vi: "Khác biệt" } }
        rows:
          - level: C2
            periphrasis: { ex: { examples: [["El niño ", { target: echó a correr }, "."], ["El niño ", { target: echó a andar }, "."]] }, tr: { en: { examples: ["The boy broke into a run.", "The boy set off walking."] }, uk: { examples: ["Хлопчик кинувся бігти.", "Хлопчик рушив уперед."] }, pt: { examples: ["O menino saiu correndo.", "O menino saiu andando."] }, fr: { examples: ["L’enfant s’est mis à courir.", "L’enfant s’est mis à marcher."] }, de: { examples: ["Der Junge rannte los.", "Der Junge ging los."] }, it: { examples: ["Il bambino si è messo a correre.", "Il bambino si è messo a camminare."] }, pl: { examples: ["Chłopiec rzucił się do biegu.", "Chłopiec ruszył przed siebie."] }, tr: { examples: ["Çocuk koşmaya başladı.", "Çocuk yürümeye başladı."] }, id: { examples: ["Anak itu mulai berlari.", "Anak itu mulai berjalan."] }, vi: { examples: ["Cậu bé bắt đầu chạy.", "Cậu bé bắt đầu đi."] } } }
            idiom: { ex: ["La lluvia ", { target: echó a perder }, " la fiesta."], tr: { en: "The rain ruined the party.", uk: "Дощ зіпсував свято.", pt: "A chuva estragou a festa.", fr: "La pluie a gâché la fête.", de: "Der Regen hat das Fest verdorben.", it: "La pioggia ha rovinato la festa.", pl: "Deszcz zepsuł przyjęcie.", tr: "Yağmur partiyi mahvetti.", id: "Hujan merusak pestanya.", vi: "Cơn mưa làm hỏng bữa tiệc." } }
            difference: { es: "El infinitivo de la perífrasis cambia por otros verbos de movimiento; los elementos de la locución son fijos.", en: "The verb phrase lets the infinitive change to other verbs of movement; the parts of the set phrase are fixed.", uk: "У перифразі інфінітив можна замінити іншим дієсловом руху; частини сталого виразу незмінні.", pt: "Na perífrase, o infinitivo muda por outros verbos de movimento; os elementos da locução são fixos.", fr: "Dans la périphrase, l’infinitif peut être remplacé par d’autres verbes de mouvement ; les éléments de la locution sont figés.", de: "In der Periphrase kann der Infinitiv durch andere Bewegungsverben ersetzt werden; die Teile der festen Wendung stehen fest.", it: "Nella perifrasi l'infinito può cambiare con altri verbi di movimento; gli elementi della locuzione sono fissi.", pl: "W peryfrazie bezokolicznik może zmienić się na inne czasowniki ruchu; człony utartego zwrotu są stałe.", tr: "Perifrazda mastar başka hareket fiilleriyle değişebilir; kalıp ifadenin öğeleri sabittir.", id: "Pada perifrasis, infinitifnya bisa diganti kata kerja gerak lain; unsur ungkapan tetap tidak berubah.", vi: "Ở cụm động từ, động từ nguyên mẫu có thể đổi sang các động từ chỉ chuyển động khác; các thành phần của cụm cố định thì cố định." }
          - level: C2
            periphrasis: { ex: ["¿Quién ", { target: echó a correr }, "? El niño."], tr: { en: "Who broke into a run? The boy.", uk: "Хто кинувся бігти? Хлопчик.", pt: "Quem saiu correndo? O menino.", fr: "Qui s’est mis à courir ? L’enfant.", de: "Wer rannte los? Der Junge.", it: "Chi si è messo a correre? Il bambino.", pl: "Kto rzucił się do biegu? Chłopiec.", tr: "Kim koşmaya başladı? Çocuk.", id: "Siapa yang mulai berlari? Anak itu.", vi: "Ai bắt đầu chạy? Cậu bé." } }
            idiom: { ex: ["¿Qué ", { target: echó a perder }, "? La fiesta: ", { target: la echó a perder }, "."], tr: { en: "What did he ruin? The party: he ruined it.", uk: "Що він зіпсував? Свято: він його зіпсував.", pt: "O que ele estragou? A festa: ele a estragou.", fr: "Qu’a-t-il gâché ? La fête : il l’a gâchée.", de: "Was hat er verdorben? Das Fest: Er hat es verdorben.", it: "Che cosa ha rovinato? La festa: l'ha rovinata.", pl: "Co zepsuł? Przyjęcie: zepsuł je.", tr: "Neyi mahvetti? Partiyi: onu mahvetti.", id: "Apa yang dia rusak? Pestanya: dia merusaknya.", vi: "Anh ấy làm hỏng cái gì? Bữa tiệc: anh ấy đã làm hỏng nó." } }
            difference: { es: ["La locución tiene complemento directo, que se pregunta con ", { term: qué }, " y se sustituye por ", { term: la }, "; la perífrasis se pregunta con ", { term: quién }, "."], en: ["The set phrase has a direct object: ask for it with ", { term: "qué" }, " and replace it with ", { term: "la" }, ". The verb phrase asks ", { term: "quién" }, "."], uk: ["Сталий вираз має прямий додаток: про нього питають ", { term: "qué" }, ", а замінює його ", { term: "la" }, ". Перифраза відповідає на питання ", { term: "quién" }, "."], pt: ["A locução tem objeto direto: pergunta-se por ele com ", { term: "qué" }, " e ele é substituído por ", { term: "la" }, "; a perífrase se pergunta com ", { term: "quién" }, "."], fr: ["La locution a un complément d’objet direct : on l’interroge avec ", { term: "qué" }, " et on le remplace par ", { term: "la" }, " ; la périphrase s’interroge avec ", { term: "quién" }, "."], de: ["Die feste Wendung hat ein direktes Objekt: Man fragt danach mit ", { term: "qué" }, " und ersetzt es durch ", { term: "la" }, "; bei der Periphrase fragt man mit ", { term: "quién" }, "."], it: ["La locuzione ha un complemento diretto: si chiede con ", { term: "qué" }, " e si sostituisce con ", { term: "la" }, "; la perifrasi si chiede con ", { term: "quién" }, "."], pl: ["Utarty zwrot ma dopełnienie bliższe: pytamy o nie ", { term: "qué" }, " i zastępujemy je zaimkiem ", { term: "la" }, "; o peryfrazę pytamy ", { term: "quién" }, "."], tr: ["Kalıp ifadenin doğrudan nesnesi vardır: ona ", { term: "qué" }, " ile sorulur ve ", { term: "la" }, " ile değiştirilir; perifraz ", { term: "quién" }, " ile sorulur."], id: ["Ungkapan tetap punya objek langsung: ditanyakan dengan ", { term: "qué" }, " dan diganti dengan ", { term: "la" }, "; perifrasis ditanyakan dengan ", { term: "quién" }, "."], vi: ["Cụm cố định có tân ngữ trực tiếp: hỏi bằng ", { term: "qué" }, " và thay bằng ", { term: "la" }, "; còn cụm động từ thì hỏi bằng ", { term: "quién" }, "."] }
          - level: C2
            periphrasis: { ex: [{ target: Viene pensando }, " lo mismo desde enero."], tr: { en: "He has been thinking the same thing since January.", uk: "Він думає те саме від січня.", pt: "Ele vem pensando a mesma coisa desde janeiro.", fr: "Il pense la même chose depuis janvier.", de: "Er denkt seit Januar dasselbe.", it: "Pensa la stessa cosa da gennaio.", pl: "Myśli to samo od stycznia.", tr: "Ocak ayından beri aynı şeyi düşünüyor.", id: "Dia terus memikirkan hal yang sama sejak Januari.", vi: "Từ tháng Một đến giờ anh ấy vẫn nghĩ như vậy." } }
            idiom: { ex: [{ target: Viene pensando }, " en sus cosas por la calle."], tr: { en: "He comes down the street thinking about his own things.", uk: "Він іде вулицею, думаючи про своє.", pt: "Ele vem pela rua pensando nas suas coisas.", fr: "Il arrive dans la rue en pensant à ses affaires.", de: "Er kommt in Gedanken versunken die Straße entlang.", it: "Viene per strada pensando ai fatti suoi.", pl: "Idzie ulicą, myśląc o swoich sprawach.", tr: "Sokakta kendi işlerini düşünerek geliyor.", id: "Dia datang di jalan sambil memikirkan urusannya sendiri.", vi: "Anh ấy đi trên phố, vừa đi vừa nghĩ chuyện riêng." } }
            difference: { es: "Con una duración es perífrasis; si venir conserva el movimiento, son dos verbos.", en: "It is a verb phrase when it shows duration; if venir still means coming, there are two verbs.", uk: "Якщо йдеться про тривалість, це перифраза; якщо venir зберігає значення руху, це два дієслова.", pt: "Com duração, é perífrase; se venir conserva o movimento, são dois verbos.", fr: "Avec une durée, c’est une périphrase ; si venir garde le sens de mouvement, ce sont deux verbes.", de: "Mit einer Dauer ist es eine Periphrase; behält venir seine Bewegung, sind es zwei Verben.", it: "Con una durata è una perifrasi; se venir conserva il movimento, sono due verbi.", pl: "Gdy wyraża czas trwania, jest peryfrazą; gdy venir zachowuje znaczenie ruchu, to dwa czasowniki.", tr: "Süre bildiriyorsa perifrazdır; venir hareket anlamını koruyorsa iki ayrı fiildir.", id: "Jika menyatakan durasi, itu perifrasis; jika venir tetap bermakna gerak, itu dua kata kerja.", vi: "Khi chỉ thời lượng thì là cụm động từ; nếu venir còn giữ nghĩa chuyển động thì là hai động từ." }
          - level: C2
            periphrasis: { ex: [{ target: Anda buscando }, " trabajo desde hace meses."], tr: { en: "He has been looking for work for months.", uk: "Він уже кілька місяців шукає роботу.", pt: "Anda procurando emprego há meses.", fr: "Il cherche du travail depuis des mois.", de: "Er sucht seit Monaten Arbeit.", it: "Cerca lavoro da mesi.", pl: "Szuka pracy od kilku miesięcy.", tr: "Aylardır iş arıyor.", id: "Dia sudah berbulan-bulan mencari pekerjaan.", vi: "Anh ấy đã tìm việc mấy tháng nay." } }
            idiom: { ex: ["Los turistas ", { target: andan mirando }, " los escaparates."], tr: { en: "The tourists walk around looking at the shop windows.", uk: "Туристи ходять і розглядають вітрини.", pt: "Os turistas andam olhando as vitrines.", fr: "Les touristes se promènent en regardant les vitrines.", de: "Die Touristen gehen umher und betrachten die Schaufenster.", it: "I turisti vanno in giro guardando le vetrine.", pl: "Turyści chodzą i oglądają wystawy.", tr: "Turistler vitrinlere bakarak dolaşıyor.", id: "Para turis berjalan sambil melihat-lihat etalase.", vi: "Các du khách đi dạo và ngắm các tủ kính cửa hàng." } }
            difference: { es: "Con una duración es perífrasis; si andar conserva el movimiento, son dos verbos.", en: "It is a verb phrase when it shows duration; if andar still means walking, there are two verbs.", uk: "Якщо йдеться про тривалість, це перифраза; якщо andar зберігає значення руху, це два дієслова.", pt: "Com duração, é perífrase; se andar conserva o movimento, são dois verbos.", fr: "Avec une durée, c’est une périphrase ; si andar garde le sens de mouvement, ce sont deux verbes.", de: "Mit einer Dauer ist es eine Periphrase; behält andar seine Bewegung, sind es zwei Verben.", it: "Con una durata è una perifrasi; se andar conserva il movimento, sono due verbi.", pl: "Gdy wyraża czas trwania, jest peryfrazą; gdy andar zachowuje znaczenie ruchu, to dwa czasowniki.", tr: "Süre bildiriyorsa perifrazdır; andar hareket anlamını koruyorsa iki ayrı fiildir.", id: "Jika menyatakan durasi, itu perifrasis; jika andar tetap bermakna gerak, itu dua kata kerja.", vi: "Khi chỉ thời lượng thì là cụm động từ; nếu andar còn giữ nghĩa chuyển động thì là hai động từ." }

