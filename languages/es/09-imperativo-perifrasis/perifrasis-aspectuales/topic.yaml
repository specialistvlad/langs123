          - { level: C1, form: { pattern: [acabar por, { slot: infinitive }] }, meaning: { es: un final tras dudas o resistencia, en: "an end result after doubt or resistance", uk: "кінцевий результат після вагань або опору", pt: "um desfecho depois de dúvidas ou resistência", fr: "une issue après des doutes ou une résistance", de: "ein Ergebnis nach Zweifeln oder Widerstand", it: "un esito finale dopo dubbi o resistenze", pl: "ostateczny skutek po wahaniach lub oporze", tr: "kuşku ya da direnişten sonra varılan sonuç", id: "akhir yang terjadi setelah keraguan atau penolakan", vi: "kết cục sau những lần do dự hoặc phản đối" }, ex: ["Después de dudar, ", { target: acabó por aceptar }, " el trabajo."], tr: { en: "After hesitating, he ended up accepting the job.", uk: "Після вагань він таки погодився на цю роботу.", pt: "Depois de hesitar, acabou aceitando o trabalho.", fr: "Après avoir hésité, il a fini par accepter le travail.", de: "Nach langem Zögern hat er die Stelle schließlich angenommen.", it: "Dopo aver esitato, alla fine ha accettato il lavoro.", pl: "Po wahaniach w końcu przyjął tę pracę.", tr: "Tereddüt ettikten sonra sonunda işi kabul etti.", id: "Setelah ragu, akhirnya dia menerima pekerjaan itu.", vi: "Sau khi do dự, cuối cùng anh ấy cũng nhận công việc đó." } }
          - { level: C1, form: { pattern: [no alcanzar a, { slot: infinitive }] }, meaning: { es: no lograr hacer algo, en: "not managing to do something", uk: "не зуміти щось зробити", pt: "não conseguir fazer algo", fr: "ne pas réussir à faire quelque chose", de: "etwas nicht schaffen", it: "non riuscire a fare qualcosa", pl: "nie zdołać czegoś zrobić", tr: "bir şeyi yapamamak", id: "tidak berhasil melakukan sesuatu", vi: "không làm được việc gì" }, ex: [{ target: No alcancé a oír }, " lo que dijo."], tr: { en: "I couldn't make out what he said.", uk: "Я не розчув, що він сказав.", pt: "Não consegui ouvir o que ele disse.", fr: "Je n’ai pas réussi à entendre ce qu’il a dit.", de: "Ich konnte nicht verstehen, was er gesagt hat.", it: "Non sono riuscito a sentire quello che ha detto.", pl: "Nie dosłyszałem, co powiedział.", tr: "Söylediğini duyamadım.", id: "Aku tidak sempat mendengar apa yang dia katakan.", vi: "Tôi không nghe kịp điều anh ấy nói." } }
          - { level: C1, form: { pattern: [echar a, { slot: infinitive }] }, meaning: { es: el comienzo de un movimiento, en: "the start of a movement", uk: "початок руху", pt: "o início de um movimento", fr: "le début d’un mouvement", de: "der Beginn einer Bewegung", it: "l'inizio di un movimento", pl: "początek ruchu", tr: "bir hareketin başlangıcı", id: "awal suatu gerakan", vi: "sự bắt đầu của một chuyển động" }, ex: ["El niño ", { target: echó a correr }, " hacia la puerta."], tr: { en: "The boy ran off towards the door.", uk: "Хлопчик кинувся бігти до дверей.", pt: "O menino saiu correndo em direção à porta.", fr: "L’enfant s’est mis à courir vers la porte.", de: "Der Junge rannte auf die Tür zu.", it: "Il bambino si è messo a correre verso la porta.", pl: "Chłopiec rzucił się biegiem do drzwi.", tr: "Çocuk kapıya doğru koşmaya başladı.", id: "Anak itu mulai berlari ke arah pintu.", vi: "Cậu bé chạy về phía cửa." } }
          - { level: C1, form: { pattern: [echarse a, { slot: infinitive }] }, meaning: { es: el comienzo repentino de una reacción, en: "the sudden start of a reaction", uk: "раптовий початок реакції", pt: "o início repentino de uma reação", fr: "le début soudain d’une réaction", de: "der plötzliche Beginn einer Reaktion", it: "l'inizio improvviso di una reazione", pl: "nagły początek reakcji", tr: "bir tepkinin ani başlangıcı", id: "awal reaksi yang tiba-tiba", vi: "sự bắt đầu đột ngột của một phản ứng" }, ex: ["Al verla, ", { target: se echó a reír }, "."], tr: { en: "When he saw her, he burst out laughing.", uk: "Побачивши її, він розсміявся.", pt: "Ao vê-la, começou a rir.", fr: "En la voyant, il s’est mis à rire.", de: "Als er sie sah, brach er in Gelächter aus.", it: "Vedendola, si è messo a ridere.", pl: "Gdy ją zobaczył, wybuchnął śmiechem.", tr: "Onu görünce gülmeye başladı.", id: "Melihatnya, dia langsung tertawa.", vi: "Thấy cô ấy, anh ấy bật cười." } }
          - { level: C1, form: { pattern: [romper a, { slot: infinitive }] }, meaning: { es: "el comienzo brusco de un llanto, una risa o un aplauso", en: "the sudden start of crying, laughter or applause", uk: "раптовий початок плачу, сміху чи оплесків", pt: "o início brusco de um choro, de uma risada ou de aplausos", fr: "le début brusque de pleurs, d’un rire ou d’applaudissements", de: "der plötzliche Ausbruch von Weinen, Lachen oder Applaus", it: "l'inizio brusco di un pianto, di una risata o di un applauso", pl: "nagły początek płaczu, śmiechu lub oklasków", tr: "ağlamanın, gülmenin ya da alkışın ani başlangıcı", id: "awal tangisan, tawa, atau tepuk tangan yang mendadak", vi: "sự bật lên đột ngột của tiếng khóc, tiếng cười hay tràng vỗ tay" }, ex: ["Al oír la noticia, ", { target: rompió a llorar }, "."], tr: { en: "On hearing the news, she burst into tears.", uk: "Почувши новину, вона розплакалася.", pt: "Ao ouvir a notícia, desatou a chorar.", fr: "En entendant la nouvelle, elle a éclaté en sanglots.", de: "Als sie die Nachricht hörte, brach sie in Tränen aus.", it: "Sentendo la notizia, è scoppiata a piangere.", pl: "Usłyszawszy wiadomość, wybuchnęła płaczem.", tr: "Haberi duyunca ağlamaya başladı.", id: "Mendengar kabar itu, dia langsung menangis.", vi: "Nghe tin, cô ấy bật khóc." } }

  - title: { es: Perífrasis de gerundio y de participio, en: "Gerund and participle verb phrases", uk: "Перифрази з герундієм та дієприкметником", pt: "Perífrases de gerúndio e de particípio", fr: "Périphrases au gérondif et au participe", de: "Periphrasen mit Gerundium und Partizip", it: "Perifrasi con il gerundio e il participio", pl: "Peryfrazy z gerundium i imiesłowem", tr: "Ulaçlı ve participio'lu perifrazlar", id: "Perifrasis gerundio dan partisip", vi: "Cụm động từ với gerundio và quá khứ phân từ" }
