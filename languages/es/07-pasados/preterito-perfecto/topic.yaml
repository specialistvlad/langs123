            pl: ["co zrobione, a co jeszcze nie, z ", { term: ya }, " i ", { term: todavía no }]
            tr: [{ term: ya }, " ve ", { term: todavía no }, " ile yapılmış ya da henüz yapılmamış olan"]
            id: ["yang sudah atau belum dilakukan, dengan ", { term: ya }, " dan ", { term: todavía no }]
            vi: ["việc đã làm hoặc chưa làm, với ", { term: ya }, " và ", { term: todavía no }]
          ex: [{ signal: Todavía no }, " ", { target: he terminado }, "."]
          tr: { en: "I haven't finished yet.", uk: "Я ще не закінчив.", pt: "Ainda não terminei.", fr: "Je n’ai pas encore fini.", de: "Ich bin noch nicht fertig.", it: "Non ho ancora finito.", pl: "Jeszcze nie skończyłem.", tr: "Henüz bitirmedim.", id: "Saya belum selesai.", vi: "Tôi chưa xong." }
        - level: A2
          variety: es-ES
          point: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
          rule:
            en: ["a time that includes now: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            es: ["un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            uk: ["час, що охоплює теперішнє: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            pt: ["um período que inclui o presente: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            fr: ["une période qui inclut le présent : ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            de: ["ein Zeitraum, der die Gegenwart einschließt: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            it: ["un periodo che include il presente: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            pl: ["okres obejmujący teraźniejszość: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            tr: ["şimdiyi de kapsayan bir zaman: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            id: ["waktu yang mencakup saat ini: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            vi: ["khoảng thời gian bao gồm hiện tại: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
          ex: [{ signal: Esta mañana }, " ", { target: he ido }, " al médico."]
          tr: { en: I went to the doctor this morning., uk: "Сьогодні вранці я ходив до лікаря.", pt: "Esta manhã fui ao médico.", fr: "Ce matin, je suis allé chez le médecin.", de: "Heute Morgen war ich beim Arzt.", it: "Stamattina sono andato dal medico.", pl: "Dziś rano byłem u lekarza.", tr: "Bu sabah doktora gittim.", id: "Tadi pagi saya pergi ke dokter.", vi: "Sáng nay tôi đã đi khám bác sĩ." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
          rule:
            en: "a situation that goes on up to now"
            es: "una situación que llega hasta ahora"
            uk: "ситуація, що триває аж до тепер"
            pt: "uma situação que chega até agora"
            fr: "une situation qui dure jusqu’à maintenant"
            de: "eine Situation, die bis jetzt andauert"
            it: "una situazione che dura fino a ora"
            pl: "sytuacja, która trwa do teraz"
            tr: "şimdiye kadar süren bir durum"
            id: "situasi yang berlangsung sampai sekarang"
            vi: "một tình huống kéo dài đến bây giờ"
          ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."]
          tr: { en: "I've always lived here.", uk: "Я завжди жив тут.", pt: "Sempre morei aqui.", fr: "J’ai toujours vécu ici.", de: "Ich habe schon immer hier gewohnt.", it: "Ho sempre vissuto qui.", pl: "Zawsze tu mieszkałem.", tr: "Hep burada yaşadım.", id: "Saya selalu tinggal di sini.", vi: "Tôi luôn sống ở đây." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["object pronouns and ", { term: no }, " go before ", { term: haber }]
            es: ["los pronombres de objeto y ", { term: no }, " van delante de ", { term: haber }]
            uk: ["займенники-додатки та ", { term: no }, " стоять перед ", { term: haber }]
            pt: ["os pronomes de objeto e ", { term: no }, " vêm antes de ", { term: haber }]
            fr: ["les pronoms compléments et ", { term: no }, " se placent avant ", { term: haber }]
            de: ["Objektpronomen und ", { term: no }, " stehen vor ", { term: haber }]
            it: ["i pronomi oggetto e ", { term: no }, " vanno davanti a ", { term: haber }]
            pl: ["zaimki dopełnieniowe i ", { term: no }, " stoją przed ", { term: haber }]
            tr: ["nesne zamirleri ve ", { term: no }, " ", { term: haber }, " fiilinden önce gelir"]
            id: ["pronomina objek dan ", { term: no }, " berada sebelum ", { term: haber }]
            vi: ["đại từ tân ngữ và ", { term: no }, " đứng trước ", { term: haber }]
          ex: ["No ", { target: lo he visto }, "."]
          tr: { en: "I haven't seen it.", uk: "Я цього не бачив.", pt: "Eu não vi isso.", fr: "Je ne l’ai pas vu.", de: "Ich habe es nicht gesehen.", it: "Non l’ho visto.", pl: "Nie widziałem tego.", tr: "Onu görmedim.", id: "Saya belum melihatnya.", vi: "Tôi chưa thấy nó." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["a finished time such as ", { term: ayer }, " takes the preterite"]
            es: ["un tiempo terminado como ", { term: ayer }, " lleva el indefinido"]
            uk: ["завершений час, як-от ", { term: ayer }, ", вимагає претериту"]
            pt: ["um tempo terminado como ", { term: ayer }, " leva o pretérito perfeito simples"]
            fr: ["une période révolue comme ", { term: ayer }, " prend le prétérit"]
            de: ["eine abgeschlossene Zeitangabe wie ", { term: ayer }, " verlangt das Indefinido"]
            it: ["un tempo concluso come ", { term: ayer }, " richiede l’indefinido"]
            pl: ["czas zakończony, np. ", { term: ayer }, ", wymaga indefinido"]
            tr: ["bitmiş bir zaman (", { term: ayer }, ") indefinido ile kullanılır"]
            id: ["waktu yang sudah selesai seperti ", { term: ayer }, " memakai indefinido"]
            vi: ["thời gian đã kết thúc như ", { term: ayer }, " đi với indefinido"]
          ex: [{ signal: Ayer }, " ", { target: fui }, " al cine."]
          tr: { en: I went to the cinema yesterday., uk: "Учора я ходив у кіно.", pt: "Ontem fui ao cinema.", fr: "Hier, je suis allé au cinéma.", de: "Gestern war ich im Kino.", it: "Ieri sono andato al cinema.", pl: "Wczoraj poszedłem do kina.", tr: "Dün sinemaya gittim.", id: "Kemarin saya pergi ke bioskop.", vi: "Hôm qua tôi đã đi xem phim." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The present perfect tells a past action in a time that reaches up to now."
              es: "El pretérito perfecto cuenta una acción pasada en un tiempo que llega hasta ahora."
              uk: "Перфект передає минулу дію в часі, що триває аж до тепер."
              pt: "O pretérito perfeito composto conta uma ação passada em um tempo que chega até agora."
              fr: "Le passé composé raconte une action passée dans une période qui va jusqu’à maintenant."
              de: "Das Pretérito perfecto erzählt eine vergangene Handlung in einem Zeitraum, der bis jetzt reicht."
              it: "Il pretérito perfecto racconta un’azione passata in un tempo che arriva fino a ora."
              pl: "Pretérito perfecto opisuje czynność z przeszłości w okresie, który trwa do teraz."
              tr: "Pretérito perfecto, şimdiye kadar uzanan bir zaman içinde geçmişte olmuş bir eylemi anlatır."
              id: "Pretérito perfecto menceritakan tindakan di masa lalu dalam rentang waktu yang berlanjut sampai sekarang."
              vi: "Pretérito perfecto kể một hành động trong quá khứ, trong khoảng thời gian kéo dài đến bây giờ."
            ex: ["¿", { target: Has visto }, " mis llaves?"]
            tr: { en: Have you seen my keys?, uk: "Ти не бачив моїх ключів?", pt: "Você viu minhas chaves?", fr: "As-tu vu mes clés ?", de: "Hast du meine Schlüssel gesehen?", it: "Hai visto le mie chiavi?", pl: "Widziałeś moje klucze?", tr: "Anahtarlarımı gördün mü?", id: "Apakah kamu melihat kunciku?", vi: "Bạn có thấy chìa khóa của tôi không?" }
          - type: note
            level: A2
            text:
              en: ["Spanish grammars call it ", { term: pretérito perfecto }, " or ", { term: pretérito perfecto compuesto }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito perfecto }, " o ", { term: pretérito perfecto compuesto }, "."]
              uk: ["Іспанські граматики називають його ", { term: pretérito perfecto }, " або ", { term: pretérito perfecto compuesto }, "."]
              pt: ["As gramáticas do espanhol o chamam de ", { term: pretérito perfecto }, " ou ", { term: pretérito perfecto compuesto }, "."]
              fr: ["Les grammaires espagnoles l’appellent ", { term: pretérito perfecto }, " ou ", { term: pretérito perfecto compuesto }, "."]
              de: ["Spanische Grammatiken nennen es ", { term: pretérito perfecto }, " oder ", { term: pretérito perfecto compuesto }, "."]
              it: ["Le grammatiche spagnole lo chiamano ", { term: pretérito perfecto }, " o ", { term: pretérito perfecto compuesto }, "."]
              pl: ["Gramatyki hiszpańskie nazywają ten czas ", { term: pretérito perfecto }, " lub ", { term: pretérito perfecto compuesto }, "."]
              tr: ["İspanyolca dilbilgisi kitapları buna ", { term: pretérito perfecto }, " ya da ", { term: pretérito perfecto compuesto }, " der."]
              id: ["Buku tata bahasa Spanyol menyebutnya ", { term: pretérito perfecto }, " atau ", { term: pretérito perfecto compuesto }, "."]
              vi: ["Các sách ngữ pháp tiếng Tây Ban Nha gọi thì này là ", { term: pretérito perfecto }, " hoặc ", { term: pretérito perfecto compuesto }, "."]
          - type: note
            level: A2
            variety: es-ES
            text:
              en: "In Spain, it also tells actions finished earlier today, this week or this year."
              es: "En España, también cuenta acciones terminadas hoy, esta semana o este año."
              uk: "В Іспанії він передає також дії, завершені сьогодні, цього тижня чи цього року."
              pt: "Na Espanha, ele também conta ações terminadas hoje, esta semana ou este ano."
              fr: "En Espagne, il raconte aussi des actions terminées aujourd’hui, cette semaine ou cette année."
              de: "In Spanien erzählt es auch Handlungen, die heute, diese Woche oder dieses Jahr abgeschlossen wurden."
              it: "In Spagna racconta anche azioni concluse oggi, questa settimana o quest’anno."
              pl: "W Hiszpanii opisuje także czynności zakończone dziś, w tym tygodniu lub w tym roku."
              tr: "İspanya’da bugün, bu hafta ya da bu yıl içinde bitmiş eylemler için de kullanılır."
              id: "Di Spanyol, tense ini juga dipakai untuk tindakan yang selesai hari ini, minggu ini, atau tahun ini."
              vi: "Ở Tây Ban Nha, thì này cũng dùng cho hành động đã xong hôm nay, tuần này hoặc năm nay."
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In most of Latin America, it tells experiences and situations up to now, and a finished action, today's included, takes the ", { link: preterite, to: es.pasados.preterito-indefinido }, "; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for today, as Spain does."]
              es: ["En la mayor parte de Latinoamérica, cuenta experiencias y situaciones hasta ahora, y una acción terminada, también la de hoy, lleva el ", { link: indefinido, to: es.pasados.preterito-indefinido }, "; el español andino (Perú, Bolivia, la sierra de Ecuador) usa el perfecto para hoy, como en España."]
              uk: ["У більшій частині Латинської Америки він передає досвід і ситуації, що тривають аж до тепер, а завершена дія, і сьогоднішня теж, стоїть у ", { link: претериті, to: es.pasados.preterito-indefinido }, "; андська іспанська (Перу, Болівія, гірський Еквадор) уживає для сьогоднішнього перфект, як в Іспанії."]
              pt: ["Na maior parte da América Latina, ele conta experiências e situações até agora, e uma ação terminada, inclusive a de hoje, leva o ", { link: pretérito perfeito simples, to: es.pasados.preterito-indefinido }, "; o espanhol andino (Peru, Bolívia, região serrana do Equador) usa o pretérito perfeito composto para hoje, como na Espanha."]
              fr: ["Dans la plus grande partie de l’Amérique latine, il raconte des expériences et des situations jusqu’à maintenant, et une action terminée, celle d’aujourd’hui comprise, prend le ", { link: prétérit, to: es.pasados.preterito-indefinido }, " ; l’espagnol andin (Pérou, Bolivie, hautes terres de l’Équateur) emploie le passé composé pour aujourd’hui, comme en Espagne."]
              de: ["In großen Teilen Lateinamerikas erzählt es Erfahrungen und Situationen bis jetzt, und eine abgeschlossene Handlung, auch die von heute, steht im ", { link: Indefinido, to: es.pasados.preterito-indefinido }, "; das andine Spanisch (Peru, Bolivien, das Hochland von Ecuador) benutzt für heute das Pretérito perfecto, wie in Spanien."]
              it: ["Nella maggior parte dell’America Latina racconta esperienze e situazioni fino a ora, e un’azione conclusa, anche quella di oggi, richiede il ", { link: pretérito indefinido, to: es.pasados.preterito-indefinido }, "; lo spagnolo andino (Perù, Bolivia, la sierra dell’Ecuador) usa il pretérito perfecto per oggi, come in Spagna."]
              pl: ["W większości Ameryki Łacińskiej opisuje doświadczenia i sytuacje do teraz, a czynność zakończoną, także dzisiejszą, wyraża ", { link: pretérito indefinido, to: es.pasados.preterito-indefinido }, "; hiszpański andyjski (Peru, Boliwia, górski Ekwador) używa pretérito perfecto dla dzisiaj, jak w Hiszpanii."]
              tr: ["Latin Amerika’nın büyük bölümünde şimdiye kadarki deneyimleri ve durumları anlatır; bitmiş bir eylem, bugünküler de dahil, ", { link: pretérito indefinido, to: es.pasados.preterito-indefinido }, " ile söylenir; And İspanyolcası (Peru, Bolivya, Ekvador’un dağlık bölgesi) bugün için tıpkı İspanya’daki gibi pretérito perfecto kullanır."]
              id: ["Di sebagian besar Amerika Latin, tense ini menceritakan pengalaman dan situasi sampai sekarang, dan tindakan yang sudah selesai, termasuk yang hari ini, memakai ", { link: pretérito indefinido, to: es.pasados.preterito-indefinido }, "; bahasa Spanyol Andes (Peru, Bolivia, dataran tinggi Ekuador) memakai pretérito perfecto untuk hari ini, seperti di Spanyol."]
              vi: ["Ở phần lớn Mỹ Latinh, thì này kể kinh nghiệm và tình huống cho đến nay, còn hành động đã xong, kể cả của hôm nay, dùng ", { link: pretérito indefinido, to: es.pasados.preterito-indefinido }, "; tiếng Tây Ban Nha vùng Andes (Peru, Bolivia, cao nguyên Ecuador) dùng pretérito perfecto cho hôm nay, như ở Tây Ban Nha."]
          - type: note
            level: A2
            text:
              en: ["Both tenses side by side: ", { link: Present Perfect or Preterite, to: es.pasados.perfecto-indefinido }, "."]
              es: ["Los dos tiempos, uno al lado del otro: ", { link: Perfecto o indefinido, to: es.pasados.perfecto-indefinido }, "."]
              uk: ["Обидва часи поруч: ", { link: Перфект чи претерит, to: es.pasados.perfecto-indefinido }, "."]
              pt: ["Os dois tempos lado a lado: ", { link: "Perfeito composto ou perfeito simples", to: es.pasados.perfecto-indefinido }, "."]
              fr: ["Les deux temps côte à côte : ", { link: Passé composé ou prétérit, to: es.pasados.perfecto-indefinido }, "."]
              de: ["Beide Zeitformen nebeneinander: ", { link: Perfecto oder Indefinido, to: es.pasados.perfecto-indefinido }, "."]
              it: ["I due tempi a confronto: ", { link: Perfecto o indefinido, to: es.pasados.perfecto-indefinido }, "."]
              pl: ["Oba czasy obok siebie: ", { link: Perfecto czy indefinido, to: es.pasados.perfecto-indefinido }, "."]
              tr: ["İki zaman yan yana: ", { link: "Perfecto mu, indefinido mu?", to: es.pasados.perfecto-indefinido }, "."]
              id: ["Kedua tense berdampingan: ", { link: Perfecto atau indefinido, to: es.pasados.perfecto-indefinido }, "."]
              vi: ["Hai thì đặt cạnh nhau: ", { link: "Hiện tại hoàn thành hay indefinido", to: es.pasados.perfecto-indefinido }, "."]

  - title: { en: "Form: haber and the participle", es: "Forma: haber y el participio", uk: "Форма: haber і дієприкметник", pt: "Forma: haber e o particípio", fr: "Forme : haber et le participe", de: "Form: haber und das Partizip", it: "Forma: haber e il participio", pl: "Forma: haber i imiesłów", tr: "Biçim: haber ve participio", id: "Bentuk: haber dan partisip", vi: "Dạng: haber và quá khứ phân từ" }
    role: form
    features: { tense: prs, aspect: prf }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа", pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: haber, label: haber }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, haber: { aux: he }, ar: [{ aux: he }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: he }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, haber: { aux: has }, ar: [{ aux: has }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: has }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, haber: { aux: ha }, ar: [{ aux: ha }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: ha }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, haber: { aux: hemos }, ar: [{ aux: hemos }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: hemos }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, haber: { aux: habéis }, ar: [{ aux: habéis }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habéis }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, haber: { aux: han }, ar: [{ aux: han }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: han }, " ", { target: [com, { ending: ido }] }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The participle adds ", { ending: ado }, " to ", { term: -ar }, " verbs and ", { ending: ido }, " to ", { term: -er }, " and ", { term: -ir }, " verbs."]
              es: ["El participio añade ", { ending: ado }, " a los verbos en ", { term: -ar }, " e ", { ending: ido }, " a los verbos en ", { term: -er }, " y en ", { term: -ir }, "."]
              uk: ["Дієприкметник додає ", { ending: ado }, " до дієслів на ", { term: -ar }, " і ", { ending: ido }, " до дієслів на ", { term: -er }, " та ", { term: -ir }, "."]
              pt: ["O particípio acrescenta ", { ending: ado }, " aos verbos em ", { term: -ar }, " e ", { ending: ido }, " aos verbos em ", { term: -er }, " e ", { term: -ir }, "."]
              fr: ["Le participe ajoute ", { ending: ado }, " aux verbes en ", { term: -ar }, " et ", { ending: ido }, " aux verbes en ", { term: -er }, " et ", { term: -ir }, "."]
              de: ["Das Partizip endet bei Verben auf ", { term: -ar }, " auf ", { ending: ado }, ", bei Verben auf ", { term: -er }, " und ", { term: -ir }, " auf ", { ending: ido }, "."]
