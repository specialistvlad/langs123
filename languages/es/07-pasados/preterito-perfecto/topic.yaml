summary:
  lead:
    en: ["The present perfect joins ", { term: haber }, " and a participle to link a past action to now: ", { term: he comido }, ", ", { term: has visto }, "."]
    es: ["El pretérito perfecto combina ", { term: haber }, " y un participio para relacionar una acción pasada con el presente: ", { term: he comido }, ", ", { term: has visto }, "."]
    uk: ["Перфект поєднує ", { term: haber }, " і дієприкметник, щоб пов’язати минулу дію з теперішнім: ", { term: he comido }, ", ", { term: has visto }, "."]
    pt: ["O pretérito perfeito composto junta ", { term: haber }, " e um particípio para ligar uma ação passada ao presente: ", { term: he comido }, ", ", { term: has visto }, "."]
    fr: ["Le passé composé associe ", { term: haber }, " et un participe passé pour relier une action passée au présent : ", { term: he comido }, ", ", { term: has visto }, "."]
    de: ["Das Pretérito perfecto verbindet ", { term: haber }, " mit einem Partizip, um eine vergangene Handlung mit der Gegenwart zu verknüpfen: ", { term: he comido }, ", ", { term: has visto }, "."]
    it: ["Il pretérito perfecto unisce ", { term: haber }, " e un participio per collegare un’azione passata al presente: ", { term: he comido }, ", ", { term: has visto }, "."]
    pl: ["Pretérito perfecto łączy ", { term: haber }, " z imiesłowem, aby powiązać czynność z przeszłości z teraźniejszością: ", { term: he comido }, ", ", { term: has visto }, "."]
    tr: ["Pretérito perfecto, geçmişteki bir eylemi şimdiyle ilişkilendirmek için ", { term: haber }, " fiilini bir participio ile birleştirir: ", { term: he comido }, ", ", { term: has visto }, "."]
    id: ["Pretérito perfecto menggabungkan ", { term: haber }, " dan partisip untuk menghubungkan tindakan di masa lalu dengan masa kini: ", { term: he comido }, ", ", { term: has visto }, "."]
    vi: ["Pretérito perfecto ghép ", { term: haber }, " với quá khứ phân từ để nối hành động quá khứ với hiện tại: ", { term: he comido }, ", ", { term: has visto }, "."]
  rule:
    en: ["The participle never changes, and nothing goes between ", { term: haber }, " and the participle:"]
    es: ["El participio no cambia nunca, y nada se pone entre ", { term: haber }, " y el participio:"]
    uk: ["Дієприкметник ніколи не змінюється, і між ", { term: haber }, " та дієприкметником нічого не ставлять:"]
    pt: ["O particípio nunca muda, e nada se coloca entre ", { term: haber }, " e o particípio:"]
    fr: ["Le participe ne change jamais, et rien ne se place entre ", { term: haber }, " et le participe :"]
    de: ["Das Partizip ändert sich nie, und zwischen ", { term: haber }, " und dem Partizip steht nichts:"]
    it: ["Il participio non cambia mai e tra ", { term: haber }, " e il participio non si mette niente:"]
    pl: ["Imiesłów nigdy się nie zmienia, a między ", { term: haber }, " a imiesłowem nic nie stoi:"]
    tr: ["Participio hiçbir zaman değişmez; ", { term: haber }, " ile participio arasına hiçbir şey girmez:"]
    id: ["Partisip tidak pernah berubah, dan tidak ada kata di antara ", { term: haber }, " dan partisip:"]
    vi: ["Quá khứ phân từ không đổi, và giữa ", { term: haber }, " với nó không có gì chen vào:"]
  ex: { examples: [["Ana ", { target: ha llegado }, "."], ["Ya lo ", { target: hemos visto }, "."]] }

