      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A finished time, such as ", { term: ayer }, " or ", { term: el año pasado }, ", takes the preterite in every variety:"]
              es: ["Un tiempo terminado, como ", { term: ayer }, " o ", { term: el año pasado }, ", lleva el indefinido en todas las variedades:"]
              uk: ["Завершений час, як-от ", { term: ayer }, " чи ", { term: el año pasado }, ", у всіх варіантах мови вимагає претериту:"]
              pt: ["Um tempo terminado, como ", { term: ayer }, " ou ", { term: el año pasado }, ", leva o pretérito perfeito simples em todas as variedades:"]
              fr: ["Une période révolue, comme ", { term: ayer }, " ou ", { term: el año pasado }, ", prend le prétérit dans toutes les variétés :"]
              de: ["Eine abgeschlossene Zeitangabe wie ", { term: ayer }, " oder ", { term: el año pasado }, " verlangt in allen Varianten das Indefinido:"]
              it: ["Un tempo concluso, come ", { term: ayer }, " o ", { term: el año pasado }, ", richiede l’indefinido in tutte le varietà:"]
              pl: ["Czas zakończony, np. ", { term: ayer }, " lub ", { term: el año pasado }, ", wymaga indefinido we wszystkich odmianach:"]
              tr: ["Bitmiş bir zaman (", { term: ayer }, ", ", { term: el año pasado }, ") tüm varyantlarda indefinido ile kullanılır:"]
              id: ["Waktu yang sudah selesai, seperti ", { term: ayer }, " atau ", { term: el año pasado }, ", memakai indefinido di semua varian:"]
              vi: ["Thời gian đã kết thúc, như ", { term: ayer }, " hoặc ", { term: el año pasado }, ", đi với indefinido ở mọi biến thể:"]
            ex: [{ signal: Ayer }, " fui al cine."]
            tr: { en: I went to the cinema yesterday., uk: "Учора я ходив у кіно.", pt: "Ontem fui ao cinema.", fr: "Hier, je suis allé au cinéma.", de: "Gestern war ich im Kino.", it: "Ieri sono andato al cinema.", pl: "Wczoraj poszedłem do kina.", tr: "Dün sinemaya gittim.", id: "Kemarin saya pergi ke bioskop.", vi: "Hôm qua tôi đã đi xem phim." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, an action finished earlier today takes the preterite; Andean Spanish (Peru, Bolivia, highland Ecuador) takes the perfect, as Spain does:"
              es: "En la mayor parte de Latinoamérica, una acción terminada hoy lleva el indefinido; el español andino (Perú, Bolivia, la sierra de Ecuador) lleva el perfecto, como en España:"
              uk: "У більшій частині Латинської Америки дія, завершена сьогодні, стоїть у претериті; андська іспанська (Перу, Болівія, гірський Еквадор) уживає перфект, як в Іспанії:"
              pt: "Na maior parte da América Latina, uma ação terminada hoje leva o pretérito perfeito simples; o espanhol andino (Peru, Bolívia, região serrana do Equador) leva o pretérito perfeito composto, como na Espanha:"
              fr: "Dans la plus grande partie de l’Amérique latine, une action terminée aujourd’hui prend le prétérit ; l’espagnol andin (Pérou, Bolivie, hautes terres de l’Équateur) prend le passé composé, comme l’Espagne :"
              de: "In großen Teilen Lateinamerikas steht eine heute abgeschlossene Handlung im Indefinido; das andine Spanisch (Peru, Bolivien, das Hochland von Ecuador) verwendet das Pretérito perfecto, wie Spanien:"
              it: "Nella maggior parte dell’America Latina un’azione conclusa oggi richiede l’indefinido; lo spagnolo andino (Perù, Bolivia, la sierra dell’Ecuador) richiede il pretérito perfecto, come in Spagna:"
              pl: "W większości Ameryki Łacińskiej czynność zakończoną dziś wyraża indefinido; hiszpański andyjski (Peru, Boliwia, górski Ekwador) używa pretérito perfecto, jak w Hiszpanii:"
              tr: "Latin Amerika’nın büyük bölümünde bugün bitmiş bir eylem indefinido ile söylenir; And İspanyolcası (Peru, Bolivya, Ekvador’un dağlık bölgesi) tıpkı İspanya’daki gibi pretérito perfecto kullanır:"
              id: "Di sebagian besar Amerika Latin, tindakan yang selesai hari ini memakai indefinido; bahasa Spanyol Andes (Peru, Bolivia, dataran tinggi Ekuador) memakai pretérito perfecto, seperti di Spanyol:"
              vi: "Ở phần lớn Mỹ Latinh, hành động đã xong hôm nay dùng indefinido; tiếng Tây Ban Nha vùng Andes (Peru, Bolivia, cao nguyên Ecuador) dùng pretérito perfecto, như ở Tây Ban Nha:"
            ex: [{ signal: Esta mañana }, " fui al médico."]
            tr: { en: I went to the doctor this morning., uk: "Сьогодні вранці я ходив до лікаря.", pt: "Esta manhã fui ao médico.", fr: "Ce matin, je suis allé chez le médecin.", de: "Heute Morgen war ich beim Arzt.", it: "Stamattina sono andato dal medico.", pl: "Dziś rano byłem u lekarza.", tr: "Bu sabah doktora gittim.", id: "Tadi pagi saya pergi ke dokter.", vi: "Sáng nay tôi đã đi khám bác sĩ." }

