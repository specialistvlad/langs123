# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pasados.preterito-perfecto
lang: es
kind: grammar
tags: [verbs, tenses, past, perfect, haber]
concepts: [present-perfect]
related: [es.pasados.perfecto-indefinido, es.pasados.preterito-indefinido, es.pasados.pluscuamperfecto, es.pasados.verbos-irregulares, es.pasados.mapa-tiempos]
status: { en: draft, es: draft }
translated: { es: "2f9b51 b6fe39 68506a 08974c b63740 f0403b c0f9ca" }

title: { en: "Present Perfect: he comido", es: "El pretérito perfecto: he comido" }
summary:
  lead:
    en: ["The present perfect joins ", { term: haber }, " and a participle to link a past action to now: ", { term: he comido }, ", ", { term: has visto }, "."]
    es: ["El pretérito perfecto combina ", { term: haber }, " y un participio para relacionar una acción pasada con el presente: ", { term: he comido }, ", ", { term: has visto }, "."]
  rule:
    en: ["The participle never changes, and nothing goes between ", { term: haber }, " and the participle:"]
    es: ["El participio no cambia nunca, y nada se pone entre ", { term: haber }, " y el participio:"]
  ex: { examples: [["Ana ", { target: ha llegado }, "."], ["Ya lo ", { target: hemos visto }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: { pattern: [{ alternatives: [{ term: he }, { term: has }, { term: ha }, { term: hemos }, { term: han }] }, { slot: past participle }] }
            es: { pattern: [{ alternatives: [{ term: he }, { term: has }, { term: ha }, { term: hemos }, { term: han }] }, { slot: past participle }] }
          ex: ["¿", { target: Has estado }, " en Perú?"]
          tr: { en: Have you been to Peru? }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vosotros }, ": ", { pattern: [{ term: habéis }, { slot: past participle }] }]
            es: [{ term: vosotros }, ": ", { pattern: [{ term: habéis }, { slot: past participle }] }]
          ex: ["¿", { target: Habéis terminado }, "?"]
          tr: { en: Have you finished? }
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: ["participle: ", { mapping: [{ term: hablar }, { term: hablado }] }, ", ", { mapping: [{ term: comer }, { term: comido }] }, ", ", { mapping: [{ term: vivir }, { term: vivido }] }]
            es: ["participio: ", { mapping: [{ term: hablar }, { term: hablado }] }, ", ", { mapping: [{ term: comer }, { term: comido }] }, ", ", { mapping: [{ term: vivir }, { term: vivido }] }]
          ex: ["Nunca ", { target: he vivido }, " sola."]
          tr: { en: "I've never lived on my own." }
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: ["irregular participles: ", { mapping: [{ term: hacer }, { term: hecho }] }, ", ", { mapping: [{ term: escribir }, { term: escrito }] }, ", ", { mapping: [{ term: ver }, { term: visto }] }]
            es: ["participios irregulares: ", { mapping: [{ term: hacer }, { term: hecho }] }, ", ", { mapping: [{ term: escribir }, { term: escrito }] }, ", ", { mapping: [{ term: ver }, { term: visto }] }]
          ex: ["Ya ", { target: he hecho }, " la cena."]
          tr: { en: "I've already made dinner." }
        - level: A2
          point: { en: Form, es: Forma }
          rule:
            en: ["more irregular participles: ", { mapping: [{ term: decir }, { term: dicho }] }, ", ", { mapping: [{ term: poner }, { term: puesto }] }, ", ", { mapping: [{ term: volver }, { term: vuelto }] }, ", ", { mapping: [{ term: abrir }, { term: abierto }] }]
            es: ["más participios irregulares: ", { mapping: [{ term: decir }, { term: dicho }] }, ", ", { mapping: [{ term: poner }, { term: puesto }] }, ", ", { mapping: [{ term: volver }, { term: vuelto }] }, ", ", { mapping: [{ term: abrir }, { term: abierto }] }]
          ex: ["¿Quién ", { target: ha abierto }, " la ventana?"]
          tr: { en: Who has opened the window? }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: ["experience up to now, with ", { term: alguna vez }, " and ", { term: nunca }]
            es: ["la experiencia hasta ahora, con ", { term: alguna vez }, " y ", { term: nunca }]
          ex: ["¿", { target: Has probado }, " el mole ", { signal: alguna vez }, "?"]
          tr: { en: Have you ever tried mole? }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: ["done or not yet done, with ", { term: ya }, " and ", { term: todavía no }]
            es: ["lo hecho o lo pendiente, con ", { term: ya }, " y ", { term: todavía no }]
          ex: [{ signal: Todavía no }, " ", { target: he terminado }, "."]
          tr: { en: "I haven't finished yet." }
        - level: A2
          variety: es-ES
          point: { en: Use, es: Uso }
          rule:
            en: ["a time that includes now: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
            es: ["un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: este año }]
          ex: [{ signal: Esta mañana }, " ", { target: he ido }, " al médico."]
          tr: { en: I went to the doctor this morning. }
        - level: A2
          point: { en: Use, es: Uso }
          rule:
            en: "a situation that goes on up to now"
            es: "una situación que llega hasta ahora"
          ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."]
          tr: { en: "I've always lived here." }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: ["object pronouns and ", { term: no }, " go before ", { term: haber }]
            es: ["los pronombres de objeto y ", { term: no }, " van delante de ", { term: haber }]
          ex: ["No ", { target: lo he visto }, "."]
          tr: { en: "I haven't seen it." }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: ["a finished time such as ", { term: ayer }, " takes the preterite"]
            es: ["un tiempo terminado como ", { term: ayer }, " lleva el indefinido"]
          ex: [{ signal: Ayer }, " ", { target: fui }, " al cine."]
          tr: { en: I went to the cinema yesterday. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The present perfect tells a past action in a time that reaches up to now."
              es: "El pretérito perfecto cuenta una acción pasada en un tiempo que llega hasta ahora."
            ex: ["¿", { target: Has visto }, " mis llaves?"]
            tr: { en: Have you seen my keys? }
          - type: note
            level: A2
            text:
              en: ["Spanish grammars call it ", { term: pretérito perfecto }, " or ", { term: pretérito perfecto compuesto }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito perfecto }, " o ", { term: pretérito perfecto compuesto }, "."]
          - type: note
            level: A2
            variety: es-ES
            text:
              en: "In Spain, it also tells actions finished earlier today, this week or this year."
              es: "En España, también cuenta acciones terminadas hoy, esta semana o este año."
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Latin America, it tells experiences and situations up to now; a finished action takes the ", { link: preterite, to: es.pasados.preterito-indefinido }, "."]
              es: ["En Latinoamérica, cuenta experiencias y situaciones hasta ahora; una acción terminada lleva el ", { link: indefinido, to: es.pasados.preterito-indefinido }, "."]
          - type: note
            level: A2
            text:
              en: ["Both tenses side by side: ", { link: Present Perfect or Preterite, to: es.pasados.perfecto-indefinido }, "."]
              es: ["Los dos tiempos, uno al lado del otro: ", { link: Perfecto o indefinido, to: es.pasados.perfecto-indefinido }, "."]

  - title: { en: "Form: haber and the participle", es: "Forma: haber y el participio" }
    role: form
    features: { tense: prs, aspect: prf }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: haber, label: haber }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, haber: { aux: he }, ar: [{ aux: he }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: he }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, haber: { aux: has }, ar: [{ aux: has }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: has }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, haber: { aux: ha }, ar: [{ aux: ha }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: ha }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, haber: { aux: hemos }, ar: [{ aux: hemos }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: hemos }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, haber: { aux: habéis }, ar: [{ aux: habéis }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habéis }, " ", { target: [com, { ending: ido }] }] }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, haber: { aux: han }, ar: [{ aux: han }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: han }, " ", { target: [com, { ending: ido }] }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The participle adds ", { ending: ado }, " to ", { term: -ar }, " verbs and ", { ending: ido }, " to ", { term: -er }, " and ", { term: -ir }, " verbs."]
              es: ["El participio añade ", { ending: ado }, " a los verbos en ", { term: -ar }, " e ", { ending: ido }, " a los verbos en ", { term: -er }, " y en ", { term: -ir }, "."]
            ex: { examples: [["¿", { target: Has trabajado }, " en un hotel?"], ["Nunca ", { target: he vivido }, " sola."]] }
            tr: { en: { examples: [Have you worked in a hotel?, "I've never lived on my own."] } }
          - type: rule
            level: A2
            text:
              en: ["After ", { term: haber }, ", the participle never changes for person, gender or number:"]
              es: ["Después de ", { term: haber }, ", el participio no cambia nunca de persona, género ni número:"]
            ex: { examples: [["Ella ", { target: ha llegado }, "."], ["Ellas ", { target: han llegado }, "."]] }
            tr: { en: { examples: [She has arrived., They have arrived.] } }
          - type: rule
            level: A2
            text:
              en: ["Nothing goes between ", { term: haber }, " and the participle; object pronouns and ", { term: no }, " go before ", { term: haber }, ":"]
              es: ["Nada se pone entre ", { term: haber }, " y el participio; los pronombres de objeto y ", { term: no }, " van delante de ", { term: haber }, ":"]
            ex: { examples: [["No ", { target: lo he visto }, "."], ["Ya ", { target: te lo he dicho }, "."]] }
            tr: { en: { examples: ["I haven't seen it.", "I've already told you."] } }
          - type: rule
            level: A2
            text:
              en: ["After a vowel, the ending takes an accent: ", { term: leído }, ", ", { term: oído }, ", ", { term: traído }, "."]
              es: ["Después de una vocal, la terminación lleva tilde: ", { term: leído }, ", ", { term: oído }, ", ", { term: traído }, "."]
            ex: ["¿", { target: Has leído }, " este libro?"]
            tr: { en: Have you read this book? }

  - title: { en: "Form: irregular participles", es: "Forma: participios irregulares" }
    role: form
    features: { tense: prs, aspect: prf }
    content:
      - type: usage
        columns:
          - { key: participle, label: { en: Verb and participle, es: Verbo y participio } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, participle: { mapping: [{ term: hacer }, { term: hecho }] }, ex: ["Ya ", { target: he hecho }, " la cena."], tr: { en: "I've already made dinner." } }
          - { level: A2, participle: { mapping: [{ term: escribir }, { term: escrito }] }, ex: ["Nunca ", { target: he escrito }, " un poema."], tr: { en: "I've never written a poem." } }
          - { level: A2, participle: { mapping: [{ term: ver }, { term: visto }] }, ex: ["¿", { target: Has visto }, " esta película?"], tr: { en: Have you seen this film? } }
          - { level: A2, participle: { mapping: [{ term: decir }, { term: dicho }] }, ex: ["¿Qué te ", { target: ha dicho }, " el médico?"], tr: { en: What has the doctor told you? } }
          - { level: A2, participle: { mapping: [{ term: poner }, { term: puesto }] }, ex: ["¿Dónde ", { target: has puesto }, " las llaves?"], tr: { en: Where have you put the keys? } }
          - { level: A2, participle: { mapping: [{ term: volver }, { term: vuelto }] }, ex: ["Mi hermano todavía no ", { target: ha vuelto }, "."], tr: { en: "My brother hasn't come back yet." } }
          - { level: A2, participle: { mapping: [{ term: abrir }, { term: abierto }] }, ex: ["¿Quién ", { target: ha abierto }, " la ventana?"], tr: { en: Who has opened the window? } }
          - { level: A2, participle: { mapping: [{ term: romper }, { term: roto }] }, ex: ["Alguien ", { target: ha roto }, " el vaso."], tr: { en: Someone has broken the glass. } }
      - type: list
        items:
          - type: note
            level: A2
            text:
              en: ["Every irregular participle in one table: ", { link: Irregular Verbs Table, to: es.pasados.verbos-irregulares }, "."]
              es: ["Todos los participios irregulares en una tabla: ", { link: Tabla de verbos irregulares, to: es.pasados.verbos-irregulares }, "."]

  - title: { en: Use, es: Uso }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - level: A2
            use: { en: ["Experience up to now: ", { term: alguna vez }, ", ", { term: nunca }], es: ["La experiencia hasta ahora: ", { term: alguna vez }, ", ", { term: nunca }] }
            ex: { examples: [["¿", { target: Has estado }, " en México ", { signal: alguna vez }, "?"], [{ signal: Nunca }, " ", { target: he visto }, " la nieve."]] }
            tr: { en: { examples: [Have you ever been to Mexico?, "I've never seen snow."] } }
          - level: A2
            use: { en: ["Done or not yet done: ", { term: ya }, ", ", { term: todavía no }], es: ["Lo hecho o lo pendiente: ", { term: ya }, ", ", { term: todavía no }] }
            ex: { examples: [[{ signal: Ya }, " ", { target: he comprado }, " el pan."], [{ signal: Todavía no }, " ", { target: he terminado }, "."]] }
            tr: { en: { examples: ["I've already bought the bread.", "I haven't finished yet."] } }
          - level: A2
            variety: es-ES
            use: { en: ["A time that includes now: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: esta semana }, ", ", { term: este año }], es: ["Un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta mañana }, ", ", { term: esta semana }, ", ", { term: este año }] }
            ex: { examples: [[{ signal: Esta mañana }, " ", { target: he ido }, " al médico."], [{ signal: Esta semana }, " ", { target: hemos trabajado }, " mucho."]] }
            tr: { en: { examples: [I went to the doctor this morning., "We've worked a lot this week."] } }
          - { level: A2, use: { en: A situation that goes on up to now, es: Una situación que llega hasta ahora }, ex: [{ signal: Siempre }, " ", { target: he vivido }, " en esta ciudad."], tr: { en: "I've always lived in this city." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A finished time, such as ", { term: ayer }, " or ", { term: el año pasado }, ", takes the preterite in every variety:"]
              es: ["Un tiempo terminado, como ", { term: ayer }, " o ", { term: el año pasado }, ", lleva el indefinido en todas las variedades:"]
            ex: [{ signal: Ayer }, " fui al cine."]
            tr: { en: I went to the cinema yesterday. }
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In Latin America, an action finished earlier today takes the preterite:"
              es: "En Latinoamérica, una acción terminada hoy lleva el indefinido:"
            ex: [{ signal: Esta mañana }, " fui al médico."]
            tr: { en: I went to the doctor this morning. }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Ayer he visto a Juan., right: ["Ayer ", { target: vi }, " a Juan."], rule: { en: [{ term: ayer }, " is a finished time: preterite"], es: [{ term: ayer }, " es un tiempo terminado: indefinido"] } }
          - { level: A2, wrong: He escribido una carta., right: [{ target: He escrito }, " una carta."], rule: { en: ["irregular participle: ", { mapping: [{ term: escribir }, { term: escrito }] }], es: ["participio irregular: ", { mapping: [{ term: escribir }, { term: escrito }] }] } }
          - { level: A2, wrong: Ellas han llegadas., right: ["Ellas ", { target: han llegado }, "."], rule: { en: ["after ", { term: haber }, ", the participle never changes"], es: ["después de ", { term: haber }, ", el participio no cambia"] } }
          - { level: A2, wrong: He lo visto., right: [{ target: Lo he visto }, "."], rule: { en: ["the pronoun goes before ", { term: haber }], es: ["el pronombre va delante de ", { term: haber }] } }
          - { level: A2, wrong: Ha ya llegado., right: ["Ya ", { target: ha llegado }, "."], rule: { en: ["nothing goes between ", { term: haber }, " and the participle"], es: ["nada se pone entre ", { term: haber }, " y el participio"] } }
          - { level: A2, speakers: [en], wrong: Tengo comido., right: [{ target: He comido }, "."], rule: { en: ["the helper is ", { term: haber }, ", not ", { term: tener }] } }
