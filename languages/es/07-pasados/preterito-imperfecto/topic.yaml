sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The imperfect shows the past in its course, with no beginning or end in view."
              es: "El pretérito imperfecto presenta el pasado en su desarrollo, sin mirar su principio ni su final."
              uk: "Імперфект показує минуле в його перебігу, без початку й кінця."
              pt: "O pretérito imperfeito mostra o passado em seu desenvolvimento, sem olhar para o começo nem para o fim."
              fr: "L’imparfait présente le passé dans son déroulement, sans en voir le début ni la fin."
              de: ["Das ", { term: imperfecto }, " zeigt die Vergangenheit im Verlauf, ohne Anfang und Ende in den Blick zu nehmen."]
              it: "L'imperfetto presenta il passato nel suo svolgersi, senza guardare né all'inizio né alla fine."
              pl: ["Czas ", { term: imperfecto }, " pokazuje przeszłość w jej trwaniu, bez patrzenia na początek i koniec."]
              tr: "Imperfecto geçmişi akış hâlinde gösterir; başlangıcına da sonuna da bakmaz."
              id: ["Bentuk ", { term: imperfecto }, " menunjukkan masa lampau saat berlangsung, tanpa melihat awal atau akhirnya."]
              vi: ["Thì ", { term: imperfecto }, " cho thấy quá khứ đang diễn ra, không nhìn tới lúc bắt đầu hay kết thúc."]
            ex: ["Mi madre ", { target: cantaba }, " muy bien."]
            tr: { en: My mother sang very well., uk: "Моя мама дуже гарно співала.", pt: "Minha mãe cantava muito bem.", fr: "Ma mère chantait très bien.", de: "Meine Mutter sang sehr gut.", it: "Mia madre cantava molto bene.", pl: "Moja mama bardzo ładnie śpiewała.", tr: "Annem çok güzel şarkı söylerdi.", id: "Ibu saya bernyanyi dengan sangat baik.", vi: "Mẹ tôi hát rất hay." }
          - type: note
            level: A2
            readers: [en]
            text:
              en: ["English often says ", { l1: used to }, ", ", { l1: would }, " or ", { l1: was doing }, " for it:"]
            ex: ["De niño ", { target: jugaba }, " en la calle."]
            tr: { en: As a child I used to play in the street., uk: "У дитинстві я грався на вулиці." }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українською імперфект найчастіше відповідає недоконаному виду: ", { l1: співала }, ", ", { l1: грався }, ", ", { l1: жив }, ":"]
            ex: [{ signal: De niño }, " ", { target: jugaba }, " en la calle."]
            tr: { uk: "У дитинстві я грався на вулиці." }
          - type: note
            level: A2
            text:
              en: ["Finished events take the preterite; both side by side: ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["Los hechos terminados llevan el indefinido; los dos juntos: ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              uk: ["Завершені події стоять у претериті; обидва часи поруч: ", { link: Претерит чи імперфект, to: es.pasados.indefinido-imperfecto }, "."]
              pt: ["Os fatos terminados levam o pretérito perfeito simples; os dois lado a lado: ", { link: "Perfeito simples ou imperfeito", to: es.pasados.indefinido-imperfecto }, "."]
              fr: ["Les faits terminés se mettent au prétérit ; les deux côte à côte : ", { link: Prétérit ou imparfait, to: es.pasados.indefinido-imperfecto }, "."]
              de: ["Abgeschlossene Ereignisse stehen im ", { term: indefinido }, "; beide im Vergleich: ", { link: Indefinido oder Imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              it: ["I fatti conclusi vogliono l'", { term: indefinido }, "; i due tempi a confronto: ", { link: Indefinido o imperfetto, to: es.pasados.indefinido-imperfecto }, "."]
              pl: ["Zdarzenia zakończone mają ", { term: indefinido }, "; oba czasy obok siebie: ", { link: Indefinido czy imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              tr: ["Tamamlanmış olaylar ", { term: indefinido }, " ile anlatılır; ikisi yan yana: ", { link: "Indefinido mu, imperfecto mu?", to: es.pasados.indefinido-imperfecto }, "."]
              id: ["Peristiwa yang sudah selesai memakai ", { term: indefinido }, "; keduanya berdampingan: ", { link: Indefinido atau imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              vi: ["Sự việc đã kết thúc dùng ", { term: indefinido }, "; hai thì đặt cạnh nhau: ", { link: Indefinido hay imperfecto, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
