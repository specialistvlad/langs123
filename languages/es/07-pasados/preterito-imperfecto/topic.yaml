id: es.pasados.preterito-imperfecto
lang: es
kind: grammar
tags: [verbs, tenses, past, imperfect, description, habits]
concepts: [past-tense, past-habits]
related: [es.pasados.indefinido-imperfecto, es.pasados.preterito-indefinido, es.pasados.mapa-tiempos, es.ser-estar-hay-gustar.hay-esta]
status: { en: draft, es: draft, uk: draft }
translated: { en: "3c6c10 98c055 45d64c 0c39d0 e65fac 808217 10b58e 80d952", uk: "3c6c10 98c055 45d64c 0c39d0 e65fac 808217 10b58e 80d952" }

title: { en: "Imperfect: comía", es: "El pretérito imperfecto: comía", uk: "Імперфект: comía" }
summary:
  lead:
    en: ["The imperfect describes how things were and tells what used to happen: ", { term: hablaba }, ", ", { term: comía }, ", ", { term: vivía }, "."]
    es: ["El pretérito imperfecto describe cómo eran las cosas y cuenta lo que pasaba habitualmente: ", { term: hablaba }, ", ", { term: comía }, ", ", { term: vivía }, "."]
    uk: ["Імперфект описує, якими були речі, і розповідає, що зазвичай відбувалося: ", { term: hablaba }, ", ", { term: comía }, ", ", { term: vivía }, "."]
  rule:
    en: ["Only three verbs are irregular: ", { term: ser }, ", ", { term: ir }, " and ", { term: ver }, ":"]
    es: ["Solo tres verbos son irregulares: ", { term: ser }, ", ", { term: ir }, " y ", { term: ver }, ":"]
    uk: ["Неправильних дієслів лише три: ", { term: ser }, ", ", { term: ir }, " і ", { term: ver }, ":"]
  ex: { examples: [["Mi abuela ", { target: era }, " alta."], ["Los domingos ", { target: íbamos }, " al río."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: hablar }, ": ", { alternatives: [{ term: hablaba }, { term: hablabas }, { term: hablaba }, { term: hablábamos }, { term: hablaban }] }]
            es: [{ term: hablar }, ": ", { alternatives: [{ term: hablaba }, { term: hablabas }, { term: hablaba }, { term: hablábamos }, { term: hablaban }] }]
            uk: [{ term: hablar }, ": ", { alternatives: [{ term: hablaba }, { term: hablabas }, { term: hablaba }, { term: hablábamos }, { term: hablaban }] }]
          ex: ["Antes ", { target: trabajaba }, " en un banco."]
          tr: { en: I used to work in a bank., uk: "Раніше я працював у банку." }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comía }, { term: comías }, { term: comía }, { term: comíamos }, { term: comían }] }]
            es: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comía }, { term: comías }, { term: comía }, { term: comíamos }, { term: comían }] }]
            uk: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comía }, { term: comías }, { term: comía }, { term: comíamos }, { term: comían }] }]
          ex: ["De niña ", { target: vivía }, " en el campo."]
          tr: { en: As a child I lived in the countryside., uk: "У дитинстві я жила в селі." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: hablabais }, { term: comíais }, { term: vivíais }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: hablabais }, { term: comíais }, { term: vivíais }] }]
            uk: [{ term: vosotros }, ": ", { alternatives: [{ term: hablabais }, { term: comíais }, { term: vivíais }] }]
          ex: ["¿Dónde ", { target: vivíais }, " antes?"]
          tr: { en: Where did you live before?, uk: "Де ви раніше жили?" }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["irregular: ", { mapping: [{ term: ser }, { term: era }] }, ", ", { mapping: [{ term: ir }, { term: iba }] }, ", ", { mapping: [{ term: ver }, { term: veía }] }]
            es: ["irregulares: ", { mapping: [{ term: ser }, { term: era }] }, ", ", { mapping: [{ term: ir }, { term: iba }] }, ", ", { mapping: [{ term: ver }, { term: veía }] }]
            uk: ["неправильні: ", { mapping: [{ term: ser }, { term: era }] }, ", ", { mapping: [{ term: ir }, { term: iba }] }, ", ", { mapping: [{ term: ver }, { term: veía }] }]
          ex: ["La casa ", { target: era }, " pequeña."]
          tr: { en: The house was small., uk: "Будинок був маленький." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "a description of people, things, places and time"
            es: "la descripción de personas, cosas, lugares y tiempo"
            uk: "опис людей, речей, місць і часу"
          ex: ["Mi abuelo ", { target: tenía }, " una casa grande."]
          tr: { en: My grandfather had a big house., uk: "У мого дідуся був великий будинок." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "a habit in the past"
            es: "un hábito en el pasado"
            uk: "звичка в минулому"
          ex: [{ signal: Todos los días }, " ", { target: iba }, " al colegio en bus."]
          tr: { en: I went to school by bus every day., uk: "Щодня я їздив до школи автобусом." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "an action in progress when something else happened"
            es: "una acción en curso cuando pasó otra cosa"
            uk: "дія в процесі, коли сталося щось інше"
          ex: ["Cuando llegué, ", { target: llovía }, "."]
          tr: { en: "When I arrived, it was raining.", uk: "Коли я прийшов, ішов дощ." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: ["a polite request with ", { term: quería }]
            es: ["una petición cortés con ", { term: quería }]
            uk: ["ввічливе прохання з ", { term: quería }]
          ex: [{ target: Quería }, " un café, por favor."]
          tr: { en: "I'd like a coffee, please.", uk: "Мені, будь ласка, каву." }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ mapping: [{ term: hay }, { term: había }] }, ", singular for every number"]
            es: [{ mapping: [{ term: hay }, { term: había }] }, ", en singular para todo número"]
            uk: [{ mapping: [{ term: hay }, { term: había }] }, ", однина для будь-якої кількості"]
          ex: [{ target: Había }, " muchos niños."]
          tr: { en: There were a lot of children., uk: "Там було багато дітей." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["yo and él share one form: ", { term: yo trabajaba }, ", ", { term: él trabajaba }]
            es: ["yo y él comparten la forma: ", { term: yo trabajaba }, ", ", { term: él trabajaba }]
            uk: ["yo та él мають одну форму: ", { term: yo trabajaba }, ", ", { term: él trabajaba }]
          ex: ["Ella ", { target: cocinaba }, " y yo ", { target: limpiaba }, "."]
          tr: { en: She did the cooking and I did the cleaning., uk: "Вона готувала, а я прибирав." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["every ", { ending: ía }, " form and ", { term: hablábamos }, " carry an accent"]
            es: ["todas las formas en ", { ending: ía }, " y ", { term: hablábamos }, " llevan tilde"]
            uk: ["усі форми на ", { ending: ía }, " і ", { term: hablábamos }, " мають графічний наголос"]
          ex: ["Siempre ", { target: hablábamos }, " en inglés."]
          tr: { en: We always spoke English., uk: "Ми завжди говорили англійською." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The imperfect shows the past in its course, with no beginning or end in view."
              es: "El pretérito imperfecto presenta el pasado en su desarrollo, sin mirar su principio ni su final."
              uk: "Імперфект показує минуле в його перебігу, не бачачи ні початку, ні кінця."
            ex: ["Mi madre ", { target: cantaba }, " muy bien."]
            tr: { en: My mother sang very well., uk: "Моя мама дуже гарно співала." }
          - type: note
            level: A2
            readers: [en]
            text:
              en: ["English often says ", { l1: used to }, ", ", { l1: would }, " or ", { l1: was doing }, " for it:"]
            ex: ["De niño ", { target: jugaba }, " en la calle."]
            tr: { en: As a child I used to play in the street., uk: "У дитинстві я грався на вулиці." }
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Українською імперфект найчастіше відповідає недоконаному виду: ", { l1: співала }, ", ", { l1: грався }, ", ", { l1: жив }, ":"]
            ex: [{ signal: De niño }, " ", { target: jugaba }, " en la calle."]
            tr: { uk: "У дитинстві я грався на вулиці." }
          - type: note
            level: A2
            text:
              en: ["Finished events take the preterite; both side by side: ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["Los hechos terminados llevan el indefinido; los dos juntos: ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              uk: ["Завершені події стоять у простому минулому; обидва часи поруч: ", { link: Простий минулий чи імперфект, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова" }
    role: form
    features: { tense: pst, aspect: ipfv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, ar: { target: [habl, { ending: aba }] }, er: { target: [com, { ending: ía }] }, ir: { target: [viv, { ending: ía }] } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: { target: [habl, { ending: abas }] }, er: { target: [com, { ending: ías }] }, ir: { target: [viv, { ending: ías }] } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: { target: [habl, { ending: aba }] }, er: { target: [com, { ending: ía }] }, ir: { target: [viv, { ending: ía }] } }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: { target: [habl, { ending: ábamos }] }, er: { target: [com, { ending: íamos }] }, ir: { target: [viv, { ending: íamos }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: [habl, { ending: abais }] }, er: { target: [com, { ending: íais }] }, ir: { target: [viv, { ending: íais }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: { target: [habl, { ending: aban }] }, er: { target: [com, { ending: ían }] }, ir: { target: [viv, { ending: ían }] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: -ar }, " take ", { ending: aba }, "; verbs in ", { term: -er }, " and ", { term: -ir }, " take ", { ending: ía }, "."]
              es: ["Los verbos en ", { term: -ar }, " llevan ", { ending: aba }, "; los verbos en ", { term: -er }, " y en ", { term: -ir }, " llevan ", { ending: ía }, "."]
              uk: ["Дієслова на ", { term: -ar }, " мають ", { ending: aba }, "; дієслова на ", { term: -er }, " і ", { term: -ir }, " — ", { ending: ía }, "."]
          - type: rule
            level: A2
            text:
              en: "Yo and él share one form, so a subject or the context shows who it is:"
              es: "Yo y él comparten la forma, así que el sujeto o el contexto indica quién es:"
              uk: "yo та él мають одну форму, тож хто це, показує підмет або контекст:"
            ex: { examples: [["Yo ", { target: trabajaba }, " de noche."], ["Él ", { target: trabajaba }, " de día."]] }
            tr: { en: { examples: [I worked nights., He worked days.] }, uk: { examples: ["Я працював уночі.", "Він працював удень."] } }
          - type: rule
            level: A2
            text:
              en: ["The nosotros form of ", { term: -ar }, " verbs and every form in ", { ending: ía }, " carry a written accent:"]
              es: ["La forma de nosotros de los verbos en ", { term: -ar }, " y todas las formas en ", { ending: ía }, " llevan tilde:"]
              uk: ["Форма nosotros дієслів на ", { term: -ar }, " і всі форми на ", { ending: ía }, " мають графічний наголос:"]
            ex: { examples: [["Siempre ", { target: hablábamos }, " en inglés."], [{ target: Vivíamos }, " cerca del mar."]] }
            tr: { en: { examples: [We always spoke English., We lived near the sea.] }, uk: { examples: ["Ми завжди говорили англійською.", "Ми жили біля моря."] } }

  - title: { en: "Form: ser, ir, ver and había", es: "Forma: ser, ir, ver y había", uk: "Форма: ser, ir, ver і había" }
    role: form
    features: { tense: pst, aspect: ipfv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: ser, label: ser }
          - { key: ir, label: ir }
          - { key: ver, label: ver }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, ser: { target: era }, ir: { target: iba }, ver: { target: veía } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, ser: { target: eras }, ir: { target: ibas }, ver: { target: veías } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ser: { target: era }, ir: { target: iba }, ver: { target: veía } }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ser: { target: éramos }, ir: { target: íbamos }, ver: { target: veíamos } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ser: { target: erais }, ir: { target: ibais }, ver: { target: veíais } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ser: { target: eran }, ir: { target: iban }, ver: { target: veían } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Every other verb is regular in the imperfect, ", { term: tener }, " and ", { term: hacer }, " included:"]
              es: ["Todos los demás verbos son regulares en imperfecto, también ", { term: tener }, " y ", { term: hacer }, ":"]
              uk: ["Усі інші дієслова в імперфекті правильні, ", { term: tener }, " і ", { term: hacer }, " теж:"]
            ex: ["De pequeño ", { target: tenía }, " un perro."]
            tr: { en: As a child I had a dog., uk: "У дитинстві в мене був собака." }
          - type: rule
            level: A2
            text:
              en: [{ mapping: [{ term: hay }, { term: había }] }, ": one singular form, for one thing or many:"]
              es: [{ mapping: [{ term: hay }, { term: había }] }, ": una sola forma en singular, para una cosa o para muchas:"]
              uk: [{ mapping: [{ term: hay }, { term: había }] }, ": одна форма однини і для однієї речі, і для багатьох:"]
            ex: { examples: [[{ target: Había }, " un parque."], [{ target: Había }, " muchos niños."]] }
            tr: { en: { examples: [There was a park., There were a lot of children.] }, uk: { examples: ["Там був парк.", "Там було багато дітей."] } }

  - title: { en: Use, es: Uso, uk: "Вживання" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, use: { en: "Description of people, things and places", es: "La descripción de personas, cosas y lugares", uk: "Опис людей, речей і місць" }, ex: ["La casa ", { target: era }, " grande y ", { target: tenía }, " jardín."], tr: { en: The house was big and had a garden., uk: "Будинок був великий і мав сад." } }
          - level: A2
            use: { en: The time and age in the past, es: La hora y la edad en el pasado, uk: "Час і вік у минулому" }
            ex: { examples: [[{ target: Eran }, " las ocho."], ["Cuando ", { target: tenía }, " diez años, ", { target: vivía }, " en Lima."]] }
            tr: { en: { examples: ["It was eight o'clock.", "When I was ten, I lived in Lima."] }, uk: { examples: ["Була восьма година.", "Коли мені було десять років, я жив у Лімі."] } }
          - { level: A2, use: { en: A habit in the past, es: Un hábito en el pasado, uk: "Звичка в минулому" }, ex: [{ signal: Todos los veranos }, " ", { target: íbamos }, " a la playa."], tr: { en: We went to the beach every summer., uk: "Щоліта ми їздили на пляж." } }
          - { level: B1, use: { en: An action in progress when something else happened, es: Una acción en curso cuando pasó otra cosa, uk: "Дія в процесі, коли сталося щось інше" }, ex: ["Cuando llegué, ", { target: llovía }, "."], tr: { en: "When I arrived, it was raining.", uk: "Коли я прийшов, ішов дощ." } }
          - { level: B1, use: { en: Two actions in progress at the same time, es: Dos acciones en curso al mismo tiempo, uk: "Дві дії в процесі одночасно" }, ex: [{ signal: Mientras }, " yo ", { target: cocinaba }, ", él ", { target: leía }, "."], tr: { en: "While I was cooking, he was reading.", uk: "Поки я готував, він читав." } }
          - { level: B1, use: { en: "A polite request, softer than the present", es: "Una petición cortés, más suave que el presente", uk: "Ввічливе прохання, м’якше за теперішній час" }, ex: [{ target: Quería }, " un café, por favor."], tr: { en: "I'd like a coffee, please.", uk: "Мені, будь ласка, каву." } }

  - title: { en: Signal words, es: Palabras clave, uk: "Слова-маркери" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: marker, label: { en: Time word, es: Expresión de tiempo, uk: "Слово-маркер" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, marker: "antes, de niño, de pequeña, cuando era joven", ex: [{ signal: De pequeña }, " ", { target: jugaba }, " al fútbol."], tr: { en: As a little girl I played football., uk: "Малою я грала у футбол." } }
          - { level: A2, marker: "siempre, todos los días, normalmente", ex: [{ signal: Normalmente }, " ", { target: cenábamos }, " a las nueve."], tr: { en: We usually had dinner at nine., uk: "Зазвичай ми вечеряли о дев’ятій." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: La casa fue grande y tuvo jardín., right: ["La casa ", { target: era }, " grande y ", { target: tenía }, " jardín."], rule: { en: "a description in the past takes the imperfect", es: "la descripción en el pasado lleva el imperfecto", uk: "опис у минулому вимагає імперфекта" } }
          - { level: A2, wrong: Yo iva al colegio., right: ["Yo ", { target: iba }, " al colegio."], rule: { en: [{ term: iba }, " is written with ", { letter: b }], es: [{ term: iba }, " se escribe con ", { letter: b }], uk: [{ term: iba }, " пишеться з ", { letter: b }] } }
          - { level: A2, wrong: Nosotros hablabamos mucho., right: ["Nosotros ", { target: hablábamos }, " mucho."], rule: { en: [{ term: hablábamos }, " carries an accent"], es: [{ term: hablábamos }, " lleva tilde"], uk: [{ term: hablábamos }, " має графічний наголос"] } }
          - { level: A2, wrong: Habían muchos niños., right: [{ target: Había }, " muchos niños."], rule: { en: [{ term: había }, " stays singular"], es: [{ term: había }, " va siempre en singular"], uk: [{ term: había }, " лишається в однині"] } }
          - { level: A2, speakers: [en], wrong: Yo usaba jugar al tenis., right: ["Yo ", { target: jugaba }, " al tenis."], rule: { en: ["English ", { l1: used to }, " is the imperfect: ", { term: jugaba }] } }
          - { level: A2, speakers: [en], wrong: "De niño, estaba jugando al fútbol cada día.", right: ["De niño, ", { target: jugaba }, " al fútbol cada día."], rule: { en: ["a past habit takes the plain imperfect: ", { term: jugaba }] } }
