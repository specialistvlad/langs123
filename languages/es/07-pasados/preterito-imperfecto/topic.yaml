          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: { target: [habl, { ending: ábamos }] }, er: { target: [com, { ending: íamos }] }, ir: { target: [viv, { ending: íamos }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: [habl, { ending: abais }] }, er: { target: [com, { ending: íais }] }, ir: { target: [viv, { ending: íais }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: { target: [habl, { ending: aban }] }, er: { target: [com, { ending: ían }] }, ir: { target: [viv, { ending: ían }] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: -ar }, " take ", { ending: aba }, "; verbs in ", { term: -er }, " and ", { term: -ir }, " take ", { ending: ía }, "."]
              es: ["Los verbos en ", { term: -ar }, " llevan ", { ending: aba }, "; los verbos en ", { term: -er }, " y en ", { term: -ir }, " llevan ", { ending: ía }, "."]
              uk: ["Дієслова на ", { term: -ar }, " мають ", { ending: aba }, "; дієслова на ", { term: -er }, " і ", { term: -ir }, " — ", { ending: ía }, "."]
              pt: ["Os verbos em ", { term: -ar }, " levam ", { ending: aba }, "; os verbos em ", { term: -er }, " e ", { term: -ir }, " levam ", { ending: ía }, "."]
              fr: ["Les verbes en ", { term: -ar }, " prennent ", { ending: aba }, " ; les verbes en ", { term: -er }, " et ", { term: -ir }, " prennent ", { ending: ía }, "."]
              de: ["Verben auf ", { term: -ar }, " bekommen ", { ending: aba }, "; Verben auf ", { term: -er }, " und ", { term: -ir }, " bekommen ", { ending: ía }, "."]
              it: ["I verbi in ", { term: -ar }, " prendono ", { ending: aba }, "; i verbi in ", { term: -er }, " e ", { term: -ir }, " prendono ", { ending: ía }, "."]
              pl: ["Czasowniki na ", { term: -ar }, " mają ", { ending: aba }, ", a czasowniki na ", { term: -er }, " i ", { term: -ir }, " mają ", { ending: ía }, "."]
              tr: [{ term: -ar }, " ile biten fiiller ", { ending: aba }, ", ", { term: -er }, " ve ", { term: -ir }, " ile biten fiiller ", { ending: ía }, " alır."]
              id: ["Kata kerja berakhiran ", { term: -ar }, " memakai ", { ending: aba }, "; kata kerja berakhiran ", { term: -er }, " dan ", { term: -ir }, " memakai ", { ending: ía }, "."]
              vi: ["Động từ đuôi ", { term: -ar }, " thêm ", { ending: aba }, "; động từ đuôi ", { term: -er }, " và ", { term: -ir }, " thêm ", { ending: ía }, "."]
          - type: rule
            level: A2
            text:
              en: "Yo and él share one form, so a subject or the context shows who it is:"
              es: "Yo y él comparten la forma, así que el sujeto o el contexto indica quién es:"
              uk: "yo та él мають одну форму, тож хто це, показує підмет або контекст:"
              pt: "Yo e él têm a mesma forma; o sujeito ou o contexto indica quem é:"
              fr: "Yo et él ont la même forme ; le sujet ou le contexte indique de qui il s’agit :"
              de: "Yo und él haben dieselbe Form; das Subjekt oder der Kontext zeigt, wer gemeint ist:"
              it: "Yo e él hanno la stessa forma; il soggetto o il contesto indica chi è:"
              pl: "Yo i él mają tę samą formę, więc o kogo chodzi, pokazuje podmiot albo kontekst:"
              tr: "Yo ve él aynı biçimi paylaşır; kimin olduğunu özne ya da bağlam gösterir:"
              id: "Yo dan él memakai bentuk yang sama, jadi subjek atau konteks menunjukkan siapa pelakunya:"
              vi: "Yo và él dùng chung một dạng, nên chủ ngữ hoặc ngữ cảnh cho biết đó là ai:"
            ex: { examples: [["Yo ", { target: trabajaba }, " de noche."], ["Él ", { target: trabajaba }, " de día."]] }
            tr: { en: { examples: [I worked nights., He worked days.] }, uk: { examples: ["Я працював уночі.", "Він працював удень."] }, pt: { examples: ["Eu trabalhava à noite.", "Ele trabalhava de dia."] }, fr: { examples: ["Je travaillais de nuit.", "Il travaillait de jour."] }, de: { examples: ["Ich arbeitete nachts.", "Er arbeitete tagsüber."] }, it: { examples: ["Io lavoravo di notte.", "Lui lavorava di giorno."] }, pl: { examples: ["Ja pracowałem w nocy.", "On pracował w dzień."] }, tr: { examples: ["Ben geceleri çalışırdım.", "O gündüzleri çalışırdı."] }, id: { examples: ["Saya bekerja pada malam hari.", "Dia bekerja pada siang hari."] }, vi: { examples: ["Tôi làm việc ban đêm.", "Anh ấy làm việc ban ngày."] } }
          - type: rule
            level: A2
            text:
              en: ["The nosotros form of ", { term: -ar }, " verbs and every form in ", { ending: ía }, " carry a written accent:"]
              es: ["La forma de nosotros de los verbos en ", { term: -ar }, " y todas las formas en ", { ending: ía }, " llevan tilde:"]
              uk: ["Форма nosotros дієслів на ", { term: -ar }, " і всі форми на ", { ending: ía }, " мають знак наголосу:"]
              pt: ["A forma de nosotros dos verbos em ", { term: -ar }, " e todas as formas em ", { ending: ía }, " levam acento gráfico:"]
              fr: ["La forme nosotros des verbes en ", { term: -ar }, " et toutes les formes en ", { ending: ía }, " portent un accent écrit :"]
              de: ["Die nosotros-Form der Verben auf ", { term: -ar }, " und alle Formen auf ", { ending: ía }, " tragen einen Akzent:"]
              it: ["La forma nosotros dei verbi in ", { term: -ar }, " e tutte le forme in ", { ending: ía }, " hanno l'accento scritto:"]
              pl: ["Forma nosotros czasowników na ", { term: -ar }, " i wszystkie formy na ", { ending: ía }, " mają akcent pisany:"]
              tr: [{ term: -ar }, " ile biten fiillerin nosotros biçimi ve ", { ending: ía }, " ile biten tüm biçimler yazıda vurgu işareti taşır:"]
              id: ["Bentuk nosotros dari kata kerja ", { term: -ar }, " dan semua bentuk ", { ending: ía }, " memakai tanda aksen tertulis:"]
              vi: ["Dạng nosotros của động từ ", { term: -ar }, " và mọi dạng ", { ending: ía }, " đều có dấu sắc:"]
            ex: { examples: [["Siempre ", { target: hablábamos }, " en inglés."], [{ target: Vivíamos }, " cerca del mar."]] }
            tr: { en: { examples: [We always spoke English., We lived near the sea.] }, uk: { examples: ["Ми завжди говорили англійською.", "Ми жили біля моря."] }, pt: { examples: ["Nós sempre falávamos em inglês.", "Nós morávamos perto do mar."] }, fr: { examples: ["Nous parlions toujours anglais.", "Nous habitions près de la mer."] }, de: { examples: ["Wir sprachen immer Englisch.", "Wir wohnten in der Nähe des Meeres."] }, it: { examples: ["Parlavamo sempre in inglese.", "Vivevamo vicino al mare."] }, pl: { examples: ["Zawsze rozmawialiśmy po angielsku.", "Mieszkaliśmy blisko morza."] }, tr: { examples: ["Hep İngilizce konuşurduk.", "Denize yakın yaşardık."] }, id: { examples: ["Kami selalu berbicara dalam bahasa Inggris.", "Kami tinggal dekat laut."] }, vi: { examples: ["Chúng tôi luôn nói tiếng Anh.", "Chúng tôi sống gần biển."] } }

