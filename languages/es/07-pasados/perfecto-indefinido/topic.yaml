title: { en: Present Perfect or Preterite, es: Perfecto o indefinido, uk: "Перфект чи претерит", pt: "Perfeito composto ou perfeito simples", fr: "Passé composé ou prétérit", de: "Perfecto oder Indefinido", it: "Perfecto o indefinido", pl: "Perfecto czy indefinido", tr: "Perfecto mu, indefinido mu?", id: "Perfecto atau indefinido", vi: "Hiện tại hoàn thành hay indefinido" }
summary:
  lead:
    en: ["A finished time takes the preterite and experience the perfect; Spain also says ", { term: hoy he comido }, " where most of Latin America says ", { term: hoy comí }, "."]
    es: ["Un tiempo terminado lleva el indefinido y la experiencia, el perfecto; España dice ", { term: hoy he comido }, " donde la mayor parte de Latinoamérica dice ", { term: hoy comí }, "."]
    uk: ["Завершений час вимагає претериту, а досвід — перфекта; в Іспанії також кажуть ", { term: hoy he comido }, " там, де більша частина Латинської Америки каже ", { term: hoy comí }, "."]
    pt: ["Um tempo terminado pede o perfeito simples, e a experiência, o composto; a Espanha diz ", { term: hoy he comido }, " onde boa parte da América Latina diz ", { term: hoy comí }, "."]
    fr: ["Un temps révolu appelle le prétérit, l’expérience le passé composé ; l’Espagne dit ", { term: hoy he comido }, " là où la plupart de l’Amérique latine dit ", { term: hoy comí }, "."]
    de: ["Eine abgeschlossene Zeit verlangt das Indefinido, die Erfahrung das Perfecto; Spanien sagt auch ", { term: hoy he comido }, ", wo der Großteil Lateinamerikas ", { term: hoy comí }, " sagt."]
    it: ["Un tempo concluso vuole l'indefinido, l'esperienza il perfecto; la Spagna dice anche ", { term: hoy he comido }, " dove gran parte dell'America Latina dice ", { term: hoy comí }, "."]
    pl: ["Czas zakończony wymaga indefinido, a doświadczenie — perfecto; Hiszpania mówi też ", { term: hoy he comido }, ", gdzie większość Ameryki Łacińskiej mówi ", { term: hoy comí }, "."]
    tr: ["Bitmiş zaman indefinido, deneyim perfecto ister; İspanya ", { term: hoy he comido }, " der, Latin Amerika'nın çoğu ise ", { term: hoy comí }, " der."]
    id: ["Waktu yang sudah lewat memakai indefinido, pengalaman memakai perfecto; Spanyol berkata ", { term: hoy he comido }, ", sebagian besar Amerika Latin ", { term: hoy comí }, "."]
    vi: ["Thời gian đã qua dùng indefinido, kinh nghiệm dùng hiện tại hoàn thành; Tây Ban Nha còn nói ", { term: hoy he comido }, " ở chỗ phần lớn châu Mỹ Latinh nói ", { term: hoy comí }, "."]
  rule:
    en: ["A finished time, such as ", { term: ayer }, ", takes the preterite everywhere:"]
    es: ["Un tiempo terminado, como ", { term: ayer }, ", lleva el indefinido en todas partes:"]
    uk: ["Завершений час, як-от ", { term: ayer }, ", скрізь вимагає претериту:"]
    pt: ["Um tempo terminado, como ", { term: ayer }, ", leva o perfeito simples em todo lugar:"]
    fr: ["Un temps révolu, comme ", { term: ayer }, ", se met au prétérit partout :"]
    de: ["Eine abgeschlossene Zeit wie ", { term: ayer }, " steht überall im Indefinido:"]
    it: ["Un tempo concluso, come ", { term: ayer }, ", va all'indefinido ovunque:"]
    pl: ["Czas zakończony, taki jak ", { term: ayer }, ", wymaga wszędzie indefinido:"]
    tr: ["Bitmiş bir zaman, ", { term: ayer }, " gibi, her yerde indefinido ile söylenir:"]
    id: ["Waktu yang sudah lewat, seperti ", { term: ayer }, ", di mana pun memakai indefinido:"]
    vi: ["Thời gian đã kết thúc, như ", { term: ayer }, ", ở đâu cũng dùng indefinido:"]
  ex: ["Ayer ", { target: comí }, " paella."]

