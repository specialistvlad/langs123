          tr: { en: I saw Juan yesterday., uk: "Учора я бачив Хуана.", pt: "Ontem vi o Juan.", fr: "Hier, j’ai vu Juan.", de: "Gestern habe ich Juan gesehen.", it: "Ieri ho visto Juan.", pl: "Wczoraj widziałem Juana.", tr: "Dün Juan'ı gördüm.", id: "Kemarin saya bertemu Juan.", vi: "Hôm qua tôi đã gặp Juan." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The preterite looks at a time that is over; the perfect looks at a time that reaches up to now."
              es: "El indefinido mira un tiempo ya terminado; el perfecto mira un tiempo que llega hasta ahora."
              uk: "Претерит стосується часу, що вже минув; перфект — часу, що триває аж до тепер."
              pt: "O perfeito simples olha para um tempo que já acabou; o perfeito composto olha para um tempo que chega até agora."
              fr: "Le prétérit regarde un temps révolu ; le passé composé regarde un temps qui va jusqu’à maintenant."
              de: "Das Indefinido blickt auf eine Zeit, die vorbei ist; das Perfecto blickt auf eine Zeit, die bis jetzt reicht."
              it: "L'indefinido guarda un tempo ormai finito; il perfecto guarda un tempo che arriva fino a ora."
              pl: "Indefinido patrzy na czas, który się skończył; perfecto patrzy na czas sięgający do teraz."
              tr: "Indefinido bitmiş bir zamana bakar; perfecto şimdiye kadar uzanan bir zamana bakar."
              id: "Indefinido melihat waktu yang sudah berakhir; perfecto melihat waktu yang terentang sampai sekarang."
              vi: "Indefinido nhìn vào khoảng thời gian đã qua; hiện tại hoàn thành nhìn vào khoảng thời gian kéo dài đến nay."
            ex: { examples: [["En ", { date: "2019", value: "2019" }, " ", { target: fui }, " a Cuba."], ["¿", { target: Has ido }, " alguna vez a Cuba?"]] }
            tr: { en: { examples: [I went to Cuba in 2019., Have you ever been to Cuba?] }, uk: { examples: ["У 2019 році я їздив на Кубу.", "Ти колись бував на Кубі?"] }, pt: { examples: ["Em 2019 fui a Cuba.", "Você já esteve em Cuba alguma vez?"] }, fr: { examples: ["En 2019, je suis allé à Cuba.", "Es-tu déjà allé à Cuba ?"] }, de: { examples: ["2019 bin ich nach Kuba gereist.", "Warst du schon einmal auf Kuba?"] }, it: { examples: ["Nel 2019 sono andato a Cuba.", "Sei mai stato a Cuba?"] }, pl: { examples: ["W 2019 roku pojechałem na Kubę.", "Czy byłeś kiedyś na Kubie?"] }, tr: { examples: ["2019'da Küba'ya gittim.", "Hiç Küba'ya gittin mi?"] }, id: { examples: ["Pada tahun 2019 saya pergi ke Kuba.", "Apakah kamu pernah ke Kuba?"] }, vi: { examples: ["Năm 2019 tôi đã đi Cuba.", "Bạn đã bao giờ đến Cuba chưa?"] } }
          - type: note
            level: A2
            text:
              en: ["Grammars also call them ", { term: pretérito perfecto simple }, " and ", { term: pretérito perfecto compuesto }, "."]
              es: ["Las gramáticas también los llaman ", { term: pretérito perfecto simple }, " y ", { term: pretérito perfecto compuesto }, "."]
              uk: ["Граматики називають їх також ", { term: pretérito perfecto simple }, " і ", { term: pretérito perfecto compuesto }, "."]
              pt: ["As gramáticas também os chamam de ", { term: pretérito perfecto simple }, " e ", { term: pretérito perfecto compuesto }, "."]
              fr: ["Les grammaires les appellent aussi ", { term: pretérito perfecto simple }, " et ", { term: pretérito perfecto compuesto }, "."]
              de: ["Grammatiken nennen sie auch ", { term: pretérito perfecto simple }, " und ", { term: pretérito perfecto compuesto }, "."]
              it: ["Le grammatiche li chiamano anche ", { term: pretérito perfecto simple }, " e ", { term: pretérito perfecto compuesto }, "."]
              pl: ["Gramatyki nazywają je także ", { term: pretérito perfecto simple }, " i ", { term: pretérito perfecto compuesto }, "."]
              tr: ["Dilbilgisi kitapları bunlara ", { term: pretérito perfecto simple }, " ve ", { term: pretérito perfecto compuesto }, " adlarını da verir."]
              id: ["Buku tata bahasa juga menyebutnya ", { term: pretérito perfecto simple }, " dan ", { term: pretérito perfecto compuesto }, "."]
              vi: ["Các sách ngữ pháp còn gọi chúng là ", { term: pretérito perfecto simple }, " và ", { term: pretérito perfecto compuesto }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, the preterite tells most finished actions, today's included, and the perfect keeps experience and situations up to now; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for today, as Spain does."
              es: "En la mayor parte de Latinoamérica, el indefinido cuenta casi todas las acciones terminadas, también las de hoy, y el perfecto queda para la experiencia y las situaciones hasta ahora; el español andino (Perú, Bolivia, la sierra de Ecuador) usa el perfecto para hoy, como en España."
              uk: "У більшій частині Латинської Америки претерит передає більшість завершених дій, сьогоднішні теж, а перфект залишається для досвіду й ситуацій, що тривають аж до тепер; андська іспанська (Перу, Болівія, гірський Еквадор) уживає для сьогоднішнього перфект, як в Іспанії."
              pt: "Na maior parte da América Latina, o perfeito simples conta quase todas as ações terminadas, inclusive as de hoje, e o perfeito composto fica para a experiência e as situações até agora; o espanhol andino (Peru, Bolívia, serra do Equador) usa o perfeito composto para hoje, como na Espanha."
              fr: "Dans la plus grande partie de l’Amérique latine, le prétérit raconte presque toutes les actions terminées, celles d’aujourd’hui comprises, et le passé composé reste pour l’expérience et les situations jusqu’à maintenant ; l’espagnol andin (Pérou, Bolivie, hautes terres de l’Équateur) emploie le passé composé pour aujourd’hui, comme l’Espagne."
              de: "In den meisten Teilen Lateinamerikas erzählt das Indefinido fast alle abgeschlossenen Handlungen, auch die von heute, und das Perfecto bleibt für Erfahrungen und Situationen bis jetzt; das Andenspanisch (Peru, Bolivien, Hochland von Ecuador) nimmt für heute das Perfecto, wie Spanien."
              it: "Nella maggior parte dell'America Latina l'indefinido racconta quasi tutte le azioni concluse, comprese quelle di oggi, e il perfecto resta per l'esperienza e le situazioni fino a ora; lo spagnolo andino (Perù, Bolivia, altopiano dell'Ecuador) usa il perfecto per oggi, come la Spagna."
              pl: "W większości Ameryki Łacińskiej indefinido opowiada o prawie wszystkich czynnościach zakończonych, także dzisiejszych, a perfecto zostaje dla doświadczenia i sytuacji trwających do teraz; hiszpański andyjski (Peru, Boliwia, wyżyny Ekwadoru) używa perfecto dla dzisiejszego dnia, tak jak Hiszpania."
              tr: "Latin Amerika'nın çoğunda indefinido, bugünküler dahil bitmiş eylemlerin neredeyse tümünü anlatır; perfecto ise şimdiye kadarki deneyim ve durumlara kalır. And İspanyolcası'nda (Peru, Bolivya, Ekvador'un dağlık bölgesi) bugün için İspanya'daki gibi perfecto kullanılır."
              id: "Di sebagian besar Amerika Latin, indefinido menceritakan hampir semua tindakan yang sudah selesai, termasuk yang terjadi hari ini, sedangkan perfecto dipakai untuk pengalaman dan situasi sampai sekarang; bahasa Spanyol Andes (Peru, Bolivia, dataran tinggi Ekuador) memakai perfecto untuk hari ini, seperti di Spanyol."
              vi: "Ở phần lớn châu Mỹ Latinh, indefinido kể hầu hết các hành động đã xong, kể cả của hôm nay, còn hiện tại hoàn thành dành cho kinh nghiệm và các tình huống kéo dài đến nay; tiếng Tây Ban Nha vùng Andes (Peru, Bolivia, cao nguyên Ecuador) dùng hiện tại hoàn thành cho hôm nay, như ở Tây Ban Nha."
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["In Spain, the perfect also tells any action in a time that includes now: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              es: ["En España, el perfecto también cuenta cualquier acción en un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              uk: ["В Іспанії перфект передає також будь-яку дію в часі, що охоплює теперішнє: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              pt: ["Na Espanha, o perfeito composto também conta qualquer ação em um tempo que inclui o presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              fr: ["En Espagne, le passé composé raconte aussi toute action dans une période qui inclut le présent : ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              de: ["In Spanien erzählt das Perfecto auch jede Handlung in einer Zeit, die das Jetzt einschließt: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              it: ["In Spagna il perfecto racconta anche qualsiasi azione in un periodo che comprende il presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              pl: ["W Hiszpanii perfecto opowiada też o każdej czynności w czasie obejmującym teraźniejszość: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              tr: ["İspanya'da perfecto, şimdiyi de içine alan bir zamandaki her eylemi de anlatır: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              id: ["Di Spanyol, perfecto juga menceritakan tindakan apa pun dalam waktu yang mencakup saat ini: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              vi: ["Ở Tây Ban Nha, hiện tại hoàn thành còn kể mọi hành động trong khoảng thời gian bao gồm hiện tại: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
          - type: note
            level: B1
            variety: es-ES
            text:
              en: "In the Canary Islands and parts of northern Spain, speakers choose the preterite, as in Latin America."
              es: "En Canarias y en parte del norte de España, se elige el indefinido, como en Latinoamérica."
              uk: "На Канарських островах і в частині півночі Іспанії мовці обирають претерит, як у Латинській Америці."
              pt: "Nas Ilhas Canárias e em parte do norte da Espanha, os falantes escolhem o perfeito simples, como na América Latina."
              fr: "Aux îles Canaries et dans une partie du nord de l’Espagne, les locuteurs choisissent le prétérit, comme en Amérique latine."
              de: "Auf den Kanarischen Inseln und in Teilen Nordspaniens wählen die Sprecher das Indefinido, wie in Lateinamerika."
              it: "Alle Canarie e in parte della Spagna settentrionale i parlanti scelgono l'indefinido, come in America Latina."
              pl: "Na Wyspach Kanaryjskich i w części północnej Hiszpanii mówiący wybierają indefinido, tak jak w Ameryce Łacińskiej."
              tr: "Kanarya Adaları'nda ve kuzey İspanya'nın bir bölümünde konuşurlar, Latin Amerika'daki gibi indefinido'yu seçer."
              id: "Di Kepulauan Canaria dan sebagian Spanyol utara, penutur memilih indefinido, seperti di Amerika Latin."
              vi: "Ở quần đảo Canarias và một phần miền bắc Tây Ban Nha, người nói chọn indefinido, như ở châu Mỹ Latinh."
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Перфект не дорівнює доконаному виду: «я прочитав книжку» — це і ", { term: "he leído el libro" }, ", і ", { term: "leí el libro" }, ". Вирішує, чи час дії ще триває, а не вид дієслова."]

