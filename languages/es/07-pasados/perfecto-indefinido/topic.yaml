          - { key: preterite, label: { en: Preterite, es: Pretérito indefinido, uk: "Претерит", pt: "Perfeito simples", fr: "Prétérit", de: "Indefinido", it: "Indefinido", pl: "Indefinido", tr: "Indefinido", id: "Indefinido", vi: "Indefinido" }, features: { tense: pst, aspect: pfv } }
