# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.pasados.perfecto-indefinido
lang: es
kind: grammar
tags: [verbs, tenses, past, perfect, preterite, varieties]
concepts: [present-perfect, past-tense]
related: [es.pasados.preterito-perfecto, es.pasados.preterito-indefinido, es.pasados.indefinido-imperfecto, es.pasados.mapa-tiempos]
status: { en: draft, es: draft }
translated: { es: "9bdc67 57936c a13e5a 8037db 0defaf 50b050" }

title: { en: Present Perfect or Preterite, es: Perfecto o indefinido }
summary:
  lead:
    en: ["A finished time takes the preterite and experience the perfect; Spain also says ", { term: hoy he comido }, " where most of Latin America says ", { term: hoy comí }, "."]
    es: ["Un tiempo terminado lleva el indefinido y la experiencia, el perfecto; España dice ", { term: hoy he comido }, " donde la mayor parte de Latinoamérica dice ", { term: hoy comí }, "."]
  rule:
    en: ["A finished time, such as ", { term: ayer }, ", takes the preterite everywhere:"]
    es: ["Un tiempo terminado, como ", { term: ayer }, ", lleva el indefinido en todas partes:"]
  ex: ["Ayer ", { target: comí }, " paella."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A2
          point: { en: Preterite, es: Indefinido }
          rule:
            en: ["a finished time: ", { term: ayer }, ", ", { term: el año pasado }, ", ", { term: hace dos años }]
            es: ["un tiempo terminado: ", { term: ayer }, ", ", { term: el año pasado }, ", ", { term: hace dos años }]
          ex: [{ signal: El año pasado }, " ", { target: viajé }, " a Chile."]
          tr: { en: Last year I travelled to Chile. }
        - level: A2
          point: { en: Perfect, es: Perfecto }
          rule:
            en: ["experience up to now: ", { term: alguna vez }, ", ", { term: nunca }]
            es: ["la experiencia hasta ahora: ", { term: alguna vez }, ", ", { term: nunca }]
          ex: ["¿", { target: Has estado }, " ", { signal: alguna vez }, " en Chile?"]
          tr: { en: Have you ever been to Chile? }
        - level: A2
          point: { en: Perfect, es: Perfecto }
          rule:
            en: "a situation that goes on up to now"
            es: "una situación que llega hasta ahora"
          ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."]
          tr: { en: "I've always lived here." }
        - level: A2
          variety: es-ES
          point: { en: Perfect, es: Perfecto }
          rule:
            en: ["a time that includes now: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            es: ["un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
          ex: [{ signal: Hoy }, " ", { target: he comido }, " paella."]
          tr: { en: I had paella today. }
        - level: A2
          variety: es-419
          point: { en: Preterite, es: Indefinido }
          rule:
            en: ["a finished action, today too: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            es: ["una acción terminada, también hoy: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
          ex: [{ signal: Hoy }, " ", { target: comí }, " paella."]
          tr: { en: I had paella today. }
        - level: A2
          variety: es-ES
          point: { en: Perfect, es: Perfecto }
          rule:
            en: [{ term: ya }, " and something just said or done"]
            es: [{ term: ya }, " y lo que se acaba de decir o hacer"]
          ex: ["¿", { signal: Ya }, " ", { target: has terminado }, "?"]
          tr: { en: Have you finished yet? }
        - level: A2
          variety: es-419
          point: { en: Preterite, es: Indefinido }
          rule:
            en: [{ term: ya }, " and something just said or done"]
            es: [{ term: ya }, " y lo que se acaba de decir o hacer"]
          ex: ["¿", { signal: Ya }, " ", { target: terminaste }, "?"]
          tr: { en: Have you finished yet? }
        - level: B1
          point: { en: Both, es: Los dos }
          rule:
            en: [{ term: nunca }, " up to now takes the perfect; ", { term: nunca }, " in a finished period takes the preterite"]
            es: [{ term: nunca }, " hasta ahora lleva el perfecto; ", { term: nunca }, " en un período terminado, el indefinido"]
          ex: { examples: [[{ signal: Nunca }, " ", { target: he estado }, " allí en mi vida."], [{ signal: Nunca }, " ", { target: estuve }, " allí en aquella época."]] }
          tr: { en: { examples: ["I've never been there in my life.", I was never there at that time.] } }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: ayer }, " never takes the perfect"]
            es: [{ term: ayer }, " nunca lleva el perfecto"]
          ex: ["Ayer ", { target: vi }, " a Juan."]
          tr: { en: I saw Juan yesterday. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The preterite looks at a time that is over; the perfect looks at a time that reaches up to now."
              es: "El indefinido mira un tiempo ya terminado; el perfecto mira un tiempo que llega hasta ahora."
            ex: { examples: [["En ", { date: "2019", value: "2019" }, " ", { target: fui }, " a Cuba."], ["¿", { target: Has ido }, " alguna vez a Cuba?"]] }
            tr: { en: { examples: [I went to Cuba in 2019., Have you ever been to Cuba?] } }
          - type: note
            level: A2
            text:
              en: ["Grammars also call them ", { term: pretérito perfecto simple }, " and ", { term: pretérito perfecto compuesto }, "."]
              es: ["Las gramáticas también los llaman ", { term: pretérito perfecto simple }, " y ", { term: pretérito perfecto compuesto }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, the preterite tells most finished actions, today's included, and the perfect keeps experience and situations up to now; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for today, as Spain does."
              es: "En la mayor parte de Latinoamérica, el indefinido cuenta casi todas las acciones terminadas, también las de hoy, y el perfecto queda para la experiencia y las situaciones hasta ahora; el español andino (Perú, Bolivia, la sierra de Ecuador) usa el perfecto para hoy, como en España."
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["In Spain, the perfect also tells any action in a time that includes now: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              es: ["En España, el perfecto también cuenta cualquier acción en un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
          - type: note
            level: B1
            variety: es-ES
            text:
              en: "In the Canary Islands and parts of northern Spain, speakers choose the preterite, as in Latin America."
              es: "En Canarias y en parte del norte de España, se elige el indefinido, como en Latinoamérica."

  - title: { en: "Compare: perfect and preterite", es: "Comparación: perfecto e indefinido" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: perfect, label: { en: Present perfect, es: Pretérito perfecto }, features: { tense: prs, aspect: prf } }
          - { key: preterite, label: { en: Preterite, es: Pretérito indefinido }, features: { tense: pst, aspect: pfv } }
        rows:
          - { level: A2, perfect: { en: "a time that reaches up to now: experience, a situation still going on", es: "un tiempo que llega hasta ahora: la experiencia, una situación que sigue" }, preterite: { en: "a time that is over, stated or known", es: "un tiempo terminado, dicho o conocido" } }
          - level: A2
            perfect: { ex: [{ signal: Nunca }, " ", { target: he estado }, " en Chile."], tr: { en: "I've never been to Chile." } }
            preterite: { ex: ["En ", { date: "2010", value: "2010" }, " ", { target: estuve }, " en Chile."], tr: { en: I was in Chile in 2010. } }
          - level: A2
            perfect: { ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."], tr: { en: "I've always lived here." } }
            preterite: { ex: [{ target: Viví }, " aquí ", { signal: hasta 2015 }, "."], tr: { en: I lived here until 2015. } }
          - level: B1
            perfect: { ex: [{ signal: Nunca }, " ", { target: he estado }, " allí en mi vida."], tr: { en: "I've never been there in my life." } }
            preterite: { ex: [{ signal: Nunca }, " ", { target: estuve }, " allí en aquella época."], tr: { en: I was never there at that time. } }
          - level: A2
            perfect: { ex: "alguna vez, nunca, siempre, todavía no", tr: { en: "ever, never, always, not yet" } }
            preterite: { ex: "ayer, anoche, el lunes, el año pasado, hace dos años", tr: { en: "yesterday, last night, on Monday, last year, two years ago" } }
          - level: A2
            variety: es-ES
            perfect: { ex: "hoy, esta mañana, esta semana, este año", tr: { en: "today, this morning, this week, this year" } }
          - level: A2
            variety: es-419
            preterite: { ex: "hoy, esta mañana, esta semana, este año", tr: { en: "today, this morning, this week, this year" } }

  - title: { en: "Use: today, this week, just now", es: "Uso: hoy, esta semana, ahora mismo" }
    role: use
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Both choices are correct Spanish, and each variety prefers its own."
              es: "Las dos opciones son español correcto, y cada variedad prefiere la suya."
      - type: usage
        columns:
          - { key: time, label: { en: Time, es: Tiempo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, variety: es-ES, time: hoy, ex: [{ signal: Hoy }, " ", { target: he desayunado }, " tarde."], tr: { en: I had breakfast late today. } }
          - { level: A2, variety: es-419, time: hoy, ex: [{ signal: Hoy }, " ", { target: desayuné }, " tarde."], tr: { en: I had breakfast late today. } }
          - { level: A2, variety: es-ES, time: esta semana, ex: [{ signal: Esta semana }, " ", { target: he trabajado }, " mucho."], tr: { en: "I've worked a lot this week." } }
          - { level: A2, variety: es-419, time: esta semana, ex: [{ signal: Esta semana }, " ", { target: trabajé }, " mucho."], tr: { en: I worked a lot this week. } }
          - { level: A2, variety: es-ES, time: ya, ex: ["¿", { signal: Ya }, " ", { target: has terminado }, "?"], tr: { en: Have you finished yet? } }
          - { level: A2, variety: es-419, time: ya, ex: ["¿", { signal: Ya }, " ", { target: terminaste }, "?"], tr: { en: Have you finished yet? } }
          - { level: B1, variety: es-ES, time: { en: Something just said, es: Algo que se acaba de decir }, ex: ["¿Qué ", { target: has dicho }, "?"], tr: { en: What did you say? } }
          - { level: B1, variety: es-419, time: { en: Something just said, es: Algo que se acaba de decir }, ex: ["¿Qué ", { target: dijiste }, "?"], tr: { en: What did you say? } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Ayer he comido paella., right: ["Ayer ", { target: comí }, " paella."], rule: { en: [{ term: ayer }, " takes the preterite in every variety"], es: [{ term: ayer }, " pide el indefinido en todas las variedades"] } }
          - { level: A2, wrong: En 2010 he estado en Chile., right: ["En ", { date: "2010", value: "2010" }, " ", { target: estuve }, " en Chile."], rule: { en: "a year that is over takes the preterite", es: "un año terminado lleva el indefinido" } }
          - { level: A2, wrong: Hace dos años he vivido en Lima., right: ["Hace dos años ", { target: viví }, " en Lima."], rule: { en: [{ term: hace }, " with a length of time takes the preterite"], es: [{ term: hace }, " con una cantidad de tiempo lleva el indefinido"] } }
          - { level: B1, wrong: Cuando era joven he viajado mucho., right: ["Cuando era joven, ", { target: viajé }, " mucho."], rule: { en: "a stage of life that is over is a finished time", es: "una etapa de la vida ya terminada es un tiempo terminado" } }
