id: es.pasados.perfecto-indefinido
lang: es
kind: grammar
tags: [verbs, tenses, past, perfect, preterite, varieties]
concepts: [present-perfect, past-tense]
related: [es.pasados.preterito-perfecto, es.pasados.preterito-indefinido, es.pasados.indefinido-imperfecto, es.pasados.mapa-tiempos]
