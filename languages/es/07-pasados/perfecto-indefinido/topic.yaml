translated: { en: "e427c8 f4f546 cf4031 503c98 9e7950 845b54", uk: "e427c8 f4f546 cf4031 503c98 9e7950 845b54" }

title: { en: Present Perfect or Preterite, es: Perfecto o indefinido, uk: "Перфект чи простий минулий" }
summary:
  lead:
    en: ["A finished time takes the preterite and experience the perfect; Spain also says ", { term: hoy he comido }, " where most of Latin America says ", { term: hoy comí }, "."]
    es: ["Un tiempo terminado lleva el indefinido y la experiencia, el perfecto; España dice ", { term: hoy he comido }, " donde la mayor parte de Latinoamérica dice ", { term: hoy comí }, "."]
    uk: ["Завершений час вимагає простого минулого, а досвід — перфекта; в Іспанії також кажуть ", { term: hoy he comido }, " там, де більша частина Латинської Америки каже ", { term: hoy comí }, "."]
  rule:
    en: ["A finished time, such as ", { term: ayer }, ", takes the preterite everywhere:"]
    es: ["Un tiempo terminado, como ", { term: ayer }, ", lleva el indefinido en todas partes:"]
    uk: ["Завершений час, як-от ", { term: ayer }, ", скрізь вимагає простого минулого:"]
  ex: ["Ayer ", { target: comí }, " paella."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Preterite, es: Indefinido, uk: "Простий минулий" }
          rule:
            en: ["a finished time: ", { term: ayer }, ", ", { term: el año pasado }, ", ", { term: hace dos años }]
            es: ["un tiempo terminado: ", { term: ayer }, ", ", { term: el año pasado }, ", ", { term: hace dos años }]
            uk: ["завершений час: ", { term: ayer }, ", ", { term: el año pasado }, ", ", { term: hace dos años }]
          ex: [{ signal: El año pasado }, " ", { target: viajé }, " a Chile."]
          tr: { en: Last year I travelled to Chile., uk: "Минулого року я подорожував до Чилі." }
        - level: A2
          point: { en: Perfect, es: Perfecto, uk: "Перфект" }
          rule:
            en: ["experience up to now: ", { term: alguna vez }, ", ", { term: nunca }]
            es: ["la experiencia hasta ahora: ", { term: alguna vez }, ", ", { term: nunca }]
            uk: ["досвід аж до тепер: ", { term: alguna vez }, ", ", { term: nunca }]
          ex: ["¿", { target: Has estado }, " ", { signal: alguna vez }, " en Chile?"]
          tr: { en: Have you ever been to Chile?, uk: "Ти колись бував у Чилі?" }
        - level: A2
          point: { en: Perfect, es: Perfecto, uk: "Перфект" }
          rule:
            en: "a situation that goes on up to now"
            es: "una situación que llega hasta ahora"
            uk: "ситуація, що триває аж до тепер"
          ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."]
          tr: { en: "I've always lived here.", uk: "Я завжди жив тут." }
        - level: A2
          variety: es-ES
          point: { en: Perfect, es: Perfecto, uk: "Перфект" }
          rule:
            en: ["a time that includes now: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            es: ["un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            uk: ["час, що охоплює теперішнє: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
          ex: [{ signal: Hoy }, " ", { target: he comido }, " paella."]
          tr: { en: I had paella today., uk: "Сьогодні я їв паелью." }
        - level: A2
          variety: es-419
          point: { en: Preterite, es: Indefinido, uk: "Простий минулий" }
          rule:
            en: ["a finished action, today too: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            es: ["una acción terminada, también hoy: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
            uk: ["завершена дія, і сьогоднішня теж: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }]
          ex: [{ signal: Hoy }, " ", { target: comí }, " paella."]
          tr: { en: I had paella today., uk: "Сьогодні я їв паелью." }
        - level: A2
          variety: es-ES
          point: { en: Perfect, es: Perfecto, uk: "Перфект" }
          rule:
            en: [{ term: ya }, " and something just said or done"]
            es: [{ term: ya }, " y lo que se acaba de decir o hacer"]
            uk: [{ term: ya }, " і те, що щойно сказали чи зробили"]
          ex: ["¿", { signal: Ya }, " ", { target: has terminado }, "?"]
          tr: { en: Have you finished yet?, uk: "Ти вже закінчив?" }
        - level: A2
          variety: es-419
          point: { en: Preterite, es: Indefinido, uk: "Простий минулий" }
          rule:
            en: [{ term: ya }, " and something just said or done"]
            es: [{ term: ya }, " y lo que se acaba de decir o hacer"]
            uk: [{ term: ya }, " і те, що щойно сказали чи зробили"]
          ex: ["¿", { signal: Ya }, " ", { target: terminaste }, "?"]
          tr: { en: Have you finished yet?, uk: "Ти вже закінчив?" }
        - level: B1
          point: { en: Both, es: Los dos, uk: "Обидва" }
          rule:
            en: [{ term: nunca }, " up to now takes the perfect; ", { term: nunca }, " in a finished period takes the preterite"]
            es: [{ term: nunca }, " hasta ahora lleva el perfecto; ", { term: nunca }, " en un período terminado, el indefinido"]
            uk: [{ term: nunca }, " аж до тепер — перфект; ", { term: nunca }, " у завершеному періоді — простий минулий"]
          ex: { examples: [[{ signal: Nunca }, " ", { target: he estado }, " allí en mi vida."], [{ signal: Nunca }, " ", { target: estuve }, " allí en aquella época."]] }
          tr: { en: { examples: ["I've never been there in my life.", I was never there at that time.] }, uk: { examples: ["Я ніколи в житті там не був.", "У той час я ніколи там не бував."] } }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: ayer }, " never takes the perfect"]
            es: [{ term: ayer }, " nunca lleva el perfecto"]
            uk: [{ term: ayer }, " ніколи не вживається з перфектом"]
          ex: ["Ayer ", { target: vi }, " a Juan."]
          tr: { en: I saw Juan yesterday., uk: "Учора я бачив Хуана." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The preterite looks at a time that is over; the perfect looks at a time that reaches up to now."
              es: "El indefinido mira un tiempo ya terminado; el perfecto mira un tiempo que llega hasta ahora."
              uk: "Простий минулий дивиться на час, що вже минув; перфект — на час, що триває аж до тепер."
            ex: { examples: [["En ", { date: "2019", value: "2019" }, " ", { target: fui }, " a Cuba."], ["¿", { target: Has ido }, " alguna vez a Cuba?"]] }
            tr: { en: { examples: [I went to Cuba in 2019., Have you ever been to Cuba?] }, uk: { examples: ["У 2019 році я їздив на Кубу.", "Ти колись бував на Кубі?"] } }
          - type: note
            level: A2
            text:
              en: ["Grammars also call them ", { term: pretérito perfecto simple }, " and ", { term: pretérito perfecto compuesto }, "."]
              es: ["Las gramáticas también los llaman ", { term: pretérito perfecto simple }, " y ", { term: pretérito perfecto compuesto }, "."]
              uk: ["Граматики називають їх також ", { term: pretérito perfecto simple }, " і ", { term: pretérito perfecto compuesto }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, the preterite tells most finished actions, today's included, and the perfect keeps experience and situations up to now; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for today, as Spain does."
              es: "En la mayor parte de Latinoamérica, el indefinido cuenta casi todas las acciones terminadas, también las de hoy, y el perfecto queda para la experiencia y las situaciones hasta ahora; el español andino (Perú, Bolivia, la sierra de Ecuador) usa el perfecto para hoy, como en España."
              uk: "У більшій частині Латинської Америки простий минулий передає більшість завершених дій, сьогоднішні теж, а перфект залишається для досвіду й ситуацій, що тривають аж до тепер; андська іспанська (Перу, Болівія, гірський Еквадор) уживає для сьогоднішнього перфект, як в Іспанії."
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["In Spain, the perfect also tells any action in a time that includes now: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              es: ["En España, el perfecto también cuenta cualquier acción en un tiempo que incluye el presente: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
              uk: ["В Іспанії перфект передає також будь-яку дію в часі, що охоплює теперішнє: ", { term: hoy }, ", ", { term: esta semana }, ", ", { term: este año }, "."]
          - type: note
            level: B1
            variety: es-ES
            text:
              en: "In the Canary Islands and parts of northern Spain, speakers choose the preterite, as in Latin America."
              es: "En Canarias y en parte del norte de España, se elige el indefinido, como en Latinoamérica."
              uk: "На Канарських островах і в частині півночі Іспанії мовці обирають простий минулий, як у Латинській Америці."

  - title: { en: "Compare: perfect and preterite", es: "Comparación: perfecto e indefinido", uk: "Порівняння: перфект і простий минулий" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: perfect, label: { en: Present perfect, es: Pretérito perfecto, uk: "Перфект" }, features: { tense: prs, aspect: prf } }
          - { key: preterite, label: { en: Preterite, es: Pretérito indefinido, uk: "Простий минулий" }, features: { tense: pst, aspect: pfv } }
        rows:
          - { level: A2, perfect: { en: "a time that reaches up to now: experience, a situation still going on", es: "un tiempo que llega hasta ahora: la experiencia, una situación que sigue", uk: "час, що триває аж до тепер: досвід, ситуація, яка ще триває" }, preterite: { en: "a time that is over, stated or known", es: "un tiempo terminado, dicho o conocido", uk: "час, що вже минув, названий чи відомий" } }
          - level: A2
            perfect: { ex: [{ signal: Nunca }, " ", { target: he estado }, " en Chile."], tr: { en: "I've never been to Chile.", uk: "Я ніколи не був у Чилі." } }
            preterite: { ex: ["En ", { date: "2010", value: "2010" }, " ", { target: estuve }, " en Chile."], tr: { en: I was in Chile in 2010., uk: "У 2010 році я був у Чилі." } }
          - level: A2
            perfect: { ex: [{ signal: Siempre }, " ", { target: he vivido }, " aquí."], tr: { en: "I've always lived here.", uk: "Я завжди жив тут." } }
            preterite: { ex: [{ target: Viví }, " aquí ", { signal: hasta 2015 }, "."], tr: { en: I lived here until 2015., uk: "Я жив тут до 2015 року." } }
          - level: B1
            perfect: { ex: [{ signal: Nunca }, " ", { target: he estado }, " allí en mi vida."], tr: { en: "I've never been there in my life.", uk: "Я ніколи в житті там не був." } }
            preterite: { ex: [{ signal: Nunca }, " ", { target: estuve }, " allí en aquella época."], tr: { en: I was never there at that time., uk: "У той час я ніколи там не бував." } }
          - level: A2
            perfect: { ex: "alguna vez, nunca, siempre, todavía no", tr: { en: "ever, never, always, not yet", uk: "колись, ніколи, завжди, ще не" } }
            preterite: { ex: "ayer, anoche, el lunes, el año pasado, hace dos años", tr: { en: "yesterday, last night, on Monday, last year, two years ago", uk: "учора, учора ввечері, у понеділок, минулого року, два роки тому" } }
          - level: A2
            variety: es-ES
            perfect: { ex: "hoy, esta mañana, esta semana, este año", tr: { en: "today, this morning, this week, this year", uk: "сьогодні, сьогодні вранці, цього тижня, цього року" } }
          - level: A2
            variety: es-419
            preterite: { ex: "hoy, esta mañana, esta semana, este año", tr: { en: "today, this morning, this week, this year", uk: "сьогодні, сьогодні вранці, цього тижня, цього року" } }

  - title: { en: "Use: today, this week, just now", es: "Uso: hoy, esta semana, ahora mismo", uk: "Вживання: сьогодні, цього тижня, щойно" }
    role: use
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Both choices are correct Spanish, and each variety prefers its own."
              es: "Las dos opciones son español correcto, y cada variedad prefiere la suya."
              uk: "Обидва варіанти — правильна іспанська, і кожен варіант мови віддає перевагу своєму."
      - type: usage
        columns:
          - { key: time, label: { en: Time, es: Tiempo, uk: "Час" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, variety: es-ES, time: hoy, ex: [{ signal: Hoy }, " ", { target: he desayunado }, " tarde."], tr: { en: I had breakfast late today., uk: "Сьогодні я пізно снідав." } }
          - { level: A2, variety: es-419, time: hoy, ex: [{ signal: Hoy }, " ", { target: desayuné }, " tarde."], tr: { en: I had breakfast late today., uk: "Сьогодні я пізно снідав." } }
          - { level: A2, variety: es-ES, time: esta semana, ex: [{ signal: Esta semana }, " ", { target: he trabajado }, " mucho."], tr: { en: "I've worked a lot this week.", uk: "Цього тижня я багато працював." } }
          - { level: A2, variety: es-419, time: esta semana, ex: [{ signal: Esta semana }, " ", { target: trabajé }, " mucho."], tr: { en: I worked a lot this week., uk: "Цього тижня я багато працював." } }
          - { level: A2, variety: es-ES, time: ya, ex: ["¿", { signal: Ya }, " ", { target: has terminado }, "?"], tr: { en: Have you finished yet?, uk: "Ти вже закінчив?" } }
          - { level: A2, variety: es-419, time: ya, ex: ["¿", { signal: Ya }, " ", { target: terminaste }, "?"], tr: { en: Have you finished yet?, uk: "Ти вже закінчив?" } }
          - { level: B1, variety: es-ES, time: { en: Something just said, es: Algo que se acaba de decir, uk: "Щойно сказане" }, ex: ["¿Qué ", { target: has dicho }, "?"], tr: { en: What did you say?, uk: "Що ти сказав?" } }
          - { level: B1, variety: es-419, time: { en: Something just said, es: Algo que se acaba de decir, uk: "Щойно сказане" }, ex: ["¿Qué ", { target: dijiste }, "?"], tr: { en: What did you say?, uk: "Що ти сказав?" } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Ayer he comido paella., right: ["Ayer ", { target: comí }, " paella."], rule: { en: [{ term: ayer }, " takes the preterite in every variety"], es: [{ term: ayer }, " pide el indefinido en todas las variedades"], uk: [{ term: ayer }, " у всіх варіантах мови вимагає простого минулого"] } }
          - { level: A2, wrong: En 2010 he estado en Chile., right: ["En ", { date: "2010", value: "2010" }, " ", { target: estuve }, " en Chile."], rule: { en: "a year that is over takes the preterite", es: "un año terminado lleva el indefinido", uk: "рік, що вже минув, вимагає простого минулого" } }
          - { level: A2, wrong: Hace dos años he vivido en Lima., right: ["Hace dos años ", { target: viví }, " en Lima."], rule: { en: [{ term: hace }, " with a length of time takes the preterite"], es: [{ term: hace }, " con una cantidad de tiempo lleva el indefinido"], uk: [{ term: hace }, " із тривалістю часу вимагає простого минулого"] } }
          - { level: B1, wrong: Cuando era joven he viajado mucho., right: ["Cuando era joven, ", { target: viajé }, " mucho."], rule: { en: "a stage of life that is over is a finished time", es: "una etapa de la vida ya terminada es un tiempo terminado", uk: "етап життя, що вже минув, — це завершений час" } }
