  - title: { en: "Use: today, this week, just now", es: "Uso: hoy, esta semana, ahora mismo", uk: "Вживання: сьогодні, цього тижня, щойно", pt: "Uso: hoje, esta semana, agora mesmo", fr: "Emploi : aujourd’hui, cette semaine, à l’instant", de: "Gebrauch: heute, diese Woche, gerade eben", it: "Uso: oggi, questa settimana, proprio ora", pl: "Użycie: dzisiaj, w tym tygodniu, przed chwilą", tr: "Kullanım: bugün, bu hafta, az önce", id: "Penggunaan: hari ini, minggu ini, baru saja", vi: "Cách dùng: hôm nay, tuần này, vừa mới" }
