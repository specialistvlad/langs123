          - { level: B1, tense: { en: [{ link: Past perfect, to: es.pasados.pluscuamperfecto }, ": before another past action"], es: [{ link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto }, ": antes de otra acción pasada"], uk: [{ link: Плюсквамперфект, to: es.pasados.pluscuamperfecto }, ": раніше за іншу минулу дію"] }, form: { pattern: [{ alternatives: [había, habías, había] }, { slot: past participle }] }, ex: ["El tren ya ", { target: había salido }, "."], tr: { en: The train had already left., uk: "Потяг уже поїхав." } }

