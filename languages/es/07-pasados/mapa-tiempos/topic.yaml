          - { level: B1, tense: { es: [{ link: Presente de subjuntivo, to: es.subjuntivo.subjuntivo-formas }, ": deseos, dudas y opiniones"], en: [{ link: "Present subjunctive", to: es.subjuntivo.subjuntivo-formas }, ": wishes, doubts and opinions"], uk: [{ link: "Теперішній час суб’юнктива", to: es.subjuntivo.subjuntivo-formas }, ": бажання, сумніви й думки"], pt: [{ link: "Presente do subjuntivo", to: es.subjuntivo.subjuntivo-formas }, ": desejos, dúvidas e opiniões"], fr: [{ link: "Présent du subjonctif", to: es.subjuntivo.subjuntivo-formas }, " : souhaits, doutes et opinions"], de: [{ link: "Konjunktiv Präsens", to: es.subjuntivo.subjuntivo-formas }, ": Wünsche, Zweifel und Meinungen"], it: [{ link: "Presente del congiuntivo", to: es.subjuntivo.subjuntivo-formas }, ": desideri, dubbi e opinioni"], pl: [{ link: "Tryb łączący czasu teraźniejszego", to: es.subjuntivo.subjuntivo-formas }, ": życzenia, wątpliwości i opinie"], tr: [{ link: "Dilek kipinin şimdiki zamanı", to: es.subjuntivo.subjuntivo-formas }, ": istekler, şüpheler ve görüşler"], id: [{ link: "Presente subjungtif", to: es.subjuntivo.subjuntivo-formas }, ": keinginan, keraguan, dan pendapat"], vi: [{ link: "Thì hiện tại của thức giả định", to: es.subjuntivo.subjuntivo-formas }, ": mong muốn, nghi ngờ và ý kiến"] }, form: { alternatives: [hable, coma, viva] }, ex: ["Quiero que ", { target: vengas }, " temprano."], tr: { en: "I want you to come early.", uk: "Хочу, щоб ти прийшов рано.", pt: "Quero que você venha cedo.", fr: "Je veux que tu viennes tôt.", de: "Ich möchte, dass du früh kommst.", it: "Voglio che tu venga presto.", pl: "Chcę, żebyś przyszedł wcześnie.", tr: "Erken gelmeni istiyorum.", id: "Saya ingin kamu datang lebih awal.", vi: "Tôi muốn bạn đến sớm." } }
          - { level: B2, tense: { es: [{ link: Perfecto de subjuntivo, to: es.subjuntivo.subjuntivo-compuesto }, ": un hecho terminado antes de otro momento"], en: [{ link: "Present perfect subjunctive", to: es.subjuntivo.subjuntivo-compuesto }, ": a completed event before another moment"], uk: [{ link: "Перфект суб’юнктива", to: es.subjuntivo.subjuntivo-compuesto }, ": завершена подія перед іншим моментом"], pt: [{ link: "Perfeito do subjuntivo", to: es.subjuntivo.subjuntivo-compuesto }, ": um fato concluído antes de outro momento"], fr: [{ link: "Passé du subjonctif", to: es.subjuntivo.subjuntivo-compuesto }, " : un fait achevé avant un autre moment"], de: [{ link: "Konjunktiv Perfecto", to: es.subjuntivo.subjuntivo-compuesto }, ": ein abgeschlossenes Ereignis vor einem anderen Zeitpunkt"], it: [{ link: "Passato del congiuntivo", to: es.subjuntivo.subjuntivo-compuesto }, ": un fatto concluso prima di un altro momento"], pl: [{ link: "Perfecto trybu łączącego", to: es.subjuntivo.subjuntivo-compuesto }, ": zakończone zdarzenie przed innym momentem"], tr: [{ link: "Dilek kipinin perfecto zamanı", to: es.subjuntivo.subjuntivo-compuesto }, ": başka bir andan önce tamamlanmış bir olay"], id: [{ link: "Perfecto subjungtif", to: es.subjuntivo.subjuntivo-compuesto }, ": peristiwa yang sudah selesai sebelum saat lain"], vi: [{ link: "Perfecto của thức giả định", to: es.subjuntivo.subjuntivo-compuesto }, ": một sự việc đã hoàn tất trước một thời điểm khác"] }, form: { pattern: [{ alternatives: [haya, hayas, haya] }, { slot: past participle }] }, ex: ["Espero que ", { target: hayas comido }, " algo."], tr: { en: "I hope you have eaten something.", uk: "Сподіваюся, ти щось з’їв.", pt: "Espero que você tenha comido alguma coisa.", fr: "J’espère que tu as mangé quelque chose.", de: "Ich hoffe, du hast etwas gegessen.", it: "Spero che tu abbia mangiato qualcosa.", pl: "Mam nadzieję, że coś zjadłeś.", tr: "Umarım bir şeyler yemişsindir.", id: "Saya harap kamu sudah makan sesuatu.", vi: "Tôi hy vọng bạn đã ăn gì đó." } }
          - { level: B2, tense: { es: [{ link: Imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, ": deseos en el pasado; condiciones irreales del presente"], en: [{ link: "Imperfect subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, ": wishes in the past; unreal conditions in the present"], uk: [{ link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, ": бажання в минулому; нереальні умови в теперішньому"], pt: [{ link: "Imperfeito do subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, ": desejos no passado; condições irreais do presente"], fr: [{ link: "Imparfait du subjonctif", to: es.subjuntivo.subjuntivo-imperfecto }, " : souhaits dans le passé ; conditions irréelles du présent"], de: [{ link: "Konjunktiv Imperfecto", to: es.subjuntivo.subjuntivo-imperfecto }, ": Wünsche in der Vergangenheit; irreale Bedingungen der Gegenwart"], it: [{ link: "Imperfetto del congiuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, ": desideri nel passato; condizioni irreali del presente"], pl: [{ link: "Imperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-imperfecto }, ": życzenia w przeszłości; nierealne warunki w teraźniejszości"], tr: [{ link: "Dilek kipinin imperfecto zamanı", to: es.subjuntivo.subjuntivo-imperfecto }, ": geçmişteki istekler; şimdiki zamana ait gerçekdışı koşullar"], id: [{ link: "Imperfecto subjungtif", to: es.subjuntivo.subjuntivo-imperfecto }, ": keinginan di masa lampau; syarat tidak nyata untuk masa kini"], vi: [{ link: "Imperfecto của thức giả định", to: es.subjuntivo.subjuntivo-imperfecto }, ": mong muốn trong quá khứ; điều kiện không có thật ở hiện tại"] }, form: { alternatives: [hablara, comiera, viviera] }, ex: { examples: [["Quería que ", { target: vinieras }, " conmigo."], ["Si ", { target: tuviera }, " tiempo, viajaría más."]] }, tr: { en: { examples: ["I wanted you to come with me.", "If I had time, I would travel more."] }, uk: { examples: ["Я хотів, щоб ти пішов зі мною.", "Якби в мене був час, я б більше подорожував."] }, pt: { examples: ["Eu queria que você viesse comigo.", "Se eu tivesse tempo, viajaria mais."] }, fr: { examples: ["Je voulais que tu viennes avec moi.", "Si j’avais le temps, je voyagerais plus."] }, de: { examples: ["Ich wollte, dass du mit mir kommst.", "Wenn ich Zeit hätte, würde ich mehr reisen."] }, it: { examples: ["Volevo che venissi con me.", "Se avessi tempo, viaggerei di più."] }, pl: { examples: ["Chciałem, żebyś poszedł ze mną.", "Gdybym miał czas, podróżowałbym więcej."] }, tr: { examples: ["Benimle gelmeni istiyordum.", "Zamanım olsa daha çok seyahat ederdim."] }, id: { examples: ["Saya ingin kamu ikut dengan saya.", "Kalau saya punya waktu, saya akan lebih sering bepergian."] }, vi: { examples: ["Tôi muốn bạn đi cùng tôi.", "Nếu có thời gian, tôi sẽ đi du lịch nhiều hơn."] } } }
          - { level: B2, tense: { es: [{ link: Pluscuamperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-compuesto }, ": condiciones irreales del pasado"], en: [{ link: "Past perfect subjunctive", to: es.subjuntivo.subjuntivo-compuesto }, ": unreal conditions in the past"], uk: [{ link: "Плюсквамперфект суб’юнктива", to: es.subjuntivo.subjuntivo-compuesto }, ": нереальні умови в минулому"], pt: [{ link: "Mais-que-perfeito do subjuntivo", to: es.subjuntivo.subjuntivo-compuesto }, ": condições irreais do passado"], fr: [{ link: "Plus-que-parfait du subjonctif", to: es.subjuntivo.subjuntivo-compuesto }, " : conditions irréelles du passé"], de: [{ link: "Konjunktiv Plusquamperfekt", to: es.subjuntivo.subjuntivo-compuesto }, ": irreale Bedingungen der Vergangenheit"], it: [{ link: "Trapassato del congiuntivo", to: es.subjuntivo.subjuntivo-compuesto }, ": condizioni irreali del passato"], pl: [{ link: "Pluscuamperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-compuesto }, ": nierealne warunki w przeszłości"], tr: [{ link: "Dilek kipinin pluscuamperfecto zamanı", to: es.subjuntivo.subjuntivo-compuesto }, ": geçmişe ait gerçekdışı koşullar"], id: [{ link: "Pluscuamperfecto subjungtif", to: es.subjuntivo.subjuntivo-compuesto }, ": syarat tidak nyata untuk masa lampau"], vi: [{ link: "Pluscuamperfecto của thức giả định", to: es.subjuntivo.subjuntivo-compuesto }, ": điều kiện không có thật trong quá khứ"] }, form: { pattern: [{ alternatives: [hubiera, hubieras, hubiera] }, { slot: past participle }] }, ex: ["Si ", { target: hubiera salido }, " antes, habría llegado a tiempo."], tr: { en: "If I had left earlier, I would have arrived on time.", uk: "Якби я вийшов раніше, я б устиг.", pt: "Se eu tivesse saído antes, teria chegado a tempo.", fr: "Si j’étais parti plus tôt, je serais arrivé à temps.", de: "Wenn ich früher losgegangen wäre, wäre ich rechtzeitig angekommen.", it: "Se fossi uscito prima, sarei arrivato in tempo.", pl: "Gdybym wyszedł wcześniej, dotarłbym na czas.", tr: "Daha erken çıkmış olsaydım zamanında varırdım.", id: "Seandainya saya berangkat lebih awal, saya akan tiba tepat waktu.", vi: "Nếu tôi đã đi sớm hơn, tôi đã đến kịp giờ." } }

