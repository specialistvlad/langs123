title: { en: Tense Map, es: Mapa de los tiempos, uk: "Мапа часів" }
summary:
  lead:
    en: ["Every tense on one map, placed by time, with its form, main use and an example: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    es: ["Todos los tiempos en un mapa, ordenados por época, con su forma, su uso principal y un ejemplo: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    uk: ["Усі часи на одній мапі, за часовою віссю, з формою, головним уживанням і прикладом: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
  rule:
    en: "The past has two simple tenses: the preterite for the events, the imperfect for the scene:"
    es: "El pasado tiene dos tiempos simples: el indefinido para los hechos y el imperfecto para el escenario:"
    uk: "Минуле має два прості часи: простий минулий — для подій, імперфект — для обставин:"
  ex: ["Cuando ", { target: llegué }, ", ", { target: llovía }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: tense, label: { en: Tense, es: Tiempo, uk: "Час" } }
        - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - { level: A2, features: { tense: prs }, tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular }, uk: { link: Теперішній час, to: es.presente.presente-regular } }, meaning: { en: "habits, facts, now", es: "hábitos, hechos, el ahora", uk: "звички, факти, зараз" }, ex: ["Siempre ", { target: desayuno }, " café."], tr: { en: I always have coffee for breakfast., uk: "На сніданок я завжди п’ю каву." } }
        - { level: A2, features: { tense: prs, aspect: prog }, tense: { en: { link: Present continuous, to: es.presente.estar-gerundio }, es: { link: Estar con gerundio, to: es.presente.estar-gerundio }, uk: { link: Estar з герундієм, to: es.presente.estar-gerundio } }, meaning: { en: an action going on now, es: una acción en curso ahora, uk: "дія, що триває зараз" }, ex: [{ target: Estoy estudiando }, "."], tr: { en: "I'm studying.", uk: "Я зараз учуся." } }
        - { level: A2, features: { tense: prs, aspect: prf }, tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto }, uk: { link: Перфект, to: es.pasados.preterito-perfecto } }, meaning: { en: "experience, a time up to now", es: "la experiencia, un tiempo hasta ahora", uk: "досвід, час аж до тепер" }, ex: ["¿", { target: Has estado }, " en Chile?"], tr: { en: Have you been to Chile?, uk: "Ти бував у Чилі?" } }
        - { level: A2, features: { tense: pst, aspect: pfv }, tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido }, uk: { link: Простий минулий, to: es.pasados.preterito-indefinido } }, meaning: { en: a finished event, es: un hecho terminado, uk: "завершена подія" }, ex: ["Ayer ", { target: fui }, " al cine."], tr: { en: I went to the cinema yesterday., uk: "Учора я ходив у кіно." } }
        - { level: A2, features: { tense: pst, aspect: ipfv }, tense: { en: { link: Imperfect, to: es.pasados.preterito-imperfecto }, es: { link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto }, uk: { link: Імперфект, to: es.pasados.preterito-imperfecto } }, meaning: { en: "description, habits", es: "la descripción, los hábitos", uk: "опис, звички" }, ex: ["De niño ", { target: vivía }, " en Lima."], tr: { en: As a child I lived in Lima., uk: "У дитинстві я жив у Лімі." } }
        - { level: B1, features: { tense: pst, aspect: prog }, tense: { en: { link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, es: { link: Estaba con gerundio, to: es.pasados.indefinido-imperfecto }, uk: { link: Estaba з герундієм, to: es.pasados.indefinido-imperfecto } }, meaning: { en: an action going on at a past moment, es: una acción en curso en un momento pasado, uk: "дія, що тривала в певний момент минулого" }, ex: [{ target: Estaba cocinando }, " cuando llamaste."], tr: { en: I was cooking when you called., uk: "Я готував їсти, коли ти подзвонив." } }
        - { level: B1, features: { tense: pst, aspect: prf }, tense: { en: { link: Past perfect, to: es.pasados.pluscuamperfecto }, es: { link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto }, uk: { link: Плюсквамперфект, to: es.pasados.pluscuamperfecto } }, meaning: { en: before another past action, es: antes de otra acción pasada, uk: "раніше за іншу минулу дію" }, ex: ["El tren ya ", { target: había salido }, "."], tr: { en: The train had already left., uk: "Потяг уже поїхав." } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Future with ir a, to: es.futuro-condicional.ir-a-infinitivo }, es: { link: Ir a con infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, uk: { link: Майбутнє з ir a, to: es.futuro-condicional.ir-a-infinitivo } }, meaning: { en: "plans, the near future", es: "los planes, el futuro cercano", uk: "плани, найближче майбутнє" }, ex: [{ target: Voy a viajar }, " en ", { date: julio, value: "--07" }, "."], tr: { en: "I'm going to travel in July.", uk: "У липні я збираюся подорожувати." } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular }, uk: { link: Теперішній час, to: es.presente.presente-regular } }, meaning: { en: a fixed plan with a time word, es: un plan fijo con una palabra de tiempo, uk: "твердий план зі словом часу" }, ex: ["Mañana ", { target: trabajo }, " temprano."], tr: { en: "I'm working early tomorrow.", uk: "Завтра я працюю з самого ранку." } }
        - { level: B1, features: { tense: fut }, tense: { en: { link: Future, to: es.futuro-condicional.futuro-simple }, es: { link: Futuro simple, to: es.futuro-condicional.futuro-simple }, uk: { link: Простий майбутній, to: es.futuro-condicional.futuro-simple } }, meaning: { en: "predictions, promises", es: "las predicciones, las promesas", uk: "прогнози, обіцянки" }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow., uk: "Завтра буде дощ." } }
        - { level: B1, features: { mood: cond }, tense: { en: { link: Conditional, to: es.futuro-condicional.condicional-simple }, es: { link: Condicional simple, to: es.futuro-condicional.condicional-simple }, uk: { link: Умовний спосіб, to: es.futuro-condicional.condicional-simple } }, meaning: { en: "polite wishes, advice", es: "los deseos corteses, los consejos", uk: "ввічливі побажання, поради" }, ex: ["Me ", { target: gustaría }, " un café."], tr: { en: "I'd like a coffee.", uk: "Я б хотів кави." } }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The map runs by time: the present, then the past, then the future."
              es: "El mapa sigue el tiempo: primero el presente, luego el pasado y después el futuro."
              uk: "Мапа йде за часом: спершу теперішнє, потім минуле, потім майбутнє."
          - type: rule
            level: A2
            text:
              en: ["A simple form tells the fact; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }] }, " tells it going on; ", { pattern: [{ term: haber }, { slot: past participle }] }, " looks back from a moment."]
              es: ["La forma simple cuenta el hecho; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }] }, " lo presenta en curso; ", { pattern: [{ term: haber }, { slot: past participle }] }, " mira atrás desde un momento."]
              uk: ["Проста форма називає факт; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: герундій } }] }, " показує дію в процесі; ", { pattern: [{ term: haber }, { slot: { en: past participle, es: participio pasado, uk: дієприкметник } }] }, " озирається назад від певного моменту."]
          - type: note
            level: A2
            text:
              en: ["The key choice in the past: ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["La elección clave en el pasado: ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              uk: ["Головний вибір у минулому: ", { link: Простий минулий чи імперфект, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: Present, es: Presente, uk: "Теперішній час" }
    role: own
    features: { tense: prs }
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense and main use, es: Tiempo y uso principal, uk: "Час і головне вживання" } }
          - { key: form, label: { en: Form, es: Forma, uk: "Форма" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, tense: { en: [{ link: Present, to: es.presente.presente-regular }, ": habits, facts, now"], es: [{ link: Presente, to: es.presente.presente-regular }, ": hábitos, hechos, el ahora"], uk: [{ link: Теперішній час, to: es.presente.presente-regular }, ": звички, факти, зараз"] }, form: { alternatives: [hablo, como, vivo] }, ex: ["Siempre ", { target: desayuno }, " café."], tr: { en: I always have coffee for breakfast., uk: "На сніданок я завжди п’ю каву." } }
          - { level: A2, tense: { en: [{ link: Present continuous, to: es.presente.estar-gerundio }, ": an action going on now"], es: [{ link: Estar con gerundio, to: es.presente.estar-gerundio }, ": una acción en curso ahora"], uk: [{ link: Estar з герундієм, to: es.presente.estar-gerundio }, ": дія, що триває зараз"] }, form: { pattern: [{ alternatives: [estoy, estás, está] }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }] }, ex: [{ target: Estoy estudiando }, "."], tr: { en: "I'm studying.", uk: "Я зараз учуся." } }

