      - type: list
        items:
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In most of Latin America, ", { term: hoy }, ", ", { term: esta mañana }, " and ", { term: esta semana }, " take the preterite; Andean Spanish (Peru, Bolivia, highland Ecuador) takes the perfect, as Spain does."]
              es: ["En la mayor parte de Latinoamérica, ", { term: hoy }, ", ", { term: esta mañana }, " y ", { term: esta semana }, " llevan el indefinido; el español andino (Perú, Bolivia, la sierra de Ecuador) lleva el perfecto, como en España."]
              uk: ["У більшій частині Латинської Америки ", { term: hoy }, ", ", { term: esta mañana }, " і ", { term: esta semana }, " вимагають претериту; андська іспанська (Перу, Болівія, гірський Еквадор) — перфекта, як в Іспанії."]
              pt: ["Na maior parte da América Latina, ", { term: hoy }, ", ", { term: esta mañana }, " e ", { term: esta semana }, " levam o perfeito simples; o espanhol andino (Peru, Bolívia, serra do Equador) usa o perfeito composto, como na Espanha."]
              fr: ["Dans la plus grande partie de l’Amérique latine, ", { term: hoy }, ", ", { term: esta mañana }, " et ", { term: esta semana }, " se mettent au prétérit ; l’espagnol andin (Pérou, Bolivie, hautes terres de l’Équateur) emploie le passé composé, comme l’Espagne."]
              de: ["In den meisten Teilen Lateinamerikas stehen ", { term: hoy }, ", ", { term: esta mañana }, " und ", { term: esta semana }, " im Indefinido; das Andenspanisch (Peru, Bolivien, Hochland von Ecuador) nimmt das Perfecto, wie Spanien."]
              it: ["Nella maggior parte dell'America Latina, ", { term: hoy }, ", ", { term: esta mañana }, " e ", { term: esta semana }, " vogliono l'indefinido; lo spagnolo andino (Perù, Bolivia, altopiano dell'Ecuador) usa il perfecto, come la Spagna."]
              pl: ["W większości Ameryki Łacińskiej ", { term: hoy }, ", ", { term: esta mañana }, " i ", { term: esta semana }, " wymagają indefinido; hiszpański andyjski (Peru, Boliwia, wyżyny Ekwadoru) używa perfecto, tak jak Hiszpania."]
              tr: ["Latin Amerika'nın çoğunda ", { term: hoy }, ", ", { term: esta mañana }, " ve ", { term: esta semana }, " indefinido ile kullanılır; And İspanyolcası'nda (Peru, Bolivya, Ekvador'un dağlık bölgesi) İspanya'daki gibi perfecto kullanılır."]
              id: ["Di sebagian besar Amerika Latin, ", { term: hoy }, ", ", { term: esta mañana }, " dan ", { term: esta semana }, " memakai indefinido; bahasa Spanyol Andes (Peru, Bolivia, dataran tinggi Ekuador) memakai perfecto, seperti di Spanyol."]
              vi: ["Ở phần lớn châu Mỹ Latinh, ", { term: hoy }, ", ", { term: esta mañana }, " và ", { term: esta semana }, " dùng indefinido; tiếng Tây Ban Nha vùng Andes (Peru, Bolivia, cao nguyên Ecuador) dùng perfecto, như ở Tây Ban Nha."]

