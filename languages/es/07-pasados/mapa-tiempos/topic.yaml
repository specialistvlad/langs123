related: [es.presente.presente-regular, es.presente.estar-gerundio, es.pasados.preterito-perfecto, es.pasados.preterito-indefinido, es.pasados.preterito-imperfecto, es.pasados.pluscuamperfecto, es.futuro-condicional.ir-a-infinitivo, es.futuro-condicional.futuro-simple, es.futuro-condicional.condicional-simple]
