title: { en: Tense Map, es: Mapa de los tiempos, uk: "Мапа часів", pt: "Mapa dos tempos verbais", fr: "Carte des temps", de: "Übersicht der Zeitformen", it: "Mappa dei tempi verbali", pl: "Mapa czasów", tr: "Zaman haritası", id: "Peta tense", vi: "Sơ đồ các thì" }
summary:
  lead:
    en: ["Every tense on one map, placed by time, with its form, main use and an example: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    es: ["Todos los tiempos en un mapa, ordenados por época, con su forma, su uso principal y un ejemplo: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    uk: ["Усі часи на одній мапі, за часовою віссю, з формою, головним уживанням і прикладом: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    pt: ["Todos os tempos verbais em um mapa, dispostos por época, com a forma, o uso principal e um exemplo: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    fr: ["Tous les temps sur une carte, classés par époque, avec leur forme, leur emploi principal et un exemple : ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    de: ["Alle Zeitformen auf einer Karte, nach Zeit geordnet, mit Form, Hauptgebrauch und Beispiel: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    it: ["Tutti i tempi verbali su una mappa, ordinati per epoca, con forma, uso principale ed esempio: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    pl: ["Wszystkie czasy na jednej mapie, ułożone według czasu, z formą, głównym użyciem i przykładem: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    tr: ["Tüm zamanlar tek haritada, zamana göre sıralı; biçimi, başlıca kullanımı ve bir örnekle: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    id: ["Semua tense dalam satu peta, diurutkan menurut waktu, dengan bentuk, penggunaan utama, dan contoh: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    vi: ["Mọi thì trên một sơ đồ, xếp theo thời gian, kèm dạng, cách dùng chính và ví dụ: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
  rule:
    en: "The past has two simple tenses: the preterite for the events, the imperfect for the scene:"
    es: "El pasado tiene dos tiempos simples: el indefinido para los hechos y el imperfecto para el escenario:"
    uk: "Минуле має два прості часи: претерит — для подій, імперфект — для тла:"
    pt: "O passado tem dois tempos simples: o perfeito simples para os fatos e o imperfeito para o cenário:"
    fr: "Le passé a deux temps simples : le prétérit pour les faits, l’imparfait pour le décor :"
    de: "Die Vergangenheit hat zwei einfache Zeiten: das Indefinido für die Ereignisse, das Imperfecto für den Hintergrund:"
    it: "Il passato ha due tempi semplici: l'indefinido per i fatti, l'imperfetto per lo sfondo:"
    pl: "Przeszłość ma dwa czasy proste: indefinido dla zdarzeń, imperfecto dla tła:"
    tr: "Geçmişin iki basit zamanı vardır: olaylar için indefinido, arka plan için imperfecto:"
    id: "Masa lalu punya dua tense sederhana: indefinido untuk kejadian, imperfecto untuk latar:"
    vi: "Quá khứ có hai thì đơn: indefinido cho các sự việc, imperfecto cho bối cảnh:"
  ex: ["Cuando ", { target: llegué }, ", ", { target: llovía }, "."]

