          - { level: A2, variety: es-ES, marker: "hoy, esta mañana, esta semana", tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto }, uk: { link: Перфект, to: es.pasados.preterito-perfecto } }, ex: [{ signal: Esta mañana }, " ", { target: he ido }, " al banco."], tr: { en: I went to the bank this morning., uk: "Сьогодні вранці я ходив до банку." } }
          - { level: A2, marker: "ayer, el lunes, el año pasado, hace dos años", tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido }, uk: { link: Простий минулий, to: es.pasados.preterito-indefinido } }, ex: [{ signal: El año pasado }, " ", { target: fui }, " a Perú."], tr: { en: Last year I went to Peru., uk: "Минулого року я їздив до Перу." } }
          - { level: A2, variety: es-419, marker: "hoy, esta mañana, esta semana", tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido }, uk: { link: Простий минулий, to: es.pasados.preterito-indefinido } }, ex: [{ signal: Esta mañana }, " ", { target: fui }, " al banco."], tr: { en: I went to the bank this morning., uk: "Сьогодні вранці я ходив до банку." } }
          - { level: A2, marker: "antes, de niño, todos los días", tense: { en: { link: Imperfect, to: es.pasados.preterito-imperfecto }, es: { link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto }, uk: { link: Імперфект, to: es.pasados.preterito-imperfecto } }, ex: [{ signal: Antes }, " ", { target: vivía }, " en el centro."], tr: { en: I used to live in the centre., uk: "Раніше я жив у центрі." } }
          - { level: B1, marker: "mientras, cuando", tense: { en: { link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, es: { link: Estaba con gerundio, to: es.pasados.indefinido-imperfecto }, uk: { link: Estaba з герундієм, to: es.pasados.indefinido-imperfecto } }, ex: [{ signal: Mientras }, " ", { target: estaba cocinando }, ", sonó el teléfono."], tr: { en: "While I was cooking, the phone rang.", uk: "Поки я готував, задзвонив телефон." } }
