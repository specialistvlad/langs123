              vi: ["Dạng đơn nêu sự việc; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, " cho thấy nó đang diễn ra; ", { pattern: [{ term: haber }, { slot: past participle }] }, " nhìn lại từ một thời điểm."]
