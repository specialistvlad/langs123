title: { en: Tense Map, es: Mapa de los tiempos }
summary:
  lead:
    en: ["Every tense on one map, placed by time, with its form, main use and an example: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
    es: ["Todos los tiempos en un mapa, ordenados por época, con su forma, su uso principal y un ejemplo: ", { term: hablo }, ", ", { term: hablé }, ", ", { term: hablaba }, ", ", { term: hablaré }, "."]
  rule:
    en: "The past has two simple tenses: the preterite for the events, the imperfect for the scene:"
    es: "El pasado tiene dos tiempos simples: el indefinido para los hechos y el imperfecto para el escenario:"
  ex: ["Cuando ", { target: llegué }, ", ", { target: llovía }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: tense, label: { en: Tense, es: Tiempo } }
        - { key: meaning, label: { en: Meaning, es: Significado } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - { level: A1, features: { tense: prs }, tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular } }, meaning: { en: "habits, facts, now", es: "hábitos, hechos, el ahora" }, ex: ["Siempre ", { target: desayuno }, " café."], tr: { en: I always have coffee for breakfast. } }
        - { level: A2, features: { tense: prs, aspect: prog }, tense: { en: { link: Estar with the gerund, to: es.presente.estar-gerundio }, es: { link: Estar más gerundio, to: es.presente.estar-gerundio } }, meaning: { en: an action going on now, es: una acción en curso ahora }, ex: [{ target: Estoy estudiando }, "."], tr: { en: "I'm studying." } }
        - { level: A2, features: { tense: prs, aspect: prf }, tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto } }, meaning: { en: "experience, a time up to now", es: "la experiencia, un tiempo hasta ahora" }, ex: ["¿", { target: Has estado }, " en Chile?"], tr: { en: Have you been to Chile? } }
        - { level: A2, features: { tense: pst, aspect: pfv }, tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido } }, meaning: { en: a finished event, es: un hecho terminado }, ex: ["Ayer ", { target: fui }, " al cine."], tr: { en: I went to the cinema yesterday. } }
        - { level: A2, features: { tense: pst, aspect: ipfv }, tense: { en: { link: Imperfect, to: es.pasados.preterito-imperfecto }, es: { link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto } }, meaning: { en: "description, habits", es: "la descripción, los hábitos" }, ex: ["De niño ", { target: vivía }, " en Lima."], tr: { en: As a child I lived in Lima. } }
        - { level: B1, features: { tense: pst, aspect: prog }, tense: { en: { link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, es: { link: Estaba más gerundio, to: es.pasados.indefinido-imperfecto } }, meaning: { en: an action going on at a past moment, es: una acción en curso en un momento pasado }, ex: [{ target: Estaba cocinando }, " cuando llamaste."], tr: { en: I was cooking when you called. } }
        - { level: B1, features: { tense: pst, aspect: prf }, tense: { en: { link: Past perfect, to: es.pasados.pluscuamperfecto }, es: { link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto } }, meaning: { en: before another past action, es: antes de otra acción pasada }, ex: ["El tren ya ", { target: había salido }, "."], tr: { en: The train had already left. } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Ir a with the infinitive, to: es.futuro-condicional.ir-a-infinitivo }, es: { link: Ir a más infinitivo, to: es.futuro-condicional.ir-a-infinitivo } }, meaning: { en: "plans, the near future", es: "los planes, el futuro cercano" }, ex: [{ target: Voy a viajar }, " en ", { date: julio, value: "--07" }, "."], tr: { en: "I'm going to travel in July." } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular } }, meaning: { en: a fixed plan with a time word, es: un plan fijo con una palabra de tiempo }, ex: ["Mañana ", { target: trabajo }, " temprano."], tr: { en: "I'm working early tomorrow." } }
        - { level: B1, features: { tense: fut }, tense: { en: { link: Future, to: es.futuro-condicional.futuro-simple }, es: { link: Futuro simple, to: es.futuro-condicional.futuro-simple } }, meaning: { en: "predictions, promises", es: "las predicciones, las promesas" }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow. } }
        - { level: B1, features: { mood: cond }, tense: { en: { link: Conditional, to: es.futuro-condicional.condicional-simple }, es: { link: Condicional simple, to: es.futuro-condicional.condicional-simple } }, meaning: { en: "polite wishes, advice", es: "los deseos corteses, los consejos" }, ex: ["Me ", { target: gustaría }, " un café."], tr: { en: "I'd like a coffee." } }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The map runs by time: the present, then the past, then the future."
              es: "El mapa sigue el tiempo: primero el presente, luego el pasado y después el futuro."
          - type: rule
            level: A2
            text:
              en: ["A simple form tells the fact; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio } }] }, " tells it going on; ", { pattern: [{ term: haber }, { slot: past participle }] }, " looks back from a moment."]
              es: ["La forma simple cuenta el hecho; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio } }] }, " lo presenta en curso; ", { pattern: [{ term: haber }, { slot: past participle }] }, " mira atrás desde un momento."]
          - type: note
            level: A2
            text:
              en: ["The key choice in the past: ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["La elección clave en el pasado: ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: Present, es: Presente }
    role: own
    features: { tense: prs }
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense and main use, es: Tiempo y uso principal } }
          - { key: form, label: { en: Form, es: Forma } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, tense: { en: [{ link: Present, to: es.presente.presente-regular }, ": habits, facts, now"], es: [{ link: Presente, to: es.presente.presente-regular }, ": hábitos, hechos, el ahora"] }, form: { alternatives: [hablo, como, vivo] }, ex: ["Siempre ", { target: desayuno }, " café."], tr: { en: I always have coffee for breakfast. } }
          - { level: A2, tense: { en: [{ link: Estar with the gerund, to: es.presente.estar-gerundio }, ": an action going on now"], es: [{ link: Estar más gerundio, to: es.presente.estar-gerundio }, ": una acción en curso ahora"] }, form: { pattern: [{ alternatives: [estoy, estás, está] }, { slot: { en: gerund, es: gerundio } }] }, ex: [{ target: Estoy estudiando }, "."], tr: { en: "I'm studying." } }

  - title: { en: Past, es: Pasado }
    role: own
    features: { tense: pst }
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense and main use, es: Tiempo y uso principal } }
          - { key: form, label: { en: Form, es: Forma } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, tense: { en: [{ link: Present perfect, to: es.pasados.preterito-perfecto }, ": experience, a time up to now"], es: [{ link: Pretérito perfecto, to: es.pasados.preterito-perfecto }, ": la experiencia, un tiempo hasta ahora"] }, form: { pattern: [{ alternatives: [he, has, ha] }, { slot: past participle }] }, ex: ["¿", { target: Has estado }, " en Chile?"], tr: { en: Have you been to Chile? } }
          - { level: A2, tense: { en: [{ link: Preterite, to: es.pasados.preterito-indefinido }, ": a finished event"], es: [{ link: Pretérito indefinido, to: es.pasados.preterito-indefinido }, ": un hecho terminado"] }, form: { alternatives: [hablé, comí, viví] }, ex: ["Ayer ", { target: fui }, " al cine."], tr: { en: I went to the cinema yesterday. } }
          - { level: A2, tense: { en: [{ link: Imperfect, to: es.pasados.preterito-imperfecto }, ": description, habits"], es: [{ link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto }, ": la descripción, los hábitos"] }, form: { alternatives: [hablaba, comía, vivía] }, ex: ["De niño ", { target: vivía }, " en Lima."], tr: { en: As a child I lived in Lima. } }
          - { level: B1, tense: { en: [{ link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, ": an action going on at a past moment"], es: [{ link: Estaba más gerundio, to: es.pasados.indefinido-imperfecto }, ": una acción en curso en un momento pasado"] }, form: { pattern: [{ alternatives: [estaba, estabas, estaba] }, { slot: { en: gerund, es: gerundio } }] }, ex: [{ target: Estaba cocinando }, " cuando llamaste."], tr: { en: I was cooking when you called. } }
          - { level: B1, tense: { en: [{ link: Past perfect, to: es.pasados.pluscuamperfecto }, ": before another past action"], es: [{ link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto }, ": antes de otra acción pasada"] }, form: { pattern: [{ alternatives: [había, habías, había] }, { slot: past participle }] }, ex: ["El tren ya ", { target: había salido }, "."], tr: { en: The train had already left. } }

  - title: { en: Future and conditional, es: Futuro y condicional }
    role: own
    features: [{ tense: fut }, { mood: cond }]
    content:
      - type: usage
        columns:
          - { key: tense, label: { en: Tense and main use, es: Tiempo y uso principal } }
          - { key: form, label: { en: Form, es: Forma } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, tense: { en: [{ link: Ir a with the infinitive, to: es.futuro-condicional.ir-a-infinitivo }, ": plans, the near future"], es: [{ link: Ir a más infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, ": los planes, el futuro cercano"] }, form: { pattern: [{ alternatives: [voy, vas, va] }, a, { slot: infinitive }] }, ex: [{ target: Voy a viajar }, " en ", { date: julio, value: "--07" }, "."], tr: { en: "I'm going to travel in July." } }
          - { level: A2, tense: { en: [{ link: Present, to: es.presente.presente-regular }, ": a fixed plan with a time word"], es: [{ link: Presente, to: es.presente.presente-regular }, ": un plan fijo con una palabra de tiempo"] }, form: { alternatives: [trabajo, salgo] }, ex: ["Mañana ", { target: trabajo }, " temprano."], tr: { en: "I'm working early tomorrow." } }
          - { level: B1, tense: { en: [{ link: Future, to: es.futuro-condicional.futuro-simple }, ": predictions, promises"], es: [{ link: Futuro simple, to: es.futuro-condicional.futuro-simple }, ": las predicciones, las promesas"] }, form: { alternatives: [hablaré, comeré, viviré] }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow. } }
          - { level: B1, tense: { en: [{ link: Conditional, to: es.futuro-condicional.condicional-simple }, ": polite wishes, advice"], es: [{ link: Condicional simple, to: es.futuro-condicional.condicional-simple }, ": los deseos corteses, los consejos"] }, form: { alternatives: [hablaría, comería, viviría] }, ex: { examples: [["Me ", { target: gustaría }, " un café."], [{ target: Deberías }, " descansar."]] }, tr: { en: { examples: ["I'd like a coffee.", You should rest.] } } }

  - title: { en: Signal words, es: Palabras clave }
    role: signals
    content:
      - type: usage
        columns:
          - { key: marker, label: { en: Time word, es: Expresión de tiempo } }
          - { key: tense, label: { en: Tense, es: Tiempo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, marker: "siempre, normalmente, cada día", tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular } }, ex: [{ signal: Normalmente }, " ", { target: como }, " en casa."], tr: { en: I usually eat at home. } }
          - { level: A2, marker: "ahora, en este momento", tense: { en: { link: Estar with the gerund, to: es.presente.estar-gerundio }, es: { link: Estar más gerundio, to: es.presente.estar-gerundio } }, ex: [{ signal: Ahora }, " ", { target: estoy trabajando }, "."], tr: { en: "I'm working now." } }
          - { level: A2, marker: "alguna vez, nunca, ya, todavía no", tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto } }, ex: [{ signal: Nunca }, " ", { target: he visto }, " la nieve."], tr: { en: "I've never seen snow." } }
          - { level: A2, variety: es-ES, marker: "hoy, esta mañana, esta semana", tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto } }, ex: [{ signal: Esta mañana }, " ", { target: he ido }, " al banco."], tr: { en: I went to the bank this morning. } }
          - { level: A2, marker: "ayer, el lunes, el año pasado, hace dos años", tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido } }, ex: [{ signal: El año pasado }, " ", { target: fui }, " a Perú."], tr: { en: Last year I went to Peru. } }
          - { level: A2, variety: es-419, marker: "hoy, esta mañana, esta semana", tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido } }, ex: [{ signal: Esta mañana }, " ", { target: fui }, " al banco."], tr: { en: I went to the bank this morning. } }
          - { level: A2, marker: "antes, de niño, todos los días", tense: { en: { link: Imperfect, to: es.pasados.preterito-imperfecto }, es: { link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto } }, ex: [{ signal: Antes }, " ", { target: vivía }, " en el centro."], tr: { en: I used to live in the centre. } }
          - { level: B1, marker: "mientras, cuando", tense: { en: { link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, es: { link: Estaba más gerundio, to: es.pasados.indefinido-imperfecto } }, ex: [{ signal: Mientras }, " ", { target: estaba cocinando }, ", sonó el teléfono."], tr: { en: "While I was cooking, the phone rang." } }
          - { level: B1, marker: "ya, todavía no, nunca antes", tense: { en: { link: Past perfect, to: es.pasados.pluscuamperfecto }, es: { link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto } }, ex: ["Cuando llegué, ", { signal: ya }, " ", { target: habían cenado }, "."], tr: { en: "When I arrived, they had already had dinner." } }
          - { level: A2, marker: "mañana, la semana que viene, el año próximo", tense: { en: { link: Ir a with the infinitive, to: es.futuro-condicional.ir-a-infinitivo }, es: { link: Ir a más infinitivo, to: es.futuro-condicional.ir-a-infinitivo } }, ex: [{ signal: Mañana }, " ", { target: voy a estudiar }, "."], tr: { en: "I'm going to study tomorrow." } }
          - { level: B1, marker: "dentro de dos años, en el futuro, seguramente", tense: { en: { link: Future, to: es.futuro-condicional.futuro-simple }, es: { link: Futuro simple, to: es.futuro-condicional.futuro-simple } }, ex: [{ signal: Dentro de dos años }, " ", { target: hablaré }, " español."], tr: { en: "In two years, I'll speak Spanish." } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Ayer he ido al médico., right: ["Ayer ", { target: fui }, " al médico."], rule: { en: { takes: [{ term: ayer }, { link: preterite, to: es.pasados.preterito-indefinido }] }, es: { takes: [{ term: ayer }, { link: indefinido, to: es.pasados.preterito-indefinido }] } } }
          - { level: A2, wrong: De niño fui al parque cada día., right: ["De niño ", { target: iba }, " al parque cada día."], rule: { en: { takes: [past habit, { link: imperfect, to: es.pasados.preterito-imperfecto }] }, es: { takes: [hábito pasado, { link: imperfecto, to: es.pasados.preterito-imperfecto }] } } }
          - { level: B1, wrong: Cuando llamaste cociné., right: ["Cuando llamaste, ", { target: estaba cocinando }, "."], rule: { en: { takes: [action going on at a past moment, { link: estaba with the gerund, to: es.pasados.indefinido-imperfecto }] }, es: { takes: [acción en curso en un momento pasado, { link: estaba más gerundio, to: es.pasados.indefinido-imperfecto }] } } }
          - { level: B1, wrong: "Cuando llegué, la clase ya ha empezado.", right: ["Cuando llegué, la clase ya ", { target: había empezado }, "."], rule: { en: { takes: [earlier past action, { link: past perfect, to: es.pasados.pluscuamperfecto }] }, es: { takes: [acción pasada anterior, { link: pluscuamperfecto, to: es.pasados.pluscuamperfecto }] } } }
          - { level: B1, wrong: Me gustaré un café., right: ["Me ", { target: gustaría }, " un café."], rule: { en: { takes: [polite wish, { link: conditional, to: es.futuro-condicional.condicional-simple }] }, es: { takes: [deseo cortés, { link: condicional, to: es.futuro-condicional.condicional-simple }] } } }
          - { level: A2, speakers: [en], wrong: Mañana voy viajar., right: ["Mañana ", { target: voy a viajar }, "."], rule: { en: [{ pattern: [{ term: ir }, { term: a }, { slot: infinitive }] }, ": the ", { term: a }, " always stays"] } }
