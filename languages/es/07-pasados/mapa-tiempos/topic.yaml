        rows:
          - { level: A2, tense: { en: [{ link: Future with ir a, to: es.futuro-condicional.ir-a-infinitivo }, ": plans, the near future"], es: [{ link: Ir a con infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, ": los planes, el futuro cercano"], uk: [{ link: Майбутнє з ir a, to: es.futuro-condicional.ir-a-infinitivo }, ": плани, найближче майбутнє"] }, form: { pattern: [{ alternatives: [voy, vas, va] }, a, { slot: infinitive }] }, ex: [{ target: Voy a viajar }, " en ", { date: julio, value: "--07" }, "."], tr: { en: "I'm going to travel in July.", uk: "У липні я збираюся подорожувати." } }
          - { level: A2, tense: { en: [{ link: Present, to: es.presente.presente-regular }, ": a fixed plan with a time word"], es: [{ link: Presente, to: es.presente.presente-regular }, ": un plan fijo con una palabra de tiempo"], uk: [{ link: Теперішній час, to: es.presente.presente-regular }, ": твердий план зі словом часу"] }, form: { alternatives: [trabajo, salgo] }, ex: ["Mañana ", { target: trabajo }, " temprano."], tr: { en: "I'm working early tomorrow.", uk: "Завтра я працюю з самого ранку." } }
          - { level: B1, tense: { en: [{ link: Future, to: es.futuro-condicional.futuro-simple }, ": predictions, promises"], es: [{ link: Futuro simple, to: es.futuro-condicional.futuro-simple }, ": las predicciones, las promesas"], uk: [{ link: Простий майбутній, to: es.futuro-condicional.futuro-simple }, ": прогнози, обіцянки"] }, form: { alternatives: [hablaré, comeré, viviré] }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow., uk: "Завтра буде дощ." } }
          - { level: B1, tense: { en: [{ link: Conditional, to: es.futuro-condicional.condicional-simple }, ": polite wishes, advice"], es: [{ link: Condicional simple, to: es.futuro-condicional.condicional-simple }, ": los deseos corteses, los consejos"], uk: [{ link: Умовний спосіб, to: es.futuro-condicional.condicional-simple }, ": ввічливі побажання, поради"] }, form: { alternatives: [hablaría, comería, viviría] }, ex: { examples: [["Me ", { target: gustaría }, " un café."], [{ target: Deberías }, " descansar."]] }, tr: { en: { examples: ["I'd like a coffee.", You should rest.] }, uk: { examples: ["Я б хотів кави.", "Тобі варто відпочити."] } } }

