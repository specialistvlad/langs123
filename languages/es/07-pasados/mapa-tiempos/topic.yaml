          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, marker: "siempre, normalmente, cada día", tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular }, uk: { link: Теперішній час, to: es.presente.presente-regular } }, ex: [{ signal: Normalmente }, " ", { target: como }, " en casa."], tr: { en: I usually eat at home., uk: "Зазвичай я їм удома." } }
          - { level: A2, marker: "ahora, en este momento", tense: { en: { link: Present continuous, to: es.presente.estar-gerundio }, es: { link: Estar con gerundio, to: es.presente.estar-gerundio }, uk: { link: Estar з герундієм, to: es.presente.estar-gerundio } }, ex: [{ signal: Ahora }, " ", { target: estoy trabajando }, "."], tr: { en: "I'm working now.", uk: "Зараз я працюю." } }
