        - { level: A2, features: { tense: prs, aspect: prog }, tense: { en: { link: Present continuous, to: es.presente.estar-gerundio }, es: { link: Estar con gerundio, to: es.presente.estar-gerundio }, uk: { link: Estar з герундієм, to: es.presente.estar-gerundio }, pt: { link: "Estar com gerúndio", to: es.presente.estar-gerundio }, fr: { link: "Estar avec le gérondif", to: es.presente.estar-gerundio }, de: { link: "Estar mit Gerundium", to: es.presente.estar-gerundio }, it: { link: "Estar con il gerundio", to: es.presente.estar-gerundio }, pl: { link: "Estar z gerundio", to: es.presente.estar-gerundio }, tr: { link: "Estar ile gerundio", to: es.presente.estar-gerundio }, id: { link: "Estar dengan gerundio", to: es.presente.estar-gerundio }, vi: { link: "Estar với gerundio", to: es.presente.estar-gerundio } }, meaning: { en: an action going on now, es: una acción en curso ahora, uk: "дія, що триває зараз", pt: "uma ação em andamento agora", fr: "une action en cours maintenant", de: "eine Handlung, die gerade abläuft", it: "un'azione in corso adesso", pl: "czynność trwająca teraz", tr: "şu anda süren bir eylem", id: "tindakan yang sedang berlangsung sekarang", vi: "hành động đang diễn ra lúc này" }, ex: [{ target: Estoy estudiando }, "."], tr: { en: "I'm studying.", uk: "Я зараз учуся.", pt: "Estou estudando.", fr: "Je suis en train d’étudier.", de: "Ich lerne gerade.", it: "Sto studiando.", pl: "Uczę się teraz.", tr: "Şu an ders çalışıyorum.", id: "Saya sedang belajar.", vi: "Tôi đang học." } }
        - { level: A2, features: { tense: prs, aspect: prf }, tense: { en: { link: Present perfect, to: es.pasados.preterito-perfecto }, es: { link: Pretérito perfecto, to: es.pasados.preterito-perfecto }, uk: { link: Перфект, to: es.pasados.preterito-perfecto }, pt: { link: "Pretérito perfeito composto", to: es.pasados.preterito-perfecto }, fr: { link: "Passé composé", to: es.pasados.preterito-perfecto }, de: { link: "Perfecto", to: es.pasados.preterito-perfecto }, it: { link: "Perfecto", to: es.pasados.preterito-perfecto }, pl: { link: "Perfecto", to: es.pasados.preterito-perfecto }, tr: { link: "Perfecto", to: es.pasados.preterito-perfecto }, id: { link: "Perfecto", to: es.pasados.preterito-perfecto }, vi: { link: "Hiện tại hoàn thành", to: es.pasados.preterito-perfecto } }, meaning: { en: "experience, a time up to now", es: "la experiencia, un tiempo hasta ahora", uk: "досвід, час аж до тепер", pt: "a experiência, um tempo até agora", fr: "l’expérience, une période qui va jusqu’à maintenant", de: "Erfahrung, eine Zeit bis jetzt", it: "l'esperienza, un periodo fino a ora", pl: "doświadczenie, czas do teraz", tr: "deneyim, şimdiye kadar süren bir zaman", id: "pengalaman, rentang waktu sampai sekarang", vi: "kinh nghiệm, khoảng thời gian cho đến nay" }, ex: ["¿", { target: Has estado }, " en Chile?"], tr: { en: Have you been to Chile?, uk: "Ти бував у Чилі?", pt: "Você já esteve no Chile?", fr: "Es-tu déjà allé au Chili ?", de: "Bist du schon einmal in Chile gewesen?", it: "Sei mai stato in Cile?", pl: "Byłeś kiedyś w Chile?", tr: "Hiç Şili'ye gittin mi?", id: "Apakah kamu pernah ke Chili?", vi: "Bạn đã bao giờ đến Chile chưa?" } }
        - { level: A2, features: { tense: pst, aspect: pfv }, tense: { en: { link: Preterite, to: es.pasados.preterito-indefinido }, es: { link: Pretérito indefinido, to: es.pasados.preterito-indefinido }, uk: { link: Претерит, to: es.pasados.preterito-indefinido }, pt: { link: "Pretérito perfeito simples", to: es.pasados.preterito-indefinido }, fr: { link: "Prétérit", to: es.pasados.preterito-indefinido }, de: { link: "Indefinido", to: es.pasados.preterito-indefinido }, it: { link: "Indefinido", to: es.pasados.preterito-indefinido }, pl: { link: "Indefinido", to: es.pasados.preterito-indefinido }, tr: { link: "Indefinido", to: es.pasados.preterito-indefinido }, id: { link: "Indefinido", to: es.pasados.preterito-indefinido }, vi: { link: "Indefinido", to: es.pasados.preterito-indefinido } }, meaning: { en: a finished event, es: un hecho terminado, uk: "завершена подія", pt: "um fato concluído", fr: "un fait terminé", de: "ein abgeschlossenes Ereignis", it: "un fatto concluso", pl: "zdarzenie zakończone", tr: "bitmiş bir olay", id: "kejadian yang sudah selesai", vi: "sự việc đã kết thúc" }, ex: ["Ayer ", { target: fui }, " al cine."], tr: { en: I went to the cinema yesterday., uk: "Учора я ходив у кіно.", pt: "Ontem fui ao cinema.", fr: "Hier, je suis allé au cinéma.", de: "Gestern war ich im Kino.", it: "Ieri sono andato al cinema.", pl: "Wczoraj byłem w kinie.", tr: "Dün sinemaya gittim.", id: "Kemarin saya pergi ke bioskop.", vi: "Hôm qua tôi đã đi xem phim." } }
        - { level: A2, features: { tense: pst, aspect: ipfv }, tense: { en: { link: Imperfect, to: es.pasados.preterito-imperfecto }, es: { link: Pretérito imperfecto, to: es.pasados.preterito-imperfecto }, uk: { link: Імперфект, to: es.pasados.preterito-imperfecto }, pt: { link: "Pretérito imperfeito", to: es.pasados.preterito-imperfecto }, fr: { link: "Imparfait", to: es.pasados.preterito-imperfecto }, de: { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, it: { link: "Imperfetto", to: es.pasados.preterito-imperfecto }, pl: { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, tr: { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, id: { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, vi: { link: "Imperfecto", to: es.pasados.preterito-imperfecto } }, meaning: { en: "description, habits", es: "la descripción, los hábitos", uk: "опис, звички", pt: "a descrição, os hábitos", fr: "la description, les habitudes", de: "Beschreibung, Gewohnheiten", it: "la descrizione, le abitudini", pl: "opis, zwyczaje", tr: "betimleme, alışkanlıklar", id: "deskripsi, kebiasaan", vi: "miêu tả, thói quen" }, ex: ["De niño ", { target: vivía }, " en Lima."], tr: { en: As a child I lived in Lima., uk: "У дитинстві я жив у Лімі.", pt: "Quando criança, eu morava em Lima.", fr: "Enfant, j’habitais à Lima.", de: "Als Kind wohnte ich in Lima.", it: "Da bambino vivevo a Lima.", pl: "Jako dziecko mieszkałem w Limie.", tr: "Çocukken Lima'da yaşıyordum.", id: "Waktu kecil, saya tinggal di Lima.", vi: "Hồi nhỏ, tôi sống ở Lima." } }
        - { level: B1, features: { tense: pst, aspect: prog }, tense: { en: { link: Estaba with the gerund, to: es.pasados.indefinido-imperfecto }, es: { link: Estaba con gerundio, to: es.pasados.indefinido-imperfecto }, uk: { link: Estaba з герундієм, to: es.pasados.indefinido-imperfecto }, pt: { link: "Estaba com gerúndio", to: es.pasados.indefinido-imperfecto }, fr: { link: "Estaba avec le gérondif", to: es.pasados.indefinido-imperfecto }, de: { link: "Estaba mit Gerundium", to: es.pasados.indefinido-imperfecto }, it: { link: "Estaba con il gerundio", to: es.pasados.indefinido-imperfecto }, pl: { link: "Estaba z gerundio", to: es.pasados.indefinido-imperfecto }, tr: { link: "Estaba ile gerundio", to: es.pasados.indefinido-imperfecto }, id: { link: "Estaba dengan gerundio", to: es.pasados.indefinido-imperfecto }, vi: { link: "Estaba với gerundio", to: es.pasados.indefinido-imperfecto } }, meaning: { en: an action going on at a past moment, es: una acción en curso en un momento pasado, uk: "дія, що тривала в певний момент минулого", pt: "uma ação em andamento em um momento do passado", fr: "une action en cours à un moment du passé", de: "eine Handlung, die zu einem Zeitpunkt in der Vergangenheit ablief", it: "un'azione in corso in un momento del passato", pl: "czynność trwająca w pewnym momencie przeszłości", tr: "geçmişte belirli bir anda süren eylem", id: "tindakan yang sedang berlangsung pada suatu saat di masa lalu", vi: "hành động đang diễn ra tại một thời điểm trong quá khứ" }, ex: [{ target: Estaba cocinando }, " cuando llamaste."], tr: { en: I was cooking when you called., uk: "Я готував їсти, коли ти подзвонив.", pt: "Eu estava cozinhando quando você ligou.", fr: "J’étais en train de cuisiner quand tu as appelé.", de: "Ich kochte gerade, als du angerufen hast.", it: "Stavo cucinando quando hai chiamato.", pl: "Gotowałem, kiedy zadzwoniłeś.", tr: "Sen aradığında yemek yapıyordum.", id: "Saya sedang memasak ketika kamu menelepon.", vi: "Tôi đang nấu ăn thì bạn gọi." } }
        - { level: B1, features: { tense: pst, aspect: prf }, tense: { en: { link: Past perfect, to: es.pasados.pluscuamperfecto }, es: { link: Pluscuamperfecto, to: es.pasados.pluscuamperfecto }, uk: { link: Плюсквамперфект, to: es.pasados.pluscuamperfecto }, pt: { link: "Pretérito mais-que-perfeito", to: es.pasados.pluscuamperfecto }, fr: { link: "Plus-que-parfait", to: es.pasados.pluscuamperfecto }, de: { link: "Plusquamperfekt", to: es.pasados.pluscuamperfecto }, it: { link: "Trapassato prossimo", to: es.pasados.pluscuamperfecto }, pl: { link: "Pluscuamperfecto", to: es.pasados.pluscuamperfecto }, tr: { link: "Pluscuamperfecto", to: es.pasados.pluscuamperfecto }, id: { link: "Pluscuamperfecto", to: es.pasados.pluscuamperfecto }, vi: { link: "Quá khứ hoàn thành", to: es.pasados.pluscuamperfecto } }, meaning: { en: before another past action, es: antes de otra acción pasada, uk: "раніше за іншу минулу дію", pt: "antes de outra ação passada", fr: "avant une autre action passée", de: "vor einer anderen vergangenen Handlung", it: "prima di un'altra azione passata", pl: "przed inną czynnością z przeszłości", tr: "başka bir geçmiş eylemden önce", id: "sebelum tindakan lampau yang lain", vi: "trước một hành động khác trong quá khứ" }, ex: ["El tren ya ", { target: había salido }, "."], tr: { en: The train had already left., uk: "Потяг уже поїхав.", pt: "O trem já tinha saído.", fr: "Le train était déjà parti.", de: "Der Zug war schon abgefahren.", it: "Il treno era già partito.", pl: "Pociąg już odjechał.", tr: "Tren çoktan kalkmıştı.", id: "Kereta itu sudah berangkat.", vi: "Tàu đã rời đi rồi." } }
        - { level: C2, features: { tense: pst, aspect: prf }, tense: { es: { link: Pretérito anterior, to: es.pasados.pluscuamperfecto }, en: { link: "Past anterior", to: es.pasados.pluscuamperfecto }, uk: { link: "Передминулий час", to: es.pasados.pluscuamperfecto }, pt: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto }, fr: { link: "Passé antérieur", to: es.pasados.pluscuamperfecto }, de: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto }, it: { link: "Trapassato remoto", to: es.pasados.pluscuamperfecto }, pl: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto }, tr: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto }, id: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto }, vi: { link: "Pretérito anterior", to: es.pasados.pluscuamperfecto } }, meaning: { es: "inmediatamente antes de otra acción pasada, en el estilo literario", en: "immediately before another past action, in literary style", uk: "безпосередньо перед іншою минулою дією, у літературному стилі", pt: "imediatamente antes de outra ação passada, no estilo literário", fr: "immédiatement avant une autre action passée, dans le style littéraire", de: "unmittelbar vor einer anderen vergangenen Handlung, im literarischen Stil", it: "subito prima di un’altra azione passata, nello stile letterario", pl: "bezpośrednio przed inną czynnością z przeszłości, w stylu literackim", tr: "başka bir geçmiş eylemden hemen önce, edebî üslupta", id: "tepat sebelum tindakan lampau yang lain, dalam gaya sastra", vi: "ngay trước một hành động khác trong quá khứ, theo văn phong văn chương" }, ex: ["Apenas ", { target: hubo amanecido }, ", salieron al campo."], tr: { en: "As soon as dawn broke, they went out to the fields.", uk: "Щойно розвиднилося, вони вийшли в поле.", pt: "Assim que amanheceu, saíram para o campo.", fr: "Dès que le jour s’est levé, ils sont partis aux champs.", de: "Kaum war es Tag geworden, gingen sie hinaus aufs Feld.", it: "Appena fu spuntato il giorno, uscirono in campagna.", pl: "Gdy tylko zaświtało, wyszli w pole.", tr: "Gün ağarır ağarmaz tarlaya çıktılar.", id: "Begitu fajar menyingsing, mereka pergi ke ladang.", vi: "Vừa mới rạng sáng, họ đã ra đồng." } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Future with ir a, to: es.futuro-condicional.ir-a-infinitivo }, es: { link: Ir a con infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, uk: { link: Майбутнє з ir a, to: es.futuro-condicional.ir-a-infinitivo }, pt: { link: "Ir a com infinitivo", to: es.futuro-condicional.ir-a-infinitivo }, fr: { link: "Ir a avec l’infinitif", to: es.futuro-condicional.ir-a-infinitivo }, de: { link: "Ir a mit Infinitiv", to: es.futuro-condicional.ir-a-infinitivo }, it: { link: "Ir a con l'infinito", to: es.futuro-condicional.ir-a-infinitivo }, pl: { link: "Ir a z bezokolicznikiem", to: es.futuro-condicional.ir-a-infinitivo }, tr: { link: "Ir a ile mastar", to: es.futuro-condicional.ir-a-infinitivo }, id: { link: "Ir a dengan infinitif", to: es.futuro-condicional.ir-a-infinitivo }, vi: { link: "Ir a với động từ nguyên thể", to: es.futuro-condicional.ir-a-infinitivo } }, meaning: { en: "plans, the near future", es: "los planes, el futuro cercano", uk: "плани, найближче майбутнє", pt: "os planos, o futuro próximo", fr: "les projets, le futur proche", de: "Pläne, die nahe Zukunft", it: "i piani, il futuro prossimo", pl: "plany, bliska przyszłość", tr: "planlar, yakın gelecek", id: "rencana, masa depan dekat", vi: "kế hoạch, tương lai gần" }, ex: [{ target: Voy a viajar }, " en ", { date: julio, value: "--07" }, "."], tr: { en: "I'm going to travel in July.", uk: "У липні я збираюся подорожувати.", pt: "Vou viajar em julho.", fr: "Je vais voyager en juillet.", de: "Im Juli werde ich verreisen.", it: "A luglio ho intenzione di viaggiare.", pl: "W lipcu zamierzam podróżować.", tr: "Temmuzda seyahat edeceğim.", id: "Saya akan bepergian pada bulan Juli.", vi: "Tháng Bảy tôi sẽ đi du lịch." } }
        - { level: A2, features: { tense: fut }, tense: { en: { link: Present, to: es.presente.presente-regular }, es: { link: Presente, to: es.presente.presente-regular }, uk: { link: Теперішній час, to: es.presente.presente-regular }, pt: { link: "Presente", to: es.presente.presente-regular }, fr: { link: "Présent", to: es.presente.presente-regular }, de: { link: "Präsens", to: es.presente.presente-regular }, it: { link: "Presente", to: es.presente.presente-regular }, pl: { link: "Presente", to: es.presente.presente-regular }, tr: { link: "Presente", to: es.presente.presente-regular }, id: { link: "Presente", to: es.presente.presente-regular }, vi: { link: "Hiện tại", to: es.presente.presente-regular } }, meaning: { en: a fixed plan with a time word, es: un plan fijo con una palabra de tiempo, uk: "твердий план зі словом часу", pt: "um plano certo com uma palavra de tempo", fr: "un projet arrêté avec un mot de temps", de: "ein fester Plan mit einer Zeitangabe", it: "un piano fisso con una parola di tempo", pl: "pewny plan ze słowem określającym czas", tr: "zaman sözcüğüyle belirtilmiş kesin bir plan", id: "rencana pasti dengan kata keterangan waktu", vi: "kế hoạch đã định với từ chỉ thời gian" }, ex: ["Mañana ", { target: trabajo }, " temprano."], tr: { en: "I'm working early tomorrow.", uk: "Завтра я працюю з самого ранку.", pt: "Amanhã eu trabalho cedo.", fr: "Demain, je travaille tôt.", de: "Morgen arbeite ich früh.", it: "Domani lavoro presto.", pl: "Jutro pracuję od rana.", tr: "Yarın erken çalışıyorum.", id: "Besok saya bekerja pagi-pagi.", vi: "Ngày mai tôi làm việc sớm." } }
        - { level: B1, features: { tense: fut }, tense: { en: { link: Future, to: es.futuro-condicional.futuro-simple }, es: { link: Futuro simple, to: es.futuro-condicional.futuro-simple }, uk: { link: Простий майбутній, to: es.futuro-condicional.futuro-simple }, pt: { link: "Futuro simples", to: es.futuro-condicional.futuro-simple }, fr: { link: "Futur simple", to: es.futuro-condicional.futuro-simple }, de: { link: "Futuro simple", to: es.futuro-condicional.futuro-simple }, it: { link: "Futuro semplice", to: es.futuro-condicional.futuro-simple }, pl: { link: "Futuro simple", to: es.futuro-condicional.futuro-simple }, tr: { link: "Futuro simple", to: es.futuro-condicional.futuro-simple }, id: { link: "Futuro simple", to: es.futuro-condicional.futuro-simple }, vi: { link: "Tương lai đơn", to: es.futuro-condicional.futuro-simple } }, meaning: { en: "predictions, promises", es: "las predicciones, las promesas", uk: "прогнози, обіцянки", pt: "as previsões, as promessas", fr: "les prévisions, les promesses", de: "Vorhersagen, Versprechen", it: "le previsioni, le promesse", pl: "przewidywania, obietnice", tr: "tahminler, vaatler", id: "prediksi, janji", vi: "dự đoán, lời hứa" }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow., uk: "Завтра буде дощ.", pt: "Amanhã vai chover.", fr: "Demain, il pleuvra.", de: "Morgen wird es regnen.", it: "Domani pioverà.", pl: "Jutro będzie padać.", tr: "Yarın yağmur yağacak.", id: "Besok akan hujan.", vi: "Ngày mai trời sẽ mưa." } }
        - { level: B1, features: { mood: cond }, tense: { en: { link: Conditional, to: es.futuro-condicional.condicional-simple }, es: { link: Condicional simple, to: es.futuro-condicional.condicional-simple }, uk: { link: Умовний спосіб, to: es.futuro-condicional.condicional-simple }, pt: { link: "Condicional simples", to: es.futuro-condicional.condicional-simple }, fr: { link: "Conditionnel", to: es.futuro-condicional.condicional-simple }, de: { link: "Condicional simple", to: es.futuro-condicional.condicional-simple }, it: { link: "Condizionale", to: es.futuro-condicional.condicional-simple }, pl: { link: "Condicional simple", to: es.futuro-condicional.condicional-simple }, tr: { link: "Condicional simple", to: es.futuro-condicional.condicional-simple }, id: { link: "Condicional simple", to: es.futuro-condicional.condicional-simple }, vi: { link: "Thức điều kiện", to: es.futuro-condicional.condicional-simple } }, meaning: { en: "polite wishes, advice", es: "los deseos corteses, los consejos", uk: "ввічливі побажання, поради", pt: "os desejos educados, os conselhos", fr: "les souhaits polis, les conseils", de: "höfliche Wünsche, Ratschläge", it: "i desideri cortesi, i consigli", pl: "uprzejme życzenia, rady", tr: "nazik istekler, tavsiyeler", id: "permintaan sopan, saran", vi: "mong muốn lịch sự, lời khuyên" }, ex: ["Me ", { target: gustaría }, " un café."], tr: { en: "I'd like a coffee.", uk: "Я б хотів кави.", pt: "Eu gostaria de um café.", fr: "Je voudrais un café.", de: "Ich hätte gern einen Kaffee.", it: "Vorrei un caffè.", pl: "Chciałbym kawę.", tr: "Bir kahve isterdim.", id: "Saya ingin secangkir kopi.", vi: "Tôi muốn một ly cà phê." } }
        - { level: B2, features: { tense: fut, aspect: prf }, tense: { es: { link: Futuro perfecto, to: es.futuro-condicional.futuro-perfecto }, en: { link: "Future perfect", to: es.futuro-condicional.futuro-perfecto }, uk: { link: "Майбутній перфект", to: es.futuro-condicional.futuro-perfecto }, pt: { link: "Futuro perfeito", to: es.futuro-condicional.futuro-perfecto }, fr: { link: "Futur antérieur", to: es.futuro-condicional.futuro-perfecto }, de: { link: "Futuro perfecto", to: es.futuro-condicional.futuro-perfecto }, it: { link: "Futuro anteriore", to: es.futuro-condicional.futuro-perfecto }, pl: { link: "Futuro perfecto", to: es.futuro-condicional.futuro-perfecto }, tr: { link: "Futuro perfecto", to: es.futuro-condicional.futuro-perfecto }, id: { link: "Futuro perfecto", to: es.futuro-condicional.futuro-perfecto }, vi: { link: "Tương lai hoàn thành", to: es.futuro-condicional.futuro-perfecto } }, meaning: { es: "antes de un momento futuro; una suposición sobre el pasado", en: "before a future moment; a guess about the past", uk: "раніше за певний момент у майбутньому; припущення про минуле", pt: "antes de um momento futuro; uma suposição sobre o passado", fr: "avant un moment futur ; une supposition sur le passé", de: "vor einem zukünftigen Zeitpunkt; eine Vermutung über die Vergangenheit", it: "prima di un momento futuro; una supposizione sul passato", pl: "przed pewnym momentem w przyszłości; przypuszczenie o przeszłości", tr: "gelecekteki bir andan önce; geçmiş hakkında bir tahmin", id: "sebelum suatu saat di masa depan; dugaan tentang masa lalu", vi: "trước một thời điểm trong tương lai; một phỏng đoán về quá khứ" }, ex: ["Para el lunes ya ", { target: habré terminado }, "."], tr: { en: "I will have finished by Monday.", uk: "До понеділка я вже закінчу.", pt: "Até segunda-feira já terei terminado.", fr: "D’ici lundi, j’aurai déjà terminé.", de: "Bis Montag werde ich schon fertig sein.", it: "Per lunedì avrò già finito.", pl: "Do poniedziałku już skończę.", tr: "Pazartesiye kadar bitirmiş olacağım.", id: "Pada hari Senin saya sudah selesai.", vi: "Đến thứ Hai tôi đã làm xong rồi." } }
        - { level: B2, features: { mood: cond, aspect: prf }, tense: { es: { link: Condicional compuesto, to: es.futuro-condicional.condicional-compuesto }, en: { link: "Conditional perfect", to: es.futuro-condicional.condicional-compuesto }, uk: { link: "Умовний перфект", to: es.futuro-condicional.condicional-compuesto }, pt: { link: "Condicional composto", to: es.futuro-condicional.condicional-compuesto }, fr: { link: "Conditionnel passé", to: es.futuro-condicional.condicional-compuesto }, de: { link: "Condicional compuesto", to: es.futuro-condicional.condicional-compuesto }, it: { link: "Condizionale composto", to: es.futuro-condicional.condicional-compuesto }, pl: { link: "Condicional compuesto", to: es.futuro-condicional.condicional-compuesto }, tr: { link: "Condicional compuesto", to: es.futuro-condicional.condicional-compuesto }, id: { link: "Condicional compuesto", to: es.futuro-condicional.condicional-compuesto }, vi: { link: "Thức điều kiện hoàn thành", to: es.futuro-condicional.condicional-compuesto } }, meaning: { es: "el resultado irreal en el pasado", en: "the unreal result in the past", uk: "нереальний результат у минулому", pt: "o resultado irreal no passado", fr: "le résultat irréel dans le passé", de: "das unwirkliche Ergebnis in der Vergangenheit", it: "il risultato irreale nel passato", pl: "nierealny wynik w przeszłości", tr: "geçmişteki gerçekleşmemiş sonuç", id: "hasil yang tidak nyata di masa lampau", vi: "kết quả không có thật trong quá khứ" }, ex: ["Con más tiempo, ", { target: habría visitado }, " el museo."], tr: { en: "With more time, I would have visited the museum.", uk: "Якби було більше часу, я б відвідав музей.", pt: "Com mais tempo, eu teria visitado o museu.", fr: "Avec plus de temps, j’aurais visité le musée.", de: "Mit mehr Zeit hätte ich das Museum besucht.", it: "Con più tempo avrei visitato il museo.", pl: "Gdybym miał więcej czasu, zwiedziłbym muzeum.", tr: "Daha çok zamanım olsaydı müzeyi gezerdim.", id: "Dengan lebih banyak waktu, saya akan mengunjungi museum itu.", vi: "Nếu có thêm thời gian, tôi đã tham quan bảo tàng rồi." } }
        - { level: B2, features: { mood: sbjv, tense: pst }, tense: { es: { link: Imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, en: { link: "Imperfect subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, uk: { link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, pt: { link: "Imperfeito do subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, fr: { link: "Imparfait du subjonctif", to: es.subjuntivo.subjuntivo-imperfecto }, de: { link: "Konjunktiv Imperfecto", to: es.subjuntivo.subjuntivo-imperfecto }, it: { link: "Imperfetto del congiuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, pl: { link: "Imperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-imperfecto }, tr: { link: "Dilek kipinin imperfecto zamanı", to: es.subjuntivo.subjuntivo-imperfecto }, id: { link: "Imperfecto subjungtif", to: es.subjuntivo.subjuntivo-imperfecto }, vi: { link: "Imperfecto của thức giả định", to: es.subjuntivo.subjuntivo-imperfecto } }, meaning: { es: "deseos en el pasado; condiciones irreales del presente", en: "wishes in the past; unreal conditions in the present", uk: "бажання в минулому; нереальні умови в теперішньому", pt: "desejos no passado; condições irreais do presente", fr: "souhaits dans le passé ; conditions irréelles du présent", de: "Wünsche in der Vergangenheit; irreale Bedingungen der Gegenwart", it: "desideri nel passato; condizioni irreali del presente", pl: "życzenia w przeszłości; nierealne warunki w teraźniejszości", tr: "geçmişteki istekler; şimdiki zamana ait gerçekdışı koşullar", id: "keinginan di masa lampau; syarat tidak nyata untuk masa kini", vi: "mong muốn trong quá khứ; điều kiện không có thật ở hiện tại" }, ex: ["Si ", { target: tuviera }, " tiempo, viajaría más."], tr: { en: "If I had time, I would travel more.", uk: "Якби в мене був час, я б більше подорожував.", pt: "Se eu tivesse tempo, viajaria mais.", fr: "Si j’avais le temps, je voyagerais plus.", de: "Wenn ich Zeit hätte, würde ich mehr reisen.", it: "Se avessi tempo, viaggerei di più.", pl: "Gdybym miał czas, podróżowałbym więcej.", tr: "Zamanım olsa daha çok seyahat ederdim.", id: "Kalau saya punya waktu, saya akan lebih sering bepergian.", vi: "Nếu có thời gian, tôi sẽ đi du lịch nhiều hơn." } }
        - { level: B2, features: { mood: sbjv, tense: pst, aspect: prf }, tense: { es: { link: Pluscuamperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-compuesto }, en: { link: "Past perfect subjunctive", to: es.subjuntivo.subjuntivo-compuesto }, uk: { link: "Плюсквамперфект суб’юнктива", to: es.subjuntivo.subjuntivo-compuesto }, pt: { link: "Mais-que-perfeito do subjuntivo", to: es.subjuntivo.subjuntivo-compuesto }, fr: { link: "Plus-que-parfait du subjonctif", to: es.subjuntivo.subjuntivo-compuesto }, de: { link: "Konjunktiv Plusquamperfekt", to: es.subjuntivo.subjuntivo-compuesto }, it: { link: "Trapassato del congiuntivo", to: es.subjuntivo.subjuntivo-compuesto }, pl: { link: "Pluscuamperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-compuesto }, tr: { link: "Dilek kipinin pluscuamperfecto zamanı", to: es.subjuntivo.subjuntivo-compuesto }, id: { link: "Pluscuamperfecto subjungtif", to: es.subjuntivo.subjuntivo-compuesto }, vi: { link: "Pluscuamperfecto của thức giả định", to: es.subjuntivo.subjuntivo-compuesto } }, meaning: { es: "condiciones irreales del pasado", en: "unreal conditions in the past", uk: "нереальні умови в минулому", pt: "condições irreais do passado", fr: "conditions irréelles du passé", de: "irreale Bedingungen der Vergangenheit", it: "condizioni irreali del passato", pl: "nierealne warunki w przeszłości", tr: "geçmişe ait gerçekdışı koşullar", id: "syarat tidak nyata untuk masa lampau", vi: "điều kiện không có thật trong quá khứ" }, ex: ["Si ", { target: hubiera salido }, " antes, habría llegado."], tr: { en: "If I had left earlier, I would have arrived.", uk: "Якби я вийшов раніше, я б дістався.", pt: "Se eu tivesse saído antes, teria chegado.", fr: "Si j’étais parti plus tôt, je serais arrivé.", de: "Wenn ich früher losgegangen wäre, wäre ich angekommen.", it: "Se fossi uscito prima, sarei arrivato.", pl: "Gdybym wyszedł wcześniej, dotarłbym.", tr: "Daha erken çıkmış olsaydım varmış olurdum.", id: "Seandainya saya berangkat lebih awal, saya sudah tiba.", vi: "Nếu tôi đã đi sớm hơn, tôi đã đến nơi." } }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The map runs by time: the present, then the past, then the future."
              es: "El mapa sigue el tiempo: primero el presente, luego el pasado y después el futuro."
              uk: "Мапа йде за часом: спершу теперішнє, потім минуле, потім майбутнє."
              pt: "O mapa segue o tempo: primeiro o presente, depois o passado e em seguida o futuro."
              fr: "La carte suit le temps : le présent, puis le passé, puis le futur."
              de: "Die Karte folgt der Zeit: erst die Gegenwart, dann die Vergangenheit, dann die Zukunft."
              it: "La mappa segue il tempo: prima il presente, poi il passato, poi il futuro."
              pl: "Mapa idzie za czasem: najpierw teraźniejszość, potem przeszłość, potem przyszłość."
              tr: "Harita zamanı izler: önce şimdiki zaman, sonra geçmiş, sonra gelecek."
              id: "Peta ini mengikuti waktu: lebih dulu masa kini, lalu masa lalu, lalu masa depan."
              vi: "Sơ đồ đi theo thời gian: hiện tại trước, rồi quá khứ, rồi tương lai."
          - type: rule
            level: A2
            text:
              en: ["A simple form tells the fact; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, " tells it going on; ", { pattern: [{ term: haber }, { slot: past participle }] }, " looks back from a moment."]
              es: ["La forma simple cuenta el hecho; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, " lo presenta en curso; ", { pattern: [{ term: haber }, { slot: past participle }] }, " mira atrás desde un momento."]
              uk: ["Проста форма позначає факт; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: герундій, pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, " показує дію в процесі; ", { pattern: [{ term: haber }, { slot: { en: past participle, es: participio pasado, uk: дієприкметник } }] }, " озирається назад від певного моменту."]
              pt: ["A forma simples conta o fato; ", { pattern: [{ term: estar }, { slot: { en: gerund, es: gerundio, uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundium", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, " o apresenta em andamento; ", { pattern: [{ term: haber }, { slot: past participle }] }, " olha para trás a partir de um momento."]
