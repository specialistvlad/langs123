            text: { es: "En el español de América no se usa: el indefinido o el pluscuamperfecto ocupan su lugar.", en: "In the Spanish of the Americas it is not used: the preterite or the past perfect takes its place.", uk: "В іспанській мові Америки його не вживають: його місце посідає претерит або плюсквамперфект.", pt: "No espanhol da América não se usa: o pretérito perfeito simples ou o mais-que-perfeito ocupa o seu lugar.", fr: "Dans l’espagnol d’Amérique, il ne s’emploie pas : le prétérit ou le plus-que-parfait prend sa place.", de: "Im amerikanischen Spanisch wird es nicht verwendet: An seine Stelle tritt das Indefinido oder das Plusquamperfekt.", it: "Nello spagnolo d’America non si usa: al suo posto stanno l’indefinido o il trapassato prossimo.", pl: "W hiszpańskim Ameryki nie jest używany: jego miejsce zajmuje indefinido lub czas zaprzeszły.", tr: "Amerika İspanyolcasında kullanılmaz: yerini indefinido ya da pluscuamperfecto alır.", id: "Dalam bahasa Spanyol Amerika, bentuk ini tidak dipakai: tempatnya diambil oleh indefinido atau pluscuamperfecto.", vi: "Trong tiếng Tây Ban Nha ở châu Mỹ, thì này không được dùng: quá khứ đơn hoặc quá khứ hoàn thành thay thế vị trí của nó." }
            ex: ["En cuanto ", { target: saludó }, " a todos, se sentó."]
            tr: { en: "As soon as he greeted everyone, he sat down.", uk: "Щойно він привітався з усіма, він сів.", pt: "Assim que cumprimentou todos, ele se sentou.", fr: "Dès qu’il a salué tout le monde, il s’est assis.", de: "Sobald er alle begrüßt hatte, setzte er sich.", it: "Appena salutò tutti, si sedette.", pl: "Gdy tylko przywitał się ze wszystkimi, usiadł.", tr: "Herkesi selamlar selamlamaz oturdu.", id: "Begitu dia menyapa semua orang, dia duduk.", vi: "Vừa chào mọi người, anh ấy ngồi xuống." }

