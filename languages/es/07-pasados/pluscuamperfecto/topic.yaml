translated: { en: "7a01af 81232c 4d9723 f02992 073032 8303f0 491444 b4c17c", uk: "7a01af 81232c 4d9723 f02992 073032 8303f0 491444 b4c17c" }

title: { en: "Past Perfect: había comido", es: "El pluscuamperfecto: había comido", uk: "Плюсквамперфект: había comido" }
summary:
  lead:
    en: ["The past perfect, ", { term: había }, " with a participle, tells an action that came before another past action: ", { term: ya había salido }, "."]
    es: ["El pluscuamperfecto, ", { term: había }, " con un participio, cuenta una acción anterior a otra acción pasada: ", { term: ya había salido }, "."]
    uk: ["Плюсквамперфект, ", { term: había }, " з дієприкметником, передає дію, що відбулася раніше за іншу минулу дію: ", { term: ya había salido }, "."]
  rule:
    en: ["The earlier action takes ", { term: había }, " and the participle; the later one takes the preterite:"]
    es: ["La acción anterior lleva ", { term: había }, " y el participio; la posterior lleva el indefinido:"]
    uk: ["Раніша дія стоїть у формі ", { term: había }, " з дієприкметником; пізніша — у простому минулому:"]
  ex: ["Cuando llegué, la película ya ", { target: había empezado }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: B1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: { pattern: [{ alternatives: [{ term: había }, { term: habías }, { term: había }, { term: habíamos }, { term: habían }] }, { slot: past participle }] }
            es: { pattern: [{ alternatives: [{ term: había }, { term: habías }, { term: había }, { term: habíamos }, { term: habían }] }, { slot: past participle }] }
            uk: { pattern: [{ alternatives: [{ term: había }, { term: habías }, { term: había }, { term: habíamos }, { term: habían }] }, { slot: { en: past participle, es: participio pasado, uk: дієприкметник } }] }
          ex: ["Ya ", { target: habíamos cenado }, "."]
          tr: { en: We had already had dinner., uk: "Ми вже повечеряли." }
        - level: B1
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vosotros }, ": ", { pattern: [{ term: habíais }, { slot: past participle }] }]
            es: [{ term: vosotros }, ": ", { pattern: [{ term: habíais }, { slot: past participle }] }]
            uk: [{ term: vosotros }, ": ", { pattern: [{ term: habíais }, { slot: { en: past participle, es: participio pasado, uk: дієприкметник } }] }]
          ex: ["¿", { target: Habíais estado }, " antes en Madrid?"]
          tr: { en: Had you been to Madrid before?, uk: "Ви раніше бували в Мадриді?" }
        - level: B1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["the participles of the present perfect: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: roto }]
            es: ["los participios del pretérito perfecto: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: roto }]
            uk: ["дієприкметники перфекта: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: roto }]
          ex: ["¿Quién ", { target: había roto }, " la ventana?"]
          tr: { en: Who had broken the window?, uk: "Хто розбив вікно?" }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "an action before another past action"
            es: "una acción anterior a otra acción pasada"
            uk: "дія раніше за іншу минулу дію"
          ex: ["Cuando llegué, el tren ya ", { target: había salido }, "."]
          tr: { en: "When I arrived, the train had already left.", uk: "Коли я прийшов, потяг уже поїхав." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: ["experience up to a past moment, with ", { term: nunca }]
            es: ["la experiencia hasta un momento pasado, con ", { term: nunca }]
            uk: ["досвід аж до певного моменту в минулому, з ", { term: nunca }]
          ex: [{ signal: Nunca }, " ", { target: había comido }, " ceviche ", { signal: antes }, "."]
          tr: { en: I had never eaten ceviche before., uk: "Я ніколи раніше не їв севіче." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "the cause of a past situation"
            es: "la causa de una situación pasada"
            uk: "причина минулої ситуації"
          ex: ["Estaba cansada porque ", { target: había trabajado }, " mucho."]
          tr: { en: She was tired because she had worked a lot., uk: "Вона була втомлена, бо багато працювала." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "what someone said about an earlier action"
            es: "lo que alguien dijo sobre una acción anterior"
            uk: "що хтось сказав про раніше дію"
          ex: ["Me dijo que ", { target: había perdido }, " el tren."]
          tr: { en: She told me she had missed the train., uk: "Вона сказала мені, що спізнилася на потяг." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["pronouns and ", { term: no }, " go before ", { term: había }]
            es: ["los pronombres y ", { term: no }, " van delante de ", { term: había }]
            uk: ["займенники та ", { term: no }, " стоять перед ", { term: había }]
          ex: ["Ya ", { target: lo había leído }, "."]
          tr: { en: I had already read it., uk: "Я вже це прочитав." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The past perfect looks back from a past moment to an earlier one."
              es: "El pluscuamperfecto mira desde un momento pasado hacia otro anterior."
              uk: "Плюсквамперфект дивиться з моменту в минулому на ще раніший."
            ex: ["Cuando llamé, Ana ya ", { target: se había ido }, "."]
            tr: { en: "When I called, Ana had already left.", uk: "Коли я подзвонив, Ана вже пішла." }
          - type: note
            level: B1
            text:
              en: ["Spanish grammars call it ", { term: pretérito pluscuamperfecto }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito pluscuamperfecto }, "."]
              uk: ["Іспанські граматики називають його ", { term: pretérito pluscuamperfecto }, "."]

  - title: { en: "Form: había and the participle", es: "Forma: había y el participio", uk: "Форма: había і дієприкметник" }
    role: form
    features: { tense: pst, aspect: prf }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: haber, label: haber }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, haber: { aux: había }, ar: [{ aux: había }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: había }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, haber: { aux: habías }, ar: [{ aux: habías }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habías }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, haber: { aux: había }, ar: [{ aux: había }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: había }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, haber: { aux: habíamos }, ar: [{ aux: habíamos }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habíamos }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, haber: { aux: habíais }, ar: [{ aux: habíais }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habíais }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, haber: { aux: habían }, ar: [{ aux: habían }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habían }, " ", { target: [com, { ending: ido }] }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: había }, " is the imperfect of ", { term: haber }, ", and the participle is the one of the ", { link: present perfect, to: es.pasados.preterito-perfecto }, "."]
              es: [{ term: había }, " es el imperfecto de ", { term: haber }, ", y el participio es el del ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, "."]
              uk: [{ term: había }, " — це імперфект від ", { term: haber }, ", а дієприкметник той самий, що в ", { link: перфекті, to: es.pasados.preterito-perfecto }, "."]
          - type: rule
            level: B1
            text:
              en: ["Irregular participles stay irregular: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              es: ["Los participios irregulares siguen siendo irregulares: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              uk: ["Неправильні дієприкметники лишаються неправильними: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
            ex: ["¿Quién ", { target: había roto }, " la ventana?"]
            tr: { en: Who had broken the window?, uk: "Хто розбив вікно?" }
          - type: rule
            level: B1
            text:
              en: ["Object pronouns and ", { term: no }, " go before ", { term: había }, ", and nothing goes between ", { term: había }, " and the participle:"]
              es: ["Los pronombres de objeto y ", { term: no }, " van delante de ", { term: había }, ", y nada se pone entre ", { term: había }, " y el participio:"]
              uk: ["Займенники-додатки та ", { term: no }, " стоять перед ", { term: había }, ", і між ", { term: había }, " та дієприкметником нічого не ставлять:"]
            ex: { examples: [["No ", { target: lo había visto }, "."], ["Ya ", { target: te lo había dicho }, "."]] }
            tr: { en: { examples: ["I hadn't seen it.", I had already told you.] }, uk: { examples: ["Я цього не бачив.", "Я ж тобі вже казав."] } }

  - title: { en: Use, es: Uso, uk: "Вживання" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: B1, use: { en: An action before another past action, es: Una acción anterior a otra acción pasada, uk: "Дія раніше за іншу минулу дію" }, ex: ["Cuando llegué, el tren ya ", { target: había salido }, "."], tr: { en: "When I arrived, the train had already left.", uk: "Коли я прийшов, потяг уже поїхав." } }
          - { level: B1, use: { en: Experience up to a past moment, es: La experiencia hasta un momento pasado, uk: "Досвід аж до певного моменту в минулому" }, ex: [{ signal: Nunca }, " ", { target: había comido }, " ceviche ", { signal: antes }, "."], tr: { en: I had never eaten ceviche before., uk: "Я ніколи раніше не їв севіче." } }
          - { level: B1, use: { en: The cause of a past situation, es: La causa de una situación pasada, uk: "Причина минулої ситуації" }, ex: ["Estaba cansada porque ", { target: había trabajado }, " mucho."], tr: { en: She was tired because she had worked a lot., uk: "Вона була втомлена, бо багато працювала." } }
          - { level: B1, use: { en: What someone said about an earlier action, es: Lo que alguien dijo sobre una acción anterior, uk: "Що хтось сказав про раніше дію" }, ex: ["Me dijo que ", { target: había perdido }, " el tren."], tr: { en: She told me she had missed the train., uk: "Вона сказала мені, що спізнилася на потяг." } }

  - title: { en: Signal words, es: Palabras clave, uk: "Слова-маркери" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: marker, label: { en: Time word, es: Expresión de tiempo, uk: "Слово-маркер" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: B1, marker: "ya, todavía no", ex: ["A las diez ", { signal: todavía no }, " ", { target: había terminado }, "."], tr: { en: "At ten I still hadn't finished.", uk: "О десятій я ще не закінчив." } }
          - { level: B1, marker: "nunca, antes, hasta entonces", ex: [{ signal: Hasta entonces }, " nunca ", { target: había volado }, "."], tr: { en: Until then I had never flown., uk: "До того я ніколи не літав літаком." } }

  - title: { en: "Compare: preterite and past perfect", es: "Comparación: indefinido y pluscuamperfecto", uk: "Порівняння: простий минулий і плюсквамперфект" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: preterite, label: { en: Preterite, es: Indefinido, uk: "Простий минулий" }, features: { tense: pst, aspect: pfv } }
          - { key: pluperfect, label: { en: Past perfect, es: Pluscuamperfecto, uk: "Плюсквамперфект" }, features: { tense: pst, aspect: prf } }
        rows:
          - { level: B1, preterite: { en: "events told in the order they happened", es: "los hechos en el orden en que pasaron", uk: "події в тому порядку, у якому вони сталися" }, pluperfect: { en: "an event earlier than another past event", es: "un hecho anterior a otro hecho pasado", uk: "подія, раніша за іншу минулу подію" } }
          - level: B1
            preterite: { ex: ["La clase ", { target: empezó }, " y luego ", { target: llegué }, "."], tr: { en: The class started and then I arrived., uk: "Заняття почалося, а потім прийшов я." } }
            pluperfect: { ex: [{ target: Llegué }, " a las nueve, pero la clase ya ", { target: había empezado }, "."], tr: { en: "I arrived at nine, but the class had already started.", uk: "Я прийшов о дев’ятій, але заняття вже почалося." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Cuando llegué, la película ya ha empezado.", right: ["Cuando llegué, la película ya ", { target: había empezado }, "."], rule: { en: ["before a past moment: ", { term: había }, ", not ", { term: ha }], es: ["antes de un momento pasado: ", { term: había }, ", no ", { term: ha }], uk: ["перед моментом у минулому: ", { term: había }, ", а не ", { term: ha }] } }
          - { level: B1, wrong: Ya había lo visto., right: ["Ya ", { target: lo había visto }, "."], rule: { en: ["the pronoun goes before ", { term: había }], es: ["el pronombre va delante de ", { term: había }], uk: ["займенник стоїть перед ", { term: había }] } }
          - { level: B1, wrong: Había ya terminado., right: ["Ya ", { target: había terminado }, "."], rule: { en: ["nothing goes between ", { term: había }, " and the participle"], es: ["nada se pone entre ", { term: había }, " y el participio"], uk: ["між ", { term: había }, " і дієприкметником нічого не ставлять"] } }
          - { level: B1, wrong: Me dijo que había ponido la mesa., right: ["Me dijo que ", { target: había puesto }, " la mesa."], rule: { en: ["irregular participle: ", { mapping: [{ term: poner }, { term: puesto }] }], es: ["participio irregular: ", { mapping: [{ term: poner }, { term: puesto }] }], uk: ["неправильний дієприкметник: ", { mapping: [{ term: poner }, { term: puesto }] }] } }
          - { level: B1, speakers: [en], wrong: Yo tenía comido antes., right: ["Yo ", { target: había comido }, " antes."], rule: { en: ["to say “I had eaten”, the helper is ", { term: haber }, ", not ", { term: tener }] } }
          - { level: B1, speakers: [uk], wrong: "Cuando llegué, el tren ya salió.", right: ["Cuando llegué, el tren ya ", { target: había salido }, "."], rule: { uk: ["дія, що сталася раніше за інший момент у минулому, — плюсквамперфект; українською тут просто «вже поїхав», а іспанською — ", { term: ya había salido }] } }
