id: es.pasados.pluscuamperfecto
lang: es
kind: grammar
tags: [verbs, tenses, past, perfect, haber]
concepts: [past-perfect]
related: [es.pasados.preterito-perfecto, es.pasados.preterito-indefinido, es.pasados.indefinido-imperfecto, es.pasados.verbos-irregulares, es.oracion.estilo-indirecto-pasiva]
