          rule: { es: "un pensamiento o un plan que no se cumplió", en: "a thought or plan that did not come true", uk: "думка чи план, що не здійснилися", pt: "um pensamento ou um plano que não se cumpriu", fr: "une pensée ou un projet qui ne s’est pas réalisé", de: "ein Gedanke oder Plan, der nicht verwirklicht wurde", it: "un pensiero o un piano che non si è realizzato", pl: "myśl lub plan, który się nie spełnił", tr: "gerçekleşmeyen bir düşünce ya da plan", id: "pikiran atau rencana yang tidak terlaksana", vi: "một ý định hoặc kế hoạch không thành" }
          ex: [{ target: Había pensado }, " ir al cine, pero me quedé en casa."]
          tr: { en: "I had thought of going to the cinema, but I stayed at home.", uk: "Я збирався піти в кіно, але залишився вдома.", pt: "Eu tinha pensado em ir ao cinema, mas fiquei em casa.", fr: "J’avais pensé aller au cinéma, mais je suis resté à la maison.", de: "Ich hatte daran gedacht, ins Kino zu gehen, aber ich bin zu Hause geblieben.", it: "Avevo pensato di andare al cinema, ma sono rimasto a casa.", pl: "Zamierzałem pójść do kina, ale zostałem w domu.", tr: "Sinemaya gitmeyi düşünmüştüm ama evde kaldım.", id: "Saya sudah berpikir untuk pergi ke bioskop, tetapi saya tetap di rumah.", vi: "Tôi đã định đi xem phim, nhưng rồi tôi ở nhà." }
        - level: C1
          point: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
          rule: { es: "un conato: la acción estuvo a punto de ocurrir", en: "a near miss: the action was about to happen", uk: "ледь не: дія майже відбулася", pt: "uma quase-ação: a ação esteve prestes a ocorrer", fr: "un quasi-passage à l’acte : l’action a failli se produire", de: "ein Beinahe: Die Handlung stand kurz bevor", it: "un tentativo mancato: l’azione stava per avvenire", pl: "o mały włos: czynność była bliska wykonania", tr: "az kalsın: eylem gerçekleşmek üzereydi", id: "nyaris terjadi: tindakan itu hampir terjadi", vi: "suýt nữa: hành động đã sắp xảy ra" }
          ex: ["Esa tarde ", { target: había estado a punto de }, " renunciar."]
          tr: { en: "That afternoon he had been about to resign.", uk: "Того дня по обіді він ледь не звільнився.", pt: "Naquela tarde, ele esteve a ponto de pedir demissão.", fr: "Cet après-midi-là, il avait été sur le point de démissionner.", de: "An jenem Nachmittag hätte er beinahe gekündigt.", it: "Quel pomeriggio era stato sul punto di dimettersi.", pl: "Tego popołudnia był bliski rezygnacji.", tr: "O öğleden sonra istifa etmek üzereydi.", id: "Sore itu dia nyaris mengundurkan diri.", vi: "Chiều hôm đó, anh ấy suýt nữa đã xin nghỉ việc." }
        - level: C2
