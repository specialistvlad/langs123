title: { en: "Past Perfect: había comido", es: "El pluscuamperfecto: había comido", uk: "Плюсквамперфект: había comido", pt: "O pretérito mais-que-perfeito: había comido", fr: "Le plus-que-parfait : había comido", de: "Das Plusquamperfekt: había comido", it: "Il trapassato prossimo: había comido", pl: "Czas zaprzeszły: había comido", tr: "Pluscuamperfecto: había comido", id: "Pluscuamperfecto: había comido", vi: "Quá khứ hoàn thành: había comido" }
summary:
  lead:
    en: ["The past perfect, ", { term: había }, " with a participle, tells an action that came before another past action: ", { term: ya había salido }, "."]
    es: ["El pluscuamperfecto, ", { term: había }, " con un participio, cuenta una acción anterior a otra acción pasada: ", { term: ya había salido }, "."]
    uk: ["Плюсквамперфект, ", { term: había }, " з дієприкметником, передає дію, що відбулася раніше за іншу минулу дію: ", { term: ya había salido }, "."]
    pt: ["O pretérito mais-que-perfeito, ", { term: había }, " com um particípio, conta uma ação anterior a outra ação passada: ", { term: ya había salido }, "."]
    fr: ["Le plus-que-parfait, ", { term: había }, " avec un participe passé, raconte une action antérieure à une autre action passée : ", { term: ya había salido }, "."]
    de: ["Das Plusquamperfekt, ", { term: había }, " mit einem Partizip, erzählt eine Handlung, die vor einer anderen vergangenen Handlung liegt: ", { term: ya había salido }, "."]
    it: ["Il trapassato prossimo, ", { term: había }, " più un participio, racconta un'azione anteriore a un'altra azione passata: ", { term: ya había salido }, "."]
    pl: ["Czas zaprzeszły, czyli ", { term: había }, " z imiesłowem, opowiada o czynności wcześniejszej niż inna czynność przeszła: ", { term: ya había salido }, "."]
    tr: ["Pluscuamperfecto, yani ", { term: había }, " ile bir participio, başka bir geçmiş eylemden önce olan eylemi anlatır: ", { term: ya había salido }, "."]
    id: ["Pluscuamperfecto, yaitu ", { term: había }, " dengan participio, menceritakan tindakan yang terjadi sebelum tindakan lampau lainnya: ", { term: ya había salido }, "."]
    vi: ["Quá khứ hoàn thành, ", { term: había }, " với quá khứ phân từ, nói về hành động xảy ra trước một hành động quá khứ khác: ", { term: ya había salido }, "."]
  rule:
    en: ["The earlier action takes ", { term: había }, " and the participle; the later one takes the preterite:"]
    es: ["La acción anterior lleva ", { term: había }, " y el participio; la posterior lleva el indefinido:"]
    uk: ["Раніша дія стоїть у формі ", { term: había }, " з дієприкметником; пізніша — у претериті:"]
    pt: ["A ação anterior leva ", { term: había }, " e o particípio; a posterior leva o pretérito perfeito simples:"]
    fr: ["L’action antérieure prend ", { term: había }, " et le participe passé ; la postérieure prend le prétérit :"]
    de: ["Die frühere Handlung steht mit ", { term: había }, " und dem Partizip; die spätere steht im ", { term: indefinido }, ":"]
    it: ["L'azione anteriore usa ", { term: había }, " e il participio; quella posteriore usa l'", { term: indefinido }, ":"]
    pl: ["Czynność wcześniejsza ma ", { term: había }, " i imiesłów, a późniejsza ma ", { term: indefinido }, ":"]
    tr: ["Önce olan eylem ", { term: había }, " ve participio ile kurulur; sonra olan eylem ", { term: indefinido }, " ile kurulur:"]
    id: ["Tindakan yang lebih dulu memakai ", { term: había }, " dan participio; tindakan yang kemudian memakai ", { term: indefinido }, ":"]
    vi: ["Hành động trước dùng ", { term: había }, " và quá khứ phân từ; hành động sau dùng ", { term: indefinido }, ":"]
  ex: ["Cuando llegué, la película ya ", { target: había empezado }, "."]

