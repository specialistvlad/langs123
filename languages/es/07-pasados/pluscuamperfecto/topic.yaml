        items:
          - type: rule
            level: B1
            text:
              en: "The past perfect looks back from a past moment to an earlier one."
              es: "El pluscuamperfecto mira desde un momento pasado hacia otro anterior."
              uk: "Плюсквамперфект описує дію, що сталася ще раніше за інший момент у минулому."
              pt: "O pretérito mais-que-perfeito olha de um momento passado para outro anterior."
