          rule: { es: "la cortesía: una pregunta sobre una petición reciente", en: "politeness: a question about a recent request", uk: "чемність: питання про недавнє прохання", pt: "a cortesia: uma pergunta sobre um pedido recente", fr: "la politesse : une question sur une demande récente", de: "die Höflichkeit: eine Frage zu einer kürzlichen Bitte", it: "la cortesia: una domanda su una richiesta recente", pl: "uprzejmość: pytanie o niedawną prośbę", tr: "nezaket: yakın zamandaki bir istekle ilgili soru", id: "kesopanan: pertanyaan tentang permintaan yang baru saja diajukan", vi: "phép lịch sự: câu hỏi về một yêu cầu vừa rồi" }
          ex: ["Perdone, señora, ¿me ", { target: había llamado }, "?"]
          tr: { en: "Excuse me, madam, did you call me?", uk: "Перепрошую, пані, ви мене кликали?", pt: "Desculpe, senhora, a senhora me chamou?", fr: "Pardon, madame, vous m’aviez appelé ?", de: "Entschuldigen Sie, haben Sie mich gerufen?", it: "Scusi, signora, mi aveva chiamato?", pl: "Przepraszam panią, czy pani mnie wołała?", tr: "Affedersiniz hanımefendi, beni mi çağırmıştınız?", id: "Maaf, Bu, tadi Ibu memanggil saya?", vi: "Xin lỗi bà, bà vừa gọi tôi phải không?" }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["pronouns and ", { term: no }, " go before ", { term: había }]
            es: ["los pronombres y ", { term: no }, " van delante de ", { term: había }]
            uk: ["займенники та ", { term: no }, " стоять перед ", { term: había }]
            pt: ["os pronomes e ", { term: no }, " vão antes de ", { term: había }]
            fr: ["les pronoms et ", { term: no }, " se placent devant ", { term: había }]
            de: ["Pronomen und ", { term: no }, " stehen vor ", { term: había }]
            it: ["i pronomi e ", { term: no }, " vanno prima di ", { term: había }]
            pl: ["zaimki i ", { term: no }, " stoją przed ", { term: había }]
            tr: ["zamirler ve ", { term: no }, ", ", { term: había }, " sözcüğünden önce gelir"]
            id: ["pronomina dan ", { term: no }, " berada di depan ", { term: había }]
            vi: ["đại từ và ", { term: no }, " đứng trước ", { term: había }]
          ex: ["Ya ", { target: lo había leído }, "."]
          tr: { en: I had already read it., uk: "Я вже це прочитав.", pt: "Eu já tinha lido isso.", fr: "Je l’avais déjà lu.", de: "Ich hatte es schon gelesen.", it: "L'avevo già letto.", pl: "Już to czytałem.", tr: "Onu zaten okumuştum.", id: "Saya sudah membacanya.", vi: "Tôi đã đọc nó rồi." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The past perfect looks back from a past moment to an earlier one."
              es: "El pluscuamperfecto mira desde un momento pasado hacia otro anterior."
              uk: "Плюсквамперфект описує дію, що сталася ще раніше за інший момент у минулому."
              pt: "O pretérito mais-que-perfeito olha de um momento passado para outro anterior."
              fr: "Le plus-que-parfait regarde en arrière, d’un moment passé vers un moment antérieur."
              de: "Das Plusquamperfekt blickt von einem vergangenen Zeitpunkt auf einen früheren zurück."
              it: "Il trapassato prossimo guarda indietro da un momento passato a un momento anteriore."
              pl: "Czas zaprzeszły patrzy wstecz: od pewnego momentu w przeszłości do momentu wcześniejszego."
              tr: "Pluscuamperfecto, geçmişteki bir andan daha önceki bir ana geriye bakar."
              id: "Pluscuamperfecto menengok dari satu saat di masa lampau ke saat yang lebih awal."
              vi: "Quá khứ hoàn thành nhìn lại từ một thời điểm trong quá khứ về một thời điểm sớm hơn."
            ex: ["Cuando llamé, Ana ya ", { target: se había ido }, "."]
            tr: { en: "When I called, Ana had already left.", uk: "Коли я подзвонив, Ана вже пішла.", pt: "Quando liguei, a Ana já tinha ido embora.", fr: "Quand j’ai appelé, Ana était déjà partie.", de: "Als ich anrief, war Ana schon gegangen.", it: "Quando ho chiamato, Ana se n'era già andata.", pl: "Kiedy zadzwoniłem, Ana już wyszła.", tr: "Aradığımda Ana çoktan gitmişti.", id: "Ketika saya menelepon, Ana sudah pergi.", vi: "Khi tôi gọi, Ana đã đi rồi." }
          - type: note
            level: B1
            text:
              en: ["Spanish grammars call it ", { term: pretérito pluscuamperfecto }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito pluscuamperfecto }, "."]
              uk: ["Іспанські граматики називають його ", { term: pretérito pluscuamperfecto }, "."]
              pt: ["As gramáticas do espanhol o chamam de ", { term: pretérito pluscuamperfecto }, "."]
              fr: ["Les grammaires espagnoles l’appellent ", { term: pretérito pluscuamperfecto }, "."]
              de: ["Spanische Grammatiken nennen es ", { term: pretérito pluscuamperfecto }, "."]
              it: ["Le grammatiche spagnole lo chiamano ", { term: pretérito pluscuamperfecto }, "."]
              pl: ["Hiszpańskie gramatyki nazywają go ", { term: pretérito pluscuamperfecto }, "."]
              tr: ["İspanyolca dil bilgisi kitapları buna ", { term: pretérito pluscuamperfecto }, " der."]
              id: ["Tata bahasa Spanyol menyebutnya ", { term: pretérito pluscuamperfecto }, "."]
              vi: ["Các sách ngữ pháp tiếng Tây Ban Nha gọi thì này là ", { term: pretérito pluscuamperfecto }, "."]

  - title: { en: "Form: había and the participle", es: "Forma: había y el participio", uk: "Форма: había і дієприкметник", pt: "Forma: había e o particípio", fr: "Forme : había et le participe passé", de: "Form: había und das Partizip", it: "Forma: había e il participio", pl: "Forma: había i imiesłów", tr: "Biçim: había ve participio", id: "Bentuk: había dan participio", vi: "Dạng: había và quá khứ phân từ" }
    role: form
    features: { tense: pst, aspect: prf }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа", pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: haber, label: haber }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, haber: { aux: había }, ar: [{ aux: había }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: había }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, haber: { aux: habías }, ar: [{ aux: habías }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habías }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, haber: { aux: había }, ar: [{ aux: había }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: había }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, haber: { aux: habíamos }, ar: [{ aux: habíamos }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habíamos }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, haber: { aux: habíais }, ar: [{ aux: habíais }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habíais }, " ", { target: [com, { ending: ido }] }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, haber: { aux: habían }, ar: [{ aux: habían }, " ", { target: [habl, { ending: ado }] }], er: [{ aux: habían }, " ", { target: [com, { ending: ido }] }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: había }, " is the imperfect of ", { term: haber }, ", and the participle is the one of the ", { link: present perfect, to: es.pasados.preterito-perfecto }, "."]
              es: [{ term: había }, " es el imperfecto de ", { term: haber }, ", y el participio es el del ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, "."]
              uk: [{ term: había }, " — це імперфект від ", { term: haber }, ", а дієприкметник той самий, що в ", { link: перфекті, to: es.pasados.preterito-perfecto }, "."]
              pt: [{ term: había }, " é o imperfeito de ", { term: haber }, ", e o particípio é o do ", { link: pretérito perfeito composto, to: es.pasados.preterito-perfecto }, "."]
              fr: [{ term: había }, " est l’imparfait de ", { term: haber }, ", et le participe passé est celui du ", { link: passé composé, to: es.pasados.preterito-perfecto }, "."]
              de: [{ term: había }, " ist das ", { term: imperfecto }, " von ", { term: haber }, ", und das Partizip ist dasselbe wie im ", { link: Perfekt, to: es.pasados.preterito-perfecto }, "."]
              it: [{ term: había }, " è l'imperfetto di ", { term: haber }, ", e il participio è quello del ", { link: passato prossimo, to: es.pasados.preterito-perfecto }, "."]
              pl: [{ term: había }, " to forma ", { term: imperfecto }, " czasownika ", { term: haber }, ", a imiesłów jest taki sam jak w ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, "."]
              tr: [{ term: había }, ", ", { term: haber }, " fiilinin ", { term: imperfecto }, " biçimidir. Participio, ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, " zamanındakiyle aynıdır."]
              id: [{ term: había }, " adalah bentuk ", { term: imperfecto }, " dari ", { term: haber }, ", dan participio-nya sama dengan yang dipakai pada ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, "."]
              vi: [{ term: había }, " là dạng ", { term: imperfecto }, " của ", { term: haber }, ", còn quá khứ phân từ giống với ở thì ", { link: hiện tại hoàn thành, to: es.pasados.preterito-perfecto }, "."]
          - type: rule
            level: B1
            text:
              en: ["Irregular participles stay irregular: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              es: ["Los participios irregulares siguen siendo irregulares: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              uk: ["Неправильні дієприкметники лишаються неправильними: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              pt: ["Os particípios irregulares continuam irregulares: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              fr: ["Les participes passés irréguliers restent irréguliers : ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              de: ["Unregelmäßige Partizipien bleiben unregelmäßig: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              it: ["I participi irregolari restano irregolari: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              pl: ["Imiesłowy nieregularne pozostają nieregularne: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              tr: ["Düzensiz participio biçimleri düzensiz kalır: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              id: ["Participio tidak beraturan tetap tidak beraturan: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
              vi: ["Quá khứ phân từ bất quy tắc vẫn giữ dạng bất quy tắc: ", { term: hecho }, ", ", { term: dicho }, ", ", { term: visto }, ", ", { term: puesto }, ", ", { term: vuelto }, ", ", { term: roto }, "."]
            ex: ["¿Quién ", { target: había roto }, " la ventana?"]
            tr: { en: Who had broken the window?, uk: "Хто розбив вікно?", pt: "Quem tinha quebrado a janela?", fr: "Qui avait cassé la fenêtre ?", de: "Wer hatte das Fenster zerbrochen?", it: "Chi aveva rotto la finestra?", pl: "Kto rozbił okno?", tr: "Pencereyi kim kırmıştı?", id: "Siapa yang sudah memecahkan jendela itu?", vi: "Ai đã làm vỡ cửa sổ?" }
          - type: rule
            level: B1
            text:
              en: ["Object pronouns and ", { term: no }, " go before ", { term: había }, ", and nothing goes between ", { term: había }, " and the participle:"]
              es: ["Los pronombres de objeto y ", { term: no }, " van delante de ", { term: había }, ", y nada se pone entre ", { term: había }, " y el participio:"]
              uk: ["Займенники-додатки та ", { term: no }, " стоять перед ", { term: había }, ", і між ", { term: había }, " та дієприкметником нічого не ставлять:"]
              pt: ["Os pronomes de objeto e ", { term: no }, " vão antes de ", { term: había }, ", e nada se coloca entre ", { term: había }, " e o particípio:"]
              fr: ["Les pronoms compléments et ", { term: no }, " se placent devant ", { term: había }, ", et rien ne s’intercale entre ", { term: había }, " et le participe passé :"]
              de: ["Objektpronomen und ", { term: no }, " stehen vor ", { term: había }, ", und zwischen ", { term: había }, " und dem Partizip steht nichts:"]
              it: ["I pronomi complemento e ", { term: no }, " vanno prima di ", { term: había }, ", e niente si mette tra ", { term: había }, " e il participio:"]
              pl: ["Zaimki dopełnieniowe i ", { term: no }, " stoją przed ", { term: había }, ", a między ", { term: había }, " i imiesłowem nic nie stoi:"]
              tr: ["Nesne zamirleri ve ", { term: no }, ", ", { term: había }, " sözcüğünden önce gelir; ", { term: había }, " ile participio arasına hiçbir şey girmez:"]
              id: ["Pronomina objek dan ", { term: no }, " berada di depan ", { term: había }, ", dan tidak ada kata di antara ", { term: había }, " dan participio:"]
              vi: ["Đại từ tân ngữ và ", { term: no }, " đứng trước ", { term: había }, ", và không có gì chen vào giữa ", { term: había }, " và quá khứ phân từ:"]
            ex: { examples: [["No ", { target: lo había visto }, "."], ["Ya ", { target: te lo había dicho }, "."]] }
            tr: { en: { examples: ["I hadn't seen it.", I had already told you.] }, uk: { examples: ["Я цього не бачив.", "Я ж тобі вже казав."] }, pt: { examples: ["Eu não tinha visto isso.", "Eu já tinha te dito isso."] }, fr: { examples: ["Je ne l’avais pas vu.", "Je te l’avais déjà dit."] }, de: { examples: ["Ich hatte es nicht gesehen.", "Ich hatte es dir schon gesagt."] }, it: { examples: ["Non l'avevo visto.", "Te l'avevo già detto."] }, pl: { examples: ["Nie widziałem tego.", "Już ci to mówiłem."] }, tr: { examples: ["Onu görmemiştim.", "Sana bunu zaten söylemiştim."] }, id: { examples: ["Saya belum melihatnya.", "Saya sudah mengatakannya kepadamu."] }, vi: { examples: ["Tôi chưa thấy nó.", "Tôi đã nói điều đó với bạn rồi."] } }

  - title: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
