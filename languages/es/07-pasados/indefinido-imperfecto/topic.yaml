              de: "Bei diesen Verben nennt das Indefinido den Moment, in dem etwas geschah, und das Imperfecto den Zustand, der andauerte."
              it: "Con questi verbi l'indefinido dice il momento in cui qualcosa è successo, e l'imperfetto lo stato che durava."
              pl: "Przy tych czasownikach indefinido podaje moment, w którym coś się stało, a imperfecto — stan, który trwał."
              tr: "Bu fiillerde indefinido bir şeyin gerçekleştiği anı, imperfecto ise süren durumu anlatır."
              id: "Pada kata kerja ini, indefinido menyatakan saat sesuatu terjadi, dan imperfecto menyatakan keadaan yang berlangsung."
              vi: "Với các động từ này, indefinido nói lúc một việc xảy ra, còn imperfecto nói trạng thái kéo dài."

