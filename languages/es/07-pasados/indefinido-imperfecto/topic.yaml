sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The two tenses show the same past from two sides: the preterite sees the whole event, the imperfect sees it going on."
              es: "Los dos tiempos muestran el mismo pasado desde dos lados: el indefinido ve el hecho entero; el imperfecto, su desarrollo."
              uk: "Два часи показують те саме минуле з двох боків: претерит бачить подію цілком, імперфект — у її перебігу."
              pt: "Os dois tempos mostram o mesmo passado por dois lados: o perfeito simples vê o fato inteiro; o imperfeito o vê em andamento."
              fr: "Les deux temps montrent le même passé sous deux angles : le prétérit voit l’événement en entier, l’imparfait le voit se dérouler."
              de: "Die beiden Zeiten zeigen dieselbe Vergangenheit von zwei Seiten: Das Indefinido sieht das ganze Ereignis, das Imperfecto sieht es im Verlauf."
              it: "I due tempi mostrano lo stesso passato da due lati: l'indefinido vede il fatto intero, l'imperfetto lo vede mentre si svolge."
              pl: "Te dwa czasy pokazują tę samą przeszłość z dwóch stron: indefinido widzi całe zdarzenie, imperfecto widzi je w trakcie."
              tr: "İki zaman aynı geçmişi iki yönden gösterir: indefinido olayı bütün olarak, imperfecto ise sürerken görür."
              id: "Kedua tense menunjukkan masa lalu yang sama dari dua sisi: indefinido melihat seluruh kejadian, imperfecto melihatnya sedang berlangsung."
              vi: "Hai thì cho thấy cùng một quá khứ từ hai phía: indefinido nhìn toàn bộ sự việc, imperfecto nhìn nó đang diễn ra."
            ex: { examples: [["Ayer ", { target: llovió }, " todo el día."], ["Ayer ", { target: llovía }, " cuando salí."]] }
            tr: { en: { examples: [It rained all day yesterday., It was raining when I went out yesterday.] }, uk: { examples: ["Учора цілий день ішов дощ.", "Учора, коли я вийшов, ішов дощ."] }, pt: { examples: ["Ontem choveu o dia todo.", "Ontem estava chovendo quando eu saí."] }, fr: { examples: ["Hier, il a plu toute la journée.", "Hier, il pleuvait quand je suis sorti."] }, de: { examples: ["Gestern hat es den ganzen Tag geregnet.", "Gestern regnete es, als ich hinausging."] }, it: { examples: ["Ieri è piovuto tutto il giorno.", "Ieri pioveva quando sono uscito."] }, pl: { examples: ["Wczoraj padało cały dzień.", "Wczoraj padało, kiedy wychodziłem."] }, tr: { examples: ["Dün bütün gün yağmur yağdı.", "Dün dışarı çıktığımda yağmur yağıyordu."] }, id: { examples: ["Kemarin hujan sepanjang hari.", "Kemarin hujan sedang turun ketika saya keluar."] }, vi: { examples: ["Hôm qua trời mưa cả ngày.", "Hôm qua trời đang mưa khi tôi ra ngoài."] } }
          - type: rule
            level: A2
            text:
              en: ["The time word alone does not choose: the same ", { term: ayer }, " works with both tenses."]
              es: ["La palabra de tiempo sola no decide: el mismo ", { term: ayer }, " sirve para los dos tiempos."]
              uk: ["Саме слово часу не вирішує: те саме ", { term: ayer }, " буває з обома часами."]
              pt: ["A palavra de tempo sozinha não decide: o mesmo ", { term: ayer }, " serve para os dois tempos."]
              fr: ["Le mot de temps seul ne décide pas : le même ", { term: ayer }, " convient aux deux temps."]
              de: ["Die Zeitangabe allein entscheidet nicht: Dasselbe ", { term: ayer }, " passt zu beiden Zeiten."]
              it: ["La parola di tempo da sola non decide: lo stesso ", { term: ayer }, " va con entrambi i tempi."]
              pl: ["Samo słowo określające czas nie rozstrzyga: to samo ", { term: ayer }, " pasuje do obu czasów."]
              tr: ["Zaman sözcüğü tek başına belirleyici değildir: aynı ", { term: ayer }, " iki zamanla da kullanılır."]
              id: ["Kata keterangan waktu saja tidak menentukan: ", { term: ayer }, " yang sama bisa dipakai dengan kedua tense."]
              vi: ["Riêng từ chỉ thời gian chưa quyết định được: cùng một từ ", { term: ayer }, " đi được với cả hai thì."]
          - type: note
            level: A2
            text:
              en: ["The forms: ", { link: Preterite, to: es.pasados.preterito-indefinido }, " and ", { link: Imperfect, to: es.pasados.preterito-imperfecto }, "."]
              es: ["Las formas: ", { link: El pretérito indefinido, to: es.pasados.preterito-indefinido }, " y ", { link: El pretérito imperfecto, to: es.pasados.preterito-imperfecto }, "."]
              uk: ["Форми: ", { link: Претерит, to: es.pasados.preterito-indefinido }, " і ", { link: Імперфект, to: es.pasados.preterito-imperfecto }, "."]
              pt: ["As formas: ", { link: "Pretérito perfeito simples", to: es.pasados.preterito-indefinido }, " e ", { link: "Pretérito imperfeito", to: es.pasados.preterito-imperfecto }, "."]
              fr: ["Les formes : ", { link: "Prétérit", to: es.pasados.preterito-indefinido }, " et ", { link: "Imparfait", to: es.pasados.preterito-imperfecto }, "."]
              de: ["Die Formen: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " und ", { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, "."]
              it: ["Le forme: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " e ", { link: "Imperfetto", to: es.pasados.preterito-imperfecto }, "."]
              pl: ["Formy: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " i ", { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, "."]
              tr: ["Biçimler: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " ve ", { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, "."]
              id: ["Bentuknya: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " dan ", { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, "."]
              vi: ["Các dạng: ", { link: "Indefinido", to: es.pasados.preterito-indefinido }, " và ", { link: "Imperfecto", to: es.pasados.preterito-imperfecto }, "."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Український вид допомагає, але не вирішує сам: претерит часто відповідає доконаному виду (", { term: leí }, " — ", { l1: прочитав }, "), а імперфект — недоконаному (", { term: leía }, " — ", { l1: читав }, "). Та період із тривалістю бере претерит і з недоконаним дієсловом (", { term: viví dos años }, " — ", { l1: жив два роки }, "), а питання про досвід — перфект (", { term: ¿Has leído este libro? }, " — ", { l1: Ти читав цю книжку? }, ")."]

