id: es.pasados.indefinido-imperfecto
lang: es
kind: grammar
tags: [verbs, tenses, past, preterite, imperfect, aspect, narration]
concepts: [aspect, past-tense]
related: [es.pasados.preterito-indefinido, es.pasados.preterito-imperfecto, es.pasados.perfecto-indefinido, es.pasados.pluscuamperfecto, es.presente.estar-gerundio]
status: { en: draft, es: draft, uk: draft }
translated: { en: "30fec7 e23c79 954b01 259182 a8a14f a9a3a5 c743f1 8c66bc", uk: "30fec7 e23c79 954b01 259182 a8a14f a9a3a5 c743f1 8c66bc" }

title: { en: Preterite or Imperfect, es: Indefinido o imperfecto, uk: "Простий минулий чи імперфект" }
summary:
  lead:
    en: ["The preterite tells finished events, and the imperfect describes the scene around them: ", { term: llovía cuando salí }, "."]
    es: ["El indefinido cuenta los hechos terminados, y el imperfecto describe el escenario que los rodea: ", { term: llovía cuando salí }, "."]
    uk: ["Простий минулий розповідає про завершені події, а імперфект описує обставини навколо них: ", { term: llovía cuando salí }, "."]
  rule:
    en: "The event that breaks in takes the preterite, and the action going on takes the imperfect:"
    es: "La acción que interrumpe lleva el indefinido, y la acción en curso, el imperfecto:"
    uk: "Подія, що вривається, стоїть у простому минулому, а дія, що триває, — в імперфекті:"
  ex: [{ target: Estaba }, " en la ducha cuando ", { target: sonó }, " el teléfono."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Preterite, es: Indefinido, uk: "Простий минулий" }
          rule:
            en: "a finished event: what happened"
            es: "un hecho terminado: lo que pasó"
            uk: "завершена подія: що сталося"
          ex: ["Ayer ", { target: comí }, " paella."]
          tr: { en: I had paella yesterday., uk: "Учора я їв паелью." }
        - level: A2
          point: { en: Imperfect, es: Imperfecto, uk: "Імперфект" }
          rule:
            en: "the scene: how things were"
            es: "el escenario: cómo eran las cosas"
            uk: "обставини: як усе було"
          ex: ["La paella ", { target: estaba }, " muy rica."]
          tr: { en: The paella was delicious., uk: "Паелья була дуже смачна." }
        - level: A2
          point: { en: Preterite, es: Indefinido, uk: "Простий минулий" }
          rule:
            en: "one time, or a stated number of times"
            es: "una vez, o un número concreto de veces"
            uk: "один раз або названу кількість разів"
          ex: ["El verano pasado ", { target: fui }, " tres veces a la playa."]
          tr: { en: Last summer I went to the beach three times., uk: "Минулого літа я тричі їздив на пляж." }
        - level: A2
          point: { en: Imperfect, es: Imperfecto, uk: "Імперфект" }
          rule:
            en: "a habit, with no number"
            es: "un hábito, sin número de veces"
            uk: "звичка, без кількості разів"
          ex: ["Cada verano ", { target: iba }, " a la playa."]
          tr: { en: I went to the beach every summer., uk: "Щоліта я їздив на пляж." }
        - level: B1
          point: { en: Both, es: Los dos, uk: "Обидва" }
          rule:
            en: "the action going on in the imperfect, the event in the preterite"
            es: "la acción en curso en imperfecto, el hecho en indefinido"
            uk: "дія, що триває, — в імперфекті, подія — у простому минулому"
          ex: ["Yo ", { target: dormía }, " cuando ", { target: sonó }, " el teléfono."]
          tr: { en: I was sleeping when the phone rang., uk: "Я спав, коли задзвонив телефон." }
        - level: B1
          point: { en: Both, es: Los dos, uk: "Обидва" }
          rule:
            en: [{ pattern: [{ term: estaba }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }] }, " for an action in progress"]
            es: [{ pattern: [{ term: estaba }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }] }, " para una acción en curso"]
            uk: [{ pattern: [{ term: estaba }, { slot: { en: gerund, es: gerundio, uk: герундій } }] }, " — для дії в процесі"]
          ex: [{ target: Estábamos cenando }, " cuando ", { target: llegó }, " Pedro."]
          tr: { en: We were having dinner when Pedro arrived., uk: "Ми вечеряли, коли прийшов Педро." }
        - level: B1
          point: { en: Both, es: Los dos, uk: "Обидва" }
          rule:
            en: ["a whole event judged: ", { term: fue }, "; a description: ", { term: era }]
            es: ["un hecho valorado en su conjunto: ", { term: fue }, "; una descripción: ", { term: era }]
            uk: ["подія в цілому, з оцінкою: ", { term: fue }, "; опис: ", { term: era }]
          ex: { examples: [["El viaje ", { target: fue }, " genial."], ["El hotel ", { target: era }, " bonito."]] }
          tr: { en: { examples: [The trip was great., The hotel was nice.] }, uk: { examples: ["Подорож була чудова.", "Готель був гарний."] } }
        - level: B1
          point: { en: Meaning, es: Significado, uk: "Значення" }
          rule:
            en: [{ term: conocí }, " is meeting someone; ", { term: conocía }, " is knowing them"]
            es: [{ term: conocí }, " es el primer encuentro; ", { term: conocía }, " es el trato ya existente"]
            uk: [{ term: conocí }, " — познайомитися з кимось; ", { term: conocía }, " — бути знайомим"]
          ex: [{ target: Conocí }, " a Laura en una fiesta."]
          tr: { en: I met Laura at a party., uk: "Я познайомився з Лаурою на вечірці." }
        - level: B1
          point: { en: Meaning, es: Significado, uk: "Значення" }
          rule:
            en: [{ term: supe }, " is finding out; ", { term: sabía }, " is knowing"]
            es: [{ term: supe }, " es enterarse; ", { term: sabía }, " es saber ya"]
            uk: [{ term: supe }, " — дізнатися; ", { term: sabía }, " — знати"]
          ex: [{ target: Supe }, " la noticia por la radio."]
          tr: { en: I found out the news on the radio., uk: "Я дізнався новину з радіо." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "a period with its length, now over, takes the preterite"
            es: "un período con su duración, ya terminado, lleva el indefinido"
            uk: "період із тривалістю, що вже минув, — простий минулий"
          ex: [{ target: Estuve }, " dos horas en el banco."]
          tr: { en: I was at the bank for two hours., uk: "Я пробув у банку дві години." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["a stage of life is the scene: ", { term: cuando era niño }]
            es: ["una etapa de la vida es el escenario: ", { term: cuando era niño }]
            uk: ["етап життя — це обставини: ", { term: cuando era niño }]
          ex: ["Cuando ", { target: era }, " niño, ", { target: vivía }, " en Cali."]
          tr: { en: "When I was a child, I lived in Cali.", uk: "Коли я був дитиною, я жив у Калі." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The two tenses show the same past from two sides: the preterite sees the whole event, the imperfect sees it going on."
              es: "Los dos tiempos muestran el mismo pasado desde dos lados: el indefinido ve el hecho entero; el imperfecto, su desarrollo."
              uk: "Два часи показують те саме минуле з двох боків: простий минулий бачить подію цілком, імперфект — у її перебігу."
            ex: { examples: [["Ayer ", { target: llovió }, " todo el día."], ["Ayer ", { target: llovía }, " cuando salí."]] }
            tr: { en: { examples: [It rained all day yesterday., It was raining when I went out yesterday.] }, uk: { examples: ["Учора цілий день ішов дощ.", "Учора, коли я виходив, ішов дощ."] } }
          - type: rule
            level: A2
            text:
              en: ["The time word alone does not choose: the same ", { term: ayer }, " works with both tenses."]
              es: ["La palabra de tiempo sola no decide: el mismo ", { term: ayer }, " sirve para los dos tiempos."]
              uk: ["Саме слово часу не вирішує: те саме ", { term: ayer }, " буває з обома часами."]
          - type: note
            level: A2
            text:
              en: ["The forms: ", { link: Preterite, to: es.pasados.preterito-indefinido }, " and ", { link: Imperfect, to: es.pasados.preterito-imperfecto }, "."]
              es: ["Las formas: ", { link: El pretérito indefinido, to: es.pasados.preterito-indefinido }, " y ", { link: El pretérito imperfecto, to: es.pasados.preterito-imperfecto }, "."]
              uk: ["Форми: ", { link: Простий минулий, to: es.pasados.preterito-indefinido }, " і ", { link: Імперфект, to: es.pasados.preterito-imperfecto }, "."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: ["Український вид допомагає, але не вирішує сам: простий минулий часто відповідає доконаному виду (", { term: leí }, " — ", { l1: прочитав }, "), а імперфект — недоконаному (", { term: leía }, " — ", { l1: читав }, "). Та період із тривалістю бере простий минулий і з недоконаним дієсловом (", { term: viví dos años }, " — ", { l1: жив два роки }, "), а питання про досвід — перфект (", { term: ¿Has leído este libro? }, " — ", { l1: Ти читав цю книжку? }, ")."]

  - title: { en: "Compare: preterite and imperfect", es: "Comparación: indefinido e imperfecto", uk: "Порівняння: простий минулий та імперфект" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: preterite, label: { en: Preterite, es: Indefinido, uk: "Простий минулий" }, features: { tense: pst, aspect: pfv } }
          - { key: imperfect, label: { en: Imperfect, es: Imperfecto, uk: "Імперфект" }, features: { tense: pst, aspect: ipfv } }
        rows:
          - { level: A2, preterite: { en: "a finished event: what happened", es: "un hecho terminado: lo que pasó", uk: "завершена подія: що сталося" }, imperfect: { en: "the scene: how things were", es: "el escenario: cómo eran las cosas", uk: "обставини: як усе було" } }
          - level: A2
            preterite: { ex: ["Ayer ", { target: comí }, " paella."], tr: { en: I had paella yesterday., uk: "Учора я їв паелью." } }
            imperfect: { ex: ["La paella ", { target: estaba }, " muy rica."], tr: { en: The paella was delicious., uk: "Паелья була дуже смачна." } }
          - { level: A2, preterite: { en: "one time, or a stated number of times", es: "una vez, o un número concreto de veces", uk: "один раз або названу кількість разів" }, imperfect: { en: "a habit, with no number", es: "un hábito, sin número de veces", uk: "звичка, без кількості разів" } }
          - level: A2
            preterite: { ex: ["El verano pasado ", { target: fui }, " tres veces a la playa."], tr: { en: Last summer I went to the beach three times., uk: "Минулого літа я тричі їздив на пляж." } }
            imperfect: { ex: ["Cada verano ", { target: iba }, " a la playa."], tr: { en: I went to the beach every summer., uk: "Щоліта я їздив на пляж." } }
          - { level: B1, preterite: { en: "a period with its length, now over", es: "un período con su duración, ya terminado", uk: "період із тривалістю, що вже минув" }, imperfect: { en: "the background, with no end in view", es: "el fondo, sin final a la vista", uk: "обставини, без видимого кінця" } }
          - level: B1
            preterite: { ex: [{ target: Viví }, " dos años en Bogotá."], tr: { en: I lived in Bogotá for two years., uk: "Я два роки жив у Боготі." } }
            imperfect: { ex: ["Cuando ", { target: vivía }, " en Bogotá, ", { target: trabajaba }, " en un hotel."], tr: { en: "When I lived in Bogotá, I worked in a hotel.", uk: "Коли я жив у Боготі, я працював у готелі." } }
          - level: A2
            preterite: { ex: "ayer, el lunes, una vez, de repente", tr: { en: "yesterday, on Monday, once, suddenly", uk: "учора, у понеділок, одного разу, раптом" } }
            imperfect: { ex: "antes, siempre, cada día, normalmente", tr: { en: "before, always, every day, usually", uk: "раніше, завжди, щодня, зазвичай" } }

  - title: { en: "Use: one action breaks into another", es: "Uso: una acción interrumpe a otra", uk: "Вживання: одна дія перериває іншу" }
    role: use
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - level: B1
            pattern: { pattern: [{ slot: { en: imperfect, es: imperfecto, uk: "імперфект" } }, { term: cuando }, { slot: { en: preterite, es: indefinido, uk: "простий минулий" } }] }
            ex: ["Yo ", { target: dormía }, " cuando ", { target: sonó }, " el teléfono."]
            tr: { en: I was sleeping when the phone rang., uk: "Я спав, коли задзвонив телефон." }
          - level: B1
            pattern: { pattern: [{ term: mientras }, { slot: { en: imperfect, es: imperfecto, uk: "імперфект" } }, { slot: { en: preterite, es: indefinido, uk: "простий минулий" } }] }
            ex: [{ signal: Mientras }, " ", { target: cocinaba }, ", se ", { target: fue }, " la luz."]
            tr: { en: "While I was cooking, the power went out.", uk: "Поки я готував, вимкнулося світло." }
          - level: B1
            pattern: { pattern: [{ term: estaba }, { slot: { en: gerund, es: gerundio, uk: "герундій" } }, { term: cuando }, { slot: { en: preterite, es: indefinido, uk: "простий минулий" } }] }
            ex: [{ target: Estábamos cenando }, " cuando ", { target: llegó }, " Pedro."]
            tr: { en: We were having dinner when Pedro arrived., uk: "Ми вечеряли, коли прийшов Педро." }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Two actions going on at the same time both take the imperfect, often joined by ", { term: mientras }, ":"]
              es: ["Dos acciones en curso al mismo tiempo llevan imperfecto, a menudo unidas por ", { term: mientras }, ":"]
              uk: ["Дві дії, що тривають одночасно, обидві стоять в імперфекті, часто з ", { term: mientras }, ":"]
            ex: [{ signal: Mientras }, " yo ", { target: leía }, ", ella ", { target: escuchaba }, " música."]
            tr: { en: "While I was reading, she was listening to music.", uk: "Поки я читав, вона слухала музику." }
          - type: rule
            level: A2
            text:
              en: "Events one after another all take the preterite:"
              es: "Los hechos que se suceden llevan todos el indefinido:"
              uk: "Події, що йдуть одна за одною, усі стоять у простому минулому:"
            ex: [{ target: Abrí }, " la puerta, ", { target: entré }, " y ", { target: encendí }, " la luz."]
            tr: { en: "I opened the door, went in and turned on the light.", uk: "Я відчинив двері, зайшов і ввімкнув світло." }

  - title: { en: Telling a story, es: Contar una historia, uk: "Розповідь про події" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A story sets the scene with the imperfect, then moves forward with the preterite:"
              es: "Una historia pinta el escenario con el imperfecto y avanza con el indefinido:"
              uk: "Розповідь змальовує обставини імперфектом, а далі рухається простим минулим:"
            ex: [{ target: Era }, " domingo y ", { target: hacía }, " sol. De repente, ", { target: empezó }, " a llover."]
            tr: { en: "It was Sunday and it was sunny. Suddenly it started to rain.", uk: "Була неділя, світило сонце. Раптом почався дощ." }
          - type: rule
            level: B1
            text:
              en: ["A judgement of a whole event takes ", { term: fue }, "; a description of how it was takes ", { term: era }, ":"]
              es: ["La valoración de un hecho entero lleva ", { term: fue }, "; la descripción de cómo era, ", { term: era }, ":"]
              uk: ["Оцінка події в цілому — ", { term: fue }, "; опис того, якою вона була, — ", { term: era }, ":"]
            ex: { examples: [["El concierto ", { target: fue }, " increíble."], ["La música ", { target: era }, " muy buena."]] }
            tr: { en: { examples: [The concert was amazing., The music was very good.] }, uk: { examples: ["Концерт був неймовірний.", "Музика була дуже гарна."] } }

  - title: { en: Verbs that change their meaning, es: Verbos que cambian de significado, uk: "Дієслова, що змінюють значення" }
    role: own
    content:
      - type: comparison
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: "Дієслово" } }
          - { key: preterite, label: { en: Preterite, es: Indefinido, uk: "Простий минулий" }, features: { tense: pst, aspect: pfv } }
          - { key: imperfect, label: { en: Imperfect, es: Imperfecto, uk: "Імперфект" }, features: { tense: pst, aspect: ipfv } }
        rows:
          - level: B1
            verb: conocer
            preterite: { ex: [{ target: Conocí }, " a Laura en una fiesta."], tr: { en: I met Laura at a party., uk: "Я познайомився з Лаурою на вечірці." } }
            imperfect: { ex: ["Ya ", { target: conocía }, " a Laura."], tr: { en: I already knew Laura., uk: "Я вже був знайомий з Лаурою." } }
          - level: B1
            verb: saber
            preterite: { ex: [{ target: Supe }, " la noticia por la radio."], tr: { en: I found out the news on the radio., uk: "Я дізнався новину з радіо." } }
            imperfect: { ex: ["No ", { target: sabía }, " nada."], tr: { en: "I didn't know anything.", uk: "Я нічого не знав." } }
          - level: B1
            verb: querer
            preterite: { ex: ["Ana no ", { target: quiso }, " venir."], tr: { en: Ana refused to come., uk: "Ана відмовилася прийти." } }
            imperfect: { ex: ["Ana no ", { target: quería }, " venir."], tr: { en: "Ana didn't want to come.", uk: "Ана не хотіла приходити." } }
          - level: B1
            verb: poder
            preterite: { ex: ["Por fin ", { target: pude }, " dormir."], tr: { en: I finally managed to sleep., uk: "Нарешті мені вдалося заснути." } }
            imperfect: { ex: ["No ", { target: podía }, " dormir."], tr: { en: "I couldn't sleep.", uk: "Я не міг заснути." } }
          - level: B1
            verb: tener
            preterite: { ex: [{ target: Tuve }, " una idea."], tr: { en: I had an idea., uk: "У мене з’явилася ідея." } }
            imperfect: { ex: [{ target: Tenía }, " una bicicleta vieja."], tr: { en: I had an old bike., uk: "У мене був старий велосипед." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "With these verbs, the preterite tells the moment something happened, and the imperfect the state that lasted."
              es: "Con estos verbos, el indefinido cuenta el momento en que algo pasó, y el imperfecto, el estado que duraba."
              uk: "У цих дієсловах простий минулий передає момент, коли щось сталося, а імперфект — стан, що тривав."

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Cuando fui niño viví en Quito., right: ["Cuando ", { target: era }, " niño, ", { target: vivía }, " en Quito."], rule: { en: "a stage of life is the scene: imperfect", es: "una etapa de la vida es el escenario: imperfecto", uk: "етап життя — це обставини: імперфект" } }
          - { level: B1, wrong: Cuando sonó el teléfono dormí., right: ["Cuando sonó el teléfono, ", { target: dormía }, "."], rule: { en: "the action going on takes the imperfect", es: "la acción en curso lleva el imperfecto", uk: "дія, що триває, — імперфект" } }
          - { level: B1, wrong: Vivía dos años en Bogotá., right: [{ target: Viví }, " dos años en Bogotá."], rule: { en: "a period with its length, now over: preterite", es: "un período con su duración, ya terminado: indefinido", uk: "період із тривалістю, що вже минув: простий минулий" } }
          - { level: A2, wrong: Antes fui al gimnasio todos los días., right: ["Antes ", { target: iba }, " al gimnasio todos los días."], rule: { en: "a past habit takes the imperfect", es: "un hábito pasado lleva el imperfecto", uk: "минула звичка — імперфект" } }
