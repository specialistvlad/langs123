title: { en: Preterite or Imperfect, es: Indefinido o imperfecto, uk: "Претерит чи імперфект", pt: "Perfeito simples ou imperfeito", fr: "Prétérit ou imparfait", de: "Indefinido oder Imperfecto", it: "Indefinido o imperfetto", pl: "Indefinido czy imperfecto", tr: "Indefinido mu, imperfecto mu?", id: "Indefinido atau imperfecto", vi: "Indefinido hay imperfecto" }
summary:
  lead:
    en: ["The preterite tells finished events, and the imperfect describes the scene around them: ", { term: llovía cuando salí }, "."]
    es: ["El indefinido cuenta los hechos terminados, y el imperfecto describe el escenario que los rodea: ", { term: llovía cuando salí }, "."]
    uk: ["Претерит розповідає про завершені події, а імперфект описує обставини навколо них: ", { term: llovía cuando salí }, "."]
    pt: ["O pretérito perfeito simples (indefinido) conta os fatos concluídos, e o imperfeito descreve o cenário em volta deles: ", { term: llovía cuando salí }, "."]
    fr: ["Le prétérit raconte les faits terminés et l’imparfait décrit le décor qui les entoure : ", { term: llovía cuando salí }, "."]
    de: ["Das Indefinido erzählt abgeschlossene Ereignisse, das Imperfecto beschreibt den Hintergrund dazu: ", { term: llovía cuando salí }, "."]
    it: ["L'indefinido racconta i fatti conclusi, l'imperfetto descrive lo sfondo che li circonda: ", { term: llovía cuando salí }, "."]
    pl: ["Indefinido opowiada o zdarzeniach zakończonych, a imperfecto opisuje tło, na którym się dzieją: ", { term: llovía cuando salí }, "."]
    tr: ["Indefinido bitmiş olayları anlatır, imperfecto onları çevreleyen arka planı betimler: ", { term: llovía cuando salí }, "."]
    id: ["Indefinido menceritakan kejadian yang sudah selesai, sedangkan imperfecto menggambarkan latar di sekitarnya: ", { term: llovía cuando salí }, "."]
    vi: ["Indefinido kể các sự việc đã kết thúc, còn imperfecto tả bối cảnh xung quanh chúng: ", { term: llovía cuando salí }, "."]
  rule:
    en: "The event that breaks in takes the preterite, and the action going on takes the imperfect:"
    es: "La acción que interrumpe lleva el indefinido, y la acción en curso, el imperfecto:"
    uk: "Подія, що перериває іншу, стоїть у претериті, а дія, що триває, — в імперфекті:"
    pt: "O fato que interrompe leva o perfeito simples, e a ação em andamento leva o imperfeito:"
    fr: "L’événement qui interrompt se met au prétérit, et l’action en cours à l’imparfait :"
    de: "Das Ereignis, das dazwischenkommt, steht im Indefinido, die laufende Handlung im Imperfecto:"
    it: "L'evento che interrompe va all'indefinido, l'azione in corso all'imperfetto:"
    pl: "Zdarzenie, które przerywa, wymaga indefinido, a czynność w toku — imperfecto:"
    tr: "Araya giren olay indefinido ile, süren eylem imperfecto ile söylenir:"
    id: "Kejadian yang memotong memakai indefinido, dan tindakan yang sedang berlangsung memakai imperfecto:"
    vi: "Sự việc xen vào dùng indefinido, còn hành động đang diễn ra dùng imperfecto:"
  ex: [{ target: Estaba }, " en la ducha cuando ", { target: sonó }, " el teléfono."]

