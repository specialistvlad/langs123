sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The preterite tells an action that started and ended at a known time in the past."
              es: "El pretérito indefinido cuenta una acción que empezó y terminó en un momento conocido del pasado."
              uk: "Претерит передає дію, що почалася й закінчилася у відомий момент минулого."
              pt: "O pretérito perfeito simples conta uma ação que começou e terminou em um momento conhecido do passado."
              fr: "Le prétérit raconte une action qui a commencé et fini à un moment connu du passé."
              de: ["Das ", { term: indefinido }, " erzählt eine Handlung, die zu einem bekannten Zeitpunkt in der Vergangenheit begann und endete."]
              it: ["L'", { term: indefinido }, " racconta un'azione iniziata e conclusa in un momento noto del passato."]
              pl: ["Czas ", { term: indefinido }, " opowiada o czynności, która zaczęła się i skończyła w znanym momencie przeszłości."]
              tr: "Indefinido, geçmişte belli bir anda başlayıp biten bir eylemi anlatır."
              id: ["Bentuk ", { term: indefinido }, " menceritakan tindakan yang mulai dan berakhir pada saat tertentu di masa lampau."]
              vi: ["Thì ", { term: indefinido }, " kể về hành động đã bắt đầu và kết thúc vào một thời điểm xác định trong quá khứ."]
            ex: ["Ayer ", { target: llamé }, " a mi madre."]
            tr: { en: I called my mother yesterday., uk: "Учора я подзвонив мамі.", pt: "Ontem liguei para minha mãe.", fr: "Hier, j’ai appelé ma mère.", de: "Gestern habe ich meine Mutter angerufen.", it: "Ieri ho chiamato mia madre.", pl: "Wczoraj zadzwoniłem do mamy.", tr: "Dün annemi aradım.", id: "Kemarin saya menelepon ibu saya.", vi: "Hôm qua tôi gọi điện cho mẹ." }
          - type: note
            level: A2
            text:
              en: ["Spanish grammars call it ", { term: pretérito indefinido }, " or ", { term: pretérito perfecto simple }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito indefinido }, " o ", { term: pretérito perfecto simple }, "."]
              uk: ["Іспанські граматики називають його ", { term: pretérito indefinido }, " або ", { term: pretérito perfecto simple }, "."]
              pt: ["As gramáticas do espanhol o chamam de ", { term: pretérito indefinido }, " ou ", { term: pretérito perfecto simple }, "."]
              fr: ["Les grammaires espagnoles l’appellent ", { term: pretérito indefinido }, " ou ", { term: pretérito perfecto simple }, "."]
              de: ["Spanische Grammatiken nennen es ", { term: pretérito indefinido }, " oder ", { term: pretérito perfecto simple }, "."]
              it: ["Le grammatiche spagnole lo chiamano ", { term: pretérito indefinido }, " o ", { term: pretérito perfecto simple }, "."]
              pl: ["Hiszpańskie gramatyki nazywają go ", { term: pretérito indefinido }, " lub ", { term: pretérito perfecto simple }, "."]
              tr: ["İspanyolca dil bilgisi kitapları buna ", { term: pretérito indefinido }, " ya da ", { term: pretérito perfecto simple }, " der."]
              id: ["Tata bahasa Spanyol menyebutnya ", { term: pretérito indefinido }, " atau ", { term: pretérito perfecto simple }, "."]
              vi: ["Các sách ngữ pháp tiếng Tây Ban Nha gọi thì này là ", { term: pretérito indefinido }, " hoặc ", { term: pretérito perfecto simple }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, the preterite also tells actions finished earlier today; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for them, as Spain does:"
              es: "En la mayor parte de Latinoamérica, el indefinido también cuenta acciones terminadas hoy; el español andino (Perú, Bolivia, la sierra de Ecuador) usa para ellas el perfecto, como en España:"
              uk: "У більшій частині Латинської Америки претерит передає й дії, завершені сьогодні; андська іспанська (Перу, Болівія, гірський Еквадор) уживає для них перфект, як в Іспанії:"
              pt: "Na maior parte da América Latina, o pretérito perfeito simples também conta ações terminadas hoje; o espanhol andino (Peru, Bolívia, serra do Equador) usa para elas o pretérito perfeito composto, como na Espanha:"
              fr: "Dans la plupart de l’Amérique latine, le prétérit raconte aussi les actions terminées aujourd’hui ; l’espagnol andin (Pérou, Bolivie, hauts plateaux de l’Équateur) emploie pour elles le passé composé, comme en Espagne :"
              de: ["In den meisten Teilen Lateinamerikas erzählt das ", { term: indefinido }, " auch Handlungen, die heute abgeschlossen wurden; das andine Spanisch (Peru, Bolivien, Hochland von Ecuador) verwendet dafür das Perfekt, wie in Spanien:"]
              it: ["Nella maggior parte dell'America Latina, l'", { term: indefinido }, " racconta anche le azioni concluse oggi; lo spagnolo andino (Perù, Bolivia, altopiano dell'Ecuador) usa per queste il passato prossimo, come in Spagna:"]
              pl: ["W większości Ameryki Łacińskiej ", { term: indefinido }, " opowiada też o czynnościach zakończonych dzisiaj; hiszpański andyjski (Peru, Boliwia, wyżyny Ekwadoru) używa do nich ", { term: pretérito perfecto }, ", tak jak w Hiszpanii:"]
              tr: ["Latin Amerika’nın çoğunda ", { term: indefinido }, " bugün tamamlanan eylemler için de kullanılır; And İspanyolcası (Peru, Bolivya, Ekvador’un dağlık bölgesi) bunlar için İspanya’daki gibi ", { term: pretérito perfecto }, " kullanır:"]
              id: ["Di sebagian besar Amerika Latin, ", { term: indefinido }, " juga dipakai untuk tindakan yang selesai hari ini; bahasa Spanyol Andes (Peru, Bolivia, dataran tinggi Ekuador) memakai ", { term: pretérito perfecto }, " untuk itu, seperti di Spanyol:"]
              vi: ["Ở phần lớn Mỹ Latinh, thì ", { term: indefinido }, " cũng kể những hành động kết thúc trong hôm nay; tiếng Tây Ban Nha vùng Andes (Peru, Bolivia, cao nguyên Ecuador) dùng thì hiện tại hoàn thành cho chúng, giống như ở Tây Ban Nha:"]
            ex: [{ signal: Hoy }, " ", { target: desayuné }, " temprano."]
            tr: { en: I had breakfast early today., uk: "Сьогодні я рано поснідав.", pt: "Hoje tomei café da manhã cedo.", fr: "Aujourd’hui, j’ai pris mon petit-déjeuner tôt.", de: "Heute habe ich früh gefrühstückt.", it: "Oggi ho fatto colazione presto.", pl: "Dzisiaj zjadłem wcześnie śniadanie.", tr: "Bugün erkenden kahvaltı yaptım.", id: "Hari ini saya sarapan pagi-pagi.", vi: "Hôm nay tôi ăn sáng sớm." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["In Spain, an action finished earlier today usually takes the ", { link: present perfect, to: es.pasados.preterito-perfecto }, ":"]
              es: ["En España, una acción terminada hoy suele llevar el ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, ":"]
              uk: ["В Іспанії дія, завершена сьогодні, зазвичай стоїть у ", { link: перфекті, to: es.pasados.preterito-perfecto }, ":"]
              pt: ["Na Espanha, uma ação terminada hoje costuma levar o ", { link: pretérito perfeito composto, to: es.pasados.preterito-perfecto }, ":"]
              fr: ["En Espagne, une action terminée aujourd’hui se met en général au ", { link: passé composé, to: es.pasados.preterito-perfecto }, " :"]
              de: ["In Spanien steht eine heute abgeschlossene Handlung meist im ", { link: Perfekt, to: es.pasados.preterito-perfecto }, ":"]
              it: ["In Spagna, un'azione conclusa oggi di solito va al ", { link: passato prossimo, to: es.pasados.preterito-perfecto }, ":"]
              pl: ["W Hiszpanii czynność zakończona dzisiaj zwykle ma ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, ":"]
              tr: ["İspanya’da bugün tamamlanan eylem genellikle ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, " ile anlatılır:"]
              id: ["Di Spanyol, tindakan yang selesai hari ini biasanya memakai ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, ":"]
              vi: ["Ở Tây Ban Nha, hành động kết thúc trong hôm nay thường dùng thì ", { link: hiện tại hoàn thành, to: es.pasados.preterito-perfecto }, ":"]
            ex: [{ signal: Hoy }, " he desayunado temprano."]
            tr: { en: I had breakfast early today., uk: "Сьогодні я рано поснідав.", pt: "Hoje tomei café da manhã cedo.", fr: "Aujourd’hui, j’ai pris mon petit-déjeuner tôt.", de: "Heute habe ich früh gefrühstückt.", it: "Oggi ho fatto colazione presto.", pl: "Dzisiaj zjadłem wcześnie śniadanie.", tr: "Bugün erkenden kahvaltı yaptım.", id: "Hari ini saya sarapan pagi-pagi.", vi: "Hôm nay tôi ăn sáng sớm." }
          - type: note
            level: A2
            text:
              en: ["For description and habits in the past, see ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["Para la descripción y los hábitos en el pasado, ver ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              uk: ["Про опис і звички в минулому див. ", { link: Претерит чи імперфект, to: es.pasados.indefinido-imperfecto }, "."]
              pt: ["Para a descrição e os hábitos no passado, veja ", { link: "Perfeito simples ou imperfeito", to: es.pasados.indefinido-imperfecto }, "."]
              fr: ["Pour la description et les habitudes au passé, voir ", { link: Prétérit ou imparfait, to: es.pasados.indefinido-imperfecto }, "."]
              de: ["Für Beschreibung und Gewohnheiten in der Vergangenheit siehe ", { link: Indefinido oder Imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              it: ["Per la descrizione e le abitudini nel passato, vedi ", { link: Indefinido o imperfetto, to: es.pasados.indefinido-imperfecto }, "."]
              pl: ["O opisie i przyzwyczajeniach w przeszłości: ", { link: Indefinido czy imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              tr: ["Geçmişteki betimleme ve alışkanlıklar için bkz. ", { link: "Indefinido mu, imperfecto mu?", to: es.pasados.indefinido-imperfecto }, "."]
              id: ["Untuk gambaran dan kebiasaan di masa lampau, lihat ", { link: Indefinido atau imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              vi: ["Về miêu tả và thói quen trong quá khứ, xem ", { link: Indefinido hay imperfecto, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
