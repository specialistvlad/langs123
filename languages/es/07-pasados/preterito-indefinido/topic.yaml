            tr: ["gövdesi değişen -ir fiilleri él ve ellos biçimlerinde değişir: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
            id: ["kata kerja -ir dengan perubahan akar kata berubah pada él dan ellos: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
            vi: ["động từ -ir đổi gốc sẽ biến đổi ở él và ellos: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
