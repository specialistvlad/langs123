          - { level: B1, use: { en: "A whole period that is over, with its length", es: "Un período completo y terminado, con su duración", uk: "Цілий період, що вже минув, з його тривалістю" }, ex: [{ target: Trabajé }, " dos años en Bogotá."], tr: { en: I worked in Bogotá for two years., uk: "Я два роки працював у Боготі." } }
