id: es.pasados.preterito-indefinido
lang: es
kind: grammar
tags: [verbs, tenses, past, preterite]
concepts: [past-tense]
related: [es.pasados.preterito-imperfecto, es.pasados.indefinido-imperfecto, es.pasados.perfecto-indefinido, es.pasados.verbos-irregulares, es.pasados.mapa-tiempos]
status: { en: draft, es: draft, uk: draft }
translated: { en: "eed40d 9c2a56 e20bb2 707057 95e8fc 9e8ed2 a2be9a c325c0 318ae2", uk: "eed40d 9c2a56 e20bb2 707057 95e8fc 9e8ed2 a2be9a c325c0 318ae2" }

title: { en: "Preterite: comí", es: "El pretérito indefinido: comí", uk: "Простий минулий: comí" }
summary:
  lead:
    en: ["The preterite tells actions finished at a known time in the past: ", { term: hablé }, ", ", { term: comí }, ", ", { term: viví }, "."]
    es: ["El pretérito indefinido cuenta acciones terminadas en un momento conocido del pasado: ", { term: hablé }, ", ", { term: comí }, ", ", { term: viví }, "."]
    uk: ["Простий минулий передає дії, завершені у відомий момент минулого: ", { term: hablé }, ", ", { term: comí }, ", ", { term: viví }, "."]
  rule:
    en: "Regular forms stress the ending, and yo and él mark it with a written accent:"
    es: "Las formas regulares llevan el acento en la terminación, con tilde en yo y en él:"
    uk: "У правильних формах наголос падає на закінчення, а в yo та él його позначають графічним наголосом:"
  ex: { examples: [["Ayer ", { target: hablé }, " con Luis."], ["Luis ", { target: llegó }, " tarde."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: hablar }, ": ", { alternatives: [{ term: hablé }, { term: hablaste }, { term: habló }, { term: hablamos }, { term: hablaron }] }]
            es: [{ term: hablar }, ": ", { alternatives: [{ term: hablé }, { term: hablaste }, { term: habló }, { term: hablamos }, { term: hablaron }] }]
            uk: [{ term: hablar }, ": ", { alternatives: [{ term: hablé }, { term: hablaste }, { term: habló }, { term: hablamos }, { term: hablaron }] }]
          ex: ["Ayer ", { target: trabajé }, " mucho."]
          tr: { en: I worked a lot yesterday., uk: "Учора я багато працював." }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comí }, { term: comiste }, { term: comió }, { term: comimos }, { term: comieron }] }]
            es: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comí }, { term: comiste }, { term: comió }, { term: comimos }, { term: comieron }] }]
            uk: [{ alternatives: [{ term: comer }, { term: vivir }] }, ": ", { alternatives: [{ term: comí }, { term: comiste }, { term: comió }, { term: comimos }, { term: comieron }] }]
          ex: ["Anoche ", { target: comimos }, " pizza."]
          tr: { en: We had pizza last night., uk: "Учора ввечері ми їли піцу." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: hablasteis }, { term: comisteis }, { term: vivisteis }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: hablasteis }, { term: comisteis }, { term: vivisteis }] }]
            uk: [{ term: vosotros }, ": ", { alternatives: [{ term: hablasteis }, { term: comisteis }, { term: vivisteis }] }]
          ex: ["¿", { target: Visteis }, " el partido?"]
          tr: { en: Did you see the match?, uk: "Ви дивилися матч?" }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: ser }, " and ", { term: ir }, " share one set of forms: ", { alternatives: [{ term: fui }, { term: fue }, { term: fueron }] }]
            es: [{ term: ser }, " e ", { term: ir }, " comparten las formas: ", { alternatives: [{ term: fui }, { term: fue }, { term: fueron }] }]
            uk: [{ term: ser }, " та ", { term: ir }, " мають спільні форми: ", { alternatives: [{ term: fui }, { term: fue }, { term: fueron }] }]
          ex: ["El sábado ", { target: fuimos }, " al cine."]
          tr: { en: On Saturday we went to the cinema., uk: "У суботу ми ходили в кіно." }
        - level: A2
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["a new stem, with no accent: ", { mapping: [{ term: tener }, { term: tuve }] }, ", ", { mapping: [{ term: hacer }, { term: hice }] }]
            es: ["una raíz nueva, sin tilde: ", { mapping: [{ term: tener }, { term: tuve }] }, ", ", { mapping: [{ term: hacer }, { term: hice }] }]
            uk: ["нова основа, без графічного наголосу: ", { mapping: [{ term: tener }, { term: tuve }] }, ", ", { mapping: [{ term: hacer }, { term: hice }] }]
          ex: ["Ayer ", { target: tuve }, " un examen."]
          tr: { en: I had an exam yesterday., uk: "Учора в мене був іспит." }
        - level: B1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["spelling changes in yo: ", { mapping: [{ term: buscar }, { term: busqué }] }, ", ", { mapping: [{ term: llegar }, { term: llegué }] }, ", ", { mapping: [{ term: empezar }, { term: empecé }] }]
            es: ["cambios de grafía en yo: ", { mapping: [{ term: buscar }, { term: busqué }] }, ", ", { mapping: [{ term: llegar }, { term: llegué }] }, ", ", { mapping: [{ term: empezar }, { term: empecé }] }]
            uk: ["зміни написання у формі yo: ", { mapping: [{ term: buscar }, { term: busqué }] }, ", ", { mapping: [{ term: llegar }, { term: llegué }] }, ", ", { mapping: [{ term: empezar }, { term: empecé }] }]
          ex: ["El lunes ", { target: empecé }, " a trabajar."]
          tr: { en: On Monday I started work., uk: "У понеділок я вийшов на роботу." }
        - level: B1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: ["stem-changing -ir verbs change in él and ellos: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
            es: ["los verbos en -ir con cambio de raíz cambian en él y ellos: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
            uk: ["дієслова на -ir зі зміною основи змінюються в él та ellos: ", { mapping: [{ term: pedir }, { term: pidió }] }, ", ", { mapping: [{ term: dormir }, { term: durmió }] }]
          ex: ["El niño ", { target: durmió }, " toda la noche."]
          tr: { en: The child slept all night., uk: "Дитина спала всю ніч." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "an action finished at a stated past time"
            es: "una acción terminada en un momento pasado concreto"
            uk: "дія, завершена в названий момент минулого"
          ex: ["Ana ", { target: nació }, " en ", { date: "2001", value: "2001" }, "."]
          tr: { en: Ana was born in 2001., uk: "Ана народилася у 2001 році." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "a chain of events, one after another"
            es: "una serie de hechos, uno detrás de otro"
            uk: "ланцюжок подій, одна за одною"
          ex: [{ target: Llegué }, ", ", { target: cené }, " y me ", { target: acosté }, "."]
          tr: { en: "I got home, had dinner and went to bed.", uk: "Я прийшов додому, повечеряв і ліг спати." }
        - level: B1
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "a whole period that is over, with its length"
            es: "un período completo y terminado, con su duración"
            uk: "цілий період, що вже минув, з його тривалістю"
          ex: [{ target: Viví }, " tres años en Quito."]
          tr: { en: I lived in Quito for three years., uk: "Я три роки жив у Кіто." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["the accent marks the past: ", { contrast: [{ term: hablo }, { term: habló }] }]
            es: ["la tilde marca el pasado: ", { contrast: [{ term: hablo }, { term: habló }] }]
            uk: ["графічний наголос позначає минуле: ", { contrast: [{ term: hablo }, { term: habló }] }]
          ex: ["Ayer Ana ", { target: habló }, " conmigo."]
          tr: { en: Ana talked to me yesterday., uk: "Учора Ана говорила зі мною." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ alternatives: [{ term: fui }, { term: fue }, { term: vi }, { term: dio }] }, " have no written accent"]
            es: [{ alternatives: [{ term: fui }, { term: fue }, { term: vi }, { term: dio }] }, " no llevan tilde"]
            uk: [{ alternatives: [{ term: fui }, { term: fue }, { term: vi }, { term: dio }] }, " не мають графічного наголосу"]
          ex: ["Te ", { target: vi }, " ayer."]
          tr: { en: I saw you yesterday., uk: "Я бачив тебе вчора." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The preterite tells an action that started and ended at a known time in the past."
              es: "El pretérito indefinido cuenta una acción que empezó y terminó en un momento conocido del pasado."
              uk: "Простий минулий передає дію, що почалася й закінчилася у відомий момент минулого."
            ex: ["Ayer ", { target: llamé }, " a mi madre."]
            tr: { en: I called my mother yesterday., uk: "Учора я подзвонив мамі." }
          - type: note
            level: A2
            text:
              en: ["Spanish grammars call it ", { term: pretérito indefinido }, " or ", { term: pretérito perfecto simple }, "."]
              es: ["Las gramáticas lo llaman ", { term: pretérito indefinido }, " o ", { term: pretérito perfecto simple }, "."]
              uk: ["Іспанські граматики називають його ", { term: pretérito indefinido }, " або ", { term: pretérito perfecto simple }, "."]
          - type: note
            level: A2
            variety: es-419
            text:
              en: "In most of Latin America, the preterite also tells actions finished earlier today; Andean Spanish (Peru, Bolivia, highland Ecuador) uses the perfect for them, as Spain does:"
              es: "En la mayor parte de Latinoamérica, el indefinido también cuenta acciones terminadas hoy; el español andino (Perú, Bolivia, la sierra de Ecuador) usa para ellas el perfecto, como en España:"
              uk: "У більшій частині Латинської Америки простий минулий передає й дії, завершені сьогодні; андська іспанська (Перу, Болівія, гірський Еквадор) уживає для них перфект, як в Іспанії:"
            ex: [{ signal: Hoy }, " ", { target: desayuné }, " temprano."]
            tr: { en: I had breakfast early today., uk: "Сьогодні я рано поснідав." }
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["In Spain, an action finished earlier today usually takes the ", { link: present perfect, to: es.pasados.preterito-perfecto }, ":"]
              es: ["En España, una acción terminada hoy suele llevar el ", { link: pretérito perfecto, to: es.pasados.preterito-perfecto }, ":"]
              uk: ["В Іспанії дія, завершена сьогодні, зазвичай стоїть у ", { link: перфекті, to: es.pasados.preterito-perfecto }, ":"]
            ex: [{ signal: Hoy }, " he desayunado temprano."]
            tr: { en: I had breakfast early today., uk: "Сьогодні я рано поснідав." }
          - type: note
            level: A2
            text:
              en: ["For description and habits in the past, see ", { link: Preterite or Imperfect, to: es.pasados.indefinido-imperfecto }, "."]
              es: ["Para la descripción y los hábitos en el pasado, ver ", { link: Indefinido o imperfecto, to: es.pasados.indefinido-imperfecto }, "."]
              uk: ["Про опис і звички в минулому див. ", { link: Простий минулий чи імперфект, to: es.pasados.indefinido-imperfecto }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова" }
    role: form
    features: { tense: pst, aspect: pfv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, ar: { target: [habl, { ending: é }] }, er: { target: [com, { ending: í }] }, ir: { target: [viv, { ending: í }] } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: { target: [habl, { ending: aste }] }, er: { target: [com, { ending: iste }] }, ir: { target: [viv, { ending: iste }] } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: { target: [habl, { ending: ó }] }, er: { target: [com, { ending: ió }] }, ir: { target: [viv, { ending: ió }] } }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: { target: [habl, { ending: amos }] }, er: { target: [com, { ending: imos }] }, ir: { target: [viv, { ending: imos }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: { target: [habl, { ending: asteis }] }, er: { target: [com, { ending: isteis }] }, ir: { target: [viv, { ending: isteis }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: { target: [habl, { ending: aron }] }, er: { target: [com, { ending: ieron }] }, ir: { target: [viv, { ending: ieron }] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Verbs in ", { term: -er }, " and ", { term: -ir }, " share one set of endings."]
              es: ["Los verbos en ", { term: -er }, " y en ", { term: -ir }, " comparten las terminaciones."]
              uk: ["Дієслова на ", { term: -er }, " і ", { term: -ir }, " мають спільні закінчення."]
          - type: rule
            level: A2
            text:
              en: "The yo and él forms carry a written accent on the last syllable:"
              es: "Las formas de yo y de él llevan tilde en la última sílaba:"
              uk: "Форми yo та él мають графічний наголос на останньому складі:"
            ex: { examples: [[{ target: Llegué }, " tarde."], ["Ella ", { target: llegó }, " tarde."]] }
            tr: { en: { examples: [I arrived late., She arrived late.] }, uk: { examples: ["Я спізнився.", "Вона спізнилася."] } }
          - type: rule
            level: A2
            text:
              en: ["The nosotros form of ", { term: -ar }, " and ", { term: -ir }, " verbs looks like the present; a time word marks the past:"]
              es: ["La forma de nosotros de los verbos en ", { term: -ar }, " y en ", { term: -ir }, " es igual que en presente; una palabra de tiempo marca el pasado:"]
              uk: ["Форма nosotros дієслів на ", { term: -ar }, " і ", { term: -ir }, " збігається з теперішнім часом; минуле позначає слово часу:"]
            ex: [{ signal: Anoche }, " ", { target: cenamos }, " en casa."]
            tr: { en: Last night we had dinner at home., uk: "Учора ввечері ми вечеряли вдома." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares", uk: "Форма: неправильні дієслова" }
    role: form
    features: { tense: pst, aspect: pfv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: serir, label: { alternatives: [ser, ir] } }
          - { key: tener, label: tener }
          - { key: hacer, label: hacer }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, serir: { target: fui }, tener: { target: [tuv, { ending: e }] }, hacer: { target: [hic, { ending: e }] } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, serir: { target: fuiste }, tener: { target: [tuv, { ending: iste }] }, hacer: { target: [hic, { ending: iste }] } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, serir: { target: fue }, tener: { target: [tuv, { ending: o }] }, hacer: { target: [hiz, { ending: o }] } }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, serir: { target: fuimos }, tener: { target: [tuv, { ending: imos }] }, hacer: { target: [hic, { ending: imos }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, serir: { target: fuisteis }, tener: { target: [tuv, { ending: isteis }] }, hacer: { target: [hic, { ending: isteis }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, serir: { target: fueron }, tener: { target: [tuv, { ending: ieron }] }, hacer: { target: [hic, { ending: ieron }] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: ser }, " and ", { term: ir }, " share their forms; the sentence shows which verb it is:"]
              es: [{ term: ser }, " e ", { term: ir }, " comparten las formas; la frase muestra qué verbo es:"]
              uk: [{ term: ser }, " та ", { term: ir }, " мають спільні форми; яке це дієслово, показує речення:"]
            ex: { examples: [[{ target: Fue }, " un buen día."], ["Marta ", { target: fue }, " a Cuba."]] }
            tr: { en: { examples: [It was a good day., Marta went to Cuba.] }, uk: { examples: ["Це був гарний день.", "Марта поїхала на Кубу."] } }
          - type: rule
            level: A2
            text:
              en: ["A new stem takes ", { ending: e }, " and ", { ending: o }, " in yo and él, with no accent:"]
              es: ["Una raíz nueva lleva ", { ending: e }, " y ", { ending: o }, " en yo y en él, sin tilde:"]
              uk: ["Нова основа має ", { ending: e }, " і ", { ending: o }, " у формах yo та él, без графічного наголосу:"]
            ex: { examples: [["Ayer ", { target: estuve }, " en casa."], ["Luis ", { target: hizo }, " la cena."]] }
            tr: { en: { examples: [I was at home yesterday., Luis made dinner.] }, uk: { examples: ["Учора я був удома.", "Луїс приготував вечерю."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: hacer }, " writes ", { letter: z }, " before ", { letter: o }, ": ", { term: hizo }, "."]
              es: [{ term: hacer }, " se escribe con ", { letter: z }, " delante de ", { letter: o }, ": ", { term: hizo }, "."]
              uk: [{ term: hacer }, " пише ", { letter: z }, " перед ", { letter: o }, ": ", { term: hizo }, "."]
            ex: ["¿Qué ", { target: hizo }, " usted el domingo?"]
            tr: { en: What did you do on Sunday?, uk: "Що ви робили в неділю?" }
          - type: rule
            level: A2
            text:
              en: [{ term: ver }, " and ", { term: dar }, " take the endings of ", { term: -er }, " and ", { term: -ir }, " verbs, with no accent:"]
              es: [{ term: ver }, " y ", { term: dar }, " llevan las terminaciones de los verbos en ", { term: -er }, " y en ", { term: -ir }, ", sin tilde:"]
              uk: [{ term: ver }, " і ", { term: dar }, " мають закінчення дієслів на ", { term: -er }, " і ", { term: -ir }, ", без графічного наголосу:"]
            ex: { examples: [["Ayer ", { target: vi }, " a Marta."], ["Me ", { target: dio }, " un regalo."]] }
            tr: { en: { examples: [I saw Marta yesterday., She gave me a present.] }, uk: { examples: ["Учора я бачив Марту.", "Вона подарувала мені подарунок."] } }
      - type: usage
        columns:
          - { key: stem, label: { en: Verb and stem, es: Verbo y raíz, uk: "Дієслово й основа" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A2, stem: { mapping: [{ term: estar }, { term: estuv- }] }, ex: ["¿Dónde ", { target: estuviste }, " ayer?"], tr: { en: Where were you yesterday?, uk: "Де ти був учора?" } }
          - { level: B1, stem: { mapping: [{ term: poder }, { term: pud- }] }, ex: ["No ", { target: pude }, " ir a la fiesta."], tr: { en: "I couldn't go to the party.", uk: "Я не зміг піти на вечірку." } }
          - { level: B1, stem: { mapping: [{ term: poner }, { term: pus- }] }, ex: ["¿Dónde ", { target: pusiste }, " las llaves?"], tr: { en: Where did you put the keys?, uk: "Куди ти поклав ключі?" } }
          - { level: B1, stem: { mapping: [{ term: querer }, { term: quis- }] }, ex: ["Pablo no ", { target: quiso }, " venir."], tr: { en: Pablo refused to come., uk: "Пабло відмовився прийти." } }
          - { level: B1, stem: { mapping: [{ term: saber }, { term: sup- }] }, ex: [{ target: Supe }, " la noticia ayer."], tr: { en: I heard the news yesterday., uk: "Я дізнався новину вчора." } }
          - { level: B1, stem: { mapping: [{ term: venir }, { term: vin- }] }, ex: ["Mis padres ", { target: vinieron }, " a verme."], tr: { en: My parents came to see me., uk: "Мої батьки приїхали до мене в гості." } }
          - { level: B1, stem: { mapping: [{ term: decir }, { term: dij- }] }, ex: ["¿Qué te ", { target: dijo }, "?"], tr: { en: What did she tell you?, uk: "Що вона тобі сказала?" } }
          - { level: B1, stem: { mapping: [{ term: traer }, { term: traj- }] }, ex: [{ target: Trajimos }, " un pastel."], tr: { en: We brought a cake., uk: "Ми принесли торт." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A stem in ", { letter: j }, " takes ", { ending: eron }, " in ellos:"]
