              es: ["Los verbos en ", { term: -ir }, " con cambio de raíz cambian en él y ellos: ", { letter: e }, " a ", { letter: i }, ", ", { letter: o }, " a ", { letter: u }, "."]
              uk: ["Дієслова на ", { term: -ir }, " зі зміною основи змінюють основу в él та ellos: ", { letter: e }, " на ", { letter: i }, ", ", { letter: o }, " на ", { letter: u }, "."]
