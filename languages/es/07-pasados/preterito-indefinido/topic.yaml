  - title: { en: "Spelling: the yo form and -yó", es: "Ortografía: la forma de yo y -yó", uk: "Написання: форма yo і -yó" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: change, label: { en: Change, es: Cambio, uk: "Зміна" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: B1, change: { mapping: [{ term: buscar }, { term: busqué }] }, ex: ["Te ", { target: busqué }, " en la fiesta."], tr: { en: I looked for you at the party., uk: "Я шукав тебе на вечірці." } }
          - { level: B1, change: { mapping: [{ term: llegar }, { term: llegué }] }, ex: [{ target: Llegué }, " tarde a clase."], tr: { en: I was late for class., uk: "Я спізнився на заняття." } }
          - { level: B1, change: { mapping: [{ term: empezar }, { term: empecé }] }, ex: ["El lunes ", { target: empecé }, " a trabajar."], tr: { en: On Monday I started work., uk: "У понеділок я вийшов на роботу." } }
          - { level: B1, change: { mapping: [{ term: leer }, { alternatives: [{ term: leyó }, { term: leyeron }] }] }, ex: ["Ana ", { target: leyó }, " el libro en un día."], tr: { en: Ana read the book in one day., uk: "Ана прочитала книжку за один день." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["In yo, verbs in ", { term: -car }, ", ", { term: -gar }, " and ", { term: -zar }, " change their spelling before ", { letter: e }, ": ", { mapping: [{ letter: c }, { letter: qu }] }, ", ", { mapping: [{ letter: g }, { letter: gu }] }, ", ", { mapping: [{ letter: z }, { letter: c }] }, "."]
              es: ["En yo, los verbos en ", { term: -car }, ", ", { term: -gar }, " y ", { term: -zar }, " cambian la grafía delante de ", { letter: e }, ": ", { mapping: [{ letter: c }, { letter: qu }] }, ", ", { mapping: [{ letter: g }, { letter: gu }] }, ", ", { mapping: [{ letter: z }, { letter: c }] }, "."]
              uk: ["У формі yo дієслова на ", { term: -car }, ", ", { term: -gar }, " і ", { term: -zar }, " змінюють написання перед ", { letter: e }, ": ", { mapping: [{ letter: c }, { letter: qu }] }, ", ", { mapping: [{ letter: g }, { letter: gu }] }, ", ", { mapping: [{ letter: z }, { letter: c }] }, "."]
          - type: rule
            level: B1
            text:
              en: ["A vowel before the ending turns ", { letter: i }, " into ", { letter: y }, " in él and ellos: ", { term: leyó }, ", ", { term: oyeron }, "."]
              es: ["Una vocal delante de la terminación convierte la ", { letter: i }, " en ", { letter: y }, " en él y ellos: ", { term: leyó }, ", ", { term: oyeron }, "."]
              uk: ["Голосна перед закінченням перетворює ", { letter: i }, " на ", { letter: y }, " у формах él та ellos: ", { term: leyó }, ", ", { term: oyeron }, "."]

  - title: { en: Use, es: Uso, uk: "Вживання" }
    role: use
