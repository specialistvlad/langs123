          - { key: strong, label: { es: "Participio irregular", en: "Irregular participle", uk: "Неправильний дієприкметник", pt: "Particípio irregular", fr: "Participe irrégulier", de: "Unregelmäßiges Partizip", it: "Participio irregolare", pl: "Imiesłów nieregularny", tr: "Düzensiz participio", id: "Partisip tidak beraturan", vi: "Quá khứ phân từ bất quy tắc" } }
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
        rows:
          - { level: C2, verb: abstraer, weak: { target: abstraído }, strong: { target: abstracto }, use: { ex: ["Se ha ", { target: abstraído }, " del ruido. Es una idea ", { target: abstracta }, "."], tr: { en: "He has blocked out the noise. It is an abstract idea.", uk: "Він абстрагувався від шуму. Це абстрактна ідея.", pt: "Ele se abstraiu do barulho. É uma ideia abstrata.", fr: "Il s’est isolé du bruit. C’est une idée abstraite.", de: "Er hat sich vom Lärm abgeschirmt. Es ist eine abstrakte Idee.", it: "Si è estraniato dal rumore. È un'idea astratta.", pl: "Odciął się od hałasu. To abstrakcyjny pomysł.", tr: "Gürültüden kendini soyutladı. Bu soyut bir fikir.", id: "Dia mengabaikan kebisingan itu. Itu gagasan yang abstrak.", vi: "Anh ấy đã phớt lờ tiếng ồn. Đó là một ý tưởng trừu tượng." } } }
          - { level: C2, verb: concluir, weak: { target: concluido }, strong: { target: concluso }, use: { ex: ["Ha ", { target: concluido }, " el juicio. El caso quedó ", { target: concluso }, "."], tr: { en: "The trial has ended. The case is now ready for judgment.", uk: "Судовий розгляд завершено. Справа готова до винесення вироку.", pt: "O julgamento terminou. O processo ficou concluso.", fr: "Le procès est terminé. L’affaire est mise en délibéré.", de: "Der Prozess ist beendet. Der Fall ist entscheidungsreif.", it: "Il processo si è concluso. La causa è pronta per la decisione.", pl: "Proces dobiegł końca. Sprawa jest gotowa do wyroku.", tr: "Dava sona erdi. Dosya karara hazır durumda.", id: "Persidangan telah selesai. Perkara itu siap diputus.", vi: "Phiên tòa đã kết thúc. Vụ án đã sẵn sàng để tuyên án." } } }
          - { level: C2, verb: elegir, weak: { target: elegido }, strong: { target: electo }, use: { ex: ["Han ", { target: elegido }, " a la alcaldesa. Es la alcaldesa ", { target: electa }, "."], tr: { en: "They have elected the mayor. She is the mayor-elect.", uk: "Мерку обрали. Вона — новообрана мерка.", pt: "Elegeram a prefeita. É a prefeita eleita.", fr: "Ils ont élu la maire. C’est la maire élue.", de: "Man hat die Bürgermeisterin gewählt. Sie ist die gewählte Bürgermeisterin.", it: "Hanno eletto la sindaca. È la sindaca eletta.", pl: "Wybrali burmistrzynię. To nowo wybrana burmistrzyni.", tr: "Belediye başkanını seçtiler. O, seçilmiş belediye başkanı.", id: "Mereka telah memilih wali kota perempuan itu. Dialah wali kota terpilih.", vi: "Họ đã bầu nữ thị trưởng. Bà là thị trưởng đắc cử." } } }
          - { level: C2, verb: imprimir, weak: { target: imprimido }, strong: { target: impreso }, use: { ex: ["Ha ", { target: imprimido }, " el informe. El informe ", { target: impreso }, " está en la mesa."], tr: { en: "She has printed the report. The printed report is on the table.", uk: "Вона надрукувала звіт. Надрукований звіт лежить на столі.", pt: "Ela imprimiu o relatório. O relatório impresso está na mesa.", fr: "Elle a imprimé le rapport. Le rapport imprimé est sur la table.", de: "Sie hat den Bericht gedruckt. Der gedruckte Bericht liegt auf dem Tisch.", it: "Ha stampato il rapporto. Il rapporto stampato è sul tavolo.", pl: "Wydrukowała raport. Wydrukowany raport leży na stole.", tr: "Raporu yazdırdı. Basılı rapor masanın üzerinde.", id: "Dia sudah mencetak laporan itu. Laporan yang tercetak ada di atas meja.", vi: "Cô ấy đã in báo cáo. Bản báo cáo đã in nằm trên bàn." } } }
          - { level: C2, verb: freír, weak: { target: freído }, strong: { target: frito }, use: { ex: ["Ha ", { target: freído }, " los huevos. Prefiero los huevos ", { target: fritos }, "."], tr: { en: "She has fried the eggs. I prefer fried eggs.", uk: "Вона посмажила яйця. Я віддаю перевагу смаженим яйцям.", pt: "Ela fritou os ovos. Prefiro os ovos fritos.", fr: "Elle a fait frire les œufs. Je préfère les œufs frits.", de: "Sie hat die Eier gebraten. Ich bevorzuge gebratene Eier.", it: "Ha fritto le uova. Preferisco le uova fritte.", pl: "Usmażyła jajka. Wolę jajka smażone.", tr: "Yumurtaları kızarttı. Ben kızarmış yumurtayı tercih ederim.", id: "Dia sudah menggoreng telur itu. Saya lebih suka telur goreng.", vi: "Cô ấy đã rán trứng. Tôi thích trứng rán hơn." } } }
          - { level: C2, verb: proveer, weak: { target: proveído }, strong: { target: provisto }, use: { ex: ["Ha ", { target: proveído }, " de agua al pueblo. El pueblo está ", { target: provisto }, " de agua."], tr: { en: "She has supplied the village with water. The village is supplied with water.", uk: "Вона забезпечила село водою. Село забезпечене водою.", pt: "Ela abasteceu o povoado de água. O povoado está abastecido de água.", fr: "Elle a approvisionné le village en eau. Le village est approvisionné en eau.", de: "Sie hat das Dorf mit Wasser versorgt. Das Dorf ist mit Wasser versorgt.", it: "Ha rifornito d'acqua il paese. Il paese è rifornito d'acqua.", pl: "Zaopatrzyła wieś w wodę. Wieś jest zaopatrzona w wodę.", tr: "Köyü suyla donattı. Köy suyla donatılmış durumda.", id: "Dia telah memasok air ke desa itu. Desa itu sudah dipasok air.", vi: "Cô ấy đã cung cấp nước cho ngôi làng. Ngôi làng được cung cấp đủ nước." } } }
          - { level: C2, verb: bendecir, weak: { target: bendecido }, strong: { target: bendito }, use: { ex: ["El cura ha ", { target: bendecido }, " la casa. Rezó con agua ", { target: bendita }, "."], tr: { en: "The priest has blessed the house. He prayed with holy water.", uk: "Священник благословив дім. Він молився зі святою водою.", pt: "O padre abençoou a casa. Rezou com água benta.", fr: "Le curé a béni la maison. Il a prié avec de l’eau bénite.", de: "Der Pfarrer hat das Haus gesegnet. Er betete mit Weihwasser.", it: "Il parroco ha benedetto la casa. Ha pregato con l'acqua benedetta.", pl: "Ksiądz pobłogosławił dom. Modlił się ze święconą wodą.", tr: "Rahip evi kutsadı. Kutsal suyla dua etti.", id: "Pastor telah memberkati rumah itu. Ia berdoa dengan air suci.", vi: "Cha xứ đã làm phép ngôi nhà. Ông cầu nguyện với nước thánh." } } }
          - { level: C2, verb: maldecir, weak: { target: maldecido }, strong: { target: maldito }, use: { ex: ["Ha ", { target: maldecido }, " su suerte. ¡", { target: Maldito }, " teléfono!"], tr: { en: "He has cursed his luck. Damn this phone!", uk: "Він проклинав свою долю. Проклятий телефон!", pt: "Ele amaldiçoou a sua sorte. Maldito telefone!", fr: "Il a maudit son sort. Maudit téléphone !", de: "Er hat sein Schicksal verflucht. Verdammtes Telefon!", it: "Ha maledetto la sua sorte. Maledetto telefono!", pl: "Przeklął swój los. Przeklęty telefon!", tr: "Kaderine lanet etti. Lanet telefon!", id: "Dia mengutuk nasibnya. Telepon sialan!", vi: "Anh ấy đã nguyền rủa số phận của mình. Cái điện thoại chết tiệt!" } } }
      - type: list
        items:
