summary:
  lead:
    en: ["The most frequent irregular verbs with their present yo form, preterite and participle, such as ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    es: ["Los verbos irregulares más frecuentes con su presente de yo, su indefinido y su participio, como ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    uk: ["Найуживаніші неправильні дієслова з формою yo теперішнього часу, претеритом і дієприкметником, як-от ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    pt: ["Os verbos irregulares mais frequentes, com o presente de yo, o pretérito perfeito simples e o particípio, como ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    fr: ["Les verbes irréguliers les plus fréquents, avec leur présent de yo, leur prétérit et leur participe, comme ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    de: ["Die häufigsten unregelmäßigen Verben mit ihrem Präsens bei yo, ihrem Indefinido und ihrem Partizip, etwa ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    it: ["I verbi irregolari più frequenti, con il presente di yo, l’indefinido e il participio, come ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    pl: ["Najczęstsze czasowniki nieregularne z formą yo czasu teraźniejszego, indefinido i imiesłowem, np. ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    tr: ["En sık kullanılan düzensiz fiiller: yo için presente, indefinido ve participio biçimleriyle, örneğin ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    id: ["Kata kerja tidak beraturan yang paling sering dipakai, dengan presente yo, indefinido, dan partisipnya, seperti ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    vi: ["Các động từ bất quy tắc thường gặp nhất, với dạng yo ở hiện tại, indefinido và quá khứ phân từ, như ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
  rule:
    en: ["A new preterite stem takes ", { ending: e }, " and ", { ending: o }, " in yo and él, with no accent:"]
    es: ["Una raíz nueva de indefinido lleva ", { ending: e }, " y ", { ending: o }, " en yo y en él, sin tilde:"]
    uk: ["Нова основа претериту має ", { ending: e }, " і ", { ending: o }, " у формах yo та él, без знака наголосу:"]
    pt: ["Um radical novo no pretérito perfeito simples leva ", { ending: e }, " e ", { ending: o }, " em yo e em él, sem acento:"]
    fr: ["Un nouveau radical de prétérit prend ", { ending: e }, " et ", { ending: o }, " à yo et à él, sans accent :"]
    de: ["Ein neuer Stamm im Indefinido hat bei yo und él die Endungen ", { ending: e }, " und ", { ending: o }, ", ohne Akzent:"]
    it: ["Una nuova radice dell’indefinido prende ", { ending: e }, " e ", { ending: o }, " in yo e in él, senza accento:"]
    pl: ["Nowy temat indefinido ma końcówki ", { ending: e }, " i ", { ending: o }, " w formach yo i él, bez akcentu:"]
    tr: ["Indefinido için yeni bir kök, yo ve él biçimlerinde ", { ending: e }, " ve ", { ending: o }, " ekini alır, vurgu işareti olmadan:"]
    id: ["Akar kata baru pada indefinido mendapat ", { ending: e }, " dan ", { ending: o }, " pada yo dan él, tanpa aksen:"]
    vi: ["Gốc từ mới của indefinido nhận ", { ending: e }, " và ", { ending: o }, " ở yo và él, không có dấu:"]
  ex: { examples: [[{ target: Tuve }, " suerte."], ["Luis ", { target: hizo }, " la cena."]] }

