sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "An irregular verb changes its stem, or its whole form, in some tenses; its endings stay close to the regular ones."
              es: "Un verbo irregular cambia la raíz, o la forma entera, en algunos tiempos; las terminaciones se parecen a las regulares."
              uk: "Неправильне дієслово в деяких часах змінює основу або всю форму; закінчення лишаються близькими до правильних."
              pt: "Um verbo irregular muda o radical, ou a forma inteira, em alguns tempos; as terminações se parecem com as dos verbos regulares."
              fr: "Un verbe irrégulier change de radical, ou de forme entière, à certains temps ; ses terminaisons ressemblent à celles des verbes réguliers."
              de: "Ein unregelmäßiges Verb ändert in manchen Zeitformen den Stamm oder die ganze Form; die Endungen ähneln den regelmäßigen."
              it: "Un verbo irregolare cambia la radice, o l’intera forma, in alcuni tempi; le desinenze somigliano a quelle regolari."
              pl: "Czasownik nieregularny zmienia temat lub całą formę w niektórych czasach; końcówki są podobne do regularnych."
              tr: "Düzensiz bir fiil bazı zamanlarda kökünü ya da bütün biçimini değiştirir; ekleri düzenli fiillerinkine benzer."
              id: "Kata kerja tidak beraturan mengubah akar kata, atau seluruh bentuknya, pada beberapa tense; akhirannya mirip dengan kata kerja beraturan."
              vi: "Động từ bất quy tắc đổi gốc từ, hoặc đổi cả dạng, ở một số thì; phần đuôi gần giống động từ có quy tắc."
            ex: ["Ayer ", { target: tuve }, " un examen."]
            tr: { en: I had an exam yesterday., uk: "Учора в мене був іспит.", pt: "Ontem tive uma prova.", fr: "Hier, j’ai eu un examen.", de: "Gestern hatte ich eine Prüfung.", it: "Ieri ho avuto un esame.", pl: "Wczoraj miałem egzamin.", tr: "Dün sınavım vardı.", id: "Kemarin saya ada ujian.", vi: "Hôm qua tôi có một bài kiểm tra." }
          - type: rule
            level: A2
            text:
              en: "The preterite column gives the yo form, and the él form too where the stem changes."
              es: "La columna del indefinido da la forma de yo, y también la de él cuando cambia la raíz."
              uk: "Стовпчик претериту дає форму yo, а там, де змінюється основа, — ще й форму él."
              pt: "A coluna do pretérito perfeito simples dá a forma de yo e também a de él quando o radical muda."
              fr: "La colonne du prétérit donne la forme de yo, et aussi celle de él quand le radical change."
              de: "Die Spalte des Indefinido zeigt die yo-Form und auch die él-Form, wenn sich der Stamm ändert."
              it: "La colonna dell’indefinido dà la forma di yo, e anche quella di él quando la radice cambia."
              pl: "Kolumna indefinido podaje formę yo, a także formę él, gdy zmienia się temat."
              tr: "Indefinido sütunu yo biçimini verir; kök değiştiğinde él biçimini de verir."
              id: "Kolom indefinido memberi bentuk yo, dan juga bentuk él bila akar kata berubah."
              vi: "Cột indefinido cho dạng yo, và cả dạng él khi gốc từ đổi."
          - type: note
            level: A2
            text:
              en: ["In the ", { link: imperfect, to: es.pasados.preterito-imperfecto }, ", only ", { term: ser }, ", ", { term: ir }, " and ", { term: ver }, " are irregular."]
              es: ["En el ", { link: imperfecto, to: es.pasados.preterito-imperfecto }, ", solo ", { term: ser }, ", ", { term: ir }, " y ", { term: ver }, " son irregulares."]
              uk: ["В ", { link: імперфекті, to: es.pasados.preterito-imperfecto }, " неправильні лише ", { term: ser }, ", ", { term: ir }, " і ", { term: ver }, "."]
              pt: ["No ", { link: pretérito imperfeito, to: es.pasados.preterito-imperfecto }, ", só ", { term: ser }, ", ", { term: ir }, " e ", { term: ver }, " são irregulares."]
              fr: ["À l’", { link: imparfait, to: es.pasados.preterito-imperfecto }, ", seuls ", { term: ser }, ", ", { term: ir }, " et ", { term: ver }, " sont irréguliers."]
              de: ["Im ", { link: Imperfecto, to: es.pasados.preterito-imperfecto }, " sind nur ", { term: ser }, ", ", { term: ir }, " und ", { term: ver }, " unregelmäßig."]
              it: ["Nell’", { link: imperfecto, to: es.pasados.preterito-imperfecto }, " sono irregolari solo ", { term: ser }, ", ", { term: ir }, " e ", { term: ver }, "."]
              pl: ["W ", { link: imperfecto, to: es.pasados.preterito-imperfecto }, " nieregularne są tylko ", { term: ser }, ", ", { term: ir }, " i ", { term: ver }, "."]
              tr: [{ link: imperfecto, to: es.pasados.preterito-imperfecto }, " zamanında yalnızca ", { term: ser }, ", ", { term: ir }, " ve ", { term: ver }, " düzensizdir."]
              id: ["Pada ", { link: imperfecto, to: es.pasados.preterito-imperfecto }, ", hanya ", { term: ser }, ", ", { term: ir }, ", dan ", { term: ver }, " yang tidak beraturan."]
              vi: ["Ở ", { link: imperfecto, to: es.pasados.preterito-imperfecto }, ", chỉ ", { term: ser }, ", ", { term: ir }, " và ", { term: ver }, " là bất quy tắc."]
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["The vosotros forms keep the same stems: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              es: ["Las formas de vosotros mantienen las mismas raíces: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              uk: ["Форми vosotros зберігають ту саму основу: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              pt: ["As formas de vosotros mantêm os mesmos radicais: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              fr: ["Les formes de vosotros gardent les mêmes radicaux : ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              de: ["Die vosotros-Formen behalten dieselben Stämme: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              it: ["Le forme di vosotros mantengono le stesse radici: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              pl: ["Formy vosotros zachowują te same tematy: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              tr: ["Vosotros biçimleri aynı kökleri korur: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              id: ["Bentuk vosotros mempertahankan akar kata yang sama: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              vi: ["Các dạng vosotros giữ nguyên gốc từ: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
            ex: ["¿Qué ", { target: hicisteis }, " el sábado?"]
            tr: { en: What did you do on Saturday?, uk: "Що ви робили в суботу?", pt: "O que vocês fizeram no sábado?", fr: "Qu’avez-vous fait samedi ?", de: "Was habt ihr am Samstag gemacht?", it: "Che cosa avete fatto sabato?", pl: "Co robiliście w sobotę?", tr: "Cumartesi günü ne yaptınız?", id: "Apa yang kalian lakukan hari Sabtu?", vi: "Thứ Bảy các bạn đã làm gì?" }

  - title: { en: "Fully irregular: ser, ir, estar, dar, ver, saber", es: "Muy irregulares: ser, ir, estar, dar, ver, saber", uk: "Цілком неправильні: ser, ir, estar, dar, ver, saber", pt: "Muito irregulares: ser, ir, estar, dar, ver, saber", fr: "Très irréguliers : ser, ir, estar, dar, ver, saber", de: "Stark unregelmäßig: ser, ir, estar, dar, ver, saber", it: "Molto irregolari: ser, ir, estar, dar, ver, saber", pl: "W pełni nieregularne: ser, ir, estar, dar, ver, saber", tr: "Çok düzensiz fiiller: ser, ir, estar, dar, ver, saber", id: "Sangat tidak beraturan: ser, ir, estar, dar, ver, saber", vi: "Rất bất quy tắc: ser, ir, estar, dar, ver, saber" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo, uk: "Інфінітив", pt: "Infinitivo", fr: "Infinitif", de: "Infinitiv", it: "Infinito", pl: "Bezokolicznik", tr: "Mastar", id: "Infinitif", vi: "Nguyên mẫu" }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo", uk: "Теперішній час, yo", pt: "Presente, yo", fr: "Présent, yo", de: "Präsens, yo", it: "Presente, yo", pl: "Czas teraźniejszy, yo", tr: "Presente, yo", id: "Presente, yo", vi: "Hiện tại, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido, uk: "Претерит", pt: "Perfeito simples", fr: "Prétérit", de: "Indefinido", it: "Indefinido", pl: "Indefinido", tr: "Indefinido", id: "Indefinido", vi: "Indefinido" }, features: { tense: pst, aspect: pfv } }
