          - type: note
            level: B2
            text: { es: ["Todas las personas y los usos: ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, "."], en: ["All the persons and uses: ", { link: "Imperfect Subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, "."], uk: ["Усі особи й уживання: ", { link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, "."], pt: ["Todas as pessoas e os usos: ", { link: "O imperfeito do subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, "."], fr: ["Toutes les personnes et tous les emplois : ", { link: "L’imparfait du subjonctif", to: es.subjuntivo.subjuntivo-imperfecto }, "."], de: ["Alle Personen und Verwendungen: ", { link: "Der Konjunktiv Imperfecto", to: es.subjuntivo.subjuntivo-imperfecto }, "."], it: ["Tutte le persone e gli usi: ", { link: "L'imperfetto del congiuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, "."], pl: ["Wszystkie osoby i użycia: ", { link: "Imperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-imperfecto }, "."], tr: ["Tüm kişiler ve kullanımlar: ", { link: "Dilek kipinin imperfecto biçimi", to: es.subjuntivo.subjuntivo-imperfecto }, "."], id: ["Semua pelaku dan penggunaan: ", { link: "Imperfecto subjungtif", to: es.subjuntivo.subjuntivo-imperfecto }, "."], vi: ["Tất cả các ngôi và cách dùng: ", { link: "Imperfecto của thức giả định", to: es.subjuntivo.subjuntivo-imperfecto }, "."] }

  - title: { en: More irregular participles, es: Más participios irregulares, uk: "Ще неправильні дієприкметники", pt: "Mais particípios irregulares", fr: "D’autres participes irréguliers", de: "Weitere unregelmäßige Partizipien", it: "Altri participi irregolari", pl: "Więcej imiesłowów nieregularnych", tr: "Başka düzensiz participio biçimleri", id: "Partisip tidak beraturan lainnya", vi: "Thêm các quá khứ phân từ bất quy tắc" }
    role: own
    content:
      - type: usage
        columns:
          - { key: participle, label: { en: Verb and participle, es: Verbo y participio, uk: "Дієслово й дієприкметник", pt: "Verbo e particípio", fr: "Verbe et participe", de: "Verb und Partizip", it: "Verbo e participio", pl: "Czasownik i imiesłów", tr: "Fiil ve participio", id: "Kata kerja dan partisip", vi: "Động từ và quá khứ phân từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, participle: { mapping: [{ term: escribir }, { term: escrito }] }, ex: ["¿", { target: Has escrito }, " a tu madre?"], tr: { en: Have you written to your mother?, uk: "Ти написав мамі?", pt: "Você escreveu para a sua mãe?", fr: "As-tu écrit à ta mère ?", de: "Hast du deiner Mutter geschrieben?", it: "Hai scritto a tua madre?", pl: "Czy napisałeś do swojej mamy?", tr: "Annene yazdın mı?", id: "Apakah kamu sudah menulis kepada ibumu?", vi: "Bạn đã viết cho mẹ chưa?" } }
          - { level: A2, participle: { mapping: [{ term: abrir }, { term: abierto }] }, ex: ["La tienda está ", { target: abierta }, "."], tr: { en: The shop is open., uk: "Крамниця відчинена.", pt: "A loja está aberta.", fr: "Le magasin est ouvert.", de: "Das Geschäft ist geöffnet.", it: "Il negozio è aperto.", pl: "Sklep jest otwarty.", tr: "Dükkân açık.", id: "Tokonya buka.", vi: "Cửa hàng đang mở cửa." } }
          - { level: A2, participle: { mapping: [{ term: romper }, { term: roto }] }, ex: ["Se ha ", { target: roto }, " la tele."], tr: { en: The TV has broken., uk: "Телевізор зламався.", pt: "A TV quebrou.", fr: "La télé s’est cassée.", de: "Der Fernseher ist kaputtgegangen.", it: "Si è rotta la tv.", pl: "Telewizor się zepsuł.", tr: "Televizyon bozuldu.", id: "Televisinya rusak.", vi: "Cái tivi bị hỏng rồi." } }
          - { level: A2, participle: { mapping: [{ term: morir }, { term: muerto }] }, ex: ["El pez ", { target: ha muerto }, "."], tr: { en: The fish has died., uk: "Рибка здохла.", pt: "O peixe morreu.", fr: "Le poisson est mort.", de: "Der Fisch ist gestorben.", it: "Il pesce è morto.", pl: "Rybka zdechła.", tr: "Balık öldü.", id: "Ikannya mati.", vi: "Con cá chết rồi." } }
          - { level: B1, participle: { mapping: [{ term: descubrir }, { term: descubierto }] }, ex: ["¿Quién ", { target: ha descubierto }, " el error?"], tr: { en: Who has found the mistake?, uk: "Хто знайшов помилку?", pt: "Quem descobriu o erro?", fr: "Qui a découvert l’erreur ?", de: "Wer hat den Fehler entdeckt?", it: "Chi ha scoperto l’errore?", pl: "Kto odkrył błąd?", tr: "Hatayı kim buldu?", id: "Siapa yang menemukan kesalahan itu?", vi: "Ai đã phát hiện ra lỗi?" } }
          - { level: B1, participle: { mapping: [{ term: resolver }, { term: resuelto }] }, ex: ["Ya ", { target: hemos resuelto }, " el problema."], tr: { en: "We've already solved the problem.", uk: "Ми вже розв’язали проблему.", pt: "Nós já resolvemos o problema.", fr: "Nous avons déjà résolu le problème.", de: "Wir haben das Problem schon gelöst.", it: "Abbiamo già risolto il problema.", pl: "Rozwiązaliśmy już problem.", tr: "Sorunu çoktan çözdük.", id: "Kami sudah memecahkan masalahnya.", vi: "Chúng tôi đã giải quyết vấn đề rồi." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A verb built on an irregular one keeps its participle: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              es: ["Un verbo formado sobre uno irregular mantiene su participio: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              uk: ["Дієслово, утворене від неправильного, зберігає його дієприкметник: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              pt: ["Um verbo formado a partir de um irregular mantém o particípio dele: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              fr: ["Un verbe formé sur un verbe irrégulier garde son participe : ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              de: ["Ein von einem unregelmäßigen Verb abgeleitetes Verb behält dessen Partizip: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              it: ["Un verbo formato su uno irregolare mantiene il suo participio: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              pl: ["Czasownik utworzony od nieregularnego zachowuje jego imiesłów: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              tr: ["Düzensiz bir fiilden türeyen fiil, onun participio biçimini korur: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              id: ["Kata kerja yang dibentuk dari kata kerja tidak beraturan mempertahankan partisipnya: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              vi: ["Động từ tạo từ một động từ bất quy tắc giữ nguyên quá khứ phân từ của nó: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
            ex: ["Ya ", { target: he devuelto }, " el libro."]
            tr: { en: "I've already returned the book.", uk: "Я вже повернув книжку.", pt: "Eu já devolvi o livro.", fr: "J’ai déjà rendu le livre.", de: "Ich habe das Buch schon zurückgegeben.", it: "Ho già restituito il libro.", pl: "Oddałem już książkę.", tr: "Kitabı çoktan geri verdim.", id: "Saya sudah mengembalikan bukunya.", vi: "Tôi đã trả sách rồi." }
          - type: rule
            level: A2
            text:
              en: "A participle used as an adjective agrees with its noun:"
              es: "Un participio usado como adjetivo concuerda con su sustantivo:"
              uk: "Дієприкметник у ролі прикметника узгоджується зі своїм іменником:"
              pt: "Um particípio usado como adjetivo concorda com o seu substantivo:"
              fr: "Un participe employé comme adjectif s’accorde avec son nom :"
              de: "Ein als Adjektiv gebrauchtes Partizip richtet sich nach seinem Substantiv:"
              it: "Un participio usato come aggettivo concorda con il suo sostantivo:"
              pl: "Imiesłów użyty jako przymiotnik zgadza się ze swoim rzeczownikiem:"
              tr: "Sıfat olarak kullanılan participio, ismiyle uyum gösterir:"
              id: "Partisip yang dipakai sebagai kata sifat menyesuaikan diri dengan kata bendanya:"
              vi: "Quá khứ phân từ dùng như tính từ phải hòa hợp với danh từ của nó:"
            ex: ["Las ventanas están ", { target: abiertas }, "."]
            tr: { en: The windows are open., uk: "Вікна відчинені.", pt: "As janelas estão abertas.", fr: "Les fenêtres sont ouvertes.", de: "Die Fenster sind geöffnet.", it: "Le finestre sono aperte.", pl: "Okna są otwarte.", tr: "Pencereler açık.", id: "Jendela-jendelanya terbuka.", vi: "Các cửa sổ đang mở." }

