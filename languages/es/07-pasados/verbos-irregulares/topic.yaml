              pl: ["W indefinido te czasowniki zmieniają temat tylko w formach él i ellos: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
              tr: ["Bu fiiller indefinido biçiminde kökü yalnızca él ve ellos için değiştirir: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
              id: ["Pada indefinido, kata kerja ini mengubah akar kata hanya pada él dan ellos: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
              vi: ["Ở indefinido, các động từ này chỉ đổi gốc từ ở él và ellos: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
