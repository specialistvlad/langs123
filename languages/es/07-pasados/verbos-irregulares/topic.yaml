title: { en: Irregular Verbs Table, es: Tabla de verbos irregulares }
summary:
  lead:
    en: ["The most frequent irregular verbs with their present yo form, preterite and participle, such as ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
    es: ["Los verbos irregulares más frecuentes con su presente de yo, su indefinido y su participio, como ", { term: tener }, ", ", { term: tengo }, ", ", { term: tuve }, ", ", { term: tenido }, "."]
  rule:
    en: ["A new preterite stem takes ", { ending: e }, " and ", { ending: o }, " in yo and él, with no accent:"]
    es: ["Una raíz nueva de indefinido lleva ", { ending: e }, " y ", { ending: o }, " en yo y en él, sin tilde:"]
  ex: { examples: [[{ target: Tuve }, " suerte."], ["Luis ", { target: hizo }, " la cena."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
        - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
        - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
        - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
      rows:
        - { level: A2, verb: ser, present: { target: soy }, preterite: { target: fui }, participle: sido }
        - { level: A2, verb: ir, present: { target: voy }, preterite: { target: fui }, participle: ido }
        - { level: A2, verb: estar, present: { target: estoy }, preterite: { target: estuve }, participle: estado }
        - { level: A2, verb: tener, present: { target: tengo }, preterite: { target: tuve }, participle: tenido }
        - { level: A2, verb: hacer, present: { target: hago }, preterite: { target: hice }, participle: { target: hecho } }
        - { level: A2, verb: ver, present: { target: veo }, preterite: { target: vi }, participle: { target: visto } }
        - { level: B1, verb: decir, present: { target: digo }, preterite: { target: dije }, participle: { target: dicho } }
        - { level: B1, verb: poner, present: { target: pongo }, preterite: { target: puse }, participle: { target: puesto } }
        - { level: B1, verb: poder, present: { target: puedo }, preterite: { target: pude }, participle: podido }
        - { level: B1, verb: querer, present: { target: quiero }, preterite: { target: quise }, participle: querido }
        - { level: B1, verb: pedir, present: { target: pido }, preterite: { alternatives: [pedí, { target: pidió }] }, participle: pedido }
        - { level: B1, verb: conducir, present: { target: conduzco }, preterite: { target: conduje }, participle: conducido }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "An irregular verb changes its stem, or its whole form, in some tenses; its endings stay close to the regular ones."
              es: "Un verbo irregular cambia la raíz, o la forma entera, en algunos tiempos; las terminaciones se parecen a las regulares."
            ex: ["Ayer ", { target: tuve }, " un examen."]
            tr: { en: I had an exam yesterday. }
          - type: rule
            level: A2
            text:
              en: "The preterite column gives the yo form, and the él form too where the stem changes."
              es: "La columna del indefinido da la forma de yo, y también la de él cuando cambia la raíz."
          - type: note
            level: A2
            text:
              en: ["In the ", { link: imperfect, to: es.pasados.preterito-imperfecto }, ", only ", { term: ser }, ", ", { term: ir }, " and ", { term: ver }, " are irregular."]
              es: ["En el ", { link: imperfecto, to: es.pasados.preterito-imperfecto }, ", solo ", { term: ser }, ", ", { term: ir }, " y ", { term: ver }, " son irregulares."]
          - type: note
            level: A2
            variety: es-ES
            text:
              en: ["The vosotros forms keep the same stems: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
              es: ["Las formas de vosotros mantienen las mismas raíces: ", { term: tuvisteis }, ", ", { term: hicisteis }, "."]
            ex: ["¿Qué ", { target: hicisteis }, " el sábado?"]
            tr: { en: What did you do on Saturday? }

  - title: { en: "Fully irregular: ser, ir, estar, dar, ver, saber", es: "Muy irregulares: ser, ir, estar, dar, ver, saber" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
          - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
        rows:
          - { level: A2, verb: ser, present: { target: soy }, preterite: { target: fui }, participle: sido }
          - { level: A2, verb: ir, present: { target: voy }, preterite: { target: fui }, participle: ido }
          - { level: A2, verb: estar, present: { target: estoy }, preterite: { target: estuve }, participle: estado }
          - { level: A2, verb: dar, present: { target: doy }, preterite: { target: di }, participle: dado }
          - { level: A2, verb: ver, present: { target: veo }, preterite: { target: vi }, participle: { target: visto } }
          - { level: B1, verb: saber, present: { target: sé }, preterite: { target: supe }, participle: sabido }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: ser }, " and ", { term: ir }, " share the preterite, and the sentence shows which verb it is:"]
              es: [{ term: ser }, " e ", { term: ir }, " comparten el indefinido, y la frase muestra qué verbo es:"]
            ex: { examples: [["La fiesta ", { target: fue }, " genial."], ["Ana ", { target: fue }, " a la fiesta."]] }
            tr: { en: { examples: [The party was great., Ana went to the party.] } }
          - type: rule
            level: A2
            text:
              en: ["The preterite of ", { term: dar }, " and ", { term: ver }, " has no accent: ", { term: di }, ", ", { term: dio }, ", ", { term: vi }, ", ", { term: vio }, "."]
              es: ["El indefinido de ", { term: dar }, " y ", { term: ver }, " no lleva tilde: ", { term: di }, ", ", { term: dio }, ", ", { term: vi }, ", ", { term: vio }, "."]
            ex: ["Mi padre me ", { target: dio }, " un libro."]
            tr: { en: My father gave me a book. }

  - title: { en: "Yo in -go and a new preterite stem", es: "Yo en -go y una raíz nueva en el indefinido" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
          - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
        rows:
          - { level: A2, verb: tener, present: { target: tengo }, preterite: { target: tuve }, participle: tenido }
          - { level: A2, verb: hacer, present: { target: hago }, preterite: { target: hice }, participle: { target: hecho } }
          - { level: B1, verb: poner, present: { target: pongo }, preterite: { target: puse }, participle: { target: puesto } }
          - { level: B1, verb: decir, present: { target: digo }, preterite: { target: dije }, participle: { target: dicho } }
          - { level: B1, verb: venir, present: { target: vengo }, preterite: { target: vine }, participle: venido }
          - { level: B1, verb: traer, present: { target: traigo }, preterite: { target: traje }, participle: traído }
          - { level: A2, verb: salir, present: { target: salgo }, preterite: salí, participle: salido }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A stem in ", { letter: j }, " takes ", { ending: eron }, " in ellos: ", { term: dijeron }, ", ", { term: trajeron }, "."]
              es: ["Una raíz en ", { letter: j }, " lleva ", { ending: eron }, " en ellos: ", { term: dijeron }, ", ", { term: trajeron }, "."]
            ex: ["Mis amigos ", { target: trajeron }, " comida."]
            tr: { en: My friends brought food. }
          - type: rule
            level: A2
            text:
              en: [{ term: salir }, " has a regular preterite: ", { term: salí }, ", ", { term: salió }, "."]
              es: [{ term: salir }, " tiene el indefinido regular: ", { term: salí }, ", ", { term: salió }, "."]
            ex: ["El tren ", { target: salió }, " a las seis."]
            tr: { en: The train left at six. }

  - title: { en: Stem change in the present, es: Cambio de raíz en el presente }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
          - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
        rows:
          - { level: A2, verb: pensar, present: { target: pienso }, preterite: pensé, participle: pensado }
          - { level: B1, verb: jugar, present: { target: juego }, preterite: { target: jugué }, participle: jugado }
          - { level: B1, verb: querer, present: { target: quiero }, preterite: { target: quise }, participle: querido }
          - { level: B1, verb: poder, present: { target: puedo }, preterite: { target: pude }, participle: podido }
          - { level: A2, verb: volver, present: { target: vuelvo }, preterite: volví, participle: { target: vuelto } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["When the stress falls on the stem, ", { mapping: [{ letter: e }, { letter: ie }] }, " and ", { mapping: [{ letter: o }, { letter: ue }] }, "; nosotros keeps the stem:"]
              es: ["Cuando el acento cae en la raíz, ", { mapping: [{ letter: e }, { letter: ie }] }, " y ", { mapping: [{ letter: o }, { letter: ue }] }, "; nosotros mantiene la raíz:"]
            ex: { examples: [["¿", { target: Puedes }, " venir?"], ["Sí, ", { target: podemos }, "."]] }
            tr: { en: { examples: [Can you come?, "Yes, we can."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: poder }, " and ", { term: querer }, " also take a new preterite stem: ", { term: pude }, ", ", { term: quise }, "."]
              es: [{ term: poder }, " y ", { term: querer }, " también tienen una raíz nueva en el indefinido: ", { term: pude }, ", ", { term: quise }, "."]
            ex: ["No ", { target: pude }, " dormir."]
            tr: { en: "I couldn't sleep." }
          - type: rule
            level: B1
            text:
              en: [{ term: jugar }, " keeps the sound of its ", { letter: g }, " in the preterite yo with ", { letter: gu }, ": ", { term: jugué }, ", like every verb in ", { term: -gar }, "."]
              es: [{ term: jugar }, " mantiene el sonido de la ", { letter: g }, " en el indefinido de yo con ", { letter: gu }, ": ", { term: jugué }, ", como todos los verbos en ", { term: -gar }, "."]
            ex: ["Ayer ", { target: jugué }, " al fútbol."]
            tr: { en: I played football yesterday. }

  - title: { en: "-ir verbs: a stem change in two tenses", es: "Verbos en -ir: cambio de raíz en dos tiempos" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
          - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
        rows:
          - { level: B1, verb: pedir, present: { target: pido }, preterite: { alternatives: [pedí, { target: pidió }] }, participle: pedido }
          - { level: B1, verb: dormir, present: { target: duermo }, preterite: { alternatives: [dormí, { target: durmió }] }, participle: dormido }
          - { level: B1, verb: sentir, present: { target: siento }, preterite: { alternatives: [sentí, { target: sintió }] }, participle: sentido }
          - { level: B1, verb: preferir, present: { target: prefiero }, preterite: { alternatives: [preferí, { target: prefirió }] }, participle: preferido }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["In the preterite, these verbs change the stem only in él and ellos: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
              es: ["En el indefinido, estos verbos cambian la raíz solo en él y ellos: ", { mapping: [{ letter: e }, { letter: i }] }, ", ", { mapping: [{ letter: o }, { letter: u }] }, "."]
            ex: { examples: [["Ella ", { target: pidió }, " la cuenta."], ["Los niños ", { target: durmieron }, " bien."]] }
            tr: { en: { examples: [She asked for the bill., The children slept well.] } }

  - title: { en: "-zco in the present, -uje in the preterite", es: "-zco en el presente, -uje en el indefinido" }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: verb, label: { en: Infinitive, es: Infinitivo }, features: { verbform: inf } }
          - { key: present, label: { en: "Present, yo", es: "Presente, yo" }, features: { tense: prs, person: 1, number: sg } }
          - { key: preterite, label: { en: Preterite, es: Indefinido }, features: { tense: pst, aspect: pfv } }
          - { key: participle, label: { en: Participle, es: Participio }, features: { verbform: ptcp } }
        rows:
          - { level: A2, verb: conocer, present: { target: conozco }, preterite: conocí, participle: conocido }
          - { level: B1, verb: conducir, present: { target: conduzco }, preterite: { target: conduje }, participle: conducido }
          - { level: B1, verb: traducir, present: { target: traduzco }, preterite: { target: traduje }, participle: traducido }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: -ducir }, " take ", { ending: zco }, " in the present yo and ", { ending: uje }, " in the preterite, with ", { ending: eron }, " in ellos:"]
              es: ["Los verbos en ", { term: -ducir }, " llevan ", { ending: zco }, " en el presente de yo y ", { ending: uje }, " en el indefinido, con ", { ending: eron }, " en ellos:"]
            ex: ["Ellos ", { target: condujeron }, " toda la noche."]
            tr: { en: They drove all night. }
          - type: note
            level: B1
            variety: es-419
            text:
              en: ["For driving, Latin America says ", { term: manejar }, ", a regular verb:"]
              es: ["Para conducir, en Latinoamérica se dice ", { term: manejar }, ", un verbo regular:"]
            ex: ["Ayer ", { target: manejé }, " cinco horas."]
            tr: { en: I drove for five hours yesterday. }

  - title: { en: More irregular participles, es: Más participios irregulares }
    role: own
    content:
      - type: usage
        columns:
          - { key: participle, label: { en: Verb and participle, es: Verbo y participio } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, participle: { mapping: [{ term: escribir }, { term: escrito }] }, ex: ["¿", { target: Has escrito }, " a tu madre?"], tr: { en: Have you written to your mother? } }
          - { level: A2, participle: { mapping: [{ term: abrir }, { term: abierto }] }, ex: ["La tienda está ", { target: abierta }, "."], tr: { en: The shop is open. } }
          - { level: A2, participle: { mapping: [{ term: romper }, { term: roto }] }, ex: ["Se ha ", { target: roto }, " la tele."], tr: { en: The TV has broken. } }
          - { level: A2, participle: { mapping: [{ term: morir }, { term: muerto }] }, ex: ["El pez ", { target: ha muerto }, "."], tr: { en: The fish has died. } }
          - { level: B1, participle: { mapping: [{ term: descubrir }, { term: descubierto }] }, ex: ["¿Quién ", { target: ha descubierto }, " el error?"], tr: { en: Who has found the mistake? } }
          - { level: B1, participle: { mapping: [{ term: resolver }, { term: resuelto }] }, ex: ["Ya ", { target: hemos resuelto }, " el problema."], tr: { en: "We've already solved the problem." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A verb built on an irregular one keeps its participle: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
              es: ["Un verbo formado sobre uno irregular mantiene su participio: ", { mapping: [{ term: devolver }, { term: devuelto }] }, ", ", { mapping: [{ term: describir }, { term: descrito }] }, "."]
            ex: ["Ya ", { target: he devuelto }, " el libro."]
            tr: { en: "I've already returned the book." }
          - type: rule
            level: A2
            text:
              en: "A participle used as an adjective agrees with its noun:"
              es: "Un participio usado como adjetivo concuerda con su sustantivo:"
            ex: ["Las ventanas están ", { target: abiertas }, "."]
            tr: { en: The windows are open. }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Yo teno dos hermanos., right: ["Yo ", { target: tengo }, " dos hermanos."], rule: { en: { mapping: [{ term: tener }, { term: tengo }] }, es: { mapping: [{ term: tener }, { term: tengo }] } } }
          - { level: A2, wrong: Ayer hací la cena., right: ["Ayer ", { target: hice }, " la cena."], rule: { en: ["a new stem: ", { mapping: [{ term: hacer }, { term: hice }] }], es: ["una raíz nueva: ", { mapping: [{ term: hacer }, { term: hice }] }] } }
          - { level: A2, wrong: Yo sabo la respuesta., right: ["Yo ", { target: sé }, " la respuesta."], rule: { en: { mapping: [{ term: saber }, { term: sé }] }, es: { mapping: [{ term: saber }, { term: sé }] } } }
          - { level: B1, wrong: Ayer no podí ir., right: ["Ayer no ", { target: pude }, " ir."], rule: { en: ["a new stem: ", { mapping: [{ term: poder }, { term: pude }] }], es: ["una raíz nueva: ", { mapping: [{ term: poder }, { term: pude }] }] } }
          - { level: B1, wrong: Él dormió mucho., right: ["Él ", { target: durmió }, " mucho."], rule: { en: ["the stem changes in él: ", { mapping: [{ term: dormir }, { term: durmió }] }], es: ["la raíz cambia en él: ", { mapping: [{ term: dormir }, { term: durmió }] }] } }
          - { level: A2, wrong: He abrido la puerta., right: [{ target: He abierto }, " la puerta."], rule: { en: ["irregular participle: ", { mapping: [{ term: abrir }, { term: abierto }] }], es: ["participio irregular: ", { mapping: [{ term: abrir }, { term: abierto }] }] } }
          - { level: B1, wrong: Ayer conducí cinco horas., right: ["Ayer ", { target: conduje }, " cinco horas."], rule: { en: { mapping: [{ term: conducir }, { term: conduje }] }, es: { mapping: [{ term: conducir }, { term: conduje }] } } }
