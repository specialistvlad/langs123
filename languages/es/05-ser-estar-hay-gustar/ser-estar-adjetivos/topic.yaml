title: { en: Ser or Estar with Adjectives, es: Ser o estar con adjetivos, uk: "Ser чи estar із прикметниками", pt: "Ser ou estar com adjetivos", fr: "Ser ou estar avec des adjectifs", de: "Ser oder estar mit Adjektiven", it: "Ser o estar con gli aggettivi", pl: "Ser czy estar z przymiotnikami", tr: "Sıfatlarla ser ve estar", id: "Ser atau estar dengan kata sifat", vi: "Ser hoặc estar với tính từ" }
summary:
  lead:
    en: [{ term: Ser }, " with an adjective says what someone or something is like; ", { term: estar }, " says how they are now, or after a change."]
    es: [{ term: Ser }, " con adjetivo dice cómo es alguien o algo; ", { term: estar }, " dice cómo está ahora, o tras un cambio."]
    uk: [{ term: Ser }, " із прикметником вказує, яким є хтось чи щось; ", { term: estar }, " — яким він є зараз або після зміни."]
    pt: [{ term: "Ser" }, " com adjetivo diz como alguém ou algo é; ", { term: "estar" }, " diz como está agora, ou depois de uma mudança."]
    fr: [{ term: "Ser" }, " avec un adjectif dit comment est quelqu’un ou quelque chose ; ", { term: "estar" }, " dit comment il est maintenant, ou après un changement."]
    de: [{ term: "Ser" }, " mit einem Adjektiv sagt, wie jemand oder etwas ist; ", { term: "estar" }, " sagt, wie es jetzt ist oder nach einer Veränderung."]
    it: [{ term: "Ser" }, " con un aggettivo dice com'è qualcuno o qualcosa; ", { term: "estar" }, " dice com'è adesso, o dopo un cambiamento."]
    pl: [{ term: "Ser" }, " z przymiotnikiem mówi, jaki ktoś lub coś jest; ", { term: "estar" }, " mówi, jaki jest teraz lub po zmianie."]
    tr: [{ term: "Ser" }, " sıfatla birlikte birinin ya da bir şeyin nasıl olduğunu söyler; ", { term: "estar" }, " şimdi nasıl olduğunu ya da bir değişimden sonraki durumunu söyler."]
    id: [{ term: "Ser" }, " dengan kata sifat menyatakan seperti apa seseorang atau sesuatu; ", { term: "estar" }, " menyatakan keadaannya sekarang, atau setelah berubah."]
    vi: [{ term: "Ser" }, " với tính từ cho biết ai đó hay vật gì như thế nào; ", { term: "estar" }, " cho biết trạng thái hiện tại, hoặc sau một thay đổi."]
  rule:
    en: "The same person takes both verbs, with different adjectives:"
    es: "La misma persona lleva los dos verbos, con adjetivos distintos:"
    uk: "Про ту саму людину кажуть з обома дієсловами — з різними прикметниками:"
    pt: "A mesma pessoa leva os dois verbos, com adjetivos diferentes:"
    fr: "La même personne s’emploie avec les deux verbes, mais avec des adjectifs différents :"
    de: "Dieselbe Person steht mit beiden Verben, aber mit verschiedenen Adjektiven:"
    it: "La stessa persona prende entrambi i verbi, con aggettivi diversi:"
    pl: "O tej samej osobie mówimy z oboma czasownikami, z różnymi przymiotnikami:"
    tr: "Aynı kişi için iki fiil de kullanılır, ama sıfatlar farklıdır:"
    id: "Orang yang sama memakai kedua kata kerja, dengan kata sifat yang berbeda:"
    vi: "Cùng một người dùng cả hai động từ, với các tính từ khác nhau:"
  ex: { examples: [["Ana ", { target: es }, " alegre."], ["Ana ", { target: está }, " cansada."]] }

