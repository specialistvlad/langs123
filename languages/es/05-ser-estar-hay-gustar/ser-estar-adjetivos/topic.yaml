# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.ser-estar-hay-gustar.ser-estar-adjetivos
lang: es
kind: grammar
tags: [verbs, ser, estar, adjectives]
concepts: [ser-estar, adjectives]
related: [es.ser-estar-hay-gustar.ser-estar, es.adjetivo-adverbio.adjetivo-concordancia, es.adjetivo-adverbio.adverbios]
status: { en: draft, es: draft, uk: draft }
translated: { en: "53344f a5ca26 0018df 8deb30 48eb58 3a7f65 f38601", uk: "53344f a5ca26 0018df 8deb30 48eb58 3a7f65 f38601" }

title: { en: Ser or Estar with Adjectives, es: Ser o estar con adjetivos, uk: "Ser чи estar із прикметниками" }
summary:
  lead:
    en: [{ term: Ser }, " with an adjective says what someone or something is like; ", { term: estar }, " says how they are now, or after a change."]
    es: [{ term: Ser }, " con adjetivo dice cómo es alguien o algo; ", { term: estar }, " dice cómo está ahora, o tras un cambio."]
    uk: [{ term: Ser }, " із прикметником каже, яким є хтось чи щось; ", { term: estar }, " — яким він є зараз або після зміни."]
  rule:
    en: "The same person takes both verbs, with different adjectives:"
    es: "La misma persona lleva los dos verbos, con adjetivos distintos:"
    uk: "Про ту саму людину кажуть з обома дієсловами — з різними прикметниками:"
  ex: { examples: [["Ana ", { target: es }, " alegre."], ["Ana ", { target: está }, " cansada."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A1
          point: ser
          rule:
            en: "what someone or something is like"
            es: "cómo es alguien o algo"
            uk: "яким є хтось чи щось"
          ex: ["Mi jefe ", { target: es }, " simpático."]
          tr: { en: My boss is nice., uk: "Мій начальник — приємна людина." }
        - level: A2
          point: estar
          rule:
            en: "a state now, or the result of a change"
            es: "un estado ahora, o el resultado de un cambio"
            uk: "стан зараз або результат зміни"
          ex: ["La puerta ", { target: está }, " abierta."]
          tr: { en: The door is open., uk: "Двері відчинені." }
        - level: A2
          point: { en: Always estar, es: Siempre estar, uk: "Завжди estar" }
          rule:
            en: [{ alternatives: [{ term: contento }, { term: lleno }, { term: roto }] }, " and other states"]
            es: [{ alternatives: [{ term: contento }, { term: lleno }, { term: roto }] }, " y otros estados"]
            uk: [{ alternatives: [{ term: contento }, { term: lleno }, { term: roto }] }, " та інші стани"]
          ex: ["El vaso ", { target: está }, " roto."]
          tr: { en: The glass is broken., uk: "Склянка розбита." }
        - level: B1
          point: parecer
          rule:
            en: [{ pattern: [{ term: parecer }, { slot: adjective }] }, ": the adjective agrees with the subject"]
            es: [{ pattern: [{ term: parecer }, { slot: adjective }] }, ": el adjetivo concuerda con el sujeto"]
            uk: [{ pattern: [{ term: parecer }, { slot: adjective }] }, ": прикметник узгоджується з підметом"]
          ex: ["Los niños ", { target: parecen }, " cansados."]
          tr: { en: The children look tired., uk: "Діти здаються втомленими." }
        - level: A2
          point: { en: Opinion, es: Opinión, uk: "Оцінка" }
          rule:
            en: { pattern: [{ term: es }, { slot: adjective }, { slot: infinitive }] }
            es: { pattern: [{ term: es }, { slot: adjective }, { slot: infinitive }] }
            uk: { pattern: [{ term: es }, { slot: adjective }, { slot: infinitive }] }
          ex: [{ target: Es importante }, " dormir bien."]
          tr: { en: "It's important to sleep well.", uk: "Важливо добре висипатися." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: bien }, " and ", { term: mal }, " are adverbs: they take ", { term: estar }]
            es: [{ term: bien }, " y ", { term: mal }, " son adverbios: llevan ", { term: estar }]
            uk: [{ term: bien }, " і ", { term: mal }, " — прислівники: з ними ", { term: estar }]
          ex: ["Todo ", { target: está }, " bien."]
          tr: { en: Everything is fine., uk: "Усе гаразд." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: [{ term: muerto }, " takes ", { term: estar }, ": death is a state"]
            es: [{ term: muerto }, " lleva ", { term: estar }, ": la muerte es un estado"]
            uk: [{ term: muerto }, " вимагає ", { term: estar }, ": смерть — це стан"]
          ex: ["El pez ", { target: está }, " muerto."]
          tr: { en: The fish is dead., uk: "Рибка мертва." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ pattern: [{ term: ser }, { slot: adjective }] }, " says what someone or something is like:"]
              es: [{ pattern: [{ term: ser }, { slot: adjective }] }, " dice cómo es alguien o algo:"]
              uk: [{ pattern: [{ term: ser }, { slot: adjective }] }, " каже, яким є хтось чи щось:"]
            ex: ["La casa ", { target: es }, " grande."]
            tr: { en: The house is big., uk: "Будинок великий." }
          - type: rule
            level: A2
            text:
              en: [{ pattern: [{ term: estar }, { slot: adjective }] }, " says how someone or something is now, or after a change:"]
              es: [{ pattern: [{ term: estar }, { slot: adjective }] }, " dice cómo está alguien o algo ahora, o tras un cambio:"]
              uk: [{ pattern: [{ term: estar }, { slot: adjective }] }, " каже, яким є хтось чи щось зараз або після зміни:"]
            ex: ["La casa ", { target: está }, " sucia."]
            tr: { en: The house is dirty., uk: "У будинку брудно." }
          - type: note
            level: A2
            text:
              en: ["The basic uses of each verb: ", { link: "Ser and Estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Los usos básicos de cada verbo: ", { link: "Ser y estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              uk: ["Основні вживання кожного дієслова: ", { link: "Ser і estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]

  - title: { en: "Use: ser with an adjective", es: "Uso: ser con adjetivo", uk: "Вживання: ser із прикметником" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, use: { en: Character, es: Carácter, uk: "Характер" }, ex: ["Mi jefe ", { target: es }, " simpático."], tr: { en: My boss is nice., uk: "Мій начальник — приємна людина." } }
          - { level: A1, use: { en: Appearance, es: Aspecto físico, uk: "Зовнішність" }, ex: ["Lucía ", { target: es }, " morena."], tr: { en: Lucía has dark hair., uk: "У Лусії темне волосся." } }
          - { level: A1, use: { en: "Colour, shape, size", es: "Color, forma, tamaño", uk: "Колір, форма, розмір" }, ex: ["La bicicleta ", { target: es }, " roja."], tr: { en: The bike is red., uk: "Велосипед червоний." } }
          - { level: A2, use: { en: "An opinion about an action", es: "Una opinión sobre una acción", uk: "Оцінка дії" }, ex: [{ target: Es importante }, " dormir bien."], tr: { en: "It's important to sleep well.", uk: "Важливо добре висипатися." } }

  - title: { en: "Use: estar with an adjective", es: "Uso: estar con adjetivo", uk: "Вживання: estar із прикметником" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, use: { en: A state now, es: Un estado ahora, uk: "Стан зараз" }, ex: [{ target: Estoy }, " cansada."], tr: { en: "I'm tired.", uk: "Я втомилася." } }
          - { level: A2, use: { en: The result of a change, es: El resultado de un cambio, uk: "Результат зміни" }, ex: ["La puerta ", { target: está }, " abierta."], tr: { en: The door is open., uk: "Двері відчинені." } }
          - { level: A2, use: { en: ["States that always take ", { term: estar }, ": ", { alternatives: [{ term: contento }, { term: enfermo }, { term: lleno }, { term: roto }] }], es: ["Estados que siempre llevan ", { term: estar }, ": ", { alternatives: [{ term: contento }, { term: enfermo }, { term: lleno }, { term: roto }] }], uk: ["Стани, які завжди вимагають ", { term: estar }, ": ", { alternatives: [{ term: contento }, { term: enfermo }, { term: lleno }, { term: roto }] }] }, ex: ["El vaso ", { target: está }, " roto."], tr: { en: The glass is broken., uk: "Склянка розбита." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: bien }, " and ", { term: mal }, " are adverbs, so they take ", { term: estar }, ":"]
              es: [{ term: bien }, " y ", { term: mal }, " son adverbios, así que llevan ", { term: estar }, ":"]
              uk: [{ term: bien }, " і ", { term: mal }, " — прислівники, тому з ними ", { term: estar }, ":"]
            ex: { exchange: ["¿Qué tal el hotel?", [{ target: Está }, " muy bien."]] }
            tr: { en: { exchange: [How's the hotel?, "It's very good."] }, uk: { exchange: ["Як готель?", "Дуже добрий."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: muerto }, " takes ", { term: estar }, ": death is a state."]
              es: [{ term: muerto }, " lleva ", { term: estar }, ": la muerte es un estado."]
              uk: [{ term: muerto }, " вимагає ", { term: estar }, ": смерть — це стан."]
            ex: ["El pez ", { target: está }, " muerto."]
            tr: { en: The fish is dead., uk: "Рибка мертва." }

  - title: { en: Parecer with an adjective, es: Parecer con adjetivo, uk: "Parecer із прикметником" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: parecer }, " joins a subject to an adjective like ", { term: ser }, " and ", { term: estar }, ", and the adjective agrees with the subject:"]
              es: [{ term: parecer }, " une el sujeto a un adjetivo como ", { term: ser }, " y ", { term: estar }, ", y el adjetivo concuerda con el sujeto:"]
              uk: [{ term: parecer }, " поєднує підмет із прикметником, як ", { term: ser }, " і ", { term: estar }, ", і прикметник узгоджується з підметом:"]
            ex: ["Los niños ", { target: parecen }, " cansados."]
            tr: { en: The children look tired., uk: "Діти здаються втомленими." }
          - type: rule
            level: B1
            text:
              en: [{ pattern: [{ term: parece }, { term: que }] }, " takes a whole sentence and stays in the third person singular:"]
              es: [{ pattern: [{ term: parece }, { term: que }] }, " lleva una frase entera y se queda en tercera persona del singular:"]
              uk: [{ pattern: [{ term: parece }, { term: que }] }, " вводить ціле речення і лишається в третій особі однини:"]
            ex: [{ target: Parece que }, " los niños están cansados."]
            tr: { en: It looks as if the children are tired., uk: "Схоже, що діти втомилися." }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Es bien., right: [{ target: Está }, " bien."], rule: { en: [{ term: bien }, " takes ", { term: estar }], es: [{ term: bien }, " lleva ", { term: estar }], uk: ["з ", { term: bien }, " уживають ", { term: estar }] } }
          - { level: A2, speakers: [uk], wrong: Importante dormir bien., right: [{ target: Es importante }, " dormir bien."], rule: { uk: ["оцінка дії потребує дієслова ", { term: es }, ", хоча українською кажемо «Важливо добре спати»"] } }
          - { level: A2, wrong: El pez es muerto., right: ["El pez ", { target: está }, " muerto."], rule: { en: [{ term: muerto }, " takes ", { term: estar }], es: [{ term: muerto }, " lleva ", { term: estar }], uk: [{ term: muerto }, " вимагає ", { term: estar }] } }
          - { level: A2, wrong: La puerta es abierta., right: ["La puerta ", { target: está }, " abierta."], rule: { en: ["the result of a change takes ", { term: estar }], es: ["el resultado de un cambio lleva ", { term: estar }], uk: ["результат зміни — це ", { term: estar }] } }
          - { level: B1, wrong: Los niños parecen cansado., right: ["Los niños parecen ", { target: cansados }, "."], rule: { en: ["after ", { term: parecer }, ", the adjective agrees with the subject"], es: ["tras ", { term: parecer }, ", el adjetivo concuerda con el sujeto"], uk: ["після ", { term: parecer }, " прикметник узгоджується з підметом"] } }
