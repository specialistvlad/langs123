# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.ser-estar-hay-gustar.ser-estar-adjetivos
lang: es
kind: grammar
tags: [verbs, ser, estar, adjectives, meaning]
concepts: [ser-estar, adjectives]
related: [es.ser-estar-hay-gustar.ser-estar, es.adjetivo-adverbio.adjetivo-concordancia, es.adjetivo-adverbio.adverbios]
status: { en: draft, es: draft }
translated: { es: "fb0a93 6116a4 2ac0e0 7810df a36758 1e5957 90aa97" }

title: { en: Ser or Estar with Adjectives, es: Ser o estar con adjetivos }
summary:
  lead:
    en: [{ term: Ser }, " with an adjective says what someone or something is like; ", { term: estar }, " says how they are now, or after a change."]
    es: [{ term: Ser }, " con adjetivo dice cómo es alguien o algo; ", { term: estar }, " dice cómo está ahora, o tras un cambio."]
  rule:
    en: "The same person takes both verbs, with different adjectives:"
    es: "La misma persona lleva los dos verbos, con adjetivos distintos:"
  ex: { examples: [["Ana ", { target: es }, " alegre."], ["Ana ", { target: está }, " cansada."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: ser
          rule:
            en: "what someone or something is like"
            es: "cómo es alguien o algo"
          ex: ["Mi jefe ", { target: es }, " simpático."]
          tr: { en: My boss is nice. }
        - level: A2
          point: estar
          rule:
            en: "a state now, or the result of a change"
            es: "un estado ahora, o el resultado de un cambio"
          ex: ["La puerta ", { target: está }, " abierta."]
          tr: { en: The door is open. }
        - level: A2
          point: { en: Always estar, es: Siempre estar }
          rule:
            en: [{ alternatives: [{ term: contento }, { term: lleno }, { term: roto }] }, " and other states"]
            es: [{ alternatives: [{ term: contento }, { term: lleno }, { term: roto }] }, " y otros estados"]
          ex: ["El vaso ", { target: está }, " roto."]
          tr: { en: The glass is broken. }
        - level: B1
          point: parecer
          rule:
            en: [{ pattern: [{ term: parecer }, { slot: adjective }] }, ": the adjective agrees with the subject"]
            es: [{ pattern: [{ term: parecer }, { slot: adjective }] }, ": el adjetivo concuerda con el sujeto"]
          ex: ["Los niños ", { target: parecen }, " cansados."]
          tr: { en: The children look tired. }
        - level: A2
          point: { en: Opinion, es: Opinión }
          rule:
            en: { pattern: [{ term: es }, { slot: adjective }, { slot: infinitive }] }
            es: { pattern: [{ term: es }, { slot: adjective }, { slot: infinitive }] }
          ex: [{ target: Es importante }, " dormir bien."]
          tr: { en: "It's important to sleep well." }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: bien }, " and ", { term: mal }, " are adverbs: they take ", { term: estar }]
            es: [{ term: bien }, " y ", { term: mal }, " son adverbios: llevan ", { term: estar }]
          ex: ["Todo ", { target: está }, " bien."]
          tr: { en: Everything is fine. }
        - level: A2
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: muerto }, " takes ", { term: estar }, ": death is a state"]
            es: [{ term: muerto }, " lleva ", { term: estar }, ": la muerte es un estado"]
          ex: ["El pez ", { target: está }, " muerto."]
          tr: { en: The fish is dead. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ pattern: [{ term: ser }, { slot: adjective }] }, " says what someone or something is like:"]
              es: [{ pattern: [{ term: ser }, { slot: adjective }] }, " dice cómo es alguien o algo:"]
            ex: ["La casa ", { target: es }, " grande."]
            tr: { en: The house is big. }
          - type: rule
            level: A2
            text:
              en: [{ pattern: [{ term: estar }, { slot: adjective }] }, " says how someone or something is now, or after a change:"]
              es: [{ pattern: [{ term: estar }, { slot: adjective }] }, " dice cómo está alguien o algo ahora, o tras un cambio:"]
            ex: ["La casa ", { target: está }, " sucia."]
            tr: { en: The house is dirty. }
          - type: note
            level: A2
            text:
              en: ["The basic uses of each verb: ", { link: "Ser and Estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Los usos básicos de cada verbo: ", { link: "Ser y estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]

  - title: { en: "Use: ser with an adjective", es: "Uso: ser con adjetivo" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: Character, es: Carácter }, ex: ["Mi jefe ", { target: es }, " simpático."], tr: { en: My boss is nice. } }
          - { level: A1, use: { en: Appearance, es: Aspecto físico }, ex: ["Lucía ", { target: es }, " morena."], tr: { en: Lucía has dark hair. } }
          - { level: A1, use: { en: "Colour, shape, size", es: "Color, forma, tamaño" }, ex: ["La bicicleta ", { target: es }, " roja."], tr: { en: The bike is red. } }
          - { level: A2, use: { en: "An opinion about an action", es: "Una opinión sobre una acción" }, ex: [{ target: Es importante }, " dormir bien."], tr: { en: "It's important to sleep well." } }

  - title: { en: "Use: estar with an adjective", es: "Uso: estar con adjetivo" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: A state now, es: Un estado ahora }, ex: [{ target: Estoy }, " cansada."], tr: { en: "I'm tired." } }
          - { level: A2, use: { en: The result of a change, es: El resultado de un cambio }, ex: ["La puerta ", { target: está }, " abierta."], tr: { en: The door is open. } }
          - { level: A2, use: { en: ["States that always take ", { term: estar }, ": ", { alternatives: [{ term: contento }, { term: enfermo }, { term: lleno }, { term: roto }] }], es: ["Estados que siempre llevan ", { term: estar }, ": ", { alternatives: [{ term: contento }, { term: enfermo }, { term: lleno }, { term: roto }] }] }, ex: ["El vaso ", { target: está }, " roto."], tr: { en: The glass is broken. } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: bien }, " and ", { term: mal }, " are adverbs, so they take ", { term: estar }, ":"]
              es: [{ term: bien }, " y ", { term: mal }, " son adverbios, así que llevan ", { term: estar }, ":"]
            ex: { exchange: ["¿Qué tal el hotel?", [{ target: Está }, " muy bien."]] }
            tr: { en: { exchange: [How's the hotel?, "It's very good."] } }
          - type: rule
            level: A2
            text:
              en: [{ term: muerto }, " takes ", { term: estar }, ": death is a state."]
              es: [{ term: muerto }, " lleva ", { term: estar }, ": la muerte es un estado."]
            ex: ["El pez ", { target: está }, " muerto."]
            tr: { en: The fish is dead. }

  - title: { en: Parecer with an adjective, es: Parecer con adjetivo }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: parecer }, " joins a subject to an adjective like ", { term: ser }, " and ", { term: estar }, ", and the adjective agrees with the subject:"]
              es: [{ term: parecer }, " une el sujeto a un adjetivo como ", { term: ser }, " y ", { term: estar }, ", y el adjetivo concuerda con el sujeto:"]
            ex: ["Los niños ", { target: parecen }, " cansados."]
            tr: { en: The children look tired. }
          - type: rule
            level: B1
            text:
              en: [{ pattern: [{ term: parece }, { term: que }] }, " takes a whole sentence and stays in the third person singular:"]
              es: [{ pattern: [{ term: parece }, { term: que }] }, " lleva una frase entera y se queda en tercera persona del singular:"]
            ex: [{ target: Parece que }, " los niños están cansados."]
            tr: { en: It looks as if the children are tired. }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Es bien., right: [{ target: Está }, " bien."], rule: { en: [{ term: bien }, " takes ", { term: estar }], es: [{ term: bien }, " lleva ", { term: estar }] } }
          - { level: A2, wrong: El pez es muerto., right: ["El pez ", { target: está }, " muerto."], rule: { en: [{ term: muerto }, " takes ", { term: estar }], es: [{ term: muerto }, " lleva ", { term: estar }] } }
          - { level: A2, wrong: La puerta es abierta., right: ["La puerta ", { target: está }, " abierta."], rule: { en: ["the result of a change takes ", { term: estar }], es: ["el resultado de un cambio lleva ", { term: estar }] } }
          - { level: B1, wrong: Los niños parecen cansado., right: ["Los niños parecen ", { target: cansados }, "."], rule: { en: ["after ", { term: parecer }, ", the adjective agrees with the subject"], es: ["tras ", { term: parecer }, ", el adjetivo concuerda con el sujeto"] } }
