title: { es: "Verbos de cambio: ponerse, quedarse, hacerse, volverse", en: "Verbs of Change: ponerse, quedarse, hacerse, volverse", uk: "Дієслова зміни стану: ponerse, quedarse, hacerse, volverse", pt: "Verbos de mudança: ponerse, quedarse, hacerse, volverse", fr: "Verbes de changement : ponerse, quedarse, hacerse, volverse", de: "Verben der Veränderung: ponerse, quedarse, hacerse, volverse", it: "Verbi di cambiamento: ponerse, quedarse, hacerse, volverse", pl: "Czasowniki zmiany: ponerse, quedarse, hacerse, volverse", tr: "Değişim fiilleri: ponerse, quedarse, hacerse, volverse", id: "Kata kerja perubahan: ponerse, quedarse, hacerse, volverse", vi: "Động từ chỉ sự thay đổi: ponerse, quedarse, hacerse, volverse" }
summary:
