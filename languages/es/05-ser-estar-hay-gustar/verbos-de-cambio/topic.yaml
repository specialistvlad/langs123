            tr: { en: { examples: ["Everything became clear.", "The table ended up clean."] }, uk: { examples: ["Усе стало зрозуміло.", "Стіл став чистим."] }, pt: { examples: ["Tudo ficou claro.", "A mesa ficou limpa."] }, fr: { examples: ["Tout est devenu clair.", "La table est propre maintenant."] }, de: { examples: ["Alles wurde klar.", "Der Tisch ist jetzt sauber."] }, it: { examples: ["È tutto chiaro.", "Il tavolo è rimasto pulito."] }, pl: { examples: ["Wszystko stało się jasne.", "Stół został czysty."] }, tr: { examples: ["Her şey netleşti.", "Masa tertemiz oldu."] }, id: { examples: ["Semuanya menjadi jelas.", "Mejanya jadi bersih."] }, vi: { examples: ["Mọi thứ đã rõ ràng.", "Cái bàn đã sạch."] } }
          - level: C1
            verb: { term: verse }
            meaning: { es: "encontrarse en una situación, a menudo sin quererlo", en: "to find oneself in a situation, often unwillingly", uk: "опинитися в певній ситуації, нерідко проти волі", pt: "encontrar-se em uma situação, muitas vezes sem querer", fr: "se retrouver dans une situation, souvent malgré soi", de: "sich in einer Lage wiederfinden, oft ungewollt", it: "trovarsi in una situazione, spesso senza volerlo", pl: "znaleźć się w jakiejś sytuacji, często wbrew woli", tr: "kendini bir durumda bulmak, çoğu zaman istemeden", id: "mendapati diri dalam suatu situasi, sering kali tanpa disengaja", vi: "thấy mình ở trong một tình huống, thường là ngoài ý muốn" }
            ex: ["Se ", { target: vio }, " obligado a salir."]
            tr: { en: "He found himself forced to leave.", uk: "Він був змушений піти.", pt: "Ele se viu obrigado a sair.", fr: "Il s’est vu obligé de partir.", de: "Er sah sich gezwungen zu gehen.", it: "Si è visto costretto a uscire.", pl: "Został zmuszony do wyjścia.", tr: "Çıkmak zorunda kaldı.", id: "Dia terpaksa pergi.", vi: "Anh ấy buộc phải rời đi." }
          - level: C1
            verb: { alternatives: [{ pattern: [{ term: acabar }, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundio", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }, { pattern: [{ term: terminar }, { slot: { es: gerundio, en: "gerund", uk: "герундій", pt: "gerúndio", fr: "gérondif", de: "Gerundio", it: "gerundio", pl: "gerundio", tr: "gerundio", id: "gerundio", vi: "gerundio" } }] }] }
            meaning: { es: "llegar a un estado final tras un proceso", en: "to reach a final state after a process", uk: "дійти кінцевого стану після певного процесу", pt: "chegar a um estado final depois de um processo", fr: "arriver à un état final au terme d’un processus", de: "nach einem Prozess einen Endzustand erreichen", it: "arrivare a uno stato finale dopo un processo", pl: "dojść do stanu końcowego po jakimś procesie", tr: "bir sürecin ardından son duruma ulaşmak", id: "mencapai keadaan akhir setelah suatu proses", vi: "đạt đến trạng thái cuối cùng sau một quá trình" }
            ex: { examples: [["Acabó ", { target: siendo }, " profesora."], ["Terminó ", { target: viviendo }, " en Quito."]] }
            tr: { en: { examples: ["She ended up being a teacher.", "He ended up living in Quito."] }, uk: { examples: ["Зрештою вона стала вчителькою.", "Зрештою він оселився в Кіто."] }, pt: { examples: ["Ela acabou sendo professora.", "Ele acabou morando em Quito."] }, fr: { examples: ["Elle a fini par devenir professeure.", "Il a fini par habiter à Quito."] }, de: { examples: ["Sie wurde am Ende Lehrerin.", "Er wohnte am Ende in Quito."] }, it: { examples: ["Alla fine è diventata insegnante.", "Alla fine è andato a vivere a Quito."] }, pl: { examples: ["W końcu została nauczycielką.", "W końcu zamieszkał w Quito."] }, tr: { examples: ["Sonunda öğretmen oldu.", "Sonunda Quito’da yaşamaya başladı."] }, id: { examples: ["Akhirnya dia menjadi guru.", "Akhirnya dia tinggal di Quito."] }, vi: { examples: ["Cuối cùng cô ấy trở thành giáo viên.", "Cuối cùng anh ấy sống ở Quito."] } }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: "Estos verbos unen el sujeto con un atributo, como lo hacen ser y estar."
              en: "These verbs link the subject to a complement, as ser and estar do."
              uk: "Ці дієслова поєднують підмет з іменною частиною присудка, як ser і estar."
              pt: "Esses verbos unem o sujeito a um predicativo, como fazem ser e estar."
              fr: "Ces verbes relient le sujet à un attribut, comme ser et estar."
              de: "Diese Verben verbinden das Subjekt mit einem Prädikativ, wie ser und estar."
              it: "Questi verbi uniscono il soggetto a un predicativo, come fanno ser ed estar."
              pl: "Te czasowniki łączą podmiot z orzecznikiem, tak jak ser i estar."
              tr: "Bu fiiller, ser ve estar gibi, özneyi bir sıfat ya da isimle birleştirir."
              id: "Kata kerja ini menghubungkan subjek dengan pelengkap, seperti ser dan estar."
              vi: "Các động từ này nối chủ ngữ với bổ ngữ, giống như ser và estar."

  - title: { es: Expresiones fijas de cambio, en: "Fixed expressions of change", uk: "Сталі вирази зміни", pt: "Expressões fixas de mudança", fr: "Expressions figées de changement", de: "Feste Wendungen der Veränderung", it: "Espressioni fisse di cambiamento", pl: "Stałe wyrażenia zmiany", tr: "Değişimi anlatan kalıplaşmış ifadeler", id: "Ungkapan tetap untuk perubahan", vi: "Cách nói cố định về sự thay đổi" }
    role: own
    content:
      - type: usage
        columns:
          - { key: expression, label: { es: Expresión, en: "Expression", uk: "Вираз", pt: "Expressão", fr: "Expression", de: "Ausdruck", it: "Espressione", pl: "Wyrażenie", tr: "İfade", id: "Ungkapan", vi: "Cách diễn đạt" } }
          - { key: meaning, label: { es: Significado, en: "Meaning", uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { es: Ejemplos, en: "Examples", uk: "Приклади", pt: "Exemplos", fr: "Exemples", de: "Beispiele", it: "Esempi", pl: "Przykłady", tr: "Örnekler", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            expression: { pattern: [{ term: ponerse de un }, { slot: adjective }] }
            meaning: { es: "un grado extremo del cambio, con una oración que lo mide", en: "an extreme degree of change, with a clause that measures it", uk: "крайній ступінь зміни, з реченням, що її вимірює", pt: "um grau extremo da mudança, com uma oração que o mede", fr: "un degré extrême du changement, avec une proposition qui le mesure", de: "ein extremer Grad der Veränderung, mit einem Satz, der ihn misst", it: "un grado estremo del cambiamento, con una frase che lo misura", pl: "skrajny stopień zmiany, wraz ze zdaniem, które go określa", tr: "değişimin uç derecesi; onu ölçen bir cümleyle birlikte", id: "tingkat perubahan yang ekstrem, dengan klausa yang mengukurnya", vi: "mức độ cực đoan của sự thay đổi, kèm một mệnh đề đo mức độ đó" }
            ex: ["Se ", { target: puso de un }, " pesado que tuve que irme."]
            tr: { en: "He got so annoying that I had to leave.", uk: "Він став таким набридливим, що мені довелося піти.", pt: "Ele ficou tão chato que tive que ir embora.", fr: "Il est devenu tellement pénible que j’ai dû partir.", de: "Er wurde so lästig, dass ich gehen musste.", it: "È diventato così pesante che me ne sono dovuto andare.", pl: "Zrobił się tak nieznośny, że musiałem wyjść.", tr: "O kadar sıkıcı oldu ki gitmek zorunda kaldım.", id: "Dia menjadi begitu menyebalkan sampai saya harus pergi.", vi: "Anh ta trở nên khó chịu đến mức tôi phải bỏ đi." }
          - level: C2
            expression: { term: hacerse tarde }
            meaning: { es: "pasar el tiempo hasta que ya es tarde", en: "time passes until it is late", uk: "час спливає, і вже пізно", pt: "o tempo passa até que já é tarde", fr: "le temps passe jusqu’à ce qu’il soit tard", de: "die Zeit vergeht, bis es spät ist", it: "il tempo passa finché non è tardi", pl: "czas mija, aż robi się późno", tr: "zaman geçer ve sonunda geç olur", id: "waktu berlalu sampai hari sudah larut", vi: "thời gian trôi cho đến khi đã muộn" }
            ex: { examples: [["Se ", { target: hizo }, " tarde y perdimos el último tren."], ["Se me ", { target: ha hecho }, " tarde."]] }
            tr: { en: { examples: ["It got late and we missed the last train.", "It's got late."] }, uk: { examples: ["Стало пізно, і ми пропустили останній потяг.", "Стало пізно."] }, pt: { examples: ["Ficou tarde e perdemos o último trem.", "Ficou tarde para mim."] }, fr: { examples: ["Il s’est fait tard et nous avons raté le dernier train.", "Il s’est fait tard."] }, de: { examples: ["Es wurde spät, und wir verpassten den letzten Zug.", "Es ist spät geworden."] }, it: { examples: ["Si è fatto tardi e abbiamo perso l’ultimo treno.", "Mi si è fatto tardi."] }, pl: { examples: ["Zrobiło się późno i spóźniliśmy się na ostatni pociąg.", "Zrobiło się późno."] }, tr: { examples: ["Vakit geç oldu ve son treni kaçırdık.", "Vakit geç oldu."] }, id: { examples: ["Hari sudah larut dan kami ketinggalan kereta terakhir.", "Hari sudah larut."] }, vi: { examples: ["Trời muộn rồi và chúng tôi lỡ chuyến tàu cuối.", "Trời đã muộn rồi."] } }
          - level: C2
            expression: { term: quedarse tieso }
            meaning: { es: "quedarse rígido por el frío o por el miedo", en: "to go stiff from cold or fear", uk: "заклякнути від холоду чи страху", pt: "ficar rígido de frio ou de medo", fr: "rester raide de froid ou de peur", de: "vor Kälte oder Angst starr werden", it: "restare rigido per il freddo o per la paura", pl: "zesztywnieć z zimna lub ze strachu", tr: "soğuktan ya da korkudan donup kalmak", id: "menjadi kaku karena dingin atau takut", vi: "cứng đờ vì lạnh hoặc vì sợ" }
            ex: ["Esperando el autobús, ", { target: me quedé tieso }, " de frío."]
            tr: { en: "Waiting for the bus, I froze stiff.", uk: "Чекаючи на автобус, я заклякнув від холоду.", pt: "Esperando o ônibus, fiquei duro de frio.", fr: "En attendant le bus, je suis resté raide de froid.", de: "Beim Warten auf den Bus wurde ich steif vor Kälte.", it: "Aspettando l’autobus, sono rimasto rigido dal freddo.", pl: "Czekając na autobus, zesztywniałem z zimna.", tr: "Otobüsü beklerken soğuktan donup kaldım.", id: "Sambil menunggu bus, tubuh saya menjadi kaku karena dingin.", vi: "Đứng chờ xe buýt, tôi lạnh cứng người." }
          - level: C2
            expression: { term: quedarse frío }
            meaning: { es: "quedarse sin reacción ante una sorpresa", en: "to be left with no reaction to a surprise", uk: "не знайти реакції на несподіванку", pt: "ficar sem reação diante de uma surpresa", fr: "rester sans réaction devant une surprise", de: "bei einer Überraschung nicht reagieren können", it: "restare senza reazione davanti a una sorpresa", pl: "nie umieć zareagować na niespodziankę", tr: "bir sürpriz karşısında tepkisiz kalmak", id: "tidak bereaksi saat terkejut", vi: "không có phản ứng gì trước một bất ngờ" }
            ex: ["Al oír la noticia, ", { target: me quedé frío }, "."]
            tr: { en: "When I heard the news, I was stunned.", uk: "Почувши новину, я оторопів.", pt: "Ao ouvir a notícia, fiquei gelado.", fr: "En entendant la nouvelle, je suis resté glacé.", de: "Als ich die Nachricht hörte, war ich wie erstarrt.", it: "Sentendo la notizia, sono rimasto di ghiaccio.", pl: "Gdy usłyszałem wiadomość, zamarłem.", tr: "Haberi duyunca donakaldım.", id: "Mendengar kabar itu, saya terpaku.", vi: "Nghe tin đó, tôi chết lặng." }
          - level: C2
            expression: { term: ponerse como una sopa }
            meaning: { es: "mojarse por completo", en: "to get completely wet", uk: "промокнути до нитки", pt: "ficar completamente molhado", fr: "être complètement trempé", de: "völlig nass werden", it: "bagnarsi del tutto", pl: "przemoknąć doszczętnie", tr: "bütünüyle ıslanmak", id: "basah kuyup", vi: "ướt sũng" }
            ex: ["Sin paraguas, ", { target: nos pusimos como una sopa }, "."]
            tr: { en: "Without an umbrella, we got soaked.", uk: "Без парасольки ми промокли до нитки.", pt: "Sem guarda-chuva, ficamos encharcados.", fr: "Sans parapluie, nous avons été trempés jusqu’aux os.", de: "Ohne Regenschirm wurden wir klatschnass.", it: "Senza ombrello ci siamo bagnati fino alle ossa.", pl: "Bez parasola przemokliśmy do suchej nitki.", tr: "Şemsiyesiz kaldığımız için sırılsıklam olduk.", id: "Tanpa payung, kami basah kuyup.", vi: "Không có ô, chúng tôi ướt như chuột lột." }

