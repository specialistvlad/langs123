            meaning: { es: "ser el resultado de una acción", en: "to be the result of an action", uk: "бути результатом дії", pt: "ser o resultado de uma ação", fr: "être le résultat d’une action", de: "das Ergebnis einer Handlung sein", it: "essere il risultato di un’azione", pl: "być wynikiem czynności", tr: "bir eylemin sonucu olmak", id: "menjadi hasil dari suatu tindakan", vi: "là kết quả của một hành động" }
