id: es.ser-estar-hay-gustar.hay-esta
lang: es
kind: grammar
tags: [verbs, hay, estar, existence, location]
concepts: [existence]
related: [es.ser-estar-hay-gustar.ser-estar, es.sustantivo-determinantes.articulos, es.preposiciones.preposiciones-basicas]
status: { en: draft, es: draft }
translated: { es: "7f7df1 2d01a9 55f9b6 9f0461 dc1a1f 3bed54" }

title: { en: Hay and Está, es: Hay y está }
summary:
  lead:
    en: [{ term: Hay }, " says that something exists in a place; ", { term: está }, " and ", { term: están }, " say where a known thing is."]
    es: [{ term: Hay }, " dice que algo existe en un lugar; ", { term: está }, " y ", { term: están }, " dicen dónde está algo conocido."]
  rule:
    en: [{ term: Hay }, " goes with ", { alternatives: [{ term: un }, { term: una }] }, " or a number, and ", { term: está }, " with ", { alternatives: [{ term: el }, { term: la }] }, " or a proper name:"]
    es: [{ term: Hay }, " va con ", { alternatives: [{ term: un }, { term: una }] }, " o un número, y ", { term: está }, " con ", { alternatives: [{ term: el }, { term: la }] }, " o un nombre propio:"]
  ex: { examples: [[{ target: Hay }, " un banco en la plaza."], ["El banco ", { target: está }, " en la plaza."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A1
          point: hay
          rule:
            en: [{ alternatives: [{ term: un }, { term: una }, { term: unos }] }, ", a number, ", { alternatives: [{ term: mucho }, { term: poco }] }]
            es: [{ alternatives: [{ term: un }, { term: una }, { term: unos }] }, ", un número, ", { alternatives: [{ term: mucho }, { term: poco }] }]
          ex: [{ target: Hay }, " una farmacia cerca."]
          tr: { en: "There's a chemist's nearby." }
        - level: A1
          point: hay
          rule:
            en: "a plural or uncountable noun alone"
            es: "un sustantivo plural o incontable solo"
          ex: [{ target: Hay }, " pan en la mesa."]
          tr: { en: "There's bread on the table." }
        - level: A1
          point: está
          rule:
            en: [{ alternatives: [{ term: el }, { term: la }, { term: mi }, { term: este }] }, ", a proper name"]
            es: [{ alternatives: [{ term: el }, { term: la }, { term: mi }, { term: este }] }, ", un nombre propio"]
          ex: ["Mi casa ", { target: está }, " cerca."]
          tr: { en: My house is nearby. }
        - level: A1
          point: { en: Number, es: Número }
          rule:
            en: [{ term: está }, " for one thing, ", { term: están }, " for several"]
            es: [{ term: está }, " para una cosa, ", { term: están }, " para varias"]
          ex: ["Los niños ", { target: están }, " en el parque."]
          tr: { en: The children are in the park. }
        - level: A1
          point: { en: Question, es: Pregunta }
          rule:
            en: [{ term: hay }, " to find something, ", { term: dónde está }, " for its place"]
            es: [{ term: hay }, " para buscar algo, ", { term: dónde está }, " para saber su lugar"]
          ex: { examples: [["¿", { target: Hay }, " un baño por aquí?"], ["¿Dónde ", { target: está }, " el baño?"]] }
          tr: { en: { examples: [Is there a toilet around here?, Where is the toilet?] } }
        - level: A1
          point: { en: Negative, es: Negación }
          rule:
            en: [{ term: no hay }, ", usually without ", { alternatives: [{ term: un }, { term: una }] }]
            es: [{ term: no hay }, ", normalmente sin ", { alternatives: [{ term: un }, { term: una }] }]
          ex: ["No ", { target: hay }, " leche."]
          tr: { en: "There's no milk." }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: hay }, " has one form for the singular and the plural"]
            es: [{ term: hay }, " tiene una sola forma para singular y plural"]
          ex: [{ target: Hay }, " muchos turistas."]
          tr: { en: There are lots of tourists. }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["a known thing takes ", { term: está }]
            es: ["una cosa conocida lleva ", { term: está }]
          ex: ["El supermercado ", { target: está }, " en esta calle."]
          tr: { en: The supermarket is on this street. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: hay }, " says that something exists in a place, often for the first time in the conversation."]
              es: [{ term: hay }, " dice que algo existe en un lugar, muchas veces por primera vez en la conversación."]
            ex: [{ target: Hay }, " un mercado los sábados."]
            tr: { en: "There's a market on Saturdays." }
          - type: rule
            level: A1
            text:
              en: [{ term: estar }, " says where a specific, known thing or person is."]
              es: [{ term: estar }, " dice dónde está una cosa o una persona concreta y conocida."]
            ex: ["Tus llaves ", { target: están }, " en la mesa."]
            tr: { en: Your keys are on the table. }
          - type: note
            level: A1
            text:
              en: ["The other uses of ", { term: estar }, ": ", { link: "Ser and Estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]
              es: ["Los demás usos de ", { term: estar }, ": ", { link: "Ser y estar", to: es.ser-estar-hay-gustar.ser-estar }, "."]

  - title: { en: "Form: hay", es: "Forma: hay" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, features: { polarity: pos, interrogativity: decl }, form: { en: Statement, es: Afirmación }, ex: [{ target: Hay }, " un banco en la esquina."], tr: { en: "There's a bank on the corner." } }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question, es: Pregunta }, ex: ["¿", { target: Hay }, " un baño por aquí?"], tr: { en: Is there a toilet around here? } }
          - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative, es: Negación }, ex: ["No ", { target: hay }, " farmacia en este barrio."], tr: { en: "There's no chemist's in this area." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: hay }, " has one form for the singular and the plural:"]
              es: [{ term: hay }, " tiene una sola forma para singular y plural:"]
            ex: { examples: [[{ target: Hay }, " un gato."], [{ target: Hay }, " dos gatos."]] }
            tr: { en: { examples: ["There's a cat.", There are two cats.] } }
          - type: rule
            level: A1
            text:
              en: ["A negative with ", { term: hay }, " usually leaves out ", { term: un }, " and ", { term: una }, "."]
              es: ["La negación con ", { term: hay }, " suele omitir ", { term: un }, " y ", { term: una }, "."]

  - title: { en: "Use: hay or está", es: "Uso: hay o está" }
    role: use
    content:
      - type: comparison
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: hay, label: hay }
          - { key: esta, label: { alternatives: [está, están] } }
        rows:
          - { level: A1, point: { en: Job, es: Función }, hay: { en: says that something exists, es: dice que algo existe }, esta: { en: says where a known thing is, es: dice dónde está algo conocido } }
          - level: A1
            point: { en: Before the noun, es: Delante del sustantivo }
            hay:
              en: [{ alternatives: [{ term: un }, { term: una }, { term: unos }, { term: unas }] }, ", a number, ", { alternatives: [{ term: mucho }, { term: poco }] }, ", or nothing"]
              es: [{ alternatives: [{ term: un }, { term: una }, { term: unos }, { term: unas }] }, ", un número, ", { alternatives: [{ term: mucho }, { term: poco }] }, ", o nada"]
            esta:
              en: [{ alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }, ", ", { alternatives: [{ term: mi }, { term: tu }, { term: este }] }, ", or a proper name"]
              es: [{ alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }, ", ", { alternatives: [{ term: mi }, { term: tu }, { term: este }] }, ", o un nombre propio"]
          - { level: A1, point: { en: One, es: Uno }, hay: { ex: [{ target: Hay }, " un parque cerca."], tr: { en: "There's a park nearby." } }, esta: { ex: ["El parque ", { target: está }, " cerca."], tr: { en: The park is nearby. } } }
          - { level: A1, point: { en: Several, es: Varios }, hay: { ex: [{ target: Hay }, " dos parques cerca."], tr: { en: There are two parks nearby. } }, esta: { ex: ["Los parques ", { target: están }, " cerca."], tr: { en: The parks are nearby. } } }
          - { level: A1, point: { en: Question, es: Pregunta }, hay: { ex: ["¿", { target: Hay }, " un cajero por aquí?"], tr: { en: Is there a cash machine around here? } }, esta: { ex: ["¿Dónde ", { target: está }, " el cajero?"], tr: { en: Where is the cash machine? } } }
          - { level: A1, point: { en: A name, es: Un nombre }, hay: { ex: [{ target: Hay }, " una ciudad en la costa."], tr: { en: "There's a city on the coast." } }, esta: { ex: ["Lima ", { target: está }, " en la costa."], tr: { en: Lima is on the coast. } } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A plural or uncountable noun after ", { term: hay }, " often stands alone, with no article:"]
              es: ["Un sustantivo plural o incontable después de ", { term: hay }, " suele ir solo, sin artículo:"]
            ex: { examples: [[{ target: Hay }, " pan en la mesa."], [{ target: Hay }, " turistas en la playa."]] }
            tr: { en: { examples: ["There's bread on the table.", There are tourists on the beach.] } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Hay el banco en la plaza., right: ["El banco ", { target: está }, " en la plaza."], rule: { en: ["a known thing takes ", { term: está }], es: ["una cosa conocida lleva ", { term: está }] } }
          - { level: A1, wrong: "¿Dónde hay el baño?", right: ["¿Dónde ", { target: está }, " el baño?"], rule: { en: [{ term: dónde }, " with a known thing takes ", { term: está }], es: [{ term: dónde }, " con una cosa conocida lleva ", { term: está }] } }
          - { level: A1, wrong: Están dos bancos en la plaza., right: [{ target: Hay }, " dos bancos en la plaza."], rule: { en: ["a number takes ", { term: hay }], es: ["un número lleva ", { term: hay }] } }
          - { level: A1, wrong: Es una farmacia cerca., right: [{ target: Hay }, " una farmacia cerca."], rule: { en: ["something that exists in a place takes ", { term: hay }], es: ["algo que existe en un lugar lleva ", { term: hay }] } }
          - { level: A1, speakers: [en], wrong: Hay no leche., right: ["No ", { target: hay }, " leche."], rule: { en: [{ term: "no" }, " goes before ", { term: hay }, ": “there is no milk” is ", { term: no hay leche }] } }
