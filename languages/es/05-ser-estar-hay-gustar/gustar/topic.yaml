sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["With ", { term: gustar }, ", the thing liked is the subject, and the person is an indirect object pronoun:"]
              es: ["Con ", { term: gustar }, ", lo que gusta es el sujeto, y la persona es un pronombre de objeto indirecto:"]
              uk: ["З ", { term: gustar }, " те, що подобається, — підмет, а людина — займенник непрямого додатка:"]
              pt: ["Com ", { term: "gustar" }, ", o que agrada é o sujeito, e a pessoa é um pronome de objeto indireto:"]
              fr: ["Avec ", { term: "gustar" }, ", ce qui plaît est le sujet, et la personne est un pronom complément d’objet indirect :"]
              de: ["Bei ", { term: "gustar" }, " ist das Gemochte das Subjekt, und die Person ist ein Pronomen des indirekten Objekts:"]
              it: ["Con ", { term: "gustar" }, ", ciò che piace è il soggetto e la persona è un pronome complemento indiretto:"]
              pl: ["Przy ", { term: "gustar" }, " to, co się podoba, jest podmiotem, a osoba — zaimkiem dopełnienia dalszego:"]
              tr: [{ term: "gustar" }, " fiilinde sevilen şey özne, kişi ise dolaylı nesne zamiridir:"]
              id: ["Dengan ", { term: "gustar" }, ", hal yang disukai adalah subjek, dan orangnya adalah kata ganti objek tak langsung:"]
              vi: ["Với ", { term: "gustar" }, ", thứ được thích là chủ ngữ, còn người thích là đại từ tân ngữ gián tiếp:"]
            ex: { exchange: [["¿", { target: Te gusta }, " el café?"], ["Sí, ", { target: me gusta }, "."]] }
            tr: { en: { exchange: [Do you like coffee?, "Yes, I do."] }, uk: { exchange: ["Тобі подобається кава?", "Так, подобається."] }, pt: { exchange: ["Você gosta de café?", "Sim, gosto."] }, fr: { exchange: ["Tu aimes le café ?", "Oui, j’aime ça."] }, de: { exchange: ["Magst du Kaffee?", "Ja, ich mag ihn."] }, it: { exchange: ["Ti piace il caffè?", "Sì, mi piace."] }, pl: { exchange: ["Lubisz kawę?", "Tak, lubię."] }, tr: { exchange: ["Kahve sever misin?", "Evet, severim."] }, id: { exchange: ["Kamu suka kopi?", "Ya, suka."] }, vi: { exchange: ["Bạn có thích cà phê không?", "Có, tôi thích."] } }
          - type: note
            level: A1
            text:
              en: ["Word for word, ", { term: me gusta el café }, " reads “coffee pleases me”."]
              es: ["Literalmente, ", { term: me gusta el café }, " equivale a “el café me agrada”."]
              uk: ["Дослівно ", { term: me gusta el café }, " — це «мені подобається кава»: будова та сама, що й в українській."]
              pt: ["Literalmente, ", { term: "me gusta el café" }, " equivale a “o café me agrada”."]
              fr: ["Littéralement, ", { term: "me gusta el café" }, " équivaut à « le café me plaît »."]
              de: ["Wörtlich entspricht ", { term: "me gusta el café" }, " dem Satz „der Kaffee gefällt mir“."]
              it: ["Alla lettera, ", { term: "me gusta el café" }, " equivale a “il caffè mi piace”."]
              pl: ["Dosłownie ", { term: "me gusta el café" }, " znaczy „kawa mi się podoba”."]
              tr: ["Kelimesi kelimesine ", { term: "me gusta el café" }, " “kahve bana hoş gelir” demektir."]
              id: ["Secara harfiah, ", { term: "me gusta el café" }, " berarti “kopi menyenangkan bagiku”."]
              vi: ["Theo nghĩa đen, ", { term: "me gusta el café" }, " là “cà phê làm tôi hài lòng”."]
          - type: note
            level: A1
            text:
              en: ["The pronouns themselves: ", { link: "Indirect Object Pronouns", to: es.pronombres.objeto-indirecto }, "."]
              es: ["Los pronombres: ", { link: "El objeto indirecto", to: es.pronombres.objeto-indirecto }, "."]
              uk: ["Самі займенники: ", { link: "Займенники непрямого додатка", to: es.pronombres.objeto-indirecto }, "."]
              pt: ["Os pronomes: ", { link: "Pronomes de objeto indireto", to: es.pronombres.objeto-indirecto }, "."]
              fr: ["Les pronoms : ", { link: "Pronoms COI", to: es.pronombres.objeto-indirecto }, "."]
              de: ["Die Pronomen: ", { link: "Indirekte Objektpronomen", to: es.pronombres.objeto-indirecto }, "."]
              it: ["I pronomi: ", { link: "Pronomi complemento indiretto", to: es.pronombres.objeto-indirecto }, "."]
              pl: ["Zaimki: ", { link: "Zaimki dopełnienia dalszego", to: es.pronombres.objeto-indirecto }, "."]
              tr: ["Zamirlerin kendisi: ", { link: "Dolaylı nesne zamirleri", to: es.pronombres.objeto-indirecto }, "."]
              id: ["Kata gantinya: ", { link: "Kata ganti objek tak langsung", to: es.pronombres.objeto-indirecto }, "."]
              vi: ["Các đại từ: ", { link: "Đại từ tân ngữ gián tiếp", to: es.pronombres.objeto-indirecto }, "."]

