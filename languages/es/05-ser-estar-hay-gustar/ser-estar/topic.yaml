title: { en: Ser and Estar, es: Ser y estar, uk: "Ser і estar" }
summary:
  lead:
    en: [{ term: Ser }, " and ", { term: estar }, " both mean “be”: ", { term: ser }, " for what someone or something is, ", { term: estar }, " for place and state."]
    es: [{ term: Ser }, " dice qué es alguien o algo, y ", { term: estar }, " dice dónde está y cómo está."]
    uk: [{ term: Ser }, " і ", { term: estar }, " обидва означають «бути»: ", { term: ser }, " — ким чи чим є хтось або щось, ", { term: estar }, " — де він і в якому стані."]
  rule:
    en: ["The place of a person or a thing takes ", { term: estar }, ", and what something is takes ", { term: ser }, ":"]
    es: ["El lugar de una persona o una cosa lleva ", { term: estar }, ", y lo que algo es lleva ", { term: ser }, ":"]
    uk: ["Місце людини чи речі — це ", { term: estar }, ", а те, чим щось є, — ", { term: ser }, ":"]
  ex: { examples: [["Ana ", { target: es }, " de Madrid."], ["Ana ", { target: está }, " en Madrid."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: { en: First phrases, es: Primeras frases, uk: "Перші фрази" }
          rule:
            en: [{ term: ser }, " in the first phrases: ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }]
            es: [{ term: ser }, " en las primeras frases: ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }]
            uk: [{ term: ser }, " у перших фразах: ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }]
          ex: { examples: [[{ target: Soy }, " Ana."], ["¿", { target: Eres }, " Pablo?"], [{ target: Son }, " las dos."]] }
          tr: { en: { examples: ["I'm Ana.", Are you Pablo?, "It's two o'clock."] }, uk: { examples: ["Я Ана.", "Ти Пабло?", "Друга година."] } }
        - level: A0
          variety: es-ES
          point: { en: First phrases, es: Primeras frases, uk: "Перші фрази" }
          rule:
            en: [{ term: vosotros }, ": ", { term: sois }]
            es: [{ term: vosotros }, ": ", { term: sois }]
            uk: [{ term: vosotros }, ": ", { term: sois }]
          ex: ["¿Vosotros ", { target: sois }, " hermanos?"]
          tr: { en: Are you brothers?, uk: "Ви брати?" }
        - level: A1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: somos }, { term: son }] }]
            es: [{ term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: somos }, { term: son }] }]
            uk: [{ term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: somos }, { term: son }] }]
          ex: [{ target: Soy }, " de México."]
          tr: { en: "I'm from Mexico.", uk: "Я з Мексики." }
        - level: A1
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: estar }, ": ", { alternatives: [{ term: estoy }, { term: estás }, { term: está }, { term: estamos }, { term: están }] }]
            es: [{ term: estar }, ": ", { alternatives: [{ term: estoy }, { term: estás }, { term: está }, { term: estamos }, { term: están }] }]
            uk: [{ term: estar }, ": ", { alternatives: [{ term: estoy }, { term: estás }, { term: está }, { term: estamos }, { term: están }] }]
          ex: [{ target: Estoy }, " en casa."]
          tr: { en: "I'm at home.", uk: "Я вдома." }
        - level: A1
          variety: es-ES
          point: { en: Form, es: Forma, uk: "Форма" }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: sois }, { term: estáis }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: sois }, { term: estáis }] }]
            uk: [{ term: vosotros }, ": ", { alternatives: [{ term: sois }, { term: estáis }] }]
          ex: ["¿", { target: Sois }, " hermanos?"]
          tr: { en: Are you brothers?, uk: "Ви брати?" }
        - level: A1
          point: { en: Identity, es: Identidad, uk: "Особа" }
          rule:
            en: [{ term: ser }, ": name, job, nationality, origin"]
            es: [{ term: ser }, ": nombre, profesión, nacionalidad, origen"]
            uk: [{ term: ser }, ": ім’я, професія, національність, походження"]
          ex: ["Mi madre ", { target: es }, " médica."]
          tr: { en: My mother is a doctor., uk: "Моя мама — лікарка." }
        - level: A1
          point: { en: Description, es: Descripción, uk: "Опис" }
          rule:
            en: [{ term: ser }, ": what someone or something is like"]
            es: [{ term: ser }, ": cómo es alguien o algo"]
            uk: [{ term: ser }, ": яким є хтось чи щось"]
          ex: ["La casa ", { target: es }, " grande."]
          tr: { en: The house is big., uk: "Будинок великий." }
        - level: A1
          point: { en: Time and date, es: Hora y fecha, uk: "Час і дата" }
          rule:
            en: [{ term: ser }, ": the hour, the day, the date"]
            es: [{ term: ser }, ": la hora, el día, la fecha"]
            uk: [{ term: ser }, ": година, день, дата"]
          ex: [{ target: Son }, " las tres."]
          tr: { en: "It's three o'clock.", uk: "Третя година." }
        - level: A1
          point: { en: Place, es: Lugar, uk: "Місце" }
          rule:
            en: [{ term: estar }, ": where someone or something is"]
            es: [{ term: estar }, ": dónde está alguien o algo"]
            uk: [{ term: estar }, ": де хтось чи щось перебуває"]
          ex: ["El banco ", { target: está }, " en la plaza."]
          tr: { en: The bank is in the square., uk: "Банк на площі." }
        - level: A1
          point: { en: State, es: Estado, uk: "Стан" }
          rule:
            en: [{ term: estar }, ": how someone feels or how something is now"]
            es: [{ term: estar }, ": cómo se siente alguien o cómo está algo ahora"]
            uk: [{ term: estar }, ": як хтось почувається або в якому стані щось зараз"]
          ex: [{ target: Estoy }, " cansada."]
          tr: { en: "I'm tired.", uk: "Я втомилася." }
        - level: A2
          point: { en: Result, es: Resultado, uk: "Результат" }
          rule:
            en: [{ pattern: [{ term: estar }, { slot: past participle }] }, ": the result of a change"]
            es: [{ pattern: [{ term: estar }, { slot: past participle }] }, ": el resultado de un cambio"]
            uk: [{ pattern: [{ term: estar }, { slot: past participle }] }, ": результат зміни"]
          ex: ["La tienda ", { target: está cerrada }, "."]
          tr: { en: The shop is closed., uk: "Крамниця зачинена." }
        - level: A1
          point: { en: Material, es: Material, uk: "Матеріал" }
          rule:
            en: [{ pattern: [{ term: ser }, { term: de }] }, ": what it is made of"]
            es: [{ pattern: [{ term: ser }, { term: de }] }, ": de qué está hecho"]
            uk: [{ pattern: [{ term: ser }, { term: de }] }, ": з чого це зроблено"]
          ex: ["La mesa ", { target: es de }, " madera."]
          tr: { en: The table is made of wood., uk: "Стіл дерев’яний." }
        - level: A2
          point: { en: Owner, es: Dueño, uk: "Власник" }
          rule:
            en: [{ pattern: [{ term: ser }, { term: de }] }, ": whose it is"]
            es: [{ pattern: [{ term: ser }, { term: de }] }, ": de quién es"]
            uk: [{ pattern: [{ term: ser }, { term: de }] }, ": чиє це"]
          ex: ["El libro ", { target: es de }, " Luis."]
          tr: { en: "The book is Luis's.", uk: "Це книжка Луїса." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["a place that never moves still takes ", { term: estar }]
            es: ["un lugar que nunca cambia también lleva ", { term: estar }]
            uk: ["місце, яке ніколи не змінюється, теж вимагає ", { term: estar }]
          ex: ["Madrid ", { target: está }, " en España."]
          tr: { en: Madrid is in Spain., uk: "Мадрид розташований в Іспанії." }

sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The first phrases use four forms of ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              es: ["Las primeras frases usan cuatro formas de ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              uk: ["У перших фразах уживають чотири форми ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
            ex: { examples: [[{ target: Soy }, " Ana."], ["¿", { target: Eres }, " Pablo?"], [{ target: Son }, " las dos."]] }
            tr: { en: { examples: ["I'm Ana.", Are you Pablo?, "It's two o'clock."] }, uk: { examples: ["Я Ана.", "Ти Пабло?", "Друга година."] } }
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["With ", { term: vosotros }, ", ", { term: ser }, " is ", { term: sois }, "."]
              es: ["Con ", { term: vosotros }, ", ", { term: ser }, " es ", { term: sois }, "."]
              uk: ["З ", { term: vosotros }, " дієслово ", { term: ser }, " має форму ", { term: sois }, "."]
            ex: ["¿Vosotros ", { target: sois }, " hermanos?"]
            tr: { en: Are you brothers?, uk: "Ви брати?" }
          - type: rule
            level: A1
            text:
              en: [{ term: ser }, " names what someone or something is: who, what, where from, what like."]
              es: [{ term: ser }, " dice qué es alguien o algo: quién, qué, de dónde, cómo es."]
              uk: [{ term: ser }, " називає, ким чи чим є хтось або щось: хто, що, звідки, який."]
          - type: rule
            level: A1
            text:
              en: [{ term: estar }, " names where someone or something is, and how it is now."]
              es: [{ term: estar }, " dice dónde está alguien o algo, y cómo está ahora."]
              uk: [{ term: estar }, " називає, де хтось чи щось перебуває і в якому стані зараз."]
          - type: note
            level: A1
            text:
              en: ["For something that exists somewhere, see ", { link: Hay and Está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              es: ["Para decir que algo existe en un lugar, ver ", { link: Hay y está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              uk: ["Як сказати, що щось є десь, — див. ", { link: "Hay і está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
          - type: note
            level: A2
            text:
              en: ["With an adjective, ", { term: ser }, " says what something is like and ", { term: estar }, " how it is now: ", { link: Ser or Estar with Adjectives, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              es: ["Con un adjetivo, ", { term: ser }, " dice cómo es algo y ", { term: estar }, ", cómo está ahora: ", { link: Ser o estar con adjetivos, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              uk: ["З прикметником ", { term: ser }, " каже, яке щось є, а ", { term: estar }, " — яке воно зараз: ", { link: "Ser чи estar із прикметниками", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]

  - title: { en: "Form: the present", es: "Forma: el presente", uk: "Форма: теперішній час" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа" } }
          - { key: ser, label: ser }
          - { key: estar, label: estar }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, ser: { target: soy }, estar: { target: estoy } }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, ser: { target: eres }, estar: { target: estás } }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ser: { target: es }, estar: { target: está } }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ser: { target: somos }, estar: { target: estamos } }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ser: { target: sois }, estar: { target: estáis } }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ser: { target: son }, estar: { target: están } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The forms ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " carry a written accent on the last syllable."]
              es: ["Las formas ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " llevan tilde en la última sílaba."]
              uk: ["Форми ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " мають графічний наголос на останньому складі."]
          - type: rule
            level: A1
            text:
              en: "The subject pronoun usually drops: the verb form names the person."
              es: "El pronombre sujeto suele omitirse: la forma del verbo indica la persona."
              uk: "Займенник-підмет зазвичай опускають: форма дієслова називає особу."
            ex: [{ target: Somos }, " amigos."]
            tr: { en: "We're friends.", uk: "Ми друзі." }
          - type: note
            level: A1
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
              uk: [{ term: ustedes }, " — це множина і для ", { term: tú }, ", і для ", { term: usted }, ":"]
            ex: ["¿Ustedes ", { target: están }, " cansados?"]
            tr: { en: Are you tired?, uk: "Ви втомилися?" }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " is the informal plural, and ", { term: ustedes }, " the formal one:"]
              es: [{ term: vosotros }, " es el plural informal, y ", { term: ustedes }, ", el formal:"]
              uk: [{ term: vosotros }, " — неформальна множина, а ", { term: ustedes }, " — ввічлива:"]
            ex: ["¿", { target: Estáis }, " cansados?"]
            tr: { en: Are you tired?, uk: "Ви втомилися?" }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Argentina and Uruguay, ", { term: vos }, " takes the place of ", { term: tú }, ": ", { term: vos sos }, ", ", { term: vos estás }, "."]
              es: ["En Argentina y Uruguay, ", { term: vos }, " ocupa el lugar de ", { term: tú }, ": ", { term: vos sos }, ", ", { term: vos estás }, "."]
              uk: ["В Аргентині та Уругваї замість ", { term: tú }, " кажуть ", { term: vos }, ": ", { term: vos sos }, ", ", { term: vos estás }, "."]

  - title: { en: "Use: ser", es: "Uso: ser", uk: "Вживання: ser" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, use: { en: Name, es: Nombre, uk: "Ім’я" }, ex: [{ target: Soy }, " Ana."], tr: { en: "I'm Ana.", uk: "Я Ана." } }
          - { level: A1, use: { en: Job, es: Profesión, uk: "Професія" }, ex: ["Mi madre ", { target: es }, " médica."], tr: { en: My mother is a doctor., uk: "Моя мама — лікарка." } }
          - level: A1
            use: { en: Nationality and origin, es: Nacionalidad y origen, uk: "Національність і походження" }
            ex: { examples: [[{ target: Es }, " mexicana."], [{ target: Somos }, " de Colombia."]] }
            tr: { en: { examples: ["She's Mexican.", "We're from Colombia."] }, uk: { examples: ["Вона мексиканка.", "Ми з Колумбії."] } }
          - level: A1
            use: { en: What someone or something is like, es: Cómo es alguien o algo, uk: "Яким є хтось чи щось" }
            ex: { examples: [["La casa ", { target: es }, " grande."], ["Mis hermanos ", { target: son }, " altos."]] }
            tr: { en: { examples: [The house is big., My brothers are tall.] }, uk: { examples: ["Будинок великий.", "Мої брати високі."] } }
          - level: A1
            use: { en: "The hour, the day and the date", es: "La hora, el día y la fecha", uk: "Година, день і дата" }
            ex: { examples: [[{ target: Son }, " las tres."], ["Hoy ", { target: es }, " martes."]] }
            tr: { en: { examples: ["It's three o'clock.", "Today is Tuesday."] }, uk: { examples: ["Третя година.", "Сьогодні вівторок."] } }
          - { level: A1, use: { en: Material, es: Material, uk: "Матеріал" }, ex: ["La mesa ", { target: es de }, " madera."], tr: { en: The table is made of wood., uk: "Стіл дерев’яний." } }
          - { level: A2, use: { en: Owner, es: Dueño, uk: "Власник" }, ex: ["El libro ", { target: es de }, " Luis."], tr: { en: "The book is Luis's.", uk: "Це книжка Луїса." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The hour takes ", { term: es }, " for one o'clock and ", { term: son }, " from two on:"]
              es: ["La hora lleva ", { term: es }, " para la una y ", { term: son }, " a partir de las dos:"]
              uk: ["Про першу годину кажуть ", { term: es }, ", а починаючи з другої — ", { term: son }, ":"]
            ex: { examples: [[{ target: Es }, " la una."], [{ target: Son }, " las dos."]] }
            tr: { en: { examples: ["It's one o'clock.", "It's two o'clock."] }, uk: { examples: ["Перша година.", "Друга година."] } }

  - title: { en: "Use: estar", es: "Uso: estar", uk: "Вживання: estar" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - level: A1
            use: { en: Where someone or something is, es: Dónde está alguien o algo, uk: "Де хтось чи щось перебуває" }
            ex: { examples: [["El banco ", { target: está }, " en la plaza."], [{ target: Estamos }, " en casa."]] }
            tr: { en: { examples: [The bank is in the square., "We're at home."] }, uk: { examples: ["Банк на площі.", "Ми вдома."] } }
          - { level: A1, use: { en: A state now, es: Un estado ahora, uk: "Стан зараз" }, ex: [{ target: Estoy }, " cansada."], tr: { en: "I'm tired.", uk: "Я втомилася." } }
          - { level: A2, use: { en: Feelings, es: Sentimientos, uk: "Почуття" }, ex: ["Los niños ", { target: están }, " contentos."], tr: { en: The children are happy., uk: "Діти задоволені." } }
          - level: A1
            use: { en: How someone is, es: Cómo está alguien, uk: "Як хтось почувається" }
            ex: { exchange: [["¿Cómo ", { target: estás }, "?"], [{ target: Estoy }, " bien, gracias."]] }
            tr: { en: { exchange: [How are you?, "I'm fine, thanks."] }, uk: { exchange: ["Як справи?", "Добре, дякую."] } }
          - { level: A2, use: { en: The result of a change, es: El resultado de un cambio, uk: "Результат зміни" }, ex: ["La tienda ", { target: está cerrada }, "."], tr: { en: The shop is closed., uk: "Крамниця зачинена." } }
          - { level: A2, use: { en: An activity for a while, es: Una actividad por un tiempo, uk: "Заняття на якийсь час" }, ex: [{ target: Estamos de }, " vacaciones."], tr: { en: "We're on holiday.", uk: "Ми у відпустці." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The place of a person or a thing takes ", { term: estar }, ", even when it never changes:"]
              es: ["El lugar de una persona o una cosa lleva ", { term: estar }, ", también cuando nunca cambia:"]
              uk: ["Місце людини чи речі — це ", { term: estar }, ", навіть коли воно ніколи не змінюється:"]
            ex: ["Madrid ", { target: está }, " en España."]
            tr: { en: Madrid is in Spain., uk: "Мадрид розташований в Іспанії." }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
