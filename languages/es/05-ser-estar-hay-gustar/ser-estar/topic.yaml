title: { en: Ser and Estar, es: Ser y estar, uk: "Ser і estar", pt: "Ser e estar", fr: "Ser et estar", de: "Ser und estar", it: "Ser e estar", pl: "Ser i estar", tr: "Ser ve estar", id: "Ser dan estar", vi: "Ser và estar" }
summary:
  lead:
    en: [{ term: Ser }, " and ", { term: estar }, " both mean “be”: ", { term: ser }, " for what someone or something is, ", { term: estar }, " for place and state."]
    es: [{ term: Ser }, " dice qué es alguien o algo, y ", { term: estar }, " dice dónde está y cómo está."]
    uk: [{ term: Ser }, " і ", { term: estar }, " обидва означають «бути»: ", { term: ser }, " — ким чи чим є хтось або щось, ", { term: estar }, " — де він і в якому стані."]
    pt: [{ term: "Ser" }, " diz o que alguém ou algo é, e ", { term: "estar" }, " diz onde está e como está."]
    fr: [{ term: "Ser" }, " dit ce qu’est quelqu’un ou quelque chose, et ", { term: "estar" }, " dit où il se trouve et comment il est."]
    de: [{ term: "Ser" }, " sagt, was jemand oder etwas ist, und ", { term: "estar" }, " sagt, wo es sich befindet und in welchem Zustand es ist."]
    it: [{ term: "Ser" }, " dice che cosa è qualcuno o qualcosa, e ", { term: "estar" }, " dice dove si trova e come sta."]
    pl: [{ term: "Ser" }, " mówi, czym lub kim ktoś jest, a ", { term: "estar" }, " — gdzie się znajduje i w jakim jest stanie."]
    tr: [{ term: "Ser" }, " birinin ya da bir şeyin ne olduğunu, ", { term: "estar" }, " ise nerede olduğunu ve nasıl olduğunu söyler."]
    id: [{ term: "Ser" }, " menyatakan siapa atau apa seseorang atau sesuatu itu, dan ", { term: "estar" }, " menyatakan di mana dan bagaimana keadaannya."]
    vi: [{ term: "Ser" }, " cho biết ai đó hay vật gì là gì, còn ", { term: "estar" }, " cho biết ở đâu và trong trạng thái nào."]
  rule:
    en: ["The place of a person or a thing takes ", { term: estar }, ", and what something is takes ", { term: ser }, ":"]
    es: ["El lugar de una persona o una cosa lleva ", { term: estar }, ", y lo que algo es lleva ", { term: ser }, ":"]
    uk: ["Про місце людини чи речі кажуть з ", { term: estar }, ", а про те, чим щось є, — з ", { term: ser }, ":"]
    pt: ["O lugar de uma pessoa ou de uma coisa leva ", { term: "estar" }, ", e o que algo é leva ", { term: "ser" }, ":"]
    fr: ["Le lieu d’une personne ou d’une chose se dit avec ", { term: "estar" }, ", et ce qu’est quelque chose, avec ", { term: "ser" }, " :"]
    de: ["Der Ort einer Person oder Sache steht mit ", { term: "estar" }, ", und was etwas ist, mit ", { term: "ser" }, ":"]
    it: ["Il luogo di una persona o di una cosa vuole ", { term: "estar" }, ", e ciò che qualcosa è vuole ", { term: "ser" }, ":"]
    pl: ["Miejsce osoby lub rzeczy wyraża się przez ", { term: "estar" }, ", a to, czym coś jest — przez ", { term: "ser" }, ":"]
    tr: ["Bir kişinin ya da şeyin yeri ", { term: "estar" }, " ile, bir şeyin ne olduğu ", { term: "ser" }, " ile söylenir:"]
    id: ["Tempat seseorang atau sesuatu memakai ", { term: "estar" }, ", dan apa sesuatu itu memakai ", { term: "ser" }, ":"]
    vi: ["Vị trí của người hoặc vật đi với ", { term: "estar" }, ", còn bản chất của sự vật đi với ", { term: "ser" }, ":"]
  ex: { examples: [["Ana ", { target: es }, " de Madrid."], ["Ana ", { target: está }, " en Madrid."]] }

