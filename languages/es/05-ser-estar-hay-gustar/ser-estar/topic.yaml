id: es.ser-estar-hay-gustar.ser-estar
lang: es
kind: grammar
tags: [verbs, ser, estar, present]
concepts: [be, ser-estar]
related: [es.ser-estar-hay-gustar.ser-estar-adjetivos, es.ser-estar-hay-gustar.hay-esta, es.pronombres.tu-usted-vosotros-ustedes, es.presente.estar-gerundio]
status: { en: draft, es: draft }
translated: { es: "c36fdf e5d570 4fb867 5bc1e5 5dd0cb fa0273 302a04" }

title: { en: Ser and Estar, es: Ser y estar }
summary:
  lead:
    en: [{ term: Ser }, " and ", { term: estar }, " both mean “be”: ", { term: ser }, " for what someone or something is, ", { term: estar }, " for place and state."]
    es: [{ term: Ser }, " dice qué es alguien o algo, y ", { term: estar }, " dice dónde está y cómo está."]
  rule:
    en: ["The place of a person or a thing takes ", { term: estar }, ", and what something is takes ", { term: ser }, ":"]
    es: ["El lugar de una persona o una cosa lleva ", { term: estar }, ", y lo que algo es lleva ", { term: ser }, ":"]
  ex: { examples: [["Ana ", { target: es }, " de Madrid."], ["Ana ", { target: está }, " en Madrid."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { en: First phrases, es: Primeras frases }
          rule:
            en: [{ term: ser }, " in the first phrases: ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }]
            es: [{ term: ser }, " en las primeras frases: ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }]
          ex: { examples: [[{ target: Soy }, " Ana."], ["¿", { target: Eres }, " Pablo?"], [{ target: Son }, " las dos."]] }
          tr: { en: { examples: ["I'm Ana.", Are you Pablo?, "It's two o'clock."] } }
        - level: A0
          variety: es-ES
          point: { en: First phrases, es: Primeras frases }
          rule:
            en: [{ term: vosotros }, ": ", { term: sois }]
            es: [{ term: vosotros }, ": ", { term: sois }]
          ex: ["¿Vosotros ", { target: sois }, " hermanos?"]
          tr: { en: Are you brothers? }
        - level: A1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: somos }, { term: son }] }]
            es: [{ term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: somos }, { term: son }] }]
          ex: [{ target: Soy }, " de México."]
          tr: { en: "I'm from Mexico." }
        - level: A1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: estar }, ": ", { alternatives: [{ term: estoy }, { term: estás }, { term: está }, { term: estamos }, { term: están }] }]
            es: [{ term: estar }, ": ", { alternatives: [{ term: estoy }, { term: estás }, { term: está }, { term: estamos }, { term: están }] }]
          ex: [{ target: Estoy }, " en casa."]
          tr: { en: "I'm at home." }
        - level: A1
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: sois }, { term: estáis }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: sois }, { term: estáis }] }]
          ex: ["¿", { target: Sois }, " hermanos?"]
          tr: { en: Are you brothers? }
        - level: A1
          point: { en: Identity, es: Identidad }
          rule:
            en: [{ term: ser }, ": name, job, nationality, origin"]
            es: [{ term: ser }, ": nombre, profesión, nacionalidad, origen"]
          ex: ["Mi madre ", { target: es }, " médica."]
          tr: { en: My mother is a doctor. }
        - level: A1
          point: { en: Description, es: Descripción }
          rule:
            en: [{ term: ser }, ": what someone or something is like"]
            es: [{ term: ser }, ": cómo es alguien o algo"]
          ex: ["La casa ", { target: es }, " grande."]
          tr: { en: The house is big. }
        - level: A1
          point: { en: Time and date, es: Hora y fecha }
          rule:
            en: [{ term: ser }, ": the hour, the day, the date"]
            es: [{ term: ser }, ": la hora, el día, la fecha"]
          ex: [{ target: Son }, " las tres."]
          tr: { en: "It's three o'clock." }
        - level: A1
          point: { en: Place, es: Lugar }
          rule:
            en: [{ term: estar }, ": where someone or something is"]
            es: [{ term: estar }, ": dónde está alguien o algo"]
          ex: ["El banco ", { target: está }, " en la plaza."]
          tr: { en: The bank is in the square. }
        - level: A1
          point: { en: State, es: Estado }
          rule:
            en: [{ term: estar }, ": how someone feels or how something is now"]
            es: [{ term: estar }, ": cómo se siente alguien o cómo está algo ahora"]
          ex: [{ target: Estoy }, " cansada."]
          tr: { en: "I'm tired." }
        - level: A2
          point: { en: Result, es: Resultado }
          rule:
            en: [{ pattern: [{ term: estar }, { slot: past participle }] }, ": the result of a change"]
            es: [{ pattern: [{ term: estar }, { slot: past participle }] }, ": el resultado de un cambio"]
          ex: ["La tienda ", { target: está cerrada }, "."]
          tr: { en: The shop is closed. }
        - level: A1
          point: { en: Material, es: Material }
          rule:
            en: [{ pattern: [{ term: ser }, { term: de }] }, ": what it is made of"]
            es: [{ pattern: [{ term: ser }, { term: de }] }, ": de qué está hecho"]
          ex: ["La mesa ", { target: es de }, " madera."]
          tr: { en: The table is made of wood. }
        - level: A2
          point: { en: Owner, es: Dueño }
          rule:
            en: [{ pattern: [{ term: ser }, { term: de }] }, ": whose it is"]
            es: [{ pattern: [{ term: ser }, { term: de }] }, ": de quién es"]
          ex: ["El libro ", { target: es de }, " Luis."]
          tr: { en: "The book is Luis's." }
        - level: A1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["a place that never moves still takes ", { term: estar }]
            es: ["un lugar que nunca cambia también lleva ", { term: estar }]
          ex: ["Madrid ", { target: está }, " en España."]
          tr: { en: Madrid is in Spain. }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The first phrases use four forms of ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              es: ["Las primeras frases usan cuatro formas de ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
            ex: { examples: [[{ target: Soy }, " Ana."], ["¿", { target: Eres }, " Pablo?"], [{ target: Son }, " las dos."]] }
            tr: { en: { examples: ["I'm Ana.", Are you Pablo?, "It's two o'clock."] } }
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["With ", { term: vosotros }, ", ", { term: ser }, " is ", { term: sois }, "."]
              es: ["Con ", { term: vosotros }, ", ", { term: ser }, " es ", { term: sois }, "."]
            ex: ["¿Vosotros ", { target: sois }, " hermanos?"]
            tr: { en: Are you brothers? }
          - type: rule
            level: A1
            text:
              en: [{ term: ser }, " names what someone or something is: who, what, where from, what like."]
              es: [{ term: ser }, " dice qué es alguien o algo: quién, qué, de dónde, cómo es."]
          - type: rule
            level: A1
            text:
              en: [{ term: estar }, " names where someone or something is, and how it is now."]
              es: [{ term: estar }, " dice dónde está alguien o algo, y cómo está ahora."]
          - type: note
            level: A1
            text:
              en: ["For something that exists somewhere, see ", { link: Hay and Está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              es: ["Para decir que algo existe en un lugar, ver ", { link: Hay y está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
          - type: note
            level: A2
            text:
              en: ["With an adjective, ", { term: ser }, " says what something is like and ", { term: estar }, " how it is now: ", { link: Ser or Estar with Adjectives, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              es: ["Con un adjetivo, ", { term: ser }, " dice cómo es algo y ", { term: estar }, ", cómo está ahora: ", { link: Ser o estar con adjetivos, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]

  - title: { en: "Form: the present", es: "Forma: el presente" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: ser, label: ser }
          - { key: estar, label: estar }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, ser: { target: soy }, estar: { target: estoy } }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, ser: { target: eres }, estar: { target: estás } }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ser: { target: es }, estar: { target: está } }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ser: { target: somos }, estar: { target: estamos } }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ser: { target: sois }, estar: { target: estáis } }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ser: { target: son }, estar: { target: están } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The forms ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " carry a written accent on the last syllable."]
              es: ["Las formas ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " llevan tilde en la última sílaba."]
          - type: rule
            level: A1
            text:
              en: "The subject pronoun usually drops: the verb form names the person."
              es: "El pronombre sujeto suele omitirse: la forma del verbo indica la persona."
            ex: [{ target: Somos }, " amigos."]
            tr: { en: "We're friends." }
          - type: note
            level: A1
            variety: es-419
            text:
              en: [{ term: ustedes }, " is the plural of both ", { term: tú }, " and ", { term: usted }, ":"]
              es: [{ term: ustedes }, " es el plural de ", { term: tú }, " y de ", { term: usted }, ":"]
            ex: ["¿Ustedes ", { target: están }, " cansados?"]
            tr: { en: Are you tired? }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vosotros }, " is the informal plural, and ", { term: ustedes }, " the formal one:"]
              es: [{ term: vosotros }, " es el plural informal, y ", { term: ustedes }, ", el formal:"]
            ex: ["¿", { target: Estáis }, " cansados?"]
            tr: { en: Are you tired? }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Argentina and Uruguay, ", { term: vos }, " takes the place of ", { term: tú }, ": ", { term: vos sos }, ", ", { term: vos estás }, "."]
              es: ["En Argentina y Uruguay, ", { term: vos }, " ocupa el lugar de ", { term: tú }, ": ", { term: vos sos }, ", ", { term: vos estás }, "."]

  - title: { en: "Use: ser", es: "Uso: ser" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: Name, es: Nombre }, ex: [{ target: Soy }, " Ana."], tr: { en: "I'm Ana." } }
          - { level: A1, use: { en: Job, es: Profesión }, ex: ["Mi madre ", { target: es }, " médica."], tr: { en: My mother is a doctor. } }
          - level: A1
            use: { en: Nationality and origin, es: Nacionalidad y origen }
            ex: { examples: [[{ target: Es }, " mexicana."], [{ target: Somos }, " de Colombia."]] }
            tr: { en: { examples: ["She's Mexican.", "We're from Colombia."] } }
          - level: A1
            use: { en: What someone or something is like, es: Cómo es alguien o algo }
            ex: { examples: [["La casa ", { target: es }, " grande."], ["Mis hermanos ", { target: son }, " altos."]] }
            tr: { en: { examples: [The house is big., My brothers are tall.] } }
          - level: A1
            use: { en: "The hour, the day and the date", es: "La hora, el día y la fecha" }
            ex: { examples: [[{ target: Son }, " las tres."], ["Hoy ", { target: es }, " martes."]] }
            tr: { en: { examples: ["It's three o'clock.", "Today is Tuesday."] } }
          - { level: A1, use: { en: Material, es: Material }, ex: ["La mesa ", { target: es de }, " madera."], tr: { en: The table is made of wood. } }
          - { level: A2, use: { en: Owner, es: Dueño }, ex: ["El libro ", { target: es de }, " Luis."], tr: { en: "The book is Luis's." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The hour takes ", { term: es }, " for one o'clock and ", { term: son }, " from two on:"]
              es: ["La hora lleva ", { term: es }, " para la una y ", { term: son }, " a partir de las dos:"]
            ex: { examples: [[{ target: Es }, " la una."], [{ target: Son }, " las dos."]] }
            tr: { en: { examples: ["It's one o'clock.", "It's two o'clock."] } }

  - title: { en: "Use: estar", es: "Uso: estar" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - level: A1
            use: { en: Where someone or something is, es: Dónde está alguien o algo }
            ex: { examples: [["El banco ", { target: está }, " en la plaza."], [{ target: Estamos }, " en casa."]] }
            tr: { en: { examples: [The bank is in the square., "We're at home."] } }
          - { level: A1, use: { en: A state now, es: Un estado ahora }, ex: [{ target: Estoy }, " cansada."], tr: { en: "I'm tired." } }
          - { level: A2, use: { en: Feelings, es: Sentimientos }, ex: ["Los niños ", { target: están }, " contentos."], tr: { en: The children are happy. } }
          - level: A1
            use: { en: How someone is, es: Cómo está alguien }
            ex: { exchange: [["¿Cómo ", { target: estás }, "?"], [{ target: Estoy }, " bien, gracias."]] }
            tr: { en: { exchange: [How are you?, "I'm fine, thanks."] } }
          - { level: A2, use: { en: The result of a change, es: El resultado de un cambio }, ex: ["La tienda ", { target: está cerrada }, "."], tr: { en: The shop is closed. } }
          - { level: A2, use: { en: An activity for a while, es: Una actividad por un tiempo }, ex: [{ target: Estamos de }, " vacaciones."], tr: { en: "We're on holiday." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The place of a person or a thing takes ", { term: estar }, ", even when it never changes:"]
              es: ["El lugar de una persona o una cosa lleva ", { term: estar }, ", también cuando nunca cambia:"]
            ex: ["Madrid ", { target: está }, " en España."]
            tr: { en: Madrid is in Spain. }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Soy en casa., right: [{ target: Estoy }, " en casa."], rule: { en: ["place takes ", { term: estar }], es: ["el lugar lleva ", { term: estar }] } }
          - { level: A1, wrong: Madrid es en España., right: ["Madrid ", { target: está }, " en España."], rule: { en: ["a city's place takes ", { term: estar }, " too"], es: ["el lugar de una ciudad también lleva ", { term: estar }] } }
          - { level: A1, wrong: Estoy profesora., right: [{ target: Soy }, " profesora."], rule: { en: ["a job takes ", { term: ser }], es: ["la profesión lleva ", { term: ser }] } }
          - { level: A1, wrong: Es las tres., right: [{ target: Son }, " las tres."], rule: { en: ["the hour from two on takes ", { term: son }], es: ["la hora a partir de las dos lleva ", { term: son }] } }
          - { level: A2, wrong: La tienda es cerrada., right: ["La tienda ", { target: está }, " cerrada."], rule: { en: ["the result of a change takes ", { term: estar }], es: ["el resultado de un cambio lleva ", { term: estar }] } }
          - { level: A1, speakers: [en], wrong: Soy veinte años., right: [{ target: Tengo }, " veinte años."], rule: { en: ["age takes ", { term: tener }, ": ", { term: tengo veinte años }, ", not ", { term: soy }] } }
