sections:
  - title: { en: Overview, es: Visión general, uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The first phrases use four forms of ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              es: ["Las primeras frases usan cuatro formas de ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              uk: ["У перших фразах уживають чотири форми ", { term: ser }, ": ", { alternatives: [{ term: soy }, { term: eres }, { term: es }, { term: son }] }, "."]
              pt: ["As primeiras frases usam quatro formas de ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              fr: ["Les premières phrases utilisent quatre formes de ", { term: "ser" }, " : ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              de: ["Die ersten Sätze benutzen vier Formen von ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              it: ["Le prime frasi usano quattro forme di ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              pl: ["Pierwsze zdania używają czterech form ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              tr: ["İlk cümleler ", { term: "ser" }, " fiilinin dört biçimini kullanır: ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              id: ["Kalimat pertama memakai empat bentuk ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
              vi: ["Những câu đầu tiên dùng bốn dạng của ", { term: "ser" }, ": ", { alternatives: [{ term: "soy" }, { term: "eres" }, { term: "es" }, { term: "son" }] }, "."]
            ex: { examples: [[{ target: Soy }, " Ana."], ["¿", { target: Eres }, " Pablo?"], [{ target: Son }, " las dos."]] }
            tr: { en: { examples: ["I'm Ana.", Are you Pablo?, "It's two o'clock."] }, uk: { examples: ["Я Ана.", "Ти Пабло?", "Друга година."] }, pt: { examples: ["Eu sou a Ana.", "Você é o Pablo?", "São duas horas."] }, fr: { examples: ["Je suis Ana.", "Tu es Pablo ?", "Il est deux heures."] }, de: { examples: ["Ich bin Ana.", "Bist du Pablo?", "Es ist zwei Uhr."] }, it: { examples: ["Sono Ana.", "Sei Pablo?", "Sono le due."] }, pl: { examples: ["Jestem Ana.", "Czy ty jesteś Pablo?", "Jest druga."] }, tr: { examples: ["Ben Ana’yım.", "Sen Pablo musun?", "Saat iki."] }, id: { examples: ["Aku Ana.", "Apakah kamu Pablo?", "Sekarang jam dua."] }, vi: { examples: ["Tôi là Ana.", "Bạn là Pablo à?", "Hai giờ rồi."] } }
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["With ", { term: vosotros }, ", ", { term: ser }, " is ", { term: sois }, "."]
              es: ["Con ", { term: vosotros }, ", ", { term: ser }, " es ", { term: sois }, "."]
              uk: ["З ", { term: vosotros }, " дієслово ", { term: ser }, " має форму ", { term: sois }, "."]
              pt: ["Com ", { term: "vosotros" }, ", ", { term: "ser" }, " é ", { term: "sois" }, "."]
              fr: ["Avec ", { term: "vosotros" }, ", ", { term: "ser" }, " donne ", { term: "sois" }, "."]
              de: ["Mit ", { term: "vosotros" }, " heißt ", { term: "ser" }, " ", { term: "sois" }, "."]
              it: ["Con ", { term: "vosotros" }, ", ", { term: "ser" }, " è ", { term: "sois" }, "."]
              pl: ["Z ", { term: "vosotros" }, " czasownik ", { term: "ser" }, " ma formę ", { term: "sois" }, "."]
              tr: [{ term: "vosotros" }, " ile ", { term: "ser" }, " fiili ", { term: "sois" }, " olur."]
              id: ["Dengan ", { term: "vosotros" }, ", ", { term: "ser" }, " menjadi ", { term: "sois" }, "."]
              vi: ["Với ", { term: "vosotros" }, ", ", { term: "ser" }, " là ", { term: "sois" }, "."]
            ex: ["¿Vosotros ", { target: sois }, " hermanos?"]
            tr: { en: Are you brothers?, uk: "Ви брати?", pt: "Vocês são irmãos?", fr: "Vous êtes frères ?", de: "Seid ihr Brüder?", it: "Siete fratelli?", pl: "Jesteście braćmi?", tr: "Siz kardeş misiniz?", id: "Apakah kalian bersaudara?", vi: "Các bạn là anh em à?" }
          - type: rule
            level: A1
            text:
              en: [{ term: ser }, " names what someone or something is: who, what, where from, what like."]
              es: [{ term: ser }, " dice qué es alguien o algo: quién, qué, de dónde, cómo es."]
              uk: [{ term: ser }, " вказує, ким чи чим є хтось або щось: хто, що, звідки, який."]
              pt: [{ term: "ser" }, " diz o que alguém ou algo é: quem, o quê, de onde, como é."]
              fr: [{ term: "ser" }, " dit ce qu’est quelqu’un ou quelque chose : qui, quoi, d’où, comment."]
              de: [{ term: "ser" }, " sagt, was jemand oder etwas ist: wer, was, woher, wie."]
              it: [{ term: "ser" }, " dice che cosa è qualcuno o qualcosa: chi, che cosa, di dove, com'è."]
              pl: [{ term: "ser" }, " mówi, kim lub czym ktoś jest: kto, co, skąd, jaki."]
              tr: [{ term: "ser" }, " birinin ya da bir şeyin ne olduğunu söyler: kim, ne, nereli, nasıl."]
              id: [{ term: "ser" }, " menyatakan siapa atau apa seseorang atau sesuatu itu: siapa, apa, dari mana, seperti apa."]
              vi: [{ term: "ser" }, " cho biết ai đó hay vật gì là gì: ai, cái gì, từ đâu, như thế nào."]
          - type: rule
            level: A1
            text:
              en: [{ term: estar }, " names where someone or something is, and how it is now."]
              es: [{ term: estar }, " dice dónde está alguien o algo, y cómo está ahora."]
              uk: [{ term: estar }, " вказує, де хтось чи щось перебуває і в якому стані зараз."]
              pt: [{ term: "estar" }, " diz onde alguém ou algo está, e como está agora."]
              fr: [{ term: "estar" }, " dit où se trouve quelqu’un ou quelque chose, et comment il est maintenant."]
              de: [{ term: "estar" }, " sagt, wo jemand oder etwas ist und wie es jetzt ist."]
              it: [{ term: "estar" }, " dice dove si trova qualcuno o qualcosa, e com'è adesso."]
              pl: [{ term: "estar" }, " mówi, gdzie ktoś lub coś jest i jaki jest teraz."]
              tr: [{ term: "estar" }, " birinin ya da bir şeyin nerede olduğunu ve şimdi nasıl olduğunu söyler."]
              id: [{ term: "estar" }, " menyatakan di mana seseorang atau sesuatu berada, dan bagaimana keadaannya sekarang."]
              vi: [{ term: "estar" }, " cho biết ai đó hay vật gì ở đâu, và hiện đang thế nào."]
          - type: note
            level: A1
            text:
              en: ["For something that exists somewhere, see ", { link: Hay and Está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              es: ["Para decir que algo existe en un lugar, ver ", { link: Hay y está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              uk: ["Як сказати, що щось є десь, — див. ", { link: "Hay і está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              pt: ["Para dizer que algo existe em um lugar, veja ", { link: "Hay e está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              fr: ["Pour dire que quelque chose existe quelque part, voir ", { link: "Hay et está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              de: ["Um zu sagen, dass etwas an einem Ort existiert, siehe ", { link: "Hay und está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              it: ["Per dire che qualcosa esiste in un luogo, vedi ", { link: "Hay e está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              pl: ["Aby powiedzieć, że coś istnieje w jakimś miejscu, zobacz ", { link: "Hay i está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              tr: ["Bir yerde bir şeyin var olduğunu söylemek için bkz. ", { link: "Hay ve está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              id: ["Untuk menyatakan bahwa sesuatu ada di suatu tempat, lihat ", { link: "Hay dan está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
              vi: ["Để nói có một vật ở một nơi, xem ", { link: "Hay và está", to: es.ser-estar-hay-gustar.hay-esta }, "."]
          - type: note
            level: A2
            text:
              en: ["With an adjective, ", { term: ser }, " says what something is like and ", { term: estar }, " how it is now: ", { link: Ser or Estar with Adjectives, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              es: ["Con un adjetivo, ", { term: ser }, " dice cómo es algo y ", { term: estar }, ", cómo está ahora: ", { link: Ser o estar con adjetivos, to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              uk: ["З прикметником ", { term: ser }, " вказує, яке щось є, а ", { term: estar }, " — яке воно зараз: ", { link: "Ser чи estar із прикметниками", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              pt: ["Com um adjetivo, ", { term: "ser" }, " diz como algo é e ", { term: "estar" }, ", como está agora: ", { link: "Ser ou estar com adjetivos", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              fr: ["Avec un adjectif, ", { term: "ser" }, " dit comment est quelque chose et ", { term: "estar" }, ", comment il est maintenant : ", { link: "Ser ou estar avec des adjectifs", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              de: ["Bei einem Adjektiv sagt ", { term: "ser" }, ", wie etwas ist, und ", { term: "estar" }, ", wie es jetzt ist: ", { link: "Ser oder estar mit Adjektiven", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              it: ["Con un aggettivo, ", { term: "ser" }, " dice com'è qualcosa e ", { term: "estar" }, " com'è adesso: ", { link: "Ser o estar con gli aggettivi", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              pl: ["Z przymiotnikiem ", { term: "ser" }, " mówi, jaka rzecz jest, a ", { term: "estar" }, " — jaka jest teraz: ", { link: "Ser czy estar z przymiotnikami", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              tr: ["Sıfatla birlikte ", { term: "ser" }, " bir şeyin nasıl olduğunu, ", { term: "estar" }, " ise şimdi nasıl olduğunu söyler: ", { link: "Sıfatlarla ser ve estar", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              id: ["Dengan kata sifat, ", { term: "ser" }, " menyatakan seperti apa sesuatu, dan ", { term: "estar" }, " menyatakan keadaannya sekarang: ", { link: "Ser atau estar dengan kata sifat", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]
              vi: ["Với tính từ, ", { term: "ser" }, " cho biết vật như thế nào, còn ", { term: "estar" }, " cho biết vật đang thế nào: ", { link: "Ser hoặc estar với tính từ", to: es.ser-estar-hay-gustar.ser-estar-adjetivos }, "."]

  - title: { en: "Form: the present", es: "Forma: el presente", uk: "Форма: теперішній час", pt: "Forma: o presente", fr: "Forme : le présent", de: "Form: das Präsens", it: "Forma: il presente", pl: "Forma: czas teraźniejszy", tr: "Biçim: şimdiki zaman", id: "Bentuk: presente", vi: "Dạng: thì hiện tại" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: "Особа", pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: ser, label: ser }
          - { key: estar, label: estar }
        rows:
          - { level: A1, features: { person: 1, number: sg }, person: yo, ser: { target: soy }, estar: { target: estoy } }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, person: tú, ser: { target: eres }, estar: { target: estás } }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ser: { target: es }, estar: { target: está } }
          - { level: A1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ser: { target: somos }, estar: { target: estamos } }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ser: { target: sois }, estar: { target: estáis } }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ser: { target: son }, estar: { target: están } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The forms ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " carry a written accent on the last syllable."]
              es: ["Las formas ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " llevan tilde en la última sílaba."]
              uk: ["Форми ", { alternatives: [{ term: estás }, { term: está }, { term: están }] }, " мають знак наголосу на останньому складі."]
              pt: ["As formas ", { alternatives: [{ term: "estás" }, { term: "está" }, { term: "están" }] }, " levam acento gráfico na última sílaba."]
              fr: ["Les formes ", { alternatives: [{ term: "estás" }, { term: "está" }, { term: "están" }] }, " portent un accent écrit sur la dernière syllabe."]
              de: ["Die Formen ", { alternatives: [{ term: "estás" }, { term: "está" }, { term: "están" }] }, " tragen einen Akzent auf der letzten Silbe."]
