title: { es: "Abreviaturas, siglas y símbolos", en: "Abbreviations, acronyms and symbols", uk: "Скорочення, абревіатури й символи", pt: "Abreviaturas, siglas e símbolos", fr: "Abréviations, sigles et symboles", de: "Abkürzungen, Akronyme und Symbole", it: "Abbreviazioni, sigle e simboli", pl: "Skróty, skrótowce i symbole", tr: "Kısaltmalar, akronimler ve simgeler", id: "Singkatan, akronim, dan simbol", vi: "Chữ viết tắt, từ viết tắt và ký hiệu" }
summary:
  lead:
    es: "Las abreviaturas acortan palabras con punto, barra o letras voladas, las siglas reúnen las iniciales de un nombre y los símbolos son signos fijos."
    en: "Abbreviations shorten words with a full stop, a slash or superscript letters, acronyms gather the initials of a name, and symbols are fixed signs."
    uk: "Скорочення вкорочують слова за допомогою крапки, коси риски або надрядкових літер, абревіатури поєднують початкові літери назви, а символи — це сталі знаки."
    pt: "As abreviaturas encurtam palavras com ponto, barra ou letras sobrescritas, as siglas reúnem as iniciais de um nome e os símbolos são sinais fixos."
    fr: "Les abréviations raccourcissent les mots avec point, barre ou exposant, les sigles réunissent les initiales d’un nom, les symboles sont des signes fixes."
    de: "Abkürzungen kürzen Wörter mit Punkt, Schrägstrich oder hochgestellten Buchstaben, Akronyme vereinen Anfangsbuchstaben eines Namens, Symbole sind feste Zeichen."
    it: "Le abbreviazioni accorciano le parole con punto, barra o lettere in apice, le sigle riuniscono le iniziali di un nome e i simboli sono segni fissi."
    pl: "Skróty skracają wyrazy za pomocą kropki, ukośnika lub liter w indeksie górnym, skrótowce zbierają pierwsze litery nazwy, a symbole są stałymi znakami."
    tr: "Kısaltmalar sözcükleri nokta, eğik çizgi veya üst simge harflerle kısaltır; akronimler bir adın baş harflerini toplar; simgeler sabit işaretlerdir."
    id: "Singkatan memendekkan kata dengan titik, garis miring, atau huruf superskrip; akronim menggabungkan huruf awal sebuah nama; simbol adalah tanda yang tetap."
    vi: "Chữ viết tắt rút gọn từ bằng dấu chấm, dấu gạch chéo hoặc chữ viết nhỏ lên trên; từ viết tắt gom chữ cái đầu của tên; ký hiệu là dấu cố định."
  rule:
    es: "La letra volada de una abreviatura va detrás de un punto:"
    en: "The superscript letter of an abbreviation comes after a full stop:"
    uk: "Надрядкова літера скорочення стоїть після крапки:"
    pt: "A letra sobrescrita de uma abreviatura vem depois de um ponto:"
    fr: "La lettre en exposant d’une abréviation vient après un point :"
    de: "Der hochgestellte Buchstabe einer Abkürzung steht hinter einem Punkt:"
    it: "La lettera in apice di un'abbreviazione va dopo un punto:"
    pl: "Litera w indeksie górnym skrótu stoi po kropce:"
    tr: "Bir kısaltmanın üst simge harfi noktadan sonra gelir:"
    id: "Huruf superskrip pada singkatan datang setelah titik:"
    vi: "Chữ viết nhỏ lên trên sau dấu chấm:"
  ex: [{ target: "M.ª" }, " Luisa vive en la calle Sol, ", { target: "n.º" }, " 5."]

