  - title: { es: Símbolos, en: "Symbols", uk: "Символи", pt: "Símbolos", fr: "Symboles", de: "Symbole", it: "Simboli", pl: "Symbole", tr: "Simgeler", id: "Simbol", vi: "Ký hiệu" }
