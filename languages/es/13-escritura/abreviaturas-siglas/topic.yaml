              de: "Ein Symbol ohne Buchstaben, das sich nicht alphabetisch ordnen lässt, ist ein Zeichen für ein Wort oder eine Idee:"
              it: "Un simbolo senza lettere, non ordinabile alfabeticamente, è un segno che rappresenta una parola o un'idea:"
