# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.escritura.abreviaturas-siglas
lang: es
kind: foundations
tags: [abbreviations, acronyms, symbols, writing]
concepts: [abbreviations]
related: [es.fundamentos.alfabeto-ortografia, es.fundamentos.numeros]
status: { es: draft }

title: { es: "Abreviaturas, siglas y símbolos" }
summary:
  lead:
    es: "Las abreviaturas acortan palabras con punto, barra o letras voladas, las siglas reúnen las iniciales de un nombre y los símbolos son signos fijos."
  rule:
    es: "La letra volada de una abreviatura va detrás de un punto:"
  ex: [{ target: "M.ª" }, " Luisa vive en la calle Sol, ", { target: "n.º" }, " 5."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto } }
        - { key: rule, label: { es: Regla } }
        - { key: ex, label: { es: Ejemplo } }
      rows:
        - level: B2
          point: { es: "Letras iniciales" }
          rule: { es: "las primeras letras o la inicial de cada palabra, con punto" }
          ex: { examples: [{ equivalence: [{ target: "adj." }, adjetivo] }, { equivalence: [{ target: "a. C." }, "antes de Cristo"] }] }
        - level: B2
          point: { es: Contracción }
          rule: { es: "se omiten letras del medio y un punto cierra la abreviatura" }
          ex: { examples: [{ equivalence: [{ target: "Fdo." }, firmado] }, { equivalence: [{ target: "Sra." }, señora] }] }
        - level: B2
          point: { es: "Letras voladas" }
          rule: { es: "la inicial, un punto y la última letra volada" }
          ex: { examples: [{ equivalence: [{ target: "M.ª" }, María] }, { equivalence: [{ target: "n.º" }, número] }] }
        - level: B2
          point: { es: Barra }
          rule: { es: "dos iniciales unidas por una barra, sin punto" }
          ex: { examples: [{ equivalence: [{ target: "s/n" }, "sin número"] }, { equivalence: [{ target: "c/c" }, "cuenta corriente"] }] }
        - level: B2
          point: { es: Siglas }
          rule: { es: "la primera vez, la sigla va entre paréntesis tras el nombre completo" }
          ex: ["La Organización Mundial de la Salud ", { optional: { target: OMS } }, " publicó un informe."]
        - level: B2
          point: { es: Símbolos }
          rule: { es: "un signo sin letras representa una palabra o una idea" }
          ex: { equivalence: [{ target: "©" }, "derechos de autor"] }
        - level: C1
          point: { es: "Elementos químicos" }
          rule: { es: "inicial mayúscula, sin punto y sin plural" }
          ex: { examples: [{ equivalence: [{ target: Fe }, hierro] }, { equivalence: [{ target: Ca }, calcio] }] }
        - level: C1
          point: { es: "Barra y numeral" }
          rule: { es: [{ term: "/" }, " anuncia más páginas y ", { term: "#" }, " significa «número»"] }
          ex: ["Soy el jugador ", { target: "#7" }, "."]
        - level: C2
          point: { es: "Fórmulas fijas" }
          rule: { es: "cada parte lleva su punto y su letra volada" }
          ex: { equivalence: [{ target: "V.º B.º" }, "visto bueno"] }
        - level: C2
          point: { es: "Textos especializados" }
          rule: { es: [{ term: "†" }, " marca a una persona fallecida y ", { term: "*" }, " una forma hipotética o incorrecta"] }
          ex: { examples: [["Juan Ramos ", { target: "†" }], { contrast: [[{ target: "*" }, "yo sabo"], "yo sé"] }] }
        - level: B2
          point: { es: Trampa }
          rule: { es: "el punto va antes de la letra volada" }
          ex: [{ target: "M.ª" }, " Luisa vive aquí."]
        - level: B2
          point: { es: Trampa }
          rule: { es: "una sigla va en mayúsculas y sin puntos" }
          ex: ["La ", { target: OMS }, " publicó un informe."]

sections:
  - title: { es: "Cómo se forman las abreviaturas" }
    role: own
    content:
      - type: usage
        columns:
          - { key: type, label: { es: Procedimiento } }
          - { key: form, label: { es: Forma } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            type: { es: "Por truncamiento" }
            form: { es: "se escriben las primeras letras de la palabra y un punto" }
            ex: { examples: [{ equivalence: [{ target: "adj." }, adjetivo] }, { equivalence: [{ target: "ed." }, edición] }, { equivalence: [{ target: "doc." }, documento] }, { equivalence: [{ target: "cap." }, capítulo] }] }
          - level: B2
            type: { es: "Por letra inicial" }
            form: { es: "se escribe la inicial de las palabras, cada una con punto y un espacio detrás" }
            ex: { examples: [{ equivalence: [{ target: "a. C." }, "antes de Cristo"] }, { equivalence: [{ target: "s." }, siglo] }] }
          - level: B2
            type: { es: "Por contracción" }
            form: { es: "se omiten letras del medio y se conservan el principio y el final de la palabra, con punto" }
            ex: { examples: [{ equivalence: [{ target: "Fdo." }, firmado] }, { equivalence: [{ target: "atte." }, atentamente] }, { equivalence: [{ target: "Sra." }, señora] }] }
          - level: B2
            type: { es: "Con letras voladas" }
            form: { es: "la inicial, un punto y la última letra de la palabra, volada" }
            ex: { examples: [{ equivalence: [{ target: "M.ª" }, María] }, { equivalence: [{ target: "n.º" }, número] }, { equivalence: [{ target: "f.º" }, folio] }] }
          - level: B2
            type: { es: "Con barra" }
            form: { es: "las iniciales de dos palabras van unidas por una barra, sin punto ni espacios" }
            ex: { examples: [{ equivalence: [{ target: "s/n" }, "sin número"] }, { equivalence: [{ target: "c/c" }, "cuenta corriente"] }] }
          - level: C2
            type: { es: "Con letras voladas en fórmulas fijas" }
            form: { es: "cada palabra de la fórmula lleva su punto y su letra volada, y un espacio las separa" }
            ex: { equivalence: [{ target: "V.º B.º" }, "visto bueno"] }

  - title: { es: Siglas }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso } }
          - { key: rule, label: { es: Regla } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            use: { es: "Primera mención" }
            rule: { es: "el nombre completo y, entre paréntesis, la sigla" }
            ex: ["La Organización Mundial de la Salud ", { optional: { target: OMS } }, " publicó un informe."]
          - level: B2
            use: { es: "Menciones siguientes" }
            rule: { es: "solo la sigla" }
            ex: ["La ", { target: OMS }, " publicó otro informe en mayo."]
          - level: B2
            use: { es: Escritura }
            rule: { es: "mayúsculas, sin puntos ni espacios" }
            ex: { examples: [["Mi hermana trabaja en una ", { target: ONG }, "."], ["La ", { target: ONU }, " tiene su sede en Nueva York."]] }

  - title: { es: Símbolos }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Un símbolo no alfabetizable es un signo sin letras que representa una palabra o una idea:"
            ex: { examples: [{ equivalence: [{ target: "©" }, "derechos de autor"] }, { equivalence: [{ target: "®" }, "marca registrada"] }] }
          - type: rule
            level: C2
            text:
              es: ["En textos especializados, la cruz ", { term: "†" }, " junto a un nombre indica que la persona ha muerto:"]
            ex: ["Juan Ramos ", { target: "†" }]
          - type: rule
            level: C2
            text:
              es: ["En textos especializados, el asterisco ", { term: "*" }, " delante de una forma indica que es hipotética o incorrecta:"]
            ex: { contrast: [[{ target: "*" }, "yo sabo"], "yo sé"] }

  - title: { es: "Símbolos alfabetizables y no alfabetizables" }
    role: own
    content:
      - type: usage
        columns:
          - { key: symbol, label: { es: Símbolo } }
          - { key: meaning, label: { es: Significado } }
          - { key: writing, label: { es: Escritura } }
        rows:
          - level: C1
            symbol: "Fe, Ca"
            meaning: { es: ["elementos químicos: ", { term: hierro }, " y ", { term: calcio }] }
            writing: { es: "inicial mayúscula, sin punto y sin plural" }
          - level: C1
            symbol: "/"
            meaning: { es: "en un documento, siguen más páginas" }
            writing: { es: "al pie de la página" }
          - level: C1
            symbol: "#"
            meaning: { es: "número" }
            writing: { es: ["delante de la cifra: ", { target: "#7" }] }

  - title: { es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "Mª Luisa vive aquí.", right: [{ target: "M.ª" }, " Luisa vive aquí."], rule: { es: "la letra volada va detrás de un punto" } }
          - { level: B2, wrong: "Nació en el s XVIII.", right: ["Nació en el ", { target: "s." }, " XVIII."], rule: { es: "la abreviatura por letra inicial lleva punto" } }
          - { level: B2, wrong: "Calle Sol, s./n.", right: ["Calle Sol, ", { target: "s/n" }, "."], rule: { es: "la abreviatura con barra va sin puntos" } }
          - { level: B2, wrong: "La O.M.S. publicó un informe.", right: ["La ", { target: OMS }, " publicó un informe."], rule: { es: "una sigla va en mayúsculas y sin puntos" } }
          - { level: C1, wrong: "El símbolo Fe. corresponde al hierro.", right: ["El símbolo ", { target: Fe }, " corresponde al hierro."], rule: { es: "un símbolo químico no lleva punto" } }
          - { level: C1, wrong: "El símbolo del calcio es CA.", right: ["El símbolo del calcio es ", { target: Ca }, "."], rule: { es: "en un símbolo químico, solo la inicial va en mayúscula" } }
          - { level: C2, wrong: "El director puso su Vº Bº.", right: ["El director puso su ", { target: "V.º B.º" }, "."], rule: { es: "en una fórmula fija, cada letra volada va detrás de su punto" } }
