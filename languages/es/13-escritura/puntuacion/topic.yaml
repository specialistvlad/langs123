            use: { es: "Va en los apellidos de origen extranjero.", en: "It appears in surnames of foreign origin.", uk: "Пишеться в прізвищах іноземного походження.", pt: "Aparece em sobrenomes de origem estrangeira.", fr: "Il figure dans les noms de famille d’origine étrangère.", de: "Er steht in Familiennamen fremder Herkunft.", it: "Compare nei cognomi di origine straniera.", pl: "Występuje w nazwiskach pochodzenia obcego.", tr: "Yabancı kökenli soyadlarında bulunur.", id: "Dipakai pada nama keluarga yang berasal dari luar negeri.", vi: "Có trong các họ gốc nước ngoài." }
