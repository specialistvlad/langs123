            use: { es: "Un titular, un título y el encabezado de un capítulo terminan sin punto.", en: "A headline, a title and a chapter heading end without a full stop.", uk: "Газетний заголовок, назва твору та заголовок розділу закінчуються без крапки.", pt: "Uma manchete, um título e o cabeçalho de um capítulo terminam sem ponto final.", fr: "Un titre de presse, un titre d’œuvre et un intitulé de chapitre se terminent sans point.", de: "Eine Schlagzeile, ein Titel und eine Kapitelüberschrift enden ohne Punkt.", it: "Un titolo di giornale, un titolo e l'intestazione di un capitolo finiscono senza punto.", pl: "Nagłówek prasowy, tytuł i tytuł rozdziału kończą się bez kropki.", tr: "Manşet, başlık ve bölüm başlığı noktasız biter.", id: "Tajuk berita, judul, dan judul bab diakhiri tanpa titik.", vi: "Tít báo, tên tác phẩm và tiêu đề chương không kết thúc bằng dấu chấm." }
            ex: { examples: [{ target: "La selección gana el torneo" }, { target: "Cien años de soledad" }] }
            tr: { en: { examples: ["The national team wins the tournament", "One Hundred Years of Solitude"] }, uk: { examples: ["Збірна виграє турнір", "Сто років самотності"] }, pt: { examples: ["A seleção vence o torneio", "Cem anos de solidão"] }, fr: { examples: ["L’équipe nationale remporte le tournoi", "Cent ans de solitude"] }, de: { examples: ["Die Nationalmannschaft gewinnt das Turnier", "Hundert Jahre Einsamkeit"] }, it: { examples: ["La nazionale vince il torneo", "Cent'anni di solitudine"] }, pl: { examples: ["Reprezentacja wygrywa turniej", "Sto lat samotności"] }, tr: { examples: ["Milli takım turnuvayı kazanıyor", "Yüzyıllık Yalnızlık"] }, id: { examples: ["Tim nasional juara turnamen", "Seratus Tahun Kesunyian"] }, vi: { examples: ["Đội tuyển quốc gia vô địch giải đấu", "Trăm năm cô đơn"] } }
          - level: C2
            use: { es: "El punto va antes de la letra volada de una abreviatura.", en: "The full stop goes before the superscript letter of an abbreviation.", uk: "У скороченні крапка стоїть перед літерою у верхньому індексі.", pt: "O ponto fica antes da letra sobrescrita de uma abreviatura.", fr: "Le point se place avant la lettre en exposant d’une abréviation.", de: "Der Punkt steht vor dem hochgestellten Buchstaben einer Abkürzung.", it: "Il punto va prima della lettera in apice di un'abbreviazione.", pl: "Kropka stoi przed literą w indeksie górnym w skrócie.", tr: "Nokta, kısaltmanın üst simge harfinden önce gelir.", id: "Titik diletakkan sebelum huruf superskrip pada singkatan.", vi: "Dấu chấm đứng trước chữ cái nhỏ nâng lên trên của từ viết tắt." }
            ex: { examples: [["Saluda a ", { target: "D.ª" }, " Marta."], ["Vivo en el ", { target: "2.º" }, " piso."]] }
            tr: { en: { examples: ["Say hello to Doña Marta.", "I live on the second floor."] }, uk: { examples: ["Привітай пані Марту.", "Я живу на другому поверсі."] }, pt: { examples: ["Cumprimente a Dona Marta.", "Moro no segundo andar."] }, fr: { examples: ["Salue Madame Marta.", "J’habite au deuxième étage."] }, de: { examples: ["Grüß Frau Marta.", "Ich wohne im zweiten Stock."] }, it: { examples: ["Saluta la signora Marta.", "Abito al secondo piano."] }, pl: { examples: ["Pozdrów panią Martę.", "Mieszkam na drugim piętrze."] }, tr: { examples: ["Marta Hanım’a selam söyle.", "İkinci katta oturuyorum."] }, id: { examples: ["Sampaikan salam kepada Ibu Marta.", "Saya tinggal di lantai dua."] }, vi: { examples: ["Cho tôi gửi lời chào bà Marta.", "Tôi sống ở tầng hai."] } }

  - title: { es: La coma, en: "The comma", uk: "Кома", pt: "A vírgula", fr: "La virgule", de: "Das Komma", it: "La virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "Un inciso que indica quién habla va entre dos comas.", en: "An aside that says who is speaking goes between two commas.", uk: "Вставна частина, що вказує, хто говорить, стоїть між двома комами.", pt: "Um inciso que indica quem fala vai entre duas vírgulas.", fr: "Une incise qui indique qui parle se place entre deux virgules.", de: "Ein Einschub, der angibt, wer spricht, steht zwischen zwei Kommas.", it: "Un inciso che indica chi parla sta tra due virgole.", pl: "Wtrącenie wskazujące, kto mówi, stoi między dwoma przecinkami.", tr: "Kimin konuştuğunu belirten ara söz iki virgül arasına yazılır.", id: "Sisipan yang menyebut siapa yang berbicara diapit dua koma.", vi: "Thành phần xen cho biết ai đang nói nằm giữa hai dấu phẩy." }
            ex: ["El viaje", { target: "," }, " dice Marta", { target: "," }, " será largo."]
            tr: { en: "The journey, says Marta, will be long.", uk: "Подорож, каже Марта, буде довгою.", pt: "A viagem, diz Marta, será longa.", fr: "Le voyage, dit Marta, sera long.", de: "Die Reise, sagt Marta, wird lang.", it: "Il viaggio, dice Marta, sarà lungo.", pl: "Podróż, mówi Marta, będzie długa.", tr: "Yolculuk, diyor Marta, uzun olacak.", id: "Perjalanan itu, kata Marta, akan panjang.", vi: "Chuyến đi, Marta nói, sẽ dài." }
          - level: B2
            use: { es: ["Una aclaración con ", { term: es decir }, " lleva una coma antes y otra después."], en: ["A clarification with ", { term: "es decir" }, " takes a comma before and another after."], uk: ["Уточнення зі словами ", { term: "es decir" }, " виділяється комою до і комою після."], pt: ["Um esclarecimento com ", { term: "es decir" }, " leva uma vírgula antes e outra depois."], fr: ["Une précision introduite par ", { term: "es decir" }, " prend une virgule avant et une autre après."], de: ["Eine Erläuterung mit ", { term: "es decir" }, " hat ein Komma davor und eines danach."], it: ["Una precisazione con ", { term: "es decir" }, " ha una virgola prima e un'altra dopo."], pl: ["Wyjaśnienie z ", { term: "es decir" }, " ma przecinek przed i drugi po."], tr: [{ term: "es decir" }, " ile yapılan açıklamanın önünde de sonunda da virgül bulunur."], id: ["Penjelasan dengan ", { term: "es decir" }, " memakai satu koma di depan dan satu koma di belakang."], vi: ["Lời giải thích có ", { term: "es decir" }, " có một dấu phẩy ở trước và một dấu phẩy ở sau."] }
            ex: ["Vive cerca", { target: "," }, " es decir", { target: "," }, " a diez minutos a pie."]
            tr: { en: "He lives nearby, that is, ten minutes away on foot.", uk: "Він живе поруч, тобто за десять хвилин пішки.", pt: "Mora perto, isto é, a dez minutos a pé.", fr: "Il habite près d’ici, c’est-à-dire à dix minutes à pied.", de: "Er wohnt in der Nähe, das heißt, zehn Minuten zu Fuß entfernt.", it: "Abita vicino, cioè a dieci minuti a piedi.", pl: "Mieszka blisko, czyli dziesięć minut stąd pieszo.", tr: "Yakında oturuyor, yani yürüyerek on dakika uzaklıkta.", id: "Dia tinggal di dekat sini, yaitu sepuluh menit berjalan kaki.", vi: "Anh ấy sống gần đây, tức là cách mười phút đi bộ." }
          - level: B2
            use: { es: "Un comentario del hablante va entre dos comas.", en: "A comment by the speaker goes between two commas.", uk: "Коментар мовця стоїть між двома комами.", pt: "Um comentário do falante vai entre duas vírgulas.", fr: "Un commentaire du locuteur se place entre deux virgules.", de: "Ein Kommentar der sprechenden Person steht zwischen zwei Kommas.", it: "Un commento del parlante sta tra due virgole.", pl: "Komentarz mówiącego stoi między dwoma przecinkami.", tr: "Konuşurun yorumu iki virgül arasına yazılır.", id: "Komentar penutur diapit dua koma.", vi: "Lời bình của người nói nằm giữa hai dấu phẩy." }
            ex: ["El agua", { target: "," }, " como todos sabemos", { target: "," }, " es vital."]
            tr: { en: "Water, as we all know, is vital.", uk: "Вода, як ми всі знаємо, життєво необхідна.", pt: "A água, como todos sabemos, é vital.", fr: "L’eau, comme nous le savons tous, est vitale.", de: "Wasser ist, wie wir alle wissen, lebenswichtig.", it: "L'acqua, come tutti sappiamo, è vitale.", pl: "Woda, jak wszyscy wiemy, jest niezbędna do życia.", tr: "Su, hepimizin bildiği gibi, hayatidir.", id: "Air, seperti yang kita semua tahu, sangat penting.", vi: "Nước, như chúng ta đều biết, rất thiết yếu." }
          - level: B2
            use: { es: "Un adverbio que modifica toda la oración va seguido de coma.", en: "An adverb that modifies the whole sentence is followed by a comma.", uk: "Прислівник, що стосується всього речення, відокремлюється комою.", pt: "Um advérbio que modifica a oração inteira é seguido de vírgula.", fr: "Un adverbe qui porte sur toute la phrase est suivi d’une virgule.", de: "Ein Adverb, das sich auf den ganzen Satz bezieht, wird von einem Komma gefolgt.", it: "Un avverbio che modifica tutta la frase è seguito da una virgola.", pl: "Po przysłówku odnoszącym się do całego zdania stawia się przecinek.", tr: "Cümlenin tamamını niteleyen zarfın ardından virgül konur.", id: "Adverbia yang menerangkan seluruh kalimat diikuti koma.", vi: "Trạng từ bổ nghĩa cho cả câu được theo sau bằng dấu phẩy." }
            ex: ["Lamentablemente", { target: "," }, " el tren ya salió."]
            tr: { en: "Unfortunately, the train has already left.", uk: "На жаль, потяг уже поїхав.", pt: "Infelizmente, o trem já saiu.", fr: "Malheureusement, le train est déjà parti.", de: "Leider ist der Zug schon abgefahren.", it: "Purtroppo, il treno è già partito.", pl: "Niestety, pociąg już odjechał.", tr: "Maalesef, tren çoktan kalktı.", id: "Sayangnya, kereta sudah berangkat.", vi: "Đáng tiếc, tàu đã rời ga rồi." }
          - level: B2
            use: { es: "Una oración de relativo explicativa va entre dos comas.", en: "A non-defining relative clause goes between two commas.", uk: "Пояснювальне означальне речення виділяється двома комами.", pt: "Uma oração relativa explicativa vai entre duas vírgulas.", fr: "Une relative explicative se place entre deux virgules.", de: "Ein appositiver Relativsatz steht zwischen zwei Kommas.", it: "Una relativa appositiva sta tra due virgole.", pl: "Zdanie względne wyjaśniające stoi między dwoma przecinkami.", tr: "Açıklayıcı ilgi cümlesi iki virgül arasına yazılır.", id: "Klausa relatif nonrestriktif diapit dua koma.", vi: "Mệnh đề quan hệ không xác định nằm giữa hai dấu phẩy." }
            ex: ["Mi abuela", { target: "," }, " que vive en Cali", { target: "," }, " nos visita hoy."]
            tr: { en: "My grandmother, who lives in Cali, is visiting us today.", uk: "Моя бабуся, яка живе в Калі, сьогодні нас відвідає.", pt: "Minha avó, que mora em Cali, nos visita hoje.", fr: "Ma grand-mère, qui habite à Cali, nous rend visite aujourd’hui.", de: "Meine Oma, die in Cali wohnt, besucht uns heute.", it: "Mia nonna, che vive a Cali, ci fa visita oggi.", pl: "Moja babcia, która mieszka w Cali, odwiedza nas dzisiaj.", tr: "Cali’de yaşayan büyükannem bugün bizi ziyaret ediyor.", id: "Nenek saya, yang tinggal di Cali, mengunjungi kami hari ini.", vi: "Bà tôi, người sống ở Cali, hôm nay đến thăm chúng tôi." }
          - level: B2
            use: { es: "La coma ocupa el lugar de un verbo omitido.", en: "A comma takes the place of an omitted verb.", uk: "Кома стоїть на місці пропущеного дієслова.", pt: "A vírgula ocupa o lugar de um verbo omitido.", fr: "La virgule remplace un verbe sous-entendu.", de: "Das Komma steht an der Stelle eines ausgelassenen Verbs.", it: "La virgola prende il posto di un verbo omesso.", pl: "Przecinek zastępuje pominięty czasownik.", tr: "Virgül, düşmüş bir fiilin yerini tutar.", id: "Koma menggantikan verba yang dihilangkan.", vi: "Dấu phẩy thay cho động từ bị lược." }
            ex: ["Mi casa es antigua; la de Luis", { target: "," }, " moderna."]
            tr: { en: "My house is old; Luis's, modern.", uk: "Мій будинок старий; будинок Луїса — сучасний.", pt: "Minha casa é antiga; a de Luis, moderna.", fr: "Ma maison est ancienne ; celle de Luis, moderne.", de: "Mein Haus ist alt; das von Luis, modern.", it: "La mia casa è antica; quella di Luis, moderna.", pl: "Mój dom jest stary; dom Luisa – nowoczesny.", tr: "Benim evim eski; Luis’inki modern.", id: "Rumah saya tua; rumah Luis, modern.", vi: "Nhà tôi cũ; nhà của Luis, hiện đại." }
          - level: B2
            use: { es: "El apellido escrito antes del nombre va seguido de coma.", en: "A surname written before the first name is followed by a comma.", uk: "Прізвище, написане перед іменем, відокремлюється комою.", pt: "O sobrenome escrito antes do nome é seguido de vírgula.", fr: "Le nom de famille écrit avant le prénom est suivi d’une virgule.", de: "Ein vor dem Vornamen stehender Familienname wird von einem Komma gefolgt.", it: "Il cognome scritto prima del nome è seguito da una virgola.", pl: "Nazwisko napisane przed imieniem oddziela się przecinkiem.", tr: "Addan önce yazılan soyadından sonra virgül konur.", id: "Nama keluarga yang ditulis sebelum nama depan diikuti koma.", vi: "Họ viết trước tên được theo sau bằng dấu phẩy." }
            ex: { examples: [["Rivera", { target: "," }, " Diego"], ["Kahlo", { target: "," }, " Frida"]] }
            tr: { en: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, uk: { examples: ["Рівера, Дієго", "Кало, Фріда"] }, pt: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, fr: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, de: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, it: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, pl: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, tr: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, id: { examples: ["Rivera, Diego", "Kahlo, Frida"] }, vi: { examples: ["Rivera, Diego", "Kahlo, Frida"] } }
          - level: C1
            use: { es: "Las comas entre las alternativas de una pregunta disyuntiva la enfatizan.", en: "Commas between the options of an alternative question stress it.", uk: "Коми між варіантами альтернативного питання роблять його наголошеним.", pt: "As vírgulas entre as alternativas de uma pergunta disjuntiva a enfatizam.", fr: "Les virgules entre les options d’une question disjonctive la mettent en relief.", de: "Kommas zwischen den Möglichkeiten einer Alternativfrage betonen sie.", it: "Le virgole tra le alternative di una domanda disgiuntiva la enfatizzano.", pl: "Przecinki między opcjami pytania alternatywnego uwydatniają je.", tr: "Seçenekli bir sorunun seçenekleri arasındaki virgüller soruyu vurgular.", id: "Koma di antara pilihan dalam pertanyaan pilihan menegaskan pertanyaan itu.", vi: "Dấu phẩy giữa các lựa chọn của câu hỏi lựa chọn làm câu hỏi nhấn mạnh hơn." }
            ex: ["¿Cenas con nosotros", { target: "," }, " te quedas en casa", { target: "," }, " o tienes otro plan?"]
            tr: { en: "Are you having dinner with us, staying at home, or do you have another plan?", uk: "Ти вечеряєш з нами, залишаєшся вдома чи в тебе інші плани?", pt: "Você janta com a gente, fica em casa ou tem outro plano?", fr: "Tu dînes avec nous, tu restes à la maison ou tu as un autre plan ?", de: "Isst du mit uns zu Abend, bleibst du zu Hause oder hast du einen anderen Plan?", it: "Ceni con noi, resti a casa o hai un altro programma?", pl: "Jesz z nami kolację, zostajesz w domu czy masz inne plany?", tr: "Bizimle akşam yemeği yiyor musun, evde mi kalıyorsun, yoksa başka bir planın mı var?", id: "Kamu makan malam bersama kami, tinggal di rumah, atau punya rencana lain?", vi: "Bạn ăn tối với chúng tôi, ở nhà, hay có kế hoạch khác?" }
          - level: C1
            use: { es: ["Una coma delante de ", { term: y }, " separa una oración que no forma parte de la serie anterior."], en: ["A comma before ", { term: "y" }, " sets off a clause that is not part of the preceding series."], uk: ["Кома перед ", { term: "y" }, " відокремлює речення, яке не входить до попереднього ряду."], pt: ["Uma vírgula antes de ", { term: "y" }, " separa uma oração que não faz parte da série anterior."], fr: ["Une virgule devant ", { term: "y" }, " sépare une proposition qui ne fait pas partie de la série précédente."], de: ["Ein Komma vor ", { term: "y" }, " trennt einen Satz ab, der nicht zur vorangehenden Reihe gehört."], it: ["Una virgola davanti a ", { term: "y" }, " separa una frase che non fa parte della serie precedente."], pl: ["Przecinek przed ", { term: "y" }, " oddziela zdanie, które nie należy do poprzedniego ciągu."], tr: [{ term: "y" }, " öncesindeki virgül, önceki dizinin parçası olmayan bir cümleyi ayırır."], id: ["Koma sebelum ", { term: "y" }, " memisahkan kalimat yang bukan bagian dari rangkaian sebelumnya."], vi: ["Dấu phẩy trước ", { term: "y" }, " tách một câu không thuộc chuỗi liệt kê đứng trước."] }
            ex: ["Compramos pan y leche", { target: "," }, " y luego volvimos a casa."]
            tr: { en: "We bought bread and milk, and then we went back home.", uk: "Ми купили хліб і молоко, а потім повернулися додому.", pt: "Compramos pão e leite, e depois voltamos para casa.", fr: "Nous avons acheté du pain et du lait, et ensuite nous sommes rentrés à la maison.", de: "Wir kauften Brot und Milch, und dann gingen wir nach Hause.", it: "Abbiamo comprato pane e latte, e poi siamo tornati a casa.", pl: "Kupiliśmy chleb i mleko, a potem wróciliśmy do domu.", tr: "Ekmek ve süt aldık, sonra eve döndük.", id: "Kami membeli roti dan susu, lalu kami pulang ke rumah.", vi: "Chúng tôi mua bánh mì và sữa, rồi chúng tôi về nhà." }
          - level: C1
            use: { es: "La subordinada que abre la oración termina en coma.", en: "A subordinate clause that opens the sentence ends with a comma.", uk: "Підрядне речення на початку речення закінчується комою.", pt: "A subordinada que abre a oração termina em vírgula.", fr: "La subordonnée qui ouvre la phrase se termine par une virgule.", de: "Ein Nebensatz am Satzanfang endet mit einem Komma.", it: "La subordinata che apre la frase termina con una virgola.", pl: "Zdanie podrzędne na początku zdania kończy się przecinkiem.", tr: "Cümleyi açan yan cümle virgülle biter.", id: "Anak kalimat yang membuka kalimat diakhiri koma.", vi: "Mệnh đề phụ mở đầu câu kết thúc bằng dấu phẩy." }
            ex: { examples: [["Si tuviera tiempo", { target: "," }, " te ayudaría."], ["Como llovía", { target: "," }, " nos quedamos en casa."], ["Para que lo sepas", { target: "," }, " lo hice yo."]] }
            tr: { en: { examples: ["If I had time, I would help you.", "As it was raining, we stayed at home.", "Just so you know, I did it."] }, uk: { examples: ["Якби я мав час, я б тобі допоміг.", "Оскільки йшов дощ, ми залишилися вдома.", "Щоб ти знав, це зробив я."] }, pt: { examples: ["Se eu tivesse tempo, ajudaria você.", "Como chovia, ficamos em casa.", "Para você saber, fui eu que fiz."] }, fr: { examples: ["Si j’avais le temps, je t’aiderais.", "Comme il pleuvait, nous sommes restés à la maison.", "Pour que tu le saches, c’est moi qui l’ai fait."] }, de: { examples: ["Wenn ich Zeit hätte, würde ich dir helfen.", "Weil es regnete, blieben wir zu Hause.", "Damit du es weißt: Ich war es."] }, it: { examples: ["Se avessi tempo, ti aiuterei.", "Siccome pioveva, siamo rimasti a casa.", "Perché tu lo sappia, l'ho fatto io."] }, pl: { examples: ["Gdybym miał czas, pomógłbym ci.", "Ponieważ padało, zostaliśmy w domu.", "Żebyś wiedział, zrobiłem to ja."] }, tr: { examples: ["Vaktim olsa, sana yardım ederdim.", "Yağmur yağdığı için evde kaldık.", "Bilesin diye söylüyorum, bunu ben yaptım."] }, id: { examples: ["Kalau saya punya waktu, saya akan membantumu.", "Karena hujan, kami tinggal di rumah.", "Supaya kamu tahu, saya yang melakukannya."] }, vi: { examples: ["Nếu có thời gian, tôi sẽ giúp bạn.", "Vì trời mưa, chúng tôi ở nhà.", "Để bạn biết, chính tôi đã làm việc đó."] } }
          - level: C1
            use: { es: "La subordinada que sigue a la oración principal se une a ella sin coma.", en: "A subordinate clause that follows the main clause joins it without a comma.", uk: "Підрядне речення після головного приєднується без коми.", pt: "A subordinada que segue a oração principal se une a ela sem vírgula.", fr: "La subordonnée qui suit la principale s’y rattache sans virgule.", de: "Ein Nebensatz, der auf den Hauptsatz folgt, schließt ohne Komma an.", it: "La subordinata che segue la principale si unisce a essa senza virgola.", pl: "Zdanie podrzędne po zdaniu głównym łączy się z nim bez przecinka.", tr: "Ana cümleden sonra gelen yan cümle ona virgülsüz bağlanır.", id: "Anak kalimat yang mengikuti induk kalimat disambung tanpa koma.", vi: "Mệnh đề phụ đứng sau mệnh đề chính nối với nó mà không có dấu phẩy." }
            ex: ["Te ayudaría ", { target: si tuviera tiempo }, "."]
            tr: { en: "I would help you if I had time.", uk: "Я б тобі допоміг, якби мав час.", pt: "Eu ajudaria você se tivesse tempo.", fr: "Je t’aiderais si j’avais le temps.", de: "Ich würde dir helfen, wenn ich Zeit hätte.", it: "Ti aiuterei se avessi tempo.", pl: "Pomógłbym ci, gdybym miał czas.", tr: "Vaktim olsa sana yardım ederdim.", id: "Saya akan membantumu kalau saya punya waktu.", vi: "Tôi sẽ giúp bạn nếu tôi có thời gian." }
          - level: C2
            use: { es: "Una construcción absoluta se separa con coma del resto de la oración.", en: "An absolute construction is set off from the rest of the sentence by a comma.", uk: "Абсолютна конструкція відокремлюється від решти речення комою.", pt: "Uma construção absoluta é separada por vírgula do resto da oração.", fr: "Une proposition absolue est séparée du reste de la phrase par une virgule.", de: "Eine absolute Konstruktion wird durch ein Komma vom Rest des Satzes getrennt.", it: "Una costruzione assoluta si separa con una virgola dal resto della frase.", pl: "Konstrukcję absolutną oddziela się przecinkiem od reszty zdania.", tr: "Bağımsız yapı, cümlenin geri kalanından virgülle ayrılır.", id: "Konstruksi absolut dipisahkan dari bagian kalimat lainnya dengan koma.", vi: "Cụm tuyệt đối được tách khỏi phần còn lại của câu bằng dấu phẩy." }
            ex: { examples: [["Terminada la clase", { target: "," }, " salimos al patio."], ["Sabiendo la hora", { target: "," }, " se levantó."]] }
            tr: { en: { examples: ["Class finished, we went out to the yard.", "Knowing the time, he got up."] }, uk: { examples: ["Коли урок закінчився, ми вийшли на подвір’я.", "Знаючи, котра година, він підвівся."] }, pt: { examples: ["Terminada a aula, saímos para o pátio.", "Sabendo as horas, ele se levantou."] }, fr: { examples: ["Le cours terminé, nous sommes sortis dans la cour.", "Sachant l’heure, il s’est levé."] }, de: { examples: ["Als der Unterricht zu Ende war, gingen wir auf den Hof.", "Da er die Uhrzeit kannte, stand er auf."] }, it: { examples: ["Finita la lezione, siamo usciti in cortile.", "Sapendo l'ora, si alzò."] }, pl: { examples: ["Gdy lekcja się skończyła, wyszliśmy na podwórko.", "Wiedząc, która godzina, wstał."] }, tr: { examples: ["Ders bitince, bahçeye çıktık.", "Saatin kaç olduğunu bilerek, ayağa kalktı."] }, id: { examples: ["Setelah pelajaran selesai, kami keluar ke halaman.", "Karena tahu jam berapa, dia bangun."] }, vi: { examples: ["Khi tiết học kết thúc, chúng tôi ra sân.", "Biết giờ rồi, anh ấy đứng dậy."] } }

  - title: { es: Los dos puntos y el punto y coma, en: "The colon and the semicolon", uk: "Двокрапка й крапка з комою", pt: "Os dois-pontos e o ponto e vírgula", fr: "Les deux-points et le point-virgule", de: "Doppelpunkt und Semikolon", it: "I due punti e il punto e virgola", pl: "Dwukropek i średnik", tr: "İki nokta ve noktalı virgül", id: "Titik dua dan titik koma", vi: "Dấu hai chấm và dấu chấm phẩy" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo, en: "Mark", uk: "Знак", pt: "Sinal", fr: "Signe", de: "Zeichen", it: "Segno", pl: "Znak", tr: "İşaret", id: "Tanda", vi: "Dấu" } }
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Anuncian un esquema o una lista.", en: "It announces an outline or a list.", uk: "Вводить схему або перелік.", pt: "Anunciam um esquema ou uma lista.", fr: "Annoncent un schéma ou une liste.", de: "Er kündigt ein Schema oder eine Aufzählung an.", it: "Annunciano uno schema o un elenco.", pl: "Zapowiada schemat lub wyliczenie.", tr: "Bir şemayı veya listeyi duyurur.", id: "Mengantar skema atau daftar.", vi: "Báo hiệu một sơ đồ hoặc một danh sách." }
            ex: ["El curso tiene tres partes", { target: ":" }, " gramática, escritura y lectura."]
            tr: { en: "The course has three parts: grammar, writing and reading.", uk: "Курс має три частини: граматика, письмо і читання.", pt: "O curso tem três partes: gramática, escrita e leitura.", fr: "Le cours comporte trois parties : grammaire, écriture et lecture.", de: "Der Kurs hat drei Teile: Grammatik, Schreiben und Lesen.", it: "Il corso ha tre parti: grammatica, scrittura e lettura.", pl: "Kurs ma trzy części: gramatykę, pisanie i czytanie.", tr: "Kursun üç bölümü var: dilbilgisi, yazma ve okuma.", id: "Kursus ini terdiri atas tiga bagian: tata bahasa, menulis, dan membaca.", vi: "Khóa học có ba phần: ngữ pháp, viết và đọc." }
          - level: B2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Anuncian una cita literaria.", en: "It announces a literary quotation.", uk: "Вводить літературну цитату.", pt: "Anunciam uma citação literária.", fr: "Annoncent une citation littéraire.", de: "Er kündigt ein literarisches Zitat an.", it: "Annunciano una citazione letteraria.", pl: "Zapowiada cytat literacki.", tr: "Edebî bir alıntıyı duyurur.", id: "Mengantar kutipan sastra.", vi: "Báo hiệu một trích dẫn văn học." }
            ex: ["Machado escribió", { target: ":" }, " «Caminante, no hay camino, se hace camino al andar»."]
            tr: { en: "Machado wrote: ‘Traveller, there is no road; the road is made by walking.’", uk: "Мачадо написав: «Мандрівнику, немає дороги, дорогу проторюють ходою».", pt: "Machado escreveu: “Caminhante, não há caminho, o caminho se faz ao andar”.", fr: "Machado a écrit : « Voyageur, il n’y a pas de chemin, le chemin se fait en marchant ».", de: "Machado schrieb: „Wanderer, es gibt keinen Weg, der Weg entsteht beim Gehen.“", it: "Machado ha scritto: «Viandante, non c'è cammino, il cammino si fa camminando».", pl: "Machado napisał: „Wędrowcze, nie ma drogi, drogę tworzy się, idąc”.", tr: "Machado şöyle yazdı: “Yolcu, yol yoktur; yol yürüdükçe oluşur”.", id: "Machado menulis: “Pengelana, tidak ada jalan, jalan tercipta saat berjalan.”", vi: "Machado viết: “Hỡi lữ khách, không có con đường, con đường được tạo nên khi ta bước đi”." }
          - level: B2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Cierran una enumeración ante el pronombre que la resume.", en: "It closes an enumeration before the pronoun that sums it up.", uk: "Завершує перелічення перед займенником, що його підсумовує.", pt: "Encerram uma enumeração diante do pronome que a resume.", fr: "Closent une énumération devant le pronom qui la résume.", de: "Er schließt eine Aufzählung vor dem Pronomen ab, das sie zusammenfasst.", it: "Chiudono un'enumerazione davanti al pronome che la riassume.", pl: "Zamyka wyliczenie przed zaimkiem, który je podsumowuje.", tr: "Bir sıralamayı, onu özetleyen zamirden önce kapatır.", id: "Menutup rangkaian sebelum pronomina yang merangkumnya.", vi: "Khép một chuỗi liệt kê, trước đại từ tóm lược chuỗi ấy." }
            ex: ["Pan, queso, aceitunas", { target: ":" }, " eso era toda la cena."]
            tr: { en: "Bread, cheese, olives: that was the whole dinner.", uk: "Хліб, сир, оливки — оце й була вся вечеря.", pt: "Pão, queijo, azeitonas: isso era todo o jantar.", fr: "Du pain, du fromage, des olives : c’était tout le dîner.", de: "Brot, Käse, Oliven: Das war das ganze Abendessen.", it: "Pane, formaggio, olive: era tutta la cena.", pl: "Chleb, ser, oliwki – to była cała kolacja.", tr: "Ekmek, peynir, zeytin: akşam yemeğinin tamamı buydu.", id: "Roti, keju, zaitun: itulah seluruh makan malam itu.", vi: "Bánh mì, phô mai, ô liu: đó là toàn bộ bữa tối." }
          - level: C1
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Marcan una pausa enfática ante lo que se va a decir.", en: "It marks an emphatic pause before what is about to be said.", uk: "Позначає виразну паузу перед тим, що буде сказано.", pt: "Marcam uma pausa enfática antes do que vai ser dito.", fr: "Marquent une pause appuyée avant ce qui va être dit.", de: "Er markiert eine betonte Pause vor dem, was gesagt werden soll.", it: "Segnano una pausa enfatica prima di ciò che si sta per dire.", pl: "Zaznacza wyraźną pauzę przed tym, co zostanie powiedziane.", tr: "Söylenecek sözden önce vurgulu bir duraklamayı gösterir.", id: "Menandai jeda penegas sebelum hal yang akan dikatakan.", vi: "Đánh dấu một chỗ ngừng nhấn mạnh trước điều sắp nói." }
            ex: ["Ahora bien", { target: ":" }, " hay que decidir hoy."]
            tr: { en: "Now then: we must decide today.", uk: "А тепер головне: рішення треба ухвалити сьогодні.", pt: "Agora bem: é preciso decidir hoje.", fr: "Cela dit : il faut décider aujourd’hui.", de: "Nun gut: Wir müssen heute entscheiden.", it: "Ora bene: bisogna decidere oggi.", pl: "Otóż to: trzeba zdecydować dzisiaj.", tr: "Şimdi şu: bugün karar vermemiz gerek.", id: "Nah: kita harus memutuskan hari ini.", vi: "Nào: hôm nay phải quyết định." }
          - level: C1
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Introducen una explicación.", en: "It introduces an explanation.", uk: "Вводить пояснення.", pt: "Introduzem uma explicação.", fr: "Introduisent une explication.", de: "Er leitet eine Erklärung ein.", it: "Introducono una spiegazione.", pl: "Wprowadza wyjaśnienie.", tr: "Bir açıklama getirir.", id: "Memperkenalkan penjelasan.", vi: "Dẫn vào một lời giải thích." }
            ex: ["La paella es un plato valenciano", { target: ":" }, " lleva arroz, pollo y verduras."]
            tr: { en: "Paella is a dish from Valencia: it has rice, chicken and vegetables.", uk: "Паелья — валенсійська страва: до неї входять рис, курка й овочі.", pt: "A paella é um prato valenciano: leva arroz, frango e legumes.", fr: "La paella est un plat valencien : elle contient du riz, du poulet et des légumes.", de: "Die Paella ist ein valencianisches Gericht: Sie enthält Reis, Huhn und Gemüse.", it: "La paella è un piatto valenciano: contiene riso, pollo e verdure.", pl: "Paella to danie z Walencji: zawiera ryż, kurczaka i warzywa.", tr: "Paella bir Valensiya yemeğidir: içinde pirinç, tavuk ve sebze vardır.", id: "Paella adalah hidangan khas Valencia: berisi nasi, ayam, dan sayuran.", vi: "Paella là món ăn của Valencia: có gạo, thịt gà và rau." }
          - level: C2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Siguen al verbo performativo de un texto jurídico o administrativo, y la fórmula empieza con mayúscula.", en: "It follows the performative verb of a legal or administrative text, and the formula starts with a capital letter.", uk: "Стоїть після перформативного дієслова в юридичному чи адміністративному тексті, а формула починається з великої літери.", pt: "Vêm depois do verbo performativo de um texto jurídico ou administrativo, e a fórmula começa com maiúscula.", fr: "Suivent le verbe performatif d’un texte juridique ou administratif, et la formule commence par une majuscule.", de: "Er steht nach dem performativen Verb eines juristischen oder behördlichen Textes, und die Formel beginnt mit einem Großbuchstaben.", it: "Seguono il verbo performativo di un testo giuridico o amministrativo, e la formula comincia con la maiuscola.", pl: "Stoi po czasowniku performatywnym w tekście prawnym lub urzędowym, a formuła zaczyna się wielką literą.", tr: "Hukuki veya idari bir metinde edimsel fiilden sonra gelir; formül büyük harfle başlar.", id: "Mengikuti verba performatif dalam teks hukum atau administrasi, dan rumusan dimulai dengan huruf kapital.", vi: "Đứng sau động từ ngôn hành trong văn bản pháp lý hoặc hành chính, và công thức bắt đầu bằng chữ hoa." }
            ex: [{ term: CERTIFICA }, { target: ":" }, " Que la alumna Ana Ruiz ha aprobado el curso."]
            tr: { en: "CERTIFIES: That the student Ana Ruiz has passed the course.", uk: "ЗАСВІДЧУЄ: Що студентка Ана Руїс успішно завершила курс.", pt: "CERTIFICA: Que a aluna Ana Ruiz foi aprovada no curso.", fr: "CERTIFIE : Que l’étudiante Ana Ruiz a réussi le cours.", de: "BESCHEINIGT: Dass die Studentin Ana Ruiz den Kurs bestanden hat.", it: "CERTIFICA: Che la studentessa Ana Ruiz ha superato il corso.", pl: "ZAŚWIADCZA: Że uczennica Ana Ruiz ukończyła kurs.", tr: "BELGELER: Öğrenci Ana Ruiz kursu başarıyla tamamlamıştır.", id: "MENERANGKAN: Bahwa siswi Ana Ruiz telah lulus kursus.", vi: "CHỨNG NHẬN: Học viên Ana Ruiz đã hoàn thành khóa học." }
          - level: C2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Introducen la causa de lo dicho.", en: "It introduces the cause of what was said.", uk: "Вводить причину сказаного.", pt: "Introduzem a causa do que foi dito.", fr: "Introduisent la cause de ce qui précède.", de: "Er leitet die Ursache des Gesagten ein.", it: "Introducono la causa di quanto detto.", pl: "Wprowadza przyczynę wypowiedzi.", tr: "Söylenenin nedenini getirir.", id: "Memperkenalkan sebab dari hal yang disebutkan.", vi: "Dẫn nguyên nhân của điều vừa nói." }
            ex: ["No salimos", { target: ":" }, " llovía mucho."]
            tr: { en: "We did not go out: it was raining hard.", uk: "Ми не виходили з дому: йшов сильний дощ.", pt: "Não saímos: chovia muito.", fr: "Nous ne sommes pas sortis : il pleuvait beaucoup.", de: "Wir sind nicht ausgegangen: Es regnete stark.", it: "Non siamo usciti: pioveva molto.", pl: "Nie wyszliśmy z domu: mocno padało.", tr: "Dışarı çıkmadık: çok yağmur yağıyordu.", id: "Kami tidak keluar: hujan deras.", vi: "Chúng tôi không đi ra ngoài: trời mưa rất to." }
          - level: C2
            sign: { es: dos puntos, en: "colon", uk: "двокрапка", pt: "dois-pontos", fr: "deux-points", de: "Doppelpunkt", it: "due punti", pl: "dwukropek", tr: "iki nokta", id: "titik dua", vi: "dấu hai chấm" }
            use: { es: "Introducen la consecuencia o el resumen de lo dicho.", en: "It introduces the consequence or the summary of what was said.", uk: "Вводить наслідок або підсумок сказаного.", pt: "Introduzem a consequência ou o resumo do que foi dito.", fr: "Introduisent la conséquence ou le résumé de ce qui précède.", de: "Er leitet die Folge oder die Zusammenfassung des Gesagten ein.", it: "Introducono la conseguenza o il riassunto di quanto detto.", pl: "Wprowadza skutek lub podsumowanie wypowiedzi.", tr: "Söylenenin sonucunu veya özetini getirir.", id: "Memperkenalkan akibat atau ringkasan dari hal yang disebutkan.", vi: "Dẫn hệ quả hoặc phần tóm lược của điều vừa nói." }
            ex: ["Perdió el vuelo", { target: ":" }, " tuvo que dormir en el aeropuerto."]
            tr: { en: "He missed his flight: he had to sleep at the airport.", uk: "Він запізнився на рейс: довелося ночувати в аеропорту.", pt: "Perdeu o voo: teve de dormir no aeroporto.", fr: "Il a manqué son vol : il a dû dormir à l’aéroport.", de: "Er hat seinen Flug verpasst: Er musste am Flughafen schlafen.", it: "Ha perso il volo: ha dovuto dormire in aeroporto.", pl: "Spóźnił się na samolot: musiał spać na lotnisku.", tr: "Uçağı kaçırdı: havalimanında uyumak zorunda kaldı.", id: "Dia ketinggalan pesawat: dia harus tidur di bandara.", vi: "Anh ấy lỡ chuyến bay: anh ấy phải ngủ ở sân bay." }
          - level: B2
            sign: { es: punto y coma, en: "semicolon", uk: "крапка з комою", pt: "ponto e vírgula", fr: "point-virgule", de: "Semikolon", it: "punto e virgola", pl: "średnik", tr: "noktalı virgül", id: "titik koma", vi: "dấu chấm phẩy" }
            use: { es: "Separa dos oraciones paralelas cuando la segunda omite el verbo.", en: "It separates two parallel clauses when the second leaves out the verb.", uk: "Розділяє два паралельні речення, коли в другому пропущено дієслово.", pt: "Separa duas orações paralelas quando a segunda omite o verbo.", fr: "Sépare deux propositions parallèles quand la seconde sous-entend le verbe.", de: "Es trennt zwei parallele Sätze, wenn der zweite das Verb auslässt.", it: "Separa due frasi parallele quando la seconda omette il verbo.", pl: "Oddziela dwa równoległe zdania, gdy w drugim pominięto czasownik.", tr: "İkincisinde fiil düştüğünde iki paralel cümleyi ayırır.", id: "Memisahkan dua kalimat sejajar ketika kalimat kedua menghilangkan verba.", vi: "Ngăn hai câu song song khi câu thứ hai lược động từ." }
            ex: ["Ana es abogada", { target: ";" }, " Luis, ingeniero."]
            tr: { en: "Ana is a lawyer; Luis, an engineer.", uk: "Ана — адвокатка; Луїс — інженер.", pt: "Ana é advogada; Luis, engenheiro.", fr: "Ana est avocate ; Luis, ingénieur.", de: "Ana ist Anwältin; Luis, Ingenieur.", it: "Ana è avvocata; Luis, ingegnere.", pl: "Ana jest adwokatką; Luis – inżynierem.", tr: "Ana avukat; Luis mühendis.", id: "Ana seorang pengacara; Luis, seorang insinyur.", vi: "Ana là luật sư; Luis, kỹ sư." }
          - level: B2
            sign: { es: punto y coma, en: "semicolon", uk: "крапка з комою", pt: "ponto e vírgula", fr: "point-virgule", de: "Semikolon", it: "punto e virgola", pl: "średnik", tr: "noktalı virgül", id: "titik koma", vi: "dấu chấm phẩy" }
            use: { es: "Separa oraciones que ya contienen comas.", en: "It separates clauses that already contain commas.", uk: "Розділяє речення, що вже містять коми.", pt: "Separa orações que já contêm vírgulas.", fr: "Sépare des propositions qui contiennent déjà des virgules.", de: "Es trennt Sätze, die schon Kommas enthalten.", it: "Separa frasi che contengono già virgole.", pl: "Oddziela zdania, które zawierają już przecinki.", tr: "İçinde zaten virgül bulunan cümleleri ayırır.", id: "Memisahkan kalimat yang sudah berisi koma.", vi: "Ngăn các câu đã có sẵn dấu phẩy." }
            ex: ["Mi tía, muy cansada, se sentó", { target: ";" }, " llevaba horas de pie."]
            tr: { en: "My aunt, very tired, sat down; she had been on her feet for hours.", uk: "Моя тітка, дуже втомлена, сіла; вона стояла на ногах кілька годин.", pt: "Minha tia, muito cansada, sentou-se; estava de pé havia horas.", fr: "Ma tante, très fatiguée, s’est assise ; elle était debout depuis des heures.", de: "Meine Tante, sehr müde, setzte sich; sie hatte stundenlang gestanden.", it: "Mia zia, molto stanca, si sedette; era in piedi da ore.", pl: "Moja ciotka, bardzo zmęczona, usiadła; stała na nogach od wielu godzin.", tr: "Teyzem, çok yorgun hâlde, oturdu; saatlerdir ayaktaydı.", id: "Bibi saya, yang sangat lelah, duduk; ia sudah berjam-jam berdiri.", vi: "Dì tôi, rất mệt, ngồi xuống; bà đã đứng hàng giờ." }
          - level: C1
            sign: { es: punto y coma, en: "semicolon", uk: "крапка з комою", pt: "ponto e vírgula", fr: "point-virgule", de: "Semikolon", it: "punto e virgola", pl: "średnik", tr: "noktalı virgül", id: "titik koma", vi: "dấu chấm phẩy" }
            use: { es: ["Precede a una oración larga que empieza con ", { term: pero }, ", ", { term: mas }, ", ", { term: aunque }, ", ", { term: sin embargo }, " o ", { term: por tanto }, "."], en: ["It comes before a long clause that begins with ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " or ", { term: "por tanto" }, "."], uk: ["Стоїть перед довгим реченням, що починається з ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " або ", { term: "por tanto" }, "."], pt: ["Precede uma oração longa que começa com ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " ou ", { term: "por tanto" }, "."], fr: ["Précède une proposition longue qui commence par ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " ou ", { term: "por tanto" }, "."], de: ["Es steht vor einem langen Satz, der mit ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " oder ", { term: "por tanto" }, " beginnt."], it: ["Precede una frase lunga che comincia con ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " o ", { term: "por tanto" }, "."], pl: ["Stoi przed długim zdaniem zaczynającym się od ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " lub ", { term: "por tanto" }, "."], tr: [{ term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " veya ", { term: "por tanto" }, " ile başlayan uzun bir cümleden önce gelir."], id: ["Mendahului kalimat panjang yang diawali ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, ", atau ", { term: "por tanto" }, "."], vi: ["Đứng trước một câu dài bắt đầu bằng ", { term: "pero" }, ", ", { term: "mas" }, ", ", { term: "aunque" }, ", ", { term: "sin embargo" }, " hoặc ", { term: "por tanto" }, "."] }
            ex: ["Trabajó todo el día en casa y en la oficina", { target: ";" }, " sin embargo, aceptó la invitación de inmediato."]
            tr: { en: "He worked all day at home and in the office; however, he accepted the invitation at once.", uk: "Він працював цілий день удома й в офісі; проте негайно прийняв запрошення.", pt: "Trabalhou o dia todo em casa e no escritório; no entanto, aceitou o convite de imediato.", fr: "Il a travaillé toute la journée chez lui et au bureau ; pourtant, il a accepté l’invitation tout de suite.", de: "Er arbeitete den ganzen Tag zu Hause und im Büro; trotzdem nahm er die Einladung sofort an.", it: "Ha lavorato tutto il giorno a casa e in ufficio; tuttavia ha accettato subito l'invito.", pl: "Pracował cały dzień w domu i w biurze; mimo to od razu przyjął zaproszenie.", tr: "Bütün gün evde ve ofiste çalıştı; yine de daveti hemen kabul etti.", id: "Dia bekerja sepanjang hari di rumah dan di kantor; meskipun begitu, dia langsung menerima undangan itu.", vi: "Anh ấy làm việc cả ngày ở nhà và ở văn phòng; tuy nhiên, anh ấy nhận lời mời ngay lập tức." }

  - title: { es: "Puntos suspensivos, paréntesis y corchetes", en: "Ellipsis, parentheses and square brackets", uk: "Три крапки, круглі й квадратні дужки", pt: "Reticências, parênteses e colchetes", fr: "Points de suspension, parenthèses et crochets", de: "Auslassungspunkte, runde und eckige Klammern", it: "Puntini di sospensione, parentesi tonde e quadre", pl: "Wielokropek, nawiasy okrągłe i kwadratowe", tr: "Üç nokta, parantez ve köşeli parantez", id: "Tanda elipsis, tanda kurung, dan tanda kurung siku", vi: "Dấu ba chấm, dấu ngoặc đơn và dấu ngoặc vuông" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo, en: "Mark", uk: "Знак", pt: "Sinal", fr: "Signe", de: "Zeichen", it: "Segno", pl: "Znak", tr: "İşaret", id: "Tanda", vi: "Dấu" } }
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            sign: { es: puntos suspensivos, en: "ellipsis", uk: "три крапки", pt: "reticências", fr: "points de suspension", de: "Auslassungspunkte", it: "puntini di sospensione", pl: "wielokropek", tr: "üç nokta", id: "tanda elipsis", vi: "dấu ba chấm" }
            use: { es: "Dejan sin acabar una oración o una cita.", en: "It leaves a sentence or a quotation unfinished.", uk: "Залишають речення чи цитату незакінченими.", pt: "Deixam sem terminar uma frase ou uma citação.", fr: "Laissent inachevée une phrase ou une citation.", de: "Sie lassen einen Satz oder ein Zitat unvollendet.", it: "Lasciano incompiuta una frase o una citazione.", pl: "Zostawia zdanie lub cytat niedokończone.", tr: "Bir cümleyi veya alıntıyı yarım bırakır.", id: "Membiarkan kalimat atau kutipan tak selesai.", vi: "Để một câu hoặc một trích dẫn bỏ dở." }
            ex: ["Si hubiera llegado antes", { target: "..." }]
            tr: { en: "If I had arrived earlier...", uk: "Якби я приїхав раніше...", pt: "Se eu tivesse chegado antes...", fr: "Si j’étais arrivé plus tôt...", de: "Wenn ich früher gekommen wäre...", it: "Se fossi arrivato prima...", pl: "Gdybym przyjechał wcześniej...", tr: "Daha erken gelseydim...", id: "Seandainya saya datang lebih awal...", vi: "Nếu tôi đến sớm hơn..." }
          - level: B2
            sign: { es: puntos suspensivos, en: "ellipsis", uk: "три крапки", pt: "reticências", fr: "points de suspension", de: "Auslassungspunkte", it: "puntini di sospensione", pl: "wielokropek", tr: "üç nokta", id: "tanda elipsis", vi: "dấu ba chấm" }
            use: { es: "Entre corchetes, señalan lo que se omite en una cita.", en: "Inside square brackets, it shows what is left out of a quotation.", uk: "У квадратних дужках позначають те, що пропущено в цитаті.", pt: "Entre colchetes, indicam o que se omite em uma citação.", fr: "Entre crochets, signalent ce qui est omis dans une citation.", de: "In eckigen Klammern zeigen sie an, was in einem Zitat ausgelassen wird.", it: "Tra parentesi quadre, segnalano ciò che si omette in una citazione.", pl: "W nawiasach kwadratowych oznacza to, co pominięto w cytacie.", tr: "Köşeli parantez içinde, alıntıda atlanan kısmı gösterir.", id: "Di dalam tanda kurung siku, menandai bagian yang dilewatkan dalam kutipan.", vi: "Đặt trong dấu ngoặc vuông, chỉ phần bị lược bỏ trong một trích dẫn." }
            ex: ["El texto dice: «Los alumnos entregarán el trabajo ", { target: "[...]" }, " antes del viernes»."]
            tr: { en: "The text says: ‘The students will hand in the work [...] before Friday.’", uk: "У тексті сказано: «Учні здадуть роботу [...] до п’ятниці».", pt: "O texto diz: “Os alunos entregarão o trabalho [...] antes de sexta-feira”.", fr: "Le texte dit : « Les élèves remettront le travail [...] avant vendredi ».", de: "Im Text heißt es: „Die Schüler geben die Arbeit [...] vor Freitag ab.“", it: "Il testo dice: «Gli alunni consegneranno il lavoro [...] prima di venerdì».", pl: "W tekście czytamy: „Uczniowie oddadzą pracę [...] przed piątkiem”.", tr: "Metinde şöyle yazıyor: “Öğrenciler ödevi [...] Cuma gününden önce teslim edecek.”", id: "Teks itu berbunyi: “Para siswa akan menyerahkan tugas [...] sebelum hari Jumat.”", vi: "Văn bản nói: “Học sinh sẽ nộp bài [...] trước thứ Sáu”." }
          - level: B2
            sign: { es: puntos suspensivos, en: "ellipsis", uk: "три крапки", pt: "reticências", fr: "points de suspension", de: "Auslassungspunkte", it: "puntini di sospensione", pl: "wielokropek", tr: "üç nokta", id: "tanda elipsis", vi: "dấu ba chấm" }
            use: { es: "Se combinan con otros signos: el signo de cierre va tras los tres puntos.", en: "It combines with other marks: the closing mark goes after the three dots.", uk: "Поєднуються з іншими знаками: закривальний знак стоїть після трьох крапок.", pt: "Combinam-se com outros sinais: o sinal de fechamento vem depois dos três pontos.", fr: "Se combinent avec d’autres signes : le signe de fermeture suit les trois points.", de: "Sie lassen sich mit anderen Zeichen verbinden: Das schließende Zeichen steht nach den drei Punkten.", it: "Si combinano con altri segni: il segno di chiusura va dopo i tre puntini.", pl: "Łączą się z innymi znakami: znak zamykający stoi po trzech kropkach.", tr: "Başka işaretlerle birleşir: kapatan işaret üç noktadan sonra gelir.", id: "Dipadukan dengan tanda lain: tanda penutup diletakkan setelah ketiga titik.", vi: "Kết hợp với các dấu khác: dấu đóng đặt sau ba dấu chấm." }
            ex: { examples: [["¿Y si no viene", { target: "..." }, "?"], ["¡Es que eres un", { target: "..." }, "!"]] }
            tr: { en: { examples: ["And what if he does not come...?", "It is just that you are such a...!"] }, uk: { examples: ["А що, як він не прийде...?", "Ну ти й...!"] }, pt: { examples: ["E se ele não vier...?", "É que você é um...!"] }, fr: { examples: ["Et s’il ne vient pas... ?", "C’est que tu es un... !"] }, de: { examples: ["Und wenn er nicht kommt...?", "Du bist ja ein...!"] }, it: { examples: ["E se non viene...?", "Ma sei un...!"] }, pl: { examples: ["A jeśli nie przyjdzie...?", "Ale z ciebie...!"] }, tr: { examples: ["Ya gelmezse...?", "Sen tam bir...!"] }, id: { examples: ["Bagaimana kalau dia tidak datang...?", "Kamu itu benar-benar...!"] }, vi: { examples: ["Lỡ anh ấy không đến thì sao...?", "Bạn đúng là một...!"] } }
          - level: B2
            sign: { es: paréntesis, en: "parentheses", uk: "круглі дужки", pt: "parênteses", fr: "parenthèses", de: "runde Klammern", it: "parentesi tonde", pl: "nawiasy okrągłe", tr: "parantez", id: "tanda kurung", vi: "dấu ngoặc đơn" }
            use: { es: "Muestran las dos formas, masculina y femenina, de una palabra.", en: "They show both forms of a word, masculine and feminine.", uk: "Показують обидві форми слова — чоловічу й жіночу.", pt: "Mostram as duas formas de uma palavra, masculina e feminina.", fr: "Montrent les deux formes d’un mot, masculine et féminine.", de: "Sie zeigen beide Formen eines Wortes, die männliche und die weibliche.", it: "Mostrano le due forme di una parola, maschile e femminile.", pl: "Pokazują obie formy wyrazu: męską i żeńską.", tr: "Bir sözcüğün eril ve dişil iki biçimini gösterir.", id: "Menunjukkan kedua bentuk sebuah kata, maskulin dan feminin.", vi: "Cho thấy hai dạng của một từ, giống đực và giống cái." }
            ex: ["Apreciado", { target: { optional: a } }, " vecino", { target: { optional: a } }, ":"]
            tr: { en: "Dear neighbour,", uk: "Шановний(-а) сусіде(-ко)!", pt: "Prezado(a) vizinho(a):", fr: "Cher(ère) voisin(e),", de: "Liebe(r) Nachbar(in),", it: "Caro(a) vicino(a),", pl: "Szanowny(-a) Sąsiedzie(-ko)!", tr: "Sayın komşumuz,", id: "Tetangga yang terhormat,", vi: "Kính gửi hàng xóm," }
          - level: B2
            sign: { es: paréntesis, en: "parentheses", uk: "круглі дужки", pt: "parênteses", fr: "parenthèses", de: "runde Klammern", it: "parentesi tonde", pl: "nawiasy okrągłe", tr: "parantez", id: "tanda kurung", vi: "dấu ngoặc đơn" }
            use: { es: "Encierran un signo de interrogación o de exclamación que expresa duda o ironía.", en: "They enclose a question mark or an exclamation mark that expresses doubt or irony.", uk: "Охоплюють знак питання або знак оклику, що виражає сумнів чи іронію.", pt: "Encerram um ponto de interrogação ou de exclamação que expressa dúvida ou ironia.", fr: "Encadrent un point d’interrogation ou d’exclamation qui exprime le doute ou l’ironie.", de: "Sie schließen ein Frage- oder Ausrufezeichen ein, das Zweifel oder Ironie ausdrückt.", it: "Racchiudono un punto interrogativo o esclamativo che esprime dubbio o ironia.", pl: "Obejmują znak zapytania lub wykrzyknik, który wyraża wątpliwość albo ironię.", tr: "Kuşku veya ironi bildiren bir soru ya da ünlem işaretini çevreler.", id: "Mengapit tanda tanya atau tanda seru yang menyatakan keraguan atau ironi.", vi: "Bao quanh dấu hỏi hoặc dấu chấm than diễn đạt sự nghi ngờ hay mỉa mai." }
            ex: { examples: [["Dice que es el más trabajador ", { target: { optional: "?" } }, " del grupo."], ["Ganó el premio por sus méritos ", { target: { optional: "!" } }, "."]] }
            tr: { en: { examples: ["He says he is the hardest worker (?) in the group.", "He won the prize on his merits (!)."] }, uk: { examples: ["Він каже, що найпрацьовитіший (?) у групі.", "Він виграв приз за заслугами (!)."] }, pt: { examples: ["Ele diz que é o mais trabalhador (?) do grupo.", "Ganhou o prêmio por seus méritos (!)."] }, fr: { examples: ["Il dit qu’il est le plus travailleur (?) du groupe.", "Il a gagné le prix grâce à ses mérites (!)."] }, de: { examples: ["Er sagt, er sei der Fleißigste (?) der Gruppe.", "Er gewann den Preis aufgrund seiner Verdienste (!)."] }, it: { examples: ["Dice di essere il più laborioso (?) del gruppo.", "Ha vinto il premio per i suoi meriti (!)."] }, pl: { examples: ["Mówi, że jest najpracowitszy (?) w grupie.", "Wygrał nagrodę dzięki swoim zasługom (!)."] }, tr: { examples: ["Grubun en çalışkanı (?) olduğunu söylüyor.", "Ödülü hak ederek (!) kazandı."] }, id: { examples: ["Dia bilang dia yang paling rajin (?) di kelompok itu.", "Dia memenangkan hadiah itu karena jasanya (!)."] }, vi: { examples: ["Anh ấy nói mình là người chăm chỉ nhất (?) nhóm.", "Anh ấy giành giải nhờ công trạng của mình (!)."] } }
          - level: C1
            sign: { es: paréntesis, en: "parentheses", uk: "круглі дужки", pt: "parênteses", fr: "parenthèses", de: "runde Klammern", it: "parentesi tonde", pl: "nawiasy okrągłe", tr: "parantez", id: "tanda kurung", vi: "dấu ngoặc đơn" }
            use: { es: "Encierran las acotaciones de una obra de teatro.", en: "They enclose the stage directions of a play.", uk: "Охоплюють ремарки п’єси.", pt: "Encerram as rubricas de uma peça de teatro.", fr: "Encadrent les didascalies d’une pièce de théâtre.", de: "Sie schließen die Regieanweisungen eines Theaterstücks ein.", it: "Racchiudono le didascalie di un'opera teatrale.", pl: "Obejmują didaskalia sztuki teatralnej.", tr: "Bir tiyatro oyununun sahne yönergelerini çevreler.", id: "Mengapit petunjuk panggung dalam naskah drama.", vi: "Bao quanh các chỉ dẫn sân khấu của một vở kịch." }
            ex: ["MARTA. Entra, por favor. ", { target: { optional: "Abre la puerta." } }]
            tr: { en: "MARTA. Come in, please. (She opens the door.)", uk: "МАРТА. Заходьте, будь ласка. (Відчиняє двері.)", pt: "MARTA. Entre, por favor. (Abre a porta.)", fr: "MARTA. Entre, s’il te plaît. (Elle ouvre la porte.)", de: "MARTA. Komm herein, bitte. (Sie öffnet die Tür.)", it: "MARTA. Entra, per favore. (Apre la porta.)", pl: "MARTA. Wejdź, proszę. (Otwiera drzwi.)", tr: "MARTA. Lütfen gir. (Kapıyı açar.)", id: "MARTA. Masuklah, silakan. (Membuka pintu.)", vi: "MARTA. Mời vào. (Mở cửa.)" }
          - level: C1
            sign: { es: corchetes, en: "square brackets", uk: "квадратні дужки", pt: "colchetes", fr: "crochets", de: "eckige Klammern", it: "parentesi quadre", pl: "nawiasy kwadratowe", tr: "köşeli parantez", id: "tanda kurung siku", vi: "dấu ngoặc vuông" }
            use: { es: "Encierran un dato dentro de un paréntesis.", en: "They enclose a detail inside parentheses.", uk: "Охоплюють уточнення всередині круглих дужок.", pt: "Encerram um dado dentro de parênteses.", fr: "Encadrent une précision à l’intérieur de parenthèses.", de: "Sie schließen eine Angabe innerhalb runder Klammern ein.", it: "Racchiudono un dato dentro parentesi tonde.", pl: "Obejmują informację wewnątrz nawiasu okrągłego.", tr: "Parantez içindeki bir bilgiyi çevreler.", id: "Mengapit sebuah keterangan di dalam tanda kurung.", vi: "Bao quanh một thông tin nằm trong dấu ngoặc đơn." }
            ex: ["La autora publicó varios libros ", { optional: ["por ejemplo, Lluvia ", { target: "[2004]" }] }, "."]
            tr: { en: "The author published several books (for example, Lluvia [2004]).", uk: "Авторка опублікувала кілька книжок (наприклад, Lluvia [2004]).", pt: "A autora publicou vários livros (por exemplo, Lluvia [2004]).", fr: "L’autrice a publié plusieurs livres (par exemple, Lluvia [2004]).", de: "Die Autorin hat mehrere Bücher veröffentlicht (zum Beispiel Lluvia [2004]).", it: "L'autrice ha pubblicato vari libri (per esempio, Lluvia [2004]).", pl: "Autorka opublikowała kilka książek (na przykład Lluvia [2004]).", tr: "Yazar birkaç kitap yayımladı (örneğin Lluvia [2004]).", id: "Penulis itu menerbitkan beberapa buku (misalnya, Lluvia [2004]).", vi: "Tác giả đã xuất bản nhiều cuốn sách (ví dụ, Lluvia [2004])." }

  - title: { es: "Comillas, guion y raya", en: "Quotation marks, hyphen and dash", uk: "Лапки, дефіс і тире", pt: "Aspas, hífen e travessão", fr: "Guillemets, trait d’union et tiret", de: "Anführungszeichen, Bindestrich und Gedankenstrich", it: "Virgolette, trattino e lineetta", pl: "Cudzysłów, łącznik i myślnik", tr: "Tırnak işareti, kısa çizgi ve tire", id: "Tanda petik, tanda hubung, dan tanda pisah", vi: "Dấu ngoặc kép, dấu gạch nối và dấu gạch ngang" }
    role: own
