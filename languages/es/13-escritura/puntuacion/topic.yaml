            tr: { en: "Lima, 10 May 2026", uk: "Ліма, 10 травня 2026 року", pt: "Lima, 10 de maio de 2026", fr: "Lima, le 10 mai 2026", de: "Lima, den 10. Mai 2026", it: "Lima, 10 maggio 2026", pl: "Lima, 10 maja 2026 roku", tr: "Lima, 10 Mayıs 2026", id: "Lima, 10 Mei 2026", vi: "Lima, ngày 10 tháng 5 năm 2026" }
