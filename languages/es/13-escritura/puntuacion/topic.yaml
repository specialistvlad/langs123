            use: { es: "Separa el número y el año en la cita de una ley o de un decreto.", en: "It separates the number and the year in the citation of a law or a decree.", uk: "Відокремлює номер і рік у посиланні на закон чи указ.", pt: "Separa o número e o ano na citação de uma lei ou de um decreto.", fr: "Sépare le numéro et l’année dans la citation d’une loi ou d’un décret.", de: "Er trennt Nummer und Jahr in der Angabe eines Gesetzes oder einer Verordnung.", it: "Separa il numero e l'anno nella citazione di una legge o di un decreto.", pl: "Oddziela numer od roku w powołaniu na ustawę lub dekret.", tr: "Bir kanunun veya kararnamenin anıldığı yerde numarayı ve yılı ayırır.", id: "Memisahkan nomor dan tahun dalam rujukan undang-undang atau dekret.", vi: "Ngăn số và năm khi dẫn một đạo luật hoặc một sắc lệnh." }
