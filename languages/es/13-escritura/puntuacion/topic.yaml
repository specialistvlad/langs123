            sign: { es: "corchetes y llaves", en: "square brackets and curly brackets", uk: "квадратні й фігурні дужки", pt: "colchetes e chaves", fr: "crochets et accolades", de: "eckige und geschweifte Klammern", it: "parentesi quadre e graffe", pl: "nawiasy kwadratowe i klamrowe", tr: "köşeli parantez ve küme parantezi", id: "tanda kurung siku dan kurung kurawal", vi: "dấu ngoặc vuông và dấu ngoặc nhọn" }
            use: { es: "En una operación matemática, los corchetes encierran los paréntesis y las llaves encierran los corchetes.", en: "In a mathematical operation, square brackets enclose the parentheses and curly brackets enclose the square brackets.", uk: "У математичному виразі квадратні дужки охоплюють круглі, а фігурні охоплюють квадратні.", pt: "Em uma operação matemática, os colchetes encerram os parênteses e as chaves encerram os colchetes.", fr: "Dans une opération mathématique, les crochets encadrent les parenthèses et les accolades encadrent les crochets.", de: "In einer Rechenaufgabe schließen eckige Klammern die runden ein, und geschweifte Klammern schließen die eckigen ein.", it: "In un'operazione matematica, le parentesi quadre racchiudono le tonde e le graffe racchiudono le quadre.", pl: "W działaniu matematycznym nawiasy kwadratowe obejmują okrągłe, a klamrowe obejmują kwadratowe.", tr: "Matematiksel bir işlemde köşeli parantezler parantezleri, küme parantezleri de köşeli parantezleri çevreler.", id: "Dalam operasi matematika, kurung siku mengapit tanda kurung, dan kurung kurawal mengapit kurung siku.", vi: "Trong một phép tính, dấu ngoặc vuông bao quanh dấu ngoặc đơn, và dấu ngoặc nhọn bao quanh dấu ngoặc vuông." }
            ex: { target: ["{3 + [4 × ", { optional: "5 − 1" }, "]}"] }
