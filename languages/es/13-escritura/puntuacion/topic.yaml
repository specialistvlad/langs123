            use: { es: "Un corchete de apertura antecede a la parte de un verso que sigue en la línea siguiente.", en: "An opening bracket goes before the part of a line of verse that continues on the next line.", uk: "Відкривна квадратна дужка стоїть перед частиною рядка вірша, що продовжується в наступному рядку.", pt: "Um colchete de abertura antecede a parte de um verso que continua na linha seguinte.", fr: "Un crochet ouvrant précède la partie d’un vers qui se poursuit à la ligne suivante.", de: "Eine öffnende eckige Klammer steht vor dem Teil eines Verses, der in der nächsten Zeile weitergeht.", it: "Una parentesi quadra di apertura precede la parte di un verso che continua nella riga seguente.", pl: "Otwierający nawias kwadratowy stoi przed częścią wersu, która biegnie dalej w następnym wierszu.", tr: "Açılış köşeli parantezi, bir dizenin sonraki satırda devam eden kısmının önüne gelir.", id: "Tanda kurung siku pembuka mendahului bagian baris puisi yang berlanjut pada baris berikutnya.", vi: "Dấu ngoặc vuông mở đứng trước phần của một dòng thơ tiếp tục ở dòng sau." }
