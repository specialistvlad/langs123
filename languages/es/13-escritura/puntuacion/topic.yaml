# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.escritura.puntuacion
lang: es
kind: foundations
tags: [punctuation, writing, commas, colons, quotation-marks, dashes]
concepts: [punctuation]
related: [es.fundamentos.alfabeto-ortografia, es.oracion.relativas]
status: { es: draft }

title: { es: La puntuación, en: Punctuation }
summary:
  lead:
    es: "Los signos de puntuación dividen el texto y muestran cómo se relacionan sus partes: el punto, la coma, los dos puntos, las comillas y la raya."
  rule:
    es: "Una oración de relativo explicativa va entre dos comas:"
  ex: ["Mi vecina", { target: "," }, " que es médica", { target: "," }, " me ayudó."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto } }
        - { key: rule, label: { es: Regla } }
        - { key: ex, label: { es: Ejemplo } }
      rows:
        - level: B2
          point: { es: Punto }
          rule: { es: "el punto y aparte cierra un párrafo, que se abre con sangría" }
          ex: ["Aquí termina el primer tema", { target: "." }]
        - level: B2
          point: { es: Coma }
          rule: { es: "dos comas encierran un inciso, una aclaración o una relativa explicativa" }
          ex: ["El viaje", { target: "," }, " dice Marta", { target: "," }, " será largo."]
        - level: B2
          point: { es: Dos puntos }
          rule: { es: "anuncian una lista o una cita; cierran una enumeración" }
          ex: { examples: [["El curso tiene tres partes", { target: ":" }, " gramática, escritura y lectura."], ["Pan, queso, aceitunas", { target: ":" }, " eso era toda la cena."]] }
        - level: B2
          point: { es: Punto y coma }
          rule: { es: "separa oraciones con comas y oraciones con el verbo omitido" }
          ex: { examples: [["Mi tía, muy cansada, se sentó", { target: ";" }, " llevaba horas de pie."], ["Ana es abogada", { target: ";" }, " Luis, ingeniero."]] }
        - level: B2
          point: { es: Puntos suspensivos }
          rule: { es: ["dejan una frase sin acabar; ", { term: "[...]" }, " marca una omisión en una cita"] }
          ex: ["Si hubiera llegado antes", { target: "..." }]
        - level: B2
          point: { es: Comillas y raya }
          rule: { es: "las comillas se anidan en el orden « », “ ”, ‘ ’; la raya encierra incisos y abre diálogos" }
          ex: { examples: [["Luis dijo: ", { target: "«Ana gritó “¡Gol!”»" }, "."], ["El cambio ", { target: "—que llegó rápido—" }, " nos sorprendió."]] }
        - level: C1
          point: { es: Coma }
          rule: { es: "la subordinada adelantada termina en coma" }
          ex: ["Si tuviera tiempo", { target: "," }, " te ayudaría."]
        - level: C1
          point: { es: Dos puntos y punto y coma }
          rule: { es: ["los dos puntos explican; el punto y coma precede a ", { term: "sin embargo" }] }
          ex: { examples: [["La paella es valenciana", { target: ":" }, " lleva arroz y azafrán."], ["Trabajó todo el día", { target: ";" }, " sin embargo, aceptó salir."]] }
        - level: C1
          point: { es: Otros signos }
          rule: { es: "el asterisco antecede a la forma incorrecta; el punto sigue al número de nota" }
          ex: { contrast: [[{ target: "*" }, "Me alegro que hayas ido."], "Me alegro de que hayas ido."] }
        - level: C2
          point: { es: Dos puntos }
          rule: { es: "introducen la causa o la consecuencia de lo dicho" }
          ex: { examples: [["No salimos", { target: ":" }, " llovía mucho."], ["Perdió el vuelo", { target: ":" }, " durmió en el aeropuerto."]] }
        - level: C2
          point: { es: Otros signos }
          rule: { es: "la barra encierra fonemas y separa versos; el apóstrofo va en apellidos extranjeros" }
          ex: { examples: [["El fonema ", { target: { ipa: t } }, " es dental."], ["Bernardo ", { target: "O’Higgins" }]] }
        - level: B2
          point: { es: Trampa }
          rule: { es: "los títulos y la línea de lugar y fecha de una carta no terminan en punto" }
          ex: { target: ["Lima, ", { date: "10 de mayo de 2026", value: "2026-05-10" }] }

sections:
  - title: { es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Los signos de puntuación dividen el texto y muestran cómo se relacionan sus partes."
            ex: ["Llegamos tarde", { target: ";" }, " sin embargo", { target: "," }, " vimos la película."]
          - type: note
            level: B2
            text:
              es: ["Los signos de apertura ", { letter: "¿" }, " y ", { letter: "¡" }, ": ", { link: El alfabeto y la ortografía, to: es.fundamentos.alfabeto-ortografia }, "."]
          - type: note
            level: B2
            text:
              es: ["La relativa explicativa: ", { link: Las oraciones de relativo, to: es.oracion.relativas }, "."]

  - title: { es: El punto }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            use: { es: ["El ", { term: punto y aparte }, " cierra un párrafo; el párrafo siguiente empieza en otra línea, con sangría."] }
            ex: ["Con esto termina el primer tema", { target: "." }]
          - level: B2
            use: { es: "La línea de lugar y fecha de una carta termina sin punto." }
            ex: { target: ["Lima, ", { date: "10 de mayo de 2026", value: "2026-05-10" }] }
          - level: B2
            use: { es: "Un titular, un título y el encabezado de un capítulo terminan sin punto." }
            ex: { examples: [{ target: "La selección gana el torneo" }, { target: "Cien años de soledad" }] }
          - level: C2
            use: { es: "El punto va antes de la letra volada de una abreviatura." }
            ex: { examples: [["Saluda a ", { target: "D.ª" }, " Marta."], ["Vivo en el ", { target: "2.º" }, " piso."]] }

  - title: { es: La coma }
    role: own
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            use: { es: "Un inciso que indica quién habla va entre dos comas." }
            ex: ["El viaje", { target: "," }, " dice Marta", { target: "," }, " será largo."]
          - level: B2
            use: { es: ["Una aclaración con ", { term: es decir }, " lleva una coma antes y otra después."] }
            ex: ["Vive cerca", { target: "," }, " es decir", { target: "," }, " a diez minutos a pie."]
          - level: B2
            use: { es: "Un comentario del hablante va entre dos comas." }
            ex: ["El agua", { target: "," }, " como todos sabemos", { target: "," }, " es vital."]
          - level: B2
            use: { es: "Un adverbio que modifica toda la oración va seguido de coma." }
            ex: ["Lamentablemente", { target: "," }, " el tren ya salió."]
          - level: B2
            use: { es: "Una oración de relativo explicativa va entre dos comas." }
            ex: ["Mi abuela", { target: "," }, " que vive en Cali", { target: "," }, " nos visita hoy."]
          - level: B2
            use: { es: "La coma ocupa el lugar de un verbo omitido." }
            ex: ["Mi casa es antigua; la de Luis", { target: "," }, " moderna."]
          - level: B2
            use: { es: "El apellido escrito antes del nombre va seguido de coma." }
            ex: { examples: [["Rivera", { target: "," }, " Diego"], ["Kahlo", { target: "," }, " Frida"]] }
          - level: C1
            use: { es: "Las comas entre las alternativas de una pregunta disyuntiva la enfatizan." }
            ex: ["¿Cenas con nosotros", { target: "," }, " te quedas en casa", { target: "," }, " o tienes otro plan?"]
          - level: C1
            use: { es: ["Una coma delante de ", { term: y }, " separa una oración que no forma parte de la serie anterior."] }
            ex: ["Compramos pan y leche", { target: "," }, " y luego volvimos a casa."]
          - level: C1
            use: { es: "La subordinada que abre la oración termina en coma." }
            ex: { examples: [["Si tuviera tiempo", { target: "," }, " te ayudaría."], ["Como llovía", { target: "," }, " nos quedamos en casa."], ["Para que lo sepas", { target: "," }, " lo hice yo."]] }
          - level: C1
            use: { es: "La subordinada que sigue a la oración principal se une a ella sin coma." }
            ex: ["Te ayudaría ", { target: si tuviera tiempo }, "."]
          - level: C2
            use: { es: "Una construcción absoluta se separa con coma del resto de la oración." }
            ex: { examples: [["Terminada la clase", { target: "," }, " salimos al patio."], ["Sabiendo la hora", { target: "," }, " se levantó."]] }

  - title: { es: Los dos puntos y el punto y coma }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo } }
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            sign: { es: dos puntos }
            use: { es: "Anuncian un esquema o una lista." }
            ex: ["El curso tiene tres partes", { target: ":" }, " gramática, escritura y lectura."]
          - level: B2
            sign: { es: dos puntos }
            use: { es: "Anuncian una cita literaria." }
            ex: ["Machado escribió", { target: ":" }, " «Caminante, no hay camino, se hace camino al andar»."]
          - level: B2
            sign: { es: dos puntos }
            use: { es: "Cierran una enumeración ante el pronombre que la resume." }
            ex: ["Pan, queso, aceitunas", { target: ":" }, " eso era toda la cena."]
          - level: C1
            sign: { es: dos puntos }
            use: { es: "Marcan una pausa enfática ante lo que se va a decir." }
            ex: ["Ahora bien", { target: ":" }, " hay que decidir hoy."]
          - level: C1
            sign: { es: dos puntos }
            use: { es: "Introducen una explicación." }
            ex: ["La paella es un plato valenciano", { target: ":" }, " lleva arroz, pollo y verduras."]
          - level: C2
            sign: { es: dos puntos }
            use: { es: "Siguen al verbo performativo de un texto jurídico o administrativo, y la fórmula empieza con mayúscula." }
            ex: [{ term: CERTIFICA }, { target: ":" }, " Que la alumna Ana Ruiz ha aprobado el curso."]
          - level: C2
            sign: { es: dos puntos }
            use: { es: "Introducen la causa de lo dicho." }
            ex: ["No salimos", { target: ":" }, " llovía mucho."]
          - level: C2
            sign: { es: dos puntos }
            use: { es: "Introducen la consecuencia o el resumen de lo dicho." }
            ex: ["Perdió el vuelo", { target: ":" }, " tuvo que dormir en el aeropuerto."]
          - level: B2
            sign: { es: punto y coma }
            use: { es: "Separa dos oraciones paralelas cuando la segunda omite el verbo." }
            ex: ["Ana es abogada", { target: ";" }, " Luis, ingeniero."]
          - level: B2
            sign: { es: punto y coma }
            use: { es: "Separa oraciones que ya contienen comas." }
            ex: ["Mi tía, muy cansada, se sentó", { target: ";" }, " llevaba horas de pie."]
          - level: C1
            sign: { es: punto y coma }
            use: { es: ["Precede a una oración larga que empieza con ", { term: pero }, ", ", { term: mas }, ", ", { term: aunque }, ", ", { term: sin embargo }, " o ", { term: por tanto }, "."] }
            ex: ["Trabajó todo el día en casa y en la oficina", { target: ";" }, " sin embargo, aceptó la invitación de inmediato."]

  - title: { es: "Puntos suspensivos, paréntesis y corchetes" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo } }
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            sign: { es: puntos suspensivos }
            use: { es: "Dejan sin acabar una oración o una cita." }
            ex: ["Si hubiera llegado antes", { target: "..." }]
          - level: B2
            sign: { es: puntos suspensivos }
            use: { es: "Entre corchetes, señalan lo que se omite en una cita." }
            ex: ["El texto dice: «Los alumnos entregarán el trabajo ", { target: "[...]" }, " antes del viernes»."]
          - level: B2
            sign: { es: puntos suspensivos }
            use: { es: "Se combinan con otros signos: el signo de cierre va tras los tres puntos." }
            ex: { examples: [["¿Y si no viene", { target: "..." }, "?"], ["¡Es que eres un", { target: "..." }, "!"]] }
          - level: B2
            sign: { es: paréntesis }
            use: { es: "Muestran las dos formas, masculina y femenina, de una palabra." }
            ex: ["Apreciado", { target: { optional: a } }, " vecino", { target: { optional: a } }, ":"]
          - level: B2
            sign: { es: paréntesis }
            use: { es: "Encierran un signo de interrogación o de exclamación que expresa duda o ironía." }
            ex: { examples: [["Dice que es el más trabajador ", { target: { optional: "?" } }, " del grupo."], ["Ganó el premio por sus méritos ", { target: { optional: "!" } }, "."]] }
          - level: C1
            sign: { es: paréntesis }
            use: { es: "Encierran las acotaciones de una obra de teatro." }
            ex: ["MARTA. Entra, por favor. ", { target: { optional: "Abre la puerta." } }]
          - level: C1
            sign: { es: corchetes }
            use: { es: "Encierran un dato dentro de un paréntesis." }
            ex: ["La autora publicó varios libros ", { optional: ["por ejemplo, Lluvia ", { target: "[2004]" }] }, "."]

  - title: { es: "Comillas, guion y raya" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo } }
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            sign: { es: comillas }
            use: { es: "Se anidan en este orden: angulares « », inglesas “ ” y simples ‘ ’." }
            ex: ["Luis contó: ", { target: "«El profesor dijo: “Lean el poema ‘Otoño’ en casa”»" }, "."]
          - level: B2
            sign: { es: comillas }
            use: { es: "Encierran el título de un artículo o de una conferencia." }
            ex: ["Leí ", { target: "«La ciudad del futuro»" }, " en el periódico."]
          - level: B2
            sign: { es: comillas }
            use: { es: "Encierran el nombre de un barco, de un cine o de un restaurante." }
            ex: ["Cenamos en ", { target: "«La Parrilla»" }, "."]
          - level: B2
            sign: { es: guion }
            use: { es: "Une dos elementos que forman una relación o un compuesto." }
            ex: { examples: [["la relación ", { target: calidad-precio }], ["un acuerdo ", { target: hispano-francés }]] }
          - level: B2
            sign: { es: raya }
            use: { es: "Encierra un inciso y se escribe pegada a él." }
            ex: ["El cambio ", { target: "—que llegó muy rápido—" }, " nos sorprendió."]
          - level: B2
            sign: { es: raya }
            use: { es: "Abre cada intervención de un diálogo y la separa del comentario del narrador." }
            ex: [{ target: "—" }, "Mañana llego tarde ", { target: "—" }, "dijo Marta."]
          - level: C1
            sign: { es: comillas }
            use: { es: "Los signos de interrogación y de exclamación de la cita van dentro de las comillas." }
            ex: ["Y entonces dijo: ", { target: "«¡Qué susto me diste!»" }]
          - level: C1
            sign: { es: comillas }
            use: { es: "Encierran la palabra de la que se habla." }
            ex: ["El verbo ", { target: "«caber»" }, " es irregular."]
          - level: C1
            sign: { es: guion }
            use: { es: "El prefijo se une a su base sin guion." }
            ex: { examples: [["una crema ", { target: antiarrugas }], ["un líquido ", { target: anticongelante }]] }
          - level: C1
            sign: { es: raya }
            use: { es: "Tras la raya de cierre se escribe la coma, el punto, el punto y coma o los dos puntos de la oración." }
            ex: ["—Cuando lleguemos —dijo Marta—", { target: "," }, " te llamo."]
          - level: C2
            sign: { es: comillas }
            use: { es: "Marcan una palabra impropia, irónica o vulgar." }
            ex: { examples: [["Ese ", { target: "«experto»" }, " no sabe nada."], ["Mi tío llama ", { target: "«chamba»" }, " a su trabajo."]] }
          - level: C2
            sign: { es: comillas }
            use: { es: "Encierran un apodo entre el nombre y el apellido." }
            ex: ["Antonio ", { target: "«el Flaco»" }, " Soto ganó la carrera."]
          - level: C2
            sign: { es: guion }
            use: { es: "Señala un prefijo, un sufijo o una sílaba aislados." }
            ex: ["El prefijo ", { target: des- }, " y el sufijo ", { target: -ción }, " forman palabras nuevas."]

  - title: { es: Otros signos }
    role: own
    content:
      - type: usage
        columns:
          - { key: sign, label: { es: Signo } }
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: C1
            sign: { es: asterisco }
            use: { es: "Antecede a una forma incorrecta en un texto sobre la lengua." }
            ex: { contrast: [[{ target: "*" }, "Me alegro que hayas ido."], "Me alegro de que hayas ido."] }
          - level: C1
            sign: { es: número volado }
            use: { es: "El punto va después del número volado de una nota." }
            ex: ["Esta teoría aparece en su primer libro", { target: "¹." }]
          - level: C2
            sign: { es: barra }
            use: { es: "Separa el número y el año en la cita de una ley o de un decreto." }
            ex: ["Consulta el decreto ", { target: "5/2005" }, " en la oficina."]
          - level: C2
            sign: { es: barra }
            use: { es: "Separa los versos de una cita escrita en una sola línea." }
            ex: ["Volverán las oscuras golondrinas ", { target: "/" }, " en tu balcón sus nidos a colgar."]
          - level: C2
            sign: { es: barra }
            use: { es: "Encierra un fonema." }
            ex: ["El fonema ", { target: { ipa: t } }, " es dental."]
          - level: C2
            sign: { es: corchetes }
            use: { es: "Un corchete de apertura antecede a la parte de un verso que sigue en la línea siguiente." }
            ex: ["Las nubes cruzan el cielo, lentas, y ", { target: "[callan" }]
          - level: C2
            sign: { es: corchetes }
            use: { es: "Encierran una transcripción fonética." }
            ex: ["La palabra ", { term: casa }, " se pronuncia ", { target: "[ˈkasa]" }, "."]
          - level: C2
            sign: { es: "corchetes y llaves" }
            use: { es: "En una operación matemática, los corchetes encierran los paréntesis y las llaves encierran los corchetes." }
            ex: { target: ["{3 + [4 × ", { optional: "5 − 1" }, "]}"] }
          - level: C2
            sign: { es: llaves }
            use: { es: "Agrupan los elementos de un cuadro o de un esquema." }
            ex: ["Presente de ", { term: ser }, ": ", { target: "{soy, eres, es}" }]
          - level: C2
            sign: { es: diéresis }
            use: { es: "En poesía, deshace un diptongo para contar una sílaba más." }
            ex: ["El poeta escribe ", { target: süave }, " para ganar una sílaba."]
          - level: C2
            sign: { es: apóstrofo }
            use: { es: "Va en los apellidos de origen extranjero." }
            ex: ["Bernardo ", { target: "O’Higgins" }, " nació en Chile."]
          - level: C2
            sign: { es: apóstrofo }
            use: { es: "Marca la letra que falta en una contracción coloquial transcrita." }
            ex: ["¿", { target: "Pa’" }, " qué quieres eso?"]

  - title: { es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B2, wrong: "Mi vecina que es médica me ayudó.", right: ["Mi vecina", { target: "," }, " que es médica", { target: "," }, " me ayudó."], rule: { es: "la relativa explicativa va entre dos comas" } }
          - { level: B2, wrong: "Lamentablemente el tren ya salió.", right: ["Lamentablemente", { target: "," }, " el tren ya salió."], rule: { es: "un adverbio que modifica toda la oración va seguido de coma" } }
          - { level: B2, wrong: "Lima, 10 de mayo de 2026.", right: { target: ["Lima, ", { date: "10 de mayo de 2026", value: "2026-05-10" }] }, rule: { es: "la línea de lugar y fecha de una carta termina sin punto" } }
          - { level: B2, wrong: "Luis dijo: «Ana gritó «¡Gol!» en casa».", right: ["Luis dijo: «Ana gritó ", { target: "“¡Gol!”" }, " en casa»."], rule: { es: "dentro de las comillas angulares van las inglesas" } }
          - { level: C1, wrong: "Si tuviera tiempo te ayudaría.", right: ["Si tuviera tiempo", { target: "," }, " te ayudaría."], rule: { es: "la subordinada que abre la oración termina en coma" } }
          - { level: C1, wrong: "Una crema anti-arrugas.", right: ["Una crema ", { target: antiarrugas }, "."], rule: { es: "el prefijo se une a su base sin guion" } }
          - { level: C1, wrong: "—Cuando lleguemos —dijo Marta— te llamo.", right: ["—Cuando lleguemos —dijo Marta—", { target: "," }, " te llamo."], rule: { es: "tras la raya de cierre se escribe la coma de la oración" } }
          - { level: C2, wrong: "Saluda a Dª Marta.", right: ["Saluda a ", { target: "D.ª" }, " Marta."], rule: { es: "el punto va antes de la letra volada" } }
          - { level: C2, wrong: "Terminada la clase salimos al patio.", right: ["Terminada la clase", { target: "," }, " salimos al patio."], rule: { es: "una construcción absoluta se separa con coma" } }
