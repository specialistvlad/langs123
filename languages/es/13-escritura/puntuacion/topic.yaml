            use: { es: "Encierran un apodo entre el nombre y el apellido.", en: "They enclose a nickname between the first name and the surname.", uk: "Охоплюють прізвисько між іменем і прізвищем.", pt: "Encerram um apelido entre o nome e o sobrenome.", fr: "Encadrent un surnom placé entre le prénom et le nom.", de: "Sie schließen einen Spitznamen zwischen Vor- und Familienname ein.", it: "Racchiudono un soprannome tra il nome e il cognome.", pl: "Obejmują przydomek między imieniem a nazwiskiem.", tr: "Ad ile soyadı arasındaki lakabı çevreler.", id: "Mengapit nama julukan di antara nama depan dan nama keluarga.", vi: "Bao quanh biệt danh nằm giữa tên và họ." }
