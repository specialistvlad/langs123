          - { level: C1, wrong: "Una crema anti-arrugas.", right: ["Una crema ", { target: antiarrugas }, "."], rule: { es: "el prefijo se une a su base sin guion", en: "a prefix joins its base without a hyphen", uk: "префікс приєднується до основи без дефіса", pt: "o prefixo se une à sua base sem hífen", fr: "le préfixe se soude à sa base sans trait d’union", de: "das Präfix wird ohne Bindestrich mit seiner Basis verbunden", it: "il prefisso si unisce alla sua base senza trattino", pl: "przedrostek łączy się z podstawą bez łącznika", tr: "önek, tabanına kısa çizgi olmadan eklenir", id: "prefiks menyatu dengan kata dasarnya tanpa tanda hubung", vi: "tiền tố gắn vào gốc từ mà không có dấu gạch nối" } }
          - { level: C1, wrong: "—Cuando lleguemos —dijo Marta— te llamo.", right: ["—Cuando lleguemos —dijo Marta—", { target: "," }, " te llamo."], rule: { es: "tras la raya de cierre se escribe la coma de la oración", en: "the sentence's comma follows the closing dash", uk: "кома речення стоїть після закривального тире", pt: "depois do travessão de fechamento vem a vírgula da oração", fr: "la virgule de la phrase vient après le tiret de fermeture", de: "nach dem schließenden Gedankenstrich steht das Komma des Satzes", it: "dopo la lineetta di chiusura si scrive la virgola della frase", pl: "po myślniku zamykającym stawia się przecinek zdania", tr: "kapatan tireden sonra cümlenin virgülü yazılır", id: "setelah tanda pisah penutup ditulis koma milik kalimat", vi: "sau dấu gạch ngang đóng, ta viết dấu phẩy của câu" } }
