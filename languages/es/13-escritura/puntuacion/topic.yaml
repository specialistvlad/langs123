title: { es: La puntuación, en: Punctuation, uk: "Розділові знаки", pt: "A pontuação", fr: "La ponctuation", de: "Die Zeichensetzung", it: "La punteggiatura", pl: "Interpunkcja", tr: "Noktalama", id: "Tanda baca", vi: "Dấu câu" }
summary:
  lead:
    es: "Los signos de puntuación dividen el texto y muestran cómo se relacionan sus partes: el punto, la coma, los dos puntos, las comillas y la raya."
    en: "Punctuation marks divide a text and show how its parts relate: the full stop, comma, colon, quotation marks and dash."
    uk: "Розділові знаки членують текст і показують, як пов’язані його частини: крапка, кома, двокрапка, лапки й тире."
    pt: "Os sinais de pontuação dividem o texto e mostram como suas partes se relacionam: o ponto final, a vírgula, os dois-pontos, as aspas e o travessão."
    fr: "Les signes de ponctuation découpent le texte et montrent le lien entre ses parties : le point, la virgule, les deux-points, les guillemets et le tiret."
    de: "Satzzeichen gliedern den Text und zeigen, wie seine Teile zusammenhängen: Punkt, Komma, Doppelpunkt, Anführungszeichen und Gedankenstrich."
    it: "I segni di punteggiatura dividono il testo e mostrano come si legano le sue parti: il punto fermo, la virgola, i due punti, le virgolette e la lineetta."
    pl: "Znaki interpunkcyjne dzielą tekst i pokazują, jak łączą się jego części: kropka, przecinek, dwukropek, cudzysłów i myślnik."
    tr: "Noktalama işaretleri metni böler ve parçaların birbiriyle ilişkisini gösterir: nokta, virgül, iki nokta, tırnak işareti ve tire."
    id: "Tanda baca membagi teks dan menunjukkan hubungan antarbagiannya: titik, koma, titik dua, tanda petik, dan tanda pisah."
    vi: "Dấu câu chia văn bản và cho thấy các phần liên hệ với nhau thế nào: dấu chấm, dấu phẩy, dấu hai chấm, dấu ngoặc kép và dấu gạch ngang."
  rule:
    es: "Una oración de relativo explicativa va entre dos comas:"
    en: "A non-defining relative clause goes between two commas:"
    uk: "Пояснювальне означальне речення виділяється двома комами:"
    pt: "Uma oração relativa explicativa vai entre duas vírgulas:"
    fr: "Une relative explicative se place entre deux virgules :"
    de: "Ein appositiver Relativsatz steht zwischen zwei Kommas:"
    it: "Una relativa appositiva sta tra due virgole:"
    pl: "Zdanie względne wyjaśniające stoi między dwoma przecinkami:"
    tr: "Açıklayıcı ilgi cümlesi iki virgül arasına yazılır:"
    id: "Klausa relatif nonrestriktif diapit dua koma:"
    vi: "Mệnh đề quan hệ không xác định nằm giữa hai dấu phẩy:"
  ex: ["Mi vecina", { target: "," }, " que es médica", { target: "," }, " me ayudó."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: Punto, en: "Full stop", uk: "Крапка", pt: "Ponto final", fr: "Point", de: "Punkt", it: "Punto fermo", pl: "Kropka", tr: "Nokta", id: "Titik", vi: "Dấu chấm" }
          rule: { es: "el punto y aparte cierra un párrafo, que se abre con sangría", en: "a paragraph ends with a full stop; the next one opens with an indent", uk: "абзац закінчується крапкою, а наступний починається з відступу", pt: "o ponto final fecha um parágrafo; o seguinte abre com recuo", fr: "le point clôt un paragraphe ; le suivant s’ouvre par un retrait", de: "der Punkt schließt einen Absatz; der nächste beginnt mit Einrückung", it: "il punto fermo chiude un paragrafo; il successivo si apre con un rientro", pl: "kropka kończy akapit; następny zaczyna się wcięciem", tr: "nokta paragrafı bitirir; sonraki paragraf girintiyle başlar", id: "titik mengakhiri paragraf; paragraf berikutnya dimulai dengan inden", vi: "dấu chấm kết thúc một đoạn; đoạn sau mở đầu bằng thụt lề" }
          ex: ["Aquí termina el primer tema", { target: "." }]
          tr: { en: "The first topic ends here.", uk: "Тут закінчується перша тема.", pt: "Aqui termina o primeiro tema.", fr: "Ici se termine le premier thème.", de: "Hier endet das erste Thema.", it: "Qui finisce il primo argomento.", pl: "Tu kończy się pierwszy temat.", tr: "İlk konu burada biter.", id: "Di sini topik pertama berakhir.", vi: "Chủ đề thứ nhất kết thúc ở đây." }
        - level: B2
          point: { es: Coma, en: "Comma", uk: "Кома", pt: "Vírgula", fr: "Virgule", de: "Komma", it: "Virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
          rule: { es: "dos comas encierran un inciso, una aclaración o una relativa explicativa", en: "two commas enclose an aside, a clarification or a non-defining relative clause", uk: "дві коми виділяють вставну частину, уточнення або пояснювальне означальне речення", pt: "duas vírgulas isolam um inciso, um esclarecimento ou uma relativa explicativa", fr: "deux virgules encadrent une incise, une précision ou une relative explicative", de: "zwei Kommas schließen einen Einschub, eine Erläuterung oder einen appositiven Relativsatz ein", it: "due virgole racchiudono un inciso, una precisazione o una relativa appositiva", pl: "dwa przecinki obejmują wtrącenie, wyjaśnienie lub zdanie względne wyjaśniające", tr: "iki virgül bir ara sözü, bir açıklamayı veya açıklayıcı ilgi cümlesini çevreler", id: "dua koma mengapit sisipan, penjelasan, atau klausa relatif nonrestriktif", vi: "hai dấu phẩy bao quanh thành phần xen, lời giải thích hoặc mệnh đề quan hệ không xác định" }
          ex: ["El viaje", { target: "," }, " dice Marta", { target: "," }, " será largo."]
          tr: { en: "The journey, says Marta, will be long.", uk: "Подорож, каже Марта, буде довгою.", pt: "A viagem, diz Marta, será longa.", fr: "Le voyage, dit Marta, sera long.", de: "Die Reise, sagt Marta, wird lang.", it: "Il viaggio, dice Marta, sarà lungo.", pl: "Podróż, mówi Marta, będzie długa.", tr: "Yolculuk, diyor Marta, uzun olacak.", id: "Perjalanan itu, kata Marta, akan panjang.", vi: "Chuyến đi, Marta nói, sẽ dài." }
        - level: B2
          point: { es: Dos puntos, en: "Colon", uk: "Двокрапка", pt: "Dois-pontos", fr: "Deux-points", de: "Doppelpunkt", it: "Due punti", pl: "Dwukropek", tr: "İki nokta", id: "Titik dua", vi: "Dấu hai chấm" }
          rule: { es: "anuncian una lista o una cita; cierran una enumeración", en: "they introduce a list or a quotation; they close an enumeration", uk: "вводять перелік або цитату; завершують перелічення", pt: "anunciam uma lista ou uma citação; encerram uma enumeração", fr: "annoncent une liste ou une citation ; closent une énumération", de: "kündigen eine Aufzählung oder ein Zitat an; schließen eine Aufzählung ab", it: "annunciano un elenco o una citazione; chiudono un'enumerazione", pl: "zapowiadają wyliczenie lub cytat; zamykają wyliczenie", tr: "bir listeyi veya alıntıyı duyurur; bir sıralamayı kapatır", id: "mengantar daftar atau kutipan; menutup rangkaian", vi: "báo hiệu một danh sách hoặc một trích dẫn; khép lại một chuỗi liệt kê" }
          ex: { examples: [["El curso tiene tres partes", { target: ":" }, " gramática, escritura y lectura."], ["Pan, queso, aceitunas", { target: ":" }, " eso era toda la cena."]] }
          tr: { en: { examples: ["The course has three parts: grammar, writing and reading.", "Bread, cheese, olives: that was the whole dinner."] }, uk: { examples: ["Курс має три частини: граматика, письмо і читання.", "Хліб, сир, оливки — оце й була вся вечеря."] }, pt: { examples: ["O curso tem três partes: gramática, escrita e leitura.", "Pão, queijo, azeitonas: isso era todo o jantar."] }, fr: { examples: ["Le cours comporte trois parties : grammaire, écriture et lecture.", "Du pain, du fromage, des olives : c’était tout le dîner."] }, de: { examples: ["Der Kurs hat drei Teile: Grammatik, Schreiben und Lesen.", "Brot, Käse, Oliven: Das war das ganze Abendessen."] }, it: { examples: ["Il corso ha tre parti: grammatica, scrittura e lettura.", "Pane, formaggio, olive: era tutta la cena."] }, pl: { examples: ["Kurs ma trzy części: gramatykę, pisanie i czytanie.", "Chleb, ser, oliwki – to była cała kolacja."] }, tr: { examples: ["Kursun üç bölümü var: dilbilgisi, yazma ve okuma.", "Ekmek, peynir, zeytin: akşam yemeğinin tamamı buydu."] }, id: { examples: ["Kursus ini terdiri atas tiga bagian: tata bahasa, menulis, dan membaca.", "Roti, keju, zaitun: itulah seluruh makan malam itu."] }, vi: { examples: ["Khóa học có ba phần: ngữ pháp, viết và đọc.", "Bánh mì, phô mai, ô liu: đó là toàn bộ bữa tối."] } }
        - level: B2
          point: { es: Punto y coma, en: "Semicolon", uk: "Крапка з комою", pt: "Ponto e vírgula", fr: "Point-virgule", de: "Semikolon", it: "Punto e virgola", pl: "Średnik", tr: "Noktalı virgül", id: "Titik koma", vi: "Dấu chấm phẩy" }
          rule: { es: "separa oraciones con comas y oraciones con el verbo omitido", en: "it separates clauses that already contain commas, and clauses with the verb left out", uk: "розділяє речення, що вже містять коми, і речення з пропущеним дієсловом", pt: "separa orações que já têm vírgulas e orações com o verbo omitido", fr: "sépare des propositions qui contiennent déjà des virgules et des propositions au verbe sous-entendu", de: "trennt Sätze, die schon Kommas enthalten, und Sätze mit ausgelassenem Verb", it: "separa frasi che contengono già virgole e frasi con il verbo omesso", pl: "oddziela zdania zawierające już przecinki oraz zdania z pominiętym czasownikiem", tr: "içinde zaten virgül bulunan cümleleri ve fiili düşmüş cümleleri ayırır", id: "memisahkan kalimat yang sudah berisi koma dan kalimat dengan verba yang dihilangkan", vi: "ngăn các câu đã có dấu phẩy và các câu bỏ động từ" }
          ex: { examples: [["Mi tía, muy cansada, se sentó", { target: ";" }, " llevaba horas de pie."], ["Ana es abogada", { target: ";" }, " Luis, ingeniero."]] }
          tr: { en: { examples: ["My aunt, very tired, sat down; she had been on her feet for hours.", "Ana is a lawyer; Luis, an engineer."] }, uk: { examples: ["Моя тітка, дуже втомлена, сіла; вона стояла на ногах кілька годин.", "Ана — адвокатка; Луїс — інженер."] }, pt: { examples: ["Minha tia, muito cansada, sentou-se; estava de pé havia horas.", "Ana é advogada; Luis, engenheiro."] }, fr: { examples: ["Ma tante, très fatiguée, s’est assise ; elle était debout depuis des heures.", "Ana est avocate ; Luis, ingénieur."] }, de: { examples: ["Meine Tante, sehr müde, setzte sich; sie hatte stundenlang gestanden.", "Ana ist Anwältin; Luis, Ingenieur."] }, it: { examples: ["Mia zia, molto stanca, si sedette; era in piedi da ore.", "Ana è avvocata; Luis, ingegnere."] }, pl: { examples: ["Moja ciotka, bardzo zmęczona, usiadła; stała na nogach od wielu godzin.", "Ana jest adwokatką; Luis – inżynierem."] }, tr: { examples: ["Teyzem, çok yorgun hâlde, oturdu; saatlerdir ayaktaydı.", "Ana avukat; Luis mühendis."] }, id: { examples: ["Bibi saya, yang sangat lelah, duduk; ia sudah berjam-jam berdiri.", "Ana seorang pengacara; Luis, seorang insinyur."] }, vi: { examples: ["Dì tôi, rất mệt, ngồi xuống; bà đã đứng hàng giờ.", "Ana là luật sư; Luis, kỹ sư."] } }
        - level: B2
          point: { es: Puntos suspensivos, en: "Ellipsis", uk: "Три крапки", pt: "Reticências", fr: "Points de suspension", de: "Auslassungspunkte", it: "Puntini di sospensione", pl: "Wielokropek", tr: "Üç nokta", id: "Tanda elipsis", vi: "Dấu ba chấm" }
          rule: { es: ["dejan una frase sin acabar; ", { term: "[...]" }, " marca una omisión en una cita"], en: ["they leave a sentence unfinished; ", { term: "[...]" }, " marks an omission in a quotation"], uk: ["залишають речення недоказаним; ", { term: "[...]" }, " позначає пропуск у цитаті"], pt: ["deixam uma frase inacabada; ", { term: "[...]" }, " marca uma omissão em uma citação"], fr: ["laissent une phrase inachevée ; ", { term: "[...]" }, " marque une omission dans une citation"], de: ["lassen einen Satz unvollendet; ", { term: "[...]" }, " kennzeichnet eine Auslassung in einem Zitat"], it: ["lasciano una frase incompiuta; ", { term: "[...]" }, " segna un'omissione in una citazione"], pl: ["zostawiają zdanie niedokończone; ", { term: "[...]" }, " oznacza pominięcie w cytacie"], tr: ["cümleyi yarım bırakır; ", { term: "[...]" }, " bir alıntıdaki atlamayı gösterir"], id: ["membiarkan kalimat tak selesai; ", { term: "[...]" }, " menandai bagian yang dilewatkan dalam kutipan"], vi: ["để câu bỏ dở; ", { term: "[...]" }, " đánh dấu phần lược bỏ trong một trích dẫn"] }
          ex: ["Si hubiera llegado antes", { target: "..." }]
          tr: { en: "If I had arrived earlier...", uk: "Якби я приїхав раніше...", pt: "Se eu tivesse chegado antes...", fr: "Si j’étais arrivé plus tôt...", de: "Wenn ich früher gekommen wäre...", it: "Se fossi arrivato prima...", pl: "Gdybym przyjechał wcześniej...", tr: "Daha erken gelseydim...", id: "Seandainya saya datang lebih awal...", vi: "Nếu tôi đến sớm hơn..." }
        - level: B2
          point: { es: Comillas y raya, en: "Quotation marks and dash", uk: "Лапки й тире", pt: "Aspas e travessão", fr: "Guillemets et tiret", de: "Anführungszeichen und Gedankenstrich", it: "Virgolette e lineetta", pl: "Cudzysłów i myślnik", tr: "Tırnak işareti ve tire", id: "Tanda petik dan tanda pisah", vi: "Dấu ngoặc kép và dấu gạch ngang" }
          rule: { es: "las comillas se anidan en el orden « », “ ”, ‘ ’; la raya encierra incisos y abre diálogos", en: "quotation marks nest in the order « », “ ”, ‘ ’; the dash encloses asides and opens dialogue", uk: "лапки вкладаються в порядку « », “ ”, ‘ ’; тире виділяє вставні частини й відкриває діалог", pt: "as aspas se aninham na ordem « », “ ”, ‘ ’; o travessão isola incisos e abre diálogos", fr: "les guillemets s’emboîtent dans l’ordre « », “ ”, ‘ ’ ; le tiret encadre les incises et ouvre les dialogues", de: "Anführungszeichen werden in der Reihenfolge « », “ ”, ‘ ’ verschachtelt; der Gedankenstrich schließt Einschübe ein und eröffnet Dialoge", it: "le virgolette si annidano nell'ordine « », “ ”, ‘ ’; la lineetta racchiude gli incisi e apre i dialoghi", pl: "cudzysłowy zagnieżdża się w kolejności « », “ ”, ‘ ’; myślnik obejmuje wtrącenia i otwiera dialog", tr: "tırnaklar « », “ ”, ‘ ’ sırasıyla iç içe girer; tire ara sözleri çevreler ve diyaloğu başlatır", id: "tanda petik bersarang dengan urutan « », “ ”, ‘ ’; tanda pisah mengapit sisipan dan membuka dialog", vi: "dấu ngoặc kép lồng nhau theo thứ tự « », “ ”, ‘ ’; dấu gạch ngang bao quanh thành phần xen và mở đầu lời thoại" }
          ex: { examples: [["Luis dijo: ", { target: "«Ana gritó “¡Gol!”»" }, "."], ["El cambio ", { target: "—que llegó rápido—" }, " nos sorprendió."]] }
          tr: { en: { examples: ["Luis said: ‘Ana shouted “Goal!”’.", "The change – which came quickly – surprised us."] }, uk: { examples: ["Луїс сказав: «Ана вигукнула „Гол!“».", "Зміна, що настала швидко, здивувала нас."] }, pt: { examples: ["Luis disse: “Ana gritou ‘Gol!’”.", "A mudança — que chegou rápido — nos surpreendeu."] }, fr: { examples: ["Luis a dit : « Ana a crié “But !” ».", "Le changement — arrivé vite — nous a surpris."] }, de: { examples: ["Luis sagte: „Ana rief ‚Tor!‘“.", "Die Veränderung – die schnell kam – überraschte uns."] }, it: { examples: ["Luis ha detto: «Ana ha gridato “Gol!”».", "Il cambiamento — arrivato in fretta — ci ha sorpresi."] }, pl: { examples: ["Luis powiedział: „Ana krzyknęła «Gol!»”.", "Zmiana – która nastąpiła szybko – zaskoczyła nas."] }, tr: { examples: ["Luis, “Ana ‘Gol!’ diye bağırdı” dedi.", "Hızlı gelen değişim bizi şaşırttı."] }, id: { examples: ["Luis berkata: “Ana berteriak ‘Gol!’”.", "Perubahan itu — yang datang dengan cepat — mengejutkan kami."] }, vi: { examples: ["Luis nói: “Ana hét lên ‘Vào rồi!’”.", "Sự thay đổi — đến rất nhanh — làm chúng tôi ngạc nhiên."] } }
        - level: C1
          point: { es: Coma, en: "Comma", uk: "Кома", pt: "Vírgula", fr: "Virgule", de: "Komma", it: "Virgola", pl: "Przecinek", tr: "Virgül", id: "Koma", vi: "Dấu phẩy" }
          rule: { es: "la subordinada adelantada termina en coma", en: "a fronted subordinate clause ends with a comma", uk: "підрядне речення на початку закінчується комою", pt: "a subordinada antecipada termina em vírgula", fr: "la subordonnée placée en tête se termine par une virgule", de: "ein vorangestellter Nebensatz endet mit einem Komma", it: "la subordinata anticipata finisce con una virgola", pl: "zdanie podrzędne na początku kończy się przecinkiem", tr: "başa alınan yan cümle virgülle biter", id: "anak kalimat yang diletakkan di depan diakhiri koma", vi: "mệnh đề phụ đứng đầu câu kết thúc bằng dấu phẩy" }
          ex: ["Si tuviera tiempo", { target: "," }, " te ayudaría."]
          tr: { en: "If I had time, I would help you.", uk: "Якби я мав час, я б тобі допоміг.", pt: "Se eu tivesse tempo, ajudaria você.", fr: "Si j’avais le temps, je t’aiderais.", de: "Wenn ich Zeit hätte, würde ich dir helfen.", it: "Se avessi tempo, ti aiuterei.", pl: "Gdybym miał czas, pomógłbym ci.", tr: "Vaktim olsa, sana yardım ederdim.", id: "Kalau saya punya waktu, saya akan membantumu.", vi: "Nếu có thời gian, tôi sẽ giúp bạn." }
        - level: C1
          point: { es: Dos puntos y punto y coma, en: "Colon and semicolon", uk: "Двокрапка й крапка з комою", pt: "Dois-pontos e ponto e vírgula", fr: "Deux-points et point-virgule", de: "Doppelpunkt und Semikolon", it: "Due punti e punto e virgola", pl: "Dwukropek i średnik", tr: "İki nokta ve noktalı virgül", id: "Titik dua dan titik koma", vi: "Dấu hai chấm và dấu chấm phẩy" }
