            use: { es: "Agrupan los elementos de un cuadro o de un esquema.", en: "They group the items of a table or an outline.", uk: "Об’єднують елементи таблиці чи схеми.", pt: "Agrupam os elementos de um quadro ou de um esquema.", fr: "Regroupent les éléments d’un tableau ou d’un schéma.", de: "Sie fassen die Elemente einer Tabelle oder eines Schemas zusammen.", it: "Raggruppano gli elementi di una tabella o di uno schema.", pl: "Grupują elementy tabeli lub schematu.", tr: "Bir tablonun veya şemanın öğelerini gruplar.", id: "Mengelompokkan unsur dalam tabel atau bagan.", vi: "Gom các phần tử của một bảng hoặc một sơ đồ." }
