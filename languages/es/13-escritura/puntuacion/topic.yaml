          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            sign: { es: comillas, en: "quotation marks", uk: "лапки", pt: "aspas", fr: "guillemets", de: "Anführungszeichen", it: "virgolette", pl: "cudzysłów", tr: "tırnak işareti", id: "tanda petik", vi: "dấu ngoặc kép" }
            use: { es: "Se anidan en este orden: angulares « », inglesas “ ” y simples ‘ ’.", en: "They nest in this order: angle marks « », English double marks “ ” and single marks ‘ ’.", uk: "Вкладаються в такому порядку: кутові « », англійські “ ” та одинарні ‘ ’.", pt: "Aninham-se nesta ordem: angulares « », inglesas “ ” e simples ‘ ’.", fr: "S’emboîtent dans cet ordre : guillemets français « », guillemets anglais “ ” et guillemets simples ‘ ’.", de: "Sie werden in dieser Reihenfolge verschachtelt: französische « », englische “ ” und einfache ‘ ’.", it: "Si annidano in questo ordine: caporali « », inglesi “ ” e semplici ‘ ’.", pl: "Zagnieżdża się je w tej kolejności: kątowe « », angielskie “ ” i pojedyncze ‘ ’.", tr: "Şu sırayla iç içe girer: açılı « », İngiliz tipi “ ” ve tek ‘ ’.", id: "Bersarang dalam urutan ini: sudut « », Inggris “ ” dan tunggal ‘ ’.", vi: "Chúng lồng nhau theo thứ tự này: ngoặc kép góc « », ngoặc kép kiểu Anh “ ” và ngoặc đơn ‘ ’." }
            ex: ["Luis contó: ", { target: "«El profesor dijo: “Lean el poema ‘Otoño’ en casa”»" }, "."]
            tr: { en: "Luis said: ‘The teacher said: “Read the poem ‘Autumn’ at home”’.", uk: "Луїс розповів: «Учитель сказав: „Прочитайте вдома вірш ‘Осінь’“».", pt: "Luis contou: “O professor disse: ‘Leiam em casa o poema “Outono”’”.", fr: "Luis a raconté : « Le professeur a dit : “Lisez le poème ‘Automne’ à la maison” ».", de: "Luis erzählte: „Der Lehrer sagte: ‚Lest das Gedicht „Herbst“ zu Hause‘“.", it: "Luis ha raccontato: «Il professore ha detto: “Leggete a casa la poesia ‘Autunno’”».", pl: "Luis opowiedział: „Nauczyciel powiedział: «Przeczytajcie w domu wiersz „Jesień”»”.", tr: "Luis anlattı: “Öğretmen şöyle dedi: ‘Evde “Sonbahar” şiirini okuyun’”.", id: "Luis bercerita: “Guru berkata: ‘Bacalah puisi “Musim Gugur” di rumah’”.", vi: "Luis kể: “Thầy giáo nói: ‘Hãy đọc bài thơ “Mùa thu” ở nhà’”." }
          - level: B2
            sign: { es: comillas, en: "quotation marks", uk: "лапки", pt: "aspas", fr: "guillemets", de: "Anführungszeichen", it: "virgolette", pl: "cudzysłów", tr: "tırnak işareti", id: "tanda petik", vi: "dấu ngoặc kép" }
            use: { es: "Encierran el título de un artículo o de una conferencia.", en: "They enclose the title of an article or a lecture.", uk: "Охоплюють назву статті або доповіді.", pt: "Encerram o título de um artigo ou de uma conferência.", fr: "Encadrent le titre d’un article ou d’une conférence.", de: "Sie schließen den Titel eines Artikels oder eines Vortrags ein.", it: "Racchiudono il titolo di un articolo o di una conferenza.", pl: "Obejmują tytuł artykułu lub wykładu.", tr: "Bir makalenin veya konferansın başlığını çevreler.", id: "Mengapit judul artikel atau ceramah.", vi: "Bao quanh tên của một bài báo hoặc một buổi thuyết trình." }
            ex: ["Leí ", { target: "«La ciudad del futuro»" }, " en el periódico."]
            tr: { en: "I read ‘The City of the Future’ in the newspaper.", uk: "Я прочитав «Місто майбутнього» в газеті.", pt: "Li “A cidade do futuro” no jornal.", fr: "J’ai lu « La ville du futur » dans le journal.", de: "Ich habe „Die Stadt der Zukunft“ in der Zeitung gelesen.", it: "Ho letto «La città del futuro» sul giornale.", pl: "Przeczytałem „Miasto przyszłości” w gazecie.", tr: "“Geleceğin Şehri” yazısını gazetede okudum.", id: "Saya membaca “Kota Masa Depan” di koran.", vi: "Tôi đã đọc “Thành phố của tương lai” trên báo." }
          - level: B2
            sign: { es: comillas, en: "quotation marks", uk: "лапки", pt: "aspas", fr: "guillemets", de: "Anführungszeichen", it: "virgolette", pl: "cudzysłów", tr: "tırnak işareti", id: "tanda petik", vi: "dấu ngoặc kép" }
            use: { es: "Encierran el nombre de un barco, de un cine o de un restaurante.", en: "They enclose the name of a ship, a cinema or a restaurant.", uk: "Охоплюють назву корабля, кінотеатру чи ресторану.", pt: "Encerram o nome de um navio, de um cinema ou de um restaurante.", fr: "Encadrent le nom d’un bateau, d’un cinéma ou d’un restaurant.", de: "Sie schließen den Namen eines Schiffs, eines Kinos oder eines Restaurants ein.", it: "Racchiudono il nome di una nave, di un cinema o di un ristorante.", pl: "Obejmują nazwę statku, kina lub restauracji.", tr: "Bir geminin, sinemanın veya restoranın adını çevreler.", id: "Mengapit nama kapal, bioskop, atau restoran.", vi: "Bao quanh tên của một con tàu, một rạp chiếu phim hoặc một nhà hàng." }
            ex: ["Cenamos en ", { target: "«La Parrilla»" }, "."]
            tr: { en: "We had dinner at ‘La Parrilla’.", uk: "Ми вечеряли в «La Parrilla».", pt: "Jantamos no “La Parrilla”.", fr: "Nous avons dîné au « La Parrilla ».", de: "Wir haben im „La Parrilla“ zu Abend gegessen.", it: "Abbiamo cenato al «La Parrilla».", pl: "Jedliśmy kolację w „La Parrilla”.", tr: "Akşam yemeğini “La Parrilla”da yedik.", id: "Kami makan malam di “La Parrilla”.", vi: "Chúng tôi ăn tối ở “La Parrilla”." }
          - level: B2
            sign: { es: guion, en: "hyphen", uk: "дефіс", pt: "hífen", fr: "trait d’union", de: "Bindestrich", it: "trattino", pl: "łącznik", tr: "kısa çizgi", id: "tanda hubung", vi: "dấu gạch nối" }
            use: { es: "Une dos elementos que forman una relación o un compuesto.", en: "It joins two elements that form a relation or a compound.", uk: "З’єднує два елементи, що утворюють співвідношення або складне слово.", pt: "Une dois elementos que formam uma relação ou um composto.", fr: "Relie deux éléments qui forment un rapport ou un composé.", de: "Er verbindet zwei Elemente, die ein Verhältnis oder ein Kompositum bilden.", it: "Unisce due elementi che formano un rapporto o un composto.", pl: "Łączy dwa elementy tworzące relację lub złożenie.", tr: "Bir ilişki veya bileşik sözcük oluşturan iki öğeyi birleştirir.", id: "Menghubungkan dua unsur yang membentuk suatu hubungan atau kata majemuk.", vi: "Nối hai thành tố tạo thành một quan hệ hoặc một từ ghép." }
            ex: { examples: [["la relación ", { target: calidad-precio }], ["un acuerdo ", { target: hispano-francés }]] }
            tr: { en: { examples: ["the quality-price ratio", "a Spanish-French agreement"] }, uk: { examples: ["співвідношення «якість — ціна»", "іспансько-французька угода"] }, pt: { examples: ["a relação qualidade-preço", "um acordo hispano-francês"] }, fr: { examples: ["le rapport qualité-prix", "un accord hispano-français"] }, de: { examples: ["das Preis-Leistungs-Verhältnis", "ein spanisch-französisches Abkommen"] }, it: { examples: ["il rapporto qualità-prezzo", "un accordo ispano-francese"] }, pl: { examples: ["stosunek jakości do ceny", "umowa hiszpańsko-francuska"] }, tr: { examples: ["fiyat-performans oranı", "İspanyol-Fransız anlaşması"] }, id: { examples: ["rasio kualitas-harga", "perjanjian Spanyol-Prancis"] }, vi: { examples: ["tỉ lệ chất lượng-giá cả", "thỏa thuận Tây Ban Nha-Pháp"] } }
          - level: B2
            sign: { es: raya, en: "dash", uk: "тире", pt: "travessão", fr: "tiret", de: "Gedankenstrich", it: "lineetta", pl: "myślnik", tr: "tire", id: "tanda pisah", vi: "dấu gạch ngang" }
            use: { es: "Encierra un inciso y se escribe pegada a él.", en: "It encloses an aside and is written close against it.", uk: "Виділяє вставну частину й пишеться впритул до неї.", pt: "Isola um inciso e se escreve colada a ele.", fr: "Encadre une incise et se colle à elle.", de: "Er schließt einen Einschub ein und steht ohne Leerraum direkt daran.", it: "Racchiude un inciso e si scrive attaccata a esso.", pl: "Obejmuje wtrącenie i pisze się go bezpośrednio przy nim.", tr: "Bir ara sözü çevreler ve ona bitişik yazılır.", id: "Mengapit sisipan dan ditulis rapat dengan sisipan itu.", vi: "Bao quanh thành phần xen và viết sát liền với thành phần ấy." }
            ex: ["El cambio ", { target: "—que llegó muy rápido—" }, " nos sorprendió."]
            tr: { en: "The change – which came very quickly – surprised us.", uk: "Зміна, що настала дуже швидко, здивувала нас.", pt: "A mudança — que chegou muito rápido — nos surpreendeu.", fr: "Le changement — arrivé très vite — nous a surpris.", de: "Die Veränderung – die sehr schnell kam – überraschte uns.", it: "Il cambiamento — arrivato molto in fretta — ci ha sorpresi.", pl: "Zmiana – która nastąpiła bardzo szybko – zaskoczyła nas.", tr: "Çok hızlı gelen değişim bizi şaşırttı.", id: "Perubahan itu — yang datang sangat cepat — mengejutkan kami.", vi: "Sự thay đổi — đến rất nhanh — làm chúng tôi ngạc nhiên." }
          - level: B2
            sign: { es: raya, en: "dash", uk: "тире", pt: "travessão", fr: "tiret", de: "Gedankenstrich", it: "lineetta", pl: "myślnik", tr: "tire", id: "tanda pisah", vi: "dấu gạch ngang" }
            use: { es: "Abre cada intervención de un diálogo y la separa del comentario del narrador.", en: "It opens each turn of a dialogue and separates it from the narrator's comment.", uk: "Відкриває кожну репліку діалогу й відділяє її від коментаря оповідача.", pt: "Abre cada fala de um diálogo e a separa do comentário do narrador.", fr: "Ouvre chaque réplique d’un dialogue et la sépare du commentaire du narrateur.", de: "Er eröffnet jede Replik eines Dialogs und trennt sie vom Kommentar des Erzählers.", it: "Apre ogni battuta di un dialogo e la separa dal commento del narratore.", pl: "Otwiera każdą wypowiedź w dialogu i oddziela ją od komentarza narratora.", tr: "Diyalogdaki her konuşmayı başlatır ve onu anlatıcının yorumundan ayırır.", id: "Membuka setiap tuturan dalam dialog dan memisahkannya dari komentar narator.", vi: "Mở đầu mỗi lượt lời trong hội thoại và tách nó khỏi lời dẫn của người kể." }
            ex: [{ target: "—" }, "Mañana llego tarde ", { target: "—" }, "dijo Marta."]
            tr: { en: "‘I will be late tomorrow,’ said Marta.", uk: "«Завтра я спізнюся», — сказала Марта.", pt: "“Amanhã chego tarde”, disse Marta.", fr: "« Demain, j’arriverai en retard », dit Marta.", de: "„Morgen komme ich zu spät“, sagte Marta.", it: "«Domani arrivo tardi», disse Marta.", pl: "„Jutro się spóźnię”, powiedziała Marta.", tr: "“Yarın geç geleceğim,” dedi Marta.", id: "“Besok saya terlambat,” kata Marta.", vi: "“Ngày mai tôi sẽ đến muộn,” Marta nói." }
          - level: C1
            sign: { es: comillas, en: "quotation marks", uk: "лапки", pt: "aspas", fr: "guillemets", de: "Anführungszeichen", it: "virgolette", pl: "cudzysłów", tr: "tırnak işareti", id: "tanda petik", vi: "dấu ngoặc kép" }
            use: { es: "Los signos de interrogación y de exclamación de la cita van dentro de las comillas.", en: "The question marks and exclamation marks of the quotation go inside the quotation marks.", uk: "Знаки питання й оклику цитати стоять усередині лапок.", pt: "Os pontos de interrogação e de exclamação da citação ficam dentro das aspas.", fr: "Les points d’interrogation et d’exclamation de la citation se placent à l’intérieur des guillemets.", de: "Die Frage- und Ausrufezeichen des Zitats stehen innerhalb der Anführungszeichen.", it: "I punti interrogativi ed esclamativi della citazione vanno dentro le virgolette.", pl: "Znaki zapytania i wykrzykniki cytatu stoją wewnątrz cudzysłowu.", tr: "Alıntıdaki soru ve ünlem işaretleri tırnak işaretinin içinde yer alır.", id: "Tanda tanya dan tanda seru dari kutipan berada di dalam tanda petik.", vi: "Dấu hỏi và dấu chấm than của lời trích nằm bên trong dấu ngoặc kép." }
            ex: ["Y entonces dijo: ", { target: "«¡Qué susto me diste!»" }]
            tr: { en: "And then he said: ‘What a fright you gave me!’", uk: "І тоді він сказав: «Як ти мене налякав!»", pt: "E então ele disse: “Que susto você me deu!”", fr: "Et alors il a dit : « Quelle frayeur tu m’as faite ! »", de: "Und dann sagte er: „Was für einen Schreck du mir eingejagt hast!“", it: "E allora ha detto: «Che spavento mi hai fatto prendere!»", pl: "A wtedy powiedział: „Ale mnie przestraszyłeś!”", tr: "Sonra şöyle dedi: “Beni çok korkuttun!”", id: "Lalu dia berkata: “Kamu membuatku kaget sekali!”", vi: "Rồi anh ấy nói: “Bạn làm tôi giật mình quá!”" }
          - level: C1
            sign: { es: comillas, en: "quotation marks", uk: "лапки", pt: "aspas", fr: "guillemets", de: "Anführungszeichen", it: "virgolette", pl: "cudzysłów", tr: "tırnak işareti", id: "tanda petik", vi: "dấu ngoặc kép" }
            use: { es: "Encierran la palabra de la que se habla.", en: "They enclose the word that is being discussed.", uk: "Охоплюють слово, про яке йдеться.", pt: "Encerram a palavra de que se fala.", fr: "Encadrent le mot dont on parle.", de: "Sie schließen das Wort ein, über das gesprochen wird.", it: "Racchiudono la parola di cui si parla.", pl: "Obejmują wyraz, o którym mowa.", tr: "Üzerinde konuşulan sözcüğü çevreler.", id: "Mengapit kata yang sedang dibicarakan.", vi: "Bao quanh từ đang được nói đến." }
            ex: ["El verbo ", { target: "«caber»" }, " es irregular."]
            tr: { en: "The verb ‘caber’ is irregular.", uk: "Дієслово «caber» неправильне.", pt: "O verbo “caber” é irregular.", fr: "Le verbe « caber » est irrégulier.", de: "Das Verb „caber“ ist unregelmäßig.", it: "Il verbo «caber» è irregolare.", pl: "Czasownik „caber” jest nieregularny.", tr: "“Caber” fiili düzensizdir.", id: "Verba “caber” tidak beraturan.", vi: "Động từ “caber” là động từ bất quy tắc." }
          - level: C1
            sign: { es: guion, en: "hyphen", uk: "дефіс", pt: "hífen", fr: "trait d’union", de: "Bindestrich", it: "trattino", pl: "łącznik", tr: "kısa çizgi", id: "tanda hubung", vi: "dấu gạch nối" }
            use: { es: "El prefijo se une a su base sin guion.", en: "A prefix joins its base without a hyphen.", uk: "Префікс приєднується до основи без дефіса.", pt: "O prefixo se une à sua base sem hífen.", fr: "Le préfixe se soude à sa base sans trait d’union.", de: "Das Präfix wird ohne Bindestrich mit seiner Basis verbunden.", it: "Il prefisso si unisce alla sua base senza trattino.", pl: "Przedrostek łączy się z podstawą bez łącznika.", tr: "Önek, tabanına kısa çizgi olmadan eklenir.", id: "Prefiks menyatu dengan kata dasarnya tanpa tanda hubung.", vi: "Tiền tố gắn vào gốc từ mà không có dấu gạch nối." }
            ex: { examples: [["una crema ", { target: antiarrugas }], ["un líquido ", { target: anticongelante }]] }
            tr: { en: { examples: ["an anti-wrinkle cream", "an antifreeze liquid"] }, uk: { examples: ["крем проти зморшок", "рідина-антифриз"] }, pt: { examples: ["um creme antirrugas", "um líquido anticongelante"] }, fr: { examples: ["une crème antirides", "un liquide antigel"] }, de: { examples: ["eine Anti-Falten-Creme", "eine Frostschutzflüssigkeit"] }, it: { examples: ["una crema antirughe", "un liquido anticongelante"] }, pl: { examples: ["krem przeciwzmarszczkowy", "płyn niezamarzający"] }, tr: { examples: ["kırışıklık önleyici krem", "donmayı önleyici sıvı"] }, id: { examples: ["krim antikerut", "cairan antibeku"] }, vi: { examples: ["kem chống nhăn", "chất lỏng chống đông"] } }
          - level: C1
            sign: { es: raya, en: "dash", uk: "тире", pt: "travessão", fr: "tiret", de: "Gedankenstrich", it: "lineetta", pl: "myślnik", tr: "tire", id: "tanda pisah", vi: "dấu gạch ngang" }
            use: { es: "Tras la raya de cierre se escribe la coma, el punto, el punto y coma o los dos puntos de la oración.", en: "After the closing dash come the comma, full stop, semicolon or colon that the sentence needs.", uk: "Після закривального тире стоять кома, крапка, крапка з комою або двокрапка, яких вимагає речення.", pt: "Depois do travessão de fechamento vêm a vírgula, o ponto, o ponto e vírgula ou os dois-pontos da oração.", fr: "Après le tiret de fermeture viennent la virgule, le point, le point-virgule ou les deux-points de la phrase.", de: "Nach dem schließenden Gedankenstrich stehen das Komma, der Punkt, das Semikolon oder der Doppelpunkt des Satzes.", it: "Dopo la lineetta di chiusura si scrivono la virgola, il punto, il punto e virgola o i due punti della frase.", pl: "Po myślniku zamykającym stawia się przecinek, kropkę, średnik lub dwukropek wymagany przez zdanie.", tr: "Kapatan tireden sonra cümlenin gerektirdiği virgül, nokta, noktalı virgül veya iki nokta yazılır.", id: "Setelah tanda pisah penutup, ditulis koma, titik, titik koma, atau titik dua milik kalimat itu.", vi: "Sau dấu gạch ngang đóng, ta viết dấu phẩy, dấu chấm, dấu chấm phẩy hoặc dấu hai chấm của câu." }
            ex: ["—Cuando lleguemos —dijo Marta—", { target: "," }, " te llamo."]
            tr: { en: "‘When we arrive,’ said Marta, ‘I will call you.’", uk: "«Коли ми приїдемо, — сказала Марта, — я тобі зателефоную».", pt: "“Quando chegarmos”, disse Marta, “eu ligo para você”.", fr: "« Quand nous arriverons, dit Marta, je t’appellerai ».", de: "„Wenn wir ankommen“, sagte Marta, „rufe ich dich an.“", it: "«Quando arriveremo», disse Marta, «ti chiamo».", pl: "„Kiedy dojedziemy”, powiedziała Marta, „zadzwonię do ciebie”.", tr: "“Vardığımızda,” dedi Marta, “seni arayacağım.”", id: "“Setelah kami tiba,” kata Marta, “saya akan meneleponmu.”", vi: "“Khi chúng tôi đến nơi,” Marta nói, “tôi sẽ gọi cho bạn.”" }
