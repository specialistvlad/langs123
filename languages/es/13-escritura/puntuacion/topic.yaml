            use: { es: "En poesía, deshace un diptongo para contar una sílaba más.", en: "In poetry, it splits a diphthong to count one more syllable.", uk: "У поезії розділяє дифтонг, щоб додати ще один склад.", pt: "Na poesia, desfaz um ditongo para contar uma sílaba a mais.", fr: "En poésie, elle défait une diphtongue pour compter une syllabe de plus.", de: "In der Dichtung löst es einen Diphthong auf, um eine Silbe mehr zu zählen.", it: "In poesia, scioglie un dittongo per contare una sillaba in più.", pl: "W poezji rozdziela dyftong, by policzyć jedną sylabę więcej.", tr: "Şiirde bir çift ünlüyü ayırarak bir hece fazla saydırır.", id: "Dalam puisi, tanda ini memisahkan diftong agar dihitung satu suku kata lebih banyak.", vi: "Trong thơ, dấu này tách nguyên âm đôi để tính thêm một âm tiết." }
            ex: ["El poeta escribe ", { target: süave }, " para ganar una sílaba."]
            tr: { en: "The poet writes süave to gain a syllable.", uk: "Поет пише süave, щоб здобути ще один склад.", pt: "O poeta escreve süave para ganhar uma sílaba.", fr: "Le poète écrit süave pour gagner une syllabe.", de: "Der Dichter schreibt süave, um eine Silbe zu gewinnen.", it: "Il poeta scrive süave per guadagnare una sillaba.", pl: "Poeta pisze süave, aby zyskać jedną sylabę.", tr: "Şair, bir hece kazanmak için süave yazar.", id: "Penyair menulis süave untuk mendapatkan satu suku kata.", vi: "Nhà thơ viết süave để có thêm một âm tiết." }
