          - { level: B2, wrong: "Luis dijo: «Ana gritó «¡Gol!» en casa».", right: ["Luis dijo: «Ana gritó ", { target: "“¡Gol!”" }, " en casa»."], rule: { es: "dentro de las comillas angulares van las inglesas", en: "English double marks go inside angle marks", uk: "усередині кутових лапок стоять англійські", pt: "dentro das aspas angulares vão as inglesas", fr: "à l’intérieur des guillemets français viennent les guillemets anglais", de: "innerhalb der französischen Anführungszeichen stehen die englischen", it: "dentro le virgolette caporali vanno quelle inglesi", pl: "wewnątrz cudzysłowu kątowego stoi angielski", tr: "açılı tırnakların içine İngiliz tipi tırnaklar girer", id: "di dalam tanda petik sudut dipakai tanda petik Inggris", vi: "bên trong ngoặc kép góc là ngoặc kép kiểu Anh" } }
