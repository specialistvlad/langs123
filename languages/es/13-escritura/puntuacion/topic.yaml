            use: { es: "Señala un prefijo, un sufijo o una sílaba aislados.", en: "It marks a prefix, a suffix or a syllable on its own.", uk: "Позначає окремий префікс, суфікс чи склад.", pt: "Assinala um prefixo, um sufixo ou uma sílaba isolados.", fr: "Signale un préfixe, un suffixe ou une syllabe isolés.", de: "Er kennzeichnet ein einzeln stehendes Präfix, Suffix oder eine einzelne Silbe.", it: "Segnala un prefisso, un suffisso o una sillaba isolati.", pl: "Oznacza osobny przedrostek, przyrostek lub sylabę.", tr: "Tek başına bir ön eki, son eki veya heceyi gösterir.", id: "Menandai prefiks, sufiks, atau suku kata yang berdiri sendiri.", vi: "Đánh dấu một tiền tố, hậu tố hoặc âm tiết đứng riêng." }
            ex: ["El prefijo ", { target: des- }, " y el sufijo ", { target: -ción }, " forman palabras nuevas."]
