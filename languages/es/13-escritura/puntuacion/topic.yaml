            use: { es: "Marca la letra que falta en una contracción coloquial transcrita.", en: "It marks the missing letter in a transcribed colloquial contraction.", uk: "Позначає літеру, якої бракує в записаному розмовному скороченні.", pt: "Marca a letra que falta em uma contração coloquial transcrita.", fr: "Il marque la lettre manquante dans une contraction familière transcrite.", de: "Er markiert den fehlenden Buchstaben in einer schriftlich wiedergegebenen umgangssprachlichen Verkürzung.", it: "Segna la lettera mancante in una contrazione colloquiale trascritta.", pl: "Oznacza brakującą literę w zapisanym potocznym skrócie.", tr: "Yazıya geçirilmiş konuşma dilindeki bir kısalmada eksik harfi gösterir.", id: "Menandai huruf yang hilang dalam kontraksi lisan yang dituliskan.", vi: "Đánh dấu chữ cái bị lược trong một dạng rút gọn khẩu ngữ được ghi lại." }
            ex: ["¿", { target: "Pa’" }, " qué quieres eso?"]
