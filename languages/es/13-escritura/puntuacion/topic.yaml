            use: { es: "Marcan una palabra impropia, irónica o vulgar.", en: "They mark a word that is improper, ironic or vulgar.", uk: "Позначають слово невідповідне, іронічне чи вульгарне.", pt: "Marcam uma palavra imprópria, irônica ou vulgar.", fr: "Marquent un mot impropre, ironique ou vulgaire.", de: "Sie markieren ein unpassendes, ironisches oder vulgäres Wort.", it: "Segnalano una parola impropria, ironica o volgare.", pl: "Oznaczają wyraz niewłaściwy, ironiczny lub wulgarny.", tr: "Yersiz, ironik veya kaba bir sözcüğü belirtir.", id: "Menandai kata yang kurang tepat, ironis, atau kasar.", vi: "Đánh dấu một từ dùng không chuẩn, mỉa mai hoặc thô tục." }
            ex: { examples: [["Ese ", { target: "«experto»" }, " no sabe nada."], ["Mi tío llama ", { target: "«chamba»" }, " a su trabajo."]] }
            tr: { en: { examples: ["That ‘expert’ knows nothing.", "My uncle calls his job ‘chamba’."] }, uk: { examples: ["Цей «експерт» нічого не знає.", "Мій дядько називає свою роботу «chamba»."] }, pt: { examples: ["Esse “especialista” não sabe nada.", "Meu tio chama o trabalho dele de “chamba”."] }, fr: { examples: ["Ce « spécialiste » ne sait rien.", "Mon oncle appelle son travail « chamba »."] }, de: { examples: ["Dieser „Experte“ weiß nichts.", "Mein Onkel nennt seine Arbeit „chamba“."] }, it: { examples: ["Questo «esperto» non sa niente.", "Mio zio chiama «chamba» il suo lavoro."] }, pl: { examples: ["Ten „ekspert” nic nie wie.", "Mój wujek nazywa swoją pracę „chamba”."] }, tr: { examples: ["Bu “uzman” hiçbir şey bilmiyor.", "Amcam işine “chamba” diyor."] }, id: { examples: ["“Ahli” itu tidak tahu apa-apa.", "Paman saya menyebut pekerjaannya “chamba”."] }, vi: { examples: ["“Chuyên gia” ấy chẳng biết gì cả.", "Chú tôi gọi công việc của mình là “chamba”."] } }
