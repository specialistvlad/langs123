          rule: { es: ["tres lecturas; con ", { term: de }, " y un pronombre, solo el tema"], en: ["three readings; with ", { term: de }, " and a pronoun, only the theme"], uk: ["три тлумачення; з ", { term: de }, " і займенником — лише тема"], pt: ["três leituras; com ", { term: de }, " e um pronome, só o tema"], fr: ["trois lectures ; avec ", { term: de }, " et un pronom, seulement le thème"], de: ["drei Lesarten; mit ", { term: de }, " und einem Pronomen nur das Thema"], it: ["tre letture; con ", { term: de }, " e un pronome, solo il tema"], pl: ["trzy interpretacje; z ", { term: de }, " i zaimkiem tylko temat"], tr: ["üç yorum; ", { term: de }, " ve bir zamirle yalnızca konu"], id: ["tiga interpretasi; dengan ", { term: de }, " dan kata ganti, hanya temanya"], vi: ["ba cách hiểu; với ", { term: de }, " và một đại từ, chỉ có chủ đề"] }
          ex: ["Encontré ", { target: "fotos de ti" }, " en el sobre."]
          tr: { en: "I found photos of you in the envelope.", uk: "Я знайшов у конверті фотографії, на яких ти.", pt: "Encontrei fotos de você no envelope.", fr: "J’ai trouvé des photos de toi dans l’enveloppe.", de: "Ich habe Fotos von dir im Umschlag gefunden.", it: "Ho trovato nella busta delle foto di te.", pl: "Znalazłem w kopercie zdjęcia z tobą.", tr: "Zarfta seni gösteren fotoğraflar buldum.", id: "Saya menemukan foto dirimu di dalam amplop.", vi: "Tôi tìm thấy mấy tấm ảnh chụp bạn trong phong bì." }
        - level: B2
