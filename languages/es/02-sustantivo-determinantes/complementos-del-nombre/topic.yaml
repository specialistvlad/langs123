            kind: { es: Adjetivo de relación, en: "Relational adjective", uk: "Відносний прикметник", pt: "Adjetivo de relação", fr: "Adjectif de relation", de: "Relationsadjektiv", it: "Aggettivo di relazione", pl: "Przymiotnik relacyjny", tr: "İlişki sıfatı", id: "Kata sifat relasional", vi: "Tính từ quan hệ" }
            punctuation: { es: Sin comas, en: "No commas", uk: "Без ком", pt: "Sem vírgulas", fr: "Sans virgules", de: "Ohne Kommas", it: "Senza virgole", pl: "Bez przecinków", tr: "Virgülsüz", id: "Tanpa koma", vi: "Không có dấu phẩy" }
            ex: ["Hay una ", { target: "reunión presidencial" }, " el lunes."]
            tr: { en: "There is a presidential meeting on Monday.", uk: "У понеділок відбудеться президентська зустріч.", pt: "Tem uma reunião presidencial na segunda-feira.", fr: "Il y a une réunion présidentielle lundi.", de: "Am Montag gibt es ein Präsidententreffen.", it: "Lunedì c'è una riunione presidenziale.", pl: "W poniedziałek jest spotkanie prezydenckie.", tr: "Pazartesi günü bir başkanlık toplantısı var.", id: "Ada pertemuan presiden pada hari Senin.", vi: "Thứ Hai có một cuộc họp của tổng thống." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: "El adjetivo de relación va pegado al nombre, y el calificativo, después:", en: "The relational adjective stands next to the noun, and the qualifying adjective after it:", uk: "Відносний прикметник стоїть упритул до іменника, а якісний — після нього:", pt: "O adjetivo de relação fica colado ao substantivo, e o qualificativo, depois:", fr: "L’adjectif de relation est collé au nom, et l’adjectif qualificatif vient après :", de: "Das Relationsadjektiv steht direkt beim Nomen, das qualifizierende Adjektiv danach:", it: "L'aggettivo di relazione sta attaccato al sostantivo, e il qualificativo viene dopo:", pl: "Przymiotnik relacyjny stoi tuż przy rzeczowniku, a przymiotnik jakościowy po nim:", tr: "İlişki sıfatı isme bitişik durur, niteleme sıfatı ondan sonra gelir:", id: "Kata sifat relasional melekat pada kata benda, dan kata sifat kualitatif sesudahnya:", vi: "Tính từ quan hệ đứng sát danh từ, còn tính từ chỉ phẩm chất đứng sau:" }
            ex: ["una crisis ", { target: económica }, " profunda"]
            tr: { en: "a deep economic crisis", uk: "глибока економічна криза", pt: "uma crise econômica profunda", fr: "une crise économique profonde", de: "eine tiefe Wirtschaftskrise", it: "una profonda crisi economica", pl: "głęboki kryzys gospodarczy", tr: "derin bir ekonomik kriz", id: "krisis ekonomi yang dalam", vi: "một cuộc khủng hoảng kinh tế sâu sắc" }
          - type: rule
            level: B2
            text: { es: ["El adjetivo de relación no admite grado: no lleva ", { term: muy }, " ni ", { term: -ísimo }, "."], en: ["The relational adjective cannot be graded: it takes no ", { term: muy }, " or ", { term: "-ísimo" }, "."], uk: ["Відносний прикметник не має ступенів: до нього не додають ", { term: muy }, " чи ", { term: "-ísimo" }, "."], pt: ["O adjetivo de relação não admite grau: não leva ", { term: muy }, " nem ", { term: "-ísimo" }, "."], fr: ["L’adjectif de relation n’admet pas de degré : il ne prend ni ", { term: muy }, " ni ", { term: "-ísimo" }, "."], de: ["Das Relationsadjektiv lässt keine Steigerung zu: weder ", { term: muy }, " noch ", { term: "-ísimo" }, "."], it: ["L'aggettivo di relazione non ammette gradazione: non vuole né ", { term: muy }, " né ", { term: "-ísimo" }, "."], pl: ["Przymiotnik relacyjny nie podlega stopniowaniu: nie przyjmuje ani ", { term: muy }, ", ani ", { term: "-ísimo" }, "."], tr: ["İlişki sıfatı derecelendirilmez: ", { term: muy }, " ya da ", { term: "-ísimo" }, " almaz."], id: ["Kata sifat relasional tidak bisa bertingkat: tidak memakai ", { term: muy }, " maupun ", { term: "-ísimo" }, "."], vi: ["Tính từ quan hệ không có mức độ: không đi với ", { term: muy }, " hay ", { term: "-ísimo" }, "."] }
            ex: ["una ", { target: "fábrica textil" }]
            tr: { en: "a textile factory", uk: "текстильна фабрика", pt: "uma fábrica têxtil", fr: "une usine textile", de: "eine Textilfabrik", it: "una fabbrica tessile", pl: "fabryka tekstyliów", tr: "bir tekstil fabrikası", id: "sebuah pabrik tekstil", vi: "một nhà máy dệt" }
          - type: note
            level: B2
            text: { es: ["Los complementos con una oración de relativo y su modo: ver ", { link: Las oraciones de relativo, to: es.oracion.relativas }, "."], en: ["Complements with a relative clause and its mood: see ", { link: Relative Clauses, to: es.oracion.relativas }, "."], uk: ["Означення у вигляді означального підрядного речення та його спосіб: див. ", { link: Означальні підрядні речення, to: es.oracion.relativas }, "."], pt: ["Os complementos com oração relativa e o seu modo: veja ", { link: As orações relativas, to: es.oracion.relativas }, "."], fr: ["Les compléments avec une proposition relative et son mode : voir ", { link: Les propositions relatives, to: es.oracion.relativas }, "."], de: ["Attribute mit Relativsatz und dessen Modus: siehe ", { link: Die Relativsätze, to: es.oracion.relativas }, "."], it: ["I complementi con una proposizione relativa e il suo modo: vedi ", { link: Le proposizioni relative, to: es.oracion.relativas }, "."], pl: ["Przydawki w postaci zdania względnego i jego tryb: zob. ", { link: Zdania względne, to: es.oracion.relativas }, "."], tr: ["İlgi cümlesiyle kurulan tamlayanlar ve kipi: bkz. ", { link: İlgi cümleleri, to: es.oracion.relativas }, "."], id: ["Pewatas berupa klausa relatif dan modusnya: lihat ", { link: Klausa relatif, to: es.oracion.relativas }, "."], vi: ["Định ngữ dùng mệnh đề quan hệ và thức của nó: xem ", { link: Mệnh đề quan hệ, to: es.oracion.relativas }, "."] }

  - title: { es: Un N de N, en: "Un N de N", uk: "Un N de N", pt: "Un N de N", fr: "Un N de N", de: "Un N de N", it: "Un N de N", pl: "Un N de N", tr: "Un N de N", id: "Un N de N", vi: "Un N de N" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { es: Estructura, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            form: { pattern: [{ term: un }, { slot: { es: nombre de cualidad, en: "quality noun", uk: "іменник якості", pt: "substantivo de qualidade", fr: "nom de qualité", de: "Eigenschaftsnomen", it: "nome di qualità", pl: "rzeczownik oznaczający cechę", tr: "nitelik ismi", id: "kata benda sifat", vi: "danh từ chỉ phẩm chất" } }, { term: de }, { slot: noun }] }
            ex: ["Mi vecina es ", { target: "un encanto de persona" }, "."]
            tr: { en: "My neighbour is a gem of a person.", uk: "Моя сусідка — просто чарівна людина.", pt: "Minha vizinha é um encanto de pessoa.", fr: "Ma voisine est un amour de personne.", de: "Meine Nachbarin ist ein Schatz von einem Menschen.", it: "La mia vicina è un incanto di persona.", pl: "Moja sąsiadka to przemiła osoba.", tr: "Komşum çok tatlı bir insan.", id: "Tetangga saya adalah orang yang sangat menyenangkan.", vi: "Cô hàng xóm của tôi là một người rất dễ mến." }
          - level: C1
            form: { pattern: [{ term: una }, { slot: { es: nombre de cualidad, en: "quality noun", uk: "іменник якості", pt: "substantivo de qualidade", fr: "nom de qualité", de: "Eigenschaftsnomen", it: "nome di qualità", pl: "rzeczownik oznaczający cechę", tr: "nitelik ismi", id: "kata benda sifat", vi: "danh từ chỉ phẩm chất" } }, { term: de }, { slot: noun }] }
            ex: ["Mi sobrino es ", { target: "una monada de bebé" }, "."]
            tr: { en: "My nephew is a darling of a baby.", uk: "Мій племінник — чарівне малятко.", pt: "Meu sobrinho é uma gracinha de bebê.", fr: "Mon neveu est un amour de bébé.", de: "Mein Neffe ist ein zuckersüßes Baby.", it: "Mio nipote è un amore di bebè.", pl: "Mój siostrzeniec to prześliczne niemowlę.", tr: "Yeğenim sevimli bir bebek.", id: "Keponakan saya bayi yang sangat menggemaskan.", vi: "Cháu trai của tôi là một em bé rất đáng yêu." }
          - level: C2
            form: { pattern: [{ term: un }, { slot: { es: nombre de valoración fuerte, en: "noun of strong evaluation", uk: "іменник із сильною оцінкою", pt: "substantivo de avaliação forte", fr: "nom d’appréciation forte", de: "Nomen starker Bewertung", it: "nome di valutazione forte", pl: "rzeczownik o mocnej ocenie", tr: "güçlü değerlendirme bildiren isim", id: "kata benda penilaian kuat", vi: "danh từ đánh giá mạnh" } }, { term: de }, { slot: noun }] }
            ex: ["Me regalaron ", { target: "un horror de lámpara" }, "."]
            tr: { en: "They gave me a horror of a lamp.", uk: "Мені подарували жахливу лампу.", pt: "Me deram um horror de luminária.", fr: "On m’a offert une horreur de lampe.", de: "Man hat mir ein Gräuel von einer Lampe geschenkt.", it: "Mi hanno regalato un orrore di lampada.", pl: "Dostałem w prezencie koszmarną lampę.", tr: "Bana korkunç bir lamba hediye ettiler.", id: "Mereka memberi saya lampu yang sangat jelek.", vi: "Họ tặng tôi một cái đèn xấu kinh khủng." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { es: "El primer nombre da la cualidad, y el segundo nombra a quien la tiene.", en: "The first noun gives the quality, and the second names who has it.", uk: "Перший іменник дає якість, а другий називає того, хто її має.", pt: "O primeiro substantivo dá a qualidade, e o segundo nomeia quem a tem.", fr: "Le premier nom donne la qualité, et le second nomme celui qui la possède.", de: "Das erste Nomen gibt die Eigenschaft an, das zweite nennt, wer sie hat.", it: "Il primo sostantivo dà la qualità, e il secondo nomina chi la possiede.", pl: "Pierwszy rzeczownik określa cechę, a drugi nazywa tego, kto ją ma.", tr: "Birinci isim niteliği verir; ikinci isim bu niteliğe sahip olanı adlandırır.", id: "Kata benda pertama menyatakan sifat, dan kata benda kedua menyebut pemilik sifat itu.", vi: "Danh từ thứ nhất cho biết phẩm chất, danh từ thứ hai gọi tên người hay vật có phẩm chất đó." }
          - type: rule
            level: C1
            text: { es: "El artículo concuerda con el primer nombre, no con el segundo.", en: "The article agrees with the first noun, not with the second.", uk: "Артикль узгоджується з першим іменником, а не з другим.", pt: "O artigo concorda com o primeiro substantivo, não com o segundo.", fr: "L’article s’accorde avec le premier nom, pas avec le second.", de: "Der Artikel richtet sich nach dem ersten Nomen, nicht nach dem zweiten.", it: "L'articolo concorda con il primo sostantivo, non con il secondo.", pl: "Przedimek zgadza się z pierwszym rzeczownikiem, a nie z drugim.", tr: "Artikel birinci isme uyar, ikinciye değil.", id: "Artikel menyesuaikan diri dengan kata benda pertama, bukan dengan yang kedua.", vi: "Mạo từ hòa hợp với danh từ thứ nhất, không phải danh từ thứ hai." }
          - type: rule
            level: C2
            text: { es: "Con una valoración fuerte, el primer nombre equivale a un adjetivo del segundo:", en: "With a strong evaluation, the first noun is the same as an adjective on the second:", uk: "Із сильною оцінкою перший іменник дорівнює прикметнику при другому:", pt: "Com avaliação forte, o primeiro substantivo equivale a um adjetivo do segundo:", fr: "Avec une forte appréciation, le premier nom équivaut à un adjectif du second :", de: "Bei starker Bewertung entspricht das erste Nomen einem Adjektiv zum zweiten:", it: "Con una valutazione forte, il primo sostantivo equivale a un aggettivo del secondo:", pl: "Przy mocnej ocenie pierwszy rzeczownik odpowiada przymiotnikowi przy drugim:", tr: "Güçlü bir değerlendirmede birinci isim, ikinci ismin sıfatına eşdeğerdir:", id: "Dengan penilaian kuat, kata benda pertama setara dengan kata sifat bagi kata benda kedua:", vi: "Khi đánh giá mạnh, danh từ thứ nhất tương đương một tính từ bổ nghĩa cho danh từ thứ hai:" }
            ex: { equivalence: [{ target: "un horror de lámpara" }, ["una lámpara ", { target: horrorosa }]] }
            tr: { en: { equivalence: ["a horror of a lamp", "a horrible lamp"] }, uk: { equivalence: ["не лампа, а жах", "жахлива лампа"] }, pt: { equivalence: ["um horror de luminária", "uma luminária horrorosa"] }, fr: { equivalence: ["une horreur de lampe", "une lampe horrible"] }, de: { equivalence: ["ein Gräuel von einer Lampe", "eine scheußliche Lampe"] }, it: { equivalence: ["un orrore di lampada", "una lampada orrenda"] }, pl: { equivalence: ["nie lampa, a koszmar", "koszmarna lampa"] }, tr: { equivalence: ["lamba değil, korkunç bir şey", "korkunç bir lamba"] }, id: { equivalence: ["bukan lampu, melainkan kengerian", "lampu yang mengerikan"] }, vi: { equivalence: ["không phải đèn mà là một nỗi kinh hoàng", "một cái đèn kinh khủng"] } }

  - title: { es: Errores frecuentes, en: "Typical errors", uk: "Типові помилки", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
