            reading: { es: "El que clasifica va junto al nombre, y el de origen, después.", en: "The one that classifies stands next to the noun, then the one of origin.", uk: "Той, що класифікує, стоїть поруч з іменником, а той, що вказує на походження, — після нього.", pt: "O que classifica fica junto ao substantivo, e o de origem, depois.", fr: "Celui qui classe est collé au nom, puis vient celui d’origine.", de: "Das klassifizierende steht direkt beim Nomen, danach das der Herkunft.", it: "Quello che classifica sta accanto al sostantivo, poi quello di origine.", pl: "Ten, który klasyfikuje, stoi tuż przy rzeczowniku, potem ten, który wskazuje pochodzenie.", tr: "Sınıflandıran sıfat isme yakın durur, köken sıfatı ondan sonra gelir.", id: "Yang mengklasifikasi berada dekat kata benda, lalu yang menyatakan asal.", vi: "Tính từ phân loại đứng sát danh từ, rồi đến tính từ chỉ nguồn gốc." }
