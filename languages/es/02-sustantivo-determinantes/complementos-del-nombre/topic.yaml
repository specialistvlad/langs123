          rule: { es: ["el atributo de ", { term: ser }, " nombra el nombre que falta"], en: ["the subject complement of ", { term: ser }, " names the missing noun"], uk: ["іменна частина присудка з ", { term: ser }, " називає пропущений іменник"], pt: ["o predicativo de ", { term: ser }, " nomeia o substantivo que falta"], fr: ["l’attribut de ", { term: ser }, " nomme le nom qui manque"], de: ["das Prädikativ von ", { term: ser }, " nennt das fehlende Nomen"], it: ["il predicativo di ", { term: ser }, " nomina il sostantivo che manca"], pl: ["orzecznik przy ", { term: ser }, " nazywa brakujący rzeczownik"], tr: [{ term: ser }, " fiilinin ad yüklemi eksik ismi söyler"], id: ["pelengkap subjek dari ", { term: ser }, " menyebut kata benda yang hilang"], vi: ["vị ngữ của ", { term: ser }, " gọi tên danh từ còn thiếu"] }
