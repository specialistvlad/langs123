            reading: { es: "El de materia va primero, y el de destino, después.", en: "The material complement comes first, then the purpose complement.", uk: "Спершу стоїть означення матеріалу, потім означення призначення.", pt: "O de matéria vem primeiro, e o de destino, depois.", fr: "Le complément de matière vient d’abord, puis celui de destination.", de: "Das Attribut des Materials steht zuerst, danach das des Zwecks.", it: "Il complemento di materia viene prima, poi quello di destinazione.", pl: "Najpierw stoi przydawka materiału, potem przydawka przeznaczenia.", tr: "Önce malzeme tamlayanı, sonra amaç tamlayanı gelir.", id: "Pewatas bahan datang lebih dulu, lalu pewatas tujuan.", vi: "Định ngữ chỉ chất liệu đứng trước, rồi đến định ngữ chỉ mục đích." }
