            rule: { es: "el adjetivo de relación va pegado al nombre", en: "the relational adjective stands right next to the noun", uk: "відносний прикметник стоїть упритул до іменника", pt: "o adjetivo de relação fica colado ao substantivo", fr: "l’adjectif de relation est collé au nom", de: "das Relationsadjektiv steht direkt beim Nomen", it: "l'aggettivo di relazione sta attaccato al sostantivo", pl: "przymiotnik relacyjny stoi tuż przy rzeczowniku", tr: "ilişki sıfatı isme bitişik durur", id: "kata sifat relasional melekat pada kata benda", vi: "tính từ quan hệ đứng sát danh từ" }
          - level: B2
            wrong: "Mi bolso es viejo, pero el Marta es nuevo."
            right: ["Mi bolso es viejo, pero ", { target: "el de Marta" }, " es nuevo."]
            rule: { es: ["sin nombre, el artículo lleva ", { term: de }, " y el complemento"], en: ["with no noun, the article takes ", { term: de }, " and the complement"], uk: ["без іменника артикль вживається з ", { term: de }, " і означенням"], pt: ["sem substantivo, o artigo leva ", { term: de }, " e o complemento"], fr: ["sans nom, l’article prend ", { term: de }, " et le complément"], de: ["ohne Nomen steht der Artikel mit ", { term: de }, " und dem Attribut"], it: ["senza sostantivo, l'articolo vuole ", { term: de }, " e il complemento"], pl: ["bez rzeczownika przedimek występuje z ", { term: de }, " i przydawką"], tr: ["isim yoksa artikel ", { term: de }, " ve tamlayanla kullanılır"], id: ["tanpa kata benda, artikel memakai ", { term: de }, " dan pewatas"], vi: ["khi không có danh từ, mạo từ đi với ", { term: de }, " và định ngữ"] }
          - level: C1
            wrong: "El de Pablo tiene mucha amistad con la hermana de Luisa."
            right: ["El ", { target: hermano }, " de Pablo tiene mucha amistad con la hermana de Luisa."]
            rule: { es: "sin antecedente ni atributo que lo nombre, el artículo no basta", en: "with no antecedent or subject complement to name it, the article is not enough", uk: "без антецедента чи іменної частини присудка, що називає іменник, артикля недостатньо", pt: "sem antecedente nem predicativo que o nomeie, o artigo não basta", fr: "sans antécédent ni attribut qui le nomme, l’article ne suffit pas", de: "ohne Bezugswort und ohne Prädikativ, das es nennt, genügt der Artikel nicht", it: "senza antecedente né predicativo che lo nomini, l'articolo non basta", pl: "bez poprzednika ani orzecznika, który go nazywa, przedimek nie wystarcza", tr: "onu adlandıran bir önceki ifade ya da ad yüklemi yoksa artikel yetmez", id: "tanpa anteseden atau pelengkap subjek yang menyebutnya, artikel saja tidak cukup", vi: "nếu không có tiền ngữ hay vị ngữ gọi tên danh từ, mạo từ không đủ" }
          - level: C1
            wrong: "el temor que te vayas"
            right: ["el temor ", { target: "de que" }, " te vayas"]
            rule: { es: ["ante ", { term: que }, ", el nombre conserva su preposición"], en: ["before ", { term: que }, ", the noun keeps its preposition"], uk: ["перед ", { term: que }, " іменник зберігає свій прийменник"], pt: ["diante de ", { term: que }, ", o substantivo mantém a preposição"], fr: ["devant ", { term: que }, ", le nom garde sa préposition"], de: ["vor ", { term: que }, " behält das Nomen seine Präposition"], it: ["davanti a ", { term: que }, ", il sostantivo conserva la sua preposizione"], pl: ["przed ", { term: que }, " rzeczownik zachowuje swój przyimek"], tr: [{ term: que }, " öncesinde isim edatını korur"], id: ["sebelum ", { term: que }, ", kata benda mempertahankan kata depannya"], vi: ["trước ", { term: que }, ", danh từ giữ giới từ của nó"] }
          - level: C1
            wrong: "la industria española textil"
            right: ["la industria ", { target: "textil española" }]
            rule: { es: "el adjetivo que clasifica va antes que el de origen", en: "the classifying adjective comes before the adjective of origin", uk: "прикметник, що класифікує, стоїть перед прикметником походження", pt: "o adjetivo que classifica vem antes do de origem", fr: "l’adjectif qui classe précède celui d’origine", de: "das klassifizierende Adjektiv steht vor dem der Herkunft", it: "l'aggettivo che classifica precede quello di origine", pl: "przymiotnik klasyfikujący stoi przed przymiotnikiem pochodzenia", tr: "sınıflandıran sıfat köken sıfatından önce gelir", id: "kata sifat yang mengklasifikasi mendahului kata sifat asal", vi: "tính từ phân loại đứng trước tính từ chỉ nguồn gốc" }
          - level: C1
            wrong: "una encanto de persona"
            right: [{ target: "un encanto" }, " de persona"]
            rule: { es: "el artículo concuerda con el primer nombre", en: "the article agrees with the first noun", uk: "артикль узгоджується з першим іменником", pt: "o artigo concorda com o primeiro substantivo", fr: "l’article s’accorde avec le premier nom", de: "der Artikel richtet sich nach dem ersten Nomen", it: "l'articolo concorda con il primo sostantivo", pl: "przedimek zgadza się z pierwszym rzeczownikiem", tr: "artikel birinci isme uyar", id: "artikel menyesuaikan diri dengan kata benda pertama", vi: "mạo từ hòa hợp với danh từ thứ nhất" }
