            reading: { es: "Dos lecturas: el complemento hace la acción o la recibe.", en: "Two readings: the complement does the action or receives it.", uk: "Два тлумачення: означення виконує дію або зазнає її.", pt: "Duas leituras: o complemento faz a ação ou a recebe.", fr: "Deux lectures : le complément fait l’action ou la subit.", de: "Zwei Lesarten: Das Attribut führt die Handlung aus oder erleidet sie.", it: "Due letture: il complemento compie l'azione o la subisce.", pl: "Dwie interpretacje: przydawka wykonuje czynność albo jej doświadcza.", tr: "İki yorum: tamlayan eylemi yapar ya da eylemden etkilenir.", id: "Dua interpretasi: pewatas melakukan tindakan atau menerimanya.", vi: "Hai cách hiểu: định ngữ thực hiện hành động hoặc chịu hành động." }
