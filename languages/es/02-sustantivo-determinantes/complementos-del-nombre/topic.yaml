            reading: { es: "Con infinitivo, quien siente y quien actúa son la misma persona.", en: "With an infinitive, the person who feels and the person who acts are the same.", uk: "З інфінітивом той, хто відчуває, і той, хто діє, — одна й та сама особа.", pt: "Com infinitivo, quem sente e quem age são a mesma pessoa.", fr: "Avec l’infinitif, celui qui ressent et celui qui agit sont la même personne.", de: "Beim Infinitiv sind die Person, die fühlt, und die Person, die handelt, dieselbe.", it: "Con l'infinito, chi prova e chi agisce sono la stessa persona.", pl: "Przy bezokoliczniku ten, kto czuje, i ten, kto działa, to ta sama osoba.", tr: "Mastarla, hisseden kişi ile eylemi yapan kişi aynıdır.", id: "Dengan infinitif, orang yang merasakan dan orang yang bertindak adalah orang yang sama.", vi: "Với nguyên mẫu, người cảm nhận và người hành động là cùng một người." }
