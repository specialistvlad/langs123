          rule: { es: "va pegado al nombre y no admite grado", en: "stands right next to the noun and cannot be graded", uk: "стоїть упритул до іменника і не має ступенів", pt: "fica colado ao substantivo e não admite grau", fr: "se place juste après le nom et n’admet pas de degré", de: "steht direkt beim Nomen und lässt keine Steigerung zu", it: "sta attaccato al sostantivo e non ammette gradazione", pl: "stoi tuż przy rzeczowniku i nie podlega stopniowaniu", tr: "isme bitişik durur ve derecelendirilemez", id: "melekat pada kata benda dan tidak bisa bertingkat", vi: "đứng sát danh từ và không có mức độ" }
          ex: ["Trabajo en una ", { target: "fábrica textil" }, "."]
          tr: { en: "I work in a textile factory.", uk: "Я працюю на текстильній фабриці.", pt: "Trabalho em uma fábrica têxtil.", fr: "Je travaille dans une usine textile.", de: "Ich arbeite in einer Textilfabrik.", it: "Lavoro in una fabbrica tessile.", pl: "Pracuję w fabryce tekstyliów.", tr: "Tekstil fabrikasında çalışıyorum.", id: "Saya bekerja di pabrik tekstil.", vi: "Tôi làm việc ở một nhà máy dệt." }
        - level: C1
