            reading: { es: "Dos lecturas: pasiva, alguien la redujo, o cualidad, es corta.", en: "Two readings: passive, someone shortened it, or quality, it is short.", uk: "Два тлумачення: пасивне — хтось її скоротив, або якість — вона коротка.", pt: "Duas leituras: passiva, alguém a reduziu, ou qualidade, é curta.", fr: "Deux lectures : passive, quelqu’un l’a réduite, ou qualité, elle est courte.", de: "Zwei Lesarten: passiv, jemand hat sie gekürzt, oder Eigenschaft, sie ist kurz.", it: "Due letture: passiva, qualcuno l'ha ridotta, o qualità, è breve.", pl: "Dwie interpretacje: bierna, ktoś ją skrócił, albo cecha, jest krótka.", tr: "İki yorum: edilgen, biri onu kısalttı; ya da nitelik, kısadır.", id: "Dua interpretasi: pasif, seseorang meringkasnya, atau sifat, edisinya ringkas.", vi: "Hai cách hiểu: bị động, có người đã rút gọn nó, hoặc phẩm chất, nó ngắn gọn." }
