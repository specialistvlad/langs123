          rule: { es: [{ pattern: [{ slot: { es: artículo } }, { term: de }, { slot: { es: complemento } }] }, ": sustituye a un nombre conocido"], en: [{ pattern: [{ slot: { en: "article" } }, { term: de }, { slot: { en: "complement" } }] }, ": stands in for a known noun"], uk: [{ pattern: [{ slot: { uk: "артикль" } }, { term: de }, { slot: { uk: "означення" } }] }, ": заступає відомий іменник"], pt: [{ pattern: [{ slot: { pt: "artigo" } }, { term: de }, { slot: { pt: "complemento" } }] }, ": substitui um substantivo conhecido"], fr: [{ pattern: [{ slot: { fr: "article" } }, { term: de }, { slot: { fr: "complément" } }] }, " : remplace un nom connu"], de: [{ pattern: [{ slot: { de: "Artikel" } }, { term: de }, { slot: { de: "Attribut" } }] }, ": ersetzt ein bekanntes Nomen"], it: [{ pattern: [{ slot: { it: "articolo" } }, { term: de }, { slot: { it: "complemento" } }] }, ": sostituisce un sostantivo noto"], pl: [{ pattern: [{ slot: { pl: "przedimek" } }, { term: de }, { slot: { pl: "przydawka" } }] }, ": zastępuje znany rzeczownik"], tr: [{ pattern: [{ slot: { tr: "artikel" } }, { term: de }, { slot: { tr: "tamlayan" } }] }, ": bilinen bir ismin yerini tutar"], id: [{ pattern: [{ slot: { id: "artikel" } }, { term: de }, { slot: { id: "pewatas" } }] }, ": menggantikan kata benda yang sudah dikenal"], vi: [{ pattern: [{ slot: { vi: "mạo từ" } }, { term: de }, { slot: { vi: "định ngữ" } }] }, ": thay cho một danh từ đã biết"] }
          ex: ["Mi bolso es viejo, pero ", { target: "el de Marta" }, " es nuevo."]
