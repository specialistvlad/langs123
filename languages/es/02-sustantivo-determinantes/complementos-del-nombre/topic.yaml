title: { es: "Los complementos del nombre: la chica de los ojos azules", en: "Noun Complements: of-Phrases, Apposition and Ellipsis", uk: "Означення іменника: la chica de los ojos azules", pt: "Os complementos do nome: la chica de los ojos azules", fr: "Les compléments du nom : la chica de los ojos azules", de: "Attribute beim Nomen: la chica de los ojos azules", it: "I complementi del nome: la chica de los ojos azules", pl: "Przydawki rzeczownika: la chica de los ojos azules", tr: "İsmin tamlayanları: la chica de los ojos azules", id: "Pewatas kata benda: la chica de los ojos azules", vi: "Định ngữ của danh từ: la chica de los ojos azules" }
summary:
  lead:
    es: ["Un complemento con ", { term: de }, ", un adjetivo o un participio precisa el nombre; el artículo o el demostrativo lo sustituyen si falta."]
    en: ["A ", { term: de }, " complement, an adjective or a participle specifies the noun; the article or demonstrative replaces a missing noun."]
    uk: ["Означення з ", { term: de }, ", прикметник або дієприкметник уточнює іменник; коли іменника немає, його заступає артикль або вказівний займенник."]
    pt: ["Um complemento com ", { term: de }, ", um adjetivo ou um particípio precisa o substantivo; o artigo ou o demonstrativo o substituem quando ele falta."]
    fr: ["Un complément avec ", { term: de }, ", un adjectif ou un participe précise le nom ; l’article ou le démonstratif le remplace."]
    de: ["Ein Attribut mit ", { term: de }, ", ein Adjektiv oder ein Partizip präzisiert das Nomen; fehlt es, vertreten es Artikel oder Demonstrativpronomen."]
    it: ["Un complemento con ", { term: de }, ", un aggettivo o un participio precisa il sostantivo; l'articolo o il dimostrativo lo sostituiscono quando manca."]
    pl: ["Przydawka z ", { term: de }, ", przymiotnik lub imiesłów określa rzeczownik bliżej; gdy go brak, zastępuje go przedimek lub zaimek wskazujący."]
    tr: ["İsmi, ", { term: de }, " ile kurulan bir tamlayan, bir sıfat ya da bir participio belirginleştirir; isim yoksa yerini artikel veya işaret sözcüğü tutar."]
    id: ["Pewatas dengan ", { term: de }, ", kata sifat, atau partisip memperjelas kata benda; kalau kata benda itu tidak ada, artikel atau kata tunjuk menggantikannya."]
    vi: ["Định ngữ (với ", { term: de }, ", tính từ, phân từ) làm rõ danh từ; mạo từ, từ chỉ định thay danh từ vắng."]
  rule:
    es: "Sin comas, el complemento identifica; entre comas, añade un dato:"
    en: "Without commas, the complement identifies; between commas, it adds a detail:"
    uk: "Без ком означення виокремлює іменник; між комами воно додає деталь:"
    pt: "Sem vírgulas, o complemento identifica; entre vírgulas, acrescenta um dado:"
    fr: "Sans virgules, le complément identifie ; entre virgules, il ajoute une précision :"
    de: "Ohne Kommas identifiziert das Attribut; zwischen Kommas ergänzt es eine Angabe:"
    it: "Senza virgole, il complemento identifica; tra virgole, aggiunge un dato:"
    pl: "Bez przecinków przydawka identyfikuje; między przecinkami dodaje informację:"
    tr: "Virgülsüz tamlayan ismi belirler; virgüllerin arasındaki tamlayan bilgi ekler:"
    id: "Tanpa koma, pewatas mengidentifikasi; di antara koma, pewatas menambah keterangan:"
    vi: "Không dấu phẩy: xác định; có dấu phẩy: thêm thông tin:"
  ex: { examples: [["La chica ", { target: "de los ojos azules" }, " es mi prima."], ["Mi prima, ", { target: "de ojos azules" }, ", vive en Lima."]] }

