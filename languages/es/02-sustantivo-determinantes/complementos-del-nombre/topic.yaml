            rule: { es: "el adjetivo de relación no admite grado", en: "the relational adjective cannot be graded", uk: "відносний прикметник не має ступенів", pt: "o adjetivo de relação não admite grau", fr: "l’adjectif de relation n’admet pas de degré", de: "das Relationsadjektiv lässt keine Steigerung zu", it: "l'aggettivo di relazione non ammette gradazione", pl: "przymiotnik relacyjny nie podlega stopniowaniu", tr: "ilişki sıfatı derecelendirilmez", id: "kata sifat relasional tidak bisa bertingkat", vi: "tính từ quan hệ không có mức độ" }
