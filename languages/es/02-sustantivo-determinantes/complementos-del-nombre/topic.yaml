            rule: { es: "el complemento de materia va antes que el de destino", en: "the material complement comes before the purpose complement", uk: "означення матеріалу стоїть перед означенням призначення", pt: "o complemento de matéria vem antes do complemento de destino", fr: "le complément de matière précède le complément de destination", de: "das Attribut des Materials steht vor dem Attribut des Zwecks", it: "il complemento di materia precede il complemento di destinazione", pl: "przydawka materiału stoi przed przydawką przeznaczenia", tr: "malzeme tamlayanı amaç tamlayanından önce gelir", id: "pewatas bahan mendahului pewatas tujuan", vi: "định ngữ chỉ chất liệu đứng trước định ngữ chỉ mục đích" }
          - level: B2
