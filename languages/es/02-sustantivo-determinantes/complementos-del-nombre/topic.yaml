          rule: { es: "el de materia va antes que el de destino", en: "the material complement comes before the purpose complement", uk: "означення матеріалу стоїть перед означенням призначення", pt: "o de matéria vem antes do de destino", fr: "le complément de matière précède celui de destination", de: "das Attribut des Materials steht vor dem des Zwecks", it: "il complemento di materia precede quello di destinazione", pl: "przydawka materiału stoi przed przydawką przeznaczenia", tr: "malzeme tamlayanı amaç tamlayanından önce gelir", id: "pewatas bahan mendahului pewatas tujuan", vi: "định ngữ chỉ chất liệu đứng trước định ngữ chỉ mục đích" }
          ex: ["Mi hermana vende ", { target: "mesas de madera para niños" }, "."]
          tr: { en: "My sister sells wooden tables for children.", uk: "Моя сестра продає дерев’яні столи для дітей.", pt: "Minha irmã vende mesas de madeira para crianças.", fr: "Ma sœur vend des tables en bois pour enfants.", de: "Meine Schwester verkauft Holztische für Kinder.", it: "Mia sorella vende tavoli di legno per bambini.", pl: "Moja siostra sprzedaje drewniane stoły dla dzieci.", tr: "Kız kardeşim çocuklar için ahşap masalar satıyor.", id: "Saudara perempuan saya menjual meja kayu untuk anak-anak.", vi: "Chị gái tôi bán những chiếc bàn gỗ cho trẻ em." }
