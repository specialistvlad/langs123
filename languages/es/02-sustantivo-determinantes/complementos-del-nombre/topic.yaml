          rule: { es: "el primer nombre da la cualidad del segundo", en: "the first noun gives the quality of the second", uk: "перший іменник дає якість другого", pt: "o primeiro substantivo dá a qualidade do segundo", fr: "le premier nom donne la qualité du second", de: "das erste Nomen gibt die Eigenschaft des zweiten an", it: "il primo sostantivo dà la qualità del secondo", pl: "pierwszy rzeczownik określa cechę drugiego", tr: "birinci isim ikincinin niteliğini verir", id: "kata benda pertama menyatakan sifat kata benda kedua", vi: "danh từ thứ nhất cho biết phẩm chất của danh từ thứ hai" }
          ex: ["Mi vecina es ", { target: "un encanto de persona" }, "."]
          tr: { en: "My neighbour is a gem of a person.", uk: "Моя сусідка — просто чарівна людина.", pt: "Minha vizinha é um encanto de pessoa.", fr: "Ma voisine est un amour de personne.", de: "Meine Nachbarin ist ein Schatz von einem Menschen.", it: "La mia vicina è un incanto di persona.", pl: "Moja sąsiadka to przemiła osoba.", tr: "Komşum çok tatlı bir insan.", id: "Tetangga saya adalah orang yang sangat menyenangkan.", vi: "Cô hàng xóm của tôi là một người rất dễ mến." }
        - level: C2
          point: { es: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, en: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, uk: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, pt: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, fr: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, de: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, it: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, pl: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, tr: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, id: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] }, vi: { pattern: [{ term: un }, { slot: noun }, { term: de }, { slot: noun }] } }
          rule: { es: "con valoración fuerte, equivale a un adjetivo del segundo", en: "with a strong evaluation, it is the same as an adjective on the second noun", uk: "із сильною оцінкою він дорівнює прикметнику при другому іменнику", pt: "com avaliação forte, equivale a um adjetivo do segundo", fr: "avec une forte appréciation, il équivaut à un adjectif du second", de: "bei starker Bewertung entspricht es einem Adjektiv zum zweiten Nomen", it: "con una valutazione forte, equivale a un aggettivo del secondo", pl: "przy mocnej ocenie odpowiada przymiotnikowi przy drugim rzeczowniku", tr: "güçlü bir değerlendirmede ikinci ismin sıfatına eşdeğerdir", id: "dengan penilaian kuat, setara dengan kata sifat bagi kata benda kedua", vi: "khi đánh giá mạnh, nó tương đương một tính từ bổ nghĩa cho danh từ thứ hai" }
          ex: ["Me regalaron ", { target: "un horror de lámpara" }, "."]
          tr: { en: "They gave me a horror of a lamp.", uk: "Мені подарували жахливу лампу.", pt: "Me deram um horror de luminária.", fr: "On m’a offert une horreur de lampe.", de: "Man hat mir ein Gräuel von einer Lampe geschenkt.", it: "Mi hanno regalato un orrore di lampada.", pl: "Dostałem w prezencie koszmarną lampę.", tr: "Bana korkunç bir lamba hediye ettiler.", id: "Mereka memberi saya lampu yang sangat jelek.", vi: "Họ tặng tôi một cái đèn xấu kinh khủng." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["el nombre conserva su preposición ante ", { term: que }], en: ["the noun keeps its preposition before ", { term: que }], uk: ["іменник зберігає свій прийменник перед ", { term: que }], pt: ["o substantivo mantém a preposição diante de ", { term: que }], fr: ["le nom garde sa préposition devant ", { term: que }], de: ["das Nomen behält seine Präposition vor ", { term: que }], it: ["il sostantivo conserva la sua preposizione davanti a ", { term: que }], pl: ["rzeczownik zachowuje swój przyimek przed ", { term: que }], tr: [{ term: que }, " öncesinde isim edatını korur"], id: ["kata benda mempertahankan kata depannya sebelum ", { term: que }], vi: ["danh từ giữ giới từ của nó trước ", { term: que }] }
          ex: [{ target: "El temor de que te vayas" }, " me quita el sueño."]
          tr: { en: "The fear that you will leave keeps me awake.", uk: "Страх, що ти підеш, не дає мені спати.", pt: "O medo de que você vá embora me tira o sono.", fr: "La crainte que tu partes m’empêche de dormir.", de: "Die Angst, dass du gehst, raubt mir den Schlaf.", it: "Il timore che tu te ne vada mi toglie il sonno.", pl: "Obawa, że odejdziesz, odbiera mi sen.", tr: "Gitmenden duyduğum korku uykumu kaçırıyor.", id: "Rasa takut kamu akan pergi membuat saya tidak bisa tidur.", vi: "Nỗi sợ bạn sẽ đi làm tôi mất ngủ." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: "el adjetivo que clasifica va antes que el de origen", en: "the classifying adjective comes before the adjective of origin", uk: "прикметник, що класифікує, стоїть перед прикметником походження", pt: "o adjetivo que classifica vem antes do de origem", fr: "l’adjectif qui classe précède celui d’origine", de: "das klassifizierende Adjektiv steht vor dem der Herkunft", it: "l'aggettivo che classifica precede quello di origine", pl: "przymiotnik klasyfikujący stoi przed przymiotnikiem pochodzenia", tr: "sınıflandıran sıfat köken sıfatından önce gelir", id: "kata sifat yang mengklasifikasi mendahului kata sifat asal", vi: "tính từ phân loại đứng trước tính từ chỉ nguồn gốc" }
          ex: ["Trabaja en la ", { target: "industria textil española" }, "."]
          tr: { en: "She works in the Spanish textile industry.", uk: "Вона працює в іспанській текстильній промисловості.", pt: "Ela trabalha na indústria têxtil espanhola.", fr: "Elle travaille dans l’industrie textile espagnole.", de: "Sie arbeitet in der spanischen Textilindustrie.", it: "Lavora nell'industria tessile spagnola.", pl: "Pracuje w hiszpańskim przemyśle tekstylnym.", tr: "İspanyol tekstil sektöründe çalışıyor.", id: "Dia bekerja di industri tekstil Spanyol.", vi: "Cô ấy làm việc trong ngành dệt may Tây Ban Nha." }

sections:
  - title: { es: El nombre sin núcleo, en: "The omitted noun", uk: "Пропущений іменник", pt: "O substantivo omitido", fr: "Le nom sous-entendu", de: "Das ausgelassene Nomen", it: "Il sostantivo sottinteso", pl: "Pominięty rzeczownik", tr: "Düşürülmüş isim", id: "Kata benda yang dilesapkan", vi: "Danh từ bị lược bỏ" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { es: Estructura, en: "Pattern", uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: meaning, label: { es: Significado, en: "Meaning", uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            form: { pattern: [{ slot: { es: demostrativo, en: "demonstrative", uk: "вказівний займенник", pt: "demonstrativo", fr: "démonstratif", de: "Demonstrativpronomen", it: "dimostrativo", pl: "zaimek wskazujący", tr: "işaret sözcüğü", id: "kata tunjuk", vi: "từ chỉ định" } }, { term: de }, { slot: { es: complemento, en: "complement", uk: "означення", pt: "complemento", fr: "complément", de: "Attribut", it: "complemento", pl: "przydawka", tr: "tamlayan", id: "pewatas", vi: "định ngữ" } }] }
            meaning: { es: "El demostrativo señala uno entre varios, y el contexto da el nombre.", en: "The demonstrative points to one among several, and the context supplies the noun.", uk: "Вказівний займенник виділяє один із кількох, а іменник видно з контексту.", pt: "O demonstrativo indica um entre vários, e o contexto fornece o substantivo.", fr: "Le démonstratif désigne l’un parmi plusieurs, et le contexte donne le nom.", de: "Das Demonstrativpronomen zeigt auf eines von mehreren, und der Kontext liefert das Nomen.", it: "Il dimostrativo indica uno tra tanti, e il contesto fornisce il sostantivo.", pl: "Zaimek wskazujący wybiera jeden spośród kilku, a rzeczownik wynika z kontekstu.", tr: "İşaret sözcüğü birkaçından birini gösterir; ismi bağlam verir.", id: "Kata tunjuk menunjuk satu di antara beberapa, dan konteks memberi tahu kata bendanya.", vi: "Từ chỉ định chỉ một trong nhiều, và ngữ cảnh cho biết danh từ." }
            ex: ["En la foto, ", { target: "ese de la camisa roja" }, " es mi tío."]
            tr: { en: "In the photo, that one in the red shirt is my uncle.", uk: "На фото той, у червоній сорочці, — мій дядько.", pt: "Na foto, esse da camisa vermelha é meu tio.", fr: "Sur la photo, celui à la chemise rouge est mon oncle.", de: "Auf dem Foto ist der mit dem roten Hemd mein Onkel.", it: "Nella foto, quello con la camicia rossa è mio zio.", pl: "Na zdjęciu ten w czerwonej koszuli to mój wujek.", tr: "Fotoğrafta kırmızı gömlekli olan amcam.", id: "Di foto itu, yang memakai kemeja merah adalah paman saya.", vi: "Trong ảnh, người mặc áo sơ mi đỏ kia là chú tôi." }
          - level: B2
            form: { pattern: [{ slot: { es: artículo, en: "article", uk: "артикль", pt: "artigo", fr: "article", de: "Artikel", it: "articolo", pl: "przedimek", tr: "artikel", id: "artikel", vi: "mạo từ" } }, { term: de }, { slot: { es: complemento, en: "complement", uk: "означення", pt: "complemento", fr: "complément", de: "Attribut", it: "complemento", pl: "przydawka", tr: "tamlayan", id: "pewatas", vi: "định ngữ" } }] }
            meaning: { es: "El artículo retoma un nombre que ya se dijo.", en: "The article picks up a noun already mentioned.", uk: "Артикль підхоплює іменник, який уже згадували.", pt: "O artigo retoma um substantivo já mencionado.", fr: "L’article reprend un nom déjà mentionné.", de: "Der Artikel greift ein schon genanntes Nomen wieder auf.", it: "L'articolo riprende un sostantivo già detto.", pl: "Przedimek wraca do rzeczownika, który już padł.", tr: "Artikel, daha önce söylenmiş bir ismi yeniden alır.", id: "Artikel mengambil kembali kata benda yang sudah disebut.", vi: "Mạo từ lấy lại một danh từ đã nói trước đó." }
            ex: ["Mi bolso es viejo, pero ", { target: "el de Marta" }, " es nuevo."]
            tr: { en: "My bag is old, but Marta's is new.", uk: "Моя сумка стара, а Мартина — нова.", pt: "Minha bolsa é velha, mas a da Marta é nova.", fr: "Mon sac est vieux, mais celui de Marta est neuf.", de: "Meine Tasche ist alt, aber Martas ist neu.", it: "La mia borsa è vecchia, ma quella di Marta è nuova.", pl: "Moja torba jest stara, ale ta Marty jest nowa.", tr: "Benim çantam eski, ama Marta’nınki yeni.", id: "Tas saya sudah tua, tetapi milik Marta masih baru.", vi: "Túi của tôi đã cũ, còn túi của Marta thì mới." }
          - level: C1
            form: { pattern: [{ slot: { es: artículo, en: "article", uk: "артикль", pt: "artigo", fr: "article", de: "Artikel", it: "articolo", pl: "przedimek", tr: "artikel", id: "artikel", vi: "mạo từ" } }, { term: de }, { slot: { es: complemento, en: "complement", uk: "означення", pt: "complemento", fr: "complément", de: "Attribut", it: "complemento", pl: "przydawka", tr: "tamlayan", id: "pewatas", vi: "định ngữ" } }, { term: ser }, { slot: { es: atributo, en: "subject complement", uk: "іменна частина присудка", pt: "predicativo", fr: "attribut", de: "Prädikativ", it: "predicativo", pl: "orzecznik", tr: "ad yüklemi", id: "pelengkap subjek", vi: "vị ngữ" } }] }
            meaning: { es: "El nombre no se dijo antes: lo da el atributo que sigue.", en: "The noun was not mentioned before: the subject complement that follows names it.", uk: "Іменник раніше не називали: його дає іменна частина присудка, що йде далі.", pt: "O substantivo não foi dito antes: quem o dá é o predicativo que segue.", fr: "Le nom n’a pas été dit avant : c’est l’attribut qui suit qui le donne.", de: "Das Nomen wurde vorher nicht genannt: das folgende Prädikativ liefert es.", it: "Il sostantivo non è stato detto prima: lo fornisce il predicativo che segue.", pl: "Rzeczownik nie padł wcześniej: podaje go orzecznik, który następuje.", tr: "İsim daha önce söylenmedi; onu sonra gelen ad yüklemi verir.", id: "Kata benda belum disebut sebelumnya: pelengkap subjek yang mengikutinya menyebutkannya.", vi: "Danh từ chưa được nói trước đó: vị ngữ đứng sau cho biết danh từ." }
            ex: [{ target: "El de camarero" }, " es un trabajo duro."]
            tr: { en: "The waiter's job is a hard one.", uk: "Робота офіціанта — важка праця.", pt: "O de garçom é um trabalho duro.", fr: "Celui de serveur est un métier dur.", de: "Der Beruf des Kellners ist harte Arbeit.", it: "Quello da cameriere è un lavoro duro.", pl: "Zawód kelnera to ciężka praca.", tr: "Garsonluk zor bir iştir.", id: "Pekerjaan sebagai pelayan itu berat.", vi: "Nghề phục vụ bàn là một công việc vất vả." }
          - level: C1
            form: { pattern: [{ term: el }, { slot: infinitive }, { term: de }, { slot: { es: complemento, en: "complement", uk: "означення", pt: "complemento", fr: "complément", de: "Attribut", it: "complemento", pl: "przydawka", tr: "tamlayan", id: "pewatas", vi: "định ngữ" } }] }
            meaning: { es: "El infinitivo hace de sustantivo y admite un complemento con de.", en: "The infinitive works as a noun and takes a complement with de.", uk: "Інфінітив виконує роль іменника й має означення з de.", pt: "O infinitivo faz o papel de substantivo e admite um complemento com de.", fr: "L’infinitif joue le rôle d’un nom et admet un complément avec de.", de: "Der Infinitiv wirkt wie ein Nomen und lässt ein Attribut mit de zu.", it: "L'infinito fa da sostantivo e ammette un complemento con de.", pl: "Bezokolicznik pełni funkcję rzeczownika i przyjmuje przydawkę z de.", tr: "Mastar isim görevi görür ve de ile kurulan bir tamlayan alabilir.", id: "Infinitif berfungsi sebagai kata benda dan dapat memiliki pewatas dengan de.", vi: "Nguyên mẫu đóng vai trò danh từ và có thể mang định ngữ với de." }
            ex: [{ target: "El cantar de los pájaros" }, " me despierta cada mañana."]
            tr: { en: "The singing of the birds wakes me every morning.", uk: "Спів птахів будить мене щоранку.", pt: "O cantar dos pássaros me acorda toda manhã.", fr: "Le chant des oiseaux me réveille chaque matin.", de: "Der Gesang der Vögel weckt mich jeden Morgen.", it: "Il canto degli uccelli mi sveglia ogni mattina.", pl: "Śpiew ptaków budzi mnie każdego ranka.", tr: "Kuşların cıvıltısı beni her sabah uyandırır.", id: "Kicauan burung membangunkan saya setiap pagi.", vi: "Tiếng hót của chim đánh thức tôi mỗi sáng." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: "El artículo o el demostrativo concuerda en género y número con el nombre que falta:", en: "The article or the demonstrative agrees in gender and number with the missing noun:", uk: "Артикль або вказівний займенник узгоджується в роді й числі з пропущеним іменником:", pt: "O artigo ou o demonstrativo concorda em gênero e número com o substantivo que falta:", fr: "L’article ou le démonstratif s’accorde en genre et en nombre avec le nom qui manque :", de: "Artikel oder Demonstrativpronomen richtet sich in Genus und Numerus nach dem fehlenden Nomen:", it: "L'articolo o il dimostrativo concorda in genere e numero con il sostantivo che manca:", pl: "Przedimek lub zaimek wskazujący zgadza się w rodzaju i liczbie z brakującym rzeczownikiem:", tr: "Artikel ya da işaret sözcüğü, eksik ismin cinsiyetine ve sayısına uyar:", id: "Artikel atau kata tunjuk menyesuaikan diri dengan kata benda yang hilang dalam gender dan jumlah:", vi: "Mạo từ hoặc từ chỉ định hòa hợp về giống và số với danh từ bị lược:" }
            ex: ["Mis botas son nuevas; ", { target: "las de Ana" }, " son viejas."]
            tr: { en: "My boots are new; Ana's are old.", uk: "Мої чоботи нові, а Анині — старі.", pt: "Minhas botas são novas; as da Ana são velhas.", fr: "Mes bottes sont neuves ; celles d’Ana sont vieilles.", de: "Meine Stiefel sind neu; Anas sind alt.", it: "I miei stivali sono nuovi; quelli di Ana sono vecchi.", pl: "Moje buty są nowe, a buty Any są stare.", tr: "Botlarım yeni; Ana’nınkiler eski.", id: "Sepatu bot saya baru; milik Ana sudah tua.", vi: "Đôi ủng của tôi mới; đôi của Ana thì cũ." }

  - title: { es: Complementos con de, en: "Complements with de", uk: "Означення з de", pt: "Complementos com de", fr: "Compléments avec de", de: "Attribute mit de", it: "Complementi con de", pl: "Przydawki z de", tr: "de ile kurulan tamlayanlar", id: "Pewatas dengan de", vi: "Định ngữ với de" }
    role: own
    content:
      - type: comparison
        columns:
          - { key: kind, label: { es: Complemento, en: "Complement", uk: "Означення", pt: "Complemento", fr: "Complément", de: "Attribut", it: "Complemento", pl: "Przydawka", tr: "Tamlayan", id: "Pewatas", vi: "Định ngữ" } }
          - { key: reading, label: { es: Lectura, en: "Reading", uk: "Тлумачення", pt: "Leitura", fr: "Lecture", de: "Lesart", it: "Lettura", pl: "Interpretacja", tr: "Yorum", id: "Interpretasi", vi: "Cách hiểu" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            kind: { pattern: [{ slot: { es: posesivo, en: "possessive", uk: "присвійний займенник", pt: "possessivo", fr: "possessif", de: "Possessivbegleiter", it: "possessivo", pl: "zaimek dzierżawczy", tr: "iyelik", id: "kata ganti kepemilikan", vi: "tính từ sở hữu" } }, { slot: noun }] }
            reading: { es: "Subjetiva, objetiva o posesiva: las hiciste tú, te muestran a ti o son tuyas.", en: "Subjective, objective or possessive: you made them, they show you, or they are yours.", uk: "Суб’єктне, об’єктне або присвійне: ти їх зробив, вони зображають тебе або вони твої.", pt: "Subjetiva, objetiva ou possessiva: você as fez, elas mostram você ou são suas.", fr: "Subjective, objective ou possessive : c’est toi qui les as faites, elles te montrent ou elles sont à toi.", de: "Subjektiv, objektiv oder possessiv: du hast sie gemacht, sie zeigen dich oder sie gehören dir.", it: "Soggettiva, oggettiva o possessiva: le hai fatte tu, ti mostrano o sono tue.", pl: "Podmiotowa, przedmiotowa lub dzierżawcza: ty je zrobiłeś, pokazują ciebie albo są twoje.", tr: "Özneli, nesneli ya da iyelik: onları sen çektin, seni gösteriyorlar ya da senin.", id: "Subjektif, objektif, atau posesif: kamu yang membuatnya, foto itu menunjukkan kamu, atau itu milikmu.", vi: "Chủ thể, đối tượng hoặc sở hữu: bạn chụp chúng, chúng chụp bạn, hoặc chúng là của bạn." }
            ex: ["Encontré ", { target: "tus fotos" }, " en el sobre."]
            tr: { en: "I found your photos in the envelope.", uk: "Я знайшов твої фотографії в конверті.", pt: "Encontrei suas fotos no envelope.", fr: "J’ai trouvé tes photos dans l’enveloppe.", de: "Ich habe deine Fotos im Umschlag gefunden.", it: "Ho trovato le tue foto nella busta.", pl: "Znalazłem twoje zdjęcia w kopercie.", tr: "Zarfta senin fotoğraflarını buldum.", id: "Saya menemukan fotomu di dalam amplop.", vi: "Tôi tìm thấy ảnh của bạn trong phong bì." }
          - level: B2
            kind: { pattern: [{ slot: noun }, { term: de }, { slot: { es: pronombre, en: "pronoun", uk: "займенник", pt: "pronome", fr: "pronom", de: "Pronomen", it: "pronome", pl: "zaimek", tr: "zamir", id: "kata ganti", vi: "đại từ" } }] }
            reading: { es: "Solo objetiva: las fotos te muestran a ti.", en: "Objective only: the photos show you.", uk: "Лише об’єктне: на фото зображено тебе.", pt: "Só objetiva: as fotos mostram você.", fr: "Seulement objective : les photos te montrent.", de: "Nur objektiv: die Fotos zeigen dich.", it: "Solo oggettiva: le foto ti mostrano.", pl: "Tylko przedmiotowa: zdjęcia pokazują ciebie.", tr: "Yalnızca nesneli: fotoğraflar seni gösteriyor.", id: "Hanya objektif: foto itu menunjukkan kamu.", vi: "Chỉ có nghĩa đối tượng: các bức ảnh chụp bạn." }
