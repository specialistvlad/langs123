          rule: { es: "lectura pasiva, como una oración de relativo", en: "passive reading, like a relative clause", uk: "пасивне тлумачення, як в означальному підрядному реченні", pt: "leitura passiva, como uma oração relativa", fr: "lecture passive, comme une proposition relative", de: "passive Lesart, wie bei einem Relativsatz", it: "lettura passiva, come una proposizione relativa", pl: "interpretacja bierna, jak w zdaniu względnym", tr: "edilgen yorum, bir ilgi cümlesi gibi", id: "interpretasi pasif, seperti klausa relatif", vi: "cách hiểu bị động, như một mệnh đề quan hệ" }
          ex: ["Los candidatos ", { target: elegidos }, " reciben un diploma."]
