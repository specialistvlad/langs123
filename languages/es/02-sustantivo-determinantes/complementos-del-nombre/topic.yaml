          rule: { es: "el complemento añade un dato y no identifica", en: "the complement adds a detail and does not identify the noun", uk: "означення додає деталь і не виокремлює іменник", pt: "o complemento acrescenta um dado e não identifica", fr: "le complément ajoute une précision et n’identifie pas", de: "das Attribut fügt eine Angabe hinzu und identifiziert nicht", it: "il complemento aggiunge un dato e non identifica", pl: "przydawka dodaje informację i nie identyfikuje rzeczownika", tr: "tamlayan bilgi ekler, ismi belirlemez", id: "pewatas menambah keterangan dan tidak mengidentifikasi", vi: "định ngữ thêm một thông tin và không xác định danh từ" }
