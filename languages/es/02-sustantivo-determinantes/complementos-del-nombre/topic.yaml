          tr: { en: "My grandfather, with white hair, lives in Cuenca.", uk: "Мій дід, з білим волоссям, живе в Куенці.", pt: "Meu avô, de cabelo branco, mora em Cuenca.", fr: "Mon grand-père, aux cheveux blancs, habite à Cuenca.", de: "Mein Großvater, weißhaarig, wohnt in Cuenca.", it: "Mio nonno, dai capelli bianchi, vive a Cuenca.", pl: "Mój dziadek, siwowłosy, mieszka w Cuence.", tr: "Dedem, beyaz saçlı, Cuenca’da yaşıyor.", id: "Kakek saya, berambut putih, tinggal di Cuenca.", vi: "Ông tôi, tóc bạc, sống ở Cuenca." }
        - level: B2
