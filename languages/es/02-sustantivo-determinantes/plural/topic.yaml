      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The article and the adjective go plural with the noun:"
              es: "El artículo y el adjetivo van en plural con el sustantivo:"
              uk: "Артикль і прикметник стають у множину разом з іменником:"
              pt: "O artigo e o adjetivo vão para o plural junto com o substantivo:"
              fr: "L’article et l’adjectif se mettent au pluriel avec le nom :"
              de: "Artikel und Adjektiv stehen mit dem Nomen im Plural:"
              it: "L'articolo e l'aggettivo vanno al plurale insieme al sostantivo:"
              pl: "Przedimek i przymiotnik przyjmują liczbę mnogą razem z rzeczownikiem:"
              tr: "Artikel ve sıfat, isimle birlikte çoğul olur:"
              id: "Artikel dan kata sifat ikut menjadi jamak bersama kata benda:"
              vi: "Mạo từ và tính từ cũng chuyển sang số nhiều cùng với danh từ:"
            ex: [{ target: Los }, " zapatos ", { target: nuevos }, " son caros."]
            tr: { en: The new shoes are expensive., uk: Нові черевики дорогі., pt: "Os sapatos novos são caros.", fr: "Les chaussures neuves sont chères.", de: "Die neuen Schuhe sind teuer.", it: "Le scarpe nuove sono care.", pl: "Nowe buty są drogie.", tr: "Yeni ayakkabılar pahalı.", id: "Sepatu-sepatu baru itu mahal.", vi: "Những đôi giày mới rất đắt." }
          - type: rule
            level: A2
            text:
              en: ["With an unchanged noun, the article shows the number: ", { mapping: [{ term: el lunes }, { term: los lunes }] }, "."]
              es: ["Cuando el sustantivo no cambia, el artículo indica el número: ", { mapping: [{ term: el lunes }, { term: los lunes }] }, "."]
              uk: ["Коли іменник не змінюється, число показує артикль: ", { mapping: [{ term: el lunes }, { term: los lunes }] }, "."]
              pt: ["Quando o substantivo não muda, o artigo indica o número: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              fr: ["Quand le nom ne change pas, l’article indique le nombre : ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              de: ["Ändert sich das Nomen nicht, zeigt der Artikel den Numerus an: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              it: ["Quando il sostantivo non cambia, l'articolo indica il numero: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              pl: ["Gdy rzeczownik się nie zmienia, liczbę wskazuje przedimek: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              tr: ["İsim değişmediğinde sayıyı artikel gösterir: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              id: ["Jika kata benda tidak berubah, artikel menunjukkan jumlahnya: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
              vi: ["Khi danh từ không đổi, mạo từ cho biết số: ", { mapping: [{ term: "el lunes" }, { term: "los lunes" }] }, "."]
            ex: [{ target: Los }, " lunes tengo clase."]
            tr: { en: I have class on Mondays., uk: По понеділках у мене заняття., pt: "Às segundas-feiras tenho aula.", fr: "Le lundi, j’ai cours.", de: "Montags habe ich Unterricht.", it: "Il lunedì ho lezione.", pl: "W poniedziałki mam zajęcia.", tr: "Pazartesi günleri dersim var.", id: "Pada hari Senin saya ada kelas.", vi: "Các ngày thứ Hai tôi có lớp." }
          - type: note
            level: A1
            text:
              en: ["A group of men and women takes the masculine plural: see ", { link: Gender, to: es.sustantivo-determinantes.genero }, "."]
              es: ["Un grupo de hombres y mujeres lleva el masculino plural: ver ", { link: El género, to: es.sustantivo-determinantes.genero }, "."]
              uk: ["Для групи з чоловіків і жінок вживають чоловічий рід множини: див. ", { link: Рід, to: es.sustantivo-determinantes.genero }, "."]
              pt: ["Um grupo de homens e mulheres leva o masculino plural: ver ", { link: "O gênero", to: "es.sustantivo-determinantes.genero" }, "."]
              fr: ["Un groupe d’hommes et de femmes prend le masculin pluriel : voir ", { link: "Le genre", to: "es.sustantivo-determinantes.genero" }, "."]
              de: ["Eine Gruppe aus Männern und Frauen steht im Maskulinum Plural: siehe ", { link: "Das Genus", to: "es.sustantivo-determinantes.genero" }, "."]
              it: ["Un gruppo di uomini e donne prende il maschile plurale: vedi ", { link: "Il genere", to: "es.sustantivo-determinantes.genero" }, "."]
              pl: ["Grupa mężczyzn i kobiet przyjmuje rodzaj męski w liczbie mnogiej: zob. ", { link: "Rodzaj", to: "es.sustantivo-determinantes.genero" }, "."]
              tr: ["Erkeklerden ve kadınlardan oluşan bir grup eril çoğul alır: bkz. ", { link: "Cinsiyet", to: "es.sustantivo-determinantes.genero" }, "."]
              id: ["Kelompok pria dan wanita memakai maskulin jamak: lihat ", { link: "Gender", to: "es.sustantivo-determinantes.genero" }, "."]
              vi: ["Một nhóm gồm nam và nữ dùng giống đực số nhiều: xem ", { link: "Giống", to: "es.sustantivo-determinantes.genero" }, "."]
          - type: note
            level: B2
            text:
              es: ["Varias palabras en ", { term: -í }, " y ", { term: -ú }, " admiten las dos formas: ", { equivalence: [{ term: esquís }, { term: esquíes }] }, "."]

  - title: { en: "Spelling: the written accent", es: "Ortografía: la tilde", uk: "Правопис: знак наголосу", pt: "Ortografia: o acento gráfico", fr: "Orthographe : l’accent écrit", de: "Schreibung: das Akzentzeichen", it: "Ortografia: l'accento scritto", pl: "Pisownia: znak akcentu", tr: "Yazım: vurgu işareti", id: "Ejaan: tanda aksen", vi: "Chính tả: dấu nhấn" }
