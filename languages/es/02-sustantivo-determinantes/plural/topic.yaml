            meaning: { es: lo que queda de algo destruido o de una persona muerta, en: "what is left of something destroyed or of a dead person", uk: "те, що залишилося від зруйнованого або від померлої людини", pt: "o que resta de algo destruído ou de uma pessoa morta", fr: "ce qui reste de quelque chose de détruit ou d’une personne morte", de: "was von etwas Zerstörtem oder von einem Toten übrig ist", it: "ciò che resta di qualcosa di distrutto o di una persona morta", pl: "to, co zostało po czymś zniszczonym lub po zmarłej osobie", tr: "yıkılmış bir şeyden ya da ölmüş bir kişiden geriye kalanlar", id: "apa yang tersisa dari sesuatu yang hancur atau dari orang yang telah meninggal", vi: "những gì còn lại của vật bị phá hủy hoặc của người đã chết" }
