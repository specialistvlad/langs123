      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The plural keeps the stress on the same syllable, and the written accent comes or goes to show it."
              es: "El plural mantiene el acento en la misma sílaba, y la tilde aparece o desaparece para marcarlo."
              uk: "У множині наголос лишається на тому самому складі, а знак наголосу з’являється або зникає, щоб це показати."
              pt: "O plural mantém a sílaba tônica no mesmo lugar, e o acento gráfico aparece ou desaparece para marcá-la."
              fr: "Le pluriel garde l’accent tonique sur la même syllabe, et l’accent écrit apparaît ou disparaît pour le marquer."
              de: "Der Plural behält die Betonung auf derselben Silbe, und das Akzentzeichen kommt hinzu oder fällt weg, um sie zu markieren."
              it: "Il plurale mantiene l'accento sulla stessa sillaba, e l'accento scritto compare o scompare per segnalarlo."
              pl: "W liczbie mnogiej akcent pada na tę samą sylabę, a znak akcentu pojawia się lub znika, aby to zaznaczyć."
              tr: "Çoğulda vurgu aynı hecede kalır; bunu göstermek için vurgu işareti eklenir ya da düşer."
              id: "Dalam bentuk jamak, tekanan tetap pada suku kata yang sama, dan tanda aksen muncul atau hilang untuk menandainya."
              vi: "Ở số nhiều, trọng âm vẫn rơi vào cùng âm tiết, và dấu nhấn xuất hiện hoặc biến mất để đánh dấu điều đó."
