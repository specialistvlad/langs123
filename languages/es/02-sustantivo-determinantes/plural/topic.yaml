            ex: ["Los ", { target: García }, " viven en Quito."]
            tr: { en: "The Garcías live in Quito.", uk: "Гарсії живуть у Кіто.", pt: "Os García moram em Quito.", fr: "Les García habitent à Quito.", de: "Die Garcías wohnen in Quito.", it: "I García vivono a Quito.", pl: "Garciowie mieszkają w Quito.", tr: "García ailesi Quito’da yaşıyor.", id: "Keluarga García tinggal di Quito.", vi: "Gia đình García sống ở Quito." }

