summary:
  lead:
    en: ["A noun in a vowel adds -s, ", { term: casas }, "; a noun in a consonant adds -es, ", { term: ciudades }, "; and -z becomes -ces, ", { term: lápices }, "."]
    es: ["El sustantivo en vocal añade -s, ", { term: casas }, "; en consonante añade -es, ", { term: ciudades }, "; y la -z pasa a -ces, ", { term: lápices }, "."]
    uk: ["Іменник на голосний додає -s, ", { term: casas }, "; іменник на приголосний додає -es, ", { term: ciudades }, "; а -z змінюється на -ces, ", { term: lápices }, "."]
    pt: ["O substantivo terminado em vogal acrescenta -s, ", { term: "casas" }, "; terminado em consoante acrescenta -es, ", { term: "ciudades" }, "; e o -z passa a -ces, ", { term: "lápices" }, "."]
    fr: ["Un nom terminé par une voyelle prend -s, ", { term: "casas" }, " ; terminé par une consonne, il prend -es, ", { term: "ciudades" }, " ; et le -z devient -ces, ", { term: "lápices" }, "."]
    de: ["Ein Nomen auf Vokal erhält -s, ", { term: "casas" }, "; auf Konsonant erhält es -es, ", { term: "ciudades" }, "; und -z wird zu -ces, ", { term: "lápices" }, "."]
    it: ["Il sostantivo che finisce in vocale aggiunge -s, ", { term: "casas" }, "; in consonante aggiunge -es, ", { term: "ciudades" }, "; e la -z diventa -ces, ", { term: "lápices" }, "."]
    pl: ["Rzeczownik zakończony samogłoską dodaje -s, ", { term: "casas" }, "; zakończony spółgłoską dodaje -es, ", { term: "ciudades" }, "; a -z zmienia się w -ces, ", { term: "lápices" }, "."]
    tr: ["Ünlüyle biten isim -s alır, ", { term: "casas" }, "; ünsüzle biten isim -es alır, ", { term: "ciudades" }, "; -z ise -ces olur, ", { term: "lápices" }, "."]
    id: ["Kata benda berakhiran vokal menambahkan -s, ", { term: "casas" }, "; berakhiran konsonan menambahkan -es, ", { term: "ciudades" }, "; dan -z menjadi -ces, ", { term: "lápices" }, "."]
    vi: ["Danh từ tận cùng bằng nguyên âm thêm -s, ", { term: "casas" }, "; tận cùng bằng phụ âm thêm -es, ", { term: "ciudades" }, "; còn -z đổi thành -ces, ", { term: "lápices" }, "."]
  rule:
    en: "The article and the adjective go plural with the noun:"
    es: "El artículo y el adjetivo van en plural con el sustantivo:"
    uk: "Артикль і прикметник стають у множину разом з іменником:"
    pt: "O artigo e o adjetivo vão para o plural junto com o substantivo:"
    fr: "L’article et l’adjectif se mettent au pluriel avec le nom :"
    de: "Artikel und Adjektiv stehen mit dem Nomen im Plural:"
    it: "L'articolo e l'aggettivo vanno al plurale insieme al sostantivo:"
    pl: "Przedimek i przymiotnik przyjmują liczbę mnogą razem z rzeczownikiem:"
    tr: "Artikel ve sıfat, isimle birlikte çoğul olur:"
    id: "Artikel dan kata sifat ikut menjadi jamak bersama kata benda:"
    vi: "Mạo từ và tính từ cũng chuyển sang số nhiều cùng với danh từ:"
  ex: { examples: [[{ target: las }, " casas ", { target: blancas }], [{ target: los }, " lápices ", { target: rojos }]] }

