        rows:
          - level: A2
            change: { en: "-ón, -és lose the accent", es: "-ón, -és pierden la tilde", uk: "-ón, -és втрачають знак наголосу", pt: "-ón, -és perdem o acento gráfico", fr: "-ón, -és perdent l’accent écrit", de: "-ón, -és verlieren das Akzentzeichen", it: "-ón, -és perdono l'accento scritto", pl: "-ón, -és tracą znak akcentu", tr: "-ón, -és vurgu işaretini kaybeder", id: "-ón, -és kehilangan tanda aksen", vi: "-ón, -és mất dấu nhấn" }
            ex: { examples: [{ mapping: [canción, { target: canciones }] }, { mapping: [inglés, { target: ingleses }] }] }
            tr: { en: { examples: [songs, English people] }, uk: { examples: [пісні, англійці] }, pt: { examples: ["canções", "ingleses"] }, fr: { examples: ["chansons", "Anglais"] }, de: { examples: ["Lieder", "Engländer"] }, it: { examples: ["canzoni", "inglesi"] }, pl: { examples: ["piosenki", "Anglicy"] }, tr: { examples: ["şarkılar", "İngilizler"] }, id: { examples: ["lagu-lagu", "orang Inggris"] }, vi: { examples: ["những bài hát", "người Anh"] } }
          - level: A2
            change: { en: "-en stressed on the next-to-last syllable gains an accent", es: "-en con el acento en la penúltima sílaba gana tilde", uk: "-en з наголосом на передостанньому складі отримує знак наголосу", pt: "-en com a sílaba tônica na penúltima sílaba ganha acento gráfico", fr: "-en accentué sur l’avant-dernière syllabe reçoit un accent écrit", de: "-en mit Betonung auf der vorletzten Silbe erhält ein Akzentzeichen", it: "-en con l'accento sulla penultima sillaba prende l'accento scritto", pl: "-en z akcentem na przedostatniej sylabie dostaje znak akcentu", tr: "sondan bir önceki hecesi vurgulu -en, vurgu işareti alır", id: "-en dengan tekanan pada suku kata kedua dari belakang mendapat tanda aksen", vi: "-en nhấn ở âm tiết áp chót thì thêm dấu nhấn" }
            ex: { examples: [{ mapping: [joven, { target: jóvenes }] }, { mapping: [examen, { target: exámenes }] }] }
            tr: { en: { examples: [young people, exams] }, uk: { examples: [молодь, іспити] }, pt: { examples: ["jovens", "exames"] }, fr: { examples: ["jeunes", "examens"] }, de: { examples: ["Jugendliche", "Prüfungen"] }, it: { examples: ["giovani", "esami"] }, pl: { examples: ["młodzi ludzie", "egzaminy"] }, tr: { examples: ["gençler", "sınavlar"] }, id: { examples: ["anak muda", "ujian"] }, vi: { examples: ["những người trẻ", "những kỳ thi"] } }
          - level: C1
            change: { es: "excepción: el acento pasa a la sílaba siguiente" }
            ex: { examples: [{ mapping: [carácter, { target: caracteres }] }, { mapping: [régimen, { target: regímenes }] }, { mapping: [espécimen, { target: especímenes }] }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The plural keeps the stress on the same syllable, and the written accent comes or goes to show it."
              es: "El plural mantiene el acento en la misma sílaba, y la tilde aparece o desaparece para marcarlo."
              uk: "У множині наголос лишається на тому самому складі, а знак наголосу з’являється або зникає, щоб це показати."
              pt: "O plural mantém a sílaba tônica no mesmo lugar, e o acento gráfico aparece ou desaparece para marcá-la."
              fr: "Le pluriel garde l’accent tonique sur la même syllabe, et l’accent écrit apparaît ou disparaît pour le marquer."
              de: "Der Plural behält die Betonung auf derselben Silbe, und das Akzentzeichen kommt hinzu oder fällt weg, um sie zu markieren."
              it: "Il plurale mantiene l'accento sulla stessa sillaba, e l'accento scritto compare o scompare per segnalarlo."
              pl: "W liczbie mnogiej akcent pada na tę samą sylabę, a znak akcentu pojawia się lub znika, aby to zaznaczyć."
              tr: "Çoğulda vurgu aynı hecede kalır; bunu göstermek için vurgu işareti eklenir ya da düşer."
              id: "Dalam bentuk jamak, tekanan tetap pada suku kata yang sama, dan tanda aksen muncul atau hilang untuk menandainya."
              vi: "Ở số nhiều, trọng âm vẫn rơi vào cùng âm tiết, và dấu nhấn xuất hiện hoặc biến mất để đánh dấu điều đó."
          - type: note
            level: A2
            text:
              en: ["The rules of the written accent: see ", { link: Sounds and Stress, to: es.fundamentos.pronunciacion-acentuacion }, "."]
              es: ["Las reglas de la tilde: ver ", { link: Pronunciación y acentuación, to: es.fundamentos.pronunciacion-acentuacion }, "."]
              uk: ["Правила знака наголосу: див. ", { link: Звуки й наголос, to: es.fundamentos.pronunciacion-acentuacion }, "."]
              pt: ["As regras do acento gráfico: ver ", { link: "Pronúncia e acentuação", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              fr: ["Les règles de l’accent écrit : voir ", { link: "Prononciation et accentuation", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              de: ["Die Regeln für das Akzentzeichen: siehe ", { link: "Aussprache und Betonung", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              it: ["Le regole dell'accento scritto: vedi ", { link: "Pronuncia e accentazione", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              pl: ["Zasady użycia znaku akcentu: zob. ", { link: "Wymowa i akcentuacja", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              tr: ["Vurgu işaretinin kuralları: bkz. ", { link: "Telaffuz ve vurgu", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              id: ["Aturan tanda aksen: lihat ", { link: "Pelafalan dan penekanan", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]
              vi: ["Quy tắc về dấu nhấn: xem ", { link: "Phát âm và trọng âm", to: "es.fundamentos.pronunciacion-acentuacion" }, "."]

