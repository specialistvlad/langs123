cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило, pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: A1
          point: { term: mucho }
          rule: { en: "a lot of; agrees with the noun", es: "gran cantidad; concuerda con el sustantivo", uk: "багато; узгоджується з іменником", pt: "grande quantidade; concorda com o substantivo", fr: "grande quantité ; s’accorde avec le nom", de: "große Menge; richtet sich nach dem Nomen", it: "grande quantità; concorda con il sostantivo", pl: "duża ilość; zgadza się z rzeczownikiem", tr: "çok miktar; isimle uyum sağlar", id: "jumlah besar; menyesuaikan diri dengan kata benda", vi: "số lượng lớn; hòa hợp với danh từ" }
          ex: { examples: [[{ target: mucha }, " agua"], [{ target: muchos }, " libros"]] }
          tr: { en: { examples: [a lot of water, a lot of books] }, uk: { examples: [багато води, багато книжок] }, pt: { examples: ["muita água", "muitos livros"] }, fr: { examples: ["beaucoup d’eau", "beaucoup de livres"] }, de: { examples: ["viel Wasser", "viele Bücher"] }, it: { examples: ["molta acqua", "molti libri"] }, pl: { examples: ["dużo wody", "dużo książek"] }, tr: { examples: ["çok su", "çok kitap"] }, id: { examples: ["banyak air", "banyak buku"] }, vi: { examples: ["nhiều nước", "nhiều sách"] } }
        - level: A1
