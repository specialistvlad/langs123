    de: [{ term: Otro }, " steht nie mit ", { term: un }, ", und ", { term: todo }, " steht mit Artikel:"]
    it: [{ term: Otro }, " non vuole mai ", { term: un }, ", e ", { term: todo }, " vuole l’articolo:"]
    pl: [{ term: Otro }, " nigdy nie występuje z ", { term: un }, ", a ", { term: todo }, " ma przedimek:"]
    tr: [{ term: Otro }, " asla ", { term: un }, " almaz; ", { term: todo }, " artikel alır:"]
