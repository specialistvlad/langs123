          rule: { en: "little, few: not enough", es: "pequeña cantidad: no basta", uk: "мало: недостатньо", pt: "pequena quantidade: não basta", fr: "petite quantité : ce n’est pas assez", de: "kleine Menge: es reicht nicht", it: "piccola quantità: non basta", pl: "mała ilość: to za mało", tr: "az miktar: yetmez", id: "jumlah kecil: tidak cukup", vi: "số lượng nhỏ: không đủ" }
          ex: ["Tengo ", { target: poco }, " tiempo."]
          tr: { en: I have little time., uk: У мене мало часу., pt: "Tenho pouco tempo.", fr: "J’ai peu de temps.", de: "Ich habe wenig Zeit.", it: "Ho poco tempo.", pl: "Mam mało czasu.", tr: "Az zamanım var.", id: "Waktu saya sedikit.", vi: "Tôi có ít thời gian." }
        - level: A1
          point: { term: un poco de }
          rule: { en: "a little: there is some", es: "cantidad pequeña, pero la hay", uk: "трохи: щось таки є", pt: "quantidade pequena, mas existe", fr: "petite quantité, mais il y en a", de: "kleine Menge, aber es ist etwas da", it: "piccola quantità, ma c’è", pl: "mała ilość, ale coś jest", tr: "az miktar, ama var", id: "jumlah kecil, tetapi ada", vi: "số lượng nhỏ, nhưng có" }
          ex: ["¿Quieres ", { target: un poco de }, " agua?"]
          tr: { en: Would you like a little water?, uk: Хочеш трохи води?, pt: "Quer um pouco de água?", fr: "Tu veux un peu d’eau ?", de: "Möchtest du etwas Wasser?", it: "Vuoi un po’ d’acqua?", pl: "Chcesz trochę wody?", tr: "Biraz su ister misin?", id: "Kamu mau sedikit air?", vi: "Bạn có muốn một chút nước không?" }
        - level: A2
          point: { term: todo }
          rule: { en: the whole or every one, es: la totalidad, uk: увесь або кожен, pt: "a totalidade", fr: "la totalité", de: "das Ganze", it: "la totalità", pl: "całość", tr: "bütünü", id: "keseluruhan", vi: "toàn bộ" }
          ex: ["Trabajo ", { target: todos los }, " días."]
          tr: { en: I work every day., uk: Я працюю щодня., pt: "Trabalho todos os dias.", fr: "Je travaille tous les jours.", de: "Ich arbeite jeden Tag.", it: "Lavoro tutti i giorni.", pl: "Pracuję codziennie.", tr: "Her gün çalışıyorum.", id: "Saya bekerja setiap hari.", vi: "Tôi làm việc mỗi ngày." }
        - level: A1
          point: { en: After a verb, es: Después de un verbo, uk: Після дієслова, pt: "Depois de um verbo", fr: "Après un verbe", de: "Nach einem Verb", it: "Dopo un verbo", pl: "Po czasowniku", tr: "Fiilden sonra", id: "Setelah kata kerja", vi: "Sau động từ" }
          rule: { en: [{ term: mucho }, " and ", { term: poco }, " never change"], es: [{ term: mucho }, " y ", { term: poco }, " no cambian"], uk: [{ term: mucho }, " і ", { term: poco }, " не змінюються"], pt: [{ term: mucho }, " e ", { term: poco }, " não mudam"], fr: [{ term: mucho }, " et ", { term: poco }, " ne changent pas"], de: [{ term: mucho }, " und ", { term: poco }, " bleiben unverändert"], it: [{ term: mucho }, " e ", { term: poco }, " non cambiano"], pl: [{ term: mucho }, " i ", { term: poco }, " się nie zmieniają"], tr: [{ term: mucho }, " ve ", { term: poco }, " değişmez"], id: [{ term: mucho }, " dan ", { term: poco }, " tidak berubah"], vi: [{ term: mucho }, " và ", { term: poco }, " không thay đổi"] }
          ex: ["Mi hijo come ", { target: mucho }, "."]
          tr: { en: My son eats a lot., uk: Мій син багато їсть., pt: "Meu filho come muito.", fr: "Mon fils mange beaucoup.", de: "Mein Sohn isst viel.", it: "Mio figlio mangia molto.", pl: "Mój syn dużo je.", tr: "Oğlum çok yer.", id: "Anak laki-laki saya makan banyak.", vi: "Con trai tôi ăn nhiều." }
        - level: A1
          point: { term: bastante }
          rule: { en: "enough, quite a lot; plural -s", es: "suficiente; plural en -s", uk: "достатньо, чимало; множина на -s", pt: "suficiente; plural em -s", fr: "assez ; pluriel en -s", de: "genug; Plural auf -s", it: "abbastanza; plurale in -s", pl: "dość; liczba mnoga na -s", tr: "yeterli; çoğul -s ile", id: "cukup; jamak dengan -s", vi: "đủ; số nhiều thêm -s" }
          ex: ["Hay ", { target: bastantes }, " sillas."]
          tr: { en: There are enough chairs., uk: Стільців достатньо., pt: "Tem cadeiras suficientes.", fr: "Il y a assez de chaises.", de: "Es gibt genug Stühle.", it: "Ci sono abbastanza sedie.", pl: "Jest wystarczająco dużo krzeseł.", tr: "Yeterince sandalye var.", id: "Ada cukup banyak kursi.", vi: "Có đủ ghế." }
        - level: A2
          point: { term: demasiado }
          rule: { en: more than is good, es: más de lo conveniente, uk: "більше, ніж треба", pt: "mais do que o conveniente", fr: "plus qu’il ne faut", de: "mehr als gut ist", it: "più del dovuto", pl: "więcej, niż trzeba", tr: "gerekenden fazla", id: "lebih dari yang sepatutnya", vi: "nhiều hơn mức cần" }
          ex: ["Hay ", { target: demasiado }, " ruido."]
          tr: { en: "There's too much noise.", uk: Забагато шуму., pt: "Tem barulho demais.", fr: "Il y a trop de bruit.", de: "Es gibt zu viel Lärm.", it: "C’è troppo rumore.", pl: "Jest za dużo hałasu.", tr: "Çok fazla gürültü var.", id: "Terlalu banyak kebisingan.", vi: "Có quá nhiều tiếng ồn." }
        - level: B1
          point: { term: cada }
          rule: { en: never changes; singular noun, es: no cambia; sustantivo en singular, uk: "не змінюється; іменник в однині", pt: "não muda; substantivo no singular", fr: "ne change pas ; nom au singulier", de: "bleibt gleich; Nomen im Singular", it: "non cambia; sostantivo al singolare", pl: "nie zmienia się; rzeczownik w liczbie pojedynczej", tr: "değişmez; isim tekil olur", id: "tidak berubah; kata benda tunggal", vi: "không thay đổi; danh từ số ít" }
          ex: ["Voy al gimnasio ", { target: cada }, " semana."]
          tr: { en: I go to the gym every week., uk: Я ходжу в спортзал щотижня., pt: "Vou à academia toda semana.", fr: "Je vais à la salle de sport chaque semaine.", de: "Ich gehe jede Woche ins Fitnessstudio.", it: "Vado in palestra ogni settimana.", pl: "Chodzę na siłownię co tydzień.", tr: "Her hafta spor salonuna gidiyorum.", id: "Saya pergi ke pusat kebugaran setiap minggu.", vi: "Tôi đến phòng tập mỗi tuần." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: otro }, " never takes ", { term: un }], es: [{ term: otro }, " nunca lleva ", { term: un }], uk: [{ term: otro }, " ніколи не вживається з ", { term: un }], pt: [{ term: otro }, " nunca leva ", { term: un }], fr: [{ term: otro }, " n’est jamais précédé de ", { term: un }], de: [{ term: otro }, " steht nie mit ", { term: un }], it: [{ term: otro }, " non vuole mai ", { term: un }], pl: [{ term: otro }, " nigdy nie występuje z ", { term: un }], tr: [{ term: otro }, " asla ", { term: un }, " almaz"], id: [{ term: otro }, " tidak pernah memakai ", { term: un }], vi: [{ term: otro }, " không bao giờ đi với ", { term: un }] }
          ex: ["Quiero ", { target: otro }, " café."]
          tr: { en: I want another coffee., uk: Я хочу ще одну каву., pt: "Quero outro café.", fr: "Je veux un autre café.", de: "Ich möchte noch einen Kaffee.", it: "Voglio un altro caffè.", pl: "Chcę jeszcze jedną kawę.", tr: "Bir kahve daha istiyorum.", id: "Saya mau kopi lagi.", vi: "Tôi muốn thêm một ly cà phê." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: gente }, " is feminine singular"], es: [{ term: gente }, " es femenino singular"], uk: [{ term: gente }, " — жіночий рід, однина"], pt: [{ term: gente }, " é feminino singular"], fr: [{ term: gente }, " est un féminin singulier"], de: [{ term: gente }, " ist weiblich im Singular"], it: [{ term: gente }, " è femminile singolare"], pl: [{ term: gente }, " jest rodzaju żeńskiego, w liczbie pojedynczej"], tr: [{ term: gente }, " dişil ve tekildir"], id: [{ term: gente }, " feminin tunggal"], vi: [{ term: gente }, " là danh từ giống cái, số ít"] }
          ex: ["Hay ", { target: mucha }, " gente."]
          tr: { en: There are a lot of people., uk: Тут багато людей., pt: "Tem muita gente.", fr: "Il y a beaucoup de monde.", de: "Es sind viele Leute da.", it: "C’è molta gente.", pl: "Jest dużo ludzi.", tr: "Çok insan var.", id: "Ada banyak orang.", vi: "Có rất nhiều người." }

sections:
  - title: { en: "Form: agreement", es: "Forma: la concordancia", uk: "Форма: узгодження", pt: "Forma: a concordância", fr: "Forme : l’accord", de: "Form: die Angleichung", it: "Forma: la concordanza", pl: "Forma: zgodność", tr: "Biçim: uyum", id: "Bentuk: kesesuaian", vi: "Dạng: sự hòa hợp" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: Слово, pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: sg, label: { en: Singular, es: Singular, uk: Однина, pt: "Singular", fr: "Singulier", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: Множина, pt: "Plural", fr: "Pluriel", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }, features: { number: pl } }
        rows:
          - { level: A1, word: mucho, sg: { alternatives: [{ target: mucho }, { target: mucha }] }, pl: { alternatives: [{ target: muchos }, { target: muchas }] } }
          - { level: A1, word: poco, sg: { alternatives: [{ target: poco }, { target: poca }] }, pl: { alternatives: [{ target: pocos }, { target: pocas }] } }
          - { level: A2, word: todo, sg: { alternatives: [{ target: todo }, { target: toda }] }, pl: { alternatives: [{ target: todos }, { target: todas }] } }
          - { level: A2, word: otro, sg: { alternatives: [{ target: otro }, { target: otra }] }, pl: { alternatives: [{ target: otros }, { target: otras }] } }
          - { level: A2, word: demasiado, sg: { alternatives: [{ target: demasiado }, { target: demasiada }] }, pl: { alternatives: [{ target: demasiados }, { target: demasiadas }] } }
          - { level: A1, word: bastante, sg: { target: bastante }, pl: { target: bastantes } }
          - { level: B1, word: varios, pl: { alternatives: [{ target: varios }, { target: varias }] } }
          - { level: B1, word: cada, sg: { target: cada } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The quantifier agrees with its noun: singular with an uncountable noun, plural with a countable one."
              es: "El cuantificador concuerda con su sustantivo: singular con un incontable, plural con un contable."
              uk: "Слово кількості узгоджується з іменником: однина — з незлічуваним іменником, множина — зі злічуваним."
              pt: "O quantificador concorda com o substantivo: singular com um incontável, plural com um contável."
              fr: "Le quantificateur s’accorde avec son nom : singulier avec un nom indénombrable, pluriel avec un nom dénombrable."
              de: "Das Mengenwort richtet sich nach seinem Nomen: Singular bei einem unzählbaren, Plural bei einem zählbaren."
              it: "Il quantificatore concorda con il sostantivo: singolare con un non numerabile, plurale con un numerabile."
              pl: "Określnik ilości zgadza się z rzeczownikiem: liczba pojedyncza z niepoliczalnym, mnoga z policzalnym."
              tr: "Miktar sözcüğü isme uyar: sayılamayan isimle tekil, sayılabilen isimle çoğul olur."
              id: "Kata penunjuk jumlah menyesuaikan diri dengan kata bendanya: tunggal dengan kata benda tak terhitung, jamak dengan kata benda terhitung."
              vi: "Lượng từ hòa hợp với danh từ: số ít đi với danh từ không đếm được, số nhiều đi với danh từ đếm được."
            ex: { examples: [[{ target: poca }, " leche"], [{ target: pocos }, " huevos"]] }
            tr: { en: { examples: [little milk, few eggs] }, uk: { examples: [мало молока, мало яєць] }, pt: { examples: ["pouco leite", "poucos ovos"] }, fr: { examples: ["peu de lait", "peu d’œufs"] }, de: { examples: ["wenig Milch", "wenige Eier"] }, it: { examples: ["poco latte", "poche uova"] }, pl: { examples: ["mało mleka", "mało jajek"] }, tr: { examples: ["az süt", "az yumurta"] }, id: { examples: ["sedikit susu", "sedikit telur"] }, vi: { examples: ["ít sữa", "ít trứng"] } }
          - type: rule
            level: A1
            text:
              en: "Alone, the quantifier takes the gender and number of the noun it stands for:"
              es: "Solo, el cuantificador toma el género y el número del sustantivo al que sustituye:"
              uk: "Без іменника слово кількості має рід і число того іменника, який заступає:"
              pt: "Sozinho, o quantificador toma o gênero e o número do substantivo que ele substitui:"
              fr: "Seul, le quantificateur prend le genre et le nombre du nom qu’il remplace :"
              de: "Allein stehend übernimmt das Mengenwort Genus und Numerus des Nomens, das es ersetzt:"
              it: "Da solo, il quantificatore prende il genere e il numero del sostantivo che sostituisce:"
              pl: "Użyty samodzielnie, określnik ilości przyjmuje rodzaj i liczbę zastępowanego rzeczownika:"
              tr: "Tek başına kullanılan miktar sözcüğü, yerine geçtiği ismin cinsiyetini ve sayısını alır:"
              id: "Kalau berdiri sendiri, kata penunjuk jumlah mengikuti gender dan jumlah kata benda yang digantikannya:"
