# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.sustantivo-determinantes.cuantificadores
lang: es
kind: grammar
tags: [quantifiers, determiners, nouns]
concepts: [quantifiers]
related: [es.sustantivo-determinantes.articulos, es.sustantivo-determinantes.indefinidos, es.adjetivo-adverbio.adverbios, es.sustantivo-determinantes.plural]
status: { en: draft, es: draft, uk: draft }
translated: { en: "e69aef dba5f1 3a7b42 8ea34b bc192f", uk: "e69aef dba5f1 3a7b42 8ea34b bc192f" }

title: { en: Quantifiers, es: Los cuantificadores, uk: Слова кількості }
summary:
  lead:
    en: [{ term: Mucho }, ", ", { term: poco }, ", ", { term: todo }, " and ", { term: otro }, " say how much or how many, and they agree with their noun in gender and number."]
    es: [{ term: Mucho }, ", ", { term: poco }, ", ", { term: todo }, " y ", { term: otro }, " indican cantidad y concuerdan con su sustantivo en género y número."]
    uk: [{ term: Mucho }, ", ", { term: poco }, ", ", { term: todo }, " і ", { term: otro }, " позначають кількість і узгоджуються з іменником у роді й числі."]
  rule:
    en: [{ term: Otro }, " never takes ", { term: un }, ", and ", { term: todo }, " takes the article:"]
    es: [{ term: Otro }, " nunca lleva ", { term: un }, ", y ", { term: todo }, " lleva artículo:"]
    uk: [{ term: Otro }, " ніколи не вживається з ", { term: un }, ", а ", { term: todo }, " — з артиклем:"]
  ex: { examples: [["Quiero ", { target: otro }, " café."], ["Trabajo ", { target: todos los }, " días."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A1
          point: { term: mucho }
          rule: { en: "a lot of; agrees with the noun", es: "gran cantidad; concuerda con el sustantivo", uk: "багато; узгоджується з іменником" }
          ex: { examples: [[{ target: mucha }, " agua"], [{ target: muchos }, " libros"]] }
          tr: { en: { examples: [a lot of water, a lot of books] }, uk: { examples: [багато води, багато книжок] } }
        - level: A1
          point: { term: poco }
          rule: { en: "little, few: not enough", es: "pequeña cantidad: no basta", uk: "мало: недостатньо" }
          ex: ["Tengo ", { target: poco }, " tiempo."]
          tr: { en: I have little time., uk: У мене мало часу. }
        - level: A1
          point: { term: un poco de }
          rule: { en: "a little: there is some", es: "cantidad pequeña, pero la hay", uk: "трохи: щось таки є" }
          ex: ["¿Quieres ", { target: un poco de }, " agua?"]
          tr: { en: Would you like a little water?, uk: Хочеш трохи води? }
        - level: A2
          point: { term: todo }
          rule: { en: the whole or every one, es: la totalidad, uk: увесь або кожен }
          ex: ["Trabajo ", { target: todos los }, " días."]
          tr: { en: I work every day., uk: Я працюю щодня. }
        - level: A1
          point: { en: After a verb, es: Después de un verbo, uk: Після дієслова }
          rule: { en: [{ term: mucho }, " and ", { term: poco }, " never change"], es: [{ term: mucho }, " y ", { term: poco }, " no cambian"], uk: [{ term: mucho }, " і ", { term: poco }, " не змінюються"] }
          ex: ["Mi hijo come ", { target: mucho }, "."]
          tr: { en: My son eats a lot., uk: Мій син багато їсть. }
        - level: A1
          point: { term: bastante }
          rule: { en: "enough, quite a lot; plural -s", es: "suficiente; plural en -s", uk: "достатньо, чимало; множина на -s" }
          ex: ["Hay ", { target: bastantes }, " sillas."]
          tr: { en: There are enough chairs., uk: Стільців достатньо. }
        - level: A2
          point: { term: demasiado }
          rule: { en: more than is good, es: más de lo conveniente, uk: "більше, ніж треба" }
          ex: ["Hay ", { target: demasiado }, " ruido."]
          tr: { en: "There's too much noise.", uk: Забагато шуму. }
        - level: B1
          point: { term: cada }
          rule: { en: never changes; singular noun, es: no cambia; sustantivo en singular, uk: "не змінюється; іменник в однині" }
          ex: ["Voy al gimnasio ", { target: cada }, " semana."]
          tr: { en: I go to the gym every week., uk: Я ходжу в спортзал щотижня. }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: [{ term: otro }, " never takes ", { term: un }], es: [{ term: otro }, " nunca lleva ", { term: un }], uk: [{ term: otro }, " ніколи не вживається з ", { term: un }] }
          ex: ["Quiero ", { target: otro }, " café."]
          tr: { en: I want another coffee., uk: Я хочу ще одну каву. }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: [{ term: gente }, " is feminine singular"], es: [{ term: gente }, " es femenino singular"], uk: [{ term: gente }, " — жіночий рід, однина"] }
          ex: ["Hay ", { target: mucha }, " gente."]
          tr: { en: There are a lot of people., uk: Тут багато людей. }

sections:
  - title: { en: "Form: agreement", es: "Forma: la concordancia", uk: "Форма: узгодження" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: Слово } }
          - { key: sg, label: { en: Singular, es: Singular, uk: Однина }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: Множина }, features: { number: pl } }
        rows:
          - { level: A1, word: mucho, sg: { alternatives: [{ target: mucho }, { target: mucha }] }, pl: { alternatives: [{ target: muchos }, { target: muchas }] } }
          - { level: A1, word: poco, sg: { alternatives: [{ target: poco }, { target: poca }] }, pl: { alternatives: [{ target: pocos }, { target: pocas }] } }
          - { level: A2, word: todo, sg: { alternatives: [{ target: todo }, { target: toda }] }, pl: { alternatives: [{ target: todos }, { target: todas }] } }
          - { level: A2, word: otro, sg: { alternatives: [{ target: otro }, { target: otra }] }, pl: { alternatives: [{ target: otros }, { target: otras }] } }
          - { level: A2, word: demasiado, sg: { alternatives: [{ target: demasiado }, { target: demasiada }] }, pl: { alternatives: [{ target: demasiados }, { target: demasiadas }] } }
          - { level: A1, word: bastante, sg: { target: bastante }, pl: { target: bastantes } }
          - { level: B1, word: varios, pl: { alternatives: [{ target: varios }, { target: varias }] } }
          - { level: B1, word: cada, sg: { target: cada } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The quantifier agrees with its noun: singular with an uncountable noun, plural with a countable one."
              es: "El cuantificador concuerda con su sustantivo: singular con un incontable, plural con un contable."
              uk: "Слово кількості узгоджується з іменником: однина — з незлічуваним іменником, множина — зі злічуваним."
            ex: { examples: [[{ target: poca }, " leche"], [{ target: pocos }, " huevos"]] }
            tr: { en: { examples: [little milk, few eggs] }, uk: { examples: [мало молока, мало яєць] } }
          - type: rule
            level: A1
            text:
              en: "Alone, the quantifier takes the gender and number of the noun it stands for:"
              es: "Solo, el cuantificador toma el género y el número del sustantivo al que sustituye:"
              uk: "Без іменника слово кількості має рід і число того іменника, який заступає:"
            ex: { exchange: ["¿Tienes amigos aquí?", ["Sí, ", { target: muchos }, "."]] }
            tr: { en: { exchange: [Do you have friends here?, "Yes, lots."] }, uk: { exchange: [У тебе тут є друзі?, "Так, багато."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: mucho }, " and ", { term: poco }, " after a verb never change:"]
              es: [{ term: mucho }, " y ", { term: poco }, " después de un verbo no cambian:"]
              uk: [{ term: mucho }, " і ", { term: poco }, " після дієслова не змінюються:"]
            ex: ["Mi hijo come ", { target: mucho }, "."]
            tr: { en: My son eats a lot., uk: Мій син багато їсть. }
          - type: note
            level: A1
            text:
              en: [{ term: muy }, " and ", { term: mucho }, ": see ", { link: Adverbs, to: es.adjetivo-adverbio.adverbios }, "."]
              es: [{ term: muy }, " y ", { term: mucho }, ": ver ", { link: Los adverbios, to: es.adjetivo-adverbio.adverbios }, "."]
              uk: [{ term: muy }, " і ", { term: mucho }, ": див. ", { link: Прислівники, to: es.adjetivo-adverbio.adverbios }, "."]

  - title: { en: Use, es: Uso, uk: Вживання }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: Слово } }
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, word: mucho, use: { en: a large amount, es: una cantidad grande, uk: велика кількість }, ex: ["Tengo ", { target: muchos }, " amigos."], tr: { en: I have a lot of friends., uk: У мене багато друзів. } }
          - { level: A1, word: poco, use: { en: "a small amount, not enough", es: "una cantidad pequeña, insuficiente", uk: "мала кількість, недостатня" }, ex: ["Hay ", { target: pocas }, " personas."], tr: { en: There are few people., uk: Людей мало. } }
          - { level: A1, word: un poco de, use: { en: "a small amount, and there is some", es: "una cantidad pequeña, pero la hay", uk: "мала кількість, але вона є" }, ex: ["Tengo ", { target: un poco de }, " hambre."], tr: { en: "I'm a little hungry.", uk: Я трохи голодний. } }
          - level: A2
            word: todo
            use: { en: "the whole, or every one", es: "completo, o cada uno", uk: "увесь або кожен" }
            ex: { examples: [["Estudio ", { target: toda la }, " tarde."], ["Corro ", { target: todos los }, " días."]] }
            tr: { en: { examples: [I study all afternoon., I run every day.] }, uk: { examples: [Я вчуся весь день після обіду., Я бігаю щодня.] } }
          - { level: A2, word: otro, use: { en: "one more, or a different one", es: "uno más, o uno distinto", uk: "ще один або інший" }, ex: ["¿Me das ", { target: otra }, " servilleta?"], tr: { en: Can you give me another napkin?, uk: Даси мені ще одну серветку? } }
          - { level: A1, word: bastante, use: { en: "enough, quite a lot", es: "suficiente", uk: "достатньо, чимало" }, ex: ["Tenemos ", { target: bastante }, " comida."], tr: { en: We have enough food., uk: У нас достатньо їжі. } }
          - { level: A2, word: demasiado, use: { en: more than is good, es: más de lo conveniente, uk: "більше, ніж треба" }, ex: ["Comes ", { target: demasiados }, " dulces."], tr: { en: You eat too many sweets., uk: Ти їси забагато солодощів. } }
          - { level: B1, word: varios, use: { en: "some, more than two", es: "algunos, más de dos", uk: "кілька, більше двох" }, ex: ["Tengo ", { target: varias }, " preguntas."], tr: { en: I have several questions., uk: У мене кілька запитань. } }
          - { level: B1, word: cada, use: { en: every single one, es: uno por uno, uk: кожен окремо }, ex: [{ target: Cada }, " alumno tiene un libro."], tr: { en: Each student has a book., uk: Кожен учень має книжку. } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: poco }, " says that it is not enough; ", { term: un poco de }, " says that there is some:"]
              es: [{ term: poco }, " dice que no basta; ", { term: un poco de }, " dice que hay algo:"]
              uk: [{ term: poco }, " означає, що цього недостатньо; ", { term: un poco de }, " — що трохи є:"]
            ex: { examples: [["Tengo ", { target: poco }, " dinero."], ["Tengo ", { target: un poco de }, " dinero."]] }
            tr: { en: { examples: [I have little money., I have a little money.] }, uk: { examples: [У мене мало грошей., У мене є трохи грошей.] } }
          - type: rule
            level: A2
            text:
              en: [{ term: todo }, " goes before the article: ", { term: todo el día }, ", ", { term: todas las semanas }, "."]
              es: [{ term: todo }, " va delante del artículo: ", { term: todo el día }, ", ", { term: todas las semanas }, "."]
              uk: [{ term: todo }, " стоїть перед артиклем: ", { term: todo el día }, ", ", { term: todas las semanas }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: otro }, " never takes ", { term: un }, " or ", { term: una }, "."]
              es: [{ term: otro }, " nunca lleva ", { term: un }, " ni ", { term: una }, "."]
              uk: [{ term: otro }, " ніколи не вживається з ", { term: un }, " чи ", { term: una }, "."]
          - type: rule
            level: B1
            text:
              en: [{ term: cada }, " never changes and goes with a singular noun."]
              es: [{ term: cada }, " no cambia y va con un sustantivo en singular."]
              uk: [{ term: cada }, " не змінюється і вживається з іменником в однині."]

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Quiero un otro café., right: ["Quiero ", { target: otro }, " café."], rule: { en: [{ term: otro }, " never takes ", { term: un }], es: [{ term: otro }, " nunca lleva ", { term: un }], uk: [{ term: otro }, " ніколи не вживається з ", { term: un }] } }
          - { level: A1, wrong: Hay mucho gente., right: ["Hay ", { target: mucha }, " gente."], rule: { en: [{ term: gente }, " is feminine singular"], es: [{ term: gente }, " es femenino singular"], uk: [{ term: gente }, " — жіночий рід, однина"] } }
          - { level: A1, wrong: un poco agua, right: [{ target: un poco de }, " agua"], rule: { en: { pattern: [{ term: un poco de }, { slot: noun }] }, es: { pattern: [{ term: un poco de }, { slot: noun }] }, uk: { pattern: [{ term: un poco de }, { slot: noun }] } } }
          - { level: A2, wrong: todos días, right: [{ target: todos los }, " días"], rule: { en: [{ term: todo }, " takes the article"], es: [{ term: todo }, " lleva artículo"], uk: [{ term: todo }, " вживається з артиклем"] } }
          - { level: A1, wrong: Mi hijo come muchos., right: ["Mi hijo come ", { target: mucho }, "."], rule: { en: ["after a verb, ", { term: mucho }, " never changes"], es: ["después de un verbo, ", { term: mucho }, " no cambia"], uk: ["після дієслова ", { term: mucho }, " не змінюється"] } }
          - { level: B1, wrong: cada días, right: [{ target: cada }, " día"], rule: { en: [{ term: cada }, " takes a singular noun"], es: [{ term: cada }, " lleva el sustantivo en singular"], uk: [{ term: cada }, " вживається з іменником в однині"] } }
          - { level: A1, speakers: [en, uk], wrong: Me gusta muy mucho., right: ["Me gusta ", { target: mucho }, "."], rule: { en: [{ term: mucho }, " alone means “very much”"], uk: [{ term: mucho }, " без ", { term: muy }, " уже означає «дуже»: «дуже подобається» — ", { term: me gusta mucho }] } }
