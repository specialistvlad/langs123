sections:
  - title: { en: "Form: agreement", es: "Forma: la concordancia", uk: "Форма: узгодження", pt: "Forma: a concordância", fr: "Forme : l’accord", de: "Form: die Angleichung", it: "Forma: la concordanza", pl: "Forma: zgodność", tr: "Biçim: uyum", id: "Bentuk: kesesuaian", vi: "Dạng: sự hòa hợp" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: Слово, pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: sg, label: { en: Singular, es: Singular, uk: Однина, pt: "Singular", fr: "Singulier", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: Множина, pt: "Plural", fr: "Pluriel", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }, features: { number: pl } }
        rows:
          - { level: A1, word: mucho, sg: { alternatives: [{ target: mucho }, { target: mucha }] }, pl: { alternatives: [{ target: muchos }, { target: muchas }] } }
          - { level: A1, word: poco, sg: { alternatives: [{ target: poco }, { target: poca }] }, pl: { alternatives: [{ target: pocos }, { target: pocas }] } }
          - { level: A2, word: todo, sg: { alternatives: [{ target: todo }, { target: toda }] }, pl: { alternatives: [{ target: todos }, { target: todas }] } }
          - { level: A2, word: otro, sg: { alternatives: [{ target: otro }, { target: otra }] }, pl: { alternatives: [{ target: otros }, { target: otras }] } }
          - { level: A2, word: demasiado, sg: { alternatives: [{ target: demasiado }, { target: demasiada }] }, pl: { alternatives: [{ target: demasiados }, { target: demasiadas }] } }
          - { level: A1, word: bastante, sg: { target: bastante }, pl: { target: bastantes } }
          - { level: B1, word: varios, pl: { alternatives: [{ target: varios }, { target: varias }] } }
          - { level: B1, word: cada, sg: { target: cada } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The quantifier agrees with its noun: singular with an uncountable noun, plural with a countable one."
              es: "El cuantificador concuerda con su sustantivo: singular con un incontable, plural con un contable."
              uk: "Слово кількості узгоджується з іменником: однина — з незлічуваним іменником, множина — зі злічуваним."
              pt: "O quantificador concorda com o substantivo: singular com um incontável, plural com um contável."
              fr: "Le quantificateur s’accorde avec son nom : singulier avec un nom indénombrable, pluriel avec un nom dénombrable."
              de: "Das Mengenwort richtet sich nach seinem Nomen: Singular bei einem unzählbaren, Plural bei einem zählbaren."
              it: "Il quantificatore concorda con il sostantivo: singolare con un non numerabile, plurale con un numerabile."
              pl: "Określnik ilości zgadza się z rzeczownikiem: liczba pojedyncza z niepoliczalnym, mnoga z policzalnym."
              tr: "Miktar sözcüğü isme uyar: sayılamayan isimle tekil, sayılabilen isimle çoğul olur."
              id: "Kata penunjuk jumlah menyesuaikan diri dengan kata bendanya: tunggal dengan kata benda tak terhitung, jamak dengan kata benda terhitung."
              vi: "Lượng từ hòa hợp với danh từ: số ít đi với danh từ không đếm được, số nhiều đi với danh từ đếm được."
            ex: { examples: [[{ target: poca }, " leche"], [{ target: pocos }, " huevos"]] }
            tr: { en: { examples: [little milk, few eggs] }, uk: { examples: [мало молока, мало яєць] }, pt: { examples: ["pouco leite", "poucos ovos"] }, fr: { examples: ["peu de lait", "peu d’œufs"] }, de: { examples: ["wenig Milch", "wenige Eier"] }, it: { examples: ["poco latte", "poche uova"] }, pl: { examples: ["mało mleka", "mało jajek"] }, tr: { examples: ["az süt", "az yumurta"] }, id: { examples: ["sedikit susu", "sedikit telur"] }, vi: { examples: ["ít sữa", "ít trứng"] } }
          - type: rule
            level: A1
            text:
              en: "Alone, the quantifier takes the gender and number of the noun it stands for:"
              es: "Solo, el cuantificador toma el género y el número del sustantivo al que sustituye:"
              uk: "Без іменника слово кількості має рід і число того іменника, який заступає:"
              pt: "Sozinho, o quantificador toma o gênero e o número do substantivo que ele substitui:"
              fr: "Seul, le quantificateur prend le genre et le nombre du nom qu’il remplace :"
              de: "Allein stehend übernimmt das Mengenwort Genus und Numerus des Nomens, das es ersetzt:"
              it: "Da solo, il quantificatore prende il genere e il numero del sostantivo che sostituisce:"
              pl: "Użyty samodzielnie, określnik ilości przyjmuje rodzaj i liczbę zastępowanego rzeczownika:"
              tr: "Tek başına kullanılan miktar sözcüğü, yerine geçtiği ismin cinsiyetini ve sayısını alır:"
              id: "Kalau berdiri sendiri, kata penunjuk jumlah mengikuti gender dan jumlah kata benda yang digantikannya:"
              vi: "Đứng một mình, lượng từ mang giống và số của danh từ mà nó thay thế:"
            ex: { exchange: ["¿Tienes amigos aquí?", ["Sí, ", { target: muchos }, "."]] }
            tr: { en: { exchange: [Do you have friends here?, "Yes, lots."] }, uk: { exchange: [У тебе тут є друзі?, "Так, багато."] }, pt: { exchange: ["Você tem amigos aqui?", "Sim, muitos."] }, fr: { exchange: ["Tu as des amis ici ?", "Oui, beaucoup."] }, de: { exchange: ["Hast du hier Freunde?", "Ja, viele."] }, it: { exchange: ["Hai amici qui?", "Sì, molti."] }, pl: { exchange: ["Masz tu przyjaciół?", "Tak, wielu."] }, tr: { exchange: ["Burada arkadaşların var mı?", "Evet, çok."] }, id: { exchange: ["Kamu punya teman di sini?", "Ya, banyak."] }, vi: { exchange: ["Bạn có bạn bè ở đây không?", "Có, nhiều lắm."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: mucho }, " and ", { term: poco }, " after a verb never change:"]
              es: [{ term: mucho }, " y ", { term: poco }, " después de un verbo no cambian:"]
              uk: [{ term: mucho }, " і ", { term: poco }, " після дієслова не змінюються:"]
              pt: [{ term: mucho }, " e ", { term: poco }, " depois de um verbo não mudam:"]
              fr: [{ term: mucho }, " et ", { term: poco }, " après un verbe ne changent pas :"]
              de: [{ term: mucho }, " und ", { term: poco }, " bleiben nach einem Verb unverändert:"]
              it: [{ term: mucho }, " e ", { term: poco }, " dopo un verbo non cambiano:"]
              pl: [{ term: mucho }, " i ", { term: poco }, " po czasowniku się nie zmieniają:"]
              tr: [{ term: mucho }, " ve ", { term: poco }, " fiilden sonra değişmez:"]
              id: [{ term: mucho }, " dan ", { term: poco }, " setelah kata kerja tidak berubah:"]
              vi: [{ term: mucho }, " và ", { term: poco }, " sau động từ không thay đổi:"]
            ex: ["Mi hijo come ", { target: mucho }, "."]
            tr: { en: My son eats a lot., uk: Мій син багато їсть., pt: "Meu filho come muito.", fr: "Mon fils mange beaucoup.", de: "Mein Sohn isst viel.", it: "Mio figlio mangia molto.", pl: "Mój syn dużo je.", tr: "Oğlum çok yer.", id: "Anak laki-laki saya makan banyak.", vi: "Con trai tôi ăn nhiều." }
          - type: note
            level: A1
            text:
              en: [{ term: muy }, " and ", { term: mucho }, ": see ", { link: Adverbs, to: es.adjetivo-adverbio.adverbios }, "."]
              es: [{ term: muy }, " y ", { term: mucho }, ": ver ", { link: Los adverbios, to: es.adjetivo-adverbio.adverbios }, "."]
              uk: [{ term: muy }, " і ", { term: mucho }, ": див. ", { link: Прислівники, to: es.adjetivo-adverbio.adverbios }, "."]
              pt: [{ term: muy }, " e ", { term: mucho }, ": veja ", { link: Os advérbios, to: es.adjetivo-adverbio.adverbios }, "."]
              fr: [{ term: muy }, " et ", { term: mucho }, " : voir ", { link: Les adverbes, to: es.adjetivo-adverbio.adverbios }, "."]
              de: [{ term: muy }, " und ", { term: mucho }, ": siehe ", { link: Die Adverbien, to: es.adjetivo-adverbio.adverbios }, "."]
              it: [{ term: muy }, " e ", { term: mucho }, ": vedi ", { link: Gli avverbi, to: es.adjetivo-adverbio.adverbios }, "."]
              pl: [{ term: muy }, " i ", { term: mucho }, ": zob. ", { link: Przysłówki, to: es.adjetivo-adverbio.adverbios }, "."]
              tr: [{ term: muy }, " ve ", { term: mucho }, ": bkz. ", { link: Zarflar, to: es.adjetivo-adverbio.adverbios }, "."]
              id: [{ term: muy }, " dan ", { term: mucho }, ": lihat ", { link: Kata keterangan, to: es.adjetivo-adverbio.adverbios }, "."]
              vi: [{ term: muy }, " và ", { term: mucho }, ": xem ", { link: Trạng từ, to: es.adjetivo-adverbio.adverbios }, "."]

  - title: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
    role: use
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: Слово, pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: use, label: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, word: mucho, use: { en: a large amount, es: una cantidad grande, uk: велика кількість, pt: "uma grande quantidade", fr: "une grande quantité", de: "eine große Menge", it: "una grande quantità", pl: "duża ilość", tr: "büyük bir miktar", id: "jumlah yang besar", vi: "một số lượng lớn" }, ex: ["Tengo ", { target: muchos }, " amigos."], tr: { en: I have a lot of friends., uk: У мене багато друзів., pt: "Tenho muitos amigos.", fr: "J’ai beaucoup d’amis.", de: "Ich habe viele Freunde.", it: "Ho molti amici.", pl: "Mam wielu przyjaciół.", tr: "Çok arkadaşım var.", id: "Saya punya banyak teman.", vi: "Tôi có nhiều bạn." } }
          - { level: A1, word: poco, use: { en: "a small amount, not enough", es: "una cantidad pequeña, insuficiente", uk: "мала кількість, недостатня", pt: "uma pequena quantidade, insuficiente", fr: "une petite quantité, insuffisante", de: "eine kleine, unzureichende Menge", it: "una piccola quantità, insufficiente", pl: "mała, niewystarczająca ilość", tr: "az, yetersiz bir miktar", id: "jumlah kecil yang tidak cukup", vi: "một số lượng nhỏ, không đủ" }, ex: ["Hay ", { target: pocas }, " personas."], tr: { en: There are few people., uk: Людей мало., pt: "Tem poucas pessoas.", fr: "Il y a peu de personnes.", de: "Es sind nur wenige Leute da.", it: "Ci sono poche persone.", pl: "Jest mało osób.", tr: "Az insan var.", id: "Hanya ada sedikit orang.", vi: "Có ít người." } }
          - { level: A1, word: un poco de, use: { en: "a small amount, and there is some", es: "una cantidad pequeña, pero la hay", uk: "мала кількість, але вона є", pt: "uma pequena quantidade, mas existe", fr: "une petite quantité, mais il y en a", de: "eine kleine Menge, aber es ist etwas da", it: "una piccola quantità, ma c’è", pl: "mała ilość, ale coś jest", tr: "az bir miktar, ama var", id: "jumlah kecil, tetapi ada", vi: "một số lượng nhỏ, nhưng có" }, ex: ["Tengo ", { target: un poco de }, " hambre."], tr: { en: "I'm a little hungry.", uk: Я трохи голодний., pt: "Estou com um pouco de fome.", fr: "J’ai un peu faim.", de: "Ich habe ein bisschen Hunger.", it: "Ho un po’ di fame.", pl: "Jestem trochę głodny.", tr: "Biraz acıktım.", id: "Saya agak lapar.", vi: "Tôi hơi đói." } }
          - level: A2
            word: todo
            use: { en: "the whole, or every one", es: "completo, o cada uno", uk: "увесь або кожен", pt: "inteiro, ou cada um", fr: "entier, ou chacun", de: "ganz, oder jeder einzelne", it: "intero, o ciascuno", pl: "cały lub każdy", tr: "bütün ya da her biri", id: "seluruh, atau setiap", vi: "toàn bộ, hoặc từng cái" }
            ex: { examples: [["Estudio ", { target: toda la }, " tarde."], ["Corro ", { target: todos los }, " días."]] }
            tr: { en: { examples: [I study all afternoon., I run every day.] }, uk: { examples: [Я вчуся весь день після обіду., Я бігаю щодня.] }, pt: { examples: ["Estudo a tarde toda.", "Corro todos os dias."] }, fr: { examples: ["J’étudie tout l’après-midi.", "Je cours tous les jours."] }, de: { examples: ["Ich lerne den ganzen Nachmittag.", "Ich laufe jeden Tag."] }, it: { examples: ["Studio tutto il pomeriggio.", "Corro tutti i giorni."] }, pl: { examples: ["Uczę się przez całe popołudnie.", "Biegam codziennie."] }, tr: { examples: ["Bütün öğleden sonra ders çalışıyorum.", "Her gün koşuyorum."] }, id: { examples: ["Saya belajar sepanjang sore.", "Saya berlari setiap hari."] }, vi: { examples: ["Tôi học cả buổi chiều.", "Tôi chạy bộ mỗi ngày."] } }
          - { level: A2, word: otro, use: { en: "one more, or a different one", es: "uno más, o uno distinto", uk: "ще один або інший", pt: "mais um, ou um diferente", fr: "un de plus, ou un autre", de: "noch einer, oder ein anderer", it: "uno in più, o uno diverso", pl: "jeszcze jeden lub inny", tr: "bir tane daha, ya da başka biri", id: "satu lagi, atau yang lain", vi: "thêm một cái, hoặc một cái khác" }, ex: ["¿Me das ", { target: otra }, " servilleta?"], tr: { en: Can you give me another napkin?, uk: Даси мені ще одну серветку?, pt: "Pode me dar outro guardanapo?", fr: "Tu peux me donner une autre serviette ?", de: "Gibst du mir noch eine Serviette?", it: "Mi dai un altro tovagliolo?", pl: "Dasz mi jeszcze jedną serwetkę?", tr: "Bana bir peçete daha verir misin?", id: "Boleh minta serbet lagi?", vi: "Bạn đưa tôi thêm một cái khăn ăn được không?" } }
          - { level: A1, word: bastante, use: { en: "enough, quite a lot", es: "suficiente", uk: "достатньо, чимало", pt: "suficiente", fr: "assez, suffisant", de: "genug", it: "abbastanza", pl: "wystarczająco", tr: "yeterli", id: "cukup", vi: "đủ" }, ex: ["Tenemos ", { target: bastante }, " comida."], tr: { en: We have enough food., uk: У нас достатньо їжі., pt: "Temos comida suficiente.", fr: "Nous avons assez de nourriture.", de: "Wir haben genug Essen.", it: "Abbiamo abbastanza cibo.", pl: "Mamy wystarczająco dużo jedzenia.", tr: "Yeterince yiyeceğimiz var.", id: "Kami punya cukup makanan.", vi: "Chúng tôi có đủ đồ ăn." } }
          - { level: A2, word: demasiado, use: { en: more than is good, es: más de lo conveniente, uk: "більше, ніж треба", pt: "mais do que o conveniente", fr: "plus qu’il ne faut", de: "mehr als gut ist", it: "più del dovuto", pl: "więcej, niż trzeba", tr: "gerekenden fazla", id: "lebih dari yang sepatutnya", vi: "nhiều hơn mức cần" }, ex: ["Comes ", { target: demasiados }, " dulces."], tr: { en: You eat too many sweets., uk: Ти їси забагато солодощів., pt: "Você come doces demais.", fr: "Tu manges trop de sucreries.", de: "Du isst zu viele Süßigkeiten.", it: "Mangi troppi dolci.", pl: "Jesz za dużo słodyczy.", tr: "Çok fazla tatlı yiyorsun.", id: "Kamu makan terlalu banyak makanan manis.", vi: "Bạn ăn quá nhiều đồ ngọt." } }
          - { level: B1, word: varios, use: { en: "some, more than two", es: "algunos, más de dos", uk: "кілька, більше двох", pt: "alguns, mais de dois", fr: "quelques-uns, plus de deux", de: "einige, mehr als zwei", it: "alcuni, più di due", pl: "kilka, więcej niż dwa", tr: "birkaç, ikiden fazla", id: "beberapa, lebih dari dua", vi: "một vài, nhiều hơn hai" }, ex: ["Tengo ", { target: varias }, " preguntas."], tr: { en: I have several questions., uk: У мене кілька запитань., pt: "Tenho várias perguntas.", fr: "J’ai plusieurs questions.", de: "Ich habe mehrere Fragen.", it: "Ho diverse domande.", pl: "Mam kilka pytań.", tr: "Birkaç sorum var.", id: "Saya punya beberapa pertanyaan.", vi: "Tôi có vài câu hỏi." } }
          - { level: B1, word: cada, use: { en: every single one, es: uno por uno, uk: кожен окремо, pt: "um por um", fr: "un par un", de: "einzeln, einer nach dem anderen", it: "uno per uno", pl: "pojedynczo", tr: "tek tek", id: "satu per satu", vi: "từng cái một" }, ex: [{ target: Cada }, " alumno tiene un libro."], tr: { en: Each student has a book., uk: Кожен учень має книжку., pt: "Cada aluno tem um livro.", fr: "Chaque élève a un livre.", de: "Jeder Schüler hat ein Buch.", it: "Ogni alunno ha un libro.", pl: "Każdy uczeń ma książkę.", tr: "Her öğrencinin bir kitabı var.", id: "Setiap murid punya satu buku.", vi: "Mỗi học sinh có một quyển sách." } }
          - { level: B2, word: algo, use: { es: "suaviza un adjetivo: un poco", en: "softens an adjective: a little", uk: "пом’якшує прикметник: трохи", pt: "suaviza um adjetivo: um pouco", fr: "atténue un adjectif : un peu", de: "schwächt ein Adjektiv ab: ein wenig", it: "attenua un aggettivo: un po’", pl: "łagodzi przymiotnik: trochę", tr: "sıfatı yumuşatır: biraz", id: "melunakkan kata sifat: agak", vi: "làm nhẹ tính từ: hơi" }, ex: ["Es ", { target: algo }, " pesado."], tr: { en: "It is somewhat heavy.", uk: "Це дещо важке.", pt: "É meio pesado.", fr: "C’est un peu lourd.", de: "Es ist etwas schwer.", it: "È un po’ pesante.", pl: "To trochę ciężkie.", tr: "Biraz ağır.", id: "Ini agak berat.", vi: "Cái này hơi nặng." } }
          - { level: C1, word: bien, use: { es: refuerza un adjetivo, en: "strengthens an adjective", uk: "підсилює прикметник", pt: "reforça um adjetivo", fr: "renforce un adjectif", de: "verstärkt ein Adjektiv", it: "rafforza un aggettivo", pl: "wzmacnia przymiotnik", tr: "sıfatı pekiştirir", id: "memperkuat kata sifat", vi: "nhấn mạnh tính từ" }, ex: ["Quiero un té ", { target: bien }, " caliente."], tr: { en: "I want a really hot tea.", uk: "Хочу дуже гарячого чаю.", pt: "Quero um chá bem quente.", fr: "Je veux un thé bien chaud.", de: "Ich möchte einen richtig heißen Tee.", it: "Voglio un tè bello caldo.", pl: "Chcę bardzo gorącej herbaty.", tr: "Çok sıcak bir çay istiyorum.", id: "Saya mau teh yang panas sekali.", vi: "Tôi muốn một tách trà thật nóng." } }
          - { level: C1, word: el resto de, use: { es: lo que queda de un grupo o de un todo, en: "what is left of a group or a whole", uk: "те, що залишилося від групи або цілого", pt: "o que sobra de um grupo ou de um todo", fr: "ce qui reste d’un groupe ou d’un tout", de: "was von einer Gruppe oder einem Ganzen übrig bleibt", it: "ciò che resta di un gruppo o di un tutto", pl: "to, co zostaje z grupy lub z całości", tr: "bir grubun ya da bütünün geri kalanı", id: "sisa dari suatu kelompok atau keseluruhan", vi: "phần còn lại của một nhóm hoặc của một tổng thể" }, ex: ["Pagué ", { target: el resto de }, " la cuenta."], tr: { en: "I paid the rest of the bill.", uk: "Я заплатив решту рахунку.", pt: "Paguei o resto da conta.", fr: "J’ai payé le reste de l’addition.", de: "Ich habe den Rest der Rechnung bezahlt.", it: "Ho pagato il resto del conto.", pl: "Zapłaciłem resztę rachunku.", tr: "Hesabın geri kalanını ödedim.", id: "Saya membayar sisa tagihan.", vi: "Tôi đã trả phần còn lại của hóa đơn." } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: poco }, " says that it is not enough; ", { term: un poco de }, " says that there is some:"]
              es: [{ term: poco }, " dice que no basta; ", { term: un poco de }, " dice que hay algo:"]
              uk: [{ term: poco }, " означає, що цього недостатньо; ", { term: un poco de }, " — що трохи є:"]
