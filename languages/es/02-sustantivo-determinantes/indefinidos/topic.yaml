              vi: ["Từ phủ định đứng sau động từ cần có ", { term: "no" }, " trước động từ."]
          - type: rule
            level: B1
            text:
              en: "A negative word before the verb stands alone."
              es: "La palabra negativa delante del verbo va sola."
              uk: ["Заперечне слово перед дієсловом стоїть без ", { term: no }, "."]
