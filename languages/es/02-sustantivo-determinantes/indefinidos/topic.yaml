          tr: { en: "I have never seen anything like it in my life.", uk: "Я ніколи в житті не бачив нічого подібного.", pt: "Nunca vi nada igual na minha vida.", fr: "Je n’ai jamais rien vu de pareil de ma vie.", de: "So etwas habe ich in meinem Leben noch nie gesehen.", it: "Non ho mai visto niente di simile in vita mia.", pl: "Nigdy w życiu nie widziałem czegoś takiego.", tr: "Hayatımda böyle bir şey görmedim.", id: "Seumur hidup saya tidak pernah melihat yang seperti ini.", vi: "Cả đời tôi chưa từng thấy điều gì như thế." }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: nada }, " after the verb keeps ", { term: no }, " before it"], es: [{ term: nada }, " detrás del verbo mantiene ", { term: no }, " delante"], uk: ["коли ", { term: nada }, " стоїть після дієслова, перед дієсловом лишається ", { term: no }], pt: [{ term: "nada" }, " depois do verbo mantém ", { term: "no" }, " antes dele"], fr: [{ term: "nada" }, " après le verbe garde ", { term: "no" }, " devant le verbe"], de: [{ term: "nada" }, " hinter dem Verb: ", { term: "no" }, " bleibt davor"], it: [{ term: "nada" }, " dopo il verbo mantiene ", { term: "no" }, " davanti"], pl: [{ term: "nada" }, " po czasowniku: ", { term: "no" }, " zostaje przed czasownikiem"], tr: [{ term: "nada" }, " fiilin arkasında olsa da ", { term: "no" }, " fiilin önünde kalır"], id: [{ term: "nada" }, " setelah kata kerja: ", { term: "no" }, " tetap ada sebelum kata kerja"], vi: [{ term: "nada" }, " đứng sau động từ thì vẫn giữ ", { term: "no" }, " trước động từ"] }
          ex: [{ target: No }, " tengo ", { target: nada }, "."]
          tr: { en: I have nothing., uk: У мене нічого немає., pt: "Não tenho nada.", fr: "Je n’ai rien.", de: "Ich habe nichts.", it: "Non ho niente.", pl: "Nic nie mam.", tr: "Hiçbir şeyim yok.", id: "Saya tidak punya apa-apa.", vi: "Tôi không có gì cả." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: ninguno }, " is singular"], es: [{ term: ninguno }, " va en singular"], uk: [{ term: ninguno }, " вживається в однині"], pt: [{ term: "ninguno" }, " fica no singular"], fr: [{ term: "ninguno" }, " reste au singulier"], de: [{ term: "ninguno" }, " steht im Singular"], it: [{ term: "ninguno" }, " resta al singolare"], pl: [{ term: "ninguno" }, " występuje w liczbie pojedynczej"], tr: [{ term: "ninguno" }, " tekil kalır"], id: [{ term: "ninguno" }, " selalu tunggal"], vi: [{ term: "ninguno" }, " luôn ở số ít"] }
          ex: ["No tengo ", { target: ningún }, " hermano."]
          tr: { en: "I don't have any brothers.", uk: У мене немає братів., pt: "Não tenho nenhum irmão.", fr: "Je n’ai aucun frère.", de: "Ich habe keinen Bruder.", it: "Non ho nessun fratello.", pl: "Nie mam żadnego brata.", tr: "Hiç erkek kardeşim yok.", id: "Saya tidak punya saudara laki-laki.", vi: "Tôi không có anh em trai nào." }

sections:
  - title: { en: "Form: positive and negative", es: "Forma: afirmativa y negativa", uk: "Форма: стверджувальна і заперечна", pt: "Forma: afirmativa e negativa", fr: "Forme : affirmative et négative", de: "Form: bejaht und verneint", it: "Forma: affermativa e negativa", pl: "Forma: twierdząca i przecząca", tr: "Biçim: olumlu ve olumsuz", id: "Bentuk: positif dan negatif", vi: "Dạng: khẳng định và phủ định" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: kind, label: { en: For, es: Para, uk: Для, pt: "Para", fr: "Pour", de: "Für", it: "Per", pl: "Dla", tr: "İçin", id: "Untuk", vi: "Cho" } }
          - { key: pos, label: { en: Positive, es: Afirmativo, uk: Стверджувальне, pt: "Afirmativo", fr: "Affirmatif", de: "Bejaht", it: "Affermativo", pl: "Twierdzące", tr: "Olumlu", id: "Positif", vi: "Khẳng định" }, features: { polarity: pos } }
          - { key: neg, label: { en: Negative, es: Negativo, uk: Заперечне, pt: "Negativo", fr: "Négatif", de: "Verneint", it: "Negativo", pl: "Przeczące", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }, features: { polarity: neg } }
        rows:
          - { level: B1, kind: { en: things, es: cosas, uk: речей, pt: "coisas", fr: "choses", de: "Dinge", it: "cose", pl: "rzeczy", tr: "şeyler", id: "benda", vi: "vật" }, pos: { target: algo }, neg: { target: nada } }
          - { level: B1, kind: { en: people, es: personas, uk: людей, pt: "pessoas", fr: "personnes", de: "Personen", it: "persone", pl: "osoby", tr: "kişiler", id: "orang", vi: "người" }, pos: { target: alguien }, neg: { target: nadie } }
          - { level: B1, kind: { en: before a noun, es: delante del sustantivo, uk: перед іменником, pt: "antes do substantivo", fr: "devant un nom", de: "vor einem Nomen", it: "davanti a un sostantivo", pl: "przed rzeczownikiem", tr: "isimden önce", id: "sebelum kata benda", vi: "trước danh từ" }, pos: { alternatives: [{ target: algún }, { target: alguna }, { target: algunos }, { target: algunas }] }, neg: { alternatives: [{ target: ningún }, { target: ninguna }] } }
          - { level: B1, kind: { en: alone, es: solo, uk: без іменника, pt: "sozinho", fr: "seul", de: "allein", it: "da solo", pl: "samodzielnie", tr: "tek başına", id: "berdiri sendiri", vi: "đứng một mình" }, pos: { alternatives: [{ target: alguno }, { target: alguna }, { target: algunos }, { target: algunas }] }, neg: { alternatives: [{ target: ninguno }, { target: ninguna }] } }
          - { level: A2, kind: { en: time, es: tiempo, uk: часу, pt: "tempo", fr: "temps", de: "Zeit", it: "tempo", pl: "czas", tr: "zaman", id: "waktu", vi: "thời gian" }, pos: { alternatives: [{ target: alguna vez }, { target: siempre }] }, neg: { target: nunca } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: alguno }, " and ", { term: ninguno }, " drop the -o before a masculine singular noun:"]
              es: [{ term: alguno }, " y ", { term: ninguno }, " pierden la -o delante de un masculino singular:"]
              uk: [{ term: alguno }, " і ", { term: ninguno }, " втрачають -o перед іменником чоловічого роду однини:"]
              pt: [{ term: "alguno" }, " e ", { term: "ninguno" }, " perdem o -o antes de um substantivo masculino singular:"]
              fr: [{ term: "alguno" }, " et ", { term: "ninguno" }, " perdent le -o devant un nom masculin singulier :"]
              de: [{ term: "alguno" }, " und ", { term: "ninguno" }, " verlieren das -o vor einem Nomen im Maskulinum Singular:"]
              it: [{ term: "alguno" }, " e ", { term: "ninguno" }, " perdono la -o davanti a un sostantivo maschile singolare:"]
              pl: [{ term: "alguno" }, " i ", { term: "ninguno" }, " tracą końcówkę -o przed rzeczownikiem rodzaju męskiego w liczbie pojedynczej:"]
              tr: [{ term: "alguno" }, " ve ", { term: "ninguno" }, ", eril tekil bir isimden önce -o harfini kaybeder:"]
              id: [{ term: "alguno" }, " dan ", { term: "ninguno" }, " kehilangan -o sebelum kata benda maskulin tunggal:"]
              vi: [{ term: "alguno" }, " và ", { term: "ninguno" }, " bỏ -o khi đứng trước danh từ giống đực số ít:"]
            ex: { examples: [[{ target: algún }, " día"], [{ target: ningún }, " problema"]] }
            tr: { en: { examples: [some day, no problem] }, uk: { examples: [колись, жодних проблем] }, pt: { examples: ["algum dia", "nenhum problema"] }, fr: { examples: ["un jour", "aucun problème"] }, de: { examples: ["irgendwann", "kein Problem"] }, it: { examples: ["un giorno", "nessun problema"] }, pl: { examples: ["kiedyś", "żaden problem"] }, tr: { examples: ["bir gün", "hiçbir sorun"] }, id: { examples: ["suatu hari", "tidak ada masalah"] }, vi: { examples: ["một ngày nào đó", "không có vấn đề nào"] } }
          - type: rule
            level: B1
            text:
              en: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " and ", { term: nadie }, " never change."]
              es: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " y ", { term: nadie }, " no cambian."]
              uk: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " і ", { term: nadie }, " не змінюються."]
              pt: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " e ", { term: "nadie" }, " não mudam."]
              fr: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " et ", { term: "nadie" }, " ne changent pas."]
              de: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " und ", { term: "nadie" }, " bleiben unverändert."]
              it: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " e ", { term: "nadie" }, " non cambiano."]
              pl: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " i ", { term: "nadie" }, " nie zmieniają się."]
              tr: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " ve ", { term: "nadie" }, " değişmez."]
              id: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " dan ", { term: "nadie" }, " tidak berubah."]
              vi: [{ term: "algo" }, ", ", { term: "nada" }, ", ", { term: "alguien" }, " và ", { term: "nadie" }, " không thay đổi."]
          - type: rule
            level: B1
            text:
              en: [{ term: ninguno }, " goes in the singular, also where English has a plural:"]
              es: [{ term: ninguno }, " va en singular:"]
              uk: [{ term: ninguno }, " вживається в однині, навіть там, де українською кажемо в множині:"]
              pt: [{ term: "ninguno" }, " fica no singular:"]
              fr: [{ term: "ninguno" }, " reste au singulier :"]
              de: [{ term: "ninguno" }, " steht im Singular:"]
              it: [{ term: "ninguno" }, " resta al singolare:"]
              pl: [{ term: "ninguno" }, " występuje w liczbie pojedynczej:"]
              tr: [{ term: "ninguno" }, " tekil kalır:"]
              id: [{ term: "ninguno" }, " selalu tunggal:"]
              vi: [{ term: "ninguno" }, " luôn ở số ít:"]
            ex: ["No tengo ", { target: ningún }, " hermano."]
            tr: { en: "I don't have any brothers.", uk: У мене немає братів., pt: "Não tenho nenhum irmão.", fr: "Je n’ai aucun frère.", de: "Ich habe keinen Bruder.", it: "Non ho nessun fratello.", pl: "Nie mam żadnego brata.", tr: "Hiç erkek kardeşim yok.", id: "Saya tidak punya saudara laki-laki.", vi: "Tôi không có anh em trai nào." }
          - type: rule
            level: B2
            text:
              es: [{ term: un }, " presenta un referente; ", { term: algún }, " lo deja sin identificar."]
              en: [{ term: un }, " brings in a person or thing; ", { term: algún }, " leaves it unidentified."]
              uk: [{ term: un }, " вводить особу чи річ; ", { term: algún }, " залишає її невизначеною."]
              pt: [{ term: un }, " apresenta uma pessoa ou coisa; ", { term: algún }, " a deixa sem identificar."]
              fr: [{ term: un }, " introduit une personne ou une chose ; ", { term: algún }, " la laisse non identifiée."]
              de: [{ term: un }, " führt eine Person oder Sache ein; ", { term: algún }, " lässt sie unbestimmt."]
              it: [{ term: un }, " introduce una persona o una cosa; ", { term: algún }, " la lascia non identificata."]
              pl: [{ term: un }, " wprowadza osobę lub rzecz; ", { term: algún }, " pozostawia ją niezidentyfikowaną."]
              tr: [{ term: un }, " bir kişiyi ya da şeyi ortaya koyar; ", { term: algún }, " onu belirsiz bırakır."]
              id: [{ term: un }, " memperkenalkan orang atau benda; ", { term: algún }, " membiarkannya tidak teridentifikasi."]
              vi: [{ term: un }, " đưa ra một người hoặc vật; ", { term: algún }, " để nó không xác định."]
            ex: { examples: [["Ha venido ", { target: un }, " amigo."], ["¿Ha venido ", { target: algún }, " amigo?"]] }
            tr: { en: { examples: ["A friend has come.", "Has any friend come?"] }, uk: { examples: ["Прийшов друг.", "Чи прийшов якийсь друг?"] }, pt: { examples: ["Veio um amigo.", "Veio algum amigo?"] }, fr: { examples: ["Un ami est venu.", "Un ami est-il venu ?"] }, de: { examples: ["Ein Freund ist gekommen.", "Ist irgendein Freund gekommen?"] }, it: { examples: ["È venuto un amico.", "È venuto qualche amico?"] }, pl: { examples: ["Przyszedł pewien przyjaciel.", "Czy przyszedł jakiś przyjaciel?"] }, tr: { examples: ["Bir arkadaş geldi.", "Arkadaşlardan biri geldi mi?"] }, id: { examples: ["Seorang teman sudah datang.", "Apakah ada teman yang datang?"] }, vi: { examples: ["Một người bạn đã đến.", "Có người bạn nào đến không?"] } }

  - title: { en: "Use: questions and negatives", es: "Uso: preguntas y negación", uk: "Вживання: питання і заперечення", pt: "Uso: perguntas e negação", fr: "Emploi : questions et négation", de: "Gebrauch: Fragen und Verneinung", it: "Uso: domande e negazione", pl: "Użycie: pytania i przeczenie", tr: "Kullanım: sorular ve olumsuzluk", id: "Penggunaan: pertanyaan dan kalimat negatif", vi: "Cách dùng: câu hỏi và phủ định" }
    role: use
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема", pt: "Padrão", fr: "Schéma", de: "Muster", it: "Schema", pl: "Schemat", tr: "Kalıp", id: "Pola", vi: "Mẫu câu" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A2
            pattern: { pattern: [{ term: no }, { slot: verb }, { alternatives: [{ term: nada }, { term: nadie }, { term: nunca }] }] }
            ex: [{ target: No }, " veo ", { target: nada }, "."]
            tr: { en: "I can't see anything.", uk: Я нічого не бачу., pt: "Não vejo nada.", fr: "Je ne vois rien.", de: "Ich sehe nichts.", it: "Non vedo niente.", pl: "Niczego nie widzę.", tr: "Hiçbir şey görmüyorum.", id: "Saya tidak melihat apa-apa.", vi: "Tôi không thấy gì cả." }
          - level: B1
            pattern: { pattern: [{ alternatives: [{ term: nada }, { term: nadie }, { term: nunca }] }, { slot: verb }] }
            ex: [{ target: Nadie }, " me llama."]
            tr: { en: Nobody calls me., uk: Мені ніхто не дзвонить., pt: "Ninguém me liga.", fr: "Personne ne m’appelle.", de: "Niemand ruft mich an.", it: "Nessuno mi chiama.", pl: "Nikt do mnie nie dzwoni.", tr: "Beni kimse aramıyor.", id: "Tidak ada yang meneleponku.", vi: "Không ai gọi cho tôi." }
          - level: B1
            pattern: { en: a question, es: una pregunta, uk: запитання, pt: "uma pergunta", fr: "une question", de: "eine Frage", it: "una domanda", pl: "pytanie", tr: "bir soru", id: "pertanyaan", vi: "một câu hỏi" }
            ex: ["¿Necesitas ", { target: algo }, "?"]
            tr: { en: Do you need anything?, uk: Тобі щось потрібно?, pt: "Você precisa de alguma coisa?", fr: "As-tu besoin de quelque chose ?", de: "Brauchst du etwas?", it: "Hai bisogno di qualcosa?", pl: "Potrzebujesz czegoś?", tr: "Bir şeye ihtiyacın var mı?", id: "Apakah kamu butuh sesuatu?", vi: "Bạn có cần gì không?" }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A negative word after the verb needs ", { term: no }, " before the verb."]
              es: ["La palabra negativa detrás del verbo necesita ", { term: no }, " delante."]
              uk: ["Заперечне слово після дієслова потребує ", { term: no }, " перед дієсловом."]
              pt: ["A palavra negativa depois do verbo precisa de ", { term: "no" }, " antes dele."]
              fr: ["Le mot négatif après le verbe exige ", { term: "no" }, " devant le verbe."]
              de: ["Ein Verneinungswort hinter dem Verb braucht ", { term: "no" }, " davor."]
              it: ["La parola negativa dopo il verbo richiede ", { term: "no" }, " davanti."]
              pl: ["Słowo przeczące po czasowniku wymaga ", { term: "no" }, " przed czasownikiem."]
              tr: ["Fiilin arkasındaki olumsuz sözcük, fiilin önünde ", { term: "no" }, " gerektirir."]
              id: ["Kata negatif setelah kata kerja membutuhkan ", { term: "no" }, " sebelum kata kerja."]
              vi: ["Từ phủ định đứng sau động từ cần có ", { term: "no" }, " trước động từ."]
          - type: rule
            level: B1
            text:
              en: "A negative word before the verb stands alone."
              es: "La palabra negativa delante del verbo va sola."
              uk: ["Заперечне слово перед дієсловом стоїть без ", { term: no }, "."]
              pt: "A palavra negativa antes do verbo fica sozinha."
              fr: "Le mot négatif placé devant le verbe s’emploie seul."
              de: "Steht das Verneinungswort vor dem Verb, steht es allein."
              it: "La parola negativa davanti al verbo sta da sola."
              pl: "Słowo przeczące przed czasownikiem stoi samo."
              tr: "Fiilin önündeki olumsuz sözcük tek başına kullanılır."
              id: "Kata negatif sebelum kata kerja berdiri sendiri."
              vi: "Từ phủ định đứng trước động từ thì đứng một mình."
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: "В українській «не» потрібне завжди: «ніхто не дзвонить», «я нічого не бачу». В іспанській no стоїть лише тоді, коли заперечне слово йде після дієслова: No veo nada, але Nadie me llama."
          - type: rule
            level: B1
            readers: [en]
            text:
              en: ["English “any” in a question is ", { term: algo }, " or ", { term: alguien }, ":"]
            ex: ["¿Hay ", { target: alguien }, " en casa?"]
            tr: { en: Is anyone at home? }
          - type: rule
            level: B1
            text:
              en: [{ term: alguien }, " and ", { term: nadie }, " as an object take ", { term: a }, ":"]
              es: [{ term: alguien }, " y ", { term: nadie }, " como objeto llevan ", { term: a }, ":"]
              uk: [{ term: alguien }, " і ", { term: nadie }, " у ролі додатка вживаються з ", { term: a }, ":"]
              pt: [{ term: "alguien" }, " e ", { term: "nadie" }, " como objeto levam ", { term: "a" }, ":"]
              fr: [{ term: "alguien" }, " et ", { term: "nadie" }, " en complément d’objet direct prennent ", { term: "a" }, " :"]
              de: [{ term: "alguien" }, " und ", { term: "nadie" }, " als Objekt stehen mit ", { term: "a" }, ":"]
              it: [{ term: "alguien" }, " e ", { term: "nadie" }, " come complemento oggetto prendono ", { term: "a" }, ":"]
              pl: [{ term: "alguien" }, " i ", { term: "nadie" }, " w roli dopełnienia występują z ", { term: "a" }, ":"]
              tr: [{ term: "alguien" }, " ve ", { term: "nadie" }, " nesne olduğunda ", { term: "a" }, " alır:"]
              id: [{ term: "alguien" }, " dan ", { term: "nadie" }, " sebagai objek memakai ", { term: "a" }, ":"]
