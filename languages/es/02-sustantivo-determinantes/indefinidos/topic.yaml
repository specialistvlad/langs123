id: es.sustantivo-determinantes.indefinidos
lang: es
kind: grammar
tags: [indefinites, pronouns, determiners, negation]
concepts: [indefinite-pronouns]
related: [es.sustantivo-determinantes.cuantificadores, es.oracion.preguntas-negacion, es.pronombres.objeto-directo]
status: { en: draft, es: draft, uk: draft }
translated: { en: "c5cd08 ad5839 538df5 76fe1e 2502d6 424a74", uk: "c5cd08 ad5839 538df5 76fe1e 2502d6 424a74" }

title: { en: "Indefinites: algo, nadie, ningún", es: "Los indefinidos: algo, nadie, ningún", uk: "Неозначені й заперечні займенники: algo, nadie, ningún" }
summary:
  lead:
    en: [{ term: Algo }, ", ", { term: alguien }, " and ", { term: algún }, " point to something or someone not named; ", { term: nada }, ", ", { term: nadie }, " and ", { term: ningún }, " deny them."]
    es: [{ term: Algo }, ", ", { term: alguien }, " y ", { term: algún }, " señalan algo o a alguien sin nombrarlo; ", { term: nada }, ", ", { term: nadie }, " y ", { term: ningún }, " lo niegan."]
    uk: [{ term: Algo }, ", ", { term: alguien }, " і ", { term: algún }, " вказують на щось чи когось, не називаючи; ", { term: nada }, ", ", { term: nadie }, " і ", { term: ningún }, " це заперечують."]
  rule:
    en: ["After the verb, a negative word needs ", { term: no }, " before the verb:"]
    es: ["Detrás del verbo, la palabra negativa necesita ", { term: no }, " delante del verbo:"]
    uk: ["Якщо заперечне слово стоїть після дієслова, перед дієсловом потрібне ", { term: no }, ":"]
  ex: { examples: [[{ target: No }, " veo ", { target: nada }, "."], [{ target: No }, " hay ", { target: nadie }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A2
          point: { en: Short answers, es: Respuestas cortas, uk: Короткі відповіді }
          rule: { en: [{ alternatives: [{ term: Nada }, { term: Nadie }, { term: Nunca }] }, " answer a question alone"], es: [{ alternatives: [{ term: Nada }, { term: Nadie }, { term: Nunca }] }, " responden solos a una pregunta"], uk: [{ alternatives: [{ term: Nada }, { term: Nadie }, { term: Nunca }] }, " самі по собі відповідають на питання"] }
          ex: { exchange: ["¿Qué quieres?", [{ target: Nada }, "."]] }
          tr: { en: { exchange: [What do you want?, Nothing.] }, uk: { exchange: [Чого ти хочеш?, Нічого.] } }
        - level: B1
          point: { en: Things, es: Cosas, uk: Речі }
          rule: { contrast: [{ term: algo }, { term: nada }] }
          ex: ["¿Quieres ", { target: algo }, "?"]
          tr: { en: Do you want something?, uk: Хочеш чогось? }
        - level: B1
          point: { en: People, es: Personas, uk: Люди }
          rule: { contrast: [{ term: alguien }, { term: nadie }] }
          ex: ["¿Hay ", { target: alguien }, " en casa?"]
          tr: { en: Is anyone at home?, uk: Є хтось удома? }
        - level: B1
          point: { en: With a noun, es: Con sustantivo, uk: З іменником }
          rule: { contrast: [{ alternatives: [{ term: algún }, { term: alguna }] }, { alternatives: [{ term: ningún }, { term: ninguna }] }] }
          ex: ["¿Tienes ", { target: alguna }, " pregunta?"]
          tr: { en: Do you have any questions?, uk: У тебе є якесь запитання? }
        - level: B1
          point: { en: Before the verb, es: Delante del verbo, uk: Перед дієсловом }
          rule: { en: ["the negative word alone, with no ", { term: no }], es: ["la palabra negativa sola, sin ", { term: no }], uk: ["заперечне слово саме, без ", { term: no }] }
          ex: [{ target: Nadie }, " sabe la respuesta."]
          tr: { en: Nobody knows the answer., uk: Ніхто не знає відповіді. }
        - level: B1
          point: { en: Short forms, es: Formas cortas, uk: Короткі форми }
          rule: { en: [{ term: algún }, ", ", { term: ningún }, " before a masculine singular noun"], es: [{ term: algún }, ", ", { term: ningún }, " delante de un masculino singular"], uk: [{ term: algún }, ", ", { term: ningún }, " перед іменником чоловічого роду однини"] }
          ex: ["No tengo ", { target: ningún }, " problema."]
          tr: { en: I have no problem., uk: У мене немає жодних проблем. }
        - level: B1
          point: { en: People as objects, es: Personas como objeto, uk: Люди як додаток }
          rule: { en: [{ term: a alguien }, ", ", { term: a nadie }], es: [{ term: a alguien }, ", ", { term: a nadie }], uk: [{ term: a alguien }, ", ", { term: a nadie }] }
          ex: ["No conozco ", { target: a nadie }, " aquí."]
          tr: { en: "I don't know anyone here.", uk: Я нікого тут не знаю. }
        - level: B1
          point: { en: One of a group, es: Uno de un grupo, uk: Один із групи }
          rule: { pattern: [{ alternatives: [{ term: alguno de }, { term: ninguno de }] }, { slot: plural noun }] }
          ex: [{ target: Ninguno de }, " mis amigos habla ruso."]
          tr: { en: None of my friends speaks Russian., uk: Ніхто з моїх друзів не розмовляє російською. }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: [{ term: nada }, " after the verb keeps ", { term: no }, " before it"], es: [{ term: nada }, " detrás del verbo mantiene ", { term: no }, " delante"], uk: ["коли ", { term: nada }, " стоїть після дієслова, перед дієсловом лишається ", { term: no }] }
          ex: [{ target: No }, " tengo ", { target: nada }, "."]
          tr: { en: I have nothing., uk: У мене нічого немає. }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: [{ term: ninguno }, " is singular"], es: [{ term: ninguno }, " va en singular"], uk: [{ term: ninguno }, " вживається в однині"] }
          ex: ["No tengo ", { target: ningún }, " hermano."]
          tr: { en: "I don't have any brothers.", uk: У мене немає братів. }

sections:
  - title: { en: "Form: positive and negative", es: "Forma: afirmativa y negativa", uk: "Форма: стверджувальна і заперечна" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: kind, label: { en: For, es: Para, uk: Для } }
          - { key: pos, label: { en: Positive, es: Afirmativo, uk: Стверджувальне }, features: { polarity: pos } }
          - { key: neg, label: { en: Negative, es: Negativo, uk: Заперечне }, features: { polarity: neg } }
        rows:
          - { level: B1, kind: { en: things, es: cosas, uk: речей }, pos: { target: algo }, neg: { target: nada } }
          - { level: B1, kind: { en: people, es: personas, uk: людей }, pos: { target: alguien }, neg: { target: nadie } }
          - { level: B1, kind: { en: before a noun, es: delante del sustantivo, uk: перед іменником }, pos: { alternatives: [{ target: algún }, { target: alguna }, { target: algunos }, { target: algunas }] }, neg: { alternatives: [{ target: ningún }, { target: ninguna }] } }
          - { level: B1, kind: { en: alone, es: solo, uk: без іменника }, pos: { alternatives: [{ target: alguno }, { target: alguna }, { target: algunos }, { target: algunas }] }, neg: { alternatives: [{ target: ninguno }, { target: ninguna }] } }
          - { level: A2, kind: { en: time, es: tiempo, uk: часу }, pos: { alternatives: [{ target: alguna vez }, { target: siempre }] }, neg: { target: nunca } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: alguno }, " and ", { term: ninguno }, " drop the -o before a masculine singular noun:"]
              es: [{ term: alguno }, " y ", { term: ninguno }, " pierden la -o delante de un masculino singular:"]
              uk: [{ term: alguno }, " і ", { term: ninguno }, " втрачають -o перед іменником чоловічого роду однини:"]
            ex: { examples: [[{ target: algún }, " día"], [{ target: ningún }, " problema"]] }
            tr: { en: { examples: [some day, no problem] }, uk: { examples: [колись, жодних проблем] } }
          - type: rule
            level: B1
            text:
              en: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " and ", { term: nadie }, " never change."]
              es: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " y ", { term: nadie }, " no cambian."]
              uk: [{ term: algo }, ", ", { term: nada }, ", ", { term: alguien }, " і ", { term: nadie }, " не змінюються."]
          - type: rule
            level: B1
            text:
              en: [{ term: ninguno }, " goes in the singular, also where English has a plural:"]
              es: [{ term: ninguno }, " va en singular:"]
              uk: [{ term: ninguno }, " вживається в однині, навіть там, де українською кажемо в множині:"]
            ex: ["No tengo ", { target: ningún }, " hermano."]
            tr: { en: "I don't have any brothers.", uk: У мене немає братів. }

  - title: { en: "Use: questions and negatives", es: "Uso: preguntas y negación", uk: "Вживання: питання і заперечення" }
    role: use
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - level: A2
            pattern: { pattern: [{ term: no }, { slot: verb }, { alternatives: [{ term: nada }, { term: nadie }, { term: nunca }] }] }
            ex: [{ target: No }, " veo ", { target: nada }, "."]
            tr: { en: "I can't see anything.", uk: Я нічого не бачу. }
          - level: B1
            pattern: { pattern: [{ alternatives: [{ term: nada }, { term: nadie }, { term: nunca }] }, { slot: verb }] }
            ex: [{ target: Nadie }, " me llama."]
            tr: { en: Nobody calls me., uk: Мені ніхто не дзвонить. }
          - level: B1
            pattern: { en: a question, es: una pregunta, uk: запитання }
            ex: ["¿Necesitas ", { target: algo }, "?"]
            tr: { en: Do you need anything?, uk: Тобі щось потрібно? }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A negative word after the verb needs ", { term: no }, " before the verb."]
              es: ["La palabra negativa detrás del verbo necesita ", { term: no }, " delante."]
              uk: ["Заперечне слово після дієслова потребує ", { term: no }, " перед дієсловом."]
          - type: rule
            level: B1
            text:
              en: "A negative word before the verb stands alone."
              es: "La palabra negativa delante del verbo va sola."
              uk: ["Заперечне слово перед дієсловом стоїть без ", { term: no }, "."]
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: "В українській «не» потрібне завжди: «ніхто не дзвонить», «я нічого не бачу». В іспанській no стоїть лише тоді, коли заперечне слово йде після дієслова: No veo nada, але Nadie me llama."
          - type: rule
            level: B1
            readers: [en]
            text:
              en: ["English “any” in a question is ", { term: algo }, " or ", { term: alguien }, ":"]
            ex: ["¿Hay ", { target: alguien }, " en casa?"]
            tr: { en: Is anyone at home? }
          - type: rule
            level: B1
            text:
              en: [{ term: alguien }, " and ", { term: nadie }, " as an object take ", { term: a }, ":"]
              es: [{ term: alguien }, " y ", { term: nadie }, " como objeto llevan ", { term: a }, ":"]
              uk: [{ term: alguien }, " і ", { term: nadie }, " у ролі додатка вживаються з ", { term: a }, ":"]
            ex: ["¿Conoces ", { target: a alguien }, " en Lima?"]
            tr: { en: Do you know anyone in Lima?, uk: Ти знаєш когось у Лімі? }
          - type: note
            level: B1
            text:
              en: ["The personal ", { term: a }, ": see ", { link: Direct Object Pronouns and Personal a, to: es.pronombres.objeto-directo }, "."]
              es: ["La ", { term: a }, " personal: ver ", { link: El objeto directo y la a personal, to: es.pronombres.objeto-directo }, "."]
              uk: ["Особове ", { term: a }, ": див. ", { link: "Займенники прямого додатка й особове a", to: es.pronombres.objeto-directo }, "."]

  - title: { en: "Use: alguno de and ninguno de", es: "Uso: alguno de y ninguno de", uk: "Вживання: alguno de і ninguno de" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: Форма } }
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - level: B1
            form: { pattern: [{ alternatives: [{ term: alguno de }, { term: ninguno de }] }, { slot: plural noun }] }
            use: { en: one of a group, es: uno de un grupo, uk: один із групи }
            ex: { examples: [["¿", { target: Alguno de }, " ustedes habla inglés?"], [{ target: Ninguno de }, " mis amigos habla ruso."]] }
            tr: { en: { examples: [Do any of you speak English?, None of my friends speaks Russian.] }, uk: { examples: [Хтось із вас розмовляє англійською?, Ніхто з моїх друзів не розмовляє російською.] } }
          - level: B1
            form: { pattern: [{ alternatives: [{ term: algo }, { term: nada }] }, { slot: adjective }] }
            use: { en: something of a kind, es: algo de un tipo, uk: щось певного виду }
            ex: { examples: [["¿Hay ", { target: algo interesante }, " en la tele?"], ["No pasa ", { target: nada grave }, "."]] }
            tr: { en: { examples: [Is there anything interesting on TV?, "Nothing serious is happening."] }, uk: { examples: [По телевізору є щось цікаве?, Нічого серйозного не сталося.] } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: ninguno de }, " takes a singular verb:"]
              es: [{ term: ninguno de }, " lleva el verbo en singular:"]
              uk: ["Після ", { term: ninguno de }, " дієслово стоїть в однині:"]
            ex: [{ target: Ninguno }, " de ellos ", { target: vino }, "."]
            tr: { en: None of them came., uk: Ніхто з них не прийшов. }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Tengo nada., right: [{ target: No }, " tengo nada."], rule: { en: [{ term: nada }, " after the verb needs ", { term: no }], es: [{ term: nada }, " detrás del verbo necesita ", { term: no }], uk: [{ term: nada }, " після дієслова потребує ", { term: no }] } }
          - { level: B1, wrong: Nadie no viene., right: [{ target: Nadie }, " viene."], rule: { en: ["before the verb, no ", { term: no }], es: ["delante del verbo, sin ", { term: no }], uk: ["перед дієсловом — без ", { term: no }] } }
          - { level: B1, wrong: No tengo ningunos hermanos., right: ["No tengo ", { target: ningún }, " hermano."], rule: { en: [{ term: ninguno }, " is singular"], es: [{ term: ninguno }, " va en singular"], uk: [{ term: ninguno }, " вживається в однині"] } }
          - { level: B1, wrong: alguno día, right: [{ target: algún }, " día"], rule: { en: "-o drops before a masculine singular noun", es: "la -o cae delante de un masculino singular", uk: "-o випадає перед іменником чоловічого роду однини" } }
          - { level: B1, wrong: No conozco nadie., right: ["No conozco ", { target: a }, " nadie."], rule: { en: ["a person as an object takes ", { term: a }], es: ["la persona como objeto lleva ", { term: a }], uk: ["людина в ролі додатка вживається з ", { term: a }] } }
          - { level: A2, speakers: [en], wrong: No tengo algo., right: ["No tengo ", { target: nada }, "."], rule: { en: ["in a negative, “anything” is ", { term: nada }] } }
          - { level: B1, speakers: [uk], wrong: Nadie no me llama., right: [{ target: Nadie }, " me llama."], rule: { uk: ["українською «ніхто не дзвонить», але іспанською заперечне слово перед дієсловом іде без ", { term: no }] } }
