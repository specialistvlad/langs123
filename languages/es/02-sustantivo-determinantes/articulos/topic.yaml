              it: [{ term: hay }, " vuole ", { term: un }, ", ", { term: una }, " o nessun articolo, e ", { term: está }, " vuole ", { term: el }, " o ", { term: la }, ": vedi ", { link: Hay e está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
