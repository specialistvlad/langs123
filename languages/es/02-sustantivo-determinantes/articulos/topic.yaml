          point: { es: Artículo enfático, en: "Emphatic article", uk: "Підсилювальний артикль", pt: "Artigo enfático", fr: "Article emphatique", de: "Emphatischer Artikel", it: "Articolo enfatico", pl: "Przedimek emfatyczny", tr: "Pekiştirici artikel", id: "Artikel penegas", vi: "Mạo từ nhấn mạnh" }
          rule: { es: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": el grado; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": la ponderación"], en: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": the degree; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": the emphasis"], uk: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": ступінь; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": підсилення"], pt: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": o grau; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": a ênfase"], fr: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, " : le degré ; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, " : l’insistance"], de: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": der Grad; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": die Hervorhebung"], it: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": il grado; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": l’enfasi"], pl: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": stopień; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": podkreślenie"], tr: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": derece; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": pekiştirme"], id: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": tingkat; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": penekanan"], vi: [{ pattern: [{ term: lo }, { slot: adverb }, { term: que }] }, ": mức độ; ", { pattern: [{ term: la }, { slot: noun }, { term: que }] }, ": sự nhấn mạnh"] }
          ex: { examples: [["¡", { target: Lo mal que }, " cantó!"], ["¡", { target: La cara que }, " puso!"]] }
          tr: { en: { examples: ["How badly he sang!", "What a face he pulled!"] }, uk: { examples: ["Як погано він співав!", "Яку міну він скорчив!"] }, pt: { examples: ["Como ele cantou mal!", "A cara que ele fez!"] }, fr: { examples: ["Comme il a mal chanté !", "La tête qu’il a faite !"] }, de: { examples: ["Wie schlecht er gesungen hat!", "Was für ein Gesicht er gemacht hat!"] }, it: { examples: ["Come ha cantato male!", "Che faccia ha fatto!"] }, pl: { examples: ["Jak on fatalnie śpiewał!", "Jaką minę zrobił!"] }, tr: { examples: ["Ne kötü şarkı söyledi!", "Ne suratlar astı!"] }, id: { examples: ["Betapa buruknya nyanyiannya!", "Betapa masamnya wajahnya!"] }, vi: { examples: ["Anh ấy hát dở làm sao!", "Anh ấy làm vẻ mặt gì thế kia!"] } }
        - level: C1
          point: { es: Sin determinante, en: "No determiner", uk: "Без детермінатива", pt: "Sem determinante", fr: "Sans déterminant", de: "Ohne Begleiter", it: "Senza determinante", pl: "Bez określnika", tr: "Belirleyicisiz", id: "Tanpa determiner", vi: "Không có từ hạn định" }
          rule: { es: ["sin artículo tras ", { term: nombrar }, " y ", { term: declarar }, ", y en el instrumento"], en: ["no article after ", { term: nombrar }, " and ", { term: declarar }, ", and with an instrument"], uk: ["без артикля після ", { term: nombrar }, " і ", { term: declarar }, " та при назві знаряддя"], pt: ["sem artigo depois de ", { term: nombrar }, " e ", { term: declarar }, ", e no instrumento"], fr: ["sans article après ", { term: nombrar }, " et ", { term: declarar }, ", et pour l’instrument"], de: ["ohne Artikel nach ", { term: nombrar }, " und ", { term: declarar }, " sowie bei der Angabe des Mittels"], it: ["senza articolo dopo ", { term: nombrar }, " e ", { term: declarar }, ", e con lo strumento"], pl: ["bez przedimka po ", { term: nombrar }, " i ", { term: declarar }, " oraz przy narzędziu"], tr: [{ term: nombrar }, " ve ", { term: declarar }, " fiillerinden sonra ve araç bildirirken artikelsiz"], id: ["tanpa artikel setelah ", { term: nombrar }, " dan ", { term: declarar }, ", dan untuk alat"], vi: ["không có mạo từ sau ", { term: nombrar }, " và ", { term: declarar }, ", và với dụng cụ"] }
          ex: { examples: [["La nombraron ", { target: directora }, "."], ["Escribió la carta ", { target: a mano }, "."]] }
          tr: { en: { examples: ["They named her director.", "He wrote the letter by hand."] }, uk: { examples: ["Її призначили директоркою.", "Він написав листа від руки."] }, pt: { examples: ["Nomearam-na diretora.", "Ele escreveu a carta à mão."] }, fr: { examples: ["Ils l’ont nommée directrice.", "Il a écrit la lettre à la main."] }, de: { examples: ["Sie wurde zur Direktorin ernannt.", "Er schrieb den Brief mit der Hand."] }, it: { examples: ["L’hanno nominata direttrice.", "Ha scritto la lettera a mano."] }, pl: { examples: ["Mianowano ją dyrektorką.", "Napisał list odręcznie."] }, tr: { examples: ["Onu müdür atadılar.", "Mektubu elle yazdı."] }, id: { examples: ["Mereka mengangkatnya menjadi direktur.", "Dia menulis surat itu dengan tangan."] }, vi: { examples: ["Họ bổ nhiệm cô ấy làm giám đốc.", "Anh ấy viết thư bằng tay."] } }
        - level: C2
          point: { es: "Nombres propios, uso social", en: "Proper names, social use", uk: "Власні назви: соціальне вживання", pt: "Nomes próprios, uso social", fr: "Noms propres, emploi social", de: "Eigennamen, sozialer Gebrauch", it: "Nomi propri, uso sociale", pl: "Nazwy własne, użycie towarzyskie", tr: "Özel adlar, toplumsal kullanım", id: "Nama diri, pemakaian sosial", vi: "Tên riêng, cách dùng xã giao" }
          rule: { es: "artículo ante el nombre de pila o el apellido: confianza, fastidio o cariño", en: "article before a first name or a surname: familiarity, annoyance or affection", uk: "артикль перед ім’ям або прізвищем: фамільярність, роздратування чи ласка", pt: "artigo antes do nome ou do sobrenome: intimidade, irritação ou carinho", fr: "article devant le prénom ou le nom de famille : familiarité, agacement ou affection", de: "Artikel vor Vorname oder Nachname: Vertrautheit, Ärger oder Zuneigung", it: "articolo davanti al nome o al cognome: confidenza, fastidio o affetto", pl: "przedimek przed imieniem lub nazwiskiem: poufałość, irytacja lub czułość", tr: "ad ya da soyadından önce artikel: yakınlık, can sıkıntısı ya da sevgi", id: "artikel sebelum nama depan atau nama keluarga: keakraban, kesal, atau sayang", vi: "mạo từ trước tên riêng hoặc họ: sự thân mật, bực mình hoặc quý mến" }
          ex: ["¡Ya está ", { target: la Ana }, " hablando de su jefe!"]
          tr: { en: "There goes Ana again, talking about her boss!", uk: "Знову ця Ана говорить про свого начальника!", pt: "Lá está a Ana de novo falando do chefe dela!", fr: "Voilà Ana qui parle encore de son patron !", de: "Jetzt redet die Ana schon wieder über ihren Chef!", it: "Ecco che Ana parla di nuovo del suo capo!", pl: "Znowu ta Ana gada o swoim szefie!", tr: "Ana yine patronundan söz ediyor!", id: "Si Ana mulai lagi membicarakan bosnya!", vi: "Cô Ana lại nói về sếp của mình rồi!" }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: ["no ", { term: un }, " or ", { term: una }, " before a job"], es: ["sin ", { term: un }, " ni ", { term: una }, " ante la profesión"], uk: ["без ", { term: un }, " і ", { term: una }, " перед професією"], pt: ["sem ", { term: un }, " nem ", { term: una }, " antes da profissão"], fr: ["pas de ", { term: un }, " ni de ", { term: una }, " devant le métier"], de: ["kein ", { term: un }, " und kein ", { term: una }, " vor dem Beruf"], it: ["senza ", { term: un }, " né ", { term: una }, " davanti alla professione"], pl: ["bez ", { term: un }, " ani ", { term: una }, " przed zawodem"], tr: ["meslekten önce ", { term: un }, " veya ", { term: una }, " kullanılmaz"], id: ["tanpa ", { term: un }, " atau ", { term: una }, " sebelum pekerjaan"], vi: ["không có ", { term: un }, " hay ", { term: una }, " trước nghề nghiệp"] }
          ex: ["Mi padre es ", { target: médico }, "."]
          tr: { en: My father is a doctor., uk: Мій батько — лікар., pt: "Meu pai é médico.", fr: "Mon père est médecin.", de: "Mein Vater ist Arzt.", it: "Mio padre è medico.", pl: "Mój ojciec jest lekarzem.", tr: "Babam doktor.", id: "Ayah saya seorang dokter.", vi: "Bố tôi là bác sĩ." }

sections:
  - title: { en: "Form: the articles", es: "Forma: los artículos", uk: "Форма: артиклі", pt: "Forma: os artigos", fr: "Forme : les articles", de: "Form: die Artikel", it: "Forma: gli articoli", pl: "Forma: przedimki", tr: "Biçim: artikeller", id: "Bentuk: artikel", vi: "Dạng: các mạo từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: kind, label: { en: Article, es: Artículo, uk: Артикль, pt: "Artigo", fr: "Article", de: "Artikel", it: "Articolo", pl: "Przedimek", tr: "Artikel", id: "Artikel", vi: "Mạo từ" } }
          - { key: masc, label: { en: Masculine, es: Masculino, uk: Чоловічий рід, pt: "Masculino", fr: "Masculin", de: "Maskulinum", it: "Maschile", pl: "Rodzaj męski", tr: "Eril", id: "Maskulin", vi: "Giống đực" }, features: { gender: masc } }
          - { key: fem, label: { en: Feminine, es: Femenino, uk: Жіночий рід, pt: "Feminino", fr: "Féminin", de: "Femininum", it: "Femminile", pl: "Rodzaj żeński", tr: "Dişil", id: "Feminin", vi: "Giống cái" }, features: { gender: fem } }
        rows:
          - { level: A1, features: { definiteness: def, number: sg }, kind: { en: "Definite, singular", es: "Determinado, singular", uk: "Означений, однина", pt: "Definido, singular", fr: "Défini, singulier", de: "Bestimmt, Singular", it: "Determinativo, singolare", pl: "Określony, liczba pojedyncza", tr: "Belirli, tekil", id: "Tentu, tunggal", vi: "Xác định, số ít" }, masc: [{ target: el }, " libro"], fem: [{ target: la }, " casa"] }
          - { level: A1, features: { definiteness: def, number: pl }, kind: { en: "Definite, plural", es: "Determinado, plural", uk: "Означений, множина", pt: "Definido, plural", fr: "Défini, pluriel", de: "Bestimmt, Plural", it: "Determinativo, plurale", pl: "Określony, liczba mnoga", tr: "Belirli, çoğul", id: "Tentu, jamak", vi: "Xác định, số nhiều" }, masc: [{ target: los }, " libros"], fem: [{ target: las }, " casas"] }
          - { level: A1, features: { definiteness: indf, number: sg }, kind: { en: "Indefinite, singular", es: "Indeterminado, singular", uk: "Неозначений, однина", pt: "Indefinido, singular", fr: "Indéfini, singulier", de: "Unbestimmt, Singular", it: "Indeterminativo, singolare", pl: "Nieokreślony, liczba pojedyncza", tr: "Belirsiz, tekil", id: "Tak tentu, tunggal", vi: "Không xác định, số ít" }, masc: [{ target: un }, " libro"], fem: [{ target: una }, " casa"] }
          - { level: A1, features: { definiteness: indf, number: pl }, kind: { en: "Indefinite, plural", es: "Indeterminado, plural", uk: "Неозначений, множина", pt: "Indefinido, plural", fr: "Indéfini, pluriel", de: "Unbestimmt, Plural", it: "Indeterminativo, plurale", pl: "Nieokreślony, liczba mnoga", tr: "Belirsiz, çoğul", id: "Tak tentu, jamak", vi: "Không xác định, số nhiều" }, masc: [{ target: unos }, " libros"], fem: [{ target: unas }, " casas"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ mapping: [{ term: a el }, { term: al }] }, " and ", { mapping: [{ term: de el }, { term: del }] }, "; the other articles never join."]
              es: [{ mapping: [{ term: a el }, { term: al }] }, " y ", { mapping: [{ term: de el }, { term: del }] }, "; los demás artículos nunca se unen."]
              uk: [{ mapping: [{ term: a el }, { term: al }] }, " і ", { mapping: [{ term: de el }, { term: del }] }, "; інші артиклі ніколи не зливаються."]
              pt: [{ mapping: [{ term: a el }, { term: al }] }, " e ", { mapping: [{ term: de el }, { term: del }] }, "; os outros artigos nunca se juntam."]
              fr: [{ mapping: [{ term: a el }, { term: al }] }, " et ", { mapping: [{ term: de el }, { term: del }] }, " ; les autres articles ne se contractent jamais."]
              de: [{ mapping: [{ term: a el }, { term: al }] }, " und ", { mapping: [{ term: de el }, { term: del }] }, "; die anderen Artikel verschmelzen nie."]
              it: [{ mapping: [{ term: a el }, { term: al }] }, " e ", { mapping: [{ term: de el }, { term: del }] }, "; gli altri articoli non si uniscono mai."]
              pl: [{ mapping: [{ term: a el }, { term: al }] }, " i ", { mapping: [{ term: de el }, { term: del }] }, "; pozostałe przedimki nigdy się nie łączą."]
              tr: [{ mapping: [{ term: a el }, { term: al }] }, " ve ", { mapping: [{ term: de el }, { term: del }] }, "; diğer artikeller hiçbir zaman birleşmez."]
              id: [{ mapping: [{ term: a el }, { term: al }] }, " dan ", { mapping: [{ term: de el }, { term: del }] }, "; artikel lain tidak pernah menyatu."]
              vi: [{ mapping: [{ term: a el }, { term: al }] }, " và ", { mapping: [{ term: de el }, { term: del }] }, "; các mạo từ khác không bao giờ ghép lại."]
            ex: ["Salgo ", { target: del }, " trabajo y voy ", { target: al }, " parque."]
            tr: { en: "I leave work and go to the park.", uk: Я виходжу з роботи й іду в парк., pt: "Saio do trabalho e vou ao parque.", fr: "Je sors du travail et je vais au parc.", de: "Ich komme von der Arbeit und gehe in den Park.", it: "Esco dal lavoro e vado al parco.", pl: "Wychodzę z pracy i idę do parku.", tr: "İşten çıkıyorum ve parka gidiyorum.", id: "Saya keluar dari tempat kerja dan pergi ke taman.", vi: "Tôi tan làm và đi đến công viên." }
          - type: rule
            level: A2
            text:
              en: ["A feminine noun that starts with a stressed a takes ", { term: el }, " and ", { term: un }, " in the singular; its adjective stays feminine."]
              es: ["El sustantivo femenino que empieza por a tónica lleva ", { term: el }, " y ", { term: un }, " en singular; su adjetivo sigue en femenino."]
              uk: ["Іменник жіночого роду, що починається з наголошеного a, в однині має ", { term: el }, " і ", { term: un }, "; його прикметник залишається в жіночому роді."]
              pt: ["O substantivo feminino que começa com a tônico leva ", { term: el }, " e ", { term: un }, " no singular; o adjetivo continua no feminino."]
              fr: ["Le nom féminin qui commence par un a tonique prend ", { term: el }, " et ", { term: un }, " au singulier ; son adjectif reste au féminin."]
              de: ["Ein weibliches Nomen, das mit betontem a beginnt, hat im Singular ", { term: el }, " und ", { term: un }, "; sein Adjektiv bleibt weiblich."]
              it: ["Il sostantivo femminile che comincia con a tonica prende ", { term: el }, " e ", { term: un }, " al singolare; il suo aggettivo resta femminile."]
              pl: ["Rzeczownik rodzaju żeńskiego zaczynający się od akcentowanego a ma w liczbie pojedynczej ", { term: el }, " i ", { term: un }, "; jego przymiotnik pozostaje w rodzaju żeńskim."]
              tr: ["Vurgulu a ile başlayan dişil isim tekilde ", { term: el }, " ve ", { term: un }, " alır; sıfatı dişil kalır."]
              id: ["Kata benda feminin yang diawali a bertekanan memakai ", { term: el }, " dan ", { term: un }, " dalam bentuk tunggal; kata sifatnya tetap feminin."]
              vi: ["Danh từ giống cái bắt đầu bằng a mang trọng âm dùng ", { term: el }, " và ", { term: un }, " ở số ít; tính từ của nó vẫn ở giống cái."]
            ex: [{ target: El }, " agua está ", { target: fría }, "."]
            tr: { en: The water is cold., uk: Вода холодна., pt: "A água está fria.", fr: "L’eau est froide.", de: "Das Wasser ist kalt.", it: "L’acqua è fredda.", pl: "Woda jest zimna.", tr: "Su soğuk.", id: "Airnya dingin.", vi: "Nước lạnh." }
          - type: rule
            level: A2
            text:
              en: ["In the plural, the article is feminine again: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              es: ["En plural, el artículo vuelve al femenino: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              uk: ["У множині артикль знову жіночого роду: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              pt: ["No plural, o artigo volta ao feminino: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              fr: ["Au pluriel, l’article redevient féminin : ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              de: ["Im Plural ist der Artikel wieder weiblich: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              it: ["Al plurale l’articolo torna al femminile: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              pl: ["W liczbie mnogiej przedimek znów jest rodzaju żeńskiego: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              tr: ["Çoğulda artikel yine dişil olur: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              id: ["Dalam bentuk jamak, artikel kembali feminin: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              vi: ["Ở số nhiều, mạo từ trở lại giống cái: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Before a number, ", { term: unos }, " and ", { term: unas }, " mean “about”:"]
              es: ["Delante de un número, ", { term: unos }, " y ", { term: unas }, " significan “más o menos”:"]
              uk: ["Перед числом ", { term: unos }, " і ", { term: unas }, " означають «приблизно»:"]
              pt: ["Antes de um número, ", { term: unos }, " e ", { term: unas }, " significam “mais ou menos”:"]
              fr: ["Devant un nombre, ", { term: unos }, " et ", { term: unas }, " signifient « environ » :"]
              de: ["Vor einer Zahl bedeuten ", { term: unos }, " und ", { term: unas }, " „ungefähr“:"]
              it: ["Davanti a un numero, ", { term: unos }, " e ", { term: unas }, " significano «circa»:"]
              pl: ["Przed liczbą ", { term: unos }, " i ", { term: unas }, " znaczą „około”:"]
              tr: ["Sayıdan önce ", { term: unos }, " ve ", { term: unas }, " “yaklaşık” anlamına gelir:"]
              id: ["Sebelum angka, ", { term: unos }, " dan ", { term: unas }, " berarti “kira-kira”:"]
              vi: ["Trước một số, ", { term: unos }, " và ", { term: unas }, " có nghĩa là “khoảng”:"]
            ex: ["Tengo ", { target: unos }, " veinte libros."]
            tr: { en: I have about twenty books., uk: У мене приблизно двадцять книжок., pt: "Tenho uns vinte livros.", fr: "J’ai une vingtaine de livres.", de: "Ich habe ungefähr zwanzig Bücher.", it: "Ho una ventina di libri.", pl: "Mam około dwudziestu książek.", tr: "Yaklaşık yirmi kitabım var.", id: "Saya punya sekitar dua puluh buku.", vi: "Tôi có khoảng hai mươi quyển sách." }
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "В українській мові артиклів немає, тож їх легко пропустити. В іспанській іменник в однині майже завжди має артикль або інше слово перед собою: el, un, este, mi."

  - title: { en: "Use: the definite article", es: "Uso: el artículo determinado", uk: "Вживання: означений артикль", pt: "Uso: o artigo definido", fr: "Emploi : l’article défini", de: "Gebrauch: der bestimmte Artikel", it: "Uso: l’articolo determinativo", pl: "Użycie: przedimek określony", tr: "Kullanım: belirli artikel", id: "Penggunaan: artikel tentu", vi: "Cách dùng: mạo từ xác định" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
