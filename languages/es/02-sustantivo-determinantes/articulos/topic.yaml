          - { level: A2, use: { en: "Body parts and clothes, instead of a possessive", es: "Partes del cuerpo y ropa, en lugar del posesivo", uk: "Частини тіла й одяг, замість присвійного займенника", pt: "Partes do corpo e roupas, no lugar do possessivo", fr: "Parties du corps et vêtements, à la place du possessif", de: "Körperteile und Kleidung, statt des Possessivpronomens", it: "Parti del corpo e vestiti, al posto del possessivo", pl: "Części ciała i ubrania, zamiast zaimka dzierżawczego", tr: "Vücut bölümleri ve giysiler, iyelik sıfatı yerine", id: "Anggota tubuh dan pakaian, sebagai pengganti kata ganti kepemilikan", vi: "Bộ phận cơ thể và quần áo, thay cho tính từ sở hữu" }, ex: ["Me lavo ", { target: las }, " manos."], tr: { en: I wash my hands., uk: Я мию руки., pt: "Eu lavo as mãos.", fr: "Je me lave les mains.", de: "Ich wasche mir die Hände.", it: "Mi lavo le mani.", pl: "Myję ręce.", tr: "Ellerimi yıkıyorum.", id: "Saya mencuci tangan.", vi: "Tôi rửa tay." } }
          - { level: A2, use: { en: A title when talking about someone, es: El tratamiento al hablar de alguien, uk: "Титул (пан, пані), коли говоримо про когось", pt: "O tratamento ao falar de alguém", fr: "Le titre de civilité quand on parle de quelqu’un", de: "Die Anrede, wenn man über jemanden spricht", it: "Il titolo quando si parla di qualcuno", pl: "Tytuł, gdy mówimy o kimś", tr: "Biri hakkında konuşurken unvan", id: "Sebutan kehormatan saat membicarakan seseorang", vi: "Danh xưng khi nói về ai đó" }, ex: [{ target: La }, " señora Pérez no está."], tr: { en: "Mrs Pérez isn't here.", uk: Пані Перес немає., pt: "A senhora Pérez não está.", fr: "Madame Pérez n’est pas là.", de: "Frau Pérez ist nicht da.", it: "La signora Pérez non c’è.", pl: "Pani Pérez nie ma.", tr: "Bayan Pérez burada değil.", id: "Bu Pérez tidak ada.", vi: "Bà Pérez không có ở đây." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Speaking to someone, the title takes no article:"
              es: "Al hablar con alguien, el tratamiento no lleva artículo:"
              uk: "Коли звертаємося до людини, перед звертанням артикля немає:"
              pt: "Ao falar com alguém, o tratamento não leva artigo:"
              fr: "Quand on s’adresse à quelqu’un, le titre n’a pas d’article :"
              de: "Wenn man jemanden anspricht, steht die Anrede ohne Artikel:"
              it: "Quando ci si rivolge a qualcuno, il titolo non ha articolo:"
              pl: "Gdy zwracamy się do kogoś, tytuł występuje bez przedimka:"
              tr: "Biriyle konuşurken unvan artikel almaz:"
              id: "Saat berbicara langsung dengan seseorang, sebutan kehormatan tidak memakai artikel:"
              vi: "Khi nói chuyện trực tiếp với ai đó, danh xưng không dùng mạo từ:"
            ex: ["Buenos días, ", { target: señora Pérez }, "."]
            tr: { en: "Good morning, Mrs Pérez.", uk: "Доброго ранку, пані Перес.", pt: "Bom dia, senhora Pérez.", fr: "Bonjour, Madame Pérez.", de: "Guten Morgen, Frau Pérez.", it: "Buongiorno, signora Pérez.", pl: "Dzień dobry, pani Pérez.", tr: "Günaydın, Bayan Pérez.", id: "Selamat pagi, Bu Pérez.", vi: "Chào buổi sáng, bà Pérez." }

