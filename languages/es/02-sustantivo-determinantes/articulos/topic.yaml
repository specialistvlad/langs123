          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            pattern: { pattern: [{ term: lo }, { slot: adjective }] }
            meaning: { es: ["la cualidad misma, también con ", { term: lo mejor }, " y ", { term: lo peor }], en: ["the quality itself, also with ", { term: lo mejor }, " and ", { term: lo peor }], uk: ["сама якість, також з ", { term: lo mejor }, " і ", { term: lo peor }], pt: ["a própria qualidade, também com ", { term: lo mejor }, " e ", { term: lo peor }], fr: ["la qualité elle-même, aussi avec ", { term: lo mejor }, " et ", { term: lo peor }], de: ["die Eigenschaft selbst, auch mit ", { term: lo mejor }, " und ", { term: lo peor }], it: ["la qualità in sé, anche con ", { term: lo mejor }, " e ", { term: lo peor }], pl: ["sama cecha, także z ", { term: lo mejor }, " i ", { term: lo peor }], tr: ["niteliğin kendisi; ", { term: lo mejor }, " ve ", { term: lo peor }, " ile de"], id: ["sifat itu sendiri, juga dengan ", { term: lo mejor }, " dan ", { term: lo peor }], vi: ["chính phẩm chất ấy, cũng với ", { term: lo mejor }, " và ", { term: lo peor }] }
            ex: { examples: [[{ target: Lo mejor }, " de la ciudad es el parque."], [{ target: Lo interesante }, " viene al final."]] }
            tr: { en: { examples: ["The best thing about the city is the park.", "The interesting part comes at the end."] }, uk: { examples: ["Найкраще в місті — це парк.", "Найцікавіше буде наприкінці."] }, pt: { examples: ["O melhor da cidade é o parque.", "O interessante vem no final."] }, fr: { examples: ["Le meilleur de la ville, c’est le parc.", "Le plus intéressant vient à la fin."] }, de: { examples: ["Das Beste an der Stadt ist der Park.", "Das Interessante kommt zum Schluss."] }, it: { examples: ["La cosa migliore della città è il parco.", "La parte interessante viene alla fine."] }, pl: { examples: ["Najlepszy w mieście jest park.", "Najciekawsze jest na końcu."] }, tr: { examples: ["Şehrin en güzel yeri parktır.", "En ilginç kısım sonda geliyor."] }, id: { examples: ["Hal terbaik dari kota ini adalah taman.", "Bagian yang menarik datang di akhir."] }, vi: { examples: ["Điều tuyệt nhất của thành phố là công viên.", "Điều thú vị nằm ở cuối."] } }
          - level: B2
            pattern: { pattern: [{ term: lo de }, { alternatives: [{ slot: noun }, { slot: infinitive }] }] }
            meaning: { es: "el asunto que los dos conocen: lo ocurrido o lo propuesto", en: "the matter both people know: what happened or what was proposed", uk: "справа, яку знають обоє: те, що сталося, або те, що запропоновано", pt: "o assunto que as duas pessoas conhecem: o que aconteceu ou o que foi proposto", fr: "l’affaire que les deux interlocuteurs connaissent : ce qui s’est passé ou ce qui est proposé", de: "die Angelegenheit, die beide kennen: das Geschehene oder das Vorgeschlagene", it: "la faccenda che entrambi conoscono: ciò che è successo o ciò che è stato proposto", pl: "sprawa, którą znają obie osoby: to, co się stało, albo to, co zaproponowano", tr: "iki tarafın da bildiği konu: olan ya da önerilen şey", id: "hal yang diketahui kedua pihak: apa yang terjadi atau apa yang diusulkan", vi: "vấn đề cả hai cùng biết: điều đã xảy ra hoặc điều được đề nghị" }
            ex: { examples: [["Siento mucho ", { target: lo de ayer }, "."], ["¿Qué piensas de ", { target: lo de cambiar de casa }, "?"]] }
            tr: { en: { examples: ["I'm very sorry about yesterday.", "What do you think about moving house?"] }, uk: { examples: ["Мені дуже шкода за вчорашнє.", "Що ти думаєш про те, щоб переїхати?"] }, pt: { examples: ["Sinto muito pelo que aconteceu ontem.", "O que você acha de mudar de casa?"] }, fr: { examples: ["Je suis vraiment désolé pour hier.", "Que penses-tu de ce projet de déménager ?"] }, de: { examples: ["Das von gestern tut mir sehr leid.", "Was hältst du davon, umzuziehen?"] }, it: { examples: ["Mi dispiace molto per ieri.", "Che ne pensi di cambiare casa?"] }, pl: { examples: ["Bardzo mi przykro z powodu wczorajszego.", "Co sądzisz o przeprowadzce?"] }, tr: { examples: ["Dünkü olay için çok üzgünüm.", "Ev değiştirme meselesi hakkında ne düşünüyorsun?"] }, id: { examples: ["Saya sangat menyesal soal kemarin.", "Bagaimana pendapatmu soal pindah rumah itu?"] }, vi: { examples: ["Tôi rất tiếc về chuyện hôm qua.", "Bạn nghĩ sao về chuyện đổi nhà?"] } }
          - level: B2
            pattern: { pattern: [{ term: el }, { slot: { es: otra palabra, en: "another word", uk: "інше слово", pt: "outra palavra", fr: "un autre mot", de: "ein anderes Wort", it: "un’altra parola", pl: "inny wyraz", tr: "başka bir sözcük", id: "kata lain", vi: "từ khác" } }] }
            meaning: { es: "una palabra de otra clase convertida en nombre", en: "a word of another class turned into a noun", uk: "слово іншої частини мови, що стало іменником", pt: "uma palavra de outra classe convertida em substantivo", fr: "un mot d’une autre classe devenu nom", de: "ein Wort einer anderen Wortart, zum Nomen gemacht", it: "una parola di un’altra classe trasformata in sostantivo", pl: "wyraz innej części mowy zamieniony w rzeczownik", tr: "başka bir sözcük türünden isme çevrilmiş sözcük", id: "kata dari kelas lain yang dijadikan kata benda", vi: "một từ thuộc loại khác được chuyển thành danh từ" }
            ex: { examples: [["No entiendo ", { target: el porqué }, " de tu decisión."], ["Quiero saber ", { target: el cuándo }, " y ", { target: el dónde }, "."]] }
            tr: { en: { examples: ["I don't understand the reason for your decision.", "I want to know the when and the where."] }, uk: { examples: ["Я не розумію причини твого рішення.", "Я хочу знати, коли й де."] }, pt: { examples: ["Não entendo o porquê da sua decisão.", "Quero saber o quando e o onde."] }, fr: { examples: ["Je ne comprends pas le pourquoi de ta décision.", "Je veux savoir quand et où."] }, de: { examples: ["Ich verstehe das Warum deiner Entscheidung nicht.", "Ich will das Wann und das Wo wissen."] }, it: { examples: ["Non capisco il perché della tua decisione.", "Voglio sapere il quando e il dove."] }, pl: { examples: ["Nie rozumiem, dlaczego tak zdecydowałeś.", "Chcę wiedzieć, kiedy i gdzie."] }, tr: { examples: ["Kararının nedenini anlamıyorum.", "Ne zaman ve nerede olduğunu bilmek istiyorum."] }, id: { examples: ["Saya tidak mengerti alasan keputusanmu.", "Saya ingin tahu kapan dan di mana."] }, vi: { examples: ["Tôi không hiểu lý do quyết định của bạn.", "Tôi muốn biết khi nào và ở đâu."] } }
          - level: C1
            pattern: { pattern: [{ term: el }, { slot: infinitive }] }
            meaning: { es: "una acción: el artículo es opcional", en: "an action: the article is optional", uk: "дія: артикль необов’язковий", pt: "uma ação: o artigo é opcional", fr: "une action : l’article est facultatif", de: "eine Handlung: Der Artikel ist freiwillig", it: "un’azione: l’articolo è facoltativo", pl: "czynność: przedimek jest opcjonalny", tr: "bir eylem: artikel isteğe bağlıdır", id: "suatu tindakan: artikel boleh dipakai atau tidak", vi: "một hành động: mạo từ là tùy chọn" }
            ex: ["Todos saben que ", { target: [{ optional: el }, " fumar"] }, " perjudica la salud."]
            tr: { en: "Everyone knows that smoking harms your health.", uk: "Усі знають, що куріння шкодить здоров’ю.", pt: "Todos sabem que fumar prejudica a saúde.", fr: "Tout le monde sait que fumer nuit à la santé.", de: "Alle wissen, dass Rauchen der Gesundheit schadet.", it: "Tutti sanno che fumare nuoce alla salute.", pl: "Wszyscy wiedzą, że palenie szkodzi zdrowiu.", tr: "Herkes sigara içmenin sağlığa zarar verdiğini bilir.", id: "Semua orang tahu bahwa merokok merugikan kesehatan.", vi: "Ai cũng biết hút thuốc có hại cho sức khỏe." }
          - level: C1
            pattern: { pattern: [{ term: el }, { slot: infinitive }, { term: de }, { slot: noun }] }
            meaning: { es: "un sustantivo con su complemento: el artículo es obligatorio", en: "a noun with its complement: the article is required", uk: "іменник із залежним словом: артикль обов’язковий", pt: "um substantivo com seu complemento: o artigo é obrigatório", fr: "un nom avec son complément : l’article est obligatoire", de: "ein Nomen mit seiner Ergänzung: Der Artikel ist Pflicht", it: "un sostantivo con il suo complemento: l’articolo è obbligatorio", pl: "rzeczownik z dopełnieniem: przedimek jest obowiązkowy", tr: "tamlayanıyla birlikte bir isim: artikel zorunludur", id: "kata benda beserta pelengkapnya: artikel wajib", vi: "một danh từ cùng bổ ngữ của nó: mạo từ là bắt buộc" }
            ex: [{ target: El florecer de las plantas }, " anuncia la primavera."]
            tr: { en: "The blooming of the plants announces spring.", uk: "Цвітіння рослин сповіщає про весну.", pt: "O florescer das plantas anuncia a primavera.", fr: "Le fleurissement des plantes annonce le printemps.", de: "Das Blühen der Pflanzen kündigt den Frühling an.", it: "Il fiorire delle piante annuncia la primavera.", pl: "Kwitnienie roślin zwiastuje wiosnę.", tr: "Bitkilerin çiçek açması baharı müjdeler.", id: "Mekarnya tanaman menandakan datangnya musim semi.", vi: "Việc cây cối đơm hoa báo hiệu mùa xuân đã đến." }
          - level: C1
            pattern: { pattern: [{ term: el que }, { slot: clause }] }
            meaning: { es: "una oración convertida en nombre", en: "a clause turned into a noun", uk: "речення, що стало іменником", pt: "uma oração convertida em substantivo", fr: "une proposition devenue nom", de: "ein Satz, zum Nomen gemacht", it: "una proposizione trasformata in sostantivo", pl: "zdanie zamienione w rzeczownik", tr: "isme çevrilmiş bir cümle", id: "klausa yang dijadikan kata benda", vi: "một mệnh đề được chuyển thành danh từ" }
            ex: { examples: [["Me alegra ", { target: el que hayas venido }, "."], [{ target: El que tenga paciencia }, " lo conseguirá."]] }
            tr: { en: { examples: ["I'm glad that you came.", "Whoever has patience will succeed."] }, uk: { examples: ["Я радий, що ти прийшов.", "Хто матиме терпіння, той досягне мети."] }, pt: { examples: ["Fico feliz que você tenha vindo.", "Quem tiver paciência vai conseguir."] }, fr: { examples: ["Je suis content que tu sois venu.", "Celui qui aura de la patience y arrivera."] }, de: { examples: ["Es freut mich, dass du gekommen bist.", "Wer Geduld hat, wird es schaffen."] }, it: { examples: ["Mi fa piacere che tu sia venuto.", "Chi avrà pazienza ce la farà."] }, pl: { examples: ["Cieszę się, że przyszedłeś.", "Kto będzie cierpliwy, osiągnie cel."] }, tr: { examples: ["Geldiğine sevindim.", "Sabırlı olan başaracak."] }, id: { examples: ["Saya senang kamu datang.", "Siapa pun yang sabar akan berhasil."] }, vi: { examples: ["Tôi vui vì bạn đã đến.", "Ai kiên nhẫn thì sẽ làm được."] } }

  - title: { es: "El artículo indefinido: valores", en: "The indefinite article: meanings", uk: "Неозначений артикль: значення", pt: "O artigo indefinido: valores", fr: "L’article indéfini : valeurs", de: "Der unbestimmte Artikel: Bedeutungen", it: "L’articolo indeterminativo: valori", pl: "Przedimek nieokreślony: znaczenia", tr: "Belirsiz artikel: anlamlar", id: "Artikel tak tentu: makna", vi: "Mạo từ không xác định: các giá trị" }
