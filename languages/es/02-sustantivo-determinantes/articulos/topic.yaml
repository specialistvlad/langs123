        rows:
          - level: B2
            use: { es: "ante una oración de relativo: un ejemplar cualquiera que cumple la descripción", en: "before a relative clause: any one item that fits the description", uk: "перед означальним підрядним реченням: будь-який екземпляр, що відповідає опису", pt: "diante de uma oração relativa: um exemplar qualquer que cumpre a descrição", fr: "devant une proposition relative : un exemplaire quelconque qui répond à la description", de: "vor einem Relativsatz: irgendein Exemplar, das der Beschreibung entspricht", it: "davanti a una proposizione relativa: un esemplare qualsiasi che risponde alla descrizione", pl: "przed zdaniem względnym: dowolny egzemplarz, który odpowiada opisowi", tr: "ilgi cümlesinden önce: tanıma uyan herhangi bir örnek", id: "sebelum klausa relatif: satu benda mana saja yang sesuai dengan deskripsi", vi: "trước mệnh đề quan hệ: một đối tượng bất kỳ phù hợp với mô tả" }
            ex: { examples: [["Busco ", { target: un compañero }, " que sea de otro país."], ["Busco ", { target: unos zapatos }, " que no me aprieten."]] }
            tr: { en: { examples: ["I'm looking for a companion who is from another country.", "I'm looking for shoes that don't pinch."] }, uk: { examples: ["Я шукаю товариша, який з іншої країни.", "Я шукаю взуття, яке не муляє."] }, pt: { examples: ["Procuro um colega que seja de outro país.", "Procuro uns sapatos que não apertem."] }, fr: { examples: ["Je cherche un camarade qui soit d’un autre pays.", "Je cherche des chaussures qui ne me serrent pas."] }, de: { examples: ["Ich suche einen Partner, der aus einem anderen Land kommt.", "Ich suche Schuhe, die nicht drücken."] }, it: { examples: ["Cerco un compagno che sia di un altro paese.", "Cerco delle scarpe che non mi stringano."] }, pl: { examples: ["Szukam towarzysza z innego kraju.", "Szukam butów, które nie uwierają."] }, tr: { examples: ["Başka bir ülkeden bir arkadaş arıyorum.", "Beni sıkmayan bir ayakkabı arıyorum."] }, id: { examples: ["Saya mencari teman yang berasal dari negara lain.", "Saya mencari sepatu yang tidak sempit."] }, vi: { examples: ["Tôi đang tìm một bạn đồng hành đến từ nước khác.", "Tôi đang tìm đôi giày không bị chật."] } }
          - level: B2
            use: { es: "retoma a una persona ya mencionada como miembro de una clase, sin identificarla", en: "refers again to a person already mentioned as one of a kind, without naming him", uk: "знову називає вже згадану особу як представника якогось класу, не ідентифікуючи її", pt: "retoma uma pessoa já mencionada como membro de uma classe, sem identificá-la", fr: "reprend une personne déjà mentionnée comme membre d’une classe, sans l’identifier", de: "greift eine schon erwähnte Person als Mitglied einer Gruppe wieder auf, ohne sie zu benennen", it: "riprende una persona già nominata come membro di una classe, senza identificarla", pl: "wraca do osoby już wspomnianej jako przedstawiciela pewnej grupy, bez jej identyfikowania", tr: "daha önce anılan kişiyi bir sınıfın üyesi olarak yeniden anar, onu belirtmeden", id: "menyebut kembali orang yang sudah disebut sebagai anggota suatu golongan, tanpa mengidentifikasinya", vi: "nhắc lại một người đã được nói tới như một thành viên của một loại, không xác định cụ thể người đó" }
            ex: ["Pedro suspendió. Era de esperar en ", { target: un chico }, " que no estudia nada."]
            tr: { en: "Pedro failed. It was to be expected from a boy who doesn't study at all.", uk: "Педро не склав іспит. Цього й слід було чекати від хлопця, який зовсім не вчиться.", pt: "Pedro foi reprovado. Era de esperar de um rapaz que não estuda nada.", fr: "Pedro a échoué. Il fallait s’y attendre de la part d’un garçon qui n’étudie pas du tout.", de: "Pedro ist durchgefallen. Das war bei einem Jungen, der gar nicht lernt, zu erwarten.", it: "Pedro è stato bocciato. C’era da aspettarselo da un ragazzo che non studia per niente.", pl: "Pedro oblał egzamin. Można było tego oczekiwać po chłopaku, który w ogóle się nie uczy.", tr: "Pedro sınıfta kaldı. Hiç ders çalışmayan bir çocuktan bu beklenirdi.", id: "Pedro tidak lulus. Itu sudah bisa ditebak dari anak yang sama sekali tidak belajar.", vi: "Pedro thi trượt. Điều đó dễ đoán với một cậu bé chẳng học gì cả." }
