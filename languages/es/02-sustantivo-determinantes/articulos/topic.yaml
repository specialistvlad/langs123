          - { level: A1, wrong: Me gusta café., right: ["Me gusta ", { target: el }, " café."], rule: { en: "things in general take the definite article", es: "las cosas en general llevan artículo determinado", uk: "іменник, що означає щось узагалі, має означений артикль", pt: "as coisas em geral levam artigo definido", fr: "les choses en général prennent l’article défini", de: "Dinge im Allgemeinen haben den bestimmten Artikel", it: "le cose in generale vogliono l’articolo determinativo", pl: "rzeczy ogólne mają przedimek określony", tr: "genel anlamda söz edilen şeyler belirli artikel alır", id: "benda secara umum memakai artikel tentu", vi: "sự vật nói chung dùng mạo từ xác định" } }
          - { level: A2, wrong: La agua está fría., right: [{ target: El }, " agua está fría."], rule: { en: [{ term: el }, " before a feminine noun in stressed a"], es: [{ term: el }, " ante un femenino con a tónica"], uk: [{ term: el }, " перед іменником жіночого роду з наголошеним a"], pt: [{ term: el }, " antes de um substantivo feminino com a tônico"], fr: [{ term: el }, " devant un nom féminin à a tonique"], de: [{ term: el }, " vor einem weiblichen Nomen mit betontem a"], it: [{ term: el }, " davanti a un femminile con a tonica"], pl: [{ term: el }, " przed rzeczownikiem rodzaju żeńskiego z akcentowanym a"], tr: [{ term: el }, " vurgulu a ile başlayan dişil isimden önce"], id: [{ term: el }, " sebelum kata benda feminin dengan a bertekanan"], vi: [{ term: el }, " trước danh từ giống cái có a mang trọng âm"] } }
          - { level: A2, wrong: Me lavo mis manos., right: ["Me lavo ", { target: las }, " manos."], rule: { en: "body parts take the article", es: "las partes del cuerpo llevan el artículo", uk: "частини тіла вживаються з артиклем", pt: "as partes do corpo levam artigo", fr: "les parties du corps prennent l’article", de: "Körperteile haben den Artikel", it: "le parti del corpo vogliono l’articolo", pl: "części ciała mają przedimek", tr: "vücut bölümleri artikel alır", id: "anggota tubuh memakai artikel", vi: "bộ phận cơ thể dùng mạo từ" } }
