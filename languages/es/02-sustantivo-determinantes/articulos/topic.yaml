          - { level: A1, use: { en: "No article: a job or a nationality after ser", es: "Sin artículo: profesión o nacionalidad después de ser", uk: "Без артикля: професія або національність після ser", pt: "Sem artigo: profissão ou nacionalidade depois de ser", fr: "Sans article : métier ou nationalité après ser", de: "Ohne Artikel: Beruf oder Nationalität nach ser", it: "Senza articolo: professione o nazionalità dopo ser", pl: "Bez przedimka: zawód lub narodowość po ser", tr: "Artikelsiz: ser fiilinden sonra meslek ya da uyruk", id: "Tanpa artikel: pekerjaan atau kewarganegaraan setelah ser", vi: "Không có mạo từ: nghề nghiệp hoặc quốc tịch sau ser" }, ex: ["Mi padre es ", { target: médico }, "."], tr: { en: My father is a doctor., uk: Мій батько — лікар., pt: "Meu pai é médico.", fr: "Mon père est médecin.", de: "Mein Vater ist Arzt.", it: "Mio padre è medico.", pl: "Mój ojciec jest lekarzem.", tr: "Babam doktor.", id: "Ayah saya seorang dokter.", vi: "Bố tôi là bác sĩ." } }
          - { level: A2, use: { en: "No article: an amount that is not counted", es: "Sin artículo: una cantidad sin contar", uk: "Без артикля: кількість, яку не рахують", pt: "Sem artigo: uma quantidade que não se conta", fr: "Sans article : une quantité qu’on ne compte pas", de: "Ohne Artikel: eine Menge, die man nicht zählt", it: "Senza articolo: una quantità che non si conta", pl: "Bez przedimka: ilość, której się nie liczy", tr: "Artikelsiz: sayılmayan bir miktar", id: "Tanpa artikel: jumlah yang tidak dihitung", vi: "Không có mạo từ: một lượng không đếm" }, ex: ["Compro ", { target: pan }, " y ", { target: huevos }, "."], tr: { en: "I'm buying bread and eggs.", uk: Я купую хліб і яйця., pt: "Compro pão e ovos.", fr: "J’achète du pain et des œufs.", de: "Ich kaufe Brot und Eier.", it: "Compro pane e uova.", pl: "Kupuję chleb i jajka.", tr: "Ekmek ve yumurta alıyorum.", id: "Saya membeli roti dan telur.", vi: "Tôi mua bánh mì và trứng." } }
          - { level: A1, use: { en: "No article: hay with no amount", es: "Sin artículo: hay sin cantidad", uk: "Без артикля: hay без кількості", pt: "Sem artigo: hay sem quantidade", fr: "Sans article : hay sans quantité", de: "Ohne Artikel: hay ohne Mengenangabe", it: "Senza articolo: hay senza quantità", pl: "Bez przedimka: hay bez ilości", tr: "Artikelsiz: miktar belirtilmeyen hay", id: "Tanpa artikel: hay tanpa jumlah", vi: "Không có mạo từ: hay không nêu số lượng" }, ex: ["No hay ", { target: agua }, "."], tr: { en: "There's no water.", uk: Води немає., pt: "Não tem água.", fr: "Il n’y a pas d’eau.", de: "Es gibt kein Wasser.", it: "Non c’è acqua.", pl: "Nie ma wody.", tr: "Su yok.", id: "Tidak ada air.", vi: "Không có nước." } }
          - { level: A2, use: { en: "No article: a language after hablar", es: "Sin artículo: la lengua después de hablar", uk: "Без артикля: мова після hablar", pt: "Sem artigo: a língua depois de hablar", fr: "Sans article : la langue après hablar", de: "Ohne Artikel: die Sprache nach hablar", it: "Senza articolo: la lingua dopo hablar", pl: "Bez przedimka: język po hablar", tr: "Artikelsiz: hablar fiilinden sonra dil adı", id: "Tanpa artikel: bahasa setelah hablar", vi: "Không có mạo từ: tên ngôn ngữ sau hablar" }, ex: ["Hablo ", { target: español }, " e inglés."], tr: { en: I speak Spanish and English., uk: Я розмовляю іспанською та англійською., pt: "Falo espanhol e inglês.", fr: "Je parle espagnol et anglais.", de: "Ich spreche Spanisch und Englisch.", it: "Parlo spagnolo e inglese.", pl: "Mówię po hiszpańsku i angielsku.", tr: "İspanyolca ve İngilizce konuşuyorum.", id: "Saya berbicara bahasa Spanyol dan Inggris.", vi: "Tôi nói tiếng Tây Ban Nha và tiếng Anh." } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A job takes an article when an adjective describes it:"
              es: "La profesión lleva artículo cuando un adjetivo la describe:"
              uk: "Професія має артикль, коли її описує прикметник:"
              pt: "A profissão leva artigo quando um adjetivo a descreve:"
              fr: "Le métier prend un article quand un adjectif le décrit :"
              de: "Der Beruf hat einen Artikel, wenn ein Adjektiv ihn beschreibt:"
              it: "La professione ha l’articolo quando un aggettivo la descrive:"
              pl: "Zawód ma przedimek, gdy opisuje go przymiotnik:"
              tr: "Meslek, bir sıfatla nitelendiğinde artikel alır:"
              id: "Pekerjaan memakai artikel kalau ada kata sifat yang menjelaskannya:"
              vi: "Nghề nghiệp có mạo từ khi có tính từ miêu tả nó:"
            ex: ["Es ", { target: un }, " médico muy bueno."]
            tr: { en: "He's a very good doctor.", uk: Він дуже хороший лікар., pt: "Ele é um médico muito bom.", fr: "C’est un très bon médecin.", de: "Er ist ein sehr guter Arzt.", it: "È un medico molto bravo.", pl: "Jest bardzo dobrym lekarzem.", tr: "O çok iyi bir doktor.", id: "Dia seorang dokter yang sangat baik.", vi: "Ông ấy là một bác sĩ rất giỏi." }
          - type: note
            level: A1
            text:
              en: [{ term: hay }, " takes ", { term: un }, ", ", { term: una }, " or no article, and ", { term: está }, " takes ", { term: el }, " or ", { term: la }, ": see ", { link: Hay and Está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              es: [{ term: hay }, " lleva ", { term: un }, ", ", { term: una }, " o ningún artículo, y ", { term: está }, " lleva ", { term: el }, " o ", { term: la }, ": ver ", { link: Hay y está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              uk: [{ term: hay }, " вживається з ", { term: un }, ", ", { term: una }, " або без артикля, а ", { term: está }, " — з ", { term: el }, " або ", { term: la }, ": див. ", { link: Hay і está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              pt: [{ term: hay }, " leva ", { term: un }, ", ", { term: una }, " ou nenhum artigo, e ", { term: está }, " leva ", { term: el }, " ou ", { term: la }, ": veja ", { link: Hay e está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              fr: [{ term: hay }, " prend ", { term: un }, ", ", { term: una }, " ou aucun article, et ", { term: está }, " prend ", { term: el }, " ou ", { term: la }, " : voir ", { link: Hay et está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              de: [{ term: hay }, " steht mit ", { term: un }, ", ", { term: una }, " oder ohne Artikel, und ", { term: está }, " steht mit ", { term: el }, " oder ", { term: la }, ": siehe ", { link: Hay und está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              it: [{ term: hay }, " vuole ", { term: un }, ", ", { term: una }, " o nessun articolo, e ", { term: está }, " vuole ", { term: el }, " o ", { term: la }, ": vedi ", { link: Hay e está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              pl: [{ term: hay }, " występuje z ", { term: un }, ", ", { term: una }, " lub bez przedimka, a ", { term: está }, " z ", { term: el }, " lub ", { term: la }, ": zob. ", { link: Hay i está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              tr: [{ term: hay }, " ile ", { term: un }, ", ", { term: una }, " ya da artikelsiz kullanılır; ", { term: está }, " ile ", { term: el }, " veya ", { term: la }, " kullanılır: bkz. ", { link: Hay ve está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              id: [{ term: hay }, " dipakai dengan ", { term: un }, ", ", { term: una }, " atau tanpa artikel, dan ", { term: está }, " dipakai dengan ", { term: el }, " atau ", { term: la }, ": lihat ", { link: Hay dan está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              vi: [{ term: hay }, " đi với ", { term: un }, ", ", { term: una }, " hoặc không có mạo từ, còn ", { term: está }, " đi với ", { term: el }, " hoặc ", { term: la }, ": xem ", { link: Hay và está, to: es.ser-estar-hay-gustar.hay-esta }, "."]

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки, pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
