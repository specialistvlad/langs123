          - { key: indf, label: { es: Indeterminado, en: "Indefinite", uk: "Неозначений", pt: "Indefinido", fr: "Indéfini", de: "Unbestimmt", it: "Indeterminativo", pl: "Nieokreślony", tr: "Belirsiz", id: "Tak tentu", vi: "Không xác định" } }
          - { key: when, label: { es: Cuándo se usa, en: "When it is used", uk: "Коли вживається", pt: "Quando se usa", fr: "Quand on l’emploie", de: "Wann man es verwendet", it: "Quando si usa", pl: "Kiedy się go używa", tr: "Ne zaman kullanılır", id: "Kapan dipakai", vi: "Khi nào dùng" } }
        rows:
          - level: B2
            def: { ex: [{ target: El bolígrafo }, " se usa para escribir."], tr: { en: "The ballpoint pen is used for writing.", uk: "Кулькова ручка призначена для письма.", pt: "A caneta esferográfica é usada para escrever.", fr: "Le stylo à bille sert à écrire.", de: "Der Kugelschreiber dient zum Schreiben.", it: "La penna a sfera serve per scrivere.", pl: "Długopis służy do pisania.", tr: "Tükenmez kalem yazmak için kullanılır.", id: "Pulpen dipakai untuk menulis.", vi: "Bút bi dùng để viết." } }
            indf: { ex: [{ target: Un bolígrafo }, " se usa para escribir."], tr: { en: "A ballpoint pen is used for writing.", uk: "Кулькова ручка призначена для письма.", pt: "Uma caneta esferográfica é usada para escrever.", fr: "Un stylo à bille sert à écrire.", de: "Ein Kugelschreiber dient zum Schreiben.", it: "Una penna a sfera serve per scrivere.", pl: "Długopis służy do pisania.", tr: "Bir tükenmez kalem yazmak için kullanılır.", id: "Sebuah pulpen dipakai untuk menulis.", vi: "Một cây bút bi dùng để viết." } }
            when: { es: "los dos hablan de cualquier bolígrafo; el determinado nombra la clase entera y el indeterminado toma un ejemplar", en: "both speak of any pen; the definite article names the whole class and the indefinite takes one item", uk: "обидва речення стосуються будь-якої ручки: означений артикль називає весь клас, а неозначений бере один екземпляр", pt: "os dois falam de qualquer caneta; o definido nomeia a classe inteira e o indefinido toma um exemplar", fr: "les deux parlent d’un stylo quelconque ; le défini désigne toute la classe et l’indéfini prend un exemplaire", de: "beide sprechen von irgendeinem Kugelschreiber; der bestimmte Artikel nennt die ganze Gattung, der unbestimmte nimmt ein einzelnes Exemplar", it: "entrambi parlano di una penna qualsiasi; il determinativo nomina l’intera classe e l’indeterminativo prende un esemplare", pl: "oba zdania mówią o dowolnym długopisie; przedimek określony nazywa całą klasę, a nieokreślony bierze jeden egzemplarz", tr: "ikisi de herhangi bir tükenmez kalemden söz eder; belirli artikel bütün sınıfı adlandırır, belirsiz artikel tek bir örneği alır", id: "keduanya membicarakan pulpen apa saja; artikel tentu menyebut seluruh golongan, artikel tak tentu mengambil satu contoh", vi: "cả hai nói về một cây bút bi bất kỳ; mạo từ xác định gọi tên cả loại, mạo từ không xác định lấy một chiếc làm đại diện" }
          - level: B2
            def: { ex: [{ target: El bolígrafo }, " no existía hace doscientos años."], tr: { en: "The ballpoint pen did not exist two hundred years ago.", uk: "Кулькової ручки не існувало двісті років тому.", pt: "A caneta esferográfica não existia há duzentos anos.", fr: "Le stylo à bille n’existait pas il y a deux cents ans.", de: "Den Kugelschreiber gab es vor zweihundert Jahren noch nicht.", it: "La penna a sfera non esisteva duecento anni fa.", pl: "Długopis nie istniał dwieście lat temu.", tr: "Tükenmez kalem iki yüz yıl önce yoktu.", id: "Pulpen belum ada dua ratus tahun lalu.", vi: "Hai trăm năm trước chưa có bút bi." } }
            when: { es: "un marco temporal pide la clase entera: solo vale el determinado", en: "a time frame calls for the whole class: only the definite article fits", uk: "часові рамки вимагають усього класу: годиться лише означений артикль", pt: "um marco temporal pede a classe inteira: só serve o definido", fr: "un cadre temporel demande la classe entière : seul le défini convient", de: "ein Zeitrahmen verlangt die ganze Gattung: nur der bestimmte Artikel passt", it: "una cornice temporale richiede la classe intera: vale solo il determinativo", pl: "ramy czasowe wymagają całej klasy: pasuje tylko przedimek określony", tr: "zaman çerçevesi bütün sınıfı ister: yalnızca belirli artikel uygundur", id: "kerangka waktu menuntut seluruh golongan: hanya artikel tentu yang cocok", vi: "mốc thời gian đòi hỏi cả loại: chỉ mạo từ xác định phù hợp" }

  - title: { es: "El neutro lo y otras sustantivaciones", en: "The neuter lo and other nominalisations", uk: "Нейтральне lo й інші субстантивації", pt: "O neutro lo e outras substantivações", fr: "Le neutre lo et les autres substantivations", de: "Das neutrale lo und andere Substantivierungen", it: "Il neutro lo e altre sostantivazioni", pl: "Nijakie lo i inne substantywizacje", tr: "Nötr lo ve diğer isimleştirmeler", id: "Lo netral dan pembendaan lainnya", vi: "Lo trung tính và các cách danh từ hóa khác" }
    role: own
