          - { level: A1, speakers: [uk], wrong: ¿Dónde está baño?, right: ["¿Dónde está ", { target: el }, " baño?"], rule: { uk: ["іменник, відомий обом, має артикль ", { term: el }, " або ", { term: la }, ", хоча українською кажемо просто «де туалет»"] } }
          - { level: A1, speakers: [uk], wrong: Tengo hermano., right: ["Tengo ", { target: un }, " hermano."], rule: { uk: ["злічуваний іменник в однині має артикль ", { term: un }, " або ", { term: una }] } }
          - { level: A1, speakers: [uk], wrong: Te llamo en lunes., right: ["Te llamo ", { target: el }, " lunes."], rule: { uk: ["день тижня — з ", { term: el }, " і без прийменника, хоча українською кажемо «у понеділок»"] } }
