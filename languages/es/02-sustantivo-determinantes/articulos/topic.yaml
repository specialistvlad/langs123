# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.sustantivo-determinantes.articulos
lang: es
kind: grammar
tags: [articles, determiners, nouns]
concepts: [articles]
related: [es.sustantivo-determinantes.genero, es.sustantivo-determinantes.plural, es.ser-estar-hay-gustar.hay-esta, es.sustantivo-determinantes.cuantificadores, es.fundamentos.dias-meses-fechas]
status: { en: draft, es: draft, uk: draft }
translated: { en: "8a478c 4093c6 08c7ed 6245af 67425c fcace7", uk: "8a478c 4093c6 08c7ed 6245af 67425c fcace7" }

title: { en: Articles, es: El artículo, uk: Артиклі }
summary:
  lead:
    en: ["The articles agree with the noun: ", { term: el }, ", ", { term: la }, ", ", { term: los }, ", ", { term: las }, " mean “the”, and ", { term: un }, ", ", { term: una }, ", ", { term: unos }, ", ", { term: unas }, " mean “a” or “some”."]
    es: ["El artículo concuerda con el sustantivo: ", { term: el }, ", ", { term: la }, ", ", { term: los }, ", ", { term: las }, " son determinados, y ", { term: un }, ", ", { term: una }, ", ", { term: unos }, ", ", { term: unas }, ", indeterminados."]
    uk: ["Артикль узгоджується з іменником: ", { term: el }, ", ", { term: la }, ", ", { term: los }, ", ", { term: las }, " — означені артиклі, а ", { term: un }, ", ", { term: una }, ", ", { term: unos }, ", ", { term: unas }, " — неозначені."]
  rule:
    en: ["Things in general take ", { term: el }, " or ", { term: la }, ", and a job after ", { term: ser }, " takes no article:"]
    es: ["Las cosas en general llevan artículo determinado, y la profesión después de ", { term: ser }, " no lleva artículo:"]
    uk: ["Предмети взагалі вживаються з означеним артиклем, а професія після ", { term: ser }, " — без артикля:"]
  ex: { examples: [["Me gusta ", { target: el }, " café."], ["Soy ", { target: profesor }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Аспект } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A1
          point: { en: Definite, es: Determinado, uk: Означений }
          rule: { alternatives: [{ term: el }, { term: la }, { term: los }, { term: las }] }
          ex: ["¿Dónde está ", { target: el }, " baño?"]
          tr: { en: Where is the bathroom?, uk: Де туалет? }
        - level: A1
          point: { en: Indefinite, es: Indeterminado, uk: Неозначений }
          rule: { alternatives: [{ term: un }, { term: una }, { term: unos }, { term: unas }] }
          ex: ["Tengo ", { target: un }, " hermano."]
          tr: { en: I have a brother., uk: У мене є брат. }
        - level: A1
          point: { en: Contractions, es: Contracciones, uk: Злиття }
          rule: { en: [{ mapping: [{ term: a el }, { term: al }] }, ", ", { mapping: [{ term: de el }, { term: del }] }], es: [{ mapping: [{ term: a el }, { term: al }] }, ", ", { mapping: [{ term: de el }, { term: del }] }], uk: [{ mapping: [{ term: a el }, { term: al }] }, ", ", { mapping: [{ term: de el }, { term: del }] }] }
          ex: ["Voy ", { target: al }, " mercado."]
          tr: { en: "I'm going to the market.", uk: Я йду на ринок. }
        - level: A1
          point: { en: In general, es: En general, uk: Загалом }
          rule: { en: things in general take the definite article, es: las cosas en general llevan artículo determinado, uk: предмети взагалі вживаються з означеним артиклем }
          ex: ["Me gustan ", { target: los }, " perros."]
          tr: { en: I like dogs., uk: Я люблю собак. }
        - level: A1
          point: { en: Days, es: Días, uk: Дні }
          rule: { en: [{ term: el lunes }, " means “on Monday”"], es: [{ term: el lunes }, " sin preposición"], uk: [{ term: el lunes }, " означає «у понеділок», без прийменника"] }
          ex: ["Te llamo ", { target: el }, " lunes."]
          tr: { en: "I'll call you on Monday.", uk: Я подзвоню тобі в понеділок. }
        - level: A1
          point: { en: No article, es: Sin artículo, uk: Без артикля }
          rule: { en: ["a job after ", { term: ser }], es: ["la profesión después de ", { term: ser }], uk: ["професія після ", { term: ser }] }
          ex: ["Ana es ", { target: profesora }, "."]
          tr: { en: Ana is a teacher., uk: Ана — вчителька. }
        - level: A2
          point: { en: No article, es: Sin artículo, uk: Без артикля }
          rule: { en: an amount that is not counted, es: una cantidad sin contar, uk: "кількість, яку не рахують" }
          ex: ["Compro ", { target: pan }, "."]
          tr: { en: "I'm buying bread.", uk: Я купую хліб. }
        - level: A2
          point: { en: Stressed a, es: A tónica, uk: Наголошене a }
          rule: { en: [{ term: el }, " before a feminine noun in stressed a"], es: [{ term: el }, " ante un femenino con a tónica"], uk: [{ term: el }, " перед іменником жіночого роду з наголошеним a"] }
          ex: [{ target: El }, " agua está fría."]
          tr: { en: The water is cold., uk: Вода холодна. }
        - level: A2
          point: { en: Body, es: Cuerpo, uk: Тіло }
          rule: { en: the article instead of a possessive, es: el artículo en lugar del posesivo, uk: артикль замість присвійного слова }
          ex: ["Me duele ", { target: la }, " cabeza."]
          tr: { en: My head hurts., uk: У мене болить голова. }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: ["no ", { term: un }, " or ", { term: una }, " before a job"], es: ["sin ", { term: un }, " ni ", { term: una }, " ante la profesión"], uk: ["без ", { term: un }, " і ", { term: una }, " перед професією"] }
          ex: ["Mi padre es ", { target: médico }, "."]
          tr: { en: My father is a doctor., uk: Мій батько — лікар. }

sections:
  - title: { en: "Form: the articles", es: "Forma: los artículos", uk: "Форма: артиклі" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: kind, label: { en: Article, es: Artículo, uk: Артикль } }
          - { key: masc, label: { en: Masculine, es: Masculino, uk: Чоловічий рід }, features: { gender: masc } }
          - { key: fem, label: { en: Feminine, es: Femenino, uk: Жіночий рід }, features: { gender: fem } }
        rows:
          - { level: A1, features: { definiteness: def, number: sg }, kind: { en: "Definite, singular", es: "Determinado, singular", uk: "Означений, однина" }, masc: [{ target: el }, " libro"], fem: [{ target: la }, " casa"] }
          - { level: A1, features: { definiteness: def, number: pl }, kind: { en: "Definite, plural", es: "Determinado, plural", uk: "Означений, множина" }, masc: [{ target: los }, " libros"], fem: [{ target: las }, " casas"] }
          - { level: A1, features: { definiteness: indf, number: sg }, kind: { en: "Indefinite, singular", es: "Indeterminado, singular", uk: "Неозначений, однина" }, masc: [{ target: un }, " libro"], fem: [{ target: una }, " casa"] }
          - { level: A1, features: { definiteness: indf, number: pl }, kind: { en: "Indefinite, plural", es: "Indeterminado, plural", uk: "Неозначений, множина" }, masc: [{ target: unos }, " libros"], fem: [{ target: unas }, " casas"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ mapping: [{ term: a el }, { term: al }] }, " and ", { mapping: [{ term: de el }, { term: del }] }, "; the other articles never join."]
              es: [{ mapping: [{ term: a el }, { term: al }] }, " y ", { mapping: [{ term: de el }, { term: del }] }, "; los demás artículos nunca se unen."]
              uk: [{ mapping: [{ term: a el }, { term: al }] }, " і ", { mapping: [{ term: de el }, { term: del }] }, "; інші артиклі ніколи не зливаються."]
            ex: ["Salgo ", { target: del }, " trabajo y voy ", { target: al }, " parque."]
            tr: { en: "I leave work and go to the park.", uk: Я виходжу з роботи й іду в парк. }
          - type: rule
            level: A2
            text:
              en: ["A feminine noun that starts with a stressed a takes ", { term: el }, " and ", { term: un }, " in the singular; its adjective stays feminine."]
              es: ["El sustantivo femenino que empieza por a tónica lleva ", { term: el }, " y ", { term: un }, " en singular; su adjetivo sigue en femenino."]
              uk: ["Іменник жіночого роду, що починається з наголошеного a, в однині має ", { term: el }, " і ", { term: un }, "; його прикметник залишається в жіночому роді."]
            ex: [{ target: El }, " agua está ", { target: fría }, "."]
            tr: { en: The water is cold., uk: Вода холодна. }
          - type: rule
            level: A2
            text:
              en: ["In the plural, the article is feminine again: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              es: ["En plural, el artículo vuelve al femenino: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
              uk: ["У множині артикль знову жіночого роду: ", { mapping: [{ term: el aula }, { term: las aulas }] }, "."]
          - type: rule
            level: A2
            text:
              en: ["Before a number, ", { term: unos }, " and ", { term: unas }, " mean “about”:"]
              es: ["Delante de un número, ", { term: unos }, " y ", { term: unas }, " significan “más o menos”:"]
              uk: ["Перед числом ", { term: unos }, " і ", { term: unas }, " означають «приблизно»:"]
            ex: ["Tengo ", { target: unos }, " veinte libros."]
            tr: { en: I have about twenty books., uk: У мене приблизно двадцять книжок. }
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "В українській мові артиклів немає, тож їх легко пропустити. В іспанській іменник в однині майже завжди має артикль або інше слово перед собою: el, un, este, mi."

  - title: { en: "Use: the definite article", es: "Uso: el artículo determinado", uk: "Вживання: означений артикль" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, use: { en: Something both people know, es: Algo que conocen los dos, uk: "Те, що відомо обом співрозмовникам" }, ex: ["Cierra ", { target: la }, " puerta, por favor."], tr: { en: "Close the door, please.", uk: "Зачини двері, будь ласка." } }
          - { level: A1, use: { en: Things in general, es: Las cosas en general, uk: Предмети взагалі }, ex: ["Me gustan ", { target: los }, " perros."], tr: { en: I like dogs., uk: Я люблю собак. } }
          - level: A1
            use: { en: "Days of the week: “on”", es: "Días de la semana", uk: "Дні тижня: «у»" }
            ex: { examples: [["Te llamo ", { target: el }, " lunes."], ["El museo cierra ", { target: los }, " lunes."]] }
            tr: { en: { examples: ["I'll call you on Monday.", The museum closes on Mondays.] }, uk: { examples: [Я подзвоню тобі в понеділок., Музей не працює в понеділок.] } }
          - { level: A1, use: { en: The hour, es: La hora, uk: Година }, ex: ["La clase es a ", { target: las }, " nueve."], tr: { en: The class is at nine., uk: Урок о дев’ятій. } }
          - { level: A2, use: { en: "Body parts and clothes, instead of a possessive", es: "Partes del cuerpo y ropa, en lugar del posesivo", uk: "Частини тіла й одяг, замість присвійного слова" }, ex: ["Me lavo ", { target: las }, " manos."], tr: { en: I wash my hands., uk: Я мию руки. } }
          - { level: A2, use: { en: A title when talking about someone, es: El tratamiento al hablar de alguien, uk: "Звертання, коли говоримо про когось" }, ex: [{ target: La }, " señora Pérez no está."], tr: { en: "Mrs Pérez isn't here.", uk: Пані Перес немає. } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "Speaking to someone, the title takes no article:"
              es: "Al hablar con alguien, el tratamiento no lleva artículo:"
              uk: "Коли звертаємося до людини, перед звертанням артикля немає:"
            ex: ["Buenos días, ", { target: señora Pérez }, "."]
            tr: { en: "Good morning, Mrs Pérez.", uk: "Доброго ранку, пані Перес." }

  - title: { en: "Use: the indefinite article and no article", es: "Uso: el artículo indeterminado y la ausencia de artículo", uk: "Вживання: неозначений артикль і відсутність артикля" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, use: { en: Something new in the conversation, es: Algo nuevo en la conversación, uk: Щось нове в розмові }, ex: ["Hay ", { target: un }, " banco en la esquina."], tr: { en: "There's a bank on the corner.", uk: На розі є банк. } }
          - { level: A1, use: { en: One of many, es: Uno entre muchos, uk: Один із багатьох }, ex: ["Tengo ", { target: una }, " pregunta."], tr: { en: I have a question., uk: У мене є запитання. } }
          - { level: A1, use: { en: "No article: a job or a nationality after ser", es: "Sin artículo: profesión o nacionalidad después de ser", uk: "Без артикля: професія або національність після ser" }, ex: ["Mi padre es ", { target: médico }, "."], tr: { en: My father is a doctor., uk: Мій батько — лікар. } }
          - { level: A2, use: { en: "No article: an amount that is not counted", es: "Sin artículo: una cantidad sin contar", uk: "Без артикля: кількість, яку не рахують" }, ex: ["Compro ", { target: pan }, " y ", { target: huevos }, "."], tr: { en: "I'm buying bread and eggs.", uk: Я купую хліб і яйця. } }
          - { level: A1, use: { en: "No article: hay with no amount", es: "Sin artículo: hay sin cantidad", uk: "Без артикля: hay без кількості" }, ex: ["No hay ", { target: agua }, "."], tr: { en: "There's no water.", uk: Води немає. } }
          - { level: A2, use: { en: "No article: a language after hablar", es: "Sin artículo: la lengua después de hablar", uk: "Без артикля: мова після hablar" }, ex: ["Hablo ", { target: español }, " e inglés."], tr: { en: I speak Spanish and English., uk: Я розмовляю іспанською та англійською. } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A job takes an article when an adjective describes it:"
              es: "La profesión lleva artículo cuando un adjetivo la describe:"
              uk: "Професія має артикль, коли її описує прикметник:"
            ex: ["Es ", { target: un }, " médico muy bueno."]
            tr: { en: "He's a very good doctor.", uk: Він дуже добрий лікар. }
          - type: note
            level: A1
            text:
              en: [{ term: hay }, " takes ", { term: un }, ", ", { term: una }, " or no article, and ", { term: está }, " takes ", { term: el }, " or ", { term: la }, ": see ", { link: Hay and Está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              es: [{ term: hay }, " lleva ", { term: un }, ", ", { term: una }, " o ningún artículo, y ", { term: está }, " lleva ", { term: el }, " o ", { term: la }, ": ver ", { link: Hay y está, to: es.ser-estar-hay-gustar.hay-esta }, "."]
              uk: [{ term: hay }, " вживається з ", { term: un }, ", ", { term: una }, " або без артикля, а ", { term: está }, " — з ", { term: el }, " або ", { term: la }, ": див. ", { link: Hay і está, to: es.ser-estar-hay-gustar.hay-esta }, "."]

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Voy a el parque., right: ["Voy ", { target: al }, " parque."], rule: { en: { mapping: [{ term: a el }, { term: al }] }, es: { mapping: [{ term: a el }, { term: al }] }, uk: { mapping: [{ term: a el }, { term: al }] } } }
          - { level: A1, wrong: Mi madre es una profesora., right: ["Mi madre es ", { target: profesora }, "."], rule: { en: ["a job after ", { term: ser }, " takes no article"], es: ["la profesión después de ", { term: ser }, " no lleva artículo"], uk: ["професія після ", { term: ser }, " вживається без артикля"] } }
          - { level: A1, wrong: Me gusta café., right: ["Me gusta ", { target: el }, " café."], rule: { en: "things in general take the definite article", es: "las cosas en general llevan artículo determinado", uk: "предмети взагалі вживаються з означеним артиклем" } }
          - { level: A2, wrong: La agua está fría., right: [{ target: El }, " agua está fría."], rule: { en: [{ term: el }, " before a feminine noun in stressed a"], es: [{ term: el }, " ante un femenino con a tónica"], uk: [{ term: el }, " перед іменником жіночого роду з наголошеним a"] } }
          - { level: A2, wrong: Me lavo mis manos., right: ["Me lavo ", { target: las }, " manos."], rule: { en: "body parts take the article", es: "las partes del cuerpo llevan el artículo", uk: "частини тіла вживаються з артиклем" } }
          - { level: A1, speakers: [en], wrong: Te llamo en el lunes., right: ["Te llamo ", { target: el lunes }, "."], rule: { en: ["a day takes ", { term: el }, " with no word for “on”"] } }
          - { level: A1, speakers: [uk], wrong: ¿Dónde está baño?, right: ["¿Dónde está ", { target: el }, " baño?"], rule: { uk: ["відомий обом предмет вживається з ", { term: el }, " або ", { term: la }, ", хоча українською кажемо просто «де туалет»"] } }
          - { level: A1, speakers: [uk], wrong: Tengo hermano., right: ["Tengo ", { target: un }, " hermano."], rule: { uk: ["один предмет у однині вживається з ", { term: un }, " або ", { term: una }] } }
          - { level: A1, speakers: [uk], wrong: Te llamo en lunes., right: ["Te llamo ", { target: el }, " lunes."], rule: { uk: ["день тижня — з ", { term: el }, " і без прийменника, хоча українською кажемо «у понеділок»"] } }
