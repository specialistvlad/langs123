  - title: { es: "Los demostrativos en el discurso" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            use: { es: "enlace entre oraciones: el demostrativo retoma un nombre ya dicho" }
            ex: ["Ayer me llamó un vecino. ", { target: Ese vecino }, " quiere vender su casa."]
          - level: B2
            use: { es: "la forma neutra apunta hacia lo que se va a decir" }
            ex: ["Escucha ", { target: esto }, ": mañana no hay clase."]
          - level: C1
            use: { es: ["la cercanía elige el referente: ", { term: este }, " es el último nombrado y ", { term: aquel }, " el primero"] }
            ex: ["Hablé con Ana y con su hermano. ", { target: Este }, " me pareció amable y ", { target: aquella }, ", muy seria."]
          - level: C1
            use: { es: [{ term: eso }, " y una oración de relativo: retoma una idea o un hecho"] }
            ex: [{ target: Eso }, " que propones es muy caro."]
          - level: C1
            use: { es: "una persona sin nombre, con tono despectivo o admirado" }
            ex: [{ target: Esa }, " siempre se cree la más lista."]
          - level: C1
            use: { es: "al final de la frase, el demostrativo con el nombre da un tono condescendiente" }
            ex: ["Siempre llega tarde, ", { target: este chico }, { gap: true }]
          - level: C2
            use: { es: [{ term: este }, " y un nombre de pila: señala a alguien que los dos conocen"] }
            ex: [{ target: Este Pablo }, " del que hablas, ¿es el hermano de Sara?"]
          - level: C2
            use: { es: "sorpresa o humor ante una persona" }
            ex: ["¡Mira ", { target: esa }, " qué elegante viene!"]
          - level: C2
            use: { es: [{ term: este }, " por “yo”: el hablante se señala a sí mismo, en tono informal"] }
            ex: [{ target: Esta }, " no se mueve de aquí."]

  - title: { es: "Los demostrativos pospuestos" }
    role: own
    content:
      - type: usage
        columns:
          - { key: pattern, label: { es: Estructura } }
          - { key: meaning, label: { es: Significado } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            pattern: { pattern: [{ term: el }, { slot: noun }, { slot: { es: demostrativo } }] }
            meaning: { es: "referencia lejana en el tiempo o en el recuerdo" }
            ex: { examples: [[{ target: Los tiempos aquellos }, " fueron difíciles."], ["Recuerdo ", { target: la casa aquella }, " junto al río."]] }
          - level: C1
            pattern: { pattern: [{ term: qué }, { slot: noun }, { slot: { es: demostrativo } }] }
            meaning: { es: "exclamación de admiración, queja o nostalgia" }
            ex: { examples: [["¡Qué ", { target: día este }, "!"], ["¡Qué ", { target: veranos aquellos }, "!"]] }
          - level: C2
            pattern: { pattern: [{ term: el }, { slot: noun }, { slot: { es: demostrativo } }] }
            meaning: { es: "desprecio o fastidio ante una persona o una cosa, en el habla coloquial" }
            ex: { examples: [[{ target: El niño este }, " no hace caso."], [{ target: Los vecinos estos }, " hacen ruido de noche."]] }
          - level: C2
            pattern: { pattern: [{ term: vaya }, { slot: noun }, { slot: { es: demostrativo } }, { term: que }, { slot: clause }] }
            meaning: { es: "ponderación de algo que el otro tiene o ha hecho" }
            ex: ["¡", { target: Vaya terraza esta }, " que tienes!"]

