          tr: { en: I want this cake., uk: Я хочу цей торт., pt: "Quero este bolo.", fr: "Je veux ce gâteau.", de: "Ich möchte diesen Kuchen.", it: "Voglio questo dolce.", pl: "Chcę to ciasto.", tr: "Bu pastayı istiyorum.", id: "Saya mau kue ini.", vi: "Tôi muốn cái bánh này." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: ["introducing a person: ", { alternatives: [{ term: este }, { term: esta }] }], es: ["para presentar a alguien: ", { alternatives: [{ term: este }, { term: esta }] }], uk: ["коли представляємо людину: ", { alternatives: [{ term: este }, { term: esta }] }], pt: ["para apresentar alguém: ", { alternatives: [{ term: este }, { term: esta }] }], fr: ["pour présenter quelqu’un : ", { alternatives: [{ term: este }, { term: esta }] }], de: ["um jemanden vorzustellen: ", { alternatives: [{ term: este }, { term: esta }] }], it: ["per presentare qualcuno: ", { alternatives: [{ term: este }, { term: esta }] }], pl: ["przedstawiając kogoś: ", { alternatives: [{ term: este }, { term: esta }] }], tr: ["birini tanıtırken: ", { alternatives: [{ term: este }, { term: esta }] }], id: ["untuk memperkenalkan seseorang: ", { alternatives: [{ term: este }, { term: esta }] }], vi: ["khi giới thiệu một người: ", { alternatives: [{ term: este }, { term: esta }] }] }
          ex: [{ target: Este }, " es mi hermano."]
          tr: { en: This is my brother., uk: Це мій брат., pt: "Este é meu irmão.", fr: "Voici mon frère.", de: "Das ist mein Bruder.", it: "Questo è mio fratello.", pl: "To jest mój brat.", tr: "Bu benim erkek kardeşim.", id: "Ini saudara laki-laki saya.", vi: "Đây là anh trai tôi." }

sections:
  - title: { en: "Form: three distances", es: "Forma: tres distancias", uk: "Форма: три відстані", pt: "Forma: três distâncias", fr: "Forme : trois distances", de: "Form: drei Entfernungen", it: "Forma: tre distanze", pl: "Forma: trzy odległości", tr: "Biçim: üç uzaklık", id: "Bentuk: tiga jarak", vi: "Dạng: ba khoảng cách" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: distance, label: { en: Distance, es: Distancia, uk: Відстань, pt: "Distância", fr: "Distance", de: "Entfernung", it: "Distanza", pl: "Odległość", tr: "Uzaklık", id: "Jarak", vi: "Khoảng cách" } }
          - { key: sg, label: { en: Singular, es: Singular, uk: Однина, pt: "Singular", fr: "Singulier", de: "Singular", it: "Singolare", pl: "Liczba pojedyncza", tr: "Tekil", id: "Tunggal", vi: "Số ít" }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: Множина, pt: "Plural", fr: "Pluriel", de: "Plural", it: "Plurale", pl: "Liczba mnoga", tr: "Çoğul", id: "Jamak", vi: "Số nhiều" }, features: { number: pl } }
        rows:
          - { level: A1, features: { deixis: prox }, distance: { en: near me, es: cerca de mí, uk: біля мене, pt: "perto de mim", fr: "près de moi", de: "nahe bei mir", it: "vicino a me", pl: "blisko mnie", tr: "bana yakın", id: "dekat saya", vi: "gần tôi" }, sg: { alternatives: [{ target: este }, { target: esta }] }, pl: { alternatives: [{ target: estos }, { target: estas }] } }
          - { level: A1, distance: { en: near you, es: cerca de ti, uk: біля тебе, pt: "perto de você", fr: "près de toi", de: "nahe bei dir", it: "vicino a te", pl: "blisko ciebie", tr: "sana yakın", id: "dekat kamu", vi: "gần bạn" }, sg: { alternatives: [{ target: ese }, { target: esa }] }, pl: { alternatives: [{ target: esos }, { target: esas }] } }
          - { level: A1, features: { deixis: dist }, distance: { en: far from us both, es: lejos de los dos, uk: далеко від нас обох, pt: "longe dos dois", fr: "loin de nous deux", de: "weit weg von uns beiden", it: "lontano da tutti e due", pl: "daleko od nas obojga", tr: "ikimizden de uzak", id: "jauh dari kita berdua", vi: "xa cả hai chúng ta" }, sg: { alternatives: [{ target: aquel }, { target: aquella }] }, pl: { alternatives: [{ target: aquellos }, { target: aquellas }] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The demonstrative goes before the noun and agrees with it in gender and number:"
              es: "El demostrativo va delante del sustantivo y concuerda con él en género y número:"
              uk: "Вказівний займенник стоїть перед іменником і узгоджується з ним у роді й числі:"
              pt: "O demonstrativo vem antes do substantivo e concorda com ele em gênero e número:"
              fr: "Le démonstratif se place devant le nom et s’accorde avec lui en genre et en nombre :"
              de: "Das Demonstrativpronomen steht vor dem Nomen und richtet sich in Genus und Numerus nach ihm:"
              it: "Il dimostrativo sta davanti al sostantivo e concorda con esso in genere e numero:"
              pl: "Zaimek wskazujący stoi przed rzeczownikiem i zgadza się z nim w rodzaju i liczbie:"
              tr: "İşaret sözcüğü isimden önce gelir ve onunla cinsiyette ve sayıda uyum sağlar:"
              id: "Kata tunjuk berada sebelum kata benda dan menyesuaikan diri dengan kata itu dalam gender dan jumlah:"
              vi: "Từ chỉ định đứng trước danh từ và hòa hợp với danh từ về giống và số:"
            ex: ["Me gustan ", { target: estas }, " camisas."]
            tr: { en: I like these shirts., uk: Мені подобаються ці сорочки., pt: "Gosto destas camisas.", fr: "J’aime ces chemises.", de: "Ich mag diese Hemden.", it: "Mi piacciono queste camicie.", pl: "Podobają mi się te koszule.", tr: "Bu gömlekleri beğeniyorum.", id: "Saya suka kemeja ini.", vi: "Tôi thích những cái áo sơ mi này." }
          - type: rule
            level: A1
            text:
              en: ["The masculine singular ends in -e: ", { term: este }, ", ", { term: ese }, "."]
              es: ["El masculino singular termina en -e: ", { term: este }, ", ", { term: ese }, "."]
              uk: ["Форма чоловічого роду однини закінчується на -e: ", { term: este }, ", ", { term: ese }, "."]
              pt: ["O masculino singular termina em -e: ", { term: este }, ", ", { term: ese }, "."]
              fr: ["Le masculin singulier se termine en -e : ", { term: este }, ", ", { term: ese }, "."]
              de: ["Die männliche Singularform endet auf -e: ", { term: este }, ", ", { term: ese }, "."]
              it: ["Il maschile singolare termina in -e: ", { term: este }, ", ", { term: ese }, "."]
              pl: ["Rodzaj męski w liczbie pojedynczej kończy się na -e: ", { term: este }, ", ", { term: ese }, "."]
              tr: ["Eril tekil biçim -e ile biter: ", { term: este }, ", ", { term: ese }, "."]
              id: ["Bentuk maskulin tunggal berakhiran -e: ", { term: este }, ", ", { term: ese }, "."]
              vi: ["Dạng giống đực số ít kết thúc bằng -e: ", { term: este }, ", ", { term: ese }, "."]
          - type: rule
            level: A1
            text:
              en: ["The masculine singular of the far form ends in -l: ", { term: aquel }, "."]
              es: ["El masculino singular de la forma lejana termina en -l: ", { term: aquel }, "."]
              uk: ["Дальня форма чоловічого роду однини закінчується на -l: ", { term: aquel }, "."]
              pt: ["O masculino singular da forma distante termina em -l: ", { term: aquel }, "."]
              fr: ["Le masculin singulier de la forme éloignée se termine en -l : ", { term: aquel }, "."]
              de: ["Die männliche Singularform für große Entfernung endet auf -l: ", { term: aquel }, "."]
              it: ["Il maschile singolare della forma lontana termina in -l: ", { term: aquel }, "."]
              pl: ["Rodzaj męski w liczbie pojedynczej formy dalekiej kończy się na -l: ", { term: aquel }, "."]
              tr: ["Uzak biçimin eril tekili -l ile biter: ", { term: aquel }, "."]
              id: ["Bentuk maskulin tunggal untuk jarak jauh berakhiran -l: ", { term: aquel }, "."]
              vi: ["Dạng giống đực số ít chỉ nơi xa kết thúc bằng -l: ", { term: aquel }, "."]
          - type: rule
            level: A1
            text:
              en: "Alone, the demonstrative takes the place of a known noun and has no written accent:"
              es: "Solo, el demostrativo ocupa el lugar de un sustantivo conocido y no lleva tilde:"
              uk: "Без іменника вказівний займенник заступає відомий іменник і пишеться без знака наголосу:"
              pt: "Sozinho, o demonstrativo ocupa o lugar de um substantivo conhecido e não leva acento:"
              fr: "Seul, le démonstratif remplace un nom connu et ne prend pas d’accent :"
              de: "Allein stehend ersetzt das Demonstrativpronomen ein bekanntes Nomen und trägt keinen Akzent:"
              it: "Da solo, il dimostrativo prende il posto di un sostantivo noto e non porta l’accento:"
              pl: "Użyty samodzielnie, zaimek wskazujący zastępuje znany rzeczownik i nie ma akcentu pisanego:"
              tr: "Tek başına kullanılan işaret sözcüğü, bilinen bir ismin yerini tutar ve vurgu işareti taşımaz:"
              id: "Kalau berdiri sendiri, kata tunjuk menggantikan kata benda yang sudah dikenal dan tidak memakai tanda aksen:"
              vi: "Đứng một mình, từ chỉ định thay cho một danh từ đã biết và không có dấu sắc:"
            ex: ["No quiero este libro; quiero ", { target: ese }, "."]
            tr: { en: "I don't want this book; I want that one.", uk: "Я не хочу цю книжку; я хочу ту.", pt: "Não quero este livro; quero esse.", fr: "Je ne veux pas ce livre ; je veux celui-là.", de: "Ich will dieses Buch nicht; ich will das da.", it: "Non voglio questo libro; voglio quello.", pl: "Nie chcę tej książki; chcę tamtą.", tr: "Bu kitabı istemiyorum; şunu istiyorum.", id: "Saya tidak mau buku ini; saya mau yang itu.", vi: "Tôi không muốn quyển sách này; tôi muốn quyển đó." }
          - type: rule
            level: A1
            text:
              en: "Introducing a person, the demonstrative takes the person’s gender:"
              es: "Para presentar a una persona se usa el demostrativo de su género:"
              uk: "Коли представляємо людину, вказівний займенник має її рід:"
              pt: "Para apresentar uma pessoa, usa-se o demonstrativo do gênero dela:"
              fr: "Pour présenter une personne, on emploie le démonstratif de son genre :"
              de: "Um eine Person vorzustellen, verwendet man das Demonstrativpronomen ihres Geschlechts:"
              it: "Per presentare una persona si usa il dimostrativo del suo genere:"
              pl: "Przedstawiając osobę, używamy zaimka wskazującego w jej rodzaju:"
              tr: "Bir kişiyi tanıtırken kişinin cinsiyetine uygun işaret sözcüğü kullanılır:"
              id: "Untuk memperkenalkan seseorang, dipakai kata tunjuk sesuai gender orang itu:"
              vi: "Khi giới thiệu một người, dùng từ chỉ định theo giống của người đó:"
            ex: [{ target: Esta }, " es mi amiga Lucía."]
            tr: { en: This is my friend Lucía., uk: Це моя подруга Лусія., pt: "Esta é minha amiga Lucía.", fr: "Voici mon amie Lucía.", de: "Das ist meine Freundin Lucía.", it: "Questa è la mia amica Lucía.", pl: "To jest moja przyjaciółka Lucía.", tr: "Bu benim arkadaşım Lucía.", id: "Ini teman saya, Lucía.", vi: "Đây là bạn tôi, Lucía." }
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "В українській дві відстані, «цей» і «той», а в іспанській три: este — біля мене, ese — біля тебе, aquel — далеко від нас обох. А українське «це» перед людиною іспанською — este або esta, а не esto."

  - title: { en: "Neuter: esto, eso, aquello", es: "Neutro: esto, eso, aquello", uk: "Середній рід: esto, eso, aquello", pt: "Neutro: esto, eso, aquello", fr: "Neutre : esto, eso, aquello", de: "Neutrum: esto, eso, aquello", it: "Neutro: esto, eso, aquello", pl: "Rodzaj nijaki: esto, eso, aquello", tr: "Nötr: esto, eso, aquello", id: "Netral: esto, eso, aquello", vi: "Giống trung: esto, eso, aquello" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: Форма, pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: use, label: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, features: { deixis: prox }, form: esto, use: { en: a thing near me with no name yet, es: "una cosa cerca de mí, sin nombrar", uk: "річ біля мене, яку ще не назвали", pt: "uma coisa perto de mim, ainda sem nome", fr: "une chose près de moi, sans nom", de: "eine Sache nahe bei mir, ohne Namen", it: "una cosa vicina a me, non ancora nominata", pl: "rzecz blisko mnie, bez nazwy", tr: "bana yakın, henüz adı konmamış bir şey", id: "benda dekat saya yang belum disebut namanya", vi: "một vật gần tôi chưa gọi tên" }, ex: ["¿Qué es ", { target: esto }, "?"], tr: { en: What is this?, uk: Що це?, pt: "O que é isto?", fr: "Qu’est-ce que c’est ?", de: "Was ist das?", it: "Che cos’è questo?", pl: "Co to jest?", tr: "Bu ne?", id: "Apa ini?", vi: "Đây là cái gì?" } }
          - { level: A1, form: eso, use: { en: a thing near you with no name yet, es: "una cosa cerca de ti, sin nombrar", uk: "річ біля тебе, яку ще не назвали", pt: "uma coisa perto de você, ainda sem nome", fr: "une chose près de toi, sans nom", de: "eine Sache nahe bei dir, ohne Namen", it: "una cosa vicina a te, non ancora nominata", pl: "rzecz blisko ciebie, bez nazwy", tr: "sana yakın, henüz adı konmamış bir şey", id: "benda dekat kamu yang belum disebut namanya", vi: "một vật gần bạn chưa gọi tên" }, ex: ["¿Qué es ", { target: eso }, "?"], tr: { en: What is that?, uk: Що це таке?, pt: "O que é isso?", fr: "Qu’est-ce que c’est que ça ?", de: "Was ist das da?", it: "Che cos’è quello?", pl: "A co to takiego?", tr: "Şu ne?", id: "Apa itu?", vi: "Cái đó là gì?" } }
          - { level: A2, form: eso, use: { en: what someone just said or did, es: lo que alguien acaba de decir o hacer, uk: "те, що хтось щойно сказав або зробив", pt: "o que alguém acabou de dizer ou fazer", fr: "ce que quelqu’un vient de dire ou de faire", de: "das, was jemand gerade gesagt oder getan hat", it: "ciò che qualcuno ha appena detto o fatto", pl: "to, co ktoś właśnie powiedział lub zrobił", tr: "birinin az önce söylediği ya da yaptığı şey", id: "apa yang baru saja dikatakan atau dilakukan seseorang", vi: "điều ai đó vừa nói hoặc vừa làm" }, ex: [{ target: Eso }, " es verdad."], tr: { en: "That's true.", uk: Це правда., pt: "Isso é verdade.", fr: "C’est vrai.", de: "Das stimmt.", it: "È vero.", pl: "To prawda.", tr: "Bu doğru.", id: "Itu benar.", vi: "Điều đó đúng." } }
          - { level: A1, features: { deixis: dist }, form: aquello, use: { en: a thing far from us both, es: una cosa lejos de los dos, uk: річ далеко від нас обох, pt: "uma coisa longe dos dois", fr: "une chose loin de nous deux", de: "eine Sache weit weg von uns beiden", it: "una cosa lontana da tutti e due", pl: "rzecz daleko od nas obojga", tr: "ikimizden de uzak bir şey", id: "benda yang jauh dari kita berdua", vi: "một vật xa cả hai chúng ta" }, ex: ["¿Qué es ", { target: aquello }, "?"], tr: { en: What is that over there?, uk: Що то там таке?, pt: "O que é aquilo?", fr: "Qu’est-ce que c’est, là-bas ?", de: "Was ist das dort drüben?", it: "Che cos’è quello laggiù?", pl: "Co to tam jest?", tr: "Uzaktaki o ne?", id: "Apa itu di sana?", vi: "Cái đằng kia là gì?" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The neuter forms never go before a noun and have no plural."
              es: "Las formas neutras nunca van delante de un sustantivo y no tienen plural."
              uk: "Форми середнього роду ніколи не стоять перед іменником і не мають множини."
              pt: "As formas neutras nunca vêm antes de um substantivo e não têm plural."
              fr: "Les formes neutres ne se placent jamais devant un nom et n’ont pas de pluriel."
              de: "Die neutralen Formen stehen nie vor einem Nomen und haben keinen Plural."
              it: "Le forme neutre non stanno mai davanti a un sostantivo e non hanno plurale."
              pl: "Formy nijakie nigdy nie stoją przed rzeczownikiem i nie mają liczby mnogiej."
              tr: "Nötr biçimler hiçbir zaman isimden önce gelmez ve çoğulu yoktur."
              id: "Bentuk netral tidak pernah berada sebelum kata benda dan tidak punya bentuk jamak."
              vi: "Các dạng trung tính không bao giờ đứng trước danh từ và không có số nhiều."

  - title: { en: "Use: place and time", es: "Uso: lugar y tiempo", uk: "Вживання: місце і час", pt: "Uso: lugar e tempo", fr: "Emploi : lieu et temps", de: "Gebrauch: Ort und Zeit", it: "Uso: luogo e tempo", pl: "Użycie: miejsce i czas", tr: "Kullanım: yer ve zaman", id: "Penggunaan: tempat dan waktu", vi: "Cách dùng: nơi chốn và thời gian" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, use: { en: Near the speaker, es: Cerca del que habla, uk: "Біля того, хто говорить", pt: "Perto de quem fala", fr: "Près de celui qui parle", de: "Nahe beim Sprecher", it: "Vicino a chi parla", pl: "Blisko mówiącego", tr: "Konuşana yakın", id: "Dekat pembicara", vi: "Gần người nói" }, ex: [{ target: Esta }, " silla está libre."], tr: { en: This chair is free., uk: Цей стілець вільний., pt: "Esta cadeira está livre.", fr: "Cette chaise est libre.", de: "Dieser Stuhl ist frei.", it: "Questa sedia è libera.", pl: "To krzesło jest wolne.", tr: "Bu sandalye boş.", id: "Kursi ini kosong.", vi: "Cái ghế này còn trống." } }
          - { level: A1, use: { en: Near the listener, es: Cerca del que escucha, uk: "Біля того, хто слухає", pt: "Perto de quem ouve", fr: "Près de celui qui écoute", de: "Nahe beim Zuhörer", it: "Vicino a chi ascolta", pl: "Blisko słuchającego", tr: "Dinleyene yakın", id: "Dekat pendengar", vi: "Gần người nghe" }, ex: ["¿Cuánto cuesta ", { target: esa }, " mochila?"], tr: { en: How much is that backpack?, uk: Скільки коштує той рюкзак?, pt: "Quanto custa essa mochila?", fr: "Combien coûte ce sac à dos ?", de: "Wie viel kostet dieser Rucksack?", it: "Quanto costa quello zaino?", pl: "Ile kosztuje ten plecak?", tr: "Şu sırt çantası ne kadar?", id: "Berapa harga tas ransel itu?", vi: "Cái ba lô đó giá bao nhiêu?" } }
