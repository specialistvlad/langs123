            text:
              en: ["The place adverbs match the three distances: ", { term: aquí }, " with ", { term: este }, ", ", { term: ahí }, " with ", { term: ese }, ", ", { term: allí }, " with ", { term: aquel }, "."]
              es: ["Los adverbios de lugar siguen las tres distancias: ", { term: aquí }, " con ", { term: este }, ", ", { term: ahí }, " con ", { term: ese }, ", ", { term: allí }, " con ", { term: aquel }, "."]
              uk: ["Прислівники місця відповідають трьом відстаням: ", { term: aquí }, " — з ", { term: este }, ", ", { term: ahí }, " — з ", { term: ese }, ", ", { term: allí }, " — з ", { term: aquel }, "."]
              pt: ["Os advérbios de lugar seguem as três distâncias: ", { term: aquí }, " com ", { term: este }, ", ", { term: ahí }, " com ", { term: ese }, ", ", { term: allí }, " com ", { term: aquel }, "."]
              fr: ["Les adverbes de lieu suivent les trois distances : ", { term: aquí }, " avec ", { term: este }, ", ", { term: ahí }, " avec ", { term: ese }, ", ", { term: allí }, " avec ", { term: aquel }, "."]
              de: ["Die Ortsadverbien folgen den drei Entfernungen: ", { term: aquí }, " mit ", { term: este }, ", ", { term: ahí }, " mit ", { term: ese }, ", ", { term: allí }, " mit ", { term: aquel }, "."]
              it: ["Gli avverbi di luogo seguono le tre distanze: ", { term: aquí }, " con ", { term: este }, ", ", { term: ahí }, " con ", { term: ese }, ", ", { term: allí }, " con ", { term: aquel }, "."]
              pl: ["Przysłówki miejsca odpowiadają trzem odległościom: ", { term: aquí }, " z ", { term: este }, ", ", { term: ahí }, " z ", { term: ese }, ", ", { term: allí }, " z ", { term: aquel }, "."]
              tr: ["Yer zarfları üç uzaklığa uyar: ", { term: aquí }, " ile ", { term: este }, ", ", { term: ahí }, " ile ", { term: ese }, ", ", { term: allí }, " ile ", { term: aquel }, "."]
              id: ["Keterangan tempat mengikuti ketiga jarak itu: ", { term: aquí }, " dengan ", { term: este }, ", ", { term: ahí }, " dengan ", { term: ese }, ", ", { term: allí }, " dengan ", { term: aquel }, "."]
              vi: ["Trạng từ chỉ nơi chốn tương ứng với ba khoảng cách: ", { term: aquí }, " với ", { term: este }, ", ", { term: ahí }, " với ", { term: ese }, ", ", { term: allí }, " với ", { term: aquel }, "."]
            ex: [{ target: Aquel }, " edificio de ", { target: allí }, " es el hospital."]
            tr: { en: That building over there is the hospital., uk: Он та будівля — лікарня., pt: "Aquele prédio lá é o hospital.", fr: "Ce bâtiment, là-bas, c’est l’hôpital.", de: "Das Gebäude dort drüben ist das Krankenhaus.", it: "Quell’edificio laggiù è l’ospedale.", pl: "Tamten budynek tam to szpital.", tr: "Şuradaki o bina hastane.", id: "Gedung yang di sana itu rumah sakit.", vi: "Tòa nhà đằng kia là bệnh viện." }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Latin America, above all in Mexico and the Southern Cone, ", { term: acá }, " and ", { term: allá }, " are very frequent beside ", { term: aquí }, " and ", { term: allí }, ":"]
              es: ["En Latinoamérica, sobre todo en México y el Cono Sur, ", { term: acá }, " y ", { term: allá }, " son muy frecuentes junto a ", { term: aquí }, " y ", { term: allí }, ":"]
              uk: ["У Латинській Америці, особливо в Мексиці та країнах Південного конуса, поряд з ", { term: aquí }, " і ", { term: allí }, " дуже часто вживають ", { term: acá }, " і ", { term: allá }, ":"]
              pt: ["Na América Latina, sobretudo no México e no Cone Sul, ", { term: acá }, " e ", { term: allá }, " são muito frequentes ao lado de ", { term: aquí }, " e ", { term: allí }, ":"]
              fr: ["En Amérique latine, surtout au Mexique et dans le Cône Sud, ", { term: acá }, " et ", { term: allá }, " sont très fréquents à côté de ", { term: aquí }, " et ", { term: allí }, " :"]
              de: ["In Lateinamerika, vor allem in Mexiko und im Cono Sur, sind ", { term: acá }, " und ", { term: allá }, " neben ", { term: aquí }, " und ", { term: allí }, " sehr häufig:"]
              it: ["In America Latina, soprattutto in Messico e nel Cono Sur, ", { term: acá }, " e ", { term: allá }, " sono molto frequenti accanto ad ", { term: aquí }, " e ", { term: allí }, ":"]
              pl: ["W Ameryce Łacińskiej, zwłaszcza w Meksyku i w krajach Stożka Południowego, obok ", { term: aquí }, " i ", { term: allí }, " bardzo często używa się ", { term: acá }, " i ", { term: allá }, ":"]
              tr: ["Latin Amerika’da, özellikle Meksika’da ve Güney Koni ülkelerinde, ", { term: aquí }, " ve ", { term: allí }, " yanında ", { term: acá }, " ve ", { term: allá }, " da çok sık kullanılır:"]
              id: ["Di Amerika Latin, terutama di Meksiko dan Kerucut Selatan, ", { term: acá }, " dan ", { term: allá }, " sangat sering dipakai di samping ", { term: aquí }, " dan ", { term: allí }, ":"]
              vi: ["Ở Mỹ Latinh, nhất là ở Mexico và Nón Nam, ", { term: acá }, " và ", { term: allá }, " rất thường gặp bên cạnh ", { term: aquí }, " và ", { term: allí }, ":"]
            ex: ["Ven ", { target: acá }, "."]
            tr: { en: Come here., uk: Іди сюди., pt: "Venha cá.", fr: "Viens ici.", de: "Komm her.", it: "Vieni qui.", pl: "Chodź tutaj.", tr: "Buraya gel.", id: "Ke sini.", vi: "Đến đây." }

  - title: { es: "Los demostrativos en el discurso", en: "Demonstratives in discourse", uk: "Вказівні займенники у мовленні", pt: "Os demonstrativos no discurso", fr: "Les démonstratifs dans le discours", de: "Demonstrativpronomen im Diskurs", it: "I dimostrativi nel discorso", pl: "Zaimki wskazujące w wypowiedzi", tr: "Söylemde işaret sözcükleri", id: "Kata tunjuk dalam wacana", vi: "Từ chỉ định trong diễn ngôn" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "enlace entre oraciones: el demostrativo retoma un nombre ya dicho", en: "link between sentences: the demonstrative picks up a noun already mentioned", uk: "зв’язок між реченнями: вказівний займенник повертається до вже названого іменника", pt: "ligação entre frases: o demonstrativo retoma um substantivo já dito", fr: "lien entre les phrases : le démonstratif reprend un nom déjà dit", de: "Verknüpfung zwischen Sätzen: Das Demonstrativpronomen nimmt ein schon genanntes Nomen wieder auf", it: "collegamento tra le frasi: il dimostrativo riprende un sostantivo già detto", pl: "łączenie zdań: zaimek wskazujący wraca do rzeczownika, który już padł", tr: "tümceler arasında bağ: işaret sözcüğü daha önce söylenmiş bir ismi yeniden anar", id: "penghubung antarkalimat: kata tunjuk merujuk kembali ke kata benda yang sudah disebut", vi: "nối các câu: từ chỉ định nhắc lại danh từ đã nói" }
            ex: ["Ayer me llamó un vecino. ", { target: Ese vecino }, " quiere vender su casa."]
            tr: { en: "A neighbour called me yesterday. That neighbour wants to sell his house.", uk: "Учора мені зателефонував сусід. Той сусід хоче продати свій будинок.", pt: "Ontem um vizinho me ligou. Esse vizinho quer vender a casa dele.", fr: "Hier, un voisin m’a appelé. Ce voisin veut vendre sa maison.", de: "Gestern hat mich ein Nachbar angerufen. Dieser Nachbar will sein Haus verkaufen.", it: "Ieri mi ha chiamato un vicino. Quel vicino vuole vendere la sua casa.", pl: "Wczoraj zadzwonił do mnie sąsiad. Ten sąsiad chce sprzedać swój dom.", tr: "Dün bir komşum beni aradı. O komşu evini satmak istiyor.", id: "Kemarin seorang tetangga menelepon saya. Tetangga itu mau menjual rumahnya.", vi: "Hôm qua một người hàng xóm gọi cho tôi. Người hàng xóm đó muốn bán nhà." }
          - level: B2
            use: { es: "la forma neutra apunta hacia lo que se va a decir", en: "the neuter form points ahead to what is about to be said", uk: "форма середнього роду вказує на те, що буде сказано далі", pt: "a forma neutra aponta para o que vai ser dito", fr: "la forme neutre annonce ce qui va être dit", de: "Die neutrale Form weist auf das hin, was gleich gesagt wird", it: "la forma neutra rimanda a ciò che sta per essere detto", pl: "forma nijaka wskazuje na to, co zaraz zostanie powiedziane", tr: "nötr biçim, söylenmek üzere olan şeye işaret eder", id: "bentuk netral menunjuk ke apa yang akan dikatakan", vi: "dạng trung tính chỉ điều sắp được nói" }
            ex: ["Escucha ", { target: esto }, ": mañana no hay clase."]
            tr: { en: "Listen to this: there is no class tomorrow.", uk: "Послухай ось що: завтра занять немає.", pt: "Escute isto: amanhã não tem aula.", fr: "Écoute ça : demain, il n’y a pas cours.", de: "Hör mal: Morgen fällt der Unterricht aus.", it: "Ascolta questo: domani non c’è lezione.", pl: "Posłuchaj: jutro nie ma zajęć.", tr: "Şunu dinle: yarın ders yok.", id: "Dengarkan ini: besok tidak ada kelas.", vi: "Nghe này: ngày mai không có lớp." }
          - level: C1
            use: { es: ["la cercanía elige el referente: ", { term: este }, " es el último nombrado y ", { term: aquel }, " el primero"], en: ["nearness picks the referent: ", { term: este }, " is the last one named and ", { term: aquel }, " the first"], uk: ["близькість визначає, про кого йдеться: ", { term: este }, " — останній названий, ", { term: aquel }, " — перший"], pt: ["a proximidade escolhe o referente: ", { term: este }, " é o último nomeado e ", { term: aquel }, ", o primeiro"], fr: ["la proximité choisit le référent : ", { term: este }, " est le dernier nommé et ", { term: aquel }, " le premier"], de: ["Die Nähe bestimmt den Bezug: ", { term: este }, " ist der zuletzt Genannte, ", { term: aquel }, " der erste"], it: ["la vicinanza sceglie il referente: ", { term: este }, " è l’ultimo nominato e ", { term: aquel }, " il primo"], pl: ["bliskość wybiera odniesienie: ", { term: este }, " to ostatni wymieniony, a ", { term: aquel }, " – pierwszy"], tr: ["yakınlık göndergeyi belirler: ", { term: este }, " en son anılanı, ", { term: aquel }, " ilk anılanı gösterir"], id: ["kedekatan menentukan acuannya: ", { term: este }, " yang disebut terakhir dan ", { term: aquel }, " yang pertama"], vi: ["độ gần chọn đối tượng được nhắc đến: ", { term: este }, " là người nêu sau cùng, ", { term: aquel }, " là người nêu đầu tiên"] }
            ex: ["Hablé con Ana y con su hermano. ", { target: Este }, " me pareció amable y ", { target: aquella }, ", muy seria."]
            tr: { en: "I spoke with Ana and her brother. He seemed kind and she seemed very serious.", uk: "Я розмовляв з Аною та її братом. Він здався мені привітним, а вона — дуже серйозною.", pt: "Falei com a Ana e com o irmão dela. Ele me pareceu simpático, e ela, muito séria.", fr: "J’ai parlé avec Ana et avec son frère. Lui m’a paru aimable, et elle, très sérieuse.", de: "Ich habe mit Ana und ihrem Bruder gesprochen. Er kam mir freundlich vor, sie sehr ernst.", it: "Ho parlato con Ana e con suo fratello. Lui mi è sembrato gentile e lei molto seria.", pl: "Rozmawiałem z Aną i jej bratem. On wydał mi się miły, a ona bardzo poważna.", tr: "Ana ve erkek kardeşiyle konuştum. Erkek kardeşi bana nazik göründü, Ana ise çok ciddiydi.", id: "Saya berbicara dengan Ana dan kakaknya. Kakaknya tampak ramah, dan Ana sangat serius.", vi: "Tôi nói chuyện với Ana và anh trai cô ấy. Anh ấy có vẻ dễ mến, còn cô ấy rất nghiêm nghị." }
          - level: C1
            use: { es: [{ term: eso }, " y una oración de relativo: retoma una idea o un hecho"], en: [{ term: eso }, " and a relative clause: it picks up an idea or a fact"], uk: [{ term: eso }, " і означальне підрядне речення: повертається до думки чи факту"], pt: [{ term: eso }, " e uma oração relativa: retoma uma ideia ou um fato"], fr: [{ term: eso }, " et une proposition relative : reprend une idée ou un fait"], de: [{ term: eso }, " und ein Relativsatz: nimmt einen Gedanken oder eine Tatsache wieder auf"], it: [{ term: eso }, " e una proposizione relativa: riprende un’idea o un fatto"], pl: [{ term: eso }, " i zdanie względne: wraca do myśli lub faktu"], tr: [{ term: eso }, " ve bir ilgi cümlesi: bir düşünceyi ya da olguyu yeniden anar"], id: [{ term: eso }, " dan klausa relatif: merujuk kembali ke sebuah gagasan atau fakta"], vi: [{ term: eso }, " và mệnh đề quan hệ: nhắc lại một ý tưởng hoặc một sự việc"] }
            ex: [{ target: Eso }, " que propones es muy caro."]
            tr: { en: "What you're proposing is very expensive.", uk: "Те, що ти пропонуєш, дуже дороге.", pt: "Isso que você propõe é muito caro.", fr: "Ce que tu proposes est très cher.", de: "Das, was du vorschlägst, ist sehr teuer.", it: "Quello che proponi è molto caro.", pl: "To, co proponujesz, jest bardzo drogie.", tr: "Önerdiğin şey çok pahalı.", id: "Yang kamu usulkan itu sangat mahal.", vi: "Cái bạn đề xuất đắt lắm." }
          - level: C1
            use: { es: "una persona sin nombre, con tono despectivo o admirado", en: "a person with no name, in a scornful or admiring tone", uk: "людина без імені, з зневажливим або захопленим відтінком", pt: "uma pessoa sem nome, em tom depreciativo ou de admiração", fr: "une personne sans nom, sur un ton méprisant ou admiratif", de: "eine Person ohne Namen, in verächtlichem oder bewunderndem Ton", it: "una persona senza nome, con tono sprezzante o ammirato", pl: "osoba bez imienia, z odcieniem pogardy lub podziwu", tr: "adı söylenmeyen bir kişi; küçümseyici ya da hayran bir tonla", id: "orang yang tidak disebut namanya, dengan nada meremehkan atau kagum", vi: "một người không gọi tên, với giọng coi thường hoặc ngưỡng mộ" }
            ex: [{ target: Esa }, " siempre se cree la más lista."]
            tr: { en: "That one always thinks she's the cleverest.", uk: "Ця завжди думає, що вона найрозумніша.", pt: "Essa aí sempre se acha a mais esperta.", fr: "Celle-là se croit toujours la plus maligne.", de: "Die hält sich immer für die Klügste.", it: "Quella lì si crede sempre la più furba.", pl: "Ta zawsze myśli, że jest najmądrzejsza.", tr: "Şu hep kendini en akıllı sanıyor.", id: "Dia itu selalu merasa paling pintar.", vi: "Cô ta lúc nào cũng tưởng mình là người thông minh nhất." }
          - level: C1
            use: { es: "al final de la frase, el demostrativo con el nombre da un tono condescendiente", en: "at the end of a sentence, the demonstrative with the noun sounds condescending", uk: "наприкінці речення вказівний займенник з іменником надає поблажливого тону", pt: "no fim da frase, o demonstrativo com o substantivo dá um tom condescendente", fr: "en fin de phrase, le démonstratif avec le nom donne un ton condescendant", de: "Am Satzende gibt das Demonstrativpronomen mit dem Nomen einen herablassenden Ton", it: "a fine frase, il dimostrativo con il sostantivo dà un tono di condiscendenza", pl: "na końcu zdania zaimek wskazujący z rzeczownikiem nadaje protekcjonalny ton", tr: "tümcenin sonunda işaret sözcüğü isimle birlikte tepeden bakan bir ton verir", id: "di akhir kalimat, kata tunjuk bersama kata benda memberi nada merendahkan", vi: "ở cuối câu, từ chỉ định đi với danh từ tạo giọng bề trên" }
            ex: ["Siempre llega tarde, ", { target: este chico }, { gap: true }]
            tr: { en: "He always turns up late, that boy…", uk: "Він завжди запізнюється, цей хлопець…", pt: "Ele sempre chega atrasado, esse menino…", fr: "Il arrive toujours en retard, ce garçon…", de: "Er kommt immer zu spät, der Junge…", it: "Arriva sempre tardi, questo ragazzo…", pl: "Zawsze się spóźnia, ten chłopak…", tr: "Hep geç geliyor bu çocuk…", id: "Dia selalu terlambat, anak ini…", vi: "Cậu ta lúc nào cũng đến muộn, cái cậu này…" }
