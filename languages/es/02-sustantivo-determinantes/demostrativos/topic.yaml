          - level: A2
            use: { en: The present period, es: El periodo actual, uk: Теперішній період, pt: "O período atual", fr: "La période actuelle", de: "Der gegenwärtige Zeitraum", it: "Il periodo attuale", pl: "Obecny okres", tr: "İçinde bulunulan dönem", id: "Periode saat ini", vi: "Khoảng thời gian hiện tại" }
            ex: { examples: [[{ target: Esta }, " semana tengo exámenes."], [{ target: Este }, " año viajo a Perú."]] }
            tr: { en: { examples: [I have exams this week., "This year I'm travelling to Peru."] }, uk: { examples: [Цього тижня в мене іспити., Цього року я їду до Перу.] }, pt: { examples: ["Esta semana tenho provas.", "Este ano viajo para o Peru."] }, fr: { examples: ["Cette semaine, j’ai des examens.", "Cette année, je voyage au Pérou."] }, de: { examples: ["Diese Woche habe ich Prüfungen.", "Dieses Jahr reise ich nach Peru."] }, it: { examples: ["Questa settimana ho gli esami.", "Quest’anno viaggio in Perù."] }, pl: { examples: ["W tym tygodniu mam egzaminy.", "W tym roku jadę do Peru."] }, tr: { examples: ["Bu hafta sınavlarım var.", "Bu yıl Peru’ya gidiyorum."] }, id: { examples: ["Minggu ini saya ada ujian.", "Tahun ini saya pergi ke Peru."] }, vi: { examples: ["Tuần này tôi có các bài thi.", "Năm nay tôi đi du lịch Peru."] } }
          - { level: A2, use: { en: A time long ago, es: Un tiempo lejano, uk: Далекий час, pt: "Um tempo distante", fr: "Un temps éloigné", de: "Eine ferne Zeit", it: "Un tempo lontano", pl: "Odległy czas", tr: "Uzak bir zaman", id: "Waktu yang jauh", vi: "Thời gian xa xưa" }, ex: ["En ", { target: aquella }, " época vivíamos en Lima."], tr: { en: In those days we lived in Lima., uk: Тоді ми жили в Лімі., pt: "Naquela época morávamos em Lima.", fr: "À cette époque-là, nous vivions à Lima.", de: "Damals wohnten wir in Lima.", it: "In quel periodo vivevamo a Lima.", pl: "W tamtych czasach mieszkaliśmy w Limie.", tr: "O zamanlar Lima’da yaşıyorduk.", id: "Pada masa itu kami tinggal di Lima.", vi: "Hồi đó chúng tôi sống ở Lima." } }
      - type: list
