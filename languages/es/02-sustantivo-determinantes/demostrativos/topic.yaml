# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.sustantivo-determinantes.demostrativos
lang: es
kind: grammar
tags: [demonstratives, determiners, pronouns]
concepts: [demonstratives]
related: [es.sustantivo-determinantes.genero, es.sustantivo-determinantes.articulos, es.sustantivo-determinantes.posesivos, es.adjetivo-adverbio.adverbios]
status: { en: draft, es: draft, uk: draft }
translated: { en: "7299d6 ba6d57 9bbbe8 d76cb4 1867c0 d06cb8", uk: "7299d6 ba6d57 9bbbe8 d76cb4 1867c0 d06cb8" }

title: { en: "This, That, That Over There", es: Los demostrativos, uk: "Вказівні займенники: este, ese, aquel" }
summary:
  lead:
    en: [{ term: Este }, " points to things near me, ", { term: ese }, " to things near you, and ", { term: aquel }, " to things far from us both."]
    es: [{ term: Este }, " señala lo que está cerca de mí; ", { term: ese }, ", lo que está cerca de ti; y ", { term: aquel }, ", lo que está lejos de los dos."]
    uk: [{ term: Este }, " вказує на те, що біля мене, ", { term: ese }, " — на те, що біля тебе, а ", { term: aquel }, " — на те, що далеко від нас обох."]
  rule:
    en: "The demonstrative agrees with its noun in gender and number:"
    es: "El demostrativo concuerda con su sustantivo en género y número:"
    uk: "Вказівний займенник узгоджується з іменником у роді й числі:"
  ex: { examples: [[{ target: esta }, " casa"], [{ target: estos }, " zapatos"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A1
          point: { en: Near me, es: Cerca de mí, uk: Біля мене }
          rule: { alternatives: [{ term: este }, { term: esta }, { term: estos }, { term: estas }] }
          ex: [{ target: Este }, " libro es nuevo."]
          tr: { en: This book is new., uk: Ця книжка нова. }
        - level: A1
          point: { en: Near you, es: Cerca de ti, uk: Біля тебе }
          rule: { alternatives: [{ term: ese }, { term: esa }, { term: esos }, { term: esas }] }
          ex: ["¿Cuánto cuesta ", { target: esa }, " mochila?"]
          tr: { en: How much is that backpack?, uk: Скільки коштує той рюкзак? }
        - level: A1
          point: { en: Far from us both, es: Lejos de los dos, uk: Далеко від нас обох }
          rule: { alternatives: [{ term: aquel }, { term: aquella }, { term: aquellos }, { term: aquellas }] }
          ex: [{ target: Aquella }, " casa es de mi abuela."]
          tr: { en: "That house over there is my grandmother's.", uk: Он той будинок — моєї бабусі. }
        - level: A1
          point: { en: Agreement, es: Concordancia, uk: Узгодження }
          rule: { en: gender and number of the noun, es: género y número del sustantivo, uk: рід і число іменника }
          ex: ["Me gustan ", { target: estos }, " zapatos."]
          tr: { en: I like these shoes., uk: Мені подобаються ці черевики. }
        - level: A1
          point: { en: Alone, es: Solo, uk: Без іменника }
          rule: { en: "for a known noun, with no written accent", es: "en lugar de un sustantivo conocido, sin tilde", uk: "замість відомого іменника, без знака наголосу" }
          ex: ["No quiero este libro; quiero ", { target: ese }, "."]
          tr: { en: "I don't want this book; I want that one.", uk: "Я не хочу цю книжку; я хочу ту." }
        - level: A1
          point: { en: Neuter, es: Neutro, uk: Середній рід }
          rule: { en: [{ term: esto }, ", ", { term: eso }, ": a thing with no name yet"], es: [{ term: esto }, ", ", { term: eso }, ": una cosa sin nombrar"], uk: [{ term: esto }, ", ", { term: eso }, ": річ, яку ще не назвали"] }
          ex: ["¿Qué es ", { target: esto }, "?"]
          tr: { en: What is this?, uk: Що це? }
        - level: A2
          point: { en: What was said, es: Lo dicho, uk: Сказане }
          rule: { en: [{ term: eso }, " for what someone just said"], es: [{ term: eso }, " para lo que alguien acaba de decir"], uk: [{ term: eso }, " — про те, що хтось щойно сказав"] }
          ex: [{ target: Eso }, " es verdad."]
          tr: { en: "That's true.", uk: Це правда. }
        - level: A2
          point: { en: Time, es: Tiempo, uk: Час }
          rule: { en: ["the present period: ", { term: este año }], es: ["el periodo actual: ", { term: este año }], uk: ["теперішній період: ", { term: este año }] }
          ex: [{ target: Esta }, " semana tengo exámenes."]
          tr: { en: I have exams this week., uk: Цього тижня в мене іспити. }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: ["before a noun, ", { term: este }, ", never ", { term: esto }], es: ["delante de un sustantivo, ", { term: este }, " y nunca ", { term: esto }], uk: ["перед іменником — ", { term: este }, ", ніколи не ", { term: esto }] }
          ex: ["Quiero ", { target: este }, " pastel."]
          tr: { en: I want this cake., uk: Я хочу цей торт. }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule: { en: ["introducing a person: ", { alternatives: [{ term: este }, { term: esta }] }], es: ["para presentar a alguien: ", { alternatives: [{ term: este }, { term: esta }] }], uk: ["коли представляємо людину: ", { alternatives: [{ term: este }, { term: esta }] }] }
          ex: [{ target: Este }, " es mi hermano."]
          tr: { en: This is my brother., uk: Це мій брат. }

sections:
  - title: { en: "Form: three distances", es: "Forma: tres distancias", uk: "Форма: три відстані" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: distance, label: { en: Distance, es: Distancia, uk: Відстань } }
          - { key: sg, label: { en: Singular, es: Singular, uk: Однина }, features: { number: sg } }
          - { key: pl, label: { en: Plural, es: Plural, uk: Множина }, features: { number: pl } }
        rows:
          - { level: A1, features: { deixis: prox }, distance: { en: near me, es: cerca de mí, uk: біля мене }, sg: { alternatives: [{ target: este }, { target: esta }] }, pl: { alternatives: [{ target: estos }, { target: estas }] } }
          - { level: A1, distance: { en: near you, es: cerca de ti, uk: біля тебе }, sg: { alternatives: [{ target: ese }, { target: esa }] }, pl: { alternatives: [{ target: esos }, { target: esas }] } }
          - { level: A1, features: { deixis: dist }, distance: { en: far from us both, es: lejos de los dos, uk: далеко від нас обох }, sg: { alternatives: [{ target: aquel }, { target: aquella }] }, pl: { alternatives: [{ target: aquellos }, { target: aquellas }] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The demonstrative goes before the noun and agrees with it in gender and number:"
              es: "El demostrativo va delante del sustantivo y concuerda con él en género y número:"
              uk: "Вказівний займенник стоїть перед іменником і узгоджується з ним у роді й числі:"
            ex: ["Me gustan ", { target: estas }, " camisas."]
            tr: { en: I like these shirts., uk: Мені подобаються ці сорочки. }
          - type: rule
            level: A1
            text:
              en: ["The masculine singular ends in -e: ", { term: este }, ", ", { term: ese }, "."]
              es: ["El masculino singular termina en -e: ", { term: este }, ", ", { term: ese }, "."]
              uk: ["Форма чоловічого роду однини закінчується на -e: ", { term: este }, ", ", { term: ese }, "."]
          - type: rule
            level: A1
            text:
              en: ["The masculine singular of the far form ends in -l: ", { term: aquel }, "."]
              es: ["El masculino singular de la forma lejana termina en -l: ", { term: aquel }, "."]
              uk: ["Дальня форма чоловічого роду однини закінчується на -l: ", { term: aquel }, "."]
          - type: rule
            level: A1
            text:
              en: "Alone, the demonstrative takes the place of a known noun and has no written accent:"
              es: "Solo, el demostrativo ocupa el lugar de un sustantivo conocido y no lleva tilde:"
              uk: "Без іменника вказівний займенник заступає відомий іменник і пишеться без знака наголосу:"
            ex: ["No quiero este libro; quiero ", { target: ese }, "."]
            tr: { en: "I don't want this book; I want that one.", uk: "Я не хочу цю книжку; я хочу ту." }
          - type: rule
            level: A1
            text:
              en: "Introducing a person, the demonstrative takes the person’s gender:"
              es: "Para presentar a una persona se usa el demostrativo de su género:"
              uk: "Коли представляємо людину, вказівний займенник має її рід:"
            ex: [{ target: Esta }, " es mi amiga Lucía."]
            tr: { en: This is my friend Lucía., uk: Це моя подруга Лусія. }
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "В українській дві відстані, «цей» і «той», а в іспанській три: este — біля мене, ese — біля тебе, aquel — далеко від нас обох. А українське «це» перед людиною іспанською — este або esta, а не esto."

  - title: { en: "Neuter: esto, eso, aquello", es: "Neutro: esto, eso, aquello", uk: "Середній рід: esto, eso, aquello" }
    role: own
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form, es: Forma, uk: Форма } }
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, features: { deixis: prox }, form: esto, use: { en: a thing near me with no name yet, es: "una cosa cerca de mí, sin nombrar", uk: "річ біля мене, яку ще не назвали" }, ex: ["¿Qué es ", { target: esto }, "?"], tr: { en: What is this?, uk: Що це? } }
          - { level: A1, form: eso, use: { en: a thing near you with no name yet, es: "una cosa cerca de ti, sin nombrar", uk: "річ біля тебе, яку ще не назвали" }, ex: ["¿Qué es ", { target: eso }, "?"], tr: { en: What is that?, uk: Що це таке? } }
          - { level: A2, form: eso, use: { en: what someone just said or did, es: lo que alguien acaba de decir o hacer, uk: "те, що хтось щойно сказав або зробив" }, ex: [{ target: Eso }, " es verdad."], tr: { en: "That's true.", uk: Це правда. } }
          - { level: A1, features: { deixis: dist }, form: aquello, use: { en: a thing far from us both, es: una cosa lejos de los dos, uk: річ далеко від нас обох }, ex: ["¿Qué es ", { target: aquello }, "?"], tr: { en: What is that over there?, uk: Що то там таке? } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The neuter forms never go before a noun and have no plural."
              es: "Las formas neutras nunca van delante de un sustantivo y no tienen plural."
              uk: "Форми середнього роду ніколи не стоять перед іменником і не мають множини."

  - title: { en: "Use: place and time", es: "Uso: lugar y tiempo", uk: "Вживання: місце і час" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A1, use: { en: Near the speaker, es: Cerca del que habla, uk: "Біля того, хто говорить" }, ex: [{ target: Esta }, " silla está libre."], tr: { en: This chair is free., uk: Цей стілець вільний. } }
          - { level: A1, use: { en: Near the listener, es: Cerca del que escucha, uk: "Біля того, хто слухає" }, ex: ["¿Cuánto cuesta ", { target: esa }, " mochila?"], tr: { en: How much is that backpack?, uk: Скільки коштує той рюкзак? } }
          - { level: A1, use: { en: Far from both, es: Lejos de los dos, uk: Далеко від обох }, ex: [{ target: Aquella }, " casa es de mi abuela."], tr: { en: "That house over there is my grandmother's.", uk: Он той будинок — моєї бабусі. } }
          - level: A2
            use: { en: The present period, es: El periodo actual, uk: Теперішній період }
            ex: { examples: [[{ target: Esta }, " semana tengo exámenes."], [{ target: Este }, " año viajo a Perú."]] }
            tr: { en: { examples: [I have exams this week., "This year I'm travelling to Peru."] }, uk: { examples: [Цього тижня в мене іспити., Цього року я їду до Перу.] } }
          - { level: A2, use: { en: A time long ago, es: Un tiempo lejano, uk: Далекий час }, ex: ["En ", { target: aquella }, " época vivíamos en Lima."], tr: { en: In those days we lived in Lima., uk: Тоді ми жили в Лімі. } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The place adverbs match the three distances: ", { term: aquí }, " with ", { term: este }, ", ", { term: ahí }, " with ", { term: ese }, ", ", { term: allí }, " with ", { term: aquel }, "."]
              es: ["Los adverbios de lugar siguen las tres distancias: ", { term: aquí }, " con ", { term: este }, ", ", { term: ahí }, " con ", { term: ese }, ", ", { term: allí }, " con ", { term: aquel }, "."]
              uk: ["Прислівники місця відповідають трьом відстаням: ", { term: aquí }, " — з ", { term: este }, ", ", { term: ahí }, " — з ", { term: ese }, ", ", { term: allí }, " — з ", { term: aquel }, "."]
            ex: [{ target: Aquel }, " edificio de ", { target: allí }, " es el hospital."]
            tr: { en: That building over there is the hospital., uk: Он та будівля — лікарня. }
          - type: note
            level: A2
            variety: es-419
            text:
              en: ["In Latin America, above all in Mexico and the Southern Cone, ", { term: acá }, " and ", { term: allá }, " are very frequent beside ", { term: aquí }, " and ", { term: allí }, ":"]
              es: ["En Latinoamérica, sobre todo en México y el Cono Sur, ", { term: acá }, " y ", { term: allá }, " son muy frecuentes junto a ", { term: aquí }, " y ", { term: allí }, ":"]
              uk: ["У Латинській Америці, особливо в Мексиці та країнах Південного конуса, поряд з ", { term: aquí }, " і ", { term: allí }, " дуже часто вживають ", { term: acá }, " і ", { term: allá }, ":"]
            ex: ["Ven ", { target: acá }, "."]
            tr: { en: Come here., uk: Іди сюди. }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: esto libro, right: [{ target: este }, " libro"], rule: { en: ["before a noun, ", { term: este }], es: ["delante de un sustantivo, ", { term: este }], uk: ["перед іменником — ", { term: este }] } }
          - { level: A1, wrong: estes libros, right: [{ target: estos }, " libros"], rule: { en: { mapping: [{ term: este }, { term: estos }] }, es: { mapping: [{ term: este }, { term: estos }] }, uk: { mapping: [{ term: este }, { term: estos }] } } }
          - { level: A1, wrong: ¿Qué es este?, right: ["¿Qué es ", { target: esto }, "?"], rule: { en: ["a thing with no name yet takes ", { term: esto }], es: ["una cosa sin nombrar lleva ", { term: esto }], uk: ["річ, яку ще не назвали, — ", { term: esto }] } }
          - { level: A1, wrong: Esto es mi hermano., right: [{ target: Este }, " es mi hermano."], rule: { en: ["a person takes ", { term: este }, " or ", { term: esta }], es: ["una persona lleva ", { term: este }, " o ", { term: esta }], uk: ["про людину — ", { term: este }, " або ", { term: esta }] } }
          - { level: A2, wrong: esta problema, right: [{ target: este }, " problema"], rule: { en: [{ term: problema }, " is masculine"], es: [{ term: problema }, " es masculino"], uk: [{ term: problema }, " — чоловічого роду"] } }
          - { level: A1, wrong: aquello casa, right: [{ target: aquella }, " casa"], rule: { en: ["before a feminine noun, ", { term: aquella }], es: ["delante de un femenino, ", { term: aquella }], uk: ["перед іменником жіночого роду — ", { term: aquella }] } }
          - { level: A1, speakers: [uk], wrong: Esto es mi madre., right: [{ target: Esta }, " es mi madre."], rule: { uk: ["українське «це» не змінюється, а іспанське змінюється за родом людини: ", { term: esta }, " про жінку"] } }
