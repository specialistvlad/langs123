title: { en: "This, That, That Over There", es: Los demostrativos, uk: "Вказівні займенники: este, ese, aquel", pt: "Os demonstrativos", fr: "Les démonstratifs", de: "Die Demonstrativpronomen", it: "I dimostrativi", pl: "Zaimki wskazujące", tr: "İşaret sözcükleri", id: "Kata tunjuk", vi: "Từ chỉ định" }
summary:
  lead:
    en: [{ term: Este }, " points to things near me, ", { term: ese }, " to things near you, and ", { term: aquel }, " to things far from us both."]
    es: [{ term: Este }, " señala lo que está cerca de mí; ", { term: ese }, ", lo que está cerca de ti; y ", { term: aquel }, ", lo que está lejos de los dos."]
    uk: [{ term: Este }, " вказує на те, що біля мене, ", { term: ese }, " — на те, що біля тебе, а ", { term: aquel }, " — на те, що далеко від нас обох."]
    pt: [{ term: Este }, " indica o que está perto de mim; ", { term: ese }, ", o que está perto de você; e ", { term: aquel }, ", o que está longe dos dois."]
    fr: [{ term: Este }, " désigne ce qui est près de moi ; ", { term: ese }, ", ce qui est près de toi ; et ", { term: aquel }, ", ce qui est loin de nous deux."]
    de: [{ term: Este }, " zeigt auf das, was nahe bei mir ist; ", { term: ese }, " auf das, was nahe bei dir ist; ", { term: aquel }, " auf das, was von uns beiden weit weg ist."]
    it: [{ term: Este }, " indica ciò che è vicino a me; ", { term: ese }, ", ciò che è vicino a te; e ", { term: aquel }, ", ciò che è lontano da tutti e due."]
    pl: [{ term: Este }, " wskazuje to, co jest blisko mnie; ", { term: ese }, " – to, co jest blisko ciebie; a ", { term: aquel }, " – to, co jest daleko od nas obojga."]
    tr: [{ term: Este }, " bana yakın olanı, ", { term: ese }, " sana yakın olanı, ", { term: aquel }, " ise ikimizden de uzak olanı gösterir."]
    id: [{ term: Este }, " menunjuk benda yang dekat dengan saya; ", { term: ese }, " yang dekat dengan kamu; dan ", { term: aquel }, " yang jauh dari kita berdua."]
    vi: [{ term: Este }, " chỉ vật ở gần tôi; ", { term: ese }, " chỉ vật ở gần bạn; còn ", { term: aquel }, " chỉ vật ở xa cả hai chúng ta."]
  rule:
    en: "The demonstrative agrees with its noun in gender and number:"
    es: "El demostrativo concuerda con su sustantivo en género y número:"
    uk: "Вказівний займенник узгоджується з іменником у роді й числі:"
    pt: "O demonstrativo concorda com o substantivo em gênero e número:"
    fr: "Le démonstratif s’accorde avec son nom en genre et en nombre :"
    de: "Das Demonstrativpronomen richtet sich in Genus und Numerus nach seinem Nomen:"
    it: "Il dimostrativo concorda con il sostantivo in genere e numero:"
    pl: "Zaimek wskazujący zgadza się z rzeczownikiem w rodzaju i liczbie:"
    tr: "İşaret sözcüğü, ismin cinsiyetine ve sayısına uyar:"
    id: "Kata tunjuk menyesuaikan diri dengan kata bendanya dalam gender dan jumlah:"
    vi: "Từ chỉ định hòa hợp với danh từ về giống và số:"
  ex: { examples: [[{ target: esta }, " casa"], [{ target: estos }, " zapatos"]] }

