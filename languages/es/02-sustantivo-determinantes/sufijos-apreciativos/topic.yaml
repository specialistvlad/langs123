            en: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " and ", { term: "-ote" }, " give a contemptuous sense"]
            uk: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " і ", { term: "-ote" }, " надають зневажливого відтінку"]
            pt: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " e ", { term: "-ote" }, " dão valor depreciativo"]
            fr: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " et ", { term: "-ote" }, " donnent une valeur péjorative"]
            de: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " und ", { term: "-ote" }, " verleihen einen abwertenden Sinn"]
            it: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " e ", { term: "-ote" }, " danno un valore spregiativo"]
            pl: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " i ", { term: "-ote" }, " nadają znaczenie pogardliwe"]
            tr: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " ve ", { term: "-ote" }, " küçümseme anlamı katar"]
            id: [{ term: "-ucho" }, ", ", { term: "-ajo" }, ", dan ", { term: "-ote" }, " memberi nilai merendahkan"]
            vi: [{ term: "-ucho" }, ", ", { term: "-ajo" }, " và ", { term: "-ote" }, " mang sắc thái khinh miệt"]
          ex: { examples: [["una ", { target: casucha }], ["un ", { target: latinajo }]] }
          tr: { en: { examples: ["a shack", "a scrap of Latin"] }, uk: { examples: ["халупа", "напускна латина"] }, pt: { examples: ["um casebre", "um latinório"] }, fr: { examples: ["une bicoque", "du latin de cuisine"] }, de: { examples: ["eine Bruchbude", "ein Brocken Küchenlatein"] }, it: { examples: ["una casupola", "un latinorum"] }, pl: { examples: ["rudera", "łacina kuchenna"] }, tr: { examples: ["derme çatma bir kulübe", "bozuk bir Latince söz"] }, id: { examples: ["gubuk reyot", "kutipan Latin yang buruk"] }, vi: { examples: ["căn nhà tồi tàn", "câu tiếng Latinh dở"] } }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            es: [{ term: sillón }, " es masculino aunque viene de ", { term: silla }]
            en: [{ term: sillón }, " is masculine although it comes from ", { term: silla }]
            uk: [{ term: sillón }, " — чоловічого роду, хоча походить від ", { term: silla }]
            pt: [{ term: sillón }, " é masculino, embora venha de ", { term: silla }]
            fr: [{ term: sillón }, " est masculin, bien qu’il vienne de ", { term: silla }]
            de: [{ term: sillón }, " ist maskulin, obwohl es von ", { term: silla }, " kommt"]
            it: [{ term: sillón }, " è maschile, anche se deriva da ", { term: silla }]
            pl: [{ term: sillón }, " jest rodzaju męskiego, chociaż pochodzi od ", { term: silla }]
            tr: [{ term: sillón }, " eril bir isimdir, ", { term: silla }, " sözcüğünden türese de"]
            id: [{ term: sillón }, " berjenis maskulin meskipun berasal dari ", { term: silla }]
            vi: [{ term: sillón }, " là danh từ giống đực dù bắt nguồn từ ", { term: silla }]
          ex: ["Me siento en el ", { target: sillón }, " de la sala."]
          tr: { en: "I sit down in the armchair in the living room.", uk: "Я сідаю в крісло у вітальні.", pt: "Eu me sento na poltrona da sala.", fr: "Je m’assois dans le fauteuil du salon.", de: "Ich setze mich in den Sessel im Wohnzimmer.", it: "Mi siedo sulla poltrona del salotto.", pl: "Siadam w fotelu w salonie.", tr: "Oturma odasındaki koltuğa oturuyorum.", id: "Saya duduk di kursi besar di ruang tamu.", vi: "Tôi ngồi xuống chiếc ghế bành trong phòng khách." }
        - level: C1
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            es: [{ letter: c }, " pasa a ", { letter: qu }, " también en los adverbios"]
            en: [{ letter: c }, " becomes ", { letter: qu }, " in adverbs too"]
            uk: [{ letter: c }, " змінюється на ", { letter: qu }, " і в прислівниках"]
