            vi: [{ term: "-ito" }, " cũng được dùng với trạng từ, gerundio và tên riêng"]
          ex: { examples: [{ mapping: [ahora, { target: ahorita }] }, { mapping: [callando, { target: callandito }] }] }
          tr: { en: { examples: ["right now", "quietly"] }, uk: { examples: ["прямо зараз", "тихесенько"] }, pt: { examples: ["agorinha", "caladinho"] }, fr: { examples: ["tout de suite", "bien tranquillement"] }, de: { examples: ["jetzt gleich", "ganz still"] }, it: { examples: ["adesso", "zitto zitto"] }, pl: { examples: ["od razu", "cichutko"] }, tr: { examples: ["hemen şimdi", "sessizce"] }, id: { examples: ["sekarang juga", "diam-diam"] }, vi: { examples: ["ngay bây giờ", "lặng lẽ"] } }
        - level: C1
          point: { es: Despectivos, en: "Contemptuous forms", uk: "Зневажливі форми", pt: "Depreciativos", fr: "Péjoratifs", de: "Abwertende Formen", it: "Spregiativi", pl: "Formy pogardliwe", tr: "Küçümseme ekleri", id: "Bentuk merendahkan", vi: "Dạng khinh miệt" }
          rule:
