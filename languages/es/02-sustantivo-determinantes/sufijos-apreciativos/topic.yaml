title: { es: "Diminutivos y aumentativos: -ito, -illo, -ón", en: "Diminutives and Augmentatives: -ito, -illo, -ón", uk: "Зменшувальні та збільшувальні форми: -ito, -illo, -ón", pt: "Diminutivos e aumentativos: -ito, -illo, -ón", fr: "Diminutifs et augmentatifs : -ito, -illo, -ón", de: "Verkleinerung und Vergrößerung: -ito, -illo, -ón", it: "Diminutivi e accrescitivi: -ito, -illo, -ón", pl: "Zdrobnienia i zgrubienia: -ito, -illo, -ón", tr: "Küçültme ve büyütme: -ito, -illo, -ón", id: "Diminutif dan augmentatif: -ito, -illo, -ón", vi: "Dạng chỉ sự nhỏ bé và to lớn: -ito, -illo, -ón" }
summary:
  lead:
    es: ["Los diminutivos -ito e -illo y los aumentativos -ón, -ote y -azo dan a la palabra tamaño, afecto o desprecio: ", { term: casita }, ", ", { term: grandón }, "."]
    en: ["The diminutives -ito and -illo and the augmentatives -ón, -ote and -azo give a word size, affection or contempt: ", { term: casita }, ", ", { term: grandón }, "."]
    uk: ["Зменшувальні суфікси -ito й -illo та збільшувальні -ón, -ote й -azo додають слову розмір, ніжність або зневагу: ", { term: casita }, ", ", { term: grandón }, "."]
    pt: ["Os diminutivos -ito e -illo e os aumentativos -ón, -ote e -azo dão à palavra tamanho, afeto ou desprezo: ", { term: casita }, ", ", { term: grandón }, "."]
    fr: ["Les diminutifs -ito et -illo et les augmentatifs -ón, -ote et -azo donnent au mot une taille, de l’affection ou du mépris : ", { term: casita }, ", ", { term: grandón }, "."]
    de: ["Die Suffixe -ito und -illo (Verkleinerung) sowie -ón, -ote und -azo (Vergrößerung) verleihen dem Wort Größe, Zuneigung oder Verachtung: ", { term: casita }, ", ", { term: grandón }, "."]
    it: ["I diminutivi -ito e -illo e gli accrescitivi -ón, -ote e -azo danno alla parola dimensione, affetto o disprezzo: ", { term: casita }, ", ", { term: grandón }, "."]
    pl: ["Zdrobnienia -ito i -illo oraz zgrubienia -ón, -ote i -azo nadają wyrazowi rozmiar, czułość lub pogardę: ", { term: casita }, ", ", { term: grandón }, "."]
    tr: ["Küçültme ekleri -ito ve -illo ile büyütme ekleri -ón, -ote ve -azo sözcüğe boyut, sevgi ya da küçümseme katar: ", { term: casita }, ", ", { term: grandón }, "."]
    id: ["Diminutif -ito dan -illo serta augmentatif -ón, -ote, dan -azo memberi kata ukuran, kasih sayang, atau sikap meremehkan: ", { term: casita }, ", ", { term: grandón }, "."]
    vi: ["Các hậu tố -ito, -illo (nhỏ) và -ón, -ote, -azo (lớn) cho từ kích thước, tình cảm hoặc sự khinh miệt: ", { term: casita }, ", ", { term: grandón }, "."]
  rule:
    es: ["El diminutivo sustituye la vocal final por ", { term: "-ito" }, ", y detrás de -e, -n o -r añade ", { term: "-cito" }, ":"]
    en: ["The diminutive replaces the final vowel with ", { term: "-ito" }, ", and after -e, -n or -r it adds ", { term: "-cito" }, ":"]
    uk: ["Зменшувальна форма замінює кінцевий голосний на ", { term: "-ito" }, ", а після -e, -n чи -r додає ", { term: "-cito" }, ":"]
    pt: ["O diminutivo substitui a vogal final por ", { term: "-ito" }, ", e depois de -e, -n ou -r acrescenta ", { term: "-cito" }, ":"]
    fr: ["Le diminutif remplace la voyelle finale par ", { term: "-ito" }, ", et après -e, -n ou -r il ajoute ", { term: "-cito" }, " :"]
    de: ["Das Diminutiv ersetzt den Endvokal durch ", { term: "-ito" }, ", und nach -e, -n oder -r hängt es ", { term: "-cito" }, " an:"]
    it: ["Il diminutivo sostituisce la vocale finale con ", { term: "-ito" }, ", e dopo -e, -n o -r aggiunge ", { term: "-cito" }, ":"]
    pl: ["Zdrobnienie zastępuje końcową samogłoskę przez ", { term: "-ito" }, ", a po -e, -n lub -r dodaje ", { term: "-cito" }, ":"]
    tr: ["Küçültme, son ünlünün yerine ", { term: "-ito" }, " getirir; -e, -n ya da -r’den sonra ", { term: "-cito" }, " ekler:"]
    id: ["Diminutif mengganti vokal akhir dengan ", { term: "-ito" }, ", dan setelah -e, -n, atau -r menambahkan ", { term: "-cito" }, ":"]
    vi: ["Dạng nhỏ thay nguyên âm cuối bằng ", { term: "-ito" }, ", còn sau -e, -n, -r thì thêm ", { term: "-cito" }, ":"]
  ex: { examples: [{ mapping: [casa, { target: casita }] }, { mapping: [joven, { target: jovencito }] }] }

