            fr: [{ letter: c }, " devient ", { letter: qu }, " aussi dans les adverbes"]
            de: [{ letter: c }, " wird auch in Adverbien zu ", { letter: qu }]
            it: [{ letter: c }, " diventa ", { letter: qu }, " anche negli avverbi"]
            pl: [{ letter: c }, " zmienia się w ", { letter: qu }, " także w przysłówkach"]
            tr: [{ letter: c }, " harfi, zarflarda da ", { letter: qu }, " olur"]
            id: [{ letter: c }, " menjadi ", { letter: qu }, " juga pada adverbia"]
            vi: [{ letter: c }, " đổi thành ", { letter: qu }, " cả ở trạng từ"]
          ex: ["Vivo ", { target: cerquita }, " de aquí."]
          tr: { en: "I live very close to here.", uk: "Я живу зовсім поруч звідси.", pt: "Moro pertinho daqui.", fr: "J’habite tout près d’ici.", de: "Ich wohne ganz in der Nähe.", it: "Abito proprio qui vicino.", pl: "Mieszkam całkiem blisko stąd.", tr: "Buraya çok yakın oturuyorum.", id: "Saya tinggal dekat sekali dari sini.", vi: "Tôi sống rất gần đây." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "El sufijo apreciativo se añade a la raíz y da a la palabra tamaño, afecto o desprecio:"
              en: "An evaluative suffix is added to the stem and gives the word size, affection or contempt:"
              uk: "Оцінний суфікс додається до основи й надає слову розмір, ніжність або зневагу:"
              pt: "O sufixo avaliativo se junta ao radical e dá à palavra tamanho, afeto ou desprezo:"
              fr: "Le suffixe appréciatif s’ajoute au radical et donne au mot une taille, de l’affection ou du mépris :"
              de: "Das wertende Suffix tritt an den Stamm und verleiht dem Wort Größe, Zuneigung oder Verachtung:"
              it: "Il suffisso valutativo si aggiunge alla radice e dà alla parola dimensione, affetto o disprezzo:"
              pl: "Przyrostek wartościujący dodaje się do tematu i nadaje wyrazowi rozmiar, czułość lub pogardę:"
              tr: "Değer bildiren sonek köke eklenir ve sözcüğe boyut, sevgi ya da küçümseme katar:"
              id: "Sufiks evaluatif ditambahkan pada bentuk dasar dan memberi kata ukuran, kasih sayang, atau sikap meremehkan:"
              vi: "Hậu tố biểu cảm được thêm vào gốc từ và cho từ kích thước, sự trìu mến hoặc sự khinh miệt:"
            ex: { examples: [["un ", { target: perrito }], ["un ", { target: perrazo }]] }
            tr: { en: { examples: ["a little dog", "a big dog"] }, uk: { examples: ["песик", "здоровенний пес"] }, pt: { examples: ["um cachorrinho", "um cachorrão"] }, fr: { examples: ["un petit chien", "un gros chien"] }, de: { examples: ["ein Hündchen", "ein großer Hund"] }, it: { examples: ["un cagnolino", "un cagnone"] }, pl: { examples: ["piesek", "wielki pies"] }, tr: { examples: ["küçük bir köpek", "kocaman bir köpek"] }, id: { examples: ["anjing kecil", "anjing besar"] }, vi: { examples: ["một chú chó nhỏ", "một con chó to"] } }
          - type: note
            level: B2
            text:
              es: ["La palabra con sufijo forma el plural como las demás: ver ", { link: El plural, to: es.sustantivo-determinantes.plural }, "."]
              en: ["A word with a suffix forms its plural like any other: see ", { link: "Plurals", to: es.sustantivo-determinantes.plural }, "."]
              uk: ["Слово із суфіксом утворює множину, як і решта слів: див. ", { link: "Множина", to: es.sustantivo-determinantes.plural }, "."]
              pt: ["A palavra com sufixo forma o plural como as demais: veja ", { link: "O plural", to: es.sustantivo-determinantes.plural }, "."]
              fr: ["Un mot avec suffixe forme son pluriel comme les autres : voir ", { link: "Le pluriel", to: es.sustantivo-determinantes.plural }, "."]
              de: ["Ein Wort mit Suffix bildet den Plural wie alle anderen: siehe ", { link: "Der Plural", to: es.sustantivo-determinantes.plural }, "."]
              it: ["La parola con suffisso forma il plurale come le altre: vedi ", { link: "Il plurale", to: es.sustantivo-determinantes.plural }, "."]
              pl: ["Wyraz z przyrostkiem tworzy liczbę mnogą jak inne wyrazy: zob. ", { link: "Liczba mnoga", to: es.sustantivo-determinantes.plural }, "."]
              tr: ["Ekli sözcük çoğulu diğer sözcükler gibi yapar: bkz. ", { link: "Çoğul", to: es.sustantivo-determinantes.plural }, "."]
              id: ["Kata bersufiks membentuk jamak seperti kata lain: lihat ", { link: "Bentuk jamak", to: es.sustantivo-determinantes.plural }, "."]
              vi: ["Từ có hậu tố tạo số nhiều như các từ khác: xem ", { link: "Số nhiều", to: es.sustantivo-determinantes.plural }, "."]
          - type: note
            level: B2
            text:
              es: ["El sufijo ", { term: "-ísimo" }, ", que da el superlativo, se explica en ", { link: Comparativos y superlativos, to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              en: ["The suffix ", { term: "-ísimo" }, ", which forms the superlative, is explained in ", { link: "Comparatives and Superlatives", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              uk: ["Суфікс ", { term: "-ísimo" }, ", що утворює найвищий ступінь, розглянуто в темі ", { link: "Вищий і найвищий ступені порівняння", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              pt: ["O sufixo ", { term: "-ísimo" }, ", que dá o superlativo, é explicado em ", { link: "Comparativos e superlativos", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              fr: ["Le suffixe ", { term: "-ísimo" }, ", qui donne le superlatif, est expliqué dans ", { link: "Comparatifs et superlatifs", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              de: ["Das Suffix ", { term: "-ísimo" }, ", das den Superlativ bildet, wird unter ", { link: "Komparativ und Superlativ", to: es.adjetivo-adverbio.comparativos-superlativos }, " erklärt."]
              it: ["Il suffisso ", { term: "-ísimo" }, ", che dà il superlativo, è spiegato in ", { link: "Comparativi e superlativi", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              pl: ["Przyrostek ", { term: "-ísimo" }, ", który tworzy stopień najwyższy, omówiono w temacie ", { link: "Stopniowanie przymiotników", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              tr: ["Üstünlük derecesini veren ", { term: "-ísimo" }, " eki ", { link: "Karşılaştırma ve üstünlük dereceleri", to: es.adjetivo-adverbio.comparativos-superlativos }, " konusunda açıklanır."]
              id: ["Sufiks ", { term: "-ísimo" }, ", yang membentuk superlatif, dijelaskan di ", { link: "Komparatif dan superlatif", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]
              vi: ["Hậu tố ", { term: "-ísimo" }, ", dùng để tạo so sánh nhất, được giải thích trong ", { link: "So sánh hơn và so sánh nhất", to: es.adjetivo-adverbio.comparativos-superlativos }, "."]

  - title: { es: "Forma: diminutivos y aumentativos", en: "Form: diminutives and augmentatives", uk: "Форма: зменшувальні та збільшувальні суфікси", pt: "Forma: diminutivos e aumentativos", fr: "Forme : diminutifs et augmentatifs", de: "Form: Verkleinerung und Vergrößerung", it: "Forma: diminutivi e accrescitivi", pl: "Forma: zdrobnienia i zgrubienia", tr: "Biçim: küçültme ve büyütme", id: "Bentuk: diminutif dan augmentatif", vi: "Dạng: chỉ sự nhỏ bé và to lớn" }
    role: form
    content:
      - type: usage
        columns:
          - { key: suffix, label: { es: Sufijo, en: "Suffix", uk: "Суфікс", pt: "Sufixo", fr: "Suffixe", de: "Suffix", it: "Suffisso", pl: "Przyrostek", tr: "Sonek", id: "Sufiks", vi: "Hậu tố" } }
          - { key: rule, label: { es: Formación, en: "Formation", uk: "Утворення", pt: "Formação", fr: "Formation", de: "Bildung", it: "Formazione", pl: "Tworzenie", tr: "Oluşum", id: "Pembentukan", vi: "Cách tạo" } }
          - { key: ex, label: { es: Ejemplos, en: "Examples", uk: "Приклади", pt: "Exemplos", fr: "Exemples", de: "Beispiele", it: "Esempi", pl: "Przykłady", tr: "Örnekler", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            suffix: { alternatives: [{ term: "-ito" }, { term: "-ita" }] }
            rule:
              es: "sustituyen la vocal final; detrás de otra consonante se añaden a la palabra"
              en: "replace the final vowel; after another consonant they are added to the word"
              uk: "замінюють кінцевий голосний; після іншого приголосного додаються до слова"
              pt: "substituem a vogal final; depois de outra consoante, acrescentam-se à palavra"
              fr: "remplacent la voyelle finale ; après une autre consonne, ils s’ajoutent au mot"
              de: "ersetzen den Endvokal; nach einem anderen Konsonanten werden sie an das Wort angehängt"
              it: "sostituiscono la vocale finale; dopo un'altra consonante si aggiungono alla parola"
              pl: "zastępują końcową samogłoskę; po innej spółgłosce dodaje się je do wyrazu"
              tr: "son ünlünün yerine gelir; başka bir ünsüzden sonra sözcüğe eklenir"
              id: "mengganti vokal akhir; setelah konsonan lain ditambahkan pada kata"
              vi: "thay nguyên âm cuối; sau phụ âm khác thì thêm vào từ"
            ex: { examples: [{ mapping: [casa, { target: casita }] }, { mapping: [libro, { target: librito }] }, { mapping: [papel, { target: papelito }] }] }
            tr: { en: { examples: ["little house", "little book", "slip of paper"] }, uk: { examples: ["будиночок", "книжечка", "папірець"] }, pt: { examples: ["casinha", "livrinho", "papelzinho"] }, fr: { examples: ["petite maison", "petit livre", "petit papier"] }, de: { examples: ["Häuschen", "Büchlein", "Zettelchen"] }, it: { examples: ["casetta", "libretto", "foglietto"] }, pl: { examples: ["domek", "książeczka", "karteczka"] }, tr: { examples: ["küçük ev", "küçük kitap", "küçük kâğıt"] }, id: { examples: ["rumah kecil", "buku kecil", "kertas kecil"] }, vi: { examples: ["ngôi nhà nhỏ", "quyển sách nhỏ", "mảnh giấy nhỏ"] } }
          - level: B2
            suffix: { alternatives: [{ term: "-illo" }, { term: "-illa" }] }
            rule:
              es: ["se forman como ", { term: "-ito" }, " e ", { term: "-ita" }]
              en: ["formed like ", { term: "-ito" }, " and ", { term: "-ita" }]
              uk: ["утворюються так само, як ", { term: "-ito" }, " та ", { term: "-ita" }]
              pt: ["formam-se como ", { term: "-ito" }, " e ", { term: "-ita" }]
              fr: ["se forment comme ", { term: "-ito" }, " et ", { term: "-ita" }]
              de: ["werden wie ", { term: "-ito" }, " und ", { term: "-ita" }, " gebildet"]
              it: ["si formano come ", { term: "-ito" }, " e ", { term: "-ita" }]
              pl: ["tworzy się je tak jak ", { term: "-ito" }, " i ", { term: "-ita" }]
              tr: [{ term: "-ito" }, " ve ", { term: "-ita" }, " gibi yapılır"]
              id: ["dibentuk seperti ", { term: "-ito" }, " dan ", { term: "-ita" }]
              vi: ["được tạo như ", { term: "-ito" }, " và ", { term: "-ita" }]
            ex: { examples: [{ mapping: [pájaro, { target: pajarillo }] }, { mapping: [mesa, { target: mesilla }] }] }
            tr: { en: { examples: ["little bird", "small table"] }, uk: { examples: ["пташка", "столик"] }, pt: { examples: ["passarinho", "mesinha"] }, fr: { examples: ["petit oiseau", "petite table"] }, de: { examples: ["Vögelchen", "Tischchen"] }, it: { examples: ["uccellino", "tavolino"] }, pl: { examples: ["ptaszek", "stoliczek"] }, tr: { examples: ["küçük kuş", "küçük masa"] }, id: { examples: ["burung kecil", "meja kecil"] }, vi: { examples: ["chú chim nhỏ", "chiếc bàn nhỏ"] } }
          - level: B2
            suffix: { alternatives: [{ term: "-cito" }, { term: "-cita" }] }
            rule:
              es: "detrás de -e, -n o -r se añaden a la palabra entera"
              en: "after -e, -n or -r they are added to the whole word"
              uk: "після -e, -n або -r додаються до цілого слова"
              pt: "depois de -e, -n ou -r, acrescentam-se à palavra inteira"
              fr: "après -e, -n ou -r, ils s’ajoutent au mot entier"
              de: "nach -e, -n oder -r werden sie an das ganze Wort angehängt"
              it: "dopo -e, -n o -r si aggiungono alla parola intera"
              pl: "po -e, -n lub -r dodaje się je do całego wyrazu"
              tr: "-e, -n ya da -r’den sonra sözcüğün tamamına eklenir"
              id: "setelah -e, -n, atau -r ditambahkan pada seluruh kata"
              vi: "sau -e, -n hoặc -r thì thêm vào cả từ"
            ex: { examples: [{ mapping: [joven, { target: jovencito }] }, { mapping: [mujer, { target: mujercita }] }, { mapping: [coche, { target: cochecito }] }, { mapping: [madre, { target: madrecita }] }] }
            tr: { en: { examples: ["young lad", "little woman", "little car", "dear mother"] }, uk: { examples: ["юнак", "жіночка", "машинка", "матуся"] }, pt: { examples: ["mocinho", "mulherzinha", "carrinho", "mãezinha"] }, fr: { examples: ["jeune homme", "petite femme", "petite voiture", "maman chérie"] }, de: { examples: ["junger Mann", "Frauchen", "kleines Auto", "Mütterchen"] }, it: { examples: ["giovanotto", "donnina", "macchinina", "mammina"] }, pl: { examples: ["młodzieniec", "kobietka", "samochodzik", "mateczka"] }, tr: { examples: ["genç adam", "küçük hanım", "küçük araba", "annecik"] }, id: { examples: ["pemuda", "wanita kecil", "mobil kecil", "ibu tersayang"] }, vi: { examples: ["chàng trai trẻ", "người phụ nữ nhỏ bé", "chiếc xe nhỏ", "mẹ yêu"] } }
          - level: B2
            suffix: { alternatives: [{ term: "-cillo" }, { term: "-cilla" }] }
            rule:
              es: ["siguen la misma regla que ", { term: "-cito" }]
              en: ["follow the same rule as ", { term: "-cito" }]
              uk: ["підпорядковуються тому самому правилу, що й ", { term: "-cito" }]
              pt: ["seguem a mesma regra que ", { term: "-cito" }]
              fr: ["suivent la même règle que ", { term: "-cito" }]
              de: ["folgen derselben Regel wie ", { term: "-cito" }]
              it: ["seguono la stessa regola di ", { term: "-cito" }]
              pl: ["podlegają tej samej zasadzie co ", { term: "-cito" }]
              tr: [{ term: "-cito" }, " ile aynı kurala uyar"]
              id: ["mengikuti aturan yang sama dengan ", { term: "-cito" }]
