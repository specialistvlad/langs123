sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every noun is masculine or feminine, nouns for things too."
              es: "Todo sustantivo es masculino o femenino, también los que nombran cosas."
              uk: "Кожен іменник має чоловічий або жіночий рід, і назви предметів теж."
              pt: "Todo substantivo é masculino ou feminino, também os que nomeiam coisas."
              fr: "Tout nom est masculin ou féminin, y compris les noms de choses."
              de: "Jedes Nomen ist männlich oder weiblich, auch die Namen von Dingen."
              it: "Ogni sostantivo è maschile o femminile, anche quelli che indicano cose."
              pl: "Każdy rzeczownik jest rodzaju męskiego lub żeńskiego, także nazwy rzeczy."
              tr: "Her isim erildir ya da dişildir; eşyaları anlatan isimler de öyledir."
              id: "Setiap kata benda bergender maskulin atau feminin, termasuk nama benda mati."
              vi: "Mọi danh từ đều là giống đực hoặc giống cái, kể cả tên đồ vật."
          - type: rule
            level: A1
            text:
              en: "The words that go with a noun take its gender: articles, adjectives, demonstratives and possessives."
              es: "Las palabras que acompañan al sustantivo toman su género: artículos, adjetivos, demostrativos y posesivos."
              uk: "Слова при іменнику набувають його роду: артиклі, прикметники, вказівні та присвійні займенники."
              pt: "As palavras que acompanham o substantivo tomam o gênero dele: artigos, adjetivos, demonstrativos e possessivos."
              fr: "Les mots qui accompagnent le nom prennent son genre : articles, adjectifs, démonstratifs et possessifs."
