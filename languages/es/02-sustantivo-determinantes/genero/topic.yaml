            text:
              es: "En varios pares, el masculino nombra la unidad o lo pequeño, y el femenino, el conjunto o lo grande."
              en: "In several pairs, the masculine names the unit or the small, and the feminine the whole or the large."
              uk: "У кількох парах чоловічий рід називає одиницю або мале, а жіночий — сукупність або велике."
              pt: "Em vários pares, o masculino nomeia a unidade ou o pequeno, e o feminino, o conjunto ou o grande."
              fr: "Dans plusieurs paires, le masculin désigne l’unité ou le petit, et le féminin, l’ensemble ou le grand."
              de: "In mehreren Paaren nennt das Maskulinum die Einheit oder das Kleine, das Femininum das Ganze oder das Große."
              it: "In varie coppie, il maschile indica l’unità o il piccolo, e il femminile l’insieme o il grande."
              pl: "W kilku parach rodzaj męski nazywa jednostkę lub to, co małe, a żeński – całość lub to, co duże."
              tr: "Birçok çiftte eril birimi ya da küçük olanı, dişil ise bütünü ya da büyük olanı adlandırır."
              id: "Pada beberapa pasangan, maskulin menyebut satuan atau yang kecil, dan feminin kumpulan atau yang besar."
              vi: "Trong nhiều cặp, giống đực gọi tên đơn vị hoặc vật nhỏ, còn giống cái gọi tên tập hợp hoặc vật lớn."

  - title: { es: Sustantivos ambiguos, en: "Nouns with either gender", uk: "Іменники з двома родами", pt: "Substantivos que admitem os dois gêneros", fr: "Noms aux deux genres", de: "Nomen mit zwei Genera", it: "Sostantivi con doppio genere", pl: "Rzeczowniki o dwóch rodzajach", tr: "İki cinsiyetli isimler", id: "Kata benda dengan dua gender", vi: "Danh từ có hai giống" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: "Algunos sustantivos admiten los dos géneros sin cambiar de significado."
              en: "Some nouns take either gender without changing meaning."
              uk: "Деякі іменники мають обидва роди без зміни значення."
              pt: "Alguns substantivos admitem os dois gêneros sem mudar de significado."
              fr: "Certains noms admettent les deux genres sans changer de sens."
              de: "Manche Nomen haben beide Genera, ohne dass sich die Bedeutung ändert."
              it: "Alcuni sostantivi ammettono entrambi i generi senza cambiare significato."
              pl: "Niektóre rzeczowniki mają oba rodzaje bez zmiany znaczenia."
              tr: "Bazı isimler anlam değişmeden iki cinsiyeti de alabilir."
              id: "Beberapa kata benda boleh memakai kedua gender tanpa mengubah arti."
              vi: "Một số danh từ có thể mang cả hai giống mà nghĩa không đổi."
            ex: { examples: [{ equivalence: ["el mar", "la mar"] }, { equivalence: ["el color", "la color"] }, { equivalence: ["el azúcar", "la azúcar"] }] }
            tr: { en: { examples: ["the sea", "the colour", "sugar"] }, uk: { examples: ["море", "колір", "цукор"] }, pt: { examples: ["o mar", "a cor", "o açúcar"] }, fr: { examples: ["la mer", "la couleur", "le sucre"] }, de: { examples: ["das Meer", "die Farbe", "der Zucker"] }, it: { examples: ["il mare", "il colore", "lo zucchero"] }, pl: { examples: ["morze", "kolor", "cukier"] }, tr: { examples: ["deniz", "renk", "şeker"] }, id: { examples: ["laut", "warna", "gula"] }, vi: { examples: ["biển", "màu sắc", "đường"] } }
          - type: rule
            level: C1
            text:
              es: "El artículo decide el género, y el adjetivo concuerda con él."
              en: "The article decides the gender, and the adjective agrees with it."
              uk: "Рід визначає артикль, а прикметник узгоджується з ним."
              pt: "O artigo define o gênero, e o adjetivo concorda com ele."
              fr: "L’article décide du genre, et l’adjectif s’accorde avec lui."
              de: "Der Artikel bestimmt das Genus, und das Adjektiv richtet sich danach."
              it: "L’articolo decide il genere, e l’aggettivo concorda con esso."
              pl: "Rodzaj określa przedimek, a przymiotnik zgadza się z nim."
              tr: "Cinsiyeti artikel belirler, sıfat da ona uyar."
              id: "Artikel menentukan gender, dan kata sifat menyesuaikan diri dengannya."
              vi: "Mạo từ quyết định giống, và tính từ hòa hợp với giống đó."
            ex: { examples: [[{ target: El }, " mar está ", { target: tranquilo }, "."], [{ target: La }, " mar está ", { target: tranquila }, "."]] }
            tr: { en: { examples: ["The sea is calm.", "The sea is calm."] }, uk: { examples: ["Море спокійне.", "Море спокійне."] }, pt: { examples: ["O mar está calmo.", "O mar está calmo."] }, fr: { examples: ["La mer est calme.", "La mer est calme."] }, de: { examples: ["Das Meer ist ruhig.", "Das Meer ist ruhig."] }, it: { examples: ["Il mare è calmo.", "Il mare è calmo."] }, pl: { examples: ["Morze jest spokojne.", "Morze jest spokojne."] }, tr: { examples: ["Deniz sakin.", "Deniz sakin."] }, id: { examples: ["Laut tenang.", "Laut tenang."] }, vi: { examples: ["Biển lặng.", "Biển lặng."] } }
          - type: rule
            level: C1
            text:
              es: "El masculino es la norma en la prosa actual; el femenino sobrevive en expresiones fijas."
              en: "The masculine is the norm in current prose; the feminine survives in fixed expressions."
              uk: "У сучасній прозі нормою є чоловічий рід; жіночий зберігається в сталих виразах."
              pt: "O masculino é a norma na prosa atual; o feminino sobrevive em expressões fixas."
              fr: "Le masculin est la norme dans la prose actuelle ; le féminin survit dans les expressions figées."
              de: "Das Maskulinum ist in der heutigen Prosa die Norm; das Femininum lebt in festen Wendungen fort."
              it: "Il maschile è la norma nella prosa attuale; il femminile sopravvive nelle espressioni fisse."
              pl: "W dzisiejszej prozie normą jest rodzaj męski; żeński przetrwał w utartych wyrażeniach."
              tr: "Güncel yazı dilinde norm eril olandır; dişil olan kalıp ifadelerde yaşar."
              id: "Dalam prosa masa kini, maskulin adalah norma; feminin bertahan dalam ungkapan tetap."
