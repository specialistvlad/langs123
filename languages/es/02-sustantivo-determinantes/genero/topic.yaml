sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every noun is masculine or feminine, nouns for things too."
              es: "Todo sustantivo es masculino o femenino, también los que nombran cosas."
              uk: "Кожен іменник має чоловічий або жіночий рід, і назви предметів теж."
              pt: "Todo substantivo é masculino ou feminino, também os que nomeiam coisas."
              fr: "Tout nom est masculin ou féminin, y compris les noms de choses."
              de: "Jedes Nomen ist männlich oder weiblich, auch die Namen von Dingen."
              it: "Ogni sostantivo è maschile o femminile, anche quelli che indicano cose."
              pl: "Każdy rzeczownik jest rodzaju męskiego lub żeńskiego, także nazwy rzeczy."
              tr: "Her isim erildir ya da dişildir; eşyaları anlatan isimler de öyledir."
              id: "Setiap kata benda bergender maskulin atau feminin, termasuk nama benda mati."
              vi: "Mọi danh từ đều là giống đực hoặc giống cái, kể cả tên đồ vật."
          - type: rule
            level: A1
            text:
              en: "The words that go with a noun take its gender: articles, adjectives, demonstratives and possessives."
              es: "Las palabras que acompañan al sustantivo toman su género: artículos, adjetivos, demostrativos y posesivos."
              uk: "Слова при іменнику набувають його роду: артиклі, прикметники, вказівні та присвійні займенники."
              pt: "As palavras que acompanham o substantivo tomam o gênero dele: artigos, adjetivos, demonstrativos e possessivos."
              fr: "Les mots qui accompagnent le nom prennent son genre : articles, adjectifs, démonstratifs et possessifs."
              de: "Die Wörter beim Nomen übernehmen sein Genus: Artikel, Adjektive, Demonstrativ- und Possessivpronomen."
              it: "Le parole che accompagnano il sostantivo prendono il suo genere: articoli, aggettivi, dimostrativi e possessivi."
              pl: "Wyrazy towarzyszące rzeczownikowi przyjmują jego rodzaj: przedimki, przymiotniki, zaimki wskazujące i dzierżawcze."
              tr: "İsimle birlikte kullanılan sözcükler onun cinsiyetini alır: artikeller, sıfatlar, işaret sözcükleri ve iyelik sıfatları."
              id: "Kata yang menyertai kata benda mengikuti gendernya: artikel, kata sifat, kata tunjuk, dan kata ganti kepemilikan."
              vi: "Các từ đi kèm danh từ mang giống của nó: mạo từ, tính từ, từ chỉ định và tính từ sở hữu."
            ex: [{ target: Esta }, " casa es ", { target: nueva }, "."]
            tr: { en: This house is new., uk: Цей будинок новий., pt: "Esta casa é nova.", fr: "Cette maison est neuve.", de: "Dieses Haus ist neu.", it: "Questa casa è nuova.", pl: "Ten dom jest nowy.", tr: "Bu ev yeni.", id: "Rumah ini baru.", vi: "Ngôi nhà này mới." }
          - type: rule
            level: A1
            text:
              en: "The ending gives a clue, and the article shows the gender for sure: learn each noun with its article."
              es: "La terminación da una pista, y el artículo muestra el género con seguridad: aprende cada sustantivo con su artículo."
              uk: "Закінчення підказує рід, а артикль показує його напевно: запам’ятовуйте кожен іменник разом з артиклем."
              pt: "A terminação dá uma pista, e o artigo mostra o gênero com certeza: aprenda cada substantivo com o seu artigo."
              fr: "La terminaison donne un indice, et l’article montre le genre à coup sûr : apprends chaque nom avec son article."
              de: "Die Endung gibt einen Hinweis, und der Artikel zeigt das Genus sicher an: lerne jedes Nomen mit seinem Artikel."
              it: "La terminazione dà un indizio, e l’articolo mostra il genere con certezza: impara ogni sostantivo con il suo articolo."
              pl: "Końcówka podpowiada rodzaj, a przedimek pokazuje go na pewno: ucz się każdego rzeczownika razem z przedimkiem."
              tr: "Son ek cinsiyet hakkında ipucu verir; artikel ise cinsiyeti kesin olarak gösterir: her ismi artikeliyle birlikte öğren."
              id: "Akhiran memberi petunjuk, dan artikel menunjukkan gender dengan pasti: pelajari setiap kata benda bersama artikelnya."
              vi: "Đuôi từ gợi ý giống, còn mạo từ cho biết giống một cách chắc chắn: hãy học mỗi danh từ cùng với mạo từ của nó."
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "Рід іспанського іменника часто не збігається з українським: la casa, але «будинок»; el libro, але «книжка». Середнього роду в іспанських іменниках немає."
          - type: note
            level: A1
            text:
              en: ["The forms of the articles: see ", { link: Articles, to: es.sustantivo-determinantes.articulos }, "."]
              es: ["Las formas del artículo: ver ", { link: El artículo, to: es.sustantivo-determinantes.articulos }, "."]
              uk: ["Форми артиклів: див. ", { link: Артиклі, to: es.sustantivo-determinantes.articulos }, "."]
              pt: ["As formas do artigo: veja ", { link: Artigos, to: es.sustantivo-determinantes.articulos }, "."]
              fr: ["Les formes de l’article : voir ", { link: Articles, to: es.sustantivo-determinantes.articulos }, "."]
              de: ["Die Formen des Artikels: siehe ", { link: Artikel, to: es.sustantivo-determinantes.articulos }, "."]
              it: ["Le forme dell’articolo: vedi ", { link: Articoli, to: es.sustantivo-determinantes.articulos }, "."]
              pl: ["Formy przedimka: zob. ", { link: Przedimki, to: es.sustantivo-determinantes.articulos }, "."]
              tr: ["Artikelin biçimleri: bkz. ", { link: Artikeller, to: es.sustantivo-determinantes.articulos }, "."]
              id: ["Bentuk-bentuk artikel: lihat ", { link: Artikel, to: es.sustantivo-determinantes.articulos }, "."]
              vi: ["Các dạng của mạo từ: xem ", { link: Mạo từ, to: es.sustantivo-determinantes.articulos }, "."]

