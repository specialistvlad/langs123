            meaning: { es: { contrast: ["un trozo de tronco", "la madera para el fuego"] } }
          - level: C1
            masc: [{ target: el }, " fruto"]
            fem: [{ target: la }, " fruta"]
            meaning: { es: { contrast: ["el producto de una planta", "el fruto que se come"] } }
          - level: C1
            masc: [{ target: el }, " huerto"]
            fem: [{ target: la }, " huerta"]
            meaning: { es: { contrast: ["un terreno pequeño de verduras", "un terreno grande de cultivo"] } }
          - level: C1
            masc: [{ target: el }, " cuchillo"]
            fem: [{ target: la }, " cuchilla"]
            meaning: { es: { contrast: ["una herramienta con mango para cortar", "una hoja ancha de metal para cortar"] } }
          - level: C1
            masc: [{ target: el }, " jarro"]
            fem: [{ target: la }, " jarra"]
            meaning: { es: { contrast: ["un recipiente con un asa", "un recipiente más grande, con una o más asas"] } }
          - level: C1
            masc: [{ target: el }, " frente"]
            fem: [{ target: la }, " frente"]
            meaning: { es: { contrast: ["la línea de combate", "la parte superior de la cara"] } }
          - level: C1
            masc: [{ target: el }, " orden"]
            fem: [{ target: la }, " orden"]
            meaning: { es: { contrast: ["la colocación ordenada de las cosas", "lo que manda una autoridad"] } }
          - level: C1
