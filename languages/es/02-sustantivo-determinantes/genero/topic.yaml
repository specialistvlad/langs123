title: { en: Gender, es: El género, uk: Рід, pt: "O gênero", fr: "Le genre", de: "Das Genus", it: "Il genere", pl: "Rodzaj", tr: "Dilbilgisel cinsiyet", id: "Gender", vi: "Giống của danh từ" }
summary:
  lead:
    en: ["Every noun is masculine or feminine: most nouns in -o are masculine, ", { term: el libro }, ", and most in -a are feminine, ", { term: la casa }, "."]
    es: ["Todo sustantivo es masculino o femenino: en -o suele ser masculino, ", { term: el libro }, ", y en -a, femenino, ", { term: la casa }, "."]
    uk: ["Кожен іменник має чоловічий або жіночий рід: більшість іменників на -o — чоловічого роду, ", { term: el libro }, ", а більшість на -a — жіночого, ", { term: la casa }, "."]
    pt: ["Todo substantivo é masculino ou feminino: em -o costuma ser masculino, ", { term: el libro }, ", e em -a, feminino, ", { term: la casa }, "."]
    fr: ["Tout nom est masculin ou féminin : en -o il est le plus souvent masculin, ", { term: el libro }, ", et en -a, féminin, ", { term: la casa }, "."]
    de: ["Jedes Nomen ist männlich oder weiblich: Auf -o ist es meist männlich, ", { term: el libro }, ", auf -a weiblich, ", { term: la casa }, "."]
    it: ["Ogni sostantivo è maschile o femminile: in -o di solito è maschile, ", { term: el libro }, ", e in -a femminile, ", { term: la casa }, "."]
    pl: ["Każdy rzeczownik jest rodzaju męskiego lub żeńskiego: na -o zwykle jest męski, ", { term: el libro }, ", a na -a żeński, ", { term: la casa }, "."]
    tr: ["Her isim erildir ya da dişildir: -o ile bitenler çoğunlukla eril, ", { term: el libro }, "; -a ile bitenler dişildir, ", { term: la casa }, "."]
    id: ["Setiap kata benda bergender maskulin atau feminin: yang berakhiran -o biasanya maskulin, ", { term: el libro }, ", dan yang berakhiran -a feminin, ", { term: la casa }, "."]
    vi: ["Mọi danh từ đều là giống đực hoặc giống cái: đuôi -o thường là giống đực, ", { term: el libro }, ", đuôi -a là giống cái, ", { term: la casa }, "."]
  rule:
    en: "Articles and adjectives take the gender of their noun:"
    es: "El artículo y el adjetivo toman el género de su sustantivo:"
    uk: "Артикль і прикметник набувають роду свого іменника:"
    pt: "O artigo e o adjetivo tomam o gênero do substantivo:"
    fr: "L’article et l’adjectif prennent le genre de leur nom :"
    de: "Artikel und Adjektiv übernehmen das Genus ihres Nomens:"
    it: "L’articolo e l’aggettivo prendono il genere del loro sostantivo:"
    pl: "Przedimek i przymiotnik przyjmują rodzaj swojego rzeczownika:"
    tr: "Artikel ve sıfat, isminin cinsiyetini alır:"
    id: "Artikel dan kata sifat mengikuti gender kata bendanya:"
    vi: "Mạo từ và tính từ mang giống của danh từ:"
  ex: { examples: [[{ target: el }, " libro ", { target: nuevo }], [{ target: la }, " casa ", { target: nueva }]] }

