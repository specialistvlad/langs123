      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "The long form agrees with the thing owned in gender and number."
              es: "La forma tónica concuerda con lo poseído en género y número."
              uk: "Повна форма узгоджується з тим, чим володіють, у роді й числі."
              pt: "A forma tônica concorda com a coisa possuída em gênero e número."
              fr: "La forme tonique s’accorde avec la chose possédée en genre et en nombre."
              de: "Die betonte Form richtet sich nach dem Besitzgegenstand in Genus und Numerus."
              it: "La forma tonica concorda con la cosa posseduta in genere e numero."
              pl: "Forma pełna zgadza się z rzeczą posiadaną w rodzaju i liczbie."
              tr: "Uzun biçim, sahip olunan şeyle cinsiyette ve sayıda uyum sağlar."
              id: "Bentuk panjang sesuai dengan benda yang dimiliki dalam gender dan jumlah."
              vi: "Dạng dài hòa hợp với vật được sở hữu về giống và số."

