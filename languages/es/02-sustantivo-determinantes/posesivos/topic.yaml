          rule: { en: [{ term: su }, " is his, her, its, their, and your for ", { term: usted }], es: [{ term: su }, " sirve para él, ella, ellos, ellas y ", { term: usted }], uk: [{ term: su }, " — це «його», «її», «їхній» і «ваш» для ", { term: usted }], pt: [{ term: "su" }, " vale para él, ella, ellos, ellas e ", { term: "usted" }], fr: [{ term: "su" }, " vaut pour él, ella, ellos, ellas et ", { term: "usted" }], de: [{ term: "su" }, " gilt für él, ella, ellos, ellas und ", { term: "usted" }], it: [{ term: "su" }, " vale per él, ella, ellos, ellas e ", { term: "usted" }], pl: [{ term: "su" }, " dotyczy él, ella, ellos, ellas i ", { term: "usted" }], tr: [{ term: "su" }, ", él, ella, ellos, ellas ve ", { term: "usted" }, " için kullanılır"], id: [{ term: "su" }, " dipakai untuk él, ella, ellos, ellas, dan ", { term: "usted" }], vi: [{ term: "su" }, " dùng cho él, ella, ellos, ellas và ", { term: "usted" }] }
          ex: ["Ana vive con ", { target: su }, " hermano."]
          tr: { en: Ana lives with her brother., uk: Ана живе зі своїм братом., pt: "A Ana mora com o irmão dela.", fr: "Ana vit avec son frère.", de: "Ana wohnt mit ihrem Bruder.", it: "Ana vive con suo fratello.", pl: "Ana mieszka ze swoim bratem.", tr: "Ana erkek kardeşiyle yaşıyor.", id: "Ana tinggal bersama saudara laki-lakinya.", vi: "Ana sống với anh trai của cô ấy." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: Пастка, pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { en: [{ term: mis }, " before a plural noun"], es: [{ term: mis }, " delante de un plural"], uk: [{ term: mis }, " перед іменником у множині"], pt: [{ term: "mis" }, " antes de um plural"], fr: [{ term: "mis" }, " devant un pluriel"], de: [{ term: "mis" }, " vor einem Plural"], it: [{ term: "mis" }, " davanti a un plurale"], pl: [{ term: "mis" }, " przed liczbą mnogą"], tr: [{ term: "mis" }, " çoğul bir isimden önce"], id: [{ term: "mis" }, " sebelum bentuk jamak"], vi: [{ term: "mis" }, " trước danh từ số nhiều"] }
          ex: [{ target: Mis }, " padres son de Cuba."]
          tr: { en: My parents are from Cuba., uk: Мої батьки з Куби., pt: "Meus pais são de Cuba.", fr: "Mes parents sont de Cuba.", de: "Meine Eltern kommen aus Kuba.", it: "I miei genitori sono di Cuba.", pl: "Moi rodzice pochodzą z Kuby.", tr: "Annem babam Küba’dan.", id: "Orang tuaku berasal dari Kuba.", vi: "Bố mẹ tôi đến từ Cuba." }

sections:
  - title: { en: "Form: before the noun", es: "Forma: delante del sustantivo", uk: "Форма: перед іменником", pt: "Forma: antes do substantivo", fr: "Forme : devant le nom", de: "Form: vor dem Nomen", it: "Forma: davanti al sostantivo", pl: "Forma: przed rzeczownikiem", tr: "Biçim: isimden önce", id: "Bentuk: sebelum kata benda", vi: "Dạng: trước danh từ" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: owner, label: { en: Owner, es: Poseedor, uk: Власник, pt: "Possuidor", fr: "Possesseur", de: "Besitzer", it: "Possessore", pl: "Właściciel", tr: "Sahip", id: "Pemilik", vi: "Người sở hữu" } }
          - { key: one, label: { en: One thing, es: Una cosa, uk: Одна річ, pt: "Uma coisa", fr: "Une chose", de: "Eine Sache", it: "Una cosa", pl: "Jedna rzecz", tr: "Tek bir şey", id: "Satu benda", vi: "Một vật" } }
          - { key: more, label: { en: Several things, es: Varias cosas, uk: Кілька речей, pt: "Várias coisas", fr: "Plusieurs choses", de: "Mehrere Sachen", it: "Più cose", pl: "Kilka rzeczy", tr: "Birden çok şey", id: "Beberapa benda", vi: "Nhiều vật" } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, owner: yo, one: { target: mi }, more: { target: mis } }
          - { level: A1, features: { person: 2, number: sg, politeness: infm }, owner: tú, one: { target: tu }, more: { target: tus } }
          - { level: A1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], owner: { alternatives: [él, ella, usted] }, one: { target: su }, more: { target: sus } }
          - { level: A1, features: { person: 1, number: pl }, owner: { alternatives: [nosotros, nosotras] }, one: { alternatives: [{ target: nuestro }, { target: nuestra }] }, more: { alternatives: [{ target: nuestros }, { target: nuestras }] } }
          - { level: A1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, owner: { alternatives: [vosotros, vosotras] }, one: { alternatives: [{ target: vuestro }, { target: vuestra }] }, more: { alternatives: [{ target: vuestros }, { target: vuestras }] } }
          - { level: A1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], owner: { alternatives: [ellos, ellas, ustedes] }, one: { target: su }, more: { target: sus } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The possessive agrees with the thing owned, not with the owner:"
              es: "El posesivo concuerda con lo poseído, no con el poseedor:"
              uk: "Присвійний займенник узгоджується з тим, чим володіють, а не з власником:"
              pt: "O possessivo concorda com a coisa possuída, não com o possuidor:"
              fr: "Le possessif s’accorde avec la chose possédée, non avec le possesseur :"
              de: "Das Possessivum richtet sich nach dem Besitzgegenstand, nicht nach dem Besitzer:"
              it: "Il possessivo concorda con la cosa posseduta, non con il possessore:"
              pl: "Zaimek dzierżawczy zgadza się z rzeczą posiadaną, a nie z właścicielem:"
              tr: "İyelik sözcüğü, sahibiyle değil, sahip olunan şeyle uyum sağlar:"
              id: "Kata kepemilikan sesuai dengan benda yang dimiliki, bukan dengan pemiliknya:"
              vi: "Từ sở hữu hòa hợp với vật được sở hữu, không phải với người sở hữu:"
            ex: ["Luis vive con ", { target: sus }, " padres."]
            tr: { en: Luis lives with his parents., uk: Луїс живе зі своїми батьками., pt: "O Luis mora com os pais dele.", fr: "Luis vit avec ses parents.", de: "Luis wohnt bei seinen Eltern.", it: "Luis vive con i suoi genitori.", pl: "Luis mieszka ze swoimi rodzicami.", tr: "Luis ailesiyle yaşıyor.", id: "Luis tinggal bersama orang tuanya.", vi: "Luis sống với bố mẹ của anh ấy." }
          - type: rule
            level: A1
            text:
              en: [{ term: nuestro }, " also agrees in gender; the other short forms change only for number."]
              es: [{ term: nuestro }, " también concuerda en género; las demás formas átonas solo cambian de número."]
              uk: [{ term: nuestro }, " узгоджується ще й у роді; інші короткі форми змінюються тільки за числом."]
              pt: [{ term: "nuestro" }, " também concorda em gênero; as demais formas átonas mudam só de número."]
              fr: [{ term: "nuestro" }, " s’accorde aussi en genre ; les autres formes atones ne changent qu’en nombre."]
              de: [{ term: "nuestro" }, " richtet sich auch nach dem Genus; die übrigen unbetonten Formen ändern nur den Numerus."]
              it: [{ term: "nuestro" }, " concorda anche in genere; le altre forme atone cambiano solo di numero."]
              pl: [{ term: "nuestro" }, " zgadza się także w rodzaju; pozostałe formy krótkie zmieniają się tylko pod względem liczby."]
              tr: [{ term: "nuestro" }, " cinsiyette de uyum sağlar; diğer kısa biçimler yalnızca sayıya göre değişir."]
              id: [{ term: "nuestro" }, " juga sesuai dalam gender; bentuk pendek lainnya hanya berubah menurut jumlah."]
              vi: [{ term: "nuestro" }, " còn hòa hợp cả về giống; các dạng ngắn khác chỉ đổi theo số."]
            ex: [{ target: Nuestra }, " casa es grande."]
            tr: { en: Our house is big., uk: Наш будинок великий., pt: "Nossa casa é grande.", fr: "Notre maison est grande.", de: "Unser Haus ist groß.", it: "La nostra casa è grande.", pl: "Nasz dom jest duży.", tr: "Evimiz büyük.", id: "Rumah kami besar.", vi: "Nhà của chúng tôi to." }
          - type: rule
            level: A1
            text:
              en: [{ term: su }, " means his, her, its, their, and your for ", { term: usted }, " and ", { term: ustedes }, "."]
              es: [{ term: su }, " remite a él, ella, ellos, ellas, ", { term: usted }, " y ", { term: ustedes }, "."]
              uk: [{ term: su }, " означає «його», «її», «їхній», а також «ваш» для ", { term: usted }, " і ", { term: ustedes }, "."]
              pt: [{ term: "su" }, " remete a él, ella, ellos, ellas, ", { term: "usted" }, " e ", { term: "ustedes" }, "."]
              fr: [{ term: "su" }, " renvoie à él, ella, ellos, ellas, ", { term: "usted" }, " et ", { term: "ustedes" }, "."]
              de: [{ term: "su" }, " verweist auf él, ella, ellos, ellas, ", { term: "usted" }, " und ", { term: "ustedes" }, "."]
              it: [{ term: "su" }, " rimanda a él, ella, ellos, ellas, ", { term: "usted" }, " e ", { term: "ustedes" }, "."]
              pl: [{ term: "su" }, " odnosi się do él, ella, ellos, ellas, ", { term: "usted" }, " i ", { term: "ustedes" }, "."]
              tr: [{ term: "su" }, ", él, ella, ellos, ellas, ", { term: "usted" }, " ve ", { term: "ustedes" }, " için kullanılır."]
              id: [{ term: "su" }, " merujuk pada él, ella, ellos, ellas, ", { term: "usted" }, " dan ", { term: "ustedes" }, "."]
              vi: [{ term: "su" }, " chỉ él, ella, ellos, ellas, ", { term: "usted" }, " và ", { term: "ustedes" }, "."]
            ex: ["Ana vive con ", { target: su }, " hermano."]
            tr: { en: Ana lives with her brother., uk: Ана живе зі своїм братом., pt: "A Ana mora com o irmão dela.", fr: "Ana vit avec son frère.", de: "Ana wohnt mit ihrem Bruder.", it: "Ana vive con suo fratello.", pl: "Ana mieszka ze swoim bratem.", tr: "Ana erkek kardeşiyle yaşıyor.", id: "Ana tinggal bersama saudara laki-lakinya.", vi: "Ana sống với anh trai của cô ấy." }
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: "Українського «свій» в іспанській немає: присвійний займенник завжди вказує на особу власника. «Я живу зі своїм братом» — Vivo con mi hermano; «вона живе зі своїм братом» — Vive con su hermano."
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["In Latin America, the plural “your” is always ", { term: su }, ", the possessive of ", { term: ustedes }, ":"]
              es: ["En Latinoamérica, el posesivo para varias personas a las que se habla es siempre ", { term: su }, ", el de ", { term: ustedes }, ":"]
              uk: ["У Латинській Америці «ваш» для кількох співрозмовників — це завжди ", { term: su }, ", присвійний займенник для ", { term: ustedes }, ":"]
              pt: ["Na América Latina, o possessivo para várias pessoas com quem se fala é sempre ", { term: "su" }, ", o de ", { term: "ustedes" }, ":"]
              fr: ["En Amérique latine, le possessif pour plusieurs interlocuteurs est toujours ", { term: "su" }, ", celui de ", { term: "ustedes" }, " :"]
              de: ["In Lateinamerika ist das Possessivum für mehrere angesprochene Personen immer ", { term: "su" }, ", das von ", { term: "ustedes" }, ":"]
              it: ["In America Latina il possessivo per più persone a cui ci si rivolge è sempre ", { term: "su" }, ", quello di ", { term: "ustedes" }, ":"]
              pl: ["W Ameryce Łacińskiej zaimek dzierżawczy dla kilku osób, do których się mówi, to zawsze ", { term: "su" }, ", zaimek od ", { term: "ustedes" }, ":"]
              tr: ["Latin Amerika’da birden çok kişiye hitap ederken iyelik sözcüğü her zaman ", { term: "su" }, " olur; bu, ", { term: "ustedes" }, " sözcüğünün iyelik biçimidir:"]
              id: ["Di Amerika Latin, kata kepemilikan untuk beberapa lawan bicara selalu ", { term: "su" }, ", yaitu bentuk kepemilikan dari ", { term: "ustedes" }, ":"]
              vi: ["Ở Mỹ Latinh, từ sở hữu dành cho nhiều người đang nói chuyện cùng luôn là ", { term: "su" }, ", dạng sở hữu của ", { term: "ustedes" }, ":"]
            ex: ["Chicos, ¿dónde está ", { target: su }, " profesor?"]
            tr: { en: "Guys, where is your teacher?", uk: "Хлопці, де ваш учитель?", pt: "Pessoal, onde está o professor de vocês?", fr: "Les gars, où est votre professeur ?", de: "Leute, wo ist euer Lehrer?", it: "Ragazzi, dov'è il vostro professore?", pl: "Chłopaki, gdzie jest wasz nauczyciel?", tr: "Çocuklar, öğretmeniniz nerede?", id: "Teman-teman, di mana guru kalian?", vi: "Các bạn ơi, giáo viên của các bạn ở đâu?" }
          - type: note
            level: A1
            variety: es-ES
            text:
              en: [{ term: vuestro }, " is the possessive of ", { term: vosotros }, ":"]
              es: [{ term: vuestro }, " es el posesivo de ", { term: vosotros }, ":"]
              uk: [{ term: vuestro }, " — присвійний займенник для ", { term: vosotros }, ":"]
              pt: [{ term: "vuestro" }, " é o possessivo de ", { term: "vosotros" }, ":"]
              fr: [{ term: "vuestro" }, " est le possessif de ", { term: "vosotros" }, " :"]
              de: [{ term: "vuestro" }, " ist das Possessivum von ", { term: "vosotros" }, ":"]
              it: [{ term: "vuestro" }, " è il possessivo di ", { term: "vosotros" }, ":"]
              pl: [{ term: "vuestro" }, " to zaimek dzierżawczy od ", { term: "vosotros" }, ":"]
              tr: [{ term: "vuestro" }, ", ", { term: "vosotros" }, " için kullanılan iyelik sözcüğüdür:"]
              id: [{ term: "vuestro" }, " adalah kata kepemilikan dari ", { term: "vosotros" }, ":"]
              vi: [{ term: "vuestro" }, " là từ sở hữu của ", { term: "vosotros" }, ":"]
            ex: ["Chicos, ¿dónde está ", { target: vuestro }, " profesor?"]
            tr: { en: "Guys, where is your teacher?", uk: "Хлопці, де ваш учитель?", pt: "Pessoal, onde está o professor de vocês?", fr: "Les gars, où est votre professeur ?", de: "Leute, wo ist euer Lehrer?", it: "Ragazzi, dov'è il vostro professore?", pl: "Chłopaki, gdzie jest wasz nauczyciel?", tr: "Çocuklar, öğretmeniniz nerede?", id: "Teman-teman, di mana guru kalian?", vi: "Các bạn ơi, giáo viên của các bạn ở đâu?" }

  - title: { en: "Form: after the noun and alone", es: "Forma: detrás del sustantivo y solo", uk: "Форма: після іменника й без нього", pt: "Forma: depois do substantivo e sozinho", fr: "Forme : après le nom et seul", de: "Form: nach dem Nomen und allein", it: "Forma: dopo il sostantivo e da solo", pl: "Forma: po rzeczowniku i samodzielnie", tr: "Biçim: isimden sonra ve tek başına", id: "Bentuk: setelah kata benda dan berdiri sendiri", vi: "Dạng: sau danh từ và đứng một mình" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: owner, label: { en: Owner, es: Poseedor, uk: Власник, pt: "Possuidor", fr: "Possesseur", de: "Besitzer", it: "Possessore", pl: "Właściciel", tr: "Sahip", id: "Pemilik", vi: "Người sở hữu" } }
          - { key: one, label: { en: One thing, es: Una cosa, uk: Одна річ, pt: "Uma coisa", fr: "Une chose", de: "Eine Sache", it: "Una cosa", pl: "Jedna rzecz", tr: "Tek bir şey", id: "Satu benda", vi: "Một vật" } }
          - { key: more, label: { en: Several things, es: Varias cosas, uk: Кілька речей, pt: "Várias coisas", fr: "Plusieurs choses", de: "Mehrere Sachen", it: "Più cose", pl: "Kilka rzeczy", tr: "Birden çok şey", id: "Beberapa benda", vi: "Nhiều vật" } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, owner: yo, one: { alternatives: [{ target: mío }, { target: mía }] }, more: { alternatives: [{ target: míos }, { target: mías }] } }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, owner: tú, one: { alternatives: [{ target: tuyo }, { target: tuya }] }, more: { alternatives: [{ target: tuyos }, { target: tuyas }] } }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], owner: { alternatives: [él, ella, usted] }, one: { alternatives: [{ target: suyo }, { target: suya }] }, more: { alternatives: [{ target: suyos }, { target: suyas }] } }
          - { level: A2, features: { person: 1, number: pl }, owner: { alternatives: [nosotros, nosotras] }, one: { alternatives: [{ target: nuestro }, { target: nuestra }] }, more: { alternatives: [{ target: nuestros }, { target: nuestras }] } }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, owner: { alternatives: [vosotros, vosotras] }, one: { alternatives: [{ target: vuestro }, { target: vuestra }] }, more: { alternatives: [{ target: vuestros }, { target: vuestras }] } }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], owner: { alternatives: [ellos, ellas, ustedes] }, one: { alternatives: [{ target: suyo }, { target: suya }] }, more: { alternatives: [{ target: suyos }, { target: suyas }] } }
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Вживання, pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A2, use: { en: "After ser: whose it is", es: "Después de ser: de quién es", uk: "Після ser: чиє це", pt: "Depois de ser: de quem é", fr: "Après ser : à qui c’est", de: "Nach ser: wem etwas gehört", it: "Dopo ser: di chi è", pl: "Po ser: czyje to jest", tr: "ser fiilinden sonra: kimin olduğu", id: "Setelah ser: milik siapa", vi: "Sau ser: của ai" }, ex: ["Esta mochila es ", { target: mía }, "."], tr: { en: This backpack is mine., uk: Цей рюкзак мій., pt: "Esta mochila é minha.", fr: "Ce sac à dos est à moi.", de: "Dieser Rucksack gehört mir.", it: "Questo zaino è mio.", pl: "Ten plecak jest mój.", tr: "Bu sırt çantası benim.", id: "Ransel ini milikku.", vi: "Chiếc ba lô này là của tôi." } }
          - { level: A2, use: { en: "With the article, in place of the noun", es: "Con el artículo, en lugar del sustantivo", uk: "З артиклем, замість іменника", pt: "Com o artigo, no lugar do substantivo", fr: "Avec l’article, à la place du nom", de: "Mit dem Artikel, anstelle des Nomens", it: "Con l'articolo, al posto del sostantivo", pl: "Z przedimkiem, w miejsce rzeczownika", tr: "Artikelle birlikte, isim yerine", id: "Dengan artikel, sebagai pengganti kata benda", vi: "Với mạo từ, thay cho danh từ" }, ex: ["Mi casa es grande, y ", { target: la tuya }, " es bonita."], tr: { en: "My house is big, and yours is pretty.", uk: "Мій будинок великий, а твій — гарний.", pt: "Minha casa é grande, e a sua é bonita.", fr: "Ma maison est grande, et la tienne est jolie.", de: "Mein Haus ist groß, und deins ist hübsch.", it: "La mia casa è grande, e la tua è carina.", pl: "Mój dom jest duży, a twój jest ładny.", tr: "Benim evim büyük, seninki güzel.", id: "Rumahku besar, dan rumahmu cantik.", vi: "Nhà của tôi to, còn nhà của bạn đẹp." } }
          - { level: B1, use: { en: "After a noun: one of several", es: "Detrás de un sustantivo: uno entre varios", uk: "Після іменника: один із кількох", pt: "Depois de um substantivo: um entre vários", fr: "Après un nom : l’un parmi plusieurs", de: "Nach einem Nomen: einer von mehreren", it: "Dopo un sostantivo: uno fra tanti", pl: "Po rzeczowniku: jeden z kilku", tr: "İsimden sonra: birkaçından biri", id: "Setelah kata benda: salah satu dari beberapa", vi: "Sau danh từ: một trong số nhiều" }, ex: ["Marta es una amiga ", { target: mía }, "."], tr: { en: Marta is a friend of mine., uk: Марта — одна з моїх подруг., pt: "A Marta é uma amiga minha.", fr: "Marta est une de mes amies.", de: "Marta ist eine Freundin von mir.", it: "Marta è una mia amica.", pl: "Marta jest jedną z moich przyjaciółek.", tr: "Marta arkadaşlarımdan biri.", id: "Marta adalah salah satu temanku.", vi: "Marta là một người bạn của tôi." } }
