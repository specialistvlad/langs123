    uk: [{ term: Mi }, ", ", { term: tu }, ", ", { term: su }, " стоять перед іменником, а ", { term: mío }, ", ", { term: tuyo }, ", ", { term: suyo }, " — після нього; і ті, і ті узгоджуються з тим, чим володіють."]
    pt: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " vão antes do substantivo, e ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, ", depois dele; todos concordam com a coisa possuída."]
    fr: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " se placent devant le nom, et ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, ", derrière lui ; tous s’accordent avec la chose possédée."]
    de: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " stehen vor dem Nomen, ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " dahinter; alle richten sich nach dem Besitzgegenstand."]
    it: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " stanno davanti al sostantivo, e ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " dopo di esso; tutti concordano con la cosa posseduta."]
    pl: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " stoją przed rzeczownikiem, a ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " po nim; wszystkie zgadzają się z rzeczą posiadaną."]
    tr: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " isimden önce, ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " isimden sonra gelir; hepsi sahip olunan şeyle uyum sağlar."]
    id: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " berada sebelum kata benda, dan ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " sesudahnya; semuanya sesuai dengan benda yang dimiliki."]
    vi: [{ term: "Mi" }, ", ", { term: "tu" }, ", ", { term: "su" }, " đứng trước danh từ, còn ", { term: "mío" }, ", ", { term: "tuyo" }, ", ", { term: "suyo" }, " đứng sau; tất cả đều hòa hợp với vật được sở hữu."]
  rule:
    en: "The possessive agrees with the thing owned, not with the owner:"
    es: "El posesivo concuerda con lo poseído, no con el poseedor:"
    uk: "Присвійний займенник узгоджується з тим, чим володіють, а не з власником:"
    pt: "O possessivo concorda com a coisa possuída, não com o possuidor:"
    fr: "Le possessif s’accorde avec la chose possédée, non avec le possesseur :"
    de: "Das Possessivum richtet sich nach dem Besitzgegenstand, nicht nach dem Besitzer:"
    it: "Il possessivo concorda con la cosa posseduta, non con il possessore:"
    pl: "Zaimek dzierżawczy zgadza się z rzeczą posiadaną, a nie z właścicielem:"
    tr: "İyelik sözcüğü, sahibiyle değil, sahip olunan şeyle uyum sağlar:"
    id: "Kata kepemilikan sesuai dengan benda yang dimiliki, bukan dengan pemiliknya:"
    vi: "Từ sở hữu hòa hợp với vật được sở hữu, không phải với người sở hữu:"
  ex: { examples: [["Luis vive con ", { target: sus }, " padres."], [{ target: Nuestra }, " casa es grande."]] }

