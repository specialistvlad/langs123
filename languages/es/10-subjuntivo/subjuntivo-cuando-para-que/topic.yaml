id: es.subjuntivo.subjuntivo-cuando-para-que
lang: es
kind: grammar
tags: [verbs, subjunctive, clauses, time, purpose]
concepts: [subjunctive, linkers]
related: [es.subjuntivo.subjuntivo-formas, es.subjuntivo.subjuntivo-deseos-dudas, es.futuro-condicional.futuro-simple, es.oracion.conectores]
status: { en: draft, es: draft, uk: draft }
translated: { en: "27f567 88e093 143598 d8404b ab7b8b aa5f2c b1baad e62c4b", uk: "27f567 88e093 143598 d8404b ab7b8b aa5f2c b1baad e62c4b" }

title: { en: "Subjunctive after cuando, para que, antes de que", es: "El subjuntivo con cuando, para que, antes de que", uk: "Суб’юнктив після cuando, para que, antes de que" }
summary:
  lead:
    en: [{ term: Cuando }, " takes the subjunctive for a future event, and ", { term: para que }, " and ", { term: antes de que }, " always take it: ", { term: cuando llegues }, "."]
    es: [{ term: Cuando }, " lleva subjuntivo para un hecho futuro, y ", { term: para que }, " y ", { term: antes de que }, " lo llevan siempre: ", { term: cuando llegues }, "."]
    uk: [{ term: Cuando }, " вимагає суб’юнктива для майбутньої події, а ", { term: para que }, " та ", { term: antes de que }, " — завжди: ", { term: cuando llegues }, "."]
  rule:
    en: ["A future event after ", { term: cuando }, " takes the subjunctive, never the future:"]
    es: ["Un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo, nunca futuro:"]
    uk: ["Майбутня подія після ", { term: cuando }, " стоїть у суб’юнктиві, ніколи не в майбутньому часі:"]
  ex: { examples: [["Cuando ", { target: llegues }, ", llámame."], ["Te lo diré cuando lo ", { target: vea }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: B1
          point: { term: cuando }
          rule:
            en: "a future event: subjunctive"
            es: "un hecho futuro: subjuntivo"
            uk: "майбутня подія: суб’юнктив"
          ex: ["Cuando ", { target: tenga }, " dinero, viajaré."]
          tr: { en: "When I have money, I'll travel.", uk: "Коли матиму гроші, подорожуватиму." }
        - level: B1
          point: { term: cuando }
          rule:
            en: "a habit or the past: indicative"
            es: "un hábito o el pasado: indicativo"
            uk: "звичка або минуле: дійсний спосіб"
          ex: ["Cuando ", { target: tengo }, " tiempo, leo."]
          tr: { en: "When I have time, I read.", uk: "Коли маю час, читаю." }
        - level: B1
          point: { term: hasta que }
          rule:
            en: ["the same as ", { term: cuando }]
            es: ["igual que ", { term: cuando }]
            uk: ["так само, як ", { term: cuando }]
          ex: ["Espera aquí hasta que ", { target: vuelva }, "."]
          tr: { en: Wait here until I come back., uk: "Чекай тут, доки я не повернуся." }
        - level: B1
          point: { term: después de que }
          rule:
            en: "a future event: subjunctive"
            es: "un hecho futuro: subjuntivo"
            uk: "майбутня подія: суб’юнктив"
          ex: ["Cenaremos después de que ", { target: lleguen }, " los niños."]
          tr: { en: "We'll have dinner after the children arrive.", uk: "Ми повечеряємо, коли прийдуть діти." }
        - level: B1
          point: { term: antes de que }
          rule:
            en: "always the subjunctive"
            es: "siempre subjuntivo"
            uk: "завжди суб’юнктив"
          ex: ["Vámonos antes de que ", { target: llueva }, "."]
          tr: { en: "Let's go before it rains.", uk: "Ходімо, поки не пішов дощ." }
        - level: B1
          point: { term: para que }
          rule:
            en: "a purpose with another subject: subjunctive"
            es: "una finalidad con otro sujeto: subjuntivo"
            uk: "мета з іншим підметом: суб’юнктив"
          ex: ["Te lo explico para que lo ", { target: entiendas }, "."]
          tr: { en: "I'll explain it so that you understand it.", uk: "Я тобі поясню, щоб ти зрозумів." }
        - level: B1
          point: { term: para }
          rule:
            en: "a purpose with the same subject: infinitive"
            es: "una finalidad con el mismo sujeto: infinitivo"
            uk: "мета з тим самим підметом: інфінітив"
          ex: ["Estudio para ", { target: aprender }, "."]
          tr: { en: I study to learn., uk: "Я займаюся, щоб навчитися." }
        - level: B1
          point: { alternatives: [{ term: antes de }, { term: después de }] }
          rule:
            en: "the same subject: infinitive"
            es: "el mismo sujeto: infinitivo"
            uk: "той самий підмет: інфінітив"
          ex: ["Me lavo las manos antes de ", { target: comer }, "."]
          tr: { en: I wash my hands before eating., uk: "Я мию руки перед їжею." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["never the future after ", { term: cuando }]
            es: ["nunca futuro detrás de ", { term: cuando }]
            uk: ["ніколи не вживають майбутнього часу після ", { term: cuando }]
          ex: ["Cuando ", { target: sea }, " mayor, seré médico."]
          tr: { en: "When I grow up, I'll be a doctor.", uk: "Коли виросту, стану лікарем." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["the question word ", { term: cuándo }, " takes the indicative"]
            es: ["el interrogativo ", { term: cuándo }, " lleva indicativo"]
            uk: ["питальне слово ", { term: cuándo }, " вимагає дійсного способу"]
          ex: ["¿Cuándo ", { target: vienes }, "?"]
          tr: { en: When are you coming?, uk: "Коли ти прийдеш?" }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A time word with a future event takes the subjunctive."
              es: "Una palabra de tiempo con un hecho futuro lleva subjuntivo."
              uk: "Слово часу з майбутньою подією вимагає суб’юнктива."
          - type: rule
            level: B1
            text:
              en: ["A purpose with another subject takes ", { term: para que }, " and the subjunctive."]
              es: ["Una finalidad con otro sujeto lleva ", { term: para que }, " y subjuntivo."]
              uk: ["Мета з іншим підметом вимагає ", { term: para que }, " і суб’юнктива."]
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: para }, ", ", { term: antes de }, " and ", { term: después de }, " take the infinitive."]
              es: ["Con el mismo sujeto, ", { term: para }, ", ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo."]
              uk: ["З тим самим підметом ", { term: para }, ", ", { term: antes de }, " та ", { term: después de }, " вимагають інфінітива."]
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми: ", { link: "Теперішній час суб’юнктива: форми", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: time words", es: "Uso: palabras de tiempo", uk: "Ужиток: слова часу" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: Сполучник } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, linker: cuando, ex: ["Cuando ", { target: termine }, ", te llamo."], tr: { en: "When I finish, I'll call you.", uk: "Коли закінчу, подзвоню тобі." } }
          - { level: B1, linker: hasta que, ex: ["No me voy hasta que ", { target: vuelvas }, "."], tr: { en: "I won't leave until you come back.", uk: "Я не піду, доки ти не повернешся." } }
          - { level: B1, linker: después de que, ex: ["Saldremos después de que ", { target: pare }, " la lluvia."], tr: { en: "We'll go out after the rain stops.", uk: "Ми вийдемо, коли перестане дощ." } }
          - { level: B1, linker: antes de que, ex: ["Vuelve antes de que ", { target: oscurezca }, "."], tr: { en: Come back before it gets dark., uk: "Повертайся, поки не стемніло." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["For a habit or the past, ", { term: cuando }, " and ", { term: hasta que }, " take the indicative:"]
              es: ["Para un hábito o el pasado, ", { term: cuando }, " y ", { term: hasta que }, " llevan indicativo:"]
              uk: ["Для звички чи минулого ", { term: cuando }, " та ", { term: hasta que }, " вимагають дійсного способу:"]
            ex: ["Cuando ", { target: llueve }, ", me quedo en casa."]
            tr: { en: "When it rains, I stay at home.", uk: "Коли йде дощ, я сиджу вдома." }
          - type: rule
            level: B1
            text:
              en: [{ term: antes de que }, " always takes the subjunctive, even for a habit:"]
              es: [{ term: antes de que }, " lleva siempre subjuntivo, también para un hábito:"]
              uk: [{ term: antes de que }, " завжди вимагає суб’юнктива, навіть для звички:"]
            ex: ["Siempre salgo antes de que ", { target: lleguen }, " los demás."]
            tr: { en: I always leave before the others arrive., uk: "Я завжди виходжу раніше, ніж прийдуть інші." }

  - title: { en: "Compare: cuando with the indicative and the subjunctive", es: "Comparación: cuando con indicativo y con subjuntivo", uk: "Порівняння: cuando з дійсним способом і з суб’юнктивом" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: ind, label: { en: Indicative, es: Indicativo, uk: Дійсний спосіб } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo, uk: Суб’юнктив } }
        rows:
          - { level: B1, ind: { en: a habit or a fact, es: un hábito o un hecho, uk: звичка або факт }, sbjv: { en: an event still to come, es: un hecho todavía por llegar, uk: "подія, яка ще має статися" } }
          - level: B1
            ind: { ex: ["Cuando ", { target: tengo }, " hambre, como fruta."], tr: { en: "When I'm hungry, I eat fruit.", uk: "Коли я голодний, я їм фрукти." } }
            sbjv: { ex: ["Cuando ", { target: tenga }, " hambre, comeré."], tr: { en: "When I'm hungry, I'll eat.", uk: "Коли зголоднію, поїм." } }
          - level: B1
            ind: { ex: ["Cuando ", { target: llegué }, ", no había nadie."], tr: { en: "When I arrived, there was nobody there.", uk: "Коли я прийшов, нікого не було." } }
            sbjv: { ex: ["Cuando ", { target: llegues }, ", avísame."], tr: { en: Let me know when you arrive., uk: "Дай знати, коли приїдеш." } }

  - title: { en: "Use: purpose", es: "Uso: finalidad", uk: "Ужиток: мета" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, es: Estructura, uk: "Схема" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, form: { pattern: [{ term: para }, { slot: infinitive }] }, ex: ["Ahorro para ", { target: comprar }, " una casa."], tr: { en: "I'm saving to buy a house.", uk: "Я відкладаю гроші, щоб купити будинок." } }
          - { level: B1, form: { pattern: [{ term: para que }, { slot: { en: subjunctive, es: subjuntivo, uk: суб’юнктив } }] }, ex: ["Te doy mi número para que me ", { target: llames }, "."], tr: { en: "I'm giving you my number so that you can call me.", uk: "Даю тобі свій номер, щоб ти мені подзвонив." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: para que }, " needs a different subject; with the same subject, ", { term: para }, " takes the infinitive."]
              es: [{ term: para que }, " necesita otro sujeto; con el mismo sujeto, ", { term: para }, " lleva infinitivo."]
              uk: [{ term: para que }, " потребує іншого підмета; з тим самим підметом ", { term: para }, " вимагає інфінітива."]

  - title: { en: The same subject, es: El mismo sujeto, uk: Той самий підмет }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: antes de }, " and ", { term: después de }, " take the infinitive:"]
              es: ["Con el mismo sujeto, ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo:"]
              uk: ["З тим самим підметом ", { term: antes de }, " та ", { term: después de }, " вимагають інфінітива:"]
            ex: { examples: [["Desayuno antes de ", { target: salir }, "."], ["Después de ", { target: cenar }, ", vemos la tele."]] }
            tr: { en: { examples: [I have breakfast before I go out., "After dinner, we watch TV."] }, uk: { examples: ["Я снідаю, перш ніж вийти.", "Після вечері ми дивимося телевізор."] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Cuando llegaré, te llamo.", right: ["Cuando ", { target: llegue }, ", te llamo."], rule: { en: ["a future event after ", { term: cuando }, " takes the subjunctive"], es: ["un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo"], uk: ["майбутня подія після ", { term: cuando }, " потребує суб’юнктива, хоча українською після «коли» кажемо майбутній час: «коли приїду»"] } }
          - { level: B1, wrong: "Cuando llegas mañana, llámame.", right: ["Cuando ", { target: llegues }, " mañana, llámame."], rule: { en: ["a future event after ", { term: cuando }, " takes the subjunctive"], es: ["un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo"], uk: ["майбутня подія після ", { term: cuando }, " потребує суб’юнктива, хоча українською після «коли» кажемо майбутній час: «коли приїду»"] } }
          - { level: B1, wrong: Te llamo para que hablamos., right: ["Te llamo para que ", { target: hablemos }, "."], rule: { en: [{ term: para que }, " takes the subjunctive"], es: [{ term: para que }, " lleva subjuntivo"], uk: [{ term: para que }, " вимагає суб’юнктива"] } }
          - { level: B1, wrong: Estudio para que aprendo., right: ["Estudio para ", { target: aprender }, "."], rule: { en: ["the same subject takes ", { term: para }, " and the infinitive"], es: ["el mismo sujeto lleva ", { term: para }, " e infinitivo"], uk: ["з тим самим підметом уживають ", { term: para }, " та інфінітив"] } }
          - { level: B1, wrong: "Antes de que salgo, desayuno.", right: ["Antes de ", { target: salir }, ", desayuno."], rule: { en: ["the same subject takes ", { term: antes de }, " and the infinitive"], es: ["el mismo sujeto lleva ", { term: antes de }, " e infinitivo"], uk: ["з тим самим підметом уживають ", { term: antes de }, " та інфінітив"] } }
          - { level: B1, speakers: [en], wrong: ¿Cuándo llegues?, right: ["¿Cuándo ", { target: llegas }, "?"], rule: { en: ["the question word ", { term: cuándo }, " takes the indicative"] } }
          - { level: B1, speakers: [uk], wrong: Te lo explico para que lo entendiste., right: ["Te lo explico para que lo ", { target: entiendas }, "."], rule: { uk: ["після ", { term: para que }, " іде теперішній час суб’юнктива, хоча українською після «щоб» кажемо минулий час: «щоб ти зрозумів»"] } }
