title: { en: "Subjunctive after cuando, para que, antes de que", es: "El subjuntivo con cuando, para que, antes de que", uk: "Суб’юнктив після cuando, para que, antes de que", pt: "O subjuntivo com cuando, para que, antes de que", fr: "Le subjonctif avec cuando, para que, antes de que", de: "Der Konjunktiv nach cuando, para que, antes de que", it: "Il congiuntivo con cuando, para que, antes de que", pl: "Tryb łączący z cuando, para que, antes de que", tr: "cuando, para que, antes de que ile dilek kipi", id: "Subjungtif dengan cuando, para que, antes de que", vi: "Thức giả định với cuando, para que, antes de que" }
summary:
  lead:
    en: [{ term: Cuando }, " takes the subjunctive for a future event, and ", { term: para que }, " and ", { term: antes de que }, " always take it: ", { term: cuando llegues }, "."]
    es: [{ term: Cuando }, " lleva subjuntivo para un hecho futuro, y ", { term: para que }, " y ", { term: antes de que }, " lo llevan siempre: ", { term: cuando llegues }, "."]
    uk: [{ term: Cuando }, " вимагає суб’юнктива для майбутньої події, а ", { term: para que }, " та ", { term: antes de que }, " — завжди: ", { term: cuando llegues }, "."]
    pt: [{ term: Cuando }, " pede subjuntivo para um fato futuro, e ", { term: para que }, " e ", { term: antes de que }, " sempre o pedem: ", { term: cuando llegues }, "."]
    fr: [{ term: Cuando }, " demande le subjonctif pour un fait à venir, et ", { term: para que }, " et ", { term: antes de que }, " le demandent toujours : ", { term: cuando llegues }, "."]
    de: [{ term: Cuando }, " steht bei einem künftigen Ereignis mit dem Konjunktiv, ", { term: para que }, " und ", { term: antes de que }, " immer: ", { term: cuando llegues }, "."]
    it: [{ term: Cuando }, " richiede il congiuntivo per un fatto futuro, e ", { term: para que }, " e ", { term: antes de que }, " lo richiedono sempre: ", { term: cuando llegues }, "."]
    pl: [{ term: Cuando }, " wymaga trybu łączącego przy zdarzeniu przyszłym, a ", { term: para que }, " i ", { term: antes de que }, " wymagają go zawsze: ", { term: cuando llegues }, "."]
    tr: [{ term: Cuando }, " gelecekteki bir olay için dilek kipi ister; ", { term: para que }, " ve ", { term: antes de que }, " her zaman ister: ", { term: cuando llegues }, "."]
    id: [{ term: Cuando }, " memakai subjungtif untuk peristiwa yang akan datang, dan ", { term: para que }, " serta ", { term: antes de que }, " selalu memakainya: ", { term: cuando llegues }, "."]
    vi: [{ term: Cuando }, " đi với thức giả định cho sự việc tương lai; ", { term: para que }, " và ", { term: antes de que }, " luôn đi với thức giả định: ", { term: cuando llegues }, "."]
  rule:
    en: ["A future event after ", { term: cuando }, " takes the subjunctive, never the future:"]
    es: ["Un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo, nunca futuro:"]
    uk: ["Майбутня подія після ", { term: cuando }, " стоїть у суб’юнктиві, ніколи не в майбутньому часі:"]
    pt: ["Um fato futuro depois de ", { term: cuando }, " pede subjuntivo, nunca o futuro:"]
    fr: ["Un fait à venir après ", { term: cuando }, " prend le subjonctif, jamais le futur :"]
    de: ["Ein künftiges Ereignis nach ", { term: cuando }, " steht im Konjunktiv, nie im Futur:"]
    it: ["Un fatto futuro dopo ", { term: cuando }, " vuole il congiuntivo, mai il futuro:"]
    pl: ["Zdarzenie przyszłe po ", { term: cuando }, " występuje w trybie łączącym, nigdy w czasie przyszłym:"]
    tr: ["Gelecekteki bir olay için ", { term: cuando }, " dilek kipi ister, asla gelecek zaman istemez:"]
    id: ["Peristiwa yang akan datang setelah ", { term: cuando }, " memakai subjungtif, tidak pernah futuro:"]
    vi: ["Sau ", { term: cuando }, ", sự việc tương lai dùng thức giả định, không dùng thì tương lai:"]
  ex: { examples: [["Cuando ", { target: llegues }, ", llámame."], ["Te lo diré cuando lo ", { target: vea }, "."]] }

