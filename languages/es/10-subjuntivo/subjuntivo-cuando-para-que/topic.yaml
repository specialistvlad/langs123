              pt: "Um conectivo de tempo com um fato futuro pede subjuntivo."
              fr: "Un connecteur de temps suivi d’un fait à venir prend le subjonctif."
              de: "Ein zeitliches Bindewort mit einem künftigen Ereignis steht mit dem Konjunktiv."
              it: "Un connettivo di tempo con un fatto futuro vuole il congiuntivo."
              pl: "Słowo łączące czasu przy zdarzeniu przyszłym wymaga trybu łączącego."
              tr: "Gelecekteki bir olayla kullanılan zaman bağlayıcısı dilek kipi ister."
              id: "Kata penghubung waktu dengan peristiwa yang akan datang memakai subjungtif."
              vi: "Từ nối chỉ thời gian đi với sự việc ở tương lai thì dùng thức giả định."
          - type: rule
            level: B1
            text:
              en: ["A purpose with another subject takes ", { term: para que }, " and the subjunctive."]
              es: ["Una finalidad con otro sujeto lleva ", { term: para que }, " y subjuntivo."]
              uk: ["Мета з іншим підметом вимагає ", { term: para que }, " і суб’юнктива."]
              pt: ["Uma finalidade com outro sujeito usa ", { term: para que }, " e subjuntivo."]
              fr: ["Un but avec un autre sujet s’exprime avec ", { term: para que }, " et le subjonctif."]
              de: ["Ein Zweck mit anderem Subjekt steht mit ", { term: para que }, " und dem Konjunktiv."]
              it: ["Una finalità con un altro soggetto richiede ", { term: para que }, " e il congiuntivo."]
              pl: ["Cel z innym podmiotem wymaga ", { term: para que }, " i trybu łączącego."]
              tr: ["Başka özneli bir amaç ", { term: para que }, " ve dilek kipiyle kurulur."]
              id: ["Tujuan dengan subjek lain memakai ", { term: para que }, " dan subjungtif."]
              vi: ["Mục đích có chủ ngữ khác dùng ", { term: para que }, " và thức giả định."]
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: para }, ", ", { term: antes de }, " and ", { term: después de }, " take the infinitive."]
              es: ["Con el mismo sujeto, ", { term: para }, ", ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo."]
