            id: "tujuan yang gagal: hasilnya bertentangan dengan usaha"
            vi: "mục đích bị phá vỡ: kết quả trái với nỗ lực"
          ex: ["Trabajé todo el año para que ni me ", { target: dieran }, " las gracias."]
          tr: { en: "I worked all year, and they didn't even thank me.", uk: "Я працював цілий рік, а мені навіть не подякували.", pt: "Trabalhei o ano inteiro e nem me agradeceram.", fr: "J’ai travaillé toute l’année, et on ne m’a même pas remercié.", de: "Ich habe das ganze Jahr gearbeitet, und nicht einmal bedankt hat man sich.", it: "Ho lavorato tutto l'anno e non mi hanno nemmeno ringraziato.", pl: "Pracowałem cały rok, a nawet mi nie podziękowano.", tr: "Bütün yıl çalıştım, ama bana teşekkür bile etmediler.", id: "Saya bekerja sepanjang tahun, tetapi mereka bahkan tidak berterima kasih.", vi: "Tôi làm việc suốt cả năm mà họ còn chẳng cảm ơn." }
