sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A time word with a future event takes the subjunctive."
              es: "Una palabra de tiempo con un hecho futuro lleva subjuntivo."
              uk: "Слово часу з майбутньою подією вимагає суб’юнктива."
              pt: "Um conectivo de tempo com um fato futuro pede subjuntivo."
              fr: "Un connecteur de temps suivi d’un fait à venir prend le subjonctif."
              de: "Ein zeitliches Bindewort mit einem künftigen Ereignis steht mit dem Konjunktiv."
              it: "Un connettivo di tempo con un fatto futuro vuole il congiuntivo."
              pl: "Słowo łączące czasu przy zdarzeniu przyszłym wymaga trybu łączącego."
              tr: "Gelecekteki bir olayla kullanılan zaman bağlayıcısı dilek kipi ister."
              id: "Kata penghubung waktu dengan peristiwa yang akan datang memakai subjungtif."
              vi: "Từ nối chỉ thời gian đi với sự việc ở tương lai thì dùng thức giả định."
          - type: rule
            level: B1
            text:
              en: ["A purpose with another subject takes ", { term: para que }, " and the subjunctive."]
              es: ["Una finalidad con otro sujeto lleva ", { term: para que }, " y subjuntivo."]
              uk: ["Мета з іншим підметом вимагає ", { term: para que }, " і суб’юнктива."]
              pt: ["Uma finalidade com outro sujeito usa ", { term: para que }, " e subjuntivo."]
              fr: ["Un but avec un autre sujet s’exprime avec ", { term: para que }, " et le subjonctif."]
              de: ["Ein Zweck mit anderem Subjekt steht mit ", { term: para que }, " und dem Konjunktiv."]
              it: ["Una finalità con un altro soggetto richiede ", { term: para que }, " e il congiuntivo."]
              pl: ["Cel z innym podmiotem wymaga ", { term: para que }, " i trybu łączącego."]
              tr: ["Başka özneli bir amaç ", { term: para que }, " ve dilek kipiyle kurulur."]
              id: ["Tujuan dengan subjek lain memakai ", { term: para que }, " dan subjungtif."]
              vi: ["Mục đích có chủ ngữ khác dùng ", { term: para que }, " và thức giả định."]
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: para }, ", ", { term: antes de }, " and ", { term: después de }, " take the infinitive."]
              es: ["Con el mismo sujeto, ", { term: para }, ", ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo."]
              uk: ["З тим самим підметом ", { term: para }, ", ", { term: antes de }, " та ", { term: después de }, " вимагають інфінітива."]
              pt: ["Com o mesmo sujeito, ", { term: para }, ", ", { term: antes de }, " e ", { term: después de }, " levam o infinitivo."]
              fr: ["Avec le même sujet, ", { term: para }, ", ", { term: antes de }, " et ", { term: después de }, " prennent l’infinitif."]
              de: ["Bei demselben Subjekt stehen ", { term: para }, ", ", { term: antes de }, " und ", { term: después de }, " mit dem Infinitiv."]
              it: ["Con lo stesso soggetto, ", { term: para }, ", ", { term: antes de }, " e ", { term: después de }, " vogliono l'infinito."]
              pl: ["Przy tym samym podmiocie ", { term: para }, ", ", { term: antes de }, " i ", { term: después de }, " łączą się z bezokolicznikiem."]
              tr: ["Özne aynıysa ", { term: para }, ", ", { term: antes de }, " ve ", { term: después de }, " mastarla kullanılır."]
              id: ["Dengan subjek yang sama, ", { term: para }, ", ", { term: antes de }, " dan ", { term: después de }, " memakai infinitif."]
              vi: ["Khi cùng chủ ngữ, ", { term: para }, ", ", { term: antes de }, " và ", { term: después de }, " đi với động từ nguyên mẫu."]
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми: ", { link: "Теперішній час суб’юнктива: форми", to: es.subjuntivo.subjuntivo-formas }, "."]
              pt: ["As formas: ", { link: "O presente do subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              fr: ["Les formes : ", { link: "Le présent du subjonctif : formes", to: es.subjuntivo.subjuntivo-formas }, "."]
              de: ["Die Formen: ", { link: "Der Konjunktiv Präsens: Formen", to: es.subjuntivo.subjuntivo-formas }, "."]
              it: ["Le forme: ", { link: "Il presente del congiuntivo: forme", to: es.subjuntivo.subjuntivo-formas }, "."]
              pl: ["Formy: ", { link: "Tryb łączący czasu teraźniejszego: formy", to: es.subjuntivo.subjuntivo-formas }, "."]
              tr: ["Biçimler: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: es.subjuntivo.subjuntivo-formas }, "."]
              id: ["Bentuknya: ", { link: "Presente subjungtif: bentuk", to: es.subjuntivo.subjuntivo-formas }, "."]
              vi: ["Các dạng: ", { link: "Thì hiện tại của thức giả định: các dạng", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: time words", es: "Uso: palabras de tiempo", uk: "Ужиток: слова часу", pt: "Uso: conectivos de tempo", fr: "Emploi : connecteurs de temps", de: "Gebrauch: zeitliche Bindewörter", it: "Uso: connettivi di tempo", pl: "Użycie: słowa łączące czasu", tr: "Kullanım: zaman bağlayıcıları", id: "Penggunaan: kata penghubung waktu", vi: "Cách dùng: từ nối chỉ thời gian" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector, uk: Сполучник, pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, linker: cuando, ex: ["Cuando ", { target: termine }, ", te llamo."], tr: { en: "When I finish, I'll call you.", uk: "Коли закінчу, подзвоню тобі.", pt: "Quando eu terminar, ligo para você.", fr: "Quand j’aurai fini, je t’appellerai.", de: "Wenn ich fertig bin, rufe ich dich an.", it: "Quando avrò finito, ti chiamo.", pl: "Kiedy skończę, zadzwonię do ciebie.", tr: "Bitirince seni ararım.", id: "Kalau sudah selesai, saya akan meneleponmu.", vi: "Khi làm xong, tôi sẽ gọi cho bạn." } }
          - { level: B1, linker: hasta que, ex: ["No me voy hasta que ", { target: vuelvas }, "."], tr: { en: "I won't leave until you come back.", uk: "Я не піду, доки ти не повернешся.", pt: "Não vou embora até você voltar.", fr: "Je ne m’en vais pas avant que tu reviennes.", de: "Ich gehe nicht weg, bis du zurückkommst.", it: "Non me ne vado finché non torni.", pl: "Nie wyjdę, dopóki nie wrócisz.", tr: "Sen dönene kadar gitmiyorum.", id: "Saya tidak akan pergi sampai kamu kembali.", vi: "Tôi sẽ không đi cho đến khi bạn quay lại." } }
          - { level: B1, linker: después de que, ex: ["Saldremos después de que ", { target: pare }, " la lluvia."], tr: { en: "We'll go out after the rain stops.", uk: "Ми вийдемо, коли перестане дощ.", pt: "Vamos sair depois que a chuva parar.", fr: "Nous sortirons après que la pluie aura cessé.", de: "Wir gehen raus, nachdem der Regen aufgehört hat.", it: "Usciremo dopo che avrà smesso di piovere.", pl: "Wyjdziemy, kiedy przestanie padać.", tr: "Yağmur dindikten sonra dışarı çıkacağız.", id: "Kita akan keluar setelah hujan berhenti.", vi: "Chúng ta sẽ ra ngoài sau khi mưa tạnh." } }
          - { level: B1, linker: antes de que, ex: ["Vuelve antes de que ", { target: oscurezca }, "."], tr: { en: Come back before it gets dark., uk: "Повертайся, поки не стемніло.", pt: "Volte antes que escureça.", fr: "Reviens avant qu’il fasse nuit.", de: "Komm zurück, bevor es dunkel wird.", it: "Torna prima che faccia buio.", pl: "Wróć, zanim się ściemni.", tr: "Hava kararmadan dön.", id: "Kembalilah sebelum gelap.", vi: "Hãy quay lại trước khi trời tối." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["For a habit or the past, ", { term: cuando }, " and ", { term: hasta que }, " take the indicative:"]
              es: ["Para un hábito o el pasado, ", { term: cuando }, " y ", { term: hasta que }, " llevan indicativo:"]
              uk: ["Для звички чи минулого ", { term: cuando }, " та ", { term: hasta que }, " вимагають дійсного способу:"]
              pt: ["Para um hábito ou o passado, ", { term: cuando }, " e ", { term: hasta que }, " levam indicativo:"]
              fr: ["Pour une habitude ou le passé, ", { term: cuando }, " et ", { term: hasta que }, " prennent l’indicatif :"]
              de: ["Bei einer Gewohnheit oder in der Vergangenheit stehen ", { term: cuando }, " und ", { term: hasta que }, " mit dem Indikativ:"]
              it: ["Per un'abitudine o il passato, ", { term: cuando }, " e ", { term: hasta que }, " vogliono l'indicativo:"]
              pl: ["Przy zwyczaju lub przeszłości ", { term: cuando }, " i ", { term: hasta que }, " wymagają trybu oznajmującego:"]
              tr: ["Alışkanlık ya da geçmiş için ", { term: cuando }, " ve ", { term: hasta que }, " haber kipiyle kullanılır:"]
              id: ["Untuk kebiasaan atau masa lalu, ", { term: cuando }, " dan ", { term: hasta que }, " memakai indikatif:"]
              vi: ["Với thói quen hoặc quá khứ, ", { term: cuando }, " và ", { term: hasta que }, " đi với thức chỉ định:"]
            ex: ["Cuando ", { target: llueve }, ", me quedo en casa."]
            tr: { en: "When it rains, I stay at home.", uk: "Коли йде дощ, я сиджу вдома.", pt: "Quando chove, eu fico em casa.", fr: "Quand il pleut, je reste à la maison.", de: "Wenn es regnet, bleibe ich zu Hause.", it: "Quando piove, resto a casa.", pl: "Kiedy pada deszcz, zostaję w domu.", tr: "Yağmur yağınca evde kalırım.", id: "Kalau hujan, saya tinggal di rumah.", vi: "Khi trời mưa, tôi ở nhà." }
          - type: rule
            level: B1
            text:
              en: [{ term: antes de que }, " always takes the subjunctive, even for a habit:"]
              es: [{ term: antes de que }, " lleva siempre subjuntivo, también para un hábito:"]
              uk: [{ term: antes de que }, " завжди вимагає суб’юнктива, навіть для звички:"]
              pt: [{ term: antes de que }, " sempre pede subjuntivo, até para um hábito:"]
              fr: [{ term: antes de que }, " prend toujours le subjonctif, même pour une habitude :"]
              de: [{ term: antes de que }, " steht immer mit dem Konjunktiv, auch bei einer Gewohnheit:"]
              it: [{ term: antes de que }, " vuole sempre il congiuntivo, anche per un'abitudine:"]
              pl: [{ term: antes de que }, " wymaga zawsze trybu łączącego, także przy zwyczaju:"]
              tr: [{ term: antes de que }, " her zaman dilek kipiyle kullanılır, alışkanlık için bile:"]
              id: [{ term: antes de que }, " selalu memakai subjungtif, bahkan untuk kebiasaan:"]
              vi: [{ term: antes de que }, " luôn đi với thức giả định, kể cả với thói quen:"]
            ex: ["Siempre salgo antes de que ", { target: lleguen }, " los demás."]
            tr: { en: I always leave before the others arrive., uk: "Я завжди виходжу раніше, ніж прийдуть інші.", pt: "Eu sempre saio antes que os outros cheguem.", fr: "Je pars toujours avant que les autres arrivent.", de: "Ich gehe immer, bevor die anderen kommen.", it: "Esco sempre prima che arrivino gli altri.", pl: "Zawsze wychodzę, zanim przyjdą inni.", tr: "Ben her zaman diğerleri gelmeden çıkarım.", id: "Saya selalu pergi sebelum yang lain tiba.", vi: "Tôi luôn đi trước khi những người khác đến." }
      - type: usage
        columns:
          - { key: linker, label: { es: Conector, en: "Linker", uk: "Сполучник", pt: "Conectivo", fr: "Connecteur", de: "Bindewort", it: "Connettivo", pl: "Słowo łączące", tr: "Bağlayıcı", id: "Kata penghubung", vi: "Từ nối" } }
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            linker: { alternatives: [una vez que, apenas, en cuanto, tan pronto como, en el momento en que] }
            use: { es: "un hecho futuro: subjuntivo; un hecho pasado: indicativo", en: "a future event: subjunctive; a past event: indicative", uk: "майбутня подія: суб’юнктив; минула подія: дійсний спосіб", pt: "um fato futuro: subjuntivo; um fato passado: indicativo", fr: "un fait à venir : subjonctif ; un fait passé : indicatif", de: "ein künftiges Ereignis: Konjunktiv; ein vergangenes Ereignis: Indikativ", it: "un fatto futuro: congiuntivo; un fatto passato: indicativo", pl: "zdarzenie przyszłe: tryb łączący; zdarzenie przeszłe: tryb oznajmujący", tr: "gelecekteki olay: dilek kipi; geçmişteki olay: haber kipi", id: "peristiwa yang akan datang: subjungtif; peristiwa lampau: indikatif", vi: "sự việc ở tương lai: thức giả định; sự việc trong quá khứ: thức chỉ định" }
            ex: { examples: [["Una vez que ", { target: hayamos leído }, " el informe, decidiremos."], ["En cuanto ", { target: llegue }, " el paquete, te escribo."], ["Apenas ", { target: salí }, ", empezó a llover."]] }
            tr: { en: { examples: ["Once we have read the report, we'll decide.", "As soon as the package arrives, I'll write to you.", "I had barely gone out when it started to rain."] }, uk: { examples: ["Щойно ми прочитаємо звіт, ми вирішимо.", "Щойно прийде посилка, я тобі напишу.", "Щойно я вийшов, почався дощ."] }, pt: { examples: ["Depois que lermos o relatório, decidiremos.", "Assim que o pacote chegar, eu te escrevo.", "Mal saí, começou a chover."] }, fr: { examples: ["Une fois que nous aurons lu le rapport, nous déciderons.", "Dès que le colis arrivera, je t’écrirai.", "À peine étais-je sorti qu’il s’est mis à pleuvoir."] }, de: { examples: ["Sobald wir den Bericht gelesen haben, entscheiden wir.", "Sobald das Paket ankommt, schreibe ich dir.", "Kaum war ich draußen, fing es an zu regnen."] }, it: { examples: ["Una volta che avremo letto il rapporto, decideremo.", "Appena arriva il pacco, ti scrivo.", "Appena sono uscito, ha cominciato a piovere."] }, pl: { examples: ["Kiedy przeczytamy raport, podejmiemy decyzję.", "Jak tylko przyjdzie paczka, napiszę do ciebie.", "Ledwo wyszedłem, zaczęło padać."] }, tr: { examples: ["Raporu okuduktan sonra karar vereceğiz.", "Paket gelir gelmez sana yazarım.", "Çıkar çıkmaz yağmur başladı."] }, id: { examples: ["Setelah kami membaca laporannya, kami akan memutuskan.", "Begitu paketnya tiba, saya akan menulis kepadamu.", "Begitu saya keluar, hujan mulai turun."] }, vi: { examples: ["Sau khi chúng tôi đọc xong báo cáo, chúng tôi sẽ quyết định.", "Ngay khi gói hàng đến, tôi sẽ nhắn cho bạn.", "Tôi vừa ra khỏi nhà thì trời bắt đầu mưa."] } }
          - level: B2
            linker: antes de que
            use: { es: "un hecho pasado: imperfecto de subjuntivo", en: "a past event: imperfect subjunctive", uk: "минула подія: імперфект суб’юнктива", pt: "um fato passado: imperfeito do subjuntivo", fr: "un fait passé : imparfait du subjonctif", de: "ein vergangenes Ereignis: Konjunktiv Imperfecto", it: "un fatto passato: imperfetto del congiuntivo", pl: "zdarzenie przeszłe: imperfecto trybu łączącego", tr: "geçmişteki olay: dilek kipinin imperfecto biçimi", id: "peristiwa lampau: imperfecto subjungtif", vi: "sự việc trong quá khứ: imperfecto của thức giả định" }
            ex: ["Se fue antes de que ", { target: llegáramos }, "."]
            tr: { en: "He left before we arrived.", uk: "Він пішов до того, як ми приїхали.", pt: "Ele foi embora antes que chegássemos.", fr: "Il est parti avant que nous arrivions.", de: "Er ging weg, bevor wir ankamen.", it: "Se n'è andato prima che arrivassimo.", pl: "Wyszedł, zanim dotarliśmy.", tr: "Biz gelmeden önce gitti.", id: "Dia pergi sebelum kami tiba.", vi: "Anh ấy đã đi trước khi chúng tôi đến." }
