id: es.subjuntivo.subjuntivo-cuando-para-que
lang: es
kind: grammar
tags: [verbs, subjunctive, clauses, time, purpose]
concepts: [subjunctive, linkers]
related: [es.subjuntivo.subjuntivo-formas, es.subjuntivo.subjuntivo-deseos-dudas, es.futuro-condicional.futuro-simple, es.oracion.conectores]
status: { en: draft, es: draft }
translated: { es: "af3151 9c3153 65bfb2 15619a a408e0 34061c ad6285 17bffe" }

title: { en: "Subjunctive after cuando, para que, antes de que", es: "El subjuntivo con cuando, para que, antes de que" }
summary:
  lead:
    en: [{ term: Cuando }, " takes the subjunctive for a future event, and ", { term: para que }, " and ", { term: antes de que }, " always take it: ", { term: cuando llegues }, "."]
    es: [{ term: Cuando }, " lleva subjuntivo para un hecho futuro, y ", { term: para que }, " y ", { term: antes de que }, " lo llevan siempre: ", { term: cuando llegues }, "."]
  rule:
    en: ["A future event after ", { term: cuando }, " takes the subjunctive, never the future:"]
    es: ["Un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo, nunca futuro:"]
  ex: { examples: [["Cuando ", { target: llegues }, ", llámame."], ["Te lo diré cuando lo ", { target: vea }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { term: cuando }
          rule:
            en: "a future event: subjunctive"
            es: "un hecho futuro: subjuntivo"
          ex: ["Cuando ", { target: tenga }, " dinero, viajaré."]
          tr: { en: "When I have money, I'll travel." }
        - level: B1
          point: { term: cuando }
          rule:
            en: "a habit or the past: indicative"
            es: "un hábito o el pasado: indicativo"
          ex: ["Cuando ", { target: tengo }, " tiempo, leo."]
          tr: { en: "When I have time, I read." }
        - level: B1
          point: { term: hasta que }
          rule:
            en: ["the same as ", { term: cuando }]
            es: ["igual que ", { term: cuando }]
          ex: ["Espera aquí hasta que ", { target: vuelva }, "."]
          tr: { en: Wait here until I come back. }
        - level: B1
          point: { term: después de que }
          rule:
            en: "a future event: subjunctive"
            es: "un hecho futuro: subjuntivo"
          ex: ["Cenaremos después de que ", { target: lleguen }, " los niños."]
          tr: { en: "We'll have dinner after the children arrive." }
        - level: B1
          point: { term: antes de que }
          rule:
            en: "always the subjunctive"
            es: "siempre subjuntivo"
          ex: ["Vámonos antes de que ", { target: llueva }, "."]
          tr: { en: "Let's go before it rains." }
        - level: B1
          point: { term: para que }
          rule:
            en: "a purpose with another subject: subjunctive"
            es: "una finalidad con otro sujeto: subjuntivo"
          ex: ["Te lo explico para que lo ", { target: entiendas }, "."]
          tr: { en: "I'll explain it so that you understand it." }
        - level: B1
          point: { term: para }
          rule:
            en: "a purpose with the same subject: infinitive"
            es: "una finalidad con el mismo sujeto: infinitivo"
          ex: ["Estudio para ", { target: aprender }, "."]
          tr: { en: I study to learn. }
        - level: B1
          point: { alternatives: [{ term: antes de }, { term: después de }] }
          rule:
            en: "the same subject: infinitive"
            es: "el mismo sujeto: infinitivo"
          ex: ["Me lavo las manos antes de ", { target: comer }, "."]
          tr: { en: I wash my hands before eating. }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["never the future after ", { term: cuando }]
            es: ["nunca futuro detrás de ", { term: cuando }]
          ex: ["Cuando ", { target: sea }, " mayor, seré médico."]
          tr: { en: "When I grow up, I'll be a doctor." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["the question word ", { term: cuándo }, " takes the indicative"]
            es: ["el interrogativo ", { term: cuándo }, " lleva indicativo"]
          ex: ["¿Cuándo ", { target: vienes }, "?"]
          tr: { en: When are you coming? }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A time word with a future event takes the subjunctive."
              es: "Una palabra de tiempo con un hecho futuro lleva subjuntivo."
          - type: rule
            level: B1
            text:
              en: ["A purpose with another subject takes ", { term: para que }, " and the subjunctive."]
              es: ["Una finalidad con otro sujeto lleva ", { term: para que }, " y subjuntivo."]
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: para }, ", ", { term: antes de }, " and ", { term: después de }, " take the infinitive."]
              es: ["Con el mismo sujeto, ", { term: para }, ", ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo."]
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: time words", es: "Uso: palabras de tiempo" }
    role: use
    content:
      - type: usage
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, linker: cuando, ex: ["Cuando ", { target: termine }, ", te llamo."], tr: { en: "When I finish, I'll call you." } }
          - { level: B1, linker: hasta que, ex: ["No me voy hasta que ", { target: vuelvas }, "."], tr: { en: "I won't leave until you come back." } }
          - { level: B1, linker: después de que, ex: ["Saldremos después de que ", { target: pare }, " la lluvia."], tr: { en: "We'll go out after the rain stops." } }
          - { level: B1, linker: antes de que, ex: ["Vuelve antes de que ", { target: oscurezca }, "."], tr: { en: Come back before it gets dark. } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["For a habit or the past, ", { term: cuando }, " and ", { term: hasta que }, " take the indicative:"]
              es: ["Para un hábito o el pasado, ", { term: cuando }, " y ", { term: hasta que }, " llevan indicativo:"]
            ex: ["Cuando ", { target: llueve }, ", me quedo en casa."]
            tr: { en: "When it rains, I stay at home." }
          - type: rule
            level: B1
            text:
              en: [{ term: antes de que }, " always takes the subjunctive, even for a habit:"]
              es: [{ term: antes de que }, " lleva siempre subjuntivo, también para un hábito:"]
            ex: ["Siempre salgo antes de que ", { target: lleguen }, " los demás."]
            tr: { en: I always leave before the others arrive. }

  - title: { en: "Compare: cuando with the indicative and the subjunctive", es: "Comparación: cuando con indicativo y con subjuntivo" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: ind, label: { en: Indicative, es: Indicativo } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo } }
        rows:
          - { level: B1, ind: { en: a habit or a fact, es: un hábito o un hecho }, sbjv: { en: an event still to come, es: un hecho todavía por llegar } }
          - level: B1
            ind: { ex: ["Cuando ", { target: tengo }, " hambre, como fruta."], tr: { en: "When I'm hungry, I eat fruit." } }
            sbjv: { ex: ["Cuando ", { target: tenga }, " hambre, comeré."], tr: { en: "When I'm hungry, I'll eat." } }
          - level: B1
            ind: { ex: ["Cuando ", { target: llegué }, ", no había nadie."], tr: { en: "When I arrived, there was nobody there." } }
            sbjv: { ex: ["Cuando ", { target: llegues }, ", avísame."], tr: { en: Let me know when you arrive. } }

  - title: { en: "Use: purpose", es: "Uso: finalidad" }
    role: use
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Pattern, es: Estructura } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, form: { pattern: [{ term: para }, { slot: infinitive }] }, ex: ["Ahorro para ", { target: comprar }, " una casa."], tr: { en: "I'm saving to buy a house." } }
          - { level: B1, form: { pattern: [{ term: para que }, { slot: { en: subjunctive, es: subjuntivo } }] }, ex: ["Te doy mi número para que me ", { target: llames }, "."], tr: { en: "I'm giving you my number so that you can call me." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: para que }, " needs a different subject; with the same subject, ", { term: para }, " takes the infinitive."]
              es: [{ term: para que }, " necesita otro sujeto; con el mismo sujeto, ", { term: para }, " lleva infinitivo."]

  - title: { en: The same subject, es: El mismo sujeto }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["With the same subject, ", { term: antes de }, " and ", { term: después de }, " take the infinitive:"]
              es: ["Con el mismo sujeto, ", { term: antes de }, " y ", { term: después de }, " llevan infinitivo:"]
            ex: { examples: [["Desayuno antes de ", { target: salir }, "."], ["Después de ", { target: cenar }, ", vemos la tele."]] }
            tr: { en: { examples: [I have breakfast before I go out., "After dinner, we watch TV."] } }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Cuando llegaré, te llamo.", right: ["Cuando ", { target: llegue }, ", te llamo."], rule: { en: ["a future event after ", { term: cuando }, " takes the subjunctive"], es: ["un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo"] } }
          - { level: B1, wrong: "Cuando llegas mañana, llámame.", right: ["Cuando ", { target: llegues }, " mañana, llámame."], rule: { en: ["a future event after ", { term: cuando }, " takes the subjunctive"], es: ["un hecho futuro detrás de ", { term: cuando }, " lleva subjuntivo"] } }
          - { level: B1, wrong: Te llamo para que hablamos., right: ["Te llamo para que ", { target: hablemos }, "."], rule: { en: [{ term: para que }, " takes the subjunctive"], es: [{ term: para que }, " lleva subjuntivo"] } }
          - { level: B1, wrong: Estudio para que aprendo., right: ["Estudio para ", { target: aprender }, "."], rule: { en: ["the same subject takes ", { term: para }, " and the infinitive"], es: ["el mismo sujeto lleva ", { term: para }, " e infinitivo"] } }
          - { level: B1, wrong: "Antes de que salgo, desayuno.", right: ["Antes de ", { target: salir }, ", desayuno."], rule: { en: ["the same subject takes ", { term: antes de }, " and the infinitive"], es: ["el mismo sujeto lleva ", { term: antes de }, " e infinitivo"] } }
          - { level: B1, speakers: [en], wrong: ¿Cuándo llegues?, right: ["¿Cuándo ", { target: llegas }, "?"], rule: { en: ["the question word ", { term: cuándo }, " takes the indicative"] } }
