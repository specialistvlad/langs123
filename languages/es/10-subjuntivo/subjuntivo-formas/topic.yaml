sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The subjunctive is a mood: it names wishes, doubts and events not yet real, mostly in a clause after ", { term: que }, "."]
              es: ["El subjuntivo es un modo: expresa deseos, dudas y hechos todavía no reales, sobre todo en una oración con ", { term: que }, "."]
              uk: ["Суб’юнктив — це спосіб дієслова: він передає бажання, сумніви та ще не реальні події, здебільшого в підрядному реченні після ", { term: que }, "."]
              pt: ["O subjuntivo é um modo verbal: expressa desejos, dúvidas e fatos ainda não reais, sobretudo numa oração com ", { term: que }, "."]
              fr: ["Le subjonctif est un mode : il exprime des souhaits, des doutes et des faits pas encore réels, surtout dans une proposition avec ", { term: que }, "."]
              de: ["Der Konjunktiv ist ein Modus: Er drückt Wünsche, Zweifel und noch nicht wirkliche Ereignisse aus, meist in einem Satz mit ", { term: que }, "."]
              it: ["Il congiuntivo è un modo: esprime desideri, dubbi e fatti non ancora reali, soprattutto in una proposizione con ", { term: que }, "."]
              pl: ["Tryb łączący to tryb czasownika: wyraża życzenia, wątpliwości i zdarzenia jeszcze nierzeczywiste, głównie w zdaniu z ", { term: que }, "."]
              tr: ["Dilek kipi bir kiptir: istekleri, şüpheleri ve henüz gerçekleşmemiş olayları anlatır, çoğunlukla ", { term: que }, " ile kurulan cümlede."]
              id: ["Subjungtif adalah sebuah modus: menyatakan keinginan, keraguan, dan peristiwa yang belum nyata, terutama dalam klausa dengan ", { term: que }, "."]
              vi: ["Thức giả định là một thức của động từ: nó diễn đạt mong muốn, nghi ngờ và sự việc chưa có thật, chủ yếu trong mệnh đề với ", { term: que }, "."]
          - type: rule
            level: B1
            text:
              en: ["Its endings swap the vowel: verbs in ", { term: "-ar" }, " take ", { term: e }, ", and verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " take ", { term: a }, "."]
              es: ["Sus terminaciones cambian la vocal: los verbos en ", { term: "-ar" }, " llevan ", { term: e }, ", y los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, " llevan ", { term: a }, "."]
              uk: ["Його закінчення змінюють голосний: дієслова на ", { term: "-ar" }, " беруть ", { term: e }, ", а дієслова на ", { term: "-er" }, " та ", { term: "-ir" }, " — ", { term: a }, "."]
              pt: ["As terminações trocam a vogal: os verbos em ", { term: "-ar" }, " levam ", { term: e }, ", e os verbos em ", { term: "-er" }, " e ", { term: "-ir" }, " levam ", { term: a }, "."]
              fr: ["Les terminaisons échangent la voyelle : les verbes en ", { term: "-ar" }, " prennent ", { term: e }, ", et les verbes en ", { term: "-er" }, " et ", { term: "-ir" }, " prennent ", { term: a }, "."]
              de: ["Die Endungen tauschen den Vokal: Verben auf ", { term: "-ar" }, " erhalten ", { term: e }, ", Verben auf ", { term: "-er" }, " und ", { term: "-ir" }, " erhalten ", { term: a }, "."]
              it: ["Le desinenze scambiano la vocale: i verbi in ", { term: "-ar" }, " prendono ", { term: e }, ", e i verbi in ", { term: "-er" }, " e ", { term: "-ir" }, " prendono ", { term: a }, "."]
              pl: ["Końcówki zamieniają samogłoskę: czasowniki na ", { term: "-ar" }, " mają ", { term: e }, ", a czasowniki na ", { term: "-er" }, " i ", { term: "-ir" }, " mają ", { term: a }, "."]
              tr: ["Ekler ünlüyü değiştirir: ", { term: "-ar" }, " fiilleri ", { term: e }, " alır, ", { term: "-er" }, " ve ", { term: "-ir" }, " fiilleri ", { term: a }, " alır."]
              id: ["Akhirannya menukar vokal: kata kerja ", { term: "-ar" }, " mengambil ", { term: e }, ", dan kata kerja ", { term: "-er" }, " serta ", { term: "-ir" }, " mengambil ", { term: a }, "."]
              vi: ["Đuôi động từ đổi nguyên âm: động từ ", { term: "-ar" }, " lấy ", { term: e }, ", còn động từ ", { term: "-er" }, " và ", { term: "-ir" }, " lấy ", { term: a }, "."]
          - type: note
            level: B1
            text:
              en: ["When to use it: ", { link: "Subjunctive for Wishes, Doubt and Opinions", to: es.subjuntivo.subjuntivo-deseos-dudas }, " and ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: ["Cuándo se usa: ", { link: "El subjuntivo: deseos, dudas y opiniones", to: es.subjuntivo.subjuntivo-deseos-dudas }, " y ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              uk: ["Коли його вживати: ", { link: "Суб’юнктив: бажання, сумніви й думки", to: es.subjuntivo.subjuntivo-deseos-dudas }, " та ", { link: "Суб’юнктив після cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              pt: ["Quando usar: ", { link: "O subjuntivo: desejos, dúvidas e opiniões", to: es.subjuntivo.subjuntivo-deseos-dudas }, " e ", { link: "O subjuntivo com cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              fr: ["Quand l’employer : ", { link: "Le subjonctif : souhaits, doutes et opinions", to: es.subjuntivo.subjuntivo-deseos-dudas }, " et ", { link: "Le subjonctif avec cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              de: ["Wann man ihn verwendet: ", { link: "Der Konjunktiv: Wünsche, Zweifel und Meinungen", to: es.subjuntivo.subjuntivo-deseos-dudas }, " und ", { link: "Der Konjunktiv nach cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              it: ["Quando si usa: ", { link: "Il congiuntivo: desideri, dubbi e opinioni", to: es.subjuntivo.subjuntivo-deseos-dudas }, " e ", { link: "Il congiuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              pl: ["Kiedy go używać: ", { link: "Tryb łączący: życzenia, wątpliwości i opinie", to: es.subjuntivo.subjuntivo-deseos-dudas }, " i ", { link: "Tryb łączący z cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              tr: ["Ne zaman kullanılır: ", { link: "Dilek kipi: istekler, şüpheler ve görüşler", to: es.subjuntivo.subjuntivo-deseos-dudas }, " ve ", { link: "cuando, para que, antes de que ile dilek kipi", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              id: ["Kapan dipakai: ", { link: "Subjungtif: keinginan, keraguan, dan pendapat", to: es.subjuntivo.subjuntivo-deseos-dudas }, " dan ", { link: "Subjungtif dengan cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              vi: ["Khi nào dùng: ", { link: "Thức giả định: mong muốn, nghi ngờ và ý kiến", to: es.subjuntivo.subjuntivo-deseos-dudas }, " và ", { link: "Thức giả định với cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
          - type: note
            level: B1
            text:
              en: ["The negative imperative takes these forms: ", { term: no hables }, ", ", { link: Negative Imperative, to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              es: ["El imperativo negativo usa estas formas: ", { term: no hables }, ", ", { link: El imperativo negativo, to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              uk: ["Заперечний наказовий спосіб використовує ці форми: ", { term: no hables }, ", ", { link: Заперечний наказовий спосіб, to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              pt: ["O imperativo negativo usa estas formas: ", { term: no hables }, ", ", { link: "O imperativo negativo", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              fr: ["L’impératif négatif utilise ces formes : ", { term: no hables }, ", ", { link: "L’impératif négatif", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              de: ["Der verneinte Imperativ verwendet diese Formen: ", { term: no hables }, ", ", { link: "Der verneinte Imperativ", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              it: ["L'imperativo negativo usa queste forme: ", { term: no hables }, ", ", { link: "L'imperativo negativo", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              pl: ["Przeczący tryb rozkazujący używa tych form: ", { term: no hables }, ", ", { link: "Przeczący tryb rozkazujący", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              tr: ["Olumsuz emir kipi bu biçimleri kullanır: ", { term: no hables }, ", ", { link: "Olumsuz emir kipi", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              id: ["Kalimat perintah negatif memakai bentuk-bentuk ini: ", { term: no hables }, ", ", { link: "Kalimat perintah negatif", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              vi: ["Câu mệnh lệnh phủ định dùng các dạng này: ", { term: no hables }, ", ", { link: "Câu mệnh lệnh phủ định", to: es.imperativo-perifrasis.imperativo-negativo }, "."]
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["В українській немає окремих форм суб’юнктива. Найближча конструкція — ", { l1: "щоб" }, " з минулим часом: ", { l1: "хочу, щоб ти прийшов" }, " — ", { term: "quiero que vengas" }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
