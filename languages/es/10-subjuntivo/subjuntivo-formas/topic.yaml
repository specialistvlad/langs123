# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.subjuntivo.subjuntivo-formas
lang: es
kind: grammar
tags: [verbs, subjunctive, mood, present]
concepts: [subjunctive]
related: [es.subjuntivo.subjuntivo-deseos-dudas, es.subjuntivo.subjuntivo-cuando-para-que, es.imperativo-perifrasis.imperativo-negativo, es.presente.presente-irregular, es.pasados.verbos-irregulares]
status: { en: draft, es: draft }
translated: { es: "2e8795 4ca0ec 0aa47f 97d009 232de3 59eb32 35b42c 01437c 74e6c4" }

title: { en: "Present Subjunctive: Forms", es: "El presente de subjuntivo: formas" }
summary:
  lead:
    en: ["The present subjunctive swaps the vowel of the ending: ", { term: "-ar" }, " verbs take ", { term: e }, ", ", { term: hable }, ", and ", { term: "-er" }, " and ", { term: "-ir" }, " verbs take ", { term: a }, ", ", { term: coma }, "."]
    es: ["El presente de subjuntivo cambia la vocal de la terminación: los verbos en ", { term: "-ar" }, " llevan ", { term: e }, ", ", { term: hable }, ", y los demás, ", { term: a }, ", ", { term: coma }, "."]
  rule:
    en: ["The stem comes from the ", { term: yo }, " form of the present, so an irregular ", { term: yo }, " carries over:"]
    es: ["La raíz sale de la forma de ", { term: yo }, " del presente, así que un ", { term: yo }, " irregular se mantiene:"]
  ex: { examples: [["Quiero que ", { target: vengas }, "."], ["Espero que ", { target: tengas }, " suerte."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: hablar }, ": ", { alternatives: [{ term: hable }, { term: hables }, { term: hablemos }, { term: hablen }] }]
            es: [{ term: hablar }, ": ", { alternatives: [{ term: hable }, { term: hables }, { term: hablemos }, { term: hablen }] }]
          ex: ["Quiero que ", { target: hables }, " con él."]
          tr: { en: I want you to talk to him. }
        - level: B1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: comer }, ": ", { alternatives: [{ term: coma }, { term: comas }, { term: comamos }, { term: coman }] }]
            es: [{ term: comer }, ": ", { alternatives: [{ term: coma }, { term: comas }, { term: comamos }, { term: coman }] }]
          ex: ["Espero que ", { target: comas }, " bien."]
          tr: { en: I hope you eat well. }
        - level: B1
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vivir }, ": ", { alternatives: [{ term: viva }, { term: vivas }, { term: vivamos }, { term: vivan }] }]
            es: [{ term: vivir }, ": ", { alternatives: [{ term: viva }, { term: vivas }, { term: vivamos }, { term: vivan }] }]
          ex: ["Ojalá ", { target: vivamos }, " cerca."]
          tr: { en: I hope we live close by. }
        - level: B1
          variety: es-ES
          point: { en: Form, es: Forma }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: habléis }, { term: comáis }, { term: viváis }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: habléis }, { term: comáis }, { term: viváis }] }]
          ex: ["Quiero que ", { target: habléis }, " con él."]
          tr: { en: I want you to talk to him. }
        - level: B1
          point: { en: The yo stem, es: La raíz de yo }
          rule:
            en: [{ mapping: [{ term: tengo }, { term: tenga }] }, ", ", { mapping: [{ term: hago }, { term: haga }] }]
            es: [{ mapping: [{ term: tengo }, { term: tenga }] }, ", ", { mapping: [{ term: hago }, { term: haga }] }]
          ex: ["Es importante que ", { target: hagas }, " ejercicio."]
          tr: { en: "It's important that you exercise." }
        - level: B1
          point: { en: Stem changes, es: Cambios en la raíz }
          rule:
            en: ["as in the present: ", { alternatives: [{ term: quiera }, { term: pueda }, { term: pida }] }]
            es: ["como en el presente: ", { alternatives: [{ term: quiera }, { term: pueda }, { term: pida }] }]
          ex: ["Ojalá ", { target: pueda }, " ir."]
          tr: { en: I hope I can go. }
        - level: B1
          point: { en: Irregular, es: Irregulares }
          rule:
            en: { alternatives: [{ term: sea }, { term: vaya }, { term: esté }, { term: dé }, { term: sepa }, { term: haya }] }
            es: { alternatives: [{ term: sea }, { term: vaya }, { term: esté }, { term: dé }, { term: sepa }, { term: haya }] }
          ex: ["Espero que ", { target: sea }, " verdad."]
          tr: { en: "I hope it's true." }
        - level: B1
          point: { en: Spelling, es: Ortografía }
          rule:
            en: ["the sound stays: ", { alternatives: [{ term: busque }, { term: llegue }, { term: empiece }] }]
            es: ["el sonido se mantiene: ", { alternatives: [{ term: busque }, { term: llegue }, { term: empiece }] }]
          ex: ["Te llamo cuando ", { target: llegue }, "."]
          tr: { en: "I'll call you when I arrive." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: estar }, " carries a written accent: ", { term: esté }, ", ", { term: estés }]
            es: [{ term: estar }, " lleva tilde: ", { term: esté }, ", ", { term: estés }]
          ex: ["Espero que ", { target: estés }, " bien."]
          tr: { en: "I hope you're well." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: [{ term: "-ir" }, " verbs change in ", { term: nosotros }, " too: ", { term: pidamos }]
            es: ["los verbos en ", { term: "-ir" }, " cambian también en ", { term: nosotros }, ": ", { term: pidamos }]
          ex: ["Es mejor que ", { target: pidamos }, " pizza."]
          tr: { en: "We'd better order pizza." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The subjunctive is a mood: it names wishes, doubts and events not yet real, mostly in a clause after ", { term: que }, "."]
              es: ["El subjuntivo es un modo: expresa deseos, dudas y hechos todavía no reales, sobre todo en una oración con ", { term: que }, "."]
          - type: rule
            level: B1
            text:
              en: ["Its endings swap the vowel: verbs in ", { term: "-ar" }, " take ", { term: e }, ", and verbs in ", { term: "-er" }, " and ", { term: "-ir" }, " take ", { term: a }, "."]
              es: ["Sus terminaciones cambian la vocal: los verbos en ", { term: "-ar" }, " llevan ", { term: e }, ", y los verbos en ", { term: "-er" }, " e ", { term: "-ir" }, " llevan ", { term: a }, "."]
          - type: note
            level: B1
            text:
              en: ["When to use it: ", { link: "Subjunctive for Wishes, Doubt and Opinions", to: es.subjuntivo.subjuntivo-deseos-dudas }, " and ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: ["Cuándo se usa: ", { link: "El subjuntivo: deseos, dudas y opiniones", to: es.subjuntivo.subjuntivo-deseos-dudas }, " y ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
          - type: note
            level: B1
            text:
              en: ["The negative imperative takes these forms: ", { term: no hables }, ", ", { link: Negative Imperative, to: es.imperativo-perifrasis.imperativo-negativo }, "."]
              es: ["El imperativo negativo usa estas formas: ", { term: no hables }, ", ", { link: El imperativo negativo, to: es.imperativo-perifrasis.imperativo-negativo }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares" }
    role: form
    features: { tense: prs, mood: sbjv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, ar: ["habl", { ending: e }], er: ["com", { ending: a }], ir: ["viv", { ending: a }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["habl", { ending: es }], er: ["com", { ending: as }], ir: ["viv", { ending: as }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["habl", { ending: e }], er: ["com", { ending: a }], ir: ["viv", { ending: a }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["habl", { ending: emos }], er: ["com", { ending: amos }], ir: ["viv", { ending: amos }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["habl", { ending: éis }], er: ["com", { ending: áis }], ir: ["viv", { ending: áis }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["habl", { ending: en }], er: ["com", { ending: an }], ir: ["viv", { ending: an }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: yo }, " and ", { term: él }, " share one form, so the subject often appears:"]
              es: [{ term: yo }, " y ", { term: él }, " comparten la forma, por eso el sujeto suele aparecer:"]
            ex: ["Quiere que yo ", { target: hable }, " primero."]
            tr: { en: She wants me to speak first. }

  - title: { en: "Form: the yo stem", es: "Forma: la raíz de yo" }
    role: form
    features: { tense: prs, mood: sbjv }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: yo, label: { en: Present, es: Presente } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo } }
        rows:
          - { level: B1, verb: tener, yo: tengo, sbjv: { target: tenga } }
          - { level: B1, verb: hacer, yo: hago, sbjv: { target: haga } }
          - { level: B1, verb: poner, yo: pongo, sbjv: { target: ponga } }
          - { level: B1, verb: salir, yo: salgo, sbjv: { target: salga } }
          - { level: B1, verb: venir, yo: vengo, sbjv: { target: venga } }
          - { level: B1, verb: decir, yo: digo, sbjv: { target: diga } }
          - { level: B1, verb: conocer, yo: conozco, sbjv: { target: conozca } }
          - { level: B1, verb: ver, yo: veo, sbjv: { target: vea } }
          - { level: B1, verb: traer, yo: traigo, sbjv: { target: traiga } }
          - { level: B1, verb: oír, yo: oigo, sbjv: { target: oiga } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Every person keeps the stem of ", { term: yo }, ":"]
              es: ["Todas las personas mantienen la raíz de ", { term: yo }, ":"]
            ex: ["Quiero que ", { target: vengan }, " todos."]
            tr: { en: I want everybody to come. }

  - title: { en: "Form: stem-changing verbs", es: "Forma: verbos con cambio en la raíz" }
    role: form
    features: { tense: prs, mood: sbjv }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona } }
          - { key: querer, label: querer }
          - { key: poder, label: poder }
          - { key: pedir, label: pedir }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, querer: ["qu", { letter: ie }, "ra"], poder: ["p", { letter: ue }, "da"], pedir: ["p", { letter: i }, "da"] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, querer: ["qu", { letter: ie }, "ras"], poder: ["p", { letter: ue }, "das"], pedir: ["p", { letter: i }, "das"] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, querer: ["qu", { letter: ie }, "ra"], poder: ["p", { letter: ue }, "da"], pedir: ["p", { letter: i }, "da"] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, querer: queramos, poder: podamos, pedir: ["p", { letter: i }, "damos"] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, querer: queráis, poder: podáis, pedir: ["p", { letter: i }, "dáis"] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, querer: ["qu", { letter: ie }, "ran"], poder: ["p", { letter: ue }, "dan"], pedir: ["p", { letter: i }, "dan"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: "-ar" }, " and ", { term: "-er" }, " change as in the present, and ", { term: nosotros }, " keeps the vowel."]
              es: ["Los verbos en ", { term: "-ar" }, " y en ", { term: "-er" }, " cambian como en el presente, y ", { term: nosotros }, " conserva la vocal."]
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: "-ir" }, " change in ", { term: nosotros }, " too: ", { alternatives: [{ term: pidamos }, { term: durmamos }, { term: sintamos }] }, "."]
              es: ["Los verbos en ", { term: "-ir" }, " cambian también en ", { term: nosotros }, ": ", { alternatives: [{ term: pidamos }, { term: durmamos }, { term: sintamos }] }, "."]
            ex: ["Es mejor que ", { target: durmamos }, " un poco."]
            tr: { en: "We'd better get some sleep." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares" }
    role: form
    features: { tense: prs, mood: sbjv }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, verb: ser, sbjv: sea, ex: ["Espero que ", { target: sea }, " verdad."], tr: { en: "I hope it's true." } }
          - { level: B1, verb: ir, sbjv: vaya, ex: ["Quiero que ", { target: vayas }, " al médico."], tr: { en: "I want you to go to the doctor's." } }
          - { level: B1, verb: estar, sbjv: esté, ex: ["Espero que ", { target: estés }, " bien."], tr: { en: "I hope you're well." } }
          - { level: B1, verb: dar, sbjv: dé, ex: ["Pídele que te ", { target: dé }, " su número."], tr: { en: Ask him to give you his number. } }
          - { level: B1, verb: saber, sbjv: sepa, ex: ["No quiero que ", { target: sepa }, " nada."], tr: { en: "I don't want her to know anything." } }
          - { level: B1, verb: haber, sbjv: haya, ex: ["Ojalá ", { target: haya }, " entradas."], tr: { en: I hope there are tickets. } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: estar }, " carries a written accent in every form but ", { term: estemos }, ", and ", { term: dé }, " keeps its accent to differ from ", { term: de }, "."]
              es: [{ term: estar }, " lleva tilde en todas las formas menos ", { term: estemos }, ", y ", { term: dé }, " la lleva para distinguirse de ", { term: de }, "."]

  - title: { en: "Spelling: keeping the sound", es: "Ortografía: el mismo sonido" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: change, label: { en: Change, es: Cambio } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, change: { mapping: [{ term: "-car" }, { term: "-que" }] }, ex: ["Espero que ", { target: busques }, " trabajo."], tr: { en: I hope you look for a job. } }
          - { level: B1, change: { mapping: [{ term: "-gar" }, { term: "-gue" }] }, ex: ["Te llamo cuando ", { target: llegue }, "."], tr: { en: "I'll call you when I arrive." } }
          - { level: B1, change: { mapping: [{ term: "-zar" }, { term: "-ce" }] }, ex: ["Es mejor que ", { target: empecemos }, " ya."], tr: { en: "We'd better start now." } }
          - { level: B1, change: { mapping: [{ term: "-gir" }, { term: "-ja" }] }, ex: ["Quiero que ", { target: elijas }, " tú."], tr: { en: I want you to choose. } }
          - { level: B1, change: { mapping: [{ term: "-guir" }, { term: "-ga" }] }, ex: ["Es importante que ", { target: sigas }, " las instrucciones."], tr: { en: "It's important that you follow the instructions." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "Each change keeps the sound of the stem before the new vowel."
              es: "Cada cambio mantiene el sonido de la raíz delante de la nueva vocal."

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: Quiero que vienes., right: ["Quiero que ", { target: vengas }, "."], rule: { en: ["the subjunctive takes the stem of ", { term: vengo }], es: ["el subjuntivo toma la raíz de ", { term: vengo }] } }
          - { level: B1, wrong: Espero que estes bien., right: ["Espero que ", { target: estés }, " bien."], rule: { en: [{ term: estés }, " carries a written accent"], es: [{ term: estés }, " lleva tilde"] } }
          - { level: B1, wrong: Ojalá que es verdad., right: ["Ojalá que ", { target: sea }, " verdad."], rule: { en: ["the subjunctive of ", { term: ser }, " is ", { term: sea }], es: ["el subjuntivo de ", { term: ser }, " es ", { term: sea }] } }
          - { level: B1, wrong: Es mejor que pedamos pizza., right: ["Es mejor que ", { target: pidamos }, " pizza."], rule: { en: ["verbs in ", { term: "-ir" }, " change in ", { term: nosotros }, " too"], es: ["los verbos en ", { term: "-ir" }, " cambian también en ", { term: nosotros }] } }
          - { level: B1, wrong: Te llamo cuando llege., right: ["Te llamo cuando ", { target: llegue }, "."], rule: { en: ["verbs in ", { term: "-gar" }, " write ", { term: gue }], es: ["los verbos en ", { term: "-gar" }, " escriben ", { term: gue }] } }
