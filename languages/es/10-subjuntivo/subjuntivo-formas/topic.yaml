              de: [{ term: yo }, " und ", { term: él }, " haben dieselbe Form, deshalb steht das Subjekt oft dabei:"]
              it: [{ term: yo }, " e ", { term: él }, " condividono la forma, perciò il soggetto compare spesso:"]
              pl: [{ term: yo }, " i ", { term: él }, " mają tę samą formę, dlatego podmiot często się pojawia:"]
              tr: [{ term: yo }, " ve ", { term: él }, " aynı biçimi paylaşır, bu yüzden özne sık sık söylenir:"]
              id: [{ term: yo }, " dan ", { term: él }, " berbagi satu bentuk, jadi subjek sering disebutkan:"]
              vi: [{ term: yo }, " và ", { term: él }, " có chung một dạng, nên chủ ngữ thường được nói rõ:"]
            ex: ["Quiere que yo ", { target: hable }, " primero."]
            tr: { en: She wants me to speak first., uk: "Вона хоче, щоб я говорив першим.", pt: "Ela quer que eu fale primeiro.", fr: "Elle veut que je parle en premier.", de: "Sie möchte, dass ich zuerst spreche.", it: "Vuole che io parli per primo.", pl: "Ona chce, żebym mówił pierwszy.", tr: "Önce benim konuşmamı istiyor.", id: "Dia ingin saya berbicara lebih dulu.", vi: "Cô ấy muốn tôi nói trước." }

  - title: { en: "Form: the yo stem", es: "Forma: la raíz de yo", uk: "Форма: основа yo", pt: "Forma: o radical de yo", fr: "Forme : le radical de yo", de: "Form: der Stamm von yo", it: "Forma: la radice di yo", pl: "Forma: rdzeń formy yo", tr: "Biçim: yo biçiminin kökü", id: "Bentuk: akar kata bentuk yo", vi: "Dạng: gốc của dạng yo" }
    role: form
    features: { tense: prs, mood: sbjv }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: yo, label: { en: Present, es: Presente, uk: Теперішній час, pt: "Presente", fr: "Présent", de: "Präsens", it: "Presente", pl: "Czas teraźniejszy", tr: "Şimdiki zaman", id: "Presente", vi: "Hiện tại" } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo, uk: Суб’юнктив, pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" } }
        rows:
          - { level: B1, verb: tener, yo: tengo, sbjv: { target: tenga } }
          - { level: B1, verb: hacer, yo: hago, sbjv: { target: haga } }
          - { level: B1, verb: poner, yo: pongo, sbjv: { target: ponga } }
          - { level: B1, verb: salir, yo: salgo, sbjv: { target: salga } }
          - { level: B1, verb: venir, yo: vengo, sbjv: { target: venga } }
          - { level: B1, verb: decir, yo: digo, sbjv: { target: diga } }
          - { level: B1, verb: conocer, yo: conozco, sbjv: { target: conozca } }
          - { level: B1, verb: ver, yo: veo, sbjv: { target: vea } }
          - { level: B1, verb: traer, yo: traigo, sbjv: { target: traiga } }
          - { level: B1, verb: oír, yo: oigo, sbjv: { target: oiga } }
      - type: list
        items:
          - type: rule
