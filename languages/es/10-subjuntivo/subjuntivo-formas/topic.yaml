title: { en: "Present Subjunctive: Forms", es: "El presente de subjuntivo: formas", uk: "Теперішній час суб’юнктива: форми", pt: "O presente do subjuntivo: formas", fr: "Le présent du subjonctif : formes", de: "Der Konjunktiv Präsens: Formen", it: "Il presente del congiuntivo: forme", pl: "Tryb łączący czasu teraźniejszego: formy", tr: "Dilek kipinin şimdiki zamanı: biçimler", id: "Presente subjungtif: bentuk", vi: "Thì hiện tại của thức giả định: các dạng" }
summary:
  lead:
    en: ["The present subjunctive swaps the vowel of the ending: ", { term: "-ar" }, " verbs take ", { term: e }, ", ", { term: hable }, ", and ", { term: "-er" }, " and ", { term: "-ir" }, " verbs take ", { term: a }, ", ", { term: coma }, "."]
    es: ["El presente de subjuntivo cambia la vocal de la terminación: los verbos en ", { term: "-ar" }, " llevan ", { term: e }, ", ", { term: hable }, ", y los demás, ", { term: a }, ", ", { term: coma }, "."]
    uk: ["Теперішній час суб’юнктива змінює голосний закінчення: дієслова на ", { term: "-ar" }, " беруть ", { term: e }, ", ", { term: hable }, ", а дієслова на ", { term: "-er" }, " та ", { term: "-ir" }, " — ", { term: a }, ", ", { term: coma }, "."]
    pt: ["O presente do subjuntivo troca a vogal da terminação: os verbos em ", { term: "-ar" }, " levam ", { term: e }, ", ", { term: hable }, ", e os demais levam ", { term: a }, ", ", { term: coma }, "."]
    fr: ["Le présent du subjonctif change la voyelle de la terminaison : les verbes en ", { term: "-ar" }, " prennent ", { term: e }, ", ", { term: hable }, ", et les autres prennent ", { term: a }, ", ", { term: coma }, "."]
    de: ["Der Konjunktiv Präsens tauscht den Vokal der Endung aus: Verben auf ", { term: "-ar" }, " erhalten ", { term: e }, ", ", { term: hable }, ", die übrigen ", { term: a }, ", ", { term: coma }, "."]
    it: ["Il presente del congiuntivo cambia la vocale della desinenza: i verbi in ", { term: "-ar" }, " prendono ", { term: e }, ", ", { term: hable }, ", gli altri ", { term: a }, ", ", { term: coma }, "."]
    pl: ["Tryb łączący czasu teraźniejszego zmienia samogłoskę końcówki: czasowniki na ", { term: "-ar" }, " mają ", { term: e }, ", ", { term: hable }, ", a pozostałe ", { term: a }, ", ", { term: coma }, "."]
    tr: ["Dilek kipinin şimdiki zamanı ekin ünlüsünü değiştirir: ", { term: "-ar" }, " fiilleri ", { term: e }, " alır, ", { term: hable }, "; ", { term: "-er" }, " ve ", { term: "-ir" }, " fiilleri ", { term: a }, " alır, ", { term: coma }, "."]
    id: ["Presente subjungtif menukar vokal akhiran: kata kerja ", { term: "-ar" }, " mengambil ", { term: e }, ", ", { term: hable }, ", dan kata kerja ", { term: "-er" }, " serta ", { term: "-ir" }, " mengambil ", { term: a }, ", ", { term: coma }, "."]
    vi: ["Thức giả định hiện tại đổi nguyên âm của đuôi: động từ ", { term: "-ar" }, " lấy ", { term: e }, ", ", { term: hable }, ", còn ", { term: "-er" }, " và ", { term: "-ir" }, " lấy ", { term: a }, ", ", { term: coma }, "."]
  rule:
    en: ["The stem comes from the ", { term: yo }, " form of the present, so an irregular ", { term: yo }, " carries over:"]
    es: ["La raíz sale de la forma de ", { term: yo }, " del presente, así que un ", { term: yo }, " irregular se mantiene:"]
    uk: ["Основа походить від форми ", { term: yo }, " теперішнього часу, тож неправильна форма ", { term: yo }, " зберігається:"]
    pt: ["O radical vem da forma de ", { term: yo }, " do presente, então um ", { term: yo }, " irregular se mantém:"]
    fr: ["Le radical vient de la forme ", { term: yo }, " du présent, donc un ", { term: yo }, " irrégulier se conserve :"]
    de: ["Der Stamm kommt von der ", { term: yo }, "-Form des Präsens, daher bleibt ein unregelmäßiges ", { term: yo }, " erhalten:"]
    it: ["La radice viene dalla forma ", { term: yo }, " del presente, quindi uno ", { term: yo }, " irregolare si mantiene:"]
    pl: ["Rdzeń pochodzi z formy ", { term: yo }, " czasu teraźniejszego, więc nieregularne ", { term: yo }, " się zachowuje:"]
    tr: ["Kök, şimdiki zamanın ", { term: yo }, " biçiminden gelir; bu yüzden düzensiz bir ", { term: yo }, " biçimi korunur:"]
    id: ["Akar kata berasal dari bentuk ", { term: yo }, " pada presente, jadi ", { term: yo }, " yang tidak beraturan tetap dipertahankan:"]
    vi: ["Gốc lấy từ dạng ", { term: yo }, " của thì hiện tại, nên dạng ", { term: yo }, " bất quy tắc được giữ nguyên:"]
  ex: { examples: [["Quiero que ", { target: vengas }, "."], ["Espero que ", { target: tengas }, " suerte."]] }

