          rule: { es: ["tras ", { term: "habría gustado" }, " va ", { term: hubieras }], en: ["after ", { term: habría gustado }, " comes ", { term: hubieras }], uk: ["після ", { term: habría gustado }, " стоїть ", { term: hubieras }], pt: ["depois de ", { term: habría gustado }, " vem ", { term: hubieras }], fr: ["après ", { term: habría gustado }, " vient ", { term: hubieras }], de: ["nach ", { term: habría gustado }, " steht ", { term: hubieras }], it: ["dopo ", { term: habría gustado }, " viene ", { term: hubieras }], pl: ["po ", { term: habría gustado }, " stoi ", { term: hubieras }], tr: [{ term: habría gustado }, " sonrasında ", { term: hubieras }, " gelir"], id: ["setelah ", { term: habría gustado }, " datang ", { term: hubieras }], vi: ["sau ", { term: habría gustado }, " là ", { term: hubieras }] }
