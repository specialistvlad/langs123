title: { es: "La correlación de tiempos con el subjuntivo", en: "Sequence of Tenses with the Subjunctive", uk: "Узгодження часів із суб’юнктивом", pt: "A correlação dos tempos verbais com o subjuntivo", fr: "La concordance des temps avec le subjonctif", de: "Die Zeitenfolge mit dem Konjunktiv", it: "La consecutio temporum con il congiuntivo", pl: "Następstwo czasów z trybem łączącym", tr: "Dilek kipiyle zaman uyumu", id: "Kesesuaian kala dengan subjungtif", vi: "Hòa hợp thì với thức giả định" }
summary:
  lead:
    es: "El verbo principal elige el tiempo del subjuntivo: presente o perfecto tras un presente, imperfecto o pluscuamperfecto tras un pasado."
    en: "The main verb picks the tense of the subjunctive: present or present perfect after a present, imperfect or past perfect after a past."
    uk: "Головне дієслово визначає час суб’юнктива: після теперішнього часу — теперішній або перфект, після минулого — імперфект або плюсквамперфект."
    pt: "O verbo principal escolhe o tempo do subjuntivo: presente ou perfeito composto depois de um presente; imperfeito ou mais-que-perfeito depois de um passado."
    fr: "Le verbe principal choisit le temps du subjonctif : présent ou passé après un présent, imparfait ou plus-que-parfait après un passé."
    de: "Das Hauptverb bestimmt die Zeit des Konjunktivs: Präsens oder Perfekt nach einem Präsens, Imperfecto oder Plusquamperfekt nach einer Vergangenheitsform."
    it: "Il verbo principale sceglie il tempo del congiuntivo: presente o passato dopo un presente, imperfetto o trapassato dopo un passato."
    pl: "Czasownik główny wybiera czas trybu łączącego: presente lub pretérito perfecto po czasie teraźniejszym, imperfecto lub czas zaprzeszły po czasie przeszłym."
    tr: "Ana cümlenin fiili dilek kipinin zamanını seçer: şimdiki zamandan sonra presente ya da perfecto, geçmişten sonra imperfecto ya da pluscuamperfecto."
    id: "Kata kerja utama menentukan tense subjungtif: presente atau perfecto setelah masa kini, imperfecto atau pluscuamperfecto setelah masa lampau."
    vi: "Động từ chính chọn thì của thức giả định: hiện tại hoặc hoàn thành sau hiện tại; chưa hoàn thành hoặc hoàn thành sau quá khứ."
  rule:
    es: "El subjuntivo sigue el tiempo del verbo principal, presente tras un presente e imperfecto tras un pasado:"
    en: "The subjunctive follows the tense of the main verb: present after a present, imperfect after a past:"
    uk: "Суб’юнктив іде за часом головного дієслова: теперішній час після теперішнього, імперфект після минулого:"
    pt: "O subjuntivo segue o tempo do verbo principal: presente depois de um presente, imperfeito depois de um passado:"
    fr: "Le subjonctif suit le temps du verbe principal : présent après un présent, imparfait après un passé :"
    de: "Der Konjunktiv folgt der Zeit des Hauptverbs: Präsens nach einem Präsens, Imperfecto nach einer Vergangenheitsform:"
    it: "Il congiuntivo segue il tempo del verbo principale: presente dopo un presente, imperfetto dopo un passato:"
    pl: "Tryb łączący idzie za czasem czasownika głównego: presente po czasie teraźniejszym, imperfecto po czasie przeszłym:"
    tr: "Dilek kipi ana cümlenin fiilinin zamanını izler: şimdiki zamandan sonra presente, geçmişten sonra imperfecto:"
    id: "Subjungtif mengikuti tense kata kerja utama: presente setelah masa kini, imperfecto setelah masa lampau:"
    vi: "Thức giả định theo động từ chính: hiện tại sau hiện tại, quá khứ sau quá khứ:"
  ex: { examples: [["Quiero que ", { target: vengas }, "."], ["Quería que ", { target: vinieras }, "."]] }

