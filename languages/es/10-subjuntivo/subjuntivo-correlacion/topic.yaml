          rule: { es: "tras una negación, dos formas valen para el mismo hecho pasado", en: "after a negation, two forms work for the same past event", uk: "після заперечення дві форми підходять для тієї самої минулої події", pt: "depois de uma negação, duas formas servem para o mesmo fato passado", fr: "après une négation, deux formes conviennent pour le même fait passé", de: "nach einer Verneinung passen zwei Formen für dasselbe vergangene Ereignis", it: "dopo una negazione, due forme vanno bene per lo stesso fatto passato", pl: "po przeczeniu dwie formy pasują do tego samego zdarzenia przeszłego", tr: "olumsuzluktan sonra aynı geçmiş olay için iki biçim kullanılabilir", id: "setelah negasi, dua bentuk sama-sama benar untuk peristiwa lampau yang sama", vi: "sau phủ định, hai dạng đều dùng được cho cùng một sự việc trong quá khứ" }
          ex: { examples: [["No creo que Ana lo ", { target: "haya dicho" }, "."], ["No creo que Ana lo ", { target: dijera }, "."]] }
          tr: { en: { examples: ["I don't think Ana has said it.", "I don't think Ana said it."] }, uk: { examples: ["Не думаю, що Ана це сказала.", "Не думаю, що Ана таке казала."] }, pt: { examples: ["Não acho que a Ana tenha dito isso.", "Não acho que a Ana dissesse isso."] }, fr: { examples: ["Je ne crois pas qu’Ana l’ait dit.", "Je ne pense pas qu’Ana ait dit ça."] }, de: { examples: ["Ich glaube nicht, dass Ana das gesagt hat.", "Ich glaube nicht, dass Ana das so gesagt hat."] }, it: { examples: ["Non credo che Ana l'abbia detto.", "Non credo che Ana lo dicesse."] }, pl: { examples: ["Nie sądzę, żeby Ana to powiedziała.", "Nie sądzę, żeby Ana tak powiedziała."] }, tr: { examples: ["Ana’nın bunu söylediğini sanmıyorum.", "Ana’nın böyle dediğini sanmıyorum."] }, id: { examples: ["Saya rasa Ana tidak mengatakannya.", "Saya rasa Ana tidak pernah mengatakannya."] }, vi: { examples: ["Tôi không nghĩ Ana đã nói điều đó.", "Tôi không nghĩ Ana đã nói như vậy."] } }
        - level: B2
