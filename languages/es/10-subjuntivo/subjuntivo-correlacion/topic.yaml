          - { level: B2, wrong: "Esperaba que habías llegado.", right: ["Esperaba que ", { target: "hubieras llegado" }, "."], rule: { es: "tras un pasado, la anterioridad lleva pluscuamperfecto de subjuntivo", en: "after a past tense, an earlier action takes the past perfect subjunctive", uk: "після минулого часу попередня дія вимагає плюсквамперфекта суб’юнктива", pt: "depois de um passado, a anterioridade leva o pretérito mais-que-perfeito do subjuntivo", fr: "après un passé, l’antériorité prend le plus-que-parfait du subjonctif", de: "nach einer Vergangenheitsform steht die Vorzeitigkeit im Konjunktiv Plusquamperfekt", it: "dopo un passato, l'anteriorità vuole il trapassato del congiuntivo", pl: "po czasie przeszłym wcześniejszość wymaga czas zaprzeszły trybu łączącego", tr: "geçmiş zamandan sonra daha önce olan eylem dilek kipinin pluscuamperfecto biçimiyle kurulur", id: "setelah masa lampau, tindakan yang lebih dulu memakai pluscuamperfecto subjungtif", vi: "sau thì quá khứ, việc xảy ra trước dùng quá khứ hoàn thành của thức giả định" } }
          - { level: B2, wrong: "Dijo que me siente.", right: ["Dijo que me ", { target: sentara }, "."], rule: { es: ["la orden transmitida tras ", { term: dijo }, " lleva imperfecto de subjuntivo"], en: ["a reported order after ", { term: dijo }, " takes the imperfect subjunctive"], uk: ["наказ, переданий після ", { term: dijo }, ", вимагає імперфекта суб’юнктива"], pt: ["a ordem transmitida depois de ", { term: dijo }, " leva o imperfeito do subjuntivo"], fr: ["l’ordre rapporté après ", { term: dijo }, " prend l’imparfait du subjonctif"], de: ["der nach ", { term: dijo }, " wiedergegebene Befehl steht im Konjunktiv Imperfecto"], it: ["l'ordine riferito dopo ", { term: dijo }, " vuole l'imperfetto del congiuntivo"], pl: ["przekazane polecenie po ", { term: dijo }, " wymaga imperfecto trybu łączącego"], tr: [{ term: dijo }, " sonrasında aktarılan emir dilek kipinin imperfecto biçimiyle kurulur"], id: ["perintah yang disampaikan setelah ", { term: dijo }, " memakai imperfecto subjungtif"], vi: ["mệnh lệnh được thuật lại sau ", { term: dijo }, " dùng imperfecto của thức giả định"] } }
