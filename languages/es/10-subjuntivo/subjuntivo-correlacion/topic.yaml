              pl: ["Pretérito perfecto i imperfecto: ", { link: "Perfecto i pluscuamperfecto w trybie łączącym", to: es.subjuntivo.subjuntivo-compuesto }, "; tryb po zaprzeczonym czasowniku mówienia: ", { link: "Tryb łączący: życzenia, wątpliwości i opinie", to: es.subjuntivo.subjuntivo-deseos-dudas }, "; ", { term: desde que }, " i ", { term: hasta que }, ": ", { link: "Tryb łączący z cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              tr: ["Perfecto ve imperfecto: ", { link: "Dilek kipinde perfecto ve pluscuamperfecto", to: es.subjuntivo.subjuntivo-compuesto }, "; olumsuz bir söyleme fiilinden sonraki kip: ", { link: "Dilek kipi: istekler, şüpheler ve görüşler", to: es.subjuntivo.subjuntivo-deseos-dudas }, "; ", { term: desde que }, " ve ", { term: hasta que }, ": ", { link: "cuando, para que, antes de que ile dilek kipi", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              id: ["Perfecto dan imperfecto: ", { link: "Perfecto dan pluscuamperfecto subjungtif", to: es.subjuntivo.subjuntivo-compuesto }, "; mood setelah kata kerja ucapan yang dinegasikan: ", { link: "Subjungtif: keinginan, keraguan, dan pendapat", to: es.subjuntivo.subjuntivo-deseos-dudas }, "; ", { term: desde que }, " dan ", { term: hasta que }, ": ", { link: "Subjungtif dengan cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              vi: ["Pretérito perfecto và imperfecto: ", { link: "Pretérito perfecto và quá khứ hoàn thành của thức giả định", to: es.subjuntivo.subjuntivo-compuesto }, "; thức sau động từ nói ở dạng phủ định: ", { link: "Thức giả định: mong muốn, nghi ngờ và ý kiến", to: es.subjuntivo.subjuntivo-deseos-dudas }, "; ", { term: desde que }, " và ", { term: hasta que }, ": ", { link: "Thức giả định với cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]

  - title: { es: Errores frecuentes, en: "Typical errors", uk: "Типові помилки", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
