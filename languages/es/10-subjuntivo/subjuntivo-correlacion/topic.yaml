          rule: { es: "tras un pasado, imperfecto de subjuntivo", en: "after a past tense, the imperfect subjunctive", uk: "після минулого часу — імперфект суб’юнктива", pt: "depois de um passado, o imperfeito do subjuntivo", fr: "après un passé, l’imparfait du subjonctif", de: "nach einer Vergangenheitsform der Konjunktiv Imperfecto", it: "dopo un passato, l'imperfetto del congiuntivo", pl: "po czasie przeszłym imperfecto trybu łączącego", tr: "geçmiş zamandan sonra dilek kipinin imperfecto biçimi", id: "setelah masa lampau, imperfecto subjungtif", vi: "sau thì quá khứ, dùng imperfecto của thức giả định" }
          ex: ["Quería que ", { target: vinieras }, "."]
          tr: { en: "I wanted you to come.", uk: "Я хотів, щоб ти прийшов.", pt: "Eu queria que você viesse.", fr: "Je voulais que tu viennes.", de: "Ich wollte, dass du kommst.", it: "Volevo che tu venissi.", pl: "Chciałem, żebyś przyszedł.", tr: "Gelmeni istiyordum.", id: "Saya ingin kamu datang.", vi: "Tôi đã muốn bạn đến." }
