sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "El subjuntivo toma su tiempo del verbo principal de su propia frase."
              en: "The subjunctive takes its tense from the main verb of its own sentence."
              uk: "Суб’юнктив бере свій час від головного дієслова свого речення."
              pt: "O subjuntivo toma o seu tempo do verbo principal da sua própria frase."
              fr: "Le subjonctif prend son temps du verbe principal de sa propre phrase."
              de: "Der Konjunktiv richtet seine Zeit nach dem Hauptverb seines eigenen Satzes."
              it: "Il congiuntivo prende il suo tempo dal verbo principale della sua frase."
              pl: "Tryb łączący bierze czas z czasownika głównego własnego zdania."
              tr: "Dilek kipi zamanını kendi cümlesinin ana fiilinden alır."
              id: "Subjungtif mengambil tensenya dari kata kerja utama kalimatnya sendiri."
              vi: "Thức giả định lấy thì từ động từ chính của chính câu đó."
            ex: ["Ayer me pidió que ", { target: llamara }, "; hoy me pide que ", { target: llame }, "."]
            tr: { en: "Yesterday he asked me to call; today he asks me to call.", uk: "Учора він попросив мене зателефонувати; сьогодні просить зателефонувати.", pt: "Ontem ele me pediu que ligasse; hoje ele me pede que ligue.", fr: "Hier, il m’a demandé d’appeler ; aujourd’hui, il me demande d’appeler.", de: "Gestern bat er mich anzurufen; heute bittet er mich anzurufen.", it: "Ieri mi ha chiesto di chiamare; oggi mi chiede di chiamare.", pl: "Wczoraj poprosił, żebym zadzwonił; dziś prosi, żebym zadzwonił.", tr: "Dün aramamı istedi; bugün de aramamı istiyor.", id: "Kemarin dia meminta saya menelepon; hari ini dia meminta saya menelepon.", vi: "Hôm qua anh ấy nhờ tôi gọi điện; hôm nay anh ấy cũng nhờ tôi gọi điện." }
          - type: note
            level: B2
            text:
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, " y ", { link: El perfecto y el pluscuamperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-compuesto }, "."]
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Imperfect Subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, " and ", { link: "Present Perfect and Past Perfect Subjunctive", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              uk: ["Форми: ", { link: "Теперішній час суб’юнктива: форми", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, " і ", { link: "Перфект і плюсквамперфект суб’юнктива", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              pt: ["As formas: ", { link: "O presente do subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "O imperfeito do subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, " e ", { link: "O pretérito perfeito composto e o mais-que-perfeito do subjuntivo", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              fr: ["Les formes : ", { link: "Le présent du subjonctif : formes", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "L’imparfait du subjonctif", to: es.subjuntivo.subjuntivo-imperfecto }, " et ", { link: "Le passé et le plus-que-parfait du subjonctif", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              de: ["Die Formen: ", { link: "Der Konjunktiv Präsens: Formen", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Der Konjunktiv Imperfecto", to: es.subjuntivo.subjuntivo-imperfecto }, " und ", { link: "Der Konjunktiv Perfekt und Plusquamperfekt", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              it: ["Le forme: ", { link: "Il presente del congiuntivo: forme", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "L'imperfetto del congiuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, " e ", { link: "Il passato e il trapassato del congiuntivo", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              pl: ["Formy: ", { link: "Tryb łączący czasu teraźniejszego: formy", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Imperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-imperfecto }, " i ", { link: "Perfecto i pluscuamperfecto w trybie łączącym", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              tr: ["Biçimler: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Dilek kipinin imperfecto biçimi", to: es.subjuntivo.subjuntivo-imperfecto }, " ve ", { link: "Dilek kipinde perfecto ve pluscuamperfecto", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              id: ["Bentuknya: ", { link: "Presente subjungtif: bentuk", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Imperfecto subjungtif", to: es.subjuntivo.subjuntivo-imperfecto }, " dan ", { link: "Perfecto dan pluscuamperfecto subjungtif", to: es.subjuntivo.subjuntivo-compuesto }, "."]
              vi: ["Các dạng: ", { link: "Thì hiện tại của thức giả định: các dạng", to: es.subjuntivo.subjuntivo-formas }, ", ", { link: "Imperfecto của thức giả định", to: es.subjuntivo.subjuntivo-imperfecto }, " và ", { link: "Pretérito perfecto và quá khứ hoàn thành của thức giả định", to: es.subjuntivo.subjuntivo-compuesto }, "."]
          - type: note
            level: C2
            text:
              es: ["El futuro de subjuntivo, de la lengua jurídica y literaria: ", { link: "El futuro de subjuntivo: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              en: ["The future subjunctive, from legal and literary language: ", { link: "Future Subjunctive: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              uk: ["Майбутній час суб’юнктива в юридичній та літературній мові: ", { link: "Майбутній час суб’юнктива: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              pt: ["O futuro do subjuntivo, da língua jurídica e literária: ", { link: "O futuro do subjuntivo: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              fr: ["Le futur du subjonctif, de la langue juridique et littéraire : ", { link: "Le futur du subjonctif : hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              de: ["Der Konjunktiv Futur, aus der Rechts- und Literatursprache: ", { link: "Der Konjunktiv Futur: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              it: ["Il futuro del congiuntivo, della lingua giuridica e letteraria: ", { link: "Il futuro del congiuntivo: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              pl: ["Przyszły tryb łączący, z języka prawnego i literackiego: ", { link: "Tryb łączący czasu przyszłego: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              tr: ["Dilek kipinin gelecek zamanı, hukuk ve edebiyat dilinden: ", { link: "Dilek kipinin gelecek zamanı: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              id: ["Futuro subjungtif, dari bahasa hukum dan sastra: ", { link: "Futuro subjungtif: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]
              vi: ["Thì tương lai của thức giả định, dùng trong ngôn ngữ pháp lý và văn chương: ", { link: "Thì tương lai của thức giả định: hablare, hubiere", to: es.subjuntivo.subjuntivo-futuro }, "."]

