          rule: { es: "perfecto de subjuntivo: lo anterior", en: "present perfect subjunctive: what happened earlier", uk: "перфект суб’юнктива: попередня дія", pt: "pretérito perfeito composto do subjuntivo: o que é anterior", fr: "passé du subjonctif : ce qui est antérieur", de: "Konjunktiv Perfekt: Vorzeitiges", it: "passato del congiuntivo: ciò che è anteriore", pl: "pretérito perfecto trybu łączącego: czynność wcześniejsza", tr: "dilek kipinin pretérito perfecto biçimi: önce olan eylem", id: "pretérito perfecto subjungtif: tindakan yang lebih dulu", vi: "pretérito perfecto của thức giả định: việc xảy ra trước" }
