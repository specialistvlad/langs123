      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: "El perfecto mira el hecho desde el presente; el imperfecto lo sitúa en un momento pasado."
              en: "The present perfect views the event from the present; the imperfect places it at a past moment."
              uk: "Перфект дивиться на подію з теперішнього моменту; імперфект відносить її до минулого моменту."
              pt: "O pretérito perfeito composto olha o fato a partir do presente; o imperfeito o situa em um momento passado."
              fr: "Le passé du subjonctif regarde le fait depuis le présent ; l’imparfait le place à un moment passé."
              de: "Das Perfekt betrachtet das Ereignis vom Jetzt aus; das Imperfecto verortet es in einem vergangenen Moment."
              it: "Il passato del congiuntivo guarda il fatto dal presente; l'imperfetto lo colloca in un momento passato."
              pl: "Pretérito perfecto patrzy na zdarzenie z perspektywy teraźniejszości; imperfecto umieszcza je w chwili przeszłej."
              tr: "Perfecto olaya şimdiden bakar; imperfecto onu geçmişte bir ana yerleştirir."
              id: "Perfecto melihat peristiwa dari masa kini; imperfecto menempatkannya pada saat di masa lampau."
              vi: "Pretérito perfecto nhìn sự việc từ hiện tại; imperfecto đặt nó vào một thời điểm trong quá khứ."

