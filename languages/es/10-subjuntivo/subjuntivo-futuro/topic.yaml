          ex: ["Donde ", { target: fueres }, ", haz lo que ", { target: vieres }, "."]
          tr: { en: "When in Rome, do as the Romans do.", uk: "Де б ти не був, роби те, що бачиш.", pt: "Onde fores, faz como vires.", fr: "À Rome, fais comme les Romains.", de: "Wohin du auch gehst, tu, was du dort siehst.", it: "Paese che vai, usanza che trovi.", pl: "Gdziekolwiek pójdziesz, rób to, co inni.", tr: "Roma’da Romalı gibi davran.", id: "Di mana bumi dipijak, di situ langit dijunjung.", vi: "Nhập gia tùy tục." }
        - level: C2
          point: { es: Forma compuesta, en: "Compound form", uk: "Складена форма", pt: "Forma composta", fr: "Forme composée", de: "Zusammengesetzte Form", it: "Forma composta", pl: "Forma złożona", tr: "Bileşik biçim", id: "Bentuk majemuk", vi: "Dạng ghép" }
          rule:
            pattern: [{ term: hubiere }, { slot: past participle }]
          ex: ["Si el plazo ", { target: "hubiere vencido" }, ", se rechazará la solicitud."]
          tr: { en: "If the deadline has expired, the application will be rejected.", uk: "Якщо термін мине, заяву буде відхилено.", pt: "Se o prazo tiver vencido, o pedido será rejeitado.", fr: "Si le délai a expiré, la demande sera rejetée.", de: "Ist die Frist abgelaufen, wird der Antrag abgelehnt.", it: "Se il termine sarà scaduto, la richiesta sarà respinta.", pl: "Jeśli termin upłynie, wniosek zostanie odrzucony.", tr: "Süre dolmuşsa başvuru reddedilecektir.", id: "Jika batas waktu telah berakhir, permohonan akan ditolak.", vi: "Nếu thời hạn đã hết, đơn yêu cầu sẽ bị từ chối." }
        - level: C2
          point: { es: Lenguaje jurídico, en: "Legal language", uk: "Юридична мова", pt: "Linguagem jurídica", fr: "Langage juridique", de: "Rechtssprache", it: "Linguaggio giuridico", pl: "Język prawniczy", tr: "Hukuk dili", id: "Bahasa hukum", vi: "Ngôn ngữ pháp lý" }
          rule: { es: "una condición o un supuesto eventual en la ley", en: "a condition or a possible case in the law", uk: "умова або можливий випадок у законі", pt: "uma condição ou um caso eventual na lei", fr: "une condition ou un cas éventuel dans la loi", de: "eine Bedingung oder ein möglicher Fall im Gesetz", it: "una condizione o un caso eventuale nella legge", pl: "warunek lub ewentualny przypadek w ustawie", tr: "kanunda bir koşul ya da olası bir durum", id: "syarat atau kasus yang mungkin terjadi dalam undang-undang", vi: "một điều kiện hoặc một trường hợp có thể xảy ra trong luật" }
          ex: ["Si ", { target: hubiere }, " una disposición contraria, esta no se aplicará."]
          tr: { en: "If there is a contrary provision, it will not apply.", uk: "Якщо буде суперечливе положення, воно не застосовуватиметься.", pt: "Se houver uma disposição contrária, esta não será aplicada.", fr: "S’il existe une disposition contraire, elle ne s’appliquera pas.", de: "Sollte eine entgegenstehende Bestimmung bestehen, findet sie keine Anwendung.", it: "Qualora vi sia una disposizione contraria, questa non si applicherà.", pl: "Jeżeli istnieje przepis przeciwny, nie będzie on stosowany.", tr: "Aksi yönde bir hüküm varsa bu uygulanmaz.", id: "Jika ada ketentuan yang bertentangan, ketentuan itu tidak berlaku.", vi: "Nếu có quy định trái ngược, quy định đó sẽ không được áp dụng." }
        - level: C2
          point: { es: Lenguaje literario, en: "Literary language", uk: "Літературна мова", pt: "Linguagem literária", fr: "Langage littéraire", de: "Literatursprache", it: "Linguaggio letterario", pl: "Język literacki", tr: "Edebî dil", id: "Bahasa sastra", vi: "Ngôn ngữ văn chương" }
          rule: { es: "lo eventual en el verso y en la prosa", en: "what is possible in verse and in prose", uk: "можливе — у вірші та в прозі", pt: "o eventual no verso e na prosa", fr: "l’éventuel dans le vers et dans la prose", de: "das Mögliche in Vers und Prosa", it: "l'eventuale nel verso e nella prosa", pl: "to, co ewentualne, w wierszu i w prozie", tr: "şiirde ve düzyazıda olası olan", id: "hal yang mungkin dalam puisi dan prosa", vi: "điều có thể xảy ra trong thơ và văn xuôi" }
          ex: ["Cuando la noche ", { target: cayere }, ", volveremos a la orilla."]
          tr: { en: "When night falls, we will go back to the shore.", uk: "Коли настане ніч, ми повернемося до берега.", pt: "Quando a noite cair, voltaremos à margem.", fr: "Quand la nuit tombera, nous retournerons sur la rive.", de: "Wenn die Nacht hereinbricht, kehren wir ans Ufer zurück.", it: "Quando calerà la notte, torneremo alla riva.", pl: "Gdy zapadnie noc, wrócimy na brzeg.", tr: "Gece çöktüğünde kıyıya döneceğiz.", id: "Ketika malam tiba, kita akan kembali ke tepian.", vi: "Khi đêm xuống, chúng ta sẽ trở lại bờ." }
        - level: C2
          point: { es: Expresiones fijas, en: "Set phrases", uk: "Сталі вирази", pt: "Expressões fixas", fr: "Expressions figées", de: "Feste Wendungen", it: "Espressioni fisse", pl: "Utarte zwroty", tr: "Kalıp ifadeler", id: "Ungkapan tetap", vi: "Thành ngữ cố định" }
          rule: { es: "fórmulas y refranes heredados", en: "inherited formulas and proverbs", uk: "успадковані формули та прислів’я", pt: "fórmulas e provérbios herdados", fr: "formules et proverbes hérités", de: "überlieferte Formeln und Sprichwörter", it: "formule e proverbi ereditati", pl: "odziedziczone formuły i przysłowia", tr: "devralınmış kalıplar ve atasözleri", id: "ungkapan baku dan peribahasa warisan", vi: "các công thức và tục ngữ được lưu truyền" }
          ex: { examples: [[{ target: Venga }, " lo que ", { target: viniere }, ", estaré contigo."], ["Sea como ", { target: fuere }, ", saldremos mañana."]] }
          tr: { en: { examples: ["Come what may, I'll be with you.", "Be that as it may, we'll leave tomorrow."] }, uk: { examples: ["Що б не сталося, я буду з тобою.", "Як би там не було, ми вирушимо завтра."] }, pt: { examples: ["Venha o que vier, estarei com você.", "Seja como for, sairemos amanhã."] }, fr: { examples: ["Quoi qu’il arrive, je serai avec toi.", "Quoi qu’il en soit, nous partirons demain."] }, de: { examples: ["Komme, was wolle, ich bin bei dir.", "Wie dem auch sei, wir reisen morgen ab."] }, it: { examples: ["Qualunque cosa accada, starò con te.", "Comunque sia, partiremo domani."] }, pl: { examples: ["Cokolwiek się zdarzy, będę z tobą.", "Tak czy owak, wyruszymy jutro."] }, tr: { examples: ["Ne olursa olsun, seninle olacağım.", "Her ne olursa olsun, yarın yola çıkacağız."] }, id: { examples: ["Apa pun yang terjadi, saya akan bersamamu.", "Bagaimanapun juga, kita berangkat besok."] }, vi: { examples: ["Dù chuyện gì xảy ra, tôi vẫn ở bên bạn.", "Dù thế nào đi nữa, ngày mai chúng ta sẽ lên đường."] } }
        - level: C2
          point: { es: Lengua actual, en: "Modern usage", uk: "Сучасна мова", pt: "Língua atual", fr: "Langue actuelle", de: "Heutige Sprache", it: "Lingua attuale", pl: "Język współczesny", tr: "Güncel dil", id: "Bahasa masa kini", vi: "Tiếng hiện đại" }
          rule: { es: "el presente de subjuntivo o de indicativo ocupa su lugar", en: "the present subjunctive or indicative takes its place", uk: "його місце займає теперішній час суб’юнктива або дійсного способу", pt: "o presente do subjuntivo ou do indicativo ocupa o seu lugar", fr: "le présent du subjonctif ou de l’indicatif prend sa place", de: "der Konjunktiv Präsens oder der Indikativ nimmt seinen Platz ein", it: "il presente del congiuntivo o dell'indicativo prende il suo posto", pl: "jego miejsce zajmuje czas teraźniejszy trybu łączącego lub oznajmującego", tr: "yerini dilek kipinin ya da haber kipinin şimdiki zamanı alır", id: "presente subjungtif atau indikatif menggantikannya", vi: "thì hiện tại của thức giả định hoặc chỉ định thay thế nó" }
          ex: ["Quien ", { target: incumpla }, " la norma será sancionado."]
          tr: { en: "Whoever breaks the rule will be penalised.", uk: "Хто порушить норму, буде покараний.", pt: "Quem descumprir a norma será sancionado.", fr: "Quiconque enfreint la règle sera sanctionné.", de: "Wer gegen die Vorschrift verstößt, wird sanktioniert.", it: "Chi viola la norma sarà sanzionato.", pl: "Kto naruszy przepis, zostanie ukarany.", tr: "Kuralı ihlal eden yaptırıma uğrar.", id: "Siapa pun yang melanggar aturan akan dikenai sanksi.", vi: "Ai vi phạm quy định sẽ bị xử phạt." }
        - level: C2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["la raíz sale del indefinido: ", { mapping: [{ term: vieron }, { term: viere }] }], en: ["the stem comes from the preterite: ", { mapping: [{ term: vieron }, { term: viere }]  }], uk: ["основа походить від претериту: ", { mapping: [{ term: vieron }, { term: viere }]  }], pt: ["a raiz vem do pretérito perfeito simples: ", { mapping: [{ term: vieron }, { term: viere }]  }], fr: ["le radical vient du prétérit : ", { mapping: [{ term: vieron }, { term: viere }]  }], de: ["der Stamm kommt vom Indefinido: ", { mapping: [{ term: vieron }, { term: viere }]  }], it: ["la radice viene dall'indefinido: ", { mapping: [{ term: vieron }, { term: viere }]  }], pl: ["temat pochodzi od indefinido: ", { mapping: [{ term: vieron }, { term: viere }]  }], tr: ["gövde indefinido’dan gelir: ", { mapping: [{ term: vieron }, { term: viere }]  }], id: ["akarnya berasal dari indefinido: ", { mapping: [{ term: vieron }, { term: viere }]  }], vi: ["thân từ lấy từ quá khứ đơn: ", { mapping: [{ term: vieron }, { term: viere }]  }] }
          ex: ["Haz lo que ", { target: vieres }, "."]
          tr: { en: "Do as you see.", uk: "Роби те, що бачиш.", pt: "Faça o que você vir.", fr: "Fais ce que tu vois.", de: "Tu, was du siehst.", it: "Fa' quello che vedi.", pl: "Rób to, co widzisz.", tr: "Gördüğünü yap.", id: "Lakukan apa yang kamu lihat.", vi: "Thấy sao làm vậy." }
        - level: C2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: ["la forma de ", { term: nosotros }, " lleva tilde"], en: ["the ", { term: nosotros }, " form takes a written accent"], uk: ["форма ", { term: nosotros }, " має знак наголосу"], pt: ["a forma de ", { term: nosotros }, " leva acento gráfico"], fr: ["la forme de ", { term: nosotros }, " prend un accent écrit"], de: ["die Form von ", { term: nosotros }, " trägt ein Akzentzeichen"], it: ["la forma di ", { term: nosotros }, " porta l'accento scritto"], pl: ["forma ", { term: nosotros }, " ma akcent graficzny"], tr: [{ term: nosotros }, " biçimi vurgu işareti alır"], id: ["bentuk ", { term: nosotros }, " memakai tanda aksen"], vi: ["dạng ", { term: nosotros }, " có dấu sắc"] }
          ex: ["Si lo ", { target: hiciéremos }, " juntos, saldrá bien."]
          tr: { en: "If we do it together, it will turn out well.", uk: "Якщо ми зробимо це разом, усе вийде.", pt: "Se a gente fizer isso junto, vai dar certo.", fr: "Si nous le faisons ensemble, cela ira bien.", de: "Wenn wir es gemeinsam tun, wird es gut gehen.", it: "Se lo faremo insieme, andrà bene.", pl: "Jeśli zrobimy to razem, wszystko się uda.", tr: "Bunu birlikte yaparsak iyi olur.", id: "Jika kita melakukannya bersama, hasilnya akan baik.", vi: "Nếu chúng ta cùng làm, mọi chuyện sẽ ổn." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: C2
            text:
              es: "Presenta una acción como eventual y posterior al momento de la frase."
              en: "It presents an action as possible and later than the time of speaking."
              uk: "Подає дію як можливу й таку, що відбудеться після моменту мовлення."
              pt: "Apresenta uma ação como eventual e posterior ao momento da frase."
              fr: "Il présente une action comme éventuelle et postérieure au moment de la phrase."
              de: "Es stellt eine Handlung als möglich und als nachzeitig zum Sprechzeitpunkt dar."
              it: "Presenta un'azione come eventuale e posteriore al momento della frase."
              pl: "Przedstawia czynność jako ewentualną i późniejszą niż moment wypowiedzi."
              tr: "Bir eylemi olası ve konuşma anından sonra gerçekleşecek olarak sunar."
              id: "Menyajikan tindakan sebagai kemungkinan dan terjadi setelah saat kalimat diucapkan."
              vi: "Nó trình bày một hành động như điều có thể xảy ra và diễn ra sau thời điểm nói."
            ex: ["Si ", { target: hubiere }, " una disposición contraria, prevalecerá la ley."]
            tr: { en: "If there is a contrary provision, the law will prevail.", uk: "Якщо буде суперечливе положення, переважатиме закон.", pt: "Se houver uma disposição contrária, prevalecerá a lei.", fr: "S’il existe une disposition contraire, la loi prévaudra.", de: "Sollte eine entgegenstehende Bestimmung bestehen, geht das Gesetz vor.", it: "Qualora vi sia una disposizione contraria, prevarrà la legge.", pl: "Jeżeli istnieje przepis przeciwny, pierwszeństwo ma ustawa.", tr: "Aksi yönde bir hüküm varsa kanun üstün gelir.", id: "Jika ada ketentuan yang bertentangan, undang-undang yang berlaku.", vi: "Nếu có quy định trái ngược, luật sẽ được ưu tiên." }
          - type: rule
            level: C2
            text:
