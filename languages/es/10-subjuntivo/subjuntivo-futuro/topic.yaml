            variety: es-419
            text:
              es: "En América, el presente o el imperfecto de subjuntivo se prefieren a estas formas incluso en textos formales."
              en: "In Latin America, the present or imperfect subjunctive is preferred to these forms even in formal texts."
              uk: "У Латинській Америці навіть у формальних текстах замість цих форм віддають перевагу теперішньому часу або імперфекту суб’юнктива."
              pt: "Na América Latina, o presente ou o imperfeito do subjuntivo são preferidos a estas formas, até em textos formais."
              fr: "En Amérique latine, le présent ou l’imparfait du subjonctif sont préférés à ces formes, même dans les textes formels."
              de: "In Lateinamerika bevorzugt man auch in formellen Texten den Konjunktiv Präsens oder Imperfecto statt dieser Formen."
              it: "In America Latina si preferiscono il presente o l'imperfetto del congiuntivo a queste forme, anche nei testi formali."
              pl: "W Ameryce Łacińskiej nawet w tekstach formalnych zamiast tych form wybiera się tryb łączący czasu teraźniejszego lub imperfecto."
              tr: "Latin Amerika’da resmî metinlerde bile bu biçimler yerine dilek kipinin şimdiki zamanı ya da imperfecto’su tercih edilir."
              id: "Di Amerika Latin, presente atau imperfecto subjungtif lebih disukai daripada bentuk-bentuk ini, bahkan dalam teks formal."
              vi: "Ở châu Mỹ Latinh, thì hiện tại hoặc thì quá khứ chưa hoàn thành của thức giả định được ưa dùng hơn các dạng này, ngay cả trong văn bản trang trọng."

