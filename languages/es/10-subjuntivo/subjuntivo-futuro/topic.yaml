              vi: ["Thân từ giống với ", { link: "Thì quá khứ chưa hoàn thành của thức giả định", to: es.subjuntivo.subjuntivo-imperfecto }, "; câu điều kiện với ", { term: si }, ": ", { link: "Câu điều kiện", to: es.oracion.condicionales }, "."]

  - title: { es: "Forma: simple y compuesta", en: "Form: simple and compound", uk: "Форма: проста й складена", pt: "Forma: simples e composta", fr: "Forme : simple et composée", de: "Form: einfach und zusammengesetzt", it: "Forma: semplice e composta", pl: "Forma: prosta i złożona", tr: "Biçim: basit ve bileşik", id: "Bentuk: sederhana dan majemuk", vi: "Dạng: đơn và ghép" }
