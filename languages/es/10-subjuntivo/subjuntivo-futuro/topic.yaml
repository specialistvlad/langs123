      rows:
        - level: C2
          point: { es: Forma, en: "Form", uk: "Форма", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" }
          rule:
            pattern: [{ slot: { es: "indefinido de ellos sin -ron", en: "ellos preterite without -ron", uk: "претерит для ellos без -ron", pt: "pretérito perfeito simples de ellos sem -ron", fr: "prétérit de ellos sans -ron", de: "Indefinido von ellos ohne -ron", it: "indefinido di ellos senza -ron", pl: "indefinido ellos bez -ron", tr: "indefinido’nun ellos biçimi, -ron olmadan", id: "indefinido ellos tanpa -ron", vi: "quá khứ đơn của ellos bỏ -ron" } }, { ending: re }]
