      - type: list
        items:
          - type: rule
            level: C2
            text:
              es: ["La raíz es el indefinido de ", { term: ellos }, " sin ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }] }, "."]
              en: ["The stem is the ", { term: ellos }, " preterite form without ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              uk: ["Основа — форма претериту для ", { term: ellos }, " без ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              pt: ["A raiz é a forma de ", { term: ellos }, " do pretérito perfeito simples sem ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              fr: ["Le radical est la forme de ", { term: ellos }, " au prétérit sans ", { term: "-ron" }, " : ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              de: ["Der Stamm ist die ", { term: ellos }, "-Form des Indefinido ohne ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              it: ["La radice è la forma di ", { term: ellos }, " dell'indefinido senza ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              pl: ["Temat to forma ", { term: ellos }, " w indefinido bez ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              tr: ["Gövde, indefinido’nun ", { term: ellos }, " biçiminden ", { term: "-ron" }, " atılarak elde edilir: ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              id: ["Akarnya adalah bentuk indefinido ", { term: ellos }, " tanpa ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
              vi: ["Thân từ là dạng ", { term: ellos }, " của quá khứ đơn bỏ ", { term: "-ron" }, ": ", { mapping: [{ term: tuvieron }, { term: tuvie }]  }, "."]
          - type: rule
            level: C2
            text:
              es: ["Los verbos irregulares mantienen la raíz de su indefinido: ", { mapping: [{ term: fueron }, { term: fuere }] }, ", ", { mapping: [{ term: vieron }, { term: viere }] }, "."]
              en: ["Irregular verbs keep the stem of their preterite: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              uk: ["Неправильні дієслова зберігають основу свого претериту: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
