            tr: { en: { examples: ["Be that as it may, we'll leave tomorrow.", "Come what may, I'll be with you.", "When in Rome, do as the Romans do."] }, uk: { examples: ["Як би там не було, ми вирушимо завтра.", "Що б не сталося, я буду з тобою.", "Де б ти не був, роби те, що бачиш."] }, pt: { examples: ["Seja como for, sairemos amanhã.", "Venha o que vier, estarei com você.", "Onde fores, faz como vires."] }, fr: { examples: ["Quoi qu’il en soit, nous partirons demain.", "Quoi qu’il arrive, je serai avec toi.", "À Rome, fais comme les Romains."] }, de: { examples: ["Wie dem auch sei, wir reisen morgen ab.", "Komme, was wolle, ich bin bei dir.", "Wohin du auch gehst, tu, was du dort siehst."] }, it: { examples: ["Comunque sia, partiremo domani.", "Qualunque cosa accada, starò con te.", "Paese che vai, usanza che trovi."] }, pl: { examples: ["Tak czy owak, wyruszymy jutro.", "Cokolwiek się zdarzy, będę z tobą.", "Gdziekolwiek pójdziesz, rób to, co inni."] }, tr: { examples: ["Her ne olursa olsun, yarın yola çıkacağız.", "Ne olursa olsun, seninle olacağım.", "Roma’da Romalı gibi davran."] }, id: { examples: ["Bagaimanapun juga, kita berangkat besok.", "Apa pun yang terjadi, saya akan bersamamu.", "Di mana bumi dipijak, di situ langit dijunjung."] }, vi: { examples: ["Dù thế nào đi nữa, ngày mai chúng ta sẽ lên đường.", "Dù chuyện gì xảy ra, tôi vẫn ở bên bạn.", "Nhập gia tùy tục."] } }
      - type: list
