              fr: ["Les verbes irréguliers gardent le radical de leur prétérit : ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              de: ["Unregelmäßige Verben behalten den Stamm ihres Indefinido: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              it: ["I verbi irregolari mantengono la radice del loro indefinido: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              pl: ["Czasowniki nieregularne zachowują temat swojego indefinido: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              tr: ["Düzensiz fiiller indefinido gövdesini korur: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              id: ["Kata kerja tidak beraturan mempertahankan akar indefinido-nya: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
              vi: ["Động từ bất quy tắc giữ thân từ của quá khứ đơn: ", { mapping: [{ term: fueron }, { term: fuere }]  }, ", ", { mapping: [{ term: vieron }, { term: viere }]  }, "."]
          - type: rule
            level: C2
            text:
              es: ["La forma de ", { term: nosotros }, " lleva tilde en la vocal anterior a ", { term: "-remos" }, "."]
              en: ["The ", { term: nosotros }, " form takes a written accent on the vowel before ", { term: "-remos" }, "."]
              uk: ["Форма ", { term: nosotros }, " має знак наголосу на голосній перед ", { term: "-remos" }, "."]
              pt: ["A forma de ", { term: nosotros }, " leva acento gráfico na vogal anterior a ", { term: "-remos" }, "."]
              fr: ["La forme de ", { term: nosotros }, " prend un accent écrit sur la voyelle qui précède ", { term: "-remos" }, "."]
              de: ["Die Form von ", { term: nosotros }, " trägt ein Akzentzeichen auf dem Vokal vor ", { term: "-remos" }, "."]
              it: ["La forma di ", { term: nosotros }, " porta l'accento scritto sulla vocale prima di ", { term: "-remos" }, "."]
              pl: ["Forma ", { term: nosotros }, " ma akcent graficzny na samogłosce przed ", { term: "-remos" }, "."]
              tr: [{ term: nosotros }, " biçiminde ", { term: "-remos" }, " öncesindeki ünlü vurgu işareti alır."]
              id: ["Bentuk ", { term: nosotros }, " memakai tanda aksen pada vokal sebelum ", { term: "-remos" }, "."]
              vi: ["Dạng ", { term: nosotros }, " có dấu sắc ở nguyên âm đứng trước ", { term: "-remos" }, "."]
            ex: { examples: [["Si ", { target: habláremos }, " con él, lo sabremos."], ["Si ", { target: comiéremos }, " juntos, pagaremos a medias."]] }
            tr: { en: { examples: ["If we speak with him, we'll find out.", "If we eat together, we'll split the bill."] }, uk: { examples: ["Якщо ми поговоримо з ним, ми дізнаємося.", "Якщо ми пообідаємо разом, розплатимося порівну."] }, pt: { examples: ["Se a gente falar com ele, vamos saber.", "Se a gente comer junto, vamos dividir a conta."] }, fr: { examples: ["Si nous lui parlons, nous le saurons.", "Si nous mangeons ensemble, nous partagerons l’addition."] }, de: { examples: ["Wenn wir mit ihm sprechen, werden wir es erfahren.", "Wenn wir zusammen essen, teilen wir die Rechnung."] }, it: { examples: ["Se parleremo con lui, lo sapremo.", "Se mangeremo insieme, divideremo il conto."] }, pl: { examples: ["Jeśli z nim porozmawiamy, dowiemy się.", "Jeśli zjemy razem, podzielimy rachunek."] }, tr: { examples: ["Onunla konuşursak öğreniriz.", "Birlikte yemek yersek hesabı bölüşürüz."] }, id: { examples: ["Jika kita berbicara dengannya, kita akan tahu.", "Jika kita makan bersama, kita akan membagi tagihan."] }, vi: { examples: ["Nếu chúng ta nói chuyện với anh ấy, chúng ta sẽ biết.", "Nếu chúng ta ăn cùng nhau, chúng ta sẽ chia đôi tiền."] } }
          - type: note
            level: C2
            text:
