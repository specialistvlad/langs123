      - type: list
        items:
          - type: rule
            level: C2
            text:
              es: ["La forma compuesta, ", { term: hubiere }, " con un participio, señala una acción anterior a un momento futuro."]
              en: ["The compound form, ", { term: hubiere }, " with a participle, shows an action before a future moment."]
              uk: ["Складена форма, ", { term: hubiere }, " з дієприкметником, показує дію, що передує майбутньому моменту."]
              pt: ["A forma composta, ", { term: hubiere }, " com um particípio, indica uma ação anterior a um momento futuro."]
              fr: ["La forme composée, ", { term: hubiere }, " avec un participe, indique une action antérieure à un moment futur."]
              de: ["Die zusammengesetzte Form, ", { term: hubiere }, " mit einem Partizip, zeigt eine Handlung vor einem zukünftigen Zeitpunkt."]
              it: ["La forma composta, ", { term: hubiere }, " con un participio, indica un'azione anteriore a un momento futuro."]
              pl: ["Forma złożona, ", { term: hubiere }, " z imiesłowem, oznacza czynność wcześniejszą niż pewien moment w przyszłości."]
              tr: ["Bileşik biçim, yani ", { term: hubiere }, " ile bir participio, gelecekteki bir andan önceki eylemi gösterir."]
              id: ["Bentuk majemuk, ", { term: hubiere }, " dengan sebuah partisip, menunjukkan tindakan sebelum suatu saat di masa depan."]
              vi: ["Dạng ghép, ", { term: hubiere }, " với một quá khứ phân từ, chỉ hành động xảy ra trước một thời điểm trong tương lai."]
            ex: ["Si el plazo ", { target: "hubiere vencido" }, ", se rechazará la solicitud."]
            tr: { en: "If the deadline has expired, the application will be rejected.", uk: "Якщо термін мине, заяву буде відхилено.", pt: "Se o prazo tiver vencido, o pedido será rejeitado.", fr: "Si le délai a expiré, la demande sera rejetée.", de: "Ist die Frist abgelaufen, wird der Antrag abgelehnt.", it: "Se il termine sarà scaduto, la richiesta sarà respinta.", pl: "Jeśli termin upłynie, wniosek zostanie odrzucony.", tr: "Süre dolmuşsa başvuru reddedilecektir.", id: "Jika batas waktu telah berakhir, permohonan akan ditolak.", vi: "Nếu thời hạn đã hết, đơn yêu cầu sẽ bị từ chối." }
          - type: rule
            level: C2
            text:
              es: [{ term: haber }, " forma su compuesta como cualquier verbo:"]
              en: [{ term: haber }, " forms its compound like any verb:"]
              uk: [{ term: haber }, " утворює складену форму, як і будь-яке дієслово:"]
              pt: [{ term: haber }, " forma o seu composto como qualquer verbo:"]
              fr: [{ term: haber }, " forme son composé comme tout verbe :"]
              de: [{ term: haber }, " bildet seine zusammengesetzte Form wie jedes Verb:"]
              it: [{ term: haber }, " forma il suo composto come qualsiasi verbo:"]
              pl: [{ term: haber }, " tworzy formę złożoną jak każdy czasownik:"]
              tr: [{ term: haber }, " bileşik biçimini her fiil gibi kurar:"]
              id: [{ term: haber }, " membentuk bentuk majemuknya seperti kata kerja lain:"]
              vi: [{ term: haber }, " tạo dạng ghép như mọi động từ:"]
            ex: ["Si ", { target: "hubiere habido" }, " una réplica, constará en el acta."]
            tr: { en: "If there has been a reply, it will be recorded in the minutes.", uk: "Якщо була репліка, її буде занесено до протоколу.", pt: "Se tiver havido uma réplica, constará da ata.", fr: "S’il y a eu une réplique, elle figurera au procès-verbal.", de: "Hat es eine Erwiderung gegeben, wird sie ins Protokoll aufgenommen.", it: "Se vi sarà stata una replica, sarà messa a verbale.", pl: "Jeżeli była replika, zostanie ona odnotowana w protokole.", tr: "Bir itiraz olmuşsa tutanakta yer alacaktır.", id: "Jika ada tanggapan, hal itu akan dicatat dalam berita acara.", vi: "Nếu đã có phản hồi, điều đó sẽ được ghi vào biên bản." }

