            text:
              es: ["Comparte la raíz con ", { link: El imperfecto de subjuntivo, to: es.subjuntivo.subjuntivo-imperfecto }, "; las condiciones con ", { term: si }, ": ", { link: Las oraciones condicionales, to: es.oracion.condicionales }, "."]
              en: ["It shares its stem with ", { link: "Imperfect Subjunctive", to: es.subjuntivo.subjuntivo-imperfecto }, "; conditions with ", { term: si }, ": ", { link: "Conditional Sentences", to: es.oracion.condicionales }, "."]
              uk: ["Має спільну основу з ", { link: "Імперфект суб’юнктива", to: es.subjuntivo.subjuntivo-imperfecto }, "; умови з ", { term: si }, ": ", { link: "Умовні речення", to: es.oracion.condicionales }, "."]
              pt: ["Compartilha a raiz com ", { link: "O imperfeito do subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, "; as condições com ", { term: si }, ": ", { link: "As orações condicionais", to: es.oracion.condicionales }, "."]
              fr: ["Il partage son radical avec ", { link: "L’imparfait du subjonctif", to: es.subjuntivo.subjuntivo-imperfecto }, " ; les conditions avec ", { term: si }, " : ", { link: "Les phrases conditionnelles", to: es.oracion.condicionales }, "."]
              de: ["Es teilt den Stamm mit ", { link: "Der Konjunktiv Imperfecto", to: es.subjuntivo.subjuntivo-imperfecto }, "; Bedingungen mit ", { term: si }, ": ", { link: "Die Bedingungssätze", to: es.oracion.condicionales }, "."]
              it: ["Condivide la radice con ", { link: "L'imperfetto del congiuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, "; le condizioni con ", { term: si }, ": ", { link: "Il periodo ipotetico", to: es.oracion.condicionales }, "."]
              pl: ["Ma ten sam temat co ", { link: "Imperfecto trybu łączącego", to: es.subjuntivo.subjuntivo-imperfecto }, "; warunki z ", { term: si }, ": ", { link: "Zdania warunkowe", to: es.oracion.condicionales }, "."]
              tr: ["Gövdesi ", { link: "Dilek kipinin imperfecto’su", to: es.subjuntivo.subjuntivo-imperfecto }, " ile ortaktır; ", { term: si }, " ile kurulan koşullar: ", { link: "Koşul cümleleri", to: es.oracion.condicionales }, "."]
