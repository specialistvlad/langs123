              pl: "Występuje w tekstach prawnych i literackich oraz w utartych zwrotach."
              tr: "Hukuki ve edebî metinlerde ve kalıp ifadelerde görülür."
              id: "Bentuk ini muncul dalam teks hukum dan sastra serta dalam ungkapan tetap."
              vi: "Nó xuất hiện trong văn bản pháp lý, văn học và các thành ngữ cố định."
          - type: note
