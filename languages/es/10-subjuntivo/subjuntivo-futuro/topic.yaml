              en: "It appears in legal and literary texts and in set phrases."
              uk: "Трапляється в юридичних і літературних текстах та в сталих виразах."
              pt: "Aparece em textos jurídicos e literários e em expressões fixas."
              fr: "Il se trouve dans les textes juridiques et littéraires et dans les expressions figées."
              de: "Es steht in juristischen und literarischen Texten und in festen Wendungen."
