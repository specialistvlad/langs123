title: { es: "El futuro de subjuntivo: hablare, hubiere", en: "Future Subjunctive: hablare, hubiere", uk: "Майбутній час суб’юнктива: hablare, hubiere", pt: "O futuro do subjuntivo: hablare, hubiere", fr: "Le futur du subjonctif : hablare, hubiere", de: "Der Konjunktiv Futur: hablare, hubiere", it: "Il futuro del congiuntivo: hablare, hubiere", pl: "Tryb łączący czasu przyszłego: hablare, hubiere", tr: "Dilek kipinin gelecek zamanı: hablare, hubiere", id: "Futuro subjungtif: hablare, hubiere", vi: "Thì tương lai của thức giả định: hablare, hubiere" }
summary:
  lead:
    es: ["El futuro de subjuntivo, ", { term: hablare }, " o ", { term: hubiere }, ", presenta una acción como eventual en las leyes, en la literatura y en las expresiones fijas."]
    en: ["The future subjunctive, ", { term: hablare }, " or ", { term: hubiere }, ", presents an action as possible in laws, in literature and in set phrases."]
    uk: ["Майбутній час суб’юнктива, ", { term: hablare }, " або ", { term: hubiere }, ", подає дію як можливу в законах, літературі та сталих виразах."]
    pt: ["O futuro do subjuntivo, ", { term: hablare }, " ou ", { term: hubiere }, ", apresenta uma ação como eventual nas leis, na literatura e nas expressões fixas."]
    fr: ["Le futur du subjonctif, ", { term: hablare }, " ou ", { term: hubiere }, ", présente une action comme éventuelle dans les lois, la littérature et les expressions figées."]
    de: ["Der Konjunktiv Futur, ", { term: hablare }, " oder ", { term: hubiere }, ", stellt eine Handlung in Gesetzen, in der Literatur und in festen Wendungen als möglich dar."]
    it: ["Il futuro del congiuntivo, ", { term: hablare }, " o ", { term: hubiere }, ", presenta un'azione come eventuale nelle leggi, nella letteratura e nelle espressioni fisse."]
    pl: ["Tryb łączący czasu przyszłego, ", { term: hablare }, " lub ", { term: hubiere }, ", przedstawia czynność jako ewentualną w prawie, literaturze i utartych zwrotach."]
    tr: ["Dilek kipinin gelecek zamanı, ", { term: hablare }, " ya da ", { term: hubiere }, ", bir eylemi yasalarda, edebiyatta ve kalıp sözlerde olası olarak sunar."]
    id: ["Futuro subjungtif, ", { term: hablare }, " atau ", { term: hubiere }, ", menyajikan suatu tindakan sebagai kemungkinan dalam undang-undang, sastra, dan ungkapan tetap."]
    vi: ["Thì tương lai của thức giả định, ", { term: hablare }, " hoặc ", { term: hubiere }, ", nêu hành động có thể xảy ra trong luật, văn chương và thành ngữ cố định."]
  rule:
    es: ["La raíz es el indefinido de ", { term: ellos }, " sin ", { term: "-ron" }, ", más ", { term: "-re" }, ":"]
    en: ["The stem is the ", { term: ellos }, " preterite form without ", { term: "-ron" }, ", plus ", { term: "-re" }, ":"]
    uk: ["Основа — форма претериту для ", { term: ellos }, " без ", { term: "-ron" }, ", плюс ", { term: "-re" }, ":"]
    pt: ["A raiz é a forma de ", { term: ellos }, " do pretérito perfeito simples sem ", { term: "-ron" }, ", mais ", { term: "-re" }, ":"]
    fr: ["Le radical est la forme de ", { term: ellos }, " au prétérit sans ", { term: "-ron" }, ", plus ", { term: "-re" }, " :"]
    de: ["Der Stamm ist die ", { term: ellos }, "-Form des Indefinido ohne ", { term: "-ron" }, ", plus ", { term: "-re" }, ":"]
    it: ["La radice è la forma di ", { term: ellos }, " dell'indefinido senza ", { term: "-ron" }, ", più ", { term: "-re" }, ":"]
    pl: ["Temat to forma ", { term: ellos }, " w indefinido bez ", { term: "-ron" }, ", plus ", { term: "-re" }, ":"]
    tr: ["Gövde, indefinido’nun ", { term: ellos }, " biçiminden ", { term: "-ron" }, " atılarak elde edilir; sonuna ", { term: "-re" }, " eklenir:"]
    id: ["Akarnya adalah bentuk indefinido ", { term: ellos }, " tanpa ", { term: "-ron" }, ", ditambah ", { term: "-re" }, ":"]
    vi: ["Thân từ là dạng ", { term: ellos }, " của quá khứ đơn bỏ ", { term: "-ron" }, ", thêm ", { term: "-re" }, ":"]
  ex: { examples: [["Quien ", { target: incumpliere }, " la norma será sancionado."], ["Sea como ", { target: fuere }, "."]] }

