          tr: { en: "If applicable, the amount will be refunded.", uk: "У разі потреби суму буде повернено.", pt: "Se for o caso, o valor será devolvido.", fr: "Le cas échéant, le montant sera remboursé.", de: "Gegebenenfalls wird der Betrag erstattet.", it: "Se del caso, l'importo sarà restituito.", pl: "W razie potrzeby kwota zostanie zwrócona.", tr: "Gerekirse tutar iade edilecektir.", id: "Jika berlaku, jumlahnya akan dikembalikan.", vi: "Nếu phù hợp, số tiền sẽ được hoàn lại." }
        - level: C2
