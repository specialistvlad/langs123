              uk: ["Неправильні основи: ", { link: "Таблиця неправильних дієслів", to: es.pasados.verbos-irregulares }, "."]
              pt: ["As raízes irregulares: ", { link: "Tabela de verbos irregulares", to: es.pasados.verbos-irregulares }, "."]
              fr: ["Les radicaux irréguliers : ", { link: "Tableau des verbes irréguliers", to: es.pasados.verbos-irregulares }, "."]
              de: ["Die unregelmäßigen Stämme: ", { link: "Tabelle der unregelmäßigen Verben", to: es.pasados.verbos-irregulares }, "."]
              it: ["Le radici irregolari: ", { link: "Tabella dei verbi irregolari", to: es.pasados.verbos-irregulares }, "."]
