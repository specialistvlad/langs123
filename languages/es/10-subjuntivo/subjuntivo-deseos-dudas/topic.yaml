# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.subjuntivo.subjuntivo-deseos-dudas
lang: es
kind: grammar
tags: [verbs, subjunctive, mood, clauses]
concepts: [subjunctive]
related: [es.subjuntivo.subjuntivo-formas, es.subjuntivo.subjuntivo-cuando-para-que, es.ser-estar-hay-gustar.gustar, es.futuro-condicional.condicional-simple]
status: { en: draft, es: draft }
translated: { es: "d596a0 c9b5d0 4537cf 519509 06c8d3 155767 903f12 9580cd 628fa9" }

title: { en: "Subjunctive for Wishes, Doubt and Opinions", es: "El subjuntivo: deseos, dudas y opiniones" }
summary:
  lead:
    en: ["After verbs of wishing, feeling and doubting, and after ", { term: ojalá }, ", a second subject takes the subjunctive: ", { term: quiero que vengas }, "."]
    es: ["Detrás de verbos de deseo, sentimiento y duda, y detrás de ", { term: ojalá }, ", un segundo sujeto lleva subjuntivo: ", { term: quiero que vengas }, "."]
  rule:
    en: ["With one subject, the second verb stays an infinitive; with two, it takes ", { term: que }, " and the subjunctive:"]
    es: ["Con un solo sujeto, el segundo verbo va en infinitivo; con dos, lleva ", { term: que }, " y subjuntivo:"]
  ex: { examples: [["Quiero ", { target: ir }, "."], ["Quiero que ", { target: vayas }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: B1
          point: { en: Wishes, es: Deseos }
          rule:
            en: [{ alternatives: [{ term: querer }, { term: esperar }, { term: preferir }, { term: necesitar }] }, " with ", { term: que }]
            es: [{ alternatives: [{ term: querer }, { term: esperar }, { term: preferir }, { term: necesitar }] }, " con ", { term: que }]
          ex: ["Espero que ", { target: estés }, " bien."]
          tr: { en: "I hope you're well." }
        - level: B1
          point: { term: ojalá }
          rule:
            en: "a hope, always with the subjunctive"
            es: "un deseo, siempre con subjuntivo"
          ex: ["Ojalá no ", { target: llueva }, "."]
          tr: { en: "I hope it doesn't rain." }
        - level: B1
          point: { en: Feelings, es: Sentimientos }
          rule:
            en: [{ alternatives: [{ term: me alegra }, { term: me molesta }, { term: me da miedo }] }, " with ", { term: que }]
            es: [{ alternatives: [{ term: me alegra }, { term: me molesta }, { term: me da miedo }] }, " con ", { term: que }]
          ex: ["Me alegra que ", { target: estés }, " aquí."]
          tr: { en: "I'm glad you're here." }
        - level: B1
          point: { en: Doubt, es: Duda }
          rule:
            en: { alternatives: [{ term: no creo que }, { term: no pienso que }, { term: dudo que }] }
            es: { alternatives: [{ term: no creo que }, { term: no pienso que }, { term: dudo que }] }
          ex: ["No creo que ", { target: venga }, "."]
          tr: { en: "I don't think she'll come." }
        - level: B1
          point: { en: Judgements, es: Valoraciones }
          rule:
            en: { alternatives: [{ term: es importante que }, { term: es mejor que }, { term: es normal que }] }
            es: { alternatives: [{ term: es importante que }, { term: es mejor que }, { term: es normal que }] }
          ex: ["Es importante que ", { target: duermas }, " bien."]
          tr: { en: "It's important that you sleep well." }
        - level: B1
          point: { en: One subject, es: Un solo sujeto }
          rule:
            en: ["the infinitive, with no ", { term: que }]
            es: ["el infinitivo, sin ", { term: que }]
          ex: ["Quiero ", { target: descansar }, "."]
          tr: { en: I want to rest. }
        - level: B1
          point: { en: Belief, es: Creencia }
          rule:
            en: [{ term: creo que }, " and ", { term: pienso que }, " take the indicative"]
            es: [{ term: creo que }, " y ", { term: pienso que }, " llevan indicativo"]
          ex: ["Creo que ", { target: viene }, "."]
          tr: { en: "I think she's coming." }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["“I want you to” is ", { term: quiero que }, " with the subjunctive"]
            es: ["para querer que otro haga algo: ", { term: quiero que }, " con subjuntivo"]
          ex: ["Quiero que ", { target: vengas }, "."]
          tr: { en: I want you to come. }
        - level: B1
          point: { en: Trap, es: Trampa }
          rule:
            en: ["a fact stated as true takes the indicative: ", { term: es verdad que }]
            es: ["un hecho presentado como cierto lleva indicativo: ", { term: es verdad que }]
          ex: ["Es verdad que ", { target: es }, " caro."]
          tr: { en: "It's true that it's expensive." }

sections:
  - title: { en: Overview, es: Visión general }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A main verb of wishing, feeling, doubting or judging, with ", { term: que }, ", puts the second verb in the subjunctive."]
              es: ["Un verbo principal de deseo, sentimiento, duda o valoración, con ", { term: que }, ", pone el segundo verbo en subjuntivo."]
          - type: rule
            level: B1
            text:
              en: "The subjunctive needs two different subjects; with one, the infinitive follows."
              es: "El subjuntivo necesita dos sujetos distintos; con uno solo, sigue el infinitivo."
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: wishes and requests", es: "Uso: deseos y peticiones" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, verb: querer que, ex: ["Mis padres quieren que ", { target: estudie }, " medicina."], tr: { en: My parents want me to study medicine. } }
          - { level: B1, verb: esperar que, ex: ["Espero que ", { target: tengas }, " un buen viaje."], tr: { en: I hope you have a good trip. } }
          - { level: B1, verb: preferir que, ex: ["Prefiero que ", { target: vengas }, " mañana."], tr: { en: "I'd rather you came tomorrow." } }
          - { level: B1, verb: necesitar que, ex: ["Necesito que me ", { target: ayudes }, "."], tr: { en: I need you to help me. } }
          - { level: B1, verb: pedir que, ex: ["Te pido que ", { target: hables }, " más despacio."], tr: { en: "I'm asking you to speak more slowly." } }
          - { level: B1, verb: ojalá, ex: ["Ojalá ", { target: haga }, " buen tiempo."], tr: { en: I hope the weather is good. } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: ojalá }, " takes the subjunctive, with or without ", { term: que }, ":"]
              es: [{ term: ojalá }, " lleva subjuntivo, con ", { term: que }, " o sin él:"]
            ex: ["Ojalá que ", { target: ganen }, "."]
            tr: { en: I hope they win. }

  - title: { en: "Use: feelings", es: "Uso: sentimientos" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, verb: me alegra que, ex: ["Me alegra que ", { target: estés }, " mejor."], tr: { en: "I'm glad you're better." } }
          - { level: B1, verb: me molesta que, ex: ["Me molesta que ", { target: llegues }, " tarde."], tr: { en: It annoys me when you arrive late. } }
          - { level: B1, verb: me gusta que, ex: ["Me gusta que me ", { target: llames }, "."], tr: { en: I like it when you call me. } }
          - { level: B1, verb: me da miedo que, ex: ["Me da miedo que ", { target: se pierda }, "."], tr: { en: "I'm afraid she'll get lost." } }
          - { level: B1, verb: siento que, ex: ["Siento que no ", { target: puedas }, " venir."], tr: { en: "I'm sorry you can't come." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs like ", { term: alegrar }, " and ", { term: molestar }, " work like ", { term: gustar }, ": the clause with ", { term: que }, " is what causes the feeling."]
              es: ["Verbos como ", { term: alegrar }, " y ", { term: molestar }, " funcionan como ", { term: gustar }, ": la oración con ", { term: que }, " es lo que causa el sentimiento."]
          - type: note
            level: B1
            text:
              en: ["The pattern of these verbs: ", { link: Gustar and Similar Verbs, to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["La estructura de estos verbos: ", { link: Gustar y verbos similares, to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Use: belief and doubt", es: "Uso: creencia y duda" }
    role: use
    content:
      - type: comparison
        columns:
          - { key: ind, label: { en: Indicative, es: Indicativo } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo } }
        rows:
          - { level: B1, ind: { en: what the speaker believes, es: lo que cree el hablante }, sbjv: { en: what the speaker doubts or denies, es: lo que el hablante duda o niega } }
          - level: B1
            ind: { ex: ["Creo que ", { target: tiene }, " razón."], tr: { en: "I think he's right." } }
            sbjv: { ex: ["No creo que ", { target: tenga }, " razón."], tr: { en: "I don't think he's right." } }
          - level: B1
            ind: { ex: ["Pienso que ", { target: es }, " fácil."], tr: { en: "I think it's easy." } }
            sbjv: { ex: ["No pienso que ", { target: sea }, " fácil."], tr: { en: "I don't think it's easy." } }
          - level: B1
            ind: { ex: ["Me parece que ", { target: va }, " a llover."], tr: { en: "I think it's going to rain." } }
            sbjv: { ex: ["No me parece que ", { target: vaya }, " a llover."], tr: { en: "I don't think it's going to rain." } }
          - level: B1
            ind: { ex: ["Estoy seguro de que ", { target: viene }, "."], tr: { en: "I'm sure he's coming." } }
            sbjv: { ex: ["Dudo que ", { target: venga }, "."], tr: { en: I doubt he's coming. } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: creer }, ", ", { term: pensar }, " and ", { term: parecer }, " take the indicative, and the subjunctive in a negative statement."]
              es: [{ term: creer }, ", ", { term: pensar }, " y ", { term: parecer }, " llevan indicativo, y subjuntivo en una oración enunciativa negativa."]
          - type: rule
            level: B1
            text:
              en: [{ term: quizá }, " and ", { term: tal vez }, " before the verb make a guess, usually with the subjunctive:"]
              es: [{ term: quizá }, " y ", { term: tal vez }, " delante del verbo expresan una suposición, casi siempre con subjuntivo:"]
            ex: ["Quizá ", { target: llueva }, " mañana."]
            tr: { en: "Maybe it'll rain tomorrow." }

  - title: { en: "Use: judgements", es: "Uso: valoraciones" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Expression, es: Expresión } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: B1, verb: es importante que, ex: ["Es importante que ", { target: bebas }, " agua."], tr: { en: "It's important that you drink water." } }
          - { level: B1, verb: es mejor que, ex: ["Es mejor que ", { target: salgamos }, " temprano."], tr: { en: "It's better if we leave early." } }
          - { level: B1, verb: es necesario que, ex: ["Es necesario que ", { target: traigas }, " el pasaporte."], tr: { en: You need to bring your passport. } }
          - { level: B1, verb: es normal que, ex: ["Es normal que ", { target: estés }, " nervioso."], tr: { en: "It's normal for you to be nervous." } }
          - { level: B1, verb: es una pena que, ex: ["Es una pena que no ", { target: puedas }, " venir."], tr: { en: "It's a pity you can't come." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A fact stated as true takes the indicative: ", { term: es verdad que }, ", ", { term: es evidente que }, ":"]
              es: ["Un hecho presentado como cierto lleva indicativo: ", { term: es verdad que }, ", ", { term: es evidente que }, ":"]
            ex: ["Es verdad que ", { target: hace }, " frío."]
            tr: { en: "It's true that it's cold." }

  - title: { en: One subject or two, es: Un sujeto o dos }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The same subject: the infinitive follows, with no ", { term: que }, ":"]
              es: ["El mismo sujeto: sigue el infinitivo, sin ", { term: que }, ":"]
            ex: ["Quiero ", { target: viajar }, "."]
            tr: { en: I want to travel. }
          - type: rule
            level: B1
            text:
              en: ["Two subjects: ", { term: que }, " and the subjunctive:"]
              es: ["Dos sujetos: ", { term: que }, " y subjuntivo:"]
            ex: ["Quiero que ", { target: viajes }, "."]
            tr: { en: I want you to travel. }
          - type: rule
            level: B1
            text:
              en: "A judgement about people in general takes the infinitive:"
              es: "Una valoración sobre la gente en general lleva infinitivo:"
            ex: ["Es importante ", { target: dormir }, " bien."]
            tr: { en: "It's important to sleep well." }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: Espero que tienes un buen viaje., right: ["Espero que ", { target: tengas }, " un buen viaje."], rule: { en: [{ term: esperar que }, " takes the subjunctive"], es: [{ term: esperar que }, " lleva subjuntivo"] } }
          - { level: B1, wrong: Ojalá tienes suerte., right: ["Ojalá ", { target: tengas }, " suerte."], rule: { en: [{ term: ojalá }, " always takes the subjunctive"], es: [{ term: ojalá }, " lleva siempre subjuntivo"] } }
          - { level: B1, wrong: No creo que es verdad., right: ["No creo que ", { target: sea }, " verdad."], rule: { en: [{ term: no creo que }, " takes the subjunctive"], es: [{ term: no creo que }, " lleva subjuntivo"] } }
          - { level: B1, wrong: Creo que sea verdad., right: ["Creo que ", { target: es }, " verdad."], rule: { en: [{ term: creo que }, " takes the indicative"], es: [{ term: creo que }, " lleva indicativo"] } }
          - { level: B1, wrong: Quiero que yo vaya., right: ["Quiero ", { target: ir }, "."], rule: { en: "one subject takes the infinitive", es: "un solo sujeto lleva infinitivo" } }
          - { level: B1, speakers: [en], wrong: Quiero tú vienes., right: ["Quiero que ", { target: vengas }, "."], rule: { en: ["“I want you to” is ", { term: quiero que }, " with the subjunctive"] } }
