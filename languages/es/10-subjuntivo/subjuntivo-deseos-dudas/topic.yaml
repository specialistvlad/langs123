  - title: { es: El subjuntivo en el pasado, en: "The subjunctive in the past", uk: "Суб’юнктив у минулому", pt: "O subjuntivo no passado", fr: "Le subjonctif au passé", de: "Der Konjunktiv in der Vergangenheit", it: "Il congiuntivo al passato", pl: "Tryb łączący w przeszłości", tr: "Geçmişte dilek kipi", id: "Subjungtif di masa lampau", vi: "Thức giả định ở quá khứ" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { es: Verbo principal, en: "Main verb", uk: "Головне дієслово", pt: "Verbo principal", fr: "Verbe principal", de: "Hauptverb", it: "Verbo principale", pl: "Czasownik główny", tr: "Ana fiil", id: "Kata kerja utama", vi: "Động từ chính" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, verb: aconsejar que, ex: ["Aconsejó que ", { target: descansara }, "."], tr: { en: "She advised me to rest.", uk: "Вона порадила мені відпочити.", pt: "Ela aconselhou que eu descansasse.", fr: "Elle m’a conseillé de me reposer.", de: "Sie riet mir, mich auszuruhen.", it: "Mi ha consigliato di riposare.", pl: "Poradziła mi, żebym odpoczął.", tr: "Bana dinlenmemi tavsiye etti.", id: "Dia menyarankan agar saya beristirahat.", vi: "Cô ấy khuyên tôi nên nghỉ ngơi." } }
          - { level: B2, verb: sugerir que, ex: ["Sugirió que lo ", { target: dejáramos }, " para otro día."], tr: { en: "She suggested that we leave it for another day.", uk: "Вона запропонувала відкласти це на інший день.", pt: "Ela sugeriu que a gente deixasse isso para outro dia.", fr: "Elle a suggéré que nous remettions cela à un autre jour.", de: "Sie schlug vor, es auf einen anderen Tag zu verschieben.", it: "Suggerì di rimandare a un altro giorno.", pl: "Zasugerowała, żebyśmy odłożyli to na inny dzień.", tr: "Bunu başka bir güne bırakmamızı önerdi.", id: "Dia menyarankan agar kita menundanya ke hari lain.", vi: "Cô ấy gợi ý để việc đó sang ngày khác." } }
          - { level: B2, verb: querer que, ex: ["Quería que me ", { target: quedara }, " a cenar."], tr: { en: "She wanted me to stay for dinner.", uk: "Вона хотіла, щоб я залишився на вечерю.", pt: "Ela queria que eu ficasse para jantar.", fr: "Elle voulait que je reste dîner.", de: "Sie wollte, dass ich zum Abendessen bleibe.", it: "Voleva che mi fermassi a cena.", pl: "Chciała, żebym został na kolacji.", tr: "Akşam yemeğine kalmamı istiyordu.", id: "Dia ingin saya tinggal untuk makan malam.", vi: "Cô ấy muốn tôi ở lại ăn tối." } }
          - { level: B2, verb: provocar que, ex: ["La lluvia provocó que se ", { target: cancelara }, " el partido."], tr: { en: "The rain caused the match to be cancelled.", uk: "Через дощ матч скасували.", pt: "A chuva fez com que a partida fosse cancelada.", fr: "La pluie a fait annuler le match.", de: "Der Regen führte dazu, dass das Spiel abgesagt wurde.", it: "La pioggia ha fatto annullare la partita.", pl: "Deszcz sprawił, że mecz odwołano.", tr: "Yağmur yüzünden maç iptal edildi.", id: "Hujan menyebabkan pertandingan dibatalkan.", vi: "Cơn mưa khiến trận đấu bị hủy." } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Con un verbo principal en pasado, la influencia, el deseo y la causa mantienen el subjuntivo."
              en: "After a main verb in the past, influence, wish and cause keep the subjunctive."
              uk: "Після головного дієслова в минулому вплив, бажання й причина зберігають суб’юнктив."
              pt: "Com um verbo principal no passado, a influência, o desejo e a causa mantêm o subjuntivo."
              fr: "Avec un verbe principal au passé, l’influence, le souhait et la cause maintiennent le subjonctif."
              de: "Nach einem Hauptverb in der Vergangenheit bleiben Einflussnahme, Wunsch und Ursache beim Konjunktiv."
              it: "Con un verbo principale al passato, l'influenza, il desiderio e la causa mantengono il congiuntivo."
              pl: "Przy czasowniku głównym w czasie przeszłym wpływ, życzenie i przyczyna utrzymują tryb łączący."
              tr: "Ana fiil geçmişteyse etkileme, istek ve neden dilek kipini korur."
              id: "Dengan kata kerja utama di masa lampau, pengaruh, keinginan, dan sebab mempertahankan subjungtif."
              vi: "Với động từ chính ở quá khứ, sự tác động, mong muốn và nguyên nhân vẫn giữ thức giả định."
