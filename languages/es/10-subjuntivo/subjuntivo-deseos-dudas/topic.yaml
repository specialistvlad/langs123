              pt: ["A escolha do tempo: ", { link: "A correlação dos tempos verbais com o subjuntivo", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              fr: ["Le choix du temps : ", { link: "La concordance des temps avec le subjonctif", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              de: ["Die Wahl der Zeitform: ", { link: "Die Zeitenfolge mit dem Konjunktiv", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              it: ["La scelta del tempo: ", { link: "La consecutio temporum con il congiuntivo", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              pl: ["Wybór czasu: ", { link: "Następstwo czasów z trybem łączącym", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              tr: ["Zaman seçimi: ", { link: "Dilek kipiyle zaman uyumu", to: es.subjuntivo.subjuntivo-correlacion }, "."]
              id: ["Pemilihan tense: ", { link: "Kesesuaian kala dengan subjungtif", to: es.subjuntivo.subjuntivo-correlacion }, "."]
