            meaning: { es: "Un deseo hostil, con desprecio", en: "A hostile wish, with contempt", uk: "Недоброзичливе побажання, з погордою", pt: "Um desejo hostil, com desprezo", fr: "Un souhait hostile, avec mépris", de: "Ein feindseliger Wunsch, voller Verachtung", it: "Un augurio ostile, con disprezzo", pl: "Wrogie życzenie, z pogardą", tr: "Aşağılayıcı, düşmanca bir dilek", id: "Harapan bermusuhan, dengan penghinaan", vi: "Một lời chúc dữ, kèm sự khinh bỉ" }
