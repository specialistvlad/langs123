            meaning: { es: "Una posibilidad, en México, las Antillas y Sudamérica", en: "A possibility, in Mexico, the Antilles and South America", uk: "Можливість — у Мексиці, на Антильських островах і в Південній Америці", pt: "Uma possibilidade, no México, nas Antilhas e na América do Sul", fr: "Une possibilité, au Mexique, aux Antilles et en Amérique du Sud", de: "Eine Möglichkeit, in Mexiko, auf den Antillen und in Südamerika", it: "Una possibilità, in Messico, nelle Antille e in Sud America", pl: "Możliwość, w Meksyku, na Antylach i w Ameryce Południowej", tr: "Bir olasılık; Meksika’da, Antiller’de ve Güney Amerika’da", id: "Kemungkinan, di Meksiko, Antilla, dan Amerika Selatan", vi: "Một khả năng, ở Mexico, vùng Antilles và Nam Mỹ" }
