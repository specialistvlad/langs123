id: es.subjuntivo.subjuntivo-deseos-dudas
lang: es
kind: grammar
tags: [verbs, subjunctive, mood, clauses]
concepts: [subjunctive]
related: [es.subjuntivo.subjuntivo-formas, es.subjuntivo.subjuntivo-cuando-para-que, es.ser-estar-hay-gustar.gustar, es.futuro-condicional.condicional-simple]
status: { en: draft, es: draft, uk: draft }
translated: { en: "649a54 8db641 573519 f27c22 3b24a5 6e60db b27c93 559d76 8dd404", uk: "649a54 8db641 573519 f27c22 3b24a5 6e60db b27c93 559d76 8dd404" }

title: { en: "Subjunctive for Wishes, Doubt and Opinions", es: "El subjuntivo: deseos, dudas y opiniones", uk: "Суб’юнктив: бажання, сумніви й думки" }
summary:
  lead:
    en: ["After verbs of wishing, feeling and doubting, and after ", { term: ojalá }, ", a second subject takes the subjunctive: ", { term: quiero que vengas }, "."]
    es: ["Detrás de verbos de deseo, sentimiento y duda, y detrás de ", { term: ojalá }, ", un segundo sujeto lleva subjuntivo: ", { term: quiero que vengas }, "."]
    uk: ["Після дієслів бажання, почуття й сумніву, а також після ", { term: ojalá }, ", другий підмет вимагає суб’юнктива: ", { term: quiero que vengas }, "."]
  rule:
    en: ["With one subject, the second verb stays an infinitive; with two, it takes ", { term: que }, " and the subjunctive:"]
    es: ["Con un solo sujeto, el segundo verbo va en infinitivo; con dos, lleva ", { term: que }, " y subjuntivo:"]
    uk: ["З одним підметом друге дієслово лишається в інфінітиві; з двома — з’являються ", { term: que }, " і суб’юнктив:"]
  ex: { examples: [["Quiero ", { target: ir }, "."], ["Quiero que ", { target: vayas }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: B1
          point: { en: Wishes, es: Deseos, uk: Бажання }
          rule:
            en: [{ alternatives: [{ term: querer }, { term: esperar }, { term: preferir }, { term: necesitar }] }, " with ", { term: que }]
            es: [{ alternatives: [{ term: querer }, { term: esperar }, { term: preferir }, { term: necesitar }] }, " con ", { term: que }]
            uk: [{ alternatives: [{ term: querer }, { term: esperar }, { term: preferir }, { term: necesitar }] }, " з ", { term: que }]
          ex: ["Espero que ", { target: estés }, " bien."]
          tr: { en: "I hope you're well.", uk: "Сподіваюся, у тебе все добре." }
        - level: B1
          point: { term: ojalá }
          rule:
            en: "a hope, always with the subjunctive"
            es: "un deseo, siempre con subjuntivo"
            uk: "побажання, завжди із суб’юнктивом"
          ex: ["Ojalá no ", { target: llueva }, "."]
          tr: { en: "I hope it doesn't rain.", uk: "Хоч би не було дощу." }
        - level: B1
          point: { en: Feelings, es: Sentimientos, uk: Почуття }
          rule:
            en: [{ alternatives: [{ term: me alegra }, { term: me molesta }, { term: me da miedo }] }, " with ", { term: que }]
            es: [{ alternatives: [{ term: me alegra }, { term: me molesta }, { term: me da miedo }] }, " con ", { term: que }]
            uk: [{ alternatives: [{ term: me alegra }, { term: me molesta }, { term: me da miedo }] }, " з ", { term: que }]
          ex: ["Me alegra que ", { target: estés }, " aquí."]
          tr: { en: "I'm glad you're here.", uk: "Я радий, що ти тут." }
        - level: B1
          point: { en: Doubt, es: Duda, uk: Сумнів }
          rule:
            en: { alternatives: [{ term: no creo que }, { term: no pienso que }, { term: dudo que }] }
            es: { alternatives: [{ term: no creo que }, { term: no pienso que }, { term: dudo que }] }
            uk: { alternatives: [{ term: no creo que }, { term: no pienso que }, { term: dudo que }] }
          ex: ["No creo que ", { target: venga }, "."]
          tr: { en: "I don't think she'll come.", uk: "Не думаю, що вона прийде." }
        - level: B1
          point: { en: Judgements, es: Valoraciones, uk: Оцінки }
          rule:
            en: { alternatives: [{ term: es importante que }, { term: es mejor que }, { term: es normal que }] }
            es: { alternatives: [{ term: es importante que }, { term: es mejor que }, { term: es normal que }] }
            uk: { alternatives: [{ term: es importante que }, { term: es mejor que }, { term: es normal que }] }
          ex: ["Es importante que ", { target: duermas }, " bien."]
          tr: { en: "It's important that you sleep well.", uk: "Важливо, щоб ти добре спав." }
        - level: B1
          point: { en: One subject, es: Un solo sujeto, uk: Один підмет }
          rule:
            en: ["the infinitive, with no ", { term: que }]
            es: ["el infinitivo, sin ", { term: que }]
            uk: ["інфінітив, без ", { term: que }]
          ex: ["Quiero ", { target: descansar }, "."]
          tr: { en: I want to rest., uk: "Я хочу відпочити." }
        - level: B1
          point: { en: Belief, es: Creencia, uk: Переконання }
          rule:
            en: [{ term: creo que }, " and ", { term: pienso que }, " take the indicative"]
            es: [{ term: creo que }, " y ", { term: pienso que }, " llevan indicativo"]
            uk: [{ term: creo que }, " та ", { term: pienso que }, " вимагають дійсного способу"]
          ex: ["Creo que ", { target: viene }, "."]
          tr: { en: "I think she's coming.", uk: "Думаю, вона прийде." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["“I want you to” is ", { term: quiero que }, " with the subjunctive"]
            es: ["para querer que otro haga algo: ", { term: quiero que }, " con subjuntivo"]
            uk: ["«хочу, щоб ти…» — це ", { term: quiero que }, " із суб’юнктивом"]
          ex: ["Quiero que ", { target: vengas }, "."]
          tr: { en: I want you to come., uk: "Я хочу, щоб ти прийшов." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["a fact stated as true takes the indicative: ", { term: es verdad que }]
            es: ["un hecho presentado como cierto lleva indicativo: ", { term: es verdad que }]
            uk: ["факт, поданий як правда, вимагає дійсного способу: ", { term: es verdad que }]
          ex: ["Es verdad que ", { target: es }, " caro."]
          tr: { en: "It's true that it's expensive.", uk: "Це правда, що це дорого." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A main verb of wishing, feeling, doubting or judging, with ", { term: que }, ", puts the second verb in the subjunctive."]
              es: ["Un verbo principal de deseo, sentimiento, duda o valoración, con ", { term: que }, ", pone el segundo verbo en subjuntivo."]
              uk: ["Головне дієслово бажання, почуття, сумніву чи оцінки з ", { term: que }, " ставить друге дієслово в суб’юнктив."]
          - type: rule
            level: B1
            text:
              en: "The subjunctive needs two different subjects; with one, the infinitive follows."
              es: "El subjuntivo necesita dos sujetos distintos; con uno solo, sigue el infinitivo."
              uk: "Суб’юнктив потребує двох різних підметів; з одним далі йде інфінітив."
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми: ", { link: "Теперішній час суб’юнктива: форми", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: wishes and requests", es: "Uso: deseos y peticiones", uk: "Ужиток: бажання та прохання" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, verb: querer que, ex: ["Mis padres quieren que ", { target: estudie }, " medicina."], tr: { en: My parents want me to study medicine., uk: "Мої батьки хочуть, щоб я вивчав медицину." } }
          - { level: B1, verb: esperar que, ex: ["Espero que ", { target: tengas }, " un buen viaje."], tr: { en: I hope you have a good trip., uk: "Бажаю тобі гарної подорожі." } }
          - { level: B1, verb: preferir que, ex: ["Prefiero que ", { target: vengas }, " mañana."], tr: { en: "I'd rather you came tomorrow.", uk: "Я волів би, щоб ти прийшов завтра." } }
          - { level: B1, verb: necesitar que, ex: ["Necesito que me ", { target: ayudes }, "."], tr: { en: I need you to help me., uk: "Мені треба, щоб ти мені допоміг." } }
          - { level: B1, verb: pedir que, ex: ["Te pido que ", { target: hables }, " más despacio."], tr: { en: "I'm asking you to speak more slowly.", uk: "Прошу тебе говорити повільніше." } }
          - { level: B1, verb: ojalá, ex: ["Ojalá ", { target: haga }, " buen tiempo."], tr: { en: I hope the weather is good., uk: "Хоч би була гарна погода." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: ojalá }, " takes the subjunctive, with or without ", { term: que }, ":"]
              es: [{ term: ojalá }, " lleva subjuntivo, con ", { term: que }, " o sin él:"]
              uk: [{ term: ojalá }, " вимагає суб’юнктива — з ", { term: que }, " або без нього:"]
            ex: ["Ojalá que ", { target: ganen }, "."]
            tr: { en: I hope they win., uk: "От якби вони виграли." }

  - title: { en: "Use: feelings", es: "Uso: sentimientos", uk: "Ужиток: почуття" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, verb: me alegra que, ex: ["Me alegra que ", { target: estés }, " mejor."], tr: { en: "I'm glad you're better.", uk: "Я радий, що тобі краще." } }
          - { level: B1, verb: me molesta que, ex: ["Me molesta que ", { target: llegues }, " tarde."], tr: { en: It annoys me when you arrive late., uk: "Мене дратує, що ти спізнюєшся." } }
          - { level: B1, verb: me gusta que, ex: ["Me gusta que me ", { target: llames }, "."], tr: { en: I like it when you call me., uk: "Мені подобається, коли ти мені телефонуєш." } }
          - { level: B1, verb: me da miedo que, ex: ["Me da miedo que ", { target: se pierda }, "."], tr: { en: "I'm afraid she'll get lost.", uk: "Я боюся, що вона заблукає." } }
          - { level: B1, verb: siento que, ex: ["Siento que no ", { target: puedas }, " venir."], tr: { en: "I'm sorry you can't come.", uk: "Шкода, що ти не можеш прийти." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs like ", { term: alegrar }, " and ", { term: molestar }, " work like ", { term: gustar }, ": the clause with ", { term: que }, " is what causes the feeling."]
              es: ["Verbos como ", { term: alegrar }, " y ", { term: molestar }, " funcionan como ", { term: gustar }, ": la oración con ", { term: que }, " es lo que causa el sentimiento."]
              uk: ["Дієслова на зразок ", { term: alegrar }, " та ", { term: molestar }, " поводяться як ", { term: gustar }, ": речення з ", { term: que }, " називає те, що викликає почуття."]
          - type: note
            level: B1
            text:
              en: ["The pattern of these verbs: ", { link: Gustar and Similar Verbs, to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["La estructura de estos verbos: ", { link: Gustar y verbos similares, to: es.ser-estar-hay-gustar.gustar }, "."]
              uk: ["Будова цих дієслів: ", { link: "Gustar і подібні дієслова", to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Use: belief and doubt", es: "Uso: creencia y duda", uk: "Ужиток: переконання та сумнів" }
    role: use
    content:
      - type: comparison
        columns:
          - { key: ind, label: { en: Indicative, es: Indicativo, uk: Дійсний спосіб } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo, uk: Суб’юнктив } }
        rows:
          - { level: B1, ind: { en: what the speaker believes, es: lo que cree el hablante, uk: "те, у що мовець вірить" }, sbjv: { en: what the speaker doubts or denies, es: lo que el hablante duda o niega, uk: "те, у чому мовець сумнівається або що заперечує" } }
          - level: B1
            ind: { ex: ["Creo que ", { target: tiene }, " razón."], tr: { en: "I think he's right.", uk: "Думаю, він має рацію." } }
            sbjv: { ex: ["No creo que ", { target: tenga }, " razón."], tr: { en: "I don't think he's right.", uk: "Не думаю, що він має рацію." } }
          - level: B1
            ind: { ex: ["Pienso que ", { target: es }, " fácil."], tr: { en: "I think it's easy.", uk: "Я думаю, що це легко." } }
            sbjv: { ex: ["No pienso que ", { target: sea }, " fácil."], tr: { en: "I don't think it's easy.", uk: "Я не думаю, що це легко." } }
          - level: B1
            ind: { ex: ["Me parece que ", { target: va }, " a llover."], tr: { en: "I think it's going to rain.", uk: "Здається, буде дощ." } }
            sbjv: { ex: ["No me parece que ", { target: vaya }, " a llover."], tr: { en: "I don't think it's going to rain.", uk: "Не здається, що буде дощ." } }
          - level: B1
            ind: { ex: ["Estoy seguro de que ", { target: viene }, "."], tr: { en: "I'm sure he's coming.", uk: "Я впевнений, що він прийде." } }
            sbjv: { ex: ["Dudo que ", { target: venga }, "."], tr: { en: I doubt he's coming., uk: "Сумніваюся, що він прийде." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: creer }, ", ", { term: pensar }, " and ", { term: parecer }, " take the indicative, and the subjunctive in a negative statement."]
              es: [{ term: creer }, ", ", { term: pensar }, " y ", { term: parecer }, " llevan indicativo, y subjuntivo en una oración enunciativa negativa."]
              uk: [{ term: creer }, ", ", { term: pensar }, " та ", { term: parecer }, " вимагають дійсного способу, а в заперечному розповідному реченні — суб’юнктива."]
          - type: rule
            level: B1
            text:
              en: [{ term: quizá }, " and ", { term: tal vez }, " before the verb make a guess with the subjunctive or the indicative; the subjunctive is the more frequent:"]
              es: [{ term: quizá }, " y ", { term: tal vez }, " delante del verbo expresan una suposición con subjuntivo o con indicativo; el subjuntivo es el más frecuente:"]
              uk: [{ term: quizá }, " та ", { term: tal vez }, " перед дієсловом висловлюють припущення із суб’юнктивом або з дійсним способом; суб’юнктив — частіше:"]
            ex: { examples: [["Quizá ", { target: llueva }, " mañana."], ["Tal vez ", { target: tiene }, " razón."]] }
            tr: { en: { examples: ["Maybe it'll rain tomorrow.", "Maybe she's right."] }, uk: { examples: ["Може, завтра буде дощ.", "Може, вона має рацію."] } }
          - type: rule
            level: B1
            text:
              en: [{ term: a lo mejor }, " makes a guess with the indicative:"]
              es: [{ term: a lo mejor }, " expresa una suposición con indicativo:"]
              uk: [{ term: a lo mejor }, " висловлює припущення з дійсним способом:"]
            ex: ["A lo mejor ", { target: viene }, " mañana."]
            tr: { en: "Maybe he'll come tomorrow.", uk: "Може, він прийде завтра." }

  - title: { en: "Use: judgements", es: "Uso: valoraciones", uk: "Ужиток: оцінки" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Expression, es: Expresión, uk: Вислів } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, verb: es importante que, ex: ["Es importante que ", { target: bebas }, " agua."], tr: { en: "It's important that you drink water.", uk: "Важливо, щоб ти пив воду." } }
          - { level: B1, verb: es mejor que, ex: ["Es mejor que ", { target: salgamos }, " temprano."], tr: { en: "It's better if we leave early.", uk: "Краще, щоб ми вийшли рано." } }
          - { level: B1, verb: es necesario que, ex: ["Es necesario que ", { target: traigas }, " el pasaporte."], tr: { en: You need to bring your passport., uk: "Тобі треба взяти паспорт." } }
          - { level: B1, verb: es normal que, ex: ["Es normal que ", { target: estés }, " nervioso."], tr: { en: "It's normal for you to be nervous.", uk: "Це нормально, що ти хвилюєшся." } }
          - { level: B1, verb: es una pena que, ex: ["Es una pena que no ", { target: puedas }, " venir."], tr: { en: "It's a pity you can't come.", uk: "Шкода, що ти не можеш прийти." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A fact stated as true takes the indicative: ", { term: es verdad que }, ", ", { term: es evidente que }, ":"]
              es: ["Un hecho presentado como cierto lleva indicativo: ", { term: es verdad que }, ", ", { term: es evidente que }, ":"]
              uk: ["Факт, поданий як правда, вимагає дійсного способу: ", { term: es verdad que }, ", ", { term: es evidente que }, ":"]
            ex: ["Es verdad que ", { target: hace }, " frío."]
            tr: { en: "It's true that it's cold.", uk: "Це правда, що холодно." }

  - title: { en: One subject or two, es: Un sujeto o dos, uk: Один підмет чи два }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The same subject: the infinitive follows, with no ", { term: que }, ":"]
              es: ["El mismo sujeto: sigue el infinitivo, sin ", { term: que }, ":"]
              uk: ["Той самий підмет: далі йде інфінітив, без ", { term: que }, ":"]
            ex: ["Quiero ", { target: viajar }, "."]
            tr: { en: I want to travel., uk: "Я хочу подорожувати." }
          - type: rule
            level: B1
            text:
              en: ["Two subjects: ", { term: que }, " and the subjunctive:"]
              es: ["Dos sujetos: ", { term: que }, " y subjuntivo:"]
              uk: ["Два підмети: ", { term: que }, " і суб’юнктив:"]
            ex: ["Quiero que ", { target: viajes }, "."]
            tr: { en: I want you to travel., uk: "Я хочу, щоб ти подорожував." }
          - type: rule
            level: B1
            text:
              en: "A judgement about people in general takes the infinitive:"
              es: "Una valoración sobre la gente en general lleva infinitivo:"
              uk: "Оцінка, що стосується людей загалом, вимагає інфінітива:"
            ex: ["Es importante ", { target: dormir }, " bien."]
            tr: { en: "It's important to sleep well.", uk: "Важливо добре спати." }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: Espero que tienes un buen viaje., right: ["Espero que ", { target: tengas }, " un buen viaje."], rule: { en: [{ term: esperar que }, " takes the subjunctive"], es: [{ term: esperar que }, " lleva subjuntivo"], uk: [{ term: esperar que }, " вимагає суб’юнктива"] } }
          - { level: B1, wrong: Ojalá tienes suerte., right: ["Ojalá ", { target: tengas }, " suerte."], rule: { en: [{ term: ojalá }, " always takes the subjunctive"], es: [{ term: ojalá }, " lleva siempre subjuntivo"], uk: [{ term: ojalá }, " завжди вимагає суб’юнктива"] } }
          - { level: B1, wrong: No creo que es verdad., right: ["No creo que ", { target: sea }, " verdad."], rule: { en: [{ term: no creo que }, " takes the subjunctive"], es: [{ term: no creo que }, " lleva subjuntivo"], uk: [{ term: no creo que }, " вимагає суб’юнктива"] } }
          - { level: B1, wrong: Creo que sea verdad., right: ["Creo que ", { target: es }, " verdad."], rule: { en: [{ term: creo que }, " takes the indicative"], es: [{ term: creo que }, " lleva indicativo"], uk: [{ term: creo que }, " вимагає дійсного способу"] } }
