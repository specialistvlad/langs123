            meaning: { es: "Dar una orden con impaciencia, sin orden previa", en: "Giving an order impatiently, with no earlier order", uk: "Наказ з нетерпінням, без попереднього наказу", pt: "Dar uma ordem com impaciência, sem ordem anterior", fr: "Donner un ordre avec impatience, sans ordre préalable", de: "Einen Befehl ungeduldig geben, ohne vorherigen Befehl", it: "Dare un ordine con impazienza, senza un ordine precedente", pl: "Wydanie polecenia z niecierpliwością, bez wcześniejszego polecenia", tr: "Sabırsızlıkla emir vermek, daha önce emir verilmemişken", id: "Memberi perintah dengan tidak sabar, tanpa perintah sebelumnya", vi: "Ra lệnh một cách sốt ruột, không có mệnh lệnh nào trước đó" }
            ex: ["¡", { target: Que }, " te ", { target: calles }, " de una vez, hombre!"]
