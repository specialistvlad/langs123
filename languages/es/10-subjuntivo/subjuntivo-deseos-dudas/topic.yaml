            ex: ["Resulta que ", { target: encontramos }, " el dinero."]
            tr: { en: "It turns out that we found the money.", uk: "Виявляється, ми знайшли гроші.", pt: "Acontece que achamos o dinheiro.", fr: "Il se trouve que nous avons retrouvé l’argent.", de: "Es stellt sich heraus, dass wir das Geld gefunden haben.", it: "Risulta che abbiamo trovato i soldi.", pl: "Okazuje się, że znaleźliśmy pieniądze.", tr: "Meğer parayı bulmuşuz.", id: "Ternyata kita menemukan uang itu.", vi: "Hóa ra chúng tôi đã tìm thấy tiền." }
          - level: B2
            verb: quedar claro que
            mood: { es: Indicativo, en: "Indicative", uk: "Дійсний спосіб", pt: "Indicativo", fr: "Indicatif", de: "Indikativ", it: "Indicativo", pl: "Tryb oznajmujący", tr: "Haber kipi", id: "Indikatif", vi: "Thức chỉ định" }
            ex: ["Queda claro que ", { target: no piensas }, " hablar con él."]
            tr: { en: "It's clear that you don't intend to talk to him.", uk: "Зрозуміло, що ти не збираєшся з ним розмовляти.", pt: "Fica claro que você não pensa em falar com ele.", fr: "Il est clair que tu n’as pas l’intention de lui parler.", de: "Es ist klar, dass du nicht vorhast, mit ihm zu reden.", it: "È chiaro che non hai intenzione di parlargli.", pl: "Jest jasne, że nie zamierzasz z nim rozmawiać.", tr: "Onunla konuşmayı düşünmediğin açık.", id: "Jelas bahwa kamu tidak berniat berbicara dengannya.", vi: "Rõ ràng là bạn không định nói chuyện với anh ấy." }
          - level: B2
            verb: { pattern: [{ term: resultar }, { slot: adjective }, { term: que }] }
            mood: { es: "Subjuntivo, si el adjetivo añade una valoración", en: "Subjunctive, if the adjective adds a judgement", uk: "Суб’юнктив, якщо прикметник додає оцінку", pt: "Subjuntivo, se o adjetivo acrescenta uma avaliação", fr: "Subjonctif, si l’adjectif ajoute une appréciation", de: "Konjunktiv, wenn das Adjektiv eine Bewertung hinzufügt", it: "Congiuntivo, se l'aggettivo aggiunge una valutazione", pl: "Tryb łączący, jeśli przymiotnik dodaje ocenę", tr: "Sıfat bir değerlendirme katıyorsa dilek kipi", id: "Subjungtif, jika adjektiva menambahkan penilaian", vi: "Thức giả định, nếu tính từ thêm một đánh giá" }
            ex: ["Resulta problemático que ", { target: vayas }, "."]
            tr: { en: "It's problematic that you're going.", uk: "Проблематично, що ти підеш.", pt: "É problemático que você vá.", fr: "Il est problématique que tu y ailles.", de: "Es ist problematisch, dass du gehst.", it: "È problematico che tu vada.", pl: "To problematyczne, że idziesz.", tr: "Gitmen sorun yaratıyor.", id: "Sangat bermasalah jika kamu pergi.", vi: "Việc bạn đi là điều đáng ngại." }
          - level: B2
            verb: faltar que, bastar que
            mood: { es: "Subjuntivo, o infinitivo sin sujeto", en: "Subjunctive, or an infinitive with no subject", uk: "Суб’юнктив або інфінітив без підмета", pt: "Subjuntivo, ou infinitivo sem sujeito", fr: "Subjonctif, ou infinitif sans sujet", de: "Konjunktiv oder Infinitiv ohne Subjekt", it: "Congiuntivo, o infinito senza soggetto", pl: "Tryb łączący albo bezokolicznik bez podmiotu", tr: "Dilek kipi ya da öznesiz mastar", id: "Subjungtif, atau infinitif tanpa subjek", vi: "Thức giả định, hoặc động từ nguyên mẫu không có chủ ngữ" }
            ex: { examples: [{ equivalence: [["Falta que ", { target: terminemos }, " esto"], ["Falta ", { target: terminar }, " esto"]] }, ["Basta que lo ", { target: pidas }, "."]] }
            tr: { en: { examples: ["We still have to finish this.", "You only have to ask for it."] }, uk: { examples: ["Нам ще треба це закінчити.", "Досить тобі лише попросити."] }, pt: { examples: ["Falta a gente terminar isso.", "Basta você pedir."] }, fr: { examples: ["Il nous reste à finir ceci.", "Il suffit que tu le demandes."] }, de: { examples: ["Wir müssen das noch zu Ende bringen.", "Du musst nur darum bitten."] }, it: { examples: ["Ci resta da finire questo.", "Basta che tu lo chieda."] }, pl: { examples: ["Musimy jeszcze to skończyć.", "Wystarczy, że o to poprosisz."] }, tr: { examples: ["Bunu bitirmemiz kaldı.", "İstemen yeterli."] }, id: { examples: ["Kita masih harus menyelesaikan ini.", "Cukup kamu memintanya."] }, vi: { examples: ["Chúng ta còn phải hoàn thành việc này.", "Chỉ cần bạn yêu cầu là được."] } }
          - level: B2
            verb: constar que
            mood: { es: Indicativo, en: "Indicative", uk: "Дійсний спосіб", pt: "Indicativo", fr: "Indicatif", de: "Indikativ", it: "Indicativo", pl: "Tryb oznajmujący", tr: "Haber kipi", id: "Indikatif", vi: "Thức chỉ định" }
            ex: ["Consta que el contrato ", { target: se firmó }, " en mayo."]
            tr: { en: "It is on record that the contract was signed in May.", uk: "Відомо, що договір підписали в травні.", pt: "Consta que o contrato foi assinado em maio.", fr: "Il est établi que le contrat a été signé en mai.", de: "Es ist belegt, dass der Vertrag im Mai unterzeichnet wurde.", it: "Risulta che il contratto è stato firmato a maggio.", pl: "Wiadomo, że umowę podpisano w maju.", tr: "Sözleşmenin Mayıs’ta imzalandığı kayıtlarda yer alıyor.", id: "Tercatat bahwa kontrak itu ditandatangani pada bulan Mei.", vi: "Có ghi nhận rằng hợp đồng đã được ký vào tháng Năm." }
          - level: C1
            verb: { es: [{ term: que }, " + subjuntivo al inicio de la oración"], en: [{ term: que }, " + subjunctive at the start of the sentence"], uk: [{ term: que }, " + суб’юнктив на початку речення"], pt: [{ term: que }, " + subjuntivo no início da oração"], fr: [{ term: que }, " + subjonctif en début de phrase"], de: [{ term: que }, " + Konjunktiv am Satzanfang"], it: [{ term: que }, " + congiuntivo all'inizio della frase"], pl: [{ term: que }, " + tryb łączący na początku zdania"], tr: ["Cümle başında ", { term: que }, " + dilek kipi"], id: [{ term: que }, " + subjungtif di awal kalimat"], vi: [{ term: que }, " + thức giả định ở đầu câu"] }
            mood: { es: Subjuntivo, en: "Subjunctive", uk: "Суб’юнктив", pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" }
            ex: { examples: [["Que ", { target: dijeras }, " eso acabó con su resistencia."], ["Que te ", { target: desentiendas }, " ahora atenta contra nuestros intereses."]] }
            tr: { en: { examples: ["That you said that put an end to his resistance.", "That you wash your hands of this now goes against our interests."] }, uk: { examples: ["Те, що ти це сказав, поклало край його опору.", "Те, що ти тепер умиваєш руки, шкодить нашим інтересам."] }, pt: { examples: ["O fato de você ter dito isso acabou com a resistência dele.", "O fato de você se desligar disso agora atenta contra os nossos interesses."] }, fr: { examples: ["Que tu aies dit cela a mis fin à sa résistance.", "Que tu te désintéresses maintenant de l’affaire nuit à nos intérêts."] }, de: { examples: ["Dass du das gesagt hast, hat seinen Widerstand gebrochen.", "Dass du dich jetzt aus der Sache heraushältst, schadet unseren Interessen."] }, it: { examples: ["Che tu abbia detto questo ha messo fine alla sua resistenza.", "Che tu te ne disinteressi adesso va contro i nostri interessi."] }, pl: { examples: ["To, że to powiedziałeś, przełamało jego opór.", "To, że teraz się wycofujesz, godzi w nasze interesy."] }, tr: { examples: ["Bunu söylemen onun direncini kırdı.", "Şimdi işten elini çekmen çıkarlarımıza aykırı."] }, id: { examples: ["Fakta bahwa kamu mengatakan itu mengakhiri perlawanannya.", "Sikapmu yang lepas tangan sekarang merugikan kepentingan kita."] }, vi: { examples: ["Việc bạn nói điều đó đã chấm dứt sự phản kháng của anh ấy.", "Việc bạn bỏ mặc bây giờ đi ngược lại lợi ích của chúng ta."] } }
          - level: C1
            verb: { es: [{ term: dar pena }, ", ", { term: hacer falta }, ": verbos con un nombre incorporado"], en: [{ term: dar pena }, ", ", { term: hacer falta }, ": verbs with an incorporated noun"], uk: [{ term: dar pena }, ", ", { term: hacer falta }, ": дієслова з уписаним іменником"], pt: [{ term: dar pena }, ", ", { term: hacer falta }, ": verbos com um substantivo incorporado"], fr: [{ term: dar pena }, ", ", { term: hacer falta }, " : verbes à nom incorporé"], de: [{ term: dar pena }, ", ", { term: hacer falta }, ": Verben mit eingebettetem Nomen"], it: [{ term: dar pena }, ", ", { term: hacer falta }, ": verbi con un nome incorporato"], pl: [{ term: dar pena }, ", ", { term: hacer falta }, ": czasowniki z wbudowanym rzeczownikiem"], tr: [{ term: dar pena }, ", ", { term: hacer falta }, ": içine bir isim katılmış fiiller"], id: [{ term: dar pena }, ", ", { term: hacer falta }, ": kata kerja dengan kata benda yang menyatu"], vi: [{ term: dar pena }, ", ", { term: hacer falta }, ": động từ có danh từ gắn liền"] }
            mood: { es: Subjuntivo, en: "Subjunctive", uk: "Суб’юнктив", pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" }
            ex: { examples: [["Da pena que se ", { target: pierda }, " esa costumbre."], ["Hace falta que alguien lo ", { target: diga }, "."]] }
            tr: { en: { examples: ["It's a shame that this custom is being lost.", "Someone needs to say it."] }, uk: { examples: ["Шкода, що цей звичай зникає.", "Потрібно, щоб хтось це сказав."] }, pt: { examples: ["É uma pena que esse costume se perca.", "É preciso que alguém diga isso."] }, fr: { examples: ["C’est dommage que cette coutume se perde.", "Il faut que quelqu’un le dise."] }, de: { examples: ["Es ist schade, dass dieser Brauch verloren geht.", "Jemand muss es sagen."] }, it: { examples: ["Dispiace che si perda questa usanza.", "Bisogna che qualcuno lo dica."] }, pl: { examples: ["Szkoda, że ten zwyczaj zanika.", "Trzeba, żeby ktoś to powiedział."] }, tr: { examples: ["Bu geleneğin kaybolması üzücü.", "Birinin bunu söylemesi gerekiyor."] }, id: { examples: ["Sayang sekali kebiasaan itu hilang.", "Perlu ada yang mengatakannya."] }, vi: { examples: ["Thật tiếc khi phong tục đó mất đi.", "Cần có người nói ra điều đó."] } }
          - level: C1
            verb: [{ term: implicar }, ", ", { term: significar }, ", ", { term: demostrar }, ", ", { term: probar }]
            mood: { es: Indicativo, en: "Indicative", uk: "Дійсний спосіб", pt: "Indicativo", fr: "Indicatif", de: "Indikativ", it: "Indicativo", pl: "Tryb oznajmujący", tr: "Haber kipi", id: "Indikatif", vi: "Thức chỉ định" }
            ex: { examples: [["Que no hayas aprobado esa asignatura implica que no ", { target: podrás }, " pasar de curso."], ["Estos datos demuestran que el plan ", { target: funciona }, "."]] }
            tr: { en: { examples: ["Your not having passed that subject means you won't be able to move up a year.", "These data show that the plan works."] }, uk: { examples: ["Те, що ти не склав цей предмет, означає, що ти не перейдеш на наступний курс.", "Ці дані доводять, що план працює."] }, pt: { examples: ["O fato de você não ter passado nessa matéria implica que você não poderá passar de ano.", "Esses dados demonstram que o plano funciona."] }, fr: { examples: ["Le fait que tu n’aies pas réussi cette matière implique que tu ne pourras pas passer dans la classe supérieure.", "Ces données démontrent que le plan fonctionne."] }, de: { examples: ["Dass du dieses Fach nicht bestanden hast, bedeutet, dass du nicht versetzt wirst.", "Diese Daten zeigen, dass der Plan funktioniert."] }, it: { examples: ["Il fatto che tu non abbia superato quella materia implica che non potrai passare all'anno successivo.", "Questi dati dimostrano che il piano funziona."] }, pl: { examples: ["To, że nie zaliczyłeś tego przedmiotu, oznacza, że nie przejdziesz do następnej klasy.", "Te dane dowodzą, że plan działa."] }, tr: { examples: ["O dersi geçememiş olman, sınıf atlayamayacağın anlamına geliyor.", "Bu veriler planın işe yaradığını gösteriyor."] }, id: { examples: ["Fakta bahwa kamu tidak lulus mata pelajaran itu berarti kamu tidak bisa naik kelas.", "Data ini membuktikan bahwa rencana itu berhasil."] }, vi: { examples: ["Việc bạn không đạt môn đó có nghĩa là bạn không thể lên lớp.", "Những số liệu này chứng minh rằng kế hoạch có hiệu quả."] } }

  - title: { es: Negación y cambio de modo, en: "Negation and change of mood", uk: "Заперечення та зміна способу", pt: "Negação e mudança de modo", fr: "Négation et changement de mode", de: "Verneinung und Moduswechsel", it: "Negazione e cambio di modo", pl: "Przeczenie i zmiana trybu", tr: "Olumsuzluk ve kip değişimi", id: "Negasi dan perubahan modus", vi: "Phủ định và đổi thức" }
    role: use
    content:
      - type: comparison
        columns:
          - { key: verb, label: { es: Verbo, en: "Verb", uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ind, label: { es: Indicativo, en: "Indicative", uk: "Дійсний спосіб", pt: "Indicativo", fr: "Indicatif", de: "Indikativ", it: "Indicativo", pl: "Tryb oznajmujący", tr: "Haber kipi", id: "Indikatif", vi: "Thức chỉ định" }, features: { mood: ind } }
          - { key: sbjv, label: { es: Subjuntivo, en: "Subjunctive", uk: "Суб’юнктив", pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" }, features: { mood: sbjv } }
        rows:
          - level: C1
            verb: [{ term: ver }, ", percepción"]
            ind: { ex: ["No ve que ", { target: hay }, " un letrero. ", { gloss: { es: "El letrero existe y no lo percibe.", en: "The sign exists and he doesn't notice it.", uk: "Табличка є, але він її не помічає.", pt: "A placa existe e ele não a percebe.", fr: "Le panneau existe et il ne le perçoit pas.", de: "Das Schild existiert, und er nimmt es nicht wahr.", it: "Il cartello esiste e lui non lo nota.", pl: "Tablica jest, a on jej nie dostrzega.", tr: "Tabela var ve o bunu fark etmiyor.", id: "Papan tanda itu ada dan dia tidak menyadarinya.", vi: "Tấm biển có thật và anh ấy không nhận ra." } }], tr: { en: "He doesn't see that there is a sign.", uk: "Він не помічає, що там є табличка.", pt: "Ele não vê que há uma placa.", fr: "Il ne voit pas qu’il y a un panneau.", de: "Er sieht nicht, dass dort ein Schild ist.", it: "Non vede che c'è un cartello.", pl: "Nie widzi, że jest tam tablica.", tr: "Orada bir tabela olduğunu görmüyor.", id: "Dia tidak melihat bahwa ada papan tanda.", vi: "Anh ấy không thấy là có một tấm biển." } }
            sbjv: { ex: ["No ve que ", { target: haya }, " un letrero. ", { gloss: { es: "No se afirma que exista.", en: "It isn't claimed that it exists.", uk: "Не стверджується, що вона є.", pt: "Não se afirma que exista.", fr: "On n’affirme pas qu’il existe.", de: "Es wird nicht behauptet, dass es existiert.", it: "Non si afferma che esista.", pl: "Nie twierdzi się, że istnieje.", tr: "Var olduğu ileri sürülmüyor.", id: "Tidak dinyatakan bahwa papan itu ada.", vi: "Không khẳng định rằng nó tồn tại." } }], tr: { en: "He doesn't see that there may be a sign.", uk: "Він не бачить, що там може бути табличка.", pt: "Ele não vê que haja uma placa.", fr: "Il ne voit pas qu’il y ait un panneau.", de: "Er sieht nicht, dass es dort ein Schild geben könnte.", it: "Non vede che ci sia un cartello.", pl: "Nie widzi, żeby tam była tablica.", tr: "Orada bir tabela olabileceğini görmüyor.", id: "Dia tidak melihat bahwa mungkin ada papan tanda.", vi: "Anh ấy không thấy là có thể có một tấm biển." } }
          - level: C1
            verb: [{ term: ver }, ", opinión"]
            sbjv: { ex: ["No veo que ", { target: tengas }, " motivos. ", { gloss: { es: "Opino que no los tienes.", en: "I think you have none.", uk: "Я вважаю, що в тебе їх немає.", pt: "Penso que você não os tem.", fr: "Je pense que tu n’en as pas.", de: "Ich meine, dass du keine hast.", it: "Penso che tu non ne abbia.", pl: "Uważam, że ich nie masz.", tr: "Bence sende yok.", id: "Menurut saya kamu tidak punya.", vi: "Tôi cho rằng bạn không có." } }], tr: { en: "I don't see that you have any grounds.", uk: "Не бачу, щоб у тебе були підстави.", pt: "Não vejo que você tenha motivos.", fr: "Je ne vois pas que tu aies des raisons.", de: "Ich sehe nicht, dass du Gründe hast.", it: "Non vedo che tu abbia motivi.", pl: "Nie widzę, żebyś miał powody.", tr: "Haklı bir sebebin olduğunu görmüyorum.", id: "Saya tidak melihat bahwa kamu punya alasan.", vi: "Tôi không thấy bạn có lý do gì." } }
          - level: C1
            verb: [{ term: negar }, " en una oración negativa"]
            ind: { ex: ["No niega que ", { target: es }, " él. ", { gloss: { es: "Lo afirma.", en: "He affirms it.", uk: "Він це стверджує.", pt: "Ele afirma isso.", fr: "Il l’affirme.", de: "Er bejaht es.", it: "Lo afferma.", pl: "Potwierdza to.", tr: "Bunu doğruluyor.", id: "Dia menegaskannya.", vi: "Anh ấy khẳng định điều đó." } }], tr: { en: "He doesn't deny that it's him.", uk: "Він не заперечує, що це він.", pt: "Ele não nega que é ele.", fr: "Il ne nie pas que c’est lui.", de: "Er bestreitet nicht, dass er es ist.", it: "Non nega che sia proprio lui.", pl: "Nie zaprzecza, że to on.", tr: "O olduğunu inkâr etmiyor.", id: "Dia tidak menyangkal bahwa itu dia.", vi: "Anh ấy không phủ nhận đó là anh ấy." } }
            sbjv: { ex: ["No niega que ", { target: sea }, " él. ", { gloss: { es: "Lo admite con duda o con distancia.", en: "He admits it with doubt or reserve.", uk: "Він визнає це з сумнівом або дистанціюючись.", pt: "Ele admite isso com dúvida ou distância.", fr: "Il l’admet avec doute ou avec réserve.", de: "Er räumt es mit Zweifel oder Distanz ein.", it: "Lo ammette con dubbio o con distacco.", pl: "Przyznaje to z wątpliwością lub dystansem.", tr: "Bunu şüpheyle ya da mesafeli bir tavırla kabul ediyor.", id: "Dia mengakuinya dengan ragu atau menjaga jarak.", vi: "Anh ấy thừa nhận với sự nghi ngờ hoặc giữ khoảng cách." } }], tr: { en: "He doesn't deny that it might be him.", uk: "Він не заперечує, що це може бути він.", pt: "Ele não nega que seja ele.", fr: "Il ne nie pas que ce soit lui.", de: "Er bestreitet nicht, dass er es sein könnte.", it: "Non nega che possa essere lui.", pl: "Nie zaprzecza, że to może być on.", tr: "O olabileceğini inkâr etmiyor.", id: "Dia tidak menyangkal bahwa itu mungkin dia.", vi: "Anh ấy không phủ nhận rằng có thể đó là anh ấy." } }
          - level: C2
            verb: { term: entender }
            ind: { ex: ["Él entiende que esta ", { target: es }, " la mejor manera de solucionar el problema. ", { gloss: { es: "Lo cree.", en: "He believes it.", uk: "Він у це вірить.", pt: "Ele acredita nisso.", fr: "Il le croit.", de: "Er glaubt es.", it: "Ci crede.", pl: "Wierzy w to.", tr: "Buna inanıyor.", id: "Dia meyakininya.", vi: "Anh ấy tin như vậy." } }], tr: { en: "He thinks this is the best way to solve the problem.", uk: "Він вважає, що це найкращий спосіб розв’язати проблему.", pt: "Ele entende que esta é a melhor maneira de resolver o problema.", fr: "Il estime que c’est la meilleure façon de résoudre le problème.", de: "Er ist der Ansicht, dass dies der beste Weg ist, das Problem zu lösen.", it: "Secondo lui questo è il modo migliore per risolvere il problema.", pl: "Uważa, że to najlepszy sposób rozwiązania problemu.", tr: "Bunun sorunu çözmenin en iyi yolu olduğunu düşünüyor.", id: "Dia menganggap ini cara terbaik untuk menyelesaikan masalah.", vi: "Anh ấy cho rằng đây là cách tốt nhất để giải quyết vấn đề." } }
            sbjv: { ex: ["Él entiende que ", { target: reacciones }, " así. ", { gloss: { es: "Lo comprende y lo acepta.", en: "He understands it and accepts it.", uk: "Він це розуміє й приймає.", pt: "Ele entende e aceita isso.", fr: "Il le comprend et l’accepte.", de: "Er versteht es und akzeptiert es.", it: "Lo capisce e lo accetta.", pl: "Rozumie to i akceptuje.", tr: "Bunu anlıyor ve kabul ediyor.", id: "Dia memahami dan menerimanya.", vi: "Anh ấy hiểu và chấp nhận điều đó." } }], tr: { en: "He understands that you react like that.", uk: "Він розуміє, що ти так реагуєш.", pt: "Ele entende que você reaja assim.", fr: "Il comprend que tu réagisses ainsi.", de: "Er versteht, dass du so reagierst.", it: "Capisce che tu reagisca così.", pl: "Rozumie, że tak reagujesz.", tr: "Böyle tepki vermeni anlıyor.", id: "Dia memahami bahwa kamu bereaksi seperti itu.", vi: "Anh ấy hiểu rằng bạn phản ứng như vậy." } }
          - level: C2
            verb: [{ term: ver }, ", darse cuenta"]
            ind: { ex: ["No vio que ", { target: había }, " una farola y se estrelló. ", { gloss: { es: "No la percibió.", en: "He didn't notice it.", uk: "Він її не помітив.", pt: "Ele não a percebeu.", fr: "Il ne l’a pas remarqué.", de: "Er hat sie nicht bemerkt.", it: "Non l'ha notato.", pl: "Nie zauważył jej.", tr: "Onu fark etmedi.", id: "Dia tidak menyadarinya.", vi: "Anh ấy không nhận ra nó." } }], tr: { en: "He didn't see that there was a streetlight and crashed into it.", uk: "Він не помітив ліхтаря й врізався в нього.", pt: "Ele não viu que havia um poste e bateu nele.", fr: "Il n’a pas vu qu’il y avait un lampadaire et s’est écrasé contre lui.", de: "Er sah nicht, dass dort eine Laterne stand, und prallte dagegen.", it: "Non vide che c'era un lampione e ci sbatté contro.", pl: "Nie zauważył, że stoi tam latarnia, i uderzył w nią.", tr: "Orada bir sokak lambası olduğunu görmedi ve çarptı.", id: "Dia tidak melihat ada tiang lampu dan menabraknya.", vi: "Anh ấy không thấy có cột đèn nên đâm vào." } }
            sbjv: { ex: ["No vio que ", { target: estuvieras }, " tan agobiada. ", { gloss: { es: "No se dio cuenta.", en: "He didn't realise it.", uk: "Він цього не усвідомив.", pt: "Ele não percebeu.", fr: "Il ne s’en est pas rendu compte.", de: "Er hat es nicht bemerkt.", it: "Non se n'è accorto.", pl: "Nie zdał sobie z tego sprawy.", tr: "Fark etmedi.", id: "Dia tidak menyadarinya.", vi: "Anh ấy không nhận ra." } }], tr: { en: "He didn't see that you were so overwhelmed.", uk: "Він не бачив, що ти така змучена.", pt: "Ele não viu que você estava tão sobrecarregada.", fr: "Il n’a pas vu que tu étais si stressée.", de: "Er hat nicht gesehen, dass du so gestresst warst.", it: "Non vide che tu fossi così sopraffatta.", pl: "Nie zauważył, że jesteś tak przytłoczona.", tr: "Bu kadar bunaldığını görmedi.", id: "Dia tidak melihat bahwa kamu begitu kewalahan.", vi: "Anh ấy không thấy bạn đang quá căng thẳng." } }
          - level: C2
            verb: { term: decidir }
            ind: { ex: ["Decidió que Luis ", { target: tenía }, " razón. ", { gloss: { es: "Llegó a esa conclusión.", en: "She reached that conclusion.", uk: "Вона дійшла такого висновку.", pt: "Ela chegou a essa conclusão.", fr: "Elle est arrivée à cette conclusion.", de: "Sie kam zu diesem Schluss.", it: "Giunse a quella conclusione.", pl: "Doszła do takiego wniosku.", tr: "Bu sonuca vardı.", id: "Dia sampai pada kesimpulan itu.", vi: "Cô ấy đi đến kết luận đó." } }], tr: { en: "She decided that Luis was right.", uk: "Вона вирішила, що Луїс має рацію.", pt: "Decidiu que Luis tinha razão.", fr: "Elle a décidé que Luis avait raison.", de: "Sie entschied, dass Luis recht hatte.", it: "Decise che Luis aveva ragione.", pl: "Uznała, że Luis ma rację.", tr: "Luis’in haklı olduğuna karar verdi.", id: "Dia memutuskan bahwa Luis benar.", vi: "Cô ấy kết luận rằng Luis đúng." } }
            sbjv: { ex: ["Decidió que Luis ", { target: se quedara }, ". ", { gloss: { es: "Lo dispuso así.", en: "She arranged it that way.", uk: "Вона так розпорядилася.", pt: "Ela determinou assim.", fr: "Elle en a décidé ainsi.", de: "Sie hat es so verfügt.", it: "Dispose così.", pl: "Tak postanowiła.", tr: "Öyle düzenledi.", id: "Dia menetapkannya demikian.", vi: "Cô ấy sắp xếp như vậy." } }], tr: { en: "She decided that Luis should stay.", uk: "Вона вирішила, щоб Луїс залишився.", pt: "Decidiu que Luis ficasse.", fr: "Elle a décidé que Luis devait rester.", de: "Sie entschied, dass Luis bleiben sollte.", it: "Decise che Luis restasse.", pl: "Postanowiła, że Luis zostanie.", tr: "Luis’in kalmasına karar verdi.", id: "Dia memutuskan agar Luis tetap tinggal.", vi: "Cô ấy quyết định rằng Luis ở lại." } }
          - level: C2
            verb: { term: acordar }
            ind: { ex: ["Acordaron que el contrato ", { target: era }, " injusto. ", { gloss: { es: "Coincidieron en esa opinión.", en: "They shared that opinion.", uk: "Вони мали однакову думку.", pt: "Tiveram a mesma opinião.", fr: "Ils ont eu la même opinion.", de: "Sie waren derselben Meinung.", it: "Furono dello stesso parere.", pl: "Mieli takie samo zdanie.", tr: "Aynı görüşteydiler.", id: "Mereka berpendapat sama.", vi: "Họ có cùng ý kiến đó." } }], tr: { en: "They agreed that the contract was unfair.", uk: "Вони дійшли згоди, що договір був несправедливий.", pt: "Concordaram que o contrato era injusto.", fr: "Ils ont convenu que le contrat était injuste.", de: "Sie waren sich einig, dass der Vertrag ungerecht war.", it: "Convennero che il contratto era ingiusto.", pl: "Zgodzili się, że umowa jest niesprawiedliwa.", tr: "Sözleşmenin haksız olduğu konusunda anlaştılar.", id: "Mereka sepakat bahwa kontrak itu tidak adil.", vi: "Họ đồng ý rằng hợp đồng không công bằng." } }
            sbjv: { ex: ["Acordaron que el contrato se ", { target: revisara }, ". ", { gloss: { es: "Se pusieron de acuerdo para hacerlo.", en: "They agreed to do it.", uk: "Вони домовилися це зробити.", pt: "Eles combinaram de fazer isso.", fr: "Ils se sont mis d’accord pour le faire.", de: "Sie einigten sich darauf, es zu tun.", it: "Si misero d'accordo per farlo.", pl: "Umówili się, że to zrobią.", tr: "Bunu yapmak üzere anlaştılar.", id: "Mereka sepakat untuk melakukannya.", vi: "Họ thống nhất sẽ làm điều đó." } }], tr: { en: "They agreed that the contract should be reviewed.", uk: "Вони домовилися переглянути договір.", pt: "Combinaram que o contrato fosse revisado.", fr: "Ils ont convenu que le contrat serait révisé.", de: "Sie vereinbarten, dass der Vertrag überprüft werden sollte.", it: "Convennero che il contratto fosse rivisto.", pl: "Uzgodnili, że umowa zostanie zrewidowana.", tr: "Sözleşmenin gözden geçirilmesi konusunda anlaştılar.", id: "Mereka sepakat agar kontrak itu ditinjau ulang.", vi: "Họ thống nhất rằng hợp đồng sẽ được xem xét lại." } }
          - level: C2
            verb: { term: temerse }
            ind: { ex: ["Me temo que ", { target: llegamos }, " tarde. ", { gloss: { es: "Lo supone, con pesar.", en: "Assumes it, with regret.", uk: "Припускає це з жалем.", pt: "Supõe isso, com pesar.", fr: "Il le suppose, avec regret.", de: "Nimmt es bedauernd an.", it: "Lo suppone, con rammarico.", pl: "Przypuszcza to z żalem.", tr: "Üzülerek varsayıyor.", id: "Menduganya dengan penyesalan.", vi: "Cho là vậy, với sự tiếc nuối." } }], tr: { en: "I'm afraid we're late.", uk: "Боюся, що ми запізнюємося.", pt: "Receio que estejamos atrasados.", fr: "J’ai bien peur que nous soyons en retard.", de: "Ich fürchte, wir kommen zu spät.", it: "Temo che siamo in ritardo.", pl: "Obawiam się, że się spóźniamy.", tr: "Korkarım geç kaldık.", id: "Saya khawatir kita terlambat.", vi: "Tôi e là chúng ta đến muộn rồi." } }
            sbjv: { ex: ["Me temo que ", { target: lleguemos }, " tarde. ", { gloss: { es: "Teme que pueda ocurrir.", en: "Fears it may happen.", uk: "Боїться, що це може статися.", pt: "Teme que possa acontecer.", fr: "Il craint que cela puisse arriver.", de: "Befürchtet, dass es eintreten könnte.", it: "Teme che possa accadere.", pl: "Obawia się, że to może się zdarzyć.", tr: "Bunun olabileceğinden korkuyor.", id: "Takut hal itu bisa terjadi.", vi: "Lo sợ điều đó có thể xảy ra." } }], tr: { en: "I'm afraid we might arrive late.", uk: "Боюся, що ми можемо запізнитися.", pt: "Receio que a gente chegue tarde.", fr: "Je crains que nous n’arrivions en retard.", de: "Ich fürchte, wir könnten zu spät kommen.", it: "Temo che rischiamo di arrivare in ritardo.", pl: "Obawiam się, że możemy się spóźnić.", tr: "Korkarım geç kalabiliriz.", id: "Saya khawatir kita akan terlambat.", vi: "Tôi e là chúng ta sẽ đến muộn." } }
          - level: C2
            verb: [{ term: decir }, ", ", { term: confesar }, " en una oración negativa"]
            ind: { ex: ["Yo no te dije que ", { target: tenía }, " novia. ", { gloss: { es: "Tenía novia, pero no te lo dije.", en: "He had a girlfriend, but I didn't tell you.", uk: "Дівчина в нього була, але я тобі не казав.", pt: "Ele tinha namorada, mas eu não te contei.", fr: "Il avait une petite amie, mais je ne te l’ai pas dit.", de: "Er hatte eine Freundin, aber ich habe es dir nicht gesagt.", it: "Aveva la ragazza, ma non te l'ho detto.", pl: "Miał dziewczynę, ale ci nie powiedziałem.", tr: "Kız arkadaşı vardı ama sana söylemedim.", id: "Dia punya pacar, tetapi saya tidak memberi tahu kamu.", vi: "Anh ấy có bạn gái, nhưng tôi không nói với bạn." } }], tr: { en: "I didn't tell you he had a girlfriend.", uk: "Я не розповідав тобі, що в нього є дівчина.", pt: "Eu não te disse que ele tinha namorada.", fr: "Je ne t’ai pas dit qu’il avait une petite amie.", de: "Ich habe dir nicht gesagt, dass er eine Freundin hatte.", it: "Non ti ho detto che aveva la ragazza.", pl: "Nie powiedziałem ci, że miał dziewczynę.", tr: "Sana onun bir kız arkadaşı olduğunu söylemedim.", id: "Saya tidak memberi tahu kamu bahwa dia punya pacar.", vi: "Tôi đã không nói cho bạn biết là anh ấy có bạn gái." } }
            sbjv: { ex: ["Yo no te dije que ", { target: tuviera }, " novia. ", { gloss: { es: "No afirmo que la tuviera.", en: "I don't claim that he had one.", uk: "Я не стверджую, що вона в нього була.", pt: "Não afirmo que ele tivesse.", fr: "Je n’affirme pas qu’il en ait eu une.", de: "Ich behaupte nicht, dass er eine hatte.", it: "Non affermo che l'avesse.", pl: "Nie twierdzę, że miał.", tr: "Olduğunu iddia etmiyorum.", id: "Saya tidak menyatakan bahwa dia punya.", vi: "Tôi không khẳng định là anh ấy có." } }], tr: { en: "I never said he had a girlfriend.", uk: "Я не казав, що в нього є дівчина.", pt: "Eu não te disse que ele tivesse namorada.", fr: "Je n’ai jamais dit qu’il ait une petite amie.", de: "Ich habe nie gesagt, dass er eine Freundin hätte.", it: "Non ho mai detto che avesse la ragazza.", pl: "Nigdy nie mówiłem, że miał dziewczynę.", tr: "Onun bir kız arkadaşı olduğunu hiç iddia etmedim.", id: "Saya tidak pernah bilang bahwa dia punya pacar.", vi: "Tôi chưa từng nói là anh ấy có bạn gái." } }

  - title: { es: Infinitivo o verbo conjugado, en: "Infinitive or conjugated verb", uk: "Інфінітив або особова форма дієслова", pt: "Infinitivo ou verbo conjugado", fr: "Infinitif ou verbe conjugué", de: "Infinitiv oder konjugiertes Verb", it: "Infinito o verbo coniugato", pl: "Bezokolicznik czy czasownik w formie osobowej", tr: "Mastar mı, çekimli fiil mi", id: "Infinitif atau kata kerja terkonjugasi", vi: "Nguyên mẫu hay động từ chia" }
    role: own
    content:
      - type: comparison
        columns:
          - { key: verb, label: { es: Verbo, en: "Verb", uk: "Дієслово", pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: inf, label: { es: Infinitivo, en: "Infinitive", uk: "Інфінітив", pt: "Infinitivo", fr: "Infinitif", de: "Infinitiv", it: "Infinito", pl: "Bezokolicznik", tr: "Mastar", id: "Infinitif", vi: "Nguyên mẫu" }, features: { verbform: inf } }
          - { key: conj, label: { es: Verbo conjugado, en: "Conjugated verb", uk: "Особова форма", pt: "Verbo conjugado", fr: "Verbe conjugué", de: "Konjugiertes Verb", it: "Verbo coniugato", pl: "Forma osobowa", tr: "Çekimli fiil", id: "Kata kerja terkonjugasi", vi: "Động từ chia" } }
        rows:
          - level: C1
            verb: creer
            inf: { ex: ["Creí ", { target: morirme }, "."], tr: { en: "I thought I was going to die.", uk: "Я думав, що помру.", pt: "Achei que ia morrer.", fr: "J’ai cru mourir.", de: "Ich dachte, ich müsste sterben.", it: "Credetti di morire.", pl: "Myślałem, że umrę.", tr: "Öleceğimi sandım.", id: "Saya kira saya akan mati.", vi: "Tôi tưởng mình sắp chết." } }
            conj: { ex: ["Creí ", { target: que me moría }, "."], tr: { en: "I thought I was going to die.", uk: "Я думав, що помру.", pt: "Achei que ia morrer.", fr: "J’ai cru mourir.", de: "Ich dachte, ich müsste sterben.", it: "Credetti di morire.", pl: "Myślałem, że umrę.", tr: "Öleceğimi sandım.", id: "Saya kira saya akan mati.", vi: "Tôi tưởng mình sắp chết." } }
          - level: C1
            verb: decir
            inf: { ex: ["Dijo ", { target: vivir }, " en Zaragoza."], tr: { en: "He said he lived in Zaragoza.", uk: "Він сказав, що живе в Сарагосі.", pt: "Ele disse que morava em Saragoça.", fr: "Il a dit qu’il vivait à Saragosse.", de: "Er sagte, dass er in Saragossa wohnt.", it: "Disse che viveva a Saragozza.", pl: "Powiedział, że mieszka w Saragossie.", tr: "Zaragoza’da yaşadığını söyledi.", id: "Dia bilang dia tinggal di Zaragoza.", vi: "Anh ấy nói anh ấy sống ở Zaragoza." } }
            conj: { ex: ["Dijo ", { target: que vivía }, " en Zaragoza."], tr: { en: "He said he lived in Zaragoza.", uk: "Він сказав, що живе в Сарагосі.", pt: "Ele disse que morava em Saragoça.", fr: "Il a dit qu’il vivait à Saragosse.", de: "Er sagte, dass er in Saragossa wohnt.", it: "Disse che viveva a Saragozza.", pl: "Powiedział, że mieszka w Saragossie.", tr: "Zaragoza’da yaşadığını söyledi.", id: "Dia bilang dia tinggal di Zaragoza.", vi: "Anh ấy nói anh ấy sống ở Zaragoza." } }
          - level: C1
            verb: pedir
            inf: { ex: ["Pidió ", { target: salir }, ". ", { gloss: { es: "Él quería salir.", en: "He wanted to leave.", uk: "Він хотів вийти.", pt: "Ele queria sair.", fr: "Il voulait sortir.", de: "Er wollte gehen.", it: "Voleva uscire lui.", pl: "On sam chciał wyjść.", tr: "Kendisi çıkmak istiyordu.", id: "Dia sendiri yang ingin keluar.", vi: "Anh ấy muốn ra ngoài." } }], tr: { en: "He asked to leave.", uk: "Він попросив дозволу вийти.", pt: "Ele pediu para sair.", fr: "Il a demandé à sortir.", de: "Er bat darum, gehen zu dürfen.", it: "Chiese di uscire.", pl: "Poprosił o pozwolenie na wyjście.", tr: "Dışarı çıkmak için izin istedi.", id: "Dia minta izin keluar.", vi: "Anh ấy xin được ra ngoài." } }
            conj: { ex: ["Pidió ", { target: que saliera }, ". ", { gloss: { es: "Otra persona debía salir.", en: "Someone else had to leave.", uk: "Вийти мав хтось інший.", pt: "Outra pessoa devia sair.", fr: "Une autre personne devait sortir.", de: "Eine andere Person sollte gehen.", it: "Doveva uscire un'altra persona.", pl: "Miał wyjść ktoś inny.", tr: "Çıkması gereken başka biriydi.", id: "Orang lain yang harus keluar.", vi: "Một người khác phải ra ngoài." } }], tr: { en: "He asked them to leave.", uk: "Він попросив, щоб вони вийшли.", pt: "Ele pediu que eles saíssem.", fr: "Il a demandé qu’ils sortent.", de: "Er bat sie zu gehen.", it: "Chiese che uscissero.", pl: "Poprosił, żeby wyszli.", tr: "Onların çıkmasını istedi.", id: "Dia meminta agar mereka keluar.", vi: "Anh ấy yêu cầu họ ra ngoài." } }
          - level: C1
            verb: rogar, suplicar
            inf: { ex: ["Rogó al público ", { target: guardar }, " calma."], tr: { en: "He begged the audience to keep calm.", uk: "Він благав публіку зберігати спокій.", pt: "Ele pediu ao público que mantivesse a calma.", fr: "Il a prié le public de garder son calme.", de: "Er bat das Publikum, Ruhe zu bewahren.", it: "Pregò il pubblico di mantenere la calma.", pl: "Poprosił publiczność o zachowanie spokoju.", tr: "Seyirciden sakin olmasını rica etti.", id: "Dia memohon kepada penonton agar tetap tenang.", vi: "Anh ấy van xin khán giả giữ bình tĩnh." } }
            conj: { ex: ["Rogó al público ", { target: que guardara }, " calma."], tr: { en: "He begged the audience to keep calm.", uk: "Він благав публіку зберігати спокій.", pt: "Ele pediu ao público que mantivesse a calma.", fr: "Il a prié le public de garder son calme.", de: "Er bat das Publikum, Ruhe zu bewahren.", it: "Pregò il pubblico di mantenere la calma.", pl: "Poprosił publiczność o zachowanie spokoju.", tr: "Seyirciden sakin olmasını rica etti.", id: "Dia memohon kepada penonton agar tetap tenang.", vi: "Anh ấy van xin khán giả giữ bình tĩnh." } }
      - type: list
        items:
          - type: rule
            level: C1
            text:
              es: ["Con ", { term: creer }, " y ", { term: decir }, ", el infinitivo es propio de la lengua escrita; la lengua oral prefiere el verbo conjugado."]
              en: ["With ", { term: creer }, " and ", { term: decir }, ", the infinitive belongs to written language; speech prefers the conjugated verb."]
              uk: ["З ", { term: creer }, " і ", { term: decir }, " інфінітив притаманний писемній мові; в усній мові воліють особову форму."]
              pt: ["Com ", { term: creer }, " e ", { term: decir }, ", o infinitivo é próprio da língua escrita; a língua falada prefere o verbo conjugado."]
              fr: ["Avec ", { term: creer }, " et ", { term: decir }, ", l’infinitif est propre à la langue écrite ; la langue parlée préfère le verbe conjugué."]
              de: ["Bei ", { term: creer }, " und ", { term: decir }, " gehört der Infinitiv zur Schriftsprache; die gesprochene Sprache bevorzugt das konjugierte Verb."]
              it: ["Con ", { term: creer }, " e ", { term: decir }, ", l'infinito è proprio della lingua scritta; la lingua parlata preferisce il verbo coniugato."]
              pl: ["Przy ", { term: creer }, " i ", { term: decir }, " bezokolicznik jest typowy dla języka pisanego; język mówiony woli czasownik w formie osobowej."]
              tr: [{ term: creer }, " ve ", { term: decir }, " ile mastar yazı diline özgüdür; konuşma dili çekimli fiili tercih eder."]
              id: ["Dengan ", { term: creer }, " dan ", { term: decir }, ", infinitif khas bahasa tulis; bahasa lisan lebih suka kata kerja terkonjugasi."]
              vi: ["Với ", { term: creer }, " và ", { term: decir }, ", động từ nguyên mẫu là của văn viết; văn nói ưa dùng động từ chia."]
          - type: rule
            level: C1
            text:
              es: ["Con un complemento de persona, ", { term: rogar }, " y ", { term: suplicar }, " admiten infinitivo o verbo conjugado con el mismo significado."]
              en: ["With a person as complement, ", { term: rogar }, " and ", { term: suplicar }, " allow an infinitive or a conjugated verb with the same meaning."]
              uk: ["З додатком-особою ", { term: rogar }, " і ", { term: suplicar }, " допускають інфінітив або особову форму з тим самим значенням."]
              pt: ["Com um complemento de pessoa, ", { term: rogar }, " e ", { term: suplicar }, " admitem infinitivo ou verbo conjugado com o mesmo significado."]
              fr: ["Avec un complément de personne, ", { term: rogar }, " et ", { term: suplicar }, " admettent l’infinitif ou un verbe conjugué, avec le même sens."]
              de: ["Mit einem Personenobjekt lassen ", { term: rogar }, " und ", { term: suplicar }, " den Infinitiv oder ein konjugiertes Verb mit gleicher Bedeutung zu."]
              it: ["Con un complemento di persona, ", { term: rogar }, " e ", { term: suplicar }, " ammettono l'infinito o un verbo coniugato con lo stesso significato."]
              pl: ["Przy dopełnieniu osobowym ", { term: rogar }, " i ", { term: suplicar }, " dopuszczają bezokolicznik lub czasownik w formie osobowej o tym samym znaczeniu."]
              tr: ["Kişi tümleci varsa ", { term: rogar }, " ve ", { term: suplicar }, " mastar ya da çekimli fiil alabilir; anlam aynı kalır."]
              id: ["Dengan pelengkap orang, ", { term: rogar }, " dan ", { term: suplicar }, " boleh memakai infinitif atau kata kerja terkonjugasi dengan makna yang sama."]
              vi: ["Khi có bổ ngữ chỉ người, ", { term: rogar }, " và ", { term: suplicar }, " cho phép dùng động từ nguyên mẫu hoặc động từ chia với cùng nghĩa."]
          - type: note
            level: C1
            text:
              es: ["El infinitivo o la oración conjugada como complemento de un nombre: ", { link: "Verbos, adjetivos y nombres con preposición", to: es.preposiciones.regimen-preposicional }, "."]
              en: ["The infinitive or a conjugated clause as the complement of a noun: ", { link: "Verbs, Adjectives and Nouns with Fixed Prepositions", to: es.preposiciones.regimen-preposicional }, "."]
              uk: ["Інфінітив або підрядне речення з особовою формою як додаток іменника: ", { link: "Дієслова, прикметники та іменники з прийменником", to: es.preposiciones.regimen-preposicional }, "."]
              pt: ["O infinitivo ou a oração conjugada como complemento de um substantivo: ", { link: "Verbos, adjetivos e substantivos com preposição", to: es.preposiciones.regimen-preposicional }, "."]
              fr: ["L’infinitif ou la proposition conjuguée comme complément d’un nom : ", { link: "Verbes, adjectifs et noms suivis d’une préposition", to: es.preposiciones.regimen-preposicional }, "."]
              de: ["Der Infinitiv oder der konjugierte Satz als Ergänzung eines Nomens: ", { link: "Verben, Adjektive und Nomen mit Präposition", to: es.preposiciones.regimen-preposicional }, "."]
              it: ["L'infinito o la proposizione coniugata come complemento di un nome: ", { link: "Verbi, aggettivi e nomi con preposizione", to: es.preposiciones.regimen-preposicional }, "."]
              pl: ["Bezokolicznik lub zdanie z czasownikiem w formie osobowej jako dopełnienie rzeczownika: ", { link: "Czasowniki, przymiotniki i rzeczowniki z przyimkiem", to: es.preposiciones.regimen-preposicional }, "."]
              tr: ["Bir ismin tümleci olarak mastar ya da çekimli cümle: ", { link: "Edatlı fiiller, sıfatlar ve isimler", to: es.preposiciones.regimen-preposicional }, "."]
              id: ["Infinitif atau klausa terkonjugasi sebagai pelengkap kata benda: ", { link: "Kata kerja, adjektiva, dan kata benda dengan preposisi", to: es.preposiciones.regimen-preposicional }, "."]
              vi: ["Động từ nguyên mẫu hoặc mệnh đề chia động từ làm bổ ngữ cho danh từ: ", { link: "Động từ, tính từ và danh từ đi với giới từ", to: es.preposiciones.regimen-preposicional }, "."]

