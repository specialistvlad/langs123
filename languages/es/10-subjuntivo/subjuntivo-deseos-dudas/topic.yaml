  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A main verb of wishing, feeling, doubting or judging, with ", { term: que }, ", puts the second verb in the subjunctive."]
              es: ["Un verbo principal de deseo, sentimiento, duda o valoración, con ", { term: que }, ", pone el segundo verbo en subjuntivo."]
              uk: ["Головне дієслово бажання, почуття, сумніву чи оцінки з ", { term: que }, " ставить друге дієслово в суб’юнктив."]
              pt: ["Um verbo principal de desejo, sentimento, dúvida ou avaliação, com ", { term: que }, ", põe o segundo verbo no subjuntivo."]
              fr: ["Un verbe principal de souhait, de sentiment, de doute ou d’appréciation, avec ", { term: que }, ", met le second verbe au subjonctif."]
              de: ["Ein Hauptverb des Wünschens, Fühlens, Zweifelns oder Bewertens setzt mit ", { term: que }, " das zweite Verb in den Konjunktiv."]
              it: ["Un verbo principale di desiderio, sentimento, dubbio o valutazione, con ", { term: que }, ", mette il secondo verbo al congiuntivo."]
              pl: ["Czasownik główny oznaczający życzenie, uczucie, wątpliwość lub ocenę z ", { term: que }, " wymusza tryb łączący drugiego czasownika."]
              tr: ["İstek, duygu, şüphe ya da değerlendirme bildiren bir ana fiil, ", { term: que }, " ile ikinci fiili dilek kipine koyar."]
              id: ["Kata kerja utama yang menyatakan keinginan, perasaan, keraguan, atau penilaian, bersama ", { term: que }, ", menempatkan kata kerja kedua dalam subjungtif."]
              vi: ["Động từ chính chỉ mong muốn, cảm xúc, nghi ngờ hoặc đánh giá, đi với ", { term: que }, ", đặt động từ thứ hai ở thức giả định."]
          - type: rule
            level: B1
            text:
              en: "The subjunctive needs two different subjects; with one, the infinitive follows."
              es: "El subjuntivo necesita dos sujetos distintos; con uno solo, sigue el infinitivo."
              uk: "Суб’юнктив потребує двох різних підметів; з одним далі йде інфінітив."
              pt: "O subjuntivo exige dois sujeitos diferentes; com um só, segue o infinitivo."
              fr: "Le subjonctif demande deux sujets différents ; avec un seul, c’est l’infinitif qui suit."
              de: "Der Konjunktiv braucht zwei verschiedene Subjekte; bei einem Subjekt folgt der Infinitiv."
              it: "Il congiuntivo richiede due soggetti diversi; con uno solo segue l'infinito."
              pl: "Tryb łączący wymaga dwóch różnych podmiotów; przy jednym następuje bezokolicznik."
              tr: "Dilek kipi iki farklı özne ister; tek özne varsa mastar gelir."
              id: "Subjungtif butuh dua subjek yang berbeda; dengan satu subjek, infinitif yang dipakai."
              vi: "Thức giả định cần hai chủ ngữ khác nhau; chỉ có một chủ ngữ thì theo sau là động từ nguyên mẫu."
          - type: note
            level: B1
            text:
              en: ["The forms: ", { link: "Present Subjunctive: Forms", to: es.subjuntivo.subjuntivo-formas }, "."]
              es: ["Las formas: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              uk: ["Форми: ", { link: "Теперішній час суб’юнктива: форми", to: es.subjuntivo.subjuntivo-formas }, "."]
              pt: ["As formas: ", { link: "O presente do subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, "."]
              fr: ["Les formes : ", { link: "Le présent du subjonctif : formes", to: es.subjuntivo.subjuntivo-formas }, "."]
              de: ["Die Formen: ", { link: "Der Konjunktiv Präsens: Formen", to: es.subjuntivo.subjuntivo-formas }, "."]
              it: ["Le forme: ", { link: "Il presente del congiuntivo: forme", to: es.subjuntivo.subjuntivo-formas }, "."]
              pl: ["Formy: ", { link: "Tryb łączący czasu teraźniejszego: formy", to: es.subjuntivo.subjuntivo-formas }, "."]
              tr: ["Biçimler: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: es.subjuntivo.subjuntivo-formas }, "."]
              id: ["Bentuknya: ", { link: "Presente subjungtif: bentuk", to: es.subjuntivo.subjuntivo-formas }, "."]
              vi: ["Các dạng: ", { link: "Thì hiện tại của thức giả định: các dạng", to: es.subjuntivo.subjuntivo-formas }, "."]

  - title: { en: "Use: wishes and requests", es: "Uso: deseos y peticiones", uk: "Ужиток: бажання та прохання", pt: "Uso: desejos e pedidos", fr: "Emploi : souhaits et demandes", de: "Gebrauch: Wünsche und Bitten", it: "Uso: desideri e richieste", pl: "Użycie: życzenia i prośby", tr: "Kullanım: istekler ve ricalar", id: "Penggunaan: keinginan dan permintaan", vi: "Cách dùng: mong muốn và yêu cầu" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: querer que, ex: ["Mis padres quieren que ", { target: estudie }, " medicina."], tr: { en: My parents want me to study medicine., uk: "Мої батьки хочуть, щоб я вивчав медицину.", pt: "Meus pais querem que eu estude medicina.", fr: "Mes parents veulent que j’étudie la médecine.", de: "Meine Eltern wollen, dass ich Medizin studiere.", it: "I miei genitori vogliono che io studi medicina.", pl: "Moi rodzice chcą, żebym studiował medycynę.", tr: "Ailem tıp okumamı istiyor.", id: "Orang tua saya ingin saya belajar kedokteran.", vi: "Bố mẹ tôi muốn tôi học y." } }
          - { level: B1, verb: esperar que, ex: ["Espero que ", { target: tengas }, " un buen viaje."], tr: { en: I hope you have a good trip., uk: "Сподіваюся, у тебе буде гарна подорож.", pt: "Espero que você tenha uma boa viagem.", fr: "J’espère que tu feras un bon voyage.", de: "Ich hoffe, du hast eine gute Reise.", it: "Spero che tu faccia un buon viaggio.", pl: "Mam nadzieję, że będziesz miał udaną podróż.", tr: "Umarım yolculuğun güzel geçer.", id: "Saya harap perjalananmu menyenangkan.", vi: "Tôi mong bạn có một chuyến đi tốt đẹp." } }
          - { level: B1, verb: preferir que, ex: ["Prefiero que ", { target: vengas }, " mañana."], tr: { en: "I'd rather you came tomorrow.", uk: "Я волів би, щоб ти прийшов завтра.", pt: "Prefiro que você venha amanhã.", fr: "Je préfère que tu viennes demain.", de: "Ich möchte lieber, dass du morgen kommst.", it: "Preferisco che tu venga domani.", pl: "Wolałbym, żebyś przyszedł jutro.", tr: "Yarın gelmeni tercih ederim.", id: "Saya lebih suka kamu datang besok.", vi: "Tôi muốn bạn đến vào ngày mai hơn." } }
          - { level: B1, verb: necesitar que, ex: ["Necesito que me ", { target: ayudes }, "."], tr: { en: I need you to help me., uk: "Мені треба, щоб ти мені допоміг.", pt: "Preciso que você me ajude.", fr: "J’ai besoin que tu m’aides.", de: "Ich brauche deine Hilfe.", it: "Ho bisogno che tu mi aiuti.", pl: "Potrzebuję, żebyś mi pomógł.", tr: "Bana yardım etmene ihtiyacım var.", id: "Saya butuh kamu membantu saya.", vi: "Tôi cần bạn giúp tôi." } }
          - { level: B1, verb: pedir que, ex: ["Te pido que ", { target: hables }, " más despacio."], tr: { en: "I'm asking you to speak more slowly.", uk: "Прошу тебе говорити повільніше.", pt: "Peço que você fale mais devagar.", fr: "Je te demande de parler plus lentement.", de: "Ich bitte dich, langsamer zu sprechen.", it: "Ti chiedo di parlare più lentamente.", pl: "Proszę cię, żebyś mówił wolniej.", tr: "Senden daha yavaş konuşmanı rica ediyorum.", id: "Saya minta kamu berbicara lebih pelan.", vi: "Tôi xin bạn nói chậm hơn." } }
          - { level: B1, verb: ojalá, ex: ["Ojalá ", { target: haga }, " buen tiempo."], tr: { en: I hope the weather is good., uk: "Хоч би була гарна погода.", pt: "Tomara que faça bom tempo.", fr: "Pourvu qu’il fasse beau.", de: "Hoffentlich ist das Wetter schön.", it: "Speriamo che faccia bel tempo.", pl: "Oby była dobra pogoda.", tr: "Umarım hava güzel olur.", id: "Semoga cuacanya bagus.", vi: "Mong là thời tiết đẹp." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: ojalá }, " takes the subjunctive, with or without ", { term: que }, ":"]
              es: [{ term: ojalá }, " lleva subjuntivo, con ", { term: que }, " o sin él:"]
              uk: [{ term: ojalá }, " вимагає суб’юнктива — з ", { term: que }, " або без нього:"]
              pt: [{ term: ojalá }, " pede subjuntivo, com ", { term: que }, " ou sem ele:"]
              fr: [{ term: ojalá }, " prend le subjonctif, avec ", { term: que }, " ou sans lui :"]
              de: [{ term: ojalá }, " steht mit dem Konjunktiv, mit oder ohne ", { term: que }, ":"]
              it: [{ term: ojalá }, " vuole il congiuntivo, con ", { term: que }, " o senza:"]
              pl: [{ term: ojalá }, " wymaga trybu łączącego, z ", { term: que }, " lub bez:"]
              tr: [{ term: ojalá }, " her zaman dilek kipi ister; arkasından ", { term: que }, " gelebilir ya da gelmeyebilir:"]
              id: [{ term: ojalá }, " memakai subjungtif, dengan atau tanpa ", { term: que }, ":"]
              vi: [{ term: ojalá }, " đi với thức giả định, có hoặc không có ", { term: que }, ":"]
            ex: ["Ojalá que ", { target: ganen }, "."]
            tr: { en: I hope they win., uk: "От якби вони виграли.", pt: "Tomara que eles ganhem.", fr: "Pourvu qu’ils gagnent.", de: "Hoffentlich gewinnen sie.", it: "Speriamo che vincano.", pl: "Oby wygrali.", tr: "Umarım kazanırlar.", id: "Semoga mereka menang.", vi: "Mong là họ thắng." }

  - title: { en: "Use: feelings", es: "Uso: sentimientos", uk: "Ужиток: почуття", pt: "Uso: sentimentos", fr: "Emploi : sentiments", de: "Gebrauch: Gefühle", it: "Uso: sentimenti", pl: "Użycie: uczucia", tr: "Kullanım: duygular", id: "Penggunaan: perasaan", vi: "Cách dùng: cảm xúc" }
    role: use
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: me alegra que, ex: ["Me alegra que ", { target: estés }, " mejor."], tr: { en: "I'm glad you're better.", uk: "Я радий, що тобі краще.", pt: "Fico feliz que você esteja melhor.", fr: "Je suis content que tu ailles mieux.", de: "Ich freue mich, dass es dir besser geht.", it: "Sono contento che tu stia meglio.", pl: "Cieszę się, że czujesz się lepiej.", tr: "Daha iyi olmana sevindim.", id: "Saya senang kamu sudah lebih baik.", vi: "Tôi vui vì bạn khỏe hơn rồi." } }
          - { level: B1, verb: me molesta que, ex: ["Me molesta que ", { target: llegues }, " tarde."], tr: { en: It annoys me when you arrive late., uk: "Мене дратує, що ти спізнюєшся.", pt: "Me incomoda que você chegue tarde.", fr: "Ça m’agace que tu arrives en retard.", de: "Es ärgert mich, dass du zu spät kommst.", it: "Mi dà fastidio che tu arrivi tardi.", pl: "Irytuje mnie, że przychodzisz późno.", tr: "Geç gelmen beni rahatsız ediyor.", id: "Saya terganggu kalau kamu datang terlambat.", vi: "Tôi khó chịu khi bạn đến muộn." } }
          - { level: B1, verb: me gusta que, ex: ["Me gusta que me ", { target: llames }, "."], tr: { en: I like it when you call me., uk: "Мені подобається, коли ти мені телефонуєш.", pt: "Gosto que você me ligue.", fr: "J’aime que tu m’appelles.", de: "Ich mag es, wenn du mich anrufst.", it: "Mi piace che tu mi chiami.", pl: "Lubię, kiedy do mnie dzwonisz.", tr: "Beni aramanı seviyorum.", id: "Saya suka kalau kamu meneleponku.", vi: "Tôi thích khi bạn gọi cho tôi." } }
          - { level: B1, verb: me da miedo que, ex: ["Me da miedo que ", { target: se pierda }, "."], tr: { en: "I'm afraid she'll get lost.", uk: "Я боюся, що вона заблукає.", pt: "Tenho medo que ela se perca.", fr: "J’ai peur qu’elle se perde.", de: "Ich habe Angst, dass sie sich verirrt.", it: "Ho paura che si perda.", pl: "Boję się, że ona się zgubi.", tr: "Kaybolmasından korkuyorum.", id: "Saya takut dia tersesat.", vi: "Tôi sợ cô ấy bị lạc." } }
          - { level: B1, verb: siento que, ex: ["Siento que no ", { target: puedas }, " venir."], tr: { en: "I'm sorry you can't come.", uk: "Шкода, що ти не можеш прийти.", pt: "Sinto muito que você não possa vir.", fr: "Je suis désolé que tu ne puisses pas venir.", de: "Es tut mir leid, dass du nicht kommen kannst.", it: "Mi dispiace che tu non possa venire.", pl: "Przykro mi, że nie możesz przyjść.", tr: "Gelemeyeceğin için üzgünüm.", id: "Saya menyesal kamu tidak bisa datang.", vi: "Tôi tiếc là bạn không thể đến." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs like ", { term: alegrar }, " and ", { term: molestar }, " work like ", { term: gustar }, ": the clause with ", { term: que }, " is what causes the feeling."]
              es: ["Verbos como ", { term: alegrar }, " y ", { term: molestar }, " funcionan como ", { term: gustar }, ": la oración con ", { term: que }, " es lo que causa el sentimiento."]
              uk: ["Дієслова на зразок ", { term: alegrar }, " та ", { term: molestar }, " поводяться як ", { term: gustar }, ": речення з ", { term: que }, " позначає те, що викликає почуття."]
              pt: ["Verbos como ", { term: alegrar }, " e ", { term: molestar }, " funcionam como ", { term: gustar }, ": a oração com ", { term: que }, " é o que causa o sentimento."]
              fr: ["Les verbes comme ", { term: alegrar }, " et ", { term: molestar }, " fonctionnent comme ", { term: gustar }, " : la proposition avec ", { term: que }, " est ce qui cause le sentiment."]
              de: ["Verben wie ", { term: alegrar }, " und ", { term: molestar }, " funktionieren wie ", { term: gustar }, ": Der Satz mit ", { term: que }, " löst das Gefühl aus."]
              it: ["Verbi come ", { term: alegrar }, " e ", { term: molestar }, " funzionano come ", { term: gustar }, ": la proposizione con ", { term: que }, " è ciò che causa il sentimento."]
              pl: ["Czasowniki takie jak ", { term: alegrar }, " i ", { term: molestar }, " działają jak ", { term: gustar }, ": zdanie z ", { term: que }, " jest przyczyną uczucia."]
              tr: [{ term: alegrar }, " ve ", { term: molestar }, " gibi fiiller ", { term: gustar }, " gibi çalışır: ", { term: que }, " ile başlayan cümle duyguya neden olan şeydir."]
              id: ["Kata kerja seperti ", { term: alegrar }, " dan ", { term: molestar }, " bekerja seperti ", { term: gustar }, ": klausa dengan ", { term: que }, " adalah penyebab perasaan itu."]
              vi: ["Các động từ như ", { term: alegrar }, " và ", { term: molestar }, " hoạt động giống ", { term: gustar }, ": mệnh đề với ", { term: que }, " là điều gây ra cảm xúc."]
          - type: note
            level: B1
            text:
              en: ["The pattern of these verbs: ", { link: Gustar and Similar Verbs, to: es.ser-estar-hay-gustar.gustar }, "."]
              es: ["La estructura de estos verbos: ", { link: Gustar y verbos similares, to: es.ser-estar-hay-gustar.gustar }, "."]
              uk: ["Будова цих дієслів: ", { link: "Gustar і подібні дієслова", to: es.ser-estar-hay-gustar.gustar }, "."]
              pt: ["A estrutura desses verbos: ", { link: "Gustar e verbos parecidos", to: es.ser-estar-hay-gustar.gustar }, "."]
              fr: ["La construction de ces verbes : ", { link: "Gustar et les verbes semblables", to: es.ser-estar-hay-gustar.gustar }, "."]
              de: ["Das Muster dieser Verben: ", { link: "Gustar und ähnliche Verben", to: es.ser-estar-hay-gustar.gustar }, "."]
              it: ["La struttura di questi verbi: ", { link: "Gustar e i verbi simili", to: es.ser-estar-hay-gustar.gustar }, "."]
              pl: ["Konstrukcja tych czasowników: ", { link: "Gustar i podobne czasowniki", to: es.ser-estar-hay-gustar.gustar }, "."]
              tr: ["Bu fiillerin yapısı: ", { link: "Gustar ve benzer fiiller", to: es.ser-estar-hay-gustar.gustar }, "."]
              id: ["Pola kata kerja ini: ", { link: "Gustar dan kata kerja serupa", to: es.ser-estar-hay-gustar.gustar }, "."]
              vi: ["Cấu trúc của các động từ này: ", { link: "Gustar và các động từ tương tự", to: es.ser-estar-hay-gustar.gustar }, "."]

  - title: { en: "Use: belief and doubt", es: "Uso: creencia y duda", uk: "Ужиток: переконання та сумнів", pt: "Uso: crença e dúvida", fr: "Emploi : croyance et doute", de: "Gebrauch: Überzeugung und Zweifel", it: "Uso: convinzione e dubbio", pl: "Użycie: przekonanie i wątpliwość", tr: "Kullanım: inanç ve şüphe", id: "Penggunaan: keyakinan dan keraguan", vi: "Cách dùng: niềm tin và nghi ngờ" }
    role: use
    content:
      - type: comparison
        columns:
          - { key: ind, label: { en: Indicative, es: Indicativo, uk: Дійсний спосіб, pt: "Indicativo", fr: "Indicatif", de: "Indikativ", it: "Indicativo", pl: "Tryb oznajmujący", tr: "Haber kipi", id: "Indikatif", vi: "Thức chỉ định" } }
          - { key: sbjv, label: { en: Subjunctive, es: Subjuntivo, uk: Суб’юнктив, pt: "Subjuntivo", fr: "Subjonctif", de: "Konjunktiv", it: "Congiuntivo", pl: "Tryb łączący", tr: "Dilek kipi", id: "Subjungtif", vi: "Thức giả định" } }
        rows:
          - { level: B1, ind: { en: what the speaker believes, es: lo que cree el hablante, uk: "те, у що мовець вірить", pt: "o que o falante acredita", fr: "ce que le locuteur croit", de: "was die sprechende Person glaubt", it: "ciò che chi parla crede", pl: "w co mówiący wierzy", tr: "konuşanın inandığı şey", id: "apa yang diyakini pembicara", vi: "điều người nói tin" }, sbjv: { en: what the speaker doubts or denies, es: lo que el hablante duda o niega, uk: "те, у чому мовець сумнівається або що заперечує", pt: "o que o falante duvida ou nega", fr: "ce que le locuteur doute ou nie", de: "was die sprechende Person bezweifelt oder verneint", it: "ciò di cui chi parla dubita o che nega", pl: "w co mówiący wątpi lub czemu przeczy", tr: "konuşanın şüphe ettiği ya da reddettiği şey", id: "apa yang diragukan atau disangkal pembicara", vi: "điều người nói nghi ngờ hoặc phủ nhận" } }
          - level: B1
            ind: { ex: ["Creo que ", { target: tiene }, " razón."], tr: { en: "I think he's right.", uk: "Думаю, він має рацію.", pt: "Acho que ele tem razão.", fr: "Je crois qu’il a raison.", de: "Ich glaube, dass er recht hat.", it: "Secondo me ha ragione.", pl: "Uważam, że ma rację.", tr: "Bence haklı.", id: "Saya kira dia benar.", vi: "Tôi nghĩ anh ấy đúng." } }
