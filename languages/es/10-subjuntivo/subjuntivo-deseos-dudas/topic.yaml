title: { en: "Subjunctive for Wishes, Doubt and Opinions", es: "El subjuntivo: deseos, dudas y opiniones", uk: "Суб’юнктив: бажання, сумніви й думки", pt: "O subjuntivo: desejos, dúvidas e opiniões", fr: "Le subjonctif : souhaits, doutes et opinions", de: "Der Konjunktiv: Wünsche, Zweifel und Meinungen", it: "Il congiuntivo: desideri, dubbi e opinioni", pl: "Tryb łączący: życzenia, wątpliwości i opinie", tr: "Dilek kipi: istekler, şüpheler ve görüşler", id: "Subjungtif: keinginan, keraguan, dan pendapat", vi: "Thức giả định: mong muốn, nghi ngờ và ý kiến" }
summary:
  lead:
    en: ["After verbs of wishing, feeling and doubting, and after ", { term: ojalá }, ", a second subject takes the subjunctive: ", { term: quiero que vengas }, "."]
    es: ["Detrás de verbos de deseo, sentimiento y duda, y detrás de ", { term: ojalá }, ", un segundo sujeto lleva subjuntivo: ", { term: quiero que vengas }, "."]
    uk: ["Після дієслів бажання, почуття й сумніву, а також після ", { term: ojalá }, ", другий підмет вимагає суб’юнктива: ", { term: quiero que vengas }, "."]
    pt: ["Depois de verbos de desejo, sentimento e dúvida, e depois de ", { term: ojalá }, ", um segundo sujeito pede subjuntivo: ", { term: quiero que vengas }, "."]
    fr: ["Après les verbes de souhait, de sentiment et de doute, et après ", { term: ojalá }, ", un second sujet prend le subjonctif : ", { term: quiero que vengas }, "."]
    de: ["Nach Verben des Wünschens, Fühlens und Zweifelns sowie nach ", { term: ojalá }, " steht ein zweites Subjekt im Konjunktiv: ", { term: quiero que vengas }, "."]
    it: ["Dopo i verbi di desiderio, sentimento e dubbio, e dopo ", { term: ojalá }, ", un secondo soggetto vuole il congiuntivo: ", { term: quiero que vengas }, "."]
    pl: ["Po czasownikach życzenia, uczucia i wątpliwości oraz po ", { term: ojalá }, " drugi podmiot wymaga trybu łączącego: ", { term: quiero que vengas }, "."]
    tr: ["İstek, duygu ve şüphe bildiren fiillerden ve ", { term: ojalá }, " sözcüğünden sonra ikinci özne dilek kipinde olur: ", { term: quiero que vengas }, "."]
    id: ["Setelah kata kerja keinginan, perasaan, dan keraguan, juga setelah ", { term: ojalá }, ", subjek kedua memakai subjungtif: ", { term: quiero que vengas }, "."]
    vi: ["Sau động từ mong muốn, cảm xúc, nghi ngờ và sau ", { term: ojalá }, ", chủ ngữ thứ hai dùng thức giả định: ", { term: quiero que vengas }, "."]
  rule:
    en: ["With one subject, the second verb stays an infinitive; with two, it takes ", { term: que }, " and the subjunctive:"]
    es: ["Con un solo sujeto, el segundo verbo va en infinitivo; con dos, lleva ", { term: que }, " y subjuntivo:"]
    uk: ["З одним підметом друге дієслово лишається в інфінітиві; з двома — з’являються ", { term: que }, " і суб’юнктив:"]
    pt: ["Com um só sujeito, o segundo verbo fica no infinitivo; com dois, leva ", { term: que }, " e subjuntivo:"]
    fr: ["Avec un seul sujet, le second verbe reste à l’infinitif ; avec deux, il prend ", { term: que }, " et le subjonctif :"]
    de: ["Bei einem Subjekt bleibt das zweite Verb im Infinitiv; bei zwei Subjekten steht ", { term: que }, " mit dem Konjunktiv:"]
    it: ["Con un solo soggetto, il secondo verbo resta all'infinito; con due, richiede ", { term: que }, " e il congiuntivo:"]
    pl: ["Przy jednym podmiocie drugi czasownik zostaje w bezokoliczniku; przy dwóch wymaga ", { term: que }, " i trybu łączącego:"]
    tr: ["Tek özne varsa ikinci fiil mastar kalır; iki özne varsa ", { term: que }, " ve dilek kipi gelir:"]
    id: ["Dengan satu subjek, kata kerja kedua tetap infinitif; dengan dua subjek, dipakai ", { term: que }, " dan subjungtif:"]
    vi: ["Một chủ ngữ thì động từ thứ hai ở nguyên mẫu; hai chủ ngữ thì dùng ", { term: que }, " và thức giả định:"]
  ex: { examples: [["Quiero ", { target: ir }, "."], ["Quiero que ", { target: vayas }, "."]] }

