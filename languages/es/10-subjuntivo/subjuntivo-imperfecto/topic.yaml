            ex: { examples: [["Me alegró que ", { target: llamaras }, "."], ["Me molestó que ", { target: llegaran }, " tarde."]] }
            tr: { en: { examples: ["I was glad you called.", "It annoyed me that they arrived late."] }, uk: { examples: ["Я зрадів, що ти зателефонував.", "Мене роздратувало, що вони запізнилися."] }, pt: { examples: ["Fiquei feliz por você ter ligado.", "Me incomodou que eles chegassem tarde."] }, fr: { examples: ["Ça m’a fait plaisir que tu appelles.", "Ça m’a agacé qu’ils arrivent en retard."] }, de: { examples: ["Ich habe mich gefreut, dass du angerufen hast.", "Es hat mich geärgert, dass sie zu spät kamen."] }, it: { examples: ["Mi ha fatto piacere che tu abbia chiamato.", "Mi ha dato fastidio che siano arrivati tardi."] }, pl: { examples: ["Ucieszyłem się, że zadzwoniłeś.", "Zirytowało mnie, że przyszli późno."] }, tr: { examples: ["Aradığına sevindim.", "Geç gelmeleri beni rahatsız etti."] }, id: { examples: ["Saya senang kamu menelepon.", "Saya kesal mereka datang terlambat."] }, vi: { examples: ["Tôi vui vì bạn đã gọi.", "Tôi khó chịu vì họ đến muộn."] } }
          - level: B2
