            ex: { examples: [["Me pidió que ", { target: llamara }, " antes."], ["Exigió que le ", { target: devolvieran }, " el dinero."]] }
            tr: { en: { examples: ["He asked me to call beforehand.", "He demanded that they give him his money back."] }, uk: { examples: ["Він попросив мене зателефонувати заздалегідь.", "Він зажадав, щоб йому повернули гроші."] }, pt: { examples: ["Ele me pediu que ligasse antes.", "Ele exigiu que lhe devolvessem o dinheiro."] }, fr: { examples: ["Il m’a demandé d’appeler avant.", "Il a exigé qu’on lui rende son argent."] }, de: { examples: ["Er bat mich, vorher anzurufen.", "Er verlangte, dass man ihm das Geld zurückgibt."] }, it: { examples: ["Mi ha chiesto di chiamare prima.", "Ha preteso che gli restituissero i soldi."] }, pl: { examples: ["Poprosił mnie, żebym zadzwonił wcześniej.", "Zażądał, żeby zwrócono mu pieniądze."] }, tr: { examples: ["Önceden aramamı istedi.", "Parasının geri verilmesini talep etti."] }, id: { examples: ["Dia meminta saya menelepon lebih dulu.", "Dia menuntut agar uangnya dikembalikan."] }, vi: { examples: ["Anh ấy bảo tôi gọi điện trước.", "Anh ấy đòi họ trả lại tiền cho mình."] } }
          - level: B2
