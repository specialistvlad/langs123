            tr: { en: { examples: ["He waited until you arrived.", "He left before dawn broke."] }, uk: { examples: ["Він чекав, поки ти прийдеш.", "Він пішов, перш ніж розвиднілося."] }, pt: { examples: ["Ele esperou até que você chegasse.", "Ele foi embora antes que amanhecesse."] }, fr: { examples: ["Il a attendu que tu arrives.", "Il est parti avant que le jour se lève."] }, de: { examples: ["Er wartete, bis du kamst.", "Er ging, bevor es dämmerte."] }, it: { examples: ["Ha aspettato finché non sei arrivato.", "È andato via prima che facesse giorno."] }, pl: { examples: ["Czekał, aż przyjdziesz.", "Wyszedł, zanim zaświtało."] }, tr: { examples: ["Sen gelene kadar bekledi.", "Gün ağarmadan gitti."] }, id: { examples: ["Dia menunggu sampai kamu tiba.", "Dia pergi sebelum fajar menyingsing."] }, vi: { examples: ["Anh ấy đợi đến khi bạn tới.", "Anh ấy đi trước khi trời sáng."] } }
          - level: C1
