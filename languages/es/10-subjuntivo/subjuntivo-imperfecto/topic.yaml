            ex: { examples: [["Dudaba que ", { target: fuera }, " verdad."], ["No creía que ", { target: pudiéramos }, " terminar."]] }
            tr: { en: { examples: ["I doubted it was true.", "I didn't think we could finish."] }, uk: { examples: ["Я сумнівався, що це правда.", "Я не вірив, що ми зможемо закінчити."] }, pt: { examples: ["Eu duvidava que fosse verdade.", "Eu não achava que a gente pudesse terminar."] }, fr: { examples: ["Je doutais que ce soit vrai.", "Je ne croyais pas que nous puissions finir."] }, de: { examples: ["Ich bezweifelte, dass es wahr war.", "Ich glaubte nicht, dass wir fertig werden könnten."] }, it: { examples: ["Dubitavo che fosse vero.", "Non credevo che potessimo finire."] }, pl: { examples: ["Wątpiłem, że to prawda.", "Nie sądziłem, że uda nam się skończyć."] }, tr: { examples: ["Doğru olduğundan şüpheliydim.", "Bitirebileceğimize inanmıyordum."] }, id: { examples: ["Saya meragukan hal itu benar.", "Saya tidak mengira kami bisa menyelesaikannya."] }, vi: { examples: ["Tôi nghi ngờ điều đó là thật.", "Tôi không nghĩ chúng tôi có thể hoàn thành."] } }
          - level: B2
