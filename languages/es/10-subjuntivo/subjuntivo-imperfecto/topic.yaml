            ex: { examples: [["Busqué a alguien que ", { target: supiera }, " ruso."], ["Quería una casa que ", { target: tuviera }, " jardín."]] }
            tr: { en: { examples: ["I looked for someone who knew Russian.", "I wanted a house that had a garden."] }, uk: { examples: ["Я шукав когось, хто знав би російську.", "Я хотів будинок із садом."] }, pt: { examples: ["Procurei alguém que soubesse russo.", "Eu queria uma casa que tivesse jardim."] }, fr: { examples: ["J’ai cherché quelqu’un qui sache le russe.", "Je voulais une maison qui ait un jardin."] }, de: { examples: ["Ich suchte jemanden, der Russisch kann.", "Ich wollte ein Haus, das einen Garten hat."] }, it: { examples: ["Cercavo qualcuno che sapesse il russo.", "Volevo una casa che avesse il giardino."] }, pl: { examples: ["Szukałem kogoś, kto zna rosyjski.", "Chciałem domu z ogrodem."] }, tr: { examples: ["Rusça bilen birini aradım.", "Bahçesi olan bir ev istiyordum."] }, id: { examples: ["Saya mencari seseorang yang bisa berbahasa Rusia.", "Saya ingin rumah yang punya taman."] }, vi: { examples: ["Tôi đã tìm một người biết tiếng Nga.", "Tôi muốn một ngôi nhà có vườn."] } }
          - level: C1
