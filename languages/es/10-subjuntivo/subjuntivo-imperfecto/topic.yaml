  - title: { es: "Uso: en la subordinada", en: "Use: in the subordinate clause", uk: "Вживання: у підрядному реченні", pt: "Uso: na oração subordinada", fr: "Emploi : dans la subordonnée", de: "Gebrauch: im Nebensatz", it: "Uso: nella proposizione subordinata", pl: "Użycie: w zdaniu podrzędnym", tr: "Kullanım: yan cümlede", id: "Penggunaan: dalam anak kalimat", vi: "Cách dùng: trong mệnh đề phụ" }
