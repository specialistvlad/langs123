title: { es: "El imperfecto de subjuntivo: hablara, hablase", en: "Imperfect Subjunctive: hablara, hablase", uk: "Імперфект суб’юнктива: hablara, hablase", pt: "O imperfeito do subjuntivo: hablara, hablase", fr: "L’imparfait du subjonctif : hablara, hablase", de: "Der Konjunktiv Imperfecto: hablara, hablase", it: "L'imperfetto del congiuntivo: hablara, hablase", pl: "Imperfecto trybu łączącego: hablara, hablase", tr: "Dilek kipinin imperfecto biçimi: hablara, hablase", id: "Imperfecto subjungtif: hablara, hablase", vi: "Imperfecto của thức giả định: hablara, hablase" }
summary:
  lead:
    es: ["El imperfecto de subjuntivo, ", { term: hablara }, " o ", { term: hablase }, ", expresa deseos irreales, posibilidades remotas y lo que depende de un verbo en pasado."]
    en: ["The imperfect subjunctive, ", { term: hablara }, " or ", { term: hablase }, ", expresses unreal wishes, remote possibilities and whatever depends on a past-tense verb."]
    uk: ["Імперфект суб’юнктива, ", { term: hablara }, " або ", { term: hablase }, ", виражає нереальні бажання, віддалені можливості й те, що залежить від дієслова в минулому."]
    pt: ["O imperfeito do subjuntivo, ", { term: hablara }, " ou ", { term: hablase }, ", expressa desejos irreais, possibilidades remotas e o que depende de um verbo no passado."]
    fr: ["L’imparfait du subjonctif, ", { term: hablara }, " ou ", { term: hablase }, ", exprime des souhaits irréels, des possibilités lointaines et ce qui dépend d’un verbe au passé."]
    de: ["Der Konjunktiv Imperfecto, ", { term: hablara }, " oder ", { term: hablase }, ", drückt irreale Wünsche, entfernte Möglichkeiten und das aus, was von einem Verb in der Vergangenheit abhängt."]
    it: ["L'imperfetto del congiuntivo, ", { term: hablara }, " o ", { term: hablase }, ", esprime desideri irreali, possibilità remote e ciò che dipende da un verbo al passato."]
    pl: ["Imperfecto trybu łączącego, ", { term: hablara }, " lub ", { term: hablase }, ", wyraża nierealne życzenia, odległe możliwości i to, co zależy od czasownika w czasie przeszłym."]
    tr: ["Dilek kipinin imperfecto biçimi, ", { term: hablara }, " ya da ", { term: hablase }, ", gerçekdışı dilekleri, uzak olasılıkları ve geçmiş zamanlı bir fiile bağlı olanı anlatır."]
    id: ["Imperfecto subjungtif, ", { term: hablara }, " atau ", { term: hablase }, ", menyatakan keinginan yang tidak nyata, kemungkinan yang jauh, dan hal yang bergantung pada kata kerja lampau."]
    vi: ["Imperfecto của thức giả định, ", { term: hablara }, " hoặc ", { term: hablase }, ", diễn tả mong muốn không có thật, khả năng xa vời và điều phụ thuộc vào một động từ ở quá khứ."]
  rule:
    es: ["La raíz es el indefinido de ", { term: ellos }, " sin ", { term: "-ron" }, ", más ", { term: "-ra" }, " o ", { term: "-se" }, ":"]
    en: ["The stem is the ", { term: ellos }, " form of the preterite without ", { term: "-ron" }, ", plus ", { term: "-ra" }, " or ", { term: "-se" }, ":"]
    uk: ["Основа — це форма ", { term: ellos }, " претерита без ", { term: "-ron" }, ", плюс ", { term: "-ra" }, " або ", { term: "-se" }, ":"]
    pt: ["O radical é a forma de ", { term: ellos }, " do pretérito perfeito simples sem ", { term: "-ron" }, ", mais ", { term: "-ra" }, " ou ", { term: "-se" }, ":"]
    fr: ["Le radical est la forme ", { term: ellos }, " du prétérit sans ", { term: "-ron" }, ", plus ", { term: "-ra" }, " ou ", { term: "-se" }, " :"]
    de: ["Der Stamm ist die ", { term: ellos }, "-Form des Indefinido ohne ", { term: "-ron" }, ", plus ", { term: "-ra" }, " oder ", { term: "-se" }, ":"]
    it: ["La radice è la forma ", { term: ellos }, " dell'indefinido senza ", { term: "-ron" }, ", più ", { term: "-ra" }, " o ", { term: "-se" }, ":"]
    pl: ["Rdzeń to forma ", { term: ellos }, " w indefinido bez ", { term: "-ron" }, ", plus ", { term: "-ra" }, " lub ", { term: "-se" }, ":"]
    tr: ["Kök, ", { term: ellos }, " için indefinido biçiminden ", { term: "-ron" }, " ekini atınca kalandır; ona ", { term: "-ra" }, " ya da ", { term: "-se" }, " eklenir:"]
    id: ["Akar kata adalah indefinido bentuk ", { term: ellos }, " tanpa ", { term: "-ron" }, ", ditambah ", { term: "-ra" }, " atau ", { term: "-se" }, ":"]
    vi: ["Gốc là indefinido của ", { term: ellos }, " bỏ ", { term: "-ron" }, ", thêm ", { term: "-ra" }, " hoặc ", { term: "-se" }, ":"]
  ex: { examples: [["Si ", { target: tuviera }, " tiempo, iría."], ["Quería que ", { target: vinieras }, "."]] }

