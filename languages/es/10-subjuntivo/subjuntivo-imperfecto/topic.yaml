            ex: { examples: [["Habla como si lo ", { target: supiera }, " todo."], ["Me mira igual que si no me ", { target: conociera }, "."]] }
            tr: { en: { examples: ["He talks as if he knew everything.", "He looks at me as if he didn't know me."] }, uk: { examples: ["Він говорить так, ніби знає все.", "Він дивиться на мене так, ніби не знає мене."] }, pt: { examples: ["Ele fala como se soubesse de tudo.", "Ele me olha como se não me conhecesse."] }, fr: { examples: ["Il parle comme s’il savait tout.", "Il me regarde comme s’il ne me connaissait pas."] }, de: { examples: ["Er redet, als ob er alles wüsste.", "Er sieht mich an, als ob er mich nicht kennen würde."] }, it: { examples: ["Parla come se sapesse tutto.", "Mi guarda come se non mi conoscesse."] }, pl: { examples: ["Mówi, jakby wszystko wiedział.", "Patrzy na mnie, jakby mnie nie znał."] }, tr: { examples: ["Her şeyi biliyormuş gibi konuşuyor.", "Bana tanımıyormuş gibi bakıyor."] }, id: { examples: ["Dia berbicara seolah-olah tahu segalanya.", "Dia menatap saya seolah-olah tidak mengenal saya."] }, vi: { examples: ["Anh ấy nói như thể biết tất cả.", "Anh ấy nhìn tôi như thể không quen tôi."] } }
          - level: C1
