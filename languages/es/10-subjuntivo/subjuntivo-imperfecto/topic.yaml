            tr: { en: { examples: ["If I had time, I would go.", "If I were rich, I would travel more."] }, uk: { examples: ["Якби я мав час, я б пішов.", "Якби я був багатим, я б більше подорожував."] }, pt: { examples: ["Se eu tivesse tempo, eu iria.", "Se eu fosse rico, viajaria mais."] }, fr: { examples: ["Si j’avais le temps, j’irais.", "Si j’étais riche, je voyagerais plus."] }, de: { examples: ["Wenn ich Zeit hätte, würde ich gehen.", "Wenn ich reich wäre, würde ich mehr reisen."] }, it: { examples: ["Se avessi tempo, andrei.", "Se fossi ricco, viaggerei di più."] }, pl: { examples: ["Gdybym miał czas, poszedłbym.", "Gdybym był bogaty, więcej bym podróżował."] }, tr: { examples: ["Zamanım olsa giderdim.", "Zengin olsam daha çok seyahat ederdim."] }, id: { examples: ["Kalau saya punya waktu, saya akan pergi.", "Kalau saya kaya, saya akan lebih sering bepergian."] }, vi: { examples: ["Nếu có thời gian, tôi sẽ đi.", "Nếu giàu, tôi sẽ đi du lịch nhiều hơn."] } }
          - level: B2
            verb: { term: "por si" }
            ex: { examples: [["Cogí un paraguas por si ", { target: lloviera }, "."], ["Llevó dinero por si ", { target: hiciera }, " falta."]] }
            tr: { en: { examples: ["I took an umbrella in case it rained.", "He took money in case it was needed."] }, uk: { examples: ["Я взяв парасольку на випадок дощу.", "Він узяв гроші на випадок, якщо знадобляться."] }, pt: { examples: ["Peguei um guarda-chuva caso chovesse.", "Ele levou dinheiro caso fosse preciso."] }, fr: { examples: ["J’ai pris un parapluie au cas où il pleuvrait.", "Il a pris de l’argent au cas où il en faudrait."] }, de: { examples: ["Ich nahm einen Regenschirm mit, falls es regnen würde.", "Er nahm Geld mit, falls man es brauchen würde."] }, it: { examples: ["Ho preso un ombrello nel caso piovesse.", "Ha portato dei soldi nel caso servissero."] }, pl: { examples: ["Wziąłem parasol na wypadek deszczu.", "Zabrał pieniądze na wszelki wypadek."] }, tr: { examples: ["Yağmur yağarsa diye şemsiye aldım.", "Gerekir diye para götürdü."] }, id: { examples: ["Saya membawa payung kalau-kalau hujan.", "Dia membawa uang kalau-kalau diperlukan."] }, vi: { examples: ["Tôi mang theo ô phòng khi trời mưa.", "Anh ấy mang theo tiền phòng khi cần."] } }
          - level: C1
