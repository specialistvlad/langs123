title: { es: "El perfecto y el pluscuamperfecto de subjuntivo: haya hablado, hubiera hablado", en: "Present Perfect and Past Perfect Subjunctive: haya hablado, hubiera hablado", uk: "Перфект і плюсквамперфект суб’юнктива: haya hablado, hubiera hablado", pt: "O pretérito perfeito composto e o mais-que-perfeito do subjuntivo: haya hablado, hubiera hablado", fr: "Le passé et le plus-que-parfait du subjonctif : haya hablado, hubiera hablado", de: "Der Konjunktiv Perfekt und Plusquamperfekt: haya hablado, hubiera hablado", it: "Il passato e il trapassato del congiuntivo: haya hablado, hubiera hablado", pl: "Perfecto i pluscuamperfecto w trybie łączącym: haya hablado, hubiera hablado", tr: "Dilek kipinde perfecto ve pluscuamperfecto: haya hablado, hubiera hablado", id: "Perfecto dan pluscuamperfecto subjungtif: haya hablado, hubiera hablado", vi: "Pretérito perfecto và quá khứ hoàn thành của thức giả định: haya hablado, hubiera hablado" }
summary:
  lead:
    es: ["El subjuntivo compuesto une ", { term: haya }, " o ", { term: hubiera }, " con un participio: ", { term: haya llegado }, " nombra lo acabado y ", { term: hubiera llegado }, " lo anterior a un momento pasado."]
    en: ["The compound subjunctive joins ", { term: "haya" }, " or ", { term: "hubiera" }, " with a participle: ", { term: "haya llegado" }, " names what is finished and ", { term: "hubiera llegado" }, " what came before a past moment."]
    uk: ["Складений суб’юнктив поєднує ", { term: "haya" }, " або ", { term: "hubiera" }, " з дієприкметником: ", { term: "haya llegado" }, " називає завершене, а ", { term: "hubiera llegado" }, " — те, що передувало минулому моменту."]
    pt: ["O subjuntivo composto junta ", { term: "haya" }, " ou ", { term: "hubiera" }, " com um particípio: ", { term: "haya llegado" }, " nomeia o que está acabado e ", { term: "hubiera llegado" }, " o que veio antes de um momento passado."]
    fr: ["Le subjonctif composé unit ", { term: "haya" }, " ou ", { term: "hubiera" }, " à un participe : ", { term: "haya llegado" }, " dit ce qui est achevé et ", { term: "hubiera llegado" }, " ce qui précède un moment passé."]
    de: ["Der zusammengesetzte Konjunktiv verbindet ", { term: "haya" }, " oder ", { term: "hubiera" }, " mit einem Partizip: ", { term: "haya llegado" }, " nennt Abgeschlossenes, ", { term: "hubiera llegado" }, " Früheres."]
    it: ["Il congiuntivo composto unisce ", { term: "haya" }, " o ", { term: "hubiera" }, " a un participio: ", { term: "haya llegado" }, " indica ciò che è concluso e ", { term: "hubiera llegado" }, " ciò che precede un momento passato."]
    pl: ["Złożony tryb łączący łączy ", { term: "haya" }, " lub ", { term: "hubiera" }, " z imiesłowem: ", { term: "haya llegado" }, " nazywa to, co zakończone, a ", { term: "hubiera llegado" }, " to, co poprzedza moment z przeszłości."]
    tr: ["Bileşik dilek kipi ", { term: "haya" }, " ya da ", { term: "hubiera" }, " ile bir participio birleştirir: ", { term: "haya llegado" }, " bitmiş olanı, ", { term: "hubiera llegado" }, " öncesini anlatır."]
    id: ["Subjungtif majemuk menggabungkan ", { term: "haya" }, " atau ", { term: "hubiera" }, " dengan partisip: ", { term: "haya llegado" }, " untuk hal yang selesai, ", { term: "hubiera llegado" }, " untuk hal yang lebih dulu."]
    vi: ["Thức giả định ghép nối ", { term: "haya" }, " hoặc ", { term: "hubiera" }, " với quá khứ phân từ: ", { term: "haya llegado" }, " chỉ việc đã xong, ", { term: "hubiera llegado" }, " chỉ việc xảy ra trước."]
  rule:
    es: ["Un verbo principal en presente pide ", { term: haya }, ", y uno en pasado, ", { term: hubiera }, ":"]
    en: ["A main verb in the present takes ", { term: "haya" }, ", and one in the past takes ", { term: "hubiera" }, ":"]
    uk: ["Головне дієслово в теперішньому часі вимагає ", { term: "haya" }, ", а в минулому — ", { term: "hubiera" }, ":"]
    pt: ["Um verbo principal no presente pede ", { term: "haya" }, ", e um no passado pede ", { term: "hubiera" }, ":"]
    fr: ["Un verbe principal au présent demande ", { term: "haya" }, ", et un verbe au passé demande ", { term: "hubiera" }, " :"]
    de: ["Ein Hauptverb im Präsens verlangt ", { term: "haya" }, ", eines in der Vergangenheit ", { term: "hubiera" }, ":"]
    it: ["Un verbo principale al presente vuole ", { term: "haya" }, ", e uno al passato vuole ", { term: "hubiera" }, ":"]
    pl: ["Czasownik główny w czasie teraźniejszym wymaga ", { term: "haya" }, ", a w przeszłym — ", { term: "hubiera" }, ":"]
    tr: ["Şimdiki zamanda bir ana fiil ", { term: "haya" }, " ister, geçmiş zamanda bir ana fiil ", { term: "hubiera" }, " ister:"]
    id: ["Kata kerja utama bentuk sekarang memakai ", { term: "haya" }, ", dan yang bentuk lampau memakai ", { term: "hubiera" }, ":"]
    vi: ["Động từ chính ở hiện tại đi với ", { term: "haya" }, ", ở quá khứ đi với ", { term: "hubiera" }, ":"]
  ex: { examples: [["Espero que ", { target: hayas llegado }, "."], ["Esperaba que ", { target: hubieras llegado }, "."]] }

