            en: ["after a past-tense verb, ", { term: "hubiera" }, " and not ", { term: "había" }]
            uk: ["після дієслова в минулому — ", { term: "hubiera" }, ", а не ", { term: "había" }]
            pt: ["depois de um verbo no passado, ", { term: "hubiera" }, " e não ", { term: "había" }]
            fr: ["après un verbe au passé, ", { term: "hubiera" }, " et non ", { term: "había" }]
            de: ["nach einem Verb in der Vergangenheit ", { term: "hubiera" }, " und nicht ", { term: "había" }]
            it: ["dopo un verbo al passato, ", { term: "hubiera" }, " e non ", { term: "había" }]
            pl: ["po czasowniku w czasie przeszłym ", { term: "hubiera" }, ", a nie ", { term: "había" }]
            tr: ["geçmiş zamanlı bir fiilden sonra ", { term: "había" }, " değil, ", { term: "hubiera" }, " kullanılır"]
            id: ["setelah kata kerja bentuk lampau, gunakan ", { term: "hubiera" }, ", bukan ", { term: "había" }]
            vi: ["sau động từ ở quá khứ dùng ", { term: "hubiera" }, ", không dùng ", { term: "había" }]
          ex: ["Dudaba que lo ", { target: hubiera hecho }, "."]
          tr: { en: "I doubted he had done it.", uk: "Я сумнівався, що він це зробив.", pt: "Eu duvidava que ele tivesse feito isso.", fr: "Je doutais qu’il l’ait fait.", de: "Ich bezweifelte, dass er es getan hatte.", it: "Dubitavo che l'avesse fatto.", pl: "Wątpiłem, czy to zrobił.", tr: "Bunu yaptığından şüphe ediyordum.", id: "Aku ragu dia sudah melakukannya.", vi: "Tôi đã nghi là anh ấy đã làm việc đó." }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            es: ["tras ", { term: cuando }, ", ", { term: haya }, " y no ", { term: habrá }]
            en: ["after ", { term: "cuando" }, ", ", { term: "haya" }, " and not ", { term: "habrá" }]
            uk: ["після ", { term: "cuando" }, " — ", { term: "haya" }, ", а не ", { term: "habrá" }]
            pt: ["depois de ", { term: "cuando" }, ", ", { term: "haya" }, " e não ", { term: "habrá" }]
            fr: ["après ", { term: "cuando" }, ", ", { term: "haya" }, " et non ", { term: "habrá" }]
            de: ["nach ", { term: "cuando" }, " ", { term: "haya" }, " und nicht ", { term: "habrá" }]
            it: ["dopo ", { term: "cuando" }, ", ", { term: "haya" }, " e non ", { term: "habrá" }]
            pl: ["po ", { term: "cuando" }, " ", { term: "haya" }, ", a nie ", { term: "habrá" }]
            tr: [{ term: "cuando" }, " sonrasında ", { term: "habrá" }, " değil, ", { term: "haya" }, " kullanılır"]
            id: ["setelah ", { term: "cuando" }, ", gunakan ", { term: "haya" }, ", bukan ", { term: "habrá" }]
            vi: ["sau ", { term: "cuando" }, " dùng ", { term: "haya" }, ", không dùng ", { term: "habrá" }]
          ex: ["Cuando ", { target: haya terminado }, ", te llamo."]
          tr: { en: "When I've finished, I'll call you.", uk: "Коли закінчу, я тобі зателефоную.", pt: "Quando eu terminar, ligo para você.", fr: "Quand j’aurai fini, je t’appelle.", de: "Wenn ich fertig bin, rufe ich dich an.", it: "Quando avrò finito, ti chiamo.", pl: "Kiedy skończę, zadzwonię do ciebie.", tr: "Bitirdiğimde seni ararım.", id: "Setelah selesai, aku telepon kamu.", vi: "Khi xong việc, tôi sẽ gọi cho bạn." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: ["El subjuntivo tiene dos tiempos compuestos: el ", { term: pretérito perfecto }, ", con ", { term: haya }, ", y el ", { term: pretérito pluscuamperfecto }, ", con ", { term: hubiera }, "."]
              en: ["The subjunctive has two compound tenses: the ", { term: "pretérito perfecto" }, ", with ", { term: "haya" }, ", and the ", { term: "pretérito pluscuamperfecto" }, ", with ", { term: "hubiera" }, "."]
              uk: ["Суб’юнктив має два складені часи: ", { term: "pretérito perfecto" }, " з ", { term: "haya" }, " і ", { term: "pretérito pluscuamperfecto" }, " з ", { term: "hubiera" }, "."]
              pt: ["O subjuntivo tem dois tempos compostos: o ", { term: "pretérito perfecto" }, ", com ", { term: "haya" }, ", e o ", { term: "pretérito pluscuamperfecto" }, ", com ", { term: "hubiera" }, "."]
              fr: ["Le subjonctif a deux temps composés : le ", { term: "pretérito perfecto" }, ", avec ", { term: "haya" }, ", et le ", { term: "pretérito pluscuamperfecto" }, ", avec ", { term: "hubiera" }, "."]
              de: ["Der Konjunktiv hat zwei zusammengesetzte Zeiten: das ", { term: "pretérito perfecto" }, " mit ", { term: "haya" }, " und das ", { term: "pretérito pluscuamperfecto" }, " mit ", { term: "hubiera" }, "."]
              it: ["Il congiuntivo ha due tempi composti: il ", { term: "pretérito perfecto" }, ", con ", { term: "haya" }, ", e il ", { term: "pretérito pluscuamperfecto" }, ", con ", { term: "hubiera" }, "."]
              pl: ["Tryb łączący ma dwa czasy złożone: ", { term: "pretérito perfecto" }, " z ", { term: "haya" }, " i ", { term: "pretérito pluscuamperfecto" }, " z ", { term: "hubiera" }, "."]
              tr: ["Dilek kipinin iki bileşik zamanı vardır: ", { term: "haya" }, " ile kurulan ", { term: "pretérito perfecto" }, " ve ", { term: "hubiera" }, " ile kurulan ", { term: "pretérito pluscuamperfecto" }, "."]
              id: ["Subjungtif punya dua tense majemuk: ", { term: "pretérito perfecto" }, " dengan ", { term: "haya" }, " dan ", { term: "pretérito pluscuamperfecto" }, " dengan ", { term: "hubiera" }, "."]
              vi: ["Thức giả định có hai thì ghép: ", { term: "pretérito perfecto" }, " với ", { term: "haya" }, " và ", { term: "pretérito pluscuamperfecto" }, " với ", { term: "hubiera" }, "."]
            ex: { examples: [["Dudo que ", { target: haya llegado }, "."], ["Dudaba que ", { target: hubiera llegado }, "."]] }
            tr: { en: { examples: ["I doubt he has arrived.", "I doubted he had arrived."] }, uk: { examples: ["Сумніваюся, що він приїхав.", "Я сумнівався, що він приїхав."] }, pt: { examples: ["Duvido que ele tenha chegado.", "Eu duvidava que ele tivesse chegado."] }, fr: { examples: ["Je doute qu’il soit arrivé.", "Je doutais qu’il soit arrivé."] }, de: { examples: ["Ich bezweifle, dass er angekommen ist.", "Ich bezweifelte, dass er angekommen war."] }, it: { examples: ["Dubito che sia arrivato.", "Dubitavo che fosse arrivato."] }, pl: { examples: ["Wątpię, czy przyjechał.", "Wątpiłem, czy przyjechał."] }, tr: { examples: ["Geldiğinden şüpheliyim.", "Geldiğinden şüphe ediyordum."] }, id: { examples: ["Aku ragu dia sudah tiba.", "Waktu itu aku ragu dia sudah tiba."] }, vi: { examples: ["Tôi nghi là anh ấy đã đến.", "Lúc đó tôi nghi là anh ấy đã đến rồi."] } }
          - type: rule
            level: B2
            text:
              es: ["Los pronombres y ", { term: no }, " van delante del auxiliar, y nada se pone entre el auxiliar y el participio."]
              en: ["Pronouns and ", { term: "no" }, " go before the auxiliary, and nothing goes between the auxiliary and the participle."]
              uk: ["Займенники та ", { term: "no" }, " стоять перед допоміжним дієсловом, а між ним і дієприкметником нічого не ставлять."]
              pt: ["Os pronomes e ", { term: "no" }, " vão antes do auxiliar, e nada se coloca entre o auxiliar e o particípio."]
              fr: ["Les pronoms et ", { term: "no" }, " se placent devant l’auxiliaire, et rien ne s’intercale entre l’auxiliaire et le participe."]
              de: ["Pronomen und ", { term: "no" }, " stehen vor dem Hilfsverb, und zwischen Hilfsverb und Partizip steht nichts."]
              it: ["I pronomi e ", { term: "no" }, " vanno prima dell'ausiliare, e tra l'ausiliare e il participio non si mette niente."]
              pl: ["Zaimki i ", { term: "no" }, " stoją przed czasownikiem posiłkowym, a między nim a imiesłowem nic nie stoi."]
              tr: ["Zamirler ve ", { term: "no" }, ", yardımcı fiilin önüne gelir; yardımcı fiil ile participio arasına hiçbir şey girmez."]
              id: ["Kata ganti dan ", { term: "no" }, " berada sebelum kata kerja bantu, dan tidak ada apa pun di antara kata kerja bantu dan partisip."]
              vi: ["Đại từ và ", { term: "no" }, " đứng trước trợ động từ, và không có gì chen giữa trợ động từ và quá khứ phân từ."]
            ex: { examples: [["Dudo que se lo ", { target: haya dicho }, "."], ["Dudaba que me ", { target: hubieras visto }, "."]] }
            tr: { en: { examples: ["I doubt he has told him.", "I doubted you had seen me."] }, uk: { examples: ["Сумніваюся, що він йому це сказав.", "Я сумнівався, що ти мене бачив."] }, pt: { examples: ["Duvido que ele tenha dito isso a ele.", "Eu duvidava que você tivesse me visto."] }, fr: { examples: ["Je doute qu’il le lui ait dit.", "Je doutais que tu m’aies vu."] }, de: { examples: ["Ich bezweifle, dass er es ihm gesagt hat.", "Ich bezweifelte, dass du mich gesehen hattest."] }, it: { examples: ["Dubito che glielo abbia detto.", "Dubitavo che mi avessi visto."] }, pl: { examples: ["Wątpię, czy mu to powiedział.", "Wątpiłem, czy mnie widziałeś."] }, tr: { examples: ["Ona söylediğinden şüpheliyim.", "Beni gördüğünden şüphe ediyordum."] }, id: { examples: ["Aku ragu dia sudah mengatakannya kepadanya.", "Aku ragu kamu sudah melihatku."] }, vi: { examples: ["Tôi nghi là anh ấy đã nói điều đó với anh ta.", "Tôi nghi là bạn đã nhìn thấy tôi."] } }
          - type: note
            level: B2
            text:
              es: ["Equivalen al ", { link: El pretérito perfecto, to: es.pasados.preterito-perfecto }, " y al ", { link: El pluscuamperfecto, to: es.pasados.pluscuamperfecto }, " del indicativo."]
              en: ["They match the ", { link: "Present Perfect", to: "es.pasados.preterito-perfecto" }, " and the ", { link: "Past Perfect", to: "es.pasados.pluscuamperfecto" }, " of the indicative."]
              uk: ["Вони відповідають ", { link: "Перфект", to: "es.pasados.preterito-perfecto" }, " і ", { link: "Плюсквамперфект", to: "es.pasados.pluscuamperfecto" }, " дійсного способу."]
              pt: ["Equivalem ao ", { link: "O pretérito perfeito composto", to: "es.pasados.preterito-perfecto" }, " e ao ", { link: "O pretérito mais-que-perfeito", to: "es.pasados.pluscuamperfecto" }, " do indicativo."]
              fr: ["Ils correspondent au ", { link: "Le passé composé", to: "es.pasados.preterito-perfecto" }, " et au ", { link: "Le plus-que-parfait", to: "es.pasados.pluscuamperfecto" }, " de l’indicatif."]
              de: ["Sie entsprechen dem ", { link: "Das Pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " und dem ", { link: "Das Plusquamperfekt", to: "es.pasados.pluscuamperfecto" }, " des Indikativs."]
              it: ["Equivalgono al ", { link: "Il pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " e al ", { link: "Il trapassato prossimo", to: "es.pasados.pluscuamperfecto" }, " dell'indicativo."]
              pl: ["Odpowiadają ", { link: "Pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " i ", { link: "Czas zaprzeszły", to: "es.pasados.pluscuamperfecto" }, " w trybie oznajmującym."]
              tr: ["Bunlar haber kipindeki ", { link: "Pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " ve ", { link: "Pluscuamperfecto", to: "es.pasados.pluscuamperfecto" }, " zamanlarına denk gelir."]
              id: ["Keduanya setara dengan ", { link: "Pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " dan ", { link: "Pluscuamperfecto", to: "es.pasados.pluscuamperfecto" }, " dalam indikatif."]
              vi: ["Chúng tương đương với ", { link: "Pretérito perfecto", to: "es.pasados.preterito-perfecto" }, " và ", { link: "Quá khứ hoàn thành", to: "es.pasados.pluscuamperfecto" }, " của thức chỉ định."]
          - type: note
            level: B2
            text:
              es: ["El auxiliar es ", { term: haber }, " en subjuntivo: ", { link: "El presente de subjuntivo: formas", to: es.subjuntivo.subjuntivo-formas }, " y ", { link: "El imperfecto de subjuntivo", to: es.subjuntivo.subjuntivo-imperfecto }, "."]
              en: ["The auxiliary is ", { term: "haber" }, " in the subjunctive: ", { link: "Present Subjunctive: Forms", to: "es.subjuntivo.subjuntivo-formas" }, " and ", { link: "Imperfect Subjunctive", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              uk: ["Допоміжне дієслово — ", { term: "haber" }, " у суб’юнктиві: ", { link: "Теперішній час суб’юнктива: форми", to: "es.subjuntivo.subjuntivo-formas" }, " і ", { link: "Імперфект суб’юнктива", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pt: ["O auxiliar é ", { term: "haber" }, " no subjuntivo: ", { link: "O presente do subjuntivo: formas", to: "es.subjuntivo.subjuntivo-formas" }, " e ", { link: "O imperfeito do subjuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              fr: ["L’auxiliaire est ", { term: "haber" }, " au subjonctif : ", { link: "Le présent du subjonctif : formes", to: "es.subjuntivo.subjuntivo-formas" }, " et ", { link: "L’imparfait du subjonctif", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              de: ["Das Hilfsverb ist ", { term: "haber" }, " im Konjunktiv: ", { link: "Der Konjunktiv Präsens: Formen", to: "es.subjuntivo.subjuntivo-formas" }, " und ", { link: "Der Konjunktiv Imperfekt", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              it: ["L'ausiliare è ", { term: "haber" }, " al congiuntivo: ", { link: "Il presente del congiuntivo: forme", to: "es.subjuntivo.subjuntivo-formas" }, " e ", { link: "L'imperfetto del congiuntivo", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              pl: ["Czasownikiem posiłkowym jest ", { term: "haber" }, " w trybie łączącym: ", { link: "Tryb łączący czasu teraźniejszego: formy", to: "es.subjuntivo.subjuntivo-formas" }, " i ", { link: "Imperfecto trybu łączącego", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              tr: ["Yardımcı fiil, dilek kipindeki ", { term: "haber" }, " fiilidir: ", { link: "Dilek kipinin şimdiki zamanı: biçimler", to: "es.subjuntivo.subjuntivo-formas" }, " ve ", { link: "Dilek kipinin imperfecto biçimi", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              id: ["Kata kerja bantunya adalah ", { term: "haber" }, " dalam subjungtif: ", { link: "Presente subjungtif: bentuk", to: "es.subjuntivo.subjuntivo-formas" }, " dan ", { link: "Imperfecto subjungtif", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
              vi: ["Trợ động từ là ", { term: "haber" }, " ở thức giả định: ", { link: "Thì hiện tại của thức giả định: các dạng", to: "es.subjuntivo.subjuntivo-formas" }, " và ", { link: "Quá khứ chưa hoàn thành của thức giả định", to: "es.subjuntivo.subjuntivo-imperfecto" }, "."]
          - type: note
            level: B2
            text:
              es: ["Cuándo se usa el subjuntivo: ", { link: "El subjuntivo: deseos, dudas y opiniones", to: es.subjuntivo.subjuntivo-deseos-dudas }, "; la elección del tiempo: ", { link: La correlación de tiempos con el subjuntivo, to: es.subjuntivo.subjuntivo-correlacion }, "."]
              en: ["When the subjunctive is used: ", { link: "Subjunctive for Wishes, Doubt and Opinions", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; choosing the tense: ", { link: "Sequence of Tenses with the Subjunctive", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              uk: ["Коли вживають суб’юнктив: ", { link: "Суб’юнктив: бажання, сумніви й думки", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; вибір часу: ", { link: "Узгодження часів із суб’юнктивом", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              pt: ["Quando se usa o subjuntivo: ", { link: "O subjuntivo: desejos, dúvidas e opiniões", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; a escolha do tempo: ", { link: "A correlação de tempos com o subjuntivo", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              fr: ["Quand on emploie le subjonctif : ", { link: "Le subjonctif : souhaits, doutes et opinions", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, " ; le choix du temps : ", { link: "La concordance des temps avec le subjonctif", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              de: ["Wann der Konjunktiv steht: ", { link: "Der Konjunktiv: Wünsche, Zweifel und Meinungen", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; die Wahl der Zeit: ", { link: "Die Zeitenfolge beim Konjunktiv", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              it: ["Quando si usa il congiuntivo: ", { link: "Il congiuntivo: desideri, dubbi e opinioni", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; la scelta del tempo: ", { link: "La concordanza dei tempi con il congiuntivo", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              pl: ["Kiedy używa się trybu łączącego: ", { link: "Tryb łączący: życzenia, wątpliwości i opinie", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; wybór czasu: ", { link: "Następstwo czasów z trybem łączącym", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              tr: ["Dilek kipinin ne zaman kullanıldığı: ", { link: "Dilek kipi: istekler, şüpheler ve görüşler", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; zamanın seçimi: ", { link: "Dilek kipiyle zaman uyumu", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              id: ["Kapan subjungtif dipakai: ", { link: "Subjungtif: keinginan, keraguan, dan pendapat", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; pemilihan tense: ", { link: "Kesesuaian tense dengan subjungtif", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]
              vi: ["Khi nào dùng thức giả định: ", { link: "Thức giả định: mong muốn, nghi ngờ và ý kiến", to: "es.subjuntivo.subjuntivo-deseos-dudas" }, "; cách chọn thì: ", { link: "Sự phối hợp thì với thức giả định", to: "es.subjuntivo.subjuntivo-correlacion" }, "."]

