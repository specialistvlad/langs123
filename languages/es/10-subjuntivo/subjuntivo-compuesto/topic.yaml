          tr: { en: { examples: ["I doubt he has described it.", "If only he had returned it."] }, uk: { examples: ["Сумніваюся, що він це описав.", "Якби ж він це повернув!"] }, pt: { examples: ["Duvido que ele o tenha descrito.", "Tomara que ele o tivesse devolvido."] }, fr: { examples: ["Je doute qu’il l’ait décrit.", "Si seulement il l’avait rendu !"] }, de: { examples: ["Ich bezweifle, dass er es beschrieben hat.", "Hätte er es doch zurückgegeben!"] }, it: { examples: ["Dubito che l'abbia descritto.", "Magari l'avesse restituito!"] }, pl: { examples: ["Wątpię, czy to opisał.", "Gdyby tylko to oddał!"] }, tr: { examples: ["Bunu tarif ettiğinden şüpheliyim.", "Keşke onu geri verseydi."] }, id: { examples: ["Aku ragu dia sudah menggambarkannya.", "Andai saja dia mengembalikannya."] }, vi: { examples: ["Tôi nghi là anh ấy đã mô tả việc đó.", "Giá mà anh ấy đã trả lại nó."] } }
        - level: C1
