            en: ["after a negated belief, ", { term: "haya" }, " replaces the future perfect"]
            uk: ["після заперечення думки ", { term: "haya" }, " замінює майбутній перфект"]
            pt: ["depois de uma crença negada, ", { term: "haya" }, " substitui o futuro do presente composto"]
            fr: ["après une croyance niée, ", { term: "haya" }, " remplace le futur antérieur"]
            de: ["nach einer verneinten Annahme ersetzt ", { term: "haya" }, " das Futur II"]
            it: ["dopo una convinzione negata, ", { term: "haya" }, " sostituisce il futuro anteriore"]
            pl: ["po zanegowanym przekonaniu ", { term: "haya" }, " zastępuje ", { term: "futuro perfecto" }]
            tr: ["olumsuzlanmış bir inançtan sonra ", { term: "haya" }, ", ", { term: "futuro perfecto" }, " yerine geçer"]
            id: ["setelah keyakinan yang dinegasikan, ", { term: "haya" }, " menggantikan ", { term: "futuro perfecto" }]
            vi: ["sau một niềm tin bị phủ định, ", { term: "haya" }, " thay cho thì tương lai hoàn thành"]
          ex: ["No pienso que se ", { target: haya quedado }, " dormido."]
          tr: { en: "I don't think he has fallen asleep.", uk: "Не думаю, що він заснув.", pt: "Não acho que ele tenha adormecido.", fr: "Je ne pense pas qu’il se soit endormi.", de: "Ich glaube nicht, dass er eingeschlafen ist.", it: "Non penso che si sia addormentato.", pl: "Nie sądzę, żeby zasnął.", tr: "Uyuyakaldığını sanmıyorum.", id: "Kurasa dia tidak tertidur.", vi: "Tôi không nghĩ anh ấy đã ngủ quên." }
        - level: C2
          point: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
          rule:
            es: ["con una referencia pasada, el imperfecto puede sustituir a ", { term: haya }]
            en: ["with a past reference, the imperfect can replace ", { term: "haya" }]
            uk: ["якщо йдеться про минуле, імперфект може замінити ", { term: "haya" }]
            pt: ["com uma referência ao passado, o imperfeito pode substituir ", { term: "haya" }]
            fr: ["avec une référence passée, l’imparfait peut remplacer ", { term: "haya" }]
            de: ["bei einem Vergangenheitsbezug kann das Imperfecto ", { term: "haya" }, " ersetzen"]
            it: ["con un riferimento al passato, l'imperfetto può sostituire ", { term: "haya" }]
            pl: ["przy odniesieniu do przeszłości imperfecto może zastąpić ", { term: "haya" }]
            tr: ["geçmişe gönderme varsa imperfecto, ", { term: "haya" }, " yerine kullanılabilir"]
            id: ["dengan acuan masa lalu, imperfecto dapat menggantikan ", { term: "haya" }]
            vi: ["khi nói về quá khứ, quá khứ chưa hoàn thành có thể thay cho ", { term: "haya" }]
          ex: { alternatives: [["No creo que ", { target: haya salido }, " anoche."], ["No creo que ", { target: saliera }, " anoche."]] }
          tr: { en: { alternatives: ["I don't think he went out last night.", "I don't think he went out last night."] }, uk: { alternatives: ["Не думаю, що він виходив учора ввечері.", "Не думаю, що він виходив учора ввечері."] }, pt: { alternatives: ["Não acho que ele tenha saído ontem à noite.", "Não acho que ele tenha saído ontem à noite."] }, fr: { alternatives: ["Je ne crois pas qu’il soit sorti hier soir.", "Je ne crois pas qu’il soit sorti hier soir."] }, de: { alternatives: ["Ich glaube nicht, dass er gestern Abend ausgegangen ist.", "Ich glaube nicht, dass er gestern Abend ausgegangen ist."] }, it: { alternatives: ["Non credo che sia uscito ieri sera.", "Non credo che sia uscito ieri sera."] }, pl: { alternatives: ["Nie sądzę, żeby wyszedł wczoraj wieczorem.", "Nie sądzę, żeby wyszedł wczoraj wieczorem."] }, tr: { alternatives: ["Dün gece dışarı çıktığını sanmıyorum.", "Dün gece dışarı çıktığını sanmıyorum."] }, id: { alternatives: ["Kurasa dia tidak keluar tadi malam.", "Kurasa dia tidak keluar tadi malam."] }, vi: { alternatives: ["Tôi không nghĩ tối qua anh ấy đã ra ngoài.", "Tôi không nghĩ tối qua anh ấy đã ra ngoài."] } }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
