    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "El subjuntivo del pretérito perfecto: una acción acabada en un tiempo que llega al presente", en: "Present perfect subjunctive: an action finished in a period that reaches the present", uk: "Перфект суб’юнктива: завершена дія в проміжку часу, що сягає теперішнього", pt: "O pretérito perfeito composto do subjuntivo: uma ação acabada num período que chega ao presente", fr: "Le passé du subjonctif : une action achevée dans une période qui touche le présent", de: "Der Konjunktiv Perfekt: eine abgeschlossene Handlung in einem Zeitraum, der bis in die Gegenwart reicht", it: "Il passato del congiuntivo: un'azione conclusa in un periodo che arriva fino al presente", pl: "Pretérito perfecto trybu łączącego: czynność zakończona w okresie sięgającym teraźniejszości", tr: "Dilek kipinin pretérito perfecto biçimi: şimdiye uzanan bir zaman diliminde tamamlanmış eylem", id: "Pretérito perfecto subjungtif: tindakan yang selesai dalam periode yang berlanjut hingga kini", vi: "Pretérito perfecto của thức giả định: hành động đã xong trong khoảng thời gian kéo dài đến hiện tại" }
            ex: { examples: [["No es cierto que Marta ", { target: haya escrito }, " esa carta."], ["Espero que ", { target: hayas dormido }, " bien."], ["Me alegro de que ", { target: hayas venido }, "."]] }
            tr: { en: { examples: ["It isn't true that Marta has written that letter.", "I hope you have slept well.", "I'm glad you have come."] }, uk: { examples: ["Це неправда, що Марта написала цього листа.", "Сподіваюся, ти добре поспав.", "Я радий, що ти прийшов."] }, pt: { examples: ["Não é verdade que a Marta tenha escrito essa carta.", "Espero que você tenha dormido bem.", "Fico feliz que você tenha vindo."] }, fr: { examples: ["Il n’est pas vrai que Marta ait écrit cette lettre.", "J’espère que tu as bien dormi.", "Je suis content que tu sois venu."] }, de: { examples: ["Es stimmt nicht, dass Marta diesen Brief geschrieben hat.", "Ich hoffe, du hast gut geschlafen.", "Ich freue mich, dass du gekommen bist."] }, it: { examples: ["Non è vero che Marta abbia scritto quella lettera.", "Spero che tu abbia dormito bene.", "Sono contento che tu sia venuto."] }, pl: { examples: ["To nieprawda, że Marta napisała ten list.", "Mam nadzieję, że dobrze spałeś.", "Cieszę się, że przyszedłeś."] }, tr: { examples: ["Marta'nın bu mektubu yazdığı doğru değil.", "Umarım iyi uyumuşsundur.", "Geldiğine sevindim."] }, id: { examples: ["Tidak benar bahwa Marta menulis surat itu.", "Semoga kamu sudah tidur nyenyak.", "Aku senang kamu sudah datang."] }, vi: { examples: ["Không đúng là Marta đã viết bức thư đó.", "Tôi hy vọng bạn đã ngủ ngon.", "Tôi vui vì bạn đã đến."] } }
          - level: B2
            use: { es: ["Tras ", { term: cuando }, ", una acción futura anterior a otra: ", { term: haya }, " o el presente"], en: ["After ", { term: "cuando" }, ", a future action before another: ", { term: "haya" }, " or the present"], uk: ["Після ", { term: "cuando" }, " — майбутня дія, що передує іншій: ", { term: "haya" }, " або теперішній час"], pt: ["Depois de ", { term: "cuando" }, ", uma ação futura anterior a outra: ", { term: "haya" }, " ou o presente"], fr: ["Après ", { term: "cuando" }, ", une action future antérieure à une autre : ", { term: "haya" }, " ou le présent"], de: ["Nach ", { term: "cuando" }, " eine zukünftige Handlung vor einer anderen: ", { term: "haya" }, " oder das Präsens"], it: ["Dopo ", { term: "cuando" }, ", un'azione futura anteriore a un'altra: ", { term: "haya" }, " o il presente"], pl: ["Po ", { term: "cuando" }, " czynność przyszła wcześniejsza niż inna: ", { term: "haya" }, " albo czas teraźniejszy"], tr: [{ term: "cuando" }, " sonrasında, başka bir eylemden önce gelen gelecek eylem: ", { term: "haya" }, " ya da şimdiki zaman"], id: ["Setelah ", { term: "cuando" }, ", tindakan di masa depan yang mendahului tindakan lain: ", { term: "haya" }, " atau presente"], vi: ["Sau ", { term: "cuando" }, ", một hành động tương lai xảy ra trước hành động khác: ", { term: "haya" }, " hoặc thì hiện tại"] }
            ex: { alternatives: [["Cuando el jefe ", { target: se haya ido }, ", hablamos."], ["Cuando el jefe ", { target: se vaya }, ", hablamos."]] }
            tr: { en: { alternatives: ["When the boss has gone, we'll talk.", "When the boss goes, we'll talk."] }, uk: { alternatives: ["Коли начальник піде, поговоримо.", "Коли начальник піде, поговоримо."] }, pt: { alternatives: ["Quando o chefe tiver saído, a gente conversa.", "Quando o chefe sair, a gente conversa."] }, fr: { alternatives: ["Quand le chef sera parti, nous parlerons.", "Quand le chef partira, nous parlerons."] }, de: { alternatives: ["Wenn der Chef gegangen ist, reden wir.", "Wenn der Chef geht, reden wir."] }, it: { alternatives: ["Quando il capo se ne sarà andato, parliamo.", "Quando il capo se ne va, parliamo."] }, pl: { alternatives: ["Kiedy szef wyjdzie, porozmawiamy.", "Kiedy szef wyjdzie, porozmawiamy."] }, tr: { alternatives: ["Patron gittiğinde konuşuruz.", "Patron gittiğinde konuşuruz."] }, id: { alternatives: ["Setelah bos pergi, kita bicara.", "Kalau bos pergi, kita bicara."] }, vi: { alternatives: ["Khi sếp đã đi rồi, chúng ta sẽ nói chuyện.", "Khi sếp đi, chúng ta sẽ nói chuyện."] } }
          - level: C1
            use: { es: ["Tras una creencia negada, ", { term: haya }, " sustituye al futuro perfecto de la afirmación"], en: ["After a negated belief, ", { term: "haya" }, " replaces the future perfect of the affirmation"], uk: ["Після заперечення думки ", { term: "haya" }, " замінює майбутній перфект стверджувального речення"], pt: ["Depois de uma crença negada, ", { term: "haya" }, " substitui o futuro do presente composto da afirmação"], fr: ["Après une croyance niée, ", { term: "haya" }, " remplace le futur antérieur de l’affirmation"], de: ["Nach einer verneinten Annahme ersetzt ", { term: "haya" }, " das Futur II der Bejahung"], it: ["Dopo una convinzione negata, ", { term: "haya" }, " sostituisce il futuro anteriore dell'affermazione"], pl: ["Po zanegowanym przekonaniu ", { term: "haya" }, " zastępuje ", { term: "futuro perfecto" }, " ze zdania twierdzącego"], tr: ["Olumsuzlanmış bir inançtan sonra ", { term: "haya" }, ", olumlu cümledeki ", { term: "futuro perfecto" }, " yerine geçer"], id: ["Setelah keyakinan yang dinegasikan, ", { term: "haya" }, " menggantikan ", { term: "futuro perfecto" }, " pada kalimat positifnya"], vi: ["Sau một niềm tin bị phủ định, ", { term: "haya" }, " thay cho thì tương lai hoàn thành của câu khẳng định"] }
            ex: { examples: [{ contrast: ["Pienso que se habrá quedado dormido.", ["No pienso que se ", { target: haya quedado }, " dormido."]] }, { contrast: ["Creo que ya habrán llegado.", ["No creo que ya ", { target: hayan llegado }, "."]] }] }
            tr: { en: { examples: [{ contrast: ["I think he must have fallen asleep.", "I don't think he has fallen asleep."] }, { contrast: ["I think they must have arrived by now.", "I don't think they have arrived yet."] }] }, uk: { examples: [{ contrast: ["Думаю, він, певно, заснув.", "Не думаю, що він заснув."] }, { contrast: ["Думаю, вони вже приїхали.", "Не думаю, що вони вже приїхали."] }] }, pt: { examples: [{ contrast: ["Acho que ele deve ter adormecido.", "Não acho que ele tenha adormecido."] }, { contrast: ["Acho que eles já devem ter chegado.", "Não acho que eles já tenham chegado."] }] }, fr: { examples: [{ contrast: ["Je pense qu’il s’est sans doute endormi.", "Je ne pense pas qu’il se soit endormi."] }, { contrast: ["Je crois qu’ils seront déjà arrivés.", "Je ne crois pas qu’ils soient déjà arrivés."] }] }, de: { examples: [{ contrast: ["Ich denke, er ist wohl eingeschlafen.", "Ich glaube nicht, dass er eingeschlafen ist."] }, { contrast: ["Ich glaube, sie sind schon angekommen.", "Ich glaube nicht, dass sie schon angekommen sind."] }] }, it: { examples: [{ contrast: ["Penso che si sarà addormentato.", "Non penso che si sia addormentato."] }, { contrast: ["Credo che siano già arrivati.", "Non credo che siano già arrivati."] }] }, pl: { examples: [{ contrast: ["Myślę, że pewnie zasnął.", "Nie sądzę, żeby zasnął."] }, { contrast: ["Sądzę, że już dojechali.", "Nie sądzę, żeby już dojechali."] }] }, tr: { examples: [{ contrast: ["Sanırım uyuyakalmıştır.", "Uyuyakaldığını sanmıyorum."] }, { contrast: ["Sanırım çoktan varmışlardır.", "Henüz varmış olduklarını sanmıyorum."] }] }, id: { examples: [{ contrast: ["Kurasa dia pasti tertidur.", "Kurasa dia tidak tertidur."] }, { contrast: ["Kurasa mereka pasti sudah tiba.", "Kurasa mereka belum tiba."] }] }, vi: { examples: [{ contrast: ["Tôi nghĩ chắc anh ấy đã ngủ quên.", "Tôi không nghĩ anh ấy đã ngủ quên."] }, { contrast: ["Tôi nghĩ chắc họ đã đến rồi.", "Tôi không nghĩ họ đã đến."] }] } }
          - level: C2
            use: { es: "Con una referencia pasada, el imperfecto de subjuntivo puede sustituir al perfecto", en: "With a past reference, the imperfect subjunctive can replace the perfect", uk: "Якщо йдеться про минуле, імперфект суб’юнктива може замінити перфект", pt: "Com uma referência ao passado, o imperfeito do subjuntivo pode substituir o pretérito perfeito composto", fr: "Avec une référence passée, l’imparfait du subjonctif peut remplacer le passé", de: "Bei einem Vergangenheitsbezug kann der Konjunktiv Imperfekt das Perfekt ersetzen", it: "Con un riferimento al passato, l'imperfetto del congiuntivo può sostituire il passato", pl: "Przy odniesieniu do przeszłości imperfecto trybu łączącego może zastąpić pretérito perfecto", tr: "Geçmişe gönderme varsa dilek kipinin imperfecto biçimi, pretérito perfecto yerine kullanılabilir", id: "Dengan acuan masa lalu, imperfecto subjungtif dapat menggantikan pretérito perfecto", vi: "Khi nói về quá khứ, quá khứ chưa hoàn thành của thức giả định có thể thay cho pretérito perfecto" }
            ex: { alternatives: [["No creo que mi vecino ", { target: haya salido }, " anoche sin avisar."], ["No creo que mi vecino ", { target: saliera }, " anoche sin avisar."]] }
            tr: { en: { alternatives: ["I don't think my neighbour went out last night without telling anyone.", "I don't think my neighbour went out last night without telling anyone."] }, uk: { alternatives: ["Не думаю, що мій сусід виходив учора ввечері, нікого не попередивши.", "Не думаю, що мій сусід виходив учора ввечері, нікого не попередивши."] }, pt: { alternatives: ["Não acho que meu vizinho tenha saído ontem à noite sem avisar.", "Não acho que meu vizinho tenha saído ontem à noite sem avisar."] }, fr: { alternatives: ["Je ne crois pas que mon voisin soit sorti hier soir sans prévenir.", "Je ne crois pas que mon voisin soit sorti hier soir sans prévenir."] }, de: { alternatives: ["Ich glaube nicht, dass mein Nachbar gestern Abend ausgegangen ist, ohne Bescheid zu sagen.", "Ich glaube nicht, dass mein Nachbar gestern Abend ausgegangen ist, ohne Bescheid zu sagen."] }, it: { alternatives: ["Non credo che il mio vicino sia uscito ieri sera senza avvisare.", "Non credo che il mio vicino sia uscito ieri sera senza avvisare."] }, pl: { alternatives: ["Nie sądzę, żeby mój sąsiad wyszedł wczoraj wieczorem bez uprzedzenia.", "Nie sądzę, żeby mój sąsiad wyszedł wczoraj wieczorem bez uprzedzenia."] }, tr: { alternatives: ["Komşumun dün gece haber vermeden dışarı çıktığını sanmıyorum.", "Komşumun dün gece haber vermeden dışarı çıktığını sanmıyorum."] }, id: { alternatives: ["Kurasa tetanggaku tidak keluar tadi malam tanpa memberi tahu.", "Kurasa tetanggaku tidak keluar tadi malam tanpa memberi tahu."] }, vi: { alternatives: ["Tôi không nghĩ hàng xóm của tôi đã ra ngoài tối qua mà không báo.", "Tôi không nghĩ hàng xóm của tôi đã ra ngoài tối qua mà không báo."] } }

  - title: { es: "Uso: pretérito pluscuamperfecto", en: "Use: past perfect", uk: "Вживання: плюсквамперфект", pt: "Uso: pretérito mais-que-perfeito", fr: "Emploi : plus-que-parfait", de: "Gebrauch: Plusquamperfekt", it: "Uso: trapassato", pl: "Użycie: czas zaprzeszły", tr: "Kullanım: pluscuamperfecto", id: "Penggunaan: pluscuamperfecto", vi: "Cách dùng: quá khứ hoàn thành" }
