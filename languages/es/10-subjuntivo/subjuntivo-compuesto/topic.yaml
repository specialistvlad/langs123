            text:
              es: [{ term: hubiera }, " y ", { term: hubiese }, " valen igual; ", { term: hubiese }, " es más frecuente en España y en la lengua escrita."]
              en: [{ term: "hubiera" }, " and ", { term: "hubiese" }, " mean the same; ", { term: "hubiese" }, " is more frequent in Spain and in writing."]
              uk: [{ term: "hubiera" }, " і ", { term: "hubiese" }, " рівнозначні; ", { term: "hubiese" }, " частіше вживають в Іспанії та на письмі."]
              pt: [{ term: "hubiera" }, " e ", { term: "hubiese" }, " valem o mesmo; ", { term: "hubiese" }, " é mais frequente na Espanha e na língua escrita."]
              fr: [{ term: "hubiera" }, " et ", { term: "hubiese" }, " sont équivalents ; ", { term: "hubiese" }, " est plus fréquent en Espagne et à l’écrit."]
              de: [{ term: "hubiera" }, " und ", { term: "hubiese" }, " sind gleichwertig; ", { term: "hubiese" }, " ist in Spanien und in der Schriftsprache häufiger."]
              it: [{ term: "hubiera" }, " e ", { term: "hubiese" }, " sono equivalenti; ", { term: "hubiese" }, " è più frequente in Spagna e nella lingua scritta."]
              pl: [{ term: "hubiera" }, " i ", { term: "hubiese" }, " znaczą to samo; ", { term: "hubiese" }, " jest częstsze w Hiszpanii i w języku pisanym."]
              tr: [{ term: "hubiera" }, " ile ", { term: "hubiese" }, " aynı anlamdadır; ", { term: "hubiese" }, " İspanya'da ve yazı dilinde daha yaygındır."]
              id: [{ term: "hubiera" }, " dan ", { term: "hubiese" }, " sama artinya; ", { term: "hubiese" }, " lebih sering dipakai di Spanyol dan dalam bahasa tulis."]
              vi: [{ term: "hubiera" }, " và ", { term: "hubiese" }, " có nghĩa như nhau; ", { term: "hubiese" }, " phổ biến hơn ở Tây Ban Nha và trong văn viết."]
            ex: { equivalence: [["Ojalá ", { target: hubiera venido }, "."], ["Ojalá ", { target: hubiese venido }, "."]] }
            tr: { en: { equivalence: ["If only he had come.", "If only he had come."] }, uk: { equivalence: ["Якби ж він прийшов!", "Якби ж він прийшов!"] }, pt: { equivalence: ["Tomara que ele tivesse vindo.", "Tomara que ele tivesse vindo."] }, fr: { equivalence: ["Si seulement il était venu !", "Si seulement il était venu !"] }, de: { equivalence: ["Wäre er doch gekommen!", "Wäre er doch gekommen!"] }, it: { equivalence: ["Magari fosse venuto!", "Magari fosse venuto!"] }, pl: { equivalence: ["Gdyby tylko przyszedł!", "Gdyby tylko przyszedł!"] }, tr: { equivalence: ["Keşke gelseydi.", "Keşke gelseydi."] }, id: { equivalence: ["Andai saja dia datang.", "Andai saja dia datang."] }, vi: { equivalence: ["Giá mà anh ấy đã đến.", "Giá mà anh ấy đã đến."] } }

  - title: { es: "Forma: participios irregulares", en: "Form: irregular participles", uk: "Форма: неправильні дієприкметники", pt: "Forma: particípios irregulares", fr: "Forme : participes irréguliers", de: "Form: unregelmäßige Partizipien", it: "Forma: participi irregolari", pl: "Forma: imiesłowy nieregularne", tr: "Biçim: düzensiz participio biçimleri", id: "Bentuk: partisip tidak beraturan", vi: "Dạng: quá khứ phân từ bất quy tắc" }
    role: form
    features: { aspect: prf, mood: sbjv }
    content:
      - type: usage
        columns:
          - { key: participle, label: { es: Verbo y participio, en: "Verb and participle", uk: "Дієслово й дієприкметник", pt: "Verbo e particípio", fr: "Verbe et participe", de: "Verb und Partizip", it: "Verbo e participio", pl: "Czasownik i imiesłów", tr: "Fiil ve participio", id: "Kata kerja dan partisip", vi: "Động từ và quá khứ phân từ" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B2, participle: { mapping: [{ term: hacer }, { term: hecho }] }, ex: ["Es raro que ya lo ", { target: hayan hecho }, "."], tr: { en: "It's odd that they have already done it.", uk: "Дивно, що вони це вже зробили.", pt: "É estranho que já tenham feito isso.", fr: "C’est étrange qu’ils l’aient déjà fait.", de: "Es ist seltsam, dass sie es schon gemacht haben.", it: "È strano che l'abbiano già fatto.", pl: "Dziwne, że już to zrobili.", tr: "Bunu çoktan yapmış olmaları tuhaf.", id: "Aneh kalau mereka sudah melakukannya.", vi: "Lạ là họ đã làm việc đó rồi." } }
          - { level: B2, participle: { mapping: [{ term: escribir }, { term: escrito }] }, ex: ["No creo que Marta ", { target: haya escrito }, " esa carta."], tr: { en: "I don't think Marta has written that letter.", uk: "Не думаю, що Марта написала цього листа.", pt: "Não acho que a Marta tenha escrito essa carta.", fr: "Je ne crois pas que Marta ait écrit cette lettre.", de: "Ich glaube nicht, dass Marta diesen Brief geschrieben hat.", it: "Non credo che Marta abbia scritto quella lettera.", pl: "Nie sądzę, żeby Marta napisała ten list.", tr: "Marta'nın bu mektubu yazdığını sanmıyorum.", id: "Kurasa Marta tidak menulis surat itu.", vi: "Tôi không nghĩ Marta đã viết bức thư đó." } }
          - { level: B2, participle: { mapping: [{ term: ver }, { term: visto }] }, ex: ["Ojalá lo ", { target: hubieras visto }, "."], tr: { en: "If only you had seen it.", uk: "Якби ж ти це бачив!", pt: "Tomara que você tivesse visto isso.", fr: "Si seulement tu l’avais vu !", de: "Hättest du es doch gesehen!", it: "Magari l'avessi visto!", pl: "Gdybyś tylko to zobaczył!", tr: "Keşke görseydin.", id: "Andai saja kamu melihatnya.", vi: "Giá mà bạn đã nhìn thấy nó." } }
          - { level: C1, participle: { mapping: [{ term: describir }, { term: descrito }] }, ex: ["Dudo que lo ", { target: haya descrito }, " bien."], tr: { en: "I doubt he has described it well.", uk: "Сумніваюся, що він добре це описав.", pt: "Duvido que ele o tenha descrito bem.", fr: "Je doute qu’il l’ait bien décrit.", de: "Ich bezweifle, dass er es gut beschrieben hat.", it: "Dubito che l'abbia descritto bene.", pl: "Wątpię, czy dobrze to opisał.", tr: "Bunu iyi tarif ettiğinden şüpheliyim.", id: "Aku ragu dia menggambarkannya dengan baik.", vi: "Tôi nghi là anh ấy đã mô tả nó tốt." } }
          - { level: C1, participle: { mapping: [{ term: devolver }, { term: devuelto }] }, ex: ["Ojalá lo ", { target: hubiera devuelto }, " a tiempo."], tr: { en: "If only he had returned it on time.", uk: "Якби ж він повернув це вчасно!", pt: "Tomara que ele tivesse devolvido a tempo.", fr: "Si seulement il l’avait rendu à temps !", de: "Hätte er es doch rechtzeitig zurückgegeben!", it: "Magari l'avesse restituito in tempo!", pl: "Gdyby tylko oddał to na czas!", tr: "Keşke zamanında geri verseydi.", id: "Andai saja dia mengembalikannya tepat waktu.", vi: "Giá mà anh ấy đã trả lại nó đúng hạn." } }
          - { level: C1, participle: { mapping: [{ term: componer }, { term: compuesto }] }, ex: ["No creía que ", { target: hubiera compuesto }, " esa canción."], tr: { en: "I didn't think he had composed that song.", uk: "Я не думав, що він написав цю пісню.", pt: "Eu não acreditava que ele tivesse composto essa canção.", fr: "Je ne pensais pas qu’il ait composé cette chanson.", de: "Ich glaubte nicht, dass er dieses Lied komponiert hatte.", it: "Non credevo che avesse composto quella canzone.", pl: "Nie sądziłem, że skomponował tę piosenkę.", tr: "O şarkıyı bestelediğini sanmıyordum.", id: "Aku tidak mengira dia yang menciptakan lagu itu.", vi: "Tôi không nghĩ anh ấy đã sáng tác bài hát đó." } }
          - { level: C1, participle: { mapping: [{ term: deshacer }, { term: deshecho }] }, ex: ["Es raro que ya ", { target: hayan deshecho }, " la maleta."], tr: { en: "It's odd that they have already unpacked the suitcase.", uk: "Дивно, що вони вже розпакували валізу.", pt: "É estranho que já tenham desfeito a mala.", fr: "C’est étrange qu’ils aient déjà défait la valise.", de: "Es ist seltsam, dass sie den Koffer schon ausgepackt haben.", it: "È strano che abbiano già disfatto la valigia.", pl: "Dziwne, że już rozpakowali walizkę.", tr: "Bavulu çoktan açmış olmaları tuhaf.", id: "Aneh kalau mereka sudah membongkar kopernya.", vi: "Lạ là họ đã dỡ va li ra rồi." } }
          - { level: C1, participle: { mapping: [{ term: contradecir }, { term: contradicho }] }, ex: ["Me sorprendió que te ", { target: hubieras contradicho }, "."], tr: { en: "I was surprised that you had contradicted yourself.", uk: "Мене здивувало, що ти собі суперечив.", pt: "Fiquei surpreso que você tivesse se contradito.", fr: "J’ai été surpris que tu te sois contredit.", de: "Ich war überrascht, dass du dir widersprochen hattest.", it: "Mi ha sorpreso che ti fossi contraddetto.", pl: "Zdziwiło mnie, że sobie zaprzeczyłeś.", tr: "Kendi kendine çelişmene şaşırdım.", id: "Aku terkejut kamu bisa bertentangan dengan dirimu sendiri.", vi: "Tôi ngạc nhiên vì bạn đã tự mâu thuẫn với mình." } }
          - { level: C1, participle: { mapping: [{ term: prever }, { term: previsto }] }, ex: ["No creo que nadie lo ", { target: haya previsto }, "."], tr: { en: "I don't think anyone has foreseen it.", uk: "Не думаю, що хтось це передбачив.", pt: "Não acho que ninguém tenha previsto isso.", fr: "Je ne crois pas que quelqu’un l’ait prévu.", de: "Ich glaube nicht, dass es jemand vorhergesehen hat.", it: "Non credo che nessuno l'abbia previsto.", pl: "Nie sądzę, żeby ktokolwiek to przewidział.", tr: "Kimsenin bunu öngördüğünü sanmıyorum.", id: "Kurasa tidak ada yang memperkirakannya.", vi: "Tôi không nghĩ ai đã lường trước điều đó." } }
      - type: list
        items:
          - type: note
            level: B2
            text:
              es: ["Todos los participios irregulares en una tabla: ", { link: Tabla de verbos irregulares, to: es.pasados.verbos-irregulares }, "."]
              en: ["All irregular participles in one table: ", { link: "Irregular Verbs Table", to: "es.pasados.verbos-irregulares" }, "."]
              uk: ["Усі неправильні дієприкметники в одній таблиці: ", { link: "Таблиця неправильних дієслів", to: "es.pasados.verbos-irregulares" }, "."]
              pt: ["Todos os particípios irregulares numa tabela: ", { link: "Tabela de verbos irregulares", to: "es.pasados.verbos-irregulares" }, "."]
              fr: ["Tous les participes irréguliers dans un tableau : ", { link: "Tableau des verbes irréguliers", to: "es.pasados.verbos-irregulares" }, "."]
              de: ["Alle unregelmäßigen Partizipien in einer Tabelle: ", { link: "Tabelle der unregelmäßigen Verben", to: "es.pasados.verbos-irregulares" }, "."]
              it: ["Tutti i participi irregolari in una tabella: ", { link: "Tabella dei verbi irregolari", to: "es.pasados.verbos-irregulares" }, "."]
              pl: ["Wszystkie imiesłowy nieregularne w jednej tabeli: ", { link: "Tabela czasowników nieregularnych", to: "es.pasados.verbos-irregulares" }, "."]
              tr: ["Bütün düzensiz participio biçimleri tek bir tabloda: ", { link: "Düzensiz fiiller tablosu", to: "es.pasados.verbos-irregulares" }, "."]
              id: ["Semua partisip tidak beraturan dalam satu tabel: ", { link: "Tabel kata kerja tidak beraturan", to: "es.pasados.verbos-irregulares" }, "."]
              vi: ["Tất cả quá khứ phân từ bất quy tắc trong một bảng: ", { link: "Bảng động từ bất quy tắc", to: "es.pasados.verbos-irregulares" }, "."]
          - type: rule
            level: C1
            text:
              es: "Un verbo formado sobre uno irregular mantiene su participio en los dos tiempos."
              en: "A verb built on an irregular one keeps its participle in both tenses."
              uk: "Дієслово, утворене від неправильного, зберігає його дієприкметник в обох часах."
              pt: "Um verbo formado sobre um irregular mantém o seu particípio nos dois tempos."
              fr: "Un verbe formé sur un verbe irrégulier garde son participe aux deux temps."
              de: "Ein von einem unregelmäßigen Verb abgeleitetes Verb behält sein Partizip in beiden Zeiten."
              it: "Un verbo formato su uno irregolare mantiene il suo participio nei due tempi."
              pl: "Czasownik utworzony od nieregularnego zachowuje swój imiesłów w obu czasach."
              tr: "Düzensiz bir fiilden türeyen fiil, her iki zamanda da participio biçimini korur."
              id: "Kata kerja yang dibentuk dari kata kerja tak beraturan mempertahankan partisipnya di kedua tense."
              vi: "Động từ tạo từ một động từ bất quy tắc giữ nguyên quá khứ phân từ ở cả hai thì."

  - title: { es: "Uso: pretérito perfecto", en: "Use: present perfect", uk: "Вживання: перфект", pt: "Uso: pretérito perfeito composto", fr: "Emploi : passé", de: "Gebrauch: Perfekt", it: "Uso: passato", pl: "Użycie: pretérito perfecto", tr: "Kullanım: pretérito perfecto", id: "Penggunaan: pretérito perfecto", vi: "Cách dùng: pretérito perfecto" }
    role: use
