title: { en: "Simple Future: comeré", es: "El futuro simple: comeré", uk: "Простий майбутній час: comeré", pt: "O futuro simples: comeré", fr: "Le futur simple : comeré", de: "Das Futur I: comeré", it: "Il futuro semplice: comeré", pl: "Czas przyszły prosty: comeré", tr: "Basit gelecek zaman: comeré", id: "Masa depan sederhana: comeré", vi: "Thì tương lai đơn: comeré" }
summary:
  lead:
    en: ["The simple future adds ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " to the infinitive for predictions, promises and guesses about now."]
    es: ["El futuro simple añade ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " al infinitivo para predicciones, promesas y suposiciones sobre el presente."]
    uk: ["Простий майбутній час додає до інфінітива ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " для прогнозів, обіцянок і припущень про теперішнє."]
    pt: ["O futuro simples acrescenta ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " ao infinitivo para previsões, promessas e suposições sobre o presente."]
    fr: ["Le futur simple ajoute ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " à l’infinitif pour les prévisions, les promesses et les suppositions sur le présent."]
    de: ["Das Futur I hängt ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " an den Infinitiv, für Vorhersagen, Versprechen und Vermutungen über die Gegenwart."]
    it: ["Il futuro semplice aggiunge ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " all'infinito per previsioni, promesse e supposizioni sul presente."]
    pl: ["Czas przyszły prosty dodaje do bezokolicznika ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " dla przewidywań, obietnic i przypuszczeń o teraźniejszości."]
    tr: ["Basit gelecek zaman, tahmin, söz ve şimdiyle ilgili varsayımlar için mastara ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " ekler."]
    id: ["Masa depan sederhana menambahkan ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " pada infinitif untuk prediksi, janji, dan dugaan tentang saat ini."]
    vi: ["Thì tương lai đơn thêm ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " vào động từ nguyên mẫu cho dự đoán, lời hứa và phỏng đoán về hiện tại."]
  rule:
    en: ["The endings join the whole infinitive, and every form but ", { term: nosotros }, " carries a written accent:"]
    es: ["Las terminaciones se unen al infinitivo completo, y todas las formas menos la de ", { term: nosotros }, " llevan tilde:"]
    uk: ["Закінчення приєднуються до всього інфінітива, і всі форми, крім ", { term: nosotros }, ", мають знак наголосу:"]
    pt: ["As terminações se juntam ao infinitivo inteiro, e todas as formas, menos a de ", { term: nosotros }, ", levam acento gráfico:"]
    fr: ["Les terminaisons s’ajoutent à l’infinitif entier, et toutes les formes sauf ", { term: nosotros }, " portent un accent écrit :"]
    de: ["Die Endungen hängen am ganzen Infinitiv, und alle Formen außer ", { term: nosotros }, " tragen einen Akzent:"]
    it: ["Le desinenze si uniscono all'infinito intero, e tutte le forme tranne ", { term: nosotros }, " portano l'accento scritto:"]
    pl: ["Końcówki dołącza się do całego bezokolicznika, a wszystkie formy poza ", { term: nosotros }, " mają akcent graficzny:"]
    tr: ["Ekler mastarın tamamına eklenir ve ", { term: nosotros }, " dışındaki her biçimde vurgu işareti bulunur:"]
    id: ["Akhiran ditambahkan pada seluruh infinitif, dan semua bentuk kecuali ", { term: nosotros }, " bertanda aksen:"]
    vi: ["Đuôi gắn vào cả động từ nguyên mẫu, mọi dạng trừ ", { term: nosotros }, " có dấu sắc:"]
  ex: { examples: [[{ target: Hablaré }, " con ella."], [{ target: Volveremos }, " pronto."]] }

