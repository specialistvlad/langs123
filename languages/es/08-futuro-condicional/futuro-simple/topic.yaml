            en: ["never the future after ", { term: si }, " in a condition"]
            es: ["nunca futuro detrás del ", { term: si }, " de una condición"]
            uk: ["ніколи не вживають майбутнього часу після ", { term: si }, " в умові"]
            pt: ["nunca o futuro depois de ", { term: si }, " numa condição"]
            fr: ["jamais le futur après ", { term: si }, " dans une condition"]
            de: ["nie das Futur nach ", { term: si }, " in einer Bedingung"]
            it: ["mai il futuro dopo ", { term: si }, " in una condizione"]
            pl: ["nigdy czas przyszły po ", { term: si }, " w warunku"]
            tr: ["koşulda ", { term: si }, " sözcüğünden sonra asla gelecek zaman gelmez"]
            id: ["setelah ", { term: si }, " dalam syarat, bentuk masa depan tidak dipakai"]
            vi: ["không bao giờ dùng thì tương lai sau ", { term: si }, " trong câu điều kiện"]
          ex: ["Si ", { target: tengo }, " tiempo, iré."]
          tr: { en: "If I have time, I'll go.", uk: "Якщо матиму час, піду.", pt: "Se eu tiver tempo, eu vou.", fr: "Si j’ai le temps, j’irai.", de: "Wenn ich Zeit habe, gehe ich.", it: "Se ho tempo, andrò.", pl: "Jeśli będę miał czas, pójdę.", tr: "Vaktim olursa giderim.", id: "Kalau saya punya waktu, saya akan pergi.", vi: "Nếu có thời gian, tôi sẽ đi." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The simple future is one word: the infinitive and an ending."
              es: "El futuro simple es una sola palabra: el infinitivo y una terminación."
              uk: "Простий майбутній час — це одне слово: інфінітив і закінчення."
              pt: "O futuro simples é uma só palavra: o infinitivo e uma terminação."
              fr: "Le futur simple est un seul mot : l’infinitif et une terminaison."
              de: "Das Futur I ist ein einziges Wort: der Infinitiv und eine Endung."
              it: "Il futuro semplice è una sola parola: l'infinito e una desinenza."
              pl: "Czas przyszły prosty to jedno słowo: bezokolicznik i końcówka."
              tr: "Basit gelecek zaman tek bir sözcüktür: mastar ve bir ek."
              id: "Masa depan sederhana adalah satu kata: infinitif dan satu akhiran."
              vi: "Thì tương lai đơn là một từ duy nhất: động từ nguyên mẫu cộng với một đuôi."
          - type: rule
            level: B1
            text:
              en: ["For plans, everyday speech prefers ", { link: Future with Ir a, to: es.futuro-condicional.ir-a-infinitivo }, "."]
              es: ["Para los planes, la lengua de todos los días prefiere ", { link: Ir a con infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, "."]
              uk: ["Для планів у повсякденному мовленні частіше вживають ", { link: Майбутнє з ir a, to: es.futuro-condicional.ir-a-infinitivo }, "."]
              pt: ["Para planos, a língua do dia a dia prefere ", { link: "Futuro com ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              fr: ["Pour les projets, la langue de tous les jours préfère ", { link: "Le futur proche avec ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              de: ["Für Pläne bevorzugt die Alltagssprache ", { link: "Zukunft mit ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              it: ["Per i progetti, la lingua di tutti i giorni preferisce ", { link: "Il futuro con ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              pl: ["Do planów mowa codzienna woli ", { link: "Przyszłość z ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              tr: ["Planlar için günlük konuşma şunu tercih eder: ", { link: "ir a ile gelecek zaman", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              id: ["Untuk rencana, bahasa sehari-hari lebih suka ", { link: "Masa depan dengan ir a", to: es.futuro-condicional.ir-a-infinitivo }, "."]
              vi: ["Với kế hoạch, văn nói hằng ngày thích dùng ", { link: "Tương lai với ir a", to: es.futuro-condicional.ir-a-infinitivo }, " hơn."]
          - type: note
            level: B1
            text:
              en: ["After ", { term: cuando }, ", a future event takes the subjunctive: ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: ["Detrás de ", { term: cuando }, ", un hecho futuro lleva subjuntivo: ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              uk: ["Після ", { term: cuando }, " майбутня подія вимагає суб’юнктива: ", { link: "Суб’юнктив після cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              pt: ["Depois de ", { term: cuando }, ", um fato futuro leva o subjuntivo: ", { link: "O subjuntivo com cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              fr: ["Après ", { term: cuando }, ", un fait à venir se met au subjonctif : ", { link: "Le subjonctif avec cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              de: ["Nach ", { term: cuando }, " steht für ein zukünftiges Ereignis der Konjunktiv: ", { link: "Der Konjunktiv nach cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              it: ["Dopo ", { term: cuando }, ", un fatto futuro richiede il congiuntivo: ", { link: "Il congiuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              pl: ["Po ", { term: cuando }, " przyszłe zdarzenie wymaga trybu łączącego: ", { link: "Tryb łączący z cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              tr: ["Gelecekteki bir olay ", { term: cuando }, " sözcüğünden sonra dilek kipi alır: ", { link: "cuando, para que, antes de que ile dilek kipi", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              id: ["Setelah ", { term: cuando }, ", peristiwa di masa depan memakai subjuntif: ", { link: "Subjungtif dengan cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              vi: ["Sau ", { term: cuando }, ", một sự việc trong tương lai dùng thức giả định: ", { link: "Thức giả định với cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Українська має дві форми майбутнього: ", { l1: "буду читати" }, " і ", { l1: "читатиму" }, "; обидві відповідають ", { term: "leeré" }, ". Доконаний вид («прочитаю») теж перекладають майбутнім: ", { term: "lo leeré" }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
    role: form
    features: { tense: fut }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа, pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, ar: ["hablar", { ending: é }], er: ["comer", { ending: é }], ir: ["vivir", { ending: é }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["hablar", { ending: ás }], er: ["comer", { ending: ás }], ir: ["vivir", { ending: ás }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["hablar", { ending: á }], er: ["comer", { ending: á }], ir: ["vivir", { ending: á }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["hablar", { ending: emos }], er: ["comer", { ending: emos }], ir: ["vivir", { ending: emos }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["hablar", { ending: éis }], er: ["comer", { ending: éis }], ir: ["vivir", { ending: éis }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["hablar", { ending: án }], er: ["comer", { ending: án }], ir: ["vivir", { ending: án }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: "-ar" }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " share the same endings."]
              es: ["Los verbos en ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " comparten las terminaciones."]
              uk: ["Дієслова на ", { term: "-ar" }, ", ", { term: "-er" }, " та ", { term: "-ir" }, " мають однакові закінчення."]
              pt: ["Os verbos em ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " têm as mesmas terminações."]
              fr: ["Les verbes en ", { term: "-ar" }, ", ", { term: "-er" }, " et ", { term: "-ir" }, " ont les mêmes terminaisons."]
              de: ["Verben auf ", { term: "-ar" }, ", ", { term: "-er" }, " und ", { term: "-ir" }, " haben dieselben Endungen."]
              it: ["I verbi in ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " hanno le stesse desinenze."]
              pl: ["Czasowniki na ", { term: "-ar" }, ", ", { term: "-er" }, " i ", { term: "-ir" }, " mają te same końcówki."]
              tr: [{ term: "-ar" }, ", ", { term: "-er" }, " ve ", { term: "-ir" }, " ile biten fiillerin ekleri aynıdır."]
              id: ["Kata kerja berakhiran ", { term: "-ar" }, ", ", { term: "-er" }, ", dan ", { term: "-ir" }, " memakai akhiran yang sama."]
              vi: ["Động từ tận cùng bằng ", { term: "-ar" }, ", ", { term: "-er" }, " và ", { term: "-ir" }, " có cùng đuôi."]
          - type: rule
            level: B1
            text:
              en: ["Every form but ", { term: nosotros }, " carries a written accent on the ending:"]
              es: ["Todas las formas menos la de ", { term: nosotros }, " llevan tilde en la terminación:"]
              uk: ["Усі форми, крім ", { term: nosotros }, ", мають знак наголосу на закінченні:"]
              pt: ["Todas as formas, menos a de ", { term: nosotros }, ", levam acento gráfico na terminação:"]
              fr: ["Toutes les formes sauf celle de ", { term: nosotros }, " portent un accent écrit sur la terminaison :"]
              de: ["Alle Formen außer ", { term: nosotros }, " tragen einen Akzent auf der Endung:"]
              it: ["Tutte le forme tranne ", { term: nosotros }, " portano l'accento scritto sulla desinenza:"]
              pl: ["Wszystkie formy poza ", { term: nosotros }, " mają akcent graficzny na końcówce:"]
              tr: [{ term: nosotros }, " dışındaki her biçimde ekin üzerinde vurgu işareti bulunur:"]
              id: ["Semua bentuk kecuali ", { term: nosotros }, " bertanda aksen pada akhiran:"]
              vi: ["Mọi dạng trừ ", { term: nosotros }, " đều có dấu sắc trên đuôi:"]
            ex: ["Mis padres ", { target: llegarán }, " el lunes."]
            tr: { en: My parents will arrive on Monday., uk: "Мої батьки приїдуть у понеділок.", pt: "Meus pais chegarão na segunda-feira.", fr: "Mes parents arriveront lundi.", de: "Meine Eltern kommen am Montag an.", it: "I miei genitori arriveranno lunedì.", pl: "Moi rodzice przyjadą w poniedziałek.", tr: "Annemle babam pazartesi gelecek.", id: "Orang tua saya akan tiba hari Senin.", vi: "Bố mẹ tôi sẽ đến vào thứ Hai." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares", uk: "Форма: неправильні дієслова", pt: "Forma: verbos irregulares", fr: "Forme : verbes irréguliers", de: "Form: unregelmäßige Verben", it: "Forma: verbi irregolari", pl: "Forma: czasowniki nieregularne", tr: "Biçim: düzensiz fiiller", id: "Bentuk: kata kerja tak beraturan", vi: "Dạng: động từ bất quy tắc" }
    role: form
    features: { tense: fut }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: stem, label: { en: Stem, es: Raíz, uk: Основа, pt: "Radical", fr: "Radical", de: "Stamm", it: "Radice", pl: "Temat", tr: "Gövde", id: "Akar kata", vi: "Gốc động từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: tener, stem: "tendr-", ex: ["El lunes ", { target: tendré }, " más tiempo."], tr: { en: "I'll have more time on Monday.", uk: "У понеділок я матиму більше часу.", pt: "Na segunda-feira terei mais tempo.", fr: "Lundi, j’aurai plus de temps.", de: "Am Montag habe ich mehr Zeit.", it: "Lunedì avrò più tempo.", pl: "W poniedziałek będę miał więcej czasu.", tr: "Pazartesi daha çok vaktim olacak.", id: "Hari Senin saya akan punya lebih banyak waktu.", vi: "Thứ Hai tôi sẽ có nhiều thời gian hơn." } }
          - { level: B1, verb: poner, stem: "pondr-", ex: ["¿Dónde ", { target: pondrás }, " el sofá?"], tr: { en: Where will you put the sofa?, uk: "Куди ти поставиш диван?", pt: "Onde você vai colocar o sofá?", fr: "Où mettras-tu le canapé ?", de: "Wohin stellst du das Sofa?", it: "Dove metterai il divano?", pl: "Gdzie postawisz kanapę?", tr: "Kanepeyi nereye koyacaksın?", id: "Di mana kamu akan menaruh sofa?", vi: "Bạn sẽ đặt ghế sofa ở đâu?" } }
          - { level: B1, verb: salir, stem: "saldr-", ex: ["El avión ", { target: saldrá }, " a las diez."], tr: { en: The plane will leave at ten., uk: "Літак вилетить о десятій.", pt: "O avião sairá às dez.", fr: "L’avion partira à dix heures.", de: "Das Flugzeug startet um zehn Uhr.", it: "L'aereo partirà alle dieci.", pl: "Samolot odleci o dziesiątej.", tr: "Uçak saat onda kalkacak.", id: "Pesawat akan berangkat pukul sepuluh.", vi: "Máy bay sẽ cất cánh lúc mười giờ." } }
          - { level: B1, verb: venir, stem: "vendr-", ex: ["Mis abuelos ", { target: vendrán }, " en junio."], tr: { en: My grandparents will come in June., uk: "Мої дідусь і бабуся приїдуть у червні.", pt: "Meus avós virão em junho.", fr: "Mes grands-parents viendront en juin.", de: "Meine Großeltern kommen im Juni.", it: "I miei nonni verranno a giugno.", pl: "Moi dziadkowie przyjadą w czerwcu.", tr: "Büyükanne ve büyükbabam haziranda gelecek.", id: "Kakek dan nenek saya akan datang pada bulan Juni.", vi: "Ông bà tôi sẽ đến vào tháng Sáu." } }
          - { level: B1, verb: poder, stem: "podr-", ex: ["No ", { target: podremos }, " ir."], tr: { en: "We won't be able to go.", uk: "Ми не зможемо піти.", pt: "Não poderemos ir.", fr: "Nous ne pourrons pas y aller.", de: "Wir werden nicht gehen können.", it: "Non potremo andare.", pl: "Nie będziemy mogli iść.", tr: "Gidemeyeceğiz.", id: "Kami tidak akan bisa pergi.", vi: "Chúng tôi sẽ không thể đi." } }
          - { level: B1, verb: saber, stem: "sabr-", ex: ["Mañana ", { target: sabremos }, " el resultado."], tr: { en: "We'll know the result tomorrow.", uk: "Завтра ми дізнаємося результат.", pt: "Amanhã saberemos o resultado.", fr: "Demain, nous connaîtrons le résultat.", de: "Morgen wissen wir das Ergebnis.", it: "Domani sapremo il risultato.", pl: "Jutro poznamy wynik.", tr: "Sonucu yarın öğreneceğiz.", id: "Besok kami akan tahu hasilnya.", vi: "Ngày mai chúng ta sẽ biết kết quả." } }
          - { level: B1, verb: querer, stem: "querr-", ex: ["Nadie ", { target: querrá }, " venir."], tr: { en: Nobody will want to come., uk: "Ніхто не захоче прийти.", pt: "Ninguém vai querer vir.", fr: "Personne ne voudra venir.", de: "Niemand wird kommen wollen.", it: "Nessuno vorrà venire.", pl: "Nikt nie będzie chciał przyjść.", tr: "Kimse gelmek istemeyecek.", id: "Tidak ada yang akan mau datang.", vi: "Sẽ không ai muốn đến." } }
          - { level: B1, verb: hacer, stem: "har-", ex: ["¿Qué ", { target: harás }, " este verano?"], tr: { en: What will you do this summer?, uk: "Що ти робитимеш цього літа?", pt: "O que você fará neste verão?", fr: "Que feras-tu cet été ?", de: "Was machst du diesen Sommer?", it: "Che cosa farai quest'estate?", pl: "Co będziesz robić tego lata?", tr: "Bu yaz ne yapacaksın?", id: "Apa yang akan kamu lakukan musim panas ini?", vi: "Mùa hè này bạn sẽ làm gì?" } }
          - { level: B1, verb: decir, stem: "dir-", ex: ["¿Qué ", { target: dirá }, " tu madre?"], tr: { en: What will your mother say?, uk: "Що скаже твоя мама?", pt: "O que sua mãe dirá?", fr: "Que dira ta mère ?", de: "Was wird deine Mutter sagen?", it: "Che cosa dirà tua madre?", pl: "Co powie twoja mama?", tr: "Annen ne diyecek?", id: "Apa yang akan dikatakan ibumu?", vi: "Mẹ bạn sẽ nói gì?" } }
          - { level: B1, verb: haber, stem: "habr-", ex: [{ target: Habrá }, " una fiesta."], tr: { en: There will be a party., uk: "Буде вечірка.", pt: "Haverá uma festa.", fr: "Il y aura une fête.", de: "Es wird eine Party geben.", it: "Ci sarà una festa.", pl: "Będzie impreza.", tr: "Bir parti olacak.", id: "Akan ada pesta.", vi: "Sẽ có một bữa tiệc." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "An irregular stem takes the regular endings, in every person."
              es: "Una raíz irregular lleva las terminaciones regulares, en todas las personas."
              uk: "Неправильна основа бере правильні закінчення в усіх особах."
              pt: "Um radical irregular recebe as terminações regulares, em todas as pessoas."
              fr: "Un radical irrégulier prend les terminaisons régulières, à toutes les personnes."
              de: "Ein unregelmäßiger Stamm nimmt die regelmäßigen Endungen, in allen Personen."
              it: "Una radice irregolare prende le desinenze regolari, in tutte le persone."
              pl: "Temat nieregularny przyjmuje regularne końcówki, w każdej osobie."
              tr: "Düzensiz bir gövde, her kişide düzenli ekleri alır."
              id: "Akar kata tak beraturan memakai akhiran beraturan, pada semua orang."
              vi: "Gốc bất quy tắc nhận các đuôi có quy tắc, ở mọi ngôi."
          - type: rule
            level: B1
            text:
              en: ["A verb built on an irregular one keeps its stem: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              es: ["Un verbo formado sobre uno irregular mantiene su raíz: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              uk: ["Дієслово, утворене від неправильного, зберігає його основу: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              pt: ["Um verbo formado a partir de um irregular mantém o seu radical: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              fr: ["Un verbe formé sur un verbe irrégulier garde son radical : ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
