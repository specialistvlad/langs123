# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.futuro-condicional.futuro-simple
lang: es
kind: grammar
tags: [verbs, future, tenses]
concepts: [future]
related: [es.futuro-condicional.ir-a-infinitivo, es.futuro-condicional.condicional-simple, es.oracion.condicionales, es.subjuntivo.subjuntivo-cuando-para-que, es.pasados.verbos-irregulares]
status: { en: draft, es: draft, uk: draft }
translated: { en: "66f6ea d2052d 1f4157 4543f4 53395f eae6b7 b8b211 ab7272 0db4cf", uk: "66f6ea d2052d 1f4157 4543f4 53395f eae6b7 b8b211 ab7272 0db4cf" }

title: { en: "Simple Future: comeré", es: "El futuro simple: comeré", uk: "Простий майбутній час: comeré" }
summary:
  lead:
    en: ["The simple future adds ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " to the infinitive for predictions, promises and guesses about now."]
    es: ["El futuro simple añade ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " al infinitivo para predicciones, promesas y suposiciones sobre el presente."]
    uk: ["Простий майбутній час додає до інфінітива ", { alternatives: [{ term: "-é" }, { term: "-ás" }, { term: "-á" }, { term: "-emos" }, { term: "-án" }] }, " для прогнозів, обіцянок і припущень про теперішнє."]
  rule:
    en: ["The endings join the whole infinitive, and every form but ", { term: nosotros }, " carries a written accent:"]
    es: ["Las terminaciones se unen al infinitivo completo, y todas las formas menos la de ", { term: nosotros }, " llevan tilde:"]
    uk: ["Закінчення приєднуються до всього інфінітива, і всі форми, крім ", { term: nosotros }, ", мають графічний наголос:"]
  ex: { examples: [[{ target: Hablaré }, " con ella."], [{ target: Volveremos }, " pronto."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: B1
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: hablar }, ": ", { alternatives: [{ term: hablaré }, { term: hablarás }, { term: hablará }, { term: hablaremos }, { term: hablarán }] }]
            es: [{ term: hablar }, ": ", { alternatives: [{ term: hablaré }, { term: hablarás }, { term: hablará }, { term: hablaremos }, { term: hablarán }] }]
            uk: [{ term: hablar }, ": ", { alternatives: [{ term: hablaré }, { term: hablarás }, { term: hablará }, { term: hablaremos }, { term: hablarán }] }]
          ex: ["Mañana te ", { target: llamaré }, "."]
          tr: { en: "I'll call you tomorrow.", uk: "Я подзвоню тобі завтра." }
        - level: B1
          variety: es-ES
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: vosotros }, ": ", { alternatives: [{ term: hablaréis }, { term: comeréis }, { term: viviréis }] }]
            es: [{ term: vosotros }, ": ", { alternatives: [{ term: hablaréis }, { term: comeréis }, { term: viviréis }] }]
            uk: [{ term: vosotros }, ": ", { alternatives: [{ term: hablaréis }, { term: comeréis }, { term: viviréis }] }]
          ex: ["¿", { target: Vendréis }, " a la boda?"]
          tr: { en: Will you come to the wedding?, uk: "Ви прийдете на весілля?" }
        - level: B1
          point: { en: Irregular stems, es: Raíces irregulares, uk: Неправильні основи }
          rule:
            en: { alternatives: [{ term: tendré }, { term: pondré }, { term: saldré }, { term: vendré }, { term: podré }] }
            es: { alternatives: [{ term: tendré }, { term: pondré }, { term: saldré }, { term: vendré }, { term: podré }] }
            uk: { alternatives: [{ term: tendré }, { term: pondré }, { term: saldré }, { term: vendré }, { term: podré }] }
          ex: ["No ", { target: podré }, " ir."]
          tr: { en: "I won't be able to go.", uk: "Я не зможу піти." }
        - level: B1
          point: { en: Irregular stems, es: Raíces irregulares, uk: Неправильні основи }
          rule:
            en: { alternatives: [{ term: haré }, { term: diré }, { term: querré }, { term: sabré }, { term: habrá }] }
            es: { alternatives: [{ term: haré }, { term: diré }, { term: querré }, { term: sabré }, { term: habrá }] }
            uk: { alternatives: [{ term: haré }, { term: diré }, { term: querré }, { term: sabré }, { term: habrá }] }
          ex: ["Lo ", { target: haré }, " mañana."]
          tr: { en: "I'll do it tomorrow.", uk: "Я зроблю це завтра." }
        - level: B1
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "a prediction"
            es: "una predicción"
            uk: "прогноз"
          ex: ["Mañana ", { target: lloverá }, " en el norte."]
          tr: { en: It will rain in the north tomorrow., uk: "Завтра на півночі буде дощ." }
        - level: B1
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "a promise"
            es: "una promesa"
            uk: "обіцянка"
          ex: ["No se lo ", { target: diré }, " a nadie."]
          tr: { en: "I won't tell anyone.", uk: "Я нікому не скажу." }
        - level: B1
          point: { en: Use, es: Uso, uk: Ужиток }
          rule:
            en: "a guess about now"
            es: "una suposición sobre el presente"
            uk: "припущення про теперішнє"
          ex: ["¿Dónde está Ana? ", { target: Estará }, " en casa."]
          tr: { en: "Where's Ana? She's probably at home.", uk: "Де Ана? Мабуть, удома." }
        - level: B1
          point: { en: Condition, es: Condición, uk: Умова }
          rule:
            en: [{ term: si }, " with the present, then the future"]
            es: [{ term: si }, " con presente, y después el futuro"]
            uk: [{ term: si }, " з теперішнім часом, а далі — майбутній"]
          ex: ["Si llueve, ", { target: nos quedaremos }, " en casa."]
          tr: { en: "If it rains, we'll stay at home.", uk: "Якщо піде дощ, ми залишимося вдома." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: [{ term: habrá }, " stays singular"]
            es: [{ term: habrá }, " va siempre en singular"]
            uk: [{ term: habrá }, " завжди в однині"]
          ex: ["Mañana ", { target: habrá }, " mucha gente."]
          tr: { en: There will be a lot of people tomorrow., uk: "Завтра буде багато людей." }
        - level: B1
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["never the future after ", { term: si }, " in a condition"]
            es: ["nunca futuro detrás del ", { term: si }, " de una condición"]
            uk: ["ніколи не вживають майбутнього часу після ", { term: si }, " в умові"]
          ex: ["Si ", { target: tengo }, " tiempo, iré."]
          tr: { en: "If I have time, I'll go.", uk: "Якщо матиму час, піду." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The simple future is one word: the infinitive and an ending."
              es: "El futuro simple es una sola palabra: el infinitivo y una terminación."
              uk: "Простий майбутній час — це одне слово: інфінітив і закінчення."
          - type: rule
            level: B1
            text:
              en: ["For plans, everyday speech prefers ", { link: Future with Ir a, to: es.futuro-condicional.ir-a-infinitivo }, "."]
              es: ["Para los planes, la lengua de todos los días prefiere ", { link: Ir a con infinitivo, to: es.futuro-condicional.ir-a-infinitivo }, "."]
              uk: ["Для планів у повсякденному мовленні частіше вживають ", { link: Майбутнє з ir a, to: es.futuro-condicional.ir-a-infinitivo }, "."]
          - type: note
            level: B1
            text:
              en: ["After ", { term: cuando }, ", a future event takes the subjunctive: ", { link: "Subjunctive after cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              es: ["Detrás de ", { term: cuando }, ", un hecho futuro lleva subjuntivo: ", { link: "El subjuntivo con cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]
              uk: ["Після ", { term: cuando }, " майбутня подія вимагає суб’юнктива: ", { link: "Суб’юнктив після cuando, para que, antes de que", to: es.subjuntivo.subjuntivo-cuando-para-que }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова" }
    role: form
    features: { tense: fut }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, ar: ["hablar", { ending: é }], er: ["comer", { ending: é }], ir: ["vivir", { ending: é }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["hablar", { ending: ás }], er: ["comer", { ending: ás }], ir: ["vivir", { ending: ás }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["hablar", { ending: á }], er: ["comer", { ending: á }], ir: ["vivir", { ending: á }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["hablar", { ending: emos }], er: ["comer", { ending: emos }], ir: ["vivir", { ending: emos }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["hablar", { ending: éis }], er: ["comer", { ending: éis }], ir: ["vivir", { ending: éis }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["hablar", { ending: án }], er: ["comer", { ending: án }], ir: ["vivir", { ending: án }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: "-ar" }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " share the same endings."]
              es: ["Los verbos en ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " comparten las terminaciones."]
              uk: ["Дієслова на ", { term: "-ar" }, ", ", { term: "-er" }, " та ", { term: "-ir" }, " мають однакові закінчення."]
          - type: rule
            level: B1
            text:
              en: ["Every form but ", { term: nosotros }, " carries a written accent on the ending:"]
              es: ["Todas las formas menos la de ", { term: nosotros }, " llevan tilde en la terminación:"]
              uk: ["Усі форми, крім ", { term: nosotros }, ", мають графічний наголос на закінченні:"]
            ex: ["Mis padres ", { target: llegarán }, " el lunes."]
            tr: { en: My parents will arrive on Monday., uk: "Мої батьки приїдуть у понеділок." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares", uk: "Форма: неправильні дієслова" }
    role: form
    features: { tense: fut }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово } }
          - { key: stem, label: { en: Stem, es: Raíz, uk: Основа } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, verb: tener, stem: "tendr-", ex: ["El lunes ", { target: tendré }, " más tiempo."], tr: { en: "I'll have more time on Monday.", uk: "У понеділок я матиму більше часу." } }
          - { level: B1, verb: poner, stem: "pondr-", ex: ["¿Dónde ", { target: pondrás }, " el sofá?"], tr: { en: Where will you put the sofa?, uk: "Куди ти поставиш диван?" } }
          - { level: B1, verb: salir, stem: "saldr-", ex: ["El avión ", { target: saldrá }, " a las diez."], tr: { en: The plane will leave at ten., uk: "Літак вилетить о десятій." } }
          - { level: B1, verb: venir, stem: "vendr-", ex: ["Mis abuelos ", { target: vendrán }, " en junio."], tr: { en: My grandparents will come in June., uk: "Мої дідусь і бабуся приїдуть у червні." } }
          - { level: B1, verb: poder, stem: "podr-", ex: ["No ", { target: podremos }, " ir."], tr: { en: "We won't be able to go.", uk: "Ми не зможемо піти." } }
          - { level: B1, verb: saber, stem: "sabr-", ex: ["Mañana ", { target: sabremos }, " el resultado."], tr: { en: "We'll know the result tomorrow.", uk: "Завтра ми дізнаємося результат." } }
          - { level: B1, verb: querer, stem: "querr-", ex: ["Nadie ", { target: querrá }, " venir."], tr: { en: Nobody will want to come., uk: "Ніхто не захоче прийти." } }
          - { level: B1, verb: hacer, stem: "har-", ex: ["¿Qué ", { target: harás }, " este verano?"], tr: { en: What will you do this summer?, uk: "Що ти робитимеш цього літа?" } }
          - { level: B1, verb: decir, stem: "dir-", ex: ["¿Qué ", { target: dirá }, " tu madre?"], tr: { en: What will your mother say?, uk: "Що скаже твоя мама?" } }
          - { level: B1, verb: haber, stem: "habr-", ex: [{ target: Habrá }, " una fiesta."], tr: { en: There will be a party., uk: "Буде вечірка." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "An irregular stem takes the regular endings, in every person."
              es: "Una raíz irregular lleva las terminaciones regulares, en todas las personas."
              uk: "Неправильна основа бере правильні закінчення в усіх особах."
          - type: rule
            level: B1
            text:
              en: ["A verb built on an irregular one keeps its stem: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              es: ["Un verbo formado sobre uno irregular mantiene su raíz: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]
              uk: ["Дієслово, утворене від неправильного, зберігає його основу: ", { mapping: [{ term: proponer }, { term: propondré }] }, ", ", { mapping: [{ term: deshacer }, { term: desharé }] }, "."]

  - title: { en: Use, es: Uso, uk: Ужиток }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: Ужиток } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: B1, use: { en: A prediction, es: Una predicción, uk: Прогноз }, ex: ["Mañana ", { target: lloverá }, "."], tr: { en: It will rain tomorrow., uk: "Завтра буде дощ." } }
          - { level: B1, use: { en: A promise, es: Una promesa, uk: Обіцянка }, ex: ["Te ", { target: llamaré }, " esta noche."], tr: { en: "I'll call you tonight.", uk: "Я подзвоню тобі сьогодні ввечері." } }
          - { level: B1, use: { en: An announcement, es: Un anuncio, uk: Оголошення }, ex: ["El presidente ", { target: viajará }, " a Chile la próxima semana."], tr: { en: The president will travel to Chile next week., uk: "Наступного тижня президент поїде до Чилі." } }
          - { level: B1, use: { en: A guess about the time, es: Una suposición sobre la hora, uk: Припущення щодо часу }, ex: [{ target: Serán }, " las ocho."], tr: { en: "It must be about eight.", uk: "Мабуть, уже близько восьмої." } }
          - { level: B1, use: { en: A guess about a person, es: Una suposición sobre una persona, uk: Припущення щодо людини }, ex: ["Ana no contesta: ", { target: estará }, " ocupada."], tr: { en: "Ana isn't answering: she must be busy.", uk: "Ана не відповідає: мабуть, зайнята." } }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A guess about the present takes the future of the verb that would fit now:"
              es: "Una suposición sobre el presente lleva el futuro del verbo que se usaría ahora:"
              uk: "Припущення про теперішнє вживає майбутній час того дієслова, яке підійшло б зараз:"
            ex: { exchange: ["¿Cuántos años tiene?", ["No sé, ", { target: tendrá }, " treinta."]] }
            tr: { en: { exchange: [How old is he?, "I don't know, he must be about thirty."] }, uk: { exchange: ["Скільки йому років?", "Не знаю, мабуть, близько тридцяти."] } }

  - title: { en: The future in conditions, es: El futuro en las condiciones, uk: Майбутній час в умовах }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["In a condition, ", { term: si }, " takes the present; the future goes in the result:"]
              es: ["En una condición, detrás de ", { term: si }, " va el presente; el futuro va en el resultado:"]
              uk: ["В умові після ", { term: si }, " стоїть теперішній час, а майбутній — у наслідку:"]
            ex: ["Si estudias, ", { target: aprobarás }, "."]
            tr: { en: "If you study, you'll pass.", uk: "Якщо вчитимешся, складеш іспит." }
          - type: note
            level: B1
            text:
              en: ["More on conditions: ", { link: Conditional Sentences, to: es.oracion.condicionales }, "."]
              es: ["Más sobre las condiciones: ", { link: Oraciones condicionales, to: es.oracion.condicionales }, "."]
              uk: ["Більше про умови: ", { link: Умовні речення, to: es.oracion.condicionales }, "."]

  - title: { en: "Compare: the simple future and ir a", es: "Comparación: el futuro simple e ir a", uk: "Порівняння: простий майбутній час та ir a" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: future, label: { en: Simple future, es: Futuro simple, uk: Простий майбутній час } }
          - { key: ira, label: { en: Ir a with an infinitive, es: Ir a con infinitivo, uk: Ir a з інфінітивом } }
        rows:
          - { level: B1, future: { en: "predictions, promises, guesses; more formal", es: "predicciones, promesas, suposiciones; más formal", uk: "прогнози, обіцянки, припущення; більш офіційно" }, ira: { en: plans and intentions; everyday speech, es: planes e intenciones; la lengua de todos los días, uk: плани й наміри; повсякденне мовлення } }
          - level: B1
            future: { ex: [{ target: Viajaré }, " a México."], tr: { en: "I'll travel to Mexico.", uk: "Я поїду до Мексики." } }
            ira: { ex: [{ target: Voy a viajar }, " a México."], tr: { en: "I'm going to travel to Mexico.", uk: "Я збираюся поїхати до Мексики." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: Lo haceré mañana., right: ["Lo ", { target: haré }, " mañana."], rule: { en: [{ term: hacer }, " has the stem ", { term: "har-" }], es: [{ term: hacer }, " tiene la raíz ", { term: "har-" }], uk: [{ term: hacer }, " має основу ", { term: "har-" }] } }
          - { level: B1, wrong: Tenré más tiempo., right: [{ target: Tendré }, " más tiempo."], rule: { en: [{ term: tener }, " has the stem ", { term: "tendr-" }], es: [{ term: tener }, " tiene la raíz ", { term: "tendr-" }], uk: [{ term: tener }, " має основу ", { term: "tendr-" }] } }
          - { level: B1, wrong: Mañana habrán muchas personas., right: ["Mañana ", { target: habrá }, " muchas personas."], rule: { en: [{ term: habrá }, " never takes a plural"], es: [{ term: habrá }, " nunca va en plural"], uk: [{ term: habrá }, " ніколи не буває в множині"] } }
          - { level: B1, wrong: "Si tendré tiempo, iré.", right: ["Si ", { target: tengo }, " tiempo, iré."], rule: { en: ["a condition with ", { term: si }, " takes the present"], es: ["la condición con ", { term: si }, " lleva el presente"], uk: ["умова з ", { term: si }, " вимагає теперішнього часу"] } }
          - { level: B1, wrong: Hablare con ella., right: [{ target: Hablaré }, " con ella."], rule: { en: "the ending carries a written accent", es: "la terminación lleva tilde", uk: "закінчення має графічний наголос" } }
