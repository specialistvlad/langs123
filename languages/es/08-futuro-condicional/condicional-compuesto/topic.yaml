              de: ["Pronomen und ", { term: no }, " stehen vor ", { term: habría }, ", und zwischen ", { term: habría }, " und dem Partizip steht nichts:"]
              it: ["I pronomi e ", { term: no }, " vanno prima di ", { term: habría }, ", e niente si mette tra ", { term: habría }, " e il participio:"]
              pl: ["Zaimki i ", { term: no }, " stoją przed ", { term: habría }, ", a między ", { term: habría }, " a imiesłowem nic nie stoi:"]
              tr: ["Zamirler ve ", { term: no }, " ", { term: habría }, " sözcüğünden önce gelir; ", { term: habría }, " ile participio arasına hiçbir şey girmez:"]
              id: ["Pronomina dan ", { term: no }, " berada di depan ", { term: habría }, ", dan tidak ada kata di antara ", { term: habría }, " dan partisip:"]
              vi: ["Đại từ và ", { term: no }, " đứng trước ", { term: habría }, ", và không có gì chen vào giữa ", { term: habría }, " và quá khứ phân từ:"]
            ex: { examples: [["Yo no ", { target: se lo habría dicho }, "."], ["¿", { target: Te habría gustado }, " venir?"]] }
            tr: { en: { examples: ["I wouldn't have told him.", "Would you have liked to come?"] }, uk: { examples: ["Я б йому цього не сказав.", "Тобі хотілося б прийти?"] }, pt: { examples: ["Eu não teria dito isso a ele.", "Você teria gostado de vir?"] }, fr: { examples: ["Je ne le lui aurais pas dit.", "Aurais-tu aimé venir ?"] }, de: { examples: ["Ich hätte es ihm nicht gesagt.", "Wärst du gern gekommen?"] }, it: { examples: ["Io non glielo avrei detto.", "Ti sarebbe piaciuto venire?"] }, pl: { examples: ["Ja bym mu tego nie powiedział.", "Czy miałbyś ochotę przyjść?"] }, tr: { examples: ["Ben ona söylemezdim.", "Gelmek ister miydin?"] }, id: { examples: ["Saya tidak akan mengatakannya kepadanya.", "Apakah kamu ingin datang?"] }, vi: { examples: ["Tôi sẽ không nói điều đó với anh ấy.", "Bạn có muốn đến không?"] } }

  - title: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { es: Uso, en: "Use", uk: "Вживання", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            use: { es: "El resultado de una condición irreal del pasado", en: "The result of an unreal condition in the past", uk: "Наслідок нереальної умови в минулому", pt: "O resultado de uma condição irreal do passado", fr: "Le résultat d’une condition irréelle du passé", de: "Das Ergebnis einer irrealen Bedingung der Vergangenheit", it: "Il risultato di una condizione irreale del passato", pl: "Skutek nierzeczywistego warunku w przeszłości", tr: "Geçmişteki gerçek dışı bir koşulun sonucu", id: "Hasil dari syarat tidak nyata di masa lampau", vi: "Kết quả của một điều kiện không có thật trong quá khứ" }
            ex: { examples: [["Si hubiera podido, ", { target: habría ido }, "."], ["Si no hubiera llovido, ", { target: habríamos salido }, " al campo."]] }
            tr: { en: { examples: ["If I had been able to, I would have gone.", "If it hadn't rained, we would have gone out to the countryside."] }, uk: { examples: ["Якби я зміг, я пішов би.", "Якби не було дощу, ми поїхали б за місто."] }, pt: { examples: ["Se eu tivesse podido, teria ido.", "Se não tivesse chovido, teríamos saído para o campo."] }, fr: { examples: ["Si j’avais pu, j’y serais allé.", "S’il n’avait pas plu, nous serions allés à la campagne."] }, de: { examples: ["Wenn ich gekonnt hätte, wäre ich gegangen.", "Wenn es nicht geregnet hätte, wären wir aufs Land gefahren."] }, it: { examples: ["Se avessi potuto, sarei andato.", "Se non avesse piovuto, saremmo usciti in campagna."] }, pl: { examples: ["Gdybym mógł, poszedłbym.", "Gdyby nie padało, wyjechalibyśmy na wieś."] }, tr: { examples: ["Mümkün olsaydı giderdim.", "Yağmur yağmasaydı kıra çıkardık."] }, id: { examples: ["Seandainya saya bisa, saya pasti sudah pergi.", "Seandainya tidak hujan, kami sudah pergi ke pedesaan."] }, vi: { examples: ["Nếu có thể, tôi đã đi rồi.", "Nếu trời không mưa, chúng tôi đã ra ngoại ô rồi."] } }
          - level: B2
            use: { es: "Un deseo o una sugerencia sobre el pasado, sin la condición", en: "A wish or a suggestion about the past, without the condition", uk: "Бажання чи пропозиція щодо минулого без умови", pt: "Um desejo ou uma sugestão sobre o passado, sem a condição", fr: "Un souhait ou une suggestion sur le passé, sans la condition", de: "Ein Wunsch oder ein Vorschlag zur Vergangenheit, ohne die Bedingung", it: "Un desiderio o un suggerimento sul passato, senza la condizione", pl: "Życzenie lub sugestia dotycząca przeszłości, bez warunku", tr: "Koşul belirtilmeden geçmişle ilgili bir istek ya da öneri", id: "Keinginan atau saran tentang masa lampau, tanpa syarat", vi: "Một mong muốn hay đề nghị về quá khứ, không nêu điều kiện" }
            ex: { examples: [["Con ese calor, me ", { target: habría tomado }, " un helado."], ["Yo ", { target: habría llamado }, " al médico antes."]] }
            tr: { en: { examples: ["In that heat, I would have had an ice cream.", "I would have called the doctor earlier."] }, uk: { examples: ["У таку спеку я б з’їв морозива.", "Я б раніше викликав лікаря."] }, pt: { examples: ["Com esse calor, eu teria tomado um sorvete.", "Eu teria chamado o médico antes."] }, fr: { examples: ["Avec cette chaleur, je me serais pris une glace.", "J’aurais appelé le médecin plus tôt."] }, de: { examples: ["Bei dieser Hitze hätte ich ein Eis gegessen.", "Ich hätte früher den Arzt gerufen."] }, it: { examples: ["Con questo caldo, mi sarei preso un gelato.", "Io avrei chiamato il medico prima."] }, pl: { examples: ["Przy takim upale zjadłbym lody.", "Ja wezwałbym lekarza wcześniej."] }, tr: { examples: ["Bu sıcakta bir dondurma yerdim.", "Ben doktoru daha önce çağırırdım."] }, id: { examples: ["Dengan panas seperti itu, saya pasti sudah makan es krim.", "Saya akan memanggil dokter lebih awal."] }, vi: { examples: ["Nóng thế này, tôi đã ăn một cây kem rồi.", "Tôi đã gọi bác sĩ sớm hơn."] } }
          - level: B2
            use: { es: "Un reproche por lo que no se hizo", en: "A reproach for what was not done", uk: "Докір за те, що не зроблено", pt: "Uma reprovação pelo que não se fez", fr: "Un reproche pour ce qui n’a pas été fait", de: "Ein Vorwurf wegen dessen, was nicht getan wurde", it: "Un rimprovero per ciò che non è stato fatto", pl: "Wyrzut z powodu tego, czego nie zrobiono", tr: "Yapılmayan bir şey için sitem", id: "Teguran atas apa yang tidak dilakukan", vi: "Lời trách vì điều đã không làm" }
            ex: { examples: [[{ target: Habrías podido }, " avisarme."], [{ target: Deberías haberme llamado }, "."]] }
            tr: { en: { examples: ["You could have warned me.", "You should have called me."] }, uk: { examples: ["Ти міг би мене попередити.", "Тобі слід було мені зателефонувати."] }, pt: { examples: ["Você poderia ter me avisado.", "Você devia ter me ligado."] }, fr: { examples: ["Tu aurais pu me prévenir.", "Tu aurais dû m’appeler."] }, de: { examples: ["Du hättest mich warnen können.", "Du hättest mich anrufen sollen."] }, it: { examples: ["Avresti potuto avvisarmi.", "Avresti dovuto chiamarmi."] }, pl: { examples: ["Mogłeś mnie uprzedzić.", "Powinieneś był do mnie zadzwonić."] }, tr: { examples: ["Bana haber verebilirdin.", "Beni aramalıydın."] }, id: { examples: ["Kamu bisa saja memberi tahu saya.", "Seharusnya kamu menelepon saya."] }, vi: { examples: ["Lẽ ra bạn có thể báo cho tôi biết.", "Lẽ ra bạn nên gọi cho tôi."] } }
          - level: B2
            use: { es: "Una conjetura sobre un hecho anterior a otro hecho pasado", en: "A conjecture about an event earlier than another past event", uk: "Припущення про подію, ранішу за іншу минулу подію", pt: "Uma conjetura sobre um fato anterior a outro fato passado", fr: "Une conjecture sur un fait antérieur à un autre fait passé", de: "Eine Vermutung über ein Ereignis, das vor einem anderen vergangenen Ereignis liegt", it: "Una congettura su un fatto anteriore a un altro fatto passato", pl: "Przypuszczenie o zdarzeniu wcześniejszym niż inne zdarzenie z przeszłości", tr: "Geçmişteki başka bir olaydan önce olmuş bir olay hakkında tahmin", id: "Dugaan tentang peristiwa yang terjadi sebelum peristiwa lampau lainnya", vi: "Phỏng đoán về một sự việc xảy ra trước một sự việc khác trong quá khứ" }
            ex: { examples: [["Nadie contestó: ", { target: habrían salido }, " de casa."], ["Ayer no vino a clase: ", { target: habría tenido }, " algún problema."]] }
            tr: { en: { examples: ["Nobody answered: they must have left the house.", "He didn't come to class yesterday: he must have had some problem."] }, uk: { examples: ["Ніхто не відповів: мабуть, вони вийшли з дому.", "Учора він не прийшов на заняття: мабуть, у нього були якісь проблеми."] }, pt: { examples: ["Ninguém atendeu: devem ter saído de casa.", "Ontem ele não veio à aula: deve ter tido algum problema."] }, fr: { examples: ["Personne n’a répondu : ils étaient sans doute sortis.", "Hier, il n’est pas venu en cours : il avait sans doute eu un problème."] }, de: { examples: ["Niemand antwortete: Wahrscheinlich waren sie schon aus dem Haus gegangen.", "Gestern ist er nicht zum Unterricht gekommen: Er wird wohl ein Problem gehabt haben."] }, it: { examples: ["Nessuno ha risposto: saranno usciti di casa.", "Ieri non è venuto a lezione: avrà avuto qualche problema."] }, pl: { examples: ["Nikt nie odpowiedział: pewnie wyszli z domu.", "Wczoraj nie przyszedł na zajęcia: pewnie miał jakiś problem."] }, tr: { examples: ["Kimse cevap vermedi: evden çıkmış olmalılar.", "Dün derse gelmedi: bir sorunu olmuş olmalı."] }, id: { examples: ["Tidak ada yang menjawab: mungkin mereka sudah keluar rumah.", "Kemarin dia tidak masuk kelas: mungkin dia punya masalah."] }, vi: { examples: ["Không ai trả lời: chắc là họ đã ra khỏi nhà.", "Hôm qua anh ấy không đến lớp: chắc là anh ấy gặp chuyện gì đó."] } }
          - level: B2
            use: { es: "El futuro perfecto del estilo directo, contado desde el pasado", en: "The future perfect of direct speech, reported from the past", uk: "Майбутній перфект прямої мови, переданий з погляду минулого", pt: "O futuro perfeito do discurso direto, contado a partir do passado", fr: "Le futur antérieur du discours direct, rapporté depuis le passé", de: "Das Futur II der direkten Rede, aus der Vergangenheit erzählt", it: "Il futuro anteriore del discorso diretto, riferito dal passato", pl: "Czas przyszły uprzedni mowy niezależnej, przekazany z perspektywy przeszłości", tr: "Doğrudan anlatımdaki tamamlanmış gelecek zaman, geçmişten aktarılır", id: "Masa depan sempurna dalam kalimat langsung, diceritakan dari masa lampau", vi: "Thì tương lai hoàn thành của câu trực tiếp, kể lại từ quá khứ" }
            ex: { examples: [["Dijo que para el viernes ", { target: habría terminado }, " el informe."], ["Creíamos que a esa hora ya ", { target: habríamos llegado }, "."]] }
            tr: { en: { examples: ["He said that he would have finished the report by Friday.", "We thought that by that time we would already have arrived."] }, uk: { examples: ["Він сказав, що до п’ятниці закінчить звіт.", "Ми думали, що о тій порі вже будемо на місці."] }, pt: { examples: ["Ele disse que até sexta-feira teria terminado o relatório.", "Achávamos que, àquela hora, já teríamos chegado."] }, fr: { examples: ["Il a dit que, d’ici vendredi, il aurait terminé le rapport.", "Nous pensions qu’à cette heure-là, nous serions déjà arrivés."] }, de: { examples: ["Er sagte, bis Freitag werde er den Bericht fertig haben.", "Wir dachten, um diese Zeit wären wir schon angekommen."] }, it: { examples: ["Ha detto che entro venerdì avrebbe finito il rapporto.", "Pensavamo che a quell'ora saremmo già arrivati."] }, pl: { examples: ["Powiedział, że do piątku skończy raport.", "Myśleliśmy, że o tej porze będziemy już na miejscu."] }, tr: { examples: ["Cuma gününe kadar raporu bitirmiş olacağını söyledi.", "O saatte çoktan varmış olacağımızı sanıyorduk."] }, id: { examples: ["Dia bilang pada hari Jumat laporannya sudah selesai.", "Kami mengira pada jam itu kami sudah tiba."] }, vi: { examples: ["Anh ấy nói đến thứ Sáu sẽ xong bản báo cáo.", "Chúng tôi tưởng giờ đó chúng tôi đã đến nơi rồi."] } }
          - level: C1
            use: { es: ["Una objeción: se admite lo supuesto y ", { term: pero }, " lo contradice"], en: ["An objection: what is supposed is granted and ", { term: pero }, " contradicts it"], uk: ["Заперечення: припущене визнається, а ", { term: pero }, " йому суперечить"], pt: ["Uma objeção: admite-se o que se supõe e ", { term: pero }, " o contradiz"], fr: ["Une objection : on admet ce qui est supposé et ", { term: pero }, " le contredit"], de: ["Ein Einwand: Das Angenommene wird eingeräumt, und ", { term: pero }, " widerspricht ihm"], it: ["Un'obiezione: si ammette ciò che si suppone e ", { term: pero }, " lo contraddice"], pl: ["Zastrzeżenie: przyznaje się to, co przypuszczane, a ", { term: pero }, " temu przeczy"], tr: ["Bir itiraz: varsayılan kabul edilir, ", { term: pero }, " ise onu çürütür"], id: ["Keberatan: apa yang diduga diakui, lalu ", { term: pero }, " membantahnya"], vi: ["Một sự phản bác: điều được giả định được thừa nhận, rồi ", { term: pero }, " phủ nhận nó"] }
            ex: { examples: [[{ target: Habría estudiado }, " mucho, pero no se notó en el examen."], [{ target: Habrían trabajado }, " mucho, pero el resultado no lo muestra."]] }
            tr: { en: { examples: ["He may have studied a lot, but it didn't show in the exam.", "They may have worked a lot, but the result doesn't show it."] }, uk: { examples: ["Може, він і багато вчився, але на іспиті цього не було помітно.", "Може, вони й багато працювали, але результат цього не показує."] }, pt: { examples: ["Pode ser que tenha estudado muito, mas isso não se notou na prova.", "Podem ter trabalhado muito, mas o resultado não mostra."] }, fr: { examples: ["Il aurait beaucoup étudié, mais cela ne s’est pas vu à l’examen.", "Ils auraient beaucoup travaillé, mais le résultat ne le montre pas."] }, de: { examples: ["Er mag viel gelernt haben, aber in der Prüfung hat man es nicht gemerkt.", "Sie mögen viel gearbeitet haben, aber das Ergebnis zeigt es nicht."] }, it: { examples: ["Avrà anche studiato molto, ma all'esame non si è visto.", "Avranno anche lavorato molto, ma il risultato non lo dimostra."] }, pl: { examples: ["Może i dużo się uczył, ale na egzaminie nie było tego widać.", "Może i dużo pracowali, ale wynik tego nie pokazuje."] }, tr: { examples: ["Çok çalışmış olabilir ama sınavda belli olmadı.", "Çok çalışmış olabilirler ama sonuç bunu göstermiyor."] }, id: { examples: ["Mungkin dia sudah belajar banyak, tetapi tidak terlihat dalam ujian.", "Mungkin mereka sudah bekerja keras, tetapi hasilnya tidak menunjukkan itu."] }, vi: { examples: ["Có thể anh ấy đã học nhiều, nhưng không thể hiện ra trong kỳ thi.", "Có thể họ đã làm việc nhiều, nhưng kết quả không cho thấy điều đó."] } }
          - level: C1
            use: { es: "Un contraste entre dos personas ante el mismo hecho pasado", en: "A contrast between two people facing the same past event", uk: "Контраст між двома людьми щодо тієї самої минулої події", pt: "Um contraste entre duas pessoas diante do mesmo fato passado", fr: "Un contraste entre deux personnes face au même fait passé", de: "Ein Kontrast zwischen zwei Personen angesichts desselben vergangenen Ereignisses", it: "Un contrasto tra due persone di fronte allo stesso fatto passato", pl: "Kontrast między dwiema osobami wobec tego samego zdarzenia z przeszłości", tr: "Aynı geçmiş olay karşısında iki kişi arasındaki karşıtlık", id: "Kontras antara dua orang terhadap peristiwa lampau yang sama", vi: "Sự đối lập giữa hai người trước cùng một sự việc trong quá khứ" }
            ex: { examples: [["A ti te ", { target: habría dado }, " igual, pero a mí no."], ["Otros ", { target: habrían protestado }, ", pero yo me callé."]] }
            tr: { en: { examples: ["It might have made no difference to you, but it did to me.", "Others would have protested, but I kept quiet."] }, uk: { examples: ["Тобі, можливо, було б однаково, а мені ні.", "Інші, може, й обурилися б, а я змовчав."] }, pt: { examples: ["Para você talvez fosse indiferente, mas para mim não.", "Outros teriam protestado, mas eu me calei."] }, fr: { examples: ["À toi, ça aurait peut-être été égal, mais pas à moi.", "D’autres auraient protesté, mais moi, je me suis tu."] }, de: { examples: ["Dir wäre es vielleicht egal gewesen, mir aber nicht.", "Andere hätten protestiert, aber ich schwieg."] }, it: { examples: ["A te sarebbe stato indifferente, forse, ma a me no.", "Altri avrebbero protestato, ma io ho taciuto."] }, pl: { examples: ["Tobie mogłoby być wszystko jedno, ale mnie nie.", "Inni by protestowali, ale ja milczałem."] }, tr: { examples: ["Sana fark etmezdi belki, ama bana ederdi.", "Başkaları itiraz ederdi, ama ben sustum."] }, id: { examples: ["Bagimu mungkin tidak masalah, tetapi bagiku masalah.", "Orang lain mungkin akan memprotes, tetapi saya diam."] }, vi: { examples: ["Với bạn thì có thể thế nào cũng được, nhưng với tôi thì không.", "Người khác có thể đã phản đối, nhưng tôi thì im lặng."] } }
          - level: C2
            use: { es: "Un temor o una advertencia sobre lo que pudo ocurrir", en: "A fear or a warning about what could have happened", uk: "Побоювання чи застереження щодо того, що могло статися", pt: "Um temor ou uma advertência sobre o que poderia ter acontecido", fr: "Une crainte ou un avertissement sur ce qui aurait pu arriver", de: "Eine Befürchtung oder eine Warnung vor dem, was hätte geschehen können", it: "Un timore o un avvertimento su ciò che poteva accadere", pl: "Obawa lub ostrzeżenie dotyczące tego, co mogło się wydarzyć", tr: "Olabilecek şey hakkında bir korku ya da uyarı", id: "Kekhawatiran atau peringatan tentang apa yang bisa saja terjadi", vi: "Nỗi lo ngại hoặc lời cảnh báo về điều có thể đã xảy ra" }
            ex: { examples: [["¡Qué susto! ", { target: Te habrías roto }, " una pierna."], ["Callé: ¿no ", { target: habrías pensado }, " que fui yo?"]] }
            tr: { en: { examples: ["What a fright! You could have broken a leg.", "I kept quiet: wouldn't you have thought it was me?"] }, uk: { examples: ["Ну й перелякав! Ти міг зламати ногу.", "Я змовчав: хіба ти не подумав би, що це я?"] }, pt: { examples: ["Que susto! Você poderia ter quebrado uma perna.", "Eu me calei: você não teria pensado que fui eu?"] }, fr: { examples: ["Quelle peur ! Tu te serais cassé une jambe.", "Je me suis tu : n’aurais-tu pas pensé que c’était moi ?"] }, de: { examples: ["Was für ein Schreck! Du hättest dir ein Bein brechen können.", "Ich schwieg: Hättest du nicht gedacht, dass ich es war?"] }, it: { examples: ["Che spavento! Ti saresti rotto una gamba.", "Ho taciuto: non avresti pensato che fossi stato io?"] }, pl: { examples: ["Co za strach! Mogłeś sobie złamać nogę.", "Milczałem: czy nie pomyślałbyś, że to ja?"] }, tr: { examples: ["Ne korku ama! Bacağını kırabilirdin.", "Sustum: yoksa benim yaptığımı mı düşünürdün?"] }, id: { examples: ["Kaget sekali! Kakimu bisa saja patah.", "Saya diam: bukankah kamu akan mengira itu saya?"] }, vi: { examples: ["Hú hồn quá! Bạn có thể đã gãy chân rồi.", "Tôi im lặng: chẳng phải bạn sẽ nghĩ là tôi làm sao?"] } }
          - level: C2
            use: { es: "El condicional periodístico: presenta como no confirmado un hecho anterior", en: "The journalistic conditional: presents an earlier event as unconfirmed", uk: "Журналістський умовний спосіб: подає попередню подію як непідтверджену", pt: "O condicional jornalístico: apresenta como não confirmado um fato anterior", fr: "Le conditionnel journalistique : présente comme non confirmé un fait antérieur", de: "Der Konditional der Presse: stellt ein früheres Ereignis als unbestätigt dar", it: "Il condizionale giornalistico: presenta come non confermato un fatto anteriore", pl: "Tryb warunkowy w prasie: przedstawia wcześniejsze zdarzenie jako niepotwierdzone", tr: "Gazetecilik koşul kipi: daha önce olmuş bir olayı doğrulanmamış olarak sunar", id: "Kondisional jurnalistik: menyajikan peristiwa sebelumnya sebagai belum dikonfirmasi", vi: "Thức điều kiện trong báo chí: trình bày một sự việc xảy ra trước đó như chưa được xác nhận" }
