sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: ["Se forma con ", { term: habría }, " y el participio; sitúa un hecho pasado como irreal, supuesto o anterior."]
              en: ["It is formed with ", { term: habría }, " and the participle; it presents a past event as unreal, supposed or earlier."]
              uk: ["Утворюється з ", { term: habría }, " і дієприкметника; подає минулу подію як нереальну, припущену або попередню."]
              pt: ["Forma-se com ", { term: habría }, " e o particípio; apresenta um fato passado como irreal, suposto ou anterior."]
              fr: ["Il se forme avec ", { term: habría }, " et le participe ; il présente un fait passé comme irréel, supposé ou antérieur."]
              de: ["Es wird mit ", { term: habría }, " und dem Partizip gebildet; es stellt ein vergangenes Ereignis als irreal, vermutet oder vorzeitig dar."]
              it: ["Si forma con ", { term: habría }, " e il participio; presenta un fatto passato come irreale, supposto o anteriore."]
              pl: ["Tworzy się go z ", { term: habría }, " i imiesłowu; przedstawia fakt z przeszłości jako nierzeczywisty, przypuszczany lub wcześniejszy."]
              tr: [{ term: habría }, " ve participio ile kurulur; geçmişteki bir olayı gerçek dışı, varsayılan ya da daha önce olmuş olarak gösterir."]
              id: ["Dibentuk dengan ", { term: habría }, " dan partisip; menampilkan peristiwa lampau sebagai tidak nyata, dugaan, atau yang lebih dulu."]
              vi: ["Được tạo bằng ", { term: habría }, " và quá khứ phân từ; cho thấy một sự việc quá khứ là không có thật, được phỏng đoán hoặc xảy ra trước."]
            ex: ["Con más tiempo, ", { target: habríamos visto }, " el museo."]
            tr: { en: "With more time, we would have seen the museum.", uk: "Якби було більше часу, ми побачили б музей.", pt: "Com mais tempo, teríamos visto o museu.", fr: "Avec plus de temps, nous aurions visité le musée.", de: "Mit mehr Zeit hätten wir das Museum gesehen.", it: "Con più tempo, avremmo visto il museo.", pl: "Mając więcej czasu, zobaczylibyśmy muzeum.", tr: "Daha fazla vaktimiz olsaydı müzeyi görürdük.", id: "Dengan waktu lebih banyak, kami sudah melihat museum itu.", vi: "Nếu có nhiều thời gian hơn, chúng tôi đã tham quan bảo tàng rồi." }
          - type: note
            level: B2
            text:
              es: ["Las gramáticas lo llaman también ", { term: condicional perfecto }, " o ", { term: antepospretérito }, "."]
              en: ["Grammars also call it ", { term: condicional perfecto }, " or ", { term: antepospretérito }, "."]
              uk: ["У граматиках його називають також ", { term: condicional perfecto }, " або ", { term: antepospretérito }, "."]
              pt: ["As gramáticas também o chamam ", { term: condicional perfecto }, " ou ", { term: antepospretérito }, "."]
              fr: ["Les grammaires l’appellent aussi ", { term: condicional perfecto }, " ou ", { term: antepospretérito }, "."]
              de: ["In Grammatiken heißt es auch ", { term: condicional perfecto }, " oder ", { term: antepospretérito }, "."]
              it: ["Le grammatiche lo chiamano anche ", { term: condicional perfecto }, " o ", { term: antepospretérito }, "."]
              pl: ["Gramatyki nazywają go także ", { term: condicional perfecto }, " lub ", { term: antepospretérito }, "."]
              tr: ["Dil bilgisi kitaplarında ", { term: condicional perfecto }, " ya da ", { term: antepospretérito }, " adıyla da geçer."]
              id: ["Buku tata bahasa juga menyebutnya ", { term: condicional perfecto }, " atau ", { term: antepospretérito }, "."]
              vi: ["Các sách ngữ pháp còn gọi nó là ", { term: condicional perfecto }, " hoặc ", { term: antepospretérito }, "."]
          - type: note
            level: B2
            text:
              es: ["El auxiliar y el participio funcionan como en ", { link: El pluscuamperfecto, to: es.pasados.pluscuamperfecto }, "."]
              en: ["The helper and the participle work as in ", { link: "Past Perfect", to: es.pasados.pluscuamperfecto }, "."]
              uk: ["Допоміжне дієслово й дієприкметник діють так само, як у розділі ", { link: "Плюсквамперфект", to: es.pasados.pluscuamperfecto }, "."]
              pt: ["O auxiliar e o particípio funcionam como em ", { link: "O pretérito mais-que-perfeito", to: es.pasados.pluscuamperfecto }, "."]
              fr: ["L’auxiliaire et le participe fonctionnent comme dans ", { link: "Le plus-que-parfait", to: es.pasados.pluscuamperfecto }, "."]
              de: ["Hilfsverb und Partizip funktionieren wie im ", { link: "Das Plusquamperfekt", to: es.pasados.pluscuamperfecto }, "."]
              it: ["L'ausiliare e il participio funzionano come in ", { link: "Il trapassato prossimo", to: es.pasados.pluscuamperfecto }, "."]
              pl: ["Czasownik posiłkowy i imiesłów działają tak jak w ", { link: "Czas zaprzeszły", to: es.pasados.pluscuamperfecto }, "."]
              tr: ["Yardımcı fiil ve participio, ", { link: "Pluscuamperfecto", to: es.pasados.pluscuamperfecto }, " konusundaki gibi çalışır."]
              id: ["Kata kerja bantu dan partisip bekerja seperti pada ", { link: "Pluscuamperfecto", to: es.pasados.pluscuamperfecto }, "."]
              vi: ["Trợ động từ và quá khứ phân từ hoạt động như trong ", { link: "Quá khứ hoàn thành", to: es.pasados.pluscuamperfecto }, "."]
          - type: note
            level: B2
            text:
              es: ["Las oraciones con ", { term: si }, " se explican en ", { link: Las oraciones condicionales, to: es.oracion.condicionales }, "; el estilo indirecto, en ", { link: Estilo indirecto y pasiva con se, to: es.oracion.estilo-indirecto-pasiva }, "."]
              en: ["Sentences with ", { term: si }, " are explained in ", { link: "Conditional Sentences", to: es.oracion.condicionales }, "; reported speech in ", { link: "Reported Speech and Passive se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              uk: ["Речення з ", { term: si }, " пояснено в розділі ", { link: "Умовні речення", to: es.oracion.condicionales }, "; непряму мову — у розділі ", { link: "Непряма мова і пасив із se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              pt: ["As orações com ", { term: si }, " são explicadas em ", { link: "As orações condicionais", to: es.oracion.condicionales }, "; o discurso indireto, em ", { link: "Discurso indireto e passiva com se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              fr: ["Les phrases avec ", { term: si }, " sont expliquées dans ", { link: "Les phrases conditionnelles", to: es.oracion.condicionales }, " ; le discours indirect, dans ", { link: "Le discours indirect et le passif avec se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              de: ["Sätze mit ", { term: si }, " werden in ", { link: "Die Bedingungssätze", to: es.oracion.condicionales }, " erklärt, die indirekte Rede in ", { link: "Indirekte Rede und Passiv mit se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              it: ["Le frasi con ", { term: si }, " sono spiegate in ", { link: "Il periodo ipotetico", to: es.oracion.condicionales }, "; il discorso indiretto in ", { link: "Discorso indiretto e passivo con se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              pl: ["Zdania z ", { term: si }, " omówiono w ", { link: "Zdania warunkowe", to: es.oracion.condicionales }, ", a mowę zależną w ", { link: "Mowa zależna i strona bierna z se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              tr: [{ term: si }, " içeren cümleler ", { link: "Koşul cümleleri", to: es.oracion.condicionales }, " konusunda, dolaylı anlatım ise ", { link: "Dolaylı anlatım ve se ile edilgen yapı", to: es.oracion.estilo-indirecto-pasiva }, " konusunda açıklanır."]
              id: ["Kalimat dengan ", { term: si }, " dijelaskan di ", { link: "Kalimat bersyarat", to: es.oracion.condicionales }, ", sedangkan kalimat tak langsung di ", { link: "Kalimat tak langsung dan pasif dengan se", to: es.oracion.estilo-indirecto-pasiva }, "."]
              vi: ["Câu có ", { term: si }, " được giải thích trong ", { link: "Câu điều kiện", to: es.oracion.condicionales }, ", còn câu gián tiếp trong ", { link: "Câu gián tiếp và câu bị động với se", to: es.oracion.estilo-indirecto-pasiva }, "."]

