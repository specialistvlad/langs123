          tr: { en: "He said that he would have finished by Friday.", uk: "Він сказав, що до п’ятниці закінчить.", pt: "Ele disse que até sexta-feira teria terminado.", fr: "Il a dit que, d’ici vendredi, il aurait terminé.", de: "Er sagte, bis Freitag werde er fertig sein.", it: "Ha detto che entro venerdì avrebbe finito.", pl: "Powiedział, że do piątku skończy.", tr: "Cuma gününe kadar bitirmiş olacağını söyledi.", id: "Dia bilang pada hari Jumat sudah selesai.", vi: "Anh ấy nói rằng đến thứ Sáu anh ấy sẽ làm xong." }
        - level: B2
