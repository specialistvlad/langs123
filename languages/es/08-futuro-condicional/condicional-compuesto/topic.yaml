          tr: { en: "If I had been able to, I would have gone.", uk: "Якби я зміг, я пішов би.", pt: "Se eu tivesse podido, teria ido.", fr: "Si j’avais pu, j’y serais allé.", de: "Wenn ich gekonnt hätte, wäre ich gegangen.", it: "Se avessi potuto, sarei andato.", pl: "Gdybym mógł, poszedłbym.", tr: "Mümkün olsaydı giderdim.", id: "Seandainya saya bisa, saya pasti sudah pergi.", vi: "Nếu có thể, tôi đã đi rồi." }
        - level: B2
