          tr: { en: "I would have called the doctor.", uk: "Я викликав би лікаря.", pt: "Eu teria chamado o médico.", fr: "J’aurais appelé le médecin.", de: "Ich hätte den Arzt gerufen.", it: "Io avrei chiamato il medico.", pl: "Ja wezwałbym lekarza.", tr: "Ben doktoru çağırırdım.", id: "Saya akan memanggil dokter.", vi: "Tôi đã gọi bác sĩ rồi." }
        - level: B2
          point: { es: Conjetura, en: "Conjecture", uk: "Припущення", pt: "Conjetura", fr: "Conjecture", de: "Vermutung", it: "Congettura", pl: "Przypuszczenie", tr: "Tahmin", id: "Dugaan", vi: "Phỏng đoán" }
          rule:
