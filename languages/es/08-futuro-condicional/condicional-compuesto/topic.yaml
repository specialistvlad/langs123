title: { es: "El condicional compuesto: habría comido", en: "Conditional Perfect: habría comido", uk: "Умовний перфект: habría comido", pt: "O condicional composto: habría comido", fr: "Le conditionnel passé : habría comido", de: "Der Konditional II: habría comido", it: "Il condizionale composto: habría comido", pl: "Tryb warunkowy przeszły: habría comido", tr: "Tamamlanmış koşul kipi: habría comido", id: "Kondisional sempurna: habría comido", vi: "Thức điều kiện hoàn thành: habría comido" }
summary:
  lead:
    es: ["El condicional compuesto, ", { term: habría }, " con un participio, expresa lo que no llegó a ocurrir, supone un hecho pasado y marca una anterioridad: ", { term: habría salido }, "."]
    en: ["The conditional perfect, ", { term: habría }, " with a participle, tells what never happened, supposes a past event and marks what came earlier: ", { term: habría salido }, "."]
    uk: ["Умовний перфект — ", { term: habría }, " з дієприкметником — виражає те, що не відбулося, припускає минулу подію й позначає попередність: ", { term: habría salido }, "."]
    pt: ["O condicional composto, ", { term: habría }, " com um particípio, expressa o que não chegou a acontecer, supõe um fato passado e marca anterioridade: ", { term: habría salido }, "."]
    fr: ["Le conditionnel passé, ", { term: habría }, " avec un participe, exprime ce qui n’a pas eu lieu, suppose un fait passé et marque l’antériorité : ", { term: habría salido }, "."]
    de: ["Der Konditional II, ", { term: habría }, " mit Partizip, drückt Nichteingetretenes aus, vermutet Vergangenes und zeigt Vorzeitigkeit an: ", { term: habría salido }, "."]
    it: ["Il condizionale composto, ", { term: habría }, " con un participio, esprime ciò che non si è realizzato, ipotizza un fatto passato e indica anteriorità: ", { term: habría salido }, "."]
    pl: ["Tryb warunkowy przeszły, ", { term: habría }, " z imiesłowem, wyraża to, co się nie wydarzyło, przypuszcza fakt z przeszłości i wskazuje uprzedniość: ", { term: habría salido }, "."]
    tr: ["Tamamlanmış koşul kipi, yani ", { term: habría }, " ve bir participio, gerçekleşmeyen şeyi anlatır, geçmişte olmuş bir olayı varsayar ve öncelik bildirir: ", { term: habría salido }, "."]
    id: ["Kondisional sempurna (", { term: habría }, " + partisip) menyatakan yang tidak terjadi, menduga peristiwa lampau, dan menandai peristiwa yang lebih dulu: ", { term: habría salido }, "."]
    vi: ["Thức điều kiện hoàn thành (", { term: habría }, " + phân từ) nói điều không xảy ra, đoán việc quá khứ, chỉ việc xảy ra trước: ", { term: habría salido }, "."]
  rule:
    es: ["La condición irreal del pasado lleva ", { term: "hubiera" }, " con participio, y su resultado lleva ", { term: habría }, " con participio:"]
    en: ["The unreal condition in the past takes ", { term: "hubiera" }, " with a participle, and its result takes ", { term: habría }, " with a participle:"]
    uk: ["Нереальна умова в минулому має ", { term: "hubiera" }, " з дієприкметником, а її наслідок — ", { term: habría }, " з дієприкметником:"]
    pt: ["A condição irreal do passado leva ", { term: "hubiera" }, " com particípio, e o seu resultado leva ", { term: habría }, " com particípio:"]
    fr: ["La condition irréelle du passé prend ", { term: "hubiera" }, " + participe, son résultat ", { term: habría }, " + participe :"]
    de: ["Die irreale Bedingung der Vergangenheit steht mit ", { term: "hubiera" }, " und Partizip, ihr Ergebnis mit ", { term: habría }, " und Partizip:"]
    it: ["La condizione irreale del passato vuole ", { term: "hubiera" }, " con il participio, e il suo risultato vuole ", { term: habría }, " con il participio:"]
    pl: ["Nierzeczywisty warunek w przeszłości ma ", { term: "hubiera" }, " z imiesłowem, a jego skutek ma ", { term: habría }, " z imiesłowem:"]
    tr: ["Geçmişteki gerçek dışı koşul ", { term: "hubiera" }, " ve participio ile kurulur; sonucu ise ", { term: habría }, " ve participio ile:"]
    id: ["Syarat yang tidak nyata di masa lampau memakai ", { term: "hubiera" }, " dengan partisip, dan hasilnya memakai ", { term: habría }, " dengan partisip:"]
    vi: ["Điều kiện không có thật dùng ", { term: "hubiera" }, ", kết quả dùng ", { term: habría }, ", đều kèm phân từ:"]
  ex: ["Si hubiera salido antes, ", { target: habría llegado }, " a tiempo."]

