          tr: { en: "You could have warned me.", uk: "Ти міг би мене попередити.", pt: "Você poderia ter me avisado.", fr: "Tu aurais pu me prévenir.", de: "Du hättest mich warnen können.", it: "Avresti potuto avvisarmi.", pl: "Mogłeś mnie uprzedzić.", tr: "Bana haber verebilirdin.", id: "Kamu bisa saja memberi tahu saya.", vi: "Lẽ ra bạn có thể báo cho tôi biết." }
        - level: C1
