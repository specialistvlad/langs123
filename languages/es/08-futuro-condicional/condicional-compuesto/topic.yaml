          tr: { en: "The light was off: they must have gone out.", uk: "Світло було вимкнене: мабуть, вони пішли.", pt: "A luz estava apagada: devem ter saído.", fr: "La lumière était éteinte : ils étaient sans doute sortis.", de: "Das Licht war aus: Wahrscheinlich waren alle ausgegangen.", it: "La luce era spenta: saranno usciti.", pl: "Światło było zgaszone: pewnie wyszli.", tr: "Işık kapalıydı: çıkmış olmalılar.", id: "Lampunya mati: mungkin mereka sudah keluar.", vi: "Đèn đã tắt: chắc là họ đã ra ngoài rồi." }
        - level: B2
          point: { es: Estilo indirecto, en: "Reported speech", uk: "Непряма мова", pt: "Discurso indireto", fr: "Discours indirect", de: "Indirekte Rede", it: "Discorso indiretto", pl: "Mowa zależna", tr: "Dolaylı anlatım", id: "Kalimat tak langsung", vi: "Câu gián tiếp" }
          rule:
