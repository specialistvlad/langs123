            id: "mengakui apa yang diduga lalu membantahnya, atau membandingkan dua orang"
            vi: "thừa nhận điều được giả định rồi phủ nhận nó, hoặc đối chiếu hai người"
          ex: { examples: [[{ target: Habría estudiado }, " mucho, pero no se notó."], ["A ti te ", { target: habría dado }, " igual, pero a mí no."]] }
          tr: { en: { examples: ["He may have studied a lot, but it didn't show.", "It might have made no difference to you, but it did to me."] }, uk: { examples: ["Може, він і багато вчився, але цього не було помітно.", "Тобі, можливо, було б однаково, а мені ні."] }, pt: { examples: ["Pode ser que tenha estudado muito, mas não se notou.", "Para você talvez fosse indiferente, mas para mim não."] }, fr: { examples: ["Il aurait beaucoup étudié, mais cela ne s’est pas vu.", "À toi, ça aurait peut-être été égal, mais pas à moi."] }, de: { examples: ["Er mag viel gelernt haben, aber man hat es nicht gemerkt.", "Dir wäre es vielleicht egal gewesen, mir aber nicht."] }, it: { examples: ["Avrà anche studiato molto, ma non si è visto.", "A te sarebbe stato indifferente, forse, ma a me no."] }, pl: { examples: ["Może i dużo się uczył, ale nie było tego widać.", "Tobie mogłoby być wszystko jedno, ale mnie nie."] }, tr: { examples: ["Çok çalışmış olabilir ama belli olmadı.", "Sana fark etmezdi belki, ama bana ederdi."] }, id: { examples: ["Mungkin dia sudah belajar banyak, tetapi tidak kelihatan.", "Bagimu mungkin tidak masalah, tetapi bagiku masalah."] }, vi: { examples: ["Có thể anh ấy đã học nhiều, nhưng không thấy kết quả.", "Với bạn thì có thể thế nào cũng được, nhưng với tôi thì không."] } }
