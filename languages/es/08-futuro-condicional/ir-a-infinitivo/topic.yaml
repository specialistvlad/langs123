# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.futuro-condicional.ir-a-infinitivo
lang: es
kind: grammar
tags: [verbs, future, periphrasis]
concepts: [future]
related: [es.presente.presente-irregular, es.futuro-condicional.futuro-simple, es.presente.estar-gerundio, es.imperativo-perifrasis.perifrasis-aspectuales, es.pasados.mapa-tiempos]
status: { en: draft, es: draft, uk: draft }
translated: { en: "5048c4 509d23 ced3f2 75de02 a8844f dfae7a c6c958 6f9123", uk: "5048c4 509d23 ced3f2 75de02 a8844f dfae7a c6c958 6f9123" }

title: { en: "Future with Ir a: voy a comer", es: "Ir a con infinitivo: voy a comer", uk: "Майбутнє з ir a: voy a comer" }
summary:
  lead:
    en: ["The present of ", { term: ir }, ", then ", { term: a }, " and an infinitive, names plans and what is about to happen: ", { term: voy a estudiar }, "."]
    es: ["El presente de ", { term: ir }, ", con ", { term: a }, " y un infinitivo, expresa planes y lo que va a pasar pronto: ", { term: voy a estudiar }, "."]
    uk: ["Теперішній час ", { term: ir }, ", далі ", { term: a }, " та інфінітив позначає плани й те, що от-от станеться: ", { term: voy a estudiar }, "."]
  rule:
    en: ["Only ", { term: ir }, " changes; ", { term: a }, " and the infinitive stay the same:"]
    es: ["Solo cambia ", { term: ir }, "; ", { term: a }, " y el infinitivo no cambian:"]
    uk: ["Змінюється лише ", { term: ir }, "; ", { term: a }, " та інфінітив лишаються незмінними:"]
  ex: { examples: [[{ target: Voy a cenar }, " con Ana."], ["¿", { target: Vas a venir }, "?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: Пункт } }
        - { key: rule, label: { en: Rule, es: Regla, uk: Правило } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
      rows:
        - level: A2
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: { pattern: [{ alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, { term: a }, { slot: infinitive }] }
            es: { pattern: [{ alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, { term: a }, { slot: infinitive }] }
            uk: { pattern: [{ alternatives: [{ term: voy }, { term: vas }, { term: va }, { term: vamos }, { term: van }] }, { term: a }, { slot: infinitive }] }
          ex: ["Mañana ", { target: voy a trabajar }, "."]
          tr: { en: "I'm going to work tomorrow.", uk: "Завтра я збираюся працювати." }
        - level: A2
          variety: es-ES
          point: { en: Form, es: Forma, uk: Форма }
          rule:
            en: [{ term: vosotros }, ": ", { pattern: [{ term: vais }, { term: a }, { slot: infinitive }] }]
            es: [{ term: vosotros }, ": ", { pattern: [{ term: vais }, { term: a }, { slot: infinitive }] }]
            uk: [{ term: vosotros }, ": ", { pattern: [{ term: vais }, { term: a }, { slot: infinitive }] }]
          ex: ["¿Qué ", { target: vais a hacer }, "?"]
          tr: { en: What are you going to do?, uk: "Що ви збираєтеся робити?" }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "plans and intentions"
            es: "planes e intenciones"
            uk: "плани та наміри"
          ex: ["Este verano ", { target: vamos a viajar }, " a Perú."]
          tr: { en: "We're going to travel to Peru this summer.", uk: "Цього літа ми збираємося поїхати до Перу." }
        - level: A2
          point: { en: Negative, es: Negación, uk: Заперечення }
          rule:
            en: [{ term: "no" }, " goes before ", { term: ir }]
            es: [{ term: "no" }, " va delante de ", { term: ir }]
            uk: [{ term: "no" }, " ставлять перед ", { term: ir }]
          ex: [{ target: No voy a salir }, " esta noche."]
          tr: { en: "I'm not going to go out tonight.", uk: "Сьогодні ввечері я нікуди не збираюся йти." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "a prediction from what you see now"
            es: "una predicción a partir de lo que se ve"
            uk: "прогноз на основі того, що видно зараз"
          ex: ["Mira esas nubes: ", { target: va a llover }, "."]
          tr: { en: "Look at those clouds: it's going to rain.", uk: "Поглянь на ці хмари: буде дощ." }
        - level: A2
          point: { en: Use, es: Uso, uk: "Вживання" }
          rule:
            en: "something about to happen"
            es: "algo a punto de pasar"
            uk: "те, що от-от станеться"
          ex: ["¡Cuidado, ", { target: te vas a caer }, "!"]
          tr: { en: "Careful, you're going to fall!", uk: "Обережно, ти зараз упадеш!" }
        - level: A2
          point: { en: Invitation, es: Invitación, uk: Запрошення }
          rule:
            en: [{ term: vamos a }, " with an infinitive: let's"]
            es: [{ term: vamos a }, " con infinitivo: una propuesta"]
            uk: [{ term: vamos a }, " з інфінітивом: «давай(те)»"]
          ex: ["¡", { target: Vamos a bailar }, "!"]
          tr: { en: "Let's dance!", uk: "Ходімо танцювати!" }
        - level: A2
          point: { en: Pronouns, es: Pronombres, uk: Займенники }
          rule:
            en: ["before ", { term: ir }, ", or joined to the infinitive"]
            es: ["delante de ", { term: ir }, ", o unido al infinitivo"]
            uk: ["перед ", { term: ir }, " або приєднані до інфінітива"]
          ex: { examples: [[{ target: Te voy a llamar }, "."], [{ target: Voy a llamarte }, "."]] }
          tr: { en: { examples: ["I'm going to call you.", "I'm going to call you."] }, uk: { examples: ["Я тобі подзвоню.", "Я тобі подзвоню."] } }
        - level: A2
          point: { en: Trap, es: Trampa, uk: Пастка }
          rule:
            en: ["the ", { term: a }, " never drops"]
            es: ["la ", { term: a }, " no desaparece nunca"]
            uk: [{ term: a }, " ніколи не випадає"]
          ex: [{ target: Voy a comprar }, " pan."]
          tr: { en: "I'm going to buy bread.", uk: "Я збираюся купити хліба." }

sections:
  - title: { en: Overview, es: Visión general, uk: Огляд }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: ir }, " in the present, then ", { term: a }, " and an infinitive, names a plan for the future."]
              es: [{ term: ir }, " en presente, con ", { term: a }, " y un infinitivo, expresa un plan para el futuro."]
              uk: [{ term: ir }, " у теперішньому часі, далі ", { term: a }, " та інфінітив позначає план на майбутнє."]
          - type: rule
            level: A2
            text:
              en: "It is the most common way to talk about the future in everyday speech."
              es: "Es la forma más frecuente de hablar del futuro en la lengua de todos los días."
              uk: "Це найуживаніший спосіб говорити про майбутнє в повсякденному мовленні."
          - type: note
            level: A2
            text:
              en: ["The forms of ", { term: ir }, ": ", { link: "Present Tense: Irregular Verbs", to: es.presente.presente-irregular }, "."]
              es: ["Las formas de ", { term: ir }, ": ", { link: "El presente: verbos irregulares", to: es.presente.presente-irregular }, "."]
              uk: ["Форми ", { term: ir }, ": ", { link: "Теперішній час: неправильні дієслова", to: es.presente.presente-irregular }, "."]
          - type: note
            level: A2
            text:
              en: ["The future in one word, for predictions and promises: ", { link: Simple Future, to: es.futuro-condicional.futuro-simple }, "."]
              es: ["El futuro en una sola palabra, para predicciones y promesas: ", { link: El futuro simple, to: es.futuro-condicional.futuro-simple }, "."]
              uk: ["Майбутнє одним словом, для прогнозів і обіцянок: ", { link: Простий майбутній час, to: es.futuro-condicional.futuro-simple }, "."]
          - type: note
            level: A2
            readers: [uk]
            text:
              uk: [{ term: "ir a" }, " з інфінітивом — як українське «збираюся»: ", { term: "voy a estudiar" }, " — «збираюся вчитися» або «буду вчитися»."]

  - title: { en: Form, es: Forma, uk: Форма }
    role: form
    features: { tense: fut }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа } }
          - { key: pos, label: { en: Statement, es: Afirmación, uk: Ствердження } }
          - { key: neg, label: { en: Negative, es: Negación, uk: Заперечення } }
        rows:
          - { level: A2, features: { person: 1, number: sg }, person: yo, pos: [{ target: voy a }, " trabajar"], neg: [{ target: no voy a }, " trabajar"] }
          - { level: A2, features: { person: 2, number: sg, politeness: infm }, person: tú, pos: [{ target: vas a }, " trabajar"], neg: [{ target: no vas a }, " trabajar"] }
          - { level: A2, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, pos: [{ target: va a }, " trabajar"], neg: [{ target: no va a }, " trabajar"] }
          - { level: A2, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, pos: [{ target: vamos a }, " trabajar"], neg: [{ target: no vamos a }, " trabajar"] }
          - { level: A2, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, pos: [{ target: vais a }, " trabajar"], neg: [{ target: no vais a }, " trabajar"] }
          - { level: A2, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, pos: [{ target: van a }, " trabajar"], neg: [{ target: no van a }, " trabajar"] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A question keeps the same words between ¿ and ?:"
              es: "Una pregunta mantiene las mismas palabras entre ¿ y ?:"
              uk: "У питанні ті самі слова стоять між ¿ і ?:"
            ex: ["¿", { target: Vas a venir }, " a la fiesta?"]
            tr: { en: Are you going to come to the party?, uk: "Ти прийдеш на вечірку?" }
          - type: note
            level: A2
            variety: es-419
            text:
              en: [{ term: ustedes }, " takes ", { term: van a }, ", in formal and informal address:"]
              es: [{ term: ustedes }, " lleva ", { term: van a }, ", también en el trato informal:"]
              uk: [{ term: ustedes }, " вживається з ", { term: van a }, " і в офіційному, і в неофіційному звертанні:"]
            ex: ["¿Ustedes ", { target: van a cenar }, " en casa?"]
            tr: { en: Are you going to have dinner at home?, uk: "Ви вечерятимете вдома?" }

  - title: { en: Use, es: Uso, uk: "Вживання" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, use: { en: A plan, es: Un plan, uk: План }, ex: ["Este fin de semana ", { target: voy a visitar }, " a mis abuelos."], tr: { en: "This weekend I'm going to visit my grandparents.", uk: "Цих вихідних я збираюся провідати дідуся й бабусю." } }
          - { level: A2, use: { en: An intention, es: Una intención, uk: Намір }, ex: [{ target: Voy a estudiar }, " medicina."], tr: { en: "I'm going to study medicine.", uk: "Я збираюся вивчати медицину." } }
          - { level: A2, use: { en: A prediction from what you see now, es: Una predicción a partir de lo que se ve, uk: "Прогноз на основі того, що видно зараз" }, ex: ["Mira esas nubes: ", { target: va a llover }, "."], tr: { en: "Look at those clouds: it's going to rain.", uk: "Поглянь на ці хмари: буде дощ." } }
          - { level: A2, use: { en: Something about to happen, es: Algo a punto de pasar, uk: "Те, що от-от станеться" }, ex: ["El tren ", { target: va a salir }, "."], tr: { en: The train is about to leave., uk: "Потяг ось-ось рушить." } }
          - { level: A2, use: { en: ["An invitation with ", { term: vamos a }], es: ["Una propuesta con ", { term: vamos a }], uk: ["Запрошення з ", { term: vamos a }] }, ex: ["¡", { target: Vamos a bailar }, "!"], tr: { en: "Let's dance!", uk: "Ходімо танцювати!" } }

  - title: { en: Signal words, es: Marcadores, uk: "Слова-маркери" }
    role: signals
    content:
      - type: usage
        columns:
          - { key: signal, label: { en: Word, es: Palabra, uk: Слово } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад } }
        rows:
          - { level: A2, signal: mañana, ex: [{ signal: Mañana }, " ", { target: voy a ir }, " al médico."], tr: { en: "Tomorrow I'm going to go to the doctor's.", uk: "Завтра я збираюся піти до лікаря." } }
          - { level: A2, signal: esta noche, ex: [{ signal: Esta noche }, " ", { target: vamos a ver }, " una película."], tr: { en: "Tonight we're going to watch a film.", uk: "Сьогодні ввечері ми збираємося подивитися фільм." } }
          - { level: A2, signal: el año que viene, ex: [{ signal: El año que viene }, " ", { target: voy a aprender }, " a nadar."], tr: { en: "Next year I'm going to learn to swim.", uk: "Наступного року я збираюся навчитися плавати." } }
          - { level: A2, signal: pronto, ex: [{ signal: Pronto }, " ", { target: van a abrir }, " la tienda."], tr: { en: "They're going to open the shop soon.", uk: "Незабаром вони відкриють крамницю." } }

  - title: { en: Pronouns, es: Los pronombres, uk: Займенники }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["An object or reflexive pronoun goes before ", { term: ir }, ", or joins the end of the infinitive:"]
              es: ["Un pronombre de objeto o reflexivo va delante de ", { term: ir }, ", o se une al final del infinitivo:"]
              uk: ["Займенник-додаток або зворотний займенник ставлять перед ", { term: ir }, " або приєднують у кінці інфінітива:"]
            ex: { examples: [[{ target: Te voy a llamar }, "."], [{ target: Voy a llamarte }, "."]] }
            tr: { en: { examples: ["I'm going to call you.", "I'm going to call you."] }, uk: { examples: ["Я тобі подзвоню.", "Я тобі подзвоню."] } }
          - type: rule
            level: A2
            text:
              en: "Both orders mean the same:"
              es: "Los dos órdenes significan lo mismo:"
              uk: "Обидва порядки мають однакове значення:"
            ex: { examples: [[{ target: Me voy a duchar }, "."], [{ target: Voy a ducharme }, "."]] }
            tr: { en: { examples: ["I'm going to have a shower.", "I'm going to have a shower."] }, uk: { examples: ["Я збираюся прийняти душ.", "Я збираюся прийняти душ."] } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: Типові помилки }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Voy comprar pan., right: ["Voy ", { target: a }, " comprar pan."], rule: { en: ["the pattern always keeps ", { term: a }], es: ["la estructura siempre lleva ", { term: a }], uk: ["у цій конструкції завжди є ", { term: a }] } }
          - { level: A2, wrong: Voy a compro pan., right: ["Voy a ", { target: comprar }, " pan."], rule: { en: ["after ", { term: a }, ", the verb stays in the infinitive"], es: ["detrás de ", { term: a }, ", el verbo va en infinitivo"], uk: ["після ", { term: a }, " дієслово стоїть в інфінітиві"] } }
          - { level: A2, wrong: Yo va a estudiar., right: ["Yo ", { target: voy }, " a estudiar."], rule: { en: [{ term: ir }, " changes with the person"], es: [{ term: ir }, " cambia con la persona"], uk: [{ term: ir }, " змінюється за особами"] } }
          - { level: A2, wrong: Voy a te llamar., right: [{ target: Te }, " voy a llamar."], rule: { en: ["the pronoun goes before ", { term: voy }, " or after the infinitive"], es: ["el pronombre va delante de ", { term: voy }, " o detrás del infinitivo"], uk: ["займенник ставлять перед ", { term: voy }, " або після інфінітива"] } }
          - { level: A2, speakers: [en], wrong: Estoy yendo a estudiar., right: [{ target: Voy a estudiar }, "."], rule: { en: ["“I'm going to” is ", { term: voy a }, ", not ", { term: estoy yendo a }] } }
