title: { es: "El futuro perfecto: habré comido", en: "Future Perfect: habré comido", uk: "Майбутній перфект: habré comido", pt: "O futuro perfeito: habré comido", fr: "Le futur antérieur : habré comido", de: "Das Futur II: habré comido", it: "Il futuro anteriore: habré comido", pl: "Czas przyszły uprzedni: habré comido", tr: "Tamamlanmış gelecek zaman: habré comido", id: "Masa depan sempurna: habré comido", vi: "Thì tương lai hoàn thành: habré comido" }
summary:
  lead:
    es: ["El futuro perfecto, ", { term: habré }, " con un participio, presenta una acción terminada antes de un momento futuro y suposiciones sobre el pasado."]
    en: ["The future perfect, ", { term: habré }, " with a participle, presents an action finished before a future moment, and guesses about the past."]
    uk: ["Майбутній перфект, тобто ", { term: habré }, " з дієприкметником, подає дію, завершену до певного моменту в майбутньому, та припущення про минуле."]
    pt: ["O futuro perfeito, ", { term: habré }, " com um particípio, apresenta uma ação concluída antes de um momento futuro e suposições sobre o passado."]
    fr: ["Le futur antérieur, ", { term: habré }, " avec un participe passé, présente une action terminée avant un moment futur et des suppositions sur le passé."]
    de: ["Das Futur II, ", { term: habré }, " mit einem Partizip, stellt eine Handlung dar, die vor einem künftigen Zeitpunkt abgeschlossen ist, und Vermutungen über die Vergangenheit."]
    it: ["Il futuro anteriore, ", { term: habré }, " più un participio, presenta un'azione conclusa prima di un momento futuro e supposizioni sul passato."]
    pl: ["Czas przyszły uprzedni, czyli ", { term: habré }, " z imiesłowem, przedstawia czynność zakończoną przed pewnym momentem w przyszłości oraz przypuszczenia o przeszłości."]
    tr: ["Tamamlanmış gelecek zaman, yani ", { term: habré }, " ile bir participio, gelecekteki bir andan önce bitmiş bir eylemi ve geçmişle ilgili varsayımları anlatır."]
    id: ["Masa depan sempurna, yaitu ", { term: habré }, " dengan participio, menyatakan tindakan yang selesai sebelum suatu saat di masa depan, serta dugaan tentang masa lalu."]
    vi: ["Thì tương lai hoàn thành, ", { term: habré }, " cộng quá khứ phân từ, nói về hành động xong trước một mốc tương lai và phỏng đoán về quá khứ."]
  rule:
    es: "La acción termina antes de otro momento futuro, y el participio no cambia:"
    en: "The action ends before another future moment, and the participle does not change:"
    uk: "Дія завершується до іншого моменту в майбутньому, а дієприкметник не змінюється:"
    pt: "A ação termina antes de outro momento futuro, e o particípio não muda:"
    fr: "L’action se termine avant un autre moment futur, et le participe passé ne change pas :"
    de: "Die Handlung endet vor einem anderen künftigen Zeitpunkt, und das Partizip ändert sich nicht:"
    it: "L'azione finisce prima di un altro momento futuro, e il participio non cambia:"
    pl: "Czynność kończy się przed innym momentem w przyszłości, a imiesłów się nie zmienia:"
    tr: "Eylem, gelecekteki başka bir andan önce biter ve participio değişmez:"
    id: "Tindakan selesai sebelum saat lain di masa depan, dan participio tidak berubah:"
    vi: "Hành động xong trước một mốc tương lai khác, và quá khứ phân từ không đổi:"
  ex: ["Para el viernes ya ", { target: habré terminado }, "."]

