sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "Tiene dos valores: una acción terminada antes de un momento futuro y una suposición sobre el pasado."
              en: "It has two values: an action finished before a future moment, and a guess about the past."
              uk: "Має два значення: дія, завершена до певного моменту в майбутньому, і припущення про минуле."
              pt: "Tem dois valores: uma ação concluída antes de um momento futuro e uma suposição sobre o passado."
              fr: "Il a deux valeurs : une action terminée avant un moment futur et une supposition sur le passé."
              de: "Es hat zwei Bedeutungen: eine Handlung, die vor einem künftigen Zeitpunkt abgeschlossen ist, und eine Vermutung über die Vergangenheit."
              it: "Ha due valori: un'azione conclusa prima di un momento futuro e una supposizione sul passato."
              pl: "Ma dwa znaczenia: czynność zakończona przed pewnym momentem w przyszłości oraz przypuszczenie o przeszłości."
              tr: "İki anlamı vardır: gelecekteki bir andan önce bitmiş bir eylem ve geçmişle ilgili bir varsayım."
              id: "Ada dua makna: tindakan yang selesai sebelum suatu saat di masa depan, dan dugaan tentang masa lalu."
              vi: "Có hai nghĩa: hành động đã xong trước một thời điểm trong tương lai, và phỏng đoán về quá khứ."
            ex: { examples: [["Para el viernes ya ", { target: habré terminado }, "."], [{ target: Habrán llegado }, " ya."]] }
            tr: { en: { examples: ["I will have finished by Friday.", "They must have arrived by now."] }, uk: { examples: ["До п’ятниці я вже закінчу.", "Вони вже, мабуть, приїхали."] }, pt: { examples: ["Até sexta eu já terei terminado.", "Eles já devem ter chegado."] }, fr: { examples: ["Pour vendredi, j’aurai déjà terminé.", "Ils sont sûrement déjà arrivés."] }, de: { examples: ["Bis Freitag bin ich fertig.", "Sie sind wohl schon angekommen."] }, it: { examples: ["Per venerdì avrò già finito.", "Saranno già arrivati."] }, pl: { examples: ["Do piątku już skończę.", "Pewnie już dojechali."] }, tr: { examples: ["Cumaya kadar bitirmiş olacağım.", "Herhalde şimdiye kadar varmışlardır."] }, id: { examples: ["Hari Jumat nanti saya sudah selesai.", "Mereka mungkin sudah tiba."] }, vi: { examples: ["Đến thứ Sáu tôi đã làm xong.", "Chắc họ đã đến rồi."] } }
          - type: note
            level: B2
            text:
              es: ["Las gramáticas lo llaman también ", { term: futuro compuesto }, " o ", { term: antefuturo }, "."]
              en: ["Grammars also call it ", { term: futuro compuesto }, " or ", { term: antefuturo }, "."]
              uk: ["Граматики називають його також ", { term: futuro compuesto }, " або ", { term: antefuturo }, "."]
              pt: ["As gramáticas também o chamam de ", { term: futuro compuesto }, " ou ", { term: antefuturo }, "."]
              fr: ["Les grammaires l’appellent aussi ", { term: futuro compuesto }, " ou ", { term: antefuturo }, "."]
              de: ["Die Grammatiken nennen es auch ", { term: futuro compuesto }, " oder ", { term: antefuturo }, "."]
              it: ["Le grammatiche lo chiamano anche ", { term: futuro compuesto }, " o ", { term: antefuturo }, "."]
              pl: ["Gramatyki nazywają go też ", { term: futuro compuesto }, " lub ", { term: antefuturo }, "."]
              tr: ["Dil bilgisi kitaplarında ", { term: futuro compuesto }, " veya ", { term: antefuturo }, " adıyla da geçer."]
              id: ["Buku tata bahasa juga menyebutnya ", { term: futuro compuesto }, " atau ", { term: antefuturo }, "."]
              vi: ["Các sách ngữ pháp còn gọi nó là ", { term: futuro compuesto }, " hoặc ", { term: antefuturo }, "."]
          - type: note
            level: B2
            text:
              es: [{ term: habré }, " tiene la raíz ", { term: habr- }, " del futuro de ", { term: haber }, ": ver ", { link: El futuro simple, to: es.futuro-condicional.futuro-simple }, "."]
              en: [{ term: habré }, " has the stem ", { term: habr- }, " of the future of ", { term: haber }, ": see ", { link: Simple Future, to: es.futuro-condicional.futuro-simple }, "."]
              uk: [{ term: habré }, " має основу ", { term: habr- }, " з майбутнього часу ", { term: haber }, ": див. ", { link: Простий майбутній час, to: es.futuro-condicional.futuro-simple }, "."]
              pt: [{ term: habré }, " tem o radical ", { term: habr- }, " do futuro de ", { term: haber }, ": veja ", { link: "O futuro simples", to: es.futuro-condicional.futuro-simple }, "."]
              fr: [{ term: habré }, " a pour radical ", { term: habr- }, ", celui du futur de ", { term: haber }, " : voir ", { link: "Le futur simple", to: es.futuro-condicional.futuro-simple }, "."]
              de: [{ term: habré }, " hat den Stamm ", { term: habr- }, " aus dem Futur von ", { term: haber }, ": siehe ", { link: "Das Futur I", to: es.futuro-condicional.futuro-simple }, "."]
              it: [{ term: habré }, " ha la radice ", { term: habr- }, " del futuro di ", { term: haber }, ": vedi ", { link: "Il futuro semplice", to: es.futuro-condicional.futuro-simple }, "."]
              pl: [{ term: habré }, " ma temat ", { term: habr- }, " z czasu przyszłego czasownika ", { term: haber }, ": zob. ", { link: "Czas przyszły prosty", to: es.futuro-condicional.futuro-simple }, "."]
              tr: [{ term: habré }, ", ", { term: haber }, " fiilinin gelecek zamandaki ", { term: habr- }, " gövdesini taşır: bkz. ", { link: "Basit gelecek zaman", to: es.futuro-condicional.futuro-simple }, "."]
              id: [{ term: habré }, " memiliki akar kata ", { term: habr- }, " dari bentuk masa depan ", { term: haber }, ": lihat ", { link: "Masa depan sederhana", to: es.futuro-condicional.futuro-simple }, "."]
              vi: [{ term: habré }, " có gốc ", { term: habr- }, " của thì tương lai của ", { term: haber }, ": xem ", { link: "Thì tương lai đơn", to: es.futuro-condicional.futuro-simple }, "."]

