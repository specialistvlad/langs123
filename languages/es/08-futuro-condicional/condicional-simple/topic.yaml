title: { en: "Conditional: comería", es: "El condicional simple: comería", uk: "Умовний спосіб: comería", pt: "O condicional simples: comería", fr: "Le conditionnel présent : comería", de: "Der Konditional I: comería", it: "Il condizionale semplice: comería", pl: "Tryb warunkowy: comería", tr: "Basit koşul kipi: comería", id: "Kondisional sederhana: comería", vi: "Thức điều kiện đơn: comería" }
summary:
  lead:
    en: ["The conditional adds ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " to the infinitive for polite requests, advice and wishes."]
    es: ["El condicional añade ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " al infinitivo para pedir con cortesía, aconsejar y desear."]
    uk: ["Умовний спосіб додає до інфінітива ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, ", щоб чемно попросити, порадити чи висловити бажання."]
    pt: ["O condicional acrescenta ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " ao infinitivo para pedidos educados, conselhos e desejos."]
    fr: ["Le conditionnel ajoute ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " à l’infinitif pour demander poliment, conseiller et exprimer un souhait."]
    de: ["Der Konditional hängt ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " an den Infinitiv, für höfliche Bitten, Ratschläge und Wünsche."]
    it: ["Il condizionale aggiunge ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " all'infinito per richieste cortesi, consigli e desideri."]
    pl: ["Tryb warunkowy dodaje do bezokolicznika ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, ", aby grzecznie prosić, radzić i wyrażać życzenia."]
    tr: ["Koşul kipi, nazik rica, tavsiye ve dilek için mastara ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " ekler."]
    id: ["Kondisional menambahkan ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " pada infinitif untuk permintaan sopan, saran, dan keinginan."]
    vi: ["Thức điều kiện thêm ", { alternatives: [{ term: "-ía" }, { term: "-ías" }, { term: "-íamos" }, { term: "-ían" }] }, " vào động từ nguyên mẫu để đưa ra yêu cầu lịch sự, lời khuyên và mong muốn."]
  rule:
    en: ["The conditional takes the stems of the future, so ", { term: tener }, " gives ", { term: tendría }, ":"]
    es: ["El condicional usa las raíces del futuro, así que ", { term: tener }, " da ", { term: tendría }, ":"]
    uk: ["Умовний спосіб бере основи майбутнього часу, тож ", { term: tener }, " дає ", { term: tendría }, ":"]
    pt: ["O condicional usa os radicais do futuro; por isso ", { term: tener }, " dá ", { term: tendría }, ":"]
    fr: ["Le conditionnel prend les radicaux du futur, donc ", { term: tener }, " donne ", { term: tendría }, " :"]
    de: ["Der Konditional nimmt die Stämme des Futurs, darum wird aus ", { term: tener }, " ", { term: tendría }, ":"]
    it: ["Il condizionale usa le radici del futuro, perciò ", { term: tener }, " dà ", { term: tendría }, ":"]
    pl: ["Tryb warunkowy używa tematów czasu przyszłego, więc ", { term: tener }, " daje ", { term: tendría }, ":"]
    tr: ["Koşul kipi gelecek zamanın gövdelerini kullanır, bu yüzden ", { term: tener }, " fiilinden ", { term: tendría }, " olur:"]
    id: ["Kondisional memakai akar kata masa depan, jadi ", { term: tener }, " menjadi ", { term: tendría }, ":"]
    vi: ["Thức điều kiện dùng gốc của thì tương lai, nên ", { term: tener }, " thành ", { term: tendría }, ":"]
  ex: { examples: [["¿", { target: Podrías }, " ayudarme?"], ["Yo no ", { target: tendría }, " miedo."]] }

