sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The conditional is one word: the infinitive and an ending."
              es: "El condicional es una sola palabra: el infinitivo y una terminación."
              uk: "Умовний спосіб — це одне слово: інфінітив і закінчення."
              pt: "O condicional é uma só palavra: o infinitivo e uma terminação."
              fr: "Le conditionnel est un seul mot : l’infinitif et une terminaison."
              de: "Der Konditional ist ein einziges Wort: der Infinitiv und eine Endung."
              it: "Il condizionale è una sola parola: l'infinito e una desinenza."
              pl: "Tryb warunkowy to jedno słowo: bezokolicznik i końcówka."
              tr: "Koşul kipi tek bir sözcüktür: mastar ve bir ek."
              id: "Kondisional adalah satu kata: infinitif dan satu akhiran."
              vi: "Thức điều kiện là một từ duy nhất: động từ nguyên mẫu cộng với một đuôi."
          - type: rule
            level: B1
            text:
              en: "It softens what is said: a polite request, advice or a wish."
              es: "Suaviza lo que se dice: una petición cortés, un consejo o un deseo."
              uk: "Він пом’якшує сказане: чемне прохання, пораду чи бажання."
              pt: "Suaviza o que se diz: um pedido educado, um conselho ou um desejo."
              fr: "Il adoucit ce qu’on dit : une demande polie, un conseil ou un souhait."
              de: "Er macht das Gesagte weicher: eine höfliche Bitte, einen Rat oder einen Wunsch."
              it: "Attenua ciò che si dice: una richiesta cortese, un consiglio o un desiderio."
              pl: "Łagodzi wypowiedź: uprzejmą prośbę, radę lub życzenie."
              tr: "Söylenen şeyi yumuşatır: nazik bir rica, bir tavsiye ya da bir dilek."
              id: "Kondisional melunakkan ucapan: permintaan sopan, saran, atau keinginan."
              vi: "Nó làm lời nói nhẹ nhàng hơn: một yêu cầu lịch sự, một lời khuyên hoặc một mong muốn."
          - type: note
            level: B1
            text:
              en: ["The same irregular stems: ", { link: Simple Future, to: es.futuro-condicional.futuro-simple }, "."]
              es: ["Las mismas raíces irregulares: ", { link: El futuro simple, to: es.futuro-condicional.futuro-simple }, "."]
              uk: ["Ті самі неправильні основи: ", { link: Простий майбутній час, to: es.futuro-condicional.futuro-simple }, "."]
              pt: ["Os mesmos radicais irregulares: ", { link: "O futuro simples", to: es.futuro-condicional.futuro-simple }, "."]
              fr: ["Les mêmes radicaux irréguliers : ", { link: "Le futur simple", to: es.futuro-condicional.futuro-simple }, "."]
              de: ["Dieselben unregelmäßigen Stämme: ", { link: "Das Futur I", to: es.futuro-condicional.futuro-simple }, "."]
              it: ["Le stesse radici irregolari: ", { link: "Il futuro semplice", to: es.futuro-condicional.futuro-simple }, "."]
              pl: ["Te same tematy nieregularne: ", { link: "Czas przyszły prosty", to: es.futuro-condicional.futuro-simple }, "."]
              tr: ["Aynı düzensiz gövdeler: ", { link: "Basit gelecek zaman", to: es.futuro-condicional.futuro-simple }, "."]
              id: ["Akar kata tak beraturan yang sama: ", { link: "Masa depan sederhana", to: es.futuro-condicional.futuro-simple }, "."]
              vi: ["Cùng những gốc động từ bất quy tắc: ", { link: "Thì tương lai đơn", to: es.futuro-condicional.futuro-simple }, "."]
          - type: note
            level: B1
            readers: [uk]
            text:
              uk: ["Український умовний спосіб — це минулий час із ", { l1: "би" }, ": ", { l1: "я б хотів" }, " — ", { term: "me gustaría" }, ", ", { l1: "ти б міг" }, " — ", { term: "podrías" }, ". Іспанська має для цього окрему форму на ", { ending: "-ía" }, "."]

  - title: { en: "Form: regular verbs", es: "Forma: verbos regulares", uk: "Форма: правильні дієслова", pt: "Forma: verbos regulares", fr: "Forme : verbes réguliers", de: "Form: regelmäßige Verben", it: "Forma: verbi regolari", pl: "Forma: czasowniki regularne", tr: "Biçim: düzenli fiiller", id: "Bentuk: kata kerja beraturan", vi: "Dạng: động từ có quy tắc" }
    role: form
    features: { mood: cond }
    content:
      - type: paradigm
        columns:
          - { key: person, label: { en: Person, es: Persona, uk: Особа, pt: "Pessoa", fr: "Personne", de: "Person", it: "Persona", pl: "Osoba", tr: "Kişi", id: "Orang", vi: "Ngôi" } }
          - { key: ar, label: hablar }
          - { key: er, label: comer }
          - { key: ir, label: vivir }
        rows:
          - { level: B1, features: { person: 1, number: sg }, person: yo, ar: ["hablar", { ending: ía }], er: ["comer", { ending: ía }], ir: ["vivir", { ending: ía }] }
          - { level: B1, features: { person: 2, number: sg, politeness: infm }, person: tú, ar: ["hablar", { ending: ías }], er: ["comer", { ending: ías }], ir: ["vivir", { ending: ías }] }
          - { level: B1, features: [{ person: 3, number: sg }, { person: 2, number: sg, politeness: form }], person: { alternatives: [él, ella, usted] }, ar: ["hablar", { ending: ía }], er: ["comer", { ending: ía }], ir: ["vivir", { ending: ía }] }
          - { level: B1, features: { person: 1, number: pl }, person: { alternatives: [nosotros, nosotras] }, ar: ["hablar", { ending: íamos }], er: ["comer", { ending: íamos }], ir: ["vivir", { ending: íamos }] }
          - { level: B1, variety: es-ES, features: { person: 2, number: pl, politeness: infm }, person: { alternatives: [vosotros, vosotras] }, ar: ["hablar", { ending: íais }], er: ["comer", { ending: íais }], ir: ["vivir", { ending: íais }] }
          - { level: B1, features: [{ person: 3, number: pl }, { person: 2, number: pl }], person: { alternatives: [ellos, ellas, ustedes] }, ar: ["hablar", { ending: ían }], er: ["comer", { ending: ían }], ir: ["vivir", { ending: ían }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["Verbs in ", { term: "-ar" }, ", ", { term: "-er" }, " and ", { term: "-ir" }, " share the same endings, and every one carries a written accent on ", { term: í }, "."]
              es: ["Los verbos en ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " comparten las terminaciones, y todas llevan tilde en la ", { term: í }, "."]
              uk: ["Дієслова на ", { term: "-ar" }, ", ", { term: "-er" }, " та ", { term: "-ir" }, " мають однакові закінчення, і в кожному є знак наголосу на ", { term: í }, "."]
              pt: ["Os verbos em ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " têm as mesmas terminações, e todas levam acento gráfico no ", { term: í }, "."]
              fr: ["Les verbes en ", { term: "-ar" }, ", ", { term: "-er" }, " et ", { term: "-ir" }, " ont les mêmes terminaisons, et chacune porte un accent écrit sur le ", { term: í }, "."]
              de: ["Verben auf ", { term: "-ar" }, ", ", { term: "-er" }, " und ", { term: "-ir" }, " haben dieselben Endungen, und jede trägt einen Akzent auf dem ", { term: í }, "."]
              it: ["I verbi in ", { term: "-ar" }, ", ", { term: "-er" }, " e ", { term: "-ir" }, " hanno le stesse desinenze, e ognuna porta l'accento scritto sulla ", { term: í }, "."]
              pl: ["Czasowniki na ", { term: "-ar" }, ", ", { term: "-er" }, " i ", { term: "-ir" }, " mają te same końcówki, a każda ma akcent graficzny na ", { term: í }, "."]
              tr: [{ term: "-ar" }, ", ", { term: "-er" }, " ve ", { term: "-ir" }, " ile biten fiillerin ekleri aynıdır ve her birinde ", { term: í }, " üzerinde vurgu işareti vardır."]
              id: ["Kata kerja berakhiran ", { term: "-ar" }, ", ", { term: "-er" }, ", dan ", { term: "-ir" }, " memakai akhiran yang sama, dan semuanya bertanda aksen pada ", { term: í }, "."]
              vi: ["Động từ tận cùng bằng ", { term: "-ar" }, ", ", { term: "-er" }, " và ", { term: "-ir" }, " có cùng đuôi, và đuôi nào cũng có dấu sắc trên chữ ", { term: í }, "."]
          - type: rule
            level: B1
            text:
              en: ["The forms of ", { term: yo }, " and ", { term: él }, " are the same, so the subject often appears:"]
              es: ["Las formas de ", { term: yo }, " y de ", { term: él }, " son iguales, por eso el sujeto suele aparecer:"]
              uk: ["Форми ", { term: yo }, " та ", { term: él }, " однакові, тому підмет часто вживають:"]
              pt: ["As formas de ", { term: yo }, " e ", { term: él }, " são iguais, por isso o sujeito costuma aparecer:"]
              fr: ["Les formes de ", { term: yo }, " et ", { term: él }, " sont identiques, donc le sujet est souvent exprimé :"]
              de: ["Die Formen von ", { term: yo }, " und ", { term: él }, " sind gleich, deshalb steht das Subjekt oft dabei:"]
              it: ["Le forme di ", { term: yo }, " e ", { term: él }, " sono uguali, perciò il soggetto compare spesso:"]
              pl: ["Formy ", { term: yo }, " i ", { term: él }, " są takie same, dlatego podmiot często się pojawia:"]
              tr: [{ term: yo }, " ve ", { term: él }, " biçimleri aynıdır, bu yüzden özne sık sık söylenir:"]
              id: ["Bentuk ", { term: yo }, " dan ", { term: él }, " sama, jadi subjek sering disebutkan:"]
              vi: ["Dạng của ", { term: yo }, " và ", { term: él }, " giống nhau, nên chủ ngữ thường được nói ra:"]
            ex: ["Ella ", { target: hablaría }, " con él."]
            tr: { en: She would talk to him., uk: "Вона поговорила б із ним.", pt: "Ela falaria com ele.", fr: "Elle lui parlerait.", de: "Sie würde mit ihm sprechen.", it: "Lei parlerebbe con lui.", pl: "Ona porozmawiałaby z nim.", tr: "O onunla konuşurdu.", id: "Dia akan berbicara dengannya.", vi: "Cô ấy sẽ nói chuyện với anh ấy." }

  - title: { en: "Form: irregular verbs", es: "Forma: verbos irregulares", uk: "Форма: неправильні дієслова", pt: "Forma: verbos irregulares", fr: "Forme : verbes irréguliers", de: "Form: unregelmäßige Verben", it: "Forma: verbi irregolari", pl: "Forma: czasowniki nieregularne", tr: "Biçim: düzensiz fiiller", id: "Bentuk: kata kerja tak beraturan", vi: "Dạng: động từ bất quy tắc" }
    role: form
    features: { mood: cond }
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb, es: Verbo, uk: Дієслово, pt: "Verbo", fr: "Verbe", de: "Verb", it: "Verbo", pl: "Czasownik", tr: "Fiil", id: "Kata kerja", vi: "Động từ" } }
          - { key: stem, label: { en: Stem, es: Raíz, uk: Основа, pt: "Radical", fr: "Radical", de: "Stamm", it: "Radice", pl: "Temat", tr: "Gövde", id: "Akar kata", vi: "Gốc động từ" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: Приклад, pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: B1, verb: tener, stem: "tendr-", ex: ["Yo no ", { target: tendría }, " miedo."], tr: { en: "I wouldn't be afraid.", uk: "Я б не боявся.", pt: "Eu não teria medo.", fr: "Je n’aurais pas peur.", de: "Ich hätte keine Angst.", it: "Io non avrei paura.", pl: "Nie bałbym się.", tr: "Ben korkmazdım.", id: "Saya tidak akan takut.", vi: "Tôi sẽ không sợ." } }
          - { level: B1, verb: poder, stem: "podr-", ex: ["¿", { target: Podrías }, " repetir?"], tr: { en: Could you say that again?, uk: "Чи не міг би ти повторити?", pt: "Você poderia repetir?", fr: "Pourrais-tu répéter ?", de: "Könntest du das wiederholen?", it: "Potresti ripetere?", pl: "Czy mógłbyś powtórzyć?", tr: "Tekrar edebilir misin?", id: "Bisakah kamu mengulanginya?", vi: "Bạn có thể nhắc lại được không?" } }
          - { level: B1, verb: salir, stem: "saldr-", ex: ["Con este tiempo, no ", { target: saldría }, "."], tr: { en: "In this weather, I wouldn't go out.", uk: "У таку погоду я б не виходив.", pt: "Com este tempo, eu não sairia.", fr: "Par ce temps, je ne sortirais pas.", de: "Bei diesem Wetter würde ich nicht rausgehen.", it: "Con questo tempo non uscirei.", pl: "W taką pogodę nie wyszedłbym.", tr: "Bu havada dışarı çıkmazdım.", id: "Dengan cuaca seperti ini, saya tidak akan keluar.", vi: "Với thời tiết này, tôi sẽ không ra ngoài." } }
          - { level: B1, verb: poner, stem: "pondr-", ex: ["¿Dónde ", { target: pondrías }, " la mesa?"], tr: { en: Where would you put the table?, uk: "Де б ти поставив стіл?", pt: "Onde você colocaria a mesa?", fr: "Où mettrais-tu la table ?", de: "Wohin würdest du den Tisch stellen?", it: "Dove metteresti il tavolo?", pl: "Gdzie postawiłbyś stół?", tr: "Masayı nereye koyardın?", id: "Di mana kamu akan menaruh meja itu?", vi: "Bạn sẽ đặt cái bàn ở đâu?" } }
          - { level: B1, verb: venir, stem: "vendr-", ex: ["¿", { target: Vendrías }, " conmigo?"], tr: { en: Would you come with me?, uk: "Ти пішов би зі мною?", pt: "Você viria comigo?", fr: "Viendrais-tu avec moi ?", de: "Würdest du mit mir kommen?", it: "Verresti con me?", pl: "Poszedłbyś ze mną?", tr: "Benimle gelir misin?", id: "Maukah kamu ikut denganku?", vi: "Bạn có đi cùng tôi không?" } }
          - { level: B1, verb: hacer, stem: "har-", ex: ["¿Qué ", { target: harías }, " tú?"], tr: { en: What would you do?, uk: "А що зробив би ти?", pt: "O que você faria?", fr: "Que ferais-tu, toi ?", de: "Was würdest du tun?", it: "Tu che cosa faresti?", pl: "A co ty byś zrobił?", tr: "Sen ne yapardın?", id: "Kalau kamu, apa yang akan kamu lakukan?", vi: "Còn bạn, bạn sẽ làm gì?" } }
          - { level: B1, verb: decir, stem: "dir-", ex: ["Yo no ", { target: diría }, " eso."], tr: { en: "I wouldn't say that.", uk: "Я б такого не сказав.", pt: "Eu não diria isso.", fr: "Je ne dirais pas ça.", de: "Das würde ich nicht sagen.", it: "Io non direi questo.", pl: "Nie powiedziałbym tego.", tr: "Ben bunu söylemezdim.", id: "Saya tidak akan mengatakan itu.", vi: "Tôi sẽ không nói thế." } }
          - { level: B1, verb: querer, stem: "querr-", ex: [{ target: Querría }, " hablar con el director."], tr: { en: "I'd like to speak to the director.", uk: "Я хотів би поговорити з директором.", pt: "Eu gostaria de falar com o diretor.", fr: "Je voudrais parler au directeur.", de: "Ich würde gern mit dem Direktor sprechen.", it: "Vorrei parlare con il direttore.", pl: "Chciałbym porozmawiać z dyrektorem.", tr: "Müdürle görüşmek isterdim.", id: "Saya ingin berbicara dengan direktur.", vi: "Tôi muốn nói chuyện với giám đốc." } }
          - { level: B1, verb: saber, stem: "sabr-", ex: ["No ", { target: sabría }, " qué decir."], tr: { en: "I wouldn't know what to say.", uk: "Я не знав би, що сказати.", pt: "Eu não saberia o que dizer.", fr: "Je ne saurais pas quoi dire.", de: "Ich wüsste nicht, was ich sagen soll.", it: "Non saprei che cosa dire.", pl: "Nie wiedziałbym, co powiedzieć.", tr: "Ne diyeceğimi bilemezdim.", id: "Saya tidak akan tahu harus berkata apa.", vi: "Tôi sẽ không biết nói gì." } }
          - { level: B1, verb: haber, stem: "habr-", ex: ["¿", { target: Habría }, " otra opción?"], tr: { en: Would there be another option?, uk: "Чи знайшовся б інший варіант?", pt: "Haveria outra opção?", fr: "Y aurait-il une autre option ?", de: "Gäbe es eine andere Möglichkeit?", it: "Ci sarebbe un'altra opzione?", pl: "Czy byłaby inna opcja?", tr: "Başka bir seçenek olur muydu?", id: "Apakah akan ada pilihan lain?", vi: "Liệu có lựa chọn nào khác không?" } }

