sections:
  - title: { en: Overview, es: Visión general, uk: Огляд, pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "The conditional is one word: the infinitive and an ending."
              es: "El condicional es una sola palabra: el infinitivo y una terminación."
              uk: "Умовний спосіб — це одне слово: інфінітив і закінчення."
              pt: "O condicional é uma só palavra: o infinitivo e uma terminação."
              fr: "Le conditionnel est un seul mot : l’infinitif et une terminaison."
              de: "Der Konditional ist ein einziges Wort: der Infinitiv und eine Endung."
              it: "Il condizionale è una sola parola: l'infinito e una desinenza."
              pl: "Tryb warunkowy to jedno słowo: bezokolicznik i końcówka."
              tr: "Koşul kipi tek bir sözcüktür: mastar ve bir ek."
              id: "Kondisional adalah satu kata: infinitif dan satu akhiran."
              vi: "Thức điều kiện là một từ duy nhất: động từ nguyên mẫu cộng với một đuôi."
          - type: rule
            level: B1
            text:
              en: "It softens what is said: a polite request, advice or a wish."
              es: "Suaviza lo que se dice: una petición cortés, un consejo o un deseo."
              uk: "Він пом’якшує сказане: чемне прохання, пораду чи бажання."
              pt: "Suaviza o que se diz: um pedido educado, um conselho ou um desejo."
              fr: "Il adoucit ce qu’on dit : une demande polie, un conseil ou un souhait."
