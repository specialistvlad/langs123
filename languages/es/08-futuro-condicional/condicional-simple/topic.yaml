          ex: { examples: [["El ministro ", { target: dejaría }, " el cargo."], ["¿No ", { target: creerías }, " que fue a propósito?"]] }
          tr: { en: { examples: ["The minister is reported to be stepping down.", "Wouldn't you think it was on purpose?"] }, uk: { examples: ["Міністр, за повідомленнями, залишає посаду.", "Хіба ти не подумаєш, що це було навмисне?"] }, pt: { examples: ["O ministro deixaria o cargo.", "Você não acharia que foi de propósito?"] }, fr: { examples: ["Le ministre quitterait ses fonctions.", "Ne croirais-tu pas que c’était exprès ?"] }, de: { examples: ["Der Minister soll sein Amt niederlegen.", "Würdest du nicht glauben, dass es Absicht war?"] }, it: { examples: ["Il ministro lascerebbe l'incarico.", "Non penseresti che sia stato di proposito?"] }, pl: { examples: ["Minister miałby ustąpić ze stanowiska.", "Czy nie pomyślałbyś, że to było celowo?"] }, tr: { examples: ["Bakanın görevi bırakacağı bildiriliyor.", "Bunun kasıtlı olduğunu düşünmez miydin?"] }, id: { examples: ["Menteri itu dikabarkan akan meninggalkan jabatannya.", "Bukankah kamu akan mengira itu disengaja?"] }, vi: { examples: ["Bộ trưởng được cho là sẽ rời chức.", "Chẳng lẽ bạn không nghĩ đó là cố ý sao?"] } }
