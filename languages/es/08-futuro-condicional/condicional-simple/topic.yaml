              fr: ["Les formes de ", { term: yo }, " et ", { term: él }, " sont identiques, donc le sujet est souvent exprimé :"]
              de: ["Die Formen von ", { term: yo }, " und ", { term: él }, " sind gleich, deshalb steht das Subjekt oft dabei:"]
              it: ["Le forme di ", { term: yo }, " e ", { term: él }, " sono uguali, perciò il soggetto compare spesso:"]
              pl: ["Formy ", { term: yo }, " i ", { term: él }, " są takie same, dlatego podmiot często się pojawia:"]
