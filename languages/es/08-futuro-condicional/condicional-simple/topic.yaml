              id: ["Bentuk ", { term: yo }, " dan ", { term: él }, " sama, jadi subjek sering disebutkan:"]
              vi: ["Dạng của ", { term: yo }, " và ", { term: él }, " giống nhau, nên chủ ngữ thường được nói ra:"]
            ex: ["Ella ", { target: hablaría }, " con él."]
            tr: { en: She would talk to him., uk: "Вона поговорила б із ним.", pt: "Ela falaria com ele.", fr: "Elle lui parlerait.", de: "Sie würde mit ihm sprechen.", it: "Lei parlerebbe con lui.", pl: "Ona porozmawiałaby z nim.", tr: "O onunla konuşurdu.", id: "Dia akan berbicara dengannya.", vi: "Cô ấy sẽ nói chuyện với anh ấy." }

