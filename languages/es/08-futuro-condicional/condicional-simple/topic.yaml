        rows:
          - { level: B1, use: { en: A polite request, es: Una petición cortés, uk: Чемне прохання, pt: "Um pedido educado", fr: "Une demande polie", de: "Eine höfliche Bitte", it: "Una richiesta cortese", pl: "Uprzejma prośba", tr: "Nazik rica", id: "Permintaan sopan", vi: "Yêu cầu lịch sự" }, ex: ["¿", { target: Podría }, " ayudarme?"], tr: { en: Could you help me?, uk: "Чи не могли б ви мені допомогти?", pt: "O senhor poderia me ajudar?", fr: "Pourriez-vous m’aider ?", de: "Könnten Sie mir helfen?", it: "Potrebbe aiutarmi?", pl: "Czy mógłby mi pan pomóc?", tr: "Bana yardım edebilir misiniz?", id: "Bisakah Anda membantu saya?", vi: "Bạn có thể giúp tôi được không?" } }
          - { level: B1, use: { en: A wish, es: Un deseo, uk: Бажання, pt: "Um desejo", fr: "Un souhait", de: "Ein Wunsch", it: "Un desiderio", pl: "Życzenie", tr: "Dilek", id: "Keinginan", vi: "Mong muốn" }, ex: [{ target: Me encantaría }, " conocer Chile."], tr: { en: "I'd love to visit Chile.", uk: "Я дуже хотів би побувати в Чилі.", pt: "Eu adoraria conhecer o Chile.", fr: "J’adorerais découvrir le Chili.", de: "Ich würde sehr gern Chile kennenlernen.", it: "Mi piacerebbe tanto conoscere il Cile.", pl: "Bardzo chciałbym zobaczyć Chile.", tr: "Şili’yi görmeyi çok isterdim.", id: "Saya sangat ingin mengunjungi Chili.", vi: "Tôi rất muốn đến thăm Chile." } }
          - { level: B1, use: { en: Advice, es: Un consejo, uk: Порада, pt: "Um conselho", fr: "Un conseil", de: "Ein Ratschlag", it: "Un consiglio", pl: "Rada", tr: "Tavsiye", id: "Saran", vi: "Lời khuyên" }, ex: [{ target: Deberías }, " dormir más."], tr: { en: You should sleep more., uk: "Тобі варто більше спати.", pt: "Você deveria dormir mais.", fr: "Tu devrais dormir davantage.", de: "Du solltest mehr schlafen.", it: "Dovresti dormire di più.", pl: "Powinieneś więcej spać.", tr: "Daha çok uyumalısın.", id: "Kamu sebaiknya tidur lebih banyak.", vi: "Bạn nên ngủ nhiều hơn." } }
          - level: B2
            use: { es: "Una suposición sobre un momento del pasado", en: "A supposition about a moment in the past", uk: "Припущення про момент у минулому", pt: "Uma suposição sobre um momento do passado", fr: "Une supposition sur un moment du passé", de: "Eine Vermutung über einen Zeitpunkt in der Vergangenheit", it: "Una supposizione su un momento del passato", pl: "Przypuszczenie dotyczące momentu w przeszłości", tr: "Geçmişteki bir an hakkında varsayım", id: "Dugaan tentang suatu saat di masa lampau", vi: "Phỏng đoán về một thời điểm trong quá khứ" }
            ex: { examples: [["Cuando llegó, ", { target: serían }, " las nueve."], ["En la fiesta ", { target: habría }, " unas cuarenta personas."]] }
            tr: { en: { examples: ["When he arrived, it must have been about nine o'clock.", "There must have been about forty people at the party."] }, uk: { examples: ["Коли він прийшов, була, мабуть, дев’ята година.", "На вечірці було, мабуть, людей сорок."] }, pt: { examples: ["Quando ele chegou, deviam ser nove horas.", "Na festa deviam estar umas quarenta pessoas."] }, fr: { examples: ["Quand il est arrivé, il devait être neuf heures.", "À la fête, il devait y avoir une quarantaine de personnes."] }, de: { examples: ["Als er ankam, war es wohl neun Uhr.", "Auf der Party waren wohl etwa vierzig Leute."] }, it: { examples: ["Quando è arrivato, saranno state le nove.", "Alla festa ci saranno state una quarantina di persone."] }, pl: { examples: ["Kiedy przyszedł, była chyba dziewiąta.", "Na imprezie było chyba około czterdziestu osób."] }, tr: { examples: ["Geldiğinde saat dokuz olmalıydı.", "Partide kırk kadar kişi olmalıydı."] }, id: { examples: ["Ketika dia tiba, mungkin sudah pukul sembilan.", "Di pesta itu mungkin ada sekitar empat puluh orang."] }, vi: { examples: ["Khi anh ấy đến, chắc là chín giờ.", "Ở bữa tiệc chắc có khoảng bốn mươi người."] } }
          - level: B2
            use: { es: ["Un hecho posterior a un momento del pasado, en el ", { link: "Estilo indirecto y pasiva con se", to: es.oracion.estilo-indirecto-pasiva }], en: ["An event after a moment in the past, in ", { link: "Reported Speech and Passive se", to: es.oracion.estilo-indirecto-pasiva }], uk: ["Подія після моменту в минулому, у розділі ", { link: "Непряма мова і пасив із se", to: es.oracion.estilo-indirecto-pasiva }], pt: ["Um fato posterior a um momento do passado, no ", { link: "Discurso indireto e passiva com se", to: es.oracion.estilo-indirecto-pasiva }], fr: ["Un fait postérieur à un moment du passé, dans ", { link: "Le discours indirect et le passif avec se", to: es.oracion.estilo-indirecto-pasiva }], de: ["Ein Ereignis nach einem Zeitpunkt in der Vergangenheit, in ", { link: "Indirekte Rede und Passiv mit se", to: es.oracion.estilo-indirecto-pasiva }], it: ["Un fatto successivo a un momento del passato, nel ", { link: "Discorso indiretto e passivo con se", to: es.oracion.estilo-indirecto-pasiva }], pl: ["Zdarzenie późniejsze niż moment w przeszłości, w ", { link: "Mowa zależna i strona bierna z se", to: es.oracion.estilo-indirecto-pasiva }], tr: ["Geçmişteki bir andan sonra gelen olay (", { link: "Dolaylı anlatım ve se ile edilgen yapı", to: es.oracion.estilo-indirecto-pasiva }, ")"], id: ["Peristiwa setelah suatu saat di masa lampau, dalam ", { link: "Kalimat tak langsung dan pasif dengan se", to: es.oracion.estilo-indirecto-pasiva }], vi: ["Một sự việc xảy ra sau một thời điểm trong quá khứ, trong ", { link: "Câu gián tiếp và câu bị động với se", to: es.oracion.estilo-indirecto-pasiva }] }
            ex: { examples: [["Dijo que ", { target: vendría }, " el lunes."], ["Prometió que me ", { target: llamaría }, "."]] }
            tr: { en: { examples: ["He said he would come on Monday.", "He promised he would call me."] }, uk: { examples: ["Він сказав, що прийде в понеділок.", "Він пообіцяв, що зателефонує мені."] }, pt: { examples: ["Ele disse que viria na segunda-feira.", "Prometeu que me ligaria."] }, fr: { examples: ["Il a dit qu’il viendrait lundi.", "Il a promis qu’il m’appellerait."] }, de: { examples: ["Er sagte, er würde am Montag kommen.", "Er versprach, mich anzurufen."] }, it: { examples: ["Ha detto che sarebbe venuto lunedì.", "Ha promesso che mi avrebbe chiamato."] }, pl: { examples: ["Powiedział, że przyjdzie w poniedziałek.", "Obiecał, że do mnie zadzwoni."] }, tr: { examples: ["Pazartesi geleceğini söyledi.", "Beni arayacağına söz verdi."] }, id: { examples: ["Dia bilang akan datang hari Senin.", "Dia berjanji akan menelepon saya."] }, vi: { examples: ["Anh ấy nói sẽ đến vào thứ Hai.", "Anh ấy hứa sẽ gọi cho tôi."] } }
          - level: B2
            variety: es-419
            use: { es: ["El hecho posterior se dice también con ", { term: iba a }, " + infinitivo o con el imperfecto"], en: ["The later event can also be said with ", { term: iba a }, " + infinitive or with the imperfect"], uk: ["Подію після моменту можна виразити також через ", { term: iba a }, " + інфінітив або імперфект"], pt: ["O fato posterior também se diz com ", { term: iba a }, " + infinitivo ou com o imperfeito"], fr: ["Le fait postérieur se dit aussi avec ", { term: iba a }, " + infinitif ou à l’imparfait"], de: ["Das spätere Ereignis lässt sich auch mit ", { term: iba a }, " + Infinitiv oder mit dem ", { term: imperfecto }, " ausdrücken"], it: ["Il fatto successivo si esprime anche con ", { term: iba a }, " + infinito o con l'imperfetto"], pl: ["Późniejsze zdarzenie wyraża się też przez ", { term: iba a }, " + bezokolicznik lub przez ", { term: imperfecto }], tr: ["Sonraki olay ", { term: iba a }, " + mastar ya da ", { term: imperfecto }, " ile de söylenebilir"], id: ["Peristiwa yang terjadi kemudian juga dapat dinyatakan dengan ", { term: iba a }, " + infinitif atau dengan ", { term: imperfecto }], vi: ["Sự việc xảy ra sau còn có thể nói bằng ", { term: iba a }, " + động từ nguyên mẫu hoặc bằng ", { term: imperfecto }] }
            ex: { equivalence: [["Le dije que ", { target: vendría }, " mañana."], ["Le dije que ", { target: iba a venir }, " mañana."], ["Le dije que ", { target: venía }, " mañana."]] }
            tr: { en: "I told him he would come tomorrow.", uk: "Я сказав йому, що він прийде завтра.", pt: "Eu disse a ele que viria amanhã.", fr: "Je lui ai dit qu’il viendrait demain.", de: "Ich sagte ihm, er würde morgen kommen.", it: "Gli ho detto che sarebbe venuto domani.", pl: "Powiedziałem mu, że przyjdzie jutro.", tr: "Ona yarın geleceğini söyledim.", id: "Saya bilang kepadanya bahwa dia akan datang besok.", vi: "Tôi nói với anh ấy là ngày mai anh ấy sẽ đến." }
          - level: B2
            use: { es: ["El resultado de una condición irreal o poco probable: ", { term: si }, " + imperfecto de subjuntivo"], en: ["The result of an unreal or unlikely condition: ", { term: si }, " + imperfect subjunctive"], uk: ["Наслідок нереальної або малоймовірної умови: ", { term: si }, " + імперфект суб’юнктива"], pt: ["O resultado de uma condição irreal ou pouco provável: ", { term: si }, " + imperfeito do subjuntivo"], fr: ["Le résultat d’une condition irréelle ou peu probable : ", { term: si }, " + imparfait du subjonctif"], de: ["Das Ergebnis einer irrealen oder unwahrscheinlichen Bedingung: ", { term: si }, " + Konjunktiv ", { term: imperfecto }], it: ["Il risultato di una condizione irreale o poco probabile: ", { term: si }, " + imperfetto del congiuntivo"], pl: ["Skutek nierzeczywistego lub mało prawdopodobnego warunku: ", { term: si }, " + ", { term: imperfecto }, " trybu łączącego"], tr: ["Gerçek dışı ya da olasılığı düşük bir koşulun sonucu: ", { term: si }, " + dilek kipinin ", { term: imperfecto }, " biçimi"], id: ["Hasil dari syarat yang tidak nyata atau kecil kemungkinannya: ", { term: si }, " + ", { term: imperfecto }, " subjungtif"], vi: ["Kết quả của điều kiện không có thật hoặc ít khả năng: ", { term: si }, " + ", { term: imperfecto }, " của thức giả định"] }
            ex: ["Si tuviera más tiempo, ", { target: viajaría }, " más."]
            tr: { en: "If I had more time, I'd travel more.", uk: "Якби в мене було більше часу, я більше подорожував би.", pt: "Se eu tivesse mais tempo, viajaria mais.", fr: "Si j’avais plus de temps, je voyagerais davantage.", de: "Wenn ich mehr Zeit hätte, würde ich mehr reisen.", it: "Se avessi più tempo, viaggerei di più.", pl: "Gdybym miał więcej czasu, podróżowałbym więcej.", tr: "Daha çok vaktim olsa daha çok seyahat ederdim.", id: "Kalau saya punya lebih banyak waktu, saya akan lebih sering bepergian.", vi: "Nếu có nhiều thời gian hơn, tôi sẽ đi du lịch nhiều hơn." }
          - level: B2
            use: { es: "Un deseo o una sugerencia con cualquier verbo, sin decir la condición", en: "A wish or a suggestion with any verb, without stating the condition", uk: "Бажання чи пропозиція з будь-яким дієсловом, без вказівки на умову", pt: "Um desejo ou uma sugestão com qualquer verbo, sem dizer a condição", fr: "Un souhait ou une suggestion avec n’importe quel verbe, sans énoncer la condition", de: "Ein Wunsch oder ein Vorschlag mit jedem Verb, ohne die Bedingung zu nennen", it: "Un desiderio o un suggerimento con qualsiasi verbo, senza dire la condizione", pl: "Życzenie lub sugestia z dowolnym czasownikiem, bez podawania warunku", tr: "Koşulu söylemeden, herhangi bir fiille dilek ya da öneri", id: "Keinginan atau saran dengan kata kerja apa pun, tanpa menyebut syarat", vi: "Một mong muốn hay đề nghị với động từ bất kỳ, không nêu điều kiện" }
            ex: { examples: [["Me ", { target: tomaría }, " un café ahora mismo."], ["Yo ", { target: hablaría }, " con tu jefe."]] }
            tr: { en: { examples: ["I'd really like a coffee right now.", "I'd talk to your boss."] }, uk: { examples: ["Я б зараз випив кави.", "Я б поговорив із твоїм начальником."] }, pt: { examples: ["Eu tomaria um café agora mesmo.", "Eu falaria com o seu chefe."] }, fr: { examples: ["Je prendrais bien un café maintenant.", "Moi, je parlerais à ton patron."] }, de: { examples: ["Ich würde jetzt gern einen Kaffee trinken.", "Ich würde mit deinem Chef sprechen."] }, it: { examples: ["Mi prenderei un caffè adesso.", "Io parlerei con il tuo capo."] }, pl: { examples: ["Napiłbym się teraz kawy.", "Ja porozmawiałbym z twoim szefem."] }, tr: { examples: ["Şu an bir kahve içerdim.", "Ben olsam patronunla konuşurdum."] }, id: { examples: ["Saya mau minum kopi sekarang juga.", "Kalau saya, saya akan bicara dengan atasanmu."] }, vi: { examples: ["Giờ tôi muốn uống một ly cà phê.", "Tôi sẽ nói chuyện với sếp của bạn."] } }
          - level: C1
            use: { es: ["Una objeción sobre el pasado: se admite algo y sigue ", { term: pero }], en: ["An objection about the past: something is granted and ", { term: pero }, " follows"], uk: ["Заперечення щодо минулого: щось визнається, а далі йде ", { term: pero }], pt: ["Uma objeção sobre o passado: admite-se algo e segue-se ", { term: pero }], fr: ["Une objection sur le passé : on admet quelque chose et ", { term: pero }, " suit"], de: ["Ein Einwand zur Vergangenheit: Man räumt etwas ein, und es folgt ", { term: pero }], it: ["Un'obiezione sul passato: si ammette qualcosa e segue ", { term: pero }], pl: ["Zastrzeżenie dotyczące przeszłości: coś się przyznaje, a potem następuje ", { term: pero }], tr: ["Geçmişle ilgili bir itiraz: bir şey kabul edilir, ardından ", { term: pero }, " gelir"], id: ["Keberatan tentang masa lampau: sesuatu diakui, lalu diikuti ", { term: pero }], vi: ["Một sự phản bác về quá khứ: thừa nhận điều gì đó rồi theo sau là ", { term: pero }] }
            ex: { examples: [["Aquel actor ", { target: sería }, " muy famoso, pero conmigo fue antipático."], ["A ti no te ", { target: molestaría }, " entonces, pero a mí sí."]] }
            tr: { en: { examples: ["That actor may have been very famous, but he was unpleasant to me.", "It may not have bothered you then, but it bothered me."] }, uk: { examples: ["Той актор, може, й був дуже відомий, але зі мною був неприємний.", "Тобі тоді це, можливо, не заважало, а мені заважало."] }, pt: { examples: ["Aquele ator talvez fosse muito famoso, mas comigo foi antipático.", "Para você talvez não incomodasse na época, mas para mim sim."] }, fr: { examples: ["Cet acteur était peut-être très célèbre, mais avec moi il a été désagréable.", "Cela ne te dérangeait peut-être pas à l’époque, mais moi, si."] }, de: { examples: ["Dieser Schauspieler mag sehr berühmt gewesen sein, aber zu mir war er unfreundlich.", "Dich hat es damals vielleicht nicht gestört, mich aber schon."] }, it: { examples: ["Quell'attore sarà stato molto famoso, ma con me è stato antipatico.", "A te forse allora non dava fastidio, ma a me sì."] }, pl: { examples: ["Ten aktor może i był bardzo sławny, ale dla mnie był niesympatyczny.", "Tobie wtedy może to nie przeszkadzało, ale mnie tak."] }, tr: { examples: ["O oyuncu çok ünlü olabilir ama bana karşı sevimsizdi.", "Sana o zaman belki dokunmazdı ama bana dokundu."] }, id: { examples: ["Aktor itu mungkin sangat terkenal, tetapi kepada saya dia tidak ramah.", "Mungkin saat itu kamu tidak terganggu, tetapi saya terganggu."] }, vi: { examples: ["Nam diễn viên đó có thể rất nổi tiếng, nhưng với tôi thì anh ta khó ưa.", "Lúc đó có thể bạn không thấy phiền, nhưng tôi thì có."] } }
          - level: C2
            use: { es: "Una advertencia o un temor sobre el pasado, en preguntas con no", en: ["A warning or a fear about the past, in questions with ", { term: no }], uk: ["Застереження чи побоювання щодо минулого в питаннях із ", { term: no }], pt: ["Uma advertência ou um temor sobre o passado, em perguntas com ", { term: no }], fr: ["Un avertissement ou une crainte sur le passé, dans des questions avec ", { term: no }], de: ["Eine Warnung oder Befürchtung zur Vergangenheit, in Fragen mit ", { term: no }], it: ["Un avvertimento o un timore sul passato, in domande con ", { term: no }], pl: ["Ostrzeżenie lub obawa dotycząca przeszłości, w pytaniach z ", { term: no }], tr: ["Geçmişle ilgili bir uyarı ya da korku, ", { term: no }, " ile kurulan sorularda"], id: ["Peringatan atau kekhawatiran tentang masa lampau, dalam pertanyaan dengan ", { term: no }], vi: ["Một lời cảnh báo hoặc nỗi lo về quá khứ, trong câu hỏi có ", { term: no }] }
            ex: { examples: [["¿No ", { target: creerías }, " que lo hice a propósito?"], ["¿No te ", { target: ofendería }, " lo que dije?"]] }
            tr: { en: { examples: ["Wouldn't you think I did it on purpose?", "Wouldn't what I said have offended you?"] }, uk: { examples: ["Хіба ти не подумаєш, що я зробив це навмисне?", "Хіба тебе не образило б те, що я сказав?"] }, pt: { examples: ["Você não acharia que eu fiz de propósito?", "Não ofenderia você o que eu disse?"] }, fr: { examples: ["Ne croirais-tu pas que je l’ai fait exprès ?", "Ce que j’ai dit ne t’aurait-il pas offensé ?"] }, de: { examples: ["Würdest du nicht glauben, dass ich es absichtlich getan habe?", "Hätte dich nicht beleidigt, was ich gesagt habe?"] }, it: { examples: ["Non penseresti che l'ho fatto apposta?", "Non ti offenderebbe ciò che ho detto?"] }, pl: { examples: ["Czy nie pomyślałbyś, że zrobiłem to celowo?", "Czy nie obraziłoby cię to, co powiedziałem?"] }, tr: { examples: ["Bunu kasten yaptığımı düşünmez miydin?", "Söylediğim şey seni kırmış olmaz mıydı?"] }, id: { examples: ["Bukankah kamu akan mengira saya sengaja melakukannya?", "Bukankah kata-kata saya akan menyinggungmu?"] }, vi: { examples: ["Chẳng lẽ bạn không nghĩ tôi cố ý làm vậy sao?", "Chẳng phải điều tôi nói có thể làm bạn phật lòng sao?"] } }
