            tr: { en: "Cervantes wrote: “In a village of La Mancha, the name of which I have no desire to call to mind”.", uk: "Сервантес написав: «В одному селі Ла-Манчі, назви якого не хочу згадувати».", pt: "Cervantes escreveu: “Num lugar da Mancha, de cujo nome não quero me lembrar”.", fr: "Cervantès a écrit : « Dans un village de la Manche, dont je ne veux pas me rappeler le nom ».", de: "Cervantes schrieb: „An einem Ort in der Mancha, an dessen Namen ich mich nicht erinnern möchte“.", it: "Cervantes scrisse: «In un villaggio della Mancia, di cui non voglio ricordare il nome».", pl: "Cervantes napisał: „W pewnej wsi La Manchy, której nazwy nie chcę pamiętać”.", tr: "Cervantes şöyle yazdı: “La Mancha'da bir yerde, adını anmak istemediğim”.", id: "Cervantes menulis: “Di suatu tempat di La Mancha, yang namanya tak ingin kuingat”.", vi: "Cervantes đã viết: “Ở một nơi trong vùng La Mancha, cái tên mà tôi không muốn nhớ lại”." }
