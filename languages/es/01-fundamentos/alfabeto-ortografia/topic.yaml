id: es.fundamentos.alfabeto-ortografia
lang: es
kind: foundations
tags: [alphabet, letters, spelling]
concepts: [alphabet]
related: [es.fundamentos.pronunciacion-acentuacion, es.fundamentos.numeros, es.oracion.preguntas-negacion]
status: { en: draft, es: draft }
translated: { es: "e1b3b8 b0a6e4 f99e2a 78e35a 6b1130 d4007e" }

title: { en: The Alphabet and Spelling, es: El alfabeto y la ortografía }
summary:
  lead:
    en: "The 27 letters of the Spanish alphabet with their names, and the spelling rules that tie each sound to its letters."
    es: "Las 27 letras del alfabeto español con sus nombres, y las reglas que unen cada sonido con sus letras."
  rule:
    en: ["The letter ", { letter: h }, " is written but never pronounced:"]
    es: ["La letra ", { letter: h }, " se escribe, pero nunca se pronuncia:"]
  ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: { en: 27 letters, es: 27 letras }
          rule:
            en: ["five vowels, ", { letter: "a, e, i, o, u" }, "; ", { letter: ñ }, " is a letter of its own"]
            es: ["cinco vocales, ", { letter: "a, e, i, o, u" }, "; la ", { letter: ñ }, " es una letra propia"]
          ex: { examples: [["ni", { target: { letter: ñ } }, "o"], ["espa", { target: { letter: ñ } }, "ol"]] }
          tr: { en: { examples: [child, Spanish] } }
        - level: A0
          point: { en: Letter names, es: Nombres de las letras }
          rule:
            en: "each name is a short word; spelling aloud uses the names"
            es: "cada nombre es una palabra corta; para deletrear se dicen los nombres"
          ex: { exchange: ["¿Cómo se escribe Ana?", [{ target: a }, ", ", { target: ene }, ", ", { target: a }, "."]] }
          tr: { en: { exchange: [How do you spell Ana?, "A, N, A."] } }
        - level: A0
          point: { en: Two letters, es: Dos letras }
          rule:
            en: [{ alternatives: [{ letter: ch }, { letter: ll }, { letter: rr }, { letter: qu }, { letter: gu }] }, " write one sound with two letters"]
            es: [{ alternatives: [{ letter: ch }, { letter: ll }, { letter: rr }, { letter: qu }, { letter: gu }] }, " escriben un sonido con dos letras"]
          ex: { examples: [[{ target: { letter: ch } }, "ico"], ["ca", { target: { letter: ll } }, "e"], ["pe", { target: { letter: rr } }, "o"]] }
          tr: { en: { examples: [boy, street, dog] } }
        - level: A0
          point: { en: Silent h, es: La h muda }
          rule:
            en: [{ letter: h }, " is never pronounced"]
            es: ["la ", { letter: h }, " nunca se pronuncia"]
          ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }
          tr: { en: { examples: [hello, hour] } }
        - level: A0
          point: { en: [{ letter: c }, " and ", { letter: qu }], es: [{ letter: c }, " y ", { letter: qu }] }
          rule:
            en: [{ letter: c }, " before ", { letter: "a, o, u" }, ", ", { letter: qu }, " before ", { letter: "e, i" }, ", for the same sound"]
            es: [{ letter: c }, " delante de ", { letter: "a, o, u" }, ", ", { letter: qu }, " delante de ", { letter: "e, i" }, ", para el mismo sonido"]
          ex: { examples: [[{ target: { letter: c } }, "asa"], [{ target: { letter: qu } }, "eso"]] }
          tr: { en: { examples: [house, cheese] } }
        - level: A0
          point: { en: [{ letter: g }, " and ", { letter: gu }], es: [{ letter: g }, " y ", { letter: gu }] }
          rule:
            en: [{ letter: g }, " before ", { letter: "a, o, u" }, ", ", { letter: gu }, " before ", { letter: "e, i" }, ", for the same sound"]
            es: [{ letter: g }, " delante de ", { letter: "a, o, u" }, ", ", { letter: gu }, " delante de ", { letter: "e, i" }, ", para el mismo sonido"]
          ex: { examples: [[{ target: { letter: g } }, "ato"], [{ target: { letter: gu } }, "itarra"]] }
          tr: { en: { examples: [cat, guitar] } }
        - level: A0
          point: { en: [{ letter: z }, " and ", { letter: c }], es: [{ letter: z }, " y ", { letter: c }] }
          rule:
            en: [{ letter: z }, " before ", { letter: "a, o, u" }, ", ", { letter: c }, " before ", { letter: "e, i" }, ", for the same sound"]
            es: [{ letter: z }, " delante de ", { letter: "a, o, u" }, ", ", { letter: c }, " delante de ", { letter: "e, i" }, ", para el mismo sonido"]
          ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: c } }, "ine"]] }
          tr: { en: { examples: [shoe, cinema] } }
        - level: A0
          point: { en: [{ letter: j }, " and ", { letter: g }], es: [{ letter: j }, " y ", { letter: g }] }
          rule:
            en: [{ letter: j }, " before any vowel; ", { letter: g }, " before ", { letter: "e, i" }, " sounds the same"]
            es: [{ letter: j }, " delante de cualquier vocal; ", { letter: g }, " delante de ", { letter: "e, i" }, " suena igual"]
          ex: { examples: [[{ target: { letter: j } }, "amón"], [{ target: { letter: g } }, "ente"]] }
          tr: { en: { examples: [ham, people] } }
        - level: A0
          point: { en: [{ letter: b }, " and ", { letter: v }], es: [{ letter: b }, " y ", { letter: v }] }
          rule:
            en: "one sound with two spellings; each word keeps its own"
            es: "un sonido con dos letras; cada palabra lleva la suya"
          ex: { examples: [[{ target: { letter: b } }, "ueno"], [{ target: { letter: v } }, "ino"]] }
          tr: { en: { examples: [good, wine] } }
        - level: A0
          point: { en: Small letters, es: Minúsculas }
          rule:
            en: "days, months, languages and nationalities start with a small letter"
            es: "los días, los meses, los idiomas y las nacionalidades van con minúscula"
          ex: ["Los ", { target: lunes }, " estudio ", { target: inglés }, "."]
          tr: { en: On Mondays I study English. }
        - level: A0
          point: { alternatives: ["¿ ?", "¡ !"] }
          rule:
            en: "questions and exclamations open with an upside-down mark"
            es: "las preguntas y las exclamaciones se abren con un signo invertido"
          ex: { examples: [[{ target: "¿" }, "Dónde vives?"], [{ target: "¡" }, "Hola!"]] }
          tr: { en: { examples: [Where do you live?, Hello!] } }
        - level: A0
          point: { en: Trap, es: Trampa }
          rule:
            en: ["the ", { letter: u }, " of ", { letter: gue }, " and ", { letter: gui }, " is silent; ", { letter: ü }, " makes it sound"]
            es: ["la ", { letter: u }, " de ", { letter: gue }, " y ", { letter: gui }, " no suena; con ", { letter: ü }, " sí suena"]
          ex: ["pin", { target: { letter: gü } }, "ino"]
          tr: { en: penguin }

sections:
  - title: { en: The alphabet, es: El alfabeto }
    role: own
    content:
      - type: prose
        level: A0
        text:
          en: ["27 letters. Vowels: ", { letter: "a, e, i, o, u" }, ". The other 22 are consonants, ", { letter: ñ }, " among them."]
          es: ["27 letras. Vocales: ", { letter: "a, e, i, o, u" }, ". Las otras 22 son consonantes, entre ellas la ", { letter: ñ }, "."]
      - type: inventory
        set: letters
        columns:
          - { key: letter, label: { en: Letter, es: Letra } }
          - { key: name, label: { en: Name, es: Nombre } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A0, value: a, letter: A a, name: a, ex: [{ letter: a }, migo], tr: { en: friend } }
          - { level: A0, value: b, letter: B b, name: be, ex: [{ letter: b }, oca], tr: { en: mouth } }
          - { level: A0, value: c, letter: C c, name: ce, ex: [{ letter: c }, asa], tr: { en: house } }
          - { level: A0, value: d, letter: D d, name: de, ex: [{ letter: d }, edo], tr: { en: finger } }
          - { level: A0, value: e, letter: E e, name: e, ex: [{ letter: e }, scuela], tr: { en: school } }
          - { level: A0, value: f, letter: F f, name: efe, ex: [{ letter: f }, uego], tr: { en: fire } }
          - { level: A0, value: g, letter: G g, name: ge, ex: [{ letter: g }, ato], tr: { en: cat } }
          - { level: A0, value: h, letter: H h, name: hache, ex: [{ letter: h }, ola], tr: { en: hello } }
          - { level: A0, value: i, letter: I i, name: i, ex: [{ letter: i }, sla], tr: { en: island } }
          - { level: A0, value: j, letter: J j, name: jota, ex: [{ letter: j }, ugo], tr: { en: juice } }
          - { level: A0, value: k, letter: K k, name: ka, ex: [{ letter: k }, ilo], tr: { en: kilo } }
          - { level: A0, value: l, letter: L l, name: ele, ex: [{ letter: l }, una], tr: { en: moon } }
          - { level: A0, value: m, letter: M m, name: eme, ex: [{ letter: m }, esa], tr: { en: table } }
          - { level: A0, value: "n", letter: N n, name: ene, ex: [{ letter: "n" }, oche], tr: { en: night } }
          - { level: A0, value: ñ, letter: Ñ ñ, name: eñe, ex: [ni, { letter: ñ }, o], tr: { en: child } }
          - { level: A0, value: o, letter: O o, name: o, ex: [{ letter: o }, jo], tr: { en: eye } }
          - { level: A0, value: p, letter: P p, name: pe, ex: [{ letter: p }, an], tr: { en: bread } }
          - { level: A0, value: q, letter: Q q, name: cu, ex: [{ letter: q }, ueso], tr: { en: cheese } }
          - { level: A0, value: r, letter: R r, name: erre, ex: [{ letter: r }, ojo], tr: { en: red } }
          - { level: A0, value: s, letter: S s, name: ese, ex: [{ letter: s }, ol], tr: { en: sun } }
          - { level: A0, value: t, letter: T t, name: te, ex: [{ letter: t }, ren], tr: { en: train } }
          - { level: A0, value: u, letter: U u, name: u, ex: [{ letter: u }, va], tr: { en: grape } }
          - { level: A0, value: v, letter: V v, name: ["ve ", { variant: uve, variety: es-ES }], ex: [{ letter: v }, ino], tr: { en: wine } }
          - { level: A0, value: w, letter: W w, name: ["doble ve ", { variant: uve doble, variety: es-ES }], ex: [ki, { letter: w }, i], tr: { en: kiwi } }
          - { level: A0, value: x, letter: X x, name: equis, ex: [ta, { letter: x }, i], tr: { en: taxi } }
          - { level: A0, value: "y", letter: Y y, name: { alternatives: [ye, i griega] }, ex: [{ letter: "y" }, o], tr: { en: I } }
          - { level: A0, value: z, letter: Z z, name: zeta, ex: [{ letter: z }, apato], tr: { en: shoe } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The names of the vowels are their sounds: ", { term: "a, e, i, o, u" }, "."]
              es: ["Los nombres de las vocales son sus sonidos: ", { term: "a, e, i, o, u" }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ñ }, " is a letter of its own and comes after ", { letter: "n" }, " in the dictionary."]
              es: ["La ", { letter: ñ }, " es una letra propia y va después de la ", { letter: "n" }, " en el diccionario."]
          - type: note
            level: A0
            text:
              en: [{ letter: k }, " and ", { letter: w }, " appear mostly in words from other languages: ", { term: kilo }, ", ", { term: kiwi }, "."]
              es: ["La ", { letter: k }, " y la ", { letter: w }, " aparecen sobre todo en palabras de otras lenguas: ", { term: kilo }, ", ", { term: kiwi }, "."]
          - type: rule
            level: A0
            text:
              en: "To spell a word aloud, say the names of its letters:"
              es: "Para deletrear una palabra, se dicen los nombres de sus letras:"
            ex: { exchange: ["¿Cómo se escribe tu apellido?", "Pe, e, erre, e, zeta: Pérez."] }
            tr: { en: { exchange: [How do you spell your surname?, "P, E, R, E, Z: Pérez."] } }
          - type: note
            level: A0
            variety: es-419
            text:
              en: ["To tell ", { letter: b }, " from ", { letter: v }, " when spelling, many speakers say ", { term: be larga }, " and ", { term: ve corta }, "."]
              es: ["Para distinguir la ", { letter: b }, " de la ", { letter: v }, " al deletrear, muchos hablantes dicen ", { term: be larga }, " y ", { term: ve corta }, "."]

  - title: { en: Sounds and their letters, es: Los sonidos y sus letras }
    role: own
    content:
      - type: usage
        columns:
          - { key: sound, label: { en: Sound, es: Sonido } }
          - { key: spelling, label: { en: Spelling, es: Escritura } }
          - { key: ex, label: { en: Example, es: Ejemplo } }
        rows:
          - level: A0
            sound: { ipa: k }
            spelling: { alternatives: [{ pattern: [{ letter: c }, { letter: "a, o, u" }] }, { pattern: [{ letter: qu }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: c } }, "asa"], [{ target: { letter: qu } }, "ince"]] }
            tr: { en: { examples: [house, fifteen] } }
          - level: A0
            sound: { ipa: g }
            spelling: { alternatives: [{ pattern: [{ letter: g }, { letter: "a, o, u" }] }, { pattern: [{ letter: gu }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: g } }, "ato"], [{ target: { letter: gu } }, "itarra"]] }
            tr: { en: { examples: [cat, guitar] } }
          - level: A0
            sound: { ipa: x }
            spelling: { alternatives: [{ letter: j }, { pattern: [{ letter: g }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: j } }, "amón"], [{ target: { letter: g } }, "ente"]] }
            tr: { en: { examples: [ham, people] } }
          - level: A0
            sound: [{ ipa: s }, " ", { variant: { ipa: θ }, variety: es-ES }]
            spelling: { alternatives: [{ pattern: [{ letter: z }, { letter: "a, o, u" }] }, { pattern: [{ letter: c }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: c } }, "ine"]] }
            tr: { en: { examples: [shoe, cinema] } }
          - level: A0
            sound: { ipa: b }
            spelling: { alternatives: [{ letter: b }, { letter: v }] }
            ex: { examples: [[{ target: { letter: b } }, "ueno"], [{ target: { letter: v } }, "ino"]] }
            tr: { en: { examples: [good, wine] } }
          - level: A0
            sound: { ipa: ʝ }
            spelling: { alternatives: [{ letter: ll }, { letter: "y" }] }
            ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
            tr: { en: { examples: [street, I] } }
          - level: A0
            sound: { ipa: tʃ }
            spelling: { letter: ch }
            ex: { examples: [[{ target: { letter: ch } }, "ico"], ["no", { target: { letter: ch } }, "e"]] }
            tr: { en: { examples: [boy, night] } }
          - level: A0
            sound: { ipa: r }
            spelling: { alternatives: [{ letter: rr }, { letter: r }] }
            ex: { examples: [["pe", { target: { letter: rr } }, "o"], [{ target: { letter: r } }, "ojo"]] }
            tr: { en: { examples: [dog, red] } }
          - level: A0
            sound: { en: no sound, es: sin sonido }
            spelling: { letter: h }
            ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }
            tr: { en: { examples: [hello, hour] } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The ", { letter: u }, " of ", { alternatives: [{ letter: que }, { letter: qui }, { letter: gue }, { letter: gui }] }, " is silent; it only marks the sound."]
              es: ["La ", { letter: u }, " de ", { alternatives: [{ letter: que }, { letter: qui }, { letter: gue }, { letter: gui }] }, " no suena: solo indica el sonido."]
          - type: rule
            level: A0
            text:
              en: ["Two dots, ", { letter: ü }, ", make the ", { letter: u }, " of ", { letter: gue }, " and ", { letter: gui }, " sound:"]
              es: ["La diéresis, ", { letter: ü }, ", hace sonar la ", { letter: u }, " de ", { letter: gue }, " y ", { letter: gui }, ":"]
            ex: { examples: [["pin", { target: { letter: gü } }, "ino"], ["ver", { target: { letter: gü } }, "enza"]] }
            tr: { en: { examples: [penguin, shame] } }
          - type: rule
            level: A0
            text:
              en: ["The strong ", { letter: r }, " is ", { letter: rr }, " between vowels, and one ", { letter: r }, " at the start of a word."]
              es: ["La ", { letter: r }, " fuerte se escribe ", { letter: rr }, " entre vocales, y con una sola ", { letter: r }, " al principio de palabra."]
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["In most of Spain, ", { letter: z }, " and ", { letter: c }, " before ", { letter: "e, i" }, " sound ", { ipa: θ }, ", like th in English think, and ", { letter: s }, " keeps ", { ipa: s }, "."]
              es: ["En la mayor parte de España, la ", { letter: z }, " y la ", { letter: c }, " delante de ", { letter: "e, i" }, " suenan ", { ipa: θ }, ", y la ", { letter: s }, " conserva ", { ipa: s }, "."]
          - type: note
            level: A0
            variety: es-419
            text:
              en: [{ letter: s }, ", ", { letter: z }, " and ", { letter: c }, " before ", { letter: "e, i" }, " all sound ", { ipa: s }, ", so ", { term: casa }, " and ", { term: caza }, " sound alike."]
              es: ["La ", { letter: s }, ", la ", { letter: z }, " y la ", { letter: c }, " delante de ", { letter: "e, i" }, " suenan ", { ipa: s }, ", así que ", { term: casa }, " y ", { term: caza }, " suenan igual."]

  - title: { en: Small letters and question marks, es: Minúsculas y signos }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Days, months, languages and nationalities start with a small letter:"
              es: "Los días, los meses, los idiomas y las nacionalidades se escriben con minúscula:"
            ex: ["Los ", { target: lunes }, " estudio ", { target: inglés }, "."]
            tr: { en: On Mondays I study English. }
          - type: rule
            level: A0
            text:
              en: "Names of people, cities and countries start with a capital letter:"
              es: "Los nombres de personas, ciudades y países se escriben con mayúscula:"
            ex: [{ target: { letter: A } }, "na vive en ", { target: { letter: L } }, "ima."]
            tr: { en: Ana lives in Lima. }
          - type: rule
            level: A0
            text:
              en: ["A question opens with ", { letter: "¿" }, " and an exclamation with ", { letter: "¡" }, ":"]
              es: ["Una pregunta se abre con ", { letter: "¿" }, " y una exclamación con ", { letter: "¡" }, ":"]
            ex: { examples: [[{ target: "¿" }, "Dónde vives?"], [{ target: "¡" }, "Qué bonito!"]] }
            tr: { en: { examples: [Where do you live?, How pretty!] } }
          - type: rule
            level: A0
            text:
              en: "The opening mark goes where the question starts, even inside a sentence:"
              es: "El signo de apertura va donde empieza la pregunta, también dentro de una frase:"
            ex: ["Y tú, ", { target: "¿" }, "de dónde eres?"]
            tr: { en: "And you, where are you from?" }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Hoy es Lunes., right: ["Hoy es ", { target: lunes }, "."], rule: { en: days take a small letter, es: los días van con minúscula } }
          - { level: A0, wrong: Hablo Español., right: ["Hablo ", { target: español }, "."], rule: { en: languages take a small letter, es: los idiomas van con minúscula } }
          - { level: A0, wrong: Dónde vives?, right: [{ target: "¿" }, "Dónde vives?"], rule: { en: ["a question opens with ", { letter: "¿" }], es: ["una pregunta se abre con ", { letter: "¿" }] } }
          - { level: A0, wrong: Me gusta el keso., right: ["Me gusta el ", { target: queso }, "."], rule: { en: [{ letter: qu }, " writes this sound before ", { letter: "e, i" }], es: [{ letter: qu }, " escribe este sonido delante de ", { letter: "e, i" }] } }
          - { level: A0, wrong: Toco la gitarra., right: ["Toco la ", { target: guitarra }, "."], rule: { en: [{ letter: gu }, " keeps the sound of ", { term: gato }, " before ", { letter: "e, i" }], es: [{ letter: gu }, " mantiene el sonido de ", { term: gato }, " delante de ", { letter: "e, i" }] } }
          - { level: A0, speakers: [en], wrong: "Ola, Ana.", right: [{ target: Hola }, ", Ana."], rule: { en: ["the silent ", { letter: h }, " is still written"] } }
