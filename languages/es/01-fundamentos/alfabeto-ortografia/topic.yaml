    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Hoy es Lunes., right: ["Hoy es ", { target: lunes }, "."], rule: { en: days take a small letter, es: los días van con minúscula, uk: "дні тижня пишуть з малої літери" } }
          - { level: A0, wrong: Hablo Español., right: ["Hablo ", { target: español }, "."], rule: { en: languages take a small letter, es: los idiomas van con minúscula, uk: "назви мов пишуть з малої літери" } }
          - { level: A0, wrong: Dónde vives?, right: [{ target: "¿" }, "Dónde vives?"], rule: { en: ["a question opens with ", { letter: "¿" }], es: ["una pregunta se abre con ", { letter: "¿" }], uk: ["питання починається з ", { letter: "¿" }] } }
          - { level: A0, wrong: Me gusta el keso., right: ["Me gusta el ", { target: queso }, "."], rule: { en: [{ letter: qu }, " writes this sound before ", { letter: "e, i" }], es: [{ letter: qu }, " escribe este sonido delante de ", { letter: "e, i" }], uk: [{ letter: "qu" }, " передає цей звук перед ", { letter: "e, i" }] } }
          - { level: A0, wrong: Toco la gitarra., right: ["Toco la ", { target: guitarra }, "."], rule: { en: [{ letter: gu }, " keeps the sound of ", { term: gato }, " before ", { letter: "e, i" }], es: [{ letter: gu }, " mantiene el sonido de ", { term: gato }, " delante de ", { letter: "e, i" }], uk: [{ letter: "gu" }, " зберігає звук ", { term: "gato" }, " перед ", { letter: "e, i" }] } }
          - { level: A0, speakers: [en], wrong: "Ola, Ana.", right: [{ target: Hola }, ", Ana."], rule: { en: ["the silent ", { letter: h }, " is still written"] } }
