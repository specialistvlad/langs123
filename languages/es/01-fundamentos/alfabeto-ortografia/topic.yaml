id: es.fundamentos.alfabeto-ortografia
lang: es
kind: foundations
tags: [alphabet, letters, spelling]
concepts: [alphabet]
related: [es.fundamentos.pronunciacion-acentuacion, es.fundamentos.numeros, es.oracion.preguntas-negacion]
status: { en: draft, es: draft, uk: draft }
translated: { en: "4eba19 60a59b 8bb2e3 87e118 11ec27 f2c35e", uk: "4eba19 60a59b 8bb2e3 87e118 11ec27 f2c35e" }

title: { en: The Alphabet and Spelling, es: El alfabeto y la ortografía, uk: "Алфавіт і правопис" }
summary:
  lead:
    en: "The 27 letters of the Spanish alphabet with their names and sounds, and the spelling rules that tie each sound to its letters."
    es: "Las 27 letras del alfabeto español con sus nombres y sus sonidos, y las reglas que unen cada sonido con sus letras."
    uk: "Усі 27 літер іспанського алфавіту з їхніми назвами та звуками, а також правила, що пов’язують кожен звук із його літерами."
  rule:
    en: ["The letter ", { letter: h }, " is written but never pronounced:"]
    es: ["La letra ", { letter: h }, " se escribe, pero nunca se pronuncia:"]
    uk: ["Літеру ", { letter: "h" }, " пишуть, але ніколи не вимовляють:"]
  ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Пункт" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: { en: 27 letters, es: 27 letras, uk: "27 літер" }
          rule:
            en: ["five vowels, ", { letter: "a, e, i, o, u" }, "; ", { letter: ñ }, " is a letter of its own"]
            es: ["cinco vocales, ", { letter: "a, e, i, o, u" }, "; la ", { letter: ñ }, " es una letra propia"]
            uk: ["п’ять голосних, ", { letter: "a, e, i, o, u" }, "; ", { letter: "ñ" }, " — окрема літера"]
          ex: { examples: [["ni", { target: { letter: ñ } }, "o"], ["espa", { target: { letter: ñ } }, "ol"]] }
          tr: { en: { examples: [child, Spanish] }, uk: { examples: ["дитина", "іспанська"] } }
        - level: A0
          point: { en: Letter names, es: Nombres de las letras, uk: "Назви літер" }
          rule:
            en: "each name is a short word; spelling aloud uses the names"
            es: "cada nombre es una palabra corta; para deletrear se dicen los nombres"
            uk: "кожна назва — коротке слово; щоб назвати слово по літерах, вимовляють назви"
          ex: { exchange: ["¿Cómo se escribe Ana?", [{ target: a }, ", ", { target: ene }, ", ", { target: a }, "."]] }
          tr: { en: { exchange: [How do you spell Ana?, "A, N, A."] }, uk: { exchange: ["Як пишеться «Ана»?", "А, Н, А."] } }
        - level: A0
          point: { en: [{ letter: v }, " and ", { letter: w }], es: [{ letter: v }, " y ", { letter: w }], uk: [{ letter: "v" }, " і ", { letter: "w" }] }
          rule:
            en:
              [
                { letter: v },
                " is called ",
                { variant: { term: ve }, variety: es-419 },
                " ",
                { variant: { term: uve }, variety: es-ES },
                ", and ",
                { letter: w },
                " ",
                { variant: { term: doble u }, variety: es-419 },
                " ",
                { variant: { term: uve doble }, variety: es-ES },
              ]
            es:
              [
                "la ",
                { letter: v },
                " se llama ",
                { variant: { term: ve }, variety: es-419 },
                " ",
                { variant: { term: uve }, variety: es-ES },
                ", y la ",
                { letter: w },
                ", ",
                { variant: { term: doble u }, variety: es-419 },
                " ",
                { variant: { term: uve doble }, variety: es-ES },
              ]
            uk: [{ letter: "v" }, " називається ", { variant: { term: "ve" }, variety: "es-419" }, " ", { variant: { term: "uve" }, variety: "es-ES" }, ", а ", { letter: "w" }, " — ", { variant: { term: "doble u" }, variety: "es-419" }, " ", { variant: { term: "uve doble" }, variety: "es-ES" }]
          ex: ["¿Con be o con ", { variant: { target: ve }, variety: es-419 }, " ", { variant: { target: uve }, variety: es-ES }, "?"]
          tr: { en: "With a b or with a v?", uk: "З b чи з v?" }
        - level: A0
          point: { en: Two letters, es: Dos letras, uk: "Дві літери" }
          rule:
            en: [{ alternatives: [{ letter: ch }, { letter: ll }, { letter: rr }, { letter: qu }, { letter: gu }] }, " write one sound with two letters"]
            es: [{ alternatives: [{ letter: ch }, { letter: ll }, { letter: rr }, { letter: qu }, { letter: gu }] }, " escriben un sonido con dos letras"]
            uk: [{ alternatives: [{ letter: "ch" }, { letter: "ll" }, { letter: "rr" }, { letter: "qu" }, { letter: "gu" }] }, " передають один звук двома літерами"]
          ex: { examples: [[{ target: { letter: ch } }, "ico"], ["ca", { target: { letter: ll } }, "e"], ["pe", { target: { letter: rr } }, "o"]] }
          tr: { en: { examples: [boy, street, dog] }, uk: { examples: ["хлопець", "вулиця", "собака"] } }
        - level: A0
          point: { en: Silent h, es: La h muda, uk: "Німа h" }
          rule:
            en: [{ letter: h }, " is never pronounced"]
            es: ["la ", { letter: h }, " nunca se pronuncia"]
            uk: [{ letter: "h" }, " ніколи не вимовляють"]
          ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }
          tr: { en: { examples: [hello, hour] }, uk: { examples: ["привіт", "година"] } }
        - level: A0
          point: { en: [{ letter: c }, " and ", { letter: qu }], es: [{ letter: c }, " y ", { letter: qu }], uk: [{ letter: "c" }, " і ", { letter: "qu" }] }
          rule:
            en: [{ letter: c }, " before ", { letter: "a, o, u" }, ", ", { letter: qu }, " before ", { letter: "e, i" }, ", for one sound, ", { ipa: k }]
            es: [{ letter: c }, " delante de ", { letter: "a, o, u" }, ", ", { letter: qu }, " delante de ", { letter: "e, i" }, ", para un mismo sonido, ", { ipa: k }]
            uk: [{ letter: "c" }, " перед ", { letter: "a, o, u" }, ", ", { letter: "qu" }, " перед ", { letter: "e, i" }, " — для одного звука, ", { ipa: "k" }]
          ex: { examples: [[{ target: { letter: c } }, "asa"], [{ target: { letter: qu } }, "eso"]] }
          tr: { en: { examples: [house, cheese] }, uk: { examples: ["дім", "сир"] } }
        - level: A0
          point: { en: [{ letter: g }, " and ", { letter: gu }], es: [{ letter: g }, " y ", { letter: gu }], uk: [{ letter: "g" }, " і ", { letter: "gu" }] }
          rule:
            en: [{ letter: g }, " before ", { letter: "a, o, u" }, ", ", { letter: gu }, " before ", { letter: "e, i" }, ", for one sound, ", { ipa: g }]
            es: [{ letter: g }, " delante de ", { letter: "a, o, u" }, ", ", { letter: gu }, " delante de ", { letter: "e, i" }, ", para un mismo sonido, ", { ipa: g }]
            uk: [{ letter: "g" }, " перед ", { letter: "a, o, u" }, ", ", { letter: "gu" }, " перед ", { letter: "e, i" }, " — для одного звука, ", { ipa: "g" }]
          ex: { examples: [[{ target: { letter: g } }, "ato"], [{ target: { letter: gu } }, "itarra"]] }
          tr: { en: { examples: [cat, guitar] }, uk: { examples: ["кіт", "гітара"] } }
        - level: A0
          point: { en: [{ letter: z }, " and ", { letter: c }], es: [{ letter: z }, " y ", { letter: c }], uk: [{ letter: "z" }, " і ", { letter: "c" }] }
          rule:
            en:
              [
                { letter: z },
                " before ",
                { letter: "a, o, u" },
                ", ",
                { letter: c },
                " before ",
                { letter: "e, i" },
                ", for one sound, ",
                { variant: { ipa: s }, variety: es-419 },
                " ",
                { variant: { ipa: θ }, variety: es-ES },
              ]
            es:
              [
                { letter: z },
                " delante de ",
                { letter: "a, o, u" },
                ", ",
                { letter: c },
                " delante de ",
                { letter: "e, i" },
                ", para un mismo sonido, ",
                { variant: { ipa: s }, variety: es-419 },
                " ",
                { variant: { ipa: θ }, variety: es-ES },
              ]
            uk: [{ letter: "z" }, " перед ", { letter: "a, o, u" }, ", ", { letter: "c" }, " перед ", { letter: "e, i" }, " — для одного звука, ", { variant: { ipa: "s" }, variety: "es-419" }, " ", { variant: { ipa: "θ" }, variety: "es-ES" }]
          ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: c } }, "ine"]] }
          tr: { en: { examples: [shoe, cinema] }, uk: { examples: ["черевик", "кінотеатр"] } }
        - level: A0
          point: { en: [{ letter: j }, " and ", { letter: g }], es: [{ letter: j }, " y ", { letter: g }], uk: [{ letter: "j" }, " і ", { letter: "g" }] }
          rule:
            en: [{ letter: j }, " before any vowel and ", { letter: g }, " before ", { letter: "e, i" }, " sound the same, ", { ipa: x }]
            es: [{ letter: j }, " delante de cualquier vocal y ", { letter: g }, " delante de ", { letter: "e, i" }, " suenan igual, ", { ipa: x }]
            uk: [{ letter: "j" }, " перед будь-якою голосною і ", { letter: "g" }, " перед ", { letter: "e, i" }, " звучать однаково, ", { ipa: "x" }]
          ex: { examples: [[{ target: { letter: j } }, "amón"], [{ target: { letter: g } }, "ente"]] }
          tr: { en: { examples: [ham, people] }, uk: { examples: ["шинка", "люди"] } }
        - level: A0
          point: { en: [{ letter: b }, " and ", { letter: v }], es: [{ letter: b }, " y ", { letter: v }], uk: [{ letter: "b" }, " і ", { letter: "v" }] }
          rule:
            en: ["one sound, ", { ipa: b }, ", with two spellings; each word keeps its own"]
            es: ["un sonido, ", { ipa: b }, ", con dos letras; cada palabra lleva la suya"]
            uk: ["один звук, ", { ipa: "b" }, ", і дві літери; кожне слово пишеться зі своєю"]
          ex: { examples: [[{ target: { letter: b } }, "ueno"], [{ target: { letter: v } }, "ino"]] }
          tr: { en: { examples: [good, wine] }, uk: { examples: ["хороший", "вино"] } }
        - level: A0
          point: { en: [{ letter: ll }, " and ", { letter: "y" }], es: [{ letter: ll }, " y ", { letter: "y" }], uk: [{ letter: "ll" }, " і ", { letter: "y" }] }
          rule:
            en: [{ letter: ll }, " and ", { letter: "y" }, " before a vowel sound the same, ", { ipa: ʝ }]
            es: ["la ", { letter: ll }, " y la ", { letter: "y" }, " delante de vocal suenan igual, ", { ipa: ʝ }]
            uk: [{ letter: "ll" }, " і ", { letter: "y" }, " перед голосною звучать однаково, ", { ipa: "ʝ" }]
          ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
          tr: { en: { examples: [street, I] }, uk: { examples: ["вулиця", "я"] } }
        - level: A0
          point: { en: Small letters, es: Minúsculas, uk: "Мала літера" }
          rule:
            en: "days, months, languages and nationalities start with a small letter"
            es: "los días, los meses, los idiomas y las nacionalidades van con minúscula"
            uk: "дні, місяці, мови й національності пишуть з малої літери"
          ex: ["Los ", { target: lunes }, " estudio ", { target: inglés }, "."]
          tr: { en: On Mondays I study English., uk: "По понеділках я вивчаю англійську." }
        - level: A0
          point: { alternatives: ["¿ ?", "¡ !"] }
          rule:
            en: "questions and exclamations open with an upside-down mark"
            es: "las preguntas y las exclamaciones se abren con un signo invertido"
            uk: "питальні й окличні речення починаються з перевернутого знака"
          ex: { examples: [[{ target: "¿" }, "Dónde vives?"], [{ target: "¡" }, "Hola!"]] }
          tr: { en: { examples: [Where do you live?, Hello!] }, uk: { examples: ["Де ти живеш?", "Привіт!"] } }
        - level: A0
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["the ", { letter: u }, " of ", { letter: gue }, " and ", { letter: gui }, " is silent; ", { letter: ü }, " makes it sound"]
            es: ["la ", { letter: u }, " de ", { letter: gue }, " y ", { letter: gui }, " no suena; con ", { letter: ü }, " sí suena"]
            uk: [{ letter: "u" }, " у ", { letter: "gue" }, " та ", { letter: "gui" }, " не вимовляється; з ", { letter: "ü" }, " вона звучить"]
          ex: ["pin", { target: { letter: gü } }, "ino"]
          tr: { en: penguin, uk: "пінгвін" }

sections:
  - title: { en: The alphabet, es: El alfabeto, uk: "Алфавіт" }
    role: own
    content:
      - type: prose
        level: A0
        text:
          en: ["27 letters. Vowels: ", { letter: "a, e, i, o, u" }, ". The other 22 are consonants, ", { letter: ñ }, " among them."]
          es: ["27 letras. Vocales: ", { letter: "a, e, i, o, u" }, ". Las otras 22 son consonantes, entre ellas la ", { letter: ñ }, "."]
          uk: ["27 літер. Голосні: ", { letter: "a, e, i, o, u" }, ". Решта 22 — приголосні, серед них ", { letter: "ñ" }, "."]
      - type: inventory
        set: letters
        columns:
          - { key: letter, label: { en: Letter, es: Letra, uk: "Літера" } }
          - { key: name, label: { en: Name, es: Nombre, uk: "Назва" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A0, value: a, letter: A a, name: a, sound: { ipa: a }, ex: { ex: [{ letter: a }, migo], tr: { en: friend, uk: "друг" } } }
          - { level: A0, value: b, letter: B b, name: be, sound: { ipa: b }, ex: { ex: [{ letter: b }, oca], tr: { en: mouth, uk: "рот" } } }
          - level: A0
            value: c
            letter: C c
            name: ce
            sound: { alternatives: [{ ipa: k }, [{ variant: { ipa: s }, variety: es-419 }, " ", { variant: { ipa: θ }, variety: es-ES }]] }
            ex: { ex: { examples: [[{ letter: c }, asa], [{ letter: c }, ine]] }, tr: { en: { examples: [house, cinema] }, uk: { examples: ["дім", "кінотеатр"] } } }
          - { level: A0, value: d, letter: D d, name: de, sound: { ipa: d }, ex: { ex: [{ letter: d }, edo], tr: { en: finger, uk: "палець" } } }
          - { level: A0, value: e, letter: E e, name: e, sound: { ipa: e }, ex: { ex: [{ letter: e }, scuela], tr: { en: school, uk: "школа" } } }
          - { level: A0, value: f, letter: F f, name: efe, sound: { ipa: f }, ex: { ex: [{ letter: f }, uego], tr: { en: fire, uk: "вогонь" } } }
          - level: A0
            value: g
            letter: G g
            name: ge
            sound: { alternatives: [{ ipa: g }, { ipa: x }] }
            ex: { ex: { examples: [[{ letter: g }, ato], [{ letter: g }, ente]] }, tr: { en: { examples: [cat, people] }, uk: { examples: ["кіт", "люди"] } } }
          - { level: A0, value: h, letter: H h, name: hache, sound: { en: no sound, es: sin sonido, uk: "не звучить" }, ex: { ex: [{ letter: h }, ola], tr: { en: hello, uk: "привіт" } } }
          - { level: A0, value: i, letter: I i, name: i, sound: { ipa: i }, ex: { ex: [{ letter: i }, sla], tr: { en: island, uk: "острів" } } }
          - { level: A0, value: j, letter: J j, name: jota, sound: { ipa: x }, ex: { ex: [{ letter: j }, oven], tr: { en: young, uk: "молодий" } } }
          - { level: A0, value: k, letter: K k, name: ka, sound: { ipa: k }, ex: { ex: [{ letter: k }, ilo], tr: { en: kilo, uk: "кілограм" } } }
          - { level: A0, value: l, letter: L l, name: ele, sound: { ipa: l }, ex: { ex: [{ letter: l }, una], tr: { en: moon, uk: "місяць" } } }
          - { level: A0, value: m, letter: M m, name: eme, sound: { ipa: m }, ex: { ex: [{ letter: m }, esa], tr: { en: table, uk: "стіл" } } }
          - { level: A0, value: "n", letter: N n, name: ene, sound: { ipa: "n" }, ex: { ex: [{ letter: "n" }, oche], tr: { en: night, uk: "ніч" } } }
          - { level: A0, value: ñ, letter: Ñ ñ, name: eñe, sound: { ipa: ɲ }, ex: { ex: [ni, { letter: ñ }, o], tr: { en: child, uk: "дитина" } } }
          - { level: A0, value: o, letter: O o, name: o, sound: { ipa: o }, ex: { ex: [{ letter: o }, jo], tr: { en: eye, uk: "око" } } }
          - { level: A0, value: p, letter: P p, name: pe, sound: { ipa: p }, ex: { ex: [{ letter: p }, an], tr: { en: bread, uk: "хліб" } } }
          - { level: A0, value: q, letter: Q q, name: cu, sound: { ipa: k }, ex: { ex: [{ letter: q }, ueso], tr: { en: cheese, uk: "сир" } } }
          - level: A0
            value: r
            letter: R r
            name: erre
            sound: { alternatives: [{ ipa: ɾ }, { ipa: r }] }
            ex: { ex: { examples: [[pe, { letter: r }, o], [{ letter: r }, ojo]] }, tr: { en: { examples: [but, red] }, uk: { examples: ["але", "червоний"] } } }
          - { level: A0, value: s, letter: S s, name: ese, sound: { ipa: s }, ex: { ex: [{ letter: s }, ol], tr: { en: sun, uk: "сонце" } } }
          - { level: A0, value: t, letter: T t, name: te, sound: { ipa: t }, ex: { ex: [{ letter: t }, ren], tr: { en: train, uk: "потяг" } } }
          - { level: A0, value: u, letter: U u, name: u, sound: { ipa: u }, ex: { ex: [{ letter: u }, va], tr: { en: grape, uk: "виноград" } } }
          - level: A0
            value: v
            letter: V v
            name: [{ variant: ve, variety: es-419 }, " ", { variant: uve, variety: es-ES }]
            sound: { ipa: b }
            ex: { ex: [{ letter: v }, ino], tr: { en: wine, uk: "вино" } }
          - level: A0
            value: w
            letter: W w
            name: [{ variant: doble u, variety: es-419 }, " ", { variant: uve doble, variety: es-ES }]
            sound: { ipa: w }
            ex: { ex: [ki, { letter: w }, i], tr: { en: kiwi, uk: "ківі" } }
          - level: A0
            value: x
            letter: X x
            name: equis
            sound: { alternatives: [{ ipa: ks }, { ipa: x }] }
            ex: { ex: { examples: [[ta, { letter: x }, i], [Mé, { letter: x }, ico]] }, tr: { en: { examples: [taxi, Mexico] }, uk: { examples: ["таксі", "Мексика"] } } }
          - level: A0
            value: "y"
            letter: Y y
            name: { alternatives: [ye, i griega] }
            sound: { alternatives: [{ ipa: ʝ }, { ipa: i }] }
            ex: { ex: { examples: [[{ letter: "y" }, o], [ho, { letter: "y" }]] }, tr: { en: { examples: [I, today] }, uk: { examples: ["я", "сьогодні"] } } }
          - level: A0
            value: z
            letter: Z z
            name: zeta
            sound: [{ variant: { ipa: s }, variety: es-419 }, " ", { variant: { ipa: θ }, variety: es-ES }]
            ex: { ex: [{ letter: z }, apato], tr: { en: shoe, uk: "черевик" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The names of the vowels are their sounds: ", { term: "a, e, i, o, u" }, "."]
              es: ["Los nombres de las vocales son sus sonidos: ", { term: "a, e, i, o, u" }, "."]
              uk: ["Назви голосних збігаються з їхніми звуками: ", { term: "a, e, i, o, u" }, "."]
          - type: rule
            level: A0
            text:
              en: [{ letter: ñ }, " is a letter of its own and comes after ", { letter: "n" }, " in the dictionary."]
              es: ["La ", { letter: ñ }, " es una letra propia y va después de la ", { letter: "n" }, " en el diccionario."]
              uk: [{ letter: "ñ" }, " — окрема літера; у словнику вона йде після ", { letter: "n" }, "."]
          - type: note
            level: A0
            text:
              en: [{ letter: k }, " and ", { letter: w }, " appear mostly in words from other languages: ", { term: kilo }, ", ", { term: kiwi }, ". ", { letter: w }, " sounds ", { ipa: w }, " in most of them and ", { ipa: b }, " in a few names: ", { term: Wagner }, "."]
              es: ["La ", { letter: k }, " y la ", { letter: w }, " aparecen sobre todo en palabras de otras lenguas: ", { term: kilo }, ", ", { term: kiwi }, ". La ", { letter: w }, " suena ", { ipa: w }, " en casi todas y ", { ipa: b }, " en algunos nombres: ", { term: Wagner }, "."]
              uk: [{ letter: "k" }, " і ", { letter: "w" }, " трапляються переважно в запозиченнях: ", { term: "kilo" }, ", ", { term: "kiwi" }, ". ", { letter: "w" }, " здебільшого звучить ", { ipa: "w" }, ", а в кількох іменах — ", { ipa: "b" }, ": ", { term: "Wagner" }, "."]
          - type: note
            level: A0
            text:
              en: [{ letter: x }, " sounds ", { ipa: ks }, ": ", { term: taxi }, ". In ", { term: México }, ", ", { term: Oaxaca }, " and ", { term: Texas }, " it keeps an old sound, ", { ipa: x }, ", the sound of ", { letter: j }, "."]
              es: ["La ", { letter: x }, " suena ", { ipa: ks }, ": ", { term: taxi }, ". En ", { term: México }, ", ", { term: Oaxaca }, " y ", { term: Texas }, " conserva un sonido antiguo, ", { ipa: x }, ", el de la ", { letter: j }, "."]
              uk: [{ letter: "x" }, " звучить ", { ipa: "ks" }, ": ", { term: "taxi" }, ". У ", { term: "México" }, ", ", { term: "Oaxaca" }, " і ", { term: "Texas" }, " вона зберігає давній звук ", { ipa: "x" }, ", як ", { letter: "j" }, "."]
          - type: note
            level: A0
            text:
              en: [{ term: Ye }, " is the name the Real Academia Española recommends for ", { letter: "y" }, "; ", { term: i griega }, " is still common."]
              es: [{ term: Ye }, " es el nombre que recomienda la Real Academia Española para la ", { letter: "y" }, "; ", { term: i griega }, " sigue siendo frecuente."]
              uk: [{ term: "Ye" }, " — назва, яку для ", { letter: "y" }, " рекомендує Королівська академія іспанської мови; ", { term: "i griega" }, " досі вживають часто."]
          - type: rule
            level: A0
            text:
              en: "To spell a word aloud, say the names of its letters:"
              es: "Para deletrear una palabra, se dicen los nombres de sus letras:"
              uk: "Щоб назвати слово по літерах, вимовляють назви його літер:"
            ex: { exchange: ["¿Cómo se escribe tu apellido?", "Pe, e, erre, e, zeta: Pérez."] }
            tr: { en: { exchange: [How do you spell your surname?, "P, E, R, E, Z: Pérez."] }, uk: { exchange: ["Як пишеться твоє прізвище?", "P, E, R, E, Z: Перес."] } }
          - type: note
            level: A0
            variety: es-419
            text:
              en: ["To tell ", { letter: b }, " from ", { letter: v }, " when spelling, many speakers say ", { term: be larga }, " and ", { term: ve corta }, "."]
              es: ["Para distinguir la ", { letter: b }, " de la ", { letter: v }, " al deletrear, muchos hablantes dicen ", { term: be larga }, " y ", { term: ve corta }, "."]
              uk: ["Щоб розрізнити ", { letter: "b" }, " і ", { letter: "v" }, " під час називання по літерах, багато хто каже ", { term: "be larga" }, " і ", { term: "ve corta" }, "."]
          - type: note
            level: A0
            variety: es-419
            text:
              en: ["Many speakers also call ", { letter: w }, " ", { term: doble ve }, "."]
              es: ["Muchos hablantes llaman también ", { term: doble ve }, " a la ", { letter: w }, "."]
              uk: ["Багато мовців також називають ", { letter: "w" }, " ", { term: "doble ve" }, "."]

  - title: { en: Sounds and their letters, es: Los sonidos y sus letras, uk: "Звуки та їхні літери" }
    role: own
    content:
      - type: usage
        columns:
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук" } }
          - { key: spelling, label: { en: Spelling, es: Escritura, uk: "Написання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - level: A0
            sound: { ipa: k }
            spelling: { alternatives: [{ pattern: [{ letter: c }, { letter: "a, o, u" }] }, { pattern: [{ letter: qu }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: c } }, "asa"], [{ target: { letter: qu } }, "ince"]] }
            tr: { en: { examples: [house, fifteen] }, uk: { examples: ["дім", "п’ятнадцять"] } }
          - level: A0
            sound: { ipa: g }
            spelling: { alternatives: [{ pattern: [{ letter: g }, { letter: "a, o, u" }] }, { pattern: [{ letter: gu }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: g } }, "ato"], [{ target: { letter: gu } }, "itarra"]] }
            tr: { en: { examples: [cat, guitar] }, uk: { examples: ["кіт", "гітара"] } }
          - level: A0
            sound: { ipa: x }
            spelling: { alternatives: [{ letter: j }, { pattern: [{ letter: g }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: j } }, "amón"], [{ target: { letter: g } }, "ente"]] }
            tr: { en: { examples: [ham, people] }, uk: { examples: ["шинка", "люди"] } }
          - level: A0
            sound: [{ variant: { ipa: s }, variety: es-419 }, " ", { variant: { ipa: θ }, variety: es-ES }]
            spelling: { alternatives: [{ pattern: [{ letter: z }, { letter: "a, o, u" }] }, { pattern: [{ letter: c }, { letter: "e, i" }] }] }
            ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: c } }, "ine"]] }
            tr: { en: { examples: [shoe, cinema] }, uk: { examples: ["черевик", "кінотеатр"] } }
          - level: A0
            sound: { ipa: b }
            spelling: { alternatives: [{ letter: b }, { letter: v }] }
            ex: { examples: [[{ target: { letter: b } }, "ueno"], [{ target: { letter: v } }, "ino"]] }
            tr: { en: { examples: [good, wine] }, uk: { examples: ["хороший", "вино"] } }
          - level: A0
            sound: { ipa: ʝ }
            spelling: { alternatives: [{ letter: ll }, { letter: "y" }] }
            ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
            tr: { en: { examples: [street, I] }, uk: { examples: ["вулиця", "я"] } }
          - level: A0
            sound: { ipa: tʃ }
            spelling: { letter: ch }
            ex: { examples: [[{ target: { letter: ch } }, "ico"], ["no", { target: { letter: ch } }, "e"]] }
            tr: { en: { examples: [boy, night] }, uk: { examples: ["хлопець", "ніч"] } }
          - level: A0
            sound: { ipa: r }
            spelling: { alternatives: [{ letter: rr }, { letter: r }] }
            ex: { examples: [["pe", { target: { letter: rr } }, "o"], [{ target: { letter: r } }, "ojo"]] }
            tr: { en: { examples: [dog, red] }, uk: { examples: ["собака", "червоний"] } }
          - level: A0
            sound: { en: no sound, es: sin sonido, uk: "не звучить" }
            spelling: { letter: h }
            ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }
            tr: { en: { examples: [hello, hour] }, uk: { examples: ["привіт", "година"] } }
      - type: list
        items:
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: [{ letter: "h" }, " не вимовляється: ", { term: hola }, " звучить «ола», а не «гола» чи «хола»."]
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: [{ letter: "j" }, " і ", { letter: "g" }, " перед ", { letter: "e, i" }, " звучать як українське х: ", { term: jamón }, " — «хамон», а не «жамон»."]
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: [{ letter: "c" }, " перед ", { letter: "e, i" }, " — не ц: ", { term: cine }, " у Латинській Америці звучить «сіне», а в Іспанії — з міжзубним звуком, як англійське th."]
          - type: rule
            level: A0
            text:
              en: ["The ", { letter: u }, " of ", { alternatives: [{ letter: que }, { letter: qui }, { letter: gue }, { letter: gui }] }, " is silent; it only marks the sound."]
              es: ["La ", { letter: u }, " de ", { alternatives: [{ letter: que }, { letter: qui }, { letter: gue }, { letter: gui }] }, " no suena: solo indica el sonido."]
              uk: [{ letter: "u" }, " у ", { alternatives: [{ letter: "que" }, { letter: "qui" }, { letter: "gue" }, { letter: "gui" }] }, " не вимовляється: вона лише вказує на звук."]
          - type: rule
            level: A0
            text:
              en: ["Two dots, ", { letter: ü }, ", make the ", { letter: u }, " of ", { letter: gue }, " and ", { letter: gui }, " sound:"]
              es: ["La diéresis, ", { letter: ü }, ", hace sonar la ", { letter: u }, " de ", { letter: gue }, " y ", { letter: gui }, ":"]
              uk: ["Дві крапки, ", { letter: "ü" }, ", змушують звучати ", { letter: "u" }, " у ", { letter: "gue" }, " і ", { letter: "gui" }, ":"]
            ex: { examples: [["pin", { target: { letter: gü } }, "ino"], ["ver", { target: { letter: gü } }, "enza"]] }
            tr: { en: { examples: [penguin, shame] }, uk: { examples: ["пінгвін", "сором"] } }
          - type: rule
            level: A0
            text:
              en: ["The strong ", { letter: r }, ", ", { ipa: r }, ", is ", { letter: rr }, " between vowels, and one ", { letter: r }, " at the start of a word; elsewhere ", { letter: r }, " is the soft ", { ipa: ɾ }, "."]
              es: ["La ", { letter: r }, " fuerte, ", { ipa: r }, ", se escribe ", { letter: rr }, " entre vocales, y con una sola ", { letter: r }, " al principio de palabra; en los demás casos la ", { letter: r }, " es suave, ", { ipa: ɾ }, "."]
              uk: ["Сильний ", { letter: "r" }, ", ", { ipa: "r" }, ", пишуть як ", { letter: "rr" }, " між голосними й однією ", { letter: "r" }, " на початку слова; в інших позиціях ", { letter: "r" }, " — це м’який ", { ipa: "ɾ" }, "."]
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["In most of Spain, ", { letter: z }, " and ", { letter: c }, " before ", { letter: "e, i" }, " sound ", { ipa: θ }, ", like th in English think, and ", { letter: s }, " keeps ", { ipa: s }, "."]
              es: ["En la mayor parte de España, la ", { letter: z }, " y la ", { letter: c }, " delante de ", { letter: "e, i" }, " suenan ", { ipa: θ }, ", y la ", { letter: s }, " conserva ", { ipa: s }, "."]
              uk: ["У більшій частині Іспанії ", { letter: "z" }, " і ", { letter: "c" }, " перед ", { letter: "e, i" }, " звучать ", { ipa: "θ" }, ", як th в англійському think, а ", { letter: "s" }, " зберігає ", { ipa: "s" }, "."]
          - type: note
            level: A0
            variety: es-419
            text:
              en: [{ letter: s }, ", ", { letter: z }, " and ", { letter: c }, " before ", { letter: "e, i" }, " all sound ", { ipa: s }, ", so ", { term: casa }, " and ", { term: caza }, " sound alike."]
              es: ["La ", { letter: s }, ", la ", { letter: z }, " y la ", { letter: c }, " delante de ", { letter: "e, i" }, " suenan ", { ipa: s }, ", así que ", { term: casa }, " y ", { term: caza }, " suenan igual."]
              uk: [{ letter: "s" }, ", ", { letter: "z" }, " і ", { letter: "c" }, " перед ", { letter: "e, i" }, " звучать як ", { ipa: "s" }, ", тож ", { term: "casa" }, " і ", { term: "caza" }, " вимовляють однаково."]
          - type: note
            level: A0
            variety: es-419
            text:
              en: ["In Argentina and Uruguay, ", { letter: ll }, " and ", { letter: "y" }, " sound ", { ipa: ʃ }, ", like sh in English she, or ", { ipa: ʒ }, ": ", { term: calle }, ", ", { term: yo }, "."]
              es: ["En Argentina y Uruguay, la ", { letter: ll }, " y la ", { letter: "y" }, " suenan ", { ipa: ʃ }, " o ", { ipa: ʒ }, ": ", { term: calle }, ", ", { term: yo }, "."]
              uk: ["В Аргентині та Уругваї ", { letter: "ll" }, " і ", { letter: "y" }, " звучать ", { ipa: "ʃ" }, ", як ш, або ", { ipa: "ʒ" }, ", як ж: ", { term: "calle" }, ", ", { term: "yo" }, "."]

  - title: { en: Small letters and question marks, es: Minúsculas y signos, uk: "Малі літери та знаки" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Days, months, languages and nationalities start with a small letter:"
              es: "Los días, los meses, los idiomas y las nacionalidades se escriben con minúscula:"
              uk: "Дні, місяці, мови й національності пишуть з малої літери:"
            ex: ["Los ", { target: lunes }, " estudio ", { target: inglés }, "."]
            tr: { en: On Mondays I study English., uk: "По понеділках я вивчаю англійську." }
          - type: rule
            level: A0
            text:
              en: "Names of people, cities and countries start with a capital letter:"
              es: "Los nombres de personas, ciudades y países se escriben con mayúscula:"
              uk: "Імена людей, назви міст і країн пишуть з великої літери:"
            ex: [{ target: { letter: A } }, "na vive en ", { target: { letter: L } }, "ima."]
            tr: { en: Ana lives in Lima., uk: "Ана живе в Лімі." }
          - type: rule
            level: A0
            text:
              en: ["A question opens with ", { letter: "¿" }, " and an exclamation with ", { letter: "¡" }, ":"]
              es: ["Una pregunta se abre con ", { letter: "¿" }, " y una exclamación con ", { letter: "¡" }, ":"]
              uk: ["Питання починається з ", { letter: "¿" }, ", а окличне речення — з ", { letter: "¡" }, ":"]
            ex: { examples: [[{ target: "¿" }, "Dónde vives?"], [{ target: "¡" }, "Qué bonito!"]] }
            tr: { en: { examples: [Where do you live?, How pretty!] }, uk: { examples: ["Де ти живеш?", "Яка краса!"] } }
          - type: rule
            level: A0
            text:
              en: "The opening mark goes where the question starts, even inside a sentence:"
              es: "El signo de apertura va donde empieza la pregunta, también dentro de una frase:"
              uk: "Початковий знак ставлять там, де починається питання, навіть усередині речення:"
            ex: ["Y tú, ", { target: "¿" }, "de dónde eres?"]
            tr: { en: "And you, where are you from?", uk: "А ти звідки?" }

