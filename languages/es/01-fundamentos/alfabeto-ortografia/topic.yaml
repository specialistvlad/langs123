  - title: { en: Small letters and question marks, es: Minúsculas y signos, uk: "Малі літери та знаки", pt: "Minúsculas e pontos de interrogação", fr: "Minuscules et points d’interrogation", de: "Kleinschreibung und Fragezeichen", it: "Minuscole e punti interrogativi", pl: "Małe litery i znaki zapytania", tr: "Küçük harfler ve soru işaretleri", id: "Huruf kecil dan tanda tanya", vi: "Chữ thường và dấu hỏi chấm" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Days, months, languages and nationalities start with a small letter:"
              es: "Los días, los meses, los idiomas y las nacionalidades se escriben con minúscula:"
              uk: "Дні, місяці, мови й національності пишуть з малої літери:"
              pt: "Os dias da semana, os meses, os idiomas e as nacionalidades se escrevem com letra minúscula:"
              fr: "Les jours, les mois, les langues et les nationalités s’écrivent avec une minuscule :"
              de: "Wochentage, Monate, Sprachen und Nationalitäten schreibt man klein:"
              it: "I giorni, i mesi, le lingue e le nazionalità si scrivono con l'iniziale minuscola:"
              pl: "Dni tygodnia, miesiące, języki i narodowości piszemy małą literą:"
              tr: "Haftanın günleri, aylar, diller ve uyruklar küçük harfle yazılır:"
              id: "Nama hari, bulan, bahasa, dan kebangsaan ditulis dengan huruf kecil:"
              vi: "Tên các thứ, tháng, ngôn ngữ và quốc tịch viết bằng chữ thường:"
            ex: ["Los ", { target: lunes }, " estudio ", { target: inglés }, "."]
            tr: { en: On Mondays I study English., uk: "По понеділках я вивчаю англійську.", pt: "Às segundas-feiras estudo inglês.", fr: "Le lundi, j’étudie l’anglais.", de: "Montags lerne ich Englisch.", it: "Il lunedì studio inglese.", pl: "W poniedziałki uczę się angielskiego.", tr: "Pazartesi günleri İngilizce çalışıyorum.", id: "Setiap hari Senin saya belajar bahasa Inggris.", vi: "Vào các ngày thứ Hai, tôi học tiếng Anh." }
          - type: rule
            level: A0
            text:
              en: "Names of people, cities and countries start with a capital letter:"
              es: "Los nombres de personas, ciudades y países se escriben con mayúscula:"
              uk: "Імена людей, назви міст і країн пишуть з великої літери:"
              pt: "Os nomes de pessoas, cidades e países se escrevem com letra maiúscula:"
              fr: "Les noms de personnes, de villes et de pays s’écrivent avec une majuscule :"
              de: "Namen von Personen, Städten und Ländern schreibt man groß:"
              it: "I nomi di persone, città e paesi si scrivono con l'iniziale maiuscola:"
              pl: "Imiona oraz nazwy miast i krajów piszemy wielką literą:"
              tr: "Kişi, şehir ve ülke adları büyük harfle yazılır:"
              id: "Nama orang, kota, dan negara ditulis dengan huruf kapital:"
              vi: "Tên người, thành phố và quốc gia viết hoa chữ cái đầu:"
            ex: [{ target: { letter: A } }, "na vive en ", { target: { letter: L } }, "ima."]
            tr: { en: Ana lives in Lima., uk: "Ана живе в Лімі.", pt: "Ana mora em Lima.", fr: "Ana habite à Lima.", de: "Ana wohnt in Lima.", it: "Ana abita a Lima.", pl: "Ana mieszka w Limie.", tr: "Ana Lima'da yaşıyor.", id: "Ana tinggal di Lima.", vi: "Ana sống ở Lima." }
          - type: rule
            level: A0
            text:
              en: ["A question opens with ", { letter: "¿" }, " and an exclamation with ", { letter: "¡" }, ":"]
              es: ["Una pregunta se abre con ", { letter: "¿" }, " y una exclamación con ", { letter: "¡" }, ":"]
              uk: ["Питання починається з ", { letter: "¿" }, ", а окличне речення — з ", { letter: "¡" }, ":"]
              pt: ["Uma pergunta começa com ", { letter: "¿" }, " e uma exclamação com ", { letter: "¡" }, ":"]
              fr: ["Une question s’ouvre par ", { letter: "¿" }, " et une exclamation par ", { letter: "¡" }, " :"]
              de: ["Eine Frage beginnt mit ", { letter: "¿" }, " und ein Ausruf mit ", { letter: "¡" }, ":"]
              it: ["Una domanda si apre con ", { letter: "¿" }, " e un'esclamazione con ", { letter: "¡" }, ":"]
