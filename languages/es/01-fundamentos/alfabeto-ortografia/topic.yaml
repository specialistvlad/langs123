              pt: "O sinal de abertura vai onde a pergunta começa, mesmo no meio de uma frase:"
              fr: "Le signe d’ouverture se place là où commence la question, même à l’intérieur d’une phrase :"
              de: "Das Eröffnungszeichen steht dort, wo die Frage beginnt, auch mitten im Satz:"
              it: "Il segno di apertura va dove comincia la domanda, anche all'interno di una frase:"
              pl: "Znak otwierający stawiamy tam, gdzie zaczyna się pytanie, także w środku zdania:"
              tr: "Açılış işareti, cümlenin ortasında bile, sorunun başladığı yere konur:"
              id: "Tanda pembuka diletakkan di tempat pertanyaan dimulai, bahkan di tengah kalimat:"
              vi: "Dấu mở được đặt ở chỗ câu hỏi bắt đầu, kể cả ở giữa câu:"
            ex: ["Y tú, ", { target: "¿" }, "de dónde eres?"]
            tr: { en: "And you, where are you from?", uk: "А ти звідки?", pt: "E você, de onde é?", fr: "Et toi, tu viens d’où ?", de: "Und du, woher kommst du?", it: "E tu, di dove sei?", pl: "A ty, skąd jesteś?", tr: "Peki sen, nerelisin?", id: "Kalau kamu, asalmu dari mana?", vi: "Còn bạn, bạn từ đâu đến?" }

