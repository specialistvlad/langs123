              tr: ["Soru cümlesi ", { letter: "¿" }, " ile, ünlem cümlesi ", { letter: "¡" }, " ile başlar:"]
              id: ["Kalimat tanya diawali dengan ", { letter: "¿" }, " dan kalimat seru dengan ", { letter: "¡" }, ":"]
              vi: ["Câu hỏi mở đầu bằng ", { letter: "¿" }, " và câu cảm thán mở đầu bằng ", { letter: "¡" }, ":"]
            ex: { examples: [[{ target: "¿" }, "Dónde vives?"], [{ target: "¡" }, "Qué bonito!"]] }
            tr: { en: { examples: [Where do you live?, How pretty!] }, uk: { examples: ["Де ти живеш?", "Яка краса!"] }, pt: { examples: ["Onde você mora?", "Que bonito!"] }, fr: { examples: ["Où habites-tu ?", "Comme c’est joli !"] }, de: { examples: ["Wo wohnst du?", "Wie schön!"] }, it: { examples: ["Dove abiti?", "Che bello!"] }, pl: { examples: ["Gdzie mieszkasz?", "Jak ładnie!"] }, tr: { examples: ["Nerede yaşıyorsun?", "Ne güzel!"] }, id: { examples: ["Kamu tinggal di mana?", "Bagus sekali!"] }, vi: { examples: ["Bạn sống ở đâu?", "Đẹp quá!"] } }
          - type: rule
            level: A0
            text:
              en: "The opening mark goes where the question starts, even inside a sentence:"
              es: "El signo de apertura va donde empieza la pregunta, también dentro de una frase:"
