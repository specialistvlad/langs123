            rule: { es: ["en las terminaciones ", { term: "-logía" }, ", ", { term: "-gogía" }, ", ", { term: "-ígena" }, " y ", { term: "-ígeno" }] }
            ex: { examples: [["tecnolo", { target: { letter: g } }, "ía"], ["pedago", { target: { letter: g } }, "ía"], ["indí", { target: { letter: g } }, "ena"], ["oxí", { target: { letter: g } }, "eno"]] }
          - level: C1
            letter: { letter: g }
            rule: { es: ["en los verbos terminados en ", { term: "-ger" }, ", ", { term: "-gir" }, " y ", { term: "-gerar" }, ", salvo ", { term: tejer }, " y ", { term: crujir }] }
            ex: { examples: [["prote", { target: { letter: g } }, "er"], ["sur", { target: { letter: g } }, "ir"], ["exa", { target: { letter: g } }, "erar"]] }
          - level: C2
            letter: { letter: g }
            rule: { es: ["en las palabras terminadas en ", { term: "-algia" }, ", que significa ‘dolor’"] }
            ex: { examples: [["nostal", { target: { letter: g } }, "ia"], ["neural", { target: { letter: g } }, "ia"]] }
          - level: B2
            letter: { letter: j }
            rule: { es: ["en el imperfecto de subjuntivo de ", { term: decir }, ", ", { term: traer }, " y los verbos en ", { term: "-ducir" }] }
            ex: { examples: [["di", { target: { letter: j } }, "era"], ["tra", { target: { letter: j } }, "eras"], ["produ", { target: { letter: j } }, "era"]] }
          - level: B2
            letter: { letter: j }
            rule: { es: ["en las terminaciones ", { term: "-jera" }, ", ", { term: "-jería" }, ", ", { term: "-jerío" }, " y ", { term: "-jero" }] }
            ex: { examples: [["ti", { target: { letter: j } }, "eras"], ["conse", { target: { letter: j } }, "ería"], ["conse", { target: { letter: j } }, "ero"]] }
          - level: C1
            letter: { letter: j }
            rule: { es: ["en las palabras terminadas en ", { term: "-eje" }] }
            ex: ["here", { target: { letter: j } }, "e"]
          - level: C1
            letter: { letter: j }
            rule: { es: ["en los verbos terminados en ", { term: "-jear" }, " y en ", { term: tejer }, " y ", { term: crujir }] }
            ex: { examples: [["can", { target: { letter: j } }, "ear"], ["te", { target: { letter: j } }, "er"], ["cru", { target: { letter: j } }, "ir"]] }
          - level: C2
            letter: { alternatives: [{ letter: j }, { letter: g }] }
            rule: { es: [{ term: injerir }, " significa ‘meter una cosa en otra’ o ‘entrometerse’ e ", { term: ingerir }, " significa ‘tragar’"] }
            ex: { examples: [["No quiere ", { target: injerirse }, " en tus asuntos."], ["No debes ", { target: ingerir }, " alcohol antes de conducir."]] }
          - level: B2
            letter: { letter: h }
            rule: { es: ["al comienzo de las palabras con ", { term: "hia-" }, ", ", { term: "hie-" }, " y ", { term: "hui-" }] }
            ex: { examples: [[{ target: { letter: h } }, "iato"], [{ target: { letter: h } }, "ierbabuena"], [{ target: { letter: h } }, "uida"]] }
          - level: C1
            letter: { letter: h }
            rule: { es: "se conserva en los derivados de palabras que la llevan" }
            ex: { examples: [["re", { target: { letter: h } }, "acer"], [{ target: { letter: h } }, "erboristería"]] }
          - level: C1
            letter: { letter: h }
            rule: { es: ["la ", { letter: h }, " de ", { term: "hue-" }, " inicial desaparece en algunos derivados"] }
            ex: { examples: [{ mapping: [huérfano, orfanato] }, { mapping: [hueso, óseo] }, { mapping: [huevo, oval] }] }
          - level: C1
            letter: { letter: h }
            rule: { es: ["al comienzo de estos elementos de origen griego: ", { term: "hecto-" }, ", ", { term: "helio-" }, ", ", { term: "hema-" }, ", ", { term: "hemi-" }, ", ", { term: "hepta-" }, ", ", { term: "hetero-" }, " e ", { term: "hidro-" }] }
            ex: { examples: [[{ target: { letter: h } }, "ectómetro"], [{ target: { letter: h } }, "emisferio"], [{ target: { letter: h } }, "eterogéneo"]] }
          - level: C1
            letter: { letter: h }
            rule: { es: ["al comienzo de estos elementos de origen griego: ", { term: "higro-" }, ", ", { term: "hiper-" }, ", ", { term: "hipo-" }, ", ", { term: "holo-" }, ", ", { term: "homeo-" }, ", ", { term: "homo-" }, " y ", { term: "hagio-" }] }
            ex: { examples: [[{ target: { letter: h } }, "ipermercado"], [{ target: { letter: h } }, "ipotermia"], [{ target: { letter: h } }, "olograma"], [{ target: { letter: h } }, "omófono"]] }
          - level: C2
            letter: { letter: h }
            rule: { es: [{ term: hojear }, " significa ‘pasar las hojas’ y ", { term: ojear }, " significa ‘mirar de prisa’"] }
            ex: { examples: [[{ target: Hojeo }, " el periódico en el tren."], [{ target: Ojeo }, " la sala buscando a Ana."]] }
          - level: C2
            letter: { letter: h }
            rule: { es: [{ term: haya }, " es una forma de ", { term: haber }, " y ", { term: aya }, " es una persona que cuida niños"] }
            ex: { examples: [["Espero que ", { target: haya }, " sol."], ["La ", { target: aya }, " cuidaba a los niños."]] }
          - level: C2
            letter: { letter: h }
            rule: { es: [{ term: huso }, " es el instrumento para hilar y ", { term: uso }, " significa ‘empleo’"] }
            ex: { examples: [["La abuela hila con un ", { target: huso }, "."], ["El ", { target: uso }, " del casco es obligatorio."]] }
          - level: C2
            letter: { letter: h }
            rule: { es: [{ term: hora }, " mide el tiempo y ", { term: ora }, " es una forma de ", { term: orar }] }
            ex: { examples: [["¿Qué ", { target: hora }, " es?"], ["Ana ", { target: ora }, " en la iglesia."]] }
          - level: C2
            letter: { alternatives: [{ letter: h }, { letter: "y" }] }
            rule: { es: "se admiten las dos grafías" }
            ex: { examples: [[{ target: { letter: h } }, "ierba"], [{ target: { letter: "y" } }, "erba"]] }
          - level: B2
            letter: { letter: "y" }
            rule: { es: ["en las palabras con ", { term: "-yec-" }] }
            ex: { examples: [["pro", { target: { letter: "y" } }, "ecto"], ["tra", { target: { letter: "y" } }, "ecto"]] }
          - level: C2
            letter: { letter: "y" }
            rule: { es: ["después de los prefijos ", { term: "ad-" }, ", ", { term: "dis-" }, " y ", { term: "sub-" }] }
            ex: { examples: [["ad", { target: { letter: "y" } }, "acente"], ["dis", { target: { letter: "y" } }, "untivo"], ["sub", { target: { letter: "y" } }, "acente"]] }
          - level: B2
            letter: { alternatives: [{ letter: "y" }, { letter: ll }] }
            rule: { es: [{ term: haya }, " es una forma de ", { term: haber }, " y ", { term: halla }, " es una forma de ", { term: hallar }] }
            ex: { examples: [["Ojalá ", { target: haya }, " paz."], ["Ana ", { target: halla }, " su llave."]] }
          - level: B2
            letter: { alternatives: [{ letter: ll }, { letter: "y" }] }
            rule: { es: [{ term: ralla }, " es una forma de ", { term: rallar }, " y ", { term: raya }, " es una línea"] }
            ex: { examples: [["Él ", { target: ralla }, " el queso."], ["Dibuja una ", { target: raya }, " roja."]] }
          - level: B2
            letter: { letter: ll }
            rule: { es: ["en las terminaciones ", { term: "-illo" }, " e ", { term: "-illa" }] }
            ex: { examples: [["pobreci", { target: { letter: ll } }, "o"], ["cami", { target: { letter: ll } }, "a"]] }
          - level: C1
            letter: { letter: ll }
            rule: { es: ["en los verbos terminados en ", { term: "-ellar" }, ", ", { term: "-illar" }, ", ", { term: "-ullar" }, " y ", { term: "-ullir" }] }
            ex: { examples: [["estre", { target: { letter: ll } }, "ar"], ["chi", { target: { letter: ll } }, "ar"], ["zambu", { target: { letter: ll } }, "ir"]] }
          - level: B2
            letter: { letter: k }
            rule: { es: "en los extranjerismos, antes de consonante o al final de palabra" }
            ex: { examples: [["anora", { target: { letter: k } }], [{ target: { letter: k } }, "remlin"]] }
          - level: C2
            letter: { alternatives: [{ letter: k }, { letter: c }] }
            rule: { es: "se admiten las dos grafías" }
            ex: { examples: [[{ target: { letter: k } }, "urdo"], [{ target: { letter: c } }, "urdo"]] }
          - level: C2
            letter: { letter: qu }
            rule: { es: ["se conserva delante de ", { letter: "a, o" }, " en voces científicas y latinas"] }
            ex: { examples: [[{ target: { letter: qu } }, "ark"], [{ target: { letter: qu } }, "órum"]] }
          - level: C2
            letter: { letter: w }
            rule: { es: ["en nombres propios y voces extranjeras; algunas se adaptan con ", { letter: v }] }
            ex: { examples: [[{ target: { letter: w } }, "áter"], [{ target: { letter: v } }, "áter"], [{ target: { letter: W } }, "enceslao"]] }
          - level: C2
            letter: { letter: z }
            rule: { es: ["delante de ", { letter: "e, i" }, " en voces extranjeras"] }
            ex: { examples: [[{ target: { letter: z } }, "igzag"], [{ target: { letter: z } }, "epelín"]] }
          - level: C2
            letter: { alternatives: [{ letter: c }, { letter: z }] }
            rule: { es: "se admiten las dos grafías" }
            ex: { examples: [[{ target: { letter: c } }, "inc"], [{ target: { letter: z } }, "inc"]] }
          - level: C2
            letter: { letter: x }
            rule: { es: ["al comienzo de los elementos griegos ", { term: "xeno-" }, ", ", { term: "xero-" }, " y ", { term: "xilo-" }] }
            ex: { examples: [[{ target: { letter: x } }, "enofobia"], [{ target: { letter: x } }, "erografía"], [{ target: { letter: x } }, "ilófono"]] }
          - level: C2
            letter: { alternatives: [{ letter: gn }, { letter: mn }] }
            rule: { es: ["se admite simplificar ", { letter: gn }, " y ", { letter: mn }, " iniciales en ", { letter: "n" }] }
            ex: { examples: [[{ target: { letter: gn } }, "omo"], [{ target: { letter: "n" } }, "omo"], [{ target: { letter: mn } }, "emotécnico"], [{ target: { letter: "n" } }, "emotécnico"]] }
          - level: C2
            letter: { letter: ñ }
            rule: { es: "al comienzo de palabra, en pocas voces" }
            ex: { examples: [[{ target: { letter: ñ } }, "oño"], [{ target: { letter: ñ } }, "u"]] }
          - level: C1
            letter: { letter: rr }
            rule: { es: ["en los compuestos cuyo segundo elemento empieza por ", { letter: r }] }
            ex: { examples: [["vice", { target: { letter: rr } }, "ector"], ["contra", { target: { letter: rr } }, "eloj"]] }
          - level: B2
            letter: { alternatives: [{ letter: pos }, { letter: post }] }
            rule: { es: ["delante de consonante se admiten las dos formas; se prefiere ", { term: "pos-" }] }
            ex: { examples: [[{ target: pos }, "data"], [{ target: post }, "data"]] }
          - level: B2
            letter: { letter: "-t" }
            rule: { es: ["los extranjerismos adaptados pierden la ", { letter: t }, " final"] }
            ex: { examples: [{ target: carné }, { target: yogur }, { target: tique }] }
          - level: B2
            letter: { letter: "e-" }
            rule: { es: ["se añade delante de ", { letter: s }, " más consonante en palabras de origen latino o extranjero"] }
            ex: { examples: [[{ target: { letter: e } }, "spectáculo"], [{ target: { letter: e } }, "stadio"], [{ target: { letter: e } }, "statua"], [{ target: { letter: e } }, "stándar"]] }
          - level: C1
            letter: { alternatives: [{ letter: ns }, { letter: s }] }
            rule: { es: ["se admite simplificar ", { term: "trans-" }, " en ", { term: "tras-" }, "; se prefiere ", { term: "trans-" }] }
            ex: { examples: [["tra", { target: { letter: ns } }, "ferencia"], ["tra", { target: { letter: s } }, "ferencia"]] }
          - level: C1
            letter: { alternatives: [{ letter: ps }, { letter: s }] }
            rule: { es: ["se admite simplificar ", { letter: ps }, " inicial en ", { letter: s }, "; se prefiere ", { letter: ps }] }
            ex: { examples: [[{ target: { letter: ps } }, "iquiatra"], [{ target: { letter: s } }, "iquiatra"]] }
          - level: C1
            letter: { alternatives: [{ letter: pt }, { letter: t }] }
            rule: { es: ["se admite simplificar ", { letter: pt }, " en ", { letter: t }, "; se prefiere ", { letter: pt }] }
            ex: { examples: [["se", { target: { letter: pt } }, "iembre"], ["se", { target: { letter: t } }, "iembre"], ["sé", { target: { letter: pt } }, "imo"], ["sé", { target: { letter: t } }, "imo"]] }
          - level: C1
            letter: { alternatives: [{ letter: ee }, { letter: e }] }
            rule: { es: "se admite contraer dos vocales iguales seguidas en una; se prefiere la forma con dos" }
            ex: { examples: [["r", { target: { letter: ee } }, "mplazar"], ["r", { target: { letter: e } }, "mplazar"]] }
          - level: C1
            letter: { es: Nombres de lugar }
            rule: { es: "conservan su ortografía propia" }
            ex: { examples: [{ target: Lleida }, { target: Ourense }, { target: Getxo }, { target: Oaxaca }] }
          - level: C2
            variety: es-419
            letter: { alternatives: [{ letter: "hua-, hue-" }, { letter: "gua-, güe-" }] }
            rule: { es: "algunas voces americanas se escriben de las dos maneras, según cómo se pronuncien" }
            ex: { examples: [[{ target: { letter: hua } }, "ca"], [{ target: { letter: gua } }, "ca"], [{ target: { letter: hua } }, "cal"], [{ target: { letter: gua } }, "cal"]] }

  - title: { es: Mayúsculas y minúsculas }
    role: own
    content:
      - type: usage
        columns:
          - { key: case, label: { es: Caso } }
          - { key: rule, label: { es: Regla } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            case: { es: Realidades únicas }
            rule: { es: "mayúscula si el nombre designa la realidad única; minúscula en sentido común" }
            ex: { examples: [["La ", { target: { letter: T } }, "ierra gira alrededor del ", { target: { letter: S } }, "ol."], ["Hace ", { target: { letter: s } }, "ol en la ", { target: { letter: t } }, "ierra de mis abuelos."]] }
          - level: B2
            case: { es: Papa }
            rule: { es: "mayúscula si va solo; minúscula si lo sigue el nombre propio" }
            ex: { examples: [["El ", { target: { letter: P } }, "apa visitó la ciudad."], ["El ", { target: { letter: p } }, "apa Juan Pablo II visitó la ciudad."]] }
          - level: B2
            case: { es: Instituciones }
            rule: { es: "mayúscula en el nombre de una institución concreta" }
            ex: { examples: [["El ", { target: { letter: E } }, "stado paga los hospitales."], ["La ", { target: { letter: U } }, "niversidad abre en marzo."]] }
          - level: B2
            case: { es: "Congresos, reuniones y tratados" }
            rule: { es: "mayúscula en las palabras principales del nombre" }
            ex: ["Se firmó el ", { target: "Tratado de la Unión Europea" }, " en 1992."]
          - level: B2
            case: { es: Conceptos absolutos }
            rule: { es: "mayúscula si el concepto se presenta como un absoluto" }
            ex: ["Luchó siempre por la ", { target: { letter: L } }, "ibertad."]
          - level: B2
            case: { es: Apellidos con preposición o artículo }
            rule: { es: "mayúscula en la preposición o el artículo si el apellido encabeza el nombre" }
            ex: { examples: [[{ target: "La Cruz" }, ", Pedro"], [{ target: "De Cervantes" }, ", Miguel"], [{ target: "De la Rosa" }, ", Enrique"]] }
          - level: B2
            case: { es: Después de dos puntos }
            rule: { es: "mayúscula si empieza una cita textual de una obra" }
            ex: ["Cervantes escribió: «", { target: { letter: E } }, "n un lugar de la Mancha, de cuyo nombre no quiero acordarme»."]
          - level: B2
            case: { es: Nombre propio que pasa a común }
            rule: { es: "minúscula si el nombre propio designa un tipo de producto" }
            ex: ["Pedimos un ", { target: { letter: r } }, "ioja de La Rioja."]
          - level: C1
            case: { es: Dinastías }
            rule: { es: "mayúscula en el nombre de una dinastía formado con un apellido" }
            ex: { examples: [["Los ", { target: { letter: B } }, "orbones llegaron al trono en 1700."], ["Los ", { target: { letter: E } }, "scipiones fueron una familia romana."]] }
          - level: C1
            case: { es: Puntos suspensivos }
            rule: { es: "mayúscula si cierran el enunciado; minúscula si la frase continúa" }
            ex: { examples: [["¿Sabes si viene María? Hombre... ", { target: { letter: S } }, "upongo que sí."], ["Creo que... ", { target: { letter: v } }, "oy a hacerte caso."]] }
          - level: C1
            case: { es: Portadas y divisiones de un texto }
            rule: { es: "todo en mayúsculas en los títulos de portada y en las divisiones internas" }
            ex: { target: "I. INTRODUCCIÓN" }
          - level: C2
            case: { es: "Epítetos, apodos y seudónimos" }
            rule: { es: "mayúscula si acompañan o sustituyen al nombre" }
            ex: { examples: [["Alfonso X el ", { target: Sabio }], ["Daniel el ", { target: Mochuelo }], { target: Azorín }] }
          - level: C2
            case: { es: Personas concretas }
            rule: { es: "mayúscula en los nombres que designan a una persona concreta" }
            ex: { examples: [["El ", { target: Libertador }, " nació en Caracas."], ["Para los cubanos, el ", { target: Apóstol }, " es José Martí."]] }
          - level: C2
            case: { es: Tratamientos }
            rule: { es: "mayúscula en las fórmulas de tratamiento escritas completas" }
            ex: { examples: [[{ target: "Su Majestad" }, " inaugurará la feria."], ["Agradecemos a ", { target: "Su Excelencia" }, " su visita."]] }
          - level: C2
            case: { es: Ámbito religioso }
            rule: { es: "mayúscula en dioses, figuras y lugares sagrados y órdenes religiosas" }
            ex: { examples: [["Los egipcios adoraban a ", { target: Amón }, "."], ["Los fieles esperan al ", { target: Mesías }, "."], ["Soñaba con el ", { target: Paraíso }, "."], ["Los monjes de la ", { target: "Orden de San Benito" }, " rezan juntos."]] }
          - level: C2
            case: { es: Usos expresivos }
            rule: { es: "mayúscula en eslóganes y lemas publicitarios" }
            ex: { target: "Más Igualdad y Trabajo para Todos" }
          - level: C2
            case: { es: Verbos realizativos de textos jurídicos }
            rule: { es: "van en mayúsculas, con dos puntos, y la palabra siguiente con inicial mayúscula" }
            ex: { examples: [[{ target: "EXPONE:" }, " Que no ha recibido el pago."], [{ target: "SUPLICA:" }, " Que se atienda esta solicitud."], [{ target: "FALLAMOS:" }, " Que debemos absolver al acusado."]] }
          - level: C2
            case: { es: Nombres de lugar coloquiales }
            rule: { es: "minúscula" }
            ex: ["Nos vemos en los ", { target: madriles }, "."]

  - title: { es: Tipos de letra }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "La cursiva marca los nombres de publicaciones periódicas:"
            ex: ["Leo ", { target: Fotogramas }, " cada mes."]
          - type: rule
            level: B2
            text:
              es: "La cursiva marca los títulos de obras:"
            ex: ["Leí ", { target: "Cien años de soledad" }, " en verano."]
          - type: rule
            level: B2
            text:
              es: "La cursiva marca los extranjerismos no adaptados:"
            ex: ["Instalé un ", { target: software }, " nuevo."]
          - type: rule
            level: C1
            text:
              es: "La cursiva o la negrita destacan una palabra del enunciado:"
            ex: ["Te dije que compraras ", { target: cuatro }, " latas y has traído solo tres."]
          - type: rule
            level: C1
            text:
              es: "La negrita se reserva para los títulos y los encabezados de un texto."
          - type: rule
            level: C1
            text:
              es: "Las letras voladas remiten a una nota:"
            ex: ["La cifra aparece en el cuadro", { target: "ᵃ" }, "."]
          - type: rule
            level: C1
            text:
              es: "Las notas musicales van en minúscula y en letra redonda:"
            ex: ["La escala empieza por ", { target: do }, ", ", { target: re }, " y ", { target: mi }, "."]
          - type: rule
            level: C2
            text:
              es: "La cursiva marca el apodo añadido a un nombre, salvo en reyes y papas:"
            ex: { examples: [["Leopoldo Alas ", { target: Clarín }], "Alfonso X el Sabio"] }
          - type: rule
            level: C2
            text:
              es: "La cursiva marca la palabra sic y las locuciones latinas:"
            ex: { examples: [{ target: sic }, { target: "alma máter" }, { target: "vox populi" }, { target: "currículum vítae" }] }
          - type: rule
            level: C2
            text:
              es: "Las versalitas marcan el nombre de cada personaje en una obra de teatro:"
            ex: [{ target: "ELVIRA." }, " Hoy no puedo salir."]
          - type: rule
            level: C2
            text:
              es: "Las letras voladas aparecen en las abreviaturas:"
            ex: ["V.", { target: "º" }, " B.", { target: "º" }]

  - title: { es: Palabras de doble escritura }
    role: own
    content:
      - type: comparison
        columns:
          - { key: pair, label: { es: Pareja } }
          - { key: where, label: { es: Dónde va cada una } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            pair: { alternatives: [{ term: adonde }, { term: adónde }] }
            where: { es: [{ term: adonde }, " es relativo; ", { term: adónde }, " pregunta o exclama y lleva tilde"] }
            ex: { examples: [["Tú no puedes entrar al sitio ", { target: adonde }, " voy."], ["¿", { target: Adónde }, " vas?"]] }
          - level: B2
            pair: { alternatives: [{ term: sino }, { term: "si no" }] }
            where: { es: [{ term: sino }, " contrapone; ", { term: "si no" }, " pone una condición negativa"] }
            ex: { examples: [["No es antipático, ", { target: sino }, " tímido."], [{ target: "Si no" }, " estudias, nunca aprobarás."]] }
          - level: C1
            pair: { alternatives: [{ term: porque }, { term: porqué }] }
            where: { es: [{ term: porque }, " da la causa; ", { term: porqué }, " es un sustantivo y significa ‘la causa’"] }
            ex: { examples: [["Estudio ", { target: porque }, " quiero."], ["Quiero saber el ", { target: porqué }, " de tu retraso."]] }
          - level: C1
            pair: { alternatives: [{ term: "por qué" }, { term: "por que" }] }
            where: { es: [{ term: "por qué" }, " pregunta y lleva tilde; ", { term: "por que" }, " une la preposición ", { term: por }, " y la conjunción ", { term: que }] }
