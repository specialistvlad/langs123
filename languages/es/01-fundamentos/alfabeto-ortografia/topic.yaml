title: { en: The Alphabet and Spelling, es: El alfabeto y la ortografía, uk: "Алфавіт і правопис", pt: "O alfabeto e a ortografia", fr: "L’alphabet et l’orthographe", de: "Das Alphabet und die Rechtschreibung", it: "L'alfabeto e l'ortografia", pl: "Alfabet i pisownia", tr: "Alfabe ve yazım", id: "Alfabet dan ejaan", vi: "Bảng chữ cái và chính tả" }
summary:
  lead:
    en: "The 27 letters of the Spanish alphabet with their names and sounds, and the spelling rules that tie each sound to its letters."
    es: "Las 27 letras del alfabeto español con sus nombres y sus sonidos, y las reglas que unen cada sonido con sus letras."
    uk: "Усі 27 літер іспанського алфавіту з їхніми назвами та звуками, а також правила, що пов’язують кожен звук із його літерами."
    pt: "As 27 letras do alfabeto espanhol, com seus nomes e sons, e as regras de ortografia que ligam cada som às suas letras."
    fr: "Les 27 lettres de l’alphabet espagnol avec leurs noms et leurs sons, et les règles d’orthographe qui relient chaque son à ses lettres."
    de: "Die 27 Buchstaben des spanischen Alphabets mit ihren Namen und Lauten sowie die Rechtschreibregeln, die jeden Laut mit seinen Buchstaben verbinden."
    it: "Le 27 lettere dell'alfabeto spagnolo con i loro nomi e suoni, e le regole ortografiche che collegano ogni suono alle sue lettere."
    pl: "Alfabet hiszpański: 27 liter z ich nazwami i dźwiękami oraz zasady pisowni, które łączą każdy dźwięk z jego literami."
    tr: "İspanyol alfabesinin 27 harfi, adları ve sesleriyle birlikte; ayrıca her sesi harflerine bağlayan yazım kuralları."
    id: "Alfabet Spanyol: 27 huruf beserta nama dan bunyinya, serta aturan ejaan yang menghubungkan setiap bunyi dengan hurufnya."
    vi: "Bảng chữ cái tiếng Tây Ban Nha: 27 chữ cái cùng tên và âm của chúng, và các quy tắc chính tả nối mỗi âm với những chữ cái biểu thị nó."
  rule:
    en: ["The letter ", { letter: h }, " is written but never pronounced:"]
    es: ["La letra ", { letter: h }, " se escribe, pero nunca se pronuncia:"]
    uk: ["Літеру ", { letter: "h" }, " пишуть, але ніколи не вимовляють:"]
    pt: ["A letra ", { letter: h }, " é escrita, mas nunca é pronunciada:"]
    fr: ["La lettre ", { letter: h }, " s’écrit, mais ne se prononce jamais :"]
    de: ["Der Buchstabe ", { letter: h }, " wird geschrieben, aber nie gesprochen:"]
    it: ["La lettera ", { letter: h }, " si scrive, ma non si pronuncia mai:"]
    pl: ["Litera ", { letter: h }, " jest pisana, ale nigdy nie jest wymawiana:"]
    tr: ["İspanyolcada ", { letter: h }, " harfi yazılır, ama hiçbir zaman okunmaz:"]
    id: ["Huruf ", { letter: h }, " ditulis, tetapi tidak pernah dilafalkan:"]
    vi: ["Chữ ", { letter: h }, " được viết ra nhưng không bao giờ được phát âm:"]
  ex: { examples: [[{ target: { letter: h } }, "ola"], [{ target: { letter: h } }, "ora"]] }

