sections:
  - title: { en: The alphabet, es: El alfabeto, uk: "Алфавіт", pt: "O alfabeto", fr: "L’alphabet", de: "Das Alphabet", it: "L'alfabeto", pl: "Alfabet", tr: "Alfabe", id: "Alfabet", vi: "Bảng chữ cái" }
    role: own
    content:
      - type: prose
        level: A0
        text:
          en: ["27 letters. Vowels: ", { letter: "a, e, i, o, u" }, ". The other 22 are consonants, ", { letter: ñ }, " among them."]
          es: ["27 letras. Vocales: ", { letter: "a, e, i, o, u" }, ". Las otras 22 son consonantes, entre ellas la ", { letter: ñ }, "."]
          uk: ["27 літер. Голосні: ", { letter: "a, e, i, o, u" }, ". Решта 22 — приголосні, серед них ", { letter: "ñ" }, "."]
          pt: ["27 letras. Vogais: ", { letter: "a, e, i, o, u" }, ". As outras 22 são consoantes, entre elas a letra ", { letter: ñ }, "."]
          fr: ["27 lettres. Voyelles : ", { letter: "a, e, i, o, u" }, ". Les 22 autres sont des consonnes, dont ", { letter: ñ }, "."]
          de: ["27 Buchstaben. Vokale: ", { letter: "a, e, i, o, u" }, ". Die anderen 22 sind Konsonanten, darunter ", { letter: ñ }, "."]
          it: ["27 lettere. Vocali: ", { letter: "a, e, i, o, u" }, ". Le altre 22 sono consonanti, tra cui la ", { letter: ñ }, "."]
          pl: ["27 liter. Samogłoski: ", { letter: "a, e, i, o, u" }, ". Pozostałe 22 to spółgłoski, wśród nich ", { letter: ñ }, "."]
          tr: ["27 harf. Ünlüler: ", { letter: "a, e, i, o, u" }, ". Diğer 22 harf ünsüzdür; ", { letter: ñ }, " de bunların arasındadır."]
          id: ["27 huruf. Vokal: ", { letter: "a, e, i, o, u" }, ". Dua puluh dua huruf lainnya adalah konsonan, termasuk ", { letter: ñ }, "."]
          vi: ["27 chữ cái. Nguyên âm: ", { letter: "a, e, i, o, u" }, ". 22 chữ còn lại là phụ âm, trong đó có ", { letter: ñ }, "."]
      - type: inventory
        set: letters
        columns:
          - { key: letter, label: { en: Letter, es: Letra, uk: "Літера", pt: "Letra", fr: "Lettre", de: "Buchstabe", it: "Lettera", pl: "Litera", tr: "Harf", id: "Huruf", vi: "Chữ cái" } }
          - { key: name, label: { en: Name, es: Nombre, uk: "Назва", pt: "Nome", fr: "Nom", de: "Name", it: "Nome", pl: "Nazwa", tr: "Ad", id: "Nama", vi: "Tên" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, value: a, letter: A a, name: a, sound: { ipa: a }, ex: { ex: [{ letter: a }, migo], tr: { en: friend, uk: "друг", pt: "amigo", fr: "ami", de: "Freund", it: "amico", pl: "przyjaciel", tr: "arkadaş", id: "teman", vi: "bạn bè" } } }
          - { level: A0, value: b, letter: B b, name: be, sound: { ipa: b }, ex: { ex: [{ letter: b }, oca], tr: { en: mouth, uk: "рот", pt: "boca", fr: "bouche", de: "Mund", it: "bocca", pl: "usta", tr: "ağız", id: "mulut", vi: "miệng" } } }
          - level: A0
            value: c
            letter: C c
            name: ce
            sound: { alternatives: [{ ipa: k }, [{ variant: { ipa: s }, variety: es-419 }, " ", { variant: { ipa: θ }, variety: es-ES }]] }
            ex: { ex: { examples: [[{ letter: c }, asa], [{ letter: c }, ine]] }, tr: { en: { examples: [house, cinema] }, uk: { examples: ["дім", "кінотеатр"] }, pt: { examples: ["casa", "cinema"] }, fr: { examples: ["maison", "cinéma"] }, de: { examples: ["Haus", "Kino"] }, it: { examples: ["casa", "cinema"] }, pl: { examples: ["dom", "kino"] }, tr: { examples: ["ev", "sinema"] }, id: { examples: ["rumah", "bioskop"] }, vi: { examples: ["nhà", "rạp chiếu phim"] } } }
          - { level: A0, value: d, letter: D d, name: de, sound: { ipa: d }, ex: { ex: [{ letter: d }, edo], tr: { en: finger, uk: "палець", pt: "dedo", fr: "doigt", de: "Finger", it: "dito", pl: "palec", tr: "parmak", id: "jari", vi: "ngón tay" } } }
          - { level: A0, value: e, letter: E e, name: e, sound: { ipa: e }, ex: { ex: [{ letter: e }, scuela], tr: { en: school, uk: "школа", pt: "escola", fr: "école", de: "Schule", it: "scuola", pl: "szkoła", tr: "okul", id: "sekolah", vi: "trường học" } } }
          - { level: A0, value: f, letter: F f, name: efe, sound: { ipa: f }, ex: { ex: [{ letter: f }, uego], tr: { en: fire, uk: "вогонь", pt: "fogo", fr: "feu", de: "Feuer", it: "fuoco", pl: "ogień", tr: "ateş", id: "api", vi: "lửa" } } }
          - level: A0
