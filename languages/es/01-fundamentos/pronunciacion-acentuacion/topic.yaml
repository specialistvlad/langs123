          tr: { en: { examples: [coffee, tree, music] }, uk: { examples: ["кава", "дерево", "музика"] }, pt: { examples: ["café", "árvore", "música"] }, fr: { examples: ["café", "arbre", "musique"] }, de: { examples: ["Kaffee", "Baum", "Musik"] }, it: { examples: ["caffè", "albero", "musica"] }, pl: { examples: ["kawa", "drzewo", "muzyka"] }, tr: { examples: ["kahve", "ağaç", "müzik"] }, id: { examples: ["kopi", "pohon", "musik"] }, vi: { examples: ["cà phê", "cái cây", "âm nhạc"] } }
        - level: A1
          point: { en: Words written alike, es: Palabras iguales, uk: "Слова, що різняться лише знаком наголосу", pt: "Palavras iguais", fr: "Mots identiques", de: "Gleich geschriebene Wörter", it: "Parole uguali", pl: "Takie same wyrazy", tr: "Aynı yazılan sözcükler", id: "Kata yang ditulis sama", vi: "Từ viết giống nhau" }
          rule:
            en: "an accent tells apart two words that are written the same"
            es: "la tilde distingue dos palabras que se escriben igual"
            uk: "знак наголосу розрізняє два слова, що пишуться однаково"
            pt: "o acento gráfico distingue duas palavras que se escrevem igual"
            fr: "l’accent écrit distingue deux mots qui s’écrivent de la même façon"
            de: "das Akzentzeichen unterscheidet zwei Wörter, die gleich geschrieben werden"
            it: "l'accento scritto distingue due parole che si scrivono allo stesso modo"
            pl: "akcent graficzny odróżnia dwa wyrazy zapisywane tak samo"
            tr: "vurgu işareti, aynı yazılan iki sözcüğü ayırır"
            id: "tanda aksen membedakan dua kata yang ditulis sama"
            vi: "dấu sắc phân biệt hai từ viết giống nhau"
          ex: [{ target: Tú }, " tienes ", { target: tu }, " libro."]
          tr: { en: You have your book., uk: "У тебе твоя книжка.", pt: "Você tem o seu livro.", fr: "Tu as ton livre.", de: "Du hast dein Buch.", it: "Tu hai il tuo libro.", pl: "Ty masz swoją książkę.", tr: "Kitabın sende.", id: "Kamu punya bukumu.", vi: "Bạn có quyển sách của bạn." }
        - level: A2
          point: { en: Words written alike, es: Palabras iguales, uk: "Слова, що різняться лише знаком наголосу", pt: "Palavras iguais", fr: "Mots identiques", de: "Gleich geschriebene Wörter", it: "Parole uguali", pl: "Takie same wyrazy", tr: "Aynı yazılan sözcükler", id: "Kata yang ditulis sama", vi: "Từ viết giống nhau" }
          rule:
            en: [{ term: sí }, " and ", { term: si }, ", ", { term: mí }, " and ", { term: mi }, " follow the same rule"]
            es: [{ term: sí }, " y ", { term: si }, ", ", { term: mí }, " y ", { term: mi }, " siguen la misma regla"]
            uk: [{ term: "sí" }, " і ", { term: "si" }, ", ", { term: "mí" }, " і ", { term: "mi" }, " підлягають тому самому правилу"]
            pt: [{ term: "sí" }, " e ", { term: "si" }, ", ", { term: "mí" }, " e ", { term: "mi" }, " seguem a mesma regra"]
            fr: [{ term: "sí" }, " et ", { term: "si" }, ", ", { term: "mí" }, " et ", { term: "mi" }, " suivent la même règle"]
            de: [{ term: "sí" }, " und ", { term: "si" }, ", ", { term: "mí" }, " und ", { term: "mi" }, " folgen derselben Regel"]
            it: [{ term: "sí" }, " e ", { term: "si" }, ", ", { term: "mí" }, " e ", { term: "mi" }, " seguono la stessa regola"]
            pl: [{ term: "sí" }, " i ", { term: "si" }, ", ", { term: "mí" }, " i ", { term: "mi" }, " podlegają tej samej regule"]
            tr: [{ term: "sí" }, " ile ", { term: "si" }, ", ", { term: "mí" }, " ile ", { term: "mi" }, " aynı kurala uyar"]
            id: [{ term: "sí" }, " dan ", { term: "si" }, ", ", { term: "mí" }, " dan ", { term: "mi" }, " mengikuti aturan yang sama"]
            vi: [{ term: "sí" }, " và ", { term: "si" }, ", ", { term: "mí" }, " và ", { term: "mi" }, " theo cùng quy tắc"]
          ex: [{ target: Sí }, ", es para ", { target: mí }, "."]
          tr: { en: "Yes, it's for me.", uk: "Так, це для мене.", pt: "Sim, é para mim.", fr: "Oui, c’est pour moi.", de: "Ja, es ist für mich.", it: "Sì, è per me.", pl: "Tak, to dla mnie.", tr: "Evet, benim için.", id: "Ya, itu untuk saya.", vi: "Vâng, cái này là cho tôi." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "question words always carry an accent"
            es: "las palabras interrogativas siempre llevan tilde"
            uk: "питальні слова завжди пишуть зі знаком наголосу"
            pt: "as palavras interrogativas sempre levam acento gráfico"
            fr: "les mots interrogatifs portent toujours un accent écrit"
            de: "Fragewörter tragen immer ein Akzentzeichen"
            it: "le parole interrogative portano sempre l'accento scritto"
            pl: "wyrazy pytające zawsze mają akcent graficzny"
            tr: "soru sözcükleri her zaman vurgu işareti taşır"
            id: "kata tanya selalu memakai tanda aksen"
            vi: "từ để hỏi luôn có dấu sắc"
          ex: ["¿", { target: Dónde }, " vives?"]
          tr: { en: Where do you live?, uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove abiti?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Kamu tinggal di mana?", vi: "Bạn sống ở đâu?" }
        - level: B2
          point: { es: La sílaba }
          rule: { es: una consonante entre vocales va con la vocal siguiente }
          ex: { examples: [{ target: me-sa }, { target: pro-bar }, { target: an-dar }] }
        - level: B2
          point: { es: Sinalefa }
          rule: { es: la vocal final y la inicial de la palabra siguiente forman una sílaba }
          ex: { mapping: [todo eso, to-doe-so] }
        - level: B2
          point: { es: Trampa }
          rule: { es: los interrogativos llevan tilde también en el estilo indirecto }
          ex: ["No sé ", { target: cuál }, " me gusta más."]
        - level: C1
          point: { es: Aún y aun }
          rule: { es: "aún es todavía; aun, sin tilde, es incluso" }
          ex: [{ target: Aún }, " no ha llegado."]
        - level: C1
          point: { es: Palabras átonas }
          rule: { es: "don, san, señor, buen y el relativo donde pierden el acento" }
          ex: ["Saludé a ", { target: don }, " Emilio."]
        - level: C2
          point: { es: Más y mas }
          rule: { es: "mas, sin tilde, es pero; más marca cantidad" }
          ex: ["Le dije que sí, ", { target: mas }, " no estaba seguro."]
        - level: C2
          point: { es: Variantes }
          rule: { es: la pronunciación cambia con la región y el registro }
          ex: { mapping: [pan, { ipa: paŋ }] }

sections:
  - title: { en: Vowels, es: Las vocales, uk: "Голосні", pt: "As vogais", fr: "Les voyelles", de: "Die Vokale", it: "Le vocali", pl: "Samogłoski", tr: "Ünlüler", id: "Vokal", vi: "Nguyên âm" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: letter, label: { en: Letter, es: Letra, uk: "Літера", pt: "Letra", fr: "Lettre", de: "Buchstabe", it: "Lettera", pl: "Litera", tr: "Harf", id: "Huruf", vi: "Chữ cái" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, value: a, letter: { letter: a }, sound: { ipa: a }, ex: ["c", { target: { letter: a } }, "s", { target: { letter: a } }], tr: { en: house, uk: "дім", pt: "casa", fr: "maison", de: "Haus", it: "casa", pl: "dom", tr: "ev", id: "rumah", vi: "nhà" } }
          - { level: A0, value: e, letter: { letter: e }, sound: { ipa: e }, ex: ["m", { target: { letter: e } }, "sa"], tr: { en: table, uk: "стіл", pt: "mesa", fr: "table", de: "Tisch", it: "tavolo", pl: "stół", tr: "masa", id: "meja", vi: "cái bàn" } }
          - { level: A0, value: i, letter: { letter: i }, sound: { ipa: i }, ex: ["l", { target: { letter: i } }, "bro"], tr: { en: book, uk: "книжка", pt: "livro", fr: "livre", de: "Buch", it: "libro", pl: "książka", tr: "kitap", id: "buku", vi: "quyển sách" } }
          - { level: A0, value: o, letter: { letter: o }, sound: { ipa: o }, ex: ["t", { target: { letter: o } }, "d", { target: { letter: o } }], tr: { en: everything, uk: "усе", pt: "tudo", fr: "tout", de: "alles", it: "tutto", pl: "wszystko", tr: "her şey", id: "semuanya", vi: "tất cả" } }
          - { level: A0, value: u, letter: { letter: u }, sound: { ipa: u }, ex: [{ target: { letter: u } }, "no"], tr: { en: one, uk: "один", pt: "um", fr: "un", de: "eins", it: "uno", pl: "jeden", tr: "bir", id: "satu", vi: "một" } }
      - type: list
        items:
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: ["Ненаголошені ", { letter: "e" }, " та ", { letter: "i" }, " звучать чітко й не змішуються, як українські е та и в ненаголошених складах: ", { term: mesita }, ", ", { term: cenar }, "."]
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: ["Приголосні перед ", { letter: "i" }, " не пом’якшуються: ", { term: ti }, ", ", { term: día }, " звучать твердіше, ніж українські «ті», «ді»."]
          - type: rule
            level: A0
            text:
              en: "Each vowel keeps its one short, clear sound, stressed or not:"
              es: "Cada vocal mantiene su sonido breve y claro, con acento o sin él:"
              uk: "Кожна голосна зберігає свій короткий чіткий звук — під наголосом і без нього:"
              pt: "Cada vogal mantém seu som curto e claro, tônica ou átona:"
              fr: "Chaque voyelle garde un seul son, bref et net, accentuée ou non :"
              de: "Jeder Vokal behält seinen kurzen, klaren Laut, betont oder unbetont:"
              it: "Ogni vocale mantiene il suo suono breve e chiaro, con accento o senza:"
              pl: "Każda samogłoska zachowuje swój krótki, wyraźny dźwięk, w sylabie akcentowanej i nieakcentowanej:"
              tr: "Her ünlü, vurgulu ya da vurgusuz, kısa ve net sesini korur:"
              id: "Setiap vokal mempertahankan bunyinya yang pendek dan jelas, baik bertekanan maupun tidak:"
              vi: "Mỗi nguyên âm giữ âm ngắn, rõ của mình, dù có trọng âm hay không:"
            ex: ["b", { target: { letter: a } }, "n", { target: { letter: a } }, "n", { target: { letter: a } }]
            tr: { en: banana, uk: "банан", pt: "banana", fr: "banane", de: "Banane", it: "banana", pl: "banan", tr: "muz", id: "pisang", vi: "chuối" }
          - type: rule
            level: A0
            text:
              en: "Two vowels side by side are both pronounced:"
              es: "Dos vocales seguidas se pronuncian las dos:"
              uk: "Дві голосні поспіль вимовляються обидві:"
              pt: "Duas vogais seguidas são pronunciadas as duas:"
              fr: "Deux voyelles qui se suivent se prononcent toutes les deux :"
              de: "Zwei Vokale hintereinander werden beide ausgesprochen:"
              it: "Due vocali di seguito si pronunciano entrambe:"
              pl: "Dwie samogłoski obok siebie wymawia się obie:"
              tr: "Yan yana gelen iki ünlünün ikisi de okunur:"
              id: "Dua vokal yang berurutan keduanya diucapkan:"
              vi: "Hai nguyên âm đứng cạnh nhau đều được phát âm:"
            ex: { examples: [[{ target: { letter: ae } }, "ropuerto"], ["l", { target: { letter: ee } }, "r"]] }
            tr: { en: { examples: [airport, to read] }, uk: { examples: ["аеропорт", "читати"] }, pt: { examples: ["aeroporto", "ler"] }, fr: { examples: ["aéroport", "lire"] }, de: { examples: ["Flughafen", "lesen"] }, it: { examples: ["aeroporto", "leggere"] }, pl: { examples: ["lotnisko", "czytać"] }, tr: { examples: ["havalimanı", "okumak"] }, id: { examples: ["bandara", "membaca"] }, vi: { examples: ["sân bay", "đọc"] } }

  - title: { en: Consonants, es: Las consonantes, uk: "Приголосні", pt: "As consoantes", fr: "Les consonnes", de: "Die Konsonanten", it: "Le consonanti", pl: "Spółgłoski", tr: "Ünsüzler", id: "Konsonan", vi: "Phụ âm" }
    role: own
    content:
      - type: usage
        columns:
          - { key: letters, label: { en: Letters, es: Letras, uk: "Літери", pt: "Letras", fr: "Lettres", de: "Buchstaben", it: "Lettere", pl: "Litery", tr: "Harfler", id: "Huruf", vi: "Chữ cái" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: A0
            letters: { alternatives: [{ letter: b }, { letter: v }] }
            sound: { ipa: b }
            ex: { examples: [[{ target: { letter: b } }, "oca"], [{ target: { letter: v } }, "aca"]] }
            tr: { en: { examples: [mouth, cow] }, uk: { examples: ["рот", "корова"] }, pt: { examples: ["boca", "vaca"] }, fr: { examples: ["bouche", "vache"] }, de: { examples: ["Mund", "Kuh"] }, it: { examples: ["bocca", "mucca"] }, pl: { examples: ["usta", "krowa"] }, tr: { examples: ["ağız", "inek"] }, id: { examples: ["mulut", "sapi"] }, vi: { examples: ["miệng", "con bò"] } }
          - level: A0
            letters: { letter: d }
            sound: { en: [{ ipa: ð }, " between vowels, like th in English this"], es: [{ ipa: ð }, " entre vocales, un sonido suave"], uk: [{ ipa: "ð" }, " між голосними, як th в англійському this"], pt: [{ ipa: "ð" }, " entre vogais, um som suave"], fr: [{ ipa: "ð" }, " entre voyelles, un son doux"], de: [{ ipa: "ð" }, " zwischen Vokalen, ein weicher Laut"], it: [{ ipa: "ð" }, " tra vocali, un suono morbido"], pl: [{ ipa: "ð" }, " między samogłoskami, łagodny dźwięk"], tr: [{ ipa: "ð" }, " ünlüler arasında, yumuşak bir ses"], id: [{ ipa: "ð" }, " di antara vokal, bunyi yang lembut"], vi: [{ ipa: "ð" }, " giữa các nguyên âm, một âm nhẹ"] }
            ex: ["to", { target: { letter: d } }, "o"]
            tr: { en: everything, uk: "усе", pt: "tudo", fr: "tout", de: "alles", it: "tutto", pl: "wszystko", tr: "her şey", id: "semuanya", vi: "tất cả" }
          - level: A0
            letters: { letter: h }
            sound: { en: no sound, es: sin sonido, uk: "не звучить", pt: "não se pronuncia", fr: "ne se prononce pas", de: "wird nicht gesprochen", it: "non si pronuncia", pl: "nie wymawia się", tr: "okunmaz", id: "tidak dibunyikan", vi: "không phát âm" }
            ex: [{ target: { letter: h } }, "ola"]
            tr: { en: hello, uk: "привіт", pt: "olá", fr: "bonjour", de: "hallo", it: "ciao", pl: "cześć", tr: "merhaba", id: "halo", vi: "xin chào" }
          - level: A0
            letters: { alternatives: [{ letter: j }, { letter: ge }, { letter: gi }] }
            sound: { ipa: x }
            ex: { examples: [[{ target: { letter: j } }, "ardín"], [{ target: { letter: ge } }, "nte"]] }
            tr: { en: { examples: [garden, people] }, uk: { examples: ["сад", "люди"] }, pt: { examples: ["jardim", "pessoas"] }, fr: { examples: ["jardin", "gens"] }, de: { examples: ["Garten", "Leute"] }, it: { examples: ["giardino", "gente"] }, pl: { examples: ["ogród", "ludzie"] }, tr: { examples: ["bahçe", "insanlar"] }, id: { examples: ["taman", "orang-orang"] }, vi: { examples: ["vườn", "mọi người"] } }
          - level: A0
            letters: { alternatives: [{ letter: ll }, { letter: "y" }] }
            sound: { ipa: ʝ }
            ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
            tr: { en: { examples: [street, I] }, uk: { examples: ["вулиця", "я"] }, pt: { examples: ["rua", "eu"] }, fr: { examples: ["rue", "je"] }, de: { examples: ["Straße", "ich"] }, it: { examples: ["strada", "io"] }, pl: { examples: ["ulica", "ja"] }, tr: { examples: ["sokak", "ben"] }, id: { examples: ["jalan", "saya"] }, vi: { examples: ["đường", "tôi"] } }
          - level: A0
            letters: { letter: ñ }
            sound: { ipa: ɲ }
            ex: ["ma", { target: { letter: ñ } }, "ana"]
            tr: { en: tomorrow, uk: "завтра", pt: "amanhã", fr: "demain", de: "morgen", it: "domani", pl: "jutro", tr: "yarın", id: "besok", vi: "ngày mai" }
          - level: A0
            letters: { letter: r }
            sound: { en: [{ ipa: ɾ }, ", one tap of the tongue"], es: [{ ipa: ɾ }, ", un solo toque de la lengua"], uk: [{ ipa: "ɾ" }, ", один удар язика"], pt: [{ ipa: "ɾ" }, ", uma única batida da língua"], fr: [{ ipa: "ɾ" }, ", un seul battement de la langue"], de: [{ ipa: "ɾ" }, ", ein einziger Zungenschlag"], it: [{ ipa: "ɾ" }, ", un solo battito della lingua"], pl: [{ ipa: "ɾ" }, ", jedno uderzenie języka"], tr: [{ ipa: "ɾ" }, ", dilin tek bir vuruşu"], id: [{ ipa: "ɾ" }, ", satu ketukan lidah"], vi: [{ ipa: "ɾ" }, ", một cái búng lưỡi"] }
            ex: { examples: [["pe", { target: { letter: r } }, "o"], ["ca", { target: { letter: r } }, "o"]] }
            tr: { en: { examples: [but, expensive] }, uk: { examples: ["але", "дорогий"] }, pt: { examples: ["mas", "caro"] }, fr: { examples: ["mais", "cher"] }, de: { examples: ["aber", "teuer"] }, it: { examples: ["ma", "caro"] }, pl: { examples: ["ale", "drogi"] }, tr: { examples: ["ama", "pahalı"] }, id: { examples: ["tetapi", "mahal"] }, vi: { examples: ["nhưng", "đắt"] } }
          - level: A0
            letters: { en: [{ letter: rr }, ", and ", { letter: r }, " at the start of a word"], es: [{ letter: rr }, ", y ", { letter: r }, " al principio de palabra"], uk: [{ letter: "rr" }, ", а також ", { letter: "r" }, " на початку слова"], pt: [{ letter: "rr" }, ", e ", { letter: "r" }, " no início da palavra"], fr: [{ letter: "rr" }, ", et ", { letter: "r" }, " en début de mot"], de: [{ letter: "rr" }, " und ", { letter: "r" }, " am Wortanfang"], it: [{ letter: "rr" }, ", e ", { letter: "r" }, " a inizio di parola"], pl: [{ letter: "rr" }, " oraz ", { letter: "r" }, " na początku wyrazu"], tr: [{ letter: "rr" }, " ve sözcük başındaki ", { letter: "r" }], id: [{ letter: "rr" }, ", dan ", { letter: "r" }, " di awal kata"], vi: [{ letter: "rr" }, ", và ", { letter: "r" }, " ở đầu từ"] }
            sound: { en: [{ ipa: r }, ", a trill"], es: [{ ipa: r }, ", una vibración"], uk: [{ ipa: "r" }, ", розкотистий звук"], pt: [{ ipa: "r" }, ", um som vibrante"], fr: [{ ipa: "r" }, ", un son roulé"], de: [{ ipa: "r" }, ", ein gerolltes R"], it: [{ ipa: "r" }, ", una vibrante"], pl: [{ ipa: "r" }, ", dźwięk drżący"], tr: [{ ipa: "r" }, ", titrek bir ses"], id: [{ ipa: "r" }, ", bunyi getar"], vi: [{ ipa: "r" }, ", âm rung lưỡi"] }
            ex: { examples: [["pe", { target: { letter: rr } }, "o"], [{ target: { letter: r } }, "ojo"]] }
            tr: { en: { examples: [dog, red] }, uk: { examples: ["собака", "червоний"] }, pt: { examples: ["cachorro", "vermelho"] }, fr: { examples: ["chien", "rouge"] }, de: { examples: ["Hund", "rot"] }, it: { examples: ["cane", "rosso"] }, pl: { examples: ["pies", "czerwony"] }, tr: { examples: ["köpek", "kırmızı"] }, id: { examples: ["anjing", "merah"] }, vi: { examples: ["con chó", "màu đỏ"] } }
          - level: A0
            letters: { alternatives: [{ letter: z }, { letter: ce }, { letter: ci }] }
