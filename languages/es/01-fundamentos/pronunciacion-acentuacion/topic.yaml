# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.fundamentos.pronunciacion-acentuacion
lang: es
kind: foundations
tags: [pronunciation, sounds, stress, accent]
concepts: [pronunciation]
related: [es.fundamentos.alfabeto-ortografia, es.oracion.preguntas-negacion]
status: { en: draft, es: draft, uk: draft }
translated: { en: "37e76a b83d46 df1719 1a33f3 daf72a cab120 c16ba7", uk: "37e76a b83d46 df1719 1a33f3 daf72a cab120 c16ba7" }

title: { en: Sounds and Stress, es: Pronunciación y acentuación, uk: "Звуки й наголос" }
summary:
  lead:
    en: "The five vowels and the consonant sounds of Spanish, where the stress falls in a word, and when the word takes a written accent."
    es: "Las cinco vocales y los sonidos consonánticos del español, dónde cae el acento de una palabra y cuándo lleva tilde."
    uk: "П’ять голосних і приголосні звуки іспанської мови, місце наголосу в слові та випадки, коли слово пишуть зі знаком наголосу."
  rule:
    en: "Words ending in a vowel, n or s stress the next-to-last syllable, the others the last; a written accent marks any other stress:"
    es: "Las palabras en vocal, n o s llevan el acento en la penúltima sílaba, y las demás en la última; la tilde marca cualquier otro acento:"
    uk: "Слова, що закінчуються на голосну, n або s, мають наголос на передостанньому складі, решта — на останньому; знак наголосу позначає будь-який інший наголос:"
  ex: { examples: [[{ stress: ca }, "sa"], ["ha", { stress: blar }], ["ca", { stress: fé }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: { en: Vowels, es: Vocales, uk: "Голосні" }
          rule:
            en: ["five vowels, ", { letter: "a, e, i, o, u" }, ", each with one short, clear sound"]
            es: ["cinco vocales, ", { letter: "a, e, i, o, u" }, ", cada una con un sonido breve y claro"]
            uk: ["п’ять голосних, ", { letter: "a, e, i, o, u" }, ", кожна з одним коротким чітким звуком"]
          ex: ["b", { target: { letter: a } }, "n", { target: { letter: a } }, "n", { target: { letter: a } }]
          tr: { en: banana, uk: "банан" }
        - level: A0
          point: { alternatives: [{ letter: r }, { letter: rr }] }
          rule:
            en: ["one ", { letter: r }, " between vowels is a single tap; ", { letter: rr }, " is a trill"]
            es: ["una ", { letter: r }, " entre vocales es un toque; la ", { letter: rr }, " es vibrante"]
            uk: ["одна ", { letter: "r" }, " між голосними — один удар язика; ", { letter: "rr" }, " — розкотистий звук"]
          ex: { examples: [["pe", { target: { letter: r } }, "o"], ["pe", { target: { letter: rr } }, "o"]] }
          tr: { en: { examples: [but, dog] }, uk: { examples: ["але", "собака"] } }
        - level: A0
          point: { alternatives: [{ letter: j }, { letter: ge }, { letter: gi }] }
          rule:
            en: "a strong, rough h from the back of the throat"
            es: "un sonido fuerte que sale del fondo de la garganta"
            uk: "сильний хрипкий звук із глибини горла, схожий на х"
          ex: { examples: [[{ target: { letter: j } }, "ardín"], [{ target: { letter: ge } }, "nte"]] }
          tr: { en: { examples: [garden, people] }, uk: { examples: ["сад", "люди"] } }
        - level: A0
          point: { letter: ñ }
          rule:
            en: "like ny in English canyon"
            es: "la lengua toca el paladar, como una n y una i juntas"
            uk: "язик торкається піднебіння, як у слові «нянька»"
          ex: ["ma", { target: { letter: ñ } }, "ana"]
          tr: { en: tomorrow, uk: "завтра" }
        - level: A0
          variety: es-419
          point: { alternatives: [{ letter: z }, { letter: ce }, { letter: ci }] }
          rule:
            en: ["sound ", { ipa: s }, ", like ", { letter: s }]
            es: ["suenan ", { ipa: s }, ", como la ", { letter: s }]
            uk: ["звучать ", { ipa: "s" }, ", як ", { letter: "s" }]
          ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: ci } }, "udad"]] }
          tr: { en: { examples: [shoe, city] }, uk: { examples: ["черевик", "місто"] } }
        - level: A0
          variety: es-ES
          point: { alternatives: [{ letter: z }, { letter: ce }, { letter: ci }] }
          rule:
            en: ["sound ", { ipa: θ }, ", like th in English think"]
            es: ["suenan ", { ipa: θ }, ", con la lengua entre los dientes"]
            uk: ["звучать ", { ipa: "θ" }, ", як th в англійському think"]
          ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: ci } }, "udad"]] }
          tr: { en: { examples: [shoe, city] }, uk: { examples: ["черевик", "місто"] } }
        - level: A0
          point: { alternatives: [{ letter: ll }, { letter: "y" }] }
          rule:
            en: ["one sound, ", { ipa: ʝ }, ", close to y in English yes"]
            es: ["un solo sonido, ", { ipa: ʝ }]
            uk: ["один звук, ", { ipa: "ʝ" }, ", близький до й"]
          ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
          tr: { en: { examples: [street, I] }, uk: { examples: ["вулиця", "я"] } }
        - level: A1
          point: { en: Stress, es: Acento, uk: "Наголос" }
          rule:
            en: ["ending in a vowel, ", { letter: "n" }, " or ", { letter: s }, ": the next-to-last syllable"]
            es: ["terminada en vocal, ", { letter: "n" }, " o ", { letter: s }, ": la penúltima sílaba"]
            uk: ["закінчується на голосну, ", { letter: "n" }, " або ", { letter: "s" }, ": передостанній склад"]
          ex: { examples: [[{ stress: ca }, "sa"], [{ stress: ha }, "blan"]] }
          tr: { en: { examples: [house, they speak] }, uk: { examples: ["дім", "вони розмовляють"] } }
        - level: A1
          point: { en: Stress, es: Acento, uk: "Наголос" }
          rule:
            en: "ending in any other consonant: the last syllable"
            es: "terminada en otra consonante: la última sílaba"
            uk: "закінчується на будь-яку іншу приголосну: останній склад"
          ex: { examples: [["ha", { stress: blar }], ["ciu", { stress: dad }]] }
          tr: { en: { examples: [to speak, city] }, uk: { examples: ["розмовляти", "місто"] } }
        - level: A1
          point: { en: Written accent, es: Tilde, uk: "Знак наголосу" }
          rule:
            en: "marks a stress that breaks those two rules"
            es: "marca el acento que no sigue esas dos reglas"
            uk: "позначає наголос, що порушує ці два правила"
          ex: { examples: [["ca", { stress: fé }], [{ stress: ár }, "bol"], [{ stress: mú }, "sica"]] }
          tr: { en: { examples: [coffee, tree, music] }, uk: { examples: ["кава", "дерево", "музика"] } }
        - level: A1
          point: { en: Words written alike, es: Palabras iguales, uk: "Однакові на письмі слова" }
          rule:
            en: "an accent tells apart two words that are written the same"
            es: "la tilde distingue dos palabras que se escriben igual"
            uk: "знак наголосу розрізняє два слова, що пишуться однаково"
          ex: [{ target: Tú }, " tienes ", { target: tu }, " libro."]
          tr: { en: You have your book., uk: "У тебе твоя книжка." }
        - level: A2
          point: { en: Words written alike, es: Palabras iguales, uk: "Однакові на письмі слова" }
          rule:
            en: [{ term: sí }, " and ", { term: si }, ", ", { term: mí }, " and ", { term: mi }, " follow the same rule"]
            es: [{ term: sí }, " y ", { term: si }, ", ", { term: mí }, " y ", { term: mi }, " siguen la misma regla"]
            uk: [{ term: "sí" }, " і ", { term: "si" }, ", ", { term: "mí" }, " і ", { term: "mi" }, " підлягають тому самому правилу"]
          ex: [{ target: Sí }, ", es para ", { target: mí }, "."]
          tr: { en: "Yes, it's for me.", uk: "Так, це для мене." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "question words always carry an accent"
            es: "las palabras interrogativas siempre llevan tilde"
            uk: "питальні слова завжди пишуть зі знаком наголосу"
          ex: ["¿", { target: Dónde }, " vives?"]
          tr: { en: Where do you live?, uk: "Де ти живеш?" }

sections:
  - title: { en: Vowels, es: Las vocales, uk: "Голосні" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: letter, label: { en: Letter, es: Letra, uk: "Літера" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A0, value: a, letter: { letter: a }, sound: { ipa: a }, ex: ["c", { target: { letter: a } }, "s", { target: { letter: a } }], tr: { en: house, uk: "дім" } }
          - { level: A0, value: e, letter: { letter: e }, sound: { ipa: e }, ex: ["m", { target: { letter: e } }, "sa"], tr: { en: table, uk: "стіл" } }
          - { level: A0, value: i, letter: { letter: i }, sound: { ipa: i }, ex: ["l", { target: { letter: i } }, "bro"], tr: { en: book, uk: "книжка" } }
          - { level: A0, value: o, letter: { letter: o }, sound: { ipa: o }, ex: ["t", { target: { letter: o } }, "d", { target: { letter: o } }], tr: { en: everything, uk: "усе" } }
          - { level: A0, value: u, letter: { letter: u }, sound: { ipa: u }, ex: [{ target: { letter: u } }, "no"], tr: { en: one, uk: "один" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Each vowel keeps its one short, clear sound, stressed or not:"
              es: "Cada vocal mantiene su sonido breve y claro, con acento o sin él:"
              uk: "Кожна голосна зберігає свій короткий чіткий звук — під наголосом і без нього:"
            ex: ["b", { target: { letter: a } }, "n", { target: { letter: a } }, "n", { target: { letter: a } }]
            tr: { en: banana, uk: "банан" }
          - type: rule
            level: A0
            text:
              en: "Two vowels side by side are both pronounced:"
              es: "Dos vocales seguidas se pronuncian las dos:"
              uk: "Дві голосні поспіль вимовляються обидві:"
            ex: { examples: [[{ target: { letter: ae } }, "ropuerto"], ["l", { target: { letter: ee } }, "r"]] }
            tr: { en: { examples: [airport, to read] }, uk: { examples: ["аеропорт", "читати"] } }

  - title: { en: Consonants, es: Las consonantes, uk: "Приголосні" }
    role: own
    content:
      - type: usage
        columns:
          - { key: letters, label: { en: Letters, es: Letras, uk: "Літери" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - level: A0
            letters: { alternatives: [{ letter: b }, { letter: v }] }
            sound: { ipa: b }
            ex: { examples: [[{ target: { letter: b } }, "oca"], [{ target: { letter: v } }, "aca"]] }
            tr: { en: { examples: [mouth, cow] }, uk: { examples: ["рот", "корова"] } }
          - level: A0
            letters: { letter: d }
            sound: { en: [{ ipa: ð }, " between vowels, like th in English this"], es: [{ ipa: ð }, " entre vocales, un sonido suave"], uk: [{ ipa: "ð" }, " між голосними, як th в англійському this"] }
            ex: ["to", { target: { letter: d } }, "o"]
            tr: { en: everything, uk: "усе" }
          - level: A0
            letters: { letter: h }
            sound: { en: no sound, es: sin sonido, uk: "не звучить" }
            ex: [{ target: { letter: h } }, "ola"]
            tr: { en: hello, uk: "привіт" }
          - level: A0
            letters: { alternatives: [{ letter: j }, { letter: ge }, { letter: gi }] }
            sound: { ipa: x }
            ex: { examples: [[{ target: { letter: j } }, "ardín"], [{ target: { letter: ge } }, "nte"]] }
            tr: { en: { examples: [garden, people] }, uk: { examples: ["сад", "люди"] } }
          - level: A0
            letters: { alternatives: [{ letter: ll }, { letter: "y" }] }
            sound: { ipa: ʝ }
            ex: { examples: [["ca", { target: { letter: ll } }, "e"], [{ target: { letter: "y" } }, "o"]] }
            tr: { en: { examples: [street, I] }, uk: { examples: ["вулиця", "я"] } }
          - level: A0
            letters: { letter: ñ }
            sound: { ipa: ɲ }
            ex: ["ma", { target: { letter: ñ } }, "ana"]
            tr: { en: tomorrow, uk: "завтра" }
          - level: A0
            letters: { letter: r }
            sound: { en: [{ ipa: ɾ }, ", one tap of the tongue"], es: [{ ipa: ɾ }, ", un solo toque de la lengua"], uk: [{ ipa: "ɾ" }, ", один удар язика"] }
            ex: { examples: [["pe", { target: { letter: r } }, "o"], ["ca", { target: { letter: r } }, "o"]] }
            tr: { en: { examples: [but, expensive] }, uk: { examples: ["але", "дорогий"] } }
          - level: A0
            letters: { en: [{ letter: rr }, ", and ", { letter: r }, " at the start of a word"], es: [{ letter: rr }, ", y ", { letter: r }, " al principio de palabra"], uk: [{ letter: "rr" }, ", а також ", { letter: "r" }, " на початку слова"] }
            sound: { en: [{ ipa: r }, ", a trill"], es: [{ ipa: r }, ", una vibración"], uk: [{ ipa: "r" }, ", розкотистий звук"] }
            ex: { examples: [["pe", { target: { letter: rr } }, "o"], [{ target: { letter: r } }, "ojo"]] }
            tr: { en: { examples: [dog, red] }, uk: { examples: ["собака", "червоний"] } }
          - level: A0
            letters: { alternatives: [{ letter: z }, { letter: ce }, { letter: ci }] }
            sound: [{ variant: { ipa: s }, variety: es-419 }, " ", { variant: { ipa: θ }, variety: es-ES }]
            ex: { examples: [[{ target: { letter: z } }, "apato"], [{ target: { letter: ci } }, "udad"]] }
            tr: { en: { examples: [shoe, city] }, uk: { examples: ["черевик", "місто"] } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The sounds ", { ipa: p }, ", ", { ipa: t }, " and ", { ipa: k }, " come without a puff of air."]
              es: ["Los sonidos ", { ipa: p }, ", ", { ipa: t }, " y ", { ipa: k }, " se pronuncian sin soplo de aire."]
              uk: ["Звуки ", { ipa: "p" }, ", ", { ipa: "t" }, " і ", { ipa: "k" }, " вимовляються без придиху."]
          - type: note
            level: A0
            variety: es-ES
            text:
              en: ["In most of Spain, ", { letter: z }, " and ", { letter: c }, " before ", { letter: "e, i" }, " sound ", { ipa: θ }, ", like th in English think, so ", { term: casa }, " and ", { term: caza }, " sound different."]
              es: ["En la mayor parte de España, la ", { letter: z }, " y la ", { letter: c }, " delante de ", { letter: "e, i" }, " suenan ", { ipa: θ }, ", así que ", { term: casa }, " y ", { term: caza }, " suenan distinto."]
              uk: ["У більшій частині Іспанії ", { letter: "z" }, " і ", { letter: "c" }, " перед ", { letter: "e, i" }, " звучать ", { ipa: "θ" }, ", як th в англійському think, тож ", { term: "casa" }, " і ", { term: "caza" }, " звучать по-різному."]
          - type: note
            level: A0
            variety: es-419
            text:
              en: ["In Argentina and Uruguay, ", { letter: ll }, " and ", { letter: "y" }, " sound ", { ipa: ʃ }, ", like sh in English she: ", { term: calle }, ", ", { term: yo }, "."]
              es: ["En Argentina y Uruguay, la ", { letter: ll }, " y la ", { letter: "y" }, " suenan ", { ipa: ʃ }, ": ", { term: calle }, ", ", { term: yo }, "."]
              uk: ["В Аргентині та Уругваї ", { letter: "ll" }, " і ", { letter: "y" }, " звучать ", { ipa: "ʃ" }, ", як ш: ", { term: "calle" }, ", ", { term: "yo" }, "."]

  - title: { en: Stress, es: El acento, uk: "Наголос" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every word has one stressed syllable, said a little louder and longer:"
              es: "Cada palabra tiene una sílaba tónica: la que se dice un poco más fuerte y más larga:"
              uk: "У кожному слові є один наголошений склад: його вимовляють трохи гучніше й довше:"
            ex: [{ stress: me }, "sa"]
            tr: { en: table, uk: "стіл" }
          - type: rule
            level: A1
            text:
              en: ["A word that ends in a vowel, ", { letter: "n" }, " or ", { letter: s }, " stresses the next-to-last syllable:"]
              es: ["Una palabra que termina en vocal, ", { letter: "n" }, " o ", { letter: s }, " lleva el acento en la penúltima sílaba:"]
              uk: ["Слово, що закінчується на голосну, ", { letter: "n" }, " або ", { letter: "s" }, ", має наголос на передостанньому складі:"]
            ex: { examples: [[{ stress: ca }, "sa"], [{ stress: ha }, "blan"], [{ stress: lu }, "nes"]] }
            tr: { en: { examples: [house, they speak, Monday] }, uk: { examples: ["дім", "вони розмовляють", "понеділок"] } }
          - type: rule
            level: A1
            text:
              en: "A word that ends in any other consonant stresses the last syllable:"
              es: "Una palabra que termina en otra consonante lleva el acento en la última sílaba:"
              uk: "Слово, що закінчується на будь-яку іншу приголосну, має наголос на останньому складі:"
            ex: { examples: [["ha", { stress: blar }], ["ciu", { stress: dad }], ["re", { stress: loj }]] }
            tr: { en: { examples: [to speak, city, watch] }, uk: { examples: ["розмовляти", "місто", "годинник"] } }
          - type: rule
            level: A1
            text:
              en: [{ letter: i }, " and ", { letter: u }, " join the vowel next to them in one syllable:"]
              es: ["La ", { letter: i }, " y la ", { letter: u }, " se unen a la vocal de al lado en una sola sílaba:"]
              uk: [{ letter: "i" }, " і ", { letter: "u" }, " утворюють один склад із сусідньою голосною:"]
            ex: { examples: [[{ stress: bue }, "no"], ["ciu", { stress: dad }]] }
            tr: { en: { examples: [good, city] }, uk: { examples: ["добрий", "місто"] } }

  - title: { en: The written accent, es: La tilde, uk: "Знак наголосу" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A written accent marks a stress that breaks the two rules above:"
              es: "La tilde marca un acento que no sigue las dos reglas anteriores:"
              uk: "Знак наголосу позначає наголос, який порушує два попередні правила:"
            ex: { examples: [["ca", { stress: fé }], ["ja", { stress: món }], [{ stress: ár }, "bol"]] }
            tr: { en: { examples: [coffee, ham, tree] }, uk: { examples: ["кава", "шинка", "дерево"] } }
          - type: rule
            level: A1
            text:
              en: "A word stressed before the next-to-last syllable always takes a written accent:"
              es: "Una palabra con el acento antes de la penúltima sílaba siempre lleva tilde:"
              uk: "Слово з наголосом перед передостаннім складом завжди пишуть зі знаком наголосу:"
            ex: { examples: [[{ stress: mú }, "sica"], [{ stress: sá }, "bado"]] }
            tr: { en: { examples: [music, Saturday] }, uk: { examples: ["музика", "субота"] } }
          - type: rule
            level: A1
            text:
              en: ["An accent on ", { letter: i }, " or ", { letter: u }, " splits it from the vowel next to it:"]
              es: ["La tilde en la ", { letter: i }, " o en la ", { letter: u }, " la separa de la vocal de al lado:"]
              uk: ["Знак наголосу на ", { letter: "i" }, " або ", { letter: "u" }, " відокремлює її від сусідньої голосної:"]
            ex: { examples: [["d", { stress: í }, "a"], ["pa", { stress: ís }]] }
            tr: { en: { examples: [day, country] }, uk: { examples: ["день", "країна"] } }
          - type: rule
            level: A1
            text:
              en: "Question and exclamation words carry a written accent:"
              es: "Las palabras interrogativas y exclamativas llevan tilde:"
              uk: "Питальні й окличні слова пишуть зі знаком наголосу:"
            ex: { examples: [["¿", { target: Qué }, " quieres?"], ["¿", { target: Cómo }, " estás?"]] }
            tr: { en: { examples: [What do you want?, How are you?] }, uk: { examples: ["Що ти хочеш?", "Як справи?"] } }
      - type: usage
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, word: { target: tú }, meaning: { en: you, es: pronombre sujeto, uk: "ти" }, ex: [{ target: Tú }, " eres mi amigo."], tr: { en: You are my friend., uk: "Ти мій друг." } }
          - { level: A1, word: { target: tu }, meaning: { en: your, es: posesivo, uk: "твій" }, ex: ["Es ", { target: tu }, " libro."], tr: { en: "It's your book.", uk: "Це твоя книжка." } }
          - { level: A1, word: { target: él }, meaning: { en: he, es: pronombre sujeto, uk: "він" }, ex: [{ target: Él }, " es Juan."], tr: { en: He is Juan., uk: "Він — Хуан." } }
          - { level: A1, word: { target: el }, meaning: { en: the, es: artículo, uk: "означений артикль" }, ex: [{ target: El }, " libro es azul."], tr: { en: The book is blue., uk: "Книжка синя." } }
          - { level: A1, word: { target: té }, meaning: { en: tea, es: bebida, uk: "чай" }, ex: ["Un ", { target: té }, ", por favor."], tr: { en: "A tea, please.", uk: "Чай, будь ласка." } }
          - { level: A1, word: { target: te }, meaning: { en: "you, yourself", es: pronombre, uk: "тебе, собі" }, ex: ["¿Cómo ", { target: te }, " llamas?"], tr: { en: "What's your name?", uk: "Як тебе звати?" } }
          - { level: A2, word: { target: sé }, meaning: { en: I know, es: verbo saber, uk: "знаю" }, ex: ["No ", { target: sé }, "."], tr: { en: "I don't know.", uk: "Не знаю." } }
          - { level: A2, word: { target: se }, meaning: { en: "himself, herself, themselves", es: pronombre, uk: "себе, собі" }, ex: ["Ana ", { target: se }, " levanta temprano."], tr: { en: Ana gets up early., uk: "Ана встає рано." } }
          - { level: A2, word: { target: sí }, meaning: { en: "yes", es: afirmación, uk: "так" }, ex: [{ target: Sí }, ", claro."], tr: { en: "Yes, of course.", uk: "Так, звичайно." } }
          - { level: A2, word: { target: si }, meaning: { en: if, es: condición, uk: "якщо" }, ex: [{ target: Si }, " quieres, vamos."], tr: { en: "If you want, let's go.", uk: "Якщо хочеш, ходімо." } }
          - { level: A2, word: { target: mí }, meaning: { en: me, es: pronombre con preposición, uk: "мене (після прийменника)" }, ex: ["Es para ", { target: mí }, "."], tr: { en: "It's for me.", uk: "Це для мене." } }
          - { level: A2, word: { target: mi }, meaning: { en: my, es: posesivo, uk: "мій" }, ex: ["Es ", { target: mi }, " casa."], tr: { en: "It's my house.", uk: "Це мій дім." } }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Tengo un pero., right: ["Tengo un ", { target: perro }, "."], rule: { en: [{ letter: rr }, " is a trill: ", { term: perro }, " is dog, ", { term: pero }, " is but"], es: ["la ", { letter: rr }, " es vibrante: ", { term: perro }, " no es ", { term: pero }], uk: [{ letter: "rr" }, " — розкотистий звук: ", { term: "perro" }, " — це «собака», а ", { term: "pero" }, " — «але»"] } }
          - { level: A1, wrong: "Un cafe, por favor.", right: ["Un ", { target: café }, ", por favor."], rule: { en: "a stressed last syllable ending in a vowel takes an accent", es: "una palabra con el acento en la última sílaba y terminada en vocal lleva tilde", uk: "слово з наголосом на останньому складі, що закінчується на голосну, пишуть зі знаком наголосу" } }
          - { level: A1, wrong: Me gusta la musica., right: ["Me gusta la ", { target: música }, "."], rule: { en: "stress before the next-to-last syllable always takes an accent", es: "una palabra con el acento antes de la penúltima sílaba siempre lleva tilde", uk: "наголос перед передостаннім складом завжди позначають знаком" } }
          - { level: A1, wrong: ¿Donde vives?, right: ["¿", { target: Dónde }, " vives?"], rule: { en: question words take an accent, es: las palabras interrogativas llevan tilde, uk: "питальні слова пишуть зі знаком наголосу" } }
          - { level: A1, wrong: Tu eres mi amigo., right: [{ target: Tú }, " eres mi amigo."], rule: { en: ["the pronoun ", { term: tú }, " takes an accent; ", { term: tu }, " means your"], es: ["el pronombre ", { term: tú }, " lleva tilde; ", { term: tu }, " es posesivo"], uk: ["займенник ", { term: "tú" }, " пишуть зі знаком наголосу; ", { term: "tu" }, " означає «твій»"] } }
