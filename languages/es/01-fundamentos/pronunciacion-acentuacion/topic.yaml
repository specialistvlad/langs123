          - type: note
            level: B2
            variety: es-419
            text: { es: ["En América Latina, una vocal cerrada y una abierta suelen formar diptongo: ", { term: guion }, " se dice en una sílaba."], en: ["In Latin America, a closed vowel and an open vowel usually form a diphthong: ", { term: "guion" }, " is said in one syllable."], uk: ["У Латинській Америці закрита й відкрита голосні зазвичай утворюють дифтонг: ", { term: "guion" }, " вимовляють в один склад."], pt: ["Na América Latina, uma vogal fechada e uma aberta costumam formar ditongo: ", { term: "guion" }, " se pronuncia em uma sílaba."], fr: ["En Amérique latine, une voyelle fermée et une voyelle ouverte forment souvent une diphtongue : ", { term: "guion" }, " se prononce en une syllabe."], de: ["In Lateinamerika bilden ein geschlossener und ein offener Vokal meist einen Diphthong: ", { term: "guion" }, " wird einsilbig gesprochen."], it: ["In America Latina una vocale chiusa e una aperta formano di solito un dittongo: ", { term: "guion" }, " si pronuncia in una sillaba."], pl: ["W Ameryce Łacińskiej samogłoska zamknięta i otwarta zwykle tworzą dyftong: ", { term: "guion" }, " wymawia się w jednej sylabie."], tr: ["Latin Amerika’da bir kapalı ve bir açık ünlü çoğunlukla diftong oluşturur: ", { term: "guion" }, " tek hecede söylenir."], id: ["Di Amerika Latin, vokal tertutup dan vokal terbuka biasanya membentuk diftong: ", { term: "guion" }, " diucapkan dalam satu suku kata."], vi: ["Ở Mỹ Latinh, một nguyên âm đóng và một nguyên âm mở thường tạo thành nguyên âm đôi: ", { term: "guion" }, " được đọc trong một âm tiết."] }
          - type: note
            level: B2
            variety: es-ES
            text: { es: ["En gran parte de España, una vocal cerrada y una abierta suelen dar dos sílabas: ", { term: guion }, " suena ", { sound: gi-on }, "."], en: ["In most of Spain, a closed vowel and an open vowel usually give two syllables: ", { term: "guion" }, " sounds like ", { sound: "gi-on" }, "."], uk: ["У більшій частині Іспанії закрита й відкрита голосні зазвичай дають два склади: ", { term: "guion" }, " звучить як ", { sound: "gi-on" }, "."], pt: ["Na maior parte da Espanha, uma vogal fechada e uma aberta costumam dar duas sílabas: ", { term: "guion" }, " soa como ", { sound: "gi-on" }, "."], fr: ["Dans la plus grande partie de l’Espagne, une voyelle fermée et une voyelle ouverte donnent souvent deux syllabes : ", { term: "guion" }, " se prononce ", { sound: "gi-on" }, "."], de: ["In den meisten Teilen Spaniens ergeben ein geschlossener und ein offener Vokal meist zwei Silben: ", { term: "guion" }, " klingt wie ", { sound: "gi-on" }, "."], it: ["Nella maggior parte della Spagna una vocale chiusa e una aperta danno di solito due sillabe: ", { term: "guion" }, " suona ", { sound: "gi-on" }, "."], pl: ["W większości Hiszpanii samogłoska zamknięta i otwarta zwykle dają dwie sylaby: ", { term: "guion" }, " brzmi ", { sound: "gi-on" }, "."], tr: ["İspanya’nın çoğunda bir kapalı ve bir açık ünlü çoğunlukla iki hece verir: ", { term: "guion" }, " sözcüğü ", { sound: "gi-on" }, " gibi okunur."], id: ["Di sebagian besar wilayah Spanyol, vokal tertutup dan vokal terbuka biasanya menjadi dua suku kata: ", { term: "guion" }, " terdengar ", { sound: "gi-on" }, "."], vi: ["Ở hầu hết Tây Ban Nha, một nguyên âm đóng và một nguyên âm mở thường cho hai âm tiết: ", { term: "guion" }, " nghe là ", { sound: "gi-on" }, "."] }

  - title: { en: Stress, es: El acento, uk: "Наголос", pt: "O acento tônico", fr: "L’accent tonique", de: "Die Betonung", it: "L'accento tonico", pl: "Akcent", tr: "Vurgu", id: "Tekanan", vi: "Trọng âm" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Every word has one stressed syllable, said a little louder and longer:"
              es: "Cada palabra tiene una sílaba tónica: la que se dice un poco más fuerte y más larga:"
              uk: "У кожному слові є один наголошений склад: його вимовляють трохи гучніше й довше:"
              pt: "Cada palavra tem uma sílaba tônica, a que se diz um pouco mais forte e mais longa:"
              fr: "Chaque mot a une syllabe tonique, celle que l’on dit un peu plus fort et plus longtemps :"
              de: "Jedes Wort hat eine betonte Silbe, die etwas lauter und länger gesprochen wird:"
              it: "Ogni parola ha una sillaba tonica, quella che si pronuncia un po' più forte e più a lungo:"
              pl: "Każdy wyraz ma jedną sylabę akcentowaną, wymawianą nieco głośniej i dłużej:"
              tr: "Her sözcüğün vurgulu bir hecesi vardır; bu hece biraz daha güçlü ve uzun söylenir:"
              id: "Setiap kata punya satu suku kata yang bertekanan, diucapkan sedikit lebih keras dan lebih panjang:"
              vi: "Mỗi từ có một âm tiết mang trọng âm, được đọc mạnh và dài hơn một chút:"
            ex: [{ stress: me }, "sa"]
            tr: { en: table, uk: "стіл", pt: "mesa", fr: "table", de: "Tisch", it: "tavolo", pl: "stół", tr: "masa", id: "meja", vi: "cái bàn" }
          - type: rule
            level: A1
            text:
              en: ["A word that ends in a vowel, ", { letter: "n" }, " or ", { letter: s }, " stresses the next-to-last syllable:"]
              es: ["Una palabra que termina en vocal, ", { letter: "n" }, " o ", { letter: s }, " lleva el acento en la penúltima sílaba:"]
              uk: ["Слово, що закінчується на голосну, ", { letter: "n" }, " або ", { letter: "s" }, ", має наголос на передостанньому складі:"]
              pt: ["Uma palavra que termina em vogal, ", { letter: "n" }, " ou ", { letter: "s" }, " tem o acento na penúltima sílaba:"]
              fr: ["Un mot qui se termine par une voyelle, ", { letter: "n" }, " ou ", { letter: "s" }, " a l’accent sur l’avant-dernière syllabe :"]
              de: ["Ein Wort, das auf Vokal, ", { letter: "n" }, " oder ", { letter: "s" }, " endet, wird auf der vorletzten Silbe betont:"]
              it: ["Una parola che termina in vocale, ", { letter: "n" }, " o ", { letter: "s" }, " ha l'accento sulla penultima sillaba:"]
              pl: ["Wyraz zakończony samogłoską, ", { letter: "n" }, " lub ", { letter: "s" }, " ma akcent na przedostatniej sylabie:"]
              tr: ["Ünlü, ", { letter: "n" }, " veya ", { letter: "s" }, " ile biten sözcüğün vurgusu sondan bir önceki hecededir:"]
              id: ["Kata yang berakhir dengan vokal, ", { letter: "n" }, ", atau ", { letter: "s" }, " ditekankan pada suku kata kedua dari belakang:"]
              vi: ["Từ kết thúc bằng nguyên âm, ", { letter: "n" }, " hoặc ", { letter: "s" }, " có trọng âm ở âm tiết áp chót:"]
            ex: { examples: [[{ stress: ca }, "sa"], [{ stress: ha }, "blan"], [{ stress: lu }, "nes"]] }
            tr: { en: { examples: [house, they speak, Monday] }, uk: { examples: ["дім", "вони розмовляють", "понеділок"] }, pt: { examples: ["casa", "eles falam", "segunda-feira"] }, fr: { examples: ["maison", "ils parlent", "lundi"] }, de: { examples: ["Haus", "sie sprechen", "Montag"] }, it: { examples: ["casa", "parlano", "lunedì"] }, pl: { examples: ["dom", "oni mówią", "poniedziałek"] }, tr: { examples: ["ev", "onlar konuşuyor", "pazartesi"] }, id: { examples: ["rumah", "mereka berbicara", "Senin"] }, vi: { examples: ["nhà", "họ nói", "thứ Hai"] } }
          - type: rule
            level: A1
            text:
              en: "A word that ends in any other consonant stresses the last syllable:"
              es: "Una palabra que termina en otra consonante lleva el acento en la última sílaba:"
              uk: "Слово, що закінчується на будь-яку іншу приголосну, має наголос на останньому складі:"
              pt: "Uma palavra que termina em qualquer outra consoante tem o acento na última sílaba:"
              fr: "Un mot qui se termine par une autre consonne a l’accent sur la dernière syllabe :"
              de: "Ein Wort, das auf einen anderen Konsonanten endet, wird auf der letzten Silbe betont:"
              it: "Una parola che termina in un'altra consonante ha l'accento sull'ultima sillaba:"
              pl: "Wyraz zakończony inną spółgłoską ma akcent na ostatniej sylabie:"
              tr: "Başka bir ünsüzle biten sözcüğün vurgusu son hecededir:"
              id: "Kata yang berakhir dengan konsonan lain ditekankan pada suku kata terakhir:"
              vi: "Từ kết thúc bằng phụ âm khác có trọng âm ở âm tiết cuối:"
            ex: { examples: [["ha", { stress: blar }], ["ciu", { stress: dad }], ["re", { stress: loj }]] }
            tr: { en: { examples: [to speak, city, watch] }, uk: { examples: ["розмовляти", "місто", "годинник"] }, pt: { examples: ["falar", "cidade", "relógio"] }, fr: { examples: ["parler", "ville", "montre"] }, de: { examples: ["sprechen", "Stadt", "Uhr"] }, it: { examples: ["parlare", "città", "orologio"] }, pl: { examples: ["mówić", "miasto", "zegarek"] }, tr: { examples: ["konuşmak", "şehir", "saat"] }, id: { examples: ["berbicara", "kota", "jam"] }, vi: { examples: ["nói", "thành phố", "đồng hồ"] } }
          - type: rule
            level: A1
            text:
              en: [{ letter: i }, " and ", { letter: u }, " join the vowel next to them in one syllable:"]
              es: ["La ", { letter: i }, " y la ", { letter: u }, " se unen a la vocal de al lado en una sola sílaba:"]
              uk: [{ letter: "i" }, " і ", { letter: "u" }, " утворюють один склад із сусідньою голосною:"]
              pt: [{ letter: "i" }, " e ", { letter: "u" }, " formam uma só sílaba com a vogal ao lado:"]
              fr: [{ letter: "i" }, " et ", { letter: "u" }, " forment une seule syllabe avec la voyelle voisine :"]
              de: [{ letter: "i" }, " und ", { letter: "u" }, " bilden mit dem benachbarten Vokal eine Silbe:"]
              it: [{ letter: "i" }, " e ", { letter: "u" }, " formano una sola sillaba con la vocale vicina:"]
              pl: [{ letter: "i" }, " i ", { letter: "u" }, " tworzą jedną sylabę z sąsiednią samogłoską:"]
              tr: [{ letter: "i" }, " ve ", { letter: "u" }, ", yanındaki ünlüyle tek bir hece oluşturur:"]
              id: [{ letter: "i" }, " dan ", { letter: "u" }, " membentuk satu suku kata dengan vokal di sebelahnya:"]
              vi: [{ letter: "i" }, " và ", { letter: "u" }, " tạo thành một âm tiết với nguyên âm bên cạnh:"]
            ex: { examples: [[{ stress: bue }, "no"], ["ciu", { stress: dad }]] }
            tr: { en: { examples: [good, city] }, uk: { examples: ["хороший", "місто"] }, pt: { examples: ["bom", "cidade"] }, fr: { examples: ["bon", "ville"] }, de: { examples: ["gut", "Stadt"] }, it: { examples: ["buono", "città"] }, pl: { examples: ["dobry", "miasto"] }, tr: { examples: ["iyi", "şehir"] }, id: { examples: ["baik", "kota"] }, vi: { examples: ["tốt", "thành phố"] } }
      - type: usage
        columns:
          - { key: word, label: { es: Palabra, en: "Word", uk: "Слово", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: syllables, label: { es: Sílabas, en: "Syllables", uk: "Склади", pt: "Sílabas", fr: "Syllabes", de: "Silben", it: "Sillabe", pl: "Sylaby", tr: "Heceler", id: "Suku kata", vi: "Âm tiết" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            word: { alternatives: [{ term: cardíaco }, { term: cardiaco }] }
            syllables: { alternatives: [car-dí-a-co, car-dia-co] }
            ex: ["Le hicieron un examen ", { target: cardíaco }, "."]
            tr: { en: "They gave him a heart examination.", uk: "Йому зробили обстеження серця.", pt: "Fizeram nele um exame cardíaco.", fr: "On lui a fait un examen cardiaque.", de: "Man hat bei ihm eine Herzuntersuchung gemacht.", it: "Gli hanno fatto un esame cardiaco.", pl: "Zrobiono mu badanie serca.", tr: "Ona kalp muayenesi yaptılar.", id: "Dia menjalani pemeriksaan jantung.", vi: "Họ đã khám tim cho anh ấy." }
          - level: C1
            word: { alternatives: [{ term: austriaco }, { term: austríaco }] }
            syllables: { alternatives: [aus-tria-co, aus-trí-a-co] }
            ex: ["Mi médico es ", { target: austriaco }, "."]
            tr: { en: "My doctor is Austrian.", uk: "Мій лікар — австрієць.", pt: "Meu médico é austríaco.", fr: "Mon médecin est autrichien.", de: "Mein Arzt ist Österreicher.", it: "Il mio medico è austriaco.", pl: "Mój lekarz jest Austriakiem.", tr: "Doktorum Avusturyalı.", id: "Dokter saya orang Austria.", vi: "Bác sĩ của tôi là người Áo." }
          - level: C1
            word: { alternatives: [{ term: período }, { term: periodo }] }
            syllables: { alternatives: [pe-rí-o-do, pe-rio-do] }
            ex: ["Este ", { target: periodo }, " del año es tranquilo."]
            tr: { en: "This period of the year is quiet.", uk: "Цей період року спокійний.", pt: "Este período do ano é tranquilo.", fr: "Cette période de l’année est calme.", de: "Diese Zeit des Jahres ist ruhig.", it: "Questo periodo dell'anno è tranquillo.", pl: "Ten okres roku jest spokojny.", tr: "Yılın bu dönemi sakindir.", id: "Periode tahun ini tenang.", vi: "Khoảng thời gian này trong năm rất yên tĩnh." }
          - level: C1
            word: { alternatives: [{ term: maníaco }, { term: maniaco }] }
            syllables: { alternatives: [ma-ní-a-co, ma-nia-co] }
            ex: ["Mi primo es un ", { target: maníaco }, " del orden."]
            tr: { en: "My cousin is obsessed with order.", uk: "Мій двоюрідний брат — маніяк порядку.", pt: "Meu primo é um maníaco por ordem.", fr: "Mon cousin est un maniaque de l’ordre.", de: "Mein Cousin ist ein Ordnungsfanatiker.", it: "Mio cugino è un maniaco dell'ordine.", pl: "Mój kuzyn ma bzika na punkcie porządku.", tr: "Kuzenim düzen takıntılısı.", id: "Sepupu saya sangat terobsesi pada kerapian.", vi: "Anh họ tôi bị ám ảnh về sự ngăn nắp." }
          - level: C1
            word: { alternatives: [{ term: fútbol }, { term: futbol }] }
            syllables: { alternatives: [fút-bol, fut-bol] }
            ex: ["Mis primos juegan al ", { target: fútbol }, "."]
            tr: { en: "My cousins play football.", uk: "Мої двоюрідні брати грають у футбол.", pt: "Meus primos jogam futebol.", fr: "Mes cousins jouent au football.", de: "Meine Cousins spielen Fußball.", it: "I miei cugini giocano a calcio.", pl: "Moi kuzyni grają w piłkę nożną.", tr: "Kuzenlerim futbol oynuyor.", id: "Sepupu-sepupu saya bermain sepak bola.", vi: "Các anh em họ của tôi chơi bóng đá." }
          - level: C1
            word: { alternatives: [{ term: adecuo }, { term: adecúo }] }
            syllables: { alternatives: [a-de-cuo, a-de-cú-o] }
            ex: ["Siempre ", { target: adecuo }, " el horario a mi trabajo."]
            tr: { en: "I always fit my schedule to my work.", uk: "Я завжди підлаштовую розклад під свою роботу.", pt: "Sempre adapto o horário ao meu trabalho.", fr: "J’adapte toujours mon emploi du temps à mon travail.", de: "Ich passe meinen Zeitplan immer meiner Arbeit an.", it: "Adatto sempre l'orario al mio lavoro.", pl: "Zawsze dostosowuję grafik do swojej pracy.", tr: "Programımı her zaman işime uyarlarım.", id: "Saya selalu menyesuaikan jadwal dengan pekerjaan saya.", vi: "Tôi luôn điều chỉnh lịch cho phù hợp với công việc." }
          - level: C1
            word: { alternatives: [{ term: licuo }, { term: licúo }] }
            syllables: { alternatives: [li-cuo, li-cú-o] }
            ex: [{ target: Licuo }, " la fruta con leche."]
            tr: { en: "I blend the fruit with milk.", uk: "Я збиваю фрукти з молоком.", pt: "Eu bato a fruta com leite.", fr: "Je mixe les fruits avec du lait.", de: "Ich mixe das Obst mit Milch.", it: "Frullo la frutta con il latte.", pl: "Miksuję owoce z mlekiem.", tr: "Meyveyi sütle karıştırırım.", id: "Saya menghaluskan buah dengan susu.", vi: "Tôi xay trái cây với sữa." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { es: "Las dos formas de cada par son correctas: cambia la sílaba tónica o la división en sílabas.", en: "Both forms of each pair are correct: the stressed syllable or the division into syllables changes.", uk: "Обидві форми кожної пари правильні: змінюється наголошений склад або поділ на склади.", pt: "As duas formas de cada par estão corretas: muda a sílaba tônica ou a divisão silábica.", fr: "Les deux formes de chaque paire sont correctes : la syllabe tonique ou le découpage en syllabes change.", de: "Beide Formen jedes Paares sind richtig: Es ändert sich die betonte Silbe oder die Silbentrennung.", it: "Le due forme di ogni coppia sono corrette: cambia la sillaba tonica o la divisione in sillabe.", pl: "Obie formy w każdej parze są poprawne: zmienia się sylaba akcentowana lub podział na sylaby.", tr: "Her çiftteki iki biçim de doğrudur: vurgulu hece ya da heceleme değişir.", id: "Kedua bentuk dalam setiap pasangan benar: suku kata bertekanan atau pembagian suku katanya yang berbeda.", vi: "Cả hai dạng trong mỗi cặp đều đúng: âm tiết mang trọng âm hoặc cách chia âm tiết thay đổi." }

  - title: { en: The written accent, es: La tilde, uk: "Знак наголосу", pt: "O acento gráfico", fr: "L’accent écrit", de: "Das Akzentzeichen", it: "L'accento scritto", pl: "Akcent graficzny", tr: "Vurgu işareti", id: "Tanda aksen", vi: "Dấu sắc" }
    role: own
    content:
      - type: list
        items:
          - type: note
            level: A1
            readers: [uk]
            text:
              uk: ["В іспанській знак наголосу пишуть у самому слові: ", { term: café }, ", ", { term: música }, "; в українському письмі наголос не позначають, тож його легко пропустити."]
          - type: rule
            level: A1
            text:
              en: "A written accent marks a stress that breaks the two rules above:"
              es: "La tilde marca un acento que no sigue las dos reglas anteriores:"
              uk: "Знак наголосу позначає наголос, який порушує два попередні правила:"
              pt: "O acento gráfico marca uma sílaba tônica que não segue as duas regras anteriores:"
              fr: "L’accent écrit marque un accent qui ne suit pas les deux règles précédentes :"
              de: "Das Akzentzeichen markiert eine Betonung, die den beiden vorigen Regeln nicht folgt:"
              it: "L'accento scritto segna un accento che non segue le due regole precedenti:"
              pl: "Akcent graficzny oznacza akcent, który nie spełnia dwóch poprzednich reguł:"
              tr: "Vurgu işareti, yukarıdaki iki kurala uymayan vurguyu gösterir:"
              id: "Tanda aksen menandai tekanan yang tidak mengikuti kedua aturan di atas:"
              vi: "Dấu sắc đánh dấu trọng âm không theo hai quy tắc ở trên:"
            ex: { examples: [["ca", { stress: fé }], ["ja", { stress: món }], [{ stress: ár }, "bol"]] }
            tr: { en: { examples: [coffee, ham, tree] }, uk: { examples: ["кава", "шинка", "дерево"] }, pt: { examples: ["café", "presunto", "árvore"] }, fr: { examples: ["café", "jambon", "arbre"] }, de: { examples: ["Kaffee", "Schinken", "Baum"] }, it: { examples: ["caffè", "prosciutto", "albero"] }, pl: { examples: ["kawa", "szynka", "drzewo"] }, tr: { examples: ["kahve", "jambon", "ağaç"] }, id: { examples: ["kopi", "ham", "pohon"] }, vi: { examples: ["cà phê", "giăm bông", "cái cây"] } }
          - type: rule
            level: A1
            text:
              en: "A word stressed before the next-to-last syllable always takes a written accent:"
              es: "Una palabra con el acento antes de la penúltima sílaba siempre lleva tilde:"
              uk: "Слово з наголосом перед передостаннім складом завжди пишуть зі знаком наголосу:"
              pt: "Uma palavra com o acento antes da penúltima sílaba sempre leva acento gráfico:"
              fr: "Un mot dont l’accent tombe avant l’avant-dernière syllabe prend toujours un accent écrit :"
              de: "Ein Wort, das vor der vorletzten Silbe betont wird, trägt immer ein Akzentzeichen:"
              it: "Una parola con l'accento prima della penultima sillaba porta sempre l'accento scritto:"
              pl: "Wyraz z akcentem przed przedostatnią sylabą zawsze ma akcent graficzny:"
              tr: "Vurgusu sondan bir önceki heceden önce gelen sözcük her zaman vurgu işareti alır:"
              id: "Kata yang tekanannya jatuh sebelum suku kata kedua dari belakang selalu memakai tanda aksen:"
              vi: "Từ có trọng âm trước âm tiết áp chót luôn có dấu sắc:"
            ex: { examples: [[{ stress: mú }, "sica"], [{ stress: sá }, "bado"]] }
            tr: { en: { examples: [music, Saturday] }, uk: { examples: ["музика", "субота"] }, pt: { examples: ["música", "sábado"] }, fr: { examples: ["musique", "samedi"] }, de: { examples: ["Musik", "Samstag"] }, it: { examples: ["musica", "sabato"] }, pl: { examples: ["muzyka", "sobota"] }, tr: { examples: ["müzik", "cumartesi"] }, id: { examples: ["musik", "Sabtu"] }, vi: { examples: ["âm nhạc", "thứ Bảy"] } }
          - type: rule
            level: A1
            text:
              en: ["An accent on ", { letter: i }, " or ", { letter: u }, " splits it from the vowel next to it:"]
              es: ["La tilde en la ", { letter: i }, " o en la ", { letter: u }, " la separa de la vocal de al lado:"]
              uk: ["Знак наголосу на ", { letter: "i" }, " або ", { letter: "u" }, " відокремлює її від сусідньої голосної:"]
              pt: ["O acento gráfico em ", { letter: "i" }, " ou em ", { letter: "u" }, " separa a letra da vogal ao lado:"]
              fr: ["Un accent écrit sur ", { letter: "i" }, " ou ", { letter: "u" }, " la sépare de la voyelle voisine :"]
              de: ["Ein Akzentzeichen auf ", { letter: "i" }, " oder ", { letter: "u" }, " trennt den Buchstaben vom benachbarten Vokal:"]
              it: ["L'accento scritto su ", { letter: "i" }, " o ", { letter: "u" }, " la separa dalla vocale vicina:"]
              pl: ["Akcent graficzny na ", { letter: "i" }, " lub ", { letter: "u" }, " oddziela tę literę od sąsiedniej samogłoski:"]
              tr: [{ letter: "i" }, " veya ", { letter: "u" }, " üzerindeki vurgu işareti onu yanındaki ünlüden ayırır:"]
              id: ["Tanda aksen pada ", { letter: "i" }, " atau ", { letter: "u" }, " memisahkannya dari vokal di sebelahnya:"]
              vi: ["Dấu sắc trên ", { letter: "i" }, " hoặc ", { letter: "u" }, " tách nó khỏi nguyên âm bên cạnh:"]
            ex: { examples: [["d", { stress: í }, "a"], ["pa", { stress: ís }]] }
            tr: { en: { examples: [day, country] }, uk: { examples: ["день", "країна"] }, pt: { examples: ["dia", "país"] }, fr: { examples: ["jour", "pays"] }, de: { examples: ["Tag", "Land"] }, it: { examples: ["giorno", "paese"] }, pl: { examples: ["dzień", "kraj"] }, tr: { examples: ["gün", "ülke"] }, id: { examples: ["hari", "negara"] }, vi: { examples: ["ngày", "đất nước"] } }
          - type: rule
            level: A1
            text:
              en: "Question and exclamation words carry a written accent:"
              es: "Las palabras interrogativas y exclamativas llevan tilde:"
              uk: "Питальні й окличні слова пишуть зі знаком наголосу:"
              pt: "As palavras interrogativas e exclamativas levam acento gráfico:"
              fr: "Les mots interrogatifs et exclamatifs portent un accent écrit :"
              de: "Frage- und Ausrufewörter tragen ein Akzentzeichen:"
              it: "Le parole interrogative ed esclamative portano l'accento scritto:"
              pl: "Wyrazy pytające i wykrzyknikowe mają akcent graficzny:"
              tr: "Soru ve ünlem sözcükleri vurgu işareti taşır:"
              id: "Kata tanya dan kata seru memakai tanda aksen:"
              vi: "Từ để hỏi và từ cảm thán có dấu sắc:"
            ex: { examples: [["¿", { target: Qué }, " quieres?"], ["¿", { target: Cómo }, " estás?"]] }
            tr: { en: { examples: [What do you want?, How are you?] }, uk: { examples: ["Що ти хочеш?", "Як справи?"] }, pt: { examples: ["O que você quer?", "Como você está?"] }, fr: { examples: ["Que veux-tu ?", "Comment vas-tu ?"] }, de: { examples: ["Was willst du?", "Wie geht es dir?"] }, it: { examples: ["Che cosa vuoi?", "Come stai?"] }, pl: { examples: ["Czego chcesz?", "Jak się masz?"] }, tr: { examples: ["Ne istiyorsun?", "Nasılsın?"] }, id: { examples: ["Kamu mau apa?", "Apa kabar?"] }, vi: { examples: ["Bạn muốn gì?", "Bạn khỏe không?"] } }
      - type: usage
        columns:
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
          - { key: meaning, label: { en: Meaning, es: Significado, uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A1, word: { target: tú }, meaning: { en: you, es: pronombre sujeto, uk: "ти", pt: "tu, você", fr: "tu", de: "du", it: "tu", pl: "ty", tr: "sen", id: "kamu", vi: "bạn" }, ex: [{ target: Tú }, " eres mi amigo."], tr: { en: You are my friend., uk: "Ти мій друг.", pt: "Você é meu amigo.", fr: "Tu es mon ami.", de: "Du bist mein Freund.", it: "Tu sei il mio amico.", pl: "Ty jesteś moim przyjacielem.", tr: "Sen benim arkadaşımsın.", id: "Kamu adalah temanku.", vi: "Bạn là bạn của tôi." } }
          - { level: A1, word: { target: tu }, meaning: { en: your, es: posesivo, uk: "твій", pt: "teu, seu", fr: "ton, ta", de: "dein", it: "tuo", pl: "twój", tr: "senin", id: "milikmu", vi: "của bạn" }, ex: ["Es ", { target: tu }, " libro."], tr: { en: "It's your book.", uk: "Це твоя книжка.", pt: "É o seu livro.", fr: "C’est ton livre.", de: "Es ist dein Buch.", it: "È il tuo libro.", pl: "To twoja książka.", tr: "Bu senin kitabın.", id: "Itu bukumu.", vi: "Đó là quyển sách của bạn." } }
          - { level: A1, word: { target: él }, meaning: { en: he, es: pronombre sujeto, uk: "він", pt: "ele", fr: "il, lui", de: "er", it: "lui", pl: "on", tr: "o", id: "dia", vi: "anh ấy" }, ex: [{ target: Él }, " es Juan."], tr: { en: He is Juan., uk: "Він — Хуан.", pt: "Ele é o Juan.", fr: "Lui, c’est Juan.", de: "Er ist Juan.", it: "Lui è Juan.", pl: "On to Juan.", tr: "O Juan.", id: "Dia adalah Juan.", vi: "Anh ấy là Juan." } }
          - { level: A1, word: { target: el }, meaning: { en: the, es: artículo, uk: "означений артикль", pt: "artigo definido", fr: "article défini", de: "bestimmter Artikel", it: "articolo determinativo", pl: "rodzajnik określony", tr: "belirli artikel", id: "kata sandang tentu", vi: "mạo từ xác định" }, ex: [{ target: El }, " libro es azul."], tr: { en: The book is blue., uk: "Книжка синя.", pt: "O livro é azul.", fr: "Le livre est bleu.", de: "Das Buch ist blau.", it: "Il libro è blu.", pl: "Książka jest niebieska.", tr: "Kitap mavi.", id: "Buku itu biru.", vi: "Quyển sách màu xanh." } }
          - { level: A1, word: { target: té }, meaning: { en: tea, es: bebida, uk: "чай", pt: "chá", fr: "thé", de: "Tee", it: "tè", pl: "herbata", tr: "çay", id: "teh", vi: "trà" }, ex: ["Un ", { target: té }, ", por favor."], tr: { en: "A tea, please.", uk: "Чай, будь ласка.", pt: "Um chá, por favor.", fr: "Un thé, s’il vous plaît.", de: "Einen Tee, bitte.", it: "Un tè, per favore.", pl: "Poproszę herbatę.", tr: "Bir çay, lütfen.", id: "Tolong, satu teh.", vi: "Cho tôi một ly trà." } }
          - { level: A1, word: { target: te }, meaning: { en: "you, yourself", es: pronombre, uk: "тебе, собі", pt: "te", fr: "te, t’", de: "dich, dir", it: "ti", pl: "cię, ci, się", tr: "seni, sana", id: "kamu (objek)", vi: "bạn (tân ngữ)" }, ex: ["¿Cómo ", { target: te }, " llamas?"], tr: { en: "What's your name?", uk: "Як тебе звати?", pt: "Como você se chama?", fr: "Comment tu t’appelles ?", de: "Wie heißt du?", it: "Come ti chiami?", pl: "Jak masz na imię?", tr: "Adın ne?", id: "Siapa namamu?", vi: "Bạn tên là gì?" } }
          - { level: A2, word: { target: sé }, meaning: { en: I know, es: verbo saber, uk: "знаю", pt: "eu sei", fr: "je sais", de: "ich weiß", it: "so", pl: "wiem", tr: "biliyorum", id: "saya tahu", vi: "tôi biết" }, ex: ["No ", { target: sé }, "."], tr: { en: "I don't know.", uk: "Не знаю.", pt: "Não sei.", fr: "Je ne sais pas.", de: "Ich weiß es nicht.", it: "Non lo so.", pl: "Nie wiem.", tr: "Bilmiyorum.", id: "Saya tidak tahu.", vi: "Tôi không biết." } }
          - { level: A2, word: { target: se }, meaning: { en: "himself, herself, themselves", es: pronombre, uk: "себе, собі", pt: "se", fr: "se", de: "sich", it: "si", pl: "się", tr: "kendini", id: "diri (refleksif)", vi: "tự (phản thân)" }, ex: ["Ana ", { target: se }, " levanta temprano."], tr: { en: Ana gets up early., uk: "Ана встає рано.", pt: "Ana acorda cedo.", fr: "Ana se lève tôt.", de: "Ana steht früh auf.", it: "Ana si alza presto.", pl: "Ana wstaje wcześnie.", tr: "Ana erken kalkıyor.", id: "Ana bangun pagi-pagi.", vi: "Ana dậy sớm." } }
          - { level: A2, word: { target: sí }, meaning: { en: "yes", es: afirmación, uk: "так", pt: "sim", fr: "oui", de: "ja", it: "sì", pl: "tak", tr: "evet", id: "ya", vi: "vâng" }, ex: [{ target: Sí }, ", claro."], tr: { en: "Yes, of course.", uk: "Так, звичайно.", pt: "Sim, claro.", fr: "Oui, bien sûr.", de: "Ja, klar.", it: "Sì, certo.", pl: "Tak, oczywiście.", tr: "Evet, tabii.", id: "Ya, tentu.", vi: "Vâng, tất nhiên." } }
          - { level: A2, word: { target: si }, meaning: { en: if, es: condición, uk: "якщо", pt: "se", fr: "si", de: "wenn, falls", it: "se", pl: "jeśli", tr: "eğer", id: "jika", vi: "nếu" }, ex: [{ target: Si }, " quieres, vamos."], tr: { en: "If you want, let's go.", uk: "Якщо хочеш, ходімо.", pt: "Se você quiser, vamos.", fr: "Si tu veux, on y va.", de: "Wenn du willst, gehen wir.", it: "Se vuoi, andiamo.", pl: "Jeśli chcesz, chodźmy.", tr: "İstersen gidelim.", id: "Kalau kamu mau, ayo pergi.", vi: "Nếu bạn muốn, chúng ta đi thôi." } }
          - { level: A2, word: { target: mí }, meaning: { en: me, es: pronombre con preposición, uk: "мене (після прийменника)", pt: "mim (depois de preposição)", fr: "moi (après une préposition)", de: "mir, mich (nach Präposition)", it: "me (dopo una preposizione)", pl: "mnie (po przyimku)", tr: "bana (edatla birlikte)", id: "saya (setelah preposisi)", vi: "tôi (sau giới từ)" }, ex: ["Es para ", { target: mí }, "."], tr: { en: "It's for me.", uk: "Це для мене.", pt: "É para mim.", fr: "C’est pour moi.", de: "Es ist für mich.", it: "È per me.", pl: "To dla mnie.", tr: "Bu benim için.", id: "Ini untuk saya.", vi: "Cái này là cho tôi." } }
          - { level: A2, word: { target: mi }, meaning: { en: my, es: posesivo, uk: "мій", pt: "meu", fr: "mon, ma", de: "mein", it: "mio", pl: "mój", tr: "benim", id: "milikku", vi: "của tôi" }, ex: ["Es ", { target: mi }, " casa."], tr: { en: "It's my house.", uk: "Це мій дім.", pt: "É a minha casa.", fr: "C’est ma maison.", de: "Es ist mein Haus.", it: "È casa mia.", pl: "To mój dom.", tr: "Bu benim evim.", id: "Ini rumahku.", vi: "Đây là nhà của tôi." } }
          - { level: B2, word: { target: quién }, meaning: { es: interrogativo o exclamativo de persona, en: "question or exclamation word for a person", uk: "питальне або окличне слово про особу", pt: "palavra interrogativa ou exclamativa de pessoa", fr: "mot interrogatif ou exclamatif de personne", de: "Frage- oder Ausrufewort für Personen", it: "parola interrogativa o esclamativa di persona", pl: "wyraz pytający lub wykrzyknikowy o osobie", tr: "kişi için soru ya da ünlem sözcüğü", id: "kata tanya atau kata seru untuk orang", vi: "từ để hỏi hoặc từ cảm thán chỉ người" }, ex: ["¿", { target: Quién }, " podría ayudarme?"], tr: { en: "Who could help me?", uk: "Хто міг би мені допомогти?", pt: "Quem poderia me ajudar?", fr: "Qui pourrait m’aider ?", de: "Wer könnte mir helfen?", it: "Chi potrebbe aiutarmi?", pl: "Kto mógłby mi pomóc?", tr: "Kim bana yardım edebilir?", id: "Siapa yang bisa membantu saya?", vi: "Ai có thể giúp tôi?" } }
          - { level: B2, word: { target: quien }, meaning: { es: relativo de persona, en: "relative word for a person", uk: "відносне слово про особу", pt: "relativo de pessoa", fr: "relatif de personne", de: "Relativwort für Personen", it: "relativo di persona", pl: "wyraz względny o osobie", tr: "kişi için ilgi sözcüğü", id: "kata relatif untuk orang", vi: "từ quan hệ chỉ người" }, ex: ["Busco a alguien a ", { target: quien }, " le guste la estadística."], tr: { en: "I'm looking for someone who likes statistics.", uk: "Я шукаю когось, кому подобається статистика.", pt: "Procuro alguém que goste de estatística.", fr: "Je cherche quelqu’un qui aime les statistiques.", de: "Ich suche jemanden, dem Statistik gefällt.", it: "Cerco qualcuno a cui piaccia la statistica.", pl: "Szukam kogoś, kto lubi statystykę.", tr: "İstatistiği seven birini arıyorum.", id: "Saya mencari seseorang yang suka statistik.", vi: "Tôi đang tìm một người thích thống kê." } }
          - { level: C1, word: { target: aún }, meaning: { es: todavía, en: "still, yet", uk: "ще", pt: "ainda", fr: "encore", de: "noch", it: "ancora", pl: "jeszcze", tr: "henüz, hâlâ", id: "masih, belum", vi: "vẫn, còn" }, ex: [{ target: Aún }, " no ha llegado."], tr: { en: "He hasn't arrived yet.", uk: "Він ще не прийшов.", pt: "Ele ainda não chegou.", fr: "Il n’est pas encore arrivé.", de: "Er ist noch nicht angekommen.", it: "Non è ancora arrivato.", pl: "Jeszcze nie przyszedł.", tr: "O henüz gelmedi.", id: "Dia belum datang.", vi: "Anh ấy vẫn chưa đến." } }
          - { level: C1, word: { target: aun }, meaning: { es: incluso, en: "even", uk: "навіть", pt: "até, inclusive", fr: "même", de: "sogar", it: "perfino", pl: "nawet", tr: "bile, hatta", id: "bahkan", vi: "ngay cả" }, ex: [{ target: Aun }, " así, no se rindió."], tr: { en: "Even so, he didn't give up.", uk: "Навіть так, він не здався.", pt: "Mesmo assim, ele não desistiu.", fr: "Même ainsi, il n’a pas abandonné.", de: "Trotzdem gab er nicht auf.", it: "Anche così, non si arrese.", pl: "Mimo to się nie poddał.", tr: "Yine de pes etmedi.", id: "Meski begitu, dia tidak menyerah.", vi: "Dù vậy, anh ấy không bỏ cuộc." } }
          - { level: C1, word: { target: cuánto }, meaning: { es: interrogativo o exclamativo de cantidad, en: "question or exclamation word for quantity", uk: "питальне або окличне слово про кількість", pt: "palavra interrogativa ou exclamativa de quantidade", fr: "mot interrogatif ou exclamatif de quantité", de: "Frage- oder Ausrufewort für Mengen", it: "parola interrogativa o esclamativa di quantità", pl: "wyraz pytający lub wykrzyknikowy o ilości", tr: "miktar için soru ya da ünlem sözcüğü", id: "kata tanya atau kata seru untuk jumlah", vi: "từ để hỏi hoặc từ cảm thán chỉ số lượng" }, ex: ["¡", { target: Cuánta }, " gente!"], tr: { en: "What a lot of people!", uk: "Скільки людей!", pt: "Quanta gente!", fr: "Quel monde !", de: "So viele Leute!", it: "Quanta gente!", pl: "Ileż ludzi!", tr: "Ne kadar çok insan!", id: "Banyak sekali orang!", vi: "Đông người quá!" } }
          - { level: C1, word: { target: cuanto }, meaning: { es: "relativo: todo lo que", en: "relative: all that", uk: "відносне слово: усе, що", pt: "relativo: tudo o que", fr: "relatif : tout ce que", de: "Relativwort: alles, was", it: "relativo: tutto ciò che", pl: "wyraz względny: wszystko, co", tr: "ilgi sözcüğü: ne varsa hepsi", id: "relatif: semua yang", vi: "từ quan hệ: tất cả những gì" }, ex: ["Come ", { target: cuanto }, " quieras."], tr: { en: "Eat as much as you like.", uk: "Їж скільки хочеш.", pt: "Coma quanto quiser.", fr: "Mange autant que tu veux.", de: "Iss, so viel du willst.", it: "Mangia quanto vuoi.", pl: "Jedz, ile chcesz.", tr: "İstediğin kadar ye.", id: "Makanlah sebanyak yang kamu mau.", vi: "Cứ ăn bao nhiêu tùy bạn." } }
          - { level: C1, word: { target: cuál }, meaning: { es: interrogativo de elección, en: "question word of choice", uk: "питальне слово вибору", pt: "palavra interrogativa de escolha", fr: "mot interrogatif de choix", de: "Fragewort der Auswahl", it: "parola interrogativa di scelta", pl: "wyraz pytający o wybór", tr: "seçim için soru sözcüğü", id: "kata tanya untuk pilihan", vi: "từ để hỏi chỉ sự lựa chọn" }, ex: ["¿", { target: Cuál }, " te gusta?"], tr: { en: "Which one do you like?", uk: "Який тобі подобається?", pt: "Qual você prefere?", fr: "Lequel te plaît ?", de: "Welches gefällt dir?", it: "Quale ti piace?", pl: "Który ci się podoba?", tr: "Hangisini beğeniyorsun?", id: "Kamu suka yang mana?", vi: "Bạn thích cái nào?" } }
          - { level: C1, word: { target: cual }, meaning: { es: "relativo, con lo, el o la", en: "relative, with lo, el or la", uk: "відносне слово, з lo, el або la", pt: "relativo, com lo, el ou la", fr: "relatif, avec lo, el ou la", de: "Relativwort, mit lo, el oder la", it: "relativo, con lo, el o la", pl: "wyraz względny, z lo, el lub la", tr: "ilgi sözcüğü; lo, el veya la ile", id: "kata relatif, dengan lo, el, atau la", vi: "từ quan hệ, đi với lo, el hoặc la" }, ex: ["Llegó tarde, lo ", { target: cual }, " no me sorprendió."], tr: { en: "He arrived late, which didn't surprise me.", uk: "Він прийшов пізно, що мене не здивувало.", pt: "Ele chegou tarde, o que não me surpreendeu.", fr: "Il est arrivé en retard, ce qui ne m’a pas surpris.", de: "Er kam zu spät, was mich nicht überrascht hat.", it: "È arrivato tardi, il che non mi ha sorpreso.", pl: "Przyszedł późno, co mnie nie zdziwiło.", tr: "Geç geldi, ki bu beni şaşırtmadı.", id: "Dia datang terlambat, yang tidak mengejutkan saya.", vi: "Anh ấy đến muộn, điều đó không làm tôi ngạc nhiên." } }
          - { level: C2, word: { target: más }, meaning: { es: cantidad o comparación, en: "quantity or comparison", uk: "кількість або порівняння", pt: "quantidade ou comparação", fr: "quantité ou comparaison", de: "Menge oder Vergleich", it: "quantità o confronto", pl: "ilość lub porównanie", tr: "miktar veya karşılaştırma", id: "jumlah atau perbandingan", vi: "số lượng hoặc so sánh" }, ex: ["Tenía que darme mucho ", { target: más }, "."], tr: { en: "He had to give me much more.", uk: "Він мав дати мені набагато більше.", pt: "Ele tinha que me dar muito mais.", fr: "Il devait me donner beaucoup plus.", de: "Er musste mir viel mehr geben.", it: "Doveva darmi molto di più.", pl: "Miał mi dać znacznie więcej.", tr: "Bana çok daha fazlasını vermesi gerekiyordu.", id: "Dia seharusnya memberi saya jauh lebih banyak.", vi: "Anh ấy phải cho tôi nhiều hơn thế nhiều." } }
          - { level: C2, word: { target: mas }, meaning: { es: "conjunción: pero", en: "conjunction: but", uk: "сполучник: але", pt: "conjunção: mas", fr: "conjonction : mais", de: "Konjunktion: aber", it: "congiunzione: ma", pl: "spójnik: ale", tr: "bağlaç: ama", id: "konjungsi: tetapi", vi: "liên từ: nhưng" }, ex: ["Le dije que sí, ", { target: mas }, " no estaba seguro."], tr: { en: "I told him yes, but I wasn't sure.", uk: "Я сказав йому «так», але не був упевнений.", pt: "Eu disse a ele que sim, mas não tinha certeza.", fr: "Je lui ai dit oui, mais je n’étais pas sûr.", de: "Ich sagte ihm Ja, aber ich war nicht sicher.", it: "Gli dissi di sì, ma non ero sicuro.", pl: "Powiedziałem mu, że tak, ale nie byłem pewien.", tr: "Ona evet dedim ama emin değildim.", id: "Saya bilang ya kepadanya, tetapi saya tidak yakin.", vi: "Tôi nói với anh ấy là có, nhưng tôi không chắc." } }
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: "Un compuesto se acentúa como una sola palabra: el primer elemento pierde su tilde.", en: "A compound is accented as one word: the first element loses its accent.", uk: "Складне слово наголошують як одне слово: перший елемент втрачає знак наголосу.", pt: "Um composto se acentua como uma só palavra: o primeiro elemento perde o acento gráfico.", fr: "Un mot composé s’accentue comme un seul mot : le premier élément perd son accent écrit.", de: "Ein Kompositum wird wie ein einziges Wort akzentuiert: Das erste Glied verliert sein Akzentzeichen.", it: "Un composto si accentua come una sola parola: il primo elemento perde l'accento scritto.", pl: "Wyraz złożony akcentuje się jak jeden wyraz: pierwszy człon traci akcent graficzny.", tr: "Birleşik sözcük tek sözcük gibi vurgulanır: ilk öğe vurgu işaretini kaybeder.", id: "Kata majemuk diberi tanda aksen seperti satu kata: unsur pertama kehilangan tanda aksennya.", vi: "Từ ghép đánh dấu như một từ duy nhất: thành phần đầu mất dấu sắc." }
            ex: ["Vivo en el ", { target: decimoséptimo }, " piso."]
            tr: { en: "I live on the seventeenth floor.", uk: "Я живу на сімнадцятому поверсі.", pt: "Moro no décimo sétimo andar.", fr: "J’habite au dix-septième étage.", de: "Ich wohne im siebzehnten Stock.", it: "Abito al diciassettesimo piano.", pl: "Mieszkam na siedemnastym piętrze.", tr: "On yedinci katta oturuyorum.", id: "Saya tinggal di lantai tujuh belas.", vi: "Tôi sống ở tầng mười bảy." }
          - type: rule
            level: B2
            text: { es: "Los interrogativos y exclamativos llevan tilde también en el estilo indirecto:", en: "Question and exclamation words take a written accent in reported speech too:", uk: "Питальні й окличні слова мають знак наголосу й у непрямій мові:", pt: "As palavras interrogativas e exclamativas levam acento gráfico também no discurso indireto:", fr: "Les mots interrogatifs et exclamatifs portent un accent écrit aussi dans le discours indirect :", de: "Frage- und Ausrufewörter tragen das Akzentzeichen auch in der indirekten Rede:", it: "Le parole interrogative ed esclamative portano l'accento scritto anche nel discorso indiretto:", pl: "Wyrazy pytające i wykrzyknikowe mają akcent graficzny także w mowie zależnej:", tr: "Soru ve ünlem sözcükleri dolaylı anlatımda da vurgu işareti taşır:", id: "Kata tanya dan kata seru memakai tanda aksen juga dalam kalimat tak langsung:", vi: "Từ để hỏi và từ cảm thán cũng có dấu sắc trong câu gián tiếp:" }
            ex: { examples: [["No sé ", { target: cuál }, " me gusta más."], ["Pregúntale ", { target: cuándo }, " llega."]] }
            tr: { en: { examples: ["I don't know which one I like more.", "Ask him when he arrives."] }, uk: { examples: ["Не знаю, який мені подобається більше.", "Запитай його, коли він приїде."] }, pt: { examples: ["Não sei qual eu prefiro.", "Pergunte a ele quando chega."] }, fr: { examples: ["Je ne sais pas lequel me plaît le plus.", "Demande-lui quand il arrive."] }, de: { examples: ["Ich weiß nicht, welches mir besser gefällt.", "Frag ihn, wann er ankommt."] }, it: { examples: ["Non so quale mi piaccia di più.", "Chiedigli quando arriva."] }, pl: { examples: ["Nie wiem, który podoba mi się bardziej.", "Zapytaj go, kiedy przyjedzie."] }, tr: { examples: ["Hangisini daha çok sevdiğimi bilmiyorum.", "Ona ne zaman geleceğini sor."] }, id: { examples: ["Saya tidak tahu mana yang lebih saya suka.", "Tanyakan kepadanya kapan dia tiba."] }, vi: { examples: ["Tôi không biết mình thích cái nào hơn.", "Hãy hỏi anh ấy khi nào anh ấy đến."] } }

