            it: "segna l'accento che non segue queste due regole"
            pl: "oznacza akcent, który nie spełnia tych dwóch reguł"
            tr: "bu iki kurala uymayan vurguyu gösterir"
            id: "menandai tekanan yang tidak mengikuti kedua aturan itu"
            vi: "đánh dấu trọng âm không theo hai quy tắc đó"
          ex: { examples: [["ca", { stress: fé }], [{ stress: ár }, "bol"], [{ stress: mú }, "sica"]] }
          tr: { en: { examples: [coffee, tree, music] }, uk: { examples: ["кава", "дерево", "музика"] }, pt: { examples: ["café", "árvore", "música"] }, fr: { examples: ["café", "arbre", "musique"] }, de: { examples: ["Kaffee", "Baum", "Musik"] }, it: { examples: ["caffè", "albero", "musica"] }, pl: { examples: ["kawa", "drzewo", "muzyka"] }, tr: { examples: ["kahve", "ağaç", "müzik"] }, id: { examples: ["kopi", "pohon", "musik"] }, vi: { examples: ["cà phê", "cái cây", "âm nhạc"] } }
        - level: A1
          point: { en: Words written alike, es: Palabras iguales, uk: "Слова, що різняться лише знаком наголосу", pt: "Palavras iguais", fr: "Mots identiques", de: "Gleich geschriebene Wörter", it: "Parole uguali", pl: "Takie same wyrazy", tr: "Aynı yazılan sözcükler", id: "Kata yang ditulis sama", vi: "Từ viết giống nhau" }
          rule:
            en: "an accent tells apart two words that are written the same"
            es: "la tilde distingue dos palabras que se escriben igual"
            uk: "знак наголосу розрізняє два слова, що пишуться однаково"
            pt: "o acento gráfico distingue duas palavras que se escrevem igual"
            fr: "l’accent écrit distingue deux mots qui s’écrivent de la même façon"
            de: "das Akzentzeichen unterscheidet zwei Wörter, die gleich geschrieben werden"
            it: "l'accento scritto distingue due parole che si scrivono allo stesso modo"
            pl: "akcent graficzny odróżnia dwa wyrazy zapisywane tak samo"
            tr: "vurgu işareti, aynı yazılan iki sözcüğü ayırır"
            id: "tanda aksen membedakan dua kata yang ditulis sama"
            vi: "dấu sắc phân biệt hai từ viết giống nhau"
          ex: [{ target: Tú }, " tienes ", { target: tu }, " libro."]
          tr: { en: You have your book., uk: "У тебе твоя книжка.", pt: "Você tem o seu livro.", fr: "Tu as ton livre.", de: "Du hast dein Buch.", it: "Tu hai il tuo libro.", pl: "Ty masz swoją książkę.", tr: "Kitabın sende.", id: "Kamu punya bukumu.", vi: "Bạn có quyển sách của bạn." }
        - level: A2
          point: { en: Words written alike, es: Palabras iguales, uk: "Слова, що різняться лише знаком наголосу", pt: "Palavras iguais", fr: "Mots identiques", de: "Gleich geschriebene Wörter", it: "Parole uguali", pl: "Takie same wyrazy", tr: "Aynı yazılan sözcükler", id: "Kata yang ditulis sama", vi: "Từ viết giống nhau" }
          rule:
            en: [{ term: sí }, " and ", { term: si }, ", ", { term: mí }, " and ", { term: mi }, " follow the same rule"]
            es: [{ term: sí }, " y ", { term: si }, ", ", { term: mí }, " y ", { term: mi }, " siguen la misma regla"]
            uk: [{ term: "sí" }, " і ", { term: "si" }, ", ", { term: "mí" }, " і ", { term: "mi" }, " підлягають тому самому правилу"]
            pt: [{ term: "sí" }, " e ", { term: "si" }, ", ", { term: "mí" }, " e ", { term: "mi" }, " seguem a mesma regra"]
            fr: [{ term: "sí" }, " et ", { term: "si" }, ", ", { term: "mí" }, " et ", { term: "mi" }, " suivent la même règle"]
            de: [{ term: "sí" }, " und ", { term: "si" }, ", ", { term: "mí" }, " und ", { term: "mi" }, " folgen derselben Regel"]
            it: [{ term: "sí" }, " e ", { term: "si" }, ", ", { term: "mí" }, " e ", { term: "mi" }, " seguono la stessa regola"]
            pl: [{ term: "sí" }, " i ", { term: "si" }, ", ", { term: "mí" }, " i ", { term: "mi" }, " podlegają tej samej regule"]
            tr: [{ term: "sí" }, " ile ", { term: "si" }, ", ", { term: "mí" }, " ile ", { term: "mi" }, " aynı kurala uyar"]
            id: [{ term: "sí" }, " dan ", { term: "si" }, ", ", { term: "mí" }, " dan ", { term: "mi" }, " mengikuti aturan yang sama"]
            vi: [{ term: "sí" }, " và ", { term: "si" }, ", ", { term: "mí" }, " và ", { term: "mi" }, " theo cùng quy tắc"]
          ex: [{ target: Sí }, ", es para ", { target: mí }, "."]
          tr: { en: "Yes, it's for me.", uk: "Так, це для мене.", pt: "Sim, é para mim.", fr: "Oui, c’est pour moi.", de: "Ja, es ist für mich.", it: "Sì, è per me.", pl: "Tak, to dla mnie.", tr: "Evet, benim için.", id: "Ya, itu untuk saya.", vi: "Vâng, cái này là cho tôi." }
        - level: A1
          point: { en: Trap, es: Trampa, uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: "question words always carry an accent"
            es: "las palabras interrogativas siempre llevan tilde"
            uk: "питальні слова завжди пишуть зі знаком наголосу"
            pt: "as palavras interrogativas sempre levam acento gráfico"
            fr: "les mots interrogatifs portent toujours un accent écrit"
            de: "Fragewörter tragen immer ein Akzentzeichen"
            it: "le parole interrogative portano sempre l'accento scritto"
            pl: "wyrazy pytające zawsze mają akcent graficzny"
            tr: "soru sözcükleri her zaman vurgu işareti taşır"
            id: "kata tanya selalu memakai tanda aksen"
            vi: "từ để hỏi luôn có dấu sắc"
          ex: ["¿", { target: Dónde }, " vives?"]
          tr: { en: Where do you live?, uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove abiti?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Kamu tinggal di mana?", vi: "Bạn sống ở đâu?" }
        - level: B2
          point: { es: La sílaba, en: "The syllable", uk: "Склад", pt: "A sílaba", fr: "La syllabe", de: "Die Silbe", it: "La sillaba", pl: "Sylaba", tr: "Hece", id: "Suku kata", vi: "Âm tiết" }
          rule: { es: una consonante entre vocales va con la vocal siguiente, en: "a consonant between vowels goes with the next vowel", uk: "приголосна між голосними переходить до наступної голосної", pt: "uma consoante entre vogais vai com a vogal seguinte", fr: "une consonne entre deux voyelles va avec la voyelle suivante", de: "ein Konsonant zwischen Vokalen gehört zum folgenden Vokal", it: "una consonante tra vocali va con la vocale seguente", pl: "spółgłoska między samogłoskami przechodzi do następnej samogłoski", tr: "ünlüler arasındaki ünsüz, sonraki ünlüyle birlikte okunur", id: "konsonan di antara vokal ikut vokal berikutnya", vi: "phụ âm giữa hai nguyên âm đi với nguyên âm sau" }
          ex: { examples: [{ target: me-sa }, { target: pro-bar }, { target: an-dar }] }
          tr: { en: { examples: ["table", "to try", "to walk"] }, uk: { examples: ["стіл", "пробувати", "ходити"] }, pt: { examples: ["mesa", "provar", "andar"] }, fr: { examples: ["table", "essayer", "marcher"] }, de: { examples: ["Tisch", "probieren", "gehen"] }, it: { examples: ["tavolo", "provare", "camminare"] }, pl: { examples: ["stół", "próbować", "chodzić"] }, tr: { examples: ["masa", "denemek", "yürümek"] }, id: { examples: ["meja", "mencoba", "berjalan"] }, vi: { examples: ["cái bàn", "thử", "đi bộ"] } }
        - level: B2
          point: { es: Sinalefa, en: "Synalepha", uk: "Синалефа", pt: "Sinalefa", fr: "Synalèphe", de: "Synalöphe", it: "Sinalefe", pl: "Synalefa", tr: "Sinalefa", id: "Sinalefa", vi: "Sinalefa" }
          rule: { es: la vocal final y la inicial de la palabra siguiente forman una sílaba, en: "the last vowel of a word and the first vowel of the next word form one syllable", uk: "кінцева голосна слова й початкова голосна наступного слова утворюють один склад", pt: "a vogal final e a vogal inicial da palavra seguinte formam uma sílaba", fr: "la voyelle finale et la voyelle initiale du mot suivant forment une syllabe", de: "der Schlussvokal und der Anfangsvokal des nächsten Wortes bilden eine Silbe", it: "la vocale finale e quella iniziale della parola seguente formano una sillaba", pl: "samogłoska końcowa i początkowa następnego wyrazu tworzą jedną sylabę", tr: "sözcüğün son ünlüsü ile sonraki sözcüğün ilk ünlüsü tek bir hece oluşturur", id: "vokal akhir sebuah kata dan vokal awal kata berikutnya membentuk satu suku kata", vi: "nguyên âm cuối của một từ và nguyên âm đầu của từ sau tạo thành một âm tiết" }
          ex: { mapping: [todo eso, to-doe-so] }
          tr: { en: "all that", uk: "усе це", pt: "tudo isso", fr: "tout cela", de: "all das", it: "tutto questo", pl: "to wszystko", tr: "bütün bunlar", id: "semua itu", vi: "tất cả những điều đó" }
        - level: B2
          point: { es: Trampa, en: "Trap", uk: "Пастка", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule: { es: los interrogativos llevan tilde también en el estilo indirecto, en: "question words also take an accent in reported speech", uk: "питальні слова мають знак наголосу й у непрямій мові", pt: "as palavras interrogativas levam acento gráfico também no discurso indireto", fr: "les mots interrogatifs prennent un accent écrit aussi dans le discours indirect", de: "Fragewörter tragen das Akzentzeichen auch in der indirekten Rede", it: "le parole interrogative portano l'accento scritto anche nel discorso indiretto", pl: "wyrazy pytające mają akcent graficzny także w mowie zależnej", tr: "soru sözcükleri dolaylı anlatımda da vurgu işareti taşır", id: "kata tanya memakai tanda aksen juga dalam kalimat tak langsung", vi: "từ để hỏi cũng có dấu sắc trong câu gián tiếp" }
          ex: ["No sé ", { target: cuál }, " me gusta más."]
          tr: { en: "I don't know which one I like more.", uk: "Не знаю, який мені подобається більше.", pt: "Não sei qual eu prefiro.", fr: "Je ne sais pas lequel me plaît le plus.", de: "Ich weiß nicht, welches mir besser gefällt.", it: "Non so quale mi piaccia di più.", pl: "Nie wiem, który podoba mi się bardziej.", tr: "Hangisini daha çok sevdiğimi bilmiyorum.", id: "Saya tidak tahu mana yang lebih saya suka.", vi: "Tôi không biết mình thích cái nào hơn." }
        - level: C1
          point: { es: Aún y aun, en: "Aún and aun", uk: "Aún і aun", pt: "Aún e aun", fr: "Aún et aun", de: "Aún und aun", it: "Aún e aun", pl: "Aún i aun", tr: "Aún ile aun", id: "Aún dan aun", vi: "Aún và aun" }
          rule: { es: "aún es todavía; aun, sin tilde, es incluso", en: "aún means “still” or “yet”; aun, without an accent, means “even”", uk: "aún означає «ще»; aun без знака наголосу означає «навіть»", pt: "aún significa “ainda”; aun, sem acento gráfico, significa “até”", fr: "aún signifie « encore » ; aun, sans accent écrit, signifie « même »", de: "aún heißt „noch“; aun ohne Akzentzeichen heißt „sogar“", it: "aún significa «ancora»; aun, senza accento scritto, significa «perfino»", pl: "aún znaczy „jeszcze”; aun bez akcentu graficznego znaczy „nawet”", tr: "aún “henüz, hâlâ” demektir; aun, vurgu işareti olmadan, “bile” demektir", id: "aún berarti “masih”; aun, tanpa tanda aksen, berarti “bahkan”", vi: "aún nghĩa là “vẫn, còn”; aun, không có dấu sắc, nghĩa là “ngay cả”" }
          ex: [{ target: Aún }, " no ha llegado."]
          tr: { en: "He hasn't arrived yet.", uk: "Він ще не прийшов.", pt: "Ele ainda não chegou.", fr: "Il n’est pas encore arrivé.", de: "Er ist noch nicht angekommen.", it: "Non è ancora arrivato.", pl: "Jeszcze nie przyszedł.", tr: "O henüz gelmedi.", id: "Dia belum datang.", vi: "Anh ấy vẫn chưa đến." }
        - level: C1
          point: { es: Palabras átonas, en: "Unstressed words", uk: "Ненаголошені слова", pt: "Palavras átonas", fr: "Mots atones", de: "Unbetonte Wörter", it: "Parole atone", pl: "Wyrazy nieakcentowane", tr: "Vurgusuz sözcükler", id: "Kata tanpa tekanan", vi: "Từ không nhấn" }
          rule: { es: "don, san, señor, buen y el relativo donde pierden el acento", en: "don, san, señor, buen and the relative donde lose their stress", uk: "don, san, señor, buen і відносне слово donde втрачають наголос", pt: "don, san, señor, buen e o relativo donde perdem o acento", fr: "don, san, señor, buen et le relatif donde perdent l’accent", de: "don, san, señor, buen und das Relativwort donde verlieren die Betonung", it: "don, san, señor, buen e il relativo donde perdono l'accento", pl: "don, san, señor, buen i wyraz względny donde tracą akcent", tr: "don, san, señor, buen ve ilgi sözcüğü donde vurgularını kaybeder", id: "don, san, señor, buen, dan kata relatif donde kehilangan tekanannya", vi: "don, san, señor, buen và từ quan hệ donde mất trọng âm" }
          ex: ["Saludé a ", { target: don }, " Emilio."]
          tr: { en: "I greeted Mr. Emilio.", uk: "Я привітався з паном Еміліо.", pt: "Cumprimentei o senhor Emilio.", fr: "J’ai salué monsieur Emilio.", de: "Ich habe Herrn Emilio begrüßt.", it: "Ho salutato il signor Emilio.", pl: "Przywitałem się z panem Emilio.", tr: "Emilio Bey’i selamladım.", id: "Saya menyapa Pak Emilio.", vi: "Tôi chào ông Emilio." }
        - level: C2
          point: { es: Más y mas, en: "Más and mas", uk: "Más і mas", pt: "Más e mas", fr: "Más et mas", de: "Más und mas", it: "Más e mas", pl: "Más i mas", tr: "Más ile mas", id: "Más dan mas", vi: "Más và mas" }
          rule: { es: "mas, sin tilde, es pero; más marca cantidad", en: "mas, without an accent, means “but”; más marks quantity", uk: "mas без знака наголосу означає «але»; más позначає кількість", pt: "mas, sem acento gráfico, significa “mas”; más indica quantidade", fr: "mas, sans accent écrit, signifie « mais » ; más marque la quantité", de: "mas ohne Akzentzeichen heißt „aber“; más bezeichnet eine Menge", it: "mas, senza accento scritto, significa «ma»; más indica quantità", pl: "mas bez akcentu graficznego znaczy „ale”; más oznacza ilość", tr: "vurgu işareti olmayan mas “ama” demektir; más miktarı gösterir", id: "mas, tanpa tanda aksen, berarti “tetapi”; más menandai jumlah", vi: "mas, không có dấu sắc, nghĩa là “nhưng”; más chỉ số lượng" }
          ex: ["Le dije que sí, ", { target: mas }, " no estaba seguro."]
          tr: { en: "I told him yes, but I wasn't sure.", uk: "Я сказав йому «так», але не був упевнений.", pt: "Eu disse a ele que sim, mas não tinha certeza.", fr: "Je lui ai dit oui, mais je n’étais pas sûr.", de: "Ich sagte ihm Ja, aber ich war nicht sicher.", it: "Gli dissi di sì, ma non ero sicuro.", pl: "Powiedziałem mu, że tak, ale nie byłem pewien.", tr: "Ona evet dedim ama emin değildim.", id: "Saya bilang ya kepadanya, tetapi saya tidak yakin.", vi: "Tôi nói với anh ấy là có, nhưng tôi không chắc." }
        - level: C2
          point: { es: Variantes, en: "Variants", uk: "Варіанти", pt: "Variantes", fr: "Variantes", de: "Varianten", it: "Varianti", pl: "Warianty", tr: "Varyantlar", id: "Variasi", vi: "Biến thể" }
          rule: { es: la pronunciación cambia con la región y el registro, en: "pronunciation changes with the region and the register", uk: "вимова змінюється залежно від регіону та регістру мовлення", pt: "a pronúncia muda com a região e o registro", fr: "la prononciation change selon la région et le registre", de: "die Aussprache ändert sich mit der Region und dem Sprachregister", it: "la pronuncia cambia con la regione e il registro", pl: "wymowa zmienia się zależnie od regionu i rejestru", tr: "telaffuz bölgeye ve konuşma düzeyine göre değişir", id: "pelafalan berubah menurut daerah dan ragam bahasa", vi: "cách phát âm thay đổi theo vùng và phong cách nói" }
          ex: { mapping: [pan, { ipa: paŋ }] }
          tr: { en: "bread", uk: "хліб", pt: "pão", fr: "pain", de: "Brot", it: "pane", pl: "chleb", tr: "ekmek", id: "roti", vi: "bánh mì" }

sections:
  - title: { en: Vowels, es: Las vocales, uk: "Голосні", pt: "As vogais", fr: "Les voyelles", de: "Die Vokale", it: "Le vocali", pl: "Samogłoski", tr: "Ünlüler", id: "Vokal", vi: "Nguyên âm" }
    role: own
    content:
      - type: inventory
        set: sounds
        columns:
          - { key: letter, label: { en: Letter, es: Letra, uk: "Літера", pt: "Letra", fr: "Lettre", de: "Buchstabe", it: "Lettera", pl: "Litera", tr: "Harf", id: "Huruf", vi: "Chữ cái" } }
          - { key: sound, label: { en: Sound, es: Sonido, uk: "Звук", pt: "Som", fr: "Son", de: "Laut", it: "Suono", pl: "Dźwięk", tr: "Ses", id: "Bunyi", vi: "Âm" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - { level: A0, value: a, letter: { letter: a }, sound: { ipa: a }, ex: ["c", { target: { letter: a } }, "s", { target: { letter: a } }], tr: { en: house, uk: "дім", pt: "casa", fr: "maison", de: "Haus", it: "casa", pl: "dom", tr: "ev", id: "rumah", vi: "nhà" } }
          - { level: A0, value: e, letter: { letter: e }, sound: { ipa: e }, ex: ["m", { target: { letter: e } }, "sa"], tr: { en: table, uk: "стіл", pt: "mesa", fr: "table", de: "Tisch", it: "tavolo", pl: "stół", tr: "masa", id: "meja", vi: "cái bàn" } }
          - { level: A0, value: i, letter: { letter: i }, sound: { ipa: i }, ex: ["l", { target: { letter: i } }, "bro"], tr: { en: book, uk: "книжка", pt: "livro", fr: "livre", de: "Buch", it: "libro", pl: "książka", tr: "kitap", id: "buku", vi: "quyển sách" } }
          - { level: A0, value: o, letter: { letter: o }, sound: { ipa: o }, ex: ["t", { target: { letter: o } }, "d", { target: { letter: o } }], tr: { en: everything, uk: "усе", pt: "tudo", fr: "tout", de: "alles", it: "tutto", pl: "wszystko", tr: "her şey", id: "semuanya", vi: "tất cả" } }
          - { level: A0, value: u, letter: { letter: u }, sound: { ipa: u }, ex: [{ target: { letter: u } }, "no"], tr: { en: one, uk: "один", pt: "um", fr: "un", de: "eins", it: "uno", pl: "jeden", tr: "bir", id: "satu", vi: "một" } }
      - type: list
        items:
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: ["Ненаголошені ", { letter: "e" }, " та ", { letter: "i" }, " звучать чітко й не змішуються, як українські е та и в ненаголошених складах: ", { term: mesita }, ", ", { term: cenar }, "."]
          - type: note
            level: A0
            readers: [uk]
            text:
              uk: ["Приголосні перед ", { letter: "i" }, " не пом’якшуються: ", { term: ti }, ", ", { term: día }, " звучать твердіше, ніж українські «ті», «ді»."]
          - type: rule
            level: A0
            text:
              en: "Each vowel keeps its one short, clear sound, stressed or not:"
              es: "Cada vocal mantiene su sonido breve y claro, con acento o sin él:"
              uk: "Кожна голосна зберігає свій короткий чіткий звук — під наголосом і без нього:"
              pt: "Cada vogal mantém seu som curto e claro, tônica ou átona:"
              fr: "Chaque voyelle garde un seul son, bref et net, accentuée ou non :"
              de: "Jeder Vokal behält seinen kurzen, klaren Laut, betont oder unbetont:"
              it: "Ogni vocale mantiene il suo suono breve e chiaro, con accento o senza:"
              pl: "Każda samogłoska zachowuje swój krótki, wyraźny dźwięk, w sylabie akcentowanej i nieakcentowanej:"
