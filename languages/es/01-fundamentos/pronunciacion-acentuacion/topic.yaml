  - title: { es: La sílaba }
    role: own
    content:
      - type: usage
        columns:
          - { key: structure, label: { es: Estructura } }
          - { key: division, label: { es: División } }
          - { key: ex, label: { es: Ejemplo } }
        rows:
          - level: B2
            structure: { es: una consonante entre dos vocales }
            division: { es: ["va con la vocal siguiente; ", { letter: "ch, ll, rr" }, " cuentan como una sola consonante"] }
            ex: { examples: [{ target: me-sa }, { target: ca-lle }] }
          - level: B2
            structure: { es: ["los grupos ", { letter: "pr, br, pl, bl, fr, fl, gr, gl, cr, cl, dr, tr" }] }
            division: { es: van juntos con la vocal siguiente }
            ex: { examples: [{ target: pro-bar }, { target: cla-ro }, { target: dra-ma }] }
          - level: B2
            structure: { es: otro par de consonantes }
            division: { es: la primera cierra una sílaba y la segunda abre otra }
            ex: { examples: [{ target: an-dar }, { target: ac-ción }] }
          - level: B2
            structure: { es: tres o cuatro consonantes que terminan en uno de esos grupos }
            division: { es: "el grupo va con la vocal siguiente y las demás quedan atrás" }
            ex: { examples: [{ target: in-fla-mar }, { target: cons-truir }] }
          - level: B2
            structure: { es: tres consonantes que no terminan en grupo }
            division: { es: solo la última va con la vocal siguiente }
            ex: { target: ins-tan-te }

