title: { en: Sounds and Stress, es: Pronunciación y acentuación, uk: "Звуки й наголос", pt: "Pronúncia e acentuação", fr: "Prononciation et accentuation", de: "Aussprache und Betonung", it: "Pronuncia e accentuazione", pl: "Wymowa i akcent", tr: "Telaffuz ve vurgu", id: "Pelafalan dan tekanan", vi: "Phát âm và trọng âm" }
summary:
  lead:
    en: "The five vowels and the consonant sounds of Spanish, where the stress falls in a word, and when the word takes a written accent."
    es: "Las cinco vocales y los sonidos consonánticos del español, dónde cae el acento de una palabra y cuándo lleva tilde."
    uk: "П’ять голосних і приголосні звуки іспанської мови, місце наголосу в слові та випадки, коли слово пишуть зі знаком наголосу."
    pt: "As cinco vogais e os sons consonantais do espanhol, a posição do acento na palavra e quando ela leva acento gráfico."
    fr: "Les cinq voyelles et les consonnes de l’espagnol, la place de l’accent dans le mot et quand il prend un accent écrit."
    de: "Die fünf Vokale und die Konsonantenlaute des Spanischen, wo die Betonung eines Wortes liegt und wann es ein Akzentzeichen trägt."
    it: "Le cinque vocali e i suoni consonantici dello spagnolo, dove cade l'accento di una parola e quando porta l'accento scritto."
    pl: "Pięć samogłosek i spółgłoski hiszpańskiego, miejsce akcentu w wyrazie oraz sytuacje, w których wyraz ma akcent graficzny."
    tr: "İspanyolcanın beş ünlüsü ve ünsüz sesleri, vurgunun sözcükte nereye düştüğü ve sözcüğün ne zaman vurgu işareti aldığı."
    id: "Lima vokal dan bunyi konsonan bahasa Spanyol, letak tekanan dalam kata, serta kapan kata memakai tanda aksen."
    vi: "Năm nguyên âm và phụ âm tiếng Tây Ban Nha, vị trí trọng âm, khi nào từ có dấu sắc."
  rule:
    en: "Words ending in a vowel, n or s stress the next-to-last syllable, the others the last; a written accent marks any other stress:"
    es: "Las palabras en vocal, n o s llevan el acento en la penúltima sílaba, y las demás en la última; la tilde marca cualquier otro acento:"
    uk: "Слова, що закінчуються на голосну, n або s, мають наголос на передостанньому складі, решта — на останньому; знак наголосу позначає будь-який інший наголос:"
    pt: "Palavras terminadas em vogal, n ou s têm acento na penúltima sílaba, as demais na última; o acento gráfico marca qualquer outra sílaba tônica:"
    fr: "Un mot en voyelle, n ou s a l’accent sur l’avant-dernière syllabe, sinon sur la dernière ; l’accent écrit marque tout autre cas :"
    de: "Wörter auf Vokal, n oder s werden auf der vorletzten Silbe betont, alle anderen auf der letzten; das Akzentzeichen markiert jede andere Betonung:"
    it: "Le parole che terminano in vocale, n o s hanno l'accento sulla penultima sillaba, le altre sull'ultima; l'accento scritto segna ogni altro accento:"
    pl: "Wyrazy zakończone samogłoską, n lub s mają akcent na przedostatniej sylabie, pozostałe na ostatniej; akcent graficzny oznacza każdy inny akcent:"
    tr: "Ünlü, n veya s ile biten sözcüklerde vurgu sondan bir önceki hecede, diğerlerinde son hecededir; vurgu işareti başka her vurguyu gösterir:"
    id: "Kata berakhiran vokal, n, atau s ditekankan pada suku kata kedua dari belakang, kata lain pada suku kata terakhir; tanda aksen menandai tekanan lainnya:"
    vi: "Từ tận cùng bằng nguyên âm, n, s nhấn âm tiết áp chót, từ khác nhấn âm tiết cuối; dấu sắc ghi mọi trọng âm khác:"
  ex: { examples: [[{ stress: ca }, "sa"], ["ha", { stress: blar }], ["ca", { stress: fé }]] }

