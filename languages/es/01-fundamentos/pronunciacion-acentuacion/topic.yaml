            ex: ["Ana ", { target: me lo dio }, " ayer."]
            tr: { en: "Ana gave it to me yesterday.", uk: "Ана дала мені це вчора.", pt: "A Ana me deu isso ontem.", fr: "Ana me l’a donné hier.", de: "Ana hat es mir gestern gegeben.", it: "Ana me lo ha dato ieri.", pl: "Ana dała mi to wczoraj.", tr: "Ana bunu bana dün verdi.", id: "Ana memberikannya kepada saya kemarin.", vi: "Ana đã đưa cho tôi cái đó hôm qua." }
          - level: B2
            unit: { es: auxiliar y participio, en: "helper verb and participle", uk: "допоміжне дієслово й дієприкметник", pt: "auxiliar e particípio", fr: "auxiliaire et participe", de: "Hilfsverb und Partizip", it: "ausiliare e participio", pl: "czasownik pomocniczy i imiesłów", tr: "yardımcı fiil ve participio", id: "kata kerja bantu dan partisip", vi: "trợ động từ và quá khứ phân từ" }
            ex: ["Mi hermano ", { target: ha llegado }, " tarde."]
            tr: { en: "My brother arrived late.", uk: "Мій брат прийшов пізно.", pt: "Meu irmão chegou tarde.", fr: "Mon frère est arrivé en retard.", de: "Mein Bruder ist spät angekommen.", it: "Mio fratello è arrivato tardi.", pl: "Mój brat przyszedł późno.", tr: "Erkek kardeşim geç geldi.", id: "Saudara laki-laki saya datang terlambat.", vi: "Anh trai tôi đã đến muộn." }
