            ex: ["Vivo ", { target: con mis padres }, "."]
            tr: { en: "I live with my parents.", uk: "Я живу з батьками.", pt: "Moro com meus pais.", fr: "J’habite avec mes parents.", de: "Ich wohne bei meinen Eltern.", it: "Vivo con i miei genitori.", pl: "Mieszkam z rodzicami.", tr: "Ailemle yaşıyorum.", id: "Saya tinggal bersama orang tua saya.", vi: "Tôi sống với bố mẹ." }
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: "Una pausa ante y tras la relativa la vuelve explicativa; sin pausas, la relativa identifica.", en: "Pauses before and after a relative clause make it non-restrictive; without pauses, it identifies the noun.", uk: "Паузи перед підрядним реченням і після нього роблять його поясновальним; без пауз воно виділяє іменник.", pt: "Uma pausa antes e depois da oração relativa a torna explicativa; sem pausas, ela é restritiva.", fr: "Une pause avant et après la proposition relative la rend explicative ; sans pauses, elle est déterminative.", de: "Pausen vor und nach dem Relativsatz machen ihn erläuternd; ohne Pausen schränkt er das Bezugswort ein.", it: "Una pausa prima e dopo la relativa la rende appositiva; senza pause, la relativa è limitativa.", pl: "Pauzy przed zdaniem względnym i po nim czynią je wyjaśniającym; bez pauz określa ono rzeczownik.", tr: "Cümlenin önündeki ve arkasındaki duraklamalar ilgi cümlesini açıklayıcı yapar; duraklama yoksa cümle ismi belirler.", id: "Jeda sebelum dan sesudah klausa relatif membuatnya bersifat penjelas; tanpa jeda, klausa relatif membatasi kata bendanya.", vi: "Ngắt nghỉ hai bên làm mệnh đề quan hệ thành giải thích thêm; không ngắt nghỉ, nó xác định danh từ." }
            ex: { contrast: ["Mis primos, que viven en Lima, llegan hoy.", "Mis primos que viven en Lima llegan hoy."] }
            tr: { en: { contrast: ["My cousins, who live in Lima, arrive today.", "My cousins who live in Lima arrive today."] }, uk: { contrast: ["Мої двоюрідні брати, які живуть у Лімі, приїжджають сьогодні.", "Ті мої двоюрідні брати, які живуть у Лімі, приїжджають сьогодні."] }, pt: { contrast: ["Meus primos, que moram em Lima, chegam hoje.", "Meus primos que moram em Lima chegam hoje."] }, fr: { contrast: ["Mes cousins, qui habitent à Lima, arrivent aujourd’hui.", "Mes cousins qui habitent à Lima arrivent aujourd’hui."] }, de: { contrast: ["Meine Cousins, die übrigens in Lima wohnen, kommen heute an.", "Diejenigen meiner Cousins, die in Lima wohnen, kommen heute an."] }, it: { contrast: ["I miei cugini, che vivono a Lima, arrivano oggi.", "I miei cugini che vivono a Lima arrivano oggi."] }, pl: { contrast: ["Moi kuzyni, którzy mieszkają w Limie, przyjeżdżają dzisiaj.", "Ci moi kuzyni, którzy mieszkają w Limie, przyjeżdżają dzisiaj."] }, tr: { contrast: ["Kuzenlerim, ki Lima’da yaşıyorlar, bugün geliyor.", "Lima’da yaşayan kuzenlerim bugün geliyor."] }, id: { contrast: ["Sepupu-sepupu saya, yang tinggal di Lima, tiba hari ini.", "Sepupu-sepupu saya yang tinggal di Lima tiba hari ini."] }, vi: { contrast: ["Các anh em họ của tôi, họ sống ở Lima, hôm nay đến.", "Những người anh em họ của tôi sống ở Lima hôm nay đến."] } }

