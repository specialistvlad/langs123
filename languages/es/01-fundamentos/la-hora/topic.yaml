              id: ["Di Meksiko dan Amerika Tengah, orang juga menanyakan ", { term: ¿Qué horas son? }, "."]
              vi: ["Ở Mexico và Trung Mỹ, người ta cũng hỏi ", { term: ¿Qué horas son? }, "."]

