id: es.fundamentos.la-hora
lang: es
kind: foundations
tags: [time, clock, hours]
concepts: [telling-time]
related: [es.fundamentos.numeros, es.fundamentos.dias-meses-fechas, es.preposiciones.preposiciones-basicas]
status: { en: draft, es: draft, uk: draft }
translated: { en: "ec0689 2dac0c 1a8c47 482c23 241006 09e588 6957ff", uk: "ec0689 2dac0c 1a8c47 482c23 241006 09e588 6957ff" }

title: { en: Telling the Time, es: La hora, uk: "Котра година" }
summary:
  lead:
    en: ["The time with ", { term: es la una }, " and ", { term: son las }, ", the minutes with ", { term: y }, " and ", { term: menos }, ", and ", { term: a las }, " for when something happens."]
    es: ["La hora con ", { term: es la una }, " y ", { term: son las }, ", los minutos con ", { term: y }, " y ", { term: menos }, ", y ", { term: a las }, " para decir cuándo pasa algo."]
    uk: ["Час із ", { term: "es la una" }, " і ", { term: "son las" }, ", хвилини з ", { term: "y" }, " і ", { term: "menos" }, ", а ", { term: "a las" }, " — щоб сказати, коли щось відбувається."]
  rule:
    en: ["One o'clock takes ", { term: es la }, ", and every other hour ", { term: son las }, ":"]
    es: ["La una lleva ", { term: es la }, ", y las demás horas, ", { term: son las }, ":"]
    uk: ["Перша година вживається з ", { term: "es la" }, ", а всі інші — з ", { term: "son las" }, ":"]
  ex: { examples: [[{ target: Es la }, " una."], [{ target: Son las }, " tres."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: { en: Asking, es: Preguntar, uk: "Як запитати" }
          rule:
            en: ["ask ", { term: ¿Qué hora es? }, " and answer with ", { term: es }, " or ", { term: son }]
            es: ["se pregunta ", { term: ¿Qué hora es? }, " y se responde con ", { term: es }, " o ", { term: son }]
            uk: ["запитують ", { term: "¿Qué hora es?" }, ", а відповідають із ", { term: "es" }, " або ", { term: "son" }]
          ex: { exchange: ["¿Qué hora es?", [{ target: Son las }, " ", { time: tres, value: "03:00" }, "."]] }
          tr: { en: { exchange: [What time is it?, "It's three o'clock."] }, uk: { exchange: ["Котра година?", "Третя година."] } }
        - level: A0
          point: { en: The hour, es: La hora, uk: "Година" }
          rule:
            en: [{ term: es la una }, "; every other hour takes ", { term: son las }]
            es: [{ term: es la una }, "; las demás horas llevan ", { term: son las }]
            uk: [{ term: "es la una" }, "; усі інші години вживаються з ", { term: "son las" }]
          ex: { examples: [[{ target: Es la }, " una."], [{ target: Son las }, " dos."]] }
          tr: { en: { examples: ["It's one o'clock.", "It's two o'clock."] }, uk: { examples: ["Перша година.", "Друга година."] } }
        - level: A0
          point: en punto
          rule: { en: a full hour, es: una hora exacta, uk: "рівна година" }
          ex: ["Son las cinco ", { target: en punto }, "."]
          tr: { en: "It's five o'clock.", uk: "П’ята година." }
        - level: A0
          point: { en: "Minutes 1–30", es: "Minutos 1–30", uk: "Хвилини 1–30" }
          rule:
            en: ["the hour, ", { term: y }, ", the minutes"]
            es: ["la hora, ", { term: y }, ", los minutos"]
            uk: ["година, ", { term: "y" }, ", хвилини"]
          ex: { time: ["las dos ", { target: y }, " diez"], value: "02:10" }
          tr: { en: ten past two, uk: "десять хвилин по другій" }
        - level: A0
          point: { alternatives: [cuarto, media] }
          rule:
            en: [{ term: cuarto }, " is 15 minutes, ", { term: media }, " is 30"]
            es: [{ term: cuarto }, " son 15 minutos, ", { term: media }, ", 30"]
            uk: [{ term: "cuarto" }, " — це 15 хвилин, ", { term: "media" }, " — 30"]
          ex: { examples: [{ time: ["las tres ", { target: y cuarto }], value: "03:15" }, { time: ["las tres ", { target: y media }], value: "03:30" }] }
          tr: { en: { examples: [quarter past three, half past three] }, uk: { examples: ["чверть на четверту", "пів на четверту"] } }
        - level: A1
          point: { en: "Minutes 31–59", es: "Minutos 31–59", uk: "Хвилини 31–59" }
          rule:
            en: ["the next hour, ", { term: menos }, ", the minutes left"]
            es: ["la hora siguiente, ", { term: menos }, ", los minutos que faltan"]
            uk: ["наступна година, ", { term: "menos" }, ", хвилини, що залишилися"]
          ex: { examples: [{ time: ["las cuatro ", { target: menos }, " diez"], value: "03:50" }, { time: ["las cuatro ", { target: menos cuarto }], value: "03:45" }] }
          tr: { en: { examples: [ten to four, quarter to four] }, uk: { examples: ["за десять четверта", "за чверть четверта"] } }
        - level: A1
          variety: es-419
          point: { en: "Minutes 31–59", es: "Minutos 31–59", uk: "Хвилини 31–59" }
          rule:
            en: ["also the minutes left, ", { term: para }, ", the next hour"]
            es: ["también los minutos que faltan, ", { term: para }, ", la hora siguiente"]
            uk: ["також хвилини, що залишилися, ", { term: "para" }, ", наступна година"]
          ex: { time: ["diez ", { target: para }, " las cuatro"], value: "03:50" }
          tr: { en: ten to four, uk: "за десять четверта" }
        - level: A1
          point: a las
          rule:
            en: [{ term: a las }, " and the time for when something happens; ", { term: a la una }]
            es: [{ term: a las }, " y la hora para decir cuándo pasa algo; ", { term: a la una }]
            uk: [{ term: "a las" }, " і час — щоб сказати, коли щось відбувається; ", { term: "a la una" }]
          ex: ["La clase empieza ", { target: a las }, " nueve."]
          tr: { en: The class starts at nine., uk: "Заняття починається о дев’ятій." }
        - level: A1
          point: { en: Parts of the day, es: Partes del día, uk: "Частини доби" }
          rule:
            en: [{ alternatives: [{ term: de la mañana }, { term: de la tarde }, { term: de la noche }] }, " after the time"]
            es: [{ alternatives: [{ term: de la mañana }, { term: de la tarde }, { term: de la noche }] }, " detrás de la hora"]
            uk: [{ alternatives: [{ term: "de la mañana" }, { term: "de la tarde" }, { term: "de la noche" }] }, " після часу"]
          ex: { time: ["las ocho ", { target: de la noche }], value: "20:00" }
          tr: { en: eight in the evening, uk: "восьма вечора" }
        - level: A1
          point: { en: "24 hours", es: "24 horas", uk: "24 години" }
          rule:
            en: "speech uses 12 hours; timetables use 24"
            es: "al hablar se usan 12 horas; los horarios usan 24"
            uk: "у мовленні — 12 годин, у розкладах — 24"
          ex: { mapping: [{ time: "18:30", value: "18:30" }, { target: { time: las dieciocho treinta, value: "18:30" } }] }
        - level: A0
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["the hour always takes ", { term: la }, " or ", { term: las }]
            es: ["la hora siempre lleva ", { term: la }, " o ", { term: las }]
            uk: ["година завжди вживається з ", { term: "la" }, " або ", { term: "las" }]
          ex: ["Son ", { target: las }, " tres."]
          tr: { en: "It's three o'clock.", uk: "Третя година." }

sections:
  - title: { en: The hours, es: Las horas, uk: "Години" }
    role: own
    content:
      - type: inventory
        set: times
        columns:
          - { key: time, label: { en: Time, es: Hora, uk: "Час" } }
          - { key: said, label: { en: Said, es: Se dice, uk: "Усно" } }
        rows:
          - { level: A0, value: "01:00", time: "1:00", said: [{ target: es la }, " una"], tr: { en: "it's one o'clock", uk: "перша година" } }
          - { level: A0, value: "02:00", time: "2:00", said: [{ target: son las }, " dos"], tr: { en: "it's two o'clock", uk: "друга година" } }
          - { level: A0, value: "07:00", time: "7:00", said: [{ target: son las }, " siete"], tr: { en: "it's seven o'clock", uk: "сьома година" } }
          - { level: A0, value: "12:00", time: "12:00", said: [{ target: son las }, " doce"], tr: { en: "it's twelve o'clock", uk: "дванадцята година" } }
          - { level: A0, value: "05:00", time: "5:00", said: ["son las cinco ", { target: en punto }], tr: { en: "it's five o'clock sharp", uk: "рівно п’ята" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Ask the time with ", { term: ¿Qué hora es? }, ":"]
              es: ["La hora se pregunta con ", { term: ¿Qué hora es? }, ":"]
              uk: ["Котра година, запитують так: ", { term: "¿Qué hora es?" }, ":"]
            ex: { exchange: ["¿Qué hora es?", [{ target: Son las }, " ", { time: siete, value: "07:00" }, "."]] }
            tr: { en: { exchange: [What time is it?, "It's seven o'clock."] }, uk: { exchange: ["Котра година?", "Сьома година."] } }
          - type: rule
            level: A0
            text:
              en: ["One o'clock is singular, ", { term: es la una }, "; every other hour is plural, ", { term: son las }, "."]
              es: ["La una va en singular, ", { term: es la una }, "; las demás horas, en plural, ", { term: son las }, "."]
              uk: ["Перша година — в однині, ", { term: "es la una" }, "; усі інші — у множині, ", { term: "son las" }, "."]
          - type: rule
            level: A0
            text:
              en: ["The hour takes ", { term: la }, " or ", { term: las }, " because it counts ", { term: horas }, ", a feminine word."]
              es: ["La hora lleva ", { term: la }, " o ", { term: las }, " porque cuenta ", { term: horas }, ", una palabra femenina."]
              uk: ["Година вживається з ", { term: "la" }, " або ", { term: "las" }, ", бо лічить ", { term: "horas" }, " — слово жіночого роду."]
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["Mexico and Central America also ask ", { term: ¿Qué horas son? }, "."]
              es: ["En México y Centroamérica también se pregunta ", { term: ¿Qué horas son? }, "."]
              uk: ["У Мексиці та Центральній Америці також запитують ", { term: "¿Qué horas son?" }, "."]

  - title: { en: The minutes, es: Los minutos, uk: "Хвилини" }
    role: own
    content:
      - type: inventory
        set: times
        columns:
          - { key: time, label: { en: Time, es: Hora, uk: "Час" } }
          - { key: said, label: { en: Said, es: Se dice, uk: "Усно" } }
        rows:
          - { level: A0, value: "03:05", time: "3:05", said: ["las tres ", { target: y }, " cinco"], tr: { en: five past three, uk: "п’ять хвилин по третій" } }
          - { level: A0, value: "03:15", time: "3:15", said: ["las tres ", { target: y cuarto }], tr: { en: quarter past three, uk: "чверть на четверту" } }
          - { level: A0, value: "03:20", time: "3:20", said: ["las tres ", { target: y }, " veinte"], tr: { en: twenty past three, uk: "двадцять хвилин по третій" } }
          - { level: A0, value: "03:30", time: "3:30", said: ["las tres ", { target: y media }], tr: { en: half past three, uk: "пів на четверту" } }
          - { level: A1, value: "03:40", time: "3:40", said: ["las cuatro ", { target: menos }, " veinte"], tr: { en: twenty to four, uk: "за двадцять четверта" } }
          - { level: A1, value: "03:45", time: "3:45", said: ["las cuatro ", { target: menos cuarto }], tr: { en: quarter to four, uk: "за чверть четверта" } }
          - { level: A1, value: "03:55", time: "3:55", said: ["las cuatro ", { target: menos }, " cinco"], tr: { en: five to four, uk: "за п’ять четверта" } }
          - { level: A1, variety: es-419, value: "03:45", time: "3:45", said: [{ target: un cuarto para }, " las cuatro"], tr: { en: quarter to four, uk: "за чверть четверта" } }
          - { level: A1, variety: es-419, value: "03:50", time: "3:50", said: ["diez ", { target: para }, " las cuatro"], tr: { en: ten to four, uk: "за десять четверта" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["From 1 to 30 minutes, ", { term: y }, " and the minutes follow the hour."]
              es: ["De 1 a 30 minutos, ", { term: y }, " y los minutos van detrás de la hora."]
              uk: ["Від 1 до 30 хвилин ", { term: "y" }, " і хвилини йдуть після години."]
          - type: rule
            level: A1
            text:
              en: ["From 31 to 59, ", { term: menos }, " takes the minutes left away from the next hour."]
              es: ["De 31 a 59, ", { term: menos }, " resta los minutos que faltan a la hora siguiente."]
              uk: ["Від 31 до 59 ", { term: "menos" }, " віднімає від наступної години хвилини, що залишилися."]
          - type: rule
            level: A1
            variety: es-419
            text:
              en: ["Latin America also says the minutes left, ", { term: para }, " and the next hour:"]
              es: ["En Latinoamérica también se dicen los minutos que faltan, ", { term: para }, " y la hora siguiente:"]
              uk: ["У Латинській Америці також кажуть: хвилини, що залишилися, ", { term: "para" }, " і наступна година:"]
            ex: [{ target: Faltan }, " diez ", { target: para }, " las cuatro."]
            tr: { en: "It's ten to four.", uk: "За десять четверта." }

  - title: { en: "When: a las", es: "Cuándo: a las", uk: "Коли: a las" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: a la una }, " and ", { term: a las }, " with the time say when something happens:"]
              es: [{ term: a la una }, " y ", { term: a las }, " con la hora dicen cuándo pasa algo:"]
              uk: [{ term: "a la una" }, " і ", { term: "a las" }, " з часом кажуть, коли щось відбувається:"]
            ex: { examples: [["La clase empieza ", { target: a las }, " nueve."], ["Comemos ", { target: a la }, " una."]] }
            tr: { en: { examples: [The class starts at nine., We have lunch at one.] }, uk: { examples: ["Заняття починається о дев’ятій.", "Ми обідаємо о першій."] } }
          - type: rule
            level: A1
            text:
              en: ["Ask with ", { term: ["¿A qué hora ", { gap: true }, "?"] }, ":"]
              es: ["Se pregunta con ", { term: ["¿A qué hora ", { gap: true }, "?"] }, ":"]
              uk: ["Запитують так: ", { term: ["¿A qué hora ", { gap: true }, "?"] }, ":"]
            ex: { exchange: ["¿A qué hora abre el banco?", [{ target: A las }, " ocho y media."]] }
            tr: { en: { exchange: [What time does the bank open?, At half past eight.] }, uk: { exchange: ["О котрій відкривається банк?", "О пів на дев’яту."] } }
          - type: rule
            level: A1
            text:
              en: [{ term: de }, " and ", { term: a }, " give the start and the end of a span:"]
              es: [{ term: de }, " y ", { term: a }, " dan el principio y el final de un tiempo:"]
              uk: [{ term: "de" }, " і ", { term: "a" }, " позначають початок і кінець проміжку часу:"]
            ex: ["Trabajo ", { target: de }, " nueve ", { target: a }, " cinco."]
            tr: { en: I work from nine to five., uk: "Я працюю з дев’ятої до п’ятої." }

  - title: { en: Parts of the day, es: Las partes del día, uk: "Частини доби" }
    role: own
    content:
      - type: usage
        columns:
          - { key: phrase, label: { en: Phrase, es: Expresión, uk: "Вираз" } }
          - { key: use, label: { en: Use, es: Uso, uk: "Вживання" } }
          - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
        rows:
          - { level: A1, phrase: de la mañana, use: { en: from midnight to midday, es: desde medianoche hasta el mediodía, uk: "від півночі до полудня" }, ex: { time: ["las ocho ", { target: de la mañana }], value: "08:00" }, tr: { en: eight in the morning, uk: "восьма ранку" } }
          - { level: A1, phrase: de la tarde, use: { en: from midday until dark, es: desde el mediodía hasta que anochece, uk: "від полудня до смеркання" }, ex: { time: ["las cinco ", { target: de la tarde }], value: "17:00" }, tr: { en: five in the afternoon, uk: "п’ята дня" } }
          - { level: A1, phrase: de la noche, use: { en: from dark to midnight, es: desde que anochece hasta medianoche, uk: "від смеркання до півночі" }, ex: { time: ["las diez ", { target: de la noche }], value: "22:00" }, tr: { en: ten at night, uk: "десята вечора" } }
          - { level: A1, phrase: de la madrugada, use: { en: ["the early hours, from midnight to dawn; ", { term: de la mañana }, " also fits"], es: ["las primeras horas, desde medianoche hasta el amanecer; también vale ", { term: de la mañana }], uk: ["ранні години, від півночі до світанку; підходить і ", { term: "de la mañana" }] }, ex: { time: ["las tres ", { target: de la madrugada }], value: "03:00" }, tr: { en: three in the morning, uk: "третя ночі" } }
          - { level: A1, phrase: el mediodía, use: { en: twelve noon, es: las doce del día, uk: "дванадцята дня" }, ex: { target: al mediodía }, tr: { en: at midday, uk: "опівдні" } }
          - { level: A1, phrase: la medianoche, use: { en: twelve at night, es: las doce de la noche, uk: "дванадцята ночі" }, ex: { target: a medianoche }, tr: { en: at midnight, uk: "опівночі" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Without a clock time, ", { term: por la mañana }, ", ", { term: por la tarde }, " and ", { term: por la noche }, " say when:"]
              es: ["Sin hora exacta, ", { term: por la mañana }, ", ", { term: por la tarde }, " y ", { term: por la noche }, " dicen cuándo:"]
              uk: ["Без точного часу кажуть, коли, за допомогою ", { term: "por la mañana" }, ", ", { term: "por la tarde" }, " і ", { term: "por la noche" }, ":"]
            ex: ["Estudio ", { target: por la tarde }, "."]
            tr: { en: I study in the afternoon., uk: "Я навчаюся вдень." }
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["Latin America also says ", { term: en la mañana }, ", ", { term: en la tarde }, " and ", { term: en la noche }, ":"]
              es: ["En Latinoamérica también se dice ", { term: en la mañana }, ", ", { term: en la tarde }, " y ", { term: en la noche }, ":"]
              uk: ["У Латинській Америці також кажуть ", { term: "en la mañana" }, ", ", { term: "en la tarde" }, " і ", { term: "en la noche" }, ":"]
            ex: ["Estudio ", { target: en la tarde }, "."]
            tr: { en: I study in the afternoon., uk: "Я навчаюся вдень." }
          - type: rule
            level: A1
            text:
              en: "In speech, the 12-hour clock is usual; timetables use 24 hours:"
              es: "Al hablar se usa el reloj de 12 horas; los horarios usan 24 horas:"
              uk: "У мовленні звичний 12-годинний формат; у розкладах — 24-годинний:"
            ex: { mapping: [{ time: "18:30", value: "18:30" }, { target: { time: las dieciocho treinta, value: "18:30" } }] }

  - title: { en: Typical errors, es: Errores frecuentes, uk: "Типові помилки" }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Es las tres., right: [{ target: Son }, " las tres."], rule: { en: ["from two on, the hour takes ", { term: son }], es: ["desde las dos, la hora lleva ", { term: son }], uk: ["починаючи з другої, година вживається з ", { term: "son" }] } }
          - { level: A0, wrong: Son la una., right: [{ target: Es }, " la una."], rule: { en: ["one o'clock takes ", { term: es }], es: ["la una lleva ", { term: es }], uk: ["перша година вживається з ", { term: "es" }] } }
          - { level: A0, wrong: Son tres., right: ["Son ", { target: las }, " tres."], rule: { en: ["the hour takes ", { term: las }], es: ["la hora lleva ", { term: las }], uk: ["година вживається з ", { term: "las" }] } }
          - { level: A0, wrong: Son las tres y medio., right: ["Son las tres y ", { target: media }, "."], rule: { en: [{ term: media }, " agrees with ", { term: hora }, ", a feminine word"], es: [{ term: media }, " concuerda con ", { term: hora }, ", una palabra femenina"], uk: [{ term: "media" }, " узгоджується з ", { term: "hora" }, " — словом жіночого роду"] } }
          - { level: A0, speakers: [en], wrong: ¿Qué tiempo es?, right: ["¿Qué ", { target: hora }, " es?"], rule: { en: [{ term: tiempo }, " is the weather or time in general; clock time is ", { term: hora }] } }
          - { level: A1, wrong: La clase es en las nueve., right: ["La clase es ", { target: a las }, " nueve."], rule: { en: ["a clock time takes ", { term: a las }], es: ["la hora del reloj lleva ", { term: a las }], uk: ["точний час вживається з ", { term: "a las" }] } }
