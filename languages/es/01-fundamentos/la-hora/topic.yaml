              fr: ["Une heure se met au singulier, ", { term: es la una }, " ; les autres heures, au pluriel, ", { term: son las }, "."]
              de: ["Ein Uhr steht im Singular, ", { term: es la una }, "; alle anderen Stunden im Plural, ", { term: son las }, "."]
              it: ["L'una è al singolare, ", { term: es la una }, "; le altre ore sono al plurale, ", { term: son las }, "."]
              pl: ["Pierwsza godzina jest w liczbie pojedynczej, ", { term: es la una }, "; pozostałe — w mnogiej, ", { term: son las }, "."]
              tr: ["Bir saat tekildir, ", { term: es la una }, "; diğer saatler çoğuldur, ", { term: son las }, "."]
              id: ["Jam satu berbentuk tunggal, ", { term: es la una }, "; jam lainnya berbentuk jamak, ", { term: son las }, "."]
              vi: ["Một giờ dùng số ít, ", { term: es la una }, "; các giờ khác dùng số nhiều, ", { term: son las }, "."]
          - type: rule
            level: A0
            text:
              en: ["The hour takes ", { term: la }, " or ", { term: las }, " because it counts ", { term: horas }, ", a feminine word."]
              es: ["La hora lleva ", { term: la }, " o ", { term: las }, " porque cuenta ", { term: horas }, ", una palabra femenina."]
              uk: ["Година вживається з ", { term: "la" }, " або ", { term: "las" }, ", бо мається на увазі ", { term: "horas" }, " — слово жіночого роду."]
              pt: ["A hora leva ", { term: la }, " ou ", { term: las }, " porque se contam ", { term: horas }, ", uma palavra feminina."]
              fr: ["L’heure prend ", { term: la }, " ou ", { term: las }, " parce qu’on compte des ", { term: horas }, ", mot féminin."]
              de: ["Die Uhrzeit steht mit ", { term: la }, " oder ", { term: las }, ", weil man ", { term: horas }, " zählt, ein feminines Wort."]
              it: ["L'ora vuole ", { term: la }, " o ", { term: las }, " perché si contano ", { term: horas }, ", una parola femminile."]
              pl: ["Przy godzinie stoi ", { term: la }, " lub ", { term: las }, ", bo liczy się ", { term: horas }, " — rzeczownik rodzaju żeńskiego."]
              tr: ["Saatte ", { term: la }, " veya ", { term: las }, " kullanılır, çünkü sayılan şey dişil bir sözcük olan ", { term: horas }, "."]
              id: ["Jam memakai ", { term: la }, " atau ", { term: las }, " karena yang dihitung adalah ", { term: horas }, ", kata berjenis feminin."]
              vi: ["Giờ đi với ", { term: la }, " hoặc ", { term: las }, " vì người ta đếm ", { term: horas }, ", một danh từ giống cái."]
          - type: note
            level: A1
            variety: es-419
            text:
              en: ["Mexico and Central America also ask ", { term: ¿Qué horas son? }, "."]
              es: ["En México y Centroamérica también se pregunta ", { term: ¿Qué horas son? }, "."]
              uk: ["У Мексиці та Центральній Америці також запитують ", { term: "¿Qué horas son?" }, "."]
              pt: ["No México e na América Central também se pergunta ", { term: ¿Qué horas son? }, "."]
              fr: ["Au Mexique et en Amérique centrale, on demande aussi ", { term: ¿Qué horas son? }, "."]
              de: ["In Mexiko und Mittelamerika fragt man auch ", { term: ¿Qué horas son? }, "."]
              it: ["In Messico e in America Centrale si chiede anche ", { term: ¿Qué horas son? }, "."]
