            contour: { es: "la voz queda alta al final y sugiere más de lo que dice", en: "the voice stays high at the end and suggests more than it says", uk: "голос лишається високим наприкінці й натякає на більше, ніж говориться", pt: "a voz fica alta no final e sugere mais do que diz", fr: "la voix reste haute à la fin et suggère plus qu’elle ne dit", de: "die Stimme bleibt am Ende hoch und deutet mehr an, als sie sagt", it: "la voce resta alta alla fine e suggerisce più di quel che dice", pl: "głos pozostaje wysoko na końcu i sugeruje więcej, niż mówi", tr: "ses sonda yüksek kalır ve söylenenden fazlasını sezdirir", id: "suara tetap tinggi di akhir dan menyiratkan lebih banyak daripada yang dikatakan", vi: "giọng giữ cao ở cuối câu và ngụ ý nhiều hơn điều được nói ra" }
