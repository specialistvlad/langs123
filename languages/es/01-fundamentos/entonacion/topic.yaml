            contour: { es: "la voz baja al final con una cadencia normal", en: "the voice falls at the end with a normal cadence", uk: "голос знижується наприкінці зі звичайною каденцією", pt: "a voz desce no final com uma cadência normal", fr: "la voix descend à la fin avec une cadence normale", de: "die Stimme fällt am Ende mit einer normalen Kadenz", it: "la voce scende alla fine con una cadenza normale", pl: "głos opada na końcu w zwykłej kadencji", tr: "ses sonda normal bir kadansla alçalır", id: "suara turun di akhir dengan kadens biasa", vi: "giọng hạ xuống ở cuối câu theo kiểu hạ giọng thông thường" }
