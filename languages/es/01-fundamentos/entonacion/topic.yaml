title: { es: La entonación, en: Intonation, uk: "Інтонація", pt: "A entonação", fr: "L’intonation", de: "Die Intonation", it: "L'intonazione", pl: "Intonacja", tr: "Tonlama", id: "Intonasi", vi: "Ngữ điệu" }
summary:
  lead:
    es: "La entonación marca con la subida y la bajada de la voz el final de la frase, la pregunta y el énfasis."
    en: "Intonation uses the rise and fall of the voice to mark the end of a sentence, a question and emphasis."
    uk: "Інтонація підвищенням і зниженням голосу позначає кінець фрази, питання та підкреслення."
    pt: "A entonação marca, com a subida e a descida da voz, o fim da frase, a pergunta e a ênfase."
    fr: "L’intonation marque, par la montée et la descente de la voix, la fin de la phrase, la question et la mise en relief."
    de: "Die Intonation zeigt durch das Steigen und Fallen der Stimme das Satzende, die Frage und die Hervorhebung an."
    it: "L'intonazione segna, con la salita e la discesa della voce, la fine della frase, la domanda e l'enfasi."
    pl: "Intonacja za pomocą podnoszenia i opadania głosu zaznacza koniec zdania, pytanie i wyróżnienie."
    tr: "Tonlama, sesin yükselip alçalmasıyla cümlenin sonunu, soruyu ve vurgulamayı gösterir."
    id: "Intonasi menandai akhir kalimat, pertanyaan, dan penekanan lewat naik turunnya suara."
    vi: "Ngữ điệu dùng việc lên giọng và xuống giọng để đánh dấu cuối câu, câu hỏi và sự nhấn mạnh."
  rule:
    es: "La voz baja al final de una afirmación cerrada y sube al final de una pregunta de sí o no:"
    en: "The voice falls at the end of a closed statement and rises at the end of a yes-no question:"
    uk: "Голос знижується в кінці закінченого розповідного речення й підвищується в кінці загального питання:"
    pt: "A voz desce no final de uma afirmação concluída e sobe no final de uma pergunta de sim ou não:"
    fr: "La voix descend à la fin d’une phrase affirmative achevée et monte à la fin d’une question fermée :"
    de: "Die Stimme fällt am Ende einer abgeschlossenen Aussage und steigt am Ende einer Ja-Nein-Frage:"
    it: "La voce scende alla fine di un'affermazione conclusa e sale alla fine di una domanda sì/no:"
    pl: "Głos opada na końcu zamkniętego zdania oznajmującego i podnosi się na końcu pytania rozstrzygnięcia:"
    tr: "Ses, tamamlanmış olumlu cümlenin sonunda alçalır, evet-hayır sorusunun sonunda yükselir:"
    id: "Suara turun di akhir kalimat pernyataan yang sudah selesai dan naik di akhir pertanyaan ya atau tidak:"
    vi: "Giọng hạ xuống ở cuối câu khẳng định đã trọn ý và lên cao ở cuối câu hỏi có/không:"
  ex: { examples: [["Vienes ", { target: mañana }, ". ", { intonation: fall }], ["¿Vienes ", { target: mañana }, "? ", { intonation: rise }]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { es: Punto, en: "Point", uk: "Пункт", pt: "Ponto", fr: "Point", de: "Aspekt", it: "Punto", pl: "Zagadnienie", tr: "Konu", id: "Poin", vi: "Điểm ngữ pháp" } }
        - { key: rule, label: { es: Regla, en: "Rule", uk: "Правило", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
        - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
      rows:
        - level: B2
          point: { es: Cadencia, en: "Cadence", uk: "Каденція", pt: "Cadência", fr: "Cadence", de: "Kadenz", it: "Cadenza", pl: "Kadencja", tr: "Kadans", id: "Kadens", vi: "Hạ giọng hẳn" }
          rule: { es: "la voz baja al final: el enunciado queda cerrado", en: "the voice falls at the end: the sentence is complete", uk: "голос знижується наприкінці: речення завершене", pt: "a voz desce no final: a frase fica concluída", fr: "la voix descend à la fin : la phrase est achevée", de: "die Stimme fällt am Ende: der Satz ist abgeschlossen", it: "la voce scende alla fine: la frase è conclusa", pl: "głos opada na końcu: zdanie jest zamknięte", tr: "ses sonda alçalır: cümle tamamlanmış olur", id: "suara turun di akhir: kalimat selesai", vi: "cuối câu giọng hạ xuống: câu đã trọn ý" }
          ex: ["Me voy a ", { target: casa }, ". ", { intonation: fall }]
          tr: { en: "I'm going home.", uk: "Я йду додому.", pt: "Estou indo para casa.", fr: "Je rentre chez moi.", de: "Ich gehe nach Hause.", it: "Vado a casa.", pl: "Idę do domu.", tr: "Eve gidiyorum.", id: "Saya pulang ke rumah.", vi: "Tôi về nhà." }
        - level: B2
          point: { es: Anticadencia, en: "Anticadence", uk: "Антикаденція", pt: "Anticadência", fr: "Anticadence", de: "Antikadenz", it: "Anticadenza", pl: "Antykadencja", tr: "Antikadans", id: "Antikadens", vi: "Lên giọng hẳn" }
          rule: { es: "la voz sube al final: pregunta de sí o no", en: "the voice rises at the end: a yes-no question", uk: "голос підвищується наприкінці: загальне питання", pt: "a voz sobe no final: pergunta de sim ou não", fr: "la voix monte à la fin : question fermée", de: "die Stimme steigt am Ende: Ja-Nein-Frage", it: "la voce sale alla fine: domanda sì/no", pl: "głos podnosi się na końcu: pytanie rozstrzygnięcia", tr: "ses sonda yükselir: evet-hayır sorusu", id: "suara naik di akhir: pertanyaan ya atau tidak", vi: "cuối câu giọng lên: câu hỏi có/không" }
          ex: ["¿Vienes ", { target: mañana }, "? ", { intonation: rise }]
          tr: { en: "Are you coming tomorrow?", uk: "Ти прийдеш завтра?", pt: "Você vem amanhã?", fr: "Tu viens demain ?", de: "Kommst du morgen?", it: "Vieni domani?", pl: "Przyjdziesz jutro?", tr: "Yarın geliyor musun?", id: "Apakah kamu datang besok?", vi: "Ngày mai bạn có đến không?" }
        - level: B2
          point: { es: Pausa, en: "Pause", uk: "Пауза", pt: "Pausa", fr: "Pause", de: "Pause", it: "Pausa", pl: "Pauza", tr: "Duraklama", id: "Jeda", vi: "Chỗ ngắt" }
          rule: { es: "separa la subordinada de la oración principal", en: "separates the subordinate clause from the main clause", uk: "відокремлює підрядне речення від головного", pt: "separa a oração subordinada da oração principal", fr: "sépare la subordonnée de la proposition principale", de: "trennt den Nebensatz vom Hauptsatz", it: "separa la subordinata dalla proposizione principale", pl: "oddziela zdanie podrzędne od zdania głównego", tr: "yan cümleyi ana cümleden ayırır", id: "memisahkan anak kalimat dari klausa utama", vi: "tách mệnh đề phụ khỏi mệnh đề chính" }
          ex: ["Si llueve ", { target: "//" }, " nos quedamos en casa."]
          tr: { en: "If it rains, we stay at home.", uk: "Якщо піде дощ, ми залишимось удома.", pt: "Se chover, ficamos em casa.", fr: "S’il pleut, nous restons à la maison.", de: "Wenn es regnet, bleiben wir zu Hause.", it: "Se piove, restiamo a casa.", pl: "Jeśli będzie padać, zostajemy w domu.", tr: "Yağmur yağarsa evde kalırız.", id: "Kalau hujan, kami tinggal di rumah.", vi: "Nếu trời mưa, chúng tôi ở nhà." }
        - level: B2
          point: { es: Pregunta alternativa, en: "Alternative question", uk: "Альтернативне питання", pt: "Pergunta alternativa", fr: "Question alternative", de: "Alternativfrage", it: "Domanda alternativa", pl: "Pytanie alternatywne", tr: "Seçenekli soru", id: "Pertanyaan pilihan", vi: "Câu hỏi lựa chọn" }
          rule: { es: "la voz sube en el primer miembro y baja en el último", en: "the voice rises on the first part and falls on the last", uk: "голос підвищується на першій частині й знижується на останній", pt: "a voz sobe no primeiro membro e desce no último", fr: "la voix monte sur le premier terme et descend sur le dernier", de: "die Stimme steigt beim ersten Glied und fällt beim letzten", it: "la voce sale sul primo membro e scende sull'ultimo", pl: "głos podnosi się na pierwszym członie i opada na ostatnim", tr: "ses ilk bölümde yükselir, son bölümde alçalır", id: "suara naik pada bagian pertama dan turun pada bagian terakhir", vi: "giọng lên ở vế đầu và xuống ở vế cuối" }
          ex: ["¿Vamos en ", { target: tren }, " ", { intonation: rise }, " o en ", { target: autobús }, "? ", { intonation: fall }]
          tr: { en: "Shall we go by train or by bus?", uk: "Поїдемо потягом чи автобусом?", pt: "Vamos de trem ou de ônibus?", fr: "On y va en train ou en bus ?", de: "Fahren wir mit dem Zug oder mit dem Bus?", it: "Andiamo in treno o in autobus?", pl: "Jedziemy pociągiem czy autobusem?", tr: "Trenle mi gidelim, otobüsle mi?", id: "Kita naik kereta atau bus?", vi: "Chúng ta đi bằng tàu hay bằng xe buýt?" }
        - level: B2
          point: { es: Enumeración completa, en: "Complete list", uk: "Повний перелік", pt: "Enumeração completa", fr: "Énumération complète", de: "Vollständige Aufzählung", it: "Elenco completo", pl: "Pełne wyliczenie", tr: "Tam sıralama", id: "Daftar lengkap", vi: "Liệt kê đầy đủ" }
          rule: { es: "la voz sube un poco en cada elemento y baja en el último", en: "the voice rises a little on each item and falls on the last", uk: "голос трохи підвищується на кожному елементі й знижується на останньому", pt: "a voz sobe um pouco em cada elemento e desce no último", fr: "la voix monte un peu sur chaque élément et descend sur le dernier", de: "die Stimme steigt bei jedem Glied leicht an und fällt beim letzten", it: "la voce sale un po' su ogni elemento e scende sull'ultimo", pl: "głos lekko podnosi się na każdym elemencie i opada na ostatnim", tr: "ses her öğede biraz yükselir, sonuncuda alçalır", id: "suara naik sedikit pada setiap unsur dan turun pada unsur terakhir", vi: "giọng lên nhẹ ở mỗi thành phần và xuống ở thành phần cuối" }
          ex: ["Compré ", { target: pan }, ", ", { intonation: rise }, " ", { target: leche }, " ", { intonation: rise }, " y ", { target: queso }, ". ", { intonation: fall }]
          tr: { en: "I bought bread, milk and cheese.", uk: "Я купив хліб, молоко й сир.", pt: "Comprei pão, leite e queijo.", fr: "J’ai acheté du pain, du lait et du fromage.", de: "Ich habe Brot, Milch und Käse gekauft.", it: "Ho comprato pane, latte e formaggio.", pl: "Kupiłem chleb, mleko i ser.", tr: "Ekmek, süt ve peynir aldım.", id: "Saya membeli roti, susu, dan keju.", vi: "Tôi đã mua bánh mì, sữa và phô mai." }
        - level: B2
          point: { es: Palabra interrogativa, en: "Question word", uk: "Питальне слово", pt: "Interrogativo", fr: "Mot interrogatif", de: "Fragewort", it: "Parola interrogativa", pl: "Zaimek pytajny", tr: "Soru sözcüğü", id: "Kata tanya", vi: "Từ để hỏi" }
          rule: { es: "el tono es alto en esa palabra y la voz baja al final", en: "the pitch is high on that word and the voice falls at the end", uk: "тон на цьому слові високий, а наприкінці голос знижується", pt: "o tom é alto nessa palavra e a voz desce no final", fr: "le ton est haut sur ce mot et la voix descend à la fin", de: "die Tonhöhe ist bei diesem Wort hoch und die Stimme fällt am Ende", it: "il tono è alto su quella parola e la voce scende alla fine", pl: "ton jest wysoki na tym słowie, a głos opada na końcu", tr: "o sözcükte ses tonu yüksektir, sonda ses alçalır", id: "nada tinggi pada kata itu dan suara turun di akhir", vi: "âm vực cao ở từ đó và giọng xuống ở cuối câu" }
          ex: ["¿", { target: Dónde }, " vives? ", { intonation: fall }]
          tr: { en: "Where do you live?", uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove vivi?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Di mana kamu tinggal?", vi: "Bạn sống ở đâu?" }
        - level: C1
          point: { es: Ambigüedad, en: "Ambiguity", uk: "Двозначність", pt: "Ambiguidade", fr: "Ambiguïté", de: "Mehrdeutigkeit", it: "Ambiguità", pl: "Dwuznaczność", tr: "Belirsizlik", id: "Ambiguitas", vi: "Tính mơ hồ" }
          rule: { es: "la pausa cambia el sentido de la frase", en: "the pause changes the meaning of the sentence", uk: "пауза змінює значення фрази", pt: "a pausa muda o sentido da frase", fr: "la pause change le sens de la phrase", de: "die Pause verändert die Bedeutung des Satzes", it: "la pausa cambia il senso della frase", pl: "pauza zmienia znaczenie zdania", tr: "duraklama cümlenin anlamını değiştirir", id: "jeda mengubah makna kalimat", vi: "chỗ ngắt làm đổi nghĩa của câu" }
          ex: { examples: ["Los alumnos que estudian aprobarán.", ["Los alumnos ", { target: "//" }, " que estudian ", { target: "//" }, " aprobarán."]] }
          tr: { en: { examples: ["The students who study will pass.", "The students, who study, will pass."] }, uk: { examples: ["Учні, які вчаться, складуть іспит.", "Учні — а вони вчаться — складуть іспит."] }, pt: { examples: ["Os alunos que estudam serão aprovados.", "Os alunos, que estudam, serão aprovados."] }, fr: { examples: ["Les élèves qui étudient réussiront.", "Les élèves, qui étudient, réussiront."] }, de: { examples: ["Die Schüler, die lernen, werden bestehen.", "Die Schüler, die ja alle lernen, werden bestehen."] }, it: { examples: ["Gli alunni che studiano saranno promossi.", "Gli alunni, che studiano, saranno promossi."] }, pl: { examples: ["Uczniowie, którzy się uczą, zdadzą egzamin.", "Uczniowie, a uczą się wszyscy, zdadzą egzamin."] }, tr: { examples: ["Çalışan öğrenciler geçecek.", "Öğrenciler —hepsi çalışıyor— geçecek."] }, id: { examples: ["Siswa yang belajar akan lulus.", "Siswa, yang belajar, akan lulus."] }, vi: { examples: ["Những học sinh nào học thì sẽ đỗ.", "Học sinh — mà em nào cũng học — sẽ đỗ."] } }
        - level: C1
          point: { es: Pregunta repetidora, en: "Echo question", uk: "Питання-повтор", pt: "Pergunta em eco", fr: "Question en écho", de: "Echofrage", it: "Domanda eco", pl: "Pytanie powtarzające", tr: "Yineleme sorusu", id: "Pertanyaan ulang", vi: "Câu hỏi lặp lại" }
          rule: { es: "repite lo dicho y la voz sube al final", en: "repeats what was said and the voice rises at the end", uk: "повторює сказане, і голос підвищується наприкінці", pt: "repete o que foi dito e a voz sobe no final", fr: "reprend ce qui a été dit et la voix monte à la fin", de: "wiederholt das Gesagte und die Stimme steigt am Ende", it: "ripete quanto detto e la voce sale alla fine", pl: "powtarza to, co padło, a głos podnosi się na końcu", tr: "söyleneni yineler ve ses sonda yükselir", id: "mengulang apa yang dikatakan dan suara naik di akhir", vi: "lặp lại điều vừa nói và giọng lên ở cuối câu" }
          ex: ["¿", { target: Que }, " si tengo hambre? ", { intonation: rise }]
          tr: { en: "Am I hungry?", uk: "Чи я голодний?", pt: "Se eu tenho fome?", fr: "Si j’ai faim ?", de: "Ob ich Hunger habe?", it: "Se ho fame?", pl: "Czy jestem głodny?", tr: "Aç mıyım diye mi soruyorsun?", id: "Apa saya lapar?", vi: "Hỏi tôi có đói không à?" }
        - level: C1
          point: { es: Énfasis, en: "Emphasis", uk: "Підкреслення", pt: "Ênfase", fr: "Mise en relief", de: "Hervorhebung", it: "Enfasi", pl: "Wyróżnienie", tr: "Vurgulama", id: "Penekanan", vi: "Nhấn mạnh" }
          rule: { es: "el acento más fuerte cae en la palabra que se destaca", en: "the strongest stress falls on the word being highlighted", uk: "найсильніший наголос падає на слово, яке виділяють", pt: "o acento mais forte cai na palavra destacada", fr: "l’accent le plus fort tombe sur le mot mis en relief", de: "die stärkste Betonung liegt auf dem hervorgehobenen Wort", it: "l'accento più forte cade sulla parola messa in risalto", pl: "najsilniejszy akcent pada na wyróżniony wyraz", tr: "en güçlü vurgu öne çıkarılan sözcüğün üzerine düşer", id: "tekanan terkuat jatuh pada kata yang ditonjolkan", vi: "trọng âm mạnh nhất rơi vào từ được nhấn mạnh" }
          ex: ["Fui ", { target: { stress: yo } }, " quien lo rompió."]
          tr: { en: "I was the one who broke it.", uk: "Це я його розбив.", pt: "Fui eu quem quebrou.", fr: "C’est moi qui l’ai cassé.", de: "Ich war es, der es kaputt gemacht hat.", it: "Sono stato io a romperlo.", pl: "To ja to zepsułem.", tr: "Onu kıran bendim.", id: "Sayalah yang memecahkannya.", vi: "Chính tôi đã làm vỡ nó." }
        - level: C2
          point: { es: Emoción fuerte, en: "Strong emotion", uk: "Сильні емоції", pt: "Emoção forte", fr: "Forte émotion", de: "Starke Emotion", it: "Emozione forte", pl: "Silne emocje", tr: "Güçlü duygu", id: "Emosi kuat", vi: "Cảm xúc mạnh" }
          rule: { es: "inflexiones circunflejas: la voz sube y baja en un mismo grupo", en: "circumflex inflections: the voice rises and falls within one group", uk: "хвилястий рух: голос підвищується й знижується в межах однієї групи", pt: "inflexões circunflexas: a voz sobe e desce dentro do mesmo grupo", fr: "inflexions circonflexes : la voix monte et descend dans un même groupe", de: "Zirkumflex-Bewegungen: die Stimme steigt und fällt innerhalb einer Gruppe", it: "inflessioni circonflesse: la voce sale e scende nello stesso gruppo", pl: "ruchy cyrkumfleksowe: głos podnosi się i opada w obrębie jednej grupy", tr: "dalgalı hareket: ses aynı grup içinde yükselir ve alçalır", id: "infleksi sirkumfleks: suara naik dan turun dalam satu kelompok", vi: "ngữ điệu uốn lượn: giọng lên rồi xuống trong cùng một nhóm" }
          ex: ["Con decirte ", { target: "//" }, " que llevo una hora esperando el autobús."]
          tr: { en: "Let me just tell you that I've been waiting for the bus for an hour.", uk: "Скажу тобі лише, що я вже годину чекаю автобуса.", pt: "Só te digo que estou esperando o ônibus há uma hora.", fr: "Je te dis seulement que j’attends le bus depuis une heure.", de: "Ich sage dir nur: Ich warte seit einer Stunde auf den Bus.", it: "Ti basti sapere che aspetto l'autobus da un'ora.", pl: "Powiem ci tylko, że czekam na autobus już godzinę.", tr: "Sana şunu söyleyeyim, bir saattir otobüs bekliyorum.", id: "Cukup kukatakan bahwa saya sudah satu jam menunggu bus.", vi: "Chỉ cần nói với bạn là tôi đã đợi xe buýt cả tiếng đồng hồ rồi." }
        - level: C2
          point: { es: Ironía, en: "Irony", uk: "Іронія", pt: "Ironia", fr: "Ironie", de: "Ironie", it: "Ironia", pl: "Ironia", tr: "İroni", id: "Ironi", vi: "Mỉa mai" }
          rule: { es: "el contorno es plano y quita fuerza a la subida de intensidad", en: "the contour is flat and weakens the rise in intensity", uk: "контур плаский і послаблює підвищення інтенсивності", pt: "o contorno é plano e tira força da subida de intensidade", fr: "le contour est plat et atténue la montée d’intensité", de: "die Kontur ist flach und schwächt den Anstieg der Intensität ab", it: "il profilo è piatto e toglie forza all'aumento di intensità", pl: "kontur jest płaski i osłabia wzrost intensywności", tr: "ezgi düzdür ve yoğunluk artışının gücünü azaltır", id: "kontur datar dan melemahkan kenaikan intensitas", vi: "đường nét phẳng và làm giảm lực của việc tăng cường độ" }
          ex: ["¡", { target: Qué bien }, " has dejado la cocina!"]
          tr: { en: "Look how nicely you've left the kitchen!", uk: "Як гарно ти залишив кухню!", pt: "Que lindo você deixou a cozinha!", fr: "Comme tu as bien laissé la cuisine !", de: "Wie schön du die Küche hinterlassen hast!", it: "Hai lasciato la cucina proprio bene!", pl: "Ślicznie zostawiłeś kuchnię!", tr: "Mutfağı ne güzel bırakmışsın!", id: "Bagus sekali kamu meninggalkan dapur!", vi: "Bạn để nhà bếp gọn gàng quá nhỉ!" }
        - level: C2
          point: { es: Ritmo, en: "Rhythm", uk: "Ритм", pt: "Ritmo", fr: "Rythme", de: "Rhythmus", it: "Ritmo", pl: "Rytm", tr: "Ritim", id: "Ritme", vi: "Nhịp điệu" }
          rule: { es: "en refranes y poemas, los acentos caen a intervalos regulares", en: "in proverbs and poems, the stresses fall at regular intervals", uk: "у прислів’ях і віршах наголоси падають через рівні проміжки", pt: "em provérbios e poemas, os acentos caem a intervalos regulares", fr: "dans les proverbes et les poèmes, les accents tombent à intervalles réguliers", de: "in Sprichwörtern und Gedichten fallen die Betonungen in gleichmäßigen Abständen", it: "nei proverbi e nelle poesie gli accenti cadono a intervalli regolari", pl: "w przysłowiach i wierszach akcenty padają w regularnych odstępach", tr: "atasözlerinde ve şiirlerde vurgular düzenli aralıklarla düşer", id: "dalam peribahasa dan puisi, tekanan jatuh pada interval yang teratur", vi: "trong tục ngữ và thơ, các trọng âm rơi đều đặn cách quãng" }
          ex: ["A ", { stress: mal }, " ", { stress: tiem }, "po, ", { stress: bue }, "na ", { stress: ca }, "ra."]
          tr: { en: "Keep a brave face in bad times.", uk: "У лиху годину тримай голову високо.", pt: "Na hora difícil, mantenha o bom humor.", fr: "Dans l’adversité, il faut garder bonne figure.", de: "In schlechten Zeiten Haltung bewahren.", it: "Nelle difficoltà, fai buon viso.", pl: "W trudnych chwilach zachowaj pogodną minę.", tr: "Zor zamanda yüzünü asma.", id: "Di masa sulit, tetaplah tegar.", vi: "Lúc gặp khó khăn, hãy giữ nét mặt vui tươi." }

sections:
  - title: { es: Visión general, en: "Overview", uk: "Огляд", pt: "Visão geral", fr: "Vue d’ensemble", de: "Überblick", it: "Panoramica", pl: "Przegląd", tr: "Genel bakış", id: "Gambaran umum", vi: "Tổng quan" }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: B2
            text: { es: "Las pausas dividen el habla en unidades melódicas, y un tonema cierra cada una:", en: "Pauses divide speech into tone units, and a final tone closes each one:", uk: "Паузи ділять мовлення на інтонаційні групи, і кожну з них завершує кінцевий тон:", pt: "As pausas dividem a fala em grupos entoacionais, e um tom final fecha cada um:", fr: "Les pauses divisent la parole en groupes intonatifs, et un ton final clôt chacun d’eux :", de: "Pausen gliedern das Sprechen in Intonationsgruppen, und ein Schlusston beendet jede davon:", it: "Le pause dividono il parlato in gruppi intonativi, e un tono finale chiude ciascuno:", pl: "Pauzy dzielą mowę na grupy intonacyjne, a każdą z nich zamyka ton końcowy:", tr: "Duraklamalar konuşmayı tonlama birimlerine böler ve her birini bir son ton kapatır:", id: "Jeda membagi tuturan menjadi unit intonasi, dan setiap unit ditutup oleh nada akhir:", vi: "Chỗ ngắt chia lời nói thành các đơn vị ngữ điệu, và mỗi đơn vị kết thúc bằng một ngữ điệu cuối câu:" }
            ex: ["Si quieres ", { intonation: rise }, " // puedes venir. ", { intonation: fall }]
            tr: { en: "If you like, you can come.", uk: "Якщо хочеш, можеш прийти.", pt: "Se quiser, pode vir.", fr: "Si tu veux, tu peux venir.", de: "Wenn du willst, kannst du kommen.", it: "Se vuoi, puoi venire.", pl: "Jeśli chcesz, możesz przyjść.", tr: "İstersen gelebilirsin.", id: "Kalau mau, kamu boleh datang.", vi: "Nếu muốn, bạn có thể đến." }
          - type: note
            level: B2
            text: { es: ["En los ejemplos, // marca una pausa, ", { intonation: rise }, " una subida de la voz y ", { intonation: fall }, " una bajada."], en: ["In the examples, // marks a pause, ", { intonation: rise }, " a rise of the voice and ", { intonation: fall }, " a fall."], uk: ["У прикладах // позначає паузу, ", { intonation: rise }, " — підвищення голосу, а ", { intonation: fall }, " — зниження."], pt: ["Nos exemplos, // marca uma pausa, ", { intonation: rise }, " uma subida da voz e ", { intonation: fall }, " uma descida."], fr: ["Dans les exemples, // marque une pause, ", { intonation: rise }, " une montée de la voix et ", { intonation: fall }, " une descente."], de: ["In den Beispielen markiert // eine Pause, ", { intonation: rise }, " ein Steigen der Stimme und ", { intonation: fall }, " ein Fallen."], it: ["Negli esempi, // segna una pausa, ", { intonation: rise }, " una salita della voce e ", { intonation: fall }, " una discesa."], pl: ["W przykładach // oznacza pauzę, ", { intonation: rise }, " — podniesienie głosu, a ", { intonation: fall }, " — jego opadnięcie."], tr: ["Örneklerde // bir duraklamayı, ", { intonation: rise }, " sesin yükselmesini, ", { intonation: fall }, " ise alçalmasını gösterir."], id: ["Dalam contoh, // menandai jeda, ", { intonation: rise }, " menandai suara naik, dan ", { intonation: fall }, " suara turun."], vi: ["Trong các ví dụ, // đánh dấu chỗ ngắt, ", { intonation: rise }, " là giọng lên và ", { intonation: fall }, " là giọng xuống."] }
          - type: note
            level: B2
            variety: es-ES
            text: { es: "En España la voz fluctúa poco y las inflexiones son más equilibradas.", en: "In Spain the voice varies little and the inflections are more balanced.", uk: "В Іспанії голос змінюється мало, а інфлексії більш рівномірні.", pt: "Na Espanha a voz varia pouco e as inflexões são mais equilibradas.", fr: "En Espagne, la voix varie peu et les inflexions sont plus équilibrées.", de: "In Spanien schwankt die Stimme wenig und die Tonbewegungen sind ausgeglichener.", it: "In Spagna la voce varia poco e le inflessioni sono più equilibrate.", pl: "W Hiszpanii głos zmienia się niewiele, a ruchy intonacji są bardziej wyrównane.", tr: "İspanya’da ses az dalgalanır ve tonlama hareketleri daha dengelidir.", id: "Di Spanyol suara sedikit berubah dan infleksinya lebih seimbang.", vi: "Ở Tây Ban Nha giọng ít thay đổi và các biến điệu cân bằng hơn." }
          - type: note
            level: B2
            variety: es-419
            text: { es: "En América la entonación tiene muchas variantes, con más subidas y bajadas.", en: "In Latin America intonation has many variants, with more rises and falls.", uk: "У Латинській Америці інтонація має багато варіантів, з більшою кількістю підвищень і знижень.", pt: "Na América Latina a entonação tem muitas variantes, com mais subidas e descidas.", fr: "En Amérique latine, l’intonation a de nombreuses variantes, avec plus de montées et de descentes.", de: "In Lateinamerika hat die Intonation viele Varianten, mit mehr Steigen und Fallen.", it: "In America Latina l'intonazione ha molte varianti, con più salite e discese.", pl: "W Ameryce Łacińskiej intonacja ma wiele wariantów, z większą liczbą wzniesień i opadnięć.", tr: "Latin Amerika’da tonlamanın birçok çeşidi vardır; yükselişler ve alçalışlar daha çoktur.", id: "Di Amerika Latin intonasi memiliki banyak variasi, dengan lebih banyak naik dan turun.", vi: "Ở Mỹ Latinh ngữ điệu có nhiều biến thể, với nhiều lần lên xuống giọng hơn." }

  - title: { es: Unidades melódicas y pausas, en: "Tone units and pauses", uk: "Інтонаційні групи й паузи", pt: "Grupos entoacionais e pausas", fr: "Groupes intonatifs et pauses", de: "Intonationsgruppen und Pausen", it: "Gruppi intonativi e pause", pl: "Grupy intonacyjne i pauzy", tr: "Tonlama birimleri ve duraklamalar", id: "Unit intonasi dan jeda", vi: "Đơn vị ngữ điệu và chỗ ngắt" }
    role: own
    content:
      - type: usage
        columns:
          - { key: unit, label: { es: Unidad, en: "Unit", uk: "Одиниця", pt: "Unidade", fr: "Unité", de: "Einheit", it: "Unità", pl: "Jednostka", tr: "Birim", id: "Unit", vi: "Đơn vị" } }
          - { key: pause, label: { es: Pausa, en: "Pause", uk: "Пауза", pt: "Pausa", fr: "Pause", de: "Pause", it: "Pausa", pl: "Pauza", tr: "Duraklama", id: "Jeda", vi: "Chỗ ngắt" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            unit: { es: Signo de puntuación, en: "Punctuation mark", uk: "Розділовий знак", pt: "Sinal de pontuação", fr: "Signe de ponctuation", de: "Satzzeichen", it: "Segno di punteggiatura", pl: "Znak interpunkcyjny", tr: "Noktalama işareti", id: "Tanda baca", vi: "Dấu câu" }
            pause: { es: "cae donde está el signo: dos puntos, punto y coma, puntos suspensivos o paréntesis", en: "falls where the mark is: colon, semicolon, ellipsis or parentheses", uk: "стоїть там, де знак: двокрапка, крапка з комою, три крапки або дужки", pt: "cai onde está o sinal: dois-pontos, ponto e vírgula, reticências ou parênteses", fr: "tombe là où se trouve le signe : deux-points, point-virgule, points de suspension ou parenthèses", de: "liegt dort, wo das Zeichen steht: Doppelpunkt, Semikolon, Auslassungspunkte oder Klammern", it: "cade dove c'è il segno: due punti, punto e virgola, puntini di sospensione o parentesi", pl: "wypada tam, gdzie jest znak: dwukropek, średnik, wielokropek lub nawias", tr: "işaretin bulunduğu yere düşer: iki nokta, noktalı virgül, üç nokta veya parantez", id: "jatuh di tempat tanda itu berada: titik dua, titik koma, elipsis, atau tanda kurung", vi: "rơi vào chỗ có dấu: dấu hai chấm, dấu chấm phẩy, dấu ba chấm hoặc dấu ngoặc đơn" }
            ex: "Tengo dos hermanos: // Luis y Marta."
            tr: { en: "I have two siblings: Luis and Marta.", uk: "У мене брат і сестра: Луїс і Марта.", pt: "Tenho dois irmãos: Luis e Marta.", fr: "J’ai un frère et une sœur : Luis et Marta.", de: "Ich habe zwei Geschwister: Luis und Marta.", it: "Ho due fratelli: Luis e Marta.", pl: "Mam dwoje rodzeństwa: Luisa i Martę.", tr: "İki kardeşim var: Luis ve Marta.", id: "Saya punya dua saudara: Luis dan Marta.", vi: "Tôi có hai anh chị em: Luis và Marta." }
          - level: B2
            unit: { es: Complemento adelantado, en: "Fronted complement", uk: "Складник, винесений на початок", pt: "Complemento antecipado", fr: "Complément placé en tête", de: "Vorangestellte Ergänzung", it: "Complemento anticipato", pl: "Człon wysunięty na początek", tr: "Başa alınan tümleç", id: "Pelengkap yang didahulukan", vi: "Bổ ngữ đưa lên đầu câu" }
            pause: { es: "puede formar una unidad propia, con pausa o sin ella", en: "can form a unit of its own, with or without a pause", uk: "може утворювати окрему групу, з паузою або без неї", pt: "pode formar um grupo próprio, com pausa ou sem ela", fr: "peut former un groupe à part, avec ou sans pause", de: "kann eine eigene Gruppe bilden, mit oder ohne Pause", it: "può formare un gruppo a sé, con pausa o senza", pl: "może tworzyć osobną grupę, z pauzą lub bez niej", tr: "kendi başına bir birim oluşturabilir, duraklamalı ya da duraklamasız", id: "dapat membentuk unit tersendiri, dengan jeda atau tanpa jeda", vi: "có thể tạo thành một đơn vị riêng, có chỗ ngắt hoặc không" }
            ex: { examples: ["En el parque // se oían pájaros.", "En el parque se oían pájaros."] }
            tr: { en: { examples: ["Birds could be heard in the park.", "Birds could be heard in the park."] }, uk: { examples: ["У парку було чути птахів.", "У парку було чути птахів."] }, pt: { examples: ["No parque se ouviam pássaros.", "No parque se ouviam pássaros."] }, fr: { examples: ["Dans le parc, on entendait des oiseaux.", "Dans le parc, on entendait des oiseaux."] }, de: { examples: ["Im Park hörte man Vögel.", "Im Park hörte man Vögel."] }, it: { examples: ["Nel parco si sentivano uccelli.", "Nel parco si sentivano uccelli."] }, pl: { examples: ["W parku było słychać ptaki.", "W parku było słychać ptaki."] }, tr: { examples: ["Parkta kuş sesleri duyuluyordu.", "Parkta kuş sesleri duyuluyordu."] }, id: { examples: ["Di taman terdengar burung-burung.", "Di taman terdengar burung-burung."] }, vi: { examples: ["Trong công viên nghe thấy tiếng chim.", "Trong công viên nghe thấy tiếng chim."] } }
          - level: B2
            unit: { es: Verbo antes del sujeto, en: "Verb before the subject", uk: "Дієслово перед підметом", pt: "Verbo antes do sujeito", fr: "Verbe avant le sujet", de: "Verb vor dem Subjekt", it: "Verbo prima del soggetto", pl: "Czasownik przed podmiotem", tr: "Fiil öznenin önünde", id: "Kata kerja sebelum subjek", vi: "Động từ đứng trước chủ ngữ" }
            pause: { es: "forma una sola unidad, sin pausa", en: "forms a single unit, without a pause", uk: "утворює одну групу, без паузи", pt: "forma um só grupo, sem pausa", fr: "forme un seul groupe, sans pause", de: "bildet eine einzige Gruppe, ohne Pause", it: "forma un solo gruppo, senza pausa", pl: "tworzy jedną grupę, bez pauzy", tr: "tek bir birim oluşturur, duraklama olmaz", id: "membentuk satu unit, tanpa jeda", vi: "tạo thành một đơn vị duy nhất, không có chỗ ngắt" }
            ex: "Llegó Marta."
            tr: { en: "Marta arrived.", uk: "Прийшла Марта.", pt: "Marta chegou.", fr: "Marta est arrivée.", de: "Marta ist angekommen.", it: "È arrivata Marta.", pl: "Przyszła Marta.", tr: "Marta geldi.", id: "Marta datang.", vi: "Marta đã đến." }
          - level: B2
            unit: { es: Subordinada, en: "Subordinate clause", uk: "Підрядне речення", pt: "Oração subordinada", fr: "Proposition subordonnée", de: "Nebensatz", it: "Proposizione subordinata", pl: "Zdanie podrzędne", tr: "Yan cümle", id: "Anak kalimat", vi: "Mệnh đề phụ" }
            pause: { es: "se separa de la oración principal", en: "is set off from the main clause", uk: "відокремлюється від головного речення", pt: "separa-se da oração principal", fr: "se sépare de la proposition principale", de: "wird vom Hauptsatz getrennt", it: "si separa dalla proposizione principale", pl: "jest oddzielone od zdania głównego", tr: "ana cümleden ayrılır", id: "dipisahkan dari klausa utama", vi: "được tách khỏi mệnh đề chính" }
            ex: "Si llueve // nos quedamos en casa."
            tr: { en: "If it rains, we stay at home.", uk: "Якщо піде дощ, ми залишимось удома.", pt: "Se chover, ficamos em casa.", fr: "S’il pleut, nous restons à la maison.", de: "Wenn es regnet, bleiben wir zu Hause.", it: "Se piove, restiamo a casa.", pl: "Jeśli będzie padać, zostajemy w domu.", tr: "Yağmur yağarsa evde kalırız.", id: "Kalau hujan, kami tinggal di rumah.", vi: "Nếu trời mưa, chúng tôi ở nhà." }
          - level: B2
            unit: { es: Oración reducida o inciso, en: "Reduced clause or parenthetical", uk: "Скорочений зворот або вставна частина", pt: "Oração reduzida ou inciso", fr: "Proposition réduite ou incise", de: "Verkürzter Satz oder Einschub", it: "Proposizione ridotta o inciso", pl: "Zdanie skrócone lub wtrącenie", tr: "Kısaltılmış cümle veya araya girme", id: "Klausa tereduksi atau sisipan", vi: "Mệnh đề rút gọn hoặc thành phần xen" }
            pause: { es: "se separa del resto con pausas", en: "is set off from the rest by pauses", uk: "відокремлюється від решти паузами", pt: "separa-se do resto por pausas", fr: "se détache du reste par des pauses", de: "wird durch Pausen vom Rest getrennt", it: "si separa dal resto con pause", pl: "jest oddzielone od reszty pauzami", tr: "geri kalanından duraklamalarla ayrılır", id: "dipisahkan dari bagian lain dengan jeda", vi: "được tách khỏi phần còn lại bằng các chỗ ngắt" }
            ex: "El niño // cansado de esperar // se durmió en el sofá."
            tr: { en: "The boy, tired of waiting, fell asleep on the sofa.", uk: "Хлопчик, втомившись чекати, заснув на дивані.", pt: "O menino, cansado de esperar, adormeceu no sofá.", fr: "L’enfant, fatigué d’attendre, s’est endormi sur le canapé.", de: "Der Junge, müde vom Warten, schlief auf dem Sofa ein.", it: "Il bambino, stanco di aspettare, si addormentò sul divano.", pl: "Chłopiec, zmęczony czekaniem, zasnął na kanapie.", tr: "Çocuk, beklemekten yorulup kanepede uyuyakaldı.", id: "Anak itu, yang lelah menunggu, tertidur di sofa.", vi: "Cậu bé, mệt vì phải chờ, ngủ thiếp đi trên ghế sofa." }
          - level: C1
            unit: { es: Relativa restrictiva, en: "Defining relative clause", uk: "Уточнювальне означальне речення", pt: "Relativa restritiva", fr: "Relative déterminative", de: "Restriktiver Relativsatz", it: "Relativa limitativa", pl: "Zdanie względne ograniczające", tr: "Sınırlayıcı ilgi cümlesi", id: "Klausa relatif restriktif", vi: "Mệnh đề quan hệ xác định" }
            pause: { es: "va sin pausas: solo aprueban los que estudian", en: "has no pauses: only those who study pass", uk: "іде без пауз: складають іспит лише ті, хто вчиться", pt: "vai sem pausas: só passam os que estudam", fr: "se dit sans pauses : seuls réussissent ceux qui étudient", de: "steht ohne Pausen: nur wer lernt, besteht", it: "va senza pause: passano solo quelli che studiano", pl: "bez pauz: zdają tylko ci, którzy się uczą", tr: "duraklamasız söylenir: yalnızca çalışanlar geçer", id: "diucapkan tanpa jeda: hanya yang belajar yang lulus", vi: "không có chỗ ngắt: chỉ những người học mới đỗ" }
            ex: "Los alumnos que estudian aprobarán."
            tr: { en: "The students who study will pass.", uk: "Учні, які вчаться, складуть іспит.", pt: "Os alunos que estudam serão aprovados.", fr: "Les élèves qui étudient réussiront.", de: "Die Schüler, die lernen, werden bestehen.", it: "Gli alunni che studiano saranno promossi.", pl: "Uczniowie, którzy się uczą, zdadzą egzamin.", tr: "Çalışan öğrenciler geçecek.", id: "Siswa yang belajar akan lulus.", vi: "Những học sinh nào học thì sẽ đỗ." }
          - level: C1
            unit: { es: Relativa explicativa, en: "Non-defining relative clause", uk: "Пояснювальне означальне речення", pt: "Relativa explicativa", fr: "Relative explicative", de: "Appositiver Relativsatz", it: "Relativa appositiva", pl: "Zdanie względne wyjaśniające", tr: "Açıklayıcı ilgi cümlesi", id: "Klausa relatif nonrestriktif", vi: "Mệnh đề quan hệ không xác định" }
            pause: { es: "va entre pausas: todos estudian y todos aprueban", en: "is set between pauses: all study and all pass", uk: "іде між паузами: усі вчаться й усі складають іспит", pt: "vai entre pausas: todos estudam e todos passam", fr: "se dit entre deux pauses : tous étudient et tous réussissent", de: "steht zwischen Pausen: alle lernen und alle bestehen", it: "va tra due pause: tutti studiano e tutti passano", pl: "między pauzami: wszyscy się uczą i wszyscy zdają", tr: "duraklamalar arasında söylenir: hepsi çalışır, hepsi geçer", id: "diucapkan di antara jeda: semua belajar dan semua lulus", vi: "nằm giữa hai chỗ ngắt: tất cả đều học và tất cả đều đỗ" }
            ex: "Los alumnos // que estudian // aprobarán."
            tr: { en: "The students, who study, will pass.", uk: "Учні — а вони вчаться — складуть іспит.", pt: "Os alunos, que estudam, serão aprovados.", fr: "Les élèves, qui étudient, réussiront.", de: "Die Schüler, die ja alle lernen, werden bestehen.", it: "Gli alunni, che studiano, saranno promossi.", pl: "Uczniowie, a uczą się wszyscy, zdadzą egzamin.", tr: "Öğrenciler —hepsi çalışıyor— geçecek.", id: "Siswa, yang belajar, akan lulus.", vi: "Học sinh — mà em nào cũng học — sẽ đỗ." }
          - level: C1
            unit: { es: Complemento ambiguo, en: "Ambiguous complement", uk: "Двозначний складник", pt: "Complemento ambíguo", fr: "Complément ambigu", de: "Mehrdeutige Ergänzung", it: "Complemento ambiguo", pl: "Człon dwuznaczny", tr: "İki anlamlı tümleç", id: "Pelengkap ambigu", vi: "Bổ ngữ mơ hồ" }
            pause: { es: "con pausa se une al verbo; sin pausa, al sustantivo", en: "with a pause it joins the verb; without one, the noun", uk: "з паузою він належить до дієслова, без паузи — до іменника", pt: "com pausa liga-se ao verbo; sem pausa, ao substantivo", fr: "avec une pause, il se rattache au verbe ; sans pause, au nom", de: "mit Pause gehört es zum Verb, ohne Pause zum Nomen", it: "con la pausa si lega al verbo; senza pausa, al sostantivo", pl: "z pauzą łączy się z czasownikiem, bez pauzy — z rzeczownikiem", tr: "duraklamalıysa fiile, duraklamasızsa isme bağlanır", id: "dengan jeda ia menempel pada kata kerja; tanpa jeda, pada kata benda", vi: "có chỗ ngắt thì gắn với động từ; không có thì gắn với danh từ" }
            ex: { examples: ["Vi a la niña // con los prismáticos.", "Vi a la niña con los prismáticos."] }
            tr: { en: { examples: ["I saw the girl, using the binoculars.", "I saw the girl who had the binoculars."] }, uk: { examples: ["Я побачив дівчинку, дивлячись у бінокль.", "Я побачив дівчинку з біноклем."] }, pt: { examples: ["Vi a menina usando o binóculo.", "Vi a menina que tinha o binóculo."] }, fr: { examples: ["J’ai vu la fille à l’aide des jumelles.", "J’ai vu la fille qui avait les jumelles."] }, de: { examples: ["Ich sah das Mädchen durch das Fernglas.", "Ich sah das Mädchen mit dem Fernglas."] }, it: { examples: ["Ho visto la bambina guardando con il binocolo.", "Ho visto la bambina con il binocolo."] }, pl: { examples: ["Zobaczyłem dziewczynkę przez lornetkę.", "Zobaczyłem dziewczynkę z lornetką."] }, tr: { examples: ["Kızı dürbünle gördüm.", "Dürbünü olan kızı gördüm."] }, id: { examples: ["Dengan teropong, saya melihat anak itu.", "Saya melihat anak yang membawa teropong itu."] }, vi: { examples: ["Tôi dùng ống nhòm để nhìn cô bé.", "Tôi thấy cô bé cầm ống nhòm."] } }
          - level: C1
            unit: { es: Tematización, en: "Topicalisation", uk: "Тематизація", pt: "Tematização", fr: "Thématisation", de: "Thematisierung", it: "Tematizzazione", pl: "Tematyzacja", tr: "Konulaştırma", id: "Tematisasi", vi: "Chủ đề hóa" }
            pause: { es: "el tema adelantado forma una unidad con una pausa breve", en: "the fronted topic forms a unit with a short pause", uk: "тема, винесена на початок, утворює групу з короткою паузою", pt: "o tema antecipado forma um grupo com uma pausa breve", fr: "le thème placé en tête forme un groupe avec une brève pause", de: "das vorangestellte Thema bildet mit einer kurzen Pause eine Gruppe", it: "il tema anticipato forma un gruppo con una breve pausa", pl: "wysunięty na początek temat tworzy grupę z krótką pauzą", tr: "öne alınan konu, kısa bir duraklamayla bir birim oluşturur", id: "topik yang didahulukan membentuk satu unit dengan jeda singkat", vi: "chủ đề đưa lên đầu tạo thành một đơn vị với một chỗ ngắt ngắn" }
            ex: "A Lucía // la saludé en la calle."
            tr: { en: "As for Lucía, I said hello to her in the street.", uk: "Лусію я привітав на вулиці.", pt: "A Lucía, cumprimentei na rua.", fr: "Lucía, je l’ai saluée dans la rue.", de: "Lucía habe ich auf der Straße begrüßt.", it: "Lucía l'ho salutata per strada.", pl: "Lucíę przywitałem na ulicy.", tr: "Lucía’yı sokakta selamladım.", id: "Lucía kusapa di jalan.", vi: "Lucía thì tôi đã chào ở ngoài đường." }
          - level: C1
            unit: { es: Focalización, en: "Focusing", uk: "Фокусування", pt: "Focalização", fr: "Focalisation", de: "Fokussierung", it: "Focalizzazione", pl: "Fokalizacja", tr: "Odaklama", id: "Fokalisasi", vi: "Tiêu điểm hóa" }
            pause: { es: "el elemento adelantado se une al resto y lleva el acento más fuerte", en: "the fronted element joins the rest and takes the strongest stress", uk: "елемент, винесений на початок, зливається з рештою й має найсильніший наголос", pt: "o elemento antecipado une-se ao resto e leva o acento mais forte", fr: "l’élément placé en tête se joint au reste et porte l’accent le plus fort", de: "das vorangestellte Element schließt sich dem Rest an und trägt die stärkste Betonung", it: "l'elemento anticipato si unisce al resto e porta l'accento più forte", pl: "wysunięty element łączy się z resztą i ma najsilniejszy akcent", tr: "öne alınan öğe geri kalanla birleşir ve en güçlü vurguyu taşır", id: "unsur yang didahulukan menyatu dengan bagian lain dan membawa tekanan terkuat", vi: "thành phần đưa lên đầu nối liền với phần còn lại và mang trọng âm mạnh nhất" }
            ex: [{ stress: Muy amable }, " fue el camarero."]
            tr: { en: "The waiter was very kind.", uk: "Дуже люб’язним був офіціант.", pt: "Muito gentil foi o garçom.", fr: "Le serveur a été très aimable.", de: "Sehr freundlich war der Kellner.", it: "Molto gentile è stato il cameriere.", pl: "Bardzo uprzejmy był kelner.", tr: "Garson çok nazikti.", id: "Pelayan itu sangat ramah.", vi: "Người phục vụ rất lịch sự." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { es: "Al leer en voz alta, las unidades siguen el estilo y el registro del texto.", en: "When reading aloud, the units follow the style and register of the text.", uk: "Під час читання вголос групи відповідають стилю й регістру тексту.", pt: "Na leitura em voz alta, os grupos seguem o estilo e o registro do texto.", fr: "En lecture à voix haute, les groupes suivent le style et le registre du texte.", de: "Beim lauten Lesen richten sich die Gruppen nach Stil und Register des Textes.", it: "Nella lettura ad alta voce, i gruppi seguono lo stile e il registro del testo.", pl: "Podczas czytania na głos grupy odpowiadają stylowi i rejestrowi tekstu.", tr: "Yüksek sesle okurken birimler metnin üslubuna ve düzeyine uyar.", id: "Saat membaca nyaring, unit mengikuti gaya dan register teks.", vi: "Khi đọc to, các đơn vị theo văn phong và mức độ trang trọng của văn bản." }
          - type: rule
            level: C1
            text: { es: "La voz transmite la intención del autor, también la que el texto deja implícita.", en: "The voice conveys the author's intention, including what the text leaves implicit.", uk: "Голос передає намір автора, зокрема й той, що текст залишає неявним.", pt: "A voz transmite a intenção do autor, também a que o texto deixa implícita.", fr: "La voix transmet l’intention de l’auteur, y compris celle que le texte laisse implicite.", de: "Die Stimme vermittelt die Absicht des Autors, auch die, die der Text nur andeutet.", it: "La voce trasmette l'intenzione dell'autore, anche quella che il testo lascia implicita.", pl: "Głos oddaje intencję autora, także tę, którą tekst pozostawia domyślną.", tr: "Ses, yazarın niyetini, metnin üstü kapalı bıraktığı niyeti de aktarır.", id: "Suara menyampaikan maksud penulis, termasuk maksud yang dibiarkan tersirat oleh teks.", vi: "Giọng đọc truyền đạt ý định của tác giả, kể cả ý mà văn bản để ngầm." }
          - type: rule
            level: C1
            text: { es: "La lectura tiene pausas más regulares y un ritmo más uniforme que el habla espontánea.", en: "Reading has more regular pauses and a more even rhythm than spontaneous speech.", uk: "Читання має правильніші паузи й рівніший ритм, ніж спонтанне мовлення.", pt: "A leitura tem pausas mais regulares e um ritmo mais uniforme do que a fala espontânea.", fr: "La lecture a des pauses plus régulières et un rythme plus uniforme que la parole spontanée.", de: "Beim Lesen sind die Pausen regelmäßiger und der Rhythmus gleichmäßiger als beim spontanen Sprechen.", it: "La lettura ha pause più regolari e un ritmo più uniforme del parlato spontaneo.", pl: "Czytanie ma bardziej regularne pauzy i równiejszy rytm niż mowa spontaniczna.", tr: "Okumada duraklamalar kendiliğinden konuşmadan daha düzenli, ritim daha eşit olur.", id: "Bacaan memiliki jeda yang lebih teratur dan ritme yang lebih seragam daripada tuturan spontan.", vi: "Khi đọc, các chỗ ngắt đều đặn hơn và nhịp điệu đồng đều hơn so với lời nói tự nhiên." }
          - type: rule
            level: C1
            text: { es: "Sin signos de puntuación, el lector divide el texto en unidades según el sentido:", en: "Without punctuation marks, the reader divides the text into units according to the meaning:", uk: "Без розділових знаків читач ділить текст на групи за змістом:", pt: "Sem sinais de pontuação, o leitor divide o texto em grupos segundo o sentido:", fr: "Sans signes de ponctuation, le lecteur divise le texte en groupes selon le sens :", de: "Ohne Satzzeichen gliedert der Leser den Text nach dem Sinn in Gruppen:", it: "Senza segni di punteggiatura, il lettore divide il testo in gruppi secondo il senso:", pl: "Bez znaków interpunkcyjnych czytelnik dzieli tekst na grupy według sensu:", tr: "Noktalama işaretleri yoksa okuyucu metni anlama göre birimlere böler:", id: "Tanpa tanda baca, pembaca membagi teks menjadi unit menurut maknanya:", vi: "Khi không có dấu câu, người đọc chia văn bản thành các đơn vị theo nghĩa:" }
            ex: "Cuando llegué // los invitados // ya se habían ido."
            tr: { en: "When I arrived, the guests had already left.", uk: "Коли я прийшов, гості вже пішли.", pt: "Quando cheguei, os convidados já tinham ido embora.", fr: "Quand je suis arrivé, les invités étaient déjà partis.", de: "Als ich ankam, waren die Gäste schon gegangen.", it: "Quando sono arrivato, gli invitati se n'erano già andati.", pl: "Kiedy przyszedłem, goście już wyszli.", tr: "Ben geldiğimde misafirler çoktan gitmişti.", id: "Ketika saya tiba, para tamu sudah pergi.", vi: "Khi tôi đến, khách đã về hết rồi." }
      - type: usage
        columns:
          - { key: unit, label: { es: Unidad, en: "Unit", uk: "Одиниця", pt: "Unidade", fr: "Unité", de: "Einheit", it: "Unità", pl: "Jednostka", tr: "Birim", id: "Unit", vi: "Đơn vị" } }
          - { key: pause, label: { es: Pausa y tempo, en: "Pause and tempo", uk: "Пауза й темп", pt: "Pausa e andamento", fr: "Pause et débit", de: "Pause und Sprechtempo", it: "Pausa e velocità", pl: "Pauza i tempo", tr: "Duraklama ve konuşma hızı", id: "Jeda dan tempo", vi: "Chỗ ngắt và tốc độ nói" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            unit: { es: Emoción fuerte, en: "Strong emotion", uk: "Сильні емоції", pt: "Emoção forte", fr: "Forte émotion", de: "Starke Emotion", it: "Emozione forte", pl: "Silne emocje", tr: "Güçlü duygu", id: "Emosi kuat", vi: "Cảm xúc mạnh" }
            pause: { es: "la voz hace inflexiones circunflejas: sube y baja en un mismo grupo", en: "the voice makes circumflex inflections: it rises and falls within one group", uk: "голос робить хвилясті переходи: підвищується й знижується в межах однієї групи", pt: "a voz faz inflexões circunflexas: sobe e desce dentro do mesmo grupo", fr: "la voix fait des inflexions circonflexes : elle monte et descend dans un même groupe", de: "die Stimme bewegt sich zirkumflexartig: sie steigt und fällt innerhalb einer Gruppe", it: "la voce fa inflessioni circonflesse: sale e scende nello stesso gruppo", pl: "głos wykonuje ruchy cyrkumfleksowe: podnosi się i opada w obrębie jednej grupy", tr: "ses dalgalı hareketler yapar: aynı grup içinde yükselir ve alçalır", id: "suara membuat infleksi sirkumfleks: naik dan turun dalam satu kelompok", vi: "giọng uốn lượn: lên rồi xuống trong cùng một nhóm" }
            ex: "Con decirte // que llevo una hora esperando el autobús."
            tr: { en: "Let me just tell you that I've been waiting for the bus for an hour.", uk: "Скажу тобі лише, що я вже годину чекаю автобуса.", pt: "Só te digo que estou esperando o ônibus há uma hora.", fr: "Je te dis seulement que j’attends le bus depuis une heure.", de: "Ich sage dir nur: Ich warte seit einer Stunde auf den Bus.", it: "Ti basti sapere che aspetto l'autobus da un'ora.", pl: "Powiem ci tylko, że czekam na autobus już godzinę.", tr: "Sana şunu söyleyeyim, bir saattir otobüs bekliyorum.", id: "Cukup kukatakan bahwa saya sudah satu jam menunggu bus.", vi: "Chỉ cần nói với bạn là tôi đã đợi xe buýt cả tiếng đồng hồ rồi." }
          - level: C2
            unit: { es: Pausa expresiva, en: "Expressive pause", uk: "Виразна пауза", pt: "Pausa expressiva", fr: "Pause expressive", de: "Ausdrucksvolle Pause", it: "Pausa espressiva", pl: "Pauza ekspresywna", tr: "Etkileyici duraklama", id: "Jeda ekspresif", vi: "Chỗ ngắt biểu cảm" }
            pause: { es: "la pausa carga el relato de suspense o de emoción", en: "the pause fills the story with suspense or emotion", uk: "пауза наповнює розповідь напруженням або емоцією", pt: "a pausa carrega o relato de suspense ou de emoção", fr: "la pause charge le récit de suspense ou d’émotion", de: "die Pause lädt die Erzählung mit Spannung oder Gefühl auf", it: "la pausa carica il racconto di suspense o di emozione", pl: "pauza nadaje opowieści napięcie lub emocję", tr: "duraklama anlatıyı gerilim veya duyguyla yükler", id: "jeda memberi cerita rasa tegang atau emosi", vi: "chỗ ngắt làm câu chuyện thêm hồi hộp hoặc xúc động" }
            ex: "Abre la puerta // da un paso // se apaga la luz // y // empieza el miedo."
            tr: { en: "He opens the door, takes a step, the light goes out, and then the fear begins.", uk: "Він відчиняє двері, робить крок, світло гасне, і починається страх.", pt: "Abre a porta, dá um passo, a luz se apaga e... começa o medo.", fr: "Il ouvre la porte, fait un pas, la lumière s’éteint, et… la peur commence.", de: "Er öffnet die Tür, macht einen Schritt, das Licht geht aus, und … die Angst beginnt.", it: "Apre la porta, fa un passo, la luce si spegne e… comincia la paura.", pl: "Otwiera drzwi, robi krok, gaśnie światło i… zaczyna się strach.", tr: "Kapıyı açar, bir adım atar, ışık söner ve... korku başlar.", id: "Dia membuka pintu, melangkah, lampu padam, dan... ketakutan pun dimulai.", vi: "Anh ta mở cửa, bước một bước, đèn tắt, và... nỗi sợ bắt đầu." }
          - level: C2
            unit: { es: Comienzo de una charla, en: "Start of a talk", uk: "Початок виступу", pt: "Início de uma palestra", fr: "Début d’un exposé", de: "Beginn eines Vortrags", it: "Inizio di un discorso", pl: "Początek wystąpienia", tr: "Konuşmanın başlangıcı", id: "Awal sebuah ceramah", vi: "Phần mở đầu bài nói" }
            pause: { es: "el tempo es lento", en: "the tempo is slow", uk: "темп повільний", pt: "o andamento é lento", fr: "le débit est lent", de: "das Sprechtempo ist langsam", it: "la velocità è lenta", pl: "tempo jest wolne", tr: "konuşma hızı yavaştır", id: "tempo bicara lambat", vi: "tốc độ nói chậm" }
            ex: "Buenos días a todos // y gracias por venir."
            tr: { en: "Good morning, everyone, and thank you for coming.", uk: "Доброго ранку всім, і дякую, що прийшли.", pt: "Bom dia a todos e obrigado por virem.", fr: "Bonjour à tous et merci d’être venus.", de: "Guten Morgen allerseits, und danke fürs Kommen.", it: "Buongiorno a tutti e grazie di essere venuti.", pl: "Dzień dobry wszystkim i dziękuję za przybycie.", tr: "Herkese günaydın, geldiğiniz için teşekkürler.", id: "Selamat pagi semuanya, dan terima kasih sudah datang.", vi: "Chào buổi sáng mọi người, và cảm ơn đã đến." }
          - level: C2
            unit: { es: Inciso, en: "Parenthetical", uk: "Вставна частина", pt: "Inciso", fr: "Incise", de: "Einschub", it: "Inciso", pl: "Wtrącenie", tr: "Araya girme", id: "Sisipan", vi: "Thành phần xen" }
            pause: { es: "el tempo es rápido", en: "the tempo is fast", uk: "темп швидкий", pt: "o andamento é rápido", fr: "le débit est rapide", de: "das Sprechtempo ist schnell", it: "la velocità è rapida", pl: "tempo jest szybkie", tr: "konuşma hızı yüksektir", id: "tempo bicara cepat", vi: "tốc độ nói nhanh" }
            ex: "Tu hermana —que es muy puntual— llegó la primera."
