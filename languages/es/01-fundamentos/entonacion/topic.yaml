            ex: "¡Qué remedio!"
            tr: { en: "What else can I do!", uk: "А що вдієш!", pt: "Fazer o quê!", fr: "Que faire !", de: "Was bleibt mir übrig!", it: "Che altro posso fare!", pl: "Cóż robić!", tr: "Başka çare yok!", id: "Mau bagaimana lagi!", vi: "Biết làm sao được!" }
          - level: C1
            act: { es: Reproche, en: "Reproach", uk: "Докір", pt: "Reprovação", fr: "Reproche", de: "Vorwurf", it: "Rimprovero", pl: "Wyrzut", tr: "Sitem", id: "Teguran", vi: "Trách móc" }
            ex: "¡Vaya manera de hablarme!"
            tr: { en: "What a way to talk to me!", uk: "Що це за манера розмовляти зі мною!", pt: "Que jeito de falar comigo!", fr: "Quelle façon de me parler !", de: "Was für eine Art, mit mir zu reden!", it: "Che modo di parlarmi!", pl: "Cóż to za sposób mówienia do mnie!", tr: "Benimle konuşma şekline bak!", id: "Begitu caranya bicara kepada saya!", vi: "Lại còn cách nói chuyện với tôi như thế!" }
          - level: C1
            act: { es: Sorpresa, en: "Surprise", uk: "Здивування", pt: "Surpresa", fr: "Surprise", de: "Überraschung", it: "Sorpresa", pl: "Zdziwienie", tr: "Şaşkınlık", id: "Keterkejutan", vi: "Ngạc nhiên" }
            ex: "¡Que no me hayan avisado!"
            tr: { en: "To think that nobody told me!", uk: "Подумати лишень, що мене не попередили!", pt: "E pensar que não me avisaram!", fr: "Dire qu’on ne m’a pas prévenu !", de: "Dass man mir nicht Bescheid gesagt hat!", it: "Pensare che non mi hanno avvisato!", pl: "Pomyśleć, że nikt mnie nie uprzedził!", tr: "Bana haber vermemişler!", id: "Bisa-bisanya saya tidak diberi tahu!", vi: "Thật không ngờ người ta lại không báo cho tôi!" }
          - level: C1
            act: { es: Ánimo persuasivo, en: "Persuasive encouragement", uk: "Переконливе підбадьорювання", pt: "Encorajamento persuasivo", fr: "Encouragement persuasif", de: "Überzeugende Ermutigung", it: "Incoraggiamento persuasivo", pl: "Przekonujące zachęcanie", tr: "İkna edici cesaretlendirme", id: "Dorongan yang meyakinkan", vi: "Động viên thuyết phục" }
            ex: "Ya verás como todo sale bien."
            tr: { en: "You'll see, everything will turn out fine.", uk: "Побачиш, усе буде добре.", pt: "Você vai ver como tudo dá certo.", fr: "Tu verras, tout se passera bien.", de: "Du wirst sehen, alles wird gut.", it: "Vedrai che andrà tutto bene.", pl: "Zobaczysz, wszystko się dobrze skończy.", tr: "Göreceksin, her şey yoluna girecek.", id: "Kamu akan lihat, semuanya akan baik-baik saja.", vi: "Rồi bạn sẽ thấy mọi chuyện đều ổn." }
          - level: C1
            act: { es: Exhortación, en: "Exhortation", uk: "Заклик", pt: "Exortação", fr: "Exhortation", de: "Aufruf", it: "Esortazione", pl: "Zachęta", tr: "Telkin", id: "Anjuran", vi: "Lời khuyên nhủ" }
            ex: "¡Hay que ayudarse entre todos!"
            tr: { en: "We must all help one another!", uk: "Треба допомагати одне одному!", pt: "Temos que nos ajudar uns aos outros!", fr: "Il faut s’entraider tous ensemble !", de: "Wir müssen uns alle gegenseitig helfen!", it: "Bisogna aiutarsi tutti a vicenda!", pl: "Wszyscy musimy sobie nawzajem pomagać!", tr: "Hepimiz birbirimize yardım etmeliyiz!", id: "Kita harus saling membantu!", vi: "Mọi người phải giúp đỡ lẫn nhau!" }
          - level: C1
            act: { es: Ruego en fórmulas, en: "Request in set formulas", uk: "Прохання у сталих формулах", pt: "Pedido em fórmulas feitas", fr: "Demande en formules figées", de: "Bitte in festen Formeln", it: "Richiesta in formule fisse", pl: "Prośba w utartych formułach", tr: "Kalıplaşmış ifadelerle rica", id: "Permintaan dalam ungkapan baku", vi: "Lời nhờ bằng công thức cố định" }
            ex: { examples: ["Quisiera hablar con la directora.", "Le agradecería una respuesta pronto."] }
            tr: { en: { examples: ["I would like to speak to the director.", "I would appreciate a reply soon."] }, uk: { examples: ["Я хотів би поговорити з директоркою.", "Буду вдячний за швидку відповідь."] }, pt: { examples: ["Gostaria de falar com a diretora.", "Agradeceria uma resposta em breve."] }, fr: { examples: ["Je voudrais parler à la directrice.", "Je vous serais reconnaissant de me répondre rapidement."] }, de: { examples: ["Ich würde gern mit der Direktorin sprechen.", "Ich wäre Ihnen für eine baldige Antwort dankbar."] }, it: { examples: ["Vorrei parlare con la direttrice.", "Le sarei grato di una risposta a breve."] }, pl: { examples: ["Chciałbym porozmawiać z dyrektorką.", "Byłbym wdzięczny za szybką odpowiedź."] }, tr: { examples: ["Müdire hanımla görüşmek istiyorum.", "Kısa sürede yanıt verirseniz minnettar olurum."] }, id: { examples: ["Saya ingin berbicara dengan Ibu Direktur.", "Saya akan berterima kasih jika Anda segera membalas."] }, vi: { examples: ["Tôi muốn nói chuyện với bà giám đốc.", "Tôi sẽ rất biết ơn nếu sớm nhận được hồi âm của quý vị."] } }
          - level: C2
            act: { es: "Ironía: se dice lo contrario de lo que se piensa, con un contorno plano que quita fuerza a la subida de intensidad", en: "Irony: one says the opposite of what one thinks, with a flat contour that weakens the rise in intensity", uk: "Іронія: кажуть протилежне тому, що думають, з пласким контуром, який послаблює підвищення інтенсивності", pt: "Ironia: diz-se o contrário do que se pensa, com um contorno plano que tira força da subida de intensidade", fr: "Ironie : on dit le contraire de ce qu’on pense, avec un contour plat qui atténue la montée d’intensité", de: "Ironie: Man sagt das Gegenteil von dem, was man denkt, mit einer flachen Kontur, die den Anstieg der Intensität abschwächt", it: "Ironia: si dice il contrario di ciò che si pensa, con un profilo piatto che toglie forza all'aumento di intensità", pl: "Ironia: mówi się coś przeciwnego niż się myśli, z płaskim konturem, który osłabia wzrost intensywności", tr: "İroni: düşünülenin tersi söylenir; ezgi düzdür ve yoğunluk artışının gücünü azaltır", id: "Ironi: orang mengatakan kebalikan dari yang dipikirkan, dengan kontur datar yang melemahkan kenaikan intensitas", vi: "Mỉa mai: nói ngược với điều mình nghĩ, với đường nét phẳng làm giảm lực của việc tăng cường độ" }
            ex: "¡Qué bien has dejado la cocina!"
            tr: { en: "Look how nicely you've left the kitchen!", uk: "Як гарно ти залишив кухню!", pt: "Que lindo você deixou a cozinha!", fr: "Comme tu as bien laissé la cuisine !", de: "Wie schön du die Küche hinterlassen hast!", it: "Hai lasciato la cucina proprio bene!", pl: "Ślicznie zostawiłeś kuchnię!", tr: "Mutfağı ne güzel bırakmışsın!", id: "Bagus sekali kamu meninggalkan dapur!", vi: "Bạn để nhà bếp gọn gàng quá nhỉ!" }
          - level: C2
            act: { es: Exclamación ondulada de sentimiento fuerte, en: "Wavy exclamation of strong feeling", uk: "Хвиляста оклична інтонація сильного почуття", pt: "Exclamação ondulada de sentimento forte", fr: "Exclamation ondulée d’un sentiment fort", de: "Gewellter Ausruf starker Gefühle", it: "Esclamazione ondulata di forte sentimento", pl: "Falisty okrzyk silnego uczucia", tr: "Güçlü duyguyu anlatan dalgalı ünlem", id: "Seruan bergelombang yang menyatakan perasaan kuat", vi: "Câu cảm thán uốn lượn của cảm xúc mạnh" }
            ex: "¡Mira que lo sé, Ana, que lo sé!"
            tr: { en: "Oh, I know, Ana, I know!", uk: "Та знаю я, Ано, знаю!", pt: "Eu sei, Ana, eu sei!", fr: "Je le sais bien, Ana, je le sais !", de: "Ich weiß es doch, Ana, ich weiß es!", it: "Lo so, Ana, lo so!", pl: "Wiem, Ano, wiem!", tr: "Biliyorum Ana, biliyorum!", id: "Saya tahu, Ana, saya tahu!", vi: "Tôi biết mà, Ana, tôi biết mà!" }
          - level: C2
            act: { es: Lamento, en: "Lament", uk: "Жалкування", pt: "Lamento", fr: "Lamentation", de: "Klage", it: "Lamento", pl: "Lament", tr: "Yakınma", id: "Ratapan", vi: "Than thở" }
            ex: { examples: ["¡Si pudiera volver atrás!", "¡Vaya semana me espera!"] }
            tr: { en: { examples: ["If only I could go back!", "What a week I have ahead of me!"] }, uk: { examples: ["Якби я міг повернутися назад!", "Ну й тиждень на мене чекає!"] }, pt: { examples: ["Se eu pudesse voltar atrás!", "Que semana me espera!"] }, fr: { examples: ["Si seulement je pouvais revenir en arrière !", "Quelle semaine m’attend !"] }, de: { examples: ["Könnte ich nur zurück!", "Was für eine Woche steht mir bevor!"] }, it: { examples: ["Se potessi tornare indietro!", "Che settimana mi aspetta!"] }, pl: { examples: ["Gdybym mógł się cofnąć!", "Co to będzie za tydzień!"] }, tr: { examples: ["Keşke geri dönebilsem!", "Beni nasıl bir hafta bekliyor!"] }, id: { examples: ["Seandainya saya bisa kembali ke masa lalu!", "Minggu yang berat menanti saya!"] }, vi: { examples: ["Giá mà tôi có thể quay lại!", "Một tuần thật vất vả đang chờ tôi!"] } }
          - level: C2
            act: { es: Saludo y deseo refinados, en: "Refined greeting and wish", uk: "Вишукане привітання й побажання", pt: "Saudação e desejo refinados", fr: "Salutation et souhait raffinés", de: "Gehobener Gruß und Wunsch", it: "Saluto e augurio raffinati", pl: "Wyszukane powitanie i życzenie", tr: "Zarif selamlama ve dilek", id: "Salam dan harapan yang halus", vi: "Lời chào và lời chúc trang nhã" }
            ex: { examples: ["Que tengas un buen viaje.", "Que todo salga muy bien."] }
            tr: { en: { examples: ["Have a good trip.", "May everything go very well."] }, uk: { examples: ["Щасливої дороги.", "Нехай усе вийде якнайкраще."] }, pt: { examples: ["Que você tenha uma boa viagem.", "Que tudo dê muito certo."] }, fr: { examples: ["Bon voyage.", "Que tout se passe très bien."] }, de: { examples: ["Gute Reise.", "Möge alles gut gehen."] }, it: { examples: ["Buon viaggio.", "Che tutto vada benissimo."] }, pl: { examples: ["Szczęśliwej podróży.", "Niech wszystko się dobrze ułoży."] }, tr: { examples: ["İyi yolculuklar.", "Her şey çok iyi geçsin."] }, id: { examples: ["Semoga perjalananmu menyenangkan.", "Semoga semuanya berjalan dengan baik."] }, vi: { examples: ["Chúc bạn thượng lộ bình an.", "Mong mọi việc đều tốt đẹp."] } }

  - title: { es: Énfasis, en: "Emphasis", uk: "Підкреслення", pt: "Ênfase", fr: "Mise en relief", de: "Hervorhebung", it: "Enfasi", pl: "Wyróżnienie", tr: "Vurgulama", id: "Penekanan", vi: "Nhấn mạnh" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: C1
            text: { es: "El acento más fuerte y el tono más alto caen en la palabra que se destaca.", en: "The strongest stress and the highest pitch fall on the word being highlighted.", uk: "Найсильніший наголос і найвищий тон припадають на слово, яке виділяють.", pt: "O acento mais forte e o tom mais alto caem na palavra destacada.", fr: "L’accent le plus fort et le ton le plus haut tombent sur le mot mis en relief.", de: "Die stärkste Betonung und der höchste Ton liegen auf dem hervorgehobenen Wort.", it: "L'accento più forte e il tono più alto cadono sulla parola messa in risalto.", pl: "Najsilniejszy akcent i najwyższy ton padają na wyróżniony wyraz.", tr: "En güçlü vurgu ve en yüksek ton öne çıkarılan sözcüğün üzerine düşer.", id: "Tekanan terkuat dan nada tertinggi jatuh pada kata yang ditonjolkan.", vi: "Trọng âm mạnh nhất và âm vực cao nhất rơi vào từ được nhấn mạnh." }
      - type: usage
        columns:
          - { key: kind, label: { es: Énfasis, en: "Emphasis", uk: "Підкреслення", pt: "Ênfase", fr: "Mise en relief", de: "Hervorhebung", it: "Enfasi", pl: "Wyróżnienie", tr: "Vurgulama", id: "Penekanan", vi: "Nhấn mạnh" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C1
            kind: { es: De intensidad, en: "Intensity", uk: "Інтенсивності", pt: "De intensidade", fr: "D’intensité", de: "Intensität", it: "D'intensità", pl: "Intensywności", tr: "Yoğunluk", id: "Intensitas", vi: "Cường độ" }
            ex: ["Hace un calor ", { stress: insoportable }, "."]
            tr: { en: "It's unbearably hot.", uk: "Нестерпно жарко.", pt: "Faz um calor insuportável.", fr: "Il fait une chaleur insupportable.", de: "Es ist unerträglich heiß.", it: "Fa un caldo insopportabile.", pl: "Jest nieznośnie gorąco.", tr: "Hava dayanılmaz sıcak.", id: "Panasnya tak tertahankan.", vi: "Trời nóng không chịu nổi." }
          - level: C1
            kind: { es: Contrastivo, en: "Contrastive", uk: "Контрастне", pt: "Contrastivo", fr: "Contrastif", de: "Kontrastiv", it: "Contrastivo", pl: "Kontrastywne", tr: "Karşıtlık", id: "Kontras", vi: "Đối lập" }
            ex: ["Fui ", { stress: yo }, " quien lo rompió, no mi hermano."]
            tr: { en: "I'm the one who broke it, not my brother.", uk: "Це я його розбив, а не мій брат.", pt: "Fui eu quem quebrou, não meu irmão.", fr: "C’est moi qui l’ai cassé, pas mon frère.", de: "Ich war es, der es kaputt gemacht hat, nicht mein Bruder.", it: "Sono stato io a romperlo, non mio fratello.", pl: "To ja to zepsułem, nie mój brat.", tr: "Onu kıran bendim, kardeşim değil.", id: "Sayalah yang memecahkannya, bukan saudara saya.", vi: "Chính tôi làm vỡ nó, chứ không phải anh tôi." }
          - level: C1
            kind: { es: Interrogativo, en: "Interrogative", uk: "Питальне", pt: "Interrogativo", fr: "Interrogatif", de: "Fragend", it: "Interrogativo", pl: "Pytające", tr: "Soru", id: "Interogatif", vi: "Nghi vấn" }
            ex: ["¿", { stress: Que Pedro }, " se ha ido sin avisar?"]
            tr: { en: "What, Pedro left without telling anyone?", uk: "Що, Педро пішов, нікого не попередивши?", pt: "Que o Pedro foi embora sem avisar?", fr: "Quoi, Pedro est parti sans prévenir ?", de: "Was, Pedro ist gegangen, ohne Bescheid zu sagen?", it: "Che Pedro se n'è andato senza avvisare?", pl: "Co, Pedro wyszedł bez uprzedzenia?", tr: "Ne, Pedro haber vermeden mi gitti?", id: "Apa, Pedro pergi tanpa memberi tahu?", vi: "Cái gì, Pedro đi mà không báo à?" }
          - level: C1
            kind: { es: De gravedad, en: "Seriousness", uk: "Серйозності", pt: "De gravidade", fr: "De gravité", de: "Ernst", it: "Di gravità", pl: "Powagi", tr: "Ciddiyet", id: "Keseriusan", vi: "Mức độ nghiêm trọng" }
            ex: ["Esto —", { stress: créeme }, "— es muy serio."]
            tr: { en: "This—believe me—is very serious.", uk: "Це — повір мені — дуже серйозно.", pt: "Isto — acredite — é muito sério.", fr: "Ceci — crois-moi — est très sérieux.", de: "Das hier — glaub mir — ist sehr ernst.", it: "Questo — credimi — è molto serio.", pl: "To — uwierz mi — jest bardzo poważne.", tr: "Bu —inan bana— çok ciddi.", id: "Ini — percayalah — sangat serius.", vi: "Việc này — tin tôi đi — rất nghiêm trọng." }

  - title: { es: "Ritmo en refranes, canciones y poemas", en: "Rhythm in proverbs, songs and poems", uk: "Ритм у прислів’ях, піснях і віршах", pt: "Ritmo em provérbios, canções e poemas", fr: "Le rythme des proverbes, des chansons et des poèmes", de: "Rhythmus in Sprichwörtern, Liedern und Gedichten", it: "Ritmo in proverbi, canzoni e poesie", pl: "Rytm w przysłowiach, piosenkach i wierszach", tr: "Atasözlerinde, şarkılarda ve şiirlerde ritim", id: "Ritme dalam peribahasa, lagu, dan puisi", vi: "Nhịp điệu trong tục ngữ, bài hát và bài thơ" }
