          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: C2
            text: { es: Refrán, en: "Proverb", uk: "Прислів’я", pt: "Provérbio", fr: "Proverbe", de: "Sprichwort", it: "Proverbio", pl: "Przysłowie", tr: "Atasözü", id: "Peribahasa", vi: "Tục ngữ" }
            rhythm: { es: "los acentos caen a intervalos regulares y ayudan a recordarlo", en: "the stresses fall at regular intervals and help one remember it", uk: "наголоси падають через рівні проміжки й допомагають запам’ятати", pt: "os acentos caem a intervalos regulares e ajudam a lembrá-lo", fr: "les accents tombent à intervalles réguliers et aident à s’en souvenir", de: "die Betonungen fallen in gleichmäßigen Abständen und helfen beim Merken", it: "gli accenti cadono a intervalli regolari e aiutano a ricordarlo", pl: "akcenty padają w regularnych odstępach i pomagają go zapamiętać", tr: "vurgular düzenli aralıklarla düşer ve akılda kalmasına yardım eder", id: "tekanan jatuh pada interval yang teratur dan membantu mengingatnya", vi: "các trọng âm rơi đều đặn cách quãng và giúp dễ nhớ" }
            ex: ["A ", { stress: mal }, " ", { stress: tiem }, "po, ", { stress: bue }, "na ", { stress: ca }, "ra."]
            tr: { en: "Keep a brave face in bad times.", uk: "У лиху годину тримай голову високо.", pt: "Na hora difícil, mantenha o bom humor.", fr: "Dans l’adversité, il faut garder bonne figure.", de: "In schlechten Zeiten Haltung bewahren.", it: "Nelle difficoltà, fai buon viso.", pl: "W trudnych chwilach zachowaj pogodną minę.", tr: "Zor zamanda yüzünü asma.", id: "Di masa sulit, tetaplah tegar.", vi: "Lúc gặp khó khăn, hãy giữ nét mặt vui tươi." }
          - level: C2
            text: { es: Poema, en: "Poem", uk: "Вірш", pt: "Poema", fr: "Poème", de: "Gedicht", it: "Poesia", pl: "Wiersz", tr: "Şiir", id: "Puisi", vi: "Bài thơ" }
            rhythm: { es: "el verso tiene un número fijo de sílabas y sus acentos caen en lugares fijos", en: "the line has a fixed number of syllables and its stresses fall in fixed places", uk: "рядок має сталу кількість складів, а його наголоси припадають на сталі місця", pt: "o verso tem um número fixo de sílabas e seus acentos caem em lugares fixos", fr: "le vers a un nombre fixe de syllabes et ses accents tombent à des places fixes", de: "die Verszeile hat eine feste Silbenzahl und ihre Betonungen liegen an festen Stellen", it: "il verso ha un numero fisso di sillabe e i suoi accenti cadono in posti fissi", pl: "wers ma stałą liczbę sylab, a jego akcenty padają w stałych miejscach", tr: "dizenin hece sayısı sabittir ve vurguları sabit yerlere düşer", id: "larik memiliki jumlah suku kata yang tetap dan tekanannya jatuh di tempat yang tetap", vi: "mỗi câu thơ có số âm tiết cố định và các trọng âm rơi ở vị trí cố định" }
            ex: { examples: [["Cami", { stress: nan }, "te, no ", { stress: hay }, " ca", { stress: mi }, "no,"], ["se ", { stress: ha }, "ce ca", { stress: mi }, "no al an", { stress: dar }, "."]] }
            tr: { en: { examples: ["Traveller, there is no path,", "the path is made by walking."] }, uk: { examples: ["Мандрівнику, шляху немає,", "шлях торується ходою."] }, pt: { examples: ["Caminhante, não há caminho,", "o caminho se faz ao andar."] }, fr: { examples: ["Voyageur, il n’y a pas de chemin,", "le chemin se fait en marchant."] }, de: { examples: ["Wanderer, es gibt keinen Weg,", "der Weg entsteht beim Gehen."] }, it: { examples: ["Viandante, non c'è cammino,", "il cammino si fa camminando."] }, pl: { examples: ["Wędrowcze, nie ma drogi,", "drogę tworzy się, idąc."] }, tr: { examples: ["Yolcu, yol yok,", "yol yürüdükçe oluşur."] }, id: { examples: ["Pengembara, tak ada jalan,", "jalan terbentuk saat melangkah."] }, vi: { examples: ["Người lữ hành ơi, không có đường đi,", "đường sinh ra khi ta bước đi."] } }
          - level: C2
            text: { es: Canción, en: "Song", uk: "Пісня", pt: "Canção", fr: "Chanson", de: "Lied", it: "Canzone", pl: "Piosenka", tr: "Şarkı", id: "Lagu", vi: "Bài hát" }
            rhythm: { es: "el compás de la música puede mover el acento de una palabra", en: "the beat of the music can move the stress of a word", uk: "такт музики може змістити наголос слова", pt: "o compasso da música pode mover o acento de uma palavra", fr: "la mesure de la musique peut déplacer l’accent d’un mot", de: "der Takt der Musik kann die Betonung eines Wortes verschieben", it: "il tempo della musica può spostare l'accento di una parola", pl: "takt muzyki może przesunąć akcent wyrazu", tr: "müziğin ölçüsü bir sözcüğün vurgusunu kaydırabilir", id: "birama musik dapat menggeser tekanan sebuah kata", vi: "nhịp của bản nhạc có thể làm dời trọng âm của một từ" }
            ex: ["mira", { stress: la }, ", mira", { stress: la }]
            tr: { en: "Look at her, look at her.", uk: "Дивись на неї, дивись на неї.", pt: "Olhe pra ela, olhe pra ela.", fr: "Regarde-la, regarde-la.", de: "Schau sie an, schau sie an.", it: "Guardala, guardala.", pl: "Patrz na nią, patrz na nią.", tr: "Ona bak, ona bak.", id: "Lihatlah dia, lihatlah dia.", vi: "Nhìn cô ấy kìa, nhìn cô ấy kìa." }

  - title: { es: Errores frecuentes, en: "Typical errors", uk: "Типові помилки", pt: "Erros comuns", fr: "Erreurs fréquentes", de: "Typische Fehler", it: "Errori frequenti", pl: "Typowe błędy", tr: "Sık yapılan hatalar", id: "Kesalahan umum", vi: "Lỗi thường gặp" }
