  - title: { es: Actos de habla expresivos, en: "Expressive speech acts", uk: "Експресивні мовленнєві акти", pt: "Atos de fala expressivos", fr: "Actes de parole expressifs", de: "Expressive Sprechakte", it: "Atti linguistici espressivi", pl: "Ekspresywne akty mowy", tr: "Duygu bildiren söz edimleri", id: "Tindak tutur ekspresif", vi: "Hành động ngôn ngữ biểu cảm" }
    role: own
    content:
      - type: usage
        columns:
          - { key: act, label: { es: Acto, en: "Speech act", uk: "Мовленнєвий акт", pt: "Ato de fala", fr: "Acte de parole", de: "Sprechakt", it: "Atto linguistico", pl: "Akt mowy", tr: "Söz edimi", id: "Tindak tutur", vi: "Hành động ngôn ngữ" } }
