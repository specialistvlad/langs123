            kind: { es: Completa, en: "Complete", uk: "Повний", pt: "Completa", fr: "Complète", de: "Vollständig", it: "Completo", pl: "Pełne", tr: "Tam", id: "Lengkap", vi: "Đầy đủ" }
            contour: { es: "la voz sube un poco en cada elemento y baja en el último", en: "the voice rises a little on each item and falls on the last", uk: "голос трохи підвищується на кожному елементі й знижується на останньому", pt: "a voz sobe um pouco em cada elemento e desce no último", fr: "la voix monte un peu sur chaque élément et descend sur le dernier", de: "die Stimme steigt bei jedem Glied leicht an und fällt beim letzten", it: "la voce sale un po' su ogni elemento e scende sull'ultimo", pl: "głos lekko podnosi się na każdym elemencie i opada na ostatnim", tr: "ses her öğede biraz yükselir, sonuncuda alçalır", id: "suara naik sedikit pada setiap unsur dan turun pada unsur terakhir", vi: "giọng lên nhẹ ở mỗi thành phần và xuống ở thành phần cuối" }
            ex: ["En la nevera hay leche, ", { intonation: rise }, " huevos, ", { intonation: rise }, " queso ", { intonation: rise }, " y jamón. ", { intonation: fall }]
            tr: { en: "There is milk, eggs, cheese and ham in the fridge.", uk: "У холодильнику є молоко, яйця, сир і шинка.", pt: "Na geladeira há leite, ovos, queijo e presunto.", fr: "Dans le frigo, il y a du lait, des œufs, du fromage et du jambon.", de: "Im Kühlschrank sind Milch, Eier, Käse und Schinken.", it: "In frigo ci sono latte, uova, formaggio e prosciutto.", pl: "W lodówce jest mleko, jajka, ser i szynka.", tr: "Buzdolabında süt, yumurta, peynir ve jambon var.", id: "Di kulkas ada susu, telur, keju, dan ham.", vi: "Trong tủ lạnh có sữa, trứng, phô mai và giăm bông." }
          - level: B2
            kind: { es: Incompleta, en: "Incomplete", uk: "Неповний", pt: "Incompleta", fr: "Incomplète", de: "Unvollständig", it: "Incompleto", pl: "Niepełne", tr: "Eksik", id: "Tidak lengkap", vi: "Không đầy đủ" }
            contour: { es: "la voz se mantiene a la misma altura, también en el último elemento", en: "the voice stays at the same pitch, also on the last item", uk: "голос лишається на тій самій висоті, і на останньому елементі також", pt: "a voz se mantém na mesma altura, também no último elemento", fr: "la voix reste à la même hauteur, y compris sur le dernier élément", de: "die Stimme bleibt auf gleicher Höhe, auch beim letzten Glied", it: "la voce resta alla stessa altezza, anche sull'ultimo elemento", pl: "głos pozostaje na tej samej wysokości, także na ostatnim elemencie", tr: "ses aynı yükseklikte kalır, son öğede de", id: "suara tetap pada ketinggian yang sama, juga pada unsur terakhir", vi: "giọng giữ nguyên độ cao, kể cả ở thành phần cuối" }
            ex: "Había sillas, mesas, bancos, etcétera."
            tr: { en: "There were chairs, tables, benches and so on.", uk: "Там були стільці, столи, лавки тощо.", pt: "Havia cadeiras, mesas, bancos etc.", fr: "Il y avait des chaises, des tables, des bancs, etc.", de: "Es gab Stühle, Tische, Bänke und so weiter.", it: "C'erano sedie, tavoli, panche eccetera.", pl: "Były krzesła, stoły, ławki itd.", tr: "Sandalyeler, masalar, banklar vb. vardı.", id: "Ada kursi, meja, bangku, dan sebagainya.", vi: "Có ghế, bàn, ghế dài, v.v." }
          - level: B2
            kind: { es: Descriptiva, en: "Descriptive", uk: "Описовий", pt: "Descritiva", fr: "Descriptive", de: "Beschreibend", it: "Descrittivo", pl: "Opisowe", tr: "Betimleyici", id: "Deskriptif", vi: "Miêu tả" }
            contour: { es: "cada acción forma una unidad corta y la última baja", en: "each action forms a short unit and the last one falls", uk: "кожна дія утворює коротку групу, а остання знижується", pt: "cada ação forma um grupo curto e a última desce", fr: "chaque action forme un groupe court et la dernière descend", de: "jede Handlung bildet eine kurze Gruppe und die letzte fällt ab", it: "ogni azione forma un gruppo breve e l'ultima scende", pl: "każda czynność tworzy krótką grupę, a ostatnia opada", tr: "her eylem kısa bir birim oluşturur ve sonuncusunda ses alçalır", id: "setiap tindakan membentuk unit pendek dan yang terakhir turun", vi: "mỗi hành động tạo thành một đơn vị ngắn và đơn vị cuối hạ giọng" }
            ex: ["Me levanto, me visto, desayuno y salgo a ", { target: trabajar }, ". ", { intonation: fall }]
            tr: { en: "I get up, get dressed, have breakfast and go out to work.", uk: "Я встаю, одягаюся, снідаю й іду на роботу.", pt: "Eu me levanto, me visto, tomo café da manhã e saio para trabalhar.", fr: "Je me lève, je m’habille, je prends mon petit-déjeuner et je pars travailler.", de: "Ich stehe auf, ziehe mich an, frühstücke und gehe zur Arbeit.", it: "Mi alzo, mi vesto, faccio colazione ed esco per andare a lavorare.", pl: "Wstaję, ubieram się, jem śniadanie i wychodzę do pracy.", tr: "Kalkarım, giyinirim, kahvaltı ederim ve işe çıkarım.", id: "Saya bangun, berpakaian, sarapan, lalu berangkat kerja.", vi: "Tôi thức dậy, mặc quần áo, ăn sáng rồi đi làm." }
          - level: B2
            kind: { es: Distributiva, en: "Distributive", uk: "Розподільний", pt: "Distributiva", fr: "Distributive", de: "Verteilend", it: "Distributivo", pl: "Dystrybutywne", tr: "Dağıtıcı", id: "Distributif", vi: "Phân phối" }
            contour: { es: "una pausa separa cada grupo y el tono se repite en cada uno", en: "a pause separates each group and the pitch pattern repeats in each", uk: "пауза відокремлює кожну групу, і тон повторюється в кожній", pt: "uma pausa separa cada grupo e o tom se repete em cada um", fr: "une pause sépare chaque groupe et le ton se répète dans chacun", de: "eine Pause trennt jede Gruppe und der Ton wiederholt sich in jeder", it: "una pausa separa ogni gruppo e il tono si ripete in ciascuno", pl: "pauza oddziela każdą grupę, a ton powtarza się w każdej z nich", tr: "her grubu bir duraklama ayırır ve aynı ton her grupta tekrarlanır", id: "sebuah jeda memisahkan setiap kelompok dan nada yang sama berulang di setiap kelompok", vi: "một chỗ ngắt tách từng nhóm và âm điệu lặp lại ở mỗi nhóm" }
            ex: "Unos estudian, // otros trabajan, // otros descansan."
            tr: { en: "Some study, others work, others rest.", uk: "Одні вчаться, інші працюють, ще інші відпочивають.", pt: "Uns estudam, outros trabalham, outros descansam.", fr: "Les uns étudient, les autres travaillent, d’autres se reposent.", de: "Die einen lernen, andere arbeiten, wieder andere ruhen sich aus.", it: "Alcuni studiano, altri lavorano, altri riposano.", pl: "Jedni się uczą, inni pracują, jeszcze inni odpoczywają.", tr: "Kimi okur, kimi çalışır, kimi dinlenir.", id: "Ada yang belajar, ada yang bekerja, ada yang beristirahat.", vi: "Người thì học, người thì làm việc, người thì nghỉ ngơi." }
          - level: C1
            kind: { es: Interior, en: "Internal", uk: "Внутрішній", pt: "Interior", fr: "Intérieure", de: "Eingebettet", it: "Interno", pl: "Wewnętrzne", tr: "İç", id: "Di dalam kalimat", vi: "Nằm trong câu" }
            contour: { es: "la lista queda dentro de la frase: la voz no cierra y la cadencia llega al final de la oración", en: "the list sits inside the sentence: the voice does not close, and the cadence comes at the end of the sentence", uk: "перелік стоїть усередині речення: голос не завершує, і каденція настає наприкінці речення", pt: "a lista fica dentro da frase: a voz não fecha e a cadência chega ao final da oração", fr: "la liste est insérée dans la phrase : la voix ne se ferme pas et la cadence arrive à la fin de la phrase", de: "die Aufzählung steht mitten im Satz: die Stimme schließt nicht ab, und die Kadenz kommt am Satzende", it: "l'elenco è dentro la frase: la voce non chiude e la cadenza arriva alla fine della frase", pl: "wyliczenie stoi wewnątrz zdania: głos nie zamyka się, a kadencja pojawia się na końcu zdania", tr: "sıralama cümlenin içindedir: ses kapanmaz, kadans cümlenin sonunda gelir", id: "daftar berada di dalam kalimat: suara tidak menutup, dan kadens datang di akhir kalimat", vi: "danh sách nằm trong câu: giọng không khép lại, và hạ giọng hẳn chỉ đến ở cuối câu" }
            ex: "En una mudanza, las cajas, el polvo, las prisas cansan a cualquiera."
            tr: { en: "In a house move, the boxes, the dust and the rush tire anyone out.", uk: "Під час переїзду коробки, пил, поспіх втомлять будь-кого.", pt: "Numa mudança, as caixas, a poeira e a pressa cansam qualquer um.", fr: "Dans un déménagement, les cartons, la poussière, la précipitation fatiguent n’importe qui.", de: "Bei einem Umzug machen die Kisten, der Staub und die Hetze jeden müde.", it: "In un trasloco, gli scatoloni, la polvere, la fretta stancano chiunque.", pl: "Podczas przeprowadzki pudła, kurz i pośpiech zmęczą każdego.", tr: "Taşınırken kolilerle, tozla, telaşla herkes yorulur.", id: "Saat pindahan, kardus, debu, dan keburu-buru melelahkan siapa saja.", vi: "Khi chuyển nhà, thùng đồ, bụi bặm và sự vội vã làm ai cũng mệt." }
          - level: C1
            kind: { es: Acumulativa, en: "Cumulative", uk: "Накопичувальний", pt: "Acumulativa", fr: "Cumulative", de: "Häufend", it: "Cumulativo", pl: "Kumulatywne", tr: "Birikimli", id: "Kumulatif", vi: "Dồn tích" }
            contour: { es: ["los elementos van unidos por ", { term: y }, " y la voz repite el mismo movimiento en cada uno"], en: ["the items are joined by ", { term: y }, " and the voice repeats the same movement on each"], uk: ["елементи з’єднані словом ", { term: y }, ", і голос повторює той самий рух на кожному"], pt: ["os elementos são unidos por ", { term: y }, " e a voz repete o mesmo movimento em cada um"], fr: ["les éléments sont reliés par ", { term: y }, " et la voix répète le même mouvement sur chacun"], de: ["die Glieder sind durch ", { term: y }, " verbunden und die Stimme wiederholt dieselbe Bewegung bei jedem"], it: ["gli elementi sono uniti da ", { term: y }, " e la voce ripete lo stesso movimento su ciascuno"], pl: ["elementy są połączone spójnikiem ", { term: y }, ", a głos powtarza ten sam ruch na każdym z nich"], tr: ["öğeler ", { term: y }, " ile bağlanır ve ses her birinde aynı hareketi tekrarlar"], id: ["unsur-unsurnya dihubungkan dengan ", { term: y }, " dan suara mengulang gerakan yang sama pada setiap unsur"], vi: ["các thành phần được nối bằng ", { term: y }, " và giọng lặp lại cùng một chuyển động ở mỗi thành phần"] }
            ex: "Gritó y lloró y pataleó hasta quedarse dormido."
            tr: { en: "He shouted and cried and stamped his feet until he fell asleep.", uk: "Він кричав, і плакав, і тупотів ногами, аж поки заснув.", pt: "Gritou, chorou e esperneou até adormecer.", fr: "Il a crié, et pleuré, et trépigné jusqu’à s’endormir.", de: "Er schrie und weinte und trampelte, bis er einschlief.", it: "Gridò e pianse e scalciò finché non si addormentò.", pl: "Krzyczał i płakał, i tupał, aż zasnął.", tr: "Bağırdı da ağladı da tepindi de, sonunda uyuyakaldı.", id: "Dia berteriak dan menangis dan menghentak-hentakkan kaki sampai tertidur.", vi: "Nó la, và khóc, và dậm chân, cho đến khi ngủ thiếp đi." }
          - level: C1
            kind: { es: Intensificadora, en: "Intensifying", uk: "Посилювальний", pt: "Intensificadora", fr: "Intensifiante", de: "Steigernd", it: "Intensificante", pl: "Wzmacniające", tr: "Güçlendirici", id: "Intensif", vi: "Tăng cường" }
            contour: { es: "cada elemento sube más que el anterior", en: "each item rises higher than the one before", uk: "кожен елемент звучить вище за попередній", pt: "cada elemento sobe mais do que o anterior", fr: "chaque élément monte plus haut que le précédent", de: "jedes Glied steigt höher als das vorige", it: "ogni elemento sale più del precedente", pl: "każdy element podnosi się wyżej niż poprzedni", tr: "her öğe bir öncekinden daha yükseğe çıkar", id: "setiap unsur naik lebih tinggi daripada yang sebelumnya", vi: "mỗi thành phần lên cao hơn thành phần trước" }
            ex: "No me dio ni un consejo, ni una ayuda, ni un saludo."
            tr: { en: "He gave me neither advice, nor help, nor even a greeting.", uk: "Він не дав мені ні поради, ні допомоги, ні навіть привітання.", pt: "Não me deu nem um conselho, nem uma ajuda, nem um cumprimento.", fr: "Il ne m’a donné ni un conseil, ni une aide, ni même un salut.", de: "Er gab mir weder einen Rat noch Hilfe noch einen Gruß.", it: "Non mi ha dato né un consiglio, né un aiuto, né un saluto.", pl: "Nie dał mi ani rady, ani pomocy, ani nawet powitania.", tr: "Bana ne bir öğüt verdi, ne bir yardım etti, ne de bir selam.", id: "Dia tidak memberi saya nasihat, bantuan, atau bahkan sapaan.", vi: "Anh ta không cho tôi một lời khuyên, một sự giúp đỡ, hay một lời chào nào." }
          - level: C1
            kind: { es: Matizadora, en: "Qualifying", uk: "Уточнювальний", pt: "Matizadora", fr: "Nuancée", de: "Abstufend", it: "Sfumata", pl: "Doprecyzowujące", tr: "Ayrıntılandıran", id: "Merinci", vi: "Làm rõ sắc thái" }
            contour: { es: "cada elemento precisa al anterior y la voz baja un poco en cada uno", en: "each item qualifies the one before and the voice falls a little on each", uk: "кожен елемент уточнює попередній, і голос трохи знижується на кожному", pt: "cada elemento precisa o anterior e a voz desce um pouco em cada um", fr: "chaque élément précise le précédent et la voix baisse un peu sur chacun", de: "jedes Glied präzisiert das vorige und die Stimme sinkt bei jedem ein wenig", it: "ogni elemento precisa il precedente e la voce scende un po' su ciascuno", pl: "każdy element doprecyzowuje poprzedni, a głos lekko opada na każdym z nich", tr: "her öğe bir öncekini inceltir ve ses her birinde biraz alçalır", id: "setiap unsur memperinci unsur sebelumnya dan suara turun sedikit pada setiap unsur", vi: "mỗi thành phần làm rõ thêm thành phần trước và giọng hạ nhẹ ở mỗi thành phần" }
            ex: "Es amable, atento, algo tímido."
            tr: { en: "He is kind, attentive, a little shy.", uk: "Він привітний, уважний, трохи сором’язливий.", pt: "É gentil, atencioso, um pouco tímido.", fr: "Il est aimable, attentionné, un peu timide.", de: "Er ist freundlich, aufmerksam, ein wenig schüchtern.", it: "È gentile, premuroso, un po' timido.", pl: "Jest miły, uważny, trochę nieśmiały.", tr: "Nazik, ilgili, biraz çekingen.", id: "Dia ramah, perhatian, agak pemalu.", vi: "Anh ấy tốt bụng, chu đáo, hơi nhút nhát." }
          - level: C1
            kind: { es: Valorativa, en: "Evaluative", uk: "Оцінний", pt: "Valorativa", fr: "Évaluative", de: "Wertend", it: "Valutativa", pl: "Oceniające", tr: "Değerlendirici", id: "Evaluatif", vi: "Đánh giá" }
            contour: { es: "el último elemento valora todo lo anterior y la voz baja del todo", en: "the last item evaluates everything before it and the voice falls all the way", uk: "останній елемент оцінює все сказане раніше, і голос знижується до кінця", pt: "o último elemento avalia tudo o que veio antes e a voz desce por completo", fr: "le dernier élément évalue tout ce qui précède et la voix descend tout à fait", de: "das letzte Glied bewertet alles Vorige und die Stimme fällt ganz ab", it: "l'ultimo elemento valuta tutto il precedente e la voce scende del tutto", pl: "ostatni element ocenia wszystko, co było wcześniej, a głos opada całkowicie", tr: "son öğe öncekilerin hepsini değerlendirir ve ses iyice alçalır", id: "unsur terakhir menilai semua yang mendahuluinya dan suara turun sepenuhnya", vi: "thành phần cuối đánh giá toàn bộ những gì đứng trước và giọng hạ hẳn" }
            ex: "Llegamos tarde, mojados y sin maletas: un desastre."
            tr: { en: "We arrived late, soaked and without suitcases: a disaster.", uk: "Ми приїхали пізно, мокрі й без валіз: катастрофа.", pt: "Chegamos tarde, molhados e sem malas: um desastre.", fr: "Nous sommes arrivés en retard, trempés et sans valises : un désastre.", de: "Wir kamen spät an, nass und ohne Koffer: eine Katastrophe.", it: "Siamo arrivati tardi, bagnati e senza valigie: un disastro.", pl: "Przyjechaliśmy późno, przemoczeni i bez walizek: katastrofa.", tr: "Geç kaldık, ıslak ve bavulsuz geldik: tam bir felaket.", id: "Kami tiba terlambat, basah kuyup, dan tanpa koper: sungguh bencana.", vi: "Chúng tôi đến muộn, ướt sũng và không có va li: một thảm họa." }
          - level: C1
            kind: { es: Enfática, en: "Emphatic", uk: "Емфатичний", pt: "Enfática", fr: "Emphatique", de: "Nachdrücklich", it: "Enfatica", pl: "Emfatyczne", tr: "Vurgulu", id: "Penuh penekanan", vi: "Nhấn mạnh" }
            contour: { es: "la voz sube con fuerza en cada elemento y baja en el último", en: "the voice rises strongly on each item and falls on the last", uk: "голос сильно підвищується на кожному елементі й знижується на останньому", pt: "a voz sobe com força em cada elemento e desce no último", fr: "la voix monte avec force sur chaque élément et descend sur le dernier", de: "die Stimme steigt bei jedem Glied kräftig an und fällt beim letzten", it: "la voce sale con forza su ogni elemento e scende sull'ultimo", pl: "głos mocno podnosi się na każdym elemencie i opada na ostatnim", tr: "ses her öğede güçlü biçimde yükselir, sonuncuda alçalır", id: "suara naik kuat pada setiap unsur dan turun pada unsur terakhir", vi: "giọng lên mạnh ở mỗi thành phần và xuống ở thành phần cuối" }
            ex: "Y me entran unas ganas de llorar y una rabia y un cansancio enormes."
            tr: { en: "And I feel such an urge to cry, and such rage, and such enormous exhaustion.", uk: "І мене охоплює бажання плакати, і лють, і величезна втома.", pt: "E me dá uma vontade de chorar, uma raiva e um cansaço enormes.", fr: "Et il me prend une envie de pleurer, et une rage, et une fatigue énormes.", de: "Und mich überkommen ein riesiger Drang zu weinen und eine Wut und eine Erschöpfung.", it: "E mi vengono una voglia di piangere e una rabbia e una stanchezza enormi.", pl: "I ogarnia mnie ogromna ochota do płaczu, i złość, i zmęczenie.", tr: "Bir de öyle büyük bir ağlama isteği, bir öfke, bir yorgunluk geliyor ki.", id: "Dan saya merasa ingin menangis, dan marah, dan lelah, semuanya luar biasa.", vi: "Và tôi thấy muốn khóc, và giận dữ, và mệt mỏi vô cùng." }
      - type: list
        items:
          - type: rule
            level: C1
            text: { es: "A mayor intensidad, más amplio es el movimiento de la voz:", en: "The stronger the feeling, the wider the movement of the voice:", uk: "Чим інтенсивніше висловлювання, тим ширший рух голосу:", pt: "Quanto maior a intensidade, mais amplo é o movimento da voz:", fr: "Plus l’intensité est grande, plus le mouvement de la voix est ample :", de: "Je intensiver die Aussage, desto weiter ist die Bewegung der Stimme:", it: "Più è forte l'intensità, più è ampio il movimento della voce:", pl: "Im większa intensywność, tym szerszy ruch głosu:", tr: "Yoğunluk arttıkça sesin hareketi genişler:", id: "Semakin tinggi intensitasnya, semakin lebar gerakan suara:", vi: "Cường độ càng lớn, biên độ lên xuống của giọng càng rộng:" }
            ex: { examples: ["Hace frío.", "¡Hace un frío horrible!"] }
            tr: { en: { examples: ["It's cold.", "It's horribly cold!"] }, uk: { examples: ["Холодно.", "Жахливо холодно!"] }, pt: { examples: ["Está frio.", "Está um frio horrível!"] }, fr: { examples: ["Il fait froid.", "Il fait un froid horrible !"] }, de: { examples: ["Es ist kalt.", "Es ist furchtbar kalt!"] }, it: { examples: ["Fa freddo.", "Fa un freddo terribile!"] }, pl: { examples: ["Jest zimno.", "Jest strasznie zimno!"] }, tr: { examples: ["Hava soğuk.", "Hava korkunç soğuk!"] }, id: { examples: ["Dingin.", "Dingin sekali!"] }, vi: { examples: ["Trời lạnh.", "Trời lạnh khủng khiếp!"] } }

  - title: { es: Preguntas, en: "Questions", uk: "Питання", pt: "Perguntas", fr: "Questions", de: "Fragen", it: "Domande", pl: "Pytania", tr: "Sorular", id: "Pertanyaan", vi: "Câu hỏi" }
    role: own
    content:
      - type: usage
        columns:
          - { key: kind, label: { es: Pregunta, en: "Question", uk: "Питання", pt: "Pergunta", fr: "Question", de: "Frage", it: "Domanda", pl: "Pytanie", tr: "Soru", id: "Pertanyaan", vi: "Câu hỏi" } }
          - { key: contour, label: { es: Entonación, en: "Intonation", uk: "Інтонація", pt: "Entonação", fr: "Intonation", de: "Intonation", it: "Intonazione", pl: "Intonacja", tr: "Tonlama", id: "Intonasi", vi: "Ngữ điệu" } }
          - { key: ex, label: { es: Ejemplo, en: "Example", uk: "Приклад", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: B2
            kind: { es: Con forma de aseveración, en: "In the form of a statement", uk: "У формі розповідного речення", pt: "Em forma de afirmação", fr: "Sous forme d’affirmation", de: "In Form einer Aussage", it: "In forma di affermazione", pl: "W formie zdania oznajmującego", tr: "Olumlu cümle biçiminde", id: "Berbentuk pernyataan", vi: "Dưới dạng câu trần thuật" }
            contour: { es: "el orden es el de una afirmación y la subida final marca la pregunta", en: "the word order is that of a statement and the final rise marks the question", uk: "порядок слів як у розповідному реченні, а питання позначає підвищення наприкінці", pt: "a ordem é a de uma afirmação e a subida final marca a pergunta", fr: "l’ordre des mots est celui d’une phrase affirmative et la montée finale marque la question", de: "die Wortstellung ist die einer Aussage, und der Anstieg am Ende kennzeichnet die Frage", it: "l'ordine è quello di un'affermazione e la salita finale segna la domanda", pl: "szyk jest jak w zdaniu oznajmującym, a pytanie zaznacza podniesienie głosu na końcu", tr: "sözcük sırası olumlu cümleninkidir, soruyu sondaki yükselme belirtir", id: "urutan kata sama dengan kalimat pernyataan, dan kenaikan suara di akhir menandai pertanyaan", vi: "trật tự từ như câu khẳng định và việc lên giọng ở cuối câu đánh dấu câu hỏi" }
            ex: ["¿A que esta sopa está ", { target: buena }, "? ", { intonation: rise }]
            tr: { en: "This soup is good, isn't it?", uk: "Правда ж, цей суп смачний?", pt: "Não é que essa sopa está boa?", fr: "Elle est bonne, cette soupe, non ?", de: "Diese Suppe ist doch gut, oder?", it: "Vero che questa zuppa è buona?", pl: "Prawda, że ta zupa jest dobra?", tr: "Bu çorba güzel, değil mi?", id: "Sup ini enak, kan?", vi: "Món súp này ngon, đúng không?" }
          - level: B2
            kind: { es: Cortés, en: "Polite", uk: "Ввічливе", pt: "Cortês", fr: "Polie", de: "Höflich", it: "Cortese", pl: "Grzeczne", tr: "Nazik", id: "Sopan", vi: "Lịch sự" }
            contour: { es: "la subida final es suave y el verbo va en condicional", en: "the final rise is gentle and the verb is in the conditional", uk: "підвищення наприкінці м’яке, а дієслово стоїть в умовному способі", pt: "a subida final é suave e o verbo está no condicional", fr: "la montée finale est douce et le verbe est au conditionnel", de: "der Anstieg am Ende ist sanft und das Verb steht im Konditional", it: "la salita finale è lieve e il verbo è al condizionale", pl: "podniesienie na końcu jest łagodne, a czasownik jest w trybie warunkowym", tr: "sondaki yükselme yumuşaktır ve fiil koşul kipindedir", id: "kenaikan di akhir lembut dan kata kerja berada dalam bentuk kondisional", vi: "giọng lên nhẹ ở cuối câu và động từ ở thức điều kiện" }
            ex: ["¿Podrías ayudarme con la ", { target: maleta }, "? ", { intonation: rise }]
            tr: { en: "Could you help me with the suitcase?", uk: "Не міг би ти допомогти мені з валізою?", pt: "Você poderia me ajudar com a mala?", fr: "Pourrais-tu m’aider avec la valise ?", de: "Könntest du mir mit dem Koffer helfen?", it: "Potresti aiutarmi con la valigia?", pl: "Mógłbyś mi pomóc z walizką?", tr: "Bavulla bana yardım edebilir misin?", id: "Bisakah kamu membantu saya dengan koper ini?", vi: "Bạn có thể giúp tôi mang va li được không?" }
          - level: B2
            kind: { es: Alternativa, en: "Alternative", uk: "Альтернативне", pt: "Alternativa", fr: "Alternative", de: "Alternativ", it: "Alternativa", pl: "Alternatywne", tr: "Seçenekli", id: "Pilihan", vi: "Lựa chọn" }
            contour: { es: "la voz sube en el primer miembro y baja en el último", en: "the voice rises on the first part and falls on the last", uk: "голос підвищується на першій частині й знижується на останній", pt: "a voz sobe no primeiro membro e desce no último", fr: "la voix monte sur le premier terme et descend sur le dernier", de: "die Stimme steigt beim ersten Glied und fällt beim letzten", it: "la voce sale sul primo membro e scende sull'ultimo", pl: "głos podnosi się na pierwszym członie i opada na ostatnim", tr: "ses ilk bölümde yükselir, son bölümde alçalır", id: "suara naik pada bagian pertama dan turun pada bagian terakhir", vi: "giọng lên ở vế đầu và xuống ở vế cuối" }
            ex: ["¿Fue sin ", { target: querer }, " ", { intonation: rise }, " o fue ", { target: adrede }, "? ", { intonation: fall }]
            tr: { en: "Was it by accident or on purpose?", uk: "Це вийшло ненавмисно чи навмисне?", pt: "Foi sem querer ou foi de propósito?", fr: "C’était sans le vouloir ou exprès ?", de: "War es aus Versehen oder Absicht?", it: "È stato senza volere o di proposito?", pl: "Czy to było niechcący, czy celowo?", tr: "Kazara mıydı, yoksa bilerek mi?", id: "Apakah itu tidak sengaja atau disengaja?", vi: "Là vô tình hay cố ý?" }
          - level: B2
            kind: { es: Con palabra interrogativa, en: "With a question word", uk: "Зі питальним словом", pt: "Com palavra interrogativa", fr: "Avec un mot interrogatif", de: "Mit Fragewort", it: "Con parola interrogativa", pl: "Z zaimkiem pytajnym", tr: "Soru sözcüklü", id: "Dengan kata tanya", vi: "Có từ để hỏi" }
            contour: { es: "el tono es alto en esa palabra y la voz baja al final", en: "the pitch is high on that word and the voice falls at the end", uk: "тон на цьому слові високий, а наприкінці голос знижується", pt: "o tom é alto nessa palavra e a voz desce no final", fr: "le ton est haut sur ce mot et la voix descend à la fin", de: "die Tonhöhe ist bei diesem Wort hoch und die Stimme fällt am Ende", it: "il tono è alto su quella parola e la voce scende alla fine", pl: "ton jest wysoki na tym słowie, a głos opada na końcu", tr: "o sözcükte ses tonu yüksektir, sonda ses alçalır", id: "nada tinggi pada kata itu dan suara turun di akhir", vi: "âm vực cao ở từ đó và giọng xuống ở cuối câu" }
            ex: ["¿", { target: Dónde }, " vives? ", { intonation: fall }]
            tr: { en: "Where do you live?", uk: "Де ти живеш?", pt: "Onde você mora?", fr: "Où habites-tu ?", de: "Wo wohnst du?", it: "Dove vivi?", pl: "Gdzie mieszkasz?", tr: "Nerede yaşıyorsun?", id: "Di mana kamu tinggal?", vi: "Bạn sống ở đâu?" }
          - level: C1
            kind: { es: Restrictiva, en: "Restrictive", uk: "Уточнювальне", pt: "Restritiva", fr: "Restrictive", de: "Einschränkend", it: "Restrittiva", pl: "Ograniczające", tr: "Sınırlayıcı", id: "Restriktif", vi: "Giới hạn" }
            contour: { es: "pide confirmar un dato concreto y la voz sube al final", en: "asks to confirm one specific detail and the voice rises at the end", uk: "просить підтвердити конкретну відомість, і голос підвищується наприкінці", pt: "pede a confirmação de um dado concreto e a voz sobe no final", fr: "demande de confirmer une donnée précise et la voix monte à la fin", de: "bittet um Bestätigung einer bestimmten Angabe und die Stimme steigt am Ende", it: "chiede di confermare un dato preciso e la voce sale alla fine", pl: "prosi o potwierdzenie konkretnej informacji, a głos podnosi się na końcu", tr: "belirli bir bilginin doğrulanmasını ister ve ses sonda yükselir", id: "meminta konfirmasi satu informasi tertentu dan suara naik di akhir", vi: "yêu cầu xác nhận một thông tin cụ thể và giọng lên ở cuối câu" }
            ex: ["¿Eres tú el que dejó la puerta ", { target: abierta }, "? ", { intonation: rise }]
            tr: { en: "Are you the one who left the door open?", uk: "Це ти залишив двері відчиненими?", pt: "É você quem deixou a porta aberta?", fr: "C’est toi qui as laissé la porte ouverte ?", de: "Bist du derjenige, der die Tür offen gelassen hat?", it: "Sei tu quello che ha lasciato la porta aperta?", pl: "To ty zostawiłeś otwarte drzwi?", tr: "Kapıyı açık bırakan sen misin?", id: "Apakah kamu yang meninggalkan pintu terbuka?", vi: "Có phải bạn đã để cửa mở không?" }
          - level: C1
            kind: { es: Repetidora, en: "Echo", uk: "Повторне", pt: "Em eco", fr: "En écho", de: "Echo-", it: "Eco", pl: "Powtarzające", tr: "Yineleme", id: "Pengulangan", vi: "Lặp lại" }
            contour: { es: "repite lo dicho para confirmarlo y la voz sube al final", en: "repeats what was said to confirm it and the voice rises at the end", uk: "повторює сказане, щоб підтвердити його, і голос підвищується наприкінці", pt: "repete o que foi dito para confirmá-lo e a voz sobe no final", fr: "reprend ce qui a été dit pour le confirmer et la voix monte à la fin", de: "wiederholt das Gesagte, um es zu bestätigen, und die Stimme steigt am Ende", it: "ripete quanto detto per confermarlo e la voce sale alla fine", pl: "powtarza to, co padło, aby to potwierdzić, a głos podnosi się na końcu", tr: "söyleneni doğrulamak için yineler ve ses sonda yükselir", id: "mengulang apa yang dikatakan untuk memastikannya dan suara naik di akhir", vi: "lặp lại điều vừa nói để xác nhận và giọng lên ở cuối câu" }
            ex: { examples: [["¿", { target: Que }, " si tengo hambre? ", { intonation: rise }], ["¿", { target: Cuántos }, " años he dicho que tengo? ", { intonation: rise }]] }
            tr: { en: { examples: ["Am I hungry?", "How old did I say I am?"] }, uk: { examples: ["Чи я голодний?", "Скільки, я казав, мені років?"] }, pt: { examples: ["Se eu tenho fome?", "Quantos anos eu disse que tenho?"] }, fr: { examples: ["Si j’ai faim ?", "Quel âge ai-je dit que j’avais ?"] }, de: { examples: ["Ob ich Hunger habe?", "Wie alt habe ich gesagt, dass ich bin?"] }, it: { examples: ["Se ho fame?", "Quanti anni ho detto di avere?"] }, pl: { examples: ["Czy jestem głodny?", "Ile lat powiedziałem, że mam?"] }, tr: { examples: ["Aç mıyım diye mi soruyorsun?", "Kaç yaşında olduğumu söylemiştim?"] }, id: { examples: ["Apa saya lapar?", "Tadi saya bilang umur saya berapa?"] }, vi: { examples: ["Hỏi tôi có đói không à?", "Tôi đã nói là tôi bao nhiêu tuổi nhỉ?"] } }
          - level: C1
            kind: { es: Exclamativa, en: "Exclamatory", uk: "Окличне", pt: "Exclamativa", fr: "Exclamative", de: "Ausrufend", it: "Esclamativa", pl: "Wykrzyknikowe", tr: "Ünlem biçimli", id: "Eksklamatif", vi: "Cảm thán" }
            contour: { es: "expresa sorpresa o protesta, con el contorno de una exclamación", en: "expresses surprise or protest, with the contour of an exclamation", uk: "виражає здивування або протест, з контуром окличного речення", pt: "expressa surpresa ou protesto, com o contorno de uma exclamação", fr: "exprime la surprise ou la protestation, avec le contour d’une exclamation", de: "drückt Überraschung oder Protest aus, mit der Kontur eines Ausrufs", it: "esprime sorpresa o protesta, con il profilo di un'esclamazione", pl: "wyraża zdziwienie lub sprzeciw, z konturem wykrzyknienia", tr: "şaşkınlık ya da itiraz bildirir; ünlemin ezgisini taşır", id: "menyatakan keterkejutan atau protes, dengan kontur seruan", vi: "bày tỏ sự ngạc nhiên hoặc phản đối, với đường nét của câu cảm thán" }
            ex: "¿Eso lo llamas tú cocinar?"
            tr: { en: "You call that cooking?", uk: "Ти це називаєш готуванням?", pt: "Você chama isso de cozinhar?", fr: "Toi, tu appelles ça cuisiner ?", de: "Das nennst du kochen?", it: "Questo lo chiami cucinare?", pl: "To nazywasz gotowaniem?", tr: "Sen buna yemek yapmak mı diyorsun?", id: "Itu yang kamu sebut memasak?", vi: "Bạn gọi thế là nấu ăn à?" }
          - level: C1
            kind: { es: Hipotética, en: "Hypothetical", uk: "Гіпотетичне", pt: "Hipotética", fr: "Hypothétique", de: "Hypothetisch", it: "Ipotetica", pl: "Hipotetyczne", tr: "Varsayımsal", id: "Hipotetis", vi: "Giả định" }
            contour: { es: "supone algo y pide confirmación con una subida final", en: "assumes something and asks for confirmation with a final rise", uk: "припускає щось і просить підтвердження підвищенням наприкінці", pt: "supõe algo e pede confirmação com uma subida final", fr: "suppose quelque chose et demande confirmation par une montée finale", de: "nimmt etwas an und bittet mit einem Anstieg am Ende um Bestätigung", it: "suppone qualcosa e chiede conferma con una salita finale", pl: "zakłada coś i prosi o potwierdzenie podniesieniem głosu na końcu", tr: "bir şeyi varsayar ve sondaki yükselmeyle onay ister", id: "mengandaikan sesuatu dan meminta konfirmasi dengan kenaikan di akhir", vi: "giả định một điều và xin xác nhận bằng cách lên giọng ở cuối câu" }
            ex: ["¿Imagino que ya has hablado con ", { target: ella }, "? ", { intonation: rise }]
            tr: { en: "I suppose you've already spoken to her?", uk: "Гадаю, ти вже говорив з нею?", pt: "Imagino que você já falou com ela?", fr: "J’imagine que tu lui as déjà parlé ?", de: "Ich nehme an, du hast schon mit ihr gesprochen?", it: "Immagino che tu abbia già parlato con lei?", pl: "Wyobrażam sobie, że już z nią rozmawiałeś?", tr: "Herhalde onunla konuştun?", id: "Saya kira kamu sudah berbicara dengan dia?", vi: "Tôi đoán là bạn đã nói chuyện với cô ấy rồi chứ?" }
          - level: C1
            kind: { es: Larga, en: "Long", uk: "Довге", pt: "Longa", fr: "Longue", de: "Lang", it: "Lunga", pl: "Długie", tr: "Uzun", id: "Panjang", vi: "Dài" }
            contour: { es: "se divide en varios grupos y la subida mayor llega al final", en: "is divided into several groups and the biggest rise comes at the end", uk: "ділиться на кілька груп, і найбільше підвищення припадає на кінець", pt: "divide-se em vários grupos e a maior subida vem no final", fr: "se divise en plusieurs groupes et la plus forte montée vient à la fin", de: "gliedert sich in mehrere Gruppen, und der stärkste Anstieg kommt am Ende", it: "si divide in più gruppi e la salita maggiore arriva alla fine", pl: "dzieli się na kilka grup, a największe podniesienie głosu przypada na koniec", tr: "birkaç gruba ayrılır ve en büyük yükselme sonda gelir", id: "dibagi menjadi beberapa kelompok dan kenaikan terbesar datang di akhir", vi: "chia thành nhiều nhóm và lần lên giọng lớn nhất đến ở cuối câu" }
            ex: "¿Si te llamo mañana por la tarde, cuando salgas del trabajo, podrás hablar un rato?"
            tr: { en: "If I call you tomorrow afternoon, when you leave work, will you be able to talk for a while?", uk: "Якщо я зателефоную тобі завтра по обіді, коли ти вийдеш з роботи, ти зможеш поговорити?", pt: "Se eu ligar para você amanhã à tarde, quando sair do trabalho, você poderá conversar um pouco?", fr: "Si je t’appelle demain après-midi, quand tu sortiras du travail, pourras-tu parler un moment ?", de: "Wenn ich dich morgen Nachmittag anrufe, wenn du von der Arbeit kommst, kannst du dann kurz sprechen?", it: "Se ti chiamo domani pomeriggio, quando esci dal lavoro, potrai parlare un po'?", pl: "Jeśli zadzwonię do ciebie jutro po południu, kiedy wyjdziesz z pracy, będziesz mógł chwilę porozmawiać?", tr: "Yarın öğleden sonra, işten çıktığında seni arasam, biraz konuşabilir misin?", id: "Kalau saya meneleponmu besok sore, saat kamu pulang kerja, apakah kamu bisa bicara sebentar?", vi: "Nếu chiều mai, khi bạn tan làm, tôi gọi cho bạn thì bạn có nói chuyện một lát được không?" }
          - level: C1
            kind: { es: Con inciso interrogativo, en: "With an interrogative parenthetical", uk: "З уставним питанням", pt: "Com inciso interrogativo", fr: "Avec une incise interrogative", de: "Mit eingeschobener Frage", it: "Con inciso interrogativo", pl: "Z wtrąconym pytaniem", tr: "Araya giren soruyla", id: "Dengan sisipan tanya", vi: "Có thành phần xen là câu hỏi" }
            contour: { es: "la pregunta se intercala en una aseveración, que continúa después", en: "the question is inserted into a statement, which then continues", uk: "питання вставляється в твердження, яке потім триває", pt: "a pergunta é intercalada numa asseveração, que continua depois", fr: "la question s’intercale dans une assertion, qui se poursuit ensuite", de: "die Frage ist in eine Aussage eingeschoben, die danach weitergeht", it: "la domanda s'inserisce in un'asserzione, che poi continua", pl: "pytanie jest wtrącone w twierdzenie, które potem toczy się dalej", tr: "soru bir bildirimin arasına girer, bildirim sonra devam eder", id: "pertanyaan disisipkan ke dalam pernyataan, yang kemudian berlanjut", vi: "câu hỏi được xen vào một câu trần thuật, câu này sau đó vẫn tiếp tục" }
            ex: "Dijiste —¿te acuerdas?— que vendrías pronto."
            tr: { en: "You said—do you remember?—that you would come soon.", uk: "Ти сказав — пам’ятаєш? — що скоро прийдеш.", pt: "Você disse — lembra? — que viria logo.", fr: "Tu as dit — tu t’en souviens ? — que tu viendrais bientôt.", de: "Du hast gesagt — erinnerst du dich? —, dass du bald kommst.", it: "Hai detto — ti ricordi? — che saresti venuto presto.", pl: "Powiedziałeś — pamiętasz? — że wkrótce przyjdziesz.", tr: "Dedin ki —hatırlıyor musun?— yakında gelecektin.", id: "Kamu bilang — ingat? — bahwa kamu akan segera datang.", vi: "Bạn đã nói — bạn còn nhớ không? — là sẽ đến sớm." }
          - level: C1
            kind: { es: Con vocativo, en: "With a vocative", uk: "Зі звертанням", pt: "Com vocativo", fr: "Avec un vocatif", de: "Mit Anrede", it: "Con vocativo", pl: "Z wołaczem", tr: "Hitap sözcüğüyle", id: "Dengan kata sapaan", vi: "Có từ xưng hô" }
