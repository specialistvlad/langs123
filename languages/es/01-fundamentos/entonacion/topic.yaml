        rows:
          - level: C1
            act: { es: Deseo, en: "Wish", uk: "Бажання", pt: "Desejo", fr: "Souhait", de: "Wunsch", it: "Desiderio", pl: "Życzenie", tr: "Dilek", id: "Keinginan", vi: "Ước muốn" }
            ex: "¡Lo que daría yo por tener un día libre!"
            tr: { en: "What I wouldn't give for a day off!", uk: "Чого б я тільки не віддав за один вільний день!", pt: "O que eu daria por ter um dia livre!", fr: "Ce que je donnerais pour avoir un jour de congé !", de: "Was würde ich dafür geben, einen freien Tag zu haben!", it: "Cosa darei per un giorno libero!", pl: "Co bym dał za jeden wolny dzień!", tr: "Bir gün izin için neler vermezdim!", id: "Apa saja akan kuberikan demi sehari libur!", vi: "Tôi sẵn sàng đánh đổi mọi thứ để có một ngày nghỉ!" }
          - level: C1
            act: { es: Decepción, en: "Disappointment", uk: "Розчарування", pt: "Decepção", fr: "Déception", de: "Enttäuschung", it: "Delusione", pl: "Rozczarowanie", tr: "Hayal kırıklığı", id: "Kekecewaan", vi: "Thất vọng" }
            ex: "¡Yo que pensaba que ibas a venir!"
            tr: { en: "And there I was, thinking you were going to come!", uk: "А я думав, що ти прийдеш!", pt: "E eu achando que você ia vir!", fr: "Moi qui pensais que tu allais venir !", de: "Und ich dachte, du kommst!", it: "E io che pensavo che saresti venuto!", pl: "A ja myślałem, że przyjdziesz!", tr: "Ben de geleceksin sanıyordum!", id: "Padahal saya kira kamu akan datang!", vi: "Vậy mà tôi cứ tưởng bạn sẽ đến!" }
          - level: C1
            act: { es: Protesta, en: "Protest", uk: "Протест", pt: "Protesto", fr: "Protestation", de: "Protest", it: "Protesta", pl: "Protest", tr: "İtiraz", id: "Protes", vi: "Phản đối" }
            ex: "¡Si yo siempre llego puntual!"
            tr: { en: "But I'm always on time!", uk: "Та я ж завжди приходжу вчасно!", pt: "Mas eu sempre chego pontual!", fr: "Mais j’arrive toujours à l’heure !", de: "Ich komme doch immer pünktlich!", it: "Ma io arrivo sempre puntuale!", pl: "Przecież ja zawsze przychodzę punktualnie!", tr: "Ama ben her zaman zamanında gelirim!", id: "Lho, saya kan selalu datang tepat waktu!", vi: "Tôi lúc nào cũng đến đúng giờ mà!" }
          - level: C1
