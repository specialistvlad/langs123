# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.fundamentos.numeros
lang: es
kind: foundations
tags: [numbers, counting, ordinals]
concepts: [numbers]
related: [es.fundamentos.dias-meses-fechas, es.fundamentos.la-hora, es.sustantivo-determinantes.genero]
status: { en: draft, es: draft, uk: draft }
translated: { en: "e7c61f 429b7a 6ee02e a3267d f623d2 d1f798 ff34df efb52a abae79", uk: "e7c61f 429b7a 6ee02e a3267d f623d2 d1f798 ff34df efb52a abae79" }

title: { en: Numbers, es: Los números, uk: "Числа" }
summary:
  lead:
    en: ["Numbers from 0 to a million, the ordinals ", { term: primero }, " to ", { term: décimo }, ", and the agreement of ", { term: uno }, " and the hundreds."]
    es: ["Los números del 0 al millón, los ordinales de ", { term: primero }, " a ", { term: décimo }, ", y la concordancia de ", { term: uno }, " y de las centenas."]
    uk: ["Числа від 0 до мільйона, порядкові числівники від ", { term: "primero" }, " до ", { term: "décimo" }, " та узгодження ", { term: "uno" }, " і сотень."]
  rule:
    en: ["From 31 on, ", { term: y }, " joins the tens and the unit, written as separate words:"]
    es: ["Desde el 31, ", { term: y }, " une las decenas y la unidad, escritas en palabras separadas:"]
    uk: ["Починаючи з 31, ", { term: "y" }, " поєднує десятки й одиниці, які пишуть окремими словами:"]
  ex: { examples: [["treinta ", { target: y }, " uno"], ["noventa ", { target: y }, " nueve"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto, uk: "Аспект" } }
        - { key: rule, label: { en: Rule, es: Regla, uk: "Правило" } }
        - { key: ex, label: { en: Example, es: Ejemplo, uk: "Приклад" } }
      rows:
        - level: A0
          point: "0–15"
          rule: { en: each has its own word, es: cada uno tiene su propia palabra, uk: "кожне має власне слово" }
          ex: { examples: [{ target: once }, { target: quince }] }
          tr: { en: { examples: [eleven, fifteen] }, uk: { examples: ["одинадцять", "п’ятнадцять"] } }
        - level: A0
          point: "16–29"
          rule:
            en: ["one word: ", { term: dieci- }, " or ", { term: veinti- }, " and the unit"]
            es: ["una sola palabra: ", { term: dieci- }, " o ", { term: veinti- }, " y la unidad"]
            uk: ["одне слово: ", { term: "dieci-" }, " або ", { term: "veinti-" }, " та одиниця"]
          ex: { examples: [[{ target: dieci }, "séis"], [{ target: veinti }, "dós"]] }
          tr: { en: { examples: [sixteen, twenty-two] }, uk: { examples: ["шістнадцять", "двадцять два"] } }
        - level: A0
          point: "31–99"
          rule:
            en: ["the tens, ", { term: y }, ", the unit: three words"]
            es: ["la decena, ", { term: y }, ", la unidad: tres palabras"]
            uk: ["десятки, ", { term: "y" }, ", одиниця: три слова"]
          ex: { examples: [["treinta ", { target: y }, " uno"], ["cuarenta ", { target: y }, " cinco"]] }
          tr: { en: { examples: [thirty-one, forty-five] }, uk: { examples: ["тридцять один", "сорок п’ять"] } }
        - level: A0
          point: "100"
          rule:
            en: [{ term: cien }, " alone or before a noun, ", { term: ciento }, " before another number"]
            es: [{ term: cien }, " solo o delante de un sustantivo, ", { term: ciento }, " delante de otro número"]
            uk: [{ term: "cien" }, " — окремо або перед іменником, ", { term: "ciento" }, " — перед іншим числом"]
          ex: { examples: [[{ target: cien }, " euros"], [{ target: ciento }, " veinte"]] }
          tr: { en: { examples: [a hundred euros, a hundred and twenty] }, uk: { examples: ["сто євро", "сто двадцять"] } }
        - level: A0
          point: "1000"
          rule:
            en: [{ term: mil }, " takes no ", { term: un }, " and stays the same after any number"]
            es: [{ term: mil }, " no lleva ", { term: un }, " y no cambia detrás de ningún número"]
            uk: [{ term: "mil" }, " вживається без ", { term: "un" }, " і не змінюється після жодного числа"]
          ex: { examples: [{ target: mil }, ["tres ", { target: mil }]] }
          tr: { en: { examples: [a thousand, three thousand] }, uk: { examples: ["тисяча", "три тисячі"] } }
        - level: A1
          point: { en: Hundreds, es: Centenas, uk: "Сотні" }
          rule: { en: "from 200, they agree with the noun", es: "desde 200, concuerdan con el sustantivo", uk: "починаючи з 200, узгоджуються з іменником" }
          ex: [{ target: doscientas }, " personas"]
          tr: { en: two hundred people, uk: "двісті людей" }
        - level: A1
          point: millón
          rule:
            en: ["a noun: ", { term: millones }, " in the plural, ", { term: de }, " before what it counts"]
            es: ["es un sustantivo: ", { term: millones }, " en plural, ", { term: de }, " delante de lo que cuenta"]
            uk: ["це іменник: ", { term: "millones" }, " у множині, ", { term: "de" }, " перед тим, що лічать"]
          ex: ["dos ", { target: millones de }, " personas"]
          tr: { en: two million people, uk: "два мільйони людей" }
        - level: A1
          point: uno
          rule:
            en: [{ term: un }, " before a masculine noun, ", { term: una }, " before a feminine one"]
            es: [{ term: un }, " delante de un sustantivo masculino, ", { term: una }, " delante de un sustantivo femenino"]
            uk: [{ term: "un" }, " перед іменником чоловічого роду, ", { term: "una" }, " — перед іменником жіночого роду"]
          ex: { examples: [["veinti", { target: ún }, " años"], ["veinti", { target: una }, " casas"]] }
          tr: { en: { examples: [twenty-one years, twenty-one houses] }, uk: { examples: ["двадцять один рік", "двадцять один будинок"] } }
        - level: A1
          point: { en: Ordinals, es: Ordinales, uk: "Порядкові числівники" }
          rule:
            en: [{ term: primero }, " to ", { term: décimo }, "; they agree with the noun and go before it"]
            es: ["de ", { term: primero }, " a ", { term: décimo }, "; concuerdan con el sustantivo y van delante"]
            uk: ["від ", { term: "primero" }, " до ", { term: "décimo" }, "; узгоджуються з іменником і стоять перед ним"]
          ex: ["la ", { target: segunda }, " calle"]
          tr: { en: the second street, uk: "друга вулиця" }
        - level: A2
          point: { alternatives: [primer, tercer] }
          rule:
            en: [{ term: primero }, " and ", { term: tercero }, " drop -o before a masculine singular noun"]
            es: [{ term: primero }, " y ", { term: tercero }, " pierden la -o delante de un sustantivo masculino singular"]
            uk: [{ term: "primero" }, " і ", { term: "tercero" }, " втрачають -o перед іменником чоловічого роду в однині"]
          ex: { examples: [["el ", { target: primer }, " día"], ["el ", { target: tercer }, " piso"]] }
          tr: { en: { examples: [the first day, the third floor] }, uk: { examples: ["перший день", "третій поверх"] } }
        - level: A0
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: "500, 700 and 900 change their first part"
            es: "500, 700 y 900 cambian su primera parte"
            uk: "500, 700 і 900 змінюють свою першу частину"
          ex: { examples: [{ target: quinientos }, { target: setecientos }, { target: novecientos }] }
          tr: { en: { examples: [five hundred, seven hundred, nine hundred] }, uk: { examples: ["п’ятсот", "сімсот", "дев’ятсот"] } }
        - level: A0
          point: { en: Trap, es: Trampa, uk: "Пастка" }
          rule:
            en: ["no ", { term: y }, " after the hundreds"]
            es: ["sin ", { term: y }, " después de las centenas"]
            uk: ["без ", { term: "y" }, " після сотень"]
          ex: { examples: [{ target: ciento veinte }, { target: doscientos cinco }] }
          tr: { en: { examples: [a hundred and twenty, two hundred and five] }, uk: { examples: ["сто двадцять", "двісті п’ять"] } }

sections:
  - title: { en: "0 to 15", es: "Del 0 al 15", uk: "Від 0 до 15" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número, uk: "Число" } }
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово" } }
        rows:
          - { level: A0, value: 0, number: "0", word: cero, tr: { en: zero, uk: "нуль" } }
          - { level: A0, value: 1, number: "1", word: uno, tr: { en: one, uk: "один" } }
          - { level: A0, value: 2, number: "2", word: dos, tr: { en: two, uk: "два" } }
          - { level: A0, value: 3, number: "3", word: tres, tr: { en: three, uk: "три" } }
          - { level: A0, value: 4, number: "4", word: cuatro, tr: { en: four, uk: "чотири" } }
          - { level: A0, value: 5, number: "5", word: cinco, tr: { en: five, uk: "п’ять" } }
          - { level: A0, value: 6, number: "6", word: seis, tr: { en: six, uk: "шість" } }
          - { level: A0, value: 7, number: "7", word: siete, tr: { en: seven, uk: "сім" } }
          - { level: A0, value: 8, number: "8", word: ocho, tr: { en: eight, uk: "вісім" } }
          - { level: A0, value: 9, number: "9", word: nueve, tr: { en: nine, uk: "дев’ять" } }
          - { level: A0, value: 10, number: "10", word: diez, tr: { en: ten, uk: "десять" } }
          - { level: A0, value: 11, number: "11", word: once, tr: { en: eleven, uk: "одинадцять" } }
          - { level: A0, value: 12, number: "12", word: doce, tr: { en: twelve, uk: "дванадцять" } }
          - { level: A0, value: 13, number: "13", word: trece, tr: { en: thirteen, uk: "тринадцять" } }
          - { level: A0, value: 14, number: "14", word: catorce, tr: { en: fourteen, uk: "чотирнадцять" } }
          - { level: A0, value: 15, number: "15", word: quince, tr: { en: fifteen, uk: "п’ятнадцять" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Each number from 0 to 15 has a word of its own."
              es: "Cada número del 0 al 15 tiene una palabra propia."
              uk: "Кожне число від 0 до 15 має власне слово."
          - type: note
            level: A0
            text:
              en: "Phone numbers are often said in groups of two digits:"
              es: "Los números de teléfono se dicen a menudo en grupos de dos cifras:"
              uk: "Номери телефонів часто вимовляють групами по дві цифри:"
            ex: { mapping: ["45 67 89", { numeral: "cuarenta y cinco, sesenta y siete, ochenta y nueve", value: "456789" }] }

  - title: { en: "16 to 29", es: "Del 16 al 29", uk: "Від 16 до 29" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número, uk: "Число" } }
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово" } }
        rows:
          - { level: A0, value: 16, number: "16", word: [{ target: dieci }, "séis"], tr: { en: sixteen, uk: "шістнадцять" } }
          - { level: A0, value: 17, number: "17", word: [{ target: dieci }, "siete"], tr: { en: seventeen, uk: "сімнадцять" } }
          - { level: A0, value: 18, number: "18", word: [{ target: dieci }, "ocho"], tr: { en: eighteen, uk: "вісімнадцять" } }
          - { level: A0, value: 19, number: "19", word: [{ target: dieci }, "nueve"], tr: { en: nineteen, uk: "дев’ятнадцять" } }
          - { level: A0, value: 20, number: "20", word: veinte, tr: { en: twenty, uk: "двадцять" } }
          - { level: A0, value: 21, number: "21", word: [{ target: veinti }, "uno"], tr: { en: twenty-one, uk: "двадцять один" } }
          - { level: A0, value: 22, number: "22", word: [{ target: veinti }, "dós"], tr: { en: twenty-two, uk: "двадцять два" } }
          - { level: A0, value: 23, number: "23", word: [{ target: veinti }, "trés"], tr: { en: twenty-three, uk: "двадцять три" } }
          - { level: A0, value: 26, number: "26", word: [{ target: veinti }, "séis"], tr: { en: twenty-six, uk: "двадцять шість" } }
          - { level: A0, value: 29, number: "29", word: [{ target: veinti }, "nueve"], tr: { en: twenty-nine, uk: "двадцять дев’ять" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["16 to 19 join ", { term: dieci- }, " to the unit, and 21 to 29 join ", { term: veinti- }, ", in one word."]
              es: ["Del 16 al 19 se une ", { term: dieci- }, " a la unidad, y del 21 al 29, ", { term: veinti- }, ", en una sola palabra."]
              uk: ["Від 16 до 19 ", { term: "dieci-" }, " приєднують до одиниці, а від 21 до 29 — ", { term: "veinti-" }, ", і все це одним словом."]
          - type: rule
            level: A0
            text:
              en: [{ alternatives: [{ term: dieciséis }, { term: veintidós }, { term: veintitrés }, { term: veintiséis }] }, " carry a written accent."]
              es: [{ alternatives: [{ term: dieciséis }, { term: veintidós }, { term: veintitrés }, { term: veintiséis }] }, " llevan tilde."]
              uk: [{ alternatives: [{ term: "dieciséis" }, { term: "veintidós" }, { term: "veintitrés" }, { term: "veintiséis" }] }, " пишуться з наголосом (тильдою)."]

  - title: { en: "30 to 99", es: "Del 30 al 99", uk: "Від 30 до 99" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número, uk: "Число" } }
          - { key: word, label: { en: Word, es: Palabra, uk: "Слово" } }
        rows:
          - { level: A0, value: 30, number: "30", word: treinta, tr: { en: thirty, uk: "тридцять" } }
          - { level: A0, value: 31, number: "31", word: ["treinta ", { target: y }, " uno"], tr: { en: thirty-one, uk: "тридцять один" } }
          - { level: A0, value: 40, number: "40", word: cuarenta, tr: { en: forty, uk: "сорок" } }
          - { level: A0, value: 45, number: "45", word: ["cuarenta ", { target: y }, " cinco"], tr: { en: forty-five, uk: "сорок п’ять" } }
          - { level: A0, value: 50, number: "50", word: cincuenta, tr: { en: fifty, uk: "п’ятдесят" } }
          - { level: A0, value: 60, number: "60", word: sesenta, tr: { en: sixty, uk: "шістдесят" } }
          - { level: A0, value: 70, number: "70", word: setenta, tr: { en: seventy, uk: "сімдесят" } }
          - { level: A0, value: 80, number: "80", word: ochenta, tr: { en: eighty, uk: "вісімдесят" } }
          - { level: A0, value: 90, number: "90", word: noventa, tr: { en: ninety, uk: "дев’яносто" } }
          - { level: A0, value: 99, number: "99", word: ["noventa ", { target: y }, " nueve"], tr: { en: ninety-nine, uk: "дев’яносто дев’ять" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["From 31, the tens and the unit are separate words joined by ", { term: y }, "."]
              es: ["Desde el 31, la decena y la unidad son palabras separadas unidas por ", { term: y }, "."]
              uk: ["Починаючи з 31, десятки й одиниці — окремі слова, з’єднані ", { term: "y" }, "."]

  - title: { en: "Hundreds, thousands, millions", es: "Centenas, miles y millones", uk: "Сотні, тисячі, мільйони" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número, uk: "Число" } }
          - { key: words, label: { en: Words, es: Palabras, uk: "Слова" } }
        rows:
          - { level: A0, value: 100, number: "100", words: { target: cien }, tr: { en: a hundred, uk: "сто" } }
          - { level: A0, value: 101, number: "101", words: [{ target: ciento }, " uno"], tr: { en: a hundred and one, uk: "сто один" } }
          - { level: A0, value: 200, number: "200", words: doscientos, tr: { en: two hundred, uk: "двісті" } }
          - { level: A0, value: 300, number: "300", words: trescientos, tr: { en: three hundred, uk: "триста" } }
          - { level: A0, value: 400, number: "400", words: cuatrocientos, tr: { en: four hundred, uk: "чотириста" } }
          - { level: A0, value: 500, number: "500", words: { target: quinientos }, tr: { en: five hundred, uk: "п’ятсот" } }
          - { level: A0, value: 600, number: "600", words: seiscientos, tr: { en: six hundred, uk: "шістсот" } }
          - { level: A0, value: 700, number: "700", words: { target: setecientos }, tr: { en: seven hundred, uk: "сімсот" } }
          - { level: A0, value: 800, number: "800", words: ochocientos, tr: { en: eight hundred, uk: "вісімсот" } }
          - { level: A0, value: 900, number: "900", words: { target: novecientos }, tr: { en: nine hundred, uk: "дев’ятсот" } }
          - { level: A0, value: 1000, number: "1000", words: { target: mil }, tr: { en: a thousand, uk: "тисяча" } }
          - { level: A0, value: 2000, number: "2000", words: ["dos ", { target: mil }], tr: { en: two thousand, uk: "дві тисячі" } }
          - { level: A0, value: 10000, number: "10 000", words: ["diez ", { target: mil }], tr: { en: ten thousand, uk: "десять тисяч" } }
          - { level: A0, value: 1000000, number: "1 000 000", words: ["un ", { target: millón }], tr: { en: a million, uk: "мільйон" } }
          - { level: A0, value: 2000000, number: "2 000 000", words: ["dos ", { target: millones }], tr: { en: two million, uk: "два мільйони" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: cien }, " is 100 alone or before a noun; ", { term: ciento }, " goes before another number:"]
              es: [{ term: cien }, " es 100 solo o delante de un sustantivo; ", { term: ciento }, " va delante de otro número:"]
              uk: [{ term: "cien" }, " — це 100 окремо або перед іменником; ", { term: "ciento" }, " стоїть перед іншим числом:"]
            ex: { examples: [[{ target: cien }, " euros"], [{ target: ciento }, " veinte"]] }
            tr: { en: { examples: [a hundred euros, a hundred and twenty] }, uk: { examples: ["сто євро", "сто двадцять"] } }
          - type: rule
            level: A0
            text:
              en: ["The hundreds take no ", { term: y }, " after them:"]
              es: ["Detrás de las centenas no va ", { term: y }, ":"]
              uk: ["Після сотень ", { term: "y" }, " не вживають:"]
            ex: { examples: [{ target: ciento veinte }, { target: doscientos cinco }] }
            tr: { en: { examples: [a hundred and twenty, two hundred and five] }, uk: { examples: ["сто двадцять", "двісті п’ять"] } }
          - type: rule
            level: A0
            text:
              en: [{ term: mil }, " takes no ", { term: un }, " and keeps its form after any number."]
              es: [{ term: mil }, " no lleva ", { term: un }, " y mantiene su forma detrás de cualquier número."]
              uk: [{ term: "mil" }, " вживається без ", { term: "un" }, " і не змінює форми після будь-якого числа."]
          - type: rule
            level: A1
            text:
              en: "From 200, the hundreds agree with the noun they count:"
              es: "Desde 200, las centenas concuerdan con el sustantivo que cuentan:"
              uk: "Починаючи з 200, сотні узгоджуються з іменником, який лічать:"
            ex: { examples: [[{ target: doscientos }, " libros"], [{ target: doscientas }, " personas"]] }
            tr: { en: { examples: [two hundred books, two hundred people] }, uk: { examples: ["двісті книжок", "двісті людей"] } }
          - type: rule
            level: A1
            text:
              en: [{ term: millón }, " is a noun: its plural is ", { term: millones }, ", and ", { term: de }, " goes before what it counts:"]
              es: [{ term: millón }, " es un sustantivo: su plural es ", { term: millones }, ", y ", { term: de }, " va delante de lo que cuenta:"]
              uk: [{ term: "millón" }, " — іменник: його множина — ", { term: "millones" }, ", а перед тим, що лічать, стоїть ", { term: "de" }, ":"]
            ex: ["Hay tres ", { target: millones de }, " personas."]
            tr: { en: There are three million people., uk: "Там три мільйони людей." }
          - type: note
            level: A0
            text:
              en: "Long numbers group their digits in threes with a space: 10 000."
              es: "Los números largos agrupan sus cifras de tres en tres con un espacio: 10 000."
              uk: "У довгих числах цифри групують по три через пробіл: 10 000."
          - type: note
            level: A1
            text:
              en: "Decimals take a comma or a point: both are correct, each country has its own custom, and the sign is read aloud as written:"
              es: "Los decimales llevan coma o punto: los dos son correctos, cada país tiene su costumbre, y el signo se lee tal como se escribe:"
              uk: "Десяткові дроби пишуть із комою або крапкою: правильні обидва варіанти, кожна країна має свою звичку, а знак читають так, як написано:"
            ex: { examples: [{ mapping: ["2,5", { numeral: ["dos ", { target: coma }, " cinco"], value: 2.5 }] }, { mapping: ["2.5", { numeral: ["dos ", { target: punto }, " cinco"], value: 2.5 }] }] }

  - title: { en: "Uno, un, una", es: "Uno, un, una", uk: "Uno, un, una" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: uno }, " becomes ", { term: un }, " before a masculine noun and ", { term: una }, " before a feminine one:"]
              es: [{ term: uno }, " pasa a ", { term: un }, " delante de un sustantivo masculino y a ", { term: una }, " delante de un sustantivo femenino:"]
              uk: [{ term: "uno" }, " стає ", { term: "un" }, " перед іменником чоловічого роду і ", { term: "una" }, " — перед іменником жіночого роду:"]
            ex: { examples: [[{ target: un }, " libro"], [{ target: una }, " mesa"]] }
            tr: { en: { examples: [one book, one table] }, uk: { examples: ["одна книжка", "один стіл"] } }
          - type: rule
            level: A1
            text:
              en: "The same holds inside longer numbers:"
              es: "Lo mismo ocurre dentro de los números largos:"
              uk: "Те саме відбувається всередині довгих чисел:"
            ex: { examples: [["veinti", { target: ún }, " años"], ["treinta y ", { target: una }, " casas"]] }
            tr: { en: { examples: [twenty-one years, thirty-one houses] }, uk: { examples: ["двадцять один рік", "тридцять один будинок"] } }

  - title: { en: Ordinals, es: Los ordinales, uk: "Порядкові числівники" }
    role: own
    content:
      - type: inventory
        set: ordinals
        columns:
          - { key: number, label: { en: Number, es: Número, uk: "Число" } }
          - { key: masc, label: { en: Masculine, es: Masculino, uk: "Чоловічий рід" } }
          - { key: fem, label: { en: Feminine, es: Femenino, uk: "Жіночий рід" } }
        rows:
          - { level: A1, value: 1, number: "1.º, 1.ª", masc: primero, fem: primera, tr: { en: first, uk: "перший" } }
          - { level: A1, value: 2, number: "2.º, 2.ª", masc: segundo, fem: segunda, tr: { en: second, uk: "другий" } }
          - { level: A1, value: 3, number: "3.º, 3.ª", masc: tercero, fem: tercera, tr: { en: third, uk: "третій" } }
          - { level: A1, value: 4, number: "4.º, 4.ª", masc: cuarto, fem: cuarta, tr: { en: fourth, uk: "четвертий" } }
          - { level: A1, value: 5, number: "5.º, 5.ª", masc: quinto, fem: quinta, tr: { en: fifth, uk: "п’ятий" } }
          - { level: A1, value: 6, number: "6.º, 6.ª", masc: sexto, fem: sexta, tr: { en: sixth, uk: "шостий" } }
          - { level: A1, value: 7, number: "7.º, 7.ª", masc: séptimo, fem: séptima, tr: { en: seventh, uk: "сьомий" } }
          - { level: A1, value: 8, number: "8.º, 8.ª", masc: octavo, fem: octava, tr: { en: eighth, uk: "восьмий" } }
          - { level: A1, value: 9, number: "9.º, 9.ª", masc: noveno, fem: novena, tr: { en: ninth, uk: "дев’ятий" } }
          - { level: A1, value: 10, number: "10.º, 10.ª", masc: décimo, fem: décima, tr: { en: tenth, uk: "десятий" } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Ordinals agree with the noun and usually go before it:"
              es: "Los ordinales concuerdan con el sustantivo y suelen ir delante:"
              uk: "Порядкові числівники узгоджуються з іменником і зазвичай стоять перед ним:"
            ex: ["Es la ", { target: segunda }, " calle a la derecha."]
            tr: { en: "It's the second street on the right.", uk: "Це друга вулиця праворуч." }
          - type: rule
            level: A2
            text:
              en: [{ term: primero }, " and ", { term: tercero }, " drop the -o before a masculine singular noun:"]
              es: [{ term: primero }, " y ", { term: tercero }, " pierden la -o delante de un sustantivo masculino singular:"]
              uk: [{ term: "primero" }, " і ", { term: "tercero" }, " втрачають -o перед іменником чоловічого роду в однині:"]
            ex: { examples: [["el ", { target: primer }, " día"], ["el ", { target: tercer }, " piso"]] }
            tr: { en: { examples: [the first day, the third floor] }, uk: { examples: ["перший день", "третій поверх"] } }
          - type: rule
            level: A1
            text:
              en: "Above tenth, everyday Spanish uses the plain numbers after the noun:"
              es: "Por encima del décimo, en el uso diario se dicen los números cardinales detrás del sustantivo:"
              uk: "Після десятого в повсякденному мовленні вживають звичайні числа після іменника:"
            ex: ["Vivo en el piso ", { target: quince }, "."]
            tr: { en: I live on the fifteenth floor., uk: "Я живу на п’ятнадцятому поверсі." }

