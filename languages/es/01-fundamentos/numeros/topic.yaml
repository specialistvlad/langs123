# yaml-language-server: $schema=../../../schema/topic.schema.json
id: es.fundamentos.numeros
lang: es
kind: foundations
tags: [numbers, counting, ordinals]
concepts: [numbers]
related: [es.fundamentos.dias-meses-fechas, es.fundamentos.la-hora, es.sustantivo-determinantes.genero]
status: { en: draft, es: draft }
translated: { es: "064e13 63fbdd 270cef cafc4d 1470b7 392c36 f2719a ba1daa 8ae537" }

title: { en: Numbers, es: Los números }
summary:
  lead:
    en: ["Numbers from 0 to a million, the ordinals ", { term: primero }, " to ", { term: décimo }, ", and the agreement of ", { term: uno }, " and the hundreds."]
    es: ["Los números del 0 al millón, los ordinales de ", { term: primero }, " a ", { term: décimo }, ", y la concordancia de ", { term: uno }, " y de las centenas."]
  rule:
    en: ["From 31 on, ", { term: y }, " joins the tens and the unit, written as separate words:"]
    es: ["Desde el 31, ", { term: y }, " une las decenas y la unidad, escritas en palabras separadas:"]
  ex: { examples: [["treinta ", { target: y }, " uno"], ["noventa ", { target: y }, " nueve"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: ex, label: { en: Example, es: Ejemplo } }
      rows:
        - level: A0
          point: "0–15"
          rule: { en: each has its own word, es: cada uno tiene su propia palabra }
          ex: { examples: [{ target: once }, { target: quince }] }
          tr: { en: { examples: [eleven, fifteen] } }
        - level: A0
          point: "16–29"
          rule:
            en: ["one word: ", { term: dieci- }, " or ", { term: veinti- }, " and the unit"]
            es: ["una sola palabra: ", { term: dieci- }, " o ", { term: veinti- }, " y la unidad"]
          ex: { examples: [[{ target: dieci }, "séis"], [{ target: veinti }, "dós"]] }
          tr: { en: { examples: [sixteen, twenty-two] } }
        - level: A0
          point: "31–99"
          rule:
            en: ["the tens, ", { term: y }, ", the unit: three words"]
            es: ["la decena, ", { term: y }, ", la unidad: tres palabras"]
          ex: { examples: [["treinta ", { target: y }, " uno"], ["cuarenta ", { target: y }, " cinco"]] }
          tr: { en: { examples: [thirty-one, forty-five] } }
        - level: A0
          point: "100"
          rule:
            en: [{ term: cien }, " alone or before a noun, ", { term: ciento }, " before another number"]
            es: [{ term: cien }, " solo o delante de un nombre, ", { term: ciento }, " delante de otro número"]
          ex: { examples: [[{ target: cien }, " euros"], [{ target: ciento }, " veinte"]] }
          tr: { en: { examples: [a hundred euros, a hundred and twenty] } }
        - level: A0
          point: "1000"
          rule:
            en: [{ term: mil }, " takes no ", { term: un }, " and stays the same after any number"]
            es: [{ term: mil }, " no lleva ", { term: un }, " y no cambia detrás de ningún número"]
          ex: { examples: [{ target: mil }, ["tres ", { target: mil }]] }
          tr: { en: { examples: [a thousand, three thousand] } }
        - level: A1
          point: { en: Hundreds, es: Centenas }
          rule: { en: "from 200, they agree with the noun", es: "desde 200, concuerdan con el nombre" }
          ex: [{ target: doscientas }, " personas"]
          tr: { en: two hundred people }
        - level: A1
          point: millón
          rule:
            en: ["a noun: ", { term: millones }, " in the plural, ", { term: de }, " before what it counts"]
            es: ["es un nombre: ", { term: millones }, " en plural, ", { term: de }, " delante de lo que cuenta"]
          ex: ["dos ", { target: millones de }, " personas"]
          tr: { en: two million people }
        - level: A1
          point: uno
          rule:
            en: [{ term: un }, " before a masculine noun, ", { term: una }, " before a feminine one"]
            es: [{ term: un }, " delante de un nombre masculino, ", { term: una }, " delante de uno femenino"]
          ex: { examples: [["veinti", { target: ún }, " años"], ["veinti", { target: una }, " casas"]] }
          tr: { en: { examples: [twenty-one years, twenty-one houses] } }
        - level: A1
          point: { en: Ordinals, es: Ordinales }
          rule:
            en: [{ term: primero }, " to ", { term: décimo }, "; they agree with the noun and go before it"]
            es: ["de ", { term: primero }, " a ", { term: décimo }, "; concuerdan con el nombre y van delante"]
          ex: ["la ", { target: segunda }, " calle"]
          tr: { en: the second street }
        - level: A2
          point: { alternatives: [primer, tercer] }
          rule:
            en: [{ term: primero }, " and ", { term: tercero }, " drop -o before a masculine singular noun"]
            es: [{ term: primero }, " y ", { term: tercero }, " pierden la -o delante de un nombre masculino singular"]
          ex: { examples: [["el ", { target: primer }, " día"], ["el ", { target: tercer }, " piso"]] }
          tr: { en: { examples: [the first day, the third floor] } }
        - level: A0
          point: { en: Trap, es: Trampa }
          rule:
            en: "500, 700 and 900 change their first part"
            es: "500, 700 y 900 cambian su primera parte"
          ex: { examples: [{ target: quinientos }, { target: setecientos }, { target: novecientos }] }
          tr: { en: { examples: [five hundred, seven hundred, nine hundred] } }
        - level: A0
          point: { en: Trap, es: Trampa }
          rule:
            en: ["no ", { term: y }, " after the hundreds"]
            es: ["sin ", { term: y }, " después de las centenas"]
          ex: { examples: [{ target: ciento veinte }, { target: doscientos cinco }] }
          tr: { en: { examples: [a hundred and twenty, two hundred and five] } }

sections:
  - title: { en: "0 to 15", es: "Del 0 al 15" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número } }
          - { key: word, label: { en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 0, number: "0", word: cero, tr: { en: zero } }
          - { level: A0, value: 1, number: "1", word: uno, tr: { en: one } }
          - { level: A0, value: 2, number: "2", word: dos, tr: { en: two } }
          - { level: A0, value: 3, number: "3", word: tres, tr: { en: three } }
          - { level: A0, value: 4, number: "4", word: cuatro, tr: { en: four } }
          - { level: A0, value: 5, number: "5", word: cinco, tr: { en: five } }
          - { level: A0, value: 6, number: "6", word: seis, tr: { en: six } }
          - { level: A0, value: 7, number: "7", word: siete, tr: { en: seven } }
          - { level: A0, value: 8, number: "8", word: ocho, tr: { en: eight } }
          - { level: A0, value: 9, number: "9", word: nueve, tr: { en: nine } }
          - { level: A0, value: 10, number: "10", word: diez, tr: { en: ten } }
          - { level: A0, value: 11, number: "11", word: once, tr: { en: eleven } }
          - { level: A0, value: 12, number: "12", word: doce, tr: { en: twelve } }
          - { level: A0, value: 13, number: "13", word: trece, tr: { en: thirteen } }
          - { level: A0, value: 14, number: "14", word: catorce, tr: { en: fourteen } }
          - { level: A0, value: 15, number: "15", word: quince, tr: { en: fifteen } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Each number from 0 to 15 has a word of its own."
              es: "Cada número del 0 al 15 tiene una palabra propia."
          - type: note
            level: A0
            text:
              en: "Phone numbers are often said in groups of two digits:"
              es: "Los números de teléfono se dicen a menudo en grupos de dos cifras:"
            ex: { mapping: ["45 67 89", { numeral: "cuarenta y cinco, sesenta y siete, ochenta y nueve", value: "456789" }] }

  - title: { en: "16 to 29", es: "Del 16 al 29" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número } }
          - { key: word, label: { en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 16, number: "16", word: [{ target: dieci }, "séis"], tr: { en: sixteen } }
          - { level: A0, value: 17, number: "17", word: [{ target: dieci }, "siete"], tr: { en: seventeen } }
          - { level: A0, value: 18, number: "18", word: [{ target: dieci }, "ocho"], tr: { en: eighteen } }
          - { level: A0, value: 19, number: "19", word: [{ target: dieci }, "nueve"], tr: { en: nineteen } }
          - { level: A0, value: 20, number: "20", word: veinte, tr: { en: twenty } }
          - { level: A0, value: 21, number: "21", word: [{ target: veinti }, "uno"], tr: { en: twenty-one } }
          - { level: A0, value: 22, number: "22", word: [{ target: veinti }, "dós"], tr: { en: twenty-two } }
          - { level: A0, value: 23, number: "23", word: [{ target: veinti }, "trés"], tr: { en: twenty-three } }
          - { level: A0, value: 26, number: "26", word: [{ target: veinti }, "séis"], tr: { en: twenty-six } }
          - { level: A0, value: 29, number: "29", word: [{ target: veinti }, "nueve"], tr: { en: twenty-nine } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["16 to 19 join ", { term: dieci- }, " to the unit, and 21 to 29 join ", { term: veinti- }, ", in one word."]
              es: ["Del 16 al 19 se une ", { term: dieci- }, " a la unidad, y del 21 al 29, ", { term: veinti- }, ", en una sola palabra."]
          - type: rule
            level: A0
            text:
              en: [{ alternatives: [{ term: dieciséis }, { term: veintidós }, { term: veintitrés }, { term: veintiséis }] }, " carry a written accent."]
              es: [{ alternatives: [{ term: dieciséis }, { term: veintidós }, { term: veintitrés }, { term: veintiséis }] }, " llevan tilde."]

  - title: { en: "30 to 99", es: "Del 30 al 99" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número } }
          - { key: word, label: { en: Word, es: Palabra } }
        rows:
          - { level: A0, value: 30, number: "30", word: treinta, tr: { en: thirty } }
          - { level: A0, value: 31, number: "31", word: ["treinta ", { target: y }, " uno"], tr: { en: thirty-one } }
          - { level: A0, value: 40, number: "40", word: cuarenta, tr: { en: forty } }
          - { level: A0, value: 45, number: "45", word: ["cuarenta ", { target: y }, " cinco"], tr: { en: forty-five } }
          - { level: A0, value: 50, number: "50", word: cincuenta, tr: { en: fifty } }
          - { level: A0, value: 60, number: "60", word: sesenta, tr: { en: sixty } }
          - { level: A0, value: 70, number: "70", word: setenta, tr: { en: seventy } }
          - { level: A0, value: 80, number: "80", word: ochenta, tr: { en: eighty } }
          - { level: A0, value: 90, number: "90", word: noventa, tr: { en: ninety } }
          - { level: A0, value: 99, number: "99", word: ["noventa ", { target: y }, " nueve"], tr: { en: ninety-nine } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["From 31, the tens and the unit are separate words joined by ", { term: y }, "."]
              es: ["Desde el 31, la decena y la unidad son palabras separadas unidas por ", { term: y }, "."]

  - title: { en: "Hundreds, thousands, millions", es: "Centenas, miles y millones" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number, es: Número } }
          - { key: words, label: { en: Words, es: Palabras } }
        rows:
          - { level: A0, value: 100, number: "100", words: { target: cien }, tr: { en: a hundred } }
          - { level: A0, value: 101, number: "101", words: [{ target: ciento }, " uno"], tr: { en: a hundred and one } }
          - { level: A0, value: 200, number: "200", words: doscientos, tr: { en: two hundred } }
          - { level: A0, value: 300, number: "300", words: trescientos, tr: { en: three hundred } }
          - { level: A0, value: 400, number: "400", words: cuatrocientos, tr: { en: four hundred } }
          - { level: A0, value: 500, number: "500", words: { target: quinientos }, tr: { en: five hundred } }
          - { level: A0, value: 600, number: "600", words: seiscientos, tr: { en: six hundred } }
          - { level: A0, value: 700, number: "700", words: { target: setecientos }, tr: { en: seven hundred } }
          - { level: A0, value: 800, number: "800", words: ochocientos, tr: { en: eight hundred } }
          - { level: A0, value: 900, number: "900", words: { target: novecientos }, tr: { en: nine hundred } }
          - { level: A0, value: 1000, number: "1000", words: { target: mil }, tr: { en: a thousand } }
          - { level: A0, value: 2000, number: "2000", words: ["dos ", { target: mil }], tr: { en: two thousand } }
          - { level: A0, value: 10000, number: "10 000", words: ["diez ", { target: mil }], tr: { en: ten thousand } }
          - { level: A0, value: 1000000, number: "1 000 000", words: ["un ", { target: millón }], tr: { en: a million } }
          - { level: A0, value: 2000000, number: "2 000 000", words: ["dos ", { target: millones }], tr: { en: two million } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: cien }, " is 100 alone or before a noun; ", { term: ciento }, " goes before another number:"]
              es: [{ term: cien }, " es 100 solo o delante de un nombre; ", { term: ciento }, " va delante de otro número:"]
            ex: { examples: [[{ target: cien }, " euros"], [{ target: ciento }, " veinte"]] }
            tr: { en: { examples: [a hundred euros, a hundred and twenty] } }
          - type: rule
            level: A0
            text:
              en: ["The hundreds take no ", { term: y }, " after them:"]
              es: ["Detrás de las centenas no va ", { term: y }, ":"]
            ex: { examples: [{ target: ciento veinte }, { target: doscientos cinco }] }
            tr: { en: { examples: [a hundred and twenty, two hundred and five] } }
          - type: rule
            level: A0
            text:
              en: [{ term: mil }, " takes no ", { term: un }, " and keeps its form after any number."]
              es: [{ term: mil }, " no lleva ", { term: un }, " y mantiene su forma detrás de cualquier número."]
          - type: rule
            level: A1
            text:
              en: "From 200, the hundreds agree with the noun they count:"
              es: "Desde 200, las centenas concuerdan con el nombre que cuentan:"
            ex: { examples: [[{ target: doscientos }, " libros"], [{ target: doscientas }, " personas"]] }
            tr: { en: { examples: [two hundred books, two hundred people] } }
          - type: rule
            level: A1
            text:
              en: [{ term: millón }, " is a noun: its plural is ", { term: millones }, ", and ", { term: de }, " goes before what it counts:"]
              es: [{ term: millón }, " es un nombre: su plural es ", { term: millones }, ", y ", { term: de }, " va delante de lo que cuenta:"]
            ex: ["Hay tres ", { target: millones de }, " personas."]
            tr: { en: There are three million people. }
          - type: note
            level: A0
            text:
              en: "Long numbers group their digits in threes with a space: 10 000."
              es: "Los números largos agrupan sus cifras de tres en tres con un espacio: 10 000."
          - type: note
            level: A1
            text:
              en: "Decimals take a comma in Spain and most of South America, and a point in Mexico and Central America:"
              es: "Los decimales llevan coma en España y en casi toda Sudamérica, y punto en México y Centroamérica:"
            ex: { examples: [{ mapping: ["2,5", { numeral: ["dos ", { target: coma }, " cinco"], value: 2.5 }] }, { mapping: ["2.5", { numeral: ["dos ", { target: punto }, " cinco"], value: 2.5 }] }] }

  - title: { en: "Uno, un, una", es: "Uno, un, una" }
    role: own
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: uno }, " becomes ", { term: un }, " before a masculine noun and ", { term: una }, " before a feminine one:"]
              es: [{ term: uno }, " pasa a ", { term: un }, " delante de un nombre masculino y a ", { term: una }, " delante de uno femenino:"]
            ex: { examples: [[{ target: un }, " libro"], [{ target: una }, " mesa"]] }
            tr: { en: { examples: [one book, one table] } }
          - type: rule
            level: A1
            text:
              en: "The same holds inside longer numbers:"
              es: "Lo mismo ocurre dentro de los números largos:"
            ex: { examples: [["veinti", { target: ún }, " años"], ["treinta y ", { target: una }, " casas"]] }
            tr: { en: { examples: [twenty-one years, thirty-one houses] } }

  - title: { en: Ordinals, es: Los ordinales }
    role: own
    content:
      - type: inventory
        set: ordinals
        columns:
          - { key: number, label: { en: Number, es: Número } }
          - { key: masc, label: { en: Masculine, es: Masculino } }
          - { key: fem, label: { en: Feminine, es: Femenino } }
        rows:
          - { level: A1, value: 1, number: "1.º, 1.ª", masc: primero, fem: primera, tr: { en: first } }
          - { level: A1, value: 2, number: "2.º, 2.ª", masc: segundo, fem: segunda, tr: { en: second } }
          - { level: A1, value: 3, number: "3.º, 3.ª", masc: tercero, fem: tercera, tr: { en: third } }
          - { level: A1, value: 4, number: "4.º, 4.ª", masc: cuarto, fem: cuarta, tr: { en: fourth } }
          - { level: A1, value: 5, number: "5.º, 5.ª", masc: quinto, fem: quinta, tr: { en: fifth } }
          - { level: A1, value: 6, number: "6.º, 6.ª", masc: sexto, fem: sexta, tr: { en: sixth } }
          - { level: A1, value: 7, number: "7.º, 7.ª", masc: séptimo, fem: séptima, tr: { en: seventh } }
          - { level: A1, value: 8, number: "8.º, 8.ª", masc: octavo, fem: octava, tr: { en: eighth } }
          - { level: A1, value: 9, number: "9.º, 9.ª", masc: noveno, fem: novena, tr: { en: ninth } }
          - { level: A1, value: 10, number: "10.º, 10.ª", masc: décimo, fem: décima, tr: { en: tenth } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Ordinals agree with the noun and usually go before it:"
              es: "Los ordinales concuerdan con el nombre y suelen ir delante:"
            ex: ["Es la ", { target: segunda }, " calle a la derecha."]
            tr: { en: "It's the second street on the right." }
          - type: rule
            level: A2
            text:
              en: [{ term: primero }, " and ", { term: tercero }, " drop the -o before a masculine singular noun:"]
              es: [{ term: primero }, " y ", { term: tercero }, " pierden la -o delante de un nombre masculino singular:"]
            ex: { examples: [["el ", { target: primer }, " día"], ["el ", { target: tercer }, " piso"]] }
            tr: { en: { examples: [the first day, the third floor] } }
          - type: rule
            level: A1
            text:
              en: "From eleventh on, everyday Spanish uses the plain numbers after the noun:"
              es: "Desde el undécimo, en el uso diario se dicen los números cardinales detrás del nombre:"
            ex: ["Vivo en el piso ", { target: quince }, "."]
            tr: { en: I live on the fifteenth floor. }

  - title: { en: Typical errors, es: Errores frecuentes }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: ciento euros, right: [{ target: cien }, " euros"], rule: { en: ["100 before a noun is ", { term: cien }], es: ["100 delante de un nombre es ", { term: cien }] } }
          - { level: A0, wrong: cincocientos, right: { target: quinientos }, rule: { en: ["500 is ", { term: quinientos }], es: ["500 es ", { term: quinientos }] } }
          - { level: A0, wrong: un mil, right: { target: mil }, rule: { en: [{ term: mil }, " takes no ", { term: un }], es: [{ term: mil }, " no lleva ", { term: un }] } }
          - { level: A0, speakers: [en], wrong: ciento y veinte, right: { target: ciento veinte }, rule: { en: ["no ", { term: y }, " after the hundreds, unlike and in English"] } }
          - { level: A1, wrong: veintiuno años, right: ["veinti", { target: ún }, " años"], rule: { en: [{ term: uno }, " becomes ", { term: un }, " before a masculine noun"], es: [{ term: uno }, " pasa a ", { term: un }, " delante de un nombre masculino"] } }
          - { level: A1, wrong: doscientos personas, right: [{ target: doscientas }, " personas"], rule: { en: the hundreds agree with the noun, es: las centenas concuerdan con el nombre } }
          - { level: A1, wrong: un millón personas, right: ["un ", { target: millón de }, " personas"], rule: { en: [{ term: millón }, " takes ", { term: de }, " before a noun"], es: [{ term: millón }, " lleva ", { term: de }, " delante de un nombre"] } }
          - { level: A2, wrong: el primero día, right: ["el ", { target: primer }, " día"], rule: { en: [{ term: primero }, " drops -o before a masculine singular noun"], es: [{ term: primero }, " pierde la -o delante de un nombre masculino singular"] } }
