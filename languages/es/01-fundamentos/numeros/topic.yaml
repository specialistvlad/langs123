              en: "With two or more parts, the name of the fraction is plural."
              uk: "Якщо частин дві чи більше, назва дробу стоїть у множині."
              pt: "Com duas ou mais partes, o nome da fração fica no plural."
              fr: "Avec deux parties ou plus, le nom de la fraction se met au pluriel."
              de: "Bei zwei oder mehr Teilen steht der Name des Bruchs im Plural."
              it: "Con due o più parti, il nome della frazione è al plurale."
              pl: "Przy dwóch lub więcej częściach nazwa ułamka stoi w liczbie mnogiej."
              tr: "İki veya daha fazla parça olduğunda kesrin adı çoğul olur."
              id: "Untuk dua bagian atau lebih, nama pecahan berbentuk jamak."
              vi: "Khi có hai phần trở lên, tên phân số ở số nhiều."
          - type: rule
