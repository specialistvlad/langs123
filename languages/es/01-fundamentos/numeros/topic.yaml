      - type: list
        items:
          - type: rule
            level: C2
            text:
              es: "Las letras se suman de mayor a menor, y una menor delante de una mayor resta."
              en: "The letters add up from largest to smallest, and a smaller letter before a larger one subtracts."
              uk: "Літери додаються від більшої до меншої, а менша літера перед більшою віднімається."
              pt: "As letras se somam da maior para a menor, e uma menor antes de uma maior subtrai."
              fr: "Les lettres s’additionnent de la plus grande à la plus petite, et une lettre plus petite devant une plus grande se soustrait."
              de: "Die Buchstaben werden vom größten zum kleinsten addiert, und ein kleinerer vor einem größeren wird abgezogen."
              it: "Le lettere si sommano dalla maggiore alla minore, e una minore davanti a una maggiore sottrae."
              pl: "Litery dodaje się od największej do najmniejszej, a mniejsza przed większą się odejmuje."
              tr: "Harfler büyükten küçüğe doğru toplanır; büyük bir harfin önündeki küçük harf çıkarılır."
              id: "Huruf dijumlahkan dari yang terbesar ke yang terkecil, dan huruf yang lebih kecil di depan huruf yang lebih besar mengurangi."
              vi: "Các chữ cái được cộng từ lớn đến nhỏ, và chữ nhỏ hơn đứng trước chữ lớn hơn thì trừ."
          - type: rule
            level: C2
            text:
              es: [{ letter: I }, " resta ante ", { letter: V }, " y ", { letter: X }, "; ", { letter: X }, " ante ", { letter: L }, " y ", { letter: C }, "; ", { letter: C }, " ante ", { letter: D }, " y ", { letter: M }, "."]
