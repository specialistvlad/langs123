          - type: rule
            level: C2
            text:
              es: "Una letra se repite hasta tres veces seguidas:"
              en: "A letter repeats up to three times in a row:"
              uk: "Літера може повторюватися до трьох разів поспіль:"
              pt: "Uma letra se repete até três vezes seguidas:"
              fr: "Une lettre se répète jusqu’à trois fois de suite :"
              de: "Ein Buchstabe wiederholt sich bis zu dreimal hintereinander:"
              it: "Una lettera si ripete fino a tre volte di seguito:"
              pl: "Litera powtarza się najwyżej trzy razy z rzędu:"
              tr: "Bir harf art arda en fazla üç kez tekrarlanır:"
              id: "Satu huruf diulang hingga tiga kali berturut-turut:"
              vi: "Một chữ cái được lặp lại tối đa ba lần liên tiếp:"
            ex: { examples: [{ target: XXX }, { target: CCC }] }
            tr: { en: { examples: ["thirty", "three hundred"] }, uk: { examples: ["тридцять", "триста"] }, pt: { examples: ["trinta", "trezentos"] }, fr: { examples: ["trente", "trois cents"] }, de: { examples: ["dreißig", "dreihundert"] }, it: { examples: ["trenta", "trecento"] }, pl: { examples: ["trzydzieści", "trzysta"] }, tr: { examples: ["otuz", "üç yüz"] }, id: { examples: ["tiga puluh", "tiga ratus"] }, vi: { examples: ["ba mươi", "ba trăm"] } }
          - type: rule
            level: C2
            text:
              es: "Los números romanos se escriben con mayúsculas; las páginas de un prólogo admiten minúsculas:"
              en: "Roman numerals are written in capitals; the pages of a preface also allow lower case:"
              uk: "Римські цифри пишуть великими літерами; сторінки передмови допускають і малі:"
              pt: "Os números romanos se escrevem com maiúsculas; as páginas de um prólogo admitem minúsculas:"
              fr: "Les chiffres romains s’écrivent en majuscules ; les pages d’un prologue admettent les minuscules :"
              de: "Römische Zahlen schreibt man mit Großbuchstaben; die Seiten eines Vorworts erlauben auch Kleinbuchstaben:"
              it: "I numeri romani si scrivono con le maiuscole; le pagine di una prefazione ammettono le minuscole:"
              pl: "Liczby rzymskie zapisuje się wielkimi literami; strony wstępu dopuszczają też małe:"
              tr: "Romen rakamları büyük harfle yazılır; önsöz sayfalarında küçük harf de kullanılabilir:"
              id: "Angka Romawi ditulis dengan huruf kapital; halaman kata pengantar juga boleh memakai huruf kecil:"
              vi: "Chữ số La Mã được viết hoa; các trang của lời nói đầu cũng được viết thường:"
