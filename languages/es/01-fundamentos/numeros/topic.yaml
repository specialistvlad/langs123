              fr: "À partir de 1/4, le nom de la fraction est l’ordinal masculin ; le tiers et la moitié ont une forme propre."
              de: "Ab 1/4 ist der Name des Bruchs die maskuline Ordnungszahl; das Drittel und die Hälfte haben eine eigene Form."
              it: "Da 1/4 in poi, il nome della frazione è l'ordinale maschile; il terzo e la metà hanno una forma propria."
              pl: "Od 1/4 nazwa ułamka to liczebnik porządkowy rodzaju męskiego; trzecia część i połowa mają własne formy."
