        rows:
          - { level: B2, sigla: a. C., meaning: antes de Cristo, ex: ["Julio César murió en el 44 ", { target: a. C. }, "."], tr: { en: "Julius Caesar died in 44 BC.", uk: "Юлій Цезар помер у 44 році до н. е.", pt: "Júlio César morreu em 44 a.C.", fr: "Jules César est mort en 44 av. J.-C.", de: "Julius Caesar starb im Jahr 44 v. Chr.", it: "Giulio Cesare morì nel 44 a.C.", pl: "Juliusz Cezar zmarł w 44 roku p.n.e.", tr: "Jül Sezar MÖ 44'te öldü.", id: "Julius Caesar meninggal pada tahun 44 SM.", vi: "Julius Caesar qua đời năm 44 TCN." } }
          - { level: B2, sigla: d. C., meaning: después de Cristo, ex: ["El Imperio romano de Occidente cayó en el 476 ", { target: d. C. }, "."], tr: { en: "The Western Roman Empire fell in AD 476.", uk: "Західна Римська імперія впала у 476 році н. е.", pt: "O Império Romano do Ocidente caiu em 476 d.C.", fr: "L’Empire romain d’Occident est tombé en 476 apr. J.-C.", de: "Das Weströmische Reich fiel im Jahr 476 n. Chr.", it: "L'Impero romano d'Occidente cadde nel 476 d.C.", pl: "Cesarstwo Zachodniorzymskie upadło w 476 roku n.e.", tr: "Batı Roma İmparatorluğu MS 476'da yıkıldı.", id: "Kekaisaran Romawi Barat runtuh pada tahun 476 M.", vi: "Đế quốc Tây La Mã sụp đổ năm 476 SCN." } }
      - type: list
        items:
          - type: rule
            level: B2
            text:
              es: "La sigla se escribe detrás del año, con un punto y un espacio tras cada letra."
              en: "The abbreviation is written after the year, with a full stop and a space after each letter."
              uk: "Скорочення пишуть після року, з крапкою та пробілом після кожної літери."
              pt: "A sigla se escreve depois do ano, com um ponto e um espaço depois de cada letra."
              fr: "L’abréviation s’écrit après l’année, avec un point et une espace après chaque lettre."
              de: "Die Abkürzung steht hinter der Jahreszahl, mit einem Punkt und einem Leerzeichen nach jedem Buchstaben."
              it: "La sigla si scrive dopo l'anno, con un punto e uno spazio dopo ogni lettera."
              pl: "Skrót pisze się po roku, z kropką i spacją po każdej literze."
              tr: "Kısaltma yılın arkasına yazılır; her harften sonra bir nokta ve bir boşluk konur."
              id: "Singkatan ditulis setelah tahun, dengan titik dan spasi setelah setiap huruf."
              vi: "Chữ viết tắt được viết sau năm, với một dấu chấm và một khoảng trắng sau mỗi chữ cái."
          - type: rule
            level: B2
            text:
              es: ["Sin sigla, un año es de nuestra era; ", { term: d. C. }, " se añade solo para evitar dudas."]
              en: ["Without an abbreviation, a year belongs to our era; ", { term: d. C. }, " is added only to avoid doubt."]
              uk: ["Без скорочення рік належить до нашої ери; ", { term: d. C. }, " додають лише для уникнення сумнівів."]
              pt: ["Sem sigla, um ano é da nossa era; ", { term: d. C. }, " só se acrescenta para evitar dúvidas."]
              fr: ["Sans abréviation, une année appartient à notre ère ; ", { term: d. C. }, " s’ajoute seulement pour éviter les doutes."]
              de: ["Ohne Abkürzung gehört ein Jahr zu unserer Zeitrechnung; ", { term: d. C. }, " wird nur hinzugefügt, um Zweifel zu vermeiden."]
              it: ["Senza sigla, un anno è della nostra era; ", { term: d. C. }, " si aggiunge solo per evitare dubbi."]
              pl: ["Bez skrótu rok należy do naszej ery; ", { term: d. C. }, " dodaje się tylko po to, by uniknąć wątpliwości."]
              tr: ["Kısaltma yoksa yıl bizim çağımıza aittir; ", { term: d. C. }, " yalnızca kuşku olmasın diye eklenir."]
              id: ["Tanpa singkatan, suatu tahun termasuk era kita; ", { term: d. C. }, " hanya ditambahkan untuk menghindari keraguan."]
              vi: ["Nếu không có chữ viết tắt, một năm thuộc kỷ nguyên của chúng ta; ", { term: d. C. }, " chỉ được thêm vào để tránh nhầm lẫn."]

