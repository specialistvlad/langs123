            tr: { en: "We finish at the end of 2026.", uk: "Ми закінчимо наприкінці 2026 року.", pt: "Terminamos no fim de 2026.", fr: "Nous terminons fin 2026.", de: "Wir werden Ende 2026 fertig.", it: "Finiamo alla fine del 2026.", pl: "Skończymy pod koniec 2026 roku.", tr: "2026'nın sonunda bitiriyoruz.", id: "Kami selesai pada akhir tahun 2026.", vi: "Chúng tôi hoàn thành vào cuối năm 2026." }
          - type: rule
            level: B2
            variety: es-419
            text:
              es: ["En América también se dice ", { term: a fines de }, ":"]
              en: ["In Latin America people also say ", { term: a fines de }, ":"]
