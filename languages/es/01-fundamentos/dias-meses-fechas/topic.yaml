              pt: "Depois vem um período de tempo: um mês, uma semana, uma estação ou um ano."
              fr: "Il est suivi d’une période de temps : un mois, une semaine, une saison ou une année."
              de: "Danach steht ein Zeitraum: ein Monat, eine Woche, eine Jahreszeit oder ein Jahr."
              it: "Dopo viene un periodo di tempo: un mese, una settimana, una stagione o un anno."
              pl: "Po nich występuje okres czasu: miesiąc, tydzień, pora roku lub rok."
              tr: "Ardından bir zaman dilimi gelir: ay, hafta, mevsim veya yıl."
              id: "Setelahnya ada suatu periode waktu: bulan, pekan, musim, atau tahun."
              vi: "Phía sau là một khoảng thời gian: một tháng, một tuần, một mùa hoặc một năm."
