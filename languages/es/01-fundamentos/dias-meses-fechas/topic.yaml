sections:
  - title: { en: Days of the week, es: Los días de la semana, uk: "Дні тижня", pt: "Dias da semana", fr: "Jours de la semaine", de: "Wochentage", it: "Giorni della settimana", pl: "Dni tygodnia", tr: "Haftanın günleri", id: "Hari dalam seminggu", vi: "Các thứ trong tuần" }
    role: own
    content:
      - type: inventory
        set: days
        columns:
          - { key: day, label: { en: Day, es: Día, uk: "День", pt: "Dia", fr: "Jour", de: "Tag", it: "Giorno", pl: "Dzień", tr: "Gün", id: "Hari", vi: "Thứ" } }
          - { key: short, label: { en: Short form, es: Abreviatura, uk: "Скорочення", pt: "Abreviatura", fr: "Abréviation", de: "Abkürzung", it: "Abbreviazione", pl: "Skrót", tr: "Kısaltma", id: "Singkatan", vi: "Viết tắt" } }
        rows:
          - { level: A0, value: 1, day: lunes, short: lun., tr: { en: Monday, uk: "понеділок", pt: "segunda-feira", fr: "lundi", de: "Montag", it: "lunedì", pl: "poniedziałek", tr: "pazartesi", id: "Senin", vi: "thứ hai" } }
          - { level: A0, value: 2, day: martes, short: mart., tr: { en: Tuesday, uk: "вівторок", pt: "terça-feira", fr: "mardi", de: "Dienstag", it: "martedì", pl: "wtorek", tr: "salı", id: "Selasa", vi: "thứ ba" } }
          - { level: A0, value: 3, day: miércoles, short: miérc., tr: { en: Wednesday, uk: "середа", pt: "quarta-feira", fr: "mercredi", de: "Mittwoch", it: "mercoledì", pl: "środa", tr: "çarşamba", id: "Rabu", vi: "thứ tư" } }
          - { level: A0, value: 4, day: jueves, short: juev., tr: { en: Thursday, uk: "четвер", pt: "quinta-feira", fr: "jeudi", de: "Donnerstag", it: "giovedì", pl: "czwartek", tr: "perşembe", id: "Kamis", vi: "thứ năm" } }
          - { level: A0, value: 5, day: viernes, short: vier., tr: { en: Friday, uk: "п’ятниця", pt: "sexta-feira", fr: "vendredi", de: "Freitag", it: "venerdì", pl: "piątek", tr: "cuma", id: "Jumat", vi: "thứ sáu" } }
          - { level: A0, value: 6, day: sábado, short: sáb., tr: { en: Saturday, uk: "субота", pt: "sábado", fr: "samedi", de: "Samstag", it: "sabato", pl: "sobota", tr: "cumartesi", id: "Sabtu", vi: "thứ bảy" } }
          - { level: A0, value: 7, day: domingo, short: dom., tr: { en: Sunday, uk: "неділя", pt: "domingo", fr: "dimanche", de: "Sonntag", it: "domenica", pl: "niedziela", tr: "pazar", id: "Minggu", vi: "chủ nhật" } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The week starts on ", { term: lunes }, ". Days are masculine and start with a small letter."]
              es: ["La semana empieza el ", { term: lunes }, ". Los días son masculinos y se escriben con minúscula."]
              uk: ["Тиждень починається в ", { term: "lunes" }, ". Дні — чоловічого роду і пишуться з малої літери."]
              pt: ["A semana começa com ", { term: lunes }, ". Em espanhol, todos os dias são masculinos e se escrevem com letra minúscula."]
              fr: ["La semaine commence par ", { term: lunes }, ". Les jours sont masculins et s’écrivent avec une minuscule."]
              de: ["Die Woche beginnt mit ", { term: lunes }, ". Die Wochentage sind maskulin und werden kleingeschrieben."]
              it: ["La settimana inizia con ", { term: lunes }, ". In spagnolo tutti i giorni sono maschili e si scrivono con la minuscola."]
              pl: ["Tydzień zaczyna się od ", { term: lunes }, ". W hiszpańskim wszystkie dni są rodzaju męskiego i piszemy je małą literą."]
              tr: ["Hafta ", { term: lunes }, " ile başlar. İspanyolcada günlerin hepsi eril cinstendir ve küçük harfle yazılır."]
              id: ["Pekan dimulai dari ", { term: lunes }, ". Dalam bahasa Spanyol, semua nama hari berjenis maskulin dan ditulis dengan huruf kecil."]
              vi: ["Tuần bắt đầu bằng ", { term: lunes }, ". Trong tiếng Tây Ban Nha, các thứ đều giống đực và viết bằng chữ thường."]
          - type: rule
            level: A0
            text:
              en: [{ term: el }, " before a day means on that day, and ", { term: los }, " means every week, with no preposition:"]
              es: [{ term: el }, " delante de un día indica ese día, y ", { term: los }, ", cada semana, sin preposición:"]
              uk: [{ term: "el" }, " перед днем означає «у цей день», а ", { term: "los" }, " — «щотижня», без прийменника:"]
              pt: [{ term: el }, " antes de um dia da semana indica aquele dia, e ", { term: los }, " indica toda semana, sem preposição:"]
              fr: [{ term: el }, " devant un jour désigne ce jour-là, et ", { term: los }, " signifie chaque semaine, sans préposition :"]
              de: [{ term: el }, " vor einem Wochentag bezeichnet genau diesen Tag, ", { term: los }, " bedeutet jede Woche; eine Präposition steht nicht davor:"]
              it: [{ term: el }, " davanti a un giorno indica quel giorno, e ", { term: los }, " indica ogni settimana, senza preposizione:"]
              pl: [{ term: el }, " przed dniem oznacza ten właśnie dzień, a ", { term: los }, " — każdy tydzień, bez przyimka:"]
              tr: [{ term: el }, " bir günün önünde o günü, ", { term: los }, " ise her haftayı gösterir; edat kullanılmaz:"]
              id: [{ term: el }, " di depan nama hari menunjuk hari itu, dan ", { term: los }, " berarti setiap pekan, tanpa preposisi:"]
              vi: [{ term: el }, " trước một thứ chỉ đúng ngày đó, còn ", { term: los }, " nghĩa là mỗi tuần, không dùng giới từ:"]
            ex: { examples: [["Te veo ", { target: el }, " ", { weekday: viernes, value: 5 }, "."], [{ target: Los }, " ", { weekday: sábados, value: 6 }, " no trabajo."]] }
            tr: { en: { examples: [See you on Friday., "On Saturdays I don't work."] }, uk: { examples: ["Побачимося в п’ятницю.", "По суботах я не працюю."] }, pt: { examples: ["Te vejo na sexta-feira.", "Aos sábados eu não trabalho."] }, fr: { examples: ["On se voit vendredi.", "Le samedi, je ne travaille pas."] }, de: { examples: ["Wir sehen uns am Freitag.", "Samstags arbeite ich nicht."] }, it: { examples: ["Ci vediamo venerdì.", "Il sabato non lavoro."] }, pl: { examples: ["Do zobaczenia w piątek.", "W soboty nie pracuję."] }, tr: { examples: ["Cuma günü görüşürüz.", "Cumartesi günleri çalışmıyorum."] }, id: { examples: ["Sampai jumpa hari Jumat.", "Setiap hari Sabtu saya tidak bekerja."] }, vi: { examples: ["Hẹn gặp bạn vào thứ sáu.", "Vào các ngày thứ bảy, tôi không làm việc."] } }
          - type: rule
            level: A0
            text:
              en: ["Days ending in -s keep their form in the plural: ", { term: los lunes }, "; ", { term: sábado }, " and ", { term: domingo }, " add -s."]
              es: ["Los días terminados en -s no cambian en plural: ", { term: los lunes }, "; ", { term: sábado }, " y ", { term: domingo }, " añaden -s."]
              uk: ["Дні, що закінчуються на -s, у множині не змінюються: ", { term: "los lunes" }, "; ", { term: "sábado" }, " і ", { term: "domingo" }, " додають -s."]
              pt: ["Os dias que terminam em -s não mudam no plural: ", { term: los lunes }, "; ", { term: sábado }, " e ", { term: domingo }, " recebem -s."]
              fr: ["Les jours terminés par -s ne changent pas au pluriel : ", { term: los lunes }, " ; ", { term: sábado }, " et ", { term: domingo }, " prennent -s."]
              de: ["Wochentage auf -s bleiben im Plural unverändert: ", { term: los lunes }, "; ", { term: sábado }, " und ", { term: domingo }, " erhalten -s."]
              it: ["I giorni che finiscono in -s non cambiano al plurale: ", { term: los lunes }, "; ", { term: sábado }, " e ", { term: domingo }, " aggiungono -s."]
              pl: ["Dni zakończone na -s w liczbie mnogiej się nie zmieniają: ", { term: los lunes }, "; ", { term: sábado }, " i ", { term: domingo }, " dodają -s."]
              tr: ["-s ile biten günler çoğulda değişmez: ", { term: los lunes }, "; ", { term: sábado }, " ve ", { term: domingo }, " -s alır."]
              id: ["Nama hari yang berakhir dengan -s tidak berubah dalam bentuk jamak: ", { term: los lunes }, "; ", { term: sábado }, " dan ", { term: domingo }, " mendapat -s."]
              vi: ["Các thứ tận cùng bằng -s không đổi ở số nhiều: ", { term: los lunes }, "; ", { term: sábado }, " và ", { term: domingo }, " thêm -s."]
          - type: rule
            level: A0
            text:
              en: [{ term: el fin de semana }, " is Saturday and Sunday:"]
              es: [{ term: el fin de semana }, " son el sábado y el domingo:"]
              uk: [{ term: "el fin de semana" }, " — це субота й неділя:"]
              pt: [{ term: el fin de semana }, " é o sábado e o domingo:"]
              fr: [{ term: el fin de semana }, " correspond au samedi et au dimanche :"]
              de: [{ term: el fin de semana }, " sind Samstag und Sonntag:"]
              it: [{ term: el fin de semana }, " sono il sabato e la domenica:"]
              pl: [{ term: el fin de semana }, " to sobota i niedziela:"]
              tr: [{ term: el fin de semana }, " cumartesi ile pazardır:"]
              id: [{ term: el fin de semana }, " adalah hari Sabtu dan Minggu:"]
              vi: [{ term: el fin de semana }, " là thứ bảy và chủ nhật:"]
            ex: [{ target: Los fines de semana }, " descanso."]
            tr: { en: At weekends I rest., uk: "На вихідних я відпочиваю.", pt: "Nos fins de semana eu descanso.", fr: "Le week-end, je me repose.", de: "Am Wochenende ruhe ich mich aus.", it: "Nel fine settimana mi riposo.", pl: "W weekendy odpoczywam.", tr: "Hafta sonları dinleniyorum.", id: "Pada akhir pekan saya beristirahat.", vi: "Vào cuối tuần, tôi nghỉ ngơi." }
          - type: rule
            level: A0
            text:
              en: ["Ask the day with ", { term: ¿Qué día es hoy? }, " and answer with ", { term: Hoy es }, " and the day:"]
              es: ["El día se pregunta con ", { term: ¿Qué día es hoy? }, " y se responde con ", { term: Hoy es }, " y el día:"]
              uk: ["День тижня запитують так: ", { term: "¿Qué día es hoy?" }, ", а відповідають: ", { term: "Hoy es" }, " і день:"]
              pt: ["O dia da semana se pergunta com ", { term: ¿Qué día es hoy? }, " e se responde com ", { term: Hoy es }, " e o dia:"]
              fr: ["On demande le jour avec ", { term: ¿Qué día es hoy? }, " et on répond avec ", { term: Hoy es }, " et le jour :"]
              de: ["Man fragt nach dem Tag mit ", { term: ¿Qué día es hoy? }, " und antwortet mit ", { term: Hoy es }, " und dem Tag:"]
              it: ["Il giorno si chiede con ", { term: ¿Qué día es hoy? }, " e si risponde con ", { term: Hoy es }, " e il giorno:"]
              pl: ["O dzień pytamy zdaniem ", { term: ¿Qué día es hoy? }, ", a odpowiadamy: ", { term: Hoy es }, " i nazwa dnia:"]
              tr: ["Gün ", { term: ¿Qué día es hoy? }, " ile sorulur; ", { term: Hoy es }, " ve gün adıyla cevap verilir:"]
              id: ["Hari ditanyakan dengan ", { term: ¿Qué día es hoy? }, " dan dijawab dengan ", { term: Hoy es }, " lalu nama hari:"]
              vi: ["Hỏi thứ bằng ", { term: ¿Qué día es hoy? }, " và trả lời bằng ", { term: Hoy es }, " cùng tên thứ:"]
            ex: { exchange: ["¿Qué día es hoy?", ["Hoy es ", { target: { weekday: martes, value: 2 } }, "."]] }
            tr: { en: { exchange: [What day is it today?, Today is Tuesday.] }, uk: { exchange: ["Який сьогодні день?", "Сьогодні вівторок."] }, pt: { exchange: ["Que dia é hoje?", "Hoje é terça-feira."] }, fr: { exchange: ["Quel jour sommes-nous aujourd’hui ?", "Nous sommes mardi."] }, de: { exchange: ["Welcher Tag ist heute?", "Heute ist Dienstag."] }, it: { exchange: ["Che giorno è oggi?", "Oggi è martedì."] }, pl: { exchange: ["Jaki jest dzisiaj dzień?", "Dzisiaj jest wtorek."] }, tr: { exchange: ["Bugün günlerden ne?", "Bugün salı."] }, id: { exchange: ["Hari ini hari apa?", "Hari ini hari Selasa."] }, vi: { exchange: ["Hôm nay là thứ mấy?", "Hôm nay là thứ ba."] } }

