              it: ["In America Latina si dice anche ", { term: a fines de }, ":"]
              pl: ["W Ameryce Łacińskiej mówi się też ", { term: a fines de }, ":"]
              tr: ["Latin Amerika'da ", { term: a fines de }, " da kullanılır:"]
              id: ["Di Amerika Latin juga dikatakan ", { term: a fines de }, ":"]
              vi: ["Ở châu Mỹ Latinh, người ta cũng nói ", { term: a fines de }, ":"]
            ex: ["Nos vemos ", { target: a fines de }, " ", { date: mayo, value: "--05" }, "."]
