  - title: { es: "Las eras: a. C. y d. C.", en: "Eras: a. C. and d. C.", uk: "Ери: a. C. і d. C.", pt: "As eras: a. C. e d. C.", fr: "Les ères : a. C. et d. C.", de: "Die Zeitrechnung: a. C. und d. C.", it: "Le ere: a. C. e d. C.", pl: "Ery: a. C. i d. C.", tr: "Çağlar: a. C. ve d. C.", id: "Era: a. C. dan d. C.", vi: "Các kỷ nguyên: a. C. và d. C." }
    role: own
    content:
      - type: usage
        columns:
          - { key: sigla, label: { es: Sigla, en: "Abbreviation", uk: "Скорочення", pt: "Sigla", fr: "Abréviation", de: "Abkürzung", it: "Sigla", pl: "Skrót", tr: "Kısaltma", id: "Singkatan", vi: "Chữ viết tắt" } }
          - { key: meaning, label: { es: Significado, en: "Meaning", uk: "Значення", pt: "Significado", fr: "Sens", de: "Bedeutung", it: "Significato", pl: "Znaczenie", tr: "Anlam", id: "Arti", vi: "Nghĩa" } }
