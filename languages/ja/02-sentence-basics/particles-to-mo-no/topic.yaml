            vi: ["Trong ", { pattern: [{ slot: "noun" }, { term: "の" }, { slot: "noun" }] }, " chủ sở hữu hoặc phần mô tả đứng trước."]
          ex: ["これは", { target: [{ kanji: "日本語", reading: "にほんご" }, "の", { kanji: "本", reading: "ほん" }] }, "です。"]
          tr: { en: "This is a Japanese book.", uk: "Це книга японською мовою.", es: "Este es un libro de japonés.", pt: "Este é um livro de japonês.", fr: "C’est un livre de japonais.", de: "Das ist ein Japanischbuch.", it: "Questo è un libro di giapponese.", pl: "To jest książka do japońskiego.", tr: "Bu bir Japonca kitabı.", id: "Ini buku bahasa Jepang.", vi: "Đây là sách tiếng Nhật." }
        - level: "A2"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "と" }, " joins nouns only; verbs join with the ", { term: "て" }, "-form."]
            uk: [{ term: "と" }, " з’єднує лише іменники; дієслова з’єднують ", { term: "て" }, "-формою."]
            es: [{ term: "と" }, " une solo sustantivos; los verbos se unen con la forma ", { term: "て" }, "."]
            pt: [{ term: "と" }, " une só substantivos; os verbos se unem com a forma ", { term: "て" }, "."]
            fr: [{ term: "と" }, " relie seulement des noms ; les verbes se relient avec la forme en ", { term: "て" }, "."]
            de: [{ term: "と" }, " verbindet nur Nomen; Verben verbindet man mit der ", { term: "て" }, "-Form."]
            it: [{ term: "と" }, " unisce solo i nomi; i verbi si uniscono con la forma in ", { term: "て" }, "."]
            pl: [{ term: "と" }, " łączy tylko rzeczowniki; czasowniki łączy forma ", { term: "て" }, "."]
            tr: [{ term: "と" }, " yalnızca adları bağlar; fiiller ", { term: "て" }, " biçimiyle bağlanır."]
            id: [{ term: "と" }, " hanya menghubungkan kata benda; verba dihubungkan dengan bentuk ", { term: "て" }, "."]
            vi: [{ term: "と" }, " chỉ nối danh từ; động từ nối bằng thể ", { term: "て" }, "."]
          ex: ["パンを", { kanji: "食", reading: "た" }, "べ", { target: "て" }, "、コーヒーを", { kanji: "飲", reading: "の" }, "みます。"]
          tr: { en: "I eat bread, then I drink coffee.", uk: "Я з’їдаю хліб, а потім п’ю каву.", es: "Como pan y luego tomo café.", pt: "Eu como pão e depois tomo café.", fr: "Je mange du pain, puis je bois du café.", de: "Ich esse Brot und trinke dann Kaffee.", it: "Mangio il pane e poi bevo il caffè.", pl: "Jem chleb, a potem piję kawę.", tr: "Ekmek yerim, sonra kahve içerim.", id: "Saya makan roti, lalu minum kopi.", vi: "Tôi ăn bánh mì, rồi uống cà phê." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "A group of nouns takes one particle, after the last noun."
              uk: "Група іменників бере одну частку — після останнього іменника."
              es: "Un grupo de sustantivos lleva una sola partícula, tras el último."
              pt: "Um grupo de substantivos leva uma só partícula, depois do último."
              fr: "Un groupe de noms prend une seule particule, après le dernier."
              de: "Eine Gruppe von Nomen steht mit einer Partikel, hinter dem letzten."
              it: "Un gruppo di nomi prende una sola particella, dopo l’ultimo."
              pl: "Grupa rzeczowników bierze jedną partykułę, po ostatnim."
              tr: "Bir ad grubu tek bir edat alır; o da sonuncunun ardından gelir."
              id: "Sekelompok kata benda memakai satu partikel, setelah kata benda terakhir."
              vi: "Một nhóm danh từ dùng một trợ từ, đặt sau danh từ cuối."
            ex: ["パン", { target: "と" }, "たまご", { target: "を" }, { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat bread and eggs.", uk: "Я їм хліб і яйця.", es: "Como pan y huevos.", pt: "Eu como pão e ovos.", fr: "Je mange du pain et des œufs.", de: "Ich esse Brot und Eier.", it: "Mangio pane e uova.", pl: "Jem chleb i jajka.", tr: "Ekmek ve yumurta yerim.", id: "Saya makan roti dan telur.", vi: "Tôi ăn bánh mì và trứng." }
          - type: "rule"
            level: "A1"
            text:
              en: ["These particles join nouns only; verbs join with the ", { term: "て" }, "-form. See ", { link: "The て-Form", to: ja.verbs.te-form }, "."]
              uk: ["Ці частки з’єднують лише іменники; дієслова з’єднують ", { term: "て" }, "-формою. Див. ", { link: "て-форма", to: "ja.verbs.te-form" }, "."]
              es: ["Estas partículas unen solo sustantivos; los verbos se unen con la forma ", { term: "て" }, ". Véase ", { link: "La forma て", to: "ja.verbs.te-form" }, "."]
              pt: ["Estas partículas unem só substantivos; os verbos se unem com a forma ", { term: "て" }, ". Veja ", { link: "A forma て", to: "ja.verbs.te-form" }, "."]
              fr: ["Ces particules relient seulement des noms ; les verbes se relient avec la forme en ", { term: "て" }, ". Voir ", { link: "La forme en て", to: "ja.verbs.te-form" }, "."]
              de: ["Diese Partikeln verbinden nur Nomen; Verben verbindet man mit der ", { term: "て" }, "-Form. Siehe ", { link: "Die て-Form", to: "ja.verbs.te-form" }, "."]
              it: ["Queste particelle uniscono solo i nomi; i verbi si uniscono con la forma in ", { term: "て" }, ". Vedi ", { link: "La forma in て", to: "ja.verbs.te-form" }, "."]
              pl: ["Te partykuły łączą tylko rzeczowniki; czasowniki łączy forma ", { term: "て" }, ". Zob. ", { link: "Forma て", to: "ja.verbs.te-form" }, "."]
              tr: ["Bu edatlar yalnızca adları bağlar; fiiller ", { term: "て" }, " biçimiyle bağlanır. Bkz. ", { link: "て biçimi", to: "ja.verbs.te-form" }, "."]
              id: ["Partikel ini hanya menghubungkan kata benda; verba dihubungkan dengan bentuk ", { term: "て" }, ". Lihat ", { link: "Bentuk て", to: "ja.verbs.te-form" }, "."]
              vi: ["Các trợ từ này chỉ nối danh từ; động từ nối bằng thể ", { term: "て" }, ". Xem ", { link: "Thể て", to: "ja.verbs.te-form" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "は" }, " and ", { term: "が" }, ": see ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " and ", { term: "へ" }, ": see ", { link: "Particles を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              uk: [{ term: "は" }, " і ", { term: "が" }, ": див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " та ", { term: "へ" }, ": див. ", { link: "Частки を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              es: [{ term: "は" }, " y ", { term: "が" }, ": véase ", { link: "は y が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " y ", { term: "へ" }, ": véase ", { link: "Las partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pt: [{ term: "は" }, " e ", { term: "が" }, ": veja ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " e ", { term: "へ" }, ": veja ", { link: "As partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              fr: [{ term: "は" }, " et ", { term: "が" }, " : voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " et ", { term: "へ" }, " : voir ", { link: "Les particules を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              de: [{ term: "は" }, " und ", { term: "が" }, ": siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " und ", { term: "へ" }, ": siehe ", { link: "Die Partikeln を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              it: [{ term: "は" }, " e ", { term: "が" }, ": vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " e ", { term: "へ" }, ": vedi ", { link: "Le particelle を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pl: [{ term: "は" }, " i ", { term: "が" }, ": zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " i ", { term: "へ" }, ": zob. ", { link: "Partykuły を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              tr: [{ term: "は" }, " ve ", { term: "が" }, ": bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " ve ", { term: "へ" }, ": bkz. ", { link: "を, に, で, へ edatları", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              id: [{ term: "は" }, " dan ", { term: "が" }, ": lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, ", dan ", { term: "へ" }, ": lihat ", { link: "Partikel を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              vi: [{ term: "は" }, " và ", { term: "が" }, ": xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "を" }, ", ", { term: "に" }, ", ", { term: "で" }, " và ", { term: "へ" }, ": xem ", { link: "Trợ từ を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
  - title:
      en: "Joining nouns: と, や, か"
      uk: "З’єднання іменників: と, や, か"
      es: "Unir sustantivos: と, や, か"
      pt: "Unir substantivos: と, や, か"
      fr: "Relier des noms : と, や, か"
      de: "Nomen verbinden: と, や, か"
      it: "Unire i nomi: と, や, か"
      pl: "Łączenie rzeczowników: と, や, か"
      tr: "Adları bağlamak: と, や, か"
      id: "Menghubungkan kata benda: と, や, か"
      vi: "Nối danh từ: と, や, か"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "と" }, " lists every item, ", { term: "や" }, " lists examples and leaves others open, ", { term: "か" }, " offers a choice."]
              uk: [{ term: "と" }, " називає всі предмети, ", { term: "や" }, " називає приклади й лишає решту відкритою, ", { term: "か" }, " пропонує вибір."]
              es: [{ term: "と" }, " enumera todos los elementos, ", { term: "や" }, " enumera ejemplos y deja abiertos otros, ", { term: "か" }, " ofrece una elección."]
              pt: [{ term: "と" }, " lista todos os itens, ", { term: "や" }, " lista exemplos e deixa outros em aberto, ", { term: "か" }, " oferece uma escolha."]
              fr: [{ term: "と" }, " énumère tous les éléments, ", { term: "や" }, " énumère des exemples et laisse le reste ouvert, ", { term: "か" }, " propose un choix."]
              de: [{ term: "と" }, " nennt alle Posten, ", { term: "や" }, " nennt Beispiele und lässt anderes offen, ", { term: "か" }, " bietet eine Wahl."]
              it: [{ term: "と" }, " elenca tutti gli elementi, ", { term: "や" }, " elenca esempi e lascia aperti altri, ", { term: "か" }, " offre una scelta."]
              pl: [{ term: "と" }, " wymienia wszystko, ", { term: "や" }, " wymienia przykłady i zostawia resztę otwartą, ", { term: "か" }, " daje wybór."]
              tr: [{ term: "と" }, " bütün öğeleri sayar, ", { term: "や" }, " örnek sayıp gerisini açık bırakır, ", { term: "か" }, " bir seçim sunar."]
              id: [{ term: "と" }, " menyebut semua butir, ", { term: "や" }, " menyebut contoh dan membiarkan yang lain terbuka, ", { term: "か" }, " menawarkan pilihan."]
              vi: [{ term: "と" }, " liệt kê tất cả, ", { term: "や" }, " liệt kê ví dụ và để ngỏ phần còn lại, ", { term: "か" }, " đưa ra lựa chọn."]
      - type: "usage"
        columns:
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            use:
              en: [{ term: "と" }, ": and, with every item named"]
              uk: [{ term: "と" }, ": і, із названими всіма предметами"]
              es: [{ term: "と" }, ": y, con todos los elementos nombrados"]
              pt: [{ term: "と" }, ": e, com todos os itens nomeados"]
              fr: [{ term: "と" }, " : et, avec tous les éléments nommés"]
              de: [{ term: "と" }, ": und, mit allen genannten Posten"]
              it: [{ term: "と" }, ": e, con tutti gli elementi nominati"]
              pl: [{ term: "と" }, ": i, ze wszystkimi wymienionymi rzeczami"]
              tr: [{ term: "と" }, ": ve, bütün öğeler adıyla anılarak"]
              id: [{ term: "と" }, ": dan, dengan semua butir disebut"]
              vi: [{ term: "と" }, ": và, với mọi thứ đều được nêu"]
            ex: ["パン", { target: "と" }, "たまごを", { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat bread and eggs.", uk: "Я їм хліб і яйця.", es: "Como pan y huevos.", pt: "Eu como pão e ovos.", fr: "Je mange du pain et des œufs.", de: "Ich esse Brot und Eier.", it: "Mangio pane e uova.", pl: "Jem chleb i jajka.", tr: "Ekmek ve yumurta yerim.", id: "Saya makan roti dan telur.", vi: "Tôi ăn bánh mì và trứng." }
          - level: "A1"
            use:
              en: [{ term: "と" }, " after a person: with"]
              uk: [{ term: "と" }, " після особи: разом із"]
              es: [{ term: "と" }, " tras una persona: con"]
              pt: [{ term: "と" }, " depois de uma pessoa: com"]
              fr: [{ term: "と" }, " après une personne : avec"]
              de: [{ term: "と" }, " nach einer Person: mit"]
              it: [{ term: "と" }, " dopo una persona: con"]
              pl: [{ term: "と" }, " po osobie: z"]
              tr: ["Bir kişiden sonra ", { term: "と" }, ": ile"]
              id: [{ term: "と" }, " setelah orang: dengan"]
              vi: [{ term: "と" }, " sau người: cùng với"]
            ex: ["ともだち", { target: "と" }, { kanji: "日本", reading: "にほん" }, "へ", { kanji: "行", reading: "い" }, "きます。"]
            tr: { en: "I go to Japan with a friend.", uk: "Я їду до Японії з другом.", es: "Voy a Japón con un amigo.", pt: "Eu vou ao Japão com um amigo.", fr: "Je vais au Japon avec un ami.", de: "Ich fahre mit einem Freund nach Japan.", it: "Vado in Giappone con un amico.", pl: "Jadę do Japonii z przyjacielem.", tr: "Bir arkadaşımla Japonya’ya giderim.", id: "Saya pergi ke Jepang dengan teman.", vi: "Tôi đi Nhật Bản cùng một người bạn." }
          - level: "A1"
            use:
              en: [{ term: "と" }, " between the two names of a pair"]
              uk: [{ term: "と" }, " між двома іменами пари"]
              es: [{ term: "と" }, " entre los dos nombres de una pareja"]
              pt: [{ term: "と" }, " entre os dois nomes de um par"]
              fr: [{ term: "と" }, " entre les deux noms d’une paire"]
              de: [{ term: "と" }, " zwischen den zwei Namen eines Paares"]
              it: [{ term: "と" }, " fra i due nomi di una coppia"]
              pl: [{ term: "と" }, " między dwoma imionami pary"]
              tr: ["Bir çiftin iki adı arasında ", { term: "と" }]
              id: [{ term: "と" }, " di antara dua nama sepasang"]
              vi: [{ term: "と" }, " giữa hai cái tên của một cặp"]
            ex: ["アンナさん", { target: "と" }, "ジョンさんは", { kanji: "学生", reading: "がくせい" }, "です。"]
            tr: { en: "Anna and John are students.", uk: "Анна й Джон — студенти.", es: "Anna y John son estudiantes.", pt: "A Anna e o John são estudantes.", fr: "Anna et John sont étudiants.", de: "Anna und John sind Studenten.", it: "Anna e John sono studenti.", pl: "Anna i John są studentami.", tr: "Anna ile John öğrenci.", id: "Anna dan John adalah mahasiswa.", vi: "Anna và John là sinh viên." }
          - level: "A2"
            use:
              en: [{ term: "や" }, ": and others of the same kind"]
              uk: [{ term: "や" }, ": і інше такого ж роду"]
              es: [{ term: "や" }, ": y otros del mismo tipo"]
              pt: [{ term: "や" }, ": e outros do mesmo tipo"]
              fr: [{ term: "や" }, " : et d’autres du même genre"]
              de: [{ term: "や" }, ": und andere derselben Art"]
              it: [{ term: "や" }, ": e altri dello stesso tipo"]
              pl: [{ term: "や" }, ": i inne tego samego rodzaju"]
              tr: [{ term: "や" }, ": ve aynı türden başkaları"]
              id: [{ term: "や" }, ": dan yang lain sejenis"]
              vi: [{ term: "や" }, ": và những thứ cùng loại"]
            ex: ["りんご", { target: "や" }, "バナナを", { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat apples, bananas and the like.", uk: "Я їм яблука, банани й таке інше.", es: "Como manzanas, plátanos y cosas así.", pt: "Eu como maçãs, bananas e coisas assim.", fr: "Je mange des pommes, des bananes, etc.", de: "Ich esse Äpfel, Bananen und so weiter.", it: "Mangio mele, banane e così via.", pl: "Jem jabłka, banany i tym podobne.", tr: "Elma, muz gibi şeyler yerim.", id: "Saya makan apel, pisang, dan semacamnya.", vi: "Tôi ăn táo, chuối và những thứ tương tự." }
          - level: "A2"
            use:
              en: [{ term: "か" }, ": or"]
              uk: [{ term: "か" }, ": або"]
              es: [{ term: "か" }, ": o"]
              pt: [{ term: "か" }, ": ou"]
              fr: [{ term: "か" }, " : ou"]
              de: [{ term: "か" }, ": oder"]
              it: [{ term: "か" }, ": o"]
              pl: [{ term: "か" }, ": lub"]
              tr: [{ term: "か" }, ": ya da"]
              id: [{ term: "か" }, ": atau"]
              vi: [{ term: "か" }, ": hoặc"]
            ex: ["コーヒー", { target: "か" }, "おちゃを", { kanji: "飲", reading: "の" }, "みます。"]
            tr: { en: "I drink coffee or tea.", uk: "Я п’ю каву або чай.", es: "Tomo café o té.", pt: "Eu tomo café ou chá.", fr: "Je bois du café ou du thé.", de: "Ich trinke Kaffee oder Tee.", it: "Bevo caffè o tè.", pl: "Piję kawę lub herbatę.", tr: "Kahve ya da çay içerim.", id: "Saya minum kopi atau teh.", vi: "Tôi uống cà phê hoặc trà." }
      - type: "list"
        items:
          - type: "note"
            level: "A2"
            text:
              en: [{ term: "か" }, " also ends a question. See ", { link: "Questions", to: "ja.sentence-basics.questions" }, "."]
              uk: [{ term: "か" }, " також завершує питання. Див. ", { link: "Питання", to: "ja.sentence-basics.questions" }, "."]
