    fr: [{ term: "と" }, " relie des noms, ", { term: "も" }, " veut dire « aussi », ", { term: "の" }, " rattache un nom à celui qu’il décrit, et ", { term: "から" }, " et ", { term: "まで" }, " marquent le début et la fin."]
    de: [{ term: "と" }, " verbindet Nomen, ", { term: "も" }, " heißt „auch“, ", { term: "の" }, " verbindet ein Nomen mit dem, das es beschreibt, und ", { term: "から" }, " und ", { term: "まで" }, " markieren Anfang und Ende."]
    it: [{ term: "と" }, " unisce i nomi, ", { term: "も" }, " significa «anche», ", { term: "の" }, " lega un nome a quello che descrive, e ", { term: "から" }, " e ", { term: "まで" }, " segnano l’inizio e la fine."]
    pl: [{ term: "と" }, " łączy rzeczowniki, ", { term: "も" }, " znaczy „też”, ", { term: "の" }, " wiąże rzeczownik z tym, który opisuje, a ", { term: "から" }, " i ", { term: "まで" }, " oznaczają początek i koniec."]
    tr: [{ term: "と" }, " adları bağlar, ", { term: "も" }, " “de/da” anlamı verir, ", { term: "の" }, " bir adı onu niteleyen adla bağlar, ", { term: "から" }, " ile ", { term: "まで" }, " başlangıcı ve sonu gösterir."]
    id: [{ term: "と" }, " menghubungkan kata benda, ", { term: "も" }, " berarti “juga”, ", { term: "の" }, " mengaitkan kata benda dengan yang diterangkannya, ", { term: "から" }, " dan ", { term: "まで" }, " menandai awal dan akhir."]
