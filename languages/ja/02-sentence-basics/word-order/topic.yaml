            ex: { exchange: [["コーヒーを", { kanji: "飲", reading: "の" }, "みますか。"], ["はい、", { kanji: "飲", reading: "の" }, "みます。"]] }
            tr: { en: { exchange: ["Do you drink coffee?", "Yes, I do."] }, uk: { exchange: ["Ви п’єте каву?", "Так, п’ю."] }, es: { exchange: ["¿Tomas café?", "Sí, tomo."] }, pt: { exchange: ["Você toma café?", "Sim, tomo."] }, fr: { exchange: ["Vous prenez du café ?", "Oui, j’en prends."] }, de: { exchange: ["Trinkst du Kaffee?", "Ja, ich trinke welchen."] }, it: { exchange: ["Prendi il caffè?", "Sì, lo prendo."] }, pl: { exchange: ["Pijesz kawę?", "Tak, piję."] }, tr: { exchange: ["Kahve içer misin?", "Evet, içerim."] }, id: { exchange: ["Kamu minum kopi?", "Ya, saya minum."] }, vi: { exchange: ["Bạn có uống cà phê không?", "Có, tôi uống."] } }
          - level: "A1"
            use:
              en: "A subject that has been named carries over to the next sentence"
              uk: "Названий підмет переходить у наступне речення"
              es: "El sujeto ya nombrado pasa a la oración siguiente"
              pt: "O sujeito já nomeado passa para a frase seguinte"
              fr: "Le sujet déjà nommé passe à la phrase suivante"
              de: "Ein genanntes Subjekt gilt für den nächsten Satz weiter"
              it: "Il soggetto già nominato passa alla frase seguente"
              pl: "Podmiot, który już padł, przechodzi do następnego zdania"
              tr: "Adı geçen özne sonraki cümleye geçer"
              id: "Subjek yang sudah disebut berlanjut ke kalimat berikutnya"
              vi: "Chủ ngữ đã nêu được giữ sang câu sau"
            ex: ["きのう、ともだちにあいました。いっしょにごはんを", { kanji: "食", reading: "た" }, "べました。"]
            tr: { en: "Yesterday I met a friend. We ate a meal together.", uk: "Вчора я зустрівся з другом. Ми разом поїли.", es: "Ayer me encontré con un amigo. Comimos juntos.", pt: "Ontem encontrei um amigo. Comemos juntos.", fr: "Hier, j’ai retrouvé un ami. Nous avons mangé ensemble.", de: "Gestern habe ich einen Freund getroffen. Wir haben zusammen gegessen.", it: "Ieri ho incontrato un amico. Abbiamo mangiato insieme.", pl: "Wczoraj spotkałem się z przyjacielem. Zjedliśmy razem posiłek.", tr: "Dün bir arkadaşımla buluştum. Birlikte yemek yedik.", id: "Kemarin saya bertemu teman. Kami makan bersama.", vi: "Hôm qua tôi gặp một người bạn. Chúng tôi cùng ăn cơm." }
          - level: "A2"
            use:
              en: "Casual speech also drops the particles"
              uk: "У невимушеній мові часто опускають і частки"
              es: "El habla informal omite también las partículas"
              pt: "A fala informal omite também as partículas"
              fr: "La langue familière omet aussi les particules"
              de: "Die Umgangssprache lässt auch die Partikeln weg"
