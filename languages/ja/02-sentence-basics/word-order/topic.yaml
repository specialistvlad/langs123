            ex: [{ kanji: "私", reading: "わたし" }, "はりんごを", { target: "ふたつ" }, { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat two apples.", uk: "Я їм два яблука.", es: "Como dos manzanas.", pt: "Eu como duas maçãs.", fr: "Je mange deux pommes.", de: "Ich esse zwei Äpfel.", it: "Mangio due mele.", pl: "Jem dwa jabłka.", tr: "İki elma yiyorum.", id: "Saya makan dua apel.", vi: "Tôi ăn hai quả táo." }
      - type: "list"
        items:
          - type: "note"
            level: "A1"
            text:
              en: ["The adjectives: ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, " and ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, ". The numbers: ", { link: "Counters", to: "ja.foundations.counters" }, ". ", { term: "この" }, " and ", { term: "その" }, ": ", { link: "こそあど: This, That, Which", to: ja.sentence-basics.ko-so-a-do }, "."]
              uk: ["Прикметники: ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, " та ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, ". Числа: ", { link: "Лічильні слова", to: "ja.foundations.counters" }, ". ", { term: "この" }, " і ", { term: "その" }, ": ", { link: "こそあど: цей, той, який", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              es: ["Los adjetivos: ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, " y ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, ". Los números: ", { link: "Los contadores", to: "ja.foundations.counters" }, ". ", { term: "この" }, " y ", { term: "その" }, ": ", { link: "こそあど: este, ese, aquel, cuál", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              pt: ["Os adjetivos: ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, ". Os números: ", { link: "Contadores", to: ja.foundations.counters }, ". ", { term: "この" }, " e ", { term: "その" }, ": ", { link: "こそあど: este, esse, aquele, qual", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              fr: ["Les adjectifs : ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, " et ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, ". Les nombres : ", { link: "Les compteurs", to: "ja.foundations.counters" }, ". ", { term: "この" }, " et ", { term: "その" }, " : ", { link: "こそあど : ce, ce, celui-là, lequel", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              de: ["Die Adjektive: ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, " und ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, ". Die Zahlen: ", { link: "Zählwörter", to: "ja.foundations.counters" }, ". ", { term: "この" }, " und ", { term: "その" }, ": ", { link: "こそあど: dieser, der, jener, welcher", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              it: ["Gli aggettivi: ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, ". I numeri: ", { link: "I contatori", to: "ja.foundations.counters" }, ". ", { term: "この" }, " e ", { term: "その" }, ": ", { link: "こそあど: questo, codesto, quello, quale", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              pl: ["Przymiotniki: ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, " i ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, ". Liczby: ", { link: "Liczniki", to: "ja.foundations.counters" }, ". ", { term: "この" }, " i ", { term: "その" }, ": ", { link: "こそあど: ten, ten, tamten, który", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              tr: ["Sıfatlar: ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, " ve ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, ". Sayılar: ", { link: "Sayaçlar", to: "ja.foundations.counters" }, ". ", { term: "この" }, " ve ", { term: "その" }, ": ", { link: "こそあど: bu, şu, o, hangisi", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              id: ["Kata sifat: ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, " dan ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, ". Bilangan: ", { link: "Kata bantu bilangan", to: "ja.foundations.counters" }, ". ", { term: "この" }, " dan ", { term: "その" }, ": ", { link: "こそあど: ini, itu, yang di sana, yang mana", to: "ja.sentence-basics.ko-so-a-do" }, "."]
              vi: ["Tính từ: ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, " và ", { link: "Tính từ な", to: "ja.adjectives.na-adjectives" }, ". Số lượng: ", { link: "Lượng từ", to: "ja.foundations.counters" }, ". ", { term: "この" }, " và ", { term: "その" }, ": ", { link: "こそあど: này, đó, kia, nào", to: "ja.sentence-basics.ko-so-a-do" }, "."]
          - type: "note"
            level: "A2"
            text:
              en: ["A whole clause can stand before a noun too. See ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Clauses Before Nouns"], to: ja.linking.noun-modification }, "."]
              uk: ["Перед іменником може стояти й ціле підрядне речення. Див. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": речення перед іменником"], to: ja.linking.noun-modification }, "."]
              es: ["Una cláusula entera también puede ir antes de un sustantivo. Véase ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": oraciones antes del sustantivo"], to: ja.linking.noun-modification }, "."]
              pt: ["Uma oração inteira também pode vir antes de um substantivo. Veja ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": orações antes do substantivo"], to: ja.linking.noun-modification }, "."]
              fr: ["Une proposition entière peut aussi précéder un nom. Voir ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, " : une proposition devant le nom"], to: ja.linking.noun-modification }, "."]
              de: ["Auch ein ganzer Nebensatz kann vor einem Nomen stehen. Siehe ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Sätze vor dem Nomen"], to: ja.linking.noun-modification }, "."]
              it: ["Anche un’intera frase può stare prima di un nome. Vedi ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": proposizioni prima del nome"], to: ja.linking.noun-modification }, "."]
              pl: ["Przed rzeczownikiem może stać też całe zdanie. Zob. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": zdanie przed rzeczownikiem"], to: ja.linking.noun-modification }, "."]
              tr: ["İsimden önce bütün bir yan cümle de gelebilir. Bkz. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": ismin önündeki cümle"], to: ja.linking.noun-modification }, "."]
              id: ["Satu klausa utuh juga bisa berada sebelum kata benda. Lihat ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": klausa sebelum kata benda"], to: ja.linking.noun-modification }, "."]
              vi: ["Cả một mệnh đề cũng có thể đứng trước danh từ. Xem ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": mệnh đề đứng trước danh từ"], to: ja.linking.noun-modification }, "."]
