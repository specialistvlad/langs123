summary:
  lead:
    en: "The verb comes last and particles mark each word’s role; time, place and object stand before it, and a modifier stands before its noun."
    uk: "Дієслово стоїть наприкінці, а частки позначають роль кожного слова; час, місце й додаток стоять перед ним, а означення — перед іменником."
    es: "El verbo va al final y las partículas marcan el papel de cada palabra; el tiempo, el lugar y el objeto van antes, y el modificador, antes de su sustantivo."
    pt: "O verbo vem no fim e as partículas marcam a função de cada palavra; tempo, lugar e objeto vêm antes dele, e o modificador, antes do seu substantivo."
    fr: "Le verbe vient en dernier et les particules marquent le rôle de chaque mot ; temps, lieu et objet le précèdent, et le déterminant précède son nom."
    de: "Das Verb steht am Ende und Partikeln zeigen die Rolle jedes Wortes; Zeit, Ort und Objekt stehen davor, eine Bestimmung vor ihrem Nomen."
    it: "Il verbo viene per ultimo e le particelle segnano il ruolo di ogni parola; tempo, luogo e oggetto lo precedono, il modificatore sta prima del nome."
    pl: "Czasownik stoi na końcu, a partykuły wskazują rolę każdego wyrazu; czas, miejsce i dopełnienie stoją przed nim, a określenie przed rzeczownikiem."
    tr: "Fiil sonda gelir, edatlar her sözcüğün görevini belirtir; zaman, yer ve nesne fiilden önce, tamlayan ise isimden önce gelir."
    id: "Kata kerja berada di akhir dan partikel menandai peran tiap kata; waktu, tempat, dan objek mendahuluinya, penjelas berada sebelum kata bendanya."
    vi: "Động từ đứng cuối câu, trợ từ đánh dấu vai trò từng từ; thời gian, nơi chốn, tân ngữ đứng trước nó, từ bổ nghĩa đứng trước danh từ."
  rule:
    en: "Put the verb last, and the other words with their particles before it:"
    uk: "Поставте дієслово в кінець, а інші слова з їхніми частками — перед ним:"
    es: "Pon el verbo al final y las demás palabras, con sus partículas, antes:"
    pt: "Ponha o verbo no fim e as outras palavras, com suas partículas, antes dele:"
    fr: "Mettez le verbe en dernier et les autres mots, avec leurs particules, avant lui :"
    de: "Setze das Verb ans Ende und die übrigen Wörter mit ihren Partikeln davor:"
    it: "Metti il verbo alla fine e le altre parole, con le loro particelle, prima:"
    pl: "Postaw czasownik na końcu, a pozostałe wyrazy z ich partykułami przed nim:"
    tr: "Fiili sona koy, diğer sözcükleri edatlarıyla birlikte önüne yerleştir:"
    id: "Taruh kata kerja di akhir, dan kata lain beserta partikelnya sebelum itu:"
    vi: "Đặt động từ ở cuối, các từ khác kèm trợ từ đứng trước nó:"
  ex: [{ kanji: "私", reading: "わたし" }, "はパンを", { target: [{ kanji: "食", reading: "た" }, "べます"] }, "。"]
