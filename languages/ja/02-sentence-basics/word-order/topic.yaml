sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["The verb comes last: the sentence ends with it, or with ", { term: "です" }, "."]
              uk: ["Дієслово стоїть останнім: ним, або ", { term: "です" }, ", закінчується речення."]
              es: ["El verbo va al final: la oración termina con él, o con ", { term: "です" }, "."]
              pt: ["O verbo vem no fim: a frase termina com ele, ou com ", { term: "です" }, "."]
              fr: ["Le verbe vient en dernier : la phrase se termine par lui, ou par ", { term: "です" }, "."]
              de: ["Das Verb steht am Ende: Der Satz endet mit ihm oder mit ", { term: "です" }, "."]
              it: ["Il verbo viene per ultimo: la frase finisce con lui, o con ", { term: "です" }, "."]
              pl: ["Czasownik stoi na końcu: zdanie kończy się nim albo ", { term: "です" }, "."]
              tr: ["Fiil sonda gelir: cümle onunla ya da ", { term: "です" }, " ile biter."]
              id: ["Kata kerja berada di akhir: kalimat berakhir dengannya, atau dengan ", { term: "です" }, "."]
              vi: ["Động từ đứng cuối: câu kết thúc bằng nó hoặc bằng ", { term: "です" }, "."]
            ex: [{ kanji: "私", reading: "わたし" }, "はパンを", { target: [{ kanji: "食", reading: "た" }, "べます"] }, "。"]
            tr: { en: "I eat bread.", uk: "Я їм хліб.", es: "Yo como pan.", pt: "Eu como pão.", fr: "Je mange du pain.", de: "Ich esse Brot.", it: "Mangio pane.", pl: "Jem chleb.", tr: "Ekmek yiyorum.", id: "Saya makan roti.", vi: "Tôi ăn bánh mì." }
          - type: "rule"
            level: "A1"
            text:
              en: "A particle after each word marks its role; the meaning follows the particles, not the position."
              uk: "Частка після кожного слова позначає його роль; зміст залежить від часток, а не від місця слова."
              es: "Una partícula tras cada palabra marca su papel; el sentido depende de las partículas, no de la posición."
              pt: "Uma partícula depois de cada palavra marca a sua função; o sentido depende das partículas, não da posição."
              fr: "Une particule après chaque mot marque son rôle ; le sens dépend des particules, pas de la place."
              de: "Eine Partikel hinter jedem Wort zeigt seine Rolle; die Bedeutung folgt den Partikeln, nicht der Stellung."
              it: "Una particella dopo ogni parola ne segna il ruolo; il senso dipende dalle particelle, non dalla posizione."
              pl: "Partykuła po każdym wyrazie wskazuje jego rolę; sens zależy od partykuł, nie od miejsca."
              tr: "Her sözcükten sonra gelen edat görevini belirtir; anlam sıraya değil edatlara bağlıdır."
              id: "Partikel setelah tiap kata menandai perannya; makna mengikuti partikel, bukan posisi."
              vi: "Trợ từ sau mỗi từ đánh dấu vai trò của nó; ý nghĩa theo trợ từ chứ không theo vị trí."
            ex: { examples: [["いぬ", { target: "が" }, "ねこ", { target: "を" }, { kanji: "見", reading: "み" }, "ます。"], ["ねこ", { target: "が" }, "いぬ", { target: "を" }, { kanji: "見", reading: "み" }, "ます。"]] }
            tr: { en: { examples: ["The dog looks at the cat.", "The cat looks at the dog."] }, uk: { examples: ["Пес дивиться на кота.", "Кіт дивиться на пса."] }, es: { examples: ["El perro mira al gato.", "El gato mira al perro."] }, pt: { examples: ["O cachorro olha para o gato.", "O gato olha para o cachorro."] }, fr: { examples: ["Le chien regarde le chat.", "Le chat regarde le chien."] }, de: { examples: ["Der Hund sieht die Katze an.", "Die Katze sieht den Hund an."] }, it: { examples: ["Il cane guarda il gatto.", "Il gatto guarda il cane."] }, pl: { examples: ["Pies patrzy na kota.", "Kot patrzy na psa."] }, tr: { examples: ["Köpek kediye bakıyor.", "Kedi köpeğe bakıyor."] }, id: { examples: ["Anjing melihat kucing.", "Kucing melihat anjing."] }, vi: { examples: ["Con chó nhìn con mèo.", "Con mèo nhìn con chó."] } }
          - type: "rule"
            level: "A1"
            text:
              en: "A modifier stands before its noun, and the noun it describes comes last."
              uk: "Означення стоїть перед іменником, а описуваний іменник завжди останній."
              es: "El modificador va antes del sustantivo, y el sustantivo descrito va al final."
              pt: "O modificador vem antes do substantivo, e o substantivo descrito vem no fim."
              fr: "Le déterminant précède le nom, et le nom décrit vient en dernier."
              de: "Die Bestimmung steht vor dem Nomen, und das beschriebene Nomen kommt zuletzt."
              it: "Il modificatore sta prima del nome, e il nome descritto viene per ultimo."
              pl: "Określenie stoi przed rzeczownikiem, a opisywany rzeczownik jest ostatni."
              tr: "Tamlayan isimden önce gelir, tanımlanan isim en sonda durur."
              id: "Penjelas berada sebelum kata benda, dan kata benda yang dijelaskan berada paling akhir."
              vi: "Từ bổ nghĩa đứng trước danh từ, và danh từ được mô tả đứng cuối cùng."
            ex: ["これは", { target: [{ kanji: "私", reading: "わたし" }, "の", { kanji: "小", reading: "ちい" }, "さい"] }, "ねこです。"]
            tr: { en: "This is my small cat.", uk: "Це мій маленький кіт.", es: "Este es mi gato pequeño.", pt: "Este é o meu gato pequeno.", fr: "C’est mon petit chat.", de: "Das ist meine kleine Katze.", it: "Questo è il mio gatto piccolo.", pl: "To mój mały kot.", tr: "Bu benim küçük kedim.", id: "Ini kucing kecil saya.", vi: "Đây là con mèo nhỏ của tôi." }
          - type: "note"
            level: "A1"
            text:
              en: ["A question keeps the order and ends in ", { term: "か" }, ". See ", { link: "Questions", to: "ja.sentence-basics.questions" }, "."]
              uk: ["Питання зберігає порядок слів і закінчується на ", { term: "か" }, ". Див. ", { link: "Питання", to: "ja.sentence-basics.questions" }, "."]
              es: ["La pregunta conserva el orden y termina en ", { term: "か" }, ". Véase ", { link: "Las preguntas", to: "ja.sentence-basics.questions" }, "."]
              pt: ["A pergunta mantém a ordem e termina em ", { term: "か" }, ". Veja ", { link: "As perguntas", to: "ja.sentence-basics.questions" }, "."]
              fr: ["La question garde l’ordre et se termine par ", { term: "か" }, ". Voir ", { link: "Les questions", to: "ja.sentence-basics.questions" }, "."]
              de: ["Die Frage behält die Stellung und endet auf ", { term: "か" }, ". Siehe ", { link: "Fragen", to: "ja.sentence-basics.questions" }, "."]
              it: ["La domanda mantiene l’ordine e finisce con ", { term: "か" }, ". Vedi ", { link: "Le domande", to: "ja.sentence-basics.questions" }, "."]
              pl: ["Pytanie zachowuje szyk i kończy się na ", { term: "か" }, ". Zob. ", { link: "Pytania", to: "ja.sentence-basics.questions" }, "."]
              tr: ["Soru sırayı korur ve ", { term: "か" }, " ile biter. Bkz. ", { link: "Soru cümleleri", to: "ja.sentence-basics.questions" }, "."]
              id: ["Pertanyaan mempertahankan urutan dan diakhiri ", { term: "か" }, ". Lihat ", { link: "Kalimat tanya", to: "ja.sentence-basics.questions" }, "."]
              vi: ["Câu hỏi giữ nguyên trật tự và kết thúc bằng ", { term: "か" }, ". Xem ", { link: "Câu hỏi", to: "ja.sentence-basics.questions" }, "."]
