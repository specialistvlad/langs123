              id: "Ragam santai juga melesapkan partikel"
              vi: "Văn nói thân mật cũng bỏ cả trợ từ"
            ex: ["もう、ごはん", { kanji: "食", reading: "た" }, "べた？"]
            tr: { en: "Have you eaten yet?", uk: "Ти вже поїв?", es: "¿Ya comiste?", pt: "Você já comeu?", fr: "Tu as déjà mangé ?", de: "Hast du schon gegessen?", it: "Hai già mangiato?", pl: "Jadłeś już?", tr: "Yemek yedin mi?", id: "Sudah makan?", vi: "Bạn ăn cơm chưa?" }
      - type: "list"
        items:
          - type: "note"
            level: "A2"
            text:
              en: ["Casual speech uses the plain form. See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
