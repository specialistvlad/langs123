            es: [{ term: [{ kanji: "小", reading: "ちい" }, "さい"] }, " y ", { term: [{ kanji: "日本", reading: "にほん" }, "の"] }, " van antes del sustantivo al que describen."]
            pt: [{ term: [{ kanji: "小", reading: "ちい" }, "さい"] }, " e ", { term: [{ kanji: "日本", reading: "にほん" }, "の"] }, " vêm antes do substantivo que descrevem."]
            fr: [{ term: [{ kanji: "小", reading: "ちい" }, "さい"] }, " et ", { term: [{ kanji: "日本", reading: "にほん" }, "の"] }, " précèdent le nom qu’ils décrivent."]
