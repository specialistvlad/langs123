              es: ["El habla informal usa la forma simple. Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A fala informal usa a forma simples. Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La langue familière emploie la forme simple. Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Die Umgangssprache verwendet die einfache Form. Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["Il parlato informale usa la forma semplice. Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["W mowie potocznej używa się formy prostej. Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Günlük konuşmada yalın biçim kullanılır. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
