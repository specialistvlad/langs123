              pl: ["Same godziny są w temacie ", { link: "Podawanie godziny", to: ja.foundations.telling-time }, "; partykuły を, に, で, へ w temacie ", { link: "Partykuły を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
