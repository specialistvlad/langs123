            tr: { en: { examples: ["This is my book.", "This is a Japanese book."] }, uk: { examples: ["Це моя книга.", "Це японська книга."] }, es: { examples: ["Este es mi libro.", "Este es un libro japonés."] }, pt: { examples: ["Este é o meu livro.", "Este é um livro japonês."] }, fr: { examples: ["C’est mon livre.", "C’est un livre japonais."] }, de: { examples: ["Das ist mein Buch.", "Das ist ein japanisches Buch."] }, it: { examples: ["Questo è il mio libro.", "Questo è un libro giapponese."] }, pl: { examples: ["To moja książka.", "To japońska książka."] }, tr: { examples: ["Bu benim kitabım.", "Bu Japonca bir kitap."] }, id: { examples: ["Ini buku saya.", "Ini buku Jepang."] }, vi: { examples: ["Đây là sách của tôi.", "Đây là sách tiếng Nhật."] } }
