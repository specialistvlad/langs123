              en: ["a question word as the subject takes ", { term: "が" }, ", not ", { term: "は" }]
              uk: ["питальне слово в ролі підмета має ", { term: "が" }, ", а не ", { term: "は" }]
              es: ["la palabra interrogativa como sujeto lleva ", { term: "が" }, ", no ", { term: "は" }]
              pt: ["a palavra interrogativa como sujeito leva ", { term: "が" }, ", não ", { term: "は" }]
              fr: ["le mot interrogatif sujet prend ", { term: "が" }, ", non ", { term: "は" }]
              de: ["ein Fragewort als Subjekt steht mit ", { term: "が" }, ", nicht mit ", { term: "は" }]
              it: ["la parola interrogativa soggetto prende ", { term: "が" }, ", non ", { term: "は" }]
              pl: ["słowo pytające w roli podmiotu ma ", { term: "が" }, ", nie ", { term: "は" }]
