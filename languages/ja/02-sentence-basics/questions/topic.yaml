              fr: ["Un mot interrogatif sujet prend ", { term: "が" }, ". Voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, "."]
              de: ["Ein Fragewort als Subjekt steht mit ", { term: "が" }, ". Siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, "."]
              it: ["Una parola interrogativa soggetto prende ", { term: "が" }, ". Vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              pl: ["Słowo pytające w roli podmiotu ma ", { term: "が" }, ". Zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, "."]
              tr: ["Özne olan soru sözcüğü ", { term: "が" }, " alır. Bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, "."]
              id: ["Kata tanya sebagai subjek memakai ", { term: "が" }, ". Lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, "."]
              vi: ["Từ để hỏi làm chủ ngữ đi với ", { term: "が" }, ". Xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, "."]
