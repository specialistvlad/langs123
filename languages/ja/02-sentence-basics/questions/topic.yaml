              de: ["Die Kurzantworten ", { term: "そうです" }, " und ", { term: "ちがいます" }, " stehen in ", { link: "です: sein", to: "ja.sentence-basics.desu" }, "."]
              it: ["Le risposte brevi ", { term: "そうです" }, " e ", { term: "ちがいます" }, " sono in ", { link: "です: essere", to: "ja.sentence-basics.desu" }, "."]
              pl: ["Krótkie odpowiedzi ", { term: "そうです" }, " i ", { term: "ちがいます" }, " są w temacie ", { link: "です: być", to: "ja.sentence-basics.desu" }, "."]
              tr: [{ term: "そうです" }, " ve ", { term: "ちがいます" }, " kısa cevapları ", { link: "です: olmak", to: "ja.sentence-basics.desu" }, " konusundadır."]
              id: ["Jawaban singkat ", { term: "そうです" }, " dan ", { term: "ちがいます" }, " ada di ", { link: "です: adalah", to: "ja.sentence-basics.desu" }, "."]
              vi: ["Các câu trả lời ngắn ", { term: "そうです" }, " và ", { term: "ちがいます" }, " nằm ở ", { link: "です: là", to: "ja.sentence-basics.desu" }, "."]
