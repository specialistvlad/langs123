              it: [{ term: "はい" }, " conferma ciò che dice la domanda, affermativa o negativa; ", { term: "いいえ" }, " lo nega."]
              pl: [{ term: "はい" }, " potwierdza to, co mówi pytanie, twierdzące lub przeczące; ", { term: "いいえ" }, " temu zaprzecza."]
