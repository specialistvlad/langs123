              id: ["kata tanya sebagai subjek memakai ", { term: "が" }, ", bukan ", { term: "は" }]
              vi: ["từ để hỏi làm chủ ngữ đi với ", { term: "が" }, ", không phải ", { term: "は" }]
          - level: "A2"
            wrong: { exchange: [["たなかさんは", { kanji: "学生", reading: "がくせい" }, "じゃありませんか。"], ["はい、", { kanji: "学生", reading: "がくせい" }, "です。"]] }
            right: { exchange: [["たなかさんは", { kanji: "学生", reading: "がくせい" }, "じゃありませんか。"], [{ target: "いいえ" }, "、", { kanji: "学生", reading: "がくせい" }, "です。"]] }
            rule:
              en: [{ term: "はい" }, " agrees with the negative question, so “he is a student” needs ", { term: "いいえ" }]
              uk: [{ term: "はい" }, " погоджується із заперечним питанням, тож «він студент» вимагає ", { term: "いいえ" }]
              es: [{ term: "はい" }, " da la razón a la pregunta negativa, así que «sí es estudiante» pide ", { term: "いいえ" }]
              pt: [{ term: "はい" }, " concorda com a pergunta negativa, então «ele é estudante» pede ", { term: "いいえ" }]
              fr: [{ term: "はい" }, " confirme la question négative, donc « si, il est étudiant » demande ", { term: "いいえ" }]
              de: [{ term: "はい" }, " stimmt der verneinten Frage zu, also verlangt „doch, er ist Student“ ", { term: "いいえ" }]
              it: [{ term: "はい" }, " conferma la domanda negativa, quindi «sì, è studente» richiede ", { term: "いいえ" }]
              pl: [{ term: "はい" }, " zgadza się z pytaniem przeczącym, więc „tak, jest studentem” wymaga ", { term: "いいえ" }]
              tr: [{ term: "はい" }, " olumsuz soruyu onaylar; “öğrenci” demek için ", { term: "いいえ" }, " gerekir"]
              id: [{ term: "はい" }, " membenarkan pertanyaan negatif, jadi “dia mahasiswa” memerlukan ", { term: "いいえ" }]
              vi: [{ term: "はい" }, " đồng ý với câu hỏi phủ định, nên “anh ấy là sinh viên” cần ", { term: "いいえ" }]
            speakers: ["en", "uk", "es", "pt", "fr", "de", "it", "pl"]
