              pt: [{ term: "はい" }, " confirma o que a pergunta diz, afirmativa ou negativa; ", { term: "いいえ" }, " o nega."]
              fr: [{ term: "はい" }, " confirme ce que dit la question, affirmative ou négative ; ", { term: "いいえ" }, " le nie."]
