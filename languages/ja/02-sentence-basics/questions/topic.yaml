      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "か" }, " at the end makes a question; the word order stays the same."]
              uk: [{ term: "か" }, " в кінці робить речення питанням; порядок слів не змінюється."]
              es: [{ term: "か" }, " al final forma la pregunta; el orden de las palabras no cambia."]
              pt: [{ term: "か" }, " no fim forma a pergunta; a ordem das palavras não muda."]
              fr: [{ term: "か" }, " en fin de phrase forme la question ; l’ordre des mots ne change pas."]
              de: [{ term: "か" }, " am Satzende bildet die Frage; die Wortstellung bleibt gleich."]
              it: [{ term: "か" }, " a fine frase forma la domanda; l’ordine delle parole non cambia."]
              pl: [{ term: "か" }, " na końcu tworzy pytanie; szyk wyrazów się nie zmienia."]
              tr: ["Sondaki ", { term: "か" }, " soru yapar; sözcük sırası değişmez."]
              id: [{ term: "か" }, " di akhir membentuk pertanyaan; urutan kata tidak berubah."]
              vi: [{ term: "か" }, " ở cuối câu tạo thành câu hỏi; trật tự từ không đổi."]
            ex: ["これはほん", { target: "ですか" }, "。"]
            tr: { en: "Is this a book?", uk: "Це книга?", es: "¿Esto es un libro?", pt: "Isto é um livro?", fr: "C’est un livre ?", de: "Ist das ein Buch?", it: "Questo è un libro?", pl: "Czy to jest książka?", tr: "Bu bir kitap mı?", id: "Apakah ini buku?", vi: "Đây có phải là quyển sách không?" }
          - type: "rule"
            level: "A0"
            text:
              en: "A question word stands where the answer will stand; the rest of the sentence stays."
              uk: "Питальне слово стоїть на місці відповіді; решта речення не змінюється."
              es: "La palabra interrogativa ocupa el lugar de la respuesta; el resto de la oración no cambia."
              pt: "A palavra interrogativa ocupa o lugar da resposta; o resto da frase não muda."
              fr: "Le mot interrogatif prend la place de la réponse ; le reste de la phrase ne change pas."
              de: "Das Fragewort steht an der Stelle der Antwort; der Rest des Satzes bleibt gleich."
              it: "La parola interrogativa prende il posto della risposta; il resto della frase non cambia."
              pl: "Słowo pytające stoi na miejscu odpowiedzi; reszta zdania się nie zmienia."
              tr: "Soru sözcüğü cevabın yerinde durur; cümlenin geri kalanı değişmez."
              id: "Kata tanya berada di posisi jawaban; bagian kalimat lainnya tetap."
              vi: "Từ để hỏi đứng ở chỗ của câu trả lời; phần còn lại của câu giữ nguyên."
            ex: { examples: ["これはほんです。", ["これは", { target: "なん" }, "ですか。"]] }
            tr: { en: { examples: ["This is a book.", "What is this?"] }, uk: { examples: ["Це книга.", "Що це?"] }, es: { examples: ["Esto es un libro.", "¿Qué es esto?"] }, pt: { examples: ["Isto é um livro.", "O que é isto?"] }, fr: { examples: ["C’est un livre.", "Qu’est-ce que c’est ?"] }, de: { examples: ["Das ist ein Buch.", "Was ist das?"] }, it: { examples: ["Questo è un libro.", "Che cos’è questo?"] }, pl: { examples: ["To jest książka.", "Co to jest?"] }, tr: { examples: ["Bu bir kitap.", "Bu nedir?"] }, id: { examples: ["Ini buku.", "Ini apa?"] }, vi: { examples: ["Đây là quyển sách.", "Đây là cái gì?"] } }
          - type: "note"
            level: "A1"
            text:
              en: ["A question word as the subject takes ", { term: "が" }, ". See ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, "."]
              uk: ["Питальне слово в ролі підмета має ", { term: "が" }, ". Див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, "."]
