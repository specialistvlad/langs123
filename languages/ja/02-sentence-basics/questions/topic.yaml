            form:
              en: ["With ", { term: "か" }, ": the voice rises on ", { term: "か" }]
              uk: ["З ", { term: "か" }, ": голос підвищується на ", { term: "か" }]
              es: ["Con ", { term: "か" }, ": la voz sube en ", { term: "か" }]
              pt: ["Com ", { term: "か" }, ": a voz sobe em ", { term: "か" }]
              fr: ["Avec ", { term: "か" }, " : la voix monte sur ", { term: "か" }]
              de: ["Mit ", { term: "か" }, ": Die Stimme steigt bei ", { term: "か" }]
              it: ["Con ", { term: "か" }, ": la voce sale su ", { term: "か" }]
              pl: ["Z ", { term: "か" }, ": głos wznosi się na ", { term: "か" }]
              tr: [{ term: "か" }, " ile: ses ", { term: "か" }, " üzerinde yükselir"]
              id: ["Dengan ", { term: "か" }, ": suara naik pada ", { term: "か" }]
              vi: ["Với ", { term: "か" }, ": giọng lên cao ở ", { term: "か" }]
            ex: ["これはほんですか。", { intonation: "rise" }]
            tr: { en: "Is this a book?", uk: "Це книга?", es: "¿Esto es un libro?", pt: "Isto é um livro?", fr: "C’est un livre ?", de: "Ist das ein Buch?", it: "Questo è un libro?", pl: "Czy to jest książka?", tr: "Bu bir kitap mı?", id: "Apakah ini buku?", vi: "Đây có phải là quyển sách không?" }
          - level: "A2"
            form:
              en: ["Casual speech without ", { term: "か" }, ": the voice rises on the last syllable"]
              uk: ["Розмовна мова без ", { term: "か" }, ": голос підвищується на останньому складі"]
              es: ["Habla informal sin ", { term: "か" }, ": la voz sube en la última sílaba"]
              pt: ["Fala informal sem ", { term: "か" }, ": a voz sobe na última sílaba"]
              fr: ["Langue familière sans ", { term: "か" }, " : la voix monte sur la dernière syllabe"]
              de: ["Umgangssprache ohne ", { term: "か" }, ": Die Stimme steigt auf der letzten Silbe"]
              it: ["Parlato informale senza ", { term: "か" }, ": la voce sale sull’ultima sillaba"]
              pl: ["Mowa potoczna bez ", { term: "か" }, ": głos wznosi się na ostatniej sylabie"]
              tr: [{ term: "か" }, " olmadan günlük konuşma: ses son hecede yükselir"]
              id: ["Ragam santai tanpa ", { term: "か" }, ": suara naik pada suku kata terakhir"]
              vi: ["Văn nói thân mật không có ", { term: "か" }, ": giọng lên cao ở âm tiết cuối"]
            ex: { exchange: [["コーヒー、", { kanji: "飲", reading: "の" }, "む", { intonation: "rise" }], ["うん、", { kanji: "飲", reading: "の" }, "む", { intonation: "fall" }]] }
            tr: { en: { exchange: ["Want some coffee?", "Yeah, I do."] }, uk: { exchange: ["Кави?", "Ага, хочу."] }, es: { exchange: ["¿Café?", "Sí, quiero."] }, pt: { exchange: ["Café?", "Quero, sim."] }, fr: { exchange: ["Un café ?", "Oui, volontiers."] }, de: { exchange: ["Kaffee?", "Ja, gern."] }, it: { exchange: ["Un caffè?", "Sì, volentieri."] }, pl: { exchange: ["Kawy?", "Tak, chętnie."] }, tr: { exchange: ["Kahve?", "Evet, içerim."] }, id: { exchange: ["Kopi?", "Ya, mau."] }, vi: { exchange: ["Cà phê không?", "Ừ, có."] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["In writing, a polite question ends in ", { term: "か" }, " and ", { term: "。" }, "; ", { term: "？" }, " belongs to casual messages. See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["На письмі ввічливе питання закінчується на ", { term: "か" }, " і ", { term: "。" }, "; ", { term: "？" }, " належить до невимушених повідомлень. Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["Por escrito, la pregunta cortés termina en ", { term: "か" }, " y ", { term: "。" }, "; ", { term: "？" }, " es propio de los mensajes informales. Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["Na escrita, a pergunta polida termina em ", { term: "か" }, " e ", { term: "。" }, "; ", { term: "？" }, " é próprio de mensagens informais. Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["À l’écrit, la question polie se termine par ", { term: "か" }, " et ", { term: "。" }, " ; ", { term: "？" }, " appartient aux messages familiers. Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Schriftlich endet die höfliche Frage auf ", { term: "か" }, " und ", { term: "。" }, "; ", { term: "？" }, " gehört in lockere Nachrichten. Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["Per iscritto, la domanda cortese finisce con ", { term: "か" }, " e ", { term: "。" }, "; ", { term: "？" }, " appartiene ai messaggi informali. Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["W piśmie grzeczne pytanie kończy się na ", { term: "か" }, " i ", { term: "。" }, "; ", { term: "？" }, " pojawia się w potocznych wiadomościach. Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Yazıda nazik soru ", { term: "か" }, " ve ", { term: "。" }, " ile biter; ", { term: "？" }, " gündelik mesajlara aittir. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Dalam tulisan, pertanyaan sopan diakhiri ", { term: "か" }, " dan ", { term: "。" }, "; ", { term: "？" }, " dipakai dalam pesan santai. Lihat ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Trong văn viết, câu hỏi lịch sự kết thúc bằng ", { term: "か" }, " và ", { term: "。" }, "; ", { term: "？" }, " dùng trong tin nhắn thân mật. Xem ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
