            word: { term: "なん" }
            meaning: { en: "“what”", uk: "«що»", es: "«qué»", pt: "«o que»", fr: "« quoi »", de: "„was“", it: "«che cosa»", pl: "„co”", tr: "“ne”", id: "“apa”", vi: "“cái gì”" }
            ex: { exchange: [["これは", { target: "なん" }, "ですか。"], "ペンです。"] }
            tr: { en: { exchange: ["What is this?", "It is a pen."] }, uk: { exchange: ["Що це?", "Це ручка."] }, es: { exchange: ["¿Qué es esto?", "Es un bolígrafo."] }, pt: { exchange: ["O que é isto?", "É uma caneta."] }, fr: { exchange: ["Qu’est-ce que c’est ?", "C’est un stylo."] }, de: { exchange: ["Was ist das?", "Das ist ein Kugelschreiber."] }, it: { exchange: ["Che cos’è questo?", "È una penna."] }, pl: { exchange: ["Co to jest?", "To długopis."] }, tr: { exchange: ["Bu nedir?", "Kalem."] }, id: { exchange: ["Ini apa?", "Ini pulpen."] }, vi: { exchange: ["Đây là cái gì?", "Là cái bút."] } }
          - level: "A0"
            word: { term: "だれ" }
            meaning: { en: "“who”", uk: "«хто»", es: "«quién»", pt: "«quem»", fr: "« qui »", de: "„wer“", it: "«chi»", pl: "„kto”", tr: "“kim”", id: "“siapa”", vi: "“ai”" }
            ex: { exchange: [["あのひとは", { target: "だれ" }, "ですか。"], "たなかさんです。"] }
            tr: { en: { exchange: ["Who is that person?", "That is Tanaka-san."] }, uk: { exchange: ["Хто ця людина?", "Це Танака-сан."] }, es: { exchange: ["¿Quién es esa persona?", "Es Tanaka-san."] }, pt: { exchange: ["Quem é aquela pessoa?", "É o Tanaka-san."] }, fr: { exchange: ["Qui est cette personne ?", "C’est Tanaka-san."] }, de: { exchange: ["Wer ist diese Person?", "Das ist Tanaka-san."] }, it: { exchange: ["Chi è quella persona?", "È Tanaka-san."] }, pl: { exchange: ["Kim jest ta osoba?", "To Tanaka-san."] }, tr: { exchange: ["O kişi kim?", "Tanaka-san."] }, id: { exchange: ["Siapa orang itu?", "Itu Tanaka-san."] }, vi: { exchange: ["Người kia là ai?", "Là Tanaka-san."] } }
          - level: "A0"
            word: { term: "どこ" }
            meaning: { en: "“where”", uk: "«де»", es: "«dónde»", pt: "«onde»", fr: "« où »", de: "„wo“", it: "«dove»", pl: "„gdzie”", tr: "“nerede”", id: "“di mana”", vi: "“ở đâu”" }
            ex: { exchange: [["トイレは", { target: "どこ" }, "ですか。"], "あそこです。"] }
            tr: { en: { exchange: ["Where is the toilet?", "Over there."] }, uk: { exchange: ["Де туалет?", "Ось там."] }, es: { exchange: ["¿Dónde está el baño?", "Allí."] }, pt: { exchange: ["Onde fica o banheiro?", "Ali."] }, fr: { exchange: ["Où sont les toilettes ?", "Là-bas."] }, de: { exchange: ["Wo ist die Toilette?", "Dort drüben."] }, it: { exchange: ["Dov’è il bagno?", "Laggiù."] }, pl: { exchange: ["Gdzie jest toaleta?", "Tam."] }, tr: { exchange: ["Tuvalet nerede?", "Şurada."] }, id: { exchange: ["Di mana toilet?", "Di sana."] }, vi: { exchange: ["Nhà vệ sinh ở đâu?", "Ở đằng kia."] } }
          - level: "A1"
            word: { term: "いつ" }
            meaning: { en: "“when”", uk: "«коли»", es: "«cuándo»", pt: "«quando»", fr: "« quand »", de: "„wann“", it: "«quando»", pl: "„kiedy”", tr: "“ne zaman”", id: "“kapan”", vi: "“khi nào”" }
            ex: { exchange: [["パーティーは", { target: "いつ" }, "ですか。"], [{ kanji: "土曜日", reading: "どようび" }, "です。"]] }
            tr: { en: { exchange: ["When is the party?", "On Saturday."] }, uk: { exchange: ["Коли вечірка?", "У суботу."] }, es: { exchange: ["¿Cuándo es la fiesta?", "El sábado."] }, pt: { exchange: ["Quando é a festa?", "No sábado."] }, fr: { exchange: ["Quand est la fête ?", "Samedi."] }, de: { exchange: ["Wann ist die Party?", "Am Samstag."] }, it: { exchange: ["Quando è la festa?", "Sabato."] }, pl: { exchange: ["Kiedy jest impreza?", "W sobotę."] }, tr: { exchange: ["Parti ne zaman?", "Cumartesi."] }, id: { exchange: ["Kapan pestanya?", "Hari Sabtu."] }, vi: { exchange: ["Khi nào có bữa tiệc?", "Thứ Bảy."] } }
          - level: "A1"
            word: { term: "いくら" }
            meaning:
              en: "“how much” (price)"
              uk: "«скільки коштує»"
              es: "«cuánto cuesta»"
              pt: "«quanto custa»"
              fr: "« combien » (prix)"
              de: "„was kostet“"
              it: "«quanto costa»"
              pl: "„ile kosztuje”"
              tr: "“kaç para”"
              id: "“berapa harga”"
              vi: "“giá bao nhiêu”"
            ex: { exchange: [["この", { kanji: "本", reading: "ほん" }, "は", { target: "いくら" }, "ですか。"], ["800", { kanji: "円", reading: "えん" }, "です。"]] }
            tr: { en: { exchange: ["How much is this book?", "It is 800 yen."] }, uk: { exchange: ["Скільки коштує ця книга?", "800 єн."] }, es: { exchange: ["¿Cuánto cuesta este libro?", "Son 800 yenes."] }, pt: { exchange: ["Quanto custa este livro?", "São 800 ienes."] }, fr: { exchange: ["Combien coûte ce livre ?", "Il coûte 800 yens."] }, de: { exchange: ["Was kostet dieses Buch?", "800 Yen."] }, it: { exchange: ["Quanto costa questo libro?", "Costa 800 yen."] }, pl: { exchange: ["Ile kosztuje ta książka?", "800 jenów."] }, tr: { exchange: ["Bu kitap kaç para?", "800 yen."] }, id: { exchange: ["Berapa harga buku ini?", "800 yen."] }, vi: { exchange: ["Quyển sách này giá bao nhiêu?", "800 yên."] } }
          - level: "A1"
            word: { term: "どれ" }
            meaning:
              en: "“which” of three or more things"
              uk: "«який із» трьох і більше предметів"
              es: "«cuál» entre tres o más cosas"
              pt: "«qual» entre três ou mais coisas"
              fr: "« lequel » parmi trois choses ou plus"
              de: "„welcher“ von drei oder mehr Dingen"
              it: "«quale» tra tre o più cose"
              pl: "„który” z trzech lub więcej rzeczy"
              tr: "üç ya da daha fazla şeyden “hangisi”"
              id: "“yang mana” dari tiga benda atau lebih"
              vi: "“cái nào” trong ba vật trở lên"
            ex: { exchange: [["あなたのかさは", { target: "どれ" }, "ですか。"], "あれです。"] }
            tr: { en: { exchange: ["Which one is your umbrella?", "That one over there."] }, uk: { exchange: ["Яка з них ваша парасолька?", "Ота."] }, es: { exchange: ["¿Cuál es tu paraguas?", "Aquel."] }, pt: { exchange: ["Qual é o seu guarda-chuva?", "Aquele."] }, fr: { exchange: ["Lequel est votre parapluie ?", "Celui-là."] }, de: { exchange: ["Welcher ist Ihr Regenschirm?", "Der dort."] }, it: { exchange: ["Qual è il tuo ombrello?", "Quello."] }, pl: { exchange: ["Który z nich jest pana parasolem?", "Tamten."] }, tr: { exchange: ["Hangisi sizin şemsiyeniz?", "Şu uzaktaki."] }, id: { exchange: ["Payung Anda yang mana?", "Yang di sana."] }, vi: { exchange: ["Cái ô của bạn là cái nào?", "Cái kia."] } }
          - level: "A1"
            word: { term: "どう" }
            meaning:
              en: "“how”, “what is it like”"
              uk: "«як», «який саме»"
              es: "«cómo», «qué tal»"
              pt: "«como», «que tal»"
              fr: "« comment », « comment est-ce »"
              de: "„wie“, „wie ist es“"
              it: "«come», «com’è»"
              pl: "„jak”, „jaki jest”"
              tr: "“nasıl”"
              id: "“bagaimana”"
              vi: "“thế nào”"
            ex: { exchange: [[{ kanji: "日本", reading: "にほん" }, "のりょうりは", { target: "どう" }, "ですか。"], "とてもおいしいです。"] }
            tr: { en: { exchange: ["How is Japanese food?", "Very tasty."] }, uk: { exchange: ["Яка японська кухня?", "Дуже смачна."] }, es: { exchange: ["¿Qué tal la comida japonesa?", "Muy rica."] }, pt: { exchange: ["Como é a comida japonesa?", "Muito gostosa."] }, fr: { exchange: ["Comment est la cuisine japonaise ?", "Très bonne."] }, de: { exchange: ["Wie ist das japanische Essen?", "Sehr lecker."] }, it: { exchange: ["Com’è la cucina giapponese?", "Molto buona."] }, pl: { exchange: ["Jakie jest japońskie jedzenie?", "Bardzo smaczne."] }, tr: { exchange: ["Japon yemekleri nasıl?", "Çok lezzetli."] }, id: { exchange: ["Bagaimana makanan Jepang?", "Enak sekali."] }, vi: { exchange: ["Món ăn Nhật thế nào?", "Rất ngon."] } }
          - level: "A1"
            word: { term: { kanji: "何時", reading: "なんじ" } }
            meaning:
              en: "“what time”"
              uk: "«котра година»"
              es: "«qué hora»"
              pt: "«que horas»"
              fr: "« quelle heure »"
              de: "„wie spät“"
              it: "«che ore»"
              pl: "„która godzina”"
              tr: "“saat kaç”"
              id: "“jam berapa”"
              vi: "“mấy giờ”"
            ex: { exchange: [[{ kanji: "今", reading: "いま" }, "、", { target: { kanji: "何時", reading: "なんじ" } }, "ですか。"], [{ kanji: "三時", reading: "さんじ" }, "です。"]] }
            tr: { en: { exchange: ["What time is it now?", "It is three o’clock."] }, uk: { exchange: ["Котра зараз година?", "Третя година."] }, es: { exchange: ["¿Qué hora es?", "Son las tres."] }, pt: { exchange: ["Que horas são?", "São três horas."] }, fr: { exchange: ["Quelle heure est-il ?", "Il est trois heures."] }, de: { exchange: ["Wie spät ist es jetzt?", "Es ist drei Uhr."] }, it: { exchange: ["Che ore sono?", "Sono le tre."] }, pl: { exchange: ["Która jest teraz godzina?", "Jest trzecia."] }, tr: { exchange: ["Saat kaç?", "Saat üç."] }, id: { exchange: ["Jam berapa sekarang?", "Jam tiga."] }, vi: { exchange: ["Bây giờ là mấy giờ?", "Ba giờ."] } }
          - level: "A2"
            word: { term: "どうして" }
            meaning: { en: "“why”", uk: "«чому»", es: "«por qué»", pt: "«por quê»", fr: "« pourquoi »", de: "„warum“", it: "«perché»", pl: "„dlaczego”", tr: "“neden”", id: "“mengapa”", vi: "“tại sao”" }
            ex: { exchange: [[{ target: "どうして" }, "きのう", { kanji: "休", reading: "やす" }, "みましたか。"], "びょうきでしたから。"] }
            tr: { en: { exchange: ["Why were you absent from school yesterday?", "Because I was ill."] }, uk: { exchange: ["Чому ви вчора не були в школі?", "Бо я хворів."] }, es: { exchange: ["¿Por qué faltaste ayer a la escuela?", "Porque estaba enfermo."] }, pt: { exchange: ["Por que você faltou à escola ontem?", "Porque eu estava doente."] }, fr: { exchange: ["Pourquoi étiez-vous absent de l’école hier ?", "Parce que j’étais malade."] }, de: { exchange: ["Warum warst du gestern nicht in der Schule?", "Weil ich krank war."] }, it: { exchange: ["Perché ieri sei stato assente da scuola?", "Perché ero malato."] }, pl: { exchange: ["Dlaczego wczoraj nie było cię w szkole?", "Bo byłem chory."] }, tr: { exchange: ["Dün neden okula gelmedin?", "Çünkü hastaydım."] }, id: { exchange: ["Mengapa kemarin kamu tidak masuk sekolah?", "Karena saya sakit."] }, vi: { exchange: ["Tại sao hôm qua bạn nghỉ học?", "Vì tôi bị ốm."] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "なに" }, " becomes ", { term: "なん" }, " before ", { term: "です" }, ", ", { term: "の" }, " and counters, and stays ", { term: "なに" }, " before ", { term: "を" }, ", ", { term: "が" }, " and ", { term: "も" }, "; one kanji writes both."]
              uk: [{ term: "なに" }, " перетворюється на ", { term: "なん" }, " перед ", { term: "です" }, ", ", { term: "の" }, " і лічильними словами, а перед ", { term: "を" }, ", ", { term: "が" }, " і ", { term: "も" }, " лишається ", { term: "なに" }, "; обидва читання пишуться одним ієрогліфом."]
