      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "か" }, " follows the polite ending without a pause: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              uk: [{ term: "か" }, " стоїть відразу після ввічливого закінчення: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              es: [{ term: "か" }, " sigue a la terminación cortés sin pausa: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              pt: [{ term: "か" }, " vem logo depois da terminação polida: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              fr: [{ term: "か" }, " suit la terminaison polie sans pause : ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              de: [{ term: "か" }, " folgt ohne Pause auf die höfliche Endung: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              it: [{ term: "か" }, " segue la terminazione cortese senza pausa: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              pl: [{ term: "か" }, " następuje zaraz po grzecznościowej końcówce: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              tr: [{ term: "か" }, ", nazik eke ara vermeden eklenir: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              id: [{ term: "か" }, " langsung mengikuti akhiran sopan: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
              vi: [{ term: "か" }, " đi liền sau đuôi lịch sự: ", { term: "ですか" }, ", ", { term: "ますか" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: ["The forms of ", { term: "ます" }, " are in ", { link: "The ます-Form", to: ja.verbs.masu-form }, "; the past of ", { term: "です" }, " is in ", { link: "です: Am, Is, Are", to: "ja.sentence-basics.desu" }, "."]
              uk: ["Форми ", { term: "ます" }, " — у темі ", { link: "ます-форма", to: "ja.verbs.masu-form" }, "; минулий час ", { term: "です" }, " — у темі ", { link: "です: бути", to: "ja.sentence-basics.desu" }, "."]
              es: ["Las formas de ", { term: "ます" }, " están en ", { link: "La forma ます", to: "ja.verbs.masu-form" }, "; el pasado de ", { term: "です" }, ", en ", { link: "です: ser", to: "ja.sentence-basics.desu" }, "."]
              pt: ["As formas de ", { term: "ます" }, " estão em ", { link: "A forma ます", to: "ja.verbs.masu-form" }, "; o passado de ", { term: "です" }, ", em ", { link: "です: ser", to: "ja.sentence-basics.desu" }, "."]
              fr: ["Les formes de ", { term: "ます" }, " sont dans ", { link: "La forme en ます", to: "ja.verbs.masu-form" }, " ; le passé de ", { term: "です" }, ", dans ", { link: "です : être", to: "ja.sentence-basics.desu" }, "."]
              de: ["Die Formen von ", { term: "ます" }, " stehen in ", { link: "Die ます-Form", to: "ja.verbs.masu-form" }, "; die Vergangenheit von ", { term: "です" }, " in ", { link: "です: sein", to: "ja.sentence-basics.desu" }, "."]
              it: ["Le forme di ", { term: "ます" }, " sono in ", { link: "La forma in ます", to: "ja.verbs.masu-form" }, "; il passato di ", { term: "です" }, " in ", { link: "です: essere", to: "ja.sentence-basics.desu" }, "."]
              pl: ["Formy ", { term: "ます" }, " są w temacie ", { link: "Forma ます", to: "ja.verbs.masu-form" }, "; czas przeszły ", { term: "です" }, " w temacie ", { link: "です: być", to: "ja.sentence-basics.desu" }, "."]
              tr: [{ term: "ます" }, " biçimleri ", { link: "ます biçimi", to: "ja.verbs.masu-form" }, " konusunda, ", { term: "です" }, " sözcüğünün geçmişi ", { link: "です: olmak", to: "ja.sentence-basics.desu" }, " konusundadır."]
              id: ["Bentuk ", { term: "ます" }, " ada di ", { link: "Bentuk ます", to: "ja.verbs.masu-form" }, "; bentuk lampau ", { term: "です" }, " ada di ", { link: "です: adalah", to: "ja.sentence-basics.desu" }, "."]
              vi: ["Các dạng của ", { term: "ます" }, " nằm ở ", { link: "Thể ます", to: "ja.verbs.masu-form" }, "; quá khứ của ", { term: "です" }, " nằm ở ", { link: "です: là", to: "ja.sentence-basics.desu" }, "."]
