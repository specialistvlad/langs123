              vi: [{ term: "はい" }, " xác nhận điều câu hỏi nói, dù khẳng định hay phủ định; ", { term: "いいえ" }, " phủ nhận điều đó."]
          - type: "note"
            level: "A2"
            text:
              en: ["The short answers ", { term: "そうです" }, " and ", { term: "ちがいます" }, " are in ", { link: "です: Am, Is, Are", to: "ja.sentence-basics.desu" }, "."]
              uk: ["Короткі відповіді ", { term: "そうです" }, " і ", { term: "ちがいます" }, " — у темі ", { link: "です: бути", to: "ja.sentence-basics.desu" }, "."]
              es: ["Las respuestas breves ", { term: "そうです" }, " y ", { term: "ちがいます" }, " están en ", { link: "です: ser", to: "ja.sentence-basics.desu" }, "."]
