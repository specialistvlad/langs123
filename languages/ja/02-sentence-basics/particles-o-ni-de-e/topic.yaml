            it: ["La persona che riceve prende ", { term: "に" }, "."]
            pl: ["Osoba, która otrzymuje, bierze ", { term: "に" }, "."]
            tr: ["Alan kişi ", { term: "に" }, " alır."]
            id: ["Orang yang menerima memakai ", { term: "に" }, "."]
            vi: ["Người nhận đi với ", { term: "に" }, "."]
          ex: ["ともだち", { target: "に" }, "メールをおくります。"]
          tr: { en: "I send an e-mail to a friend.", uk: "Я надсилаю другові електронного листа.", es: "Envío un correo a un amigo.", pt: "Eu mando um e-mail para um amigo.", fr: "J’envoie un e-mail à un ami.", de: "Ich schicke einem Freund eine E-Mail.", it: "Mando un’e-mail a un amico.", pl: "Wysyłam przyjacielowi e-mail.", tr: "Bir arkadaşıma e-posta gönderirim.", id: "Saya mengirim surel kepada teman.", vi: "Tôi gửi email cho một người bạn." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["An action takes place at ", { term: "で" }, ", not ", { term: "に" }, "."]
            uk: ["Дія відбувається в місці з ", { term: "で" }, ", а не з ", { term: "に" }, "."]
            es: ["Una acción ocurre en un lugar con ", { term: "で" }, ", no con ", { term: "に" }, "."]
            pt: ["Uma ação acontece num lugar com ", { term: "で" }, ", não com ", { term: "に" }, "."]
            fr: ["Une action a lieu avec ", { term: "で" }, ", pas avec ", { term: "に" }, "."]
            de: ["Eine Handlung geschieht an einem Ort mit ", { term: "で" }, ", nicht mit ", { term: "に" }, "."]
            it: ["Un’azione avviene in un luogo con ", { term: "で" }, ", non con ", { term: "に" }, "."]
            pl: ["Czynność dzieje się w miejscu z ", { term: "で" }, ", nie z ", { term: "に" }, "."]
            tr: ["Eylem ", { term: "で" }, " ile yapılır, ", { term: "に" }, " ile değil."]
            id: ["Kegiatan berlangsung di tempat dengan ", { term: "で" }, ", bukan ", { term: "に" }, "."]
            vi: ["Hành động diễn ra ở nơi chốn với ", { term: "で" }, ", không phải ", { term: "に" }, "."]
          ex: ["うち", { target: "で" }, "ごはんを", { kanji: "食", reading: "た" }, "べます。"]
          tr: { en: "I eat at home.", uk: "Я їм удома.", es: "Como en casa.", pt: "Eu como em casa.", fr: "Je mange à la maison.", de: "Ich esse zu Hause.", it: "Mangio a casa.", pl: "Jem w domu.", tr: "Evde yemek yerim.", id: "Saya makan di rumah.", vi: "Tôi ăn ở nhà." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "あした" }, " and ", { term: "きょう" }, " take no ", { term: "に" }, "."]
            uk: [{ term: "あした" }, " і ", { term: "きょう" }, " не беруть ", { term: "に" }, "."]
            es: [{ term: "あした" }, " y ", { term: "きょう" }, " no llevan ", { term: "に" }, "."]
            pt: [{ term: "あした" }, " e ", { term: "きょう" }, " não levam ", { term: "に" }, "."]
            fr: [{ term: "あした" }, " et ", { term: "きょう" }, " ne prennent pas ", { term: "に" }, "."]
            de: [{ term: "あした" }, " und ", { term: "きょう" }, " stehen ohne ", { term: "に" }, "."]
            it: [{ term: "あした" }, " e ", { term: "きょう" }, " non prendono ", { term: "に" }, "."]
            pl: [{ term: "あした" }, " i ", { term: "きょう" }, " nie biorą ", { term: "に" }, "."]
            tr: [{ term: "あした" }, " ve ", { term: "きょう" }, " ", { term: "に" }, " almaz."]
            id: [{ term: "あした" }, " dan ", { term: "きょう" }, " tidak memakai ", { term: "に" }, "."]
            vi: [{ term: "あした" }, " và ", { term: "きょう" }, " không đi với ", { term: "に" }, "."]
          ex: [{ target: "あした" }, "、", { kanji: "日本", reading: "にほん" }, "へ", { kanji: "行", reading: "い" }, "きます。"]
          tr: { en: "Tomorrow I go to Japan.", uk: "Завтра я їду до Японії.", es: "Mañana voy a Japón.", pt: "Amanhã eu vou para o Japão.", fr: "Demain, je vais au Japon.", de: "Morgen fahre ich nach Japan.", it: "Domani vado in Giappone.", pl: "Jutro jadę do Japonii.", tr: "Yarın Japonya’ya gidiyorum.", id: "Besok saya pergi ke Jepang.", vi: "Ngày mai tôi đi Nhật Bản." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["A particle follows its noun and gives it a role: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              uk: ["Частка стоїть після іменника й надає йому роль: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              es: ["La partícula va tras el sustantivo y le da un papel: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              pt: ["A partícula vem depois do substantivo e lhe dá uma função: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              fr: ["La particule suit le nom et lui donne un rôle : ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              de: ["Die Partikel steht hinter dem Nomen und gibt ihm eine Rolle: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              it: ["La particella segue il nome e gli dà un ruolo: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              pl: ["Partykuła stoi po rzeczowniku i nadaje mu rolę: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              tr: ["Edat adın ardından gelir ve ona bir görev verir: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              id: ["Partikel mengikuti kata benda dan memberinya peran: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
              vi: ["Trợ từ đứng sau danh từ và cho danh từ đó một vai trò: ", { pattern: [{ slot: "noun" }, { alternatives: [{ term: "を" }, { term: "に" }, { term: "で" }, { term: "へ" }] }, { slot: "verb" }] }, "."]
            ex: ["パン", { target: "を" }, { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat bread.", uk: "Я їм хліб.", es: "Como pan.", pt: "Eu como pão.", fr: "Je mange du pain.", de: "Ich esse Brot.", it: "Mangio il pane.", pl: "Jem chleb.", tr: "Ekmek yerim.", id: "Saya makan roti.", vi: "Tôi ăn bánh mì." }
          - type: "rule"
            level: "A1"
            text:
              en: ["One verb can take several phrases: the time with ", { term: "に" }, ", the place with ", { term: "で" }, ", the object with ", { term: "を" }, "."]
              uk: ["Одне дієслово може мати кілька груп: час із ", { term: "に" }, ", місце з ", { term: "で" }, ", додаток із ", { term: "を" }, "."]
              es: ["Un verbo puede llevar varias frases: el momento con ", { term: "に" }, ", el lugar con ", { term: "で" }, ", el complemento directo con ", { term: "を" }, "."]
              pt: ["Um verbo pode levar várias expressões: o momento com ", { term: "に" }, ", o lugar com ", { term: "で" }, ", o objeto direto com ", { term: "を" }, "."]
              fr: ["Un verbe peut avoir plusieurs groupes : le moment avec ", { term: "に" }, ", le lieu avec ", { term: "で" }, ", l’objet avec ", { term: "を" }, "."]
              de: ["Ein Verb kann mehrere Satzglieder haben: die Zeit mit ", { term: "に" }, ", den Ort mit ", { term: "で" }, ", das Objekt mit ", { term: "を" }, "."]
              it: ["Un verbo può avere più sintagmi: il tempo con ", { term: "に" }, ", il luogo con ", { term: "で" }, ", l’oggetto con ", { term: "を" }, "."]
              pl: ["Jeden czasownik może mieć kilka fraz: czas z ", { term: "に" }, ", miejsce z ", { term: "で" }, ", dopełnienie z ", { term: "を" }, "."]
              tr: ["Bir fiilin birkaç öbeği olabilir: zaman ", { term: "に" }, ", yer ", { term: "で" }, ", nesne ", { term: "を" }, " ile."]
              id: ["Satu verba dapat memiliki beberapa frasa: waktu dengan ", { term: "に" }, ", tempat dengan ", { term: "で" }, ", objek dengan ", { term: "を" }, "."]
              vi: ["Một động từ có thể đi với nhiều cụm: thời gian với ", { term: "に" }, ", nơi chốn với ", { term: "で" }, ", tân ngữ với ", { term: "を" }, "."]
            ex: ["7", { kanji: "時", reading: "じ" }, { target: "に" }, "うち", { target: "で" }, "ごはん", { target: "を" }, { kanji: "食", reading: "た" }, "べます。"]
            tr: { en: "I eat at home at seven.", uk: "О сьомій я їм удома.", es: "A las siete como en casa.", pt: "Às sete eu como em casa.", fr: "À sept heures, je mange à la maison.", de: "Um sieben esse ich zu Hause.", it: "Alle sette mangio a casa.", pl: "O siódmej jem w domu.", tr: "Saat yedide evde yemek yerim.", id: "Jam tujuh saya makan di rumah.", vi: "Bảy giờ tôi ăn cơm ở nhà." }
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "を" }, " is read ", { term: "お" }, " and ", { term: "へ" }, " is read ", { term: "え" }, ". See ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              uk: [{ term: "を" }, " читається як ", { term: "お" }, ", а ", { term: "へ" }, " — як ", { term: "え" }, ". Див. ", { link: "Хірагана", to: "ja.foundations.hiragana" }, "."]
              es: [{ term: "を" }, " se lee ", { term: "お" }, " y ", { term: "へ" }, " se lee ", { term: "え" }, ". Véase ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              pt: [{ term: "を" }, " lê-se ", { term: "お" }, " e ", { term: "へ" }, " lê-se ", { term: "え" }, ". Veja ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              fr: [{ term: "を" }, " se lit ", { term: "お" }, " et ", { term: "へ" }, " se lit ", { term: "え" }, ". Voir ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              de: [{ term: "を" }, " wird ", { term: "お" }, " gelesen und ", { term: "へ" }, " wird ", { term: "え" }, " gelesen. Siehe ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              it: [{ term: "を" }, " si legge ", { term: "お" }, " e ", { term: "へ" }, " si legge ", { term: "え" }, ". Vedi ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              pl: [{ term: "を" }, " czyta się jako ", { term: "お" }, ", a ", { term: "へ" }, " jako ", { term: "え" }, ". Zob. ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              tr: [{ term: "を" }, " ", { term: "お" }, ", ", { term: "へ" }, " ", { term: "え" }, " diye okunur. Bkz. ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              id: [{ term: "を" }, " dibaca ", { term: "お" }, " dan ", { term: "へ" }, " dibaca ", { term: "え" }, ". Lihat ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
              vi: [{ term: "を" }, " đọc là ", { term: "お" }, " và ", { term: "へ" }, " đọc là ", { term: "え" }, ". Xem ", { link: "Hiragana", to: "ja.foundations.hiragana" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: ["The order of the phrases before the verb: see ", { link: "Word Order", to: ja.sentence-basics.word-order }, "."]
              uk: ["Порядок груп перед дієсловом: див. ", { link: "Порядок слів", to: "ja.sentence-basics.word-order" }, "."]
              es: ["El orden de las frases antes del verbo: véase ", { link: "Orden de las palabras", to: ja.sentence-basics.word-order }, "."]
              pt: ["A ordem das expressões antes do verbo: veja ", { link: "Ordem das palavras", to: ja.sentence-basics.word-order }, "."]
              fr: ["L’ordre des groupes devant le verbe : voir ", { link: "Ordre des mots", to: ja.sentence-basics.word-order }, "."]
              de: ["Die Reihenfolge der Satzglieder vor dem Verb: siehe ", { link: "Wortstellung", to: ja.sentence-basics.word-order }, "."]
              it: ["L’ordine dei sintagmi prima del verbo: vedi ", { link: "Ordine delle parole", to: ja.sentence-basics.word-order }, "."]
              pl: ["Kolejność fraz przed czasownikiem: zob. ", { link: "Szyk zdania", to: ja.sentence-basics.word-order }, "."]
              tr: ["Fiilden önceki öbeklerin sırası: bkz. ", { link: "Sözcük sırası", to: "ja.sentence-basics.word-order" }, "."]
              id: ["Urutan frasa sebelum verba: lihat ", { link: "Urutan kata", to: "ja.sentence-basics.word-order" }, "."]
              vi: ["Thứ tự các cụm trước động từ: xem ", { link: "Trật tự từ", to: "ja.sentence-basics.word-order" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "は" }, " and ", { term: "が" }, ": see ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " and ", { term: "の" }, ": see ", { link: "Particles と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              uk: [{ term: "は" }, " і ", { term: "が" }, ": див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " та ", { term: "の" }, ": див. ", { link: "Частки と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              es: [{ term: "は" }, " y ", { term: "が" }, ": véase ", { link: "は y が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " y ", { term: "の" }, ": véase ", { link: "Las partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              pt: [{ term: "は" }, " e ", { term: "が" }, ": veja ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " e ", { term: "の" }, ": veja ", { link: "As partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              fr: [{ term: "は" }, " et ", { term: "が" }, " : voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " et ", { term: "の" }, " : voir ", { link: "Les particules と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              de: [{ term: "は" }, " und ", { term: "が" }, ": siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " und ", { term: "の" }, ": siehe ", { link: "Die Partikeln と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              it: [{ term: "は" }, " e ", { term: "が" }, ": vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " e ", { term: "の" }, ": vedi ", { link: "Le particelle と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              pl: [{ term: "は" }, " i ", { term: "が" }, ": zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " i ", { term: "の" }, ": zob. ", { link: "Partykuły と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              tr: [{ term: "は" }, " ve ", { term: "が" }, ": bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " ve ", { term: "の" }, ": bkz. ", { link: "と, も, の edatları", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              id: [{ term: "は" }, " dan ", { term: "が" }, ": lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, ", dan ", { term: "の" }, ": lihat ", { link: "Partikel と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              vi: [{ term: "は" }, " và ", { term: "が" }, ": xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, ". ", { term: "と" }, ", ", { term: "も" }, " và ", { term: "の" }, ": xem ", { link: "Trợ từ と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
  - title:
      en: "を: the object"
      uk: "を: додаток"
      es: "を: el complemento directo"
      pt: "を: o objeto direto"
      fr: "を : le complément d’objet"
      de: "を: das Objekt"
      it: "を: il complemento oggetto"
      pl: "を: dopełnienie"
      tr: "を: nesne"
      id: "を: objek"
      vi: "を: tân ngữ"
    role: "own"
    content:
      - type: "usage"
        columns:
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            use:
              en: "What the verb acts on"
              uk: "На що спрямована дія дієслова"
              es: "Aquello sobre lo que actúa el verbo"
              pt: "Aquilo sobre o que o verbo age"
              fr: "Ce sur quoi porte le verbe"
              de: "Worauf sich das Verb richtet"
              it: "Ciò su cui agisce il verbo"
              pl: "To, na co działa czasownik"
              tr: "Fiilin etkilediği şey"
              id: "Hal yang dikenai verba"
              vi: "Thứ mà động từ tác động tới"
            ex: [{ kanji: "水", reading: "みず" }, { target: "を" }, { kanji: "飲", reading: "の" }, "みます。"]
            tr: { en: "I drink water.", uk: "Я п’ю воду.", es: "Bebo agua.", pt: "Eu bebo água.", fr: "Je bois de l’eau.", de: "Ich trinke Wasser.", it: "Bevo acqua.", pl: "Piję wodę.", tr: "Su içerim.", id: "Saya minum air.", vi: "Tôi uống nước." }
          - level: "A1"
            use:
              en: "A question word as the object"
              uk: "Питальне слово в ролі додатка"
              es: "Una palabra interrogativa como complemento"
              pt: "Uma palavra interrogativa como objeto"
              fr: "Un mot interrogatif comme objet"
              de: "Ein Fragewort als Objekt"
              it: "Una parola interrogativa come oggetto"
              pl: "Zaimek pytający jako dopełnienie"
              tr: "Nesne olarak soru sözcüğü"
              id: "Kata tanya sebagai objek"
              vi: "Từ để hỏi làm tân ngữ"
            ex: { exchange: [[{ kanji: "何", reading: "なに" }, { target: "を" }, { kanji: "食", reading: "た" }, "べますか。"], ["すし", { target: "を" }, { kanji: "食", reading: "た" }, "べます。"]] }
            tr: { en: { exchange: ["What do you eat?", "I eat sushi."] }, uk: { exchange: ["Що ви їсте?", "Я їм суші."] }, es: { exchange: ["¿Qué comes?", "Como sushi."] }, pt: { exchange: ["O que você come?", "Eu como sushi."] }, fr: { exchange: ["Que mangez-vous ?", "Je mange des sushis."] }, de: { exchange: ["Was isst du?", "Ich esse Sushi."] }, it: { exchange: ["Che cosa mangi?", "Mangio sushi."] }, pl: { exchange: ["Co jesz?", "Jem sushi."] }, tr: { exchange: ["Ne yersin?", "Suşi yerim."] }, id: { exchange: ["Anda makan apa?", "Saya makan sushi."] }, vi: { exchange: ["Bạn ăn gì?", "Tôi ăn sushi."] } }
