          point: { en: "Answers", uk: "Відповіді", es: "Respuestas", pt: "Respostas", fr: "Réponses", de: "Antworten", it: "Risposte", pl: "Odpowiedzi", tr: "Cevaplar", id: "Jawaban", vi: "Câu trả lời" }
          rule:
            en: [{ term: "はい、そうです" }, " confirms; ", { term: "いいえ、ちがいます" }, " denies."]
            uk: [{ term: "はい、そうです" }, " підтверджує; ", { term: "いいえ、ちがいます" }, " заперечує."]
            es: [{ term: "はい、そうです" }, " confirma; ", { term: "いいえ、ちがいます" }, " niega."]
            pt: [{ term: "はい、そうです" }, " confirma; ", { term: "いいえ、ちがいます" }, " nega."]
            fr: [{ term: "はい、そうです" }, " confirme ; ", { term: "いいえ、ちがいます" }, " nie."]
            de: [{ term: "はい、そうです" }, " bestätigt; ", { term: "いいえ、ちがいます" }, " verneint."]
            it: [{ term: "はい、そうです" }, " conferma; ", { term: "いいえ、ちがいます" }, " nega."]
            pl: [{ term: "はい、そうです" }, " potwierdza; ", { term: "いいえ、ちがいます" }, " zaprzecza."]
            tr: [{ term: "はい、そうです" }, " onaylar; ", { term: "いいえ、ちがいます" }, " reddeder."]
            id: [{ term: "はい、そうです" }, " membenarkan; ", { term: "いいえ、ちがいます" }, " menyangkal."]
            vi: [{ term: "はい、そうです" }, " xác nhận; ", { term: "いいえ、ちがいます" }, " phủ nhận."]
          ex: { exchange: [["たなかさんは", { kanji: "先生", reading: "せんせい" }, "ですか。"], ["はい、", { target: "そうです" }, "。"]] }
          tr: { en: { exchange: ["Is Tanaka-san a teacher?", "Yes, that's right."] }, uk: { exchange: ["Танака-сан вчитель?", "Так, саме так."] }, es: { exchange: ["¿Tanaka-san es profesor?", "Sí, así es."] }, pt: { exchange: ["O Tanaka-san é professor?", "Sim, é isso mesmo."] }, fr: { exchange: ["Tanaka-san est-il professeur ?", "Oui, c’est ça."] }, de: { exchange: ["Ist Tanaka-san Lehrer?", "Ja, genau."] }, it: { exchange: ["Tanaka-san è insegnante?", "Sì, è così."] }, pl: { exchange: ["Czy Tanaka-san jest nauczycielem?", "Tak, zgadza się."] }, tr: { exchange: ["Tanaka-san öğretmen mi?", "Evet, öyle."] }, id: { exchange: ["Apakah Tanaka-san guru?", "Ya, benar."] }, vi: { exchange: ["Tanaka-san có phải là giáo viên không?", "Vâng, đúng vậy."] } }
        - level: "A0"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "さん" }, " never follows your own name."]
            uk: [{ term: "さん" }, " не додають до власного імені."]
            es: [{ term: "さん" }, " no se añade al propio nombre."]
            pt: [{ term: "さん" }, " não se junta ao próprio nome."]
            fr: [{ term: "さん" }, " ne s’ajoute jamais à son propre nom."]
            de: [{ term: "さん" }, " steht nie hinter dem eigenen Namen."]
            it: [{ term: "さん" }, " non si aggiunge al proprio nome."]
            pl: [{ term: "さん" }, " nie idzie za własnym imieniem."]
            tr: [{ term: "さん" }, " kişinin kendi adına eklenmez."]
            id: [{ term: "さん" }, " tidak dipakai pada nama sendiri."]
            vi: [{ term: "さん" }, " không đi sau tên của chính mình."]
          ex: ["わたしは", { target: "アンナ" }, "です。"]
          tr: { en: "I'm Anna.", uk: "Я Анна.", es: "Soy Anna.", pt: "Eu sou Anna.", fr: "Je suis Anna.", de: "Ich bin Anna.", it: "Sono Anna.", pl: "Jestem Anna.", tr: "Adım Anna.", id: "Saya Anna.", vi: "Tôi là Anna." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "じゃありません" }, " already ends the sentence; add no ", { term: "です" }, "."]
            uk: [{ term: "じゃありません" }, " уже завершує речення; ", { term: "です" }, " не додають."]
            es: [{ term: "じゃありません" }, " ya cierra la oración; no se añade ", { term: "です" }, "."]
            pt: [{ term: "じゃありません" }, " já encerra a frase; não se acrescenta ", { term: "です" }, "."]
            fr: [{ term: "じゃありません" }, " termine déjà la phrase ; n’ajoutez pas ", { term: "です" }, "."]
            de: [{ term: "じゃありません" }, " beendet den Satz schon; kein ", { term: "です" }, " dahinter."]
            it: [{ term: "じゃありません" }, " chiude già la frase; non si aggiunge ", { term: "です" }, "."]
            pl: [{ term: "じゃありません" }, " już kończy zdanie; nie dodaje się ", { term: "です" }, "."]
            tr: [{ term: "じゃありません" }, " cümleyi zaten bitirir; ", { term: "です" }, " eklenmez."]
            id: [{ term: "じゃありません" }, " sudah mengakhiri kalimat; jangan tambah ", { term: "です" }, "."]
            vi: [{ term: "じゃありません" }, " đã kết thúc câu; không thêm ", { term: "です" }, "."]
          ex: ["たなかさんは", { kanji: "先生", reading: "せんせい" }, { target: "じゃありません" }, "。"]
          tr: { en: "Tanaka-san is not a teacher.", uk: "Танака-сан не вчитель.", es: "Tanaka-san no es profesor.", pt: "Tanaka-san não é professor.", fr: "Tanaka-san n’est pas professeur.", de: "Tanaka-san ist kein Lehrer.", it: "Tanaka-san non è insegnante.", pl: "Tanaka-san nie jest nauczycielem.", tr: "Tanaka-san öğretmen değil.", id: "Tanaka-san bukan guru.", vi: "Tanaka-san không phải là giáo viên." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " means “A is B”."]
              uk: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " означає «A — це B»."]
              es: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " significa «A es B»."]
              pt: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " significa «A é B»."]
              fr: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " signifie « A est B »."]
              de: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " bedeutet „A ist B“."]
              it: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " significa «A è B»."]
              pl: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " znaczy „A to B”."]
              tr: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " “A, B'dir” anlamına gelir."]
              id: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " berarti “A adalah B”."]
              vi: [{ pattern: [{ slot: "noun" }, { term: "は" }, { slot: "noun" }, { term: "です" }] }, " nghĩa là “A là B”."]
            ex: ["わたしはアンナ", { target: "です" }, "。"]
            tr: { en: "I'm Anna.", uk: "Я Анна.", es: "Soy Anna.", pt: "Eu sou Anna.", fr: "Je suis Anna.", de: "Ich bin Anna.", it: "Sono Anna.", pl: "Jestem Anna.", tr: "Adım Anna.", id: "Saya Anna.", vi: "Tôi là Anna." }
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "です" }, " stays the same for every person and number."]
              uk: [{ term: "です" }, " не змінюється за особами й числами."]
              es: [{ term: "です" }, " no cambia con la persona ni con el número."]
              pt: [{ term: "です" }, " não muda com a pessoa nem com o número."]
              fr: [{ term: "です" }, " ne change ni selon la personne ni selon le nombre."]
              de: [{ term: "です" }, " bleibt bei jeder Person und in jeder Zahl gleich."]
              it: [{ term: "です" }, " non cambia con la persona né con il numero."]
              pl: [{ term: "です" }, " nie zmienia się według osoby ani liczby."]
              tr: [{ term: "です" }, " kişiye ve sayıya göre değişmez."]
              id: [{ term: "です" }, " tidak berubah menurut orang maupun jumlah."]
              vi: [{ term: "です" }, " không đổi theo ngôi hay số."]
            ex: { examples: [["わたしはがくせい", { target: "です" }, "。"], ["わたしたちはがくせい", { target: "です" }, "。"]] }
            tr: { en: { examples: ["I am a student.", "We are students."] }, uk: { examples: ["Я студент.", "Ми студенти."] }, es: { examples: ["Soy estudiante.", "Somos estudiantes."] }, pt: { examples: ["Eu sou estudante.", "Nós somos estudantes."] }, fr: { examples: ["Je suis étudiant.", "Nous sommes étudiants."] }, de: { examples: ["Ich bin Student.", "Wir sind Studenten."] }, it: { examples: ["Sono studente.", "Siamo studenti."] }, pl: { examples: ["Jestem studentem.", "Jesteśmy studentami."] }, tr: { examples: ["Ben öğrenciyim.", "Biz öğrenciyiz."] }, id: { examples: ["Saya mahasiswa.", "Kami mahasiswa."] }, vi: { examples: ["Tôi là sinh viên.", "Chúng tôi là sinh viên."] } }
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "です" }, " belongs to the polite form: use it with strangers, at school and at work."]
              uk: [{ term: "です" }, " належить до ввічливої форми: її вживають із незнайомими людьми, у школі й на роботі."]
              es: [{ term: "です" }, " pertenece a la forma cortés: se usa con desconocidos, en la escuela y en el trabajo."]
              pt: [{ term: "です" }, " pertence à forma polida: usa-se com desconhecidos, na escola e no trabalho."]
              fr: [{ term: "です" }, " appartient à la forme polie : on l’emploie avec des inconnus, à l’école et au travail."]
              de: [{ term: "です" }, " gehört zur Höflichkeitsform: Man verwendet sie bei Fremden, in der Schule und bei der Arbeit."]
              it: [{ term: "です" }, " appartiene alla forma cortese: si usa con gli sconosciuti, a scuola e al lavoro."]
              pl: [{ term: "です" }, " należy do formy grzecznościowej: używa się jej wobec obcych, w szkole i w pracy."]
              tr: [{ term: "です" }, " nazik biçime aittir: yabancılarla, okulda ve işte kullanılır."]
              id: [{ term: "です" }, " termasuk bentuk sopan: dipakai kepada orang asing, di sekolah, dan di tempat kerja."]
              vi: [{ term: "です" }, " thuộc thể lịch sự: dùng với người lạ, ở trường và ở nơi làm việc."]
          - type: "note"
            level: "A0"
            text:
              en: [{ term: "は" }, " is a particle that marks the topic; it is read ", { term: "わ" }, ". See ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, "."]
              uk: [{ term: "は" }, " — частка, що позначає тему речення; читається як ", { term: "わ" }, ". Див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, "."]
              es: [{ term: "は" }, " es una partícula que marca el tema; se lee ", { term: "わ" }, ". Véase ", { link: "は y が", to: "ja.sentence-basics.wa-ga" }, "."]
              pt: [{ term: "は" }, " é uma partícula que marca o tópico; lê-se ", { term: "わ" }, ". Veja ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              fr: [{ term: "は" }, " est une particule qui marque le thème ; elle se lit ", { term: "わ" }, ". Voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, "."]
              de: [{ term: "は" }, " ist eine Partikel, die das Thema markiert; sie wird ", { term: "わ" }, " gelesen. Siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, "."]
              it: [{ term: "は" }, " è una particella che segna il tema; si legge ", { term: "わ" }, ". Vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              pl: [{ term: "は" }, " to partykuła oznaczająca temat; czyta się ją jako ", { term: "わ" }, ". Zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, "."]
              tr: [{ term: "は" }, " konuyu belirten bir edattır; ", { term: "わ" }, " diye okunur. Bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, "."]
              id: [{ term: "は" }, " adalah partikel penanda topik; dibaca ", { term: "わ" }, ". Lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, "."]
              vi: [{ term: "は" }, " là trợ từ đánh dấu chủ đề; đọc là ", { term: "わ" }, ". Xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "あります" }, " and ", { term: "います" }, " say that something exists or where it is. See ", { link: "あります and います", to: "ja.verbs.aru-iru" }, "."]
              uk: [{ term: "あります" }, " і ", { term: "います" }, " кажуть, що щось існує або де воно є. Див. ", { link: "あります і います", to: "ja.verbs.aru-iru" }, "."]
              es: [{ term: "あります" }, " y ", { term: "います" }, " dicen que algo existe o dónde está. Véase ", { link: "あります y います", to: "ja.verbs.aru-iru" }, "."]
              pt: [{ term: "あります" }, " e ", { term: "います" }, " dizem que algo existe ou onde está. Veja ", { link: "あります e います", to: "ja.verbs.aru-iru" }, "."]
              fr: [{ term: "あります" }, " et ", { term: "います" }, " disent que quelque chose existe ou où il se trouve. Voir ", { link: "あります et います", to: "ja.verbs.aru-iru" }, "."]
              de: [{ term: "あります" }, " und ", { term: "います" }, " sagen, dass etwas existiert oder wo es ist. Siehe ", { link: "あります und います", to: "ja.verbs.aru-iru" }, "."]
              it: [{ term: "あります" }, " e ", { term: "います" }, " dicono che qualcosa esiste o dove si trova. Vedi ", { link: "あります e います", to: "ja.verbs.aru-iru" }, "."]
              pl: [{ term: "あります" }, " i ", { term: "います" }, " mówią, że coś istnieje albo gdzie się znajduje. Zob. ", { link: "あります i います", to: "ja.verbs.aru-iru" }, "."]
              tr: [{ term: "あります" }, " ve ", { term: "います" }, " bir şeyin var olduğunu ya da nerede olduğunu söyler. Bkz. ", { link: "あります ve います", to: "ja.verbs.aru-iru" }, "."]
              id: [{ term: "あります" }, " dan ", { term: "います" }, " menyatakan bahwa sesuatu ada atau di mana letaknya. Lihat ", { link: "あります dan います", to: "ja.verbs.aru-iru" }, "."]
              vi: [{ term: "あります" }, " và ", { term: "います" }, " cho biết vật gì tồn tại hoặc ở đâu. Xem ", { link: "あります và います", to: "ja.verbs.aru-iru" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "です" }, " also ends a sentence with an adjective. See ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, " and ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, "."]
              uk: [{ term: "です" }, " також завершує речення з прикметником. Див. ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, " та ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, "."]
              es: [{ term: "です" }, " también cierra una oración con adjetivo. Véase ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, " y ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              pt: [{ term: "です" }, " também fecha uma frase com adjetivo. Veja ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              fr: [{ term: "です" }, " termine aussi une phrase avec adjectif. Voir ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, " et ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, "."]
              de: [{ term: "です" }, " beendet auch einen Satz mit Adjektiv. Siehe ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, " und ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, "."]
              it: [{ term: "です" }, " chiude anche una frase con aggettivo. Vedi ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, "."]
              pl: [{ term: "です" }, " kończy też zdanie z przymiotnikiem. Zob. ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, " i ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, "."]
              tr: [{ term: "です" }, " sıfatlı cümleyi de bitirir. Bkz. ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, " ve ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, "."]
              id: [{ term: "です" }, " juga mengakhiri kalimat dengan kata sifat. Lihat ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, " dan ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, "."]
              vi: [{ term: "です" }, " cũng kết thúc câu có tính từ. Xem ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, " và ", { link: "Tính từ な", to: "ja.adjectives.na-adjectives" }, "."]
          - type: "note"
            level: "A2"
            text:
              en: ["Casual speech uses the plain form ", { term: "だ" }, " in place of ", { term: "です" }, ". See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["У невимушеній мові замість ", { term: "です" }, " вживають просту форму ", { term: "だ" }, ". Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["El habla informal usa la forma simple ", { term: "だ" }, " en lugar de ", { term: "です" }, ". Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A fala informal usa a forma simples ", { term: "だ" }, " no lugar de ", { term: "です" }, ". Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La langue familière emploie la forme simple ", { term: "だ" }, " à la place de ", { term: "です" }, ". Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["In der Umgangssprache steht die einfache Form ", { term: "だ" }, " statt ", { term: "です" }, ". Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["Il parlato informale usa la forma semplice ", { term: "だ" }, " al posto di ", { term: "です" }, ". Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["W mowie potocznej zamiast ", { term: "です" }, " stosuje się formę prostą ", { term: "だ" }, ". Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Gündelik konuşmada ", { term: "です" }, " yerine yalın biçim ", { term: "だ" }, " kullanılır. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Ragam santai memakai bentuk biasa ", { term: "だ" }, " sebagai pengganti ", { term: "です" }, ". Lihat ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Văn nói thân mật dùng thể thường ", { term: "だ" }, " thay cho ", { term: "です" }, ". Xem ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
  - title:
      en: "Introducing yourself"
      uk: "Знайомство"
      es: "Presentarse"
      pt: "Apresentar-se"
      fr: "Se présenter"
      de: "Sich vorstellen"
      it: "Presentarsi"
      pl: "Przedstawianie się"
      tr: "Kendini tanıtma"
      id: "Memperkenalkan diri"
      vi: "Tự giới thiệu"
    role: "own"
    content:
      - type: "usage"
        columns:
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
