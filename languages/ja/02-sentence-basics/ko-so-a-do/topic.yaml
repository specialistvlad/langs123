sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: ["Three distances: ", { term: "こ" }, " near the speaker, ", { term: "そ" }, " near the listener, ", { term: "あ" }, " far from both."]
              uk: ["Три відстані: ", { term: "こ" }, " біля мовця, ", { term: "そ" }, " біля слухача, ", { term: "あ" }, " далеко від обох."]
              es: ["Tres distancias: ", { term: "こ" }, " cerca del hablante, ", { term: "そ" }, " cerca del oyente, ", { term: "あ" }, " lejos de ambos."]
              pt: ["Três distâncias: ", { term: "こ" }, " perto de quem fala, ", { term: "そ" }, " perto de quem ouve, ", { term: "あ" }, " longe de ambos."]
              fr: ["Trois distances : ", { term: "こ" }, " près du locuteur, ", { term: "そ" }, " près de l’interlocuteur, ", { term: "あ" }, " loin des deux."]
              de: ["Drei Entfernungen: ", { term: "こ" }, " beim Sprecher, ", { term: "そ" }, " beim Angesprochenen, ", { term: "あ" }, " weit von beiden."]
              it: ["Tre distanze: ", { term: "こ" }, " vicino a chi parla, ", { term: "そ" }, " vicino a chi ascolta, ", { term: "あ" }, " lontano da entrambi."]
              pl: ["Trzy odległości: ", { term: "こ" }, " blisko mówiącego, ", { term: "そ" }, " blisko słuchacza, ", { term: "あ" }, " daleko od obojga."]
              tr: ["Üç uzaklık: ", { term: "こ" }, " konuşana yakın, ", { term: "そ" }, " dinleyene yakın, ", { term: "あ" }, " ikisinden de uzak."]
              id: ["Tiga jarak: ", { term: "こ" }, " dekat pembicara, ", { term: "そ" }, " dekat lawan bicara, ", { term: "あ" }, " jauh dari keduanya."]
              vi: ["Ba khoảng cách: ", { term: "こ" }, " gần người nói, ", { term: "そ" }, " gần người nghe, ", { term: "あ" }, " xa cả hai."]
            ex: { examples: [[{ target: "これ" }, "はかばんです。"], [{ target: "それ" }, "はかさです。"], [{ target: "あれ" }, "はやまです。"]] }
            tr: { en: { examples: ["This is a bag.", "That is an umbrella.", "That over there is a mountain."] }, uk: { examples: ["Це сумка.", "То парасолька.", "Отам далеко — гора."] }, es: { examples: ["Esto es un bolso.", "Eso es un paraguas.", "Aquello es una montaña."] }, pt: { examples: ["Isto é uma bolsa.", "Isso é um guarda-chuva.", "Aquilo é uma montanha."] }, fr: { examples: ["Ceci est un sac.", "Ça, c’est un parapluie.", "Là-bas, c’est une montagne."] }, de: { examples: ["Das hier ist eine Tasche.", "Das da ist ein Regenschirm.", "Das dort drüben ist ein Berg."] }, it: { examples: ["Questa è una borsa.", "Quello è un ombrello.", "Quella laggiù è una montagna."] }, pl: { examples: ["To jest torba.", "To jest parasol.", "Tamto to góra."] }, tr: { examples: ["Bu bir çanta.", "Şu bir şemsiye.", "O bir dağ."] }, id: { examples: ["Ini tas.", "Itu payung.", "Yang di sana itu gunung."] }, vi: { examples: ["Đây là cái túi.", "Đó là cái ô.", "Kia là ngọn núi."] } }
          - type: "rule"
            level: "A0"
            text:
              en: ["The first sound sets the distance; the ending sets the kind: ", { term: "れ" }, " a thing, ", { term: "の" }, " before a noun, ", { term: "こ" }, " a place."]
              uk: ["Перший звук задає відстань, закінчення — вид слова: ", { term: "れ" }, " — річ, ", { term: "の" }, " — перед іменником, ", { term: "こ" }, " — місце."]
              es: ["El primer sonido marca la distancia; la terminación marca el tipo: ", { term: "れ" }, " una cosa, ", { term: "の" }, " ante un sustantivo, ", { term: "こ" }, " un lugar."]
              pt: ["O primeiro som marca a distância; a terminação marca o tipo: ", { term: "れ" }, " uma coisa, ", { term: "の" }, " antes de um substantivo, ", { term: "こ" }, " um lugar."]
              fr: ["Le premier son donne la distance ; la terminaison donne le type : ", { term: "れ" }, " une chose, ", { term: "の" }, " devant un nom, ", { term: "こ" }, " un lieu."]
              de: ["Der erste Laut gibt die Entfernung an, die Endung die Art: ", { term: "れ" }, " eine Sache, ", { term: "の" }, " vor einem Nomen, ", { term: "こ" }, " ein Ort."]
              it: ["Il primo suono dà la distanza; la terminazione dà il tipo: ", { term: "れ" }, " una cosa, ", { term: "の" }, " davanti a un nome, ", { term: "こ" }, " un luogo."]
              pl: ["Pierwszy dźwięk wyznacza odległość, końcówka rodzaj słowa: ", { term: "れ" }, " rzecz, ", { term: "の" }, " przed rzeczownikiem, ", { term: "こ" }, " miejsce."]
              tr: ["İlk ses uzaklığı, sonek türü belirler: ", { term: "れ" }, " şey, ", { term: "の" }, " isimden önce, ", { term: "こ" }, " yer."]
              id: ["Bunyi pertama menentukan jarak; akhiran menentukan jenisnya: ", { term: "れ" }, " benda, ", { term: "の" }, " sebelum kata benda, ", { term: "こ" }, " tempat."]
              vi: ["Âm đầu cho biết khoảng cách; phần đuôi cho biết loại từ: ", { term: "れ" }, " vật, ", { term: "の" }, " trước danh từ, ", { term: "こ" }, " nơi chốn."]
          - type: "note"
            level: "A1"
            text:
              en: ["The ", { term: "ど" }, " words are question words. See ", { link: "Questions", to: "ja.sentence-basics.questions" }, "."]
              uk: ["Слова з ", { term: "ど" }, " — питальні слова. Див. ", { link: "Питання", to: "ja.sentence-basics.questions" }, "."]
              es: ["Las palabras con ", { term: "ど" }, " son palabras interrogativas. Véase ", { link: "Las preguntas", to: "ja.sentence-basics.questions" }, "."]
              pt: ["As palavras com ", { term: "ど" }, " são palavras interrogativas. Veja ", { link: "As perguntas", to: "ja.sentence-basics.questions" }, "."]
              fr: ["Les mots en ", { term: "ど" }, " sont des mots interrogatifs. Voir ", { link: "Les questions", to: "ja.sentence-basics.questions" }, "."]
              de: ["Die Wörter mit ", { term: "ど" }, " sind Fragewörter. Siehe ", { link: "Fragen", to: "ja.sentence-basics.questions" }, "."]
              it: ["Le parole con ", { term: "ど" }, " sono parole interrogative. Vedi ", { link: "Le domande", to: "ja.sentence-basics.questions" }, "."]
              pl: ["Słowa z ", { term: "ど" }, " są słowami pytającymi. Zob. ", { link: "Pytania", to: "ja.sentence-basics.questions" }, "."]
              tr: [{ term: "ど" }, " ile başlayan sözcükler soru sözcükleridir. Bkz. ", { link: "Soru cümleleri", to: "ja.sentence-basics.questions" }, "."]
              id: ["Kata berawalan ", { term: "ど" }, " adalah kata tanya. Lihat ", { link: "Kalimat tanya", to: "ja.sentence-basics.questions" }, "."]
              vi: ["Các từ với ", { term: "ど" }, " là từ để hỏi. Xem ", { link: "Câu hỏi", to: "ja.sentence-basics.questions" }, "."]
