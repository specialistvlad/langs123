sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "好き" }, " “liked”, ", { term: "きらい" }, " “disliked”, ", { term: "上手" }, " “skilled” and ", { term: "下手" }, " “unskilled” are ", { term: "な" }, "-adjectives."]
              uk: [{ term: "好き" }, " «улюблений», ", { term: "きらい" }, " «нелюбий», ", { term: "上手" }, " «вправний» і ", { term: "下手" }, " «невправний» — це ", { term: "な" }, "-прикметники."]
              es: [{ term: "好き" }, " «gustado», ", { term: "きらい" }, " «desagradable», ", { term: "上手" }, " «hábil» y ", { term: "下手" }, " «torpe» son adjetivos ", { term: "な" }, "."]
              pt: [{ term: "好き" }, " «apreciado», ", { term: "きらい" }, " «desagradável», ", { term: "上手" }, " «hábil» e ", { term: "下手" }, " «inábil» são adjetivos ", { term: "な" }, "."]
              fr: [{ term: "好き" }, " « aimé », ", { term: "きらい" }, " « détesté », ", { term: "上手" }, " « habile » et ", { term: "下手" }, " « maladroit » sont des adjectifs en ", { term: "な" }, "."]
              de: [{ term: "好き" }, " „gemocht“, ", { term: "きらい" }, " „unbeliebt“, ", { term: "上手" }, " „geschickt“ und ", { term: "下手" }, " „ungeschickt“ sind ", { term: "な" }, "-Adjektive."]
              it: [{ term: "好き" }, " «gradito», ", { term: "きらい" }, " «sgradito», ", { term: "上手" }, " «abile» e ", { term: "下手" }, " «maldestro» sono aggettivi in ", { term: "な" }, "."]
              pl: [{ term: "好き" }, " „lubiany”, ", { term: "きらい" }, " „nielubiany”, ", { term: "上手" }, " „zręczny” i ", { term: "下手" }, " „niezręczny” to przymiotniki ", { term: "な" }, "."]
              tr: [{ term: "好き" }, " “sevilen”, ", { term: "きらい" }, " “sevilmeyen”, ", { term: "上手" }, " “becerikli” ve ", { term: "下手" }, " “beceriksiz” birer ", { term: "な" }, " sıfatıdır."]
              id: [{ term: "好き" }, " “disukai”, ", { term: "きらい" }, " “tidak disukai”, ", { term: "上手" }, " “mahir”, dan ", { term: "下手" }, " “tidak mahir” adalah kata sifat ", { term: "な" }, "."]
              vi: [{ term: "好き" }, " “được thích”, ", { term: "きらい" }, " “bị ghét”, ", { term: "上手" }, " “giỏi” và ", { term: "下手" }, " “kém” là tính từ ", { term: "な" }, "."]
            ex: ["アンナさんは", { kanji: "日本語", reading: "にほんご" }, "が", { target: { kanji: "上手", reading: "じょうず" } }, "です。"]
            tr: { en: "Anna is good at Japanese.", uk: "Анна добре володіє японською.", es: "Anna habla bien japonés.", pt: "A Anna fala bem japonês.", fr: "Anna parle bien japonais.", de: "Anna kann gut Japanisch.", it: "Anna è brava in giapponese.", pl: "Anna dobrze zna japoński.", tr: "Anna Japoncada iyi.", id: "Anna pandai berbahasa Jepang.", vi: "Anna giỏi tiếng Nhật." }
          - type: "rule"
            level: "A1"
            text:
              en: ["The person takes ", { term: "は" }, "; the thing liked or done well takes ", { term: "が" }, "."]
              uk: ["Особа бере ", { term: "は" }, "; те, що подобається чи добре виходить, бере ", { term: "が" }, "."]
              es: ["La persona lleva ", { term: "は" }, "; lo que gusta o se hace bien lleva ", { term: "が" }, "."]
              pt: ["A pessoa leva ", { term: "は" }, "; o que se aprecia ou se faz bem leva ", { term: "が" }, "."]
              fr: ["La personne prend ", { term: "は" }, " ; ce qu’on aime ou fait bien prend ", { term: "が" }, "."]
              de: ["Die Person steht mit ", { term: "は" }, "; was man mag oder gut kann, steht mit ", { term: "が" }, "."]
              it: ["La persona prende ", { term: "は" }, "; ciò che piace o si fa bene prende ", { term: "が" }, "."]
              pl: ["Osoba bierze ", { term: "は" }, "; to, co się lubi lub dobrze robi, bierze ", { term: "が" }, "."]
              tr: ["Kişi ", { term: "は" }, " alır; sevilen ya da iyi yapılan şey ", { term: "が" }, " alır."]
              id: ["Orangnya memakai ", { term: "は" }, "; hal yang disukai atau dikuasai memakai ", { term: "が" }, "."]
              vi: ["Người đi với ", { term: "は" }, "; thứ được thích hoặc làm giỏi đi với ", { term: "が" }, "."]
            ex: [{ kanji: "私", reading: "わたし" }, { target: "は" }, { kanji: "犬", reading: "いぬ" }, { target: "が" }, { kanji: "好", reading: "す" }, "きです。"]
            tr: { en: "I like dogs.", uk: "Я люблю собак.", es: "Me gustan los perros.", pt: "Eu gosto de cachorros.", fr: "J’aime les chiens.", de: "Ich mag Hunde.", it: "Mi piacciono i cani.", pl: "Lubię psy.", tr: "Köpekleri severim.", id: "Saya suka anjing.", vi: "Tôi thích chó." }
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "ほしい" }, " “wanted” is an ", { term: "い" }, "-adjective; what you want takes ", { term: "が" }, "."]
              uk: [{ term: "ほしい" }, " «бажаний» — це ", { term: "い" }, "-прикметник; те, що хочеш мати, бере ", { term: "が" }, "."]
              es: [{ term: "ほしい" }, " «deseado» es un adjetivo ", { term: "い" }, "; lo que quieres tener lleva ", { term: "が" }, "."]
              pt: [{ term: "ほしい" }, " «desejado» é um adjetivo ", { term: "い" }, "; o que você quer ter leva ", { term: "が" }, "."]
              fr: [{ term: "ほしい" }, " « désiré » est un adjectif en ", { term: "い" }, " ; ce qu’on veut avoir prend ", { term: "が" }, "."]
              de: [{ term: "ほしい" }, " „gewünscht“ ist ein ", { term: "い" }, "-Adjektiv; was man haben will, steht mit ", { term: "が" }, "."]
              it: [{ term: "ほしい" }, " «desiderato» è un aggettivo in ", { term: "い" }, "; ciò che vuoi avere prende ", { term: "が" }, "."]
              pl: [{ term: "ほしい" }, " „pożądany” to przymiotnik ", { term: "い" }, "; to, co chcesz mieć, bierze ", { term: "が" }, "."]
              tr: [{ term: "ほしい" }, " “istenen” bir ", { term: "い" }, " sıfatıdır; istenen şey ", { term: "が" }, " alır."]
              id: [{ term: "ほしい" }, " “diinginkan” adalah kata sifat ", { term: "い" }, "; hal yang diinginkan memakai ", { term: "が" }, "."]
              vi: [{ term: "ほしい" }, " “được muốn” là tính từ ", { term: "い" }, "; thứ muốn có đi với ", { term: "が" }, "."]
            ex: [{ kanji: "私", reading: "わたし" }, "は", { kanji: "車", reading: "くるま" }, { target: "が" }, "ほしいです。"]
            tr: { en: "I want a car.", uk: "Я хочу машину.", es: "Quiero un coche.", pt: "Eu quero um carro.", fr: "Je veux une voiture.", de: "Ich möchte ein Auto.", it: "Voglio una macchina.", pl: "Chcę samochód.", tr: "Bir araba istiyorum.", id: "Saya ingin mobil.", vi: "Tôi muốn có một chiếc xe." }
          - type: "note"
            level: "A1"
            text:
              en: ["The endings follow the adjective type: ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, ", ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, "."]
              uk: ["Закінчення залежать від типу прикметника: ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, ", ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, "."]
              es: ["Las terminaciones siguen el tipo de adjetivo: ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              pt: ["As terminações seguem o tipo de adjetivo: ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              fr: ["Les terminaisons suivent le type d’adjectif : ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, "."]
              de: ["Die Endungen richten sich nach der Art des Adjektivs: ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, "."]
              it: ["Le terminazioni seguono il tipo di aggettivo: ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, "."]
              pl: ["Końcówki zależą od typu przymiotnika: ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, "."]
              tr: ["Ekler sıfatın türüne bağlıdır: ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, ", ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, "."]
              id: ["Akhiran mengikuti jenis kata sifat: ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, "."]
              vi: ["Phần đuôi theo loại tính từ: ", { link: "Tính từ な", to: "ja.adjectives.na-adjectives" }, ", ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, "."]
          - type: "note"
            level: "A2"
            text:
              en: ["To say what you want to do, see ", { link: "Wanting to Do: たい", to: ja.verbs.tai }, "."]
              uk: ["Про бажання зробити щось див. ", { link: "Бажання щось зробити: たい", to: ja.verbs.tai }, "."]
              es: ["Para decir lo que quieres hacer, véase ", { link: "Querer hacer algo: たい", to: ja.verbs.tai }, "."]
              pt: ["Para dizer o que você quer fazer, veja ", { link: "Querer fazer algo: たい", to: ja.verbs.tai }, "."]
              fr: ["Pour dire ce qu’on veut faire, voir ", { link: "Vouloir faire : たい", to: ja.verbs.tai }, "."]
              de: ["Um zu sagen, was man tun will, siehe ", { link: "Etwas tun wollen: たい", to: ja.verbs.tai }, "."]
              it: ["Per dire ciò che vuoi fare, vedi ", { link: "Voler fare: たい", to: ja.verbs.tai }, "."]
              pl: ["O tym, co chcesz zrobić, zob. ", { link: "Chcenie zrobienia czegoś: たい", to: ja.verbs.tai }, "."]
              tr: ["Yapmak istediğini söylemek için bkz. ", { link: "Yapmak istemek: たい", to: ja.verbs.tai }, "."]
              id: ["Untuk menyatakan hal yang ingin dilakukan, lihat ", { link: "Ingin melakukan: たい", to: ja.verbs.tai }, "."]
              vi: ["Để nói điều muốn làm, xem ", { link: "Muốn làm gì: たい", to: ja.verbs.tai }, "."]
