          tr: { en: "What do you like best among foods?", uk: "Що з їжі ти любиш найбільше?", es: "¿Qué comida te gusta más de todas?", pt: "De que comida você mais gosta?", fr: "Parmi les plats, lequel aimez-vous le plus ?", de: "Welches Essen magst du am liebsten?", it: "Tra i cibi, quale ti piace di più?", pl: "Które jedzenie lubisz najbardziej?", tr: "Yemekler arasında en çok neyi seversin?", id: "Di antara makanan, apa yang paling kamu suka?", vi: "Trong các món ăn, bạn thích món nào nhất?" }
        - level: "A2"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["The one chosen as the top takes ", { term: "が" }, "."]
            uk: ["Обране як найкраще бере ", { term: "が" }, "."]
            es: ["Lo elegido como el primero lleva ", { term: "が" }, "."]
            pt: ["O escolhido como o primeiro leva ", { term: "が" }, "."]
            fr: ["Ce qui est choisi comme le premier prend ", { term: "が" }, "."]
            de: ["Das als erstes Gewählte steht mit ", { term: "が" }, "."]
            it: ["Quello scelto come il primo prende ", { term: "が" }, "."]
            pl: ["Wybrane jako pierwsze bierze ", { term: "が" }, "."]
            tr: ["En başa seçilen ", { term: "が" }, " alır."]
            id: ["Yang dipilih sebagai yang teratas memakai ", { term: "が" }, "."]
            vi: ["Cái được chọn là nhất đi với ", { term: "が" }, "."]
          ex: ["クラスでアンナさん", { target: "が" }, "いちばん", { kanji: "元気", reading: "げんき" }, "です。"]
          tr: { en: "Anna is the liveliest in the class.", uk: "Анна найенергійніша в класі.", es: "Anna es la más animada de la clase.", pt: "A Anna é a mais animada da classe.", fr: "Anna est la plus dynamique de la classe.", de: "Anna ist die Lebhafteste in der Klasse.", it: "Anna è la più vivace della classe.", pl: "Anna jest najbardziej energiczna w klasie.", tr: "Sınıfta en enerjik olan Anna’dır.", id: "Anna yang paling bersemangat di kelas.", vi: "Anna là người hoạt bát nhất lớp." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "より" }, " follows the thing compared with, never the adjective."]
            uk: [{ term: "より" }, " стоїть після того, з чим порівнюють, а не після прикметника."]
            es: [{ term: "より" }, " va tras aquello con lo que se compara, nunca tras el adjetivo."]
            pt: [{ term: "より" }, " vem depois daquilo com que se compara, nunca depois do adjetivo."]
            fr: [{ term: "より" }, " suit ce à quoi on compare, jamais l’adjectif."]
            de: [{ term: "より" }, " steht hinter dem Verglichenen, nie hinter dem Adjektiv."]
            it: [{ term: "より" }, " segue ciò con cui si confronta, mai l’aggettivo."]
            pl: [{ term: "より" }, " idzie za tym, z czym porównujemy, nigdy za przymiotnikiem."]
            tr: [{ term: "より" }, " karşılaştırılan şeyden sonra gelir, sıfattan sonra değil."]
            id: [{ term: "より" }, " mengikuti hal yang dibandingkan, bukan kata sifat."]
            vi: [{ term: "より" }, " đi sau vật được so sánh, không đi sau tính từ."]
          ex: ["きょうはきのう", { target: "より" }, { kanji: "暑", reading: "あつ" }, "いです。"]
          tr: { en: "Today is hotter than yesterday.", uk: "Сьогодні спекотніше, ніж учора.", es: "Hoy hace más calor que ayer.", pt: "Hoje está mais quente que ontem.", fr: "Aujourd’hui, il fait plus chaud qu’hier.", de: "Heute ist es heißer als gestern.", it: "Oggi fa più caldo di ieri.", pl: "Dziś jest goręcej niż wczoraj.", tr: "Bugün hava dünden daha sıcak.", id: "Hari ini lebih panas daripada kemarin.", vi: "Hôm nay nóng hơn hôm qua." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "より" }, " follows the thing compared with: A ", { term: "は" }, " B ", { term: "より" }, " … means “A is more … than B”."]
              uk: [{ term: "より" }, " стоїть після того, з чим порівнюють: A ", { term: "は" }, " B ", { term: "より" }, " … означає «A більш … за B»."]
              es: [{ term: "より" }, " va tras aquello con lo que se compara: A ", { term: "は" }, " B ", { term: "より" }, " … significa «A es más … que B»."]
              pt: [{ term: "より" }, " vem depois daquilo com que se compara: A ", { term: "は" }, " B ", { term: "より" }, " … significa «A é mais … que B»."]
              fr: [{ term: "より" }, " suit ce à quoi on compare : A ", { term: "は" }, " B ", { term: "より" }, " … signifie « A est plus … que B »."]
              de: [{ term: "より" }, " steht hinter dem Verglichenen: A ", { term: "は" }, " B ", { term: "より" }, " … heißt „A ist … -er als B“."]
              it: [{ term: "より" }, " segue ciò con cui si confronta: A ", { term: "は" }, " B ", { term: "より" }, " … significa «A è più … di B»."]
              pl: [{ term: "より" }, " idzie za tym, z czym porównujemy: A ", { term: "は" }, " B ", { term: "より" }, " … znaczy „A jest bardziej … niż B”."]
              tr: [{ term: "より" }, " karşılaştırılan şeyden sonra gelir: A ", { term: "は" }, " B ", { term: "より" }, " … “A, B’den daha …” demektir."]
              id: [{ term: "より" }, " mengikuti hal yang dibandingkan: A ", { term: "は" }, " B ", { term: "より" }, " … berarti “A lebih … daripada B”."]
              vi: [{ term: "より" }, " đi sau vật được so sánh: A ", { term: "は" }, " B ", { term: "より" }, " … nghĩa là “A … hơn B”."]
            ex: [{ kanji: "東京", reading: "とうきょう" }, "は", { kanji: "大阪", reading: "おおさか" }, { target: "より" }, { kanji: "大", reading: "おお" }, "きいです。"]
            tr: { en: "Tokyo is bigger than Osaka.", uk: "Токіо більше за Осаку.", es: "Tokio es más grande que Osaka.", pt: "Tóquio é maior que Osaka.", fr: "Tokyo est plus grande qu’Osaka.", de: "Tokio ist größer als Osaka.", it: "Tokyo è più grande di Osaka.", pl: "Tokio jest większe niż Osaka.", tr: "Tokyo, Osaka’dan daha büyük.", id: "Tokyo lebih besar daripada Osaka.", vi: "Tokyo lớn hơn Osaka." }
          - type: "rule"
            level: "A2"
            text:
              en: ["To choose one of two, ask with ", { term: "どちらが" }, " and answer with ", { term: "のほうが" }, "."]
              uk: ["Щоб вибрати одне з двох, питайте з ", { term: "どちらが" }, ", а відповідайте з ", { term: "のほうが" }, "."]
              es: ["Para elegir uno de dos, se pregunta con ", { term: "どちらが" }, " y se responde con ", { term: "のほうが" }, "."]
              pt: ["Para escolher um de dois, pergunta-se com ", { term: "どちらが" }, " e responde-se com ", { term: "のほうが" }, "."]
              fr: ["Pour choisir l’un des deux, on demande avec ", { term: "どちらが" }, " et on répond avec ", { term: "のほうが" }, "."]
              de: ["Um eines von zweien zu wählen, fragt man mit ", { term: "どちらが" }, " und antwortet mit ", { term: "のほうが" }, "."]
              it: ["Per scegliere uno di due, si chiede con ", { term: "どちらが" }, " e si risponde con ", { term: "のほうが" }, "."]
              pl: ["Aby wybrać jedno z dwóch, pyta się z ", { term: "どちらが" }, ", a odpowiada z ", { term: "のほうが" }, "."]
              tr: ["İkisinden birini seçmek için ", { term: "どちらが" }, " ile sorulur, ", { term: "のほうが" }, " ile cevaplanır."]
              id: ["Untuk memilih satu dari dua, tanyakan dengan ", { term: "どちらが" }, " dan jawab dengan ", { term: "のほうが" }, "."]
              vi: ["Để chọn một trong hai, hỏi bằng ", { term: "どちらが" }, " và đáp bằng ", { term: "のほうが" }, "."]
            ex: { exchange: [[{ kanji: "電車", reading: "でんしゃ" }, "とバスとどちらが", { kanji: "速", reading: "はや" }, "いですか。"], [{ kanji: "電車", reading: "でんしゃ" }, "の", { target: "ほうが" }, { kanji: "速", reading: "はや" }, "いです。"]] }
            tr: { en: { exchange: ["Which is faster, the train or the bus?", "The train is faster."] }, uk: { exchange: ["Що швидше: електричка чи автобус?", "Електричка швидша."] }, es: { exchange: ["¿Qué es más rápido, el tren o el autobús?", "El tren es más rápido."] }, pt: { exchange: ["Qual é mais rápido, o trem ou o ônibus?", "O trem é mais rápido."] }, fr: { exchange: ["Qu’est-ce qui est plus rapide, le train ou le bus ?", "Le train est plus rapide."] }, de: { exchange: ["Was ist schneller, der Zug oder der Bus?", "Der Zug ist schneller."] }, it: { exchange: ["Quale è più veloce, il treno o l’autobus?", "Il treno è più veloce."] }, pl: { exchange: ["Co jest szybsze: pociąg czy autobus?", "Pociąg jest szybszy."] }, tr: { exchange: ["Hangisi daha hızlı, tren mi otobüs mü?", "Tren daha hızlı."] }, id: { exchange: ["Mana yang lebih cepat, kereta atau bus?", "Kereta lebih cepat."] }, vi: { exchange: ["Cái nào nhanh hơn, tàu điện hay xe buýt?", "Tàu điện nhanh hơn."] } }
          - type: "rule"
            level: "A2"
            text:
              en: ["To name the top of a group, say the group with ", { term: "の中で" }, " and put ", { term: "いちばん" }, " before the adjective."]
              uk: ["Щоб назвати перше в групі, скажіть групу з ", { term: "の中で" }, " і поставте ", { term: "いちばん" }, " перед прикметником."]
              es: ["Para nombrar el primero de un grupo, di el grupo con ", { term: "の中で" }, " y pon ", { term: "いちばん" }, " ante el adjetivo."]
              pt: ["Para nomear o primeiro de um grupo, diga o grupo com ", { term: "の中で" }, " e ponha ", { term: "いちばん" }, " antes do adjetivo."]
              fr: ["Pour nommer le premier d’un groupe, dites le groupe avec ", { term: "の中で" }, " et placez ", { term: "いちばん" }, " devant l’adjectif."]
              de: ["Um das erste einer Gruppe zu nennen, nennt man die Gruppe mit ", { term: "の中で" }, " und setzt ", { term: "いちばん" }, " vor das Adjektiv."]
              it: ["Per nominare il primo di un gruppo, si dice il gruppo con ", { term: "の中で" }, " e si mette ", { term: "いちばん" }, " davanti all’aggettivo."]
              pl: ["Aby wskazać pierwsze w grupie, podaje się grupę z ", { term: "の中で" }, " i stawia ", { term: "いちばん" }, " przed przymiotnikiem."]
              tr: ["Bir grubun en başındakini söylemek için grup ", { term: "の中で" }, " ile belirtilir, ", { term: "いちばん" }, " sıfatın önüne gelir."]
              id: ["Untuk menyebut yang teratas dalam kelompok, sebutkan kelompoknya dengan ", { term: "の中で" }, " dan taruh ", { term: "いちばん" }, " sebelum kata sifat."]
              vi: ["Để nêu cái nhất trong nhóm, nói nhóm bằng ", { term: "の中で" }, " và đặt ", { term: "いちばん" }, " trước tính từ."]
            ex: [{ kanji: "日本", reading: "にほん" }, "の", { kanji: "山", reading: "やま" }, "の", { kanji: "中", reading: "なか" }, "でふじさんが", { target: "いちばん" }, { kanji: "高", reading: "たか" }, "いです。"]
            tr: { en: "Of Japan's mountains, Mt Fuji is the highest.", uk: "Серед гір Японії найвища — Фудзі.", es: "De las montañas de Japón, el Fuji es la más alta.", pt: "Entre as montanhas do Japão, o Fuji é a mais alta.", fr: "Parmi les montagnes du Japon, le Fuji est la plus haute.", de: "Unter den Bergen Japans ist der Fuji der höchste.", it: "Tra le montagne del Giappone, il Fuji è la più alta.", pl: "Spośród gór Japonii Fudżi jest najwyższa.", tr: "Japonya’nın dağları arasında en yüksek olan Fuji’dir.", id: "Di antara gunung di Jepang, Fuji yang tertinggi.", vi: "Trong các ngọn núi của Nhật Bản, núi Phú Sĩ cao nhất." }
          - type: "note"
            level: "A1"
            text:
              en: ["The adjective keeps its own forms in every comparison: ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, ", ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, "."]
              uk: ["Прикметник зберігає власні форми в кожному порівнянні: ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, ", ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, "."]
              es: ["El adjetivo conserva sus propias formas en toda comparación: ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              pt: ["O adjetivo mantém suas próprias formas em toda comparação: ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              fr: ["L’adjectif garde ses propres formes dans toute comparaison : ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, "."]
              de: ["Das Adjektiv behält in jedem Vergleich seine eigenen Formen: ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, "."]
              it: ["L’aggettivo mantiene le proprie forme in ogni confronto: ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, "."]
              pl: ["Przymiotnik zachowuje własne formy w każdym porównaniu: ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, "."]
              tr: ["Sıfat her karşılaştırmada kendi biçimlerini korur: ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, ", ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, "."]
              id: ["Kata sifat mempertahankan bentuknya sendiri dalam setiap perbandingan: ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, ", ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, "."]
