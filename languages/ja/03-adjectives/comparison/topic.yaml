    de: [{ term: "より" }, " steht hinter dem, womit verglichen wird:"]
    it: ["Metti ", { term: "より" }, " dopo ciò con cui confronti:"]
    pl: ["Po tym, z czym porównujesz, postaw ", { term: "より" }, ":"]
    tr: ["Karşılaştırdığın şeyin ardına ", { term: "より" }, " koy:"]
    id: ["Letakkan ", { term: "より" }, " setelah hal yang dibandingkan:"]
