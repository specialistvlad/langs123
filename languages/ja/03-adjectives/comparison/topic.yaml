summary:
  lead:
    en: [{ term: "より" }, " names what a thing is compared with, ", { term: "のほうが" }, " picks one of two and ", { term: "いちばん" }, " the top of a group."]
    uk: [{ term: "より" }, " називає те, з чим порівнюють, ", { term: "のほうが" }, " вибирає одне з двох, а ", { term: "いちばん" }, " — перше в групі."]
    es: [{ term: "より" }, " nombra aquello con lo que se compara, ", { term: "のほうが" }, " elige uno de dos e ", { term: "いちばん" }, " el primero de un grupo."]
    pt: [{ term: "より" }, " indica aquilo com que se compara, ", { term: "のほうが" }, " escolhe um de dois e ", { term: "いちばん" }, " o primeiro de um grupo."]
    fr: [{ term: "より" }, " nomme ce à quoi on compare, ", { term: "のほうが" }, " choisit l’un des deux et ", { term: "いちばん" }, " le premier d’un groupe."]
    de: [{ term: "より" }, " nennt, womit verglichen wird, ", { term: "のほうが" }, " wählt eines von zwei und ", { term: "いちばん" }, " das erste einer Gruppe."]
    it: [{ term: "より" }, " indica ciò con cui si confronta, ", { term: "のほうが" }, " sceglie uno di due e ", { term: "いちばん" }, " il primo di un gruppo."]
    pl: [{ term: "より" }, " nazywa to, z czym porównujemy, ", { term: "のほうが" }, " wybiera jedno z dwóch, a ", { term: "いちばん" }, " — pierwsze w grupie."]
    tr: [{ term: "より" }, " karşılaştırılan şeyi bildirir, ", { term: "のほうが" }, " ikisinden birini seçer, ", { term: "いちばん" }, " bir grubun en başındakini."]
    id: [{ term: "より" }, " menyebut pembanding, ", { term: "のほうが" }, " memilih satu dari dua, dan ", { term: "いちばん" }, " yang teratas dalam kelompok."]
    vi: [{ term: "より" }, " nêu vật được đem ra so sánh, ", { term: "のほうが" }, " chọn một trong hai, còn ", { term: "いちばん" }, " chọn cái nhất trong nhóm."]
  rule:
