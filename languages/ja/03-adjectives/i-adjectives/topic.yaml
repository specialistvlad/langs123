      vi: "いい bất quy tắc"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "いい" }, " means “good”; every form but ", { term: "いい" }, " itself is built on ", { term: "よ" }, "."]
              uk: [{ term: "いい" }, " означає «хороший»; усі форми, крім самого ", { term: "いい" }, ", будуються на ", { term: "よ" }, "."]
              es: [{ term: "いい" }, " significa «bueno»; todas las formas salvo ", { term: "いい" }, " se construyen sobre ", { term: "よ" }, "."]
              pt: [{ term: "いい" }, " significa «bom»; todas as formas, menos ", { term: "いい" }, ", se constroem sobre ", { term: "よ" }, "."]
              fr: [{ term: "いい" }, " signifie « bon » ; toutes les formes sauf ", { term: "いい" }, " se construisent sur ", { term: "よ" }, "."]
              de: [{ term: "いい" }, " heißt „gut“; alle Formen außer ", { term: "いい" }, " selbst werden von ", { term: "よ" }, " gebildet."]
              it: [{ term: "いい" }, " significa «buono»; tutte le forme tranne ", { term: "いい" }, " si costruiscono su ", { term: "よ" }, "."]
              pl: [{ term: "いい" }, " znaczy „dobry”; wszystkie formy prócz samego ", { term: "いい" }, " tworzy się od ", { term: "よ" }, "."]
              tr: [{ term: "いい" }, " “iyi” demektir; ", { term: "いい" }, " dışındaki tüm biçimler ", { term: "よ" }, " üzerine kurulur."]
              id: [{ term: "いい" }, " berarti “baik”; semua bentuk selain ", { term: "いい" }, " dibentuk dari ", { term: "よ" }, "."]
              vi: [{ term: "いい" }, " nghĩa là “tốt”; mọi dạng trừ chính ", { term: "いい" }, " đều tạo từ ", { term: "よ" }, "."]
      - type: "usage"
        columns:
          - { key: "form", label: { en: "Form", uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            form: { alternatives: [{ term: "いい" }, { term: "いいです" }] }
            ex: [{ kanji: "今日", reading: "きょう" }, "は", { target: "いい" }, { kanji: "天気", reading: "てんき" }, "です。"]
            tr: { en: "The weather is nice today.", uk: "Сьогодні гарна погода.", es: "Hoy hace buen tiempo.", pt: "Hoje o tempo está bom.", fr: "Il fait beau aujourd’hui.", de: "Heute ist das Wetter schön.", it: "Oggi il tempo è bello.", pl: "Dziś jest ładna pogoda.", tr: "Bugün hava güzel.", id: "Cuaca hari ini bagus.", vi: "Hôm nay thời tiết đẹp." }
          - level: "A1"
            form: { term: "よくないです" }
            ex: ["このレストランは", { target: "よくないです" }, "。"]
            tr: { en: "This restaurant is not good.", uk: "Цей ресторан не дуже хороший.", es: "Este restaurante no es bueno.", pt: "Este restaurante não é bom.", fr: "Ce restaurant n’est pas bon.", de: "Dieses Restaurant ist nicht gut.", it: "Questo ristorante non è buono.", pl: "Ta restauracja nie jest dobra.", tr: "Bu restoran iyi değil.", id: "Restoran ini tidak bagus.", vi: "Nhà hàng này không ngon." }
          - level: "A1"
