            ex: ["きのうの", { kanji: "映画", reading: "えいが" }, "は", { target: "よかったです" }, "。"]
            tr: { en: "Yesterday's film was good.", uk: "Вчорашній фільм був гарний.", es: "La película de ayer estuvo bien.", pt: "O filme de ontem foi bom.", fr: "Le film d’hier était bien.", de: "Der Film von gestern war gut.", it: "Il film di ieri era bello.", pl: "Wczorajszy film był dobry.", tr: "Dünkü film iyiydi.", id: "Film kemarin bagus.", vi: "Bộ phim hôm qua hay." }
          - level: "A1"
            form: { term: "よくなかったです" }
            ex: ["きのうの", { kanji: "天気", reading: "てんき" }, "は", { target: "よくなかったです" }, "。"]
            tr: { en: "Yesterday's weather was not good.", uk: "Учорашня погода була не дуже гарна.", es: "El tiempo de ayer no fue bueno.", pt: "O tempo de ontem não estava bom.", fr: "Le temps d’hier n’était pas beau.", de: "Das Wetter gestern war nicht gut.", it: "Il tempo di ieri non era bello.", pl: "Wczorajsza pogoda nie była ładna.", tr: "Dünkü hava iyi değildi.", id: "Cuaca kemarin tidak bagus.", vi: "Thời tiết hôm qua không đẹp." }
