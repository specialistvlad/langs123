          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            use:
              en: "Adjective and noun"
              uk: "Прикметник і іменник"
              es: "Adjetivo y sustantivo"
              pt: "Adjetivo e substantivo"
              fr: "Adjectif et nom"
              de: "Adjektiv und Nomen"
              it: "Aggettivo e nome"
              pl: "Przymiotnik i rzeczownik"
              tr: "Sıfat ve isim"
              id: "Kata sifat dan kata benda"
              vi: "Tính từ và danh từ"
            ex: { examples: [[{ target: [{ kanji: "新", reading: "あたら" }, "しい"] }, { kanji: "本", reading: "ほん" }, "です。"], [{ target: [{ kanji: "小", reading: "ちい" }, "さい"] }, { kanji: "犬", reading: "いぬ" }, "です。"], [{ target: [{ kanji: "古", reading: "ふる" }, "い"] }, { kanji: "家", reading: "いえ" }, "です。"]] }
            tr: { en: { examples: ["It is a new book.", "It is a small dog.", "It is an old house."] }, uk: { examples: ["Це нова книга.", "Це маленький собака.", "Це старий будинок."] }, es: { examples: ["Es un libro nuevo.", "Es un perro pequeño.", "Es una casa vieja."] }, pt: { examples: ["É um livro novo.", "É um cachorro pequeno.", "É uma casa velha."] }, fr: { examples: ["C’est un livre neuf.", "C’est un petit chien.", "C’est une vieille maison."] }, de: { examples: ["Das ist ein neues Buch.", "Das ist ein kleiner Hund.", "Das ist ein altes Haus."] }, it: { examples: ["È un libro nuovo.", "È un cane piccolo.", "È una casa vecchia."] }, pl: { examples: ["To nowa książka.", "To mały pies.", "To stary dom."] }, tr: { examples: ["Bu yeni bir kitap.", "Bu küçük bir köpek.", "Bu eski bir ev."] }, id: { examples: ["Ini buku baru.", "Itu anjing kecil.", "Itu rumah tua."] }, vi: { examples: ["Đây là một cuốn sách mới.", "Đó là một con chó nhỏ.", "Đó là một ngôi nhà cũ."] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "です" }, " closes the whole sentence; it never stands between the adjective and its noun."]
              uk: [{ term: "です" }, " закриває все речення; між прикметником і його іменником вона не стоїть."]
              es: [{ term: "です" }, " cierra toda la oración; no va entre el adjetivo y su sustantivo."]
              pt: [{ term: "です" }, " fecha a frase inteira; não fica entre o adjetivo e o seu substantivo."]
              fr: [{ term: "です" }, " ferme toute la phrase ; il ne se place pas entre l’adjectif et son nom."]
              de: [{ term: "です" }, " schließt den ganzen Satz; es steht nie zwischen Adjektiv und Nomen."]
              it: [{ term: "です" }, " chiude tutta la frase; non sta tra l’aggettivo e il suo nome."]
              pl: [{ term: "です" }, " zamyka całe zdanie; nie stoi między przymiotnikiem a rzeczownikiem."]
              tr: [{ term: "です" }, " cümlenin tamamını kapatır; sıfatla ismin arasına girmez."]
              id: [{ term: "です" }, " menutup seluruh kalimat; tidak berdiri di antara kata sifat dan kata bendanya."]
              vi: [{ term: "です" }, " khép cả câu; nó không đứng giữa tính từ và danh từ của nó."]
            ex: [{ target: [{ kanji: "古", reading: "ふる" }, "い"] }, { kanji: "家", reading: "いえ" }, { target: "です" }, "。"]
            tr: { en: "It is an old house.", uk: "Це старий будинок.", es: "Es una casa vieja.", pt: "É uma casa velha.", fr: "C’est une vieille maison.", de: "Das ist ein altes Haus.", it: "È una casa vecchia.", pl: "To stary dom.", tr: "Bu eski bir ev.", id: "Itu rumah tua.", vi: "Đó là một ngôi nhà cũ." }
          - type: "note"
            level: "A2"
            text:
              en: ["A longer clause before a noun follows the same order. See ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Clauses Before Nouns"], to: ja.linking.noun-modification }, "."]
              uk: ["Довше речення перед іменником дотримується того самого порядку. Див. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": речення перед іменником"], to: ja.linking.noun-modification }, "."]
              es: ["Una oración más larga ante un sustantivo sigue el mismo orden. Véase ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": oraciones antes del sustantivo"], to: ja.linking.noun-modification }, "."]
              pt: ["Uma oração mais longa antes de um substantivo segue a mesma ordem. Veja ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": orações antes do substantivo"], to: ja.linking.noun-modification }, "."]
              fr: ["Une proposition plus longue devant un nom suit le même ordre. Voir ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, " : une proposition devant le nom"], to: ja.linking.noun-modification }, "."]
              de: ["Ein längerer Satz vor einem Nomen folgt derselben Reihenfolge. Siehe ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Sätze vor dem Nomen"], to: ja.linking.noun-modification }, "."]
              it: ["Una frase più lunga davanti a un nome segue lo stesso ordine. Vedi ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": proposizioni prima del nome"], to: ja.linking.noun-modification }, "."]
              pl: ["Dłuższe zdanie przed rzeczownikiem ma ten sam szyk. Zob. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": zdanie przed rzeczownikiem"], to: ja.linking.noun-modification }, "."]
              tr: ["İsmin önündeki daha uzun bir yan cümle aynı sırayı izler. Bkz. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": ismin önündeki cümle"], to: ja.linking.noun-modification }, "."]
              id: ["Klausa yang lebih panjang sebelum kata benda mengikuti urutan yang sama. Lihat ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": klausa sebelum kata benda"], to: ja.linking.noun-modification }, "."]
              vi: ["Mệnh đề dài hơn trước danh từ cũng theo thứ tự ấy. Xem ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": mệnh đề đứng trước danh từ"], to: ja.linking.noun-modification }, "."]
  - title:
      en: "The irregular いい"
      uk: "Неправильне いい"
      es: "El irregular いい"
      pt: "O irregular いい"
      fr: "L’irrégulier いい"
      de: "Das unregelmäßige いい"
      it: "L’irregolare いい"
