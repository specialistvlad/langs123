sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["An ", { term: "い" }, "-adjective ends in ", { term: "い" }, " and takes ", { term: "です" }, " in the polite style."]
              uk: [{ term: "い" }, "-прикметник закінчується на ", { term: "い" }, " і в ввічливому стилі стоїть перед ", { term: "です" }, "."]
              es: ["El adjetivo ", { term: "い" }, " termina en ", { term: "い" }, " y en el estilo cortés lleva ", { term: "です" }, "."]
              pt: ["O adjetivo ", { term: "い" }, " termina em ", { term: "い" }, " e, no estilo polido, leva ", { term: "です" }, "."]
              fr: ["L’adjectif en ", { term: "い" }, " se termine par ", { term: "い" }, " et, au style poli, prend ", { term: "です" }, "."]
              de: ["Das ", { term: "い" }, "-Adjektiv endet auf ", { term: "い" }, " und steht im höflichen Stil mit ", { term: "です" }, "."]
              it: ["L’aggettivo in ", { term: "い" }, " finisce in ", { term: "い" }, " e nello stile cortese prende ", { term: "です" }, "."]
              pl: ["Przymiotnik ", { term: "い" }, " kończy się na ", { term: "い" }, ", a w stylu grzecznościowym występuje z ", { term: "です" }, "."]
              tr: [{ term: "い" }, " sıfatı ", { term: "い" }, " ile biter; nazik üslupta ", { term: "です" }, " alır."]
              id: ["Kata sifat ", { term: "い" }, " berakhir dengan ", { term: "い" }, " dan dalam gaya sopan memakai ", { term: "です" }, "."]
              vi: ["Tính từ ", { term: "い" }, " kết thúc bằng ", { term: "い" }, " và trong văn phong lịch sự đi với ", { term: "です" }, "."]
            ex: ["この", { kanji: "家", reading: "いえ" }, "は", { target: [{ kanji: "大", reading: "おお" }, "きい"] }, "です。"]
            tr: { en: "This house is big.", uk: "Цей будинок великий.", es: "Esta casa es grande.", pt: "Esta casa é grande.", fr: "Cette maison est grande.", de: "Dieses Haus ist groß.", it: "Questa casa è grande.", pl: "Ten dom jest duży.", tr: "Bu ev büyük.", id: "Rumah ini besar.", vi: "Ngôi nhà này lớn." }
          - type: "rule"
            level: "A1"
            text:
              en: ["The adjective changes for the negative and the past; ", { term: "です" }, " stays at the end and keeps the sentence polite."]
              uk: ["Прикметник змінюється в запереченні й минулому часі; ", { term: "です" }, " лишається в кінці й зберігає ввічливість."]
              es: ["El adjetivo cambia en la negativa y el pasado; ", { term: "です" }, " queda al final y mantiene la cortesía."]
              pt: ["O adjetivo muda na negativa e no passado; ", { term: "です" }, " fica no fim e mantém a polidez."]
              fr: ["L’adjectif change à la négation et au passé ; ", { term: "です" }, " reste à la fin et garde la politesse."]
              de: ["Das Adjektiv ändert sich in Verneinung und Vergangenheit; ", { term: "です" }, " bleibt am Ende und hält den Satz höflich."]
              it: ["L’aggettivo cambia nella negazione e nel passato; ", { term: "です" }, " resta in fondo e mantiene la cortesia."]
              pl: ["Przymiotnik zmienia się w przeczeniu i w czasie przeszłym; ", { term: "です" }, " zostaje na końcu i utrzymuje grzeczność."]
              tr: ["Olumsuzda ve geçmişte sıfat değişir; ", { term: "です" }, " sonda kalır ve cümleyi nazik tutar."]
              id: ["Kata sifat berubah pada negatif dan lampau; ", { term: "です" }, " tetap di akhir dan menjaga kesopanan."]
              vi: ["Tính từ biến đổi ở phủ định và quá khứ; ", { term: "です" }, " vẫn ở cuối câu và giữ phép lịch sự."]
            ex: ["きのうは", { kanji: "暑", reading: "あつ" }, { target: "くなかったです" }, "。"]
            tr: { en: "Yesterday was not hot.", uk: "Учора не було спекотно.", es: "Ayer no hizo calor.", pt: "Ontem não fez calor.", fr: "Hier, il ne faisait pas chaud.", de: "Gestern war es nicht heiß.", it: "Ieri non faceva caldo.", pl: "Wczoraj nie było gorąco.", tr: "Dün hava sıcak değildi.", id: "Kemarin tidak panas.", vi: "Hôm qua trời không nóng." }
          - type: "rule"
            level: "A1"
            text:
              en: ["Before a noun, the adjective stands in its plain form, without ", { term: "です" }, "."]
              uk: ["Перед іменником прикметник стоїть у простій формі, без ", { term: "です" }, "."]
              es: ["Ante un sustantivo, el adjetivo va en su forma simple, sin ", { term: "です" }, "."]
              pt: ["Antes de um substantivo, o adjetivo fica na forma simples, sem ", { term: "です" }, "."]
              fr: ["Devant un nom, l’adjectif est à la forme simple, sans ", { term: "です" }, "."]
              de: ["Vor einem Nomen steht das Adjektiv in der einfachen Form, ohne ", { term: "です" }, "."]
              it: ["Davanti a un nome, l’aggettivo sta nella forma semplice, senza ", { term: "です" }, "."]
              pl: ["Przed rzeczownikiem przymiotnik stoi w formie prostej, bez ", { term: "です" }, "."]
              tr: ["İsmin önünde sıfat yalın biçimde durur, ", { term: "です" }, " almaz."]
              id: ["Sebelum kata benda, kata sifat berbentuk biasa, tanpa ", { term: "です" }, "."]
              vi: ["Trước danh từ, tính từ ở thể thường, không có ", { term: "です" }, "."]
            ex: [{ target: [{ kanji: "新", reading: "あたら" }, "しい"] }, { kanji: "本", reading: "ほん" }, "です。"]
            tr: { en: "It is a new book.", uk: "Це нова книга.", es: "Es un libro nuevo.", pt: "É um livro novo.", fr: "C’est un livre neuf.", de: "Das ist ein neues Buch.", it: "È un libro nuovo.", pl: "To nowa książka.", tr: "Bu yeni bir kitap.", id: "Ini buku baru.", vi: "Đây là một cuốn sách mới." }
          - type: "note"
            level: "A1"
            text:
              en: ["Some adjectives end in ", { term: "い" }, " and are ", { term: "な" }, "-adjectives, such as ", { term: "きれい" }, ". See ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, "."]
              uk: ["Деякі прикметники закінчуються на ", { term: "い" }, ", але є ", { term: "な" }, "-прикметниками, як-от ", { term: "きれい" }, ". Див. ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, "."]
              es: ["Algunos adjetivos terminan en ", { term: "い" }, " y son adjetivos ", { term: "な" }, ", como ", { term: "きれい" }, ". Véase ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              pt: ["Alguns adjetivos terminam em ", { term: "い" }, " e são adjetivos ", { term: "な" }, ", como ", { term: "きれい" }, ". Veja ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              fr: ["Certains adjectifs se terminent par ", { term: "い" }, " et sont des adjectifs en ", { term: "な" }, ", comme ", { term: "きれい" }, ". Voir ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, "."]
              de: ["Manche Adjektive enden auf ", { term: "い" }, " und sind ", { term: "な" }, "-Adjektive, etwa ", { term: "きれい" }, ". Siehe ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, "."]
              it: ["Alcuni aggettivi finiscono in ", { term: "い" }, " e sono aggettivi in ", { term: "な" }, ", come ", { term: "きれい" }, ". Vedi ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, "."]
              pl: ["Niektóre przymiotniki kończą się na ", { term: "い" }, ", a są przymiotnikami ", { term: "な" }, ", np. ", { term: "きれい" }, ". Zob. ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, "."]
              tr: ["Bazı sıfatlar ", { term: "い" }, " ile biter ama ", { term: "な" }, " sıfatıdır, örneğin ", { term: "きれい" }, ". Bkz. ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, "."]
              id: ["Beberapa kata sifat berakhir dengan ", { term: "い" }, " tetapi termasuk kata sifat ", { term: "な" }, ", misalnya ", { term: "きれい" }, ". Lihat ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, "."]
              vi: ["Một số tính từ kết thúc bằng ", { term: "い" }, " nhưng là tính từ ", { term: "な" }, ", như ", { term: "きれい" }, ". Xem ", { link: "Tính từ な", to: "ja.adjectives.na-adjectives" }, "."]
