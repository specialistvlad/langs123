              fr: ["Pour le passé, supprimez le ", { term: "い" }, " final et ajoutez ", { term: "かった" }, " ; pour la négation au passé, ", { term: "くなかった" }, "."]
              de: ["Für die Vergangenheit streicht man das ", { term: "い" }, " und setzt ", { term: "かった" }, " an, für die verneinte Vergangenheit ", { term: "くなかった" }, "."]
              it: ["Per il passato, togli la ", { term: "い" }, " finale e aggiungi ", { term: "かった" }, "; per la negazione al passato, ", { term: "くなかった" }, "."]
              pl: ["W czasie przeszłym odrzuć końcowe ", { term: "い" }, " i dodaj ", { term: "かった" }, "; w przeczeniu przeszłym — ", { term: "くなかった" }, "."]
