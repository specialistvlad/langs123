              de: ["Das Adjektiv nimmt vor einem Nomen ", { term: "な" }, " und am Satzende allein ", { term: "です" }, ". Zu ", { term: "の" }, " siehe ", { link: "Die Partikeln と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              it: ["L’aggettivo prende ", { term: "な" }, " davanti a un nome e solo ", { term: "です" }, " a fine frase. Per ", { term: "の" }, ", vedi ", { link: "Le particelle と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              pl: ["Przymiotnik bierze ", { term: "な" }, " przed rzeczownikiem, a na końcu zdania samo ", { term: "です" }, ". O ", { term: "の" }, " zob. ", { link: "Partykuły と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              tr: ["Sıfat, isimden önce ", { term: "な" }, ", cümle sonunda yalnız ", { term: "です" }, " alır. ", { term: "の" }, " için bkz. ", { link: "と, も, の edatları", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              id: ["Kata sifat memakai ", { term: "な" }, " sebelum kata benda dan hanya ", { term: "です" }, " di akhir kalimat. Untuk ", { term: "の" }, ", lihat ", { link: "Partikel と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
