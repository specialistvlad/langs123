              vi: ["Tính từ ", { term: "な" }, " không biến đổi: nó đi với ", { term: "です" }, " như danh từ."]
            ex: ["たなかさんは", { kanji: "元気", reading: "げんき" }, { target: "です" }, "。"]
            tr: { en: "Tanaka-san is well.", uk: "Танака-сан почувається добре.", es: "Tanaka-san está bien.", pt: "O Tanaka-san está bem.", fr: "Tanaka-san va bien.", de: "Tanaka-san geht es gut.", it: "Tanaka-san sta bene.", pl: "Tanaka-san ma się dobrze.", tr: "Tanaka-san iyi.", id: "Tanaka-san sehat.", vi: "Tanaka-san khỏe." }
          - type: "rule"
            level: "A1"
            text:
              en: ["Before a noun, it takes ", { term: "な" }, "."]
              uk: ["Перед іменником він бере ", { term: "な" }, "."]
              es: ["Ante un sustantivo, lleva ", { term: "な" }, "."]
              pt: ["Antes de um substantivo, leva ", { term: "な" }, "."]
              fr: ["Devant un nom, il prend ", { term: "な" }, "."]
              de: ["Vor einem Nomen nimmt es ", { term: "な" }, "."]
              it: ["Davanti a un nome, prende ", { term: "な" }, "."]
              pl: ["Przed rzeczownikiem bierze ", { term: "な" }, "."]
              tr: ["İsmin önünde ", { term: "な" }, " alır."]
              id: ["Sebelum kata benda, ia memakai ", { term: "な" }, "."]
              vi: ["Trước danh từ, nó thêm ", { term: "な" }, "."]
            ex: ["にぎやか", { target: "な" }, { kanji: "町", reading: "まち" }, "です。"]
            tr: { en: "It is a lively town.", uk: "Це жваве місто.", es: "Es una ciudad animada.", pt: "É uma cidade animada.", fr: "C’est une ville animée.", de: "Das ist eine belebte Stadt.", it: "È una città animata.", pl: "To gwarne miasto.", tr: "Burası hareketli bir şehir.", id: "Ini kota yang ramai.", vi: "Đây là một thành phố nhộn nhịp." }
          - type: "rule"
            level: "A1"
            text:
              en: ["Some ", { term: "な" }, "-adjectives end in ", { term: "い" }, ", such as ", { term: "きれい" }, " and ", { term: "きらい" }, "; they follow the same pattern."]
              uk: ["Деякі ", { term: "な" }, "-прикметники закінчуються на ", { term: "い" }, ", як-от ", { term: "きれい" }, " і ", { term: "きらい" }, "; вони мають ту саму модель."]
              es: ["Algunos adjetivos ", { term: "な" }, " terminan en ", { term: "い" }, ", como ", { term: "きれい" }, " y ", { term: "きらい" }, "; siguen el mismo patrón."]
              pt: ["Alguns adjetivos ", { term: "な" }, " terminam em ", { term: "い" }, ", como ", { term: "きれい" }, " e ", { term: "きらい" }, "; seguem o mesmo padrão."]
              fr: ["Certains adjectifs en ", { term: "な" }, " se terminent par ", { term: "い" }, ", comme ", { term: "きれい" }, " et ", { term: "きらい" }, " ; ils suivent le même modèle."]
              de: ["Manche ", { term: "な" }, "-Adjektive enden auf ", { term: "い" }, ", etwa ", { term: "きれい" }, " und ", { term: "きらい" }, "; sie folgen demselben Muster."]
              it: ["Alcuni aggettivi in ", { term: "な" }, " finiscono in ", { term: "い" }, ", come ", { term: "きれい" }, " e ", { term: "きらい" }, "; seguono lo stesso modello."]
              pl: ["Niektóre przymiotniki ", { term: "な" }, " kończą się na ", { term: "い" }, ", np. ", { term: "きれい" }, " i ", { term: "きらい" }, "; mają ten sam wzór."]
              tr: ["Bazı ", { term: "な" }, " sıfatları ", { term: "い" }, " ile biter, örneğin ", { term: "きれい" }, " ve ", { term: "きらい" }, "; aynı kalıbı izler."]
              id: ["Beberapa kata sifat ", { term: "な" }, " berakhir dengan ", { term: "い" }, ", misalnya ", { term: "きれい" }, " dan ", { term: "きらい" }, "; polanya sama."]
              vi: ["Một số tính từ ", { term: "な" }, " kết thúc bằng ", { term: "い" }, ", như ", { term: "きれい" }, " và ", { term: "きらい" }, "; chúng theo cùng mẫu."]
            ex: ["この", { kanji: "部屋", reading: "へや" }, "は", { target: "きれい" }, "です。"]
            tr: { en: "This room is clean.", uk: "Ця кімната чиста.", es: "Esta habitación está limpia.", pt: "Este quarto está limpo.", fr: "Cette pièce est propre.", de: "Dieses Zimmer ist sauber.", it: "Questa stanza è pulita.", pl: "Ten pokój jest czysty.", tr: "Bu oda temiz.", id: "Kamar ini bersih.", vi: "Căn phòng này sạch." }
          - type: "note"
            level: "A1"
            text:
              en: ["Compare the ", { term: "い" }, "-adjectives, which change their own ending: ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, "."]
              uk: ["Порівняйте з ", { term: "い" }, "-прикметниками, які змінюють власне закінчення: ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, "."]
              es: ["Compara con los adjetivos ", { term: "い" }, ", que cambian su propia terminación: ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              pt: ["Compare com os adjetivos ", { term: "い" }, ", que mudam a própria terminação: ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, "."]
              fr: ["Comparez avec les adjectifs en ", { term: "い" }, ", qui changent leur propre terminaison : ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, "."]
              de: ["Vergleiche die ", { term: "い" }, "-Adjektive, die ihre eigene Endung ändern: ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, "."]
              it: ["Confronta con gli aggettivi in ", { term: "い" }, ", che cambiano la propria terminazione: ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, "."]
              pl: ["Porównaj z przymiotnikami ", { term: "い" }, ", które zmieniają własną końcówkę: ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, "."]
              tr: ["Kendi sonunu değiştiren ", { term: "い" }, " sıfatlarıyla karşılaştırın: ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, "."]
              id: ["Bandingkan dengan kata sifat ", { term: "い" }, ", yang mengubah akhirannya sendiri: ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, "."]
              vi: ["So sánh với tính từ ", { term: "い" }, ", vốn tự đổi phần đuôi: ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, "."]
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " and ", { term: "下手" }, " are ", { term: "な" }, "-adjectives. See ", { link: "Likes and Wants: 好き, ほしい", to: ja.adjectives.likes-wants }, "."]
              uk: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " і ", { term: "下手" }, " — це ", { term: "な" }, "-прикметники. Див. ", { link: "Смаки й бажання: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              es: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " y ", { term: "下手" }, " son adjetivos ", { term: "な" }, ". Véase ", { link: "Gustos y deseos: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              pt: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " e ", { term: "下手" }, " são adjetivos ", { term: "な" }, ". Veja ", { link: "Gostos e desejos: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              fr: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " et ", { term: "下手" }, " sont des adjectifs en ", { term: "な" }, ". Voir ", { link: "Goûts et désirs : 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              de: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " und ", { term: "下手" }, " sind ", { term: "な" }, "-Adjektive. Siehe ", { link: "Vorlieben und Wünsche: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              it: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " e ", { term: "下手" }, " sono aggettivi in ", { term: "な" }, ". Vedi ", { link: "Gusti e desideri: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              pl: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " i ", { term: "下手" }, " to przymiotniki ", { term: "な" }, ". Zob. ", { link: "Preferencje i pragnienia: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              tr: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " ve ", { term: "下手" }, " birer ", { term: "な" }, " sıfatıdır. Bkz. ", { link: "Sevmek ve istemek: 好き, ほしい", to: ja.adjectives.likes-wants }, "."]
              id: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, ", dan ", { term: "下手" }, " termasuk kata sifat ", { term: "な" }, ". Lihat ", { link: "Kesukaan dan keinginan: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
              vi: [{ term: "好き" }, ", ", { term: "きらい" }, ", ", { term: "上手" }, " và ", { term: "下手" }, " là tính từ ", { term: "な" }, ". Xem ", { link: "Sở thích và mong muốn: 好き, ほしい", to: "ja.adjectives.likes-wants" }, "."]
