            text:
              en: ["A ", { term: "な" }, "-adjective does not change: it takes ", { term: "です" }, " like a noun."]
              uk: [{ term: "な" }, "-прикметник не змінюється: він бере ", { term: "です" }, ", як іменник."]
              es: ["El adjetivo ", { term: "な" }, " no cambia: lleva ", { term: "です" }, " como un sustantivo."]
              pt: ["O adjetivo ", { term: "な" }, " não muda: leva ", { term: "です" }, " como um substantivo."]
              fr: ["L’adjectif en ", { term: "な" }, " ne change pas : il prend ", { term: "です" }, " comme un nom."]
              de: ["Das ", { term: "な" }, "-Adjektiv verändert sich nicht: Es steht wie ein Nomen mit ", { term: "です" }, "."]
              it: ["L’aggettivo in ", { term: "な" }, " non cambia: prende ", { term: "です" }, " come un nome."]
              pl: ["Przymiotnik ", { term: "な" }, " się nie zmienia: występuje z ", { term: "です" }, " jak rzeczownik."]
              tr: [{ term: "な" }, " sıfatı değişmez: isim gibi ", { term: "です" }, " alır."]
