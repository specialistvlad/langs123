            text:
              en: ["The plain past ", { term: "た" }, "-form changes the same way: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " gives ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Проста минула форма ", { term: "た" }, " змінюється так само: з ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " виходить ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["La forma simple del pasado en ", { term: "た" }, " cambia igual: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " da ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A forma simples do passado em ", { term: "た" }, " muda do mesmo jeito: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " dá ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La forme simple du passé en ", { term: "た" }, " change de la même façon : ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " donne ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Die einfache Vergangenheit auf ", { term: "た" }, " verändert sich genauso: aus ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " wird ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["La forma semplice del passato in ", { term: "た" }, " cambia allo stesso modo: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " diventa ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Prosta forma przeszła na ", { term: "た" }, " zmienia się tak samo: z ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " powstaje ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Yalın geçmiş biçim ", { term: "た" }, " de aynı şekilde değişir: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " biçiminden ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, " olur. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Bentuk lampau biasa ", { term: "た" }, " berubah dengan cara yang sama: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " menjadi ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Lihat ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Thể quá khứ thường ", { term: "た" }, " biến đổi giống vậy: ", { term: [{ kanji: "食", reading: "た" }, "べて"] }, " thành ", { term: [{ kanji: "食", reading: "た" }, "べた"] }, ". Xem ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
