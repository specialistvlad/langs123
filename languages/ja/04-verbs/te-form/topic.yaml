summary:
  lead:
    en: ["The ", { term: "て" }, "-form links verbs in a sequence and is the base of requests and of ", { term: "ています" }, "; each verb ending has its own change."]
    uk: [{ term: "て" }, "-форма поєднує дієслова в ряд і є основою прохань та ", { term: "ています" }, "; кожне закінчення дієслова змінюється по-своєму."]
    es: ["La forma ", { term: "て" }, " une verbos en una serie y es la base de las peticiones y de ", { term: "ています" }, "; cada final de verbo tiene su propio cambio."]
    pt: ["A forma ", { term: "て" }, " liga verbos em sequência e é a base dos pedidos e de ", { term: "ています" }, "; cada final de verbo tem a sua própria mudança."]
    fr: ["La forme en ", { term: "て" }, " relie des verbes en série et sert de base aux demandes et à ", { term: "ています" }, " ; chaque terminaison de verbe a son propre changement."]
    de: ["Die ", { term: "て" }, "-Form verbindet Verben zu einer Reihe und ist die Grundlage von Bitten und ", { term: "ています" }, "; jede Verbendung ändert sich auf eigene Weise."]
    it: ["La forma in ", { term: "て" }, " unisce i verbi in una serie ed è la base delle richieste e di ", { term: "ています" }, "; ogni terminazione del verbo ha il suo cambiamento."]
    pl: ["Forma ", { term: "て" }, " łączy czasowniki w szereg i jest podstawą próśb oraz ", { term: "ています" }, "; każda końcówka czasownika zmienia się po swojemu."]
    tr: [{ term: "て" }, " biçimi fiilleri art arda bağlar, rica cümlelerinin ve ", { term: "ています" }, " yapısının temelidir; her fiil sonu kendine özgü biçimde değişir."]
    id: ["Bentuk ", { term: "て" }, " menghubungkan kata kerja secara berurutan dan menjadi dasar permintaan serta ", { term: "ています" }, "; setiap akhiran kata kerja berubah dengan caranya sendiri."]
    vi: ["Thể ", { term: "て" }, " nối các động từ thành chuỗi và là nền của lời nhờ vả cũng như ", { term: "ています" }, "; mỗi đuôi động từ biến đổi theo cách riêng."]
  rule:
    en: ["Only the last verb carries the tense; the others take the ", { term: "て" }, "-form:"]
    uk: ["Час виражає лише останнє дієслово; решта стоїть у ", { term: "て" }, "-формі:"]
    es: ["Solo el último verbo lleva el tiempo; los demás van en forma ", { term: "て" }, ":"]
    pt: ["Só o último verbo leva o tempo; os outros ficam na forma ", { term: "て" }, ":"]
    fr: ["Seul le dernier verbe porte le temps ; les autres sont à la forme en ", { term: "て" }, " :"]
    de: ["Nur das letzte Verb trägt die Zeit; die anderen stehen in der ", { term: "て" }, "-Form:"]
    it: ["Solo l’ultimo verbo porta il tempo; gli altri stanno nella forma in ", { term: "て" }, ":"]
    pl: ["Tylko ostatni czasownik wyraża czas; pozostałe stoją w formie ", { term: "て" }, ":"]
    tr: ["Zamanı yalnızca son fiil taşır; diğerleri ", { term: "て" }, " biçiminde durur:"]
    id: ["Hanya kata kerja terakhir yang membawa waktu; yang lain memakai bentuk ", { term: "て" }, ":"]
    vi: ["Chỉ động từ cuối mang thì; các động từ còn lại ở thể ", { term: "て" }, ":"]
  ex: [{ target: [{ kanji: "食", reading: "た" }, "べて"] }, "、", { kanji: "行", reading: "い" }, "きます。"]
