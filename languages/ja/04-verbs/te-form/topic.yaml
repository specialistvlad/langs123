              it: ["Gli aggettivi si collegano a modo loro: ", { term: "くて" }, " dopo un aggettivo in い, ", { term: "で" }, " dopo un aggettivo in な. Vedi ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, "."]
