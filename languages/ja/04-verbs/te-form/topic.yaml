sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["Only the last verb of a sequence shows tense and politeness; the others take the ", { term: "て" }, "-form."]
              uk: ["Час і ввічливість виражає лише останнє дієслово в ряду; решта стоїть у ", { term: "て" }, "-формі."]
              es: ["Solo el último verbo de la serie muestra el tiempo y la cortesía; los demás van en forma ", { term: "て" }, "."]
              pt: ["Só o último verbo da sequência mostra o tempo e a polidez; os outros ficam na forma ", { term: "て" }, "."]
              fr: ["Seul le dernier verbe de la série porte le temps et la politesse ; les autres sont à la forme en ", { term: "て" }, "."]
              de: ["Nur das letzte Verb der Reihe zeigt Zeit und Höflichkeit; die anderen stehen in der ", { term: "て" }, "-Form."]
              it: ["Solo l’ultimo verbo della serie indica tempo e cortesia; gli altri stanno nella forma in ", { term: "て" }, "."]
              pl: ["Tylko ostatni czasownik w szeregu wyraża czas i uprzejmość; pozostałe stoją w formie ", { term: "て" }, "."]
              tr: ["Dizideki yalnızca son fiil zamanı ve nezaketi gösterir; diğerleri ", { term: "て" }, " biçiminde durur."]
              id: ["Hanya kata kerja terakhir dalam rangkaian yang menunjukkan waktu dan kesopanan; yang lain memakai bentuk ", { term: "て" }, "."]
              vi: ["Chỉ động từ cuối cùng trong chuỗi thể hiện thì và mức lịch sự; các động từ còn lại ở thể ", { term: "て" }, "."]
            ex: ["きのう、", { kanji: "朝", reading: "あさ" }, "ごはんを", { target: [{ kanji: "食", reading: "た" }, "べて"] }, "、", { kanji: "学校", reading: "がっこう" }, "へ", { kanji: "行", reading: "い" }, "きました。"]
            tr: { en: "Yesterday I ate breakfast and went to school.", uk: "Учора я поснідав і пішов до школи.", es: "Ayer desayuné y fui a la escuela.", pt: "Ontem tomei café da manhã e fui para a escola.", fr: "Hier, j’ai pris mon petit-déjeuner et je suis allé à l’école.", de: "Gestern habe ich gefrühstückt und bin zur Schule gegangen.", it: "Ieri ho fatto colazione e sono andato a scuola.", pl: "Wczoraj zjadłem śniadanie i poszedłem do szkoły.", tr: "Dün kahvaltı yapıp okula gittim.", id: "Kemarin saya sarapan lalu pergi ke sekolah.", vi: "Hôm qua tôi ăn sáng rồi đi học." }
          - type: "rule"
            level: "A1"
            text:
              en: ["The ", { term: "て" }, "-form has one shape for every person, number and style of speech."]
              uk: [{ term: "て" }, "-форма має однакову будову для всіх осіб, чисел і стилів мовлення."]
              es: ["La forma ", { term: "て" }, " es la misma para todas las personas, números y estilos de habla."]
              pt: ["A forma ", { term: "て" }, " é a mesma para todas as pessoas, números e estilos de fala."]
              fr: ["La forme en ", { term: "て" }, " est la même pour toutes les personnes, tous les nombres et tous les styles de langue."]
              de: ["Die ", { term: "て" }, "-Form ist für alle Personen, Zahlen und Sprechstile gleich."]
              it: ["La forma in ", { term: "て" }, " è la stessa per tutte le persone, i numeri e gli stili di discorso."]
              pl: ["Forma ", { term: "て" }, " jest taka sama dla wszystkich osób, liczb i stylów mowy."]
              tr: [{ term: "て" }, " biçimi tüm kişiler, sayılar ve konuşma üslupları için aynıdır."]
              id: ["Bentuk ", { term: "て" }, " sama untuk semua orang, jumlah, dan gaya bicara."]
              vi: ["Thể ", { term: "て" }, " giống nhau cho mọi ngôi, số và phong cách nói."]
          - type: "note"
            level: "A1"
            text:
              en: ["The ", { term: "て" }, "-form is built from the dictionary form; the group of the verb decides the change. See ", { link: "Verb Groups", to: ja.verbs.verb-groups }, "."]
              uk: [{ term: "て" }, "-форму утворюють від словникової форми; зміну визначає група дієслова. Див. ", { link: "Групи дієслів", to: "ja.verbs.verb-groups" }, "."]
              es: ["La forma ", { term: "て" }, " se construye a partir de la forma de diccionario; el grupo del verbo decide el cambio. Véase ", { link: "Los grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              pt: ["A forma ", { term: "て" }, " se constrói a partir da forma de dicionário; o grupo do verbo decide a mudança. Veja ", { link: "Os grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              fr: ["La forme en ", { term: "て" }, " se construit à partir de la forme du dictionnaire ; le groupe du verbe décide du changement. Voir ", { link: "Les groupes de verbes", to: "ja.verbs.verb-groups" }, "."]
              de: ["Die ", { term: "て" }, "-Form wird aus der Grundform gebildet; die Gruppe des Verbs entscheidet über die Änderung. Siehe ", { link: "Die Verbgruppen", to: "ja.verbs.verb-groups" }, "."]
              it: ["La forma in ", { term: "て" }, " si costruisce dalla forma del dizionario; il gruppo del verbo decide il cambiamento. Vedi ", { link: "I gruppi dei verbi", to: "ja.verbs.verb-groups" }, "."]
              pl: ["Formę ", { term: "て" }, " tworzy się od formy podstawowej; zmianę wyznacza grupa czasownika. Zob. ", { link: "Grupy czasowników", to: "ja.verbs.verb-groups" }, "."]
              tr: [{ term: "て" }, " biçimi sözlük biçiminden kurulur; değişimi fiilin grubu belirler. Bkz. ", { link: "Fiil grupları", to: "ja.verbs.verb-groups" }, "."]
              id: ["Bentuk ", { term: "て" }, " dibuat dari bentuk kamus; kelompok kata kerja menentukan perubahannya. Lihat ", { link: "Kelompok kata kerja", to: "ja.verbs.verb-groups" }, "."]
              vi: ["Thể ", { term: "て" }, " làm từ thể từ điển; nhóm của động từ quyết định sự biến đổi. Xem ", { link: "Nhóm động từ", to: ja.verbs.verb-groups }, "."]
          - type: "note"
            level: "A1"
            text:
              en: ["The ", { term: "て" }, "-form is the base of requests, see ", { link: "Requests: てください", to: ja.verbs.te-kudasai }, ", and of actions in progress and states, see ", { link: "ています: Actions and States", to: ja.verbs.te-iru }, "."]
              uk: [{ term: "て" }, "-форма — основа прохань, див. ", { link: "Прохання: てください", to: ja.verbs.te-kudasai }, ", а також дій у процесі й станів, див. ", { link: "ています: дії та стани", to: ja.verbs.te-iru }, "."]
              es: ["La forma ", { term: "て" }, " es la base de las peticiones, véase ", { link: "Peticiones: てください", to: ja.verbs.te-kudasai }, ", y de las acciones en curso y los estados, véase ", { link: "ています: acciones y estados", to: ja.verbs.te-iru }, "."]
              pt: ["A forma ", { term: "て" }, " é a base dos pedidos, veja ", { link: "Pedidos: てください", to: ja.verbs.te-kudasai }, ", e das ações em andamento e dos estados, veja ", { link: "ています: ações e estados", to: ja.verbs.te-iru }, "."]
              fr: ["La forme en ", { term: "て" }, " sert de base aux demandes, voir ", { link: "Demandes : てください", to: ja.verbs.te-kudasai }, ", et aux actions en cours et aux états, voir ", { link: "ています : actions et états", to: ja.verbs.te-iru }, "."]
              de: ["Die ", { term: "て" }, "-Form ist die Grundlage von Bitten, siehe ", { link: "Bitten: てください", to: ja.verbs.te-kudasai }, ", sowie von laufenden Handlungen und Zuständen, siehe ", { link: "ています: Handlungen und Zustände", to: ja.verbs.te-iru }, "."]
              it: ["La forma in ", { term: "て" }, " è la base delle richieste, vedi ", { link: "Richieste: てください", to: ja.verbs.te-kudasai }, ", e delle azioni in corso e degli stati, vedi ", { link: "ています: azioni e stati", to: ja.verbs.te-iru }, "."]
              pl: ["Forma ", { term: "て" }, " jest podstawą próśb, zob. ", { link: "Prośby: てください", to: ja.verbs.te-kudasai }, ", oraz czynności trwających i stanów, zob. ", { link: "ています: czynności i stany", to: ja.verbs.te-iru }, "."]
              tr: [{ term: "て" }, " biçimi rica cümlelerinin, bkz. ", { link: "Rica: てください", to: ja.verbs.te-kudasai }, ", ile süren eylemlerin ve durumların, bkz. ", { link: "ています: eylemler ve durumlar", to: ja.verbs.te-iru }, ", temelidir."]
              id: ["Bentuk ", { term: "て" }, " menjadi dasar permintaan, lihat ", { link: "Permintaan: てください", to: ja.verbs.te-kudasai }, ", serta tindakan yang sedang berlangsung dan keadaan, lihat ", { link: "ています: tindakan dan keadaan", to: ja.verbs.te-iru }, "."]
              vi: ["Thể ", { term: "て" }, " là nền của lời nhờ vả, xem ", { link: "Lời nhờ: てください", to: ja.verbs.te-kudasai }, ", cũng như của hành động đang diễn ra và trạng thái, xem ", { link: "ています: hành động và trạng thái", to: ja.verbs.te-iru }, "."]
          - type: "note"
            level: "A2"
            text:
              en: ["More patterns with the ", { term: "て" }, "-form: permission and prohibition, see ", { link: "Permission and Obligation: May, Must", to: ja.verbs.permission-obligation }, "."]
              uk: ["Ще моделі з ", { term: "て" }, "-формою: дозвіл і заборона, див. ", { link: "Дозвіл і обов’язок: можна, треба", to: ja.verbs.permission-obligation }, "."]
              es: ["Más estructuras con la forma ", { term: "て" }, ": permiso y prohibición, véase ", { link: "Permiso y obligación: poder, deber", to: ja.verbs.permission-obligation }, "."]
              pt: ["Mais estruturas com a forma ", { term: "て" }, ": permissão e proibição, veja ", { link: "Permissão e obrigação: poder, dever", to: ja.verbs.permission-obligation }, "."]
              fr: ["D’autres structures avec la forme en ", { term: "て" }, " : la permission et l’interdiction, voir ", { link: "Permission et obligation : pouvoir, devoir", to: ja.verbs.permission-obligation }, "."]
              de: ["Weitere Muster mit der ", { term: "て" }, "-Form: Erlaubnis und Verbot, siehe ", { link: "Erlaubnis und Verpflichtung: dürfen, müssen", to: ja.verbs.permission-obligation }, "."]
              it: ["Altri modelli con la forma in ", { term: "て" }, ": permesso e divieto, vedi ", { link: "Permesso e obbligo: potere, dovere", to: ja.verbs.permission-obligation }, "."]
              pl: ["Dalsze wzory z formą ", { term: "て" }, ": pozwolenie i zakaz, zob. ", { link: "Pozwolenie i obowiązek: wolno, trzeba", to: ja.verbs.permission-obligation }, "."]
              tr: [{ term: "て" }, " biçimiyle başka kalıplar: izin ve yasak, bkz. ", { link: "İzin ve zorunluluk: -ebilir, -meli", to: ja.verbs.permission-obligation }, "."]
              id: ["Pola lain dengan bentuk ", { term: "て" }, ": izin dan larangan, lihat ", { link: "Izin dan kewajiban: boleh, harus", to: ja.verbs.permission-obligation }, "."]
              vi: ["Các mẫu khác với thể ", { term: "て" }, ": cho phép và cấm, xem ", { link: "Cho phép và bắt buộc: được phép, phải", to: ja.verbs.permission-obligation }, "."]
