              tr: ["Sıfatlar kendi yöntemleriyle bağlanır: い sıfatından sonra ", { term: "くて" }, ", な sıfatından sonra ", { term: "で" }, ". Bkz. ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, " ve ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, "."]
