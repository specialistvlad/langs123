              de: ["Frage mit ", { term: "たことがありますか" }, " und nenne die Einzelheiten mit ", { term: "ました" }, "."]
              it: ["Chiedi con ", { term: "たことがありますか" }, ", poi dai i dettagli con ", { term: "ました" }, "."]
              pl: ["Pytaj z ", { term: "たことがありますか" }, ", a szczegóły podawaj z ", { term: "ました" }, "."]
              tr: [{ term: "たことがありますか" }, " ile sor, ayrıntıları ", { term: "ました" }, " ile ver."]
              id: ["Tanyakan dengan ", { term: "たことがありますか" }, ", lalu beri rincian dengan ", { term: "ました" }, "."]
              vi: ["Hỏi bằng ", { term: "たことがありますか" }, ", rồi nêu chi tiết bằng ", { term: "ました" }, "."]
            ex: { exchange: [[{ kanji: "京都", reading: "きょうと" }, "へ", { kanji: "行", reading: "い" }, "ったことがありますか。"], ["はい、", { kanji: "去年", reading: "きょねん" }, { kanji: "行", reading: "い" }, "き", { target: "ました" }, "。"]] }
