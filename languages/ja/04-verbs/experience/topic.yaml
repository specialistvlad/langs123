    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "たことがあります" }, " tells that an experience exists at some time up to now; it names no time."]
              uk: [{ term: "たことがあります" }, " каже, що досвід є, хоч коли до цього моменту; час не називається."]
              es: [{ term: "たことがあります" }, " dice que existe una experiencia en algún momento hasta ahora; no nombra ningún momento."]
              pt: [{ term: "たことがあります" }, " diz que existe uma experiência em algum momento até agora; não nomeia nenhum momento."]
              fr: [{ term: "たことがあります" }, " dit qu’une expérience existe à un moment quelconque jusqu’à maintenant ; il ne nomme aucun moment."]
              de: [{ term: "たことがあります" }, " sagt, dass es irgendwann bis jetzt eine Erfahrung gibt; einen Zeitpunkt nennt es nicht."]
              it: [{ term: "たことがあります" }, " dice che esiste un’esperienza in un momento qualsiasi fino a ora; non nomina alcun momento."]
              pl: [{ term: "たことがあります" }, " mówi, że doświadczenie istnieje w jakimś momencie do tej pory; nie podaje czasu."]
              tr: [{ term: "たことがあります" }, " şimdiye kadar bir zamanda yaşanmış bir deneyimin olduğunu söyler; zaman belirtmez."]
              id: [{ term: "たことがあります" }, " menyatakan adanya pengalaman pada suatu waktu hingga sekarang; waktunya tidak disebut."]
              vi: [{ term: "たことがあります" }, " cho biết có một kinh nghiệm vào lúc nào đó cho đến nay; không nêu thời điểm."]
            ex: [{ kanji: "日本", reading: "にほん" }, "へ", { kanji: "行", reading: "い" }, "っ", { target: "たことがあります" }, "。"]
            tr: { en: "I have been to Japan.", uk: "Я був у Японії.", es: "He estado en Japón.", pt: "Já fui ao Japão.", fr: "Je suis déjà allé au Japon.", de: "Ich war schon einmal in Japan.", it: "Sono già stato in Giappone.", pl: "Byłem już w Japonii.", tr: "Japonya'ya daha önce gittim.", id: "Saya pernah pergi ke Jepang.", vi: "Tôi đã từng đến Nhật Bản." }
          - type: "note"
