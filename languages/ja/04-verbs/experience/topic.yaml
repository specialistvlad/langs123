        items:
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "たことがあります" }, " tells that the experience exists; ", { term: "ました" }, " tells what happened, usually at a named time."]
              uk: [{ term: "たことがあります" }, " каже, що досвід є; ", { term: "ました" }, " каже, що сталося, зазвичай у названий момент."]
              es: [{ term: "たことがあります" }, " dice que la experiencia existe; ", { term: "ました" }, " dice lo que pasó, normalmente en un momento nombrado."]
              pt: [{ term: "たことがあります" }, " diz que a experiência existe; ", { term: "ました" }, " diz o que aconteceu, em geral num momento nomeado."]
              fr: [{ term: "たことがあります" }, " dit que l’expérience existe ; ", { term: "ました" }, " dit ce qui s’est passé, en général à un moment nommé."]
              de: [{ term: "たことがあります" }, " sagt, dass die Erfahrung besteht; ", { term: "ました" }, " sagt, was geschah, meist zu einem genannten Zeitpunkt."]
              it: [{ term: "たことがあります" }, " dice che l’esperienza esiste; ", { term: "ました" }, " dice che cosa è successo, di solito in un momento nominato."]
              pl: [{ term: "たことがあります" }, " mówi, że doświadczenie istnieje; ", { term: "ました" }, " mówi, co się stało, zwykle w podanym momencie."]
              tr: [{ term: "たことがあります" }, " deneyimin var olduğunu söyler; ", { term: "ました" }, " ne olduğunu, çoğu zaman belirtilen bir zamanda, söyler."]
              id: [{ term: "たことがあります" }, " menyatakan adanya pengalaman; ", { term: "ました" }, " menyatakan apa yang terjadi, biasanya pada waktu yang disebut."]
              vi: [{ term: "たことがあります" }, " cho biết có kinh nghiệm; ", { term: "ました" }, " cho biết điều đã xảy ra, thường vào thời điểm được nêu."]
