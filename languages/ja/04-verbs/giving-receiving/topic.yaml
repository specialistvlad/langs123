    pl: ["Rzecz stoi z ", { term: "を" }, ", a druga osoba — z ", { term: "に" }, ":"]
    tr: ["Nesne ", { term: "を" }, ", diğer kişi ", { term: "に" }, " alır:"]
    id: ["Benda diikuti ", { term: "を" }, ", dan orang lainnya diikuti ", { term: "に" }, ":"]
    vi: ["Vật đi với ", { term: "を" }, ", còn người kia đi với ", { term: "に" }, ":"]
