    it: [{ term: "あげます" }, " significa «dare a un altro», ", { term: "くれます" }, " «darmi» e ", { term: "もらいます" }, " «ricevere»."]
    pl: [{ term: "あげます" }, " znaczy „dać komuś innemu”, ", { term: "くれます" }, " „dać mi”, a ", { term: "もらいます" }, " „dostać”."]
    tr: [{ term: "あげます" }, " “başkasına vermek”, ", { term: "くれます" }, " “bana vermek”, ", { term: "もらいます" }, " “almak” demektir."]
    id: [{ term: "あげます" }, " berarti “memberi kepada orang lain”, ", { term: "くれます" }, " “memberi kepada saya”, dan ", { term: "もらいます" }, " “menerima”."]
    vi: [{ term: "あげます" }, " nghĩa là “cho người khác”, ", { term: "くれます" }, " “cho tôi” và ", { term: "もらいます" }, " “nhận”."]
