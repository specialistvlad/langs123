      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ませんか" }, " is the polite negative ", { term: "ません" }, " plus the question ", { term: "か" }, " (", { link: "Questions", to: "ja.sentence-basics.questions" }, "); asked as an invitation, it is softer than ", { term: "ますか" }, "."]
              uk: [{ term: "ませんか" }, " — це ввічливе заперечення ", { term: "ません" }, " плюс питальне ", { term: "か" }, " (", { link: "Питання", to: "ja.sentence-basics.questions" }, "); як запрошення воно м’якше за ", { term: "ますか" }, "."]
              es: [{ term: "ませんか" }, " es la negativa cortés ", { term: "ません" }, " más la pregunta ", { term: "か" }, " (", { link: "Las preguntas", to: "ja.sentence-basics.questions" }, "); como invitación es más suave que ", { term: "ますか" }, "."]
              pt: [{ term: "ませんか" }, " é a negativa polida ", { term: "ません" }, " mais a pergunta ", { term: "か" }, " (", { link: "As perguntas", to: "ja.sentence-basics.questions" }, "); como convite, é mais suave que ", { term: "ますか" }, "."]
              fr: [{ term: "ませんか" }, " est la négation polie ", { term: "ません" }, " plus la question ", { term: "か" }, " (", { link: "Les questions", to: "ja.sentence-basics.questions" }, ") ; comme invitation, elle est plus douce que ", { term: "ますか" }, "."]
              de: [{ term: "ませんか" }, " ist die höfliche Verneinung ", { term: "ません" }, " plus die Frage ", { term: "か" }, " (", { link: "Fragen", to: "ja.sentence-basics.questions" }, "); als Einladung klingt es weicher als ", { term: "ますか" }, "."]
              it: [{ term: "ませんか" }, " è la negazione cortese ", { term: "ません" }, " più la domanda ", { term: "か" }, " (", { link: "Le domande", to: "ja.sentence-basics.questions" }, "); come invito è più morbido di ", { term: "ますか" }, "."]
              pl: [{ term: "ませんか" }, " to grzeczne przeczenie ", { term: "ません" }, " z pytajnym ", { term: "か" }, " (", { link: "Pytania", to: "ja.sentence-basics.questions" }, "); jako zaproszenie brzmi łagodniej niż ", { term: "ますか" }, "."]
              tr: [{ term: "ませんか" }, ", nazik olumsuz ", { term: "ません" }, " ile soru ", { term: "か" }, " (", { link: "Soru cümleleri", to: "ja.sentence-basics.questions" }, ") birleşimidir; davet olarak ", { term: "ますか" }, " biçiminden daha yumuşaktır."]
              id: [{ term: "ませんか" }, " adalah negatif sopan ", { term: "ません" }, " ditambah pertanyaan ", { term: "か" }, " (", { link: "Kalimat tanya", to: "ja.sentence-basics.questions" }, "); sebagai ajakan, bentuk ini lebih lembut daripada ", { term: "ますか" }, "."]
              vi: [{ term: "ませんか" }, " là phủ định lịch sự ", { term: "ません" }, " cộng với ", { term: "か" }, " hỏi (", { link: "Câu hỏi", to: "ja.sentence-basics.questions" }, "); làm lời mời, nó nhẹ nhàng hơn ", { term: "ますか" }, "."]
            ex: ["えいがを", { kanji: "見", reading: "み" }, { target: "ませんか" }, "。"]
            tr: { en: "Would you like to watch a film?", uk: "Не хочете подивитися фільм?", es: "¿Quiere ver una película?", pt: "Quer ver um filme?", fr: "Voulez-vous voir un film ?", de: "Möchten Sie einen Film sehen?", it: "Vuole vedere un film?", pl: "Czy chciałby Pan(i) obejrzeć film?", tr: "Film izlemek ister misiniz?", id: "Maukah Anda menonton film?", vi: "Bạn có muốn xem phim không?" }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ましょうか" }, " with a question word asks for a shared decision."]
              uk: [{ term: "ましょうか" }, " із питальним словом просить спільного рішення."]
              es: [{ term: "ましょうか" }, " con una palabra interrogativa pide una decisión compartida."]
              pt: [{ term: "ましょうか" }, " com uma palavra interrogativa pede uma decisão em conjunto."]
              fr: [{ term: "ましょうか" }, " avec un mot interrogatif demande une décision commune."]
              de: [{ term: "ましょうか" }, " mit einem Fragewort fragt nach einer gemeinsamen Entscheidung."]
              it: [{ term: "ましょうか" }, " con una parola interrogativa chiede una decisione comune."]
              pl: [{ term: "ましょうか" }, " z zaimkiem pytajnym prosi o wspólną decyzję."]
              tr: [{ term: "ましょうか" }, " soru sözcüğüyle birlikte ortak bir karar ister."]
              id: [{ term: "ましょうか" }, " dengan kata tanya meminta keputusan bersama."]
              vi: [{ term: "ましょうか" }, " với từ để hỏi nhờ cùng quyết định."]
            ex: [{ kanji: "何", reading: "なに" }, "を", { kanji: "食", reading: "た" }, "べ", { target: "ましょうか" }, "。"]
