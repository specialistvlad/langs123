              pt: [{ term: "ませんか" }, ": pergunta se o outro quer; a opção polida com quem não se conhece bem."]
              fr: [{ term: "ませんか" }, " : demande si l’autre le souhaite ; le choix poli avec quelqu’un qu’on connaît peu."]
              de: [{ term: "ませんか" }, ": fragt, ob der andere möchte; die höfliche Wahl bei wenig bekannten Personen."]
              it: [{ term: "ませんか" }, ": chiede se l’altro vuole; la scelta cortese con chi si conosce poco."]
              pl: [{ term: "ませんか" }, ": pyta, czy rozmówca chce; grzeczny wybór wobec osób słabo znanych."]
