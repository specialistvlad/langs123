            tr: { en: "Would you like to go together? — Sounds good. Let’s go.", uk: "Підемо разом? — Чудова ідея. Ходімо.", es: "¿Vamos juntos? — Qué buena idea. Vamos.", pt: "Vamos juntos? — Boa ideia. Vamos.", fr: "On y va ensemble ? — Bonne idée. Allons-y.", de: "Gehen wir zusammen? — Gute Idee. Gehen wir.", it: "Andiamo insieme? — Bella idea. Andiamo.", pl: "Pójdziemy razem? — Dobry pomysł. Chodźmy.", tr: "Birlikte gidelim mi? — Güzel fikir. Gidelim.", id: "Mau pergi bersama? — Ide bagus. Mari pergi.", vi: "Mình đi cùng nhau nhé? — Hay đấy. Đi thôi." }
