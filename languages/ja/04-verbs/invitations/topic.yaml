              es: ["La terminación va tras la raíz, la forma ", { term: "ます" }, " sin ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". El grupo del verbo no cambia nada (", { link: "Los grupos de verbos", to: "ja.verbs.verb-groups" }, ")."]
              pt: ["A terminação vem depois do radical, a forma ", { term: "ます" }, " sem ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". O grupo do verbo não muda nada (", { link: "Os grupos de verbos", to: "ja.verbs.verb-groups" }, ")."]
              fr: ["La terminaison suit le radical, la forme en ", { term: "ます" }, " sans ", { term: "ます" }, " : ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Le groupe du verbe n’y change rien (", { link: "Les groupes de verbes", to: "ja.verbs.verb-groups" }, ")."]
              de: ["Die Endung folgt dem Stamm, der ", { term: "ます" }, "-Form ohne ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Die Verbgruppe spielt keine Rolle (", { link: "Die Verbgruppen", to: "ja.verbs.verb-groups" }, ")."]
              it: ["La desinenza segue la radice, la forma in ", { term: "ます" }, " senza ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Il gruppo del verbo non cambia nulla (", { link: "I gruppi dei verbi", to: "ja.verbs.verb-groups" }, ")."]
              pl: ["Końcówka następuje po temacie, czyli formie forma ", { term: "ます" }, " bez ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Grupa czasownika nie ma znaczenia (", { link: "Grupy czasowników", to: "ja.verbs.verb-groups" }, ")."]
              tr: ["Ek, ", { term: "ます" }, " atılmış ", { term: "ます" }, " biçimi kökünün ardından gelir: ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Fiil grubu fark etmez (", { link: "Fiil grupları", to: "ja.verbs.verb-groups" }, ")."]
              id: ["Akhiran mengikuti bentuk dasar, yaitu bentuk ", { term: "ます" }, " tanpa ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Golongan kata kerja tidak berpengaruh (", { link: "Kelompok kata kerja", to: ja.verbs.verb-groups }, ")."]
              vi: ["Đuôi đi sau thân động từ, tức là thể ", { term: "ます" }, " bỏ ", { term: "ます" }, ": ", { term: [{ kanji: "飲", reading: "の" }, "み"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べ"] }, ". Nhóm động từ không ảnh hưởng (", { link: "Nhóm động từ", to: ja.verbs.verb-groups }, ")."]
            ex: { examples: [[{ kanji: "飲", reading: "の" }, "み", { target: "ましょう" }, "。"], [{ kanji: "食", reading: "た" }, "べ", { target: "ましょう" }, "。"]] }
            tr: { en: { examples: ["Let’s have a drink.", "Let’s eat."] }, uk: { examples: ["Вип’ємо.", "Поїмо."] }, es: { examples: ["Bebamos algo.", "Comamos."] }, pt: { examples: ["Vamos beber algo.", "Vamos comer."] }, fr: { examples: ["Buvons quelque chose.", "Mangeons."] }, de: { examples: ["Trinken wir etwas.", "Essen wir."] }, it: { examples: ["Beviamo qualcosa.", "Mangiamo."] }, pl: { examples: ["Napijmy się czegoś.", "Zjedzmy coś."] }, tr: { examples: ["Hadi bir şeyler içelim.", "Hadi yemek yiyelim."] }, id: { examples: ["Mari minum.", "Mari makan."] }, vi: { examples: ["Mình uống gì đó nhé.", "Mình ăn nhé."] } }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "いっしょに" }, " (“together”) stands before the verb and makes the invitation clear."]
              uk: [{ term: "いっしょに" }, " («разом») стоїть перед дієсловом і робить запрошення очевидним."]
              es: [{ term: "いっしょに" }, " («juntos») va antes del verbo y deja clara la invitación."]
              pt: [{ term: "いっしょに" }, " («juntos») vai antes do verbo e deixa o convite claro."]
              fr: [{ term: "いっしょに" }, " (« ensemble ») se place avant le verbe et rend l’invitation claire."]
              de: [{ term: "いっしょに" }, " („zusammen“) steht vor dem Verb und macht die Einladung deutlich."]
              it: [{ term: "いっしょに" }, " («insieme») sta prima del verbo e rende chiaro l’invito."]
              pl: [{ term: "いっしょに" }, " („razem”) stoi przed czasownikiem i uwyraźnia zaproszenie."]
              tr: [{ term: "いっしょに" }, " (“birlikte”) fiilden önce gelir ve daveti netleştirir."]
              id: [{ term: "いっしょに" }, " (“bersama”) berada sebelum kata kerja dan memperjelas ajakan."]
              vi: [{ term: "いっしょに" }, " (“cùng nhau”) đứng trước động từ và làm rõ lời mời."]
            ex: ["いっしょに", { kanji: "行", reading: "い" }, "き", { target: "ましょう" }, "。"]
            tr: { en: "Let’s go together.", uk: "Підемо разом.", es: "Vayamos juntos.", pt: "Vamos juntos.", fr: "Allons-y ensemble.", de: "Gehen wir zusammen.", it: "Andiamo insieme.", pl: "Chodźmy razem.", tr: "Hep birlikte gidelim.", id: "Mari pergi bersama.", vi: "Mình cùng đi nhé." }
          - type: "rule"
            level: "A1"
            text:
              en: ["The endings carry no tense; a time word says when: ", { term: "あした" }, " (“tomorrow”), ", { term: "こんど" }, " (“next time”)."]
              uk: ["Закінчення не мають часу; час називає окреме слово: ", { term: "あした" }, " («завтра»), ", { term: "こんど" }, " («наступного разу»)."]
              es: ["Las terminaciones no marcan tiempo; lo indica una palabra de tiempo: ", { term: "あした" }, " («mañana»), ", { term: "こんど" }, " («la próxima vez»)."]
              pt: ["As terminações não marcam tempo; uma palavra de tempo o indica: ", { term: "あした" }, " («amanhã»), ", { term: "こんど" }, " («da próxima vez»)."]
              fr: ["Les terminaisons n’expriment pas le temps ; un mot de temps le dit : ", { term: "あした" }, " (« demain »), ", { term: "こんど" }, " (« la prochaine fois »)."]
              de: ["Die Endungen tragen keine Zeit; ein Zeitwort sagt, wann: ", { term: "あした" }, " („morgen“), ", { term: "こんど" }, " („nächstes Mal“)."]
              it: ["Le desinenze non indicano il tempo; lo dice una parola di tempo: ", { term: "あした" }, " («domani»), ", { term: "こんど" }, " («la prossima volta»)."]
              pl: ["Końcówki nie wyrażają czasu; mówi o nim określenie czasu: ", { term: "あした" }, " („jutro”), ", { term: "こんど" }, " („następnym razem”)."]
              tr: ["Ekler zaman bildirmez; zamanı bir zaman sözcüğü söyler: ", { term: "あした" }, " (“yarın”), ", { term: "こんど" }, " (“bir dahaki sefer”)."]
              id: ["Akhiran tidak menunjukkan waktu; kata waktu yang menyebutkannya: ", { term: "あした" }, " (“besok”), ", { term: "こんど" }, " (“lain kali”)."]
              vi: ["Đuôi không mang thì; từ chỉ thời gian cho biết khi nào: ", { term: "あした" }, " (“ngày mai”), ", { term: "こんど" }, " (“lần sau”)."]
            ex: ["あした、いっしょに", { kanji: "行", reading: "い" }, "き", { target: "ませんか" }, "。"]
            tr: { en: "Would you like to go together tomorrow?", uk: "Підемо завтра разом?", es: "¿Quieres que vayamos juntos mañana?", pt: "Quer ir junto amanhã?", fr: "Vous voulez qu’on y aille ensemble demain ?", de: "Möchten Sie morgen mit mir gehen?", it: "Vuole andare insieme domani?", pl: "Chce Pan(i) pójść jutro razem?", tr: "Yarın birlikte gitmek ister misiniz?", id: "Maukah Anda pergi bersama besok?", vi: "Ngày mai bạn có muốn đi cùng không?" }
