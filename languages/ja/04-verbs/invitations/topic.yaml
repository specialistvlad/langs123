            ex: ["あした、いっしょにえいがを", { kanji: "見", reading: "み" }, { target: "ませんか" }, "。"]
            tr: { en: "Would you like to see a film together tomorrow?", uk: "Не хочете завтра разом піти на фільм?", es: "¿Quiere ver una película conmigo mañana?", pt: "Quer ver um filme comigo amanhã?", fr: "Voulez-vous voir un film avec moi demain ?", de: "Möchten Sie morgen mit mir einen Film sehen?", it: "Vuole vedere un film con me domani?", pl: "Czy chciałby Pan(i) jutro obejrzeć ze mną film?", tr: "Yarın benimle film izlemek ister misiniz?", id: "Maukah Anda menonton film bersama saya besok?", vi: "Ngày mai bạn có muốn xem phim cùng tôi không?" }
