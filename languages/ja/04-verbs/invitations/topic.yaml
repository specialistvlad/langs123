            tr: { en: "Would you like to go tomorrow? — I’m sorry, tomorrow is a little difficult.", uk: "Підемо завтра? — Вибачте, завтра не дуже зручно.", es: "¿Vamos mañana? — Lo siento, mañana me viene un poco mal.", pt: "Vamos amanhã? — Desculpe, amanhã está meio difícil.", fr: "On y va demain ? — Désolé, demain, c’est un peu compliqué.", de: "Gehen wir morgen? — Tut mir leid, morgen passt es nicht so gut.", it: "Andiamo domani? — Mi dispiace, domani è un po’ difficile.", pl: "Pójdziemy jutro? — Przepraszam, jutro mi nie bardzo pasuje.", tr: "Yarın gidelim mi? — Üzgünüm, yarın biraz zor.", id: "Besok pergi, yuk? — Maaf, besok agak sulit.", vi: "Ngày mai mình đi nhé? — Xin lỗi, ngày mai hơi khó." }
