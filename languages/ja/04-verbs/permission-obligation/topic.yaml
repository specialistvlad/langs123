    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: ["Permission and ban take the ", { term: "て" }, "-form; duty and no need take the ", { term: "ない" }, "-form."]
              uk: ["Дозвіл і заборона вживаються з ", { term: "て" }, "-формою; обов’язок і непотрібність — з ", { term: "ない" }, "-формою."]
              es: ["El permiso y la prohibición llevan la forma ", { term: "て" }, "; la obligación y lo innecesario, la forma ", { term: "ない" }, "."]
              pt: ["A permissão e a proibição levam a forma ", { term: "て" }, "; a obrigação e o desnecessário, a forma ", { term: "ない" }, "."]
              fr: ["La permission et l’interdiction prennent la forme en ", { term: "て" }, " ; l’obligation et l’inutile, la forme en ", { term: "ない" }, "."]
              de: ["Erlaubnis und Verbot stehen mit der ", { term: "て" }, "-Form; Pflicht und Unnötiges mit der ", { term: "ない" }, "-Form."]
              it: ["Il permesso e il divieto prendono la forma in ", { term: "て" }, "; l’obbligo e il superfluo, la forma in ", { term: "ない" }, "."]
              pl: ["Pozwolenie i zakaz łączą się z formą ", { term: "て" }, "; obowiązek i brak potrzeby — z formą ", { term: "ない" }, "."]
              tr: ["İzin ve yasak ", { term: "て" }, " biçimi ile; zorunluluk ve gereksizlik ", { term: "ない" }, " biçimi ile kurulur."]
              id: ["Izin dan larangan memakai bentuk ", { term: "て" }, "; kewajiban dan ketidakperluan memakai bentuk ", { term: "ない" }, "."]
              vi: ["Cho phép và cấm đi với thể ", { term: "て" }, "; bắt buộc và không cần đi với thể ", { term: "ない" }, "."]
            ex: { examples: [[{ kanji: "見", reading: "み" }, { target: "て" }, "もいいです。"], [{ kanji: "見", reading: "み" }, { target: "なくて" }, "もいいです。"]] }
            tr: { en: { examples: ["You may look.", "You don't have to look."] }, uk: { examples: ["Можна дивитися.", "Дивитися не обов’язково."] }, es: { examples: ["Puedes mirar.", "No hace falta mirar."] }, pt: { examples: ["Pode olhar.", "Não precisa olhar."] }, fr: { examples: ["Vous pouvez regarder.", "Vous n’avez pas besoin de regarder."] }, de: { examples: ["Sie dürfen schauen.", "Sie müssen nicht schauen."] }, it: { examples: ["Puoi guardare.", "Non c’è bisogno di guardare."] }, pl: { examples: ["Możesz patrzeć.", "Nie musisz patrzeć."] }, tr: { examples: ["Bakabilirsin.", "Bakmana gerek yok."] }, id: { examples: ["Boleh melihat.", "Tidak perlu melihat."] }, vi: { examples: ["Được xem.", "Không cần xem."] } }
          - type: "note"
            level: "A2"
            text:
              en: ["For the forms themselves, see ", { link: "The て-Form", to: ja.verbs.te-form }, " and ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Самі форми — див. ", { link: "て-форма", to: ja.verbs.te-form }, " та ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["Para las formas en sí, véase ", { link: "La forma て", to: "ja.verbs.te-form" }, " y ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["Para as formas em si, veja ", { link: "A forma て", to: "ja.verbs.te-form" }, " e ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["Pour les formes elles-mêmes, voir ", { link: "La forme en て", to: "ja.verbs.te-form" }, " et ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Zu den Formen selbst siehe ", { link: "Die て-Form", to: "ja.verbs.te-form" }, " und ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["Per le forme in sé, vedi ", { link: "La forma in て", to: "ja.verbs.te-form" }, " e ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Same formy — zob. ", { link: "Forma て", to: "ja.verbs.te-form" }, " i ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Biçimlerin kendisi için bkz. ", { link: "て biçimi", to: "ja.verbs.te-form" }, " ve ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Untuk bentuk-bentuknya sendiri, lihat ", { link: "Bentuk て", to: "ja.verbs.te-form" }, " dan ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Về bản thân các dạng, xem ", { link: "Thể て", to: "ja.verbs.te-form" }, " và ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
