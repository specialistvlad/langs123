sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "Verbs fall into three groups; the group decides how a verb's forms are built."
              uk: "Дієслова поділяються на три групи; група визначає, як утворюються форми дієслова."
              es: "Los verbos se dividen en tres grupos; el grupo decide cómo se forman sus formas."
              pt: "Os verbos se dividem em três grupos; o grupo decide como as formas são construídas."
              fr: "Les verbes se répartissent en trois groupes ; le groupe détermine comment se forment ses formes."
              de: "Die Verben gehören zu drei Gruppen; die Gruppe bestimmt, wie die Formen gebildet werden."
              it: "I verbi si dividono in tre gruppi; il gruppo decide come si formano le sue forme."
              pl: "Czasowniki dzielą się na trzy grupy; grupa decyduje o tworzeniu form."
              tr: "Fiiller üç gruba ayrılır; grup, biçimlerin nasıl yapılacağını belirler."
              id: "Kata kerja terbagi menjadi tiga kelompok; kelompok menentukan cara pembentukan bentuknya."
              vi: "Động từ chia thành ba nhóm; nhóm quyết định cách tạo các dạng của động từ."
      - type: "usage"
        columns:
          - { key: "group", label: { en: "Group", uk: "Група", es: "Grupo", pt: "Grupo", fr: "Groupe", de: "Gruppe", it: "Gruppo", pl: "Grupa", tr: "Grup", id: "Kelompok", vi: "Nhóm" } }
          - { key: "rule", label: { en: "Rule", uk: "Правило", es: "Regla", pt: "Regra", fr: "Règle", de: "Regel", it: "Regola", pl: "Zasada", tr: "Kural", id: "Aturan", vi: "Quy tắc" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            group: { en: "Group 1", uk: "Група 1", es: "Grupo 1", pt: "Grupo 1", fr: "Groupe 1", de: "Gruppe 1", it: "Gruppo 1", pl: "Grupa 1", tr: "1. grup", id: "Kelompok 1", vi: "Nhóm 1" }
            rule:
              en: ["Most verbs. The syllable before ", { term: "ます" }, " has an i-sound: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              uk: ["Більшість дієслів. Склад перед ", { term: "ます" }, " має звук «і»: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              es: ["La mayoría de los verbos. La sílaba antes de ", { term: "ます" }, " tiene un sonido i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              pt: ["A maioria dos verbos. A sílaba antes de ", { term: "ます" }, " tem som de i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              fr: ["La plupart des verbes. La syllabe avant ", { term: "ます" }, " a un son i : ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              de: ["Die meisten Verben. Die Silbe vor ", { term: "ます" }, " hat einen i-Laut: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              it: ["La maggior parte dei verbi. La sillaba prima di ", { term: "ます" }, " ha un suono i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              pl: ["Większość czasowników. Sylaba przed ", { term: "ます" }, " ma dźwięk i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              tr: ["Fiillerin çoğu. ", { term: "ます" }, " öncesindeki hecede i sesi bulunur: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              id: ["Sebagian besar kata kerja. Suku kata sebelum ", { term: "ます" }, " berbunyi i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
              vi: ["Phần lớn động từ. Âm tiết trước ", { term: "ます" }, " có âm i: ", { term: "み" }, ", ", { term: "き" }, ", ", { term: "し" }, ", ", { term: "り" }, ", ", { term: "い" }, "."]
            ex: { examples: [{ target: [{ kanji: "飲", reading: "の" }, "みます"] }, { target: [{ kanji: "書", reading: "か" }, "きます"] }, { target: [{ kanji: "話", reading: "はな" }, "します"] }] }
            tr: { en: { examples: ["to drink", "to write", "to speak"] }, uk: { examples: ["пити", "писати", "розмовляти"] }, es: { examples: ["beber", "escribir", "hablar"] }, pt: { examples: ["beber", "escrever", "falar"] }, fr: { examples: ["boire", "écrire", "parler"] }, de: { examples: ["trinken", "schreiben", "sprechen"] }, it: { examples: ["bere", "scrivere", "parlare"] }, pl: { examples: ["pić", "pisać", "mówić"] }, tr: { examples: ["içmek", "yazmak", "konuşmak"] }, id: { examples: ["minum", "menulis", "berbicara"] }, vi: { examples: ["uống", "viết", "nói"] } }
          - level: "A1"
            group: { en: "Group 2", uk: "Група 2", es: "Grupo 2", pt: "Grupo 2", fr: "Groupe 2", de: "Gruppe 2", it: "Gruppo 2", pl: "Grupa 2", tr: "2. grup", id: "Kelompok 2", vi: "Nhóm 2" }
            rule:
              en: ["The syllable before ", { term: "ます" }, " has an e-sound (", { term: "べ" }, ", ", { term: "ね" }, ") or, for some verbs, an i-sound (", { term: "み" }, ", ", { term: "き" }, ")."]
              uk: ["Склад перед ", { term: "ます" }, " має звук «е» (", { term: "べ" }, ", ", { term: "ね" }, ") або, у деяких дієслів, звук «і» (", { term: "み" }, ", ", { term: "き" }, ")."]
              es: ["La sílaba antes de ", { term: "ます" }, " tiene un sonido e (", { term: "べ" }, ", ", { term: "ね" }, ") o, en algunos verbos, un sonido i (", { term: "み" }, ", ", { term: "き" }, ")."]
              pt: ["A sílaba antes de ", { term: "ます" }, " tem som de e (", { term: "べ" }, ", ", { term: "ね" }, ") ou, em alguns verbos, som de i (", { term: "み" }, ", ", { term: "き" }, ")."]
              fr: ["La syllabe avant ", { term: "ます" }, " a un son e (", { term: "べ" }, ", ", { term: "ね" }, ") ou, pour certains verbes, un son i (", { term: "み" }, ", ", { term: "き" }, ")."]
              de: ["Die Silbe vor ", { term: "ます" }, " hat einen e-Laut (", { term: "べ" }, ", ", { term: "ね" }, ") oder bei einigen Verben einen i-Laut (", { term: "み" }, ", ", { term: "き" }, ")."]
              it: ["La sillaba prima di ", { term: "ます" }, " ha un suono e (", { term: "べ" }, ", ", { term: "ね" }, ") o, in alcuni verbi, un suono i (", { term: "み" }, ", ", { term: "き" }, ")."]
              pl: ["Sylaba przed ", { term: "ます" }, " ma dźwięk e (", { term: "べ" }, ", ", { term: "ね" }, ") lub, w niektórych czasownikach, dźwięk i (", { term: "み" }, ", ", { term: "き" }, ")."]
