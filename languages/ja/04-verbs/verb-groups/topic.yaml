              it: ["Due verbi irregolari, ", { term: "する" }, " e ", { term: [{ kanji: "来", reading: "く" }, "る"] }, ", e ogni nome con ", { term: "する" }, "."]
              pl: ["Dwa czasowniki nieregularne, ", { term: "する" }, " i ", { term: [{ kanji: "来", reading: "く" }, "る"] }, ", oraz każdy rzeczownik z ", { term: "する" }, "."]
              tr: ["İki düzensiz fiil, ", { term: "する" }, " ve ", { term: [{ kanji: "来", reading: "く" }, "る"] }, ", ile ", { term: "する" }, " alan her isim."]
              id: ["Dua kata kerja tidak beraturan, ", { term: "する" }, " dan ", { term: [{ kanji: "来", reading: "く" }, "る"] }, ", serta setiap kata benda dengan ", { term: "する" }, "."]
              vi: ["Hai động từ bất quy tắc, ", { term: "する" }, " và ", { term: [{ kanji: "来", reading: "く" }, "る"] }, ", cùng mọi danh từ đi với ", { term: "する" }, "."]
            ex: { examples: [{ target: "します" }, { target: [{ kanji: "来", reading: "き" }, "ます"] }, { target: [{ kanji: "勉強", reading: "べんきょう" }, "します"] }] }
            tr: { en: { examples: ["to do", "to come", "to study"] }, uk: { examples: ["робити", "приходити", "вчитися"] }, es: { examples: ["hacer", "venir", "estudiar"] }, pt: { examples: ["fazer", "vir", "estudar"] }, fr: { examples: ["faire", "venir", "étudier"] }, de: { examples: ["tun, machen", "kommen", "lernen"] }, it: { examples: ["fare", "venire", "studiare"] }, pl: { examples: ["robić", "przychodzić", "uczyć się"] }, tr: { examples: ["yapmak", "gelmek", "çalışmak"] }, id: { examples: ["melakukan", "datang", "belajar"] }, vi: { examples: ["làm", "đến", "học"] } }
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: ["The dictionary form ends in a u-sound: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              uk: ["Словникова форма закінчується на звук «у»: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              es: ["La forma de diccionario termina en un sonido u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              pt: ["A forma de dicionário termina em som de u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              fr: ["La forme du dictionnaire se termine par un son u : ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              de: ["Die Wörterbuchform endet auf einen u-Laut: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              it: ["La forma del dizionario termina con un suono u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              pl: ["Forma słownikowa kończy się dźwiękiem u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              tr: ["Sözlük biçimi bir u sesiyle biter: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              id: ["Bentuk kamus berakhir dengan bunyi u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
              vi: ["Thể từ điển kết thúc bằng một âm u: ", { alternatives: [{ term: "う" }, { term: "く" }, { term: "ぐ" }, { term: "す" }, { term: "つ" }, { term: "ぬ" }, { term: "ぶ" }, { term: "む" }, { term: "る" }] }, "."]
            ex: { examples: [{ target: [{ kanji: "飲", reading: "の" }, "む"] }, { target: [{ kanji: "食", reading: "た" }, "べる"] }, { target: "する" }] }
            tr: { en: { examples: ["to drink", "to eat", "to do"] }, uk: { examples: ["пити", "їсти", "робити"] }, es: { examples: ["beber", "comer", "hacer"] }, pt: { examples: ["beber", "comer", "fazer"] }, fr: { examples: ["boire", "manger", "faire"] }, de: { examples: ["trinken", "essen", "tun, machen"] }, it: { examples: ["bere", "mangiare", "fare"] }, pl: { examples: ["pić", "jeść", "robić"] }, tr: { examples: ["içmek", "yemek", "yapmak"] }, id: { examples: ["minum", "makan", "melakukan"] }, vi: { examples: ["uống", "ăn", "làm"] } }
          - type: "rule"
            level: "A2"
            text:
              en: ["The dictionary form is the form a dictionary lists; the ", { term: "て" }, "-form and the plain forms are built on it. See ", { link: "The て-Form", to: ja.verbs.te-form }, " and ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Словникова форма — це форма, під якою слово стоїть у словнику; від неї утворюють ", { term: "て" }, "-форму та прості форми. Див. ", { link: "て-форма", to: "ja.verbs.te-form" }, " і ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["La forma de diccionario es la que aparece en el diccionario; sobre ella se construyen la forma ", { term: "て" }, " y las formas simples. Véase ", { link: "La forma て", to: "ja.verbs.te-form" }, " y ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A forma de dicionário é a que aparece no dicionário; sobre ela se constroem a forma ", { term: "て" }, " e as formas simples. Veja ", { link: "A forma て", to: "ja.verbs.te-form" }, " e ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La forme du dictionnaire est celle que donne le dictionnaire ; la forme en ", { term: "て" }, " et les formes simples s’en déduisent. Voir ", { link: "La forme en て", to: "ja.verbs.te-form" }, " et ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Die Wörterbuchform ist die Form, unter der ein Wörterbuch das Verb führt; auf ihr bauen die ", { term: "て" }, "-Form und die einfachen Formen auf. Siehe ", { link: "Die て-Form", to: "ja.verbs.te-form" }, " und ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["La forma del dizionario è quella che il dizionario elenca; su di essa si costruiscono la forma in ", { term: "て" }, " e le forme semplici. Vedi ", { link: "La forma in て", to: "ja.verbs.te-form" }, " e ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Forma słownikowa to forma podawana w słowniku; na niej opiera się forma ", { term: "て" }, " i formy proste. Zob. ", { link: "Forma て", to: "ja.verbs.te-form" }, " i ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Sözlük biçimi sözlüğün verdiği biçimdir; ", { term: "て" }, " biçimi ve yalın biçimler bunun üzerine kurulur. Bkz. ", { link: "て biçimi", to: "ja.verbs.te-form" }, " ve ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Bentuk kamus adalah bentuk yang dicantumkan kamus; bentuk ", { term: "て" }, " dan bentuk biasa dibangun dari bentuk ini. Lihat ", { link: "Bentuk て", to: "ja.verbs.te-form" }, " dan ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Thể từ điển là thể được ghi trong từ điển; thể ", { term: "て" }, " và các thể thường được tạo từ đó. Xem ", { link: "Thể て", to: "ja.verbs.te-form" }, " và ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
