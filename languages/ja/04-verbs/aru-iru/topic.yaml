            en: ["A position word follows ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            uk: ["Слово розташування стоїть після ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            es: ["La palabra de posición va después de ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            pt: ["A palavra de posição vem depois de ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            fr: ["Le mot de position suit ", { term: "の" }, " : ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            de: ["Das Lagewort steht nach ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            it: ["La parola di posizione segue ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            pl: ["Słowo określające położenie stoi po ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            tr: ["Konum sözcüğü ", { term: "の" }, " ardından gelir: ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            id: ["Kata posisi mengikuti ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
            vi: ["Từ chỉ vị trí đứng sau ", { term: "の" }, ": ", { term: { kanji: "上", reading: "うえ" } }, ", ", { term: { kanji: "下", reading: "した" } }, ", ", { term: { kanji: "中", reading: "なか" } }, ", ", { term: { kanji: "前", reading: "まえ" } }, "."]
          ex: ["つくえ", { target: ["の", { kanji: "上", reading: "うえ" }, "に"] }, { kanji: "本", reading: "ほん" }, "があります。"]
          tr: { en: "There is a book on the desk.", uk: "На столі є книга.", es: "Hay un libro sobre el escritorio.", pt: "Tem um livro em cima da mesa.", fr: "Il y a un livre sur le bureau.", de: "Auf dem Schreibtisch liegt ein Buch.", it: "Sulla scrivania c'è un libro.", pl: "Na biurku jest książka.", tr: "Masanın üstünde bir kitap var.", id: "Ada buku di atas meja.", vi: "Có một quyển sách ở trên bàn." }
        - level: "A2"
          point: { en: "Having", uk: "Володіння", es: "Posesión", pt: "Posse", fr: "Possession", de: "Besitz", it: "Possesso", pl: "Posiadanie", tr: "Sahip olma", id: "Kepemilikan", vi: "Sở hữu" }
          rule:
            en: ["To have: ", { term: "あります" }, " for things and time, ", { term: "います" }, " for family."]
            uk: ["Мати: ", { term: "あります" }, " для речей і часу, ", { term: "います" }, " для родини."]
            es: ["Tener: ", { term: "あります" }, " para cosas y tiempo, ", { term: "います" }, " para la familia."]
            pt: ["Ter: ", { term: "あります" }, " para coisas e tempo, ", { term: "います" }, " para a família."]
            fr: ["Avoir : ", { term: "あります" }, " pour les choses et le temps, ", { term: "います" }, " pour la famille."]
            de: ["Haben: ", { term: "あります" }, " für Dinge und Zeit, ", { term: "います" }, " für die Familie."]
            it: ["Avere: ", { term: "あります" }, " per cose e tempo, ", { term: "います" }, " per la famiglia."]
            pl: ["Mieć: ", { term: "あります" }, " dla rzeczy i czasu, ", { term: "います" }, " dla rodziny."]
            tr: ["Sahip olmak: nesne ve zaman için ", { term: "あります" }, ", aile için ", { term: "います" }, "."]
            id: ["Punya: ", { term: "あります" }, " untuk benda dan waktu, ", { term: "います" }, " untuk keluarga."]
            vi: ["Có (sở hữu): ", { term: "あります" }, " cho đồ vật và thời gian, ", { term: "います" }, " cho gia đình."]
          ex: [{ kanji: "今", reading: "いま" }, "、", { kanji: "時間", reading: "じかん" }, "が", { target: "あります" }, "か。"]
          tr: { en: "Do you have time now?", uk: "У вас зараз є час?", es: "¿Tienes tiempo ahora?", pt: "Você tem tempo agora?", fr: "Vous avez le temps maintenant ?", de: "Haben Sie jetzt Zeit?", it: "Ha tempo adesso?", pl: "Czy masz teraz czas?", tr: "Şimdi vaktiniz var mı?", id: "Apakah Anda punya waktu sekarang?", vi: "Bây giờ bạn có thời gian không?" }
        - level: "A2"
          point: { en: "Events", uk: "Події", es: "Acontecimientos", pt: "Eventos", fr: "Événements", de: "Ereignisse", it: "Eventi", pl: "Wydarzenia", tr: "Etkinlikler", id: "Acara", vi: "Sự kiện" }
          rule:
            en: ["An event takes ", { term: "あります" }, "; its place takes ", { term: "で" }, "."]
            uk: ["Подія — це ", { term: "あります" }, ", а її місце — ", { term: "で" }, "."]
            es: ["Un acontecimiento lleva ", { term: "あります" }, "; su lugar lleva ", { term: "で" }, "."]
            pt: ["Um evento leva ", { term: "あります" }, "; o lugar dele leva ", { term: "で" }, "."]
            fr: ["Un événement se dit ", { term: "あります" }, " ; son lieu prend ", { term: "で" }, "."]
            de: ["Ein Ereignis steht mit ", { term: "あります" }, "; sein Ort mit ", { term: "で" }, "."]
            it: ["Un evento usa ", { term: "あります" }, "; il suo luogo prende ", { term: "で" }, "."]
            pl: ["Wydarzenie to ", { term: "あります" }, "; jego miejsce łączy się z ", { term: "で" }, "."]
            tr: ["Etkinlik ", { term: "あります" }, " ile söylenir; yeri ", { term: "で" }, " alır."]
            id: ["Acara memakai ", { term: "あります" }, "; tempatnya memakai ", { term: "で" }, "."]
            vi: ["Sự kiện dùng ", { term: "あります" }, "; nơi diễn ra đi với ", { term: "で" }, "."]
          ex: [{ kanji: "学校", reading: "がっこう" }, { target: "で" }, "パーティーがあります。"]
          tr: { en: "There is a party at school.", uk: "У школі буде вечірка.", es: "Hay una fiesta en la escuela.", pt: "Tem uma festa na escola.", fr: "Il y a une fête à l’école.", de: "In der Schule gibt es eine Party.", it: "A scuola c'è una festa.", pl: "W szkole jest impreza.", tr: "Okulda bir parti var.", id: "Ada pesta di sekolah.", vi: "Ở trường có một bữa tiệc." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["Only living beings take ", { term: "います" }, "; everything else takes ", { term: "あります" }, "."]
            uk: [{ term: "います" }, " — лише для живих істот; усе інше — ", { term: "あります" }, "."]
            es: ["Solo los seres vivos llevan ", { term: "います" }, "; todo lo demás lleva ", { term: "あります" }, "."]
            pt: ["Só seres vivos levam ", { term: "います" }, "; todo o resto leva ", { term: "あります" }, "."]
            fr: ["Seuls les êtres vivants prennent ", { term: "います" }, " ; tout le reste prend ", { term: "あります" }, "."]
            de: ["Nur Lebewesen stehen mit ", { term: "います" }, "; alles andere mit ", { term: "あります" }, "."]
            it: ["Solo gli esseri viventi prendono ", { term: "います" }, "; tutto il resto prende ", { term: "あります" }, "."]
            pl: ["Tylko istoty żywe łączą się z ", { term: "います" }, "; wszystko inne z ", { term: "あります" }, "."]
            tr: [{ term: "います" }, " yalnızca canlılar için; geri kalan her şey için ", { term: "あります" }, "."]
            id: ["Hanya makhluk hidup memakai ", { term: "います" }, "; selain itu memakai ", { term: "あります" }, "."]
            vi: ["Chỉ sinh vật sống dùng ", { term: "います" }, "; mọi thứ khác dùng ", { term: "あります" }, "."]
          ex: ["つくえの", { kanji: "上", reading: "うえ" }, "に", { kanji: "本", reading: "ほん" }, "が", { target: "あります" }, "。"]
          tr: { en: "There is a book on the desk.", uk: "На столі є книга.", es: "Hay un libro sobre el escritorio.", pt: "Tem um livro em cima da mesa.", fr: "Il y a un livre sur le bureau.", de: "Auf dem Schreibtisch liegt ein Buch.", it: "Sulla scrivania c'è un libro.", pl: "Na biurku jest książka.", tr: "Masanın üstünde bir kitap var.", id: "Ada buku di atas meja.", vi: "Có một quyển sách ở trên bàn." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["The place takes ", { term: "に" }, ", never ", { term: "で" }, "."]
            uk: ["Місце стоїть з ", { term: "に" }, ", ніколи з ", { term: "で" }, "."]
            es: ["El lugar lleva ", { term: "に" }, ", nunca ", { term: "で" }, "."]
            pt: ["O lugar leva ", { term: "に" }, ", nunca ", { term: "で" }, "."]
            fr: ["Le lieu prend ", { term: "に" }, ", jamais ", { term: "で" }, "."]
            de: ["Der Ort steht mit ", { term: "に" }, ", nie mit ", { term: "で" }, "."]
            it: ["Il luogo prende ", { term: "に" }, ", mai ", { term: "で" }, "."]
            pl: ["Miejsce łączy się z ", { term: "に" }, ", nigdy z ", { term: "で" }, "."]
            tr: ["Yer ", { term: "に" }, " alır, asla ", { term: "で" }, " almaz."]
            id: ["Tempat memakai ", { term: "に" }, ", tidak pernah ", { term: "で" }, "."]
            vi: ["Nơi chốn đi với ", { term: "に" }, ", không bao giờ với ", { term: "で" }, "."]
          ex: ["へや", { target: "に" }, "ねこがいます。"]
          tr: { en: "There is a cat in the room.", uk: "У кімнаті є кіт.", es: "Hay un gato en la habitación.", pt: "Tem um gato no quarto.", fr: "Il y a un chat dans la chambre.", de: "Im Zimmer ist eine Katze.", it: "Nella stanza c'è un gatto.", pl: "W pokoju jest kot.", tr: "Odada bir kedi var.", id: "Di kamar ada kucing.", vi: "Trong phòng có một con mèo." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "あります" }, " is for things; ", { term: "います" }, " is for people and animals."]
              uk: [{ term: "あります" }, " вживають для речей, ", { term: "います" }, " — для людей і тварин."]
              es: [{ term: "あります" }, " se usa para cosas; ", { term: "います" }, ", para personas y animales."]
              pt: [{ term: "あります" }, " é para coisas; ", { term: "います" }, " é para pessoas e animais."]
              fr: [{ term: "あります" }, " sert pour les choses ; ", { term: "います" }, " pour les personnes et les animaux."]
              de: [{ term: "あります" }, " steht für Dinge, ", { term: "います" }, " für Menschen und Tiere."]
              it: [{ term: "あります" }, " si usa per le cose; ", { term: "います" }, " per le persone e gli animali."]
              pl: [{ term: "あります" }, " mówi się o rzeczach, ", { term: "います" }, " — o ludziach i zwierzętach."]
              tr: [{ term: "あります" }, " nesneler için, ", { term: "います" }, " insanlar ve hayvanlar için kullanılır."]
              id: [{ term: "あります" }, " untuk benda, ", { term: "います" }, " untuk orang dan hewan."]
              vi: [{ term: "あります" }, " dùng cho đồ vật, ", { term: "います" }, " dùng cho người và động vật."]
            ex: { examples: [[{ kanji: "本", reading: "ほん" }, "が", { target: "あります" }, "。"], ["いぬが", { target: "います" }, "。"]] }
            tr: { en: { examples: ["There is a book.", "There is a dog."] }, uk: { examples: ["Є книга.", "Є собака."] }, es: { examples: ["Hay un libro.", "Hay un perro."] }, pt: { examples: ["Tem um livro.", "Tem um cachorro."] }, fr: { examples: ["Il y a un livre.", "Il y a un chien."] }, de: { examples: ["Es gibt ein Buch.", "Es gibt einen Hund."] }, it: { examples: ["C'è un libro.", "C'è un cane."] }, pl: { examples: ["Jest książka.", "Jest pies."] }, tr: { examples: ["Bir kitap var.", "Bir köpek var."] }, id: { examples: ["Ada buku.", "Ada anjing."] }, vi: { examples: ["Có một quyển sách.", "Có một con chó."] } }
          - type: "rule"
            level: "A1"
            text:
              en: ["The place where something is takes ", { term: "に" }, ". More on ", { term: "に" }, " and ", { term: "で" }, ": see ", { link: "Particles を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              uk: ["Місце, де щось є, стоїть з ", { term: "に" }, ". Докладніше про ", { term: "に" }, " і ", { term: "で" }, ": див. ", { link: "Частки を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              es: ["El lugar donde algo está lleva ", { term: "に" }, ". Más sobre ", { term: "に" }, " y ", { term: "で" }, ": véase ", { link: "Las partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pt: ["O lugar onde algo está leva ", { term: "に" }, ". Mais sobre ", { term: "に" }, " e ", { term: "で" }, ": veja ", { link: "As partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              fr: ["Le lieu où se trouve quelque chose prend ", { term: "に" }, ". Plus sur ", { term: "に" }, " et ", { term: "で" }, " : voir ", { link: "Les particules を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              de: ["Der Ort, an dem etwas ist, steht mit ", { term: "に" }, ". Mehr zu ", { term: "に" }, " und ", { term: "で" }, ": siehe ", { link: "Die Partikeln を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              it: ["Il luogo in cui si trova qualcosa prende ", { term: "に" }, ". Di più su ", { term: "に" }, " e ", { term: "で" }, ": vedi ", { link: "Le particelle を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pl: ["Miejsce, w którym coś jest, łączy się z ", { term: "に" }, ". Więcej o ", { term: "に" }, " i ", { term: "で" }, ": zob. ", { link: "Partykuły を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              tr: ["Bir şeyin bulunduğu yer ", { term: "に" }, " alır. ", { term: "に" }, " ve ", { term: "で" }, " hakkında daha fazlası: bkz. ", { link: "を, に, で, へ edatları", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              id: ["Tempat sesuatu berada memakai ", { term: "に" }, ". Selengkapnya tentang ", { term: "に" }, " dan ", { term: "で" }, ": lihat ", { link: "Partikel を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              vi: ["Nơi chốn có vật hay người đi với ", { term: "に" }, ". Thêm về ", { term: "に" }, " và ", { term: "で" }, ": xem ", { link: "Trợ từ を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
            ex: ["へや", { target: "に" }, "つくえがあります。"]
            tr: { en: "There is a desk in the room.", uk: "У кімнаті є стіл.", es: "Hay un escritorio en la habitación.", pt: "Tem uma mesa no quarto.", fr: "Il y a un bureau dans la chambre.", de: "Im Zimmer gibt es einen Schreibtisch.", it: "Nella stanza c'è una scrivania.", pl: "W pokoju jest biurko.", tr: "Odada bir masa var.", id: "Di kamar ada meja.", vi: "Trong phòng có một cái bàn." }
          - type: "rule"
            level: "A1"
            text:
              en: "Both verbs end the sentence and stay the same for one or many."
              uk: "Обидва дієслова стоять у кінці речення й не змінюються залежно від кількості."
              es: "Los dos verbos van al final de la oración y no cambian según haya uno o varios."
              pt: "Os dois verbos ficam no fim da frase e não mudam se há um ou vários."
              fr: "Les deux verbes se placent en fin de phrase et ne changent pas, qu’il y en ait un ou plusieurs."
              de: "Beide Verben stehen am Satzende und bleiben gleich, egal ob es einer oder viele sind."
              it: "I due verbi stanno alla fine della frase e non cambiano, che ce ne sia uno o molti."
              pl: "Oba czasowniki stoją na końcu zdania i nie zmieniają się, gdy jest jeden lub wiele."
              tr: "İki fiil de cümlenin sonunda durur; bir ya da çok olması fiili değiştirmez."
              id: "Kedua kata kerja berada di akhir kalimat dan tidak berubah untuk satu maupun banyak."
              vi: "Cả hai động từ đứng cuối câu và không đổi dù có một hay nhiều."
            ex: { examples: [["いぬが", { target: "います" }, "。"], ["いぬがたくさん", { target: "います" }, "。"]] }
            tr: { en: { examples: ["There is a dog.", "There are many dogs."] }, uk: { examples: ["Є собака.", "Є багато собак."] }, es: { examples: ["Hay un perro.", "Hay muchos perros."] }, pt: { examples: ["Tem um cachorro.", "Tem muitos cachorros."] }, fr: { examples: ["Il y a un chien.", "Il y a beaucoup de chiens."] }, de: { examples: ["Es gibt einen Hund.", "Es gibt viele Hunde."] }, it: { examples: ["C'è un cane.", "Ci sono molti cani."] }, pl: { examples: ["Jest pies.", "Jest dużo psów."] }, tr: { examples: ["Bir köpek var.", "Çok köpek var."] }, id: { examples: ["Ada anjing.", "Ada banyak anjing."] }, vi: { examples: ["Có một con chó.", "Có nhiều con chó."] } }
  - title:
      en: "Form: saying where something is"
      uk: "Форма: де щось розташоване"
      es: "Forma: decir dónde está algo"
      pt: "Forma: dizer onde algo está"
      fr: "Forme : dire où se trouve quelque chose"
      de: "Form: sagen, wo etwas ist"
      it: "Forma: dire dove si trova qualcosa"
      pl: "Forma: mówienie, gdzie coś jest"
      tr: "Biçim: bir şeyin yerini söyleme"
      id: "Bentuk: menyatakan letak sesuatu"
      vi: "Dạng: nói vật ở đâu"
    role: "form"
    content:
      - type: "usage"
        columns:
          - { key: "form", label: { en: "Form", uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - key: "use"
            label:
              en: "Answers"
              uk: "Відповідає на"
              es: "Responde a"
              pt: "Responde a"
              fr: "Répond à"
              de: "Antwortet auf"
              it: "Risponde a"
              pl: "Odpowiada na"
              tr: "Yanıtladığı"
              id: "Menjawab"
              vi: "Trả lời cho"
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            form:
