            level: "A1"
            text:
              en: ["A position word follows the noun and ", { term: "の" }, "; the phrase takes ", { term: "に" }, ". See ", { link: "Particles と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              uk: ["Слово розташування стоїть після іменника та ", { term: "の" }, "; уся фраза стоїть з ", { term: "に" }, ". Див. ", { link: "Частки と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              es: ["La palabra de posición va tras el sustantivo y ", { term: "の" }, "; la frase lleva ", { term: "に" }, ". Véase ", { link: "Las partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              pt: ["A palavra de posição vem depois do substantivo e de ", { term: "の" }, "; a expressão leva ", { term: "に" }, ". Veja ", { link: "As partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              fr: ["Le mot de position suit le nom et ", { term: "の" }, " ; l’ensemble prend ", { term: "に" }, ". Voir ", { link: "Les particules と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              de: ["Das Lagewort steht nach dem Nomen und ", { term: "の" }, "; die Wendung steht mit ", { term: "に" }, ". Siehe ", { link: "Die Partikeln と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              it: ["La parola di posizione segue il nome e ", { term: "の" }, "; l'insieme prende ", { term: "に" }, ". Vedi ", { link: "Le particelle と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              pl: ["Słowo określające położenie stoi po rzeczowniku i ", { term: "の" }, "; całe wyrażenie łączy się z ", { term: "に" }, ". Zob. ", { link: "Partykuły と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              tr: ["Konum sözcüğü, ismin ve ", { term: "の" }, " ekinin ardından gelir; öbek ", { term: "に" }, " alır. Bkz. ", { link: "と, も, の edatları", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              id: ["Kata posisi mengikuti kata benda dan ", { term: "の" }, "; seluruh frasa memakai ", { term: "に" }, ". Lihat ", { link: "Partikel と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
              vi: ["Từ chỉ vị trí đứng sau danh từ và ", { term: "の" }, "; cả cụm đi với ", { term: "に" }, ". Xem ", { link: "Trợ từ と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }, "."]
