      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["A question word replaces the noun and keeps its particle; ", { term: "か" }, " ends the sentence. See ", { link: "Questions", to: "ja.sentence-basics.questions" }, "."]
              uk: ["Питальне слово замінює іменник і зберігає свою частку; ", { term: "か" }, " завершує речення. Див. ", { link: "Питання", to: "ja.sentence-basics.questions" }, "."]
              es: ["La palabra interrogativa sustituye al sustantivo y conserva su partícula; ", { term: "か" }, " cierra la oración. Véase ", { link: "Las preguntas", to: "ja.sentence-basics.questions" }, "."]
              pt: ["A palavra interrogativa substitui o substantivo e mantém sua partícula; ", { term: "か" }, " fecha a frase. Veja ", { link: "As perguntas", to: "ja.sentence-basics.questions" }, "."]
              fr: ["Le mot interrogatif remplace le nom et garde sa particule ; ", { term: "か" }, " termine la phrase. Voir ", { link: "Les questions", to: "ja.sentence-basics.questions" }, "."]
              de: ["Das Fragewort ersetzt das Nomen und behält seine Partikel; ", { term: "か" }, " schließt den Satz. Siehe ", { link: "Fragen", to: "ja.sentence-basics.questions" }, "."]
              it: ["La parola interrogativa sostituisce il nome e mantiene la sua particella; ", { term: "か" }, " chiude la frase. Vedi ", { link: "Le domande", to: "ja.sentence-basics.questions" }, "."]
              pl: ["Zaimek pytający zastępuje rzeczownik i zachowuje swoją partykułę; ", { term: "か" }, " kończy zdanie. Zob. ", { link: "Pytania", to: "ja.sentence-basics.questions" }, "."]
              tr: ["Soru sözcüğü ismin yerine geçer ve edatını korur; ", { term: "か" }, " cümleyi bitirir. Bkz. ", { link: "Soru cümleleri", to: "ja.sentence-basics.questions" }, "."]
              id: ["Kata tanya menggantikan kata benda dan mempertahankan partikelnya; ", { term: "か" }, " menutup kalimat. Lihat ", { link: "Kalimat tanya", to: "ja.sentence-basics.questions" }, "."]
              vi: ["Từ để hỏi thay cho danh từ và giữ nguyên trợ từ của nó; ", { term: "か" }, " kết thúc câu. Xem ", { link: "Câu hỏi", to: "ja.sentence-basics.questions" }, "."]
          - type: "rule"
            level: "A1"
            text:
              en: ["A short answer repeats the verb alone, with ", { term: "はい" }, " or ", { term: "いいえ" }, "."]
              uk: ["Коротка відповідь повторює лише дієслово, з ", { term: "はい" }, " або ", { term: "いいえ" }, "."]
              es: ["La respuesta breve repite solo el verbo, con ", { term: "はい" }, " o ", { term: "いいえ" }, "."]
              pt: ["A resposta curta repete só o verbo, com ", { term: "はい" }, " ou ", { term: "いいえ" }, "."]
              fr: ["La réponse courte reprend seulement le verbe, avec ", { term: "はい" }, " ou ", { term: "いいえ" }, "."]
              de: ["Die Kurzantwort wiederholt nur das Verb, mit ", { term: "はい" }, " oder ", { term: "いいえ" }, "."]
              it: ["La risposta breve ripete solo il verbo, con ", { term: "はい" }, " o ", { term: "いいえ" }, "."]
              pl: ["Krótka odpowiedź powtarza tylko czasownik, z ", { term: "はい" }, " lub ", { term: "いいえ" }, "."]
              tr: ["Kısa cevap yalnızca fiili tekrarlar; başına ", { term: "はい" }, " ya da ", { term: "いいえ" }, " gelir."]
              id: ["Jawaban singkat hanya mengulang kata kerjanya, dengan ", { term: "はい" }, " atau ", { term: "いいえ" }, "."]
              vi: ["Câu trả lời ngắn chỉ lặp lại động từ, kèm ", { term: "はい" }, " hoặc ", { term: "いいえ" }, "."]
