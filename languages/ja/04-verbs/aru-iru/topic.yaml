            text:
              en: ["The owner takes ", { term: "は" }, " or ", { term: "には" }, "; what is owned takes ", { term: "が" }, "."]
              uk: ["Власник стоїть з ", { term: "は" }, " або ", { term: "には" }, ", а те, чим володіють, — з ", { term: "が" }, "."]
              es: ["El poseedor lleva ", { term: "は" }, " o ", { term: "には" }, "; lo poseído lleva ", { term: "が" }, "."]
              pt: ["O possuidor leva ", { term: "は" }, " ou ", { term: "には" }, "; o que se possui leva ", { term: "が" }, "."]
              fr: ["Le possesseur prend ", { term: "は" }, " ou ", { term: "には" }, " ; ce qui est possédé prend ", { term: "が" }, "."]
              de: ["Der Besitzer steht mit ", { term: "は" }, " oder ", { term: "には" }, ", das Besessene mit ", { term: "が" }, "."]
              it: ["Chi possiede prende ", { term: "は" }, " o ", { term: "には" }, "; ciò che è posseduto prende ", { term: "が" }, "."]
              pl: ["Posiadacz łączy się z ", { term: "は" }, " lub ", { term: "には" }, ", a to, co posiada, z ", { term: "が" }, "."]
              tr: ["Sahip olan ", { term: "は" }, " veya ", { term: "には" }, " alır; sahip olunan ", { term: "が" }, " alır."]
              id: ["Pemilik memakai ", { term: "は" }, " atau ", { term: "には" }, "; yang dimiliki memakai ", { term: "が" }, "."]
              vi: ["Người sở hữu đi với ", { term: "は" }, " hoặc ", { term: "には" }, "; vật được sở hữu đi với ", { term: "が" }, "."]
          - type: "rule"
            level: "A2"
            text:
              en: ["A count follows the particle ", { term: "が" }, ": noun + ", { term: "が" }, " + number. See ", { link: "Counters", to: "ja.foundations.counters" }, "."]
              uk: ["Кількість стоїть після частки ", { term: "が" }, ": іменник + ", { term: "が" }, " + число. Див. ", { link: "Лічильні слова", to: "ja.foundations.counters" }, "."]
              es: ["La cantidad va después de la partícula ", { term: "が" }, ": sustantivo + ", { term: "が" }, " + número. Véase ", { link: "Los contadores", to: "ja.foundations.counters" }, "."]
