              id: [{ term: "できます" }, " juga berarti “jadi, siap” untuk hal yang tercipta."]
              vi: [{ term: "できます" }, " còn nghĩa là “được làm xong, sẵn sàng” với những thứ hình thành."]
            ex: ["ばんごはんが", { target: "できました" }, "。"]
            tr: { en: "Dinner is ready.", uk: "Вечеря готова.", es: "La cena está lista.", pt: "O jantar está pronto.", fr: "Le dîner est prêt.", de: "Das Abendessen ist fertig.", it: "La cena è pronta.", pl: "Kolacja jest gotowa.", tr: "Akşam yemeği hazır.", id: "Makan malam sudah siap.", vi: "Bữa tối đã xong rồi." }
