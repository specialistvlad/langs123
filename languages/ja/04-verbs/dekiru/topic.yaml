              vi: ["Nói hoàn cảnh cho phép điều gì; ", { term: "ますか" }, " hỏi có thể không."]
            ex: ["あした", { kanji: "来", reading: "く" }, "る", { target: "ことができますか" }, "。"]
            tr: { en: "Can you come tomorrow?", uk: "Ви зможете прийти завтра?", es: "¿Puede venir mañana?", pt: "Você pode vir amanhã?", fr: "Pouvez-vous venir demain ?", de: "Können Sie morgen kommen?", it: "Può venire domani?", pl: "Czy może Pan(i) przyjść jutro?", tr: "Yarın gelebilir misiniz?", id: "Bisakah Anda datang besok?", vi: "Ngày mai bạn có thể đến không?" }
          - level: "A2"
            point: { en: "Past", uk: "Минуле", es: "Pasado", pt: "Passado", fr: "Passé", de: "Vergangenheit", it: "Passato", pl: "Przeszłość", tr: "Geçmiş", id: "Lampau", vi: "Quá khứ" }
            rule:
