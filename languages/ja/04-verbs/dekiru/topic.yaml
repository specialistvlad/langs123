              pt: ["Diga o que a situação permite; ", { term: "ますか" }, " pergunta se é possível."]
              fr: ["Dites ce que la situation permet ; ", { term: "ますか" }, " demande si c’est possible."]
              de: ["Sagen Sie, was die Lage erlaubt; ", { term: "ますか" }, " fragt, ob es möglich ist."]
              it: ["Di’ ciò che la situazione permette; ", { term: "ますか" }, " chiede se è possibile."]
              pl: ["Powiedz, na co pozwala sytuacja; ", { term: "ますか" }, " pyta, czy to możliwe."]
