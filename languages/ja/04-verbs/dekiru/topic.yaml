              de: [{ term: "できました" }, " und ", { term: "できませんでした" }, " berichten, was möglich oder nicht möglich war."]
              it: [{ term: "できました" }, " e ", { term: "できませんでした" }, " dicono ciò che è stato o non è stato possibile."]
              pl: [{ term: "できました" }, " i ", { term: "できませんでした" }, " mówią, co było lub nie było możliwe."]
              tr: [{ term: "できました" }, " ve ", { term: "できませんでした" }, " neyin mümkün olup olmadığını bildirir."]
              id: [{ term: "できました" }, " dan ", { term: "できませんでした" }, " menyatakan apa yang bisa atau tidak bisa dilakukan."]
              vi: [{ term: "できました" }, " và ", { term: "できませんでした" }, " cho biết điều gì đã hoặc không thể làm."]
            ex: ["きのうは", { kanji: "行", reading: "い" }, "くことが", { target: "できませんでした" }, "。"]
            tr: { en: "I couldn’t go yesterday.", uk: "Учора я не зміг піти.", es: "Ayer no pude ir.", pt: "Ontem não pude ir.", fr: "Hier, je n’ai pas pu y aller.", de: "Gestern konnte ich nicht hingehen.", it: "Ieri non sono potuto andare.", pl: "Wczoraj nie mogłem pójść.", tr: "Dün gidemedim.", id: "Kemarin saya tidak bisa pergi.", vi: "Hôm qua tôi không thể đi được." }
          - level: "A2"
            point: { en: "Ready", uk: "Готовність", es: "Estar listo", pt: "Estar pronto", fr: "Être prêt", de: "Fertig sein", it: "Essere pronto", pl: "Gotowość", tr: "Hazır olmak", id: "Siap", vi: "Xong" }
            rule:
              en: [{ term: "できます" }, " also means “is made, is ready” for things that come into being."]
              uk: [{ term: "できます" }, " означає також «готується, готове» для речей, що з’являються."]
              es: [{ term: "できます" }, " también significa «se hace, está listo» para cosas que se producen."]
              pt: [{ term: "できます" }, " também significa «fica pronto» para coisas que surgem."]
              fr: [{ term: "できます" }, " signifie aussi « se fait, est prêt » pour ce qui se produit."]
              de: [{ term: "できます" }, " heißt auch „entsteht, ist fertig“ bei Dingen, die entstehen."]
              it: [{ term: "できます" }, " significa anche «si fa, è pronto» per le cose che nascono."]
              pl: [{ term: "できます" }, " znaczy też „powstaje, jest gotowe” przy rzeczach, które się pojawiają."]
