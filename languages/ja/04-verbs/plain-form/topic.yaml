summary:
  lead:
    en: "The plain form is the casual style of verbs, adjectives and nouns, used with friends, in diaries and inside longer sentences."
    uk: "Проста форма — розмовний стиль дієслів, прикметників та іменників: з друзями, у щоденниках і всередині довших речень."
    es: "La forma simple es el estilo informal de verbos, adjetivos y sustantivos, usado con amigos, en diarios y dentro de oraciones largas."
    pt: "A forma simples é o estilo informal de verbos, adjetivos e substantivos, usado com amigos, em diários e dentro de frases longas."
    fr: "La forme simple est le style familier des verbes, adjectifs et noms, employé entre amis, dans les journaux intimes et à l’intérieur de phrases plus longues."
    de: "Die einfache Form ist der lockere Stil von Verben, Adjektiven und Nomen, verwendet unter Freunden, in Tagebüchern und in längeren Sätzen."
    it: "La forma semplice è lo stile informale di verbi, aggettivi e nomi, usato con gli amici, nei diari e dentro frasi più lunghe."
    pl: "Forma prosta to potoczny styl czasowników, przymiotników i rzeczowników, używany wśród przyjaciół, w pamiętnikach i wewnątrz dłuższych zdań."
    tr: "Yalın biçim; fiillerin, sıfatların ve isimlerin arkadaşlar arasında, günlüklerde ve uzun cümlelerin içinde kullanılan rahat üslubudur."
    id: "Bentuk biasa adalah gaya santai kata kerja, kata sifat, dan kata benda, dipakai dengan teman, dalam buku harian, dan di dalam kalimat yang lebih panjang."
    vi: "Thể thường là lối nói thân mật của động từ, tính từ và danh từ, dùng với bạn bè, trong nhật ký và bên trong những câu dài hơn."
  rule:
    en: "A verb has four plain forms:"
    uk: "Дієслово має чотири прості форми:"
    es: "Un verbo tiene cuatro formas simples:"
    pt: "Um verbo tem quatro formas simples:"
    fr: "Un verbe a quatre formes simples :"
    de: "Ein Verb hat vier einfache Formen:"
    it: "Un verbo ha quattro forme semplici:"
    pl: "Czasownik ma cztery formy proste:"
    tr: "Bir fiilin dört yalın biçimi vardır:"
    id: "Satu kata kerja punya empat bentuk biasa:"
    vi: "Một động từ có bốn thể thường:"
