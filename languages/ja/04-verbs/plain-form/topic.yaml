sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: "Plain forms are the normal style with friends and family; polite forms go with teachers, colleagues and strangers."
              uk: "Прості форми — звичайний стиль з друзями й родиною; ввічливі форми вживають з учителями, колегами й незнайомими."
              es: "Las formas simples son el estilo normal con amigos y familia; las formas corteses van con profesores, colegas y desconocidos."
              pt: "As formas simples são o estilo normal com amigos e família; as formas polidas vão com professores, colegas e desconhecidos."
              fr: "Les formes simples sont le style normal entre amis et en famille ; les formes polies vont avec les professeurs, les collègues et les inconnus."
              de: "Die einfachen Formen sind der normale Stil unter Freunden und in der Familie; die Höflichkeitsformen gehören zu Lehrern, Kollegen und Fremden."
              it: "Le forme semplici sono lo stile normale con amici e familiari; le forme cortesi si usano con insegnanti, colleghi e sconosciuti."
              pl: "Formy proste to normalny styl wśród przyjaciół i w rodzinie; formy grzecznościowe stosuje się wobec nauczycieli, współpracowników i obcych."
              tr: "Yalın biçimler arkadaşlar ve aile arasında olağan üsluptur; nazik biçimler öğretmenlerle, iş arkadaşlarıyla ve yabancılarla kullanılır."
              id: "Bentuk biasa adalah gaya wajar dengan teman dan keluarga; bentuk sopan dipakai dengan guru, rekan kerja, dan orang asing."
              vi: "Thể thường là phong cách bình thường với bạn bè và gia đình; thể lịch sự dùng với thầy cô, đồng nghiệp và người lạ."
            ex: { examples: [["アンナ、あした", { target: [{ kanji: "来", reading: "く" }, "る"] }, { intonation: "rise" }], ["たなか", { kanji: "先生", reading: "せんせい" }, "、あした", { target: [{ kanji: "来", reading: "き" }, "ます"] }, "か。"]] }
            tr: { en: { examples: ["Anna, are you coming tomorrow?", "Tanaka-sensei, are you coming tomorrow?"] }, uk: { examples: ["Анно, ти завтра прийдеш?", "Танака-сенсей, ви завтра прийдете?"] }, es: { examples: ["Anna, ¿vienes mañana?", "Tanaka-sensei, ¿viene usted mañana?"] }, pt: { examples: ["Anna, você vem amanhã?", "Tanaka-sensei, vem amanhã?"] }, fr: { examples: ["Anna, tu viens demain ?", "Tanaka-sensei, vous venez demain ?"] }, de: { examples: ["Anna, kommst du morgen?", "Tanaka-sensei, kommen Sie morgen?"] }, it: { examples: ["Anna, vieni domani?", "Tanaka-sensei, viene domani?"] }, pl: { examples: ["Anno, przyjdziesz jutro?", "Tanaka-sensei, czy pan przyjdzie jutro?"] }, tr: { examples: ["Anna, yarın geliyor musun?", "Tanaka-sensei, yarın gelecek misiniz?"] }, id: { examples: ["Anna, besok kamu datang?", "Tanaka-sensei, apakah besok Anda datang?"] }, vi: { examples: ["Anna, mai bạn có đến không?", "Tanaka-sensei, mai thầy/cô có đến không?"] } }
          - type: "rule"
            level: "A2"
            text:
              en: "The style is set by the last word of a sentence and stays the same through a conversation."
              uk: "Стиль визначає останнє слово речення, і він лишається незмінним протягом розмови."
              es: "El estilo lo fija la última palabra de la oración y se mantiene durante la conversación."
              pt: "O estilo é definido pela última palavra da frase e se mantém durante a conversa."
              fr: "Le style est donné par le dernier mot de la phrase et reste le même pendant toute la conversation."
              de: "Den Stil bestimmt das letzte Wort des Satzes, und er bleibt im ganzen Gespräch gleich."
              it: "Lo stile è fissato dall’ultima parola della frase e resta lo stesso per tutta la conversazione."
              pl: "Styl wyznacza ostatni wyraz zdania i pozostaje taki sam w całej rozmowie."
              tr: "Üslubu cümlenin son sözcüğü belirler ve konuşma boyunca aynı kalır."
              id: "Gaya ditentukan oleh kata terakhir kalimat dan tetap sama sepanjang percakapan."
              vi: "Phong cách do từ cuối câu quyết định và giữ nguyên suốt cuộc trò chuyện."
          - type: "note"
            level: "A2"
            text:
              en: ["The polite forms are in ", { link: "The ます-Form", to: ja.verbs.masu-form }, "; the dictionary form and the groups are in ", { link: "Verb Groups", to: ja.verbs.verb-groups }, "."]
              uk: ["Ввічливі форми — у розділі ", { link: "ます-форма", to: "ja.verbs.masu-form" }, "; словникова форма й групи — у розділі ", { link: "Групи дієслів", to: "ja.verbs.verb-groups" }, "."]
              es: ["Las formas corteses están en ", { link: "La forma ます", to: "ja.verbs.masu-form" }, "; la forma de diccionario y los grupos, en ", { link: "Los grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              pt: ["As formas polidas estão em ", { link: "A forma ます", to: "ja.verbs.masu-form" }, "; a forma de dicionário e os grupos, em ", { link: "Os grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              fr: ["Les formes polies sont dans ", { link: "La forme en ます", to: "ja.verbs.masu-form" }, " ; la forme du dictionnaire et les groupes, dans ", { link: "Les groupes de verbes", to: "ja.verbs.verb-groups" }, "."]
              de: ["Die Höflichkeitsformen stehen in ", { link: "Die ます-Form", to: "ja.verbs.masu-form" }, "; die Grundform und die Gruppen in ", { link: "Die Verbgruppen", to: "ja.verbs.verb-groups" }, "."]
              it: ["Le forme cortesi sono in ", { link: "La forma in ます", to: "ja.verbs.masu-form" }, "; la forma del dizionario e i gruppi, in ", { link: "I gruppi dei verbi", to: "ja.verbs.verb-groups" }, "."]
              pl: ["Formy grzecznościowe są w ", { link: "Forma ます", to: "ja.verbs.masu-form" }, "; forma podstawowa i grupy — w ", { link: "Grupy czasowników", to: "ja.verbs.verb-groups" }, "."]
              tr: ["Nazik biçimler ", { link: "ます biçimi", to: "ja.verbs.masu-form" }, " bölümünde; sözlük biçimi ve gruplar ", { link: "Fiil grupları", to: "ja.verbs.verb-groups" }, " bölümünde."]
              id: ["Bentuk sopan ada di ", { link: "Bentuk ます", to: "ja.verbs.masu-form" }, "; bentuk kamus dan kelompok kata kerja ada di ", { link: "Kelompok kata kerja", to: "ja.verbs.verb-groups" }, "."]
              vi: ["Thể lịch sự ở ", { link: "Thể ます", to: "ja.verbs.masu-form" }, "; thể từ điển và các nhóm động từ ở ", { link: "Nhóm động từ", to: ja.verbs.verb-groups }, "."]
