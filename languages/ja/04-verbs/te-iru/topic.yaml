            tense: { en: "Present", uk: "Теперішній час", es: "Presente", pt: "Presente", fr: "Présent", de: "Präsens", it: "Presente", pl: "Teraźniejszość", tr: "Şimdiki zaman", id: "Sekarang", vi: "Hiện tại" }
            pos: { pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }
            neg: { pattern: [{ slot: "verb" }, { term: "て" }, { term: "いません" }] }
          - level: "A1"
            features: { tense: "pst" }
            tense: { en: "Past", uk: "Минулий час", es: "Pasado", pt: "Passado", fr: "Passé", de: "Vergangenheit", it: "Passato", pl: "Przeszłość", tr: "Geçmiş zaman", id: "Lampau", vi: "Quá khứ" }
            pos: { pattern: [{ slot: "verb" }, { term: "て" }, { term: "いました" }] }
            neg: { pattern: [{ slot: "verb" }, { term: "て" }, { term: "いませんでした" }] }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ています" }, " + ", { term: "か" }, " asks what someone is doing; the answer repeats the verb in ", { term: "ています" }, "."]
              uk: [{ term: "ています" }, " + ", { term: "か" }, " питає, що хтось робить; у відповіді дієслово знову стоїть у ", { term: "ています" }, "."]
              es: [{ term: "ています" }, " + ", { term: "か" }, " pregunta qué hace alguien; la respuesta repite el verbo en ", { term: "ています" }, "."]
              pt: [{ term: "ています" }, " + ", { term: "か" }, " pergunta o que alguém está fazendo; a resposta repete o verbo em ", { term: "ています" }, "."]
              fr: [{ term: "ています" }, " + ", { term: "か" }, " demande ce que fait quelqu’un ; la réponse reprend le verbe en ", { term: "ています" }, "."]
              de: [{ term: "ています" }, " + ", { term: "か" }, " fragt, was jemand tut; die Antwort wiederholt das Verb mit ", { term: "ています" }, "."]
              it: [{ term: "ています" }, " + ", { term: "か" }, " chiede che cosa sta facendo qualcuno; la risposta ripete il verbo con ", { term: "ています" }, "."]
              pl: [{ term: "ています" }, " + ", { term: "か" }, " pyta, co ktoś robi; w odpowiedzi czasownik znów stoi w ", { term: "ています" }, "."]
              tr: [{ term: "ています" }, " + ", { term: "か" }, " birinin ne yaptığını sorar; yanıt fiili yine ", { term: "ています" }, " ile tekrarlar."]
              id: [{ term: "ています" }, " + ", { term: "か" }, " menanyakan apa yang sedang dilakukan seseorang; jawabannya mengulang kata kerja dengan ", { term: "ています" }, "."]
              vi: [{ term: "ています" }, " + ", { term: "か" }, " hỏi ai đó đang làm gì; câu trả lời lặp lại động từ với ", { term: "ています" }, "."]
            ex: { exchange: [[{ kanji: "今", reading: "いま" }, "、", { kanji: "何", reading: "なに" }, "をしていますか。"], [{ kanji: "本", reading: "ほん" }, "を", { target: [{ kanji: "読", reading: "よ" }, "んでいます"] }, "。"]] }
            tr: { en: { exchange: ["What are you doing now?", "I'm reading a book."] }, uk: { exchange: ["Що ти зараз робиш?", "Я читаю книжку."] }, es: { exchange: ["¿Qué estás haciendo ahora?", "Estoy leyendo un libro."] }, pt: { exchange: ["O que você está fazendo agora?", "Estou lendo um livro."] }, fr: { exchange: ["Qu’est-ce que tu fais en ce moment ?", "Je lis un livre."] }, de: { exchange: ["Was machst du gerade?", "Ich lese ein Buch."] }, it: { exchange: ["Che cosa stai facendo adesso?", "Sto leggendo un libro."] }, pl: { exchange: ["Co teraz robisz?", "Czytam książkę."] }, tr: { exchange: ["Şu anda ne yapıyorsun?", "Kitap okuyorum."] }, id: { exchange: ["Sekarang kamu sedang apa?", "Saya sedang membaca buku."] }, vi: { exchange: ["Bây giờ bạn đang làm gì?", "Tôi đang đọc sách."] } }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ていました" }, " says what someone was doing at a past time."]
              uk: [{ term: "ていました" }, " каже, що хтось робив у певний момент минулого."]
              es: [{ term: "ていました" }, " dice lo que alguien estaba haciendo en un momento del pasado."]
              pt: [{ term: "ていました" }, " diz o que alguém estava fazendo em um momento do passado."]
              fr: [{ term: "ていました" }, " dit ce que quelqu’un était en train de faire à un moment du passé."]
              de: [{ term: "ていました" }, " sagt, was jemand zu einem Zeitpunkt der Vergangenheit gerade tat."]
              it: [{ term: "ていました" }, " dice che cosa stava facendo qualcuno in un momento del passato."]
              pl: [{ term: "ていました" }, " mówi, co ktoś robił w pewnym momencie przeszłości."]
              tr: [{ term: "ていました" }, " birinin geçmişte belli bir anda ne yaptığını söyler."]
              id: [{ term: "ていました" }, " menyatakan apa yang sedang dilakukan seseorang pada suatu saat di masa lalu."]
              vi: [{ term: "ていました" }, " cho biết ai đó đang làm gì vào một thời điểm trong quá khứ."]
            ex: { exchange: [["きのうの", { kanji: "夜", reading: "よる" }, "、", { kanji: "何", reading: "なに" }, "をしていましたか。"], ["テレビを", { kanji: "見", reading: "み" }, "て", { target: "いました" }, "。"]] }
            tr: { en: { exchange: ["What were you doing last night?", "I was watching TV."] }, uk: { exchange: ["Що ти робив учора ввечері?", "Я дивився телевізор."] }, es: { exchange: ["¿Qué hacías anoche?", "Estaba viendo la tele."] }, pt: { exchange: ["O que você estava fazendo ontem à noite?", "Eu estava assistindo à TV."] }, fr: { exchange: ["Qu’est-ce que tu faisais hier soir ?", "Je regardais la télé."] }, de: { exchange: ["Was hast du gestern Abend gemacht?", "Ich habe ferngesehen."] }, it: { exchange: ["Che cosa facevi ieri sera?", "Guardavo la TV."] }, pl: { exchange: ["Co robiłeś wczoraj wieczorem?", "Oglądałem telewizję."] }, tr: { exchange: ["Dün akşam ne yapıyordun?", "Televizyon izliyordum."] }, id: { exchange: ["Kemarin malam kamu sedang apa?", "Saya sedang menonton TV."] }, vi: { exchange: ["Tối qua bạn đang làm gì?", "Tôi đang xem tivi."] } }
          - type: "rule"
            level: "A2"
            text:
              en: ["In casual speech the ", { term: "い" }, " of ", { term: "ている" }, " drops: ", { term: [{ kanji: "見", reading: "み" }, "ている"] }, " becomes ", { term: [{ kanji: "見", reading: "み" }, "てる"] }, ". See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["У розмовній мові ", { term: "い" }, " у ", { term: "ている" }, " випадає: ", { term: [{ kanji: "見", reading: "み" }, "ている"] }, " стає ", { term: [{ kanji: "見", reading: "み" }, "てる"] }, ". Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["En el habla informal se cae la ", { term: "い" }, " de ", { term: "ている" }, ": ", { term: [{ kanji: "見", reading: "み" }, "ている"] }, " pasa a ", { term: [{ kanji: "見", reading: "み" }, "てる"] }, ". Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["Na fala informal o ", { term: "い" }, " de ", { term: "ている" }, " cai: ", { term: [{ kanji: "見", reading: "み" }, "ている"] }, " vira ", { term: [{ kanji: "見", reading: "み" }, "てる"] }, ". Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
