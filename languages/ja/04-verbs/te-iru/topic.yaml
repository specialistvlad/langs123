            uk: ["Саме ", { term: "ます" }, " не описує те, що відбувається зараз."]
            es: [{ term: "ます" }, " solo no describe lo que ocurre ahora."]
            pt: [{ term: "ます" }, " sozinho não descreve o que acontece agora."]
            fr: [{ term: "ます" }, " seul ne décrit pas ce qui se passe maintenant."]
            de: [{ term: "ます" }, " allein beschreibt nicht, was gerade geschieht."]
            it: [{ term: "ます" }, " da solo non descrive ciò che accade adesso."]
