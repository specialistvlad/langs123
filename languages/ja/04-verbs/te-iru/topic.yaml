summary:
  lead:
    en: [{ term: "ています" }, " says that an action is in progress or that a state or habit continues; it is the ", { term: "て" }, "-form plus ", { term: "います" }, "."]
    uk: [{ term: "ています" }, " показує, що дія триває, а стан чи звичка зберігається; це ", { term: "て" }, "-форма плюс ", { term: "います" }, "."]
    es: [{ term: "ています" }, " dice que una acción está en curso o que un estado o hábito continúa; es la forma ", { term: "て" }, " más ", { term: "います" }, "."]
    pt: [{ term: "ています" }, " diz que uma ação está em andamento ou que um estado ou hábito continua; é a forma ", { term: "て" }, " mais ", { term: "います" }, "."]
    fr: [{ term: "ています" }, " dit qu’une action est en cours ou qu’un état ou une habitude se poursuit ; c’est la forme en ", { term: "て" }, " plus ", { term: "います" }, "."]
    de: [{ term: "ています" }, " sagt, dass eine Handlung läuft oder ein Zustand oder eine Gewohnheit andauert; es ist die ", { term: "て" }, "-Form plus ", { term: "います" }, "."]
    it: [{ term: "ています" }, " dice che un’azione è in corso o che uno stato o un’abitudine continua; è la forma in ", { term: "て" }, " più ", { term: "います" }, "."]
    pl: [{ term: "ています" }, " mówi, że czynność trwa albo że stan lub zwyczaj się utrzymuje; to forma ", { term: "て" }, " plus ", { term: "います" }, "."]
    tr: [{ term: "ています" }, " bir eylemin sürdüğünü ya da bir durumun veya alışkanlığın devam ettiğini söyler; ", { term: "て" }, " biçimi artı ", { term: "います" }, " yapısıdır."]
    id: [{ term: "ています" }, " menyatakan bahwa suatu tindakan sedang berlangsung atau suatu keadaan atau kebiasaan berlanjut; bentuknya ", { term: "て" }, " ditambah ", { term: "います" }, "."]
    vi: [{ term: "ています" }, " cho biết một hành động đang diễn ra hoặc một trạng thái, thói quen vẫn tiếp tục; đó là thể ", { term: "て" }, " cộng ", { term: "います" }, "."]
  rule:
    en: ["Put the verb in the ", { term: "て" }, "-form and add ", { term: "います" }, ":"]
    uk: ["Постав дієслово в ", { term: "て" }, "-форму й додай ", { term: "います" }, ":"]
    es: ["Pon el verbo en forma ", { term: "て" }, " y añade ", { term: "います" }, ":"]
    pt: ["Ponha o verbo na forma ", { term: "て" }, " e acrescente ", { term: "います" }, ":"]
    fr: ["Mettez le verbe à la forme en ", { term: "て" }, " et ajoutez ", { term: "います" }, " :"]
    de: ["Setze das Verb in die ", { term: "て" }, "-Form und füge ", { term: "います" }, " an:"]
    it: ["Metti il verbo nella forma in ", { term: "て" }, " e aggiungi ", { term: "います" }, ":"]
    pl: ["Postaw czasownik w formie ", { term: "て" }, " i dodaj ", { term: "います" }, ":"]
    tr: ["Fiili ", { term: "て" }, " biçimine koy ve ", { term: "います" }, " ekle:"]
    id: ["Letakkan kata kerja dalam bentuk ", { term: "て" }, " dan tambahkan ", { term: "います" }, ":"]
    vi: ["Đặt động từ ở thể ", { term: "て" }, " rồi thêm ", { term: "います" }, ":"]
