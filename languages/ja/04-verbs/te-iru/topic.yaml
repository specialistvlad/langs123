              es: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " («enterarse») en ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " significa «saber, conocer»; la negación es ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              pt: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " («ficar sabendo») em ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " significa «saber, conhecer»; a negativa é ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              fr: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " (« apprendre ») dans ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " veut dire « savoir, connaître » ; la négation est ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              de: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " („erfahren“) bedeutet in ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " „wissen, kennen“; die Verneinung ist ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              it: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " («venire a sapere») in ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " significa «sapere, conoscere»; la negazione è ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              pl: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " („dowiedzieć się”) w ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " znaczy „wiedzieć, znać”; przeczenie to ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              tr: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " (“öğrenmek”) ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " biçiminde “bilmek, tanımak” demektir; olumsuzu ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, " biçimidir."]
              id: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " (“mengetahui”) dalam ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " berarti “tahu, kenal”; negatifnya ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
              vi: [{ term: [{ kanji: "知", reading: "し" }, "る"] }, " (“biết được”) trong ", { term: [{ kanji: "知", reading: "し" }, "っています"] }, " nghĩa là “biết, quen”; phủ định là ", { term: [{ kanji: "知", reading: "し" }, "りません"] }, "."]
            ex: { exchange: [["アンナさんを", { kanji: "知", reading: "し" }, "っていますか。"], ["いいえ、", { target: [{ kanji: "知", reading: "し" }, "りません"] }, "。"]] }
            tr: { en: { exchange: ["Do you know Anna?", "No, I don't."] }, uk: { exchange: ["Ти знаєш Анну?", "Ні, не знаю."] }, es: { exchange: ["¿Conoces a Anna?", "No, no la conozco."] }, pt: { exchange: ["Você conhece a Anna?", "Não, não conheço."] }, fr: { exchange: ["Tu connais Anna ?", "Non, je ne la connais pas."] }, de: { exchange: ["Kennst du Anna?", "Nein, ich kenne sie nicht."] }, it: { exchange: ["Conosci Anna?", "No, non la conosco."] }, pl: { exchange: ["Znasz Annę?", "Nie, nie znam."] }, tr: { exchange: ["Anna'yı tanıyor musun?", "Hayır, tanımıyorum."] }, id: { exchange: ["Apakah kamu kenal Anna?", "Tidak, saya tidak kenal."] }, vi: { exchange: ["Bạn có biết Anna không?", "Không, tôi không biết."] } }
