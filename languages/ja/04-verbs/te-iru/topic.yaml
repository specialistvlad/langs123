          tr: { en: "I'm watching TV.", uk: "Я дивлюся телевізор.", es: "Estoy viendo la tele.", pt: "Estou assistindo à TV.", fr: "Je regarde la télé.", de: "Ich sehe fern.", it: "Sto guardando la TV.", pl: "Oglądam telewizję.", tr: "Televizyon izliyorum.", id: "Saya sedang menonton TV.", vi: "Tôi đang xem tivi." }
        - level: "A1"
