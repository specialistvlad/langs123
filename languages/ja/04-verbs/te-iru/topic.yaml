      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " says that an action is in progress."]
              uk: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " показує, що дія триває."]
              es: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " dice que una acción está en curso."]
              pt: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " diz que uma ação está em andamento."]
              fr: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " dit qu’une action est en cours."]
              de: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " sagt, dass eine Handlung läuft."]
              it: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " dice che un’azione è in corso."]
              pl: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " mówi, że czynność trwa."]
              tr: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " bir eylemin sürdüğünü söyler."]
              id: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " menyatakan bahwa suatu tindakan sedang berlangsung."]
              vi: [{ pattern: [{ slot: "verb" }, { term: "て" }, { term: "います" }] }, " cho biết một hành động đang diễn ra."]
            ex: [{ kanji: "今", reading: "いま" }, "、テレビを", { target: [{ kanji: "見", reading: "み" }, "ています"] }, "。"]
            tr: { en: "I am watching TV now.", uk: "Я зараз дивлюся телевізор.", es: "Ahora estoy viendo la tele.", pt: "Agora estou assistindo à TV.", fr: "Je regarde la télé en ce moment.", de: "Ich sehe gerade fern.", it: "Adesso sto guardando la TV.", pl: "Teraz oglądam telewizję.", tr: "Şu anda televizyon izliyorum.", id: "Sekarang saya sedang menonton TV.", vi: "Bây giờ tôi đang xem tivi." }
          - type: "rule"
            level: "A1"
            text:
              en: "The same pattern says where someone lives and works."
              uk: "Така сама модель каже, де хтось живе й працює."
              es: "La misma estructura dice dónde vive y trabaja alguien."
              pt: "A mesma estrutura diz onde alguém mora e trabalha."
              fr: "La même structure dit où quelqu’un habite et travaille."
              de: "Dasselbe Muster sagt, wo jemand wohnt und arbeitet."
              it: "Lo stesso schema dice dove qualcuno abita e lavora."
              pl: "Ten sam wzór mówi, gdzie ktoś mieszka i pracuje."
              tr: "Aynı kalıp, birinin nerede yaşadığını ve çalıştığını söyler."
              id: "Pola yang sama menyatakan di mana seseorang tinggal dan bekerja."
              vi: "Cùng mẫu này cho biết ai đó sống và làm việc ở đâu."
            ex: [{ kanji: "会社", reading: "かいしゃ" }, "で", { target: [{ kanji: "働", reading: "はたら" }, "いています"] }, "。"]
            tr: { en: "I work at a company.", uk: "Я працюю в компанії.", es: "Trabajo en una empresa.", pt: "Trabalho em uma empresa.", fr: "Je travaille dans une entreprise.", de: "Ich arbeite in einer Firma.", it: "Lavoro in un’azienda.", pl: "Pracuję w firmie.", tr: "Bir şirkette çalışıyorum.", id: "Saya bekerja di sebuah perusahaan.", vi: "Tôi làm việc ở một công ty." }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ます" }, " alone speaks of habits and plans; ", { term: "ています" }, " speaks of what is happening now."]
              uk: ["Саме ", { term: "ます" }, " говорить про звички й плани; ", { term: "ています" }, " — про те, що відбувається зараз."]
              es: [{ term: "ます" }, " solo habla de hábitos y planes; ", { term: "ています" }, ", de lo que ocurre ahora."]
              pt: [{ term: "ます" }, " sozinho fala de hábitos e planos; ", { term: "ています" }, ", do que acontece agora."]
              fr: [{ term: "ます" }, " seul parle d’habitudes et de projets ; ", { term: "ています" }, ", de ce qui se passe maintenant."]
              de: [{ term: "ます" }, " allein spricht von Gewohnheiten und Plänen; ", { term: "ています" }, " von dem, was gerade geschieht."]
              it: [{ term: "ます" }, " da solo parla di abitudini e piani; ", { term: "ています" }, ", di ciò che accade adesso."]
              pl: ["Samo ", { term: "ます" }, " mówi o zwyczajach i planach; ", { term: "ています" }, " — o tym, co dzieje się teraz."]
              tr: ["Tek başına ", { term: "ます" }, " alışkanlıklardan ve planlardan söz eder; ", { term: "ています" }, " şu anda olanı anlatır."]
              id: [{ term: "ます" }, " saja berbicara tentang kebiasaan dan rencana; ", { term: "ています" }, " tentang apa yang sedang terjadi sekarang."]
              vi: ["Riêng ", { term: "ます" }, " nói về thói quen và kế hoạch; ", { term: "ています" }, " nói về điều đang xảy ra lúc này."]
            ex: { examples: [[{ kanji: "毎朝", reading: "まいあさ" }, "、コーヒーを", { kanji: "飲", reading: "の" }, "みます。"], [{ kanji: "今", reading: "いま" }, "、コーヒーを", { target: [{ kanji: "飲", reading: "の" }, "んでいます"] }, "。"]] }
            tr: { en: { examples: ["I drink coffee every morning.", "I am drinking coffee now."] }, uk: { examples: ["Щоранку я п’ю каву.", "Зараз я п’ю каву."] }, es: { examples: ["Todas las mañanas tomo café.", "Ahora estoy tomando café."] }, pt: { examples: ["Todas as manhãs eu tomo café.", "Agora estou tomando café."] }, fr: { examples: ["Tous les matins, je bois un café.", "Je bois un café en ce moment."] }, de: { examples: ["Jeden Morgen trinke ich Kaffee.", "Ich trinke gerade Kaffee."] }, it: { examples: ["Ogni mattina bevo un caffè.", "Adesso sto bevendo un caffè."] }, pl: { examples: ["Co rano piję kawę.", "Teraz piję kawę."] }, tr: { examples: ["Her sabah kahve içerim.", "Şu anda kahve içiyorum."] }, id: { examples: ["Setiap pagi saya minum kopi.", "Sekarang saya sedang minum kopi."] }, vi: { examples: ["Sáng nào tôi cũng uống cà phê.", "Bây giờ tôi đang uống cà phê."] } }
          - type: "rule"
            level: "A2"
            text:
              en: "With verbs of change it says that the result lasts: someone is married, has something or wears something."
              uk: "З дієсловами зміни воно каже, що результат триває: хтось одружений, має щось або носить щось."
              es: "Con verbos de cambio dice que el resultado dura: alguien está casado, tiene algo o lleva algo puesto."
              pt: "Com verbos de mudança diz que o resultado permanece: alguém é casado, tem algo ou veste algo."
              fr: "Avec les verbes de changement, il dit que le résultat dure : on est marié, on possède ou on porte quelque chose."
              de: "Bei Verben der Veränderung sagt es, dass das Ergebnis andauert: jemand ist verheiratet, hat etwas oder trägt etwas."
              it: "Con i verbi di cambiamento dice che il risultato dura: qualcuno è sposato, ha qualcosa o indossa qualcosa."
              pl: "Przy czasownikach zmiany mówi, że rezultat trwa: ktoś jest żonaty, coś ma lub coś nosi."
              tr: "Değişim fiilleriyle sonucun sürdüğünü söyler: biri evlidir, bir şeye sahiptir ya da bir şey giyer."
              id: "Dengan kata kerja perubahan, bentuk ini menyatakan bahwa hasilnya bertahan: seseorang sudah menikah, memiliki sesuatu, atau memakai sesuatu."
              vi: "Với động từ biến đổi, nó cho biết kết quả vẫn còn: ai đó đã kết hôn, đang có hoặc đang mặc thứ gì."
            ex: ["アンナさんは", { target: [{ kanji: "結婚", reading: "けっこん" }, "しています"] }, "。"]
            tr: { en: "Anna is married.", uk: "Анна заміжня.", es: "Anna está casada.", pt: "A Anna é casada.", fr: "Anna est mariée.", de: "Anna ist verheiratet.", it: "Anna è sposata.", pl: "Anna jest mężatką.", tr: "Anna evli.", id: "Anna sudah menikah.", vi: "Anna đã kết hôn." }
          - type: "note"
            level: "A1"
            text:
              en: ["How to build the ", { term: "て" }, "-form: see ", { link: "The て-Form", to: ja.verbs.te-form }, "."]
              uk: ["Як утворити ", { term: "て" }, "-форму: див. ", { link: "て-форма", to: "ja.verbs.te-form" }, "."]
              es: ["Cómo formar la forma ", { term: "て" }, ": véase ", { link: "La forma て", to: "ja.verbs.te-form" }, "."]
              pt: ["Como formar a forma ", { term: "て" }, ": veja ", { link: "A forma て", to: "ja.verbs.te-form" }, "."]
              fr: ["Former la forme en ", { term: "て" }, " : voir ", { link: "La forme en て", to: "ja.verbs.te-form" }, "."]
              de: ["So wird die ", { term: "て" }, "-Form gebildet: siehe ", { link: "Die て-Form", to: "ja.verbs.te-form" }, "."]
              it: ["Come formare la forma in ", { term: "て" }, ": vedi ", { link: "La forma in て", to: "ja.verbs.te-form" }, "."]
              pl: ["Jak tworzyć formę ", { term: "て" }, ": zob. ", { link: "Forma て", to: "ja.verbs.te-form" }, "."]
              tr: [{ term: "て" }, " biçiminin kurulumu: bkz. ", { link: "て biçimi", to: "ja.verbs.te-form" }, "."]
              id: ["Cara membentuk bentuk ", { term: "て" }, ": lihat ", { link: "Bentuk て", to: "ja.verbs.te-form" }, "."]
              vi: ["Cách tạo thể ", { term: "て" }, ": xem ", { link: "Thể て", to: "ja.verbs.te-form" }, "."]
  - title:
      en: "Form: ています"
