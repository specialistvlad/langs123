          - { key: "tense", label: { en: "Tense", uk: "Час", es: "Tiempo", pt: "Tempo", fr: "Temps", de: "Zeit", it: "Tempo", pl: "Czas", tr: "Zaman", id: "Waktu", vi: "Thì" } }
          - key: "pos"
