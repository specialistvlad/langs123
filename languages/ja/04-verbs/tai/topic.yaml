          tr: { en: "I don’t want to go to Japan.", uk: "Я не хочу їхати до Японії.", es: "No quiero ir a Japón.", pt: "Não quero ir ao Japão.", fr: "Je ne veux pas aller au Japon.", de: "Ich möchte nicht nach Japan fahren.", it: "Non voglio andare in Giappone.", pl: "Nie chcę jechać do Japonii.", tr: "Japonya’ya gitmek istemiyorum.", id: "Saya tidak ingin pergi ke Jepang.", vi: "Tôi không muốn đi Nhật Bản." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["The stem plus ", { term: "たい" }, " means “want to do”; the polite sentence ends with ", { term: "です" }, "."]
              uk: ["Основа плюс ", { term: "たい" }, " означає «хотіти зробити»; ввічливе речення закінчується на ", { term: "です" }, "."]
              es: ["La raíz más ", { term: "たい" }, " significa «querer hacer»; la oración cortés termina con ", { term: "です" }, "."]
              pt: ["O radical mais ", { term: "たい" }, " significa «querer fazer»; a frase polida termina com ", { term: "です" }, "."]
              fr: ["Le radical plus ", { term: "たい" }, " signifie « vouloir faire » ; la phrase polie se termine par ", { term: "です" }, "."]
              de: ["Der Stamm plus ", { term: "たい" }, " bedeutet „tun wollen“; der höfliche Satz endet auf ", { term: "です" }, "."]
              it: ["La radice più ", { term: "たい" }, " significa «voler fare»; la frase cortese finisce con ", { term: "です" }, "."]
              pl: ["Temat plus ", { term: "たい" }, " znaczy „chcieć zrobić”; grzeczne zdanie kończy się na ", { term: "です" }, "."]
              tr: ["Kök artı ", { term: "たい" }, " “yapmak istemek” anlamına gelir; nazik cümle ", { term: "です" }, " ile biter."]
              id: ["Bentuk dasar plus ", { term: "たい" }, " berarti “ingin melakukan”; kalimat sopan diakhiri ", { term: "です" }, "."]
              vi: ["Thân động từ cộng ", { term: "たい" }, " nghĩa là “muốn làm”; câu lịch sự kết thúc bằng ", { term: "です" }, "."]
            ex: [{ kanji: "日本", reading: "にほん" }, "へ", { kanji: "行", reading: "い" }, "き", { target: "たい" }, "です。"]
            tr: { en: "I want to go to Japan.", uk: "Я хочу поїхати до Японії.", es: "Quiero ir a Japón.", pt: "Quero ir ao Japão.", fr: "Je veux aller au Japon.", de: "Ich möchte nach Japan fahren.", it: "Voglio andare in Giappone.", pl: "Chcę pojechać do Japonii.", tr: "Japonya’ya gitmek istiyorum.", id: "Saya ingin pergi ke Jepang.", vi: "Tôi muốn đi Nhật Bản." }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "たい" }, " belongs to the speaker; in a question it asks about the listener’s wish."]
              uk: [{ term: "たい" }, " належить мовцю; у питанні воно стосується бажання співрозмовника."]
              es: [{ term: "たい" }, " es de quien habla; en una pregunta se refiere al deseo del oyente."]
              pt: [{ term: "たい" }, " é de quem fala; numa pergunta refere-se ao desejo do ouvinte."]
              fr: [{ term: "たい" }, " appartient au locuteur ; dans une question, il porte sur le souhait de l’interlocuteur."]
              de: [{ term: "たい" }, " gehört dem Sprecher; in einer Frage geht es um den Wunsch des Hörers."]
              it: [{ term: "たい" }, " appartiene a chi parla; in una domanda riguarda il desiderio dell’ascoltatore."]
              pl: [{ term: "たい" }, " należy do mówiącego; w pytaniu dotyczy pragnienia słuchacza."]
              tr: [{ term: "たい" }, " konuşana aittir; soruda dinleyenin isteğini sorar."]
              id: [{ term: "たい" }, " milik pembicara; dalam pertanyaan, ia menanyakan keinginan lawan bicara."]
              vi: [{ term: "たい" }, " thuộc về người nói; trong câu hỏi, nó hỏi mong muốn của người nghe."]
            ex: [{ kanji: "何", reading: "なに" }, "を", { kanji: "食", reading: "た" }, "べ", { target: "たい" }, "ですか。"]
            tr: { en: "What do you want to eat?", uk: "Що ви хочете з’їсти?", es: "¿Qué quiere comer?", pt: "O que você quer comer?", fr: "Qu’est-ce que vous voulez manger ?", de: "Was möchten Sie essen?", it: "Che cosa vuole mangiare?", pl: "Co chce Pan(i) zjeść?", tr: "Ne yemek istersiniz?", id: "Anda ingin makan apa?", vi: "Bạn muốn ăn gì?" }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "たい" }, " changes like an い-adjective: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, ")."]
              uk: [{ term: "たい" }, " змінюється як い-прикметник: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, ")."]
              es: [{ term: "たい" }, " cambia como un adjetivo い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, ")."]
              pt: [{ term: "たい" }, " muda como um adjetivo い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, ")."]
              fr: [{ term: "たい" }, " se conjugue comme un adjectif en い : ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, ")."]
              de: [{ term: "たい" }, " verändert sich wie ein い-Adjektiv: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, ")."]
              it: [{ term: "たい" }, " cambia come un aggettivo in い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, ")."]
              pl: [{ term: "たい" }, " zmienia się jak przymiotnik い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, ")."]
              tr: [{ term: "たい" }, ", bir い sıfatı gibi çekimlenir: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, ")."]
              id: [{ term: "たい" }, " berubah seperti kata sifat い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, ")."]
              vi: [{ term: "たい" }, " biến đổi như tính từ い: ", { term: "たくない" }, ", ", { term: "たかった" }, " (", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, ")."]
            ex: ["ビールは", { kanji: "飲", reading: "の" }, "み", { target: "たくない" }, "です。"]
            tr: { en: "I don’t want to drink beer.", uk: "Я не хочу пити пиво.", es: "No quiero beber cerveza.", pt: "Não quero beber cerveja.", fr: "Je ne veux pas boire de bière.", de: "Ich möchte kein Bier trinken.", it: "Non voglio bere birra.", pl: "Nie chcę pić piwa.", tr: "Bira içmek istemiyorum.", id: "Saya tidak ingin minum bir.", vi: "Tôi không muốn uống bia." }
