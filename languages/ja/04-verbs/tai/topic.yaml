    es: ["La raíz más ", { term: "たい" }, " dice lo que quien habla quiere hacer y cambia como un adjetivo い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    pt: ["O radical mais ", { term: "たい" }, " diz o que quem fala quer fazer e muda como um adjetivo い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    fr: ["Le radical plus ", { term: "たい" }, " dit ce que le locuteur veut faire et se conjugue comme un adjectif en い : ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    de: ["Der Stamm plus ", { term: "たい" }, " sagt, was der Sprecher tun möchte, und verändert sich wie ein い-Adjektiv: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    it: ["La radice più ", { term: "たい" }, " dice che cosa vuole fare chi parla e cambia come un aggettivo in い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    pl: ["Temat plus ", { term: "たい" }, " mówi, co mówiący chce zrobić, i zmienia się jak przymiotnik い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    tr: ["Kök artı ", { term: "たい" }, " konuşanın ne yapmak istediğini söyler ve bir い sıfatı gibi çekimlenir: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    id: ["Bentuk dasar ditambah ", { term: "たい" }, " menyatakan apa yang ingin dilakukan pembicara, dan berubah seperti kata sifat い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
    vi: ["Thân động từ cộng ", { term: "たい" }, " nói người nói muốn làm gì, và biến đổi như tính từ い: ", { term: "たくない" }, ", ", { term: "たかった" }, "."]
  rule:
    en: ["The stem takes ", { term: "たい" }, ", and the polite sentence closes with ", { term: "です" }, ":"]
    uk: ["Основа приймає ", { term: "たい" }, ", а ввічливе речення закінчується на ", { term: "です" }, ":"]
    es: ["La raíz toma ", { term: "たい" }, " y la oración cortés termina con ", { term: "です" }, ":"]
    pt: ["O radical recebe ", { term: "たい" }, " e a frase polida termina com ", { term: "です" }, ":"]
    fr: ["Le radical prend ", { term: "たい" }, " et la phrase polie se termine par ", { term: "です" }, " :"]
    de: ["Der Stamm bekommt ", { term: "たい" }, ", und der höfliche Satz endet auf ", { term: "です" }, ":"]
    it: ["La radice prende ", { term: "たい" }, " e la frase cortese finisce con ", { term: "です" }, ":"]
    pl: ["Temat przyjmuje ", { term: "たい" }, ", a grzeczne zdanie kończy się na ", { term: "です" }, ":"]
    tr: ["Köke ", { term: "たい" }, " eklenir ve nazik cümle ", { term: "です" }, " ile biter:"]
    id: ["Bentuk dasar menerima ", { term: "たい" }, ", dan kalimat sopan ditutup dengan ", { term: "です" }, ":"]
    vi: ["Thân động từ nhận ", { term: "たい" }, ", và câu lịch sự kết thúc bằng ", { term: "です" }, ":"]
  ex: ["コーヒーを", { kanji: "飲", reading: "の" }, "み", { target: "たい" }, "です。"]
