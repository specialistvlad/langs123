            pos: { pattern: [{ slot: { en: "stem", uk: "основа", es: "raíz", pt: "radical", fr: "radical", de: "Stamm", it: "radice", pl: "temat", tr: "kök", id: "bentuk dasar", vi: "thân động từ" } }, { term: "たかったです" }] }
            neg: { pattern: [{ slot: { en: "stem", uk: "основа", es: "raíz", pt: "radical", fr: "radical", de: "Stamm", it: "radice", pl: "temat", tr: "kök", id: "bentuk dasar", vi: "thân động từ" } }, { term: "たくなかったです" }] }
      - type: "usage"
