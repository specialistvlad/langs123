            tr: { en: "I want to drink coffee.", uk: "Я хочу випити кави.", es: "Quiero tomar un café.", pt: "Quero tomar um café.", fr: "Je veux boire un café.", de: "Ich möchte Kaffee trinken.", it: "Voglio bere un caffè.", pl: "Chcę napić się kawy.", tr: "Kahve içmek istiyorum.", id: "Saya ingin minum kopi.", vi: "Tôi muốn uống cà phê." }
          - level: "A1"
            dict: [{ kanji: "食", reading: "た" }, "べる"]
            tai: [{ kanji: "食", reading: "た" }, "べ", { target: "たい" }]
            ex: ["すしを", { kanji: "食", reading: "た" }, "べ", { target: "たい" }, "です。"]
            tr: { en: "I want to eat sushi.", uk: "Я хочу з’їсти суші.", es: "Quiero comer sushi.", pt: "Quero comer sushi.", fr: "Je veux manger des sushis.", de: "Ich möchte Sushi essen.", it: "Voglio mangiare sushi.", pl: "Chcę zjeść sushi.", tr: "Suşi yemek istiyorum.", id: "Saya ingin makan sushi.", vi: "Tôi muốn ăn sushi." }
          - level: "A1"
            dict: [{ kanji: "行", reading: "い" }, "く"]
            tai: [{ kanji: "行", reading: "い" }, "き", { target: "たい" }]
            ex: [{ kanji: "日本", reading: "にほん" }, "へ", { kanji: "行", reading: "い" }, "き", { target: "たい" }, "です。"]
            tr: { en: "I want to go to Japan.", uk: "Я хочу поїхати до Японії.", es: "Quiero ir a Japón.", pt: "Quero ir ao Japão.", fr: "Je veux aller au Japon.", de: "Ich möchte nach Japan fahren.", it: "Voglio andare in Giappone.", pl: "Chcę pojechać do Japonii.", tr: "Japonya’ya gitmek istiyorum.", id: "Saya ingin pergi ke Jepang.", vi: "Tôi muốn đi Nhật Bản." }
          - level: "A1"
            dict: "する"
            tai: ["し", { target: "たい" }]
            ex: ["ゲームをし", { target: "たい" }, "です。"]
            tr: { en: "I want to play a game.", uk: "Я хочу пограти в гру.", es: "Quiero jugar a un juego.", pt: "Quero jogar um jogo.", fr: "Je veux jouer à un jeu.", de: "Ich möchte ein Spiel spielen.", it: "Voglio giocare a un gioco.", pl: "Chcę zagrać w grę.", tr: "Oyun oynamak istiyorum.", id: "Saya ingin main game.", vi: "Tôi muốn chơi game." }
          - level: "A1"
            dict: [{ kanji: "来", reading: "く" }, "る"]
            tai: [{ kanji: "来", reading: "き" }, { target: "たい" }]
            ex: ["また", { kanji: "来", reading: "き" }, { target: "たい" }, "です。"]
            tr: { en: "I want to come again.", uk: "Я хочу прийти ще раз.", es: "Quiero volver.", pt: "Quero voltar.", fr: "Je veux revenir.", de: "Ich möchte wiederkommen.", it: "Voglio tornare.", pl: "Chcę tu jeszcze przyjść.", tr: "Tekrar gelmek istiyorum.", id: "Saya ingin datang lagi.", vi: "Tôi muốn đến lần nữa." }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["The stem is the ", { term: "ます" }, "-form without ", { term: "ます" }, ", so every verb group follows one rule (", { link: "The ます-Form", to: ja.verbs.masu-form }, ", ", { link: "Verb Groups", to: ja.verbs.verb-groups }, ")."]
              uk: ["Основа — це ", { term: "ます" }, "-форма без ", { term: "ます" }, ", тому всі групи дієслів підпорядковуються одному правилу (", { link: "ます-форма", to: "ja.verbs.masu-form" }, ", ", { link: "Групи дієслів", to: "ja.verbs.verb-groups" }, ")."]
              es: ["La raíz es la forma ", { term: "ます" }, " sin ", { term: "ます" }, ", así que todos los grupos de verbos siguen una sola regla (", { link: "La forma ます", to: "ja.verbs.masu-form" }, ", ", { link: "Los grupos de verbos", to: "ja.verbs.verb-groups" }, ")."]
              pt: ["O radical é a forma ", { term: "ます" }, " sem ", { term: "ます" }, ", por isso todos os grupos de verbos seguem uma só regra (", { link: "A forma ます", to: "ja.verbs.masu-form" }, ", ", { link: "Os grupos de verbos", to: "ja.verbs.verb-groups" }, ")."]
              fr: ["Le radical est la forme en ", { term: "ます" }, " sans ", { term: "ます" }, " ; tous les groupes de verbes suivent donc une seule règle (", { link: "La forme en ます", to: "ja.verbs.masu-form" }, ", ", { link: "Les groupes de verbes", to: "ja.verbs.verb-groups" }, ")."]
              de: ["Der Stamm ist die ", { term: "ます" }, "-Form ohne ", { term: "ます" }, "; alle Verbgruppen folgen also einer Regel (", { link: "Die ます-Form", to: "ja.verbs.masu-form" }, ", ", { link: "Die Verbgruppen", to: "ja.verbs.verb-groups" }, ")."]
              it: ["La radice è la forma in ", { term: "ます" }, " senza ", { term: "ます" }, ", perciò tutti i gruppi di verbi seguono una sola regola (", { link: "La forma in ます", to: "ja.verbs.masu-form" }, ", ", { link: "I gruppi dei verbi", to: "ja.verbs.verb-groups" }, ")."]
              pl: ["Temat to forma forma ", { term: "ます" }, " bez ", { term: "ます" }, ", więc wszystkie grupy czasowników podlegają jednej zasadzie (", { link: "Forma ます", to: "ja.verbs.masu-form" }, ", ", { link: "Grupy czasowników", to: "ja.verbs.verb-groups" }, ")."]
              tr: ["Kök, ", { term: "ます" }, " atılmış ", { term: "ます" }, " biçimi biçimidir; böylece bütün fiil grupları tek kurala uyar (", { link: "ます biçimi", to: "ja.verbs.masu-form" }, ", ", { link: "Fiil grupları", to: "ja.verbs.verb-groups" }, ")."]
              id: ["Bentuk dasar adalah bentuk ", { term: "ます" }, " tanpa ", { term: "ます" }, ", sehingga semua golongan kata kerja mengikuti satu aturan (", { link: "Bentuk ます", to: "ja.verbs.masu-form" }, ", ", { link: "Kelompok kata kerja", to: ja.verbs.verb-groups }, ")."]
              vi: ["Thân động từ là thể ", { term: "ます" }, " bỏ ", { term: "ます" }, ", nên mọi nhóm động từ theo một quy tắc (", { link: "Thể ます", to: "ja.verbs.masu-form" }, ", ", { link: "Nhóm động từ", to: ja.verbs.verb-groups }, ")."]
            ex: [{ kanji: "来", reading: "き" }, { target: "たい" }, "です。"]
            tr: { en: "I want to come again.", uk: "Я хочу прийти ще раз.", es: "Quiero volver.", pt: "Quero voltar.", fr: "Je veux revenir.", de: "Ich möchte wiederkommen.", it: "Voglio tornare.", pl: "Chcę tu jeszcze przyjść.", tr: "Tekrar gelmek istiyorum.", id: "Saya ingin datang lagi.", vi: "Tôi muốn đến lần nữa." }
          - type: "rule"
            level: "A2"
            text:
              en: ["In plain speech the same forms stand without ", { term: "です" }, ": ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "The Plain Form", to: ja.verbs.plain-form }, ")."]
              uk: ["У простій мові ті самі форми стоять без ", { term: "です" }, ": ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "Проста форма", to: "ja.verbs.plain-form" }, ")."]
              es: ["En el habla simple las mismas formas van sin ", { term: "です" }, ": ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "La forma simple", to: "ja.verbs.plain-form" }, ")."]
              pt: ["Na fala simples as mesmas formas ficam sem ", { term: "です" }, ": ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "A forma simples", to: "ja.verbs.plain-form" }, ")."]
              fr: ["Dans le style simple, les mêmes formes se passent de ", { term: "です" }, " : ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "La forme simple", to: "ja.verbs.plain-form" }, ")."]
              de: ["In der einfachen Rede stehen dieselben Formen ohne ", { term: "です" }, ": ", { term: [{ kanji: "食", reading: "た" }, "べたい"] }, ", ", { term: [{ kanji: "食", reading: "た" }, "べたくない"] }, " (", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, ")."]
