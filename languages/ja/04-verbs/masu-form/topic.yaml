      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["A time word of the past goes with ", { term: "ました" }, "; habits, today and the future go with ", { term: "ます" }, "."]
              uk: ["Слово минулого часу йде з ", { term: "ました" }, "; звичні дії, сьогодення й майбутнє — з ", { term: "ます" }, "."]
              es: ["Una palabra de tiempo pasado va con ", { term: "ました" }, "; los hábitos, el presente y el futuro, con ", { term: "ます" }, "."]
              pt: ["Uma palavra de tempo passado vai com ", { term: "ました" }, "; hábitos, presente e futuro vão com ", { term: "ます" }, "."]
              fr: ["Un mot de temps passé va avec ", { term: "ました" }, " ; les habitudes, le présent et le futur vont avec ", { term: "ます" }, "."]
              de: ["Ein Zeitwort der Vergangenheit steht mit ", { term: "ました" }, "; Gewohnheiten, Gegenwart und Zukunft mit ", { term: "ます" }, "."]
              it: ["Una parola di tempo passato va con ", { term: "ました" }, "; abitudini, presente e futuro vanno con ", { term: "ます" }, "."]
              pl: ["Określenie czasu przeszłego idzie z ", { term: "ました" }, "; zwyczaje, teraźniejszość i przyszłość — z ", { term: "ます" }, "."]
              tr: ["Geçmiş zaman sözcüğü ", { term: "ました" }, " ile gider; alışkanlık, şimdi ve gelecek ", { term: "ます" }, " ile gider."]
              id: ["Kata waktu lampau berpasangan dengan ", { term: "ました" }, "; kebiasaan, masa kini, dan masa depan dengan ", { term: "ます" }, "."]
              vi: ["Từ chỉ thời gian quá khứ đi với ", { term: "ました" }, "; thói quen, hiện tại và tương lai đi với ", { term: "ます" }, "."]
          - type: "rule"
            level: "A1"
            text:
              en: ["A clock time takes ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " and words with ", { term: "毎" }, " take no particle. See ", { link: "Particles を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              uk: ["Точний час стоїть з ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " і слова з ", { term: "毎" }, " вживають без частки. Див. ", { link: "Частки を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              es: ["La hora del reloj lleva ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " y las palabras con ", { term: "毎" }, " van sin partícula. Véase ", { link: "Las partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pt: ["A hora do relógio leva ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " e as palavras com ", { term: "毎" }, " ficam sem partícula. Veja ", { link: "As partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              fr: ["L’heure de l’horloge prend ", { term: "に" }, " ; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " et les mots en ", { term: "毎" }, " se disent sans particule. Voir ", { link: "Les particules を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              de: ["Eine Uhrzeit steht mit ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " und Wörter mit ", { term: "毎" }, " stehen ohne Partikel. Siehe ", { link: "Die Partikeln を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              it: ["L'ora dell'orologio prende ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " e le parole con ", { term: "毎" }, " stanno senza particella. Vedi ", { link: "Le particelle を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pl: ["Godzina zegarowa łączy się z ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " i słowa z ", { term: "毎" }, " występują bez partykuły. Zob. ", { link: "Partykuły を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              tr: ["Saat bildiren zaman ", { term: "に" }, " alır; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " ve ", { term: "毎" }, " ile başlayan sözcükler edatsız kullanılır. Bkz. ", { link: "を, に, で, へ edatları", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              id: ["Jam tertentu memakai ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, ", dan kata dengan ", { term: "毎" }, " dipakai tanpa partikel. Lihat ", { link: "Partikel を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              vi: ["Giờ đồng hồ đi với ", { term: "に" }, "; ", { term: { kanji: "今日", reading: "きょう" } }, ", ", { term: { kanji: "明日", reading: "あした" } }, ", ", { term: { kanji: "昨日", reading: "きのう" } }, " và các từ có ", { term: "毎" }, " dùng không có trợ từ. Xem ", { link: "Trợ từ を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
            ex: ["7", { kanji: "時", reading: "しちじ" }, { target: "に" }, { kanji: "起", reading: "お" }, "きます。"]
            tr: { en: "I get up at seven.", uk: "Я встаю о сьомій.", es: "Me levanto a las siete.", pt: "Eu acordo às sete.", fr: "Je me lève à sept heures.", de: "Ich stehe um sieben Uhr auf.", it: "Mi alzo alle sette.", pl: "Wstaję o siódmej.", tr: "Saat yedide kalkarım.", id: "Saya bangun jam tujuh.", vi: "Tôi thức dậy lúc bảy giờ." }
