            uk: ["Тиждень: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " — щотижня, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " — наступного, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " — минулого."]
            es: ["Semanas: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " cada una, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " la próxima, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " la pasada."]
            pt: ["Semanas: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " toda semana, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " a próxima, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " a passada."]
            fr: ["Semaines : ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " chaque, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " prochaine, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " dernière."]
            de: ["Wochen: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " jede, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " nächste, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " letzte."]
            it: ["Settimane: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " ogni, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " prossima, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " scorsa."]
            pl: ["Tydzień: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " co tydzień, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " przyszły, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " zeszły."]
            tr: ["Haftalar: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " her hafta, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " gelecek, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " geçen."]
            id: ["Minggu: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " setiap, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " depan, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " lalu."]
            vi: ["Tuần: ", { term: { kanji: "毎週", reading: "まいしゅう" } }, " mỗi tuần, ", { term: { kanji: "来週", reading: "らいしゅう" } }, " tuần sau, ", { term: { kanji: "先週", reading: "せんしゅう" } }, " tuần trước."]
          ex: [{ kanji: "先週", reading: "せんしゅう" }, "、", { kanji: "日本", reading: "にほん" }, "に", { kanji: "行", reading: "い" }, "き", { target: "ました" }, "。"]
          tr: { en: "I went to Japan last week.", uk: "Минулого тижня я їздив до Японії.", es: "La semana pasada fui a Japón.", pt: "Semana passada fui ao Japão.", fr: "La semaine dernière, je suis allé au Japon.", de: "Letzte Woche bin ich nach Japan gefahren.", it: "La settimana scorsa sono andato in Giappone.", pl: "W zeszłym tygodniu pojechałem do Japonii.", tr: "Geçen hafta Japonya'ya gittim.", id: "Minggu lalu saya pergi ke Jepang.", vi: "Tuần trước tôi đã đi Nhật Bản." }
        - level: "A1"
