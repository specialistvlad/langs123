            tr: { en: "Teacher, will you come to school tomorrow?", uk: "Вчителю, ви завтра прийдете до школи?", es: "Profesor, ¿vendrá mañana a la escuela?", pt: "Professor, o senhor vem à escola amanhã?", fr: "Professeur, venez-vous à l’école demain ?", de: "Herr Lehrer, kommen Sie morgen in die Schule?", it: "Professore, domani viene a scuola?", pl: "Panie profesorze, czy jutro będzie pan w szkole?", tr: "Öğretmenim, yarın okula gelecek misiniz?", id: "Pak guru, apakah Bapak datang ke sekolah besok?", vi: "Thưa thầy, ngày mai thầy có đến trường không?" }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["A polite text keeps ", { term: "です" }, " and ", { term: "ます" }, " through every sentence."]
              uk: ["Ввічливий текст тримає ", { term: "です" }, " і ", { term: "ます" }, " у кожному реченні."]
              es: ["Un texto cortés mantiene ", { term: "です" }, " y ", { term: "ます" }, " en todas las oraciones."]
              pt: ["Um texto polido mantém ", { term: "です" }, " e ", { term: "ます" }, " em todas as frases."]
              fr: ["Un texte poli garde ", { term: "です" }, " et ", { term: "ます" }, " dans chaque phrase."]
              de: ["Ein höflicher Text behält ", { term: "です" }, " und ", { term: "ます" }, " in jedem Satz bei."]
              it: ["Un testo cortese mantiene ", { term: "です" }, " e ", { term: "ます" }, " in ogni frase."]
              pl: ["Tekst grzecznościowy utrzymuje ", { term: "です" }, " i ", { term: "ます" }, " w każdym zdaniu."]
              tr: ["Nazik bir metin her cümlede ", { term: "です" }, " ve ", { term: "ます" }, " biçimini korur."]
              id: ["Teks sopan mempertahankan ", { term: "です" }, " dan ", { term: "ます" }, " di setiap kalimat."]
              vi: ["Một văn bản lịch sự giữ ", { term: "です" }, " và ", { term: "ます" }, " ở mọi câu."]
            ex: [{ kanji: "私", reading: "わたし" }, "は", { kanji: "学生", reading: "がくせい" }, { target: "です" }, "。", { kanji: "毎日", reading: "まいにち" }, "、", { kanji: "日本語", reading: "にほんご" }, "を", { kanji: "勉強", reading: "べんきょう" }, "し", { target: "ます" }, "。"]
            tr: { en: "I am a student. I study Japanese every day.", uk: "Я студент. Щодня я вивчаю японську.", es: "Soy estudiante. Estudio japonés todos los días.", pt: "Sou estudante. Estudo japonês todos os dias.", fr: "Je suis étudiant. J’étudie le japonais tous les jours.", de: "Ich bin Student. Ich lerne jeden Tag Japanisch.", it: "Sono studente. Studio giapponese ogni giorno.", pl: "Jestem studentem. Codziennie uczę się japońskiego.", tr: "Ben öğrenciyim. Her gün Japonca çalışırım.", id: "Saya mahasiswa. Setiap hari saya belajar bahasa Jepang.", vi: "Tôi là sinh viên. Mỗi ngày tôi học tiếng Nhật." }
          - type: "rule"
            level: "A2"
            text:
              en: ["Friends and family use the plain form instead; see ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Друзі й родичі натомість вживають просту форму; див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["Los amigos y la familia usan en su lugar la forma simple; véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["Amigos e família usam no lugar a forma simples; veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["Entre amis et en famille, on emploie plutôt la forme simple ; voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Freunde und Familie verwenden stattdessen die einfache Form; siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["Amici e famiglia usano invece la forma semplice; vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Przyjaciele i rodzina używają zamiast niej formy prostej; zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
