            ex: [{ kanji: "毎日", reading: "まいにち" }, "、", { kanji: "朝", reading: "あさ" }, "ごはんを", { kanji: "食", reading: "た" }, "べ", { target: "ます" }, "。"]
            tr: { en: "I eat breakfast every day.", uk: "Щодня я снідаю.", es: "Desayuno todos los días.", pt: "Eu tomo café da manhã todos os dias.", fr: "Je prends le petit-déjeuner tous les jours.", de: "Ich frühstücke jeden Tag.", it: "Faccio colazione ogni giorno.", pl: "Codziennie jem śniadanie.", tr: "Her gün kahvaltı yaparım.", id: "Setiap hari saya sarapan.", vi: "Mỗi ngày tôi ăn sáng." }
