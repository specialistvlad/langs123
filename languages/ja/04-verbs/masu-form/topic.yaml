          rule:
            en: [{ term: "ません" }, " closes the sentence; add no ", { term: "です" }, "."]
            uk: [{ term: "ません" }, " закриває речення; ", { term: "です" }, " не додають."]
            es: [{ term: "ません" }, " cierra la oración; no se añade ", { term: "です" }, "."]
            pt: [{ term: "ません" }, " fecha a frase; não se acrescenta ", { term: "です" }, "."]
            fr: [{ term: "ません" }, " termine la phrase ; n’ajoutez pas ", { term: "です" }, "."]
            de: [{ term: "ません" }, " beendet den Satz; kein ", { term: "です" }, " dahinter."]
            it: [{ term: "ません" }, " chiude la frase; non si aggiunge ", { term: "です" }, "."]
            pl: [{ term: "ません" }, " kończy zdanie; nie dodaje się ", { term: "です" }, "."]
            tr: [{ term: "ません" }, " cümleyi bitirir; ", { term: "です" }, " eklenmez."]
            id: [{ term: "ません" }, " mengakhiri kalimat; jangan tambah ", { term: "です" }, "."]
            vi: [{ term: "ません" }, " kết thúc câu; không thêm ", { term: "です" }, "."]
          ex: [{ kanji: "朝", reading: "あさ" }, "ごはんを", { kanji: "食", reading: "た" }, "べ", { target: "ません" }, "。"]
          tr: { en: "I don't eat breakfast.", uk: "Я не снідаю.", es: "No desayuno.", pt: "Eu não tomo café da manhã.", fr: "Je ne prends pas de petit-déjeuner.", de: "Ich frühstücke nicht.", it: "Non faccio colazione.", pl: "Nie jem śniadania.", tr: "Kahvaltı yapmam.", id: "Saya tidak sarapan.", vi: "Tôi không ăn sáng." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "ます" }, " follows the stem, not the dictionary form."]
            uk: [{ term: "ます" }, " стоїть після основи, а не після словникової форми."]
            es: [{ term: "ます" }, " va tras la raíz, no tras la forma de diccionario."]
            pt: [{ term: "ます" }, " vem depois do radical, não da forma de dicionário."]
            fr: [{ term: "ます" }, " suit le radical, non la forme du dictionnaire."]
            de: [{ term: "ます" }, " folgt dem Stamm, nicht der Wörterbuchform."]
            it: [{ term: "ます" }, " segue il tema, non la forma del dizionario."]
            pl: [{ term: "ます" }, " stoi po temacie, nie po formie słownikowej."]
            tr: [{ term: "ます" }, " gövdeyi izler, sözlük biçimini değil."]
            id: [{ term: "ます" }, " mengikuti batang, bukan bentuk kamus."]
            vi: [{ term: "ます" }, " đứng sau gốc từ, không đứng sau thể từ điển."]
          ex: [{ kanji: "毎朝", reading: "まいあさ" }, "、コーヒーを", { kanji: "飲", reading: "の" }, "み", { target: "ます" }, "。"]
          tr: { en: "I drink coffee every morning.", uk: "Щоранку я п’ю каву.", es: "Tomo café todas las mañanas.", pt: "Eu tomo café toda manhã.", fr: "Je bois du café chaque matin.", de: "Ich trinke jeden Morgen Kaffee.", it: "Bevo il caffè ogni mattina.", pl: "Co rano piję kawę.", tr: "Her sabah kahve içerim.", id: "Setiap pagi saya minum kopi.", vi: "Mỗi sáng tôi uống cà phê." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["The ", { term: "ます" }, "-form is the polite form of a verb: it ends the sentence and stays the same for every person."]
              uk: [{ term: "ます" }, "-форма — ввічлива форма дієслова: вона завершує речення й не змінюється за особами."]
              es: ["La forma ", { term: "ます" }, " es la forma cortés del verbo: cierra la oración y no cambia con la persona."]
              pt: ["A forma ", { term: "ます" }, " é a forma polida do verbo: encerra a frase e não muda com a pessoa."]
              fr: ["La forme en ", { term: "ます" }, " est la forme polie du verbe : elle termine la phrase et ne change pas selon la personne."]
              de: ["Die ", { term: "ます" }, "-Form ist die Höflichkeitsform des Verbs: Sie beendet den Satz und bleibt bei jeder Person gleich."]
              it: ["La forma in ", { term: "ます" }, " è la forma cortese del verbo: chiude la frase e non cambia con la persona."]
              pl: ["Forma ", { term: "ます" }, " to grzecznościowa forma czasownika: kończy zdanie i nie zmienia się według osoby."]
              tr: [{ term: "ます" }, " biçimi fiilin nazik biçimidir: cümleyi bitirir ve kişiye göre değişmez."]
              id: ["Bentuk ", { term: "ます" }, " adalah bentuk sopan kata kerja: berada di akhir kalimat dan tidak berubah menurut orang."]
              vi: ["Thể ", { term: "ます" }, " là thể lịch sự của động từ: đứng cuối câu và không đổi theo ngôi."]
            ex: [{ kanji: "私", reading: "わたし" }, "は", { kanji: "毎朝", reading: "まいあさ" }, "、コーヒーを", { kanji: "飲", reading: "の" }, "み", { target: "ます" }, "。"]
            tr: { en: "I drink coffee every morning.", uk: "Щоранку я п’ю каву.", es: "Tomo café todas las mañanas.", pt: "Eu tomo café toda manhã.", fr: "Je bois du café chaque matin.", de: "Ich trinke jeden Morgen Kaffee.", it: "Bevo il caffè ogni mattina.", pl: "Co rano piję kawę.", tr: "Her sabah kahve içerim.", id: "Setiap pagi saya minum kopi.", vi: "Mỗi sáng tôi uống cà phê." }
          - type: "rule"
            level: "A1"
            text:
              en: "One form serves habits, the present and the future."
              uk: "Одна форма служить для звичних дій, теперішнього й майбутнього часу."
              es: "Una sola forma sirve para hábitos, presente y futuro."
              pt: "Uma só forma serve para hábitos, presente e futuro."
              fr: "Une seule forme sert pour les habitudes, le présent et le futur."
              de: "Eine Form dient für Gewohnheiten, Gegenwart und Zukunft."
              it: "Una sola forma serve per abitudini, presente e futuro."
              pl: "Jedna forma służy do zwyczajów, teraźniejszości i przyszłości."
              tr: "Tek bir biçim alışkanlıklar, şimdiki zaman ve gelecek için kullanılır."
              id: "Satu bentuk dipakai untuk kebiasaan, masa kini, dan masa depan."
              vi: "Một dạng dùng cho thói quen, hiện tại và tương lai."
            ex: { examples: [[{ kanji: "毎日", reading: "まいにち" }, "、", { kanji: "日本語", reading: "にほんご" }, "を", { kanji: "勉強", reading: "べんきょう" }, "し", { target: "ます" }, "。"], [{ kanji: "明日", reading: "あした" }, "、", { kanji: "学校", reading: "がっこう" }, "に", { kanji: "行", reading: "い" }, "き", { target: "ます" }, "。"]] }
            tr: { en: { examples: ["I study Japanese every day.", "Tomorrow I will go to school."] }, uk: { examples: ["Щодня я вивчаю японську.", "Завтра я піду до школи."] }, es: { examples: ["Estudio japonés todos los días.", "Mañana voy a la escuela."] }, pt: { examples: ["Estudo japonês todos os dias.", "Amanhã vou à escola."] }, fr: { examples: ["J’étudie le japonais tous les jours.", "Demain, je vais à l’école."] }, de: { examples: ["Ich lerne jeden Tag Japanisch.", "Morgen gehe ich zur Schule."] }, it: { examples: ["Studio giapponese ogni giorno.", "Domani vado a scuola."] }, pl: { examples: ["Codziennie uczę się japońskiego.", "Jutro idę do szkoły."] }, tr: { examples: ["Her gün Japonca çalışırım.", "Yarın okula giderim."] }, id: { examples: ["Setiap hari saya belajar bahasa Jepang.", "Besok saya pergi ke sekolah."] }, vi: { examples: ["Mỗi ngày tôi học tiếng Nhật.", "Ngày mai tôi sẽ đi học."] } }
          - type: "rule"
            level: "A1"
            text:
              en: ["How the ", { term: "ます" }, "-form is made from the dictionary form: see ", { link: "Verb Groups", to: ja.verbs.verb-groups }, "."]
              uk: ["Як утворити ", { term: "ます" }, "-форму зі словникової: див. ", { link: "Групи дієслів", to: "ja.verbs.verb-groups" }, "."]
              es: ["Cómo se forma la forma ", { term: "ます" }, " a partir de la forma de diccionario: véase ", { link: "Los grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              pt: ["Como se forma a forma ", { term: "ます" }, " a partir da forma de dicionário: veja ", { link: "Os grupos de verbos", to: "ja.verbs.verb-groups" }, "."]
              fr: ["Comment la forme en ", { term: "ます" }, " se forme à partir de la forme du dictionnaire : voir ", { link: "Les groupes de verbes", to: "ja.verbs.verb-groups" }, "."]
              de: ["Wie die ", { term: "ます" }, "-Form aus der Wörterbuchform entsteht: siehe ", { link: "Die Verbgruppen", to: "ja.verbs.verb-groups" }, "."]
              it: ["Come si forma la forma in ", { term: "ます" }, " da quella del dizionario: vedi ", { link: "I gruppi dei verbi", to: "ja.verbs.verb-groups" }, "."]
              pl: ["Jak tworzy się formę ", { term: "ます" }, " z formy słownikowej: zob. ", { link: "Grupy czasowników", to: "ja.verbs.verb-groups" }, "."]
              tr: [{ term: "ます" }, " biçiminin sözlük biçiminden nasıl yapıldığı: bkz. ", { link: "Fiil grupları", to: "ja.verbs.verb-groups" }, "."]
              id: ["Cara membentuk bentuk ", { term: "ます" }, " dari bentuk kamus: lihat ", { link: "Kelompok kata kerja", to: "ja.verbs.verb-groups" }, "."]
              vi: ["Cách tạo thể ", { term: "ます" }, " từ thể từ điển: xem ", { link: "Nhóm động từ", to: "ja.verbs.verb-groups" }, "."]
  - title:
