          tr: { en: "Three apples, please.", uk: "Три яблука, будь ласка.", es: "Tres manzanas, por favor.", pt: "Três maçãs, por favor.", fr: "Trois pommes, s’il vous plaît.", de: "Drei Äpfel, bitte.", it: "Tre mele, per favore.", pl: "Poproszę trzy jabłka.", tr: "Üç elma lütfen.", id: "Tolong tiga apel.", vi: "Cho tôi ba quả táo." }
        - level: "A1"
