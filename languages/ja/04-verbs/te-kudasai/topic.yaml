            pt: ["Para pedir que não se faça, use ", { term: "ないでください" }, ", não ", { term: "なくてください" }, "."]
            fr: ["Pour demander de ne pas faire, employez ", { term: "ないでください" }, ", pas ", { term: "なくてください" }, "."]
            de: ["Um zu bitten, etwas nicht zu tun, steht ", { term: "ないでください" }, ", nicht ", { term: "なくてください" }, "."]
