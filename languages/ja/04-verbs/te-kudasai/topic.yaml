          tr: { en: "Please don’t eat here.", uk: "Не їжте тут, будь ласка.", es: "No coma aquí, por favor.", pt: "Não coma aqui, por favor.", fr: "Ne mangez pas ici, s’il vous plaît.", de: "Bitte essen Sie hier nicht.", it: "Non mangi qui, per favore.", pl: "Proszę tu nie jeść.", tr: "Lütfen burada yemek yemeyin.", id: "Tolong jangan makan di sini.", vi: "Xin đừng ăn ở đây." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ください" }, " means “please give”; after a noun with ", { term: "を" }, " it asks for a thing."]
              uk: [{ term: "ください" }, " означає «будь ласка, дайте»; після іменника з ", { term: "を" }, " воно просить річ."]
              es: [{ term: "ください" }, " significa «por favor, deme»; tras un sustantivo con ", { term: "を" }, " pide una cosa."]
              pt: [{ term: "ください" }, " significa «por favor, dê-me»; depois de um substantivo com ", { term: "を" }, ", pede uma coisa."]
              fr: [{ term: "ください" }, " signifie « donnez-moi, s’il vous plaît » ; après un nom avec ", { term: "を" }, ", il demande une chose."]
              de: [{ term: "ください" }, " bedeutet „geben Sie mir bitte“; nach einem Nomen mit ", { term: "を" }, " bittet es um eine Sache."]
              it: [{ term: "ください" }, " significa «mi dia, per favore»; dopo un nome con ", { term: "を" }, " chiede una cosa."]
              pl: [{ term: "ください" }, " znaczy „proszę dać”; po rzeczowniku z ", { term: "を" }, " prosi o rzecz."]
              tr: [{ term: "ください" }, " “lütfen verin” anlamına gelir; ", { term: "を" }, " ile bir isimden sonra bir şey ister."]
              id: [{ term: "ください" }, " berarti “tolong berikan”; setelah kata benda dengan ", { term: "を" }, ", ia meminta suatu benda."]
              vi: [{ term: "ください" }, " nghĩa là “xin hãy cho”; sau danh từ có ", { term: "を" }, ", nó xin một món đồ."]
            ex: [{ kanji: "水", reading: "みず" }, "を", { target: "ください" }, "。"]
            tr: { en: "Water, please.", uk: "Воду, будь ласка.", es: "Agua, por favor.", pt: "Água, por favor.", fr: "De l’eau, s’il vous plaît.", de: "Wasser, bitte.", it: "Acqua, per favore.", pl: "Poproszę wodę.", tr: "Su lütfen.", id: "Tolong air.", vi: "Cho tôi nước." }
          - type: "rule"
            level: "A1"
            text:
              en: ["After the ", { term: "て" }, "-form of a verb, ", { term: "ください" }, " asks someone to do it; the useful forms are listed below (", { link: "The て-Form", to: ja.verbs.te-form }, ")."]
              uk: ["Після ", { term: "て" }, "-форма дієслова ", { term: "ください" }, " просить це зробити; потрібні форми наведено нижче (", { link: "て-форма", to: "ja.verbs.te-form" }, ")."]
              es: ["Tras la forma ", { term: "て" }, " de un verbo, ", { term: "ください" }, " pide que alguien lo haga; las formas útiles están más abajo (", { link: "La forma て", to: "ja.verbs.te-form" }, ")."]
              pt: ["Depois da forma ", { term: "て" }, " de um verbo, ", { term: "ください" }, " pede que alguém o faça; as formas úteis estão abaixo (", { link: "A forma て", to: "ja.verbs.te-form" }, ")."]
              fr: ["Après la forme en ", { term: "て" }, " d’un verbe, ", { term: "ください" }, " demande à quelqu’un de le faire ; les formes utiles sont listées plus bas (", { link: "La forme en て", to: "ja.verbs.te-form" }, ")."]
              de: ["Nach der ", { term: "て" }, "-Form eines Verbs bittet ", { term: "ください" }, " darum, es zu tun; die nützlichen Formen stehen unten (", { link: "Die て-Form", to: "ja.verbs.te-form" }, ")."]
              it: ["Dopo la forma in ", { term: "て" }, " di un verbo, ", { term: "ください" }, " chiede a qualcuno di farlo; le forme utili sono elencate sotto (", { link: "La forma in て", to: "ja.verbs.te-form" }, ")."]
              pl: ["Po formie ", { term: "て" }, " czasownika ", { term: "ください" }, " prosi, by ktoś to zrobił; przydatne formy są podane niżej (", { link: "Forma て", to: "ja.verbs.te-form" }, ")."]
