            tr: ["Tanımadığınız ya da üst birine rica ederken başa ", { term: "すみませんが" }, " (“pardon, ama”) ekleyin."]
            id: ["Tambahkan ", { term: "すみませんが" }, " (“permisi, tetapi”) sebelum meminta sesuatu kepada orang asing atau atasan."]
            vi: ["Thêm ", { term: "すみませんが" }, " (“xin lỗi, nhưng”) trước lời nhờ với người lạ hoặc người trên."]
          ex: ["すみませんが、もういちど", { kanji: "言", reading: "い" }, "っ", { target: "てください" }, "。"]
          tr: { en: "Excuse me, please say it once more.", uk: "Вибачте, повторіть, будь ласка, ще раз.", es: "Perdone, ¿puede decirlo otra vez, por favor?", pt: "Com licença, pode dizer mais uma vez, por favor?", fr: "Excusez-moi, pouvez-vous répéter, s’il vous plaît ?", de: "Entschuldigung, sagen Sie es bitte noch einmal.", it: "Mi scusi, può ripeterlo, per favore?", pl: "Przepraszam, proszę powtórzyć jeszcze raz.", tr: "Pardon, lütfen bir daha söyler misiniz?", id: "Permisi, tolong katakan sekali lagi.", vi: "Xin lỗi, xin hãy nói lại một lần nữa." }
