          rule: { pattern: [{ slot: { en: "て-form", uk: "て-форма", es: "forma て", pt: "forma て", fr: "forme en て", de: "て-Form", it: "forma in て", pl: "forma て", tr: "て biçimi", id: "bentuk て", vi: "thể て" } }, { term: "ください" }] }
          ex: ["ここに", { kanji: "書", reading: "か" }, "い", { target: "てください" }, "。"]
