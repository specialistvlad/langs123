summary:
  lead:
    en: [{ term: "てください" }, " asks someone to do something, ", { term: "ないでください" }, " asks them not to, and ", { term: "をください" }, " asks for a thing."]
    uk: [{ term: "てください" }, " просить щось зробити, ", { term: "ないでください" }, " просить не робити, а ", { term: "をください" }, " просить дати річ."]
    es: [{ term: "てください" }, " pide que alguien haga algo, ", { term: "ないでください" }, " pide que no lo haga y ", { term: "をください" }, " pide una cosa."]
    pt: [{ term: "てください" }, " pede que alguém faça algo, ", { term: "ないでください" }, " pede que não faça e ", { term: "をください" }, " pede uma coisa."]
    fr: [{ term: "てください" }, " demande à quelqu’un de faire quelque chose, ", { term: "ないでください" }, " de ne pas le faire et ", { term: "をください" }, " demande une chose."]
    de: [{ term: "てください" }, " bittet jemanden, etwas zu tun, ", { term: "ないでください" }, " bittet, es nicht zu tun, und ", { term: "をください" }, " bittet um eine Sache."]
    it: [{ term: "てください" }, " chiede a qualcuno di fare qualcosa, ", { term: "ないでください" }, " di non farlo e ", { term: "をください" }, " chiede una cosa."]
    pl: [{ term: "てください" }, " prosi, by ktoś coś zrobił, ", { term: "ないでください" }, " — by nie robił, a ", { term: "をください" }, " prosi o rzecz."]
    tr: [{ term: "てください" }, " birinden bir şey yapmasını, ", { term: "ないでください" }, " yapmamasını, ", { term: "をください" }, " ise bir şey vermesini ister."]
    id: [{ term: "てください" }, " meminta seseorang melakukan sesuatu, ", { term: "ないでください" }, " memintanya tidak melakukan, dan ", { term: "をください" }, " meminta suatu benda."]
    vi: [{ term: "てください" }, " nhờ ai làm gì, ", { term: "ないでください" }, " nhờ đừng làm, còn ", { term: "をください" }, " xin một món đồ."]
  rule:
    en: ["The ", { term: "て" }, "-form takes ", { term: "ください" }, ":"]
    uk: ["Після ", { term: "て" }, "-форми стоїть ", { term: "ください" }, ":"]
    es: ["La forma ", { term: "て" }, " va seguida de ", { term: "ください" }, ":"]
    pt: ["A forma ", { term: "て" }, " é seguida de ", { term: "ください" }, ":"]
    fr: ["La forme en ", { term: "て" }, " est suivie de ", { term: "ください" }, " :"]
    de: ["Auf die ", { term: "て" }, "-Form folgt ", { term: "ください" }, ":"]
    it: ["La forma in ", { term: "て" }, " è seguita da ", { term: "ください" }, ":"]
    pl: ["Po formie ", { term: "て" }, " następuje ", { term: "ください" }, ":"]
    tr: [{ term: "て" }, " biçimi ile ", { term: "ください" }, " birlikte kullanılır:"]
    id: ["Setelah bentuk ", { term: "て" }, " datang ", { term: "ください" }, ":"]
    vi: ["Sau thể ", { term: "て" }, " là ", { term: "ください" }, ":"]
  ex: ["ここに", { kanji: "書", reading: "か" }, "い", { target: "てください" }, "。"]
