          rule: { pattern: [{ slot: { en: "ない-form", uk: "ない-форма", es: "forma ない", pt: "forma ない", fr: "forme en ない", de: "ない-Form", it: "forma in ない", pl: "forma ない", tr: "ない biçimi", id: "bentuk ない", vi: "thể ない" } }, { term: "でください" }] }
