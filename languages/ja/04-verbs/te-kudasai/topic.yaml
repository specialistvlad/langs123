            uk: ["Додайте ", { term: "すみませんが" }, " («вибачте, але») перед проханням до незнайомої чи старшої людини."]
            es: ["Añade ", { term: "すみませんが" }, " («perdone, pero») antes de pedir algo a un desconocido o a un superior."]
