            uk: [{ term: "ください" }, " стоїть після ", { term: "て" }, "-форми, а не словникової форми."]
            es: [{ term: "ください" }, " va tras la forma ", { term: "て" }, ", nunca tras la forma de diccionario."]
            pt: [{ term: "ください" }, " vem depois da forma ", { term: "て" }, ", nunca da forma de dicionário."]
            fr: [{ term: "ください" }, " suit la forme en ", { term: "て" }, ", jamais la forme du dictionnaire."]
            de: [{ term: "ください" }, " folgt der ", { term: "て" }, "-Form, nie der Wörterbuchform."]
            it: [{ term: "ください" }, " segue la forma in ", { term: "て" }, ", mai la forma del dizionario."]
            pl: [{ term: "ください" }, " następuje po formie ", { term: "て" }, ", nigdy po formie słownikowej."]
            tr: [{ term: "ください" }, " ", { term: "て" }, " biçimi ile kullanılır, sözlük biçimiyle asla."]
            id: [{ term: "ください" }, " mengikuti bentuk ", { term: "て" }, ", bukan bentuk kamus."]
            vi: [{ term: "ください" }, " đi sau thể ", { term: "て" }, ", không bao giờ sau thể từ điển."]
          ex: ["これを", { kanji: "見", reading: "み" }, { target: "てください" }, "。"]
          tr: { en: "Please look at this.", uk: "Подивіться на це, будь ласка.", es: "Mire esto, por favor.", pt: "Olhe isto, por favor.", fr: "Regardez ceci, s’il vous plaît.", de: "Sehen Sie sich das bitte an.", it: "Guardi questo, per favore.", pl: "Proszę na to spojrzeć.", tr: "Lütfen buna bakın.", id: "Tolong lihat ini.", vi: "Xin hãy xem cái này." }
        - level: "A2"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
