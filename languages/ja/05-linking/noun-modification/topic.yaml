            pl: ["W zdaniu podmiot bierze ", { term: "が" }, " (lub ", { term: "の" }, "), nie ", { term: "は" }, "."]
            tr: ["Yan cümlede özne ", { term: "が" }, " (ya da ", { term: "の" }, ") alır, ", { term: "は" }, " almaz."]
            id: ["Di dalam klausa, subjek memakai ", { term: "が" }, " (atau ", { term: "の" }, "), bukan ", { term: "は" }, "."]
