          tr: { en: "The town where the teacher lives is big.", uk: "Місто, де живе вчитель, велике.", es: "La ciudad donde vive el profesor es grande.", pt: "A cidade onde o professor mora é grande.", fr: "La ville où habite le professeur est grande.", de: "Die Stadt, in der der Lehrer wohnt, ist groß.", it: "La città in cui vive l’insegnante è grande.", pl: "Miasto, w którym mieszka nauczyciel, jest duże.", tr: "Öğretmenin yaşadığı şehir büyük.", id: "Kota tempat guru tinggal itu besar.", vi: "Thành phố nơi thầy giáo sống thì lớn." }
