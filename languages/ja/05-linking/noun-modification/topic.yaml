summary:
  lead:
    en: ["A plain-form clause placed directly before a noun describes it: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " is “the book I bought”."]
    uk: ["Частина в простій формі, поставлена просто перед іменником, описує його: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " — «книжка, яку я купив»."]
    es: ["Una oración en forma simple colocada justo antes de un sustantivo lo describe: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " es «el libro que compré»."]
    pt: ["Uma oração na forma simples colocada logo antes de um substantivo o descreve: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " é «o livro que comprei»."]
    fr: ["Une proposition à la forme simple devant un nom le décrit : ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " est « le livre que j’ai acheté »."]
    de: ["Ein Teilsatz in der einfachen Form direkt vor einem Nomen beschreibt es: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " ist „das Buch, das ich gekauft habe“."]
    it: ["Una proposizione alla forma semplice posta subito prima di un nome lo descrive: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " è «il libro che ho comprato»."]
    pl: ["Zdanie w formie prostej stojące bezpośrednio przed rzeczownikiem opisuje go: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " to „książka, którą kupiłem”."]
    tr: ["İsmin hemen önüne konan yalın biçimli bir yan cümle onu tanımlar: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, ", “benim aldığım kitap” demektir."]
    id: ["Klausa bentuk biasa yang diletakkan tepat sebelum kata benda menjelaskannya: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " berarti “buku yang saya beli”."]
    vi: ["Mệnh đề thể thường đặt trước danh từ sẽ mô tả danh từ đó: ", { term: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }] }, " là “quyển sách tôi đã mua”."]
  rule:
    en: "The noun stands last, and no word for “that” or “which” comes between:"
    uk: "Іменник стоїть останнім, а слова на кшталт «який» між ними немає:"
    es: "El sustantivo va al final, y no hay ninguna palabra como «que» entre los dos:"
    pt: "O substantivo vem por último, e nenhuma palavra como «que» fica entre os dois:"
    fr: "Le nom vient en dernier, sans « que » entre les deux :"
    de: "Das Nomen steht am Ende, und kein Wort wie „der“ oder „das“ steht dazwischen:"
    it: "Il nome sta alla fine, e nessuna parola come «che» sta in mezzo:"
    pl: "Rzeczownik stoi na końcu, a słowa typu „który” pomiędzy nimi nie ma:"
    tr: "İsim en sonda durur ve araya “ki” ya da “olan” gibi bir sözcük girmez:"
    id: "Kata benda berada di akhir, dan tidak ada kata seperti “yang” di antaranya:"
    vi: "Danh từ đứng cuối, và không có từ như “mà” hay “đã” chen giữa:"
  ex: ["これは", { kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った", { target: { kanji: "本", reading: "ほん" } }, "です。"]
