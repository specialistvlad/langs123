            ex: [{ kanji: "先生", reading: "せんせい" }, "が", { kanji: "住", reading: "す" }, "んでいる", { target: { kanji: "町", reading: "まち" } }, "は、", { kanji: "大", reading: "おお" }, "きいです。"]
            tr: { en: "The town where the teacher lives is big.", uk: "Місто, де живе вчитель, велике.", es: "La ciudad donde vive el profesor es grande.", pt: "A cidade onde o professor mora é grande.", fr: "La ville où habite le professeur est grande.", de: "Die Stadt, in der der Lehrer wohnt, ist groß.", it: "La città in cui vive l’insegnante è grande.", pl: "Miasto, w którym mieszka nauczyciel, jest duże.", tr: "Öğretmenin yaşadığı şehir büyük.", id: "Kota tempat guru tinggal itu besar.", vi: "Thành phố nơi thầy giáo sống thì lớn." }
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: ["The particle the noun would take in the clause (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") drops out. See ", { link: "Particles を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              uk: ["Частка, яку іменник мав би в частині (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, "), зникає. Див. ", { link: "Частки を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              es: ["La partícula que el sustantivo llevaría en la oración (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") desaparece. Véase ", { link: "Las partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pt: ["A partícula que o substantivo levaria na oração (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") desaparece. Veja ", { link: "As partículas を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              fr: ["La particule que le nom prendrait dans la proposition (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") disparaît. Voir ", { link: "Les particules を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              de: ["Die Partikel, die das Nomen im Teilsatz hätte (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, "), entfällt. Siehe ", { link: "Die Partikeln を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              it: ["La particella che il nome avrebbe nella proposizione (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") cade. Vedi ", { link: "Le particelle を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              pl: ["Partykuła, którą rzeczownik miałby w zdaniu (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, "), odpada. Zob. ", { link: "Partykuły を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              tr: ["Ismin yan cümlede alacağı edat (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") düşer. Bkz. ", { link: "を, に, で, へ edatları", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              id: ["Partikel yang akan menyertai kata benda dalam klausa (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") dihilangkan. Lihat ", { link: "Partikel を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
              vi: ["Trợ từ mà danh từ sẽ có trong mệnh đề (", { term: "を" }, ", ", { term: "が" }, ", ", { term: "に" }, ", ", { term: "で" }, ") được bỏ đi. Xem ", { link: "Trợ từ を, に, で, へ", to: "ja.sentence-basics.particles-o-ni-de-e" }, "."]
            ex: ["テレビ", { target: "を" }, { kanji: "見", reading: "み" }, "ている", { kanji: "人", reading: "ひと" }]
            tr: { en: "the person watching TV", uk: "людина, що дивиться телевізор", es: "la persona que está viendo la tele", pt: "a pessoa que está vendo TV", fr: "la personne qui regarde la télé", de: "die Person, die fernsieht", it: "la persona che guarda la TV", pl: "osoba, która ogląda telewizję", tr: "televizyon izleyen kişi", id: "orang yang sedang menonton TV", vi: "người đang xem ti vi" }
  - title:
      en: "Typical errors"
      uk: "Типові помилки"
      es: "Errores frecuentes"
      pt: "Erros comuns"
      fr: "Erreurs fréquentes"
      de: "Typische Fehler"
      it: "Errori frequenti"
