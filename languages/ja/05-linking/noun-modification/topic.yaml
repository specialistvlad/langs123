      id: "Kesalahan umum"
      vi: "Lỗi thường gặp"
    role: "errors"
    content:
      - type: "errors"
        rows:
          - level: "A2"
            wrong: ["これは", { kanji: "私", reading: "わたし" }, "は", { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, "です。"]
            right: ["これは", { kanji: "私", reading: "わたし" }, { target: "が" }, { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, "です。"]
            rule:
              en: ["inside the clause the subject takes ", { term: "が" }, "; ", { term: "は" }, " cannot stand there"]
              uk: ["у частині підмет бере ", { term: "が" }, "; ", { term: "は" }, " там стояти не може"]
              es: ["dentro de la oración el sujeto lleva ", { term: "が" }, "; ", { term: "は" }, " no puede ir ahí"]
              pt: ["dentro da oração o sujeito leva ", { term: "が" }, "; ", { term: "は" }, " não pode ficar ali"]
              fr: ["dans la proposition le sujet prend ", { term: "が" }, " ; ", { term: "は" }, " ne peut pas s’y mettre"]
              de: ["im Teilsatz steht das Subjekt mit ", { term: "が" }, "; ", { term: "は" }, " kann dort nicht stehen"]
              it: ["nella proposizione il soggetto prende ", { term: "が" }, "; ", { term: "は" }, " non può starci"]
              pl: ["w zdaniu podmiot bierze ", { term: "が" }, "; ", { term: "は" }, " nie może tam stać"]
              tr: ["yan cümlede özne ", { term: "が" }, " alır; ", { term: "は" }, " orada duramaz"]
              id: ["di dalam klausa subjek memakai ", { term: "が" }, "; ", { term: "は" }, " tidak bisa berdiri di sana"]
              vi: ["trong mệnh đề chủ ngữ dùng ", { term: "が" }, "; ", { term: "は" }, " không đứng được ở đó"]
          - level: "A2"
            wrong: ["これは", { kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "いました", { kanji: "本", reading: "ほん" }, "です。"]
            right: ["これは", { kanji: "私", reading: "わたし" }, "が", { target: [{ kanji: "買", reading: "か" }, "った"] }, { kanji: "本", reading: "ほん" }, "です。"]
            rule:
              en: ["the clause ends in the plain form; the polite ", { term: "ます" }, " cannot stand before a noun"]
              uk: ["частина закінчується простою формою; ввічливе ", { term: "ます" }, " перед іменником не стоїть"]
              es: ["la oración termina en forma simple; el ", { term: "ます" }, " cortés no puede ir ante un sustantivo"]
              pt: ["a oração termina na forma simples; o ", { term: "ます" }, " polido não pode vir antes de um substantivo"]
              fr: ["la proposition finit à la forme simple ; le ", { term: "ます" }, " poli ne peut pas précéder un nom"]
              de: ["der Teilsatz endet in der einfachen Form; das höfliche ", { term: "ます" }, " kann nicht vor einem Nomen stehen"]
              it: ["la proposizione finisce alla forma semplice; il ", { term: "ます" }, " cortese non può precedere un nome"]
              pl: ["zdanie kończy się formą prostą; grzecznościowe ", { term: "ます" }, " nie może stać przed rzeczownikiem"]
              tr: ["yan cümle yalın biçimle biter; nazik ", { term: "ます" }, " bir ismin önünde durmaz"]
              id: ["klausa berakhir dengan bentuk biasa; ", { term: "ます" }, " yang sopan tidak bisa berdiri sebelum kata benda"]
              vi: ["mệnh đề kết thúc bằng thể thường; ", { term: "ます" }, " lịch sự không đứng trước danh từ"]
          - level: "A2"
            wrong: [{ kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいるのともだちがいます。"]
            right: [{ kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいる", { target: "ともだち" }, "がいます。"]
            rule:
              en: ["no ", { term: "の" }, " joins the clause to the noun; they stand side by side"]
              uk: [{ term: "の" }, " між частиною та іменником не ставлять; вони стоять поруч"]
              es: ["ningún ", { term: "の" }, " une la oración con el sustantivo; van juntos"]
              pt: ["nenhum ", { term: "の" }, " liga a oração ao substantivo; ficam lado a lado"]
              fr: ["aucun ", { term: "の" }, " ne relie la proposition au nom ; ils se suivent directement"]
              de: ["kein ", { term: "の" }, " verbindet Teilsatz und Nomen; sie stehen direkt nebeneinander"]
              it: ["nessun ", { term: "の" }, " unisce la proposizione al nome; stanno uno accanto all’altro"]
              pl: ["żadne ", { term: "の" }, " nie łączy zdania z rzeczownikiem; stoją obok siebie"]
              tr: ["yan cümle ile ismi hiçbir ", { term: "の" }, " bağlamaz; yan yana dururlar"]
              id: ["tidak ada ", { term: "の" }, " yang menghubungkan klausa dengan kata benda; keduanya berdampingan"]
              vi: ["không có ", { term: "の" }, " nối mệnh đề với danh từ; chúng đứng sát nhau"]
          - level: "A2"
            wrong: ["ともだちがいます。", { kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいる。"]
            right: [{ kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいる", { target: "ともだち" }, "がいます。"]
            rule:
              en: "the clause comes before the noun, never after it; English “who lives” follows the noun"
              uk: "частина стоїть перед іменником, а не після нього; українське «що живе» стоїть після іменника"
              es: "la oración va antes del sustantivo, nunca después; el español «que vive» sigue al sustantivo"
              pt: "a oração vem antes do substantivo, nunca depois; o português «que mora» segue o substantivo"
              fr: "la proposition vient avant le nom, jamais après ; le français « qui habite » suit le nom"
              de: "der Teilsatz steht vor dem Nomen, nie danach; das deutsche „der … wohnt“ folgt dem Nomen"
              it: "la proposizione sta prima del nome, mai dopo; l’italiano «che vive» segue il nome"
              pl: "zdanie stoi przed rzeczownikiem, nigdy po nim; polskie „który mieszka” następuje po rzeczowniku"
              id: "klausa berada sebelum kata benda, tidak pernah sesudahnya; “yang tinggal” dalam bahasa Indonesia mengikuti kata benda"
              vi: "mệnh đề đứng trước danh từ, không bao giờ sau nó; “sống ở” trong tiếng Việt đi sau danh từ"
            speakers: ["en", "uk", "es", "pt", "fr", "de", "it", "pl", "id", "vi"]
