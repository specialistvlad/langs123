          tr: { en: "This is the book I bought.", uk: "Це книжка, яку я купив.", es: "Este es el libro que compré.", pt: "Este é o livro que comprei.", fr: "C’est le livre que j’ai acheté.", de: "Das ist das Buch, das ich gekauft habe.", it: "Questo è il libro che ho comprato.", pl: "To jest książka, którą kupiłem.", tr: "Bu, benim aldığım kitap.", id: "Ini buku yang saya beli.", vi: "Đây là quyển sách tôi đã mua." }
        - level: "A2"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: ["No ", { term: "の" }, " between the clause and the noun."]
            uk: ["Між частиною та іменником немає ", { term: "の" }, "."]
            es: ["Sin ", { term: "の" }, " entre la oración y el sustantivo."]
            pt: ["Sem ", { term: "の" }, " entre a oração e o substantivo."]
            fr: ["Pas de ", { term: "の" }, " entre la proposition et le nom."]
            de: ["Kein ", { term: "の" }, " zwischen Teilsatz und Nomen."]
            it: ["Nessun ", { term: "の" }, " tra la proposizione e il nome."]
            pl: ["Bez ", { term: "の" }, " między zdaniem a rzeczownikiem."]
            tr: ["Yan cümle ile isim arasında ", { term: "の" }, " olmaz."]
            id: ["Tanpa ", { term: "の" }, " antara klausa dan kata benda."]
            vi: ["Không có ", { term: "の" }, " giữa mệnh đề và danh từ."]
          ex: [{ kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいる", { target: "ともだち" }, "がいます。"]
          tr: { en: "I have a friend who lives in Japan.", uk: "У мене є друг, який живе в Японії.", es: "Tengo un amigo que vive en Japón.", pt: "Tenho um amigo que mora no Japão.", fr: "J’ai un ami qui habite au Japon.", de: "Ich habe einen Freund, der in Japan wohnt.", it: "Ho un amico che vive in Giappone.", pl: "Mam przyjaciela, który mieszka w Japonii.", tr: "Japonya’da yaşayan bir arkadaşım var.", id: "Saya punya teman yang tinggal di Jepang.", vi: "Tôi có một người bạn sống ở Nhật Bản." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: "A clause before a noun describes it; the noun comes last."
              uk: "Частина перед іменником описує його; іменник стоїть останнім."
              es: "Una oración antes de un sustantivo lo describe; el sustantivo va al final."
              pt: "Uma oração antes de um substantivo o descreve; o substantivo vem por último."
              fr: "Une proposition devant un nom le décrit ; le nom vient en dernier."
              de: "Ein Teilsatz vor einem Nomen beschreibt es; das Nomen steht am Ende."
              it: "Una proposizione prima di un nome lo descrive; il nome sta alla fine."
              pl: "Zdanie przed rzeczownikiem opisuje go; rzeczownik stoi na końcu."
              tr: "İsmin önündeki yan cümle onu tanımlar; isim en sonda durur."
              id: "Klausa sebelum kata benda menjelaskannya; kata benda berada di akhir."
              vi: "Mệnh đề đứng trước danh từ mô tả danh từ; danh từ đứng cuối."
            ex: ["これは", { target: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "買", reading: "か" }, "った"] }, { kanji: "本", reading: "ほん" }, "です。"]
            tr: { en: "This is the book I bought.", uk: "Це книжка, яку я купив.", es: "Este es el libro que compré.", pt: "Este é o livro que comprei.", fr: "C’est le livre que j’ai acheté.", de: "Das ist das Buch, das ich gekauft habe.", it: "Questo è il libro che ho comprato.", pl: "To jest książka, którą kupiłem.", tr: "Bu, benim aldığım kitap.", id: "Ini buku yang saya beli.", vi: "Đây là quyển sách tôi đã mua." }
          - type: "rule"
            level: "A2"
            text:
              en: "Japanese has no word for “that” or “which”: the clause and the noun stand side by side."
              uk: "У японській немає слова на кшталт «який»: частина й іменник стоять поруч."
              es: "El japonés no tiene una palabra como «que»: la oración y el sustantivo van juntos."
              pt: "O japonês não tem uma palavra como «que»: a oração e o substantivo ficam lado a lado."
              fr: "Le japonais n’a pas de mot comme « que » : la proposition et le nom se suivent directement."
              de: "Das Japanische hat kein Wort wie „der“ oder „das“: Teilsatz und Nomen stehen unmittelbar nebeneinander."
              it: "Il giapponese non ha una parola come «che»: la proposizione e il nome stanno uno accanto all’altro."
              pl: "Japoński nie ma słowa typu „który”: zdanie i rzeczownik stoją obok siebie."
              tr: "Japoncada “ki” ya da “olan” gibi bir sözcük yoktur: yan cümle ile isim yan yana durur."
              id: "Bahasa Jepang tidak punya kata seperti “yang”: klausa dan kata benda berdampingan."
              vi: "Tiếng Nhật không có từ như “mà”: mệnh đề và danh từ đứng sát nhau."
            ex: [{ kanji: "日本", reading: "にほん" }, "に", { kanji: "住", reading: "す" }, "んでいる", { target: "ともだち" }, "がいます。"]
            tr: { en: "I have a friend who lives in Japan.", uk: "У мене є друг, який живе в Японії.", es: "Tengo un amigo que vive en Japón.", pt: "Tenho um amigo que mora no Japão.", fr: "J’ai un ami qui habite au Japon.", de: "Ich habe einen Freund, der in Japan wohnt.", it: "Ho un amico che vive in Giappone.", pl: "Mam przyjaciela, który mieszka w Japonii.", tr: "Japonya’da yaşayan bir arkadaşım var.", id: "Saya punya teman yang tinggal di Jepang.", vi: "Tôi có một người bạn sống ở Nhật Bản." }
          - type: "rule"
            level: "A2"
            text:
              en: ["The clause ends in the plain form, even when the whole sentence ends in the polite form. See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Частина закінчується простою формою, навіть коли ввесь вислів завершує ввічлива. Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["La oración termina en forma simple, aunque toda la frase termine en forma cortés. Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A oração termina na forma simples, mesmo que toda a frase termine na forma polida. Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La proposition finit à la forme simple, même quand toute la phrase finit à la forme polie. Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Der Teilsatz endet in der einfachen Form, auch wenn der ganze Satz in der Höflichkeitsform endet. Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["La proposizione finisce alla forma semplice, anche quando tutta la frase finisce alla forma cortese. Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Zdanie kończy się formą prostą, nawet gdy całe zdanie kończy się formą grzecznościową. Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Cümlenin tamamı nazik biçimle bitse bile yan cümle yalın biçimle biter. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Klausa berakhir dengan bentuk biasa, meskipun seluruh kalimat berakhir dengan bentuk sopan. Lihat ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Mệnh đề kết thúc bằng thể thường, ngay cả khi cả câu kết thúc bằng thể lịch sự. Xem ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
            ex: ["きのう", { target: [{ kanji: "見", reading: "み" }, "た"] }, "えいがは、おもしろかったです。"]
            tr: { en: "The movie I saw yesterday was interesting.", uk: "Фільм, який я бачив учора, був цікавий.", es: "La película que vi ayer fue interesante.", pt: "O filme que vi ontem foi interessante.", fr: "Le film que j’ai vu hier était intéressant.", de: "Der Film, den ich gestern gesehen habe, war interessant.", it: "Il film che ho visto ieri era interessante.", pl: "Film, który wczoraj oglądałem, był ciekawy.", tr: "Dün izlediğim film ilginçti.", id: "Film yang saya tonton kemarin menarik.", vi: "Bộ phim tôi xem hôm qua rất hay." }
          - type: "note"
            level: "A2"
            text:
              en: ["A single adjective before a noun is a smaller case of the same order. See ", { link: "い-Adjectives", to: ja.adjectives.i-adjectives }, " and ", { link: "な-Adjectives", to: ja.adjectives.na-adjectives }, "."]
              uk: ["Один прикметник перед іменником — менший випадок того самого порядку. Див. ", { link: "い-прикметники", to: "ja.adjectives.i-adjectives" }, " та ", { link: "な-прикметники", to: "ja.adjectives.na-adjectives" }, "."]
              es: ["Un solo adjetivo antes del sustantivo es un caso menor del mismo orden. Véase ", { link: "Los adjetivos い", to: "ja.adjectives.i-adjectives" }, " y ", { link: "Los adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              pt: ["Um só adjetivo antes do substantivo é um caso menor da mesma ordem. Veja ", { link: "Os adjetivos い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Os adjetivos な", to: "ja.adjectives.na-adjectives" }, "."]
              fr: ["Un simple adjectif devant le nom est un cas plus petit du même ordre. Voir ", { link: "Les adjectifs en い", to: "ja.adjectives.i-adjectives" }, " et ", { link: "Les adjectifs en な", to: "ja.adjectives.na-adjectives" }, "."]
              de: ["Ein einzelnes Adjektiv vor dem Nomen ist ein kleinerer Fall derselben Reihenfolge. Siehe ", { link: "Die い-Adjektive", to: "ja.adjectives.i-adjectives" }, " und ", { link: "Die な-Adjektive", to: "ja.adjectives.na-adjectives" }, "."]
              it: ["Un solo aggettivo prima del nome è un caso più piccolo dello stesso ordine. Vedi ", { link: "Gli aggettivi in い", to: "ja.adjectives.i-adjectives" }, " e ", { link: "Gli aggettivi in な", to: "ja.adjectives.na-adjectives" }, "."]
              pl: ["Pojedynczy przymiotnik przed rzeczownikiem to mniejszy przypadek tego samego szyku. Zob. ", { link: "Przymiotniki い", to: "ja.adjectives.i-adjectives" }, " i ", { link: "Przymiotniki な", to: "ja.adjectives.na-adjectives" }, "."]
              tr: ["İsmin önündeki tek bir sıfat aynı sıranın daha küçük bir örneğidir. Bkz. ", { link: "い sıfatları", to: "ja.adjectives.i-adjectives" }, " ve ", { link: "な sıfatları", to: "ja.adjectives.na-adjectives" }, "."]
              id: ["Satu kata sifat sebelum kata benda adalah kasus kecil dari urutan yang sama. Lihat ", { link: "Kata sifat い", to: "ja.adjectives.i-adjectives" }, " dan ", { link: "Kata sifat な", to: "ja.adjectives.na-adjectives" }, "."]
              vi: ["Một tính từ đứng trước danh từ là trường hợp nhỏ của cùng trật tự đó. Xem ", { link: "Tính từ い", to: "ja.adjectives.i-adjectives" }, " và ", { link: "Tính từ な", to: "ja.adjectives.na-adjectives" }, "."]
  - title:
      en: "Form: the clause before the noun"
      uk: "Форма: частина перед іменником"
      es: "Forma: la oración antes del sustantivo"
      pt: "Forma: a oração antes do substantivo"
      fr: "Forme : la proposition devant le nom"
      de: "Form: der Teilsatz vor dem Nomen"
      it: "Forma: la proposizione prima del nome"
      pl: "Forma: zdanie przed rzeczownikiem"
      tr: "Biçim: ismin önündeki yan cümle"
      id: "Bentuk: klausa sebelum kata benda"
      vi: "Dạng: mệnh đề trước danh từ"
    role: "form"
    content:
      - type: "usage"
        columns:
          - { key: "form", label: { en: "Form", uk: "Форма", es: "Forma", pt: "Forma", fr: "Forme", de: "Form", it: "Forma", pl: "Forma", tr: "Biçim", id: "Bentuk", vi: "Dạng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A2"
            form: { en: "Present", uk: "Теперішній час", es: "Presente", pt: "Presente", fr: "Présent", de: "Präsens", it: "Presente", pl: "Teraźniejszość", tr: "Şimdiki zaman", id: "Sekarang", vi: "Hiện tại" }
            ex: [{ target: [{ kanji: "私", reading: "わたし" }, "がよく", { kanji: "行", reading: "い" }, "く"] }, "みせは", { kanji: "小", reading: "ちい" }, "さいです。"]
            tr: { en: "The shop I often go to is small.", uk: "Крамниця, куди я часто ходжу, маленька.", es: "La tienda a la que voy a menudo es pequeña.", pt: "A loja aonde eu vou sempre é pequena.", fr: "Le magasin où je vais souvent est petit.", de: "Der Laden, in den ich oft gehe, ist klein.", it: "Il negozio in cui vado spesso è piccolo.", pl: "Sklep, do którego często chodzę, jest mały.", tr: "Sık gittiğim dükkân küçük.", id: "Toko yang sering saya kunjungi itu kecil.", vi: "Cửa hàng tôi hay đến thì nhỏ." }
          - level: "A2"
            form: { en: "Negative", uk: "Заперечення", es: "Negación", pt: "Negação", fr: "Négation", de: "Verneinung", it: "Negazione", pl: "Przeczenie", tr: "Olumsuz", id: "Negatif", vi: "Phủ định" }
            ex: [{ target: [{ kanji: "私", reading: "わたし" }, "が", { kanji: "食", reading: "た" }, "べない"] }, "ものは、さしみです。"]
            tr: { en: "What I don't eat is sashimi.", uk: "Те, чого я не їм, — це сашимі.", es: "Lo que no como es el sashimi.", pt: "O que eu não como é sashimi.", fr: "Ce que je ne mange pas, c’est le sashimi.", de: "Was ich nicht esse, ist Sashimi.", it: "Quello che non mangio è il sashimi.", pl: "To, czego nie jem, to sashimi.", tr: "Yemediğim şey sashimi.", id: "Yang tidak saya makan adalah sashimi.", vi: "Thứ tôi không ăn là sashimi." }
          - level: "A2"
            form: { en: "Past", uk: "Минулий час", es: "Pasado", pt: "Passado", fr: "Passé", de: "Vergangenheit", it: "Passato", pl: "Przeszłość", tr: "Geçmiş zaman", id: "Lampau", vi: "Quá khứ" }
            ex: [{ target: ["きのう", { kanji: "見", reading: "み" }, "た"] }, "えいがは、おもしろかったです。"]
            tr: { en: "The movie I saw yesterday was interesting.", uk: "Фільм, який я бачив учора, був цікавий.", es: "La película que vi ayer fue interesante.", pt: "O filme que vi ontem foi interessante.", fr: "Le film que j’ai vu hier était intéressant.", de: "Der Film, den ich gestern gesehen habe, war interessant.", it: "Il film che ho visto ieri era interessante.", pl: "Film, który wczoraj oglądałem, był ciekawy.", tr: "Dün izlediğim film ilginçti.", id: "Film yang saya tonton kemarin menarik.", vi: "Bộ phim tôi xem hôm qua rất hay." }
          - level: "A2"
            form:
              en: "In progress"
              uk: "Тривала дія"
              es: "En curso"
              pt: "Em andamento"
              fr: "En cours"
              de: "Verlaufsform"
              it: "In corso"
              pl: "W toku"
              tr: "Süren eylem"
              id: "Sedang berlangsung"
              vi: "Đang diễn ra"
            ex: [{ target: ["テレビを", { kanji: "見", reading: "み" }, "ている"] }, { kanji: "人", reading: "ひと" }, "は、たなかさんです。"]
            tr: { en: "The person watching TV is Tanaka-san.", uk: "Людина, що дивиться телевізор, — Танака-сан.", es: "La persona que está viendo la tele es Tanaka-san.", pt: "A pessoa que está vendo TV é o Tanaka-san.", fr: "La personne qui regarde la télé, c’est Tanaka-san.", de: "Die Person, die fernsieht, ist Tanaka-san.", it: "La persona che guarda la TV è Tanaka-san.", pl: "Osobą, która ogląda telewizję, jest Tanaka-san.", tr: "Televizyon izleyen kişi Tanaka-san.", id: "Orang yang sedang menonton TV adalah Tanaka-san.", vi: "Người đang xem ti vi là Tanaka-san." }
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: ["The subject of the clause takes ", { term: "が" }, "; ", { term: "の" }, " stands in its place in writing and careful speech."]
              uk: ["Підмет частини бере ", { term: "が" }, "; у писемній і ретельній мові замість нього може стояти ", { term: "の" }, "."]
              es: ["El sujeto de la oración lleva ", { term: "が" }, "; en la escritura y el habla cuidada puede ir ", { term: "の" }, " en su lugar."]
              pt: ["O sujeito da oração leva ", { term: "が" }, "; na escrita e na fala cuidada pode ir ", { term: "の" }, " no seu lugar."]
              fr: ["Le sujet de la proposition prend ", { term: "が" }, " ; à l’écrit et à l’oral soigné, ", { term: "の" }, " peut le remplacer."]
              de: ["Das Subjekt des Teilsatzes steht mit ", { term: "が" }, "; in der Schrift und in gepflegter Rede kann ", { term: "の" }, " an seine Stelle treten."]
              it: ["Il soggetto della proposizione prende ", { term: "が" }, "; nello scritto e nel parlato curato può stare ", { term: "の" }, " al suo posto."]
              pl: ["Podmiot zdania bierze ", { term: "が" }, "; w piśmie i w mowie starannej może go zastąpić ", { term: "の" }, "."]
              tr: ["Yan cümlenin öznesi ", { term: "が" }, " alır; yazıda ve özenli konuşmada onun yerine ", { term: "の" }, " gelebilir."]
              id: ["Subjek klausa memakai ", { term: "が" }, "; dalam tulisan dan ucapan yang cermat, ", { term: "の" }, " dapat menggantikannya."]
              vi: ["Chủ ngữ của mệnh đề dùng ", { term: "が" }, "; trong văn viết và lời nói cẩn trọng có thể dùng ", { term: "の" }, " thay vào."]
            ex: ["これは", { kanji: "私", reading: "わたし" }, { target: "の" }, { kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, "です。"]
            tr: { en: "This is the book I bought.", uk: "Це книжка, яку я купив.", es: "Este es el libro que compré.", pt: "Este é o livro que comprei.", fr: "C’est le livre que j’ai acheté.", de: "Das ist das Buch, das ich gekauft habe.", it: "Questo è il libro che ho comprato.", pl: "To jest książka, którą kupiłem.", tr: "Bu, benim aldığım kitap.", id: "Ini buku yang saya beli.", vi: "Đây là quyển sách tôi đã mua." }
          - type: "rule"
            level: "A2"
            text:
              en: ["The topic particle ", { term: "は" }, " does not stand inside the clause. See ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, "."]
              uk: ["Частка теми ", { term: "は" }, " не стоїть усередині частини. Див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, "."]
              es: ["La partícula de tema ", { term: "は" }, " no va dentro de la oración. Véase ", { link: "は y が", to: "ja.sentence-basics.wa-ga" }, "."]
              pt: ["A partícula de tópico ", { term: "は" }, " não fica dentro da oração. Veja ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              fr: ["La particule de thème ", { term: "は" }, " ne se met pas à l’intérieur de la proposition. Voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, "."]
              de: ["Die Themapartikel ", { term: "は" }, " steht nicht im Teilsatz. Siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, "."]
              it: ["La particella del tema ", { term: "は" }, " non sta dentro la proposizione. Vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              pl: ["Partykuła tematu ", { term: "は" }, " nie stoi wewnątrz zdania. Zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, "."]
              tr: ["Konu edatı ", { term: "は" }, " yan cümlenin içinde durmaz. Bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, "."]
              id: ["Partikel topik ", { term: "は" }, " tidak berdiri di dalam klausa. Lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, "."]
              vi: ["Trợ từ chủ đề ", { term: "は" }, " không đứng trong mệnh đề. Xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, "."]
  - title:
      en: "Use: what the noun is in the clause"
      uk: "Вживання: ким є іменник у частині"
      es: "Uso: qué es el sustantivo en la oración"
      pt: "Uso: o que o substantivo é na oração"
      fr: "Emploi : ce qu’est le nom dans la proposition"
      de: "Gebrauch: was das Nomen im Teilsatz ist"
