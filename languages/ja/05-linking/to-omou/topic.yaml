    es: [{ term: "と" }, " tras una oración en forma simple la convierte en el contenido de ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " («creo») o ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " («dijo»)."]
    pt: [{ term: "と" }, " depois de uma oração na forma simples a transforma no conteúdo de ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " («acho») ou ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " («disse»)."]
    fr: [{ term: "と" }, " après une proposition à la forme simple en fait le contenu de ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " (« je pense ») ou ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " (« a dit »)."]
    de: [{ term: "と" }, " nach einem Teilsatz in der einfachen Form macht ihn zum Inhalt von ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " („ich glaube“) oder ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " („sagte“)."]
    it: [{ term: "と" }, " dopo una proposizione alla forma semplice ne fa il contenuto di ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " («penso») o ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " («ha detto»)."]
    pl: [{ term: "と" }, " po zdaniu w formie prostej czyni je treścią słów ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " („myślę”) lub ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " („powiedział”)."]
    tr: ["Yalın biçimli bir yan cümleden sonra gelen ", { term: "と" }, ", onu ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " (“sanıyorum”) ya da ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " (“söyledi”) fiilinin içeriği yapar."]
    id: [{ term: "と" }, " setelah klausa bentuk biasa menjadikannya isi dari ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " (“saya kira”) atau ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " (“berkata”)."]
    vi: [{ term: "と" }, " sau mệnh đề ở thể thường biến nó thành nội dung của ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " (“tôi nghĩ”) hoặc ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " (“đã nói”)."]
  rule:
