summary:
  lead:
    en: [{ term: "と" }, " after a plain-form clause turns it into the content of ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " (“I think”) or ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " (“said”)."]
