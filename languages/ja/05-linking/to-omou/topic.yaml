sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: ["A clause plus ", { term: "と" }, " plus ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " or ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " says what is thought or said."]
              uk: ["Частина + ", { term: "と" }, " + ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " або ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " каже, що думають або що сказали."]
              es: ["Una oración más ", { term: "と" }, " más ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " o ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " dice lo que se piensa o se dijo."]
              pt: ["Uma oração mais ", { term: "と" }, " mais ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " ou ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " diz o que se pensa ou se disse."]
              fr: ["Une proposition plus ", { term: "と" }, " plus ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " ou ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " dit ce que l’on pense ou ce qui a été dit."]
              de: ["Ein Teilsatz plus ", { term: "と" }, " plus ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " oder ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " sagt, was gedacht oder gesagt wird."]
              it: ["Una proposizione più ", { term: "と" }, " più ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " o ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " dice ciò che si pensa o si è detto."]
              pl: ["Zdanie plus ", { term: "と" }, " plus ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " lub ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " mówi, co się myśli albo co powiedziano."]
              tr: ["Yan cümle, ", { term: "と" }, " ve ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " ya da ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " birlikte neyin düşünüldüğünü ya da söylendiğini bildirir."]
              id: ["Klausa, ", { term: "と" }, ", lalu ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " atau ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " menyatakan apa yang dipikirkan atau dikatakan."]
              vi: ["Mệnh đề, ", { term: "と" }, " rồi ", { term: [{ kanji: "思", reading: "おも" }, "います"] }, " hoặc ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " cho biết điều được nghĩ hay được nói."]
            ex: { examples: [["あしたは", { kanji: "雨", reading: "あめ" }, "だ", { target: ["と", { kanji: "思", reading: "おも" }, "います"] }, "。"], [{ kanji: "先生", reading: "せんせい" }, "は、あしたテストがある", { target: ["と", { kanji: "言", reading: "い" }, "いました"] }, "。"]] }
            tr: { en: { examples: ["I think it will rain tomorrow.", "The teacher said there is a test tomorrow."] }, uk: { examples: ["Думаю, завтра буде дощ.", "Вчитель сказав, що завтра буде тест."] }, es: { examples: ["Creo que mañana lloverá.", "El profesor dijo que mañana hay un examen."] }, pt: { examples: ["Acho que vai chover amanhã.", "O professor disse que amanhã tem prova."] }, fr: { examples: ["Je pense qu’il pleuvra demain.", "Le professeur a dit qu’il y a un examen demain."] }, de: { examples: ["Ich glaube, morgen regnet es.", "Der Lehrer hat gesagt, dass morgen eine Prüfung ist."] }, it: { examples: ["Penso che domani pioverà.", "L’insegnante ha detto che domani c’è un esame."] }, pl: { examples: ["Myślę, że jutro będzie padać.", "Nauczyciel powiedział, że jutro jest sprawdzian."] }, tr: { examples: ["Bence yarın yağmur yağacak.", "Öğretmen yarın sınav olduğunu söyledi."] }, id: { examples: ["Saya kira besok akan hujan.", "Guru berkata bahwa besok ada ujian."] }, vi: { examples: ["Tôi nghĩ ngày mai trời sẽ mưa.", "Thầy giáo nói ngày mai có bài kiểm tra."] } }
          - type: "rule"
            level: "A2"
            text:
              en: ["The clause before ", { term: "と" }, " is in the plain form, though the sentence ends in the polite form. See ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: ["Частина перед ", { term: "と" }, " стоїть у простій формі, хоча речення закінчується ввічливою. Див. ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: ["La oración antes de ", { term: "と" }, " va en forma simple, aunque la frase termine en forma cortés. Véase ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: ["A oração antes de ", { term: "と" }, " fica na forma simples, embora a frase termine na forma polida. Veja ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: ["La proposition devant ", { term: "と" }, " est à la forme simple, même si la phrase finit à la forme polie. Voir ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: ["Der Teilsatz vor ", { term: "と" }, " steht in der einfachen Form, obwohl der Satz in der Höflichkeitsform endet. Siehe ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: ["La proposizione davanti a ", { term: "と" }, " è alla forma semplice, anche se la frase finisce alla forma cortese. Vedi ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: ["Zdanie przed ", { term: "と" }, " jest w formie prostej, choć całe zdanie kończy się formą grzecznościową. Zob. ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: ["Cümle nazik biçimle bitse de ", { term: "と" }, " öncesindeki yan cümle yalın biçimdedir. Bkz. ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, "."]
              id: ["Klausa sebelum ", { term: "と" }, " berbentuk biasa, meskipun kalimat berakhir dengan bentuk sopan. Lihat ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: ["Mệnh đề trước ", { term: "と" }, " ở thể thường, dù câu kết thúc bằng thể lịch sự. Xem ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
            ex: ["この", { kanji: "本", reading: "ほん" }, "はおもしろい", { target: "と" }, { kanji: "思", reading: "おも" }, "います。"]
            tr: { en: "I think this book is interesting.", uk: "Думаю, ця книжка цікава.", es: "Creo que este libro es interesante.", pt: "Acho que este livro é interessante.", fr: "Je pense que ce livre est intéressant.", de: "Ich finde dieses Buch interessant.", it: "Penso che questo libro sia interessante.", pl: "Myślę, że ta książka jest ciekawa.", tr: "Bence bu kitap ilginç.", id: "Saya kira buku ini menarik.", vi: "Tôi nghĩ quyển sách này thú vị." }
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " gives your own opinion or guess; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " reports words."]
              uk: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " висловлює вашу думку чи припущення; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " передає слова."]
              es: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " da tu propia opinión o suposición; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " cuenta palabras."]
              pt: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " dá a sua própria opinião ou suposição; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " conta palavras."]
              fr: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " donne votre propre avis ou supposition ; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " rapporte des paroles."]
              de: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " gibt die eigene Meinung oder Vermutung an; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " gibt Worte wieder."]
              it: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " dà la tua opinione o supposizione; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " riferisce parole."]
              pl: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " wyraża twoją opinię lub przypuszczenie; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " przekazuje słowa."]
              tr: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " kendi görüşünüzü ya da tahmininizi bildirir; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " sözleri aktarır."]
              id: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " menyatakan pendapat atau dugaan sendiri; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " melaporkan kata-kata."]
              vi: [{ term: [{ kanji: "思", reading: "おも" }, "います"] }, " nêu ý kiến hoặc phỏng đoán của chính bạn; ", { term: [{ kanji: "言", reading: "い" }, "いました"] }, " thuật lại lời nói."]
