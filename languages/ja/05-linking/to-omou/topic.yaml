              vi: ["Dạng quá khứ và phủ định đứng trước ", { term: "と" }, " như trong câu ở thể thường."]
            ex: { examples: [["ジョンさんはもう", { kanji: "食", reading: "た" }, "べた", { target: "と" }, { kanji: "思", reading: "おも" }, "います。"], ["アンナさんは", { kanji: "行", reading: "い" }, "かない", { target: "と" }, { kanji: "思", reading: "おも" }, "います。"]] }
