title:
  en: "とき and たら: When and If"
  uk: "とき і たら: коли й якщо"
  es: "とき y たら: cuando y si"
  pt: "とき e たら: quando e se"
  fr: "とき et たら : quand et si"
  de: "とき und たら: wenn und falls"
  it: "とき e たら: quando e se"
  pl: "とき i たら: kiedy i jeśli"
  tr: "とき ve たら: -dığında ve eğer"
  id: "とき dan たら: ketika dan kalau"
  vi: "とき và たら: khi và nếu"
summary:
  lead:
    en: [{ term: "とき" }, " makes a clause a time “when”; ", { term: "たら" }, " makes it a condition “if” or a step “once” that the main clause follows."]
    uk: [{ term: "とき" }, " робить частину часом «коли»; ", { term: "たら" }, " робить її умовою «якщо» або кроком «коли вже», за яким іде головна частина."]
    es: [{ term: "とき" }, " convierte una oración en un momento «cuando»; ", { term: "たら" }, " en una condición «si» o un paso «una vez que» al que sigue la principal."]
    pt: [{ term: "とき" }, " faz de uma oração um momento «quando»; ", { term: "たら" }, " a faz uma condição «se» ou um passo «depois que», seguido pela principal."]
    fr: [{ term: "とき" }, " fait d’une proposition un moment « quand » ; ", { term: "たら" }, " en fait une condition « si » ou une étape « une fois que », suivie de la principale."]
    de: [{ term: "とき" }, " macht einen Teilsatz zum Zeitpunkt „wenn“; ", { term: "たら" }, " macht ihn zur Bedingung „falls“ oder zum Schritt „sobald“, dem der Hauptsatz folgt."]
    it: [{ term: "とき" }, " fa di una proposizione un momento «quando»; ", { term: "たら" }, " una condizione «se» o un passo «una volta che», a cui segue la principale."]
    pl: [{ term: "とき" }, " czyni ze zdania moment „kiedy”; ", { term: "たら" }, " czyni je warunkiem „jeśli” lub etapem „gdy już”, po którym idzie zdanie główne."]
    tr: [{ term: "とき" }, " bir yan cümleyi “-dığında” diyen bir zaman, ", { term: "たら" }, " ise “eğer” diyen bir koşul ya da “-ince” diyen bir adım yapar."]
    id: [{ term: "とき" }, " menjadikan klausa sebuah saat “ketika”; ", { term: "たら" }, " menjadikannya syarat “kalau” atau langkah “setelah” yang diikuti klausa utama."]
    vi: [{ term: "とき" }, " biến mệnh đề thành thời điểm “khi”; ", { term: "たら" }, " biến nó thành điều kiện “nếu” hoặc bước “sau khi” mà mệnh đề chính nối theo."]
  rule:
    en: [{ term: "たら" }, " is the plain past form plus ", { term: "ら" }, ":"]
    uk: [{ term: "たら" }, " — це проста минула форма плюс ", { term: "ら" }, ":"]
    es: [{ term: "たら" }, " es la forma simple del pasado más ", { term: "ら" }, ":"]
    pt: [{ term: "たら" }, " é a forma simples do passado mais ", { term: "ら" }, ":"]
    fr: [{ term: "たら" }, " est la forme simple du passé plus ", { term: "ら" }, " :"]
    de: [{ term: "たら" }, " ist die einfache Vergangenheitsform plus ", { term: "ら" }, ":"]
    it: [{ term: "たら" }, " è la forma semplice del passato più ", { term: "ら" }, ":"]
    pl: [{ term: "たら" }, " to forma prosta czasu przeszłego plus ", { term: "ら" }, ":"]
    tr: [{ term: "たら" }, ", yalın geçmiş biçime ", { term: "ら" }, " eklenmiş hâlidir:"]
    id: [{ term: "たら" }, " adalah bentuk lampau biasa ditambah ", { term: "ら" }, ":"]
    vi: [{ term: "たら" }, " là thể quá khứ thường cộng với ", { term: "ら" }, ":"]
  ex: [{ kanji: "安", reading: "やす" }, "かっ", { target: "たら" }, "、", { kanji: "買", reading: "か" }, "います。"]
