sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "とき" }, " and ", { term: "たら" }, " join a first clause to a main clause; the main clause ends the sentence and may be polite."]
              uk: [{ term: "とき" }, " і ", { term: "たら" }, " з’єднують першу частину з головною; головна частина завершує речення й може бути ввічливою."]
              es: [{ term: "とき" }, " y ", { term: "たら" }, " unen una primera oración con la principal; la principal cierra la frase y puede ser cortés."]
              pt: [{ term: "とき" }, " e ", { term: "たら" }, " ligam uma primeira oração à principal; a principal encerra a frase e pode ser polida."]
              fr: [{ term: "とき" }, " et ", { term: "たら" }, " relient une première proposition à la principale ; la principale termine la phrase et peut être polie."]
              de: [{ term: "とき" }, " und ", { term: "たら" }, " verbinden einen ersten Teilsatz mit dem Hauptsatz; der Hauptsatz beschließt den Satz und kann höflich sein."]
              it: [{ term: "とき" }, " e ", { term: "たら" }, " collegano una prima proposizione alla principale; la principale chiude la frase e può essere cortese."]
              pl: [{ term: "とき" }, " i ", { term: "たら" }, " łączą pierwsze zdanie ze zdaniem głównym; zdanie główne kończy całość i może być grzecznościowe."]
              tr: [{ term: "とき" }, " ve ", { term: "たら" }, " ilk yan cümleyi ana cümleye bağlar; ana cümle cümleyi bitirir ve nazik biçimde olabilir."]
              id: [{ term: "とき" }, " dan ", { term: "たら" }, " menghubungkan klausa pertama dengan klausa utama; klausa utama mengakhiri kalimat dan boleh berbentuk sopan."]
              vi: [{ term: "とき" }, " và ", { term: "たら" }, " nối mệnh đề đầu với mệnh đề chính; mệnh đề chính kết thúc câu và có thể ở thể lịch sự."]
            ex: { examples: [["ひまな", { target: "とき" }, "、えいがを", { kanji: "見", reading: "み" }, "ます。"], [{ kanji: "安", reading: "やす" }, "かっ", { target: "たら" }, "、", { kanji: "買", reading: "か" }, "います。"]] }
            tr: { en: { examples: ["When I'm free, I watch movies.", "If it's cheap, I'll buy it."] }, uk: { examples: ["Коли маю вільний час, дивлюся фільми.", "Якщо буде дешево, куплю."] }, es: { examples: ["Cuando estoy libre, veo películas.", "Si es barato, lo compraré."] }, pt: { examples: ["Quando estou livre, assisto a filmes.", "Se for barato, vou comprar."] }, fr: { examples: ["Quand je suis libre, je regarde des films.", "Si c’est bon marché, je l’achèterai."] }, de: { examples: ["Wenn ich Zeit habe, sehe ich Filme.", "Wenn es billig ist, kaufe ich es."] }, it: { examples: ["Quando sono libero, guardo i film.", "Se è economico, lo compro."] }, pl: { examples: ["Kiedy mam wolny czas, oglądam filmy.", "Jeśli będzie tanie, kupię."] }, tr: { examples: ["Boş olduğumda film izlerim.", "Ucuzsa alırım."] }, id: { examples: ["Kalau senggang, saya menonton film.", "Kalau murah, saya akan membelinya."] }, vi: { examples: ["Khi rảnh, tôi xem phim.", "Nếu rẻ, tôi sẽ mua."] } }
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "とき" }, " is a noun, so a clause before it works like a clause before a noun. See ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Clauses Before Nouns"], to: "ja.linking.noun-modification" }, "."]
              uk: [{ term: "とき" }, " — іменник, тож частина перед ним діє, як частина перед іменником. Див. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": речення перед іменником"], to: "ja.linking.noun-modification" }, "."]
              es: [{ term: "とき" }, " es un sustantivo, así que la oración que lo precede funciona como una oración antes de un sustantivo. Véase ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": oraciones antes del sustantivo"], to: "ja.linking.noun-modification" }, "."]
              pt: [{ term: "とき" }, " é um substantivo, então a oração antes dele funciona como uma oração antes de um substantivo. Veja ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": orações antes do substantivo"], to: "ja.linking.noun-modification" }, "."]
              fr: [{ term: "とき" }, " est un nom, donc la proposition qui le précède fonctionne comme une proposition devant un nom. Voir ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, " : une proposition devant le nom"], to: "ja.linking.noun-modification" }, "."]
              de: [{ term: "とき" }, " ist ein Nomen, daher wirkt der Teilsatz davor wie ein Teilsatz vor einem Nomen. Siehe ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": Sätze vor dem Nomen"], to: "ja.linking.noun-modification" }, "."]
              it: [{ term: "とき" }, " è un nome, quindi la proposizione che lo precede funziona come una proposizione prima di un nome. Vedi ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": proposizioni prima del nome"], to: "ja.linking.noun-modification" }, "."]
              pl: [{ term: "とき" }, " jest rzeczownikiem, więc zdanie przed nim działa jak zdanie przed rzeczownikiem. Zob. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": zdanie przed rzeczownikiem"], to: "ja.linking.noun-modification" }, "."]
              tr: [{ term: "とき" }, " bir isimdir; bu yüzden önündeki yan cümle, ismin önündeki yan cümle gibi çalışır. Bkz. ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": ismin önündeki cümle"], to: "ja.linking.noun-modification" }, "."]
              id: [{ term: "とき" }, " adalah kata benda, jadi klausa di depannya bekerja seperti klausa sebelum kata benda. Lihat ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": klausa sebelum kata benda"], to: "ja.linking.noun-modification" }, "."]
              vi: [{ term: "とき" }, " là danh từ, nên mệnh đề đứng trước nó hoạt động như mệnh đề trước danh từ. Xem ", { link: [{ kanji: "買", reading: "か" }, "った", { kanji: "本", reading: "ほん" }, ": mệnh đề đứng trước danh từ"], to: "ja.linking.noun-modification" }, "."]
            ex: ["ひまな", { target: "とき" }, "、えいがを", { kanji: "見", reading: "み" }, "ます。"]
            tr: { en: "When I'm free, I watch movies.", uk: "Коли маю вільний час, дивлюся фільми.", es: "Cuando estoy libre, veo películas.", pt: "Quando estou livre, assisto a filmes.", fr: "Quand je suis libre, je regarde des films.", de: "Wenn ich Zeit habe, sehe ich Filme.", it: "Quando sono libero, guardo i film.", pl: "Kiedy mam wolny czas, oglądam filmy.", tr: "Boş olduğumda film izlerim.", id: "Kalau senggang, saya menonton film.", vi: "Khi rảnh, tôi xem phim." }
          - type: "rule"
            level: "A2"
            text:
              en: [{ term: "たら" }, " is the plain past form plus ", { term: "ら" }, "; the plain forms are in ", { link: "The Plain Form", to: ja.verbs.plain-form }, "."]
              uk: [{ term: "たら" }, " — проста минула форма плюс ", { term: "ら" }, "; прості форми описано в ", { link: "Проста форма", to: "ja.verbs.plain-form" }, "."]
              es: [{ term: "たら" }, " es la forma simple del pasado más ", { term: "ら" }, "; las formas simples están en ", { link: "La forma simple", to: "ja.verbs.plain-form" }, "."]
              pt: [{ term: "たら" }, " é a forma simples do passado mais ", { term: "ら" }, "; as formas simples estão em ", { link: "A forma simples", to: "ja.verbs.plain-form" }, "."]
              fr: [{ term: "たら" }, " est la forme simple du passé plus ", { term: "ら" }, " ; les formes simples sont dans ", { link: "La forme simple", to: "ja.verbs.plain-form" }, "."]
              de: [{ term: "たら" }, " ist die einfache Vergangenheitsform plus ", { term: "ら" }, "; die einfachen Formen stehen unter ", { link: "Die einfache Form", to: "ja.verbs.plain-form" }, "."]
              it: [{ term: "たら" }, " è la forma semplice del passato più ", { term: "ら" }, "; le forme semplici sono in ", { link: "La forma semplice", to: "ja.verbs.plain-form" }, "."]
              pl: [{ term: "たら" }, " to forma prosta czasu przeszłego plus ", { term: "ら" }, "; formy proste opisano w ", { link: "Forma prosta", to: "ja.verbs.plain-form" }, "."]
              tr: [{ term: "たら" }, ", yalın geçmiş biçime ", { term: "ら" }, " eklenerek kurulur; yalın biçimler ", { link: "Yalın biçim", to: "ja.verbs.plain-form" }, " konusundadır."]
              id: [{ term: "たら" }, " adalah bentuk lampau biasa ditambah ", { term: "ら" }, "; bentuk biasa ada di ", { link: "Bentuk biasa", to: "ja.verbs.plain-form" }, "."]
              vi: [{ term: "たら" }, " là thể quá khứ thường cộng ", { term: "ら" }, "; các thể thường nằm ở ", { link: "Thể thường", to: "ja.verbs.plain-form" }, "."]
            ex: [{ kanji: "安", reading: "やす" }, "かっ", { target: "たら" }, "、", { kanji: "買", reading: "か" }, "います。"]
            tr: { en: "If it's cheap, I'll buy it.", uk: "Якщо буде дешево, куплю.", es: "Si es barato, lo compraré.", pt: "Se for barato, vou comprar.", fr: "Si c’est bon marché, je l’achèterai.", de: "Wenn es billig ist, kaufe ich es.", it: "Se è economico, lo compro.", pl: "Jeśli będzie tanie, kupię.", tr: "Ucuzsa alırım.", id: "Kalau murah, saya akan membelinya.", vi: "Nếu rẻ, tôi sẽ mua." }
