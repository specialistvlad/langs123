            vi: [{ term: "から" }, " không bao giờ mở đầu lý do; nó khép lại lý do."]
          ex: ["あついです", { target: "から" }, "、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
          tr: { en: "It's hot, so I'll drink water.", uk: "Спекотно, тому я питиму воду.", es: "Hace calor, así que voy a beber agua.", pt: "Está calor, então vou beber água.", fr: "Il fait chaud, alors je vais boire de l’eau.", de: "Es ist heiß, deshalb trinke ich Wasser.", it: "Fa caldo, quindi bevo dell’acqua.", pl: "Jest gorąco, więc napiję się wody.", tr: "Hava sıcak, o yüzden su içeceğim.", id: "Panas, jadi saya akan minum air.", vi: "Trời nóng nên tôi sẽ uống nước." }
        - level: "A1"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
          rule:
            en: [{ term: "そして" }, " joins sentences; ", { term: "と" }, " joins nouns."]
            uk: [{ term: "そして" }, " зв’язує речення, ", { term: "と" }, " — іменники."]
            es: [{ term: "そして" }, " une oraciones; ", { term: "と" }, " une sustantivos."]
            pt: [{ term: "そして" }, " liga frases; ", { term: "と" }, " liga substantivos."]
            fr: [{ term: "そして" }, " relie des phrases ; ", { term: "と" }, " relie des noms."]
            de: [{ term: "そして" }, " verbindet Sätze; ", { term: "と" }, " verbindet Nomen."]
            it: [{ term: "そして" }, " collega frasi; ", { term: "と" }, " collega nomi."]
            pl: [{ term: "そして" }, " łączy zdania; ", { term: "と" }, " łączy rzeczowniki."]
            tr: [{ term: "そして" }, " cümleleri, ", { term: "と" }, " isimleri bağlar."]
            id: [{ term: "そして" }, " menghubungkan kalimat; ", { term: "と" }, " menghubungkan kata benda."]
            vi: [{ term: "そして" }, " nối câu; ", { term: "と" }, " nối danh từ."]
          ex: [{ kanji: "私", reading: "わたし" }, { target: "と" }, "アンナさんは", { kanji: "学生", reading: "がくせい" }, "です。"]
          tr: { en: "Anna and I are students.", uk: "Ми з Анною студенти.", es: "Anna y yo somos estudiantes.", pt: "Anna e eu somos estudantes.", fr: "Anna et moi, nous sommes étudiants.", de: "Anna und ich sind Studenten.", it: "Anna e io siamo studenti.", pl: "Anna i ja jesteśmy studentami.", tr: "Anna ve ben öğrenciyiz.", id: "Anna dan saya adalah mahasiswa.", vi: "Anna và tôi là sinh viên." }
sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "そして" }, ", ", { term: "それから" }, " and ", { term: "でも" }, " open a new sentence and link it to the one before."]
              uk: [{ term: "そして" }, ", ", { term: "それから" }, " і ", { term: "でも" }, " відкривають нове речення й зв’язують його з попереднім."]
              es: [{ term: "そして" }, ", ", { term: "それから" }, " y ", { term: "でも" }, " abren una oración nueva y la unen con la anterior."]
              pt: [{ term: "そして" }, ", ", { term: "それから" }, " e ", { term: "でも" }, " abrem uma frase nova e a ligam à anterior."]
              fr: [{ term: "そして" }, ", ", { term: "それから" }, " et ", { term: "でも" }, " ouvrent une nouvelle phrase et la relient à la précédente."]
              de: [{ term: "そして" }, ", ", { term: "それから" }, " und ", { term: "でも" }, " eröffnen einen neuen Satz und verbinden ihn mit dem vorigen."]
              it: [{ term: "そして" }, ", ", { term: "それから" }, " e ", { term: "でも" }, " aprono una nuova frase e la collegano alla precedente."]
              pl: [{ term: "そして" }, ", ", { term: "それから" }, " i ", { term: "でも" }, " otwierają nowe zdanie i łączą je z poprzednim."]
              tr: [{ term: "そして" }, ", ", { term: "それから" }, " ve ", { term: "でも" }, " yeni bir cümle açar ve onu öncekine bağlar."]
              id: [{ term: "そして" }, ", ", { term: "それから" }, ", dan ", { term: "でも" }, " membuka kalimat baru dan menghubungkannya dengan kalimat sebelumnya."]
              vi: [{ term: "そして" }, ", ", { term: "それから" }, " và ", { term: "でも" }, " mở đầu một câu mới và nối nó với câu trước."]
            ex: ["この", { kanji: "本", reading: "ほん" }, "は", { kanji: "小", reading: "ちい" }, "さいです。", { target: "そして" }, "、やすいです。"]
            tr: { en: "This book is small. And it is cheap.", uk: "Ця книжка маленька. І вона дешева.", es: "Este libro es pequeño. Y es barato.", pt: "Este livro é pequeno. E é barato.", fr: "Ce livre est petit. Et il est bon marché.", de: "Dieses Buch ist klein. Und es ist billig.", it: "Questo libro è piccolo. Ed è economico.", pl: "Ta książka jest mała. I jest tania.", tr: "Bu kitap küçük. Ve ucuz.", id: "Buku ini kecil. Dan harganya murah.", vi: "Quyển sách này nhỏ. Và nó rẻ." }
          - type: "rule"
            level: "A1"
            text:
              en: "A comma follows a linking word at the start of a sentence."
              uk: "Після сполучного слова на початку речення ставлять кому."
              es: "Una coma sigue a la palabra de enlace al comienzo de la oración."
              pt: "Uma vírgula segue a palavra de ligação no início da frase."
              fr: "Une virgule suit le mot de liaison en début de phrase."
              de: "Auf ein Bindewort am Satzanfang folgt ein Komma."
              it: "Una virgola segue la parola di collegamento a inizio frase."
              pl: "Po spójniku na początku zdania stawia się przecinek."
              tr: "Cümle başındaki bağlaçtan sonra virgül gelir."
              id: "Koma mengikuti kata penghubung di awal kalimat."
              vi: "Sau từ nối ở đầu câu có dấu phẩy."
            ex: [{ kanji: "日本", reading: "にほん" }, "のごはんはすきです。でも", { target: "、" }, "さしみは", { kanji: "食", reading: "た" }, "べません。"]
            tr: { en: "I like Japanese food. But I don't eat sashimi.", uk: "Я люблю японську кухню. Але сашимі не їм.", es: "Me gusta la comida japonesa. Pero no como sashimi.", pt: "Gosto de comida japonesa. Mas não como sashimi.", fr: "J’aime la cuisine japonaise. Mais je ne mange pas de sashimi.", de: "Ich mag japanisches Essen. Aber Sashimi esse ich nicht.", it: "Mi piace la cucina giapponese. Ma non mangio il sashimi.", pl: "Lubię japońskie jedzenie. Ale nie jem sashimi.", tr: "Japon yemeklerini severim. Ama sashimi yemem.", id: "Saya suka makanan Jepang. Tapi saya tidak makan sashimi.", vi: "Tôi thích món ăn Nhật. Nhưng tôi không ăn sashimi." }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "から" }, ", ", { term: "が" }, " and ", { term: "けど" }, " follow a complete clause and join it to the next one."]
              uk: [{ term: "から" }, ", ", { term: "が" }, " і ", { term: "けど" }, " стоять після повної частини й зв’язують її з наступною."]
              es: [{ term: "から" }, ", ", { term: "が" }, " y ", { term: "けど" }, " van tras una oración completa y la unen con la siguiente."]
              pt: [{ term: "から" }, ", ", { term: "が" }, " e ", { term: "けど" }, " vêm depois de uma oração completa e a ligam à seguinte."]
              fr: [{ term: "から" }, ", ", { term: "が" }, " et ", { term: "けど" }, " suivent une proposition complète et la relient à la suivante."]
              de: [{ term: "から" }, ", ", { term: "が" }, " und ", { term: "けど" }, " stehen hinter einem vollständigen Teilsatz und verbinden ihn mit dem nächsten."]
              it: [{ term: "から" }, ", ", { term: "が" }, " e ", { term: "けど" }, " seguono una proposizione completa e la collegano alla successiva."]
              pl: [{ term: "から" }, ", ", { term: "が" }, " i ", { term: "けど" }, " stoją po pełnym zdaniu składowym i łączą je z następnym."]
              tr: [{ term: "から" }, ", ", { term: "が" }, " ve ", { term: "けど" }, " tam bir yan cümlenin ardından gelir ve onu sonrakine bağlar."]
              id: [{ term: "から" }, ", ", { term: "が" }, ", dan ", { term: "けど" }, " mengikuti klausa lengkap dan menghubungkannya dengan klausa berikutnya."]
              vi: [{ term: "から" }, ", ", { term: "が" }, " và ", { term: "けど" }, " đứng sau một mệnh đề đầy đủ và nối nó với mệnh đề sau."]
            ex: ["にほんごはむずかしい", { target: "ですが" }, "、おもしろいです。"]
            tr: { en: "Japanese is difficult, but interesting.", uk: "Японська складна, але цікава.", es: "El japonés es difícil, pero interesante.", pt: "O japonês é difícil, mas interessante.", fr: "Le japonais est difficile, mais intéressant.", de: "Japanisch ist schwierig, aber interessant.", it: "Il giapponese è difficile, ma interessante.", pl: "Japoński jest trudny, ale ciekawy.", tr: "Japonca zor ama ilginç.", id: "Bahasa Jepang sulit, tetapi menarik.", vi: "Tiếng Nhật khó nhưng thú vị." }
          - type: "note"
            level: "A1"
            text:
              en: [{ term: "が" }, " here means “but”; the particle ", { term: "が" }, " of the subject is another word. See ", { link: "は and が", to: "ja.sentence-basics.wa-ga" }, "."]
              uk: [{ term: "が" }, " тут означає «але»; частка підмета ", { term: "が" }, " — інше слово. Див. ", { link: "は і が", to: "ja.sentence-basics.wa-ga" }, "."]
              es: [{ term: "が" }, " aquí significa «pero»; la partícula ", { term: "が" }, " del sujeto es otra palabra. Véase ", { link: "は y が", to: "ja.sentence-basics.wa-ga" }, "."]
              pt: [{ term: "が" }, " aqui significa «mas»; a partícula ", { term: "が" }, " do sujeito é outra palavra. Veja ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              fr: [{ term: "が" }, " signifie ici « mais » ; la particule ", { term: "が" }, " du sujet est un autre mot. Voir ", { link: "は et が", to: "ja.sentence-basics.wa-ga" }, "."]
              de: [{ term: "が" }, " heißt hier „aber“; die Subjektpartikel ", { term: "が" }, " ist ein anderes Wort. Siehe ", { link: "は und が", to: "ja.sentence-basics.wa-ga" }, "."]
              it: [{ term: "が" }, " qui significa «ma»; la particella ", { term: "が" }, " del soggetto è un'altra parola. Vedi ", { link: "は e が", to: "ja.sentence-basics.wa-ga" }, "."]
              pl: [{ term: "が" }, " znaczy tu „ale”; partykuła podmiotu ", { term: "が" }, " to inne słowo. Zob. ", { link: "は i が", to: "ja.sentence-basics.wa-ga" }, "."]
              tr: [{ term: "が" }, " burada “ama” demektir; özne edatı ", { term: "が" }, " başka bir sözcüktür. Bkz. ", { link: "は ve が", to: "ja.sentence-basics.wa-ga" }, "."]
              id: [{ term: "が" }, " di sini berarti “tetapi”; partikel subjek ", { term: "が" }, " adalah kata lain. Lihat ", { link: "は dan が", to: "ja.sentence-basics.wa-ga" }, "."]
              vi: [{ term: "が" }, " ở đây nghĩa là “nhưng”; trợ từ chủ ngữ ", { term: "が" }, " là một từ khác. Xem ", { link: "は và が", to: "ja.sentence-basics.wa-ga" }, "."]
  - title:
      en: "Between sentences"
      uk: "Між реченнями"
      es: "Entre oraciones"
      pt: "Entre frases"
      fr: "Entre les phrases"
      de: "Zwischen Sätzen"
      it: "Tra le frasi"
      pl: "Między zdaniami"
      tr: "Cümleler arasında"
      id: "Antar kalimat"
      vi: "Giữa các câu"
    role: "own"
    content:
      - type: "usage"
        columns:
          - { key: "word", label: { en: "Word", uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Kelime", id: "Kata", vi: "Từ" } }
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            word: { term: "そして" }
            use:
              en: "Adds a second fact: “and”."
              uk: "Додає другий факт: «і»."
              es: "Añade un segundo hecho: «y»."
              pt: "Acrescenta um segundo fato: «e»."
              fr: "Ajoute un second fait : « et »."
              de: "Fügt eine zweite Tatsache hinzu: „und“."
              it: "Aggiunge un secondo fatto: «e»."
              pl: "Dodaje drugi fakt: „i”."
              tr: "İkinci bir bilgi ekler: “ve”."
              id: "Menambah fakta kedua: “dan”."
              vi: "Thêm ý thứ hai: “và”."
            ex: ["この", { kanji: "本", reading: "ほん" }, "は", { kanji: "小", reading: "ちい" }, "さいです。", { target: "そして" }, "、やすいです。"]
            tr: { en: "This book is small. And it is cheap.", uk: "Ця книжка маленька. І вона дешева.", es: "Este libro es pequeño. Y es barato.", pt: "Este livro é pequeno. E é barato.", fr: "Ce livre est petit. Et il est bon marché.", de: "Dieses Buch ist klein. Und es ist billig.", it: "Questo libro è piccolo. Ed è economico.", pl: "Ta książka jest mała. I jest tania.", tr: "Bu kitap küçük. Ve ucuz.", id: "Buku ini kecil. Dan harganya murah.", vi: "Quyển sách này nhỏ. Và nó rẻ." }
          - level: "A1"
            word: { term: "それから" }
            use:
              en: "Gives what comes next in time: “after that”."
              uk: "Називає те, що йде далі в часі: «потім»."
              es: "Dice lo que viene después en el tiempo: «después»."
              pt: "Diz o que vem depois no tempo: «depois»."
              fr: "Dit ce qui vient ensuite dans le temps : « ensuite »."
              de: "Nennt, was zeitlich als Nächstes kommt: „danach“."
              it: "Dice ciò che viene dopo nel tempo: «poi»."
              pl: "Podaje to, co następuje w czasie: „potem”."
              tr: "Zamanda sonra gelen şeyi söyler: “sonra”."
              id: "Menyebut apa yang terjadi berikutnya: “setelah itu”."
              vi: "Nêu điều xảy ra tiếp theo về thời gian: “sau đó”."
            ex: ["あさごはんを", { kanji: "食", reading: "た" }, "べました。", { target: "それから" }, "、がっこうへ", { kanji: "行", reading: "い" }, "きました。"]
            tr: { en: "I had breakfast. After that I went to school.", uk: "Я поснідав. Потім пішов до школи.", es: "Desayuné. Después fui a la escuela.", pt: "Tomei café da manhã. Depois fui para a escola.", fr: "J’ai pris le petit-déjeuner. Ensuite, je suis allé à l’école.", de: "Ich habe gefrühstückt. Danach bin ich zur Schule gegangen.", it: "Ho fatto colazione. Poi sono andato a scuola.", pl: "Zjadłem śniadanie. Potem poszedłem do szkoły.", tr: "Kahvaltı yaptım. Sonra okula gittim.", id: "Saya sarapan. Setelah itu saya pergi ke sekolah.", vi: "Tôi ăn sáng. Sau đó tôi đến trường." }
          - level: "A1"
            word: { term: "でも" }
            use:
              en: "Contrasts with the sentence before: “but”."
              uk: "Протиставляє попередньому реченню: «але»."
              es: "Contrasta con la oración anterior: «pero»."
              pt: "Contrasta com a frase anterior: «mas»."
              fr: "S’oppose à la phrase précédente : « mais »."
              de: "Steht im Gegensatz zum vorigen Satz: „aber“."
              it: "Contrasta con la frase precedente: «ma»."
              pl: "Przeciwstawia się poprzedniemu zdaniu: „ale”."
              tr: "Önceki cümleyle çelişir: “ama”."
              id: "Berlawanan dengan kalimat sebelumnya: “tapi”."
              vi: "Đối lập với câu trước: “nhưng”."
            ex: [{ kanji: "日本", reading: "にほん" }, "のごはんはすきです。", { target: "でも" }, "、さしみは", { kanji: "食", reading: "た" }, "べません。"]
            tr: { en: "I like Japanese food. But I don't eat sashimi.", uk: "Я люблю японську кухню. Але сашимі не їм.", es: "Me gusta la comida japonesa. Pero no como sashimi.", pt: "Gosto de comida japonesa. Mas não como sashimi.", fr: "J’aime la cuisine japonaise. Mais je ne mange pas de sashimi.", de: "Ich mag japanisches Essen. Aber Sashimi esse ich nicht.", it: "Mi piace la cucina giapponese. Ma non mangio il sashimi.", pl: "Lubię japońskie jedzenie. Ale nie jem sashimi.", tr: "Japon yemeklerini severim. Ama sashimi yemem.", id: "Saya suka makanan Jepang. Tapi saya tidak makan sashimi.", vi: "Tôi thích món ăn Nhật. Nhưng tôi không ăn sashimi." }
          - level: "A2"
            word: { term: "だから" }
            use:
              en: "Gives the result of the sentence before: “so”."
              uk: "Дає наслідок попереднього речення: «тому»."
              es: "Da el resultado de la oración anterior: «por eso»."
              pt: "Dá o resultado da frase anterior: «por isso»."
              fr: "Donne le résultat de la phrase précédente : « donc »."
              de: "Nennt das Ergebnis des vorigen Satzes: „deshalb“."
              it: "Dà il risultato della frase precedente: «quindi»."
              pl: "Podaje skutek poprzedniego zdania: „dlatego”."
              tr: "Önceki cümlenin sonucunu verir: “bu yüzden”."
              id: "Memberi akibat dari kalimat sebelumnya: “karena itu”."
              vi: "Nêu kết quả của câu trước: “vì vậy”."
            ex: ["あしたはテストがあります。", { target: "だから" }, "、", { kanji: "今", reading: "いま" }, "べんきょうします。"]
            tr: { en: "Tomorrow I have a test. So I'm studying now.", uk: "Завтра в мене тест. Тому зараз я вчуся.", es: "Mañana tengo un examen. Por eso estudio ahora.", pt: "Amanhã tenho uma prova. Por isso estudo agora.", fr: "Demain, j’ai un examen. Donc j’étudie maintenant.", de: "Morgen habe ich eine Prüfung. Deshalb lerne ich jetzt.", it: "Domani ho un esame. Quindi studio adesso.", pl: "Jutro mam sprawdzian. Dlatego teraz się uczę.", tr: "Yarın sınavım var. Bu yüzden şimdi çalışıyorum.", id: "Besok ada ujian. Karena itu sekarang saya belajar.", vi: "Ngày mai có bài kiểm tra. Vì vậy bây giờ tôi học bài." }
          - level: "A2"
            word: { term: "しかし" }
            use:
              en: ["Contrasts like ", { term: "でも" }, ", in writing and formal speech: “however”."]
              uk: ["Протиставляє, як ", { term: "でも" }, ", на письмі й в офіційному мовленні: «однак»."]
              es: ["Contrasta como ", { term: "でも" }, ", en la escritura y el habla formal: «sin embargo»."]
              pt: ["Contrasta como ", { term: "でも" }, ", na escrita e na fala formal: «no entanto»."]
              fr: ["S’oppose comme ", { term: "でも" }, ", à l’écrit et à l’oral formel : « cependant »."]
              de: ["Kontrastiert wie ", { term: "でも" }, ", schriftlich und in formeller Rede: „jedoch“."]
              it: ["Contrasta come ", { term: "でも" }, ", nello scritto e nel parlato formale: «tuttavia»."]
              pl: ["Przeciwstawia jak ", { term: "でも" }, ", w piśmie i w mowie oficjalnej: „jednak”."]
              tr: [{ term: "でも" }, " gibi çelişir; yazıda ve resmî konuşmada: “ancak”."]
              id: ["Berlawanan seperti ", { term: "でも" }, ", dalam tulisan dan ucapan formal: “namun”."]
              vi: ["Đối lập như ", { term: "でも" }, ", trong văn viết và lời nói trang trọng: “tuy nhiên”."]
            ex: [{ kanji: "日本", reading: "にほん" }, "のなつはあついです。", { target: "しかし" }, "、ふゆはさむいです。"]
            tr: { en: "Summers in Japan are hot. However, winters are cold.", uk: "Літо в Японії спекотне. Однак зима холодна.", es: "El verano en Japón es caluroso. Sin embargo, el invierno es frío.", pt: "O verão no Japão é quente. No entanto, o inverno é frio.", fr: "L’été au Japon est chaud. Cependant, l’hiver est froid.", de: "Der Sommer in Japan ist heiß. Der Winter ist jedoch kalt.", it: "L’estate in Giappone è calda. Tuttavia l’inverno è freddo.", pl: "Lato w Japonii jest gorące. Jednak zima jest zimna.", tr: "Japonya’da yaz sıcaktır. Ancak kış soğuktur.", id: "Musim panas di Jepang itu panas. Namun, musim dinginnya dingin.", vi: "Mùa hè ở Nhật Bản nóng. Tuy nhiên, mùa đông lại lạnh." }
  - title:
      en: "Inside a sentence"
      uk: "Усередині речення"
      es: "Dentro de una oración"
      pt: "Dentro de uma frase"
      fr: "À l’intérieur d’une phrase"
      de: "Innerhalb eines Satzes"
      it: "Dentro una frase"
      pl: "Wewnątrz zdania"
      tr: "Cümle içinde"
      id: "Di dalam kalimat"
      vi: "Trong một câu"
    role: "own"
    content:
      - type: "usage"
        columns:
          - { key: "word", label: { en: "Word", uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Kelime", id: "Kata", vi: "Từ" } }
          - { key: "use", label: { en: "Use", uk: "Вживання", es: "Uso", pt: "Uso", fr: "Emploi", de: "Gebrauch", it: "Uso", pl: "Użycie", tr: "Kullanım", id: "Penggunaan", vi: "Cách dùng" } }
          - { key: "ex", label: { en: "Example", uk: "Приклад", es: "Ejemplo", pt: "Exemplo", fr: "Exemple", de: "Beispiel", it: "Esempio", pl: "Przykład", tr: "Örnek", id: "Contoh", vi: "Ví dụ" } }
        rows:
          - level: "A1"
            word: { term: "から" }
            use:
              en: "Follows the reason; the result comes after it: “so, because”."
              uk: "Стоїть після причини, а наслідок — далі: «тому що, тож»."
              es: "Sigue a la razón; el resultado va después: «porque, así que»."
              pt: "Vem depois da razão; o resultado vem depois: «porque, então»."
              fr: "Suit la raison ; le résultat vient après : « parce que, alors »."
              de: "Steht hinter dem Grund; danach folgt das Ergebnis: „weil, deshalb“."
              it: "Segue la ragione; il risultato viene dopo: «perché, quindi»."
              pl: "Stoi po przyczynie; skutek następuje po nim: „bo, więc”."
              tr: "Nedenden sonra gelir; sonuç ardından gelir: “çünkü, o yüzden”."
              id: "Mengikuti alasan; hasilnya menyusul: “karena, jadi”."
              vi: "Đứng sau lý do; kết quả đến sau: “vì, nên”."
            ex: ["あついです", { target: "から" }, "、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
            tr: { en: "It's hot, so I'll drink water.", uk: "Спекотно, тому я питиму воду.", es: "Hace calor, así que voy a beber agua.", pt: "Está calor, então vou beber água.", fr: "Il fait chaud, alors je vais boire de l’eau.", de: "Es ist heiß, deshalb trinke ich Wasser.", it: "Fa caldo, quindi bevo dell’acqua.", pl: "Jest gorąco, więc napiję się wody.", tr: "Hava sıcak, o yüzden su içeceğim.", id: "Panas, jadi saya akan minum air.", vi: "Trời nóng nên tôi sẽ uống nước." }
          - level: "A1"
            word: { term: "から" }
            use:
              en: "Answers “why” with the reason alone."
              uk: "Відповідає на «чому» самою причиною."
              es: "Responde a «por qué» solo con la razón."
              pt: "Responde a «por quê» só com a razão."
              fr: "Répond à « pourquoi » par la seule raison."
              de: "Antwortet auf „warum“ allein mit dem Grund."
              it: "Risponde a «perché» con la sola ragione."
              pl: "Odpowiada na „dlaczego” samą przyczyną."
              tr: "“Neden” sorusuna yalnızca nedenle cevap verir."
              id: "Menjawab “kenapa” hanya dengan alasan."
              vi: "Trả lời “tại sao” chỉ bằng lý do."
            ex: { exchange: ["どうしてですか。", ["じかんがありません", { target: "から" }, "。"]] }
            tr: { en: "Why? — Because I have no time.", uk: "Чому? — Бо в мене немає часу.", es: "¿Por qué? — Porque no tengo tiempo.", pt: "Por quê? — Porque não tenho tempo.", fr: "Pourquoi ? — Parce que je n’ai pas le temps.", de: "Warum? — Weil ich keine Zeit habe.", it: "Perché? — Perché non ho tempo.", pl: "Dlaczego? — Bo nie mam czasu.", tr: "Neden? — Çünkü vaktim yok.", id: "Kenapa? — Karena saya tidak punya waktu.", vi: "Tại sao? — Vì tôi không có thời gian." }
          - level: "A2"
            word: { term: "から" }
            use:
              en: "After a plain form in casual speech."
              uk: "Після простої форми в невимушеній мові."
              es: "Tras una forma simple en el habla informal."
              pt: "Depois de uma forma simples na fala informal."
              fr: "Après une forme simple dans la langue familière."
              de: "Nach einer einfachen Form in der Umgangssprache."
              it: "Dopo una forma semplice nel parlato informale."
              pl: "Po formie prostej w mowie potocznej."
              tr: "Gündelik konuşmada yalın biçimden sonra."
              id: "Setelah bentuk biasa dalam ragam santai."
              vi: "Sau thể thường trong văn nói thân mật."
            ex: ["あつい", { target: "から" }, "、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "む。"]
            tr: { en: "It's hot, so I'll drink water.", uk: "Спекотно, тому я питиму воду.", es: "Hace calor, así que voy a beber agua.", pt: "Está calor, então vou beber água.", fr: "Il fait chaud, alors je vais boire de l’eau.", de: "Es ist heiß, deshalb trinke ich Wasser.", it: "Fa caldo, quindi bevo dell’acqua.", pl: "Jest gorąco, więc napiję się wody.", tr: "Hava sıcak, o yüzden su içeceğim.", id: "Panas, jadi saya akan minum air.", vi: "Trời nóng nên tôi sẽ uống nước." }
          - level: "A1"
            word: { term: "が" }
            use:
              en: "Joins two clauses that contrast: “but”."
              uk: "Зв’язує дві частини, що суперечать одна одній: «але»."
              es: "Une dos partes que contrastan: «pero»."
              pt: "Liga duas partes que contrastam: «mas»."
              fr: "Relie deux parties qui s’opposent : « mais »."
              de: "Verbindet zwei gegensätzliche Teile: „aber“."
              it: "Collega due parti che contrastano: «ma»."
              pl: "Łączy dwie przeciwstawne części: „ale”."
              tr: "Birbirine karşıt iki bölümü bağlar: “ama”."
              id: "Menghubungkan dua klausa yang berlawanan: “tetapi”."
              vi: "Nối hai vế đối lập: “nhưng”."
            ex: ["にほんごはむずかしい", { target: "ですが" }, "、おもしろいです。"]
            tr: { en: "Japanese is difficult, but interesting.", uk: "Японська складна, але цікава.", es: "El japonés es difícil, pero interesante.", pt: "O japonês é difícil, mas interessante.", fr: "Le japonais est difficile, mais intéressant.", de: "Japanisch ist schwierig, aber interessant.", it: "Il giapponese è difficile, ma interessante.", pl: "Japoński jest trudny, ale ciekawy.", tr: "Japonca zor ama ilginç.", id: "Bahasa Jepang sulit, tetapi menarik.", vi: "Tiếng Nhật khó nhưng thú vị." }
          - level: "A1"
            word: { term: "けど" }
            use:
              en: "The same “but” in conversation."
              uk: "Те саме «але» в розмові."
              es: "El mismo «pero» en la conversación."
              pt: "O mesmo «mas» na conversa."
              fr: "Le même « mais » en conversation."
              de: "Dasselbe „aber“ im Gespräch."
              it: "Lo stesso «ma» nella conversazione."
              pl: "To samo „ale” w rozmowie."
              tr: "Sohbette aynı “ama”."
              id: "“Tetapi” yang sama dalam percakapan."
              vi: "Cũng là “nhưng”, dùng trong hội thoại."
            ex: ["このカレーはおいしい", { target: "ですけど" }, "、からいです。"]
            tr: { en: "This curry is delicious, but it's spicy.", uk: "Це каррі смачне, але гостре.", es: "Este curry está rico, pero es picante.", pt: "Este curry é gostoso, mas é picante.", fr: "Ce curry est délicieux, mais il est épicé.", de: "Dieses Curry schmeckt gut, aber es ist scharf.", it: "Questo curry è buono, ma è piccante.", pl: "To curry jest pyszne, ale ostre.", tr: "Bu köri lezzetli ama acı.", id: "Kari ini enak, tetapi pedas.", vi: "Món cà ri này ngon nhưng cay." }
          - level: "A1"
            word: { term: "て" }
            use:
              en: ["Joins actions in order. See ", { link: "The て-Form", to: ja.verbs.te-form }, "."]
              uk: ["Зв’язує дії за порядком. Див. ", { link: "て-форма", to: ja.verbs.te-form }, "."]
              es: ["Une acciones en orden. Véase ", { link: "La forma て", to: "ja.verbs.te-form" }, "."]
              pt: ["Liga ações em ordem. Veja ", { link: "A forma て", to: "ja.verbs.te-form" }, "."]
              fr: ["Relie des actions dans l’ordre. Voir ", { link: "La forme en て", to: "ja.verbs.te-form" }, "."]
              de: ["Verbindet Handlungen in der Reihenfolge. Siehe ", { link: "Die て-Form", to: "ja.verbs.te-form" }, "."]
              it: ["Collega azioni in ordine. Vedi ", { link: "La forma in て", to: "ja.verbs.te-form" }, "."]
              pl: ["Łączy czynności po kolei. Zob. ", { link: "Forma て", to: "ja.verbs.te-form" }, "."]
              tr: ["Eylemleri sırayla bağlar. Bkz. ", { link: "て biçimi", to: "ja.verbs.te-form" }, "."]
              id: ["Menghubungkan tindakan secara berurutan. Lihat ", { link: "Bentuk て", to: "ja.verbs.te-form" }, "."]
              vi: ["Nối các hành động theo thứ tự. Xem ", { link: "Thể て", to: "ja.verbs.te-form" }, "."]
            ex: ["テレビを", { kanji: "見", reading: "み" }, { target: "て" }, "、ねます。"]
            tr: { en: "I watch TV and then go to bed.", uk: "Я дивлюся телевізор і лягаю спати.", es: "Veo la tele y me acuesto.", pt: "Vejo TV e vou dormir.", fr: "Je regarde la télé, puis je me couche.", de: "Ich sehe fern und gehe dann schlafen.", it: "Guardo la TV e poi vado a letto.", pl: "Oglądam telewizję i idę spać.", tr: "Televizyon izler, sonra yatarım.", id: "Saya menonton TV, lalu tidur.", vi: "Tôi xem ti vi rồi đi ngủ." }
  - title:
      en: "Typical errors"
      uk: "Типові помилки"
      es: "Errores frecuentes"
      pt: "Erros comuns"
      fr: "Erreurs fréquentes"
      de: "Typische Fehler"
      it: "Errori frequenti"
      pl: "Typowe błędy"
      tr: "Sık yapılan hatalar"
      id: "Kesalahan umum"
      vi: "Lỗi thường gặp"
    role: "errors"
    content:
      - type: "errors"
        rows:
          - level: "A1"
            wrong: [{ kanji: "私", reading: "わたし" }, "そしてアンナさんは", { kanji: "学生", reading: "がくせい" }, "です。"]
            right: [{ kanji: "私", reading: "わたし" }, { target: "と" }, "アンナさんは", { kanji: "学生", reading: "がくせい" }, "です。"]
            rule:
              en: [{ term: "そして" }, " joins sentences; between nouns the particle ", { term: "と" }, " stands. See ", { link: "Particles と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              uk: [{ term: "そして" }, " зв’язує речення; між іменниками стоїть частка ", { term: "と" }, ". Див. ", { link: "Частки と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              es: [{ term: "そして" }, " une oraciones; entre sustantivos va la partícula ", { term: "と" }, ". Véase ", { link: "Las partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              pt: [{ term: "そして" }, " liga frases; entre substantivos vai a partícula ", { term: "と" }, ". Veja ", { link: "As partículas と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              fr: [{ term: "そして" }, " relie des phrases ; entre des noms se met la particule ", { term: "と" }, ". Voir ", { link: "Les particules と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              de: [{ term: "そして" }, " verbindet Sätze; zwischen Nomen steht die Partikel ", { term: "と" }, ". Siehe ", { link: "Die Partikeln と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              it: [{ term: "そして" }, " collega frasi; tra i nomi va la particella ", { term: "と" }, ". Vedi ", { link: "Le particelle と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              pl: [{ term: "そして" }, " łączy zdania; między rzeczownikami stoi partykuła ", { term: "と" }, ". Zob. ", { link: "Partykuły と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              tr: [{ term: "そして" }, " cümleleri bağlar; isimler arasında ", { term: "と" }, " edatı durur. Bkz. ", { link: "と, も, の edatları", to: "ja.sentence-basics.particles-to-mo-no" }]
              id: [{ term: "そして" }, " menghubungkan kalimat; di antara kata benda dipakai partikel ", { term: "と" }, ". Lihat ", { link: "Partikel と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
              vi: [{ term: "そして" }, " nối câu; giữa các danh từ dùng trợ từ ", { term: "と" }, ". Xem ", { link: "Trợ từ と, も, の", to: "ja.sentence-basics.particles-to-mo-no" }]
          - level: "A1"
            wrong: [{ kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みますから、あついです。"]
            right: ["あついです", { target: "から" }, "、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
            rule:
              en: [{ term: "から" }, " follows the reason, not the result; with the clauses swapped, the meaning reverses"]
              uk: [{ term: "から" }, " стоїть після причини, а не наслідку; якщо поміняти частини місцями, зміниться зміст"]
              es: [{ term: "から" }, " sigue a la razón, no al resultado; con las partes cambiadas, el sentido se invierte"]
              pt: [{ term: "から" }, " vem depois da razão, não do resultado; com as partes trocadas, o sentido se inverte"]
              fr: [{ term: "から" }, " suit la raison, non le résultat ; si l’on échange les parties, le sens s’inverse"]
              de: [{ term: "から" }, " steht hinter dem Grund, nicht hinter dem Ergebnis; vertauscht man die Teile, kehrt sich der Sinn um"]
              it: [{ term: "から" }, " segue la ragione, non il risultato; scambiando le parti, il senso si inverte"]
              pl: [{ term: "から" }, " stoi po przyczynie, nie po skutku; po zamianie części sens się odwraca"]
              tr: [{ term: "から" }, " sonuçtan değil nedenden sonra gelir; bölümler yer değiştirirse anlam tersine döner"]
              id: [{ term: "から" }, " mengikuti alasan, bukan hasil; jika klausa ditukar, artinya terbalik"]
              vi: [{ term: "から" }, " đứng sau lý do, không phải sau kết quả; đảo hai vế thì nghĩa bị ngược lại"]
          - level: "A2"
            wrong: ["あついです。から、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
            right: ["あついです。", { target: "だから" }, "、", { kanji: "水", reading: "みず" }, "を", { kanji: "飲", reading: "の" }, "みます。"]
            rule:
              en: [{ term: "から" }, " cannot start a sentence; the sentence-opening word is ", { term: "だから" }]
              uk: [{ term: "から" }, " не може починати речення; на початку речення стоїть ", { term: "だから" }]
              es: [{ term: "から" }, " no puede abrir una oración; la palabra que abre es ", { term: "だから" }]
              pt: [{ term: "から" }, " não pode abrir uma frase; a palavra que abre a frase é ", { term: "だから" }]
              fr: [{ term: "から" }, " ne peut pas ouvrir une phrase ; le mot d’ouverture est ", { term: "だから" }]
              de: [{ term: "から" }, " kann keinen Satz eröffnen; am Satzanfang steht ", { term: "だから" }]
              it: [{ term: "から" }, " non può aprire una frase; la parola d’apertura è ", { term: "だから" }]
              pl: [{ term: "から" }, " nie może otwierać zdania; na początku zdania stoi ", { term: "だから" }]
              tr: [{ term: "から" }, " cümleyi başlatamaz; cümle başında ", { term: "だから" }, " kullanılır"]
              id: [{ term: "から" }, " tidak dapat membuka kalimat; kata pembuka kalimat adalah ", { term: "だから" }]
              vi: [{ term: "から" }, " không thể mở đầu câu; từ mở đầu câu là ", { term: "だから" }]
