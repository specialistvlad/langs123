      id: "Katakana dan tabelnya"
      vi: "Katakana và bảng chữ"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: ["Katakana has the same 46 sounds as ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", in the same table."]
              uk: ["Катакана має ті самі 46 звуків, що й ", { link: "Хірагана", to: "ja.foundations.hiragana" }, ", у тій самій таблиці."]
              es: ["El katakana tiene los mismos 46 sonidos que el ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", en la misma tabla."]
              pt: ["O katakana tem os mesmos 46 sons do ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", na mesma tabela."]
              fr: ["Les katakana ont les mêmes 46 sons que les ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", dans le même tableau."]
              de: ["Das Katakana hat dieselben 46 Laute wie das ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", in derselben Tabelle."]
              it: ["Il katakana ha gli stessi 46 suoni dell'", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", nella stessa tabella."]
              pl: ["Katakana ma te same 46 dźwięków co ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", w tej samej tabeli."]
              tr: ["Katakana, ", { link: "Hiragana", to: "ja.foundations.hiragana" }, " ile aynı 46 sese ve aynı tabloya sahiptir."]
              id: ["Katakana punya 46 bunyi yang sama dengan ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", dalam tabel yang sama."]
              vi: ["Katakana có cùng 46 âm với ", { link: "Hiragana", to: "ja.foundations.hiragana" }, ", trong cùng một bảng."]
            ex: [{ alternatives: [{ target: "ア" }, { target: "イ" }, { target: "ウ" }, { target: "エ" }, { target: "オ" }] }, " ", { sound: "a, i, u, e, o" }]
          - type: "rule"
            level: "A0"
            text:
              en: ["Each katakana has a hiragana twin with its sound: ", { term: "ア" }, " and ", { term: "あ" }, ", ", { term: "カ" }, " and ", { term: "か" }, "."]
              uk: ["Кожна катакана має хіраганного двійника з тим самим звуком: ", { term: "ア" }, " і ", { term: "あ" }, ", ", { term: "カ" }, " і ", { term: "か" }, "."]
              es: ["Cada katakana tiene un gemelo hiragana con el mismo sonido: ", { term: "ア" }, " y ", { term: "あ" }, ", ", { term: "カ" }, " y ", { term: "か" }, "."]
              pt: ["Cada katakana tem um gêmeo hiragana com o mesmo som: ", { term: "ア" }, " e ", { term: "あ" }, ", ", { term: "カ" }, " e ", { term: "か" }, "."]
              fr: ["Chaque katakana a un jumeau hiragana de même son : ", { term: "ア" }, " et ", { term: "あ" }, ", ", { term: "カ" }, " et ", { term: "か" }, "."]
              de: ["Jedes Katakana hat einen Hiragana-Zwilling mit demselben Laut: ", { term: "ア" }, " und ", { term: "あ" }, ", ", { term: "カ" }, " und ", { term: "か" }, "."]
              it: ["Ogni katakana ha un gemello hiragana con lo stesso suono: ", { term: "ア" }, " e ", { term: "あ" }, ", ", { term: "カ" }, " e ", { term: "か" }, "."]
              pl: ["Każda katakana ma bliźniaka w hiraganie o tym samym dźwięku: ", { term: "ア" }, " i ", { term: "あ" }, ", ", { term: "カ" }, " i ", { term: "か" }, "."]
              tr: ["Her katakananın aynı sesi taşıyan bir hiragana ikizi vardır: ", { term: "ア" }, " ile ", { term: "あ" }, ", ", { term: "カ" }, " ile ", { term: "か" }, "."]
              id: ["Setiap katakana punya kembar hiragana dengan bunyi sama: ", { term: "ア" }, " dan ", { term: "あ" }, ", ", { term: "カ" }, " dan ", { term: "か" }, "."]
              vi: ["Mỗi katakana có một chữ hiragana song sinh cùng âm: ", { term: "ア" }, " và ", { term: "あ" }, ", ", { term: "カ" }, " và ", { term: "か" }, "."]
          - type: "rule"
            level: "A0"
            text:
              en: "Katakana strokes are straight and angular."
              uk: "Штрихи катакани прямі й кутасті."
              es: "Los trazos del katakana son rectos y angulosos."
              pt: "Os traços do katakana são retos e angulosos."
              fr: "Les traits des katakana sont droits et anguleux."
              de: "Katakana-Striche sind gerade und eckig."
              it: "I tratti del katakana sono dritti e angolosi."
              pl: "Kreski katakany są proste i kanciaste."
              tr: "Katakananın çizgileri düz ve köşelidir."
              id: "Goresan katakana lurus dan bersudut."
              vi: "Nét của katakana thẳng và có góc cạnh."
          - type: "rule"
            level: "A0"
            text:
