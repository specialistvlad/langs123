summary:
  lead:
    en: "The 46 katakana for loanwords, foreign names and emphasis, the long-vowel mark ー and combinations such as ティ and ファ."
    uk: "Катакана: 46 знаків для запозичень, іноземних імен і наголошення, знак довгого голосного ー та сполучення на кшталт ティ і ファ."
    es: "Los 46 katakana para préstamos, nombres extranjeros y énfasis, la marca de vocal larga ー y combinaciones como ティ y ファ."
    pt: "Os 46 katakana para empréstimos, nomes estrangeiros e ênfase, a marca de vogal longa ー e combinações como ティ e ファ."
    fr: "Les 46 katakana pour les emprunts, les noms étrangers et l’emphase, le signe de voyelle longue ー et des combinaisons comme ティ et ファ."
    de: "Die 46 Katakana für Lehnwörter, fremde Namen und Hervorhebung, das Längenzeichen ー und Kombinationen wie ティ und ファ."
    it: "I 46 katakana per i prestiti, i nomi stranieri e l'enfasi, il segno di vocale lunga ー e combinazioni come ティ e ファ."
    pl: "Katakana: 46 znaków dla zapożyczeń, obcych imion i podkreślenia, znak długiej samogłoski ー oraz połączenia takie jak ティ i ファ."
    tr: "Alıntı sözcükler, yabancı adlar ve vurgu için 46 katakana, uzun ünlü işareti ー ve ティ, ファ gibi birleşimler."
    id: "Katakana: 46 kana untuk kata serapan, nama asing, dan penekanan, tanda vokal panjang ー, dan gabungan seperti ティ dan ファ."
    vi: "Katakana gồm 46 chữ cho từ mượn, tên nước ngoài và nhấn mạnh, dấu nguyên âm dài ー và các tổ hợp như ティ, ファ."
  rule:
    en: ["The mark ", { term: "ー" }, " lengthens the vowel before it:"]
    uk: ["Знак ", { term: "ー" }, " подовжує голосний перед собою:"]
    es: ["La marca ", { term: "ー" }, " alarga la vocal que la precede:"]
    pt: ["A marca ", { term: "ー" }, " alonga a vogal que a precede:"]
    fr: ["Le signe ", { term: "ー" }, " allonge la voyelle qui le précède :"]
    de: ["Das Zeichen ", { term: "ー" }, " dehnt den Vokal davor:"]
    it: ["Il segno ", { term: "ー" }, " allunga la vocale che lo precede:"]
    pl: ["Znak ", { term: "ー" }, " wydłuża samogłoskę przed sobą:"]
    tr: ["Uzun ünlü işareti ", { term: "ー" }, ", kendinden önceki ünlüyü uzatır:"]
    id: ["Tanda ", { term: "ー" }, " memanjangkan vokal di depannya:"]
    vi: ["Dấu ", { term: "ー" }, " kéo dài nguyên âm đứng trước nó:"]
  ex: { examples: [["ケ", { target: "ー" }, "キ ", { sound: "kēki" }], ["コ", { target: "ー" }, "ヒ", { target: "ー" }, " ", { sound: "kōhī" }]] }
