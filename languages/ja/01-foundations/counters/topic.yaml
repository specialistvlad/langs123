summary:
  lead:
    en: ["A counter follows a number by kind of thing: ", { term: { kanji: "人", reading: "にん" } }, " people, ", { term: { kanji: "枚", reading: "まい" } }, " flat things, ", { term: { kanji: "本", reading: "ほん" } }, " long things."]
    uk: ["Лічильне слово стоїть після числа залежно від виду речей: ", { term: { kanji: "人", reading: "にん" } }, " — люди, ", { term: { kanji: "枚", reading: "まい" } }, " — пласкі, ", { term: { kanji: "本", reading: "ほん" } }, " — довгі."]
    es: ["El contador sigue al número según el tipo de cosa: ", { term: { kanji: "人", reading: "にん" } }, " personas, ", { term: { kanji: "枚", reading: "まい" } }, " planas, ", { term: { kanji: "本", reading: "ほん" } }, " largas."]
    pt: ["O contador segue o número conforme o tipo de coisa: ", { term: { kanji: "人", reading: "にん" } }, " pessoas, ", { term: { kanji: "枚", reading: "まい" } }, " planas, ", { term: { kanji: "本", reading: "ほん" } }, " compridas."]
    fr: ["Le compteur suit le nombre selon le type d’objet : ", { term: { kanji: "人", reading: "にん" } }, " personnes, ", { term: { kanji: "枚", reading: "まい" } }, " plats, ", { term: { kanji: "本", reading: "ほん" } }, " longs."]
    de: ["Das Zählwort folgt der Zahl je nach Art der Dinge: ", { term: { kanji: "人", reading: "にん" } }, " Personen, ", { term: { kanji: "枚", reading: "まい" } }, " flache, ", { term: { kanji: "本", reading: "ほん" } }, " lange."]
    it: ["Il contatore segue il numero secondo il tipo di cosa: ", { term: { kanji: "人", reading: "にん" } }, " persone, ", { term: { kanji: "枚", reading: "まい" } }, " piatte, ", { term: { kanji: "本", reading: "ほん" } }, " lunghe."]
    pl: ["Licznik stoi po liczbie zależnie od rodzaju rzeczy: ", { term: { kanji: "人", reading: "にん" } }, " osoby, ", { term: { kanji: "枚", reading: "まい" } }, " płaskie, ", { term: { kanji: "本", reading: "ほん" } }, " długie."]
    tr: ["Sayaç, nesnenin türüne göre sayının ardından gelir: ", { term: { kanji: "人", reading: "にん" } }, " kişiler, ", { term: { kanji: "枚", reading: "まい" } }, " düz, ", { term: { kanji: "本", reading: "ほん" } }, " uzun nesneler."]
    id: ["Kata bantu bilangan mengikuti angka menurut jenis benda: ", { term: { kanji: "人", reading: "にん" } }, " orang, ", { term: { kanji: "枚", reading: "まい" } }, " benda pipih, ", { term: { kanji: "本", reading: "ほん" } }, " benda panjang."]
    vi: ["Lượng từ đứng sau số theo loại vật: ", { term: { kanji: "人", reading: "にん" } }, " người, ", { term: { kanji: "枚", reading: "まい" } }, " vật phẳng, ", { term: { kanji: "本", reading: "ほん" } }, " vật dài."]
  rule:
    en: "Number and counter stand after the noun and its particle:"
    uk: "Число з лічильним словом стоїть після іменника та частки:"
    es: "Número y contador van tras el sustantivo y su partícula:"
    pt: "Número e contador vêm depois do substantivo e da partícula:"
    fr: "Nombre et compteur suivent le nom et sa particule :"
    de: "Zahl und Zählwort stehen nach Nomen und Partikel:"
    it: "Numero e contatore stanno dopo il nome e la particella:"
    pl: "Liczba z licznikiem stoi po rzeczowniku i partykule:"
    tr: "Sayı ve sayaç, isim ile edatın ardından gelir:"
    id: "Angka dan kata bantu bilangan berada setelah kata benda dan partikel:"
    vi: "Số và lượng từ đứng sau danh từ và trợ từ:"
  ex: ["りんごを", { target: [{ kanji: "三", reading: "みっ" }, "つ"] }, "ください。"]
