sections:
  - title:
      en: "Overview"
      uk: "Огляд"
      es: "Visión general"
      pt: "Visão geral"
      fr: "Vue d’ensemble"
      de: "Überblick"
      it: "Panoramica"
      pl: "Przegląd"
      tr: "Genel bakış"
      id: "Gambaran umum"
      vi: "Tổng quan"
    role: "overview"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: "A counter stands right after a number and names the kind of thing counted."
              uk: "Лічильне слово стоїть одразу після числа й називає вид речей, які лічать."
              es: "El contador va justo tras el número e indica el tipo de cosa que se cuenta."
              pt: "O contador vem logo depois do número e indica o tipo de coisa contada."
              fr: "Le compteur suit directement le nombre et indique le type de chose comptée."
              de: "Das Zählwort steht direkt nach der Zahl und nennt die Art der gezählten Dinge."
              it: "Il contatore segue subito il numero e indica il tipo di cosa contata."
              pl: "Licznik stoi zaraz po liczbie i określa rodzaj liczonych rzeczy."
              tr: "Sayaç, sayının hemen ardından gelir ve sayılan şeyin türünü belirtir."
              id: "Kata bantu bilangan berada tepat setelah angka dan menyebut jenis benda yang dihitung."
              vi: "Lượng từ đứng ngay sau số và cho biết loại vật được đếm."
            ex: { examples: [[{ kanji: "三", reading: "さん" }, { target: { kanji: "人", reading: "にん" } }], [{ kanji: "三", reading: "さん" }, { target: { kanji: "枚", reading: "まい" } }], [{ kanji: "三", reading: "さん" }, { target: { kanji: "本", reading: "ほん" } }]] }
            tr: { en: { examples: ["three people", "three sheets of paper", "three pens"] }, uk: { examples: ["троє людей", "три аркуші паперу", "три ручки"] }, es: { examples: ["tres personas", "tres hojas de papel", "tres bolígrafos"] }, pt: { examples: ["três pessoas", "três folhas de papel", "três canetas"] }, fr: { examples: ["trois personnes", "trois feuilles de papier", "trois stylos"] }, de: { examples: ["drei Personen", "drei Blatt Papier", "drei Stifte"] }, it: { examples: ["tre persone", "tre fogli di carta", "tre penne"] }, pl: { examples: ["trzy osoby", "trzy kartki papieru", "trzy długopisy"] }, tr: { examples: ["üç kişi", "üç sayfa kâğıt", "üç kalem"] }, id: { examples: ["tiga orang", "tiga lembar kertas", "tiga pulpen"] }, vi: { examples: ["ba người", "ba tờ giấy", "ba cây bút"] } }
          - type: "rule"
            level: "A1"
            text:
              en: "The noun and its particle come first, then the number with its counter, then the verb."
              uk: "Спершу йдуть іменник із часткою, потім число з лічильним словом, потім дієслово."
              es: "Primero van el sustantivo y su partícula, luego el número con su contador y al final el verbo."
              pt: "Primeiro vêm o substantivo e a partícula, depois o número com o contador e por fim o verbo."
              fr: "Le nom et sa particule viennent d’abord, puis le nombre avec son compteur, puis le verbe."
              de: "Zuerst stehen das Nomen mit seiner Partikel, dann die Zahl mit dem Zählwort, dann das Verb."
              it: "Prima vengono il nome e la sua particella, poi il numero con il contatore, infine il verbo."
              pl: "Najpierw stoją rzeczownik z partykułą, potem liczba z licznikiem, na końcu czasownik."
              tr: "Önce isim ve edatı, sonra sayı ile sayaç, en sonda fiil gelir."
              id: "Kata benda dan partikelnya datang lebih dulu, lalu angka dengan kata bantu bilangan, lalu kata kerja."
              vi: "Danh từ và trợ từ đứng trước, rồi đến số kèm lượng từ, cuối cùng là động từ."
            ex: ["りんごを", { target: [{ kanji: "三", reading: "みっ" }, "つ"] }, { kanji: "買", reading: "か" }, "います。"]
            tr: { en: "I buy three apples.", uk: "Я купую три яблука.", es: "Compro tres manzanas.", pt: "Compro três maçãs.", fr: "J’achète trois pommes.", de: "Ich kaufe drei Äpfel.", it: "Compro tre mele.", pl: "Kupuję trzy jabłka.", tr: "Üç elma alıyorum.", id: "Saya membeli tiga apel.", vi: "Tôi mua ba quả táo." }
          - type: "note"
            level: "A1"
            text:
              en: ["The numbers themselves: see ", { link: "Numbers", to: "ja.foundations.numbers" }, "."]
              uk: ["Самі числа: див. ", { link: "Числа", to: "ja.foundations.numbers" }, "."]
              es: ["Los números en sí: véase ", { link: "Los números", to: "ja.foundations.numbers" }, "."]
              pt: ["Os números em si: veja ", { link: "Números", to: ja.foundations.numbers }, "."]
              fr: ["Les nombres eux-mêmes : voir ", { link: "Nombres", to: ja.foundations.numbers }, "."]
              de: ["Die Zahlen selbst: siehe ", { link: "Zahlen", to: "ja.foundations.numbers" }, "."]
              it: ["I numeri stessi: vedi ", { link: "Numeri", to: ja.foundations.numbers }, "."]
              pl: ["Same liczby: zob. ", { link: "Liczebniki", to: "ja.foundations.numbers" }, "."]
              tr: ["Sayıların kendisi: bkz. ", { link: "Sayılar", to: "ja.foundations.numbers" }, "."]
              id: ["Angkanya sendiri: lihat ", { link: "Angka", to: "ja.foundations.numbers" }, "."]
              vi: ["Bản thân các số: xem ", { link: "Số", to: "ja.foundations.numbers" }, "."]
  - title:
      en: "Counting things: ひとつ to とお"
      uk: "Лічба предметів: від ひとつ до とお"
      es: "Contar cosas: de ひとつ a とお"
      pt: "Contar coisas: de ひとつ a とお"
      fr: "Compter les objets : de ひとつ à とお"
      de: "Dinge zählen: ひとつ bis とお"
      it: "Contare le cose: da ひとつ a とお"
      pl: "Liczenie rzeczy: od ひとつ do とお"
      tr: "Nesneleri sayma: ひとつ’dan とお’ya"
      id: "Menghitung benda: ひとつ sampai とお"
      vi: "Đếm đồ vật: từ ひとつ đến とお"
    role: "own"
    content:
      - type: "inventory"
        set: "numbers"
        columns:
          - { key: "number", label: { en: "Number", uk: "Число", es: "Número", pt: "Número", fr: "Nombre", de: "Zahl", it: "Numero", pl: "Liczba", tr: "Sayı", id: "Angka", vi: "Số" } }
          - { key: "word", label: { en: "Word", uk: "Слово", es: "Palabra", pt: "Palavra", fr: "Mot", de: "Wort", it: "Parola", pl: "Słowo", tr: "Sözcük", id: "Kata", vi: "Từ" } }
        rows:
          - { level: "A1", value: 1, number: "1", word: "ひとつ" }
          - { level: "A1", value: 2, number: "2", word: "ふたつ" }
          - { level: "A1", value: 3, number: "3", word: "みっつ" }
          - { level: "A1", value: 4, number: "4", word: "よっつ" }
          - { level: "A1", value: 5, number: "5", word: "いつつ" }
          - { level: "A1", value: 6, number: "6", word: "むっつ" }
          - { level: "A1", value: 7, number: "7", word: "ななつ" }
          - { level: "A1", value: 8, number: "8", word: "やっつ" }
          - { level: "A1", value: 9, number: "9", word: "ここのつ" }
          - { level: "A1", value: 10, number: "10", word: "とお" }
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "ひとつ" }, " to ", { term: "とお" }, " count anything without a counter of its own, up to ten."]
              uk: [{ term: "ひとつ" }, " — ", { term: "とお" }, " лічать усе, що не має власного лічильного слова, до десяти."]
              es: [{ term: "ひとつ" }, " a ", { term: "とお" }, " cuentan cualquier cosa sin contador propio, hasta diez."]
              pt: [{ term: "ひとつ" }, " a ", { term: "とお" }, " contam qualquer coisa sem contador próprio, até dez."]
              fr: [{ term: "ひとつ" }, " à ", { term: "とお" }, " comptent tout ce qui n’a pas de compteur propre, jusqu’à dix."]
              de: [{ term: "ひとつ" }, " bis ", { term: "とお" }, " zählen alles ohne eigenes Zählwort, bis zehn."]
              it: ["Da ", { term: "ひとつ" }, " a ", { term: "とお" }, " si conta tutto ciò che non ha un contatore proprio, fino a dieci."]
              pl: [{ term: "ひとつ" }, " do ", { term: "とお" }, " liczą wszystko, co nie ma własnego licznika, do dziesięciu."]
              tr: [{ term: "ひとつ" }, " ile ", { term: "とお" }, " arası, kendi sayacı olmayan her şeyi ona kadar sayar."]
              id: [{ term: "ひとつ" }, " sampai ", { term: "とお" }, " menghitung apa saja yang tidak punya kata bantu bilangan sendiri, sampai sepuluh."]
              vi: [{ term: "ひとつ" }, " đến ", { term: "とお" }, " dùng để đếm mọi thứ không có lượng từ riêng, đến mười."]
            ex: ["ケーキを", { target: "ふたつ" }, "ください。"]
            tr: { en: "Two cakes, please.", uk: "Два тістечка, будь ласка.", es: "Dos pasteles, por favor.", pt: "Dois bolos, por favor.", fr: "Deux gâteaux, s’il vous plaît.", de: "Zwei Stück Kuchen, bitte.", it: "Due dolci, per favore.", pl: "Poproszę dwa ciastka.", tr: "İki pasta, lütfen.", id: "Dua kue, tolong.", vi: "Cho tôi hai cái bánh." }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: "とお" }, " has no ", { term: "つ" }, "; from 11, the plain number takes a counter such as ", { term: { kanji: "個", reading: "こ" } }, "."]
              uk: ["У ", { term: "とお" }, " немає ", { term: "つ" }, "; від 11 до звичайного числа додають лічильне слово, наприклад ", { term: { kanji: "個", reading: "こ" } }, "."]
