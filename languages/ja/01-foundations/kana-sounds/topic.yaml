              id: ["Vokal pendek dan panjang membentuk kata berbeda: ", { term: "おばさん" }, " berarti “bibi”, ", { term: "おばあさん" }, " berarti “nenek”."]
              vi: ["Nguyên âm ngắn và dài tạo từ khác nhau: ", { term: "おばさん" }, " là “dì, cô”, ", { term: "おばあさん" }, " là “bà”."]
            ex: { examples: [["おばさん ", { sound: "obasan" }, " ", { ipa: "obasaɴ" }], ["おばあさん ", { sound: "obāsan" }, " ", { ipa: "obaːsaɴ" }]] }
            tr: { en: { examples: ["aunt", "grandmother"] }, uk: { examples: ["тітка", "бабуся"] }, es: { examples: ["tía", "abuela"] }, pt: { examples: ["tia", "avó"] }, fr: { examples: ["tante", "grand-mère"] }, de: { examples: ["Tante", "Großmutter"] }, it: { examples: ["zia", "nonna"] }, pl: { examples: ["ciotka", "babcia"] }, tr: { examples: ["teyze", "büyükanne"] }, id: { examples: ["bibi", "nenek"] }, vi: { examples: ["dì, cô", "bà"] } }
          - type: "rule"
            level: "A0"
            text:
              en: ["Katakana writes the long vowel with ", { term: "ー" }, ", see ", { link: "Katakana", to: "ja.foundations.katakana" }, "."]
