              fr: ["Quelques mots s’écrivent avec ", { term: "ええ" }, " et ", { term: "おお" }, ", comme ", { term: "おねえさん" }, " et ", { term: "おおきい" }, "."]
              de: ["Einige Wörter schreibt man mit ", { term: "ええ" }, " und ", { term: "おお" }, ", etwa ", { term: "おねえさん" }, " und ", { term: "おおきい" }, "."]
