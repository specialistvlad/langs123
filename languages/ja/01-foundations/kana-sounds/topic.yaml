summary:
  lead:
    en: "Dakuten and handakuten, contracted sounds like きゃ, the small っ, long vowels and ん: the sounds the basic table gains."
    uk: "Дакутен і хандакутен, стягнені звуки на кшталт きゃ, мале っ, довгі голосні та ん: звуки, які додаються до основної таблиці."
    es: "Dakuten y handakuten, sonidos contraídos como きゃ, la っ pequeña, las vocales largas y ん: los sonidos que se suman a la tabla básica."
    pt: "Dakuten e handakuten, sons contraídos como きゃ, o っ pequeno, as vogais longas e ん: os sons que se somam à tabela básica."
    fr: "Dakuten et handakuten, sons contractés comme きゃ, petit っ, voyelles longues et ん : les sons qui s’ajoutent au tableau de base."
    de: "Dakuten und Handakuten, kontrahierte Laute wie きゃ, das kleine っ, lange Vokale und ん: die Laute, die zur Grundtabelle hinzukommen."
    it: "Dakuten e handakuten, suoni contratti come きゃ, la っ piccola, le vocali lunghe e ん: i suoni che si aggiungono alla tabella di base."
    pl: "Dakuten i handakuten, dźwięki zbitkowe jak きゃ, małe っ, długie samogłoski i ん: dźwięki dodawane do podstawowej tabeli."
    tr: "Dakuten ve handakuten, きゃ gibi birleşik sesler, küçük っ, uzun ünlüler ve ん: temel tabloya eklenen sesler."
    id: "Dakuten dan handakuten, bunyi kontraksi seperti きゃ, っ kecil, vokal panjang, dan ん: bunyi tambahan di luar tabel dasar."
    vi: "Dakuten và handakuten, âm ghép như きゃ, っ nhỏ, nguyên âm dài và ん: các âm bổ sung cho bảng cơ bản."
  rule:
    en: ["A small ", { term: "っ" }, " doubles the next consonant, and a small ", { term: "ゃ" }, " joins the kana before it:"]
    uk: ["Мале ", { term: "っ" }, " подвоює наступну приголосну, а мале ", { term: "ゃ" }, " зливається з кана перед собою:"]
    es: ["Una ", { term: "っ" }, " pequeña duplica la consonante siguiente, y una ", { term: "ゃ" }, " pequeña se une al kana anterior:"]
    pt: ["Um ", { term: "っ" }, " pequeno duplica a consoante seguinte, e um ", { term: "ゃ" }, " pequeno se junta ao kana anterior:"]
    fr: ["Un petit ", { term: "っ" }, " double la consonne suivante, et un petit ", { term: "ゃ" }, " s’unit au kana précédent :"]
    de: ["Ein kleines ", { term: "っ" }, " verdoppelt den folgenden Konsonanten, und ein kleines ", { term: "ゃ" }, " verbindet sich mit dem Kana davor:"]
    it: ["Una ", { term: "っ" }, " piccola raddoppia la consonante seguente, e una ", { term: "ゃ" }, " piccola si unisce al kana precedente:"]
    pl: ["Małe ", { term: "っ" }, " podwaja następną spółgłoskę, a małe ", { term: "ゃ" }, " łączy się z poprzednim kana:"]
    tr: ["Küçük ", { term: "っ" }, " sonraki ünsüzü ikiler, küçük ", { term: "ゃ" }, " ise önündeki kana ile birleşir:"]
    id: [{ term: "っ" }, " kecil menggandakan konsonan berikutnya, dan ", { term: "ゃ" }, " kecil bergabung dengan kana di depannya:"]
    vi: [{ term: "っ" }, " nhỏ nhân đôi phụ âm sau nó, còn ", { term: "ゃ" }, " nhỏ ghép với kana đứng trước:"]
  ex: { examples: [["き", { target: "っ" }, "て ", { sound: "kitte" }], [{ target: "きゃ" }, "く ", { sound: "kyaku" }]] }
