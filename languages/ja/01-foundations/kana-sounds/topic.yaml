  - title:
      en: "Long vowels"
      uk: "Довгі голосні"
      es: "Vocales largas"
      pt: "Vogais longas"
      fr: "Voyelles longues"
      de: "Lange Vokale"
      it: "Vocali lunghe"
      pl: "Długie samogłoski"
      tr: "Uzun ünlüler"
      id: "Vokal panjang"
      vi: "Nguyên âm dài"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A0"
            text:
              en: "A long vowel lasts two morae: the kana of the vowel is followed by a vowel kana."
              uk: "Довгий голосний триває дві мори: за кана голосного йде голосна кана."
              es: "Una vocal larga dura dos moras: tras el kana de la vocal sigue un kana vocálico."
              pt: "Uma vogal longa dura duas moras: depois do kana da vogal vem um kana vocálico."
              fr: "Une voyelle longue dure deux mores : le kana de la voyelle est suivi d’un kana vocalique."
              de: "Ein langer Vokal dauert zwei Moren: Auf das Kana des Vokals folgt ein Vokal-Kana."
              it: "Una vocale lunga dura due more: dopo il kana della vocale segue un kana vocalico."
              pl: "Długa samogłoska trwa dwie mory: po kana samogłoski następuje kana samogłoskowe."
              tr: "Uzun ünlü iki mora sürer: ünlünün kanasından sonra bir ünlü kana gelir."
              id: "Vokal panjang berlangsung dua mora: kana vokal diikuti kana vokal lain."
              vi: "Nguyên âm dài kéo dài hai mora: sau kana của nguyên âm có thêm một kana nguyên âm."
          - type: "rule"
            level: "A0"
            text:
              en: [{ term: "あ" }, ", ", { term: "い" }, " and ", { term: "う" }, " repeat their vowel; ", { term: "え" }, " adds ", { term: "い" }, ", and ", { term: "お" }, " adds ", { term: "う" }, "."]
              uk: [{ term: "あ" }, ", ", { term: "い" }, " і ", { term: "う" }, " повторюють свій голосний; ", { term: "え" }, " додає ", { term: "い" }, ", а ", { term: "お" }, " — ", { term: "う" }, "."]
              es: [{ term: "あ" }, ", ", { term: "い" }, " y ", { term: "う" }, " repiten su vocal; ", { term: "え" }, " añade ", { term: "い" }, ", y ", { term: "お" }, " añade ", { term: "う" }, "."]
              pt: [{ term: "あ" }, ", ", { term: "い" }, " e ", { term: "う" }, " repetem a vogal; ", { term: "え" }, " acrescenta ", { term: "い" }, ", e ", { term: "お" }, " acrescenta ", { term: "う" }, "."]
              fr: [{ term: "あ" }, ", ", { term: "い" }, " et ", { term: "う" }, " répètent leur voyelle ; ", { term: "え" }, " ajoute ", { term: "い" }, ", et ", { term: "お" }, " ajoute ", { term: "う" }, "."]
              de: [{ term: "あ" }, ", ", { term: "い" }, " und ", { term: "う" }, " wiederholen ihren Vokal; ", { term: "え" }, " fügt ", { term: "い" }, " an, ", { term: "お" }, " fügt ", { term: "う" }, " an."]
              it: [{ term: "あ" }, ", ", { term: "い" }, " e ", { term: "う" }, " ripetono la loro vocale; ", { term: "え" }, " aggiunge ", { term: "い" }, ", e ", { term: "お" }, " aggiunge ", { term: "う" }, "."]
              pl: [{ term: "あ" }, ", ", { term: "い" }, " i ", { term: "う" }, " powtarzają swoją samogłoskę; ", { term: "え" }, " dodaje ", { term: "い" }, ", a ", { term: "お" }, " dodaje ", { term: "う" }, "."]
              tr: [{ term: "あ" }, ", ", { term: "い" }, " ve ", { term: "う" }, " kendi ünlülerini yineler; ", { term: "え" }, " ", { term: "い" }, ", ", { term: "お" }, " ise ", { term: "う" }, " ekler."]
              id: [{ term: "あ" }, ", ", { term: "い" }, ", dan ", { term: "う" }, " mengulang vokalnya; ", { term: "え" }, " menambah ", { term: "い" }, ", dan ", { term: "お" }, " menambah ", { term: "う" }, "."]
              vi: [{ term: "あ" }, ", ", { term: "い" }, " và ", { term: "う" }, " lặp lại nguyên âm của mình; ", { term: "え" }, " thêm ", { term: "い" }, ", còn ", { term: "お" }, " thêm ", { term: "う" }, "."]
          - type: "rule"
            level: "A0"
            text:
              en: ["A few words write ", { term: "ええ" }, " and ", { term: "おお" }, ", such as ", { term: "おねえさん" }, " and ", { term: "おおきい" }, "."]
              uk: ["Кілька слів пишуться з ", { term: "ええ" }, " та ", { term: "おお" }, ", як-от ", { term: "おねえさん" }, " і ", { term: "おおきい" }, "."]
