              de: ["Ein kurzer und ein langer Vokal ergeben verschiedene Wörter: ", { term: "おばさん" }, " ist „Tante“, ", { term: "おばあさん" }, " ist „Großmutter“."]
              it: ["Una vocale breve e una lunga danno parole diverse: ", { term: "おばさん" }, " è «zia», ", { term: "おばあさん" }, " è «nonna»."]
