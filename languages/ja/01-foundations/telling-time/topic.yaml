          - type: "rule"
            level: "A0"
            text:
              en: ["Four, seven and nine take the readings ", { term: "よ" }, ", ", { term: "しち" }, " and ", { term: "く" }, ": ", { term: "よじ" }, ", ", { term: "しちじ" }, ", ", { term: "くじ" }, "."]
