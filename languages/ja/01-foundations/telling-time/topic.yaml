            tr: { en: { examples: ["four o'clock", "seven o'clock", "nine o'clock"] }, uk: { examples: ["четверта година", "сьома година", "дев’ята година"] }, es: { examples: ["las cuatro", "las siete", "las nueve"] }, pt: { examples: ["quatro horas", "sete horas", "nove horas"] }, fr: { examples: ["quatre heures", "sept heures", "neuf heures"] }, de: { examples: ["vier Uhr", "sieben Uhr", "neun Uhr"] }, it: { examples: ["le quattro", "le sette", "le nove"] }, pl: { examples: ["czwarta", "siódma", "dziewiąta"] }, tr: { examples: ["saat dört", "saat yedi", "saat dokuz"] }, id: { examples: ["jam empat", "jam tujuh", "jam sembilan"] }, vi: { examples: ["bốn giờ", "bảy giờ", "chín giờ"] } }
          - type: "rule"
            level: "A1"
            text:
              en: ["In writing the number is a kanji or a digit before ", { term: { kanji: "時", reading: "じ" } }, "."]
              uk: ["На письмі число — це кандзі або цифра перед ", { term: { kanji: "時", reading: "じ" } }, "."]
              es: ["Por escrito, el número es un kanji o una cifra antes de ", { term: { kanji: "時", reading: "じ" } }, "."]
              pt: ["Por escrito, o número é um kanji ou um algarismo antes de ", { term: { kanji: "時", reading: "じ" } }, "."]
              fr: ["À l’écrit, le nombre est un kanji ou un chiffre placé avant ", { term: { kanji: "時", reading: "じ" } }, "."]
              de: ["Geschrieben ist die Zahl ein Kanji oder eine Ziffer vor ", { term: { kanji: "時", reading: "じ" } }, "."]
              it: ["Per iscritto il numero è un kanji o una cifra prima di ", { term: { kanji: "時", reading: "じ" } }, "."]
              pl: ["W piśmie liczba to kanji lub cyfra przed ", { term: { kanji: "時", reading: "じ" } }, "."]
              tr: ["Yazıda sayı, ", { term: { kanji: "時", reading: "じ" } }, " sözcüğünden önce bir kanji ya da rakamdır."]
              id: ["Dalam tulisan, angkanya berupa kanji atau angka sebelum ", { term: { kanji: "時", reading: "じ" } }, "."]
              vi: ["Khi viết, số là chữ kanji hoặc chữ số đứng trước ", { term: { kanji: "時", reading: "じ" } }, "."]
            ex: { examples: [{ time: { target: { kanji: "三時", reading: "さんじ" } }, value: "03:00" }, { time: { target: { kanji: "十二時", reading: "じゅうにじ" } }, value: "12:00" }, { time: { target: ["3", { kanji: "時", reading: "じ" }] }, value: "03:00" }] }
            tr: { en: { examples: ["three o'clock", "twelve o'clock", "three o'clock"] }, uk: { examples: ["третя година", "дванадцята година", "третя година"] }, es: { examples: ["las tres", "las doce", "las tres"] }, pt: { examples: ["três horas", "doze horas", "três horas"] }, fr: { examples: ["trois heures", "douze heures", "trois heures"] }, de: { examples: ["drei Uhr", "zwölf Uhr", "drei Uhr"] }, it: { examples: ["le tre", "le dodici", "le tre"] }, pl: { examples: ["trzecia", "dwunasta", "trzecia"] }, tr: { examples: ["saat üç", "saat on iki", "saat üç"] }, id: { examples: ["jam tiga", "jam dua belas", "jam tiga"] }, vi: { examples: ["ba giờ", "mười hai giờ", "ba giờ"] } }
