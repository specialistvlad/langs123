  - title:
      en: "Half past, a.m. and p.m."
      uk: "Пів години, до й після полудня"
      es: "Y media, mañana y tarde"
      pt: "E meia, manhã e tarde"
      fr: "Et demie, matin et après-midi"
      de: "Halb, vormittags und nachmittags"
      it: "E mezza, mattina e pomeriggio"
      pl: "Wpół, przed i po południu"
      tr: "Buçuk, öğleden önce ve sonra"
      id: "Setengah, pagi dan siang"
      vi: "Rưỡi, sáng và chiều"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["Half past is ", { term: { kanji: "半", reading: "はん" } }, " after the hour: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " is 3:30. The hour keeps its own number."]
              uk: ["Пів години — це ", { term: { kanji: "半", reading: "はん" } }, " після години: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " — 3:30. Година зберігає власне число."]
              es: ["La media hora es ", { term: { kanji: "半", reading: "はん" } }, " tras la hora: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " son las 3:30. La hora conserva su propio número."]
              pt: ["A meia hora é ", { term: { kanji: "半", reading: "はん" } }, " depois da hora: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " são 3h30. A hora mantém o seu próprio número."]
              fr: ["La demie est ", { term: { kanji: "半", reading: "はん" } }, " après l’heure : ", { term: { kanji: "三時半", reading: "さんじはん" } }, " est 3 h 30. L’heure garde son propre nombre."]
              de: ["Die halbe Stunde ist ", { term: { kanji: "半", reading: "はん" } }, " nach der Stunde: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " ist 3:30 Uhr. Die Stunde behält ihre eigene Zahl."]
              it: ["La mezz'ora è ", { term: { kanji: "半", reading: "はん" } }, " dopo l'ora: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " sono le 3:30. L'ora mantiene il proprio numero."]
              pl: ["Pół godziny to ", { term: { kanji: "半", reading: "はん" } }, " po godzinie: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " to 3:30. Godzina zachowuje własną liczbę."]
              tr: ["Buçuk, saatten sonra gelen ", { term: { kanji: "半", reading: "はん" } }, " ile söylenir: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " 3:30’dur. Saat kendi sayısını korur."]
              id: ["Setengah jam adalah ", { term: { kanji: "半", reading: "はん" } }, " sesudah jam: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " adalah 3.30. Jam tetap memakai angkanya sendiri."]
              vi: ["Rưỡi giờ là ", { term: { kanji: "半", reading: "はん" } }, " đứng sau giờ: ", { term: { kanji: "三時半", reading: "さんじはん" } }, " là 3 giờ 30. Giờ giữ nguyên số của nó."]
            ex: { examples: [{ time: [{ kanji: "三時", reading: "さんじ" }, { target: { kanji: "半", reading: "はん" } }], value: "03:30" }, { time: [{ kanji: "十二時", reading: "じゅうにじ" }, { target: { kanji: "半", reading: "はん" } }], value: "12:30" }] }
            tr: { en: { examples: ["3:30", "12:30"] }, uk: { examples: ["3:30", "12:30"] }, es: { examples: ["3:30", "12:30"] }, pt: { examples: ["3h30", "12h30"] }, fr: { examples: ["3 h 30", "12 h 30"] }, de: { examples: ["3:30 Uhr", "12:30 Uhr"] }, it: { examples: ["3:30", "12:30"] }, pl: { examples: ["3:30", "12:30"] }, tr: { examples: ["3:30", "12:30"] }, id: { examples: ["3.30", "12.30"] }, vi: { examples: ["3 giờ 30 phút", "12 giờ 30 phút"] } }
          - type: "rule"
            level: "A1"
            text:
              en: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (morning, before noon) and ", { term: { kanji: "午後", reading: "ごご" } }, " (afternoon, after noon) come before the time."]
              uk: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (до полудня) і ", { term: { kanji: "午後", reading: "ごご" } }, " (після полудня) стоять перед часом."]
              es: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (antes del mediodía) y ", { term: { kanji: "午後", reading: "ごご" } }, " (después del mediodía) van antes de la hora."]
              pt: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (antes do meio-dia) e ", { term: { kanji: "午後", reading: "ごご" } }, " (depois do meio-dia) vêm antes da hora."]
              fr: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (avant midi) et ", { term: { kanji: "午後", reading: "ごご" } }, " (après midi) se placent avant l’heure."]
              de: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (vor Mittag) und ", { term: { kanji: "午後", reading: "ごご" } }, " (nach Mittag) stehen vor der Uhrzeit."]
              it: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (prima di mezzogiorno) e ", { term: { kanji: "午後", reading: "ごご" } }, " (dopo mezzogiorno) vanno prima dell'ora."]
              pl: [{ term: { kanji: "午前", reading: "ごぜん" } }, " (przed południem) i ", { term: { kanji: "午後", reading: "ごご" } }, " (po południu) stoją przed godziną."]
