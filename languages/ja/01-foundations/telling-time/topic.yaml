              fr: ["Quatre, sept et neuf prennent les lectures ", { term: "よ" }, ", ", { term: "しち" }, " et ", { term: "く" }, " : ", { term: "よじ" }, ", ", { term: "しちじ" }, ", ", { term: "くじ" }, "."]
