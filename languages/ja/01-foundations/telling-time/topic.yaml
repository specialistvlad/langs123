            text:
              en: ["The last number decides: ", { term: "ふん" }, " after 2, 5, 7 and 9, ", { term: "ぷん" }, " after 1, 3, 4, 6, 8 and 0, with a small ", { term: "っ" }, " after 1, 6, 8 and 10."]
