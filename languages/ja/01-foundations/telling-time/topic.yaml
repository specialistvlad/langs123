              tr: ["Dört, yedi ve dokuz ", { term: "よ" }, ", ", { term: "しち" }, " ve ", { term: "く" }, " okunuşlarını alır: ", { term: "よじ" }, ", ", { term: "しちじ" }, ", ", { term: "くじ" }, "."]
              id: ["Empat, tujuh, dan sembilan memakai bacaan ", { term: "よ" }, ", ", { term: "しち" }, ", dan ", { term: "く" }, ": ", { term: "よじ" }, ", ", { term: "しちじ" }, ", ", { term: "くじ" }, "."]
