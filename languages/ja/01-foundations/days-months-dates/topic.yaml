summary:
  lead:
    en: "The days of the week, the months and the days of the month, how a date is put in order and how to say today, tomorrow and yesterday."
    uk: "Дні тижня, місяці й числа місяця, порядок запису дати та слова «сьогодні», «завтра», «вчора»."
    es: "Los días de la semana, los meses y los días del mes, el orden de una fecha y cómo decir hoy, mañana y ayer."
    pt: "Os dias da semana, os meses e os dias do mês, a ordem de uma data e como dizer hoje, amanhã e ontem."
    fr: "Les jours de la semaine, les mois et les jours du mois, l’ordre d’une date et comment dire aujourd’hui, demain et hier."
    de: "Die Wochentage, die Monate und die Tage des Monats, die Reihenfolge eines Datums und wie man heute, morgen und gestern sagt."
    it: "I giorni della settimana, i mesi e i giorni del mese, l'ordine di una data e come dire oggi, domani e ieri."
    pl: "Dni tygodnia, miesiące i dni miesiąca, kolejność zapisu daty oraz jak powiedzieć dzisiaj, jutro i wczoraj."
    tr: "Haftanın günleri, aylar ve ayın günleri, bir tarihin sıralanışı; bugün, yarın ve dün nasıl söylenir."
    id: "Nama hari, bulan, dan tanggal, urutan penulisan tanggal, serta cara mengatakan hari ini, besok, dan kemarin."
    vi: "Các thứ trong tuần, các tháng và các ngày trong tháng, thứ tự của một ngày tháng và cách nói hôm nay, ngày mai, hôm qua."
  rule:
    en: "A date runs from the larger unit to the smaller, month then day:"
    uk: "Дата йде від більшої одиниці до меншої: спершу місяць, потім день:"
    es: "Una fecha va de la unidad mayor a la menor, primero el mes y luego el día:"
    pt: "Uma data vai da unidade maior para a menor, primeiro o mês e depois o dia:"
    fr: "Une date va de l’unité la plus grande à la plus petite, d’abord le mois, puis le jour :"
    de: "Ein Datum geht von der größeren zur kleineren Einheit, erst der Monat, dann der Tag:"
    it: "Una data va dall'unità più grande alla più piccola, prima il mese e poi il giorno:"
    pl: "Data biegnie od większej jednostki do mniejszej, najpierw miesiąc, potem dzień:"
    tr: "Tarih büyük birimden küçüğe doğru gider, önce ay, sonra gün:"
    id: "Tanggal berjalan dari satuan besar ke kecil, bulan dulu, lalu hari:"
    vi: "Ngày tháng đi từ đơn vị lớn đến nhỏ, tháng trước rồi đến ngày:"
  ex: { target: [{ kanji: "七月", reading: "しちがつ" }, { kanji: "三日", reading: "みっか" }] }
