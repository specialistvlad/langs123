              de: ["Ab dem 11. ist der Tag seine Zahl plus ", { term: "にち" }, "; der 17. und der 19. nehmen ", { term: "しち" }, " und ", { term: "く" }, "."]
              it: ["Dall'11 in poi il giorno è il suo numero più ", { term: "にち" }, "; il 17 e il 19 prendono ", { term: "しち" }, " e ", { term: "く" }, "."]
              pl: ["Od 11. dzień to jego numer plus ", { term: "にち" }, "; 17. i 19. mają ", { term: "しち" }, " i ", { term: "く" }, "."]
              tr: ["11’inci günden sonra gün, sayısı ve ", { term: "にち" }, " ile söylenir; 17 ve 19 için ", { term: "しち" }, " ve ", { term: "く" }, " kullanılır."]
              id: ["Mulai tanggal 11, tanggal adalah angkanya ditambah ", { term: "にち" }, "; tanggal 17 dan 19 memakai ", { term: "しち" }, " dan ", { term: "く" }, "."]
              vi: ["Từ ngày 11, ngày là số cộng với ", { term: "にち" }, "; ngày 17 và 19 dùng ", { term: "しち" }, " và ", { term: "く" }, "."]
            ex: { examples: [{ date: [{ kanji: "七月", reading: "しちがつ" }, { target: { kanji: "十一日", reading: "じゅういちにち" } }], value: "--07-11" }, { date: [{ kanji: "七月", reading: "しちがつ" }, { target: { kanji: "十七日", reading: "じゅうしちにち" } }], value: "--07-17" }, { date: [{ kanji: "七月", reading: "しちがつ" }, { target: { kanji: "二十九日", reading: "にじゅうくにち" } }], value: "--07-29" }] }
            tr: { en: { examples: ["11 July", "17 July", "29 July"] }, uk: { examples: ["11 липня", "17 липня", "29 липня"] }, es: { examples: ["11 de julio", "17 de julio", "29 de julio"] }, pt: { examples: ["11 de julho", "17 de julho", "29 de julho"] }, fr: { examples: ["11 juillet", "17 juillet", "29 juillet"] }, de: { examples: ["11. Juli", "17. Juli", "29. Juli"] }, it: { examples: ["11 luglio", "17 luglio", "29 luglio"] }, pl: { examples: ["11 lipca", "17 lipca", "29 lipca"] }, tr: { examples: ["11 Temmuz", "17 Temmuz", "29 Temmuz"] }, id: { examples: ["11 Juli", "17 Juli", "29 Juli"] }, vi: { examples: ["ngày 11 tháng 7", "ngày 17 tháng 7", "ngày 29 tháng 7"] } }
          - type: "note"
            level: "A1"
            text:
              en: ["The words for the 2nd to the 10th also count days: ", { term: { kanji: "二日", reading: "ふつか" } }, " is the 2nd or two days. One day is ", { term: { kanji: "一日", reading: "いちにち" } }, ". See ", { link: "Counters", to: "ja.foundations.counters" }, "."]
              uk: ["Слова для 2–10 числа лічать і дні: ", { term: { kanji: "二日", reading: "ふつか" } }, " — це 2-ге число або два дні. Один день — ", { term: { kanji: "一日", reading: "いちにち" } }, ". Див. ", { link: "Лічильні слова", to: "ja.foundations.counters" }, "."]
              es: ["Las palabras del 2 al 10 también cuentan días: ", { term: { kanji: "二日", reading: "ふつか" } }, " es el día 2 o dos días. Un día es ", { term: { kanji: "一日", reading: "いちにち" } }, ". Véase ", { link: "Los contadores", to: "ja.foundations.counters" }, "."]
              pt: ["As palavras do dia 2 ao 10 também contam dias: ", { term: { kanji: "二日", reading: "ふつか" } }, " é o dia 2 ou dois dias. Um dia é ", { term: { kanji: "一日", reading: "いちにち" } }, ". Veja ", { link: "Contadores", to: ja.foundations.counters }, "."]
              fr: ["Les mots du 2 au 10 comptent aussi les jours : ", { term: { kanji: "二日", reading: "ふつか" } }, " est le 2 ou deux jours. Un jour se dit ", { term: { kanji: "一日", reading: "いちにち" } }, ". Voir ", { link: "Les compteurs", to: "ja.foundations.counters" }, "."]
              de: ["Die Wörter für den 2. bis 10. zählen auch Tage: ", { term: { kanji: "二日", reading: "ふつか" } }, " ist der 2. oder zwei Tage. Ein Tag ist ", { term: { kanji: "一日", reading: "いちにち" } }, ". Siehe ", { link: "Zählwörter", to: "ja.foundations.counters" }, "."]
              it: ["Le parole dal 2 al 10 contano anche i giorni: ", { term: { kanji: "二日", reading: "ふつか" } }, " è il 2 oppure due giorni. Un giorno è ", { term: { kanji: "一日", reading: "いちにち" } }, ". Vedi ", { link: "I contatori", to: "ja.foundations.counters" }, "."]
              pl: ["Słowa od 2. do 10. liczą też dni: ", { term: { kanji: "二日", reading: "ふつか" } }, " to 2. dzień miesiąca albo dwa dni. Jeden dzień to ", { term: { kanji: "一日", reading: "いちにち" } }, ". Zob. ", { link: "Liczniki", to: "ja.foundations.counters" }, "."]
              tr: ["2’den 10’a kadar olan sözcükler gün de sayar: ", { term: { kanji: "二日", reading: "ふつか" } }, " ayın ikisi ya da iki gündür. Bir gün ", { term: { kanji: "一日", reading: "いちにち" } }, " olur. Bkz. ", { link: "Sayaçlar", to: "ja.foundations.counters" }, "."]
              id: ["Kata untuk tanggal 2 sampai 10 juga menghitung hari: ", { term: { kanji: "二日", reading: "ふつか" } }, " berarti tanggal 2 atau dua hari. Satu hari adalah ", { term: { kanji: "一日", reading: "いちにち" } }, ". Lihat ", { link: "Kata bantu bilangan", to: "ja.foundations.counters" }, "."]
              vi: ["Các từ chỉ ngày 2 đến 10 cũng dùng để đếm ngày: ", { term: { kanji: "二日", reading: "ふつか" } }, " là ngày 2 hoặc hai ngày. Một ngày là ", { term: { kanji: "一日", reading: "いちにち" } }, ". Xem ", { link: "Lượng từ", to: "ja.foundations.counters" }, "."]
            ex: [{ kanji: "二日", reading: "ふつか" }, "かかります。"]
            tr: { en: "It takes two days.", uk: "Це займає два дні.", es: "Tarda dos días.", pt: "Leva dois dias.", fr: "Cela prend deux jours.", de: "Das dauert zwei Tage.", it: "Ci vogliono due giorni.", pl: "To zajmuje dwa dni.", tr: "İki gün sürer.", id: "Butuh dua hari.", vi: "Mất hai ngày." }
  - title:
      en: "Years and the order of a date"
      uk: "Роки й порядок дати"
      es: "Los años y el orden de la fecha"
      pt: "Os anos e a ordem da data"
      fr: "Les années et l’ordre de la date"
      de: "Jahre und die Reihenfolge des Datums"
      it: "Gli anni e l'ordine della data"
      pl: "Lata i kolejność daty"
      tr: "Yıllar ve tarihin sırası"
      id: "Tahun dan urutan tanggal"
      vi: "Năm và thứ tự của ngày tháng"
    role: "own"
    content:
      - type: "list"
        items:
          - type: "rule"
            level: "A1"
            text:
              en: ["A date runs from the largest unit to the smallest: year ", { term: "年" }, ", month ", { term: "月" }, ", day ", { term: "日" }, "."]
              uk: ["Дата йде від найбільшої одиниці до найменшої: рік ", { term: "年" }, ", місяць ", { term: "月" }, ", день ", { term: "日" }, "."]
              es: ["Una fecha va de la unidad mayor a la menor: año ", { term: "年" }, ", mes ", { term: "月" }, ", día ", { term: "日" }, "."]
              pt: ["Uma data vai da maior unidade para a menor: ano ", { term: "年" }, ", mês ", { term: "月" }, ", dia ", { term: "日" }, "."]
              fr: ["Une date va de la plus grande unité à la plus petite : année ", { term: "年" }, ", mois ", { term: "月" }, ", jour ", { term: "日" }, "."]
              de: ["Ein Datum geht von der größten zur kleinsten Einheit: Jahr ", { term: "年" }, ", Monat ", { term: "月" }, ", Tag ", { term: "日" }, "."]
              it: ["Una data va dall'unità più grande alla più piccola: anno ", { term: "年" }, ", mese ", { term: "月" }, ", giorno ", { term: "日" }, "."]
              pl: ["Data biegnie od największej jednostki do najmniejszej: rok ", { term: "年" }, ", miesiąc ", { term: "月" }, ", dzień ", { term: "日" }, "."]
              tr: ["Tarih en büyük birimden en küçüğe gider: yıl ", { term: "年" }, ", ay ", { term: "月" }, ", gün ", { term: "日" }, "."]
              id: ["Tanggal berjalan dari satuan terbesar ke terkecil: tahun ", { term: "年" }, ", bulan ", { term: "月" }, ", hari ", { term: "日" }, "."]
              vi: ["Ngày tháng đi từ đơn vị lớn nhất đến nhỏ nhất: năm ", { term: "年" }, ", tháng ", { term: "月" }, ", ngày ", { term: "日" }, "."]
            ex: { date: { target: [{ kanji: "二千二十六年", reading: "にせんにじゅうろくねん" }, { kanji: "七月", reading: "しちがつ" }, { kanji: "三日", reading: "みっか" }] }, value: "2026-07-03" }
            tr: { en: "3 July 2026", uk: "3 липня 2026 року", es: "3 de julio de 2026", pt: "3 de julho de 2026", fr: "3 juillet 2026", de: "3. Juli 2026", it: "3 luglio 2026", pl: "3 lipca 2026", tr: "3 Temmuz 2026", id: "3 Juli 2026", vi: "ngày 3 tháng 7 năm 2026" }
          - type: "rule"
            level: "A1"
            text:
              en: ["A year is a number plus ", { term: { kanji: "年", reading: "ねん" } }, ", read like any number."]
              uk: ["Рік — це число плюс ", { term: { kanji: "年", reading: "ねん" } }, ", і читається як будь-яке число."]
              es: ["El año es un número más ", { term: { kanji: "年", reading: "ねん" } }, " y se lee como cualquier número."]
              pt: ["O ano é um número mais ", { term: { kanji: "年", reading: "ねん" } }, " e se lê como qualquer número."]
              fr: ["L’année est un nombre suivi de ", { term: { kanji: "年", reading: "ねん" } }, " et se lit comme n’importe quel nombre."]
              de: ["Ein Jahr ist eine Zahl plus ", { term: { kanji: "年", reading: "ねん" } }, " und wird wie jede Zahl gelesen."]
              it: ["L'anno è un numero più ", { term: { kanji: "年", reading: "ねん" } }, " e si legge come qualsiasi numero."]
              pl: ["Rok to liczba plus ", { term: { kanji: "年", reading: "ねん" } }, " i czyta się go jak każdą liczbę."]
              tr: ["Yıl, sayı ve ", { term: { kanji: "年", reading: "ねん" } }, " ile söylenir; her sayı gibi okunur."]
              id: ["Tahun adalah angka ditambah ", { term: { kanji: "年", reading: "ねん" } }, " dan dibaca seperti angka biasa."]
              vi: ["Năm là một số cộng với ", { term: { kanji: "年", reading: "ねん" } }, " và đọc như mọi số khác."]
            ex: { examples: [{ date: { target: { kanji: "二千二十六年", reading: "にせんにじゅうろくねん" } }, value: "2026" }, { date: { target: { kanji: "千九百九十九年", reading: "せんきゅうひゃくきゅうじゅうくねん" } }, value: "1999" }] }
            tr: { en: { examples: ["2026", "1999"] }, uk: { examples: ["2026", "1999"] }, es: { examples: ["2026", "1999"] }, pt: { examples: ["2026", "1999"] }, fr: { examples: ["2026", "1999"] }, de: { examples: ["2026", "1999"] }, it: { examples: ["2026", "1999"] }, pl: { examples: ["2026", "1999"] }, tr: { examples: ["2026", "1999"] }, id: { examples: ["2026", "1999"] }, vi: { examples: ["2026", "1999"] } }
          - type: "note"
            level: "A1"
            text:
              en: ["Digits are common in writing: the kanji ", { term: "年" }, ", ", { term: "月" }, " and ", { term: "日" }, " follow them. See ", { link: "Numbers", to: "ja.foundations.numbers" }, "."]
              uk: ["На письмі часто вживають цифри: кандзі ", { term: "年" }, ", ", { term: "月" }, " і ", { term: "日" }, " стоять після них. Див. ", { link: "Числа", to: "ja.foundations.numbers" }, "."]
              es: ["En la escritura abundan las cifras: los kanji ", { term: "年" }, ", ", { term: "月" }, " y ", { term: "日" }, " van detrás. Véase ", { link: "Los números", to: "ja.foundations.numbers" }, "."]
              pt: ["Na escrita são comuns os algarismos: os kanji ", { term: "年" }, ", ", { term: "月" }, " e ", { term: "日" }, " vêm depois. Veja ", { link: "Números", to: ja.foundations.numbers }, "."]
              fr: ["À l’écrit, les chiffres sont courants : les kanji ", { term: "年" }, ", ", { term: "月" }, " et ", { term: "日" }, " les suivent. Voir ", { link: "Nombres", to: ja.foundations.numbers }, "."]
              de: ["Geschrieben sind Ziffern üblich: die Kanji ", { term: "年" }, ", ", { term: "月" }, " und ", { term: "日" }, " folgen ihnen. Siehe ", { link: "Zahlen", to: "ja.foundations.numbers" }, "."]
              it: ["Nella scrittura le cifre sono comuni: i kanji ", { term: "年" }, ", ", { term: "月" }, " e ", { term: "日" }, " le seguono. Vedi ", { link: "Numeri", to: ja.foundations.numbers }, "."]
              pl: ["W piśmie często używa się cyfr: kanji ", { term: "年" }, ", ", { term: "月" }, " i ", { term: "日" }, " idą po nich. Zob. ", { link: "Liczebniki", to: "ja.foundations.numbers" }, "."]
              tr: ["Yazıda rakamlar yaygındır: ", { term: "年" }, ", ", { term: "月" }, " ve ", { term: "日" }, " kanjileri rakamların ardından gelir. Bkz. ", { link: "Sayılar", to: "ja.foundations.numbers" }, "."]
              id: ["Dalam tulisan, angka sering dipakai: kanji ", { term: "年" }, ", ", { term: "月" }, ", dan ", { term: "日" }, " mengikutinya. Lihat ", { link: "Angka", to: "ja.foundations.numbers" }, "."]
              vi: ["Khi viết, chữ số rất phổ biến: các chữ kanji ", { term: "年" }, ", ", { term: "月" }, " và ", { term: "日" }, " đứng sau chúng. Xem ", { link: "Số", to: ja.foundations.numbers }, "."]
            ex: { date: { target: ["2026", { kanji: "年", reading: "ねん" }, "7", { kanji: "月", reading: "がつ" }, "3", { kanji: "日", reading: "にち" }] }, value: "2026-07-03" }
            tr: { en: "3 July 2026", uk: "3 липня 2026 року", es: "3 de julio de 2026", pt: "3 de julho de 2026", fr: "3 juillet 2026", de: "3. Juli 2026", it: "3 luglio 2026", pl: "3 lipca 2026", tr: "3 Temmuz 2026", id: "3 Juli 2026", vi: "ngày 3 tháng 7 năm 2026" }
          - type: "note"
            level: "A2"
            text:
              en: "Forms and official papers also count years by era: Reiwa 8 is 2026."
              uk: "У формах і офіційних паперах роки рахують і за ерами: Рейва 8 — це 2026 рік."
              es: "Los formularios y documentos oficiales también cuentan los años por eras: Reiwa 8 es 2026."
              pt: "Formulários e documentos oficiais também contam os anos por eras: Reiwa 8 é 2026."
              fr: "Les formulaires et les documents officiels comptent aussi les années par ère : Reiwa 8 est 2026."
              de: "Formulare und amtliche Papiere zählen die Jahre auch nach Ären: Reiwa 8 ist 2026."
              it: "Moduli e documenti ufficiali contano gli anni anche per ere: Reiwa 8 è il 2026."
              pl: "Formularze i dokumenty urzędowe liczą lata także według er: Reiwa 8 to rok 2026."
              tr: "Formlarda ve resmî belgelerde yıllar çağ adlarıyla da sayılır: Reiwa 8, 2026’dır."
              id: "Formulir dan dokumen resmi juga menghitung tahun menurut era: Reiwa 8 adalah tahun 2026."
              vi: "Biểu mẫu và giấy tờ chính thức còn tính năm theo niên hiệu: Reiwa 8 là năm 2026."
            ex: [{ date: { target: [{ kanji: "令和", reading: "れいわ" }, { kanji: "八年", reading: "はちねん" }] }, value: "2026" }, { kanji: "七月", reading: "しちがつ" }, { kanji: "三日", reading: "みっか" }]
            tr: { en: "3 July 2026", uk: "3 липня 2026 року", es: "3 de julio de 2026", pt: "3 de julho de 2026", fr: "3 juillet 2026", de: "3. Juli 2026", it: "3 luglio 2026", pl: "3 lipca 2026", tr: "3 Temmuz 2026", id: "3 Juli 2026", vi: "ngày 3 tháng 7 năm 2026" }
