            pl: [{ term: "に" }, " po dniu tygodnia, miesiącu i dacie; po ", { term: { kanji: "今日", reading: "きょう" } }, " i ", { term: { kanji: "来週", reading: "らいしゅう" } }, " go nie ma"]
            tr: [{ term: "に" }, " gün, ay ve tarihten sonra gelir; ", { term: { kanji: "今日", reading: "きょう" } }, " ve ", { term: { kanji: "来週", reading: "らいしゅう" } }, " sonrasında gelmez"]
            id: [{ term: "に" }, " setelah hari, bulan, atau tanggal; tidak setelah ", { term: { kanji: "今日", reading: "きょう" } }, " atau ", { term: { kanji: "来週", reading: "らいしゅう" } }]
            vi: [{ term: "に" }, " sau thứ, tháng, ngày; không dùng sau ", { term: { kanji: "今日", reading: "きょう" } }, " hay ", { term: { kanji: "来週", reading: "らいしゅう" } }]
          ex: ["テストは", { target: [{ kanji: "月曜日", reading: "げつようび" }, "に"] }, "あります。"]
          tr: { en: "The test is on Monday.", uk: "Тест у понеділок.", es: "El examen es el lunes.", pt: "A prova é na segunda-feira.", fr: "Le contrôle a lieu lundi.", de: "Der Test ist am Montag.", it: "Il test è lunedì.", pl: "Test jest w poniedziałek.", tr: "Sınav pazartesi günü.", id: "Ujiannya hari Senin.", vi: "Bài kiểm tra vào thứ hai." }
        - level: "A2"
          point:
            en: "Every, the day before yesterday"
            uk: "Кожен, позавчора"
            es: "Cada, anteayer"
            pt: "Todo, anteontem"
            fr: "Chaque, avant-hier"
            de: "Jeder, vorgestern"
            it: "Ogni, l'altroieri"
            pl: "Co, przedwczoraj"
            tr: "Her, evvelsi gün"
            id: "Setiap, kemarin lusa"
            vi: "Mỗi, hôm kia"
          rule:
            en: [{ term: { kanji: "毎", reading: "まい" } }, " + day, week, month, year; ", { term: "おととい" }, ", ", { term: "あさって" }]
            uk: [{ term: { kanji: "毎", reading: "まい" } }, " + день, тиждень, місяць, рік; ", { term: "おととい" }, ", ", { term: "あさって" }]
            es: [{ term: { kanji: "毎", reading: "まい" } }, " + día, semana, mes, año; ", { term: "おととい" }, ", ", { term: "あさって" }]
            pt: [{ term: { kanji: "毎", reading: "まい" } }, " + dia, semana, mês, ano; ", { term: "おととい" }, ", ", { term: "あさって" }]
            fr: [{ term: { kanji: "毎", reading: "まい" } }, " + jour, semaine, mois, année ; ", { term: "おととい" }, ", ", { term: "あさって" }]
            de: [{ term: { kanji: "毎", reading: "まい" } }, " + Tag, Woche, Monat, Jahr; ", { term: "おととい" }, ", ", { term: "あさって" }]
            it: [{ term: { kanji: "毎", reading: "まい" } }, " + giorno, settimana, mese, anno; ", { term: "おととい" }, ", ", { term: "あさって" }]
            pl: [{ term: { kanji: "毎", reading: "まい" } }, " + dzień, tydzień, miesiąc, rok; ", { term: "おととい" }, ", ", { term: "あさって" }]
            tr: [{ term: { kanji: "毎", reading: "まい" } }, " + gün, hafta, ay, yıl; ", { term: "おととい" }, ", ", { term: "あさって" }]
            id: [{ term: { kanji: "毎", reading: "まい" } }, " + hari, minggu, bulan, tahun; ", { term: "おととい" }, ", ", { term: "あさって" }]
            vi: [{ term: { kanji: "毎", reading: "まい" } }, " + ngày, tuần, tháng, năm; ", { term: "おととい" }, ", ", { term: "あさって" }]
          ex: [{ target: { kanji: "毎日", reading: "まいにち" } }, "、", { kanji: "日本語", reading: "にほんご" }, "を", { kanji: "勉強", reading: "べんきょう" }, "します。"]
          tr: { en: "I study Japanese every day.", uk: "Я щодня вивчаю японську.", es: "Estudio japonés todos los días.", pt: "Estudo japonês todos os dias.", fr: "J’étudie le japonais tous les jours.", de: "Ich lerne jeden Tag Japanisch.", it: "Studio giapponese ogni giorno.", pl: "Codziennie uczę się japońskiego.", tr: "Her gün Japonca çalışırım.", id: "Saya belajar bahasa Jepang setiap hari.", vi: "Ngày nào tôi cũng học tiếng Nhật." }
        - level: "A0"
          point: { en: "Trap", uk: "Пастка", es: "Trampa", pt: "Armadilha", fr: "Piège", de: "Falle", it: "Trappola", pl: "Pułapka", tr: "Tuzak", id: "Jebakan", vi: "Bẫy" }
